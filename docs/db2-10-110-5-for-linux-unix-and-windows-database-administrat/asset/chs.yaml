  \ |\n\n### 问题 49\n主备备 CF 服务器之间使用哪种同步机制？\n\n| ![images](img/circ.jpg) | A. | SYNC（同步）\
  \ |\n| ![images](img/circ.jpg) | B. | ASYNC（异步） |\n| ![images](img/circ.jpg) | C.\
  \ | NEARSYNC（近同步） |\n| ![images](img/circ.jpg) | D. | Duplexing（双工化） |\n\n### 问题\
  \ 50\n哪个命令无法启动相应的 pureScale 集群组件？\n\n| ![images](img/circ.jpg) | A. | `db2start\
  \ CF 129` |\n| ![images](img/circ.jpg) | B. | `db2start add CF 130` |\n| ![images](img/circ.jpg)\
  \ | C. | `db2start member 3` |\n| ![images](img/circ.jpg) | D. | `db2start member\
  \ 127` |\n\n# 答案\n\n### 问题 1\n正确答案是 **C.** 要启用日志文件镜像，只需将镜像日志位置（路径）的完全限定名称分配给 `mirrorlogpath`\
  \ 数据库配置参数。理想情况下，镜像日志路径应指向一个物理位置（磁盘），该位置不会产生大量的磁盘 I/O，并且与存储主日志文件的物理位置隔离开。\n\n###\
  \ 问题 2\n正确答案是 **D.** 当使用归档日志时，且归档日志文件没有从活动日志目录移动到另一个位置时，活动日志目录所在的磁盘可能会很快满。。，当发生这种情况时，事务将接收磁盘满错误并回滚。如果你将\
  \ `blk_log_dsk_ful` 数据库配置参数设置为 `YES`，那么当 DB2 数据库管理器尝试在活动日志目录中创建新日志文件时收到磁盘满错误，应用程序将挂起（而不是回滚当前事务）。（这为你提供了机会手动移动或删除文件以腾出更多空间。）DB2\
  \ 数据库管理器随后每隔五分钟尝试创建一次日志文件，直到成功——每次尝试后，都会向管理通知日志中写入一条消息。\n\n### 问题 3\n正确答案是 **A.**\
  \ 如果在重启过程中表空间容器出现问题，你可以使用 `DROP PENDING TABLESPACES ([TS_Name])` 选项将一个或多个表空间置于待删除（Drop\
  \ Pending）状态。这允许数据库成功重启，之后可以删除出现问题的表空间，并在必要时重新创建。如果数据库重启操作因表空间容器问题而失败，你可以在管理通知日志中找到问题的表空间名称列表。\n\
  \n### 问题 4\n正确答案是 **B.** 当事务发生故障时，所有部分完成且尚未外部化到数据库的事务所做的工作都会丢失。因此，数据库可能会处于不一致状态（因此将无法使用）。`Crash\
  \ recovery`（崩溃恢复）是将此类数据库恢复到一致且可用状态的过程。要执行崩溃恢复，你使用存储在事务日志文件中的信息来完成在事务故障发生时内存中（但尚未外部化到存储）的已提交事务，回滚任何未完成的事务，并从内存中清除任何未提交的事务。\n\
  \n### 问题 5\n正确答案是 **C.** `Recover` 实用根据恢复历史文件中找到的信息执行将数据库恢复到特定时间点所需的还原和重滚操作。你通过执行\
  \ `RECOVER DATABASE` 命令来调用 `Recovery` 实用。\n\n### 问题 6\n正确答案是 **D.** 当遇到无效的表空间容器时，你可以通过执行所谓的“重定向还原”（redirected\
  \ restore）在恢复过程开始时重新定义它们。你还可以使用重定向还原操作将备份映像还原到与源不同的目标机器，或将表空间数据存储在不同的物理位置。\n\n###\
  \ 问题 7\n正确答案是 **D.** 随着数据库大小增加，备份和恢复数据库所需的时间和硬件也会大幅增加。因此，在处理大型数据库时，创建全量备份映像并不总是最佳方法，因为多个此类备份映像的存储需求可能是巨大的。更好的替代方案是定期创建全量备份并更频繁地创建增量备份。增量备份是自上一次备份以来更新的页的备份。\n\
  \n### 问题 8\n正确答案是 **A.** 你使用 `BACKUP DATABASE` 命令的 `UTIL_IMPACT_PRIORITY` 选项指示对备份操作的执行进行节流，以便控制其对并发活动的影响。你可以为该参数分配一个\
  \ 1 到 100 之间的数值，100 代表最高优先级，1 代表最低。分配 `UTIL_IMPACT_PRIORITY` 值为 25 的备份操作将影响 25%\
  \ 的工作负载并需要更长时间完成；分配 `UTIL_IMPACT_PRIORITY` 值为 75 的备份操作将影响 75% 的工作负载并更快完成。\n\n###\
  \ 问题 9\n正确答案是 **B.** 当采用增量备份映像时，数据库恢复涉及使用最近的全量备份映像还原数据库，并应用之后产生的最新的增量备份映像。然而，当采用差异备份（delta\
  \ backup）时，数据库恢复涉及使用最近的全量备份映像还原数据库，并按创建顺序应用自使用的全量备份映像以来产生的每一个差异备份映像。\n\n### 问题 10\n\
  正确答案是 **B.** 重滚恢复（Roll-forward recovery）比版本恢复更进一步，它通过使用备份映像重建数据库或单个表空间，然后重放事务日志文件中存储的信息，将数据库或表空间恢复到精确时间点的状态。要执行重滚恢复操作，你必须启用归档日志，拥有数据库的全量备份映像，并且能够自全量备份映像以来创建的所有归档日志文件。\n\
  \n\n\n\n正确答案是 `A.` 在数据库保持在线的同时，可以对单个表空间执行前滚恢复（roll-forward recovery）操作。然而，在恢复数据库之前，必须先将其脱线。因此，可以在用户连接到数据库时时完成前滚恢复——但仅限于表空间级别。\n\
  \n### 问题 12\n正确答案是 `B.` `ROLLFORWARD DATABASE` 命令的 `OVERFLOW LOG PATH` 选项指定包含离线归档日志文件（包括\
  \ `S0000007.LOG`）的目录，这些文件将用于执行前滚操作。前滚实用程序会首先搜索活动日志目录，然后根据 `OVERFLOW LOG PATH` 选项指定的目录搜索执行前滚恢复操作所需的日志文件。\n\
  \n### 问题 13\n正确答案是 `B.` 如果你想从备份镜像中恢复表空间，且自备份镜像创建以来表空间的名称已发生更改，则你应通过其新名称来引用该表空间。表空间元数据存储在外部文件中，`DB2`\
  \ 使用存储在该文件中的信息来正确识别要恢复的表空间。\n\n### 问题 14\n正确答案是 `A.` 每当 `DB2` 数据库管理器检测到索引不再有效时，它会自动尝试重建索引。然而，`DB2`\
  \ 数据库管理器尝试重建无效索引的时间点是由数据库的 `INDEXREC` 参数或 `DB2` 数据库管理器配置文件控制的。\n\n### 问题 15\n正确答案是\
  \ `D.` 虽然你可以使用数据库或 `DB2` 数据库管理器配置文件中的 `indexrec` 参数来控制何时作为崩溃恢复操作的一部分重建索引，但这样做对前滚恢复操作期间索引的重建方式没有影响。要控制该行为，你必须为\
  \ `logindexbuild` 数据库配置参数分配适当的值。\n\n### 问题 16\n正确答案是 `A.` 在使用 `DB2` 数据库的分拆镜像拷贝（split\
  \ mirror copy）之前，必须先对其进行初始化。要初始化分割镜像数据库拷贝，请执行系统命令 `db2inidb`。\n\n### 问题 17\n正确答案是\
  \ `C.` 在确保作为主、备服务器的系统是相同的，且它们之间存在 TCP/IP 连接后，可以通过按照顺序执行以下任务来建立 `HADR` 环境：\n\n1.\
  \ 确定主数据库服务器和备数据库服务器的主机名、主机 IP 地址以及服务名或端口号。\n2. 通过恢复备份镜像或初始化将作为主数据库的数据库的分拆镜像拷贝来创建备数据库。\n\
  3. 在主数据库和备数据库上设置 `HADR` 配置参数。\n4. 连接到备用实例并在备数据库上启动 `HADR`。\n5. 连接到主实例并在主数据库上启动 `HADR`。\n\
  \n### 问题 18\n正确答案是 `B.` 主数据库和备数据库都必须是单分区数据库，且它们必须具有相同的数据库名称；但它们不需要存储在相同的数据库路径上。\n\
  \n### 问题 19\n正确答案是 `A.` 在 `HADR` 环境中针对主数据库执行的加载（Load）操作会对索引、表和表空间产生影响。\n\n### 问题\
  \ 20\n正确答案是 `C.` 由于加载操作不会记录在数据库的事务日志文件中，因此加载操作是否可以复制取决于加载数据的副本是否作为加载过程的一部分被保存（如果你指定了\
  \ `LOAD` 命令的 `COPY YES` 选项，则如此）。如果你在主数据库上执行加载操作并指定 `COPY YES` 选项，该命令将在主数据库上执行，数据将复制到备数据库——前提是备数据库可以通过\
  \ `LOAD` 命令提供的路径或设备访问所创建的加载数据副本。如果备数据库无法访问该数据，则存储该表的表空间在备数据库上被标记为无效，备数据库将停止重放与该表空间相关的日志记录。\n\
  \n### 问题 21\n正确答案是 `A.` 你可以使用 `DB2` 实例级注册表变量 `DB2_HADR_ROS` 在 `HADR` 备数据库上启用 `ROS`。涉及步骤如下：\n\
  \n**步骤 1：** 设置注册表变量。\n![Image](img/819-1.jpg)\n\n**步骤 2：** 取消备数据库。\n![Image](img/819-2.jpg)\n\
  \n**步骤 3：** 停止备数据库上的 `HADR`。\n![Image](img/819-3.jpg)\n\n**步骤 4：** 停止并启动备用 `DB2`\
  \ 实例。\n![Image](img/819-4.jpg)\n\n**步骤 5：** 在备数据库上启动 `HADR`。\n![Image](img/819-5.jpg)\n\
  \n### 问题 22\n正确答案是 `D.` `SUPERASYNC` 同步模式的事务响应时间最短，因为主事务提交不依赖于备用提交。与此同时，如果发生系统故障，`SUPERASYNC`\
  \ 极易导致数据丢失。表 7.5 列出了每个同步模式的详细信息。\n\n### 问题 23\n正确答案是 `C.` 要恢复 `HR.EMPLOYEE` 表，恢复相关的表空间总是比恢复整个数据库快。这在两个方面对你有帮助：除\
  \ `HR` 模式以外的用户不受影响，且表空间的恢复会更快。\n\n### 问题 24\n正确答案是 `C.` `DB2` pureScale 使用可靠集群技术\
  \ (RSCT) 和 Tivoli 自动化 (TSA) 构建，提供了心跳检测和自动客户端重定向功能。自动客户端重定向是 Data Server 功能，它可以将客户端连接从故障的\
  \ `DB2` 成员重定向到 pureScale 系统中的另一个 `DB2` 成员，以便应用程序能够以最小中断继续工作。此外，内置的自动负载均衡功能在 `DB2`\
  \ 成员之间平衡分配工作。\n\n### 问题 25\n正确答案是 `A.` 你使用 `db2haicu` 工具来配置和管理 `DB2` 集群环境。你使用 `lssam`、`db2instance–list`\
  \ 和 `db2cluster` 命令调查多平台自动的状态。\n\n### 问题 26\n正确答案是 `B.` 建议的方法是对一组特定的表空间进行数据库重建，而不是重建所有表空间。答案\
  \ `A` 是错误的，因为在 `REBUILD WITH ALL TABLESPACES` 选项无法指定特定的表空间。答案 `C` 和 `D` 将恢复镜像期间数据库已知的所有表空间。\n\
  \n### 问题 27\n正确答案是 `D.` 目前支持的 pureScale 文件系统只有 IBM 通用并行文件系统。\n\n### 问题 28\n正确答案是\
  \ `D.` `DB2` 成员内部没有 `WAITING_FOR_FAILOVER` 状态，因为在发生系统问题时故障是瞬时的。\n\n### 问题 29\n正确答案是\
  \ `C.` `CF` 内部没有 `BECOMING_SECONDARY` 状态。然而，存在 `BECOMING_PRIMARY` 状态，当 pureScale\
  \ 集群中没有其他主 `CF` 运行时，该 `CF` 将接管主 `CF` 角色。\n\n### 问题 30\n\n\n\n\n正确答案是 `C` 和 `D.`。整个数据库恢复操作需要对数据库建立独占连接，且不允许任何其他应用程序连接。在用户表空间恢复操作的情况下，在操作完成之前，该表空间对用户不可用。然而，如果恢复涉及系统目录表空间，则整个数据库将无法供应用程序连接。答案\
  \ A 错误，是因为大端字节（AIX）和小端字节（Linux）架构之间的字节顺序差异。答案 E 错误，是因为你可以成功地从 32 位系统恢复数据库到 64 位系统，但反之是不允许的。\n\
  \n## 第 31 \n\n正确答案是 `C.`。在读备（Read on Standby）HADR 数据库上支持的唯一隔离级别是未提交读取（UR）。任何除 UR\
  \ 以外的应用程序请求将收到错误代码 `SQL1773N` 1。DBA 可以通过设置 DB2 注册表变量 `DB2_STANDBY_ISO=UR` 在备库上强制执行\
  \ UR 隔离级别。当你将 `CUR_COMMIT` 数据库配置参数设置为 `ON` 时，所有查询将在提交查询时返回数据的已提交值。\n\n## 第 32 \n\
  \n正确答案是 `B` 和 `C.`。数据库表重组、索引重组或 DDL 更改活动会启动仅重放窗口（replay-only window），在此期间任何连接到活动备库的尝试都将收到错误代码\
  \ `SQL1776N` 4。你可以使用 `db2pd` 命令对此进行监控。\n\n示例：\n\n![Image](img/821.jpg)\n\n注意，`load`、`RUNSTATS`\
  \ 和数据库备份操作不会启动仅重放窗口。活动备库不支持批量数据库插入和 DDL 更改，因此 D 和 E 是错误答案。\n\n## 第 33 \n\n正确答案是\
  \ `D.`。辅助备库（auxiliary standby）支持的唯一同步模式是 `SUPERASYNC`。你可以在表 7.6 中查看支持的模式。\n\n##\
  \ 第 34 \n\n正确答案是 `B.`。HADR 多备库功能仅支持一个主备库。其余信息可在表 7.6 中找到。\n\n## 第 35 \n\n正确答案是 `A`。ROS\
  \ HADR 数据库上支持的唯一隔离级别是未提交读取（UR）。任何除 UR 以外的应用程序请求将收到错误代码 `SQL1773N` 1。DBA 可以通过设置 DB2\
  \ 注册表变量 `DB2_STANDBY_ISO=UR` 在备库上强制执行 UR 隔离级别。注册表设置 `B2_HADR_ROS` 用于启用 ROS。注册表设置\
  \ `DB2_HADR_NO_IP_CHECK` 用于网络地址翻译。当你将 `CUR_COMMIT` 数据库配置参数设置为 `ON` 时，所有查询将在提交查询时返回数据的已提交值。\n\
  \n## 第 36 \n\n正确答案是 `B` 和 `C.`。为了实现延迟重放，你设置 `HADR_REPLAY_DELAY` 参数；唯一支持的 HADR 同步模式是\
  \ `SUPERASYNC`。将 `HADR_REPLAY_DELAY` 设置为 `7200` 将将备库上的日志重放延迟两个小时。\n\n## 第 37 \n\n\
  正确答案是 `B.`。HADR 辅助备库无论主库与辅助备库之间的 `HADR_LOG_GAP` 是多少，始终处于 `REM_CATCHUP` 状态。在以下示例中，备库成员\
  \ 10.112.0.1 是辅助备库服务器。\n\n![Image](img/822.jpg)\n\n## 第 38 \n\n正确答案是 `B.`。支持的 pureScale\
  \ DB2 成员最大数为 128（0–127）。\n\n## 第 39 \n\n正确答案是 `C.`。支持的 pureScale DB2 CF 服务器最大数为两个（128,\
  \ 129）。至少，你只能有一个主 CF；但你需要两个 CF（主用和备用）来消除单点故障。\n\n## 第 40 \n\n正确答案是 `D.`。至少，你只能有一个主\
  \ CF；但你需要两个 CF（主和备用）来消除单点故障。考虑到 ABC 公司的需求，建议安装一个额外的 CF 以实现有效的 pureScale 操作。\n\n\
  ## 第 41 \n\n正确答案是 `B.`。当使用 `db2haicu –disable` 选项禁用集群操作时，数据库管理器的高可用性将停止。然而，使用 `--delete`\
  \ 选项将从实例删除所有集群策略。答案 C 和 D 是错误的语法。\n\n## 第 42 \n\n正确答案是 `B.`。HADR 是一种无共享（shared nothing）架构，因为你使用单独的服务器设置主数据库和备数据库。服务器之间不共享资源。\n\
  \n## 第 43 \n\n正确答案是 `A` 和 `C.`。目前，增量备份、差量备份和健康监控在 pureScale 环境中不支持。\n\n## 第 44 \n\
  \n正确答案是 `A.`。pureScale 集群解决方案使用共享磁盘架构在 DB2 成员之间共享公共数据。然而，其他系统组件（如内存和处理器）在集群成员之间并不共享。\n\
  \n## 第 45 \n\n正确答案是 `C.` `MON_GET_BUFFERPOOL` 函数决定组缓冲池命中率。你使用表函数 `MON_GET_CONNECTION`\
  \ 来确定一个或多个连接的性能指标，使用 `MON_GET_CF` 获取 CF 指标，并使用 `DB2_GET_INSTANCE_INFO` 查询 CF 状态。\n\
  \n## 第 46 \n\n正确答案是 `A.`。在从一个系统恢复到另一个系统时，你将 DB2 注册表变量 `DB2_RESTORE_GRANT_ADMIN_AUTHORITIES`\
  \ 设置为 `YES`，向执行恢复操作的用户授予目标数据库的 `SECADM`、`DBADM`、`DATAACCESS` 和 `ACCESSCTRL` 权限。将\
  \ `DB2_COMPATIBILITY_VECTOR` 设置为 `NULL` 对数据库没有影响，通常用于 Oracle 与 DB2 或 Sybase 与 DB2\
  \ 之间的数据库兼容。Microsoft Windows 上可用 `DB2_LIMIT_ FENCED_GROUP` 设置限制 `db2fmp` 进程的权限为分配给\
  \ `DB2USERS` 组的权限。DB2 不会在恢复完成后完成答案 D。\n\n## 第 47 \n\n正确答案是 `A.`。全局锁管理器（Global Lock\
  \ Manager）通过跟踪活动数据库成员的本地锁管理器（Local Lock Managers）生成的锁请求来管理 pureScale 集群环境中的并发。组缓冲池（Group\
  \ Buffer Pool）保持所有成员之间页面缓存的一致，并协调可能存在于成员本地缓冲池中的页面副本。\n\n## 第 48 \n\n正确答案是 `B.`。pureScale\
  \ 中引入了物理锁（p-locks），以控制多个 DB2 成员对物理页面的并发访问。你可以以共享模式或排占模式应用这些 p 锁，它们由 CF 的全局锁管理器管理。\n\
  \n## 第 49 \n\n正确答案是 `D.`。双工（Duplexing）是 CF 用于保持主备双方都更新的方法，允许在主 CF 和备用 CF 之间进行透明接管。其他同步模式是\
  \ HADR 同步模式。\n\n## 第 50 \n\n正确答案是 `B.`。因为 pureScale 只支持两个 CF 服务器——ID 128 和 ID 129——尝试启动\
  \ 130 的命令将失败并报错 `SQL1542N`：“添加 CF 失败，因为已达到 DB2 实例的最大 CF 数量。”\n\n# 8 章：DB2 安全\n\n\
  本章将为你介绍 DB2 中提供的安全模型。你将学习使用许多 DB2 安全功能，包括角色、信任上下文、信任连接、行和列访问控制以及基于标签的访问控制，以保护数据和数据库对象免受未经授权的访问和修改。在章结束时，你还可以使用\
  \ DB2 审计设施来监控数据访问。\n\n## 考试目标\n\n*   识别用于限制 DB2 数据库存储数据访问的方法的能力\n\n\n\n\n\n* 演示识别\
  \ DB2 使用的授权级别的能力\n* 演示识别 DB2 使用的权限的能力\n* 演示向用户或组授予特定授权和权限的能力\n* 演示通过角色（roles）简化权限管理和维护的能力\n\
  * 演示从用户或组中撤销特定授权和权限的能力\n* 演示在数据库和应用程序服务器之间创建和使用信任上下文及信任连接的能力\n* 演示通过行和列访问控制 (RCAC)\
  \ 实现列或行权限的能力\n* 演示创建和激活列掩码的能力\n* 演示实施基于标签的访问控制 (LBAC) 能力\n\n## 控制数据库访问\n\n身份盗用——一种某人非法获取他人个人数据（如社会安全号码、银行账户号码或信用卡号）并以某种涉及欺诈或欺骗的方式利用其获取经济利益的犯罪——是目前我们国家增长最快的犯罪。犯罪分子正通过偷听手机通话、阅读传真和电子邮件、黑入计算机、发起电话和电子邮件诈骗、偷取钱包和手包、从垃圾桶中偷取丢弃的文件、偷取邮件，以及利用疏忽的在线购物和银行习惯来窃取信息。但更令人恐惧的是，研究显示，高达\
  \ 70% 的身份盗用案件是内部人员所为——由同事或你光顾的企业的员工实施。在这些情况下，只需要访问你的个人数据，而犯罪分子通常可以在公司数据库中找到这些数据。\n\
  \n每个数据库管理系统都必须保护数据免受未经授权的访问和修改。DB2 使用外部安全服务和内部访问控制机制来执行这项至关重要的任务。在大多数情况下，采用了三个级别的安全。第一级控制对创建数据库的实例的访问，第二级控制对数据库本身的访问，第三级控制对数据库内部数据和对象的访问。\n\
  \n## 身份验证\n\n用户在访问 DB2 实例或数据库之前，必须通过的首个安全门户是被称为 `authentication`（身份验证）的过程。身份验证目的是验证用户确实是他们所称的。通常由不属于\
  \ DB2 的外部安全设施执行身份验证。该安全设施可能是操作系统的一部分（如 AIX、Solaris、Linux、HP-UX、Windows Server 2008/2012\
  \ 等许多系统），可能是独立的附加产品（例如，分布式计算环境 [DCE] 安全服务），也可能不存在（如 Windows 95、Windows 98 和 Windows\
  \ Millennium 版本）。如果存在安全设施，在用户通过身份验证之前，必须为其提供两个特定项目：唯一的用户 ID 和相应的密码。用户 ID 向安全设施标识用户，而密码（仅为用户和安全设施已知的信息）则验证用户确实是其所声称的身份。\n\
  \n## 身份验证发生在何处？\n\n由于 DB2 可能存在于由多个客户端、网关和服务器组成的环境中，且每个组件可能运行在不同的操作系统上，因此决定在何处进行身份验证可能是一项艰巨的任务。为了简化问题，DB2\
  \ 在 DB2 数据库管理器配置文件中使用一个名为 `authentication` 的参数来决定如何以及在何处对用户进行身份验证。此类文件与每个实例相关，你分配给此参数的值（通常称为\
  \ `authentication type`）是在创建实例时初始设置的。在服务器端，身份验证类型在实例创建过程中指定（你可以通过重启实例随时更新它）；在客户端，身份验证类型在对远程建立目录时指定。每个实例仅存在一种身份验证类型，它控制对该实例以及对所有受该实例控制的数据库的访问。\n\
  \n对于 DB2 10.1，提供以下身份验证类型：\n\n* `SERVER`。身份验证在服务器工作站上通过使用服务器操作系统提供的安全设施进行。用户为了附加实例或连接数据库而输入的用户\
  \ ID 和密码将与存储在服务器上的用户 ID 和密码组合进行比较，以确定该用户是否允许访问该实例或数据库。默认情况下，这是首次创建实例时使用的身份验证类型。\n\
  * `SERVER_ENCRYPT`。身份验证在服务器工作站上通过使用服务器操作系统提供的安全设施进行。然而，用户为了附加实例或连接数据库而插入用户 ID 和密码在发送到服务器工作站进行验证之前可能会在客户端工作站上进行加密。\n\
  * `CLIENT`。身份验证在调用客户端应用程序的客户端工作站或数据库分区上通过使用客户端操作系统提供的安全设施进行（假设可用）。如果没有可用的安全设施，身份验证将以略有不同的方式处理。用户为了附加实例或连接数据库而输入的用户\
  \ ID 和密码将与存储在客户端或节点上的用户 ID 和密码组合进行比较，以确定该用户是否允许访问实例或数据库。\n* `KERBEROS`。身份验证在服务器工作站上通过支持\
  \ Kerberos 安全协议的安全设施进行。该协议通过使用传统加密创建一个共享密钥，作为第三方服务执行身份验证。该密钥成为在请求本地或网络服务时用于验证用户身份的凭据；这消除了跨网络以\
  \ ASCII 文本形式传递用户 ID 和密码的需求。（如果客户端和服务器都支持 Kerberos 安全协议，则用户为了附加实例或连接数据库而输入的用户 ID\
  \ 和密码将在客户端工作站上加密并发送到服务器进行验证。）请注意，`KERBEROS` 身份验证类型仅支持比 Windows 2000、Windows XP 或\
  \ Windows NT 更后的客户端和服务器。此外，客户端和服务器工作站必须属于同一个 Windows 域或信任域。\n* `KRB_SERVER_ENCRYPT`。身份验证在服务器工作站上通过使用\
  \ `KERBEROS` 或 `SERVER_ENCRYPT` 身份验证方法进行。如果客户端的身份验证类型设置为 KERBEROS，则在服务器上使用 Kerberos\
  \ 安全系统执行验证。然而，如果客户端的身份验证类型设置为 KERBEROS 以外的任何类型，或者 Kerberos 身份验证不可用，服务器将像指定了 `SERVER_ENCRYPT`\
  \ 身份验证类型一样运行，并适用此身份验证方法的规则。\n* `DATA_ENCRYPT`。身份验证在服务器工作站上通过使用 `SERVER_ENCRYPT`\
  \ 身份验证方法进行。此外，所有用户数据在从客户端到服务器以及从服务器到客户端传输之前都会被加密。\n\n\n\n\n\n- `DATA_ENCRYPT_CMP`。在服务器工作站上通过\
  \ `SERVER_ENCRYPT` 验证方法进行身份验证；所有用户数据在从客户端传输到服务器以及从服务器传输到客户端之前都会进行加密。此外，此验证类型为不支持\
  \ `DATA_ENCRYPT` 类型的低版本产品提供了兼容性。此类产品通过使用 `SERVER_ENCRYPT` 验证类型连接，且用户数据不会被加密。\n\n\
  - `GSSPLUGIN`。在服务器工作站上通过通用安全服务应用程序接口 (GSS-API) 插件进行身份验证。如果未指定客户端验证类型，服务器将向客户端返回服务器支持的插件列表（在\
  \ `srvcon_gssplugin_list` 数据库管理器配置参数中）。然后，客户端从客户端插件目录中选择列表中找到的第一个插件。如果客户端不支持列表中的任何插件，则使用\
  \ `KERBEROS` 验证方法对客户端进行身份验证。\n\n- `GSS_SERVER_ENCRYPT`。在服务器工作站上通过 `GSSPLUGIN` 或\
  \ `SERVER_ENCRYPT` 验证方法之一进行身份验证。也就是说，如果客户端身份验证通过 GSS-API 插件进行，则使用服务器支持插件列表中找到的第一个客户端支持的插件对客户端进行身份验证。如果客户端不支持服务器支持插件列表中的任何插件，则使用\
  \ `KERBEROS` 验证方法对客户端进行身份验证。如果客户端不支持 Kerberos 安全协议，则使用 `SERVER_ENCRYPT` 验证方法对客户端进行身份验证。\n\
  \n请注意，如果客户端工作站使用的验证类型在发送到服务器进行身份验证之前加密了用户 ID 和密码信息（例如 `SERVER_ENCRYPT`、`KRB_SERVER_ENCRYPT`\
  \ 等），则你必须配置服务器使用兼容的验证方法。否则，它将无法处理接收到的加密数据，并发生错误。\n\n同样重要的是，如果你不为客户端工作站指定验证类型，则将默认使用\
  \ `SERVER_ENCRYPT` 验证方法。如果此类客户端尝试与不支持 `SERVER_ENCRYPT` 验证类型的服务器通信，客户端将尝试使用服务器正在使用的验证类型——前提是您已配置服务器仅使用一种验证类型。如果服务器支持多种验证类型，则会生成错误。\n\
  \n## 安全插件\n\n- 在 DB2 10.1 中，身份验证通过使用安全插件完成。安全插件是提供身份验证安全服务的动态加载库。DB2 支持两种插件身份验证机制：\n\
  \n- **用户 ID 和密码验证**。这涉及使用用户 ID 和密码进行身份验证。你通过使用用户 ID/密码验证插件实现以下验证类型：\n\n    - `CLIENT`\n\
  \    - `SERVER`\n    - `SERVER_ENCRYPT`\n    - `DATA_ENCRYPT`\n    - `DATA_ENCRYPT_CMP`\n\
  \n- **GSS-API 身份验证**。GSS-API 正式名为通用安全服务应用程序接口版本 2 (IETF RFC2743) 和通用安全服务 API 版本\
  \ 2：C 绑定 (IETF RFC2744)。你通过使用 GSS-API 插件实现以下验证类型：\n\n    - `KERBEROS`\n    - `GSSPLUGIN`\n\
  \    - `KRB_SERVER_ENCRYPT`\n    - `GSS_SERVER_ENCRYPT`\n\n`KRB_SERVER_ENCRYPT`\
  \ 和 `GSS_SERVER_ENCRYPT` 同时支持 GSS-API 身份验证和用户 ID/密码验证；然而，GSS-API 身份验证是首选的验证类型。\n\
  \n每个插件都可以独立使用，也可以与一个或多个其他插件结合使用。例如，你可能仅指定使用服务器验证插件，并允许 DB2 使用客户端和组验证的默认值。或者，你可能只指定组验证或客户端验证插件。只有在\
  \ GSS-API 身份验证的情况下才同时需要客户端和服务器插件。（在某些情况下——例如，如果你正在使用 Microsoft Active Directory\
  \ 验证用户——你可能需要创建自己的自定义安全插件并供 DB2 使用。）\n\n你通过设置以下数据库管理器配置参数来启用安全插件：\n\n- `CLNT_PW_PLUGIN`。指定客户端用户\
  \ ID 和密码插件的名称\n- `CLNT_KRB_PLUGIN`。指定客户端 Kerberos 插件的名称\n- `GROUP_PLUGIN`。指定组插件的名称\n\
  - `LOCAL_GSSPLUGIN`。指定本地授权插件的名称\n- `SRV_PLUGIN_MODE`。指定服务器插件模式\n- `SRVCON_GSSPLUGIN_LIST`。指定服务器\
  \ GSS 插件列表\n- `SRVCON_PW_PLUGIN`。指定服务器用户 ID 和密码插件的名称\n- `SRVCON_AUTH`。指定服务器连接身份验证\n\
  - `AUTHENTICATION`。指定身份验证机制\n\n如果你不提供这些参数的值，DB2 10.1 的默认行为是使用实现操作系统级身份验证机制的用户 ID/密码插件。\n\
  \n## 可信与不可信的客户端\n\n如果你配置服务器和客户端都使用 `CLIENT` 验证类型，则身份验证将在客户端工作站（如果数据库是分区的数据库）或调用客户端应用程序的数据库分区（如果数据库是分区式数据库）上通过操作系统提供的安全设施进行。但如果客户端工作站使用的操作系统不包含安全设施会怎样？这种配置会损害安全性吗？答案是否。\n\
  \n然而，在这样的环境中，服务器的 DB2 数据库管理器必须确定哪些客户端将负责验证用户，哪些客户端将强制由服务器处理身份验证。为了做出这种区分，使用包含集成安全设施的操作系统（例如\
  \ OS/390, VM, VSE, MVS, AS/400, Windows NT, Windows 2000, Windows 2003, Windows\
  \ 2008, Windows 2012 以及所有支持的 UNIX 版本）的客户端被类为受信客户端，而使用不提供集成安全设施的操作系统（例如 Windows 95,\
  \ Windows 98 和 Windows Millennium Edition）的客户端被视为不可信客户端。\n\nDB2 管理器配置文件的 `trust_allclnts`\
  \ 参数帮助服务器实例上的 DB2 数据库管理器预判是否将其客户端视为受信或不可信。如果将此配置参数设置为 `YES`（默认值），DB2 数据库管理器假设任何访问实例的客户端都是受信客户端，并且将在客户端进行某种身份验证。但如果你将此配置参数设置为\
  \ NO，DB2 数据库管理器假设一个或多个不可信客户端将尝试访问服务器；因此，所有用户必须在服务器上进行身份验证。（将此配置参数设置为 `DRDAONLY`\
  \ 将仅将 MVS, OS/390, VM, VSE 和 AS/400 客户端视为受信客户端。）请注意，无论 `trust_allclnts` 参数如何设置，只要不可信客户端尝试访问实例或数据库，用户身份验证始终会在服务器上进行。\n\
  \n\n\n\n\n在某些情况下，即使不使用不可信的客户端，在服务器端对用户进行身份验证可能是理想的。在这种情况下，你可以设置 DB2 数据库管理器配置文件中的\
  \ `trust_clntauth` 配置参数，以控制验证受信客户端的位置。当接受此参数的默认值（为 `CLIENT`）时，受信客户端的身份验证将在客户端工作站进行。然而，如果你将此参数的值更改为\
  \ `SERVER`，则所有受信客户端的身份验证将在服务器上进行。\n\n## 权限与许可\n\n一旦用户通过身份验证并建立了与实例的关联或与数据库的连接，DB2\
  \ 数据库管理器将评估分配给用户的任何权限（Authorities）和许可（Privileges），以确定该用户允许执行的操作。许可（Privileges）是指对特定数据库资源（如表和视图）执行某些操作的权利。权限（Authorities）表示一组许可，或者是指对实例或数据库执行高层级管理、维护和实用程序操作的权利。\n\
  \n你可以直接向用户分配权限和许可，也可以通过分配给用户所属用户组的权限和许可来间接获得。权限和许可共同控制对实例的 DB2 数据库管理器、受该实例控制的一个或多个数据库以及特定数据库对象的访问。用户只能对他们已获得相应授权（即所需的权限或许可）的对象进行操作。图\
  \ 8.1 提供了 DB2 10 能够识别的权限和许可的层级视图。\n\n![Image](img/832.jpg)\n\n*图 8.1：DB2 10.1 可用权限和许可的层次*\n\
  \n## 权限\n\nDB2 10 使用 12 种不同的权限来控制用户如何对实例或数据库执行管理和维护操作：\n\n*   系统管理员 (`SYSADM`) 权限\n\
  *   系统控制 (`SYSCTRL`) 权限\n*   系统维护 (`SYSMAINT`) 权限\n*   系统监控 (`SYSMON`) 权限\n*   数据库管理员\
  \ (`DBADM`) 权限\n*   安全管理员 (`SECADM`) 权限\n*   SQL 管理员 (`SQLADM`) 权限\n*   工作负载管理管理员\
  \ (`WLMADM`) 权限\n*   解释管理员 (`EXPLAIN`) 权限\n*   访问控制管理员 (`ACCESSCTRL`) 权限\n*   数据访问管理员\
  \ (`DATAACCESS`) 权限\n*   非管理员数据库 (`LOAD`) 权限\n\n其中四种权限适用于 DB2 数据库管理器实例（以及受该实例控制的所有数据库），而另外八种权限仅适用于特定实例内的特定数据库。你仅将实例级权限分配给用户组；拥有这些权限的组名称存储在与实例关联的\
  \ DB2 数据库管理器配置文件中。相反，你将数据库级权限分配给单个用户，在某些情况下分配给用户组；具有数据库级权限的组和用户记录在权限所涉及的数据库的系统目录表中。\n\
  \n## 系统管理员权限\n\n`SYSADM` 权限是可用的最高级别管理权限。拥有此权限的用户可以运行任何 DB2 实用程序，执行任何 DB2 命令，并执行任何尝试访问受\
  \ LBAC 保护数据的 SQL 或 XQuery 操作。拥有此权限的用户还具有控制实例内所有数据库对象的能力，包括数据库、数据库分区组、缓冲池、表空间、模式、表、视图、索引、别名、服务器、数据类型、函数、过程、触发器、包和事件监控器。此外，拥有此权限的用户被允许执行以下任务：\n\
  \n*   将现有数据库从旧版本的 DB2 升级（迁移）到新版本\n*   修改与实例关联的 DB2 数据库管理器文件的参数值——包括指定哪些组具有 `SYSADM`、`SYSCTRL`、`SYSMAINT`\
  \ 和 `SYSMON` 权限；DB2 数据库管理器配置文件控制分配给单个实例的资源资源\n*   向单个用户和组授予 `DBADM` 权限和 `SECADM`\
  \ 权限\n*   从单个用户和组撤销 `DBADM` 权限和 `SECADM` 权限\n\n你通过在与实例关联的 DB2 数据库管理器文件的 `sysadm_group`\
  \ 参数中存储相应的组名称，仅向一个组分配 `SYSADM` 权限。（你可以通过执行指定 `SYSADM_GROUP` 参数的 `UPDATE DATABASE\
  \ MANAGER CONFIGURATION` 命令并指定接收 `SYSADM` 权限的组名称来实现。）组自身的成员关系通过定义实例的工作站上使用的操作系统安全设施进行控制。拥有\
  \ `SYSADM` 权限的用户负责控制与实例关联的 DB2 数据库管理器，并确保受实例控制的数据库中所含数据的安全完整性。\n\n## 系统控制权限\n\n\
  `SYSCTRL` 权限是可用的最高级别系统或实例控制权限。拥有此权限的用户可以对 DB2 数据库管理器实例以及受该实例控制的任何数据库执行维护和实用程序操作。然而，由于\
  \ `SYSCTRL` 允许特殊用户维护包含敏感数据的实例，而他们极可能没有查看或修改这些数据的权限，因此授予此权限的用户不会隐式获得访问由实例控制的数据库中存储数据的权限。但是，由于执行某些实用程序操作需要连接到数据库，拥有特定实例\
  \ `SYSCTRL` 权限的用户还将获得连接到该实例控制下每个数据库所需的许可。\n\n拥有 `SYSCTRL` 权限（或更高权限）的用户允许执行以下任务：\n\
  \n*   更新数据库、节点或分布式连接服务 (DCS) 目录（通过注册/取消注册数据库、节点或 DCS 数据库）\n*   修改一个多个数据库配置文件的参数值（数据库配置文件控制正常运行分配给单个数据库的资源量）\n\
  *   强制用户退出系统\n*   创建或删除数据库\n*   创建、修改或删除表空间\n*   制作数据库或表空间的备份映像\n*   使用备份映像恢复现有数据库\n\
  *   使用备份映像恢复表空间\n*   从数据库备份映像创建新数据库\n*   对数据库执行前滚恢复操作\n*   启动或停止 DB2 数据库管理器实例\n\
  *   对数据库操作运行跟踪\n*   通过监控表函数获取 DB2 数据库管理器实例或受实例控制的任何数据库的系统监控快照\n*   查询表空间的状态\n* \
  \  更新恢复历史日志\n*   静止（限制访问）表空间\n*   重组表\n*   使用 `RUNSTATS` 实用程序收集目录统计信息\n\n\n\n\n\n\
  与 `SYSADM` 权限一样，你通过将相应的组名存储在特定实例相关的 DB2 数据库管理器配置文件的 `sysctrl_group` 参数中，仅向一个组分配\
  \ `SYSCTRL` 权限。（你可以通过执行 `UPDATE DATABASE MANAGER CONFIGURATION` 命令来实现，并指定 `SYSCTRL_GROUP`\
  \ 参数以及要接收 `SYSCTRL` 权限的组名。）同样，组本身的个人成员关系是通过定义实例的工作站上使用的安全设施进行控制的。\n\n## 系统维护权限\n\
  \n`SYSMAINT` 权限是可用的系统或实例控制权限中级别第二高的。拥有此权限的用户可以对 DB2 数据库管理器实例以及该实例控制的所有数据库执行维护和实用程序操作。`SYSMAINT`\
  \ 权限允许特殊用户维护包含敏感数据的数据库，而这些用户很可能没有查看或修改这些数据的权限。因此，被授予此权限的用户不会隐式地获得访问其被允许维护的数据库中存储数据的权限。然而，由于在执行某些实用程序操作之前必须存在与数据库的连接，拥有特定实例\
  \ `SYSMAINT` 权限的用户会自动获得连接该实例控制下每个数据库所需的权限。\n\n具有 `SYSMAINT` 权限（或更高）的用户被允许执行以下任务：\n\
  \n* 修改一个或多个 DB2 数据库配置文件的参数值\n* 创建数据库或表空间的备份映像\n* 使用备份映像恢复现有数据库\n* 使用备份映像恢复表空间\n\
  * 对数据库执行前滚恢复（roll-forward）操作\n* 启动或停止 DB2 数据库管理器实例\n* 对数据库操作运行跟踪（trace）\n* 通过为 DB2\
  \ 数据库管理器实例或实例控制下的任何数据库使用监控表函数获取数据库系统监视快照\n* 查询表空间的状态\n* 更新恢复日志文件\n* 静止（限制访问）表空间\n\
  * 重新组织表\n* 使用 `RUNSTATS` 实用程序收集目录统计信息\n\n与 `SYSADM` 和 `SYSCTRL` 权限一样，你通过将相应的组名存储在特定实例相关的\
  \ DB2 数据库管理器配置文件的 `sysmaint_group` 参数中，仅向一个组分配 `SYSMAINT` 权限。（你可以通过执行 `UPDATE DATABASE\
  \ MANAGER CONFIGURATION` 命令来实现，并指定 `SYSMAINT_GROUP` 参数以及要接收 `SYSMAINT` 权限的组名。）同样，组本身的个人成员关系是通过定义实例的工作站上使用的安全设施进行控制的。\n\
  \n## 系统监视权限\n\n`SYSMON` 权限是 DB2 可用的系统或实例控制权限中级别第三高的。拥有此权限的用户可以通过为 DB2 数据库管理器实例以及该实例控制的一个或多个数据库使用监控表函数获取系统监视快照。`SYSMON`\
  \ 权限允许特殊用户监控包含敏感数据的性能，而这些用户很可能没有查看或修改这些数据的权限。因此，拥有此权限的用户不会隐式地获得访问其被允许收集快照监视信息的数据库中存储数据的权限。然而，由于在使用快照监视\
  \ SQL 表函数之前必须存在与数据库的连接，拥有特定实例 `SYSMON` 权限的用户会自动获得连接该实例控制下每个数据库所需的权限。\n\n具有 `SYSMON`\
  \ 权限（或更高）的用户被允许执行以下任务：\n\n* 获取快照监视开关的当前设置\n* 修改一个或多个快照监视开关的设置\n* 重置监视使用的的所有计数器\n\
  * 获取活动数据库列表\n* 获取活动应用程序列表（包括 DCS 应用程序）\n* 收集快照监视数据\n* 使用快照监视表函数\n\n与 `SYSADM`、`SYSCTRL`\
  \ 和 `SYSMAINT` 权限一样，你通过将相应的组名存储在特定实例相关的 DB2 数据库管理器配置文件的 `sysmon_group` 参数中，仅向一个组分配\
  \ `SYSMON` 权限。（你可以通过执行 `UPDATE DATABASE MANAGER CONFIGURATION` 命令来实现，并指定 `SYSMON_GROUP`\
  \ 参数以及要接收 `SYSMON` 权限的组名。）同样，组本身的个人成员关系是通过定义实例的工作站上使用的安全设施进行控制的。\n\n## 数据库管理员权限\n\
  \n`DBADM` 权限是管理权限级别第二高的（仅次于 SYSADM）。拥有此权限的用户可以运行大多数 DB2 实用程序，发布特定特定的命令，执行大多数 SQL\
  \ 操作，并访问任何表中的数据——只要数据未受 LBAC 保护。要访问受 LBAC 保护的数据，用户必须拥有 `DATAACCESS` 权限。此外，具有 `DBADM`\
  \ 权限（或更高）的用户被允许执行以下任务：\n\n* 读取数据库日志文件\n* 创建、激活和删除事件监视器\n* 查询表空间的状态\n* 更新恢复日志文件\n\
  * 静止（限制访问）表空间\n* 重新组织表\n* 使用 `RUNSTATS` 实用程序收集目录统计信息\n\n与 `SYSADM`、`SYSCTRL`、`SYSMAINT`\
  \ 和 `SYSMON` 权限不同，你可以通过执行适当形式的 `GRANT` 语句（稍后介绍）向个人用户和组分配 `DBADM` 权限。当你授予用户特定数据库的\
  \ `DBADM` 权限时，该用户会自动获得该数据库可用的所有数据库权限。\n\n![Image](img/note.jpg)\n\n**注意：** 当具有 `SYSADM`\
  \ 或 `SYSCTRL` 权限的用户创建新数据库时，该用户会自动获得该数据库的 `DBADM`、`SECADM`、`ACCESSCTRL` 和 `DATAACCESS`\
  \ 权限。此外，如果具有 `SYSADM` 或 `SYSCTRL` 权限的用户创建了数据库，随后被从 SYSADM 或 SYSCTRL 组中移除（即撤销了该用户的\
  \ `SYSADM` 或 `SYSCTRL` 权限），该用户将保留该数据库的 `DBADM`、`SECADM`、`ACCESSCTRL` 和 `DATAACCESS`\
  \ 权限，直到被显式撤销。\n\n## 安全管理员权限\n\n`SECADM` 权限是一种特殊的数据库级权限，允许特殊用户配置各种 LBAC 元素，以限制对一个或多个表的访问，而这些用户本身很可能没有访问这些数据的。拥有此权限的用户不会隐式地获得访问其管理数据访问数据的权限。事实上，具有\
  \ `SECADM` 权限的用户仅允许执行以下任务：\n\n* 授予和撤销所有数据库级权限，包括 `DBADM`、`SECADM`、`DATAACCESS`、`ACCESSSCTRL`、`EXPLAIN`、`SQLADM`、`WLMADM`\
  \ 和 `LOAD`\n* 创建、删除、授予和撤销安全对象，如安全策略、安全标签、信任上下文和角色\n* 授予和撤销 LBAC 规则豁免\n* 授予和撤销 `SETSSESSIONUSER`\
  \ 权限（通过使用 `GRANT SETSESSIONUSER` SQL 语句）\n\n\n\n\n\n*   转移任何非 `SECADM` 拥有的对象的权限（通过执行\
  \ `TRANSFER OWNERSHIP` SQL 语句）\n\n其他权限（包括 `SYSADM` 权限）均不为用户提供这些能力。你仅可以将 `SYSADM`\
  \ 权限分配给单个用户；不能将其分配给组（包括 `PUBLIC` 组）。要进行此分配，系统管理员需要执行相应形式的 `GRANT` SQL 语句，并且具有 `SYSADM`\
  \ 权限的用户才被允许授予此权限。\n\n# SQL 管理员权限\n\n监控和调整 SQL 语句需要 `SQLADM` 权限。拥有 `SQLADM` 的用户允许执行以下任务：\n\
  \n*   创建、删除或刷新事件监视器\n*   使用 `EXPLAIN` 生成 Explain 数据\n*   刷新优化器缓存\n*   执行表和索引重组\n\
  *   对表和索引执行 `RUNSTATS`\n*   启用或禁用事件监视器\n*   刷新包缓存并准备 SQL 语句\n\n`SQLADM` 可以执行以下负载管理命令的某些子句：\n\
  \n*   执行 `ALTER SERVICE CLASS` 以收集聚合活动数据、请求数据和请求指标\n*   执行 `ALTER THRESHOLD` 以收集活动数据\n\
  *   执行 `ALTER WORK ACTION SET` 以收集活动数据和聚合活动数据\n*   执行 `ALTER WORKLOAD` 以处理活动指标、聚合活动数据、锁超时、锁等待和工作单元数据\n\
  \n持有 `SECADM` 或 `ACCESSCTRL` 权限的用户可以将 `SQLADM` 权限授予用户、组、角色或 `PUBLIC`。如果 `DB2AUTH`\
  \ 注册表变量设置为 `SQLADM_NO_RUNSTATS_REORG`，拥有 `SQLADM` 权限的用户将无法对表或索引执行 `REORG` 或 `RUNSTATS`\
  \ 操作。\n\n## 负载管理管理员\n\n管理特定数据库的负载对象需要 `WLMADM` 权限。拥有 `WLMADM` 的用户允许执行以下任务：\n\n*\
  \   对以下 WLM 对象进行创建、修改、删除和注释：\n    *   服务类 (Service classes)\n    *   阈值 (Thresholds)\n\
  \    *   工作集 (Work action sets)\n    *   工作类 (Work class sets)\n    *   负载 (Workloads)\n\
  \    *   直方图模板 (Histogram templates)\n*   授予和撤销负载权限\n*   执行内置的负载管理例程\n\n拥有 `SECADM`\
  \ 或 `ACCESSCTRL` 权限的用户可以将此权限授予用户、组、角色或 `PUBLIC`。\n\n## Explain 管理员权限\n\n`EXPLAIN`\
  \ 权限用于在不实际获取数据库数据的情况下解释查询访问计划。拥有 `EXPLAIN` 的用户允许执行以下任务：\n\n*   为 SQL 语句生成访问计划信息\n\
  *   准备 SQL 语句\n*   对 `SELECT` 语句或 XQuery 语句的输出执行 `DESCRIBE`\n\n持有 `SECADM` 或 `ACCESSCTRL`\
  \ 权限的用户可以将此权限授予用户、组、角色或 `PUBLIC`。\n\n# 访问控制管理员权限\n\n授予和撤销数据库内对象的权限需要 `ACCESSCTRL`\
  \ 权限。拥有 `ACCESSCTRL` 的用户允许执行以下任务：\n\n*   对系统目录表和视图授予和撤销 `SELECT` \n*   对表、表空间、视图、索引、别名\
  \ (nickname)、包、例程（DB2 审计例程除外）、模式 (schema）、序列、服务器、全局变量和 XML 架构仓库 (XSR) 对象授予和撤销所有权限\n\
  *   授予和撤销数据库权限，包括 `BINDADD`、`CONNECT`、`CREATETAB`、`CREATE_EXTERNAL_ROUTINE`、`CREATE_NOT_FENCED_ROUTINE`、`IMPLICIT_SCHEMA`、`LOAD`\
  \ 和 `QUIESCE_CONNECT`\n*   授予和撤销管理权限，包括 `EXPLAIN`、`SQLADM` 和 `WLMADM`\n\n只有安全管理员可以将\
  \ `ACCESSCTRL` 分配给用户、组或角色。\n\n## 数据访问管理员权限\n\n授予或撤销特定数据库内数据的访问权限需要 `DATAACCESS`\
  \ 权限。拥有 `DATAACCESS` 的用户允许执行以下任务：\n\n*   授予或撤销数据库 `LOAD` 权限\n*   对表（包括系统目录表、视图、MQT\
  \ 和别名）授予或撤销 `SELECT` 权限\n*   对表、视图、MQT 和别名授予或撤销 `INSERT` 权限\n*   对表、视图、MQT 和别名授予或撤销\
  \ `DELETE` 权限\n*   对表、视图、MQT 和别名授予或撤销 `UPDATE` 权限\n*   对除 DB2 审计例程外的所有包和例程授予或撤销\
  \ `EXECUTE` 权限\n\n只有安全管理员可以将 `DATAACCESS` 权限授予用户、组或角色。\n\n## 非管理员 (LOAD) 数据库权限\n\
  \n`LOAD` 权限是一种特殊的数据库级权限，其范围远小于 `DBADM` 权限。拥有特定表 `LOAD` 权限以及 `INSERT` 权限（在某些情况下还有\
  \ `DELETE` 权限）的用户允许使用 `AutoLoader` 工具（`db2atld` 命令）或 `LOAD` 命令/API 向该表批量加载数据。`LOAD`\
  \ 权限允许特殊用户对他们可能无法进行其他操作的数据库执行批量加载操作。此权限为数据库管理员提供了一种允许更多用户执行特殊数据库操作（如 ETL 操作）而无需牺牲控制的方法。\n\
  \n除了可以将数据加载数据库表外，拥有 `LOAD` 权限（或更高权限）的用户允许执行以下任务：\n\n*   使用 `LIST TABLESPACES` 命令查询表空间状态\n\
  *   对表空间进行静止处理（限制访问）\n*   使用 `Load` 工具执行批量加载操作（如果加载操作使用了异常表，则用户必须对使用的异常表拥有 `INSERT`\
  \ 权限，并且对被加载的表拥有 `INSERT` 权限）\n*   使用 `RUNSTATS` 工具收集目录统计信息\n\n与 `DBADM` 权限一样，你可以通过执行相应形式的\
  \ `GRANT` SQL 语句将 `LOAD` 权限分配给单个用户和组。\n\n## 权限\n\n如前，权限赋予单个用户和组对特定数据库资源执行某些操作的权利。在\
  \ DB2 10.1 中，存在两种不同的权限：数据库权限和对象权限。\n\n## 数据库权限\n\n数据库权限适用于整个数据库，在许多情况下，它们充当提供数据访问前必须通过的第二个安全检查点。图\
  \ 8.2 显示了不同类型的数据库权限。\n\n![Image](img/841.jpg)\n\n*图 8.2：DB2 可用的数据库权限*\n\n如图 8.2\
  \ 所示，存在八种不同的数据库权限：\n\n*   `CONNECT`。允许用户与数据库建立连接\n*   `QUIESCE_CONNECT`。允许用户在数据库处于静止状态（即访问受限时）时与数据库建立连接\n\
  *   `IMPLICIT_SCHEMA`。允许用户通过创建对象并为该对象分配与数据库中现有任何模式名称不同的模式名称，隐式地数据库中创建新模式\n*   `CREATETAB`。允许用户在数据库中创建新表\n\
  *   `BINDADD`。允许用户在数据库中创建包（通过针对数据库预编译嵌入 SQL 的应用程序源代码文件或将应用程序绑定文件绑定到数据库）\n*   `CREATE_EXTERNAL_ROUTINE`。允许用户创建\
  \ UDF 和存储过程并将其存储在数据库中，以便其他用户和应用程序可以使用\n\n\n\n\n\n*   `CREATE_NOT_FENCED_ROUTINE`。允许用户创建非围栏（unfenced）UDF\
  \ 和过程并将其存储在数据库中（非围栏 UDF 和过程被认为足够安全，可以在 DB2 数据库管理器运行环境的进程或地址空间中运行；除非 UDF 或过程被注册为非围栏，否则\
  \ DB2 数据库管理器将隔离 UDF 或过程的内部资源，使其无法在 DB2 数据库管理器的地址空间运行）。\n*   `LOAD`。允许用户将数据批量加载到数据库中的一个或多个现有表中\n\
  \n在处理该数据库包含的任何对象之前，用户至少必须拥有该数据库的 `CONNECT` 权限。\n\n## 对象权限\n\n与适用于整个数据库的数据库权限不同，对象权限仅涉及数据库中的特定对象。这些对象包括表空间、模式（schemas）、表、视图、索引、序列、程序（routines）、包（packages）、服务器和别名（nicknames）。由于每个数据库对象的性质各异，每个对象所存在的单独权限也可能有所不同。以下章节描述了\
  \ DB2 10 提供的不同对象权限集。\n\n## 表空间权限\n\n表空间权限控制用户对特定表空间可以做什么和不能做什么。（表空间控制数据库中数据的物理存储位置。）图\
  \ 8.3 显示了唯一的可用表空间权限。\n\n![Image](img/842.jpg)\n\n*图 8.3：DB2 可用的表空间权限*\n\n如你在 图 8.3\
  \ 中所示，仅存在一种表空间权限。该权限是 `USE` 权限，授予后，它允许用户在表空间中创建表和索引。表空间的所有者（通常是创建表空间的个人）会自动获得该表空间的\
  \ `USE` 权限。`USE` 权限不能用于赋予用户在 `SYSCATSPACE` 表空间或任何可能临时表空间创建表的能力。\n\n## 模式权限\n\n模式权限控制用户对特定模式可以做什么和不能做什么。（模式是一个在逻辑上对数据库其他对象进行分类和分组的对象。大多数对象的命名使用命名约定，该约定由模式名称、点号、以及随后的对象名称组成。）图\
  \ 8.4 显示了不同类型的模式权限。\n\n![Image](img/843.jpg)\n\n*图 8.4：DB2 可用的模式权限* 如你在 图 8.4 中所示，存在三种不同的模式权限：\n\
  \n*   `CREATEIN`。允许用户在模式内创建对象\n*   `ALTERIN`。允许用户更改与模式内任何对象关联的注释，或更改位于模式内的任何对象\n\
  *   `DROPIN`。允许用户移除（删除）模式内的任何对象\n\n在模式内可以操作的对象包括表、视图、索引、包、用户定义数据类型、UDF、触发器、存储过程和别名。模式的所有者（通常是创建模式的个人）会自动获得该模式的所有可用权限，并拥有向其他用户和组授予这些权限任何组合的权利。\n\
  \n## 表权限\n\n表权限控制用户对数据库中特定表可以做什么和不能做什么。（表是一种逻辑结构，将数据呈现为具有固定列数的的无序行集合。）图 8.5 显示了不同类型的表权限。\n\
  \n![Image](img/844.jpg)\n\n*图 8.5：DB2 可用的表权限*\n\n如你在 图 8.5 中所示，存在八种不同的表权限：\n\n*\
  \   `CONTROL`。为用户提供所有可用的表权限，允许用户从数据库删除（删除）表，并赋予用户向其他用户和组授予或撤销一个多个表权限（`CONTROL` 权限除外）\n\
  *   `ALTER`。允许用户对表执行 `ALTER TABLE` SQL 语句；句话说，允许用户向表中添加列、添加或更改与表或其任何列关联的注释、为表创建或删除主键、为表创建或删除\
  \ `UNIQUE` 约束、为表创建或删除 `CHECK` 约束，以及为表创建或删除触发器（前提是用户对触发器引用的每个对象都持有相应的权限）\n*   `SELECT`。允许用户对表执行\
  \ `SELECT` SQL 语句；换句话说，此权限允许用户从表中检索数据、创建引用该表的视图并对表运行 `Export` 实用工具\n*   `INSERT`。允许用户对表执行\
  \ `INSERT` SQL 语句；换句话说，它允许用户向表中添加数据并对表运行 `Import` 实用工具\n*   `UPDATE`。允许用户对表执行 `UPDATE`\
  \ SQL 语句；换句话说，此权限允许用户修改表中的数据（此权限可以授予整个表，也可以限制为表中的一个或多个列）\n*   `DELETE`。允许用户对表执行\
  \ `DELETE` 语句；换句话说，它允许用户从表中删除行\n*   `INDEX`。允许用户为表创建索引\n*   `REFERENCES`。允许用户创建引用该表的外键约束（此权限可以授予整个表，也可以限制为表中的一个或多个列，在这种情况下只有这些列可以作为父键）表的所有者（通常是创建表的个人）会自动获得该表的所有可用权限（包括\
  \ `CONTROL` 权限），以及向其他用户和组授予这些权限任何组合（`CONTROL` 权限除外）的权利。如果你随后撤销了表所有者的 `CONTROL` 权限，自动授予所有者的其他权限不会自动撤销。相反，你必须显式地在多次操作中撤销它们。\n\
  \n## 视图权限\n\n视图权限控制用户对特定视图可以做什么和不能做什么。（视图是内存中的虚拟表，提供了处理一个或多个基础数据的替代方式。由于这个原因，你可以使用视图防止访问表的某些列。）图\
  \ 8.6 显示了不同类型的视图权限。\n\n![Image](img/845.jpg)\n\n*图 8.6：DB2 可用的视图权限*\n\n如你在 图 8.6\
  \ 中所示，存在五种不同的视图权限：\n\n*   `CONTROL`。为用户提供所有可用的视图权限，允许用户从数据库删除视图，并赋予用户向其他用户和组授予或撤销一个多个视图权限（`CONTROL`\
  \ 权限除外）\n*   `SELECT`。允许用户从视图检索数据、创建引用该视图的第二个视图并对视图运行 `Export` 实用工具\n*   `INSERT`。允许用户对视图执行\
  \ `INSERT` SQL 语句；换句话说，它允许用户向视图添加数据\n*   `UPDATE`。允许用户对视图执行 `UPDATE` SQL 语句；换句话说，它允许用户修改视图中的数据（此权限可以授予整个视图，也可以限制为视图中的一个或多个列）\n\
  \n\n\n\n\n*   `DELETE`。允许用户对视图执行 `DELETE` SQL 语句；换句话之，此权限允许用户从视图中删除数据行。\n\n要创建视图，用户必须对视图所引用的每个基表拥有相应的权限（至少是\
  \ `SELECT` 权限）。视图的所有者（通常是创建视图的个人）会自动获得该视图的所有可用权限——`CONTROL` 权限除外——并拥有向其他用户和组授予这些权限的任何组合（`CONTROL`\
  \ 权限除外）。只有当视图所有者也拥有该视图所引用的每个基表的 `CONTROL` 权限时，才能获得该视图的 `CONTROL` 权限。\n\n## 索引权限\n\
  \n索引权限控制用户对特定索引可以做什么和不能做什么。（索引是一个有序的指针集，引用基表中的一个或多个键；您使用索引来提高查询性能。）图 8.7 显示了唯一的索引权限。\n\
  \n![Image](img/846.jpg)\n\n*图 8.7: DB2 可用的索引权限*\n\n如你在图 8.7 所示，仅存在一种索引权限。该权限是 `CONTROL`\
  \ 权限，授予后允许用户从数据库中删除（丢弃）索引。与其他对象的 `CONTROL` 权限不同，索引的 `CONTROL` 权限并不赋予用户向其他用户和组授予或撤销索引权限的能力。这是因为\
  \ `CONTROL` 权限是唯一的索引权限，且只有拥有 `SYSADM` 或 `DBADM` 权限的用户才允许授予和撤销对象的 `CONTROL` 权限。索引的所有者（通常是创建索引的个人）会自动获得该索引的\
  \ `CONTROL` 权限。\n\n## 序列权限\n\n序列权限控制用户对特定序列可以做什么和不能做什么。（序列是一个可以自动生成值的对象。序列适用于生成唯一键值，您可以使用它们来避免使用位于数据库外部的唯一计数器用于数据生成时可能出现的并发和性能问题。）图\
  \ 8.8 显示了不同类型的序列权限。\n\n![Image](img/847-1.jpg)\n\n*图 8.8: DB2 可用的序列权限*\n\n如你在图 8.8\
  \ 所示，存在两种不同的序列权限：\n\n*   `USAGE`。允许用户使用与序列相关的 `PREVIOUS VALUE` 和 `NEXT VALUE` 表达式（`PREVIOUS\
  \ VALUE` 表达式返回指定序列最近生成的值；`NEXT VALUE` 表达式返回指定序列的下一个值）。\n\n*   `ALTER`。允许用户执行管理任务，如重启序列、更改序列的增值以及添加或修改与序列相关的注释。\n\
  \n序列的所有者（通常是创建序列的个人）会自动获得该序列的所有可用权限，并拥有向其他用户和组授予这些权限的任何组合的权利。\n\n## 程序权限\n\n程序权限控制用户对特定程序（routine）可以做什么和不能做什么。（程序可以是\
  \ UDF、存储过程或多个不同用户可以调用的方法。）图 8.9\n\n*图 8.9: DB2 可用的程序权限*\n\n如你在图 8.9 所示，仅存在一种程序权限。该权限是\
  \ `EXECUTE` 权限，授予后允许用户调用程序、创建源自程序的函数（前提是程序是函数），并在任何 DDL SQL 语句（例如 `CREATE VIEW`\
  \ 和 `CREATE TRIGGER`）中引用程序。用户在调用程序（UDF、存储过程或方法）之前，必须同时拥有该程序的 `EXECUTE` 权限以及该程序所需的任何权限。因此，要执行一个查询表的存储过程，用户必须拥有该程序的\
  \ `EXECUTE` 权限和表的 `SELECT` 权限。然而，程序的所有者（通常是创建程序的个人）会自动获得该程序的 `EXECUTE` 权限。\n\n##\
  \ 包权限\n\n包权限控制用户对特定包可以做什么和不能做什么。（包是一个包含 DB2 管理器代表应用程序以最高效方式处理 SQL 语句时所需信息的对象。）图\
  \ 8.10\n\n*图 8.10: DB2 可用的包权限*\n\n如你在图 8.10 所示，存在三种不同的包权限：\n\n*   `CONTROL`。为用户提供所有包权限，允许用户删除（丢弃）包，并赋予向其他用户和组授予或撤销一个多个权限（`CONTROL`\
  \ 权限除外）的能力。\n\n*   `BIND`。允许用户对已绑定的包重新绑定或添加新的包版本（除了 `BIND` 包权限外，在成功重新绑定包之前，用户必须持有执行构成该包的\
  \ SQL 语句所需的权限）。\n\n*   `EXECUTE`。允许用户执行包（拥有特定包的 `EXECUTE` 权限的用户可以执行该包，即使该用户没有执行包中存储的\
  \ SQL 语句所需的权限；这是因为执行 SQL 语句所需的所有权限都隐式地授予了包用户——注意，为了实现隐式授予，包的创建者必须作为个人用户或 `PUBLIC`\
  \ 组的成员持有权限，而不是作为另一个组的成员）。\n\n注意：如果你稍后撤销了包所有者的 `CONTROL` 权限，所有其他自动授予所有者的权限不会被自动撤销。相反，你必须在一次或多次单独的操作中显式地撤销它们。\n\
  \n## 服务器权限\n\n服务器权限控制用户对特定的联邦数据库服务器可以做什么和不能做什么。（DB2 联邦系统是一个分布式计算系统，由一个 DB2 服务器（称为*联邦服务器*）以及联邦服务器发送查询的一个或多个数据源组成。每个数据源由某些支持的关系型数据库管理系统（例如\
  \ Oracle）的实例加上该实例支持的一个或多个数据库组成。）图 8.11\n\n*图 8.11: DB2 可用的服务器权限*\n\n仅存在一种服务器权限。该权限是\
  \ `PASSTHRU` 权限，授予后允许用户通过联邦服务器直接向数据源发布 DDL 和 DML SQL 语句（作为透传操作）。\n\n## 别名权限\n\n\n\
  \n\n别名（Nickname）权限控制了用户对特定别名可以执行和不能执行的操作。（当客户端应用程序向联邦数据库服务器提交分布式请求时，服务器会将请求转发到适当的数据源进行处理。然而，此类请求本身并不标识数据源；相反，它通过使用映射到数据源中特定表和视图名称的别名来引用数据源内的表和视图。别名并不像别名那样是表视图的替代名称；相反，它们是联邦服务器引用外部对象的指针。）图\
  \ 8.12 显示了不同类型的别名权限。\n\n![Image](img/850.jpg)\n\n*图 8.12：DB2 可用的别名权限*\n\n如你在图 8.12\
  \ 所示，存在八种不同的别名权限：\n\n*   `CONTROL`：为用户提供所有可用的别名权限，允许用户从数据库中删除（drop）别名，并赋予用户向其他用户和组授予或撤销一个或多个别名权限（除\
  \ `CONTROL` 权限外）的能力\n*   `ALTER`：允许用户对表执行 `ALTER NICKNAME` SQL 语句；换句话说，此权限允许用户更改别名中的列名，添加或更改特定别名列数据类型映射的\
  \ DB2 数据类型，并为特定的别名列指定列选项\n*   `SELECT`：允许用户对别名执行 `SELECT` SQL 语句；换句话说，它允许用户从别名所指的联邦数据源中的表或视图中检索数据\n\
  *   `INSERT`：允许用户对别名执行 `INSERT` SQL 语句；换句话说，此权限允许用户向别名所指的联邦数据源中的表或视图中添加数据\n*   `UPDATE`：允许用户对别名执行\
  \ `UPDATE` SQL 语句；换句话说，此权限允许用户修改别名所指的联邦数据源中的表或视图中的数据（此权限可以授予整个表，也可以仅限于别名所指的表中的一或多列）\n\
  *   `DELETE`：允许用户对别名执行 `DELETE` SQL 语句；换句话说，它允许用户从别名所指的联邦数据源中的表或视图中删除数据行\n*   `INDEX`：允许用户为别名创建索引规范\n\
  *   `REFERENCES`：允许用户在父子关系中创建和删除引用该别名的外键约束\n\n别名的所有者（通常是创建表的个人）会自动获得该别名的所有可用权限（包括\
  \ `CONTROL` 权限），以及向其他用户和组授予这些权限的任何组合（除 `CONTROL` 权限外）的权利。如果你稍后从别名所有者处撤销 `CONTROL`\
  \ 权限，自动授予所有者的针对特定表的其他所有权限不会被自动撤销。相反，你必须在一次或多次单独的操作中显式地撤销它们。\n\n## 授予权限和权限\n\n用户（在某些情况下为组）可以通过三种不同的方式获取数据库权限和数据库/对象权限：\n\
  \n*   **隐式地。**当用户创建一个数据库时，该用户隐式地获得该数据库的 `DBADM` 权限以及大多数可用的数据库权限。同样，当用户创建一个数据库对象时，该用户隐式地获得该对象的所有可用权限，以及向其他用户和组授予这些权限的任何组合（除\
  \ `CONTROL` 权限外）的能力。当向用户显式授予更高级别的权限时，权限也可以被隐式授予（例如，如果你显式地授予用户某个表空间的 `CONTROL` 权限，该用户也将隐式地获得该表空间的\
  \ `USE` 权限）。记住，当你撤销导致这些授予的高级权限时，这些隐式分配的权限不会自动撤销。\n*   **间接地。**间接分配的权限通常与包相关；当用户执行一个需要用户所需的额外权限的包时（例如，删除表中某行数据的包需要对该表的\
  \ `DELETE` 权限），用户将间接获得这些权限，其明确目的是为了执行该包。间接授予的权限是临时的，且在授予范围之外不存在。\n*   **显式地。**任何具有权限的人都可以显式地向个人用户或用户组授予或撤销数据库级权限、数据库权限和对象权限。要显式授予大多数数据库对象的权限，用户必须拥有\
  \ `SYSADM` 或 `DBADM` 权限或对该对象的 `CONTROL` 权限。或者，用户可以显式授予其在指定 `WITH GRANT OPTION` 时被分配的任何权限。要授予任何对象的\
  \ `CONTROL` 权限，用户必须拥有 `SYSADM` 或 `DBADM` 权限；要授予 `SYSADM` 或 `DBADM` 权限，用户必须拥有 `SYSADM`\
  \ 权限。\n\n## 从 IBM Data Studio 授予权限和权限\n\n显式授予和撤销数据库级权限以及许多可用对象权限的一种方法是使用 IBM Data\
  \ Studio 提供的管理权限对话框。你通过在 Data Studio 格中高亮相应的数据库或对象名称，并在相应的对象菜单中选择 **Manage Privileges**（管理权限）来激活这些对话框。图\
  \ 8.13 显示了你必须在 Data Studio 中选择的菜单项，以激活特定表的 **Manage Privileges** 选项。\n\n![Image](img/852.jpg)\n\
  \n*图 8.13：调用表权限对话框*\n\n图 8.14 说明了在创建表后，表权限对话框可能的样子。（权限下的单个勾标记表示该个人或组已授予了该权限；双勾标记表示该个人或组也被授予了将该权限授予给其他用户和组的能力。）\n\
  \n要从表权限对话框（或类似的权限或权限对话框）向个人用户分配权限，你只需通过高亮识别用户列表中的用户条目来识别特定用户——如果目标用户不在列表中，你可以点击\
  \ **Grant New Privilege**（授予新权限）按钮添加用户；选择 **Grantee Type**（授权者类型）为用户、组、角色或公共；并为\
  \ **Grantee**（授权者）分配所需的权限，如图 8.15 所示。\n\n![Image](img/853-1.jpg)\n\n*图 8.14：表权限对话框*\n\
  \n![Image](img/853-2.jpg)\n\n*图 8.15：授予新权限对话框*\n\n## 使用 GRANT 命令授予权限和权限\n\n你可以通过执行相应形式的\
  \ `GRANT` SQL 语句，显式地向用户和组授予数据库级权限和数据库/对象权限。`GRANT` SQL 语句的语法根据你正在授予的权限或权限而异。以下子节显示了用于授予每个可用数据库级权限和数据库/对象权限的语法。\n\
  \n## 数据库级权限和权限\n\n![Image](img/854-1.jpg)\n\n| where: |\n\n\n\n\n\n| `Privilege`\
  \ | 标识要授予一个或多个用户和组的一个多个数据库权限；此参数的有效值为：`DBADM`, `SECADM`, `CONNECT`, `CONNECT_QUIESCE`,\
  \ `IMPLICIT_SCHEMA`, `CREATETAB`, `BINDADD`, `CREATE_EXTERNAL_ROUTINE`, `CREATE_NOT_FENCED_ROUTINE`\
  \ 和 `LOAD` |\n\n| `Recipient` | 标识接收指定的数据库权限的用户、组和角色名称；你为 `Recipient` 参数指定的值可以是以下内容的任意组合：•\
  \ `<USER>` `[UserName].` 标识一个接收指定权限的特定用户• `<GROUP>` `[GroupName].` 标识一个接收指定权限的特定组•\
  \ `<ROLE>` `[RoleName].` 标识一个接收指定权限的特定角色 |\n\n| `PUBLIC` | 表示将指定的权限授予 `PUBLIC` 组——（所有用户都是\
  \ `PUBLIC` 组的成员） |\n\n系统不会执行用户检查以确保 `Recipient` 参数值是有效的。因此，可以将权限授予给尚不存在的用户、组或角色。\n\
  \n## 表空间权限\n\n![Image](img/854-2.jpg)\n\n| where: |\n\n| `TablespaceName` | 标识与\
  \ `USE` 权限关联的表空间 |\n\n| `Recipient` | 标识接收 `USE` 权限的用户和组名称；同样，你为 `Recipient` 参数指定的值可以是以下内容的任意组合：`<USER>`\
  \ `[UserName],` `<GROUP>` `[GroupName],` `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n\
  如果你指定了 `WITH GRANT OPTION` 子句，每个 `Recipient` 都获得将收到的权限授予他人的能力。\n\n## 模式权限\n\n![Image](img/855-1.jpg)\n\
  \n| where: |\n\n| `Privilege` | 标识要授予一个或多个用户和组的一个多个模式权限；此参数的有效值为：`CREATIN`, `ALTERIN`\
  \ 和 `DROPIN` |\n\n| `SchemaName` | 通过名称标识与所有指定的模式权限关联的模式 |\n\n| `Recipient` | 标识接收指定模式权限的用户、组和角色名称；你为\
  \ `Recipient` 参数指定的值可以是以下内容的任意组合：`<USER>` `[UserName],` `<GROUP>` `[GroupName],`\
  \ `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n## 表权限\n\n![Image](img/855-2.jpg)\n\n|\
  \ where: |\n\n| `Privilege` | 标识要授予一个或多个用户和组的一个多个表权限；此参数的有效值为：`CONTROL`, `ALTER`,\
  \ `SELECT`, `INSERT`, `UPDATE`, `DELETE`, `INDEX` 和 `REFERENCES` |\n\n| `ColumnName`\
  \ | 通过名称标识与 `UPDATE` 或 `REFERENCES` 权限关联的一个多个特定列；你仅在 `Privilege` 参数包含 `UPDATE` 或\
  \ `REFERENCES` 值时才使用此选项 |\n\n| `TableName` | 通过名称标识与所有指定的表权限关联的表 |\n\n| `Recipient`\
  \ | 标识接收指定表权限的用户、组和角色名称；你为 `Recipient` 参数指定的值可以是以下内容的任意组合：`<USER>` `[UserName],`\
  \ `<GROUP>` `[GroupName],` `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n请注意，只有持有 `SYSADM`\
  \ 或 `DBADM` 权限的用户才被允许授予表的 `CONTROL` 权限。因此，当你指定 `ALL PRIVILEGES` 子句时，除 `CONTROL`\
  \ 权限外的所有表权限都将授予每个 `Recipient`；你必须单独授予 `CONTROL` 权限。\n\n## 视图权限\n\n![Image](img/856.jpg)\n\
  \n| where: |\n\n| `Privilege` | 标识要授予一个或多个用户和组的一个多个视图权限；此参数的有效值为：`CONTROL`, `SELECT`,\
  \ `INSERT`, `UPDATE` 和 `DELETE` |\n\n| `ColumnName` | 通过名称标识与 `UPDATE` 权限关联的一个多个特定列；你仅在\
  \ `Privilege` 参数包含 `UPDATE` 值时才使用此选项 |\n\n| `ViewName` | 通过名称标识与所有指定的视图权限关联的视图 |\n\
  \n| `Recipient` | 标识接收指定视图权限的用户、组和角色名称；你为 `Recipient` 参数指定的值可以是以下内容的任意组合：`<USER>`\
  \ `[UserName],` `<GROUP>` `[GroupName],` `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n\
  再次，只有持有 `SYSADM` 或 `DBADM` 权限的用户才被允许授予表的 `CONTROL` 权限（注：此处应为视图）。因此，当你指定 `ALL PRIVILEGES`\
  \ 子句时，除 `CONTROL` 权限外的所有视图权限都将授予每个 `Recipient`；你必须单独授予 `CONTROL` 权限。\n\n## 索引权限\n\
  \n![Image](img/857-1.jpg)\n\n| where: |\n\n| `IndexName` | 通过名称标识与 `CONTROL` 权限关联的索引\
  \ |\n\n| `Recipient` | 标识接收 `CONTROL` 权限的用户、组和角色名称；你为 `Recipient` 参数指定的值可以是以下内容的任意组合：`<USER>`\
  \ `[UserName],` `<GROUP>` `[GroupName],` `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n\
  ## 序列权限\n\n![Image](img/857-2.jpg)\n\n| where: |\n\n| `Privilege` | 标识要授予一个或多个用户和组的一个多个序列权限；此参数的有效值为：`USAGE`\
  \ 和 `ALTER` |\n\n| `SequenceName` | 通过名称标识与所有序列权限关联的序列 |\n\n| `Recipient` | 标识接收序列权限的用户、组和角色名称；你为\
  \ `Recipient` 参数指定的值可以是以下内容的任意组合：`<USER>` `[UserName],` `<GROUP>` `[GroupName],`\
  \ `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n## 程序权限\n\n![Image](img/858-1.jpg)\n\n\
  | where: |\n\n| `RoutineName` | 通过名称标识与 `EXECUTE` 权限关联的程序（UDF、方法或存储过程） |\n\n| `TypeName`\
  \ | 通过名称标识方法的类型 |\n\n| `SchemaName` | 通过名称标识对其中所有的函数、方法或存储过程授予 `EXECUTE` 权限——包括未来创建的程序\
  \ |\n\n| `Recipient` | 标识接收 `EXECUTE` 权限的用户、组和角色名称；你为 `Recipient` 参数指定的值可以是以下内容的任意组合：`<USER>`\
  \ `[UserName],` `<GROUP>` `[GroupName],` `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n\
  ## 包权限\n\n![Image](img/858-2.jpg)\n\n| where: |\n\n| `Privilege` | 标识要授予一个或多个用户和组的一个多个包权限；此参数的有效值为：`CONTROL`,\
  \ `BIND` 和 `EXECUTE` |\n\n| `SchemaName` | 通过名称标识查找包模式 |\n\n| `PackageName` | 通过名称标识与所有包权限关联的包\
  \ |\n\n| `Recipient` | 标识接收指定包权限的用户、组和角色名称；你为 `Recipient` 参数指定的值可以是以下内容的任意组合：`<USER>`\
  \ `[UserName],` `<GROUP>` `[GroupName],` `<ROLE>` `[RoleName],` 和 `PUBLIC`（DB2 for\
  \ Linux、UNIX 和 Windows 不允许用户自授予包权限） |\n\n## 服务器权限\n\n![Image](img/859-1.jpg)\n\n\
  | where: |\n\n| `ServerName` | 通过名称标识与 `PASSTHRU` 权限关联的服务器 |\n\n| `Recipient` |\
  \ 标识接收 `PASSTHRU` 权限的用户、组和角色名称；你为 `Recipient` 参数指定的值可以是以下内容的任意组合：`<USER>` `[UserName],`\
  \ `<GROUP>` `[GroupName],` `<ROLE>` `[RoleName],` 和 `PUBLIC` |\n\n## 别名权限\n\n![Image](img/859-2.jpg)\n\
  \n| where: |\n\n\n\n\n\n| `Privilege` 权限 | 识别要授予一个或多个用户和组的别名权限；该参数的有效值为：`CONTROL`、`ALTER`、`SELECT`、`INSERT`、`UPDATE`、`DELETE`、`INDEX`\
  \ 和 `REFERENCES` |\n| `ColumnName` 列名 | 通过名称识别一个或多个特定列，以关联 `UPDATE` 或 `REFERENCES`\
  \ 权限；仅当 `Privilege` 参数包含 `UPDATE` 或 `REFERENCES` 值时才使用此选项 |\n| `Nickname` 别名 | 通过名称识别要关联所有指定权限的别名\
  \ |\n| `Recipient` 接收者 | 识别接收指定别名权限的用户、组和角色名称；您为 `Recipient` 参数指定的值可以是以下内容的任意组合：`<USER>`\
  \ `[UserName],`, `<GROUP>` `[GroupName],`, `<ROLE>` `[RoleName],` 以及 `PUBLIC` |\n\
  \n只有持有 `SYSADM` 或 `DBADM` 权限的用户允许授予别名的 `CONTROL` 权限。因此，当您指定 `ALL PRIVILEGES` 子句时，每个接收者都将获得除\
  \ `CONTROL` 权限以外的所有别名权限；您必须单独授予 `CONTROL` 权限。\n\n## GRANT SQL 语句示例\n\n现在您已经了解了各种形式的\
  \ `GRANT SQL` 语句的基本语法，让我们来看一些示例。\n\n**示例 1。** 服务器有一个名为 `BINDER` 的组。授予组 `BINDER`\
  \ 将将应用程序绑定到数据库 `SAMPLE` 的能力：\n\n![Image](img/860-1.jpg)\n\n**示例 2.**** 向组 `PUBLIC`\
