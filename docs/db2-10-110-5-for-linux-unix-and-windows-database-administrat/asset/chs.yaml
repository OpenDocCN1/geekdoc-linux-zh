  \n## 创建数据存储\n\n此时，你的复制引擎和 Access Server 正在运行，并且创建了 MQT 列影子表。现在，你必须创建一个订阅服务来填充 MQT\
  \ 并保持 MQT 与行表同步。\n\n使用你在安装 Access Server 软件时创建的账户登录 Access Server。如果尚未创建，你现在可以使用安装路径\
  \ `bin` 目录下的 `dmcreateuser` 来创建一个。\n\n使用安装软件的 UNIX 账户运行命令。在例例中，它是 `db2cdc01\\.`。在\
  \ UNIX 命令行提示符中，执行以下命令：\n\n![Image](img/1081.jpg)\n\n在 Windows 服务器上，你有一个 **Management**\
  \ 图标，如图 10.38 所示。启动它进入 Access Server。\n\n![Image](img/1082.jpg)\n\n*图 10.38: CDC\
  \ 登录*\n\n接下来，你需要通过 **Datastore** 标签定义数据存储。在图 10.39 中，数据存储识别了源和目标数据库。\n\n![Image](img/1082-2.jpg)\n\
  \n*图 10.39: 添加数据存储*\n\n数据存储名称为 `TIE`，通信类型为 `JDBC`。如图 10.40 所示，端口是安装时默认的 (190)。我们将使用安装软件的\
  \ UNIX 账户的 ID 和密码。\n\n![Image](img/1083.jpg)\n\n*图 10.40: 连接参数*\n\n在开始订阅之前，你需要确保设置了所需的系统参数。右键点击刚创建的数据存储并选择\
  \ **Properties**。在图 10.42 中，你可以看到该数据存储的属性。\n\n![Image](img/1084.jpg)\n\n*图 10.42:\
  \ 数据存储属性*\n\n选择 **System Parameters** 标签，然后查找 `maintain_replication_mqt_table` 并确保其设置为\
  \ true，如图 10.43 所示。\n\n![Image](img/1085.jpg)\n\n*图 10.43: 设置系统参数*\n\n如果你更改了它，请确保停止并启动复制以使更改生效。\n\
  \n## 创建订阅\n\n现在准备好创建订阅了。点击 **Configuration** 标签；左侧第二个图标是 **Create new subscription**（参见图\
  \ 10.44）。\n\n由于所有订阅具有相同的源和目标，当你创建订阅时，会显示图 10.45 中的消息。点击 **Yes** 并继续。\n\n此外，图 10.46\
  \ 中的提示会询问是否要映射表。点击 **Yes** 并继续。\n\n![Image](img/1087-1.jpg)\n\n*图 10.44: 创建新订阅*\n\
  \n\n\n\n\n*图 10.45：新订阅上显示“目标和源相同”消息*\n\n![Image](img/1087-3.jpg)\n\n*图 10.46：映射表提示框*\n\
  \n在图 10.47 中的“选择映射类型”页面上，选择 `Custom Table Mapping`（自定义表映射），类型选择 `Standard`（标准），然后点击`Next.`（下一步）。\n\
  \n![Image](img/1088.jpg)\n\n*图 10.47：自定义映射*\n\n在接下来两个窗口中，选择源表和目标表。此处仅显示目标窗口（图 10.48）。\n\
  \n![Image](img/1089.jpg)\n\n*图 10.48：选择目标表向导*\n\n在图 10.49 中的“指定键”窗口中，你在此选择主键。默认情况下，所有列都已勾选（你的唯一主键不应该是表中的所有列）。你可以突出显示所有列并点击“toggle”（切换）将它们全部关闭，然后选择你用于标识主键的一个或两个列。记住，两个表的主键必须完全匹配。\n\
  \n![Image](img/1090.jpg)\n\n*图 10.49：选择用于行映射的索引或键*\n\n接是是复制方法（参见图 10.50），如果需要，你稍后可以更改。\n\
