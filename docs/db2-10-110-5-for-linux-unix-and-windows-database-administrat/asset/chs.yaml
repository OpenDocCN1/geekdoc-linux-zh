  \ STMM 的控制中移除 `SORTHEAP` 和 `SHEAPTHRES_SHR`。\n\n记住，`CREATE DATABASE` 这这两个设置的默认值为\
  \ `AUTOMATIC`。`SORTHEAP` 和 `SHEAPTHRES_SHR` 的默认设置为 `AUTOMATIC`：\n\n![Image](img/1041-2.jpg)\n\
  \n你可以将其更改为如下：\n\n![Image](img/1041-3.jpg)\n\n## 随机键索引\n\n升型数字键会导致高强度插入处理的性能瓶颈。这种瓶颈问题在像\
  \ pureScale 这样的集群技术中会变得更加明显。\n\n考虑以下表/索引示例：\n\n![Image](img/1042-1.jpg)\n\n当你评估性能时，如果系统识别出在插入处理期间索引上发生了锁/闩锁（lock/latch）冲突，将主键索引转换为\
  \ `RANDOM` 索引可能会显著提高性能：\n\n![Image](img/1042-2.jpg)\n\n`MSG_ID` 列也是升型数字键，但你不应该更改在其上面定义的索引，因为它与扫描/集合处理之间存在\
  \ 1-M 外键关系。只有涉及直接读取的索引才应该被考虑随机化。\n\n## 表达式上的索引\n\n存储在数据库中的数据是大小写混合的。应用程序中没有任何内容可以阻止小写名称，而且没有定义触发器来强制所有可搜索数据为大写或小写。\n\
