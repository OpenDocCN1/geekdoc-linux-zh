  \ <SORTHEAP>”` |\n\n| ![images](img/circ.jpg) | H. | 归档日志 O. 以上所有 |\n\n### 问题 93\n\
  \n在 pureScale 中，给定一个包含成员 {0, 5, 10} 的数据库备份映像，以下哪个目标系统可以让你恢复并向前滚（roll forward）该备份映像？\n\
