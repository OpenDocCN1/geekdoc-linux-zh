  \n## 创建影子表\n\n你从一个被识别为可能从列组织中获益的工作负载的行组织表开始。创建一个与当前行表匹配的 MQT 列组织表。使用 Data Studio，选择\
  \ **Create MQT**，如图 10.34 所示。\n\n![Image](img/1079-1.jpg)\n\n*图 10.34: 创建 MQT 选项*\n\
