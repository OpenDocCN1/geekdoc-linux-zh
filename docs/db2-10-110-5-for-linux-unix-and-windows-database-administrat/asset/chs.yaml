  \ (DPF)，你必须对每个逻辑单元执行上述步骤，如下所示：\n\n![Image](img/677.jpg)\n\n如果你想将数据库目录从 `/home/db2inst1`\
  \ 更改为 `/database`，请使用以下配置执行步骤：\n\n![Image](img/677.jpg)\n\n## db2move 和 db2look\
  \ 命令\n\n很容易看出你如何结合使用 `Export` 工具与 `Import` 工具或 `Load` 工具来将一个表从一个数据库复制到另一个数据库。但如果你想复制多个表或整个数据库呢？在这种情况下，你可以使用\
  \ `Export` 和 `Import` 或 `Load` 工具逐表地复制数据（如果使用 PC/IXF 格式的文件，表结构和任何关联索引也将被复制），但复制整个\
  \ DB2 数据库更有效的方法是使用 `db2move` 工具。\n\n\n\n\n\n此实用程序会查询指定数据库的系统目录表，并汇编所有找到的用户表并形成列表。然后，它会将数据库中每个表的内容和表结构导出到单独\
  \ PC/IXF 格式文件中。生成的这些文件可以导入或加载到相同系统上的另一个 DB2 数据库，也可以传输到另一台工作站并导入或加载到那里的 DB2 数据库。\n\
  \n你可以通过四种不同的模式之一运行 `db2move` 程序：导出（Export）、导入（Import）、加载（Load）或复制（Copy）。当在导出模式下运行时，`db2move`\
  \ 会调用 `Export` 工具从一个或多个表中提取数据，并将其外部化为 PC/IXF 格式的文件。它还会生成一个名为 `db2move.lst` 的文件，其中包含所有处理过的表名，以及每个表数据所写入的文件名。此外，`db2move`\
  \ 工具还可能生成一个或多个消息文件，其中包含由于导出操作而产生的警告或错误消息。\n\n如果你在导入模式下运行 `db2move`，它将调用 `Import`\
  \ 工具，使用存储在 PC/IXF 格式文件中的信息重新创建每个表及其关联索引。在在此模式下运行时，`db2move.lst` 文件在所需的 PC/IXF 格式文件与要导入数据的表之间建立链接。\n\
  \n在加载模式下运行使 `db2move` 能够调用 `Load` 工具，用存储在 PC/IXF 格式文件中的数据填充已存在的表。（你不应该使用加载模式来填充一个不包含表定义的空数据库。）同样，`db2move.lst`\
  \ 文件在所需的 PC/IXF 格式文件与要加载数据的表之间建立链接。\n\n遗憾的是，你只能使用 `db2move` 工具移动表和索引对象。如果你需要迁移的数据库包含其他对象如别名、视图、触发器、用户定义类型（UDTs）、用户定义函数（UDFs）等，如果你想获得源数据库的相同副本，则必须在目标数据库中同样复制这些对象。这时\
  \ `db2look` 工具派上用场了。调用 `db2look` 时，它可以对现有数据库进行反向工程，并生成一组 DDL SQL 语句，然后你可以使用这些语句来重新创建在所分析数据库中找到的所有数据对象。`db2look`\
  \ 工具还可以收集源系统上的环境注册表变量设置、配置参数设置和统计（`RUNSTATS`）信息，你可以利用这些信息在目标系统上复制这些设置。\n\n![Image](img/note.jpg)\n\
  \n**认证提示：** 你可以使用命令 `db2look -d <dbname> -z <schema> -t <tabname> -m -c -r -o statsfile.in`\
  \ 在模拟模式下从源系统提取统计信息，并在排除生产问题运行时运行命令 `db2 –tvf statsfile.in` 在目标测试系统上进行复制。\n\n## 数据库维护实用程序\n\
  \n在数据库和外部文件之间移动数据的同时，数据库管理员通常必须对数据库进行常规维护，以保持其性能运行。本节将介绍此类实用程序及其执行的功能。\n\n## REORGCHK\
  \ 工具\n\n数据在表空间容器中的物理分布方式对访问该数据的应用程序性能产生重大影响。而数据的分布方式主要由在表上执行的插入、更新和删除操作控制。例如，一系列插入操作将尝试将数据页连续地分布在跨表空间容器中。然而，随后的删除操作可能会在存储中留下空页，由于某种原因，这些空页从未被填充。或者，对变长度列执行的更新操作可能会导致整行被写入另一个页，因为较大的列值不再允许该记录适合在原始页上。在这两种情况下，底层表空间容器内部都创建了间隙。因此，DB2\
  \ 数据库管理器可能需要读取更多的物理页到内存中，以检索满足查询所需的数据。\n\n那么你如何知道数据当前占用了多少存储空间，有多少空间是空闲但属于不可用的间隙？你可以利用\
  \ DB2 的 `REORGCHK` 工具获取这些信息。执行该工具时，它会生成数据库的统计信息并分析这些统计信息，以确定一个或多个表是否需要重组（这将消除任何现有的内部间隙）。\n\
  \n通过执行 `REORGCHK` 命令来调用 `REORGCHK` 工具，通常通常从 DB2 CLP 中执行。该命令的基本语法为：\n\n![Image](img/681-1.jpg)\n\
  \n| where: |\n\n| `SchemaName` | 标识分配给模式的名称，对该模式的对象进行分析以确定它们是否必须重组 |\n| `TableName`\
  \ | 标识分配给特定表的名称，对其进行分析以确定其是否必须重组 |\n\n因此，为了位于 `PAYROLL` 模式下的所有表生成统计信息，并分析这些统计信息以确定一个或多个表是否必须重组，你需要执行\
  \ `REORGCHK` 命令：\n\n![Image](img/681-2.jpg)\n\n## REORG 工具\n\n在仔细评估 `REORGCHK` 工具的输出后，你可能会发现一个或多个表或索引必须重组。如果是这样，你可以使用\
  \ DB2 的 `REORG` 工具对它们进行重组。`REORG` 工具通过检索存储在表及其多个关联索引中的数据，并将其重写到存储中去碎片且物理连续的页上，来消除表空间容器中的间隙。（`REORG`\
  \ 工具的工作方式与磁盘碎片整理相同。）`REORG` 工具还可以根据特定索引呈现的逻辑顺序物理地排列表数据行，从而增加指定索引的聚集率。这种行为具有吸引人的副作用——如果\
  \ DB2 数据库管理器发现解析查询的数据存储在连续存储空间中且已排序，则查询的整体性能将提高，因为检索数据所需的寻道时间更短。你还可以使用 `REORG` 工具将\
  \ Type-1 索引转换为 Type-2 索引。\n\n通过执行 `REORG` 命令来调用 `REORG` 工具。该命令的基本语法为：\n\n![Image](img/682-1.jpg)\n\
  \n或\n\n![Image](img/682-2.jpg)\n\n或\n\n![Image](img/682-3.jpg)\n\n或\n\n![Image](img/682-4.jpg)\n\
  \n| where: |\n\n| `TableName` | 标识分配给要物理重组表的名称 |\n| `IndexName` | 标识分配给关联索引的名称，用于排序要重组表的数据（如果未指定索引名称，则不考虑任何顺序重组表数据）\
  \ |\n| `TmpTSName` | 标识 DB2 数据库管理器临时存储要重组表副本的系统临时表空间（如果未指定表空间名称，DB2 数据库将在该表所在的表空间内存储要重组表的工作副本）\
  \ |\n| `LongTSName` | 标识 DB2 数据库管理器用于重构长数据的临时表空间（如果未指定表空间名称，DB2 数据库将在长数据所在的表空间内重构长数据对象）\
  \ |\n| `SrcTableName` | 标识分配给要重组关联索引的表的名称 |\n| `SrcIndexName` | 标识分配给要物理重组的索引的名称\
  \ |\n\n\n\n\n\n指定 `CLEANUP ONLY` 选项将执行清理操作而非完全重组。结果是索引将不会被重建，任何释放的页面将仅供指定表上定义的索引重用。\n\
  \n因此，如果您想对表 `EMPLOYEE` 进行数据重组，并物理上排序数据使其与索引 `EMPNO_PK` 的顺序一致，可以通过执行 `REORG` 命令来实现：\n\
  \n![Image](img/683-1.jpg)\n\n然而，若要重组表 `MKT_VALUE` 并根据索引 `MKT_INDX` 对其行进行聚类，则需要执行以下命令：\n\
  \n![Image](img/683-2.jpg)\n\n如果您想对唯一的单范围分区表 `STAGING.JDE_AB_STG` 进行重组，则需要执行此命令：\n\
  \n![Image](img/684-1.jpg)\n\n## RUNSTATS 实用程序\n\n其他之外，数据库的系统目录表可能包含统计信息，例如表中存储的行数、表和索引使用存储空间的方式以及特定列中唯一值的数量。DB2\
  \ 优化器在决定用于响应查询数据的最佳访问计划时会使用此类信息。（每当 SQL 语句发送到 DB2 数据库管理器处理时，DB2 优化器都会读取系统目录表以确定所引表的大小、所引列的特征，以及是否为所引表/列定义了索引，并获取其他类似信息。使用这些信息，DB2\
  \ 优化器随后确定满足 SQL 语句需求的最佳访问路径。）因此，如果 DB2 优化器所需的信息缺失或过期，所选访问计划可能会导致 SQL 语句执行时间比所需的更长。随着\
  \ SQL 语句复杂性的增加，拥有有效信息变得更加关键——对于简单语句，选择通常有限；对于复杂语句，选择数量大幅增加。\n\n在 DB2 9 版本之前，DB2\
  \ 优化器使用的信息不会随着数据库更改而自动更新。相反，您必须通过手动运行 DB2 的 `RUNSTATS` 实用程序定期更新这些信息。从 DB2 9 版本开始，在创建新数据库时默认启用自动统计收集（“DB2\
  \ 自动计算功能”章节中第 2 章“DB2 服务器管理”中 DB2 自动表维护功能的一部分）。只要自动统计收集保持启用，DB2 就会在后台自动执行 `RUNSTATS`\
  \ 实用程序，以确保可用最新的数据库统计信息。\n\n如果禁用了自动统计收集，可以通过执行 `RUNSTATS` 命令调用 `RUNSTATS` 实用程序。该命令的基本语法为：\n\
  \n![Image](img/684-2.jpg)\n\n或\n\n![Image](img/685-1.jpg)\n\n或\n\n![Image](img/685-2.jpg)\n\
  \n| where: |\n| :--- | :--- |\n| `TableName` | 标识要为收集统计信息的表指定的名称；可以是任何基本表，包括易变表\
  \ |\n| `IndexName` | 标识要为收集统计信息的一个或多个关联索引指定的名称 |\n| `ColumnName` | 标识要为收集统计信息的一个或多个列指定的名称\
  \ |\n| `Priority` | 指定限制 `RUNSTATS` 实用程序的运行，使其以特定速率执行，从而控制其对并发数据库活动的影响；您可以为此参数分配\
  \ 1 到 100 之间的数值，其中 100 表示最高优先级，1 表示最低优先级 |\n\n因此，如果您想为表 `EMPLOYEE`（位于模式 `PAYROLL`\
  \ 中）及其所有关联索引收集统计信息，并在收集统计期间允许对表的只读访问，可以通过执行 `RUNSTATS` 命令来实现：\n\n![Image](img/686-1.jpg)\n\
  \n然而，若要为表 `DEPARTMENT`（位于模式 `PAYROLL` 中）的所有符合条件的列收集基础统计和分布统计信息，则需要执行如下所示 `RUNSTATS`\
  \ 命令：\n\n![Image](img/686-2.jpg)\n\n您可以对某些列进行统计收集而不对另一些列进行。例如，数据类型为 `LONG VARCHAR`\
  \ 和 `CLOB` 的列是不符合收集条件的。\n\n## Rebind 实用程序\n\n此前，您已经看到 DB2 优化器使用 `RUNSTATS` 实用程序产生的统计信息来选择用于响应查询数据的最佳访问计划。由于\
  \ DB2 优化器在每次为执行准备动态 SQL 语句时都会生成访问计划，使用动态 SQL 的应用程序在产生新的统计信息后可能会立即看到性能提升。遗憾的是，对于使用静态\
  \ SQL 的应用程序并非如此。这是因为 DB2 优化器仅在包含这些语句的包绑定到数据库时，才为静态 SQL 语句生成访问计划。因此，为了让现有包利用 `RUNSTATS`\
  \ 实用程序产生的新统计信息，您必须将它们重新绑定到数据库，以便 DB2 优化器评估新信息并制定新的访问计划（可能可能也可能优于原始访问计划）。\n\n重新绑定现有包的最简单方法（假设用于生成包的应用程序源代码未更改）是执行\
  \ `REBIND` 命令。该命令的基本语法为：\n\n![Image](img/687-1.jpg)\n\n| where: |\n| :--- | :---\
  \ |\n| `PackageName` | 标识要重新绑定的包名称 |\n| `IndexName` | 标识要重新绑定的特定包版本 |\n\n如果您指定 `REOPT\
  \ NONE` 选项，包含主机变量、参数标记或特殊寄存器的 SQL 语句的访问计划将不会使用真实值进行优化，而是使用这些变量/标记/寄存器的默认估计。如果您指定\
  \ `REOPT ONCE` 选项，包含主机变量、参数标记或特殊寄存器的 SQL 语句的访问计划将在语句首次执行时使用真实值进行优化。最后，如果您指定 `REOPT\
  \ ALWAYS` 选项，包含主机变量、参数标记或特殊寄存器的 SQL 语句的访问计划将在每次执行时都使用真实值进行优化。\n\n因此，为了重新绑定包 `EMP_MGMT`，您需要执行\
  \ `REBIND` 命令：\n\n![Image](img/687-2.jpg)\n\n## 刷新包缓存\n\n如果动态 SQL 语句被准备，且相应的访问计划在收集新的统计信息之前已放入内存，并且使用该语句的应用程序设计为仅准备一次并执行多次，那么该特定语句在重新准备之前将无法利用\
  \ `RUNSTATS` 产生的新统计信息。通常，这种行为是可以接受的。但是，如果新的统计信息可以带来显著的性能提升，您可能希望立即利用新信息，而不是等待缓存包重建。\n\
  \n\n\n\n\n`FLUSH PACKAGE CACHE` SQL 语句为数据库管理员提供了通过失效（invalidating）从内存中移除缓存的动态 SQL\
  \ 语句包（程序包缓存）的能力。失效缓存的动态 SQL 语句包对当前使用该语句的用户没有影响；然而，一旦你使某个包失效，任何与该失效包关联的语句的新新请求将导致\
  \ DB2 优化器重新处理该语句，从而产生一个新的缓存包（该包可能包含、也可能不包含更高效的访问计划）。`FLUSH PACKAGE CACHE` 语句的基本语法如下：\n\
  \n![Image](img/688.jpg)\n\n一旦执行此语句，任何与当前正在使用的动态 SQL 语句关联的缓存包将允许继续存在于程序包缓存中，直到其当前用户不再需要它们为止；同一语句的下一个新用户将强制\
  \ DB2 数据库管理器隐式地准备该语句，然后新用户将执行新版本的缓存动态 SQL 语句。\n\n## 性能相关实用程序\n\n除了数据移动工具和维护工具外，DB2\
  \ 还提供了额外的工具，可以帮助准确定性能瓶颈，并对改进整体性能的额外数据对象提供建议。本节介绍了其中一些实用程序及其执行的功能。\n\n## db2batch\
  \ 工具\n\n基准测试是应用程序开发生命周期中的正常组成部分。理想情况下，这是一项团队工作，涉及应用程序开发人员和数据库管理员。通常，会运行两种不同类型的基准测试以获取两种类型的信息：\n\
  \n*   每秒事务数基准测试决定了 DB2 数据库管理器在某些有限实验室条件下的吞吐量能力。\n*   应用程序基准测试测试了在镜像生产环境的条件下的吞吐量能力。\n\
  \n基准测试也有助于理解 DB2 数据库管理器在不同条件下的响应。例如，你可以创建场景来测试死锁处理、实用程序性能、不同的数据加载方法、随着用户增加的事务速率特征，以及使用新发布版本的\
  \ DB2 软件的影响，这仅列了几个。\n\n基准测试通过开发测试场景然后多次运行该场景，并在每次运行期间捕捉关键信息来完成。你可以专门为此目的开发一个复杂的应用程序，但更简单的方法是利用\
  \ DB2 的 `db2batch` 工具。`db2batch` 工具是一个简单的基准测试工具，它可以从 ASCII 格式文件或标准输入读取 SQL 语句和 XQuery\
  \ 表达式；动态地准备、描述和执行找到的语句和表达式；并返回一个结果集，其中包含执行时间等。\n\n你通过执行 `db2batch` 命令来调用 `db2batch`\
  \ 工具。该命令的基本语法如下：\n\n![Image](img/689.jpg)\n\n| where: | |\n| :--- | :--- |\n| `DatabaseAlias`\
  \ | 通过别名识别要对其应用 SQL 语句和 XQuery 语句的数据库；如果不指定此选项，将使用环境变量 `DB2DBDFT` 的值 |\n| `InFile`\
  \ | 为一个 ASCII 格式文件指定名称，该文件包含构成基准测试工作负载的 SQL 语句和 XQuery 表达式 |\n| `Authorization`\
  \ | 指定身份验证 ID（或用户 ID）和密码，两者之间用正斜杠 (/) 隔开，用于建立到指定数据库的连接 |\n| `ParametersFile` | 标识包含参数值的输入文件，用于在执行语句之前将这些值绑定到任何\
  \ SQL 语句参数标记上 |\n| `Delimiter` | 指定一个作为列分隔符的字符（指定制表符列分隔符使用 `-t TAB`，指定空格列分隔符使用 `-t\
  \ SPACE`；默认情况下，设置 `-q on` 选项时使用空格，设置 `-q del` 选项时使用逗号） |\n| `OutFile` | 标识一个用于写入查询结果输出文件\
  \ |\n| `SummaryFile` | 标识一个用于写入摘要信息的输出文件 |\n| `ColumnWidth` | 指定产生的结果数据集的最大列宽，允许范围为\
  \ 0 到 2 GB；在显示时，数据将截断至此宽度，除非数据无法截断 |\n| `MonSwitch` | 标识要设置特定的快照监控开关；该参数的有效值为 `uow`、`statement`、`table`、`bufferpool`、`lock`、`sort`、`timestamp`\
  \ 和 `all` |\n| `Snapshot` | 标识执行每个语句或块后要取的快照类型（取决于 `-g` 选项的值）；该参数的有效值为 `applinfo_all`、`dbase_applinfo`、`dcs_applinfo_all`、`db2`、`dbase`、`dbase_all`、`dcs_dbase`、`dcs_dbase_all`、`dbase_remote`、`dbase_remote_all`、`agent_id`、`dbase_appls`、`appl_all`、`dcs_appl_all`、`dcs_appl_handle`、`dcs_dbase_appls`、`dbase_appls_remote`、`appl_remote_all`、`dbase_tables`、`appl_locks_agent_id`、`dbase_locks`、`dbase_tablespaces`、`bufferpools_all`、`dbase_bufferpools`、`dynamic_sql`\
  \ 和 `all` |\n| `TermDelimiter` | 指定一个或两个字符作为终止字符（分隔符）；默认是分号 (`;`) |\n\n表 6.8 列出了所有其他\
  \ `db2batch` 命令选项。\n\n| 表 6.8: db2batch 命令选项 |\n| :--- | :--- |\n| **Option** |\
  \ **含义** |\n| `-c` | 指定是否提交每个 SQL 语句产生的更改 |\n| `-i` | 指定要测量的时间间隔。`SHORT` 表示 db2batch\
  \ 测量运行每个语句所需的时间。`LONG` 指定 db2batch 测量运行每个语句以及语句之间开销的时间。`COMPLETE` 表示 db2batch 分别测量准备、执行和提取数据所需的时间\
  \ |\n| `-g` | 指定按块还是按语句报告时间。`ON` 表示对整个块取快照并仅在摘要表中报告块时间。`OFF` 表示对块中的每个语句取快照并报告摘要表\
  \ |\n| `-iso` | 指定使用的隔离级别，该级别决定了在访问数据时如何进行锁定和隔离。默认情况下，db2batch 使用重复读 (RR) 隔离级别 |\n\
  | `-v` | 指定以详细模式运行 db2batch。（信息在处理查询期间发送到标准错误） |\n| `-s` | 指定在发生非关键错误时停止运行 db2batch\
  \ |\n| `-q` | 指定如何返回查询结果。`OFF` 表示将查询结果和所有相关信息输出到标准输出 (stdout)。`ON` 指定以非分隔 ASCII\
  \ 格式仅返回查询结果。`DEL` 表示以分隔 ASCII 格式仅返回查询结果 |\n| `-h` | `-u` | `-?` | 此选项显示帮助信息。当你指定此选项时，所有其他选项将被忽略，仅显示帮助信息\
  \ |\n\n使用 `db2batch` 工具进行基准测试的最简单方法是创建一个包含一个或多个代表典型工作负载查询的文件，并将该文件的内容作为输入提供给 `db2batch`\
  \ 命令。这样的文件如下：\n\n![Image](img/691.jpg)\n\n一旦创建了此类文件，可以通过执行 `db2batch` 命令来进行基准测试（假设包含工作负载的文件名为\
  \ `wkload.sql`，且负载要在名为 `SAMPLE` 的数据库上运行）：\n\n\n\n\n\n![Image](img/692.jpg)\n\n当你执行此命令时，`db2batch`\
  \ 收集的结果将记录在一个名为 `results.txt` 的文件中，你可以在每次基准测试后查看该文件。\n\n## DB2 设计顾问\n\n在此之前，你已经看到如何使用\
  \ `RUNSTATS` 工具来更新系统目录统计信息，并强制 DB2 优化器使用这些统计信息为查询或 XQuery 表达式提供最佳访问计划。另一个对访问计划选择影响重大的因素是适当索引的存在（或不存在）。\n\
  \n那么，你如何决定何时拥有索引会有益？如何确定应该存在哪些索引？如果你在数据库和数据库应用程序设计方面富有经验，这些决策可能很容易。然而，如果你在这个领域的经验较少，或者如果你想验证已经做出的决策，可以转向\
  \ DB2 的设计顾问。\n\n设计顾问是一个特殊的工具，它可以识别索引、MQT、MDC 以及表的重分区，这些可能有助于提高你数据库环境中的查询性能。通过使用当前的数据库统计信息、DB2\
  \ 优化器、快照监控信息和或你提供的特定查询或一组 SQL 语句（称为工作负载），设计顾问会推荐一个或多个可以提高查询或工作负载性能的索引。此外，如果需要，推荐的索引/MQT/MDC/分区、为它们生成的统计信息以及创建它们所需的\
  \ DDL 语句可以写入名为 `ADVISE_INDEX` 的用户创建表。\n\n你通过执行 `db2advis` 命令来调用设计顾问。该命令的基本语法如下：\n\
  \n![Image](img/692-693.jpg)\n\n| where: |\n\n| `DatabaseName` | 通过名称指定设计顾问要交互的数据库\
  \ |\n| `WorkloadName` | 指定要分析的工作负载名称，以确定是否创建新的索引、MQT 或 MDC |\n| `SQLStatement` |\
  \ 指定一个要分析的单个 SQL 语句，以确定是否创建新的索引、MQT 或 MDC |\n| `InFile` | 指定分配给 ASCII 格式文件的名称，该文件包含一组用于分析的\
  \ SQL 语句，用以确定是否创建新的索引、MQT 或 MDC |\n| `UserID` | 指定用于建立连接到指定数据库的身份验证（或用户 ID） |\n\
  | `Password` | 指定用于建立连接到指定数据库的密码 |\n| `AdviseType` | 指定设计顾问要分析的一种种或多种建议类型；此参数的有效值包括：`I`（索引）、`M`（MQT\
  \ 及 MQT 上的索引）、`C`（将标准表转换为 MDC 表）和 `P`（现有表的重分区） |\n| `DiskLimit` | 指定现有架构中所有索引、MQT\
  \ 和 MDC 可用的最大存储空间（以兆字节为单位） |\n| `MaxAdviseTime` | 指定设计顾问进行分析的最大时间（以分钟为单位）；当达到此限制时，设计顾问将停止所有处理\
  \ |\n| `OutFile` | 指定写入创建推荐的索引/MQT/MDC 所需 DDL 语句的文件名 |\n\n表 6.9 列出了所有其他 `db2advis`\
  \ 命令选项。\n\n| **Table 6.9: db2advis 命令选项** |\n\n| **Option** | **Meaning (含义)** |\n\
  | `-g` | 此选项指定从动态 SQL 快照中检索构成工作负载的 SQL 语句。如果与 `-p` 参数结合，SQL 语句将保留在 `ADVISE_WORKLOAD`\
  \ 表中。 |\n| `-qp` | 此选项指定工作负载来自 DB2 Query Patroller。 |\n| `-k` | 此选项指定压缩工作负载的程度。压缩允许顾问在减少执行复杂性的同时，获得与考虑完整工作负载时顾问能提供的相似的结果。`HIGH`\
  \ 表示顾问将集中在工作负载的一个小子集上。`MED` 指定顾问将集中在工作负载的中等大小子集上。`LOW` 规定顾问将集中在较大的子集上。`OFF` 表示不进行任何压缩并考虑每个查询。\
  \ |\n| `-p` | 此选项指定将运行设计顾问期间生成的计划保留在 Explain（解释）表中。此选项导致 `-qp` 和 `-g` 的工作负载保存在 `ADVISE_WORKLOAD`\
  \ 表中，并将使用最终建议的工作负载查询计划保存在 Explain 表中。 |\n| `-h` | 此选项显示帮助信息。当你指定此选项时，所有其他选项都被忽略，仅显示帮助信息。\
  \ |\n\n确定索引、MQT 或 MDC 是否会提高工作负载性能的最简单方法是构建包含代表典型工作负载的一个或多个查询的文件，并将该文件的内容作为输入提供给\
  \ `db2advis` 命令。此类文件可能如下：\n\n![Image](img/694.jpg)\n\n一旦创建了此类文件，你就可以通过执行 `db2advis`\
  \ 命令来进行分析：\n\n![Image](img/695-1.jpg)\n\n执行此命令时，结果可能如下：\n\n![Image](img/695-2.jpg)\n\
  \n![Image](img/696.jpg)\n\n## 关于 DBMS_UTILITY 模块的说明\n\nDB2 在 9.7 版本中引入了模块。这些模块提供了一种方法将函数、类型和变量等相关对象组合在一个对象中。表\
  \ 6.10 显示了可供应用程序重用的各种内置模块。\n\n| Table 6.10: 可用的 DB2 模块 |\n\n| **Module Name (模块名称)**\
  \ | **Description (描述)** |\n| `DBMS_ALERT` | 该模块提供了一组用于注册警报、发送警报和接收警报的过程。 |\n| `DBMS_DDL`\
  \ | 该模块提供了混淆程序、触发器、视图或 PL/SQL 包等 DDL 对象的能力。混淆允许在不暴露过程逻辑的情况下部署 SQL 对象。 |\n| `DBMS_JOB`\
  \ | 该模块提供了用于创建、调度和管理作业的过程。 |\n| `DBMS_LOB` | 该模块提供了操作大对象的能力。 |\n| `DBMS_OUTPUT`\
  \ | 该模块提供了一组向消息缓冲区放置消息和从缓冲区接收消息的过程。 |\n| `DBMS_PIPE` | 该模块提供了一组在同一 DB2 实例内通过管道（IPC）发送消息的例。\
  \ |\n| `DBMS_SQL` | 该模块提供了一组执行动态 SQL 的过程并支持各种 DML 或 DDL 语句。 |\n| `DBMS_UTILITY`\
  \ | 该模块提供了各种实用程序（将在下一节讨论）。 |\n| `MONREPORT` | 该模块提供了一组检索各种监控数据并生成文本报告的过程。 |\n| `UTL_DIR`\
  \ | 该模块提供了一组维护用于 `UTL_FILE` 模块的目录别例。 |\n| `UTL_FILE` | 该模块提供了一组从数据库服务器文件系统读取和写入文件的例。\
  \ |\n| `UTL_MAIL` | 该模块提供了发送电子邮件的能力。 |\n| `UTL_SMTP` | 该模块提供了通过简单邮件传输协议 (SMTP) 发送电子邮件的能力。\
  \ |\n\n你可以使用 `DBMS_UTILITY` 程序对表和索引进行分析，查找对象之间的依赖关系等。表 6.11 显示了 `DBMS_UTILITY` 模块中的可用程序。\n\
  \n| **Table 6.11: DBMS_UTILITY 程序** |\n\n| **Object (对象)** | **Description (描述)**\
  \ |\n| `DBMS_UTILITY.ANALYZE_DATABASE` | 此存储过程提供了收集数据库中表、簇和索引统计信息的能力 |\n\n\n\n\n\
  \n| `DBMS_UTILITY.ANALYZE_PART_OBJECT` | 此存储过程提供了对分区表或索引收集统计信息的能力。 |\n| `DBMS_UTILITY.ANALYZE_SCHEMA`\
  \ | 此存储过程提供了对指定 schema 下的表、簇和索引收集统计信息的能力。 |\n| `DBMS_UTILITY.CANONICALIZE` | 此存储过程对输入字符串执行各种操作。\
  \ |\n| `DBMS_UTILITY.COMMA_TO_TABLE_LNAME` `DBMS_UTILITY.COMMA_TO_TABLE_UNCL` |\
  \ 这些存储过程将逗号分隔的名称列表转换为名称数组。列表中的每个条目都成为数组中的一个元素。 |\n| `DBMS_UTILITY.COMPILE_SCHEMA`\
  \ | 此存储过程提供了重新编译 schema 中所有函数、存储过程、触发器和包的能力。 |\n| `DBMS_UTILITY.DB_VERSION` | 此存储过程返回数据库的版本号。\
  \ |\n| `DBMS_UTILITY.EXEC_DDL_STATEMENT` | 此存储过程提供了执行 DDL 命令的能力。 |\n| `DBMS_UTILITY.GET_CPU_TIME`\
  \ | 此函数返回从某个任意时间开始的 CPU 时间，单位为百分秒。 |\n| `DBMS_UTILITY.GET_DEPENDENCY` | 此存储过程提供了列出所有依赖于给定对象的能力。\
  \ |\n| `DBMS_UTILITY.GET_HASH_VALUE` | 此函数提供了计算给定字符串哈希值的能力。 |\n| `DBMS_UTILITY.GET_TIME`\
  \ | 此函数提供了返回当前时间（单位为百分秒）的能力。 |\n| `DBMS_UTILITY.NAME_RESOLVE` | 此存储过程提供了获取数据库对象\
  \ schema 和其他成员信息的能力。别名将被解析为其基础对象。 |\n| `DBMS_UTILITY.NAME_TOKENIZE` | 此存储过程将名称解析为其组成部分。不带双引号的名称将转换为大写，带有双引号的名称将去除其双引号。\
  \ |\n| `DBMS_UTILITY.TABLE_TO_COMMA_LNAME` `DBMS_UTILITY.TABLE_TO_COMMA_UNCL` |\
  \ 这些存储过程将名称数组转换为逗号分隔的名称列表。每个数组元素都成为列表条目。 |\n| `DBMS_UTILITY.VALIDATE` | 此存储过程提供了将无效例程序的状态更改为有效的能力。\
  \ |\n\n过去，如果你想识别数据库内的对象依赖关系，可以解析整个数据库的 `db2look -d <dbname> -e` 命令输出以确定依赖关系。引入 `DBMS_UTILITY.GET_DEPENDENCY()`\
  \ 过程使这一活动变得简单。通过此此过程，你可以找到对函数、索引、包、存储过程、序列、表、触发器、视图和 LOB 的依赖关系。\n\n让我们通过调用以下命令来查找数据库中\
  \ `SYSTOOLS.STMG_DBSIZE_INFO` 表的依赖关系：\n\n![Image](img/699.jpg)\n\n## 章节总结\n\n本章的目标是让您熟悉：\n\
  \n*   DB2 数据移动工具的文件格式\n*   DB2 数据移动工具命令及用例场景\n*   DB2 `Ingest` 工具及其在数据仓库环境中的业务益处\n\
  *   `ADMIN_MOVE_TABLE()` 和 `ADMIN_COPY_SCHEMA()` 系统存储过程的语法及其用法\n*   DB2 数据库维护工具，如\
  \ `REORGCHK`、`RUNSTATS` 和 `REORG`\n*   DB2 性能工具，如 `db2batch` 和 `db2advis`\n\n完成本章后，您将具备足够的知识来回答认证考试中的\
  \ DB2 工具类问题。强烈建议完成章节末尾提供的示例题。\n\n## 练习题\n\n### 第 1 题\n\n以下哪项不是调用 Export 工具的方法？\n\
