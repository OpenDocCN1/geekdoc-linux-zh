  ### 第 3 步：为新账户设置密码：\n\n![Image](img/1008-5.jpg)\n\n### 第 4 步：设置两个用户的密码永不过过期。\n\n\
  ### 第 5 步：将两个用户的 ulimit 设置设为无限制。\n\n## BLU 技术\n\n本节介绍了提供 IBM DB2 BLU 加速的七项基础技术：\n\
  * 列式组织数据\n* 内存中\n* SIMD\n* 压缩\n* 缓冲池管理器\n* 多核并行\n* 数据跳过\n\n由于今天有更多竞争性的想法和策略，知道不做什么通常比知道做什么更。因此，本节将密切研究不同的解决方案，并提供一些关键点帮助您做出明智决策。\n\
  \n## 列式组织数据\n\nDB2 将数据组织为行或列。单个数据页将包含来自一个表的按行组织的数据或来自某一列的数据，如 图 10.2 和 图 10.3 所示。\n\
  \n![Image](img/1009-1.jpg)\n\n*图 10.2：行组织数据*\n\n![Image](img/1009-2.jpg)\n\n\n\n\
  \n图 10.3：列组织数据\n\n在列组织表中，数据可以被删除或插入，但永远不会被更新。列组织页通过跟踪槽位（slot）的当前和上一个副本来支持当前已提交（CC）隔离级别。表\
  \ 10.4 显示了数据页的内容。\n\n![Image](img/1010-1.jpg)\n\n那么，如果你将一个行组织表转换为列组织表，数据页的数量会增加还是减少？答案是，这在很大程度上取决于表的行数和列数。`TABLE1`、`TABLE2`\
  \ 和 `TABLE3` 的页面数量大幅减少，而 `TABLE4` 的数量则略有增加。你可以在表 10.5 中查看实际表格。\n\n![Image](img/1010-2.jpg)\n\
  \n`TABLE1`、`TABLE2` 和 `TABLE3` 的行组织表和列组织表是相同的。它们没有经过更改，只是组织方式不同。列编码百分比为 100%，唯一列标识符除外，该标识符是由\
  \ `GENERATE_UNIQUE()` 填充的。原因是 FP3a 不支持 `CHAR()` 和 `VARCHAR()`（参见表 10.6）。\n\n列组织的\
  \ `TABLE3` 并不是作为直接复制构建的。行组织的 `TABLE4` 被归一化为两个不同的表。`ROW_TABLE4` 包含了度量，因此将数据归一化为维度表和事实表。整个过程花费了八小时，并以每分钟\
  \ 8 MB 的速度加载了这两个表。\n\n![Image](img/1011-1.jpg)\n\n在 FP4 中，摘要表拥有所有数据类型，并支持高达 1000\
  \ 个字符的 `CHAR()` 和 `VARCHAR()`。表 10.7 显示了在 FP4 中构建的列组织表。注意 `MPAGES` 的增加以及节省页面数的增加。\n\
  \n![Image](img/1011-2.jpg)\n\n## 在内存中\n\n在数据库世界中，除大对象（LOB）外，一切都在内存中进行。那么，“在内存中”意味着什么？它有什么区别？\n\
  \n内存是一种分层资源，越接近处理器，成本越高，驻留时间也越短。访问 L3 缓存的速度比主内存快 5 倍，访问 L1 缓存快 7 倍。尽管多年来没有变化，但 RAM\
  \ 中数据的驻留时间一直是目标。任何在例如一秒内未引用的页面都不应该留在 RAM 中。\n\n某些 DBA 将所有数据放在 RAM 中并留在那里以避免 I/O。尽管内存访问比磁盘访问快，但无论数据存储在何处，访问不需要的数据都是糟糕的。目前有某些解决方案要求数据量小于或等于\
  \ RAM，否则在某些层级上技术将无法实现预期的性能。正如你从图 10.4 的图所示，每个执行的处理器指令都需要内存，但并非每个处理器指令都具有同等重要性，因为执行的每个工作负载的重要性并不相同。\n\
  \n![Image](img/1012-1.jpg)\n\n图 10.4：内存驻留\n\nBLU 加速是一种即时解决方案，以思维的速度提供所需的数据。这是管理任何流体化资源的正确方法。\n\
  \n## 管理数据库内存\n\n在数据库性能分析中使用的一个度量因素是页面驻留率。这是数据库页留在物理内存（RAM）中的时间。在设置性能基准后，务必维护数据与内存的比例。随着数据增长，增加物理内存以保持该比例：\n\
  \n![Image](img/1012-2.jpg)\n\n你可以将数据库执行时间分为计算时间、I/O 时间和网络时间。本地事务（在数据库所在的同一服务器上执行的事务）没有网络时间。所有数据库页都在内存中的事务没有\
  \ I/O 时间。因此，在这种情况下，事务的执行时间等于计算时间。\n\n![Image](img/note.jpg)\n\n注意：在内存中被固定或频繁访问的数据页将留在内存中，且不会发生\
  \ I/O。\n\n那么，对于在数据库中执行的工作负载，内存需求是什么？为了回答这个问题，只需在结构化测试中运行相同的工作负载，并增加缓冲池存储，直到不再发出物理\
  \ I/O。\n\n数据库中执行的每个 SQL 语句对于交付的整体工作都同等重要吗？在大多数情况下，你对数据库中执行的工作会有分类。所以再次，为什么要加载你不需要内存数据？此外，为什么要实现一种在所有数据无法放入物理\
  \ RAM 时就会失效的技术呢？\n\n无磁盘数据库（数据库仅将数据存储在内存中从不存储在磁盘上）会将数据存储在二三个不同的内存位置以实现冗余。在计划关机的情况下，数据写入磁盘是为了在数据库管理系统重启后读取。\n\
  \n然而，这种情况可能永远不会发生，因为数据库软件管理数据，内存数据库需要提供这些管理服务（例如：简单的事务恢复、锁定、安全、版本控制和数据完整性）。此外，将数据库文件移动到固态硬盘（SSD）或闪存更安全，且接近内存性能。\n\
  \n物理内存要产生真正的业务影响，需要以下条件（另见图 10.5）：\n\n*   业务代码运行的位置（本地内存）\n*   特定于正在处理的业务对象的组织或结构\n\
  *   根据工作负载在本地进行调整和管理\n*   具有动态扩展性的 N 激活缓存一致性\n\n如果你正确配置了数据库的内存分配，将整个数据库放入物理 RAM\
  \ 将导致在合理的执行时间内，重要工作负载的性能没有产生可衡量的差异。\n\n![Image](img/1014-1.jpg)\n\n图 10.5：内存规划\n\
  \n## 单指令多数据 (SIMD)\n\n大多数数据通过标量操作进行处理，即对每部分数据使用一条 CPU 指令。SIMD 通过数组处理来实现，每条指令处理 128\
  \ 位的数据。\n\n如果你想确定服务器上是否有可用 SIMD 指令集，请创建一个 `db2` 实例并启动它。在 `db2diag.log` 文件中，你将看到服务器的特征，如果可用，它将包含\
  \ SIMD：\n\n![Image](img/1014-2.jpg)\n\n或者，你可以写一些 C 代码并执行 SIMD 指令来查看它是否有效。\n\n##\
  \ 压缩\n\n压缩拥有丰富的技术历史。使用 Lempel-Ziv 算法变体的行压缩开启了序幕。随后，IBM 在 DB2 10.1 中引入自适应压缩之前，营销了深度压缩。在\
  \ DB2 10.5 中，我们获得了可操作压缩（actionable compression）。\n\n自适应压缩提供了表级和页级压缩字典，因此如果行压缩无法完成任务，页级压缩可以。可操作压缩允许以压缩格式更高效地处理数据。\n\
  \n任何压缩技术的关键有效性取决于数据能保持压缩状态多久。值越能保持压缩状态，效果越好。\n\nIBM DB2 10.5 在处理过程中（包括分组和许多谓词操作）保持数据和索引键压缩，允许数据保持压缩的时间越长。数据越压缩，性能越好，这就是为什么被称为加速。\n\
  \n以下两个 `CREATE TABLE` 语句之间的唯一区别在于它们的组织方式：\n\n![Image](img/1015-1.jpg)\n\n假设你将图 10.6\
  \ 中的数据加载到这两个表中，然后执行此命令：\n\n![Image](img/1015-2.jpg)\n\n\n\n\n当你使用标量操作时，每个数据库页面都会被加载到缓冲池，然后进入\
  \ CPU 缓存。随后会对每行执行等值（=）操作，每行执行一条指令。因此，对包含 14 行的表进行扫描将产生 14 条指令。如果你在 `Name` 列上建立索引，则只有两行会匹配，并将执行两条指令。\n\
  \n使用数组操作（SIMD）将数据移动到 CPU 缓存的 128 位寄存器中，并执行一次等值（=）指令。\n\n虽然在这个例子中，索引访问标量操作可能更快，但如果表有\
  \ 500 亿行，或者每个包含 `Street` 的页面都是已知的并已索引的呢？有了这两项变化，列式存储将会快几个数量级。如果你将 `Name` 压缩到 100%，所有\
  \ 14 行都可以被容纳并使用一条指令完成执行。\n\n总结一下，列式表没有用户定义的索引，因此没有索引需要维护。如果你想搜索 `Object_Value` 或\
  \ `Object_Name`，你需要两个索引。在列式表中，`Object_Value` 和 `Object_Name` 都有页面，你只需要访问包含你正在搜索的值的页面。表\
  \ 10.8 列出了列式表的局限性。\n\n![Image](img/1016.jpg)\n\n*图 10.6: 键/值对*\n\n| 表 10.8: 列式表限制\
  \ |\n\n| 限制 | 描述 |\n| :--- | :--- |\n| GENERATED ALWAYS AS | 不能定义“生成”列 |\n| COMPRESS\
  \ YES | 默认值；无法指定 |\n| CREATE INDEX | 不能创建用户定义的索引 |\n| RUNSTATS | 无需；自动收集 |\n| Range\
  \ partitioned table | 不支持 |\n| APPEND MODE | 不支持 |\n| CREATE TRIGGER | 不支持 |\n\n\
  ## 缓冲池管理器\n\n在内存中保留事务型工作负载所需的数据是性能的关键因素之一。数据页和索引页在缓冲存储之间进进出，基本思想是只在内存中保留需要的内容。由于扫描页面数量巨大，异步页面抓取可能会占用缓冲池空间。避免这种情况的技术包括限制异步预取可以占用的缓冲池空间，从而为同步处理留出缓冲池空间。\n\
  \nDB2 部署了许多页面缓存技术来管理缓冲池存储。你可能识别其中一些，例如最近最使用（MRU）、最少使用（LRU）、先进先出（FIFO）或后进先出（LILO）。\n\
  \n对于列式表，一切都是扫描，因此需要一种管理缓冲池的新方法。在 DB2 10.5 中，IBM 引入了一种名为扫描友好页面缓存（SFPC）的新技术，你可以在图\
  \ 10.7\n\n**注意**：记住，只有包含列值的页面会被加载。\n\n然而，并非所有数据都是均匀。在某些情况下，扫描的值可能大于可用缓冲池存储容量。在图\
  \ 10.7 的示例中，`‘Smith’` 将无法完全放入缓冲池，这意味着页面会被牺牲（victimized），最后加载的页面留在池中。如果你开始第二次扫描，该过程将重复，那些仍在池中的页面将首先成为牺牲对象。这个过程将持续重复，没有任何缓存命中。\n\
  \n如果你在处理 `‘Smith’` 时将前 25% 留为不牺牲页面，那么当 `‘Smith’` 进程结束时，前 25% 的页面将留在缓冲池中（参见图 10.8）。如果你对\
  \ `‘Smith’` 执行第二次扫描，前 25% 已经缓存，第二次扫描将把前 25% 留在缓冲池中。随着扫描的持续，缓存百分比应该会增加。\n\n![Image](img/1017.jpg)\n\
  \n*图 10.7: 缓冲池中的被牺牲页面*\n\n![Image](img/1018.jpg)\n\n*图 10.8: 留出前 25% 作为不牺牲页面*\n\n\
  ## 多核并行\n\n对于 IBM DB2 BLU，越大越好。如果你为 BLU 提供资源，它就会使用。\n\n那么，你如何知道需要什么尺寸的服务器呢？确定这一点的一种方法是在不断增加资源上运行相同的工作负载，直到工作负载的执行时间不再提高。使用虚拟服务器，这是可能的。这里有一个总结此点的公式：`BLU\
  \ TIME IMPROVES = COMPRESSION (~100%) + REGISTERS + H-THREADS + MEMORY.`\n\n![Image](img/note.jpg)\n\
  \n**注意**：记住，如果压缩率很差，世界上所有的硬件都没有用。\n\n想一下，把 BLU 想象成一辆直线赛车。在图 10.9 中，BLU 的所有引擎都在运转，等待红灯变绿（SQL）。\n\
  \n![Image](img/1019-1.jpg)\n\n*图 10.9: 空闲服务器*\n\n图 10.10 显示了灯变绿时的 BLU（正在运行一个 SQL\
  \ 语句）。\n\n![Image](img/1019-2.jpg)\n\n*图 10.10: 运行一个 SQL 语句的 BLU*\n\n在图 10.11 中，你看到四个\
  \ SQL 语句尝试同时运行。\n\n![Image](img/1020.jpg)\n\n*图 10.11: 运行四个 SQL 语句的 BLU*\n\n如你在图\
  \ 10.11 中看到的，一台 12 物理核心的 VMware/Red Hat 服务器（24 个虚拟核心）空闲率仅为 1.9%。这对于任何数据库工作负载来说都是难以实现的。\n\
  \n![Image](img/note.jpg)\n\n**注意**：将 CPU 忙率作为操作告警或容量指标对于 BLU 工作负载或 pureScale CF\
  \ 工作负载将无效。\n\n## 数据跳过\n\n数据跳过是定位查询所需页面的过程。使此工作的信息存储在摘要表（synopsis table）中。\n\n每个用户列组织表都有一个摘要表。DB2\
  \ 系统构建并维护该摘要表，它位于 `sysibm` 模式下。由于也创建了系统索引，表定义应包含一个独立的索引空间。LOB 对象尚未受到支持，因此你不需要长表空间。\n\
  \n摘要表包含标识要跳过的列页面的元数据。这是通过在摘要表中记录每 1,24 行一组的列的最小值和最大值来实现的。\n\n考虑以下查询：\n\n![Image](img/1021-1.jpg)\n\
  \n在这种情况下，TSN 7168 到 8191 将被扫描。元组序列号（TSN）有助于从列数据中组装行。表 10.9 显示了该表内容的摘要。\n\n![Image](img/1021-2.jpg)\n\
  \n![Image](img/note.jpg)\n\n**注意**：摘要表中最小的页面分组约为 1,000 个页面。CHAR 和 VARCHAR 的长度限制为\
  \ 1,000 个字符。从 DB2 V10.5 开始，FP4 Cancun 支持大多数数据类型。\n\n## 深入研究 BLU\n\n让我们仔细观察如何设置环境来运行\
  \ BLU 和 OLTP 工作负载。请注意，你有足够的灵活性在环境中以不同的方式构建和管理 BLU。书中使用的几个术语在此讨论范围内具有相同含义：BLU、BLU\
  \ Acceleration、列式、按列组织和内存中。\n\nBLU Acceleration 是超级分析，超级简单。以下列表解释了如何做到：\n\n1.  无论是行式还是列式，安装和配置\
  \ DB2 实例和数据库的方法相同。只需安装带有 BLU 许可的软件即可。\n\n2.  列式和行工作负载都可以在同一个数据库中运行（不推荐）。\n\n3. \
  \ 现有的工具同时适用于行和列（例如，`Load` 和 `Reorg`）。\n\n4.  将行组织表转换为列组织表非常简单。\n\n\n\n\n\n5. 使用影子表，DB2\
  \ 将决定按列还是按行执行查询是最优的。您无需对您的应用程序进行任何更改。\n\n6. 不需要 `RUNSTATS` 命令。\n\n7. 无需维护用户索引。\n\
  \n8. 越多越好，但较少也能运行！所有数据并不非都要放入 RAM 中，您也不需要提前预估大小并购买您永远用不到的硬件。您可以随着工作量的增加而扩展平台。\n\n\
  9. 支持对列组织表进行完整的 DML 操作。\n\n由于转向了 `ASM` 和 `STMM` 自动化的趋势，BLU Acceleration 和 pureScale\
  \ 现在都是构建在这些管理程序之上的。\n\n以下是列组织表的数据库要求：\n\n* 数据库必须启用 `ASM`。\n* 表空间必须启用自动空间重归（automatic\
  \ space reclaim）。\n* 必须使用 `Identity` 或 `Identity-16` 位。\n* 字符集必须为 `Unicode`。\n*\
  \ 不涉及 `pureScale`。\n* 不涉及 `DPF`。\n* 需要 UNIX 操作系统（Linux 或 AIX）。\n* 需要 `db2aese` 或\
  \ `db2awse` 许可证。\n* `SORTHEAP` 和 `SHEAPTHRES_SHR`不能由 `STMM` 控制。\n* `UTIL_HEAP_SZ`\
  \ 是自动的，但您需要将默认大小设置为 1 MB 到 6 MB 页之间。\n\n![Image](img/note.jpg)\n\n**注意：** 上述未列出\
  \ `DB2_WORKLOAD=ANALYTICS` 是因为它不是必须；然而，它确实让 BLU 的设置变得更容易。\n\n如果您想识别数据库中所有用户定义的列组织表，请执行以下\
  \ SQL 查询：\n\n![Image](img/1023-1.jpg)\n\n要获取行组织用户表的列表，请使用 `TABLEORG = ‘R’`。\n\n\
  ## 在数据库服务器上分离行和列实例\n\n假设您有一个数据库服务器（虚拟机、LPAR 或裸机），它拥有 16 个核心和 96 GB 内存。您的计划是根据服务器大小，按\
  \ 75/25 的百分比划分，为每个 DB2 实例分配资源。表 10.10 显示了服务器上的列负载和行负载。\n\n![Image](img/1023-2.jpg)\n\
  \n您使用以下命令创建并启动实例 `db2blu01`：\n\n![Image](img/1023-3.jpg)\n\n检查 `db2diag.log`，您看到\
  \ SIMD 已启用：\n\n![Image](img/1023-4.jpg)\n\n要创建并启动实例 `db2row01`，请执行以下命令：\n\n![Image](img/1023-5.jpg)\n\
  \n您计划将 BLU 负载设置在 `db2blu01` 实例中，将 OLTP（行）设置在 `db2row01` 实例中。\n\n对于 `db2blu01`，设置注册参数：\n\
  \n![Image](img/1024.jpg)\n\n对于 `db2row01`，设置注册参数：\n\n![Image](img/1024-1025.jpg)\n\
  \n您使用相同的脚本创建数据库 `db2row01:OLTPDB` 和 `db2blu01:BLUDB`，但为每个数据库设置了正确的值。每个数据库有五个 `STOGROUPS`\
  \ 和 10 条数据路径。每个数据库中定义了四个缓冲池。\n\n`BLUDB` 的脚本输出如下：\n\n![Image](img/1025.jpg)\n\n![Image](img/1026.jpg)\n\
  \n![Image](img/1027-1.jpg)\n\n数据库 `BLUDB` 现在具有以下数据库配置：\n\n![Image](img/1027-2.jpg)\n\
  \n数据库 `OLTPDB` 现在具有此数据库配置：\n\n![Image](img/1027-3.jpg)\n\n您应该为所有 DB2 数据库设置一些常用的最佳实践值，因此请对您刚刚创建的两个数据库执行此操作：\n\
  \n![Image](img/1027-4.jpg)\n\n分配给每个数据库的存储组如下：\n\n* `T1_DATA` 是数据的第 1 层存储，两个数据路径均定义为\
  \ SSD。\n* `T1_INDX` 是索引的第 1 存储，两个数据路径均定义为 SSD。\n* `T2_DATA` 设置为默认，是数据的第 2 层存储，四个数据路径均定义为硬盘驱动器（HDD）。\n\
  * `T2_INDX` 是索引的第 2 层存储，四个数据路径均定义为 HDD。`TEMP` 用于系统临时表空间，它们是数据库中唯一的 SMS 定义表空间。\n\n\
  在创建 4 KB 系统临时表空间之前，无法删除生成的系统表空间 `TEMPSPACE1`。无论 DB2 数据库的用途如何，请始终同时创建 4 KB 和 32 KB\
  \ 的系统临时表空间，如下例所示。您可以创建其他大小，例如 8 KB 或 16 KB，但它们不是必须的。\n\n![Image](img/1028.jpg)\n\
  \n您还需要创建 DMS 用户表空间，以便能够创建表和索引。\n\n这两者都在第 1 层存储池中，这意味着两个容器都于 SSD 上：\n\n![Image](img/1028-1029.jpg)\n\
  \n这两者都在第 2 层存储池中，意味着两个容器都在 HDD 上：\n\n![Image](img/1029-1.jpg)\n\n注意表空间的命名，上述两个示例使用“A”表示数据，使用“X”表示索引表空间；它们还将从\
  \ 10100 到 19900 的 SSD 表空间分为一组，并将 20100 到 29900 的 HDD 分一组。\n\n现在您需要根据您的物理分区方案设置 DBM\
  \ 和数据库配置，以隔离这两个负载。对于 `db2blu01`，将实例内存保持在 72 GB 以内。除了 `UTIL_HEAP_SZ` 外，这是可能的。\n\n\
  将 `INSTANCE_MEMORY` 设置为 71 GB 并留出 1 GB 给操作系统或其他分配：\n\n![Image](img/1029-2.jpg)\n\
  \n对于 `DATABASE_MEMORY`，将其设置为 `AUTOMATIC:`：\n\n![Image](img/1029-3.jpg)\n\n对于 BLU\
  \ 负载还有三个关键的数据库配置设置。其中两个设置不是自动的：`SHEAPTHRES_SHR` 和 `SORTHEAP`。\n\n对于 `BLUDB`，设置 `SHEAPTHRES_SHR`\
  \ 为 `DATABASE_MEMORY` 的 50%，并将 `SORTHEAP` 为 10%：\n\n![Image](img/1030-1.jpg)\n\n\
  `UTIL_HEAP_SZ` 对于 BLU 的运行至关重要。列表支持完整的 DML，数据主要通过 `Load` 或 `Ingest` 工具填充。\n\n`Load`\
  \ 工具有三个阶段。第一阶段是分析整个输入键。第二、第三阶段对所有加载都是相同的。\n\n`UTIL_HEAP_SZ` 不受 `INSTANCE_MEMORY`\
  \ 或 `DATABASE_MEMORY` 的限制。内存不再需要时会被释放。\n\n典型 BLU 安装的良好设置为 4 MB 到 6 MB 页之间。用堆过小会显著影响加载压缩，从而影响\
  \ BLU 查询的性能。\n\n当加载开始时，它获取整个用堆。如果启动另一个加载，内存将从第一个加载转移到第二个加载。此过程将对并发加载持续。\n\n对于 `BLUDB`，将\
  \ `UTIL_HEAP_SZ` 设置为 4 MB `AUTOMATIC`：\n\n![Image](img/1030-2.jpg)\n\n此时，停止并启动您的实例以确保一切都是新的且就绪的：\n\
  \n![Image](img/1030-3.jpg)\n\n现在，将注意力转向 `db2row01`，它是您的 OLTP 负载实例。将 `INSTANCE_MEMORY`\
  \ 设置为 (24–1) GB：\n\n![Image](img/1030-4.jpg)\n\n对于 `DATABASE_MEMORY`，保持设置为 `AUTOMATIC:`：\n\
  \n![Image](img/1030-5.jpg)\n\n您可以根据负载需求调整其余 DBM 和 DB 设置。无需更改 OLTPDB 的任何 STMM 设置。\n\
  \n为了成功您还有一个重要的设置要执行：限制每个 DB2 实例可以消耗的核心数。如果不这样做，`db2row01` 可能无法获得足够的 CPU。因此，将 `db2blu01`\
  \ 的 `MAX_QUERYDEGREE` 设置为 `12`，将 `db2row01` 设置为 4。\n\n当您设置 `DB2_WORKLOAD=ANALYTICS`\
  \ 时，内部并行会自动设置，尽管 DBM 设置显示为 No。但如果 `MAX_QUERYDEGREE` 不是 `ANY`，您必须手动设置 `INTRA_PARALLEL=YES`\
  \ 以便列组织负载工作：\n\n![Image](img/1031.jpg)\n\n一旦循环两个实例，您就准备好在同一台服务器上成功运行 OLTP 和列（分析）负载了。\n\
  \n\n\n\n\n由于磁盘驱动器上密集的读取活动导致 OLTP 读事务变慢，你可以为 DML `READ` 设置一个工作类（work class），并将预取（I/O）优先级设置得高一些。这可能防止行预取读取等待在列预取读取之后。\n\
  \n## BLU 社交\n\n你可以通过三种方式开始使用 BLU：通过 BLU Central ([www.ibmbluhub.com/get-blu](http://www.ibmbluhub.com/get-blu))、云端版\
  \ BLU ([www-01.ibm.com/software/data/dashdb](http://www-01.ibm.com/software/data/dashdb))\
  \ 或下载 BLU 试用版（需要 IBM ID——[www14.software.ibm.com/webapp/iwm/web/preLogin.do?source=swg-dm-db2trial&S_CMP-BLUhub](http://www14.software.ibm.com/webapp/iwm/web/preLogin.do?source=swg-dm-db2trial&S_CMP-BLUhub)）。\n\
  \n## 物理设计\n\n本节回顾了 DBA 执行的 DB2 10.5 任务。你已经有一个运行良好的实例，并准备好构建和管理数据库。本节的重点是 BLU、pureScale\
  \ 的重大进展以及 DB2 10.5 中引入的业务规则变更。\n\n## 统计收集\n\n在某些情况下，会收集与 `RUNSTATS` 相关的统计信息，而在其他情况下则不会。使用表函数可以确定统计收集正在执行还是正在等待运行。\n\
  \n实时统计收集（RTS）输出存储在统计缓存中，并可供数据库代理后续语句使用。缓存的统计信息稍后由守护进程在处理 `WRITE_STATS` 请求时写入数据库目录。\n\
  \n在语句编译期间，`db2agent` 进程可能会因为以下任何因素颁发 `COLLECT_STATS` 请求：\n\n* 分配的收集时间少于完成一次同步全量非抽样收集所需的时间。\n\
  * RTS 确定新的统计信息会有帮助，但对于正在处理的 SQL 语句并非必需。\n* RTS 确定优先选择同步生成。\n* 考虑到表的大小，RTS 确定优先选择样本同步收集。\n\
  \n你可以使用以下 SQL 查询来获取 RTS 处理的状态信息：\n\n![Image](img/1032.jpg)\n\n`REQUEST_STATUS` 有三种可能的状态：`EXECUTING`、`QUEUED`\
  \ 或 `PENDING`。你最多可以有一个处于 `EXECUTING` 状态的表。RTS 每五分钟检查一次 `PENDING` 请求，并将请求置于运行队列。\n\
  \n要获取自动 `RUNSTATS` 异步处理的状态信息，请执行以下 SQL 查询：\n\n![Image](img/1032-1033.jpg)\n\n表的异步统计信息收集将显示为\
  \ `OBJECT_STATUS` 为 `JOB_SUBMITTED`，而其他等待评估的表将具有状态 `EVALUATION_PENDING`。自动统计分析（ASP）在\
  \ DB2 10.1 中被弃用，并在 10.5 中断开。它被 Data Studio 中的统计顾问（Statistics Advisor）取代。\n\n## 数据库\n\
  \n在开始构建数据库之前，请考虑这些点。BLU 和 pureScale 要求启用启用 ASM 的数据库。两者都需要 Unicode 字符集以及 `IDENTITY`\
  \ 或 `IDENTITY_16BIT` 排序规则。对于列组织表，你必须定义启用了自动空间回收的表空间。\n\n![Image](img/note.jpg)\n\
  \n**注意：** 默认是 AUTOMATIC（自动），并且很快可能会移除 AUTOMATIC STORAGE NO 选项。\n\n你使用 `CREATE DATABASE`\
  \ 命令创建数据库。以下示例为数据库 `DB_COL` 提供了四个 `STORAGE PATHS`：`'/db/tsOT, ‘/db/ts02’, ‘/db/ts03’,\
  \ ‘/db/ts04’`。\n\nDB_HOME 或 DBPATH 为 `'/db/home’`，与 INSTHOME 相同：\n\n![Image](img/1033-1.jpg)\n\
  \n对于 pureScale 数据库，命令相同：\n\n![Image](img/1033-2.jpg)\n\n默认排序规则是 IDENTITY，字符集是 UTF-8。`INSTANCE\
  \ SHARE SQLLIB` 在实例创建时生成，并由挂载点 `‘db2sd_<timestamp>’` 标识。\n\npureScale 的 `DBPATHs`\
  \ 是 GPFS 文件系统。因此，对于 pureScale `CREATE DATABASE` 命令，你在命令中指定的所有挂载点在集群的所有成员之间都是共享的。\n\
  \n![Image](img/note.jpg)\n\n**注意：** pureScale 目前仅支持行组织表。如果你使用 ASM、STMM、Unicode 和\
  \ IDENTITY，创建 BLU 数据库与创建标准行数据库没有区别。区别在于如何以及通过什么配置它们。\n\n## 存储组\n\n存储组提供了管理表空间容器的良好方法。`CREATE\
  \ STORAGE GROUP` 语句在数据库内创建一个新的存储组，分配容器路径，并在目录中记录定义和属性。你应该在存储组中定义 `OVERHEAD` 和 `DEVICE\
  \ READ RATE`，而不是在表空间中。数据库中只有一个存储组具有 `SET AS DEFAULT` 属性。任何作为 `MANAGED BY AUTOMATIC\
  \ STORAGE` 但未使用 `USING STOGROUP` 创建的表将自动分配给默认存储组。\n\n存储组必须至少有一个存储路径。你可以在引号中用逗号分隔多个存储路径（最多\
  \ 128 个）。存储路径是根据操作系统挂载并可访问的文件系统。在 pureScale 中，你不能从存储组中删除存储路径。\n\n要创建存储组，请执行 `CREATE\
  \ STOGROUP` 命令。该命令的语法如下：\n\n![Image](img/1034.jpg)\n\n| where: |\n| :--- | :---\
  \ |\n| *StorageGroupName* | 标识存储组的唯一名称 |\n| *StoragePaths* | 标识存储路径 |\n| *OverheadRate*\
  \ | 标识确定 I/O 成本的毫秒数 |\n| *ReadRate* | 每秒传输速率 |\n\n要添加存储路径或更改属性，并在 ESE (LUW) 中删除存储路径，请使用\
  \ `ALTER STOGROUP` 语句。新添加的路径将被新创建的表空间使用。使用 `ALTER TABLESPACE REBALANCE` 语句将现有表空间容器重新分配到所有路径。\n\
  \n使用 `ALTER STOGROUP` 语句将存储路径添加到存储组：\n\n![Image](img/1035-1.jpg)\n\n当你从存储组删除存储路径时，存储组的状态将变为\
  \ `DROP PENDING`，直到使用该路径的所有表空间完成重新分配。任何新的表空间都不会使用该路径。一旦路径不再被使用，存储组的状态将变为 `NORMAL`，路径将被移除。\n\
  \n使用 `ALTER STOGROUP` 语句从存储组中删除存储路径：\n\n![Image](img/1035-2.jpg)\n\n## 表空间\n\n表空间由称为容器的磁盘空间组成。表和索引隐式或显式地分配给表空间。使用\
  \ `CREATE TABLESPACE` 语句将在数据库内定义新的表空间，分配容器并在目录中记录表空间的定义和属性。\n\n你可以通过 `SYSTEM(SMS)`、`DATABASE(DMS)`\
  \ 或 `AUTOMATIC STORAGE(AS)` 管理表空间。pureScale 仅支持 AUTOMATIC STORAGE(AS)。这些管理类型在磁盘空间的方式各异。在\
  \ ESE (LUW) 数据库中，除了 `SYSTEM TEMPORARY` 表空间，通常将所有表空间定义为 DMS。\n\n考虑以下 `CREATE LARGE\
  \ TABLESPACE` 命令的语法：\n\n![Image](img/1035-1036.jpg)\n\n| where: |\n| :--- | :---\
  \ |\n| *TablespaceName* | 标识表空间的唯一名称 |\n| *GroupName* | 标识数据库分区组 |\n| *PageSize*\
  \ | 标识页大小（4 KB, 8 KB, 16 KB 或 32 KB） |\n| *ManagementType* | 标识管理类型（SYSTEM, DATABASE\
  \ 或 AUTOMATIC STORAGE） |\n| *StorageGroupName* | 标识存储组；仅限 ASM |\n| *ExtentSize*\
  \ | 标识分配范围区大小 |\n\n\n\n\n\n| `BufferPoolName` | 标识缓冲池 |\n| :--- | :--- |\n| `InitialSize`\
  \ | 标识创建时的分配大小 |\n| `IncreaseSize` | 标识增长大小 |\n| `MaxSize` | 标识最大分配大小 |\n\n如果你想更改表空间的属性，请使用\
  \ `ALTER TABLESPACE` 语句。你可以修改表空间几乎所有的属性，除区大小（extent size）、页大小和初始大小。在 pureScale 中，表空间的存储组（storage\
  \ group）无法更改。要将其移动到不同的存储组，必须删除并重新创建表空间。\n\n## 表\n\n行组织表和列组织表可以存在同一个数据库中。如果定义了任何列组织表，你应该为列定义数据库配置设置。\n\
  \n如前所述的，使用注册表参数 `DB2_WORKLOAD=ANALYTICS` 将为列处理设置好一切，但 `SHEAPTHRES_SHR` 和 `SORTHEAP`\
  \ 除外。`UTIL_HEAP_SZ` 被设置为 `AUTOMATIC`，但你可能需要手动增加初始大小。\n\n以下是一个带有自适应压缩的行组织表的 `CREATE\
  \ TABLE` 语句：\n\n![Image](img/1037.jpg)\n\n建议在构建构建的所有 `CREATE TABLE` 语句中始终指定 `ORGANIZE\
  \ BY` 子句。`COMPRESS` 子句仅对比组织表以及所有的 `CREATE INDEX` 语句有效。关键字 `ADAPTIVE` 仅适用于行组织表。\n\
  \n以下是一个列组织表的 `CREATE TABLE` 语句：\n\n![Image](img/1037-1038.jpg)\n\n![Image](img/note.jpg)\n\
