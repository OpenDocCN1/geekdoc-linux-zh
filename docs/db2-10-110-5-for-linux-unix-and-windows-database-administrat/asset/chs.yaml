  \n![Image](img/532-1.jpg)\n\n## db2val 命令\n\n有时你可能重新检查已安装的 DB2 文件和实例设置。你可以使用 DB2\
  \ 验证 `(db2val)` 命令验证安装文件、实例设置、数据库和本地连接。`db2val` 命令的基本语法为：\n\n![Image](img/532-2.jpg)\n\
  \n| where: |\n| :--- | :--- |\n| `InstanceName` | 识别要验证的实例名称 |\n| `DBName` | 识别要验证的数据库名称\
  \ |\n| `TraceFile` | 识别跟踪文件名；仅对 UNIX 系统有效 |\n| `LogFile` | 识别记录验证过程和结果的完整文件名 |\n\
  \n如果你想验证 root 安装的实例 `db2inst1` 和数据库 `SAMPLE`，请使用 UNIX 系统上的 root 用户运行此类命令：\n\n![Image](img/533-1.jpg)\n\
