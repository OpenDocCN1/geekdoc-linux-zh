  # 答案\n\n### 问题 1\n正确答案是 **D.** 将 DB2 注册参数 `DB2_WORKLOAD` 设置为 `ANALYTICS` 会导致对数据库管理器和数据库的更改。\n\
  \n### 问题 2\n正确答案是 **D.** BLU 加速是 DB2 10.5 的关键功能之一，决策支持系统或分析查询领域的规则改变者。\n\n### 问题\
  \ 3\n正确答案是 **A.** 通过将数据库配置参数 `OPT_DIRECT_WRKLD` 设置为 `ON` 来激活 EHL。该参数是动态的。\n\n###\
  \ 问题 4\n正确答案是 **D.** `DB2_WORKLOAD=ANALYTICS` 将根据列式工作负载合理调整数据库参数 `SORTHEAP` 和 `SHEAPTHRESH_SHR`\
  \ 的大小。这两个参数不是自动的，因此随着服务器规模或工作负载的变化，可能需要进行调整。\n\n### 问题 5\n正确答案是 **I.** 鉴于特定的示例，你可以使用三个选项中的任何一个来解决问题。\n\
  \n### 问题 6\n正确答案是 **C.** 虽然 B 可能有效，甚至可能比任何其他选项更减少 CF 开销，但将所有批处理限制在一个成员上运行是简单又快速的，可能会提供必要的缓解。有时，简单易易的解决方案往往能产生最好的结果。\n\
  \n### 问题 7\n正确答案是 **E.** BLU 从未见过任何它不喜欢的内核。\n\n### 问题 8\n正确答案是 **D.** 当你将 DB2 注册变量\
  \ `DB2_WORKLOAD` 设置为 `ANALYTICS` 时，DB2 会创建一个页大小为 32K 的数据库。任何列数据库的默认参数设置如下：\n\n![Image](img/1162.jpg)\n\
  \n### 问题 9\n正确答案是 **G.** 但答案与 `DB2_WORKLOAD` 无关，因为所有新数据库的默认值都是 `AUTOMATIC`。\n\n\
  ### 问题 10\n正确答案是 **A.** 在同一个数据库中同时拥有行组织和列组织表是可能的。\n\n### 问题 11\n正确答案是 **B.** `DB2_WORKLOAD=ANALYTICS`\
  \ 会创建一个默认的空间回收策略并设置 `AUTO_REORG=ON`。这两个设置对于列表的空扩展区自动返回到表空间都是必需的。\n\n### 问题 12\n\
  正确答案是 **D.**\n\n### 问题 13\n正确答案是 **C.** 虽然在适当设置下会自动执行扩展区回收，但也可以运行 `REORG TABLE`\
  \ 来完成这项工作。\n\n### 问题 14\n正确答案是 **E.** pureScale 不支持列组织表。\n\n### 问题 15\n正确答案是 **F.**\
  \ 快照和活动监控器可以为查询工作负载调优器产生数据。\n\n### 问题 16\n正确答案是 **E.** `DB2_WORKLOAD` 在设置处理方面做了很大工作。\n\
  \n### 问题 17\n正确答案是 **E.** 阈值被设置为 150000。\n\n### 问题 18\n正确答案是 **D.** 使用 `DB2_WORKLOAD=ANALYTICS`，新数据库将定义并激活\
  \ `WLM` 设置来管理工作负载。\n\n### 问题 19\n正确答案是 **D.** 这是行加载和列加载之间唯一的区别。\n\n### 问题 20\n正确答案是\
  \ **B.** 它是对数据的向量处理。\n\n### 问题 21\n正确答案是 **D.** 复制 MQT 表需要某些延迟。延迟会有不同，但确实需要某些延迟。\n\
  \n### 问题 22\n正确答案是 **A.** 表是空的。\n\n### 问题 23\n正确答案是 **B.** 在 10.5 A 和 ASM 中需要 Unicode。\n\
  \n### 问题 24\n正确答案是 **E.**\n\n### 问题 25\n正确答案是 **F.** 返回的结果集未经过压缩。\n\n### 问题 26\n\
  正确答案是 **F.**\n\n### 问题 27\n正确答案是 **E.**\n\n### 问题 28\n正确答案是 **D.** 查询优化器在确定最佳计划时会考虑\
  \ `ENFORCED` 强制唯一约束。\n\n### 问题 29\n正确答案是 **D.**\n\n### 问题 30\n正确答案是 **A.** 需要归档日志。\n\
  \n### 问题 31\n正确答案是 **B.** 索引在列表中被删除且未定义。如果定义了触发器，请删除它，然后就可以进行表转换。\n\n### 问题 32\n\
  正确答案是 **D.** pureScale 尚不支持表空间传输。\n\n### 问题 33\n正确答案是 **I.** 随着每次发布，IBM 都让 pureScale\
  \ 更加接近可用。删除一个成员以及 DB2 版本或发布升级都需要完整的 pureScale 周期。\n\n### 问题 34\n正确答案是 **D.**\n\n\
  ### 问题 35\n正确答案是 **C.**\n\n### 问题 36\n正确答案是 **A.**\n\n### 问题 37\n正确答案是 **A, B, D,**\
  \ 和 **F.** 仅支持 `ASYNC` 和 `SUPERASYNC`。\n\n# 第 11 章 DB2 10.1/10.5 题库\nDB2 10.1/10.5\
