  \ `Name to Name`（名称到名称）（图 10.52）。\n\n![Image](img/1092-1.jpg)\n\n*图 10.51：配置设置——使用自动映射*\n\
  \n![Image](img/1092-2.jpg)\n\n*图 10.52：按名称自动映射列*\n\n总结一下，你已经定义了 MQT 表，并设置了订阅服务来在行表和\
  \ MQT 表之间同步数据。此时，MQT 是空的，而行表有（例如）150 MB 的数据。\n\n你现在需要使用 `FastLoad` 初始填充 MQT，然后设置持续复制以保持两个表保持同步。右键点击订阅并点击`Start\
  \ Refresh,`（开始刷新），如图 10.53 所示。\n\n![Image](img/1093.jpg)\n\n*图 10.53：启动表刷新*\n\n\
  ![Image](img/1094-1.jpg)\n\n*图 10.54：监控刷新状态*\n\n![Image](img/1094-2.jpg)\n\n*图 10.55：刷新统计概述*\n\
  \n![Image](img/1094-3.jpg)\n\n*图 10.56：活动刷新统计*\n\n![Image](img/1094-4.jpg)\n\n*图\
  \ 10.57：监控镜像表状态*\n\n切换到 `Monitoring`（监控）选项卡查看订阅状态是否为“refreshed”（已刷新）（参见图 10.54 中的`Collect\
  \ Statistics`（收集统计）选项卡，然后点击`Overview`（概述），或点击图 10.56 中的`Activity`（活动）选项卡。\n\n一旦刷新完成，将持续复制设置为`Mirroring`（镜像），如图\
  \ 10.57 所示。行表数据的更改现在将复制到 MQT。\n\n创建的 DB2 对象应包括摘要表，以及摘要索引和主键（唯一）索引。\n\n检查延迟表以查看复制是否正在更新与行表和\
