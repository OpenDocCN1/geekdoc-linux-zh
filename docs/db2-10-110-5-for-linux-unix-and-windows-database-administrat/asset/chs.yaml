  \ 到 59 的两位）SSS—毫秒（000 到 999 的三位数）TT—上午/下午标识（AM 或 PM）一个有效时间格式示例为：“YYYY/MM/DD HH:MM:SS.UUUU”\
  \ | 分隔 ASCII (DEL) |\n| `nodoubledel` | 指示不识别双字符分隔符 | 分隔 ASCII (DEL) |\n| 1 | 指定创建一个兼容\
  \ Lotus 1-2-3 Release 1a 的 WSF 文件；除非另有说明，否则默认生成兼容 Lotus 1-2-3 Release 1a 的文件 | WSF\
  \ |\n| 2 | 指定创建一个兼容 Lotus Symphony 1.0 的 WSF 文件 | WSF |\n| 3 | 指定创建一个兼容 Lotus 1-2-3\
  \ Version 2 或 Lotus Symphony 1.1 的 WSF 文件 | WSF |\n| 4 | 指定创建一个包含 DBCS 字符的 WSF 文件\
  \ | WSF |\n| *改编自 IBM DB2 10.1 参考* 表 10–12 |\n\n因此，如果你想将名为 `DEPARTMENT` 的表导出到名为\
  \ `department.ixf` 的 PC/IXF 文件中，可以执行 `EXPORT` 命令：\n\n![Image](img/581-1.jpg)\n\n\
  当要出的数据包含 LOB 值时，默认情况下只有每个 LOB 值的前 32 KB 会被实际写入包含导出数据的文件中——大于 32 KB 的 LOB 值将被截断。正如你想象的可能，如果\
  \ LOB 值大于 32 KB，这将产生很大的问题。当你覆盖此默认行为（使用 `lobsinfile` 或 `lobsinpfiles` 修饰符）并为 `Export`\
  \ 实用程序提供一个或多个写入 LOB 数据值的位置时，遇到的每个 LOB 值将完整地存储在单独的文件中（文件由用户或 `Export` 实用程序命名）。\n\n\
  \n\n\n\n执行此命令时，将执行以下操作：\n\n*   检索存储在名为 `EMPLOYEE.` 表中的所有数据值。\n*   将从 `EMPLOYEE`\
  \ 表中检索的所有非 LOB 值复制到名为 `employee.del` 的分隔符 ASCII (DEL) 格式外部文件（该文件将位于 C: 盘的根目录下）。\n\
  *   将从 `PHOTO` 列检索的每个 LOB 值复制到其单独的文件中（创建的每个文件将位于 C: 盘上名为 `lobfiles` 的目录中）。\n*  \
  \ 将 `Export` 实用产生的所有消息记录到名为 `exp_msgs.txt` 的文件中（该文件将位于当前工作目录）。\n\n图 6.4 插释了此导出操作。\n\
  \n![Image](img/582.jpg)\n\n*图 6.4：将 LOB 值存储在单独文件中的导出操作*\n\n与 LOB 数据一样，XML 数据也可以与其他导出的数据一起写入文件，或者可以将存储在表中的每个\
  \ XML 文档复制到其单独的文件中（由用户或 `Export` 实用程序提供名称）。图 6.5 插释了以此方式处理 XML 文档的简单导出操作。\n\n![Image](img/583.jpg)\n\
  \n*图 6.5：将 XML 值存储在单独文件中的导出操作*\n\n图 6.6 显示了 IBM Data Studio 菜单项 `(Administrative\
  \ Perspective` -> `Database (SAMPLE)` -> `Tables)`，你必须选择这些项来激活导出表向导。需要注意的是，无论你使用\
  \ `EXPORT` 命令还是导出表向导来导出数据，在调用 `Export` 实用程序之前都必须建立数据库连接。此外，你使用游标稳定性（Cursor Stability）隔离级别将\
  \ `Export` 实用程序绑定到数据库，以便在使用它导出数据时，不会阻止其它应用程序和用户访问表。\n\n![Image](img/584.jpg)\n\n\
  *图 6.6：通过 IBM Data Studio 调用 Export 实用程序*\n\n图 6.7 显示了 IBM Data Studio 中导出 实用程序向导中可用文件名和格式选项。通过打开\
  \ Target 窗口，你还可以从三个选项中选择文档代码页：Unicode、Character 和 Graphic。图 6.8 中的 Options 窗口允许你选择列分隔符、字符字符串分隔符和小点字符以及时间戳格式。最后，你可以在\
  \ Source 窗口中为导出编写自定义的 SQL 语句，如 图 6.9 所示。\n\n## DB2 导入实用程序\n\n正如有时将存储在表或视图中的数据复制到外部文件是有益的，有时将存储在外部文件中的数据复制到数据库表或可更新视图是有优势的。从外部文件向数据库复制数据方法是使用\
  \ DB2 的 `Import` 实用程序。`Import` 实用程序直接从外部文件读取数据（只要该文件按 DB2 支持的格式写入），并将其插入特定的表或可更新视图中。\n\
  \n要成功调用 `IMPORT` 命令，你必须在实例级别拥有 `SYSADM` 权限，在数据库级别拥有 `DBADM` 权限，或者拥有 `SELECT, UPDATE,\
  \ INSERT, DELETE,` 或 `CONTROL` 对象权限。你需要在数据库级别拥有 `CREATETAB` 权限，并在表空间级别拥有 `USE` 权限，以便带有\
  \ `REPLACE_CREATE` 子句运行 `IMPORT` 命令。\n\n![Image](img/585-1.jpg)\n\n*图 6.7：导出—文件名和数据格式*\n\
  \n![Image](img/585-2.jpg)\n\n*图 6.8：导出—分隔符选项*\n\n![Image](img/586-1.jpg)\n\n*图 6.9：导出—自定义数据选择*\n\
  \n如果你想将数据导入到具有受保护列的表中，你必须拥有 `LBAC` 凭据，以允许写入表中的所有受保护列。要将数据导入到具有受保护行的表中，你必须被授予具有写入权限的安全标签，该标签是保护表的安全策略的一部分。\n\
  \n你可以通过执行 `IMPORT` 命令来调用 `Import` 实用程序。该命令的基本语法如下：\n\n![Image](img/586-2.jpg)\n\n\
  | where: | |\n|---|---|\n| `FileName` | 识别要从中导入（复制）数据的外部文件的名称和位置 |\n| `LOBPath`\
  \ | 识别一个或多个存储要导入 LOB 数据值的位置 |\n| `XMLPath` | 识别一个或多个存储要导入 XML 文档的位置 |\n| `Modifier`\
  \ | 识别用于覆盖 `Import` 实用程序默认行为的一个或多个选项（表 6.2 包含有效修饰符列表） |\n| `Method` | 识别用于从指定的源外部文件中提取数据值的方法（位置、名称或位置），并将其映射到指定的目标表/可更新视图的一个或多个列；用于指定每种方法时使用的语法各异\
  \ |\n| `SchemaID` | 识别用于验证导入的 XML 文档的架构标识；当你以此方式验证 XML 文档时，XML 数据标识 (XDS) 属性将被忽略\
  \ |\n| `CommitCount` | 识别在执行提交操作之前复制到表/可更新视图的行数（对于因事务满而失败的导入操作使用 `COMMITCOUNT AUTOMATIC`）\
  \ |\n| `RestartCount` | 识别外部文件中跳过的行数；通常在之前的导入操作失败时使用——通过跳过已成功导入到表/可更新视图的行，导入操作可以继续\
  \ |\n| `WarningCount` | 识别在停止导入操作之前允许的警告数量；如果此参数设置为 `0` 或未指定，无论警告数量多少导入操作将继续 |\n\
  | `MsgFileName` | 识别用于写入执行 `Import` 实用程序期间产生消息的外部文件名和位置 |\n| `TableName` | 为要导入数据的表或可更新视图分配名称；这可以是系统目录表或视图的名称\
  \ |\n| `ColumnName` | 识别要导入数据的某个特定列（按名称） |\n| `TSName` | 如果要创建表，则识别用于存储表及其常规数据、索引和长数据的表空间\
  \ |\n\n一个简单的 `IMPORT` 命令和示例输出如下：\n\n![Image](img/588.jpg)\n\n表 6.2 列出了 `IMPORT`\
  \ 命令最常用的文件类型修饰符。\n\n| 表 6.2：IMPORT 命令识别的文件类型修饰符 |\n|---|---|---|\n| **修饰符** | **描述**\
  \ | **文件格式** |\n| `compound=x` 其中 `x` 是 1 到 100 之间的任意数字 | 表示使用非原子复合 SQL 将从文件中读取的数据插入表/可更新视图中，并在复合\
  \ SQL 块中包含特定数量的语句（1 到 100 之间）；此修饰符不能在使用 INSERT_UPDATE 模式时使用，且与以下修饰符不：`usedefaults`、`identitymissing`、`identityignore`、`generatedmissing`\
  \ 和 `generatedignore` | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF |\n\n\n\n\n\
  | 修饰符 | 说明 | 支持的格式 |\n| :--- | :--- | :--- |\n| `generatedignore` | 表示尽管导入的文件包含所有生成列的数据，但这些数据应被忽略；相反，`Import`\
  \ 实用程序应将其找到的所有生成数据值替换为自身生成的值；此修饰符与 `generatedmissing` 修饰符不兼容。 | 分隔符 ASCII (DEL)、非分隔符\
  \ ASCII (ASC)、WSF 和 PC/IXF |\n| `generatedmissing` | 表示导入的文件中缺少生成列的数据，且 `Import`\
  \ 实用程序应对为每个遇到的缺失值生成适当的值；此修饰符与 `generatedignore` 修饰符不兼容。 | 分隔符 ASCII (DEL)、非分隔符 ASCII\
  \ (ASC)、WSF 和 PC/IXF |\n| `identityignore` | 表示尽管导入的文件包含所有标识列的数据，但这些数据应被忽略。相反，`Import`\
  \ 实用程序应将其找到的所有标识列数据替换为自身生成的值；此修饰符与 `identitymissing` 修饰符不兼容。 | 分隔符 ASCII (DEL)、非分隔符\
  \ ASCII (ASC)、WSF 和 PC/IXF |\n| `identitymissing` | 表示导入的文件中缺少标识列的数据，且 `Import`\
  \ 实用程序应对为每个遇到的缺失值生成适当的值；此修饰符与 `identityignore` 修饰符不兼容。 | 分隔符 ASCII (DEL)、非分隔符 ASCII\
  \ (ASC)、WSF 和 PC/IXF |\n| `implicitlyhiddeninclude` | 表示输入数据文件包含隐式隐藏列的数据，且这些数据也将导入；此修饰符不能与\
  \ `implicitlyhiddenmissing` 修饰符一起使用。 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF\
  \ |\n| `implicitlyhiddenmissing` | 指定输入数据文件不包含隐式隐藏列的数据，实用程序将为这些隐藏列生成值；此修饰符不能与 `implicitlyhiddeninclude`\
  \ 修饰符一起使用。 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF |\n| `lobsinfile` | 表示\
  \ LOB 数据值存储在它们自己的文件中 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF |\n| `no_type_id`\
  \ | 表示将类型化表的数据转换为单个非类型子表；此修饰符仅在将数据导入表层级中的单个子表时有效。 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF\
  \ 和 PC/IXF |\n| `nodefaults` | 表示如果未提供目标表列的源列数据，且目标表列允许为空，则不导入默认值；如果未使用此修饰符，且未提供某个目标表列的源列数据值，将发生以下情况：•\
  \ 如果找到了该列的默认值，将导入该默认值.• 如果列允许为空且未找到该列的默认值，则在列中存储 NULL 值。• 如果列不允许为空且未找到默认值，则返回错误且\
  \ `Import` 实用程序停止处理。 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF |\n| `norowwarnings`\
  \ | 表示抑制所有关于被拒绝行的警告消息 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF |\n| `periodignore`\
  \ | 表示数据文件中存在周期列的数据但应被忽略；当指定此修饰符时，所有周期列值都由实用程序生成；此修饰符与 `periodmissing` 修饰符不兼容。 |\
  \ 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF |\n| `periodmissing` | 指定输入数据文件不包含周期列的数据；当指定此修饰符时，所有周期列值都由实用程序生成；此修饰符与\
  \ `periodignore` 修饰符不兼容。 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF |\n| `rowchangetimestampignore`\
  \ | 指定数据文件中存在行更改时间戳的数据但应被忽略；这将导致所有的 `ROW CHANGE TIMESTAMP` 由实用程序生成——对于 `GENERATED\
  \ ALWAYS` 和 `GENERATED BY DEFAULT` 列，行为将相同，因此对于 `GENERATED ALWAYS` 列，不会有行被拒绝——此修饰符不能与\
  \ `rowchangetimestampmissing` 修饰符一起使用。 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和\
  \ PC/IXF |\n| `rowchangetimestampmissing` | 指定输入数据文件不包含行更改时间戳的数据（即使没有 NULL），因此为每行生成一个值——对于\
  \ `GENERATED ALWAYS` 和 `GENERATED BY DEFAULT` 列，行为将相同——此修饰符不能与 `rowchangetimestampignore`\
  \ 修饰符一起使用。 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF |\n| `seclabelchar` |\
  \ 表示以安全标签值的字符串格式在输入源文件中存储安全标签，而不是默认的编码数值格式（`Import` 实用程序在加载时会将找到的每个安全标签转换为内部格式；如果字符串格式不正确，则该行不被导入并返回警告；如果字符串不代表保护表的安全策略的有效安全标签，则该行不被导入并返回警告）；如果指定了\
  \ `seclabelname` 修饰符，则无法使用此修饰符。 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF\
  \ |\n| `eclabelname` | 表示通过名称而非默认数值格式识别输入源文件安全标签（如果存在，实用程序将名称转换为适当的安全标签；如果保护表的安全策略中不存在指定名称的安全标签，则该行不被导入并返回警告）；如果指定了\
  \ `seclabelchar` 修饰符，则无法使用此修饰符 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF |\n\
  | `transactionidignore` | 指定 `TRANSACTION ID` 列的数据存在数据文件中但应被忽略；当指定此修饰符时，`TRANSACTION\
  \ ID` 列的值由实用程序生成；此修饰符不能与 `transactionidmissing` 修饰符一起使用。 | 分隔符 ASCII (DEL)、非分隔符\
  \ ASCII (ASC)、WSF 和 PC/IXF |\n| `transactionidmissing` | 指定输入数据文件不包含 `TRANSACTION\
  \ ID` 列的数据；当指定此修饰符时，`TRANSACTION ID` 列的值由实用程序生成；此修饰符不能与 `transactionidignore` 修饰符一起使用。\
  \ | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF 和 PC/IXF |\n| `usedefaults` | 如果未提供目标表列的源列数据且目标表列具有默认约束，则为该列生成默认值；如果未使用此修饰符，且未提供某个目标表列的源列数据值，将发生以下情况：•\
  \ 如果列为空，则在列中存储 NULL 值.• 如果列不允许为空且无法生成默认值，则该行被拒绝。 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC)、WSF\
  \ 和 PC/IXF |\n| `codepage=x` 其中 `x` 为任何有效的代码页标识符 | 标识产生的输出数据集中包含的数据的代码页；字符数据从应用程序代码页转换为导入操作期间指定的代码页。\
  \ | 分隔符 ASCII (DEL) 和非分隔符 ASCII (ASC) |\n\n\n\n\n\n| 修饰符 | 描述 | 类型 |\n| :--- | :---\
  \ | :--- |\n| `dateformat=x` 其中 `x` 是任何日期格式元素的有效组合 | 标识如何格式化源文件中存储的日期值；使用以下日期元素将创建与此修饰符提供的格式字符串：<br>•\
  \ `YYYY`—年份（0000 到 9999 之间的四位数）<br>• `M`—月份（1 到 12 之间的一位或两位）<br>• `MM`—月份（1 到 12\
  \ 之间的两位数；与 `M` 互斥）<br>• `D`—日期（1 到 31 之间的一位或两位）<br>• `DD`—日期（1 到 31 之间的两位数；与 `D`\
  \ 互斥）<br>• `DDD`—一年中的天数（001 到 366 之间的三位数；与其他日或月份元素互斥）<br><br>有效的日期格式字符串示例包括：<br>`“D-M-YYYY”`，`“MM.DD.YYYY”`，`“YYYYDDD”`\
  \ | 分界 ASCII (DEL) 和非分界 ASCII (ASC) |\n| `implieddecimal` | 表示由列定义来确定隐含小数点的位置——导入工具不会假设小数点位于值的末尾（默认行为）；例如，如果指定了此修饰符，值\
  \ `12345` 将作为 `123.45` 加载到 `DECIMAL(8,2)` 列中，而不是作为 `12345.00` | 分界 ASCII (DEL) 和非分界\
