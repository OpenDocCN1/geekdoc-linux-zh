  \n## 使用时间表进行时间旅行查询\n\n时间数据管理是一种根据时间管理数据的方法。如今，DB2 10.1 引入了从过去、现在和未来检索数据的能力。时间表类型有：\n\
  \n* 系统周期时间表\n* 应用周期时间表\n\n### 系统周期时间表\n\n系统周期时间表是维护基表当前版本的表。当更新或删除记录时，DB2 数据库管理器会将旧记录插入到历史表。它使用\
  \ `SYS_START` 列来记录记录开始的时间，`SYS_END` 列来记录记录结束的时间。\n\n为了配置一个系统周期时间表，对于 `EMPLOYEE_ST`\
  \ 基表，可以执行如下操作：\n\n![Image](img/232.jpg)\n\n**步骤 1：** 创建历史表。\n\n在系统周期时间表上插入操作的如下：\n\
  \n![Image](img/233.jpg)\n\n**步骤 2：** 验证时间表类型。\n\n您可以通过查询 `SYSCAT.TABLES` 系统视图来验证时间类型：\n\
  \n![Image](img/233.jpg)\n\n返回值 `S` 表示其为系统周期时间表。\n\n**步骤 3：** 向时间表插入数据。\n\n向系统周期时间表插入数据时，DB2\
  \ 数据库管理器会在行开始、行结束和事务开始列中插入值：\n\n![Image](img/233-234.jpg)\n\n由于 `INSERT` 命令不会生成历史记录，因此历史表是空的。\n\
  \n**步骤 4：** 对现有记录执行 DML 操作。\n\n在系统周期时间表上更新记录会导致关联的历史表中添加记录：\n\n![Image](img/235.jpg)\n\
  \n对 `EMPID 1` 的更新影响了系统周期时间表及其历史表，如下：\n\n* `EMPID 1` 的 `BAND` 和 `SALARY` 列值更新为 `A2`\
  \ 和 `12800.00`。\n* DB2 数据库管理器会自动更新 `SYS_START` 和 `TXN_ID` 列。\n* 原始记录被移动到历史表。\n\n\
  ![Image](img/235-236.jpg)\n\n对 `EMPID 2` 执行一个类似的 `UPDATE` 命令：\n\n![Image](img/236-237.jpg)\n\
  \n如果您想从基系统周期时间表中删除记录，可以使用类似下面的 `DELETE` 命令：\n\n![Image](img/237-238.jpg)\n\n**步骤\
  \ 5：** 查询系统周期时间表。\n\n\n\n\n当你想查询系统周期时间表（system-period temporal tables）时，可以在 `SELECT`\
  \ 语句的 `FROM` 子句中使用以下任何周期规格：\n\n*   `FOR SYSTEM_TIME AS OF <ts1>`: 允许你查询特定时间点的数据。\n\
  *   `FOR SYSTEM_TIME FROM <ts1> TO <ts2>`: 允许你查询从特定时间 `ts1` 到特定时间 `ts2` 的数据。\n*\
  \   `FOR SYSTEM_TIME BETWEEN <ts1> AND <ts2>`: 允许你查询一段时间范围之间的数据。\n\n你可以使用简单的 `SELECT`\
  \ 语句从基础表中检索记录：\n\n![Image](img/238.jpg)\n\n如上例所示，简单的 `SELECT` 语句仅从基础时间表中检索信息。若想想根据时间戳自动从基础表和历史表中同时检索信息，请使用\
  \ `FOR SYSTEM_TIME` 子句：\n\n![Image](img/239.jpg)\n\n如你所见，上述查询透明地从基础表和历史表中提取了信息，而无需在过程或函数中显式地创建任何复杂的应用程序逻辑。\n\
  \n## 实用、工具和文件类型修饰\n\n与其他基础表一样，系统周期时间表支持若干工具和程序来管理数据移动活动：\n\n*   `Import`\n*   `Load`\n\
  *   `ADMIN_MOVE_TABLE` 过程\n*   `Replication`\n*   `ADMIN_COPY_SCHEMA` 过程\n*   `QUIESCE`\
  \ 表空间\n*   `Roll Forward`\n\n在开始使用数据移动工具之前，理解系统周期时间表的文件类型修饰至关重要（参见表 3.4）。\n\n###\
  \ 表 3.4：系统周期时间表的文件类型修饰\n\n| 文件类型修饰 | 工具 | 说明 |\n| :--- | :--- | :--- |\n| PERIODIGNORE\
  \ | Import, Load | 该修饰告知工具外部文件中存在 `SYSTEM_TIME` 周期列的数据，且应被忽略。这还允许工具自动生成时间周期列值。 |\n\
  | PERIODMISSING | Import, Load | 该修饰告知工具外部文件中不存在 `SYSTEM_TIME` 周期列的数据。这还允许工具自动生成时间周期列值。\
  \ |\n| TRANSACTIONIDIGNORE | Import, Load | 该修饰告知工具外部文件中存在 `TRANSACTION START ID`\
  \ 列的数据，且应被忽略。这还允许工具自动生成事务开始 ID 列值。 |\n| TRANSACTIONIDMISSING | Import, Load | 该修饰告知工具外部文件中不存在\
  \ `TRANSACTION START ID` 列。这还允许工具自动生成事务开始 ID 列值。 |\n| PERIODOVERRIDE | Load | 该修饰告知工具外部文件中存在\
  \ `SYSTEM_TIME` 周期列的数据，且应当使用。 |\n| TRANSACTIONOVERRIDE | Load | 该修饰告知工具外部文件中存在 `TRANSACTION\
  \ START ID` 列的数据，且应当使用。 |\n\n## 系统周期时间表的限制\n\n关于系统周期时间表和历史表有若干规则和限制：\n\n*   不能通过使用\
  \ `DROP TABLE` 命令显式地删除历史表。如果你尝试删除它，将收到类似下方的错误信息：\n\n![Image](img/240.jpg)\n*   历史表列不能被显式地添加、删除或更改。\n\
  *   历史表不能通过任何方式对其定义约束。\n*   系统周期时间表和历史表不支持基于标签的访问控制（LBAC）。\n*   系统周期时间表不能是物化查询表（MQT）。\n\
  *   `ALTER TABLE ACTIVATE NOT LOGGED INITIALLY` 语句在基础表和历史表中均被拦截。\n*   `LOAD` 和 `IMPORT`\
  \ 命令不支持 `REPLACE` 选项。\n*   系统周期时间表不支持 `TRUNCATE` 命令。\n*   系统周期时间表和历史表不支持以下命令集：\n\
  \n![Image](img/241.jpg)\n*   对于点点恢复，如果包含系统周期时间表的表空间正在向前回滚到某个时间点，则包含关联历史表的表空间也必须向前回滚到同一时间点。\n\
  \n## 应用周期时间表\n\n应用周期时间表（application-period temporal table）是一种存储生效业务数据的表（例如，为期一个月的\
  \ 75 折产品优惠活动，以及促销结束后 95 折优惠）。因此，你可以通过定义数据有效的时间周期，根据时间标准来管理数据。与系统周期时间表一样，应用周期时间表使用\
  \ `BUSINESS_TIME` 周期，其列指示了行中数据有效的时间段。\n\n让我们来看一个示例以理解应用周期时间表的行为以及配置它的必要步骤。\n\n###\
  \ 第 1 步：创建应用周期时间表以捕折扣有效期\n\n![Image](img/241-242.jpg)\n\n当你定义 `BUSINESS_TIME` 周期时，开始周期总是包含的，而结束周期总是排他的。DB2\
  \ 数据库管理器会创建一个名为 `DB2_GENERATED_CHECK_CONSTRAINT_FOR_BUSINESS_TIME` 的隐式 `CHECK` 约束，以确保\n\
  \n### 第 2 步：向应用周期时间表插入数据\n\n![Image](img/242.jpg)\n\n如果你尝试插入重叠周期，将得到类似下方的错误：\n\n\
  ![Image](img/243.jpg)\n\n### 第 3 步：执行 DML 操作\n\n与系统周期时间表一样，你可以通过 `UPDATE` 语句的 `FOR\
  \ PORTION OF BUSINESS_TIME` 子句指定范围更新，以更新范围内的记录。\n\n![Image](img/243-244.jpg)\n\n\
  注意到插入了一个新的有效周期，并且对现有行更新了新的开始周期。\n\n同样，如果你想从应用周期时间表中删除记录，请使用 `DELETE` 命令：\n\n![Image](img/244.jpg)\n\
  \n在上述示例中，由于 `DELETE` 命令执行期间的部分范围覆盖，导致插入了一行。\n\n### 第 4 步：查询应用周期时间表\n\n与系统周期时间表一样，你可以在\
