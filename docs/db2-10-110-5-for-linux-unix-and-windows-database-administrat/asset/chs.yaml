  \ |\n| TOTAL_BACKUP_PROC_TIME | 执行在线备份的非等待总时间 |\n| TOTAL_BACKUPS | 完成的在线备份数量 |\n\
  | TOTAL_INDEX_BUILD_TIME | 因创建、重建或重新创建而构建索引的总耗用时间 |\n| TOTAL_INDEX_BUILD_PROC_TIME\
  \ | 因创建、重建或重新创建而构建索引的总非等待时间 |\n| TOTAL_INDEXES_BUILT | 构建的索引数量 |\n\n## 连接与网络\n\n\
  本节详细查看了 `db2dsdriver.cfg`、管理远程通信的各种方式，以及 DB2 10.5 中引入的特定更改。有关 DB2 10 的详情，请参阅第 9\
  \ 章“连接与网络”。\n\n# 通信规划\n\n在设置通信之前，请花时间进行规划。良好的规划方法是提出正确的问题。\n\n* 是否需要 HA（高可用）？\n\
  * 实施哪种服务器 HA 解决方案？\n* 实施哪种客户端 HA 解决方案？\n* 涉及哪些操作系统？\n* 客户端是否会使用 Perl 或 UNIX 脚本？\n\
  * 是否限制服务器访问？\n*有多少并发用户？\n\n设置远程通信需要服务器名称和端口号等特定信息。具体的要求和选项取决于涉及的平台。在开始之前，了解通信的限制和行为非常重要。您可以在表\
  \ 10.35 查看服务器级和客户端通信特性。\n\n| 表 10.35：通信特性 |\n\n| 特性 | 服务器级 | 客户端级 |\n| :--- | :---\
  \ | :--- |\n| 事务和连接负载均衡 | 10.5 或更高版本 | 9.7 FP1 或更高版本 |\n| 自动客户端重定向 (ACR) | 10.5\
  \ 或更高版本 | 9.5 FP4 或更高版本 |\n| 客户端亲和性 | 10.5 或更高版本 | 9.7 PF1 或更高版本 |\n\n随着此版本，IBM\
  \ 进行了若干重大改进。在许多情况下，为了使用这些改进，您需要升级到 DB2 10.5。作为常规做法，保持服务器软件版本高于或等于正在使用的客户端驱动版本是一个好主意，尽管\
  \ IBM 提供了一些向下兼容性。\n\n## 配置通信\n\nDB2 环境是多层的，包含一个或多个服务器以及一个或多个客户端。DB2 支持多种类型的监听器。最常用的是\
  \ IPC 和 TCP/IP。IPC 是仅基于本地的监听器，在不指定用户连接到 DB2 数据库时调用（从 UNIX 命令行或 Windows 命令提示符中执行\
  \ `db2 connect to sample`）。运行在数据库服务器上的程序将默认使用此监听器进行连接。TCP/IP 用于远程通信，并在指定用户时调用（`db2\
  \ connect to sample user db2inst1`）。\n\n## 设置通信\n\n提供了五个客户端/服务器包供部署。如表 10.36 所示，每个包提供不同级别的支持。\n\
  \n| 表 10.36：通信特性 |\n\n| 软件包 | 支持 | 模块 |\n| :--- | :--- | :--- |\n| JDBC 和 SQLJ |\
  \ 仅限 Java 应用 | `db2jcc.jar` 或 `db2jcc4.jar` 和 `sqlj.jar` |\n| ODBC 和 CLI | ODBC\
  \ 或 CLI | `db2java.zip` |\n| ODBC, CLI, .NET, OLE, PHP, Ruby, JDBC, SQLJ | 数据服务器驱动包\
  \ | `db2jcc.jar` 或 `db2jcc4.jar` 和 `sqlj.jar`, `db2java.zip` |\n| DB2CI | 数据服务器客户端包\
  \ | 完整客户端 |\n| DB2 CLPPlus | 数据服务器驱动包 | |\n| CLP plus 基础客户端 | 运行时客户端加上数据服务器驱动包中的\
  \ CLPPlus | |\n| 数据库管理加编程 API | 数据服务器客户端包 | 完整客户端 |\n\n## z/OS 客户端\n\n要将 z/OS 设置为客户端并将\
  \ UNIX/LUW 设置为服务器，可以使用分布式数据设施 (DDF) 与 UNIX/LUW 服务器进行通信（参见表 10.37）。\n\n| 表 10.37：z/OS\
  \ DDF |\n\n| 表名 | 目的 |\n| :--- | :--- |\n| SYSIBM.IPNAMES | 标识 IP 地址；通常使用 DNS 别名项而非特定\
  \ IP |\n| SYSIBM.LOCATIONS | 标识要连接的 UNIX 数据库；指定端口、实例和数据库名称 |\n| SYSIBM.USERNAMES\
  \ | 连接到 UNIX LUW 数据库时，将 z/OS RACF 账户连接到 AIX/UNIX 账户 |\n\nDB2 10.5 包含了针对 z/OS 通信的增强，包括支持\
  \ z/OS 存储过程数组和隐式提交的 CLI 改进。在调用 z/OS 存储过程时，可以设置 `fet_buf_siz` 以返回整个结果集。有关更改的完整列表，请咨询\
  \ IBM 知识中心。\n\n## UNIX 客户端\n\n为了在两个 UNIX 平台之间设置通信，可以使用 CLI 或通用 JDBC 接口 (JCC)。CLI\
  \ (`db2java.zip`) 使用目录项来设置导航信息，并使用 `db2cli.ini` 设置[通用]和特定数据库的全局设置。\n\nJCC (`db2jcc.jar`\
  \ 或 `db2jcc4.jar`) 通信可以使用 `db2dsdriver.cfg` 提供所需的通信属性。您可以设置 JCC 通信以以 Mode-2 和 Mode-4\
  \ 模式运行。Mode-2 使用 CLI 目录信息进行导航，包括 HADR 配置中的备用服务器信息。Mode-4 要求作为驱动程序的扩展提供备用服务器信息。可以使用\
  \ `db2dsdriver.cfg` 设置 Mode-4 通信的行为和导航信息。\n\n通过查看 URL 很容易判断正在的是哪种 JCC 方法：\n\n![Image](img/1143.jpg)\n\
  \nCLI 方法和 Mode-2 方法具有相同的 URL 格式，因此要确定用的是哪一种，需要查看源。对于 CLI，您必须安装 DB2 完整客户端软件并添加目录信息。使用的源文件是\
  \ `db2java.zip`。对于 JCC，您只需要在客户端服务器上放置 Java 驱动程序。\n\n通过 DB2 10.5，IBM 增强了 `db2dsdriver.cfg`，包含了以前版本中位于\
  \ `db2cli.ini` 中的设置。IBM 引入了 DB2 注册表项 `DB2DSDRIVER_CFG_PATH`，允许您指定多个路径和客户特定的文件名。\n\
  \n如果您想使用此方法，IBM 在 DB2 安装路径/cfg 下提供了一个示例文件。例如，在 UNIX 上，这将是 `/opt/IBM/db2/V10.5/cfg`。\n\
  \n您可以使用 `db2cli` 程序测试连接。要有关使用 `db2dsdriver.cfg` 的示例和详情，请参见附录 A 中的“客户端/服务器通信”。现在让我们来看设置通信的两个场景。\n\
  \n在第一个示例中，服务器是运行 HADR 的 UNIX DB2/LUW 10.5，您必须从 z/OS 访问此服务器。当前的 z/OSget 支持 DDF 的动态更改。在早期版本中，DDF\
  \ 必须重启才能获取更改，新条目（插入）除外。\n\n为了让 HADR 正常工作，必须自动客户端重定向 (ACR)。否则，当您执行数据库切换命令时，只要集群在备机上运行且主机宕机，新的远程客户端连接就会失败。如果您使用\
  \ `db2dsdriver.cfg`，可以运行 `enableAlternateServerListFirstConnect` 以启用首次连接故障转移。\n\n\
  在 FP4 之前，`db2dsdriver.cfg` 的位置如下：\n\n* `acrRetryInterval`\n* `alternateserverlist`\n\
  * `enableAcr`\n* `enableAlternateGroupSeamlessACR`\n* `enableAlternateServerListFirstConnect`\n\
  * `enableSeamlessAcr`\n* `maxAcrRetries`\n\n使用 DDF 的 z/OS 客户端不支持 ACR。如果您在 z/OS 或\
  \ z/Linux 上运行 WebSphere 并使用直接 TCP/IP 通信，您可以设置 z 客户端使用 ACR。\n\n\n\n\n\n在第二个示例中，服务器是运行\
  \ HADR 的 UNIX DB2/LUW 9.7，你必须从 Windows 7 访问此服务器。通过安装 DB2 完整客户端，你可以建立 CLI 通信。如果只需要\
  \ TCP/IP 支持，你可以将 JCC 驱动文件复制到 Windows 服务器，并在该 Windows 用户的环境中对它们进行源化处理（source）。\n\n\
  那么，你应该安装什么种版本的 DB2 客户端软件呢？如果你安装了 10.5，那么在短期内不需要升级它。然而，运行一个比服务器软件版本更高的客户端软件并不是一个好主意。\n\
  \n如果客户端/服务器已经用于 DB2 通信并安装了 JCC 客户端 9.1，你可以使用它。请记住，除非 ACR（自动客户端重启）正常，否则 HADR 服务器配置提供的处乎其微。要为\
  \ JCC Mode-4 连接获取 ACR 功能，你的客户端代码必须是 9.5 FP4 或更高版本。因此，除非你选择 CLI，否则你无法使用 9.1 版本，而这需要在\
  \ Windows 7 服务器上安装完整客户端。\n\n你决定在 Windows 7 服务器上安装 9.7 版本的 DB2 完整客户端，这是一个很好的选择。你设置了\
  \ CLI 通信，但测试失败了。你收到 30081N 错误消息。你检查了多次设置，一切看起来良好。你从 UNIX 客户端测试了相同的设置，它是可以的。为什么在\
  \ Windows 7 上失败了？失败的原因是 Windows 7 要求服务器名称必须是完全限定的。短名称不再有效（除非你在 hosts 文件中设置条目；除非名称是完全限定，否则\
  \ DNS 将无法工作）。你更改了 CLI 设置，一切恢复正常运行。\n\n## 高可用\n\n本节涵盖了 DB2 10.5 中关于 HA（高可用）的更改以及与\
  \ 10.1 的行为差异。有关如何设置或配置 HA 解决方案的详情，请参阅第 7 章“高可用”。\n\n## HADR\n\n从 DB2 10.1 开始，你可以在单个集群中设置三个备数据库：一个主备和最多两个辅助备库。数据库参数\
  \ `hadr_target_list` 包含备数据库列表。如果你只设置了一个备库，则不需要设置此参数。从 DB2 10.5 开始，你必须在所有配置中设置此参数：\n\
  \n![Image](img/1145.jpg)\n\n只有主备库支持所有的复制模式。HADR 支持 `SYNC`、`NEARASYNC`、`ASYNC` 和\
  \ `SUPERASYNC` 模式。辅助备库仅在 SUPERASYNC 模式下运行。DB2/TSA 适用于主 HADR 数据库与其主备之间。\n\n对于 pureScale\
  \ 集群，你只能设置主备，且它只能以 Async 或 SuperAsync 模式运行。主集群和主备集群必须具有相同的逻辑配置。因此，定义为主集群和主备集群的成员数量必须匹配。\n\
  \n表 10.38 列出了各种 HADR 功能以及它们支持的同步模式。\n\n![Image](img/1146.jpg)\n\n# “意外”恢复因子\n\n\
  你是否曾经不小心更改或删除了数据行？使用 SUPERASYNC 模式下的辅助备库，你可以建立一个数据库，在其中可以恢复被修改或删除的数据。假设你想设置一个八小时的恢复窗口。如果在八小时范围内识别出来，你可以恢复被删除的行，或将修改过的行还原到原始状态。要设置主数据库与辅助数据库之间的最小提交窗口，请使用参数\
  \ `hadr_replay_delay`。该参数的最大值超过 24 小时（86400 秒）。（将此最大值与你工作的天数—— 5 天——进行对比。）\n\n通过将\
  \ `hadr_replay_delay` 设置为 `28800`，在主数据库上执行的提交事务在过去的 28800 秒之前不会应用到此辅助数据库。这假定主服务器和辅助服务器具有相同的操作系统。\n\
  \n## 章节总结\n\n本章的目标是让你熟悉：\n- DB2 10.5 中引入的重大更改\n- 影子表（Shadow tables）\n- BLU 加速及其中涉及的技术\n\
  - DB2 JSON\n- 任何部署类型都可以使用的安装步骤\n- 随机键索引\n- 扩展行大小\n- 使用组、角色和应用程序 ID 的安全设计模型\n- 新的\
  \ DB2 软件打包\n- 针对 DB2 10.5 引入的新功能的特定工具以及对现有工具的任何更改\n- DB2 自主（autonomics）\n- DB2 WLM\n\
  - DB2 注册表和操作系统环境，以及在服务器上设置它们的方法\n- DB2 实例和数据库配置参数\n- DB2 自主功能及相关的业务收益\n- IBM Data\
  \ Studio 功能和查询调优工作流助手（Query Tuner Workflow Assistant）\n\n完成本章后，你将具备足够的知识回答任何针对 DB\
  \ 10.5 的认证考试题。强烈建议完成章节末的示例题。\n\n## 练习题\n\n### 题 1\n执行哪种命令可以为列组织表配置数据库？\n\n| | |\n\
  | :--- | :--- |\n| A | `update db cfg using DB2_COLUMN_ORGANIZED enable` |\n| B\
  \ | `dbset DB2_WORKLOAD=BLU` |\n| C | `update db cfg using DFT_ORGANIZATION=COLUMN`\
  \ |\n| D | 以上均非 |\n| E | 以上皆是 |\n\n### 题 2\n哪种 SQL 仓库工具（SQW）功能通过消除索引、聚合和调优提供了最佳性能存储效率？\n\
  \n| | |\n| :--- | :--- |\n| A | `pureQuery` |\n| B | `Statement pooling` |\n| C\
  \ | `SQW Acceleration` |\n| D | `BLU Acceleration` |\n| E | 以上皆是 |\n\n### 题 3\n\
