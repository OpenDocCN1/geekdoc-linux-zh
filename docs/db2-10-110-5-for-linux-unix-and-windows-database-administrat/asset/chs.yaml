  \ | C. | 向前滚命令在对日志记录采取任何操作之前失败。 |\n| ![images](img/circ.jpg) | D. | 场景不存在。 |\n\n\
  # 答案\n\n### 问题 1\n\n正确答案是 **D.** 你可以使用 Optim 性能管理器扩展视图（Optim Performance Manager\
  \ Extended Insight）从端到端监控整个数据库应用程序系统。端到端监控始于应用程序启动事务，随着每个组件（如客户端、网络和数据服务器）处理事务而持续，并在应用程序完成事务且你收到事务结果时结束。适用于\
  \ Linux、UNIX 和 Windows 的 DB2 Optim 查询负载调优器（Query Workload Tuner）提供专家建议，帮助你提高查询负载的性能。适用于\
  \ LUW 的 Optim pureQuery 通过提供帮助快速开发和修改的 API，可以提高数据库客户端应用程序的性能、安全性和管理性。\n\n### 问题\
  \ 2\n\n正确答案是 **B** 和 **C.** DB2 配置文件注册表（profile registry）分为四类：\n\n* DB2 实例级注册表\n\
  * DB2 全局级注册表\n* DB2 节点级注册表\n* DB2 用户级注册表\n\n### 问题 3\n\n正确答案是 **C.** DB2 目录（directory）分为四类：\n\
  \n* 系统数据库目录\n* 本地数据库目录\n* 节点目录\n* 数据库连接服务 (DCS) 目录\n\n### 问题 4\n\n正确答案是 **C.** 你可以使用四种不同的方法在服务器上安装\
  \ DB2：\n\n* 基于图形界面的 DB2 安装向导。这种方法适用于在单个服务器上安装和配置 DB2。\n* 使用 `db2_install` 脚本基于文本的交互式安装。这种安装方法已弃用。\n\
  * 使用 DB2 响应文件进行静默安装。当你想要在多个系统上安装和配置 DB2 时，这是首选方法。\n* 使用 DB2 负载负载文件（payload files）进行高级安装。这是一种安装\
  \ DB2 的复杂方法。\n\n### 问题 5\n\n正确答案是 **D.** DB2 pureScale 有四个主要组件：\n\n* 集群互连网络 (CI)\n\
  * 集群缓存设施 (CF)\n* 集群服务 (CS)\n* 集群文件系统\n\n集群服务围绕 IBM 可靠服务集群技术 (RSCT)、多平台系统自动化 (TSAMP)\
  \ 和 IBM 通用并行文件系统 (GPFS) 构建，提供自动成员故障检测、故障转移和数据访问功能。\n\n### 问题 6\n\n正确答案是 **B.** 支持的\
  \ DB2 升级路径有：\n\n* DB2 9.8 到 DB2 10.1\n* DB2 9.8 到 DB2 10.5\n* DB2 9.7 到 DB2 10.1\n\
  * DB2 9.7 到 DB2 10.5\n* DB2 9.5 到 DB2 9.7\n\n如果你需要将 DB2 9.5 实例升级到 DB2 10.5，你必须先升级到\
  \ DB2 9.7 或 10.1 的最新修复程序包（fix pack），然后将其升级到 DB2 10.5。\n\n### 问题 7\n\n正确答案是 **B.**\
  \ 命令 `db2set –info` 返回特定变量的属性，看起来如下：\n\n![Image](img/1195-1.jpg)\n\n如果 `db2set DB2_INDEX_PCTFREE_DEFAULT`\
  \ 未设置，它会返回警告；如果已设置，则返回一个值，类似于以下：\n\n![Image](img/1195-2.jpg)\n![Image](img/1196-1.jpg)\n\
  \n命令 `db2set –all DB2_INDEX_PCTFREE_DEFAULT` 返回所有出现的情况，例如操作系统级别 (e)、节点级别 (n)、实例级别\
  \ (i) 和全局级别 (g)：\n\n![Image](img/1196-2.jpg)\n\n命令 `db2set –display` 是一个错误的命令。\n\
  \n### 问题 8\n\n正确答案是 **C.** 命令 `db2iauto –on <instancename>` 允许在每次服务器重启后自动启动实例。`START_STOP_TIME`\
  \ 配置指定服务器必须响应的时间（单位为分钟），用于 `START` 或 `STOP` 操作。\n\n`AUTORESTART` 配置决定了数据库在异常终止后是否自动启动。如果没有设置此配置，用户必须显式执行\
  \ `restart` 命令才能连接。`DB2AUTSTART` 是一个错误的注册表设置。\n\n### 问题 9\n\n正确答案是 **B.** 序列（sequence）是一种允许跨表自动生成值的数据库对象。同样，`CREATE\
  \ TABLE` 命令中的 `GENERATED BY DEFAULT AS IDENTITY` 子句也会生成唯一值，但它限于定义的表。`UNIQUE` 索引保证列的唯一性，但不会生成值。触发器（trigger）的使用在这种情况下是不恰。\n\
  \n### 问题 10\n\n正确答案是 **A.** 你在表上只能创建一个集群索引。\n\n### 问题 11\n\n正确答案是 **B.** `ALTER\
  \ TABLE` 命令的 `WITH EMPTY TABLE` 子句会移除表中当前数据，且在工作单元内是不可恢复的。\n\n### 问题 12\n\n正确答案是\
  \ **B.** 你可以使用 `TRANSFER OWNERSHIP` 命令将所有权从一个用户转移给另一个。所有者在创建对象时获得的所有权限将转移给新所有者。\n\
  \n### 问题 13\n\n正确答案是 **C.** 你使用 `ADMIN_DROP_SCHEMA` 过程删除特定模式及其包含的所有对象。`DROP SCHEMA`\
  \ 命令只有在模式中的所有对象都已删除或移动到其他模式时才会删除。其他选项错误。\n\n### 问题 14\n\n正确答案是 **B.** 要向 TSM 备份数据库，使用\
  \ `BACKUP DATABASE … USE TSM` 命令，然后通过将 `LOGARCHETH1` 数据库配置为 TSM 来备份日志。在加载数据时，通过\
  \ `LOAD` 命令指示 DB2 在 TSM 中创建 `COPY` 文件。你可以在 `LOAD` 命令中指定 `COPY YES` 选项，或者将 DB2 注册变量\
  \ `DB2_LOAD_COPY_NO_OVERIDE` 设置为 YES。\n\n### 问题 15\n\n正确答案是 **A.** 你可以使用 `ALTER\
  \ TABLE ... RESTART` 或 `RESTART WITH` 命令选项重置序列的状态。如果没有指定 `WITH <newvalue>`，序列将按照最初创建标识列时显式或隐式指定的起始值重新启动。`NEXTVAL`\
  \ 和 `NEXT VALUE` 表达式生成并返回序列的下一个值。`ALTER TABLE` 命令没有 `RESET` 选项。\n\n\n\n\n\n正确答案是\
  \ **D.**。在 DB2 中，你可以拥有一个 128 字节的授权 ID。然而，当授权 ID 被解释为操作系统用户 ID 或组名时，将应用 DB2 实施的命名限制。例如，Linux\
  \ 和 UNIX 操作系统的用户 ID 和组名最多包含八个字符，而 Windows 操作系统的用户 ID 和组名最多包含 30 个字符。因此，如果你想以具有 128\
  \ 字节授权 ID 的用户身份连接，你需要编写自己的安全插件。在插件中，你可以对授权 ID 使用扩展大小。此外，名称中不能包含大写字母。\n\n### 问题 17\n\
  正确答案是 **A.**。特殊寄存器 `CURRENT LOCK TIMEOUT` 指定了在会话级别返回指示无法获取锁的错误之前，等待锁的秒数。如果你想在全局范围内设置它，请更新数据库管理器配置参数\
  \ `LOCKTIMEOUT`。\n\n### 问题 18\n正确答案是 **A.**。当你在数据库中遇到 `LOCKTIMEOUT` 问题时，会生成以下错误：\n\
  \n![Image](img/1198-1.jpg)\n\n你可以使用数据库系统监器来检测锁超时以及涉及的 SQL 语句。\n\n### 问题 19\n正确答案是\
  \ **B.**。当你在数据库中遇到死锁问题时，会生成以下错误：\n\n![Image](img/1198-2.jpg)\n\n你可以使用锁定事件监器来检测死锁以及涉及的\
  \ SQL 语句。\n\n### 问题 20\n正确答案是 **C.** 在当前提交语义（currently committed semantics）下，只有已提交的数据会被返回读取者。然而，读取者不会等待写入者释放行锁。相反，读取者返回基于当前提交版本的数据——即写入操作开始之前的数据版本。\n\
  \n以下扫描不使用当前提交语义：\n\n*   目录表扫描\n*   强制执行引用完整性约束的扫描\n*   引用 `LONG VARCHAR` 或 `LONG\
  \ VARGRAPHIC` 列的扫描\n*   范围聚类表扫描\n*   使用空间索引或扩展索引的扫描\n\n### 问题 21\n正确答案是 **C.**。当前提交语义需要写入者有更多的日志空间。在事务期间，记录数据行第一次更新时需要额外空间。这些数据用于检索该行的当前提交映像。根据工作负载，这可能对总日志空间的使用产生微不足道或可衡量的影响。\n\
  \n当前提交语义仅适用于不涉及目录表的只读扫描，以及评估或执行约束的内部扫描。由于当前提交语义是在扫描级别决定的，写入者的访问计划可能包含当前提交扫描。例如，只读子查询的扫描可能涉及当前提交语义。当前提交语义从日志缓冲区读取数据，且目前不支持从日志归档位置取回日志文件。\n\
  \n### 问题 22\n正确答案是 **C.**。你可以使用 `db2rc` 命令调用复制中心图形用户界面。命令 `db2cc` 和 `db2cc –rc`\
  \ 已被弃用，且 `db2start –rc` 选项是无效的。\n\n### 问题 23\n正确答案是 **A.**。`TO_SINGLE_BYTE` 函数返回一个字符串，其中多字节字符被转换为等效单字节字符（如果存在等效字符）。`INSTRB`\
  \ 函数返回字符串在另一个字符串中的起始位置（以字节为单位）。其余的标量函数都是无效的。\n\n### 问题 24\n正确答案是 **D.**。在 DB2 10.1\
  \ 中，DB2 在触发器中引入了多种函数：\n\n*   **多事件触发器支持：** 触发器事件现在可以包含多个操作。\n*   **触发器事件谓词识别触发的事件：**\
  \ 你可以使用 `UPDATING`、`INSERTING` 和 `DELETING` 的触发器事件谓词来识别激活事件。\n\n### 问题 25\n正确答案是\
  \ **C.**。当前提交语义需要写入者有更多的日志空间。在事务期间，记录数据行第一次更新时需要额外空间。这些数据用于检索该行的当前提交映像。根据工作负载，这可能对总日志空间的使用产生微不足道或可衡量的影响。\n\
  \n当前提交语义仅适用于不涉及目录表的只读扫描，以及评估或执行约束的内部扫描。由于当前提交语义是在扫描级别决定的，写入者的访问计划可能包含当前提交扫描。例如，只读子查询的扫描可能涉及当前提交语义。当前提交语义从日志缓冲区读取数据，且目前不支持从日志归档位置取回日志文件。\n\
  \n### 问题 26\n正确答案是 **C.**。你可以使用 `db2rc` 命令调用复制中心图形用户界面。`db2cc` 和 `db2cc –rc` 命令已被弃用，且\
  \ `db2start –rc` 选项是无效的。\n\n### 问题 27\n正确答案是 **A.**。`TO_SINGLE_BYTE` 函数返回一个字符串，其中多字节字符被转换为等效单字节字符（如果存在等效字符）。`INSTRB`\
  \ 函数返回字符串在另一个字符串中的起始位置（以字节为单位）。其余的标量函数都是无效的。\n\n### 问题 28\n正确答案是 **D.**。在 DB2 10.1\
  \ 中，DB2 在触发器中引入了多种函数：\n\n*   **多事件触发器支持：** 触发器事件现在可以包含多个操作。\n*   **触发器事件谓词识别触发的事件：**\
  \ 你可以使用 `UPDATING`、`INSERTING` 和 `DELETING` 的触发器事件谓词来识别激活事件。\n\n### 问题 29\n正确答案是\
  \ **D.**。二进制 XML 格式支持文本和二进制 XML 格式的传输。\n\n### 问题 30\n正确答案是 **B.**。创建信任上下文需要 `SECADM`\
  \ 权限。\n\n### 问题 31\n正确答案是 **D.**。对 XML 的索引受到一些限制，包括：\n\n*   支持的数据类型\n*   并发级别支持\n\
  *   XML 列表元素\n*   索引压缩\n\n\n\n\n正确答案是 `A` 和 `C`。上下文步骤和函数表达式步骤是您在为 XML 数据创建功能索引时所指定的\
  \ XML 索引模式的一部分。上下文步骤指示了要创建索引条目的元素节点或属性节点的 XML 路径。函数表达式步骤则指定了函数（例如 `fn:exists` 或\
  \ `fn:upper-case`）及其参数。\n\n### 问题 32\n正确答案是 `A`。`XSLTRANSFORM` 内置标量函数可以将 XML 数据转换为其他格式，包括将符合一种\
  \ XML 架构的 XML 文档转换为另一种架构的文档。\n\n### 问题 33\n正确答案是 `D`。`Ingest` 工具不支持以下列类型：\n\n* 大对象类型\
  \ (`LOB`, `BLOB`, `CLOB`, `DBCLOB`）\n* XML\n* 结构化类型\n* 基于上述列出的任何一种类型的用户定义数据类型的列\n\
  \n### 问题 34\n正确答案是 `D`。您可以使用 `INGEST LIST` 和 `INGEST GET STATS` 命令来检索 `Ingest` 工具信息。`Ingest`\
  \ 工具不支持 `UTIL_IMPACT_LIM`、`UTIL_IMPACT_PRIORITY` 和 `LIST UTILITIES` 命令或注册。\n\n###\
  \ 问题 35\n正确答案是 `A`。在运行 `LOAD FROM CURSOR` 命令之前，您必须声明游标。不过，并不是强制打开游标。\n\n### 问题 36\n\
  正确答案是 `B`。您可以在 `-wlm` 参数子中使用事件监器名称、工作负载名称或服务类名称来根据工作负载捕建议。\n\n### 问题 37\n正确答案是 `C`。通过将\
  \ `logsecond` 设置为 `-1`，您对工作单元的大小或并发工作单元的数量将没有限制。然而，由于需要从归档检索日志文件，回滚（包括保存点级别和工作单元级别）可能会非常慢。要将\
  \ `logsecond` 设置为 `-1`，您必须将 `logarchmeth1` 配置参数设置为 `OFF` 或 `LOGRETAIN` 以外的值。\n\n\
  ### 问题 38\n正确答案是 `B`。`alt_diagpath` 参数允许在主诊断数据路径 `diagpath` 不可用时，指定用于 DB2 诊断信息的完全限定备用路径。\n\
  \n### 问题 39\n正确答案是 `A`。您需要设置 `DB2FODC` 注册表变量将核心转储和 FODC 数据重定向到不同的文件系统。当 `DB2_DISABLE_FLUSH_LOG`\
  \ 设置为 `OFF` 且在线备份完成后，最后一个活动日志文件将被截断、关闭并变为可归档状态。这确保了您的在线备份有一套完整的归档日志可供恢复。当 `DB2_OPTSTATS_LOG`\
  \ 未设置或设置为 `ON` 时，将启用统计事件日志，允许您监控系统性能并保留历史以便更好地确定问题。`DB2_FORCE_APP_ON_MAX_LOG` 参数指定了当超过\
  \ `max_log` 配置参数值时会发生什么。将此参数设置为 `TRUE` 将强制应用程序断开数据库并回滚工作单元。\n\n### 问题 40\n正确答案是\
  \ `B`。`diagsize` 参数有助于控制诊断日志和管理日志文件的最大大小。如果您将此值设置为 0，您将只有一个诊断日志文件 (`db2diag.log`)\
  \ 和一个管理通知日志文件 (`<instance>.nfy`)，且这些文件的大小将不受限制。如果您将参数设置为非零值并重启 `<instance>`，则将使用一系列循环的诊断日志文件和一系列循环的管理通知日志文件。这些文件被称为\
  \ `db2diag.n.log` 和 `<instance>.n.nfy` 文件，其中 `n` 是一个整数；`<instance>.n.nfy` 文件仅适用于\
  \ Linux 和 UNIX 操作系统。`db2diag.n.log` 文件和 `<instance>.n.nfy` 文件的数量各不能超过 10 个。当第十个文件满时，最旧的文件将被删除并创建一个新文件。\n\
  \n### 问题 41\n正确答案是 `D`。`db2caem` 工具自动化了创建活动事件监器的过程。您可以运行 `db2caem` 命令来创建活动事件监器以捕获\
  \ SQL 语句的数据，然后使用 `db2support` 命令收集这些数据。`db2caem` 工具收集和生成的信息包括：\n\n* 活动事件监器捕获的详细活动信息，包括监视器指标（例如用于语句执行的\
  \ `total_cpu_time`）\n* 格式化的 Explain 输出，包括实际部分（访问计划中不同算子的统计信息）\n\n### 问题 42\n正确答案是\
  \ `A`。以下表显示了相应操作系统上的错误日志检索命令：\n\n| 命令 | 操作系统 |\n| :--- | :--- |\n| `/usr/bin/errpt\
  \ –a` | AIX |\n| `/var/log/messages` | SLES |\n| `/var/adm/messages` | Solaris |\n\
  | `/var/adm/syslog/syslog.log` | HP UX |\n\n### 问题 43\n正确答案是 `A`。您可以使用 `db2fodc\
  \ –detect` 命令在环境达到某些阈值时收集数据。`-detect` 参数与以下主要数据收集参数兼容：\n\n* `-cpu`\n* `-memory`\n\
  * `-connections`\n* `-hadr`\n* `-hang`\n* `-perf`\n* `-cpl`\n* `-preupgrade`\n\n\
  要在五小时的监控期间，收集 CPU 占用率超过 90% 超过 40 秒（触发计数器间隔）的活动信息，请执行此命令：\n\n![Image]\n\n### 问题\
  \ 44\n正确答案是 `B`。您可以使用 `db2pd` 命令监控排序性能。`-sort` 参数返回以下内容：\n\n* `ApplHandl`: 句柄，包括节点和索引\n\
  * `SortCB`: 排序控制块的地址\n* `MaxRowSize`: 行中列的最大长度之和\n* `EstNumRows`: 优化器估计将插入到中的的行数\n\
  * `EstAvgRowSize`: 优化器估计正在排序的行的平均长度\n* `NumSMPSorts`: 处理此排序的并发子代理数量\n* `NumSpills`:\
  \ 此排序溢出到磁盘的总次数\n* `KeySpec`: 排序的每列的类型和长度的描述\n* `SortheapMem`: 此排序预留并分配的排序堆内存数（KB）\n\
  * `NumSpilledRows`: 此排序溢出到磁盘的总行数\n* `NumBufferedRows`: 自上次溢出以来插入到此排序的总行数\n\n###\
  \ 问题 45\n正确答案是 `A`。对于执行随机行读写操作的 OLTP 应用程序，请使用较小的页大小，因为不会由于不需要的行浪费池空间。\n\n### 问题\
  \ 46\n正确答案是 `A`。频繁查询的 `GROUP BY` 或 `ORDER BY` 子句中出现的列可能从创建索引受益。\n\n### 问题 47\n正确答案是\
  \ `D`。并不要求主服务器和备服务器位于相同的子网上。\n\n### 问题 48\n正确答案是 `A`。\n\n* `SYNC`: 此模式对事务丢失提供了最大的保护，但代价是事务响应时间更高。\n\
  * `NEARSYNC`: 此模式提供的事务丢失保护稍小，以换取比 `SYNC` 模式更短的事务响应时间。\n* `ASYNC`: 与 `SYNC` 和 `NEARSYNC`\
  \ 模式相比，`ASYNC` 模式的事务响应时间更短，但如果主数据库故障可能会导致更大的事务丢失。\n* `SUPERASYNC`: 此模式的事务响应时间最短，但主系统故障时事务丢失的概率也最高。\n\
  \n### 问题 49\n\n\n\n\n正确答案是 **B.**。你可以使用 `SYSCAT.PERIODS` 目录视图来显示系统周期时间表的定义。语句看起来如下：\n\
  \n![Image](img/1205-1.jpg)\n\n### 问题 50\n正确答案是 A。当你尝试删除系统周期时间表上的某列时，你将收到的一个类似于下面的错误：\n\
  \n![Image](img/1205-2.jpg)\n\n原因代码 `5` 表示该列无法删除，因为它是系统周期时间表中的一列。解决方案是遵循以下步骤：\n\n\
  1. `Alter` 系统周期时间表以删除版本控制（versioning）。这将断开表之间的链接。\n2. `Alter` 系统周期时间表以删除该列。\n3.\
  \ `Alter` 曾经作为历史表的表以删除该列。\n4. `Alter` 之前的系统周期时间表以重新添加版本控制。这将重新建立表之间的链接。\n\n### 问题\
  \ 51\n正确答案是 **B.**。如果你执行带有 `APPEND ON` 选项的 `ALTER TABLE` 语句，数据将始终被追加，将不会保留数据页上任何空空间的信息，并且不会花费时间来搜索空空间。\n\
  \n### 问题 52\n正确答案是 **B.**。`SET_ROUTINE_OPTS` 过程设置了当前会话中创建 SQL 过程时使用的选项。正确的绑定选项应分别为系统周期时间表和业务周期时间表设置\
  \ `SYSTIMESENSITIVE` 和 `BUSTIMESENSITIVE`。\n\n### 问题 53\n正确答案是 **D.**。在启用版本控制时，无法从系统周期时间表中分离（detach）。你可以停止版本控制，然后从基表中分离出一个分区。被分离的分区将成为一个独立表。从历史表中分离（de-tach）分区并不需要你停止版本控制。\n\
  \n### 问题 54\n正确答案是 **C.**。在启用版本控制期间，无法运行 `SET INTEGRITY … FOR EXCEPTION` 语句，因为将异常行移动到异常表中会导致历史记录丢失。由于异常行没有记录在历史表中，审计你的系统周期时间表及其关联历史表中数据的能力将受到威胁。你可以临时停止版本控制，运行\
  \ `SET INTEGRITY … FOR EXCEPTION` 语句，然后重新启用版本控制。\n\n### 问题 55\n正确答案是 **D.**。`SET\
  \ INTEGRITY` 命令并不会调用异步分区分离任务；然而，这是数据分区分离阶段的一部分。\n\n### 问题 56\n正确答案是 **B.**。存储组是具有相似属性的存储路径组。关键属性包括存储容量、延迟、数据传输速率和\
  \ RAID 保护程度。\n\n### 问题 57\n正确答案是 **A.**。`ADMIN_GET_STORAGE_PATHS` 表函数返回每个数据库存储组的自动存储路径列表，包括每个存储路径的文件系统信息。\n\
  \n### 问题 58\n正确答案是 **B.**。将表空间从一个存储组移动到另一个存储组将启动重平衡（rebalance）操作。\n\n### 问题 59\n\
  正确答案是 **D.**。要挂指定表表的活动重平衡操作，请使用命令 `ALTER TABLESPACE … REBALANCE SUSPEND`，恢复使用使用\
  \ `ALTER TABLESPACE … REBALANCE RESUME`。\n\n### 问题 60\n正确答案是 **A.**。从 DB2 10.1 版本开始，当你定义存储组时，需要在重定向还原操作期间设置存储组的存储路径，而不是像以前版本那样为表空间设置容器路径。\n\
  \n### 问题 61\n正确答案是 **B.**。在 DB2 10.5 中，你可以使用命令 `db2iupdt –D *<InstanceName>.*` 将实例从较高的修补包（fix\
  \ pack）降级到较低。\n\n### 问题 62\n正确答案是 **B.**。建议的方法是在升级应用程序服务器上的 DB2 客户端之前，更新 DB2 服务器并测试服务器功能。\n\
  \n### 问题 63\n正确答案是 **B** 和 **E**。下表显示了 DB2 版本及相关功能：\n\n![Image](img/1207-1208.jpg)\n\
  \n### 问题 64\n正确答案是 **C** 和 **E**。DB2 10.5 支持的平台有：\n* AIX 6.1 TL7 及更高，AIX 7.1 TL\
  \ 1 及更高\n* HP UX 11iv3 及更高\n* RHEL 5 update 9 及更高，SLES 10 SP4 及更高，Ubuntu 12.04 LTS\
  \ 及更高\n* Solaris 10 update 10 及更高\n* Windows 8.1, Windows 2008 R2 和 Windows 2012\
  \ R2\n* Inspur K-UX 2.1 及更高\n\n### 问题 65\n正确答案是 **B.**。命令是 `db2ls –a`。\n\n### 问题\
  \ 66\n正确答案是 **D.**。WLM 默认对象会在每次执行 `CREATE DATABASE` 语句时创建。不需要特殊操作。\n\n### 问题 67\n\
  正确答案是 **C.**。`TSN` 值存储在摘要表（synopsis table）中，为 DB2 提供将列数据放入行正确列序列的方法。\n\n### 问题 68\n\
  正确答案是 **D.**。今天，这些数据类型都无法用于列表。\n\n### 问题 69\n正确答案是 **C.**。一个存储组可以有 1 到 128 个存储路径。\n\
  \n### 问题 70\n正确答案是 **B.**。Unicode 和自动存储是要求，自动存储至少包含一个存储组。运行 pureScale 需要共享文件系统，因此需要\
  \ GPFS。适当软件许可需要 `AESE` 或 `AWSE`。\n\n### 问题 71\n正确答案是 **B.**。`timeron` 是由 DB2 优化器根据内部成本值（作为\
  \ I/O 和处理器成本的加权和）的相对测量单位。\n\n### 问题 72\n正确答案是 **B.**。`CHAR` 和 `VARCHAR` 的长度限制为 1,000\
  \ 个字符。\n\n### 问题 73\n正确答案是 **D.**。一个 pureScale 集群可以支持多达 200 个数据库。\n\n### 问题 74\n\
  正确答案是 **C.**。任何自动存储数据库将有一个名为 `IBMSTOGROUP` 的存储组，因此无需创建一个。`ALTER TABLESPACE *<name>*\
  \ MANAGED BY AUTOMATIC STORAGE` 将在目录中记录该属性，`ALTER TABLESPACE *<name>* REBALANCE`\
  \ 将移动容器。\n\n### 问题 75\n正确答案是 **D.**。活动数据库的最大数为 512。在具有 15 个成员的集群中，一个数据库等于 15 个活动数据库。因此答案是\
  \ 512/15 = 34。\n\n### 问题 76\n正确答案是 **C.**。命令是 `db2greg –g`。\n\n### 问题 77\n正确答案是\
  \ **A.**。`CREATE STOGUP` 语句将数据库更改为 `AUTOMATIC STORAGE`。`ALTER TABLESPACE` 语句将表空间更改为\
  \ `AUTOMATIC STORAGE`，第二个 `ALTER TABLESPACE` 将容器移动到存储组定义的存储路径。\n\n### 问题 78\n正确答案是\
  \ **E.**。高级恢复功能（Advanced Recovery Feature）在 `AESE` 和 `AWSE` 之外授权。\n\n### 问题 79\n\
  正确答案是 **D.**。你需要在 `db2diag.log` 文件中查找信息。\n\n```\nCPU: total: 32 online:16 Cores\
  \ per socket:8 Threading degree per core:4 SIMD:Y\n```\n\n### 问题 80\n正确答案是 **E.**。工作类集（work\
  \ class set）根据类型（READ, WRITE, DML, DDL, CALL 和 LOAD）以及基于基数或 timeron 成本的值范围来识别负载。\n\
  \n### 问题 81\n正确答案是 **D.**。在恢复失败的成员之前，DB2 集群服务确保该失败成员无法修改磁盘上的共享数据。I/O 隔离（fencing）需要启用\
  \ SCSI-3 PR 命令，这在虚拟磁盘上是不可能的。\n\n### 问题 82\n正确答案是 **A.**。摘要表中页的最小分组单元是 1,024 页。\n\
  \n### 问题 83\n正确答案是 **D.**。不需要 `DB2_WORKLOAD` 注册表参数。它只是帮助你更快、更正确地设置 DBM 和 DB 配置设置。\n\
  \n### 问题 84\n正确答案是 **E.**。RTS 每五分钟检查一次 `PENDING` 队列并将请求放在运行队列上。\n\n\n\n\n### 问题\
  \ 85\n正确答案是 **B.** 自动统计剖析 (ASP) 在 V10.1 中被弃用，并在 V10.5 中断开了连接。它被 IBM Data Studio\
  \ 中的统计顾问 (Statistics Advisor) 所取代。\n\n### 问题 86\n正确答案是 **E.** 在 pureScale 中，你无法将表空间更改到不同的存储组，也无法从存储组中删除存储路径。C\
  \ 和 D 均可行；然而，C 需要中断服务才能完成，但它在所有情况下都有效。D 可以联机执行，但并不是所有表都受到 `ADMIN_MOVE_TABLE` 工具的支持。\n\
  \n### 问题 87\n正确答案是 **K.** 你无法更改表空间的 `Initialsize`、`Extentsize` 和 `Pagesize` 属性。\n\
  \n### 问题 88\n正确答案是 **D.** 若要让默认数据库保持行组织并仍然能够创建列组织表，你必须从 `STMM` 控制中移除 `SORTHEAP`\
  \ 和 `SHEAPTHRES_SHR`。请记住，`CREATE DATABASE` 这两个设置的默认值为 `AUTOMATIC`。`SORTHEAP` 和 `SHEAPTHRES_SHR`\
  \ 的默认设置也是 `AUTOMATIC`。\n\n### 问题 89\n正确答案是 **D.** 当启用 `EXTENDED_ROW_SZ` 时，无法放入最大行大小的数据将存储为\
  \ `LOB`，这可能会对性能产生负面影响。\n\n### 问题 90\n正确答案是 **C.**\n\n### 问题 91\n正确答案是 **G.**\n\n\
  ### 问题 92\n正确答案是 **F.** 除了 F 之外，所有都是需要的。`SHEAPTHRES_SHR` 和 `SORTHEAP` 不应为 `AUTOMATIC`。两者都应该根据所执行的工作负载设置为适当的值。\n\
  \n### 问题 93\n正确答案是 **D.** 为了支持恢复 (restore) 和向前重滚 (roll-forward)，目标系统必须是备份镜像中成员的超集。只有\
  \ D 满足这一条件。\n\n### 问题 94\n正确答案是 **C.** 这种情况确实是可能的，但如果向前重滚操作遇到删除成员日志记录（该记录是在成员删除后运行时生成的），向前重滚命令本身将立即失败，而不会处理该删除成员日志记录。\n\
  \n# 附录 A\n\n## DSFA 指南\n数据库服务灵活架构 (DSFA) 是一系列指南旨在提供最高级别的可靠性、可用性、可扩展性和性能 (RASP)，同时提供必要的灵活性。\n\
  \n如今，许多公司运行着多个数据库管理软件产品。在许多情况下，它们对每个产品都实施了不同的标准和策略，这使得管理变得困难。\n\n无论你使用的是 Windows、Linux\
  \ 还是 AIX，经过微调后，DSFA 指南都可以用于并实施所有数据库软件。\n\n## 服务器管理\n以下是管理服务器的 DSFA 指南：\n\n1. 数据库服务器应仅运行数据库工作负载。无论使用私有服务器还是共享服务器，请保持数据库工作负载与其他负载隔离。\n\
  2. 限制登录数据库服务器的用户，仅限数据库支持组或组织支持组。\n3. 允许数据库支持组织对所有 UNIX 数据库服务器拥有 `sudo` root 级权限，并对所有\
  \ Windows 数据库服务器拥有管理员权限。\n4. 与 root 类似，设置 `DB2` 实例所有者的 UNIX ID 受限制，并要求所有数据库支持成员使用\
  \ `sudo` 或 `su` 获取访问权限。\n5. 使用 root 管理所有数据库软件，并将软件存放在 UNIX 的 `/opt` 文件系统上，或专门为软件安装设置的\
  \ Windows 驱动器上。保留 C 盘仅用于操作系统软件。\n6. 在 `db2setup` 之外创建 `DB2` 实例。\n7. 如果你现在在使用 `db2_install`，请停止使用它。\n\
  8. 为 root 设置 `umask` 值，以便安装期间在 `/tmp` 中创建的文件可以其他支持团队（如 DBA）读取。\n9. 统一使用 UNIX shell。不要混合使用。\n\
  10. 创建一个数据库服务器黄金镜像 (Golden build)，并将其作为任何数据库服务器请求的起点。\n11. 为所有 `DB2` 实例所有者的 UNIX\
  \ ID 将 `ulimits` 设置为无限。\n12. 将所有 `DB2` 实例所有者的 UNIX 设置 设置密码永不过期。\n13. 对于 AIX 系统，确保异步\
  \ I/O 可用。\n14. 对于 Linux 系统，关闭 `selinux`。\n15. 使应用程序服务器和相关的数据库服务器物理距离尽可能近（在同一个 DMZ\
  \ 且在同一个数据中心内）。\n16. 在数据库服务器上绑定以太网适配器端口，区分通用 TCP/IP 流量和备份流量。如果使用以太网远程内存访问 (RDMA)\
  \ 部署 pureScale，请将通信保持在私有适配器上。\n17. 如果建立了 SSO 的中央存储库（如 Active Directory (AD)），将数据库服务器设置为本地认证后远程认证，并将认证所需的所有\
  \ `DB2` 实例信息存储在本地服务器上。只有 `DB2` 实例 UNIX 账户必须这样设置。\n\n## 文件系统管理\n无论是客户端还是服务器，所有 `DB2`\
  \ 安装都会将数据持久化到磁盘存储设备。为了实现这一点，你必须通过挂载点和文件系统将磁盘设备映射并呈现给服务器。数据库需要磁盘存储来持久化数据，文件系统跨磁盘驱动定义并映射以提供高\
  \ I/O 带宽和性能。\n\n你可以使用表 A.1 中的 DSFA 设计作为任何 `DB2` 部署的起点，并对其进行修改，以纳入跨整个数据库供应商或操作系统的统一数据库标准。所有数据库系统都有数据分组，且每个分组都有不同的\
  \ I/O 模型。表 A.1 列出了七组。*性能扩展* 是糟糕的 I/O 性能对整体数据库性能的相关影响。\n\n![Image](img/1215-1.jpg)\n\
  \n![Image](img/note.jpg)\n\n**注意：** 对于只读数据库，活动日志的影响会较低。\n\n表 A.2 提供了 DSFA 推荐的文件系统列表。所需的尺寸（未包含在内）会有很大差异，并取决于个人需求。\n\
  \n`<ROOT>` 标识数据库软件打开或使用的所有文件系统的初始层级。示例为 `/db`（数据库）或 `/ds`（数据共享）。\n\n![Image](img/1215-2.jpg)\n\
  \n![Image](img/1216.jpg)\n\n![Image](img/1217-1.jpg)\n\n应给挂载点 775 权限 `<DBINSTANCE>`。\n\
  \n## 实例管理\n以下是管理实例的 DSFA 指南：\n\n1. 实例名称\n   模板：`DB2<xxx><NN>`\n   其中 `<xxx>` 是运行的产品/应用程序的私有标识符，或者是实例类型的共享标识符。\n\
  \   有效示例：\n   * `db2sap01` 其中 SAP 是一个产品集合\n   * `db2dsg01` 其中 DSG 代表*数据共享组*（集群）\n\
  \   无效示例：\n   * `db2prd01` 其中 PRD 代表*生产*\n   * `db2V105` 其中 V105 是软件版本\n2. 在所有环境中使用相同的实例名称、端口和数据库名称。\n\
  \   假设你有两个环境：非生产和生产环境。\n   为两者保持相同的实例名称、端口和数据库名称：\n   ![Image](img/1217-2.jpg)\n\
  3. 这些是 UNIX 账户，因此在所有服务器上保持密码相同。\n4. 建立并维护一个用于实例名称、数据库名称、端口号和关键相关者的中央存储库。\n\n## 数据库管理\n\
  以下是数据库管理的最灵活架构 (OFA) 指南：\n\n1. 定义存储组以隔离和管理容器：\n   * `CTLG`—用于 `SYSCATSPACE` (DMS)\n\
  \   * `DATA`—用于用户定义的表空间 (DMS)\n   * `INDX`—用于用户定义的索引表空间 (DMS)\n   * `TEMP`—用于系统临时表空间\
  \ (SMS)\n2. 使用存储组设置：\n   * `OVERHEAD`\n   * `READ AND WRITE TRANSFER RATES`\n  \
  \ 在创建或更改表空间时不要指定这些值。\n3. 将 `DATA` 存储组设置为 `DEFAULT`：\n   ![Image](img/1218.jpg)\n\
  \n\n\n\n\n当为 `DATA` 和 `INDX` 创建存储组时，请指定彼此相反的路径。尽管你可能认为使用 SAN 存储管理和配合大硬盘驱动器的大条带已经消除了\
  \ DBA 管理放置的需要，但事实并非如此。如果你正确管理存储，你会发现 I/O 性能比“不关心（do not care）”方法提升了高达 35%。关于放置的考虑因素太多，在此不详述。\n\
  \n基本上，这里的想法是假设 SAN 中提供一个区域专门用于数据库表空间。文件系统由 `LUNs` 组成，由 `RANKS` 组成，其又包含磁盘存储的 `CHUNKS`。为了便于说明，假设所有内容都使用\
  \ `RAID5`，尽管这不是最佳选项。\n\n![Image](img/1219-1.jpg)\n\nSAN 管理员将继续使用该区域提供表空间分配请求，直到达到例如\
  \ 70% 的分配。届时，他们将向该区域添加磁盘，或者为表空间创建一个额外的区域。\n\n![Image](img/note.jpg)\n\n**注意：** `RANKS`\
  \ 越大、物理硬盘驱动器数量越多，性能和自动性以及 SAN 管理就越好。前例中提供的尺寸仅供参考，在正常情况下会大得多。\n\n查看“产品安装”中的 `DSFA`\
  \ 文件系统指南，你将使用挂载点 `/db/ts10` 到 `/db/ts99` 作为表空间容器。为了便于说明，你定义了两个容器：\n\n![Image](img/1219-2.jpg)\n\
  \n如果 SAN 管理员在构建用于 `/db/ts10` 和 `/db/ts11` 的 `LUNs` 的 `RANKS` 时按照相同的顺序分配磁盘，那么你无法采取任何操作来减少磁盘上的\
  \ I/O 热点。但如果 SAN 管理员以不同的磁盘顺序构建 `RANKS`，那么在某些情况下你可以平衡目标硬盘驱动器：\n\n![Image](img/1220-1.jpg)\n\
  \n现在看看如果你以不同的顺序定义带有 `PATHS` 的 `STOGROUPS` 会发生什么：\n\n![Image](img/1220-2.jpg)\n\n\
  如果你正在创建并填充 `DATA/INDX` 对象，目标应该是不同的磁盘驱动器。容器以轮询方式按区段分配：\n\n![Image](img/1220-1221.jpg)\n\
  \n4. 数据库名称绝不应包含版本、负载或特定应用程序的信息。应用程序 URL 绝不指定实际的物理数据库名称。\n\n良好的数据库名称：\n\n- `DSN01D`\n\
  - `DSR01P`\n- `DB01T`\n\n糟糕的数据库名称：\n\n- `DBESE01`\n- `HR01T`\n- `PAYROLLDB`\n- `DB105P`\n\
  \n5. 使用数据库别名将应用程序映射到正确的物理数据库：\n\n![Image](img/1221.jpg)\n\n无论 DBMS 供应商如何，在整个企业范围内保持数据库名称的唯一。\n\
  \n6. 为每个需要远程访问的数据库创建 `DNS` 别名项。这将为数据库从一个服务器移动到另一台服务器提供方便的方法。不要允许应用程序将实际服务器名称作为 URL\
  \ 的：\n\n![Image](img/1221-1222.jpg)\n\n# 访问管理\n\n访问管理 `DSFA` 指南如下：\n\n1. 限制登录数据库服务器的人员仅提供支持的人员。\n\
  \n2. 所有定义的数据库对象应由 `DB2` 实例所有者或分配了 `PAYROLL_ADM` 角色的用户 ID 所有，但不分配给任何特定个人。\n\n当创建\
  \ `DB2` 对象时，默认所有者是创建者。拥有对象的用户 ID 不能被删除。要删除这些用户 ID，你必须先转移所有权。只要 `DB2` 实例存在，`DB2`\
  \ 实例所有者就会存在，因为它无法更改。\n\n例如，John Smith 是组中的一个新 DBA。他正在将 `PAYROLL` 数据库模式从开发环境迁移到试用环境。John\
  \ 使用其分配的公司网络 ID `JSMITH1` 连接到试用环境中的 `PAYROLL` 数据库。系统管理员在 `PAYROLL` 数据库中设置了 `PAYROLL_ADM`\
  \ 组，并在 UNIX 服务器上将 `JSMITH1` 分配给该组。John 创建了所有对象并测试了 `PAYROLL` 应用程序，一切运行正常。两年后，John\
  \ 成为经理并离开了该组。`JSMITH1` 自动从所有数据库服务器中移除。此时，假设你有 1,000 个对象都由 `JSMITH1` 所有，但该用户 ID 已移除。为了清理这些内容，系统管理员或具有转移权限的人员将不得不将\
  \ 1,000 个对象重新分配给理想的 `DB2` 实例所有者，然后就可以移除 `JSMITH1`。\n\n3. 使用特殊的用户 ID 和组。\n\n有时被称为“伪账户（pseudoaccounts）”，这些是分为以下类别的操作系统登录帐户。这些仅作为示例；你的需求可能会很大差异。\n\
  \na. **服务类。** 这些是支持组织用于运行、管理和服务环境的操作系统组。它们通过使用 `db2 update dbm cfg` 命令在 `DB2` 实例级别分配，并由操作系统分配给用户。此访问适用于在此\
  \ `DB2` 实例中创建的所有数据库：\n\n![Image](img/1223-1.jpg)\n\n- 系统级—实例控制\n    - `SYSADM`（系统管理员）\n\
  \n![images](img/ring.jpg) 实例所有者：它运行所有 `DB2` 进程，取决于公司策略，可能还拥有定义到数据库的所有对象。它是 `DB2`\
  \ 类似 root 的账户。一旦创建实例，对此帐户的操作系统更改可能会导致实例失败——例如更改 `UID`。\n\n    - `SYSCTRL`（系统控制）\n\
  \      此角色执行停止和启动实例服务。\n\n    - `SYSMAINT`（系统维护）\n      此角色执行备份和恢复服务。它提供了一级访问权限，但无法访问数据。\n\
  \n    - `SYSMON`（系统监控）\n      此角色执行监控任务。它通常由监控软件设置和使用。\n\n- `DBADM`\n  此权限管理特定的数据库或数据库集。它在数据库创建后授予给用户、组或角色：\n\
  \n![Image](img/1223-2.jpg)\n\n- `SECADM`\n  此权限管理访问权限；它为特定数据库授予和撤销权限：\n\n![Image](img/1224.jpg)\n\
  \nb. **开发类。** 组织内的开发人员需要访问数据库。在这里，角色、职责与整个开发生命周速度之间存在着一种微妙的平衡。由于服务器、实例和数据库都可以在多个开发项目之间共享，必须实施隔离和控制。\n\
  \n- `applADM`\n  这可以是一个组、用户或角色——`appl` 是标识数据库模式和应用程序的注册代码。它是一个应用前。如果访问包括创建对象，你应该将其设置为一个用户\
  \ ID 并向开发人员提供密码。否则，它应该是一个角色或组。\n\n开发项目可以共享开发人员。如果一个开发人员同时负责 `PAYROLL(PROL)` 和 `CUSTOMER(CRM)`，你可以将该开发人员分配到两个组，这样他或她就可以在一个用户\
  \ ID 下获得访问。\n\n你只在允许访问的环境中定义此级别的访问。例如，开发环境可能具有此访问权限，但试用和生产环境没有。\n\nc. **应用程序类。**\
  \ 这些是用于连接数据库的用户 ID。\n\n- `applUSR`\n  这是应用程序用于连接数据库的通用用户帐户。它通常仅提供 DML 访问。\n\n4.\
  \ 特殊帐户应始终定义在本地服务器上。如果使用 LDAP、AD 或其他中央帐户目录，请在两处都定义，或将这些帐户放置在服务器本地，但不要将它们定义到网络安全工具。\n\
  \n\n\n\n设置 `su` 和/或 `sudo` 以为这些账户提供个人访问权限。公司的每位员工将拥有其自己的网络 ID。总而言，负责执行服务的成员应被分配到定义的提供特定服务的主、辅助\
  \ UNIX 组。例如，假设 John Smith 是一位 DBA，并赋予其网络 ID `x12345`。公司使用 `dbagrp` 作为 SYSADM 权限。因此，`x12345`\
  \ 将具有 `dbagrp` 作为主组或辅助组。`x12345` 也将获得 `su` 权限以及 sudo 级别的访问权限。John Smith 登录到服务器，然后使用\
  \ `su - db2inst1` 或 `sudo su - db2inst1` 成为实例所有者。\n\n`sudo` 有一个显著问题：它要求 UNIX 派生进程（fork）。有时\
  \ UNIX 无法创建派生进程。OFA 指南建议即使在优先使用 `sudo` 的情况下，也始终设置 `su`。使用 `sudo` 的唯一优势是不需要 `db2inst1`\
  \ 的密码。而对于 `su`，必须知道密码。\n\n5. 所有的 UNIX ID 都应该设置为“无限制”资源和“密码永不过期”。\n\n![Image](img/note.jpg)\n\
  \n注意：这并不意味着你*从*更改密码。\n\n# 客户端/服务器通信\n\n你可以使用命令 `db2cli` 来测试在 `db2dsdriver.cfg` 或\
  \ `db2cli.ini` 中定义的连接。程序一次只会识别一个错误，因此你需要确保一直执行它直到不再出现错误为止：\n\n![Image](img/1225.jpg)\n\
  \n在之前的版本中，定义了大写元素——例如 `<WLB>` 和 `<ACR>`。在此版本中，你必须指定这些小写形式才能运行。\n\n**示例 1：** 从客户端\
  \ (UNIX) 和服务器 (UNIX) 设置并测试连接。\n\n在以下示例中，数据库名为 `DB1`，端口为 `55000`，服务器名称为 `DBServer`：\n\
  \n![Image](img/1225-1226.jpg)\n\n**示例 2：** 测试 `db2dsdriver.cfg` 文件中定义的所有连接：\n\n\
