  \n我记得以前有人问我为什么要做数据库软件——对某些人来说，这是一个相当无聊的商品化产品领域。在如今通过大数据和分析提供更大业务价值的计算时代，这个问题已经得到了很好的解答。\n\
  \n`Polyglot`（多语言化）。这是我能想到的描述当今分析驱动数据环境所需成功方法的最佳词。这些环境由各种数据持久化技术组成，如 NoSQL、Hadoop\
  \ 和 RDBMS 等。对于那些宣称“一刀切”的专家们来说，这已经是一次强烈的警钟。重点是什么？RDBMS 并没有死亡，在这一领域投资认证技能不仅被证明是对你时间的明智投资，还能带来规模经济，并对其他项目产生下游获益——即那些你现在可能从事的项目……以及你目前还不知道的项目。\n\
  \n这本书的设计非常周全，不仅是为了让你为获得认证的 DB2 职业生涯做准备，更是为了让你在数据库管理知识领域拥有坚实的基础，无论供应商是哪一家。想一下：无论使用哪种数据库，业务规则的实现、逻辑到物理设计的映射、高可用性、安全性以及书中详述的其他主题，在数据版图中都是无处不在的。对我来说，虽然它是获得\
  \ DB2 10.5 认证的关键工具，但它的意义远不止于此。我很享受这本书，并意识到关于数据库技术和 DB2 永远有学不完的东西。今天，我觉得自己已完全准备好参加最新的\
  \ DB2 认证考试，并且更准备好为我参与的数据环境产生积极影响。\n\n\n\n\n\n我个人撰写过 15 本关于 DB2 的书籍，其中包含针对认证的。我怀着感激的心情认为，这本书比我在该领域能提供的任何内容都要更出色。这本书由我见过的两个最“智力型”的数据库从业者编写——对于这些人来说，在周五深夜寻找更高性能水平的乐趣，远比看一集《国土安全》（*Homeland*）要大。我曾观察过这些人的工作，他们的知识广度令人印象深刻。\n\
  \n最后，作为见证 IT 世界演变的 DB2 从业者，我们面临着转变（shift）、提升（lift）、裂隙（rift）或悬崖（cliff）的挑战。接受书中概念的人，为自己奠定了坚基础，这种基础由转变和提升点燃，能够弥合裂隙并避免悬崖。正如我之前提到的，RDBMS\
  \ 技术不会消失——事实上，它们正在无处不在。NoSQL 中最热门的话题是什么？SQL！当你使用 `IBM` 的 BigSQL 在 `Hadoop` 上编写查询时，该\
  \ `SQL API` 几乎完全符合 `DB2` 标准（书中涵盖了 `DB2 SQL`）。当你利用 `IBM` 的数据仓库即服务 (`DWaaS`) 平台 `dashDB`\
  \ 时，`BLU Acceleration` 技术是该解决方案的一部分（该技术首次在 `DB2` 中亮相，并在第 10 章中介绍）。如果你在 `IBM Bluemix`\
  \ 上构建应用并将数据存储在数据库即服务 (`DBaaS`) 数据库中，你将对书中学习的 `DB2` 技能感到自得其。还有更多……但现在请记住，当你的数据需求从地面扩展到云端、从\
  \ NoSQL 扩展到 SQL 以及之间的所有部分时，你在这里学到的技能将是无价的。\n\n祝你的旅程顺利。\n\n*Paul Zikopoulos*\n\n\
  *IBM Analytics 客户成功副总裁*\n\n*大数据、竞争性与技术销售副总裁*\n\n# 第 1 章\n# IBM DB2 10.1 认证\n\n享誉全球的\
  \ `IBM® Professional Certification Program` 为 IT 专业人士提供系列认证选项。本章将向你介绍从 `IBM` 获取\
  \ `DB2® 10.1 认证`的各种途径，并描述你在参加 `DB2 10.1 认证考试`时将使用的测试软件。\n\n# DB2 10.1 认证角色\n\n当今\
  \ IT 行业最大的趋势之一是认证。许多应用程序和软件供应商现在都制定了认证计划，用于评估和验证个人对供应商最新发布产品的熟练程度。事实上，`IBM` 开发 `Professional\
  \ Certification Program` 的原因之一是为高技能的技术人员提供一种展示他们对特定版本 `IBM` 产品知识和专业能力的方法。\n\n`IBM`\
  \ 的 `Professional Certification Program` 包含几个不同的认证角色，旨在指导你的职业发展。\n\n你通过选择适合自己的角色并熟悉该角色的认证要求开始认证流程。为了帮助你开始，以下小节提供了与每个可用\
  \ `IBM DB2 10.1` 和 `DB2 9.7` 认证相关的先决条件和要求。\n\n# DB2 10.1 认证路径\n\nIBM 为针对 `Linux®`、`UNIX®`\
  \ 和 `Windows®` (`LUW`) 的 `DB2` 提供了三个主要的认证路径，以涵盖数据库管理、应用开发和解决方案开发等专家领域。图 1.1 显示了数据库管理路径。\n\
  \n![Image](img/2.jpg)\n\n*图 1.1：IBM DB2 10.1 数据库管理员认证考试路径*\n\n## 路径 1：数据库管理\n##\
  \ IBM 认证数据库助理——DB2 10.1 基础\n\n此认证适用于入门级 `DB2` 用户，他们熟悉 `Linux`、`UNIX` 和 `Windows`\
  \ 平台上 `DB2 10.1` 的基础概念。除了具有一些 `DB2 10.1` 的操作经验、一些正式培训或两者兼具外，寻求此认证的人应当：\n\n*   了解可用哪些\
  \ `DB2 10.1` 产品，并熟悉 `DB2 10.1` 的各种封装方式\n*   了解为了创建所需环境必须安装哪些 `DB2 10.1` 产品\n*  \
  \ 了解随 `DB2 10.1` 附带工具提供的特性和功能\n*   深入掌握 `DB2 10.1` 可用的结构化查询语言 (`SQL`)、数据定义语言 (`DDL`)、数据操纵语言\
  \ (`DML`) 和数据控制语言 (`DCL`)语句\n*   了解如何创建、访问和操作基础 `DB2` 对象（如表、视图和索引），以及新的临时表功能\n*\
  \   对多用户环境中用于将事务相互隔离的方法有基本理解\n*   熟悉用于控制锁定执行方式的方法\n*   熟悉不同类型的约束并了解每种约束的使用方法\n*\
  \   深入掌握 `DB2 10.1` 用于保护数据和数据库对象不受未经授权访问和/或修改的机制，包括行和列访问控制 (`RCAC`) 和可信上下文 (trusted\
  \ context)\n*   熟悉可扩展标记语言 (`XML`) 数据如何被存储和操作\n\n要获得 `IBM Certified Database Associate\
  \ - DB2 10.1 Fundamentals` 认证，候选人必须参加并通过一项考试：`DB2 10.1 Fundamentals` (`C2090-610`)。\n\
  \n## IBM 认证数据库管理员——适用于 Linux, UNIX 和 Windows 的 DB2\n\n此认证适用于丰富的 `DB2` 用户，他们具备必要的知识和技能，能够对位于\
  \ `Linux`、`UNIX` 或 `Windows` 平台上的 `DB2 10.1` 实例和数据库进行日常管理。除了熟悉 `DB2 10.1` 的基础概念并具有丰富的数据库管理员\
  \ (`DBA`) 经验外，寻求此认证的人应当：\n\n*   了解如何创建、配置和管理 `DB2` 实例和数据库\n*   了解如何配置客户端/服务器连接\n\
  *   能够获取并修改环境变量和注册表变量\n*   能够获取并修改数据库管理器（实例）和数据库配置参数值\n*   了解如何使用 IBM Data Studio\
  \ GUI 工具管理实例和数据库、创建和访问对象，以及管理数据库更改和任务\n*   了解如何创建、访问、修改和管理不同的 `DB2 10.1` 对象\n* \
  \  能够在表对象之间及其创建约束\n*   深入掌握系统管理空间 (`SMS`)、数据库管理空间 (`DMS`) 和自动存储表空间，以及数据库存储组\n* \
  \  了解如何使用自动功能，例如自动维护、自调内存管理器 (`STMM`) 和配置顾问 (Configuration Advisor)\n*   了解如何管理\
  \ `XML` 数据并使用 XPATH 表达式对其进行修改\n*   了解如何使用 DB2 管理视图和表函数，以及事件监视器监控数据库\n*   了解如何获取和解释快照监视数据\n\
  *   了解如何获取和分析 DB2 Explain 信息\n*   深入掌握 `Export`、`Import`、`Load` 和 `Ingest` 工具\n\
  *   了解如何使用 `REORGCHK`、`REORG`、`REBIND`、`RUNSTATS`、`db2look`、`db2move` 和 `db2pd`\
  \ 命令\n*   深入掌握 `DB2 10.1` 用于保护数据和数据库对象不受授权访问或修改的机制，包括基于标签的访问控制 (`LBAC`) 和 `RCAC`\
  \ 机制\n*   对事务日志机制和存档技术有基本理解\n*   了解如何执行数据库级和表空间备份、恢复和滚动恢复操作\n*   已知如何实现高可用性和灾备 (`HADR`)，并理解多备用\
  \ HADR 实现指南\n\n\n\n\n\n* 能够解释存储在管理通知日志中的信息\n* 具备 pureScale 操作的基础知识\n\n通过 `DB2 10.1\
  \ Fundamentals` 考试 (C2090-610) 或 `DB2 9 Fundamentals` 考试 (C2090-730) 的候选人必须参加并通过\
  \ `DB2 10.1 for Linux, UNIX, and Windows Database Administration` 考试 (C2090-611)，以获得\
  \ `IBM Certified Database Administrator—DB2 10.1 for Linux, UNIX, and Windows` 认证。\n\
  \n# IBM Certified Database Administrator—DB2 10.5 DBA for LUW Upgrade from 10.1\n\
  \n此认证适用于经验丰富的 DB2 用户，他们拥有对位于 Linux、UNIX 或 Windows 平台上的 DB2 10.5 实例和数据库进行日常管理所需的知识和技能。除了熟悉\
  \ DB2 10.1 数据库管理概念并作为 DB2 10.5 的 DBA 拥有丰富的实践经验（特别是 BLU 加速）外，寻求此认证的人员应该：\n\n* 了解如何在\
  \ DB2 10.5 BLU 上设计、创建和管理数据库\n* 了解如何为分析系统配置 DB2 工作负载\n* 了解如何在 DB2 10.5 BLU 加速中使用自适应计算功能\n\
  * 了解如何使用 IBM Data Studio 4.1 和 Optim™ Query Workload Tuner 工具\n* 能够理解 DB2 10.5 BLU\
  \ 加速的七大核心理念：\n    1. 简单——无需索引、多维聚集 (MDC) 表、物化查询表 (MQT)、范围分区或统计视图\n    2. 极高压缩和计算机友好型编码\n\
  \    3. 使用单指令多数据 (SIMD) 集合深度利用硬件\n    4. 核心友好型并行处理\n    5. 列存储\n    6. 扫描友好型内存缓存\n\
  \    7. 通过 `SYNOPSYS` 表跳过数据\n* 了解如何实现表压缩和备份压缩\n* 了解如何使用基于表达式的索引以及如何在这些索引上使用 `RUNSTATS`\n\
  * 了解如何使用 Oracle® 兼容特性，例如深嵌套对象树、扩展行长度以及三个新的索引增强\n* 了解如何使用新的监控元素监控 DB2 10.5 数据库实例和数据库\n\
  * 了解如何使用 Explain 捕获 DB2 10.5 BLU 中的列表队列 (CTQ) 运算符\n* 了解如何使用 HADR 监控增强\n* 了解如何在 pureScale\
  \ 环境中使用在线 `REORG`\n* 了解如何在 pureScale 集群环境中设置 HADR\n* 了解如何在 pureScale 集群中使用滚动修复包升级、STMM\
  \ 多租户和显式分级锁\n* 了解如何安装、激活和配置用于备份操作的 DB2 Advanced Copy Services 自定义脚本\n* 了解如何使用 `db2convert`\
  \ 工具将行存储表转换为列存储表\n* 了解 `LOAD` 命令在行存储表和列存储表之间的执行差异\n\n要获得 `IBM Certified Database\
  \ Administrator—DB2 10.5 DBA for LUW Upgrade from 10.1`，候选人必须持有 `IBM Certified Database\
  \ Administrator—DB2 10.1 for Linux, UNIX, and Windows` 认证，并且必须参加并通过 `DB2 10.5 DBA\
  \ for LUW Upgrade from 10.1` 考试 (C2090-311)。\n\n# IBM Certified Advanced Database\
  \ Administrator—DB2 10.1 for Linux, UNIX, and Windows\n\n此认证适用于高级数据库管理员，他们拥有关于 DB2\
  \ 的广泛知识，并在以下一个或多个支持平台（Linux、AIX、HP-UX、Sun Solaris 或 Windows）上拥有 DB2 10.1 的丰富经验。除了熟悉\
  \ DB2 中更复杂的概念并作为 DB2 10.1 数据库管理员拥有丰富经验外，寻求此认证的人员应该：\n\n* 了解如何设计、创建和管理缓冲池\n* 了解如何设计、创建和管理\
  \ SMS、DMS、自动存储表空间和存储组，以及多温度数据\n* 能够创建和管理 MDC、范围分区、范围聚集和插入时间聚集 (ITC) 表\n* 能够在表对象内部及对象之间创建约束\n\
  * 能够识别并修改对性能影响最大的 DB2 数据库管理器和数据库配置文件参数值\n* 具备深厚的查询优化知识\n* 能够正确地分析、隔离并修正数据库性能问题\n\
  * 了解如何管理大量用户和连接，包括到主机系统的连接\n* 了解何时创建索引将提高数据库性能\n* 能够充分利用分区内并行和分区间并行\n* 能够设计、配置和管理跨多个服务器的数据库分区功能\
  \ (DPF) 数据库\n* 了解如何管理联邦服务器和分布式工作单元\n* 具备 DB2 10.1 用于保护数据和数据库对象不受未经授权访问或修改的外部认证机制知识\n\
  * 了解如何使用 LBAC 和 RCAC 实现数据加密\n* 了解如何设计、实现和管理 DB2 审计功能\n* 能够理解并制定日志策略\n* 了解如何执行数据库级和表空间级的备份、恢复和向前滚恢复操作\n\
  * 能够使用高级备份和恢复功能\n* 了解如何通过日志传输、复制、故障转移、故障监控和带有多个备机功能的 HADR 实现备用数据库\n* 了解如何设计、配置和维护\
  \ DB2 工作负载管理器 (WLM)\n* 了解如何管理 pureScale 系统\n\n要获得 `IBM Certified Advanced Database\
  \ Administrator—DB2 10.1 for Linux, UNIX, and Windows` 认证，候选人必须持有 `IBM Certified\
  \ Database Administrator—DB2 10.1 for Linux, UNIX, and Windows` 认证，并且必须参加并通过 `DB2\
  \ 10.1 for Linux, UNIX, and Windows Advanced Database Administration` 考试 (C2090-614)。\n\
