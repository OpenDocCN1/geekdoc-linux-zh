  \ |\n| ![images](img/circ.jpg) | B. | 员工工作站上的 `DB2COMM` 未正确设置。 |\n| ![images](img/circ.jpg)\
  \ | C. | `PAYROLL` 数据库在服务器上未正确编入。 |\n| ![images](img/circ.jpg) | D. | `PAYROLL`\
  \ 数据库在员工工作站上未正确编入。 |\n\n### Question 8\n\nHR 部门没有人可以从其工作站连接到名为 `PAYROLL` 的远程数据库。初步调查显示网络没有问题，服务器上的实例处于激活状态，TCP/IP\
  \ 在客户端和服务器上运行正常，且用户正在使用有效的用户 ID 和密码尝试连接。最可能的原因是什么？\n\n| ![images](img/circ.jpg)\
  \ | A. | 远程数据库服务器上的 `DB2COMM` 未正确设置。 |\n| ![images](img/circ.jpg) | B. | 远程实例的验证类型未设置为\
  \ `CLIENT`。 |\n| ![images](img/circ.jpg) | C. | 远程数据库服务器上的 `DAS` 未启动。 |\n| ![images](img/circ.jpg)\
  \ | D. | `PAYROLL` 数据库在每个员工的工作站上未正确编入。 |\n\n### Question 9\n\n客户端可以发出哪两种类型的 DB2\
  \ Discovery 请求？\n\n\n\n\n\n| ![images](img/box.jpg) | A. | KNOWN（已知） |\n| ![images](img/box.jpg)\
  \ | B. | SEARCH（搜索） |\n| ![images](img/box.jpg) | C. | HASHMAP（哈希映射） |\n| ![images](img/box.jpg)\
  \ | D. | LOOKUP（查找） |\n| ![images](img/box.jpg) | E. | TRUSTED（信任） |\n\n### 问题 10\n\
  从 Windows DB2 客户端连接名为 `SAMPLE` 的 DB2 for z/OS 数据库时，一名员工收到以下消息：`SQL1013N The database\
  \ alias name or database name “SAMPLE” could not be found.` 同部门的其他员工可以顺利地连接到数据库。仔细检查发现，每个人工作站上节点和系统数据库目录中的服务器和数据库项是相同的。你应该执行哪项操作来解决问题？\n\
  \n| ![images](img/circ.jpg) | A. | 在 z/OS 服务器上停止并重启实例。 |\n| ![images](img/circ.jpg)\
  \ | B. | 在系统数据库目录中取消编并重新编入数据库。 |\n| ![images](img/circ.jpg) | C. | 在远程数据库目录中编入数据库。\
  \ |\n| ![images](img/circ.jpg) | D. | 在数据库连接服务 (DCS) 目录中编入数据库。 |\n\n### 问题 11\n\
  在 UNIX 客户端与 z/OS 服务器之间的 DB2 Connect 配置中，执行了以下命令：\n\n```\n![Image](img/974.jpg)\n\
