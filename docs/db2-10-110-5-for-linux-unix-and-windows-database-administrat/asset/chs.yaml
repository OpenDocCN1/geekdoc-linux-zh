  \n![Image](img/18.jpg)\n\n*图 1.10：附件面板示例*\n\n\n\n\n\n通过点击屏幕左下角的 `Review Marked`\
  \ 按钮（参考图 1.11），你可以快速返回查看已标记的题目。当你以这种方式回顾已标记的项目时，每当你点击题目面板上的 `Next` 按钮，你就会跳转到列表中的下一个已标记问题，直到你最终返回项目回顾面板。\n\
