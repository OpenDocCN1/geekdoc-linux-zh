  \ 表，请执行简单的 `SELECT` 语句：\n\n![Image](img/248-2.jpg)\n\n要取消注册表变量，可以执行此语句：\n\n![Image](img/248-3.jpg)\n\
  \n在不设置会话系统时间注册表的情况下运行相同的 `SELECT` 语句将产生不同的记录集，如下所示：\n\n![Image](img/248-4.jpg)\n\
  \n然而，如果你在会话系统时间激活时尝试从系统周期时间表删除记录，将得到 SQL20535N 错误：\n\n![Image](img/249-1.jpg)\n\n\
  与会话系统时间一样，你可以使用会话业务时间设置默认业务周期：\n\n![Image](img/249-2.jpg)\n\n取消会话业务时间并运行相同的 `SELECT`\
  \ 语句将产生如下结果：\n\n![Image](img/249-250.jpg)\n\n如果在设置会话业务时间注册表的同时包含业务时间的表中更新或删除行，`UPDATE`\
  \ 或 `DELETE` 语句仅影响在指定范围内有效的行。例如，如果你尝试删除会话业务时间设置为 `‘2015-01-01’` 的记录，DB2 数据库管理器将在\
  \ `DELETE` 命令的 `WHERE` 子句中添加 `‘2015-01-01’`：\n\n![Image](img/250.jpg)\n\n上述 `DELETE`\
  \ 命令类似于通过 `DELETE FROM SELLPRODUCT_BT WHERE BUSINESS_START=‘2015-01-01’` 命令执行删除操作：\n\
  \n![Image](img/251-1.jpg)\n\n## 使用 XML 数据工作\n\nDB2 的 pureXML 技术通过提供简单、高效的 XML 数据访问，解锁了\
  \ XML 数据的潜力，且具有与关系型数据同等水平的安全性、完整性和韧性。DB2 的 pureXML 技术可作为附加功能提供给 DB2 快速版 (EE)、DB2\
  \ 工作组服务器版 (WSE) 和 DB2 企业服务器版 (ESE)。它是 DB2 Express-C 的一部分。\n\n通过 pureXML，XML 数据存储在层次结构中，反映了\
  \ XML 文档的结构。这种结构结合创新的索引技术，使 DB2 能够高效地管理 XML 数据，同时消除了在关系型数据库中存储 XML 数据时通常复杂解析。然而，在使用\
  \ pureXML 时存在某些限制：\n\n* pureXML 仅适用于单分区数据库。\n* 使用任何 pureXML 功能将导致无法使用 ESE 中提供的 DPF（活动分区数据库）。\n\
  * pureXML 无法用于 DB2 Info Warehouse 版本，因为它使用了 ESE 和 DPF。\n\n要使用 pureXML 功能，必须使用 UTF-8\
  \ 字符集创建数据库。`CREATE DATABASE` 命令的 `USING CODESET` 选项指定 UTF-8 字符集。\n\n如果你想创建一个名为 `XML_DB`\
  \ 的使用 UTF-8 字符集的数据库，可以执行如下所示的 `CREATE DATABASE` 命令：\n\n![Image](img/251-2.jpg)\n\
  \n## XML 数据类型和 XML 列\n\n为了支持 pureXML，DB2 9 引入了 `XML` 数据类型。该类型定义了存储 XML 值的列。存储的每个\
  \ XML 值必须是良好的 XML 文档，如下所示：\n\n![Image](img/252-1.jpg)\n\n大多数 XML 文档以 XML 声明开始，例如：\n\
  \n![Image](img/252-2.jpg)\n\n或\n\n![Image](img/252-3.jpg)\n\nXML 声明之后是一个或多个属性和元素。所有\
  \ XML 元素都由起始和结束标签包围，如此示例所示：\n\n![Image](img/252-4.jpg)\n\n\n\n\n请注意，起始和结束标签是区分大小写的——标签\
  \ `<Letter>` 与标签 `<letter>` 不同。因此，你必须以相同的大小写形式编写起始和结束标签。\n\n你通常使用 XML 属性来描述 XML\
  \ 元素或为元素提供额外信息。属性始终包含在元素的起始标签内，并且属性值必须包含在双引号中。是一些示例：\n\n![Image](img/253-1.jpg)\n\
  \n属性在 HTML 中非常有用，但在 XML 中，每当可以使用元素表达相同信息时，你应该尽量避免使用属性。以下示例表达了相同的信息：\n\n![Image](img/253-2.jpg)\n\
  \n在第一个示例中，`SEX` 是一个属性。在最后一个示例中，`SEX`是一个元素。\n\n### XML 列\n\n要创建带有 XML 列的表，你需要在 `CREATE\
  \ TABLE` 语句中使用 `XML` 数据类型来指定列。（表可以有一个或多个 XML 列。）就像 LOB 列一样，XML 列只保存该列的描述符。数据本身被分开存储。与\
  \ LOB 列不同，在定义 XML 列时不需要指定长度。因此，要创建一个名为 `CUSTOMER` 且包含名为 `CUSTINFO` 的 XML 列的表，请执行如下\
  \ `CREATE TABLE` 语句：\n\n![Image](img/253-3.jpg)\n\nXML 列具有以下限制：\n\n* 不能通过 `WITH\
  \ DEFAULT` 子句指定默认值；如果列允许为空，则该列的默认值为 `NULL`。\n* 不能在 `CHECK` 约束中被引用（使用 `VALIDATED`\
  \ 谓词除外）。\n* 不能在生成列中被引用。\n* 不能被包含在类型表和类型视图中。\n* 不能在 RCT 中使用。\n* 不能在 MDC 表中使用。\n*\
  \ 不能被添加到定义了 Type-1 索引的表中（注意，Type-1 索引是已废弃的索引；自 DB2 UDB 8.1 版本以来创建的索引都是 Type-2 索引）。\n\
  * 不能在滚动游标的选择列表中指定。\n* 不能在 `CREATE TRIGGER` 语句的触发器操作中被引用。\n* 不能作为键的列包含，包括主键、外键和唯一键；MDC\
  \ 表的维度键；RCT 的序列键；分区键；以及数据分区键。\n* 不能在带有分区键的表中使用。\n* 不能是除 XML 数据索引之外的任何索引的一部分。\n*\
  \ 在检索 XML 数据时，会导致禁用数据阻塞。\n\n## 操作 XML 数据\n\n与传统数据一样，XML 文档可以使用 SQL DML 语句 `INSERT`、`UPDATE`、`DELETE`\
  \ 和 `SELECT` 添加到数据库表中、修改、删除和检索。通常，应用程序处理 XML 文档（根据 XML 1.0 规范定义）。当应用程序执行 DML 操作时，IBM\
  \ 建议通过主机变量而非字面量进行 XML 数据操作，以便 DB2 使用主机变量数据类型确定处理所需的某些编码信息。尽管你可以使用 `XML`、二进制或字符类型操作\
  \ XML 数据，但 IBM 建议使用 `XML` 或二进制类型以避免代码页转换问题。\n\n应用程序中使用的 XML 数据通常以序列化字符串格式存储——当这些数据被插入\
  \ XML 列或当 XML 列中的数据被更新时，必须将其转换为 XML 层级结构格式。如果你使用的应用程序数据类型是 `XML` 数据类型，DB2 会隐式地执行此操作。然而，如果应用程序数据类型是字符或二进制数据类型，你必须在插入和更新操作期间使用\
  \ `XMLPARSE()` 函数将数据从其序列化字符串格式显式转换为 XML 层级结构格式。\n\n一个使用 `XMLPARSE()` 函数将字符串值插入名为\
  \ `CUSTOMERS` 表中名为 `CUSTINFO` XML 列的简单 `INSERT` 语句可能如下：\n\n![Image](img/255-1.jpg)\n\
  \n当你使用 CLP 处理存储在 XML 列中的 XML 文档时，在执行插入、更新和删除操作时，不需要显式调用 `XMLPARSE()` 函数即可直接将字符串数据分配给\
  \ XML 列。例如，假设你想向名为 `CUSTOMER` 的表添加一条包含 XML 数据的记录，该表具有以下特征：\n\n| 列名 | 数据类型 |\n| :---\
  \ | :--- |\n| CUSTID | INTEGER |\n| INFO | XML |\n\n你可以通过从 CLP 执行类似如下所示的 `INSERT`\
  \ 语句来实现这一点：\n\n![Image](img/255-2.jpg)\n\n如果你想从 CLP 更新此条记录的 XML 数据部分，请执行类似于下文所示的\
  \ `UPDATE` 语句：\n\n![Image](img/256-1.jpg)\n\n最后，要从 `CUSTOMER` 表中删除该记录，你从 CLP 执行\
  \ `DELETE` 语句：\n\n![Image](img/256-2.jpg)\n\n那么，一旦 XML 数据存储在表中，你如何检索它呢？在 DB2 中，你可以使用\
  \ SQL 查询或常用的 SQL/XML 查询函数来检索 XML 数据。当使用 SQL 查询 XML 数据时，你只能在列级别检索数据——也就是说，必须检索整个\
  \ XML 文档。无法使用 SQL 返回文档的片段。要在 XML 文档内部进行查询，你需要使用 XQuery。\n\nXQuery 是由世界维网联盟 (W3C)\
  \ 设计的一种函数编程语言，用于满足查询 XML 数据的特定需求。与可预测且具有规则结构的关系数据不同，XML 数据通常是不可预测的、高度变化的、稀疏且自描述的。由于\
  \ XML 数据的结构不可预测，在 XML 数据上执行的查询通常与典型的关系查询不同。例如，你可能需要创建执行以下操作的 XML 查询：\n\n* 在 XML\
  \ 数据中搜索位于未知层级的对象\n* 对数据进行结构化转换（例如，你可能想反转层次结构）\n* 返回混合类型的结果\n\n在 XQuery 中，表达式是查询的主要构建块。表达式可以嵌套，并构成了查询的主体。查询还可以有一个序言（prolog），其中包含一组定义查询处理环境的声明。\n\
  \n因此，如果你想从存储在 `CUSTOMER` 表 `CUSTINFO` 列的 XML 文档中检索居住在北卡罗来州的所有客户姓名（假设该表已通过我们之前看到的\
  \ `INSERT` 语句填充），请执行类似如下所示的 XQuery 表达式：\n\n![Image](img/257-1.jpg)\n\n当你从 CLP 执行此\
  \ XQuery 表达式时，它应该返回如下所示的信息（再次假设该表已通过我们之前看到的 `INSERT` 语句填充）：\n\n![Image](img/257-2.jpg)\n\
  \n为了移除 XML 标签并仅返回客户姓名，你应该执行如下所示的 XQuery 表达式：\n\n![Image](img/257-3.jpg)\n\n现在当你从\
  \ CLP 执行该 XQuery 表达式时，它应该返回如下信息：\n\n![Image](img/258.jpg)\n\n如前，你可以使用以下 SQL/XML\
  \ 函数或谓词从 SQL 中调用 XQuery 表达式：\n\n* `XMLQUERY()`。这是一个 SQL 标量函数，允许你在 SQL 上下文中执行 XQuery\
  \ 表达式。`XMLQUERY()` 返回一个 XML 值，即 XML 序列。该序列为空，也可以包含一个或多个项目。你还可以向 `XMLQUERY()` 中指定的\
  \ XQuery 表达式传递变量。\n\n\n\n\n\n*   `XMLTABLE()`。这是一个 SQL 表函数，它根据 XQuery 表达式的求值结果返回一个表。XQuery\
  \ 表达式通常以序列（sequence）的形式返回值；然而，`XMLTABLE()` 允许你执行 XQuery 表达式并将值以表格的形式返回。返回的表格可以包含任何\
  \ SQL 数据类型的列，包括 XML。结果表格的结构由 `XMLTABLE()` 的 `COLUMNS` 子句定义。\n*   `XMLEXISTS`。该谓词用于判断\
  \ XQuery 表达式是否返回了一个或多个项目的序列。如果此谓词中指定的 XQuery 表达式返回空序列，则 `XMLEXISTS` 返回 `FALSE;`；否则返回\
  \ `TRUE`。你可以在 `UPDATE`、`DELETE` 和 `SELECT` 语句的 `WHERE` 子句中使用 `XMLEXISTS` 谓词。这种用法意味着你可以使用存储的\
  \ XML 文档中的值来限制 DML 语句的操作行集。\n\n通过在 SQL 上下文中执行 XQuery 表达式，你可以：\n\n*   对存储的 XML 文档的部分而非整个文档进行操作（只有\
  \ XQuery 可以在 XML 文档内部进行查询；SQL 仅能在整个文档级别进行查询）\n*   让 XML 数据参与 SQL 查询\n*   同时对关系数据和\
  \ XML 数据进行操作\n*   对返回的 XML 值应用进一步的 SQL 处理（例如，通过子查询的 `ORDER BY` 子句对结果进行排序）\n\n假设你想为一个名为\
  \ `CUSTOMER` 的表检索客户 ID 和客户名称，该表具有以下特征：\n\n| 列名 | 数据类型 |\n| :--- | :--- |\n| CUSTID\
  \ | INTEGER |\n| INFO | XML |\n\n你可以通过在 CLP 中执行类似下方的 `SELECT` 语句（假设该表已通过之前看过的 `INSERT`\
  \ 语句填充了数据）来实现这一目标：\n\n![Image](img/259-1.jpg)\n\n当执行执行此查询时，它应该返回类似于下所示的信息：\n\n![Image](img/259-2.jpg)\n\
  \n## XML 索引\n\n就像你可以在关系数据上使用索引来提高查询性能一样，你可以在 XML 数据上使用索引来提高对存储在 XML 列中的 XML 文档进行查询的效率。传统的传统的索引（索引键由你指定的列或多个列组成）不同，XML\
  \ 数据索引使用特定的 XML 模式表达式来对存储在单列中的 XML 文档中的路径和值进行索引。该列的数据类型必须是 XML。\n\n为了确定要索引的文档部分，你使用\
  \ XML 模式来指定 XML 文档中的一组节点。该模式表达式与 XQuery 语言中定义的路径表达式相似，但不同之处在于只支持 XQuery 语言的子集。路径表达式步骤通过正斜杠（`/`）分隔。你还可以指定双正斜杠（`//`）——它是\
  \ `/descendant-or-self::node()` 的简写语法。在每一步中，你选择一个正向轴（`child::`、`@`、`attribute::`、`descendant::`、`self::`\
  \ 和 `descendant-or-self::`），后接 XML 名称或 XML 类型测试。如果不指定正向轴，则默认使用子轴。图 3.5 显示了一个简单的\
  \ XML 模式以及如何使用它来识别 XML 文档中的特定值。\n\n![Image](img/260-1.jpg)\n\n*图 3.5：如何使用 XML 模式识别\
  \ XML 文档中的特定值*\n\nXML 数据索引中的索引项并不是提供文档头的访问，而是通过根据 XML 模式表达式创建索引键提供对文档内部节点的访问。由于\
  \ XML 文档的多个部分可以满足 XML 模式，你可以为单个文档插入多个索引键。\n\n要创建 XML 索引，请在 `CREATE INDEX` SQL 语句中指定\
  \ `GENERATE KEY USING XMLPATTERN` 子句。该可选子句的基本语法如下：\n\n![Image](img/260-2.jpg)\n\n\
  | where: | |\n| :--- | :--- |\n| 命名空间 (Namespace) | 标识有效的命名空间声明，用于在指定的模式表达式中使用限定名时标识命名空间前缀\
  \ |\n| XML 模式 (XMLPattern) | 指定要索引节点的模式表达式；该模式表达式可以包含以下任何 XQuery 组件：<br>• `*`（星号）——指定模式匹配字符<br>•\
  \ `/`（正斜杠）——分隔路径表达式步骤<br>• `//`（双正斜杠）——`/descendant-or-self::node()` 的简写语法<br>•\
  \ `child::`——指定上下文节点的子节点；如果没有指定其他正向轴，则默认使用子轴<br>• `@`——指定上下文节点的属性；它是 `attribute::`\
  \ 的简写语法<br>• `attribute::`——指定上下文节点的属性<br>• `descendant::`——指定上下文节点的后代<br>• `self::`——仅指定上下文节点本身<br>•\
  \ `descendant-or-self::`——指定上下文节点及其后代 |\n| SQL 数据类型 (SQLDataType) | 指定在存储索引值之前将其转换的\
  \ SQL 数据类型；该参数的以下值均有效：`VARCHAR(Size)`、`DOUBLE`、`DATE` 和 `TIMESTAMP` |\n\n因此，如果你想通过使用表\
  \ `CUSTOMER` 中 XML 列 `CUSTINFO` 中的邮政邮编码值来创建 XML 索引，并将这些值存储为 `DOUBLE` 值，请执行类似下面的\
  \ `CREATE INDEX` 语句：\n\n![Image](img/261-1.jpg)\n\n然而，如果你想通过使用表 `CUSTOMER` 中 XML\
  \ 列 `CUSTINFO` 中的地址信息来创建 XML 索引，并将这些值存储为 `VARCHAR` 值，请执行类似于下面的 `CREATE INDEX` 语句：\n\
  \n![Image](img/261-2.jpg)\n\n在第一个示例中，索引为元素创建；在第二个示例中，为属性创建。虽然可以为属性（甚至是整个文档）创建 XML\
  \ 索引，但可能会影响性能。因此，最好为元素创建 XML 索引。\n\n## 数据压缩\n\n在 DB2 中，你有多种压缩功能优化存储：\n\n*   DB2\
  \ 9.1 之前——值压缩、MDC 块索引和备份压缩\n*   DB2 9.1——静态行压缩\n*   DB2 9.5——自动字典创建过程\n*   DB2 9.7——索引、内置\
  \ LOB、临时表、XML 和复制表压缩\n*   DB2 10.1——自适应压缩和日志归档压缩\n\n## DB2 9.1——静态行压缩\n\nDB2 9.1\
  \ 引入的最显著特性之一是可以使用数据行压缩减少存储表数据所需的存储空间。虽然数据行压缩的主要目的是节省存储空间，但它还能显著减少磁盘 I/O 节省并提高缓冲池命中率。（更多数据可以被缓存在内存中。）这一切都可能提高性能，但并非没有代价——需要额外的\
  \ CPU 周期来压缩和解压缩数据。数据行压缩的存储节省和性能影响直接取决于数据库中数据的特征、数据库本身的设计、调优程度以及应用程序工作负载。\n\n\n\n\
  \n将这一概念应用于数据，你会发现情况也是如此的。例如，根据 2010 年美国人口普查，美国约居住着 3 亿人口。但唯一的姓氏只有约 78,800 个，导致基数（cardinality）极低，在某些姓名集中存在巨大的“聚集”。名字的情况甚至更糟，大约有\
  \ 6,600 个（女性有 4,400 个唯一女性名，男性有 2,200 个）。城市、街道和地址名称，以及产品名称、描述和属性也倾向于高度冗余且基数较低。\n\n\
  数据行压缩通过搜索数据中重复的模式，并将这些模式替换为 12 位符号来实现，这些符号将与它们代表的模式一起存储在静态字典中。（一旦创建了此字典，它将与压缩后的数据一起存储在表中，每当访问表中的数据时，它会被加载到内存中以帮助解压缩。）`DB2`\
  \ 通过扫描整张表并查找重复的列值，以及跨越行中多个列的重复模式来实现此。`DB2` 还会查找作为给定列子字符串的重复模式。然而，仅仅发现重复模式并不意味着数据会自动压缩——数据只有在能够实现存储节省的地方才会被压缩。图\
  \ 3.6 阐了数据行压缩的工作原理。\n\n![Image](img/263-1.jpg)\n\n*图 3.6: DB2 9.1 静态行压缩的工作原理*\n\n\
  要在表中使用数据行压缩，必须满足两个前提条件：\n\n1. 必须在表级启用压缩。\n2. 必须为该表构建压缩字典。\n\n### 启用静态行压缩\n\n你可以通过执行\
  \ `CREATE TABLE` SQL 语句或指定 `COMPRESS YES` 选项 `ALTER TABLE` 语句在表级启用压缩。例如，如果你想创建一个名为\
  \ `EMPLOYEE` 的新表并启用其数据行压缩，可以执行类似下面的 `CREATE TABLE` 语句：\n\n![Image](img/263-2.jpg)\n\
  \n然而，要为名为 `EMPLOYEE` 的现有表启用数据行压缩，你需要执行如下所示的 `ALTER TABLE` 语句：\n\n![Image](img/264-1.jpg)\n\
  \n你可以查询系统目录视图来验证压缩模式：\n\n![Image](img/264-2.jpg)\n\n在上面的示例中，`COMPRESSION R` 表示行压缩，`ROWCOMPMODE\
  \ S` 表示静态压缩。\n\n### 构建压缩字典\n\n尽管你可以随时通过将表的 `COMPRESS` 属性设置为 `YES,` 来为表启用静态行压缩，但在构建压缩字典之前，存储在表中的数据不会被压缩。要构建压缩字典（并压缩表中的数据），你需要使用离线表重组操作。你可以通过执行指定\
  \ `KEEPDICTIONARY` 或 `RESETDICTIONARY` 选项的 `REORG` 命令来启动此类操作。如果你执行了指定任一选项的 `REORG`\
  \ 命令且字典不存在，则将构建新字典。然而，如果你执行了指定任一选项的 `REORG` 命令且字典已存在，表中的数据将进行重组并压缩，且现有字典将被重新创建 `(RESETDICTIONARY)`\
  \ 或保持原样 `(KEEPDICTIONARY)`。\n\n因此，如果你想为已启用数据行压缩的 `EMPLOYEE` 表创建一个新的压缩字典（并压缩现有数据），可以执行如下所示的\
  \ `REORG` 命令：\n\n![Image](img/265-1.jpg)\n\n当你执行此命令时，`EMPLOYEE` 表中存储的数据将进行分析，构建压缩字典并存储在表开头，数据将被压缩并直接写入压缩字典之后的表空间。图\
  \ 3.7 阐述了应用数据行压缩前后 `EMPLOYEE` 表的显示情况。\n\n![Image](img/265-2.jpg)\n\n*图 3.7: 构建压缩字典并应用数据行压缩时表内数据的变化情况*\n\
  \n注意，数据行压缩不影响索引数据；只有存储在基表页上的数据可以被压缩。然而，由于压缩表中的记录是以压缩形式在存储和内存之间移动的（压缩字典也会移动到内存中以便进行解压缩），写入事务日志文件的压缩表记录也将是压缩状态。\n\
  \n### 存储收益的实现\n\n由于你必须使用离线重组操作来构建压缩字典并执行数据压缩，压缩数据所需的初始开销可能很大。因此，了解哪些表将从数据行压缩中获益最多，哪些表将不会，是有益的。`Inspect`\
  \ 工具可以帮助你做出判断。要调用 `Inspect` 工具，你需要执行 `INSPECT` 命令。如果你在指定 `ROWCOMPESTIMATE` 选项的情况下执行此命令，`Inspect`\
  \ 工具将检查指定表中的每一行，从发现的数据中构建压缩字典，然后使用该字典估计如果压缩表中的数据将节省多少空间。\n\n因此，如果你想估计如果名为 `EMPLOYEE`\
  \ 的表数据被压缩将节省多少存储空间，请执行 `INSPECT` 命令。\n\n```\nINSPECT TABLE EMPLOYEE ROWCOMPESTIMATE\n\
  ```\n\n然后你可以使用 `db2inspf` 命令来格式化 `INSPECT` 输出（位于 `~/sqllib/db2dump/DIAG0000/`），如下所示：\n\
  \n```\ndb2inspf -f /home/user/sqllib/db2dump/DIAG0000/inspect_output.file\n```\n\
  \n![Image](img/266-267.jpg)\n\n如果在执行 `INSPECT` 命令之前为表启用了数据压缩（例如通过将 `COMPRESS` 属性设置为\
  \ `YES)`），则构建并用于估计节省空间的压缩字典将写入表，位于现有数据的末。图 3.8 阐述了在为表启用数据行压缩的情况下，`Inspect` 工具估计空间后的表显示情况。\n\
  \n![Image](img/268.jpg)\n\n*图 3.8: Inspect 工具评估启用数据行压缩的表时表内数据的变化情况*\n\n## DB2 9.5—自动字典创建过程\n\
  \n如果你在创建表时为表启用了压缩，DB2 9.5 引入的一项名为自动字典创建（ADC）的功能将在存储了足够数据后自动构建压缩字典。ADC 触发并开始构建字典的阈值取决于表的行大小以及在表中存储的记录数量。至少，表中必须至少有\
  \ 2 MB 的数据才能构建压缩字典。\n\n## DB2 9.7—扩展压缩范围\n\n\n\n\n\n在 DB2 9.7 中，IBM 引入了一系列压缩功能，包括索引压缩、临时表压缩、内联大对象（LOB）压缩以及\
  \ XML 对象压缩。\n\n### 索引压缩\n\n许多标准行业应用程序消耗大量的存储空间来存储索引。在 DB2 9.7 中，你可以压缩索引（包括声明或创建的临时表的索引）以降低存储成本。默认情况下，压缩表启用索引压缩，而未压缩表禁用。你也可以通过\
  \ `ALTER INDEX …COMPRESS YES` 命令启用现有索引的压缩。无法压缩的索引是 MDC 块索引和 XML 路径索引。\n\n你可以使用 `ADMIN_GET_INDEX_COMPRESS_INFO`\
  \ 表函数来确定潜在的索引压缩存储节省。该命令看起来如下：\n\n![Image](img/269.jpg)\n\n若要在 `IX1_EMPLOYEE` 索引上启用压缩，请执行类似下面的\
  \ `ALTER INDEX` 命令：\n\n![Image](img/270.jpg)\n\n### LOB 和 XML 压缩\n\nLOB 和 XML 文档通常存储在与引用它们的表行不同的位置。然而，你可以选择将\
  \ LOB 或 XML 文档（大小不超过 32 KB）内联存储在基础表行中，以简化访问。内联存储的 LOB 和 XML 文档可以与其他关系数据一起进行压缩。此外，如果你使用\
  \ DB2 9.7 创建 XML 列，并为表启用数据行压缩，则表的 XML 存储对象中的 XML 数据将符合压缩条件。（在 DB2 9.7 之前创建的 XML\
  \ 列不符合压缩条件）。\n\n### 临时表和复制支持\n\n通过 DB2 存储优化功能，临时表压缩默认启用。DB2 优化器在对聚合查询或 `ORDER BY`\
  \ 子句查询实际压缩临时数据之前，会考虑存储节省情况和 SQL 语句的性能。你可以使用访问计划或 `db2pd` 命令查看优化器是否对临时表使用了压缩：\n\n\
  ![Image](img/270-271.jpg)\n\n从 DB2 9.7 开始，SQL 复制、Q 复制和事件发布支持从压缩和分区的源表复制到任何目标表。这主要通过增强日志读取接口来实现，以便读取压缩的日志记录并在将这些记录传递给源端复制捕获程序之前对其解压。\n\
  \n### DB2 10.1—自适应压缩\n\n在 DB2 10.1 中，IBM 引入了另一种名为 `adaptive compression` 的数据压缩技术。自适应行压缩基于在页级的压缩字典，并压缩页内不属于静态字典的模式。通过这种方式，自适应压缩不仅带来了显著更高的性能比，还能适应变化的数据特征。\n\
  \n表 3.6 显示了静态行压缩（也称为 `classic compression`）与自适应压缩之间的区别。\n\n| 表 3.6：静态和自适应压缩对比 |\n\
  | 静态行压缩 | 自适应压缩 |\n| :--- | :--- |\n| 这在表级创建一个全局压缩字典。 | 这在页级创建一个本地压缩字典。 |\n| 这是启用自适应压缩所需的的基础级压缩。\
  \ | 在激活自适应压缩之前，需要启用静态行压缩。 |\n| 这需要频繁对表进行 `REORG` 以消除过时的模式。 | 这在本质上是动态的，它通过在本地字典模式中使用全局字典模式，始终对经典/静态行压缩形成补充。\
  \ |\n| 压缩率在 30% 到 50% 之间。 | 压缩率在 50% 到 80% 之间。 |\n| 这需要稍多维护，例如定期进行 `REORG` 和 `RUNSTATS`。\
  \ | 不需要维护。 |\n| 可以压缩基础数据对象 `CHAR`、`VARCHAR`、`INTEGER`、`FLOAT`、内联 LOB 和内联 XML 数据。\
  \ | 可以压缩基础数据对象 `CHAR`、`VARCHAR`、`INTEGER`、`FLOAT`、内联 LOB 和内联 XML 数据。 |\n| 启用静态压缩的语法为：`CREATE\
  \ TABLE … COMPRESS YES STATIC` 或 `ALTER TABLE … COMPRESS YES STATIC` | 启用自适应压缩的语法为：`CREATE\
  \ TABLE … COMPRESS YES ADAPTIVE` 或 `ALTER TABLE … COMPRESS YES ADAPTIVE` |\n| `ADMIN_GET_TAB_COMPRESS_INFO`\
  \ 函数提供压缩估计。 | `ADMIN_GET_TAB_COMPRESS_INFO` 函数提供压缩估计。 |\n| 这是作为高级企业服务器版和高级工作组服务器版的一部分提供的附加功能。\
  \ | 这是一个附加功能，作为高级企业服务器版和高级工作组服务器版的一部分提供。 |\n| 系统目录视图语句 `SELECT SUBSTR (TABSCHEMA,\
  \ 1, 10) AS TABSCHEMA, SUBSTR (TABNAME, 1, 12) AS TABNAME, COMPRESSION, ROWCOMPMODE\
  \ FROM SYSCAT.TABLES WHERE TABNAME=‘<tabname>’` 可验证压缩模式。`ROWCOMPMODE` `S` 表示静态行压缩。\
  \ | 系统目录视图语句 `SELECT SUBSTR (TABSCHEMA, 1, 10) AS TABSCHEMA, SUBSTR (TABNAME, 1,\
  \ 12) AS TABNAME, COMPRESSION, ROWCOMPMODE FROM SYSCAT.TABLES WHERE TABNAME=‘<tabname>’`\
  \ 可验证压缩模式。`ROWCOMPMODE` `A` 表示自适应压缩。 |\n\n最后，你可以通过更新配置来压缩 DB2 10.1 中的事务归档日志文件，如下：\n\
  \n![Image](img/272.jpg)\n\n如果你没有为数据库启用归档日志或未设置配置参数 `LOGARCHETH1` 和 `LOGARCHETH2`，你将得到类似的错误：\n\
  \n![Image](img/272.jpg)\n\n## 总结\n\n本章的目的是让你熟悉\n\n* 服务器、实例和数据库之间的关系\n* 非分区数据库的创建和目录结构\n\
  * 缓冲池和表空间的设计原则\n* DB2 存储层次结构和存储组\n* 用于优化存储成本和应用程序的多温度存储功能\n* Range 分区表\n* `RCT`\n\
  * `MDC`\n* `MQT`\n* 系统周期和应用周期表的时间旅行查询功能\n* XML 数据操作和 XML 索引\n* DB2 压缩功能，如经典（静态）压缩和自适应压缩\n\
  \n完成本章后，你将具备回答认证考试中物理设计问题的知识。强烈建议完成章节末的练习题。\n\n## 练习题\n\n**问题 1**\n\n服务器上存在名为 `db2inst1`\
