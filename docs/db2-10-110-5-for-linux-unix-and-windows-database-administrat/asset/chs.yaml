  \n| ![images](img/circ.jpg) | C. | 它不能针对 MDC 表运行。 |\n\n| ![images](img/circ.jpg)\
  \ | D. | 如果必要，它会自动调用 `REORG`。 |\n\n### Question 29\n\n在 `INGEST` 命令中指定 `RESTART`\
  \ 选项的目的是什么？\n\n| ![images](img/circ.jpg) | A. | 终止命令。 |\n\n| ![images](img/circ.jpg)\
  \ | B. | 从头开始启动。 |\n\n| ![images](img/circ.jpg) | C. | 进行清理。 |\n\n| ![images](img/circ.jpg)\
  \ | D. | 在提交点重启。 |\n\n### Question 30\n\n你可以使用哪两个命令来监控 ingest 操作？\n\n| ![images](img/circ.jpg)\
  \ | A. | `LIST` |\n\n| ![images](img/circ.jpg) | B. | `SHOW` |\n\n| ![images](img/circ.jpg)\
  \ | C. | `GETSHOT` |\n\n| ![images](img/circ.jpg) | D. | `INGEST` |\n\n| ![images](img/circ.jpg)\
  \ | E. | `ALL` |\n\n## Answers\n\n### Question 1\n\n正确答案是 `D`。执行指定了 `TABLESAMPLE`\
  \ 选项的 `RUNSTATS` 命令。\n\n### Question 2\n\n正确答案是 `C`。如果你执行指定了 `ALLOW WRITE` 选项的 `IMPORT`\
  \ 命令，将在提交操作后请求表锁。\n\n### Question 3\n\n正确答案是 `B`。当你使用 `IMPORT` 实用程序的 `REPLACE` 选项时，现有数据将从目标表（该表必须已存在）中删除，然后插入新数据。\n\
  \n### Question 4\n\n正确答案是 `B`。在加载标识列数据时，使用 `LOAD` 命令修符——`IDENTITYIGNORE`、`IDENTITYMISSING`\
  \ 和 `IDENTITYOVERRIDE`。\n\n### Question 5\n\n正确答案是 `C`。`IMPORT` 命令的 `COMMITCOUNT`\
  \ 选项指定了执行提交操作之前复制到表或可更新视图的数据行（记录数）。\n\n\n\n\n正确答案是 **D.** 你可以使用 `Load` 工具，通过指定空设备（null\
  \ device）作为输入文件并使用指定的 `REPLACE` 选项调用 `LOAD` 来删除表中的所有记录，而不产生相应的日志记录（在 UNIX 上，空设备为\
  \ `/dev/null`；在 Windows 上，它为 `nul`）。因此，你可以执行以下命令来删除名为 `DEPARTMENT` 的表中的所有记录：\n\n\
  ![Image](img/711.jpg)\n\n### 问题 7\n\n正确答案是 **A.** 如果您在执行 `LOAD` 命令时使用了除指定的 `REPLACE`\
  \ 选项以外的任何选项，将无法收集统计信息。此外，必须已经存在针对 `SALES` 表的统计信息配置文件（统计信息配置文件是通过执行 `RUNSTATS` 命令创建的）；`Load`\
  \ 工具不会创建它。如果不存在配置文件，且指示 `Load` 工具收集统计信息，则会返回一个警告，提示未收集统计信息。\n\n### 问题 8\n\n正确答案是\
  \ **C.** `LOAD QUERY` 命令用于监控加载操作的进度和状态。没有 `LOAD STATUS`、`LOAD MESSAGES` 或 `LOAD\
  \ STATISTICS` 命令。\n\n### 问题 9\n\n正确答案是 **C.** 在加载操作的删除阶段，任何违反目标表上定义的主键或唯一键约束的行都将被删除并复制到异常表（如果适用），并且关于每条违规行的消息都将写入适当的消息文件中，以便您将来能够修改并手动将该行移动到目标表。由于此示例中的数据包含两条员工\
  \ ID 值为 100 的记录，且 `EMPLOYEES` 表中的 `EMPID` 列定义为主键，因此第一条记录将被加载到 `EMPLOYYEES` 表中，而第二条将移动到\
  \ `EMP_EXP` 表中。\n\n### 问题 10\n\n正确答案是 **B.** 在处理大量数据时，`Load` 工具明显比 `Import` 工具快得多，因为\
  \ `Load` 工具直接将格式化页面写入数据库的存储容器中。此外，当您使用 `Load` 工具时，仅执行极量的日志记录——单行事务不会记录在数据库的事务日志文件中。\n\
  \n`Load` 工具不支持 WSWS 格式的文件，加载处理期间不会触发触发器，且在处理期间仅进行唯一性检查。您必须在加载操作完成后，使用 `SET INTEGRITY`\
  \ SQL 语句执行所有其他约束检查（检查约束、引用完整性约束等）。\n\n### 问题 11\n\n正确答案是 **C.** `db2move` 工具查询指定数据库的系统目录表，并编译出找到的所有用户表列表。然后，它将数据库中每个表的内容和表结构导出到单独的\
  \ PC/IXF 格式文件中。生成的这些文件可以导入或加载到相同系统上的另一个 DB2 数据库，或者可以将它们传输到另一个工作站，并导入或加载到那里的 DB2\
  \ 数据库。因此，您可以使用 `db2move` 将整个数据库从一个位置复制到另一个位置。\n\n`db2move` 工具的一个局限性是，您只能用它复制表和索引对象。如果要复制的数据库包含其他对象（如别名、视图、触发器、用户定义类型\
  \ UDT、用户函数 UDF 等），如果您希望拥有源数据库的相同副本，则也必须在目标数据库中复制这些对象。这就是 `db2look` 工具大显用场的地方。调用\
  \ `db2look` 时，它可以对现有数据库进行反向工程，并生成一组 DDL SQL 语句，然后您可以使用这些语句重新创建在分析数据库中找到的所有数据对象。`db2look`\
  \ 工具还可以收集源系统的环境注册表设置、配置参数设置和统计（`RUNSTATS`）信息，这些信息可用于在目标系统上复制这些设置。\n\n在这种场景下，您只想复制数据的一部分，并希望在目标数据库中更新统计信息。因此，您不能使用\
  \ `dbmove`，而必须使用 `db2look` 执行。\n\n### 问题 12\n\n正确答案是 **A.** `db2batch` 工具是一个简单的基准工具，它可以从文件或标准输入读取\
  \ SQL 语句和表达式；动态准备、描述并执行它们；并返回包括其他内容在内的结果。可以使用 `dbmove` 将表复制到另一个数据库，使用 `REORG` 整理数据，并使用\
  \ `REBIND` 更新包信息。\n\n### 问题 13\n\n正确答案是 **D.** 由于在准备动态 SQL 语句时，DB2 优化器会生成执行计划，因此使用动态\
  \ SQL 的应用程序可以立即利用新的统计信息获得性能改进。遗憾的是，静态 SQL 并非如此。这是因为 DB2 优化器仅在包含这些语句的包绑定到数据库时才会为静态\
  \ SQL 生成执行计划。因此，为了利用 `RUNSTATS` 工具产生的新统计信息，必须将这些包重新绑定到数据库。在应用程序源代码未更改的情况下，重新绑定现有包的最简单方法是执行\
  \ `REBIND` 命令。\n\n### 问题 14\n\n正确答案是 **B.** 在发生以下任何情况后，应运行 `RUNSTATS` 工具：\n\n- 对特定表执行了大量的插入、更新或删除操作。\n\
  - 执行了导入操作。\n- 执行了加载操作。\n- 为表添加了一个或多个列。\n- 创建了新索引。\n- 表或索引进行了整理。\n\n在运行 `REORGCHK`\
  \ 工具之前运行 `RUNSTATS` 工具也是一个很好的做法。如果由于碎片和统计信息过期导致查询缓慢，`REORGCHK` 可能报告不需要进行表或索引整理。通过仔细评估\
  \ `REORGCHK` 工具的输出，您可能会发现一个或多个表或索引需要整理。如果是这样，可以使用 DB2 的 `REORG` 工具整理表，然后是索引。整理数据后，应重新收集统计信息，并重新绑定所有相关的包（使用\
  \ `REBIND` 工具），以便 DB2 优化器能够使用新收集的统计信息生成新的数据访问计划。\n\n### 问题 15\n\n正确答案是 **C.** Design\
  \ Advisor 是一个特殊的工具，它可以识别可能有助于提高查询性能的索引、MQT 和 MDC。您通过执行 `db2advis` 命令来调用 Design Advisor；`db2advis`\
  \ 命令的 `-g` 选项指定分析构成工作负载的 SQL 语句从动态 SQL 快照中检索它们。\n\n`-k` 选项指定压缩工作负载的程度。（压缩允许建议器减少执行的复杂性，同时获得与考虑完整工作负载时获得相似的结果。）`-qp`\
  \ 选项指示工作负载来自 DB2 Query Patroller，`-h` 选项显示帮助信息。\n\n### 问题 16\n\n\n\n\n\n正确答案是 **B**\
  \ 和 **E**。设计顾问（Design Advisor）根据当前的数据库统计信息、DB2 优化器、快照监控信息和/或你提供的特定查询或一组 SQL 语句（称为工作负载），推荐一个或多个改进查询或负载性能的索引。如果需要，可以将推荐的索引/MQT/MDC、为它们生成的统计信息以及创建它们所需的\
  \ DDL 语句写入用户创建的表 `ADVISE_INDEX` 中。\n\n如果在指定 `–p` 选项的情况下执行 `db2advis` 命令，则运行设计顾问期间生成的计划将保存在\
  \ `ADVISE_WORKLOAD` 表中，而使用最终建议的工作负载查询计划将写入解释表（Explain tables）。然而，设计顾问的输入并非来自解释表。\n\
  \n### 第 17 \n\n正确答案是 **A**。全局临时表不能与 `LOAD`、`IMPORT` 或 `INGEST` 命令一起使用。表 6.12 列出了所有支持的表类型。\n\
  \n![Image](img/714.jpg)\n\n### 第 18 \n\n正确答案是 **C**。Ingest 实用是一个高速、客户端、高度可配置、多线程的\
  \ DB2 工具，它通过类似 SQL 的命令从文件和管道将数据流到 DB2 目标表。由于 Ingest 工具可以在移动大量实时数据而不锁定目标表，因此你不需要在数据实时性和可用性之间进行选择。`LOAD\
  \ WITH NO ACCESS` 不允许用户在完成之前访问表，而 SQL 和 Q 复制可以在源和目标系统之间复制一个或多个表以捕获数据更改；但是，这些工具并非旨在一次性移动大量数据，因为它们在内部会顺序调用\
  \ `INSERT`/`UPDATE`/`DELETE`/`MER`。`IMPORT WITH COMMITCOUNT AUTOMATIC` 尽管此选项允许其他用户访问目标表，但由于顺序的多个\
  \ `INSERT` 线程，处理数据加载需要很长时间。\n\n### 第 19 \n\n正确答案是 **A**。`FLUSH PACKAGE CACHE` 语句会使包缓存中所有的缓存动态\
  \ SQL 语句失效。这种失效会导致任何匹配已失效缓存动态 SQL 语句的下一个 SQL 请求都进行重新编译，而不是从包缓存中重用。\n\n### 第 20 \n\
  \n正确答案是 **D**。当你在 `LOAD` 命令中指定 `NONRECOVERABLE` 选项时，`EMPLOYEE` 表上的所有事务将被标记为不可恢复，且无法通过随后的向前滚（roll-forward）操作恢复数据。如果尝试执行向前滚操作，实用程序将跳过该事务并将加载数据的表标记为无效。在向前滚操作后，此类表只能被删除并重建。\n\
  \n当使用 `NONRECOVERABLE` 加载数据时，表空间不会处于备份等待（Backup Pending）状态。然而，当在不使用 `NONRECOVERABLE`\
  \ 或 `COPY YES` 选项的情况下加载时，表空间将处于备份等待状态。可以使用 `COPY YES` 选项创建表的副本。\n\n### 第 21 \n\n\
  正确答案是 **B**。你可以通过使用 `INDEXSAMPLE` 选项对数据进行采样，仅为特定索引收集统计信息。更新前没有扫描所有索引。\n\n### 第 22\
  \ \n\n正确答案是 **A**。你可以使用 `db2advis -d -i -t` 生成针对索引、MQT 和 MDC 的建议。\n\n### 第 23 \n\
  \n正确答案是 **D**。为了尽量减少 `RUNSTATS` 在页级或行级对性能的影响，请遵循以下指南：\n\n- 使用 `COLUMNS` 限制收集统计信息的列。\n\
  - 使用 `DISTRIBUTION` 限制收集分布统计信息的列。\n- 使用 `TABLESAMPLE` 限制处理的页数。\n\n### 第 24 \n\n\
  正确答案是 **A**。在这种情况下，任何违反为 `EMPLOYEE` 表定义的约束的记录都将加载到 `EXP_EMPLOYEE` 表中，而不是 `EMPLOYEE`\
  \ 表中。异常表的列数、列数据类型和列空值属性应与要加载的目标表相同。此外，你可能希望向异常表添加可选的 `timestamp`（用于记录从目标表删除的时间戳）和\
  \ `CLOB (32 KB)`（用于记录加载错误消息）列。由于管理器不会自动创建异常表。由于此加载没有使用 `COPY YES` 或 `NONRECOVERABLE`，如果启用了归档日志，表空间将处于备份等待状态。\n\
  \n### 第 25 \n\n正确答案是 **C**。你可以使用此 `db2look` 命令来模拟系统之间的统计信息：\n\n![Image](img/717-1.jpg)\n\
  \n### 第 26 \n\n正确答案是 **C**。你可以使用 `SYSPROC.ADMIN_MOVE_TABLE()` 过程在线移动表，如此示例所示：\n\n\
  ![Image](img/717-2.jpg)\n\n\n\n\n\n* 修改数据库名称\n* 更改数据库路径\n* 将数据库与另一个实例关联\n* 在 DPF\
  \ 环境中更改每个节点的数据库名称\n* 更改新的日志目录\n* 更改容器路径\n* 更改存储路径\n* 更改 failarchpath\n* 更改 logarchmenth1\
  \ 和 logarchmenth2\n* 更改 mirrorlogpath 和溢出日志路径\n\n`SYSPROC.ADMIN_MOVE_TABLE_UTIL()`\
  \ 过程通过修改在线移动表属性来辅助 `ADMIN_MOVE_TABLE()` 过程；然而，它不能独立作用于某个表。\n\n### 问题 27\n\n正确答案是\
  \ **C.** 当你调用 `ADMIN_MOVE_TABLE()` 过程时，会在指定的表空间中创建待移动表的影子副本（你也可以预先手动创建目标表）。该过程还会创建一个临时表和一组触发器，用于捕获在移动操作期间源表上进行的任何数据更改。然后，使用\
  \ `INSERT FROM CURSOR` 或 `LOAD FROM CURSOR` 将数据从源表复制到目标表。数据复制完成后，临时表中捕获的更改将会在目标表上重放，以使其保持最新。在此阶段，源表会被短暂离线状态以便进行重命名。默认情况下，源表会被删除；但可以使用\
  \ `KEEP` 选项将其保留并重命名。\n\n### 问题 28\n\n正确答案是 **B.** 如果你运行带有 `UPDATE STATISTICS` 子句的\
  \ `REORGCHK`，DB2 将内部调用 `RUNSTATS` 来执行统计信息的更新。它甚至可以在系统目录表和 MDC 上运行。然而，`REORGCHK`\
  \ 无法自动调用 `REORG`。\n\n### 问题 29\n\n正确答案是 **D.** `INGEST` 命令只有在到达源文件或管道末尾时才被认为完成。在任何其他情况下，Ingest\
  \ 工具都认为命令执行未完全完成，这些情况包括：\n\n* 工具由于 I/O 错误无法读取输入文件。\n* 关键的 DB2 系统错误指示作业未按预期运行。\n\
  * `INGEST` 命令被杀掉或异常终止。\n\n如果 `INGEST` 命令失败，你可以通过重新发布带有 `RESTART CONTINUE` 子句的命令来重启它。Ingest\
  \ 工具将从上一次提交点开始操作。\n\n### 问题 30\n\n正确答案是 **B** 和 **D**。Ingest 工具有两个简单的命令来监控进度：\n\n\
  * `INGEST LIST`\n* `INGEST GET STATS FOR <id>`\n\n这些命令必须在运行 Ingest 工具的同一台机器上运行。`LIST\
  \ UTILITIES` 或 `SNAPSHOTS` 无法捕捉 `INGEST` 命令的进度。\n\n# 第 7 章：高可用\n\n本章将向你介绍 DB2 提供的备份和恢复工具，并向你展示如何定期备份数据库，以及在数据库损坏或损坏时如何恢复。它还将向你介绍\
  \ DB2 的高级功能，例如带有备用机读取 (ROS) 和多个备用数据库的高可用性和灾难容备 (HADR)。\n\n## 考试目标\n\n* 展示理解各种事务日志功能的能力\n\
  * 展示配置数据库日志镜像的能力\n* 展示理解各种类型的数据库恢复功能，以及在何何时、如何使用它们的能力\n* 展示创建和使用数据库级和表空间级备份映像的能力\n\
  * 展示将受损或损坏的数据库恢复到任何给定时间点状态的能力\n* 展示理解无效索引何时以及如何重新创建的能力\n* 展示理解并实现 HADR 功能的能力\n*\
  \ 展示配置带有 ROS 的 HADR 的能力\n* 展示理解并实现带有多个备用数据库的 HADR 的能力\n* 展示暂停和恢复数据库 I/O 以及初始化数据库拆分镜像的能力\n\
  * 展示理解 pureScale 架构和基本操作的能力\n\n## 事务\n\n事务（也称为工作单元）是一个或多个 SQL 操作的序列，它们被分组为一个单元，通常位于应用程序进程内部。给定的事务可以执行任意数量的\
  \ SQL 操作——从一个操作到数百个甚至数千个，取决于你的业务逻辑中什么被视为“单个步骤”。\n\n单个事务的启动和终止定义了数据库内部的数据一致性点：要么事务内执行的所有操作的结果都应用到数据库并使其持久化（提交），要么事务内执行的所有操作的结果都被撤销（回滚），并将数据库恢复到事务启动之前的状态。\n\
  \n通常情况下，事务在建立数据库连接后首次执行可执行的 SQL 语句时启动，或者在预存事务终止后立即启动。一旦启动，事务可以使用名为*自动提交*（automatic\
  \ commit）的功能隐式终止（在这种情况下，每个可执行的 SQL 语句被视为一个事务，如果语句执行成功，则该语句所做的任何更改将应用于数据库；如果语句失败，则这些更改将被丢弃），也可以通过执行\
  \ `COMMIT` 或 `ROLLBACK` SQL 语句显式终止事务。这两个语句的基本语法为：\n\n![Image](img/720-1.jpg)\n\n\
  和\n\n![Image](img/720-2.jpg)\n\n当你使用 `COMMIT` 语句终止事务时，自事务开始以来对数据库进行的所有更改都将变为永久。然而，当你使用\
  \ `ROLLBACK` 语句时，所有更改都将被撤销，数据库将恢复到事务开始之前的先前的状态。图 7.1 显示了使用 `COMMIT` 语句终止事务的影响。\n\
  \n![Image](img/721.jpg)\n\n*图 7.1：使用 COMMIT 语句终止事务*\n\n图 7.2 显示了使用 `ROLLBACK` 语句终止事务的影响。\n\
  \n![Image](img/722.jpg)\n\n*图 7.2：使用 ROLLBACK 语句终止事务*\n\n记住，提交和回滚操作仅对它们所终止的事务内进行的更改产生影响。因此，为了评估一系列事务的影响，你必须能够识别每个事务何时开始以及每个事务何时如何终止。图\
  \ 7.3 评估了系列事务的影响。\n\n事务未提交前做的更改通常对其他用户和应用程序是不可见的（除非使用未提交读取隔离级别），并且可以通过回滚操作撤销。然而，一旦事务的更改已提交，它们将对所有其他用户和应用程序可见，并且只能通过执行新的\
  \ SQL 语句（在新事务内）来删除。那么，如果在事务更改提交之前发生了系统故障或应用程序异常结束，会发生什么？为了回答这个问题，我们必须首先检查数据更改是如何产生的以及事务是如何记录的。\n\
  \n## 事务日志\n\n\n\n\n\n到底什么是事务日志，它是如何工作的呢？事务日志简单来说是一个用于在更改发生时跟踪数据库更改（由事务引起）的过程。每当你执行更新或删除操作时，包含要更新或删除的记录的页面将从存储器中检索并复制到相应的缓冲区池（buffer\
  \ pool）中，然后在那里更新/删除操作对其进行修改。（如果插入操作创建了新记录，它将直接在相应的缓冲区池中创建该记录。）一旦记录被修改（或插入），反映该修改/插入操作的记录就会被写入日志缓冲区（log\
  \ buffer），日志缓冲区仅仅是内存中的另一个指定存储区域。（为日志缓冲区预留的实际内存量由数据库配置参数 `logbufsz` 控制。）如果你执行插入操作，一个包含新行的记录将被写入日志缓冲区；如果你执行删除操作，一个包含该行原始值的记录将被写入日志缓冲区；如果你执行更新操作，一个包含该行原始值并结合该行新值的记录将被写入日志缓冲区。\n\
  \n每当缓冲区池 I/O 页面清理程序被激活、日志缓冲区变满，或者一个事务终止（通过提交或回滚）时，驻留在日志缓冲区中的所有记录都会立即写入存储在磁盘上的一个或多个日志文件。这样做是为了最大限度地减少系统故障时可能丢失的日志记录数量。一旦与特定事务相关的所有日志记录都外部化到一个或多个日志文件中，事务本身的影响就会记录在数据库中（即在相应的表空间容器上执行以进行持久化存储）。修改后的数据页保留在内存中，如有必要，可以快速访问——最终，随着从存储器中检索出更新的页面，它们将被覆盖。你可以在图\
  \ 7.4 中看到事务日志过程。\n\n![Image](img/724.jpg)\n\n图 7.4：事务日志过程*\n\n由于在任何给定时刻都可能有多个事务正在操作数据库，因此单个日志文件可能包含属于几个不同事务的日志记录。因此，为了跟踪哪些日志记录属于哪些事务，每条日志记录都被分配了一个特殊的“事务标识符”，将其与创建它的事务关联起来。事务\
  \ ID 的使用允许与特定事务相关的日志记录在任何时间写入一个或多个日志文件，而不会影响数据一致性——最终，甚至终止事务的 `COMMIT` 或 `ROLLBACK`\
  \ 语句的执行也会被记录。\n\n由于日志记录频繁地外部化，并且特定事务所做的更改只有在事务本身成功终止时才会外部化到数据库，因此可以保证发生故障后将数据库恢复到一致状态的能力。当你重新启动数据库时，会对日志记录进行分析，每个具有对应\
  \ `COMMIT` 记录的记录都会重新应用到数据库；每个缺少对应 `COMMIT` 记录的记录要么被忽略要么回滚（这就是为什么对所有更新操作都记录了“之前”和“之后”信息）。\n\
  \n## 事务日志策略\n\n当你首次创建数据库时，作为创建过程的一部分，会分配 13 个主日志文件（在不经过配置顾问干预的情况下；然而，如果你在创建数据库时调用了配置顾问，则配置顾问将决定要创建的主日志数量）。在\
  \ Linux、UNIX 和 Windows 平台上，这些日志文件的大小为 1,024 个 4-KB 页面。然而，使用的主日志文件数量以及每个文件能够容纳的数据量，由数据库配置文件中的\
  \ `logprimary` 和 `logfilsiz` 参数控制。所有日志文件的使用方式取决于为数据库选择的日志策略。DB2 提供了两种非常不同的策略，称为*循环日志*（circular\
  \ logging）和*归档日志*（archival logging）。\n\n## 循环日志\n\n当你使用循环日志时，存储在日志缓冲区中的记录按顺序写入事务日志文件。日志记录写入当前的“活动”日志文件，当该日志文件变满时，它被标记为“不可用”。然后，DB2\
  \ 将序列中的下一个日志文件作为活动日志文件并开始对其写入日志记录。与此同时，随着事务终止及其影响外部化到数据库，相应的日志记录会被释放。当单个日志文件中存储的所有记录都被释放时，该文件被标记为“可重用”，当它再次成为活动日志文件时，其内容将被新的记录覆盖。\n\
  \n虽然主日志文件并非按特定顺序标记为可重用（它们在不再需要时被标记），但必须按顺序写入。那么，当日志过程返回到一个标记为不可用的主日志文件时会发生什么？\n\n\
  这种情况发生时，DB2 数据库管理器将分配所谓的*辅助日志文件*并向其写入日志记录。一旦辅助日志文件变满，DB2 数据库管理器将再次轮询主日志文件，如果状态仍为不可用，则会分配并填充另一个辅助日志文件。此过程将持续，直到所需的主日志文件变为可重用，或者创建的辅助日志文件数量达到允许的数量（由配置参数\
  \ `logsecond` 决定）。如果是前者，DB2 数据库管理器将向相应的主日志文件写入日志记录，日志将从中断处继续。与此同时，辅助日志文件中的日志记录最终会被释放，当所有数据库连接都终止时，任何创建的辅助日志文件将被销毁。然而，如果允许的最大辅助日志文件数量已分配，且所需的主日志文件仍然不可用，则所有数据库活动将停止，并生成以下消息：\n\
  \n![Image](img/726.jpg)\n\n默认情况下，将创建最多 12 个辅助日志文件（在不经过配置顾问干预的情况下；然而，如果你在创建数据库时调用了配置顾问，则配置顾问将决定要创建的辅助日志数量），它们的大小与使用的每个主日志文件相同。图\
  \ 7.5 插图了循环日志。默认，当你创建一个新数据库时，使用的日志策略是循环日志。\n\n## 归档日志\n\n\n\n\n\n与循环日志类似，当使用归档日志（也称为\
  \ `log retention logging` 或 `LOGRETAIN mode` 日志模式）时，存储在日志缓冲区中的日志记录将被写入预先分配的主日志文件中。然而，与循环日志不同，这些日志文件永远不会被重用。相反，当单个日志文件中存储的所有记录都已释放时，该文件会被标记为“已归档”而非“可重用”，它再次使用的唯一时间是在需要进行前滚恢复（roll-forward\
  \ recovery）操作时。当所有主日志文件都满时，DB2 数据库管理器将分配一组新的主日志文件。只要有足够的磁盘空间、服务器上的事务日志数量达到 256（`logprimary`\
  \ + `logsecond`），并且根据其当前状态和存储位置进行分类，这一过程就会持续进行。\n\n![Image](img/727.jpg)\n\n*图 7.5:\
  \ 循环日志*\n\n包含尚未提交或回滚的事务相关记录的日志文件称为 `active log files`（活动日志文件），它们存在于活动日志目录（或设备）中；包含已完成事务（即已外部化到数据库的事务）记录且位于活动日志目录中的日志文件称为\
  \ `online archive log files`（在线归档日志文件）；而包含已移动到活动日志目录其他存储位置的完成事务记录的日志文件被称为 `offline\
  \ archive log files`（离线归档日志文件）。通过为 `logarchmeth1` 或 `logarchmeth2` 数据库配置参数分配适当的值（`USEREXIT`、`DISK`、`TSM`\
  \ 或 `VENDOR`），可以将离线归档文件自动复制到其存储位置。图 7.6 展示了归档日志。\n\n![Image](img/728.jpg)\n\n*图\
  \ 7.6: 归档日志*\n\n## 其他日志注意事项\n\n除了指定的日志策略外，还可以可以使用数据库配置参数来控制数据库的日志行为。在配置数据库进行事务日志管理时，请务必考虑以下项目。\n\
  \n## 无限日志\n\n你可能认为，只需通过配置数据库在需要时使用大量的次日志文件，就可以避免日志空间耗尽。然而，允许的主、次日志文件最大数量（`logprimary\
  \ + logsecond`）为 256，如果你的日志文件尺寸较小，当事务负载变重时，你仍然很快耗尽日志空间。此外，你希望尽可能避免分配大量的次日志文件，因为每次分配日志文件时性能都会受到影响。理想情况下，你希望分配足够的主日志文件来处理大多数情况，并使用恰好的次日志文件来处理事务负载的峰值。\n\
  \n如果你担心日志空间耗尽，并希望避免分配大量的次日志文件，可以配置数据库使用所谓的 `infinite logging`（无限日志）。要启用无限日志，你只需将\
  \ `logsecond` 数据库配置参数设置为 -1。在无限日志模式下，每当 DB2 用完 `logprimary` 日志时，它不会因“活动日志空间已满”而失败，而是归档仍然处于活动状态的日志并继续分配（重命名）新日志。这样，活动日志路径中的日志数量就能得到满足。\n\
  \n要使用无限日志，数据库必须配置使用归档日志；如果一个或多个运行时间较长的事务必须回滚，且所需的日志文件已经归档，无限日志会对性能产生巨大影响。\n\n##\
  \ 双重日志\n\n在 DB2 中，你有能力配置数据库，使数据库管理器同时在两个不同的位置创建并更新活动日志文件。如果你将活动日志文件存储在一个位置，并在另一个独立位置对其进行镜像，那么当发生磁盘故障或人为错误导致一个位置的日志文件不可用时，数据库活动可以继续。（镜像日志文件可能也有助于数据库恢复。）要启用日志文件镜像，你只需将镜像日志位置（路径）的全限定名称分配给\
  \ `mirrorlogpath` 数据库配置参数。理想情况下，镜像日志路径应指向一个物理位置（磁盘），该位置不会产生大量的磁盘 I/O，且与存储主日志文件的物理位置分开。\n\
  \n如果在尝试向活动日志路径或镜像日志路径写入时遇到错误，DB2 数据库管理器会将失败的路径标记为“坏（bad）”，向管理通知日志写入消息，并仅将后续日志记录写入剩余的“良好（good）”日志路径。当\
  \ DB2 为下一个主日志文件分配存储空间时，DB2 数据库管理器将再次尝试向两个日志路径写入。如果成功，双重日志将继续。如果没有成功，DB2 在下一次访问日志文件之前将不会再次尝试使用该坏路径。DB2\
  \ 不尝试同步日志路径，但它会跟踪发生的每次访问错误，以便在归档日志文件时使用正确的路径。如果在写入剩余的良好路径时发生故障，数据库将关闭。\n\n如果你将 `newlogpath`\
  \ 数据库配置参数值设置为原始设备作为活动日志文件存储位置，则将不允许双重日志。当你同时设置了 `mirrorlogpath` 和 `logarchmeth2`\
  \ 数据库配置参数值时，`logarchmeth2` 将归档来自 `mirrorlogpath` 的日志文件，而不是归档来自活动日志路径 `newlogpath`\
  \ 位置的日志。\n\n## 控制处理“磁盘满”错误\n\n当使用归档日志且归档日志文件没有从活动日志目录复制（并重命名）到另一个位置时，活动日志目录所在的磁盘可能会很快变满。因此，默认情况下，事务将接收到磁盘满错误并回滚。但是，如果不是终止当前事务，而是让你有机会手动移动或删除文件以腾出空间呢？这就是\
  \ `blk_log_dsk_ful` 数据库配置参数的用途。\n\n如果你将此参数设置为 `YES`，当 DB2 数据库管理器尝试在活动日志目录创建新日志文件时收到磁盘满错误，应用程序将挂起。DB2\
  \ 数据库管理器随后每隔五分钟尝试创建一次日志文件，直到成功——每次尝试后都会向管理通知日志写入一条消息。（你确认应用程序因磁盘满条件而挂起的唯一方法是监控此日志。）在日志文件成功创建之前，尝试插入或更新数据的应用程序将不允许提交它们的事务。只读查询可能不受直接影响；但如果查询需要访问被更新请求锁定的数据或被更新应用程序固定在缓冲区池中的数据页，只读查询也将挂起。\n\
  \n## 数据库恢复概念\n\n随着时间的推移，数据库可能会遇到任何问题，包括电源中断、存储介质故障、应用程序异常终止或站点灾难。所有这些问题都可能导致数据库失败，且每种失败场景都需要不同的恢复操作。\n\
  \n\n\n\n\n数据库备份的理念与备份任何其他数据文件相同：你创建数据的副本并将其存储在不同的介质上，这样当原始数据损坏或销毁时，可以对其进行访问。备份数据库简单的方法是关闭它以确保不再处理任何事务，然后使用\
  \ `DB2` 提供的备份实用程序进行备份。一旦创建了备份镜像，如果由于某些原因数据库发生损坏或损坏，你可以使用它来重建数据库。\n\n重建数据库的过程被称为\
  \ `recovery`（恢复），`DB2` 四种恢复类型：\n\n*   崩溃恢复（Crash recovery）\n*   版本恢复（Version recovery）\n\
  *   向前滚恢复（Roll-forward recovery）\n*   灾难恢复（Disaster recovery）\n\n## 崩溃恢复\n\n当事件或条件导致数据库或\
  \ `DB2` 数据库管理器异常终止时，可能会导致一个或多个事务失败。可能导致事务失败的情况包括：\n\n*   运行 `DB2` 数据库管理器的工作站发生断电\n\
  *   严重的操作系统错误\n*   硬件故障，如内存损坏、磁盘故障、CPU 故障或网络故障\n\n当发生事务失败时，所有部分完成且尚未外部化到数据库的事务工作都会丢失。结果是数据库可能处于不一致状态（因此将无法使用）。崩溃恢复是将此类数据库恢复到一致且可用状态的过程。你通过使用存储在事务日志文件中的信息执行崩溃恢复，以完成事务失败发生时内存中（但尚未外部化到存储）的任何已提交事务，回滚发现的所有未完成事务，并从内存中清除任何未提交事务。一旦数据库恢复到一致且可用的状态，它就达到了所谓的\
  \ `point of consistency`（一致性点）。图 7.7 说明了崩溃恢复。\n\n![Image](img/731.jpg)\n\n*图 7.7：崩溃恢复过程*\n\
  \n## 版本恢复\n\n版本恢复是将数据库恢复到创建特定备份镜像时所在状态的过程。你通过使用备份操作创建的副本将数据库的当前版本替换为之前的版本来执行版本恢复——你使用较早时候创建的备份镜像重建整个数据库。遗憾的是，执行版本恢复将丢失自使用的备份镜像创建以来对数据库进行的所有更改。图\
  \ 7.8 说明了版本恢复。\n\n# 向前滚恢复\n\n向前滚恢复在版本恢复的基础上更进一步，通过使用备份镜像并重放存储在事务日志文件中的信息来重建数据库或一个或多个表空间，将数据库/表空间恢复到它们在某一精确时刻的状态。要执行向前滚恢复操作，必须启用归档日志（archival\
  \ logging），拥有数据库的全备份镜像或全套表空间备份镜像，并且能够访问自备份镜像创建以来的所有归档日志文件。图 7.9 说明了向前滚恢复过程。\n\n\
  ![Image](img/732-1.jpg)\n\n*图 7.8：版本恢复过程*\n\n![Image](img/732-2.jpg)\n\n*图 7.9：向前滚恢复过程*\n\
  \n## 灾难恢复\n\n灾难恢复 (DR) 由一组相关的过程、策略和程序组成，用于在发生自然灾害或人为灾难时将数据库恢复到不同的站点。\n\n`DB2` 为你提供了许多强大的功能，以实现站点或计算机之间顺畅的\
  \ DR 过程。其中两个功能是：\n\n*   `HADR` 数据复制\n*   针对特定架构或表集的 `SQL` 或 `Q Replication`\n\n\
  `DB2` 还支持存储级镜像，例如 `Peer-to-Peer Remote Copy (PPRC)`，在灾难时提供数据恢复能力。我们将在“高可用性和灾难恢复”部分详细讨论\
  \ `HADR`。\n\n![Image](img/note.jpg)\n\n**提示：** 在断电的情况下，你可以使用崩溃恢复将数据库恢复到一致状态。当发生磁盘故障或数据库损坏时，通常需要版本恢复和向前滚恢复。在磁盘故障或数据库损坏的情况下，也可以使用灾难恢复（带有\
  \ `HADR` 延迟复制功能）来避免应用程序中断。\n\n# 可恢复与不可恢复的数据库\n\n尽管任何 `DB2` 数据库都可以从备份镜像恢复，但数据库是否被视为可恢复取决于数据库配置参数\
  \ `logarchmeth1` 和 `logarchmeth2` 的值。当你将这两个配置参数都设置为 `OFF`（这是默认值）时，将使用循环日志，数据库被视为不可恢复。当崩溃恢复、版本恢复和向前滚恢复可行时，数据库被认为是可恢复的。表\
  \ 7.1 显示了可恢复与不可恢复数据库之间的其他差异。\n\n| 表 7.1：可恢复与不可恢复数据库的差异 |\n\n| 可恢复数据库 | 不可恢复数据库 |\n\
  | :--- | :--- |\n| 使用归档日志。 | 使用循环日志。 |\n| 无论应用程序是否连接到数据库以及事务正在进行，都可以对数据库进行备份。 |\
  \ 只有在所有连接都已终止时才能对数据库进行备份。 |\n| 可以备份整个数据库，也可以备份单个表空间。表空间也可以独立恢复。 | 必须备份整个数据库；不支持表空间级别的备份。\
  \ |\n| 损坏的数据库可以恢复到以前任何时刻的状态；支持崩溃恢复、版本恢复和向前滚恢复。 | 损坏的数据库只能恢复到上一次备份时的状态；仅支持崩溃恢复和版本恢复。\
  \ |\n\n决定数据库应该是可恢复的还是不可恢复的取决于几个因素：\n\n*   如果数据库支持只读操作，它可以是不可恢复的；因为不会记录任何事务，因此不需要向前滚恢复。\n\
  *   如果对数据库的更改较少，并且所有已做的更改都可以轻松创建，那么让数据库保持不可恢复可能是理想的。\n*   如果对数据库将进行大量更改，或者重新创建所有更改将困难且耗费时间，则数据库应该是可恢复的。\n\
  \n# 在线与离线备份及恢复\n\n从备份和恢复的角度来看，数据库被视为在线或离线。当数据库离线时，其他应用程序和用户无法访问它；当数据库在线时，情况恰恰相反。你只有在数据库离线时才能对不可恢复数据库执行备份和恢复操作。然而，可恢复数据库无论离线还是在线，都可以随时备份。但是，在你恢复任何数据库（可恢复的或不可恢复的）之前，你必须先将其离线。\n\
  \n\n\n\n当您执行联机备份操作时，归档日志确保在创建备份镜像期间发生的所有更改都被捕获，并可以通过前滚恢复（roll-forward recovery）操作进行重建。此外，您还可以针对单个表空间以及整个数据库执行联机备份操作。而且，与全数据库版本恢复操作不同，您可以在数据库保持在线的同时执行表空间版本恢复操作和表空间前滚恢复操作——前提是包含系统目录的表空间不是正在恢复的那个表空间。在联机表空间备份操作期间，被备份的表空间仍然可用，且对存储在该表空间中的数据的所有修改都将记录在事务日志文件中。然而，当您对某个表空间执行联机恢复或联机前滚恢复操作时，该表空间本身会被离线状态，在恢复/前滚恢复操作完成之前将不可用。\n\
  \n# 增量备份、差异备份与恢复\n\n随着数据库越越规模的增长，备份和恢复数据库所需的时间和硬件资源也会大幅增加。因此，在处理大型数据库时，创建全数据库和表空间备份镜像并不总是最佳方法，因为多个此类备份镜像的存储需求可能是巨大的。更好的替代方案是定期创建一个全备份镜像，并更频繁地创建一个或多个增量备份镜像。增量备份是指包含自上次备份镜像创建以来更新过的面的备份镜像。除了更新的数据和索引页，每个增量备份镜像还包含了全数据库备份镜像中通常所有的初始数据库元数据（如数据库配置、表空间定义、恢复历史文件）。\n\
  \n可以产生两种类型的增量备份镜像：增量和差异。增量备份镜像是自最近一次成功的全备份镜像创建以来发生更改的所有数据库数据的副本。增量备份镜像也被称为 `cumulative`（累积的）镜像，因为在一段时间内创建的一系列增量备份镜像中，最后一个增量备份镜像将包含之前所有增量备份镜像的内容。一个增量备份镜像的前驱始终是相同对象的最近一次成功全备份镜像。\n\
  \n然而，差异备份镜像是自该数据库或表空间上一次成功备份（全备、增量或差异）以来发生更改的所有数据库数据的副本。由于由于原因，差异备份镜像也被称为 `differential`（差异的）或\
  \ `noncumulative`（非累积的）备份镜像。差异备份镜像的前驱是包含差异备份镜像中每个对象副本的最近一次成功备份镜像。\n\n增量和差异备份镜像的共同点是，在创建任何类型的备份镜像之前，必须已经存在一个全备份镜像。它们的不同之处在于创建方式（通常差异备份镜像比增量备份镜像小，创建速度更快）以及它们用于恢复的方式。当您获取增量备份镜像时，数据库恢复涉及使用最新的全备份镜像并应用最新生成的增量备份镜像来恢复数据库。然而，当您获取差异备份镜像时，数据库恢复涉及使用最新的全备份镜像，并按照创建顺序应用自所使用的全备份镜像创建以来生成的每个差异备份镜像来恢复数据库。\n\
  \n让我们来看一个例子来理解增量备份和差异备份。假设一个组织的数据库备份策略是：周日执行全联机备份，周三执行增量备份，其余时间执行差异备份（如下），以有效利用备份设备上的存储空间。\n\
  \n| 备份名称 | 备份描述 | 日期 |\n| :--- | :--- | :--- |\n| BKUP1 | 全联机备份 | 周日 |\n| BKUP2\
  \ | 差异备份 | 周一 |\n| BKUP3 | 差异备份 | 周二 |\n| BKUP4 | 增量备份 | 周三 |\n| BKUP5 | 差异备份 |\
  \ 周四 |\n| BKUP6 | 差异备份 | 周五 |\n| BKUP7 | 差异备份 | 周六 |\n\n全联机备份包含一个全数据库镜像，周一的差异备份镜像构成了周日到周一之间的数据更改。同样，周二的差异备份镜像由周一到周二之间的数据更改。周三的增量备份镜像包含了周日到周三之间的数据更改，因为该增量备份将始终从全备份进行引用。周四的差异备份镜像包含了周三到周四之间的数据更改。\n\
  \n# 执行崩溃恢复操作\n\n之前您已经看到，每当事务处理被意外事件（如断电）中断时，事务当时正在交互的数据库将处于不一致状态。此类数据库将保持不一致状态，直到崩溃恢复操作将其恢复到某个一致点，否则它是不可用的。（不一致的数据库将通过每次尝试激活或与其建立连接时生成的返回码和错误消息通知用户和应用程序它是不可用的。）\n\
  \n启动崩溃恢复的一种一种方法是从 DB2 CLP 中执行 `RESTART DATABASE` 命令。该命令的基本语法为：\n\n![Image](img/736.jpg)\n\
  \n| where: | |\n| :--- | :--- |\n| DatabaseAlias | 标识分配给要恢复到一致且可用状态的数据库的别名 |\n|\
  \ UserName | 标识指定执行崩溃恢复的用户名 |\n| Password | 标识与执行崩溃恢复的用户名对应的密码 |\n| TS_Name | 标识在崩溃恢复过程中要禁用并置挂起（Drop\
  \ Pending）状态的一个或多个表空间 |\n\n如果在重启过程中表容器出现问题，可以使用 `DROP PENDING TABLESPACES ([TS_Name])`\
  \ 选项将一个或多个表空间置挂起状态。这样做允许数据库成功启动，随后可以需要对问题的表空间进行删除并重建。\n\n如果数据库中只有一个系统临时表空间，且该表空间被置挂起状态，则在成功启动数据库后，必须创建一个新的系统临时表空间。\n\
  \n如果在发生崩溃时所有数据库 I/O 都挂起，可以使用 `RESTART` 命令的 `WRITE RESUME` 选项作为崩溃恢复过程的一部分恢复数据库 I/O（挂起的操作将在“使用拆分镜像备份数据库”节中进行讨论）。\n\
  \n因此，为了对名为 `SAMPLE` 的不可用数据库执行崩溃恢复，请执行类似下面的 `RESTART` 命令：\n\n![Image](img/737-1.jpg)\n\
  \n然而，如果您想对名为 `SAMPLE` 的数据库执行崩溃恢复，并将 `TEMPSPACE1` 置挂起状态，可以通过执行类似下面的 `RESTART` 命令来实现：\n\
  \n![Image](img/737-2.jpg)\n\n\n\n\n你还可以通过从 IBM Data Studio 的 `Manage Database`（管理数据库）选项选择\
  \ `Restart`（重启）操作，为特定数据库启动崩溃恢复。图 7.10 显示了对不可用数据库执行崩溃恢复时必须选择的 IBM Data Studio 菜单项。\n\
  \n你可以对数据库进行配置，使得当应用程序或用户尝试连接数据库时，如果必要，数据库管理器会自动执行崩溃恢复。为此，你需要将 `autorestart` 数据库配置参数赋值为\
  \ `ON`。当应用程序或用户首次尝试连接数据库时，DB2 数据库管理器会检查数据库状态；如果数据库管理器确定数据库处于不一致状态，且 `autorestart`\
  \ 数据库配置参数设置为 `ON`，则它会自动执行 `RESTART` 命令。\n\n![Image](img/738.jpg)\n\n*图 7.10：从 IBM\
  \ Data Studio 启动崩溃恢复*\n\n需要注意的是，如果 DB2 数据库管理器对可恢复数据库（即已配置为支持前滚恢复操作的数据库）执行崩溃恢复操作，并在恢复过程中发生了归因于单个表空间的错误，则该表空间将被离线，并在修复之前将无法访问。这对崩溃恢复本身没有影响，且在崩溃恢复操作完成后，数据库中的所有其他表空间都将可用，并且可以建立数据库连接——前提是离线的表空间不是包含系统目录的表空间。如果包含系统目录的表空间离线，必须在允许任何数据库连接之前对其进行修复。\n\
  \n# 关于软检查（Soft Checkpoints）\n\n如前所述，DB2 数据库管理器在发生事务故障时，通过存储在事务日志中的信息执行崩溃恢复，回滚所有未完成的事务，并完成任何仍在内存中（但尚未外部化到存储器）的已事务。你可以想象，数据库的大事务日志文件可能需要长时间才能扫描整个日志并检查数据库中相应的行。然而，通常不需要扫描整个日志，因为日志文件开头记录的记录通常与已完成并已外部化到数据库的事务相关。此外，如果可以跳过这些记录，恢复崩溃数据库所需的时间就可以大大减少。\n\
  \n这就是软检查（`soft checkpoint`）机制所在。DB2 数据库管理器使用日志控制文件来确定特定日志文件中哪些记录需要应用到数据库。该日志控制文件会定期写入磁盘，该文件的更新频率由\
  \ `softmax` 数据库配置参数的值决定。一旦日志控制文件更新，存储在其中的软检查信息就确定了崩溃恢复在事务日志文件的起始位置；日志文件中软检查之前的所有记录都被认为与已写入数据库的事务相关，并被忽略。\n\
  \n## 备份与恢复\n\n虽然使用崩溃恢复可以解决因电源中断或应用程序失败导致的不一致问题，但它无法处理存储数据库文件的存储介质损坏或故障时出现的问题。为了处理此类问题，必须制定某些备份和恢复策略。\n\
  \n良好的数据库恢复策略可以确保定期创建备份镜像并保留关键数据的备份副本。根据你使用的日志方法（循环或归档），你可以在数据库离线或用户连接时创建备份镜像。DB2\
  \ 提供了四个实用程序：\n\n- `Backup`（备份）\n- `Restore`（恢复）\n- `Roll-forward`（前滚）\n- `Recover`（恢复）\n\
  \n## DB2 备份实用程序\n\n存储介质损坏时，防止灾难性损失的最重要条目就是数据库备份镜像。数据库备份镜像本质上是整个数据库的副本。\n\n你可以通过执行\
  \ `BACKUP DATABASE` 命令创建数据库或表空间的备份镜像。该命令的基本语法如下：\n\n![Image](img/740.jpg)\n\n| where:\
  \ | |\n| :--- | :--- |\n| `DatabaseAlias` | 标识分配给创建备份镜像的别名 |\n| `UserName` | 标识执行备份操作的特定用户的名称\
  \ |\n| `Password` | 指定与执行备份操作的用户名对应的密码 |\n| `TS_Name` | 标识为创建备份镜像的一个或多个特定表空间的名称\
  \ |\n| `Location` | 标识存储所创建的备份镜像的目录或设备 |\n| `TSMOptions` | 指定备份操作期间 Tivoli Storage\
  \ Manager (TSM) 将使用的选项 |\n| `NumBuffers` | 标识执行备份操作时使用的缓冲区数量（如果未指定此选项，默认使用两个缓冲区）\
  \ |\n| `BufferSize` | 指定执行备份操作时每个缓冲区的大小（以页为单位）（默认情况下，`backbufsz` DB2 数据库配置参数的值决定\
  \ `Backup` 实用程序使用的每个缓冲区的大小） |\n| `ParallelNum` | 指定备份操作期间并行读取的表空间数量 |\n| `Priority`\
  \ | 限制 Backup 实用程序的运行，使其以特定速率执行，从而控制其对并发数据库活动的影响；你可以分配 1 到 100 范围内的数值，其中 100 代表最高优先级，1\
  \ 代表最低优先级 |\n\n指定 `INCREMENTAL` 选项将产生增量备份镜像，它是自上次成功全量备份镜像以来所有更改数据的副本。当你指定 `INCREMENTAL\
  \ DELTA` 选项时，将产生增量备份镜像——增量备份镜像是自上次任何类型（全量、增量或增量）成功备份镜像以来所有更改数据的副本。\n\n\n\n\n因此，要为名为\
  \ `SAMPLE` 的当前离线数据库创建完整备份镜像，并将创建的镜像存储在 Windows 逻辑磁盘驱动器 E 上的 `backups` 目录中或 Linux\
  \ 上的 `db2backup` 文件系统中，你需要执行类似如下所示的 `BACKUP DATABASE` 命令：\n\n![Image](img/741-1.jpg)\n\
  \n然而，要为名为 `USERSPACE1` 的表空间创建增量备份镜像，并在其关联数据库（名为 `SAMPLE`）保持在线的情况下，将创建的镜像存储在 Windows\
  \ 逻辑磁盘驱动器 E 上的 `BACKUPS` 目录中或 Linux 上的 `db2backup` 文件系统中，你需要执行如下所示的 `BACKUP DATABASE`\
  \ 命令：\n\n![Image](img/741-2.jpg)\n\n请注意，只有在使用归档日志时才能创建表空间备份镜像。如果你使用循环日志，则不支持表空间备份。只有在将\
  \ `TRACKMOD` 数据库配置参数设置为 YES 之后，才能进行增量备份镜像。\n\n你还可以使用 IBM Data Studio 创建数据库或一个或多个表空间的备份镜像。要激活备份向导，请选择\
  \ `Back Up` 和 `Restore` 操作，然后选择 `Back Up` 选项，如图 7.11 所示。\n\n![Image](img/742-1.jpg)\n\
  \n*图 7.11：从 IBM Data Studio 启动备份向导*\n\n图 7.12 显示了备份向导在激活后第一页可能的样子。\n\n![Image](img/742-2.jpg)\n\
  \n*图 7.12：IBM Data Studio 备份向导的第一页*\n\n如果你的数据库启用了循环日志，你将在备份类型窗口中看到任何可用选项。图 7.13\
  \ 显示了当数据库被设置为归档日志时你可以选择的备份类型（完整或表空间级）。\n\n![Image](img/743-1.jpg)\n\n*图 7.13：IBM\
  \ Data Studio 备份向导的备份类型窗口*\n\n图 7.14 显示了 DB2 支持的媒体类型（外部磁带、TSM、NFS 或本地文件系统、TSM、XBSA\
  \ 以及其他特定）以及在备份镜像窗口中添加备份设备或文件系统路径的选项。\n\n![Image](img/743-2.jpg)\n\n*图 7.14：IBM Data\
  \ Studio 备份向导的备份镜像窗口*\n\n图 7.15 说明了 DB2 中支持的备份选项。你可以选择完整、增量或差异备份，并选择压缩它们以有效利用存储。\n\
  \n![Image](img/744-1.jpg)\n\n*图 7.15：IBM Data Studio 备份向导的备份选项窗口*\n\n图 7.16 显示了数据库性能选项，例如会话数、缓冲区数量以及每个缓冲区的大小。此向导还允许你通过\
  \ `DEDUP` 有效使用特定于设备的重删算法。\n\n![Image](img/744-2.jpg)\n\n*图 7.16：IBM Data Studio\
  \ 备份向导的性能窗口*\n\n注意：只有具有系统管理员 (`SYSADM`) 权限、系统控制 (`SYSCTRL`) 权限或系统维护 (`SYSMAINT`)\
  \ 权限的用户才允许备份数据库及其空间。\n\n提示：在 DB2 中，表空间数据从不被备份；但关于表空间的元数据会被记录。\n\n# 删除表的恢复\n\n你可能很少删除包含你仍需要的数据表。如果是这样，请按照以下步骤使你的关键表变为可恢复状态。\n\
  \n**步骤 1：** 确保你的表空间启用了 `DROPPED RECOVERY`。你可以使用 `CREATE TABLESPACE` 或 `ALTER TABLESPACE`\
  \ 命令启用它：\n\n![Image](img/745-1.jpg)\n\n**步骤 2：** 验证系统中的 `DROP_RECOVERY` 设置：\n\n\
  ![Image](img/745-2.jpg)\n\n**步骤 3：** 将数据库备份到恢复功能中：\n\n![Image](img/745-3.jpg)\n\n\
  **步骤 4：** 在启用了恢复的表空间创建一个表并在其中插入数据：\n\n![Image](img/745-4.jpg)\n\n**步骤 5：** 删除该表进行恢复测试：\n\
  \n![Image](img/746-1.jpg)\n\n**步骤 6：** 使用 `LIST HISTORY` 命令提取表信息，包括 DDL：\n\n![Image](img/746-2.jpg)\n\
  \n**步骤 7：** 恢复被删除表所在的表空间：\n\n![Image](img/746-3.jpg)\n\n**步骤 8：** 使用 `RECOVER DROPPED\
  \ TABLE` 子句执行前滚：\n\n![Image](img/747-1.jpg)\n\n**步骤 9：** 创建 `EMPLOYEE_REC`，使用 `LIST\
  \ HISTORY` 命令：\n\n![Image](img/748-2.jpg)\n\n# 恢复实用\n\n之前，你已经看到恢复是将数据库恢复到备份镜像创建时的状态的过程。这意味着要执行恢复，必须存在且可用的备份镜像。那么如何启动恢复呢？最常用的方法是执行\
  \ `RESTORE` 命令。基本语法如下：\n\n![Image](img/749-1.jpg)\n\n或\n\n![Image](img/749-2.jpg)\n\
  \n| | |\n| :--- | :--- |\n| `DatabaseAlias` | 指定与用于恢复的备份镜像相关的数据库。 |\n| `UserName`\
  \ | 指定执行恢复的用户名称。 |\n| `Password` | 指定执行恢复的用户的密码。 |\n| `TS_Name` | 指定从备份镜像恢复的一个或多个表空间（如果表空间名称自备份创建以来更改，请指定新名称）。\
  \ |\n| `SourceLocation` | 指定用于恢复的备份镜像所在的目录或设备。 |\n| `TSMOptions` | 指定恢复期间 TSM 使用的选项。\
  \ |\n| `Timestamp` | 指定在搜索特定的备份镜像时使用的时间戳（不指定时间戳将假设源位置仅有一个备份镜像）。 |\n| `TargetLocation`\
  \ | 指定存储新创建数据库容器的目录（如果使用备份镜像创建新数据库并使用自动存储）。 |\n| `TargetPath` | 指定存储新创建的数据库元数据的目录（如果使用备份镜像创建新数据库并使用自动存储）。\
  \ |\n| `StagingAlias` | 用于传输操作的临时暂留数据库。 |\n| `StoGroupName` | 所有传输的自动存储表空间的目标存储组。\
  \ |\n| `TargetAlias` | 指定要创建的新数据库的别名。 |\n| `LogsLocation` | 指定存储新数据库日志文件的目录或设备。\
  \ |\n| `NumBuffers` | 指定执行恢复操作使用的缓冲区数量（如果不指定此选项，默认使用两个缓冲区）。 |\n| `BufferSize` |\
  \ 指定执行备份操作的每个缓冲区的大小（以页为单位，默认情况下，数据库管理器配置参数 `restbufsz` 的值决定 `Restore` 实用程序使用的缓冲区大小）。\
  \ |\n| `ScriptFile` | 指定写入重定向恢复操作所需的所有命令的文件。 |\n| `ParallelNum` | 指定在恢复操作期间可以并行读取的表空间数量。\
  \ |\n\n\n\n因此，如果你想恢复一个名为 `SAMPLE` 的数据库（该数据库已存在），使用存储在 Windows 逻辑驱动器 E: 上 `BACKUPS`\
  \ 目录下的全量备份镜像，可以通过执行类似所示的 `RESTORE DATABASE` 命令来实现：\n\n![Image](img/751.jpg)\n\n\
  然而，如果你想从存储在 Windows 逻辑驱动器 E: 上 `BACKUPS` 目录下的增量备份镜像中恢复一个名为 `USERSPACE1` 的表空间，同时保持其关联的数据库（名为\
  \ `SAMPLE`）处于在线状态，你将执行类似所示的 `RESTORE DATABASE` 命令：\n\n![Image](img/752-1.jpg)\n\n\
  每个全数据库备份镜像除了其他内容外，还包含数据库恢复历史文件的副本。然而，当从全数据库备份镜像中恢复现有数据库时，现有的恢复历史文件不会被覆盖。但如果数据库的恢复历史文件恰好损坏了呢？既然数据库备份镜像中存在一份副本，是否也可以恢复该恢复历史文件？答案是肯定的。通过使用特殊形式的\
  \ `RESTORE DATABASE` 命令，你可以仅从数据库备份镜像中恢复恢复历史文件。这样的 `RESTORE DATABASE` 命令类似所示：\n\n\
  ![Image](img/752-2.jpg)\n\n还可以从全数据库备份镜像创建一个完全全新的数据库，从而有效地克隆现有数据库。因此，你可以通过执行类似所示的\
  \ `RESTORE DATABASE` 命令，使用存储在 Windows 逻辑驱动器 E: 上 `BACKUPS` 目录下的备份镜像，创建一个名为 `SAMPLE_2`\
  \ 的数据库，它是名为 `SAMPLE` 数据库的完全副本：\n\n![Image](img/752-3.jpg)\n\n需要注意的是，如果你使用备份镜像创建新数据库，存储在备份镜像中的恢复历史文件将成为新数据库的恢复历史文件。\n\
  \n你还可以使用 IBM Data Studio 执行上述的任何恢复/还原操作（以及许多其他操作）。图 7.17 显示了为了激活“恢复数据库”向导而必须选择的\
  \ Data Studio 菜单项。\n\n![Image](img/753.jpg)\n\n*图 7.17：在 IBM Data Studio 中调用恢复数据向导*\n\
  \n图 7.18 阐释了“恢复数据库”向导“恢复类型”窗口在激活后后可能的样子。你可以选择恢复到现有的当前数据库或恢复到一个新数据库。\n\n在图 7.19 中，你可以看到“恢复对象”向导提供了许多恢复选项，包括恢复整个数据库、仅恢复历史文件，或恢复一个或多个表空间。它还允许你以表格格式从可用的备份镜像中选择恢复镜像，如图\
  \ 7.20 所示。\n\n![Image](img/754-1.jpg)\n\n*图 7.18：恢复类型向导*\n\n![Image](img/754-2.jpg)\n\
  \n*图 7.19：恢复对象向导*\n\n图 7.21 显示了“恢复容器”向导，你可以用它通过将系统管理和数据库管理的表空间容器设置为服务器上的可用路径，来执行重定向恢复操作。重定向恢复操作将在下一节中详细讨论。\n\
  \n![Image](img/755-1.jpg)\n\n*图 7.20：恢复备份镜像表*\n\n![Image](img/755-2.jpg)\n\n*图 7.21：恢复容器向导*\n\
  \n图 7.22 显示了“恢复选项”向导，它包含替换数据库历史文件的选项、指定活动日志路径（`newlogpath` 数据库配置参数）以及指定从数据库备份镜像中提取日志的路径（这适用于当你使用\
  \ `INCLUDE LOGS` 选项进行备份时，且是默认行为）。\n\n你可以通过选择“删除所有连接（Remove all connections）”复选框，在恢复之前强制终止所有连接。在指定恢复时，有两种重滚日志操作选项可用：仅恢复数据库（这意味着数据库将使用\
  \ `RESTORE` 命令的 `WITHOUT ROLLING FORWARD` 子句进行恢复）以及恢复到某个时间点。当你选择将数据库恢复到特定的时间点时，恢复向导的左窗格将显示三个更多选项：重滚日志类型（Roll-forward\
  \ Type）、重滚日志范围（Roll-forward Scope）和重滚最终状态（Roll-forward Final State）。\n\n![Image](img/756.jpg)\n\
  \n*图 7.22：恢复选项向导*\n\n图 7.23 展示了不同的重滚日志选项；在指定恢复时，可以选择日志结束（end of logs）、某个时间点（point\
  \ in time）。你还可以指定日志位置，例如使用默认位置（`newlogpath`），并指定数据库备份镜像中提取日志的替代路径。\n\n图 7.24 显示了重滚范围，取决于你想要重滚的对象（整个数据库或某个特定的表空间）。\n\
  \n图 7.25 显示了重滚的最终状态，向导允许你选择。如果你想让数据库处于重滚等待状态，以便作为灾难恢复过程的一部分在未来应用更多日志，你可以选择“留在重滚等待状态（Leave\
  \ in roll-forward pending）”，如果你想激活数据库以允许连接，可以选择“完成重滚操作并返回活动状态（Complete the roll-forward\
  \ operation and return to the active state）”。\n\n\n\n\n| `TS_ID` | 标识为提供新存储容器的表空间分配的标识\
  \ |\n| `Container` | 标识用于存储与指定表空间相关的一个或多个容器 |\n| `ContainerSize` | 标识在指定的表空间容器中存储的页数\
  \ |\n\n执行重定向恢复（redirect restore）操作的步骤如下：\n\n**步骤 1：** 执行指定 `REDIRECT` 选项的 `RESTORE\
  \ DATABASE` 命令启动重定向恢复操作。当你指定此选项时，遇到的每个无效表空间容器都将被标记，所有引用无效表空间容器的表空间都将处于“恢复等待”（Restore\
  \ Pending）状态。要显示所有受影响表空间的列表，请执行 `LIST TABLESPACES` 命令。在某个时刻，你应该会看到一条类似下面的消息：\n\n\
  ![Image](img/759.jpg)\n\n**步骤 2：** 使用 `SET STOGROUP PATHS` 命令为要恢复的数据库指定存储组路径\n\n\
  *或者*\n\n通过对每个处于“恢复等待”状态的表空间执行 `SET TABLESPACE CONTAINERS` 命令，为其指定新的表空间容器。请记住，SMS\
  \ 表空间只能使用 `PATH` 容器，而 DMS 表空间只能使用 `FILE` 或 `DEVICE` 容器。并且所有的 `AUTOMATIC STORAGE\
  \ PATH` 都会由 DB2 自动设置。\n\n**步骤 3：** 再次执行指定 `CONTINUE` 选项的 `RESTORE DATABASE` 命令完成重定向恢复操作。\n\
  \n为了简化操作，你可以将所有这些步骤写入 UNIX Shell 脚本或 Windows 批处理文件中，然后从系统提示符执行执行。\n\n这样的文件看起来如下：\n\
  \n![Image](img/760-1.jpg)\n\n从 DB2 9.1 版本开始，你可以使用 `RESTORE DATABASE` 命令的 `REDIRECT\
  \ GENERATE SCRIPT` 选项自动创建恢复脚本文件。然后，你可以修改生成的脚本，并运行该脚本来执行重定向恢复操作。例如，要基于位于 Linux 服务器上的名为\
  \ `SAMPLE` 数据库的现有备份映像生成重定向恢复脚本，请执行类似下所示 `RESTORE DATABASE` 命令：\n\n![Image](img/760-2.jpg)\n\
  \n![Image](img/note.jpg)\n\n**提示：** 在从一个系统恢复数据库到另一个系统时，将 DB2 注册表变量 `DB2_RESTORE_GRANT_ADMIN_AUTHORITIES`\
  \ 设置为 YES，向执行恢复操作的用户授予目标数据库的 SECADM、DBADM、DATAACCESS 和 ACCESSCTRL 权限。\n\n![Image](img/note.jpg)\n\
  \n**注意：** 除了在旧表空间不可用或不再时为表空间提供新存储容器外，重定向恢复还可以向现有 SMS 表空间添加新容器。`ALTER TABLESPACE`\
  \ 命令不允许你向现有 SMS 表空间添加新的存储容器；重定向恢复提供了解决此限制的变通。\n\n# 数据库重建操作\n\n在 DB2 的早期版本中，我们应该拥有全量、增量和差异备份映像以便从任何故障中恢复数据库。通过\
  \ DB2 9.1 数据库重建功能，你可以使用一组表空间级别的备份来重建整个数据库，这意味着你不再需要进行全数据库备份。此外，此功能提供了在开始时使用非常有限的表空间重建数据库并根据需要添加剩余表空间的能力。在关键恢复情况下，你可能需要比其他表空间更快地让某些表空间上线，以便你的应用程序恢复业务。\n\
  \n表 7.2 展示了基于业务需求和数据库恢复类型的某些重建恢复场景。\n\n| **表 7.2: 数据库重建恢复场景** |\n| **恢复需求** | **备份媒体类型**\
  \ | **方法** |\n| :--- | :--- | :--- |\n| 全数据库恢复 | • 在线/离线全数据库备份• 表空间层级备份• 增量/差异备份•\
  \ 相关的事务日志 | REBUILD WITH ALL |\n| 仅恢复某些表空间 | • 在线/离线全数据库备份• 表空间层级备份• 增量/差异备份• 相关的事务日志\
  \ | REBUILD WITH TABLESPACE |\n| 在不同的文件系统上恢复全数据库 | 在线全量数据库备份及相关的事务日志 | REBUILD WITH\
  \ ALL ….REDIRECT |\n| 全数据库恢复或仅恢复某些表空间 | 离线不可恢复数据库备份 | 上述指定的选项对于无需滚向前（rollforward）的不可恢复数据库\
  \ REBUILD 操作均有效；然而，在恢复某些表空间的情况下，未恢复的表空间将无法再次恢复。 |\n\n对具有六个表空间——`SYSCATSPACE`、`USERSPACE1`、`TEMPSPACE1`、`IBMDB2SAMPLEREL`、`IBMDB2SAMPLEXML`\
  \ 和 `SYSTOOLSPACE` 的 `SAMPLE` 数据库执行重建的步骤如下：\n\n**步骤 1：** 在应用程序关键表空间 `USERSPACE1`\
  \ 上启动恢复/重建操作。你必须在第一次重建中包含 `SYSCATSPACE`，因为此表空间持有所有的系统目录信息：\n\n![Image](img/761.jpg)\n\
  \n**步骤 2：** 执行 `ROLLFORWARD DATABASE` 命令（将在后续页面查看详细信息）以应用事务日志中记录的任何更改：\n\n![Image](img/762-1.jpg)\n\
  \n现在，你应该看到一条类似下面的消息：\n\n![Image](img/762-2.jpg)\n\n在此阶段，`SAMPLE` 数据库是可以连接的。`LIST\
  \ TABLESPACES` 命令将显示每个表空间的状态。你将看到 `SYSCATSPACE`、`TEMPSPACE1`、`USERSPACE1` 和 `SYSTOOLSPACE`\
  \ 处于 `0x0000`（正常），而 `IBMDB2SAMPLEL` 和 `IBMDB2SAMPLEXML` 处于 `0x0100`（恢复等待）。\n\n**步骤\
  \ 3：** 启动恢复操作的第二阶段以恢复 `IBMDB2SAMPLEL` 和 `IBMDB2SAMPLEXML` 表空间，随后执行 `ROLLFORWARD`\
  \ 命令。你可以在线进行此活动而不影响应用程序连接和功能：\n\n![Image](img/762-763.jpg)\n\n现在，你应该看到 `SAMPLE`\
  \ 数据库的所有表空间都处于正常状态。\n\n# DB2 滚向前实用\n\n当你使用备份映像恢复受损坏的数据库时，你只能将数据库恢复到备份映像创建时的状态。因此，执行版本恢复操作时，备份映像创建后对数据库的所有更改都将丢失。要将数据库恢复到任何给定时间点，你必须使用滚向前恢复（rollforward\
  \ recovery）。而且为了执行滚向前恢复操作，数据库必须是可恢复的（即数据库必须配置为使用归档日志），你必须拥有自上次备份映像（全量、增量或差异）以来创建的所有归档日志文件。\n\
  \n滚向前恢复从版本恢复开始。然而，版本恢复操作会让不可恢复的数据库处于正常状态，而相同的操作会让可恢复的数据库处于滚向前等待状态（除非在使用恢复数据库的 `RESTORE\
  \ DATABASE` 命令时指定了 `WITHOUT ROLLING FORWARD` 选项）。此时，可以将数据库退出滚向前等待状态（此时，自用于版本恢复的备份映像创建以来对数据库的所有更改都将丢失），或者可以重放存储在数据库事务日志文件中的信息以将数据库恢复到任何给定时间点的状态。\n\
  \n\n\n\n重放存储在归档日志文件中的事务的过程被称为`数据库向前滚（rolling the database forward）”。向前滚数据库的一种方法是执行\
  \ `ROLLFORWARD DATABASE` 命令。该命令的基本语法如下：\n\n![Image](img/763-764.jpg)\n\n| 何处: |\n\
  | :--- | :--- |\n| `DatabaseAlias` | 标识分配给要向前滚数据库的别名 |\n| `UserName` | 标识指定执行向前滚操作的用户名称\
  \ |\n| `Password` | 标识与执行向前滚操作的用户对应的密码 |\n| `PointInTime` | 标识一个特定的时间点，该点由格式 `yyyy-mm-dd-hh.mm.ss.nnnnnn`（年、月、日、时、分、秒、微秒）的时间戳确定，数据库向前滚到该点（只有在指定日期时间之前且当时发生的事务将重新应用于数据库）\
  \ |\n| `TS_Name` | 标识分配给要向前滚的一个或多个特定表空间（如果自用于恢复数据库的备份映像以来表空间名称发生了变化，请指定新名称） |\n\
  | `LogDirectory` | 标识包含用于执行向前滚操作的离线归档日志文件的目录 |\n| `TableID` | 标识之前删除并作为向前滚操作的一部分进行恢复的特定表（通过\
  \ ID）（要获取表 ID，请检查数据库的恢复历史文件） |\n| `Location` | 标识当表作为向前滚操作的一部分被恢复时，写入包含被删除表数据的文件的目录\
  \ |\n\n指定 `AND COMPLETE`、`AND STOP`、`COMPLETE` 或 `STOP` 选项（实际上 `STOP` 和 `COMPLETE`\
  \ 选项是同义词）将在向前滚操作将数据库返回正常状态。否则，数据库将保持向前滚等待（Roll-forward Pending）状态。（当从备份映像恢复可恢复数据库时，除非在使用\
  \ `RESTORE DATABASE` 命令时使用了 `WITHOUT ROLLING FORWARD` 选项，否则它会自动处于向前滚等待状态；在数据库处于向前滚等待期间，用户和应用程序无法访问它。）\n\
  \n如果你指定 `QUERY STATUS` 选项，将返回执行向前滚恢复操作所需的日志文件列表、所需的下一个归档文件，以及自向前滚处理开始以来最后一个提交事务的时间戳（UTC）。\n\
  \n因此，要对刚从备份映像恢复的名为 `SAMPLE` 的数据库执行向前滚恢复操作，请执行类似下面的 `ROLLFORWARD DATABASE` 命令：\n\n\
  ![Image](img/765-1.jpg)\n\n然而，如果你想对名为 `SAMPLE` 的数据库中名为 `TS_SMALL_DATA` 的表空间执行向前滚恢复操作（这只有在你打算进行表空间恢复而不是全数据库恢复时才能激活），通过重新应用在\
  \ 2013 年 6 月 1 日或之前对表空间执行的事务，你将执行类似下面的 `ROLLFORWARD DATABASE` 命令：\n\n![Image](img/765-2.jpg)\n\
  \n需要注意的是，你指定的时间值被解释为协调世界时（UTC）——也称为格林尼治标准时间（GMT）值。如果执行的是类似下面的 `ROLLFORWARD DATABASE`\
  \ 命令，指定的时间值将被解释为本地时间值：\n\n![Image](img/765-3.jpg)\n\n![Image](img/note.jpg)\n\n\
  **注意：** 当你将表空间向前滚到特定时间点时，指定的时间必须大于为表空间记录的最小恢复时间。你可以通过执行以下命令获取此时间：\n\n![Image](img/765-4.jpg)\n\
  \n此外，此命令返回每个表空间可以向前滚的最早时间点。（当对表空间或存储在表空间中的表运行 DDL 语句时，最小恢复时间会更新）。表空间必须向前滚到至少最小恢复时间，以便与系统目录表中的信息同步。如果恢复多个表空间，你必须将每个表空间向前滚到所有正在恢复的表空间最高的最小恢复时间。\n\
  \n![Image](img/note.jpg)\n\n**提示：** 从具有较高内存配置的源服务器恢复到具有较低内存配置的目标服务器，在向前滚操作或数据库激活期间可能会由于目标服务器的内存限制收到\
  \ SQL1218N 错误。解决方法是在目标服务器上将 `DB2_OVERRIDE_BPF` 注册变量设置为较小的缓冲池页数，以避免数据库管理器尝试分配所有服务器内存的大型缓冲池。\n\
  \n要将数据库中的所有缓冲池大小临时更改为 5,000 页，请使用此命令：\n\n![Image](img/766-1.jpg)\n\n要将数据库中仅限 `BUFFERPOOL\
  \ ID 1` 的页数临时更改为 5,000 页，请使用此命令：\n\n![Image](img/766-2.jpg)\n\n`DB2_OVERRIDE_BPF`\
  \ 设置将不会影响 DB2 系统缓冲池。\n\n如果你想将表空间向前滚到特定时间点，且该表空间中的某个表与位于另一个表空间的表参与了引用完整性约束，请将两个表空间同步向前滚到同一时间点。如果不这样做，引用完整性关系中的子表将在恢复操作结束时处于设置完整性等待（Set\
  \ Integrity Pending）状态。\n\n![Image](img/767.jpg)\n\n*图 7.26: 从 Data Studio 中调用向前滚向导*\n\
  \n你还可以使用向前滚向导启动向前滚恢复操作，通过从 Data Studio 的**备份和恢复（Backup and Restore）**菜单中选择**向前滚（Roll\
  \ Forward）**操作来激活它。图 7.26 显示了必须选择的 Data Studio 菜单项以激活向前滚向导。\n\n图 7.27 显示了向前滚向导在激活后第一页的样子。如你所示，此向导提供了许多向前滚选项，例如向前滚类型、向前滚范围和向前滚最终状态，这与恢复部分讨论的内容类似。\n\
  \n![Image](img/768.jpg)\n\n*图 7.27:向前滚步骤*\n\n![Image](img/note.jpg)\n\n**注意：** 只有具有系统管理员（SYSADM）、系统控制（SYSCTRL）或系统维护（SYSMAINT）权限的用户允许执行向前滚恢复操作。\n\
  \n# 关于恢复历史文件\n\n在第 3 章](#010_Chapter003.html_ch-3）“物理设计”中，你看到在创建数据库的过程中创建一个名为*恢复历史文件*的特殊文件。该文件的目的是记录针对数据库执行的特定操作的历史信息。具体来说，每当你执行以下任何操作时，记录都会写入恢复历史文件：\n\
  \n*   创建任何类型的备份映像\n*   对数据库或其一个表空间执行版本恢复操作\n*   使用 `Load` 工具加载表\n*   对数据库或其一个表空间执行向前滚恢复操作\n\
  *   修改、重命名表空间或两者兼有\n*   静止表空间\n*   使用 `REORG` 工具重组表数据\n*   使用 `RUNSTATS` 工具更新表统计\n\
  *   删除（删除）表\n\n\n\n\n*   日志文件已归档。\n\n除了标识执行的事件外，恢复历史文件中的每个条目还标识了事件发生的日期和时间、事件发生的方式、影响的表空间和表，如果该操作是备份操作，还有生成的备份映像的存储位置以及访问该映像的信息。由于恢复历史文件包含每个备份映像的位置信息，因此它在版本恢复操作期间充当了跟踪和验证机制。\n\
  \n恢复历史文件静静地运行在后台，由 DB2 数据库管理器负责管理其内容，因此数据库管理员很少需要与其交互。然而，有两个命令——`LIST HISTORY` 和\
  \ `PRUNE HISTORY`——提供了查看数据库恢复历史文件内容以及删除其中存储的一个或多个目的的方法。此外，如果数据库的恢复历史文件损坏，可以从数据库备份映像中仅恢复恢复历史文件。\n\
  \n![Image](img/note.jpg)\n\n**注意：** 为了方便查看恢复历史文件信息，请使用 `SYSIBMADM.DB_HISTORY` 管理视图，而不是直接读取文件。该管理视图还会返回来自数据库分区功能（DBPF）环境中所有数据库分区的历史文件信息。\n\
  \n# DB2 恢复实用程序\n\n此前你已经看到，如何使用 `RESTORE DATABASE` 命令可以将数据库恢复到创建备份映像时的状态，以及如何使用 `ROLLFORWARD\
  \ DATABASE` 命令可以重放数据库事务中记录的信息，以从全数据库备份映像恢复数据库。这个过程非常简单。然而，如果你有一个全数据库备份映像和几个增量备份映像、差异备份映像或表空间备份映像，过程可能会变得有点复杂。这就是\
  \ DB2 的 `Recover` 实用程序大显用场。\n\n`Recover` 实用程序根据其在恢复历史文件中找到的信息，执行必要的恢复和向前滚动操作，将数据库恢复到特定的时间点。要调用\
  \ `Recover` 实用程序，请执行 `RECOVER DATABASE` 命令。该命令的基本语法如下：\n\n![Image](img/770-1.jpg)\n\
  \n| where: | |\n| `DatabaseAlias` | 标识分配给与备份映像关联数据库的别名，用于执行版本恢复操作 |\n| `PointInTime`\
  \ | 标识一个特定的时间点，由格式为 `yyyy-mm-dd-hh.mm.ss.nnnnnn`（年、月、日、时、分、秒、微秒）的时间戳值标识，将数据库向前滚动到该点（仅将发生在指定日期和时间之前且截止该时间的事务重新应用于数据库）\
  \ |\n| `UserName` | 标识分配给执行恢复操作的特定用户的名称 |\n| `Password` | 标识与执行恢复操作的用户名对应的密码 |\n\
  | `HistoryFile` | 标识分配给 `Recovery` 实用程序使用的恢复历史日志文件的名称 |\n| `LogDirectory` | 标识包含离线归档日志文件的目录，用于执行恢复操作的向前滚动部分\
  \ |\n\n因此，要使用存储在恢复历史中的信息对名为 `SAMPLE`（已存在）的数据库执行全恢复操作，你可以执行类似所示的 `RECOVER DATABASE`\
  \ 命令：\n\n![Image](img/770-2.jpg)\n\n然而，如果你想恢复名为 `SAMPLE` 的数据库，并将其向前滚动到当前恢复历史文件不再包含的极旧时间点，你将执行类似所示的\
  \ `RECOVER DATABASE` 命令（假设你有一份旧版本恢复历史文件的副本）：\n\n![Image](img/771.jpg)\n\n需要注意的是，如果\
  \ `Recover` 实用程序成功恢复了数据库，但由于某些原因在尝试向前滚动时失败，`Recover` 实用程序将尝试继续之前的恢复操作，而不重新执行恢复阶段。如果你想强制\
  \ `Recover` 实用程序重新执行完整的恢复，请执行指定了 `RESTART` 选项的 `RECOVER DATABASE` 命令。无法从故障点显式重启恢复操作。\n\
  \n# 重建无效索引\n\n到目前，我们已经看了在持有数据库文件的存储介质损坏或故障时恢复数据的方法。但如果仅索引损坏，而数据库数据不受影响呢（如果数据和索引存储在单独的表空间且仅存储索引数据的物理设备故障，可能会发生这种情况）。在这种情况下，受影响的索引失效，可以在更换故障介质后通过重新来恢复。\n\
  \n每当 DB2 数据库管理器检测到索引不再有效时，它会自动尝试重建。然而，DB2 数据库管理器尝试重建无效索引的时间点由数据库或 DB2 数据库管理器配置文件的\
  \ `indexrec` 参数控制。该参数有三个可能的设置：\n\n*   `SYSTEM`。按照 DB2 数据库管理器配置文件中 `indexrec` 参数指定的时间重建无效索引。此设置仅对数据库配置文件有效。\n\
  *   `RESTART`。在数据库重启时（即对数据库执行崩溃恢复时），显式或隐式地重建无效索引。\n*   `ACCESS`。在无效索引被标记为无效后，首次被访问时重建它们。\n\
  \n那么，重建无效索引的最佳时间是什么时候？如果不担心对数据库执行崩溃恢复操作所需，那么让 DB2 数据库管理器在将数据库恢复到一致状态的过程中重建无效索引更好。由于索引创建过程，重启数据库所需将更长，但一旦数据库恢复，查询处理将不会受到影响。然而，如果索引在被访问时重建，崩溃恢复将执行得更快，尽管用户可能会遇到性能下降——针对包含无效索引的表的查询必须等待无效索引重建后才能进行处理。此外，在无效索引重建很久之后可能仍获取并持有意外的锁，特别是当导致索引重建的事务在一段时间内未提交（或回滚）时。\n\
  \n尽管你可以使用数据库或 DB2 数据库管理器配置文件的 `indexrec` 参数来控制在崩溃恢复操作中何时重建索引，但 `indexrec` 对向前滚动恢复操作期间如何重建索引没有。要控制该行为，你必须为\
  \ `logindexbuild` 数据库配置参数分配适当的值。该参数有两个可能的设置：\n\n*   `ON`。索引创建、重建和重组操作将记录在数据库的事务日志文件中，以便在向前滚动恢复操作或\
  \ HADR 日志重放操作期间重建索引。\n*   `OFF`。索引创建、重建和重组操作将不会记录在数据库的事务日志文件中。\n\n\n\n\n\n如果你将 `LOG\
  \ INDEX BUILD` 表属性设置为其默认值 `NULL`，则 DB2 将使用 `logindexbuild` 数据库配置参数中指定的值。如果你将 `LOG\
  \ INDEX BUILD` 表属性设置为 `ON` 或 `OFF`，则将忽略 `logindexbuild` 数据库配置参数中指定的值。\n\n# 使用分割镜像（Split\
  \ Mirroring）备份数据库\n\n此前提到过，随着数据库规模的增大以及高强度使用要求数据库保持 24 x 7 小时可用，备份和恢复数据库所需的时间和硬件可能会大幅增加。备份整个数据库或大型数据库的若干个表空间会对系统资源产生压力，需要大量的额外存储空间（用于存放备份映像），并降低数据库系统的可用性（特别是当系统必须离线才能进行备份时）。因此，创建和维护高可用数据库备份映像的一种种流行替代方案是使用所谓的\
  \ `split mirror`（分割镜像）。\n\n分割镜像（split mirror）是数据库的“瞬时”副本，它是通过对包含数据库数据的磁盘或多个磁盘进行镜像，并在需要数据库备份副本时将镜像分离来实现的。镜像是将所有数据库数据同时写入两个独立磁盘（或磁盘子系统）的过程；一个磁盘/子系统持有数据库数据，另一个则持有正在使用的主磁盘/子系统的精确副本（称为\
  \ `mirror`，即镜像）。分割镜像仅涉及将数据库的主副本和备副本相互分离。分割镜像提供了以下优势：\n\n*   消除了创建数据库备份映像所需的开销。\n\
  *   可以非常地克隆整个系统。\n*   它提供了快速的空闲切换（idle failover）实现。\n\n为了进一步增强分割镜像，DB2 提供了一种临时挂（稍后恢复）所有数据库\
  \ I/O 的方法，以便无需将数据库离线即可分离镜像。提供此功能的命令是 `SET WRITE`，其语法如下：\n\n![Image](img/773-1.jpg)\n\
  \n因此，如果你想临时挂数据库的所有 I/O，可以通过建立与该数据库的连接并执行如下 `SET WRITE` 命令来实现：\n\n![Image](img/773-2.jpg)\n\
  \n执行 `SET WRITE SUSPEND FOR DATABASE INCLUDE LOGS` 命令时，DB2 数据库管理器将挂起当前数据库关联的所有表空间容器和日志文件的写入操作（如果在\
  \ `SET WRITE SUSPEND` 命令中指定了 `EXCLUDE LOGS` 子句，则不会挂起日志写入操作）。挂起表空间和日志文件的写入是为了防止在移除移除之前发生部分页写入。在数据库写入挂起期间，除在线备份和恢复操作外，所有操作都将正常运行。也就是说，只读事务不会被挂起，在不需要\
  \ I/O 的情况下可以继续在写入挂起的数据库上运行；应用程序可以继续对缓存在数据库缓冲区池中的数据执行插入、更新和删除操作，但无法从磁盘读取新页。此外，如果身份验证连接所需的系统目录页已存在于缓冲区池中，则可以为写入挂起的数据库建立新的数据库连接。可选情况下，你可以在\
  \ `SET WRITE SUSPEND` 命令之前使用 `FLUSH BUFFERPOOLS ALL` 语句，以最度地减少备用数据库的恢复时间。\n\n一旦你挂起了数据库的写入操作，请使用相应的操作系统和存储命令从主数据库创建一个或多个镜像。\n\
  \n要随时恢复写入挂起状态数据库的 I/O，请执行如下所示的 `SET WRITE` 命令：\n\n![Image](img/774-1.jpg)\n\n执行\
  \ `SET WRITE RESUME FOR DATABASE` 命令时，DB2 数据库管理器将取消所有写入挂起，并允许与当前数据库关联的表空间容器和日志文件的写入操作继续。\n\
  \n![Image](img/note.jpg)\n\n**注意：** 你可以在任何其他会话中执行 `SET WRITE RESUME FOR DATABASE`\
  \ 命令，因此对于从执行 `SET WRITE SUSPEND FOR DATABASE` 命令的连接没有限制。\n\n你可以通过查看 `SUSPEND_IO`\
  \ 数据库参数或使用 `MON_GET_TABLESPACE` 函数来确定数据库 I/O 写入操作的状态。让我们在数据库 `SAMPLE` 上运行这些步骤查看结果。\n\
  \n**步骤 1：** 连接到主数据库 `SAMPLE`：\n\n![Image](img/774-2.jpg)\n\n**步骤 2：** 将主数据库缓冲区池中的数据刷新到磁盘：\n\
  \n![Image](img/774-3.jpg)\n\n**步骤 3：** 挂起主数据库上的 I/O 写入操作：\n\n![Image](img/774-4.jpg)\n\
  \n**步骤 4：** 检查表的状态：\n\n![Image](img/775-1.jpg)\n\n你也可以通过 `GET DB CFG` 命令来验证这一点：\n\
  \n![Image](img/775-2.jpg)\n\n**步骤 5：** 使用相应的操作系统和存储命令从主数据库创建一个或多个分割镜像。\n\n**步骤 6：**\
  \ 恢复主数据库上的 I/O 写入操作：\n\n![Image](img/775-3.jpg)\n\n# 使用 db2inidb 初始化分割镜像\n\n在使用\
  \ DB2 数据库的分割镜像副本之前，你必须先执行系统命令 `db2inidb` 来进行初始化。该命令的语法如下：\n\n![Image](img/775-4.jpg)\n\
  \n| where： | |\n| :--- | :--- |\n| `DatabaseAlias` | 标识分配给分割镜像副本以便引用的数据库别名 |\n|\
  \ `ConfigFile` | 表示根据指定配置文件存储的信息重定位分割镜像副本中包含的数据库文件 |\n\n如你所见，分割镜像数据库副本可以通过三种方式之一初始化：\n\
  \n*   `SNAPSHOT`：数据库的分割镜像将被初始化为主数据库的只读克隆。\n*   `MIRROR`：数据库的分割镜像将被初始化为用于恢复主数据库的备份映像。\n\
  *   `STANDBY`：数据库的分割镜像将被初始化并置于回滚等待（Rollforward Pending）状态，以便与主数据库进行持续同步。（可以随时从主数据库检索新日志并将其应用到数据库副本上。）如果由于某种原因主数据库宕机，你可以使用数据库的备用副本代替主数据库。\n\
  \n因此，如果你想初始化名为 `SAMPLE` 的数据库的分割镜像副本，并将其作为用于恢复主数据库的备份映像，可以执行如下所示的 `db2inidb` 命令：\n\
  \n![Image](img/776.jpg)\n\n# 高可用灾难恢复 (HADR)\n\nHADR 是一种 DB2 数据库复制功能，为部分和整个站点故障提供高可用解决方案。HADR\
  \ 通过将数据更改从源数据库（称为 `primary`）复制到一个或多个目标数据库（称为 `multiple standby databases`）来防止数据丢失。在\
  \ HADR 环境中，应用程序可以访问当前的主数据库——与备用数据库的同步通过重滚主数据库生成并发送到备用数据库的事务日志数据来实现。通过 HADR，你可以通过指定四种同步模式之一来选择你针对潜在数据丢失所要求的保护级别：同步\
  \ (`SYNC`)、近同步 (`NEARSYNC`)、异步 (`ASYNC`) 和超异步 (`SUPERASYNC`)。\n\n\n\n\nHADR 的设计在发生部分或整个站点故障时，最大限度地减少对数据库系统的影响。硬件、网络或软件（`DB2`\
  \ 或操作系统）故障可能导致部分站点故障。如果没有 HADR，部分站点故障需要重启托管有一个或多个 `DB2` 数据库的服务器和实例。重启服务器和实例所需的时间是不可预测的。如果在发生部分站点故障时事务负载较重，可能需要几分钟才能让数据库恢复到一致状态并供使用。有了\
  \ HADR，主备用数据库可以在几秒内接管。此外，您可以通过实现自动客户端重定向功能，或在与数据库交互的应用程序中使用重试逻辑，将使用原始主数据库的客户端重定向到备用数据库（此时已是新的主数据库）。\n\
  \n在故障的原始主服务器修复后，如果数据库的两个副本都能保持一致，它就可以作为备用数据库重新加入 HADR 节点。一旦原始主数据库作为备用数据库重新整合到 HADR\
  \ 节点中，您就可以切换角色，使原始主数据库再次作为主数据库运行功能。这被称为 `failback operation`（回滚操作）。\n\n当发生火灾等灾难摧毁整个站点时，就会发生完全站点故障。因为\
  \ HADR 使用 `TCP/IP` 在主备数据库之间进行通信，因此数据库可以位于多个不同的位置。例如，您的主数据库可能位于一个城市的总部，而你的主备用数据库位于另一个城市的销售办事处，辅助数据库位于另一个城市的营销办事处。如果主站点发生灾难，将通过让远程备用数据库接管主数据库来维护数据可用性。\n\
  \n# HADR 环境的要求\n\n为了让您获得 HADR 的最佳性能，托管备用数据库的系统应与主数据库所在的系统具有相同的硬件和软件。如果托管备用数据库的系统资源少于托管主数据库的系统，备用数据库可能无法跟上主数据库生成的事务负载。这可能导致备用数据库落后或主数据库的性能下降。更重要的是，如果发生故障转移，新的主数据库可能没有足够的资源来充分服务客户端应用程序。由于在主数据库上执行的缓冲池操作会在备用数据库上重放，因此主、备用数据库服务器具有相同容量的内存是非常重要的。\n\
  \nIBM 建议您为 HADR 主数据库和备用数据库使用相同的主机计算机。如果可能，请确保它们来自同一供应商并具有相同的架构。此外，主备用数据库服务器上的操作系统应为相同版本，包括补丁级别。您在滚动升级期间可以短时间违反此规则，但在这样做时要极度谨慎。HADR\
  \ 主机之间还必须存在 `TCP/IP` 接口，并确保使用高速、高容量的网络来连接这两台机器。\n\n安装在主数据库和备用数据库服务器上的 `DB2` 软件必须具有相同的位宽（32\
  \ 位或 64 位），且您用于主备用数据库的 `DB2` 版本必须完全相同；例如，两者都必须是版本 `10.1` 或版本 `10.5`。在滚动升级期间，备用数据库的数据库系统修改级别（例如修复包级别）可以在短时间内晚于主数据库。但是，请不要长时间保持这种配置。如果主数据库的数据库系统修改级别晚于备用数据库，主备数据库之间将无法相互连接。因此，您必须始终对备用数据库系统应用修复包。\n\
  \n主数据库和备用数据库必须是单分区数据库，并且它们必须具有相同的数据库名称；但它们不需要存储在相同的数据库路径上。此外，请确保主、备用数据库服务器上分配给事务日志文件的存储空间相同——不支持使用原始设备进行事务日志记录。（只有当前的主数据库将执行归档日志。）\n\
  \n表空间属性如表空间名称、表空间类型（`DMS`、`SMS` 或自动存储）、表空间页大小、表空间大小、容器路径、容器大小和容器类型（原始设备、文件或目录）在主备用数据库上必须完全一致。当您在主数据库上执行\
  \ `CREATE TABLESPACE`、`ALTER TABLESPACE` 或 `DROP TABLESPACE` 等表空间语句时，这些语句会在备用数据库上重放。因此，在主数据库上执行表空间语句之前，您必须确保涉及语句的表空间容器在两个系统中都存在。如果您在主数据库上创建表空间，但因为容器不可导致备用数据库上的日志重放失败，主数据库将收不到备备日志重放失败的错误消息，且未来对该表空间的所有写入都无法再次在备用数据库上重放。完全支持自动存储数据库，包括\
  \ `ALTER STOGROUP`、`RENAME STOGROUP`、`DROP STOGROUP` 以及已弃用的 `ALTER DATABASE` 语句的复制。与表空间容器类似，指定的存储路径必须在主、备用服务器上都存在。\n\
  \n此外，一旦建立了 HADR 环境，将适用以下限制：\n\n*   自调优内存管理器 (`STMM`) 只能在当前主数据库上运行。\n*   无法在备用数据库上执行备份操作。\n\
  *   不支持重定向还原。也就是说，HADR 不支持重定向表空间容器。但是，支持数据库目录和日志目录的变化。\n*   不支持指定 `COPY NO` 选项的加载操作。\n\
  *   非日志操作（例如数据库配置参数和恢复历史文件的更改）不会复制到备用服务器。\n*   除非您启用了 ROS 功能，否则客户端无法连接到备用数据库。\n\
  *   HADR 不支持无限日志，也不完全支持联邦服务器。\n\n表 7.3 显示了不同 DB2 版本层级的 HADR 特性及其同步模式支持（如有）。\n\n\
  ![Image](img/779-1.jpg)\n\n## 在备用库上读取（Read on Standby）功能\n\n从 DB2 9.7 开始，您可以使用 ROS\
  \ 能力在 HADR 解决方案的备用服务器上卸载只读操作，而不会影响日志传输过程。该功能通过利用备用系统资源处理实际的只读业务处理，并为主系统释放额外工作负载，从而降低\
  \ HADR 解决方案的总拥有成本 (TCO)。\n\nROS 功能支持所有的种 HADR 同步模式（`SYNC`、`NEARSYNC`、`ASYNC` 和 `SUPERASYNC`）。\n\
  \n# 启用 ROS 功能\n\n通过将 DB2 实例级注册变量 `DB2_HADR_ROS` 设置为 `ON` 并随后重启备用实例，可以在 HADR 备用数据库上启用\
  \ ROS：\n\n![Image](img/779-2.jpg)\n\n# 活动备用数据库的数据并发\n\n活动备用数据库支持的唯一隔离级别是未提交读 (`UR`)。任何请求超过\
  \ UR 限制的应用程序都将收到 `SQL1773N` 原因代码 = 1 的错误。\n\n\n\n\n您可以通过使用显式语句隔离或将 DB2 实例级注册表项 `DB2_STANDBY_ISO`\
  \ 设置为 `UR` 来避免出现此消息。\n\n# 激活备用数据库上的重放专用窗口\n\n当 HADR 激活备用数据库正在重放 DDL 日记录或执行 `REORG`\
  \ 等维护操作时，备用数据库将进入重放专用窗口。当备用数据库处于重放专用窗口时，所有现有连接都将被终止，且新连接会被阻塞并返回原因代码 `SQL1776N` 值为\
  \ 4。\n\n您可以使用 `db2pd` 命令检查重放专用窗口状态和开始时间。以下代码段显示了命令输出：\n\n![Image](img/780.jpg)\n\
  \n![Image](img/781.jpg)\n\n## 备用读限制\n\n如名所示，HADR ROS 特性允许您在 HADR 激活备用数据库上运行只读负载。除了只读限制外，如表\
  \ 7.4 所示，在围绕 ROS 功能设计解决方案之前，还需要注意其局限性。\n\n| **表 7.4: HADR ROS 限制** |\n| **ROS 限制**\
  \ | **SQL 错误代码** |\n| ROS 数据库不支持写操作。 | `SQL1773N` 原因代码 5 |\n| 备用数据库在重放专用窗口期间无法访问，这意味着用户连接在主数据库进行\
  \ DDL 更改和维护操作期间会被终止。 | `SQL1776N` 原因代码 4 |\n| 数据读取操作仅支持的隔离级别为未提交读 (UR)；其他隔离级别的操作将接收错误消息。\
  \ | `SQL1773N` 原因代码 1 |\n| 备用数据库不支持声明式临时表 (DGTTs)。 | `SQL1773N` 原因代码 4 |\n| 不支持从激活备用数据库访问创建全局临时表\
  \ (CGTTs)，任何此类尝试都将接收错误消息。 | `SQL1773N` 原因代码 4 |\n| 使用“初始不记录日志 (NLI)”创建的表无法从激活备用数据库访问，任何访问此类表的尝试都将接收错误消息。\
  \ | `SQL1477N` |\n| 备用数据库上的查询只能使用 SMS 系统临时表空间；如果您在主数据库中仅创建了 DMS 系统临时表空间，请确保为备用数据库创建一个\
  \ SMS 系统临时表空间——否则，应用程序将接收错误消息。 | `SQL1773N` 原因代码 5 |\n| 激活备用数据库不支持解释工具。 | `SQL1773N`\
  \ 原因代码 5 |\n| 不支持自调内存管理器。 | 不适用 |\n| 激活备用数据库无法参与联邦服务器设置。 | 不适用 |\n| 不支持数据库备份和静止操作。\
  \ | 不适用 |\n\n# HADR 多备用库\n\n从 DB2 10.1 开始，HADR 为单数据库多站点数据复制解决方案提供了本地高可用性与远程灾难恢复的结合方案。此外，通过将多备用库设置与新的\
  \ HADR 增强功能、日志缓冲和延迟重放相结合，可以从任何错误事务中快速恢复。\n\n要启用 HADR 多备用库设置，您需要使用新的数据库配置参数 `HADR_TARGET_LIST`\
  \ 配合传统的 HADR 参数。主数据库上此参数指定的条目数决定了设置中主数据库的备用库数量。在 DB2 10.1 中，支持的备用库数量为三个：一个主备用库和两个辅助数据库。\n\
  \n所有传统的 HADR 特性和功能也适用于多备用库；例如，可以在任何备用库上启用 ROS，并且任何备用库都可以通过优雅或强制手动接管成为 HADR 主库。请记住，多平台\
  \ Tivoli 系统自动化 (TSA MP) 自动接管仅发生在主库和主备用库之间。\n\nHADR 提供了四种事务日志传输同步模式，以平衡性能和数据保护。表\
  \ 7.5 列出了有关同步模式、性能和数据保护级别的信息。\n\n![Image](img/782.jpg)\n\n您可以在表 7.6 中查看主备用数据库与辅助备用数据库之间的相似与不同之处。\n\
  \n| **表 7.6: HADR 主备用数据库与辅助备用数据库** |\n| **主备用库** | **辅助备用库** |\n| 支持 ROS 特性 | 支持\
  \ ROS 特性 |\n| 只能有一个备用数据库可以作为主备用库 | 最多有两个备用数据库可以作为辅助备用库 |\n| 通过 TCP/IP 直接连接进行同步 |\
  \ 通过 TCP/IP 直接连接进行同步 |\n| 支持时间延迟日志传输 | 支持时间延迟日志传输 |\n| 支持 TSA MP 自动故障转移 | 仅支持手动故障转移\n\
  | 支持所有四种同步模式 | 仅支持 SUPERASYNC 同步模式\n\n# 设置 HADR 多备用库环境\n\n设置 HADR 环境的过程非常简单。在确保您打算作为主服务器和备用服务器的系统是相同的，并且它们之间存在\
  \ TCP/IP 连接后，您只需按照以下顺序执行相应任务。\n\n**步骤 1：** 确定主数据库和备用数据库服务器的主机名、主机 IP 地址以及服务名称或端口号。\n\
  \n如果服务器具有多个网络接口，请确保 HADR 主机名或 IP 地址映射到预期的接口。\n\n**步骤 2：** 通过恢复备份映像或初始化作为主库的拆分镜像来创建主备用库和辅助备用库。\n\
  \n建议在恢复操作或拆分镜像后不在备用数据库上执行 `ROLLFORWARD DATABASE` 命令。使用 HADR 在备用数据库上重放日志的结果与执行重滚操作略有不同。如果启动\
  \ HADR 时主备数据库不一致，会导致错误。\n\n使用 `RESTORE DATABASE` 命令设置备用数据库时，建议使用 `REPLACE HISTORY\
  \ FILE` 选项——避免使用以下选项：`TABLESPACE`、`INTO`、`REDIRECT` 和 `WITHOUT ROLLING FORWARD`。\n\
  \n使用 `db2idb` 工具设置备用数据库时，不要使用 `SNAPSHOT` 或 `MIRROR` 选项。可以使用 `RELOCATE USING` 选项来更改以下配置属性：实例名称、日志路径或数据库路径。但是，不能更改数据库名称或表空间容器路径。\n\
  \n**步骤 3：** 在主数据库、主备用数据库和辅助备用数据库上设置 HADR 配置参数。\n\n在创建备用数据库后，必须在启动 HADR 之前设置表 7.7\
  \ 中列出的 HADR 配置参数。\n\n\n\n\n| `HADR_TIMEOUT` | 指定 HADR 进程在认为通信尝试失败之前等待的时间（秒）。 |\n\
  | `HADR_TARGET_LIST` | 指定多备用机 HADR 设置中所有备用机的主机名和端口名。您在参数中指定的第一个备用机被视为主 HADR 备用数据库。\
  \ |\n| `HADR_SYNCMODE` | 指定用于 HADR 的同步模式。 |\n| `HADR_SPOOL_LIMIT` | 指定当日志接收缓冲区（`DB2_HADR_BUF_SIZE`）填满时，溢存（spooled）或写入磁盘的量限制。默认值为\
  \ 0，表示不进行溢存；值 -1 表示无限制溢存。 |\n| `HADR_REPLAY_DELAY` | 指定延迟重放的时间（秒），以使备用数据库保持在早于主数据库的时间点。您只能在处于\
  \ `SUPERASYNC`（超异步）同步模式的备用数据库上设置此参数。 |\n| `HADR_PEER_WINDOW` | 指定主数据库与其主备用数据库之间连接的对等窗口（peer\
  \ window）。对等窗口不适用于辅助备用数据库，因为它们始终处于 `SUPERASYNC` 模式。 |\n\n图 7.28 显示了演示设置，其中主机 `dbserver1`\
  \ 是数据中心 1 的数据库服务器，主机 `dbserver2` 是数据中心 2 的备用数据库服务器，主机 `dbserver3` 是数据中心 3 的辅助备用数据库服务器。\n\
  \n![Image](img/785-1.jpg)\n\n*图 7.28：HADR 多备用机设置*\n\n表 7.8 列出了相应的主机名、实例名、端口号和其他\
  \ HADR 参数信息。\n\n![Image](img/785-2.jpg)\n\n使用以下命令开始配置备用数据库，然后是主数据库。在主备用机上，`HADR_TARGET_LIST`\
  \ 命令的第一个条目始终是主服务器及其端口号。\n\n![Image](img/786-1.jpg)\n\n在辅助备用机上，`HADR_TARGET_LIST`\
  \ 命令的第一个条目始终为主备用机，然后是主服务器，最后是辅助备用机（如果有）。\n\n![Image](img/786-2.jpg)\n\n在主数据库上，`HADR_TARGET_LIST`\
  \ 命令的第一个条目始终是主备用机，然后是辅助备用机。\n\n![Image](img/786-787.jpg)\n\n### 步骤 4：连接到备用实例并在主备用和辅助备用数据库上启动\
  \ HADR。\n\n要启动 HADR，您需要执行 `START HADR` 命令。该命令的基本语法如下：\n\n![Image](img/787-1.jpg)\n\
  \n| where: | |\n| :--- | --- |\n| `DatabaseAlias` | 指定分配给要启动 HADR 的数据库别名。 |\n| `UserName`\
  \ | 指定分配给启动 HADR 的特定用户的名称。 |\n| `Password` | 指定与启动 HADR 的用户名称对应的密码。 |\n\n因此，如果您想在名为\
  \ `DB210DB` 的数据库上启动 HADR 并指定其作为备用数据库，可以执行如下所示的 `START HADR` 命令：\n\n![Image](img/787-2.jpg)\n\
  \n### 步骤 5：连接到主实例并在主数据库上启动 HADR。\n\n在这种情况下，您将执行如下所示的 `START HADR` 命令：\n\n![Image](img/787-3.jpg)\n\
  \n您还可以使用 IBM Data Studio HADR 设置向导设置 HADR 环境。要激活此向导，右键点击数据库并选择 **Set Up and Configure**（设置和配置）操作，如图\
  \ 7.29 所示。\n\n![Image](img/788.jpg)\n\n*图 7.29：在 Data Studio 中调用设置 HADR 数据库向导*\n\
  \n一旦建立了 HADR 环境，当在主数据库上执行以下操作时，它们将在备用数据库中自动复制：\n\n*   执行 DDL 语句（`CREATE`、`ALTER`、`DROP`）\n\
  *   执行 DML 语句（`INSERT`、`UPDATE`、`DELETE`）\n*   缓冲池操作\n*   表空间操作\n*   在线重组\n*   离线重组\n\
  *   存储过程和 UDF 的元数据更改\n\nHADR 不复制存储过程和 UDF 对象以及库文件。如果需要此类复制，您必须在主数据库和备用数据库的相同路径上物理地创建这些文件。如果备用数据库无法找到引用的对象或库文件，则存储过程或\
  \ UDF 的调用将在备用数据库上失败。\n\n非日志记录操作（例如对数据库配置参数和恢复历史文件的更改）不会复制到备用数据库。\n\n![Image](img/note.jpg)\n\
  \n**注意：** 您可以使用 `db2pd -db <dbname> -hadr` 或 `MON_GET_HADR` 表函数来监控 HADR 状态。由于使用了\
  \ `SUPERASYNC` 同步模式，辅助备用数据库始终处于 `REMOTE_CATCHUP` 状态。\n\n![Image](img/789.jpg)\n\n\
  # 加载操作与 HADR\n\n加载操作为 HADR 带来了特殊问题。由于加载操作未记录在数据库的日志文件中，加载操作是否可以被复制取决于加载数据的副本是否已作为加载过程的一部分被保存（如果指定了\
  \ `COPY YES` 则是如此）。如果在主数据库上执行加载操作时指定了 `COPY YES`，则命令将在主数据库上执行，数据将复制到备用数据库——前提是备用数据库可以访问加载副本镜像。如果备用数据库无法访问加载镜像，则存储该表的表空间在备用数据库上被标记为无效，且备用数据库将停止重放与该表空间相关的日志记录。\n\
  \n为了确保加载操作可以访问备用数据库上的副本，建议使用共享位置存储加载副本镜像。或者，您可以在执行加载操作时停用备用数据库，在主数据库上执行加载操作，将生成文件的副本置于备用路径中，然后激活备用数据库。\n\
  \n如果您在主数据库上执行加载操作并指定 `NONRECOVERABLE` 选项，数据将将加载到主数据库的相应表中，备用数据库上的相应表将被标记为无效，且备用数据库将停止重放与该表相关的日志记录。您可以重新执行指定了\
  \ `COPY YES` 和 `REPLACE` 选项的 `LOAD` 命令来恢复备用数据库上的表，或者可以删除该表并恢复空间。\n\n由于 HADR 不支持执行指定了\
  \ `COPY NO` 选项的加载操作，尝试执行此类操作会自动转换为表现为指定了 `NONRECOVERABLE` 选项的加载操作。为了防止这种行为，您可以在主数据库上将\
  \ `DB2_LOAD_COPY_NO_OVERRIDE` 注册表变量设置为 `COPY YES`，这样所有执行的操作将表现得像指定了 `COPY YES` 选项一样。在设置此变量时，请确保您在主数据库上指定的设备或目录备用数据库可以通过相同的路径、设备或加载库进行访问。\n\
  \n在 HADR 环境中对主数据库的加载操作会对索引以及表和表空间产生影响。如果您在主数据库上执行加载操作并指定 `COPY YES` 选项，受影响的索引将按如下方式复制：\n\
  \n\n\n\n\n*   如果您将索引模式设置为 `REBUILD` 并为正在加载的表分配 `LOG INDEX BUILD` 属性，或者你为正在加载的表分配\
  \ `DEFAULT` 属性并将主数据库上的 `logindexbuild` 数据库配置参数设置为 `ON`，则主数据库将把重建的索引对象包含在复制文件中，以便备用数据库复制该索引对象。如果在执行加载操作之前，备用数据库上的索引对象被标记为无效，则在执行加载操作后由于索引重建，它将重新变得可用。\n\
  \n*   如果您将索引模式设置为 `INCREMENTAL` 并为正在加载的表分配 `LOG INDEX BUILD` 属性，或者你为正在加载的表分配 `NULL`\
  \ 属性并将主数据库上的 `logindexbuild` 数据库配置参数设置为 `ON`，则只有在加载操作前索引对象未被标记为无效时，备用数据库上的索引对象才会更新。否则，备用数据库上的索引将被标记为无效。\n\
  \n*   IBM 建议您为 HADR 数据库将 `logindexbuild` 数据库配置参数设置为 `ON`，以确保为索引创建、重建和重组记录完整信息。尽管这意味着在主系统上的索引构建可能会花费更长时间，并且可能需要更多的日志空间，但在\
  \ HADR 日志重放期间，索引将在备用系统上重建，并在发生故障转移时可用。如果主系统上的索引操作没有记录，并且发生了故障转移，则故障转移完成后任何的无效索引都必须在访问之前重新重建——在重建索引期间，任何应用程序都无法访问它们。\n\
  \n# 关于 DB2 HA 实例配置工具 (db2haicu) 的说明\n\nDB2 高可用性实例配置工具 (`db2haicu`) 是一个交互式、基于文本的工具，您用于在集群环境中配置和管理高可用数据库。该工具使用\
  \ TSA MP 集群管理器来配置共享数据库实例。\n\n该工具将数据库实例、集群环境和集群管理器作为输入，然后为实例进行高可用故障转移的配置。输入可以通过交互模式提供，也可以通过使用\
  \ XML 输入文件提供。`db2haicu` 的所有参数均对大小写敏感，且必须使用小写字母。基本语法为：\n\n![Image](img/791.jpg)\n\
  \n| 其中 | |\n| :--- | :--- |\n| `XML-input-file` | 指定输入到 `db2haicu` 命令的 XML 文件中的集群域详情\
  \ |\n| `-disable` | 停止数据库管理器实例的高可用性；要重新配置已停止的数据库管理器实例以高可用，您必须重新运行 `db2haicu` 工具\
  \ |\n| `-delete` | 删除当前数据库管理器实例中的资源组；要将删除限制为数据库分区分区功能实例中的特定分区组，请使用 `dbpartitionnum`\
  \ `dbpartnum-list` 子句；要删除 HADR 数据库的资源组，请使用 `hadrdb` `dbname` 子句 |\n\n# DB2 pureScale——概述\n\
  \npureScale 是 DB2 9.8 的一项功能，提供可扩展的活动/活动配置，为任何业务关键系统透明地提供高吞吐量和连续可用性。从架构角度来看，DB2 pureScale\
  \ 利用了 1990 年代初引入的 DB2 z/OS sysplex 架构和设计原则。\n\n图 7.30 显示了 pureScale 组件，这些组件大致分为：\n\
  \n*   DB2 成员 (members)\n*   集群缓存设施 (CF)\n*   共享存储\n*   集群服务和互连网络\n\n![Image](img/792.jpg)\n\
  \n*图 7.30: DB2 pureScale 组件*\n\nDB2 成员是 pureScale 集群内的核心处理引擎。您可以将其安装在物理主机、物理机器的逻辑分区\
  \ (LPAR) 或虚拟机上。每个数据库成员都有一个定义定义的主机（home host），并且仅允许在主主机上接受客户端连接。如果主主机无法正常工作，则数据库成员将失败并在客机主机（集群中的其他成员主机）上以\
  \ `restart light`（轻量级重启）模式启动，以完成成员的崩溃恢复。此活动将完成未提交更改的回滚，并释放由故障成员所持有的锁。\n\nDB2 成员可以处于以下状态之一：\n\
  \n*   `STARTED`：成员在主主机上启动并正常运行。\n*   `STOPPED`：成员已被管理员停止。\n*   `RESTARTING`：成员在主主机或客机主机上执行崩溃恢复后正在启动。\n\
  *   `WAITING_FOR_FAILBACK`：成员在客机主机上以轻量级重启模式运行，并等待切换回主主机以恢复正常运行。在此状态下，成员不会接受任何客户端连接。\n\
  *   `ERROR`：成员无法在主主机或客机主机上启动，需要管理员注意解决问题。\n\npureScale 集群利用集群缓存设施 (CF) 的概念促进其多个数据库成员之间的数据共享和并发控制。CF\
  \ 是由 DB2 集群服务管理的软件应用程序，用于通过全局锁管理器 (GLM) 实现集中式锁定协调，并通过全局缓冲区池 (GBP) 实现集中式页面缓存。最少，pureScale\
  \ 环境需要一个 CF；然而，配置为为主和备备的两个 CF 将消除单点故障。GLM 的功能是通过物理锁防止多个多个成员对同一对象数据进行冲突访问。DB2 成员持有物理锁，而成员内部的事务持有逻辑锁。\n\
  \n本地锁管理器 (LLM) 是每个 DB2 成员内部的锁管理器，它在向事务授予逻辑锁之前，会向 GLM 请求物理锁。全局锁列表 (GLL) 的作用是跟踪由各个\
  \ LLM 发起的锁请求。\n\n通过使用 GBP，DB2 数据库管理器保持所有成员之间页面缓存的一致，并协调存在于成员本地缓冲区池 (LBP) 中的页面副本。\n\
  \nCF 可以处于以下状态之一：\n\n*   `PRIMARY`：CF 作为主节点正常运行。\n*   `PEER`：这是备用 CF，在当前主 CF 发生故障时准备好接\
  \ own 主节点。\n*   `STOPPED`：CF 已被管理员停止。\n*   `RESTARTING`：CF 由于执行 `db2start` 命令或发生故障后正在重启。\n\
  *   `BECOMING_PRIMARY`：如果 pureScale 集群中没有其他主 CF 在运行，则该 CF 将接管主 CF 角色。\n*   `CATCHUP`：这是非主\
  \ CF 在复制所有相关信息（包括 GBP、GLL）并达到 `PEER` 状态之前的中间状态。\n*   `ERROR`：CF 无法在实例上的任何主机上启动，需要管理员注意解决问题。\n\
  \n正如您可能已经知到的，DB2 pureScale 集群运行在共享磁盘架构上。磁盘系统被 pureScale 集群内的所有成员访问；因此，该系统必须允许所有成员的并发读写操作。为了维护数据文件的完整性和一致性，pureScale\
  \ 实现使用了名为 IBM 通并行文件系统 (GPFS) 的集群文件系统。\n\n为了支持快速通信，DB2 成员、CF 和存储通过名为 Infiniband 的高速互连网络连接，该网络支持远程内存访问\
  \ (RDMA) 和用户直接访问编程库 (uDAPL)。\n\n![Image](img/note.jpg)\n\n注意：DB2 pureScale 功能支持在\
  \ AIX、SUSE 和 Red Hat Linux 操作系统上的 Power 6、Power 7、System X (x3650 M3, x3690 X5,\
  \ x3850 X5) 以及 BladeCenter HS22 服务器。\n\n\n\n\n\n# 与 pureScale 集群工作\n\n现在你已经了解了 DB2\
  \ pureScale 集群的组件，了解用于操作 pureScale 环境的基本命令和实用程序也同样重要。这些命令分为三类：\n\n* 操作\n* 维护\n*\
  \ 监控\n\n## 操作\n\n`表 7.9` 提供了基本 pureScale 操作能力及相关命令的快速概览。\n\n**表 7.9：pureScale 操作命令**\n\
  \n| 操作元素 | 命令、管理视图或表函数 |\n| :--- | :--- |\n| 查询集群状态 | `db2instance –list` |\n| 启动\
  \ CF | `db2start cf *[cf-identifier]*` 其中*[cf-identifier]* 为 CF 的标识符 |\n| 停止 CF\
  \ | `db2stop cf *[cf-identifier]*` 其中*[cf-identifier]* 为 CF 的标识符 |\n| 查询 CF 状态 |\
  \ `SYSIBMADM.DB2_CF` 管理视图 `DB2_GET_INSTANCE_INFO` 表函数 |\n| 启动 DB2 成员 | `db2start\
  \ member *[member-identifier]*` 其中*[member-identifier]* 为成员的标识符 |\n| 停止 DB2 成员 |\
  \ `db2stop member *[member-identifier]*` 其中*[member-identifier]* 为成员的标识符 |\n| 查询成员状态\
  \ | `SYSIBMADM.DB2_MEMBER` 管理视图 |\n| 激活数据库 | `ACTIVATE DATABASE *[dbname]*` 其中*[dbname]*\
  \ 为要激活的数据库 |\n| 取消激活数据库 | `DEACTIVATE DATABASE *[dbname]*` 其中*[dbname]* 为要取消激活的数据库\
  \ |\n| 挂置 DB2 成员 | `db2stop member *[member-identifier]* quiesce` 其中*[member-identifier]*\
  \ 为成员的标识符 |\n| 取消挂置 DB2 成员 | `db2start member *[member-identifier]* quiesce` 其中*[member-identifier]*\
  \ 为成员的标识符 |\n| 挂置数据库 | `QUIESCE DATABASE` |\n| 取消挂置数据库 | `UNQUIESCE DATABASE` |\n\
  | 挂置实例 | `QUIESCE INSTANCE *[instance-name]*` 其中*[instance-name]* 为要挂置的实例 |\n| 取消挂置实例\
  \ | `UNQUIESCE INSTANCE *[instance-name]*` 其中*[instance-name]* 为要取消挂置的实例 |\n| 获取\
  \ CF 系统资源信息 | `SELECT * FROM SYSIBMADM.ENV_CF_RESOURCES;` |\n| 获取集群主机信息 | `SELECT\
  \ * FROM SYSIBMADM.DB2_CLUSTER_HOST_STATE;` 和 `SELECT * FROM TABLE(DB2_GET_CLUSTER_HOST_STATE(hostname))\
  \ as T`\n\n## 维护\n\n`表 7.10` 提供了基本 pureScale 维护能力及相关命令的快速概览。\n\n**表 7.10：pureScale\
  \ 维护命令**\n\n| 维护元素 | 命令、管理视图或表函数 |\n| :--- | :--- |\n| 添加 DB2 成员 | `db2iupdt –add\
  \ –m [hostname] –mnet [netname] [instance-name]` |\n| 移除 DB2 成员 | `db2iupdt –drop\
  \ –m [hostname] [instance-name]` |\n| 添加 CF 服务器 | `db2iupdt –add –cf [hostname]\
  \ –cfnet [netname] [instance-name]` |\n| 移除 CF 服务器 | `db2iupdt –drop –cf [hostname]\
  \ [instance-name]` |\n| 将 DB2 成员主机置维护模式 | 1. `db2stop member [member-identifier]\
  \ quiesce` 2. `db2stop instance on [hostname]` 3. `db2cluster –cm –enter –maintenance`\
  \ 4. `db2cluster –cfs –enter –maintenance` |\n| 从 DB2 成员恢复维护模式 | 1. `db2cluster\
  \ –cm –exit –maintenance` 2. `db2cluster –cfs –exit –maintenance` 3. `db2start instance\
  \ on [hostname]` 4. `db2start member [member-identifier]` |\n| 将集群置维护模式 | 1. `db2stop\
  \ instance on [hostname]` 2. `db2cluster –cm –enter –maintenance –all` 3. `db2cluster\
  \ –cfs –enter –maintenance –all` 4. `db2start instance on [hostname]` 5. `db2start`\
  \ |\n| 数据库备份 | `BACKUP DATABASE *[dbname]*` |\n| 数据库恢复 | `RESTORE DATABASE *[dbname]*`\
  \ |\n\n## 监控\n\n`表 7.11` 提供了基本 pureScale 监控能力及相关命令的快速概览。\n\n**表 7.11：pureScale 监控命令**\n\
  \n| 监控元素 | 命令、管理视图或表函数 |\n| :--- | :--- |\n| 获取所有数据和索引页的 GBP 命中率 | `WITH GBP AS(SELECT\
  \ BP_NAME,POOL_DATA_GBP_L_READS+POOL_INDEX_GBP_L_READS AS LOGICAL_READS,POOL_DATA_GBP_P_READS+POOL_INDEX_GBP_P_READS\
  \ AS PHYSICAL_READS, MEMBER FROM TABLE(MON_GET_BUFFERPOOL(‘,-2)) AS METRICS)SELECT\
  \ VARCHAR(BP_NAME,20) AS BP_NAME, LOGICAL_READS, PHYSICAL_READS, CASE WHEN LOGICAL_READS\
  \ > 0 THEN DEC(((LOGICAL_READS)/(PHYSICAL_READS))*100,5)ELSE NULL END AS HIT_RATIO,\
  \ MEMBER FROM GBP` |\n| 确定一个或多个的性能 | `SELECT MEMBER,APPLICATION_HANDLE, TOTAL_SORTS,COMPILE_TIME,TOTAL_CPU_TIME,TOTAL_WAIT_TIME,ROWS_READ,ROWS_RETURNED,TCPIP_SEND_VOLUME\
  \ FROM TABLE(CAST(NULL AS integer)) ) AS BY MEMBER` |\n| 确定每个连接的锁性能 | `SELECT MEMBER,SUM(ESCALS_GLOBAL)\
  \ AS ESCALS,SUM(TIMEOUTS_GLOBAL) AS TIMEOUTS,SUM(WAIT_TIME) AS WAIT ) BY CFID` |\n\
  \n## 章节总结\n\n全球的数据库和操作系统管理员每天都在执行大量的高可用性任务。然而，要成功管理系统，深入了解这些功能是必要的。本章的目标是让你熟悉以下内容：\n\
  \n* 各种日志功能\n* 各种数据库恢复类型\n* 备份分类及其用途\n* HADR 特性及实现\n* 多备用节点的 HADR 实现技术\n* DB2 pureScale\
  \ 体系和基本操作\n\n完成本章后，你将具备回答认证考试中可用性问题的知识。同时也建议你完成练习题。\n\n## 练习题\n\n**问题 1**\n\n使用哪个命令可以为名为\
