  | ![images](img/circ.jpg) | B. | 你可以在表上创建触发器。 |\n| ![images](img/circ.jpg) | C.\
  \ | 你可以在只读视图上创建触发器。 |\n| ![images](img/circ.jpg) | D. | 你可以在表的多个列上创建触发器。 |\n\n##\
  \ 第 23 \n\n可以使用哪种语句修改触发器定义？\n\n| ![images](img/circ.jpg) | A. | `UPDATE TRIGGER`\
  \ |\n| ![images](img/circ.jpg) | B. | `MODIFY TRIGGER` |\n| ![images](img/circ.jpg)\
  \ | C. | `CREATE OR REPLACE` |\n| ![images](img/circ.jpg) | D. | `ALTER TRIGGER`\
  \ |\n\n## 第 24 \n\n考虑以下语句：\n\n![Image](img/381.jpg)\n\n哪条 `INSERT` 语句会失败？\n\n| ![images](img/circ.jpg)\
  \ | A. | `INSERT INTO v1 (10);` |\n| ![images](img/circ.jpg) | B. | `INSERT INTO\
  \ v2 (5);` |\n| ![images](img/circ.jpg) | C. | `INSERT INTO v3 (50);` |\n| ![images](img/circ.jpg)\
  \ | D. | `INSERT INTO v3 (100);` |\n\n## 第 25 \n\n关于 `SET INTEGRITY` 异常表的哪个陈述是错误的？\n\
  \n| ![images](img/circ.jpg) | A. | 异常表的定义必须与完整性表的定义匹配。 |\n| ![images](img/circ.jpg)\
  \ | B. | 异常表可以有两个额外的列：一个是 `TIMESTAMP`，另一个是 `CLOB` (32 KB)。 |\n| ![images](img/circ.jpg)\
  \ | C. | 异常表也定义与完整性表类似的约束。 |\n| ![images](img/circ.jpg) | D. | 异常表不能创建为范围分区或范围聚集表。\
  \ |\n\n## 第 26 \n\n哪些项可以被外键约束引用？（选择两个。）\n\n| ![images](img/box.jpg) | A. | 主键约束\
  \ |\n| ![images](img/box.jpg) | B. | Identity 列 |\n| ![images](img/box.jpg) | C.\
  \ | `CHECK` 约束 |\n\n\n\n\n\n| ![images](img/box.jpg) | D. | UNIQUE 约束 |\n| ![images](img/box.jpg)\
  \ | E. | NOT NULL 约束 |\n\n# 答案\n\n### 问题 1\n正确答案是 **A.** 与其他约束不同，信息性约束（informational\
  \ constraints）在插入和更新处理过程中不会强制执行。然而，DB2 SQL 优化器在考虑用于解析查询的最优访问计划时，会评估信息性约束提供的信息。因此，尽管约束本身不会被用于验证数据输入或修改，但信息性约束可能会带来更な查询性能。（你可以通过在普通约束定义末尾附加\
  \ `NOT ENFORCED ENABLE QUERY OPTIMIZATION` 关键字来定义信息性约束。）\n\n### 问题 2\n正确答案是 **D.**\
  \ 默认情况下，添加到基表中的记录可以对任何列以任意次数地分配相同的值。你可以使用 `UNIQUE` 约束来确保在向基表添加记录时，分配给一个或多个列的值始终是唯一的。一旦你为一个或多个列定义了\
  \ `UNIQUE` 约束，任何尝试在这些列中放置重复值的操作都将失败。`UNIQUE` 约束通常在创建表过程中定义，但也可以后通过 `ALTER TABLE`\
  \ SQL 语句添加。\n\n当定义 `UNIQUE` 约束时，DB2 数据库管理器会确定 `UNIQUE` 约束所引用列的索引是否已经存在。如果是，该索引将被标记为唯一且系统强制。如果不是，则创建一个适当的索引并将其标记为唯一且系统强制。每当向定义了\
  \ `UNIQUE` 约束的列中添加新记录时，该索引将用于强制执行唯一性。\n\n虽然使用了唯一的、系统强制的索引来执行 `UNIQUE` 约束，但定义 `UNIQUE`\
  \ 约束和创建唯一索引之间存在区别。两者都强制执行唯一性，但唯一索引允许 `NULL` 值，并且通常不能用于引用约束。然而，`UNIQUE` 约束不允许 `NULL`\
  \ 值，并且可以在外键规范中被引用。\n\n### 问题 3\n正确答案是 **B.** 第一条 `INSERT` 语句将失败，因为产生的 `SELLPRICE`\
  \ 将为 0（因为没有提供值），而 0 的 `SELLPRICE` 小于 6.99 的 `BUYPRICE`，这违反了 `ZEROLOSS CHECK` 约束。第三条\
  \ `INSERT` 语句将失败，因为 `CATEGORY` ‘423’ 不在 `CATEGORY` 列允许的值集内。此外，产生的 `SELLPRICE` 和\
  \ `BUYPRICE` 将为 0（因为没有提供值），且 0 的 `SELLPRICE` 不大于 0 的 `BUYPRICE`，这违反了 `ZEROLOSS CHECK`\
  \ 约束。最后，最后一个 `INSERT` 语句将失败，因为 20.00 的 `SELLPRICE` 小于 25.65 的 `BUYPRICE`，这违反了 `ZEROLOSS\
  \ CHECK` 约束。\n\n### 问题 4\n正确答案是 **C.** 要指示 DB2 优化器在选择解析查询的最佳数据访问计划时忽略信息性约束，只需禁用该约束的查询优化。你可以在创建约束时这样做，也可以以后通过执行\
  \ `ALTER TABLE` 语句、识别要修改的约束并指定 `DISABLE QUERY OPTIMIZATION` 选项。\n\n### 问题 5\n正确答案是\
  \ **D.** 由于 DB2 优化器在选择解析查询的最优访问计划时会评估信息性约束，插入到表中违反一个或多个信息性约束的记录可能不会被某些查询返回。因此，如果你对所示\
  \ `EMPLOYEE` 表执行查询 `SELECT * FROM employee WHERE gender = ‘U'`，将不会返回任何记录，因为所选的访问计划将假设表中不存在\
  \ `GENDER` 值除 ‘M’ 或 ‘F’ 以外的记录。\n\n### 问题 6\n正确答案是 **D.** 如果你在 `CREATE VIEW` SQL\
  \ 语句中指定了 `WITH LOCAL CHECK OPTION` 子句（或在“创建视图”对话框中选择“本地检查”选项），则对所创建视图执行的插入和更新操作将通过验证，以确保插入或更新到视图引用的基表中的所有行都符合视图的定义（否则，插入/更新操作将失败）。那么这到底意味着什么？假设你使用以下\
  \ `CREATE VIEW` 语句创建了一个视图：\n\n![Image](img/383.jpg)\n\n现在，假设用户尝试向此视图插入一条 `RESPONSE_TIME`\
  \ 值为 6 的记录。插入操作将失败，因为该记录违反了视图的定义。如果创建视图时没有使用 `WITH LOCAL CHECK OPTION` 子句，则插入操作将成功，尽管新记录对用于添加它的视图是不可见的。\n\
  \n### 问题 7\n正确答案是 **C.** 如果你不希望恢复失效的视图，可以使用 `DROP VIEW` 语句显式地删除它。或者，你可以创建一个新视图并赋予它与失效视图相同的名称，但给它不同的定义。\n\
  \n### 问题 8\n正确答案是 **C.** 当执行 `CREATE INDEX` 语句时指定了 `UNIQUE` 子句，则与要创建的索引相关的表中的行在构成索引键列集中不能两次或多次出现相同的值。如果要创建索引的基表包含数据，则会在\
  \ DB2 数据库管理器尝试创建指定的索引时检查这种唯一性——如果发现索引键具有重复值的记录，则不会创建索引。如果没有发现重复项，则创建索引，并在每次对表执行插入或更新操作时强制执行唯一性。\n\
  \n在此示例中，当执行 `CREATE INDEX` 语句时发现了重复的 `SALES_REP_ID` 编号，因此语句失败，下一次插入操作成功，表中的总行数增加到\
  \ 5。\n\n### 问题 9\n正确答案是 **A.** 你只能使用系统目录获取有关特定数据库的信息。如果你想获取系统级的信息，必须诉助于执行管理命令或查询管理视图。例如，要获取已安装在特定服务器上的\
  \ DB2 产品信息，必须执行系统命令 `db2ls –q -a`（如果你在 Linux 或 UNIX 服务器上）。\n\n### 问题 10\n正确答案是 **A.**\
  \ 每当创建、修改或删除对象时，DB2 都会在目录中插入、更新或删除描述该对象以及该对象与其他对象关系的记录。因此，为了获取特定数据库的信息，通常可以通过连接到该数据库并查询系统目录。例如，假设你想知道名为\
  \ `EMPLOYEES` 的表是否需要重新组织以消除碎片。你可以通过对名为 `SYSCAT.TABLES` 的系统目录表执行查询来实现：\n\n![Image](img/384.jpg)\n\
  \n如果此查询的结果显示 `EMPLOYEES` 表存在大量溢出记录，则数据已碎片化，该表可能需要重新组织。\n\n\n\n\n正确答案是 **B.**。`BEFORE`\
  \ 触发器在更新或插入操作之前激活，被更新或插入的值可以在数据库实际修改表中的数据之前对其进行更改。通常情况下，此触发器用于数据清洗和修改。例如，如果你正在向表中插入行数据，`BEFORE`\
  \ 触发器可以检查数据的完整性，如果数据不符合业务规则，你可以在将其插入表之前对数据进行修改。然而，`BEFORE` 触发器不能将 `delete` 数据作为其触发器操作的一部分。\n\
  \n### 题 13\n正确答案是 **A** 和 **C.**。使用 `SET INTEGRITY` 命令的目的如下：\n\n* 为了临时挂起表的约束检查，并在关闭约束检查期间拒绝对该表的只读访问，你需要执行一条类似于下所示的语句：\n\
  \    ![Image](img/385-1.jpg)\n* 为了恢复已挂起约束检查的表的约束检查，你执行一条类似于下所示的语句：\n    ![Image](img/385-2.jpg)\n\
  * 然而，如果你执行以下形式的 `SET INTEGRITY` 语句，该表将退出“待处理完整性”（Set Integrity Pending）状态，且不执行任何约束检查：\n\
  \    ![Image](img/385-3.jpg)\n* 当你执行另一种使用 `FOR EXCEPTION IN` 子句的 `SET INTEGRITY`\
  \ 命令时，该表将退出“待处理完整性”状态，违反约束的行将被复制到异常表中。该语句类似于下所示：\n    ![Image](img/385-4.jpg)\n\n\
  ### 题 14\n正确答案是 **B.**。当你想更改视图的定义以包含 `WITH CHECK OPTION` 子句时，唯一的方法是使用 `CREATE OR\
  \ REPLACE VIEW` 命令删除并重新创建视图，或者显式地使用 `DROP VIEW` 删除视图并使用 `CREATE VIEW` 命令重新创建。\n\n\
  ### 题 15\n正确答案是 **D.**。`EMPLOYEE` 表有四个约束——三个 `NOT NULL` 约束和一个主键引用的完整性约束。\n\n###\
  \ 题 16\n正确答案是 **A** 和 **E.**。如果你在 `CREATE VIEW` SQL 语句中指定 `WITH LOCAL CHECK OPTION`\
  \ 子句，则对所创建视图执行的插入和更新操作将通过验证，以确保插入或更新到视图所引用的基础表的所有行都符合视图的定义（否则插入/更新操作将失败）。\n\n如果你在\
  \ `CREATE VIEW` SQL 语句中指定 `WITH CASCADED CHECK OPTION` 子句，所创建的视图将继承其所基于的父视图的搜索条件，并将这些条件视为一个或多个约束，用于验证对该视图执行的插入和更新操作。此外，每个使用指定\
  \ `WITH CASCADED CHECK OPTION` 子句创建的子视图，都将继承这些约束；父视图和子视图的搜索条件将组合在一起形成约束。\n\n###\
  \ 题 17\n正确答案是 **C.**。引用完整性确保了用户表之间的关系保持一致性。当一个表具有指向另一个表的外键时，引用完整性的概念规定：除非主表中已存在相应的记录，否则你不能向包含该外键的表中添加记录。它还包括被称为“级联更新”（`cascading\
  \ update`）和“级联删除”（`cascading delete`）的技术，这些技术确保对主表所做的更改会反映在外表中。不能在系统目录表、系统目录视图或用户创建的视图上创建引用约束，而且它们在构建业务逻辑时无法建议如何引用查询。此外，你不能在关系列与\
  \ XML 文档元素之间建立引用约束。\n\n### 题 18\n正确答案是 **D.**。当你创建主键时，DB2 数据库管理器会自动创建一个唯一的双向索引。如果存在适当的唯一索引，则\
  \ DB2 将使用现有的索引并将其标记为系统需要。你可以在一个表中创建一个且仅创建一个主键；然而，主键可以定义多个列。主键不接受 `NULL` 值，但唯一索引可以接受一个\
  \ `NULL` 值。\n\n### 题 19\n正确答案是 **A.**。始终建议运行 `SET INTEGRITY IMMEDIATE CHECK` 命令，以确保多个引用表之间的数据符合业务规则。\n\
  \n### 题 20\n正确答案是 **D.**。数据库管理系统中没有表级触发器。任何触发器都与五个主要组件相关联：\n\n* 主体，即定义触发器的主体——基本上是表或视图\n\
  * 事件，即触发触发器的操作——基本上是插入、更新或删除操作\n* 触发器的激活时间——基本上是事件之前的 `BEFORE` 或之后的 `AFTER`\n* 粒度，指定触发器的操作是针对语句执行一次，还是针对每个受影响的执行一次——基本上是\
  \ `FOR EACH STATEMENT` 或 `FOR EACH ROW` 操作\n* 操作，即触发器执行的操作——基本上是元素之一或多个：\n    *\
  \ `CALL` 语句\n    * `DECLARE` 和/或 `SET` 变量语句\n    * `WHILE` 和/或 `FOR` 循环\n    * `IF`,\
  \ `SIGNAL`, `ITERATE`, `LEAVE` 和 `GET DIAGNOSTIC` 语句\n    * `SELECT` SQL 语句\n  \
  \  * `INSERT`, `UPDATE`, `DELETE` 和 `MERGE` SQL 语句（仅用于 `AFTER` 和 `INSTEAD OF` 触发器）\n\
  \n### 题 21\n正确答案是 **C.**。DB2 提供三种触发器激活时间：\n\n* `AFTER` 触发器\n* `BEFORE` 触发器\n* `INSTEAD\
  \ OF` 触发器\n\n### 题 22\n正确答案是 **A.**。你可以在以下对象上创建触发器：\n\n* 表（`BEFORE` 和 `AFTER` 触发器）；触发器中可以引用多个列\n\
  * 视图（`INSTEAD OF` 触发器）\n\n### 题 23\n正确答案是 **C.**。无法使用任何 `ALTER` 或 `UPDATE` 命令修改触发器定义。要更改它，你需要使用\
  \ `DROP TRIGGER` 命令删除当前触发器，并使用 `CREATE TRIGGER` 命令或 `CREATE OR REPLACE TRIGGER`\
  \ 命令使用新修改的定义创建新触发器。\n\n### 题 24\n正确答案是 **B.**。由于后续 `CREATE VIEW` 语句中的 `WITH CASCADED\
  \ CHECK OPTION` 子句，`INSERT INTO v2 (view)` 命令将失败：\n\n![Image](img/387.jpg)\n\n这意味着该子句将检查当前视图以及父视图中的数据值条件。由于父视图\
  \ `v2` 包含一个 ID 列数据必须始终大于 20 的条件，因此它不允许你向其插入 5。\n\n### 题 25\n正确答案是 **C.**。在创建异常表时，必须遵循某些规则：\n\
  \n* 如果表受安全策略保护，则异常表也必须受相同的安全策略保护。\n* 异常表的前 `n` 列与被检查表的列相同。所有列的属性（包括名称、数据类型和长度）必须一致。对于受保护列，保护该列的安全标签在两个表中必须相同。\n\
  * 异常表的所有列都不能有任何约束或触发器。约束包括引用完整性约束和 `CHECK` 约束，以及可能导致插入错误的唯一索引约束。\n\n\n\n\n* 异常表的第\
  \ `(n+1)` 列是一个可选的 `TIMESTAMP` 列。用于标识如果在发布 `SET INTEGRITY` 语句进行数据检查之前，异常表中的行尚未被删除，则\
  \ `SET INTEGRITY` 语句对同一表进行的连续检查调用。时间戳精度可以是 0 到 12 之间的任何值，分配的值将是 `CURRENT TIMESTAMP`\
  \ 特殊寄存器的结果。\n* 第 `(n+2)` 列类型必须为 `CLOB` (32 KB) 或更大。此列是可选的，但建议提供；它将提供行内数据违反的约束名称。如果不提供此列（例如，当原始表已达到允许的最大列数时），则仅拷贝检测到约束违反的行。\n\
  * 不允许额外的列。\n* 异常表不能是范围分区表、范围聚集表、物化查询表或临时表。\n\n### 问题 26\n正确答案是 **A** 和 **D**。在 DB2\
  \ 中，主键约束和 `UNIQUE` 约束可以被外键约束引用。\n\n# 第 5 章：监控 DB2 活动\n\n本章将介绍你如何监控 DB2 实例、数据库、对象和工作负载。你将学习使用许多监控表函数和管理视图来收集和查看系统、活动和对象的数据，以监控你的数据库系统运行得有多良好（或有多糟糕）。你还将学习用于与事件监控器配合工作的信息。在本章结束时，你将能够使用可用的\
  \ DB2 问题确定工具来排除与数据库和应用程序相关的问题。\n\n## 考试目标\n* 演示对 DB2 提供的各种监控工具的了解\n* 演示使用监控表函数收集并分析活动数据的能力\n\
  * 演示使用工作负载管理表函数验证系统健康和效率的能力\n* 演示使用 `MONREPORT` 模块生成监控数据文本报告的能力\n* 演示创建和激活事件监控器的能力，包括捕获和分析事件监控器数据\n\
  * 演示使用 `Explain` 功能捕获并分析全面的 `Explain` 信息和 `Explain` 快照数据的能力\n* 演示使用 DB2 提供的问题确定工具的能力，包括\
  \ `db2diag`、`db2fodc`、`db2pd`、`db2top`、`inspect`、`db2dart`、`db2mtrk`、`db2trc` 和\
  \ `db2support`\n* 演示使用特定操作系统的问题确定工具来补充 DB2 问题确定的能力\n* 演示使用 `db2pdcfg` 配置 DB2 数据库以问题确定的能力\n\
  \n## 数据库系统监控\n数据库监控是一项至关重要的活动，定期执行可以对数据库系统的健康状况提供持续反馈。由于数据库监控是数据库管理不可或缺的一部分，DB2\
  \ 配备了一个名为 `database system monitor`（数据库系统监控）的内置监控工具。虽然名称 `database system monitor`\
  \ 暗只有一个监控工具，但实际上，数据库系统监控由许多不同的工具（监控表函数、管理视图和事件监控器）组成，你可以使用它们来捕获并返回系统监控信息。\n\n监控表函数和管理视图允许你在特定时间捕捉数据库状态（以及所有数据库活动），而事件监控器则在特定数据库事件发生时捕获并记录数据。这两个工具收集的信息存储在称为\
  \ `monitor elements`（或数据元素）的实体中，每个使用的监控元素都通过唯一名称标识，并设计用于存储特定类型的信息。\n\n以下用于存储数据的监控元素类型：\n\
  * **计数器 (Counter)。** 它准确记录活动或事件发生的次数。计数器值在监控生命周期内不断增加；计数器监控元素通常不可重置；但它们会在数据库成功重新激活、数据库重启或实例重启时重置（例如，针对数据库执行的\
  \ SQL 语句总数以及每个不同 SQL 语句的执行总数）。\n* **仪表 (Gauge)。** 它表示项目的当前值。与计数器不同，仪表值可以根据数据库活动量增加或减少（例如，当前连接到数据库的应用程序数量）。\n\
  * **水位 (Watermark)。** 表示自监控开始以来项目出现过的最高（最大）或最低（最小）值（例如，数据库实例中注册的协调代理数）。\n* **信息\
  \ (Information)。** 提供所有执行的监控活动的引用类型细节（例如，缓冲池名称、容器名称、数据库名称和别名、路径详情、SQL 语句）。\n* **时间戳\
  \ (Timestamp)。** 表示活动或事件发生的日期和时间（例如，建立第一个数据库连接的时间）。时间戳值以自 1970 年 1 月 1 日以来经过的秒和微秒数提供。\n\
  * **时间 (Time)。** 表示执行活动或事件花费的时间（例如，执行排序操作花费的时间）。时间值自活动或事件开始以来经过的秒和微秒数提供。\n\n数据库系统监控采用多种方法呈现收集的数据。对于快照监控器和事件监控器，你都可以将所有收集的数据存储在文件或数据库表中、在屏幕上查看，或使用自定义应用程序进行处理。数据库系统监控通过使用自描述数据流将监控数据返回给客户端应用程序；使用快照监控应用程序，你调用相应的快照\
  \ API（管理视图或表函数）来捕获快照，然后处理返回的数据流。使用事件监控应用程序，你准备接收通过文件或命名管道产生的数据，激活相应的事件监控器，并在接收到时处理数据流。\n\
  \n## 快照监控器\n与 DB2 管理视图一样，快照监控器在特定时间收集 DB2 实例及其控制的数据库的状态信息（即拍摄快照时的状态）。此外，你还可以定制快照监控器以检索特定类型的监控数据（例如，配置监控器仅收集有关缓冲池的信息）。可以通过从\
  \ DB2 CLP 执行 `GET SNAPSHOT` 命令来拍摄快照，使用后续节所示快照管理视图和/或快照表函数，或者在 C 或 C++ 应用程序中嵌入快照监控\
  \ API。快照对于确定数据库系统的状态非常有用，当定期间隔拍摄时，可以提供有价值的信息，用于观察趋势和识别潜在问题区域。\n\n### 快照监控器开关\n\n\
  \n\n\n\n通常，数据库系统监控数据的收集会引入额外的处理开销。例如，为了计算 SQL 语句的执行时间，DB2 数据库管理器在每个 SQL 语句执行前后必须调用操作系统获取时间戳；这些类型的系统调用通常是昂贵的。使用数据库系统监控另一个副作用是内存消耗的增加——DB2\
  \ 数据库管理器使用内存来存储为每个跟踪的监控元素收集的数据。\n\n为了尽量减少收集数据库系统监控信息带来的开销，你可以使用一组被称为`快照监控开关`（snapshot\
  \ monitor switches）的开关来控制拍摄快照时收集哪些信息；收集信息的类型和数量取决于你设置这些快照监控开关的方式。每个快照监控开关都有两个设置：`ON`\
  \ 和 `OFF`。当你将快照监控开关设置为 `OFF` 时，受该开关控制的监控元素将不会收集信息。如果开关设置为 `ON`，则反反之。（请注意，大量的监控信息并不受开关控制，无论如何设置快照监控开关，它们都将始终被收集。）表\
  \ 5.1 显示了可用的快照监控开关，以及当每个开关设置为 `ON` 时收集的信息的类型描述。\n\n![Image](img/392.jpg)\n\n默认情况下，表\
  \ 5.1 中的所有开关都设置为 `OFF`，但 `TIMESTAMP`开关除外，它被设置为 `ON`。\n\n# 查看当前快照监控开关设置\n\n由于拍摄快照时收集信息的类型和数量在某种程度上受快照监控开关设置方式的控制，因此在拍摄快照之前，知道哪些快照监控开关已开启、哪些仍保持关闭状态是非常重要的。那么，如何确定每个快照监控开关的当前设置呢？最简单的方法是从\
  \ DB2 CLP 中执行 `GET MONITOR SWITCHES` 命令。该命令的基本语法为：\n\n![Image](img/393-1.jpg)\n\n\
  | 处处: |\n\n| `PartitionNum` | 标识数据库分区（在多分区数据库环境中），用于为该分区获取并显示快照监控开关的状态 |\n\n因此，如果你想获取并显示单分区数据库的快照监控开关状态，请执行\
  \ `GET MONITOR SWITCHES` 命令，如下所示：\n\n![Image](img/393-2.jpg)\n\n当执行此命令时，你可能会看到类似所示的输出：\n\
  \n![Image](img/393-3.jpg)\n\n仔细检查此输出，你会发现 `TIMESTAMP` 快照监控开关已开启，而所有其他开关均处于关闭状态。紧随\
  \ `TIMESTAMP` 监控开关状态之后的时间值表示 `TIMESTAMP` 监控开关开启的精确日期和时间。\n\n# 修改快照监控开关状态\n\n一旦你知道哪些快照监控开关已开启、哪些已关闭，你可能发现自己在开始监控过程之前更改一个或多个开关设置。若要在实例级别更改快照监控开关设置，请使用\
  \ `UPDATE DATABASE MANAGER CONFIGURATION` 命令修改相应的 DB2 数据库配置参数（参见表 5.1）。在实例级别设置的快照监控开关设置在实例重启后仍然有效。可以通过调用\
  \ `db2MonitorSwitches()` API 或执行 `UPDATE MONITOR SWITCHES` 命令在应用程序级别更改快照监控开关设置。该命令的基本语法为：\n\
  \n![Image](img/394-1.jpg)\n\n| 处处: |\n\n| `SwitchID` | 标识要更改状态的一个或多个快照监控开关；该参数的有效有效值为：`BUFFERPOOL,\
  \ LOCK, SORT, STATEMENT, TABLE, TIMESTAMP,` 和 `UOW` |\n\n因此，如果你想在应用程序级别将 `LOCK`\
  \ 快照监控开关的状态更改为 `ON`，请执行如下所示 `UPDATE MONITOR SWITCHES` 命令：\n\n![Image](img/394-2.jpg)\n\
  \n同样，如果你想在应用程序级别将 `BUFFERPOOL` 快照监控开关的状态更改为 `OFF`，则执行 `UPDATE MONITOR SWITCHES`\
  \ 命令：\n\n![Image](img/394-3.jpg)\n\n然而，若要在实例级别将 `LOCK` 快照监控开关的状态更改为 `ON`，你需要执行 `UPDATE\
  \ DATABASE MANAGER CONFIGURATION` 命令，如下：\n\n![Image](img/394-4.jpg)\n\n![Image](img/note.jpg)\n\
  \n**注意：** 在实例级别设置快照监控开关会影响实例控制下的所有数据库（即每个与实例控制下的数据库连接的应用程序都将继承实例配置中做的开关设置），而在应用程序级别设置监控开关（即使用\
  \ UPDATE MONITOR SWITCH 命令）则仅影响单个应用程序交互的数据库。\n\n## 捕获快照数据\n\n一旦激活数据库或建立了与数据库的连接，快照监控就会开始收集监控数据。在查看收集的数据之前，必须拍摄快照。你可以通过在应用程序程序中嵌入\
  \ `db2GetSnapshot()` API 或通过执行 `GET SNAPSHOT` 命令来拍摄快照。该命令的基本语法为：\n\n![Image](img/395.jpg)\n\
  \n| 处处: |\n\n| `DatabaseAlias` | 标识分配给监控器信息的数据库别名 |\n\n| `AppID` | 标识用于监控器收集信息的应用程序\
  \ ID |\n\n| `AgentID` | 标识用于监控器收集信息的代理 ID |\n\n因此，如果你想为名为 `SAMPLE` 的数据库拍摄仅包含交互数据的快照，请执行\
  \ `GET SNAPSHOT` 命令：\n\n![Image](img/396.jpg)\n\n当执行此命令时，你可能会看到类似所示的输出：\n\n![Image](img/396-2.jpg)\n\
  \n![Image](img/397-1.jpg)\n\n若要拍摄包含数据库管理器级别收集数据的快照，请执行 `GET SNAPSHOT` 命令，如下：\n\n\
  ![Image](img/397-2.jpg)\n\n当执行此命令时，你可能会看到类似所示的输出：\n\n![Image](img/398.jpg)\n\n![Image](img/399.jpg)\n\
  \n![Image](img/400-1.jpg)\n\n作为数据库管理员，理解上述命令输出的每一行非常重要。它可以一次性提供足够的信息，例如实例名称、产品名称和版本、远程连接数、数据库并发使用的代理数和协调代理数、FCM\
  \ 以及内存池利用率。\n\n同样，如果你想查看数据库的健康状况，可以执行此 `GET SNAPSHOT` 命令：\n\n![Image](img/400-2.jpg)\n\
  \n当执行此命令时，你可能会看到类似所示的输出：\n\n![Image](img/401.jpg)\n\n与数据库管理器快照一样，数据库快照包含关键数据库信息。强烈建议你阅读命令输出。\n\
  \n在检查 `GET SNAPSHOT` 命令的语法时，你可能会注意到在拍摄快照时可以捕获不同类型的监控数据。这些数据包括：\n\n*   DB2 数据库管理器数据：针对活动实例的信息\n\
  *   数据库数据：关于一个或多个远程或本地数据库的信息\n*   应用程序数据：关于一个或多个应用程序的信息\n*   缓冲池数据：关于缓冲池活动的信息\n\n\
  \n\n\n*   表空间数据：关于数据库内表空间的信息\n*   表数据：关于数据库内表的信息\n*   锁数据：关于应用程序持有的锁的信息\n*   动态\
  \ SQL 数据：关于 SQL 语句缓存中持有的 SQL 语句的即时信息\n\n快照监控开关，结合 `GET SNAPSHOT` 命令提供的可用选项，将决定在拍摄快照时返回的数据类型和量。事实上，如果没有开启特定的快照监控开关，并获取了与该开关相关的监控数据快照，那么捕获的监控数据可能不包含任何值。\n\
  \n要执行 `GET SNAPSHOT` 命令，你必须连接到某个实例。如果不存在实例连接，将自动连接到默认实例。要获取远程实例的快照，你必须先连接到该实例。\n\
  \n# 重置快照监控计数器\n\n早些时候你已经看到监控元素用于存储数据的元素类型之一是计数器，计数器记录了活动或事件发生次数累计总数。因此，计数器值在整个监控生命周期内不断增加。那么，计数究竟何时开始呢？计数通常在开启快照监控开关或建立与数据库的连接时立即开始（如果你使用实例级监控，则计数在应用程序首次连接到该实例控制的数据库时开始）。\n\
  \n当你想要捕获工作负载或 SQL 语句吞吐量时，最好在不关闭并重新快照监控开关、不终止并重新建立数据库连接的情况下将所有计数器重置为零。到目前为止，快速将所有快照监控计数器重置为零简单的方法是执行\
  \ `RESET MONITOR` 命令。\n\n该命令的基本语法为：\n\n```\n![Image](img/403-1.jpg)\n```\n\n或\n\n\
  ```\n![Image](img/403-2.jpg)\n```\n\n| where: |\n\n| `DatabaseAlias` | 指定重置快照监控计数器的数据库别名\
  \ |\n\n因此，要将某个实例控制的所有数据库的快照监控计数器重置为零，你需要连接到该实例并执行以下 `RESET MONITOR` 命令：\n\n```\n\
  ![Image](img/403-3.jpg)\n```\n\n但如果你只想将与名为 `SAMPLE` 的数据库相关的快照监控计数器重置为零，可以执行如下所示的\
  \ `RESET MONITOR` 命令：\n\n```\n![Image](img/403-4.jpg)\n```\n\n然而，你无法使用 `RESET MONITOR`\
  \ 命令选择性地重置由快照监控开关控制的特定监控组计数器。要执行此类操作，你必须关闭并重新开启相应的快照监控开关，或者终止并重新建立数据库连接。\n\n记住，每个实例连接都有自己的快照监控数据视图。如果一个用户运行了重置监控命令或关闭了监控开关，其他用户的监控数据视图不受影响。\n\
  \n## 关于 DB2 监控元素\n\nDB2 提供了各种监控元素来检查和排查性能问题或检查数据库健康状况。监控元素分类如下：\n\n*   请求监控元素。也称为请求指标，这些元素衡量整个数据库服务器处理应用程序请求（例如从客户端到服务器打开连接并执行\
  \ SQL 语句）时花费的工作量或精力。监控元素分类如下：\n\n（注：原文后续部分存在大量重复，此处已按核心逻辑翻译）\n\n\n\n\n| lock_wait_time\
  \ | 可以从许多表函数读取，包括 `MON_GET_ PKG_CACHE_STMT` | 表示等待锁时消耗的总已时间 |\n| total_wait_time\
  \ | 可以从许多表函数读取，包括 `MON_GET_CONNECTION_DETAILS` | 表示在 DB2 数据库服务器内等待的总时间 |\n\n## 用于监控的表函数\n\
  \n表函数设计用于收集和查看特定时间点的系统、活动和数据对象的数据。监控表函数使用了 DB2 9.7 中引入的更先进、轻量级且高速的监控基础架构。被监控元素的数据不断累积在内存中，并可供查询。你可以选择接收特定对象或数据库中所有对象的数据。请记住，表函数并不是实际的表——它们是围绕从许多其他源捕信息而构建的函数。在\
  \ DB2 9.7 发布之前，时间点监控数据是通过快照监控（snapshot monitoring）访问的，该技术使用了一种效率较低的底层架构。\n\n监控表函数根据监控元素进行逻辑分组，并分类如下：\n\
  \n* 监控系统信息的表函数\n- 监控活动的表函数\n- 监控数据对象的表函数\n- 监控锁的表函数\n- 监控系统内存的表函数\n\n## 监控系统信息\n\
  \n系统监控包括数据库服务器处理应用程序请求所需的完整工作量和投入。这提供了关于数据库服务器整体性能以及特定应用程序请求子性能的完整视角。\n\n请求监控元素在工作负载管理\
  \ (WLM) 对象层次结构的不同级别上跨请求进行聚合：按工作单元（unit of work）、工作负载（workload）、服务类和连接进行划分。表 5.3\
  \ 列出了访问当前系统信息的表函数。\n\n| 表 5.3：监控系统信息的表函数 |\n\n| 表函数名称 | 返回的信息 |\n| :--- | :--- |\n\
  | MON_GET_SERVICE_SUBCLASS | 返回一个或多个服务子类的指标 |\n| MON_GET_SERVICE_SUBCLASS_DETAILS\
  \ | 在 XML 文档中返回一个或多个服务子类的详细指标 |\n| MON_GET_WORKLOAD | 返回一个或多个工作负载的指标 |\n| MON_GET_WORKLOAD_DETAILS\
  \ | 在 XML 文档中返回一个或多个工作负载的详细指标 |\n| MON_GET_UNIT_OF_WORK | 返回一个或多个工作单元的指标 |\n| MON_GET_UNIT_OF_WORK_DETAILS\
  \ | 在 XML 文档中返回一个或多个工作单元的详细指标 |\n| MON_GET_CONNECTION | 返回一个或多个连接的指标 |\n| MON_GET_CONNECTION_DETAILS\
  \ | 在 XML 文档中返回一个或多个连接的详细指标 |\n\n构造引用监控系统信息表函数的查询语句类似于如下：\n\n![Image](img/406.jpg)\n\
  \n| where: | |\n| :--- | :--- |\n| FunctionName | 识别要使用的监控表函数名称（即在 表 5.3 中列出的函数之一）\
  \ |\n| SystemInfoSpecifics | 识别监控表函数的系统特定信息，例如用于要检索监控指标数据的服务父类和子类 |\n| Member |\
  \ 识别要收集监控指标数据的成员；你可以指定 `-1` 表示当前成员，或指定 `-2` 表示所有数据库成员 |\n| CorrelationName | 识别分配给查询产生的结果集的名称\
  \ |\n\n如果你想收集系统中所有父类和子类消耗的总 CPU 时间（微秒）以及已完成的应用程序请求数，请执行以下查询：\n\n![Image](img/407.jpg)\n\
