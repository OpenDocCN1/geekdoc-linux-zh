  \ 按钮在第一题上不会显示）。\n\n同样，当你处于最后一题时，你不能简单地通过点击 `Next` 回到第一题。然而，有一种方法可以从项目复习面板快速导航到特定题目，我们稍后会介绍。虽然通常提供的列表中只有一个答案是当前问题的正确答案，但有时会有多个有效答案。在这些情况下，答案单选按钮将被答案复选框取代，并且问题的措辞将让你知道需要选择多少个答案。图\
  \ 1.8 展示了此类问题的示例。\n\n要回答这类问题，点击位于找到的每个正确答案文本左侧的答案复选框。（再次，操作方法是将鼠标指针悬停在每个所需的答案复选框上并按下鼠标左键。）\n\
  \n有时，插图或某些诊断工具的输出会伴随问题。你需要在查看该插图或输出（称为附件）之前才能成功回答问题。在这些情况下，一条指示你显示附件的消息将出现在问题之前，一个名为\
