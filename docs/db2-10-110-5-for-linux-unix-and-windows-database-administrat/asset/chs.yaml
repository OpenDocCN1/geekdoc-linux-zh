  \ |\n\n## 创建 DB2 数据库\n\n你可以使用 `CREATE DATABASE` 命令来创建一个 DB2 数据库。在最简单的形式，`CREATE\
  \ DATABASE` 命令的语法如下：\n\n![Image](img/163.jpg)\n\n| 何处: |\n| `DatabaseName` | 为创建的数据库分配一个唯一名称。\
  \ |\n\n在执行此命令时，你必须提供的值是分配给新数据库的名称。该名称：\n\n- 长度应始终小于或等于 8 个字符\n- 可以仅由字符 a 到 z、A 到\
  \ Z、0 到 9、@、#、$ 和 _（下划线）组成\n- 不能以数字开头\n- 不能以字母序列“SYS”、“DBM”或“IBM”开头\n- 不能与已分配给同一实例内另一个数据库的名称相同\n\
  \n当然，还有一种更复杂的 `CREATE DATABASE` 命令形式，它可以让你对数据库参数提供更多的控制，我们稍后会对其进行研究。但现在，让我们先看看当你执行这种形式的\
  \ `CREATE DATABASE` 命令时会发生什么。\n\n## 创建数据库时会发生什么？\n\n无论你如何启动该过程，每当你创建一个新的 DB2 10.1\
  \ 数据库时，都会按照以下顺序执行以下任务：\n\n1. 在适当的位置创建所有需要的目录和子目录。\n\n你创建的每个 DB2 数据库的信息都存储在一个特殊的层次结构目录树中。创建此目录树的位置由你通过\
  \ `CREATE DATABASE` 命令提供的信息决定——如果你没有提供位置信息，该目录树将在创建数据库的实例的关联的 `dftdbpath` DB2 数据库管理器配置参数指定的路径创建。\n\
  \n此该层次结构树的根目录被命名为与数据库关联的实例名称。该目录将包含一个与分区节点名称相同的子目录。如果数据库是分区数据库，则该目录将命名为 `NODE*xxxx`，其中\
  \ *xxxx* 是分配给分区的唯一节点号。如果数据库是非分区数据库，则该目录将命名为 `NODE0000`（考虑到没有人对 DB2 企业版上的 `db2nodes.cfg`\
  \ 文件进行过任何修改）。反之，节点目录将为每个创建的数据库包含一个子目录，以及一个包含用于存放数据库数据的容器的子目录。\n\n用于存放数据库数据容器的子目录名称与为数据库指定的名称相同；包含数据库基础文件的子目录名称将与在创建过程中分配给数据库的数据库标记（token）对应（第一个创建的数据库的子目录将命名为\
  \ `SQL00001`，第二个数据库的子目录将命名为 `SQL00002`，依此类推）。图 3.1 展示了这种目录结构在非分区数据库环境中通常的样式。\n\n\
  ![Image](img/165.jpg)\n\n*图 3.1: DB2 数据库层次结构*\n\n2. 创建管理、监控和数据库恢复所需的文件。\n\n在创建了与数据库标记同名的子目录后，会在该目录下创建以下文件和目录：\n\
  \n- `SQLSGF.1`：此文件包含与自动存储关联的存储路径信息。\n- `SQLSGF.2`：此文件是 `SQLSGF.1` 的备份。\n- `HADR:`：此目录包含\
  \ `LOGSPOOL` 和 `TAKEOVER` 子目录，用于 `HADR TAKEOVER` 命令。\n- `LOGSTREAM0000:`：此目录包含事务日志文件，并在对数据库执行\
  \ SQL 操作时存储事务日志记录。\n- `MEMBER0000:`：这是一个特定于成员的目录，包含以下文件：\n    - `SQLTMPLK:`：此文件包含有关临时表空间的信息。\n\
  \    - `db2event:`：此目录包含事件监控器信息，并按默认会创建一个详细的死锁事件监控器。\n    - `SQLBP.1`：此文件包含缓冲池信息。\n\
  \    - `SQLBP.2`：此文件是 `SQLBP.1` 的备份。\n    - `SQLOGCTL.LFH.1`：此文件包含活动事务日志文件的信息。恢复操作使用存储在此文件中的信息来确定从日志回溯多远开始恢复过程。\n\
  \    - `SQLOGCTL.LFH.2`：此文件是 `SQLOGCTL.LFH.1` 的镜像拷贝。\n    - `SQLOGMIR.LFH:`：此文件是\
  \ `SQLOGCTL.LFH.1` 的镜像拷贝。\n    - `SQLINSLK:`：此文件包含信息，确保数据库仅分配给 DB2 数据库管理器的一个实例。\n\
  \    - `SQLDBCONF:`：此文件具有数据库配置信息。\n- `db2rhist.lock` 和 `SQLOGCTL.GLFH.LCK:`：这些文件分别为恢复历史文件和日志文件提供实例级序列化。\n\
  - `db2rhist.asc:`：此文件包含备份操作、恢复操作、表加载、表更改以及类似的数据库更改（即恢复历史文件）。\n- `db2rhist.bak:`：此文件是\
  \ `db2rhist.asc` 的备份。\n- `SQLOGCTL.LFH.1`：此文件包含活动事务日志文件的信息。恢复操作使用存储在此文件中的信息来确定从日志回溯多远开始恢复过程。\n\
  - `SQLOGCTL.LFH.2:`：此文件是 `LFH.1` 的镜像拷贝。\n- `SQLSPCS.1`：此文件具有表空间信息。\n- `SQLSPCS.2`：此文件是\
  \ `SQLSPCS.1` 的备份。\n- `SQLDBCONF:`：此文件包含数据库配置。\n\n3. 为数据库创建一个缓冲池。\n\n在创建数据库期间，会创建一个缓冲池并命名为\
  \ `IBMDEFAULTBP`。在 Linux、UNIX 和 Windows 平台上，该缓冲池默认以 4 KB 页大小创建并设置为自动。该缓冲池使用的内存（同样适用于任何其他存在的缓冲池）在建立到数据库的连接时分配，并在终止所有连接时释放。DB2\
  \ 数据库管理器还会创建四个隐藏的系统缓冲池：`IBMSYSTEMBP4K、IBMSYSTEMBP8K、IBMSYSTEMBP16K、` 和 `IBMSYSTEMBP32K.`\
  \ 通常，当主缓冲池因内存不足或其他类似情况无法分配时会使用这些缓冲池。\n\n4. 创建两个常规表空间和一个系统临时表空间。\n\n在创建缓冲池 `IBMDEFAULTBP`\
  \ 之后，会创建三个表空间并将其与之关联。这三个表空间如下：\n\n- 名为 `SYSCATSPACE` 的常规表空间，存储与数据库相关的系统目录表和视图。\n\
  - 名为 `USERSPACE1` 的常规表空间，存储所有用户定义对象（如表、索引等）以及用户数据、索引数据和长值数据。\n- 名为 `TEMPSPACE1`\
  \ 的系统临时表空间，它是数据排序、重组表和创建索引等操作的临时存储区域。\n\n\n\n\n除非另有说明，`SYSCATSPACE` 和 `USERSPACE1`\
  \ 是 DMS 文件表空间，而 `TEMPSPACE1` 是 SMS 表空间。您可以将这些表空间的特性作为输入提供给 `CREATE DATABASE` 命令，或在创建数据库向导中使用。\n\
  \n### 5. 系统目录表和视图已创建。\n\nAfter the table space `SYSCATSPACE` is created, a special\
  \ set of tables (known as the `system catalog tables`) are constructed within that\
  \ table space. The DB2 database manager uses the system catalog tables to keep track\
  \ of information such as database object definitions, database object dependencies,\
  \ database object privileges, column data types, table constraints, and object relationships.\
  \ A set of system catalog views is created along with the system catalog tables,\
  \ and these views are typically used when you access data stored in the system catalog\
  \ tables. You cannot modify the system catalog tables and views with DDL SQL statements\
  \ (however, you can view their contents). Instead, the DB2 database manager will\
  \ alter them whenever one of the following events occurs:\n\n- 一个数据库对象（如表、视图或索引）被创建、修改或删除。\n\
  - 授权或权限被授予或撤销。\n- 为表收集统计信息。\n- 包绑到数据库。\n\nUsually, all characteristics of a database\
  \ object are stored in one or more system catalog tables when the object is created.\
  \ However, in some cases, such as when you define triggers and constraints, the\
  \ SQL used to create the object is stored instead.\n\n### 6. 数据库在系统目录和本地数据库目录中被目录化（如果目录不存在则首先创建系统或本地数据库目录）。\n\
  \nDB2 uses a set of special files to keep track of where databases are stored and\
  \ to provide access to those databases. Because you use the information stored in\
  \ these files the same way you use information contained in an office-building directory,\
  \ they are referred to as `directory files`. Whenever you create a database, these\
  \ directories are updated with the database’s name and alias. If specified, a comment\
  \ and code set values are also stored in these directories.\n\n### 7. 数据库的配置文件已初始化。\n\
  \nSome of the parameters in the database configuration file (such as code set, territory,\
  \ and collating sequence) will be set by using values that you specified as input\
  \ for the `CREATE DATABASE` command or in the Create Database wizard; others are\
  \ assigned system default values.\n\n### 8. 创建了四个模式。\n\nAfter the creation of the\
  \ system catalog tables and views, the following schemas are created: `SYSIBM, SYSCAT,\
  \ SYSSTAT,` and `SYSFUN.` A special user named `SYSIBM` is made the owner of each\
  \ schema.\n\n### 9. 为数据库绑定了一组实用程序。\n\nBefore some of the DB2 utilities can work\
  \ with a database, you must create the packages needed to run those utilities by\
  \ binding a set of predefined DB2 database manager bind files to the database (the\
  \ bind files are listed in the utilities bind list file `db2ubind.lst`).\n\n###\
  \ 10. 向相应用户授予权限和特权。\n\nTo connect to and work with a particular database, a user\
  \ must have the authorities and privileges required to use that database.\n\nTherefore,\
  \ whenever you create a new database, unless otherwise specified, the following\
  \ authorities and privileges are granted:\n\n- Database Administrator `(DBADM)`\
  \ authority as well as `CONNECT, CREATETAB, BINDADD, CREATE_NOT_FENCED, IMPLICIT_SCHEMA,`\
  \ and `LOAD` privileges are granted to the user who created the database.\n- `USE`\
  \ privilege on the table space `USERSPACE1` is granted to the group `PUBLIC`.\n\
  - `CONNECT, CREATETAB, BINDADD,` and `IMPLICIT_SCHEMA` privileges are granted to\
  \ the group `PUBLIC`.\n- `SELECT` privilege on each system catalog table is granted\
  \ to the group `PUBLIC`.\n- `EXECUTE` privilege on all procedures in the `SYSIBM`\
  \ schema is granted to the group `PUBLIC`.\n- `EXECUTE WITH GRANT` privilege on\
  \ all functions in the `SYSFUN` schema is granted to the group `PUBLIC`.\n- `BIND`\
  \ and `EXECUTE` privileges for each successfully bound utility are granted to the\
  \ group `PUBLIC`.\n\n### 11. 启用了多项自动化功能。\n\n- Automatic maintenance (table and index\
  \ reorganization, data access optimization, and statistics profiling)\n- Self-tuning\
  \ memory manager (package cache, locking memory, sort memory, database shared memory,\
  \ and buffer pool memory)\n- Utility throttling\n\n### 12. 配置向导已启动。\n\nThe Configuration\
  \ Advisor is a tool that helps you tune performance and balance memory requirements\
  \ for a database by suggesting which configuration parameters to modify based on\
  \ information you provide about the database. In DB2, the Configuration Advisor\
  \ is automatically invoked whenever you create a database, unless the default behavior\
  \ is changed by assigning the value `NO` to the `DB2_ENABLE_AUTOCONFIG_DEFAULT`\
  \ registry variable.\n\n## A Complete CREATE DATABASE Command\n\nWhen you execute\
  \ the simplest form of the `CREATE DATABASE` command, the characteristics of the\
  \ database, such as the storage and transaction logging method to use, are determined\
  \ by several predefined defaults. To change any of the default characteristics,\
  \ you must specify one or more options when executing the `CREATE DATABASE` command.\
  \ The complete syntax for this command is:\n\n![Image](img/170-1.jpg) or ![Image](img/170-2.jpg)\n\
  \n| where: | :--- | :--- |\n| `DatabaseName` | 标识要创建的数据库的唯一名称 |\n| `StoragePath`\
  \ | 标识用于在指定 `AUTOMATIC STORAGE YES`（默认）时保存表空间容器的一个或多个存储路径，否则标识物理存储数据库创建目录结构和文件的位置（驱动器或目录）\
  \ |\n| `DBPath` | 标识物理存储数据库创建目录结构和元数据文件的位置（驱动器或目录），如果指定 `AUTOMATIC STORAGE YES`（默认）；如果未指定该参数且使用自动存储，元数据文件将存储在\
  \ `StoragePath` 参数中指示的第一个存储路径中 |\n| `Alias` | 标识要创建的数据库的别名 |\n| `CodeSet` | 标识用于在数据库中存储数据的字符集（在\
  \ DB2 数据库中，每个字符的单字节字符内部以 0 到 255 之间的唯一数字表示，该数字称为字符的代码点；代码点到特定字符集中每个字符的映射称为 `code\
  \ page`，而 ISO 标准术语为 `code set`） |\n| `Territory` | 标识用于在数据库中存储数据的领地 |\n| `CollateType`\
  \ | 指定为创建数据库使用的排序顺序（即用于排序、合并和比较字符的顺序）；该参数的有效值包括：`COMPATABILITY, IDENTITY, IDENTITY_16BIT,\
  \ UCA400_ NO, UCA400_LSK, UCA400_LTH, NLSCHAR,` 和 `SYSTEM` |\n| `NumSegments` |\
  \ 指定为创建数据库使用的默认 SMS 表空间（`TEMPSPACE1`）创建并使用的目录数量 |\n| `DefaultExtSize` | 指定在创建表空间时使用的默认\
  \ extent 大小；创建过程期间不指定 extent 大小 |\n\n\n\n\n\n| Description | 指定一个注释，用于描述将在数据库目录中创建的数据库条目；你必须用双引号将描述括起来\
  \ |\n| Keyword | 识别 `AUTOCONFIGURE` 命令将识别（识别）的一个或多个关键字；有效值包括 `mem_percent, workload_type,\
  \ num_stmts, tpm, admin_priority, is_populated, num_local_apps, num_ remote_apps,\
  \ isolation,` 和 `bp_resizable` |\n| Value | 识别与指定关键字关联的值 |\n| TS_Definition | 指定用于创建表空间的定义，该表空间将存放系统目录表\
  \ `(SYSCATSPACE)`、用户定义对象 `(USERSPACE1)` 和临时对象 `(TEMPSPACE1)` |\n\n定义 SMS 表空间的语法为：\n\
  \n![Image](img/172-1.jpg)\n\n定义 DMS 表空间的语法为：\n\n![Image](img/172-2.jpg)\n\n以及定义自动存储表空间的语法为：\n\
  \n![Image](img/172-3.jpg)\n\n| 在其中: | |\n| Container | 识别一个或多个用于存储分配给指定表空间数据的容器；对于\
  \ SMS 表空间，你指定的每个容器必须标识一个有效的目录；对于 DMS 文件容器，你指定的每个容器必须标识一个有效的文件；对于 DMS 设备容器，你指定的每个容器必须标识一个已存在的设备\
  \ |\n| NumberOfPages | 指定表空间容器要使用的页数 |\n| ExtentSize | 指定以轮询方式写入每个所用表空间容器的数据页数 |\n\
  | PrefetchSize | 指定在执行数据预取时，从指定的表空间读取的数据页数 |\n| Overhead | 识别与属于指定表空间的容器相关的相关的 I/O\
  \ 控制器开销和磁盘寻道延迟（单位为毫秒） |\n| TransferRate | 识别从表空间容器读取一页数据并将其存储在内存中所需的时间（单位为毫秒） |\n\
  | InitialSize | 指定自动调整大小的 DMS 表空间或自动存储表空间的初始大小 |\n| Increment | 指定当启用自动调整大小的表空间满并收到空间请求时，表空间增加的增量\
  \ |\n| MaxSize | 指定启用自动调整大小的表空间可以增加的最大大小 |\n\n如果你指定了 `RESTRICTIVE` 子句，则正在创建的数据库的\
  \ `RESTRICT ACCESS` 数据库配置参数设置为 `YES`，且不会向 `PUBLIC` 组授予任何权限。\n\n假设你想创建一个具有以下特征的 DB2\
  \ 数据库：\n\n*   物理位于 E: 驱动器上\n*   将不使用自动存储\n*   将被命名为 `SAMPLE`\n*   将识别美国/加拿大代码集（该代码页以及地区用于将字母数字数据转换为存储在数据库中的二进制数据）\n\
  *   将使用基于所用用**排序规则（在本例中为美国/加拿大）\n*   不会允许 `PUBLIC` 组自动访问\n*   将系统目录存储在 DMS 表空间中，该表空间使用文件\
  \ `SYSCATSPACE.DAT` 作为其容器（该文件存储在 E: 驱动器上，能够容纳最多 50,000 个大小为 4 KB 的页。）\n\n在这种情况下，你执行的类似下面的\
  \ `CREATE DATABASE` 命令：\n\n![Image](img/174-1.jpg)\n\n在 Windows 平台上，数据库路径必须像上述示例那样仅为驱动器号。如果你想在驱动器号内指定目录，你必须将注册表变量\
  \ `DB2_CREATE_DB_ON_PATH` 设置为 `YES`。\n\n在 UNIX 平台上，你可以执行 `CREATE DATABASE` 命令创建一个启用了\
  \ `AUTOMATIC STORAGE` 的数据库，如下：\n\n![Image](img/174-2.jpg)\n\n上面的示例使用 `/database`\
  \ 作为定义为默认存储组 `IBMSTOGROUP` 的存储路径，并将 `/home/db2inst1` 作为数据库路径来记录本地数据库目录信息。\n\n##\
  \ 数据库的设计方面\n\n在根据应用程序需求将物理数据模型转换为物理数据库时，请考虑物理数据库设计的以下领域：\n\n*   数据库分区组（在数据库仓库系统中起着重要作用）\n\
  *   基于块的缓冲池\n*   表空间\n*   表\n*   索引\n*   范围分区表\n*   MDC 表（在数据库仓库系统中起着关键作用）\n*  \
  \ MQT（在数据库仓库系统中起着重要作用）\n*   使用存储组的多温度管理\n\n## 列出数据库\n\n当你创建一个数据库时，关于数据库的信息如数据库名称、别名、数据库发布版本、数据库类型（本地或远程）、用于自动客户端重定向的备用服务器名称以及数据库与实例之间的映射都会自动记录在系统和本地数据库目录中。如果你想列出系统数据库目录信息，请执行\
  \ `LIST DB DIRECTORY` 命令：\n\n![Image](img/175-176.jpg)\n\n列出本地数据库目录信息，请发布此命令：\n\n\
  ![Image](img/176-1.jpg)\n\n## 删除数据库\n\n如果数据库不再需要，你可以使用 `DROP DATABASE` 命令从系统中删除该数据库：\n\
  \n![Image](img/176-2.jpg)\n\n## 为你的数据库启用自动存储\n\n你可以通过 `CREATE STOGROUP` 命令将现有非自动数据库转换为自动存储：\n\
  \n![Image](img/176-3.jpg)\n\n创建新的存储组后，你可以运行 `db2pd` 命令检查使用情况：\n\n![Image](img/177.jpg)\n\
  \n然后通过 `ALTER TABLESPACE` 命令将可用的 DMS 表空间转换为自动存储：\n\n![Image](img/177-1.jpg)\n\n\
  ## 缓冲池\n\n缓冲池是数据库管理器分配的一块内存区域，用于在处理事务期间缓存表和索引页。当所需的页在缓冲池中找到时，发生缓冲池命中；当所需的页不在缓冲池中时，则必须从外部存储中读取。\n\
  \n当表中的记录被首次访问时，数据库管理器会启动预取进程异步地从存储设备读取数据到缓冲池中，并在某些情况下（例如读取二进制对象数据），将启动代理程序同步读取数据。同样，当记录在缓冲池中发生更改时，数据库管理器会启动页面清理进程异步地将缓冲池数据写入磁盘，并在某些情况下（例如写入二进制对象数据），将启动代理程序同步写入数据。\n\
  \n缓冲池中的页可以处于三种状态之一：\n\n*   **使用中（In Use）**页正在被读取或更新。\n*   **脏（Dirty）**页包含已更改但尚未写入磁盘的数据。\n\
  *   **洁（Clean）**页包含已更改并写入磁盘的数据。\n\n数据库调优的关键元素涉及设置存储设备与缓冲池之间数据移动的配置参数。这对数据库管理员意味着什么？简单来说，就是最大化异步\
  \ I/O 并最小化数据提取等待时间。\n\n## 缓冲池的设计方面\n\n在设计缓冲池时，除了这些属性外，还需要考虑页大小和实际页数：\n\n*   将数据预取到缓冲池：**列表预取**算法高效地读取一组不连续的数据页；**顺序预取**算法高效地读取一组连续的数据页。\n\
  \n\n\n\n\n-   基于块的缓冲池可改进顺序预取性能：当需要将从磁盘的连续页块移动到内存的连续区域时，这可以显著提高性能。\n\n## 创建缓冲区池\n\
  \n如果您想创建一个页大小为 16 KB 且总页数为 10,000 的缓冲区池，请执行 `CREATE BUFFERPOOL` 命令，类似于所示：\n\n![Image](img/179-1.jpg)\n\
  \n要指定基于块区域中应存在的页数以改进顺序预取性能，您需要执行以下命令：\n\n![Image](img/179-2.jpg)\n\n最后，如果您想创建一个自动的缓冲区池，可以通过执行此命令来完成：\n\
  \n![Image](img/179-3.jpg)\n\n## 列出缓冲区池\n\n要查看可用的缓冲区池信息，可以查询 `SYSCAT.BUFFERPOOLS`\
  \ 目录表：\n\n![Image](img/179-180.jpg)\n\n## 修改缓冲区池\n\n您可以使用 `ALTER BUFFERPOOL` 命令修改缓冲区池的以下属性：\n\
  \n- `SIZE.` 为特定缓冲区池分配的页数\n- `NUMBLOCKPAGES.` 基于块的总区域大小\n- `BLOCKSIZE.` 基于块的总区域内的块大小\n\
  - `ESTORE.` 启用或禁用扩展存储\n- `DBPGNAME.` 数据库分区组\n\n如果您想更改基于块的总区域大小和块大小，可以通过执行此命令来实现：\n\
  \n![Image](img/180-1.jpg)\n\n## 删除缓冲区池\n\n只有当没有与该缓冲区池关联表空间时，才能删除缓冲区池。要删除缓冲区池，请使用命令\
  \ `DROP BUFFERPOOL`，类似于所示：\n\n![Image](img/180-2.jpg)\n\n## 关于 DB2 存储层次结构的说明\n\n\
  如您所知，DB2 将世界视为分层对象结构，存储也是如此。在 DB2 中，存储单元的层次结构包括数据库、表空间、存储组或存储路径、物理磁盘或设备、区（extents）和页，如图\
  \ 3.2 所示。\n\n数据库由多个表空间组成，数据库的大小为其包含的表空间的大小。如果您想查找数据库的大小和容量，请使用内置过程 `GET_DBSIZE_INFO`：\n\
  \n![Image](img/181-1.jpg)\n\n参数 `DATABASESIZE` 显示实际的数据库大小（字节），`DATABASECAPACITY`\
  \ 显示数据库在服务器上可以增长的最大容量（字节）。\n\n![Image](img/181-2.jpg)\n\n图 3.2：DB2 存储层次结构\n\n表空间是\
  \ DB2 中非常重要的结构，包含表、索引、大对象和长对象。在 DB2 的早期版本中，表空间由映射到物理磁盘的容器数量组成。从 DB2 10.1 开始，存储组在表空间和物理磁盘之间提供层抽象，允许根据业务需求在存储组之间移动表空间（近期数据使用快速\
  \ SSD 驱动，上个月的数据使用中 SAS 驱动，归档数据使用慢 SATA 驱动）。后续章节将详细介绍表空间和存储组。\n\n容器是存储数据的实际物理设备，有三种管理类型：DMS、SMS\
  \ 和自动存储。同样，下一节将更详细介绍这些内容。\n\nDB2 中的一个区（extent）包含存储设备中的多个连续页。您可以在创建数据库时通过使用 `DFT_EXTENT_SZ`\
  \ 子句，或在创建表空间时使用 `EXTENTSIZE` 子句来配置区。一旦指定，区的大小在数据库或表空间的生命周期内将无法更改。DB2 的 I/O 基于区工作，这样一组连续页就可以单次\
  \ I/O 地从磁盘读取到缓冲区池。一个良好的经验是：对于 OLTP 应用，区的大小设置为 256 KB（即 8 KB 页大小 x 32 页），对于数据仓库应用，设置为\
  \ 512 KB（16 KB 页大小 x 32 页）。\n\n页是存储结构中的最低层级。DB2 在数据库中支持 4 KB、8 KB、16 KB 和 32 KB\
  \ 的页大小，允许您为不同的应用程序负载创建具有不同页大小的表空间。\n\n## 表空间\n\n表空间控制数据的物理存储位置，并并在数据库对象（如表、索引和 MQT）与实际存放对象数据的一个或多个容器（即目录、文件或原始设备）之间提供间接层。单个表空间可以跨越多个容器，但每个容器只能属于一个表空间。当表空间跨越多个容器时，数据将以轮询方式（以称为区的页组为单位）写入分配给该表空间的每个容器。这有助于平衡属于给定表空间的所有容器之间的数据。图\
  \ 3.3 显示了页、区和表空间容器之间的关系。\n\n存在三种表空间：SMS 表空间、DMS 表空间和自动存储表空间。对于 SMS 表空间，只能使用目录容器存储，由操作系统的文件管理器负责控制空间的使用。SMS\
  \ 存储模型由文件系统中的许多文件（每个文件代表一个表、索引或长对象）组成——用户决定文件的位置，DB2 数据库管理器分配名称，文件系统负责管理它们的增长。\n\
  \n![Image](img/183.jpg)\n\n图 3.3：数据如何写入表空间容器\n\n对于 DMS 表空间，只能使用文件和设备容器进行存储，由 DB2\
  \ 数据库管理器负责控制空间的使用。对于自动存储表空间，DB2 将根据其存储的数据类型选择最佳的底层表空间。通常，临时表空间选择 SMS，常规和大型表空间选择\
  \ DMS。表 3.2 显示了 SMS、DMS 和自动表空间之间的其他差异。\n\n| 表 3.2：SMS、DMS 和自动表空间的区别 |\n\n| SMS 表空间\
  \ | DMS 表空间 | 自动存储表空间 |\n| :--- | :--- | :--- |\n| 存储空间由操作系统的文件管理器分配和管理。 | 存储空间由\
  \ DB2 数据库管理器分配（如果已指定）并管理。 | 存储空间由 DB2 数据库管理器分配和管理。 |\n| 只能使用目录容器存储；不能使用文件和设备容器。\
  \ | 可以使用文件或设备容器；不能使用目录容器。 | DB2 根据存储的数据类型选择容器类型。 |\n| 表空间创建后无法（使用 `ALTER TABLESPACE`\
  \ SQL 语句）添加额外的容器。 | 表空间创建后可以添加额外的容器。添加新容器时，现有数据会自动在新容器组之间重新平衡，以保持优的 I/O 效率。 | 当向存储组添加新的存储路径且现有容器达到最大容量时，会自动创建额外的容器。\
  \ |\n| 存储空间根据需要分配。 | 存储空间是预分配。 | 存储空间在存储组级别管理，并根据需求增长。 |\n| 表空间创建后无法更改容器的大小。 | 表空间创建后可以增加或减少容器的大小。\
  \ | 容器的大小将由 DB2 数据库管理器管理。 |\n| 常规数据和长数据存储在同一个表空间中。 | 常规数据和长数据可以跨越多个表空间。 | 常规数据和长数据可以跨越多个表空间。\
  \ |\n\n\n\n\n\n| 表空间更容易创建和管理。 | 表访问速度略快，因此整体性能更好。 | 表空间像 SMS 一样易于创建和管理，且像 DMS 一样性能更好。\
  \ |\n\nSMS 和 DMS 表空间都根据其旨在存储的数据类型进行分类。这三种分类为：普通、大型和临时。普通数据和索引数据存储在普通表空间，而长字段（long\
  \ field）数据和大对象（object）数据可以存储在大型表空间——但只有在使用 DMS 表空间时如此。（由于大型数据也可以存储在普通表空间，因此使用大型表空间是可选的）。临时表空间进一步分为系统或用户——系统临时表存储执行某些类型操作（例如，排序数据、重组表、创建索引和连接表）时生成的内部临时数据，而用户临时表则存储声明的全局临时表，这些表反过来而在短时间内存储特定的应用程序数据。\n\
  \n如果您为数据库启用了自动存储，则可能存在另一种类型的表空间——自动存储表空间。虽然乍一看，自动存储表空间似乎是第三种表空间，但它们实际上只是 SMS 和 DMS\
  \ 表空间的扩展。您通过一个或多个文件容器创建作为 DMS 表空间的普通和大型表空间；您通过一个或多个目录容器创建作为 SMS 表空间的系统和用户临时表。与定义\
  \ SMS 和 DMS 表空间不同，自动存储表空间不需要容器定义；DB2 数据库管理器会自动将容器分配给自动存储表空间。\n\n## 获取有关现有表空间的信息\n\
  \n与其他对象一样，每当创建表空间对象时，该表空间的信息就会记录在系统目录中。因此，您可以通过查询相应的系统目录表或系统目录视图获取数据库中任何表表的特定信息。您还可以通过执行\
  \ `LIST TABLESPACES` 命令获取为特定数据库创建的所有表空间的信息。\n\n该命令的语法如下：\n\n![Image](img/185.jpg)\n\
  \n在不指定 `SHOW DETAIL` 选项的情况下执行此命令，将为数据库创建的每个表空间显示以下信息：\n\n*   创建表空间时分配给表空间的内部 ID\n\
  *   分配给表空间的名称\n*   表空间类型（SMS 表空间或 DMS 表空间）\n*   表空间设计包含的数据类型（即：普通数据、大型数据或临时数据）\n\
  *   表空间的当前状态（表 3.3 | 0x0 |\n| 静止：共享 (Quiesced: SHARE) | 0x1 |\n| 静止：更新 (Quiesced:\
  \ UPDATE) | 0x2 |\n| 静止：排他 (Quiesced: EXCLUSIVE) | 0x4 |\n| 等待加载 (Load pending)\
  \ | 0x8 |\n| 等待删除 (Delete pending) | 0x10 |\n| 等待备份 (Backup pending) | 0x20 |\n\
  | 正在进行滚前恢复 (Roll-forward recovery in progress) | 0x40 |\n| 等待滚前恢复 (Roll-forward\
  \ recovery pending) | 0x80 |\n| 等待恢复 (Restore pending) | 0x100 |\n| 等待禁用 (Disable\
  \ pending) | 0x200 |\n| 正在重组 (Reorganization in progress) | 0x400 |\n| 正在进行备份 (Backup\
  \ in progress) | 0x800 |\n| 必须定义存储 (Storage must be defined) | 0x1000 |\n| 正在进行恢复\
  \ (Restore in progress) | 0x2000 |\n| 离线且不可访问 (Offline and not accessible) | 0x4000\
  \ |\n| 等待删除 (Drop pending) | 0x8000 |\n| 可以定义存储 (Storage may be defined) | 0x2000000\
  \ |\n| StorDef 处于“最终”状态 (StorDef is in “Final” state) | 0x4000000 |\n| StorDef 在滚前恢复前更改过\
  \ (StorDef was changed before roll-forward recovery) | 0x8000000 |\n| 正在进行 DMS 重平衡\
  \ (DMS rebalance in progress) | 0x10000000 |\n| 正在进行表空间删除 (Table space deletion\
  \ in progress) | 0x20000000 |\n| 正在进行表空间创建 (Table space creation in progress) |\
  \ 0x40000000 |\n| 正在加载* (Load in progress*) | 0x20000 |\n\n*单个表空间在给定时间点可能处于多个状态。如果是如此，将对多个表空间状态的十六进制值进行\
  \ AND 运算，以跟踪多个状态。您可以使用 Get Table Space State 命令(`db2tbst`) 获取与任何给定十六进制值关联的表空间状态。如果在向可恢复数据库中加载数据时指定了\
  \ `COPY NO` 选项，Load 程序会将表空间置于“正在加载”状态。表空间在加载操作期间保持在此状态，并在加载操作完成后恢复正常状态。此状态没有十六进制值。*\n\
  \n在指定 `SHOW DETAIL` 选项的情况下执行 `LIST TABLESPACES` 命令将显示关于每个表空间的以下额外信息：\n\n*   **表空间设计包含的总页数。**\
  \ 对于 DMS 表空间，这是与表空间相关的所有容器可用页数的总和。对于 SMS 表空间，这是当前正在使用的文件空间总量。\n*   **可存储用户数据的表空间中的可用页数。**\
  \ 对于 DMS 表空间，此数字是从总可用页数中减去开销所需的页数计算得。对于 SMS 表空间，此数字等于表空间设计的总页数。\n*   **已包含数据的表空间中的已用页数。**\
  \ 对于 SMS 表空间，此值等于表空间设计的总页数。\n*   **当前为空的表空间中的空页数。** 此信息仅适用于 DMS 表空间。\n*   **高水位线（High\
  \ watermark）。** 这是标记表空间地址空间当前“高水位线”或“结束”的页数（即表空间最后一个分配区之后的第一个空闲页的页码）。此信息仅适用于 DMS\
  \ 表空间。\n*   **页大小（Page size）。** 这是表空间中一个页数据所占据的字节数大小。\n*   **区大小（Extent size）。**\
  \ 这是表空间中一个区所包含的页数。\n*   **预取大小（Prefetch size）。** 这是从表空间中预先于当前查询引用的页面提前读取的数据页数，预见这些页将用于解析查询（被预取）。\n\
  *   **容器数量（Number of containers）。** 这是表空间使用的容器数量。\n*   **最小恢复时间（Minimum recovery\
  \ time）。** 如果要在表空间上执行时间点滚前恢复操作，这是您可以指定的的最早时间。\n*   **状态更改表空间 ID（State change table\
  \ space ID）。** 导致被查询的表空间进入等待加载或等待删除状态的表空间 ID。（只有在被查询的表空间处于等待加载或等待删除状态时，才会显示。）\n\
  *   **状态更改对象 ID（State change object ID）。** 导致被查询的表空间进入等待加载或等待删除状态的对象 ID。（只有在被查询的表空间处于等待加载或等待删除状态时，才会显示。）\n\
  *   **静止者数量（Number of quiescers）。** 将表空间置于静止（限制访问）状态的用户或应用程序数量。（只有在被查询的表空间处于 Quiesced:SHARE、Quiesced:UPDATE\
  \ 或 Quiesced:EXCLUSIVE 状态时，才会显示。）\n*   **每个静止者的表空间 ID 和对象 ID（Table space ID and\
  \ object ID for each quiescer）。** 导致被查询的表空间进入静止状态的表空间和对象的 ID。（只有当将表空间置于静止状态的用户或应用程序数量大于零时，才会显示此信息。）\n\
  \n\n\n\n\n因此，如果你想获取名为 `SAMPLE` 的数据库所创建的所有表空间的详细信息，可以通过连接到数据库并执行 `LIST TABLESPACES`\
  \ 命令来实现：\n\n![Image](img/187-1.jpg)\n\n当执行此命令时，输出结果大致如下：\n\n![Image](img/187-2.jpg)\n\
  \n![Image](img/188.jpg)\n\n![Image](img/189.jpg)\n\n你也可以使用内置表函数 `MON_GET_TABLESPACE`\
  \ 获取为特定数据库创建的所有表空间的详细信息。（第 5 章 “监控 DB2 活动”将更紧密地介绍这些监控元素。）\n\n## 获取容器信息\n\n正如你可以获取为特定数据库创建的表空间信息一样，你也可以通过执行\
  \ `LIST TABLESPACE CONTAINERS` 命令获取物理存储表空间数据的容器信息。该命令的语法如下：\n\n![Image](img/190-1.jpg)\n\
  \n| where: |\n| *TablespaceID* | 标识分配给要获取容器信息的表空间的内部 ID |\n\n在执行此命令时不指定 `SHOW DETAIL`\
  \ 选项，将为为数据库创建的每个表空间显示以下信息：\n\n*   容器在与指定表空间关联时分配的内部 ID\n*   容器在分配给指定表空间时用于引用的名称\n\
  *   指示该容器是目录（路径）容器、文件容器还是设备容器\n\n然而，如果你执行此命令并指定 `SHOW DETAIL` 选项，你可以获取关于每个表空间容器的以下附加信息：\n\
  \n*   **表空间容器设计的存储总页数。** 对于 SMS 表空间，这是容器当前正在使用的存储空间总量。\n*   **表空间容器中可存储用户数据的可用页数。**\
  \ 对于 DMS 表空间，该数字通过从可用总页数减去开销页数计算得出。对于 SMS 表空间，此值等于表空间容器设计的总页数。\n*   **可访问性。** 这指示容器是否可访问。\n\
  \n因此，获取与内部 ID 为 `2` 的表空间（在名为 `SAMPLE` 的数据库中）关联的容器的详细信息，你可以执行 `LIST TABLESPACE CONTAINERS`\
  \ 命令：\n\n![Image](img/190-2.jpg)\n\n当执行此命令时，你可能会看到类似所示的输出：\n\n![Image](img/191.jpg)\n\
  \n注意，如果由于某些原因特定的表空间容器变得不可用 `(Accessible = No)`，与该容器关联的表空间将自动处于离线（Offline）状态。在解决导致容器不可用的问题后，可以通过执行指定\
  \ `SWITCH ONLINE` 选项的 `ALTER TABLESPACE` SQL 语句将关联的表空间恢复到正常（Normal）状态。你也可以使用内置表函数\
  \ `MON_GET_CONTAINER` 获取为特定表空间创建的容器的详细信息。（第 5 章 “监控 DB2 活动”将更紧密地介绍这些监控元素。）`LIST\
  \ TABLESPACE` 和 `LIST TABLESPACE CONTAINERS` 命令在都将被弃用；请用 `MON_GET_TABLESPACE` 和\
  \ `MON_GET_CONTAINER` 函数代替。\n\n## 创建表空间\n\n之前你已经看到可以创建表空间。你可以通过执行 `CREATE TABLESPACE`\
  \ 语句来创建表空间。该语句的基本语法如下：\n\n![Image](img/191.jpg)\n\n![Image](img/192.jpg)\n\n![Image](img/193.jpg)\n\
  \n| where: |\n| *TablespaceID* | 标识要创建的表空间的名称 |\n| *PageSize* | 指定要创建的表空间的页大小（你指定的缓冲区页大小必须与要创建的表空间的页大小匹配，否则\
  \ `CREATE TABLESPACE` 语句将失败） |\n| *BufferPoolName* | 标识要创建的表空间将使用的缓冲区名称 |\n| *Container*\
  \ | 标识要使用的容器类型（`directory`、`file` 或 `device`） |\n| *ContainerPath* | 标识目录路径（仅当容器类型为\
  \ `directory` 时） |\n| *ContainerFile* | 标识文件路径（仅当容器类型为 `file` 时） |\n| *ContainerDevice*\
  \ | 标识设备名称（仅当容器类型为 `device` 时） |\n| *Size* | 指定容器的大小 |\n| *InitSize* | 标识为自动扩展的\
  \ DMS 表空间预分配的存储量 |\n| *IncSize* | 标识当表空间满额且请求更多空间时，启用了调整的表空间自动增加的量 |\n| *MaxSize*\
  \ | 标识启用了调整的表空间可以增加的最大尺寸 |\n| *ExtentPages* | 标识在另一个另一个容器之前写入单个空间容器的页数 |\n| *ExtentSize*\
  \ | 标识在另一个另一个容器之前写入单个空间容器的数据量；你为此参数指定的值被视为总字节数，除非你指示了字母 `K`（千字节）、`M`（兆字节）或 `G`（吉字节）\
  \ |\n| *PrefetchPages* | 标识在执行数据预取时从表空间读取的数据页数（预取允许在引用查询所需的数据之前读取它，从而减少查询等待 I/O\
  \ 的时间） |\n| *PrefetchSize* | 标识在执行数据预取时从表空间读取的数据量；你为此参数指定的值被视为总字节数，除非你指示了字母 `K`（千字节）、`M`（兆字节）或\
  \ `G`（吉字节） |\n| *Management* | 标识表空间管理类型（`SYSTEM` 或 `DATABASE`） |\n| *Type* | 标识表空间类型（`SMS`\
  \ 或 `DMS`） |\n\n\n\n\n\n因此，要创建一个名为 `TS_SMALL_SMS`、页面大小为 16 KB、使用目录 `/database/ts_small`\
  \ 作为存储容器并使用 `IBMDEFAULTBP` 缓冲池的 SMS 表空间，你需要执行一个如下所示的 `CREATE TABLESPACE` SQL 语句：\n\
  \n![Image](img/194.jpg)\n\n然而，如果你想创建一个名为 `TS_SMALL_DATA`、页面大小为 16 KB、使用文件 `ts_small_data`\
  \ 作为存储容器并使用 `IBMDEFAULTBP` 缓冲池的大型 DMS 表空间，请执行与下文内容相似的 `CREATE TABLESPACE` SQL 语句：\n\
  \n![Image](img/195-1.jpg)\n\n最后，要创建一个名为 `TS_LARGE_DATA` 且使用 `IBMDEFAULTBP` 缓冲池的自动存储表空间，你可以执行此\
  \ `CREATE TABLESPACE` SQL 语句：\n\n![Image](img/195-2.jpg)\n\n如果数据库启用了自动存储，则可以完全省略\
  \ `MANAGED BY AUTOMATIC STORAGE` 子句——该子句的缺失意味着使用自动存储。在这种情况下，不提供任何容器定义，因为 DB2 数据库管理器会自动分配容器。虽然你可以通过指定\
  \ `AUTOMATIC STORAGE NO` 子句来创建数据库，但 `AUTOMATIC STORAGE` 子句已弃用，并可能在未来的版本中被移除。\n\n\
  ## 修改表空间\n\n由于 SMS 表空间依赖操作系统进行物理存储空间管理，因此它们在成功创建后很少需要修改。然而，必须密切监控 DMS 表空间，以确保其用于存储的固定大小预分配文件或物理原始设备始终有足够的可用空空间来满足数据库的需求。当\
  \ DMS 表空间的可用空存储空间变得处于危险水平（通常小于 10 百比）时，你可以通过增加一个或多个容器的大小，或通过向其添加一个或多个新容器来增加更多可用空间。\n\
  \n若要调整现有表空间容器的大小、为现有表空间提供新容器以及更改现有表空间的属性，可以执行 `ALTER TABLESPACE` SQL 语句。该语句的基本语法为：\n\
  \n![Image](img/196-1.jpg)\n\n或\n\n![Image](img/196-2.jpg)\n\n或\n\n![Image](img/196-3.jpg)\n\
  \n或\n\n![Image](img/196-4.jpg)\n\n| where: | |\n| `TablespaceName` | 标识要分配给待修改表空间的名称\
  \ |\n| `Container` | 标识要向指定的表空间添加、调整大小或移除的一个或多个容器 |\n| `ContainerPages` | 标识以页面数计算的要为所有容器或\
  \ `Container` 参数中标识的容器添加、移除或分配的存储量 |\n| `ContainerSize` | 标识要为所有容器或 `Container`\
  \ 参数中标识的容器添加、移除或分配的存储量；你为此参数指定的值被视为总字节数，除非你还指示了字母 `K`（千字节）、`M`（兆字节）或 `G`（吉字节）——如果你指定了\
  \ `ContainerSize` 值，它将通过所提供的 `PageSize` 值转换为 `ContainerPages` 值 |\n| `PrefetchPages`\
  \ | 标识在执行数据预取时从表空间读取的数据页面页数 |\n| `PrefetchSize` | 标识在执行数据预取时从从表空间读取的数据量；你为此参数指定的值被视为总字节数，除非你还指示了字母\
  \ `K`（千字节）、`M`（兆字节）或 `G`（吉字节）——如果你指定了 `PrefetchSize` 值，它将通过被修改表空间的页面大小转换为 `PrefetchPages`\
  \ 值 |\n| `BufferPoolName` | 标识待修改表空间将使用的缓冲池名称（你指定的缓冲池页面大小必须与待修改表空间使用的页面大小匹配） |\n\
  | `IncSize` | 标识当启用自动调整大小的表空间已满并请求更多空间时，自动增加的数额 |\n| `MaxSize` | 标识启用自动调整大小的表空间可以自动增加到的最大尺寸\
  \ |\n\n因此，如果你想使用一个名为 `smalldata.1.tbs`、大小为 5 GB 且位于 `/database/data/` 目录下的固定大小预分配文件作为名为\
  \ `TS_SMALL_DATA` 的现有 DMS 表空间的新存储容器，可以通过执行如下所示的 `ALTER TABLESPACE` SQL 语句：\n\n![Image](img/197.jpg)\n\
  \n然而，要将名为 `TS_SMALL_DATA` 的现有 DMS 表空间的所有容器的大小扩展 200 MB，请执行此 `ALTER TABLESPACE` SQL\
  \ 语句：\n\n![Image](img/198-1.jpg)\n\n如果你想重命名表空间，请执行 `RENAME TABLESPACE` 命令（记住，`SYSCATSPACE`\
  \ 无法重命名）：\n\n![Image](img/198-2.jpg)\n\n除了容器的大小外，你还可以更改表空间的 `PREFETCHSIZE`、`OVERHEAD`\
  \ 和 `TRANSFERRATE`，类似于：\n\n![Image](img/198-3.jpg)\n\n## 为自动表空间添加容器\n\n如前所述，如果为数据库启用了自动存储，其表空间的容器和空间管理特性由\
  \ DB2 数据库管理器决定。虽然你可以使用 `ALTER TABLESPACE` 命令为表空间添加容器，但无法为自动存储添加容器。\n\n那么在创建数据库后，如何向用于自动存储的集合添加存储路径？你必须使用\
  \ `STROUP` 语句。该语句的基本语法为：\n\n![Image](img/198-4.jpg)\n\n| where: | |\n| `StoGrpName`\
  \ | 标识要向其自动存储路径池添加路径的存储组名称 |\n| `StoragePath` | 标识要向自动存储路径集合添加的一个或多个新路径（绝对路径） |\n\
  \n因此，如果你想为名为 `SAMPLE` 的数据库添加 `/database/path1` 和 `/database/path2`，可以通过执行 `ALTER\
  \ STROUP` SQL 语句：\n\n![Image](img/199-1.jpg)\n\n列出存储组属性，使用表函数 `ADMIN_GET_STORAGE_PATHS`，如下：\n\
  \n![Image](img/199-3.jpg)\n\n## 可回收存储\n\n可回收存储是 DB2 9.7 中引入的一项功能，它合并高水位以下已使用的扩展区，并将表空间中的未使用扩展返回给操作系统以便重用。在\
  \ DB2 早期版本中，释放容器存储到系统的唯一方法是删除容器或通过消除高水位以上的未使用扩展来缩小容器大小。没有直接的机制可以降低高水位；但间接机制是根据 `db2dart`\
  \ 工具的建议对表和索引进行在线/离线重组。\n\n\n\n\n\n对于自动存储表空间，您可以使用带有 `REDUCE MAX` 子句的 `ALTER TABLESPACE`\
  \ 命令来释放所有未使用的空间并降低高水位。这消除了了运行 `db2dart`、删除并重建对象、以及导出和导入数据的过程。该命令看起来如下：\n\n![Image](img/200-1.jpg)\n\
  \nDMS 表空间需要两个步骤来释放未使用的区（extent）：\n\n### 步骤 1：使用 `ALTER TABLESPACE` 命令降低高水位：\n\n\
  ![Image](img/200-2.jpg)\n\n### 步骤 2：在 `ALTER TABLESPACE` 命令中指定 `REDUCE`、`RESIZE`\
  \ 或 `DROP` 子句来缩小容器大小：\n\n![Image](img/201-1.jpg)\n\n要查看表空间属性（如高水位、分配的页总数、使用的页数和可回收状态），请使用\
  \ `MON_GET_TABLESPACE` 表函数，类似于所示：\n\n![Image](img/201-2.jpg)\n\n要查看区移动操作，可以使用此 `MON_GET_EXTENT_MOVEMENT_STATUS`\
  \ 表函数：\n\n![Image](img/201-3.jpg)\n\n## 删除表空间\n\n当您删除表空间时，DB2 数据库管理器会删除该表空间中的所有数据，从操作系统删除容器，移除目录项，并导致表空间中定义的所有对象被删除或标记为无效。请记住，您无法在不删除相关表空间的情况下删除某个表空间。例如，如果您在表空间\
  \ `TS_SMALL_DATA` 中有表数据，在 `TS_SMALL_INDEX` 中有索引数据，则你必须同时删除 `TS_SMALL_INDEX` 和 `TS_SMALL_DATA`。\n\
  \n如果您想删除用户表空间，请执行 `DROP TABLESPACE` 命令，如下：\n\n![Image](img/202-1.jpg)\n\n要删除用户临时表空间，请确认该表空间中没有定义任何已声明或创建的临时表。同样，如果您想删除系统临时表空间，请确保已创建另一个页大小相似的系统临时表空间，然后删除旧的。\n\
  \n## 将 DMS 表空间转换为自动存储\n\n为了简化存储管理，您可以通过执行以下步骤将现有的 DMS 表空间转换为自动存储：\n\n### 步骤 1：识别您想要从\
  \ DMS 转换为自动存储的表空间，并识别您希望该表空间使用的存储组。\n\n您可以通过执行此命令使用 `SNAP_GET_TBSP` 表函数来查找转换目标：\n\
  \n![Image](img/202-2.jpg)\n\n要找到用于放置表空间的最佳存储组，请使用 `ADMIN_GET_STORAGE_PATHS` 表函数，类似于所示：\n\
  \n![Image](img/203-1.jpg)\n\n### 步骤 2：数据准备好后，可以通过执行此命令将表空间转换为自动存储：\n\n![Image](img/203-2.jpg)\n\
  \n### 步骤 3：通过执行 `REBALANCE` 命令将内容从旧容器移动到新的自动存储路径：\n\n![Image](img/203-3.jpg)\n\n\
  ### 步骤 4：使用此命令监控平衡操作的进度：\n\n![Image](img/203-4.jpg)\n\n## 表空间的设计方面\n\n糟糕的表空间设计会导致严重影响。表空间的设计原则如下：\n\
  \n*   **区（Extent size）。** 这是区的数量。一个经验法是 `256` 或 `512` KB。\n*   **页大小（Page size）。**\
  \ 这是页的大小。您可以使用 `4` KB、`8` KB、`16` KB 或 `32` KB。\n*   **文件缓存（File caching）。** `FILE\
  \ CACHING` 选项允许数据库使用文件系统进行缓存。\n*   **预取大小（Prefetch size）。** 这是要预取的数据量。通常建议将其设置为\
  \ `AUTOMATIC`。\n*   **设备读取速率（Device read rate）。** 您可以使用 MB/秒指定设备读取速率。例如，`100` MB/s。\n\
  \n## 存储组\n\n正如您在之前的章节中学到的，存储组是存储路径的集合，例如固态硬盘（SSD）、串行连接（SAS）和串行接口（SATA）。一个存储组可以关联多个表空间；但一个表空间只能关联一个存储组。\n\
  \n可以使用 `CREATE STOGUP` 命令创建存储组。在最简单的形式下，`CREATE STOGUP` 命令的语法如下：\n\n| 参数 | 说明 |\n\
  | :--- | :--- |\n| `StoGrpName` | 为创建后的存储组分配的唯一名称 |\n| `StoragePath` | 为存储组添加的存储路径\
  \ |\n| `DeviceHead` | 以毫秒为单位的 I/O 控制器时间和磁盘延迟；通常，您从存储制造商处获取此值 |\n| `DeviceReadRate`\
  \ | 以 MB/秒为单位的设备读取规格；默认值为 100 MB/s |\n| `DataTag` | DB2 工作管理器 (WLM) 用于确定数据库活动处理优先级的标签名称；默认值为\
  \ `NONE` |\n\n如果您想创建一个开销为 `0.8` 且读取速率为 `512` MB/s 的存储组 `SG_HOT`，请执行 `CREATE STOGUP`\
  \ 命令：\n\n![Image](img/205-2.jpg)\n\n要使用存储组 `SG_HOT` 创建一个表空间 `Q4_2014` 来存储近期数据，可以执行\
  \ `CREATE TABLESPACE` 命令，类似于所示：\n\n![Image](img/206-1.jpg)\n\n## 修改存储组\n\n您可以使用\
  \ `ALTER TABLESPACE` 命令更改以下存储组设置：\n\n*   `OVERHEAD`\n*   `DEVICE READ RATE`\n* \
  \  `DATA TAG`\n*   添加或移除存储路径\n\n\n\n\n\n要使用新添加存储路径，请运行带有 `REBALANCE` 子句的 `ALTER\
  \ TABLESPACE` 命令：\n\n![Image](img/207-208.jpg)\n\n如果你想删除存储路径，可以执行以下命令来实现：\n\n![Image](img/208-1.jpg)\n\
  \n## 重命名存储组\n\n你可以使用 `RENAME STOGROUP` 命令来重命名一个可用存储组，如示例命令所示：\n\n![Image](img/208-2.jpg)\n\
  \n## 删除存储组\n\n要删除一个可用存储组，请执行 `DROP STOGROUP` 命令，如下所示：\n\n![Image](img/208-3.jpg)\n\
  \n在删除一个可用存储组之前，你必须将相关的表空间移动到另一个存储组：\n\n![Image](img/209.jpg)\n\n## 存储组的设计方面\n\n\
  存储组包含具有相似特征的存储路径。关于存储组需要考虑的一些关键存储属性包括：\n\n* 存储容量\n* 延迟\n* 数据传输率\n* RAID 级别\n\n##\
  \ 关于声明临时表和用户临时表的说明\n\n声明临时表是一种特殊的表，用于代表单个应用程序持有临时数据。与基础表一样，你可以在声明临时表上创建索引并收集统计信息。基础表不同，基础表的描述和约束存储在其所属数据库的系统目录表中，而声明临时表不是持久的，只能由创建它的应用程序使用——且仅在应用程序运行期间有效。当创建声明临时表的应用程序终止时，表中的将被删除，表的描述也会删除。（然而，存储在临时表中的数据可以跨越事务边界。）\n\
  \n另一个显著区别在于每种类型表的数据存储位置。在应用程序创建和使用声明临时表之前，用户必须为应用程序将操作的数据库至少创建一个用户临时表空间，并且相应的用户必须拥有使用该表空间所需的权限。（当用户创建数据库时，默认不会创建用户临时表空间）。然而，基础表是在普通表空间创建的；如果你没有为基础表指定表空间，其数据将存储在\
  \ `USERSPACE1` 表空间中，该空间是在创建数据库时默认创建的。\n\n## 模式 (Schemas)\n\n表空间在物理上存储数据库中的对象，而模式在逻辑上对数据库中的其他对象进行分类和分组，无论它们物理上存储在何处。由于模式本身也是对象，因此它们拥有相关的权限，允许模式所有者控制哪些用户可以创建、修改和删除其内部的对象。\n\
  \n数据库中的大多数对象使用双部分命名约定进行命名。名称的第一部分（最左侧）称为 `模式名称`（schema name）或 `限定符`（qualifier），第二部分（最右侧）称为\
  \ `对象名称`（object name）。在语法上，这两部分被连接并用点（.）分隔（例如，`HR.EMPLOYEE`）。当你首次创建一个可以由模式名限定的对象（如表、视图、索引、用户定义数据类型、UDF、别名、程序包或触发器）时，它将根据其名称中的限定符被分配给特定的模式。图\
  \ 3.4 展示了在表创建过程中名为 `STAFF` 的表是如何分配给 `PAYROLL` 模式的。\n\n![Image](img/210.jpg)\n\n\
  *图 3.4：将表对象分配给模式*\n\n某些模式名称是保留的，无法使用。示例包括创建数据库时自动创建的四个模式的名称：`SYSIBM, SYSCAT, SYSSTAT,`\
  \ 和 `SYSFUN.` 如果用户在创建对象时没有指定模式/限定符名称，该对象将被分配给默认模式，该模式通常是当前连接到数据库并创建对象的个人 ID。\n\n\
  每当创建一个分配了不同于现有模式名称的限定符的数据对象时，模式就会隐式创建——前提是创建对象的用户持有 `IMPLICIT_SCHEMA` 权限。（另有规定，当创建新数据库时，`PUBLIC`\
  \ 组会被赋予 `IMPLICIT_SCHEMA` 权限。此权限允许任何成功连接到数据库的用户在模式尚不存在的情况下隐式地创建新模式。）你可以通过执行 `CREATE\
  \ SCHEMA` SQL 语句来显式地创建模式。该语句的基本语法为：\n\n![Image](img/211-1.jpg)\n\n或\n\n![Image](img/211-2.jpg)\n\
  \n或\n\n![Image](img/211-3.jpg)\n\n| where: | |\n| :--- | :--- |\n| `SchemaName`\
  \ | 标识要分配给被创建模式的名称 |\n| `AuthorizationName` | 标识在模式创建后将将所有权授予哪个的用户 |\n| `SQLStatement`\
  \ | 指定在 `CREATE SCHEMA` 语句中执行的一个或多个 SQL 语句（仅以下 SQL 语句有效：`CREATE TABLE, CREATE VIEW,\
  \ CREATE INDEX, COMMENT ON,` 和 `GRANT`） |\n\n如果你指定了模式名称但未提供授权名称，则发布 `CREATE SCHEMA`\
  \ 语句的用户的授权 ID 将获得新创建模式的所有权。然而，如果你指定了授权名称但未提供模式名称，则新模式将分配与所使用的授权名称相同的名称。\n\n因此，如果你想显式地创建一个名为\
  \ `PAYROLL` 的模式，并将模式的所有权授予用户 `DB2ADMIN,`，请执行类似下面的 `CREATE SCHEMA` 语句：\n\n![Image](img/211-4.jpg)\n\
  \n但如果你想显式地创建一个名为 `INVENTORY,` 的模式，同时在 `INVENTORY,` 模式内创建一个名为 `PARTS` 的表，你可以通过执行类似的\
  \ `CREATE SCHEMA` 语句：\n\n![Image](img/212-1.jpg)\n\n既然模式可以通过创建对象并分配模式名称来隐式创建，你可能会疑惑为什么有人想使用\
  \ `CREATE SCHEMA` 语句显式创建模式。显式创建模式的主要由于是访问控制。显式创建的模式有一个所有者，该所有者由执行 `CREATE SCHEMA`\
  \ 语句的用户授权 ID 或由在创建模式时传递所有权的授权 ID 标识。模式所有者拥有创建、修改和删除存储在模式中的任何对象所需的权限，以及删除模式本身的权限；模式所有者还有权向其他用户和组授予在模式中创建、修改和删除对象的权限（`CREATEIN,\
  \ ALTERIN,` 和 `DROPIN` 权限）。（我们将在第 8 章](#015_Chapter008.html_ch-8) “安全性”）\n\n然而，隐式创建的模式被认为由\
  \ `SYSIBM` 用户所有。任何用户都可以在隐式创建的模式中创建对象，并且模式中的每个对象由创建它的用户控制。此外，只有拥有 `SYSADM` 或 `DBADM`\
  \ 权限的用户才允许删除隐式创建的模式。因此，为了让管理员以外的用户对模式以及存储在该模式的所有数据对象具有完全控制权，必须显式创建模式。\n\n在删除模式之前，你必须删除模式中的所有对象或将它们移动到另一个模式。要删除模式，请执行\
  \ `DROP SCHEMA` 命令：\n\n![Image](img/212-2.jpg)\n\n## 范围聚集表和范围分区表\n\n\n\n\n\n在此之前，你已经看到表空间控制着数据的物理存储位置，并在数据库对象（如表、索引和视图）与实际存储对象数据的一个或多个容器（即目录、文件或原始设备）之间提供了一个间接层。因此，数据库对象在创建时被分配到表空间的方式决定了数据在磁盘上的物理存储方式。通过创建**范围聚类表（RCTs）**或利用范围分区表，你可以进一步控制表数据的物理存储。\n\
  \n## 范围聚类表\n\nRCT 是一种表，其数据根据指定的键序列取值范围，按升序键序列进行组织，并具有固定的大小。当数据在表的一列或多列上紧密聚类时，RCT\
  \ 特别别有用——即选定列中的最小值和最大值定义了可能取值的范围。在定义范围内的每个可能的键值在物理表中都有一个预定义的位置。因此，在创建表时，必须预分配并可用\
  \ RCT 所需的空间，且该空间必须足够存储指定范围内的行数乘以行大小的结果。\n\nRCT 在查询处理期间可以带来显著的性能优势，因为所需的 I/O 操作更少。此外，RCT\
  \ 需要的缓存缓冲区分配较少，因为不需要维护次级对象；不需要索引也不支持索引。\n\n你在创建表时，通过指定 `CREATE TABLE` SQL 语句的 `ORGANIZE\
  \ BY KEY SEQUENCE` 子句来创建 RCT。该可选子句的语法如下：\n\n![Image](img/213.jpg)\n\n| where: |\n\
  \n| `ColumnName` | 由名称标识一个或多个列，其值将用于确定 RCT 的顺序 |\n\n| `Start` | 指定允许的取值范围的低端（只有在指定了\
  \ `ALLOW OVERFLOW` 选项时，才允许小于指定起始值的值） |\n| `End` | 指定允许的取值范围的高端（只有在指定了 `ALLOW OVERFLOW`\
  \ 选项时，才允许大于指定结束值的值） |\n| `PercentFree` | 指定每页预留的空闲空间百分比（每页的第一行不受限制地添加；当向页中添加额外行时，将进行检查，以确保页面的指定百分比保持为空闲）\
  \ |\n\n如果你指定了 `DISALLOW OVERFLOW` 子句，键值将不允许超出定义范围。然而，指定 `ALLOW OVERFLOW` 子句将允许键值超出定义范围，在这种情况下，溢出数据将存放在动态分配的溢出区域。超出预定义范围的溢出\
  \ RCT 会导致性能下降。\n\n因此，如果你想创建一个名为 `CUSTOMERS` 的 RCT，该表具有两个名为 `CUSTOMER_ID` 和 `CUSTOMER_NAME`\
  \ 的列，其中 `CUSTOMER_ID` 列将成为决定记录如何物理存储的唯一键，且 `CUSTOMER_ID` 列仅能被分配 1 到 100 之间的唯一值，请执行一条类似于下图所示的\
  \ `CREATE TABLE` SQL 语句：\n\n![Image](img/214.jpg)\n\n一旦创建并填充了该表，如果应用程序需要访问 ID 为\
  \ 2 的客户的行，DB2 数据库管理器将通过使用从表逻辑起始处的预定义偏移量，查找 `CUSTOMERS` 表中的第二行。如果更新了某行导致键列值被修改，则会将更新的行复制到新位置，并删除旧的行副本，从而维护表中数据的聚类性。\n\
  \n### RCT 的限制\n\n在某些情况下，你无法使用 RCT，且某些工具无法在 RCT 上操作。限制如下：\n\n* RCT 不能用于 pureScale\
  \ 环境。\n* 分区表不能是 RCT。\n* 声明的和已创建的临时表不能是 RCT。\n* 自动摘要表不能是 RCT。\n* 不支持 `LOAD` 命令。\n\
  * 不支持 `REORG` 命令。\n* 多维聚类和聚类索引与 RCT 不兼容。\n* 不支持压缩。\n* 不支持 RCT 的反向扫描。\n* 不支持 `IMPORT`\
  \ 命令的 `REPLACE` 参数。\n* `ALTER TABLE … ACTIVATE NOT LOGGED INITIALLY.` 上不支持 `WITH\
  \ EMPTY TABLE` 子句。\n\n### 范围分区表\n\n表分区（也称为 `range partitioning`）是一种数据组织方案，根据一列或多列的值，将表数据划分到多个称为\
  \ `data partitions`（数据分区）或 `ranges` 的多个存储对象中。每个数据分区单独存储，使用的存储对象可以在不同的表空间中、同一个表空间中或两者的结合。表分区通过使用数据分区功能（DPF）提高了性能，并消除了创建分区数据库的需求。使用表分区的其他优势包括：\n\
  \n* **数据的滚入和滚出（roll-in and roll-out）简单。** 滚入分区表数据允许将新范围作为额外数据分区轻松合并到分区表中。滚出分区表数据允许你轻松地将数据范围从分区表中分离出来，以便后续的清理或归档。可以使用\
  \ `ALTER TABLE` 语句的 `ATTACH PARTITION` 和 `DETACH PARTITION` 子句快速地进行滚入和滚出操作。\n\n\
  * **大表管理更简单。** 表级管理变得更加灵活，因为你可以在单个数据分区上执行管理任务。此类任务包括分离和重新附加数据分区、备份和恢复单个数据分区以及重新组织单个索引。此外，通过将耗时的维护操作分解为较小的操作，可以缩短时间。例如，当每个数据分区放置在单独表空间时，可以在数据分区级别执行备份操作。因此，可以一次备份分区表的一个分区。\n\
  \n* **灵活的索引放置。** 通过表分区，你可以将索引放在不同的表空间，从而对索引放置进行更细粒度的控制。\n\n* **更好的查询处理。** 在解析查询时，根据使用的查询谓词可能会消除一个或多个数据分区。这种被称为*数据分区消除（data\
  \ partition elimination）*的功能提高了许多决策支持查询的性能，因为在返回结果集之前必须分析更少的数据。\n\n表数据根据 `CREATE\
  \ TABLE` 语句中 `PARTITION BY` 子句的指定划分到多个存储对象。该可选子句的语法如下：\n\n![Image](img/216-1.jpg)\n\
  \n或\n\n![Image](img/216-2.jpg)\n\n| where: |\n\n| `ColumnName` | 由名称标识一个或多个列，其值将用于确定存储特定行的数据分区（你指定的列组组成了表的分区键）\
  \ |\n| `PartitionName` | 为要创建的数据分区指定的唯一名称 |\n| `Start` | 指定每个数据分区范围的低端 |\n| `End`\
  \ | 指定每个数据分区范围的高端 |\n| `Constant` | 当使用自动生成的语法时，指定每个数据分区范围的宽度；数据分区将从 `STARTING FROM`\
  \ 值开始创建，并包含此数量的值——这种语法仅支持分区键由分配了数值、日期、时间或时间戳数据类型的单列组成的情况 |\n\n\n\n\n\n| `DurationLabel`\
  \ | 如果您为分区键列分配了日期、时间或时间戳数据类型，则该字段标识与指定的 `Constant` 值关联的时长；此参数的值为：`YEAR, YEARS, MONTH,\
  \ MONTHS, DAY, DAYS, HOUR, HOURS, MINUTE, MINUTES, SECOND, SECONDS, MICROSECOND,`\
  \ 和 `MICROSECONDS` |\n| `TableSpaceName` | 标识存储每个数据分区的表空间 |\n\n因此，如果您想创建一个名为 `SALES`\
  \ 的表，并对其进行分区，使得每个季度的数据存储在不同的数据分区中，且每个分区位于不同的表空间，请执行类似下方的 `CREATE TABLE` SQL 语句：\n\
  \n![Image](img/217-1.jpg)\n\n但是，如果您想创建一个名为 `DEPARTMENTS` 的表，并对其进行分区，使得数值在 0 到 9\
  \ 范围内的行存储在位于一个表空间的分区中，数值在 10 到 19 范围内的行存储在位于另一个表空间的另一个分区中，以此类推，请执行类似下方的 `CREATE\
  \ TABLE` SQL 语句：\n\n![Image](img/217-218.jpg)\n\n注意，当为范围分区表创建索引时，除非另有指定，否则索引数据将存储在包含第一个分区数据的表空间中。例如，假设您执行以下\
  \ `CREATE INDEX` SQL 语句为刚创建的 `DEPARTMENTS` 表创建索引：\n\n![Image](img/218-1.jpg)\n\n\
  执行此语句后，名为 `DEPT_IDX` 的索引数据将存储在名为 `TBSP0` 的表空间中。如果您希望索引数据存储在包含最后一个分区数据的表空间中（名为 `TBSP3`\
  \ 的表空间），则必须执行以下 `CREATE INDEX` SQL 语句：\n\n![Image](img/218-2.jpg)\n\n您可以在分区表上创建分区索引，以便进行高效的\
  \ `ATTACH` 和 `DETACH PARTITION` 操作。这也有助于在必要时重组特定的数据分区，而不是重组整张表。您可以使用 `CREATE TABLE`\
  \ 命令为每个数据分区的索引指定单独表空间：\n\n![Image](img/218-219.jpg)\n\n### 列出数据分区\n\n如果您想列出数据分区属性（如分区\
  \ ID、分区名称、表空间 ID、访问模式和范围），可以使用 `DESCRIBE DATA PARTITIONS` 命令，如下所示：\n\n![Image](img/219-220.jpg)\n\
  \n访问模式 `F`（全访问）代表数据分区具有很高的数据质量。然而，如果存在任何 `N`（无访问），您将必须识别数据问题。\n\n### 卸载数据分区\n\n\
  从基表中卸载数据分区包含两个阶段：卸载逻辑分区以及通过异步索引清理过程将卸载的分区转换为独立的基表。\n\n您可以使用 `ALTER TABLE … DETACH\
  \ PARTITION` 命令从基表中卸载数据分区：\n\n![Image](img/220.jpg)\n\n要查看异步分区卸载操作，请执行 `LIST UTILITIES\
  \ SHOW DETAIL` 命令，如下所示：\n\n![Image](img/220-221.jpg)\n\n### 挂载数据分区\n\n将数据分区挂载到基表中包含两个步骤：将分区挂载到基表以及执行数据完整性检查（例如范围验证和约束检查）。\n\
  \n要将数据分区挂载到基表，请使用 `ALTER TABLE … ATTACH PART` 命令：\n\n![Image](img/221-1.jpg)\n\n\
  可以通过执行以下命令查询系统目录表，以识别处于 Set Integrity Pending 状态的表：\n\n![Image](img/221-2.jpg)\n\
  \n要解决表上的 Set Integrity Pending 状态，请使用此示例命令：\n\n![Image](img/221-3.jpg)\n\n### 多温度存储\n\
  \n企业级数据仓库环境中存储的数据量正以指数级增长增长。与此同时，终端用户的预期也越来越高。这里的挑战是在不影响应用程序查询性能和存储成本的情况下存储海数据。\n\
  \n通过 DB2 10.1，您可以根据数据的温度（热、温、冷）对数据仓库数据进行分类。数据的温度根据以下因素决定：\n\n* 数据的访问频率\n* 访问该数据的查询性能有多关键\n\
  * 数据的久旧程度\n\n您可以配置数据库，使频繁访问的数据存储在 SSD 等快速存储上，不经常访问的数据存储在 SAS 驱动器等稍慢的存储上，极少访问的数据存储在\
  \ SATA 驱动器等慢存储上，如图 3.2 所示。此功能降低了存储成本，因为并不是所有数据都需要存储在快速昂贵的驱动器上。由于可以将最新数据存储在快速驱动器上，有助于获得更好的用户体验。\n\
  \n以下步骤提供了有关如何为当前财年的销售数据实现多温度数据存储的更多信息：\n\n**步骤 1：** 创建三个存储组：存储频繁访问数据的 `SG_HOT`、存储不经常访问数据的\
  \ `SG_WARM` 以及存储偶尔访问数据的 `SG_COLD`：\n\n![Image](img/222.jpg)\n\n**步骤 2：** 创建四个表空间来存储数据，并将其分配给相应的存储组：\n\
  \n![Image](img/223.jpg)\n\n**步骤 3：** 根据日期创建范围分区表以存储销售数据：在上述示例中，2014 年第一季度的数据存储在表空间\
  \ `TBSP0` 中，2014 年第二季度的数据存储在 `TBSP1`，2014 年第三季度的数据存储在 `TBSP2`，2014 年第四季度的数据存储在 `TBSP3`。您还可以执行\
  \ `DESCRIBE DATA PARTITIONS` 命令来验证存储分配：\n\n![Image](img/223-224.jpg)\n\n**步骤 4：**\
  \ 调整温度。在某个时刻，2015 年第一季度的新数据将加载到数据库中，由于性能原因具有更高的优先级。您可以将表空间 `TBSP2` 与存储组 `SG_COLD`\
  \ 关联，`TBSP3` 与 `SG_WARM` 关联，并将新的 `TBSP4` 留在快速存储组 `SG_HOT` 上。使用 `ALTER TABLESPACE`\
  \ 命令在存储组之间在线移动表空间。一组命令如下：\n\n![Image](img/224.jpg)\n\n## 关于 MDC、MQT 和 ITC 的说明\n\n\
  多维聚集（MDC）提供了一种灵活、连续且自动的表数据聚集优雅方法。MDC 允许表同时在多个键（或维度）上进行物理聚集。与任何其他表一样，MDC 表还可以定义视图、MQT、引用完整性、触发器、RID\
  \ 索引和复制。在查询性能方面，涉及聚集表指定维度任何组合的范围查询都将受益，因为它们只需访问包含特定维度值的页。\n\n在创建 MDC 表时，可以指定用于聚集表数据的维度键（或键）。每个指定的维度都可以用一个列或多个列定义，类似于索引键。系统将为指示的每个维度自动创建一个维度块索引，并且该索引将用于沿每个指定的维度快速高效地访问数据。维度块索引指向的是区区而不是单个行，因此比普通索引小得多。您可以使用这些维度块索引非常快速地访问包含特定维度值的表区。\n\
  \n\n\n\n此外，系统会自动创建一个块索引（block index），包含所有维度键列。块索引在插入和更新期间维护数据的聚类性，并提供对数据的快速高效访问。系统还会自动创建一个包含所有维度键列的复合块索引。该复合块索引在插入和更新期间维护数据的聚类性。复合块索引还用于查询处理，以访问具有特定维度值的表中的数据。\n\
  \n在创建表时，可以通过指定 `CREATE TABLE` SQL 语句的 `ORGANIZE BY DIMENSIONS` 子句来创建 MDC 表。该可选子句的语法如下：\n\
