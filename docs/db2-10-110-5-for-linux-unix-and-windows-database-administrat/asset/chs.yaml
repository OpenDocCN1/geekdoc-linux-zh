- "# DB2 10.1/10.5 Linux、UNIX 和 Windows 数据库管理：认证考试指南\n\n\n\n![](img/9781583477441_cover.jpg)\n\
  \n# 推荐读\n\n\n这本书不仅仅是一本典型的认证和学习指南。作者们尽力确保认证考试中测试的各种主题不仅被涵盖，而且让读者能够深入理解。也就是说，这本书是理解\
  \ `DB2` 各种特性的卓越指南，更重要的是，它告诉了你在什么情况下应该使用这些功能。\n\n*Hamdi Roumani*\n*DB2 开发人员*\n*IBM\
  \ 多伦多软件实验室*\n\nMohan 和 Kent 的更新将这本原本优秀的书提升了一个新的高度。在书中，你将找到关于 `V10.1/V10.5` 中大多数新功能所需的所有知识。此外，还有关于\
  \ `V9.x` 功能的额外信息，这对新手和资深 DBA 都有帮助。我特别喜欢示例题，它们设计得巧妙，能够引导读者思考，并对正确和错误的答案提供了详细的解释。\n\
  \n*Colin A. Chapman*\n*DB2 DBA 首席*\n*IBM 英国*\n\n这本书是一部杰作。多年来，我与许多 DBA 共事过，而 Mohan/Kent\
  \ 是最好的——在这里，他们将多年的 DBA 经验提炼成一部百科全书，它超越了通过认证考试本身。无论你是新手 DBA、正在接触 `DB2` 的资深 DBA，还是需要加深或扩展技能的资深\
  \ DBA，这本书都是为为你准备的。\n\n*Simon Woodcock*\n*数据仓库顾问*\n*IBM 信息管理*\n\n这本书不仅是一份宝贵的学习指南，还是一本你可能会经常查阅的优秀参考。命令示例非常有帮助，学习闪闪卡非常出色。你不仅能找到示例认证题，还能找到带有解释的问题答案。Mohan\
  \ 赢得了 2013 年全球 `DB2’s GOT TALENT`or，而 Kent 曾作为嘉宾出现在 `The DB2Night Show™` 上，讲述了他早期\
  \ `IBM BLU` 和 `pureScale` 的成功经验。有这样一本由拥有丰富实践经验的真实人士编写的有用书籍，绝对令人耳目一新。\n\n*Scott Hayes*\n\
  *DBI Software 总裁兼创始人*\n*IBM DB2 GOLD 顾问及 IBM Champion*\n*The DB2Night Show 创者兼主持人*\n\
  \n它带你从基础知识一直学习到用于优化真实生产系统的高级概念。本指南对所有人都有用，从正在建立第一个系统的新手，到追赶最新最棒工具和技巧的长期 `DB2` DBA。每一章中的自测考试确保你在触碰生产环境之前已经正确掌握了知识。\n\
  \n*Andrew Buckler*\n*IBM 信息管理云市场切入*\n\n在过去的几年里，我有极大的幸运能与 Mohan 合作，并一直依靠他的 `DB2`\
  \ 知识和专业技能来设计、实施以及维持我们许多高可用、业务关键的系统以最佳性能运行。正如你无疑所知的，认证考试涵盖的材料范围非常广泛。该资源旨在为 `DB2`\
  \ 专业人员提供成功获得认证所需的信息，甚至仅仅是扩展他们现有的 `DB2` 知识范围。\n\nMohan 和 Kent 做得非常出色，将他们在实验室环境以及大型全球消费品公司现场生产环境中的多年经验，提炼成一本逻辑清晰、组织良好的参考书。每个章节都包含基础知识，加上作者的宝贵见解，并有示例考试题以及详细答案的支持，我发现这些对于强化材料非常有用。我深信，有了本指南，你的认证就不远了！\n\
  \n祝你学习愉快，并祝好运！\n\n*Eric Sheley*\n*全球 IT 总监*\n*FTSE 100 全球消费品公司*\n\n![DB2 10.1/10.5\
  \ for Linux, UNIX, and Windows Database Administration 书名](img/iii.jpg)\n\n## **DB2\
  \ 10.1/10.5 Linux、UNIX 和 Windows 数据库管理：认证学习指南**\n\n**Mohankumar (Mohan) Saraswatipura\
  \ 和 Robert (Kent) Collins**\n\n\n\n## 关于作者\n\n**Mohankumar (Mohan) Saraswatipura**\
  \ 在 `Kronsys, Inc.` 数据库解决方案架构师，专注于 `IBM DB2`、`Linux`、`UNIX` 和 `Windows` 解决方案。在担任目前的职位之前，他在\
  \ `Reckitt Benciser Group, plc (UK)` 数据库解决方案架构师，专注于 `IBM Smart Analytics System\
  \ 5600`、`Siebel`、`SQL Server` 和 `SAP HANA` 解决方案。Mohan 是 `IBM Champion`（2010–2015）以及\
  \ `2013 DB2’s Got Talent` 获奖者。他为 `IBM developerWorks` 和 *IBM Data Magazine* 发表了数十篇技术论文。他是\
  \ `IBM 认证 DB2 高级数据库管理员`、`DB2 开发者`以及 `DB2 问题诊断大师`。Mohan 拥有计算机科学技术硕士（M Tech）学位和执行工商管理硕士（MBA,\
  \ IT）。Mohan 与妻子 `Dr. Nirmala` 居住在华盛顿特区地区；他们有一个孩子。\n\n\n\n\nRobert (Kent) Collins\
  \ 是 Shiloh Consulting, Inc. 的创始人，目前担任 BNSF 铁路的数据库解决方案架构师。他是 IBM 冠军（2010-2015），并是\
  \ DB2Night Show、IDUG 和 IOD（IBM Insight）会议的频繁演讲者。Kent 自 1984 年 `DB2` 面向市场以来一直持续地与该技术打交道，积累了丰富的知识和经验。他毕业于德克萨斯州大学达拉斯分分校，主修数学和计算机科学。他是\
  \ IBM 认证解决方案专家，还拥有 `DB2`、`AIX`、`Linux`、`.NET`、`Oracle`、`SQL Server`、`Windows` 和\
  \ `z/OS` 的认证。Kent 精通多种编程语言，作为 Java 架构师，专注于企业级高可用（HA)/性能系统。他与妻子 Vicki 住在达拉斯，他们有三个孩子和一个孙子。\n\
  \n## 致谢\n\nMohan 和 Kent 想对 Hamdi Roumani、Colin A. Chapman 和 Simon Woodcock 在审阅过程中付出的努力表示感谢。他们对本书的评审和建议对于确保材料对\
  \ `DB2` 社区有利且易于理解具有无法等的价值。\n\n我们要感谢以下人员，他们通过贡献书籍、技术建议或评论提供了巨大的帮助。\n\n*   Paul Zikopoulos（IBM\
  \ Analytics 客户成功副总裁，IBM 加多伦多实验室，加拿大），他审阅了整本书并撰写了序言。\n*   Scott Hayes（DBI Software\
  \ 总裁兼创始人），他从专家角度审阅了监控章节并撰写了推荐证。\n*   Andrew Bucker（IBM, IM Cloud 市场进入），他审阅了整本书并撰写了推荐证。\n\
  *   Eric Sheley（FTSE 100 全球消费品公司全球 IT 总监），他从客户角度审阅了本书并撰写了推荐证。\n\n感谢我们 `DB2` 的营销之星\
  \ Susan Visser，她不懈的努力让这本书上市，并通过社交媒体发布了书籍公告。\n\n最后，感谢我们的 MC Press 在线编辑和制作团队，特别是 Cindy\
  \ Bushong、Anne Grubb 和 Katie Tipton，感谢他们在编辑过程中辛勤工作。\n\n# 书籍审稿员\n\n## Hamdi Roumani\n\
  \nHamdi 在 `DB2` 数据恢复服务新开发团队担任软件开发员已五年。因此，他直接参与了 `DB2` V10.1 和 V10.5 版本引入的许多新功能和改进，这些内容在书中都有涉及。他的兴趣包括软件开发的最佳实践以及设计易于终端用户的功能。\n\
  \n## Colin A. Chapman\n\nColin 拥有 30 多年的 IT 专业人士工作经验，担任过广泛的技术角色。他的经验涵盖了大型机操作、应用设计与开发、系统编程以及数据库设计与管理。\n\
  \n最近，Colin 专注于 `Linux`、`UNIX` 和 `Windows` 平台上的 `DB2`。他拥有广泛的深度 `DB2` 技能，特别是在大型分区数据库、集群和高可用、跨平台复制、性能、恢复、安全以及复杂问题诊断等领域。\n\
  \n## Simon Woodcock\n\nSimon Woodcock 在 IBM 工作了 30 年，将他的系统设计技能运了英国及整个欧洲的许多客户。其中超过半的时间花在数据库上，主要是大型数据仓库，从\
  \ `DB2` 开始，扩展到 `Netezza`，以及最近的 `Hadoop` 大数据系统。\n\n# 目录\n\n*   关于作者\n*   致谢\n*  \
