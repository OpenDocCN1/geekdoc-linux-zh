  | 所在位置 | 说明 |\n| :--- | :--- |\n| `ColumnPosition` | 标识数据值在外部文件中的位置。 |\n\n## 创建表的导入选项\n\
  \n你可能已经注意到 `IMPORT` 命令提供了以下选项，用于控制目标表的创建方式：\n\n- `CREATE`: 当使用 `CREATE` 选项时，将创建表及其所有关联索引，然后导入数据。此选项仅可在从\
  \ PC/IXF 文件导入数据时使用。\n- `INSERT`: 使用 `INSERT` 选项时，将数据插入目标表（表必须已存在）。\n- `INSERT_UPDATE`:\
  \ 当使用 `INSERT_UPDATE` 选项时，数据插入目标表，或在键匹配时更新现有记录。\n- `REPLACE`: 使用 `REPLACE` 选项时，如果目标表已存在，则删除表中的现有数据，然后插入新数据。\n\
  - `REPLACE_CREATE`: 当使用 `REPLACE_CREATE` 选项时，如果目标表已存在，则删除其现有数据；但是，如果目标表不存在，则创建该表及其所有关联索引，然后导入数据。\n\
  \n因此，如果你想从名为 `DEPT.IXF` 的 PC/IXF 格式外部文件导入数据到名为 `DEPARTMENT` 的新表，请执行 `IMPORT` 命令：\n\
  \n![Image](img/597.jpg)\n\n## 处理 LOB 值\n\n前面提到导出的数据包含 LOB 值时，默认只有每个 LOB 值的前 32 KB\
  \ 会写入导出数据文件。要覆盖此行为，你需要使用 `lobsinfile` 或 `lobsinfiles` 修符，并为 `Export` 实用程序提供一个或多个写入\
  \ LOB 值的位置。在这种情况下，发现的每个 LOB 值将完整存储在自己的单独文件中，该文件名由用户或 `Export` 实用程序提供。\n\n你也可以通过使用相应的修符\
  \ `lobsinfile` 导入位于独立文件的 LOB 值。因为包含 LOB 文件的名称和位置与其他数据一起存储在源数据文件中（假设 `Export` 实用程序生成了源数据文件），因此在检索\
  \ LOB 值时不需要向 `Import` 实用程序提供这些信息。\n\n因此，要将名为 `employee.del` 的分隔符 ASCII (DEL) 格式外部文件以及存储在独立文件中的\
  \ LOB 值导入到名为 `EMPLOYEE` 的表，请执行 `IMPORT` 命令：\n\n![Image](img/598.jpg)\n\n执行此命令时，它将执行以下操作：\n\
  \n\n\n\n\n* 获取存储在名为 `employee.del` 的定界 ASCII (DEL) 格式外部文件中所有数据值（该文件位于 C: 盘的根目录下）。\n\
  * 定位名为 `employee.del` 文件中引用的所有 LOB 值，并从其各自的文件检索每个值（预计每个文件都位于 C: 盘上名为 `lobfiles`\
  \ 的目录）。\n* 将从名为 `employee.del` 的文件和各个 LOB 数据文件中检索的所有数据值插入到名为 `EMPLOYEE` 的表中（该表已存在）。\n\
  * 将 `Import` 实用程序产生的所有消息记录到名为 `imp_msgs.txt` 的文件中（该文件将位于当前工作目录）。\n\n图 6.10 展示了此导入操作。\n\
  \n你也可以以类似的方式检索并复制存储在单独文件中的 XML 文档到表中。图 6.11 展示了一个简单的导入操作，其中 XML 文档以这种方式进行处理。要导入\
  \ XML 文件，请使用 `XML FROM` 选项指定存储 XML 文件的一个或多个路径。你还可以选择解析 XML 文档的方式：`PRESERVE`（保留）或\
  \ `STRIP WHITESPACE`（去除空格）选项。如果不指定 `XMLPARSE` 选项，XML 文档的解析行为将由 `CURRENT IMPLICIT\
  \ XMLPARSE OPTION` 特殊寄存器决定，其初始设置为 `STRIP WHITESPACE`。当你插入或更新 XML 文档时，可以使用 `IMPORT`\
  \ 命令中的 `XMLVALIDATE` 选项对 XML 文档的结构、内容和数据类型进行验证。\n\n![Image](img/599.jpg)\n*图 6.10：LOB\
  \ 值存储在单独文件中的导入操作*\n\n你还可以使用 IBM Data Studio 中的导入表向导导入存储在外部文件中的数据，你可以通过在管理视图（Administration\
  \ Perspective）中选择适当的操作来激活向导。图 6.12 展示了如何激活导入表对话框；图 6.13 显示了文件格式、导入模式以及导入文件的绝对路径。\n\
  \n![Image](img/600.jpg)\n*图 6.11：XML 文档存储在单独文件中的导入操作*\n\n图 6.14 显示了各种列类型的行为，如 `identityignore,\
  \ identitymissing, generatedignore, generatedmissing, rowchangetimestampignore,`\
  \ 和 `rowchangetimestampmissin.`。它还允许你指定包含 LOB 和 XML 数据的一个或多个目录。你还可以选择为缺失数据插入 `DEFAULT`\
  \ 值。\n\n![Image](img/601-1.jpg)\n*图 6.12：通过 IBM Data Studio 调用导入实用程序*\n\n![Image](img/601-2.jpg)\n\
  *图 6.13：导入—文件选项*\n\n![Image](img/602.jpg)\n*图 6.14：导入—列选项*\n\n图 6.15 显示了可用的日期、时间和时间戳格式，以及导入到图形和\
  \ DBCLOB 列数据所需的数据代码页和图形代码页。在将 DEL 文件格式数据加载到表时，你可以选择特定的定界符。\n\n![Image](img/603.jpg)\n\
  *图 6.15：导入—格式类型选项*\n\n图 6.16 显示了在将数据加载到具有一个或多个 XML 列的表时可选择的 XML 选项。你可以选择 `Preserve\
  \ white space`（保留空格）或 `Remove white space`（去除空格）。以下 `XMLVALIDATE` 选项根据架构 验证 XML\
  \ 文档的内容、结构和数据类型：\n\n* `USING XDS`。根据 XDS 识别的 XML 架构对 XML 文档进行验证。当你使用 `USING XDS`\
  \ 子句调用 XML 验证时，用于执行验证的架构 将由 XDS 的 `SCH` 属性（XML 架构的全限定 SQL 标识符）决定。`SCH` 信息通常存储在 `SYSCAT.XSROBJECTS`\
  \ 系统目录表中。\n* `USING SCHEMA`。根据指定的 SQL 标识符对应的 XML 架构对 XML 文档进行验证。\n* `USING SCHEMALOCATION\
  \ HINTS`。根据源 XML 文档中 XML 架构位置提示识别的架构对 XML 文档进行验证。\n\n![Image](img/604.jpg)\n*图 6.16：导入—XML\
  \ 选项*\n\n图 6.17 展示了通过 `IMPORT` 命令加载数据时可以指定的高级选项。有三种提交选项：\n\n* 使用数据库服务器设置。`Import`\
  \ 实用程序通过插入 SQL 语句将数据加载到表中，并且仅在完成整个数据加载操作后才执行 `COMMIT` 语句。请记住，`IMPORT` 操作会在事务日志中记录每次插入。\n\
  * 自动提交。数据库管理器根据可用的活动事务日志空间、可用的 `locklist` 内存以及 `maxlocks` 设置确定 `COMMIT` 频率，以避免锁升级。\n\
  * 在指定行数后提交。这指定了数据库管理器强制执行 `COMMIT` 的行数。\n\n在加载数据时有两种访问选项可用：\n\n* 限制访问。以离线模式运行。在插入任何行之前获取表的排他锁\
  \ (X)。这会影响并发应用程序。这与 `REPLACE`、`CREATE` 不兼容。\n* 允许写入。以在线模式运行。在插入第一行时获取表的意向排他锁 (IX)。这有助于并发应用程序。\n\
  \n其他高级选项还有：\n\n* 从记录数开始。指定从记录 `n+1` 开始导入操作，即跳过前 `n` 条记录。这等同于 `IMPORT` 命令中的 `SKIPCOUNT`\
  \ 或 `RESTARTCOUNT`。\n* 最大导入行数。指定要导入到表中的 `n` 条记录；它可以是插入或更新。这等同于 `IMPORT` 命令中的 `ROWCOUNT`。\n\
  * 在达到指定的警告数量后停止导入。指定在产生 `n` 条警告消息后停止导入操作。这等同于 `IMPORT` 命令中的 `WARNINGCOUNT`。\n* 使用复合\
  \ SQL 减少开销。指定使用 `x` 条非原子复合 SQL 语句将数据插入到表中，且 `x` 的值在 1 到 100 之间。这等同于 `IMPORT` 命令中的\
  \ `COMPOUND` `x`。\n* 抑制所有关于拒绝行的警告。指定不对任何拒绝的行生成警告。这等同于 `IMPORT` 命令中的 `NOROWWARNINGS`。\n\
  * 等待锁时不超时。指定 `Import` 实用程序在等待锁时不超时。此选项优于数据库配置参数 `locktimeout`。其他应用程序不受影响。\n\n![Image](img/606-1.jpg)\n\
  *图 6.17：导入—高级选项*\n\n图 6.18 显示了命令编辑和运行选项。当你点击 **Run** 按钮时，DB2 数据库管理器将使用 `SYSPROC.ADMIN_CMD`\
  \ 内置 `ADMIN` 存储过程带有相应的命令子句运行 `IMPORT` 命令：\n\n![Image](img/606-2.jpg)\n\n![Image](img/607.jpg)\n\
  *图 6.18：导入—运行选项*\n\n\n\n\n\n注意：在运行 `IMPORT` 命令时，你可能遇到 `SQL0964C`（事务日志满）条件，这是由于数据库中的活动日志空间不足导致的。可以通过\
  \ DB2 注册表变量 `DB2_FORCE_APP_ON_MAX_LOG` 以及 `IMPORT` 命令的提交子句 `COMMITCOUNT` 来很好控制，如表\
  \ 6.3 所示。\n\n| **表 6.3：避免事务日志满条件** |\n\n| **DB2_FORCE_APP_ON_ MAX_LOG** | **COMMITCOUNT**\
  \ | **数据库管理器行为** |\n| :--- | :--- | :--- |\n| FALSE | AUTOMATIC | DB2 数据库管理器通过查看可用活动日志空间来确定\
  \ `COMMITCOUNT` 值，以避免 `SQL0964C`。 |\n| FALSE | *n* | DB2 数据库管理器尝试通过执行无条件提交并重新尝试插入/更新来解决\
  \ `SQL0964C` 条件。 |\n| TRUE（默认） | AUTOMATIC 或 *n* | 如果导入操作遇到 `SQL9064C` 错误且 DB2 数据库管理器未尝试解决，则操作将失败。\
  \ |\n\n## 关于 `ADMIN_CMD()` 存储过程的说明\n\n尽管你可以从 IBM Data Studio 或通过在 DB2 CLP 或操作系统提示符中执行相应的命令来调用\
  \ DB2 提供的大多数实用，但在某些情况下，你可能希望在嵌入 SQL、CLI 或 Java 应用程序中调用实用。因此，大多数 DB2 命令都有相应的应用程序编程接口\
  \ (API)。遗憾的是，使用其中某些 API 所需的代码可能非常复杂，而且所有可用的 API 主要用于 C 和 C++ 应用程序。一种简单的方法是使用 `ADMIN_CMD()`\
  \ 存储过程，这是一个特殊的系统内置存储过程，允许应用程序通过 `CALL` SQL 语句运行某些特定的管理命令。\n\n你必须拥有以下权限之一才能执行 `ADMIN_CMD()`\
  \ 存储过程：\n\n*   对存储过程的 `EXECUTE` 权限\n*   数据库级别的 `DATAACCESS` 权限\n*   数据库级别的 `DBADM`\
  \ 权限\n*   数据库级别的 `SQLADM` 权限\n\n你可以通过使用 `ADMIN_CMD()` 存储过程调用以下命令：\n\n*   `ADD CONTACT`\n\
  *   `ADD CONTACTGROUP`\n*   `AUTOCONFIGURE`\n*   `BACKUP`（仅在线）\n*   `DESCRIBE`\n\
  *   `DROP CONTACT`\n*   `DROP CONTACTGROUP`\n*   `EXPORT`\n*   `FORCE APPLICATION`\n\
  *   `IMPORT`\n*   `INITIALIZE TAPE`\n*   `LOAD`\n*   `PRUNE HISTORY/LOGFILE`\n*\
  \   `QUIESCE DATABASE`\n*   `QUIESCE TABLESPACES FOR TABLE`\n*   `REDISTRIBUTE`\n\
  *   `REORG INDEXES/TABLE`\n*   `RESET ALERT CONFIGURATION`\n*   `RESET DATABASE\
  \ CONFIGURATION`\n*   `RESET DATABASE MANAGER CONFIGURATION`\n*   `REWIND TAPE`\n\
  *   `RUNSTATS`\n*   `SET TAPE POSITION`\n*   `UNQUIESCE DATABASE`\n*   `UPDATE ALERT\
  \ CONFIGURATION`\n*   `UPDATE CONTACT`\n*   `UPDATE CONTACTGROUP`\n*   `UPDATE DATABASE\
  \ CONFIGURATION`\n*   `UPDATE DATABASE MANAGER CONFIGURATION`\n*   `UPDATE HEALTH\
  \ NOTIFICATION CONTACT LIST`\n*   `UPDATE HISTORY`\n\n因此，如果你想使用 `ADMIN_CMD()` 存储过程将存储在名为\
  \ `STAFF` 表中的数据导出为 PC/IXF 格式的外部文件 `staff.ixf`，可以通过连接到包含 `STAFF` 表的数据库并执行 `CALL`\
  \ SQL 语句来实现：\n\n![Image](img/609.jpg)\n\n由于 `ADMIN_CMD()` 存储过程运行在服务器上，所执行的实用程序产生的消息是在服务器上生成的；某些命令提供的\
  \ `MESSAGES ON SERVER` 选项表示任何使用的消息文件将在服务器上创建。此外，命令的执行状态会在所使用的 `CALL` 语句相关的 SQL 通信区域\
  \ (SQLCA) 数据结构返回。\n\n如果管理命令执行成功，且命令返回了执行状态以外的信息，则将以一个或多个结果集的形式返回附加信息。例如，如果成功执行 `EXPORT`\
  \ 命令，将返回包含成功导出行数信息的结果集。（实际返回的结果集信息在每个命令中均有说明。）需要注意的是，你可以使用 CLP 或 JDBC 和 DB2 CLI\
  \ 应用程序检索结果集信息，但不能通过嵌入 SQL 应用程序检索。\n\n如果管理命令执行失败，`ADMIN_CMD()` 存储过程将返回 `SQL20397W`\
  \ 警告消息，以及一个包含失败原因详情的结果集。因此，任何使用 `ADMIN_CMD()` 程序的应用程序都应该检查过程调用生成的 SQLCA 返回代码。如果返回代码大于或等于\
  \ 0，则产生了结果集，应当检索并进行评估。\n\n有趣的是，`ADMIN_CMD()` 过程支持两个 CLP 不支持的命令：\n\n*   `GET STMM\
  \ TUNING`\n*   `UPDATE STMM TUNING`\n\n`GET STMM TUNING` 命令读取目录表以报告用户首选 STMM 调整成员编号和当前\
  \ STMM 调整成员编号。值 `-1` 表示使用默认成员运行自调优内存管理器：\n\n![Image](img/610.jpg)\n\n出于兼容性考虑，你可以在在\
  \ DB2 9.7 上运行的命令中替换 `MEMBER by DBPARTITIONNUM`，或者如下文所示：\n\n![Image](img/610-2.jpg)\n\
  \n`UPDATE STMM TUNING` 命令更新用户首选 STMM 调整成员编号。此设置在 DB2 DPF 和 DBScale 系统中非常有意义：\n\n\
  ![Image](img/611.jpg)\n\n## DB2 Load 实用程序\n\n与 `Import` 实用程序一样，`Load` 程序直接从外部文件读取数据（前提是文件以\
  \ DB2 支持的格式写入），并存储在特定表中。然而，与 `Import` 实用程序不同，在使用 `Load` 实用程序时，在启动加载操作之前，目标表必须已经存在。表\
  \ 6.4 列出了 `Import` 实用程序与 `Load` 实用程序之间的其他差异。\n\n| **表 6.4：Import 实用程序与 Load 实用程序之间的差异**\
  \ |\n| :--- | :--- |\n| **Import 实用程序** | **Load 实用程序** |\n| Import 在处理大量数据时速度较慢，因为它在后台调用并行\
  \ INSERT 语句。 | Load 在处理大量数据时比 Import 快得多，因为它直接将格式化页面写入数据库的存储容器。 |\n| 可以从 IXF 格式文件创建表和索引。\
  \ | 在加载数据之前，表和索引必须已经存在。 |\n| Import 对分区内并行性的利用有限。 | Load 在 SMP 工作站上充分利用了分区内并行性。\
  \ |\n| 支持 WSF 格式文件。 | 不支持 WSF 格式文件。 |\n| 数据可以导入到表、视图或引用表/视图的别名。 | 数据只能加载到表或引用表的别名——不能加载到视图或引用视图的别名。\
  \ |\n| 导入期间，表及其索引所在的表空间保持在线。 | 加载操作期间，表及其索引所在的表空间会被离线。 |\n| 行事务记录在数据库的事务日志文件中。 |\
  \ 执行最小化日志——行事务不记录在数据库的事务日志文件中。 |\n| 处理过程中可以触发触发器。 | 处理过程中不会触发触发器。 |\n\n\n\n\n\n\
  | 导入 (Import) | 加载 (Load) |\n| :--- | :--- |\n| 如果导入操作被中断且指定了提交频率值，则表将保持可用，并包含直到最后一次提交操作执行为止插入的所有行。用户可以选择重新启动导入操作，或保持表现状。\
  \ | 如果加载操作被中断且指定了一致性检查点（提交频率）值，则表将处于“加载等待”（Load pending）状态，直到 (1) 重新启动加载过程并完成加载操作，或\
  \ (2) 该表所在的表空间从加载操作启动前创建的备份镜像中恢复。 |\n| 导入数据所需的空磁盘空间大约等于正在导入的最型索引的大小，加上约 10% 的额外空间。该空间是从为数据库定义的系统临时表空间分配的。\
  \ | 加载数据所需的空磁盘空间大约等于被加载表所有索引的大小之和。该空间被临时分配在数据库环境之外。 |\n| 所有的约束检查都在处理过程中完成。 | 在处理过程中仅进行唯一性检查。所有其他约束检查（检查约束、引用完整性约束等）必须在加载操作完成后，使用\
  \ `SET INTEGRITY` SQL 语句进行。 |\n| 每一行的键在导入操作期间被插入到相应的索引中。 | 所有键在加载操作期间进行排序，并在加载操作的加载阶段完成后重建索引。\
  \ |\n| 在执行导入操作后，必须手动收集受影响表的统计信息（通过执行 `RUNSTATS` 命令）。 | 受影响表的统计信息可以在加载操作期间进行收集和更新。\
  \ |\n| 数据可以通过 DB2 Connect 导入到主机数据库。 | 数据无法加载到主机数据库。 |\n| 待导入的数据文件必须位于调用导入功能的工作站上。\
  \ | 提供待加载数据的数据文件和命名管道必须位于接收数据的数据库所在的同一工作站上。 |\n| 导入操作期间不会创建备份镜像。由于导入工具使用 SQL 插入操作，DB2\
  \ 数据库管理器记录所有处理过程，如果发生故障，不需要备份镜像即可重现导入操作。 | 在加载操作期间可以使用 `COPY YES` 选项创建备份镜像（副本）。\
  \ |\n| 导入工具对分区内并行性的利用有限。 | 加载工具在 SMP 工作站上充分利用了分区内并行性。 |\n| 支持分级数据。 | 不支持分级数据。 |\n\
  | 数字数据必须存储为字符表示。 | 数字数据（DECIMAL 数据外）可以以二进制形式或字符表示存储和加载。DECIMAL 数据可以以压缩小数格式、带区域小数格式或字符表示存储和加载。\
  \ |\n| 不执行代码页之间的数据转换。 | 字符数据（以及以字符表示数字数据）可以在处理过程中从一个代码页转换为另一个。 |\n| 不提供 FASTPARSE\
  \ 支持。 | 提供 FASTPARSE 支持。（FASTPARSE 提供对用户提供的数据简化检查。） |\n| 不提供 BINARYNUMERICS 支持。\
  \ | 提供 BINARYNUMERICS 支持。 |\n| 不提供 PACKEDDECIMAL 支持。 | 提供 PACKEDDECIMAL 支持。 |\n\
  | 不提供 ZONEDDECIMAL 支持。 | | |\n| 无法覆盖定义为 GENERATED ALWAYS 的列。 | 可以使用 `GENERATEDIGNORE`\
  \ 和 `IDENTITYIGNORE` 文件类型修符覆盖定义为 GENERATED ALWAYS 的列。 |\n| 不支持导入到 MQT。 | 支持加载到 MQT。\
  \ |\n| XML 文档可以导入到 XML 列。 | 可以加载 XML 文档；但 LOB 和 XML 数据只能从服务器端读取。 |\n| *改编自 IBM DB2\
  \ 10/1 数据移动工具指南和参考第 257 页 的附录 B*\n\n`Import` 工具与 `Load` 工具最重要的区别在于它们在外部文件和数据库表之间移动数据的方式。`Import`\
  \ 工具通过使用 SQL 插入或更新操作复制数据。因此，处理的每一行都必须检查是否符合约束要求，且 `Import` 工具执行的所有活动都会记录在数据库的事务日志文件中。\n\
  \n然而，`Load` 工具通过构建包含若干行单独数据的数据页，并将数据插入到表中，并将这些页面直接写入目标表用于数据存储的表空间容器。一旦工具完成构建并将所有数据页写入相应的表空间容器，它将重建与目标表相关的所有现有主索引和唯一索引，并删除所有违反为表定义的主键或唯一键约束的行（如果提供了，则将其复制到异常表）。由于写入的是数据页而不是单独行，对目标表的更改不会记录在数据库的事务日志文件中。因此，整体性能通常更快。但是，由于\
  \ `Load` 工具对表所做的更改未记录，如果发生数据库故障，则无法通过执行前滚恢复操作重新加载数据。为了解决这一局限性，`Load` 工具可以生成所有加载数据的备份副本，以便在必要时快速重新加载。\n\
  \n# 加载操作的四个阶段\n\n一个完整的加载操作由四个不同的阶段组成：\n\n* 加载阶段 (Load phase)\n* 构建阶段 (Build phase)\n\
  * 删除阶段 (Delete phase)\n* 索引复制阶段 (Index copy phase)\n\n### 加载阶段\n加载阶段会发生四件事：从指定的源文件读取数据并加载到相应的目标表；收集索引键值和表统计信息；记录一致性检查信息；并将无效数据放入转储文件。一致性检查信息作为\
  \ `Load` 工具的检查点——如果加载操作在加载阶段执行期间中断并重启，操作将从最后建立的一致性点继续。作为更新一致性检查信息的一部分，`Load` 工具向适当的消息文件写入消息，标识已加载的记录数。你可以使用这些信息在发生故障时从中断的地方继续，或监控加载操作的进度。`LOAD\
  \ QUERY TABLE` 命令可以监控加载操作的进度/状态。\n\n### 构建阶段\n在构建阶段，与被加载表定义的主键和唯一键相关的索引将使用加载阶段期间收集并排序的索引键值进行更新。这也是更新表及其索引的统计信息的时候（如果适用）。\n\
  \n由于构建阶段的开始被记录为一致性检查点，如果加载操作在构建阶段执行期间中断并重启，操作将从构建阶段开始重启——不需要重复加载阶段。\n\n\n\n\n\n\
  ### 删除阶段\n在删除阶段，所有违反目标表上定义的主键和唯一键约束的行都将被删除并复制到异常表（如果适用），同时，每条违规行的信息都将写入适当的消息文件中，以便您稍后对其进行修改并手动复制到目标表。这些是唯一检查的表约束。若要检查加载的数据是否存在额外的约束违例，您应该在开始加载操作之前关闭约束检查（使用\
  \ `SET INTEGRITY` SQL 语句），然后在加载操作完成后立即重新开启并执行约束检查（再次使用 `SET INTEGRITY` 语句）。\n\n\
  删除阶段的开始也会被记录为一个一致性点。因此，如果加载操作在删除阶段的执行过程中被中断并重启，该操作将从删除阶段的开始重新启动——不需要重复执行加载阶段和构建阶段。\n\
  \n### 索引复制阶段\n在索引复制阶段，索引数据将从使用的系统临时表空间复制到与加载表相关的索引数据将存放的表空间。需要注意的是，只有当您在执行 `LOAD`\
  \ 命令时指定了 `ALLOW READ ACCESS` 和 `USE` `[TablespaceName]` 选项时，才会执行此阶段。\n\n## 执行加载操作\n\
  \n现在您已经了解了 `Load` 实用程序与 `Import` 工具的区别，以及 `Load` 工具如何将存储在外部文件的数据复制到数据库表，让我们来看如何调用\
  \ `Load` 实用。您通过执行 `LOAD` 命令来调用 `Load` 实用。该命令的基本语法如下：\n\n![Image](img/615.jpg)\n\n\
  | where: | |\n| :--- | :--- |\n| `FileName` | 标识用于从中加载（复制）数据的一个或多个外部文件的名称和位置 |\n\
  | `PipeName` | 标识用于从中加载数据的一个多个命名管道的名称 |\n| `Device` | 标识用于从中加载数据的一个或多个设备名称 |\n|\
  \ `CursorName` | 标识用于从中加载数据的一个或多个游标名称 |\n| `LOBPath` | 标识存储待加载 LOB 数据的一个或多个位置 |\n\
  | `Modifier` | 标识用于覆盖 `Load` 实用默认行为的一个或多个选项（表 6.5 包含了有效修改符列表） |\n| `Method` | 标识用于从指定的源外部文件中提取数据值并将其映射到指定的目标表的一个或多个列的方法（位置、名称或偏移）；指定每种方法使用的语法各异\
  \ |\n| `SaveCount` | 标识在 `Load` 实用建立新的一致性点之前要复制到指定目标表的数据行（记录）数 |\n| `RowCount` |\
  \ 标识在指定的外部文件、命名管道、设备和游标中要加载的实际数据行数 |\n| `WarningCount` | 标识 `Load` 实用在终止加载操作前应忽略的警告条件数量\
  \ |\n| `MsgFileName` | 标识用于写入 `Load` 实用在执行加载操作期间产生的消息的外部文件名称和位置 |\n| `TempFilesPath`\
  \ | 标识用于存储 `Load` 实用可能需要的临时文件的位置 |\n| `TableName` | 标识分配给要加载数据的表的名称（此名称不能为系统目录表名）\
  \ |\n| `ColumnName` | 标识用于从中加载数据的一个或多个特定列（通过名称指定） |\n| `ExTableName` | 标识分配给表的名称，用于复制所有违反指定目标表定义的唯一索引或主键约束的行\
  \ |\n| `CopyLocation` | 标识用于存储加载到目标表的所有数据的备份副本的目录或设备 |\n| `Size` | 标识在 `Load` 实用内部传输数据时用作缓冲存储空间的\
  \ 4 KB 页面数 |\n| `TmpTSName` | 标识系统临时表空间，在加载操作的索引复制阶段之前，先在该表空间中构建索引的影子副本，然后将它们复制到适当的常规表空间以进行最终存储\
  \ |\n\n表 6.5 列出了 `LOAD` 命令最常用的文件类型修改符。\n\n| 表 6.5：LOAD 命令识别的文件类型修改符 |\n| **修改符**\
  \ | **描述** | **文件格式** |\n| anyorder | 此修改符表示不需要保留源数据的顺序。这将在 SMP 系统上产生显著性能提升。如果 `SAVECOUNT`\
  \ > 0，则不支持此修改符，因为数据必须按顺序加载，以确保崩溃恢复（在拍摄一致性点之后）能够正常工作。 | 分隔符 ASCII (DEL)、非分隔符 ASCII\
  \ (ASC) 和 PC/IXF |\n| generatedignore | 此修改符表示虽然加载的文件包含所有生成列的数据，但要忽略这些数据。相反，`Load`\
  \ 实用应用其自身的生成值替换所有找到生成数据值。此修改符与 `generatedmissing` 修改符不兼容。 | 分隔符 ASCII (DEL)、非分隔符\
  \ ASCII (ASC) 和 PC/IXF |\n| generatedmissing | 此修改符表示加载的文件缺少生成列的数据，`Load` 实用应为遇到的每个缺失值生成一个适当的值。此修改符与\
  \ `generatedignore` 修改符不兼容。 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC) 和 PC/IXF |\n| generatedoverride\
  \ | 此修改符表示 `Load` 实用将接受表中所有生成列的显式非空数据值（违反此类列的常规规则）。此修改符在从另一个数据库迁移数据或使用 `DROPPED\
  \ TABLE RECOVERY` 选项从恢复的数据加载表时有用。此修改符与 `generatedignore` 和 `generatedmissing` 修改符不兼容。\
  \ | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC) 和 PC/IXF |\n| identityignore | 此修改符表示加载的文件包含所有标识列的数据，但要忽略这些数据。相反，`Load`\
  \ 实用应用其生成的值替换所有找到标识列数据。此修改符与 `identitymissing` 修改符不兼容。 | 分隔符 ASCII (DEL)、非分隔符 ASCII\
  \ (ASC) 和 PC/IXF |\n| identitymissing | 此修改符表示加载的文件缺少标识列的数据，`Load` 实用应为每个缺失值生成一个适当的值。此修改符与\
  \ `identityignore` 修改符不兼容。 | 分隔符 ASCII (DEL)、非分隔符 ASCII (ASC) 和 PC/IXF |\n| identityoverride\
