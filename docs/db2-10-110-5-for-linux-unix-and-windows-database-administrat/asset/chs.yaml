  \ `SECADM` |\n| ![images](img/circ.jpg) | B. | `SYSMAINT` |\n| ![images](img/circ.jpg)\
  \ | C. | `ACCESSCTRL` |\n| ![images](img/circ.jpg) | D. | `DATAACCESS` |\n\n# 答案\n\
  \n### 问题 1\n正确答案是 `C`。具有 `SECADM` 权限的用户无法免于 `RCAC` 规则。你可以使用 `ALTER TABLE` 命令在需要时激活和停用\
  \ `RCAC`。`RCAC` 是比 `LBAC` 更强大的安全机制。当结果集由于表上定义的 `RCAC` 规则受到限制时，不会返回任何警告或错误消息。\n\n\
  ### 问题 2\n正确答案是 `B`。要执行 `CREATE ROW PERMISSION` 和 `CREATE MASK` 命令，你需要 `SECADM`\
  \ 权限。\n\n### 问题 3\n正确答案是 `D`。以下哪项*不是* DB2 审计设施中的有效事件？`sysadmin`。\n\n### 问题 4\n正确答案是\
  \ `C`。使用 `AUDIT` 语句创建审计策略需要什么权限？`SECADM`。\n\n### 问题 5\n正确答案是 `A`。你可以使用 `AUDIT` 语句审计哪些权限？`SECADM`、`DBADM`、`SYSMAINT`\
  \ 和 `SYSCTRL` 可以审计，但 `SYSADM` 不可以。\n\n### 问题 6\n正确答案是 `C`。存储在 `SSN` 列中的值仅对 `PAYROLL`\
  \ 角色用户可见。\n\n### 问题 7\n正确答案是 `D`。存储在 `SSN` 列中的值对任何用户均不可。\n\n### 问题 8\n正确答案是 `A`。在用户调用例程序（UDF、存储过程或方法）之前，他们必须同时拥有该例程序的\
  \ `EXECUTE` 权限以及该例程序所需的任何权限。\n\n\n\n\n包权限（Package privileges）控制了用户对特定包可以执行和不能执行的操作。（包是一个对象，包含了\
  \ `DB2` 数据库管理器以最有效的方式代表嵌入 SQL 应用程序处理 SQL 语句所需的信息。）\n\n### 问题 9\n正确答案是 **A.**。`ALTER`\
  \ 表权限允许用户对表执行 `ALTER TABLE` SQL 语句。换句话说，此权限允许用户向表中添加添加列、添加或更改与表或其任何列相关的注释、创建或删除表的主键、创建或删除表的\
  \ `UNIQUE`（唯一）约束、创建或删除表的 `CHECK`（检查）约束，以及为该表创建触发器（前提是用户对触发器所引用的每个对象都拥有相应的权限）。\n\n\
  `UPDATE` 权限允许用户对表执行 `UPDATE` SQL 语句。换句话说，此权限允许用户修改表中的数据。`DELETE` 权限允许用户对表执行 `DELETE`\
  \ SQL 语句。换句话说，它允许用户从表中删除数据行。\n\n### 问题 10\n正确答案是 **B.**。`BINDADD` 数据库权限允许用户在数据库中创建包（通过针对数据库预编译嵌入\
  \ SQL 应用程序源代码文件，或通过将应用程序绑定文件绑定到数据库）。\n\n`BIND` 包权限允许用户对已绑定到数据库的包重新绑定或向该包添加新包版本。（除了\
  \ `BIND` 包权限外，在包成功重新绑定之前，用户还必须拥有执行组成该包的 SQL 语句所需的权限）。`CREATE_EXTERNAL_ROUTINE` 数据库权限允许用户创建\
  \ UDF（用户定义函数）和存储过程并将其存储在数据库中，以便其他用户和应用程序可以使用。`CREATE_NOT_FENCED_ROUTINE` 数据库权限允许用户创建非围栏（unfenced）UDF\
  \ 和存储过程并将其存储在数据库中。（非围栏 UDF 和存储过程被认为足够“安全”，可以在 `DB2` 数据库管理器运行环境的进程或地址空间中运行。除非 UDF\
  \ 或存储过程被注册为非围栏，否则 `DB2` 数据库管理器将对 UDF 或存储过程的内部资源进行隔离，使其无法在 `DB2` 数据库管理器的地址空间中运行。）\n\
  \n### 问题 11\n正确答案是 **C.**。`GRANT` 语句不会检查要授予权限和权利的用户和组名称是否有效。因此，可能会向不存在的用户和组授予权限和权利。\n\
  \n### 问题 12\n正确答案是 **B.**。授予唯一可用存储过程权限的语法为：\n\n![Image](img/932-1.jpg)\n\n撤销唯一可用存储过程权限的语法为：\n\
  \n![Image](img/932-2.jpg)\n\n因此，授予和撤销存储过程权限的正确方法是执行 `GRANT EXECUTE` 和 `REVOKE EXECUTE`\
  \ 语句。\n\n### 问题 13\n正确答案是 **A**。要使用 `LBAC` 限制对表行的访问，你必须定义一个安全标签组件、定义安全策略、创建一个或多个安全标签、创建一个受\
  \ `LBAC` 保护的表或修改现有表以添加 `LBAC` 保护（通过将安全策略添加到表，并定义一个具有 `DB2SECURITYLABEL` 数据类型的列），并向适当的用户授予相应的安全标签。没有\
  \ `LBAC` 安全配置文件。\n\n### 问题 14\n正确答案是 **C.**。`SECADM` 权限是一种特殊的数据库级权限，允许特殊用户配置各种 `LBAC`\
  \ 元素，以限制对一个或多个表的访问，这些表包含了他们极可能没有权限访问的数据。拥有 `SECADM` 权限的用户允许执行以下任务：\n\n* 创建和删除安全策略\n\
  * 创建和删除安全标签\n* 向单个用户授予和撤销安全标签（使用 `GRANT SECURITY LABEL` 和 `REVOKE SECURITY LABEL`\
  \ SQL 语句）\n* 授予和撤销 `LBAC` 规则豁免\n* 授予和撤销 `SETSESSIONUSER` 权限（使用 `GRANT SETSESSIONUSER`\
  \ SQL 语句）\n* 任何非安全管理员拥有的对象的所有权（通过执行 `TRANSFER OWNERSHIP` 语句）\n\n没有其他权限可以为用户提供这些能力，包括\
  \ `SYSADM` 权限。\n\n### 问题 15\n正确答案是 **B.**。当用户拥有 `LBAC` 安全策略规则的豁免时，当用户尝试读取或写入受该安全策略保护的数据时，该规则将不会生效。\n\
  \n你通过执行 `GRANT EXEMPTION ON RULE` SQL 语句（作为具有 `SECADM` 权限的用户）来授予安全策略豁免。该语句的语法为：\n\
  \n![Image](img/933-1.jpg)\n\n因此，要向名为 `USER1` 的用户授予名为 `SEC_POLICY` 的策略中 `DB2LBACWRITEARRAY`\
  \ 规则的豁免，你需要执行类似下面的 `GRANT EXEMPTION` 语句：\n\n![Image](img/933-2.jpg)\n\n### 问题 16\n\
  正确答案是 **A.**。验证发生在服务器工作站，使用服务器操作系统提供的安全设施。然而，用户为了附加实例或连接存储在服务器上的数据库而输入的用户 ID 和密码，在发送到服务器工作站进行验证之前，可以在客户端工作站进行加密。\n\
  \n### 问题 17\n正确答案是 **D.**。监控和调整 SQL 语句需要 `SQLADM` 权限。拥有 `SQLADM` 权限的用户允许执行以下任务：\n\
  \n* 创建、删除或刷新监控器\n* 使用 `EXPLAIN` 生成解释数据\n* 刷新优化配置文件缓存\n* 执行表和索引重组\n* 对表和索引执行 `RUNSTATS`\n\
  * 启用或禁用事件监控器\n* 刷新包缓存并准备 SQL 语句\n\n### 问题 18\n正确答案是 **B.**。管理特定数据库的负载对象需要 `WLMADM`\
  \ 权限。拥有 `WLMADM` 权限的用户允许执行以下任务：\n\n* 创建、修改、删除和注释以下 `WLM` 对象：\n    * 服务类 (Service\
  \ classes)\n    * 阈值 (Thresholds)\n    * 工作操作集 (Work action sets)\n    * 工作类集 (Work\
  \ class sets)\n    * 工作负载 (Workloads)\n    * 直方图模板 (Histogram templates)\n* 授予和撤销负载权限\n\
  * 执行内置的负载管理程序\n\n### 问题 19\n正确答案是 **A.**。角色的真实特性是：\n\n* `SECADM` 用户在数据库引擎内部创建并管理角色。\n\
  * 你授予角色的权限和权利在创建视图、MQT、SQL 过程、触发器和包含静态 SQL 的包时会被考虑。角色不能拥有数据库对象。\n* 角色不能授予实例级权限，如\
  \ `SYSADM`、`SYSCTRL`、`SYSMAINT` 和 `SYSMON`。\n* 你可以使用 `GRANT ROLE` 命令中的 `WITH ADMIN\
  \ OPTION` 子句委托角色维护工作。\n\n### 问题 20\n正确答案是 **C.**。`SECADM` 可以授予和撤销所有数据库级权限，包括 `DBADM`、`SECADM`、`DATAACCESS`、`ACCESCTRL`、`EXPLAIN`、`SQLADM`、`WLMADM`\
  \ 和 `LOAD`。拥有 `SYSMAINT`、`SYSMON` 和 `SYSCTRL` 权限的用户不能向他人授予权限。\n\n### 问题 21\n答案是\
  \ **C.** `SECADM` 权限只能由拥有 `SECADM` 权限的安全管理员授予，可以授予用户、组或角色。`PUBLIC` 无法直接或间接获得 `SECADM`\
  \ 权限。\n\n### 问题 22\n正确答案是 **D.**。`SECADM` 权限只能由拥有 `SECADM` 权限的安全管理员授予或撤销，可以授予用户、组或角色。并且默认情况下，拥有\
  \ `SYSADM` 权限的用户将拥有 `SECADM` 权限。\n\n### 问题 23\n\n\n\n\n正确答案是 `A` 和 `B.`。安全标签组件代表了你可以用于判断用户是否应该具有特定数据的访问权限。存在三种类型的安全标签组件：\n\
  \n- `set`（集合）是元素（字符字符串值）的集合，其中每个元素出现的顺序并不重要。\n- `array`（数组）是有序的集合，可以表示简单的层级结构。在\
  \ `array` 中，元素出现的顺序非常重要——第一个元素的优先级高于第二个，第二个高于第三个，以此此类推。\n- `tree`（树）表示更复杂的层级结构，可以拥有多个节点和分支。\n\
  \n### 问题 24\n正确答案是 `C.`。与 RCAC 相比，LBAC 是一种更强大的安全机制。LBAC 主要用于国防应用，而 RCAC 用于商业应用。没有任何数据库用户天生免于\
  \ RCAC 规则，包括 `DATAACCESS` 和 `SECAM` 权限。你可以使用这组命令轻松地激活和禁用 RCAC：\n\n![Image](img/935.jpg)\n\
  \n当结果集由于表上定义的 RCAC 规则而受到限制时，不会返回任何警告或错误消息。\n\n### 问题 25\n正确答案是 `B.`。对于 `HR.EMP_SSN_MASK`\
  \ 的 `SSN` 列，`CREATE MASK` 命令在两种情况下生效：\n\n- 当会话用户角色为 `PAYROLL` 时，用户将在 `SSN` 列中看到\
  \ `NULL` 值。\n- 当会话用户角色不是 `PAYROLL` 时，该用户将看到真实的 `SSN` 值。\n\n### 问题 26\n正确答案是 `B.`。只有拥有\
  \ `SECADM` 权限的用户才能执行 `CREATE MASK` 和 `CREATE ROW PERMISSION` 命令。\n\n### 问题 27\n\
  正确答案是 `B.` `event sysmaintaint` 不是 DB2 审计设施的正确事件。\n\n### 问题 28\n正确答案是 `C.`。拥有 `SECADM`\
  \ 权限的用户可以使用 `CREATE AUDIT POLICY` 命令创建审计策略，以审计数据库内的特定对象。你可以将以下对象与审计策略关联：\n\n- 整个数据库\n\
  - 表\n- 可信上下文 (Trusted contexts)\n- 代表用户、组或角色的授权 ID (Authorization IDs)\n- 权限——`SYSADM`、`SECADM`、`DBADM`、`SQLADM`、`WLMADM`、`ACCESSCTRL`、`DATAACCESS`、`SYSCTRL`、`SYSMAINT`\
  \ 和 `SYSMON`\n\n### 问题 29\n正确答案是 `C.`。你可以使用 `AUDIT` 语句审计权限 `SYSADM`、`SECADM`、`DBADM`、`SQLADM`、`WLMADM`、`ACCESSCTRL`、`DATAACCESS`、`SYSCTRL`、`SYSMAINT`\
  \ 和 `SYSMON`。\n\n### 问题 30\n正确答案是 `A.`。`AUTH_LIST_AUTHORITIES_FOR_AUTHID`、`AUTH_LIST_GROUPS_FOR_AUTHID`\
  \ 和 `AUTH_LIST_ROLES_FOR_AUTHID` 是标量表函数，而 `SYSIBMADM.PRIVILEGES` 是用于安全的管理视图。\n\n\
  # 第 9 章\n## 连接与网络\n\n本章介绍了为远程数据库、远程数据服务器以及数据库连接服务 (DCS) 数据库配置通信和编目录的过程。它还包含了介绍如何使用\
  \ DB2 发现功能管理到 System z 和 System i 主机数据库连接的主题。\n\n## 考试目标\n\n- 证明理解 DB2 内部通信协议的能力\n\
  - 证明配置 DB2 数据库服务器与客户端之间连接的能力\n- 证明为管理服务器、实例和数据库配置并使用 DB2 发现的能力\n- 证明管理到 System z\
  \ 和 System i 主机数据库连接的能力\n- 证明配置轻量级目录访问协议 (LDAP) 连接的能力\n- 证明识别和解决任何客户端/服务器连接问题的能力\n\
  \n## 配置通信\n\n在典型的客户端/服务器环境中，托管在服务器上的数据库由运行在远程客户端工作站上的应用程序通过所谓的 `distributed connection`（分布式连接）\
  \ 进行访问。除了为客户端应用程序提供访问位于远程服务器的集中数据库的方法外，分布式连接还帮助管理员远程管理数据库和服务器。\n\n为了与服务器通信，每个客户端必须使用服务器识别的特定类型通信协议来执行所需任务。同样，每个服务器必须有一个通信协议矩阵，以适当处理来自客户端的入站请求。大多数情况下，客户端和服务器机器上的操作系统提供了所需的通信协议支持；但在少数情况下，可能需要单独的插件来提供必要的协议支持。无论何种情况，你都必须配置客户端和服务器使用\
  \ DB2 支持的通信协议。DB2 10.1 支持以下通信协议：\n\n- 传输控制协议/网协议 (TCP/IP)—均支持 `IPv4` 和 `IPv6`。表\
  \ 9.1 列出了 `IPv4` 和 `IPv6` 之间的差异。\n- 命名管道 (Named pipe)—这是一种用于服务器与一个或多个客户端之间通信的先进先出\
  \ (FIFO) 单向或双向管道。该协议支持 Windows 平台。\n-套接层 (SSL) 和传输层安全 (TLS)—这些是最常用的协议，用于在客户端（如 `CLI`、`CLP`）与\
  \ DB2 服务器之间建立安全的私有通道。\n\n| 表 9.1：IPv4 与 IPv6 通信协议 |\n\n| IPv4 | IPv6 |\n| :--- |\
  \ :--- |\n| 它由四部分结构组成。 | 它由八部分结构组成。 |\n| 它使用 32 位 IP 地址。 | 它使用 128 位 IP 地址。 |\n\
  | 它支持 42.9 亿个互联网设备。 | 它支持 342823669209384634 个设备——理论上无限！ |\n| 它使用十进制表示；例如：10.111.19.110。\
  \ | 它使用冒号分隔的十六进制数表示；例如：2000:db8:4545:afe6 |\n\n当你在客户端或服务器上安装 DB2 时，DB2 将检测所有已安装的协议并启动来自这些协议的连接。在安装期间，每个受支持协议的信息将被收集并存储在创建的\
  \ DAS 和默认实例的配置文件中。遗憾的是，当激活新协议或重新配置现有协议时，这些信息不会更新。相反，你必须手动重新配置每个实例以使任何更改生效。\n\n##\
  \ 手动配置 DB2 服务器\n\n手动配置通信或更改通信配置最简单的方法是使用“设置和配置”(Set Up and Configure) 对话框，你可以通过在\
  \ IBM Data Studio 的实例或数据库菜单中选择相应的操作来激活它。图 9.1 显示了你必须选择的 Data Studio 菜单项，以激活“设置和配置通信”对话框。图\
  \ 9.2 展示了如何使用“设置和配置”对话框为特定实例配置 TCP/IP 协议。\n\n![Image](img/939.jpg)\n\n*图 9.1：IBM\
  \ Data Studio 中的设置和配置菜单*（等等，正文中说是 9.1）\n\n`Configure` 选项会启动“修改实例和数据库配置参数”页面。在通信部分，你可以将\
  \ `svcename` 参数设置为有效的 TCP/IP 端口号或有效的服务名称，这些名称在 UNIX 的 `/etc/services` 文件和 Windows\
  \ 操作系统的 `%SystemRoot%\\system32\\drivers\\etc\\services` 文件中可用。\n\n如果你在图 9.2 菜单中更改\
  \ `svcename` 实例配置，更改的参数左侧将出现星号 (`*`）以突出显示更改。\n\n![Image](img/940-1.jpg)\n\n*图 9.2：在\
  \ IBM Data Studio 中配置 TCP/IP 端口或服务名称*\n\n\n\n\n\n另一种配置通信的方法是使用以下步骤通过 CLP 命令或操作系统命令\
  \ shell：\n\n### 步骤 1：为 `DB2COMM` 注册变量分配值 `TCPIP`。\n\n每当手动为服务器配置通信时，在实例开始使用所需的通信协议之前，必须更新\
  \ `DB2COMM` 注册变量的值。您分配给 `DB2COMM` 注册变量的值将决定在启动特定实例时激活哪些通信管理器。错误地设置 `DB2COMM` 注册变量可能会在\
  \ DB2 在实例初始化期间尝试启动协议支持时产生一个或多个错误。\n\n要为 `DB2COMM` 注册变量分配值 `TCPIP`，请执行类似下面的 `db2set`\
  \ 命令：\n\n![Image](img/940-2.jpg)\n\n### 步骤 2：将数据库服务器用于接收来自远程客户端通信的 TCP/IP 端口名称分配给\
  \ DB2 数据库管理器配置文件的 `svcename` 参数。\n\n请确保将 `svcename` 参数设置为与主连接端口关联的服务名称，或端口号本身，以便当数据库服务器启动时，它可以确定在哪个端口监听传入的连接请求。您通过执行类似下面的\
  \ `UPDATE DATABASE MANAGER CONFIGURATION` 命令来设置此参数：\n\n![Image](img/941-1.jpg)\n\
  \n### 步骤 3：如果适用，更新数据库服务器上的 services 文件。\n\nTCP/IP services 文件标识了服务器应用程序监听客户端请求的端口。如果您在\
  \ DB2 数据库管理器配置文件的 `svcename` 参数中指定了服务名称，则你必须在服务器上的 services 文件中添加相应的服务名称到端口号/协议的映射。如果您在\
  \ `svcename` 参数中指定了端口号，则不需要更新 services 文件。\n\nservices 文件的默认位置取决于所使用的操作系统。在 UNIX\
  \ 系统上，services 文件命名为 `services` 并位于 `/etc` 目录；在 Windows 系统上，`services` 文件位于 `%SystemRoot%\\\
  system32\\drivers\\etc`。services 文件中 DB2 的条目可能如下所示：\n\n![Image](img/941-2.jpg)\n\
  \n在上述 `/etc/services` 文件片段中，`db2c_db2inst1` 服务的 TCP/IP 端口预留给客户端与 DB2 服务器之间的通信。剩余的服务\
  \ TCP/IP 端口范围预留给 DPF 系统中的数据库分区通信。\n\n### 步骤 4：重启数据库实例以激活新添加的服务名称：\n\n![Image](img/941-3.jpg)\n\
  \n# DB2 目录文件\n\nDB2 实例和关联数据库可以位于网络上任何地方的本地服务器。每个 DB2 实例必须知道其控制的数据库物理位置，以及如何代表用户和应用程序通过网络建立到这些数据库的连接。为了跟踪这些信息，DB2\
  \ 使用一组特殊文件，称为 `directory files`（或目录）。存在四种类型的目录：\n\n*   系统数据库目录\n*   本地数据库目录\n* \
  \  节点目录 (Node directory)\n*   数据库连接服务 (DCS) 目录\n\n# 系统数据库目录\n\n系统数据库目录位于一个名为 `sqldbdir`\
  \ 的文件中，当为实例创建第一个数据库时，该文件会自动在路径 `DBPATH/<instancename>/NODE0000/sqldbdir`（对于 UNIX\
  \ 环境）中创建。新数据库的信息随后记录在系统数据库目录中，随着其他数据库的注册（catalog），这些数据库的信息也会被记录。系统数据库目录中记录的每个条目包含以下信息：\n\
  \n*   数据库创建时（或显式注册时）分配给数据库的名称\n*   分配给数据库的别名（如果在创建/注册时未指定别名，则与数据库名相同）\n*   关于数据库的描述性信息（如果可用）\n\
  *   包含有关数据库附加信息的本地数据库目录文件的位置\n*   数据库本身的位置：\n    *   远程条目描述位于另一个节点上的数据库。\n    *\
  \   间接条目描述本地数据库。与系统数据库目录位于同一节点上的数据库被认为间接引用主条目（指向本地数据库目录），并被视为间接条目。\n    *   主条目指示目录与本地数据库目录位于相同路径。\n\
  \    *   LDAP 条目表示数据库位置信息存储在 LDAP 服务器上。\n*   其他系统信息，包括创建数据库时代码页\n\n您可以通过执行 `LIST\
  \ DATABASE DIRECTORY` 命令查看系统数据库目录或本地数据库目录文件的内容。该命令的语法为：\n\n![Image](img/943-1.jpg)\n\
  \n| where: |\n| `Location` | 标识存储一个或数据库的驱动器或目录 |\n\n如果您在执行此命令时未指定位置，将显示系统数据库目录文件的内容。但是，如果您指定了位置，将显示该特定位置本地数据库目录文件的内容：\n\
  \n![Image](img/943-2.jpg)\n\n# 本地数据库目录\n\n每当在新位置（即驱动器或目录）创建 DB2 数据库时，该位置也会创建一个本地数据库目录文件。该数据库的信息随后记录在本地数据库目录中，随着在该位置创建其他数据库，这些数据库的信息也会记录在本地数据库目录中。因此，尽管一个特定实例只存在一个系统数据库目录，但可以存在多个本地数据库目录，这取决于数据库在可用存储上的分布情况。\n\
  \n本地数据库目录中记录的每个条目包含以下信息：\n\n*   数据库创建时（或显式注册时）分配给数据库的名称\n*   分配给数据库的别名（如果在创建/注册时未指定别名，则与数据库名相同）\n\
  *   关于数据库的描述性信息（如果可用）\n*   用于存储数据库信息的层次树的根目录名称\n*   其他系统信息，包括创建数据库时代码页\n\n如前所述，您可以通过执行\
  \ `LIST DATABASE DIRECTORY` 命令查看本地数据库目录文件的内容：\n\n![Image](img/944.jpg)\n\n## 节点目录\n\
  \n与用于跟踪哪些数据库及其存储位置的系统数据库目录和本地数据库目录不同，节点目录包含标识如何以及在哪里找到远程系统或实例的信息。在首次注册远程服务器或实例时，每个客户端都会创建一个节点目录文件。随着其他远程实例或服务器的注册，它们的信息也会记录在节点目录中。节点目录中的条目将与系统数据库目录中的条目一起使用，用于对远程服务器上的\
  \ DB2 数据库建立连接和实例挂载。\n\n*   显式注册时分配给节点的名称\n*   关于节点的描述性信息（如果可用）\n*   远程数据库服务器使用的操作系统（可选）\n\
  \n\n\n\n\n*   用于客户端工作站与远程数据库服务器之间通信的通信协议\n*   远程数据库所在节点的 TCP/IP 主机或远程 TCP/IP 地址（如果使用的协议是\
  \ TCP/IP）\n*   远程实例的 TCP/IP 服务名称或端口号（如果使用的协议是 TCP/IP）\n\n要查看节点目录文件的内容，请执行 `LIST\
  \ NODE DIRECTORY` 命令。该命令的语法如下：\n\n```\n![Image](img/945.jpg)\n```\n\n如果在执行此命令时指定了\
  \ `ADMIN` 选项，将显示管理服务器的信息：\n\n![Image](img/945-946.jpg)\n\n# 数据库连接服务目录\n\n通过名为 `DB2\
  \ Connect` 的附加产品，DB2 for Linux、UNIX 和 Windows 客户端可以与 DRDA 应用程序服务器建立连接，例如：\n\n* System\
  \ z 架构主机计算机上的 DB2 for z/OS 数据库\n* System z 架构主机计算机上的 DB2 for VM and VSE 数据库\n* AS/400\
  \ 和 System i 计算机上的 DB2 数据库\n\n由于连接 DRDA 主机数据库所需的信息与连接基于局域网（LAN）的数据库的信息不同，因此远程主机数据库的信息在一个名为\
  \ `Database Connection Services (DCS)` 目录的特殊目录中。如果 DCS 目录中的条目名称与系统数据库目录中存储的数据库名称对应，则指定的应用程序请求程序（大多数情况下是\
  \ `DB2 Connect`）可以将 SQL 请求转发到位于远程 DRDA 服务器上的数据库。\n\n你可以通过执行 `LIST DCS DIRECTORY`\
  \ 命令查看 DCS 目录文件的内容。该命令的语法如下：\n\n```\n![Image](img/946.jpg)\n```\n\n需要注意的是，只有在安装了\
  \ `DB2 Connect` 产品的情况下，DCS 目录才会存在。\n\n## 目录化服务器和数据库\n\n一旦你配置了通信服务器，任何想要访问服务器上数据库的客户端都必须配置为与该服务器通信。但这只是第一步。你必须在客户端的系统数据库和节点目录中为服务器和远程数据库添加条目。（如果客户端打算通过\
  \ `DB2 Connect` 软件连接到 System z 或 System i 数据库，则必须向 DCS 目录添加条目。）你通过名为 `cataloging`（目录化）的过程向\
  \ DB2 目录添加条目。\n\n# 目录化 DB2 数据库\n\n由于数据库在创建时就会被隐式目录化，因此大多数用户永远不需要担心目录化过程。然而，如果你想访问存储在远程服务器上的数据库，你将需要熟悉用于目录化\
  \ DB2 数据库的工具。幸运的是，目录化数据库是一个相对简单的过程，可以使用 IBM Data Studio 或执行 `CATALOG DATABASE` 命令完成。\n\
  \n通过在 IBM Data Studio 的对象窗格中高亮 `All Databases` 对象并右击鼠标按钮，你可以打开一个包含数据库对象选项列表的菜单。要调用用于目录化数据库的对话框，请从此菜单中选择\
  \ `New Connection to a database`，如图 9.3 所示。\n\n```\n![Image](img/947-1.jpg)\n```\n\
  图 9.3：IBM Data Studio 中的新建连接选项\n\n当你输入数据库名称、主机名或 IP 地址以及端口号等连接参数时，IBM Data Studio\
  \ 会在内部创建一个目录，并使用提供的用户凭据与数据库实例及数据库建立连接。这些信息记录在 `org.eclipse.datatools.connectivity`\
  \ 目录中，仅供 IBM Data Studio 客户端后续连接使用。然而，其他应用程序无法使用此内部目录信息连接到 DB2 数据库服务器。图 9.4 了 IBM\
  \ Data Studio 中所需的连接参数。\n\n```\n![Image](img/947-2.jpg)\n```\n图 9.4：IBM Data Studio\
  \ 中的连接参数\n\n要配置应用程序服务器与数据库服务器之间的连接，你可以通过执行该命令来目录化数据库。该命令的语法如下：\n\n```\n![Image](img/948-1.jpg)\n\
  ```\n\n| where: | |\n| :--- | :--- |\n| `DatabaseName` | 标识分配给待目录化数据库的名称 |\n| `Alias`\
  \ | 目录化时分配给数据库的别名 |\n| `Path` | 标识物理存储待目录化数据库相关的目录层次和文件的位置（驱动器和/或目录） |\n| `NodeName`\
  \ | 标识待目录化数据库所在的节点；你指定的节点名称必须与节点目录文件中的条目匹配（即该名称对应于已经目录化的节点） |\n| `AuthenticationType`\
  \ | 标识当用户尝试访问数据库时何时以及如何进行身份验证；以下值对此参数有效：`SERVER`、`CLIENT`、`SERVER_ENCRYPT`、`KERBEROS\
  \ TARGET PRINCIPAL` `[PrincipalName]`（其中 `PrincipalName` 是目标服务器的全限定 Kerberos 主主体名称）、`DATA_ENCRYPT`\
  \ 和 `GSSPLUGIN` |\n| `Description` | 指定描述待目录化数据库在数据库目录中创建的条目的注释；你必须用双引号括起描述 |\n\n\
  因此，要目录化一个物理存储在 `/database` 且名称为 `DB21` 的本地数据库，你将执行类似下方的 `CATALOG DATABASE` 命令：\n\
  \n```\n![Image](img/948-2.jpg)\n```\n\n如果你想目录化一个物理存储在网络服务器上的远程数据库，请执行类似下方的 `CATALOG\
  \ NODE` 命令和 `CATALOG DATABASE` 命令（这要求你在执行 `CATALOG DATABASE` 命令之前运行 `CATALOG NODE`\
  \ 命令）：\n\n```\n![Image](img/949-1.jpg)\n```\n\n命令 `LIST DB DIRECTORY` 显示目录化信息，以及数据库发布级别和条目类型（间接（本地）或远程）：\n\
  \n```\n![Image](img/949-2.jpg)\n```\n\n数据库发布级别是从服务器数据库配置文件的“数据库管理器配置级别”中提取的内部 DB2\
  \ 发布级别——在 10.1 的情况下，它被设置为十六进制值 `0x0f00`。表 9.2 所示了不同的 DB2 版本和数据库发布级别。\n\n| 表 9.2：DB2\
  \ 内部发布级别 |\n| :--- | :--- |\n| DB2 8 | a.00 |\n| DB2 9 | b.00 |\n| DB2 9.5 | c.00\
  \ |\n| DB2 9.7 | d.00 |\n| DB2 9.8 | e.00 |\n| DB2 10.1 | f.00 |\n| DB2 10.5 | 10.00\
  \ |\n\n如果你需要对远程数据库进行目录化，将需要如下一节所示，先目录化节点（服务器），然后目录化数据库。\n\n# 目录化远程 DB2 节点（服务器）\n\
  \n目录化节点（服务器）的过程与目录化数据库的过程显著不同。节点通常按需要显式目录化的，而是每当通过 IBM Data Studio 目录化远程数据库时就会隐式目录化。然而，如果你想显式目录化特定节点（服务器），可以通过执行与访问待目录化服务器所需的通信协议对应的\
  \ `CATALOG … NODE` 命令来实现。多种形式的 `CATALOG … NODE` 命令可用，包括：\n\n```\n![Image](img/950.jpg)\n\
  ```\n\n\n\n\n\n所有这些命令的语法非常相似，主要区别在于每个命令提供的许多选项是针对该命令定制的通信协议的。由于 `TCP/IP` 可能是目前最常用的通信协议，让我们来看这种形式的\
  \ `CATALOG … NODE` 命令的语法。\n\n`CATALOG TCPIP NODE` 命令的语法如下：\n\n![Image](img/951.jpg)\n\
  \n| 参数： | 说明 |\n| :--- | :--- |\n| `NodeName` | 标识分配给待编目录节点的别名；这是在用户工作站创建的任意名称，用于标识节点\
  \ |\n| `IPAddress` | 标识您尝试通信的远程数据库的所在服务器的 IP 地址 |\n| `HostName` | 标识 `TCP/IP` 网络已知的主机名（这是您尝试通信的远程数据库所在服务器的主机名）\
  \ |\n| `ServiceName` | 标识服务器上的 DB2 数据库管理器实例用于通信的服务名称 |\n| `PortNumber` | 标识服务器上的\
  \ DB2 数据库管理器实例用于通信的端口号 |\n| `InstanceName` | 标识要建立连接的服务器实例名称 |\n| `SystemName` |\
  \ 标识用于识别服务器工作站的 DB2 系统名称 |\n| `SystemType` | 标识服务器工作站上使用的操作系统类型；此参数的有效值为：`AIX`、`WIN`、`HPUX`、`SUN`、`OS390`、`OS400`、`VM`、`VSE`\
  \ 和 `LINUX` |\n| `Description` | 指定描述节点目录条目的注释；必须将描述包含在双引号中 |\n\n如果您想为名为 `db2host`\
  \ 的 AIX 服务器编目录节点（该服务器有一个监听端口 `50001` 的名为 `db2inst1` 的 DB2 ），并分配别名 `PRDNODE`，则可以执行类似下面的\
  \ `CATALOG TCPIP NODE` 命令：\n\n![Image](img/952-1.jpg)\n\n要查看节点目录信息，请使用 `LIST NODE\
  \ DIRECTORY` 命令：\n\n![Image](img/952-2.jpg)\n\n![Image](img/note.jpg)\n\n**注意：**\
  \ 为一个 IPv4 地址为 `192.0.32.67` 且有一个监听端口 `50001` 的名为 `db2inst1` 的 DB2 的 Linux 服务器编目录节点，并分配别名\
  \ `ip4_node`，请执行类似下面的 `CATALOG TCPIP NODE` 命令：\n\n![Image](img/952-953.jpg)\n\n\
  然而，如果您想为一个 IPv6 地址为 `1080:0:0:0:8:800:200C:417A` 且有一个监听端口 `50001` 的名为 `db2inst1`\
  \ 的 DB2 的 Linux 服务器编目录节点，并分配别名 `ipv6_node`，则可以执行类似下面的 `CATALOG TCPIP NODE` 命令：\n\
  \n![Image](img/953-4.jpg)\n\n## 编目录数据库\n\n编数据库的过程与编节点非常相似。要编数据库，请使用 `CATALOG DATABASE`\
  \ 命令。`CATALOG DATABASE` 命令的语法如下：\n\n![Image](img/954.jpg)\n\n| 参数： | 说明 |\n| :---\
  \ | :--- |\n| `DatabaseName` | 标识待编目录的数据库名称 |\n| `NodeName` | 标识数据库所在节点的别名 |\n|\
  \ `IPAddress` | 标识数据库所在服务器的 IP 地址 |\n| `HostName` | 标识数据库所在服务器的主机名 |\n| `ServiceName`\
  \ | 标识 DB2 数据库管理器实例的服务名称 |\n| `PortNumber` | 标识 DB2 数据库管理器实例使用的端口 |\n| `InstanceName`\
  \ | 标识要建立连接的服务器实例名称 |\n| `SystemName` | 标识用于识别服务器工作站的 DB2 系统名称 |\n| `SystemType`\
  \ | 标识操作系统类型（例如：`AIX`、`WIN`、`HPUX`、`SUN`、`OS390`、`OS400`、`VM`、`VSE`、`LINUX`） |\n\
  | `Description` | 指定数据库条目的注释；必须使用双引号 |\n\n如果您想在位于主机 `192.168.1.10` 端口 `5000` 上的节点别名\
  \ `PRDNODE` 上编目录名为 `MYDB` 的数据库，请执行：\n\n```\nCATALOG DATABASE MYDB ON PRDNODE (HOST\
  \ 192.168.1.10 PORT 5000) DESCRIPTION \"My Database\"\n```\n\n要查看数据库目录，请使用 `LIST\
  \ DATABASE DIRECTORY` 命令：\n\n```\nLIST DATABASE DIRECTORY\n```\n\n\n\n\n\n`BINDADD`\
  \ 权限对于在远程数据库上创建包是必需的。包的创建者自动拥有该包的 `CONTROL` 权限，并且即使随后撤销了 `BINDADD` 权限，他们仍会保留该权限。执行以下命令授予特定用户在数据库服务器上创建包的权限：\n\
  \n![Image](img/956-2.jpg)\n\n# 关于 db2schema.bnd 文件说明\n\n在 Linux、UNIX 或 Windows DB2\
  \ 服务器上创建或迁移数据库时，一个名为 `db2schema.bnd` 的文件将作为数据库创建或迁移过程的一部分自动绑定到数据库。该绑定文件仅存在于这些类型的服务器上，用于创建一个提供系统目录功能支持的包。如果由于某种原因缺少此包（例如，服务器上应用了修复补丁、用户有意删除了该包，或者在创建或迁移数据库时生成了\
  \ `SQL1088W` 警告），则必须将 `db2schema.bnd` 文件重新绑定到数据库（存储在服务器本地）。\n\n在 Linux 和 UNIX 工作站上，`db2schema.bnd`\
  \ 绑定文件位于实例用户主目录下的 `sqllib/bnd` 子目录中；在 Windows 工作站上，该绑定文件位于 DB2 安装目录下的 `sqllib\\\
  bnd` 子目录中。要将此文件绑定到数据库，只需执行类似所示的 `BIND` 命令：\n\n![Image](img/957.jpg)\n\n在将工具和应用程序绑定到\
  \ System z 或 System i 数据库服务器以便配置 DB2 Connect 服务器使其访问存储在 System z 或 System i 主机数据库时，*切勿*将\
  \ `db2schema.bnd` 文件包含在绑定的文件集中。这样做会导致主机数据库的数据损坏。\n\n# 配置与 System z 和 System i 的通信\n\
  \n在访问存储在 DB2 for z/OS 或 DB2 for i5/OS 数据库的数据之前，你必须在运行 DB2 Connect 的客户端与 System z\
  \ 或 System i 主机之间配置 TCP/IP 通信。然后，你必须目录远程服务器和数据库。也就是说，你必须（从 DB2 Connect 服务器）执行以下步骤：\n\
  \n1. 在 DB2 Connect 服务器上配置 TCP/IP 通信。\n2. 目录 TCP/IP 节点。\n3. 将 System z 或 System i\
  \ 数据库作为 DCS 数据库进行目录。\n4. 目录 System z 或 System i 数据库。\n5. 将工具和应用程序绑定到 System z 或\
  \ System i 数据库服务器。\n\n建立 DB2 Connect 与 System z 或 System i 主机数据库之间连接的大多数步骤，与配置客户端访问远程服务器上的数据库的步骤相同。这两个过程之间最重要的区别在于需要将主机数据库作为\
  \ DCS 数据库进行目录的步骤，以及需要使用 `ddcsmvs.lst` 和 `ddsc400.lst` 列表文件将 DB2 工具和应用程序绑定到 System\
  \ z 或 System i 主机数据库的步骤。\n\n## DB2 Discovery\n\n很容易看出，手动配置客户端与服务器之间的通信如何变成一个困难的过程，尤其在复杂的网络环境中。而且，正如你所看到的，建立客户端与服务器之间的通信仅仅是开始。在客户端向\
  \ DB2 服务器发送请求进行处理之前，服务器以及存储在服务器上的数据库也必须在客户端上进行目录。\n\nDB2 Discovery 允许你轻松地目录远程服务器和数据库并建立客户端与服务器之间的分布式连接，而无需了解任何特定的通信细节。以下是\
  \ DB2 Discovery 的工作原理。\n\n当从客户端调用时，DB2 Discovery 在网络上广播发现请求，网络上每个配置为支持发现过程的 DB2\
  \ 服务器都会通过返回服务器上找到的实例列表、每个实例支持的通信协议信息以及每个实例中的数据库列表来响应。然后，你可以按照以下步骤使用 IBM Data Studio\
  \ 导入发现过程返回的任何实例或数据库的目录信息：\n\n**步骤 1：**打开 **Administration Explorer**（管理资源管理器）选项卡并选择\
  \ **Import**（导入）选项导入连接，如图 9.5\n\n*图 9.5：使用 IBM Data Studio 导入连接*\n\n**步骤 2：**在生成的\
  \ Import Connect Profiles 窗口中（参见图 9.6），选择 **Local file**（本地文件）选项。\n\n![Image](img/958-2.jpg)\n\
  \n*图 9.6：在 IBM Data Studio 中使用 Local file 选项导入*\n\n**步骤 3：**现在，通过勾选列出的连接旁的复选框来选择你想要导入的连接配置，如图\
  \ 9.7 所示。\n\n![Image](img/959.jpg)\n\n*图 9.7：选择要导入的数据库或实例*\n\n为了处理发现请求，DB2 Discovery\
  \ 可以使用两种方法：搜索（search）或已知（known）。搜索发现方法将在整个网络中搜索有效的 DB2 服务器和数据库，并向客户端返回找到的所有服务器、实例和数据库列表，以及目录和连接每个项目所需的通信信息。相比之下，已知发现方法将使用特定的通信协议在网络中搜索特定的服务器。（因为客户端知道服务器名称以及该服务器使用的通信协议，因此该服务器对于客户端是“已知”的。）同样，当已知发现方法定位到指定的服务器时，它会向客户端返回服务器上找到的所有实例和数据库列表，以及目录和连接每个项目所需的信息。\n\
  \n客户端是否可以启动 DB2 Discovery 请求、如果是如何启动、以及特定服务器是否会响应以及如果是如何响应，取决于 DAS 实例配置文件、每个实例的\
  \ DB2 数据库管理器配置文件（客户端和服务器上都有）以及实例内每个数据库的数据库配置文件中的参数值。\n\n具体而言，这些参数控制：\n\n* 客户端是否可以启动\
  \ DB2 Discovery 请求\n* DB2 Discovery 是否可以定位服务器，如果是，是仅在在使用搜索发现方法时还是在在使用搜索或已知发现方法时可以定位服务器\n\
  * 是否可以通过发现请求定位实例\n* 是否可以通过发现请求定位数据库\n\n表 9.3 描述了用于控制 DB2 Discovery 行为的 DAS 实例、DB2\
  \ 实例和数据库配置参数。\n\n| 表 9.3：控制 DB2 Discovery 行为的配置参数 |\n\n| **参数** | **值/默认值** | **描述**\
  \ |\n| :--- | :--- | :--- |\n| ***客户端实例*** ***(DB2 数据库管理器配置文件)*** | | |\n| `discover`\
  \ | `DISABLE`, `KNOWN`, 或 `SEARCH` 默认值 `SEARCH` | 标识客户端实例使用的 DB2 Discovery 操作。如果将此参数设置为\
  \ `SEARCH`，客户端可以发布搜索或已知发现请求；如果将此参数设置为 `KNOWN`，客户端仅可以发布已知发现请求；如果将此参数设置为 `DISABLE`，客户端无法发布发现请求。\
  \ |\n| `discover_inst` | `ENABLE` 或 `DISABLE` 默认值 `ENABLE` | 指定其他 DB2 Discovery\
  \ 请求是否可以检测到此实例。 |\n| ***服务器 DAS 实例***（参见下方 表 9.3 的注释）***(DAS 配置文件)*** | | |\n\n\n\
  \n\n\n| Parameter | Values | Description |\n| :--- | :--- | :--- |\n| `discover`\
  \ | DISABLE, KNOWN, or SEARCH 默认: `SEARCH` | 确定服务器启动时使用的 DB2 发现（Discovery）操作。如果将此参数设置为\
  \ `SEARCH`，服务器将响应搜索和已知的发现请求；如果将此参数设置为 `KNOWN`，服务器将仅响应已知的发现请求；如果将此参数设置为 `DISABLE`，服务器将不响应任何发现请求。\
  \ |\n\n## 服务器实例（DB2 数据库管理器配置文件）\n\n| Parameter | Values | Description |\n| :---\
  \ | :--- | :--- |\n| `discover` | DISABLE, KNOWN, or SEARCH 默认: `SEARCH` | 确定服务器实例将使用的\
  \ DB2 发现操作。如果将此参数设置为 `SEARCH`，则服务器实例可以发送搜索或已知的发现请求；如果将此参数设置为 `KNOWN`，则服务器实例只能发送已知的发现请求；如果将此参数设置为\
  \ `DISABLE`，则服务器实例无法发送发现请求。 |\n| `discover_inst` | ENABLE or DISABLE 默认: `ENABLE`\
  \ | 确定在服务器上发现的特定实例信息是否包含在服务器对发现请求的响应中。如果此参数设置为 `ENABLE`，服务器将在对搜索和已知的发现请求的响应中包含该实例的信息。如果此参数设置为\
  \ `DISABLE`，服务器在发现请求的响应中不会包含该实例的信息（也不会包含该实例控制的任何数据库的信息）。此参数提供了一种从 DB2 发现中隐藏实例及其所有数据库的方法。\
  \ |\n\n## 服务器数据库（数据库配置文件）\n\n| Parameter | Values | Description |\n| :--- | :---\
  \ | :--- |\n| `discover_db` | ENABLE or DISABLE 默认: `ENABLE` | 确定服务器上发现的特定数据库信息是否包含在服务器对发现请求的响应中。如果将此参数设置为\
  \ `ENABLE`，服务器将在对搜索和已知的发现请求的响应中包含该数据库的信息。然而，如果将此参数设置为 `DISABLE`，服务器在发现请求的响应中不会包含该数据库的信息。此参数提供了一种从\
  \ DB2 发现中隐藏单个数据库的方法。 |\n\n![Image](img/note.jpg)\n\n**注意：** DAS 在 DB2 9.7 中被弃用，并将在未来的发布版本中实际删除。由于\
  \ DAS 不再是 DB2 的核心组件，因此在 DB2 pureScale 环境中不受支持。\n\n如你所示，可以在服务器级、实例级和数据库级启用或禁用 DB2\
  \ 发现，并控制客户端和服务器发起发现请求。还可以配置服务器，使得在使用发现请求时 DB2 发现无法检测到一个或多个实例或数据库。图 9.8 显示了如何使用控制\
  \ DB2 发现行为的配置参数，防止 DB2 发现检测存储在服务器上的某些实例和数据库。\n\n![Image](img/962.jpg)\n\n*图 9.8：控制\
  \ DB2 发现可以检测哪些实例和数据库（在此示例中，发现请求将返回服务器、实例 1 和数据库 1；而非实例 2 和数据库 2）*\n\n## 快速通信管理器\
  \ (FCM)\n\n在分区数据库环境中，数据库分区之间的大多数通信都由快速通信管理器 (FCM) 处理。在创建实例期间，Linux 和 UNIX 平台的 `/etc/services`\
  \ 文件以及 Windows 上的 `%SystemRoot%\\system32\\drivers\\etc\\services 文件中将保留与每个服务器上参与的\
  \ DB2 逻辑分区数量相同的端口。FCM 使用这些端口进行通信。你可以使用以下格式保留端口：\n\n![Image](img/963.jpg)\n\n考虑一个\
  \ IBM Smart Analytics 系统 (ISAS) 的示例，它有一个管理节点（服务器）和四个数据节点（服务器），每个数据节点托管八个逻辑分区。你需要在\
  \ `/etc/services` 文件中保留八个端口，以便 FCM 守护进程在成员之间进行通信。\n\nFCM 使用 4 KB 缓冲区进行数据库分区和数据库服务器之间的内部通信；每个数据库分区使用的\
  \ 4 KB 缓冲区实际数量由 `fcm_num_buffers` DB2 数据库管理器配置参数控制。默认情况下，该参数被分配为 `AUTOMATIC` 值，这意味着\
  \ FCM 定期监控资源使用情况，如果资源在 30 分钟内未使用，则会增量释放资源。如果 DB2 在实例启动时无法分配所需的资源，它将增量减小配置值，直到实例成功启动。\n\
  \n如果你在同一台机器上有多个逻辑节点，可能会发现为此参数分配一个值是有益的。如果你已经为此参数分配了值，当由于系统用户数量、系统数据库分区服务器数量或所用应用程序的复杂性导致消息缓冲区不足，你可能会发现需要增加该值。然而，在尝试手动为\
  \ FCM 配置内存之前，建议从 `fcm_num_buffers`（FCM 缓冲区数量）和 `fcm_num_channels`（FCM 通道数量）DB2 数据库管理器配置参数的自动设置开始。然后使用系统监视器评估\
  \ FCM 活动，确定此设置是否合适。你可以通过如下管理视图或表函数获取 FCM 的系统监视器信息：\n\n## 管理视图\n\n![Image](img/963-964.jpg)\n\
  \n### 表函数\n\n![Image](img/964-1)\n\n\n\n\nLDAP 提供了一种在中心中心位置处理数据库服务器信息的有效方法，任何更改或添加都可以在该位置进行。所有应用程序客户端都引用\
  \ LDAP 目录来获取数据库位置和端口号的信息。图 9.9 显示了 LDAP 服务器、DB2 客户端和 DB2 数据库服务器之间的数据流。\n\n每个数据库服务器实例都通过向\
  \ LDAP 目录中插入或更新数据库信息，向 LDAP 服务器发布其存在性。在数据库连接期间，将从 LDAP 目录中检索服务器的目录信息，客户端使用这些信息连接到服务器。因此，客户端不再需要在本地机器的节点和数据库目录中存储这些信息。\n\
  \n![Image](img/966.jpg)\n\n*图 9.9：LDAP、DB2 客户端和 DB2 服务器之间的数据流*\n\n为了提高客户端重连期间的目录访问性能，存在一种缓存机制，使得客户端只需搜索一次\
  \ LDAP 目录服务器。在从 LDAP 目录检索信息后，将根据 `dir_cache` 数据库管理器配置参数的值和 `DB2LDAPCACHE` 注册表变量将其缓存在本地客户端计算机上。你使用\
  \ `dir_cache` 数据库管理器配置参数将数据库、节点和 DCS 目录文件存储在内存缓存中——`dir_cache` 可直到应用程序关闭所有连接。而使用\
  \ `DB2LDAPCACHE` 注册表变量将数据库、节点和 DCS 目录文件存储在本地数据库目录中。表 9.4 显示了 `DB2LDAPCACHE` 和 `dir_cache`\
  \ 之间的差异。\n\n| 表 9.4：DB2LDAPCACHE 和 dir_cache 参数差异 |\n\n| DB2LDAPCACHE | dir_cache\
  \ | 缓存信息 |\n| :--- | :--- | :--- |\n| 否 | 否 | 连接始终从 LDAP 读取信息。 |\n| 否 | 是 | 连接信息从\
  \ LDAP 读取并存储在 DB2 内存缓存中。 |\n| 是 | 是/否 | 连接信息从 LDAP 读取并存储在 DB2 本地数据库、节点和 DCS 目录。\
  \ |\n\n## 在 LDAP 中注册 DB2 服务器\n\n每个 DB2 服务器实例都必须在 LDAP 中注册，以发布客户端应用程序用于连接到 DB2 服务器实例的连接信息。在注册数据库服务器实例时，你必须指定一个节点名称，客户端在连接或附加到服务器时将使用该名称。\n\
  \n你从 DB2 服务器颁发 `REGISTER` 命令，如下：\n\n![Image](img/967-1.jpg)\n\n| 何处： |\n| :--- |\n\
  | `ldap_node_name` | 标识每个 DB2 服务器的节点名称，且在 LDAP 目录内必须唯一的 |\n\n你也可以使用此命令远程为任何 DB2\
  \ 服务器颁发 `REGISTER` 命令：\n\n![Image](img/967-2.jpg)\n\n| 何处： |\n| :--- |\n| `ldap_node_name`\
  \ | 标识每个 DB2 服务器的节点名称，且在 LDAP 目录内必须唯一的 |\n| `db2_host_name` | 标识你要在 LDAP 目录中注册的服务器的主机名\
  \ |\n| `tcpip_service_name` | 标识你要在 LDAP 目录中注册的的服务名称 |\n| `db2_server_name` | 标识你要在\
  \ LDAP 目录中注册的服务器的主机名 |\n| `db2_instance_name` | 标识你要在 LDAP 目录中注册的服务器的实例名 |\n\n##\
  \ 在 LDAP 中注册 DB2 数据库\n\n在 LDAP 中创建数据库期间，客户端尝试连接数据库，并根据 `DB2LDAPCACHE` 和 `dir_cache`\
  \ 设置在本地缓存数据库信息。假设一切配置正确，到远程数据库的测试连接应该是成功的。\n\n要在客户端处注册数据库，你使用 `CATALOG` 命令：\n\n\
  ![Image](img/968-1.jpg)\n\n| 何处： |\n| :--- |\n| `dbname` | 标识要在 LDAP 中注册的数据库的名称\
  \ |\n| `ldap_node_name` | 标识每个 DB2 服务器的节点名称，且在 LDAP 目录内必须唯一的 |\n\n## 从 LDAP 中注销\
  \ DB2 服务器\n\n从 LDAP 中注销实例将移除节点、别名和相关的数据库对象。要从 LDAP 目录中删除服务器，可以使用 `DEREISTER` 命令：\n\
  \n![Image](img/968-2.jpg)\n\n| 何处： |\n| :--- |\n| `ldap_node_name` | 标识每个 DB2 服务器的节点名称，且在\
  \ LDAP 目录内必须唯一的 |\n\n# 从 LDAP 中注销 DB2 数据库\n\n从 LDAP 中注销数据库将从服务器删除数据库信息。要在客户端处删除数据库，使用\
  \ `UNCATALOG` 命令：\n\n![Image](img/969.jpg)\n\n| 何处： |\n| :--- |\n| `dbname` | 标识要在\
  \ LDAP 中注销的数据库的名称 |\n\n# 故障排除通信错误\n\n在配置客户端与远程数据库通信后，对远程数据库进行测试连接。然而，如果测试连接导致错误，请采取以下操作确定错误发生的原因：\n\
  \n1. 验证远程数据库服务器通过网络是否可用。尝试从客户端机器 shell 中使用 IP 地址或主机名 `ping` 服务器。如果没有网络或服务器问题，你通常应该看到\
  \ 0% 的丢包率。如果 ping 测试期间往返时间极高，使用命令 `tracert` (Windows) 或 `traceroute` (UNIX) 验证客户端的跳数和跳数之间的时间。\n\
  \n2. 使用 `telnet <hostname/ipaddress> <portnumber>` 验证客户端是否可以访问连接服务器上数据库实例的端口。\n\n\
  3. 验证远程数据库是否可用。尝试连接服务器上的远程数据库。如果你无法在本地连接数据库，请将数据库上线并再次从客户端尝试连接。如果你可以在本地连接数据库，则问题在其他处。\n\
  \n4. 确保远程数据库服务器已配置为通过所需的协议接收传入连接。确保客户端和服务器上的 `DB2COMM` 注册表变量具有匹配的值。（你可以通过执行命令 `db2set`\
  \ 实现此）。验证服务器上 DB2 数据库管理器配置文件的 `svcename` 参数已分配数据库服务器用于接收来自远程客户端通信的 TCP/IP 端口的正确名称，并确保数据库服务器上的\
  \ services 文件具有匹配的条目。最后，确保运行 `netstat | grep -i <servicename>` 来监控 DB2 监听器状态 `[ESTABLISHED,\
  \ TIME_WAIT]`。\n\n\n\n\n\n5. 验证节点是否在客户端已正确编入。确保用于编入远程服务器的端口号在远程服务器的 `services` 文件中有匹配的项。（测试此项的最简单方法是连接到节点。）\n\
  \n6. 验证 DCS 数据库是否在客户端已正确编入。如果远程数据库位于 System z 或 System i 服务器上，它必须在 DCS 数据库目录中有一个项。检查\
  \ DCS 数据库目录以查看数据库是否已正确编入。（确保在编入 DCS 数据库时，指定的本地数据库别名和远程数据库名称没有被意外交换；目标数据库名称应指向 z/OS\
  \ 上子系统的 `LOCATION` 名称。）\n\n7. 验证数据库是否在客户端已正确编入。在建立连接之前，必须在客户端的系统数据库目录中编入该数据库。此外，如果远程数据库位于\
  \ System z 或 System i 服务器上，你必须同时在 DCS 数据库目录和系统数据库目录中编入它。检查系统数据库目录以查看数据库是否已正确编入。（确保在编入数据库时，指定的本地数据库别名和远程数据库/DCS\
  \ 数据库名称没有被意外交换。同时，确保节点目录中有相应的节点项。）\n\n8. 验证 DB2 Discovery 是否在服务器端已正确配置。如果你尝试使用 DB2\
  \ Discovery 但无法找到特定的服务器、实例或数据库，请检查相应的配置参数，以确定 DB2 Discovery 请求能否检测到服务器、实例或数据库。\n\
  \n## 章节总结\n\n本章的目标是让你熟悉以下内容：\n\n* DB2 Linux、UNIX、Windows 以及 DB2 for z/OS 中提供的客户端/服务器通信方法和协议\n\
  * 如何编入和取消编入远程节点和数据库\n* 如何使用配置参数控制 DB2 Discovery 过程的行为\n* FCM 在 DB2 服务器内部的意义\n* 如何通过\
  \ LDAP 注册 DB2 节点和数据库\n* 常见的通信错误及其解决方法\n\n完成本章后，你将具备足够的知识回答认证考试中的通信和网络问题。强烈建议你完成章节末尾提供的示例题。\n\
  \n## 练习题\n\n### Question 1\n\n哪条命令可以为 IP 地址为 1080:0:0:0:8:800:200C:417A 且实例在端口 50000\
