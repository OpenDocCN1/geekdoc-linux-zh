  \ `UTIL_HEAP_SZ` 至少为 1 MB 页面：\n\n![Image](img/1078-1.jpg)\n\n通过添加 `OPT_SORTHEAP_EX_COL`\
  \ 设置注册表参数 `DB2_EXTENDED_OPTIMIZATION`：\n\n![Image](img/1078-2.jpg)\n\n为了支持影子表创建\
  \ `SYSTOOLS` 表，运行以下命令：\n\n![Image](img/1078-3.jpg)\n\n你向 `SYSTOOLS` 模式授予 `PUBLIC\
