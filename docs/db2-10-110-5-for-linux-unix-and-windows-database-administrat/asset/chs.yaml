  \n连接和负载一样具有特定的特性。因此，你创建 WLM 对象来管理特定负载的方式，对于影子表你也将采取相同的方法。\n\n你可以设置一个新的数据库参数，以便在发出连接请求时强制执行存储过程。该存储过程的目的是识别你想要作为影子表候选的负载，并设置所需的连接属性以允许它们以列式运行。\n\
