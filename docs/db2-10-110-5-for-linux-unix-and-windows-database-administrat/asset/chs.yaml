  \ 按钮上方）输入该编号，然后点击 `Review Item` 来实现。\n\n当项目回顾面板显示时，你应该做的早期工作之一是解决所有未完成的项目。（考试评分时，每个未完成的项目都会被标记为错误，分数将从你的最终得分中扣除。）然后，如果时间允许，返回回顾你标记的题目。需要注意的是，当你完成对已标记题目的回顾后，在进入下一个已标记问题或返回项目回顾面板之前，要通过将鼠标悬停在\
  \ `Mark` 复选框上并按下左鼠标键来取消标记。这样做可以更方便地跟踪哪些题目已经回顾过，哪些还没有过。\n\n一旦你解决了所有未完成的项目，`Review\
  \ Incomplete` 按钮将自动从项目回顾面板中移除。同样，当没有更多已标记的题目时，`Review Marked` 按钮也会从项目回顾面板中消失。因此，当所有未完成和已标记的项目都解决后，项目回顾面板将与图\
  \ 1.12 中的面板相似。\n\n![Image](img/20-1.jpg)\n\n*图 1.12：已解决所有未完成和已标记项目（问题）回顾面板*\n\n\
  请记住，即使 `Review Incomplete` 和 `Review Marked` 按钮不再可用，你仍然可以通过突出显示该题目的编号或在提供的字段中输入并点击\
  \ `Review Item` 来返回查看特定题目（参考图 1.12）。\n\n一旦你对提供的答案感到满意，就可以点击位于项目回顾面板左下角的 `End` 按钮来结束考试并提交评分。点击此按钮后（通过将鼠标悬停在其上方并按下左鼠标键），将出现一个与图\
  \ 1.13 所示的对话框。\n\n![Image](img/20-2.jpg)\n\n*图 1.13：结束考试话确认对话框*\n\n如果你在解决所有未完成项目之前在项目回顾面板上点击\
  \ `End`，则会显示一个与图 1.14 所示的对话框。\n\n![Image](img/21-1.jpg)\n\n*图 1.14：带有未完成项目警告的结束考试对话框*\n\
  \n这两个对话框都为你提供了机会，以确认结束考试并提交评分的决定，或者重新考虑并继续解决或回顾考试题目。如果你想执行前者，在显示这些对话框时点击 `OK` 或\
  \ `Yes`；如果你想执行后者，点击 `Cancel` 或 `No`，这将你返回到项目回顾面板。请记住，如果在显示图 1.14 所示的对话框时点击 `Yes`\
  \ 按钮，所有未完成的项目将被标记为错误，这将对你的最终得分产生负面影响。\n\n一旦你确认确实想结束考试，IBM 认证考试测试软件将评估你的答案并生成一份评分报告，指示你是否通过了考试。该报告将出现在类似于图\
  \ 1.15 所示的考试结果面板上，并生成相应的纸质打印件。\n\n![Image](img/21-2.jpg)\n\n*图 1.15：IBM 认证考试测试软件的考试结果面板*\n\
  \n如果你在考试结果面板中点击 `Section Scores` 按钮，你将看到考试每个部分的得分，如图 1.16 所示。\n\n![Image](img/22.jpg)\n\
  \n*图 1.16：IBM 认证考试测试软件的考试部分评分结果*\n\n在你参加认证考试后（通常在五个工作日内），测试供应商会将你的结果以及个人统计数据（例如姓名、地址、电话号码）发送给\
  \ IBM 认证组进行处理。如果你通过了考试，将获得该考试设计的认证角色的积分。（你应该在 IBM 处理考试后的四到六周内收到 IBM 认证协议和欢迎包。）然而，如果你未能通过考试但仍希望获得认证，你必须安排重考（包括再次支付考试费用）。参加特定认证考试的次数没有限制，但在\
  \ 30 天内参加同一场认证考试次数不能超过两次。\n\n# 第 2 章：DB2 服务器管理\n\n本章将让你准备配置和管理 DB2 服务器、实例和数据库。你将学习使用许多\
  \ DB2 自动计算功能来提高系统可用性和性能。在本章结束时，你还将能够安装和配置 IBM Data Studio 来执行数据库管理活动，例如数据库维护作业计划和视觉化解释计划生成。\n\
  \n## 考试目标\n\n*   展示创建和管理 DB2 实例的能力\n*   展示查看和修改 DB2 系统注册表变量的能力\n*   展示查看和修改 DB2\
  \ 数据库管理器配置信息的能力\n*   展示查看和修改数据库配置信息的能力\n*   展示获取数据库独占控制的能力\n*   展示使用自动维护的能力\n* \
  \  展示使用 STMM 的能力\n*   展示使用配置建议器（Configuration Advisor）的能力\n*   展示使用自动存储功能的能力\n*\
  \   展示使用数据压缩功能的能力\n*   展示限制程序的能力\n*   展示使用 IBM Data Studio 调度和管理作业的能力\n\n## 实例操作\n\
  \n\n\n\nDB2 将世界视为对象的层级结构。安装了 DB2 的 `Workstations or servers` 占据该层级结构的最高层。当在工作站上安装任何版本的\
  \ DB2 时，名为 `DB2 database manager` 的后台进程的程序文件会被物理复制到该工作站的特定位置，在大多数情况下，会创建一个 `DB2\
  \ database manager` 实例。\n\n`Instances` 占据层级结构的第二层，负责管理其控制范围内的系统资源和数据库。虽然最初只创建一个实例，但多个实例可以在同一台服务器上共存。每个实例的行为都像是一个独立的\
  \ DB2 安装程序，尽管系统中的所有实例都共享相同的 `DB2 database manager` 程序文件（除非每个实例运行的是不同版本的 DB2）。尽管多个实例共享相同的二进制代码，但每个实例都独立于其他实例运行，并有自己的环境，该环境可以通过更改其关联配置的内容进行修改。\n\
  \n`Databases` 构成了层级结构的第三层，负责管理数据的存储、修改和检索。与实例一样，数据库之间独立运行。每个数据库都有自己的环境，由一组配置参数控制，并拥有一套可授予的权限和特权，用于管理用户如何与其控制的数据以及数据库对象交互。图\
  \ 2.1 显示了系统、实例和数据库之间的层级关系。\n\n虽然大多数 DB2 环境每台服务器只有一个实例，但有时在同一台物理服务器上创建多个实例是有益的。创建多个实例的原因包括：\n\
  \n*   将您的开发环境与生产环境隔离开来\n*   为特殊应用程序获得最佳性能（例如，您可以选择为一个或多个应用程序创建一个实例，然后针对其将提供的服务对每个实例进行特定的微调）\n\
  *   防止数据库管理员访问敏感数据（例如，公司的工资数据库可以存在于自己的实例中，在这种情况下，同一服务器上其他实例中其他数据库的所有者将无法访问工资数据）\n\
  \n显然，根据您在附加实例创建的数据库上运行的负载，多个实例将额外的系统资源，如磁盘空间、内存和 CPU。\n\n正如您所想象的，DB2 提供了几个用于创建和管理实例的命令。表\
  \ 2.1 显示了这些命令，它们被称为系统命令，因为它们是从系统命令行提示符执行的，而不是从 DB2 命令行处理器 (CLP)。\n\n![Image](img/25.jpg)\n\
  \n*图 2.1：系统、实例和数据库之间的层级关系*\n\n| **表 2.1：DB2 实例管理命令** |\n| Command | 目的 |\n| :---\
  \ | :--- |\n| `db2icrt [InstanceName]` | 创建新实例 |\n| `db2idrop [InstanceName]` |\
  \ 删除（删除）现有实例 |\n| `db2ilist` | 列出在该安装内定义的所有实例 |\n| `db2ckupgrade [DatabaseName]`\
  \ | 验证本地数据库已准备好升级 |\n| `db2iupgrade [InstanceName]` | 将现有实例升级到更高版本的 DB2 |\n| `db2iupdt\
  \ [InstanceName]` | 更新现有实例以利用产品发布时提供的新功能 |\n| `db2start` | 启动实例数据库管理器 |\n| `db2stop`\
  \ | 停止实例数据库管理器 |\n\n### 连接到实例\n\nDB2 环境变量 `DB2INSTANCE` 决定了 DB2 命令连接到哪个实例。要连接到特定实例，请将\
  \ `DB2INSTANCE` 变量设置为该实例的名称。\n\n```bash\nexport DB2INSTANCE=InstanceName\n```\n\n\
  ### 离实例\n\n要从当前实例分离，请清除 `DB2INSTANCE` 环境变量。\n\n```bash\nunset DB2INSTANCE\n```\n\
  \n### 启动和停止实例\n\n要启动实例的 DB2 数据库管理器，请使用 `db2start` 命令。\n\n```bash\ndb2start\n```\n\
  \n要停止实例的 DB2 数据库管理器，请使用 `db2stop` 命令。\n\n```bash\ndb2stop\n```\n\n\n...[/content].\n\
