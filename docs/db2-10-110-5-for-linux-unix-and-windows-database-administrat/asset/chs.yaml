  \ `<fenced user>` 和 `<instance name>` UNIX 账户。\n\n在服务器 `MEMSERVER3` 上，以 root 用户身份执行以下命令：\n\
  \n![Image](img/1005-1.jpg)\n\n现在运行 `db2iupdt` 命令以添加其他成员和第二个 CF：\n\n![Image](img/1005-2.jpg)\n\
  \n## 管理对数据库服务器的访问\n\nDB2 依赖操作系统来验证用户身份。身份验证可以通过本地操作系统或单点登录 (SSO) 解决方案（如 Microsoft\
  \ Active Directory 或 IBM Tivoli Identity Manager）进行。\n\n无论您使用什么工具来管理 DB2，都必须决定需要哪些账户，然后根据工具确定如何定义和管理这些账户。\n\
  \n任何数据库都提供四种基本的访问类型：\n\n1. **服务类别。** 这涉及那些维护数据库环境并负责其持续支持的人。这些通常是管理员或专门的服务提供商，如监控或备份/恢复。\n\
  2. **开发类别。** 这涉及构建和支持使用数据库应用程序的人员。此组的权限根据环境和公司而异。此组通常对生产环境中的数据具有只读权限，在某些情况下可能被限制仅访问特定列。在开发环境中，此组可能具有全\
  \ DML 级访问权限，但 DDL 访问权限有限。\n3. **应用程序类别。** 这些是访问数据库的应用程序。访问权限通常由设计决策和公司策略决定。例如，大多数公司都有策略限制从已部署应用程序代码内部执行任何\
  \ DDL 操作。在这种情况下，用户获得应用程序的访问权限，然后由应用程序访问数据库。应用程序中部署的任何测试功能，其授权用户都可以使用。\n4. **高级用户类别。**\
  \ 这些是直接访问数据库的用户，通常通过某些支持的客户端界面。在许多情况下，这些用户直接对生产数据库运行未测试的 SQL 查询。该类别目前是最难管理的，而且可能是目前最受关注的类别。“释放数据”的整个概念是让信息呈现在任何组织内决策者的手中。\n\
  \n## 组、角色、用户 ID\n\n用户 ID（User ID）是向数据库标识该用户的字符串，例如命令行语句 `“db2 connect to DB1 user\
  \ <userid> `。操作系统通过名为 `db2ckpw` 的 DB2 程序来验证此用户 ID。在此语境下，UNIX 或 Windows 登录账户就是一个用户\
  \ ID。\n\n当您定义用户 ID 时，您会将其分配给一个或多个组。定义组是为了识别具有相同通用角色或责任的用户集合。在接下来的 UNIX 示例中，用户 ID\
  \ 为 `db2inst1`，并已分配给三个组：`db2inst1`（主）以及 `dba` 和 `db2das`（从）。在 Windows 系统上也是如此。\n\
  \n![Image](img/1006.jpg)\n\nDBA 可以将数据库访问权限分配给 `db2inst1`（用户）或分配给三个组中的任何一个或三个 `(db2inst1,\
  \ dba, db2das)`。同样在此语境下，数据库组等于 UNIX 或 Windows 组。例如，在 Windows 上，安装 DB2 时会创建两个重要的组：`DB2ADMNS`\
  \ 和 `DB2USERS`。\n\n在数据库内部，可以将用户或组分配给角色。例如，您可以设置角色 `SP_ADM`，并赋予管理存储过程的必要权限，但仅限于特定架构模式：\n\
  \n![Image](img/1007-1.jpg)\n\n一旦定义了角色，您就可以将其分配给用户或组。\n\n本章后面的“物理设计”部分将更深入地讨论。此时，请理解您可以以多种方式对账户分组。例如，您可以将所有\
  \ `PAYROLL DB` 用户分到一个名为 `PAYROLL_USERS` 的组中。所有支持 `PAYROLL` 数据库的 DBA 可以被分组并命名为 `PAYROLL_DBADM`。这将允许\
  \ DBA 在组级别控制访问权限。\n\n## 为单个 DB2 实例创建组和用户 ID\n\n作为 root，`<db2instance>` 是运行所有 DB2\
  \ 系统进程的 UNIX 用户 ID (SYSADM)，`<db2edu>` 是运行所有围栏（fenced）进程的 UNIX 用户 ID，`<db2group>`\
  \ 是支持所有 DB2 进程的 UNIX 管理组。\n\n在接下来的示例中，使用：\n* `db2inst1` 作为 DB2 实例 (DB2INSTANCE)\n\
  * `db2fenc1` 作为 DB2 围栏账户 (DB2EDU)\n* `dbagrp` 作为分配给所有 DBA 的 UNIX 组\n\n### 第 1 步：创建\
  \ HOME 目录：\n\n![Image](img/1007-2.jpg)\n\n### 第 2 步：根据需要创建 UNIX 账户和组。\n\n在 AIX 上（smitty\
  \ 是一个非常好的管理员工具），添加组 `dbagrp`：`“mkgroup -‘A’ dbagrp”` 或“smitty group”。\n\n接下来，添加用户\
  \ `db2inst1:` `“smitty user”`，或使用以下命令：\n\n![Image](img/1008-1.jpg)\n\n要添加用户 `db2fenc1`，执行此命令：\n\
