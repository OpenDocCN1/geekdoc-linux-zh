  \n## 管理 JSON\n\n你可以通过 `nosql.properties` 文件控制 JSON 的若干功能。尽管你可以将此文件放置在应用程序服务器的任何位置，但你必须将其位置包含\
  \ shell 的 `CLASSPATH` 中（详细请参阅 IBM Knowledge Center）。表 10.12 列出了 NoSQL 属性。\n\n| 表\
  \ 10.12: NoSQL 属性 |\n| 属性 | 定义 |\n| :--- | :--- |\n| `nosql.asyncMaxThreadCount`\
  \ | 最大异步线程数 |\n| `nosql.connectionPoolSize` | JDBC 连接池大小 |\n| `nosql.tracefile`\
  \ | 跟踪文件名 |\n| `nosql.tracelevel` | 跟踪输出级别 |\n| `nosql.statementCacheSize` | 内部语句缓存大小\
  \ |\n| `nosql.afg.includeID` | 如果未指定 `custom_id`，则聚合查询添加 `_id` 字段 |\n| `nosql.caseSensitiveNames`\
  \ | 模式/集合区分大小写 |\n| `nosql.multiTypedID` | 启用同一集合中的文档支持不同类型的多个 __id 字段 |\n\n## 使用\
  \ Data Studio V4.1.1\n\nData Studio V4.1.1 可以作为你组织的中心开发和支持产品。一些关键业务用途包括存储过程开发、数据库管理、SQL\
  \ 分析和工作负载分析。\n\n若干款 IBM 产品使用 Eclipse 框架，包括 Rational 工具。Eclipse 基于“视图”（perspectives）的概念构建。*视图*是世界的视角，在这种情况下指的是\
  \ DB2。在 Data Studio V4.1.1 中，DB2 提供了 24 种视图，并具有构建自定义视图的能力。图 10.14 显示了打开视图（Open Perspective）窗口中的视图。\n\
  \n![Image](img/1050-1.jpg)\n\n*图 10.14: 打开视图窗口*\n\n## 配置 DB2 数据库\n\nData Studio\
  \ 提供了五个配置向导（参见 图 10.15）。\n\n![Image](img/1050-2.jpg)\n\n*图 10.15: 配置向导*\n\n图 10.16\
  \ 中的“配置参数”向导显示了数据库配置设置，并根据几个关键因素对其进行识别，包括**自动、立即和已弃用**。它会在进行更改时构建命令。\n\n![Image](img/1051.jpg)\n\
  \n*图 10.16: 配置参数向导中的数据库属性*\n\n第二个向导是“配置自动维护”。如 图 10.17 所示，该向导允许更改数据库的自动维护配置设置、在线和离线调度窗口的定义，以及\
  \ `RUNSTATS`、`REORG` 和备份的策略定义。\n\n![Image](img/1052.jpg)\n\n*图 10.17: 配置自动维护向导*\n\
  \n操作的**在线**和**离线维护窗口**设置可以基于“允许”或“阻止”。你可以将窗口设置为每周的特定几天，或周几与月中某几日的组合。在 图 10.18 中，**在线维护窗口**时长\
  \ 14 小时，从周一至周五的 6:00 开始到 20:00 结束。\n\n![Image](img/1053.jpg)\n\n*图 10.18: 在线维护计划*\n\
  \n在 图 10.19 中，**离线维护窗口**的开始时间为 21:00（晚上 9:00），每天持续七 小时。\n\n![Image](img/1054.jpg)\n\
  \n*图 10.19: 离线维护计划*\n\n对于**备份策略**，图 10.20 显示每天至少发生一次在线备份，备份之间占用的日志空间不超过 250 GB。备份将发送到\
  \ TSM。\n\n![Image](img/1055.jpg)\n\n*图 10.20: 备份计划*\n\n接，，你设置**Reorg 策略**将表大小限制在\
  \ 40 GB 以，并允许在所有表（包括系统表）上执行 REORG（参见 图 10.21）。对于压缩表，选择**保留压缩数据字典**选项；对于索引，选择在线执行工作。\n\
  \n![Image](img/1056.jpg)\n\n*图 10.21: Reorg 策略计划*\n\n在 图 10.22 中，你设置**Runstats 策略**为所有表。\n\
  \n![Image](img/1057.jpg)\n\n*图 10.22: Runstats 策略*\n\n你执行以下生成的命令为你的数据库设置此维护计划。示例命令指定了具有在线和离线窗口的\
  \ `MAINTENANCE_WINDOW` 策略，一个用于每天执行或当日志活动达到 2621440 页时执行在线备份的 `AUTO_BACKUP` 策略，以及一个针对所有表进行索引在线\
  \ `REORG` 的 `AUTO_REORG` 策略。\n\n注意，尽管选了该项，但并没有 Runstats 策略。原因是数据库配置设置 `AUTO_RUNSTATS`\
  \ 正在生效；因此，已经存在包含所有表的策略。\n\n目前在 Data Studio 中，你可以在**备份策略**窗口上指定的最大日志持续时间值为 10240\
  \ MB。请记住这一点，以便在执行策略命令之前将其更改所需的大小：\n\n![Image](img/1058.jpg)\n\n## 调优 SQL\n\n查询负载调优器（Query\
  \ Workload Tuner）是 Data Studio 的组件，你用它运行查询分析以识别并修复性能问题。入门的方法之一是使用任务启动器（Task Launcher）窗口并选择**调优**（Tune），如\
  \ 图 10.23 所示。\n\n![Image](img/1059.jpg)\n\n*图 10.23: 任务启动器*\n\n在下一个窗口中，选择**开始调优**（Start\
  \ tuning）（参见 图 10.24）。\n\n![Image](img/1060.jpg)\n\n*图 10.24: 开始调优选项*\n\n将创建一个项目并打开输入\
  \ SQL 文本窗口，如 图 10.25 所示。\n\n![Image](img/1061.jpg)\n\n*图 10.25: 带有输入文本选项的工作流助手*\n\
  \n点击**文件**（File）以捕存储在文件中的 SQL 语句（参见 图 10.26）。\n\n![Image](img/1062.jpg)\n\n*图 10.26:\
  \ 从文件读取 SQL*\n\n点击**调优语句**（Tune Statement），然后**选择运行内容**（Select What to Run）。对于此示例，在\
  \ 图 10.27 中点击**全选**（Select All）。\n\n![Image](img/1063.jpg)\n\n*图 10.27: 活动选择*\n\n\
  正在调优的 SQL 查询如下：\n\n![Image](img/1064-1.jpg)\n\n在 图 10.28 中，左侧面板中的**打开格式化查询**（Open\
  \ Formatted Query）提供了涉及表和数据组织的详细说明。点击图标将在新窗口中打开内容。\n\n![Image](img/1064-2.jpg)\n\
  \n*图 10.28: 分析结果*\n\n图 10.29 显示了数据的片段，例如统计信息以及关于 `WHERE` 子句中特定列的倾斜注释。\n\n![Image](img/1065-1.jpg)\n\
  \n*图 10.29: 表和列统计信息*\n\n让我们查看 图 10.30 中的图形化解释（Explain）。再次，在新窗口中打开它。\n\n\n\n\n\n\
  ![Image](img/1065-2.jpg)\n\n*图 10.30: 图形解释示例*\n\n从 `TTIE_FACT` 开始，你会看到分析产生了一项建议（参见图\
  \ 10.31）。\n\n![Image](img/1066.jpg)\n\n*图 10.31: 推荐表*\n\n统计顾问（Statistics Advisor）建议对此查询中的所有三个表收集统计信息。然而，没有必要的，因为所有三个表都是列组织的，且统计信息的收集是自动的。\n\
  \n注意，此解释（Explain）包含三次表扫描。列表队列（CTQ）是列处理和行处理之间的交接点。某些查询操作（如排序）是在行组织的数据上执行的。\n\n在这种情况下，执行计划中没有排序操作。结果集正在形成中，并以行格式返回给请求者。\n\
  \n如图 10.32 所示，`CTQ` 之后是表队列（`TQ`），然后是返回。\n\n如果你添加 `DISTINCT`，整体计划会发生什么？没有变化，因为 `UNIQUE`过程是在列数据上执行的。但如果你添加\
  \ `ORDER BY`，整体计划会发生什么？如图 10.33 所示，在数据从列组织转换为行组织后，你将获得一个访问计划顾问建议和一个排序操作。\n\n![Image](img/1067-1.jpg)\n\
  \n*图 10.32: 返回统计*\n\n![Image](img/1067-2.jpg)\n\n*图 10.33: 带有排序的图形解释*\n\n![Image](img/note.jpg)\n\
  \n**注意：** 处理列数据时，最昂贵的步骤可能是将这些数据转换为行。尽可能以列数据的形式进行整体处理对于查询的整体执行时间至关重要。结果集始终以行结构返回，且所有的排序操作都在行结构上执行。\n\
  \n## 工作负载管理\n\n多年来，DB2 一直提供 DB2 控制器作为控制资源和优先级的方法。此外，DB2 在操作中包含 WLM 特性，包括 UNIX 和\
  \ DB2 WLM 组件。\n\n本节将识别成功实现 WLM 的关键并提供特定示例。在数据库中管理 WLM 对象需要 `WLMADM-` 或 `DBADM-`\
  \ 级别的权限。\n\n## 规划\n\n在部署 WLM 策略和操作之前，我们首先需要一组明确的目标。是否已经有一套明确的服务水平协议（SLAs）？工作负载是否根据重要性分成了分类？无论目标如何，它们是否可以被量化？\n\
  \n映射 WLM 定义的一种良好方法是构建类似于表 10.13 所示的工作负载矩阵。\n\n![Image](img/1068.jpg)\n\n一旦完成工作负载矩阵，请按照以下步骤定义\
  \ WLM 策略：\n\n*   创建工作负载定义。\n*   为已识别的工作负载创建服务类。\n*   根据阈值或动作创建工作类。\n*   通过 `REMAP`\
  \ 和 `MAP` 动作将工作类与服务类关联。\n*   在激活 WLM 之前获取基准性能指标。\n*   激活 WLM 策略并收集性能指标进行比较。\n\n\
  ## WLM 对象\n\n如表 10.14 所示，WLM 由六个对象组成。\n\n| **表 10.14: WLM 对象** |\n| 对象名称 | 目录信息\
  \ | 功能 |\n| :--- | :--- | :--- |\n| Service class | `SERVICECLASSES SYSSERVICECLASSES`\
  \ | `WLM_GET_SERVICE_SUPERCLASS_STATS`, `WLM_GET_SERVICE_SUBCLASS_DETAILS`, `WLM_GET_SERVICE_SUBCLASS_STATS`,\
  \ `WLM_GET_SERVICE_SUBCLASS`, `MON_GET_SERVICE_SUBCLASS_DETAILS`, `MON_GET_SERVICE_SUBCLASS_STATS`,\
  \ `MON_GET_SERVICE_SUPERCLASS_STATS` |\n| Workload | `WORKLOAD WORLOADAUTH WORKLOADCONNATTR\
  \ SYSWORKLOADAUTH SYSWORKLOADCONNATTR SYSWORKLOADS` | `MON_GET_WORKLOAD`, `MON_GET_WORKLOAD_DETAILS`,\
  \ `MON_GET_WORKLOAD_STATS`, `WLM_GET_SERVICE_CLASS_OCCURRENCES`, `WLM_GET_SERVICE_CLASS_WORKLOAD_OCCURRENCES`\
  \ |\n| Threshold | `SYSTHRESHOLDS` | |\n| Work class | `WORKCLASSES WORKCLASSSETS\
  \ WORKCLASSATTRIBUTES SYSWORKCLASSSETS` | `MON_GET_WORK_ACTION_SET_STATS` |\n| Work\
  \ action | `WORKACTIONSETS WORKACTIONS SYSWORKACTIONS` | `WLM_GET_WORK_ACTION_SET_STATS`\
  \ |\n| Histogram | `HISTOGRAMTEMPLATEBINS HISTOGRAMTEMPLATES HISTOGRAMTEMPLATEUSE`\
  \ | |\n\n`WLM DDL` 管理这些对象，并不同其他的 DB2 DDL。`WLM DDL` 按照其发出的顺序执行。一次只能有一个 `WLM DDL`\
  \ 未提交。所有后续的 DDL 都会等待活动中的 DDL 提交或回滚。每个 DDL 必须后跟 `COMMIT` 或 `ROLLBACK` 语句。不支持 XA 事务也不支持\
  \ z/OS。\n\n## 类\n\n有两组类：服务类和工作类。*服务类*是一种执行分类，在其中分配并管理资源。所有工作都运行在服务类中，你通过创建工作负载与超类或子类之间的关系来分配资源。要建立关系，请使用阈值动作（`REMAP\
  \ ACTIVITY`）或工作动作（`MAP ACTIVITY`）。\n\n任何未显式关联到服务类的工作负载默认为 `SYSTEMDEFAULTUSERCLASS`，这是一个超类。没有父类的服务类被称为*超类*（可以将其视为一个工作域）。\n\
  \n此示例为 `PRODUCTION` 创建三个服务类，并为 `TEST` 创建一个：\n\n![Image](img/1070-1.jpg)\n\n*工作类*根据活动的属性来识别数据库活动。加载、DML、读、写、调用和\
  \ DDL 等数据库活动可以定义在工作类上。你还可以在预测性元素上定义工作类——例如，基于估计成本（timerons）。这允许在工作运行之前对其进行分类和管理。\n\
  \n工作类被分组为*工作类集*。你使用 `CREATE WORK CLASS SET` 语句创建工作类集。创建工作类的另一种方法是使用 `ALTER WORK\
  \ SET` 命令：\n\n![Image](img/1070-2.jpg)\n\n## 工作负载\n\n你通过来源（连接属性）或事务的特征（如成本、类型或对象访问）将事务分组为工作负载。创建数据库时会创建两个默认工作负载。你执行的所有用户事务都被放入\
  \ `SYSTEMDEFAULTWORKLOAD`，管理请求被分配给 `SYSTEMDEFAULTWORKLOAD`。工作负载仅标识你想要管理的工作。\n\n\
  此示例创建了八工作负载，将某些分配给工作组，另一些分配给单个用户：\n\n![Image](img/1071-1.jpg)\n\n让我们来看一个简单的示例。将服务类\
  \ `TEST` 较低的预取优先级：\n\n![Image](img/1071-2.jpg)\n\n创建一个名为 `CUST_WEB` 的新服务类并将其分配给超类\
  \ TIER1：\n\n![Image](img/1072-1.jpg)\n\n创建一个新阈值 `MAXSERVICECLASSCONNECTIONS`，将数据库的并发连接数限制为\
  \ 20：\n\n![Image](img/1072-2.jpg)\n\n创建第二个 `MAXSERVICECLASSCONNECTIONS` 阈值并将其分配给超类\
  \ TEST。它将并发连接限制为 100：\n\n因此，工作负载 `WL_TEST SESSION_USER` 将限制为 100 个并发连接，而 `WL_TIER1`\
  \ 将限制为 20 个。\n\n## 修改数据库的代码集\n\nBLU 和 pureScale 都要求数据库为 Unicode，因此你应该将所有新数据库创建为\
  \ Unicode。将数据转换为 Unicode 代码集的要求很可能会发生。因为数据库无法更改不同的代码集，这意味着你必须卸载并重新加载数据。\n\n在过去，字符数据的字符串单元以字节形式存储在关系数据库中。因此，对于单字节字符集（SBCS），每个字符代表一个字节。列数据类型的字符串单元是字节，有时被称为*八字节*（octet）。\n\
  \n\n\n\n当从单字节字符集（SBCS）迁移到多字节字符集（MBCS）时，基于字节的方法可能会出现问题，因为取决于编码方式，字符的表示可能超过一个字节。这可能导致字符串数据被截断，因为目标\
  \ Unicode 列的长度对于编码后的 MBCS 数据来说太小了。\n\n你可以在会话级别、数据库级别或列级别设置编码方法。任何数据库代码集（code set）均可设置\
  \ `OCTETS` 编码。`CODEUNITS16` 和 `CODEUNITS32` 仅允许在 Unicode 数据库中使用。\n\n如前所述，`OCTETS`\
  \ 字符串单元是字节长度单位。`CODEUNITS16` 字符串单元是 Unicode UTF-16 代码集，是双字节长度单位；而 `CODEUNITS32`\
  \ 字符串单元是 Unicode UTF-32，是字符长度单位。\n\n在会话级别，执行以下命令：\n\n![Image](img/1073-1.jpg)\n\n\
  在数据库级别，使用此 `UPDATE` 命令：\n\n![Image](img/1073-2.jpg)\n\n其中 `Encoding` 为 `OCTETS`、`CODEUNITS16`\
  \ 或 `CODEUNITS32`。\n\n在列级别，执行 `CREATE TABLE` 或 `ALTER TABLE` 语句：\n\n![Image](img/1073-3.jpg)\n\
  \n## 使用导出\n\n在具有不同代码集的数据库之间移动数据时，可以使用 `EXPORT` 命令并配合 `MODIFIED BY 'CODEPAGE=CodePage`，其中\
  \ `CodePage` 是目标数据库的代码页值（例如，UTF-8 的有效代码页为 1208）。\n\n从非 Unicode 数据库向 Unicode 数据库迁移数据，请遵循以下步骤：\n\
  \n**步骤 1**：移除对源数据库的访问。\n\n**步骤 2**：使用导出工具 `Export` 数据。对于所有导出语句，请使用修饰符代码页并将其设置为所使用的目标代码页。\n\
  \n**步骤 3**：使用 `db2look` 转储 DDL。\n\n**步骤 4**：转储包含注册表（registry）、DBM 和数据库在内的配置。\n\n\
  **步骤 5**：删除源数据库。\n\n**步骤 6**：使用 `CREATE DATABASE` 命令以 Unicode 格式并使用 ASM（现在是默认值）重新创建源数据库。\n\
  \n**步骤 7**：执行来自 `db2look` 输出的 DDL 创建所需的对象。如果使用列级方法，请在执行前在文件中进行编码更改。\n\n**步骤 8**：运行注册表、DBM\
  \ 和数据库的配置。\n\n**步骤 9**：*可选*：将 `SYSTEM_UNITS` 设置为所需的编码。\n\n**步骤 10**：停止并启动 DB2 实例以使所有更改生效。\n\
  \n**步骤 11**：导入并加载数据。\n\n**步骤 12**：*可选*：为每个导入或加载会话将 `NLS_STRING_UNITS` 设置为所需的编码。\n\
  \n**步骤 13**：*可选*：根据需要收集统计并重新绑定。\n\n![Image](img/note.jpg)\n\n**注意：** 需要 IBM DB2\
  \ 10.5 FP4 (Cancun) 来使用 `SYSTEM_UNITS` 或 `NLS_STRING_UNITS` 方法。\n\n## 影子表\n\n影子表背后的思想是良好的父子关系，其中\
  \ DB2 是父节点。DBA 构建表结构，而 DB2 根据每个查询决定在哪里运行效果最好。\n\n将动态查询想象为拥有两扇门：行和 MQT 列。当你提交一个 `SELECT`\
  \ 语句时，DB2 的组件会引导请求进入相应的门。z/OS 版 DB2 分析加速器（旧 IDAA）通过使用 DB2/Z 作为父节点并将 Netezza 作为列门来实现这一点。该解决方案的最小延迟为一分钟。\n\
  \n通过影子表，你首先使用一个标准的 OLTP（行）数据库。对于该数据库中的特定表，你希望为访问目标表的查询添加一种可能的列式解决方案，而无需更改应用程序。\n\
  \n你通过工作识别列式表可能提高吞吐量的关键机会。一旦识别了这些机会，就可以进行更改以隔离这些负载，并通过仅允许这些负载在行组织或列组织的表之间运行来控制风险。其原因之一并非所有负载都能处理行侧和列侧之间的同步延迟（latency）。为了保持\
  \ MQT 列侧与行侧同步，请以单向方式使用 IBM InfoSphere Data Replication–Change Data Capture (InfoSphere\
  \ CDC)。\n\n## 部署影子表\n\n要使影子表工作，需要对 InfoSphere Data Replication 有深入的了解。本节提供了足够的信息，让你能够部署和运行影子表。\n\
  \n你需要三个额外的软件产品，所有产品都已作为运行 BLU 要求的一部分获得了许可。此许可证提供了 DB2 LUW 到 DB2 LUW 的复制；对于影子表，它是单个\
  \ DB2 实例内的复制。\n\n## 软件要求\n\n你可以在 `[www-01.ibm.com/support/docview.wss?uid=swg21638030](http://www-01.ibm.com/support/docview.wss?uid=swg21638030)`\
  \ 学习如何下载适用于 Linux、Unix 和 Windows 的 IBM DB2 10.5 软件。你可以在此处找到名为通过影子表将 BLU 加速性能引入 OLTP\
  \ 环境的有用 PDF 文档：`[public.dhe.ibm.com/ps/products/db2/info/vr105/pdf/en_US/shadowtablesdb2105.pdf#nameddest=C0061672](http://public.dhe.ibm.com/ps/products/db2/info/vr105/pdf/en_US/shadowtablesdb2105.pdf#nameddest=C0061672)`。\n\
  \n你应该保存两个 URL。一个是 Passport Advantage，它是你根据客户协议下载已获许可软件的地方：`([www-01.ibm.com/software/howtobuy/passportadvantage/?lnk=ftpl](http://www-01.ibm.com/software/howtobuy/passportadvantage/?lnk=ftpl))`。另一个重要的\
  \ URL 是 IBM Fix Central，你可以在那里找到所有 IBM 产品的修补包：`([www-933.ibm.com/support/fixcentral/options](http://www-933.ibm.com/support/fixcentral/options))`。用于复制产品的\
  \ Fix Central 站点是 `[www-933.ibm.com/support/fixcentral/options?selectionBean.selectedTab=find&selection=ibm%2fInformation+Management%3bibm%2fInformation+Management%2fIBM+InfoSphere+Data+Replication](http://www-933.ibm.com/support/fixcentral/options?selectionBean.selectedTab=find&selection=ibm%2fInformation+Management%3bibm%2fInformation+Management%2fIBM+InfoSphere+Data+Replication)`。\n\
  \n表 10.15 列出了所需的软件。请为正确的目标操作系统选择软件。\n\n| 表 10.15: 影子表的 CDC 要求 |\n| :--- |\n| IBM\
  \ InfoSphere Data Replication–CDC DB2 10.2.1 |\n| IBM InfoSphere Data Replication–CDC\
  \ Fix Pack 15 或更高 |\n| IBM InfoSphere Data Replication–CDC for Access Server 10.2.1\
  \ |\n| IBM InfoSphere Data Replication–CDC for Access Server 10.2.1 Fix Pack 5 或更高\
  \ |\n| IBM InfoSphere Data Replication–CDC for Management Console 10.2.1 Windows\
  \ Windows |\n\n软件的安装通常很简单，但有几点需要记住：\n\n- 按上述列出的顺序安装软件。在安装 Access Server Fix Pack\
  \ 5 之前，不要配置实例。它会提示你进行配置。\n- 在安装任何软件之前，创建运行软件和管理订阅的帐户和组。软件不由 `root` 安装或执行。\n\n在以下示例中，`db2cdc01`\
  \ 是执行和维护软件的 UNIX 账户。UNIX 组 `cdcadmin` 以及 DB2 辅助组 `SYSADM` 也分配给 `db2cdc01`。\n\n对于示例，你将在\
  \ Linux Red Hat 6 上安装所有软件，但控制台必须在 Windows 上安装。UNIX 软件要求在服务器上安装 32 位支持库。作为 `root`，你可以执行\
  \ `yum install gtk2.i686` 来安装所需的 x86 32 位库。名为 `/db/cdc` 的文件系统将在 UNIX 上存储复制软件，你将其所有权分配给\
  \ `db2cdc01`。\n\n在将配置影子表的 DB2 实例上安装数据复制软件。你可以在独立的中央服务器的 Unix 或 Windows 上安装 Access\
  \ Server 以支持多个 DB2 实例。在示例中，你将 Access Server 安装在与数据复制产品相同的安装目录路径下。\n\n这些工具使用两个 TCP/IP\
  \ 端口，在安装时你将接受默认设置。\n\n\n\n\n\n[content]\n\n现在你已经了解了如何安装软件，让我们详细介绍安装过程。\n\n## 数据库要求\n\
  \n数据库的要求基本上与 BLU 相同，但去掉了 `DB2_WORKLOAD=ANALYTICS`。`SORTHEAP` 和 `SHEAPTHRES_SHR`\
  \ 不能设为自动管理，但它们仍然需要足够大。`UTIL_HEAP_SZ` 可以自动管理，但必须大于 1 MB 页面。表 10.16 显示了影子表的数据库要求。\n\
  \n| 表 10.16: 影子表数据库要求 |\n| :--- |\n| Unicode 加上 IDENTITY 或 IDENTITY_16BIT |\n| 自动存储管理\
  \ (ASM) |\n| 自动表维护，包括统计信息和空间回收的 `Auto_runstats` 和 `auto_reorg` |\n| `DB2_WORKLOAD=\"\
  \"` |\n| 连接存储存储过程 |\n| InfoSphere Data Replication-CDC 订阅镜像 |\n| `DB2_EXTENDED_OPTIMIZATION`\
  \ 添加 `OPT_SORTHEAP_EXCEPT_COL`，执行 `db2set DB2_EXTENDED_OPTIMIZATION=”OPT_SORTHEAP_EXCEPT_COL\
  \ <SORTHEAP>”` |\n| 行组织 (ORGANIZE BY ROW) |\n| `SHEAPTHRES_SHR = DATABASE_MEMORY\
  \ 的 50%` |\n| `SORTHEAP = SHEAPTHRES_SHR 的 50%` |\n| `UTIL_HEAP_SZ` 足够大且自动 |\n|\
  \ 归档日志 |\n| `SYSTOOL` 对象 必须创建并正确授予权限 |\n\n## 识别可能从影子表获益的工作负载\n\n表 10.17 列出了考虑作为影子表候选的筛选标准。\n\
  \n| 表 10.17: 工作负载识别 |\n| :--- | :--- |\n| **表大小** | **行组织 >= 5 MB 的行** |\n| 集成工作负载\
  \ | 必须来自同一启动点的混合工作负载；某些决策支持或仓库类的查询与 OLTP 混合 |\n| 延迟感知 | 能够接受一定延迟的工作负载 |\n| 近实时需求\
  \ | 类似仪表板；数据不能超过 24 小时 |\n| 合理的 IUD 量 | 并非 100% IUD；需要某些可管理的速率 |\n| MQT 限制 | 可以接受新增的\
  \ MQT 限制 |\n| 查询：动态选择 | • 零匹配索引扫描• 表扫描• 返回少数几列• 限制的排序• 无连接或仅在列表之间进行连接 |\n\n![Image](img/note.jpg)\n\
  \n**注意：** 注意，这里没有列出查询执行时间。稍后你就会知道为什么没有列出。\n\n## 用于影子表的数据库\n\n在设置和使用影子表之前，你必须正确配置数据库。“数据库要求”部分列出了所有要求。\n\
  \n假设你有一个已经定义了 Unicode、IDENTITY 和 ASM 的标准 OLTP 数据库。如果 STMM 处于激活状态，你需要取消 `SORTHEAP`\
