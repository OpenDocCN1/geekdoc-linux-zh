  \n# Track 3: Database Solution Development\n\n## IBM Certified Solution Developer—DB2\
  \ 9.7 SQL Procedure\n\nThis certification is intended for intermediate to advanced-level\
  \ application and solution developers who possess the knowledge and skills necessary\
  \ to create SQL procedures that interact with DB2 9.7 databases. In addition to\
  \ being knowledgeable about the fundamental concepts of DB2 and having strong skills\
  \ in DB2 functions, triggers, and SQL procedures, individuals seeking this certification\
  \ should:\n\n*   Be familiar with the naming conventions used to identify DB2 9.7\
  \ objects\n*   Know what authorities and privileges are needed to access data within\
  \ an application\n*   Possess an in-depth knowledge of the complex database objects\
  \ available with DB2 9.7\n*   Possess an in-depth knowledge of the SQL, `DDL`, `DML`,\
  \ and `DCL` statements available with DB2 9.7\n*   Know the difference between static\
  \ and dynamic SQL\n*   Possess an in-depth knowledge of the available SQL functions\n\
  *   Know how to design, create, test, and deploy SQL procedures, including nested\
  \ procedures\n*   Know how to design, create, test, and deploy functions and triggers\n\
  *   Know how to use DB2 advanced features such as declared global temporary tables,\
  \ `ADMIN_CMD` procedure, global variables, modules, and arrays\n*   Know how to\
  \ use DB2 development tools and explain tools\n\nCandidates who have passed either\
  \ the `DB2 V8.1 Family Fundamentals` exam (C2090-700) or the `DB2 9 Family Fundamentals`\
  \ exam (C2090-730) must take and pass the `DB2 9.7 SQL Procedure Developer` exam\
  \ (C2090-545) to acquire the `IBM Certified Solution Developer— DB2 9.7 SQL Procedure\
  \ Developer` certification, as Figure 1.3 illustrates.\n\n![Image](img/9-1.jpg)\n\
  \n*Figure 1.3: IBM DB2 9.7 Database Solution Developer Certification exam track*\n\
  \n# The Certification Process\n\nA close examination of the IBM certification roles\
  \ quickly reveals that, to obtain a particular DB2 10.1 certification, you must\
  \ take and pass one or more exams that have been designed specifically for that\
  \ certification role. (Each exam is a software-based test that is neither platform-\
  \ nor product-specific.) Thus, once you have chosen the certification role you wish\
  \ to pursue and have familiarized yourself with the requirements for that particular\
  \ role, the next step is to prepare for and take the appropriate certification exam\
  \ or exams. Figure 1.4 shows the complete certification process flow.\n\n![Image](img/9-2.jpg)\n\
  \n*Figure 1.4: IBM DB2 Database Certification exam process*\n\n# Choosing the Right\
  \ Track\n\nThe `DB2 10.1 Fundamentals` examination is necessary for all the tracks.\
  \ After completing the fundamentals exam, a core database administrator who does\
  \ all the database maintenance and security audit activities will follow Track 1:\
  \ Database Administration. Whereas Track 2: Database Application Development and\
  \ Track 3: Database Solution Development will suit an application developer who\
  \ works on any of the application development programming languages on DB2 data\
  \ server.\n\n# Preparing for the Certification Exams\n\nIf you have experience using\
  \ DB2 10.1 in the context of the certification role you have chosen, you might already\
  \ possess the skills and knowledge needed to pass the exams required for that role.\
  \ However, if your familiarity with DB2 10.1 is limited (and even if it is not),\
  \ you can prepare for the certification exams by taking advantage of the following\
  \ resources:\n\n## Formal Education\n\nIBM Learning Services offers courses designed\
  \ to help you prepare for DB2 10.1 certification. To find a listing of the courses\
  \ recommended for each certification exam, use the `Certification Navigator` tool\
  \ provided on the IBM Professional Certification Program website *([www.ibm.com/certify](http://www.ibm.com/certify)),*\
  \ or go to IBM’s Certification and Skills for Information Management website *([www-01.ibm.com/software/data/education](http://www-01.ibm.com/software/data/education)).*\
  \ For more information on course schedules, locations, and pricing, contact IBM\
  \ Learning Services or visit its website at [www-304.ibm.com/services/learning](http://www-304.ibm.com/services/learning).*\n\
  \n## Publications\n\nYou can find all the information you need to pass any of the\
  \ certification exams in the documentation provided with DB2 10.1. A complete set\
  \ of manuals comes with the product, and the manuals are accessible through the\
  \ Knowledge Center once you have installed the DB2 10.1. DB2 10.1 documentation\
  \ is also downloadable from IBM’s website in both HTML and PDF formats.\n\nSelf-study\
  \ books (such as this one) that focus on one or more DB2 10.1 certification exams\
  \ or roles are available as well. You can purchase most of these books at your local\
  \ bookstore or order them from many online retailers.\n\nTo find a listing of possible\
  \ reference materials for each certification exam, use the `Certification Navigator`\
  \ tool provided at the Professional Certification Program website *([www.ibm.com/certify](http://www.ibm.com/certify)).*\
  \ Ordering information is often included with the listing.\n\nIn addition to the\
  \ DB2 product documentation, IBM often produces manuals known as `Redbooks` that\
  \ cover advanced DB2 topics (as well as other topics). These manuals are available\
  \ as downloadable PDF files on IBM’s Redbook website *([www.redbooks.ibm.com](http://www.redbooks.ibm.com)).*\
  \ Or if you prefer to have a bound hard copy, you can obtain one for a modest fee\
  \ by following the appropriate links on the Redbook website. There is no charge\
  \ for the downloadable PDF files.\n\n## Practice Examinations\n\nSample questions\
  \ and practice tests let you become familiar with the format and wording used on\
  \ the actual certification exams. They can also help you decide whether you possess\
  \ the knowledge needed to pass a particular exam. Sample questions, along with descriptive\
  \ answers, are provided at the end of every chapter and in Chapter 11 of this book.\
  \ You can find online assessment tests for each DB2 10.1 certification role by clicking\
  \ the `click here` link at IBM’s Information Management Certification website *([www.ibm.com/software/data/education/cert/assessment.html](http://www.ibm.com/software/data/education/cert/assessment.html)).*\
  \ There is a $30 charge for each exam.\n\n\n\n\n## 需要注意的是，认证考试非常严格。大多数试题都需要给出非常具体的答案。由于这一点以及认证考试涵盖的范围通常比许多\
  \ DB2 专业人员的知识基础更广，如果您想保证顺利获得您想要的认证，请务必利用考试准备资源。\n\n## 有价值的免费教育\n\nDBI Software 的\
  \ DB2Night Show 网络研讨会是了解所有新 DB2 功能的最佳资源之一。请不要忘记在 `[www.dbisoftware.com/db2nightshow](http://www.dbisoftware.com/db2nightshow)`\
  \ 进行注册。\n\n## 安排参加认证考试\n\n当您确信自己已准备好参加特定的 DB2 10.1 认证考试时，下一步是联系一家获 IBM 授权的考试供应商。DB2\
  \ 认证考试由 Pearson VUE 管理，偶尔由 IBM 管理（例如，IBM 在像 International DB2 User’s Group North\
  \ American conference 这样的大型数据库会议上免费提供 DB2 认证）。然而，在联系任何考试供应商之前，请访问 Pearson VUE 的网站\
  \ `([www.pearsonvue.com/ibm](http://www.pearsonvue.com/ibm))` 并点击 `Locate a test\
  \ center` 按钮，以找到离您方便的考试中心。找到考试中心后，您可以联系供应商安排参加认证考试。（您也可以在供应商的各自网站上查找联系信息；在某些情况下，可以在线预约考试。）\n\
  \n您必须至少提前 24 小时安排参加认证考试。当您联系考试供应商时，请准备好提供以下信息：\n\n* 您的姓名（按照您希望在证书上显示的方式）\n* 如果您之前已参加\
  \ IBM 认证考试，这是当时分配给您的编号；如果没有，考试供应商将为您提供一个编号\n* 您可以提供的联系电话\n* 传真号码\n* 您希望所有认证 correspondence（包括认证欢迎包）寄送的邮寄地址\n\
  * 如果您的账单地址与邮寄地址不同，请提供账单地址\n* 您的电子邮件地址\n* 您想要参加的考试编号（例如，`C2090-611`）\n* 您希望使用的支付方式（信用卡或支票），以及相关的支付信息（如信用卡号和有效期）\n\
  * 您的公司名称（如适用）\n* 您希望参加认证考试的考试中心\n* 您希望参加认证考试的日期\n\n在您安排参加认证考试之前，请准备好纸张和铅笔或笔，以便记录考试中心为您分配的考试申请人识别号。您到达考试中心参加认证考试时需要这些信息。您将收到一封电子邮件确认，其中包含您被安排参加的认证考试编号，以及相应的日期、时间和地点信息。\n\
  \n![Image](img/note.jpg)\n\n**记住：** 如果您已经参加了提供的任何一项或多项认证考试，请向考试供应商说明，并要求其为您分配与之前使用的相同的申请人识别号。这将使\
  \ IBM 认证团队能够快速识别您是否已满足特定认证角色的所有考试要求。（如果您每次参加考试都被分配了唯一的申请人识别号，请前往 IBM 专业认证会员网站 `[www.ibm.com/certify/members](http://www.ibm.com/certify/members)`\
  \ 并选择 `Member Services` 将所有考试结果合并为一个 ID。）\n\n每项认证考试费用为 200 美元（在美国和英国）。预约程序根据您选择的支付方式而有所不同。如果您使用信用卡付款，您可以在提供考试供应商所需的适当信息后立即安排参加考试。然而，如果您使用支票付款，则必须在支票收到并确认付款后才能安排考试。（Pearson\
  \ VUE 建议，如果您使用支票付款，请在支票邮寄后七个工作日内联系考试中心。此时 Pearson VUE 应已收到并确认您的付款，您即可安排参加考试。）\n\n\
  如果出于某种原因，您需要在考试预约已确定后重新安排或取消，您必须在预定考试时间前至少 24 小时进行操作。否则，您仍需支付考试费用。\n\n## 参加 IBM\
  \ 认证考试\n\n在您计划参加认证考试的当天，请至少提前 15 分钟到达考试中心以进行签到。签到过程中，您需要提供在安排考试时分配给您的申请人识别号，以及两种身份证明文件。其中一种身份证明必须包含近期照片，另一种必须显示您的签名。有效的身份证明文件示例包括带有照片的驾驶执照和带有签名的信用卡。\n\
  \n签到后，考试管理员将指示您进入考试区域并选择一个空闲的工作站。考试管理员随后会在您选择的工作站中输入您的姓名和识别号，给您提供铅笔和纸张，并告诉您在准备好时开始考试。此时，IBM\
  \ Certification Exam 测试软件的标题屏幕应显示在您面前的计算机显示器上。Figure 1.5 示例如下。\n\n![Image](img/13.jpg)\n\
  \n*Figure 1.5: IBM 认证考试测试软件的标题屏幕*\n\nThe title screen of the IBM Certification Exam\
  \ testing software consists of the IBM Certification Logo, the title “Professional\
  \ Certification Program from IBM,” the name of the exam that is about to be administered,\
  \ and a welcome message containing your name and some basic information on how to\
  \ get started. Before proceeding, be sure to do the following:\n\n* 确认您即将参加的考试确实是您预期的考试。\n\
  * 如果标题屏幕上的考试名称与您计划参加的考试名称不同，请立即向考试管理员指出。\n* 确认您的姓名拼写正确。标题屏幕欢迎消息中显示的姓名反映了其在 IBM 认证数据库中存储的方式。这也是所有\
  \ correspondence（对应的）向您的通信地址，更重要的是，它决定了您在通过考试后将在认证凭证上显示的姓名。\n\nIn addition to displaying\
  \ which exam is about to be administered, the title screen of the IBM Certification\
  \ Exam testing software lets you know how many questions are on the exam, the score\
  \ you must receive to pass it, and the time frame in which you must complete the\
  \ exam. With one exception, each test contains between 50 and 70 questions and allots\
  \ 90 minutes for completion. The *DB2 10.1 for Linux, UNIX, and Windows Database\
  \ Administration* exam (C2090-611) contains 59 questions and allows 90 minutes for\
  \ completion.\n\nAlthough you must complete each certification exam within a predefined\
  \ time limit, never rush through an exam just because the “clock is running.” The\
  \ time limits imposed are more than adequate for you to work through the exam at\
  \ a relaxed, but steady, pace.\n\n\n\n\n当你准备就绪时，点击位于屏幕左下角的 `Start` 按钮开始。如果你想快速复习如何使用\
  \ IBM 认证考试测试软件，请点击位于屏幕右下角的 `Help` 按钮。（如果你感到恐慌并决定尚未准备好参加考试，请点击屏幕底部中央的 `Exit` 按钮完全退出测试软件。然而，我建议您在点击\
  \ `Exit` 之前先与考试管理员讨论您的疑虑。）\n\n![Image](img/note.jpg)\n\n**记住：** 如果你计划快速复习一遍如何使用\
  \ IBM 认证考试测试软件的课程，请务必在点击 `Start` 开始考试之前完成此项复习。尽管可以随时获取帮助，但在你点击 `Start` 按钮之前，计时器不会运行。通过在计时器启动前查看帮助信息，你可以避免为了阅读文档而非回答测试题而浪费可能非常宝贵的答题时间。\n\
  \n在 IBM 认证考试测试软件的标题界面上点击 `Start` 后，计时器将开始运行，第一个考试题将在问题面板中呈现，该面板的外类似于图 1.6 所示。\n\n\
  除了问题本身，当你检查 IBM 认证考试测试软件的问题面板时，首先注意到的内容之一是屏幕左上角显示的题号。如果你按照呈现的顺序回答问题，屏幕的这部分将作为进度指示器，因为会显示当前题号以及考试包含的总题数。\n\
  \n![Image](img/15.jpg)\n\n*图 1.6：IBM 认证考试测试软件的典型问题面板*\n\n在题号正下方，你会找到一个名为 `Mark`（标记）的特殊复选框。如果你想暂时跳过当前问题稍后回来，或者你对所选择的答案不确定，想在完成考试其余部分后再次查看此题，请勾选此复选框（将鼠标指针悬停在其上方并按下鼠标左键）。在查看完每个问题一次后，你将获得再次仅查看已标记问题的机会。届时，你可以回答任何剩余的未答问题，并对任何你仍有疑虑的答案进行重新评估。\n\
  \n问题面板上的另一个重要功能是显示在屏幕右上角的 `Time Remaining`（剩余时间）信息。正如标题所示，问题面板的这一区域提供了你完成和复习考试可用时间的持续反馈。要查看更详细的信息，例如你开始考试的实际墙时间以及预计完成考试的时间范围，你可以点击位于\
  \ `Time Remaining` 信息正右侧的时钟图标来查看这些信息。当你点击此图标时（将鼠标指针悬停在其上方并按下鼠标左键），会弹出一个与图 1.7 相似的对话框。\n\
  \n![Image](img/16.jpg)\n\n*图 1.7：剩余时间对话框*\n\n显然，问题面板中最重要的部分是考试题本身，以及提供的相应备答案列表。请花时间仔细阅读每个问题。当你在提供的列表中找到正确答案时，点击位于答案文本左侧的单选按钮对其进行标记（将鼠标指针悬停在所需的答案单选按钮上，并按下鼠标左键）。一旦你为该问题选择了答案（或通过点击\
  \ `Mark` 复选框对其进行了标记），你就可以点击屏幕左下角的 `Next` 按钮进入下一个问题（请参阅图 1.6）。\n\n如果在任何时候你想返回上一个问题，可以点击屏幕底部中央的\
