  \n您现在准备好使用简单的命令运行该工具了。\n\n接下来，您将创建一个锁定超时场景来生成并分析报告。\n\n![Image](img/471-2.jpg)\n\
  \n现在您已经有了锁定超时情况，使用以下命令选项运行工具，根据未格式化事件表 `DB210.UE_LOCKING_EVENTS` 中收集的信息生成文本报告：\n\
