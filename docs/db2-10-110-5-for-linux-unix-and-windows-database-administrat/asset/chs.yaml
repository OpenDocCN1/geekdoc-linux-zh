  \ | 指示不识别双字符分隔符 | 分隔 ASCII (DEL) |\n| `striplzeros` | 指示删除所有导出的小数列中的前导零 | 分隔 ASCII\
  \ (DEL) |\n| `timestampformat=\"x”` 其中 `x` 为任何有效的日期时间格式元素组合 | 标识在写入外部文件之前如何格式化日期、时间和时间戳值。使用以下日期和时间元素将创建此修饰符提供的格式字符串：YYYY—年份（0000\
