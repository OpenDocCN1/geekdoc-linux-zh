  \ through the text line by line.\n\nOriginal text:\n\n[content]\n\nOn the Windows\
  \ platform, change the property of the DB2 services in the services panel to automatic.\
  \ On UNIX and Linux platforms, run the command `db2iauto -on <InstanceName>`, where\
  \ `InstanceName` is the name of the instance that needs auto-starting.\n\n# Quiescing\
  \ an Instance\n\nBecause any number of users can be granted access to an instance\
  \ or one or more databases under an instance’s control, it can be difficult, if\
  \ not impossible, to coordinate the work efforts of everyone who is using a specific\
  \ instance at a given point in time. This can present a problem if a database administrator\
  \ needs exclusive access to a particular instance for a short time (for example,\
  \ to perform a maintenance operation). Therefore, individuals holding the proper\
  \ authority can place an instance in a “restricted access” or “quiesced” state.\
  \ When an instance is quiesced, all users are forced off the instance, all active\
  \ transactions are immediately rolled back, and all databases under the instance’s\
  \ control are put into quiesced mode. You can place instances (and databases) in\
  \ quiesced mode by executing the `QUIESCE` command. The basic syntax for this command\
  \ is:\n\n![Image](img/28-3.jpg)\n\n| where: |\n\n| `InstanceName` | Identifies the\
  \ name to assign to the instance to place in quiesced mode |\n| `UserName` | Identifies\
  \ the name of a specific user who has permission to access the specified instance\
  \ or database while it is in quiesced mode |\n| `GroupName` | Identifies the name\
  \ of a specific group of users that has permission to access the specified instance\
  \ or database while it is in quiesced mode |\n| `Minutes` | Specifies a time, in\
  \ minutes, to wait for applications to commit their current transactions before\
  \ quiescing the instance; if no value is specified, the default value is 10 minutes\
  \ |\n\nThus, to place an instance named `db2inst1` into quiesced mode immediately,\
  \ but allow a user named `db2admin` to continue to have access to it, you execute\
  \ a `QUIESCE` command:\n\n![Image](img/29-1.jpg)\n\nEventually, you will need to\
  \ return the instance or database put into quiesced mode to a normal state. You\
  \ can remove instances and databases from quiesced mode by executing the `UNQUIESCE`\
  \ command. The basic syntax for this command is:\n\n![Image](img/29-2.jpg)\n\n|\
  \ where: |\n\n| `InstanceName` | Identifies the name assigned to the instance that\
  \ is to be taken out of quiesced mode |\n\nTherefore, if you want to take an instance\
  \ named `db2inst1` out of quiesced mode, you can do so by executing an `UNQUIESCE`\
  \ command that looks like this:\n\n![Image](img/29-3.jpg)\n\nYou can also quiesce\
  \ and unquiesce instances and databases by selecting the **Quiesce** or **Unquiesce**\
  \ action from either the **Instances** menu or the **Databases** menu in IBM Data\
  \ Studio. Figure 2.2 shows the Data Studio menu items that must be selected to activate\
  \ the Quiesce instance dialog.\n\n![Image](img/30.jpg)\n\n*Figure 2.2: Invoking\
  \ the Quiesce dialog from IBM Data Studio*\n\nIt is important to note that only\
  \ users with System Administrator `(SYSADM)` or System Control `(SYSCTRL)` authority\
  \ are allowed to quiesce an instance. Once an instance is in a quiesced state, only\
  \ users with System Administrator `(SYSADM),` System Control `(SYSCTRL),` or System\
  \ Maintenance `(SYSMAINT)` authority; users who are members of a specified group\
  \ (if a group name was specified when the instance was placed in quiesced mode);\
  \ and users with a specified user name (if a user name was specified when the instance\
  \ was placed in quiesced mode) can connect to the instance.\n\nSimilarly, only users\
  \ with System Administrator `(SYSADM)` or Database Administrator `(DBADM)` authority\
  \ are permitted to quiesce a database. After a database is in a quiesced state,\
  \ only users with System Administrator `(SYSADM),` System Control `(SYSCTRL),` System\
  \ Maintenance `(SYSMAINT),` or Database Administrator `(DBADM)` authority; users\
  \ who are members of a specified group (if a group name was specified when the database\
  \ was placed in quiesced mode); and users with a specified user name (if a user\
  \ name was specified when the database was placed in quiesced mode) can connect\
  \ to the database.\n\nThe basic syntax for `QUIESCE` and `UNQUIESCE` database are:\n\
  \n![Image](img/31-1.jpg)\n\nThe database connection must be established before running\
  \ the `QUIESCE` command on the database. There are no additional parameters necessary\
  \ for running the `UNQUIESCE` command:\n\n![Image](img/31-2.jpg)\n\n# Upgrading\
  \ Instances\n\nTo upgrade your DB2 server from DB2 9.5, DB2 9.7, or DB2 9.8 to DB2\
  \ 10.1, you must upgrade the instance by using the `db2iupgrade` command. If the\
  \ DB2 servers are running on a release before DB2 9.5, migrate the instance by using\
  \ the `db2imigr` command to the latest DB2 9.5 fix pack, and then follow the DB2\
  \ 10.1 upgrade procedure.\n\nTable 2.2 lists the four major steps to follow during\
  \ the upgrade process (these steps are specifically for UNIX systems).\n\n| **Table\
  \ 2.2: DB2 10.1 upgrade procedure** |\n| **Step** | **Task** | **Detailed Information**\
  \ |\n| 1 | Prerequisites | List the db2 instances and the installation locations\
  \ by using the `db2ls` command. Understand the compatibilities between the operating\
  \ system and DB2 10.1. Check the known issues for DB2 on your platform by using\
  \ the links below:• AIX®: [www-01.ibm.com/support/docview.wss?uid=swg2116548](http://www-01.ibm.com/support/docview.wss?uid=swg2116548)*•\
  \ HP-UX: [www-01.ibm.com/support/docview.wss?uid=swg2125702](http://www-01.ibm.com/support/docview.wss?uid=swg2125702)*•\
  \ Solaris: [www-01.ibm.com/support/docview.wss?uid=swg2125706](http://www-01.ibm.com/support/docview.wss?uid=swg2125706)*•\
  \ Linux: [www.ibm.com/software/data/db2/linux/validate](http://www.ibm.com/software/data/db2/linux/validate)*Download\
  \ the DB2 10.1 product and the license from IBM Passport Advantage®. Run the `db2prereqcheck`\
  \ command on the server to check whether the system meets DB2 10.1 prerequisites.Extract\
  \ all the registry, instance, and database parameter current values:`db2set -all`,\
  \ `db2cfexp cfexp`, `db2backup LIST`, `DB2 DIRECTORYLIST`, `DB2 NODE DIRECTORYLIST`,\
  \ `DB2 DCS DIRECTORYLIST`, `DCS DIRECTORYGET`, `DBM CFG SHOW DETAIL`, `cp -p ~/sqllib/userprofile\
  \ userprofile.bak`, `cp -p ~/sqllib/db2nodes.cfg db2nodes.cfg.bak` |\n\n\n\n\n\n\
  ## 3. 升级\n将现有实例升级到新版本；命令如下：\n`db2 LIST APPLICATIONS`\n`db2 FORCE APPLICATIONS ALL`\n\
  `db2 DEACTIVATE DATABASE <dbname>`\n`db2stop`\n`db2diag –Aipclean`\n`ipcrm`\n`db2_killexit`\n\
  \n以 root 权限运行 `db2iupgrade` 命令将实例从旧版本升级到新版本：\n`db2iupgrade -u <FencedUser> <InstanceName>`\n\
  其中：\n* `FencedUser`：在 DB2 数据库使用的地址空间之外运行 UDF 和存储过程。你可以使用 `db2pd` 命令查找实例的围栏用户（fenced\
  \ user）：\n`db2pd -fmp | grep -i fenced`\n信任路径 (Trusted Path): `/db2home/db2inst1/sqllib/function/unfenced`\n\
  围栏用户 (Fenced User): `db2fence`\n* `InstanceName`：你要升级的实例。\n\n使用 `db2start` 命令启动\
  \ DB2 数据库管理器。\n使用 `UPGRADE` 命令执行数据库升级：\n`UPGRADE DATABASE <DatabaseName>`\n其中：DatabaseName\
  \ 是你要升级到新版本的数据库名称。\n\n## 4. 升级后操作\n激活所有数据库。\n对所有表执行 `RUNSTATS` 并重新绑定所有包（packages）。\n\
  将 DB2 数据库管理器配置参数 `DIAGLEVEL` 更新为 `3`。\n使用 `db2stop` 和 `db2start` 命令重启实例。\n\n# 删除实例\n\
  要删除 DB2 根实例，请执行 `db2idrop` 命令；要删除非根实例，请卸载 DB2 数据库产品。在删除实例之前必须停止实例，良好的做法是在删除实例之前备份\
  \ `$INSTHOME/sqllib` 目录。\n\n删除实例的命令为：\n\n![Image](img/33.jpg)\n\n| 其中： |\n| `InstanceName`:\
  \ 指定要升级的特定实例的名称；要列出所有实例，请在服务器上使用 `db2ilist` 命令 |\n\n# 关于 DB2 管理服务器 (DAS) 的说明\nDB2\
  \ 管理服务器 (DAS) 在 DB2 9.7 中已弃用，且不再获得任何功能增强。此外，DAS 可能会在不久后移除。在此处讨论 DAS 仅仅是为了该主题的完整性。\n\
  \n以前随 DB2 一带的工具（如 Control Center，一个已停止的 DB2 GUI 工具）需要一个独立的实例，该实例与为特定工作站定义的所有实例独立运行但并发运行。由于此原因，在\
  \ DB2 安装过程中还会创建一个名为 `DB2 Administration Server (DAS)` 实例的特殊实例。与其他实例不同，单个工作站上只能存在一个\
  \ `DAS` 实例。DB2 全局级配置注册表变量 `DB2ADMINSERVER` 包含了为特定工作站定义的 `DAS` 实例名称。\n\n一旦创建，只要其创建的系统在线，`DAS`\
  \ 实例就会作为后台进程持续运行；每当其所处的工作站启动（或重启）时，`DAS` 实例通常会自动激活。此外，在你希望远程管理的每个 DB2 服务器上都必须运行\
  \ `DAS`。这是因为除其他外，`DAS` 实例为远程客户端提供了与其他实例建立通信所需的信息。\n\n需要注意的是，要从远程客户端管理服务器，用户必须对所使用的\
  \ `DAS` 实例具有系统管理员 `(SYSADM)` 权限。此外，一旦在客户端工作站注册了远程实例和数据库，用户必须持有执行管理任务所需的权限和许可。\n\n\
  除了启用 DB2 服务器的远程管理外，`DAS` 实例在以下方面协助 Control Center 和 Configuration Assistant：\n\n\
  * 提供作业（任务）管理，包括调度和运行用户定义的 shell 脚本和批处理文件的能力，这些文件包含 DB2 命令和操作系统命令\n* 调度作业、查看已完成作业的结果，并对远程或本地执行的任务（通过使用\
  \ Task Center）执行管理任务\n\n![Image](img/note.jpg)\n\n**注意：** Control Center 工具以及相关的\
  \ DB2 命令如 `db2am`、`db2ca`、`db2cc`、`db2eva`、`db2hc`、`db2indbt`、`db2lc` 和 `db2tc`\
  \ 已停止。在 DB2 10.1 及更高版本中，建议使用 IBM Data Studio，将在章节末尾进行讨论。\n\n# 配置 DB2 系统环境\n在正常运行期间，DB2\
  \ 数据库管理器的行为部分由一组定义 DB2 运行环境的值控制。其中某些值是操作系统环境变量，另一些是特殊的 DB2 特有系统级值，称为 `environment`\
  \ 或 `registry` 变量。注册表变量提供了一种集中控制数据库环境的方法。共有四种不同的注册表配置（profiles），每个配置在不同层级上控制数据库环境。注册表配置如下：\n\
  \n* **DB2 全局级配置注册表**——所有机器范围的环境变量设置都存储在此注册表中；每个 DB2 工作站上存在一个全局级配置注册表。要为所有实例设置环境变量，请使用此配置注册表。\n\
  * **DB2 实例级配置注册表**——特定实例的环境变量设置保存在此注册表中；这是你设置大多数 DB2 环境变量的地方。在此配置注册表中定义的值将覆盖全局级配置注册表中的任何对应设置。\n\
  * **DB2 实例节点级配置注册表**——该配置表包含针对分区数据库环境的特定分区（节点）的设置。在此配置表中定义的值将覆盖全局级配置设置。\n* **DB2\
  \ 用户级配置注册表**——该配置表包含特定于用户的设置，其优先级高于注册表设置。\n\n表 2.3 显示了 DB2 在配置系统时解析注册表设置的顺序。\n\n\
  ![Image](img/35.jpg)\n\n你可以使用 `db2greg` 命令查看并更改全局注册表，这将修改根安装中的 `/var/db2/global.reg`\
  \ 以及非根安装中的 `$HOME/sqllib/global.reg`。\n\n根安装的输出如下：\n\n![Image](img/36.jpg)\n\n全局注册表由三种类型组成：\n\
  \n* **Service (S)**——记录产品级信息，如版本和安装路径。\n* **Instance (I)**——记录实例级信息，如实例名称、实例路径、DB2\
  \ 版本和启动标志。\n* **Variables (V)**——记录变量及其值设置。\n\n你可以通过 `db2greg` 命令编辑全局注册表设置；根安装的编辑需要\
  \ root 权限。\n\n可用大量的注册表变量，取决于所使用的操作系统。《Database Administration Concepts and Configuration\
  \ Reference》手册第 22 章包含了完整列表。\n\n那么，如何确定哪些注册表变量已设置以及设置值？更重要的是，如何为一个或多个注册表变量赋值？一种方法是执行\
  \ `db2set` 系统命令。该命令的语法如下：\n\n![Image](img/36-2.jpg)\n\n| 其中： |\n| `Variable`: 指定要显示、设置或删除的注册表变量\
  \ |\n| `Value`: 指定分配给指定的注册表变量的值；如果未提供值但指定了注册表变量，则指定的注册表变量将被删除 |\n| `Instance`: 指定要与指定的注册表变量关联的实例配置\
  \ |\n\n\n\n\n\n| Member-number | 标识在使用 DPF 数据库的用例中实例节点编号 |\n| :--- | :--- |\n| DAS\
  \ Node | 标识 `DAS` 实例所在的节点名称（此项在 DB2 9.7 中已弃用，不再需要创建） |\n| User | 标识用于连接到 `DAS` 实例的身份验证\
  \ ID |\n| Passwords | 标识用于连接到 DB2 管理服务器实例的密码（身份验证 ID 的密码） |\n\n表 2.4 描述了该命令的所有其他选项。\n\
  \n**表 2.4：db2set 命令选项**\n\n| 选项 | 含义 |\n| :--- | :--- |\n| –g | 表示显示、设置或删除全局配置变量\
  \ |\n| -gl | 表示显示、设置或删除存储在 LDAP 中的全局配置变量；此选项仅在注册表变量 `DB2_ENABLE_LDAP` 设置为 YES 时有效\
  \ |\n| -i | 表示显示、设置或删除实例配置变量 |\n| –all | 表示显示按以下定义的所有注册变量出现情况：• 环境（用 `-e` 标识）• 节点级注册表（用\
  \ `-n` 标识）• 实例级注册表（用 `-i` 标识）• 全局级注册表（用 `-g` 标识） |\n| -null | 表示将指定注册表层级的变量值设置为\
  \ NULL |\n| -r | 表示重置给定实例的配置注册表 |\n| -n | 表示指定远程 DAS 实例节点名称 |\n| -u | 表示指定将连接到 DAS\
  \ 实例的身份验证 ID |\n| -p | 表示提供指定身份验证 ID 的密码 |\n| -l | 表示列出所有实例配置 |\n| -lr | 表示列出所有支持的注册变量\
  \ |\n| -v | 表示以详细模式执行 `db2set` 命令 |\n| -ul | 访问用户配置变量（此参数仅支持 Windows 操作系统） |\n|\
  \ -ur | 刷新用户配置变量（此参数仅支持 Windows 操作系统） |\n| -h | -? | 显示帮助信息；当指定此选项时，将忽略所有其他选项，仅显示帮助信息\
  \ |\n\n注意的是，如果你不带选项执行 `db2set` 命令，将返回一个包含为当前（默认）实例设置的所有注册变量及其值的列表。\n\n因此，如果你想确定为每个配置设置了哪些注册变量，请执行\
  \ `db2set` 命令：\n\n![Image](img/38-1.jpg)\n\n生成的输出可能看起来如下所示：\n\n![Image](img/38-2.jpg)\n\
  \n或者，要查看所有 DB2 实例的 `DB2COMM` 注册变量的当前值，请执行类似下面的 `db2set` 命令：\n\n![Image](img/39-1.jpg)\n\
  \n最后，如果你想为服务器上所有 DB2 实例的 `DB2COMM` 注册变量分配值，可以通过执行类似下面的 `db2set` 命令来实现：\n\n![Image](img/39-2.jpg)\n\
  \n| 何处： |\n| :--- | :--- |\n| Protocol（协议） | 标识在实例的 DB2 数据库管理器启动时启动的一个或多个通信协议；以下值的任何组合都是有效的：`NPIPE,\
  \ `TCPIP,` 和 `SSL` |\n\n因此，为了设置 `DB2COMM` 实例级注册变量，使得在启动任何实例时 DB2 数据库管理器都会启动 TCP/IP\
  \ 通信管理器，请执行如下所示的 `db2set` 命令：\n\n![Image](img/39-3.jpg)\n\n你可以通过提供变量名等号作为 `db2set`\
  \ 命令的输入，来取消分配给任何注册变量的值。因此，如果你想禁用名为 `db2inst1` 的实例的 `DB2COMM` 实例级注册变量，可以通过执行类似下面的\
  \ `db2set` 命令来实现：\n\n![Image](img/39-4.jpg)\n\n# 关于聚合注册变量的说明\n\n聚合注册变量是一组若干注册变量的配置，通过一个注册变量名称进行标识。组中的每个注册变量都有一个预定义的设置。聚合注册变量的目的是为了便于广泛运营目标的注册表配置。\n\
  \n在 DB2 10.1 中，唯一有效的聚合注册变量是 `DB2_WORKLOAD,`，该变量的有效值为：\n\n| 值 | 描述 |\n| :--- | :---\
  \ |\n| `1C` | 1C 特定应用程序工作负载设置 |\n| `CM` | 内容管理器（Content Manager）特定工作负载设置 |\n| `COGNOS_CS`\
  \ | Cognos® Content Server 特定工作负载设置 |\n| `FILENET_CM` | FileNet® 内容管理器特定工作负载设置 |\n\
  | `INFOR_ERP_LN` | Infor ERP Baan 特定工作负载设置 |\n| `MAXIMO` | Maximo® 特定工作负载设置 |\n\
  | `MDM` | 主数据管理（Master Data Management）特定工作负载设置 |\n| `SAP` | SAP 应用程序特定工作负载设置 |\n\
  | `TPM` | Tivoli® Provisioning Manager 特定工作负载设置 |\n| `WAS` | WebSphere® 应用服务器特定工作负载设置\
  \ |\n| `WC` | WebSphere Commerce 特定工作负载设置 |\n| `WP` | WebSphere Portal 特定工作负载设置\
  \ |\n\n聚合注册变量是通过一个注册变量名称标识的若干注册变量的配置。组中的每个注册变量都有一个预定义的设置。聚合注册变量的目的是为了便于广泛运营目标的注册表配置。\n\
  \n在 DB2 10.1 中，唯一有效的聚合注册变量是 `DB2_WORKLOAD,`，该变量的有效值为：\n\n| 值 | 描述 |\n| :--- | :---\
  \ |\n| `1C` | 1C 特定应用程序工作负载设置 |\n| `CM` | 内容管理器（Content Manager）特定工作负载设置 |\n| `COGNOS_CS`\
  \ | Cognos® Content Server 特定工作负载设置 |\n| `FILENET_CM` | FileNet® 内容管理器特定工作负载设置 |\n\
  | `INFOR_ERP_LN` | Infor ERP Baan 特定工作负载设置 |\n| `MAXIMO` | Maximo® 特定工作负载设置 |\n\
  | `MDM` | 主数据管理（Master Data Management）特定工作负载设置 |\n| `SAP` | SAP 应用程序特定工作负载设置 |\n\
  | `TPM` | Tivoli® Provisioning Manager 特定工作负载设置 |\n| `WAS` | WebSphere® 应用服务器特定工作负载设置\
  \ |\n| `WC` | WebSphere Commerce 特定工作负载设置 |\n| `WP` | WebSphere Portal 特定工作负载设置\
  \ |\n\n可以使用聚合注册变量来显式定义任何隐式配置的注册变量，从而覆盖其默认值。\n\n如果你尝试使用聚合变量修改显式设置的注册变量，将发出警告并保留显式设置的值。例如，设置\
  \ `DB2_REDUCED_OPTIMIZATION` 为 `YES` 然后将 `DB2_WORKLOAD` 设置为 `SAP` 将产生如下警告：\n\n![Image](img/40.jpg)\n\
  \n如果先使用聚合变量，然后指定显式注册变量，则不会警告。要识别覆盖设置，使用 `db2set -all` 命令并检查值旁边显示的 `[O]`，如下：\n\n\
  ![Image](img/40.jpg)\n\n每当 `DB2_WORKLOAD` 设置值激活时，你将在值旁边看到 `[DB2_WORKLOAD]`，如下：\n\
  \n![Image](img/41.jpg)\n\n# 配置 DB2 实例和数据库\n\n除了全面的注册变量外，DB2 使用大量的配置参数来控制代表实例和数据库分配和使用系统资源。许多配置参数的默认值是针对非常简单的系统产生的。目标是让\
  \ DB2 能够在任何平台上开箱即用，而不是在安装它的特定平台上运行得最优化。\n\n因此，尽管这些配置参数的默认值已满足大多数数据库需求，但通过更改一个或多个配置参数的值，通常可以极大提高整体系统和应用程序的性能。事实上，如果你的数据库环境包含以下任何情况，则必须始终修改\
  \ DB2 配置参数的值或将其设置为 `AUTOMATIC`：\n\n*   大型数据库\n*   通常处理大量并发连接的数据库\n*   具有高性能要求的特殊特殊应用程序\n\
  *   特殊的硬件配置\n*   独特的查询或事务负载\n*   独特的查询或事务类型\n\n第 5 章](#012_Chapter005.html_ch-5)“监控\
  \ DB2 活动”讨论了衡量事务负载和性能的方法，以确定如何更改配置参数值。现在，让我们配置参数。\n\n## DB2 数据库管理器实例配置\n\n\n\n\n\
  -   [费曼学习法](https://wiki.example.org/feynmans_learning_method)的灵感源于诺贝尔物理奖获得者**Richard\
  \ Feynman**，他因在物理学领域的贡献而闻名。\n\n1. 运用费曼技巧，你只需花上`20 min`就能深入理解知识点，而且记忆深刻，*难以遗忘*。\n\
  \n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\n\n因此，如果你想配置名为 `SAMPLE`\
  \ 的数据库，使得任何连接到数据库的应用程序在回滚当前事务之前最多等待 10,000 秒以获取锁，你可以执行 `UPDATE DATABASE CONFIGURATION`\
  \ 命令：\n\n![Image](img/74-1.jpg)\n\n或者，若想配置名为 `SAMPLE` 的数据库使用归档日志，并指示其将活动日志文件的第二个副本存储在位于\
  \ `/data` 文件系统中名为 `mirrorlogs` 的目录中，你可以执行如下所示的 `UPDATE DATABASE CONFIGURATION` 命令\n\
  \n![Image](img/74-2.jpg)\n\n通过执行 `RESET DATABASE CONFIGURATION` 命令，可以将分配给所有数据库配置文件参数的值恢复为系统默认值。该命令的语法如下：\n\
  \n![Image](img/74-3.jpg)\n\n| where: | |\n| `DatabaseAlias` | 标识要分配给待修改配置信息的数据库的别名\
  \ |\n\n因此，如果你想将名为 `SAMPLE` 的数据库的数据库配置文件参数恢复为其系统默认设置（这将丢失任何已做的配置更改），你可以执行如下所示的 `RESET\
  \ DATABASE CONFIGURATION` 命令：\n\n![Image](img/75-1.jpg)\n\n你还可以使用 IBM Data Studio\
  \ Administration Explorer 查看或更改数据库配置文件的内容。要这样做，在 Administration Explorer 菜单中右键点击数据库，然后选择\
  \ `Set Up and Configure` 和 `Configure` 操作，如图 2.5 所示。\n\n![Image](img/75-2.jpg)\n\
  \n*图 2.5：使用 IBM Data Studio 调用数据库设置和配置操作*\n\n图 2.6 显示了“修改数据库配置参数”向导，并展示了如何将参数 `AVG_APPLS`\
  \ 从 1 更新为 10。\n\n![Image](img/76.jpg)\n\n*图 2.6：使用 IBM Data Studio 更新数据库配置参数*\n\n\
  # DB2 自主计算功能\n\n如今的业务挑战要求数据库针对最佳性能进行优化。无论 DBA 的技能水平如何，数据库引擎都必须高度可调且易于配置，以获得最佳性能。为了满足这些需求，DB2\
  \ 自带了丰富的自动功能，通过感知和响应发生的情况，自适应且准确地对数据库环境进行调。\n\n当你创建数据库时，默认启用以下某些自主计算能力；但另一些功能你必须手动启用。表\
  \ 2.7 提供了 DB2 自动功能以及激活或禁用功能相关命令的摘要。\n\n| 表 2.7：DB2 自主计算功能 | |\n| 自动功能 | 描述 | 参数或命令\
  \ |\n| :--- | :--- | :--- |\n| 自调内存管理器 (STMM) | STMM 简化了数据库启动和运行期间设置多个内存配置参数的任务。STMM\
  \ 具有智能控制机制，可以跟踪不同负载的特征、每个内存参数的内存消耗以及数据库中许多共享内存资源的需求。它根据需要动态调整内存资源的使用情况。 | 通过将 `self_tuning_mem`\
  \ 数据库配置参数设置为 `ON` 或 `OFF` 来启用或禁用此功能。 |\n| 自动存储 | 自动存储功能通过使用存储路径简化表的存储管理。在创建新数据库时，数据库管理器会在存储路径上创建容器，并在需要时扩展它们。\
  \ | 创建数据库。创建存储组（可选，DB2 默认创建 `IBMSTOGROUP` 存储组）。使用 `MANAGED BY AUTOMATIC STORAGE`\
  \ 子句创建表空间。 |\n| 数据压缩 | 自动数据压缩功能同时作用于表和索引，为组织节省存储成本。DB2 最近引入了自适应压缩来创建页级压缩字典，连同之前的表级压缩字典，以避免为了优化压缩而进行常规的数据重组。临时表会自动压缩，压缩表的索引默认也会自动压缩。\
  \ | 在 `CREATE TABLE` 或 `ALTER TABLE` 以及 `CREATE INDEX` 或 `ALTER INDEX` 命令期间使用 `COMPRESS\
  \ YES` 子句。 |\n| 自动数据库备份 | 数据库备份对于在发生硬件或软件故障时保护数据是必要的。自动数据库备份功能通过提供有效的备份策略简化了数据库备份管理任务，该策略可以很容易纳入定期和适当的备份。\
  \ | 通过将 `AUTO_DB_BACKUP` 和 `AUTO_MAINT` 数据库配置参数设置为 `ON` 或 `OFF` 来启用或禁用自动备份维护。 |\n\
  | 自动重组 | 自动重组过程定期评估表和索引，以确定是否由于大量数据更改导致表和索引出现碎片并需要重组。它根据重组策略在需要时调度数据和索引的自动重组。 |\
  \ 通过将 `AUTO_MAINT`、`AUTO_TBL_MAINT` 和 `AUTO_REORG` 数据库配置参数设置为 `ON` 或 `OFF` 来启用或禁用自动重组维护。\
  \ |\n| 自动统计收集 | 自动统计收集通过更新表统计有助于提高数据库性能。DB2 优化器使用这些统计信息为任何定的 SQL 语句确定成本效益最高的访问计划。管理器通过在编译\
  \ SQL 语句时收集运行时统计，同步或异步地收集任何负载所需的统计信息。 | 根据统计需求设置以下数据库配置参数来启用或禁用自动统计收集：`AUTO_MAINT`、`AUTO_TBL_MAINT`、`AUTO_RUNSTATS`、`AUTO_STMT_STATS`、`AUTO_STATS_PROF`、`AUTO_PROD_UPD`。\
  \ |\n| 配置顾问 | 配置顾问旨在捕数据库环境特定信息，并根据提供的信息建议或更改配置参数，以便在较短时间内获得更好的性能。 | 创建新数据库时，此工具会自动运行以确定数据库配置参数和默认缓冲池的大小。使用\
  \ `AUTOCFIGURE` 命令在现有数据库上调用此工具。 |\n| 工具节流 | 自动维护活动在运行时会消耗资源，因此它们的执行可能会影响数据库性能。为了将系统影响最小化，你可以使用\
  \ DB2 的自适应工具节流系统来调节某些自动维护活动的资源使用。 | 要将所有节流工具对生产工作负载的累积实例级限制设置为 10%，请为 `util_impact_lim`\
  \ 配置参数分配值 10。\n\n# 自调内存管理器\n\n当内存根据负载需求进行自适应调优时，系统性能将受益。为了获得最大的性能，有必要根据负载的变化调整内存配置。STMM\
  \ 简化了数据库启动和运行期间设置多个内存配置参数的任务。STMM 的智能控制机制跟踪不同负载的特征、每个内存参数的内存消耗以及数据库中许多共享内存资源的需求。\n\
  \nSTMM 持续监控系统，以利用只有在系统设置为调优数据库内存消耗时才可用的操作系统内存。它通过迭代确定以下内存参数的最优内存配置，并在图 2.7 中以图示表示。\n\
  \n\n\n\n\n* `database_memory`—数据库共享内存大小\n* `locklist`—锁列表的最大存储空间\n* `maxlocks`—锁升级前的锁列表最大百分比\n\
  * `pckcachesz`—程序包缓存大小\n* `sheapthres_shr`—共享排序的排序堆阈值\n* `sortheap`—排序堆的最大存储空间\n\
  \n![Image](img/79.jpg)\n*图 2.7：STMM 内存结构**\n\nSTMM 基于以下数据库共享内存参数工作：\n\n* 缓冲池（Buffer\
  \ pools）通过 `ALTER BUFFERPOOL` 和 `CREATE BUFFERPOOL` 语句控制。数据库缓冲池是一块内存，用于缓存从磁盘读取并准备进行选择或更新的表索引和数据页。\n\
  * 程序包缓存（Package cache）由 `pckcachesz` 数据库配置参数控制。该参数从数据库共享内存中分配，用于缓冲静态 SQL、动态 SQL\
  \ 和 XQuery 语句的段。\n* 锁内存由 `locklist` 和 `maxlocks` 数据库配置参数控制。`locklist` 参数指定分配给锁列表的存储量。每个数据库有一个\
  \ `locklist`，包含所有并发连接到数据库的应用程序所持有的锁。`maxlocks` 参数定义了应用程序持有的锁列表百分比，在数据库管理器执行锁升级之前必须填满该百分比。\n\
  * 排序内存由 `sheapthres_shr` 和 `sortheap` 数据库配置参数控制。分配的共享排序内存总大小取决于数据库激活期间 `sheapthres_shr`\
  \ 参数的值。`sortheap` 参数决定了每次排序可用的最大内存页数。\n* 总数据库共享内存由 `database_memory` 数据库配置参数控制。该参数指定了为数据库共享内存区域保留的共享内存量。\n\
  \n图 2.8 显示了 STMM 工作流，如下所示：\n\n* 调节器（tuner）唤醒 (1) 并检查是否有任何内存参数需要更多内存 (2)。\n* 如果答案肯定的，它会检查操作系统空闲内存的数量——如果\
  \ `DATABASE_MEMORY` 设置为自动 (5)。如果操作系统层足够的空闲物理内存，它将部分该内存提供给急需堆 (6)。如果没有可用内存，它将找到另一个可以向急需堆提供内存的内存堆\
  \ (7)。\n* 此过程一直持续，直到没有更多内存可以移动为止。\n* 调节器进入睡眠，直到被要求唤醒 (4)。唤醒频率由负载特征决定 (3)。\n\n![Image](img/80.jpg)\n\
  *图 2.8：STMM 工作流*\n\n# STMM 模式\n\nSTMM 以四种不同的模式工作，你可以根据应用程序和业务需求使用这些模式：\n\n* **模式\
  \ 1：**当 `DATABASE_MEMORY= AUTOMATIC` 时\n  在这种情况下，所需的内会在需要时从操作系统获取并返回给操作系统。DB2 使用的内存总量可能会随时间增长，且仅受操作系统内存可用性的限制。\n\
  * **模式 2：**当 `DATABASE_MEMORY= <NUMERIC VALUE> AUTOMATIC` 时\n  在这里，调优调优，但数据库使用的总内存从\
  \ `NUMERIC` 值开始，并随时间增长。它仅受操作系统可用内存的限制。\n* **模式 3：**当 `DATABASE_MEMORY=<NUMERIC VALUE>`\
  \ 时\n  DB2 将在启动期间分配此数量的内存。此内存设置是静态的——它无法根据需要向操作系统获取或提供内存。\n* **模式 4：**当 `DATABASE_MEMORY=COMPUTED`\
  \ 时\n  数据库内存根据数据库启动期间数据库内存堆初始值之和计算得出。在这种情况下，`database_memory` 未启用自调优。\n\n# 激活 STMM\n\
  \n你可以通过使用命令行处理器或 IBM Data Studio 将 `self_tuning_mem` 数据库配置参数设置为 `ON` 来激活 STMM：\n\
  \n![Image](img/81-1.jpg)\n\n或者，也可以通过 IBM Data Studio 的配置向导更改 `self_tuning_mem` 配置参数的挂起值，并点击\
  \ `Run` 选项来激活 STMM。\n\n图 2.9 显示了“修改数据库配置参数”向导以及如何将 `self_tuning_mem` 从 `OFF` 更新为\
  \ `ON`。\n\n![Image](img/81-2.jpg)\n*图 2.9：通过 IBM Data Studio 修改 STMM 参数*\n\n图 2.10\
  \ 显示了 `self_tuning_mem` 数据库配置更新命令的部署状态。\n\n![Image](img/82-1.jpg)\n*图 2.10：STMM\
  \ 参数更新的部署状态*\n\n要激活由内存参数控制的 STMM 其他内存区域，请使用 `UPDATE DATABASE CONFIGURATION` 命令或通过\
  \ IBM Data Studio 将参数设置为 `AUTOMATIC`：\n\n![Image](img/82-2.jpg)\n\n最后，要激活缓冲池的自调优，请将缓冲池大小设置为\
  \ `AUTOMATIC`。你可以对现有缓冲池使用 `ALTER BUFFERPOOL` 语句或对新缓冲池使用 `CREATE BUFFERPOOL` 语句来实现：\n\
  \n![Image](img/82-3.jpg)\n\n执行 `GET DBG SHOW DETAIL` 命令显示当前的 STMM 参数设置：\n\n![Image](img/82-4.jpg)\n\
  你可以看到 STMM 的三种状态：\n\n* OFF\n* ON (Active)\n* ON (Inactive)\n\n如果参数为 `ON (Active)`，调节器正在对内存进行调优。如果参数为\
  \ `ON (Inactive)`，意味着虽然设置了 `ON`，但由于启用的内存参数少于两个，自调优并未发生。如果参数为 `OFF`，显然没有启用内存。\n\n\
  你还可以通过内存日志文件查看自调优内存器的更改，这些文件位于实例的 `stmmlog` 子目录下。第一个创建的文件命名为 `stmm.0.log`，第二个文件命名为\
  \ `stmm.1.log`，依此类推。每个内存日志文件包含执行调优操作时每个消费者的资源摘要。你可以通过检查内存日志文件中的时间戳来确定调优间隔。\n\n![Image](img/note.jpg)\n\
  \n**注意：自调优在不同内存参数之间重新分配内存。当 `database_memory` 设置为数值时，必须将另一个内存消费者设置为 `AUTOMATIC`\
  \ 才能进行调优。要为 `locklist` 配置参数启用自调优，还必须启用 `maxlocks`。\n\n要为 `sheapthres_shr` 配置参数启用自调优，还必须启用\
  \ `sortheap`。\n\n当数据库管理器配置参数 `sheapthres` 设置为 0 时，才允许对 `sheapthres_shr` 或 `sortheap`\
  \ 进行自动调优。\n\n自调优内存仅在 HADR 主服务器上运行。当在 HADR 对上激活自调优内存时，它不会在备服务器上运行。如果在当前备机上运行 HADR\
  \ `TAKEOVER` 命令，自调优内存操作也将切换到新的主机器。\n\n设置为 `AUTOMATIC` 的缓冲池在 `SYSCAT. BUFFERPOOLS`\
  \ 目录视图中的 `NPAGES` 将显示为 `-2`。要确定任何缓冲池消耗的精确字节数，请使用 `SYSIBMADM.SNAPDB_MEMORY_POOL`\
  \ 管理视图，如下所示：\n\n![Image](img/83-84.jpg)\n\n\n\n\n\n你是否好奇为什么在 `SYSIBMADM.SNAPDB_MEMORY_\
  \ POOL` 管理视图中有五个缓冲区池条目，而在 `SYSCAT.BUFFERPOOLS` 系统目录视图中却只有一个缓冲区池？原因非常简单：DB2 创建了四个隐藏的系统缓冲区池，分别为\
  \ `IBMSYSTEMBP4K`、`IBMSYSTEMBP8K`、`IBMSYSTEMBP16K` 和 `IBMSYSTEMBP32K`，它们页页大小分别为\
  \ 4 KB、8 KB、16 KB 和 32 KB，且每个包含 16 个页，以应对紧急情况。你还可以使用 `GET SNAPSHOT FOR BUFFERPOOLS`\
  \ 命令检查 `AUTOMATIC` 缓冲区池的实际大小：\n\n![Image](img/84.jpg)\n\n当为分区数据库启用自调优内存时，单个数据库分区被指定为调优分区，所有的内存调整决策都基于该数据库分区的内存和工作负载特征。在对分区上做出调整决策后，内存调整将分配到其他数据库分区，以确保所有数据库分区保持相似的配置。\n\
  \n# 自动存储\n\n自动存储功能最初在 DB2 V8.2 FP9 中引入，旨在让数据库管理员更容易地管理存储。在 DB2 9.7 中，不再通过使用显式容器定义在表空间级别管理存储，而是在数据库级别进行管理；而在\
  \ DB2 10.1 中，它是在存储组级别进行管理。从某种意义上说，创建、扩展和添加容器的责任完全由数据库管理器取代了数据库管理员。\n\n默认情况下，DB2\
  \ 10.1 中创建的所有数据库都使用自动存储功能。然而，如果创建数据库时使用了 `AUTOMATIC STORAGE NO` 子句，则无法在其中创建由自动存储管理的表空间。\n\
  \n在 DB2 10.1 中创建数据库时，会自动创建默认存储组 `IBMSTOGROUP`。你可以在 `CREATE DATABASE` 命令中为其建立一个或多个初始存储路径。随着数据库的增长，数据库会在这些存储路径上创建容器，然后根据需要扩展它们或自动创建新的。\n\
  \n你可以使用 `CREATE DATABASE` 命令在 `/stogroup1` 和 `/stogroup2` 文件系统路径上创建一个启用自动存储的数据库：\n\
  \n![Image](img/85-1.jpg)\n\n要验证所创建数据库的存储状态，使用 `db2pd` 或 `GET SNAPSHOT FOR DATABASE`\
  \ 命令：\n\n![Image](img/85-86.jpg)\n\n如果 `db2pd` 命令的 `Numpaths` 和数据库快照命令的 `Number\
  \ of automatic storage paths` 显示值为 `0`，则相应的数据库为未启用自动存储的数据库。非零值表示数据库启用了自动存储。在上面的示例中，`Numpaths`\
  \ 的值为 `2`，因为 `SAMPLE` 数据库是在两个存储路径上创建的。\n\n数据库 `SAMPLE` 的默认存储组是 `IBMSTOGROUP` 及其两个关联存储路径。所有默认表空间——`SYSCATSPACE`、`TEMPSPACE1`、`USERSPACE1`\
  \ 和 `SYSTOOLSPACE` 都创建在 `IBMSTOGROUP` 中。\n\n你可以使用 `GET SNAPSHOT FOR TABLESPACES`\
  \ 命令验证所创建表空间的当前状态：\n\n![Image](img/86.jpg)\n\n现在你已经在 `CREATE DATABASE` 命令中指定了存储组路径，DB2\
  \ 数据库管理器会将数据库路径与第一个存储组路径关联：\n\n![Image](img/87-1.jpg)\n\n`Database path` 是数据库管理器存放所有数据库配置信息的路径，例如数据库配置参数文件\
  \ `(SQLDBCONF)`、日志控制文件 `(SQLOGMIR.LFH, SQLOGCTL.LFH.1)` 等。\n\n你还可以使用 `ADMIN_GET_STORAGE_PATHS`\
  \ 表函数列出每个数据库存储组的自动存储路径，包括每个存储组的文件系统信息：\n\n![Image](img/87-2.jpg)\n\n![Image](img/note.jpg)\n\
  \n**注意：** 这只是 DB2 自动存储能力的基础。该主题（包括多温度数据管理）将在第 3 章 静态字典压缩算法。通过静态行压缩，表内重复的模式被替换为 12\
  \ 位符号，相应的真实数据值存储在内存中的静态字典中。\n\n在 DB2 9.5 中，IBM 引入了自动字典创建（ADC）过程，当表大小达到 2 MB 后，数据库管理器会自动构建压缩字典。这对\
  \ DBA 意味着什么？不需要在系统上运行离线的 `REORG` 或 `INSPECT` 命令来构建内存压缩字典。\n\n在 DB2 9.7 中，IBM 引入了一系列压缩能力，包括索引压缩、临时表压缩、内联大对象压缩。\n\
  \n在 DB2 10.1 中，IBM 引入了另一种名为 `adaptive compression`（自适应压缩）的数据压缩技术。自适应行压缩依赖于页级构建的压缩，并压缩页内不属于静态字典的模式。通过这种方式，自适应压缩不仅产生更好的压缩率，还能适应数据的变化。\n\
  \n表 2.8 提供了 DB2 数据压缩能力的摘要，以及用于验证压缩率的相关命令和表函数。\n\n| **表 2.8 DB2 数据压缩功能历史** |\n\n\
  | **版本** | **压缩功能** | **相关的激活与验证命令** |\n\n| DB2 9.1 之前 | 值压缩 MDC 块索引 备份压缩 | CREATE\
  \ TABLE … VALUE COMPRESSION ALTER TABLE … ACTIVATE VALUE COMPRESSION\n\nCREATE TABLE\
  \ … ORGANIZE BY DIMENSIONS\n\nBACKUP DATABASE … COMPRESS |\n\n| DB2 9.1 | 静态行压缩\
  \ | CREATE TABLE … COMPRESS YES ALTER TABLE … COMPRESS YES\n\nREORG TABLE … RESETDICTIONARY\
  \ 使用以下命令验证节省的空间：INSPECT ROWCOMPIMATE TABLE NAME <table> SCHEMA <schema> RESULTS\
  \ KEEP inspect_out.txt db2inspf inspect_out.txt db2inspf_out.txt |\n\n| DB2 9.5\
  \ | 自动字典创建 (ADC) | 使用表函数 SYSPROC.ADMIN_GET_TAB_COMPRESS_ INFO 验证表的压缩率。 |\n\n| DB2\
  \ 9.7 | • 索引压缩• 临时表压缩• 内联 LOB 压缩• XML 对象压缩 | 使用列出的表函数验证表和索引的压缩效率：SYSPROC.ADMIN_GET_TAB_COMPRESS_INFO\
  \ SYSPROC.ADMIN_GET_INDEX_COMPRESS_INFO |\n\n| DB2 10.1 | • 自适应压缩• 日志归档压缩 | CREATE\
  \ TABLE … COMPRESS YES ALTER TABLE … COMPRESS YES 使用以下表函数验证压缩效率：SYSPROC.ADMIN_GET_TAB_COMPRESS_INFO\
  \ 将数据库配置参数 LOGARCHCOMPR1 和 LOGARCHCOMPR2 设置为 ON 以启用第一和第二日志归档压缩。 |\n\n\n\n\n\n注意：这只是\
  \ DB2 数据压缩能力的基础，相关内容将在第 3 章“物理设计”中的“存储优化”部分进行详细讨论。\n\n# 自动数据库维护\n\n数据库管理器提供了自动维护功能，用于执行数据库备份、更新统计信息以及必要时重组表和索引。对数据库执行维护活动对于确保其性能优化和可恢复至关重要。你可以使用自动维护来执行以下维护操作：\n\
  \n*   创建数据库备份映像。自动数据库备份为用户提供了一种解决方案，帮助确保数据库得到正确且定期的备份，而用户无需担心何时备份，也无需了解 `BACKUP`\
  \ 命令的语法。\n*   整理数据碎片（表或索引重组）。此维护活动可以提高 DB2 数据库管理器访问表的效率。自动重组可以管理离线表和索引重组，用户无需担心何时以及如何重组其数据。\n\
  *   优化数据访问（运行 `RUNSTATS`）。DB2 数据库管理器会更新关于表数据、表索引中数据或表及其索引中所有数据的系统目录统计信息。DB2 优化器使用这些统计信息来确定响应查询时访问数据使用的路径。自动统计收集尝试通过维护最新的表统计信息来提高数据库性能。其目标是让\
  \ DB2 优化器始终根据准确的统计信息选择访问计划。\n*   执行统计分析。自动统计分析通过检测过时、缺失和指定错误的统计信息，并根据查询反馈生成统计分析，建议何时以及如何收集表统计信息。\n\
  \n在大多数情况下，确定是否以及何时运行数据库维护活动是一项困难的工作。然而，自动维护功能会为你管理好一切，使你能够处理其他关键业务问题。\n\n# 使用 CLP\
  \ 和 IBM Data Studio 配置自动维护\n\n要激活自动数据库维护功能，请如下所示更新维护数据库配置参数：\n\n![Image](img/90.jpg)\n\
  \n你还可以使用 IBM Data Studio 为数据库配置自动维护。图 2.11 显示了如何在 IBM Data Studio 管理资源器中调用“配置自动维护”向导。\n\
  \n![Image](img/91.jpg)\n\n*图 2.11：IBM Data Studio 中的自动维护向导*\n\n向导的第一个选项卡 `Options`\
  \ 列出了与自动维护相关的数据库配置参数，以及每个参数对应的复选框，如图 2.12](#009_Chapter002.html_fig2.12）所示。这些数据库配置参数允许你选择性或批量启用/禁用自动维护功能。例如，如果\
  \ `AUTO_MAINT` 设置为 `OFF`（清除复选框），这是维护的根参数，无论其他自动维护参数的实际值如何，它们都被视为无效。\n\n同样，如果 `AUTO_TBL_MAINT`\
  \ 设置为 `OFF`，则 `AUTO_REORG`、`AUTOSTATS_PROF`、`AUTO_PROF_UPD`、`AUTO_RUNSTATS` 和 `AUTO_STMT_STATS`\
  \ 参数的有效值为 `OFF`。如果 `AUTO_TBL_MAINT` 设置为 `ON`，则 `AUTO_REORG`、`AUTOSTATS_PROF`、`AUTO_PROF_UPD`、`AUTO_RUNSTATS`\
  \ 和 `AUTO_STMT_STATS` 参数的有效值为其实际值。选择参数的复选框将值设置为 `ON`，或取消选择将值设置为 `OFF`。\n\n你可以根据业务需求更改自动维护选项值，并点击\
  \ `Run` 更新数据库配置参数文件。图 2.13 显示了最近更新选项的部署状态。\n\n![Image](img/92-1.jpg)\n\n*图 2.12：IBM\
  \ Data Studio 中的自动维护选项选项卡*\n\n![Image](img/92-2.jpg)\n\n*图 2.13：自动维护命令部署状态*\n\n\
  配置维护向导的第二个和第三个选项卡允许你设置在线和离线维护窗口。维护窗口是你定义的某个时间段，用于允许 DB2 数据库管理器执行自动维护活动，而不是让它在任何时间（包括业务时间内）运行。在线维护窗口是执行维护操作的时间段，期间被维护的对象对应用程序和用户可访问。同样，离线维护窗口是执行维护操作的时间段，期间被维护的对象对应用程序和用户处于不可访问模式。\n\
  \n图 2.14 显示了在线维护窗口选项，指定了开始时间、维护活动允许的最持续时间以及星期几。你还可以通过在下拉菜单部分选择 `Not during the specified\
  \ time` 来选择在业务时间内不运行任何维护活动。`Offline Maintenance Window` 选项卡中的类似选项允许离线维护活动的发生。\n\n\
  ![Image](img/93.jpg)\n\n*图 2.14：在线维护窗口选项*\n\n要在数据库上激活自动备份维护，请遵循以下三个简单步骤：\n\n**步骤\
