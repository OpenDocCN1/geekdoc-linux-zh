  \ 或 PC/IXF 格式文件中检索值的一个或多个列的索引位置 |\n\n### LOAD 命令选项 (LOAD Command Options)\n如你所见，`LOAD`\
  \ 命令提供了四种不同的选项，用于控制加载操作如何影响复制到目标表的数据。这些选项包括以下内容：\n\n* `INSERT`: 当使用 `INSERT` 选项时，数据将追加到目标表（该表必须已存在）。\n\
  * `REPLACE`: 使用 `REPLACE` 选项时，目标表（必须已存在）中的任何现有数据将被删除，然后加载新数据。\n* `RESTART`: 当使用\
  \ `RESTART` 选项时，任何之前失败或终止的加载操作将继续，从最后记录的一致性点开始。使用此选项，指定的 `LOAD` 命令必须与启动之前加载操作时使用的\
  \ `LOAD` 命令相同（`RESTART` 选项指定除外）。\n* `TERMINATE`: 当使用 `TERMINATE` 选项时，当前加载操作将终止；如果该加载操作是用\
  \ `INSERT` 选项启动的，则所做的更改将回滚。如果终止的加载操作是用指定的 `REPLACE` 选项启动的，则目标表中的数据将被截断。\n\n## 使用示例\
