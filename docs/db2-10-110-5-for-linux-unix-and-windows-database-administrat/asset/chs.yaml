  \ 章节总结\n\n本章的目的是让你熟悉：\n*   可用的身份验证和授权机制\n*   权限的的授予和撤销\n*   角色和组之间的区别\n*   可信上下文和可信连接\n\
  *   可用的 LBAC 和 RCAC 机制\n*   DB2 审计功能及其用法\n\n完成本章后，你将具备足够的知识回答章节末的示例题。\n\n## 练习题\n\
