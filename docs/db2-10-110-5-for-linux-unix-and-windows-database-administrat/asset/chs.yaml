  \n# 显式分级锁定 (EHL)\n\n在 DB2 10.5 中，IBM 通过显式分级锁定 (EHL) 显著提升了 pureScale 的价值。在 pureScale\
  \ 中，本地缓冲池中的脏页在 CF 中被“注册”。可以将其想象成一个酒店登记处，客人是数据库页面，而酒店楼层是 pureScale 逻辑成员。\n\n当客人到达时，他们会被询问是否将一直留在房间里直到退房。如果是，则无需为该房间或该客人更新酒店登记处。然而，如果他们在入住期间离开房间并在酒店内走动，你希望跟踪他们对酒店设施的使用情况。\n\
  \n\n\n\n\n你可以使用此命令开启 EHL：\n\n![Image](img/1117-3.jpg)\n\n要关闭 EHL（默认设置），请使用此命令：\n\
  \n![Image](img/1117-4.jpg)\n\n一旦激活 EHL，DB2 就会跟踪对表和分区的访问。如果 DB2 认为在一段时间内（几分钟）仅有一个成员（member）正在访问该表或分区，则\
  \ DB2 将停止与该表或分区的 CF 协调本地成员事件。这可以减少开销并使本地进程运行得更快。任何时候，如果有不同的成员请求访问该表或分区，将重新与该表或分区的\
  \ CF 开始协调。\n\n开启或关闭与表或分区的协调是一项开销较大的操作，必须避免。你可以通过将针对表或分区的插入/更新，删除活动限制在单个成员上来实现。\n\
  \n以下示例包含一个针对表持续运行的插入过程；该表没有运行任何更新/删除操作。你已将表分区在集群的三个成员上。在关闭 EHL 时，会发生页和锁注册——但在开启\
  \ EHL 时，则不会发生。\n\n![Image](img/1118.jpg)\n\n## 成员集 (Member Sets)\n\nPureScale 具有隔离关联性不佳负载的能力。`Member\
  \ Sets` 识别了客户特别是 DBA 的一种分裂特质，即在集群中，你拥有的是社区（community），而在 `Member Sets` 中，你拥有的是殖民地（colony）。在某些时刻你想共享，而在另一时刻你想将工作负载发送到它们自己的房间里。\n\
  \n因此，使用 WLM，你基本上希望将成员分成殖民地（例如，成员 `0,3` 专门用于批处理负载，成员 `1,2` 包含 OLTP 负载——或者在成员 `0,2,4,6`\
  \ 上运行 BLU/影子负载，在 `1,3,5` 上运行所有其他负载）。\n\n如果你想创建一个新的 `Member Set`，请使用名为 `SYSPROC.WLM_CREATE_MEMBER_SUBSET`\
  \ 的新存储过程。要修改现有的 `Member Set`，请使用新的存储过程 `SYSPROC.WLM_ALTER_MEMBER_SUBSET`。\n\n`SYSPROC.WLM_CREATE_MEMBER_SUBSET`\
  \ 看起来如下：\n\n![Image](img/1119.jpg)\n\n![Image](img/note.jpg)\n\n**注意：** 上述代码段需要\
  \ `DBADM` 或 `WLMADM` 权限才能执行。\n\n## PureScale 工作负载管理：真实世界示例\n\n周四下午 3 点左右，你收到了一个关于某个高可见度项目的电话，该项目计划在周五晚上上线。插入处理性能似乎存在问题。在与开发团队进行数小时讨论后，你了解到这个问题之所以被发现是因为没有执行过任何压力测试。在\
  \ Java 中，你有 10 个并行线程都在向一个表插入数据：\n\n![Image](img/1119-1120.jpg)\n\n据报告，ESE 中的插入处理速度为每秒\
  \ 5 KB 行，而在 pureScale 中每每秒低于 2 KB 行。你设置了测试来确认报告的发现，并发现当 pureScale 中使用一个 Java 线程时，速率约为每秒\
  \ 4 KB 行，但每增加一个 Java 并行线程，总数就会下降。开发团队告知你，项目要成功，目标必须达到每秒插入超过 26 KB 行。\n\n你进行了常规的\
  \ Java 修改，包括将批处理大小设置为优化值。简单检查回收（reclaims）的数量和每个回收的平均等待时间即可得到答案。\n\n该 pureScale 集群有三个活动成员。`values(current\
  \ member)` 返回活动连接的成员编号。每个 Java 连接对象都会返回当前成员，但在部署/发布周期的这个阶段进行任何代码更改都太晚了。因此，开发团队告诉你可以采取任何你需要做的事，而不需要修改代码。\n\
  \n计划是创建目标成员表，以便插入处理可以在没有 CF 冲突的情况下进行。每个集群成员 `(0,1,2)` 将拥有自己的表：\n\n![Image](img/1120-1121.jpg)\n\
  \n你创建了一个 `INSTEAD OF INSERT` 触发器来捕获 Java 插入，并根据连接建立的位置将它们重定向到正确的表。这让你能够保持允许工作负载在集群中浮动的默认设置：\n\
  \n![Image](img/1221-1222.jpg)\n\n这样在不更改任何应用程序代码的情况下，你设置了 `INSERT` 和 `SELECT` 按原始设计运行，但\
  \ `INSERT` 的性能将会好得多。\n\n插入处理的最终结果超过了每秒插入 36 KB 行。\n\n你应该开启 EHL 吗？在这种情况下，EHL 将减少此插入过程的\
  \ CPU 和到 CF 的流量。然而，这将以牺牲组缓冲区池 (GBP) 作为该表 SELECT 二级缓存为代价的。相反，你可以在关闭 EHL 时监控读取命中率，稍后开启\
  \ EHL 查看读取命中率是否恶化以及读取 I/O 计数是否增加。\n\n## 备份与恢复增强\n\nDB2 10.5 FP4 Cancun 为 pureScale\
  \ 拓扑提供了增量和增量增量备份。在你更改 pureScale 拓扑（例如删除成员或在恢复到非超集拓扑）后，不再需要离线备份。此外，当将 ESE (LUW) 数据库恢复到\
  \ pureScale 时，你可以执行增量在线或离线备份，而不是全离线备份。\n\n## 使用备份恢复迁移数据库\n\n使用备份恢复增强将数据库迁移到 pureScale\
  \ 或从 pureScale 迁移到 ESE (LUW) 的能力很大程度上取决于访问数据的应用程序是否可以停机。目前假设数据可用的时间足够完成迁移。\n\n现在可以在非\
  \ pureScale 和 pureScale 数据库之间进行备份和恢复。不同拓扑的 pureScale 环境之间也支持备份恢复操作。当在 pureScale\
  \ 和非 pureScale 环境之间进行备份恢复操作时，你必须执行离线全备份。\n\n你应该从同一个逻辑成员执行所有备份和恢复。SQLLIB 中的 `db2nodes.cfg`\
  \ 文件包含与拓扑相关的节点号。对于 ESE (LUW) 拓扑，这很可能是零 (0)。如果在 pureScale 集群上运行，则从成员 `0` 执行恢复。\n\n\
  当源 pureScale 集群拓扑的所有成员都存在于目标 pureScale 集群拓扑时，目标 pureScale 集群拓扑被称为*源集群的超集*。在这种情况下，仅允许滚动（roll-forward）操作，这也是可以使用源在线备份的唯一情况。\n\
  \n如果目标集群拓扑不是源集群拓扑的超集，但至少有一个共同成员，则任何拓扑更改都需要增量备份或全量备份，且只有源数据库的全离线备份有效。\n\n表 10.20\
  \ 列出了不同的备份和恢复选项。\n\n![Image](img/1123.jpg)\n\n## 迁移数据库到 PureScale 的前提\n\n将数据库从 ESE\
  \ (LUW) 迁移到 pureScale 有三个前提条件。这些条件大部分与 pureScale 的数据库要求有关。\n\n### 非 Unicode 数据库\n\
  \nPureScale 要求你使用 Unicode 代码集定义数据库。你无法修改数据库的代码集；因此，必须创建一个新数据库来更改代码集。你通过创建一个 Unicode\
  \ 代码集数据库并从非 Unicode 数据库迁移数据来实现此。有关如何在不同代码集之间移动数据的更多信息，请参阅“物理设计”部分中的“更改数据库的代码集”。\n\
  \n\n\n\n\n当您创建一个新数据库以满足 Unicode 要求时，建议您同时满足所有先决条件。此外，强烈建议在数据库仍处于 ESE (LUW) 状态时进行必要的更改。在执行源数据库备份之前，确保容器分配位置正确且存储组已正确定义。\n\
  \n当以 `AUTOMATIC STORAGE YES` 创建新数据库时，默认存储组为 `IBMSTOGROUP`。您应该将所有表空间定义为 `MANAGED\
  \ BY AUTOMATIC STORAGE` 并将它们分配给适当的存储组。\n\n数据库准备绪后，执行 `db2checkSD` 以验证其是否符合 pureScale\
  \ 条件。纠正报告的任何问题并重新运行命令，直到不再报告问题为止。\n\n### 定义为 `AUTOMATIC STORAGE NO` 的 Unicode 数据库\n\
  \n定义为 `AUTOMATIC STORAGE NO` 的数据库不会定义任何存储组。在将表空间定义为 `MANAGED BY AUTOMATIC STORAGE`\
  \ 之前，您必须至少定义一个存储组。\n\n创建一个存储组。当在定义为 `AUTOMATIC STORAGE NO` 的数据库中执行 `CREATE STOGROUP`\
  \ 语句时，会发生以下变化：\n\n1. 数据库被更改为 `AUTOMATIC STORAGE YES`。\n2. 存储组被设置为默认。\n\n基本上，在数据库中创建第一个存储组将把数据库转换为\
  \ `AUTOMATIC STORAGE YES`。然而，这种操作是不可逆的。您无法删除默认存储组，这意味着您必须始终定义一个存储组作为默认。\n\n有关如何使用存储组的更多信息，请参阅“物理设计”部分下的“存储组”。有关表空间的更多信息，请参阅“物理设计”部分下的“表空间”。\n\
  \n所有表空间都应转换为 `MANAGED BY AUTOMATIC STORAGE`。对于 DMS 表空间，您可以在重定向还原期间使用 `ALTER TABLESPACE`\
  \ 语句或 `SET TABLESPACE` 语句来实现此目标。您无法通过这种方式更改 SMS 表空间，因此您将需要重新创建它们。\n\n### 数据库配置配置设置\n\
  \n由于现在的 pureScale 相比 ESE (LUW) 更加严格，如果在 ESE (LUW) 中使用了某些数据库配置设置，在迁移到 pureScale 之前必须更改。限制列表也取决于目标\
  \ pureScale 软件版本。\n\n`db2checkSD` 过程将检查源数据库的兼容性问题，因此请确保在执行备份并尝试迁移到 pureScale 之前修正所有问题。\n\
  \n# 将 ESE (LUW) 容器路径映射到 PureScale\n\n任何数据库迁移都有一个共同先决条件：表空间容器必须分配在目标服务器的挂载文件系统上。如果源和目标服务器上的文件系统相同，则不需要更改。然而，在许多情况下，容器的位置会发生；因此必须将源文件系统转换为目标文件系统。\n\
  \nPureScale 访问存储在由 GPFS 软件管理的共享文件系统容器中的数据。源 ESE (LUW) 数据库使用分配在非共享文件系统上的表空间容器。管理表空间容器最好且简单的方法是使用存储组。这也是将源文件系统映射到目标服务器的最简单方法。\n\
  \n在重定向还原过程中，您将使用 `SET STOGROUP` 语句更改分配给存储组的路径。假设在您的 ESE (LUW) 数据库中已创建了以下存储组：\n\n\
  ![Image](img/1125-1.jpg)\n\n定义到 `DATA` 存储组的路径位于数据库服务器的本地磁盘上。当此数据库还原到 pureScale 集群时，您将需要修改这些路径以指向您的共享文件系统。\n\
  \n在初始还原数据库命令之后，您将使用此语句更改路径：\n\n![Image](img/1125-2.jpg)\n\n![Image](img/note.jpg)\n\
  \n**注意：** 在移动到 pureScale 时，确保您已正确完成所有操作，特别是涉及表空间和存储组的操作。pureScale 不支持表空间重平衡，也不支持对存储组或表空间的许多更改。如果是移动到\
  \ SE (LUW)，在还原后进行修正是可以的。\n\n# 备份和还原示例\n\n现在让我们来看四个关注之前讨论场景的备份和还原示例。\n\n在第一个示例中，源\
  \ ESE (LUW) 数据库名为 `SAMPLE`，pureScale 目标数据库为 `NEWDB`：\n\n![Image](img/1126.jpg)\n\
  \n![Image](img/1127.jpg)\n\n在第二个示例中，pureScale 数据库 `NEWDB` 是源，ESE (LUW) 数据库 `SAMPLE`\
  \ 是目标：\n\n![Image](img/1128.jpg)\n\n![Image](img/1129.jpg)\n\n![Image](img/1130-1.jpg)\n\
  \n在示例 3 中，源成员为 `(0,1)`；目标成员为 `(0,2)` 且不是超集。\n\n![Image](img/1130-2.jpg)\n\n在示例 4\
  \ 中，源成员为 `(0,1,2)`，目标成员为 `(0,1,2,3)` 且是超集：\n\n![Image](img/1130-1131.jpg)\n\n# 在\
  \ pureScale 中支持多个数据库\n\n有时在 pureScale 拓扑结构中需要创建多个数据库。年前创建多个数据库的许多理由不再适用，而且在 pureScale\
  \ 拓扑中，创建多个数据库的理由更少。此外，在许多情况下，相比向现有集群添加数据库，使用独立的 pureScale 集群/实例是合理的。\n\n单个 pureScale\
  \ 集群可以支持最多 200 个数据库。每个集群的数据库激活最大数为 512 个。因此，在四节点集群中，数据库管理器 `NUMDB` 的最大值为 `128`。如果需要成员崩溃恢复\
  \ (MCR)，并行数据库恢复的数量是 `NUMDB` 或注册表设置 `DB2_MCR_RECOVERY_PARALLELISM_CAP` 中的较小值。当只有一个数据库活动状态时，设置\
  \ `DB2_DATABASE_CF_MEMORY=100` 和 `CF_DB_MEM_SZ=<CF_MEM_SZ> AUTOMATIC`。\n\n如果您运行带有多个活动数据库的\
  \ pureScale 实例，挑战在于管理 CF 资源。`CF_MEM_SZ` 无法在线配置，因此将其设置为 `AUTOMATIC` 是最佳选择。然而，您可以在线配置其他重要的\
  \ CF 设置。`CF_DB_MEM_SZ` 必须小于 `CF_MEM_SZ`，且小于或等于 `CF_GBP_SZ`、`CF_LOCK_SZ` 和 `CF_SCA_SZ`\
  \ 之和。集群中所有数据库的 `CF_DB_MEM_SZ` 之和应小于或等于 `CF_MEM_SZ`。避免让 `CF_DB_MEM_SZ` 值之和超过 `CF_MEM_SZ`。如果您需要增加其中一个数据库的\
  \ `CF_DB_MEM_SZ` 以导致总和超过 `CF_MEM_SZ`，则必须先减少一个或多个其他数据库的 `CF_DB_MEM_SZ` 值以抵消增加。\n\n\
  # CF 自调优内存功能\n\n在 IBM DB2 10.5 FP5 之前，注册表参数 `DB2_DATABASE_CF_MEMORY` 的可用设置为 `-1`\
  \ 或固定百分比。在多数据库配置中，设置 `DB2_DATABASE_CF_MEMORY=-1` 将导致每个活动数据库获得相等的 CF 资源份额。这在您的环境中可能是可以的，但它有两个显著关注的问题。`-1`\
  \ 和固定百分比都是基于活动数据库数量。在 `-1` 的情况下，系统根据数据库管理器设置 `NUMDB` 为您设置百分比，这需要全局实例周期才能更改。*全局实例周期*\
  \ 意味着集群中的所有成员必须同时关机才能更改设置。\n\n从 DB2 10.5 FP5 开始，IBM 引入了 CF 自调优内存（CF 内存自动调优）。要激活此功能，您需要设置注册表参数\
  \ `DB2_DATABASE_CF_MEMORY=AUTO` 并设置数据库管理器参数 `CF_MEM_SZ=<CF 服务器内存的 90%>` `AUTOMATIC`。该功能提供了两种管理\
  \ CF 内存资源。\n\n\n\n\n\n如果你希望减少活动数据库 CF（列存储）内存占用的变化，第一步是设置数据库配置参数：\n\n* `CF_DB_MEM_SZ=<Percentage\
  \ * CF_MEM_SZ>`\n* `CF_GBP_SZ=<.80 * CF_DB_MEM_SZ> AUTOMATIC`\n* `CF_LOCK_SZ=<.15\
  \ * CF_DB_MEM_SZ> AUTOMATIC`\n* `CF_SCA_SZ=<.05 * CF_DB_MEM_SZ> AUTOMATIC`\n\n实例中所有活动数据库的\
  \ `(CF_DB_MEM_SZ)` 之和应小于或等于 `CF_MEM_SZ`。`(CF_GBP_SZ+CF_LOCK_SZ+CF_SCA_SZ)` 应等于 `CF_DB_MEM_SZ`。\n\
  \nCF 自调优功能将根据工作负载，在 `CF_DB_MEM_SZ` 的内存范围内对 `CF_GBP_SZ`、`CF_LOCK_SZ` 和 `CF_SCA_SZ`\
  \ 进行内存调整。这可以防止一个活动数据库的工作负载基于 CF 内存资源上影响另一个活动数据库。\n\n如果你希望 CF 自调优功能根据工作负载调整分配每个活动数据库的\
  \ CF 内存，请设置 `CF_DB_MEM_SZ=<Percentage * CF_MEM_SZ> AUTOMATIC`。重要的是将数据库管理器参数 `NUMDB`\
  \ 设置为合理的值，该值很可能不是默认的 32。相反，应将 `NUMDB` 设置为预期活动数据库的数量或一个合理的增长目标。如果 `CF_MEM_SZ` 设置为\
  \ `AUTOMATIC`，当 CF 服务器发生 RAM 变化时，CF 自调优功能将调整 CF 内存量。\n\n# 监控 DB2 活动\n\n在 DB2 10.5\
  \ 中，IBM 添加了监控元素以帮助你理解列处理、HADR 处理、排序处理、备份和索引创建。有关 DB2 监控的详细信息，请参见第 5 章，“监控 DB2 活动”。\n\
