  \ 格式外部文件中的数据，以及存储在单独文件中的 LOB 数据值加载到名为 `EMP_PHOTO` 的表中，然后更新 `EMP_PHOTO` 表及其相关索引的统计信息，请执行类似下面的\
  \ `LOAD` 命令：\n\n![Image](img/626-2.jpg)\n\n在这种情况下，你必须指定 `REPLACE` 选项执行 `LOAD` 命令；如果使用\
  \ `REPLACE` 以外的任何选项执行 `LOAD` 命令，则无法收集统计信息。此外，必须已经存在 `EMP_PHOTO` 表的统计信息配置文件（统计配置文件通过执行\
  \ `RUNSTATS` 命令创建，我们稍后会介绍）。如果不存在配置文件且指示 `Load` 实用程序收集统计信息，将返回警告且不收集统计信息。\n\n现在，假设你想将存储在名为\
  \ `dept.del` 的分隔 ASCII (DEL) 格式外部文件中的数据加载到名为 `DEPARTMENT` 的表中，同时允许其他事务读取。需要注意的是，当此加载操作进行时，表中的数据将保持可访问。你可以通过执行类似所示的\
  \ `LOAD` 命令来实现这一点：\n\n![Image](img/627-3.jpg)\n\n\n\n\n因此，有效来说，转储文件中违反了 `NOT NULL`\
  \ 约束的记录，以及违反 `UNIQUE` 或 `PRIMARY KEY` 约束的记录，将从目标表中删除并插入到异常表中。\n\n## 加载 XML 数据\n\n\
  你可以使用 `Load` 实用程序将大量 XML 数据加载到表中。在向 XML 列中加载数据时，请使用 XML `FROM` 子句来指定输入 XML 数据文件的路径。要将来自分隔符\
  \ ASCII 文件 `product.del` 的关系型数据以及来自位于 `c:\\xmlpath` 的 XML 文件的 XML 数据加载到 `PRODUCT`\
  \ 表，请执行类似 `LOAD` 命令：\n\n![Image](img/630.jpg)\n\n![Image](img/631-1.jpg)\n\n在加载过程中，你将无法为\
  \ XML 类型的列收集分布统计信息。\n\n## 从 CURSOR 加载\n\n`Load` 实用程序支持 `CURSOR` 类型的加载，在运行 `LOAD`\
  \ 命令时可以指定 `CURSOR` 文件类型，并将 SQL 查询的结果直接加载到目标表中，而无需创建中间导出文件。此外，你还可以通过在 `DECLARE CURSOR`\
  \ 语句中使用 `DATABASE` 选项并在 SQL 查询中引用 DB2 联邦别名（nickname），从另一个数据库加载数据。要执行 `LOAD FROM\
  \ CURSOR CLP` 命令，首先针对要加载的 SQL 语句声明游标，然后在 `LOAD` 命令中使用该游标名称，如下所示：\n\n![Image](img/631-2.jpg)\n\
  \n## 从管道（Pipe）加载\n\n与 `LOAD FROM CURSOR` 类似，你也可以使用操作系统管道将数据加载到目标表内，而无需创建中间导出文件。此外，你可以通过使用目录（catalog）和操作系统管道从另一个远程数据库加载数据，而无需创建中间导出文件并跨服务器复制它。当使用\
  \ `PIPE` 文件类型时，你必须已在操作系统层通过 `mkfifo` 命令创建了管道。让我们仔细查看每个步骤。\n\n**步骤 1：** 在目标服务器上创建操作系统管道：\n\
  \n![Image](img/632-1.jpg)\n\n**步骤 2：** 在目标服务器上对源数据库进行目录注册：\n\n![Image](img/632-2.jpg)\n\
  \n**步骤 3：** 从目标服务器远程连接到源数据库：\n\n![Image](img/632-3.jpg)\n\n**步骤 4：** 从源数据库导出数据并写入管道的一端（`datapipe`）：\n\
  \n![Image](img/632-4.jpg)\n\n**步骤 5：** 本地连接到目标数据库：\n\n![Image](img/632-5.jpg)\n\n\
  **步骤 6：** 使用 `LOAD` 命令从管道的另一端读取数据并将数据加载到目标表中：\n\n![Image](img/633-1.jpg)\n\n**步骤\
  \ 7：** 数据加载过程完成后，删除步骤 1 中创建的管道：\n\n![Image](img/633-2.jpg)\n\n# 不可的加载操作\n\n当你的数据库启用归档日志（archive-logging）且你对表执行\
  \ `NO COPY` 加载操作时，底层的表空间将保持在备份等待（Backup Pending）状态。如果表空间未进行备份，数据库管理器将不允许在该表空间上发生任何\
  \ DML 操作；但是，允许运行只读操作。\n\n在业务过程中，如果某些情况下在执行任何转换之前需要从外部源系统将数据加载到临时表（staging table），你可能可以使用\
  \ `NONRECOVERABLE` 子句来避免为每次加载运行都备份表空间。当你指定此子句时，加载事务将被标记为不可恢复（nonrecoverable），无法通过随后的重滚（roll-forward）操作恢复数据。尝试执行重滚操作将导致实用程序跳过该事务，并将正在加载数据的表标记为无效。在重滚操作之后，此类表只能被删除并重建。\n\
  \n如果你对范围分区表（range partition table）的数据分区执行了 `NONRECOVERABLE` 加载，随后的重滚操作将把特定的数据分区标记为无效，而不是使整个表变无效。这允许你将无效分区从基表中分离（detach），并访问剩余数据分区的数据。相关的无效对象错误代码及其解决步骤如下：\n\
  \n![Image](img/633-3.jpg)\n\n要在基范围分区表中查找无效分区，请使用类似下面的 SQL 语句：\n\n![Image](img/634-1.jpg)\n\
  \n一旦获取了数据分区名称，使用 `ALTER TABLE` 命令将其从父表中分离：\n\n![Image](img/634-2.jpg)\n\n如果你的数据库启用了循环日志（circular-logging），默认情况下\
  \ `LOAD` 命令以 `NONRECOVERABLE` 模式运行，这是唯一支持的模式。\n\n# 监控加载操作\n\n你可以使用 `LIST UTILITIES`\
  \ 命令或 `LOAD QUERY` 命令监控加载操作的进度。`LIST UTILITIES SHOW DETAIL` 命令显示在实例上运行的所有活动实用程序。如果你想查看特定的表加载操作，请执行\
  \ `LOAD QUERY TABLE` 命令：\n\n![Image](img/634-635.jpg)\n\n上述命令输出显示在 `08/05/2014 09:57:30.029518`\
  \ 对数据库 `SAMPLE` 执行了加载；它还在顶部描述中列出了该命令。你可以通过查看监控部分的阶段来轻松监控加载进度。如果目标表没有索引，你将只看到设置（setup）和加载阶段。\n\
  \n为了专门监控表加载（这发生在具有大量数据且并行运行多个加载过程的数据库上），请使用 `LOAD QUERY` 命令：\n\n![Image](img/636)\n\
  \n## Set Integrity 命令\n\n加载操作完成后，表可能处于完整性检查等待（Set Integrity Pending）状态，以检查引用完整性和约束。然而，加载过程通常在删除阶段会检查\
  \ `NOT NULL` 列以及 `UNIQUE` 或 `PRIMARY KEY` 约束的无效数据。你可以使用 `SET INTEGRITY` 命令检查表的约束违反情况并使表退出等待状态：\n\
  \n![Image](img/637-1.jpg)\n\n该命令有多种可用选项，将在第 4 章业务规则实现“Set Integrity 命令”节中详细讨论。\n\
  \n![Image](img/note.jpg)\n\n注意：加载实用程序也可以在不产生日志的情况下删除表中的所有记录。只需将空设备（在 UNIX 上为 `/dev/null`；在\
  \ Windows 上为 `nul`）作为输入文件即可。例如：\n\n![Image](img/637-2.jpg)\n\n你可以使用 `TERMINATE`\
  \ 子句利用上述技巧退出加载等待状态（SQL0668N 原因代码 3）：\n\n![Image](img/637-3.jpg)\n\n此外，你可以使用 `TRUNCATE`\
  \ 命令（DB2 9.7 引入）以最小日志删除表中的所有记录。\n\n![Image](img/note.jpg)\n\n认证提示：只有具有系统管理员（SYSADM）权限、数据库管理员（DBADMN）权限或加载（LOAD）权限且对所有引用的表具有\
  \ INSERT 权限的用户，可以使用 `INSERT` 选项加载数据（或重启或终止 INSERT 加载操作）。只有具有 SYSADM 权限、DBADMN 权限且对所有引用的表具有\
  \ INSERT 和 DELETE 权限的用户，可以使用 `REPLACE` 选项加载数据（或重启或终止 REPLACE 加载操作）。只有具有 SYSADM 权限、DBADMN\
  \ 权限或对使用的异常表具有 INSERT 权限的用户，允许执行将无效行写入异常表的加载操作。\n\n\n\n存储在外部文件中的数据也可以通过 IBM Data\
  \ Studio 中的 `Load Table` 向导进行加载，您可以通过在管理（Administration）视图中选择适当的操作来激活它。图 6.19 显示了如何激活\
  \ `Load Table` 对话框；其余选择与 Data Studio Import 窗口中的选择相似。\n\n![Image](img/638.jpg)\n\
  \n*图 6.19：通过 IBM Data Studio 调用 Load 实用程序*\n\n# DB2 Ingest 数据工具\n\n现代数据仓库环境要求从多个数据源进行持续的数据流传输，以确保实时访问业务关键数据。数据仓库系统的其他关键需求还包括：\n\
  \n*   具有最小或无锁定行为的并发数据访问\n*   高容错能力和数据恢复能力支持\n*   在数据流传输阶段执行数据转换的能力\n\n`Ingest` 工具（也称为\
  \ `Continuous Data Ingest`，或 `CDI`）是一种高速、客户端侧、高度可配置、多线程的 DB2 工具，它通过使用类似于 SQL 的命令从文件和管道将数据流到\
  \ DB2 目标表。由于 `Ingest` 工具可以在移动大量实时数据而不锁定目标表，因此您无需在数据新颖性和可用性之间进行选择。\n\nDB2 `Ingest`\
  \ 工具通过多个关键能力满足了当前现代数据仓库的预期：\n\n*   **并发数据访问。** 您可以对正在加载的 DB2 表运行并发的 SQL 语句，因为 `Ingest`\
  \ 工具始终使用行级锁定。您不必像以前那样通过隔离级别在调整数据并发性与数据可用性之间进行选择。\n*   **异常处理。** 您可以将被拒绝的记录复制到文件或表中，或者根据业务规则将其丢弃。如果发生任何数据加载操作失败，则可以通过从上一个提交点重新启动摄操作来轻松恢复数据。\n\
  *   **数据转换。** 您可以在持续向 DB2 表中泵入数据的同时，应用数据转换技术。\n*   **感知数据库分区。** 您可以并行将数据直接插入到相应的分区中，而不是通过协调分区处理整个数据集。这与\
  \ IBM Information Server Enterprise Stage 类似。\n*   **广泛的 DML 支持。** 在向数据仓库系统流式传输数据时，可以使用\
  \ `INSERT`、`UPDATE`、`DELETE`、`REPLACE` 和 `MERGE` 操作。这些 DML 操作可以在数据转换期间使用。\n*   **任意配置。**\
  \ `Ingest` 工具是 DB2 客户端功能的一部分（不需要额外许可证），并且非常灵活且易于配置。可以在现有的 DB2 服务器、专用的摄取服务器、现有的共享提取、转换和加载\
  \ (ETL) 服务器或 DPF 系统上的协调节点上安装和配置 `Ingest` 工具。\n*   **数据格式支持。** 您可以从分隔的 ASCII (`DEL`)、非分隔的\
  \ ASCII (`ASC`)、不同顺序和格式的列、位置文本和二进制数据文件格式加载数据。\n*   **各种表支持。** 您可以将数据加载到普通表、别名表、MDC\
  \ 和插入时间聚集 (ITC) 表、范围分区表、范围聚集表 (RCT)、MQT、时间表和可更新视图。\n\n图 6.20 显示了 `Ingest` 工具架构。来自源系统的数据被导出到文件或命名管道中，然后作为输入源流式传输到\
  \ `Ingest` 工具。随后，数据通过三个步骤摄取到目标数据仓库系统：\n\n1.  **传输（Transport）。** 传输线程从数据源读取数据并将记录放在格式化队列中。对于插入和合并操作，每个输入源有一个传输线程（例如，每个输入文件一个线程）。对于更新和删除操作，只有一个传输线程。\n\
  2.  **格式化（Format）。** 格式化器解析格式化队列中的每个可用记录，将数据转换为 DB2 数据库系统所需的格式，并将每个格式化后的记录放在该记录分区的某个刷新器队列（flusher\
  \ queues）中。格式化线程的数量由 `NUM_FORMATTERS` Ingest 配置参数指定，默认设置为 `(逻辑 CPU 数量)/2`。\n3. \
  \ **刷新（Flush）。** 刷新器发布 SQL 语句以对数据仓库目标表执行摄取操作。每个分区的刷新器数量由 `NUM_FLUSHERS_PER_PARTITION`\
  \ Ingest 配置参数指定，默认设置为 `max (1, ((逻辑 CPU 数量)/2)/(分区数量))`。\n\n![Image](img/640-1.jpg)\n\
  \n*图 6.20：Ingest 工具架构*\n\n您通过执行 `INGEST` 命令来调用 `Ingest` 工具。该命令的基本语法如下：\n\n![Image](img/640-2.jpg)\n\
  \n| where: | |\n| :--- | :--- |\n| `FileName` | 指定从从中摄取数据的外部文件的名称和位置 |\n| `PipeName`\
  \ | 指定用于摄取数据的管道名称 |\n| `ExFileName` | 指定写入被格式化器拒绝记录的文件 |\n| `ExTableName` | 指定写入被拒绝记录的表\
  \ |\n| `MsgFileName` | 指定记录信息、警告和错误消息的文件 |\n| `TableName` | 指定目标表 |\n\n\n\n\n将数据插入到目标表\
  \ `mytable2` 的 `INGEST` 命令如下：\n\n![Image](img/645-3.jpg)\n\nDB2 `Ingest` 程序会根据目标表定义自动修改\
  \ `INSERT` 中的 `VALUES` 列表。对于上述表定义，`VALUES` 列表将类似于 `VALUES ($C1, $C2, DEFAULT)`。\n\
  \n如下一个示例所示，Ingest 程序可以在单个命令中处理多个输入文件：\n\n![Image](img/646-1.jpg)\n\n## 从管道摄取数据\n\
  \n你可以使用操作系统管道而不是外部文件将数据摄取到目标 DB2 表中。这避免了在源服务器上创建大量输入文件并将其拷贝到 `Ingest` 程序服务器上。基本步骤如下：\n\
  \n**步骤 1：** 使用 `mkfifo` 命令 (UNIX) 在目标服务器上创建一个操作系统管道：\n\n![Image](img/646-2.jpg)\n\
  \n**步骤 2：** 在目标服务器或 `Ingest` 程序服务器上将源数据库目录为远程：\n\n![Image](img/646-3.jpg)\n\n**步骤\
  \ 3：** 从目标服务器远程连接到源数据库：\n\n![Image](img/647-1.jpg)\n\n**步骤 4：** 从源数据库导出数据并写入管道的一端（`datapipe`）：\n\
  \n![Image](img/647-2.jpg)\n\n**步骤 5：** 本地连接到目标数据库：\n\n![Image](img/647-3.jpg)\n\n\
  **步骤 6：** 使用 `INGEST` 命令从管道的另一端读取数据并将数据加载到目标表中：\n\n![Image](img/647-4.jpg)\n\n**步骤\
  \ 7：** 在数据加载过程完成后，删除步骤 1 中创建的管道：\n\n![Image](img/647-5.jpg)\n\n## DML 操作\n\n通过 `Ingest`\
  \ 程序，你可以使用 insert、update、delete、replace 和 merge DML 操作将源数据流传输到目标 DB2 表。更新操作的示例命令为：\n\
  \n![Image](img/647-648.jpg)\n\n输入数据文件和 `mytable3` 中的当前记录看起来如下：\n\n![Image](img/648.jpg)\n\
  \n注意，输入数据文件的记录条目与表数据相比多了两记录。这些记录将被拒绝，因为基表中没有匹配的记录可以进行更新：\n\n![Image](img/648-649.jpg)\n\
  \n消息文件显示了关于为什么两条记录被拒绝的信息，并显示了 Ingest 配置的自动设置：\n\n![Image](img/649.jpg)\n\n最后，更新摄取操作后，基表中的记录如下：\n\
  \n![Image](img/649-650.jpg)\n\n同样，delete、merge 和 replace 操作的 `Ingest` 程序命令如下：\n\n\
  ![Image](img/650-651.jpg)\n\n# DB2 Ingest 参数\n\n`Ingest` 程序有其自己的配置参数设置，这些设置仅影响同一\
  \ CLP 会话中的后续 `INGEST` 命令，而不会影响其他 CLP 会话中的 `INGEST` 命令。\n\n更新 `Ingest` 程序参数的语法为：\n\
  \n![Image](img/651.jpg)\n\n表 6.6 列出了 `Ingest` 配置参数；这些设置仅在会话级别生效。\n\n| 表 6.6: DB2\
  \ Ingest 程序参数 |\n\n| 参数 | 默认值和范围 | 说明 |\n| :--- | :--- | :--- |\n| commit_count\
  \ | 0 [0 到 32 位有符号整数] | 指定每个刷新器在发出提交之前单次事务中写入的行数。它应该是 1,000 的倍数；否则，DB2 将将其舍入到最近的倍数。\
  \ |\n| commit_period | 1 [0 到 2 678 400] | 这指定已提交事务之间的秒数。在每次刷新时，Ingest 程序会检查自上次提交以来的秒数；如果大于或等于\
  \ `commit_period` 的设置，则发出提交命令。 |\n| num_flushers_ per_partition | MAX(1,((CPU/2)/PARTITION))\
  \ [0 到系统 CPU 数量] | 这指定为每个数据库分区分配的刷新器数量。当存在删除、合并或更新操作时，此参数将调整为 0 或 1 以避免死锁情况 (SQL2903W)。\
  \ |\n| num_formatters | MAX(1,CPU/2) [0 到系统 CPU 数量] | 这指定分配的格式化数量。如果你在 `INGEST`\
  \ 命令中指定 `DUMPFILE` 或 `BADFILE` 子句以按输入文件中出现的顺序记录坏记录，则必须将此参数设置为 1。 |\n| pipe_timeout\
  \ | 600 [0 到 2 678 400] | 这指定当输入源为管道时等待数据的最大秒数。当你将此参数设置为 0 时，Ingest 程序将无限等待。 |\n\
  | retry_count | 0 [0 到 1000] | 这指定失败但可恢复的操作重试次数。 |\n| retry_period | 0 [0 到 2 678\
  \ 400] | 这指定在重试失败但可恢复的操作之前等待的秒数。 |\n| shm_max_size | 0 [0 到系统内存] | 这指定分配的最大共享内存大小。\
  \ |\n\n## 处理 Ingest 问题\n\n`Ingest` 程序支持将拒绝的记录复制到文件或丢弃它们，如图 6.21 所示。你可以使用 `DUMPFILE`\
  \ 选项将拒绝的记录写入文件，或使用 `EXCEPTION TABLE` 选项将它们写入表。记住，拒绝的记录不会导致 `INGEST` 命令失败。\n\n![Image](img/652.jpg)\n\
  \n*图 6.21: Ingest 程序处理*\n\n以下示例特意在 `myinputfile.txt` 中放置了一些无效记录：\n\n![Image](img/653.jpg)\n\
  \n要将 `myinputfile.txt` 填充到具有 `CHECK (TOTAL_PRICE > 10)` 约束的目标表 `mytable7`，你需要执行此\
  \ `INGEST` 命令：\n\n![Image](img/653.jpg)\n\n在上面的示例中，`DUMPFILE` 指定由于类型不匹配而被格式化程序拒绝的行写入文件\
  \ `dump_mytable7.txt`。该文件的内容如下：\n\n![Image](img/654-1.jpg)\n\n`EXCEPTION TABLE`\
  \ 表明由于约束检查而被拒绝的行写入表 `exp_mytable7`。该表的内容类似于：\n\n![Image](img/654-2.jpg)\n\n`MESSAGES`\
  \ 指定接收信息、警告和错误消息的文件。在上面的示例中，所有消息都记录在 `msg_mytable7.msg` 中，文件内容如下：\n\n![Image](img/654-655.jpg)\n\
  \n最后，摄取到目标表 `mytable7` 的数据为：\n\n![Image](img/655.jpg)\n\n# 恢复失败的 Ingest 命令\n\n`INGEST`\
  \ 命令只有在到达源文件或管道末尾时才被认为完成。在任何其他情况下，Ingest 程序都认为命令执行不完全，这些情况包括：\n\n*   程序由于 I/O 错误无法读取输入文件。\n\
  *   关键 DB2 系统错误表明作业未按预期运行。\n*   `INGEST` 命令被杀掉或异常终止。\n\n如果 `INGEST` 命令失败，你可以通过重新发出带有\
  \ `RESTART CONTINUE` 子句的命令来重新启动。此时 Ingest 程序将从上一次提交点开始操作。\n\n\n\n\n\n如果你不想重启失败的任务，可以使用\
  \ `INGEST` 命令中的 `RESTART TERMINATE` 选项来终止它，以清除所有日志记录。\n\n## 监控摄取操作\n\n与其他 DB2 数据库实用一样，`Ingest`\
  \ 工具具有两个简单的命令来监控进度：\n\n*   `INGEST LIST`\n*   `INGEST GET STATS FOR <id>`\n\n这些命令必须在运行\
  \ `Ingest` 工具的同一机器上执行。命令语法和输出结果如下：\n\n![Image](img/658.jpg)\n\n`INGEST LIST` 命令显示\
  \ `Ingest job` 名称，如果未指定，DB2 将分配一个作业 ID（例如，`DB21001:20140808.135651.893482:00003:00012`）。运行\
  \ `INGEST GET STATS` 命令需要 `Ingest` 的 `temp job ID`：\n\n![Image](img/658-659.jpg)\n\
  \n如果你想以固定间隔持续监控摄取操作直到完成，可以运行以下 `INGEST GET STATS` 命令：\n\n![Image](img/659.jpg)\n\
  \n# 摄取性能调优技巧\n\n`Ingest` 工具使用多个线程并行运行摄取过程。你需要微调锁和事务日志数据库配置参数，以有效利用多线程并行架构。\n\n`locklist`\
  \ 和 `maxlocks` 参数对于加速摄取操作至关重要。如果你没有正确设置这些参数，可能会遇到性能问题，在某些情况下会收到 SQL0912N（数据库已达到最大锁请求数）错误。建议将这些参数设置为\
  \ `AUTOMATIC`，以让数据库管理器管理锁资源。\n\n定义摄取字段的数据类型为与目标表中对应列的类型类型相同。这可以特异地避免数据转换开销。始终建议了解你的工作负载和目标表。对于行大小较小的表，增加\
  \ `commit_count` 值；对于行大小较的表，在摄取参数设置中减小 `commit_count` 值。\n\n与 `Load` 不同，`Ingest`\
  \ 执行快速插入会产生许多事务日志。请务必检查工作负载和事务日志参数，如 `logprimary`、`logfilsz` 和 `logbufsz`。\n\n##\
  \ Ingest、Load 和 Import 工具的比较\n\n表 6.7 总结了 `Ingest`、`Import` 和 `Load` 工具之间的主要区别。\n\
  \n![Image](img/660.jpg)\n\n## Ingest 工具的局限性\n\n在使用 `Ingest` 工具时，请注意以下局限性：\n\n* \
  \  它仅支持针对 DB2 Linux、Unix 和 Windows 系统的摄取操作。\n*   它不支持对类型表（typed tables）、类型视图和 DGTT\
  \ 进行操作。\n*   它不支持对具有 BLOB、CLOB、LOB、DBCLOB、XML 或结构化或用户定义类型列的表操作。\n*   它不会为定义为 `GENERATED\
  \ ALWAYS` 的列分配值。\n*   它不会为定义为 `GENERATED BY DEFAULT AS IDENTITY` 的列分配默认值组合。\n* \
  \  `LIST HISTORY` 命令不显示摄取操作。\n*   无法使用 `UTIL_IMPACT_PRIORITY`。\n*   除了 `CURRENT\
  \ SCHEMA`、`CURRENT TEMPORAL SYSTEM_TIME` 和 `CURRENT TEMPORAL BUSINESS_TIME` 外，它不支持\
  \ DB2 特殊寄存器。\n\n## 其他 DB2 数据移动选项\n\nDB2 有许多其他功能可以在数据库内部及之间移动数据：\n\n*   使用 `SYSPROC.ADMIN_MOVE_TABLE()`\
  \ 过程移动在线或离线表。\n*   使用 `SYSPROC.ADMIN_COPY_SCHEMA()` 过程创建模式的副本。\n*   使用 `db2relocatedb`\
  \ 命令重定位数据库。\n*   使用 `db2move` 创建表或模式的副本并使用 `db2look` 命令提取 DDL。\n\n# SYSPROC.ADMIN_MOVE_TABLE\
  \ () 过程\n\n在过去（早在 DB2 9.7 ），由于存储特性需求的变化（例如更改特定表的区大小或更改特定表的表空间类型 SMS、DMS 或自动存储），将现有表从一个表空间移动到另一个需要几个步骤。你必须将数据导出到外部文件，在目标表空间中删除并重建表，然后用外部文件中存储的数据填充新创建表；或者在目标表空间上以不同的名称创建表，使用\
  \ `INSERT INTO… SELECT * FROM` SQL 语句复制数据并在最后重命名表。从 DB2 9.7 开始，你可以使用 `ADMIN_MOVE_TABLE()`\
  \ 过程轻松将表、索引、长数据和 LOB 数据从一个表空间移动到另一个表空间，因此不再需要手动 DBA 任务。\n\n此过程将存储在现有表中的数据移动到同名但可能定义在不同表空间的新表中。你还可以使用此过程更改表的\
  \ MDC（`ORGANIZE BY DIMENSION`）规范、更改 ITC（`ORGANIZE BY INSERT TIME`）规范、修改表的分区键（`DISTRIBUTE\
  \ BY HASH`）、更改表的范围分区（`PARTITION BY RANGE`）规范、从表中添加或删除列、更改列的数据类型，或为启用压缩的表创建新的字典。此外，在执行这些操作时表可以保持在线且可访问。\n\
  \n图 6.8 显示了 ADMIN_MOVE_TABLE 过程的不同阶段。\n\n![Image](img/662.jpg)\n\n*图 6.22: ADMIN_MOVE_TABLE\
  \ 阶段*\n\n*   **`INIT`**: 该阶段初始化操作所需的所有对象，包括用于捕获数据变化的临时表。\n*   **`COPY`**: 该阶段根据当前定义创建源表的副本并将数据复制到目标表。移动期间发生在源表上的任何\
  \ DML 操作都会被捕获到临时表中。默认情况下，目标表的所有索引在 `COPY` 阶段结束时创建。如果你想在数据拷贝之前创建索引，可以指定 `COPY_WITH_INDEXES`\
  \ 子句。\n*   **`REPLAY`**: 该阶段在交换源和目标表之前，将临时表中捕获的所有更改重放到目标表中。\n*   **`VERIFY`**: 这是一个可选阶段，在交换之前检查源表和目标表之间的内容以确保它们完全一致。此过程对源和目标表获取共享锁以进行比较。如果表具有唯一索引，此阶段将比较列之间的唯一索引值。否则，它将比较除\
  \ LONG、LOB 和 XML 列以外的所有列的值。这是一个消耗资源的操作，因此仅在绝对必要时使用。\n*   **`SWAP`**: 该阶段执行源表和目标表的交换。源表将短暂离线以完成\
  \ `REPLAY`。\n*   **`CLEANUP`**: 该阶段删除在线移动期间创建的所有中间表，例如临时表、任何非唯一索引和触发器。当在线表移动在 `SWAP`\
  \ 阶段失败时，也可以调用此阶段进行清理工作。\n\n\n\n\n\n当你调用 `ADMIN_MOVE_TABLE()` 过程时，系统会在指定的表空间中创建一个待移动表的副本（你也可以预先手动创建目标表）。该过程还会创建一个临时表和一组触发器，用于捕获在移动操作期间源表上发生的数据更改。随后，通过使用\
  \ `INSERT FROM CURSOR` 或 `LOAD FROM CURSOR` 将数据从源表复制到目标表。数据复制完成后，将在临时表中捕获的更改重放到到目标表上，以使其保持为最新状态。在此阶段，源表会短暂地离线以进行重命名。默认情况下，源表会被删除；但你也可以使用\
  \ `KEEP` 选项来保留并重命名它。\n\n`ADMIN_MOVE_TABLE()` 过程将移动被移动表上定义的任何索引、触发器、视图和约束。需要注意的是，该过程需要目标表和临时表额外的存储空间，并且由于需要触发触发器来捕获源表的数据更改，还需要额外的事务日志空间。\n\
  \n`ADMIN_MOVE_TABLE()` 过程的语法如下：\n\n![Image](img/663-1.jpg)\n\n或\n\n![Image](img/663-2.jpg)\n\
  \n| where: |\n| :--- | :--- |\n| `TableSchema` | 指定包含待移动表的模式（schema）名称，且区分大小写 |\n\
  | `SourceTable` | 指定待移动表的名称，且区分大小写 |\n| `TargetName` | 指定在移动过程中用作目标表的现有表名称 |\n|\
  \ `TargetDataTS` | 为目标表指定新的数据表空间 |\n| `TargetIndexTS` | 为目标表指定新的索引表空间 |\n| `TargetLongTS`\
  \ | 为目标表指定新的 LOB 对象表空间 |\n| `MDC_Columns` | 指定 MDC 和 ITC 表的维度列（dimension columns）；如果提供的值不以\
  \ ORGANIZE BY 开头，则将这些列视为 MDC 维度列；对于 ITC 表，值应为 ORGANIZE BY INSERT TIME |\n| `PartitionKeys`\
  \ | 指定目标表分区键的列名 |\n| `DataPartitions` | 指定目标表的范围分区规范 |\n| `ColumnDefs` | 指定目标表的新列定义，只要列类型与当前类型兼容，就可以更改更改列类型\
  \ |\n| `Options` | 指定存储过程使用的一个或多个选项；以下选项列表区分大小写：**• `KEEP` 以不同的名称保留原始源表的副本。**• `COPY_USE_LOAD`\
  \ 使用 `ADMIN_CMD()`（当你未指定 `COPY_USE_LOAD` 选项时）或通过 `db2Load` API 使用带有 `NONRECOVERABLE`\
  \ 选项的 `LOAD`（当你指定 `COPY_USE_LOAD` 时）。**• `COPY_WITH_INDEXES` 在将源表数据复制到目标表之前创建索引；然而，默认是在复制源表后创建索引。**•\
  \ `FORCE` 导致 `SWAP` 阶段忽略检查源表定义的更改。**• `NO_STATS` 不在目标表上启动 `RUNSTATS`。**• `COPY_STATS`\
  \ 将统计信息从源表复制到目标表。当表移动到具有不同页大小的表空间时，可能不准确。**• `NO_AUTO_REVAL` 防止自动重新验证对象（触发器、视图），并在表移动后创建它们。**•\
  \ `REORG` 在 SWAP 阶段之前对目标表执行离线 `REORG`。**• `NO_TARGET_LOCKSIZE_TABLE` 在 `COPY` 和\
  \ `SWAP` 阶段不在目标表上保留 `LOCKSIZE` 表选项。**• `CLUSTER` 通过使用源表上的 `ORDER BY` 子句来执行读取。**•\
  \ `NON_CLUSTER` 在不使用源表上的 `ORDER BY` 子句的情况下执行读取。**• `LOAD_MSGPATH` 指定加载消息文件路径。**•\
  \ `LOAD_TEMPPATH` 指定加载临时文件路径。**• `ALLOW_RLBAC` 移动指定了 LBAC 安全标签的表。 |\n| `Operations`\
  \ | 指定存储过程要执行的操作：**• `MOVE` 执行整个表移动（`INIT`、`COPY`、`REPLAY` 和 `SWAP`）。**• `INIT`、`COPY`、`REPLAY`、`VERIFY`、`SWAP`\
  \ 和 `CLEANUP` 的执行方式如图 6.22 所示。**• `REDIRECT` 直接将更改转发到目标表，而不是在临时表中捕获更改。**• `REVERT`\
  \ 回到原始行为，即由临时表捕获更改。**• `CANCEL` 在多个阶段之间取消多步骤表移动，或取消失败的表移动操作。 |\n\n正如过程语法所示，调用 `ADMIN_MOVE_TABLE()`\
  \ 过程有两种方法。你可以依赖该过程来创建目标表，也可以在对列进行必要更改的情况下创建目标表，例如添加新列或更改与源表列数据类型兼容的列数据类型。让我们通过示例来看每种技术。\n\
  \n在以下示例中，`ADMIN_MOVE_TABLE()` 过程将表 `MOHAN`.`EMP_PHOTO` 移动到不同的表空间，即数据的 `TS_SMALL_DATA`、索引的\
  \ `TS_SMALL_INDEX` 以及 LOB 列的 `TS_LOB_DATA`。调用和结果如下：\n\n![Image](img/665.jpg)\n\n\
  ![Image](img/666.jpg)\n\n`ADMIN_MOVE_TABLE()` 过程调用的结果记录在 `SYSTOOLS.ADMIN_TABLE`\
  \ 表中，你可以通过以下命令进行查询：\n\n![Image](img/667.jpg)\n\n`ADMIN_MOVE_TABLE()` 过程还可以将原始表移动到具有额外列的现有目标表：\n\
  \n![Image](img/668-1.jpg)\n\n`ADMIN_MOVE_TABLE()` 命令如下：\n\n![Image](img/668-669.jpg)\n\
  \n你现在可以在表中看到带有默认值的新列：\n\n![Image](img/669.jpg)\n\n然而，如果你在添加新列的同时带有 `NOT NULL` 等约束，`ADMIN_\
  \ MOVE_TABLE()` 过程将报告错误（SQL2105N 原因代码 30），要求为 `NOT NULL` 列定义默认值。\n\n可以使用 `SYSPROC.ADMIN_MOVE_TABLE_UTIL()`\
  \ 过程来修改在线移动表过程的属性。该过程语法为：\n\n![Image](img/670.jpg)\n\n\n\n\n\n| Key | 标识 `ADMIN_MOVE_TABLE`\
  \ 过程中用于 `UPSERT` 或 `DELETE` 的键 |\n| :--- | :--- |\n| `COMMIT_AFTER_N_ROWS` | 在 `COPY`\
  \ 阶段，插入或更新将在达到此记录数后进行提交。 |\n| `DEEPCOMPRESSION_SAMPLE` | 如果源表启用了压缩，则指定创建压缩字典时采样的数据量（单位\
  \ KB）。 |\n| `COPY_ARRAY_SIZE` | 指定 `COPY_ARRAY_INSERT` 的数组大小。 |\n| `COPY_INDEXSCHEMA`\
  \ | 指定在 `COPY` 阶段用于对目标表数据进行聚类的索引模式（schema）。 |\n| `COPY_INDEXNAME` | 指定在 `COPY` 阶段用于对目标表数据进行聚类的索引名称。\
  \ |\n| `REPLAY_MAX_ERR_RETRIES` | 指定在 `REPLAY` 阶段期间可能发生的错误（锁超时或死锁）的最大最大重试次数。 |\n\
  | `REPLAY_THRESHOLD` | 指定对于 `REPLAY` 阶段的单次迭代，如果应用到临时表的行数小于此值，则停止 `REPLAY`，即使在此产生了新条目。\
  \ |\n| `REORG_USE_TEMPSPACE` | 如果在表移动中调用了 `REORG` 选项，则允许为 `REORG` 命令的 `USE` 子句指定临时表空间。\
  \ |\n| `SWAP_MAX_RETRIES` | 指定 `SWAP` 阶段允许的最大重试次数。 |\n| Value | 标识键的实际值 |\n\n如果你想将提交计数值更改为\
  \ 20，请遵循以下步骤：\n\n**步骤 1:** 调用 `ADMIN_MOVE_TABLE()` 过程在 `INIT` 阶段复制 `EMPLOYEE` 表：\n\
