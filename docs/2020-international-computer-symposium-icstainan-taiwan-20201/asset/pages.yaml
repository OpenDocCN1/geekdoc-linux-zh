    Abstract—This paper investigates the real-time capabilities of Linux kernel and
    enhancements that remove some of the fundamental barriers to achieving latency
    potential. Both performance and schedability are considered for hard-time constraints,
    addressing the intersection of the two problem spaces: 1) maintain Linux kernel
    development and best-effort maintenance; 2) minimize scheduling overhead. Our
    approach using the PREEMPT_RT provides kernel capability and preemptibility, and
    the obtained results validate the real-time performance improvements with reasonably
    small changes.


