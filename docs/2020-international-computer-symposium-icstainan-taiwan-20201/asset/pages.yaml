    # IV. EXPERIMENT


    We performed experiments on 2 Cortex-A9 based boards, shown in Table I, adopted
    by industrial automation applications. Each test runs Linux kernel 44 and 4.PREEMPT
    [11] with minimal root file system. Our experience with binding kernel tuning
    techniques includes task isolation [12], tested feature of kernel L1 and L2 cache
    lockdown [14]. compared results with and without these techniques on NX+ iMX6
    Sabre. Measurement results are shown in Figure 2, 3, and 4, verifying the effectiveness
    of these tuning techniques and providing results as a baseline. We are able to
    reduce jitter with wakeup up to 15us and 17us. This shows that the default scheduler
    harms the real-time performance. This scheduling overhead could be separated into
    2 parts, scheduler overhead and cache contention on SMP. With L2 cache lockdown
    we are able to mitigate most of cache contention, but still retain some of jitter
    about 76us in max.


    ![](img/e0a93935afd7f6816e94f3b1e80fc509_1_2.png)


