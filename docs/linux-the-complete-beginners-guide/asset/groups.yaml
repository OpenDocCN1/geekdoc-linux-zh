    使用命令行提示符的一个优点是它使用的系统资源较少，并让你的计算机将更多精力集中在当前任务上。命令示例包括用于更改目录的 `cd` 命令、用于关闭系统的 `halt`
    命令，或用于重启电脑的 `reboot` 命令等。


    既然我们对 Linux 操作系统更加熟悉，我们可以注意到 Linux 与世界上最流行的操作系统微软 Windows（Microsoft Windows）之间的许多不同之处。从现在起，我们将讨论
    Linux 与 Windows 之间的一些最显著的区别。


    首先，只有一家公司发布 Windows 操作系统，那就是微软公司。所有的 Windows 版本，无论是 Windows XP 家庭版、业务版还是 Vista，所有的
    Windows 更新、安全补丁和服务程序补丁都来自微软。相比之下，Linux 并不是由某一家公司发布的。


    Linux 全范围内有数百万的编码人员和公司投入时间开发更新、新版本和软件应用程序。尽管有些公司对技术支持收费，另一些公司对其 Linux 发行版以及将其与非免费软件打包进行收费，但你始终可以免费获取
    Linux 内核，并且可以获得带有所有必要通用用途应用程序的全功能 Linux 桌面，同时也需要为了符合 GPL 许可协议而发布免费版本。相比之下，对于微软
    Windows，你必须向微软支付软件费用，并且还必须为你使用的大多数应用程序付费。


    Windows 和 Linux 在技术支持问题上也有不同。Windows 由微软公司支持，这意味着如果你对任何一个产品遇到问题，该公司都应该解决它。例如，如果
    Windows 无法运行，你应该能够致电微软并利用他们的技术支持来修复问题。技术支持通常包含在购买产品的一段时期内，可能是两年的期限，从那时起可能需要支付服务费。尽管
    IBM 支持他们的 Linux 产品，但对于大多数情况，如果你使用 Linux，你需要自力更生。如果你在 Ubuntu Linux 上遇到问题，你无法致电
    Ubuntu 并获得任何帮助。尽管缺乏专业帮助，但你仍然可以网络上的成千上万个 Linux 论坛获得良好的技术建议。你可以通过 Myspace 等社交网络网站，通过在许多
    Linux 群组中发布问题来获得巨大的帮助。你通常可以在几小时内收到许多合职人士对你问题的回复。


    可配置性是这两个操作系统之间的另一个关键区别。尽管 Windows 提供了控制面板帮助用户根据自己的喜好配置计算机，但它还没有 Linux 提供的配置选项，特别是如果你是一个真正的技术高明用户。在
    Linux 中，内核是开源的，所以如果你懂，你就可以以任何你认为合适的方式对其进行修改。此外，Linux 还提供了多种图形环境以进一步适应你的需求。如前所述，Linux
    能够运行全功能图形环境，如 KDE，或者更轻量且对资源友好的 GUI，如 Fluxbox 或 Black，以适应使用旧电脑的用户。此外还有某些 Linux
    版本设计用于尽可能模拟 Windows 的外观和操作体验。像 Linspare 这样的发行版最适合从 Windows 世界迁移过来的用户。


    还有一些完全不包含图形环境的发行版，以更好地适应那些需要为各种计算活动挤出所有计算能力的用户，以及那些比他人更进阶的用户。所有这些可配置性有时会带来问题，因为你必须决定哪个桌面适合你，并且为了让自己更轻松，你需要安装适用于你的发行版和图形环境的应用程序。


    （ref #1）Linux 的性价比是它与 Windows 区分开来的另一种方式。对于家庭使用，Linux 是廉价的且在大多数情况下完全免费的，而 Windows
    的成本取决于你购买哪个版本。对于 Linux，大多数应用程序也将是免费的，然而对于 Windows，在大多数情况下你必须为应用程序付费。在大多数情况下，使用
    Linux 进行安装时不需要输入产品激活密钥，你可以自由地在任意数量的计算机上安装。而 Windows 你只被允许在一台计算机上安装，微软使用产品激活软件来执行这一规则。


    安装 Windows 时，你必须输入产品激活密钥，该密钥在使用多次后会过期。如果你愿意，可以从不同的供应商购买 Linux，其中包含一套盒装 CD、手册和技术支持，价格大约在
    40-130 美元之间。当然，如果你购买用于服务器的高端 Linux 版本，费用可能在 400-2000 美元之间。在《2002年计算机世界杂志》中引用了纽约道信林公司首席技术架构师的话说：“运行
    Linux 的成本通常是运行 Unix 或 Windows 成本的十分。”（ref#1）


    （ref #1）安装 Windows 通常比安装 Linux 简单。“对于 Windows XP 有三种安装方法。一种是纯净安装，即在空白硬盘上安装 Windows。另一种是升级安装，你从旧版本的
    Windows 开始并‘升级’到新版本。升级的优点是旧系统上的所有文件都应该保持完好。”


    Windows 和 Linux 在许多情况下也是不同的。在 Linux 之后，你可能会发现许多在 Windows 上运行的软件在 Linux 上无法运行，或者反之。由于
    Linux 的开源特性，许多软件是由于社区开发的，而 Windows 软件通常是闭源的。这意味着 Linux 用户可能需要花费更多时间来寻找替代方案。

