    # 7 Steps to Install Linux on a New Computer System


    ## 1. Document Your Linux Installation Settings


    During the Linux installation, you need to specify some system settings. These
    include: the Linux software programs and desktop(s) you want installed, networking
    settings, and disk partition sizes.


    ## 2. Boot with the Linux CD or DVD and Start the Linux Installation Routine


    The steps to set up your system to boot from its CD or DVD drive.


    Shut down your system and boot it with the first Linux CD / DVD in the drive and
    start the Linux installation routine.


    ## 3. Specify Your Linux Installation Settings


    Follow the on-screen prompts and put in the installation settings you documented
    in Step 1.


    ## 4. Create a Regular (“Non-root”) User


    You log in to work on a Linux system as a “user”, with a user name and password.
    You can log in as the “root” user, or as a “non-root” user.


    You log in and work on the Linux OS as the root user when you need to do Linux
    system administration tasks. For example, you work as the root user to run a Linux
    command to create a new Linux user, or to do the steps to install a Linux server.


    When you install Linux, the root user is always created automatically for doing
    Linux system administration tasks. However, for security reasons, you should never
    log in to a Linux desktop as the root user.


    At some point during the installation routine, you will be asked if you want to
    create one or more “regular” (non-root) Linux users. Always create at least one
    regular Linux user and log in as this user to do day-to-day tasks.


    ## 5. Let the Linux OS Install on Your Hard Disk


    After you specify the Linux installation settings and create one or more new Linux
    users, the installation routine will copy the Linux OS and Linux software programs
    onto the hard disk in the system, and then reboot.


