    ## How to Use Linux Command Line Components


    Linux Commands - The great thing about Linux commands is that they are virtually
    identical from one Linux distribution (version) to another. So the way the real
    pros do Linux administration is to work at the Linux command line and run Linux
    commands.


    Learning how to run a Linux command can be very difficult for someone new to Linux,
    so here are some Linux tips that will help you to learn how to use Linux commands
    when working at the Linux command prompt.


    There are three main parts of a Linux command:


    - 1. The Linux command name

    - 2. Options that can be used with the Linux command

    - 3. The “item(s)” that the Linux command is being run “on”


    When you run a Linux command, spaces are used between: the Linux command name,
    the command options and the “item” command is being run “on”. The “item” could
    be a Linux directory, file, user or some other Linux software component.


    For example, you run the Linux command named ls (for list) “on” a Linux directory
    to see a list of files in the directory. You run the Linux command named rm (remove)
    “on” a Linux directory to remove the directory from the Linux file system.


    To run a Linux command, you type in the name of the command, and any other parts
    of the command, such as options, and press the Enter key.


    You can see an example of the Linux command that is used to create a new Linux
    user below. The useradd command is being run “on” the bthatcher user name to create
    this Linux user.


    **Linux Tips:** Linux commands are run at the Linux command line prompt and this
    is shown as # at the left of the command. You don’t type in the prompt, you type
    the Linux command at the right of the prompt.


    **Linux Tips**: The Linux command prompt may also appear as: $ or as another symbol,
    instead of # or $.


    ```bash

    # useradd -c "Becky Thatcher" bthatcher

    ```


    This Linux command creates a new Linux user named bthatcher with the full name
    of “Becky Thatcher”. The -c (for comment) option is used with this command to
    add the full name as a comment to the Linux user of bthatcher.


