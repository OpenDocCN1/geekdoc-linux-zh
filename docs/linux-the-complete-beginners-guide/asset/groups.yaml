    在 Linux 安装过程中，你需要指定一些系统设置。这些包括你想要安装的 Linux 软件程序和桌面、网络设置以及磁盘分区大小。


    ## 2. 使用 Linux CD 或 DVD 启动并开始 Linux 安装程序


    以下是设置系统从 CD 或 DVD 驱动器启动的步骤。


    关闭系统，并在驱动器中插入第一张 Linux CD / DVD 启动系统，然后开始 Linux 安装程序。


    ## 3. 指定你的 Linux 安装设置


    按照屏幕上的提示，输入你在第 1 步中记录的安装设置。


    ## 4. 创建普通（“非 root”）用户


    你以“用户”身份登录并在 Linux 系统上工作，并拥有用户名和密码。你可以以“root”用户身份登录，也可以以“非 root”用户身份登录。


    你需要执行 Linux 系统管理任务时，以 root 用户身份登录并在 Linux 操作系统上工作。例如，以 root 用户身份运行 Linux 命令来创建一个新的
    Linux 用户，或执行安装 Linux 服务器的步骤。


    当你安装 Linux 时，系统会自动创建 root 用户以执行 Linux 系统管理任务。然而，出于安全考虑，你永远不要以 root 用户身份登录 Linux
    桌面。


    在安装过程的某个阶段，系统会询问你是否想要创建一个或多个“普通”（非 root）Linux 用户。请务必至少创建一个普通 Linux 用户，并以此用户身份登录执行日常任务。


    ## 5. 让 Linux 操作系统安装在你的硬盘上


    在指定 Linux 安装设置并创建一个或多个新 Linux 用户后，安装程序会将 Linux 操作系统和 Linux 软件程序复制到系统的硬盘上，然后重启。


    ## 6. 登录并测试系统


    系统重启后，以“普通”（非 root）Linux 用户身份登录，测试你是否可以以此用户身份工作。此时，Linux 桌面将会会出现，你可以运行 Linux 程序来测试系统。


    **Linux 提示：** 记住不要以 root 用户身份登录 Linux 桌面。


    通过以普通 Linux 用户身份登录并打开终端仿真窗口来测试 root 用户。然后运行 `su` 命令登录并以 root 用户身份工作。


    ## 7. 尽情享受吧！


    Linux 操作系统是一个奇妙且极其可靠的系统。有成千上万个 Linux 软件程序用于各种用途。


    通过安装和运行 Linux，你可以在操作 Linux 时获得很多实用的 Linux 训练经验。你可以在 Linux 桌面工作并运行常用的 Linux 软件程序。你也可以在
    Linux 命令行工作，学习如何使用 Linux 命令——这是真正的专业人士管理 Linux 系统采用的方法。


    # Linux 快速上手 - 如何使用 CD 中的 Linux 视频教程并在 Windows 中运行 Linux


    Linux 视频教程是入门学习如何使用 Linux 的极佳、简单且快速的方法。


    在 Windows 中运行 Linux - 这样你就可以学习如何在 Windows 中使用 Linux！


    你可以下载一个免费的 Linux 虚拟机“播放器”和一个免费的 Linux 虚拟机，这样你就可以在 Windows 中运行 Linux。


    只需像安装任何 Windows 程序一样，下载并快速安装免费的 Linux 虚拟机播放器。这大约需要二十分钟。


    然后下载一个免费的 Linux 虚拟机，并将虚拟机文件解压到 Windows 硬盘上的一个文件夹中。不包括下载时间，这大约需要十分钟。


    有一份免费的示例 Linux 视频教程展示了如何执行每一个步骤：下载免费的 Linux 虚拟机播放器和免费的 Linux 虚拟机，这样你就可以轻松地在 Windows
    中运行 Linux。


    **Linux 提示：** 许多流行的 Linux 发行版（版本）都有数百个免费 Linux 虚拟机可以下载，包括 Ubuntu Linux、Debian
    Linux、Red Hat Linux、Fedora Linux、SUSE Linux 等！


    接下来，运行虚拟机播放器并打开虚拟机，就像你运行文字处理器并打开文档一样——你就能轻松地在 Windows 中获得 Linux！


    现在，你已经在 Windows 的一个“窗口”中运行了 Linux。你可以从 Linux 桌面运行 Linux 软件程序，还可以打开终端仿真窗口进入 Linux
    命令行提示符，运行 Linux 命令。


