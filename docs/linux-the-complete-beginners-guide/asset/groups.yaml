    # 如何获得 Red Hat Linux 认证


    ### 为什么我应该获得 Linux 认证？


    嗯，你可能提出的第一个问题是为什么要获得 Linux 认证？这个问题的答案与获得一般的认证类似。它通过测试并通过最低知识标准，帮助证明你在 Linux 操作系统方面的知识。


    它还可以帮助你在该行业中找到工作。许多工作需要 Linux 认证，例如 Linux 管理员或通用服务器管理员。它还能够充丰富你现有的 Linux 知识，你可以将其应用于当前的工作。


    ### 我应该获得哪种 Linux 认证？


    这本身就可以单独成篇文章 - 但会将所有信息包含在这里，方便查阅。


    Linux 认证有四家主要供应商，它们都为不同的级别提供系列不同的认证。


    #### Novell


    他们提供一系列认证，标签为工程师（Engineer）、专业人士（Professional）和桌面管理员（Desktop Administrator）。


    - *认证 Linux 工程师 11 (CLE 11) - 为基于 SUSE Linux Enterprise Server 的大型系统提供面向管理人员和架构师的工程师级技能。你需要通过认证
    Linux 专业人士 11 才有资格参加此。

    - *认证 Linux 管理员 11 (CLA 11) - 一项新认证，专注于 SUSE Linux Enterprise Server 网络的日常操作。

    - *认证 Linux 桌面管理员 (CLDA) - 针对拥有 Windows 桌面经验并希望学习 SUSE Linux Enterprise Desktop
    的人员。

    - *认证 Linux 专业人士 11 (CLP 11) - 提供管理 SUSE Linux Enterprise Server 所需的技能。


    #### CompTIA


    - CompTIA 只提供一种 Linux 认证，即 Linux+。

    - Linux+ - 为希望进入 Linux 领域的人士提供的入门级认证。厂商中立。


    #### Linux Professional Institute


    - Linux Professional Institute（又称为 LPI）提供几种 Linux 认证。

    - Linux Professional Institute 认证级别 1 (LPIC-1) - 一项初级 Linux 认证，测试主流 Linux 发行版中的基础技能。

    - Linux Professional Institute 认证级别 2 (LPIC-2) - 一项高级 Linux 认证，包含管理技能。参加此项需要通过
    LPIC-1。

    - Linux Professional Institute 认证级别 3 (LPIC-3) - 针对主流 Linux 发行的高级 Linux 认证，提供多个专业领域。参加此项需要通过
    LPIC-2。


    #### Red Hat


    - Red Hat 为其 Linux 发行版提供几种认证。

    - Red Hat 认证系统管理员 (RHCSA) - 较低级别的 Linux 认证，涵盖了管理的基础知识。

    - Red Hat 认证工程师 (RHCE) - 更高级的 Linux 认证，面向经验丰富的 Linux 专业人士。此认证要求通过 RHCSA。

    - * Red Hat 认证虚拟化管理员 (RHCVA) - 专注于在 Linux 环境中部署虚拟主机。

    - * Red Hat 认证安全专家 (RHCSS) - 专注于 Linux 的安全功能。

    - * Red Hat 认证数据中心专家 (RHCDS) - 专注于管理和支持数据中心环境的要求。

    - Red Hat 认证架构师 (RHCA) - Red Hat 认证最高级别，专注于 Linux 管理和使用的专家课题。


    所以，关于应该获得哪种 Linux 认证的答案是？


    这取决于你的经验和需求。如果你正在入门，有几种初级 Linux 认证（Linux+, RHCSA, LPIC, CLE11）可能很有用。


    如果你有更多经验，如 RHCE、LPIC-2、CLA11 和 CLP11 等更高级的认证可能会有利。如果你是 Linux 领域的资深人士，我会考虑 RHCA
    或 LPIC-3。


    然而，本电子书的这一专注于 Red Hat 认证，因此我们将在本文中介绍如何获得 Red Hat Linux 认证。


