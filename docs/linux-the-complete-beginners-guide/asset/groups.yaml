    With Linux on the other hand, problems with viruses are practically non-existent,
    and in reality you do not need virus protection for your Linux machine. One reason
    why viruses and spy-ware are not a problem for Linux is simply due to the fact
    that there are far more than Linux. A more important reason is that running a
    virus on a Linux machine is more difficult and requires a lot more from the user.
    With Windows you might accidentally run a virus, by opening an email attachment,
    or double clicking on a file that contains malicious code. However with Linux
    a virus would need to run in the terminal, requires the user to execute file permissions,
    and then open it in the terminal.


    And in order to cause any real damage to the system the user would have to log
    in as root, by typing a user name and password before running the virus.


    For example, to run a virus that is embedded in an email attachment the user would
    have to, open the attachment, save it, then right click the file and choose properties
    from the menu, in properties they can give execute permissions, they would then
    be able to open the file in the terminal to run the virus. And even then the user
    would only be able to damage his or her home folder, all other users data will
    be left untouched, and all root system files would also remain untouched, because
    Linux requires a root password to make changes to these files.


    The only way the user can damage the whole computer would be if he so logged as
    root user by providing the root user name and password to the terminal before
    running the virus. Unlike Windows in Linux an executable file cannot run automatically,
    It needs to be given execute permissions manually this significantly improves
    security. In Linux the only realistic reason you would need virus protection is
    if you share files with Windows users, and that is to protect them not you, so
    you are not to accidentally pass a virus to the Windows computer that you are
    sharing with.


    The above was a general over of some differences between the Windows operating
    system, and Linux. To recap we started with the fact that Windows has only one
    vendor that releases the software, while Linux comes from millions of different
    coders throughout the world. We also commented on the fact that the Linux Kernel
    and much of the applications used with it are completely free of charge, with
    as as you are forced to pay for most of the software. Unlike Windows is often
    lacking in professional Tech support, and Linux users are often left on their
    own or rely on the many Linux Forums and groups available on the Internet. Due
    to the fact that the kernel is open source, Linux has a huge advantage over Windows
    in configurability. You can configure Linux to run almost any way you see fit
    by manipulating the Kernel.


    Installing the Windows Operating system and applications is easier by the fact
    that it has a universal installer. Also finding applications for Windows is easier
    because of its popularity most apps are available for Windows only, and are made
    easily available. Linux will run on a greater variety of hardware than does Windows,
    from mainframe super computers running multiple IBM Power PC Chips, to a small
    laptop running an AMD processor. And of course the difference in this writer''s
    opinion is the fact that Linux does not suffer from an onslaught of Viruses and
    other malicious code, unlike Windows which is plagued by countless number of malicious
    code that can easily destroy your system if not properly guarded against.


    Linux OS really is the superior software. Other than a few minor nuisances, linux
