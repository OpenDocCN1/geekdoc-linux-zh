- md: '

    An advantage of using the command prompt is it uses less system resources and
    enables your computer to focus more of its energy on the task at hand. Examples
    of commands include the cd command for changing your directory, or the halt command
    for shutting down your system, or the reboot command for restarting your computer
    etc.


    Now that we are more familiar with the Linux operating system, we can note the
    many ways in which Linux differs from the world''s most popular OS, Microsoft
    Windows. From this point forward we will discuss some of the most prominent ways
    in which Linux differs from Windows.


    For starters there is only one company that releases a Windows operating system,
    and that company is Microsoft. All versions of Windows, whether Windows XP Home,
    Business, or Vista, all updates, security patches, and service patches for Windows
    comes from Microsoft. With Linux on the other hand there is not one company that
    releases it.


    Linux has millions of coders and companies throughout the world your time to work
    on updates, newer versions, and software applications. Although some companies
    charge for TECH support, and others charge for their distribution of Linux, packaging
    it with non-free software, you will always be able to get the Linux Kernel for
    free, and you can get full-featured Linux desktops with all the necessary applications
    for general use, as well required to release a free version in order comply with
    the GPL License agreement. With Microsoft Windows on the other hand you have to
    pay Microsoft for the software, and you will also have to pay for most of the
    applications that you will use.


    Windows and Linux also differ on TECH support issues. Windows is backed by the
    Microsoft Corporation, which means that if you have an issue with any of your
    products the company should resolve it. For example if Windows is not working,
    then you should be able to call Microsoft and make use of their TECH support to
    fix the issue. TECH support is usually included with the purchase of the product
    for a certain amount of time, maybe a two year period, and from there on you may
    be charged for the service. Although IBM backs their Linux products, for the most
    if you use Linux you are on your own. If you have a problem with Ubuntu Linux
    you cannot call Ubuntu and expect any help. Despite the lack of professional help,
    you can however receive good TECH advice from the thousands or millions of Linux
    forums are on the web. You can get great help from social networking sites such
    as Myspace, by posting questions in many Linux groups. You can usually receive
    responses for your questions a matter of hours from many qualified people.


    Configurability is another key difference between the two operating software’s.
    Although Windows offers its control panel to help users configure the computer
    to their liking, it does not match the configuring options Linux provides especially
    if you are a real TECH savvy user. In Linux the Kernel is open source, so if you
