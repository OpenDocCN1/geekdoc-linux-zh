    **SUSE（苏萨 Linux）**：来自德国的“变色龙”——SUSE。现在处于 8.x 版本，它拥有编译最广泛的软件包集合之一，通过 `ya`（另一个软件工具）可以轻松地安装它们，该工具提供了一个集中界面，你可以在从中挑选并选择要安装的软件。除其他外，SUSE
    还带了一些惊艳的 3D 游戏，展示了 Linux 的游戏实力。


    **Corel/Xandross**：Corel 几年前带着 Core Linux 进入市场。现在它已合并为基于 Core Linux 的 Xandross
    OS。这是一个 Debian 类型的版本，在调整 Windows 分区大小后可以无需麻烦地安装。Xandross 包含了 Crossover office，它是
    WINE 的精简零售版，让你能够安装和运行许多微软应用程序。


    ## Linux 中的 Windows 应用程序


    某些应用程序已移植到 Linux，另一些通过一个名为 WINE 的程序运行（Wine 并不是模拟器）。Crossover 这种市用软件也让你让你在 Linux
    上使用你的 Windows 程序。VMware 是另一个让你在 Linux 下运行 Windows 的程序。现在，许多软件公司已开始为 Linux 开发高端软件。


    Linux 的酷之处在于，大多数软件都是免费的，你可以合法地使用它们而不必担心盗版。如果你担心 Linux 看起来不像 Windows 漂亮，你只需要查看一些酷炫的
    Linux 界面和窗口管理器即可。但 Linux 上并没有很多多媒体作品。如果你非常喜欢这些，那么 Windows 是不二之选。所以如果你有一台同时运行这两个系统的
    PC，你可以轻松地在两者之间切换，兼两者之长。


    ## Linux 与 Windows 的区别


    本子主题将讨论 Linux 和 Windows 操作系统之间的区别，我将讨论每个系统的优缺点。


    让我们先从 Linux 操作系统的总体概览开始。Linux 最基本的形式是一个计算机内核。内核是底层的计算机代码，用于与硬件以及其他系统软件通信，它还运行计算机的所有基本功能。


    Linux 内核是一个操作系统，运行在各种硬件上并用于各种目的。Linux 能够运行在像手表或手机一样简单的设备上，也可以运行在家用电脑上（例如 Intel
    或 AMD 处理器），它甚至在使用 Sun Sparc CPU 或 IBM POWER 处理器的高端服务器上运行。许多 Linux 发行版只能运行一个处理器，而另一些可以同时运行多个。


    Linux 的常见用途包括家庭桌面计算系统，或者更常见的服务器应用程序，例如作为 Web 服务器或邮件服务器。你甚至可以将 Linux 用作专用防火墙，帮助保护同一网络上的其他机器。


    一位名为 Linus Torvalds 的程序员在 1991 年首次创建了 Linux，作为 Unix 操作系统的变体。Linus Torvalds 通过
    GNU（通用公共许可）使 Linux 开源，这样其他程序员就可以免费下载源代码并根据自己的意愿进行修改。世界上数千名程序员开始下载和修改 Linux 的源代码，应用补丁、修复错误和其他改进，使该操作系统变得越来越好。多年来，Linux
    从一个简单的基于文本的 Unix 克隆演变成了强大的操作系统，具有功能全桌面环境、前所未有的移植性以及多种用途。大多数原始 Unix 代码在多年来也逐渐从
    Linux 中移除了。


    由于 Linux 是开源软件，并没有单一的 Linux 版本；相反有许多不同的 Linux 版本或发行版，适用于各种用户和任务。某些 Linux 发行版包括
    Gentoo 和 Slackware，由于缺乏完整的图形环境，它们最适合 Linux 专家、程序员以及熟悉命令行提示符的用户。缺乏图形环境的发行版最适合缺乏处理图形所需计算能力的旧电脑，或者用于正在执行密集型任务的计算机，在这些情况下，最好将所有系统资源都集中在手头任务上，而不是通过处理图形来浪费资源。


    其他 Linux 发行版旨在让计算体验尽可能简单。如 Ubuntu、Linspike 等发行版让 Linux 变得更易用，提供了功能全图形环境，消除了对命令行的需求。易用性的缺点是可配置性较低，并且在图形处理上浪费了系统资源。其他发行版如
    S 试图在易用性和可配置性之间寻找平衡点。


    Linux 有两个部分，它们包括前面提到的内核，在大多数情况下它还会包含一个图形界面，运行在“内核”之上。


    大多数 Linux 发行版都提供图形界面以简化用户体验，它们都为更有技术背景的用户提供了一种通过 shell 或命令行直接与内核通信的方式。


    '
