    ## Hardware compatibility problem and few applications that run on Linux


    Well, most new distributions will detect and configure your hardware in a jiffy,
    unless you have some really old or exotic piece of hardware. All hardware are
    properly detected and their drivers installed. Only Win modems driven by Windows
    drivers face problems.


    As software, there''s plenty. And most of it comes free-free for you to use, modify
    and configure according to your needs. Almost excellent software for Linux is
    free and you don''t lose anything by giving it a try. You get free support on
    the Net quickly on any q query you may have. And you don''t even have to wipe
    out your Windows. Just get Linux on a different hard disk partition and to switch
    between them as you please.


    Other packages are commercial and you have to buy the software-but this is mostly
    for the software and training you, and not for the software itself. Sometimes,
    if you have the Windows version (as a game) you can download a small program that
    will allow you to play the game in Linux. The games in Linux are of very high
    quality and features. You''ll enjoy them. Here''s what available?


    - Office suites: Star Office, Open Office, Applixware, Corel WordPerfect

    - Graphics: GIMP, Corel Photo player

    - Music: XMMS, Free amp, Real Player

    - Video: MTV, Xine

    - Games: FreeCiv, Tux racer, Doom, Quake, Heretic, Unreal And the list is growing.


    ## Linux varieties for Home Users:


    If there are so many people working on it. There''s likely to be many Linux versions
    too. Many companies working on Linux have come up with what are called Linux distributions.
    There are Linux versions that are compiled and packaged and released with additional
    software.


    **RedHat**: Probably the most popular and in many ways the leading version. It''s
    currently in version 9. The installation and configuration is easy. A blue curve
    file manager and the default GNOME desktop look quite stunning. With a host of
    tools that allow usage as a server and as a workstation. The Red Hat Package Manager
    (RPM) format developed by Red Hat has become the default for software distribution
    in Linux world. Installing new software is a breeze. It also has an advanced and
    easy font management system that makes fonts in Windows look cool.


    **Mandrake**: Linux is now in its version 10. It can be installed on a native
    Windows Partition using LinuxWin tool, which may slow down the machine. It also
    lets you do a traditional Linux install into its dedicated partition. Mandrake''s
    configuration and software installation is painless. A slightly modified RPM architecture
    called mdk.rpm but most Red Hat software can also be used for Mandrake. The outstanding
    feature in this version is the collection of window managers-eye-candy freaks
    which will have a great time.


    **SUSE**: From Germany comes the Chameleon, SUSE. Now in its 8.x avatar, it has
    one of the most extensive software packages compiled, and getting them installed
    is easy with ya (Yet another Software Tool) which gives a centralized interface
    from where you can pick and choose the software to be installed. Among other things,
    SUSE comes with some stunning 3D games that showcase Linux gaming prowess.


    **Corel/Xandross**: Corel entered the market with Core Linux a few years ago.
    Now it has merged into Xandross OS, which is based on Core Linux. This is a Debian-type
    version, and can be installed without much fuss after resizing the Windows partition.
    Xandross contains Crossover office, which is a refined retail version of WINE
    that lets you install and run many Microsoft apps.


    ## Windows applications in Linux


    Some applications have been ported over to Linux, other run with a program called
    WINE (Wine is Not an Emulator). Crossover, commercially available software also
    lets you use your Windows programs on Linux. VMware is another program that lets
    you run Windows under Linux. Now many software companies have started developing
    high end software for Linux.


    The cool thing about Linux is that most software is free, and you can legitimately
    use them without worrying about piracy. If you’re worried that Linux won’t look
    as pretty as windows can, all you have to do is check out some of the cool Linux
    interfaces and Window managers. But you don’t find a lot of multimedia titles
    for Linux. And if you’re into a lot of these, Windows is in the way to go. So
    if you have a PC that runs both, you can easily switch between the two, and get
    the best of both worlds.


    ## Differences Between Linux And Windows


    This sub-topic will discuss the differences between the Linux and Windows operating
    software’s, I’ll discuss some of the pro’s and con’s of each system.


    Let us first start out with a general overview of the Linux operating system.
    Linux at its most basic form is a computer kernel. The Kernel is the underlying
    computer code, used to communicate with hardware, and other system software, it
    also runs all of the basic functions of the computer.


    The Linux Kernel is an operating system, which runs on a wide variety of hardware
    and for a variety of purposes. Linux is capable of running on devices as simple
    as a wrist watch, or a cell phone, but it can also run on a home computer, for
    example Intel, or AMD processors, and its even capable of running on high end
    servers using Sun Sparc CPU’s or IBM POWER processors. Thousands of Linux distro’s
    can only run one processor, while others can run many at once.


    Common uses for Linux include that of a home desktop computing system, or more
    commonly for a server application, such as use as a web server, or mail server.
    You can even use Linux as a dedicated firewall to help protect other machines
    that are on the same network.


    A programmer named Linus Torvalds first made Linux in 1991 as a variant of the
    Unix operating system. Linus Torvalds made Linux open source with the GNU (General
    Public License), so other programmers could download the source code of free and
    alter it whatever they see. Thousands of coders that the world began downloading
    and altering the source code of Linux, applying patches, and bug fixes, and other
    improvements, to make the OS better and better. Over the years Linux has gone
    from a simple text based clone of Unix to to powerful operating system, with full-featured
    desktop environments, and unprecedented portability, and a variety of uses. Most
    of the original Unix code has also been gradually written out of Linux over the
    years.


    As a result of Linux being open source software, there is no one version of Linux;
    instead there are many different versions or distributions of Linux, that are
    suited for a variety of different users and task. Some Distributions of Linux
    include Gentoo, and Slackware, due to the lack of a complete graphical environment
    is best, suited for Linux experts, programmers, and other users who know their
    way around a command prompt. Distributions that lack a graphical environment are
    best suited for older computers lacking the processing power necessary to process
    graphics, or for computers performing intensive task, where it is desirable to
    have all of the system resources focused on the task at hand, rather than wasting
    resources by processing graphics.


    Other Linux distributions aim at making the computing experience as easy as possible.
    Distributions such as Ubuntu, Linspike make Linux easier to use, offering full-featured
    graphical environments that eliminate the need for a command prompt. Of the downside
    of ease of use is less configurability, and wasted system resources on graphics
    processing. Other distributions such as Suse try to find a common ground between
    ease of use and configurability.


    Linux has two parts, they include include the Kernel mentioned previously, and
    in most circumstances it will also include a graphical interface, which runs atop
    the "Kernel" reference #3. In most cases the user will communicate with the computer
    via the graphical interface. (ref #6) Some of the more common graphical environments
    that can run on Linux the following. The KDE GUI (Graphical user interface).


    Matthias Ethric developed KDE in 1996. He wanted a GUI for the Unix desktop that
    would make all of the applications look and feel alike. He also wanted a desktop
    environment for Unix that would be easier to use than the ones available at time.
    KDE is a free open source project, with millions of coders working on the world,
    but it also has commercial support from companies such as Novell, Troltech, and
    Mandriva. KDE aims to make an easy to use desktop environment without sacrificing
    configurability. Windows users might note that KDE has a similar look to Windows.
    Another popular GUI is (ref #7) GNOME. GNOME puts a heavy emphasis on simplicity,
    and user ability. Much like KDE GNOME is open source and free to download. One
    feature of GNOME is the fact that it supports many different languages; GNOME
    supports over 100 different languages. Gnome is license under the LGPL license
    (lesser general public license). The license allows applications written for GNOME
    to use a much wider set of licenses, including some commercial applications. The
    name GNOME stands for GNU Network object environment. GNOME’s look and feel is
    similar to that of other desktop environments. Fluxbox is another example of a
    Linux GUI. With less of an emphasis on ease of use and eye candy, Fluxbox aims
    to be a very lightweight, and more efficient user of system resources. The interface
    has only a taskbar and a menu bar, which is accessed by right clicking over the
    desktop. Fluxbox is most popular for older computers that have a limited abundance
    of system resources.


    Most Linux distributions offer a graphical environment, to simplify the user experience,
    they all offer a way for more technically involved users to directly communicate
    with the Kernel via a shell or command line.

    '
