    Linux 命令”——教程就会在浏览器（Windows 内）中运行。


    现在，你已经在浏览器中运行了一个 Linux 视频，同时在另一个窗口中运行了 Linux。


    # 在 Windows 中学习 Linux 以亲自获得真实的实战经验！


    现在是关于 Windows 中运行 Linux 进行训练的最棒部分。


    你不仅可以观看 Linux 视频来看到和听到如何使用 Linux，还可以使用 Linux 桌面运行 Linux 软件程序，最点重要的是——运行 Linux
    命令！


    只需启动一个 Linux 视频，例如“如何运行 Linux grep 命令”，并观察它是如何运行该命令的——一步一步来。然后点击暂停按钮。


    按住 Alt 键（键盘上空格键左侧）并按 Tab 键，进入 Linux 窗口中的 Linux 命令行提示符。


    现在尝试你刚刚看到的 Linux 命令——实验一下！


    然后按住 Alt 并按 Tab 回到 Linux 视频窗口，看一看视频并学习该命令的更多选项。


    再次按 Alt+Tab 回到 Linux 窗口中的命令行提示符，并尝试新的 Linux 命令选项。以此类推。


