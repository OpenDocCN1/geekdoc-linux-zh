    ## 如何使用 Linux 命令行组件


    Linux 命令 - Linux 命令的伟大之处在于，它们在不同的 Linux 发行版（版本）之间几乎是完全相同的。因此，真正的高手进行 Linux 管理的方法是在
    Linux 命令行界面下运行 Linux 命令。


    对于 Linux 初手学者来说，学习如何运行 Linux 命令可能非常困难，因此这里有一些 Linux 技巧，可以帮助你在 Linux 命令行提示符下学习如何使用
    Linux 命令。


    一个 Linux 命令主要由三个部分组成：


    - 1. Linux 命令名称

    - 2. 可用于 Linux 命令的选项（Options）

    - 3. Linux 命令所运行的“项目(items)”


    当你运行 Linux 命令时，Linux 命令名称、命令选项以及命令运行的“项目”之间会使用空格隔开。“项目”可以是 Linux 目录、文件、用户或其他 Linux
    软件组件。


    例如，你运行名为 `ls`（list，列表）的 Linux 命令作用于一个 Linux 目录，以查看该目录下的文件列表。你运行名为 `rm`（remove，删除）的
    Linux 命令作用于一个 Linux 目录，将该目录从 Linux 文件系统中删除。


    要运行 Linux 命令，你输入命令名称以及命令的其他任何部分（如选项），然后按回车键（Enter）。


    下面你可以看到创建一个新 Linux 用户的 Linux 命令示例。`useradd` 命令作用于 `bthatcher` 用户名，以创建此 Linux 用户。


    **Linux 技巧：** Linux 命令在 Linux 命令行提示符下运行，通常显示为命令左侧的 `#`。你不需要在提示符处输入，而是在提示符的右侧输入
    Linux 命令。


    **Linux 技巧**：Linux 命令行提示符也可能显示为 `$` 或其他符号，而不是 `#` 或 `$`。


    ```bash

    # useradd -c "Becky Thatcher" bthatcher

    ```


    这条 Linux 命令创建了一个名为 `bthatcher` 的新 Linux 用户，全名为“Becky Thatcher”。`-c`（comment，注释）选项用于此命令，以便将全名作为注释添加到
    Linux 用户 `bthatcher` 中。


    获取 Linux 训练最简单、最好的方法之一是在 Linux 视频教程中查看 Linux 命令的运行。通过这种方法——你可以看到、听见并亲身实践。


    通过 Linux 视频教程，你可以看到并听到如何运行 Linux 命令，并看到和听到对命令输出结果的描述。你还可以暂停视频，以便亲自运行 Linux 命令！


    ## 运行 Linux 以获得真实经验


    通过实际操作 Linux 获取实践经验是学习 Linux 的最佳方式。通过使用 Linux 桌面、运行 Linux 程序，特别是运行 Linux 命令——这才是
    Linux 管理背后的真正力量。


    ## 获取 Linux 运行以获得 Linux 训练的 5 种


    - 1. 在新电脑上获取“预装”的 Linux


    这是开始使用 Linux 最简单的方法之一。现在几家主要零售商已在其计算机系统中提供预装的 Linux。只需购买、启动并开始使用即可！


    - 2. 在没有 Windows 的系统上安装 Linux


    你可以从 CD 或 DVD “从零开始”，将 Linux 安装到尚未安装任何操作系统（如 Windows）的新系统或旧系统上。


    - 3. 在 Windows 系统上安装 Linux


    如果你不想为 Linux 专门购买一台新的或旧的系统，可以在现有的 Windows 系统上安装 Linux。当你这样做时，你就创建了一个“双系统”（Linux
    和 Windows）系统。


    在你安装 Linux 并启动系统后，会出现一个菜单，允许你进入 Windows 或进入 Linux！


    在这种情况下，你不需要为了 Linux 专门买电脑。但也有一个缺点：如果你在安装过程中出错，或者即使你稍后从系统中删除了 Linux，你也可能丢失所有的 Windows
    程序和数据！


    Linux 技巧：在安装 Linux 之前以及删除 Linux 之前，请务必备份你的系统。


    - 4. 使用 Linux “现场版 (live)”CD 或 DVD 版本启动系统


    这种方法非常有趣且非常简单！


    你可以通过使用 Linux live CD/DVD 启动系统来运行 Linux “现场版”版本。


    只需将 Linux live CD / DVD 插入驱动器并启动系统。一旦系统启动，Linux 就会自动启动并“现场版”运行。无需安装！


    Linux 技巧：如果你没有高速网络连接来下载 Linux，可以购买 CD 或 DVD 版的 Linux，并以惊人的低廉的价格邮寄到世界上任何地方。


    - 5. 在 Windows 内部运行 Linux


    一个免费的“播放器”版本 Linux 是在现有 Windows 系统上从内部运行 Linux 最简单、最快的方法！


    只需运行 Windows，下载并安装免费的 Linux “播放器”程序以及免费的 Linux 播放器版本。这让你轻松地从 Windows 内部运行 Linux！


    运行播放器程序并打开 Linux 播放器版本，你就可以获得一个从 Windows 内部运行的全功能 Linux 版本！


    ## 结论


    再次感谢下载这本书！

    希望这本书能够帮助你获取更多关于 Linux 操作系统和其他重要设置的知识，让你能够获得它的最佳体验。


