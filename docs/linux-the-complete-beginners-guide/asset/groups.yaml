    # 引言


    感谢你下载《Linux 操作系统》一书。本书包含了关于如何运行 Linux 获取真实经验、获取用于系统管理命令的 Linux 书籍，以及在 Windows
    上安装 Linux 等经过证明的步骤和策略，正如目录所示。不要一听到 Linux 这个词就皱眉。它和 Windows 一样友好。


    它是一个可以下载的免费操作系统，但你必须支付一点费用来订购或从公司购买。Linux 诞生于22 年前——它是由芬兰的 Linus Torvalds 与开源软件运动的一组程序员开发的。


    Linux 一年稳步增长。在充满热情的社区支持下，以及 IBM 和 HP 等大公司的承诺下，难怪 Linux——这一过去服务器的奇迹操作系统——也进入了今天的桌面电脑。


    Linux 基于商业操作系统 UNIX。所有的操作系统都试图在内置中包含对系统的命令行管理功能。公司的系统管理员经常将命令行作为他们的命脉，但这并不是真正为普通用户设计的。


    如果你想熟悉 Linux，你不必放弃 Windows。将 Linux 安装在单独的分区，你就可以在 Windows 和 Linux 之间切换。对于没有计算机背景的新手用户来说，学习
    Windows 或 Linux 花费的时间和精力是一样的。


    建议购买新 PC 的用户同时安装两个操作系统并平等地使用。如果你为超过 2-3 台电脑获取 Linux，如果你愿意，还可以获得小额的免费培训和支持。否则，网络上的
    Linux 社区将为你提供帮助。


    你不必成为出色的电脑用户也能使用 Linux。有桌面环境让你在 Linux 中的操作方式与在 Windows 中一样。Linux 也是如此。


    Linux 对多用户具有更好的安全支持，让你能够建立稳定的服务器、互联网网关等，同时让它作为桌面工作站使用。没有蓝屏，也没有所谓的病毒。它很少受到任何病毒攻击，为
    Linux 编写的病毒极少。在安全性方面，它在 10 分制中可以得 10 分以上。


    再次感谢下载本书，希望你喜欢！


    # 关于 Linux 的误解


    安装：


    Linux 很难安装，不是吗？其实不然。大多数人也没有在电脑上安装过 Windows——因为它是预装的。与 Windows 相比，Linux 的安装非常简单。你可以像
    Windows 一样通过图形界面安装它。如今的 Linux 版本比 Windows更容易安装。但真正让大多数人困扰的是在想要同时使用两个操作系统时，如何在硬盘的第二个分区上安装
    Linux。


    分区是通过创建相互独立的虚拟区域来组织硬盘空间的方法。大多数运行 Windows 或 MS DOS 的电脑都有一个大空间存放操作系统。这个空间就是 C 盘。如果你有一个大硬盘，它可能被划分为较小的分区以帮助你更好地组织数据。这些分区通常是
    D:、E: 等你可以在其中任何一个分区上安装 Linux。


    Windows 98 在整个硬盘上创建一个名为 FAT32 的系统，DOS 和 Win95 使用 FAT16。Linux 有许多文件系统——最流行的是 ext3。但你也可以在
    Fat32 分区上 Linux。


    Linux 非常困难且基于文本命令


    Linux 从成为天才电脑用户的系统以来已经走了很远。它拥有极其先进的 X Windows 系统，具有完整的图形用户界面——你知道的，就像 Windows
    一样。它还有大量的窗口管理器，让你对桌面进行不同程度的自定义。但 X 系统本身是非常原始的，需要一个窗口管理器或桌面环境——如 GNOME 或 KDE——才能真正易用。


    窗口管理器是通过传递命令让你与底层 X 系统和 Linux 操作系统交互的程序。流行的窗口管理器有 Sawfish、Enlightenment、Black
    box、after step 和 Window manager。


    至于桌面管理器，它们有自己的窗口管理器和其他工具来使


