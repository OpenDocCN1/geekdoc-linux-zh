    Windows. But what really stumps most people in installing Linux on a second partition
    on their hard disk, when they want to be able to use both operating systems.


    A partition is a way of organizing space on your hard disk by creating virtual
    sections that are separate from each other. Most computers that are running Windows
    or MS DOS have one large chunk of space holding the OS. This space is the C drive.
    If you have a large hard disk, it''s likely that it has been divided into smaller
    bits partitions to help you organize your data better. These partitions are usually
    D;, E: etc. you could have Linux on any of these.


    Windows 98 creates a system called FAT32 on the entire hard disk, DOS and Win95
    use FAT16. Linux has many file systems-on the most popular is ext3. But you could
    have Linux installed on Fat32 partitions also.


