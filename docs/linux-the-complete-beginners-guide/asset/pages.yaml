  md: 'With Linux on the other hand problems with viruses are practically non-existent,
    and in reality you do not need virus protection for your Linux machine. One reason
    why Viruses and Spy-ware are not a problem for Linux is simply due to the fact
    that there are far being more than Linux. A more important reason is that running
    a virus on a Linux machine is more difficult and re qui a lot more from the user.
    With Windows you might accidentally run a virus, by opening an email attachment,
    or double clicking on a file that contains malicious code. However with Linux
    a virus would need to run in the terminal, re quiires the user to execute file
    permissions, and then open it in the terminal.


    And in order to cause any real damage to the system the user would have to log
    in as root, by typing a user name and password before running the virus.


    Foreexample to run a virus that is embedded in an email attachment the user would
    have to, open the attachment, save it, then right click the file and choose properties
    form the menu, in properties they can give execute permissions, they would then
    be able to open the file in the terminal to run the virus. And even then the user
    would only be able to damage his or her home folder, all other users data will
    be left untouched, and all root system files would also remain untouched, because
    Linux qui a root password to make changes to these files.


    The only way the user can damage the whole computer would be if he so logged as
    root user by providing the root user name and password to the terminal before
    running the virus. Unlike Windows in Linux an executable file cannot run automatically,
    It needs to be given execute permissions manually this significantly improves
    security. In Linux the only realistic reason you would need virus protection is
    if you share files with Windows users, and that is to protect them not you, so
    you are not to accidentally pass a virus to the Windows computer that you are
    sharing with.


