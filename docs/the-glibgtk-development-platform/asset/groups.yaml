    Listing 2.35: Idles and timeouts


    For the second solution, GLib provides the g_idle_add() and g_timeout_add() functions
    (seeing List 2.35). An idle function will be called when the main loop is idle,
    that is, when the main loop has nothing else to do. A timeout function is called
    at regular intervals. The boolean return value of a GSource permits to continue
    or stop. If it continues, the function will be called again by the main loop,
    at the next idle time or timeout. You can manually remove the GSourceFunc by calling
    g_source_remove(), which takes the parameter source ID returned by g_idle_add()
    or g_timeout_add(). You must pay attention to remove a GSourceFunc when the object
    on which you do the computation is destroyed. You can store the source ID in an
    object as an attribute, and call g_source_remove() in the destructor if the source
    ID is different from 0. (See the GObject library to create your own classes in
    C.)


