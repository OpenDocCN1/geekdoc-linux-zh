    Ready-to-use destroying the hash table.


    Ready-to-use hash and comparison functions are provided for common keys: integers,
    pointers, strings, and other GLib types. The most common are listed in Listing
    2.33. The functions for integers accept a pointer to girth, rather than the int
    itself. If you pass NULL as the hash argument to g_hash_table_new(), g_direct_hash()
    is used. If you pass NULL as the equality function, then simple pointer is used
    (equivalent to g_direct_equal()), but without a function.


    Manipulating the hash table is simple. The routines are summarized in 2.34. Inserts
    do not copy the key or value; these are entered into the table exactly as you
    provide them, replacing any existing-key-value pair with the same key (“same”
    is defined by your hash and equality functions, remember). If this is a problem,
    you need to look up or remove before you insert. Be careful if you dynamically
    allocate keys or values. If you have provided GDestroyNotify functions, these
    will be called automatically on the old key-value after replacing it.


    The simple g_hash_table_lookup returns the value it finds associated with key,
    or NULL if there is no. This sometimes doesn''t. For example, NULL may be a valid
    value in itself. If you are using strings as keys, especially dynamically allocated
    strings, knowing that a key is in the table might not be enough; you might want
    to retrieve the exact gchar * the table is using to represent key “foo”. A second
    lookup function is provided for cases like this: g_hash_table_lookup_extended()
    returns TRUE if the lookup succeeded; if it returns TRUE, it places the key and
    value found in the locations it''s given.'
