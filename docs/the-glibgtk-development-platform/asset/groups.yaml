    \ The boolean return value of a GSource permits to continue or stop. If it continues,\
    \ the function will be called again by the main loop, at the next idle time or\
    \ timeout. You can manually remove the GSourceFunc by calling g_source_remove(),\
    \ which takes the parameter source ID returned by g_idle_add() or g_timeout_add().\
