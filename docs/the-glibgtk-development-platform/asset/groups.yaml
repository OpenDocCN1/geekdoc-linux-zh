  - '[PAGE 67]


    # Chapter 6


    # Further Reading


    At this point you should know the basics of GLib core and GObject. You don''t
    need to know *everything* about GLib core and GObject to continue, having at least
    a basic understanding will allow you to more easily learn GTK+ and Gio, GObject-based
    library for that matter.


    # 6.1 GTK+ and GIO


    GTK+ and GIO can be learned in parallel.

    You should be able to use any GObject class in GIO, just read the class description
    and skim through the list of functions to have an overview of what features a
    class provides. Among other interesting things, GIO includes:


    +   * GFile to handle files and directories.


    +   * GSettings to store application settings.


    +   * DBus - a high-level API for the D-Bus inter-process communication system.


    +   * GSubprocess for launching child processes and communicate with them asynchronously.


    +   * GCancellable, GAsyncResult and GTask for using or implementing asynchronous
    and cancellable tasks.


    +   * Many other features, with I/O streams, network support or application support.


    For building graphical applications with GTK+, don''t panic, the reference documentation
    has a Getting Started guide, available with Devhelp or online at: `https://developer.gnome.org/gtk3/stable/`


    After reading the Getting Started guide, skim through the whole API reference
    to get familiar with the available widgets, containers and base classes. Some
    widgets have a large API, so a few external tutorials are also available, for
    example for GtkTextView and GtkTreeView. See the documentation page on: `http://www.gtk.org`'
  - '[PAGE 68]


    There is also a series of small tutorials on various GLib/GTK+ topics:

    https://wiki.gnome.org/HowDoI


    # 6.2 Writing Your Own GObject Classes


    The chapter 4 explained how to use an existing GObject class, which is very useful
    to learn GTK+, but it didn''t explain how to create your GObject classes. Writing
    your own Object permits to have reference counting, you can create your own properties
    and signals, you can implement interfaces, overriding virtual functions (if the
    virtual function is not associated to a signal),etc.


    As explained at the beginning of chapter 4, if you want to learn more in-depth
    information on GObject and know how to create sub-classes, the Object reference
    documentation contains introductory chapters: “Concepts” and “Tutorial”, as usual
    in Devhelp or online at:

    https://developer.gnome.org/object/stable/


    # 6.3 Build System


    A basic Makefile is generally not sufficient if you want to install your application
    on different systems. A more sophisticated solution is needed. For a program based
    on GLib/GTK+, there are two alternatives: the Autotools and Meson.


    GNOME and GTK+ historically use the Autotools, but as of 2017 some modules (including
    GTK+) are migrating to Meson. For a new project, Meson can be recommended.


    # 6.3.1 The Autotools


    The Autotools comprise three components: Autocf, Automake and Libtool. It is based
    on shell scripts, m4 macros and make.


    Macros are available for various purposes (the user documentation, code coverage
    statistics for unit tests, etc.). The most recent book on the subject is Autotools,
    by John Calcote [7].


    But the Autotools have the reputation to be difficult to learn.


    # 6.3.2 Meson


    Meson is a new build system, is easier to learn than the Autotools, and also results
    to faster builds. Some GNOME modules already use Meson. See the website for more
    information:

    http://mesonbuild.com/'
  - '[PAGE 69]


    # 6.4 Programming Best-Practices


    It is recommended to follow the GNOME Programming Guidelines [11].


    The following list is a bit unrelated to GLib/GTK+ development, but is useful
    for any programming project. After having some practice, it is interesting to
    learn more about programming best-practices. Writing code of good quality is important
    for preventing bugs and for maintaining a piece of software in the long-run.


    +   * The book on programming best-practices is *Code Complete*, by Steve McConnell
    [8]. Highly recommended¹.


    +   * For guidelines on OOP specifically, see *Object-Oriented Design Heuristics*,
    by Arthur Riel [2].


    +   * An excellent source of information is the website of Martin Fowler: refactoring,
    agile methodology, code design, ...nhttp://martinfowler.com/


    More related to GNOME, Havoc Pennington''s articles have good advice worth the
    reading, including *Working on Free Software*, “Free software UI” and *Free Software
    Maintenance: Adding Features*:

    http://ometer.com/writing.html


    > ¹Although the editor of *Code Complete* is Microsoft Press, the book is not
    related to Microsoft or Windows. The author sometimes explains stuff related to
    open source, UNIX and Linux, but one can regret the total absence of the mention
    “free/libre software” and all the benefits of freedom, in particular for this
    kind of book: being able to learn by reading other’s code. But if you are here,
    hopefully already know all of this.'
