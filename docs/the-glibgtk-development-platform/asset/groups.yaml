- md: '

    # Chapter 1


    # Introduction


    This text is a guide to get started with the GLib/GTK+ development platform, with
    the C language. It is sometimes assumed that the reader uses a Unix-like system.


    Warning: this "book" is far from finished, you''re reading the version 0.8. If
    you have any comments, don''t hesitate to contact me at swilmet@gnome.org, thanks!


    The sources of this book are available at:

    https://github.com/swilmet/glib-gtk-book


    # 1.1 License


    ![](img/078dc81c39b3622bb7d98dea5203cc81_3_0.png)


    This work is licensed under a Creative Commons Attribution-ShareAlike 4.0 International
    License:

    https://creativecommons.org/licenses/by-sa/4.0/


    Some sections are based on the book GTK+/Gnome Application Development, by Havoc
    Pennington, written in 1999, edited by the New Riders Publishing, and licensed
    under the Open Publication License. The latest version of the Open Publication
    License can be found at:

    http://www.opencontent.org/openpub/


    # 1.2 Financial Support


    If you like this, you can financially support it!

    The guide is released as a Free/Libre document and comes free of charge. It does
    not materialize out of empty space; it takes time to write. By donating, you demonstrate
    your appreciation of this work and help its future development.


    A donate button is available at:

    https://people.gnome.org/-swilmet/glib-gtk-book/

    Thanks!


    # 1.3 Todo List for this Book and a Quick 2019 Update


    - Make chapter 5 (about GTK) easier to understand and adapt the rest of the document
    to better integrate the chapter;

    - GTK+ has been renamed to GTK, the plus sign has been dropped. Adapt the text
    accordingly;

    - No longer recommend Libuild, recommend instead Flatpak¹ and Build-Stream²;

    - Talk about the freedesktop.org³ specifications;

    - The majority of core GNOME modules have been migrated to Meson build system
    now (instead of the Autools);

    - Write a chapter about developing C/GObject libraries;

    - Talk about the Rust programming language.


    # 1.4 What is GLib and GTK+?


    Roughly speaking, GLib is a set of libraries: GLib core, GObject and Gio. Those
    three libraries are developed in the Git repository called glib, so when referring
    to "GLib", it can mean "GLib core" or the broader set including GObject and Gio.


    GLib provides data structure handling for C (linked lists, trees, tables, ...),
    portability wrappers, an event loop, threads, dynamic loading of modules and utility
    functions.


    GObject which depends on GLib core simplifies the object-oriented programming
    and event-driven programming paradigms in C. Event-driven programming is not only
    useful for graphical user interfaces (with user events as key presses and mouse
    clicks), but also for daemons that respond to hardware events (a USB stick inserted,
    a second monitor connected, a printer low on power), or software that listens
    to network connections or messages from others, and so on.


    Gio which depends on GLib core and GObject provides high-level APIs for input/output:
    reading a local file, a remote file, a network stream, inter-process communication
    with D-Bus, and many more.


    The GLib libraries can be used to write operating systems, libraries, command
    line utilities and such. GLib offers higher-level APIs than the POSIX standard;
    it is more comfortable to write a C program with GLib.


    GTK+ is a toolkit built on GLib that can be used to develop applications with
    a graphical user interface (GUI). A "widget" is a GUI element, for example a button,
    some text, a menu, etc. And there are some special kinds of widgets that are called
    "containers", which can contain other widgets, to assemble the elements in a window.
    GTK+ provides a broad range of widgets and containers.


    ¹https://flatpak.org/

    ²https://buildstream.build/

    ³https://www.freedesktop.org/


    The first version of GTK+, or the GIMP Tool Kit, was mainly written by Peter Mattis
    in 1996 for the GIMP (GNU Manipulation Program), which has quickly become a general-purpose
    library. The “+” has been added to distinguish between the original version and
    a new version that added object-oriented features. GLib started as GTK+, but is
    now a standalone library.


    GLib and GTK+ APIs are documented with GTK-Doc. Special comments are written in
    the source code, and GTK-Doc extracts them to generate HTML pages.


    Although GLib and GTK+ are written in C, language bindings are available for JavaScript,
    Python, Perl and many other programming languages. At the beginning, manual bindings
    were created, which needed to be updated each time the API of the library changed.
    Nowadays the language bindings are generic and thus automatically updated when,
    for example, new functions are added. This thanks to GObject introspection. Special
    annotations are added to the GTK-Doc comments, to explore more information than
    what the syntax can provide, for example ownership of dynamically-allocated content.
    Any library with GObject introspection is thus available from many programming
    languages. In addition, the annotations are also useful to the C programmer because
    it is a good and sufficient way to document recurrent APIs.


    GLib and GTK+ are part of the GNOME Project, whose overall goal is to provide
    a free and open desktop environment. The desktop environment is a set of software
    applications that allow users to interact with their computer through a graphical
    interface. GNOME includes a desktop panel, a window manager, a file manager, a
    text editor, and many more. The GNOME desktop is designed to be easy to use and
    highly customizable.


    The GNOME desktop is available on many Linux distributions, such as Fedora, Ubuntu,
    Debian, and others. It is also available for other operating systems, such as
    Windows and macOS. The GNOME desktop is a popular choice for users who want a
    clean and modern desktop experience.


    The GLib libraries can be used to write operating systems, libraries, command
    line utilities and such. GLib offers higher-level APIs than the POSIX standard;
    it is more comfortable to write a C program with GLib.


    GTK+ is a toolkit built on GLib that can be used to develop applications with
    a graphical user interface (GUI). A "widget" is a GUI element, for example a button,
    some text, a menu, etc. And there are some special kinds of widgets that are called
    "containers", which can contain other widgets, to assemble the elements in a window.
    GTK+ provides a broad range of widgets and containers.


    # 1.5 The History of GNOME


    The GNOME project started in 1997 with the goal of creating a free and open desktop
    environment for Linux. The project was founded by a group of developers, including
    Jamie Vilain, Alexander Melo, and Matthew Dexter. In the early years, GNOME was
    a very basic desktop environment, but over time it grew into a more powerful and
    complex system.


    In the 2000s, GNOME underwent a major transformation. The project introduced GNOME
    2, which brought a more modern and user-friendly interface. GNOME 2 became a popular
    desktop environment, and it is still used by many Linux distributions today. In
    2011, the project introduced GNOME 3, which featured a completely new interface
    and architecture. GNOME 3 was designed to be more modern and intuitive, and it
    focused on touch-friendly interfaces. In 2020, the project introduced GNOME 40,
    which brought further improvements to the interface and performance.


    Today, GNOME is one of the most popular desktop environments in the Linux world.
    It continues to evolve, with new features and improvements being added regularly.
    The GNOME project is committed to providing a free and open-source desktop environment
    for everyone.


    # 1.5 Financial Support


    If you like this, you can financially support it!

    The guide is released as a Free/Libre document and comes free of charge. It does
    not materialize out of empty space; it takes time to write. By donating, you demonstrate
    your appreciation of this work and help its future development.


    A donate button is available at:

    https://people.gnome.org/-swilmet/glib-gtk-book/

    Thanks!


