    ## 2.1 基础


    GLib 为许多标准和常用的 C 语言构造提供了替代方案。本节描述了 GLib 的基础类型定义、宏、内存分配例程和字符串实用函数。


    ### 2.1.1 类型定义


    GLib 没有使用 C 的标准类型（int, long 等），而是为了各种目的定义了自身的类型。例如，gint32 保证为 32 位宽，这是标准 C89 类型无法保证的。guint
    比 unsigned 更容易使用的类型。一些类型定义 (typedef) 仅为了一致性而存在；例如，gchar 始终等于标准的 char。


