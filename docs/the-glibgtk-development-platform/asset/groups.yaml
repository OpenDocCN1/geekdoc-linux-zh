  - "[PAGE 46]\n\nat, column 120, it might mean that there are too many indentation\
    \ levels and that you should extract the code into intermediate functions.\n\n\
    The return type of a function definition is on the previous line than the function\
    \ name, so that the function name is at the beginning of the line. When writing\
    \ a function prototype, the function name should never be at the beginning of\
    \ a line, it should ideally be on the same line as the return type⁷. That way,\
    \ you can do a regular expression search to find the implementation of a function,\
    \ for example with the grep command:\n\n```\n$ grep -E \"function_name\" -c\n\
    ```\n\nOr, if the code is a Git repository, it’s a little more convenient to use\
    \ git grep:\n\n```\n$ git grep -n E \"function_name\"\n```\n\nLikewise, there\
    \ is an easy way to find the declaration of a public struct. The convention is\
    \ to prefix the type name by an underscore when defining the struct. For example:\n\
    \n```\n* In the header: */\ntyped struct _MyAppSpellChecker MyAppSpellChecker;\n\
    \n/* In the .c file: */\nstruct _MyAppSpellChecker\n{\n    /* ... ... */\n};\n\
    ```\n\nAs a result, find the full declaration of the MyAppSpellChecker type, you\
    \ can search \"_MyAppSpellChecker\":\n\n```\n$ grep -n _MyAppSpellChecker\n```\n\
    \nIn GLib-GTK+, this underscore-prefix convention is normally applied to every\
    \ struct that has a separate typedef line. The convention is not followed when\
