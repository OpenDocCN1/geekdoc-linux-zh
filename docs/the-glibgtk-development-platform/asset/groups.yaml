    of a program. For example when you split a class in two, if the code using the
    initial class is not updated, the compiler will tell you so. With test-driven
    development (TDD), and by writing tests for everything, writing a huge codebase
    in a dynamic-typed language like Python is also feasible. With very code coverage,
    the unit tests will detect errors when refactoring the code. But unit tests can
    be much slower to execute than compiling the code, so tests also the program behavior.
    So it''s not convenient to run all tests when doing code refactoring. Of course
    writing unit tests is also a good practice for a C codebase! However the GUI of
    the code, writing is often not a high-priority task if the application is well
    tested by its developers.


    C is an explicit-typed language: the variables are visible in the code. You usually
    don''t need to add comments to explain what the variables contain. Knowing the
    type of a variable is important to understand the code, knowing what the variables
    represents and functions can be called on. On a related matter, the self object
    is passed explicitly as a function argument. Thus when an attribute is accessed
    through the self pointer, you know where the attribute comes from. Some object-oriented
    languages use this for that purpose, but it is optional like in C++ or Java. In
    this latter case, a useful text editor feature is to highlight differently attributes,
    even when the keyword is not used, you know that it''s an attribute and not a
    local variable. With the self object passed as an argument, there is no possible
    confusions


    The C language has a very good toolchain: stable compilers (GCC, Clang, ... ),


    > *Well, kindly is perhaps not the best description, spelling out loads of errors
    is closer to reality.'
  - '[PAGE 9]


    text editors (Vim, Emacs, ...), debuggers (GDB, Valgrind, ...), static-analysis
    tools, ...


    For some programs, a garbage collector is not appropriate because it pauses the
    program regularly to release unused memory. For critical code sections, such as
    real-time animations, it is not desirable to pause the program (a collector can
    sometimes run during several seconds). In this case, manual memory management
    in C is a solution.


    Less important, but still useful; the verbosity of C in combination with the GLib/GTK+
    conventions has an advantage: the code can be searched easily with a command like
    grep. For example the function gtk_widget_show() contains the namespace (gtk)
    and the method (show). With an object-oriented language, the syntax is object.show().
    If "show" is searched in the code, there will probably be false positives, or
    a smarter tool is needed. Another advantage is knowing the namespace and the code
    of a method can be useful when reading the code, it is another form of self-documentation.


    More importantly, the GLib/GTK+ API documentation is primarily written for the
    C language. Reading the documentation while programming in the language is not
    convenient. Some tools are currently in development to generate the API documentation
    for other languages, so hopefully in the future it won''t be an problem.


    GLib/GTK+ are themselves written in C. So programming in C, there is no extra
    layer. An extra layer is potentially a source of additional bugs and maintenance
    burdens. Moreover, using C language is probably better for pedagogical purposes.
    A higher-level language can hide some details about GLib/GTK+. So the code is
    shorter, but when you have a problem you need to understand not only the library
    feature works, but also the language binding works.


    That said, if (1) you''re not comfortable in C, (2) you''re already proficient
    with a higher-level language with GObject Introspection support, (3) you plan
    to write just a small application or plugin, then choosing the higher-level language
    makes perfect sense.


    # 1.8 Learning Path


    Normally this section should be named "Structure of the Book", but as you can
    see the book is finished, so instead the section is named "Learning Path".


    The logical learning path is:


    +   1. The basics of GLib core;

    2. Object-Oriented Programming in C and the basics of GObject;

    3. GTK+ and GIO in parallel.


    Since GTK+ is based on GLib and GObject, it is better to understand the basics
    of those libraries first dive directly into GTK+, so after a short period of time
    you can display a window with text and three buttons; it''s fun, knowing GLib
    and GObject is not a luxury if you want to understand what you''re doing, and
    a realistic GTK+ application extensively'
