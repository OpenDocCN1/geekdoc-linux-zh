    # 4.3 Interfaces


    With GObject it is possible to create interfaces. An interface is just an API,
    it doesn''t contain the implementation. A GObject class can implement one or several
    interfaces. If a GObject class is documented GTK-Doc, the documentation will contain
    a certain Implemented Interfaces.


    For example GTK+ contains the GtkOrientable interface that is implemented by many
    widgets and permits to set the orientation: horizontal or vertical.


    The two macros explained in the previous section work for interfaces too. An example
    with Gtkvgrid:


    ```

    Gtkwidget *vgrid;


    vgrid = gtk_grid_new();

    gtk_orientable_set_orientation(GTK_ORIENTABLE(vgrid),

    \                                     GTK_ORIENTATION_VERTICAL);

    ```


    So when you search for a certain feature in a certain GObject class, the feature
    can be located at three places:


    +   - In the GObject class itself;

    - In one of the parent classes in the Object Hierarchy;

    - Or in one of the Implemented Interfaces.


    # 4.4 Reference Counting


    The memory management of GObject classes rely on reference counting. A GObject
    class has a counter:


    +   - When the object is created the counter is equal to one;

    - g_object_ref() increments the counter;

    - g_object_unref() decrements the counter;

    - If the counter reaches zero, the object is freed.


    It permits to store the GObject at several places without the need to coordinate
    when to free the object.


    # 4.4.1 Avoiding Reference Cycles with Weak References


    If A references object B and object B references object A, there is a reference
    cycle and the two objects will never be freed. To avoid that problem, there is
    the concept of “weak” references. When calling g_object_ref(), it''s a “strong”
    reference. So in one direction there is a strong reference, and in the other direction
    there must be a weak reference (or no references at all).


    In Figure 4.1 we can see that object A has a strong reference to object B, and
    object B has a weak reference to object A.


    A weak reference can be created with g_object_add_weak_ref() or g_object_weak_ref().
    As with strong references, it is important to release the reference when no longer'
