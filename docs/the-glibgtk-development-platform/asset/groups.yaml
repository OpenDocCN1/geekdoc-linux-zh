    # Chapter 5


    # Example of a GTK+ Application Code Architecture


    This chapter is not entirely finished, it might be hard to understand without
    any knowledge about GTK+ or another widget toolkit. And the chapter is not well
    integrated with the other chapters, the introduction and further reading chapters
    have not been adapted for example. This chapter is distributed in the hope that
    it will be useful, but WITHOUT ANY WARRANTY; even the implied warranty of MERCHANTABILITY
    or FITNESS FOR A PARTICULAR PURPOSE.


    For any programming project, it is important to design correctly the general code
    architecture. With Object-Oriented Programming, it means the main classes. This
    chapter explains one good example of a code architecture for GTK+ application,
    by looking at a simplified view of the edit text editor¹.


    gedit has a tabbed document interface: several files can be opened in the same
    window, in different tabs. As we will see, this is reflected in the code architecture.


    The Figure 5.1 p. 61 shows the Every edit class in the schema is a subclass of
    a GTK+ or GtkSourceView class. (GtkSourceView² is a library extending the GtkTextView
    widget; GtkTextView being part of GTK+.)


    We will go through the class schema, explaining the classes step by step, beginning
    at the top. This will permit to introduce some of the most important GTK+ classes,
    not by describing them in details with a lot of code examples, but giving a high-level
    overview.


    # 5.1 The main() function and EditApp


    Although not represented on the schema, the entry point of a GTK+ application
    - as for every C program - the main() function. To create a GTK+ application,
    the principal thing to do in main() is to create a GtkApplication instance, or
    a subclass of it. In the schema we see that GerritApp is a subclass of GtkApplication,
    so the main() function of edit creates a GerritApp object.


    > ¹https://wiki.gnome.org/Apps/Gedit²https://wiki.gnome.org/Projects/GtkSourceView'
  - "[PAGE 61]\n\n![](img/078dc81c39b3622bb7d98dea5203cc81_61_0.png)\n\nFigure 5.1:\
    \ Simplified code architecture of the gedit text editor\n\nGtkApplication is the\
    \ class that contains and represents the whole application. There is usually one\
    \ instance of GtkApplication per process, so can be considered a singleton class.\
    \ What GtkApplication contains the windows, for example the GtkWindow's case in\
    \ edit, plus other types of windows like dialog windows.\n\nWe already saw the\
    \ GtkApplication class hierarchy in section 4.1 p. 47 when explaining OOP inheritance\
    \ with GObject:\n\n+   - GObject\n- GtkApplication\n  - GtkApplication\n\nGApplication\
    \ is part of the Gio library and implements the features that are not related\
    \ to the Graphical User Interface (GUI). So for a program that runs in the terminal,\
    \ it is possible to use GApplication only.\n\nAn important feature that GApplication\
    \ provides is process uniqueness (but it can be disabled if wanted). What process\
    \ uniqueness does is to have only one process per application user session. For\
    \ that to work, an application ID must be present when creating the GApplication\
    \ object. With that ID, GApplication looks if another process runs the same application\
    \ in the same user session; if it is the case, it communicates to the primary\
    \ instance the actions that to be done (for example opening a new window, or opening\
    \ a new file in an existing window, etc). When the actions are done on the primary\
    \ instance, the second process exits immediately. On Linux, GApplication uses\
    \ the D-Bus Inter-Process Communication (IPC) system to communicate between the\
    \ two processes."
- md: "\nProcess uniqueness has several advantages, to give a few concrete examples:\n\
    \n- For an application with a tabbed document interface, when clicking on a file\
    \ in a manager like Nautilus, the file can be opened in a new tab instead of creating\
    \ each a new window. For this work, inter-process communication is needed in one\
    \ form or another;\n\n- An application doesn't need to synchronize its state and\
    \ different processes. For the sake of argument, let's say that in gedit user\
    \ create custom \"build tools\", compile the current file or project. gedit saves\
    \ the custom build tools in an XML file and are shown in the menu to execute their\
    \ commands. On Linux, the XML file is saved for example in the user's ~/.local/share/\
    \ directory. Without uniqueness, if one gedit process modifies the custom tools,\
    \ the other gedit processes must reload the XML file, and need to ensure that\
    \ there are no races (two different processes modify the XML file at the same\
    \ time). With uniqueness, that problem doesn't exist, the gedit windows share\
    \ the same application state, and the developer can assume only one process per\
    \ user can modify the XML file³ the user still has the possibility to edit the\
    \ XML file by hand, but in that case the application runs uniquely and the user\
    \ is expected to modify the tools from GTK (that provides them).\n\nAnother important\
    \ feature of GApplication is to run the main event loop. The GLib main loop was\
    \ described in section 2.3 p. 31. With GApplication, this is done with the g_application_run()\
    \ function. A minimalistic version of the main() function in gedit would look\
    \ like:\n\n```\nint\nmain (int argc,\n    char**argv)\n{\nGEditApp *app;\nint\
    \ status;\n\n/* Init i18n (internationalization) here. */\n\napp = gedit_application_new();\n\
    status = g_application_run(G_APPLICATION (app), argc, argv);\ng_object_unref(app);\n\
    \nreturn status;\n}\n```\n\nWhat Gedit does basically is what would need to be\
    \ done in main() if there was no GApplication subclass. This includes:\n\n> Note\
    \ this would not be true if it was possible to run several graphical sessions\
    \ for the same user, on the same machine (which is supported) or at least sharing\
    \ the backing storage for the home directory (for example with NFS mounts). But\
    \ GNOME and most applications don't support this, a user can open at most one\
    \ graphical session at a time for the same home directory. On the physical machine,\
    \ this is enforced by GDM (the GNOME display manager) and D-Bus. For NFS mounts\
    \ this is not enforced, but if the same user opens several graphical sessions\
    \ on different computers, some programs might misbehave. Although GApplication\
    \ process uniqueness is documented as per session, in practice we can say it is\
    \ simply per user.\n\n- Configuring the GtkApplication object correctly, for example\
    \ giving the application ID;\n\n- Connecting callbacks to some signals⁴, for example\
    \ to create a EditWindow when needed;\n\n- Implementing application-wide GAction's.\
    \ GAction is a class of GIO that represents an action that the user can trigger.\
    \ An application-wide action is for example to quit the application, or to open\
    \ the preferences dialog (because the preferences are applied to the whole application).\n\
    \nWhen you start a new Gtk+ application, you don't directly see the need for a\
    \ GtkApp subclass, since the code in main(), plus the callbacks, are still small.\
    \ But when and more features are added, it is a good idea at some point to move\
    \ the code to a GtkApplication subclass. Or to create a subclass. A subclass is\
    \ especially useful when the need arises to store additional data.\n\n## 5.2 EditWindow\n\
    \nEditWindow is a subclass of GtkApplicationWindow. And, we don't see it in the\
    \ schema, but GtkApplicationWindow is a subclass of GtkWindow, which is a top-level\
    \ widget. A top-level widget cannot be contained in another widget. A GtkApplication\
    \ is contained in a GtkApplication, but GtkApplication is not a subclass of GtkWidget.\n\
    \nIn the schema, the \"1\" and \"..\" notation means that one EditApp contains\
    \ one or more EditWindow objects, and that a EditWindow is obtained in exactly\
    \ one EditApp (a EditWindow cannot be contained in several EditWindow objects,\
    \ there is anyway only one EditApp instance per).\n\nEditWindow is responsible\
    \ to create the main UI, creating other widgets and assembling them in a GtkGrid\
    \ container for example. Another thing that EditWindow does is to implement the\
    \ GActions that have an effect on the current window, for example to close the\
    \ window, or save the current document. When implementing a GAction, EditWindow\
    \ delegate most of it to other classes contained in EditWindow.\n\nAt the top\
    \ of a main window, there is usually a GtkHeaderBar shows the title, some buttons\
    \ and a \"hamburger\". Alternatively, an application can have a traditional menu\
    \ and toolbar.\n\nBesides the headerbar, EditWindow creates a EditStatusbar and\
    \ adds to the bottom of the window. It creates two GtkPanels, one on the left\
    \ side of the window, and the other on the bottom, above the EditStatusBar. Each\
    \ panel can contain several elements. For example the side panel contains an integrated\
    \ file browser, and the bottom panel can contain a terminal, other things⁵.\n\n\
    > ⁴Note that in a GObject subclass, instead of connecting callbacks to signals\
    \ of a parent class with e.g. g_signal_connect(), it is better to override the\
    \ virtual functions instead.\n⁵The current code actually doesn't contain a Panel\
    \ class anymore, but it was the case in an earlier version. Adding EditPanel to\
    \ the diagram was done to show a possible implementation of panels in an application.\
    \ If your application contains only one element, no need to have a class, you\
    \ can directly add the element to the window. GeditWindow also creates a EditNotebook,\
    \ the main part of the window.\n\n## 5.3 EditNotebook and What It Contains\n\n\
    EditNotebook is a subclass of GtkNotebook, which displays tabs, and also contains\
    \ their content. In the class, we can see that the content of a tab is EditTab,\
    \ a subclass of GtkGrid. The main element inside EditTab is GEditView. More precisely\
    \ — it was omitted in GtkScrollView for succinctness — the EditView is actually\
    \ contained in. But GEditTab can contain other widgets, for example information\
    \ on bars on top of the document. GeditView is a subclass of GtkSourceView, which\
