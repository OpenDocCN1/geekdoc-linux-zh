    \ follow-up is Object-Oriented Programming (OOP) in C and the basics of GObject.\n\
    \nEvery GTK+ widget is a subclass of the GObject base class. Knowing the basic\
    \ concepts of GObject is important for *using* a GTK+ widget or another GObject-based\
    \ utility, but also for *creating* your own GObject classes.\n\nIt is important\
    \ to note that although the C language is not object-oriented, it is possible\
    \ to write \"semi-object-oriented\" code easily, without GObject. For learning\
    \ purposes, what's this part begins with. GObject is then easier to learn. What\
    \ GObject adds is features such as reference counting, inheritance, virtual functions,\
    \ interfaces, signals and more.\n\nBut why following object-oriented style in\
    \ the first place? An object-oriented code permits to avoid sort of programming\
    \ best-practices guide, you know that you *should*, if possible, avoid global\
