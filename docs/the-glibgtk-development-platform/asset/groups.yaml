    a pointer in an integer will not work. To do that portably, you must store the
    pointer in a pointer of a long. (It''s undoubtedly a bad idea to do so, however.)


    # 2.1.3 Debugging Macros


    GLib has a nice set of macros you can use to enforce invariants and preconditions
    in your code. GTK+ uses these liberally — one of the reasons it''s stable and
    easy to use. They all disappear when you define G_DISABLE_CHECKS or G_DISABLE_ASSERT,
    so there is no performance penalty in production code. Using these liberally is
    a very good idea. You''ll find bugs faster if you do. You can add assertions and
    checks whenever you find a bug to be sure the bug doesn''t reappear in future
    versions — this completes a regression suite. Checks are especially useful when
    the code you''re writing will be used as a black box by other programmers; users
    will immediately know when and how they''ve misused your code.


    Of course you should be very careful to ensure your code isn''t subtly dependent
    on debug-only statements to function correctly. Statements that will disappear
    in production code should never have side effects.'
