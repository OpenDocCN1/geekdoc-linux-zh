- md: "\n# Chapter 4\n\n## A Gentle Introduction to GObject\n\nIn the previous chapter\
    \ we have learned how to write semi-object-oriented code in C. This is how the\
    \ classes in GLib are written. GObject goes several steps further into Object-Oriented\
    \ Programming, with inheritance, interfaces, virtual functions, and GObject also\
    \ simplifies the event-driven programming paradigm, with signals and properties.\n\
    \nIt is recommended to create your own GObject classes for writing a GLib/GTK+\
    \ application. Unfortunately the code is a little verbose, because the C language\
    \ is not object-oriented. Boilerplate code is needed for some features, but don't\
    \ be afraid, there are tools and scripts to generate the boilerplate.\n\nHowever\
    \ this chapter takes a step back from the previous chapter, it is just a small\
    \ introduction to GObject; it will explain the essential things to know how to\
    \ use an existing GObject class (like all GTK+ widgets and classes in Gio). It\
    \ will not explain how to create your own GObject classes, because it is already\
    \ well covered in the GObject reference manual, and the goal of this book is not\
    \ to duplicate the whole content of the reference manuals, the goal is to serve\
    \ as a starting guide.\n\nFor more in-depth information on GObject and how to\
    \ know how to create subclasses, the GObject reference documentation contains\
    \ introductory chapters: \"Concepts\" and \"Tutorial\", available at:\n\n```\n\
    https://developer.gnome.org/gobject/stable/\n```\n\nTo explain concepts, some\
    \ examples are taken from GTK+ or Gio. When reading this, you are encouraged to\
    \ open in parallel Devhelp, to look at the API reference and see for yourself\
    \ how a GObject-based library is documented. The goal is that you become autonomous\
    \ and be able to learn any new GObject class, be it in Gio, GTK+ or any other\
    \ library.\n\n## 4.1 Inheritance\n\nAn important concept of OOP is inheritance.\
    \ A class can be a sub-class of a parent class. The sub-class inherits the features\
    \ of the parent class, extending or overriding its behavior.\n\nThe GObject library\
    \ provides the GObject base class. Every class in GIO GTK+ inherit — directly\
    \ or indirectly — from the GObject base class. When looking at a GObject-based\
    \ class, the documentation (written with GTK-Doc) always contains an Object Hierarchy.\
    \ For instance, the GtkApplication has the following hierarchy:\n\n- GObject\n\
    - GApplication\n- GtkApplication\n\nIt means that when you create a GtkApplication\
    \ object, you also have access to the functions, signals and properties of GApplication\
    \ (implemented in GIO) and GObject. For course, the g_application.* functions\
    \ as first argument a variable of type \"GtkApplication *\", not \"Gtk Application\
    \ *\". To cast the variable to the good type, the recommended way is to use the\
    \ G_APPLICATION() macro. For example:\n\n```\nGtkApplication *app;\n```\n\n```\n\
    g_application_mark_busy (G_APPLICATION (app));\n```\n\n## 4.2 GObject Macros\n\
    \nEach GObject class provides a set of standard macros. The G_APPLICATION() macro\
    \ demonstrated in the previous section is one of the standard macros provided\
    \ by the GApplication class.\n\nNot all the standard GObject macros will be explained\
    \ here, just the macros useful for using a GObject in a basic way. The other macros\
    \ are more advanced and are usually useful only when sub-classing a GObject class,\
    \ when creating a property or a signal, or when overriding a virtual function.\n\
    \nEach GObject class defines a macro of the form NAMESPACE_CLASSNAME(object),\
    \ which casts the variable to the type \"NamespaceClassname \" and checks at runtime\
    \ if the variable correctly contains a NamespaceClassname object or a sub-class\
    \ of it. If the variable is NULL or contains an incompatible object, it prints\
    \ a critical warning message to the console and returns NULL.\n\nA standard class\
    \ works too, but is most of the time not recommended because GtkApplication *app;\n\
    \n```\n/* Not recommended */\ng_application_mark_busy ((GtkApplication *) app));\n\
    ```\n\nAnother macro useful when using a GObject is NAMESPACE_IS_CLASSNAME(object),\
    \ which returns TRUE if the variable is a NamespaceClassname object or a sub-class\
    \ of it.\n\n## 4.3 Interfaces\n\nWith GObject it is possible to create interfaces.\
    \ An interface is just an API, it doesn't contain the implementation. A GObject\
    \ class can implement one or several interfaces. If a GObject class is documented\
    \ GTK-Doc, the documentation will contain a certain Implemented Interfaces.\n\n\
    For example GTK+ contains the GtkOrientable interface that is implemented by many\
    \ widgets and permits to set the orientation: horizontal or vertical.\n\nThe two\
    \ macros explained in the previous section work for interfaces too. An example\
    \ with Gtkvgrid:\n\n```\nGtkwidget *vgrid;\n\nvgrid = gtk_grid_new();\ngtk_orientable_set_orientation(GTK_ORIENTABLE(vgrid),\n\
    \                                     GTK_ORIENTATION_VERTICAL);\n```\n\nSo when\
    \ you search for a certain feature in a certain GObject class, the feature can\
    \ be located at three places:\n\n- In the GObject class itself;\n- In one of the\
    \ parent classes in the Object Hierarchy;\n- Or in one of the Implemented Interfaces.\n\
    \n## 4.4 Reference Counting\n\nThe memory management of GObject classes rely on\
    \ reference counting. A GObject class has a counter:\n\n- When the object is created\
    \ the counter is equal to one;\n- g_object_ref() increments the counter;\n- g_object_unref()\
    \ decrements the counter;\n- If the counter reaches zero, the object is freed.\n\
    \nIt permits to store the GObject at several places.\n\n### 4.4.1 Avoiding Reference\
    \ Cycles with Weak References\n\nIf A references object B and object B references\
    \ object A, there is a reference cycle and the objects will never be freed. To\
    \ avoid that problem, there is the concept of “weak” references. When calling\
    \ g_object_ref(), it's a “strong” reference. So in one direction there is a strong\
    \ reference, and in the other direction there must be weak reference.\n\nIn Figure\
    \ 4.1 we can see that object A has a strong reference to B, and object B has a\
    \ weak reference to A. A weak reference can be created with g_object_add_weak_ref()\
    \ or g_object_weak_ref(). As with strong references, it is important to release\
    \ the reference when needed, usually in the class destructor. A weak reference\
    \ must be removed with g_object_weak_pointer() or g_object_weak_unref(). In Figure\
    \ 4.1, the destructor of B must remove the weak reference if it is not already\
    \ done.\n\n### 4.4.2 Floating References\n\nWhen a GObject inherits from GUnowned\
    \ (which is the case of GtkWidget), the object initially has a floating reference.\
    \ g_object_ref_sink() must be called to convert that floating reference into a\
    \ normal, strong reference.\n\nWhen a GObject inherits from GUnowned, it means\
    \ that GObject must be included in some kind of container. The container then\
    \ assumes ownership of the floating reference, calling g_object_ref_sink(). It\
    \ permits to simplify the code, to remove the need call g_object_unref() after\
    \ including the object into the container.\n\nThe Listing 4.1 shows how memory\
    \ management is handled with a normal GObject. Compare this to the Listing 4.2,\
    \ which shows how memory management is handled with a GObject deriving from GUnowned.\
    \ The difference is that g_object_unref() is not called in the latter Listing,\
    \ so it shortens the code.\n\nSo, it's important to know whether a GObject inherits\
    \ from GUnowned or not. For that you need to look at the Object Hierarchy, for\
    \ example GtkEntry\n\n```\nGObject\n GInitially\n  GtkWidget\n   GtkEntry\n```\n\
    \n## 4.5 Signals and Properties\n\nA GObject can emit signals. With the GLib main\
    \ loop (previously explained in section 2.3 p.31), this is the foundation for\
    \ event-driven programming. An example of a signal is when the user clicks on\
    \ a button. The application connects a callback function to perform the desired\
    \ action when the event occurs.\n\nAnother concept of GObject are properties,\
    \ which is related to signals. A property is basically an instance variable surmounted\
    \ with a \"notify\" signal that is emitted when its value changes. A good example\
    \ of a property is the state of a check button, i.e. a boolean value describing\
    \ whether the button is currently checked or not. When the state changes, the\
    \ \"notify\" signal is sent.\n"
  mdcn: "\n\n# 第 4 章\n\n## GObject 简析\n\n在上一节中，我们学习了如何在 C 语言中编写半面向对象的代码。这就是 GLib 中类的实现方式。GObject\
    \ 在面向对象编程方面更进了一步，包含了继承、接口、虚函数，而且 GObject 还通过信号（signals）和属性（properties）简化了事件驱动编程范式。\n\
    \n在编写 GLib/GTK+ 应用时，建议创建自己的 GObject 类。遗憾的是，代码有些冗长，因为 C 语言并不是面向对象的。某些功能需要编写模板代码（Boilerplate\
    \ code），但不要担心，有工具和脚本可以生成这些模板代码。\n\n然而，本章相比于上一节后退了一步，它只是对 GObject 的简要介绍；它将解释如何使用现有的\
    \ GObject 类（如所有的 GTK+ 控件和 Gio 中的类）时所需的要要知识。它不会解释如何创建你自己的 GObject 类，因为这在 GObject\
    \ 参考手册中已经有详细介绍，而本书的目标不是重复参考手册的所有内容，而是作为一份入门指南。\n\n关于 GObject 的更多深入信息以及如何知道创建子类，GObject\
    \ 参考文档包含了介绍性章节：“Concepts”（概念）和“Tutorial”（教程），地址如下：\n\n```\nhttps://developer.gnome.org/gobject/stable/\n\
    ```\n\n为了解释这些概念，部分示例取自 GTK+ 或 Gio。在阅读时，鼓励你并行打开 Devhelp，查看 API 参考，并亲眼观察基于 GObject\
    \ 的库是如何文档化的。目标是让你变得独立，能够学习任何新的 GObject 类，无论是在 Gio、GTK+ 还是其他库中。\n\n## 4.1 继承\n\n\
    OOP（面向对象编程）的一个重要概念是继承。类可以是父类的子类。子类继承父类的特性，扩展或覆盖它的行为。\n\nGObject 库提供了 GObject 基类。Gio\
    \ GTK+ 中的所有类直接或间接自 GObject 基类。在查看基于 GObject 的类时，文档（使用 GTK-Doc 编写）始终包含一个对象层次结构（Object\
    \ Hierarchy）。例如，GtkApplication 具有以下层次结构：\n\n- GObject\n- GApplication\n- GtkApplication\n\
    \n这意味着当你创建一个 GtkApplication 对象时，你也可以访问 GApplication（在 GIO 中实现）和 GObject 的函数、信号和属性。当然，g_application.*\
    \ 函数的第一个参数变量类型为 \"GtkApplication *\"，而不是 \"Gtk Application *\"。为了将变量转换为正确的类型，推荐的方法是使用\
    \ G_APPLICATION() 宏。例如：\n\n```\nGtkApplication *app;\n```\n\n```\ng_application_mark_busy\
    \ (G_APPLICATION (app));\n```\n\n## 4.2 GObject 宏\n\n每个 GObject 类都提供一组标准宏。上一节演示的\
    \ G_APPLICATION() 宏是 GApplication 类提供的标准宏之一。\n\n并不是所有的标准 GObject 宏都会在这里解释，仅解释对基础方式使用\
    \ GObject 有用的宏。其他宏更高级，通常只在派生 GObject 类、创建属性或信号、或覆盖虚函数时有用。\n\n每个 GObject 类都定义了一个格式为\
    \ `NAMESPACE_CLASSNAME(object)` 的宏，它将变量强制转换为类型 \"NamespaceClassname \" 并在运行时检查该变量是否正确包含一个\
    \ NamespaceClassname 对象或其子类。如果变量为 NULL 或包含不兼容的对象，它会在控制台打印一条关键警告消息并返回 NULL。\n\n\
    标准的类转换也有效，但大多数时候不推荐，如下所示：\n\nGtkApplication *app;\n\n```\n/* 不推荐写法 */\ng_application_mark_busy\
    \ ((GtkApplication *) app));\n```\n\n另一个在使用 GObject 时有用的宏是 `NAMESPACE_IS_CLASSNAME(object)`，如果变量是\
