    Listing 2.6: Allocation macros


    +   - g_malloc() always returns a gpointer, never a char *, so there''s no need
    to cast the return value.

    - g_malloc() aborts the program if the underlying malloc() fails, so you don''t
    have to check for a NULL value.

    - g_malloc() gracefully handles a size of 0, by returning NULL.

    - g_free() will ignore any pointer you pass to it.


    It''s important to match g_malloc() with g_free(), plain malloc() with free(),
    and (if you''re using C++) with delete. Otherwise bad things can happen, because
    allocators use different memory pools (and new/delete constructors and destructors).


    Of course there is a g_realloc() equivalent to realloc(). There''s a convenient
    g_calloc() which fills allocated memory with zeros, and g_memdup() which returns
    a copy of n_bytes bytes starting at mem. g_realloc() and g_calloc() will both
    accept a size of 0, for consistency with g_malloc(). However, g_memdup() will
    not.


    If it not obvious: g_malloc() fills raw memory with unset bits, the value of 0
    for whatever you intend to put there. Occasionally someone expects to get an array
    of floating point numbers initialized to 0.0; this is not guaranteed to work properly.


    Finally, there are type-aware allocation macros, shown in Listing 2.6. The type
    argument of each of these is the name of a type, and the count argument is the
    number of type-size blocks to allocate. These macros allow you some typing and
    multiplication, and are also less error-prone. They automatically cast to the
    target pointer, so attempting to assign the allocated memory to the wrong kind
    of pointer should trigger a compiler warning. (If you have turned off, as a responsible
    programmer!)


    > ¹The ANSI/O standard, the void generic pointer type did not exist, and malloc()
    returned a char * value. Nowadays malloc returns a void * type — which is the
    same as gpointer and void allows implicit pointer conversions in C. Casting the
    return value of malloc() is needed if: the developer wants to support old compilers;
    or if the developer thinks that an explicit conversion makes the code cleaner;
    or if a C++ compiler is used, because in C++ a cast from the void type is required.'
