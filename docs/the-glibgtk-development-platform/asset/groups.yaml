    Matthew Dexter 在内的开发者创立。早期，GNOME 是一个非常基础的桌面环境，但随着时间的推移，它变成了一个更强大、更复杂的系统。


    20 00 年代，GNOME 经历了巨大的变革。项目引入了 GNOME 2。GNOME 2 变成了一个流行的桌面环境，现在仍被许多 Linux 发行版使用。2011
    年，项目引入了 GNOME 3，它具有全新的界面和架构。GNOME 3 的设计更加现代且直观，并关注触控界面。2020 年，项目引入了 GNOME 40，对界面和性能进行了进一步改进。


    如今，GNOME 是 Linux 世界最流行的桌面环境之一。它不断演进，定期添加新功能和改进。GNOME 项目致力于为所有人提供一个开源的桌面环境。


