    +   • Configuring the GtkApplication object correctly, for example giving the
    application ID;


    +   • Connecting callbacks to some signals⁴, for example to create a EditWindow
    when needed;


    +   • Implementing application-wide GAction''s. GAction is a class of GIO that
    represents an action that the user can trigger. An application-wide action is
    for example to quit the application, or to open the preferences dialog (because
    the preferences are applied to the whole application).


    When you start a new Gtk+ application, you don''t directly see the need for a
    GtkApp subclass, since the code in main(), plus the callbacks, are still small.
    But when and more features are added, it is a good idea at some point to move
    the code to a GtkApplication subclass. Or to create a subclass. A subclass is
    especially useful when the need arises to store additional data.


    # 5.2 EditWindow


    EditWindow is a subclass of GtkApplicationWindow. And, we don''t see it in the
    schema, but GtkApplicationWindow is a subclass of GtkWindow, which is a top-level
    widget. A top-level widget cannot be contained in another widget. A GtkApplication
    is contained in a GtkApplication, but GtkApplication is not a subclass of GtkWidget.


    In the schema, the "1" and ".." notation means that one EditApp contains one or
    more EditWindow objects, and that a EditWindow is obtained in exactly one EditApp
    (a EditWindow cannot be contained in several EditWindow objects, there is anyway
    only one EditApp instance per).


    EditWindow is responsible to create the main UI, creating other widgets and assembling
    them in a GtkGrid container for example. Another thing that EditWindow does is
    to implement the GActions that have an effect on the current window, for example
    to close the window, or save the current document. When implementing a GAction,
    EditWindow delegate most of it to other classes contained in EditWindow.


    At the top of a main window, there is usually a GtkHeaderBar shows the title,
    some buttons and a "hamburger". Alternatively, an application can have a traditional
    menu and toolbar.


    Besides the headerbar, EditWindow creates a EditStatusbar and adds to the bottom
    of the window. It creates two GtkPanels, one on the left side of the window, and
    the other on the bottom, above the EditStatusBar. Each panel can contain several
    elements. For example the side panel contains an integrated file browser, and
    the bottom panel can contain a terminal, other things⁵.


    > ⁴Note that in a GObject subclass, instead of connecting callbacks to signals
    of a parent class with e.g. g_signal_connect(), it is better to override the virtual
    functions instead.

    ⁵The current code actually doesn''t contain a Panel class anymore, but it was
    the case in an earlier version. Adding EditPanel to the diagram was done to show
    a possible implementation of panels in an application. If your application contains
    only one element in a panel, no need to have a Panel class, you can directly add
    the element to the window.'
