    +   - Write a chapter about developing C/GObject libraries;


    +   - Talk about the Rust programming language.


    # 1.4 What is GLib and GTK+?


    Roughly speaking, GLib is a set of libraries: GLib core, GObject and Gio. Those
    three libraries are developed in the Git repository called glib, so when referring
    to "GLib", it can mean "GLib core" or the broader set including GObject and Gio.


    GLib provides data structure handling for C (linked lists, trees, tables, ...),
    portability wrappers, an event loop, threads, dynamic loading of modules and utility
    functions.


    GObject which depends on GLib core simplifies the object-oriented programming
    and event-driven programming paradigms in C. Event-driven programming is not only
    useful for graphical user interfaces (with user events as key presses and mouse
    clicks), but also for daemons that respond to hardware events (a USB stick inserted,
    a second monitor connected, a printer low on power), or software that listens
    to network connections or messages from others, and so on.


    Gio which depends on GLib core and GObject provides high-level APIs for input/output:
    reading a local file, a remote file, a network stream, inter-process communication
    with D-Bus, and many more.


    The GLib libraries can be used to write operating systems, libraries, command
    line utilities and such. GLib offers higher-level APIs than the POSIX standard;
    it is more comfortable to write a C program with GLib.


    GTK+ is a toolkit built on GLib that can be used to develop applications with
    a graphical user interface (GUI). A "widget" is a GUI element, for example a button,
    some text, a menu, etc. And there are some special kinds of widgets that are called
    "containers", which can contain other widgets, to assemble the elements in a window.
    GTK+ provides a broad range of widgets and containers.


    ```

    ¹https://flatpak.org/

    ²https://buildstream.build/

    ³https://www.freedesktop.org/

    ```'
  - '[PAGE 5]


    The first version of GTK+, or the GIMP Tool Kit, was mainly written by Peter Mattis
    in 1996 for the GIMP (GNU Manipulation Program), which has quickly become a general-purpose
    library. The “+” has been added to distinguish between the original version and
    a new version that added object oriented features. GLib started as GTK+, but is
    now a standalone library.


    GLib and GTK+ APIs are documented with GTK-Doc. Special comments are written in
    the source code, and GTK-Doc extracts them to generate HTML pages.


    Although GLib and GTK+ are written in C, language bindings are available for JavaScript,
    Python, Perl and many other programming languages. At the beginning, manual bindings
    were created, which needed to be updated each time the API of the library changed.
    Nowadays the language bindings are generic and thus automatically updated when,
    for example, new functions are added. This thanks to GObject introspection. Special
    annotations are added to the GTK-Doc comments, to explore more information than
    what the syntax can provide, for example ownership of dynamically-allocated content.
    Any library with GObject introspection is thus available from many programming
    languages. In addition, the annotations are also useful to the C programmer because
    it is a good and sufficient way to document recurrent APIs.


    GLib and GTK+ are part of the GNOME Project, whose overall goal is developing
    a free operating system (named GNOME) plus applications to go with. GNOME stands
    for “GNOME’s Not Unix”, a humorous way of saying the GNOME operating system is
    Unix-compatible. You can learn more about GNOME at https://www.gnome.org.


    The GLib/GTK+ web site is: http://www.gtk.org


    # 1.5 The GNOME Desktop


    An important project for GLib and GTK+ is GNOME. which is also part of GNOME,
    a free/libre desktop environment started in 1997 by Miguel de Icaza and Federico
    Mena Mena-Quintero. GNOME makes extensive use of GTK+, and the latter is now developed
    primarily by GNOME developers.


    "GNOME” is actually an acronym: GNOME Network Object Model Environment. Originally,
    the project was intended to create a framework for application objects, similar
    to Microsoft’s O and COM technologies. However, the scope of the project rapidly
    expanded; because that substantial groundwork was required before the “network
    object” part of the name become reality. Versions of GNOME included an object
    embedding architecture called Bonobo, and GNOME 1.0 included a fast, light CORBA
    called ORBit. Bonobo has been replaced by D-Bus, an inter-process communication
    system.


    GNOME has two important faces. From the user’s perspective, it is an integrated


    > ^4The name “GIMP Tool Kit” is now rarely used, today it is more commonly known
    as GTK+ for.


    > ^5For example, whether you need to free the return value.


    > ^6As GTK+, the complete name of GNOME is rarely used and doesn’t reflect today’s
    reality.'
  - '[PAGE 6]


    desktop environment and application suite. From the programmer''s perspective,
    it is an application development framework (made up of numerous libraries that
    are based on GLib and GTK+). Applications written with the GNOME libraries run
    even if the user isn''t running the desktop environment, but they integrate nicely
    with the GNOME desktop if it''s available.


    The desktop environment includes a "shell" for task switching and launching programs,
    a "control center" for configuration, lots of applications such as a web browser,
    a movie player, etc. These programs hide the traditional Unix command line behind
    an easy-to-use graphical interface.


    GNOME''s development framework makes it possible to write concise, easy-to-interoperable
    applications. The designers of windowing systems as X11 or Wayland make a deliberate
    decision not to impose any user interface policies; GNOME adopts a "policy layer,"
    creating a consistent look-and-feel. Finished GNOME applications work well with
    the GNOME desktop, but can also be used "standalone" users only need to install
    GNOME''s shared libraries. A GNOME application isn''t tied to a specific windowing
    system, GTK+ provides backends for the Windows, Wayland, Mac OS X, Windows and
    for a web browser.


    At the time of writing, GLib, GTK+ and GNOME release every six months, March and
    September. A version number has a "major.minor," where "minor" is even for stable
    versions and is for unstable versions. For example, the 3.18.* versions, are stable,
    but the 3.19.* versions are unstable. A new stable version (e.g. 3.18.0 → 3.18.1)
    doesn''t add new features, only translation updates, bug fixes and performance
    improvements. GNOME components are meant to be installed with the same versions,
    alongside the GTK+ and GLib released at the same time; for instance at the time
    of writing, the latest stable versions are: GLib 2.46, GTK+3.18 and GNOME 3.18,
    all released at the same time in September 2015. For a library, a new major version
    usually means there has been an API break, but thankfully previous major versions
    are parallel-installable with the new version. During a development cycle (e.g.
    3.19), there is no API stability guarantees for new features; but by being an
    early adopter your comments are enabled to discover more quickly design flaws
    and bugs.


    More information about GNOME: https://www.gnome.org/


    # 1.6 Prerequisites


    This book assumes that you already have some programming practice. Here is a list
    of recommended prerequisites, with book references.


    +   * This text assumes that you already know the C language. The reference book
    is The C Programming Language, by Brian Kernighan and Dennis Ritchie [1].

    * Object-oriented (OOP) is also required for learning''. You should be familiar
    with concepts like inheritance, an interface, a virtual method or polymorphism.
    A good book, with more than sixty guidelines, is Object-Oriented Design Heuristics,
    by Arthur Rust [2]'
- md: "\n- • Having read book on data structures and algorithms is useful, but you\
