    # 1.4 什么是 GLib 和 GTK+？


    简单来说，GLib 是一组库：GLib 核心、GObject 和 Gio。这三个库开发在名为 glib 的 Git 仓库中，因此当提到“GLib”时，它可以指“GLib
    核心”，也可以指包括 GObject 和 Gio 在内的更集合。


    GLib 为 C 语言提供了数据结构处理（链表、树、表……）、可移植性封装、事件循环、线程、模块动态加载以及实用函数。


    依赖于 GLib 核心 GObject 简化了 C 语言中的面向对象编程和事件驱动编程范式。事件驱动编程不仅对图形用户界面（按键和鼠标点击等用户事件）有用，也适用于响应硬件事件（插入
    USB 闪盘、连接第二个显示器、打印机电量低）或监听网络连接或其他者消息的软件。


    依赖于 GLib 核心和 GObject 的 Gio 为输入输出提供了高级 API：读取本地文件、远程文件、网络流、与 D-Bus 的进程间通信等。


    GLib 库可用于编写操作系统、库、命令行工具等。GLib 提供了比 POSIX 标准更高级的 API；使用 GLib 编写 C 程序更加舒适。


    GTK+ 是构建在 GLib 之上的工具包，可用于开发具有图形用户界面（GUI）的应用程序。“组件”（widget）是一个 GUI 元素，例如按钮、文本、菜单等。还有一些特殊的组件被称为“容器”（containers），它们可以包含其他组件，以组装窗口中的元素。GTK+
    提供了大量的组件和容器。


    ¹https://flatpak.org/

    ²https://buildstream.build/

    ³https://www.freedesktop.org/


    GTK+（或 GIMP Tool Kit）的第一版本主要由 Peter Mattis 于 1996 年为 GIMP（GNU Manipulation Program）编写，它迅速成为一个通用库。添加“+”是为了区分原始版本和增加了面向对象特性的新版本。GLib
    起于 GTK+，但现在是一个独立的库。


    GLib 和 GTK+ 的 API 使用 GTK-Doc 。源代码中写有特殊注释，GTK-Doc 提取它们并生成 HTML 页面。


    尽管 GLib 和 GTK+ 是 C 语言编写的，但为 JavaScript、Python、Perl 等许多编程语言提供了语言绑定。起初，手动创建绑定，每当库的
    API 更改时都需要更新。现在，语言绑定是通用的，因此在添加新函数等情况下会自动更新。这要得益于 GObject 内省（introspection）。GTK-Doc
    注释中添加了特殊注解，以探索比语法能提供的更多信息，例如动态分配内容的所有权。因此，任何带有 GObject 内省的库都可以从许多编程语言中使用。此外，这些注释对
    C 程序员也是很有用的，因为它是记录常用 API 的一种良好且充分的方法。


    GLib 和 GTK+ 是 GNOME 项目的一部分，其总体目标是提供一个免费的桌面环境。桌面环境是一组软件应用程序，允许用户通过图形界面与计算机交互。GNOME
    包含桌面面板、窗口管理器、文件管理器、文本编辑器等。GNOME 桌面设计得易于使用且高度可定制。


    GNOME 桌面可在许多 Linux 发行版可用，如 Fedora、Ubuntu、Debian 等。它也适用于其他操作系统，如 Windows 和 macOS。对于想要简洁现代桌面体验的用户来说，GNOME
    桌面是一个热门选择。


