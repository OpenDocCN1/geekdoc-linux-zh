    \    gchar *argv[])\n{\n    /* 创建主窗口并附加信号回调。 */\n\n    /* 运行主事件循环。 */\n    gtk_main();\n\
    \n    return 0;\n}\n```\n\nGTK+ 循环比 GLib 事件抽象稍微高一级。`gtk_main()` 运行主循环，直到调用了 `gtk_main_quit()`。`gtk_main_quit()`\
    \ 通常在点击关闭按钮或激活 Qt 菜单动作的函数回调中被调用。\n\n回调函数是在发送信号时被调用的函数。系统系统是由 GObject 库实现的。通过 `g_signal_connect()`\
    \ 实现对信号的监听：\n\n```c\nstatic void\nbutton_clicked_cb (GtkButton *button,\n    gpointer\
    \ user_data)\n{\n    MyObject *self = user_data;\n    /* 执行一些事情 */\n}\n```\n\n\
    ```c\nstatic void\ncreate_button (MyObject *self)\n{\n    GtkButton *button;\n\
    \    /* 创建按钮 */\n\n    /* 附加信号回调 */\n    g_signal_connect(button,\n        \"\
    clicked\",\n        G_CALLBACK(button_clicked_cb),\n        self);\n}\n```\n\n\
    当回调返回时，它会阻塞主循环。因此，为了不冻结界面，有两种解决方案：\n\n- 1. 长时操作（尤其是 I/O）可以在另一个线程中启动。\n- 2. 长时操作可以拆分成更小的块，每个块在独立的循环迭代中运行。\n\
    \n```c\n#include <glib.h>\n\ntypedef gboolean (* GSourceFunc)(gpointer user_data);\n\
    \ngint g_idle_add(GSourceFunc function, gpointer data);\ngint g_timeout_add(gint\
