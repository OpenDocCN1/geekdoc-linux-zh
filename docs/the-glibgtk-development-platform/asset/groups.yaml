    \ that the GLib core library uses a semi-object-oriented coding style. This section\
    \ explains what it means, and how to write your own with this style.\n\nOne of\
    \ the main ideas of OOP is to keep related data and behavior in one place¹. In\
    \ C, the data is stored in a struct, and the behavior is implemented with functions.\
    \ To keep those in one place, we put them in the same *c file, with the public\
    \ functions in the corresponding *h file (the header).\n\nAnother important idea\
    \ of OOP is to hide all data within its class, it means the struct full declaration\
