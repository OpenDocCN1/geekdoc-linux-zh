    - • 阅读关于数据结构和算法的书是有用的，但你可以并行学习它们。推荐书籍是 Steven Skiena 编写的《算法设计手册》[4]。

    - • 如果你想在类 Unix 系统上开发软件，另一个前提条件是了解 Unix 的工作原理，并熟悉命令行、一些 shell 脚本以及如何编写 Makefile。一本书是
    Pat Abrahams 写的《给急躁者的 UNIX》[5]。

    - • 这不是强制要求的，但强烈建议使用像 Git 这样的版本控制系统。一本好书是 Scott Chacon 写的《Git》[6]。


    ## 1.7 为什么使用 C 语言？


    GLib 和 GTK+ 库可以被 C 以外的其他编程语言使用。得益于 GObject Introspection，为各种语言提供了自动绑定。GNOME 官方绑定适用于语言：C++、JavaScript、Python
    和 Vala。Vala 是一种基于 GObject 的新编程语言，它直接集成了类似于 C# 的语法。除了 GNOME 绑定外，GLib 和 GTK+ 可以在十多种编程语言中获得不同程度的支持。那么为什么以及何时选择
    C 语言呢？对于在 Unix 系统上编写守护进程，C 是事实上的语言。但对于应用程序来说，它并不那么明显。为了回答这个问题，让我们先看看如何构建代码库。


    ### 1.7.1 将后端与前端分离


    良好的做法是将用户界面与应用程序的其他部分分离开。由于多种原因，应用程序的图形界面往往是易变且不断变化的。在编写代码时计划并执行分离是理想的——你通常在你写完之后才会发现某些方面使用起来很不方便。不同的用户界面，例如命令行版本或基于
    Web 的界面。


    在实际操作中，这意味着任何应用程序都应该在前、接口和后端之间有彻底的分。后端应该包含所有的“硬部分”；算法和数据结构是应用程序完成的实际工作。将其视为一个被用户显示和操作的抽象“模型”（model）。


    每个前端都应该是“视图”（view）和一个“控制器”（controller）。作为“视图”，前端不能忽略后端的更改，并相应地更新显示。作为“控制器”，前端必须允许用户向后端发送请求（这定义了前端的操作如何转化为更改）。


    有很多方法可以约束自己以保持应用程序的独立。一些实用的想法：


    > https://wiki.gnome.org/Projects/Vala


    - • 将后端写成一个库。在开始，库可以是应用程序内部的并静态链接的，不需要 API/ABI 稳定性保证。当项目增长时，如果代码对其他程序有用，你可以轻松地将后端转换为共享库。

    - • 从开始就至少编写两个前端；一个或两个可以是丑陋的原型，你只需要获得一个如何构建后端的想法。记住，前端应该是简单的；后端才是硬性部分。


    C 语言是应用程序后端部分的良好选择。通过使用 GObject 和 GObject Introspection，你的库将适用于用各种编程语言编写的项目。另一方面，Python
    或 JavaScript 库无法在其他语言中使用。对于前端来说，高级高级语言可能更方便，这取决于你已经精通哪些语言。


    ### 1.7.2 需要注意的其他方面


    如果你对选择什么语言感到犹豫，这里有其他需要注意的方面。请注意，本文略有偏见，因为选择了 C 语言。


    C 是一种静态类型语言：程序中的变量类型和函数原型在编译时都是已知的。编译器可以发现许多微小的错误，例如函数名中的拼写错误。在进行代码重构时，编译器也有极大的帮助，这对于程序的长期维护至关重要。例如，当你将一个类拆分为二时，如果使用初始代码没有更新，编译器会告诉你。通过测试驱动开发（TDD）并为所有内容编写测试，在
    Python 等动态类型语言中编写大型代码库也是可行的。具有很高的覆盖率，单元测试会在重构代码时检测错误。但单元测试的执行速度比编译代码慢得多，因此测试也会影响程序的行为。所以，进行代码重构时运行所有测试并不方便。当然，编写单元测试对于
    C 代码库也是良好的做法！然而，如果开发者对应用程序进行了良好的测试，编写代码 GUI 通常不是首要任务。


    C 是一种显式类型语言：变量在代码中可见的。你通常不需要添加注释来解释变量的内容。了解变量的类型对于理解代码很重要，了解变量代表什么以及可以在其上调用函数。在相关问题上，self
    对象显式地作为函数参数传递。因此，通过 self 指针访问属性时，你知道该属性的来源。某些面向对象的语言也为此目的使用，但它是可选的，类似于 C++ 或 Java。在后的情况下，一个实用的文本编辑器功能是进行不同的高亮。

    '
