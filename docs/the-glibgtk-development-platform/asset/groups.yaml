    # 1.3 Todo List for this Book and a Quick 2019 Update


    +   - Make chapter 5 (about GTK) easier to understand and adapt the rest of the
    document to better integrate the chapter;


    +   - GTK+ has been renamed to GTK, the plus sign has been dropped. Adapt the
