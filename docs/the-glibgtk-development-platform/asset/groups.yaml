    ## 1.9 The Development Environment


    This section describes the environment typically used when programming with GLib
    and GTK+ on a Unix system. On a GNU/Linux distribution, a single package or group
    can be installed to get a full development environment, including not limited
    to:


    - C89-compatible compiler, GCC for instance;

    - the GNU debugger GDB;

    - GNU Make;

    - Autotools (Autoconf, Automake and libtool);

    - the man-pages of Linux kernel and glibc


    Using GLib and GTK+ as a developer, there are several solutions: The name of the
    packages ends with one of the following suffixes: -devel, -dev or -doc. For example
    glib2-devel and glib2-doc on Fedora, Ubuntu, Xamarin Studio, Geany, or GNOME Builder.


    To read the API documentation of GLib and GTK+, Devhelp is a handy application,
    if you have installed the -dev or -doc package. They are also available online:
    https://developer.gnome.org/glib/


    ## Chapter 2 GLib, the Core Library


    GLib is a low-level library that forms the basis for projects such as GTK+ and
    Gnome. It provides data structures, utility functions, and essential functionality
    such as event loop and threads. GLib is simple and available on most Unix-like
    systems and Windows. This chapter covers some of the most commonly used features.
    GLib is simple, and the concepts are familiar; so we''ll move quickly. For more
    complete coverage of GLib, see the development environment, see section 1.9 on
    p. 10). By the way: if you have specific questions about the implementation, don''t
    be afraid to look at the source code. Normally the documentation contains enough
    information, but if you come across a missing detail, please file a bug. GLib''s
    various facilities are intended to have a consistent interface; the coding style
    is semi-object-oriented, and identifiers are prefixed with "g" to create a namespace.
    GLib has a few headers:


    - glib.h, the main header;

    - gmodule.h for dynamic loading of modules;

    - glib-unix.h for Unix-specific APIs;

    - glib/gtype.h and glib/gchar.h for internationalization;

    - glib/gstr.h and;

    - glib/printf.h and glib/gio.h to avoid pulling in all of stdio.


    ## 2.1 Basics


    GLib provides substitutes for many standard and commonly used C language constructs.
    This section describes GLib''s fundamental type definitions, macros, memory allocation
    routines, and string utility functions.


    ### 2.1.1 Type Definitions


    Rather than using C''s standard types (int, long, etc.) GLib defines its own a
    variety of purposes. For example, gint32 is guaranteed to be 32 bits wide, something
    no standard C89 type can ensure. guint is easier type than unsigned. A few of
    the typedefs exist only for consistency; for example, gchar is always equivalent
    to the standard char.


    The most important primitive types defined by GLib:


    - gint8, uint8, gint16, uint16, gint32, uint32, gint64, uint64 — give you integers
    of a guaranteed size. (If it is unsigned, the types are signed.)

    - gboolean is useful to make your code more readable, since C89 has no bool type.

    - gchar, gshort, glong, glint, gfloat, gdouble are purely cosmetic.

    - gpointer is more convenient to type than void *. (const gpointer will not do;
    spend some time with a good book on C if you don''t see why.)

    - gsize is an unsigned integer type that can hold the sizeof operator.


    ### 2.1.2 Frequently Used Macros


    GLib defines a number of familiar macros used in many C programs, shown in Listing
    2.1. All of these will be self-explanatory. MIN()/MAX() return the smaller or
    larger of their arguments. ABS() returns the absolute value of its argument. CLAMP(x,
    low, high) means x, unless x is outside the range [low; high]; if x is below the
    range, low is returned; if x is above the range, high is returned. In addition
    to the macros shown in Listing 2.1, TRUE/FALSE/NULL are defined as the usual 1/0/(void*)0).


    There are also many unique to GLib, such as the gpointer-to-int and gpointer-to-uint
    conversions shown in Listing 2.2.


    ```c

    #include <glib.h>


    MAX(a, b);

    MIN(a, b);

    ABS(x);

    CLAMP(x, low, high);

    ```

    Listing 2.1: Familiar Macros


    ```c

    #include <glib.h>


    GINT_TO_POINTER(p);

    GPOINTER_TO_INT(p);

    GUINT_TO_POINTER(p);

    GPOINTER_TO_UINT(p);

    ```

    Listing 2.2: Macros for storing integers in


    ```c

    #include <glib.h>


    g_return_if_fail(condition);

    g_return_val_if_fail(condition, return_value);

    ```

    Listing 2.3: Precondition Checks


    Most GLIB''s structures are designed to store a gpointer. If you want to store
    pointers to dynamically allocated objects, this is the right thing. However, sometimes
    you want to store a simple list of integers without having to dynamically allocate
    them. Though the C standard does not strictly guarantee it, it is possible to
    store a guint in a gpointer. To do that portably, you must store the pointer in
    a pointer of a long. (It''s undoubtedly a bad idea to do so, however.)


    Here''s an example:


    ```c

    my_int;

    gpointer my_pointer;


    my_int = 5;

    my_pointer = GUINT_TO_POINTER(my_int);

    printf("%d\n", GPOINTER_TO_INT(my_pointer));

    ```


    ## 1.1 Acknowledgments


    Thanks to: Christian Stadelmann, Errol de, Andrew Kissa, and Dupont.

