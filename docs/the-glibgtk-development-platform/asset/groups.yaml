  - "[PAGE 62]\n\nProcess uniqueness has several advantages, to give a few concrete\
    \ examples:\n\n+   - For an application with a tabbed document interface, when\
    \ clicking on a file in a manager like Nautilus, the file can be opened in a new\
    \ tab instead of creating each a new window. For this work, inter-process communication\
    \ is needed in one form or another;\n\n+   - An application doesn't need to synchronize\
    \ its state and different processes. For the sake of argument, let's say that\
    \ in gedit user create custom \"build tools\", compile the current file or project.\
    \ gedit saves the custom build tools in an XML file and are shown in the menu\
    \ to execute their commands. On Linux, the XML file is saved for example in the\
    \ user's ~/.local/share/ directory. Without uniqueness, if one gedit process modifies\
    \ the custom tools, the other gedit processes must reload the XML file, and need\
    \ to ensure that there are no races (two different processes modify the XML file\
    \ at the same time). With uniqueness, that problem doesn't exist, the gedit windows\
    \ share the same application state, and the developer can assume only one process\
    \ per user can modify the XML file³of the user still has the possibility to edit\
    \ the XML file by hand, but in that case the application runs uniquely and the\
    \ user is expected to modify the tools from GTK (that provides them).\n\nAnother\
    \ important feature of GApplication is to run the main event loop. The GLib main\
    \ loop was described in section 2.3 p. 31. With GApplication, this is done with\
    \ the g_application_run() function. A minimalistic version of the main() function\
    \ in gedit would look like:\n\n```\nint\nmain (int argc,\n    char**argv)\n{\n\
    GEditApp *app;\nint status;\n\n/* Init i18n (internationalization) here. */\n\n\
    app = gedit_application_new();\nstatus = g_application_run(G_APPLICATION (app),\
    \ argc, argv);\ng_object_unref(app);\n\nreturn status;\n}\n```\n\nWhat Gedit does\
    \ basically is what would need to be done in main() if there was no GApplication\
    \ subclass. This includes:\n\n> Note this would not be true if it was possible\
    \ to run several graphical sessions for the same user, on the same machine (which\
    \ is supported) or at least sharing the backing storage for the home directory\
    \ (for example with NFS mounts). But GNOME and most applications don't support\
    \ this, a user can open at most one graphical session at a time for the same home\
    \ directory. On the physical machine, this is enforced by GDM (the GNOME display\
    \ manager) and D-Bus. For NFS mounts this is not enforced, but if the same user\
    \ opens several graphical sessions on different computers, some programs might\
    \ misbehave. Although GApplication process uniqueness is documented as per session,\
    \ in practice we can say it is simply per user."
