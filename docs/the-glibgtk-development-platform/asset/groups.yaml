    # Chapter 4


    # # A Gentle Introduction to GObject


    In the previous chapter we have learned how to write semi-object-oriented code
    in C. This is how the classes in GLib are written. GObject goes several steps
    further into Object-Oriented Programming, with inheritance, interfaces, virtual
    functions, and GObject also simplifies the event-driven programming paradigm,
    with signals and properties.


    It is recommended to create your own GObject classes for writing a GLib/GTK+ application.
    Unfortunately the code is a little verbose, because the C language is not object-oriented.
    Boilerplate code is needed for some features, but don''t be afraid, there are
    tools and scripts to generate the boilerplate.


    However this chapter takes a step back from the previous chapter, it is just a
    small introduction to GObject; it will explain the essential things to know how
    to use an existing GObject class (like all GTK+ widgets and classes in Gio). It
    will not explain how to create your own GObject classes, because it is already
    well covered in the GObject reference manual, and the goal of this book is not
    to duplicate the whole content of the reference manuals, the goal is to serve
    as a starting guide.


    For more in-depth information on GObject and how to know how to create subclasses,
    the GObject reference documentation contains introductory chapters: "Concepts"
    and "Tutorial", available at:


    ```

    https://developer.gnome.org/gobject/stable/

    ```


    To explain concepts, some examples are taken from GTK+ or Gio. When reading this,
    you are encouraged to open in parallel Devhelp, to look at the API reference and
    see for yourself how a GObject-based library is documented. The goal is that you
    become autonomous and be able to learn any new GObject class, be it in Gio, GTK+
    or any other library.


    # ## 4.1 Inheritance


    An important concept of OOP is inheritance. A class can be a sub-class of a parent
    class. The sub-class inherits the features of the parent class, extending or overriding
    its behavior.'
