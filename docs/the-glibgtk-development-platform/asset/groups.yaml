    \ highly recommended to use a version control system like Git. A good book is\
    \ Pro Git, by Scott Chacon [6].\n\n## 1.7 Why and When Using the C Language?\n\
    \nThe GLib and GTK+ libraries can be used by other programming languages than\
    \ C. Thanks to GObject Introspection, automatic bindings are available for a variety\
    \ of languages for all libraries based on GObject. Official GNOME bindings are\
    \ available for the following languages: C++, JavaScript, Perl, Python and Vala.\
    \ Vala is a new programming language based on GObject which integrates the peculiarities\
    \ of GObject directly in its C#-like syntax. Beyond the GNOME bindings, GLib and\
    \ GTK+ can be used in more than a dozen programming languages, with a varying\
    \ level of support. So why and when choosing the C language? For writing a daemon\
    \ on a Unix system, C is the de facto language. But it is less obvious for an\
    \ application. To answer the question, let's first look at how to structure an\
    \ application codebase.\n\n### 1.7.1 Separate the Backend from the Frontend\n\n\
    A good practice is to separate the graphical user interface from the rest of the\
    \ application. For a variety of reasons, an application's graphical interface\
    \ tends to be an exceptionally volatile and ever-changing piece of software. It's\
    \ the focus of most user requests for change. It is desirable to plan and execute\
    \ the first time around - often you will discover that some aspect of it is unpleasant\
    \ to use only after you have written it. Having different user interfaces sometimes\
    \ desirable, for example a command-line version, or a web-based interface.\n\n\
    In practical terms, this means that any application should have a radical separation\
    \ between its frontend, or interfaces, and the backend. The backend should contain\
    \ all the \"hard parts\"; your algorithms and data structures, the real work done\
    \ by the application. Think of it as an abstract \"model\" being displayed and\
    \ manipulated by the user.\n\nEach frontend should be a \"view\" and a \"controller.\"\
    \ As a \"view\", the frontend must not ignore changes in the backend, and change\
    \ the display accordingly. As a \"controller\", the frontend must allow the user\
    \ to relay requests for change to the backend (it defines how manipulations of\
    \ the frontend translate into changes)\n\nThere are many ways to discipline yourself\
    \ to keep your application separated. A couple of useful ideas:\n\n> https://wiki.gnome.org/Projects/Vala\n\
    \n- • Write the backend as a library. At the beginning the library can be internal\
    \ to the application and statically linked, without API/ABI stability guarantees.\
    \ When the project grows up, and if the code is useful for other programs, you\
    \ can easily turn your backend into a shared library.\n\n- • Write at least two\
    \ frontends from the start; one or both can be ugly prototypes, you just want\
    \ to get an idea how to structure the backend. Remember, frontends should be easy;\
    \ the backend has the hard parts.\n\nThe C language is a good choice for the backend\
    \ part of an application. Using GObject and GObject Introspection, your library\
    \ will be available for other projects written in various programming languages.\
    \ On the other hand, a Python or JavaScript library cannot be used in other languages.\
    \ For the frontend(s), a higher-level language may be more convenient, depending\
    \ on what languages you are already proficient with.\n\n### 1.7.2 Other Aspects\
    \ to Keep in Mind\n\nIf you're hesitant about the language to choose, here are\
    \ other aspects to keep in mind. Note that this text is a little biased since\
    \ the C language has been chosen.\n\nC is a static-typed language: the variable\
    \ types and function prototypes in a program are all known at compilation time.\
    \ Lots of trivial errors are discovered by the compiler, such as a typo in a function\
    \ name. The compiler is also a great help when doing code refactoring, which is\
    \ essential for the long-term maintainability of a program. For example when you\
    \ split a class in two, if the code using the initial class is not updated, the\
    \ compiler will tell you so. With test-driven development (TDD), and by writing\
    \ tests for everything, writing a huge codebase in a dynamic-typed language like\
    \ Python is also feasible. With very code coverage, the unit tests will detect\
    \ errors when refactoring the code. But unit tests can be much slower to execute\
    \ than compiling the code, so tests also the program behavior. So it's not convenient\
    \ to run all tests when doing code refactoring. Of course writing unit tests is\
    \ also a good practice for a C codebase! However the GUI of the code, writing\
    \ is often not a high-priority task if the application is well tested by its developers.\n\
    \nC is an explicit-typed language: the variables are visible in the code. You\
    \ usually don't need to add comments to explain what the variables contain. Knowing\
    \ the type of a variable is important to understand the code, knowing what the\
    \ variables represents and functions can be called on. On a related matter, the\
    \ self object is passed explicitly as a function argument. Thus when an attribute\
    \ is accessed through the self pointer, you know where the attribute comes from.\
    \ Some object-oriented languages use this for that purpose, but it is optional\
    \ like in C++ or Java. In this latter case, a useful text editor feature is to\
    \ highlight differently attributes, even when the keyword is not used, you know\
    \ that it's an attribute and not a local variable. With the self object passed\
    \ as an argument, there is no possible confusions\n\nThe C language has a very\
    \ good toolchain: compilers (GCC, Clang, ... text editors (Vim, Emacs, ...), debuggers\
    \ (GDB, Valgrind, ...), static-analysis tools, ...\n\nFor some programs, a garbage\
    \ collector is not appropriate because it pauses the program regularly. In this\
    \ case, manual memory management in C is a solution. \n\nMore importantly, the\
    \ GLib/GTK+ API documentation is primarily written for the C language. Reading\
    \ the documentation while programming in the language is not convenient. Some\
    \ tools are currently in development to generate the API documentation for other\
    \ languages, so hopefully in the future it won't be a problem.\n\nGLib/GTK+ are\
    \ themselves written in C. So programming in C, there is no extra layer. An extra\
    \ layer is potentially a source of additional bugs and maintenance burdens. Moreover,\
    \ using C language is probably better for pedagogical purposes. A higher-level\
    \ language can hide some details about GLib/GTK So the code is shorter, but when\
    \ you have a problem you need to understand not only the library feature works,\
    \ but also the language binding works.\n\nThat said, if (1) you're not comfortable\
    \ in C, (2) you're already proficient with a higher-level language with GObject\
    \ Introspection support, (3) you plan to write just a small application or plugin,\
    \ then choosing the higher-level language makes perfect sense.\n\n## 1.8 Learning\
    \ Path\n\nNormally this section should be named \"Structure of the Book\", but\
    \ as you can see the book is finished, so instead the section is named \"Learning\
    \ Path\".\n\nThe logical learning path is:\n\n- 1. The basics of GLib core;\n\
    - 2. Object-Oriented Programming in C and the basics of GObject;\n- 3. GTK+ and\
    \ GIO in parallel.\n\nSince GTK+ is based on GLib and GObject, it is better to\
    \ understand the basics of those libraries first dive directly into GTK+, so after\
    \ a short period of time you can display a window with text and three buttons;\
    \ it's fun, knowing GLib and GObject is not a luxury if you want to understand\
    \ what you're doing, and a realistic GTK+ application extensively\n"
