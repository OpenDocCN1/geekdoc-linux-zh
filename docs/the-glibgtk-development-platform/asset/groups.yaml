  - "[PAGE 54]\n\nThe Listing 4.5 shows a complete example of how to disconnect a\
    \ signal handler when its user_data argument is freed. We come back to an example\
    \ with a spell checker, because the GTK+ button doesn't fit well the situation.\n\
    \nThe user_data callback argument is a MyTextView instance, with MyTextView implemented\
    \ with a semi-OOP style. Since the spell checker can live longer than the MyTextView\
    \ instance, the signal needs to be disconnected from the MyTextView destructor.\n\
    \n```\n#include <glib-object.h>\n\nttypedef struct _MyTextView MyTextView;\n\n\
    struct _MyTextView\n{\n GSpellChecker *spell_checker;\n gulong word_added_to_personal_handler_id;\n\
    };\n\nstatic void\nword_added_to_personal_cb (GSpellChecker *spell_checker,\n\
    const gchar *word,\ngpointer user_data)\n{\n MyTextView *text_view = user_data;\n\
    \ng_message(\"Word '%s' has been added to the user's personal \"dictionary. text_view=%xp\
    \ will be added accordingly.\",\nword,\ntext_view);\n}\n\nMyTextView *\nmy_text_view_new\
    \ (GSpellChecker *spell_checker)\n{\n MyTextView *text_view;\n\ng_return_val =\
    \ g_return_fail(SPELL_IS_CHECKER(spell_checker), NULL);\n\ntext_view = g_new (MyTextView,\
    \ 1);\n```\n\n+   * We store the spell_checker GObject in the instance variable,\
    \ so\n* we increase the reference count to be sure that spell_checker\n* stays\
    \ alive during the lifetime of text_view.\n\n+   * Note that spell_checker is\
    \ provided externally, so spell_checker\n* can live longer text_view, hence the\
    \ need to disconnect the\n* signal in my_text_free().\n\n> ³Most of the time a\
    \ GTK+ widget doesn't live longer than the container that it is added to, and\
    \ the object being is usually the container itself. If the widget dies at the\
    \ same time as the container, it is not possible for the widget to send a signal\
    \ while its container has already been destroyed. In that case, there is no point\
    \ in disconnecting the signal in the container destructor, since at that point\
    \ the widget is already freed, and it's harder for a dead object to send a signal⁴.\n\
    \n> ⁴When I say that it is harder, it is actually impossible, of course."
