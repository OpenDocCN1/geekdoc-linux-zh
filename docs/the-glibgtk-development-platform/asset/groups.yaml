- md: "\nThe basic `g_signal_handler_disconnect()` function has been used for learning\
    \ purposes.\n\nNote also that if MyTextView was a GObject class, it would have\
    \ been possible to connect to the spell checker signal with `g_signal_connect_object()`,\
    \ and it would have removed completely the need to manually disconnecting the\
    \ signal handler in the MyTextView destructor. One more (small) reason to learn\
    \ how to create GObject-classes.\n\n## 4.5.3 Properties\n\nIf you have looked\
    \ the GTK+ or GIO API reference, you might have noticed that some GObject classes\
    \ have one or more properties. An instance variable, also called \"attribute\"\
    , is different in the GObject context because it has additional interesting properties.\n\
    \nAs previously stated at the beginning of section 4.5 p.50, a good example of\
    \ a property is the state of a button, a boolean value describing whether the\
    \ button is checked or not. If you already know a little GTK+, you might have\
    \ found that a check button is available with the GtkCheckButton widget. But there\
    \ was a trap if you wanted to find the property that I was talking about, because\
    \ the property is implemented in the parent class GtkToggleButton: the GtkToggleButton::active\
    \ property⁶\n\n## The \"notify\" Signal\n\nThe main attribute of a property beside\
    \ representing a value — is that the GObject class emits `GObject::notify` signal\
    \ when the value of a property changes.\n\nThere is one connect of GObject signals\
    \ that is not yet explained and is used with `GObject::notify` signal: when emitting\
    \ a signal, a detail can be provided. In the case of the notify signal, the detail\
    \ is the name of the property whose value has changed. Since there is only one\
    \ signal for all properties, thanks to the detail it is possible to connect a\
    \ callback to be notified only when a certain property has changed. The detail\
    \ is not provided when connecting the callback, the callback would be called when\
    \ any of the object properties change, which is generally not was wanted.\n\n\
    It will be clearer with an example. The Listing 4.6 p. 57 shows how to connect\
    \ to the notify signal. Instead of connecting to the `GObject::activate` signal,\
    \ it is actually more convenient to use the GtkToggleButton::toggled signal. There\
    \ are better real-world use-cases where it is needed to connect to the notify\
    \ signal, but at least the Listing 4.6 is hopefully understandable with limited\
    \ GTK+ knowledge (and if you look at the documentation in Devhelp in parallel).\n\
    \n> ⁵Pun intended.\n⁶In the same way as signals are documented with Gtk-Doc as\
    \ \"ClassName::signal-name\", properties are documented as \"ClassName:property-name\"\
