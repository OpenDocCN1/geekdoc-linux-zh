    \ to any signal of any GOObject class, so the function pointer needs to be cast.\n\
    \nThere are two naming conventions to connect callback functions:\n\n- End the\
    \ function name with \"cb\", shortcut for \"callback\". For example: button_clicked_cb()\
    \ is in the above code example.\n- Start the function name with \"on\". For example:\
    \ on_button_clicked().\n\nWith one of those naming conventions — and the gpointer\
    \ user_data parameter, which is always the last parameter — it is easy to recognize\
    \ that a function is a callback.\n\n> The convention referring to a GOObject signal\
    \ is \"ClassName::signal-name\". That's how it's documented with GTK-Doc comments.\n\
    \n```c\n/* Normal GObject */\na_normal_gobject = normal_gobject_new();\n/* a_normal_gobject\
    \ has now a reference count of 1. */\n\ncontainer_add(container, a_normal_gobject);\n\
    /* a_normal_gobject has now a reference count of 2. */\n\n/* We no longer need\
    \ a_normal_gobject, so we unref it. */\ng_object_unref(a_normal_gobject);\n/*\
    \ a_normal_gobject has now a reference count of 1. */\n```\n\nListing 4.1: Memory\
    \ management of normal GObjects.\n\n```c\n/* GInitiallyUnowned object, e.g. a\
    \ GtkWidget */\nwidget = gtk_entry_new();\n/* widget has now just a floating reference.\
    \ */\n\ntk_container_add(container, widget);\n/* The container has called g_object_ref_sink(),\
    \ taking\n * ownership of the floating reference. The code is is\n * simplified\
    \ because we must not call g_object_unref(). */\n```\n\nListing 4.2: Memory management\
    \ of GObjects deriving from GInitiallyUnowned.\n\n```c\nvoid\nuser_function (GtkButton\
    \ *button,\n               gpointer user_data);\n```\n\nListing 4.3: The prototype\
    \ of the GtkButton::clicked signal.\n\n```c\nstatic void\nbutton_clicked_cb (GtkButton\
    \ *button,\n  gpointer user_data)\n{\n  MyClass *my_class = MY_CLASS (user_data);\n\
    \n  g_message (\"Button clicked!\");\n}\n\nstatic void\ncreate_button (MyClass\
    \ *my_class)\n{\n  GtkButton *button;\n\n  /* Create the button */\n  /* ... */\n\
    \n  /* Connect the callback function */\n  g_signal_connect(button,\n    \"clicked\"\
    ,\n    G_CALLBACK (button_clicked_cb),\n    my_class);\n}\n```\n\nListing 4.4:\
    \ How to connect to a signal\n\nThe C language permits to write a different —\
    \ but compatible callback function, although it is not universally seen as a good\
    \ thing to do:\n\n- One or more of the last function argument(s) can be omitted\
    \ if they are not used. But as explained above the gpointer user_data argument\
    \ permits to easily recognize the function is effectively a callback.\n- The types\
    \ of the arguments can be modified to a compatible type: e.g. another class in\
    \ the inheritance hierarchy, or in the example above, replacing \"pointer\" by\
    \ \"MyClass\" (but doing that makes the code a bit less robust because the MY_CLASS()\
    \ macro is not called).\n\n## 4.5.2 Disconnecting Signal Handlers\n\nIn Listing\
    \ 4.4, button_clicked_cb() is called each time that the button object emits the\
    \ \"clicked\" signal. If the button is still alive after my_class is freed, the\
    \ signal will be emitted again there will be a little problem... In the destructor\
    \ of MyClass, the signal handler (the callback) must be disconnected. How to do\
    \ it?\n\nThe g_signal_connect() function returns an ID that can be used to disconnect\
    \ the handler later using g_signal_handler_disconnect().\n\n> The convention referring\
    \ to a GOObject signal is \"ClassName::signal-name\". That's how it's documented\
    \ with GTK-Doc comments.\n"
  mdcn: "\n要创建你自己的信号或属性，必须创建一个 GOObject 的子类。正如本章引言中所，这超出了本书的范围，但你应该意识到，创建你自己的信号或属性是完全可能的，并且是推荐的。事实上，创建一个\
    \ GOObject 信号或属性是实现**观察者模式** [3] 的良好方法；即通过连接函数回调，让一个或多个对象观察另一个对象的状态变化。发射信号的对象并不知道哪些对象接收了它。GOObject\
    \ 负责维护要调用的回调列表。因此，添加信号允许类之间进行解耦。\n\n## 4.5.1 将回调函数连接到信号\n\n为了让这些内容更具体，如果你查看 GtkButton\
    \ 的文档，你会发现它提供了 \"clicked\" 信号。为了在信号发射时执行所需的操作，必须预先连接一个或多个回调函数。\n\n要将回调连接到信号，可以使用\
    \ `g_signal_connect()` 函数，或者其他的 `g_signal_connect_*` 函数之一：\n\n- g_signal_connect()\n\
    - g_signal_connect_after()\n- g_signal_connect_swapped()\n- g_signal_connect_data()\n\
    - g_signal_connect_object()\n- 以及一些高级函数。\n\n代码列表 4.3 第 52 页显示了 GtkButton::clicked\
    \ 信号。当使用 `g_signal_connect()` 时，回调函数的原型必须与信号的原型相同。某些信号具有更多参数，某些信号则返回一个值。如果回调原型不兼容，就会发生糟糕的事情，出现随机的\
    \ bug 或崩溃。\n\n代码列表 4.4 第 53 页展示了如何使用 `g_signal_connect()` 的示例。使用 `G_CALLBACK()`\
    \ 是必要的，因为 `g_signal_connect()` 是通用的：它可以被用于连接到任何 GOObject 类的任何信号，因此函数指针需要进行类型转换。\n\
    \n连接回调函数有两种命名规范：\n\n- 函数名以 \"cb\" 结尾，是 \"callback\" 的缩写。例如，在上面的代码示例中使用了 `button_clicked_cb()`。\n\
    - 函数名以 \"on\" 开头。例如：`on_button_clicked()`。\n\n通过这些命名规范之一——加上始终作为最后一个参数的 `gpointer\
    \ user_data` 参数——可以很容易识别出一个函数是否是回调。\n\n> 引用 GOObject 信号的规范是 \"ClassName::signal-name\"\
    。这是在 GTK-Doc 注释中记录的方式。\n\n```c\n/* Normal GObject */\na_normal_gobject = normal_gobject_new();\n\
    /* a_normal_gobject 现在的引用计数为 1. */\n\ncontainer_add(container, a_normal_gobject);\n\
    /* a_normal_gobject 现在的引用计数为 2. */\n\n/* 我们不再需要 a_normal_gobject，所以对其进行取消引用。 */\n\
    g_object_unref(a_normal_gobject);\n/* a_normal_gobject 现在的引用计数为 1. */\n```\n\n\
    代码列表 4.1：普通 GObject 的内存管理。\n\n```c\n/* GInitiallyUnowned 对象, 例如一个 GtkWidget */\n\
    widget = gtk_entry_new();\n/* widget 现在有一个浮动引用。 */\n\ntk_container_add(container,\
    \ widget);\n/* container 调用了 g_object_ref_sink()，获取了\n * 浮动引用的所有权。代码被简化了，\n *\
    \ 因为我们不能调用 g_object_unref()。 */\n```\n\n代码列表 4.2：继承自 GInitiallyUnowned 的 GObject\
    \ 的内存管理。\n\n```c\nvoid\nuser_function (GtkButton *button,\n               gpointer\
    \ user_data);\n```\n\n代码列表 4.3：GtkButton::clicked 信号的原型。\n\n```c\nstatic void\n\
    button_clicked_cb (GtkButton *button,\n  gpointer user_data)\n{\n  MyClass *my_class\
    \ = MY_CLASS (user_data);\n\n  g_message (\"Button clicked!\");\n}\n\nstatic void\n\
    create_button (MyClass *my_class)\n{\n  GtkButton *button;\n\n  /* 创建按钮 */\n \
    \ /* ... */\n\n  /* 连接回调函数 */\n  g_signal_connect(button,\n    \"clicked\",\n\
    \    G_CALLBACK (button_clicked_cb),\n    my_class);\n}\n```\n\n代码列表 4.4：如何连接到信号\n\
    \nC 语言允许编写不同的但兼容的回调函数，尽管这并不被普遍认为是一种好做法：\n\n- 如果最后一个或多个函数参数没有被使用，可以省略。但如上文所述，`gpointer\
    \ user_data` 参数允许轻松识别出该函数实际上是一个回调。\n- 参数的类型可以修改为兼容的类型：例如继承层次结构中的另一个类，或者在上面的示例中，将\
    \ \"pointer\" 替换为 \"MyClass\"（但这样做会导致代码不够健壮，因为没有调用 `MY_CLASS()` 宏）。\n\n## 4.5.2\
    \ 断开信号处理器\n\n在代码列表 4.4 中，每当按钮对象发射 \"clicked\" 信号时，`button_clicked_cb()` 就会被调用。如果当\
    \ `my_class` 释放后按钮仍然存，信号将再次发射，这会产生一个小问题……在 `MyClass` 的析构函数中，必须断开信号处理器（回调）。如何做到这一点？\n\
    \n```c\n#include <glib.h>\n\nstruct _MyTextView {\n    GObject parent_instance;\n\
    \    GObject *spell_checker;\n    gulong added_to_handler_id;\n};\n#define MY_TYPE_TEXTVIEW\
    \ (my_textview_get_type())\nstatic GType my_textview_get_type(void);\ntypedef\
    \ struct _MyTextView MyTextView;\n#define MY_TEXTVIEW(obj) (MyTextView *)(obj)\n\
    \nstatic void\nword_added_to_personal_cb (Object *spell_checker,\n           \
    \      gchar *word,\n                 gpointer user_data)\n{\n  MyTextView *text_view\
    \ = MY_TEXTVIEW(user_data);\n\n  g_message(\"Word '%s' has been added to dictionary.\"\
    , word);\n}\n\nMyTextView *\nmy_textview_new (GObject *spell_checker)\n{\n  MyTextView\
    \ *text_view;\n\n  text_view = g_object_new (MY_TYPE_TEXTVIEW, NULL);\n\n  text_view->spell_checker\
    \ = g_object_ref (spell_checker);\n\n  text_view->added_to_handler_id = g_signal_connect(spell_checker,\n\
    \    \"word-added-to-personal\",\n    G_CALLBACK (word_added_to_personal_cb),\n\
    \    text_view);\n\n  return text_view;\n}\n\nvoid\nmy_textview_free (MyTextView\
    \ *text_view)\n{\n  if (text_view == NULL)\n    return;\n\n  if (text_view->spell_checker\
    \ != NULL &&\n      text_view->added_to_handler_id != 0)\n    g_signal_handler_disconnect\
    \ (text_view->spell_checker,\n      text_view->added_to_handler_id);\n\n  /* 这里将值置为\
    \ 0 是没有必要的，因为\n   * text_view 将会被释放，这只是为了有一个完整的示例。 */\n  text_view->added_to_handler_id\
    \ = 0;\n\n  /* 在减少引用计数后，如果程序的其他部分仍然引用\n   * spell_checker，则它可能仍然存活。 */\n  g_clear_object\
    \ (&text_view->spell_checker);\n\n  g_free (text_view);\n}\n```\n\n在代码列表 4.4 中，每当按钮对象发射\
    \ \"clicked\" 信号时，`button_clicked_cb()` 就会被调用。如果当 `my_class` 释放后按钮仍然存，信号将再次发射，这会产生一个小问题……在\
    \ `MyClass` 的析构函数中，必须断开信号处理器（回调）。如何做到这一点？\n\n`g_signal_connect()` 函数返回一个 ID，稍后可以使用\
    \ `g_signal_handler_disconnect()` 用来断开处理器。\n\n> 引用 GOObject 信号的规范是 \"ClassName::signal-name\"\
    。这是在 GTK-Doc 注释中记录的方式。\n"
