    \ practice to prepare the backend of an application from its frontend(s), and\
    \ write the backend as an internal library, or, later, a shared library. As such,\
    \ it is recommended to document the public API of the backend with GTK-Doc, even\
    \ if it is still an internal, statically-linked library. When the codebase becomes\
    \ larger, it is a great help – especially for newcomers – to have an overview\
    \ of the available classes, and to know how to use a class without the need to\
    \ understand its implementation.\n\n# 3.2.3 GObject Introspection Annotations\n\
    \nThe GTK-Doc comment for the myapp_spell_checker_get_suggestions() function contains\
    \ GObject Introspection annotations for the return value:\n\n```\n/**\n * Returns:\
    \ (transfer full) (element-type utf8): the list of suggestions\n * */\n```\n\n\
    The return type is GList *, which is not sufficient for language bindings to know\
    \ what the list contains, and how and to free it. (transfer full) means that the\
    \ return value must be fully freed by the caller: the list itself and its elements.\
    \ (element-type utf8) means that the list contains UTF-8 strings.\n\nFor a value,\
    \ if the transfer annotation is (transfer container), the caller needs to free\
    \ only the data structure, not its elements. And if the transfer annotation is\
    \ (transfer none), the ownership of the value is not transferred, and thus the\
    \ caller must not free the return value.\n\nThere are many other GObject Introspection\
    \ (GI) annotations, to name just a others:\n\n+   - (nullable): the value can\
    \ be NULL\n- (out): an \"out\" function parameter, i.e. a parameter that returns\
    \ a value.\n\nAs you can see, the GI annotations are not just useful for language\
    \ bindings, they also gather useful information to the C programmer.\nFor a comprehensive\
    \ list of GI annotations, see the GObject Introspection wiki [10].\n\n# 3.2.4\
    \ Static vs Non-Static Functions\n\nIn the example code, you can see that the\
    \ load_dictionary() function has been marked as static. A static function is a\
    \ good practice because it can be used only in the same *.c file. On the other\
    \ hand, a public function should be non-static and have a prototype in a header."
