    ```\n\n# Listing 2.4: Assertions\n\nListing 2.3 shows GLib's prediction checks.\
    \ g_return_if_fail() prints a warning and immediately returns from the current\
    \ function if condition is FALSE. g_return_val_if_fail() is similar but allows\
    \ you to return return_value. These macros are incredibly useful — if you use\
    \ them liberally, especially in combination with GObject's runtime checking, you\
    \ will halve the time you spend looking for bad pointers and type errors.\n\n\
    Using these functions is simple; here's an example from the GLib hash table implementation:\n\
    \n```c\nvoid\ng_hash_table_foreach (HashTable *hash_table,\nGHFunc func,\ngpointer\
    \ user_data)\n{\n  gint i;\n  g_return_if_fail (hash_table != NULL);\n  g_return_if_fail\
    \ (func != NULL);\n  for (i = 0; i < hash_table->size; i++)\n  {\n    guint node_hash\
    \ = hash_table->hashes[i];\n    gpointer node_key = hash_table->keys[i];\n   \
    \ gpointer node_value = hash_table->values[i];\n    if (HASH_IS_REAL (node_hash))\n\
    \      (* func) (node_key, node_value, user_data);\n  }\n}\n```\n\nWithout the\
    \ checks, passing NULL as an argument would result in a mysterious segmentation\
    \ fault. The person using the library would have to figure out where the error\
    \ occurred with a debugger, or maybe even dig into the GLib code to see what was\
    \ wrong. With the checks, they'll get a nice error message telling them that NULL\
    \ arguments are not allowed.\n\nGLib also has more traditional assertion macros,\
    \ shown in Listing 2.4. g_assert() is basically identical to assert(), but responds\
    \ to G_DISABLE_ASSERT and behaves consistently across all platforms. g_assert_not_reached()\
    \ is also provided; this is an assertion that always fails. Assertions can exit\
