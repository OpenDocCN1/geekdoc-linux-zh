    # 1.7 Why and When Using the C Language?


    The GLib and GTK+ libraries can be used by other programming languages than C.
    Thanks to GObject Introspection, automatic bindings are available for a variety
    of languages for all libraries based on GObject. Official GNOME bindings are available
    for the following languages: C++, JavaScript, Perl, Python and Vala. Vala is a
    new programming language based on GObject which integrates the peculiarities of
    GObject directly in its C#-like syntax. Beyond the GNOME bindings, GLib and GTK+
    can be used in more than a dozen programming languages, with a varying level of
    support. So why and when choosing the C language? For writing a daemon on a Unix
    system, C is the de facto language. But it is less obvious for an application.
    To answer the question, let''s first look at how to structure an application codebase.


    # 1.7.1 Separate the Backend from the Frontend


    A good practice is to separate the graphical user interface from the rest of the
    application. For a variety of reasons, an application''s graphical interface tends
    to be an exceptionally volatile and ever-changing piece of software. It''s the
    focus of most user requests for change. It is desirable to plan and execute the
    first time around - often you will discover that some aspect of it is unpleasant
    to use only after you have written it. Having different user interfaces sometimes
    desirable, for example a command-line version, or a web-based interface.


    In practical terms, this means that any application should have a radical separation
    between its frontend, or interfaces, and the backend. The backend should contain
    all the "hard parts"; your algorithms and data structures, the real work done
    by the application. Think of it as an abstract "model" being displayed and manipulated
    by the user.


    Each frontend should be a "view" and a "controller." As a "view", the frontend
    must not ignore changes in the backend, and change the display accordingly. As
    a "controller", the frontend must allow the user to relay requests for change
    to the backend (it defines how manipulations of the frontend translate into changes)


    There are many ways to discipline yourself to keep your application separated.
    A couple of useful ideas:


    > https://wiki.gnome.org/Projects/Vala'
