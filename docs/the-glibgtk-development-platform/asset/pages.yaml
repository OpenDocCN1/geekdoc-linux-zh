  md: "# Property Bindings\n\nAnother useful aspect of properties is that two properties\
    \ can easily be bound: when one property changes, the other is updated to have\
    \ the same value. The same can be accomplished with the \"notify\" signal, but\
    \ higher-level functions exist.\n\nTwo properties can be bound in various ways\
    \ with one of the g_object_bind_property*() functions. The Listing 4.7 shows a\
    \ simpler implementation of Listing 4.6: the code is equivalent, but using the\
    \ g_object_bind_property() function.\n\n```\nstatic GtkWidget *\ncreate_check_button\
    \ (MyWindow *window)\n{\n    GtkWidget *check_button;\n\n    check_button = gtk_check_button_new_with_label(\"\
    Show side panel\");\n\n    /* When the GtkToggleButton:active property of check_button\
    \ changes,\n     * the GtkWidget:visible property of window->side_panel is updated\
    \ to\n     * have the same boolean value.\n     *\n     * It would be useful to\
    \ add GINDING_SYNC_CREATE to the flags, but\n     * in that case the code would\
    \ not be equivalent to the previous\n     * code Listing.\n     */\n    g_object_bind_property(check_button,\
    \ \"active\",\n                           window->side_panel, \"visible\",\n \
    \                          G_BIND_DEFAULT);\n\n    return check_button;\n}\n```\n\
    \nListing 4.7: Binding two properties."
