  md: '# Chapter 3


    # Semi-Object-Oriented Programming in C


    It was explained in the previous chapter that the GLib core library uses a semi--object-oriented
    coding style. This section explains what it means, and how to write your own code
    with this coding style.


    One of the main ideas of OOP is to keep related data and behavior in one place¹.
    In C, the data is stored in a struct, and the behavior is implemented with functions.
    To keep those in one place, we put them in the same *c file, with the public functions
    in the corresponding *h file (the header).


    Another important idea of OOP is to hide all data within its class, it means the
    struct full declaration should only be present in the *c file, while the header
    contains only a typedef. How the data is stored within the class and data structures
    should remain an implementation detail. A user of the class should not be aware
    of the implementation details, it instead rely only on the external interface,
    that is, what is present in the header and the public documentation. That way,
    the implementation of the class can change without affecting the users of the
    class, as long as the API doesn''t change.


