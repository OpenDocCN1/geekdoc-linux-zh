  md: '+   • Having read book on data structures and algorithms is useful, but you
    can learn that in parallel. A recommended book is The Algorithm Design Manual,
    by Steven Skiena [4].


    +   • If you want to develop your software on a Unix-like system, another prerequisite
    is know how Unix works, and be familiar with the command line, a bit of shell
