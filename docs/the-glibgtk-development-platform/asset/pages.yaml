  md: 'GeditWindow also creates a GEditNotebook, the main part of the window.


    # 5.3 GeditNotebook and What It Contains


    GeditNotebook is a subclass of GtkNotebook, which is the widget that displays
    tabs, and also contains their content.


    In the class scheme, we can see that the content of a tab is a GEditTab widget,
    which is a subclass of GtkGrid. The main element inside GEditTab is the GEditView.
    More precisely — it was omitted in the GtkScrollView for succinctness — the GEditView
    is actually contained in a GtkScrollView which is contained in the GEditTab. But
    GEditTab can contain other widgets, for example information on bars on top of
    the document.


    GeditView is a subclass of GtkSourceView, which is itself a subclass of GtkTextView.
    GtkTextView — is part of GTK+ is the foundation for a multiline text editor. The
    GtkSourceView library adds features for source code, such as syntax highlighting.
    GtkTextView follows a Model-View-Controller pattern. GtkBuffer is the model, i.e.,
    it contains the data.


    # 5.4 Why and When Creating Sub-Classes of GTK+ Widgets?


    If we look for GeditTab, it contains — by composition — a GeditView. GeditView
    is a subclass of GtkSourceView. Instead, GeditTab could use position directly
    a GtkSource object, and move the code of GeditView to GeditTab. Usually, it''s
    exactly that happens or should happen.


    When a GTK+ application codebase is still small, for example if you start writing
    an equivalent of GeditView, you can create a GtkSourceView object directly in
    GeditTab, and store the GtkSourceView object in an instance variable. Then, implementing
    new features, you can add functions that use almost exclusively the GtkSourceView
    instance. You may also have static functions that take directly a GtkSourceView
    argument instead of GeditTab self parameter. You may also store data useful only
    to the GtkSourceView-related functions. If the GeditTab is small (e.g. 500 lines
    of code) and doesn''t contain a lot of list variables, there is no problem. On
    the other hand, if the GeditTab becomes larger (e.g. more than 2000 lines of code),
    then it''s probably likely that the class should delegate some of its work to
    a new class; in our case, GeditView. Note that 2000 lines of code for a class
    might be fine, there is no clear boundary on when a class should be split. But
    if the resulting GeditView class would contain at least hundreds of non-boilerplate
    code, it is probably a good idea to do the refactoring.


    What OOP is all about is to pack data and behavior together, and delegate some
    of work to other classes. Class inheritance makes sense when we want to add more
    behavior to an existing class, with possible additional data related to the added
    behavior. GeditView is a subclass of GtkSourceView because GeditView is a GtkSourceView;
    that is, GeditView operates on the same base data as GtkSourceView. In addition,
    it permits to GeditTab to delegate some of its'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'work, with the goal to have smaller, more manageable classes. Smaller in two
    ways: less code, and less instance variables.


    So, during the lifetime of a GTK+ application, the programmer often needs to refactor
    the code, creating new classes, delegating more work. The opposite can happen
    when application code is moved to the underlying library; for example, if all
    the features of GeditView are added to the GtkSourceView class; in that case,
    the Gedit subclass doesn''t make sense anymore.


    # 5.5 Composite Widgets


    Composite widgets are containers that already contain a useful collection of child
    widgets in a nice package. Implementing a composite widget is easy⁶, you just
    need to:


    +   1. Subclass a container like GtkGrid or GtkBin or GtkWindow;


    +   2. In the constructor of the class, create the child widgets and add them
    to the container.


    In the gedit class schema, the composite widgets are the subclasses of GtkGrid
    (GeditPanel and GeditTab) and GeditWindow.


    GeditWindow is an indirect subclass of GtkBin, so it can contain at most one child
    widget. That''s why GeditWindow uses a GtkGrid as its child widget, so that the
    GtkGrid can contain in turn all the window elements.


    By default GeditTab has only one child widget, the GtkScrolledWindow that contains
    GeditView. But GeditTab has a function to add a GtkInfoBar at the top, showing
    for example an error message.


    So, GtkGrid is a general-purpose container that doesn''t contain any child widget
    initially, a composite widget is a specialized container that already contains
    specific child widgets. Writing composite widgets are a convenient way to code
    applications.


    > ⁶Once you know how to subclass a GObject class.'
