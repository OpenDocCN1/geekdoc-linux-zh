  md: 'To create your own signals or properties, a GOObject sub-class must be created.
    As explained in the introduction of this chapter, this is beyond the scope of
    this book, but you should be aware that creating your own signals or properties
    is course possible, and recommended. In fact, creating a GOObject signal or property
    is a nice way to implement the Observer design pattern [3]; that is, one or more
    objects observing state changes of another object, by connecting function callbacks.
    The object emitting the signal is not aware of which objects receive it. GOObject
    keeps track of the list of callbacks to call. So adding a signal permits to decouple
    classes.


    # 4.5.1 Connecting a Callback Function to a Signal


    To make things more concrete, if you look at the GtkButton documentation, you''ll
    see that it provides the "clicked" signal. To perform the desired action when
    the signal is emitted, one or more callback function(s) must be connected beforehand.


    To connect a callback to a signal, the g_signal_connect() function can be used,
    or one of the other g_signal_connect_* functions:


    +   - g_signal_connect()

    - g_signal_connect_after()

    - g_signal_connect_swapped()

    - g_signal_connect_data()

    - g_signal_connect_object()

    - And a few advanced ones.


    The Listing 4.3 p. 52 shows the GtkButton::clicked signal. When using g_signal_connect(),
    the callback function must have the same prototype as the signal prototype. A
    of signals have more arguments, and some signals return a value. If the callback
    has an incompatible prototype, bad things will happen, there will be random bugs
    or crashes.


    The Listing 4.4 p. 53 shows an example of how to use g_signal_connect(). The G_CALLBACK()
    is necessary because g_signal_connect() is generic: it can be used to connect
    to any signal of any GOObject class, so the function pointer needs to be cast.


    There are two naming conventions to connect callback functions:


    +   - End the function name with "cb", shortcut for "callback". For example: button_clicked_cb()
    is in the above code example.

    - Start the function name with "on". For example: on_button_clicked().


    With one of those naming conventions — and the gpointer user_data parameter, which
    is always the last parameter — it is easy to recognize that a function is a callback.


    > The convention referring to a GOObject signal is "ClassName::signal-name". That''s
    how it''s documented with GTK-Doc comments.'
