    # Listing 2.4: Assertions


    Listing 2.3 shows GLib''s prediction checks. g_return_if_fail() prints a warning
    and immediately returns returns from the current function if condition is FALSE.
    g_return_val_if_fail() is similar but allows you to return return_value. These
    macros are incredibly useful — if you use them liberally, especially in combination
    with GObject''s runtime checking, you will halve the time you spend looking for
    bad pointers and type errors.


    Using these functions is simple; here''s an example from the GLib hash table implementation:


    ```

    void

    g_hash_table_foreach (HashTable *hash_table,

    GHFunc func,

    gpointer user_data)

    {

    gint i;

    g_return_if_fail (hash_table != NULL);

    g_return_if_fail (func != NULL);

    for (i = 0; i < hash_table->size; i++)

    {

    guint node_hash = hash_table->hashes[i];ngpointer node_key = hash_table->keys[i];ngpointer
    node_value = hash_table->values[i];

    if (HASH_IS_REAL (node_hash))

    (* func) (node_key, node_value, user_data));

    }

    ```


    Without the checks, passing NULL as a argument would result in a mysterious segmentation
    fault. The person using the library would have to figure out where the error occurred
    with a debugger, or maybe even dig into the GLib code to see what was wrong. With
    the checks, they''ll get a nice error message telling them that NULL arguments
    are not allowed.


    GLib also has more traditional assertion macros, shown in Listing 2.4. g_assert()
    is basically identical to assert(), but responds to G_DISABLE_ASSERT and behaves
    consistently across all platforms. g_assert_not_reached() is also provided; this
    is an assertion that always fails. Assertions can exit the program and (if your
    environment supports it) dump a core file for debugging purposes.


    Fatal assertions should be used to check internal consistency of a function or
    library, while g_return_if_fail() is intended to ensure sane values are passed
    to the public interfaces of a program module. That is, if an assertion fails,
    you typically look for a bug in the module containing the assertion; if a g_return_if_fail()
    check fails, you typically look for the bug in the code that invokes the module.'
