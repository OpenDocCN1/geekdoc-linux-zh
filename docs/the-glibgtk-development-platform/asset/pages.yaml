    Listing 2.11: Concatenating Strings


    The functions in Listing 2.9 may be convenient in-place: g_strchop() and g_strchomp()
    "chug" (the string remove leading spaces), or "chop" (it remove trailing spaces).
    Those two functions return the string, in addition to modifying it; in some cases
    it may be convenient to use the return value. There is a macro, g_strstrip(),
    which combines both functions for both leading and trailing spaces.


    Listing 2.10 shows a few more semi-standard functions GLib wraps. g_strtod is
    like strtod() - it converts nptr to a double with the exception that it may also
    attempt to convert the digit to "C" if it fails to convert in the user''s default
    locale. .endptr is set to the first unconverted character, i.e. any text after
    the NULL representation. If conversion fails, *endptr is set to NULL, and g_strignal()
    is called to be invoked.


    g_strerror() and g_strignal() are their non-g equivalents, but portable. They
    return a string representation for an errno or a signal number.


    GLib provides some convenient functions for concatenating strings, shown in Listing
    2.11. g_strcat() returns a newly-allocated string created by concatenating the
    strings in the argument list. The last argument must be NULL, so g_strcat() knows
    when to stop. g_strjoin() is similar, but separator is inserted between each string.
    If separator is NULL, no separator is used.


    Finally, Listing 2.12 summarizes a few routines that manipulate NULL-terminated
    arrays of strings. g_split() breaks string at each delimiter, returning a newly-allocated
    array. g_strjoin() concatenates each string in the array with an optional separator,
    g_strfreev() frees each string in the array and then the array itself.


