    # 2.3 The Main Event Loop


    Today''s applications are often event-driven. For GUI applications, there are
    many sources of events: a key press, a mouse click, a touch gesture, a message
    from another application, a change on the file-system, is connected or disconnected
    from the network, and so on. An application needs to react to these events. For
    example when a key is pressed when the text entry has the focus, the character
    should be inserted and displayed on the screen.


    But event-driven programming also to daemons. Inter-process communication also
    happens between daemons and applications. A daemon could receive event when a
    packet arrives on a network interface. A printer daemon could receive events when
    a printer is connected, disconnected, is low-on-paper, etc. A mount daemon can
    listen to USB sticks inserted. Another daemon can listen to external monitors
    to reconfigure the screens, and so on.


    An event-driven program is not structured as a batch program. The work to do by
    a batch program is determined at the start. It analyzes the input, does some computations
    on it, and outputs a report. For instance, Unix commands and scripts are batch
    programs.


    So, how to structure an application that needs to respond to various events that
    can arrive at any time? As the title of this suggests... with a main event loop
    of course! That''s another important part of GLib; provides core support of event-driven
    programming, with a main event loop abstraction, a portable implementation of
    threads and asynchronous communication between threads. An event loop listens
    to some sources of events. A priority is associated with'
