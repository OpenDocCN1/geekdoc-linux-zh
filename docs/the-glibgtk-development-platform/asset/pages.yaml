  md: '# # Chapter 2


    # # GLib, the Core Library


    GLib is the low-level core library that forms the basis for projects such as GTK+
    and GNOME. It provides data structures, utility functions, portability wrappers,
    and other essential functionality such as an event loop and threads. GLib is simple
    and available on most Unix-like systems and Windows.


    This chapter covers some of the most commonly-used features. GLib is simple, and
    the concepts are familiar; so we''ll move quickly. For more complete coverage
    of GLib, see the latest API documentation that comes with the development environment,
