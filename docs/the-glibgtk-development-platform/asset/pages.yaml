    # 1.9 The Development Environment


    This section describes the development environment typically used when programming
    with GLib and GTK+ on a Unix system.


    On a GNU/Linux distribution, a single package or group can be installed to get
    a full C development environment, including, but limited to:


    +   - C89-compatible compiler, GCC for instance;

    - the GNU debugger GDB;

    - GNU Make;

    - the Autotools (Autoconf, Automamake and libtool);

    - the man-pages of: Linux kernel and the glibc⁹.


    Using GLib and GTK+ as a developer, there are several solutions:


    +   - The headers and the documentation can be installed with the package manager.
    The name of the packages ends typically with one of the following suffixes: -devel,
    -dev or -doc. For example glib2-devel and glib2-doc on Fedora.


    +   - The latest versions of GLib and GTK+ can be installed with Jhbuild: https://wiki.gnome.org/Projects/Jhbuild


    To read the API documentation of GLib and GTK+, Devhelp is a handy application,
    if you have installed the -dev or -doc package. For the text editor or IDE, there
    are many (and a source of many trolls): Vim, Emacs, edit, Anju, MonoDev/Xamarin
    Studio, Geany, ... A promising specialized IDE of GNOME is Builder, currently
    in development. For creating a GUI with GTK+, you can either write the code to
    do it, or you can use Glide to guide the design graphically. Finally, GTK-Doc
    is used for writing API documentation and adding the GObject Introspection annotations.


    When using GLib or GTK+, pay attention to not deprecated APIs for newly-written
    code. Be sure that you read the latest documentations. They are also available
    online at: https://developer.gnome.org/


