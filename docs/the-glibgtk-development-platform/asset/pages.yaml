    # 2.1.5 String Handling


    GLib provides a number of functions for string handling; some are unique to GLib,
    and solve some portability concerns. They all operate nicely with the GLib memory
    allocation routines.


    For those interested in a better string than gchar *, there''s also a GString
    type. It isn''t covered in this book, see the API documentation for further information.


    Listing 2.7 shows a subset GLib provides for the sprintf() function. g_sprintf()
    on platforms that have it, and enables an implementation on that.


    Pay attention not to use the crash-causing, security-heat-creating, sprintf()
    function. By using the relatively safe g_snprintf() or g_strndprintf() (see below),
    you can say goodbye to sprintf() forever.


    Listing 2.8 shows GLib''s rich array of functions for allocating strings. Unsurprisingly,
    g_strdup() and g_strnd produce an allocated copy of str or the first n characters
    of str. For consistency with the GLib memory allocation functions, they return
    NULL if a NULL pointer. The printf() variants return a formatted string. g_strnfill()
    returns a string of size length filled with fill_char.


    g_strndprintf() serves a special mention; it is a simpler way to handle this common
    code of:


    ```

    gchar *str = g_malloc(256);

    g_snprintf(str, 256, "%d printf-style %s", num, string);

    ```


    Instead you could use this, and avoid to figure out the proper length of the buffer
    to::


    ```

    gchar *str = g_strdu_printf("%d printf-style %s", num, string);

