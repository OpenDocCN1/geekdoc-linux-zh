  md: '# # Introduction to Part II


    Now that you''re familiar with the GLib core library, what is the next step? As
    the Learning Path section explained (section 1.8 p. 9), the logical follow-up
    is Object-Oriented Programming (OOP) in C and the basics of GObject.


    Every GTK+ widget is a subclass of the GObject base class. Knowing the basic concepts
    of GObject is important for *using* a GTK+ widget or another GObject-based utility,
    but also for *creating* your own GObject classes.


    It is important to note that although the C language is not object-oriented, it
    is possible to write "semi-object-oriented" code easily, without GObject. For
    learning purposes, what''s this part begins with. GObject is then easier to learn.
    What GObject adds is features such as reference counting, inheritance, virtual
    functions, interfaces, signals and more.


    But why following object-oriented style in the first place? An object-oriented
    code permits to avoid sort of programming best-practices guide, you know that
    you *should*, if possible, avoid global variables¹. Because using global data
    makes the code harder to manage and understand, especially when a program becomes
    larger. It also makes the code more difficult to re-use. It is instead better
    to break a program into smaller, self-contained pieces, so that you can focus
    on only one part of the code at a time.


    This part of the book comprises two chapters:


    +   - Chapter 3, which explains how to write your own semi-OOP classes;


    +   - Chapter 4, which explains the basics of GObject.


    > ¹ global variable in C can be a **static** variable declared at the top of a
    *.c file, that can be accessed from any function in that *.c file. This is sometimes
    useful, but should be avoided if possible. There is another kind of global variable
    in C: an **extern** variable that can be accessed from any *.c file. The latter
    is much worse than the former.'
