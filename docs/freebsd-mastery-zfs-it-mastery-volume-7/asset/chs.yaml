  \  legacy\nmypool/second/baby   96K  13.5G    96K  legacy\n...\n```\n\n`dolly` 数据集看起来像是一个普通的数据集，但空间使用除外。`REFER`\
  \ 列显示它有 `2 MB` 的数据，但在 `USED` 下它仅占用了 `8 KB`。它包含的数据来自于原始快照。克隆（Clone）只为新写入的数据消耗空间，无论是新文件还是覆盖旧文件。\n\
  \n### 查看克隆 (Clones)\n\n克隆的外观与普通数据集一样。在 `zfs list` 中，你不会发现克隆与其他任何数据集有任何区别。然而，克隆会在它们的\
  \ `origin` 属性中记录其源快照。\n\n```bash\n# zfs get type,origin mypool/dolly\nNAME     \
  \     PROPERTY  VALUE                  SOURCE\nmypool/dolly  type      filesystem\
  \             -\nmypool/dolly  origin    mypool/sheep@evenmore  -\n```\n\n因此，克隆在各个方面看起来都像是一个普通数据集。`origin`\
  \ 属性是判断其是否为克隆的唯一方法。`origin` 是创建该克隆的快照。\n\n要追踪系统上所有的克隆，请使用 `zfs list` 并检查 `origin`\
  \ 属性。我们正在检查任何不以连字符 `-` 结尾的项目。\n\n```bash\n# zfs list -o name,origin | grep -ve '-$'\n\
  NAME           ORIGIN\nmypool/dolly   mypool/sheep@evenmore\n```\n\n这给出了所有源自快照的数据集列表。\n\
  \n### 删除克隆和快照\n\n克隆依赖于存储在源快照中的块。克隆的存在阻止了源快照的删除。如果你尝试删除快照，`zfs destroy` 会告诉你存在问题。\n\
  \n```bash\n# zfs destroy mypool/sheep@evenmore\ncannot destroy 'mypool/sheep@evenmore':\
  \ snapshot has dependent clones\nuse '-R' to destroy the following datasets:\nmypool/dolly@zfs-auto-snap_frequent-2015-04-08-16h5\n\
  mypool/dolly\n```\n\n添加 `-R` 标志，删除快照将连所有相关的克隆一同删除。你可以像删除其他文件系统数据集一样删除克隆本身。\n\n```bash\n\
  # zfs destroy mypool/dolly\ncannot destroy 'mypool/dolly': filesystem has children\n\
  use '-r' to destroy the following datasets:\nmypool/dolly@zfs-auto-snap_frequent-2015-04-08-16h5\n\
  ```\n\n噢，等等。克隆从父级继承了 `zfs-auto-snapshot` 属性，所以我们的快照自动化到了它。如果你不想让克隆产生快照，本应该关闭该属性。你可以手动删除克隆的快照，但\
  \ `zfs-auto-snapshot` 会不断创建新的。你也可以使用 `-r`（递归）标志来删除克隆及其所有快照。\n\n```bash\n# zfs destroy\
  \ -rv mypool/dolly\nwill destroy mypool/dolly@zfs-auto-snap_frequent-2015-04-08-16h5\n\
  will destroy mypool/dolly\n```\n\n现在我们可以删除源快照了。\n\n```bash\n# zfs destroy -v mypool/sheep@evenmore\n\
  will destroy mypool/sheep@evenmore\nwill reclaim 0\n```\n\n克隆非常强大，但它们增加了快照管理的复杂度。\n\
  \n### 提升克隆 (Promoting Clones)\n\n当你完成 Web 应用开发版本的测试后，你想让克隆成为正式版本，并丢弃之前的版本。但这会导致问题。你无法删除原始数据集，因为克隆依赖于该数据集的快照。\n\
  \n要解决这个问题，你需要“提升”（promote）克隆，告诉 ZFS 反转原始数据集与克隆之间的父子关系。克隆变成文件系统。之前的父级变成克隆。学生变成了老师。克隆所需的任何快照都会移动，并成为克隆的一部分。在克隆源快照之后创建的快照仍然属于原始父级。一旦克隆成功与父数据集交换位置，你就可以消除原始数据集了。\n\
  \nZFS 还会改变新父级和新克隆的使用空间。这些数据集没有占用额外空间，但该空间会计统计方式发生了变化。克隆仅按其与源快照有差异的空间计费。新的父数据集对几乎所有内容计费，就像新的人类父母一样。\n\
  \n让我们演示提升克隆的过程。在这里，我们将数据集 `mypool/wooly` 克隆到名为 `mypool/bonnie` 的数据集，并修改该克隆。\n\n\
  ```bash\n# zfs clone mypool/wooly@later mypool/bonnie\n# date > /mypool/bonnie/date.txt\n\
  # dd if=/dev/random of=/mypool/bonnie/randomfile bs=1m count=8 oseek=4\n```\n\n\n\
  \n你可以对数据集创建快照。你可以基于这些快照创建克隆。然后你可以对克隆创建快照并创建更多的克隆。尽管你尽了努力，你可能会产生大量相互关联的克隆和快照组成的复杂网络，超出了任何人类心理追踪的能力。ZFS\
  \ 为你提供了许多功能和便利，但克隆可能引发各种让你翻江倒海的全新类型混乱。4\n\n`-nv` 标志对于安全的系统管理至关重要。每当你脑中产生一丝破坏数据集的念头时，请使用\
  \ `-nv` 执行详细的模拟运行（dry run）。看看 `destroy` 命令实际上会删除什么。阅读列表。你可能会发现，你的递归 `destroy` 拉动了一根跨越整个池的克隆线程。\n\
  \n三思行后跳。永远如此。\n\nZFS 改变了你使用磁盘空间的方式，但管理它仍然是管理员的任务。让我们接下来来讨论这一点。\n\n1 快照让你在数据上等同于收集者。尽量不要让自己埋在旧报纸的雪崩中。\n\
  \n2 当你要自断脚时，请对准目标。安全第一！\n\n3 克隆看起来和它们的源材料一样。这就是为什么它们是如此出色的杀手。不，等一下——错克隆了。抱歉。\n\n\
  4 诚然，大鞋和红鼻子并没有帮助。不，等等——那是小丑。抱歉，没关系。\n\n# 第 8 章：安装到 ZFS\n\n学习 ZFS 的全部意义是在机器上使用该文件系统。让我们讨论在\
  \ ZFS 上安装 FreeBSD 10。\n\n如果你必须安装大量的 FreeBSD 机器（例如在服务器群中），我们推荐使用 PC-BSD 安装程序。像我们在这里演示的这种脚本对于偶尔安装几台机器是可以的，但如果你是按机架配置机器，你真的需要一个基于\
  \ PXE 的安装程序。\n\n硬件限制了你的选择。在极少数情况下，笔记本电脑只有一块硬盘。运行 FreeBSD 意味着使用单个条带化的虚拟设备池进行存储。如果你有数百块磁盘，你将需要考虑如何分离你的池。\n\
  \n当你有许多许多磁盘时，请将你的操作系统与数据分离。FreeBSD 和精选的附加软件非常适合放在镜像池或 RAID-Z 中。你不需要仅仅为了操作系统就使用 RAID-Z3！如果你有几百块数据存储磁盘，请为操作系统和数据使用独立的池。对于几百块磁盘，Lucas\
  \ 可能会想要几个独立的池，但他是个老古董了。Jude 也许会把它们全部倒进一个巨大的池中。唯一的错误选择是那种增加你工作量的选择。\n\n本章假设你熟悉 GPT\
  \ 分区、FreeBSD 工具（如 `gpart(8)`）以及 FreeBSD 分区类型。如果不熟悉，请查看 FreeBSD 文档或者读读 *FreeBSD Mastery:\
  \ Storage Essentials*。（*FMSE* 也涵盖了安装脚本和其他高级安装技术。）\n\n安装一个基于 ZFS 的系统需要配置存储池、分配数据集并将\
  \ FreeBSD 安装到数据集中。你可以在每一步中做出不同的选择，因此我们将分别考虑。\n\n但先从参考性的 FreeBSD 安装开始。\n\n## FreeBSD\
  \ 参考安装\n\n在安装自定义的 FreeBSD 系统之前，先安装一个较小的 FreeBSD ZFS 虚拟机作为参考平台。这提供了许多关于标准 FreeBSD\
  \ 安装的信息。安装你自己的系统固很棒，但不要放弃安装程序所使用的所有仔细考虑过的默认设置。你的目标可能是以安装程序不允许的方式对安装进行微调，而不是放弃所有的\
  \ FreeBSD 标准。\n\n启动你的参考平台，成为 root 用户，并运行 `zpool history` 查看这个 ZFS 是如何创建的。\n\n```\n\
  # zpool history\nHistory for 'zroot':\n2015-04-08.07:18:30 zpool create -o altroot=/mnt\
  \ -O compress=lz4 -O atime=off -m none -f zroot raidz1 da0p3.nop da1p3.nop da2p3.nop\n\
  2015-04-08.07:18:30 zfs create -o mountpoint=none zroot/ROOT\n2015-04-08.07:18:30\
  \ zfs create -o mountpoint=/ zroot/ROOT/default\n2015-04-08.07:18:30 zfs create\
  \ -o mountpoint=/tmp -o exec=on -o setuid=off zroot/tmp\n...\n```\n\n我们将在整个安装过程中使用这些信息来微调我们的安装。\n\
  \n## 自定义 ZFS 安装分区\n\n进入 FreeBSD 安装镜像，并选择 *install*。当你到达分区磁盘的步骤时，请选择命令行而不是任何自动或引导式方法。如果你手头有你需要的版本，也可以使用类似\
  \ `mfsBSD` 类的工具。\n\n### 磁盘分区\n\n当计算机启动时，它会在存储介质上寻找操作系统。对于 FreeBSD 来说，这是一个引导加载程序。FreeBSD\
  \ 提供了 `gptzfsboot(8)` 引导加载程序专门用于从 ZFS 池启动。硬件 BIOS 启动引导加载程序，该程序激活池并启动 FreeBSD 内核。启动池中每个虚拟设备中的每块磁盘都应该安装\
  \ ZFS 引导加载程序，这意味着磁盘必须分区。由于某种奇怪的原因，FreeBSD 引导加载程序分区的最大尺寸仅略大于 512 KB，因此为引导加载程序分配 512\
  \ KB。然后我们放入一个 1 GB 的 FreeBSD 交换分区，并将剩余空间分配给 ZFS。交换分区和 ZFS 分区在 1 MB 边界对齐。\n\n为了教学目的，我在\
  \ GPT 标签中使用这些短名称，但我们强烈建议你像第 0 章讨论的那样使用基于位置的标签。\n\n```\n# gpart add –a 1m -t freebsd-boot\
  \ -s 512k -l zfsboot da0\nda0p1 added\n# gpart add –a 1m -t freebsd-swap -s 1g -a\
  \ 1m -l swap0 da0\nda0p2 added\n# gpart add –a 1m -t freebsd-zfs -a 1m -l zfs0 da0\n\
  da0p3 added\n```\n\n现在在该磁盘上安装 ZFS 引导程序。每块磁盘都可能需要它。\n\n```\n# gpart bootcode -b /boot/pmbr\
  \ -p /boot/gptzboot -i 1 da0\nbootcode written to da0\n```\n\n对每块磁盘重复此操作。\n\n###\
  \ 创建池\n\n在磁盘格式化提示处，将你的磁盘汇入你的存储池。通常将根池命名为 `system`，或者你可以根据主机命名。根据你的环境决定。我将示例池命名为\
  \ `zroot`，以便符合 FreeBSD。\n\n查看默认 FreeBSD 的 `zpool history` 并考虑其内容。\n\n```\n2015-04-08.07:18:30\
  \ zpool create -o altroot=/mnt -O compress=lz4 -O atime=off -m none -f zroot raidz1\
  \ da0p3.nop da1p3.nop da2p3.nop\n```\n\n这是一个 FreeBSD 10.1 系统。安装程序临时将引导池挂载到 `/mnt`，我们必须保持这样。我们想要其他选项，例如将压缩设置为\
  \ `lz4` 并禁用 `atime`。`-m none` 告诉 `zpool(8)` 不要为此池分配挂载点。10.1 安装程序尚未更新以利用 `vfs.zfs.min_auto_ashift`\
  \ `sysctl`，但我们现在使用它。\n\n```\n## sysctl vfs.zfs.min_auto_ashift=12\n```\n\nZFS 现在将使用\
  \ 4096 字节扇。创建池。我们盗用了所有的 FreeBSD 选项，仅进行我们想要的更改。\n\n```\n# zpool create -o altroot=/mnt\
  \ -O compress=lz4 -O atime=off -m none -f zroot mirror gpt/zfs0 gpt/zfs1 cache gpt/zcache0\
  \ log gpt/zlog0\n```\n\n可能 FreeBSD 的默认池安装选项是足够的。你可能想要微调数据集。\n\n## 数据集\n\n虽然你想创建自定义的数据集配置，但请检查\
  \ FreeBSD 的安装默认设置。它们对于普通用户来说是合理的，并且允许使用启动环境管理器等高级功能。\n\n\n\n\n\n如果你想使用 FreeBSD 安装程序完成安装，你必须为安装程序提供一个可识别的系统。这意味着要遵循参考安装中的步骤，即使你不确定为什么在数据集创建步骤的最后要导出并导入池（pool）。总而言之，我们建议添加你自己的数据集，但保持默认设置不变。\n\
  \n以下是参考 FreeBSD 主机上 `zpool` 历史的一些片段，省略了时间戳。\n\n```\nzfs create -o mountpoint=none\
  \ zroot/ROOT\nzfs create -o mountpoint=/ zroot/ROOT/default\nzfs create -o mountpoint=/tmp\
  \ -o exec=on -o setuid=off zroot/tmp\nzfs create -o mountpoint=/usr -o canmount=off\
  \ zroot/usr\nzfs create zroot/usr/home\nzfs create -o setuid=off zroot/usr/ports\n\
  zfs create zroot/usr/src\nzfs create -o mountpoint=/var -o canmount=off zroot/var\n\
  zfs create -o exec=off -o setuid=off zroot/var/crash\nzfs create -o exec=off -o\
  \ setuid=off zroot/var/log\nzfs create -o atime=on zroot/var/mail\nzfs create -o\
  \ setuid=off zroot/var/tmp\nzpool set bootfs=zroot/ROOT/default zroot\nzpool set\
  \ cachefile=/mnt/boot/zfs/zpool.cache zroot\n```\n\n你可以轻松地在此基础上添加或更改自己的数据集，例如创建\
  \ `zroot/var/mysql` 或将 `/home` 从 `/usr` 下移出，或者你想要的任何操作。\n\n创建数据集需要大量的输入。正如在 *FreeBSD\
  \ Mastery: Storage Essentials* 中讨论的那样，我们建议创建安装脚本。\n\n一旦准备好数据集，退出命令行分区界面，安装程序将恢复。\n\
  \n### 安装后设置\n\n一旦安装程序完成文件复制到磁盘、设置网络等操作，你将有机会进入已安装的系统进行更改。抓住这个机会。你必须在完成后的系统中更改一些设置。\n\
  \n确保 `ZFS` 在 `/etc/rc.conf` 中启动。这会在系统启动时挂载你的文件系统数据集。\n\n```\nzfs_enable=yes\n```\n\
  \n编辑 `/boot/loader.conf` 以告诉 FreeBSD 在启动时加载 `ZFS` 和相关的内核模块。\n\n```\nzfs_load=\"\
  YES\"\n```\n\n你也可以在这里进行你喜欢的任何其他系统更改。\n\n虽然某些文档提到了其他必要步骤（例如复制池缓存文件），但现在已不再需要了。\n\n\
  完成后重启，你将进入一个全新的、自定义的 FreeBSD 安装系统！\n\n### 手动安装 FreeBSD\n\n如果你必须通过命令行对磁盘进行分区，那么你不如自己手动将\
  \ FreeBSD 文件写入磁盘。FreeBSD 分发文件位于 `/usr/freebsd-dist`，你使用 `tar(1)` 将它们写入磁盘。你的安装目标被挂载在\
  \ `/mnt` 中。\n\n```\n# tar --unlink -xpJf base.txz -C /mnt\n# tar --unlink -xpJf\
  \ kernel.txz -C /mnt\n```\n\n你可以安装其他发行集，但基础系统和内核是唯一的关键部分。\n\n你的安装需要一个 `/etc/fstab`，至少用于交换文件（swap\
  \ files）。在 `/mnt/etc/fstab` 中创建它。你也可以编辑关键系统文件，如 `/mnt/etc/rc.conf` 和 `/mnt/boot/loader.conf`。\n\
  \n通过一些工作和测试，你可以让你的 ZFS 安装变得你想要的任何简单或复杂。\n\n就像你可以使用 `ZFS` 一样。\n\n## 后记\n\n一本关于文件系统的整本书？你疯了吗？\n\
  \n`ZFS` 确实仅仅是一个文件系统，是的。但它包含了许多文件系统甚至无法想象的功能。你永远不会尝试将自愈功能硬塞进 `extfs`，或将可变块大小强入 `UFS2`。写时复制（Copy\
  \ on write）必须构建在文件系统的核心中——你无法对现有的文件系统进行后期改造。\n\n通过基于数十的文件系统经验并针对现代及未来的硬件，`ZFS` 不仅改变了我们管理数字存储的方式。它改变了我们思考存储的方式。`ZFS`\
  \ 的灵活性和力量使得许多长久的“系统管理最佳实践”过。当你的文件系统是一个盟友而不是威胁时，一切都会变得异常地简单。\n\n`OpenZFS` 的持续增长带来了新功能、稳定的改进以及一种商业供应商无法提供的未来。`OpenZFS`\
  \ 每周都变得更加令人，拥有新功能和更强的性能。它也变得“不那么令人”了，因为它随着每个版本的发布都在越来越多地保护你的数据。我们非常幸运能成为这个伟大项目的一员，并乐幸能借此机会与你分享我们的兴奋。\n\
  \n虽然 Lucas 在写此书之前在使用 `ZFS`，但 Jude 使用大量的 `ZFS` 在世界各地传递大量内容。Jude 是一个 `FreeBSD` 文档提交者，而\
  \ Lucas 写过很多大部头。在一起，我们创造了一本比我们任何一人单独完成都更强大的书。\n\n请关注我们后续更多的 `ZFS` 内容。在 *FreeBSD\
  \ Mastery: Advanced ZFS* 中，我们将带你进入几年前还无法想象的奇特新文件系统领域。\n\n## 关于作者\n\nAllan Jude 是\
  \ ScaleEngine Inc. 的运营副总裁，这是一家全球视频流 CDN，他在 `FreeBSD` 上广泛使用 `ZFS`。他还是每周视频播客 `BSD\
  \ Now`（与 Kris Moore 合作）以及 `Jupitercasting.com` 上 `TechSNAP` 的主持人。Allan 是 `FreeBSD`\
  \ 提交者，专注于改进文档以及在基础系统中实现 `libucl` 和 `libxo`。他曾在 2007-2010 年在加拿大汉尔顿的 Mohawk 学院教授 `FreeBSD`\
  \ 和 `NetBSD`，拥有 13 年的 `BSD` 系统管理员经验。\n\nMichael Lucas 是一位全职作家。他的 `FreeBSD` 经验几乎和\
  \ `FreeBSD` 一样。他曾在多家公司担任了二十年的系统管理员和网络工程师，其中大多数公司已不存在。他写了一系列技术书籍，并翻译成了九种语言。（是的，真正的语言。人们真的在说的语言。）你可以在密歇根州的各种用户小组找到他，访问他的道馆（http://zenmartialarts.com），或通过\
