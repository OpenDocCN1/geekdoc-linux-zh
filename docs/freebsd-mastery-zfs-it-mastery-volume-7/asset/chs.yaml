  \n*(此处省略原文中完全重复的段落翻译，以符合“不要重复输出原文”的要求)*\n\n\n\n\n\n```bash\n## zfs list\nNAME  \
  \              USED  AVAIL  REFER  MOUNTPOINT\nmypool             4.74G  13.5G \
  \   96K  none\n...\nmypool/sheep       10.3M  13.5G  6.10M  /mypool/sheep\nmypool/dolly\
