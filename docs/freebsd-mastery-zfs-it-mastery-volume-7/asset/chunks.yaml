  trans: '

    为了确保你的自定义属性归你所有，并且与其他人的自定义属性产生冲突，请创建一个命名空间。大多数人会在自定义属性前加上组织标识符和冒号作为前缀。例如，FreeBSD
    特有的属性格式为“org.freebsd:propertyname”，如 `org.freebsd:swap`。如果 illumos 项目创建了名为 `swap`
    的自定义属性，他们会将其命名为 `org.illumos:swap`。这两个值就不会发生冲突。


    例如，假设 Jude 想要通过数据集属性来控制哪些数据集进行备份。他创建了 `com.allanjude.` 命名空间。在该命名空间内，他创建了 `backup_ignore`
    属性。


    ```

    # zfs set com.allanjude:backup_ignore=on mypool/lamb

    ```


    Jude 的备份脚本会检查此属性的值。如果它设置为 `true`，备份过程将跳过该数据集。


    ## 父级/子级关系


    数据集从其父数据集继承属性。当你对一个数据集设置属性时，该属性将适用于该数据集及其所有子数据集。为了方便起见，你可以通过添加 `-r` 标志对对数据集及其所有子数据集运行
    `zfs(8)` 命令。在这里，我们查询一个数据集及其所有子数据集的压缩属性。


    ```

    # zfs get -r compression mypool/lamb

    NAME              PROPERTY     VALUE  SOURCE

    mypool/lamb       compression  lz4    inherited from mypool

    mypool/lamb/baby  compression  off    local

    ```


    查看源（SOURCE）值。第一个数据集 `mypool/lamb` 从父池继承了此属性。在第二个数据集中，该属性有一个不同的值。源是 `local`，意味着该属性是专门为该数据集设置的。


    我们可以使用 `zfs inherit` 命令恢复原始设置。


    ```

    # zfs inherit compression mypool/lamb/baby

    # zfs get -r compression mypool/lamb

    NAME              PROPERTY     VALUE SOURCE

    mypool/lamb       compression  lz4   inherited from mypool

    mypool/lamb/baby  compression  lz4   inherited from mypool

    ```


    现在子级现在从父级继承了压缩属性，而父级又从祖父级继承。


    当你更改父级的属性时，新属性会自动向下传播到子级。


    ```

    # zfs set compression=gzip-9 mypool/lamb

    # zfs get -r compression mypool/lamb

    NAME              PROPERTY     VALUE  SOURCE

    mypool/lamb       compression  gzip-9 local

    mypool/lamb/baby  compression  gzip-9 inherited from mypool/lamb

    ```


    我告诉父级数据集使用 `gzip-9` 压缩。这个设置一直渗透到了子级。


    ### 继承与重命名


    当你移动或重命名一个数据集使其拥有新的父级时，父级的属性会自动向下传播到子级。本地设置的属性保持不变，但继承的属性将切换为新父级的属性。


    在这里，我们创建一个新的父级数据集并检查它的压缩属性。


    ```

    # zfs create mypool/second

    # zfs get compress mypool/second

    NAME           PROPERTY     VALUE SOURCE

    mypool/second  compression  lz4   inherited from mypool

    ```


    我们的 baby 数据集使用了 `gzip-9` 压缩。它是从 `mypool/lamb` 继承此属性的。现在让我们把 baby 移动到 `second`
    的子级，看看压缩属性发生了什么变化。


    ```

    # zfs rename mypool/lamb/baby mypool/second/baby

    # zfs get -r compression mypool/second

    NAME                PROPERTY     VALUE  SOURCE

    mypool/second       compression  lz4    inherited from mypool

    mypool/second/baby  compression  lz4    inherited from mypool

    ```


    子级数据集现在属于一个不同的父级，并从新父级继承其属性。子级保留了任何本地属性。


    然而，baby 数据集上的数据有点混乱。在开启压缩之前写入的数据是未压缩的。在数据集使用 `gzip-9` 压缩期间写入的数据是用 `gzip-9` 压缩的。现在写入的任何数据都将使用
    `lz4` 压缩。ZFS 会自动为你处理好这一切，但思考这些确实会让人头疼。


    ### 移除属性


    虽然你可以将属性设回默认值，但并不清楚如何将源改回 `inherit` 或 `default`，或者在设置自定义属性后如何移除它们。


    要移除自定义属性，请对其进行继承操作。


    ```

    # zfs inherit com.allanjude:backup_ignore mypool/lamb

    ```


    即使你在根数据集上设置了该属性，这种方法也有效。


    要在数据集及其所有子数据集上将属性重置为默认值或完全移除自定义属性，请在池的根数据集上使用 `zfs inherit` 命令。


    ```

    # zfs inherit -r compression mypool

    ```


    这违反直觉，但它消除了根数据集上的自定义设置。


    ## 挂载 ZFS 文件系统


    在传统文件系统中，你在 `/etc/fstab` 中列出每个分区、类型以及它应该挂载的位置。为了方便，你甚至列出了软盘和 CD-ROM 驱动等临时挂载。ZFS
    允许你创建如此大量的文件系统，以至于这很快变得不实际。


    每个 ZFS 文件系统都有一个 `mountpoint` 属性，定义它的挂载位置。默认挂载点由池的挂载点构建。如果池没有挂载点，你必须为任何想要挂载的数据集分配挂载点。


    ```

    # zfs get mountpoint zroot/usr/home

    NAME            PROPERTY    VALUE      SOURCE

    zroot/usr/home  mountpoint  /usr/home

    ```


    文件系统通常挂载在 `/usr/home`。用于默认安装的 zroot 池没有挂载点。如果你直接在 zroot 下创建新数据集，它们将没有挂载点。在 zroot
    下（例如 `usr`）创建的数据集会从其父级继承挂载点。


    除了根池以外的任何池通常都有挂载点。如果你创建一个名为 `db` 的池，它将挂载在 `/db`。所有子级都从池继承。


    当你更改文件系统的 `mountpoint` 属性时，该文件系统以及任何继承它的子级会被卸挂载。如果新值为 `legacy`，则它们将保持未挂载状态。否则，如果属性之前是
    `legacy` 或 `none`，或者它们在属性更改之前已挂载，它们将自动重新挂载到新位置。此外，任何共享文件系统都会取消共享并在新位置共享。


    与普通文件系统一样，ZFS 文件系统并不总是挂载的。`canmount` 属性控制文件系统的挂载行为。如果 `canmount` 被设置为 `yes`，运行
    `zfs mount -a` 将挂载文件系统，就像运行 `mount -a` 一样。当你在 `/etc/rc.conf` 中启用 ZFS 时，FreeBSD
    在启动时运行 `zfs mount -a`。


    当 `canmount` 属性设置为 `noauto` 时，数据集只能显式地挂载和卸载。数据集在创建或导入时不会自动挂载，也不会被 `zfs mount -a`
    命令挂载或被 `zfs unmount -a` 卸载。


    当你将 `canmount` 设置为 `off` 时，情况会变得有趣。你可能拥有具有相同挂载点的不可挂数据集。数据集可以仅作为未来数据集的父级存在，但不实际存储文件，正如下文所示。


    数据集不继承 `canmount` 属性。


    更改 `canmount` 属性不会自动卸载或挂载文件系统。如果你对已挂载的文件系统禁用挂载，你需要手动卸载该文件系统或重启。


    ### 无挂载点数据集


    ZFS 数据集是分级的。你可能需要创建一个永远包含文件的数据集，仅作为其他数据集的共同父级。考虑 FreeBSD 10.1 或更新版本的默认安装。


    ```

    # zfs mount

    zroot/ROOT/default   /

    zroot/tmp            /tmp

    zroot/usr/home       /usr/home

    zroot/usr/ports      /usr/ports

    zroot/usr/src        /usr/src

    ...

    ```

