  trans: '

    ZFS 存储池（pool）比传统的 RAID 具有更高的灵活性。传统的 RAID 有固定且不灵活的数据布局（尽管某些硬件厂商拥有具有更灵活性的专有 RAID
    系统）。RAID 软件以确定的顺序写入每个块磁盘。而 ZFS 具有更高的灵活性。如果你有一个五块磁盘的传统 RAID 阵列，该阵列将始终只有五块磁盘。你无法通过添加磁盘来更改阵列。虽然你可能可以将旧磁盘更换为更大的磁盘，但这样做不会改变阵列的大小。创建
    RAID 设备会将阵列的基本特征固定化。


    ZFS 存储池不仅能够容忍变化，而且设计之初就是为了轻松接受添加。如果你有一个包含五个 VDEV 的 ZFS 池，并想添加第六个，这完全没问题。ZFS 会接受该
    VDEV 并毫不费力地开始在该设备上进行数据条带化（striping）。你无法向 RAID-Z VDEV 添加存储空间，只能向池中添加 VDEV。RAID-Z
    VDEV 中的提供者数量在创建时就已经固定了。


    然而，使用 ZFS，该虚拟设备可以是 ZFS 支持的任何类型的 VDEV。取两个镜像对（mirror pairs）VDEV，将它们放入单个 zpool 中。ZFS
    会在它们之间进行数据条带化。在传统 RAID 中，镜像之上的条带被称为 RAID-10。对于大多数用例，RAID-10 是你可以拥性能最高的 RAID。然而，传统
    RAID-10 的大小是固定的，而你可以向池中添加额外的 VDEV。扩展你的 RAID-10 意味着备份数据、向 RAID 阵列添加磁盘并恢复数据。而扩展你的
    zpool 意味着向池中添加更多 VDEV。RAID-10 允许最多两块磁盘的深度，而 ZFS 允许的深度高达 264。


    但记住，池本身不提供任何冗余。所有的 ZFS 冗余都来自底层的 VDEV。


    ### 查看存储池


    要查看系统上所有的池，请运行 `zpool list`。


    ```bash

    # zpool list

    NAME   SIZE  ALLOC  FREE  EXPANDSZ  FRAG  CAP  DEDUP  HEALTH  ALTROOT

    db    2.72T  1.16G  2.72T        -    0%   0%  1.00x  ONLINE  -

    zroot  920G  17.3G  903G         -    2%   1%  1.00x  ONLINE  -

    ```


    第一列给出池名称。此系统有两个池，`db` 和 `zroot`。


    接三列给出每个池的大小和使用信息。你将获得大小、已用空间以及可用空间。


    `EXPANDSZ` 列显示底层存储提供者是否有任何可用空间。正如第 5 章所讨论，你可能扩展此池的空间量。这些空间包含了将用于校验信息的块，因此扩展池并不会给你这么多可用空间。


    在 `FRAG` 下，你将看到此池的碎片化程度。碎片化会降低文件系统的性能。


    `CAP` 列显示了可用空间的占用百分比。


    `DEDUP` 条目显示了文件系统已去重量。第 6 章将介绍去重。


    池的 `HEALTH` 列反映了底层 VDEV 的状态。`ALTROOT` 列显示池的挂载位置。最后，如果你想获取有关池的更多信息，请使用 `zpool list`。

    '
- fmt: '

    The easy way to avoid alignment problems is to make all GPT partitions begin and
    end on megabyte boundaries. Add the `-a 1m` argument to your `gpart add` commands.


    ## ZFS Sector Size


    ZFS defaults to assuming a `512-byte` sector size. Using a `512-byte` filesystem
    sector size on a disk with physical `512-byte` sectors is perfectly fine. Using
    a `512-byte` filesystem sector on a `4K`-sector disk makes the hardware work harder.
    Assume you want to write `4 KB` of data on such a disk. Rather than telling the
    hard drive to write a single physical sector, the hard drive is told to modify
    the first eighth of the sector, then the second eighth, then the third, and so
    on. Doing a `512-byte` write to a `4 KB` sector means reading the entire `4 KB`,
    modifying the small section, then writing it back. This is much slower than just
    overwriting the entire sector. Your performance plummets. If ZFS uses a `4K` sector
    size on a disk with `512-byte` sectors, the disk hardware breaks up the access
    requests into physical sector sizes, at very little performance cost.


    While using a larger sector size does not impact performance, it does reduce space
    efficiency when you’re storing many small files. If you have a whole bunch of
    `1 KB` files, each occupies a single sector.


    ZFS sector size is a property of each virtual device in a pool. You cannot change
    a virtual device’s sector size, even when exporting the pool or replacing a failed
    drive.


    Combined, these two facts mean that it’s almost always preferable to force ZFS
    to use `4K` sectors, regardless of the sector size reported by the underlying
    disk. Using the larger ZFS sector size won’t hurt performance except on certain
    specific database operations, and even then only when using disks that really
    and for true use `512-byte` sectors.


    ZFS uses the sector size of the device that reports the largest sector size. If
    all of your devices claim to use `512-byte` sectors, and you don’t set a larger
    sector size, a virtual device built out of those devices will use `512-byte` sectors.
    Including a single device with `4096-byte` sectors in your `VDEV` forces ZFS to
    use `4096-byte` sectors.


    Don’t trust that your `4K`-sector devices report their sector size. Tell ZFS to
    insist on always using `4K` sectors.


    A pool variable called the `ashift` controls sector size. An `ashift` of `9` tells
    ZFS to use `512-byte` sectors. An `ashift` of `12` tells ZFS to use `4096-byte`
    sectors. (Why `9` and `12`? `2^9` is `512`, while `2^12` is `4096}$.) The way
    you set `ashift` depends on your FreeBSD release.


    ## FreeBSD 10.1 and Newer Ashift


    Set the system’s default `ashift` with the `sysctl vfs.zfs.min_auto_ashift`, either
    in `/etc/sysctl.conf` or at the command line.


    ```

    # sysctl vfs.zfs.min_auto_ashift=12

    ```


    Use the command line during installation, but also set it permanently in `/etc/sysctl.conf`
    so you don’t forget when creating new pools.


    This book’s examples assume that you’re using FreeBSD 10.1 or newer. For older
    FreeBSD versions, you’ll need to set the `ashift` each time rather than setting
    the `sysctl`.


    ## Older FreeBSD Ashift


    FreeBSD versions older than 10.1 lack the `ashift` `sysctl` found in newer FreeBSD
    versions, so you have to rely on ZFS’s internal sector-size-detection code. This
    code reads the sector size from the underlying storage medium—namely, the storage
    provider.


    This case highlights the critical difference between a provider and a disk. FreeBSD
    lets you create a pass-through device with the GEOM module `gnop(8)`. The `gnop`
    module lets you insert arbitrary data between your storage devices—in this case,
    enforcing a sector size. You create a `gnop` device that says, “Pass everything
    through transparently, but insist on a `4096-byte sector size.” Use that device
    to create your `zpool`. Here, we add a `gnop` device to the partition labeled
    `/dev/gpt/zfs0`.


    ```

    # sysctl vfs.zfs.min_auto_ashift=12

    # gnop /dev/gpt/zfs0

    ```

