    池中的每块磁盘都包含四个 ZFS 标签：两个在驱动器前端，两个在末尾。每个标签包含池名称、一个全局唯一标识（GUID）以及每个 VDEV 成员的信息。每个标签还预留了
    128 KB 用于存储超级块（uberblocks）。


    `uberblock` 是一个固定大小的对象，包含指向元对象集（MOS）的指针、生成该 `uberblock` 的事务组编号以及一个校验和。


    `MOS` 记录了池中所有内容的顶层信息，包括指向池中所有根数据集列表的指针。反之，这些列表中的每一个都指向其子节点的类似列表，以及描述存储在数据集中的文件和目录的块。ZFS
    根据数据需要将这些列表和指针对象链。在树的底部，叶节点块包含存储在池中的实际数据。


    每个对象都包含一个校验和和一个出生时间（birth time）。校验和用于确保对象的有效性。出生时间是创建该块的事务组 (`txg`) 编号。出生时间是快照基础设施的关键部分。


    修改数据块会影响整棵树。被修改的数据块被写入新位置，因此指向它的块也需要更新。这个指针块也会被写入新位置，因此树中下一个对象也需要更新。这种变化会一直传播到
    `uberblock`。


    `uberblock` 是树的根。所有内容都源于它。ZFS 无法在不破坏写复制（copy-on-write）规则的情况下修改 `uberblock`，因此它会轮换
    `uberblock`。每个标签预留 128 KB 用于超级块。512 字节扇区的磁盘有 128 个超级块，而 4 KB 扇区的磁盘有 32 个超级块。如果你有一个
    16 KB 扇区的磁盘，它将只有 8 个超级块。每次文件系统更新都会向此数组添加一个新的超级块。当数组满时，最旧的超级块会被覆盖。


    当系统启动时，ZFS 会扫描所有的超级块，找到具有有效校验和的最新的一个，并使用它来导入池。即使最近的更新由于某种原因搞失败了，系统也可以导入池在几秒钟之前的一致版本。如果系统在写入期间失败，最后的数据将丢失——但这些数据根本从未到达磁盘。它们消失了，ZFS
    也无能力。使用写复制意味着 ZFS 不会遇到导致传统文件系统需要 `fsck(8)` 的问题。


    ## 快照的工作原理


    当管理员告诉 ZFS 创建快照时，ZFS 会复制文件系统的顶层元数据块。活跃系统使用副本，将原始块留给快照使用。创建快照只需要复制这一个块，这意味着 ZFS
    几乎可以创建快照。ZFS 不修改快照内部的数据或元数据，使快照变为只读。ZFS 会记录关于快照的其他元数据，例如出生时间。


    快照还需要一个新的 ZFS 元数据，即死列表（`dead list`）。数据集的死列表记录了最近快照使用过但不再属于数据集的所有块。当你从数据集中删除文件时，该文件使用的块会被添加到数据集的死列表中。当你创建快照时，活跃数据集的死列表会被移交给快照，而活跃数据集将获得一个新的、空的死列表。


    在活跃数据集上删除、修改或覆盖文件意味着为新数据分配新块，并断开包含旧数据的块。然而，快照需要其中一些旧数据块。在丢弃旧块之前，系统会检查快照是否仍然需要它。


    ZFS 比较旧数据块的出生时间与最近快照的出生时间。比快照年轻的块不可能被该快照使用，可以放入回收桶。比快照出生时间的块仍被快照使用，因此会被添加到活跃数据集的死列表中。


    在所有这一切之后，快照仅仅是快照拍摄时活跃数据集正在使用的块列表。创建快照告诉 ZFS 保留这些块，即使使用这些块的文件已从活跃文件系统中删除。


    这意味着 ZFS 并不会保留每个文件的每个版本。当你创建一个新文件并在拍摄快照之前删除它时，该文件就消失了。每个快照包含每个文件在快照创建时的副本。ZFS
    不保留像 DragonFly 的 `HAMMER` 那样的历史。


    删除快照需要比较块的出生时间，以确定哪些块现在可以释放，哪些仍在在使用。如果你删除了最近的快照，数据集当前的死列表将更新，以移除仅由该快照所需的块。


    快照意味着数据可以长期存在。如果你在一年前拍摄了快照，那么任何出生日期超过一年的块仍在在使用中，无论你是在 11 个月前删除的，还是今天午饭前删除的。如果一年前的快照需要大部分这些块，删除六个月前的快照可能释放不了多少空间。


    只有当没有文件系统、卷或快照使用某个块时，它才会被释放。


    ## 使用快照


    为了实验快照，让我们创建一个文件系统数据集并填充一些文件。


    ```bash

    # zfs create -o mountpoint=/sheep mypool/sheep

    # cd /sheep

    # dd if=/dev/random of=randomfile bs=1m count=1

    # fetch -o zfsbook.html http://www.zfsbook.com/

    # date > date.txt

    ```


    这为我们提供了一些可以操作的数据。


    ### 创建快照


    使用 `zfs snapshot` 创建快照通过完整路径指定数据集，然后添加 `@` 和快照名称。


    ```bash

    # zfs snapshot mypool/sheep@snap1

    ```


    使用 `zfs list -t snapshot` 查看快照。要查看特定数据集的快照，添加 `-r` 标志和数据集名称。


    ```bash

    # zfs list -t snapshot -r mypool/sheep

    NAME               USED  AVAIL  REFER  MOUNTPOINT

    mypool/sheep@snap1    0      -  1.11M  -

    ```


    注意，快照占用的空间（`USED` 列）为 `0`。快照中的每个块仍被活跃数据集使用，因此快照没有消耗额外空间。


    ### 数据集更改与快照空间


    现在更改数据集并查看它如何影响快照。在这里，我们在随机文件中追加了一兆字节的新垃圾数据并更新了日期文件。


    ```bash

    # dd if=/dev/random of=randomfile bs=1m count=1 oseek=1

    # date > date.txt

    ```


    回想快照的工作原理。随机数据文件增长了一个兆字节，但这并不在旧的快照中。日期文件被替换了，因此快照应该保留旧文件所使用的块。让我们看看这对快照的空间使用产生什么影响。


    ```bash

    # zfs list -t snapshot -r mypool/sheep

    NAME                USED  AVAIL  REFER  MOUNTPOINT

    mypool/sheep@snap1   72K      -  1.11M  -

    ```


    快照现在使用了 72 KB。快照消耗的唯一空间是日期文件中被替换的块。快照不会因为较大的随机文件吸收了新空间而收费，因为没有块被覆盖。


    现在让我们创建第二个快照并看看它占用了多少空间。


    ```bash

    # zfs snapshot mypool/sheep@second

    # zfs list -t snapshot -r mypool/sheep

    NAME                USED  AVAIL  REFER  MOUNTPOINT

    mypool/sheep@snap1   72K      -  1.11M  -

    mypool/sheep@second    0      -  2.11M  -

    ```


    `REFER` 列显示第一个快照让你访问 1.11 MB 的数据，而第二个快照让你看到 2.11 MB 的数据。第一个快照使用 72 KB 空间，而第二个没有使用。第二个快照仍然与活跃数据集相同。


    但并不会持续多久。让我们通过覆盖随机文件的一部分来更改活跃数据集，并查看空间的变化。


    '
- fmt: '

    ```

    # dd if=/dev/random of=randomfile bs=1m count=1 oseek=1

    # zfs list -t snapshot -r mypool/sheep

    NAME                  USED  AVAIL  REFER  MOUNTPOINT

    mypool/sheep@snap1     72K      -  1.11M  -

    mypool/sheep@second  1.07M      -  2.11M  -

    ```


    We’ve overwritten one megabyte of the random data file. The first snapshot’s space
    usage hasn’t changed. The second snapshot shows that it’s using 1 MB of space
    to retain the overwritten data, plus some metadata overhead.


    ## Recursive Snapshots


    ZFS lets you create recursive snapshots, which take a snapshot of the dataset
    you specify and all its children. All of the snapshots have the same name. Use
    the `-r` flag to recursively snapshot a system. Here we snapshot the boot pool
    with a single command.


    ```

    # zfs snapshot -r zroot@beforeupgrade

    ```


    We now have a separate snapshot for each dataset in this pool, each tagged with
    `@beforeupgrade`.


    ```

    # zfs list -t snapshot

    NAME                            USED  AVAIL  REFER  MOUNTPOINT

    zroot@beforeupgrade                0      -   144K  -

    zroot/ROOT@beforeupgrade           0      -   144K  -

    zroot/ROOT/default@beforeupgrade   0      -  1.35G  -

    zroot/usr@beforeupgrade            0      -   454M  -

    zroot/usr/local@beforeupgrade      0      -  1.54G  -

    …

    ```


    We can now abuse this system with wild abandon, secure in knowing that a known
    good version of the system exists in snapshots.


    ## Advanced Dataset and Snapshot Viewing


    Once you grow accustomed to ZFS you’ll find that you’ve created a lot of datasets,
    and that each dataset has a whole bunch of snapshots. Trying to find the exact
    snapshots you want gets troublesome. While you can always fall back on `grep(1)`,
    the ZFS command line tools have very powerful features for viewing and managing
    your datasets and snapshots. Combining options lets you zero in on exactly what
    you want to see. We started with `zfs list` in Chapter 4, but let’s plunge all
    the way in now.


    Many of these options work for other types of datasets as well as snapshots. If
    you stack filesystems 19 layers deep, you’ll probably want to limit what you see.
    For most of us, though, snapshots are where these options really start to be useful.
    Many features also work with `zpool(8)` and pools, although pools don’t get as
    complicated as datasets.


    A plain `zfs list` displays filesystem and zvol datasets, but no snapshots.


    ```

    # zfs list

    NAME                USED  AVAIL  REFER  MOUNTPOINT

    mypool             4.62G  13.7G    96K  none

    mypool/ROOT         469M  13.7G    96K  none

    mypool/ROOT/default 469M  13.7G   469M  /

    mypool/avolume     4.13G  17.8G    64K  -

    …

    ```


    You can examine a single dataset by name.


    ```

    # zfs list mypool/sheep

    NAME           USED  AVAIL  REFER  MOUNTPOINT

    mypool/sheep  2.11M  13.7G  2.11M  /mypool/sheep

    ```


    To view a pool or dataset and all of its children, add the `-r` flag and the pool
    or dataset name.


    ```

    # zfs list -r mypool/var

    NAME               USED  AVAIL  REFER  MOUNTPOINT

    mypool/var        22.6G   854G  1.70G  /var

    mypool/var/crash   355M   854G   355M  /var/crash

    mypool/var/db      224M   854G   187M  /var/db

    …

    ```


    Once you get many datasets, you’ll want to narrow this further.


    ### View Datasets by Type


    To see only a particular type of dataset, use the `-t` flag and the dataset type.
    You can view filesystems, volumes, snapshots, and bookmarks.


    ```

    # zfs list -t snapshot -r mypool

    NAME                    USED  AVAIL  REFER  MOUNTPOINT

    mypool@all                 0      -    96K  -

    mypool/ROOT@all            0      -    96K  -

    mypool/ROOT/default@all  84K      -   419M  -

    mypool/avolume@all         0      -    64K  -

    ...

    ```


    You can examine specific snapshots by giving the complete snapshot name.


    ```

    # zfs list -t snapshot mypool/sheep@all

    NAME             USED  AVAIL  REFER  MOUNTPOINT

    mypool/sheep@all    0      -  2.11M  -

    ```


    Be sure you give the complete name, including the snapshot part. Here we tell
    `zfs list` to show only snapshots, and then give it the name of a filesystem dataset;
    `zfs(8)` very politely tells us to be consistent in what we ask for.


    ```

    # zfs list -t snapshot mypool/sheep

    cannot open ''mypool/sheep'': operation not applicable to datasets of this type

    ```


    We used the `-r` flag before to show a dataset and all of its children. It also
    works with the list of snapshots.


    ```

    # zfs list -r -t snapshot mypool/second

    NAME                    USED  AVAIL  REFER  MOUNTPOINT

    mypool/second@all          0      -    96K  -

    mypool/second/baby@all     0      -    96K  -

    ```


    To view absolutely everything, use `-t all`.


    ```

    # zfs list -r -t all mypool/second

    NAME                   USED  AVAIL  REFER  MOUNTPOINT

    mypool/second          192K  13.5G    96K  legacy

    mypool/second@all         0      -    96K  -

    mypool/second/baby      96K  13.5G    96K  legacy

    mypool/second/baby@all    0      -    96K  -

    ```


    If you have many layers of datasets you might want a partially recursive view.
    While `-r` shows all the children, the `-d` option limits the number of layers
    you see. Limit the depth to 1 and you get the snapshots of only a single dataset.


    ```

    # zfs list -d 1 -t snapshot mypool/sheep

    NAME           USED  AVAIL  REFER  MOUNTPOINT

    mypool/sheep  2.11M  13.7G  2.11M  /mypool/sheep

    ```

    *(Note: The original text had a typo in the command `zfs list -d 1 -t snapshot
    mypool/sheep`, I have kept the logic but ensured the command is clear based on
    context).*


    ### Modifying zfs list Output


    You can control which information `zfs list` displays with the `-o` option and
    a list of columns. When you use `-o`, `zfs list` displays only the information
    you request. Look at any earlier `zfs list` output and you’ll see the `NAME` column
    (predictably) shows the dataset name. Show only that column with `-o`. Here we
    recursively list all of the snapshots in mypool, showing only their name.


    ```

    # zfs list -r -t snapshot mypool -o name

    NAME

    mypool@all

    mypool/ROOT@all

    mypool/sheep@snap2

    mypool/sheep@moresmore

    ...

    ```


    You can display any property as a column as well. Here we list some filesystem
    properties for each dataset.


    ```

    # zfs list -o name,atime,exec,setuid

    NAME        ATIME  EXEC  SETUID

    mypool         on    on      on

    mypool/sheep   on    on      on

    zroot         off    on      on

    zroot/ROOT    off    on      on

    ```


    Yes, filesystem properties have nothing to do with snapshots. But they’re a good
    example of this feature.


    Finally, you can change the order `zfs list` shows datasets. Use `-s` and a property
    to sort by the property’s value. Use `-S` and a property to reverse sort the output.
    List multiple properties in order, separated by commas.


    ### Listing Snapshots by Default


    The `zfs list` command defaults to hiding snapshots and bookmarks. If you want
    to see these datasets by default, set the pool’s `listsnapshots` property to `on`.


    ```

    # zpool set listsnapshots=on zroot

    ```


    Once you’ve run with this for a while, however, we’re highly confident you’ll
    turn it back off. Accumulated snapshots quickly overwhelm everything.


    ### Scripts and ZFS


    Sysadmins like automation. One annoying thing about automation is when you must
    run a command and parse the output. Making output more human-friendly often makes
    it less automation-friendly. The ZFS developers were all too familiar with this
    problem, and included command-line options to eliminate most of it.


    The `-p` option tells `zfs(8)` and `zpool(8)` to print exact values, rather than
    human-friendly ones. A pool doesn’t actually have 2 TB free—it’s just a number
    that rounds to that. Using `-p` prints the actual value in all its glory.


    The `-H` option tells `zfs(8)` and `zpool(8)` to not print headers, and to separate
    columns with a single tab, instead of making them line up nicely, the way humans
    like. You are human, aren’t you?

