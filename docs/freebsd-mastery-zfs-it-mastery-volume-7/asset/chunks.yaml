- fmt: '

    Sick of that dataset? Drag it out behind the barn and put it out of your misery
    with `zfs destroy`.


    ```

    # zfs destroy db/old

    ```


    If you add the `-r` flag, you recursively destroy all children (datasets, snapshots,
    etc.) of the dataset. To destroy any cloned datasets while you’re at it, use `-R`.
    Be very careful recursively destroying datasets, as you can frequently be surprised
    by what, exactly, is a child of a dataset.


    You might use the `-v` and `-n` flags to see exactly what will happen when you
    destroy a dataset. The `-v` flag prints verbose information about what gets destroyed,
    while `-n` tells `zfs(8)` to perform a dry run. Between the two, they show what
    this command would actually destroy before you pull the trigger.


    ## ZFS Properties


    ZFS datasets have a number of settings, called `properties`, that control how
    the dataset works. While you can set a few of these only when you create the dataset,
    most of them are tunable while the dataset is live. ZFS also offers a number of
    read-only properties that provide information such as the amount of space consumed
    by the dataset, the compression or deduplication ratios, and the creation time
    of the dataset.


    Each dataset inherits its properties from its parent, unless the property is specifically
    set on that dataset.


    ### Viewing Properties


    The `zfs(8)` tool can retrieve a specific property, or all properties for a dataset.
    Use the `zfs get` command, the desired property, and if desired, a dataset name.


    ```

    # zfs get compression mypool/lamb

    NAME         PROPERTY     VALUE  SOURCE

    mypool/lamb  compression  lz4    inherited from mypool

    ```


    Under `NAME` we see the dataset you asked about, and `PROPERTY` shows the property
    you requested. The `VALUE` is what the property is set to.


    The `SOURCE` is a little more complicated. A source of default means that this
    property is set to ZFS’ default. A local source means that someone deliberately
    set this property on this dataset. A temporary property was set when the dataset
    was mounted, and this property reverts to its usual value when the dataset is
    unmounted. An inherited property comes from a parent dataset, as discussed in
    “Parent/Child Relationships” later in this chapter.


    Some properties have no source because the source is either irrelevant or inherently
    obvious. The `creation` property, which records the date and time the dataset
    was created, has no source. The value came from the system clock.


    If you don’t specify a dataset name, `zfs get` shows the value of this property
    for all datasets. The special property keyword `all` retrieves all of a dataset’s
    properties.


    ```

    # zfs get all mypool/lamb

    NAME         PROPERTY   VALUE                 SOURCE

    mypool/lamb  type       filesystem            -

    mypool/lamb  creation   Fri Mar 27 20:05 2015 -

    mypool/lamb  used       192K                  -

    ...

    ```


    If you use `all` and don’t give a dataset name, you get all the properties for
    all datasets. This is a lot of information.


    Show multiple properties by separating the property names with commas.


    ```

    # zfs get quota,reservation zroot/home

    NAME        PROPERTY     VALUE   SOURCE

    zroot/home  quota        none    local

    zroot/home  reservation  none    default

    ```


    You can also view properties with `zfs list` and the `-o` modifier. This is most
    suited for when you want to view several properties from multiple datasets. Use
    the special property name to show the dataset’s name.


    ```

    # zfs list -o name,quota,reservation

    NAME                QUOTA  RESERV

    db                   none    none

    zroot                none    none

    zroot/ROOT           none    none

    zroot/ROOT/default   none    none

    ...

    zroot/var/log        100G     20G

    ...

    ```


    You can also add a dataset name to see these properties in this format for that
    dataset.


    ### Changing Properties


    Change properties with the `zfs set` command. Give the property name, the new
    setting, and the dataset name. Here we change the `compression` property to `off`.


    ```

    # zfs set compression=off mypool/lamb/baby

    ```


    Confirm your change with `zfs get`.


    ```

    # zfs get compression mypool/lamb/baby

    NAME              PROPERTY     VALUE  SOURCE

    mypool/lamb/baby  compression  off    local

    ```


    Most properties apply only to data written after the property is changed. The
    `compression` property tells ZFS to compress data before writing it to disk. We
    talk about compression in Chapter 6. Disabling compression doesn’t uncompress
    any data written before the change was made. Similarly, enabling compression doesn’t
    magically compress data already on the disk. To get the full benefit of enabling
    compression, you must rewrite every file. You’re better off creating a new dataset,
    copying the data over with `zfs send`, and destroying the original dataset.


    ### Read-Only Properties


    ZFS uses read-only properties to offer basic information about the dataset. Disk
    space usage is expressed as properties. You can’t change how much data you’re
    using by changing the property that says “your disk is half-full.” (Chapter 6
    covers ZFS disk space usage.) The `creation` property records when this dataset
    was created. You can change many read-only properties by adding or removing data
    to the disk, but you can’t write these properties directly.


    ## Filesystem Properties


    One key tool for managing the performance and behavior of traditional filesystems
    is mount options. You can mount traditional filesystems read-only, or use the
    `noexec` flag to disable running programs from them. ZFS uses properties to achieve
    the same effects. Here are the properties used to accomplish these familiar goals.


    ### atime


    A file’s `atime` indicates when the file was last accessed. ZFS’ `atime` property
    controls whether the dataset tracks access times. The default value, `on`, updates
    the file’s atime every time it is accessed. Using atime means writing to the disk
    every time you read.


    Turning this property off avoids writing to the disk when you read a file, and
    can result in significant gains. It might confuse mailers and other similar utilities
    that depend on being able to determine when a file was read.


    Leaving atime on increases snapshot size. The first time a file is accessed, its
    atime is updated. The snapshot retains the original access time, while the live
    filesystem contains the newly updated time. This is the default.


    ### exec


    The `exec` property determines if anyone can run binaries and commands on this
    filesystem. The default is `on`, which permits execution. Some environments don’t
    permit users to execute programs from their personal or temporary directories.
    Set the `exec` property to `off` to disable execution of programs on the filesystem.


    The `exec` property doesn’t prohibit people from running interpreted scripts,
    however. If a user can run `/bin/sh`, they can run `/bin/sh /home/mydir/script.sh`.
    The shell is what’s actually executing—it only takes instructions from the script.


    ### readonly


    If you don’t want anything writing to this dataset, set the `readonly` property
    to `on`. The default, `off`, lets users modify the dataset within administrative
    permissions.


    ### setuid


    Many people consider setuid programs risky. While some setuid programs must be
    setuid, such as `passwd(1)` and `login(1)`, there’s rarely a need to have setuid
    programs on filesystems like `/home` and `/tmp`. Many sysadmins disallow setuid
    programs except on specific filesystems.


    ZFS’ `setuid` property toggles setuid support. If set to `on`, the filesystem
    supports setuid. If set to `off`, the setuid flag is ignored.


    ## User-Defined Properties


    ZFS properties are great, and you can’t get enough of them, right? Well, start
    adding your own. The ability to store your own metadata along with your datasets
    lets you develop whole new realms of automation. The fact that children automatically
    inherit these properties makes life even easier.

