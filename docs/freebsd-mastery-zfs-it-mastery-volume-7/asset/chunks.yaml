    # zpool get comment

    NAME   PROPERTY  VALUE  SOURCE

    db     comment   -      default

    zroot  comment   -      local

    ```


    We locally set the comment to the default value, so the value’s source remains
    local.


    You can set a pool’s properties at creation time with -o. You can set properties
    for the root dataset on that pool with -O.


    ```

    # zpool create -o altroot=/mnt -O canmount=off -m none zroot /dev/gpt/disk0

    ```


    The pool has its altroot property set to /mnt, and the root dataset on this pool
    has the canmount property set to *off*. If a property changes how data is written,
    only data written after changing the property is affected. ZFS won’t rewrite existing
    data to comply with a property change.


    ## Pool History


    Every zpool retains a copy of all changes that have ever been made to the pool,
    all the way back to the pool’s creation. This history doesn’t include routine
    events like system power-on and power-off, but it does include setting properties,
    pool upgrades, and dataset creation.


    To access the history, run zpool history and give the pool name.


    ```

    # zpool history zroot

    History for ''zroot'':

    2014-01-07.04:12:05 zpool create -o altroot=/mnt -O canmount=off -m none zroot
    mirror /dev/gpt/disk0.nop /dev/gpt/disk1.nop

    2014-01-07.04:12:50 zfs set checksum=fletcher4 zroot

    2014-01-07.04:13:00 zfs set atime=off zroot

    …

    ```


    Experienced FreeBSD hands probably recognize this from any number of ZFS tutorials
    in the FreeBSD documentation and forums.


    The history ends with:


    <pre>...


    2015-03-12.14:36:35 zpool set comment=Main OS files zroot


    2015-03-12.14:43:45 zpool set comment=- zroot</pre>


    We changed the comment property, so it’s in the history. Forever.


    Sadly, the pool history doesn’t track who made each change, but having a permanent
    record of changes helps with problem analysis.


    ## Zpool Maintenance Automation


    FreeBSD checks each system’s filesystems as part of the daily maintenance job
    run by periodic(8). You can add ZFS pool information to this check, so that you’ll
    get information on pool health. The daily_status_zfs_enable periodic.conf option
    enables pool checks.


    daily_status_zfs_enable="YES"


    The daily periodic(8) output now includes the output of zpool status -x, which
    is normally the single line of “all pools are healthy.”


    If you want more detailed information on your pools, the daily report can also
    include zpool list output. Set daily_status_zfs_zpool_list to YES to get the list.
    If you want to trim that output, showing only the status of specific pools, list
    the desired pools in the daily_status_zpool periodic.conf variable.


    You can also have FreeBSD perform your pool scrubs. With the scrubbing options
    set, FreeBSD performs a daily check to see if the pool needs scrubbing, but only
    scrubs at configured intervals. To automatically scrub every pool every 35 days,
    set daily_scrub_zfs_enable to YES in periodic.conf.


    daily_scrub_zfs_enable="YES"


    FreeBSD defaults to scrubbing all pools. You can’t explicitly exclude specific
    pools from the daily scrub check. You can, however, explicitly list the pools
    you want checked in daily_scrub_zfs_pools. Any pool not listed isn’t scrubbed.


    daily_scrub_zfs_pools="zroot prod test"


    To change the number of days between scrubs, set daily_scrub_zfs_default_threshold
    to the desired number of days.


    daily_scrub_zfs_default_threshold="10"


    If you want to scrub a specific pool on a different schedule, set daily_scrub_zfs_${poolname}_threshold
    to the desired number of days. Here we scrub the pool prod every 7 days.


    daily_scrub_zfs_prod_threshold="7"


    Any pool without its own personal threshold uses the default threshold.


    ## Removing Pools


    To get rid of a pool, use the zpool destroy command and the pool name.


    ```

    # zpool destroy test

    ```


    Destruction marks the pool’s underlying providers as being part of a destroyed
    pool, so that they can be reused for other pools. It does not erase the disks,
    and anyone who has read Chapter 5 can restore the pool and access the data.


    If you must securely erase or overwrite the data on the providers, you’ll need
    a disk overwriting or shredding program.


    ## Zpool Feature Flags


    ZFS and pools originally came with a version number, indicating the features supported
    by the pool. A system could look at an unfamiliar storage provider and say, “Oh,
    this pool is ZFS version 20, so it doesn’t support deduplication or native encryption.”
    You could upgrade the pool to the newest version supported by your release—or
    not.


    Then Oracle closed the ZFS source, leaving various people to pick up the last
    open-source ZFS release and maintain it on their own. The final open-source Oracle
    ZFS version was 28\. As various groups implemented their own pool features, version
    numbers from different groups threatened to become mutually incompatible. Different
    ZFS teams could implement whatever new features they chose, meaning that, say,
    FooZFS version 30 would be incompatibly with BarZFS version 30\. A major goal
    of ZFS is interoperability.


    The OpenZFS team decided that the best way forward was to break away from tracking
    features with version numbers. They cranked the OpenZFS version up to 5000, leaving
    Oracle plenty of room to add new versions. To accommodate all the different OpenZFS
    developers on all the different platforms, the developers chose to effectively
    replace the version numbers with *feature flags*.


    Every platform that runs OpenZFS, including FreeBSD, should include a zpool-features(7)
    manual page that lists the pool features this particular install supports. Newer
    versions of FreeBSD will probably support new pool features.


    Using a feature normally changes the on-disk format in some way. Adding snapshot
    support, for example, means adding new fields and metadata to say “this is a snapshot.”
    A system that doesn’t support that feature will look at this pool and go “oh crud,
    I don’t recognize that data structure. I ain’t touching this!” If you routinely
    swap disks between systems, you’ll want to carefully check feature flags supported
    on the various hosts before upgrading or enabling new feature flags.


    ### Viewing Feature Flags


    To view the feature flags supported by a pool, and their settings, look for pool
    properties that include the word “feature.”


    ```

    # zpool get all zroot | grep feature

    zroot  feature@async_destroy  enabled  local

    zroot  feature@empty_bpobj    active   local

    zroot  feature@lz4_compress   active   local

    …

    ```'
