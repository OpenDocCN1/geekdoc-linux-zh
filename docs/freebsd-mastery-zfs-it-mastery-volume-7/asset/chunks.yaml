    means the disks must be partitioned. The maximum size of the FreeBSD boot loader
    partition is just a smidgen over 512 KB for some daft reason, so assign 512 KB
    for the boot loader. Then we put in a 1 GB FreeBSD swap partition, and assign
    the remaining space for ZFS. The swap and ZFS partitions are aligned at 1 MB boundaries.


    While I’m using these short names for the GPT labels for teaching purposes, we
    strongly encourage you to use location-based labels as discussed in Chapter 0.


    ```

    # gpart add –a 1m -t freebsd-boot -s 512k -l zfsboot da0

    da0p1 added

    # gpart add –a 1m -t freebsd-swap -s 1g -a 1m -l swap0 da0

    da0p2 added

    # gpart add –a 1m -t freebsd-zfs -a 1m -l zfs0 da0

    da0p3 added

    ```


    Now install the FreeBSD ZFS bootloader onto this disk. Every disk you might boot
    from needs the bootloader.


    ```

    # gpart bootcode -b /boot/pmbr -p /boot/gptzfsboot -i 1 da0

    bootcode written to da0

    ```


    Repeat this partitioning for every disk involved in the storage pool.


    ### Pool Creation


    Still at the disk formatting command prompt, assemble your disks into your root
    storage pool. It’s common to call the root pool something like system or zroot,
    or you might name it after the host. Do whatever fits for your environment. I’m
    calling the example pool zroot, so that it fits with the default used by the FreeBSD
    installer.


    Look at the default FreeBSD install’s zpool history and consider what it shows.


    ```

    2015-04-08.07:18:30 zpool create -o altroot=/mnt -O compress=lz4 -O atime=off
    -m none -f zroot raidz1 da0p3.nop da1p3.nop da2p3.nop

    ```


    This is a FreeBSD 10.1 system. The installer mounts the boot pool temporarily
    at /mnt, and we really have to keep that for the installer to work. We want the
    other options, like setting compression to lz4 and disabling atime. The -m none
    tells zpool(8) to not assign a mount point to this pool. Using -f tells zpool(8)
    to ignore any other ZFS information on these disks. The altroot property gives
    a temporary mount point, as discussed in Chapter 4\. You’re reinstalling pools,
    not recycling them.


    The 10.1 installer wasn’t yet updated to take advantage of the vfs.zfs.min_auto_ashift
    sysctl, but I’m going to use it now.


    ```

    # sysctl vfs.zfs.min_auto_ashift=12

    ```


    ZFS will now use 4096-byte sectors. Create the pool. We’re stealing all of the
    default FreeBSD options, making only the changes we desire.


    ```

    # zpool create -o altroot=/mnt -O compress=lz4 -O atime=off -m none -f zroot mirror
    gpt/zfs0 gpt/zfs1 cache gpt/zcache0 log gpt/zlog0

    ```


    Chances are, FreeBSD’s default pool installation options are fine. You probably
    want to tweak the datasets.


    ### Datasets


    While you want to create your custom dataset configuration, do check FreeBSD’s
    installation defaults. They’re sensible for the average user, and allow use of
    advanced features like boot environment managers.'
