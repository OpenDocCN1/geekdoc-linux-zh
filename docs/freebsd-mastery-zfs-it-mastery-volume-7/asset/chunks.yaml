    Snapshots @snap2 and @evenmore have no new data. They’re unchanged from the first
    snapshot.


    Sometime in between the snapshots @evenmore and @later snapshots, the data grew.
    The snapshot @later lets you access 5.11 MB of data. It has 4.07 MB of new data.


    The @rewrite snapshot also lets you access 5.11 MB of data, but it’s written 2.07
    MB of new data. As the amount of data you can access is the same as the previous
    snapshot, some of the old data must have been overwritten.


    The live filesystem has also overwritten 1 MB of data. That data is now included
    only in the @rewrite snapshot.


