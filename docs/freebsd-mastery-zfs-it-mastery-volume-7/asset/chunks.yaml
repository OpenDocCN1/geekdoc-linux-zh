  trans: '

    你无法增大现有磁盘的大小，但你可以更改数据使用该磁盘的方式。几十年来，系统管理员一直通过压缩文件来减少空间占用。我们编写了各种 shell 脚本，对我们已知可以安全压缩的文件运行我们首选的压缩算法，并一直在寻找其他可以压缩以节省空间的文件。而且我们大家都清楚，总会有那么一个之前未知的日志文件，它会不断膨胀直到填满分区并触发警报。3


    ZFS 通过在文件系统层面实时对文件进行压缩，解决了这个问题。你守护进程写入的那些日志文件？ZFS 可以在它们写入时对其进行压缩，使得所有那些脚本都变得毫无意义。这还摊了压缩的成本，因为系统是持续性地压缩所有内容，而不是在凌晨
    3 点疯狂进行磁盘 I/O 时才处理。


    然而，压缩是有代价的。压缩和解压缩需要 CPU 时间，因此盲目地在任何地方开启最高密度的 `gzip` 压缩可能会给磁盘性能增加额外限制。不过，任何性能损失通常会被磁盘活动的减少所抵消。ZFS
    包含了专门为文件系统设计的压缩算法。


    ### 启用压缩


    ZFS 压缩是基于数据集（dataset）的。你可以对某些数据集启用压缩，而对另一些禁用。


    使用 `compression` 属性启用和禁用压缩。这里我们检查 `compression` 设置。


    ```

    # zfs get compress zroot/usr

    NAME       PROPERTY     VALUE SOURCE

    zroot/usr  compression  off   default

    ```


    通过设置 `compression` 属性来启用压缩。默认压缩算法 `LZJB` 并不是 ZFS 提供的最有效的算法。在几乎所有情况下，请使用 `LZ4`
    压缩。在这里我们为 `zroot` 存储池上的所有数据集启用 `LZ4` 压缩，但在 `zroot/var/cdr` 数据集上指定了 `gzip-9`。


    ```

    # zfs set compress=lz4 zroot

    # zfs set compress=gzip-9 zroot/var/cdr

    ```


    ZFS 在文件写入磁盘时对其进行压缩。如果你有一个装满文本文件的数据集，添加压缩并不会让它们变小。要减少文件占用的磁盘空间，你必须在启用压缩后重写所有文件。


    ### 压缩算法


    ZFS 支持多种压缩算法。默认的 `LZJB` 是专为文件系统使用设计的。它可以快速压缩和解压块，且压缩率适中。然而，对于常规使用，它并不是最好的压缩算法。


    `LZ4` 算法是一种更新、速度更快的文件系统特定压缩算法。它在所有方面都优于 `LZJB`。并非所有数据都是可压缩的，但 `LZ4` 能快速检测出不可压缩的文件且不尝试压缩。当你对数据集启用压缩时，除非你有
    `gzip` 压缩的特定用例，否则请使用 `LZ4`。


    `ZLE` 算法压缩文件中的连续零字符串。这是一个极简的压缩系统，对大多数文件来说用处不大。`LZ4` 比 `ZLE` 有效得多，即使对于包含大量连续零的文件也是如此。


    对于特殊情况，ZFS 支持 `gzip` 压缩。`gzip` 使用的 CPU 时间比 `LZ4` 多得多，但对某些数据集可能更有效。`gzip` 需要的额外
    CPU 时间会使文件系统变慢，但对于不经常访问的数据，节省磁盘空间可能是值得的。


    `gzip` 有九个压缩级别，从 1（最快但效果最小）到 9（最慢但最积极）。使用连字符和级别来指定 `gzip` 压缩级别。


    ```

    # zfs set compress=gzip-1 zroot/var/log

    ```


    如果你指定了 `gzip` 而没有指定级别，ZFS 将使用默认的 6 级。


    ### 压缩属性


    若干属性可以让你了解 ZFS 压缩数据效果的优劣。


    `compressratio` 属性显示压缩如何影响该数据集及其所有子数据集，而 `refcompressratio` 属性允许你查看压缩如何影响该数据集的引用的数据。


    数据集有两个专门针对压缩场景的属性：`logicalreferenced` 和 `logicalused`。数据集的引用的空间（referenced space）包含了压缩的影响，但
    `logicalreferenced` 属性排除了压缩。


    同样地，`used` 属性显示数据集及其所有子数据集实际消耗的空间量，而 `logicalused` 显示数据中未压缩的数据量。


    当你结合研究所有这些属性时，可以很好地了解压缩是如何影响你的数据的。


    ### 选择算法


    如何判断你的数据是否能从压缩中获益，或者不同的算法如何影响文件大小？获取你的一些典型数据文件并进行测试。

