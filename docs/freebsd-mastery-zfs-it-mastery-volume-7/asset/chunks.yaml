    free. They are, but a pool’s space properties include space required for parity
    information. They don’t reflect the amount of data you can fit on the pool.


    If you have a mirror or a striped pool, the pool space information is fairly close
    to reality. If you’re using RAID-Z1, you’ll lose one provider of space to parity
    per virtual device in the pool. RAID-Z2 costs two disks per VDEV, and RAID-Z3
    costs three disks per VDEV. While you could, in theory, use these properties,
    the pool’s current usage, and a bit of math to get a good guess as to how much
    space you’re using, there’s an easier way: ask zfs(8) about the pool’s root dataset.


    ```

    # zfs list zroot

    NAME    USED  AVAIL  REFER  MOUNTPOINT

    zroot  37.7G   854G   144K  none

    ```


    This pool is using 37.7 GB and has 854 GB free.


    ### ZFS, df(1), and Other Traditional Tools


    So ZFS has all kinds of fancy abilities to slice and dice its display of disk
    usage. After decades of using df(1) to look at disk usage, many of us are loathe
    to change. When you’re using ZFS, however, the venerable df(1) and many other
    tools are not merely less than optimal—they’re actively incorrect and give wrong
    or confusing answers for ZFS. We’re going to use df(1) as an example, but many
    other tools have similar problems.


    Traditional filesystems consist of a single partition. That partition has a size,
    based on the number of blocks allocated on the underlying disk. The df(1) tool
    iterates over each mounted filesystem, and shows the size of the partition, how
    much of that space is currently used, and how much is remaining as free space.


    Walking through the filesystems doesn’t work for ZFS, because datasets are not
    filesystems. ZFS exposes each dataset to the operating system as if it were a
    separate filesystem. A dataset does not have a maximum size (unless it has a quota).
    While you can set upper and lower limits on the size of a dataset, all ZFS datasets
    have access to all of the available free space in the pool.


    To offer some semblance of compatibility with the traditional df(1) tool, ZFS
    tells a little white lie. Since a ZFS dataset has no “size” in the traditional
    filesystem sense, it sums the used space, and the entire pool’s available free
    space together, and presents that value as the “size” of the dataset.


    Look at our example pools in the previous section. The zroot/ROOT/default dataset
    uses 1.35 GB of space, and has 874 GB free. The total size is 875.35 GB. Then
    look at the zroot/usr dataset. It has used 12.5 GB, and has 874 GB free, for a
    total of 886.5 GB.


    Now check some actual df(1) output for these datasets.


    ```

    # df -h

    Filesystem          Size  Used  Avail Capacity  Mounted on

    zroot/ROOT/default  875G  1.4G  874G        0%  /

    zroot/usr           874G  454M  874G        0%  /usr

    ...

    ```


    The root filesystem is 875 GB, and /usr is 874 GB, giving these two partitions
    a total of 1749 GB, with 1748 GB free. Pretty impressive for a 1 TB disk, isn’t
    it? The “Capacity” column that showed what percentage of the filesystem is in
    use is similarly bogus.


    As datasets grow larger, the amount of free space shrinks. According to df(1),
    the filesystem shrinks as space is used up, and grows when space is freed.'
