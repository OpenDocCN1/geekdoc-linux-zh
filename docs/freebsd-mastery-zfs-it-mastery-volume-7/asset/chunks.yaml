    of space, the reserved space will still be available for writes to that dataset.


    Suppose we reserve 100 GB out of a 1 TB pool for /var/db, where our database stuffs
    its data files. This dataset has about 50 GB of data in it. A log file runs amok,
    and fills the rest of the pool. We’ll get errors from the other programs on the
    system saying that the disk is full—but the database program will still have free
    space in /var/db. It might complain that it can’t write program logs to /var/log/db,
    but that’s a separate issue.


    ZFS manages reservations with two ZFS properties: refreservation and reservation.
    A refreservation affects the dataset’s referenced data—that is, it excludes snapshots,
    clones, and other descendants. A reservation includes child datasets, snapshots,
    and so on. For an example, look at this snippet from zfs list.


    ```

    # zfs list

    NAME                    USED  AVAIL  REFER  MOUNTPOINT

    zroot/usr              12.5G   874G   454M  /usr

    zroot/usr/local        1.84G   874G  1.84G  /usr/local

    zroot/usr/obj          6.89G   874G  6.89G  /usr/obj

    zroot/usr/ports        1.97G   874G   816M  /usr/ports

    …

    ```


    The zroot/usr dataset is mounted as /usr. It “uses” 12.5 GB, including child datasets
    such as /usr/local, /usr/obj, and so on. It refers to only 454 MB, meaning that
    the amount of data on the main zroot/usr dataset is less than half a gigabyte.


    If we set a reservation of 1 GB on zroot/usr, that’s basically moot. The existing
    files in the child datasets far exceed that, and the odds of something non-catastrophic
    trimming those children down to less than 1 GB are negligible.


    If we set a refreservation of 1 GB on zroot/usr, though, it only affects files
    on zroot/usr. The child datasets are excluded. The dataset is currently half full,
    so it would have space to write more files.


    That’s an extreme example, but somewhat artificial. Suppose you want to ensure
    that all of your users get at least 1 GB of disk space. Create a separate dataset
    for each user’s home directory and assign each a reservation.


    You might also nest reservations. Suppose you have two datasets, zroot/var/log
    and zroot/var/log/db, the latter exclusively for your database server. You want
    to always have at least 10 GB for your database server logs, so you assign a reservation
    to zroot/var/log/db. Then you want 20 GB for generic server logs. If that 20 GB
    should include the database logs, use a reservation. If it should not include
    the database logs, use a refreservation.


    A dataset might have both a reservation and a refreservation. You might say that
    the dataset zroot/var/log/db has a 10 GB refreservation for current log files,
    but set a much larger reservation so that you can take snapshots of the dataset
    and count their usage separately.


    Attempting to violate a reservation generates an “out of space” error. When that
    error appears even though you know you still have free disk space, check your
    reservations. The datasets with reservations will show free space, but all others
    will be full.


    ### Viewing Reservations


    You can check the reservations and refreservations separately, but we prefer to
    get all reservation information at once. You can view the specific list of properties
    by running zfs get -o reservation,refreservation,usedbyrefreservation, but Lucas
    is too blasted lazy to type all that and he’s the lead author, so this example
    uses grep(1).


    ```

    # zfs get all zroot/var/log/db | grep reserv

    zroot/var/log/db  reservation           none   default

    zroot/var/log/db  refreservation        none   default

    zroot/var/log/db  usedbyrefreservation  0      -

    ```


    This dataset has no reservation or refreservation set. Let’s set some.


    The usedbyrefreservation property shows how much space on this dataset would be
    freed if the refreservation was removed.


    ### Setting and Removing Reservations


    Set a reservation just like you would any other ZFS property. Here we set a refreservation
    on /var/log/db and a reservation on /var/log.


    ```

    # zfs set refreservation=10G zroot/var/log/db

    # zfs set reservation=20G zroot/var/log

    ```


    No matter what, this host will now have 10 GB reserved for database logs and 20
    GB for the log files, including the database directory. We used a refreservation
    for the database logs because we don’t want snapshots counted against that reservation.


    To remove a reservation, set it to *none*.


    ```

    # zfs set reservation=none zroot/var/log

    ```


    Other datasets can now use that space.


    ## Quotas


    A *quota* is a maximum amount of space that a dataset, user, or user group may
    use. All of these quotas are set on a per-dataset basis. We’ll start with dataset
    quotas, then investigate user and group quotas.


    ### Dataset Quotas


    Use a quota when you want to set a maximum amount of space that a dataset can
    consume. For example, you might decide that /tmp can only use up to 10 GB, or
    /home can only take up 200 GB, or any other limit that makes sense to you.


    Like reservations, ZFS uses two properties for quotas: quota and refquota. The
    quota property sets a maximum amount of space that a dataset and all its children
    can use. The refquota property establishes the maximum amount of space that the
    dataset can use, excluding its children. If you want a quota that excludes snapshots
    and child datasets, use the refquota property.'
