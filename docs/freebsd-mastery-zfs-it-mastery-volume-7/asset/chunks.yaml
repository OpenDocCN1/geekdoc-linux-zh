- fmt: '

    Generally, we recommend changing compression algorithms from `LZ4` only when a
    compelling need demands you do so and the additional CPU overhead and slower disk
    access don’t impact actual work.


    Not long ago, Lucas worked for a phone company. The company retained more than
    a decade of plain-text call detail records (CDRs) for every phone call that had
    ever been made through their equipment. These records were routinely accessed
    for running reports in the middle of the night. Occasionally, a fraud investigator
    needed to access those reports with tools like `grep(1)` and `awk(1)`. For this
    use case, enabling `gzip-9` compression made perfect sense. Measured with `du(1)`,
    ZFS compressed the files at roughly `8:1`. If we’d needed to routinely interact
    with these files, however, `LZ4` and an extra few hundred dollars in hard drives
    would have made more sense.


    ## Compression and Performance


    Take a look at these properties for the example data.


    ```

    # zfs get all db | grep reference

    db/text  referenced         48.7M   -

    db/text  logicalreferenced  220M    -

    ```


    This dataset uses 48.7 MB of disk space. When you ignore the compression, the
    dataset has 220 MB of data. A compressed dataset can store more “logical data”
    than its size.


    Here’s where the effectiveness of compression really comes into play. The slowest
    part of reading and writing data is getting it on the storage media. The physical
    media is the slowest part of a disk transaction. Writing 48.7 MB to disk takes
    about 22% as long as writing 220 MB. You can cut your storage times by 78% by
    enabling compression, at the cost of a little CPU time. If your disk can write
    100 MB/s, then writing that 48.7 MB of compressed data will take about half a
    second. If you look at it from the perspective of the application that wrote the
    data, you actually wrote 220 MB in half a second, effectively 440 MB/s. We bet
    you didn’t think your laptop disk could manage that!


    If you are storing many small files, compression is less effective. Files smaller
    than the sector size get a whole block allocated to them anyway. If you want really,
    really effective compression, use a disk with actual 512-byte physical sectors
    and tell ZFS to use that sector size.


    Compression isn’t perfect. Sequential and random access can change how well compression
    performs. Always test with your own data, in your environment. Compression works
    well enough that FreeBSD enables `lz4` compression in its default install.


    Most CPUs are mostly idle. Make the lazy critters crunch some data!


    ## Deactivating Compression


    To deactivate compression, set the dataset’s compression property to `off`.


    Much as activating compression only affects newly written files, deactivating
    compression only affects new data. Compressed files remain compressed until rewritten.
    ZFS is smart enough to know that a file is compressed and to automatically decompress
    it when accessed, but it still has the overhead.


    You cannot purge all traces of compression from a dataset except by rewriting
    all the files. You’re probably off recreating the dataset.


    ## Deduplication


    Files repeat the same data over and over again, arranged slightly differently.
    Multiple files contain even more repetition. More than half of the data on your
    system might be duplicates of data found elsewhere. ZFS can identify duplicate
    data in your files, extract and document it, thus storing each piece of data only
    once. It’s very similar to compression. Deduplication can reduce disk use in certain
    cases.


    Many deduplication systems exist. At one extreme, you could deduplicate all data
    on a byte-by-byte level. You could deduplicate this book by identifying and recording
    the position of each letter and punctuation mark, but the record would grow larger
    than the actual book. At the other extreme, you could deduplicate multiple copies
    of entire files by recording each only once.


    ZFS snapshots could be said to deduplicate filesystem data. For deduplicating
    files, ZFS deduplicates at the filesystem block level (shown by the `recordsize`
    property). This makes ZFS good at removing duplicates of identical files, but
    it realizes that files are duplicates only if their filesystem blocks line up
    exactly. Using smaller blocks improves how well deduplication works, but increases
    memory requirements. ZFS stores identical blocks only once and stores the deduplication
    table in memory.


    Enable deduplication on a dataset-by-dataset basis. Every time any file on a deduplicated
    dataset is accessed by either reading or writing, the system must consult the
    deduplication table. For efficient deduplication, the system must have enough
    memory to hold the entire deduplication table. ZFS stores the deduplication table
    on disk, but if the host must consult the on-disk copy every time it wants to
    access a file, performance will slow to a drag. (A host must read the dedup table
    from disk at boot, so you’ll get disk thrashing at every reboot anyway.)


    While deduplication sounds incredibly cool, you must know how well your data can
    deduplicate and how much memory deduplication requires before you even consider
    enabling it.


    ### Deduplication Memory Needs


    For a rough-and-dirty approximation, you can assume that 1 TB of deduplicated
    data uses about 5 GB of RAM. You can more closely approximate memory needs for
    your particular data by looking at your data pool and doing some math. We recommend
    always doing the math and computing how much RAM your data needs, then using the
    most pessimistic result. If the math gives you a number above 5 GB, use your math.
    If not, assume 5 GB per terabyte.


    If you short your system on RAM, performance will plummet like Wile E. Coyote.
    Don’t do that to yourself.


    Each filesystem block on a deduplicated dataset uses about 320 bytes.


    ```

    bp count:      139025

    ganged count:       0

    bp logical:18083569152  avg: 130074

    bp physical:   18070658560  avg: 129981 compression:   1.00

    bp allocated:  18076997120  avg: 130026 compression:   1.00

    bp deduped:         0     ref>1:  0   deduplication:   1.00

    SPA allocated: 18076997120 used:  1.81%

    ```


    The `bp count` shows the total number of ZFS blocks stored in the pool. This pool
    uses 139,025 blocks. While ZFS uses a maximum block size of 128 KB by default,
    small files use smaller blocks. If a pool has many small files, you’ll need more
    memory.


    In the third line from the bottom, the `used` entry shows that this pool is 1.81%
    (or 0.0181) used. Assume that the data in this pool will remain relatively consistent
    as it grows. Round up the number of used blocks to 140,000. Divide the used blocks
    by how full the block is, and we see that the full pool will have about (140,000
    / 0.0181 = ) 7,734,806 blocks. At 320 bytes per block, this data uses 2,475,138,121
    bytes of RAM, or roughly 2.3 GB.


    That’s less than half the rule of thumb. Assume that the ZFS deduplication table
    on this pool will need 5 GB of RAM per terabyte of storage.

    '
