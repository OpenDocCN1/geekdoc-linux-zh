    在使用快照（snapshots）和克隆（clones）的文件系统上，新释放的空间不会立即出现。许多 ZFS 操作是异步释放空间的，因为 ZFS 会更新所有引用该空间的数据块。池的
    `freeing` 属性显示 ZFS 仍需要从池中回收多少空间。如果你一次性释放大量空间，可以观察 `freeing` 属性的减少和空闲空间的增加。ZFS
    回收空间的速度取决于你的硬件、负载量、池的设计、碎片化程度以及空间的使用方式。


    异步释放空间很容易理解：你查看 `freeing` 属性并看它下降得有多快。但对于初学者来说，ZFS 的磁盘使用情况可能看起来诡异得多。假设你有一组数据集快照，而它们的父级数据集满了。（我们将在第
    7 章中介绍快照，但现在请先包涵。）你从数据集中删除了几个大型 ISO 文件。删除这些文件不会释放任何空间。为什么呢？


    这些 ISO 文件仍然存在于旧的快照中。ZFS 知道这些文件在当前数据集中不存在，但如果你去查看快照目录，就会看到这些文件。只要快照还引用这些数据，ZFS
    就必须为旧快照保留这些删除文件的副本。快照内容是只读的，因此删除这些大文件的方法就是删除快照。如果你有多个快照，磁盘使用就会变得更加复杂。基于快照的克隆（第
    7 章）行为也一样。


    准确理解特定数据集如何使用磁盘空间，需要花时间研究它的属性。


    ## 磁盘空间详情


    要确切查看你的磁盘空间去了哪里，请使用 `-o space` 修符向 `zfs list` 请求空间使用的详细信息。


    ```

    # zfs list -o space

    NAME               AVAIL   USED  USEDSNAP  USEDDS  USEDREFRESERV  USEDCHILD

    zroot               874G  17.5G         0    144K              0      17.5G

    zroot/ROOT          874G  1.35G         0    144K              0      1.35G

    zroot/ROOT/default  874G  1.35G         0   1.35G              0          0

    zroot/usr           874G  12.5G         0    454M              0      12.0G

    ...

    ```


    `AVAIL` 列显示了池中每个数据集可用的空间。ZFS 在池中的所有数据集之间共享可用空间。这取自 ZFS 的 `available` 属性。我们将在本章稍后部分介绍如何使用配额（quotas）和预留（reservations）来限制使用。


    `USED` 列显示了该数据集及其所有后级项占的空间。快照、ZVOL、克隆、普通文件以及任何其他使用空间的内容都计入此数量。当 ZFS 写入新文件、创建快照和子数据集或进行其他更改时，该值可能会延迟几秒变化。该值来自数据集的
    `used` 属性。


    `USEDBYSNAP` 列显示了专供快照使用的空间。当你第一次对数据集创建快照时，快照几乎不占用空间，因为它与原始数据集几乎完全相同。然而，随着数据集的变化，快照会增大。由于同一个数据集的多个快照可能引用相同的数据，很难判断删除单个快照是否会释放此空间的任何部分。不过，完全删除该数据集的所有快照无疑会释放这部分空间。该值来自数据集的
    `usedbysnapshots` 属性。第 7 章讨论了快照。


    `USEDDS` 列显示了数据集上文件使用的空间。它排除了快照、预留、子数据集或其他特殊的 ZFS 特性。它来自数据集的 `usedbydataset` 属性。第
    4 章介绍了数据集。


    在 `USEDBYREFRESERV` 下，你会看到该数据集刷新预留（refreservation）使用的空间，不包括其子项。该值来自数据集的 `usedbyrefreserv`
    属性。参见本章稍后的“预留与配额”。


    `USEDCHILD` 列显示该数据集的子项使用的空间，如 `usedbychildren` 属性所示。


    将上一节 `zfs list` 中 `zroot/usr` 的条目与详细空间描述进行比较。`zfs list` 的结果显示数据集使用了 12.5 GB 并引用了
    454 MB。通过将特定的空间列表分为不同的类别，可以清楚地看到该数据集使用了 454 MB，而子数据集占用了 12 GB。


    每次调查磁盘使用情况时，请使用 `zfs list -o space`。


