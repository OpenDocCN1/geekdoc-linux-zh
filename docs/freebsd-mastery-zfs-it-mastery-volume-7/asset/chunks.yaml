  trans: '

    许多 ZFS 特性（如复制和快照）是基于数据集（dataset）操作的。将你的数据划分为逻辑组可以让你更容易利用这些 ZFS 特性来支持你的组织。


    以一个拥有几十个网站的 Web 服务器为例，每个网站由不同的团队维护。有些团队负责多个网站，而有些团队只负责一个。有些人属于多个团队。如果你遵循传统的文件系统模型，可能会创建一个
    `/webserver` 数据集，将所有内容放在其中，并使用组权限和 `sudo(8)` 来控制访问。你已经这样生活了几十年，而且运行良好，那么为什么要改变呢？


    但如果为为每个团队创建一个数据集，并在该父数据集内部为每个站点分配它自己的数据集，可能性就会成倍增加。


    团队需要一个网站的副本进行测试？直接克隆（Clone）它。在传统文件系统中，你必须复制整个网站目录，这将使网站所需的磁盘空间翻倍，并花费多得多的时间。而克隆仅占用站点之间差异所需的空间，并且是瞬间完成的。


    团队准备部署网站的新版本，但想要一个旧网站的备份？创建一个快照（Snapshot）。这个新网站可能使用了与旧网站大量相同的文件，因此你能够减少磁盘空间占用。此外，当部署发生严重错误时，你可以通过回滚快照来恢复旧版本。


    某个特定的网站需要文件系统级的性能调优、压缩或某些本地创建的属性？为该站点设置即可。


    你可以为每个团队创建一个数据集，然后让团队为自己的站点创建自己的子数据集。你可以根据人员结构来组织数据集，而不是为了适应技术而组织你的人员。


    当你必须更改所有网站的文件系统设置（属性）时，请对父数据集进行更改，并让子数据集继承它。


    同样的优势也适用于用户主目录。


    你还可以在机器之间移动数据集。你的网站超过了 Web 服务器的容量？将半个数据集连同它们的自定义设置以及所有的克隆和快照发送到新服务器。


    使用许多文件系统数据集有一个缺点。当在一个文件系统内部移动文件时，文件会被重命名。在不同的文件系统之间移动文件需要将文件复制到新位置并从旧位置删除它，而不是仅仅重命名它。跨数据集的文件复制需要更多的时间并需要更多空闲空间。但与
    ZFS 通过多个数据集带给你的所有优势相比，这是微不足道的。这个问题也存在于其他文件系统中，但使用大多数其他文件系统的主机只有几个分区，这使得它看起来并不明显。


    ## 查看数据集


    `zfs list` 命令显示所有数据集以及它们的一些基本信息。


    ```

    # zfs list

    NAME                USED  AVAIL  REFER  MOUNTPOINT

    mypool              420M  17.9G    96K  none

    mypool/ROOT         418M  17.9G    96K  none

    mypool/ROOT/default 418M  17.9G   418M  /

    ...

    ```


    第一个字段显示数据集的名称。


    在 `USED` 和 `REFER` 下，你可以找到关于数据集使用多少磁盘空间的信息。ZFS 惊人的灵活性和效率的一个缺点是，如果你不理解它，它对磁盘空间使用情况的解释似乎有些超现实。第
    6 章将讨论磁盘空间以及使用它的策略。


    `AVAIL` 列显示池或数据集中还剩余多少可用空间。


    最后，`MOUNTPOINT` 显示数据集应该挂载的位置。这并不意味着该数据集已经挂载，仅仅意味着如果它被挂载，它将位于此处。（使用 `zfs mount`
    查看所有已挂载的 ZFS 文件系统。）


    如果你将一个数据集作为参数，`zfs list` 只显示该特定的数据集。


    ```

    # zfs list mypool/lamb

    NAME         USED  AVAIL  REFER  MOUNTPOINT

    mypool/lamb  192K  17.9G    96K  /lamb

    ```


    使用 `-t` 标志和类型限制显示的数据集类型。你可以显示文件系统、卷（volumes）或快照。在这里我们显示快照，仅快照。


    ```

    # zfs list -t snapshot

    NAME                    USED  AVAIL  REFER  MOUNTPOINT

    zroot/var/log/db@backup    0      -  10.0G  -

    ```


    既然你可以看到文件系统了，让我们创建一些吧。


    ## 创建、移动和销毁数据集


    使用 `zfs create` 命令创建任何数据集。我们将在第 7 章查看快照、克隆和书签（bookmarks），但现在先讨论文件系统和卷。


    ### 创建文件系统


    文件系统是大多数系统中最常见的数据集类型。每个人都需要一个地方来存储和组织文件。通过指定池和文件系统名称创建一个文件系统数据集。


    ```

    # zfs create mypool/lamb

    ```


    这在名为 `mypool` 的 ZFS 池上创建了一个名为 `lamb` 的新数据集。如果池有默认挂载点，则新数据集将默认挂载（参见本章后文“挂载 ZFS
    文件系统”）。


    ```

    # mount | grep lamb

    mypool/lamb on /lamb (zfs, local, noatime, nfsv4acls)

    ```


    括号中的挂载设置通常是 ZFS 属性，继承自父数据集。要创建一个子文件系统，请提供父文件系统的完整路径。


    ```

    # zfs create mypool/lamb/baby

    ```


    该数据集从父级那里继承了许多特性，包括它的挂载点，正如我们将在本章后文“父子关系”中看到的。


    ### 创建卷


    使用 `-V` 标志和大小告诉 `zfs create` 你想创建一个卷。提供卷的完整路径。


    ```

    # zfs create -V 4G mypool/avolume

    ```


    卷会像其他数据集一样出现在列表中。你可以通过添加 `-t` 选项让 `zfs list` 只显示卷。


    ```

    # zfs list -t volume

    NAME             USED  AVAIL  REFER  MOUNTPOINT

    mypool/avolume  4G  17.9G    64K

    ```


    卷会自动预留相当于卷大小加上 ZFS 元数据的空间。


    作为块设备，卷没有挂载点。它们会在 `/dev/zvol` 下获得一个设备节点，因此你可以像访问其他块设备一样访问它们。


    ```

    # ls -al /dev/zvol/mypool/avolume

    crw-r-----  1 root  operator  0x4d Mar 27 20:22 /dev/zvol/mypool/avolume

    ```


    你可以在设备节点上运行 `newfs(8)`，将磁盘镜像复制到那里，并通常像使用其他块设备一样使用它。


    可以使用 `zfs rename` 命令重命名数据集。将数据集的当前名称作为第一个参数，将新位置作为第二个参数。


    ```

    # zfs rename db/production db/old

    # zfs rename db/testing db/production

    ```


    使用 `-f` 标志强制重命名数据集。你无法卸载一个正在运行进程的文件系统，但 `-f` 标志会强制卸载。任何使用该数据集的进程都会失去其正在使用的内容，并根据自己的情况反应。


    ### 移动数据集


    你可以将数据集从 ZFS 树的一部分移动到另一部分，使其成为其父级的子级。这可能会导致许多许多属性发生变化，因为子级从父级继承属性。在数据集上单独设置任何属性都不会改变。


    在这里我们将数据库从 `zroot/var/db` 数据集移动出来，到一个新的父级，你在那里设置了一些属性来提高容错性。


    ```

    # zfs rename zroot/var/db/mysql zroot/important/mysql

    ```

