    Using multiple RAID-Z devices in a pool is much like using multiple mirror devices
    in a pool. Tolerance to disk failures is per-VDEV, not per pool. Your 12-disk
    array of two six-disk RAID-Z2 VDEVs can handle the loss of four disks, provided
    you lose only two disks per VDEV.


    ### Many Disks


    Common advice is to use no more than nine to 12 disks per VDEV. You can use more,
    but ZFS isn’t designed for that. Let’s look at an array of 36 disks to see some
    possible arrangements and their performance impact.


    Table 5: Six- to Twelve-Disk Virtual Device Configurations


    | Disks | Config | Read IOPS | Write IOPS | Read MB/s | Write MB/s | Usable Space
    | Fault Tolerance |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 36 | 18 x 2 disk Mirror | 9000 | 4500 | 3600 | 1800 | 18 TB (50%) | 18 (1/VDEV)
    |

    | 36 | 12 x 3 disk Mirror | 9000 | 3000 | 3600 | 1200 | 12 TB (33%) | 24 (2/VDEV)
    |

    | 36 | 1 x 36 disk RAID-Z2 | 250 | 250 | 3400 | 3400 | 34 TB (94%) | 2 |

    | 36 | 2 x 18 disk RAID-Z2 | 500 | 500 | 3200 | 3200 | 32 TB (89%) | 4 (2/VDEV)
    |

    | 36 | 4 x 9 disk RAID-Z2 | 1000 | 1000 | 2800 | 2800 | 28 TB (78%) | 8 (2/VDEV)
    |

    | 36 | 6 x 6 disk RAID-Z2 | 1500 | 1500 | 2400 | 2400 | 24 TB (66%) | 12 (2/VDEV)
    |


    By using more VDEVs, you can create screaming fast pools. A pool of 18 two-disk
    mirror VDEVs can read data more quickly than most anything else—and it can lose
    18 drives before failing! Yes, they have to be the right 18 drives, but if you
    have two disk shelves with different power supplies, that’s entirely possible.
    On the other hand, if the wrong two disks in that pool fail, your entire pool
    dies.


    Adding parity or mirrors to each VDEV increases reliability. A greater number
    of VDEVs increases performance. Your job is to juggle these two characteristics
    to support your environment.


    Each VDEV is limited to the random read/write performance of the slowest disk,
    so if you have too many disks in one VDEV, you are surrendering performance for
    only a small gain in space efficiency. While you can add L2ARC and SLOG devices
    to improve performance, it’s best to avoid these problems altogether.


    So if more VDEVs are always better, why is the 6 x 6 disk RAID-Z2 pool so much
    slower at reading and writing compared to the 1 x 36 disk RAID-Z2 pool? The answer
    lies in the fault tolerance column. When you have more RAID-Z2 VDEVs, you have
    more redundancy, and you can survive more failures. When a disk is providing fault
    tolerance, it is storing an extra copy of your data, so it can replace a copy
    that is lost when a disk fails. The system recalculates and stores parity data
    every time the data changes. Parity data isn’t used when reading files unless
    the original copy is missing. The disks used for parity no longer contribute to
    streaming performance. You can restore that performance by adding more disks.
    A 6 x 8 disk RAID-Z2 pool would have the equivalent of 36 data disks and 12 parity
    disks, and be able to outperform the 1 x 36 disk RAID-Z2 pool.


    Let’s take what you know about VDEVs, and create some actual pools with them.


