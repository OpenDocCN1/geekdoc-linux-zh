    “out of space” error even if the volume itself looks only partially full.


    Specify a sparse volume at creation time by specifying the -s option to the zfs
    create -V command. Changes to volsize are not reflected in the reservation. You
    can also reduce the reservation after the volume has been created.


    ### Zvol Mode


    FreeBSD normally exposes zvols to the operating system as geom(4) providers, giving
    them maximum flexibility. You can change this with the volmode property.


    Setting a volume’s volmode to *dev* exposes volumes only as a character device
    in /dev. Such volumes can be accessed only as raw disk device files. They cannot
    be partitioned or mounted, and they cannot participate in RAIDs or other GEOM
    features. They are faster. In some cases where you don’t trust the device using
    the volume, dev mode can be safer.'
