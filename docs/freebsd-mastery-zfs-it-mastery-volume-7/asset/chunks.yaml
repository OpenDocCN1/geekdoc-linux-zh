    \ doesn’t give you the flexibility you need for a safer replacement, though, check\
    \ your backups and proceed.\n\nStart by taking the failed provider offline. This\
    \ tells ZFS to stop trying to read or write to the device.\n\n```\n# zpool offline\
    \ gpt/zfs3\n```\n\nYou can now remove the failed drive from the array and install\
    \ its replacement. Partition the provider as needed. If you’re unsure of partitioning,\
    \ you can copy an existing disk’s partition table to another disk with something\
    \ like gpart backup da0 | gpart restore da9. Use the new provider label in zpool\
    \ replace. If the label on the new provider is identical to the label on the drive\
    \ you removed, you don’t have to repeat the provider name. Here we replace gpt/zfs3\
    \ with a new disk, also labeled gpt/zfs3.\n\n```\n# zpool replace db gpt/zfs3\n\
    ```\n\nIf you’re labeling your disks by serial number, as we recommend in Chapter\
    \ 0, you won’t have this issue.\n\n### Replacing Unavail Drives\n\nIf a drive\
