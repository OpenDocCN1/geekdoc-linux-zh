    受够了那个数据集？把它拖到谷仓后面，用 `zfs destroy` 彻底送它解脱吧。


    ```

    # zfs destroy db/old

    ```


    如果你添加了 `-r` 标志，它将递归删除该数据集的所有子项（数据集、快照等）。顺便删除任何克隆数据集，请使用 `-R`。在递归删除数据集时要非常小心，因为你经常会对某些内容究竟是哪个数据集的子项感到惊讶。


    你可以使用 `-v` 和 `-n` 标志来查看删除数据集时具体会发生什么。`-v` 标志会打印有关被删除内容的详尽信息，而 `-n` 则告诉 `zfs(8)`
    执行空运行（dry run）。两者结合使用，可以在你真正执行命令之前显示该命令实际上会删除哪些内容。


    ## ZFS 属性


    ZFS 数据集有许多称为 `properties`（属性）的设置，用于控制数据集的工作方式。虽然其中一些属性只能在创建数据集时设置，但大多数属性在数据集运行时都是可以调优的。ZFS
    还提供了许多只读属性，提供诸如数据集占用的空间大小、压缩或去重率以及数据集创建时间等信息。


    每个数据集都从其父数据集继承属性，除非在该数据集上显式设置了该属性。


    ### 查看属性


    `zfs(8)` 工具可以检索特定的属性，或某个数据集的所有属性。使用 `zfs get` 命令、指定的属性名称，以及（如果需要的话）数据集名称即可。


    ```

    # zfs get compression mypool/lamb

    NAME         PROPERTY     VALUE  SOURCE

    mypool/lamb  compression  lz4    inherited from mypool

    ```


    在 `NAME` 下，我们看到了你查询的数据集，`PROPERTY` 显示了你请求的属性。`VALUE` 是该属性设置的值。


    `SOURCE`（来源）稍微复杂一点。`default`（默认）来源意味着该属性被设置为 ZFS 的默认值。`local`（本地）意味着有人特意在该数据集上设置了该属性。`temporary`（临时）属性是在数据集挂载时设置的，当数据集卸载时，该属性会恢复到正常值。`inherited`（继承）属性来自父数据集，正如本章节后部分“父/子关系”中所讨论的那样。


    某些属性没有来源，因为来源要么无关紧要，要么显而易见。记录数据集创建日期和时间的 `creation` 属性没有来源，它的值来自系统时钟。


    如果你不指定数据集名称，`zfs get` 将显示所有数据集的该属性值。特殊属性关键字 `all` 可以检索一个数据集的所有属性。


    ```

    # zfs get all mypool/lamb

    NAME         PROPERTY   VALUE                 SOURCE

    mypool/lamb  type       filesystem            -

    mypool/lamb  creation   Fri Mar 27 20:05 2015 -

    mypool/lamb  used       192K                  -

    ...

    ```


    如果你使用 `all` 且不提供数据集名称，你将获得所有数据集的所有属性。这是大量信息。


    通过逗号隔开属性名称来显示多个属性。


    ```

    # zfs get quota,reservation zroot/home

    NAME        PROPERTY     VALUE   SOURCE

    zroot/home  quota        none    local

    zroot/home  reservation  none    default

    ```


    你还可以使用 `zfs list` 和 `-o` 修饰符查看属性。这最适用于你想从多个数据集中查看几个属性的情况。使用特殊属性名来显示数据集名称。


    ```

    # zfs list -o name,quota,reservation

    NAME                QUOTA  RESERV

    db                   none    none

    zroot                none    none

    zroot/ROOT           none    none

    zroot/ROOT/default   none    none

    ...

    zroot/var/log        100G     20G

    ...

    ```


    你也可以添加数据集名称，以便在该数据集上查看此格式的属性。


    ### 修改属性


    使用 `zfs set` 命令更改属性。提供属性名称、新设置和数据集名称。在这里我们将 `compression` 属性更改为 `off`。


    ```

    # zfs set compression=off mypool/lamb/baby

    ```


    使用 `zfs get` 确认你的更改。


    ```

    # zfs get compression mypool/lamb/baby

    NAME              PROPERTY     VALUE  SOURCE

    mypool/lamb/baby  compression  off    local

    ```


    大多数属性仅适用于在属性更改后写入的数据。`compression` 属性告诉 ZFS 在将数据写入磁盘之前进行压缩。我们将在第 6 章中讨论压缩。禁用压缩不会解压缩在更改之前写入的任何数据。同样，启用压缩也不会魔法地压缩已经在磁盘上的数据。为了获得启用压缩的完整收益，你必须重写每个文件。更好的做法创建一个新数据集，使用
    `zfs send` 复制数据，然后删除原始数据集。


    ### 只读属性


    ZFS 使用只读属性提供有关数据集的基本信息。磁盘空间占用以属性表示。你无法通过更改显示“你的磁盘已用一半”的属性来改变你使用的数据量。（第 6 章涵盖了
    ZFS 磁盘空间使用。）`creation` 属性记录了此数据集创建的时间。你可以通过向磁盘添加或删除数据来更改许多只读属性，但不能直接写入这些属性。


    ## 文件系统属性


    管理传统文件系统性能和行为的一个关键工具是挂载选项。你可以只读模式挂载传统文件系统，或使用 `noexec` 标志来禁用运行程序。ZFS 使用属性来实现相同的效果。


    ### atime


    文件的 `atime` 指明最后一次访问的时间。ZFS 的 `atime` 属性控制是否跟踪访问时间。默认值 `on` 会在每次访问时都更新 `atime`。使用
    `atime` 意味着每次读取时都会写入磁盘。


    关闭此属性可以避免读取文件时写入磁盘，并可能带来显著收益。这可能会干扰依赖于确定文件何时读取的邮件程序或其他类似工具。


    开启 `atime` 会增加快照大小。文件每次被访问时，atime 都会更新。快照保留原始访问时间，而活动文件系统包含更新后的时间。这是默认设置。


    ### exec


    `exec` 属性决定是否可以在该文件系统上运行二进制文件和命令。默认值为 `on`，允许执行。某些环境不允许用户从个人或临时目录执行程序。将 `exec`
    属性设置为 `off`。


    然而，该属性并不阻止运行解释型脚本。如果用户可以运行 `/bin/sh`，他们就可以运行 `/bin/sh /home/mydir/script.sh`。执行的是
    shell——它只接收脚本的指令。


    ### readonly


    如果你不想写入此数据集，将 `readonly` 属性设置为 `on`。默认值 `off` 允许在权限范围内修改数据集。


    ### setuid


    许多人认为 setuid 程序具有风险。虽然某些 setuid 程序必须设置 setuid，例如 `passwd(1)` 和 `login(1)`，但很少需要在
    `/home` 和 `/tmp` 等文件系统上设置 setuid。许多管理员在特定文件系统之外不允许 setuid 程序。


    ZFS 的 `setuid` 属性切换 setuid 支持。如果设置为 `on`，则文件系统支持 setuid。如果设置为 `off`，则会忽略 setuid
    标志。


    ## 用户定义属性


    ZFS 属性非常棒，你觉得用不完对吧？那么，开始添加你自己的属性吧。与数据集一起存储你自己的元数据的能力让你能够开发出全新的自动化领域。子项会自动继承这些属性，这让生活变得更加轻松。


