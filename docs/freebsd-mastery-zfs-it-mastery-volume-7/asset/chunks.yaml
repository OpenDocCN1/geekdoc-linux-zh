    \ previous device name off to the side. The zpool can still function, but you\
    \ really need to replace the drive.\n\n```\nNAME                    STATE   READ\
    \ WRITE CKSUM\ndb                      DEGRADED   0     0     0\n RAID-Z1-0  \
    \            DEGRADED   0     0     0\n  gpt/zfs1              ONLINE     0  \
