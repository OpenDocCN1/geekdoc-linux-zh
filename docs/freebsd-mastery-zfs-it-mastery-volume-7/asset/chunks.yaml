    # SATA 对比 SAS 与 SSD


    数据存储设备有多种类型。ZFS 可以 `SAS` 硬盘、`SATA` 硬盘、机械硬盘、`SSD` 设备或操作系统支持的任何存储介质。


    这并不是说这些硬盘是等价的。在相同负载下，`SAS` 硬盘的寿命通常比 `SATA` 硬盘长得多。闪存硬盘远快于任何类型的旋转磁盘。ZFS 可以在这些任何一种设备上存储数据。请根据你组织的需求来选择硬盘硬件，而不是根据
    ZFS。


    ZFS 可以将极速存储设备作为读写缓存来作特殊用途。如果你能为基于 `SAS` 或 `SATA` 的存储阵列添加几块固态硬盘，就可以极大加速 ZFS 的性能。


    # 磁盘冗余


    存储阵列同时丢失几块硬盘的情况并不罕见。浪涌可能会损坏多块磁盘。高强度的阵列重建会给剩余磁盘带来压力。热量可能会在机架的一侧积聚。正是因为这些原因，ZFS
    支持多种冗余场景。


    如果你购买了一大堆相同的磁盘，它们可能是同一天或同一批次制造的。制造工厂的一场小意外可能会让你付出惨代价。遗憾的是，磁盘零售商无法为你发货不同日期或不同批次制造的硬盘。你能做的做法是让每个阵列包含由多个制造商制造的硬盘。


    # 物理冗余


    FreeBSD 支持多路径存储，允许你绕过许多硬件问题。重新排列硬件可能会提高系统的可用性和可靠性。如果你有两个外部磁盘阵列，也许可以在镜像对中从每个阵列各取一个磁盘。这样，如果一个磁盘阵列的电源损坏，每个镜像仍然有一块活动磁盘。当故障阵列恢复时，镜像会自动恢复。由于这属于特种设备，我们将在
    *FreeBSD Mastery: Advanced ZFS* 中讨论多路径。


    在安装之前查看你的硬件。考虑它们可能会失效，以及合理安排你的设备如何防止停机。


    # 磁盘安装与标记


    不，不是使用标签机并在每块硬盘上贴一张小贴纸。那些东西上的胶水永远粘不牢（尽管你应该在物理上对磁盘进行标记）。FreeBSD 支持全局唯一标识符 (`GUID`)
    分区表 (`GPT`) 标签，让你可以在硬盘或分区上放置任意的逻辑标记。如果存储设备出现问题，FreeBSD 会通报问题并通过设备名称或设备节点识别故障单元。虽然知道磁盘
    `/dev/da239` 有问题很不错，但你必须将其追溯到物理设备。许多 ZFS 用户拥有带有许多硬盘的机器，这加剧了这个问题。


    FreeBSD 工具可以让你获取故障硬盘的序列号。然而，取决于你的硬件，你可能需要物理检查每块硬盘以识别其序列号。这通常涉及打开机箱或从磁盘阵列中抽拔出单块硬盘。这是既乏味又不愉快，而且在大多数情况下会中断服务。


    如果你在安装期间做好准备，你就可以直接定位故障磁盘——即使是位于远程设施的磁盘。Jude 在世界各地运行着许多高密度的存储阵列，并使用这种方案来防止硬盘维护工作让他忙于不堪。


    为你的存储阵列制定一套命名和编号方案。许多存储阵列有标准的命名方案，通常打印在设备上。如果你的设备已经有了编号的机架，请使用该编号。否则，制定一些简单的规则，例如“0
    号机架始终位于顶部，0 号磁盘始终位于左侧”。你可以使用前缀 `f` 表示前面，`b` 表示后面，或者任何适合你的方式。


    在将磁盘安装到阵列时，记录每块磁盘的序列号。在安装每个磁盘托时，根据物理位置和序列号对每个磁盘托进行物理标记。是的，这很乏味——但你最终会需要这些信息。你可以在安静的环境中按照自己的节奏完成这项工作，也可以在一次人为延长的且不必要的压力巨大的停机期间绝望地匆忙完成它。


    现在，要么安装 FreeBSD，要么从启动介质启动。使用 `camcontrol devlist` 获取所有存储设备的列表，然后在每个存储设备节点上运行 `diskinfo
    -v` 来获取其序列号。（你也可以从 `camcontrol(8)` 中提取序列号）。这将告诉你，例如，磁盘 `/dev/da0` 实际上是 4 号机架上的
    3 号磁盘。


    你现在有了一份设备节点及其关联序列号列表，以及一份物理位置和序列号列表。将它们相互匹配，然后使用 `GPT` 标签将位置和序列号附加到你正在使用的磁盘分区上。（有关
    `GPT` 标签的详情请参见 FreeBSD 文档或 *FreeBSD Mastery: Storage Essentials*。）`GPT` 标签的最大长度为
    15 个字符，因此你可能需要截断长序列号。在大多数序列号中最后数字是最唯一的，因此删掉前面的部分。


    组合起来，2 号机架上的 9 号磁盘，序列号为 `WD-WCAW36477223$，可能会获得类似 `/dev/gpt/s2d9-AW36477223` 的标签。


    你希望系统使用这些标签，*仅*使用这些标签。禁用系统上的 `GPTID` 和 `disk ident` 标签。这可以避免以后产生混淆。


    通过这种设置，现在发生硬件故障时，FreeBSD 可以告诉你 4 号机架上的第三块磁盘（序列号为 xxx）是坏的。有了这些信息，即使是你托管服务商最初级的技术人员也应该取出正确的磁盘。让技术人员在安装前给你替换硬盘的序列号，以便你创建适当的标签。


    提前计划会让停机变得不那么痛苦。我们强烈建议这样做。


    # 关于本书


    本书是面向任何管理 ZFS 文件系统或好奇现代文件系统样子的的人编写的。虽然它专注于 FreeBSD 上的 ZFS，但通用的 ZFS 信息适用于任何运行 OpenZFS
    的平台。我们本想写一本单一的 FreeBSD OpenZFS 书，但由于平台的限制，这变得不可行。*FreeBSD Mastery* 涵盖了 ZFS 的常规用法。下一本书
    *FreeBSD Mastery: Advanced ZFS* 涵盖了需要深入理解的话题。然而，后者假设你已经理解了本书的内容。


    OpenZFS 在不断进步。本书是一个静态实体。此外，如果你寻找我们没有讨论的功能，或者你有特殊情况，一定要检查手册页、在线 OpenZFS 文档以及 FreeBSD
    邮件列表存档和论坛。


    # 概述


    第 0 章是引言。


    第 1 章介绍 ZFS 提供了全局视角。你将学习如何查看 ZFS 文件系统和数据池，并理解 ZFS 的大组件是如何组合在一起的。


    第 2 章虚拟设备带你了解 ZFS 的冗余方案。ZFS 支持传统的镜像磁盘和连接设备，但也提供了自己的先进的基于校验的冗余方案 RAID-Z。


    第 3 章池讨论了 ZFS 存储池。你将学习如何将虚拟设备组组成池，如何检查池，以及如何管理和查询你的存储池。


    第 4 章数据集带你了解传统主义者称为的文件系统。但在 ZFS 中，它真的不是一个文件系统。是的，你将文件放在数据集中，但数据集远于此。


