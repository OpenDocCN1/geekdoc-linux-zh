    ### 修改 `zfs list` 输出


    一旦你习惯了 ZFS，由于 `zfs list` 默认显示快照。你可以通过 `-o` 选项控制 `zfs list` 显示哪些信息。在这里我们递归列出 mypool
    的所有快照，只显示它们的名称。


    ```

    # zfs list -r -t snapshot mypool -o name

    mypool@all

    mypool/ROOT@all

    mypool/sheep@snap2

    mypool/sheep@more

    ...

    ```


    你也可以显示任何属性列。在这里我们列出了每个数据集的一些属性。


    ```

    # zfs list -o name,atime,exec,setuid

    NAME        ATIME  EXEC  SETUID

    mypool         on    on      on

    mypool/sheep   on    on      on

    zroot         off    on      on

    zroot/ROOT    off    on      on

    ```


    是的，文件系统属性与快照无关。但它们是一个很好的例子。


    最后，你可以更改 `zfs list` 显示数据集的顺序。使用 `-s` 根据属性值排序。使用 `-S` 反向排序输出。列出多个属性时，用逗号分隔。


    ### 默认显示快照


    `zfs list` 命令默认隐藏快照和标记。如果你想默认查看这些数据集，请将池的 `listsnapshots` 属性设置为 `on`。


    ```

    # zpool set listsnapshots=on zroot

    ```


    一旦你运行一段时间，我们非常有信心你会将其关闭。积累的快照会淹没一切。


    ### 脚本与 ZFS


    系统管理员喜欢自动化。自动化中令人讨厌的一点是你必须运行命令并解析输出。让输出更符合人类习惯通常会使其不利于自动化。ZFS 开发者对这个问题非常熟悉，并包含了命令行选项来消除大部分问题。


    `-p` 选项告诉 `zfs(8)` 和 `zpool(8)` 打印精确值，而不是人类友好的值。池实际上并没有 2 TB 空闲空间——那只是一个进位到那个数字的。使用
    `-p` 会打印原始值。


    `-H` 选项告诉 `zfs(8)` 和 `zpool(8)` 不要打印表头，并使用制表符分隔列，而不是让它们对齐得漂亮（人类喜欢这样）。你是人类，对吧？


