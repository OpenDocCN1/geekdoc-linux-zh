    第 5 章“存储池修复与改造”涵盖了对存储池的更改。你可以通过额外的磁盘扩展存储池，修复故障磁盘，并调整存储池以支持新功能。


    第 6 章“磁盘空间管理”涵盖了使用 ZFS 时最受误解的部分之一。为什么你的 1 TB 硬盘声称有 87 TB 可用空间？你如何为某些用户预留空间并限制其他用户？去重功能是怎么回事？这一章涵盖了这一切以及更多内容。


    第 7 章“快照与克隆”讨论了 ZFS 的快照功能。你可以为数据集创建一个时间点照片，并在以后回溯它。你想要昨天存在的文件副本吗？快照是你的好朋友。同样，克隆允许你复制文件系统。你将理解这两者。


    第 8 章“安装到 ZFS”涵盖了将 FreeBSD 安装到 ZFS 之上。FreeBSD 安装程序可以为你安装基于 ZFS 的系统。安装程序一直在不断改进，但现实世界比任何安装程序可能预期的都要复杂得多。了解如何完全按照你的意愿安装系统是非常用的。


    系好安全带，准备好深入探索这个 21 世纪的文件系统。


    [1] 他可能会搞砸，因为那是初级技术员干的事。但给那个可怜的小哥机会吧。


    [2] 看着，曾经，电话公司印过巨大的书籍，列出了每个有电话的人及其号码。不，电话号码并没有那么频繁，因为它们都是固电话。但后来恐龙撞断了电话线，于是我们进入了蜂窝。


    # 第 1 章：介绍 ZFS


    开始学习 ZFS 并不困难。安装一个最新的 FreeBSD 版本。告诉安装程序你想使用 ZFS。你已经开始了。如果你从未接触过 ZFS，请花点时间在测试系统或虚拟机上安装一个带有
    ZFS 的新 FreeBSD。不要选择加密或任何花哨的自定义选项。这个简单易懂的安装提供了一个在深入研究更复杂的设置之前查看一些 ZFS 基础知识的机会。


    ZFS 结合了传统文件系统和卷管理器的功能。因此，它期望处理从单个文件的权限、哪些文件位于哪个目录中，到跟踪哪些存储设备被用于何种用途以及这些存储是如何安排的这一切。系统管理员指示
    ZFS 如何安排磁盘和文件，但 ZFS 管理它们下方的整个存储栈。本章将 ZFS 栈分为三层：文件系统、存储池和虚拟设备，使用一个安装了默认 ZFS 设置的
    FreeBSD 10.1 宿主机。


    为了让你建立思路，我们从存储栈中最可见的部分开始并向下移动。一旦你理解了这些层级是如何结合的，本书的其余部分将从基础开始向上构建。


    ## ZFS 数据集 (Datasets)


    ZFS 文件系统与传统文件系统并不完全对应，因此被称为 `datasets`。经典的 Unix 文件系统 (UFS) 及其衍生版本和类似物（如现代 BSD
    的 UFS2 和 Linux 的 extfs）通过各种程序管理文件系统。你可能已经习惯使用 `df(1)`、`newfs(8)`、`mount(8)`、`umount(8)`、`dump(8)`、`restore(8)`
    以及类似的命令。ZFS 在 `zfs(8)` 程序中吸收了所有这些功能，允许你创建、销毁、查看以及操作 ZFS 数据集。


    首先使用 `zfs list` 查看现有的 ZFS 数据集。


    ```

    # zfs list

    NAME                USED  AVAIL  REFER  MOUNTPOINT

    zroot               429M  13.0G    96K  none

    zroot/ROOT          428M  13.0G    96K  none

    zroot/ROOT/default  428M  13.0G   428M  /

    zroot/tmp           104K  13.0G   104K  /tmp

    zroot/usr           428K  13.0G    96K  /usr

    …

    ```


    这结合了 `mount(8)` 和 `df(1)` 的输出，对于任何管理过 UFS 或 extfs 的人来说应该看起来很熟悉。


    每个数据集都有一个名称。ZFS 数据集的名称以其所在的 ZFS 存储池或 `zpool` 开头。我们的第一个条目简单的 `zroot`。这个条目代表池的 `root
    dataset`（根数据集），其他所有内容都挂在其下方。


    接下来的两列显示已用空间可用。池 `zroot` 已使用 429 MB，剩余 13 GB。


    `REFER` 列是 ZFS 特有的。这是数据集上可访问的数据量，它并不一定等于已用空间的大小。某些 ZFS 功能（如快照）它们之间共享数据。我们的 `zroot`
    条目“使用”了 429 MB，但只引用了 96 KB 的数据。整个池有 13 GB 空闲，但通过此特定数据集只能 96 KB。这不多。剩余空间用于该数据集的子级。第
    6 章将详细讨论 ZFS 的磁盘使用情况。数据集的子级包括快照、卷和子数据集，正如你在本书书中看到的那样。


    最后是文件系统挂载点。`zroot` ZFS 未挂载。


    查看第二个条目，名为 `zroot/ROOT`。这是为根文件系统创建的 ZFS 数据集。像池一样，它没有挂载。它引用了 96 KB 的数据。


    第三个条目 `zroot/ROOT/default` 是当前的根文件系统。它挂载在 `/`。它使用了 428 MB。


    下一个数据集 `zroot/tmp` 几乎是空的。它挂载在 `/tmp`。这个数据集是临时目录。


    ## ZFS 分区与属性


    ZFS 缺乏传统的分区。分区是磁盘的逻辑划分，填充存储设备上特定的逻辑块地址 (`LBAs`)。分区对分区上的数据没有感知。更改分区意味着销毁并（推测）在其上方重建文件系统。


    Lucas 看到没有分区的文件系统时，第一个想法是他该如何管理存储。这大致相当于他在密歇根州漫长的寒冬后，第一次踏出户外感受到几个月来第一个暖空气时的困惑。困惑是解放的一部分。我们学习通过分区管理存储是因为我们不得不，而不是因为分区愉快或因为它是最佳解决方案。在没有分区的情况下运行传统文件是非糟糕的做法，但
    ZFS 不是传统文件系统。


    ZFS 紧密整合了文件系统和底层存储层。这意味着它可以根据需要动态划分文件文件之间的存储空间。虽然你可以为 ZFS 文件系统设置特定的限制，但数据集没有传统的尺寸。如果池有足够的空间，你就可以使用它。以前你为
    `/var/log` 等处分配有限的磁盘空间以防止疯狂日志填满硬盘，现在你必须在 ZFS 层设置这些限制。


    数据集可以使用的空间量是 ZFS 属性 (`property`) 的一个示例。ZFS 支持几十种数据集属性——例如，`quota` 属性控制数据集可以增长多大。使用
    `zfs(8)` 设置 ZFS 属性。


    ```

    # zfs set quota=2G zroot/var/log

    ```


    使用 `zfs get` 命令查看属性。


