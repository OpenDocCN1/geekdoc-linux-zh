    Send half the datasets, along with their custom settings and all their clones
    and snapshots, to the new server.


    There is one disadvantage to using many filesystem datasets. When you move a file
    within a filesystem, the file is renamed. Moving files between separate filesystems
    requires copying the file to a new location and deleting it from the old, rather
    than just renaming it. Inter-dataset file copies take more time and require more
    free space. But that’s trivial against all the benefits ZFS gives you with multiple
    datasets. This problem exists on other filesystems as well, but hosts using most
    other filesystems have only a few partitions, making it less obvious.


    ## Viewing Datasets


    The zfs list command shows all of the datasets, and some basic information about
    them.


    ```

    # zfs list

    NAME                USED  AVAIL  REFER  MOUNTPOINT

    mypool              420M  17.9G    96K  none

    mypool/ROOT         418M  17.9G    96K  none

    mypool/ROOT/default 418M  17.9G   418M  /

    ...

    ```


    The first field shows the dataset’s name.


    Under USED and REFER you find information about how much disk space the dataset
    uses. One downside to ZFS’ incredible flexibility and efficiency is that its interpretation
    of disk space usage seems somewhat surreal if you don’t understand it. Chapter
    6 discusses disk space and strategies to use it.


    The AVAIL column shows how much space remains free in the pool or dataset.


    Finally MOUNTPOINT shows where the dataset should be mounted. That doesn’t mean
    that the dataset is mounted, merely that if it were to be mounted, this is where
    it would go. (Use zfs mount to see all mounted ZFS filesystems.)


    If you give a dataset as an argument, zfs list shows only that specific dataset.


    ```

    # zfs list mypool/lamb

    NAME         USED  AVAIL  REFER  MOUNTPOINT

    mypool/lamb  192K  17.9G    96K  /lamb

    ```


    Restrict the type of dataset shown with the -t flag and the type. You can show
    filesystems, volumes, or snapshots. Here we display snapshots, and only snapshots.


    ```

    # zfs list -t snapshot

    NAME                    USED  AVAIL  REFER  MOUNTPOINT

    zroot/var/log/db@backup    0      -  10.0G  -

    ```


    Now that you can see filesystems, let’s make some.


    ## Creating, Moving, and Destroying Datasets


    Use the zfs create command to create any dataset. We’ll look at snapshots, clones,
    and bookmarks in Chapter 7, but let’s discuss filesystems and volumes now.


    ### Creating Filesystems


    Filesystems are the most common type of dataset on most systems. Everyone needs
    a place to store and organize files. Create a filesystem dataset by specifying
    the pool and the filesystem name.


    ```

    # zfs create mypool/lamb

    ```


    This creates a new dataset, lamb, on the ZFS pool called mypool. If the pool has
    a default mount point, the new dataset is mounted by default (see “Mounting ZFS
    Filesystems” later this chapter).


    ```

    # mount | grep lamb

    mypool/lamb on /lamb (zfs, local, noatime, nfsv4acls)

    ```


    The mount settings in parentheses are usually ZFS properties, inherited from the
    parent dataset. To create a child filesystem, give the full path to the parent
    filesystem.


    ```

    # zfs create mypool/lamb/baby

    ```


    The dataset inherits many of its characteristics, including its mount point, from
    the parent, as we’ll see in “Parent/Child Relationships” later in this chapter.


    ### Creating Volumes


    Use the -V flag and a volume size to tell zfs create that you want to create a
    volume. Give the full path to the volume dataset.


    ```

    # zfs create -V 4G mypool/avolume

    ```


    Zvols show up in a dataset list like any other dataset. You can tell zfs list
    to show only zvols by adding the -t volume option.


    ```

    # zfs list mypool/avolume

    NAME             USED  AVAIL  REFER  MOUNTPOINT

    mypool/avolume  4.13G  17.9G    64K  -

    ```


    Zvols automatically reserve an amount of space equal to the size of the volume
    plus the ZFS metadata. This 4 GB zvol uses 4.13 GB of space.


    As block devices, zvols do not have a mount point. They do get a device node under
    /dev/zvol, so you can access them as you would any other block device.


    ```

    # ls -al /dev/zvol/mypool/avolume

    crw-r-----  1 root  operator  0x4d Mar 27 20:22 /dev/zvol/mypool/avolume

    ```


    You can run newfs(8) on this device node, copy a disk image to it, and generally
    use it like any other block device.


    ### Renaming Datasets


    You can rename a dataset with, oddly enough, the zfs rename command. Give the
    dataset’s current name as the first argument and the new location as the second.


    ```

    # zfs rename db/production db/old

    # zfs rename db/testing db/production

    ```


    Use the -f flag to forcibly rename the dataset. You cannot unmount a filesystem
    with processes running in it, but the -f flag gleefully forces the unmount. Any
    process using the dataset loses access to whatever it was using, and reacts however
    it will.[1](#part0008.xhtml_ref_footnotebookmark_end_31_1)


    ### Moving Datasets


    You can move a dataset from part of the ZFS tree to another, making the dataset
    a child of its new parent. This may cause many of the dataset’s properties to
    change, since children inherit properties from their parent. Any properties set
    specifically on the dataset will not change.


    Here we move a database out from under the zroot/var/db dataset, to a new parent
    where you have set some properties to improve fault tolerance.


    ```

    # zfs rename zroot/var/db/mysql zroot/important/mysql

    ```


    Note that since mount points are inherited, this will likely change the dataset’s
    mount point. Adding the -u flag to the rename command will cause ZFS not to immediately
    change the mount point, giving you time to reset the property to the intended
    value. Remember that if the machine is restarted, or the dataset is manually remounted,
    it will use its new mount point.


    You can rename a snapshot, but you cannot move snapshots out of their parent dataset.
    Snapshots are covered in detail in Chapter 7.


    ### Destroying Datasets'
