    \ filesystems.\n\nUnlike UFS superblocks, dynamically generated index blocks can’t\
    \ be placed in known locations on the disk. How can ZFS cope with the possibility\
    \ of damage to an index block? ZFS stores multiple copies of critical index blocks\
    \ at algorithmically predictable locations. These *ditto blocks* get replicated\
    \ in multiple locations on the disk. Chapter 3 discusses ZFS blocks, uberblocks,\
    \ ditto blocks, transaction groups, and more.\n\nNow that you know the bare basics\
    \ of ZFS, the rest of this book merely fills in several hundred little details.\
    \ We’ll start at the very bottom of the stack, with the virtual devices.\n\n[1](#part0005.xhtml_ref_footnotebookmark_start_28_1)\
    \ ZFS does not eliminate the need for backups. The only thing that eliminates\
    \ backups is absolute indifference.\n\n# Chapter 2: Virtual Devices\n\nIn this\
    \ chapter we’ll delve into how the sausage is made. This... is a pig—I mean, a\
    \ disk. Disks are the physical manifestation of storage. Disks are evil. They\
    \ lie about their characteristics and layout, they hide errors, and they fail\
    \ in unexpected ways. ZFS means no longer having to fear that your disks are secretly\
    \ plotting against you. Yes, your disks *are* plotting against you, but ZFS exposes\
    \ their treachery and puts a stop to it.\n\nTo most effectively use the available\
    \ disks with ZFS, you require a basic understanding of how the operating system\
    \ presents disks to ZFS, and how ZFS arranges data on those disks.\n\n## Disks\
    \ and Other Storage Media\n\nZFS can also run on storage media other than disks.\
    \ Anything that is a FreeBSD GEOM storage provider can become a ZFS storage medium.\
    \ ZFS even has support for using files as the backing storage, which is really\
    \ great for testing but is not meant for production. ZFS can use any block device\
    \ for its physical storage, but each type has its advantages and disadvantages.\n\
    \n### Raw Disk Storage\n\nUsing an entire physical disk reduces complexity. Also,\
    \ there is no partitioning to worry about, and no software or configuration between\
    \ ZFS and the physical disk. However, the disadvantages usually outweigh these\
    \ advantages.\n\nBooting from a disk requires that the disk have a boot loader.\
    \ A boot loader can only go on a partitioned disk. You cannot boot a raw disk.\
    \ FreeBSD supports giving disks useful labels, but those labels live inside the\
    \ partition information."
