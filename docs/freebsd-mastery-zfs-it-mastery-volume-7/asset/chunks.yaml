    已 `enabled`（启用）的池特性可以使用，但尚未被实际使用。你的系统可能支持某种新的压缩类型，但尚未实际上使用新算法向池中写入任何数据。该池可以被导入到不支持该特性的系统中，因为磁盘格式尚未为了适应该特性而发生变化。新的主机不会看到任何让它产生恐慌的内容。


    `Disabled`（禁用）的池特性在操作系统中可用，但尚未被启用。池中没有任何地方表明这些特性可用——已禁用特性的存在意味着它们在操作系统中是可用的。该池在不支持该特性的主机上是可以使用的。


    如果功能处于 `active`（激活）状态，则磁盘格式已经发生变化，因为该功能正在被使用。最常见的情况下，该池无法导入到不支持该功能的系统中。如果功能处于激活状态，但所有使用该功能的数据集都已销毁，池会将该功能设置置回
    `enabled`。


    有少数功能是“只读兼容的”。如果该功能正处于激活状态，池可以被部分导入到不支持该功能的系统中。新主机可能看不到池上的某些数据集，并且它无法向池中写入任何数据，但它可能能够从数据集中提取出某些数据。


    创建池会启用该操作系统 ZFS 实现支持的所有特性。你可以使用 `zpool create` 命令配合 `-d` 标志在新池中禁用所有特性，然后更有选择性地启用特性。


    现在你已经理解了池的工作原理，让我们在上面放置一些实际数据吧。


    ZFS 遵循 Unix 的传统，不阻止你做愚蠢的事，因为那也会阻止你做聪明的事。


    因为 `everyone` 看到“9”就会认为是 29，不是吗？


    `Exciting`（兴奋）在系统管理中是一个坏词。


    # 第 4 章：ZFS 数据集


    在普通文件系统中，你创建分区来分离不同类型的数据，对它们应用不同的优化，并限制分区消耗空间量。每个分区从磁盘获得特定数量的空间。我们都经历过这种情况：我们尽力猜测系统中的每个分区在下个月、明年以及五年后需要多少磁盘空间。快回到未来，你决定给每个分区的空间极有可能是错误的。没有足够空间存储所有数据的分区会迫你添加磁盘或移动数据，从而增加系统管理的复杂度。当一个分区空间过多时，你会自责并将其作为你宁愿放在别处的东西的垃圾场。Lucas
    的多个 UFS2 系统将 `/usr/ports` 指向 `/home` 中的某处的软链接。Jude 通常会让 `/var` 的某部分位于 `/usr/local/var`。


    ZFS 通过 `pooling`（池化）空空间解决了这个问题，为你的分区提供了普通文件系统无法实现的灵活性。你创建的每个 ZFS 数据集仅消耗存储内部文件的空间。每个数据集都可以访问池中的所有可用空间，消除了你对分区大小的担忧。你可以通过
    `quota`（配额）限制数据集的大小，或通过 `reservation`（预留）保证其最小空间，如第 6 节所述。


    普通文件系统使用独立分区为不同类型的数据建立不同的策略和优化。`/var` 包含经常变化的文件，如日志和数据库。根文件系统需要一致性和安全性而非性能。而在
    `/home` 中，随你怎么如何。然而，一旦你为传统文件系统建立了策略，就很难更改。UFS 的 `tunefs(8)` 工具要求卸载文件系统后才能进行更改。某些特性（如
    `inodes` 的数量）在文件系统创建后是无法更改的。


    传统文件系统的核心问题可以归结为缺乏活性。ZFS 数据集几乎是无限灵活的。


    ## 数据集


    数据集是一个命名的数据块。这些数据可能类似于传统文件系统，拥有文件、目录、权限以及所有有趣的内容。它可能是一个原始块设备，或者是其他数据的副本，或者是任何你可以挤进磁盘的东西。


    ZFS 使用数据集的方式就像传统文件系统使用分区一样。为 `/usr` 需要一个策略，为 `/home` 需要另一个独立的策略？让每个都成为一个数据集。为
    iSCSI 目标需要一个块设备？那就是一个数据集。想要数据集的副本？那是另一个数据集。


    数据集具有层级关系。单个存储池是每个顶层数据集的父级。每个数据集都可以拥有子数据集。正如我们在本章中看到的，数据集会从其父级继承许多特性。


    你将使用 `zfs(8)` 命令执行所有数据集操作。该命令拥有各种子命令。


    ### 数据集类型


    ZFS 目前有五种数据集：文件系统、卷、快照、克隆和书签。


    `filesystem`（文件系统）数据集类似于传统文件系统。它存储文件和目录。ZFS 文件系统有一个挂载点，并支持传统文件系统特性，如只读、限制 `setuid`
    二进制文件等。文件系统数据集还持有其他信息，包括权限、文件创建和修改的时间戳、NFSv4 访问标记、`chflags(2)` 等。


    `ZFS volume`（ZFS 卷或 `zvol`是一个块设备。在普通文件系统中，你可能会为 iSCSI 创建一个基于文件的文件系统或特殊的 UFS 分区。在
    ZFS 上，这些块设备跳过了所有文件和目录的开销，直接驻留在池中。`Zvols` 获得设备节点，跳过了用于挂载磁盘镜像的 FreeBSD 内存。


    `snapshot`（快照）是数据集在特定时间点的只读副本。快照允许你保留文件系统及其文件的以前版本以备后用。快照消耗取决于当前文件系统与快照之间的差异。


    `clone`（克隆）是基于现有数据集快照的新数据集，允许你分叉文件系统。你获得了数据集内所有内容的副本。你可能会克隆包含生产网站的数据集，从而为你提供一个可以随意修改而不影响生产网站的副本。克隆仅消耗存储与其创建的原始快照差异的空间。第
    7 章将涵盖快照、克隆和书签。


    ### 为什么我想要数据集？


    你显然需要数据集。在磁盘上放置文件需要文件系统数据集。你可能也为每个传统的 Unix 分区都需要数据集，如 `/usr` 和 `/var`。但对于 ZFS，你想要很多数据集。很多、很多、*很多*数据集。对于分区数量有硬编码限制且缺乏活性的传统文件系统来说，这将是疯狂。但使用许多数据集增加了你对数据的控制能力。


    每个 ZFS 数据集有一系列控制其运行的属性，允许管理员控制数据集的性能以及保护数据的程度。你可以像调整传统文件系统一样对每个数据集进行优化。


    管理员可以将单个数据集的控制权授予另一个用户，允许用户在没有 root 权限的情况下进行管理。如果你的组织有很多项目团队，你可以给每个项目经理分配一块空间，并说：“这里，随你的意愿安排。”任何减少我们工作量的事情都是好事。


