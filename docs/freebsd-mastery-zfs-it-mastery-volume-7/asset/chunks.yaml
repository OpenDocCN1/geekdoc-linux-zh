- fmt: "\nA virtual device, or `VDEV`, is the logical storage unit of ZFS. Each `VDEV`\
    \ is composed of one or more `GEOM` providers. ZFS supports several different\
    \ types of `VDEV`, which are differentiated by the type of redundancy the `VDEV`\
    \ offers. The common mirrored disk, where each disk contains a copy of another\
    \ disk, is one type of `VDEV`. Plain disks, with no redundancy, are another type\
    \ of `VDEV`. And ZFS includes three different varieties of sophisticated RAID,\
    \ called `RAID-Z`.\n\nThese `VDEVs` are arranged into the storage pools discussed\
    \ in Chapter 3. Actual data goes on top of the pools, as Chapter 4 covers. But\
    \ the arrangement of your virtual devices dictates how well the pool performs\
    \ and how well it resists physical damage. Almost all of ZFS’ redundancy comes\
    \ from the virtual devices.\n\nA storage pool consists of one or more `VDEVs`\
    \ where the pool data is spread across those `VDEVs` with no redundancy. (You\
    \ can add some redundancy with the `copies` property, as discussed in Chapter\
    \ 4, but that provides no protection against total disk failure.) The ZFS pool\
    \ treats `VDEVs` as single units that provide storage space. Storage pools cannot\
    \ survive the loss of a `VDEV`, so it’s important that you either use `VDEVs`\
    \ with redundancy or decide in advance that it’s okay to lose the data in this\
    \ pool.\n\nUsing multiple `VDEVs` in a pool creates systems similar to advanced\
    \ RAID arrays. A `RAID-Z2` array resembles `RAID-6`, but a ZFS pool with two `RAID-Z2`\
    \ `VDEVs` resembles `RAID-60`. Mirrored `VDEVs` look like `RAID-1`, but groups\
    \ of them resemble `RAID-10`. In both of these cases, ZFS stripes the data across\
    \ each `VDEV` with no redundancy. The individual `VDEVs` provide the redundancy.\n\
    \n## VDEV Redundancy\n\nA `VDEV` that contains more than one disk can use a number\
    \ of different redundancy schemes to provide fault tolerance. Nothing can make\
    \ a single disk sitting all by itself redundant. ZFS supports using mirrored disks\
    \ and several parity-based arrays.\n\nZFS uses redundancy to self-heal. A `VDEV`\
    \ without redundancy doesn’t support self-healing. You can work around this at\
    \ the dataset layer (with the `copies` property), but a redundant `VDEV` supports\
    \ self-healing automatically.\n\n### Stripe (1 Provider)\n\nA `VDEV` composed\
    \ of a single disk is called a `stripe`, and has no redundancy. As you might expect,\
    \ losing the single provider means that all data on the disk is gone. A stripe\
    \ pool contains only single-disk `VDEVs`. \n\nA ZFS pool stripes data across all\
    \ the `VDEVs` in the pool and relies on the `VDEV` to provide redundancy. If one\
    \ stripe device fails, the entire pool fails. All data stored on the pool is gone.\
    \ This is fine for scratch partitions, but if you care about your data, use a\
    \ type of `VDEV` that offers fault tolerance.\n\n### Mirrors (2+ Providers)\n\n\
    A mirror `VDEV` stores a complete copy of all data on every disk. You can lose\
    \ all but one of the drives in the provider and still access your data. You can\
    \ use any number of disks in a mirror.\n\nMirrors provide very good random and\
    \ sequential read speeds because data can be read from all of the disks at once.\
    \ Write performance suffers because all data must be written to all of the disks,\
    \ and the operation is not complete until the slowest disk has finished.\n\n###\
    \ RAID-Z1 (3+ Providers)\n\nZFS includes three modern RAID-style redundant `VDEVs`,\
    \ called `RAID-Z`. `RAID-Z` resembles `RAID-5`, but includes checksumming to ensure\
    \ file integrity. Between checksums and ZFS’ copy-on-write features (Chapter 7),\
    \ `RAID-Z` insures that incomplete writes do not result in an inconsistent filesystem.\n\
    \n`RAID-Z` spreads data and parity information across all of the disks. If a provider\
    \ in the `RAID-Z` dies or starts giving corrupt data, `RAID-Z` uses the parity\
    \ information to recalculate the missing data. You might hear that `RAID-Z` uses\
    \ a provider to store parity information, but there’s no single parity provider—the\
    \ parity role is rotated through the providers, spreading the data.\n\nA `RAID-Z1`\
    \ `VDEV` can withstand the failure of any single storage provider. If a second\
    \ provider fails before the first failed drive is replaced, all data is lost.\
    \ Rebuilding a disk array from parity data can take a long time. If you’re using\
    \ large disks—say, over 2 TB—there’s a non-trivial chance of a second drive failing\
    \ as you repair the first drive. For larger disks, you should probably look at\
    \ `RAID-Z2`.\n\n### RAID-Z2 (4+ Providers)\n\n`RAID-Z2` resembles `RAID-Z1`, but\
    \ has two parity disks per `VDEV`. Like `RAID-6`, `RAID-Z2` allows it to continue\
    \ to operate even with two failed providers. It is slightly slower than `RAID-Z1`,\
    \ but allows you to be somewhat lazy in replacing your drives.\n\n### RAID-Z3\
    \ (5+ Providers)\n\nThe most paranoid form of `RAID-Z`, `RAID-Z3` uses three parity\
    \ disks per `VDEV`. Yes, you can have three failed disks in your five-disk array.\
    \ It is slightly slower than `RAID-Z2`. Failure of a fourth disk results in total\
    \ data loss.\n\n### RAID-Z Disk Configurations\n\nOne important thing to remember\
    \ when using any version of `RAID-Z` is that the number of providers in a `RAID-Z`\
    \ is completely fixed. You cannot add drives to a `RAID-Z` `VDEV` to expand them.\
    \ You can expand the pool by adding `VDEVs`, but you cannot expand a `VDEV` by\
    \ adding disks. There are no plans to add this feature.\n\nSuppose you have a\
    \ host that can accept 20 hard drives. You install 12 drives and use them as a\
    \ single `RAID-Z2`, thinking that you will add more drives to your pool later\
    \ as you need them. Those new drives will have to go in as separate `RAID-Z2`\
    \ `VDEV`.\n\nWhat’s more, your `VDEVs` will be unbalanced. Your pool will have\
    \ a single 12-drive `VDEV`, and a second 8-drive `VDEV`. One will be slower than\
    \ the other. ZFS will let you force it to pool these devices together, but it’s\
    \ a really bad idea to do so.\n\nPlan ahead. Look at your physical gear, the number\
    \ of drives you have to start with, and how you’ll expand that storage. Our example\
    \ server would be fine with on pool containing a single `RAID-Z2` `VDEV`, and\
    \ a completely separate pool containing the other eight disks in whatever arrangement\
    \ you want. Don’t cut your own throat before you even start!\n\n### The RAID-Z\
    \ Rule of 2s\n\nOne commonly discussed configuration is to have a number of data\
    \ disks equal to a multiple of two, plus the parity disks needed for a given `RAID-Z`\
    \ level. That is, this rule says that a `RAID-Z1` should use `2n+1` disks, or\
    \ three, five, seven, nine, and so on. A `RAID-Z2` should use `2n+2` disks (four,\
    \ six, eight, and so on), while `RAID-Z3` should use `2n+3` (five, seven, nine,\
    \ and so on).\n\nThis rule works—if and only if your data is composed of small\
    \ blocks with a size that is a power of 2. Other factors make a much bigger difference,\
    \ though. Compression is generally far more effective. Compressing your data reduces\
    \ the size of the blocks, eliminating this benefit.\n\n### Repairing VDEVs\n\n\
    When a provider that belongs to a redundant `VDEV` fails, the `VDEV` it is a member\
    \ of becomes “degraded.” A degraded `VDEV` still has all of its data, but performance\
    \ might be reduced. Chapter 5 covers replacing failed providers.\n\nAfter the\
    \ provider is replaced, the system must store data on the new provider. Mirrors\
    \ make this easy: read the data from the remaining disk(s) and write it to the\
    \ replacement. For `RAID-Z`, the data must be recalculated from parity.\n\n##\
    \ RAID-Z versus traditional RAID\n"
  raw: 'A virtual device, or VDEV, is the logical storage unit of ZFS. Each VDEV is
    composed of one or more GEOM providers. ZFS supports several different types of
    VDEV, which are differentiated by the type of redundancy the VDEV offers. The
    common mirrored disk, where each disk contains a copy of another disk, is one
    type of VDEV. Plain disks, with no redundancy, are another type of VDEV. And ZFS
    includes three different varieties of sophisticated RAID, called RAID-Z.


    These VDEVs are arranged into the storage pools discussed in Chapter 3\. Actual
    data goes on top of the pools, as Chapter 4 covers. But the arrangement of your
    virtual devices dictates how well the pool performs and how well it resists physical
    damage. Almost all of ZFS’ redundancy comes from the virtual devices.


    A storage pool consists of one or more VDEVs where the pool data is spread across
    those VDEVs with no redundancy. (You can add some redundancy with the copies property,
    as discussed in Chapter 4, but that provides no protection against total disk
    failure.) The ZFS pool treats VDEVs as single units that provide storage space.
    Storage pools cannot survive the loss of a VDEV, so it’s important that you either
    use VDEVs with redundancy or decide in advance that it’s okay to lose the data
    in this pool.


    Using multiple VDEVs in a pool creates systems similar to advanced RAID arrays.
    A RAID-Z2 array resembles RAID-6, but a ZFS pool with two RAID-Z2 VDEVs resembles
    RAID-60\. Mirrored VDEVs look like RAID-1, but groups of them resemble RAID-10\.
    In both of these cases, ZFS stripes the data across each VDEV with no redundancy.
    The individual VDEVs provide the redundancy.


    ## VDEV Redundancy


    A VDEV that contains more than one disk can use a number of different redundancy
    schemes to provide fault tolerance. Nothing can make a single disk sitting all
    by itself redundant. ZFS supports using mirrored disks and several parity-based
    arrays.


    ZFS uses redundancy to self-heal. A VDEV without redundancy doesn’t support self-healing.
    You can work around this at the dataset layer (with the copies property), but
    a redundant VDEV supports self-healing automatically.


    ### Stripe (1 Provider)


    A VDEV composed of a single disk is called a *stripe*, and has no redundancy.
    As you might expect, losing the single provider means that all data on the disk
    is gone. A stripe pool contains only single-disk VDEVs.


    A ZFS pool stripes data across all the VDEVs in the pool and relies on the VDEV
    to provide redundancy. If one stripe device fails, the entire pool fails. All
    data stored on the pool is gone. This is fine for scratch partitions, but if you
    care about your data, use a type of VDEV that offers fault tolerance.


    ### Mirrors (2+ Providers)


    A mirror VDEV stores a complete copy of all data on every disk. You can lose all
    but one of the drives in the provider and still access your data. You can use
    any number of disks in a mirror.


    Mirrors provide very good random and sequential read speeds because data can be
    read from all of the disks at once. Write performance suffers because all data
    must be written to all of the disks, and the operation is not complete until the
    slowest disk has finished.


    ### RAID-Z1 (3+ Providers)


    ZFS includes three modern RAID-style redundant VDEVs, called RAID-Z. RAID-Z resembles
    RAID-5, but includes checksumming to ensure file integrity. Between checksums
    and ZFS’ copy-on-write features (Chapter 7), RAID-Z insures that incomplete writes
    do not result in an inconsistent filesystem.


    RAID-Z spreads data and parity information across all of the disks. If a provider
    in the RAID-Z dies or starts giving corrupt data, RAID-Z uses the parity information
    to recalculate the missing data. You might hear that RAID-Z uses a provider to
    store parity information, but there’s no single parity provider—the parity role
    is rotated through the providers, spreading the data.


    A RAID-Z1 VDEV can withstand the failure of any single storage provider. If a
    second provider fails before the first failed drive is replaced, all data is lost.
    Rebuilding a disk array from parity data can take a long time. If you’re using
    large disks—say, over 2 TB—there’s a non-trivial chance of a second drive failing
    as you repair the first drive. For larger disks, you should probably look at RAID-Z2.


    ### RAID-Z2 (4+ Providers)


    RAID-Z2 resembles RAID-Z1, but has two parity disks per VDEV. Like RAID-6, RAID-Z2
    allows it to continue to operate even with two failed providers. It is slightly
    slower than RAID-Z1, but allows you to be somewhat lazy in replacing your drives.


    ### RAID-Z3 (5+ Providers)


    The most paranoid form of RAID-Z, RAID-Z3 uses three parity disks per VDEV. Yes,
    you can have three failed disks in your five-disk array. It is slightly slower
    than RAID-Z2\. Failure of a fourth disk results in total data loss.


    ### RAID-Z Disk Configurations


    One important thing to remember when using any version of RAID-Z is that the number
    of providers in a RAID-Z is completely fixed. You cannot add drives to a RAID-Z
    VDEV to expand them. You can expand the pool by adding VDEVs, but you cannot expand
    a VDEV by adding disks. There are no plans to add this feature.


    Suppose you have a host that can accept 20 hard drives. You install 12 drives
    and use them as a single RAID-Z2, thinking that you will add more drives to your
    pool later as you need them. Those new drives will have to go in as separate RAID-Z2
    VDEV.


    What’s more, your VDEVs will be unbalanced. Your pool will have a single 12-drive
    VDEV, and a second 8-drive VDEV. One will be slower than the other. ZFS will let
    you force it to pool these devices together, but it’s a really bad idea to do
    so.


    Plan ahead. Look at your physical gear, the number of drives you have to start
    with, and how you’ll expand that storage. Our example server would be fine with
    on pool containing a single RAID-Z2 VDEV, and a completely separate pool containing
    the other eight disks in whatever arrangement you want. Don’t cut your own throat
    before you even start!


    ### The RAID-Z Rule of 2s


    One commonly discussed configuration is to have a number of data disks equal to
    a multiple of two, plus the parity disks needed for a given RAID-Z level. That
    is, this rule says that a RAID-Z1 should use 2n+1 disks, or three, five, seven,
    nine, and so on. A RAID-Z2 should use 2n+2 disks (four, six, eight, and so on),
    while a RAID-Z3 should use 2n+3 (five, seven, nine, and so on).


    This rule works—*if and only if* your data is composed of small blocks with a
    size that is a power of 2\. Other factors make a much bigger difference, though.
    Compression is generally considered far more effective. Compressing your data
    reduces the size of the blocks, eliminating this benefit.


    ### Repairing VDEVs


    When a provider that belongs to a redundant VDEV fails, the VDEV it is a member
    of becomes “degraded.” A degraded VDEV still has all of its data, but performance
    might be reduced. Chapter 5 covers replacing failed providers.


    After the provider is replaced, the system must store data on the new provider.
    Mirrors make this easy: read the data from the remaining disk(s) and write it
    to the replacement. For RAID-Z, the data must be recalculated from parity.


    The way that ZFS combines RAID and the filesystem means that ZFS knows which blocks
    contain data, and which blocks are free. Instead of having to write out every
    byte on to the new drive, ZFS needs to write only the blocks that are actually
    in use. A traditional RAID controller has no understanding or awareness of the
    filesystem layer, so it has no idea what is in use and what is free space. When
    a RAID controller replaces a disk, it must copy every byte of the new disk. This
    means a damaged ZFS RAID-Z heals much more quickly, reducing the chance of a concurrent
    failure that could cause data loss. We discuss ZFS recovery in Chapter 5.


    ## RAID-Z versus traditional RAID'
