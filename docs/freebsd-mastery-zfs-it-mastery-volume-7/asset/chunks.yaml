    On a filesystem using snapshots and clones, newly freed space doesn’t appear immediately.
    Many ZFS operations free space asynchronously, as ZFS updates all the blocks that
    refer to that space. The pool’s `freeing` property shows how much space ZFS still
    needs to reclaim from the pool. If you free up a whole bunch of space at once,
    you can watch the `freeing` property decrease and the free space increase. How
    quickly ZFS reclaims space depends on your hardware, the amount of load, pool
    design, fragmentation level, and how the space was used.


    Asynchronously freeing space is easily understood: you look at the `freeing` property
    and see how quickly it goes down. But to the uninitiated, ZFS disk use can seem
    much weirder. Suppose you have a bunch of dataset snapshots, and their parent
    dataset gets full. (We cover snapshots in Chapter 7, but bear with us now.) You
    delete a couple of large ISOs from the dataset. Deleting those files won’t free
    up any space. Why not?


    Those ISO files still exist in the older snapshots. ZFS knows that the files don’t
    exist on the current dataset, but if you go look in the snapshot directories you’ll
    see those files. ZFS must keep copies of those deleted files for the older snapshots
    as long as the snapshots refer to that data. Snapshots contents are read-only,
    so the only way to remove those large files is to remove the snapshots. If you
    have multiple snapshots, disk usage gets more complex. And clones (Chapter 7),
    built on snapshots, behave the same way.


    Understanding precisely how a particular dataset uses disk space requires spending
    some time with its properties.


    ## Disk Space Detail


    To see exactly where your disk space went, ask `zfs list` for more detail on space
    usage with the `-o space` modifier.


    ```

    # zfs list -o space

    NAME               AVAIL   USED  USEDSNAP  USEDDS  USEDREFRESERV  USEDCHILD

    zroot               874G  17.5G         0    144K              0      17.5G

    zroot/ROOT          874G  1.35G         0    144K              0      1.35G

    zroot/ROOT/default  874G  1.35G         0   1.35G              0          0

    zroot/usr           874G  12.5G         0    454M              0      12.0G

    ...

    ```


    The `AVAIL` column shows the amount of space available to each of the datasets
    on this pool. ZFS shares the available space amongst all of the datasets in the
    pool. This is taken from the ZFS `available` property. We show how to limit usage
    with quotas and reservations later in this chapter.


    The `USED` column shows the amount of space taken up by this dataset and everything
    descended from it. Snapshots, ZVOLs, clones, regular files, and anything else
    that uses space counts against this amount. This value might lag behind changes
    for a few seconds as ZFS writes new files, creates snapshots and child datasets,
    or makes other changes. The value comes from the dataset’s `used` property.


    The `USEDBYSNAP` column shows the amount of space used exclusively by snapshots.
    When you first snapshot a dataset, the snapshot takes almost no space, because
    it’s nearly identical to the original dataset. As the dataset changes, however,
    the snapshots grow. As multiple snapshots of the same dataset probably refer to
    the same data, it’s difficult to say if deleting a single snapshot will free up
    any part of this space. Completely removing all of this dataset’s snapshots will
    certainly free up this amount of space, however. This value comes from the dataset’s
    `usedbysnapshots` property. Chapter 7 discusses snapshots.


    The `USEDDS` column shows the amount of space used by files on this dataset. It
    excludes snapshots, reservations, child datasets, or other special ZFS features.
    It comes from the dataset’s `usedbydataset` property. Chapter 4 covers datasets.


    Under `USEDBYREFRESERV` you’ll see the space used by a refreservation for this
    dataset, excluding its children. This value comes from the dataset’s `usedbyrefreserv`
    property. See “Reservations and Quotas” later in this chapter.


    The `USEDCHILD` column shows how much space this dataset’s children use, as shown
    by the `usedbychildren` property.


    Compare the entry for `zroot/usr` in `zfs list` from the previous section to the
    detailed space description. The `zfs list` result says that the dataset uses 12.5
    GB and refers to 454 MB. By breaking the space-specific list into different categories,
    it’s very clear that this dataset uses 454 MB, and the child datasets take up
    12 GB.


    Use `zfs list -o space` whenever you investigate disk usage.


    ## Pool Space Usage


    Sometimes you don’t care about the space usage of individual datasets. Only the
    space available to the pool as a whole matters. If you look at a pool’s properties,
    you’ll see properties that look an awful lot like the amount of space used and
    free. They are, but a pool’s space properties include space required for parity
    information. They don’t reflect the amount of data you can fit on the pool.


    If you have a mirror or a striped pool, the pool space information is fairly close
    to reality. If you’re using RAID-Z1, you’ll lose one provider of space to parity
    per virtual device in the pool. RAID-Z2 costs two disks per VDEV, and RAID-Z3
    costs three disks per VDEV. While you could, in theory, use these properties,
    the pool’s current usage, and a bit of math to get a good guess as to how much
    space you’re using, there’s an easier way: ask `zfs(8)` about the pool.


    ```

    # zfs list -o space

    NAME               AVAIL   USED  USEDSNAP  USEDDS  USEDREFRESERV  USEDCHILD

    zroot               874G  17.5G         0    144K              0      17.5G

    zroot/ROOT          874G  1.35G         0    144K              0      1.35G

    zroot/ROOT/default  874G  1.35G         0   1.35G              0          0

    zroot/usr           874G  12.5G         0    454M              0      12.0G

    ...

    ```


    The `AVAIL` column shows the amount of space available to each of the datasets
    on this pool. ZFS shares the available space amongst all of the datasets in the
    pool. This is taken from the ZFS property `available`. We show how to limit usage
    with quotas and reservations later in this chapter.


    The `USED` column shows the amount of space taken up by this dataset and everything
    descended from it. Snapshots, ZVOLs, clones, regular files, and anything else
    that uses space counts against this amount. This value might lag behind changes
    for a few seconds as ZFS writes new files, creates snapshots and child datasets,
    or makes other changes. The value comes from the dataset’s `used` property.


    The `USEDBYSNAP` column shows the amount of space used exclusively by snapshots.
    When you first snapshot a dataset, the snapshot takes almost no space, because
    it’s nearly identical to the original dataset. As the dataset changes, however,
    the snapshots grow. As multiple snapshots of the same dataset probably refer to
    the same data, it’s difficult to say if deleting a single snapshot will free up
    any part of this space. Completely removing all of this dataset’s snapshots will
    certainly free up this amount of space, however. This value comes from the dataset’s
    `usedbysnapshots` property. Chapter 7 discusses snapshots.


    The `USEDDS` column shows the amount of space used by files on this dataset. It
    excludes snapshots, reservations, child datasets, or other special ZFS features.
    It comes from the dataset’s `usedbydataset` property. Chapter 4 covers datasets.


    Under `USEDBYREFRESERV` you’ll see the space used by a refreservation for this
    dataset, excluding its children. This value comes from the dataset’s `usedbyrefreserv`
    property. See “Reservations and Quotas” later in this chapter.


    The `USEDCHILD` column shows how much space this dataset’s children use, as shown
    by the `usedbychildren` property.


    Compare the entry for `zroot/usr` in `zfs list` from the previous section to the
    detailed space description. The `zfs list` result says that the dataset uses 12.5
    GB and refers to 454 MB. By breaking the space-specific list into different categories,
    it’s very clear that this dataset uses 454 MB, and the child datasets take up
    12 GB.


