    糟糕的是，任何替换磁盘的大小必须与原始磁盘完全相同，或者更大。并不是所有 `6 TB` 磁盘的大小都是相同的——来自不同厂商的磁盘之间存在几兆字节的差异。在设置系统时，你并不在意这些差异，但在更换磁盘时，它们至关重要。大多数目录并没有列出每个磁盘的扇区数量，只列出大小，因此找到可用的替换品可能需要尝试多次。将使用传统
    `512-byte` 扇区的驱动器替换为使用 `4096-byte`（`4K`，称为高级格式）扇区的驱动器会让情况变得更加复杂。原始驱动器的扇区数量可能不能被
    `8` 整除。得益于驱动器使用的特殊算法，即使新磁盘比旧磁盘大几个字节，看起来也可能只比旧磁盘小几个字节。


    ### 分区存储 (Partition Storage)


    你可以不使用整个裸磁盘，而是对磁盘进行分区，然后将其中一个分区用于 `ZFS`。这样做最大的优势是，你现在可以通过创建一个小的启动分区，从包含 `ZFS`
    分区的磁盘启动，而不需要单独的启动设备。使用分区还允许你将部分磁盘空间用于其他用途，例如原始交换分区、另一个文件系统，或者只是在磁盘末尾留一些余地，这样替换磁盘就不需要匹配的扇区计数。分区还允许你通过“短行程”（short
    stroke）驱动器来提高性能。


    许多原始的 `Solaris ZFS` 管理指南出于性能考虑，建议不要使用分区（在 Solaris 术语中为 `slices`）。在 `Solaris` 中，对分区使用文件系统会禁用写入缓存。在
    `FreeBSD` 中，禁用写入缓存与磁盘分区或文件系统是完全独立的。`FreeBSD` 在分区上使用 `ZFS` 时拥有全性能。


    `FreeBSD` 支持多种分区方案，但强烈建议使用 `GPT`。旧的分区系统 `MBR` 将主分区数量限制为四个，而 `GPT` 支持多达 `128` 个分区。`MBR`
    只能管理高达 `2 TB` 的磁盘，而 `GPT` 在使用 `512 byte-sector` 磁盘时可以管理高达 `8 ZB`，在使用 `4 K-sector`
    磁盘时可以管理高达 `64 ZB`。*FreeBSD Mastery: Storage Essentials* 介绍了 `FreeBSD` 对两种分区方法的支持。1


    使用分区的缺点是你可能会失去 `ZFS` 提供的一些可移植性。如果你将磁盘从一个系统移动到另一个系统，目标系统必须能够识别磁盘分区。


    ### GEOM 设备存储 (GEOM Device Storage)


    `ZFS` 还可以使用各种 `FreeBSD GEOM` 类作为其后端存储。这些类位于文件系统和物理设备之间，执行各种功能。`GEOM` 类提供了诸如全盘加密（`GELI`、`GBDE`）、高可用性、标签、多路径和可插式调度器等功能。可以基于整个设备创建一个
    `GEOM` 类，也可以在另一个 `GEOM` 类（如分区、多路径设备或加密磁盘）之上创建。


    `GELI`（`FreeBSD` 磁盘加密子系统）是实现加密 `ZFS` 池的最佳方法。`GELI` 在块在 `ZFS` 和物理磁盘之间传输时进行加密和解密，因此它不需要
    `ZFS` 执行任何特殊操作。`GELI` 支持许多不同的加密算法，但默认的 `AES-XTS` 最佳性能，特别是对于支持 `AES New Instructions`（`AES‑NI`）的现代
    CPU。在硬件卸载功能的帮助下，`GELI` 可以以超过 `1 GB/sec` 的速度加密数据，解密速度更快，这意味着即使在 `SSD` 上添加加密也不会降低你的性能。`GELI`
    还可以可选地提供数据认证（完整性验证），它会在每个扇区存储一个哈希消息认证码（`HMAC`）。它使用此 `HMAC` 来验证数据的完整性（数据未被篡改）和真实性（此数据确实是由你写入的）。如果在回读扇区时
    `HMAC` 无法验证数据，则会返回错误。`HMAC` 功能默认未启用，对于 `ZFS` 来说可能大材小用，因为 `ZFS` 对每个数据块都提供了自己的校验和。


    高可用存储技术 (`HAST`）是 `FreeBSD` 的分布式存储解决方案。它允许你通过网络在计算机之间镜像块设备。将 `HAST` 作为 `ZFS` 池的后端存储，允许你将每个后端磁盘镜像到第二台机器。`HAST`
    的优势在于它是实时的；一个块在写入 `HAST` 集群中的所有主机之前，才被认为已写入。另一方面，`ZFS` 复制基于同步定期快照。然而，使用 `HAST`
    时，第二台机器不能与第一台同时导入或挂载池。与 `ZFS` 复制相比（你可以让镜像池同时处于激活状态，但只读），`HAST` 只在少数情况下有意义。


    `GEOM` 标签提供了一种给磁盘或分区附加有意义注释的方便方法。有很多标签类型，包括标准如 `disk ident`、`gptid`、`GPT labels`
    以及 `GEOM` 特有的 `gabel`。驱动器标记的最佳实践出现在第 0 章。


    `GEOM` 还支持用于高可用性的多路径。有时坏的不仅是磁盘，还有控制器卡、背板或电缆。通过多路径，“双端口”的企业级磁盘可以连接到多个 `HBA`（不带任何
    RAID 功能的磁盘控制器卡）。如果每个驱动器都有通往两个不同存储控制器的路径，它就能在丢失其中一个时幸存。然而，当每个磁盘都连接到两个不同的控制器时，操作系统会看到两次磁盘，每个控制器看到一次。`GEOM`
    多路径类允许你向每个磁盘写入标签，这样通往同一磁盘的连续路径就会识别为此类。这样你就得到了每个磁盘的一个表示，并由多条路径支持。我们在 *FreeBSD Mastery:
    Advanced ZFS* 中讨论了多路径。


    `GEOM` 调度模块允许管理员指定不同的 I/O 调度算法，尝试获得更好的性能。截至本文，目前可用的调度器有 `as`（一种只有一个队列的简单前瞻调度形式）和
    `rr`（在每个客户端队列上进行轮询服务的的前瞻调度）。更多细节请参阅 `gsched(8)`。`GEOM` 系统使得为特定工作负载编写额外的调度模块变得容易。


    ### 文件备份存储 (File-Backed Storage)


    你可以使用文件备份虚拟磁盘作为 `ZFS` 存储设备。虽然我们确实不建议在生产环境中这样做，但文件备份磁盘对于测试和实验非常有用。


    ### 提供者与磁盘 (Providers vs. Disks)


    “提供者”（Provider）是 `FreeBSD` 中的技术术语。`GEOM` 存储提供者是提供数据存储的东西。它可以是磁盘，也可以是某种方式转换存储的
    `GEOM` 类。从技术上讲，本书应该到处使用“提供者”而不是“磁盘”。你可以使用任何 `GEOM` 提供者作为 `ZFS` 的后端。这种方法的问题是，一个物理磁盘可以提供多个不同的提供者。你的池可能有多个不同的提供者，但如果它们都在同一个磁盘上，你就自毁了冗余。2


    本书讨论磁盘时指的是“磁盘上的某种提供者”。这个磁盘并不非完全为 `ZFS` 服务——你可以在磁盘上有一个交换分区和一个 `ZFS` 分区，这完全没问题。但你不能在物理磁盘上拥有两个
    `ZFS` 分区并进行镜像，从而实现物理冗余。


