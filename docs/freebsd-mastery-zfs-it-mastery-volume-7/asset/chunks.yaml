    But the ZFS code was already out in public, and under the `CDDL` license terms,
    Oracle couldn’t stop people from using it. Various open source projects spun up
    their own ZFS development efforts.


    Today, the OpenZFS Project (http://open-zfs.org) is the main coordinator of the
    open source version of ZFS. OpenZFS brings together ZFS developers from many companies
    and operating systems, including Linux, `OS X`, `Illumos`, and `FreeBSD`. Matt
    Ahrens leads the project.


    Unlike the rest of `FreeBSD`, ZFS has a restrictive license. The `CDDL` limits
    one’s ability to file patent lawsuits, and contributions back to ZFS are automatically
    put under the `CDDL`. `FreeBSD`’s 2-clause BSD license permits anyone to use the
    code for anything, including patent lawsuits. But the `CDDL` permits reuse, redistribution,
    and changing of the code, so the code is usable by anyone in any common enterprise
    environment. If you want to base a product on ZFS or include ZFS in another product,
    however, consult a lawyer.


    ## Prerequisites


    This book is written for `FreeBSD` systems administrators interested in ZFS. We
    assume that you are familiar with the basics of `FreeBSD`, including installing,
    configuring users, and managing `GEOM`-based storage. You should know what a “storage
    provider” is and why we use that term. If you’re uncertain of your skills, you
    might pick up a book like *Absolute FreeBSD* (No Starch Press, 2007) or other
    *FreeBSD Mastery* titles to augment your knowledge, or consult the online documentation
    and man pages.


    If you’re using OpenZFS on an operating system other than `FreeBSD`, this book
    offers a bunch of practical ZFS knowledge and experience you can take advantage
    of. You’ll need to ignore the `FreeBSD`-specific stuff, but you’ll learn how to
    optimize and manage ZFS.


    We have not tested this book against Oracle ZFS. Oracle has taken its closed-source
    ZFS in its own direction, and you’re really better off reading Oracle’s official
    documentation if you must run Oracle Solaris.


    You really should know something about disk technologies. `FreeBSD`’s ZFS can
    run atop any `GEOM` provider, but running on raw disk offers certain benefits.
    Running ZFS on a RAID container eliminates those benefits. You should be able
    to slap a RAID controller into acting as a bunch of disks.


    You should also have a test machine for playing with ZFS. Don’t buy this book
    and immediately migrate your main database server to ZFS! Install ZFS on a test
    machine, then a less critical machine. Experiment with ZFS features until you’re
    confident you can best configure ZFS to support your systems’ purposes. While
    ZFS is fast, no filesystem is so tolerant that a sysadmin cannot configure it
    to perform poorly.


    ### Where to Use ZFS?


    You can use ZFS anywhere, but in some places it won’t work well.


    ZFS might not be the best choice for certain virtualization systems. We’ve used
    more than one Linux `KVM`-based virtualization system that chokes on ZFS filesystems,
    and would not be shocked to see other systems have similar issues. Features such
    as migration between hosts and restoring from an image-based backup can be problematic.
    You’ll want to fully test ZFS on your virtualization system before using it there.
    Lucas has deployed ZFS on these systems, mind you, but he uses alternative backup
    and migration strategies.


    ZFS is written for modern hardware. It expects that you have at least a few gigabytes
    of RAM. Embedded systems such as the Raspberry Pi are better suited for traditional
    filesystems like `UFS2`.


    Certain high-intensity workloads on certain hardware perform better on `UFS2`
    than on ZFS, especially if you have hard drives with actual 512-byte blocks. If
    you expect to beat the living snot out of your database, test its performance
    with both `UFS2` and ZFS.


    ## ZFS Hardware


    Many people recommend high-end hardware for ZFS. We like high-end hardware too.
    It’s nifty. But ZFS works just fine on commodity hardware, so long as you understand
    the limitations of the hardware. Much of the ZFS documentation you’ll find on
    the Internet includes recommendations that are not applicable to modern ZFS, or
    not applicable to `FreeBSD`.


    ### RAM


    It’s not surprising that Sun’s documentation said you needed ECC `RAM` to use
    ZFS well. Sun sold high-end servers. But according to Matt Ahrens, “ZFS on a system
    without ECC is no more dangerous than any other filesystem on a system with ECC.”
    ZFS’ built-in error correction compensates for most but not all memory-induced
    errors.


    The generic arguments in favor of ECC `RAM` are still valid, of course. A machine
    with non-ECC memory can suffer memory corruption, and it’s possible for some of
    those errors to get to disk. That would happen regardless of the filesystem you’re
    using, however, and ZFS checksums offer a hope of identifying the problem. If
    you’re running a high-availability service, you want ECC for all of the usual
    reasons. But your ZFS laptop or home movie server will function just fine with
    normal `RAM`.


    ### RAID Controllers


    Do not use a hardware RAID controller. Ever. Running ZFS on top of a hardware
    RAID device creates a configuration with all the disadvantages of RAID and all
    the disadvantages of ZFS. Use a non-RAID host bus adapter (`HBA`) for your disk
    controller.


    All RAID is software RAID. Your hardware RAID controller runs a custom operating
    system to perform RAID tasks, and in the process obscures the hardware from the
    operating system. This made sense back in the early days of widespread commercial
    computing, when consumer operating systems could not be trusted to manage storage.
    Spend three seconds contemplating running OS-level software RAID on Windows 3.1,
    and you’ll understand why hardware RAID became so ubiquitous.


    Our operating systems have gotten better. Our hardware is billions of times more
    powerful. The environment has changed.


    ZFS is designed for direct access to the hardware. It deliberately stores critical
    metadata on multiple disks. It watches those disks for errors, and makes decisions
    based on those errors. A hardware RAID device hides all of this detail from the
    operating system, eliminating ZFS’ ability to heal itself. Hardware RAID presents
    no competing abilities.


    Rebuilding a ZFS array is much faster than rebuilding a RAID array, thanks to
    ZFS’ integration of redundancy with the filesystem. If you manage redundancy with
    hardware RAID, you lose that speed.


    Many RAID controllers will not let you use disks without some sort of RAID, however.
    Even if you configure the controller to have “just a bunch of disks,” or JBOD,
    these controllers actually format each drive as a single disk RAID-0. This masks
    certain information, such as block size and many disk errors, from the operating
    system. Worse, disks used on such a controller are readable only by this brand
    of controller—and sometimes, only by this model of RAID controller! Using such
    a RAID controller for ZFS means you won’t be able to move these hard drives to
    another machine without reformatting them, unless the new box happens to have
    the exact same RAID card. This eliminates all of ZFS’ pool portability.


    Some hardware RAID cards can be reflashed to be JBOD controllers. A bad flash
    might brick your RAID card. As neither of the authors will use hardware RAID again,
    we take that risk.


    Host bus adapters are much less expensive than RAID cards—not only in money, but
    in time. Use them.

