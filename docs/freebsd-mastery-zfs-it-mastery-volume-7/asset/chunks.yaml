    ZFS 让去重表等元数据仅占用系统内存的 25%。（实际上，它是自适应替换缓存，即 `ARC` 的 25%，但我们将在 *FreeBSD Mastery:
    Advanced ZFS* 中详细讨论这一点。）每太 TB 的去重池意味着系统至少需要 20 GB 的内存。即使你基于块使用情况采用更乐观的计算方法（即每太
    TB 磁盘需要 2.3 GB 内存），25% 的限制意味着每个太字节 的去重池仍需要约 10 GB 的内存。（在 *FreeBSD Mastery: Advanced
    ZFS* 中，我们讨论了如何调整这一限制，以便那些想要“自作自受”的人很好地做到。）


    ### 去重有效性


    ZFS 可以模拟去重，并对数据的去重效果提供良好的估算。在你的池上运行 `zdb -S`。你将得到一个关于块利用率和常见元素的漂亮直方图，你可以完全忽略它，只看最后一行即可。


    ```

    # zdb -S data

    Simulated DDT histogram:

    ...

    dedup = 3.68, compress = 1.00, copies = 1.00, dedup * compress / copies = 3.68

    ```


    我们的池数据可以去重 3.68 倍。如果此池中的所有数据都有这种去重率，我们可以在每个太字节 的存储中放入 3.68 TB 的数据。然而，这些数据异常冗余。相比之下，在
    Lucas 的桌面上，包含 FreeBSD 操作系统、用户程序和主目录的 `zroot` 池去重率约为 1.06。


    这并不糟糕。请记住，我们仍然需要每太 TB 去重池配备 20 GB 内存的机器，但我们现在可以根据硬件的当前需求进行成本效益计算。你还可以将测试数据的去重性与其压缩性进行比较。


    内存开销值吗？这取决于内存成本与存储成本的对比。


    每当我们评估数据的去重性和压缩性，并为每种情况的硬件定价时，我们发现，通过更快的磁盘和更多的 CPU 来增强压缩，比使用大量内存进行去重更具成本效益。去重不会提高磁盘读取速度，尽管它可以提高缓存命中率。它只在发现重复块时才会增加写入速度。去重还会显著增加释放块所需的时间，因此删除数据集和快照可能会变得极其缓慢。压缩影响一切，但不会产生这些副作用。


    去重可能只在磁盘空间受限、昂贵且高性能的情况下才有意义。如果你需要在 SSD 池中挤入大量重复数据，`dedup` 可能适合你。


    然而，每个人的数据都是不同的，因此在决定之前请检查你的数据。


    ### 启用去重


    ZFS 属性 `dedup` 用于激活和禁用去重功能。


    ```

    # zfs set dedup=on data/data1

    ```


    该数据集现在已启用去重。


    与压缩一样，去重只影响新写入的数据。激活去重不会魔法地对池中已存在的数据去重。为了获得最佳效果，请在首次创建数据集、写入任何数据之前激活去重。


    ### 禁用去重


    要关闭去重，请将数据集的 `dedup` 属性设置为 `off`。


    ```

    # zfs set dedup=off data/data1

    ```


    与压缩一样，禁用去重不会魔法地重新压缩你所有的文件。已去重的文件将保持去重状态。如果你因为系统性能极其糟糕而关闭了 `dedup`，那么关闭它并不会提高性能。只有删除去重文件才能提高性能。你无法从数据集中清除
    `dedup` 的所有痕迹。你最好使用 `zfs send` 和 `zfs receive` 将数据发送到不使用去重的新数据集。


    你最好的选择可能是不使用去重。去重是一项很棒的技术，需要它的人确实需要它。然而，我们大多数大多数人并没有可去重的数据。不要仅仅因为功能很酷就启用它们。


    在开始时正确选择磁盘空间管理策略将为你省去未来很多痛苦。


    1 从好的一方面来说，你有一个借口把 Jude 推出去。比喻地说，如果你愿意的话。


    2 认为将“对用户公平”考虑在正常职责之外的系统管理员可以使用 `refquotas` 作为减少受用户“污染”接触的方法。


    3 你不监控磁盘空间使用情况？好吧，停机只是另一种形式的警报。


    4 是的，老学究，你的现实数据只由 0 和 1 组成。去把你的数据压缩到一个 0 和一个 1 看看对你有多用吧。


    5 也像布莱·乙·狼一样，在墙上画隧道是没有帮助的。


    # 第 7 章：快照与克隆


    ZFS 最强大的功能之一是快照。文件系统或 zvol 快照允许你访问数据的副本。


    快照是许多 ZFS 功能的根基，例如克隆。克隆是基于快照的文件系统分支。


    快照也是复制的基础，允许将数据集从一个主机发送到另一个主机。


    最棒的是，ZFS 的写复制特性意味着快照是“免费”的。创建快照是瞬时的，且不占用额外空间。


    ## 写复制


    在普通文件系统和 ZFS 中，文件都以块的形式存在。在传统文件系统中，更改文件意味着更改文件的块。如果系统在活动更改这些块时崩溃或掉电，产生的断裂写入会创建一个半旧版本、半新版本且可能无法使用的的文件。


    ZFS 从不覆盖文件的现有块。当某些内容更改文件时，ZFS 会识别必须更改的块并将其写入磁盘上的新位置。这被称为*写复制*，或 `COW`。旧块保持不变。断裂写入可能会丢失文件的最新更改，但文件的之前的版本仍然完整存在。


    ZFS 几乎是一个面向对象的文件系统。元数据、索引和数据都是可以指向其他对象的不同类型。ZFS 池 是一个巨大的对象树，根部是池标签。


    '
- fmt: '

    Each disk in a pool contains four copies of the ZFS label: two at the front of
    the drive and two at the end. Each label contains the pool name, a Globally Unique
    ID (GUID), and information on each member of the VDEV. Each label also contains
    128 KB for uberblocks.


    The `uberblock` is a fixed size object that contains a pointer to the Meta Object
    Set (MOS), the number of the transaction group that generated the `uberblock`,
    and a checksum.


    The `MOS` records the top-level information about everything in the pool, including
    a pointer to a list of all of the root datasets in the pool. In turn each of these
    lists points to similar lists for their children, and to blocks that describe
    the files and directories stored in the dataset. ZFS chains these lists and pointer
    objects as needed for your data. At the bottom of the tree, the leaf blocks contain
    the actual data stored on the pool.


    Every object contains a checksum and a birth time. The checksum is used to make
    sure the object is valid. The birth time is the transaction group (`txg`) number
    that created the block. Birth time is a critical part of snapshot infrastructure.


    Modifying a block of data touches the whole tree. The modified block of data is
    written to a new location, so the block that points to it is updated. This pointer
    block is also written to a new location, so the next object up the tree needs
    updating. This percolates all the way up to the `uberblock`.


    The `uberblock` is the root of the tree. Everything descends from it. ZFS can’t
    modify the `uberblock` without breaking the rules of copy-on-write, so it rotates
    the `uberblock`. Each label reserves 128 KB for uberblocks. Disks with 512-byte
    sectors have 128 uberblocks, while disks with 4 KB sectors have 32 uberblocks.
    If you have a disk with 16 KB sectors, it will have only eight uberblocks. Each
    filesystem update adds a new uberblock to this array. When the array fills up,
    the oldest uberblock gets overwritten.


    When the system starts, ZFS scans all of the uberblocks, finds the newest one
    with a valid checksum, and uses that to import the pool. Even if the most recent
    update somehow got botched, the system can import a consistent version of what
    the pool was like a few seconds before that. If the system failed during a write,
    the very last data is lost—but that data never made it to disk anyway. It’s gone,
    and ZFS can’t help you. Using copy-on-write means that ZFS doesn’t suffer from
    the problems that make `fsck(8)` necessary for traditional filesystems.


    ## How Snapshots Work


    When the administrator tells ZFS to create a snapshot, ZFS copies the filesystem’s
    top-level metadata block. The live system uses the copy, leaving the original
    for use by the snapshot. Creating the snapshot requires copying only the one block,
    which means that ZFS can create snapshots almost instantly. ZFS won’t modify data
    or metadata inside the snapshot, making snapshots read-only. ZFS does record other
    metadata about the snapshot, such as the birth time.


    Snapshots also require a new piece of ZFS metadata, the `dead list`. A dataset’s
    dead list records all the blocks that were used by the most recent snapshot but
    are no longer part of the dataset. When you delete a file from the dataset, the
    blocks used by that file get added to the dataset’s dead list. When you create
    a snapshot, the live dataset’s dead list is handed off to the snapshot and the
    live dataset gets a new, empty dead list.


    Deleting, modifying, or overwriting a file on the live dataset means allocating
    new blocks for the new data and disconnecting blocks containing old data. Snapshots
    need some of those old data blocks, however. Before discarding an old block, the
    system checks to see if a snapshot still needs it.


    ZFS compares the birth time of the old data block with the birth time of the most
    recent snapshot. Blocks younger than the snapshot can’t possibly be used by that
    snapshot and can be tossed into the recycle bin. Blocks older than the snapshot
    birth time are still used by the snapshot, and so get added to the live dataset’s
    dead list.


    After all this, a snapshot is merely a list of which blocks were in use in the
    live dataset at the time the snapshot was taken. Creating a snapshot tells ZFS
    to preserve those blocks, even if the files that use those blocks are removed
    from the live filesystem.


    This means that ZFS doesn’t keep copies of every version of every file. When you
    create a new file and delete it before taking a snapshot, the file is gone. Each
    snapshot contains a copy of each file as it existed when the snapshot was created.
    ZFS does not retain a history like DragonFly’s `HAMMER`.


    Deleting a snapshot requires comparing block birth times to determine which blocks
    can now be freed and which are still in use. If you delete the most recent snapshot,
    the dataset’s current dead list gets updated to remove blocks required only by
    that snapshot.


    Snapshots mean that data can stick around for a long time. If you took a snapshot
    one year ago, any blocks with a birth date more than a year ago are still in use,
    whether you deleted them 11 months ago or before lunch today. Deleting a six-month-old
    snapshot might not free up much space if the year-old snapshot needs most of those
    blocks.


    Only once no filesystems, volumes, or snapshots use a block, does it get freed.


    ## Using Snapshots


    To experiment with snapshots, let’s create a new filesystem dataset and populate
    it with some files.


    ```bash

    # zfs create -o mountpoint=/sheep mypool/sheep

    # cd /sheep

    # dd if=/dev/random of=randomfile bs=1m count=1

    # fetch -o zfsbook.html http://www.zfsbook.com/

    # date > date.txt

    ```


    This gives us some data we can play with.


    ### Creating a Snapshot


    Use `zfs snapshot` to create a snapshot. Specify the dataset by its full path,
    then add `@` and a snapshot name.


    ```bash

    # zfs snapshot mypool/sheep@snap1

    ```


    View snapshots with `zfs list -t snapshot`. To see the snapshots of a specific
    dataset, add the `-r` flag and the dataset name.


    ```bash

    # zfs list -t snapshot -r mypool/sheep

    NAME               USED  AVAIL  REFER  MOUNTPOINT

    mypool/sheep@snap1    0      -  1.11M  -

    ```


    Notice that the amount of space used by the snapshot (the `USED` column) is `0`.
    Every block in the snapshot is still used by the live dataset, so the snapshot
    uses no additional space.


    ### Dataset Changes and Snapshot Space


    Now change the dataset and see how it affects the snapshots. Here we append a
    megabyte of new crud to the random file and update the date file.


    ```bash

    # dd if=/dev/random of=randomfile bs=1m count=1 oseek=1

    # date > date.txt

    ```


    Think back on how snapshots work. The file of random data grew by one megabyte,
    but that’s not in the old snapshot. The date file was replaced, so the snapshot
    should have held onto the blocks used by the older file. Let’s see what that does
    to the snapshot’s space usage.


    ```bash

    # zfs list -t snapshot -r mypool/sheep

    NAME                USED  AVAIL  REFER  MOUNTPOINT

    mypool/sheep@snap1   72K      -  1.11M  -

    ```


    The snapshot now uses 72 KB. The only space consumed by the snapshot was for the
    replaced block from the date file. The snapshot doesn’t get charged for the new
    space sucked up by the larger random file, because no blocks were overwritten.


    Now let’s create a second snapshot and see how much space it uses.


    ```bash

    # zfs snapshot mypool/sheep@second

    # zfs list -t snapshot -r mypool/sheep

    NAME                USED  AVAIL  REFER  MOUNTPOINT

    mypool/sheep@snap1   72K      -  1.11M  -

    mypool/sheep@second    0      -  2.11M  -

    ```


    The `REFER` column shows that the first snapshot gives you access to 1.11 MB of
    data, while the second lets you see 2.11 MB of data. The first snapshot uses 72
    KB of space, while the second uses none. The second snapshot is still identical
    to the live dataset.


    But not for long. Let’s change the live dataset by overwriting part of the random
    file and see how space changes changes.

