    disks for larger disks, doing so won’t change the array’s size. Creating a RAID
    device petrifies the array’s basic characteristics.


    ZFS pools not only tolerate changes, but they’re designed to easily accept additions
    as well. If you have a ZFS pool with five VDEVs and you want to add a sixth, that’s
    fine. ZFS accepts that VDEV and starts striping data on that device without blinking.
    You cannot add storage to RAID-Z VDEVs, only VDEVs to pools. The number of providers
    in a RAID-Z VDEV is fixed at creation time.


    With ZFS, though, that virtual device can be any type of VDEV ZFS supports. Take
    two VDEVs that are mirror pairs. Put them in a single zpool. ZFS stripes data
    across them. In traditional RAID, a stripe on top of mirrors would be called RAID-10\.
    For most use cases, RAID-10 is the highest-performance RAID you can have. Where
    traditional RAID-10 has a fixed size, however, you can add additional VDEVs to
    a pool. Expanding your RAID-10 means backing up your data, adding disks to the
    RAID array, and restoring the data. Expanding your zpool means adding more VDEVs
    to the pool. RAID-10 also allows a depth of up to two disks, where ZFS allows
    a depth of up to 264.


    Remember, though, that pools do not provide any redundancy. All ZFS redundancy
    comes from the underlying VDEVs.


    ### Viewing Pools


    To see all of the pools on your system, run zpool list.


    ```

    # zpool list

    NAME   SIZE  ALLOC  FREE  EXPANDSZ  FRAG  CAP  DEDUP  HEALTH  ALTROOT

    db    2.72T  1.16G  2.72T        -    0%   0%  1.00x  ONLINE  -

    zroot  920G  17.3G  903G         -    2%   1%  1.00x  ONLINE  -

    ```


    The first column gives the pool name. This system has two pools, db and zroot.


    The next three columns give size and usage information on each pool. You’ll get
    the size, the amount of space used, and the amount of free space.


    The EXPANDSZ column shows if the underlying storage providers have any free space.
    You might be able to expand the amount of space in this pool, as discussed in
    Chapter 5\. This space includes blocks that will go to parity information, so
    expanding the pool won’t give you this much usable space.


    Under FRAG you’ll see the amount of fragmentation in this pool. Fragmentation
    degrades filesystem performance.


    The CAP column shows what percentage of the available space is used.


    The DEDUP entry shows the amount of deduplication that’s happened on the filesystem.
    Chapter 6 covers deduplication.


    The pool’s HEALTH column reflects the status of the underlying VDEVs. If a storage
    provider fails, your first hint will be any status other than ONLINE. Chapter
    5 discusses pool health.


    Finally, the ALTROOT shows where this pool is mounted, or its “alternate root.”
    Chapter 4 covers alternate roots.


    If you want to know the information for a specific pool or pools, list the pool
    names after zpool list. This shows only the output of the storage pools prod and
    test.


    ```

    # zpool list prod test

    ```


    If you want more detailed information on your pools, including the utilization
    of underlying drives, add the -v option. You must give the option before any pool
    name.


    ```

    # zpool list -v zroot

    ```


    The -p flag prints numbers in bytes rather than the more human-friendly format,
    and -H eliminates the column headers. These options are useful for automation
    and management scripts.


    For a more detailed view of a system’s pools, including the underlying VDEV layout,
    use zpool status. We’ll see lots of examples of zpool status when we create pools.


    To briefly check your pools, run zpool status -x.


    ```

    # zpool status -x

    all pools are healthy

    ```


    Sometimes, that’s all you need.


    ### Multiple VDEVs


    A pool can include multiple VDEVs. Adding VDEVs not only increases the space available
    in the pool but also increases the performance. A pool splits all writes between
    the VDEVs. A small file might need only a single stripe, which would go on a single
    VDEV, but if you’re writing a whole bunch of small files ZFS divides the writes
    between the VDEVs.


    Chapter 2 talks about the performance of various VDEV types. That performance
    percolates up into the pool level. If you’re reading a large file from across
    multiple VDEVs, the file read finishes once the last (usually the slowest) drive
    finishes calling up its part of the data. If your pool includes multiple VDEVs,
    however, that slowest drive contains only a fraction of the file, somewhat reducing
    the time needed to access it. Remember, the slowest part of reading data from
    a storage provider is seeking the head to the correct piece of disk to call it
    from, so it’s not as simple as dividing the time by the number of VDEVs—but additional
    VDEVs in a pool do improve performance.


    Best practices call for using only identical storage VDEVs in a pool. If you have
    a bunch of mirrored VDEVs in your pool, don’t go adding a RAID-Z3 device to the
    pool. Mixed storage VDEVs foul up pool performance terribly and make ZFS work
    harder as it optimally spreads the data between the devices. You *can* do this,
    but you shouldn’t.[1](#part0007.xhtml_ref_footnotebookmark_end_30_1)


    ### Removing VDEVs


    You cannot currently remove a VDEV from a pool. Each VDEV has data on it. You
    can remove disks from certain types of VDEV, but the VDEV as a whole has critical
    pool data on it. For example, you can remove a disk from a mirror VDEV, but you
    cannot remove the entire VDEV from the pool. Normally you’d remove a disk from
    a VDEV only when it fails. Forcibly removing a VDEV from a pool—say, by pulling
    the storage providers—destroys the pool. The ability to remove a VDEV from a stripe
    or mirror pool is expected to arrive in OpenZFS in late 2015, but it’s not yet
    possible. Support for removing RAID-Z devices is on the road map, but work has
    not yet started.


    This means you cannot shrink a pool. If you want to make a pool smaller, you must
    move the data on that pool to a new, smaller pool and then recycle the disks from
    the original pool.


    ## Pools Alignment and Disk Sector Size


    ZFS expects to have an in-depth knowledge of the storage medium, including the
    sector size of the underlying providers. If your pools don’t use the correct sector
    size, or if ZFS’ sectors don’t align to the physical sectors on the disk, your
    storage performance will drop by half or more. These are orthogonal problems,
    but failing to plan for either one will crush your system.


    We’ll discuss partition alignment and ZFS sector size separately.


    ### Partition Alignment


    Disks report their sector size, so this isn’t a problem—except when it is. Many
    disks report that they have 512-byte sectors, but they really have 4096-byte (4K)
    sectors. *FreeBSD Mastery: Storage Essentials* discusses this in depth, so we
    won’t go through this in painful detail here.


    Older partition management schemes, like the venerable Master Boot Record (MBR),
    included all sorts of hairy math to make sure that disk partitions conformed to
    the disk’s physical characteristics. Modern partition schemes like GUID Partition
    Tables (GPT) know that physical disks speak with forked tongue and that those
    old MBR-based restrictions are utterly bogus, and so require only that partitions
    fill complete sectors.


    But when a disk lies about its sector size, gpart(8) lets you create partitions
    that begin or end halfway through a physical sector. Each read or write to the
    disk requires touching two physical sectors. This wreaks havoc on performance.


    Certain SSDs also expect partitions to be aligned along 128 KB or 1 MB boundaries.'
