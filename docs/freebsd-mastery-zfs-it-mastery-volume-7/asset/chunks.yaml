    data.


    Table 3: Three-Disk Virtual Device Configurations


    | Disks | Config | Read IOPS | Write IOPS | Read MB/s | Write MB/s | Usable Space
    | Fault Tolerance |


    | 3 | 1 x 3 disk Mirror | 750 | 250 | 300 | 100 | 1 TB (33%) | 2 |


    | 3 | 1 x 3 disk RAID-Z1 | 250 | 250 | 200 | 200 | 2 TB (66%) | 1 |


    Note here that IOPS don’t necessarily scale to actual read/write performance.
    A mirror VDEV has three times the read IOPS of a RAID-Z1 because the head in each
    drive can work independently, whereas in RAID-Z the heads must work together.
