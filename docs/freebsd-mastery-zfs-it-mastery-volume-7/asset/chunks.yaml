    `SOURCE` 列显示了该属性设置的位置。这可能是一个单独横杠 `-`，或者是 `default` 或 `local` 单词。横杠表示该属性本身并没有被设置，而是以某种方式从池中读取的。你不需要为池的大小或该空间的使用量设置值，FreeBSD
    会从池中计算这些值。`SOURCE` 为 `default` 表示该属性被设置为其默认值，而 `local` 则意味着该属性是在此池上被特定设置的。


    要获取单个属性，请运行 `zpool get` 并加上属性名。


    ```

    # zpool get size

    NAME   PROPERTY  VALUE  SOURCE

    db     size      2.72T  -

    zroot  size      920G   -

    ```


    通过在末尾提供池名称来缩小范围。


    ## 修改池属性


    我们将在本书中通过设置属性来更改池的行为。使用 `zpool set` 命令更改池的属性。在这里，我们设置一个池的注释（comment）属性。


    ```

    # zpool set comment="Main OS files" zroot

    ```


    该注释现在显示在属性列表中。


    ```

    # zpool get comment

    NAME   PROPERTY  VALUE          SOURCE

    db     comment   -              default

    zroot  comment   Main OS files  local

    ```


    注意这里的 `SOURCE` 列。默认情况下，池没有注释。但现在我设置了注释，源就变为了 `local`。一旦属性的源从 `default` 变为 `local`，它将永远保持为
    `local`。即使将属性设置为默认值也不会更改该源。


    ```

    # zpool set comment="-" zroot

    # zpool get comment

    NAME   PROPERTY  VALUE  SOURCE

    db     comment   -      default

    zroot  comment   -      local

    ```


    我们在本地将注释设为了默认值，因此该值的源保持为 `local`。


    你可以在创建池时使用 `-o` 设置池的属性。你可以使用 `-O` 设置该池上根数据集的属性。


    ```

    # zpool create -o altroot=/mnt -O canmount=off -m none zroot /dev/gpt/disk0

    ```


    该池的 `altroot` 属性被设置为 `/mnt`，且该池上的根数据集的 `canmount` 属性被设置为 `off`。如果某个属性改变了数据的写入方式，则只有在更改属性后写入的数据受影响。ZFS
    不会重写现有数据以符合属性的更改。


    ## 池历史


    每个 `zpool` 都保留了对池进行过的所有更改的副本，一直追溯到池的创建时期。这段历史不包括系统开机和关机等常规事件，但它包含了设置属性、池升级和创建数据集。


    要访问历史记录，运行 `zpool history` 并提供池名称。


    ```

    # zpool history zroot

    History for ''zroot'':

    2014-01-07.04:12:05 zpool create -o altroot=/mnt -O canmount=off -m none zroot
    mirror /dev/gpt/disk0.nop /dev/gpt/disk1.nop

    2014-01-07.04:12:50 zfs set checksum=fletcher4 zroot

    2014-01-07.04:13:00 zfs set atime=off zroot

    …

    ```


    丰富的 FreeBSD 经验丰富的可能在 FreeBSD 文档和论坛的许多 ZFS 教程中识别出这些。


    历史结束于：


    ```

    ...


    2015-03-12.14:36:35 zpool set comment=Main OS files zroot


    2015-03-12.14:43:45 zpool set comment=- zroot

    ```


    我们更改了注释属性，所以它出现在历史记录中。永远如此。


    遗憾的是，池历史没有跟踪是谁执行了每项更改，但拥有更改的永久记录有助于问题分析。


    ## Zpool 维护自动化


    FreeBSD 作为 `periodic(8)` 运行的每日维护任务的一部分检查每个系统的文件系统。你可以将 ZFS 池信息添加到此检查中，这样你就能获得有关池健康的信息。`periodic.conf`
    中的 `daily_status_zfs_enable` 选项启用池检查。


    ```bash

    daily_status_zfs_enable="YES"

    ```


    每日的 `periodic(8)` 输出现在包含了 `zpool status -x` 的输出，通常是单行的“all pools are healthy（所有池均健康）”。


    如果你 get 你的池需要更详细的信息，每日报告还可以包含 `zpool list` 输出。将 `daily_status_zfs_zpool_list`
    设置为 `YES` 以获取列表。如果你想精简该输出，仅显示特定池的状态，请在 `periodic.conf` 的 `daily_status_zpool`
    变量中列出所需的池。


    你还可以让 FreeBSD 执行池的清洗（scrub）。在设置了清洗选项后，FreeBSD 会进行每日检查查看池是否需要清洗，但仅按配置的间隔进行清洗。要每
    35 天自动清洗每个池，请在 `periodic.conf` 中将 `daily_scrub_zfs_enable` 设置为 `YES`。


    ```bash

    daily_scrub_zfs_enable="YES"

    ```


    FreeBSD 默认清洗所有池。你不能显式从每日清洗检查中排除特定的池。但是，你可以在 `daily_scrub_zfs_pools` 中显式列出你想检查的池。未列出的池都不会被清洗。


    ```bash

    daily_scrub_zfs_pools="zroot prod test"

    ```


    要更改两次清洗之间的天数，请将 `daily_scrub_zfs_enable` 设置为所需的值。


    ```bash

    daily_scrub_zfs_enable="10"

    ```


