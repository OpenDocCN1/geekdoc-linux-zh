  trans: "\n\n池的状态将显示为 `ONLINE`（已销毁）。`ONLINE` 表示该池具有运行所需的所有组件。使用 `-D` 标记配合池名称或 ID\
    \ 数字可以恢复它。\n\n```\n# zpool import -D 8407636206040904802\n```\n\n如果一个池缺少了过多的存储提供者，你将无法导入它。你不能对离线的驱动器执行\
    \ `zpool online`。请检查硬盘架，确保你想要导入的驱动已连接并通电。下次你运行 `zpool import` 时，重新连接的驱动将会显示出来。\n\
    \n如果池缺少日志设备（log device），添加 `-m` 标记以不包含该设备进行导入。已导出的池其存储提供者应该包含所有数据。\n\n```\n# zpool\
    \ import -m db\n```\n\n你可以在导入池时通过 `-o` 标记设置池属性。在这里，我们导入并重命名了一个数据库池，并还将其设置为只读。\n\
    \n```\n# zpool import -o readonly=on db olddb\n```\n\n现在我们可以从旧池中复制文件，而不会损坏原始数据的副本。\n\
    \n你可能想要导入一个损坏的池，以尝试恢复其上的部分数据。`-F` 标记告诉 `zpool import` 回滚最后几次事务。这可能会让池恢复到可导入的状态。你会丢失回滚事务的内容，但如果此方法有效，这些事务可能本身就导致了你的问题。\n\
    \n## 更大的提供者\n\nZFS 的一个有趣事实是，它允许用更大的提供者替换现有提供者。如果你的冗余存储池使用的是 4 TB 磁盘，你可以将它们替换为例如\
    \ 10 TB 的型号，并增加池的大小。这需要连续用更大的提供者替换旧提供者。\n\n池通过每个 `VDEV` 中最小的磁盘来计算其大小。如果你的镜像（mirror）在单个\
    \ `VDEV` 中有一个 4 TB 磁盘和一个 10 TB 磁盘，那么该镜像 `VDEV` 将仅有 4 TB 的空间。在 4 TB 磁盘上镜像 10 TB\
    \ 的数据是没有任何合理逻辑的！但是，如果你替换了 4 TB 的磁盘，你就能将镜像扩展到最小磁盘的大小。\n\n一个需要考虑的问题是：你希望池在条件允许时自动扩展，还是希望手动激活扩展？ZFS\
    \ 可以自动实现扩展，但你需要在开始操作之前为每个池设置 `autoexpand` 属性。ZFS 默认关闭此设置，因为你永远无法缩小池的大小。（开启 `autoexpand`\
    \ 不会伤害你，但默认开启可能会导致你拥有一个对于你其他任何磁盘来说都太太大的池。）\n\n```\n# zpool set autoexpand=on db\n\
    ```\n\n在未设置此属性的情况下，你必须在替换提供者后运行命令扩展池。\n\n替换池中的所有提供者并不复杂，但确实涉及相当大量的繁琐工作。以这个具有三个提供者的\
    \ RAID-Z1 池为例。\n\n```\nNAME        STATE READ WRITE CKSUM\ndb          ONLINE\
    \   0     0     0\n raidz1-0   ONLINE   0     0     0\n  gpt/zfs1  ONLINE   0\
    \     0     0\n  gpt/zfs2  ONLINE   0     0     0\n  gpt/zfs3  ONLINE   0    \
    \ 0     0\n```\n\n这些提供者中的每一个都是单块微型磁盘。\n\n```\n# zpool list db\nNAME  SIZE  ALLOC\
    \   FREE   FRAG  EXPANDSZ  CAP  DEDUP  HEALTH  ALTROOT\ndb    59.5G  1.43G  58.1G\
    \  1%           -   2%  1.00x  ONLINE  -\n```\n\n如果硬件有足够的物理空间，添加新驱动器并创建替换提供者。如果物理空间不足，请离线提供者并更换硬盘。在这里我们离线并替换驱动器。\n\
    \n此池有三个提供者：`gpt/zfs1`、`gpt/zfs2` 和 `gpt/zfs3`。我们首先替换 `gpt/zfs1`。运行 `gpart show\
    \ -l` 显示该提供者位于驱动 `da1` 上。\n\n如果你需要离线驱动器以添加替换驱动器，请先识别驱动 `da1` 的物理位置。根据硬件要求准备好替换驱动器，然后从提供者处离线池。\n\
    \n```\n# zpool offline db gpt/zfs1\n```\n\n此命令应该静默返回。检查 `zpool status` 显示该提供者已离线。你可以从系统中移除这块硬盘。\n\
    \n插入替换驱动器，可以放在移除旧驱动器的位置，也可以新的插槽。新驱动器应该出现在 `/var/run/dmesg.boot` 中。在该系统中，新驱动器显示为\
    \ `/dev/da4`。在该驱动器上创建所需的分区并为其标记标签。如果你在标签中未使用序列号，而是仅根据物理位置标记，则可以使用相同的标签。（再次强调，我们在这里使用这些短标签是因为它们在学习时更易读。）\n\
    \n```\n# gpart create -s gpt da4\nda4 created\n# gpart add –a 1m -t freebsd-zfs\
    \ -l zfs1 da4\n```\n\n现在告诉池替换故障的设备。\n\n```\n# zpool replace -f db gpt/zfs1\n```\n\
    \n在替换任何其他提供者之前，让池完成重同步（resilvering）。在重同步期间替换非冗余单元只会带来苦。。如果你使用的是 RAID-Z2 或 RAID-Z3，可以同时替换多块磁盘，但这是风险的。额外的磁盘故障可能会导致\
    \ VDEV 失败。如果没有 ZFS 提供的冗余，ZFS 无法自愈。……速度。\n\n### ZFS 版本与升级\n\nFreeBSD 和 OpenZFS\
    \ 团队不断改进软件，为 ZFS 增加了新功能。这些改进中的某些需要对池进行更改或添加。当你升级主机操作系统时，主机可能会获得现有池不支持的新功能。在使用这些新功能之前，你必须升级池。如果你不升级池，池可以继续运行，但无法利用新功能。\n\
    \n### 特性标志（Feature Flags）\n\n最初，ZFS 使用版本号来指示池或操作系统版本支持哪些功能。版本号从 1 开始，每有一个影响磁盘上格式的\
    \ ZFS 改进，版本号增加 1。当 Sun 公司作为所有 ZFS 开发的中心协调者时，单一递增的版本号是有意义的。OpenZFS 中的版本号设置为 5000，池现在使用特性标志。我们在第\
    \ 3 章详细讨论了特性标志。\n\n特性标志有两个问题：“你的池目前支持哪些功能？”以及“你的操作系统支持哪些功能？”通过检查池属性来查看你磁盘上的内容，如第\
    \ 3 章所示。要查看你的 FreeBSD 版本支持的所有特性标志，请运行 `zpool upgrade -v`。\n\n"
- fmt: "\nThe features marked “read-only compatible” mean that hosts that don’t support\
    \ these feature flags can import these pools, but only as read-only. See “Pool\
    \ Import and Export” earlier this chapter for a discussion of moving pools between\
    \ hosts.\n\nThe FreeBSD release notes for each version indicate new ZFS features.\
    \ You do read the release notes carefully before upgrading, don’t you? If you\
    \ somehow miss that part of the documentation, `zpool status` tells you which\
    \ pools could use an upgrade. (Remember, just because a pool can take an upgrade\
    \ doesn’t mean that you should do the upgrade. If you might need to revert an\
    \ operating system upgrade, leave your pool features alone!)\n\n```\n# zpool status\
    \ db\n pool: db\nstate: ONLINE\nstatus: Some supported features are not enabled\
    \ on the pool. The pool can\n        still be used, but some features are unavailable.\n\
    action: Enable all features using 'zpool upgrade'. Once this is done,\n      \
    \  the pool may no longer be accessible by software that does not support\n  \
    \      the features. See zpool-features(7) for details.\n...\n```\n\nYou’ll also\
    \ get a list of the new features supported by the upgrade. Upgrade your pools\
    \ by running `zpool upgrade` on the pool.\n\n```\n# zpool upgrade zroot\n```\n\
    \nPool upgrades non-reversibly add new fields to the existing pool layout. An\
    \ upgrade doesn’t rewrite existing data, however. While the new feature might\
    \ have problems, the mere availability of that feature flag on the disk is very\
    \ low risk.\n\nIf you plan to move disks to a system running an older operating\
    \ system, or to an operating system running an older version of OpenZFS, you can\
    \ enable pool features more selectively. Moving disks from a FreeBSD 11 system\
    \ to a FreeBSD 10 system requires carefully checking pool features. Enable a single\
    \ feature by setting its property to `enabled`.\n\n```\n# zpool set feature@large_blocks=enabled\
    \ data\n```\n\nThis pool now supports the `large_blocks` feature.\n\n### Zpool\
    \ Upgrades and the Boot Loader\n\nFreeBSD’s boot loader must understand the ZFS\
    \ pool you’re booting from. This means it must recognize the pool’s features.\
    \ Any time you update the pool containing the `/boot` filesystem, you must update\
    \ the boot loader on the disks. Use `gpart(8)` to update the boot loader. If you\
    \ boot from a ZFS mirror on the disks `da0` and `da1`, you’ll update the loaders\
    \ on both disks like so:\n\n```\n# gpart bootcode -b /boot/pmbr -p /boot/gptzfsboot\
    \ -i 1 da0\n# gpart bootcode -b /boot/pmbr -p /boot/gptzfsboot -i 1 da1\n```\n\
    \nThe system might not boot without this update. The `zpool upgrade` command prints\
    \ a reminder to perform the update, but you’re free to ignore it if you like.\
    \ If you render your system unbootable, you might try to boot from the newest\
    \ FreeBSD-current ISO or a live CD and copy its boot loader to your system.\n\n\
    ## FreeBSD ZFS Pool Limitations\n\nFreeBSD does not yet support all ZFS features.\
    \ Most unsupported features don’t work because of fundamental differences between\
    \ the FreeBSD and Solaris architectures. People are actively developing solutions\
    \ that will let FreeBSD support all of ZFS’' features. We expect some of these\
    \ to become supported after this book goes to press.\n\nAt this time, hot spares\
    \ do not work. Hot spares let ZFS automatically swap a failed drive with an assigned\
    \ standby on the system. This depends on the forthcoming `zfsd(8)` implementation,\
    \ which is still a work in progress.\n\nNow that you can fill a pool with data\
    \ and repair the hardware, let’s play with a couple of ZFS’ more useful features,\
    \ clones and snapshots.\n\n[1](#part0009.xhtml_ref_footnotebookmark_start_32_1)\
    \ And now that Lucas has a good example of a problem, he can tell that friend\
    \ that this zpool is wounded. Although, to be certain he has good examples, he’ll\
    \ probably wait until he finishes this book. Being Lucas’’ friend kind of sucks.\n\
    \n# Chapter 6: Disk Space Management\n\nZFS makes it easy to answer questions\
    \ like “How much free disk does this pool have?” The question “What’s using up\
    \ all my space?” is much harder to answer thanks to snapshots, clones, reservations,\
    \ ZVOLs, and referenced data. These features might also cause problems when trying\
    \ to use traditional filesystem management methods on ZFS datasets. It’s possible\
    \ to find you don’t have enough space to delete files, which is terribly confusing\
    \ until you understand what’s happening.\n\nZFS offers ways to improve disk space\
    \ utilization. Rather than requiring the system administrator to compress individual\
    \ files, ZFS can use compression at the filesystem level. ZFS can also perform\
    \ deduplication of files, vastly improving disk usage at the cost of memory. We’ll\
    \ see how to evaluate these options and determine when to use each.\n\nBut let’s\
    \ start by considering ZFS’ disk space usage.\n\n## Reading ZFS Disk Usage\n\n\
    The `df(1)` program shows the amount of free space on each partition, while `du(1)`\
    \ shows how much disk is used in a partition or directory tree. For decades, sysadmins\
    \ have used these tools to see what’s eating their free space. They’re great for\
    \ traditional filesystems. ZFS requires different ways of thinking, however.\n\
    \nConsider this (heavily trimmed) list of ZFS datasets.\n\n```\n# zfs list\nNAME\
    \                 USED  AVAIL  REFER  MOUNTPOINT\nzroot               17.5G  \
    \ 874G   144K  none\nzroot/ROOT          1.35G   874G   144K  none\nzroot/ROOT/default\
    \  1.35G   874G  1.35G  /\nzroot/usr           12.5G   874G   454M  /usr\nzroot/usr/local\
    \     1.84G   874G  1.84G  /usr/local\n...\n```\n\nAccording to this, the `zroot`\
    \ pool has 17.5 GB in use. At first glance you might think that `zroot/ROOT` and\
    \ `zroot/ROOT/default` both use 1.35 GB. You’d be wrong.\n\nThe dataset `zroot/ROOT`\
    \ uses 1.35 GB of data. There’s 1.35 GB of data in this dataset. The dataset `zroot/ROOT/default`\
    \ also uses 1.35 GB of data. The `zroot/ROOT/default` dataset is included in the\
    \ `zroot/ROOT` dataset, however. It’s the same 1.35 GB of data.\n\nSimilarly,\
    \ consider the 12.5 GB that `zroot/usr` uses. This dataset has child datasets,\
    \ such as `zroot/usr/local`, `zroot/usr/obj`, and so on. Each of these datasets\
    \ uses a chunk of data.\n\nWith ZFS, you can’t just add up the used space to get\
    \ the total.\n\nThe `AVAIL` column, or space available, is somewhat more reliable.\
    \ The pool `zroot` has 874 GB of empty space. Once you start snapshots and clones\
    \ and all of the goodness, you’ll find that this 874 GB of space can contain many\
    \ times that data, thanks to referenced data.\n\n### Referenced Data\n\nThe amount\
    \ of data included in a dataset is the referenced data. Look at the `REFER` column\
    \ in the listing above. The `zroot` pool and `zroot/ROOT` both refer to 144 KB\
    \ of space. That’s roughly enough to say that “yes, this chunk of stuff exists.”\
    \ It’s a placeholder. The dataset `zroot/ROOT/default`, however, references 1.35\
    \ GB of data.\n\nThe referenced data is stuff that exists within this filesystem\
    \ or dataset. If you go into the `zroot/ROOT/default` filesystem, you’ll find\
    \ 1.35 GB of stuff.\n\nSo, you add up the referenced space and get the amount\
    \ used? No, wrong again. Multiple ZFS datasets can refer to the same collection\
    \ of data. That’s exactly how snapshots and clones work. That’s why ZFS can hold,\
    \ for example, several 10 GB snapshots in 11 GB of space.\n\nClones use space\
    \ much like snapshots, except in a more dynamic manner. Once you add in deduplication\
    \ and compression, disk space usage gets complicated really quickly.\n\n### Freeing\
    \ Space\n\nIn many Solaris deployments, deleting files doesn’t actually free up\
    \ space. In most situations, deletions actually increase disk space usage by a\
    \ tiny amount, thanks to snapshots and metadata. The space used by those files\
    \ gets assigned to the most recent snapshot. To successfully manage ZFS, you have\
    \ to understand how the underlying features work and what ZFS does when you delete\
    \ data.\n"
