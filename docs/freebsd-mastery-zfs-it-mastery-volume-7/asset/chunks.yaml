  trans: "\n\n```\n# zfs get quota zroot/var/log\nNAME           PROPERTY  VALUE \
    \ SOURCE\nzroot/var/log  quota        2G  local\n```\n\n使用 `zfs get all` 和 ZFS\
    \ 数据集名称可以查看数据集的所有属性。\n\n第 4 节详细介绍了 ZFS 属性，而第 6 节将讨论如何限制数据集的大小。\n\n### ZFS 限制\n\
    \n文件系统一直都有最大大小和限制。我们都熟悉并感到头疼的 FAT 文件系统经过了多次修订，部分原因是为了克服其从 32 MB 到 2 GB，再到 4 GB\
    \ 的最大容量限制。FAT32 的 2 TB 限制在如今看来也已经有些局促了。UFS 和 `ext2/3/4fs` 也有它们自己的、同样任意的限制。这些限制的存在是因为文件系统的作者必须在某个地方设置一个限制，并选择了他们认为在未来几年内好用的值。然而，一个流行的文件系统会一直被使用，直到达到这些限制为止，因此系统管理员不得不反复应对这些限制。\n\
    \nZFS 的支持者声称 ZFS 不受这些任意限制的影响，但这并不*完全*真实。ZFS 使用 128 位来存储其大多数值，设置的限制之高，以至于今天从事系统管理的人永远不会遇到它们。一个目录可以拥有\
    \ 2⁴⁸ 个文件，每个文件大小可达 16 EB。单个池可以多达 256 ZB，或者 2⁷⁸ 字节。一个存储池可以包含多达 264 个设备，而单个主机可以拥有多达\
    \ 264 个存储池。\n\n好消息是，我们的寿命还没长到能这些限制。坏消息是，我们拥有所有在文件系统之间迁移的专业知识。当技术遇到 ZFS 的限制时，那些可怜的人将不再习惯在文件系统之间迁移。幸运的是，他们还有一些残留的正在进行的\
    \ FAT/UFS/extfs 切换供练习。\n\n## 存储池\n\nZFS 使用的是*存储池*（storage pools）而不是磁盘。存储池是底层存储提供者之上的抽象，允许你将物理介质与在其之上用户可见的文件系统分离。\n\
    \n使用 `zpool(8)` 来查看和管理系统的存储池。这里是来自默认 FreeBSD 系统的池。\n\n```\n# zpool status\n  pool:\
    \ zroot\n state: ONLINE\n  scan: none requested\nconfig:\n\nNAME       STATE \
    \  READ WRITE CKSUM\nzroot     ONLINE      0     0     0\n gpt/zfs0 ONLINE   \
    \   0     0     0\n\nerrors: No known data errors\n```\n\n你首先获得池的名字和状态。系统可以有多个\
    \ ZFS 池——拥有几十个硬盘的大型系统通常有多个池。如果此主机有多个存储池，每个池将像上面的示例那样出现在单独的描述中。\n\nZFS 可以对存储池执行各种类型的完整性检查。`scan`\
    \ 语句显示是否正在执行任何完整性检查以及最近一次扫描的结果。\n\n池列表的最后部分显示了池中虚拟设备的布局。\n\n## 虚拟设备\n\n存储池包含一个或多个虚拟设备，或者称为\
    \ *VDEVs*（虚拟设备）。VDEV 类似于传统的 RAID 设备。一个大的 RAID-5 向文件系统层呈现为一个单一巨大的设备，尽管系统管理员知道它实际上是由一大堆较小的磁盘组成的。虚拟设备允许你将特定的设备分配给特定的角色。通过\
    \ VDEV，你可以根据需要安排物理存储。\n\n虚拟设备是 ZFS 魔法发生的地方。池可以被安排为 RAID 风格的冗余。你可以使用提供者作为专用的读写缓存，以提高虚拟设备的性能。第\
    \ 2 节更深入地介绍了虚拟设备。\n\nZFS 的数据冗余和自动错误修复也发生在 VDEV 级别。ZFS 中的所有内容都经过校验和，以进行完整性验证。如果你的池有足够的冗余，ZFS\
    \ 是自愈的。如果你的池缺乏冗余，那么吧，至少你知道数据已损坏，并且你可以（希望如此）从备份中恢复[1]。\n\n显示池健康的 `zpool status`\
    \ 命令也显示该池中的虚拟设备。查看前一节中的示例。这个非常简单的池 `zroot` 包含一个存储提供者 `/dev/gpt/zfs0`。这个提供者是一个\
    \ GPT 分区，而不是磁盘。ZFS 可以使用各种底层存储，正如第 2 节所讨论。使用 GPT 分区非常常见，其他选项还包括整盘、文件以及任何其他 GEOM\
    \ 提供者。FreeBSD 使用 GEOM 提供者来支持加密等功能。\n\n## 块与节点\n\n传统文件系统几乎总是使用各种数据块来存储数据，并用索引节点（inode）映射这些块的内容。BSD\
    \ 的 UFS 和 Linux 的 `extfs` 将这些称为*块*（blocks）和*节点*（inodes）。即使微软的 FAT 文件系统也有数据存储块和索引节点。\n\
    \n与文件系统一样，ZFS 使用索引块和数据块。然而，与旧的文件系统不同，ZFS 按需生成索引节点。只要可能，ZFS 会创建适应数据大小的存储块。可变大小的块并不总是适应你可能创建的每个文件，但它们确实比传统文件系统灵活得多。\n\
    \n与 UFS 超块（superblocks）不同，动态生成的索引块无法放置在磁盘上的已知位置。ZFS 如何应对索引块损坏的可能性？ZFS 在算法可预测的位置存储了多个关键索引块的副本。这些*备录块*（ditto\
    \ blocks）会在磁盘上的多个位置进行复制。第 3 节讨论了 ZFS 块、优块（uberblocks）、备录块、事务组等。\n\n既然你已经了解了 ZFS\
    \ 的最基础知识，这本书的其余部分仅仅填充了数百个小细节。我们将从栈的最底部开始，从虚拟设备开始。\n\n[1] ZFS 并不消除备份的需求。唯一消除备份的是绝对的冷漠。\n\
    \n# 第 2 节：虚拟设备\n\n在本章中，我们将深入了解其制作过程。这……是一头猪——我是意思是磁盘。磁盘是存储的物理体现。磁盘是邪恶的。它们欺骗你的特性和布局，隐藏错误，并以意想不到的方式故障。\n\
    \n为了最有效地配合 ZFS 使用可用磁盘，你需要基本了解操作系统如何将磁盘呈现给 ZFS，以及 ZFS 如何在磁盘上安排数据。\n\n## 磁盘和其他存储介质\n\
    \nZFS 还可以运行在磁盘以外的存储介质上。任何 FreeBSD GEOM 存储提供者都可以成为 ZFS 存储介质。ZFS 甚至支持使用文件，这对于测试非常有用，但并非为生产设计。\n\
    \n### 原始磁盘存储\n\n使用整个物理磁盘可以降低复杂性。此外，不需要担心分区，也没有在 ZFS 和物理磁盘之间的软件或配置。但你无法从原始磁盘启动。\n\
    \n"
