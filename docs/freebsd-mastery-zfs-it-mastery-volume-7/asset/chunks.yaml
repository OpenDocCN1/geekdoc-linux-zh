    虚拟设备，或 `VDEV`，是 ZFS 的逻辑存储单元。每个 `VDEV` 都由一个或多个 `GEOM` 提供者组成。ZFS 支持几种不同类型的 `VDEV`，它们根据
    `VDEV` 提供的冗余类型进行区分。常见的镜像磁盘（每块磁盘包含另一块磁盘的副本）是 `VDEV` 的一种类型。没有冗余的普通磁盘是另一种 `VDEV`。此外，ZFS
    还包含了三种不同的复杂 RAID 类型，称为 `RAID-Z`。


    这些 `VDEVs` 被排列成第 3 节讨论的存储池。实际数据存储在存储池之上，正如第 4 节所述。但你虚拟设备的布局决定了池的性能以及抵抗物理损坏的能力。ZFS
    几乎所有的冗余都来自虚拟设备。


    一个存储池由一个或多个 `VDEVs` 组成，池数据分布在这些 `VDEVs` 之间，且没有冗余。（你可以如第 4 节所述，使用 `copies` 属性添加一些冗余，但这无法防止磁盘完全故障。）ZFS
    存储池将 `VDEVs` 视为提供空间的单个单元。存储池无法在 `VDEV` 丢失的情况下生存，因此你要么使用带有冗余的 `VDEVs`，要么提前决定丢失此池中的数据是可以接受的。


    在池中使用多个 `VDEVs` 可以创建类似于高级 RAID 阵列的系统。`RAID-Z2` 阵列类似于 `RAID-6`，但具有两个 `RAID-Z2`
    `VDEVs` 的 ZFS 池类似于 `RAID-60`。镜像 `VDEVs` 像 `RAID-1`，但它们的组类似于 `RAID-10`。在这两种情况下，ZFS
    将数据条带化在每个 `VDEV` 上，且没有冗余。单个 `VDEVs` 提供了冗余。


    ## VDEV 冗余


    包含多个磁盘的 `VDEV` 可以使用不同的冗余方案来提供容错能力。没有任何办法能让一个孤立的磁盘产生冗余。ZFS 支持使用镜像磁盘和几种基于校验的阵列。


    ZFS 使用冗余进行自愈。没有冗余的 `VDEV` 不支持自愈。你可以在数据集层（通过 `copies` 属性）绕过这一点，但冗余的 `VDEV` 支持自动自愈。


    ### 条带（1 个提供者）


    由单个磁盘组成的 `VDEV` 称为 `stripe`（条带），没有冗余。正如你预期的那样，丢失唯一的提供者意味着磁盘上的所有数据都丢失了。条带池只包含单磁盘
    `VDEVs`。


    ZFS 池将数据条带化到池中所有的 `VDEVs` 上，并依赖 `VDEV` 提供冗余。如果一个条带设备故障，整个池就会故障。存储在池中的所有数据都会丢失。这对于临时分区来说是可以的，但如果你在乎你的数据，请使用提供容错能力的
    `VDEV` 类型。


    ### 镜像（2+ 个提供者）


    镜像 `VDEV` 在每块磁盘上存储所有数据的完整副本。你可以丢失提供者中除一个以外的所有驱动器而仍然可以访问数据。你可以在镜像中使用任意数量的磁盘。


    镜像提供了极好的随机和顺序读取速度，因为数据可以同时从所有磁盘读取。写入性能会受到影响，因为所有数据必须写入所有磁盘，并且在最慢的磁盘完成之前操作不会完成。


    ### RAID-Z1（3+ 个提供者）


    ZFS 包含了三种现代 RAID 风格的冗余 `VDEV`，称为 `RAID-Z`。`RAID-Z` 类似于 `RAID-5`，但包含了校验以确保文件完整性。通过校验和
    ZFS 的写时复制功能（第 7 节），`RAID-Z` 确保不完整的写入不会导致文件系统损坏。


    `RAID-Z` 将数据和校验信息分布在所有磁盘上。如果 `RAID-Z` 中的某个提供者损坏或开始提供损坏数据，`RAID-Z` 将使用校验信息重新计算丢失的数据。你可能会听到
    `RAID-Z` 使用一个提供者来存储校验信息，但并没有单一的校验提供者——校验角色会在提供者之间轮换，分布数据。


    `RAID-Z1` `VDEV` 可以承受任何单个存储提供者的故障。如果在更换第一个故障驱动器之前第二个提供者也发生故障，所有数据都将丢失。从校验数据重建磁盘阵列可能需要很长时间。如果你正在使用大磁盘——例如超过
    2 TB——在修复第一块驱动器时，第二块驱动器故障的概率是不小的。对于更大的磁盘，你应该考虑 `RAID-Z2`。


    ### RAID-Z2（4+ 个提供者）


    `RAID-Z2` 类似于 `RAID-Z1`，但每个 `VDEV` 有两个校验磁盘。就像如 RAID-6` 一样，`RAID-Z2` 允许在两个提供者故障的情况下继续运行。它比
    `RAID-Z1` 慢一点，但允许你在更换驱动器时稍微随意。


    ### RAID-Z3（5+ 个提供者）


    最偏执的 `RAID-Z` 形式 `RAID-Z3` 每个 `VDEV` 使用三个校验磁盘。是的，你可以在你的五盘阵列中有三个故障的磁盘器。它比 `RAID-Z2`
    慢一点。第四块磁盘的故障会导致数据完全丢失。


    ### RAID-Z 磁盘配置


    在使用任何版本的 `RAID-Z` 时，需要记住的一个重要点是，`RAID-Z` 中的提供者数量是完全固定的。你不能通过向 `RAID-Z` `VDEV`
    添加驱动来扩展它们。你可以通过添加 `VDEVs` 来扩展池，但你不能通过添加磁盘来扩展 `VDEV`。目前没有添加此功能的计划。


    假设你有一个可以接受 20 块硬盘的主机。你安装了 12 块驱动并将它们用作单个 `RAID-Z2`，认为以后需要时会向池中添加更多驱动器。这些新驱动器将作为独立的
    `RAID-Z2` `VDEV` 加入。


    此外，你的 `VDEVs` 将是不平衡的。你的池将有一个 12 块磁盘的 `VDEV` 和第二个 8 块磁盘的 `VDEV`。其中一个会比另一个慢。ZFS
    允许你强制将这些设备组合在一起，但这样做是一个非常糟糕的主意。


    提前做好计划。查看你的物理设备、初始拥有的驱动器数量以及你将如何扩展该存储。我们的示例服务器使用一个包含单个 `RAID-Z2` `VDEV` 的池，以及另一个包含另外
    8 块磁盘的完全独立的池是没问题的。在开始之前不要自毁！


    ### RAID-Z 的二倍规则


    一种常讨论的配置是让数据磁盘的数量等于二的倍数，加上特定 `RAID-Z` 级校验磁盘。也就是说，该规则说 `RAID-Z1` 应该使用 `2n+1` 个磁盘，即三、五、七、九等。`RAID-Z2`
    应该使用 `2n+2` 个磁盘（四、六、八等），而 `RAID-Z3` 应该使用 `2n+3`（五、七、九等）。


    这个规则是有效的——仅当你的数据是由大小为 2 的幂的小块组成时。尽管其他因素的影响更大。压缩通常有效得多。压缩你的数据会缩小块的大小，从而消除了这种优势。


    ### 修复 VDEV


    当属于冗余 `VDEV` 的提供者故障时，它变为“降级”。第 5 节涵盖更换故障提供者。


    更换提供者后，系统必须在新提供者上存储数据。镜像使得这变得简单：从剩余磁盘读取数据并写入替换磁盘。对于 `RAID-Z`，必须从校验中重新计算数据。


