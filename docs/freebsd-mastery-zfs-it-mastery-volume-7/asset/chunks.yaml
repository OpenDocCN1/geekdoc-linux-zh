    Worse, any replacement disks must be exactly the same size as the original disk,
    or larger. Not all `6 TB` disks are the same size—disks from different vendors
    vary by a few megabytes. You don’t care about these variances when setting up
    a system, but they’re critical when replacing a disk. Most catalogs don’t list
    the number of sectors in each disk, only the size, so finding a usable replacement
    can take several attempts. Replacing a drive that uses the traditional `512-byte`
    sectors with one that uses `4096-byte` (`4K`, also known as Advanced Format) sectors
    complicates things further. The original drive probably had a number of sectors
    not evenly divisible by `8`. Thanks to the special math used by disk drives, the
    new drive might appear to be just a couple bytes smaller than the old drive even
    if it’s a couple bytes larger.


    ### Partition Storage


    Instead of using an entire raw disk, you can partition a disk and then use one
    of the partitions for `ZFS`. The biggest advantage to this is that you can now
    boot from the disk that contains the `ZFS` partition, by creating a small boot
    partition, instead of requiring a separate boot device. Using partitions also
    allows you to use part of the disk space for other things, like a raw swap partition,
    another filesystem, or just leaving some wiggle room at the end of the disk so
    the replacement disk doesn’t have to have a matching sector count. Partitioning
    also allows you to “short stroke” the drive to increase performance.


    Many of the original `Solaris ZFS` administration guides recommend against using
    partitions (or, in Solaris terms, `slices`) for performance reasons. In `Solaris`,
    using a partition for a filesystem disables the write cache. In `FreeBSD`, disabling
    the write cache is completely separate from disk partitioning or filesystems.
    `FreeBSD` gives full performance when using `ZFS` on a partition.


    `FreeBSD` supports a number of partitioning schemes, but `GPT` is strongly recommended.
    The older partitioning system, `MBR`, limited the number of primary partitions
    to four, while `GPT` supports up to `128` partitions. `MBR` can manage disks up
    to only `2 TB`, while `GPT` can manage up to `8 ZB` with `512 byte-sector` disks
    and up to `64 ZB` with `4 K-sector` disks. *FreeBSD Mastery: Storage Essentials*
    covers `FreeBSD`’s support for both partitioning methods.[1](#part0006.xhtml_ref_footnotebookmark_end_29_1)


    The disadvantage to using partitions is that you might lose some of the portability
    that `ZFS` provides. If you move disks from one system to another, the target
    system must be able to recognize the disk partitions.


    ### GEOM Device Storage


    `ZFS` can also use the various `FreeBSD GEOM` classes as its backing storage.
    These sit between the filesystem and the physical devices, and perform various
    functions. The `GEOM` classes provide features such as whole disk encryption (`GELI`,
    `GBDE`), high availability, labels, multipath, and pluggable schedulers. A `GEOM`
    class can be created based on an entire device, or on-top of another `GEOM` class,
    such as a partition, multipath device, or encrypted disk.


    `GELI` (the `FreeBSD` disk encryption subsystem) is the best way to achieve an
    encrypted `ZFS` pool. `GELI` encrypts and decrypts blocks as they are passed back
    and forth between `ZFS` and the physical disks, so it doesn’t require `ZFS` to
    do anything different. `GELI` supports a number of different encryption algorithms,
    but the default `AES-XTS` offers the best performance, especially with a modern
    CPU that supports the `AES New Instructions` (`AES‑NI`). With the help of this
    hardware offload feature, `GELI` can encrypt data at over `1 GB/sec` and decrypt
    even faster, meaning that adding encryption will not lower your performance, even
    on an `SSD`. `GELI` can also optionally provide data authentication (integrity
    verification), where it stores a `Hashed Message Authentication Code` (`HMAC`)
    with each sector. It uses this `HMAC` to verify the integrity (the data has not
    been tampered with), and authenticity (this data was written by you) of the data.
    If upon reading back the sector, the `HMAC` does not verify the data, an error
    is returned. The `HMAC` feature is not enabled by default, and is probably overkill
    for `ZFS` because `ZFS` provides its own checksumming on each data block.


    High Availability Storage Technology (`HAST`) is `FreeBSD`’s distributed storage
    solution. It allows you to mirror a block device between computers over the network.
    Using `HAST` as the backing storage for a `ZFS` pool allows you to mirror each
    backing disk to a second machine. The advantage to `HAST` is that it is real time;
    a block is not considered to be written until it has been written to all hosts
    in the `HAST` cluster. `ZFS` replication, on the other hand, is based on syncing
    periodic snapshots. However, with `HAST` the second machine cannot have the pool
    imported or mounted at the same time as the first machine. Compared to `ZFS` replication,
    where you can have the replicated pool active (but read-only) concurrently, `HAST`
    makes sense in only a few cases.


    `GEOM` labels provide a handy way to attach a meaningful note to each disk or
    partition. There are many label types, including standards like `disk ident`,
    `gptid`, `GPT labels`, and the `GEOM`-specific `gabel`. Best practices for labeling
    drives appear in Chapter 0.


    `GEOM` also supports multipath for high availability. Sometimes it is not just
    the disk that dies, but also the controller card, the backplane, or the cable.
    With multipath, enterprise drives that are “dual ported” can be connected to more
    than one `HBA` (a disk controller card without any RAID features). If each drive
    has a path to two different storage controllers, it can survive the loss of one
    of those controllers. However, when each disk is connected to two different controllers,
    the operating system sees each disk twice, once via each controller. The `GEOM`
    multipath class allows you to write a label to each disk, so that successive routes
    to the same disk are detected as such. This way you get one representation of
    each disk, backed by multiple paths. We discuss multipath in *FreeBSD Mastery:
    Advanced ZFS*.


    The `GEOM` scheduler module allows the administrator to specify different I/O
    scheduling algorithms in an attempt to achieve better performance. As of this
    writing, the currently available schedulers are `as`, a simple form of anticipatory
    scheduling with only one queue, and `rr`, anticipatory scheduling with round-robin
    service across each client queue. See `gsched(8)` for more details. The `GEOM`
    system makes it relatively easy to write additional scheduling modules for specific
    workloads.


    ### File-Backed Storage


    You can use a file-backed virtual disk as a `ZFS` storage device. While we certainly
    don’t recommend this for production, file-backed disks can be useful for testing
    and experimenting.


    ### Providers vs. Disks


    “Provider” is a technical term in `FreeBSD`. A `GEOM` storage provider is a thing
    that offers data storage. It might be a disk. It might be a `GEOM` class that
    transforms the storage in some way. Technically speaking, this book should use
    the word provider instead of disk everywhere. You can use any `GEOM` provider
    as a back end for `ZFS`. The problem with this is, one physical disk can offer
    several different providers. Your pool might have several different providers,
    but if they’re all on one disk, you’ve just shot your redundancy in the head.[2](#part0006.xhtml_ref_footnotebookmark_end_29_2)


    Where this book discusses “disks,” we mean “some sort of provider on top of a
    disk.” This disk doesn’t have to be wholly dedicated to `ZFS`—you could have a
    swap partition and a `ZFS` partition on a disk and be perfectly fine. But you
    can’t have two `ZFS` partitions on a single physical disk, mirror them, and have
    physical redundancy.

