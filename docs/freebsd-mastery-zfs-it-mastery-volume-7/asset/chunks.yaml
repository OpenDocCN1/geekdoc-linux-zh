    throughput for data, whereas RAID-Z1 loses one disk’s worth of throughput because
    of the parity data. A three-disk mirror also writes half as many MB/s because
    it writes the same data to every disk, whereas RAID-Z1 can spread the writes out
    over all the disks but loses some throughput to parity.


    ### Four or Five Disks


    With four or five disks, you get even more options.


    Multiple mirror VDEVs (similar to traditional RAID 10) provide the best possible
    performance for random I/O workloads like databases. When you divide four disks
    into two mirror VDEVs of two disks each, ZFS stripes the writes across both mirrors.
    One mirror holds half of your data, and the other mirror the other half. This
    helps mitigate the write bottleneck of mirrors, while still providing the impressive
    read performance.


    With four disks, RAID-Z2 becomes an option. RAID-Z2’s two parity disks mean that
    the VDEV can continue to operate with the loss of any two disks. When compared
    to a mirror with the same number of disks, the performance is worse; however,
    it no longer matters which two disks fail concurrently.


    At five disks, we can deploy RAID-Z3\. A RAID-Z3 VDEV can survive the loss of
    any three disks. A RAID-Z3 exchanges performance for fault tolerance.


    And RAID-Z1 remains an option, of course.


    Table 4: Four- or Five-Disk Virtual Device Configurations


    | Disks | Config | Read IOPS | Write IOPS | Read MB/s | Write MB/s | Usable Space
    | Fault Tolerance |


    | 4 | 2 x 2 disk Mirror | 1000 | 500 | 400 | 200 | 2 TB (50%) | 2 (1/VDEV) |


    | 4 | 1 x 4 disk RAID-Z1 | 250 | 250 | 300 | 300 | 3 TB (75%) | 1 |


    | 4 | 1 x 4 disk RAID-Z2 | 250 | 250 | 200 | 200 | 2 TB (50%) | 2 |


    | 5 | 1 x 5 disk RAID-Z1 | 250 | 250 | 400 | 400 | 4 TB (80%) | 1 |


    | 5 | 1 x 5 disk RAID-Z2 | 250 | 250 | 300 | 300 | 3 TB (60%) | 2 |


    | 5 | 1 x 5 disk RAID-Z3 | 250 | 250 | 200 | 200 | 2 TB (40%) | 3 |


    Note how the streaming (MB/s) read and write performance of RAID-Z1 compares with
    RAID-Z2, and how the performance of RAID-Z3 compares to both. Adding a parity
    disk means sacrificing that disk’s throughput.


    The fault tolerance of multiple mirror VDEVs is slightly tricky. Remember, redundancy
    is per-VDEV, not per pool. Each mirror VDEV still provides n - 1 fault tolerance.
    As long as one drive in each mirror VDEV still works, all data is accessible.
    With two two-disk mirror VDEVs in your pool, you can lose one disk from each VDEV
    and keep running. If you lose two disks from the same VDEV, however, the pool
    dies and all data is lost.


    ### Six to Twelve Disks


    With large numbers of disks, the decision shifts to balancing fault tolerance,
    space efficiency, and performance.


    Six disks could become three two-disk mirror VDEVs, giving you a fair amount of
    space and good write performance. You could opt for a pair of three-disk mirror
    VDEVs, giving you less space, but allowing two disks out of each set of three
    to fail without risking data loss. Or they could become a RAID-Z VDEV.


    Get many more than six disks and you can have multiple RAID-Z VDEVs in a pool.
    A dozen disks can be operated together as a single VDEV giving the most available
    space, or can be split into two separate VDEVs, providing less usable space but
    better performance and more fault tolerance.


    Table 5: Six- to Twelve-Disk Virtual Device Configurations


    | Disks | Config | Read IOPS | Write IOPS | Read MB/s | Write MB/s | Usable Space
    | Fault Tolerance |


    | 6 | 3 x 2 disk Mirror | 1500 | 750 | 600 | 300 | 3 TB (50%) | 3 (1/VDEV) |


    | 6 | 2 x 3 disk Mirror | 1500 | 500 | 600 | 200 | 2 TB (33%) | 4 (2/VDEV) |


