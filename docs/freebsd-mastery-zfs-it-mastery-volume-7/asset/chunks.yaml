    为什么你想要使用 `refquota`（引用配额）而不是 `quota`（配额）？假设每个用户的家目录都是自己的数据集，并且用户无法创建快照。大多数人无法创建，而大多数能够创建的人并不知道如何操作。如果你像我们在第
    7 章中演示的那样自动创建快照，那么快照占用的空间将计入用户的账户费用。磁盘空间用尽的用户可能会删除一些文件，但发现自己并没有释放任何空间。对用户收取他们无法控制的磁盘空间费用可能是不公平的。


    ### 设置配额


    要在数据集上配置配额，请分配 `quota` 和/或 `refquota` 属性。


    在“预留（Reservations）”部分中，我们为 `zroot/var/log` 数据集中的系统日志预留了 20 GB，确保日志始终至少有 20 GB
    的空间。更常见的问题是日志运行失控并吸收所有可用磁盘空间，导致系统崩溃。你的监控系统应该捕获到这个错误，但在日志数据集上建立配额也是有意义的，这样某人在 `/etc/syslog.conf`
    中取消注释 `/var/log/all.log` 时就不会在一天后导致机器崩溃。


    这里我们为 `zroot/var/log` 设置了配额。


    ```

    # zfs set quota=100G zroot/var/log

    ```


    日志文件使用的空间不能超过 100 GB，包括快照、子数据集和其他所有内容。


    你可以使用 `refquota` 单独限制引用数据量。这会排除了子数据集和快照。同时限制整个数据集的大小和数据集的引用数据可以帮助你控制快照的大小。例如，设置
    `refquota` 为 10 GB 而 `quota` 为 100 GB，这会告诉你，即使数据完全变化，你也可以始终拥有 10 个快照。同样，如果你想排除子数据集，请使用
    `refquota`。


    ```

    # zfs set refquota=50G zroot/var/log

    # zfs set refquota=50G zroot/var/log/db

    # zfs set quota=500G zroot/var/log

    ```


    在这里，我们为两个日志数据集分别设置了 `refquotas`，并为这两个数据集共同设置了一个 `quota`。如果每个数据集本身可以引用最多 50 GB，那么
    500 GB 的 `quota` 意味着无论数据如何变化，你都可以每个每个保留至少四个快照。


    ### 查看配额


    要查看数据集上的配额，请检查 `quota` 和 `refquota` 属性。


    ```

    # zfs get all zroot/home | grep quota

    zroot/home  quota     none  default

    zroot/home  refquota  none  default

    ```


    `/home` 目录没有配额。用户可能会将你的硬盘填到极限。


    配额会改变数据集的最大大小和数据集中的空闲空间。此池有数百 GB 的可用空间，但在此数据集上运行 `zfs list` 显示的结果并非如此。


    ```

    # zfs list zroot/var/log

    NAME            USED  AVAIL  REFER  MOUNTPOINT

    zroot/var/log  25.0G  75.0G  5.01G  /var/log

    ```


    `zroot/var/log` 数据集有 25 GB 数据，剩余 75 GB 空间。ZFS 知道该数据集有 100 GB 的 `quota`，并相应地显示利用率。你刚刚通过设置
    `quota` 模拟了一个传统的分区——但不要运行 `df`！首先，查看子数据集 `zroot/log`。


    ```

    # zfs list zroot/log/db

    NAME               USED  AVAIL  REFER  MOUNTPOINT

    zroot/log/db  20G  85G  5G  /db

    ```


    ZFS 知道父数据集有一个 100 GB 的 `quota`，因此在子数据集上设置了该最大值。如果 `zroot/log` 有 75 GB 可用空间，而 `zroot/log/db`
    有 85 GB 可用空间，这是否意味着这两个分区有 160 GB 的空闲空间？不，因为就像池中的空间一样，由于这两个条目引用的是同一个空间。`zroot/log/db`
    条目似乎有更多空闲空间，是因为其父数据集中的数据没有反映在子集中。


    ### 超过配额


    如果用户或进程尝试写入会导致数据集超过其 `quota` 的内容，它将收到配额错误。


    ```

    # cp script.sh test.sh

    cp: test.sh: Disc quota exceeded

    ```


    你需要释放一些空间，但记住正如前面“释放空间”中讨论过的，快照可能会使其变得复杂。如果你同时设置了 `quota` 和 `refquota`，用户可能可以删除文件并释放空间，尽管这会增加系统快照的大小。


    ### 用户和组配额


    用户和组配额控制用户或组可以向数据集写入多少数据。像数据集配额一样，用户和组配额是按数据集控制的。用户和组配额不适用于子文件系统、快照和克隆。你必须对想要影响的每个单独数据集应用配额。


    ### 查看每个数据集的已空间和现有配额


    `zfs userspace` 命令允许你查看数据集中每个用户占用的空间。在这里我们检查 `zroot/home` 数据集。具有复杂数据集的系统可能需要几分钟时间。


    ```

    # zfs userspace zroot/home

    ```

    （注：此处原文示例未提供完整输出翻译，但根据逻辑此处应为展示用户空间情况）

    [/content]

