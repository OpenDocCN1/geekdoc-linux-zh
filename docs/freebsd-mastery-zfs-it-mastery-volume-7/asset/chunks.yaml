  trans: '

    将 `volmode` 设置为 `none` 意味着该卷不会暴露在 ZFS 之外。然而，这些卷仍然可以进行快照、克隆和复制。这些卷适用于备份目的。


    将 `volmode` 设置为 `default` 意味着卷的暴露情况由 `sysctl` 参数 `vfs.zfs.vol.mode` 控制。你可以在系统范围内设置默认的
    `zvol` 模式。值 `1` 表示默认为 `geom`，`2` 表示 `dev`，`3` 表示 `none`。


    虽然你可以在正在运行的卷上更改该属性，但它不会产生任何效果。该属性仅在创建卷和导入存储池时被处理。你可以通过 `zfs rename` 重命名卷来重新创建
    `zvol` 设备。


    # 数据集完整性


    ZFS 的大多数保护措施工作在 VDEV（虚拟设备）层。毕竟，数据块和磁盘出现故障就是在那里。然而，某些硬件限制了池的冗余。极少有笔记本电脑拥有足够的硬盘来使用镜像（mirroring），更不用说
    RAID-Z 了。不过，你可以在数据集层通过使用校验和、元数据冗余和副本来提供一些冗余。大多数用户永远不应该碰前两项，而具有冗余虚拟设备的用户可能希望这三项都保持不变。


    ### 校验和 (Checksums)


    ZFS 为其写入的每一个块计算并存储校验和。这确保了在回读数据块时，ZFS 可以验证它与写入时是否相同，并且没有以某种方式发生静默损坏。`checksum`
    属性控制数据集使用的校验和算法。有效的设置为 `on`、`fletcher2`、`fletcher4`、`sha256`、`off` 和 `noparity`。


    默认值 `on` 使用 OpenZFS 开发者选择的算法。在 2015 年，该算法是 `fletcher4`，它在未来的版本中可能会更改。


    标准算法 `fletcher4` 是默认的校验和算法。它对于大多数用途来说已经足够，而且速度非常快。如果你想永远使用 `fletcher4`，可以将此属性设置为
    `fletcher4`。然而，我们建议保持默认的 `on`，并在合适的时候让 ZFS 升级你存储池的校验和算法。


    值 `off` 禁用了用户数据的完整性检查。


    值 `noparity` 不仅禁用了完整性检查，还禁用了用户数据的校验位维护。该设置供位于 RAID-Z 池上的 `dump` 设备内部使用，不应供任何数据集使用。不建议禁用校验和。


    旧版本的 ZFS 使用 `fletcher2` 算法。虽然它支持旧的存储池，但显然不再被推荐。


    `sha256` 算法比 `fletcher4` 慢，但发生冲突的概率较低。在大多数情况下，冲突无害的。在使用去重（deduplication）时，经常推荐
    `sha256` 算法。


    ### 副本 (Copies)


    ZFS 为重要的元数据存储两个或三个副本，并对你重要的用户数据采取同样的处理。`copies` 属性告诉 ZFS 保留多少份用户数据副本。ZFS 尝试将这些副本放在不同的磁盘上，如果失败，则尽可能在物理磁盘上间隔得远，以帮助防止硬件故障。当你增加
    `copies` 属性时，ZFS 也会增加该数据集元数据的副本数量，最多为三个。


    如果你的存储池运行在两个镜像磁盘上，并且你将 `copies` 设置为 `3`，你将拥有六份数据副本。其中一份应该在你对原始提供设备设备进行不明智的 `dd(1)`
    操作或让它从房顶上掉下去时幸存下来。


    增加或减少 `copies` 只影响在更改设置后写入的数据。将 `copies` 从 `1` 更改为 `2` 并会像我们在这里看到的那样突然为你的所有数据创建重复副本。创建一个
    10 MB 的随机数据文件：


    ```

    # dd if=/dev/random of=/lamb/random1 bs=1m count=10

    10+0 records in

    10+0 records out

    10485760 bytes transferred in 0.144787 secs (72421935 bytes/sec)

    # zfs set copies=2 mypool/lamb

    ```


    现在每个块都存储了两次。如果其中一个副本损坏了，ZFS 仍然可以读取你的文件。它知道哪个块是损坏的，因为它的校验和不匹配。但看看存储池的空间使用情况（池列表中的
    `REFER` 空间）。


    ```

    # zfs list mypool/lamb

    NAME          USED  AVAIL  REFER  MOUNTPOINT

    mypool/lamb  10.2M  13.7G  10.1M  /lamb

    ```


    只使用了我们写入的 10 MB 数据。该文件没有创建额外的副本，因为你是在更改 `copies` 属性之前写入该文件的。


    然而，当 `copies` 设置为 `2` 时，如果我们写入另一个文件或覆盖原始文件，我们将看到不同的磁盘使用情况。


    ```

    # dd if=/dev/random of=/lamb/random2 bs=1m count=10

    10+0 records in

    10+0 records out

    10485760 bytes transferred in 0.141795 secs (73950181 bytes/sec)

    ```


    现在看看磁盘使用情况。


    ```

    # zfs list mypool/lamb

    NAME         USED  AVAIL  REFER  MOUNTPOINT

    mypool/lamb  30.2M  13.7G  30.1M  /lamb

    ```


