    \   ONLINE   0     0     0\n  gpt/zfs1   ONLINE   0     0     0\n mirror-1   \
    \ ONLINE   0     0     0\n  gpt/zfs2   ONLINE   0     0     0\n  gpt/zfs3   ONLINE\
    \   0     0     0\n logs\n mirror-2    ONLINE   0     0     0\n  gpt/zlog0  ONLINE\
    \   0     0     0\n  gpt/zlog1  ONLINE   0     0     0\n```\n\nThe log device\
    \ is called mirror-2\\. Remove it as you would a standalone device.\n\n```\n#\
    \ zpool remove db mirror-2\n```\n\nThe pool clears the log and removes the device\
    \ from the pool.\n\n### Replacing Failed Log and Cache Devices\n\nReplace a failed\
    \ log or cache device, even a mirror member, exactly as you would any other failed\
