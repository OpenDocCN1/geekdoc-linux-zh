- fmt: '

    If you want to complete your install with the FreeBSD installer, you must give
    the installer a recognizable system. That means following steps from the reference
    install, even if you’re not sure why a pool is exported and imported at the end
    of the dataset creation step. In sum, we recommend adding your own datasets, but
    leaving the defaults unchanged.


    Here are a few bits from `zpool` history on a reference FreeBSD host, omitting
    the timestamps.


    ```

    zfs create -o mountpoint=none zroot/ROOT

    zfs create -o mountpoint=/ zroot/ROOT/default

    zfs create -o mountpoint=/tmp -o exec=on -o setuid=off zroot/tmp

    zfs create -o mountpoint=/usr -o canmount=off zroot/usr

    zfs create zroot/usr/home

    zfs create -o setuid=off zroot/usr/ports

    zfs create zroot/usr/src

    zfs create -o mountpoint=/var -o canmount=off zroot/var

    zfs create -o exec=off -o setuid=off zroot/var/crash

    zfs create -o exec=off -o setuid=off zroot/var/log

    zfs create -o atime=on zroot/var/mail

    zfs create -o setuid=off zroot/var/tmp

    zpool set bootfs=zroot/ROOT/default zroot

    zpool set cachefile=/mnt/boot/zfs/zpool.cache zroot

    ```


    You can easily add or change your own datasets to this, creating `zroot/var/mysql`
    or moving `/home` out from under `/usr` or whatever it is you desire.


    Creating datasets is a lot of typing. We recommend creating installation scripts,
    as discussed in *FreeBSD Mastery: Storage Essentials*.


    Once you have your datasets, exit the command-line partitioning and the installer
    will resume.


    ### Post-Install Setup


    Once the installer finishes copying files to your disks, setting up networking,
    and so on, you’ll get a chance to go into the installed system and make changes.
    Take that chance. You must change a few settings in the finished system.


    Make sure that `ZFS` is started in `/etc/rc.conf`. This mounts your filesystem
    datasets at boot.


    ```

    zfs_enable=yes

    ```


    Edit `/boot/loader.conf` to tell FreeBSD to load `ZFS` and related kernel modules
    at boot.


    ```

    zfs_load="YES"

    ```


    You can also make any other system changes you like here.


    While some documentation refers to other required steps, such as copying the pool
    cache file, that’s no longer necessary.


    Reboot when you’re finished, and you’ll come up in a new, customized FreeBSD install!


    ### Manually Installing FreeBSD


    If you have to go to a command line to partition your disks, you might as well
    install the FreeBSD files to the disk yourself. The FreeBSD distribution files
    are in `/usr/freebsd-dist`, and you write them to your disk with `tar(1)`. Your
    installation target is mounted in `/mnt`.


    ```

    # tar --unlink -xpJf base.txz -C /mnt

    # tar --unlink -xpJf kernel.txz -C /mnt

    ```


    You can install other distribution sets, but the base and kernel are the only
    critical ones.


    Your installation needs an `/etc/fstab`, for the swap files if nothing else. Create
    it in `/mnt/etc/fstab`. You can also edit critical system files like `/mnt/etc/rc.conf`
    and `/mnt/boot/loader.conf`.


    With a bit of work and testing, you can make your ZFS install as simple or as
    complex as you like.


    Exactly like you can `ZFS`.


    ### Afterword


    A whole book on a filesystem? Are you mad?


    `ZFS` is merely a filesystem, yes. But it includes features that many filesystems
    can’t even contemplate. You’d never try to wedge self-healing into `extfs`, or
    variable block size into `UFS2`. Copy on write must be built into the filesystem
    core—you can’t retrofit that into an existing filesystem.


    By building on decades of experience with filesystems and targeting modern and
    future hardware, `ZFS` has not only changed the way we manage digital storage.
    It’s changed how we think about storage. `ZFS`’s flexibility and power has even
    rendered many long-hallowed “system administration best practices” obsolete. When
    your filesystem is an ally rather than a menace, everything gets amazingly easier.


    The continued growth of `OpenZFS` brings new features, steady improvement, and
    a certain future that commercial vendors cannot provide. `OpenZFS` gets more exciting
    every week, with new features and greater performance. It also gets less exciting,
    in that it protects your data more and more with each release. We are fortunate
    enough to be a part of this great project, and are glad for this chance to share
    some of our excitement with you.


    While Lucas used `ZFS` before writing this book, Jude uses lots of `ZFS` to deliver
    lots of content everywhere in the world. Jude is a `FreeBSD` doc committer, but
    Lucas has written big stacks of books. Together, we’ve created a stronger book
    than either of us could have alone.


    And stay tuned for more `ZFS` from us. In *FreeBSD Mastery: Advanced ZFS*, we’ll
    take you into strange new filesystem realms unimaginable just a few years ago.


    ### About the Authors


    Allan Jude is VP of operations at ScaleEngine Inc., a global Video Streaming CDN,
    where he makes extensive use of `ZFS` on `FreeBSD`. He is also the host of the
    weekly video podcasts `BSD Now` (with `Kris Moore`) and `TechSNAP` on `JupiterBroadcasting.com`.
    Allan is a `FreeBSD` committer, focused on improving the documentation and implementing
    `libucl` and `libxo` throughout the base system. He taught `FreeBSD` and `NetBSD`
    at Mohawk College in Hamilton, Canada from 2007-2010 and has 13 years of `BSD`
    unix sysadmin experience.


    Michael W Lucas is a full time author. His `FreeBSD` experience is almost as old
    as `FreeBSD`. He worked for twenty years as a sysadmin and network engineer at
    a variety of firms, most of which no longer exist. He’s written a whole stack
    of technology books, which have been translated into nine languages. (Yes, real
    languages. Ones that people actually speak.) You can find him lurking at various
    user groups around Detroit, Michigan, his dojo (http://zenmartialarts.com), or
    at https://www.michaelwlucas.com.


    Find the authors on Twitter as @allanjude and @mwlauthor.


    ### Never miss a new release!


    Sign up for Michael W Lucas’ mailing list.


    https://www.michaelwlucas.com/mailing-lists


    blogs http://blather.michaelwlucas.com


    Twitter: @mwlauthor


