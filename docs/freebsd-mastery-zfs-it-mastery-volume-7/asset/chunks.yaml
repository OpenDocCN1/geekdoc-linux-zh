  trans: "\n要添加镜像日志设备，请使用 `mirror` 关键字和提供者（providers）。镜像 ZIL（写入日志）可以为写入提供冗余，有助于确保写入磁盘的数据在硬件故障后依然存存。在这里我们将设备\
    \ `gpt/zlog0` 和 `gpt/zlog1` 进行镜像，并告诉池 `db` 使用该镜像作为日志设备。\n\n```\n# zpool add db\
    \ log mirror gpt/zlog0 gpt/zlog1\n```\n\n通常情况下，镜像缓存设备并不是快速磁盘的良好用例。ZFS 处理缓存设备的故障的能力相当不错。将缓存跨设备分布在多个设备上可以减少单个设备的负载，从而降低失败概率。\n\
    \n### 移除日志和缓存设备\n\n当您从 ZFS 存储池中移除日志或缓存设备时，ZFS 会停止向日志写入新数据，清空日志中的数据缓冲区，并释放该设备。\n\
    \n要移除独立的日志或缓存设备，请使用 `zpool remove`、池名称和设备名称。我们之前将设备 `gpt/zlog0` 作为池 `db` 的日志设备添加。让我们将其移除。\n\
    \n```\n# zpool remove db gpt/zlog0\n```\n\n移除镜像日志设备稍微复杂一些。您必须在移除它之前知道镜像的名称。查看池状态。\n\
    \n```\n# zpool status db\n...\nNAME         STATE READ WRITE CKSUM\ndb       \
    \    ONLINE   0     0     0\n mirror-0    ONLINE   0     0     0\n  gpt/zfs0 \
    \  ONLINE   0     0     0\n  gpt/zfs1   ONLINE   0     0     0\n mirror-1    ONLINE\
    \   0     0     0\n  gpt/zfs2   ONLINE   0     0     0\n  gpt/zfs3   ONLINE  \
    \ 0     0     0\n logs\n mirror-2    ONLINE   0     0     0\n  gpt/zlog0  ONLINE\
    \   0     0     0\n  gpt/zlog1  ONLINE   0     0     0\n```\n\n日志设备名为 `mirror-2`。像处理独立设备一样移除它。\n\
    \n```\n# zpool remove db mirror-2\n```\n\n池会清理日志并从池中移除该设备。\n\n### 替换故障的日志和缓存设备\n\
    \n替换故障的日志或缓存设备（即使是镜像成员），其方法与替换任何其他故障设备完全相同。在这里我们将设备 `gpt/zlog0` 替换为 `gpt/zlog2`。\n\
    \n```\n# zpool replace db gpt/zlog0 gpt/zlog2\n```\n\n日志设备将进行重构（resilver）并继续运行。\n\
    \n## 导出和导入驱动\n\n您可以在机器之间移动 ZFS 文件系统驱动，即使是运行不同操作系统的机器。您也不限于类似的架构——ZFS 甚至允许您在不同的字节序硬件之间移动磁盘！这为例如\
    \ Sparc OpenSolaris 和 FreeBSD 之间提供了一种便捷的迁移路径。ZFS 使用它自身的磁盘上元数据来跟踪池中每个提供者的角色，因此您不需要跟踪驱动顺序、设备节点或任何常见的磁盘问题。拔下驱动器，装进袋里，开车过城，然后重新插上。将池恢复在线的过程被称为“导入（importing）”。\n\
    \n然而，ZFS 可以在磁盘以外的存储提供者上运行。假设如我们建议的那样，您在 ZFS 磁盘上使用了 GPT 分区。那么您可能会决定将这些磁盘从 FreeBSD\
    \ 主机移动到另一个操作系统或另一个硬件架构。如果新的操作系统或硬件不识别 GPT 分区，新主机将无法找到池来导入它们！\n\n但在导入池 之前，您必须先导出它。\n\
    \n### 导出池\n\n导出大致等同于干净地卸载传统文件系统。ZFS 将提供者标记为非活动并完成所有待挂的事务。如果您有 ZFS 意图日志（第 2 章），日志将被清除。所有内容都会写入提供者，文件系统被卸载，并通知系统这些提供者现在可以被重用。\n\
    \n使用 `zpool export` 和池名称来导出池。在这里，我们导出池 `db`。\n\n```\n# zpool export db\n```\n\n\
    此命令应该静默运行。运行 `zpool list` 验证该池已不在系统中。\n\n系统将拒绝导出活动的文件系统。停止任何写入该数据集的守护进程，并将您的 shell\
    \ 工作目录切换离开该数据集。停止对文件的跟踪（tailing）。您可以使用 `fstat(1)` 或 `lsof(8)` 来识别使用该数据集文件系统的进程。\n\
    \n### 导入池\n\n要查看连接到系统的非活动池，请运行 `zpool import`。这实际上不会导入任何池，而仅显示哪些池可以导入。\n\n```\n\
    # zpool import\n   pool: db\n id: 8407636206040904802\n  state: ONLINE\n action:\
    \ 该池可以使用其名称或数字标识符导入。\n config:\n\ndb          ONLINE\n raidz1-0   ONLINE\n  gpt/zfs1\
    \  ONLINE\n  gpt/zfs2  ONLINE\n  gpt/zfs3  ONLINE\n  gpt/zfs4  ONLINE\n```\n\n\
    这显示池 `db`（也通过长数字标识符识别）可以被导入。您在底部看到的池配置与查看活动池时看到的完全一样。\n\n状态 `ONLINE` 并不意味着池是活跃的，而是意味着所有提供者都已准备就绪。对于\
    \ ZFS 来说，这个池已准备就绪。\n\n使用 `zpool import` 和池名称或数字 ID 导入池。\n\n```\n# zpool import\
    \ db\n```\n\n如果有多个同名的池，通过 ID 导入池。\n\n### 重命名导入的池\n\n我们会在机器之间重用名称。当您需要一个特定的名称时，ZFS\
    \ 允许您永久重命名。这对于移动磁盘非常有用。在这里我们将池 `db` 导入为 `olddb`。\n\n```\n# zpool import db olddb\n\
    ```\n\n导入的数据集可以在 `olddb` 下。这些重命名是永久的。\n\n要在常规挂载点之外临时挂载池，请使用 `-R` 标志。\n\n```\n\
    # zpool import -R /dunno\n```\n\n这将为所有数据集临时添加路径 `/dunno`。导出池会移除额外路径。\n\n### 不完整的池\n\
    \n如果缺少足够的成员来提供所有数据，则无法导入池。就像缺少两个磁盘无法使用 RAIDZ1 一样，如果缺失多个磁盘就无法导入 RAIDZ1。\n\n```\n\
    # zpool import\n   pool: db\n id: 8407636206040904802\n  state: UNAVAIL\n status:\
    \ 系统缺少一个或多个设备。\n action: 无法导入池。请缺失设备并重试。\n   see: http://illumos.org/msg/ZFS-8000-3C\n\
    \ config:\n\ndb                     UNAVAIL  insufficient replicas\n RAIDz1-0\
    \             UNAVAIL  insufficient replicas\n  gpt/zfs1             ONLINE\n\
    \  4300284214136283306  UNAVAIL  cannot open\n  gpt/zfs3             ONLINE\n\
    \  3061272315720693424  UNAVAIL  cannot open\n```\n\n这是一个四个提供者的 RAIDZ1，但缺少两个提供者。检查重新安装的磁盘是否已正确连接并重试。\n\
    \n### 特殊导入\n\n池导入对于从损坏的系统中恢复非常有帮助。ZFS 允许在导入池时绕过许多错误和问题。本节将介绍一些特殊的导入情况。\n\n销毁池实际上不会破坏任何数据。它将池标记为已销毁，但池及其所有元数据留在硬盘上，直到被覆盖。要告诉\
    \ ZFS 搜索已销毁但可导入的池，请添加 `-D` 标志。\n\n```\n# zpool import -D\n```\n"
- fmt: "\nThe pool’s status will show up as `ONLINE` (DESTROYED). The `ONLINE` means\
    \ that the pool has everything it needs to function. Use the `-D` flag and the\
    \ pool name or ID number to resurrect it.\n\n```\n# zpool import -D 8407636206040904802\n\
    ```\n\nIf a pool is missing too many storage providers, you cannot import it.\
    \ You cannot `zpool online` detached drives. Check the drive trays and make sure\
    \ the drives you want to import are attached and powered on. The next time you\
    \ run `zpool import`, reconnected drives will show up.\n\nIf a pool is missing\
    \ its log device, add the `-m` flag to import it without that device. An exported\
    \ pool should have everything on the storage providers.\n\n```\n# zpool import\
    \ -m db\n```\n\nYou can set pool properties when you import, by using the `-o`\
    \ flag. Here we import and rename a database pool, and also make it read-only.\n\
    \n```\n# zpool import -o readonly=on db olddb\n```\n\nWe can now copy files from\
    \ the old pool without damaging the pristine copy of the data.\n\nYou might want\
    \ to import a damaged pool, to try to recover some part of the data on it. The\
    \ `-F` flag tells `zpool import` to roll back the last few transactions. This\
    \ might return the pool to an importable state. You’ll lose the contents of the\
    \ rolled back transactions, but if this works, those transactions were probably\
    \ causing your problems anyway.\n\n## Larger Providers\n\nOne interesting fact\
    \ about ZFS is that it permits replacing providers with larger providers. If your\
    \ redundant storage pool uses 4 TB disks you can replace them with, say, 10 TB\
    \ models and increase the size of your pool. This requires replacing successive\
    \ providers with larger ones.\n\nA pool calculates its size by the smallest disk\
    \ in each `VDEV`. If your mirror has a 4 TB disk and a 10 TB disk in a single\
    \ `VDEV`, the mirror `VDEV` will only have 4 TB of space. There’s no sensible\
    \ way to mirror 10 TB of data on a 4 TB disk! If you replace the 4 TB disk, however,\
    \ you’ll be able to expand the mirror to the size of the smallest disk.\n\nOne\
    \ question to ask is: do you want your pools to automatically expand when they\
    \ can, or do you want to manually activate the expansion? ZFS can automatically\
    \ make the expansion work, but you need to set the `autoexpand` property for each\
    \ pool before starting. ZFS leaves this off by default because you can never shrink\
    \ a pool. (Having to turn on autoexpand won’t hurt you, but having it on by default\
    \ might leave you with a pool too large for any of your other disks.)\n\n```\n\
    # zpool set autoexpand=on db\n```\n\nWithout this property set, you must run a\
    \ command to expand the pool after you replace the providers.\n\nReplacing all\
    \ the providers in a pool isn’t complicated, but it does involve a certain amount\
    \ of tediousness. Take this RAID-Z1 pool with three providers.\n\n```\nNAME  \
    \      STATE READ WRITE CKSUM\ndb          ONLINE   0     0     0\n raidz1-0 \
    \  ONLINE   0     0     0\n  gpt/zfs1  ONLINE   0     0     0\n  gpt/zfs2  ONLINE\
    \   0     0     0\n  gpt/zfs3  ONLINE   0     0     0\n```\n\nEach of those providers\
    \ is a single tiny disk.\n\n```\n# zpool list db\nNAME  SIZE  ALLOC   FREE   FRAG\
    \  EXPANDSZ  CAP  DEDUP  HEALTH  ALTROOT\ndb    59.5G  1.43G  58.1G  1%      \
    \     -   2%  1.00x  ONLINE  -\n```\n\nIf the hardware has enough physical space,\
    \ add new drives and create replacement providers. If you’re short on physical\
    \ space, offline the providers and replace the hard drives. Here we offline and\
    \ replace the drives.\n\nThis pool has three providers: `gpt/zfs1`, `gpt/zfs2`,\
    \ and `gpt/zfs3`. We first replace `gpt/zfs1`. Running `gpart show -l` shows that\
    \ this provider is on drive `da1`.\n\nIf you need to offline the drive to add\
    \ the replacement drive, start by identifying the physical location of drive `da1`.\
    \ Prepare the replacement drive as required by your hardware, then offline the\
    \ pool from the provider.\n\n```\n# zpool offline db gpt/zfs1\n```\n\nThis should\
    \ return silently. Checking `zpool status` shows this provider is offline. You\
    \ can remove this hard drive from the system.\n\nInsert the replacement drive,\
    \ either in the space where the old drive was removed or a new slot. The new drive\
    \ should appear in `/var/run/dmesg.boot`. On this system, the new drive shows\
    \ up as `/dev/da4`. Create the desired partitioning on that drive and label it.\
    \ If you’re not using serial numbers in your labels, but labeling only by physical\
    \ location, you can use the same label. (Again, we use these short labels here\
    \ because they’re easier to read while learning.)\n\n```\n# gpart create -s gpt\
    \ da4\nda4 created\n# gpart add –a 1m -t freebsd-zfs -l zfs1 da4\n```\n\nNow tell\
    \ the pool to replace the failed device.\n\n```\n# zpool replace -f db gpt/zfs1\n\
    ```\n\nLet the pool finish resilvering before replacing any other providers. Replacing\
    \ a non-redundant unit during a resilvering will only cause pain. If you’re using\
    \ RAID-Z2 or RAID-Z3 it is possible to replace multiple disks simultaneously,\
    \ but it’s risky. An additional disk failure might make the VDEV fail. Without\
    \ the redundancy provided by ZFS, ZFS cannot heal itself. ... speed.\n\n## Zpool\
    \ Versions and Upgrades\n\nThe FreeBSD and OpenZFS teams constantly improve their\
    \ software, adding new features to ZFS. Some of these improvements require changes\
    \ or additions to the zpools. When you upgrade your host’s operating system, the\
    \ host might gain ZFS features that the existing pools don’t support. Before you\
    \ can use those new features, you must upgrade the pools. Pools continue to function\
    \ if you don’t upgrade them, but they won’t take advantage of new features.\n\n\
    You might choose to not upgrade your pools when you upgrade your operating system,\
    \ however. If you’re upgrading a system from FreeBSD 11 to 12, you might leave\
    \ the disks in the pool format for FreeBSD 11\\. If you need to roll back the\
    \ upgrade, the operating system will still be able to read the pools. Operating\
    \ system upgrades are reversible. Pool upgrades are not.\n\n### ZFS Versions and\
    \ Feature Flags\n\nOriginally, ZFS used version numbers to indicate which features\
    \ a pool or operating system version supported. Version numbers started at 1 and\
    \ increased by one for every ZFS improvement that touched the on-disk format.\
    \ When Sun Microsystems acted as the central coordinator of all ZFS development,\
    \ a single incrementing version number made sense. The version number in OpenZFS\
    \ is set to 5000, and pools use feature flags instead. We discuss feature flags\
    \ in detail in Chapter 3.\n\nThe two questions for feature flags are: “What features\
    \ does your pool currently support?” and “What features does your operating system\
    \ support?” Check the pool properties to see what’s on your disks, as discussed\
    \ in Chapter 3\\. To see all the feature flags your FreeBSD release supports,\
    \ run `zpool upgrade -v`.\n"
