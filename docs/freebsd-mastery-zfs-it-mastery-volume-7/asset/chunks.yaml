    \ disappearing at reboot. As gnop(8) passes everything through to the device,\
    \ though, ZFS will find metadata on the underlying device. ZFS will no longer\
    \ try to detect the disk’s sector size, as it has already set its sector size.\n\
    \n## Creating Pools and VDEVs\n\nCreate pools and virtual devices simultaneously\
    \ with zpool(8). You’ll also use zpool(8) to add VDEVs to an existing pool and\
    \ swap out failed devices, but we’ll cover all that in Chapter 5. Here we’ll create\
    \ striped pools, mirrors, and pools on each of the RAID-Z devices. Chapter 2 discusses\
    \ each VDEV type.\n\nYou need to set the ashift only once before creating as many\
    \ pools as you like. You don’t have to reset it each time you create a pool. We\
    \ expect most readers to skip through this book until they find the entry for\
    \ the type of pool they create, though, so we listed “set ashift” in all of them.\n\
    \n### Sample Drives\n\nChapter 0 recommends labeling drives by physical location\
    \ and serial number, so you can easily identify failed hardware. For production,\
    \ that’s very useful. For a book, however, longer device names make comprehension\
    \ more difficult. Our examples use GPT labels of *zfs* and a number. This chapter\
    \ uses six 1 TB drives, each with a 1 GB swap partition and a large ZFS partition,\
    \ created with gpart(8).\n\n```\n# gpart create -s gpt da0\n# gpart add -a 1m\
    \ -s1g -l sw0 -t freebsd-swap da0\n# gpart add -a 1m -l zfs0 -t freebsd-zfs da0\n\
    ```\n\nThe resulting disk has the following partitions.\n\n```\n# gpart show -l\
    \ da0\n=>      40  1953525088  da0  GPT  (932G)\n        40        2008    - \
    \ free -  (1.0M)\n      2048     2097152    1  sw0  (1.0G)\n   2099200  1951424512\
    \    2  zfs0  (931G)\n1953523712        1416    -  free -  (708K)\n```\n\nWe manage\
    \ the ZFS pools with the GPT labels, so the examples reference gpt/zfs0 through\
    \ gpt/zfs5. In production, use meaningful labels that map disks to physical locations.\n\
    \n### Striped Pools\n\nSome storage pools don’t need redundancy, but do need lots\
    \ of space. Scratch partitions for engineering and physics computations are common\
    \ use cases for this kind of storage. Use zpool create, the pool name, and list\
    \ the devices in the pool. Remember to set the ashift before creating the pool.\n\
    \nHere we create a pool of five storage providers.\n\n# **sysctl vfs.zfs.min_auto_ashift=12**\n\
    \n# **zpool create compost gpt/zfs0 gpt/zfs1 gpt/zfs2 gpt/zfs3 gpt/zfs4**\n\n\
    If the command succeeds, you get no output back. See if the pool exists with zpool\
    \ status.\n\n```\n# zpool status\n  pool: compost\n state: ONLINE\n  scan: none\
    \ requested\nconfig:\n\nNAME       STATE READ WRITE CKSUM\ncompost    ONLINE \
    \  0     0     0\n gpt/zfs0  ONLINE   0     0     0\n gpt/zfs1  ONLINE   0   \
    \  0     0\n gpt/zfs2  ONLINE   0     0     0\n gpt/zfs3  ONLINE   0     0   \
    \  0\n gpt/zfs4  ONLINE   0     0     0\n```\n\nAll five providers appear. Each\
    \ provider is its own VDEV. This is a big pool for a system this size.\n\nThis\
    \ pool stripes data across all the member VDEVs, but the VDEVs have no redundancy.\
    \ Most real-world applications require redundancy. The simplest sort of redundancy\
    \ is the mirror.\n\n### Mirrored Pools\n\nMirrored devices copy all data to multiple\
    \ storage providers. If any one provider on the mirror fails, the pool still has\
    \ another copy of the data. Traditional mirrors have two disks, although more\
    \ is certainly possible.\n\nUse the same zpool create command and the pool name.\
    \ Before listing the storage devices, use the mirror keyword. Set the system ashift\
    \ before creating the pool.\n\n```\n# sysctl vfs.zfs.min_auto_ashift=12\n# zpool\
    \ create reflect mirror gpt/zfs0 gpt/zfs1\n```\n\nCheck the pool’s configuration\
    \ with zpool status."
