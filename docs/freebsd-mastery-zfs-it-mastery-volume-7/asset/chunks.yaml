    \nStriped pools, with no redundancy, can be expanded up to the limits of the hardware.\
    \ Each non-redundant VDEV you add to a pool increases the odds of a catastrophic\
    \ failure, however, exactly like the RAID-0 device it resembles. Remember, the\
    \ failure of a single VDEV in a pool destroys the entire pool. In a striped pool,\
    \ each disk is a standalone VDEV.\n\nHere’s a striped pool with three providers.\n\
    \n```\n# zpool status scratch\n…\nconfig:\n\nNAME       STATE  READ WRITE CKSUM\n\
    scratch    ONLINE    0     0     0\n gpt/zfs0  ONLINE    0     0     0\n gpt/zfs1\
    \  ONLINE    0     0     0\n gpt/zfs2  ONLINE    0     0     0\n```\n\nUse the\
