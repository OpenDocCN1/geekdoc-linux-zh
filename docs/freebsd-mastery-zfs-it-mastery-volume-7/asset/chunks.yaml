    Pool features that are `enabled` are available for use, but not actually used
    yet. Your system might support a new type of compression, but has not actually
    written any data to the pool using the new algorithm. This pool could be imported
    on a system that doesn’t support the feature, because the on-disk format has not
    changed to accommodate the feature. The new host won’t see anything that makes
    it freak out.


    `Disabled` pool features are available in the operating system but not enabled.
    Nothing in the pool says that these features are available—the presence of disabled
    features means they’re available in the operating system. This pool is definitely
    usable on hosts that don’t support this feature.


    If the feature is `active`, the on-disk format has changed because the feature
    is in use. Most commonly, this pool cannot be imported onto a system that doesn’t
    support this feature. If the feature is active, but all datasets using the feature
    are destroyed, the pool reverts the feature setting to `enabled`.


    A few features are “read-only compatible.” If the feature is in active use, the
    pool could be partially imported onto a system that doesn’t support the feature.
    The new host might not see some datasets on the pool, and it can’t write any data
    to the pool, but it might be able to extract some data from the datasets.


    Creating a pool enables all features supported by that operating system’s ZFS
    implementation. You could use the `-d` flag with `zpool create` to disable all
    features in a new pool and then enable features more selectively.


    Now that you understand how pools work, let’s put some actual data on them.


    ZFS follows the Unix tradition of not preventing you from doing daft things, because
    that would also prevent you from doing clever things.


    Because `everyone` sees “9” and thinks 29, don’t they?


    `Exciting` is a bad word in systems administration.


    # Chapter 4: ZFS Datasets


    With ordinary filesystems you create partitions to separate different types of
    data, apply different optimizations to them, and limit how much of your space
    the partition can consume. Each partition receives a specific amount of space
    from the disk. We’ve all been there. We make our best guesses at how much disk
    space each partition on this system will need next month, next year, and five
    years from now. Fast forward to the future, and the amount of space you decided
    to give each partition is more than likely wrong. A partition without enough space
    for all its data sends you adding disks or moving data, complicating system management.
    When a partition has too much space, you kick yourself and use it as a dumping
    ground for stuff you’d rather have elsewhere. More than one of Lucas’ UFS2 systems
    has `/usr/ports` as a symlink to somewhere in `/home`. Jude usually ends up with
    some part of `/var` living in `/usr/local/var`.


    ZFS solves this problem by `pooling` free space, giving your partitions flexibility
    impossible with more common filesystems. Each ZFS dataset you create consumes
    only the space required to store the files within it. Each dataset has access
    to all of the free space in the pool, eliminating your worries about the size
    of your partitions. You can limit the size of a dataset with a `quota` or guarantee
    it a minimum amount of space with a `reservation`, as discussed in Chapter 6.


    Regular filesystems use the separate partitions to establish different policies
    and optimizations for the different types of data. `/var` contains often-changing
    files like logs and databases. The root filesystem needs consistency and safety
    over performance. Over in `/home`, anything goes. Once you establish a policy
    for a traditional filesystem, though, it’s really hard to change. The `tunefs(8)`
    utility for UFS requires the filesystem be unmounted to make changes. Some characteristics,
    such as the number of `inodes`, just cannot be changed after the filesystem has
    been created.


    The core problem of traditional filesystems distills to inflexibility. ZFS datasets
    are almost infinitely flexible.


    ## Datasets


    A dataset is a named chunk of data. This data might resemble a traditional filesystem,
    with files, directories, and permissions and all that fun stuff. It could be a
    raw block device, or a copy of other data, or anything you can cram onto a disk.


    ZFS uses datasets much like a traditional filesystem might use partitions. Need
    a policy for `/usr` and a separate policy for `/home`? Make each a dataset. Need
    a block device for an iSCSI target? That’s a dataset. Want a copy of a dataset?
    That’s another dataset.


    Datasets have a hierarchical relationship. A single storage pool is the parent
    of each top-level dataset. Each dataset can have child datasets. Datasets inherit
    many characteristics from their parent, as we’ll see throughout this chapter.


    You’ll perform all dataset operations with the `zfs(8)` command. This command
    has all sorts of sub-commands.


    ### Dataset Types


    ZFS currently has five types of datasets: filesystems, volumes, snapshots, clones,
    and bookmarks.


    A `filesystem` dataset resembles a traditional filesystem. It stores files and
    directories. A ZFS filesystem has a mount point and supports traditional filesystem
    characteristics like read-only, restricting `setuid` binaries, and more. Filesystem
    datasets also hold other information, including permissions, timestamps for file
    creation and modification, NFSv4 Access Control Flags, `chflags(2)`, and the like.


    A `ZFS volume`, or `zvol`, is a block device. In an ordinary filesystem, you might
    create a file-backed filesystem for iSCSI or a special-purpose UFS partition.
    On ZFS, these block devices bypass all the overhead of files and directories and
    reside directly on the pool. `Zvols` get a device node, skipping the FreeBSD memory
    used to mount disk images.


    A `snapshot` is a read-only copy of a dataset from a specific point in time. Snapshots
    let you retain previous versions of your filesystem and the files therein for
    later use. Snapshots use an amount of space based on the difference between the
    current filesystem and what’s in the snapshot.


    A `clone` is a new dataset based on a snapshot of an existing dataset, allowing
    you to fork a filesystem. You get an extra copy of everything in the dataset.
    You might clone the dataset containing your production web site, giving you a
    copy of the site that you can hack on touching the production site. A clone only
    consumes space to store the differences from the original snapshot it was created
    from. Chapter 7 covers snapshots, clones, and bookmarks.


    ### Why Do I Want Datasets?


    You obviously need datasets. Putting files on the disk requires a filesystem dataset.
    And you probably want a dataset for each traditional Unix partition, like `/usr`
    and `/var`. But with ZFS, you want a lot of datasets. Lots and lots and *lots*
    of datasets. This would be cruel madness with a traditional filesystem, with its
    hard-coded limits on the number of partitions and the inflexibility of those partitions.
    But using many datasets increases the control you have over your data.


    Each ZFS dataset has a series of properties that control its operation, allowing
    the administrator to control how the dataset performs and how carefully it protects
    its data. You can tune each dataset exactly as you can with a traditional filesystem.


    The sysadmin can delegate control over individual datasets to another user, allow
    the user to manage it without root privileges. If your organization has a whole
    bunch of project teams, you can give each project manager their own chunk of space
    and say, “Here, arrange it however you want.” Anything that reduces our workload
    is a good thing.

