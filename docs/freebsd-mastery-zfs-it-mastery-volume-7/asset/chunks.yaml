    \ goes into creating a new instance of that VDEV. When one of the keywords appears\
    \ again, `zpool(8)` starts with a new VDEV.\n\nThe opening of this chapter covered\
    \ striping across multiple mirrors, simulating a traditional RAID-10 setup. Here\
    \ we do exactly that.\n\n```\n# sysctl vfs.zfs.min_auto_ashift=12\n# zpool create\
