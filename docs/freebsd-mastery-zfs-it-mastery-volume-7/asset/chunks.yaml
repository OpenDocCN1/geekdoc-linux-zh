    quota and a refquota, the user might be able to delete files and free up space
    even though that increases the size of the filesystem’s snapshots.


    ### User and Group Quotas


    User and group quotas control how much data a user or a group can write to a dataset.
    Like dataset quotas, user and group quotas are controlled on a per-dataset basis.


    User and group quotas don’t apply to child filesystems, snapshots, and clones.
    You must apply quotas to each individual dataset you want them to affect.


    ### Viewing Space Used and Existing Quotas per Dataset


    The zfs userspace command lets you see how much space is used by each user in
    a dataset. Here we examine the zroot/home dataset on our test system. A system
    with complicated datasets might need several minutes to run du(1), but zfs userspace
    finds all the files owned by each user nearly instantaneously.


    ```

    # zfs userspace zroot/home

    TYPE        NAME      USED  QUOTA

    POSIX User  179      7.29M   none

    POSIX User  mwlucas  1.16G   none

    POSIX User  root      298M   none

    ```


    The user mwlucas has 1.16 GB of files—unsurprising. The root user has 298 MB of
    files in /home—somewhat surprising, but not shocking. Somehow, though, user 179
    has 7.29 MB of files in that dataset. This system has no user 179, which is why
    the user is shown by UID rather than username. A bit of digging shows that Lucas
    once used tar’s -p argument when extracting a source code tarball, preserving
    the original file ownership.


    None of these users have quotas.


    The zfs groupspace command shows how much space files owned by each group use.
    For something more interesting, I’m checking the group ownerships on the zroot/usr/local
    dataset.


    ```

    # zfs groupspace zroot/usr/local

    TYPE         NAME         USED  QUOTA

    POSIX Group  _tss        25.5K   none

    POSIX Group  bin         93.5K   none

    POSIX Group  kmem         128K   none

    POSIX Group  messagebus   392K   none

    POSIX Group  polkit       115K   none

    POSIX Group  wheel       1.85G   none

    ```


    If your server supports multiple groups, such as development teams, research groups,
    or devotees of different BSD variants, you can assign each group or user a quota
    to restrict their disk usage.


    ### Assigning and Removing User and Group Quotas


    Use the userquota and groupquota properties to assign user and group quotas. To
    specify the user or group the quota belongs to, give the property name, an @ sign,
    and the user or group name. Give the quota for the user mwlucas, for example,
    with userquota@mwlucas.


    ```

    # zfs set userquota@mwlucas=1G zroot/home

    ```


    The previous section showed that the mwlucas account had over a gigabyte of data
    in it. The mwlucas account is over quota, and that user gets an error whenever
    he tries to create a file.


    ```

    $ touch test

    touch: test: Disc quota exceeded

    ```


    Similarly, assign a group quota with the groupquota property, an @ sign, and the
    group name.


    ```

    # zfs set groupquota@staff=10G zroot/home

    ```


    If a user has repeatedly abused shared directories like /tmp, assign them a restrictive
    quota.


    ```

    # zfs set userquota@mwlucas=10m zroot/tmp

    ```


    This user can use features like SSH agent forwarding, but he can’t extract huge
    tarballs and monopolize the shared temporary space.


    To remove a quota, set the quota to *none*.


    ### Viewing Individual Quotas


    If you’re interested in the quota set for a specific user or group, ask ZFS for
    that one property.


    ```

    # zfs get userquota@mwlucas zroot/tmp

    NAME       PROPERTY           VALUE          SOURCE

    zroot/tmp  userquota@mwlucas  10M            local

    ```


    Now you can let your teams squabble among themselves over their disk space usage,
    without taking up your precious time. Congratulations!


    ## ZFS Compression'
