    for only newly written data, whether it be new files or overwriting old ones.


    ### Viewing Clones


    Clones appear the same as a regular dataset. In zfs list, you won’t notice any
    difference between a clone and any other dataset.[3](#part0011.xhtml_ref_footnotebookmark_end_34_3)
    Clones record their source snapshot in their origin property, however.


    ```

    # zfs get type,origin mypool/dolly

    NAME          PROPERTY  VALUE                  SOURCE

    mypool/dolly  type      filesystem             -

    mypool/dolly  origin    mypool/sheep@evenmore  -

    ```


    So a clone appears, in every way, to just be a regular dataset. The origin property
    is the only way to tell that this is a clone. The origin is the snapshot that
    this clone was created from.


    To track down all of the clones on your system, use zfs list and check the origin
    property. We’re checking for any entries that don’t end in a dash.


    ```

    # zfs list -o name,origin | grep -ve ''-$''

    NAME           ORIGIN

    mypool/dolly   mypool/sheep@evenmore

    ```


    This gives a list of all datasets that originate in snapshots.


    ### Deleting Clones and Snapshots


    Clones depend on blocks stored in the source snapshot. The existence of a clone
    prevents removing the source snapshot. If you try to remove the snapshot, zfs
    destroy tells you there’s a problem.


    ```

    # zfs destroy mypool/sheep@evenmore

    cannot destroy ''mypool/sheep@evenmore'': snapshot has dependent clones

    use ''-R'' to destroy the following datasets:

    mypool/dolly@zfs-auto-snap_frequent-2015-04-08-16h15

    mypool/dolly

    ```


    Add the -R flag, and destroying the snapshot takes all the dependent clones with
    it. You can delete the clone itself like any other filesystem dataset.


    ```

    # zfs destroy mypool/dolly

    cannot destroy ''mypool/dolly'': filesystem has children

    use ''-r'' to destroy the following datasets:

    mypool/dolly@zfs-auto-snap_frequent-2015-04-08-16h15

    ```


    Oh, wait. The clone inherited the zfs-auto-snapshot property from its parent,
    so our snapshot automation caught it. If you didn’t want the clone snapshotted,
    you should have turned that property off. You can manually remove the clone’s
    snapshots, but zfs-auto-snapshot keeps creating new ones. You can also use the
    -r (recursive) flag to destroy the clone and all its snapshots.


    ```

    # zfs destroy -rv mypool/dolly

    will destroy mypool/dolly@zfs-auto-snap_frequent-2015-04-08-16h15

    will destroy mypool/dolly

    ```


    Now we can erase the origin snapshot.


    ```

    # zfs destroy -v mypool/sheep@evenmore

    will destroy mypool/sheep@evenmore

    will reclaim 0

    ```


    Clones are powerful, but they complicate snapshot management.


    ### Promoting Clones


    Now that you’ve finished testing the developmental version of your web app, you
    want to make the clone the live version, and discard the previous version. But
    this causes problems. You cannot destroy the original dataset, because the clone
    depends on the snapshot from that dataset.


    To solve this you “promote” the clone, telling ZFS to reverse the parent/child
    relationship between the original dataset and the clone. The clone becomes the
    filesystem. The previous parent becomes a clone. The student becomes the master.
    Any snapshots that the clone requires move, and become part of the clone instead.
    Snapshots created after the clone’s snapshot of origin still belong to the original
    parent.


    Once the clone successfully switches places with the parent dataset, you can eliminate
    the original dataset.


    ZFS also changes the space used by the new parent and the new clone. The datasets
    take up no extra space, but the accounting for that space changes. Clones get
    billed only for the amount of space where they differ from their snapshot of origin.
    The new parent dataset gets billed for pretty much everything, just like new human
    parents.


    Let’s walk through promoting a clone. Here we clone the dataset mypool/wooly to
    a dataset called mypool/bonnie and modify the clone.


    ```

    # zfs clone mypool/wooly@later mypool/bonnie

    # date > /mypool/bonnie/date.txt

    # dd if=/dev/random of=/mypool/bonnie/randomfile bs=1m count=8 oseek=4

    ```


    Look at the clone’s disk usage.


    ```

    # zfs list mypool/bonnie

    NAME            USED  AVAIL  REFER  MOUNTPOINT

    mypool/bonnie  8.07M  13.5G  12.1M  /mypool/bonnie

    ```


    The USED column shows the 8 MB of new data we wrote to the clone. The REFER column
    shows the dataset contains 12 MB of data—4 MB from the snapshot of origin, plus
    the new 8 MB of data we added.


    We want to keep the bonnie dataset, and get rid of the original wooly dataset:


    ```

    # zfs destroy -rv mypool/wooly

    cannot destroy ''mypool/wooly'': filesystem has dependent clones

    use ''-R'' to destroy the following datasets:

    mypool/bonnie@zfs-auto-snap_frequent-2015-04-08-16h30

    mypool/bonnie

    ```


    ZFS knows that the dataset mypool/bonnie and its snapshot of origin depend on
    the mypool/wooly dataset. So we use the zfs promote command to make bonnie the
    filesystem, and turn the old dataset into the clone.


    Before promoting the clone, run zfs list and check the space usage and parentage
    of both datasets involved.


    ```

    # zfs list -t all -r mypool/wooly mypool/bonnie

    NAME                     USED  AVAIL  REFER  MOUNTPOINT

    mypool/bonnie            8.07M  13.5G  12.1M  /mypool/bonnie

    mypool/wooly             10.3M  13.5G  6.10M  /mypool/sheep

    mypool/wooly@all             0      -  2.11M  -

    mypool/wooly@moresnap        0      -  2.11M  -

    mypool/wooly@later       2.07M      -  5.11M  -

    mypool/wooly@rewrite     1.07M      -  5.11M  -

    mypool/wooly@muchlater       0      -  6.10M  -

    ```


    We’ll come back to this list later. Now promote mypool/bonnie.


    ```

    # zfs promote mypool/bonnie

    ```


    The promotion should run silently. Go take a look at these two datasets again.


    ```

    # zfs list -t all -r mypool/wooly mypool/bonnie

    NAME                    USED  AVAIL  REFER  MOUNTPOINT

    mypool/bonnie           14.3M  13.5G  12.1M  /mypool/bonnie

    mypool/bonnie@all           0      -  2.11M  -

    mypool/bonnie@moresnap      0      -  2.11M  -

    mypool/bonnie@later     1.07M      -  5.11M  -

    mypool/wooly            4.14M  13.5G  4.10M  /mypool/sheep

    mypool/wooly@rewrite    1.07M      -  5.11M  -

    mypool/wooly@muchlater      0      -  6.10M  -

    ```


    The snapshot that mypool/bonnie was based on, and all snapshots older than that
    snapshot of origin, now belong to mypool/bonnie. Newer snapshots of mypool/wooly,
    taken after the snapshot mypool/bonnie was created from, still belong to mypool/wooly.


    You can now destroy the old dataset and all of its snapshots.


    ```

    # zfs destroy -rv mypool/wooly

    will destroy mypool/wooly@muchlater

    will destroy mypool/wooly@rewrite

    will destroy mypool/wooly

    ```


    Remember that once a clone is forked from the main filesystem, it does not get
    any updates from the parent. Any persistent data your application needs should
    go in a different dataset. It can be a child dataset, as Jude prefers. Lucas says
    that persistent data should go in a completely unrelated dataset, just so a recursive
    remove doesn’t touch it. Watch out for your persistent data in any way you prefer.


    ## Safely Managing Clones, Snapshots, and Recursion'
