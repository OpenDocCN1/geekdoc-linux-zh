    \   FREE   FRAG  EXPANDSZ  CAP  DEDUP  HEALTH  ALTROOT\ndb     59.5G  1.70G  57.8G\
    \    0%      240G   2%  1.00x  ONLINE  -\n```\n\nNote that we now have new space\
    \ in EXPANDSZ. This pool can be grown.\n\nIf you set the pool to autoexpand before\
    \ you started, it should grow on its own. If not, manually expand each device\
    \ in the pool with zpool online -e.\n\n```\n# zpool online -e db gpt/zfs1\n# zpool\
    \ online -e db gpt/zfs2\n# zpool online -e db gpt/zfs3\n```\n\nThis pool now has\
    \ more space.\n\n## Zpool Versions and Upgrades\n\nThe FreeBSD and OpenZFS teams\
    \ constantly improve their software, adding new features to ZFS and to FreeBSD’s\
    \ ZFS support. Some of these improvements require changes or additions to the\
    \ zpools. When you upgrade your host’s operating system, the host might gain ZFS\
    \ features that the existing pools don’t support. Before you can use those new\
    \ features, you must upgrade the storage pools. Pools continue to function if\
    \ you don’t upgrade them, but they won’t take advantage of new features that require\
    \ on-disk format changes.\n\nYou might choose to not upgrade your pools when you\
    \ upgrade your operating system, however. If you’re upgrading a system from FreeBSD\
    \ 11 to FreeBSD 12, you might leave the disks in the pool format for FreeBSD 11\\\
    . If you need to roll back the upgrade, the operating system will still be able\
    \ to read the pools. Operating system upgrades are reversible. Pool upgrades are\
    \ not.\n\n### ZFS Versions and Feature Flags\n\nOriginally, ZFS used version numbers\
    \ to indicate which features a pool or operating system version supported. Version\
    \ numbers started at 1 and increased by one for every ZFS improvement that touched\
    \ the on-disk format. When Sun Microsystems acted as the central coordinator of\
    \ all ZFS development, a single incrementing version number made sense. The version\
    \ number in OpenZFS is set to 5000, and pools use feature flags instead. We discuss\
    \ feature flags in detail in Chapter 3.\n\nThe two questions for feature flags\
    \ are: “What features does your pool currently support?” and “What features does\
    \ your operating system support?” Check the pool properties to see what’s on your\
    \ disks, as discussed in Chapter 3\\. To see all the feature flags your FreeBSD\
    \ release supports, run zpool upgrade -v.\n\n```\n# zpool upgrade -v\nThis system\
    \ supports ZFS pool feature flags.\nThe following features are supported:\nFEAT\
    \ DESCRIPTION\n-------------------------------------------------------------\n\
    async_destroy                     (read-only compatible)\n  Destroy filesystems\
    \ asynchronously.\nempty_bpobj                       (read-only compatible)\n\
    \  Snapshots use less space.\nlz4_compress\n  LZ4 compression algorithm support.\n\
    ...\n```"
