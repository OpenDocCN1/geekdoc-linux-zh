    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 6 | 3 x 2 盘镜像 (Mirror) | 1500 | 750 | 600 | 300 | 3 TB (50%) | 3 (1/VDEV) |

    | 6 | 2 x 3 盘镜像 (Mirror) | 1500 | 500 | 600 | 200 | 2 TB (33%) | 4 (2/VDEV) |

    | 6 | 1 x 6 盘 RAID-Z1 | 250 | 250 | 500 | 500 | 5 TB (83%) | 1 |

    | 6 | 1 x 6 盘 RAID-Z2 | 250 | 250 | 400 | 400 | 4 TB (66%) | 2 |

    | 6 | 1 x 6 盘 RAID-Z3 | 250 | 250 | 300 | 300 | 3 TB (50%) | 3 |

    | 12 | 6 x 2 盘镜像 (Mirror) | 3000 | 1500 | 1200 | 600 | 6 TB (50%) | 6 (1/VDEV)
    |

    | 12 | 4 x 3 盘镜像 (Mirror) | 3000 | 1000 | 1200 | 400 | 4 TB (33%) | 8 (2/VDEV)
    |

    | 12 | 1 x 12 盘 RAID-Z1 | 250 | 250 | 1100 | 1100 | 11 TB (92%) | 1 |

