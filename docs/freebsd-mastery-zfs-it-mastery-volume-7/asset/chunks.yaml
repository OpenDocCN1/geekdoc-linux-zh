    Chapter 5, Pool Repairs and Renovations, covers making changes to storage pools.
    You can expand storage pools with additional disks, repair failed disks, and tweak
    pools to support new features.


    Chapter 6, Disk Space Management, covers one of the most misunderstood parts of
    using ZFS. Why does your 1 TB drive claim to have 87 TB free? How do you reserve
    space for some users and limit others? What about this deduplication stuff? This
    chapter covers all that and more.


    Chapter 7, Snapshots and Clones, discusses ZFS’ snapshot feature. You can create
    a point-in-time photograph of a dataset, and refer back to it later. You want
    a copy of a file as it existed yesterday? Snapshots are your friends. Similarly,
    clones let you duplicate a filesystem. You’ll understand both.


    Chapter 8, Installing to ZFS, covers installing FreeBSD to a ZFS. The FreeBSD
    installer can install a ZFS-based system for you. The installer is always improving,
    but the real world is more complex than any installation program can possibly
    expect. Knowing how to install the system exactly the way you want is useful.


    Fasten your seat belt and get ready to dive into a filesystem for the 21st century.


    [1] He will probably screw it up, because that’s what junior techs do. But give
    the poor guy a shot.


    [2] See, once upon a time the phone company printed huge books that listed everyone
    with a phone and their phone number. No, phone numbers didn’t change so often,
    because they were all landlines. But then the dinosaurs knocked the phone lines
    down, so we went cellular.


    # Chapter 1: Introducing ZFS


    Starting to learn ZFS isn’t hard. Install a recent FreeBSD release. Tell the installer
    you want ZFS. You’ve started. If you’ve never worked with ZFS, take a moment and
    install a new FreeBSD with ZFS on a test system or virtual machine. Don’t choose
    encryption or any of the fancy customization options. This trivial install offers
    an opportunity to look at some ZFS basics before diving into more complicated
    setups.


    ZFS combines the functions of traditional filesystems and volume managers. As
    such, it expects to handle everything from the permissions on individual files
    and which files are in which directories down to tracking which storage devices
    get used for what purposes and how that storage is arranged. The sysadmin instructs
    ZFS in arranging disks and files, but ZFS manages the whole storage stack beneath
    them. This chapter separates the ZFS stack into three layers: filesystems, storage
    pools, and virtual devices, using a FreeBSD 10.1 host installed with the default
    ZFS settings.


    To orient you, we start at the most visible parts of the storage stack and work
    our way down. Once you understand how the layers fit together, the rest of this
    book starts at the foundation and works its way up.


    ## ZFS Datasets


    ZFS filesystems aren’t exactly analogous to traditional filesystems, and so are
    called `datasets`. The classic Unix File System (UFS) and its derivatives and
    work-alikes, such as modern BSD’s UFS2 and Linux’s extfs, manage filesystems with
    a variety of programs. You’re probably well accustomed to using `df(1)`, `newfs(8)`,
    `mount(8)`, `umount(8)`, `dump(8)`, `restore(8)`, and similar commands. ZFS absorbs
    all of these functions in the `zfs(8)` program, which lets you create, destroy,
    view, and otherwise spindle ZFS datasets.


    Start by viewing existing ZFS datasets with `zfs list`.


    ```

    # zfs list

    NAME                USED  AVAIL  REFER  MOUNTPOINT

    zroot               429M  13.0G    96K  none

    zroot/ROOT          428M  13.0G    96K  none

    zroot/ROOT/default  428M  13.0G   428M  /

    zroot/tmp           104K  13.0G   104K  /tmp

    zroot/usr           428K  13.0G    96K  /usr

    …

    ```


    This combines the output of `mount(8)` and `df(1)`, and should look pretty familiar
    to anyone who’s managed UFS or extfs.


    Each dataset has a name. A ZFS dataset name starts with the ZFS storage pool,
    or `zpool`, the dataset is on. Our first entry is called just plain `zroot`. This
    entry represents the pool’s `root dataset`, which everything else hangs off of.


    The next two columns show amount of space used and available. The pool `zroot`
    has used 429 MB and 13 GB free.


    The `REFER` column is special to ZFS. This is the amount of accessible data on
    the dataset, which is not necessarily the same as the amount of space used. Some
    ZFS features, such as snapshots, share data between themselves. Our `zroot` entry
    has “used” 429 MB, but only refers to 96 KB of data. The pool as a whole has 13
    GB free, but 96 KB are accessible through this specific dataset. That’s not much.
    The rest of the space is used for children of this dataset. Chapter 6 gives a
    detailed discussion of ZFS disk usage. A dataset’s children include snapshots,
    volumes, and child datasets, as you’ll see throughout this book.


    Finally we have the filesystem mount point. The `zroot` ZFS is not mounted.


    Look at the second entry, named `zroot/ROOT`. This is a ZFS dataset created for
    the root filesystem. Like the pool, it isn’t mounted. It refers 96 KB of data.


    The third entry, `zroot/ROOT/default`, is the current root filesystem. It is mounted
    on `/`. It uses 428 MB, which is the root.


    The next dataset, `zroot/tmp`, is almost empty. It’s mounted at `/tmp`. This dataset
    is the temporary directory.


    ## ZFS Partitions and Properties


    ZFS lacks traditional partitions. A partition is a logical subdivision of a disk,
    filling specific Logical Block Addresses (`LBAs`) on a storage device. Partitions
    have no awareness of the data on the partition. Changing a partition means destroying
    and (presumably) rebuilding the filesystem on top of it.


    Lucas’ first thought on seeing a partition-less filesystem was to wonder how he
    would manage his storage, at all. That’s roughly equivalent to the confusion he
    experiences when, after a long cold Michigan winter, he steps outside feels natural
    warm air for the first time in months. Confusion is part of liberation. We learned
    to administer storage via partitions because we had to, not because partitions
    are pleasant or because they’re the best solution. Running a traditional filesystem
    without partitions is poor practice, but ZFS is not a traditional filesystem.


    ZFS tightly integrates the filesystem and the lower storage layers. This means
    it can dynamically divide storage space between the various filesystems as needed.
    While you can set specific size limits on a ZFS filesystem, datasets do not have
    traditional sizes. If the pool has enough space for a file, you can use it. Where
    you previously allocated a limited amount of disk space to, say, `/var/log`, and
    thus kept berserk logs from filling your disk, you must now set those limits at
    the ZFS level.


    The amount of space a dataset may use is one example of a ZFS `property`. ZFS
    supports dozens of dataset properties—for example, the `quota` property controls
    how large a dataset can grow. Use `zfs(8)` to set a ZFS property.


    ```

    # zfs set quota=2G zroot/var/log

    ```


    View a property with the `zfs get` command.

