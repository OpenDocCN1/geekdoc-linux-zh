    \ it.\n\nWith ZFS, you can’t just add up the amount of used space to get the total.\n\
    \nThe AVAIL column, or space available, is somewhat more reliable. The pool zroot\
    \ has 874 GB of empty space. Once you start using snapshots and clones and all\
    \ of the other ZFS goodness, you’ll find that this 874 GB of space can contain\
    \ many times that much data, thanks to referenced data.\n\n### Referenced Data\n\
    \nThe amount of data included in a dataset is the referenced data. Look at the\
    \ REFER column in the listing above. The zroot pool and zroot/ROOT both refer\
    \ to 144 KB of space. That’s roughly enough to say that “yes, this chunk of stuff\
    \ exists.” It’s a placeholder. The dataset zroot/ROOT/default, however, references\
    \ 1.35 GB of data.\n\nThe referenced data is stuff that exists within this filesystem\
    \ or dataset. If you go into the zroot/ROOT/default filesystem, you’ll find 1.35\
    \ GB of stuff.\n\nSo, you add up the referenced space and get the amount used?\
    \ No, wrong again. Multiple ZFS datasets can refer to the same collection of data.\
    \ That’s exactly how snapshots and clones work. That’s why ZFS can hold, for example,\
    \ several 10 GB snapshots in 11 GB of space.\n\nClones use space much like snapshots,\
    \ except in a more dynamic manner. Once you add in deduplication and compression,\
    \ disk space usage gets complicated really quickly.\n\nAnd then there are even\
    \ issues around freeing space.\n\n### Freeing Space\n\nIn many ZFS deployments,\
    \ deleting files doesn’t actually free up space. In most situations, deletions\
    \ actually increase disk space usage by a tiny amount, thanks to snapshots and\
    \ metadata. The space used by those files gets assigned to the most recent snapshot.\
    \ To successfully manage ZFS, you have to understand how the underlying features\
    \ work and what ZFS does when you delete data."
