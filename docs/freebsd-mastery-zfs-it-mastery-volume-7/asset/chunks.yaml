    # Chapter 8: Installing to ZFS


    The whole point of learning about ZFS is to use the filesystem on a machine. Let’s
    discuss FreeBSD 10 installs on ZFS.


    If you must install a whole slew of FreeBSD machines, such as at a server farm,
    we recommend the PC-BSD installer. Scripts like we demonstrate here are fine for
    occasional installs of a few machines, but if you’re configuring machines by the
    rack, you really need a PXE-based installer.


    Your hardware limits your choices. With rare exceptions, laptops have one hard
    drive. Running FreeBSD means using a single striped virtual device pool for storage.
    If you have hundreds of disks, you’ll need to consider how you want to separate
    your pools.


    When you have many many disks, separate your operating system from your data.
    FreeBSD and a good selection of add-on software fits nicely on a mirrored pool
    or a RAID-Z. You don’t need RAID-Z3 for just the operating system! If you have
    hundreds of data storage disks, use separate pools for the operating system and
    data. With hundreds of disks, Lucas would want a few separate pools, but he’s
    an old fogey. Jude would pour them all into one giant pool. The only wrong choice
    is one that makes more work for you.


    This chapter assumes you’re familiar with GPT partitioning, FreeBSD tools such
    as `gpart(8)`, and FreeBSD partition types. If you’re not, check the FreeBSD documentation
    or perhaps read *FreeBSD Mastery: Storage Essentials*. (*FMSE* also covers installation
    scripts and other advanced installation techniques.)


    Installing a ZFS-based system requires configuring storage pools, assigning datasets,
    and installing FreeBSD to the datasets. You can make separate choices in each
    step, so we’ll consider each separately.


    But start with a reference FreeBSD install.


    ## FreeBSD Reference Install


    Before installing your custom FreeBSD system, install a small FreeBSD ZFS virtual
    machine as a reference platform. This offers lots of information about a standard
    FreeBSD install. Installing your own system is great, but don’t abandon all the
    carefully considered defaults the installer uses. Your goal is probably to tweak
    the install in a way the installer doesn’t permit, not abandon all FreeBSD standards.


    Boot your reference platform, become root, and run `zpool history` to see how
    this ZFS was created.


    ```

    # zpool history

    History for ''zroot'':

    2015-04-08.07:18:30 zpool create -o altroot=/mnt -O compress=lz4 -O atime=off
    -m none -f zroot raidz1 da0p3.nop da1p3.nop da2p3.nop

    2015-04-08.07:18:30 zfs create -o mountpoint=none zroot/ROOT

    2015-04-08.07:18:30 zfs create -o mountpoint=/ zroot/ROOT/default

    2015-04-08.07:18:30 zfs create -o mountpoint=/tmp -o exec=on -o setuid=off zroot/tmp

    ...

    ```


    We’ll use this information throughout the installation process to tweak our install.


    ## Custom ZFS Installation Partitioning


    Boot into the FreeBSD installer image, and choose *install*. When you get to the
    point where you partition disks, select the command line rather than any automatic
    or guided method. You could also use something like `mfsBSD` for the version you
    want, if you have that handy.


    ### Disk Partitioning


    When the computer boots, it looks for an operating system on the storage media.
    For FreeBSD, this is a boot loader. FreeBSD provides the `gptzfsboot(8)` boot
    loader specifically for booting from ZFS pools. The hardware BIOS boots the boot
    loader, which activates the pool and fires up the FreeBSD kernel. Every disk in
    every virtual device in the boot pool should have a ZFS boot loader installed,
    which means the disks must be partitioned. The maximum size of the FreeBSD boot
    loader partition is just a smidgen over 512 KB for some daft reason, so assign
    512 KB for the boot loader. Then we put in a 1 GB FreeBSD swap partition, and
    assign the remaining space for ZFS. The swap and ZFS partitions are aligned at
    1 MB boundaries.


    While I’m using these short names for the GPT labels for teaching purposes, we
    strongly encourage you to use location-based labels as discussed in Chapter 0.


    ```

    # gpart add –a 1m -t freebsd-boot -s 512k -l zfsboot da0

    da0p1 added

    # gpart add –a 1m -t freebsd-swap -s 1g -a 1m -l swap0 da0

    da0p2 added

    # gpart add –a 1m -t freebsd-zfs -a 1m -l zfs0 da0

    da0p3 added

    ```


    Now install the FreeBSD ZFS bootloader onto this disk. Every disk you might need
    it.


    ```

    # gpart bootcode -b /boot/pmbr -p /boot/gptzboot -i 1 da0

    bootcode written to da0

    ```


    Repeat this partitioning for every disk.


    ### Pool Creation


    Still at the disk formatting prompt, assemble your disks into your storage pool.
    It’s common to call the root pool something like `system` or you might name it
    after the host. Do whatever fits for your environment. I’m calling the example
    pool `zroot`, so that it fits with the default FreeBSD.


    Look at the default FreeBSD install’s `zpool history` and consider what it shows.


    ```

    2015-04-08.07:18:30 zpool create -o altroot=/mnt -O compress=lz4 -O atime=off
    -m none -f zroot raidz1 da0p3.nop da1p3.nop da2p3.nop

    ```


    This is a FreeBSD 10.1 system. The installer mounts the boot pool temporarily
    at `/mnt`, and we really have to keep that for the installer to work. We want
    the other options, like setting compression to `lz4` and disabling `atime`. The
    `-m none` tells `zpool(8)` to not assign a mount point to this pool. The 10.1
    installer wasn’t yet updated to take advantage of the `vfs.zfs.min_auto_ashift`
    `sysctl`, but I’m going to use it now.


    ```

    # sysctl vfs.zfs.min_auto_ashift=12

    ```


    ZFS will now use 4096-byte sectors. Create the pool. We’re stealing all of the
    default FreeBSD options, making only the changes we desire.


    ```

    # zpool create -o altroot=/mnt -O compress=lz4 -O atime=off -m none -f zroot mirror
    gpt/zfs0 gpt/zfs1 cache gpt/zcache0 log gpt/zlog0

    ```


    Chances are, FreeBSD’s default pool installation options are fine. You probably
    want to tweak the datasets.


    ### Datasets


    While you want to create your custom dataset configuration, do check FreeBSD’s
    installation defaults. They’re sensible for the average user, and allow use of
    advanced features like boot environment managers.

