    \     0     0     0\n```\n\nI’ve installed a new drive, which shows up in /var/run/dmesg.boot\
    \ as da5, and created a freebsd-zfs partition on it. This new provider gets the\
    \ GPT label zfs3\\. The pool won’t automatically identify this provider as its\
    \ replacement—it knows that the previous provider was /dev/gpt/zfs3, but the new\
    \ /dev/gpt/zfs3 lacks the on-disk metadata that identifies it as a ZFS volume.\n\
    \nTo slip this new provider into the zpool, use zpool replace again. Use the GUID\
    \ instead of the previous device name.\n\n# **zpool replace db 13792229702739533691\
    \ gpt/zfs3**\n\nChecking the zpool’s status shows the pool resilvering. Once the\
    \ resilver completes, the pool is fully restored.\n\n### Replacing Mirror Providers\n\
    \nSometimes a disk doesn’t totally fail, but generates so many errors that it’s\
    \ clearly about to die. When this disk is in a mirrored virtual device, it might\
    \ be better to keep the failing provider in place while you add the replacement\
    \ disk. This maximizes redundancy throughout the replacement process. It does\
    \ require that your hardware be able to use three disks instead of the usual two.\
    \ If your system can handle only two disks, then stick with zpool replace.\n\n\
    Here we have a pool with a single mirror VDEV containing two providers, gpt/zfs0\
    \ and gpt/zfs1. We must replace the dying gpt/zfs0 with gpt/zfs2. Rather than\
    \ going straight to zpool replace, start by attaching the replacement disk to\
    \ pool. The zpool attach command tells this pool to add another layer of mirroring\
    \ to the pool. Give the pool name, a device to be mirrored, and the new device.\n\
    \n```\n# zpool attach db gpt/zfs1 gpt/zfs2\n```\n\nHere we attach a provider to\
    \ the pool db. One of the existing providers is gpt/zfs1, and we’re attaching\
    \ gpt/zfs2. Look at zpool status db and you’ll see the pool resilvering to synchronize\
    \ the new provider with the other disks in the mirror. Once the new provider is\
    \ synchronized with the pool, remove the failing provider from the virtual device.\n\
    \n```\n# zpool detach db gpt/zfs0\n```\n\nThe failing disk behind gpt/zfs0 is\
    \ no longer in use.\n\nYou can also use this technique to transform a single-disk\
    \ pool into a mirrored virtual device.\n\n### Reattaching Unavail and Removed\
    \ Drives\n\nAn UNAVAIL drive might not have catastrophically failed. It might\
    \ have come unplugged. If you go to the server and find that wiggling the drive\
    \ tray makes it light up, you can tell the zpool to reactivate the disk. You can\
    \ also reactivate a drive with a status of REMOVED. In either case use the zpool\
    \ online command, the pool name, and the GUID of the missing provider.\n\n```\n\
    # zpool online db 718035988381613979\n```\n\nZFS will resilver the reactivated\
    \ drive and resume normal function.\n\n## Log and Cache Device Maintenance\n\n\
    We advise using high-endurance SSD drives for your ZFS Intent Log (write cache)\
    \ and L2ARC (read cache). All too often you’ll find that “high endurance” is not\
    \ the same as “high enough endurance,” and you might need to replace the device.\
    \ Log devices use the same status keywords as regular storage providers—*faulted*,\
    \ *offline*, and so on. You might also need to insert a log device or, less commonly,\
    \ remove the log device.\n\nWhile the examples show log devices, cache devices\
    \ work exactly the same way.\n\n### Adding a Log or Cache Device\n\nTo add a log\
    \ or cache device to an existing pool, use zpool add, the pool name, and the device\
    \ type and providers. Here we add the log device gpt/zlog0 to the pool db.\n\n\
    ```\n# zpool add db log gpt/zlog0\n```\n\nThe pool immediately begins using the\
    \ new log or cache device."
