    \   ONLINE   0     0     0\n  gpt/zfs0  ONLINE   0     0     0\n  gpt/zfs1  ONLINE\
    \   0     0     0\n mirror-1   ONLINE   0     0     0\n  gpt/zfs2  ONLINE   0\
