  trans: '


    RAID-Z 与传统的 RAID 相比具有许多优势，但最大的优势在于 ZFS 不仅仅是磁盘冗余层，它还是卷管理器和文件系统。


    在过去，文件系统只能在一个块磁盘上工作。如果你有两个磁盘，就需要两个独立的文件系统。传统的 RAID 允许你将多个磁盘组合为一个虚拟磁盘，从而允许创建容量如
    100 MB 甚至更大的巨型磁盘。然后，操作系统在其之上放置其自己的文件系统，而完全不知道数据块在物理磁盘上的布局方式。同时，RAID 可以提供容错能力。考虑到当时硬件和软件的限制，RAID
    似乎是一个相当不错的选择。


    通过将文件系统和卷管理器结合起来，ZFS 能够确切地看到所有数据的位置，以及存储层与数据是如何相互作用的。这使得 ZFS 能够做出许多重要的决策，例如确保重要数据（如
    `ditto blocks`，见第 3 章）的额外副本存储在不同的磁盘上。如果你的关键数据的两个或三个副本都位于同一个底层存储设备上，而该设备可能因为单一硬件故障而被毁，那是毫无意义的。ZFS
    甚至会将 `ditto blocks` 放在相邻的磁盘上，因为从统计上看，如果两个磁盘同时故障，它们恰好相邻的概率较低。


    传统的 RAID 会受到一种被称为“写空”（write hole）的缺陷的影响，即两步操作在途中中断。`RAID 5` 和 `RAID 6` 设备将要写入的数据分块发送到所有数据磁盘。一旦此操作完成，就会计算校验块并存储在校验磁盘上。如果系统在数据写入之后、校验写入之前崩溃或断电，磁盘将处于不确定状态。当系统重启时，数据与校验位不匹配。镜像驱动器如果其中一个驱动器完成了更新而另一个没有完成，也会发生同样的情况。


    写空问题直到你更换故障磁盘时才会被察觉。错误的校验位或错误的镜像会导致 RAID 设备向文件系统返回垃圾数据。传统文件系统会将这些垃圾数据作为你的文件内容返回。


    ZFS 通过写时复制（copy-on-write）和校验和解决了这些问题。写时复制（见第 7 章）意味着数据永远不会在原地覆盖。每次更新都是事务性的，要么完全完成，要么不执行，使系统恢复到更新之前的状态。ZFS
    还有校验和，因此它可以检测出驱动器返回的无效数据。当 ZFS 检测到无效数据时，它会用另一个来源的正确数据替换该数据，例如数据的额外副本、镜像驱动器或 `RAID-Z`
    校验。这些特性共同构建了 ZFS 的自愈属性。


    ## 特殊 VDEV


    池可以使用特殊用途 VDEV 来提高池的性能。这些特殊的 VDEV 类型不用于持久化存储数据，而是放在更快的设备上临时持有数据的额外副本。


    ### 独立意图日志 (SLOG, ZIL)


    ZFS 将 ZFS 意图日志（`ZIL`）作为池的一部分。与某些其他文件系统中的日志（journal）类似，它在这里写入正在进行的操作，以便在系统崩溃或断电时可以完成或回滚。`ZIL`
    受磁盘正常运行条件的影响。池可能会因为负载导致使用率或延迟突然激增，从而导致性能下降。


    提升性能的方法一种是将 `ZIL` 与正常的池操作分离。你可以使用专用设备作为独立意图日志（`SLOG`），而不是使用池的普通部分。专用设备通常是一个较小但非常快的设备，例如高耐用
    SSD。


    ZFS 并不是按照接收顺序将数据从 `SLOG` 复制到池的主存储中，而是将数据分组成合理的组并更高效地写入。


    某些软件坚持在继续执行之前接收到写入磁盘的数据已实际在磁盘上的确认。数据库通常这样做，以避免在系统崩溃或断电时发生损坏。某些 NFS 操作也是如此。通过将这些请求写入到更快的日志设备并报告“全部完成”，ZFS
    加速了这些操作。数据库完成事务并继续运行。你获得了几乎是 SSD 级别的写入性能，同时使用廉价的磁盘作为存储介质。


    你可以镜像你的 `ZIL` 以防止数据丢失。


    ### 缓存 (L2ARC)


    当从磁盘读取文件时，系统将其保留在内存中，直到内存被用于其他用途。这是一项旧技术，甚至在原始的 BSD 时代就已经使用了。在基于 UFS 的 BSD 系统上查看
    `top(1)`，你会看到一区块标记为 `Buf` 的内存。那是缓冲区缓存。


    然而，传统的缓冲区缓存是几十年前设计的。ZFS 拥有一个为现代硬件设计的自适应替换缓存（`ARC`），它赋予了系统更高的速度。`ARC` 保留了最近访问和频繁访问的文件。


    然而，极少现代系统拥有足够的 RAM 来随心所欲缓存。正如 ZFS 可以使用 `SLOG` 加速写入一样，它可以使用非常快的磁盘来加速读取。这被称为二级 ARC，`L2ARC`。


    当一个对象被频繁使用到足以从缓存中获益，但频率又不足以存储在 RAM 中时，ZFS 可以将其存储在缓存设备上。`L2ARC` 通常是非常快速且高耐用的 SSD
    或 NVMe 设备。现在，当请求该块数据时，可以从更快的 SSD 读取，而不是从池其余部分的较慢磁盘读取。ZFS 知道后端磁盘上的哪些数据发生了变化，因此它可以确保读取缓存与存储池中的数据同步。


    ## VDEV 如何影响性能


    每个不同类型的 VDEV 都不同。基准测试和分析磁盘性能是一个复杂的话题，如果有人愿意读，它足以写一本伟大的教科书。我们要提供的任何具体建议很快就会过时，所以让我们只讨论一些通用术语。


    一种常见的衡量标准是每秒输入输出次数 `IOPS`，即驱动器每秒可以执行的独立操作数。机械驱动器的 `IOPS` 通常物理受限于读写头在不同位置之间移动的速度。固态硬盘具有如此出色的性能，因为它们不需要物理移动。


    非校验主轴的数量限制了未受损池的流式读写性能。“流式”性能归结为驱动器每秒读取或写入的兆字节数 (`MB/s`)。当驱动器顺序读取或写入数据时，头部不需要在不同位置之间寻道。只有在这些情况下，驱动器才能达到其最佳流式性能。主轴数量同时影响随机和流式性能。12
    个 1TB（`12 x 1 TB`）驱动器阵列通常优于 6 个 2TB（`6 x 2 TB`）驱动器阵列，因为更大的主轴和头部数量增加了 `IOPS` 和流式性能。


    其他常见的衡量标准包括读取带宽、写入带宽、空间效率和流式性能。


    通常情况下，镜像可以提供更好的 `IOPS` 和读取带宽，但 `RAID-Z` 可以提供更好的写入带宽和好得多的空间效率。


