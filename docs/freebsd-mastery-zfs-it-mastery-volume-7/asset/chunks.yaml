    你可以对数据集创建快照。你可以基于这些快照创建克隆。然后你可以对克隆创建快照并创建更多的克隆。尽管你尽了努力，你可能会产生大量相互关联的克隆和快照组成的复杂网络，超出了任何人类心理追踪的能力。ZFS
    为你提供了许多功能和便利，但克隆可能引发各种让你翻江倒海的全新类型混乱。4


    `-nv` 标志对于安全的系统管理至关重要。每当你脑中产生一丝破坏数据集的念头时，请使用 `-nv` 执行详细的模拟运行（dry run）。看看 `destroy`
    命令实际上会删除什么。阅读列表。你可能会发现，你的递归 `destroy` 拉动了一根跨越整个池的克隆线程。


    三思行后跳。永远如此。


    ZFS 改变了你使用磁盘空间的方式，但管理它仍然是管理员的任务。让我们接下来来讨论这一点。


    1 快照让你在数据上等同于收集者。尽量不要让自己埋在旧报纸的雪崩中。


    2 当你要自断脚时，请对准目标。安全第一！


    3 克隆看起来和它们的源材料一样。这就是为什么它们是如此出色的杀手。不，等一下——错克隆了。抱歉。


    4 诚然，大鞋和红鼻子并没有帮助。不，等等——那是小丑。抱歉，没关系。


    # 第 8 章：安装到 ZFS


    学习 ZFS 的全部意义是在机器上使用该文件系统。让我们讨论在 ZFS 上安装 FreeBSD 10。


    如果你必须安装大量的 FreeBSD 机器（例如在服务器群中），我们推荐使用 PC-BSD 安装程序。像我们在这里演示的这种脚本对于偶尔安装几台机器是可以的，但如果你是按机架配置机器，你真的需要一个基于
    PXE 的安装程序。


    硬件限制了你的选择。在极少数情况下，笔记本电脑只有一块硬盘。运行 FreeBSD 意味着使用单个条带化的虚拟设备池进行存储。如果你有数百块磁盘，你将需要考虑如何分离你的池。


    当你有许多许多磁盘时，请将你的操作系统与数据分离。FreeBSD 和精选的附加软件非常适合放在镜像池或 RAID-Z 中。你不需要仅仅为了操作系统就使用 RAID-Z3！如果你有几百块数据存储磁盘，请为操作系统和数据使用独立的池。对于几百块磁盘，Lucas
    可能会想要几个独立的池，但他是个老古董了。Jude 也许会把它们全部倒进一个巨大的池中。唯一的错误选择是那种增加你工作量的选择。


    本章假设你熟悉 GPT 分区、FreeBSD 工具（如 `gpart(8)`）以及 FreeBSD 分区类型。如果不熟悉，请查看 FreeBSD 文档或者读读
    *FreeBSD Mastery: Storage Essentials*。（*FMSE* 也涵盖了安装脚本和其他高级安装技术。）


    安装一个基于 ZFS 的系统需要配置存储池、分配数据集并将 FreeBSD 安装到数据集中。你可以在每一步中做出不同的选择，因此我们将分别考虑。


    但先从参考性的 FreeBSD 安装开始。


    ## FreeBSD 参考安装


    在安装自定义的 FreeBSD 系统之前，先安装一个较小的 FreeBSD ZFS 虚拟机作为参考平台。这提供了许多关于标准 FreeBSD 安装的信息。安装你自己的系统固很棒，但不要放弃安装程序所使用的所有仔细考虑过的默认设置。你的目标可能是以安装程序不允许的方式对安装进行微调，而不是放弃所有的
    FreeBSD 标准。


    启动你的参考平台，成为 root 用户，并运行 `zpool history` 查看这个 ZFS 是如何创建的。


    ```

    # zpool history

    History for ''zroot'':

    2015-04-08.07:18:30 zpool create -o altroot=/mnt -O compress=lz4 -O atime=off
    -m none -f zroot raidz1 da0p3.nop da1p3.nop da2p3.nop

    2015-04-08.07:18:30 zfs create -o mountpoint=none zroot/ROOT

    2015-04-08.07:18:30 zfs create -o mountpoint=/ zroot/ROOT/default

    2015-04-08.07:18:30 zfs create -o mountpoint=/tmp -o exec=on -o setuid=off zroot/tmp

    ...

    ```


    我们将在整个安装过程中使用这些信息来微调我们的安装。


    ## 自定义 ZFS 安装分区


    进入 FreeBSD 安装镜像，并选择 *install*。当你到达分区磁盘的步骤时，请选择命令行而不是任何自动或引导式方法。如果你手头有你需要的版本，也可以使用类似
    `mfsBSD` 类的工具。


    ### 磁盘分区


    当计算机启动时，它会在存储介质上寻找操作系统。对于 FreeBSD 来说，这是一个引导加载程序。FreeBSD 提供了 `gptzfsboot(8)` 引导加载程序专门用于从
    ZFS 池启动。硬件 BIOS 启动引导加载程序，该程序激活池并启动 FreeBSD 内核。启动池中每个虚拟设备中的每块磁盘都应该安装 ZFS 引导加载程序，这意味着磁盘必须分区。由于某种奇怪的原因，FreeBSD
    引导加载程序分区的最大尺寸仅略大于 512 KB，因此为引导加载程序分配 512 KB。然后我们放入一个 1 GB 的 FreeBSD 交换分区，并将剩余空间分配给
    ZFS。交换分区和 ZFS 分区在 1 MB 边界对齐。


    为了教学目的，我在 GPT 标签中使用这些短名称，但我们强烈建议你像第 0 章讨论的那样使用基于位置的标签。


    ```

    # gpart add –a 1m -t freebsd-boot -s 512k -l zfsboot da0

    da0p1 added

    # gpart add –a 1m -t freebsd-swap -s 1g -a 1m -l swap0 da0

    da0p2 added

    # gpart add –a 1m -t freebsd-zfs -a 1m -l zfs0 da0

    da0p3 added

    ```


    现在在该磁盘上安装 ZFS 引导程序。每块磁盘都可能需要它。


    ```

    # gpart bootcode -b /boot/pmbr -p /boot/gptzboot -i 1 da0

    bootcode written to da0

    ```


    对每块磁盘重复此操作。


    ### 创建池


    在磁盘格式化提示处，将你的磁盘汇入你的存储池。通常将根池命名为 `system`，或者你可以根据主机命名。根据你的环境决定。我将示例池命名为 `zroot`，以便符合
    FreeBSD。


    查看默认 FreeBSD 的 `zpool history` 并考虑其内容。


    ```

    2015-04-08.07:18:30 zpool create -o altroot=/mnt -O compress=lz4 -O atime=off
    -m none -f zroot raidz1 da0p3.nop da1p3.nop da2p3.nop

    ```


    这是一个 FreeBSD 10.1 系统。安装程序临时将引导池挂载到 `/mnt`，我们必须保持这样。我们想要其他选项，例如将压缩设置为 `lz4` 并禁用
    `atime`。`-m none` 告诉 `zpool(8)` 不要为此池分配挂载点。10.1 安装程序尚未更新以利用 `vfs.zfs.min_auto_ashift`
    `sysctl`，但我们现在使用它。


    ```

    # sysctl vfs.zfs.min_auto_ashift=12

    ```


    ZFS 现在将使用 4096 字节扇。创建池。我们盗用了所有的 FreeBSD 选项，仅进行我们想要的更改。


    ```

    # zpool create -o altroot=/mnt -O compress=lz4 -O atime=off -m none -f zroot mirror
    gpt/zfs0 gpt/zfs1 cache gpt/zcache0 log gpt/zlog0

    ```


    可能 FreeBSD 的默认池安装选项是足够的。你可能想要微调数据集。


    ### 数据集


    虽然你想创建自定义的数据集配置，但请检查 FreeBSD 的安装默认设置。它们对于普通用户来说是合理的，并且允许使用启动环境管理器等高级功能。


