- fmt: '

    Setting `volmode` to `none` means that the volume is not exposed outside ZFS.
    These volumes can be snapshotted, cloned, and replicated, however. These volumes
    can be suitable for backup purposes.


    Setting `volmode` to `default` means that volume exposure is controlled by the
    `sysctl` `vfs.zfs.vol.mode`. You can set the default `zvol` mode system-wide.
    A value of `1` means the default is `geom`, `2` means `dev`, and `3` means `none`.


    While you can change the property on a live volume, it has no effect. This property
    is processed only during volume creation and pool import. You can recreate the
    `zvol` device by renaming the volume with `zfs rename`.


    # Dataset Integrity


    Most of ZFS’s protections work at the VDEV layer. That’s where blocks and disks
    go bad, after all. Some hardware limits pool redundancy, however. Very few laptops
    have enough hard drives to use mirroring, let alone RAID-Z. You can do some things
    at the dataset layer to offer some redundancy, however, by using checksums, metadata
    redundancy, and copies. Most users should never touch the first two, and users
    with redundant virtual devices probably want to leave all three alone.


    ### Checksums


    ZFS computes and stores checksums for every block that it writes. This ensures
    that when a block is read back, ZFS can verify that it is the same as when it
    was written, and has not been silently corrupted in one way or another. The `checksum`
    property controls which checksum algorithm the dataset uses. Valid settings are
    `on`, `fletcher2`, `fletcher4`, `sha256`, `off`, and `noparity`.


    The default value, `on`, uses the algorithm selected by the OpenZFS developers.
    In 2015 that algorithm is `fletcher4`, but it might change in future releases.


    The standard algorithm, `fletcher4`, is the default checksum algorithm. It’s good
    enough for most use and is very fast. If you want to use `fletcher4` forever and
    ever, you could set this property to `fletcher4`. We recommend keeping the default
    of `on`, however, and letting ZFS upgrade your pool’s checksum algorithm when
    it’s time.


    The value `off` disables integrity checking on user data.


    The value `noparity` not only disables integrity but also disables maintaining
    parity for user data. This setting is used internally by a `dump` device residing
    on a RAID-Z pool and should not be used by any other dataset. Disabling checksums
    is not recommended.


    Older versions of ZFS used the `fletcher2` algorithm. While it’s supported for
    older pools, it’s certainly not encouraged.


    The `sha256` algorithm is slower than `fletcher4`, but less likely to result in
    a collision. In most cases, a collision is not harmful. The `sha256` algorithm
    is frequently recommended when doing deduplication.


    ### Copies


    ZFS stores two or three copies of important metadata, and can give the same treatment
    to your important user data. The `copies` property tells ZFS how many copies of
    user data to keep. ZFS attempts to put those copies on different disks, or failing
    that, as far apart on the physical disk as possible, to help guard against hardware
    failure. When you increase the `copies` property, ZFS also increases the number
    of copies of the metadata for that dataset, to a maximum of three.


    If your pool runs on two mirrored disks, and you set `copies` to `3`, you’ll have
    six copies of your data. One of them should survive your ill-advised use of `dd(1)`
    on the raw provider device or that plunge off the roof.


    Increasing or decreasing `copies` only affects data written after the setting
    change. Changing `copies` from `1` to `2` doesn’t suddenly create duplicate copies
    of all your data, as we see here. Create a 10 MB file of random data:


    ```

    # dd if=/dev/random of=/lamb/random1 bs=1m count=10

    10+0 records in

    10+0 records out

    10485760 bytes transferred in 0.144787 secs (72421935 bytes/sec)

    # zfs set copies=2 mypool/lamb

    ```


    Now every block is stored twice. If one of the copies becomes corrupt, ZFS can
    still read your file. It knows which of the blocks is corrupt because its checksums
    won’t match. But look at the space use on the pool (the `REFER` space in the pool
    listing).


    ```

    # zfs list mypool/lamb

    NAME          USED  AVAIL  REFER  MOUNTPOINT

    mypool/lamb  10.2M  13.7G  10.1M  /lamb

    ```


    Only the 10 MB we wrote were used. No extra copy was made of this file, as you
    wrote it before changing the `copies` property.


    With `copies` set to `2`, however, if we either write another file or overwrite
    the original file, we’ll see different disk usage.


    ```

    # dd if=/dev/random of=/lamb/random2 bs=1m count=10

    10+0 records in

    10+0 records out

    10485760 bytes transferred in 0.141795 secs (73950181 bytes/sec)

    ```


    Look at disk usage now.


    ```

    # zfs list mypool/lamb

    NAME         USED  AVAIL  REFER  MOUNTPOINT

    mypool/lamb  30.2M  13.7G  30.1M  /lamb

    ```


    The total space usage is 30 MB, 10 for the first file of random data, and 20 for
    the second.


    When we look at the files with `ls`, they only show the actual size:


    ```

    # ls -l /lamb/random*

    -rw-r--r--1 root  wheel  10485760 Apr  6 15:27 /random1

    -rw-r--r--1 root  wheel  10485760 Apr  6 15:29 /random2

    ```


    If you really want to muck with your dataset’s resilience, look at metadata redundancy.


    ### Metadata Redundancy


    Each dataset stores an extra copy of internal metadata, so that if a single block
    is corrupted, the amount of data lost is limited. This extra copy is in addition
    to any redundancy at the VDEV level (e.g., by mirroring or RAID-Z). It’s also
    in addition to any extra copies specified by the `copies` property (below), up
    to three copies.


    The `redundant_metadata` property lets you decide how redundant you want your
    metadata to be. Most users should never change this property.


    When `redundant_metadata` is set to `all` (the default), ZFS stores an extra copy
    of all metadata. If a single on-disk block is corrupt, at worst a block of user
    data can be lost.


    When you set `redundant_metadata` to `most`, ZFS stores an extra copy of most
    types of metadata. This can improve performance, because less metadata must be
    written. When only most metadata is redundant, at worst 100 blocks of user data
    can be lost. The exact behavior of which metadata blocks are stored redundantly
    may change in future releases.


    If you set `redundant_metadata` to `most` and `copies` to `3`, and the dataset
    lives on a mirrored pool, then ZFS stores six copies of most metadata, and four
    copies of data and some metadata.


    This property was designed for specific use cases that frequently update metadata,
    such as databases. If data is already protected by sufficiently strong fault tolerance,
    reducing the number of copies of the metadata that must be written each time the
    database changes can improve performance. Change this value only if you know what
    you are doing.


    Now that you have a grip on datasets, let’s talk about pool maintenance.


    [1] Probably badly.


    [2] Properly written setuid programs are not risky. That’s why real setuid programs
    are risky.


    [3] When you name ZFS properties after yourself, you are immortalized by your
    work. Whether this is good or bad depends on your work.


    # Chapter 5: Repairs & Renovations


    Disks fill up. That’s what they’re for. Hardware fails for the same reason. Sometimes
    you must take disks from one machine and put them in another, or replace a failed
    hard drive, or give your database more space. This chapter discusses how you can
    modify, update, and repair your storage pools.


    Before we get into that, let’s discuss how ZFS rebuilds damaged VDEVs.


    ## Resilvering

