  trans: '


    通常，我们建议仅在有迫切需求、且额外的 CPU 开销和较慢的磁盘访问不会影响实际工作的情况下，才将压缩算法更改为 `LZ4`。


    不久前，Lucas 在一家手机公司工作。该公司公司保留了通过其设备打出的每一个通话的十多年的明文通话详细记录（CDR）。这些记录在半夜会被常规访问以运行报告。有时，欺诈调查人员需要使用
    `grep(1)` 和 `awk(1)` 等工具访问这些报告。对于这种用例，启用 `gzip-9` 压缩非常有意义。通过 `du(1)` 测量，ZFS 对文件的压缩率约为
    `8:1`。然而，如果我们需要经常与这些文件进行交互，使用 `LZ4` 并增加几百美元的硬盘会更合逻辑。


    ## 压缩与性能


    来看看这些示例数据的属性。


    ```

    # zfs get all db | grep reference

    db/text  referenced         48.7M   -

    db/text  logicalreferenced  220M    -

    ```


    该数据集使用了 48.7 MB 的磁盘空间。在忽略压缩的情况下，该数据集包含 220 MB 的数据。压缩后的数据集存储的“逻辑数据”可以超过其物理大小。


    这正是压缩有效性真正发挥作用的地方。读写数据最慢的部分将其传输到存储介质上。物理介质是磁盘事务中最慢的部分。向磁盘写入 48.7 MB 所花费的时间仅为写入
    220 MB 的 22%。通过启用压缩，你可以在付出少量 CPU 时间的代价，将存储时间缩短 78%。如果你的磁盘写入速度为 100 MB/s，那么写入那
    48.7 MB 压缩数据大约需要半秒。如果你从写入数据的应用程序角度来看，你实际上是在半秒内写入了 220 MB，有效速度为 440 MB/s。我们敢打赌你没想过你的笔记本硬盘能达到这种速度！


    如果你存储了许多小文件，压缩的效果会较差。小于扇区的文件仍然会被分配一个整个块。如果你想要真正、非常有效的压缩，请使用具有实际 512 字节物理扇区的磁盘，并告诉
    ZFS 使用该扇区大小。


    压缩并非完美。顺序访问和随机访问会改变压缩的性能。请务必在你的环境中使用自己的数据进行测试。压缩的效果非常好，以至于 FreeBSD 在默认安装中启用了 `lz4`
    压缩。


    大多数 CPU 大部分处于空闲状态。让这些懒惰的家伙处理一些数据吧！


    ## 禁用压缩


    要禁用压缩，将数据集的压缩属性设置为 `off`。


    尽管启用压缩只影响新写入的文件，禁用压缩也只影响新数据。已压缩的文件在被重写之前将保持压缩状态。ZFS 足够智能，能够识别文件是否已压缩并在访问时自动解压缩，但这仍然存在开销。


    除了重写所有文件外，你无法从数据集中清除所有压缩痕迹。你可能需要重新创建该数据集。


    ## 去重


    文件会反复重复相同的数据，只是排列方式略有不同。多个文件之间包含更多重复。你系统中超过一半的数据可能是其他处发现数据的重复。ZFS 可以识别文件中的重复数据，提取并记录它们，从而每份数据只存储一次。这与压缩非常相似。在某些情况下，去重可以减少磁盘占用。


    存在许多去重系统。在极端情况下，你可以按字节为单位对所有数据进行去重。你可以通过识别并记录每个字母和标点符号的位置对这本书进行去重，但记录将比实际书籍还要大。在另一个极端，你可以通过只记录每个完整文件一次对多个副本进行去重。


    可以说 ZFS 快照对文件系统数据去重。对于文件去重，ZFS 在文件系统块级进行去重（由 `recordsize` 属性显示）。这使得 ZFS 擅长移除相同文件的重复，但只有当文件的文件系统块完全对齐时，它才会认为文件是重复。使用更小的块可以提高去效果，但会增加内存需求。ZFS
    只存储相同的块，并将去重表存储在内存中。


    按数据集启用去重。每当通过读取或写入去重数据集上的任何文件时，系统必须查询去重表。为了高效去重，系统必须有足够的内存来存放整个去重表。ZFS 将去重表存储在磁盘上，但如果主机每次访问文件都必须查询磁盘上的副本，性能将变得极其缓慢。（主机在启动时必须从磁盘读取去重表，因此无论如何，每次重启都会遇到磁盘抖动。）


    虽然去重听起来非常酷，但在考虑启用它之前，你必须知道你的数据去重效果如何，以及去重需要多少内存。


    ### 去重内存需求


    对于粗略的估算，你可以假设 1 TB 的去重数据使用约 5 GB 的 RAM。你可以通过查看数据池并进行一些计算，更精确地估算你特定数据的内存需求。我们建议始终进行计算并算出你的数据需要多少
    RAM，然后使用最悲观的结果。如果计算出的数字高于 5 GB，请使用你的计算结果。否则，假设每个 TB 使用 5 GB。


    如果你的系统内存不足，性能将像华莱·E·科约特一样暴跌。不要这样伤害自己。


    去重数据集上的每个文件系统块使用约 320 字节。


    ```

    bp count:      139025

    ganged count:       0

    bp logical:18083569152  avg: 130074

    bp physical:   18070658560  avg: 129981 compression:   1.00

    bp allocated:  18076997120  avg: 130026 compression: 1.00

    bp deduped:         0     ref>1:  0   deduplication:   1.00

    SPA allocated: 18076997120 used:  1.81%

    ```


    `bp count` 显示存储在池中的 ZFS 块的总数。该池使用了 139,025 个块。虽然 ZFS 默认的最大块大小为 128 KB，但小文件会使用较小的块。如果池中有许多小文件，你需要更多的内存。


    在倒数第三行中，`used` 条目显示该池的利用率为 1.81%（或 0.0181）。假设该池中的数据在增长时将保持相对一致。将使用的块数向上取整到 140,000。将使用的块除以填充率，我们看到满额池将有
    (140,000 / 0.0181 = ) 7,734,806 个块。按每个块 320 字节计算，这些数据使用 2,475,138,121 字节的内存，约约
    2.3 GB。


    这比经验法则还少一半。假设该池上的 ZFS 去重表每 TB 存储空间需要 5 GB 的 RAM。


