    You can’t increase the size of an existing disk, but you can change how your data
    uses that disk. For decades, sysadmins have compressed files to make them take
    up less space. We’ve written all kinds of shell scripts to run our preferred compression
    algorithm on the files we know can be safely compressed, and we’re always looking
    for additional files that can be compressed to save space. And we all know about
    that previously unknown log file that expands until it fills the partition and
    trips an alarm.[3](#part0010.xhtml_ref_footnotebookmark_end_33_3)


    ZFS takes away that problem by compressing files in real time, at the filesystem
    level. Those log files your daemon writes? ZFS can compress them as they’re written,
    rendering all those scripts irrelevant. This also amortizes the cost of compression
    as the system compresses everything on an ongoing basis rather than in a 3 AM
    frenzy of disk thrashing.


    Compression imposes costs, however. Compression and decompression require CPU
    time, so blindly enabling the tightest `gzip` compression everywhere can add another
    constraint on disk performance. Any performance losses are most often more than
    made up by the reduction in disk activity, however. ZFS includes compression algorithms
    specifically designed for filesystem use.


    ### Enabling Compression


    ZFS compression works on a per-dataset basis. You can enable compression for some
    datasets but not others.


    Enable and disable compression with the `compression` property. Here we check
    the `compression` setting.


    ```

    # zfs get compress zroot/usr

    NAME       PROPERTY     VALUE SOURCE

    zroot/usr  compression  off   default

    ```


    Enable compression by setting the `compression` property. The default compression
    algorithm, `LZJB`, isn’t the most effective algorithm ZFS offers. Use `LZ4` compression
    in almost all cases. Here we enable `LZ4` compression on all datasets on the `zroot`
    pool, but specify `gzip-9` on the `zroot/var/cdr` dataset.


    ```

    # zfs set compress=lz4 zroot

    # zfs set compress=gzip-9 zroot/var/cdr

    ```


    ZFS compresses files when the files are written to disk. If you have a dataset
    full of text files, adding compression won’t make them shrink. To reduce disk
    space used by files, you must rewrite all the files after enabling compression.


    ### Compression Algorithms


    ZFS supports several compression algorithms. The default, `LZJB`, was specifically
    designed for filesystem use. It can quickly compress and decompress blocks with
    a modest compression ratio. It’s not the best compression algorithm for routine
    use, however.


    The `LZ4` algorithm is a newer and faster filesystem-specific compression algorithm.
    It outperforms `LZJB` in all ways. Not all data is compressible, but `LZ4` quickly
    detects incompressible files and doesn’t try to compress them. When you enable
    compression for a dataset, use `LZ4` unless you have a specific use case for `gzip`
    compression.


    The `ZLE` algorithm compresses strings of zeroes in files. It’s a minimal compression
    system, and isn’t terribly useful for most files. `LZ4` is far more effective
    than `ZLE`, even on files with many runs of zeroes.


    For special cases, ZFS supports `gzip` compression. `gzip` uses much more CPU
    time than `LZ4`, but can be more effective for some datasets. The additional CPU
    time `gzip` requires makes the filesystem slower, but for data that’s not accessed
    frequently the disk space savings might be worthwhile.


    `gzip` has nine compression levels, from 1 (the fastest but least effective) to
    9 (the slowest but most aggressive). Specify a `gzip` compression level with a
    dash and the level.


    ```

    # zfs set compress=gzip-1 zroot/var/log

    ```


    If you specify `gzip` without a level, ZFS uses the `gzip` default of level 6.


    ### Compression Properties


    Several properties offer insight into how well ZFS compresses your data.


    The `compressratio` property shows how compression has affected this dataset and
    all its children, while the `refcompressratio` property allows you to see how
    compression has impacted this dataset’s referenced data.


    Datasets have two properties just for compression scenarios, `logicalreferenced`
    and `logicalused`. A dataset’s referenced space includes the effects of compression,
    but the `logicalreferenced` property excludes compression.


    Similarly, the `used` property shows the amount of space actually consumed on
    the dataset and all its children, while `logicalused` shows the amount of uncompressed
    data in the dataset.


    When you study all of these together, you can get a good idea of how compression
    has impacted your data.


    ### Choosing an Algorithm


    How can you tell if your data can benefit from compression, or how different algorithms
    affect file size? Get some of your typical data files and test them. Use `du(1)`
    or `ls –ls` to see a file’s actual size on the disk. In testing your own data,
    you’ll want to use a whole bunch of different files of your actual data. For this
    example, Lucas used the Human Genome Project as downloaded from Project Gutenberg.


    ```

    # du hgp.txt

    280721  hgp.txt

    ```


    Uncompressed, this file takes up 280,721 blocks, or about 274 MB.


    Our test dataset is called `db`. We have no other data on this dataset, so we
    can accurately assess compression’s impact on this particular file. Now that we
    know the test file’s uncompressed size, enable compression and see what happens.


    ```

    # zfs set compression=on db

    ```


    This activates `LZJB` compression. Check the file size now.


    ```

    # du hgp.txt

    280721  hgp.txt

    ```


    The file size hasn’t changed, but we enabled compression. What’s going on? Remember,
    compression, deduplication, and similar features work only on files written after
    the feature is enabled. We must remove the file and put it back.


    ```

    # rm /db

    # cp /home/mwl/hgp.txt /db

    ```


    Wait a few seconds for ZFS to write everything, and see what happens.


    ```

    # du db/hgp.txt

    139577  hgp.txt

    ```


    This file uses 139,577 blocks, or about 136 MB. It’s shrunk about half, as the
    dataset properties show.


    ```

    # zfs get compressratio,refcompressratio db

    NAME  PROPERTY          VALUE SOURCE

    db    compressratio     2.01x  -

    db    refcompressratio  2.01x  -

    ```


    The `refcompressratio` equals the `compressratio` because we have only one chunk
    of data on this dataset and one dataset on this pool. On more complex pools, the
    values will probably differ.


    So, the default algorithm reduced the size by half. Let’s try the more efficient
    `lz4`.


    ```

    # zfs set compression=lz4 db

    ```


    Recopy the file to trigger `LZ4` compression, wait a few seconds for ZFS to do
    its accounting, and see what happens.


    ```

    # du db/hgp.txt

    146076  hgp.txt

    ```


    LZ4 compresses this data to 142 MB. LZ4 is not as effective as `LZJB` on this
    particular file. That’s not terribly shocking—different algorithms work differently
    on different data.


    Would `gzip` improve things further?


    ```

    # zfs set compress=gzip-1 db

    ```


    Re-copy the test file to the dataset and check the disk usage.


    ```

    # du db/hgp.txt

    74104   hgp.txt

    ```


    This data now uses about 72 MB, and the dataset now has a `compressratio` of 3.78\.
    `gzip` is clearly a better match for this particular data. Compression almost
    quadrupled our effective disk space. While that’s fairly impressive, let’s turn
    up the volume.


    ```

    # zfs set compress=gzip-9 db

    # cp /home/mwl/hgp.txt /db

    # du db/hgp.txt

    63614   hgp.txt

    ```


    Cranking up the compression to `gzip-9` reduces this 274 MB file to 62 MB, with
    a `compressratio` of 4.41\. `gzip-9` more than quadruples how much data we can
    store.


    This example cheats, though. Really, really cheats. As in, “writes the formulas
    on the palm of its hand before the physics test” cheats.


    With the exception of the boilerplate added by Project Gutenberg, the Human Genome
    Project is composed entirely of four letters. It is perhaps the most redundant,
    most compressible real-world data that exists.[4](#part0010.xhtml_ref_footnotebookmark_end_33_4)

