    directories contain programs, and should never be written to after installation.
    Other directories contain data. You must lock down the ability to run programs
    at the filesystem level.


    ```

    # zfs create db/programs

    # zfs create db/data

    ```


    Now give both of these datasets the mountpoint of /opt and tell them that they
    cannot be mounted.


    ```

    # zfs set canmount=off db/programs

    # zfs set mountpoint=/opt db/programs

    ```


    Install your programs to the dataset, and then make it read-only.


    ```

    # zfs set readonly=on db/programs

    ```


    You can’t run programs from the db/data dataset, so turn off exec and setuid.
    We need to write data to these directories, however.


    ```

    # zfs set canmount=off db/data

    # zfs set mountpoint=/opt db/data

    # zfs set setuid=off db/data

    # zfs set exec=off db/data

    ```


    Now create some child datasets. The children of the db/programs dataset inherit
    that dataset’s properties, while the children of the db/data dataset inherit the
    other set of properties.


    ```

    # zfs create db/programs/bin

    # zfs create db/programs/sbin

    # zfs create db/data/test

    # zfs create db/data/production

    ```


    We now have four datasets mounted inside /opt, two for binaries and two for data.
    As far as users know, these are normal directories. No matter what the file permissions
    say, though, nobody can write to two of these directories. Regardless of what
    trickery people pull, the system won’t recognize executables and setuid files
    in the other two. When you need another dataset for data or programs, create it
    as a child of the dataset with the desired settings. Changes to the parent datasets
    propagate immediately to all the children.


    ### Pools without Mount Points


    While a pool is normally mounted at a directory named after the pool, that isn’t
    necessarily so.


    ```

    # zfs set mountpoint=none mypool

    ```


    This pool no longer gets mounted. Neither does any dataset on the pool unless
    you specify a mount point. This is how the FreeBSD installer creates the pool
    for the OS.


    ```

    # zfs set mountpoint=/someplace mypool/lamb

    ```


    The directory will be created if necessary and the filesystem mounted.


    ### Manually Mounting and Unmounting Filesystems


    To manually mount a filesystem, use zfs mount and the dataset name. This is most
    commonly used for filesystems with canmount set to *noauto*.


    ```

    # zfs mount mypool/usr/src

    ```


    To unmount a filesystem and all of its children, use zfs unmount.


    ```

    # zfs unmount mypool/second

    ```


    If you want to temporarily mount a dataset at a different location, use the -o
    flag to specify a new mount point. This mount point only lasts until you unmount
    the dataset.


    ```

    # zfs mount -o mountpoint=/mnt mypool/lamb

    ```


    You can only mount a dataset if it has a mountpoint defined. Defining a temporary
    mount point when the dataset has no mount point gives you an error.


    ## ZFS and /etc/fstab


    You can choose to manage some or all of your ZFS filesystem mount points with
    /etc/fstab if you prefer. Set the dataset’s mountpoint property to *legacy*. This
    unmounts the filesystem.


    ```

    # zfs set mountpoint=legacy mypool/second

    ```


