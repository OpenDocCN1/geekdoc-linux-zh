    The `zpool(8)` command points out the mistake, and then tells you how to insist.
    We normally take these kinds of errors as a way of saying the sysadmin needs more
    caffeine, but maybe you really intended it. Running `zpool create -f` with the
    specified `VDEV` types and storage providers tells ZFS that yes, you fully intended
    to create a malformed pool. Hey, it’s your system; you’re in charge.


    If ZFS doesn’t want you to do something, you probably shouldn’t. When you use
    `-f`, you’re creating something that ZFS isn’t designed to handle. You can easily
    create a pool that won’t work well and `cannot` be repaired.


    ## Reusing Providers


    We sometimes create and destroy pools more than once to get them right. We might
    pull disks from one machine and mount them in another. Sometimes we encounter
    a disk that we’ve used before.


    ```

    # zpool create db gpt/zfs1 gpt/zfs2 gpt/zfs3 gpt/zfs4

    invalid vdev specification

    use ''-f'' to override the following errors:

    /dev/gpt/zfs3 is part of exported pool ''db''

    ```


    We used this disk in another pool, which we later exported (see Chapter 5). The
    problem disk was used in that pool, and the ZFS label remained on the disk. While
    we erased and recreated the partition table, the new partition table happens to
    be precisely identical to the previous one. ZFS easily finds the old metadata
    in this case.


    If you’re absolutely sure this provider doesn’t have anything important on it,
    follow the instructions and force creation of the new pool with `-f`.


    ```bash

    # zpool create -f db gpt/zfs1 gpt/zfs2 gpt/zfs3 gpt/zfs4

    ```


    The ZFS programs can be very picky about where your command-line flags go, so
    be sure the `-f` immediately follows `create`.


    ## Pool Integrity


    One common complaint about ZFS is that it has no filesystem checker, such as `fsck(8)`.
    An offline file checker wouldn’t improve ZFS because the online pool integrity
    checker verifies everything that `fsck(8)` checks for and more. The online checker
    is also much more effective than a traditional filesystem would ever let `fsck(8)`
    be. Let’s talk about how ZFS ensures file integrity, and then how pool scrubbing
    helps maintain integrity.


    ### ZFS Integrity


    Storage devices screw up. When you have trillions of sectors on any sort of disk,
    the odds of a stray cosmic ray striking one hard enough to make it stagger around
    drunkenly go way up—as well as the odds of a write error, or a power failure,
    or a short in a faulty cable, or any number of other problems. No filesystem can
    prevent errors in the underlying hardware.


    ZFS uses `hashes` almost everywhere. A hash is a mathematical algorithm that takes
    a chunk of data and computes a fixed-length string from it. The interesting thing
    about a hash is that minor changes in the original data dramatically change the
    hash of the data. Each block of storage includes the hash of its parent block,
    while each parent block includes the hash of all its children.


    While ZFS cannot prevent storage provider errors, it uses these hashes to detect
    them. Whenever the system accesses data, it verifies the checksums. ZFS uses the
    pool’s redundancy to repair any errors before giving the corrected file to the
    operating system. This is called `self-healing`.


    If the underlying VDEVs have redundancy, ZFS either reconstructs the damaged block
    from RAID-Z or grabs the intact copy from the mirror. If both sides of a mirror
    have errors, ZFS can recover the files so long as the same data is not bad on
    both disks. If the `VDEV` has no redundancy, but a dataset has extra copies of
    the data (see Chapter 4), ZFS uses those extra copies instead.


    If the underlying VDEV has no redundancy, and the dataset does not keep extra
    copies, the pool notes that the file is damaged and returns an error, instead
    of returning incorrect data. You can restore that file from backup, or throw it
    away.


    While ZFS performs file integrity checks, it also verifies the connections between
    storage blocks. This is the task performed by `fsck(8)` in traditional filesystems.
    It’s a small part of data verification, and ZFS performs this task continually
    as part of its normal operation. ZFS has an additional advantage over `fsck(8)`
    in that it checks only blocks that actually exist, rather than used and unused
    inodes. If you want to perform a full integrity check on all data in a pool, scrub
    it.


    The nice thing about hash-based integrity checking is that it catches all sorts
    of errors, even unexpected ones. Remember, happy filesystems are all alike; every
    unhappy filesystem is unhappy in its own way.


    ### Scrubbing ZFS


    A `scrub` of a ZFS pool verifies the cryptographic hash of every data block in
    the pool. If the scrub detects an error, it repairs the error if sufficient resiliency
    exists. Scrubs happen while the pool is online. If the scrub detects an error,
    it repairs the error if sufficient resiliency exists. Scrubs happen while the
    pool is online.


    If your system identified any errors, they’ll show up in the `zpool status`. The
    pool has encountered no errors.


    ```bash

    # zpool status

    scan: scrub in progress since Tue 24 11:52:23

    12.8G out of 17.3G at 23.0M/s, 0h3m to go

    0 repaired

    ```


    To search the pool for errors, use `scrub`. Run `zpool scrub` the pool name.


    ```bash

    # zpool scrub zroot

    ```


    Scrubs run in the background. You can see how they’re doing by running `zpool
    status`.


    ```bash

    # zpool status

    scan: scrub in progress since Tue 24 11:52:23

    12.8G out of 17.3G at 23.0M/s, 0h3m to go

    0 repaired,74% done

    ```


    If your system is already pushing performance limits, scrub pools only during
    off-peak hours. If you must cancel an ongoing scrub, run `zpool scrub -s`.


    ```bash

    # zpool scrub -s zroot

    ```


    ### Scrub Frequency


    ZFS’ built-in integrity testing and resiliency mean that most errors are fixable,
    provided that they are found early enough. This means that your hardware’s quality
    dictates how often you should scrub a host’s pools. If you have reliable hardware,
    such as so-called “server grade” gear, scrubbing quarterly should suffice. If
    you’re abusing cheap hardware, you should scrub every month or so.


    FreeBSD can perform regular scrubs for you, as discussed in “ZFS Maintenance Automation”
    later this chapter.


    ## Pool Properties


    ZFS uses properties to express a pool’s characteristics. While `zpool` properties
    look and work much like a dataset’s properties, and many properties seem to overlap
    between the two, dataset properties have no relationship to pool properties. Pool
    properties include facts such as the pool’s health, size, capacity, and per-pool
    features.


    A pool’s properties affect the entire pool. If you want to set a property for
    only part of a pool, check for a per-dataset property that fits your needs.


    ### Viewing Pool Properties


    To view all the properties of all the pools on your system, run `zpool get all`.
    You can add a pool name to the end if you want only the properties on a specific
    pool. Here we look at the properties for the pool `zroot`.


    ```

    # zpool get all zroot

    NAME   PROPERTY  VALUE   SOURCE

    zroot  size      920G    -

    zroot  capacity  1%      -

    zroot  altroot   -       default

    zroot  health    ONLINE  -

    ```


    The first two columns give the pool name and the name of the property. The third
    column lists the value of the property. This can be something like `enabled` or
    `disabled`, `on` or `off`, `active` or `inactive`, or it can be a value. This
    pool’s size property is 920G—this pool has 920 GB of space.

