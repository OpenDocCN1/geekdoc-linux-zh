    # Chapter 3: Pools


    ZFS pools, or *zpools*, form the middle of the ZFS stack, connecting the lower-level
    virtual devices to the user-visible filesystem. Pools are where many filesystem-level
    tasks happen, such as allocating blocks of storage. At the ZFS pool level you
    can increase the amount of space available to your ZFS dataset, or add special
    virtual devices to improve reading or writing performance.


    ## ZFS Blocks


    Traditional filesystems such as UFS and extfs place data on the disk in fixed-size
    blocks. The filesystem has special blocks, called *inodes*, that index which blocks
    belong to which files. Even non-Unix filesystems like NTFS and FAT use similar
    structures. It’s a standard across the industry.


    ZFS does not pre-configure special index blocks. It only uses storage blocks,
    also known as stripes. Each block contains index information to link the block
    to other blocks on the disk in a tree. ZFS computes hashes of all information
    in the block and stores the information in the block and in the parent block.
    Each block is a complete unit in and of itself. A file might be partially missing,
    but what exists is coherent.


    Not having dedicated special index blocks sounds great, but surely ZFS needs to
    start somewhere! Every data tree needs a root. ZFS uses a special block called
    an *uberblock* to store a pointer to the filesystem root. ZFS never changes data
    on the disk—rather, when a block changes, it writes a whole new copy of the block
    with the modified data. (We discuss this copy-on-write behavior in depth in Chapter
    6.) A data pool reserves 128 blocks for uberblocks, used in sequence as the underlying
    pool changes. When the last uberblock gets used, ZFS loops back to the beginning.


    The uberblocks are not the only critical blocks. ZFS copies blocks containing
    vital information like filesystem metadata and pool data into multiple *ditto
    blocks*. If a main block is damaged, ZFS checks the ditto block for a backup copy.
    Ditto blocks are stored as far as possible from each other, either on separate
    disks or on separate parts of a single disk. (ZFS has no special ability to see
    the layout of the disk hardware, but it makes a valiant guess.)


    ZFS commits changes to the storage media in transaction groups, or txg. Transaction
    groups contain several batched changes, and have an incrementing 64-bit number.
    Each transaction group uses the next uberblock in line. ZFS identifies the most
    current uberblock out of the group of 128 by looking for the uberblock with the
    highest transaction number.


    ZFS does use some blocks for indexing, but these znodes and dnodes can use any
    storage block in the pool. They aren’t like UFS2 or extfs index nodes, assigned
    when creating the filesystem.


    ## Stripes, RAID, and Pools


    You’ve certainly heard the word *stripe* in connection with storage, probably
    many times. A ZFS pool “stripes” data across the virtual devices. A traditional
    RAID “stripes” data across the physical devices. What is a stripe, and how does
    it play into a pool?


    A stripe is a chunk of data that’s written to a single device. Most traditional
    RAID uses a 128 KB stripe size. When you’re writing a file to a traditional RAID
    device, the RAID software writes to each drive in 128 KB chunks, usually in parallel.
    Similarly, reads from a traditional RAID array take place in increments of the
    stripe size. While you can customize the stripe size to fit a server’s workload,
    the hardware’s capacity and the software’s limitations greatly restrict stripe
    size.


    Stripes do not provide any redundancy. Traditional RAID gets its redundancy from
    parity and/or mirroring. ZFS pools get any redundancy from the underlying VDEVs.


    ZFS puts stripes on rocket-driven roller skates. A ZFS dataset uses a default
    stripe size of 128 KB, but ZFS is smart enough to dynamically change that stripe
    size to fit the equipment and the workload. If a 32 KB stripe size makes sense
    for a particular chunk of data, but 64 KB makes sense for another piece of data,
    ZFS uses the appropriate size for each one. The ZFS developers have completed
    support for stripe sizes up to 1 MB. This feature is already available in FreeBSD-CURRENT,
    and is expected to be included in FreeBSD 10.2 and later.'
