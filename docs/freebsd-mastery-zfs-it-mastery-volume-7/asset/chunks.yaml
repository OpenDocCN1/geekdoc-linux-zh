    如果你想使用 FreeBSD 安装程序完成安装，你必须为安装程序提供一个可识别的系统。这意味着要遵循参考安装中的步骤，即使你不确定为什么在数据集创建步骤的最后要导出并导入池（pool）。总而言之，我们建议添加你自己的数据集，但保持默认设置不变。


    以下是参考 FreeBSD 主机上 `zpool` 历史的一些片段，省略了时间戳。


    ```

    zfs create -o mountpoint=none zroot/ROOT

    zfs create -o mountpoint=/ zroot/ROOT/default

    zfs create -o mountpoint=/tmp -o exec=on -o setuid=off zroot/tmp

    zfs create -o mountpoint=/usr -o canmount=off zroot/usr

    zfs create zroot/usr/home

    zfs create -o setuid=off zroot/usr/ports

    zfs create zroot/usr/src

    zfs create -o mountpoint=/var -o canmount=off zroot/var

    zfs create -o exec=off -o setuid=off zroot/var/crash

    zfs create -o exec=off -o setuid=off zroot/var/log

    zfs create -o atime=on zroot/var/mail

    zfs create -o setuid=off zroot/var/tmp

    zpool set bootfs=zroot/ROOT/default zroot

    zpool set cachefile=/mnt/boot/zfs/zpool.cache zroot

    ```


    你可以轻松地在此基础上添加或更改自己的数据集，例如创建 `zroot/var/mysql` 或将 `/home` 从 `/usr` 下移出，或者你想要的任何操作。


    创建数据集需要大量的输入。正如在 *FreeBSD Mastery: Storage Essentials* 中讨论的那样，我们建议创建安装脚本。


    一旦准备好数据集，退出命令行分区界面，安装程序将恢复。


    ### 安装后设置


    一旦安装程序完成文件复制到磁盘、设置网络等操作，你将有机会进入已安装的系统进行更改。抓住这个机会。你必须在完成后的系统中更改一些设置。


    确保 `ZFS` 在 `/etc/rc.conf` 中启动。这会在系统启动时挂载你的文件系统数据集。


    ```

    zfs_enable=yes

    ```


    编辑 `/boot/loader.conf` 以告诉 FreeBSD 在启动时加载 `ZFS` 和相关的内核模块。


    ```

    zfs_load="YES"

    ```


    你也可以在这里进行你喜欢的任何其他系统更改。


    虽然某些文档提到了其他必要步骤（例如复制池缓存文件），但现在已不再需要了。


    完成后重启，你将进入一个全新的、自定义的 FreeBSD 安装系统！


    ### 手动安装 FreeBSD


    如果你必须通过命令行对磁盘进行分区，那么你不如自己手动将 FreeBSD 文件写入磁盘。FreeBSD 分发文件位于 `/usr/freebsd-dist`，你使用
    `tar(1)` 将它们写入磁盘。你的安装目标被挂载在 `/mnt` 中。


    ```

    # tar --unlink -xpJf base.txz -C /mnt

    # tar --unlink -xpJf kernel.txz -C /mnt

    ```


    你可以安装其他发行集，但基础系统和内核是唯一的关键部分。


    你的安装需要一个 `/etc/fstab`，至少用于交换文件（swap files）。在 `/mnt/etc/fstab` 中创建它。你也可以编辑关键系统文件，如
    `/mnt/etc/rc.conf` 和 `/mnt/boot/loader.conf`。


    通过一些工作和测试，你可以让你的 ZFS 安装变得你想要的任何简单或复杂。


    就像你可以使用 `ZFS` 一样。


    ### 后记


    一本关于文件系统的整本书？你疯了吗？


    `ZFS` 确实仅仅是一个文件系统，是的。但它包含了许多文件系统甚至无法想象的功能。你永远不会尝试将自愈功能硬塞进 `extfs`，或将可变块大小强入 `UFS2`。写时复制（Copy
    on write）必须构建在文件系统的核心中——你无法对现有的文件系统进行后期改造。


    通过基于数十的文件系统经验并针对现代及未来的硬件，`ZFS` 不仅改变了我们管理数字存储的方式。它改变了我们思考存储的方式。`ZFS` 的灵活性和力量使得许多长久的“系统管理最佳实践”过。当你的文件系统是一个盟友而不是威胁时，一切都会变得异常地简单。


    `OpenZFS` 的持续增长带来了新功能、稳定的改进以及一种商业供应商无法提供的未来。`OpenZFS` 每周都变得更加令人，拥有新功能和更强的性能。它也变得“不那么令人”了，因为它随着每个版本的发布都在越来越多地保护你的数据。我们非常幸运能成为这个伟大项目的一员，并乐幸能借此机会与你分享我们的兴奋。


    虽然 Lucas 在写此书之前在使用 `ZFS`，但 Jude 使用大量的 `ZFS` 在世界各地传递大量内容。Jude 是一个 `FreeBSD` 文档提交者，而
    Lucas 写过很多大部头。在一起，我们创造了一本比我们任何一人单独完成都更强大的书。


    请关注我们后续更多的 `ZFS` 内容。在 *FreeBSD Mastery: Advanced ZFS* 中，我们将带你进入几年前还无法想象的奇特新文件系统领域。


