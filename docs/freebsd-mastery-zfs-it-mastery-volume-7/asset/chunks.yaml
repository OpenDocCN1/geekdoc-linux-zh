  trans: '


    我们在 `/usr` 下有各种数据集，但并没有名为 `/usr` 的数据集被挂载。这是怎么了？


    `zfs list` 显示该数据集存在，并且它的挂载点为 `/usr`。但让我们检查 `zroot/usr` 及其所有子数据集的 `mountpoint`
    和 `canmount` 属性。


    ```

    # zfs list -o name,canmount,mountpoint -r zroot/usr

    NAME          CANMOUNT  MOUNTPOINT

    zroot/usr          off  /usr

    zroot/usr/home     on   /usr/home

    zroot/usr/ports    on   /usr/ports

    zroot/usr/src      on   /usr/src

    ```


    由于 `canmount` 被设置为 `off`，`zroot/usr` 数据集永远不会被挂载。写入到 `/usr` 中的任何文件（例如 `/usr/bin`
    中的命令和 `/usr/local` 中的软件包）都将进入根文件系统。较低层级的挂载点（如 `/usr/src`）拥有它们自己的数据集，并且这些数据集是被挂载的。


    该数据集存在仅是为了作为子数据集的父节点。你在 `/var` 分区上也会看到类似的情况。


    ## 具有相同挂载点的多个数据集


    将 `canmount` 设置为 `off` 允许数据集仅作为继承属性的机制。将 `canmount` 设置为 `off` 的原因之一是让两个数据集具有相同的挂载点，以便这两个数据集的子项出现在同一个目录下，但可能具有不同的继承特性。


    FreeBSD 的安装程序在默认池 `zroot` 上没有设置 `mountpoint`。当你创建一个新数据集时，必须为它分配一个挂载点。


    如果你不想为直接在池下创建的每个数据集分配挂载点，可以为 `zroot` 池分配一个为 `/` 的 `mountpoint`，并保持 `canmount`
    设置为 `off`。这样，当你创建一个新数据集时，它就有一个可以继承的 `mountpoint`。这是一个使用具有相同挂载点的多个数据集的简单示例。


    假设你有一个 `/opt` 目录，包含两组子目录。其中一些目录包含程序，在安装后永远不应被写入。其他目录包含数据。你必须在文件系统级别锁定运行程序的能力。


    ```

    # zfs create db/programs

    # zfs create db/data

    ```


    现在为这两个数据集都赋予 `/opt` 的 `mountpoint`，并告诉它们不能被挂载。


    ```

    # zfs set canmount=off db/programs

    # zfs set mountpoint=/opt db/programs

    ```


    将你的程序安装到该数据集，然后将其设置为只读。


    ```

    # zfs set readonly=on db/programs

    ```


    你无法从 `db/data` 数据集运行程序，因此关闭 `exec` 和 `setuid`。然而，我们需要向这些目录写入数据。


    ```

    # zfs set canmount=off db/data

    # zfs set mountpoint=/opt db/data

    # zfs set setuid=off db/data

    # zfs set exec=off db/data

    ```


    现在创建一些子数据集。`db/programs` 数据集的子项继承该数据集的属性，而 `db/data` 数据集的子项继承另一组属性。


    ```

    # zfs create db/programs/bin

    # zfs create db/programs/sbin

    # zfs create db/data/test

    # zfs create db/data/production

    ```


    现在我们在 `/opt` 内部挂载了四个数据集，两个用于二进制文件，两个用于数据。对于用户来说，这些都是普通的目录。然而，无论文件权限如何，都没有人能向其中两个目录写入内容。无论人们采取什么种花招，系统都不会识别另外两个目录中的可执行文件和
    `setuid` 文件。当你需要另一个用于数据或程序的数据集时，将其创建为具有所需设置的数据集的子项。对父数据集的更改会立即传播到所有子项。


    ## 不带挂载点的池


    虽然池通常挂载在与池同名的目录下的，但情况并不一定如此。


    ```

    # zfs set mountpoint=none mypool

    ```


    该池不再被挂载。除非你指定了挂载点，否则该池上的任何数据集都不会挂载。这就是 FreeBSD 安装程序为操作系统创建池的方式。


    ```

    # zfs set mountpoint=/someplace mypool/lamb

    ```


    如果有必要，将创建该目录并挂载文件系统。

    ## 手动挂载和卸载文件系统


    要手动挂载文件系统，请使用 `zfs mount` 和数据集名称。这最常用于 `canmount` 设置为 `noauto` 的文件系统。


    ```

    # zfs mount mypool/usr/src

    ```


    卸载文件系统及其所有子项，请使用 `zfs unmount`。


    ```

    # zfs unmount mypool/second

    ```


    如果你想在不同的位置临时挂载数据集，请使用 `-o` 标志来指定新的挂载点。该挂载点仅持续到你卸载数据集为止。


    ```

    # zfs mount -o mountpoint=/mnt mypool/lamb

    ```


    只有当数据集定义了 `mountpoint` 时，你才能挂载它。当数据集没有挂载点时定义临时挂载点将导致错误。


    ## ZFS 和 /etc/fstab


    如果你愿意，可以选择通过 `/etc/fstab` 来管理部分或全部 ZFS 文件系统挂载点。将数据集的 `mountpoint` 属性设置为 `legacy`。这会卸载文件系统。


    ```

    # zfs set mountpoint=legacy mypool/second

    ```


    现在你可以使用 `mount` 命令挂载该数据集：


    ```

    # mount -t zfs mypool/second /someplace

    ```


    如果有必要，将创建目录并挂载文件系统。你也可以将 ZFS 数据添加到 `/etc/fstab`。使用完整数据集名称作为设备。将类型设置为 `zfs`。你也可以设置
    `atime`, `exec` 等默认值。


    我们建议使用 ZFS 属性来管理你的挂载，然而。

    ## 调整 ZFS 卷


    Zvols 非常直观——这里作为块设备提供了一块空间；使用它。你可以调整卷使用空间的方式以及它提供的设备。


    ### 空间预留


    zvol 的 `volsize` 属性指定卷的逻辑大小。默认情况下，创建卷会为数据集预留相应的空间。（如果你查阅第 6 章，它建立了同等大小的）预留。`volsize`
    只能设置为 `volblocksize` 属性的倍数，且不能为零。


    如果没有预留，卷可能会耗尽空间，根据卷的使用情况，会导致未定义的行为或数据损坏。这些效应也可能发生在卷的大小发生更改时，特别是在缩小大小时。调整卷的大小会误导使用设备的应用程序。


    Zvols 还支持*稀疏卷*（sparse volumes），也称为*精简配置*（thin provisioning）。稀疏卷是指预留空间小于卷大小的卷。本质上使用稀疏卷允许分配超过数据集可用的空间。通过精简配置，你可以在
    5 TB 的数据集上创建十 1 TB 的稀疏卷。只要你的卷没有被频繁使用，没有人会注意到你过度分配了。


    不建议使用稀疏卷。写入稀疏卷可能会遇到“空间不足”错误，即使卷本身看起来只部分满了。


    通过向 `zfs create -V` 命令指定 `-s` 在创建时指定稀疏卷。`volsize` 的更改不会反映在预留中。你也可以在卷创建后减少预留。


    ### Zvol 模式


    FreeBSD 通常将 zvols 作为 `geom(4)` 提供者暴露给操作系统，提供了最大的灵活性。你可以通过 `volmode` 属性更改此。


    将卷的 `volmode` 设置为 `dev` 将卷仅作为 `/dev` 中的字符设备暴露。卷只能作为原始磁盘设备文件访问。它们不能被分区或挂载，无法参与
    RAID 或其他 GEOM 功能。它们速度更快。在某些你不信任使用卷的设备的情况下，`dev` 模式可能更安全。


