- fmt: '

    RAID-Z has a number of advantages compared to traditional RAID, but the biggest
    ones come from the fact that ZFS is the volume manager and the filesystem in addition
    to the disk redundancy layer.


    Back in the day, filesystems could only work on one disk. If you had two disks,
    you needed two separate filesystems. Traditional RAID let you combine multiple
    disks into one virtual disk, permitting the creation of massive disks as large
    as 100 MB, or even bigger! Then the operating system puts its own filesystem on
    top of that, without any understanding of how the blocks will be laid out on the
    physical disks. At the same time, RAID could provide fault tolerance. Given the
    limitations of hardware and software at the time, RAID seemed a pretty good bet.


    By combining the filesystem and the volume manager, ZFS can see exactly where
    all data lies and how the storage layer and the data interact. This allows ZFS
    to make a number of important decisions, such as ensuring that extra copies of
    important data such as `ditto blocks` (Chapter 3) are stored on separate disks.
    It does no good to have two or three copies of your critical data all on one underlying
    storage provider that can be wiped out by a single hardware failure. ZFS goes
    so far as to put the `ditto blocks` on adjacent disks, because it is statistically
    less likely that if two disks fail concurrently, they will be neighbors.


    Traditional RAID can suffer from a shortcoming known as the “write hole,” where
    two-step operations get cut short halfway through. `RAID 5` and `RAID 6` devices
    chunk up data to be written to all of the data disks. Once this operation finishes,
    a parity block is calculated and stored on the parity disk. If the system crashes
    or the power is cut after the data is written but before the parity is written,
    the disk ends up in an indeterminate state. When the system comes back up, the
    data does not match the parity. The same thing can happen with mirrored drives
    if one drive finishes updating and the other does not.


    Write hole problems are not noticed until you replace a failed disk. The incorrect
    parity or incorrect mirror results in the RAID device returning garbage data to
    the filesystem. Traditional filesystems return this garbage data as the contents
    of your file.


    ZFS solves these problems with copy-on-write and checksums. Copy-on-write (Chapter
    7) means data is never overwritten in place. Each update is transactional, and
    either completes fully or is not performed, returning the system to the state
    it was in before the update. ZFS also has checksums, so it can detect when a drive
    returns invalid data. When ZFS detects invalid data it replaces that data with
    the correct data from another source, such as additional copies of the data, mirrored
    drives, or `RAID-Z` parity. Combined, these create ZFS’ self-healing properties.


    ## Special VDEVs


    Pools can use special-purpose VDEVs to improve the performance of the pool. These
    special VDEV types are not used to persistently store data, but instead temporarily
    hold additional copies of data on faster devices.


    ### Separate Intent Log (SLOG, ZIL)


    ZFS maintains a ZFS Intent Log (`ZIL`) as part of the pool. Similar to the journal
    in some other filesystems, this is where it writes in-progress operations, so
    they can be completed or rolled back in the event of a system crash or power failure.
    The `ZIL` is subject to the disk’s normal operating conditions. The pool might
    have a sudden spike in use or latency related to load, resulting in slower performance.


    One way to boost performance is to separate the `ZIL` from the normal pool operations.
    You can use a dedicated device as a Separate Intent Log, `SLOG`, rather than using
    a regular part of the pool. The dedicated device is usually a small but very fast
    device, such as a very high-endurance SSD.


    Rather than copying data from the `SLOG` to the pool’s main storage in the order
    it’s received, ZFS can batch the data in sensible groups and write it more efficiently.


    Certain software insists on receiving confirmation that data it writes to disk
    is actually on the disk before it proceeds. Databases often do this to avoid corruption
    in the event of a system crash or power outage. Certain NFS operations do the
    same. By writing these requests to the faster log device and reporting “all done,”
    ZFS accelerates these operations. The database completes the transaction and moves
    on. You get write performance almost at an SSD level, while using inexpensive
    disk as the storage media.


    You can mirror your `ZIL` to prevent data loss.


    ### Cache (L2ARC)


    When a file is read from disk, the system keeps it in memory until the memory
    is needed for another purpose. This is old technology, used even back in the primordial
    BSD days. Look at `top(1)` on a UFS-based BSD system and you’ll see a chunk of
    memory labeled `Buf`. That’s the buffer cache.


    The traditional buffer cache was designed decades ago, however. ZFS has an Adaptive
    Replacement Cache, `ARC`, designed for modern hardware, that gives it more speed.
    The `ARC` retains the most recently and frequently accessed files.


    Very few modern systems have enough RAM to cache as much as they want, however.
    Just as ZFS can use a `SLOG` to accelerate writes, it can use a very fast disk
    to accelerate reads. This is called a Level 2 ARC, `L2ARC`.


    When an object is used frequently enough to benefit from caching, but not frequently
    enough to rate being stored in RAM, ZFS can store it on a cache device. The `L2ARC`
    is typically a very fast and high-endurance SSD or NVMe device. Now, when that
    block of data is requested, it can be read from the faster SSD rather than the
    slower disks that make up the rest of the pool. ZFS knows which data has been
    changed on the back-end disk, so it can ensure that the read cache is synchronized
    with the data on the storage pool.


    ## How VDEVs Affect Performance


    Each different type of VDEV performs differently. Benchmarking and dissecting
    disk performance is a complex topic that would merit a great textbook, if anyone
    would be bothered to read it. Any specific advice we were to give would quickly
    become obsolete, so let’s just discuss some general terms.


    One common measurement is Input/Output Per Second `IOPS`, the number of distinct
    operations the drive can perform each second. Spinning drive `IOPS` are usually
    physically limited by how quickly the read/write head can move from place to place.
    Solid state disks have such excellent performance because they don’t need to physically
    move.


    The number of non-parity spindles constrains streaming read and write performance
    of an undamaged pool. “Streaming” performance boils down to the number of megabytes
    per second (`MB/s`) the drive can read or write. When a drive reads or writes
    data sequentially, the heads do not have to seek back and forth to different locations.
    It is under these conditions that a drive will achieve its best possible streaming
    performance. Spindle count affects both random and streaming performance. An array
    of 12 one-terabyte (`12 x 1 TB`) drives usually outperforms an array of six two-terabyte
    (`6 x 2 TB`) drives because the greater spindle and head counts increase both
    `IOPS` and streaming performance. Having more heads means that ZFS can be reading
    from, or writing to, more different locations on the disks at once, resulting
    in greater `IOPS` performance. More spindles mean more disks working as fast as
    they can to read and write your data. The greater number of drives require a larger
    shelf or chassis, more power, and more controllers.


    Other common measurements include read bandwidth, write bandwidth, space efficiency,
    and streaming performance.


    Generally speaking, mirrors can provide better `IOPS` and read bandwidth, but
    `RAID-Z` can provide better write bandwidth and much better space efficiency.

    '
