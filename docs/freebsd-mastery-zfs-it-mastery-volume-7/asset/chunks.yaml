    \ distributes data between the VDEVs, use zpool list -v.\n\n### Adding VDEVs to\
    \ RAID-Z Pools\n\nYou cannot add providers to any RAID-Z VDEV. To expand a RAID-Z-based\
    \ pool, you must add additional VDEVs to the pool, or replace each member disk\
    \ with a larger one. Best practice is to make all of the RAID-Z VDEVs use the\
    \ same number of drives.\n\nHere’s a RAID-Z pool that we want to expand with another\
    \ VDEV.\n\n```\nconfig\n\nNAME        STATE READ WRITE CKSUM\ndb          ONLINE\
    \   0     0     0\n raidz1-0   ONLINE   0     0     0\n  gpt/zfs0  ONLINE   0\
    \     0     0\n  gpt/zfs1  ONLINE   0     0     0\n  gpt/zfs2  ONLINE   0    \
    \ 0     0\n```\n\nAgain, we use the zpool add command to create a new VDEV and\
    \ add it to the pool.\n\n```\n# zpool add db raidz1 gpt/zfs3 gpt/zfs4 gpt/zfs5\n\
    ```\n\nA check of the pool status shows a new VDEV, raidz1-1, containing three\
    \ providers. ZFS starts striping data across the new provider immediately.\n\n\
    If you want to add a new VDEV to a RAID-Z2 or RAID-Z3-based pool, use the same\
    \ command with the desired RAID-Z type and the appropriate number of providers."
