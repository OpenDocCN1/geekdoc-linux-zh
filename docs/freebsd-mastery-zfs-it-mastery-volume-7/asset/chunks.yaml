    像 `df(1)` 以及其他大多数针对传统文件系统的监控工具都会给出错误的答案。请务必小心它们！虽然它们在快速检查时可能看起来还可以，但继续使用这些工具会养成坏习惯。糟糕的系统管理习惯会导致痛苦和故障。在监控数据集的可用空间时，请确保你测量的是实际可用空间量，而不是使用百分比。如果显示“使用百分比”的传统工具给出了有意义的结果，那纯属巧合。你的监控系统需要
    ZFS 特有的工具。


    在使用 ZFS 时，要养成使用准确工具进行管理的小习惯。


    ## 限制数据集大小


    ZFS 的灵活性意味着用户和应用程序可以使用可用的磁盘空间。这非常有价值，特别是在运行时间很长的系统上，但有时这恰恰是你不想要的行为。你不希望像 `/var/log`
    这样的数据集扩展到填满整个磁盘；反之，你希望像数据库这样的关键数据集能够获得所需的空间。如果主数据库因为 Jude 临时在他的主目录下堆了一堆非法盆栽蕨类照片而用尽空间，你将面临一场不愉快且必要的会议。这就是配额（quotas）和预留（reservations）发挥用场的地方。


    配额（quota）规定了一个数据集及其所有后代可以使用的最大空间。如果你对挂载为 `/home` 的数据集设置了 100 GB 的配额，那么 `/home`
    及其下方所有数据集和快照的总使用空间将不能超过 100 GB。


    预留（reservation）规定为数据集留出的部分空间。为了确保数据库始终有空间写入文件，请使用预留为该数据集划出一段特定的磁盘空间。


    我们将先讨论预留，然后讨论配额。


    ## 预留


    预留为数据集及其子级项留出一块磁盘空间。系统将不允许其他数据集使用该空间。如果存储池空间耗尽，预留空间仍可用于该数据集的写入。


    假设我们从 1 TB 的存储池中为 `/var/db` 预留了 100 GB，这里是数据库存放数据文件的地方。该数据集约有 50 GB 的数据。某个日志文件失控并填满了池的剩余空间。我们将收到系统上其他程序的错误，提示磁盘已满——但数据库程序在
    `/var/db` 中仍然有可用空间。它可能会抱怨无法向 `/var/log/db` 写入程序日志，那是另一个问题。


    ZFS 使用两个 ZFS 属性管理预留：`refreservation` 和 `reservation`。`refreservation` 影响数据集的引用数据——也就是说，它不包含快照、克隆和其他后代。`reservation`
    则包含子数据集、快照等。例如，请查看 `zfs list` 的这段片段。


    ```

    # zfs list

    NAME                    USED  AVAIL  REFER  MOUNTPOINT

    zroot/usr              12.5G   874G   454M  /usr

    zroot/usr/local        1.84G   874G  1.84G  /usr/local

    zroot/usr/obj          6.89G   874G  6.89G  /usr/obj

    zroot/usr/ports        1.97G   874G   816M  /usr/ports

    …

    ```


    `zroot/usr` 数据集挂载为 `/usr`。它“使用”了 12.5 GB，包括子数据集如 `/usr/local`、`/usr/obj` 等。它仅引用
    454 MB，这意味着主 `zroot/usr` 数据集上的数据量小于半个 GB。


    如果我们在 `zroot/usr` 上设置 1 GB 的 `reservation`，那基本上没有意义。子数据集中的现有文件远超此限额，且发生某种非灾难性操作将这些子项修剪到
    1 GB 以下的概率微乎其微。


    然而，如果我们在 `zroot/usr` 上设置 1 GB 的 `refreservation`，它只会影响 `zroot/usr` 上的文件。子数据集被排除在外。该数据集目前已半半，因此它会有空间写入更多文件。


    这是一个极端的例子，但有些人为。假设你想确保所有用户都能至少获得 1 GB 的磁盘空间。为每个用户的家目录创建一个单独的数据集，并为每个用户分配一个 `reservation`。


    你可能还会嵌套预留。假设你有两个数据集 `zroot/var/log` 和 `zroot/var/log/db`，后者专门用于你的数据库服务器。你希望为数据库服务器日志始终保留至少
    10 GB 空间，因此你为 `zroot/var/log/db` 分配了 `reservation`。然后你想要 20 GB 用于通用服务器日志。如果这 20
    GB 应包含数据库日志，请使用 `reservation`。如果不应包含数据库日志，请使用 `refreservation`。


    一个数据集可能同时拥有 `reservation` 和 `refreservation`。你可能会说 `zroot/var/log/db` 数据集针对当前日志文件有一个
    10 GB 的 `refreservation`，但设置了一个大得 `reservation`，以便你可以对数据集进行快照并单独计算它们的使用量。


    尝试违反 `reservation` 会产生“空间不足”错误。当在仍有空间的情况下出现该错误时，请检查你的预留设置。


    ### 查看预留


    你可以分别检查 `reservations` 和 `refreservations`，但我们更倾向于一次获取所有信息。你可以通过运行 `zfs get` 查看特定属性。


    ```

    # zfs get all zroot/var/log/db | grep reserv

    zroot/var/log/db  reservation           none   default

    zroot/var/log/db  refreservation        none   default

    zroot/var/log/db  usedbyrefreservation  0      -

    ```


    此数据集没有设置 `reservation` 或 `refreservation`。让我们设置一些。


    ### 设置和删除预留


    像设置任何其他 ZFS 属性一样设置 `reservation`。在这里我们为 `/var/log/db` 设置了 `refreservation`，为 `/var/log`
    设置了 `reservation`。


    ```

    # zfs set refresreservation=10G zroot/var/log/db

    # zfs set reservation=20G zroot/var/log

    ```


    无论如何，此主机现在为数据库日志预留了 10 GB，为日志文件预留了 20 GB（包括数据库目录）。我们对数据库日志使用 `refreservation`，是因为我们不希望快照被计入该预留中。


    要删除 `reservation`，将其设置为 `none`。


    ```

    # zfs set reservation=none zroot/var/log

    ```


    现在其他数据集可以使用该部分空间了。


    ## 配额


    *quota*（配额）是数据集、用户或用户组可以使用的最大空间量。所有这些配额都是基于数据集设置的。我们将从数据集配额开始，然后研究用户和组配额。


    ### 数据集配额


    当你想要设置数据集可以消耗的最大空间时，请使用 `quota`。例如，你可能决定 `/tmp` 只能使用 10 GB，或者 `/home` 只能占用 200
    GB，或者任何你认为合理的限制。


    与预留一样，ZFS 使用两个属性来实现配额：`quota` 和 `refquota`。`quota` 属性设置了数据集及其所有子项可以使用的最大空间。`refquota`
    属性建立了数据集可以使用的最大空间量，但不包含其子项。如果你需要一个排除快照和子数据集的配额，请使用 `refquota` 属性。


