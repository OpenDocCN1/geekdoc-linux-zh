    \ George Neville-Neil 和 Matt Ahrens。\n\nLucas 还想特别感谢 Jude 对 FreeBSD 社区中某些酷酷人士的溢美赞辞，这使得他相比之下显得很刻薄。但他以前也感谢过特定的\
    \ FreeBSD 用户，所以情况可能并没那么糟。\n\n我们将《FreeBSD Mastery: ZFS》献给我们亲爱的朋友 Paul Schenkeveld，他在我们写这本书时不幸地去世了。\n\
    \n# 第 0 章：引言\n\n我们的系统管理训练大部分集中在文件系统上。计算机的文件系统决定了它的大部分性能和行为。在过去的几十年里，我们曾多次重建过整个系统，是因为主要文件系统配置错误，或者是因为选择的文件系统不适用于任务，又或者是微妙的文件系统损坏蔓延到我们的文件中，导致我们现在无法信任操作系统自带的基本程序。任何担任系统管理员超过几年的人都学会了如何修复文件系统、重建文件系统、绕过从烦人到几乎致命的漏洞、重新排列磁盘以支持文件系统的局限性，并用至少九种语言对文件系统大肆咒骂。\n\
    \n当今最流行的一些文件系统在计算规模上是古老的。我们因为硬件已经使用了五年且太慢而令人无法忍受而丢弃它，然后在替代品上装载一个 30 年历史的文件系统。甚至更现代的文件系统如\
    \ `extfs`、`UFS2` 和 `NTFS`，其核心也使用了较旧的想法。\n\nZ 文件系统，或 `ZFS`，出现是为了改变这一切。\n\n## 什么是\
    \ ZFS？\n\nZFS 是一种现代文件系统，其核心理念是文件系统能够保证数据的完整性。ZFS 为磁盘上的每份数据计算校验和，因此它可以识别存储介质何时发生错误并损坏了数据。它对所有元数据执行相同的加密签名。当——而不是如果——底层硬件出现问题或仅仅发生故障时，ZFS\
    \ 会意识到它检索的数据与其记录不符，并采取行动。ZFS 甚至会自动修复发现的错误！ZFS 拒绝提供它已知已损坏的数据。\n\n文件系统设计者在 30 年前就有这些想法，但当时的硬件无法以合理的性能执行如此数量的错误检查。ZFS\
    \ 的创建者考虑了当前的硬件以及硬件的未来发展，决定 ZFS 将充分利用新兴硬件。结果是一个不仅比传统文件系统更可靠，而且通常更快的文件系统。\n\n今天看来，传统文件系统是基于“目前足够用”的哲学编写的。许多文件系统受到任意大小限制，这些限制在几年内足够用，但最终需要重写和重新制作。许多旧文件系统无法处理大于\
    \ 2GB 的分区，而这在如今比你免费获得的 U 盘还小。许多新文件系统内部使用 64 位标识符，因此它们在未来 10 或 20 年内都可以使用。ZFS 内部使用\
    \ 128 位标识符，使其有足够的容量在未来几千年内于存储系统中工作。《星际迷航》中的企业计算机可能运行的就是 ZFS。未来必须处理超过 ZFS 内置限制的磁盘、分区和文件的系统管理员们，会将我们与穴穴人和第一批星际旅行者归为一类。\n\
    \n严格来说，ZFS 不仅仅是一个文件系统。它是文件系统和卷管理器的结合。在一套软件中结合这两个功能确实会带来某些局限性，我们稍后会讨论——但它让一些有趣事情成为可能。ZFS\
    \ 确切知道数据在磁盘上的位置，可以从上到下优化地安排文件和条带。ZFS 可以使用辅助快速存储作为特殊用途缓存，进一步增强性能。\n\n*FreeBSD Mastery:\
    \ ZFS Essentials* 将带你了解运行这种现代、高性能、面向未来的文件系统必须掌握的知识。\n\n## ZFS 历史\n\nMatt Ahrens\
    \ 和 Jeff Bonwick 为 Sun Microsystems 的 Solaris 操作系统创建了 ZFS。虽然 Sun 销售各种尺寸的系统，但其主要重点是高端服务器硬件。Sun\
    \ 的硬件驱动了世界上大部分大型数据库。Sun 根据通用开发和分发许可证 (CDDL)向世界开放了 ZFS 源码。人们开始将 ZFS 移植到其他操作系统（包括\
    \ FreeBSD），并将更改回给 Sun。\n\n随后 Oracle 收购了 Sun Microsystems。虽然 Oracle 拥有一些开源软件（如\
    \ MySQL），但其大部分软件都是专有的。Oracle 完全接管了 ZFS 的开发，并停止了在任何开源许可证下提供源码。\n\n"
