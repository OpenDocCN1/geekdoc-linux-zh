- fmt: '

    Why would you want to use a refquota instead of a quota? Suppose each user’s home
    directory is its own dataset, and users cannot create snapshots. Most can’t, and
    most of those who can don’t know how. If you automatically create snapshots, as
    we demonstrate in Chapter 7, then the space used by snapshots will get charged
    to the user’s account. A user who runs out of disk space might delete some files
    but discover that they haven’t freed any space. It’s probably not fair to charge
    a user for disk space that they don’t control.


    ### Setting Quotas


    To configure a quota on a dataset, assign the `quota` and/or `refquota` properties.


    In the Reservations section we set aside 20 GB for the system logs in the `zroot/var/log`
    dataset, guaranteeing that the log would always have at least 20 GB of space.
    A more common issue is when logging runs amok and absorbs all available disk space,
    crashing the system. Your monitoring system should catch this error, but it also
    makes sense to establish a quota on the log dataset so that someone uncommenting
    `/var/log/all.log` in `/etc/syslog.conf` doesn’t crash the box a day later.


    Here we set a quota on `zroot/var/log`.


    ```

    # zfs set quota=100G zroot/var/log

    ```


    The log files can use no more than 100 GB, including snapshots, child datasets,
    and everything else.


    You can separately limit the amount of referenced data with a `refquota`. This
    excludes child datasets and snapshots. Limiting both the size of the entire dataset
    and the dataset’s referenced data can help you control the size of your snapshots.
    For example, setting a `refquota` of 10 GB and a `quota` of 100 GB would tell
    you that you could always have 10 snapshots even if the data completely changes.
    Similarly, if you want to exclude child datasets, use a `refquota`.


    ```

    # zfs set refquota=50G zroot/var/log

    # zfs set refquota=50G zroot/var/log/db

    # zfs set quota=500G zroot/var/log

    ```


    Here we have separate `refquotas` for two logging datasets, and a `quota` for
    both of the datasets together. If each dataset can reference up to 50 GB on its
    own, the 500 GB `quota` means that no matter how the data changes, you can have
    at least four snapshots of each.


    ### Viewing Quotas


    To see the quotas on a dataset, check the `quota` and `refquota` properties.


    ```

    # zfs get all zroot/home | grep quota

    zroot/home  quota     none  default

    zroot/home  refquota  none  default

    ```


    The `/home` directory has no quotas on it. Users may fill your hard drive to its
    limits.


    Quotas change the dataset’s maximum size and the free space in the dataset. This
    pool has several hundred gigabytes free, but `zfs list` on this dataset says otherwise.


    ```

    # zfs list zroot/var/log

    NAME            USED  AVAIL  REFER  MOUNTPOINT

    zroot/var/log  25.0G  75.0G  5.01G  /var/log

    ```


    The `zroot/var/log` dataset has 25 GB on it, and 75 GB free. ZFS knows that the
    dataset has 100 GB `quota` on it, and shows utilization appropriately. You’ve
    just simulated a traditional partition by setting a `quota`—but don’t go `df`!
    First, look at a child dataset `zroot/log`.


    ```

    # zfs list zroot/log/db

    NAME               USED  AVAIL  REFER  MOUNTPOINT

    zroot/log/db  20G  85G  5G  /db

    ```


    ZFS knows that the parent dataset has a `quota` of 100 GB, and therefore sets
    that maximum size on the child datasets. If `zroot/log` has 75 GB free, and `zroot/log/db`
    has 85 GB free, does that mean these two partitions have 160 GB of free? No, because
    like space in a pool, these two entries refer to the same space. The `zroot/log/db`
    entry seems to have more free space because data in its parent dataset is not
    reflected in the child dataset.


    ### Exceeded Quotas


    If a user or process attempts to write something that would make the dataset exceed
    its `quota`, it will get a quota error.


    ```

    # cp script.sh test.sh

    cp: test.sh: Disc quota exceeded

    ```


    You’ll need to free some space, but remember that snapshots might complicate that,
    as discussed in “Freeing Space” earlier. If you’ve set both a `quota` and `refquota`,
    the user might be able to delete files and free up space though that increases
    the size of the filesystem’s snapshots.


    ### User and Group Quotas


    User and group quotas control how much data a user or group can write to a dataset.
    Like dataset quotas, user and group quotas are controlled on a per-dataset basis.
    User and group quotas don’t apply to child filesystems, snapshots, and clones.
    You must apply quotas to each individual dataset you want to affect.


    ### Viewing Space Used and Existing Quotas per Dataset


    The `zfs userspace` command lets you see how much space is used by each user in
    a dataset. Here we examine the `zroot/home` dataset. A system with complicated
    datasets might need several minutes to run `du`, but `zfs userspace` finds all
    files owned by each user instantaneously.


    ```

    # zfs userspace zroot/home

    TYPE        NAME      USED  QUOTA

    POSIX User  179      7.29M   none

    POSIX User  mwlucas  16G    none

    POSIX User  root      298M   none

    ```


    The user `mwlucas` has 16 GB of files—unsurprising. The root user has 298 MB of
    files in `/home`—somewhat surprising, but not shocking. Somehow, though, user
    179 has 7.29 MB of files in that dataset. This system has no user `Lucas`, which
    is why the user is shown by UID rather than username. A bit of digging shows that
    Lucas once used `tar`’s `-p` argument when extracting a source code tarball, preserving
    the original file ownership. None of these users have quotas. The `zfs groupspace`
    command shows how much space files owned by each group use. For something more
    interesting, I’m checking the group ownerships on the `zroot/usr/local` dataset.


    ```

    # zfs groupspace zroot/usr/local

    TYPE         NAME         USED  QUOTA

    POSIX Group  _tss        25.5K   none

    POSIX Group  bin         93.5K   none

    POSIX Group  kmem         128K   none

    POSIX Group  messagebus   392K   none

    POSIX Group  polkit       115K   none

    POSIX Group  wheel       1.85G   none

    ```


    If your server supports multiple groups, such as development teams, research groups,
    or devotees of BSD variants, you can assign each group or user a `quota` to restrict
    their disk usage.


    ### Assigning and Removing User and Group Quotas


    Use the `userquota` and `groupquota` properties to assign user and quotas. To
    specify the user or group the quota belongs to, give the property name, an `@`
    sign, and the user or group name. Give the quota for the user `mwlucas`, for example,
    with `userquota@mwlucas`.


    ```

    # zfs set userquota@mwlucas=1G zroot/home

    ```


    The previous section showed that the `mwlucas` account had over a gigabyte of
    data in it. The `mwlucas` account is over quota, and that user gets an error whenever
    he tries to create a file.


    ```

    $ touch test

    touch: test: Disc quota exceeded

    ```


    Similarly, assign a group quota with the `groupquota` property, an `@` sign, and
    the group name.


    ```

    # zfs set groupquota@staff=10G zroot/home

    ```


    If a user has repeatedly abused shared directories like `/tmp`, assign them a
    restrictive `quota`.


    ```

    # zfs set userquota@mwlucas=10m zroot/tmp

    ```


    This user can use features like SSH agent forwarding, but he can’t extract huge
    tarballs and monopolize the shared temporary space.


    To remove a quota, set the quota to `none`.


    ### Viewing Individual Quotas


    If you’re interested in the quota set for a specific user or group, ask ZFS for
    that one property.


    ```

    # zfs get userquota@mwlucas zroot/tmp

    NAME       PROPERTY           VALUE          SOURCE

    zroot/tmp  userquota@mwlucas  10M            local

    ```


    Now you can let your teams squabble among themselves over their disk space usage,
    without taking up your precious time. Congratulations!

