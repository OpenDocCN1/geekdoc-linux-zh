    \ Suppose you use GPT disk partitions on your ZFS disks, as we recommend. You\
    \ might then decide to move those disks from your FreeBSD host to another operating\
    \ system or another hardware architecture. If the new operating system or hardware\
    \ doesn’t recognize GPT partitions, the new host won’t be able to find the pools\
    \ to import them!\n\nBefore you import a pool, though, you must export it.\n\n\
    ### Exporting Pools\n\nExport is roughly analogous to cleanly unmounting a traditional\
    \ filesystem. ZFS marks the providers as inactive and completes all pending transactions.\
    \ If you have a ZFS Intent Log (Chapter 2), the log is purged. Everything is written\
    \ to the provider, the filesystem is unmounted, and the system is notified that\
    \ these providers are now free for reuse.\n\nUse zpool export and the pool name\
    \ to export a pool. Here, we export the pool db.\n\n```\n# zpool export db\n```\n\
    \nThis command should run silently. Run zpool list to verify the pool is no longer\
    \ on the system.\n\nThe system will refuse to export an active filesystem. Shut\
    \ down any daemons writing to the dataset and change your shell’s working directory\
    \ away from the dataset. Stop tailing files. You can use fstat(1) or lsof(8) to\
    \ identify processes using filesystems on that dataset.\n\n### Importing Pools\n\
    \nTo see inactive pools attached to a system, run zpool import. This doesn’t actually\
    \ import any pools, but only shows what’s available for import.\n\n```\n# zpool\
    \ import\n   pool: db\n id: 8407636206040904802\n  state: ONLINE\n action: The\
    \ pool can be imported using its name or numeric identifier.\n config:\n\ndb \
    \         ONLINE\n raidz1-0   ONLINE\n  gpt/zfs1  ONLINE\n  gpt/zfs2  ONLINE\n\
    \  gpt/zfs3  ONLINE\n  gpt/zfs4  ONLINE\n```\n\nThis shows that the pool db, also\
    \ known by a long numerical identifier, can be imported. You see the pool configuration\
