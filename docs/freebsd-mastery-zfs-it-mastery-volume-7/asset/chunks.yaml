- fmt: '

    We have all sorts of datasets under `/usr`, but there’s no `/usr` dataset mounted.
    What’s going on?


    A `zfs list` shows that a dataset exists, and it has a mount point of `/usr`.
    But let’s check the `mountpoint` and `canmount` properties of `zroot/usr` and
    all its children.


    ```

    # zfs list -o name,canmount,mountpoint -r zroot/usr

    NAME          CANMOUNT  MOUNTPOINT

    zroot/usr          off  /usr

    zroot/usr/home     on   /usr/home

    zroot/usr/ports    on   /usr/ports

    zroot/usr/src      on   /usr/src

    ```


    With `canmount` set to `off`, the `zroot/usr` dataset is never mounted. Any files
    written in `/usr`, such as the commands in `/usr/bin` and the packages in `/usr/local`,
    go into the root filesystem. Lower-level mount points such as `/usr/src` have
    their own datasets, which are mounted.


    The dataset exists only to be a parent to the child datasets. You’ll see something
    similar with the `/var` partitions.


    ## Multiple Datasets with the Same Mount Point


    Setting `canmount` to `off` allows datasets to be used solely as a mechanism to
    inherit properties. One reason to set `canmount` to `off` is to have two datasets
    with the same mount point, so that the children of both datasets appear in the
    same directory, but might have different inherited characteristics.


    FreeBSD’s installer does not have a `mountpoint` on the default pool, `zroot`.
    When you create a new dataset, you must assign a mount point to it.


    If you don’t want to assign a mount point to every dataset you create right under
    the pool, you might assign a `mountpoint` of `/` to the `zroot` pool and leave
    `canmount` set to `off`. This way, when you create a new dataset, it has a `mountpoint`
    to inherit. This is a very simple example of using multiple datasets with the
    same mount point.


    Imagine you want an `/opt` directory with two sets of subdirectories. Some of
    these directories contain programs, and should never be written to after installation.
    Other directories contain data. You must lock down the ability to run programs
    at the filesystem level.


    ```

    # zfs create db/programs

    # zfs create db/data

    ```


    Now give both of these datasets the `mountpoint` of `/opt` and tell them that
    they cannot be mounted.


    ```

    # zfs set canmount=off db/programs

    # zfs set mountpoint=/opt db/programs

    ```


    Install your programs to the dataset, and then make it read-only.


    ```

    # zfs set readonly=on db/programs

    ```


    You can’t run programs from the `db/data` dataset, so turn off `exec` and `setuid`.
    We need to write data to these directories, however.


    ```

    # zfs set canmount=off db/data

    # zfs set mountpoint=/opt db/data

    # zfs set setuid=off db/data

    # zfs set exec=off db/data

    ```


    Now create some child datasets. The children of the `db/programs` dataset inherit
    that dataset’s properties, while the children of the `db/data` dataset inherit
    the other set of properties.


    ```

    # zfs create db/programs/bin

    # zfs create db/programs/sbin

    # zfs create db/data/test

    # zfs create db/data/production

    ```


    We now have four datasets mounted inside `/opt`, two for binaries and two for
    data. As far as users know, these are normal directories. No matter what the file
    permissions say, though, nobody can write to two of these directories. Regardless
    of what trickery people pull, the system won’t recognize executables and `setuid`
    files in the other two. When you need another dataset for data or programs, create
    it as a child of the dataset with the desired settings. Changes to the parent
    datasets propagate immediately to all the children.


    ## Pools without Mount Points


    While a pool is normally mounted at a directory named after the pool, that isn’t
    necessarily so.


    ```

    # zfs set mountpoint=none mypool

    ```


    This pool no longer gets mounted. Neither does any dataset on the pool unless
    you specify a mount point. This is how the FreeBSD installer creates the pool
    for the OS.


    ```

    # zfs set mountpoint=/someplace mypool/lamb

    ```


    The directory will be created if necessary and the filesystem mounted.

    ## Manually Mounting and Unmounting Filesystems


    To manually mount a filesystem, use `zfs mount` and the dataset name. This is
    most commonly used for filesystems with `canmount` set to `noauto`.


    ```

    # zfs mount mypool/usr/src

    ```


    To unmount a filesystem and all of its children, use `zfs unmount`.


    ```

    # zfs unmount mypool/second

    ```


    If you want to temporarily mount a dataset at a different location, use the `-o`
    flag to specify a new mount point. This mount point only lasts until you unmount
    the dataset.


    ```

    # zfs mount -o mountpoint=/mnt mypool/lamb

    ```


    You can only mount a dataset if it has a `mountpoint` defined. Defining a temporary
    mount point when the dataset has no mount point gives you an error.


    ## ZFS and /etc/fstab


    You can choose to manage some or all of your ZFS filesystem mount points with
    `/etc/fstab` if you prefer. Set the dataset’s `mountpoint` property to `legacy`.
    This unmounts the filesystem.


    ```

    # zfs set mountpoint=legacy mypool/second

    ```


    Now you can mount this dataset with the `mount(8)` command:


    ```

    # mount -t zfs mypool/second /someplace

    ```


    The directory will be created if necessary and the filesystem mounted. You can
    also add ZFS datasets to `/etc/fstab`. Use the full dataset name as the device.
    Set the type to `zfs`. You can also the defaults of `atime,,exec,,, and su su`.,,,,,,,,,















    /junk 2 0

    ```


    We recommend using ZFS properties to manage your mounts, however.

    ## Tweaking ZFS Volumes


    Zvols are pretty straightforward—here’s a chunk of space as a block device; use
    it. You can adjust how a volume uses space and what of device it offers.


    ### Space Reservations


    The `volsize` property of a zvol specifies the volume’s logical size. By default,
    creating a volume reserves an amount of space for the dataset to the volume size.
    (If you look ahead to Chapter 6, it establishes a of equal.) size `volvolvol``
    reservation. The `volsize` can only be set to a multiple of the `volblocksize`
    property, and cannot be zero.


    Without the reservation, the volume could run out of space, resulting in undefined
    behavior or data corruption, depending on how the volume is used. These effects
    can also occur when the volume size is changed while it is use, particularly when
    shrinking the size. Adjusting the volume size can confuse applications using the
    device.


    Zvols also support *sparse volumes*, also known as *thin provisioning*. A sparse
    volume is a volume where the reservation is less than the volume size. Essentially,
    using a sparse volume permits allocating more space than the dataset has available.
    With sparse provisioning you could, say, create ten 1 TB sparse volumes on your
    5 TB dataset. So long as your volumes are never heavily used, nobody will notice
    that you’re overcommitted.


    Sparse volumes are not recommended. Writes to a sparse volume can fail with an
    “out of space” error even if the volume itself looks only partially full.


    Specify a sparse volume at creation time by specifying the `-s` option to the
    `zfs create -V` command. Changes to `volsize` are not reflected in the reservation.
    You can also reduce the reservation after the volume has been created.


    ### Zvol Mode


    FreeBSD normally exposes zvols to the operating system as `geom(4)` providers,
    giving them maximum flexibility. You can change this with the `volmode` property.


    Setting a volume’s `volmode` to `dev` exposes volumes only as a character device
    in `/dev`. Such volumes can be accessed only as raw disk device files. They cannot
    be partitioned or mounted, and they cannot participate in RAIDs or other GEOM
    features. They are faster. In some cases where you don’t trust the device using
    the volume, `dev` mode can be safer.

