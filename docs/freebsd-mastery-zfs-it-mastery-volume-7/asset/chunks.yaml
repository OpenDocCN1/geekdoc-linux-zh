    ```

    # zfs rollback mypool/delorean@thepresent

    ```


    这花费的时间比你想象的要短。记住，所有数据和元数据已经在磁盘上了。ZFS 只是切换它所使用的元数据集。一旦回滚完成，活动文件系统将包含所选快照的所有文件。


    ```

    # cat /delorean/timecapsule.txt

    “这是现在”

    ```


    你对数据集进行的较新更改已经消失了，且无法恢复。


    虽然这是一个简单的例子，但你也可以对软件升级、数据库迁移或任何其他风险操作执行完全相同的操作。曾经需要从离线备份中进行繁琐恢复的操作，现在通过一个命令即可处理。


    你只能将文件系统回滚到最近的快照。无法像电影中那样向前或向后穿越。如果你想回到更早的快照（“过去），你必须销毁所有比目标更新的快照。


    ```

    # zfs rollback mypool/delorean@thepast

    cannot rollback to ''mypool/delorean@thepast'': more recent snapshots or bookmarks
    exist

    use ''-r'' to force deletion of the following snapshots and bookmarks:

    mypool/delorean@thepresent

    ```


    如果你使用递归标志 `-r`，`zfs rollback` 命令可以为你销毁所有中间快照。这与创建和销毁快照时使用的多数据集递归不同。使用 `rollback
    -r` 不会回滚子数据集。你必须单独回滚每个数据集。


    ```

    # zfs rollback -r mypool/delorean@thepast

    # cat /delorean/timecapsule.txt

    “这是过去”

    ```


    你已经回到了过去，现在可以再次尝试你那风险且痛苦的升级了。恭喜！


    ## 比较快照


    有时你真的想知道从快照拍摄到现之间发生了什么变化。如果数据库服务器在今天中午开始崩溃，你可能想将现在的文件系统状态与上午 11 点的快照对比，查看是否有任何变化。你可以使用
    `find(1)` 查找自快照创建以来修改的文件，或者使用 `diff(1)` 比较快照文件与活动文件系统中的文件。然而，ZFS 已经拥有这些信息，并通过
    `zfs diff` 提供了支持。


    要查看快照与活动文件系统之间的差异，运行 `zfs diff` 并提供快照名称。


    ```bash

    # zfs diff mypool/sheep@later


    M /mypool/sheep/randomfile

    ```


    文件可以处于四种状态。`-` 表示文件被删除。`+` 表示文件被添加。`M` 表示文件已被修改。`R` 显示文件被重命名。我们的示例显示文件 `/mypool/sheep/randomfile`
    在快照拍摄后被修改了。


    你也可以比较两个快照。


    ```

    # zfs diff mypool/sheep@later @muchlater

    M   /mypool/sheep/

    +   /mypool/sheep/newfile

    -   /mypool/sheep/zfsbook.html

    R   /mypool/sheep/date.txt -> /mypool/sheep/olddate.txt

    M   /mypool/sheep/randomfile

    ```


    目录 `/mypool/sheep` 被修改了。文件 `/mypool/sheep/newfile` 被添加，而文件 `/mypool/sheep/zfsbook.html`
    被删除了。我们看到了一个文件重命名，同样，`randomfile` 文件被修改了。


    你还可以获取更详细的信息。如果你添加 `-t` 标志，输出将包含来自 inode 的更改时间戳。`-F` 标志包含文件类型。检查 `zfs(8)` 以获取完整的文件类型列表。


    ## 自动快照方案


    即使你只为特殊事件创建快照，快照也是用的。然而，如果你按照计划自动创建快照，它们将变得极其有用。安排每 15 分钟对系统创建一次递归快照是非常简单的。但如果你保留所有这些快照，你的池就会填满。自动快照像备份带一样需要轮转和丢弃。


    ### 轮转计划


    安排快照创建和销的困难之处在于你可能如何使用这些快照。你的用户是谁？哪些应用程序可能需要快照？我们无法为你回答这些问题。


    一种常见的设置是每周、每日、每小时和每 15 分钟的快照。你拍摄每周快照并保留两个。每日快照保留两周。每小时快照保留三天。然后你每 15 分钟拍摄一次快照并保留六小时。


    也许你只需要四个 15 分钟的快照。或者你必须保留一年的每月快照。适合你的方案取决于许多因素。你的数据有多重要？你可能需要追溯多久？你的空间受限程度如何？你的文件变化有多频繁？每天写入多少新数据？你是否有
    IT 审计控制规定了某些数据必须保留多久？与团队中的其他人员讨论，并制定一个适合你组织的计划。


    一旦你有了理想的计划，ZFS 工具可以帮助你部署它。


    ### ZFS 工具


    许多脚本和软件包可以为你替管理 ZFS 快照。我们推荐 `ZFS Tools` (https://github.com/bdrewery/zfstools)，因为它不使用配置文件。它确实需要
    `cron(8)`，但你不需要处理任何 `zfools.conf`。ZFS Tools 从 ZFS 内的用户定义的属性获取配置。


    ```bash

    # pkg install zfstools

    ```


    ### zfs-auto-snapshot


    `zfs-auto-snapshot` 脚本创建并删除快照。它接受两个参数：快照名称以及要保留的数量。例如，`zfs-auto-snapshot frequent
    4` 创建一个 `frequent` 快照并保留四个。


    ```bash

    15,30,45 * * * root /usr/local/sbin/zfs-auto-snapshot frequent 4

    ```


    ```bash

    0    * * * root /usr/local/sbin/zfs-auto-snapshot hourly 24

    ```


    ```bash

    7    0 * * root /usr/local/sbin/zfs-auto-snapshot daily 7

    ```


    ```bash

    14   0 * * 7 root /usr/local/sbin/zfs-auto-snapshot weekly 4

    ```


    ```bash

    28   0 1 * * root /usr/local/sbin/zfs-auto-snapshot monthly 12

    ```


    这些 crontab 条目是为 `/etc/crontab` 设计的如果你在 root 的 crontab 中它们，必须从每个条目中删除用户（root）。在任何情况下，请确保包含
    `PATH` 变量以便 `zfs-auto-tools` 找到 Ruby。


