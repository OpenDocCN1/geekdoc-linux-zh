    `zpool(8)` 命令指出了错误之处，然后告诉你如何强制执行。我们通常把这类错误视为系统管理员需要多补充咖啡的信号，但也许你确实是故意为之。使用指定的
    `VDEV` 类型和存储提供者运行 `zpool create -f`，会告诉 ZFS：是的，你完全打算创建一个格式不规范的池（pool）。嘿，这是你的系统；由你说了算。


    如果如果 ZFS 不想让你做某事，那么你可能就不该这样做。当你使用 `-f` 时，你正在创建一个 ZFS 设计之初无法处理的东西。你可以轻松创建一个无法良好运行且`cannot`
    修复的池。


    ## 重用提供者


    我们有时会多次创建和销毁池以确保它们正确工作。我们可能会从一台机器上拔出磁盘并将其挂载到另一台机器上。有时我们会遇到一个以前用过的磁盘。


    ```

    # zpool create db gpt/zfs1 gpt/zfs2 gpt/zfs3 gpt/zfs4

    invalid vdev specification

    use ''-f'' to override the following errors:

    /dev/gpt/zfs3 is part of exported pool ''db''

    ```


    我们曾在另一个池中使用过此磁盘，后来又将其导出了（见第 5 章）。问题磁盘曾用于那个池，ZFS 标签仍然留在磁盘上。虽然我们擦除并重建了分区表，但新的分区表恰好与之前的完全相同。在这种情况下，ZFS
    很容易找到旧的元数据。


    如果你确定该提供者中没有任何重要内容，请按照指令使用 `-f` 强制创建新池。


    ```bash

    # zpool create -f db gpt/zfs1 gpt/zfs2 gpt/zfs3 gpt/zfs4

    ```


    ZFS 程序对命令行标志的位置非常挑剔，因此确保 `-f` 紧跟在 `create` 之后。


    ## 池的完整性


    关于 ZFS 的一个常见抱怨是它没有文件检查器，例如 `fsck(8)`。离线文件检查器并改进 ZFS，因为在线池完整性检查器会验证 `fsck(8)` 检查的所有内容以及更多。在线检查器也比传统文件系统能让
    `fsck(8)` 实现的效果要有效得多。让我们来讨论 ZFS 如何确保文件完整性，以及池清洗（scrub）如何帮助维护完整性。


    ### ZFS 完整性


    存储设备会出错。当任何类型的磁盘上有数万亿个扇区时，随机宇宙射线击中足够强度以使其像醉酒一样踉晃的概率会大大增加——写入错误、断电故障、故障电缆短路或许多其他问题的概率也是如此。没有任何文件系统可以防止底层硬件的错误。


    ZFS 几乎在处处使用`hashes`。哈希是一种数学算法，获取一段数据并从中计算出固定长度的字符串。哈希的有趣之处在于，原始数据的微小变化会剧烈改变数据的哈希。每个存储块包含其父块的哈希，而每个父块包含所有子块的哈希。


    虽然 ZFS 无法防止存储提供者的错误，但它使用这些哈希来检测它们。每当系统访问数据时，它都会验证校验和。ZFS 利用池的冗余性在将修复后的文件交给操作系统之前修复任何错误。这被称为`self-healing`（自愈）。


    如果底层 VDEV 具有冗余性，ZFS 将从 RAID-Z 重建损坏的块，或从镜像中获取完好的副本。如果镜像的两侧都有错误，只要两块磁盘上的相同数据没有损坏，ZFS
    就能恢复文件。如果 `VDEV` 没有冗余性，但数据集具有额外的数据副本（见第 4 章），ZFS 将使用那些额外副本。


    如果底层 VDEV 没有冗余性，且数据集未保留额外副本，池会标记文件已损坏并返回错误，而不是返回错误的数据。你可以从备份中恢复该文件，或将其丢弃。


    当 ZFS 执行文件完整性检查时，它还会验证存储块之间的连接。这是传统文件系统中 `fsck(8)` 执行的任务。这是数据验证的一小部分，而 ZFS 作为其正常运行的一部分会持续执行这项任务。ZFS
    相比 `fsck(8)` 还有一个额外优势，它只检查实际存在的块，而不是已使用和未使用的 inode。如果你想对池中的所有数据进行完全完整性检查，请对其进行清洗（scrub）。


    基于哈希的完整性检查的良好之处在于，它可以捕捉到各种错误，即使是意外的错误。记住，快乐的文件系统都是相似的；每一个不快乐的文件系统都以自己的方式不快乐。


    ### 清洗 ZFS


    对 ZFS 池进行 `scrub` 会验证池中每个数据块的加密哈希值。如果清洗检测到错误，在存在足够韧性的情况下，它会修复该错误。清洗在池在线时发生。如果清洗检测到错误，在存在足够韧性的情况下，它会修复该错误。清洗在池在线时发生。


    如果你的系统识别出任何错误，它们将出现在 `zpool status` 中。池未遇到任何错误。


    ```bash

    # zpool status

    scan: scrub in progress since Tue 24 11:52:23

    12.8G out of 17.3G at 23.0M/s, 0h3m to go

    0 repaired

    ```


    要在池中搜索错误，请使用 `scrub`。运行 `zpool scrub` 加池名称。


    ```bash

    # zpool scrub zroot

    ```


    清洗在后台运行。你可以通过 `zpool status` 查看它们的运行情况。


    ```bash

    # zpool status

    scan: scrub in progress since Tue 24 11:52:23

    12.8G out of 17.3G at 23.0M/s, 0h3m to go

    0 repaired,74% done

    ```


    如果你的系统已经达到性能极限，请在离峰时间清洗池。如果你必须取消正在进行的清洗，运行 `zpool scrub -s`。


    ```bash

    # zpool scrub -s zroot

    ```


    ### 清洗频率


    ZFS 内置的完整性测试和韧性意味着只要发现得早，大多数错误是可以修复的。这意味着你的硬件决定了清洗频率。如果你拥有可靠的硬件（例如服务器级设备），季度清洗一次即可。如果你在使用廉价硬件，你应该每月清洗一次。


    FreeBSD 可以为你执行定期清洗，将在本章“ZFS 维护自动化”中讨论。


    ## 池属性


    ZFS 使用属性来表示池的特征。虽然 `zpool` 属性看起来和用法类似于数据集属性，且许多属性之间有重叠，但数据集属性与池属性没有关系。池属性包括健康状况、大小、容量和每池功能等事实。


    池的属性影响整个池。如果你只想为池的一部分设置属性，请检查是否有符合要求的数据集属性。


    ### 查看池属性


    要查看系统中所有池的属性，请运行 `zpool get all`。如果你只想查看特定池的属性，可以在最后添加池名称。这里我们查看 `zroot` 池的属性。


    ```

    # zpool get all zroot

    NAME   PROPERTY  VALUE   SOURCE

    zroot  size      920G    -

    zroot  capacity  1%      -

    zroot  altroot   -       default

    zroot  health    ONLINE  -

    ```


    前两列给出池名称和属性名称。第三列列出属性的值。此池的大小属性是 920G——这个池有 920 GB 的空间。


