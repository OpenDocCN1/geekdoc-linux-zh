    \ 0: Introduction\n\nMuch of our systems administration training focuses on filesystems.\
    \ A computer’s filesystem dictates so much of its performance and behavior. Over\
    \ the last decades we’ve rebuilt entire systems because a major filesystem was\
    \ configured incorrectly, or the filesystem chosen wasn’t suitable for the task,\
    \ or because subtle filesystem corruption spread throughout our files and now\
    \ we couldn’t trust even the basic programs the operating system had shipped with.\
    \ Anyone who’s been a sysadmin more than a few years has learned how to repair\
    \ filesystems, rebuild filesystems, work around bugs from vexing to nearly lethal,\
    \ rearrange disks to support filesystem limitations, and swear extensively at\
    \ filesystems in no fewer than nine languages.\n\nSome of today’s most popular\
    \ filesystems are, in computing scale, ancient. We discard hardware because it’s\
    \ five years old and too slow to be borne—then put a 30-year-old filesystem on\
    \ its replacement. Even more modern filesystems like `extfs`, `UFS2`, and `NTFS`\
    \ use older ideas at their core.\n\nThe Z File System, or `ZFS`, is here to change\
    \ all that.\n\n## What is ZFS?\n\nZFS is a modern filesystem built with the core\
    \ idea that the filesystem should be able to guarantee data integrity. ZFS computes\
    \ a checksum for every piece of data on disk, so it can identify when the storage\
    \ media has experienced an error and damaged the data. It performs the same cryptographic\
    \ signatures on all of the metadata. When—not if—the underlying hardware has a\
    \ problem or just misfires, ZFS realizes that the data it has retrieved doesn’t\
    \ match its records and can take action. ZFS even automatically corrects discovered\
    \ errors! ZFS refuses to serve data it knows to be corrupt.\n\nFilesystem designers\
    \ had these ideas 30 years ago, but the hardware of the time couldn’t perform\
    \ this amount of error checking with reasonable performance. The creators of ZFS\
    \ looked at current hardware as well as where hardware was going, and decided\
    \ that ZFS would take full advantage of emerging hardware. The result is a filesystem\
    \ that’s not only more reliable than traditional filesystems, but often faster.\n\
    \nToday, it seems that traditional filesystems were written with a “good enough\
    \ for now” philosophy. Many filesystems suffered from arbitrary size limits, which\
    \ sufficed for years but eventually required rewriting and reworking. Many older\
    \ filesystems couldn’t handle partitions larger than two gigabytes, which these\
    \ days is smaller than a flash drive you’ll get for free. Many new filesystems\
    \ use 64-bit identifiers internally, so they’ll be usable for the next ten or\
    \ 20 years. ZFS use 128-bit identifiers internally, giving it enough capacity\
    \ to work on storage systems for the next several millennia. The Enterprise’s\
    \ computer on *Star Trek* probably runs ZFS. Future sysadmins who must deal with\
    \ disks, partitions, and files that exceed ZFS built-in constraints will lump\
    \ us together with the cavemen and the first interstellar travelers.\n\nStrictly\
    \ speaking, ZFS is not just a filesystem. It’s a combination filesystem and volume\
    \ manager. Combining these two functions in one set of software does impose certain\
    \ limitations, which we’ll talk about later—but it also makes some interesting\
    \ things possible. ZFS, being aware of exactly where data is going on the disk,\
    \ can arrange files and stripes optimally, from top to bottom. ZFS can use secondary\
    \ fast storage as special-purpose caches, further enhancing performance.\n\n*FreeBSD\
    \ Mastery: ZFS Essentials* takes you through what you must know to run this modern,\
    \ high-performance, future-proof filesystem.\n\n## ZFS History\n\nMatt Ahrens\
    \ and Jeff Bonwick created ZFS for Sun Microsystems’ Solaris operating system.\
    \ While Sun sold systems of all sizes, its main focus was high-end server hardware.\
