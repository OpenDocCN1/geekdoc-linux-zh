    避免对齐问题的简单方法是让所有 GPT 分区在兆字节边界开始和结束。在你的 `gpart add` 命令中添加 `-a 1m` 参数。


    ## ZFS 扇区大小


    ZFS 默认假设扇区大小为 `512-byte`。在具有物理 `512-byte` 扇区的磁盘上使用 `512-byte` 文件系统扇区大小没有问题。在 `4K`-扇区磁盘上使用
    `512-byte` 文件系统扇区会让硬件工作负担更大。假设你想在这样的磁盘上写入 `4 KB` 的数据。与其告诉硬盘写入单个物理扇区，不如告诉硬盘修改扇区的前八分之一，然后是第二八分之一，以此此类推。在
    `4 KB` 扇区上进行 `512-byte` 写入意味着读取整个 `4 KB`，修改小部分，然后写回。这比直接覆盖整个扇区要慢得多。你的性能会剧降。如果
    ZFS 在具有 `512-byte` 扇区的磁盘上使用 `4K` 扇区大小，磁盘硬件会将访问请求拆分为物理扇区大小，性能损耗很小。


    虽然使用较大的扇区大小不会影响性能，但当你存储许多小文件时，它会降低空间效率。如果你有一堆 `1 KB` 文件，每个文件都会占据一个扇区。


    ZFS 扇区大小是池中每个虚拟设备的属性。即使在导出池或更换故障驱动器时，你也无法更改虚拟设备的扇区大小。


    这两个事实意味着，无论底层磁盘报告的扇区大小如何，强制 ZFS 使用 `4K` 扇区几乎总是优优的。使用较大的 ZFS 扇区大小不会损害性能，但在某些特定的数据库操作除外，即便如此，也仅在使用真正且确实使用
    `512-byte` 扇区的磁盘时。


    ZFS 使用报告最大扇区大小设备的扇区大小。如果你所有的设备都声称使用 `512-byte` 扇区，且你没有设置更大的扇区大小，由这些设备构建的虚拟设备将使用
    `512-byte` 扇区。在你的 `VDEV` 中包含单个具有 `4096-byte` 扇区的设备将强制 ZFS 使用 `4096-byte` 扇区。


    不要相信你的 `4K`-扇区设备报告的扇区大小。告诉 ZFS 坚持始终使用 `4K` 扇区。


    一个名为 `ashift` 的池变量控制扇区大小。`ashift` 为 `9` 告诉 ZFS 使用 `512-byte` 扇区。`ashift` 为 `12`
    告诉 ZFS 使用 `4096-byte` 扇区。（为什么是 `9` 和 `12`？`2⁹` 是 `512`，而 `2¹²` 是 `4096`。）设置 `ashift`
    的方法取决于你的 FreeBSD 版本。


    ## FreeBSD 10.1 及更高版本的 Ashift


    通过 `sysctl vfs.zfs.min_auto_ashift` 设置系统的默认 `ashift`，可以在 `/etc/sysctl.conf` 中设置或在命令行设置。


    ```

    # sysctl vfs.zfs.min_auto_ashift=12

    ```


    安装期间可以使用命令行，但在 `/etc/sysctl.conf` 中永久设置它，以免在创建新池时忘记。


    本书的示例假设你正在使用 FreeBSD 10.1 或更高版本。对于较旧的 FreeBSD 版本，你每次都需要设置 `ashift`，而不是设置 `sysctl`。


    ## 旧版本的 FreeBSD Ashift


    比 10.1 旧的 FreeBSD 版本缺少新版本 FreeBSD 中的 `ashift` `sysctl`，因此你必须依赖 ZFS 内部的扇区大小检测代码。该代码从底层存储介质（即提供者）读取扇区大小。


    此案例强调了提供者和磁盘的关键区别。FreeBSD 允许你通过 GEOM 模块 `gnop(8)` 创建透传设备`gnop` 模块允许你在存储设备之间插入任意数据——在这种情况下是强制扇区大小。你创建一个
    `gnop` 设备并表示：“透明地通过所有内容，但坚持使用 4096-byte 扇区大小”。使用该设备创建你的 `zpool`。在这里，我们为标记为 `/dev/gpt/zfs0`
    的分区添加了一个 `gnop` 设备。


    ```

    # sysctl vfs.zfs.min_auto_ashift=12

    # gnop /dev/gpt/zfs0

    ```


