    ```

    # zfs snapshot mypool/sheep@snap1

    ```


    View snapshots with zfs list -t snapshot. To see the snapshots of a specific dataset,
    add the -r flag and the dataset name.


    ```

    # zfs list -t snapshot -r mypool/sheep

    NAME               USED  AVAIL  REFER  MOUNTPOINT

    mypool/sheep@snap1    0      -  1.11M  -

    ```


    Notice that the amount of space used by the snapshot (the USED column) is 0\.
    Every block in the snapshot is still used by the live dataset, so the snapshot
    uses no additional space.


    ### Dataset Changes and Snapshot Space


    Now change the dataset and see how it affects the snapshots. Here we append a
