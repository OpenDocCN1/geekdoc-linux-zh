    schedule or a desperate late-night effort to clean the pool. Maybe there was an
    incident, or this is the starting point for some replication. If you need to keep
    a snapshot, place a hold on it, like your bank does when it doesn’t want you to
    spend your money.


    Use zfs hold, a tag name, and the snapshot name. A tag name is a human-readable
    label for this particular hold.


    ```

    # zfs hold tag dataset@snapshot

    ```


    This locks the snapshot and assigns your tag name. One snapshot can have many
    holds on it, so you can create holds for different purposes.


    Holds can also be recursive. To lock all of the snapshots of the same name on
    child datasets, using a common tag, use -r.


    ```

    # zfs hold -r hostages mypool/test@holdme

    ```


    The zfs holds command lists the holds on a snapshot, or recursively lists all
    the holds on a hierarchy of snapshots.


    ```

    # zfs holds -r mypool/test@holdme

    NAME                     TAG       TIMESTAMP

    mypool/test@holdme       hostages  Fri Apr 3 19:13 2015

    mypool/test/sub1@holdme  hostages  Fri Apr 3 19:13 2015

    mypool/test/sub2@holdme  hostages  Fri Apr 3 19:13 2015

    ```


    A snapshot with a hold cannot be destroyed.


    ```

    # zfs destroy mypool/test@holdme

    cannot destroy snapshot mypool/test@holdme: dataset is busy

    ```


    Release a hold on the dataset with zfs release, giving the tag and the dataset
    name.


    ```

    # zfs release hostages mypool/test@holdme

    ```


    You can now destroy the snapshot. If only getting the bank to release your funds
    was this easy!


    Releasing a hold on a snapshot does not release any hold on its children, however.


    ```

    # zfs destroy -r mypool/test@holdme

    cannot destroy snapshot mypool/test/sub1@holdme: dataset is busy

    cannot destroy snapshot mypool/test/sub2@holdme: dataset is busy

    ```


    To recursively release all of the holds on a snapshot and its children, use the
    -r flag.


    ```

    # zfs release -r hostages mypool/test@holdme

    # zfs destroy -r mypool/test@holdme

    ```


    You can now destroy the child datasets.


    ## Bookmarks


    Newer versions of ZFS support *bookmarks*. Bookmarks are similar to snapshots,
    except they don’t keep the old data around. A bookmark is just the timestamp of
    the snapshot it was created from. Bookmarks are built on the new extensible_dataset
    feature flag.


    ZFS requires a timestamp to do incremental replication. ZFS can easily gather
    up every block that has changed since the bookmark’s timestamp. This allows incremental
    replication, without having to keep the old snapshots around like used to be required.


    Bookmarks are a dataset type related to snapshots, so we’re mentioning them here.
    They get full coverage in *FreeBSD Mastery: Advanced ZFS*.


    ## Clones


    A clone is a new filesystem created from a snapshot. Initially it uses no new
    space, sharing all of its blocks with the snapshot that it was created from. While
    snapshots are read-only, clones are writable like any normal filesystem.


    A clone can be thought of as a “fork” or “branch” of a filesystem. If you have
    a filesystem that contains your web application, you can create a snapshot and
    clone that snapshot. The cloned filesystem can be your test instance of the application,
    letting you apply patches and changes without touching the production instance
    and without consuming extra disk space. You can run tests on the clone version,
    keeping it running alongside the live version.


    Clones do not receive updates made in the original dataset. They’re based on a
    static snapshot. If you want a clone that has your recent updates to the original
    dataset, you must take a new snapshot and create a new clone.


    Clones initially use no disk space. When the clone diverges from the snapshot,
    any changes made to the cloned filesystem are stored as part of the clone, and
    it starts to consume space. You might have a multi-terabyte dataset for your big
    Enterprise Resource Planning (ERP) application, but a fully writable copy of that
    dataset takes up no space at all except for what you change.


    Disk space is already cheap, but clones make it even cheaper.


    ### Creating a Clone


    Use zfs clone to create a clone. Give it two arguments, the source snapshot and
    the destination. If your pool has no mount point, you’ll need to set one on the
    clone to access its contents.


    ```

    # zfs clone mypool/sheep@evenmore mypool/dolly

    ```


