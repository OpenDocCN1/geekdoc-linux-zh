- fmt: '

    A pool with multiple `VDEVs` stripes its data across all the `VDEVs`. This increases
    performance but might cost space, as each individual `VDEV` has its own redundant
    disks. A pool with multiple `VDEVs` probably has increased reliability and fault
    tolerance. While ZFS’ redundancy is all at the `VDEV` level, a pool with multiple
    redundant `VDEVs` can probably withstand more disk failures. The more `VDEVs`
    you have in a pool, the better the pool performs.


    Let’s go through some common `VDEV` configurations and see how the various possible
    arrangements affect performance and capacity. Assume we’re using a set of modest
    commodity 1 TB spinning disks. Each disk is capable of 250 IOPS and streaming
    read/writes at 100 MB/s.


    # One Disk


    With only one disk, there is only one possible configuration, a single ZFS stripe
    VDEV. This is the most basic configuration, and provides no fault tolerance. If
    that one disk dies, all of your data is gone.


    Table 1: Single Disk Virtual Device Configurations


    | Disks | Config | Read IOPS | Write IOPS | Read MB/s | Write MB/s | Usable Space
    | Fault Tolerance |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | Stripe | 250 | 250 | 100 | 100 | 1 TB (100%) | none |


    The performance characteristics of a one-disk stripe device look suspiciously
    like the characteristics of the underlying disk. Weird, huh?


    # Two Disks


    If your system has two disks, you can build your pool out of two stripe `VDEVs`
    or a single mirror `VDEV`.


    Striped `VDEVs` double the available storage and bandwidth, but also double the
    risk of failure. ZFS spreads the blocks of each file over the two disks. If either
    disk fails, all of the data is unusable.


    Using a single mirrored `VDEV` stores each block of data on both disks. This maintains
    the improved read performance, as blocks can be read from both disks at once.
    But you get only the capacity of the smallest disk. Write performance is limited
    to the speed of the slowest disk. One disk can fail, however, and the pool will
    still be usable.


    Table 2: Two-Disk Virtual Device Configurations


    | Disks | Config | Read IOPS | Write IOPS | Read MB/s | Write MB/s | Usable Space
    | Fault Tolerance |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 2 | 2 x Stripe | 500 | 500 | 200 | 200 | 2 TB (100%) | none |

    | 2 | 1 x 2 disk Mirror | 500 | 250 | 200 | 100 | 1 TB (50%) | 1 |


    As the table shows, our mirror pool gets half the write performance of the striped
    pool and has half the space.


    # Three Disks


    Three disks means more options, including a deeper mirror and RAID-Z. You could
    also use a pool of three stripe disks, but the odds of failure are much higher.


    A deeper mirror has more disks, providing more fault tolerance and improved read
    performance. More spindles and heads mean that the `VDEV` can read data from the
    least busy of the three drives, serving random reads more quickly. Write performance
    in a mirror is still limited to the slowest of the drives in the mirror.


    RAID-Z1 offers better space efficiency, as the fault tolerance requires only one
    of the disks in the `VDEV`. Data is spread across all of the drives, so they must
    work together to perform reads and writes. Spreading the data across all the drives
    improves streaming write performance. Unlike a mirror, in RAID-Z all drives can
    write their share of data simultaneously, instead of each drive writing identical
    data.


    Table 3: Three-Disk Virtual Device Configurations


    | Disks | Config | Read IOPS | Write IOPS | Read MB/s | Write MB/s | Usable Space
    | Fault Tolerance |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 3 | 1 x 3 disk Mirror | 750 | 250 | 300 | 100 | 1 TB (33%) | 2 |

    | 3 | 1 x 3 disk RAID-Z1 | 250 | 250 | 200 | 200 | 2 TB (66%) | 1 |


    Note here that IOPS don’t necessarily scale to actual read/write performance.
    A mirror `VDEV` has three times the read IOPS of a RAID-Z1 because the head in
    each drive can work independently, whereas in RAID-Z the heads must work together.
    In megabytes per second mirrors have the advantage of using all of their disks’
    throughput for data, whereas RAID-Z1 loses one disk’s worth of throughput because
    of the parity data. A three-disk mirror also writes half as many MB/s because
    it writes the same data to every disk, whereas RAID-Z1 can spread the writes out
    over all the disks but loses some throughput to parity.


    # Four or Five Disks


    With four or five disks, you get even more options.


    Multiple mirror `VDEVs` (similar to traditional RAID 10) provide the best possible
    performance for random I/O workloads like databases. When you divide four disks
    into two mirror `VDEVs` of two disks each, ZFS stripes the writes across both
    mirrors. One mirror holds half of your data, and the other mirror the other half.
    This helps mitigate the write bottleneck of mirrors, while still providing the
    impressive read performance.


    With four disks, RAID-Z2 becomes an option. RAID-Z2’s two parity disks mean that
    the `VDEV` can continue to operate with the loss of any two disks. When compared
    to a mirror with the same number of disks, the performance is worse; however,
    it no longer matters which two disks fail.


    At five disks, we can deploy RAID-Z3. A RAID-Z3 `VDEV` can survive the loss of
    any three disks. And RAID-Z1 remains an option.


    Table 4: Four or Five-Disk


    | Disks | Config | Read IOPS | Write IOPS | Read MB/s | Write MB/s | Usable Space
    | Fault Tolerance |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 4 | 2 x 2 disk Mirror | 1000 | 500 | 400 | 200 | 2 TB (50%) | 2 (1/VDEV) |

    | 4 | 1 x 4 disk RAID-Z1 | 250 | 250 | 300 | 300 | 3 TB (75%) | 1 |

    | 4 | 1 x 4 disk RAID-Z2 | 250 | 250 | 200 | 200 | 2 TB (50%) | 2 |

    | 5 | 1 x 5 disk RAID-Z1 | 250 | 250 | 400 | 400 | 4 TB (80%) | 1 |

    | 5 | 1 x 5 disk RAID-Z2 | 250 | 250 | 300 | 300 | 3 TB (60%) | 2 |

    | 5 | 1 x 5 disk RAID-Z3 | 250 | 250 | 200 | 200 | 2 TB (40%) | 3 |


    # Six to Twelve Disks


    With large numbers of disks, the decision shifts to fault tolerance, space efficiency,
    and performance. Six disks could become three-mirror `VDEVs`, providing less space.
    A dozen disks can be split into two-mirror `VDEVs`, providing better performance.


    Table 5: Six to Twelve-Disk


    | Disks | Config | Read IOPS | Write IOPS | Read MB/s | Write MB/s | Usable Space
    | Fault Tolerance |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 6 | 3 x 2 disk Mirror | 1500 | 750 | 600 | 300 | 3 TB (50%) | 3 (1/VDEV) |

    | 6 | 2 x 3 disk Mirror | 1500 | 500 | 600 | 200 | 2 TB (33%) | 4 (2/VDEV) |

    | 6 | 1 x 6 disk RAID-Z1 | 250 | 250 | 500 | 500 | 5 TB (83%) | 1 |

    | 6 | 1 x 6 disk RAID-Z2 | 250 | 250 | 400 | 400 | 4 TB (66%) | 2 |

    | 6 | 1 x 6 disk RAID-Z3 | 250 | 250 | 300 | 300 | 3 TB (50%) | 3 |

    | 12 | 6 x 2 disk Mirror | 3000 | 1500 | 1200 | 600 | 6 TB (50%) | 6 (1/VDEV)
    |

    | 12 | 4 x 3 disk Mirror | 3000 | 1000 | 1200 | 400 | 4 TB (33%) | 8 (2/VDEV)
    |

    | 12 | 1 x 12 disk RAID-Z1 | 250 | 250 | 1100 | 1100 | 11 TB (92%) | 1 |

    | 12 | 2 x 6 disk RAID-Z1 | 500 | 500 | 1000 | 1000 | 10 TB (83%) | 2 (1/VDEV)
    |

    '
