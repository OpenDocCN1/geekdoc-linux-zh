    但 ZFS 代码已经公开发布，根据 `CDDL` 许可条款，Oracle 无法阻止人们使用它。各种开源项目都发起了他们自己的 ZFS 开发工作。


    如今，OpenZFS 项目（http://open-zfs.org）是 ZFS 开源版本的主要协调者。OpenZFS 汇聚了来自许多公司和系统的 ZFS 开发者，包括
    Linux、`OS X`、`Illumos` 和 `FreeBSD`。Matt Ahrens 领导该项目。


    与 `FreeBSD` 的其他部分不同，ZFS 使用的是限制性许可。`CDDL` 限制了提起专利诉讼的能力，并且回馈 ZFS 的贡献会自动置于 `CDDL`
    下。`FreeBSD` 的 2 条款 BSD 许可允许任何人将代码用于任何目的，包括专利诉讼。但 `CDDL` 允许对代码进行重用、分发和修改，因此该代码可以在任何常见的企业环境中被任何人使用。然而，如果你想基于
    ZFS 开发产品或在另一个产品中包含 ZFS，请咨询律师。


    ## 前提条件


    本书面向对 ZFS 感兴趣的 `FreeBSD` 系统管理员编写。我们假设你熟悉 `FreeBSD` 的基础知识，包括安装、配置用户以及管理基于 `GEOM`
    的存储。你应该知道什么是“存储提供者”以及我们为什么要使用这个术语。如果你不确定自己的水平，可能会读一本如 *Absolute FreeBSD*（No Starch
    Press, 2007）或其他 *FreeBSD Mastery* 系列书籍来充实知识，或者查阅在线文档和帮助页（man pages）。


    如果你在 `FreeBSD` 以外的操作系统上使用 OpenZFS，本书也提供了许多实用的 ZFS 知识和经验供你借鉴。你需要忽略 `FreeBSD` 特有的内容，但你将学习如何优化和管理
    ZFS。


    我们没有针对 Oracle ZFS 对本书进行测试。Oracle 已经将其闭源 ZFS 推向了另一个方向，如果你必须运行 Oracle Solaris，阅读
    Oracle 的官方文档确实会更好。


    你真的应该了解一些磁盘技术。`FreeBSD` 的 ZFS 可以运行在任何 `GEOM` 提供者之上，但在原始磁盘上运行具有某些优势。在 RAID 容器上运行
    ZFS 会消除这些优势。你应该能够插上 RAID 控制器来充当一组磁盘。


    你还应该有一台测试机器来玩转 ZFS。不要买了这本书就立即将你的主数据库服务器迁移到 ZFS！在测试机器上安装 ZFS，然后是在一台不那么重要的机器上安装。尝试
    ZFS 特性，直到你确信可以最佳配置 ZFS 以支持你系统的目的。虽然 ZFS 很快，但没有哪个文件系统完善到让管理员无法将其配置得性能糟糕。


    ### 在哪里使用 ZFS？


    你可以在任何地方使用 ZFS，但在某些地方它的效果并不良好。


    ZFS 可能不是某些虚拟化系统的最佳选择。我们使用过多个基于 Linux `KVM` 的虚拟化系统，这些系统在处理 ZFS 文件系统时会卡顿，看到其他系统出现类似问题我们也不会感到意外。诸如主机之间的迁移和基于镜像的备份恢复等功能可能会出现问题。在你的虚拟化系统上使用
    ZFS 之前，你需要对其进行充分测试。请注意，Lucas 确实在这些系统上部署了 ZFS，但他使用了替代的备份和迁移策略。


    ZFS 是为现代硬件设计的。它期望你至少有几 GB 的内存。像树莓派这样的嵌入式系统更适合传统的文件系统如 `UFS2`。


    某些硬件上的某些高强度负载在 `UFS2` 上的性能优于 ZFS，尤其是当你拥有具有实际 512 字节扇区的机械硬盘时。如果你想压榨数据库的极限性能，请同时使用
    `UFS2` 和 ZFS 测试其性能。


    ## ZFS 硬件


    许多人为 ZFS 推荐高端硬件。我们也喜欢高端硬件，因为它很很棒。但只要你理解硬件的局限性，ZFS 在通用硬件上运行得同样良好。你在网上找到的许多 ZFS
    文档包含不适用于现代 ZFS 或不适用于 `FreeBSD` 的建议。


    ### 内存 (RAM)


    Sun 的文档说你需要 ECC `RAM` 才能良好运行 ZFS 这并不意外。Sun 销售的是高端服务器。但根据 Matt Ahrens 的说法，“在没有
    ECC 的系统上运行 ZFS 比在有 ECC 系统上运行任何其他文件系统都不会危险。”ZFS 内置的错误修正补偿了大部分但并非所有内存引起的错误。


    当然，支持 ECC `RAM` 的通用理由仍然有效。非 ECC 内存的机器可能会遭受内存损坏，而且某些错误可能会进入磁盘。然而，无论你使用什么文件系统，这种情况都会发生，而
    ZFS 校验提供了识别该问题的希望。如果你正在运行高可用服务，出于所有常规原因你都需要 ECC。但你的 ZFS 笔记本电脑或家庭电影服务器使用普通 `RAM`
    运行依然良好。


    ### RAID 控制器


    千万不要使用硬件 RAID 控制器。永远不要。在硬件 RAID 设备上运行 ZFS 会创建一个兼具 RAID 所有缺点和 ZFS 所有缺点的配置。请使用非
    RAID 的主通道适配器（`HBA`）作为你的磁盘控制器。


    所有的 RAID 都是软件 RAID。你的硬件 RAID 控制器运行一个自定义操作系统来执行 RAID 任务，并在过程中向操作系统隐藏了硬件。这在商业计算普及的早期是有意义的，当时消费者操作系统还不可信可以管理存储。花三秒钟考虑在
    Windows 3.1 上运行操作系统级软件 RAID，你就会理解为什么硬件 RAID 会变得如此普遍。


    我们的操作系统已经进步了。我们的硬件强大了数十倍。环境已经改变。


    ZFS 设计时是为了直接访问硬件。它特意将关键元数据存储在多个磁盘上。它监控这些磁盘的错误，并根据这些错误做出决策。硬件 RAID 设备向操作系统隐藏了所有这些细节，消除了
    ZFS 的自愈能力。硬件 RAID 没有提供竞争优势。


    重建 ZFS 阵列比重建 RAID 阵列快得多，这归于 ZFS 将冗余与文件系统的集成。如果你用硬件管理冗余，就会失去这种速度。


    然而，许多 RAID 控制器不允许在没有某种 RAID 的情况下使用磁盘。即使你将控制器配置为“一组磁盘”或 JBOD，这些控制器实际上也将每块驱动器格式化为单磁盘
    RAID-0。这向操作系统隐藏了某些信息，例如块大小和许多磁盘错误。更糟糕，此类控制器上的磁盘只能由该品牌的控制器读取——有时仅限于该型号的 RAID 控制器！在
    ZFS 上使用此类 RAID 控制器意味着你无法在移动这些硬盘，除非新机器恰好有相同的 RAID 卡。这消除了所有 ZFS 池的可移植性。


    某些硬件 RAID 卡可以重新刷写为 JBOD 控制器。刷写失败可能会导致你的 RAID 卡报废。由于我们作者都不会再次使用硬件 RAID，我们承担了这个风险。


    主通道适配器比 RAID 卡便宜得多——不仅是在金钱上，在时间上也是。使用它们吧。


    '
- fmt: '

    # SATA vs. SAS vs. SSD


    Data storage devices come in a variety of types. ZFS can use `SAS` drives, `SATA`
    drives, spinning platters, `SSD` devices, or any other storage media supported
    by the operating system.


    That’s not to say that the drives are equivalent. `SAS` drives can usually last
    much longer than `SATA` drives under the same load. Flash drives are much faster
    than any kind of spinning disk. ZFS can store data on any of these. Base your
    choice of drive hardware on your organization’s needs, not on ZFS.


    ZFS can make special use of extra-fast storage as read and write caches. If you
    can add a couple of solid state disks to your `SAS` or `SATA`-based storage array,
    you can vastly accelerate ZFS’s performance.


    # Disk Redundancy


    It’s not uncommon for a storage array to lose several disks simultaneously. A
    power surge can damage multiple disks. An intensive array rebuild stresses the
    remaining disks. Heat can build up on one side of the shelf. ZFS supports multiple
    redundancy scenarios for exactly these reasons.


    If you buy a whole bunch of identical disks, they might all be made on the same
    day or in the same batch. A bad day at the manufacturing plant can bite you hard.
    Sadly, disk retailers can’t ship you drives made on different days or in different
    batches. The best you can do is to have each array include drives made by multiple
    manufacturers.


    # Physical Redundancy


    FreeBSD supports multipath storage, allowing you to work around many hardware
    problems. Rearranging your hardware might increase the system’s availability and
    reliability. If you have two external disk arrays, perhaps use a disk from each
    array in your mirrored pair. This way, if a disk array’s power supply dies, each
    mirror still has one active disk. When the failed array is restored, the mirrors
    automatically recover. As this is specialty equipment, we discuss multipath in
    *FreeBSD Mastery: Advanced ZFS*.


    Look at your hardware before installation. Consider how it might fail, and how
    proper arrangement of your kit might prevent outages.


    # Disk Installation and Labeling


    No, not using a label machine and pasting a little sticker on each hard drive.
    The glue on those things never sticks (although you should physically label your
    disks). FreeBSD supports Globally Unique ID (`GUID`) Partition Tables (`GPT`)
    labels, letting you put arbitrary logical markers on a hard drive or a partition.
    If a storage device has a problem, FreeBSD announces the problem and identifies
    the troubled unit by device name or device node. While it’s nice to know that
    disk `/dev/da239` has a problem, you must track that back to a physical device.
    Many ZFS users have machines with many hard drives, exacerbating the issue.


    FreeBSD tools let you get the serial number of a failed drive. Depending on your
    hardware, however, you might have to physically examine each drive to identify
    its serial number. This usually involves either opening a case or pulling individual
    drives out of a disk array. This is tedious, unpleasant, and most often interrupts
    service.


    If you prepare during installation, you can zero right in on a failed disk—even
    a disk at a remote facility. Jude runs a lot of very dense storage arrays in locations
    all over the world, and uses this scheme to keep hard drive maintenance from overwhelming
    him.


    Come up with a naming and numbering scheme for your storage arrays. Many storage
    arrays have a standard naming scheme, often printed on the equipment. If your
    equipment already has numbered shelves, use that numbering. Otherwise, make simple
    rules like “shelf 0 is always at the top and disk 0 is always at the left.” You
    might use the prefix `f` for the front and `b` for the back, or whatever works
    for you.


    Note the serial number of each drive as you install it in the array. Physically
    label each drive tray as you install it by physical location and serial number.
    Yes, this is tedious—but you’ll eventually need this information. You can do this
    work in peace and quiet at your own pace, or you can desperately rush through
    it during an artificially prolonged and unnecessarily stressful outage.


    Now either install FreeBSD or boot live media. Use `camcontrol devlist` to get
    a list of all your storage devices, then run `diskinfo -v` on each storage device
    node to get its serial number. (You can also extract serial numbers from `camcontrol(8)`).
    This will tell you that, say, disk `/dev/da0` is actually disk 3 on shelf 4.


    You now have a list of device nodes and their associated serial numbers, as well
    as a list of physical locations and serial numbers. Match those up with each other,
    and then use `GPT` labels to attach the location and serial number to the disk
    partition you’re using. (See the FreeBSD documentation or *FreeBSD Mastery: Storage
    Essentials* for details on `GPT` labels.) `GPT` labels have a maximum length of
    15 characters, so you might have to truncate long serial numbers. In most serial
    numbers the last digits are most unique, so trim off the front.


    Combined, disk 9 in shelf 2, with a serial number of `WD-WCAW36477223`, might
    get a label like `/dev/gpt/s2d9-AW36477223`.


    You want your system to use these labels, and *only* these labels. Disable `GPTID`
    and `disk ident` labels on the system. This avoids confusion later.


    With this setup, during a hardware failure now FreeBSD can tell you that the third
    disk on shelf 4, serial number such-and-such, is bad. Given that information,
    even the most junior tech at your colocation provider should be able to pull the
    right disk. Have the tech give you the serial number of the replacement drive
    before installation, so you can create the proper labels.


    Advance planning makes outages much less traumatic. We highly recommend it.


    # About this Book


    This book is for anyone who manages ZFS filesystems or who is curious about what
    a modern, high-performance filesystem looks like. While it focuses on ZFS on FreeBSD,
    the general ZFS information applies to any platform running OpenZFS. Parts of
    this book happen to be applicable to other implementations, such as Oracle ZFS,
    but you can’t assume this book applies to other implementations.


    We really wanted to write a single FreeBSD OpenZFS book, but limitations in the
    chosen platforms made that impractical. *Free Mastery: ZFS* covers routine use
    of ZFS. The next book, *FreeBSD Mastery: Advanced ZFS*, covers online replication,
    performance tuning, and other topics requiring greater understanding. The second
    book assumes you understand everything in this book, however.


    OpenZFS advances constantly. This book is a static entity. What’s more, a book
    that covered every OpenZFS feature would be the size of the print version of the
    Manhattan telephone book. These books try to offer what the vast majority of sysadmins
    must know to run ZFS well. If you’re looking for a feature we don’t discuss, or
    you have a special edge case we don’t cover, definitely check the man pages, the
    online OpenZFS documentation, and the FreeBSD mailing lists archives and forums.


    # Book Overview


    Chapter 0 is this introduction.


    Chapter 1, Introducing ZFS, gives you a pterodon’s-eye view of the ZFS software
