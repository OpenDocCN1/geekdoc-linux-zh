    \              ONLINE     0     0     0\n  13792229702739533691  UNAVAIL    0\
    \     0     0  was /dev/gpt/zfs3\n  gpt/zfs4              ONLINE     0     0 \
    \    0\n```\n\nI’ve installed a new drive, which shows up in `/var/run/dmesg.boot`\
