    \ pool with zpool import and the pool name or numerical ID.\n\n```\n# zpool import\
    \ db\n```\n\nIf you have multiple inactive pools with the same name, import the\
    \ pool by ID number instead.\n\n```\n# zpool import 8407636206040904802\n```\n\
    \nYou cannot import a pool if a pool of that name already exists, unless you rename\
    \ the pool.\n\n### Renaming Imported Pools\n\nSome of us reuse pool names between\
    \ machines. When Lucas needs a dedicated pool for a database he always calls it\
    \ db, because it’s short and he’s lazy. This is great for standardization—everyone\
    \ knows exactly where the database files live. It’s an annoyance when moving disks\
    \ to another machine, though. Each machine can have only one pool of each name.\n\
    \nZFS lets you permanently rename a pool by giving the new name after the existing\
    \ name. Here we import the pool called db under the name olddb.\n\n```\n# zpool\
    \ import db olddb\n```\n\nDatasets from the imported pool can be found in /olddb.\
    \ These renames are permanent. You can export and reimport the pool with its new\
    \ name forever.\n\nTo temporarily mount a pool at a location other than its usual\
    \ mount point, use the –R flag and an alternate root path.\n\n```\n# zpool import\
    \ -R /dunno data\n```\n\nThis temporarily adds the path /dunno to all datasets\
    \ in the imported pool. Exporting the pool removes the extra path and unsets the\
    \ altroot property.\n\nUse the altroot property when you don’t know what’s in\
    \ a pool and you don’t want to chance overlaying it on your existing datasets\
    \ or filesystems. Remember, BSD filesystems are stackable! You can also use it\
    \ in an alternate boot environment, where the imported pool might overlay the\
    \ running root filesystem and hide the tools you need to manage the pool.\n\n\
    ### Incomplete Pools\n\nYou can’t import a pool if it doesn’t have enough members\
    \ to provide all the needed data. Much as you can’t use a RAID-Z1 if it’s missing\
    \ two disks, you can’t import a RAID-Z1 with more than one missing disk.\n\n```\n\
    # zpool import\n   pool: db\n id: 8407636206040904802\n  state: UNAVAIL\n status:\
    \ One or more devices are missing from the system.\n action: The pool cannot be\
    \ imported. Attach the missing\n    devices and try again.\n   see: http://illumos.org/msg/ZFS-8000-3C\n\
    \ config:\n\ndb                     UNAVAIL  insufficient replicas\n RAID-Z1-0\
    \             UNAVAIL  insufficient replicas\n  gpt/zfs1             ONLINE\n\
    \  4300284214136283306  UNAVAIL  cannot open\n  gpt/zfs3             ONLINE\n\
    \  3061272315720693424  UNAVAIL  cannot open\n```\n\nThis is a four-provider RAID-Z1,\
    \ but two of the providers are missing. Check that the reinstalled disks are all\
    \ correctly attached and try again.\n\n### Special Imports\n\nPool imports are\
    \ highly useful in recovering from damaged systems. ZFS lets you work around many\
    \ errors and problems when importing pools. This section takes you through some\
    \ special cases of imports.\n\nDestroying a pool doesn’t actually destroy any\
    \ data. It marks the pools as destroyed, but the pools and all their metadata\
    \ remain on the hard drives until overwritten. To tell ZFS to search for destroyed\
    \ but importable pools, add the -D flag.\n\n```\n# zpool import -D\n```"
