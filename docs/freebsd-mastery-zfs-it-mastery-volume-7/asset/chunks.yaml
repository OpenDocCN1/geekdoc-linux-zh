- fmt: "\nTools like `df(1)`, and most other monitoring tools intended for traditional\
    \ filesystems, give incorrect answers. Beware of them! While they might seem fine\
    \ for a quick check, continuing to use these tools further ingrains bad habits.\
    \ Bad systems administration habits cause pain and outages. When monitoring a\
    \ dataset’s free space, make sure you are measuring the actual amount of free\
    \ space, rather than the percentage used. If a traditional tool that shows “percent\
    \ used” gives a meaningful result, it’s only by accident. Your monitoring system\
    \ needs ZFS-specific tools.\n\nThis behavior has interesting side effects when\
    \ viewed with other tools meant for traditional filesystems. A ZFS dataset mounted\
    \ via Samba on a Windows machine will show only a minuscule amount of space used,\
    \ and the remaining amount of space in the pool as the free space. As the pool\
    \ fills with data, Windows sees the drive shrink.\n\nWhen using ZFS, develop the\
    \ habit of managing it with accurate tools.\n\n## Limiting Dataset Size\n\nZFS’\
    \ flexibility means that users and applications can use disk space if it’s available.\
    \ This is very valuable, especially on long-lived systems, but sometimes that’s\
    \ the exact behavior you don’t want. You don’t want datasets like `/var/log` expanding\
    \ to fill your disk and, inversely, you want to be certain that critical datasets\
    \ like your database get the space they need. If the main database runs out of\
    \ space because Jude temporarily stashed his collection of illicit potted fern\
    \ photos in his home directory, you’ll have an unpleasant and unnecessary meeting.\
    \ That’s where quotas and reservations come in.\n\nA quota dictates the maximum\
    \ amount of space a dataset and all its descendants can use up. If you set a quota\
    \ of 100 GB on the dataset mounted as `/home`, the total amount of space used\
    \ by `/home` and all the datasets and snapshots beneath it cannot exceed 100 GB.\
    \ \n\nA reservation dictates an amount of space set aside for a dataset. To ensure\
    \ that a database always has room to write its files, use a reservation to carve\
    \ out an amount of disk space just for that dataset.\n\nWe’ll discuss reservations\
    \ first, then proceed to quotas.\n\n## Reservations\n\nA reservation sets aside\
    \ a chunk of disk space for a dataset and its children. The system will not allow\
    \ other datasets to use that space. If a pool runs out of space, the reserved\
    \ space will still be available for writes to that dataset.\n\nSuppose we reserve\
    \ 100 GB out of a 1 TB pool for `/var/db`, where our database stuffs its data\
    \ files. This dataset has about 50 GB of data in it. A log file runs amok, and\
    \ fills the rest of the pool. We’ll get errors from the other programs on the\
    \ system saying that the disk is full—but the database program will still have\
    \ free space in `/var/db`. It might complain that it can’t write program logs\
    \ to `/var/log/db`, but that’s a separate issue.\n\nZFS manages reservations with\
    \ two ZFS properties: `refreservation` and `reservation`. A `refreservation` affects\
    \ the dataset’s referenced data—that is, it excludes snapshots, clones, and other\
    \ descendants. A `reservation` includes child datasets, snapshots, and so on.\
    \ For an example, look at this snippet from `zfs list`.\n\n```\n# zfs list\nNAME\
    \                    USED  AVAIL  REFER  MOUNTPOINT\nzroot/usr              12.5G\
    \   874G   454M  /usr\nzroot/usr/local        1.84G   874G  1.84G  /usr/local\n\
    zroot/usr/obj          6.89G   874G  6.89G  /usr/obj\nzroot/usr/ports        1.97G\
    \   874G   816M  /usr/ports\n…\n```\n\nThe `zroot/usr` dataset is mounted as `/usr`.\
    \ It “uses” 12.5 GB, including child datasets such as `/usr/local`, `/usr/obj`,\
    \ and so on. It refers to only 454 MB, meaning that the amount of data on the\
    \ main `zroot/usr` dataset is less than half a gigabyte.\n\nIf we set a `reservation`\
    \ of 1 GB on `zroot/usr`, that’s basically moot. The existing files in the child\
    \ datasets far exceed that, and the odds of something non-catastrophic trimming\
    \ those children down to less than 1 GB are negligible.\n\nIf we set a `refreservation`\
    \ of 1 GB on `zroot/usr`, though, it only affects files on `zroot/usr`. The child\
    \ datasets are excluded. The dataset is currently half full, so it would have\
    \ space to write more files.\n\nThat’s an extreme example, but somewhat artificial.\
    \ Suppose you want to ensure that all of your users get at least 1 GB of disk\
    \ space. Create a separate dataset for each user’s home directory and assign each\
    \ a `reservation`.\n\nYou might also nest reservations. Suppose you have two datasets,\
    \ `zroot/var/log` and `zroot/var/log/db`, the latter exclusively for your database\
    \ server. You want to always have at least 10 GB for your database server logs,\
    \ so you assign a `reservation` to `zroot/var/log/db`. Then you want 20 GB for\
    \ generic server logs. If that 20 GB should include the database logs, use a `reservation`.\
    \ If it should not include the database logs, use a `refreservation`.\n\nA dataset\
    \ might have both a `reservation` and a `refreservation`. You might say that the\
    \ dataset `zroot/var/log/db` has a 10 GB `refreservation` for current log files,\
    \ but set a much larger `reservation` so that you can take snapshots of the dataset\
    \ and count their usage separately.\n\nAttempting to violate a `reservation` generates\
    \ an “out of space” error. When that error appears even though you still have\
    \ free space, check your reservations.\n\n### Viewing Reservations\n\nYou can\
    \ check the `reservations` and `refreservations` separately, but we prefer to\
    \ get all information at once. You can view the specific properties by running\
    \ `zfs get`.\n\n```\n# zfs get all zroot/var/log/db | grep reserv\nzroot/var/log/db\
    \  reservation           none   default\nzroot/var/log/db  refreservation    \
    \    none   default\nzroot/var/log/db  usedbyrefreservation  0      -\n```\n\n\
    This dataset has no `reservation` or `refreservation` set. Let’s set some.\n\n\
    ### Setting and Removing Reservations\n\nSet a `reservation` just like you would\
    \ any ZFS property. Here we set a `refreservation` on `/var/log/db` and a `reservation`\
    \ on `/var/log`.\n\n```\n# zfs set refresreservation=10G zroot/var/log/db\n# zfs\
    \ set reservation=20G zroot/var/log\n```\n\nNo matter what, this host will now\
    \ have 10 GB reserved for database logs and 20 GB for the log files, including\
    \ the database directory. We used a `refreservation` for the database logs because\
    \ we don’t want snapshots counted against that reservation.\n\nTo remove a `reservation`,\
    \ set it to `none`.\n\n```\n# zfs set reservation=none zroot/var/log\n```\n\n\
    Other datasets can now use that space.\n\n## Quotas\n\nA *quota* is a maximum\
    \ amount of space that a dataset, user, or user group may use. All of these quotas\
    \ are set on a per-dataset basis. We’ll start with dataset quotas, then investigate\
    \ user and group quotas.\n\n### Dataset Quotas\n\nUse a `quota` when you want\
    \ to set a maximum amount of space that a dataset can consume. For example, you\
    \ might decide that `/tmp` can only use up to 10 GB, or `/home` can only take\
    \ up 200 GB, or any other limit that makes sense to you.\n\nLike reservations,\
    \ ZFS uses two properties for quotas: `quota` and `refquota`. The `quota` property\
    \ sets a maximum amount of space that a dataset and all its children can use.\
    \ The `refquota` property establishes the maximum amount of space that the dataset\
    \ can use, excluding its children. If you want a quota that excludes snapshots\
    \ and child datasets, use the `refquota` property.\n"
