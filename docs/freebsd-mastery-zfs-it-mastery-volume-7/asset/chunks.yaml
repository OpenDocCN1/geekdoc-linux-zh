  trans: "\n请记住，你不能向 RAID-Z VDEV 添加提供者——RAID-Z VDEV 的配置是固定不变的。许多人尝试使用 `zpool add`\
    \ 向 RAID-Z VDEV 添加磁盘。`zpool add` 命令用于向池（pool）中添加新的 VDEV。如果你使用 `-f` 强制 `zpool add`\
    \ 将一个新磁盘放入你基于 RAID-Z 的池，你将得到一个格式错误的池，其中包含一个 RAID-Z 成员和一个条带（stripe）成员。结果性的池无法维护且无法修复。修复它需要备份数据，然后销毁并重建池。\n\
    \n你可以使用 `zpool attach` 来扩展镜像（mirrored）和队列（striped）VDEV，但它对 RAID-Z 池无效。你无法向 RAID-Z\
    \ VDEV 添加提供者。\n\n## 硬件状态\n\n大多数 ZFS 配置都能忍一定程度的硬件故障。当底层存储提供者故障时，ZFS 会尽力警告你。请听从它的。\n\
    \n`zpool status` 命令在 `STATE` 字段中显示存储硬件的状态。在顶部附近有一个整个池的 `STATE` 字段。在下方 `zpool status`\
    \ 列出每个 VDEV 和存储提供者的地方，`STATE` 列可以让你缩小故障位置的范围。\n\n错误会向上传播。如果单个存储提供者故障，池就会产生相关的故障。`zpool\
    \ status` 顶部极其显眼的故障信息是提示你检查单个提供者以查找底层错误的线索。\n\n池和 VDEV 共有六种状态。底层提供者至少拥有这六种状态中的三种。\n\
    \n### 在线 (Online)\n\n`online` 状态的池、VDEV 或提供者运行正常。\n\n### 降级 (Degraded)\n\n`degraded`\
    \ 状态的池缺少一个存储提供者。该提供者要么完全离线、缺失，要么产生错误的速度超过了 ZFS 的容忍范围。降级池保留了足够的韧性继续工作，但再发生一次故障可能导致其停止。\n\
    \n如果存储提供者有太多的 I/O 错误，ZFS 倾向于完全关机（`fault`）该设备。然而，ZFS 确实会尽量避免为池提供必要韧性的设备发生故障。如果镜像中最后一个工作的提供者开始显示许多错误，或者在已经有一个死掉的提供者的\
    \ RAID-Z1 VDEV 中提供者发生故障，ZFS 会将该提供者放入降级模式，而正常情况下会放入故障模式。\n\n### 故障 (Faulted)\n\n\
    `Faulted` 状态的存储提供者要么损坏，要么产生比 ZFS 能容忍的更多的错误。故障存储提供者会带走最后一次良好的数据副本。如果你的双盘镜像丢失了两个磁盘，或者你的\
    \ RAID-Z1 丢失了两个磁盘，VDEV 就会故障。故障的 VDEV 会带走整个池。\n\n### 不可用用 (Unavail)\n\n`Unavail`\
    \ 意味着 ZFS 无法打开存储提供者。也许该设备不再连接到系统，或者可能是导入方式错误（参见本章稍后的“移动池”）。无论如何，它都不在那里，所以 ZFS\
    \ 无法使用它。不可用的设备可能会导致整个 VDEV 甚至整个池丢失。\n\n不可用的设备对 VDEV 状态的影响取决于 VDEV 的韧性。如果池仍有足够的韧性运行，池将变为降级。如果\
    \ VDEV 无法继续运行，它就会故障。\n\n不可用的设备通过分配给它们的 GUID 而不是提供者的设备节点出现在池的状态中。\n\n### 离线 (Offline)\n\
    \n`Offline` 设备是由系统管理员故意关闭的。在大型阵列中关闭磁盘的理由是无穷尽的。\n\n### 已移除 (Removed)\n\n某些硬件可以检测到磁盘在系统运行时从物理上从系统中移除。此类硬件允许\
    \ ZFS 在磁盘被拔出时设置 `Removed` 状态。当你重新连接磁盘时，ZFS 会尝试将提供者恢复为在线。\n\n### 通过 ZFS 栈的错误\n\n\
    这是一个带有几个断开连接的存储提供者的服务器。这不属于 Lucas 或 Jude 的系统；它属于 Lucas 朋友的系统。注意提供者上的错误、VDEV 的类型以及整个池的状态。\n\
    \n```\n# zpool status\n  pool: FreeNAS02\n state: DEGRADED\nstatus: One or more\
    \ devices could not be opened.  Sufficient replicas exist  for\n    the pool to\
    \ continue functioning in a degraded state.\naction: Attach the missing device\
    \ and online it using 'zpool online'.\n   see: http://illumos.org/msg/ZFS-8000-2Q\n\
    \  scan: scrub repaired 0 in 15h57m with 0 errors on Sun Feb  8 15:57:55 2015\n\
    config:\n\nNAME            STATE  READ WRITE CKSUM\nFreeNAS02       DEGRADED \
    \ 0     0     0\n raidz2-0       DEGRADED  0     0     0\n  15881942844…  UNAVAIL\
    \   0     0     0  was /dev/gpt/zfs0\n  gpt/zfs1      ONLINE    0     0     0\n\
    \  gpt/zfs2      ONLINE    0     0     0\n  gpt/zfs3      ONLINE    0     0  \
    \   0\n  gpt/zfs4      ONLINE    0     0     0\n  gpt/zfs5      ONLINE    0  \
    \   0     0\n  gpt/zfs6      ONLINE    0     0     0\n  gpt/zfs7      ONLINE \
    \   0     0     0\n  gpt/zfs8      ONLINE    0     0     0\n  gpt/zfs9      ONLINE\
    \    0     0     0\n  gpt/zfs10      ONLINE    0     0     0\n  gpt/zfs11    \
    \  ONLINE    0     0     0\n  gpt/zfs12      ONLINE    0     0     0\n  gpt/zfs13\
    \      ONLINE    0     0     0\n```\n\n## 恢复设备\n\n如果 ZFS 足够好心地告知你它遇到的问题，你至少应该做的事情就是尝试修复它们。修复过程取决于磁盘是缺失还是故障。\n\
    \n### 缺失磁盘\n\n运行期间断开的磁盘会显示为“已移除”或“故障”。也许你为了检查序列号而移除了磁盘。也许电缆松了。可能是鬼使神差。无论如何，你可能都想把它插回去。\n\
    \n如果硬件能注意到磁盘被移除，而不是仅仅说它了，硬件也会注意到磁盘返回。ZFS 会尝试重新激活恢复的磁盘。\n\n在添加或移除磁盘时不通知系统的硬件需要系统管理员干预以恢复服务。使用\
    \ `zpool online` 命令将重新连接的磁盘恢复服务。\n\n```\n# zpool online gpt/zfs5\n```\n\n### 故障磁盘\n\
    \n更换磁盘最困难的部分通常与 ZFS 无关：你必须找到坏磁盘。我们建议在首次安装磁盘时，在 GPT 标签中使用磁盘的物理位置，以便以后更换。如果你必须在没有这些信息的情况下识别故障磁盘，请使用\
    \ `gpart list` 和 `smartctl` 获取磁盘的序列号和制造商，然后在机箱中寻找该磁盘。这与第 0 章讨论的过程是反的，只是增加了非计划停机的压力。最坏的情况下，你可以找到所有仍在工作的磁盘的序列号，通过排除法就能发现是哪块磁盘丢失了。\n\
    \n"
- fmt: "\nUse the command `zpool replace` to remove a drive from a resilient VDEV\
    \ and swap a new drive in. The drive doesn’t have to be failed—it could be a perfectly\
    \ healthy drive that you want to replace so that you can, say, do maintenance\
    \ on the disk shelf. Here’s a RAID-Z1 pool with a bad drive.\n\n```\nNAME    \
    \    STATE   READ WRITE CKSUM\ndb          DEGRADED   0     0     0\n raidz1-0\
    \   DEGRADED   0     0     0\n  gpt/zfs1  ONLINE     0     0     0\n  gpt/zfs2\
    \  ONLINE     0     0     0\n  gpt/zfs3  FAULTED    0     0     0\n  gpt/zfs4\
    \  ONLINE     0     0     0\n```\n\nThe `/var/log/messages` log includes many\
    \ warnings about the physical disk underlying `gpt/zfs3`. This disk needs to be\
    \ put out of our misery. Use `zpool replace` to remove the faulted provider from\
    \ the VDEV and replace it with a new device. Give the pool name, the failed provider,\
    \ and the new provider.\n\n```\n# zpool replace db gpt/zfs3 gpt/zfs5\n```\n\n\
    This command might take a long time, depending on the disk’s capacity and speed\
    \ and the amount of data on the disk. You can view the status of the replacement\
    \ by checking the pool’s status.\n\n```\n# zpool status db\n  pool: db\n state:\
    \ DEGRADED\nstatus: One or more devices is currently being resilvered.  The pool\
    \ will\n    continue to function, possibly in a degraded state.\naction: Wait\
    \ for the resilver to complete.\n  scan: resilver in progress since Mon Mar 16\
    \ 12:04:50 2015\n    195M scanned out of 254M at 19.5M/s, 0h0m to go\n    47.3M\
    \ resilvered, 76.56% done\nconfig:\n\nNAME           STATE READ WRITE CKSUM\n\
    db             ONLINE   0     0     0\n raidz1-0      ONLINE   0     0     0\n\
    \  gpt/zfs1     ONLINE   0     0     0\n  gpt/zfs2     ONLINE   0     0     0\n\
    \  replacing-2  ONLINE   0     0     0\n  gpt/zfs3     FAULTED  0     0     0\n\
    \  gpt/zfs5     ONLINE   0     0     0  (resilvering)\n  gpt/zfs4     ONLINE \
    \  0     0     0\n```\n\nThe resilvering time estimates given assume that disk\
    \ activity is fairly constant. Starting a big database dump halfway through the\
    \ resilvering process delays everything.\n\n### Replacing the Same Slot\n\nPerhaps\
    \ your hard drive array is full, and you don’t have the space to slot in a new\
    \ hard drive with a new device node. You must physically remove the failed hard\
    \ drive, mount the replacement in its space, partition and label the drive, and\
    \ replace the provider. That’s only slightly more complex.\n\nThis method has\
    \ more risks, however. With `zpool replace`, the faulted provider remains as online\
    \ as it can manage until resilvering finishes. If you lose a second disk in your\
    \ RAID-Z1 during resilvering, there’s a chance the pool has enough data integrity\
    \ to survive. If you replace the faulty provider before starting the rebuild,\
    \ you lose that safety line. If your hardware doesn’t give you the flexibility\
    \ you need for a safer replacement, though, check your backups and proceed.\n\n\
    Start by taking the failed provider offline. This tells ZFS to stop trying to\
    \ read or write to the device.\n\n```\n# zpool offline gpt/zfs3\n```\n\nYou can\
    \ now remove the failed drive from the array and install its replacement. Partition\
    \ the provider as needed. If you’re unsure of partitioning, you can copy an existing\
    \ disk’s partition table to another disk with something like `gpart backup da0\
    \ | gpart restore da9`. Use the new provider label in `zpool replace`. If the\
    \ label on the new provider is identical to the label on the drive you removed,\
    \ you don’t have to repeat the provider name. Here we replace `gpt/zfs3` with\
    \ a new disk, also labeled `gpt/zfs3`.\n\n```\n# zpool replace db gpt/zfs3\n```\n\
    \nIf you’re labeling your disks by serial number, as we recommend in Chapter 0,\
    \ you won’t have this issue.\n\n### Replacing Unavail Drives\n\nIf a drive status\
    \ is UNAVAIL, ZFS identifies the missing drive by its GUID and gives the previous\
    \ device name off to the side. The zpool can still function, but you really need\
    \ to replace the drive.\n\n```\nNAME                    STATE   READ WRITE CKSUM\n\
