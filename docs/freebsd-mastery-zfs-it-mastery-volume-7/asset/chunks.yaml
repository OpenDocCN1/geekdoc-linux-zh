    ```

    # zfs rollback mypool/delorean@thepresent

    ```


    This takes less time than you might think. Remember, all the data and metadata
    is already on disk. ZFS only switches which set of metadata it uses. Once the
    rollback finishes, the live filesystem contains all the files from the chosen
    snapshot.


    ```

    # cat /delorean/timecapsule.txt

    “this is the present”

    ```


    Your newer changes to the dataset are gone, and unrecoverable.


    While this is a simple example, you can do the exact same thing for a software
    upgrade, a database migration, or any other risky operation. Operations that once
    required annoying restorations from offline backup can now be handled in a single
    command.


    You can only roll a filesystem back to the most recent snapshot. It is not possible
    to surf forwards and backwards like in the movies. If you want to return to an
    earlier snapshot, “thepast,” you must destroy all snapshots newer than your target.


    ```

    # zfs rollback mypool/delorean@thepast

    cannot rollback to ''mypool/delorean@thepast'': more recent snapshots or bookmarks
    exist

    use ''-r'' to force deletion of the following snapshots and bookmarks:

    mypool/delorean@thepresent

    ```


    The `zfs rollback` command can destroy all the intermediate snapshots for you
    if you use the recursive `-r` flag. This is not the same kind of multi-dataset
    recursion used in creating and destroying snapshots. Using `rollback -r` does
    not roll back the children. You must roll back each dataset separately.


    ```

    # zfs rollback -r mypool/delorean@thepast

    # cat /delorean/timecapsule.txt

    “this is the past”

    ```


    You’ve gone back in time, and can now try your risky and painful upgrade again.
    Congratulations!


    ## Diffing snapshots


    Sometimes you really want to know what changed between the time the snapshot was
    taken and now. If the database server started crashing at noon today, you probably
    want to compare the state of the filesystem right now with the 11 AM snapshot
    so you can see if anything changed. You could use `find(1)` to look for files
    modified since the snapshot was created, or you could use `diff(1)` to compare
    the files from the snapshot with the ones from the live filesystem. ZFS already
    has this information, however, and makes it available with `zfs diff`.


    To look at the difference between a snapshot and the live filesystem, run `zfs
    diff` and give it a snapshot name.


    ```bash

    # zfs diff mypool/sheep@later


    M /mypool/sheep/randomfile

    ```


    Files can be in four states. A `-` means that the file was removed. A `+` means
    that the file was added. An `M` indicates that the file has been modified. And
    an `R` shows that the file has been renamed. Our example here shows that the file
    `/mypool/sheep/randomfile` was modified after the snapshot was taken.


    You can also compare two snapshots.


    ```

    # zfs diff mypool/sheep@later @muchlater

    M   /mypool/sheep/

    +   /mypool/sheep/newfile

    -   /mypool/sheep/zfsbook.html

    R   /mypool/sheep/date.txt -> /mypool/sheep/olddate.txt

    M   /mypool/sheep/randomfile

    ```


    The directory `/mypool/sheep` was modified. The file `/mypool/sheep/newfile` was
    added, while the file `/mypool/sheep/zfsbook.html` was removed. We have a file
    rename and, again, the file `randomfile` was modified.


    You can also get even more detail. If you add the `-t` flag, the output includes
    the change’s timestamp from the inode. The `-F` flag includes the type of the
    file. Check `zfs(8)` to get the full list of file types.


    ## Automatic Snapshot Regimen


    Snapshots are useful even if you create them only for special events. If you create
    snapshots automatically on a schedule, however, they become extremely useful.
    It’s simple enough to schedule creating a recursive snapshot of your system every
    15 minutes. If you keep all of these snapshots, your pool fills up, however. Automated
    snapshots need rotating and discarding just like backup tapes.


    ### Rotation Schedule


    The hard part of scheduling the creation and destruction of snapshots is figuring
    out how you might use the snapshots. Who are your users? What applications might
    need snapshots? We can’t answer those questions for you.


    One common setup is built around weekly, daily, hourly, and 15-minute snapshots.
    You take weekly snapshots that you keep for two months. Daily snapshots are retained
    for two weeks. Your hourly snapshots are retained for three days. Then you take
    snapshots every 15 minutes and keep those for six hours.


    Maybe you need only four 15-minute snapshots. Or you must retain monthly snapshots
    for a year. The regimen right for you depends on many factors. How important is
    your data? How far back might you have to reach? How space constrained are you?
    How often do your files change, and how much new data gets written each day? Do
    you have IT audit controls that dictate how long certain data must be retained?
    Talk with other people on your team, and figure out a schedule that works for
    your organization.


    Once you have your desired schedule, ZFS tools can help you deploy it.


    ### ZFS Tools


    Many scripts and software packages can manage ZFS snapshots for you. We recommend
    `ZFS Tools` (https://github.com/bdrewery/zfstools), as it doesn’t use a configuration
    file. It does need `cron(8)`, but you don’t have to mess with any kind of `zfools.conf`.
    ZFS Tools takes its configuration from user-defined properties set within ZFS.


    ```bash

    # pkg install zfstools

    ```


    ### zfs-auto-snapshot


    The `zfs-auto-snapshot` script creates and deletes snapshots. It takes two arguments:
    the name of the snapshot, and the number of those to keep. For example, `zfs-auto-snapshot
    frequent 4` creates a `frequent` snapshot and keeps four of them.


    ```bash

    15,30,45 * * * root /usr/local/sbin/zfs-auto-snapshot frequent 4

    ```


    ```bash

    0    * * * root /usr/local/sbin/zfs-auto-snapshot hourly 24

    ```


    ```bash

    7    0 * * root /usr/local/sbin/zfs-auto-snapshot daily 7

    ```


    ```bash

    14   0 * * 7 root /usr/local/sbin/zfs-auto-snapshot weekly 4

    ```


    ```bash

    28   0 1 * * root /usr/local/sbin/zfs-auto-snapshot monthly 12

    ```


    These crontab entries are designed for `/etc/crontab`. If you use them in root’s
    crontab, you must remove the user (root) entry from each. In either case, be sure
    to include the `PATH` variable so `zfs-auto-tools` can find Ruby.

