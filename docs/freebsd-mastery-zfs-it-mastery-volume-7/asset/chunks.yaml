- fmt: "\nVirtual devices such as mirrors and RAID-Z are specifically designed to\
    \ reconstruct missing data on damaged disks. If a disk in your mirror pair dies,\
    \ you replace the disk and ZFS will copy the surviving mirror onto the new one.\
    \ If a disk in your RAID-Z VDEV fails, you replace the broken drive and ZFS rebuilds\
    \ that disk from parity data. This sort of data recovery is a core feature of\
    \ every RAID implementation.\n\nZFS understands both the filesystem and the underlying\
    \ storage, however. This gives ZFS latitude and advantages that traditional RAID\
    \ managers lack.\n\nRebuilding a disk mirrored by software or hardware RAID requires\
    \ copying every single sector from the good disk onto the replacement. The RAID\
    \ unit must copy the partition table, the filesystem, all the inodes, all the\
    \ blocks (even the free space), and all the data from one to the other.\n\nWe’ve\
    \ all made a typo in `/etc/rc.conf` that prevented a system from booting. Fixing\
    \ that typo on a system mirrored with UFS2 and `gmirror(8)` required booting into\
    \ single-user mode, fixing the typo, and rebooting. This made one of the disks\
    \ out of sync with the other. At the reboot, FreeBSD noticed the discrepancy and\
    \ brought the backup disk into sync by copying every single sector of the current\
    \ drive onto the backup. You might have changed one or two sectors on the disk,\
    \ but `gmirror(8)` had to copy the whole thing. This might take hours or days.\n\
    \nZFS knows precisely how much of each disk is in use. When ZFS reassembles a\
    \ replacement storage provider, it copies only the data actually needed on that\
    \ provider. If you replace a ZFS disk that was only one-third data, ZFS copies\
    \ only that one-third of a disk of data to the replacement.\n\nFixing a `rc.conf`\
    \ typo on a ZFS-mirrored disk requires sysadmin intervention very similar to that\
    \ needed on a `gmirror(8)` system. You get into single-user mode. You fix the\
    \ typo. You reboot. The difference is, ZFS knows exactly which blocks changed\
    \ on the disk. If only one of the disks was powered on during single user mode\
    \ (unlikely, but it could happen), the two disks would be out of sync. Rather\
    \ than try to copy the entire disk, ZFS updates only the blocks needed to resynchronize\
    \ the disks. The system will probably repair the mirror before you can type a\
    \ command to see how it’s doing.\n\nZFS reconstruction is called `resilvering`.\
    \ Like other ZFS integrity operations, resilvering takes place only on live filesystems.\
    \ You could resilver in single-user mode, but it makes as much sense as installing\
    \ software in single-user mode.\n\nResilvering happens automatically when you\
    \ replace a storage provider. It also happens when a drive temporarily fails and\
    \ is restored, such as when a controller restarts or an external disk shelf reboots.\
    \ While resilvering a replacement storage provider can take quite a while, resilvering\
    \ after a brief outage probably takes only seconds.\n\nIf you use a RAID-Z pool\
    \ normally while resilvering, resilvering can greatly slow down. Resilvering and\
    \ scrubbing are performed in order by transaction groups, while normal read-write\
    \ operations are pretty random. ZFS’ resilver rate is throttled so that it won’t\
    \ impact normal system function.\n\n## Expanding Pools\n\nData expands to fill\
    \ all available space. No matter how much disk space you give a pool, eventually\
    \ you’ll want more. To increase a pool’s size, add a VDEV to the pool. For redundant\
    \ pools, you can replace storage providers with larger providers.\n\nWhen you\
    \ expand a pool, ZFS automatically starts writing data to the new space. As the\
    \ pool ages, ZFS tries to evenly balance available space between the various providers.\
    \ ZFS biases the writes to the drives so that they will all become full simultaneously.\
    \ A pool with one empty VDEV and three nearly full ones has little choice but\
    \ to put new data on the empty VDEV, however. If you frequently create and delete\
    \ files, per-disk load eventually levels out.\n\nEvery VDEV within a `zpool` should\
    \ be identical. If your pool is built from a bunch of mirrors, don’t go adding\
    \ a RAID-Z3 to the pool.\n\nAdd providers to VDEVs with the `zpool attach` command\
    \ and VDEVs to pools with the `zpool add` command.\n\nYou can’t remove a device\
    \ from a non-mirror VDEV or any VDEV from a pool. The `-n` flag to `zpool add`\
    \ performs a “dry run,” showing you the results of what running the command would\
    \ be without actually changing the pool. Running your `zpool add` command with\
    \ the `-n` flag and carefully studying the resulting pool configuration can give\
    \ you warning you’re about to shoot yourself in the foot.\n\n### Adding VDEVs\
    \ to Striped Pools\n\nStriped pools, with no redundancy, can be expanded up to\
    \ the limits of the hardware. Each non-redundant VDEV you add to a pool increases\
    \ the odds of a catastrophic failure, however, exactly like the RAID-0 device\
    \ it resembles. Remember, the failure of a single VDEV in a pool destroys the\
    \ entire pool. In a striped pool, each disk is a standalone VDEV.\n\nHere’s a\
    \ striped pool with three providers.\n\n```\n# zpool status scratch\n…\nconfig:\n\
    \nNAME       STATE  READ WRITE CKSUM\nscratch    ONLINE    0     0     0\n gpt/zfs0\
    \  ONLINE    0     0     0\n gpt/zfs1  ONLINE    0     0     0\n gpt/zfs2  ONLINE\
    \    0     0     0\n```\n\nUse the `zpool add` command to add a storage provider\
    \ to the scratch pool.\n\n```\n# zpool add scratch gpt/zfs3\n```\n\nThe pool status\
    \ now shows four storage providers, and you have your additional disk space.\n\
    \n### Adding VDEVs to Mirror Pools\n\nYou can add providers to a mirrored VDEV,\
    \ but extra disks don’t increase the available space. They become mirrors of each\
    \ other. To add space to a pool that uses mirrored VDEVs, add a new VDEV.\n\n\
    The zpool db currently has two mirror VDEVs.\n\n```\n# zpool status db\n...\n\
    NAME        STATE READ WRITE CKSUM\ndb          ONLINE   0     0     0\n mirror-0\
    \   ONLINE    0     0     0\n  gpt/zfs0  ONLINE    0     0     0\n  gpt/zfs1 \
    \ ONLINE    0     0     0\n mirror-1   ONLINE    0     0     0\n  gpt/zfs2  ONLINE\
    \    0     0     0\n  gpt/zfs3  ONLINE    0     0     0\n```\n\nWe need more space,\
    \ so we want to add a third mirror. Use the `zpool add` command to create a new\
    \ mirror and add it to the pool. Here we use the providers `gpt/zfs4` and `gpt/zfs5`\
    \ to create a new mirror and add it to the pool.\n\n```\n# zpool add db mirror\
    \ gpt/zfs4 gpt/zfs5\n```\n\nThe pool status now shows new mirror VDEV, `mirror-2`,\
    \ containing two providers. To view how a pool distributes data between the VDEVs,\
    \ use `zpool list -v`.\n\n### Adding VDEVs to RAID-Z Pools\n\nYou cannot add providers\
    \ to any RAID-Z VDEV. To expand a RAID-Z-based pool, you must add additional VDEVs\
    \ to the pool, or replace each member disk with a larger one. Best practice is\
    \ to make all of the RAID-Z VDEVs use the same number of drives.\n\nHere’s a RAID-Z\
    \ pool that we want to expand with another VDEV.\n\n```\nconfig\n\nNAME      \
    \  STATE READ WRITE CKSUM\ndb          ONLINE   0     0     0\n raidz1-0   ONLINE\
    \   0     0     0\n  gpt/zfs0  ONLINE    0     0     0\n  gpt/zfs1  ONLINE   \
    \ 0     0     0\n  gpt/zfs2  ONLINE    0     0     0\n```\n\nAgain, we use the\
    \ `zpool add` command to create a new VDEV and add it to the pool.\n\n```\n# zpool\
    \ add db raidz1 gpt/zfs3 gpt/zfs4 gpt/zfs5\n```\n\nA check of the pool status\
    \ shows a new VDEV, `raidz1-1`, containing three providers. ZFS starts striping\
    \ data across the new provider immediately.\n\nIf you want to add a new VDEV to\
    \ a RAID-Z2 or RAID-Z3-based pool, use the same command with the desired RAID-Z\
    \ type and the appropriate number of providers.\n"
  raw: "Virtual devices such as mirrors and RAID-Z are specifically designed to reconstruct\
    \ missing data on damaged disks. If a disk in your mirror pair dies, you replace\
    \ the disk and ZFS will copy the surviving mirror onto the new one. If a disk\
    \ in your RAID-Z VDEV fails, you replace the broken drive and ZFS rebuilds that\
    \ disk from parity data. This sort of data recovery is a core feature of every\
    \ RAID implementation.\n\nZFS understands both the filesystem and the underlying\
    \ storage, however. This gives ZFS latitude and advantages that traditional RAID\
    \ managers lack.\n\nRebuilding a disk mirrored by software or hardware RAID requires\
