    \ to see how it’s doing.\n\nZFS reconstruction is called *resilvering*. Like other\
    \ ZFS integrity operations, resilvering takes place only on live filesystems.\
    \ You could resilver in single-user mode, but it makes as much sense as installing\
    \ software in single-user mode.\n\nResilvering happens automatically when you\
    \ replace a storage provider. It also happens when a drive temporarily fails and\
    \ is restored, such as when a controller restarts or an external disk shelf reboots.\
