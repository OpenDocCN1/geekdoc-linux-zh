    ## 每个快照的空间占用


    对于快照来说，一个特别属性属性是 `written` 属性，它可以让你了解该快照包含了多少新数据。


    ```bash

    # zfs list -d 1 -t all -o name,used,refer,written mypool/sheep

    NAME                   USED  REFER  WRITTEN

    mypool/sheep          10.3M  6.11M    2.07M

    mypool/sheep@all          0  2.11M    2.11M

    mypool/sheep@snap2        0  2.11M        0

    mypool/sheep@evenmore     0  2.11M        0

    mypool/sheep@later    2.07M  5.11M    4.07M

    mypool/sheep@rewrite  1.07M  5.11M    2.07M

    ```


    记住，快照按创建日期顺序出现。活动数据集首先出现——虽然它包含的数据可能比任何快照都新，但它是在任何快照创建之前创建的。快照 `@all` 是最旧的，然后是
    `@snap2`，依此类推。


    第一个快照 `@all` 允许你访问 2.11 MB 的数据（`REFER` 列）。该快照还包含 2.11 MB 的新写入数据。这是该快照与上一个快照之间的区别。


    快照 `@snap2` 和 `@evenmore` 没有新数据。它们与第一个快照相比没有变化。


    在快照 `@evenmore` 和 `@later` 之间，数据增长了。快照 `@later` 允许你访问 5.11 MB 的数据。它有 4.07 MB 的新数据。


    `@rewrite` 快照也允许你访问 5.11 MB 的数据，但它写入了 2.07 MB 的新数据。由于你可以访问的数据与上一个快照相同，某些旧数据可能已被覆盖。


    活动文件系统也覆盖了 1 MB 的数据。这些数据现在仅包含在 `@rewrite` 快照中。


    ## 访问快照


    访问快照内容最方便的方法是通过`快照目录`（或 `snapdir`）。每个 ZFS 数据集的根目录都有一个隐藏的 `.zfs` 目录。该目录有一个快照目录，该快照目录又为每个快照有一个目录。


    ```bash

    # ls /mypool/sheep/.zfs

    total 1

    dr-xr-xr-x  2 root  wheel  2 Mar 29 00:30 shares

    dr-xr-xr-x  2 root  wheel  2 Mar 30 16:27 snapshot

    # ls -l /mypool/sheep/.zfs/snapshot

    total 1

    drwxr-xr-x  2 root  wheel  5 Mar 29 00:40 snap1

    drwxr-xr-x  2 root  wheel  5 Mar 29 00:40 second

    ```


    进入该目录，你就会发现自己处于快照的根目录中。快照中的每个文件都按照快照时的状态完整保留，精确到文件访问时间。要从快照中恢复单个文件，请将其复制回主文件系统。


    ### 隐藏的 snapdir


    `.zfs` snapdir 默认是的。即使你运行 `ls -lA`，它也不会显示。这防止了备份程序、`rsync` 类似的软件进入其中。如果你想让 `.zfs`
    目录显示，请将数据集的 `snapdir` 属性设置为 `visible`。


    ```bash

    # zfs set snapdir=visible mypool/sheep

    ```


    一旦在数据集上运行 `cp -R` 递归地将你所有的快照复制到文件系统并搞乱一切，请通过将 `snapdir` 属性设置为 `hidden` 来再次隐藏它。


    ### 挂载快照


    你可以像挂载任何其他文件系统一样挂载快照。


    ```bash

    # mount -t zfs mypool/sheep@snap1 /mnt

    ```


    在手动挂载快照期间，你无法通过隐藏的 `.zfs` 目录访问它。即使是挂载的快照仍然是只读的


    ## 删除快照


    快照防止它们使用的块被释放。这意味着在你停止使用这些块之前（通过删除引用这些块的所有快照），你无法回收这些空间。


    创建一个快照，然后删除它：


    ```bash

    # zfs snapshot mypool/sheep@deleteme

    # zfs destroy mypool/sheep@deleteme

    ```


    并不难，对吧？


    你还可以添加详细标志（`-v`）来获取有关正在删除内容的更多详细信息。虽然在删除单个快照时详细模式帮助不大，但当你删除更多数据集或想查看命令实际上将执行什么而不实际运行它时，它就会变得更有价值。

