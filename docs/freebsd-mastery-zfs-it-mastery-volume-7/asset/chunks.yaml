- fmt: '

    The `SOURCE` column shows where this property is set. This can be a single dash,
    or the words `default` or `local`. A dash means that this property isn’t set per
    se, but rather somehow read from the pool. You don’t set the value for the pool’s
    size or how much of that space is used. FreeBSD calculates those values from the
    pool. A `SOURCE` of `default` indicates that this property is set to its default
    value, while `local` means that this property has been specifically set on this
    pool.


    To get a single property, run `zpool get` with the property name.


    ```

    # zpool get size

    NAME   PROPERTY  VALUE  SOURCE

    db     size      2.72T  -

    zroot  size      920G   -

    ```


    Narrow this down by giving the pool name at the end.


    ## Changing Pool Properties


    We’ll set properties throughout this book to change pool behavior. Change a pool’s
    properties using the `zpool set` command. Here we set a pool’s comment property.


    ```

    # zpool set comment="Main OS files" zroot

    ```


    This comment now appears within the property list.


    ```

    # zpool get comment

    NAME   PROPERTY  VALUE          SOURCE

    db     comment   -              default

    zroot  comment   Main OS files  local

    ```


    Note the `SOURCE` column here. By default, pools have no comment. Now that I’ve
    set a comment, though, the source changes to `local`. Once a property’s source
    changes from `default` to `local`, it remains local forever. Even setting the
    property to the default value won’t change the source.


    ```

    # zpool set comment="-" zroot

    # zpool get comment

    NAME   PROPERTY  VALUE  SOURCE

    db     comment   -      default

    zroot  comment   -      local

    ```


    We locally set the comment to the default value, so the value’s source remains
    local.


    You can set a pool’s properties at creation time with `-o`. You can set properties
    for the root dataset on that pool with `-O`.


    ```

    # zpool create -o altroot=/mnt -O canmount=off -m none zroot /dev/gpt/disk0

    ```


    The pool has its `altroot` property set to `/mnt`, and the root dataset on this
    pool has the `canmount` property set to `off`. If a property changes how data
    is written, only data written after changing the property is affected. ZFS won’t
    rewrite existing data to comply with a property change.


    ## Pool History


    Every `zpool` retains a copy of all changes that have ever been made to the pool,
    all the way back to the pool’s creation. This history doesn’t include routine
    events like system power-on and power-off, but it does include setting properties,
    pool upgrades, and dataset creation.


    To access the history, run `zpool history` and give the pool name.


    ```

    # zpool history zroot

    History for ''zroot'':

    2014-01-07.04:12:05 zpool create -o altroot=/mnt -O canmount=off -m none zroot
    mirror /dev/gpt/disk0.nop /dev/gpt/disk1.nop

    2014-01-07.04:12:50 zfs set checksum=fletcher4 zroot

    2014-01-07.04:13:00 zfs set atime=off zroot

    …

    ```


    Experienced FreeBSD hands probably recognize this from any number of ZFS tutorials
    in the FreeBSD documentation and forums.


    The history ends with:


    ```

    ...


    2015-03-12.14:36:35 zpool set comment=Main OS files zroot


    2015-03-12.14:43:45 zpool set comment=- zroot

    ```


    We changed the comment property, so it’s in the history. Forever.


    Sadly, the pool history doesn’t track who made each change, but having a permanent
    record of changes helps with problem analysis.


    ## Zpool Maintenance Automation


    FreeBSD checks each system’s filesystems as part of the daily maintenance job
    run by `periodic(8)`. You can add ZFS pool information to this check, so that
    you’ll get information on pool health. The `daily_status_zfs_enable` option in
    `periodic.conf` enables pool checks.


    ```bash

    daily_status_zfs_enable="YES"

    ```


    The daily `periodic(8)` output now includes the output of `zpool status -x`, which
    is normally the single line of “all pools are healthy.”


    If you want more detailed information on your pools, the daily report can also
    include `zpool list` output. Set `daily_status_zfs_zpool_list` to `YES` to get
    the list. If you want to trim that output, showing only the status of specific
    pools, list the desired pools in the `daily_status_zpool` variable in `periodic.conf`.


    You can also have FreeBSD perform your pool scrubs. With the scrubbing options
    set, FreeBSD performs a daily check to see if the pool needs scrubbing, but only
    scrubs at configured intervals. To automatically scrub every pool every 35 days,
    set `daily_scrub_zfs_enable` to `YES` in `periodic.conf`.


    ```bash

    daily_scrub_zfs_enable="YES"

    ```


    FreeBSD defaults to scrubbing all pools. You can’t explicitly exclude specific
    pools from the daily scrub check. You can, however, explicitly list the pools
    you want checked in `daily_scrub_zfs_pools`. Any pool not listed isn’t scrubbed.


    ```bash

    daily_scrub_zfs_pools="zroot prod test"

    ```


    To change the number of days between scrubs, set `daily_scrub_zfs_enable` to the
    desired value.


    ```bash

    daily_scrub_zfs_enable="10"

    ```

