    All of these pools have a single VDEV. What if you want multiple VDEVs, though?\n\
    \n### Multi-VDEV Pools\n\nYou can create a pool with multiple VDEVs. The keywords\
    \ `mirror`, `raidz`, `raidz2`, and `raidz3` all tell `zpool(8)` to create a new\
    \ VDEV. Any storage providers listed after one of those keywords goes into creating\
    \ a new instance of that VDEV. When one of the keywords appears again, `zpool(8)`\
    \ starts with a new VDEV.\n\nThe opening of this chapter covered striping across\
    \ multiple mirrors, simulating a traditional RAID-10 setup. Here we do exactly\
    \ that.\n\n```\n# sysctl vfs.zfs.min_auto_ashift=12\n# zpool create barrel mirror\
    \ gpt/zfs0 gpt/zfs1 mirror gpt/zfs2 gpt/zfs3\n```\n\nThe first three words, `zpool\
    \ create barrel`, tell `zpool(8)` to instantiate a new pool, named `barrel`. The\
    \ `mirror` keyword says “create a mirror.” We then have two storage providers,\
    \ `gpt/zfs0` and `gpt/zfs1`. These storage providers go into the first mirror.\
    \ The word `mirror` appears again, telling `zpool(8)` that the previous VDEV is\
    \ complete and we’re starting on a new VDEV. The second VDEV also has two storage\
    \ providers, `gpt/zfs2` and `gpt/zfs3`. This pool’s status looks different than\
    \ anything we’ve seen before.\n\n```\n# zpool status barrel\n  pool: barrel\n\
    \ state: ONLINE\n  scan: none requested\nconfig:\n\nNAME       STATE READ WRITE\
    \ CKSUM\nbarrel     ONLINE   0     0     0\n mirror-0  ONLINE   0     0     0\n\
    \  gpt/zfs0 ONLINE   0     0     0\n  gpt/zfs1 ONLINE   0     0     0\n mirror-1\
    \  ONLINE   0     0     0\n  gpt/zfs2 ONLINE   0     0     0\n  gpt/zfs3 ONLINE\
    \   0     0     0\n```\n\nThe pool has two VDEVs, `mirror-0` and `mirror-1`. Each\
    \ VDEV includes two storage devices. We know that `mirror-0` and `mirror-1` are\
    \ part. (Wait, I'll just provide the final output now).\n\n(Self-correction: I\
