    ### Enabling Automatic Snapshots


    The `zfs-auto-snapshot` script only creates snapshots of datasets that have the
    `com.sun:auto-snapshot` property set to `true`. Datasets without this property,
    or that have it set to any value other than true, will not get snapshotted. Setting
    this property on a dataset lets all of the child datasets inherit it.


    Here we set `com.sun:auto-snapshot` on the root dataset of the pool `mypool`.


    ```

    # zfs set com.sun:auto-snapshot=true mypool

    ```


    When `zfs-auto-snapshot` runs, it creates snapshots of every dataset in `mypool`,
    with the name and intervals dictated by `/etc/crontab`.


    Some datasets probably don’t need snapshots. We never snapshot the ports tree,
    for example. To turn off snapshots for a dataset and its children, set `com.sun:auto-snapshot`
    to `false`.


    ```

    # zfs set com.sun:auto-snapshot=false mypool/usr/ports

    ```


    You can also disable just specific classes of snapshots. A dataset that doesn’t
    change frequently probably doesn’t need frequent or hourly snapshots. `zfs-auto-snapshot`
    checks for sub-properties of `com.sun:auto-snapshot` named after the snapshot
    period. For example, the property that controls your hourly snapshots is named
    `com.sun:auto-snapshot:hourly`. Set these properties to `false` to disable those
    snapshots.


    ```

    # zfs set com.sun:auto-snapshot:frequent=false mypool/delorean

    # zfs set com.sun:auto-snapshot:hourly=false mypool/delorean

    ```


    Now `zfs-auto-snapshot` only takes daily, weekly, and monthly snapshots for that
    dataset and all of its children. You can re-enable the more frequent snapshots
    for a specific child by setting the property back to `true` on that child.


    You may also decide that, while you need frequent snapshots of `/usr/src` since
    you are working on some important code, you don’t need to keep months-old copies
    of the source tree:


    ```

    # zfs set com.sun:auto-snapshot:monthly=false mypool/usr/src

    ```


    ZFS Tools’ `zfs-auto-snapshot` handles all snapshot rotation for you.


    ### Viewing Automatic Snapshots


    Automatic snapshots have names beginning with `zfs-auto-snap` and followed by
    the period and the timestamp.


    ```

    # zfs list -t all -r db/db

    NAME                                          USED  AVAIL  REFER  MOUNTPOINT

    db/db                                         587M  13.5G   561M  /

    db/db@zfs-auto-snap_hourly-2015-04-08-16h00   224K  -       561M  -

    db/db@zfs-auto-snap_hourly-2015-04-08-17h00   220K  -       561M  -

    db/db@zfs-auto-snap_hourly-2015-04-08-18h00   200K  -       561M  -

    db/db@zfs-auto-snap_frequent-2015-04-08-18h45 188K  -       561M  -

    db/db@zfs-auto-snap_hourly-2015-04-08-19h00   172K  -       561M  -

    db/db@zfs-auto-snap_frequent-2015-04-08-19h15 172K  -       561M  -

    db/db@zfs-auto-snap_frequent-2015-04-08-19h30 180K  -       561M  -

    db/db@zfs-auto-snap_frequent-2015-04-08-19h45 180K  -       561M  -

    db/db@zfs-auto-snap_hourly-2015-04-08-20h00   180K  -       561M  -

    ```


    ### Getting Clever with zfs-auto-snap


    There’s nothing magical about the snapshot names or the schedules used by `zfs-auto-snapshot`.
    Lucas once ran `zfs-auto-snap hourly 2` at the command line and blew away lots
    of hourly snapshots. You can name your hourly snapshots `monthly`, and your yearly
    snapshots `daily`. If you’re short on people who detest you and all you stand
    for, this is a wonderful way to remedy that problem.


    ## Holds


    Sometimes, you want a specific snapshot to be retained despite any automatic retention
    schedule or a desperate late-night effort to clean the pool. Maybe there was an
    incident, or this is the starting point for some replication. If you need to keep
    a snapshot, place a hold on it, like your bank does when it doesn’t want you to
    spend your money.


    Use `zfs hold`, a tag name, and the snapshot name. A tag name is a human-readable
    label for this particular hold.


    ```

    # zfs hold tag dataset@snapshot

    ```


    This locks the snapshot and assigns your tag name. One snapshot can have many
    holds on it, so you can create holds for different purposes.


    Holds can also be recursive. To lock all of the snapshots of the same name on
    child datasets, using a common tag, use `-r`.


    ```

    # zfs hold -r hostages mypool/test@holdme

    ```


    The `zfs holds` command lists the holds on a snapshot, or recursively lists all
    the holds on a hierarchy of snapshots.


    ```

    # zfs holds -r mypool/test@holdme

    NAME                     TAG       TIMESTAMP

    mypool/test@holdme       hostages  Fri Apr 3 19:13 2015

    mypool/test/sub1@holdme  hostages  Fri Apr 3 19:13 2015

    mypool/test/sub2@holdme  hostages  Fri Apr 3 19:13 2015

    ```


    A snapshot with a hold cannot be destroyed.


    ```

    # zfs destroy mypool/test@holdme

    cannot destroy snapshot mypool/test@holdme: dataset is busy

    ```


    Release a hold on the dataset with `zfs release`, giving the tag and the dataset
    name.


    ```

    # zfs release hostages mypool/test@holdme

    ```


    You can now destroy the snapshot. If only getting the bank to release your funds
    was this easy!


    Releasing a hold on the dataset does not release its children, however.


    ```

    # zfs release -r mypool/test@holdme

    cannot destroy snapshot mypool/test@holdme: dataset is busy

    ```


    To recursively release all of the holds on a snapshot, use the `-r` flag.


    ```

    # zfs release -r hostages mypool/test@holdme

    # zfsfs destroy -r mypool/test@holdme

    ```


    You can now destroy the child datasets.


    ## Bookmarks


    Newer versions of ZFS support *bookmarks*. Bookmarks are similar to snapshots,
    except they don’t keep the old data. A bookmark is just the timestamp of the snapshot
    it was created from. Bookmarks are built on the `extensible_dataset` feature flag.


    ZFS requires a timestamp to do incremental replication. ZFS can easily gather
    up every block that has changed since the bookmark. This allows incremental replication,
    without having to keep the snapshots around.


    Bookmarks are a dataset type related to snapshots, so we’re mentioning them here.
    They get full coverage in *FreeBSD Mastery: Advanced ZFS*.


    ## Clones


    A clone is a new filesystem created from a snapshot. Initially it uses no space,
    sharing all its blocks with the snapshot it was created from. While snapshots
    are read-only, clones are writable like any normal filesystem.


    A clone can be thought of as a “fork” or “branch” of a filesystem. If you have
    a filesystem that contains your web application, you can create a snapshot and
    clone that snapshot. The cloned filesystem can be your test instance of the application,
    letting you apply patches and changes without touching the production instance
    and without consuming extra space. You can run tests on the clone version, keeping
    it alongside the live version.


    Clones do not receive updates made in the original dataset. They’re based on a
    static snapshot. If you want a clone that has your recent updates to the original
    dataset, you must take a new snapshot and create a new clone.


    Clones initially use no disk space. When the clone diverges from the snapshot,
    any changes made to the cloned filesystem are stored as part of the clone, and
    it starts to consume space. You might have a multi-terabyte dataset for your big
    Enterprise Resource Planning (ERP) application, but a fully writable copy of that
    dataset takes up no space at all except for what you change.


    Disk space is already cheap, but clones make it even cheaper.


    ### Creating a Clone


    Use `zfs clone` to create a clone. Give it two arguments, the source snapshot
    and the destination. If your pool has no mount point, you’ll need to set one on
    the clone to access its contents.


    ```

    # zfs clone mypool/sheep@evenmore mypool/dolly

    ```


    Look at our datasets now.

