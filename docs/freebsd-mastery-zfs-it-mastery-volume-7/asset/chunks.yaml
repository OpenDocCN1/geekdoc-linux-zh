- fmt: "\nTo make sure your custom properties remain yours, and don’t conflict with\
    \ other people’s custom properties, create a namespace. Most people prefix their\
    \ custom properties with an organizational identifier and a colon. For example,\
    \ FreeBSD-specific properties have the format “org.freebsd:propertyname,” such\
    \ as `org.freebsd:swap`. If the illumos project creates its own property named\
    \ `swap`, they’d call it `org.illumos:swap`. The two values won’t collide.\n\n\
    For example, suppose Jude wants to control which datasets get backed up via a\
    \ dataset property. He creates the namespace `com.allanjude.`. Within that namespace,\
    \ he creates the property `backup_ignore`.\n\n```\n# zfs set com.allanjude:backup_ignore=on\
    \ mypool/lamb\n```\n\nJude’s backup script checks the value of this property.\
    \ If it’s set to `true`, the backup process skips this dataset.\n\n## Parent/Child\
    \ Relationships\n\nDatasets inherit properties from their parent datasets. When\
    \ you set a property on a dataset, that property applies to that dataset and all\
    \ of its children. For convenience, you can run `zfs(8)` commands on a dataset\
    \ and all of its children by adding the `-r` flag. Here, we query the compression\
    \ property on a dataset and all of its children.\n\n```\n# zfs get -r compression\
    \ mypool/lamb\nNAME              PROPERTY     VALUE  SOURCE\nmypool/lamb     \
    \  compression  lz4    inherited from mypool\nmypool/lamb/baby  compression  off\
    \    local\n```\n\nLook at the source values. The first dataset, `mypool/lamb`,\
    \ inherited this property from the parent pool. In the second dataset, this property\
    \ has a different value. The source is `local`, meaning that the property was\
    \ set specifically on this dataset.\n\nWe can restore the original setting with\
    \ the `zfs inherit` command.\n\n```\n# zfs inherit compression mypool/lamb/baby\n\
    # zfs get -r compression mypool/lamb\nNAME              PROPERTY     VALUE SOURCE\n\
    mypool/lamb       compression  lz4   inherited from mypool\nmypool/lamb/baby \
    \ compression  lz4   inherited from mypool\n```\n\nThe child now inherits the\
    \ compression properties from the parent, which inherits from the grandparent.\n\
    \nWhen you change a parent’s properties, the new properties automatically propagate\
    \ down to the child.\n\n```\n# zfs set compression=gzip-9 mypool/lamb\n# zfs get\
    \ -r compression mypool/lamb\nNAME              PROPERTY     VALUE  SOURCE\nmypool/lamb\
    \       compression  gzip-9 local\nmypool/lamb/baby  compression  gzip-9 inherited\
    \ from mypool/lamb\n```\n\nI told the parent dataset to use `gzip-9` compression.\
    \ That percolated down to the child.\n\n### Inheritance and Renaming\n\nWhen you\
    \ move or rename a dataset so that it has a new parent, the parent’s properties\
    \ automatically propagate down to the child. Locally set properties remain unchanged,\
    \ but inherited ones switch to those from the new parent.\n\nHere we create a\
    \ new parent dataset and check its compression property.\n\n```\n# zfs create\
    \ mypool/second\n# zfs get compress mypool/second\nNAME           PROPERTY   \
    \  VALUE SOURCE\nmypool/second  compression  lz4   inherited from mypool\n```\n\
    \nOur baby dataset uses `gzip-9` compression. It’s inherited this property from\
    \ `mypool/lamb`. Now let’s move baby to be a child of second, and see what happens\
    \ to the compression property.\n\n```\n# zfs rename mypool/lamb/baby mypool/second/baby\n\
    # zfs get -r compression mypool/second\nNAME                PROPERTY     VALUE\
    \  SOURCE\nmypool/second       compression  lz4    inherited from mypool\nmypool/second/baby\
    \  compression  lz4    inherited from mypool\n```\n\nThe child dataset now belongs\
    \ to a different parent, and inherits its properties from the new parent. The\
    \ child keeps any local properties.\n\nData on the baby dataset is a bit of a\
    \ tangle, however. Data written before compression was turned on is uncompressed.\
    \ Data written while the dataset used `gzip-9` compression is compressed with\
    \ `gzip-9`. Any data written now will be compressed with `lz4`. ZFS sorts all\
    \ this out for you automatically, but thinking about it does make one’s head hurt.\n\
    \n### Removing Properties\n\nWhile you can set a property back to its default\
    \ value, it’s not obvious how to change the source back to `inherit` or `default`,\
    \ or how to remove custom properties once they’re set.\n\nTo remove a custom property,\
    \ inherit it.\n\n```\n# zfs inherit com.allanjude:backup_ignore mypool/lamb\n\
    ```\n\nThis works even if you set the property on the root dataset.\n\nTo reset\
    \ a property to its default value on a dataset and all its children, or totally\
    \ remove custom properties, use the `zfs inherit` command on the pool’s root dataset.\n\
    \n```\n# zfs inherit -r compression mypool\n```\n\nIt’s counter-intuitive, but\
    \ it knocks the custom setting off of the root dataset.\n\n## Mounting ZFS Filesystems\n\
    \nWith traditional filesystems you listed each partition, its type, and where\
    \ it should be mounted in `/etc/fstab`. You even listed temporary mounts such\
    \ as floppies and CD-ROM drives, just for convenience. ZFS allows you to create\
    \ such a large number of filesystems that this quickly grows impractical.\n\n\
    Each ZFS filesystem has a `mountpoint` property that defines where it should be\
    \ mounted. The default mountpoint is built from the pool’s mountpoint. If a pool\
    \ doesn’t have a mount point, you must assign a mount point to any datasets you\
    \ want to mount.\n\n```\n# zfs get mountpoint zroot/usr/home\nNAME           \
    \ PROPERTY    VALUE      SOURCE\nzroot/usr/home  mountpoint  /usr/home\n```\n\n\
    The filesystem normally gets mounted at `/usr/home`. The zroot pool used for a\
    \ default install doesn’t have a mount point. If you create new datasets directly\
    \ under zroot, they won’t have a mount point. Datasets created on zroot under,\
    \ say, `usr`, inherit a mount point from their parent.\n\nAny pool other than\
    \ the root normally has a mount point. If you create a pool named `db`, it gets\
    \ mounted at `/db`. All children inherit from pool.\n\nWhen you change the mountpoint\
    \ property for a filesystem, the filesystem and any children that inherit it are\
    \ unmounted. If the new value is `legacy`, then they remain unmounted. Otherwise,\
    \ they are automatically remounted in the new location if the property was previously\
    \ `legacy` or `none`, or if they were mounted before the property changed. In\
    \ addition, any shared filesystems are unshared and shared in the new location.\n\
    \nJust like ordinary filesystems, ZFS filesystems aren’t necessarily mounted.\
    \ The `canmount` property controls a filesystem’s mount behavior. If `canmount`\
    \ is set to `yes`, running `zfs mount -a` mounts the filesystem, just like `mount\
    \ -a`. When you enable ZFS in `/etc/rc.conf`, FreeBSD runs `zfs mount -a` at startup.\n\
    \nWhen the `canmount` property is set to `noauto`, a dataset can only be mounted\
    \ and unmounted explicitly. The dataset is not mounted automatically when the\
    \ dataset is created or imported, nor is it mounted by the `zfs mount -a` command\
    \ or unmounted by `zfs unmount -a`.\n\nThings can get interesting when you set\
    \ `canmount` to `off`. You might have two non-mountable datasets with the same\
    \ mount point. A dataset can exist solely for the purpose of being the parent\
    \ to future datasets, but not actually store files, as we’ll see below.\n\n datasets\
    \ do not inherit the `canmount` property.\n\nChanging the `canmount` property\
    \ does not automatically unmount or mount the filesystem. If you disable mounting\
    \ on a mounted filesystem, you’ll need to manually unmount the filesystem or reboot.\n\
    \n### Datasets without Mount Points\n\nZFS datasets are hierarchical. You might\
    \ need to create a dataset that will never contain any files only so it can be\
    \ the common parent of a number of other datasets. Consider a default install\
    \ of FreeBSD 10.1 or newer.\n\n```\n# zfs mount\nzroot/ROOT/default   /\nzroot/tmp\
    \            /tmp\nzroot/usr/home       /usr/home\nzroot/usr/ports      /usr/ports\n\
    zroot/usr/src        /usr/src\n...\n```\n"
  raw: 'To make sure your custom properties remain yours, and don’t conflict with
    other people’s custom properties, create a namespace. Most people prefix their
    custom properties with an organizational identifier and a colon. For example,
    FreeBSD-specific properties have the format “org.freebsd:propertyname,” such as
    org.freebsd:swap. If the illumos project creates its own property named *swap*,
    they’d call it org.illumos:swap. The two values won’t collide.


    For example, suppose Jude wants to control which datasets get backed up via a
    dataset property. He creates the namespace com.allanjude.[3](#part0008.xhtml_ref_footnotebookmark_end_31_3)
    Within that namespace, he creates the property backup_ignore.


    ```

    # zfs set com.allanjude:backup_ignore=on mypool/lamb

    ```


    Jude’s backup script checks the value of this property. If it’s set to *true*,
    the backup process skips this dataset.


    ## Parent/Child Relationships


    Datasets inherit properties from their parent datasets. When you set a property
    on a dataset, that property applies to that dataset and all of its children. For
    convenience, you can run zfs(8) commands on a dataset and all of its children
    by adding the -r flag. Here, we query the compression property on a dataset and
    all of its children.


    ```

    # zfs get -r compression mypool/lamb

    NAME              PROPERTY     VALUE  SOURCE

    mypool/lamb       compression  lz4    inherited from mypool

    mypool/lamb/baby  compression  off    local

    ```


    Look at the source values. The first dataset, mypool/lamb, inherited this property
    from the parent pool. In the second dataset, this property has a different value.
    The source is local, meaning that the property was set specifically on this dataset.


    We can restore the original setting with the zfs inherit command.


    ```

    # zfs inherit compression mypool/lamb/baby

    # zfs get -r compression mypool/lamb

    NAME              PROPERTY     VALUE SOURCE

    mypool/lamb       compression  lz4   inherited from mypool

    mypool/lamb/baby  compression  lz4   inherited from mypool

    ```


    The child now inherits the compression properties from the parent, which inherits
    from the grandparent.


    When you change a parent’s properties, the new properties automatically propagate
    down to the child.


    ```

    # zfs set compression=gzip-9 mypool/lamb

    # zfs get -r compression mypool/lamb

    NAME              PROPERTY     VALUE  SOURCE

    mypool/lamb       compression  gzip-9 local

    mypool/lamb/baby  compression  gzip-9 inherited from mypool/lamb

    ```


    I told the parent dataset to use *gzip-9* compression. That percolated down to
    the child.


    ### Inheritance and Renaming


    When you move or rename a dataset so that it has a new parent, the parent’s properties
    automatically propagate down to the child. Locally set properties remain unchanged,
    but inherited ones switch to those from the new parent.


    Here we create a new parent dataset and check its compression property.


    ```

    # zfs create mypool/second

    # zfs get compress mypool/second

    NAME           PROPERTY     VALUE SOURCE

    mypool/second  compression  lz4   inherited from mypool

    ```


    Our baby dataset uses *gzip-9* compression. It’s inherited this property from
    mypool/lamb. Now let’s move baby to be a child of second, and see what happens
    to the compression property.


    ```

    # zfs rename mypool/lamb/baby mypool/second/baby

    # zfs get -r compression mypool/second

    NAME                PROPERTY     VALUE  SOURCE

    mypool/second       compression  lz4    inherited from mypool

    mypool/second/baby  compression  lz4    inherited from mypool

    ```


    The child dataset now belongs to a different parent, and inherits its properties
    from the new parent. The child keeps any local properties.


    Data on the baby dataset is a bit of a tangle, however. Data written before compression
    was turned on is uncompressed. Data written while the dataset used gzip-9 compression
    is compressed with gzip-9\. Any data written now will be compressed with lz4\.
    ZFS sorts all this out for you automatically, but thinking about it does make
    one’s head hurt.


    ### Removing Properties


    While you can set a property back to its default value, it’s not obvious how to
    change the source back to *inherit* or *default*, or how to remove custom properties
    once they’re set.


    To remove a custom property, inherit it.


    ```

    # zfs inherit com.allanjude:backup_ignore mypool/lamb

    ```


    This works even if you set the property on the root dataset.


    To reset a property to its default value on a dataset and all its children, or
    totally remove custom properties, use the zfs inherit command on the pool’s root
    dataset.


    ```

    # zfs inherit -r compression mypool

    ```


    It’s counterintuitive, but it knocks the custom setting off of the root dataset.


    ## Mounting ZFS Filesystems


    With traditional filesystems you listed each partition, its type, and where it
    should be mounted in /etc/fstab. You even listed temporary mounts such as floppies
    and CD-ROM drives, just for convenience. ZFS allows you to create such a large
    number of filesystems that this quickly grows impractical.


    Each ZFS filesystem has a mountpoint property that defines where it should be
    mounted. The default mountpoint is built from the pool’s mountpoint. If a pool
    doesn’t have a mount point, you must assign a mount point to any datasets you
    want to mount.


    ```

    # zfs get mountpoint zroot/usr/home

    NAME            PROPERTY    VALUE      SOURCE

    zroot/usr/home  mountpoint  /usr/home  inherited from zroot/usr

    ```


    The filesystem normally get mounted at /usr/home. You could override this when
    manually mounting the filesystem.


    The zroot pool used for a default FreeBSD install doesn’t have a mount point set.
    If you create new datasets directly under zroot, they won’t have a mount point.
    Datasets created on zroot under, say, /usr, inherit a mount point from their parent
    dataset.


    Any pool other than the pool with the root filesystem normally has a mount point
    named after the pool. If you create a pool named db, it gets mounted at /db. All
    children inherit their mount point from that pool unless you change them.


    When you change the mountpoint property for a filesystem, the filesystem and any
    children that inherit the mount point are unmounted. If the new value is *legacy*,
    then they remain unmounted. Otherwise, they are automatically remounted in the
    new location if the property was previously *legacy* or *none*, or if they were
    mounted before the property was changed. In addition, any shared filesystems are
    unshared and shared in the new location.


    Just like ordinary filesystems, ZFS filesystems aren’t necessarily mounted. The
    canmount property controls a filesystem’s mount behavior. If canmount is set to
    *yes*, running zfs mount -a mounts the filesystem, just like mount -a. When you
    enable ZFS in /etc/rc.conf, FreeBSD runs zfs mount -a at startup.


    When the canmount property is set to *noauto*, a dataset can only be mounted and
    unmounted explicitly. The dataset is not mounted automatically when the dataset
    is created or imported, nor is it mounted by the zfs mount -a command or unmounted
    by zfs unmount -a.


    Things can get interesting when you set canmount to *off*. You might have two
    non-mountable datasets with the same mount point. A dataset can exist solely for
    the purpose of being the parent to future datasets, but not actually store files,
    as we’ll see below.


    Child datasets do not inherit the canmount property.


    Changing the canmount property does not automatically unmount or mount the filesystem.
    If you disable mounting on a mounted filesystem, you’ll need to manually unmount
    the filesystem or reboot.


    ### Datasets without Mount Points


    ZFS datasets are hierarchical. You might need to create a dataset that will never
    contain any files only so it can be the common parent of a number of other datasets.
    Consider a default install of FreeBSD 10.1 or newer.


    ```

    # zfs mount

    zroot/ROOT/default   /

    zroot/tmp            /tmp

    zroot/usr/home       /usr/home

    zroot/usr/ports      /usr/ports

    zroot/usr/src        /usr/src

    ...

    ```'
