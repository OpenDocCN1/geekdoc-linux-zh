  trans: '


    包含多个 `VDEV` 的池（pool）将其数据条带化分布在所有 `VDEV` 上。这会提高性能，但可能会增加空间成本，因为每个独立的 `VDEV` 都有自己的冗余磁盘。包含多个
    `VDEV` 的池可能具有更高的可靠性和容错能力。虽然 ZFS 的冗余完全是在 `VDEV` 级别，但一个包含多个冗余 `VDEV` 的池可能能够承受更多的磁盘故障。池中的
    `VDEV` 越多，池的性能就越好。


    让我们来看一些常见的 `VDEV` 配置，看看不同的排列如何影响性能和容量。假设我们正在使用一组适中的普通廉价 1 TB 机械硬盘。每块磁盘能够提供 250
    IOPS 以及 100 MB/s 的流式读/写速度。


    # 单磁盘


    在只有一个磁盘的情况下，只有一种可能的配置，即单 ZFS 条带化（stripe）VDEV。这是最基础的配置，不提供任何容错能力。如果这块磁盘损坏，你的所有数据都将丢失。


    表 1：单磁盘虚拟设备配置


    | 磁盘数 | 配置 | 读取 IOPS | 写入 IOPS | 读取 MB/s | 写入 MB/s | 可用空间 | 容错能力 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | 条带 (Stripe) | 250 | 250 | 100 | 100 | 1 TB (100%) | 无 |


    单磁盘条带设备的性能特性看起来与底层磁盘的特性非常相似。很奇怪，对吧？


    # 双磁盘


    如果你的系统有两个磁盘，你可以由两个条带化 `VDEV` 或单个镜像（mirror）`VDEV` 构建池。


    条带化 `VDEV` 使可用存储空间和带宽翻倍，但也使故障风险翻倍。ZFS 将每个文件的块分布在两块磁盘上。如果其中任何一块磁盘故障，所有数据都将无法使用。


    使用单个镜像 `VDEV` 会将每个数据块存储在两块磁盘上。这保持了改进的读取性能，因为可以同时从两块磁盘读取块。但你只能获得最小磁盘的容量。写入性能受限于最慢磁盘的速度。然而，一个磁盘可以故障而池仍然可用。


    表 2：双磁盘虚拟设备配置


    | 磁盘数 | 配置 | 读取 IOPS | 写入 IOPS | 读取 MB/s | 写入 MB/s | 可用空间 | 容错能力 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 2 | 2 x 条带 (Stripe) | 500 | 500 | 200 | 200 | 2 TB (100%) | 无 |

    | 2 | 1 x 2 盘镜像 (Mirror) | 500 | 250 | 200 | 100 | 1 TB (50%) | 1 |


    如表所示，我们的镜像池写入性能只有条带池的一半，空间也只有一半。


    # 三磁盘


    三磁盘意味着更多的选择，包括更深镜像和 RAID-Z。你也可以使用三块条带磁盘池，但故障概率会高得多。


    更深镜像具有更多的磁盘，提供了更高的容错能力和改进的读取性能。更多的磁轴和磁头意味着 `VDEV` 可以从三块驱动器中最空闲的一个读取数据，从而更快地处理随机读取。镜像中的写入性能仍然受限于镜像中最慢的磁盘。


    RAID-Z1 提供了更好的空间效率，因为容错能力只需要 `VDEV` 中的其中一块磁盘。数据分布在所有驱动器上，因此它们必须协作执行读写。将数据分布在所有驱动器上改进了流式写入性能。与镜像不同，在
    RAID-Z 中，所有驱动器都可以同时写入它们份额的数据，而不是每块驱动器写入相同的数据。


    表 3：三磁盘虚拟设备配置


    | 磁盘数 | 配置 | 读取 IOPS | 写入 IOPS | 读取 MB/s | 写入 MB/s | 可用空间 | 容错能力 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 3 | 1 x 3 盘镜像 (Mirror) | 750 | 250 | 300 | 100 | 1 TB (33%) | 2 |

    | 3 | 1 x 3 盘 RAID-Z1 | 250 | 250 | 200 | 200 | 2 TB (66%) | 1 |


    此处注意，IOPS 并不一定线性扩展到实际的读写性能。镜像 `VDEV` 的读取 IOPS 是 RAID-Z1 的三倍，因为每块驱动器中的磁头可以独立工作，而在
    RAID-Z 中磁头必须协作工作。在每秒兆字节方面，镜像的优势可以使用所有磁盘的吞吐量来传输数据，而 RAID-Z1 会因为校验数据而丢失一块磁盘的吞吐量。三磁盘镜像的写入
    MB/s 只有一半，因为它向每块磁盘写入相同的数据，而 RAID-Z1 可以将写入分布在所有磁盘上，但会因校验丢失一些吞吐量。


    # 四或五磁盘


    四或五块磁盘你会有更多的选择。


    多个镜像 `VDEV`（类似于传统的 RAID 10）为数据库等随机 I/O 负载提供了最佳性能。当你将四块磁盘分为两个各两块磁盘的镜像 `VDEV` 时，ZFS
    将写入条带分布在两个镜像上。一个镜像持有一半数据，另一个镜像持有另一。这缓解了镜像的写入瓶颈，同时提供了令人惊叹的读取性能。四块磁盘，RAID-Z2 是一个选项。RAID-Z2
    的两个磁盘意味着 `VDEV` 可以在两块磁盘故障的情况下继续运行。与相同数量的镜像相比，性能较差；但这取决于哪两块磁盘故障。五块磁盘，我们可以部署 RAID-Z3。RAID-Z3
    `VDEV` 可以承受三块磁盘的故障。RAID-Z1 仍然是一个选项。


    表 4：四或五磁盘


    | 磁盘数 | 配置 | 读取 IOPS | 写入 IOPS | 读取 MB/s | 写入 MB/s | 可用空间 | 容错能力 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 4 | 2 x 2 盘镜像 (Mirror) | 1000 | 500 | 400 | 200 | 2 TB (50%) | 2 (1/VDEV) |

    | 4 | 1 x 4 盘 RAID-Z1 | 250 | 250 | 300 | 300 | 3 TB (75%) | 1 |

    | 4 | 1 x 4 盘 RAID-Z2 | 250 | 250 | 200 | 200 | 2 TB (50%) | 2 |

    | 5 | 1 x 5 盘 RAID-Z1 | 250 | 250 | 400 | 400 | 4 TB (80%) | 1 |

    | 5 | 1 x 5 盘 RAID-Z2 | 250 | 250 | 300 | 300 | 3 TB (60%) | 2 |

    | 5 | 1 x 5 盘 RAID-Z3 | 250 | 250 | 200 | 200 | 2 TB (40%) | 3 |


    # 六到十二磁盘


    对于大量磁盘，决策转向了容错能力、空间效率和性能。六块磁盘可以变成三个镜像 `VDEV`，提供较少的空间。十二块磁盘可以分为两个镜像 `VDEV`，提供更好的性能。


