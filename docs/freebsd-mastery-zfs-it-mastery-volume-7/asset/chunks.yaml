    The most convenient way to access the content of snapshots is via the *snapshot
    directory*, or *snapdir*. The root of each ZFS dataset has a hidden .zfs directory.
    That directory has a snapshot directory, which in turn has a directory for each
    snapshot.


    ```

    # ls /mypool/sheep/.zfs

    total 1

    dr-xr-xr-x  2 root  wheel  2 Mar 29 00:30 shares

    dr-xr-xr-x  2 root  wheel  2 Mar 30 16:27 snapshot

    # ls -l /mypool/sheep/.zfs/snapshot

    total 1

    drwxr-xr-x  2 root  wheel  5 Mar 29 00:40 snap1

    drwxr-xr-x  2 root  wheel  5 Mar 29 00:40 second

    ```


    Go into that directory and you’ll find yourself inside the snapshot’s root directory.
    Each file in the snapshot is preserved exactly as it was when the snapshot was
    taken, down to the file access time. To recover individual files from a snapshot,
    copy them back into the main filesystem.


    ### Secret Snapdir


    The .zfs snapdir is hidden by default. It won’t show up even if you run ls -lA.
    This prevents backup programs, rsync, and similar software from traversing into
    it. If you want the .zfs directory to show up, set the dataset’s snapdir property
    to *visible*.


    ```

    # zfs set snapdir=visible mypool/sheep

    ```


    Once someone runs cp -R on a dataset, recursively copies all your snapshots onto
    the filesystem, and blows everything up, hide it again by setting the snapdir
    property to *hidden*.


    ### Mounting Snapshots


    You can mount a snapshot much like you’d mount any other filesystem.


    ```

    # mount -t zfs mypool/sheep@snap1 /mnt

    ```


    You cannot access a snapshot via the hidden .zfs directory while it is manually
    mounted. Even a mounted snapshot is still read-only.


    ## Deleting Snapshots


    Snapshots prevent the blocks they use from being freed. This means you don’t get
    that space back until you stop using those blocks, by removing all snapshots that
    reference them.


    Create a new snapshot, and then remove it:


    ```

    # zfs snapshot mypool/sheep@deleteme

    # zfs destroy mypool/sheep@deleteme

    ```


    That wasn’t so hard, was it?


    You can also add the verbose flag (-v), to get more detail about what’s being
    destroyed. While verbose mode doesn’t help much when you’re destroying a single
    snapshot, it becomes more valuable as you destroy more datasets or if you want
    to see what a command would do without actually running it.


    ### Destruction Dry Runs


    The noop flag, -n, does a “dry run” of the delete process. It describes what would
    happen if you delete the snapshot without actually deleting it. Let’s return to
    those first few snapshots we took and see what would happen if we removed the
    first one.


    ```

    # zfs destroy -vn mypool/sheep@snap1

    would destroy mypool/sheep@snap1

    would reclaim 72K

    ```


    Deleting this snapshot would reclaim only 72 KB of space. The blocks that make
    up this snapshot are still used by the live filesystem and/or the second snapshot.


    Our second snapshot overwrote some of the data from the first snapshot. That changes
    the effect of deleting the snapshot.


    ```

    # zfs destroy -vn mypool/sheep@second

    would destroy mypool/sheep@second

    would reclaim 1.07M

    ```


    We would free the space used to store the overwritten version of the files.


    ### Recursion and Ranges


    Creating snapshots recursively can create a whole mess of snapshots. Fortunately,
    you can recursively destroy snapshots as well.


    ```

    # zfs destroy -rv mypool@all

    will destroy mypool@all

    will destroy mypool/second@all

    will destroy mypool/second/baby@all

    will destroy mypool/lamb@all

    will destroy mypool/ROOT@all

    ...

    will reclaim 84K

    ```


    Recursively destroying snapshots is a great time to use -n before actually destroying
    any data.[2](#part0011.xhtml_ref_footnotebookmark_end_34_2) More than once, we’ve
    realized that we need a snapshot two seconds after deleting it.


    Another handy feature is destroying a range of snapshots. You give two snapshots
    of the same dataset, and ZFS wipes them out and all snapshots taken between them.
    Run zfs destroy, but give the full name of the “from” snapshot, a percent sign,
    and the name of the “to” snapshot. Those two snapshots and everything between
    them get destroyed.


    The –n flag is handy to make sure this is going to do what you expect before you
    actually execute it. Plus you learn how much space you’ll get back.


    Here, we destroy our two test snapshots. Note that the first snapshot is given
    by its full name, including the dataset: mypool/sheep@myfirstsnapshot. The second
    snapshot has to be part of the same dataset, and it has to be a snapshot, so you
    need only the brief name of the snapshot: second.


    ```

    # zfs destroy -vn mypool/sheep@snap1%second

    would destroy mypool/sheep@snap1

    would destroy mypool/sheep@second

    would reclaim 1.14M

    ```


    If you are sure, drop the -vn and truly destroy the snapshots:


    ```

    # zfs destroy mypool/sheep@snap1%second

    ```


    The snapshots are gone. Your users are now free to tell you that they needed that
    data.


    ## Rolling Back


    Snapshots don’t only show you how the filesystem existed at a point in the past.
    You can revert the entire dataset to its snapshot state. Going to do an upgrade?
    Create a snapshot first. If it doesn’t work, just roll back. Use the zfs rollback
    command to revert a filesystem to a snapshot. But once you go back, you can’t
    go forward again.


    Here we create a filesystem with a series of changes, snapshotting each one.


    ```

    # zfs create -o mountpoint=/delorean mypool/delorean

    # echo “this is the past” > /delorean/timecapsule.txt

    # zfs snapshot mypool/delorean@thepast

    # echo “this is the present” > /delorean/timecapsule.txt

    # zfs snapshot mypool/delorean@thepresent

    # echo “I broke the future” > /delorean/timecapsule.txt

    ```


    The file /delorean/timecapsule.txt has had three different sets of text in it.
    Two versions of that text are captured in snapshots. The third is not in a snapshot.


    ```

    # cat /delorean/timecapsule.txt

    “I broke the future”

    ```


    Oh no, the future is broken. Let’s return to the present. Run zfs rollback and
    give the name of the snapshot you want to use.'
