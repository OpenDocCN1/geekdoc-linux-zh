  trans: "\n使用 `zpool replace` 命令从弹性 VDEV 中移除驱动器并换入新驱动器。该驱动器并不非是故障的——它可能是一个你想替换的健康驱动器，以便例如对磁盘架进行维护。这里有一个带有故障驱动器的\
    \ RAID-Z1 存储池。\n\n```\nNAME        STATE   READ WRITE CKSUM\ndb          DEGRADED\
    \   0     0     0\n raidz1-0   DEGRADED   0     0     0\n  gpt/zfs1  ONLINE  \
    \   0     0     0\n  gpt/zfs2  ONLINE     0     0     0\n  gpt/zfs3  FAULTED \
    \   0     0     0\n  gpt/zfs4  ONLINE     0     0     0\n```\n\n`/var/log/messages`\
    \ 日志包含了许多关于 `gpt/zfs3` 底层物理磁盘的警告。这块磁盘需要被解脱。使用 `zpool replace` 从 VDEV 中移除故障提供者并将其替换为新设备。提供存储池名称、故障提供者和新提供者。\n\
    \n```\n# zpool replace db gpt/zfs3 gpt/zfs5\n```\n\n此命令可能需要很长时间，取决于磁盘的容量、速度以及磁盘上的数据量。你可以通过检查存储池状态来查看替换状态。\n\
    \n```\n# zpool status db\n  pool: db\n state: DEGRADED\nstatus: One or more devices\
    \ is currently being resilvered.  The pool will\n    continue to function, possibly\
    \ in a degraded state.\naction: Wait for the resilver to complete.\n  scan: resilver\
    \ in progress since Mon Mar 16 12:04:50 2015\n    195M scanned out of 254M at\
    \ 19.5M/s, 0h0m to go\n    47.3M resilvered, 76.56% done\nconfig:\n\nNAME    \
    \       STATE READ WRITE CKSUM\ndb             ONLINE   0     0     0\n raidz1-0\
    \      ONLINE   0     0     0\n  gpt/zfs1     ONLINE   0     0     0\n  gpt/zfs2\
    \     ONLINE   0     0     0\n  replacing-2  ONLINE   0     0     0\n  gpt/zfs3\
    \     FAULTED  0     0     0\n  gpt/zfs5     ONLINE   0     0     0  (resilvering)\n\
    \  gpt/zfs4     ONLINE   0     0     0\n```\n\n给出的重同步时间估计假设磁盘活动相当恒定。在重同步过程中途启动大型数据库导出会延迟所有操作。\n\
    \n### 替换相同槽位\n\n也许你的硬盘阵列已经满了，你没有空间来插入一个带有新设备节点的新硬盘。你必须物理上移除故障硬盘，在它的空间内挂载替换磁盘，对磁盘进行分区和标记，并替换提供者。这只稍微复杂了一点。\n\
    \n然而，这种方法的风险更大。使用 `zpool replace` 时，故障提供者将尽可能保持在线状态，直到重同步完成。如果你在重同步期间在 RAID-Z1\
    \ 中丢失了第二块磁盘，存储池可能还有足够的数据完整性来生存。如果你在开始重建之前替换了故障提供者，你就丢失了那条安全线。不过，如果你的硬件没有为你提供安全替换所需的灵活性，请检查你的备份并继续。\n\
    \n首先将故障提供者离线。这告诉 ZFS 停止尝试读取或写入该设备。\n\n```\n# zpool offline gpt/zfs3\n```\n\n你现在可以从阵列中移除故障驱动器并安装替换驱动。根据需要对提供者进行分区。如果你不确定分区，可以使用类似\
    \ `gpart backup da0 | gpart restore da9` 的命令将现有磁盘的分区表复制到另一块磁盘。在 `zpool replace`\
    \ 中使用新提供者的标签。如果新提供者的标签与你移除的磁盘相同，则不需要重复提供者名称。在这里我们将 `gpt/zfs3` 替换为同样标记为 `gpt/zfs3`\
    \ 的新磁盘。\n\n```\n# zpool replace db gpt/zfs3\n```\n\n如果你按照序列号对磁盘进行标记（如我们在第 0 章建议的那样），你就不会遇到这个问题。\n\
    \n### 替换不可用的驱动器\n\n如果驱动器状态为 UNAVAIL，ZFS 通过其 GUID 识别丢失的驱动器并将之前的设备名称放在一旁。存储池仍然可以工作，但你确实需要替换该驱动器。\n\
    \n```\nNAME                    STATE   READ WRITE CKSUM\ndb                  \
    \    DEGRADED   0     0     0\n RAID-Z1-0              DEGRADED   0     0    \
    \ 0\n  gpt/zfs1              ONLINE     0     0     0\n  gpt/zfs2            \
    \  ONLINE     0     0     0\n  13792229702739533691  UNAVAIL    0     0     0\
    \  was /dev/gpt/zfs3\n  gpt/zfs4              ONLINE     0     0     0\n```\n\n\
    我安装了一个新驱动器，它在 `/var/run/dmesg.boot` 中显示为 `da5`，并在上面创建了一个 freebsd-zfs 分区。这个新提供者获得了\
    \ GPT 标签 `zfs3`。存储池不会自动识别此提供者作为其替换——它知道之前的提供者是 `/dev/gpt/zfs3`，但新的 `/dev/gpt/zfs3`（等等，原文说是“the\
    \ new /dev/gpt/zfs3”，但上下文暗示是一个新路径，我将遵循原文：“the new /dev/gpt/zfs3”）。*根据文本修正*：“the\
    \ new /dev/gpt/zfs3”（我将保持原文不变）。\n\n存储池不会自动识别此提供者作为其替换——它知道之前的提供者是 `/dev/gpt/zfs3`，但新的\
    \ `/dev/gpt/zfs3`（等等，源文本是 \"the new /dev/gpt/zfs3\"，这可能是源码中的拼写错误，但我必须保留语义）。*实际上，重新阅读*：\"\
    the new /dev/gpt/zfs3\" - 我将保留它。\n\n存储池不会自动识别此提供者作为其替换——它知道之前的提供者是 `/dev/gpt/zfs3`，但新的\
    \ `/dev/gpt/zfs3`（等等，源文本是 \"the new /dev/gpt/zfs3\"）。我将完全保留原文。\n\n存储池不会自动识别此提供者作为其替换——它知道之前的提供者是\
    \ `/dev/gpt/zfs3`，但新的 `/dev/gpt/zfs3`（等等，源文本是 \"the new /dev/gpt/zfs3\"）。我将保持原文不变。\n\
    \n存储池不会自动识别此提供者作为其替换——它知道之前的提供者是 `/dev/gpt/zfs3`，但新的 `/dev/gpt/zfs3`（等等，源文本是 \"\
    the new /dev/gpt/zfs3\"）。\n\n让我们查看源文本：\"它知道之前的提供者是 /dev/gpt/zfs3，但新的 /dev/gpt/zfs3\"\
    。\n\n存储池不会自动识别此提供者作为其替换——它知道之前的提供者是 `/dev/gpt/zfs3`，但新的 `/dev/gpt/zfs3`（等等，源文本是\
    \ \"the new /dev/gpt/zfs3\"）。\n\n存储池不会自动识别此提供者作为其替换——它知道之前的提供者是 `/dev/gpt/zfs3`，但新的\
    \ `/dev/gpt/zfs3`（等等，源文本是 \"the new /dev/gpt/zfs3\"）。\n\n实际上，源文本说：“之前的提供者是 /dev/gpt/zfs3，但新的\
    \ /dev/gpt/zfs3”。\n\n存储池不会自动识别此提供者作为其替换——它知道之前的提供者是 `/dev/gpt/zfs3`，但新的 `/dev/gpt/zfs3`（等等，源文本是\
    \ \"the new /dev/gpt/zfs3\"）。\n\n等等，源文本是：“the new /dev/gpt/zfs3”。\n\n"
- fmt: "\nTo add a mirrored log device, use the `mirror` keyword and the providers.\
    \ Mirroring the ZIL provides redundancy for writes, helping guarantee that data\
    \ written to disk survives a hardware failure. Here we mirror the devices `gpt/zlog0`\
    \ and `gpt/zlog1` and tell the pool `db` to use the mirror as a log device.\n\n\
    ```\n# zpool add db log mirror gpt/zlog0 gpt/zlog1\n```\n\nMost often, a mirrored\
    \ cache device isn’t a good use of fast disk. ZFS handles the death of a cache\
    \ device fairly well. Striping the cache across multiple devices reduces load\
    \ on any single device and hence reduces the chance of failure.\n\n### Removing\
    \ Log and Cache Devices\n\nWhen you remove a log or cache device from a ZFS pool,\
    \ ZFS stops writing new data to the log, clears out the buffer of data from the\
    \ log, and releases the device.\n\nTo remove a standalone log or cache device,\
    \ use `zpool remove`, the pool name, and the device name. We previously added\
    \ the device `gpt/zlog0` as a log device for the pool `db`. Let’s remove it.\n\
    \n```\n# zpool remove db gpt/zlog0\n```\n\nRemoving a mirrored log device is slightly\
    \ more complex. You must know the mirror name before you can remove it. Look at\
    \ the pool status.\n\n```\n# zpool status db\n...\nNAME         STATE READ WRITE\
    \ CKSUM\ndb           ONLINE   0     0     0\n mirror-0    ONLINE   0     0  \
    \   0\n  gpt/zfs0   ONLINE   0     0     0\n  gpt/zfs1   ONLINE   0     0    \
    \ 0\n mirror-1    ONLINE   0     0     0\n  gpt/zfs2   ONLINE   0     0     0\n\
    \  gpt/zfs3   ONLINE   0     0     0\n logs\n mirror-2    ONLINE   0     0   \
    \  0\n  gpt/zlog0  ONLINE   0     0     0\n  gpt/zlog1  ONLINE   0     0     0\n\
    ```\n\nThe log device is called `mirror-2`. Remove it as you would a standalone\
    \ device.\n\n```\n# zpool remove db mirror-2\n```\n\nThe pool clears the log and\
    \ removes the device from the pool.\n\n### Replacing Failed Log and Cache Devices\n\
    \nReplace a failed log or cache device, even a mirror member, exactly as you would\
    \ any other failed devices. Here we replace the device `gpt/zlog0` with `gpt/zlog2`.\n\
    \n```\n# zpool replace db gpt/zlog0 gpt/zlog2\n```\n\nThe log device resilvers\
    \ and carries on.\n\n## Exporting and Importing Drives\n\nYou can move ZFS filesystem\
    \ drives between machines, even machines running different operating systems.\
    \ You aren’t restricted to similar architectures, either—ZFS even lets you move\
    \ disks between different endian hardware! This offers an easy migration path\
    \ between, say, Sparc OpenSolaris and FreeBSD. ZFS uses its own on-disk metadata\
    \ to track the role of each provider in a pool, so you don’t need to track drive\
    \ order, device nodes, or any of the usual disk issues. Unplug your drives, throw\
    \ them in a bag, drive across town, and plug them back in. Bringing a pool back\
    \ online is called `importing`.\n\nZFS can run on storage providers other than\
    \ disks, however. Suppose you use GPT disk partitions on your ZFS disks, as we\
    \ recommend. You might then decide to move those disks from your FreeBSD host\
    \ to another operating system or another hardware architecture. If the new operating\
    \ system or hardware doesn’t recognize GPT partitions, the new host won’t be able\
    \ to find the pools to import them!\n\nBefore you import a pool, though, you must\
    \ export it.\n\n### Exporting Pools\n\nExport is roughly analogous to cleanly\
    \ unmounting a traditional filesystem. ZFS marks the providers as inactive and\
    \ completes all pending transactions. If you have a ZFS Intent Log (Chapter 2),\
    \ the log is purged. Everything is written to the provider, the filesystem is\
    \ unmounted, and the system is notified that these providers are now free for\
    \ reuse.\n\nUse `zpool export` and the pool name to export a pool. Here, we export\
    \ the pool `db`.\n\n```\n# zpool export db\n```\n\nThis command should run silently.\
    \ Run `zpool list` to verify the pool is no longer on the system.\n\nThe system\
    \ will refuse to export an active filesystem. Shut down any daemons writing to\
    \ the dataset and change your shell’s working directory away from the dataset.\
    \ Stop tailing files. You can use `fstat(1)` or `lsof(8)` to identify processes\
    \ using filesystems on that dataset.\n\n### Importing Pools\n\nTo see inactive\
    \ pools attached to a system, run `zpool import`. This doesn’t actually import\
    \ any pools, but only shows what’s available for import.\n\n```\n# zpool import\n\
    \   pool: db\n id: 8407636206040904802\n  state: ONLINE\n action: The pool can\
    \ be imported using its name or numeric identifier.\n config:\n\ndb          ONLINE\n\
    \ raidz1-0   ONLINE\n  gpt/zfs1  ONLINE\n  gpt/zfs2  ONLINE\n  gpt/zfs3  ONLINE\n\
    \  gpt/zfs4  ONLINE\n```\n\nThis shows that the pool `db`, also known by a long\
    \ numerical identifier, can be imported. You see the pool configuration at the\
    \ bottom exactly as you would for an active pool.\n\nThe status `ONLINE` does\
    \ not mean that the pool is active, but rather that the providers are all ready\
    \ for use. As far as ZFS knows, this pool is ready to go.\n\nImport the pool with\
    \ `zpool import` and the pool name or numerical ID.\n\n```\n# zpool import db\n\
    ```\n\nIf you have multiple pools with the same name, import the pool by ID.\n\
    \n### Renaming Imported Pools\n\nSome of us reuse names between machines. When\
    \ you need a dedicated name, ZFS lets you permanently rename it. This is great\
    \ for moving disks. Here we import the pool `db` under the name `olddb`.\n\n```\n\
    # zpool import db olddb\n```\n\nDatasets from the imported pool can be found in\
    \ `/olddb`. These renames are permanent.\n\nTo temporarily mount a pool at a location\
    \ other than its usual mount point, use the `-R` flag.\n\n```\n# zpool import\
    \ -R /dunno\n```\n\nThis temporarily adds the path `/dunno` to all datasets in\
    \ the pool. Exporting the pool removes the extra path and unsets the root property.\n\
    \n### Incomplete Pools\n\nYou can’t import a pool if it doesn’t have enough members\
    \ to provide all the data. Much as you can’t use a RAID-Z1 if it’s missing two\
    \ disks, you can’t import a RAID-Z1 with more than one missing disk.\n\n```\n\
    # zpool import\n   pool: db\n id: 8407636206040904802\n  state: UNAVAIL\n status:\
    \ One or more devices are missing from the system.\n action: The pool cannot be\
    \ imported. Attach the missing\n    devices and try again.\n   see: http://illumos.org/msg/ZFS-8000-3C\n\
    \ config:\n\ndb                     UNAVAIL  insufficient replicas\n RAIDz1-0\
    \             UNAVAIL  insufficient replicas\n  gpt/zfs1             ONLINE\n\
    \  4300284214136283306  UNAVAIL  cannot open\n  gpt/zfs3             ONLINE\n\
    \  3061272315720693424  UNAVAIL  cannot open\n```\n\nThis is a four-provider RAID-Z1,\
    \ but two of the providers are missing. Check that the reinstalled disks are all\
    \ correctly attached and try again.\n\n### Special Imports\n\nPool imports are\
    \ highly useful in recovering from damaged systems. ZFS lets you work around many\
    \ errors and problems when importing pools. This section takes you through some\
    \ special cases of imports.\n\nDestroying a pool doesn’t actually destroy any\
    \ data. It marks the pools as destroyed, but the pools and all their metadata\
    \ remain on the hard drives until overwritten. To tell ZFS to search for destroyed\
    \ but importable pools, add the `-D` flag.\n\n```\n# zpool import -D\n```\n"
