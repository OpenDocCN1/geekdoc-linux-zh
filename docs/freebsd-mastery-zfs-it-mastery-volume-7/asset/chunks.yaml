    # Chapter 7: Snapshots and Clones


    One of ZFS’ most powerful features is snapshots. A filesystem or zvol snapshot
    allows you to access a copy of the dataset as it existed at a precise moment.
    Snapshots are read-only, and never change. A snapshot is a frozen image of your
    files, which you can access at your leisure. While backups normally capture a
    system across a period of minutes or hours, running backups on a snapshot means
    that the backup gets a single consistent system image, eliminating those tar:
    file changed as we read it messages and its cousins.


    While snapshots are read-only, you can roll the dataset back to the snapshot’s
    state. Take a snapshot before upgrading a system, and if the upgrade goes horribly
    wrong, you can fall back to the snapshot and yell at your vendor.


    Snapshots are the root of many special ZFS features, such as clones. A clone is
    a fork of a filesystem based on a snapshot. New clones take no additional space,
    as they share all of their dataset blocks with the snapshot. As you alter the
    clone, ZFS allocates new storage to accommodate the changes. This lets you spin
    up several slightly different copies of a dataset without using a full ration
    of disk space for each. You want to know that your test environment tightly mirrors
    the production one? Clone your production filesystem and test on the clone.


    Snapshots also underpin replication, letting you send datasets from one host to
    another.


    Best of all, ZFS’ copy-on-write nature means that snapshots are “free.” Creating
    a snapshot is instantaneous and consumes no additional space.


    ## Copy-on-Write


    In both ordinary filesystems and ZFS, files exist as blocks on the disk. In a
    traditional filesystem, changing the file means changing the file’s blocks. If
    the system crashes or loses power when the system is actively changing those blocks,
    the resulting shorn write creates a file that’s half the old version, half the
    new, and probably unusable.


    ZFS never overwrites a file’s existing blocks. When something changes a file,
    ZFS identifies the blocks that must change and writes them to a new location on
    the disk. This is called *copy-on-write*, or COW. The old blocks remain untouched.
    A shorn write might lose the newest changes to the file, but the previous version
    of the file still exists intact.


    Never losing a file is a great benefit of copy-on-write, but COW opens up other
    possibilities. ZFS creates snapshots by keeping track of the old versions of the
    changed blocks. That sounds deceptively simple, doesn’t it? It is. But like everything
    simple, the details are complicated. We talked about how ZFS stores data in Chapter
    3, but let’s go deeper.


    ZFS is almost an object-oriented filesystem. Metadata, indexing, and data are
    all different types of objects that can point to other objects. A ZFS pool is
    a giant tree of objects, rooted in the pool labels.'
