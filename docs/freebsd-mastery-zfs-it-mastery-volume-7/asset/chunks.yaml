    The volsize property of a zvol specifies the volume’s logical size. By default,
    creating a volume reserves an amount of space for the dataset equal to the volume
    size. (If you look ahead to Chapter 6, it establishes a refreservation of equal
    size.) Changing volsize changes the reservation. The volsize can only be set to
    a multiple of the volblocksize property, and cannot be zero.


    Without the reservation, the volume could run out of space, resulting in undefined
    behavior or data corruption, depending on how the volume is used. These effects
    can also occur when the volume size is changed while it is in use, particularly
    when shrinking the size. Adjusting the volume size can confuse applications using
    the block device.


