    Yes, that’s the real spacing. Orderly columns are for humans, silly.


    ## Per-Snapshot Space Use


    An especially useful property for snapshots is the `written` property, which gives
    you an idea of how much new data that snapshot contains.


    ```bash

    # zfs list -d 1 -t all -o name,used,refer,written mypool/sheep

    NAME                   USED  REFER  WRITTEN

    mypool/sheep          10.3M  6.11M    2.07M

    mypool/sheep@all          0  2.11M    2.11M

    mypool/sheep@snap2        0  2.11M        0

    mypool/sheep@evenmore     0  2.11M        0

    mypool/sheep@later    2.07M  5.11M    4.07M

    mypool/sheep@rewrite  1.07M  5.11M    2.07M

    ```


    Remember, snapshots appear in order by creation date. The live dataset appears
    first—while it probably has newer data than any snapshot, it was created before
    any of its snapshots. The snapshot `@all` is the oldest, then `@snap2`, and so
    on.


    The first snapshot, `@all`, lets you access 2.11 MB of data (the `REFER` column).
    This snapshot also contains 2.11 of newly written data. This is the difference
    between this snapshot and the snapshot before it.


    Snapshots `@snap2` and `@evenmore` have no new data. They’re unchanged from the
    first snapshot.


    Sometime in between the snapshots `@evenmore` and `@later` snapshots, the data
    grew. The snapshot `@later` lets you access 5.11 MB of data. It has 4.07 MB of
    new data.


    The `@rewrite` snapshot also lets you access 5.11 MB of data, but it’s written
    2.07 MB of new data. As the amount of data you can access is the same as the previous
    snapshot, some of the old data must have been overwritten.


    The live filesystem has also overwritten 1 MB of data. That data is now included
    only in the `@rewrite` snapshot.


    ## Accessing Snapshots


    The most convenient way to access the content of snapshots is via the `snapshot
    directory`, or `snapdir`. The root of each ZFS dataset has a hidden `.zfs` directory.
    That directory has a snapshot directory, which in turn has a directory for each
    snapshot.


    ```bash

    # ls /mypool/sheep/.zfs

    total 1

    dr-xr-xr-x  2 root  wheel  2 Mar 29 00:30 shares

    dr-xr-xr-x  2 root  wheel  2 Mar 30 16:27 snapshot

    # ls -l /mypool/sheep/.zfs/snapshot

    total 1

    drwxr-xr-x  2 root  wheel  5 Mar 29 00:40 snap1

    drwxr-xr-x  2 root  wheel  5 Mar 29 00:40 second

    ```


    Go into that directory and you’ll find yourself inside the snapshot’s root directory.
    Each file in the snapshot is preserved exactly as it was when the snapshot was
    taken, down to the file access time. To recover individual files from a snapshot,
    copy them back into the main filesystem.


    ### Secret Snapdir


    The `.zfs` snapdir is hidden by default. It won’t show up even if you run `ls
    -lA`. This prevents backup programs, `rsync`, and similar software from traversing
    into it. If you want the `.zfs` directory to show up, set the dataset’s `snapdir`
    property to `visible`.


    ```bash

    # zfs set snapdir=visible mypool/sheep

    ```


    Once someone runs `cp -R` on a dataset, recursively copies all your snapshots
    onto the filesystem, and blows everything up, hide it again by setting the `snapdir`
    property to `hidden`.


    ### Mounting Snapshots


    You can mount a snapshot much like you’d mount any other filesystem.


    ```bash

    # mount -t zfs mypool/sheep@snap1 /mnt

    ```


    You cannot access a snapshot via the hidden `.zfs` directory while it is manually
    mounted. Even a mounted snapshot is still read-only.


    ## Deleting Snapshots


    Snapshots prevent the blocks they use from being freed. This means you don’t get
    that space back until you stop using those blocks, by removing all snapshots that
    reference them.


    Create a new snapshot, and then remove it:


    ```bash

    # zfs snapshot mypool/sheep@deleteme

    # zfs destroy mypool/sheep@deleteme

    ```


    That wasn’t so hard, was it?


    You can also add the verbose flag (`-v`), to get more detail about what''s being
    destroyed. While verbose mode doesn’t help much when you’re destroying a single
    snapshot, it becomes more valuable as you destroy more datasets or if you want
    to see what a command would do without actually running it.

