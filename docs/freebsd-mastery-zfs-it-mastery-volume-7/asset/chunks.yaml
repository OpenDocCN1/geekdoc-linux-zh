- fmt: '

    ZFS lets metadata like the deduplication table take up only 25% of the system’s
    memory. (Actually, it’s 25% of the Adaptive Replacement Cache, or `ARC`, but we’ll
    go into detail on that in *FreeBSD Mastery: Advanced ZFS*.) Each terabyte of deduplicated
    pool means that the system needs at least 20 GB of RAM. Even if you go with your
    more hopeful math based on block usage, where each terabyte of disk needs 2.3
    GB of RAM, the 25% limit means that each terabyte of deduplicated pool needs about
    10 GB of RAM. (In *FreeBSD Mastery: Advanced ZFS*, we discuss adjusting this limit
    so that people who want to shoot themselves in the foot can do it well.)


    ### Deduplication Effectiveness


    ZFS can simulate deduplication and provide a good estimate on how well the data
    would deduplicate. Run `zdb -S` on your pool. You’ll get a nice histogram of block
    utilization and common elements, which you can completely ignore in favor of the
    last line.


    ```

    # zdb -S data

    Simulated DDT histogram:

    ...

    dedup = 3.68, compress = 1.00, copies = 1.00, dedup * compress / copies = 3.68

    ```


    Our pool data can be deduplicated 3.68 times. If all the data in this pool were
    this deduplicatable, we could fit 3.68 TB of data in each terabyte of storage.
    This data is exceptionally redundant, however. For comparison, on Lucas’ desktop,
    the `zroot` pool that contains the FreeBSD operating system, user programs, and
    home directories, is about 1.06 deduplicatable.


    That’s not bad. We still need a machine with 20 GB of RAM per terabyte of deduplicated
    pool, mind you, but we can now make a cost/benefit calculation based on the current
    needs of hardware. You can also compare your test data’s deduplicatability with
    its compressibility.


    Is the memory expense worth it? That depends on the cost of memory versus the
    cost of storage.


    Every time we’ve assessed our data for deduplicatability and compressibility,
    and then priced hardware for each situation, we’ve found that enhancing compression
    with faster disks and more CPU was more cost-effective than loads of memory for
    deduplication. Deduplication does not improve disk read speed, although it can
    improve cache hit rates. It only increases write speed when it finds a duplicate
    block. Deduplication also significantly increases the amount of time needed to
    free blocks, so destroying datasets and snapshots can become incredibly slow.
    Compression affects everything without imposing these penalties.


    Deduplication probably only makes sense when disk space is constrained, expensive,
    and very high performance. If you need to cram lots of deduplicable data onto
    a pool of SSDs, `dedup` might be for you.


    Everyone’s data is different, however, so check yours before making a decision.


    ### Enabling Deduplication


    The ZFS property `dedup` activates and deactivates deduplication.


    ```

    # zfs set dedup=on data/data1

    ```


    Deduplication is now active on this data set.


    Like compression, deduplication only affects newly written data. Activating deduplication
    won’t magically deduplicate data already on the pool. For best results activate
    deduplication when first creating the dataset, before writing any data to it.


    ### Disabling Deduplication


    To turn deduplication off, set the dataset’s `dedup` property to `off`.


    ```

    # zfs set dedup=off data/data1

    ```


    Like compression, disabling deduplication doesn’t magically reduplicate all of
    your files. Deduplicated files remain deduplicated. If you turned off `dedup`
    because it made system performance abysmal, turning it off won’t improve performance.
    Only removing deduplicated files will improve performance. You can’t purge all
    traces of `dedup` from a dataset. You’re better off using `zfs send` and `zfs
    receive` to send the data to a new dataset that doesn’t use deduplication.


    Your best choice is probably to not use deduplication. Deduplication is a great
    technology, and the people who need it really do need it. Most of us don’t have
    deduplicable data, however. Don’t enable features only because they’re cool.


    Choosing a disk space management strategy correctly at the beginning will save
    you much future pain.


    [1](#part0010.xhtml_ref_footnotebookmark_start_33_1) On the plus side, you’ll
    have an excuse to throw Jude under the bus. Metaphorically, if you prefer.


    [2](#part0010.xhtml_ref_footnotebookmark_start_33_2) Sysadmins who consider “being
    fair to users” outside their normal remit can use `refquotas` as a way of reducing
    exposure to user cooties.


    [3](#part0010.xhtml_ref_footnotebookmark_start_33_3) You don’t monitor disk space
    usage? Well, an outage is merely a different sort of alarm.


    [4](#part0010.xhtml_ref_footnotebookmark_start_33_4) Yes, Mr. Pedantic, your real-world
    data is composed only of ones and zeroes. Go compress your data down to a single
    0 and a 1 and see how well that works for you.


    [5](#part0010.xhtml_ref_footnotebookmark_start_33_5) Also like Wile E. Coyote,
    painting a tunnel on the wall won’t help.


    # Chapter 7: Snapshots and Clones


    One of ZFS’ most powerful features is snapshots. A filesystem or zvol snapshot
    allows you to access a copy of the data.


    Snapshots are the root of many ZFS features, such as clones. A clone is a fork
    of a filesystem based on a snapshot.


    Snapshots also underpin replication, letting you send datasets from one host to
    another.


    Best of all, ZFS’ copy-on-write nature means that snapshots are “free.” Creating
    a snapshot is instantaneous and consumes no additional space.


    ## Copy-on-Write


    In both ordinary filesystems and ZFS, files exist as blocks on the disk. In a
    traditional filesystem, changing the file means changing the file’s blocks. If
    the system crashes or loses power when the system is actively changing those blocks,
    the resulting shorn write creates a file that’s half the old version, half the
    new, and probably unusable.


    ZFS never overwrites a file’s existing blocks. When something changes a file,
    ZFS identifies the blocks that must change and writes them to a new location on
    the disk. This is called *copy-on-write*, or `COW`. The old blocks remain untouched.
    A shorn write might lose the newest changes to the file, but the previous version
    of the file still exists intact.


    ZFS is almost an object-oriented filesystem. Metadata, indexing, and data are
    all different types of objects that can point to other objects. A ZFS pool is
    a giant tree of objects, rooted in the pool labels.

