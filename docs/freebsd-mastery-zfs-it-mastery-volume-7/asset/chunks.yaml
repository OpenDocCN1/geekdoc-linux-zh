    \ so we want to add a third mirror VDEV. Use the zpool add command to create a\
    \ new mirror device and add it to the pool. Here we use the providers gpt/zfs4\
    \ and gpt/zfs5 to create a new mirror and add it to the pool.\n\n```\n# zpool\
    \ add db mirror gpt/zfs4 gpt/zfs5\n```\n\nThe pool’s status now shows a new mirror\
