  raw: '### SATA vs. SAS vs. SSD


    Data storage devices come in a variety of types. ZFS can use SAS drives, SATA
    drives, spinning platters, SSD devices, or any other storage media supported by
    the operating system.


    That’s not to say that the drives are equivalent. SAS drives can usually last
    much longer than SATA drives under the same load. Flash drives are much faster
    than any kind of spinning disk. ZFS can store data on any of these. Base your
    choice of drive hardware on your organization’s needs, not on ZFS.


    ZFS can make special use of extra-fast storage as read and write caches. If you
    can add a couple of solid state disks to your SAS or SATA-based storage array,
    you can vastly accelerate ZFS’ performance.


    ### Disk Redundancy


    It’s not uncommon for a storage array to lose several disks simultaneously. A
    power surge can damage multiple disks. An intensive array rebuild stresses the
    remaining disks. Heat can build up on one side of the shelf. ZFS supports multiple
    redundancy scenarios for exactly these reasons.


    If you buy a whole bunch of identical disks, they might all be made on the same
    day or in the same batch. A bad day at the manufacturing plant can bite you hard.
    Sadly, disk retailers can’t ship you drives made on different days or in different
    batches. The best you can do is to have each array include drives made by multiple
    manufacturers.


    ### Physical Redundancy


    FreeBSD supports multipath storage, allowing you to work around many hardware
    problems. Rearranging your hardware might increase the system’s availability and
    reliability. If you have two external disk arrays, perhaps use a disk from each
    array in your mirrored pair. This way, if a disk array’s power supply dies, each
    mirror still has one active disk. When the failed array is restored, the mirrors
    automatically recover. As this is specialty equipment, we discuss multipath in
    *FreeBSD Mastery: Advanced ZFS*.


    Look at your hardware before installation. Consider how it might fail, and how
    proper arrangement of your kit might prevent outages.


    ### Disk Installation and Labeling


    No, not using a label machine and pasting a little sticker on each hard drive.
    The glue on those things never sticks (although you should physically label your
    disks). FreeBSD supports Globally Unique ID (GUID) Partition Tables (GPT) labels,
    letting you put arbitrary logical markers on a hard drive or a partition. If a
    storage device has a problem, FreeBSD announces the problem and identifies the
    troubled unit by device name or device node. While it’s nice to know that disk
    /dev/da239 has a problem, you must track that back to a physical device. Many
    ZFS users have machines with many hard drives, exacerbating the issue.


    FreeBSD tools let you get the serial number of a failed drive. Depending on your
    hardware, however, you might have to physically examine each drive to identify
    its serial number. This usually involves either opening a case or pulling individual
    drives out of a disk array. This is tedious, unpleasant, and most often interrupts
    service.


    If you prepare during installation, you can zero right in on a failed disk—even
    a disk at a remote facility. Jude runs a lot of very dense storage arrays in locations
    all over the world, and uses this scheme to keep hard drive maintenance from overwhelming
    him.


    Come up with a naming and numbering scheme for your storage arrays. Many storage
    arrays have a standard naming scheme, often printed on the equipment. If your
    equipment already has numbered shelves, use that numbering. Otherwise, make simple
    rules like “shelf 0 is always at the top and disk 0 is always at the left.” You
    might use the prefix “f” for the front and “b” for the back, or whatever works
    for you.


    Note the serial number of each drive as you install it in the array. Physically
    label each drive tray as you install it by physical location and serial number.
    Yes, this is tedious—but you’ll eventually need this information. You can do this
    work in peace and quiet at your own pace, or you can desperately rush through
    it during an artificially prolonged and unnecessarily stressful outage.


    Now either install FreeBSD or boot live media. Use camcontrol devlist to get a
    list of all your storage devices, then run diskinfo -v on each storage device
    node to get its serial number. (You can also extract serial numbers from camcontrol(8).)
    This will tell you that, say, disk /dev/da0 is actually disk 3 on shelf 4.


    You now have a list of device nodes and their associated serial numbers, as well
    as a list of physical locations and serial numbers. Match those up with each other,
    and then use GPT labels to attach the location and serial number to the disk partition
    you’re using. (See the FreeBSD documentation or *FreeBSD Mastery: Storage Essentials*
    for details on GPT labels.) GPT labels have a maximum length of 15 characters,
    so you might have to truncate long serial numbers. In most serial numbers the
    last digits are most unique, so trim off the front.


    Combined, disk 9 in shelf 2, with a serial number of WD-WCAW36477223, might get
    a label like /dev/gpt/s2d9-AW36477223.


    You want your system to use these labels, and *only* these labels. Disable GPTID
    and disk ident labels on the system. This avoids confusion later.


    With this setup, during a hardware failure now FreeBSD can tell you that the third
    disk on shelf 4, serial number such-and-such, is bad. Given that information,
    even the most junior tech at your colocation provider should be able to pull the
    right disk.[1](#part0004.xhtml_ref_footnotebookmark_end_27_1) Have the tech give
    you the serial number of the replacement drive before installation, so you can
    create the proper labels.


    Advance planning makes outages much less traumatic. We highly recommend it.


    ## About this Book


    This book is for anyone who manages ZFS filesystems or who is curious about what
    a modern, high-performance filesystem looks like. While it focuses on ZFS on FreeBSD,
    the general ZFS information applies to any platform running OpenZFS. Parts of
    this book happen to be applicable to other implementations, such as Oracle ZFS,
    but you can’t assume this book applies to these other implementations.


    We really wanted to write a single FreeBSD OpenZFS book, but limitations in the
    chosen publishing platforms made that impractical. *FreeBSD Mastery: ZFS* covers
    routine use of ZFS. The next book, *FreeBSD Mastery: Advanced ZFS*, covers online
    replication, performance tuning, and other topics requiring greater understanding
    of ZFS. The second book assumes you understand everything in this book, however.


    OpenZFS advances constantly. This book is a static entity. What’s more, a book
    that covered every OpenZFS feature would be the size of the print version of the
    Manhattan telephone book.[2](#part0004.xhtml_ref_footnotebookmark_end_27_2) These
    books try to offer what the vast majority of sysadmins must know to run ZFS well.
    If you’re looking for a feature we don’t discuss, or you have a special edge case
    we don’t cover, definitely check the man pages, the online OpenZFS documentation,
    and the FreeBSD mailing lists archives and forums.


    ## Book Overview


    Chapter 0 is this introduction.


    Chapter 1, Introducing ZFS, gives you a pterodon’s-eye view of the ZFS software
    suite. You’ll learn how to look at ZFS filesystems and data pools, and understand
    how the large chunks of ZFS fit together.


    Chapter 2, Virtual Devices, takes you through the ZFS’ physical redundancy schemes.
    ZFS supports traditional mirrored disks and concatenated devices, but also offers
    its own advanced parity-based redundancy, RAID-Z.


    Chapter 3, Pools, discusses ZFS storage pools. You’ll learn how to assemble virtual
    devices into pools, how to check pools, and how to manage and query your storage
    pools.


    Chapter 4, Datasets, takes you through what traditionalists would call a filesystem.
    Except in ZFS, it’s not really a filesystem. Yes, you put files in a dataset,
    but a dataset is so much more.'
