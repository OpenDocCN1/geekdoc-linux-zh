  trans: "\n\n虚拟设备（如镜像和 RAID-Z）专门设计用于重建损坏磁盘上的丢失数据。如果你的镜像对中的某块磁盘损坏，你只需更换磁盘，ZFS 就会将存的镜像复制到新磁盘上。如果你的\
    \ RAID-Z VDEV 中的某块磁盘故障，你更换损坏的驱动器，ZFS 将根据校验数据重建该磁盘。这种数据恢复功能是每个 RAID 实现的核心功能。\n\n\
    然而，ZFS 同时理解文件系统和底层存储。这使得 ZFS 拥有传统 RAID 管理器所缺乏的灵活性和优势。\n\n重建由软件或硬件 RAID 镜像的磁盘需要将良好磁盘上的每一个扇区复制到替换磁盘上。RAID\
    \ 单元必须将分区表、文件系统、所有 inode、所有块（甚至是空闲空间）以及所有数据从一个磁盘复制到另一个。\n\n我们都曾在 `/etc/rc.conf`\
    \ 中写过拼写错误，导致系统无法启动。在使用 UFS2 和 `gmirror(8)` 镜像系统上修复该拼写错误，需要进入单用户模式、修复错误并重启。这会导致其中一块磁盘与另一块不同步。在重启时，FreeBSD\
    \ 注意到了这种差异，并通过将当前驱动器的每一个扇区复制到备份磁盘来使备份磁盘同步。你可能更改了磁盘上的一两个扇区，但 `gmirror(8)` 必须复制整个磁盘。这可能需要几小时甚至几天。\n\
    \nZFS 精确知道每块磁盘使用了多少。当 ZFS 重新组装存储提供者时，它只会复制该提供上实际需要的数据。如果你替换了一个只有三分之一数据的 ZFS 磁盘，ZFS\
    \ 只会将那三分之一磁盘的数据复制到替换磁盘中。\n\n在 ZFS 镜像磁盘上修复 `rc.conf` 拼写错误需要系统管理员干预，这与 `gmirror(8)`\
    \ 系统非常相似。你进入单用户模式，修复错误，重启。区别在于，ZFS 确切知道磁盘上哪些块发生了变化。如果在单用户模式下只有其中一块磁盘通了电（虽然不太可能但确实发生），两块磁盘将不同步。ZFS\
    \ 不会尝试复制整个磁盘，而是只更新同步磁盘所需的块。在你输入命令查看其运行状态之前，系统可能已经修复了镜像。\n\nZFS 的重构被称为 `resilvering`（重银）。与其他\
    \ ZFS 完整性操作一样，resilvering 只在活动文件系统上进行。你可以在单用户模式下进行 resilver，但这就像单用户模式下安装软件没有意义。\n\
    \n当你更换存储提供者时，resilvering 会自动发生。它在驱动器临时故障并恢复时也会发生，例如控制器重启或外部磁盘柜重启。虽然重建存储提供者可能需要很长时间，但短暂中断后的重建可能只需要几秒钟。\n\
    \n如果你在 resilvering 期间正常使用 RAID-Z 池，重构速度会大大变慢。resilvering 和 scrubbing 是按事务组顺序执行的，而正常的读写操作是非常随机的。ZFS\
    \ 的重构速率受到限制，以防影响正常的系统功能。\n\n## 扩展池\n\n数据会扩展以填充所有可用空间。无论你给池提供多少磁盘空间，你最终都会想要更多。要增加池的大小，请向池中添加\
    \ VDEV。对于冗余池，你可以用更大的提供者替换存储提供者。\n\n当你扩展池时，ZFS 会开始向新空间写入数据。随着池的变老，ZFS 尝试平均平衡不同提供者之间的可用空间。ZFS\
    \ 会偏向写入驱动器，使它们同时变满。然而，一个包含一个空 VDEV 和三个几乎满的 VDEV 的池，除了将新数据放在空 VDEV 上外别无选择。如果你频繁创建和删除文件，每个磁盘的负载最终会于平衡。\n\
    \n`zpool` 内的每一个 VDEV 都应该是相同的。如果你的池是由一组镜像构建的，请不要向池中添加 RAID-Z3。\n\n使用 `zpool attach`\
    \ 命令向 VDEV 添加提供者，使用 `zpool add` 命令向池添加 VDEV。\n\n你无法从非镜像 VDEV 中删除设备，也无法从池中删除任何\
    \ VDEV。`zpool add` 的 `-n` 标志执行“干运行”，向你显示运行该命令的结果，而不会实际更改池。运行带有 `-n` 标志的 `zpool\
    \ add` 命令并仔细研究结果生成的池配置，可以给你发出警告，提醒你正要自掘坟脚。\n\n### 向条带化池添加 VDEV\n\n没有冗余的条带化池（Striped\
    \ pools）可以扩展到硬件极限。然而，向池中添加的每个非冗余 VDEV 都会增加发生灾难性故障的概率，就像它所类似于 RAID-0 设备一样。请记住，池中单个\
    \ VDEV 的故障会破坏整个池。在条带化池中，每块磁盘都是独立的 VDEV。\n\n这里是一个具有三个提供者的条带化池。\n\n```\n# zpool\
    \ status scratch\n…\nconfig:\n\nNAME       STATE  READ WRITE CKSUM\nscratch  \
    \  ONLINE    0     0     0\n gpt/zfs0  ONLINE    0     0     0\n gpt/zfs1  ONLINE\
    \    0     0     0\n gpt/zfs2  ONLINE    0     0     0\n```\n\n使用 `zpool add`\
    \ 命令向 scratch 池添加存储提供者。\n\n```\n# zpool add scratch gpt/zfs3\n```\n\n池状态现在显示有四个存储提供者，你获得了额外的磁盘空间。\n\
    \n### 向镜像池添加 VDEV\n\n你可以向镜像 VDEV 添加提供者，但额外的磁盘不会增加可用空间。它们将彼此镜像。要向使用镜像 VDEV 的池添加空间，请添加一个新的\
    \ VDEV。\n\nzpool db 目前有两个 VDEV。\n\n```\n# zpool status db\n...\nNAME        STATE\
    \ READ WRITE CKSUM\ndb          ONLINE   0     0     0\n mirror-0   ONLINE   \
    \ 0     0     0\n  gpt/zfs0  ONLINE    0     0     0\n  gpt/zfs1  ONLINE    0\
    \     0     0\n mirror-1   ONLINE    0     0     0\n  gpt/zfs2  ONLINE    0  \
    \   0     0\n  gpt/zfs3  ONLINE    0     0     0\n```\n\n我们需要更多空间，所以想添加第三个镜像。使用\
    \ `zpool add` 命令创建一个新的镜像并将其添加到池中。这里我们使用提供者 `gpt/zfs4` 和 `gpt/zfs5`。\n\n```\n#\
    \ zpool add db mirror gpt/zfs4 gpt/zfs5\n```\n\n池状态现在显示。要查看池如何在 VDEV 之间分配数据，使用\
    \ `zpool list -v`。\n\n### 向 RAID-Z 池添加 VDEV\n\n你不能向任何 RAID-Z VDEV 添加提供者。要扩展基于\
    \ RAID-Z 的池，你必须向池添加额外的 VDEV，或者用更大的磁盘替换每个成员磁盘。最佳实践是让所有的 RAID-Z VDEV 使用相同数量的驱动。\n\
    \n这里有一个想要通过另一个 VDEV 扩展的 RAID-Z 池。\n\n```\nconfig\n\nNAME        STATE READ WRITE\
    \ CKSUM\ndb          ONLINE   0     0     0\n raidz1-0   ONLINE   0     0    \
    \ 0\n  gpt/zfs0  ONLINE    0     0     0\n  gpt/zfs1  ONLINE    0     0     0\n\
    \  gpt/zfs2  ONLINE    0     0     0\n```\n\n再次，我们使用 `zpool add` 命令创建一个新的 VDEV\
    \ 并将其添加到池中。\n\n```\n# zpool add db raidz1 gpt/zfs3 gpt/zfs4 gpt/zfs5\n```\n\n\
    检查检查显示一个新的 VDEV `raidz1-1`，它包含三个提供者。ZFS 立即在新的提供者上条带化数据。\n\n如果你想向基于 RAID-Z2 或 RAID-Z3\
    \ 的池添加新 VDEV，请使用相同的命令，并指定所需的 RAID-Z 类型和相应数量的提供者。\n\n"
- fmt: "\nRemember, you cannot add providers to a RAID-Z VDEV—the configuration of\
    \ a RAID-Z VDEV is fixed in concrete. Many people try to add a disk to a RAID-Z\
    \ VDEV by using `zpool add`. The `zpool add` command adds new VDEVs to a pool.\
    \ If you use `-f` to demand `zpool add` put one new disk in your RAID-Z-based\
    \ pool, you get a malformed pool with one RAID-Z member and one stripe member.\
    \ The resulting pool is not maintainable and is irreparable. Fixing it requires\
    \ backing up your data, then destroying and recreating the pool.\n\nYou can use\
    \ `zpool attach` to expand mirrored and striped VDEVs, but it doesn’t work on\
    \ RAID-Z pools. You cannot add providers to a RAID-Z VDEV.\n\n## Hardware Status\n\
    \nMost ZFS configurations tolerate a certain amount of hardware failure. When\
    \ the underlying storage providers fail, ZFS does its best to warn you. Listen\
    \ to it.\n\nThe `zpool status` command displays the condition of the storage hardware\
    \ in the `STATE` field. You get one `STATE` field for the entire pool, near the\
    \ top. Lower down, where `zpool status` lists each VDEV and storage provider,\
    \ the `STATE` column lets you narrow down where a fault lies.\n\nErrors percolate\
    \ upwards. If a single storage provider fails, the pool develops a related failure.\
    \ The big screaming failure message at the top of `zpool status` is your clue\
    \ to look into the individual providers to see the underlying error.\n\nPools\
    \ and VDEVs can have six states. Underlying providers can have at least three\
    \ of these states.\n\n### Online\n\nAn `online` pool, VDEV, or provider is working\
    \ normally.\n\n### Degraded\n\nA `degraded` pool is missing at least one storage\
    \ provider. That provider is either totally offline, missing, or generating errors\
    \ more quickly than ZFS tolerates. A degraded pool retains enough resiliency to\
    \ continue working, but one more failure might shut it down.\n\nIf a storage provider\
    \ has too many I/O errors, ZFS would prefer to totally shut down (`fault`) the\
    \ device. ZFS really tries to avoid faulting devices that provide necessary resiliency\
    \ to a pool, however. If the last working provider in a mirror starts showing\
    \ many errors, or a provider fails in a RAID-Z1 VDEV that already has a dead storage\
    \ provider, ZFS puts that provider into degraded mode when it would normally put\
    \ it in a faulted mode.\n\n### Faulted\n\n`Faulted` storage providers are either\
    \ corrupt or generate more errors than ZFS can tolerate. A faulted storage provider\
    \ takes with it the last known good copy of the data. If your two-disk mirror\
    \ loses both disks, or your RAID-Z1 loses two disks, the VDEV faults. A faulted\
    \ VDEV takes its whole pool with it.\n\n### Unavail\n\n`Unavail` means that ZFS\
    \ can’t open the storage provider. Maybe the device isn’t attached to the system\
    \ anymore, or perhaps it was badly imported (see “Moving Pools” later this chapter).\
    \ In any case, it’s not there, so ZFS can’t use it. An unavailable device might\
    \ take the whole-VDEV, and hence the whole pool, with it.\n\nAn unavailable device\
    \ impacts the VDEV’s state depending on the resiliency in the VDEV. If a pool\
    \ still has enough resilience to function, the pool becomes degraded. If the VDEV\
    \ can no longer function, it faults.\n\nUnavailable devices appear in the pool’s\
    \ status by the GUID assigned to them rather than the provider’s device node.\n\
    \n### Offline\n\n`Offline` devices have been deliberately turned off by the sysadmin.\
    \ You have no end of reasons for turning off a drive in a large array.\n\n###\
    \ Removed\n\nSome hardware can detect when a drive is physically removed from\
    \ the system while the system is running. Such hardware lets ZFS set the `Removed`\
    \ status when a drive is pulled. When you reattach the drive, ZFS tries to bring\
    \ the provider back online.\n\n### Errors through the ZFS Stack\n\nHere’s a server\
    \ with a couple disconnected storage providers. This doesn’t belong to Lucas’\
    \ or Jude’s system; it belongs to Lucas’ friend’s system. Note the errors on the\
    \ providers, the type of VDEV, and the state of the pool as a whole.\n\n```\n\
    # zpool status\n  pool: FreeNAS02\n state: DEGRADED\nstatus: One or more devices\
    \ could not be opened.  Sufficient replicas exist  for\n    the pool to continue\
    \ functioning in a degraded state.\naction: Attach the missing device and online\
    \ it using 'zpool online'.\n   see: http://illumos.org/msg/ZFS-8000-2Q\n  scan:\
    \ scrub repaired 0 in 15h57m with 0 errors on Sun Feb  8 15:57:55 2015\nconfig:\n\
    \nNAME            STATE  READ WRITE CKSUM\nFreeNAS02       DEGRADED  0     0 \
    \    0\n raidz2-0       DEGRADED  0     0     0\n  15881942844…  UNAVAIL   0 \
    \    0     0  was /dev/gpt/zfs0\n  gpt/zfs1      ONLINE    0     0     0\n  gpt/zfs2\
    \      ONLINE    0     0     0\n  gpt/zfs3      ONLINE    0     0     0\n  gpt/zfs4\
    \      ONLINE    0     0     0\n  gpt/zfs5      ONLINE    0     0     0\n  gpt/zfs6\
    \      ONLINE    0     0     0\n  gpt/zfs7      ONLINE    0     0     0\n  gpt/zfs8\
    \      ONLINE    0     0     0\n  gpt/zfs9      ONLINE    0     0     0\n  gpt/zfs10\
    \      ONLINE    0     0     0\n  gpt/zfs11      ONLINE    0     0     0\n  gpt/zfs12\
    \      ONLINE    0     0     0\n  gpt/zfs13      ONLINE    0     0     0\n```\n\
    \n## Restoring Devices\n\nIf ZFS is kind enough to announce its problems, the\
    \ least you can do is try to fix them. The repair process depends on whether the\
    \ drive is missing or failed.\n\n### Missing Drives\n\nA drive disconnected during\
    \ operation shows up as either removed or faulted. Maybe you removed a drive to\
    \ check its serial number. Perhaps a cable came loose. It might have been gremlins.\
    \ In any case, you probably want to plug it back in.\n\nIf the hardware notices\
    \ that the drive is removed, rather than just saying it’s missing, the hardware\
    \ also notices when the drive returns. ZFS attempts to reactivate restored drives.\n\
    \nHardware that doesn’t notify the operating system when drives are added or removed\
    \ needs sysadmin intervention to restore service. Use the `zpool online` command\
    \ to bring a reconnected drive back into service.\n\n```\n# zpool online gpt/zfs5\n\
    ```\n\n### Faulted Drives\n\nThe hardest part of drive replacement often has nothing\
    \ to do with ZFS: you must find the bad drive. We advise using the physical location\
    \ of the disk in the GPT label for the disk when you first install the drive to\
    \ make later replacement easier. If you must identify a failed drive without this\
    \ information, use `gpart list` and `smartctl` to get the disk’s serial number\
    \ and manufacturer, then search the chassis for that drive. It’s the same process\
    \ discussed in Chapter 0, in reverse, with the added pressure of unscheduled downtime.\
    \ Worst case, you can find the serial number of every drive that is still working,\
    \ and process of elimination will reveal which drive is missing.\n"
