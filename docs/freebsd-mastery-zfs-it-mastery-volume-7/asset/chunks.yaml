    \ pools, you can replace storage providers with larger providers.\n\nWhen you\
    \ expand a pool, ZFS automatically starts writing data to the new space. As the\
    \ pool ages, ZFS tries to evenly balance available space between the various providers.\
    \ ZFS biases the writes to the drives so that they will all become full simultaneously.\
    \ A pool with one empty VDEV and three nearly full ones has little choice but\
    \ to put new data on the empty VDEV, however. If you frequently create and delete\
    \ files, per-disk load eventually levels out.\n\nEvery VDEV within a zpool should\
    \ be identical. If your pool is built from a bunch of mirrors, don’t go adding\
    \ a RAID-Z3 to the pool.\n\nAdd providers to VDEVs with the zpool attach command\
    \ and VDEVs to pools with the zpool add command.\n\nYou can’t remove a device\
    \ from a non-mirror VDEV or any VDEV from a pool. The –n flag to zpool add performs\
    \ a “dry run,” showing you the results of what running the command would be without\
