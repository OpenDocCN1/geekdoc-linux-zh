- fmt: "\n```\n# zfs get quota zroot/var/log\nNAME           PROPERTY  VALUE  SOURCE\n\
    zroot/var/log  quota        2G  local\n```\n\nView all of a dataset’s properties\
    \ with `zfs get all` and the ZFS dataset name.\n\nChapter 4 explores ZFS properties\
    \ in detail, while Chapter 6 discusses restricting dataset size.\n\n### ZFS Limits\n\
    \nFilesystems have always had maximum sizes and limits. The FAT filesystem we\
    \ all know and cringe over has required multiple revisions, in part to overcome\
    \ its maximum size of 32 MB, then 2 GB, then 4 GB. FAT32’s 2 TB limit is starting\
    \ to look a little cramped these days. UFS and `ext2/3/4fs` have had their own,\
    \ similarly arbitrary, limits. These limits exist because the filesystem authors\
    \ had to set a limit somewhere, and chose values that they expected to be good\
    \ for the next several years. A popular filesystem will remain in use until those\
    \ limits are reached, however, so systems administrators have needed to repeatedly\
    \ cope with them.\n\nZFS advocates claim that ZFS is immune to these arbitrary\
    \ limits, but that’s not *quite* true. ZFS uses 128 bits to store most of its\
    \ values, which set the limits so high that they won’t ever be encountered by\
    \ anyone working in systems administration today. One directory can have 248 files,\
    \ of up to 16 exabytes each. A single pool can be up to 256 zettabytes, or 278\
    \ bytes. A storage pool can contain up to 264 devices, and a single host can have\
    \ up to 264 storage pools.\n\nThe good news is, we will not live long enough to\
    \ hit these limits. The bad news is, we have all the expertise in migrating between\
    \ filesystems. When technology hits ZFS’ limits, those poor people won’t be accustomed\
    \ to migrating between filesystems. Fortunately, they’ll have a few lingering\
    \ ongoing FAT/UFS/extfs rollovers for practice.\n\n## Storage Pools\n\nZFS uses\
    \ *storage pools* rather than disks. A storage pool is an abstraction atop the\
    \ underlying storage providers, letting you separate the physical medium and the\
    \ user-visible filesystem on top of it.\n\nUse `zpool(8)` to view and manage a\
    \ system’s storage pools. Here’s the pool from a default FreeBSD system.\n\n```\n\
    # zpool status\n  pool: zroot\n state: ONLINE\n  scan: none requested\nconfig:\n\
    \nNAME       STATE   READ WRITE CKSUM\nzroot     ONLINE      0     0     0\n gpt/zfs0\
    \ ONLINE      0     0     0\n\nerrors: No known data errors\n```\n\nYou get the\
    \ pool’s name and state first. Systems can have more than one ZFS pool—large systems,\
    \ with dozens and dozens of hard drives, often have multiple pools. If this host\
    \ had multiple storage pools, each would appear in a separate description like\
    \ the sample above.\n\nZFS can perform many sorts of integrity checks on storage\
    \ pools. The *scan* statement shows if any integrity check is being performed\
    \ and the result of the most recent scan.\n\nThe last part of the pool list shows\
    \ the layout of the virtual devices in the pool.\n\n## Virtual Devices\n\nA storage\
    \ pool contains one or more virtual devices, or *VDEVs*. A VDEV is similar to\
    \ a traditional RAID device. A big RAID-5 presents itself to the filesystem layer\
    \ as a single huge device, even though the sysadmin knows it’s really a whole\
    \ bunch of smaller disks. Virtual devices let you assign specific devices to specific\
    \ roles. With VDEVs you can arrange the physical storage as needed.\n\nThe virtual\
    \ device is where a whole bunch of ZFS’ magic happens. A pool can be arranged\
    \ for RAID-style redundancy. You can use providers as dedicated read and write\
    \ caches, improving the virtual device’s performance. Chapter 2 covers virtual\
    \ devices in more depth.\n\nZFS’ data redundancy and automated error correction\
    \ also take place at the VDEV level. Everything in ZFS is checksummed for integrity\
    \ verification. If your pool has sufficient redundancy, ZFS is self-healing. If\
    \ your pool lacks redundancy, well, at least you know the data is damaged and\
    \ you can (hopefully) restore from backup.[1].\n\nThe `zpool status` command that\
    \ displays the health of a pool also shows the virtual devices in that pool. Look\
    \ at the example in the previous section. This very simple pool, `zroot`, contains\
    \ a single storage provider, `/dev/gpt/zfs0`. This provider is a GPT partition,\
    \ not a disk. ZFS can use all sorts of underlying storage, as Chapter 2 discusses.\
    \ Using a GPT partition is very common, but other options include whole disks,\
    \ files, and any other GEOM provider. FreeBSD uses GEOM providers to support features\
    \ such as encryption.\n\n## Blocks and Inodes\n\nTraditional filesystems almost\
    \ always use some variety of data block for storing data and maps the contents\
    \ of those blocks with an index node. BSD’s UFS and Linux’s `extfs` call these\
    \ *blocks* and *inodes*. Even Microsoft’s FAT filesystems have data storage blocks\
    \ and index nodes.\n\nLike these filesystems, ZFS uses index blocks and data blocks.\
    \ Unlike older filesystems, however, ZFS generates index nodes on demand. Whenever\
    \ possible, ZFS creates storage blocks in sizes that fit the data. The variable\
    \ sized blocks don’t always fit every possible file you might create, but they’re\
    \ certainly more flexible than traditional filesystems.\n\nUnlike UFS superblocks,\
    \ dynamically generated index blocks can’t be placed in known locations on the\
    \ disk. How can ZFS cope with the possibility of damage to an index block? ZFS\
    \ stores multiple copies of critical index blocks at algorithmically predictable\
    \ locations. These *ditto blocks* get replicated in multiple locations on the\
    \ disk. Chapter 3 discusses ZFS blocks, uberblocks, ditto blocks, transaction\
    \ groups, and more.\n\nNow that you know the bare basics of ZFS, the rest of this\
    \ book merely fills in several hundred little details. We’ll start at the very\
    \ bottom of the stack, with the virtual devices.\n\n[1] ZFS does not eliminate\
    \ the need for backups. The only thing that eliminates backups is absolute indifference.\n\
    \n# Chapter 2: Virtual Devices\n\nIn this chapter we’ll delve into how the sausage\
    \ is made. This... is a pig—I mean, a disk. Disks are the physical manifestation\
    \ of storage. Disks are evil. They lie about their characteristics and layout,\
    \ they hide errors, and they fail in unexpected ways. ZFS means no longer having\
    \ to fear that your disks are secretly plotting against you. Yes, your disks *are*\
    \ plotting against you, but ZFS exposes their treachery and puts a stop to it.\n\
    \nTo most effectively use the available disks with ZFS, you require a basic understanding\
    \ of how the operating system presents disks to ZFS, and how ZFS arranges data\
    \ on those disks.\n\n## Disks and Other Storage Media\n\nZFS can also run on storage\
    \ media other than disks. Anything that is a FreeBSD GEOM storage provider can\
    \ become a ZFS storage medium. ZFS even has support for using files as the backing\
    \ storage, which is really great for testing but is not meant for production.\
    \ ZFS can use any block device for its physical storage, but each type has its\
    \ advantages and disadvantages.\n\n### Raw Disk Storage\n\nUsing an entire physical\
    \ disk reduces complexity. Also, there is no partitioning to worry about, and\
    \ no software or configuration between ZFS and the physical disk. However, the\
    \ disadvantages usually outweigh these advantages.\n\nBooting from a disk requires\
    \ that the disk have a boot loader. A boot loader can only go on a partitioned\
    \ disk. You cannot boot a raw disk. FreeBSD supports giving disks useful labels,\
    \ but those labels live inside the partition information.\n"
