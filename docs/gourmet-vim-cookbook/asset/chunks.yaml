- fmt: "\nWith this, the distinction between `/` as the literal character and the\
    \ delimiters are clearer.\n\n# Global Command\n\n## Global Command Basics\n\n\
    **Problem:**\nYou don’t know how to use the global command.\n\n**Solution:**\n\
    Global command is a useful command to execute a command on multiple lines. The\
    \ general pattern is `:g/pattern/command`.\n\nFor example, to delete all lines\
    \ containing “let”, you can use `:g/let/d`.\n\n## Inverse Match\n\n**Problem:**\n\
    You want to run the global command on non-matching lines instead of matching lines.\n\
    \n**Solution:**\nThe command `:g/let/d` deletes all lines containing the word\
    \ “let”. What if you want to delete all lines not containing “let”?\n\nYou can\
    \ use the inverse global command with `g!` or `v`. Run either `:g!/let/d` or `:v/let/d`.\n\
    \n## Prepend or Append On Multiple Lines\n\n**Problem:**\nYou need to append a\
    \ semicolon on all lines containing “const”.\n\n**Solution:**\nFrom normal mode,\
    \ you can enter insert mode at the end of the line with `A`. You can take replicate\
    \ normal mode commands with the `normal` command.\n\nTo add a semicolon at the\
    \ end of all lines containing “const”, run `:g/const/normal A;`.\n\nBy the way,\
    \ recall that you can enter insert mode at the start of the line with `I`. To\
    \ add “const” at the start of all lines containing “;”, run `:g/;/normal Iconst`\
    \ .\n\n## Global Command Within a Range\n\n**Problem:**\nYou need to execute the\
    \ global command within a range, not on the entire file.\n\n**Solution:**\nYou\
    \ can run `:5,10g/donut/s/pancakes/waffles/g` to execute the global command between\
    \ lines 5 and 10.\nYou can also run the global command between a marked range.\
    \ The command `:'a,'bg/donut/s/pancakes/waffles/g` executes the global command\
    \ between the marks `'a` and `'b`.\n\n## Delete Blank and Empty Lines\n\n**Problem:**\n\
    You need to quickly get rid of empty lines.\n\n**Solution:**\nThe global command\
    \ is great to for deleting multiple empty and blank lines lines.\n\n*   Run `:g/^$/d`\
    \ to delete all empty lines.\n*   Run `:g/^\\s*$/d` to delete all blank lines.\n\
    \n## Running Global Command Between Matching Patterns\n\n**Problem:**\nYou need\
    \ to execute the global command only between `pattern1` and `pattern2`.\n\n**Solution:**\n\
    The global command accepts the form of `:g/pattern1/,/pattern2/ {cmd}` to execute\
    \ `cmd` between `pattern1` and `pattern2`.\n\nIf you want to delete the text between\
    \ “apples” and “oranges”, excluding “apples” and “oranges”, run `:g/apples/+,\
    \ /oranges/- d`. If you want to delete “apples” and “oranges” too, run `:g/apples/,\
    \ /oranges/ d`.\n\n```\napples\n\nbananas\n\noranges\n\napples\n\nblueberries\n\
    \npineapple\n\nmangos\n\noranges\n\npapayas\n```\n\nExplanation:\n\n*   `pattern1`\
    \ is `apples`.\n*   `pattern2` is `oranges`.\n*   The `+` means one line below\
    \ and `-` means one line above.\n*   `d` is the delete command.\n\nIf you want\
    \ to sort only the items inside the parentheses, run `:g/(/+1,/)/-1 sort`.\n\n\
    ```\n(\n  chokeberry\n  blueberry\n  acaiberry\n)\n\n  apples\n  carrots\n  bananas\
    \ \n)\n```\n\nExplanation:\n\n*   `pattern1` is `(` (left parentheses).\n*   `pattern2`\
    \ is `)` (right parentheses).\n*   The `+1` in `/(/+1` and the `-1` in `/)/-1`\
    \ means that the global command will affect texts after `(` and before `)`.\n\
    *   `sort` is the command to execute.\n\n## Condense Multiple Empty Lines\n\n\
    **Problem:**\nYou have multiple empty lines in a file and you need to wrap them\
    \ into single lines.\n\n**Solution:**\nYou can condense multiple empty lines with\
    \ `:g/^$/,/./-1 j`.\n\nIf you have:\n\n```\nHello\n\nThere are \n\nmany empty\n\
    \nlines\n\nin here\n```\n\nRunning `:g/^$/,/./-1 j` will condense the empty lines\
    \ into single lines. This global command uses two patterns: `/^$/` (empty line)\
    \ and `/./-1` (one line before a non-empty line). The command to be executed is\
    \ the join command (`:j`).\n\nAlternatively, if you have the `cat` program in\
    \ the terminal, you can also run `:%!cat -s` (the `-s` stands for “squeeze”) to\
    \ squeeze multiple empty lines into single lines.\n\n## Reuse the Global Command\
    \ Search Pattern in the Substitute Command\n\n**Problem:**\nYou want to reuse\
    \ the global command pattern in the substitute command.\n\n**Solution:**\nVim\
    \ will actually re-use the global command pattern if it is followed-up with the\
    \ substitute command with a blank search pattern.\n\n`:g/apples/s//oranges/g`\
    \ is the same as `:g/apples/s/apples/oranges/g`.\n\n## The Default Command\n\n\
    **Problem:**\nYou want to print the global command results.\n\n**Solution:**\n\
    If you don’t pass any `{cmd}` to the global command, Vim will automatically run\
    \ the print command (`:p`).\n\n`:g/bagel` is the same as `:g/bagel/p`.\n\nNote\
    \ that this command has a pattern of `g/re/p`. This is the same grep command found\
    \ in the terminal.\n\nThis pattern, `g/re/p`, originally comes from the Ed editor\
    \ (remember that?).\n\n## Use Execute to Run Complex Expressions\n\n**Problem:**\n\
    You want to run the global command using a complex expression.\n\n**Solution:**\n\
    You can use Vim’s `:execute` command with the global command.\n\nGiven a list\
    \ of filenames (without any extension):\n\n```\nfile1\n\nfile2\n\nfile3\n```\n\
    \nTo generate new markdown files for each line. Run `:g/^/execute \"w \" . getline(\"\
    .\") . \".md\"`.\n\nThe command executes `:w file1.md`, `:w file2.md`, and `:w\
    \ file3.md`. Vim will generate `file1.md`, `file2.md`, and `file3.md`. Neat!\n\
    \n## Reverse All Lines\n\n**Problem:**\nYou need to reverse the order of each\
    \ line.\n\n**Solution:**\nTo reverse all lines, just run `:g/^/m 0`.\n\n*   `^`\
    \ will target all lines in a file.\n*   `m 0` is a move command. It will move\
    \ each line, into the 1st line, effectively reversing the entire order.\n\n##\
    \ Surround All Digits With Double Quotes\n\n**Problem:**\nYou need to surround\
    \ any digits with double quotes.\n\n**Solution:**\nGiven the following text:\n\
    \n```\nconst one = 1\n\nconst two = 2\n\nconst three = 3\n\nconst nope = \"don't\
    \ mind me\"\n\nconst four = 4\n\nconst five = 55\n```\n\nRun `:g/\\d\\+/s//\"\
    &\"/g` to get:\n\n```\nconst one = \"1\"\nconst two = \"2\"\nconst three = \"\
    3\"\nconst nope = \"don't mind me\"\nconst four = \"4\"\nconst five = \"5\"\n\
    ```\n\nExplanation:\n\n*   The pattern `\\d\\+` matches one or more digits.\n\
    *   `s//` is a substitute command with a blank substitute pattern. Recall that\
    \ if you leave the search pattern blank, Vim will use the pattern used by the\
    \ global command.\n*   `\"&\"` is the substitute pattern. Recall that `&` represents\
    \ the entire match. `\"&\"` surrounds the entire match with double quotes.\n\n\
    ## Changing the Delimiter\n\n**Problem:**\nYou got lost in the sea of `/`.\n\n\
    **Solution:**\nJust like you can change the delimiter of the substitute command,\
    \ you can also change the delimiter of the global command with any single-byte\
    \ characters.\n\nThis is a valid global command:\n\n```\n:g@console@d\n```\n\n\
    If you are using a global command with the substitute command, you can do something\
    \ like this:\n\n```\ng@one@s+const+let+g\n```\n\nIt is easier to see which part\
    \ belongs to the global command and which belongs to the substitute command.\n\
    \n## Programmatic Global Command\n\n**Problem:**\nYou need to programmatically\
    \ run the global command.\n\n**Solution:**\nThe global command is very versatile.\
    \ You can enhance the global command with Vimscript.\n\nA few things of you can\
    \ do:\n\n*   Delete even lines with `:g/^/if line(\".\") % 2 != 0 | norm! d$`\n\
    *   Delete lines that are less than 3 char long with `:g/^/if strlen(getline(\"\
    .\")) < 3 | d`\n\n# Tags\n\n## What Are Tags?\n\n**Problem:**\nYou want to understand\
    \ about Vim’s tag system.\n\n**Solution:**\nIn many modern editors, you can click\
    \ on a function or class definition and it will take you to where that function\
    \ or class is defined. You can do that in Vim with tags. Although you can just\
    \ search for any definition with `grep`, `vimgrep`, or external libraries like\
    \ (`fzf.vim`), tags are the best tool for this kind of job.\n\nThink of a Vim\
    \ tag like an address book:\n\n```\nName    Address\n\nIggy1   123 Awesome St,\
    \ 12345\n\nIggy2   987 Incredible Ave, 98765\n\nIggy3   555 Handsome Rd, 55555\n\
    ```\n"
