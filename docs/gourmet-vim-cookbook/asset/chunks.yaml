  trans: "\n\n每次你打开 `vimrc` 时，你都会看到这些内容：\n\n```\n+-- 5 lines: Plugins -------\n\n\
    +-- 5 lines: Setups --------\n\n+-- 5 lines: Functions -----\n```\n\n## 根据文件类型运行特定配置\n\
    \n**问题：**\n你希望根据当前的文件类型使用不同的选项。\n\n**解决方案：**\nVim 允许你在处理特定文件类型时运行特定的配置。\n\nVim\
    \ 通常可以检测到你正在处理的文件类型。要检查当前文件的文件类型，请运行 `:set ft?`。\n\n例如，如果你正在处理 `test1.py`，运行 `:set\
    \ ft?` 将返回 `filetype=python`。\n\nVim 拥有一套文件类型插件运行时系统，允许你根据文件类型运行特定的 Vim 脚本。你可以在\
    \ `.vim` 目录中找到它。它通常位于根路径下。\n\n在 `.vim` 目录内部，创建一个名为 `ftplugin` 的目录。在该目录内，创建一个与你想要自定义设置的文件类型同名的文件。在这种情况下，让我们来创建两个文件类型插件文件，一个用于\
    \ python，一个用于 ruby。\n\n```\n~/.vim/ftplugin/python.vim\n\n# 内部内容：\n\nset background=light\n\
    \n~/.vim/ftplugin/ruby.vim\n\n# 内部内容：\n\nset background=dark\n```\n\n当我打开 `test.py`\
    \ 时，Vim 是浅色背景。当我打开 `test.rb` 时，Vim 将是深色背景。\n\n## 切换布尔选项\n\n**问题：**\n你需要快速切换任何\
    \ Vim 布尔选项。\n\n**解决方案：**\n你可以使用 `!` 后缀切换任何 Vim 布尔选项的值。\n\n某些值如 `number`、`relativenumber`、`wrapscan`\
    \ 等包含布尔值（`set number`、`set relativenumber`、`set wrapscan`）。它们的相反值通常以 `no` 为前：`nonumber`、`norelativenumber`、`nowrapscan`\
    \ 等。\n\n关闭 `set number` 的方法是运行 `set nonumber`。更快的方法是使用 `set number!` 进行切换。\n\n\
    顺便提一下，记住 `@:` 可以重复上一个命令行命令。由于 `:set number!` 只是一个命令行，你可以使用 `@:` 快速地在 Vim 布尔选项之间切换。\n\
    \n## 将 vimrc 拆分为多个文件\n\n**问题：**\n你的 `vimrc` 太大了，你想将它拆分成多个较小的文件。\n\n**解决方案：**\n\
    你可以通过将 `vimrc` 拆分为多个较小的文件来保持它的精简。\n\n要使用此功能，请为你的 `vimrc` 文件创建一个名为 `settings/`\
    \ 的新目录（你可以随心所命名）：`~/.vim/settings/`。\n\n假设你想将 `vimrc` 分为 4 个部分，创建这 4 个文件：\n\n\
    *   第三方插件 (`~/.vim/settings/plugins.vim`）。\n*   通用设置 (`~/.vim/settings/configs.vim`）。\n\
    *   自定义函数 (`~/.vim/settings/functions.vim`）。\n*   键位映射 (`~/.vim/settings/mappings.vim`）。\n\
    \n在你的主 `vimrc` 中，添加：\n\n```\nsource $HOME/.vim/settings/plugins.vim\n\nsource\
    \ $HOME/.vim/settings/configs.vim\n\nsource $HOME/.vim/settings/functions.vim\n\
    \nsource $HOME/.vim/settings/mappings.vim\n```\n\n这里的关键是使用 `:source` 命令。它类似于许多编程语言中的\
    \ `import` 或 `require`。在这些设置文件的每一个文件中，添加通常的 vimrc 设置和配置。\n\n在 `~/.vim/settings/plugins.vim`\
    \ 中：\n\n```\ncall plug#begin('~/.vim/plugged')\n\n  Plug 'mattn/emmet-vim'\n\n\
    \  Plug 'preservim/nerdtree'\ncall plug#end()\n```\n\n在 `~/.vim/settings/configs.vim`\
    \ 中：\n\n```\nset nocompatible\n\nset relativenumber\n\nset number\n```\n\n在 `~/.vim/settings/functions.vim`\
    \ 中：\n\n```\nfunction! ToggleNumber()\n\n  if(&relativenumber == 1)\n\n    set\
    \ norelativenumber\n  else\n    set relativenumber\n  endif\n\nendfunc\n```\n\n\
    在 `~/.vim/settings/mappings.vim` 中：\n\n```\ninoremap jk <esc>\n\nnnoremap <silent>\
    \ <C-f> :GFiles<CR>\n\nnnoremap <Leader>tn :call ToggleNumber()<CR>\n```\n\n现在你的主\
    \ `vimrc` 只有 4 行了！\n\n## 映射新键\n\n**问题：**\n你需要创建自定义映射。\n\n**解决方案：**\n如果你发现自己反复执行相同的复杂任务，这说明你应该创建一个新的键位映射了。有很多内容可以进行映射。\n\
    \n第一个是 leader 键（主键）。我喜欢使用 `<Space>` 作为我的 leader 键。你可以通过以下方式更改 leader 键：\n\n```\n\
    let mapleader = \"\\<space>\"\n```\n\n你还可以映射运算符和命令。例如，我在我的 `vimrc` 中有两个映射：\n\n\
    ```\nnnoremap <silent> <C-f> :GFiles<CR>\n\nnnoremap <Leader>tn :call ToggleNumber()<CR>\n\
    ```\n\n第一个映射映射到 `fzf.vim` 插件的 `:GFiles` 命令。第二个映射是一个自定义函数调用（我有一个名为 `ToggleNumber()`\
    \ 的函数）。通过使用 `<C-f>`，我覆盖了 Vim 原生的 `Ctrl-F` 翻页功能。如果你的映射与 Vim 的原生命令冲突，它会被覆盖。\n\n\
    我用于映射的命令 `nnoremap` 实际上由三个部分组成：\n\n*   `n` 代表普通模式。\n*   `nore` 意味着非递归。\n*   `map`\
    \ 是映射命令。\n\nVim 拥有各种模式的映射。`nnoremap` 意味着它将在普通模式下。。如果我想在插入模式下创建映射，我将使用 `i` 前缀：\n\
    \n```\ninoremap jk <Esc>\n```\n\n这只在插入模式下有效，而在普通模式下无效。\n\n使用非递归版本也很重要（使用 `nnoremap`\
    \ 和 `inoremap` 代替 `nmap` 和 `imap`），因为这可能会导致无限递归。如果你不确定是否要使用 `nore`，请始终使用它。\n\n\
    其他的映射模式包括：map（普通、视觉、选择和操作等待）、vmap（视觉和选择）、smap（选择）、xmap（视觉）、omap（操作等待）、map!（插入和命令行）、lmap（命令行）、cmap（命令行）以及\
    \ tmap（终端）。我们将详细介绍这些。更多信息请查看 `:h.txt`。\n\n你可能会发现复制别人的 `vimrc` 更容易。虽然这样做也可以，但我建议从零构建自己的\
    \ `vimrc`。每个人的习惯都不同。创建最适合自己的映射。让你的 `vimrc` 属于你自己。\n\n## 使用包安装插件\n\n**问题：**\n你想用\
    \ Vim 安装插件。\n\n**解决方案：**\n从 8 版本开始，Vim 自带了一个插件管理器叫做 `packages`。\n\nVim 会检查 `.vim`\
    \ 目录下的名为 `pack` 的目录。包功能支持两种加载机制：\n\n*   自动加载插件。\n*   手动加载插件。\n\n要自动加载插件，你需要将其放在\
    \ `start/` 目录中，路径如下：\n\n```\n~/.vim/pack/*/start/\n```\n\n注意星号 `*` 代表任意名称。你可以将其命名为任何内容。在这种情况下，让我们调用\
    \ `packdemo`：\n\n```\n~/.vim/pack/packdemo/start/\n```\n\n你不能跳过 `pack/` 和 `start/`\
    \ 之间的目录。如果你尝试这样做，将不起。你必须在 `pack/` 和 `start/` 之间放置一个目录名。\n\n```\n~/.vim/pack/start/\n\
    ```\n\n假设你想安装 NERDTree 插件。在终端中，进入 `start/` 目录，并在那里克隆 NERDTree 仓库。\n\n```bash\n\
    cd ~/.vim/pack/packdemo/start/\n\ngit clone https://github.com/preservim/nerdtree.git\n\
    ```\n\n"
