    them.


    ## Substitute In Multiple Files


    **Problem:**

    You need to substitute across multiple files.


    **Solution:**

    To substitute and save across multiple files, run `:argdo %s/donut/pancake/g |
    update`.


    The `update` command is to save each file.


    ## Execute a Macro in Multiple Files


    **Problem:**

    You need to run a macro across multiple files.


    **Solution:**

    To execute a macro in multiple files, you can use the `:normal` command. To execute
    macro in register `a`, run `:argdo normal @a | update`.


    ## Limiting the Files to Operate On


    **Problem:**

    You only need to run the command on only the first 5 files.


    **Solution:**

    You can limit the number of files you want to operate on with a range when running
    the `-do` command.


    To substitute only the first 5 items in the argument list: `:1,5argdo s/pancake/waffle/g
    | update`.


    ## Creating an Argument List


    **Problem:**

    You need to quickly create an argument list.


    **Solution:**

    The argument list is needed to run the `:argdo` command.


    *   To get all the markdown files in the current directory, run `:args *.md`.

    *   To get all the markdown files in the current directory recursively, run `:args
    **/*.md`.


    Once you get all the files, you can view them with `:args`.


    ## Adding to an Argument List


    **Problem:**

    You already created an argument list and you need to add more items.


    **Solution:**

    Use `:arga` to add to the argument list.


    Supposing you created an argument list of all markdown files that start with “a”
    by running `:args a*.md`, then later you also want to add a list of of all markdown
    files that start with “b”. If you run `:args b*.md`, it will replace the first
    markdown list. To achieve this, run `:arga b*.md`. Now you have a list of markdown
    files that start with “a” and “b”.


    If you call `:arga` without argument, Vim will add the current buffer to the argument
    list.


    # Numbers


    ## Quickly Increment or Decrement a Number on a Line


    **Problem:**

    You need to quickly increment or decrement a number on the current line.


    **Solution:**

    Vim has `Ctrl-A` and `Ctrl-X` operators to increment and decrement the next closest
    number (from the cursor) in the current line.


    If you have the text:


    ```

    dozens of donut: 2

    calories per donut: 200

    ```


    *   If your cursor is on the first line and you press `Ctrl-A`, the cursor will
    automatically go to “2” and increment it to “3”.

    *   If your cursor is on the second line and you press `Ctrl-X`, the cursor will
    automatically go to “200” and decrement it to “199”.


    ## Incrementing Number By More Than One


    **Problem:**

    The increment / decrement operators (`Ctrl-A` and `Ctrl-X`) only add or subtracts
    one each time.


    **Solution:**

    You can pass a count before the increment / decrement operators.


    If you run `10 Ctrl-A` at the start of the line with “I ate 2 donuts”, it will
    increment it into “I ate 12 donuts”. Now that is sweet!


    Likewise if you run `5 Ctrl-X` on the same line, it will decrement it into “I
    ate 7 donuts”.


    ## Sequentially Increment Multiple Numbers


    **Problem:**

    You need to increment numbers on multiple rows, sequentially.


    **Solution:**

    If you use visual selection to highlight multiple rows and run `Ctrl-A`, Vim will
    increment into the same number across the rows.


    However, if you run `g Ctrl-A` or `g Ctrl-X` in visual selection, it will sequentially
    increment the numbers on each line.


    If you have the text:


    ```

    breakfast0

    breakfast0

    breakfast0

    ```


    If you visually highlight all 3 lines then press `g Ctrl-A`, Vim will increment
    each line:


    ```

    breakfast1

    breakfast2

    breakfast3

    ```


    ## Substitute and Increment Number


    **Problem:**

    You need to increment numbers using substitution.


    **Solution:**

    You can do this by utilizing the substitute command with the global.


    Suppose that you have the following:


    ```

    ## I''m a header

    ## I''m another header

    ## I''m yet another header

    ```


    And you want to substitute `##` into incrementing numbers, like:


    ```

    1.)  I''m a header

    2.)  I''m another header

    3.)  I''m yet another header

    ```


    Run:


    ```

    let i = 1 | g/^##/s//\=i . ''.)''/g | let i += 1

    ```


    *   `let i = 1` sets the variable `i` to equal 1.

    *   `g/^##/` runs the global command that matches the `^##` pattern (lines starting
    with “##”).

    *   `s//` to use the substitute command. If you leave the search pattern blank,
    Vim will use the same search pattern as the global command search pattern (which
    is `^##`).

    *   `\=i . ''.)''/g` uses the expression `\=i . ''.)''` as the substitute pattern
    (the variable `i` concatenated with the string “.)”. The `g` is the global flag.

    *   `let i += 1` increments the variable `i` by 1 with each iteration.


    ## Quickly Generate Incrementing Numbers Anywhere


    **Problem:**

    You need to generate a list with incrementing numbers.


    **Solution:**

    If you need to create a list quickly, you can generate incrementing number prefixes
    on the fly. Here is how you can do this using visual mode and the number increment
    operator.


    Suppose that you have this list:


    ```

    first item

    second item

    third item

    ```


    1.  Put your cursor on the first character on the first line, the character “f”
    in “first”,

    2.  Activate the block-wise visual mode (`Ctrl-V`),

    3.  Go down two lines.

    4.  Press `I` to activate insert mode before the cursor and type “0\. “. Press
    `<Esc>`.


    You should have:


    ```

    0\. first item

    0\. second item

    0\. third item

    ```


    5.  Press `gv` to quickly highlight the previously selected visual mode. Vim will
    automatically highlight all “0” texts.

    6.  Press `g Ctrl-A` to sequentially increment numbers and you’re done!


    ```

    1\. first item

    2\. second item

    3\. third item

    ```

