    * 黑洞寄存器`"_"`）。

    * 上一次搜索模式寄存器（`/"`）。


    它们可以与其他操作组合使用。运行 `"` 后紧跟寄存器符号，然后是操作符。寄存器通常与复制（`y`）操作和删除（`d`）操作配合使用，也可以与其他操作符使用。你也可以直接输入寄存器的内容：`:put
    a` 会输出寄存器 a 中的内容。在插入模式下，你可以按 `Ctrl-R a` 获取寄存器 a 的内容。


