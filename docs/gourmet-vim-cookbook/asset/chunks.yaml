  trans: "\n通过此，`/` 作为字面字符与分隔符之间的区别变得更加清晰。\n\n# 全局命令 (Global Command)\n\n## 全局命令基础\n\
    \n**问题：**\n你不知道如何使用全局命令。\n\n**解决方案：**\n全局命令是一个非常有用的命令，用于在多行上执行命令。其通用模式为 `:g/pattern/command`。\n\
    \n例如，要删除所有包含“let”的行，可以使用 `:g/let/d`。\n\n## 反向匹配\n\n**问题：**\n你想在不匹配的行上运行全局命令，而不是匹配的行上。\n\
    \n**解决方案：**\n命令 `:g/let/d` 会删除所有包含单词“let”的行。如果你想删除所有不包含“let”的行怎么办？\n\n你可以使用带有\
    \ `g!` 或 `v` 的反向全局命令。运行 `:g!/let/d` 或 `:v/let/d`。\n\n## 在多行上添加或追加\n\n**问题：**\n\
    你需要在所有包含“const”的行末尾添加分号。\n\n**解决方案：**\n在普通模式下，可以使用 `A` 进入行尾的插入模式。你可以使用 `normal`\
    \ 命令复制普通模式下的命令。\n\n要在所有包含“const”的行末尾添加分号，运行 `:g/const/normal A;`。\n\n顺便提一下，记得可以使用\
    \ `I` 进入行首的插入模式。要在所有包含“；”的行开头添加“const”，运行 `:g/;/normal Iconst`。\n\n## 范围内的全局命令\n\
    \n**问题：**\n你需要在一个范围内执行全局命令，而不是在整个文件中执行。\n\n**解决方案：**\n你可以运行 `:5,10g/donut/s/pancakes/waffles/g`\
    \ 在第 5 行到第 10 行之间执行全局命令。\n你也可以在标记的范围之间运行全局命令。命令 `:'a,'bg/donut/s/pancakes/waffles/g`\
    \ 在标记 `'a` 和 `'b` 之间执行全局命令。\n\n## 删除空行和空白行\n\n**问题：**\n你需要快速删掉空行。\n\n**解决方案：**\n\
    全局命令非常适合删除多个空行和空白行（包含空格的）。\n\n*   运行 `:g/^$/d` 删除所有空行。\n*   运行 `:g/^\\s*$/d` 删除所有空白行。\n\
    \n## 在匹配模式之间运行全局命令\n\n**问题：**\n你只需要在 `pattern1` 和 `pattern2` 之间执行全局命令。\n\n**解决方案：**\n\
    全局命令接受形式 `:g/pattern1/,/pattern2/ {cmd}`，用于在 `pattern1` 和 `pattern2` 之间执行 `cmd`。\n\
    \n如果你想删除“apples”和“oranges”之间的文本，排除“apples”和“oranges”，运行 `:g/apples/+, /oranges/-\
    \ d`。如果你也想删除“apples”和“oranges”，运行 `:g/apples/, /oranges/ d`。\n\n```\napples\n\n\
    bananas\n\noranges\n\napples\n\nblueberries\n\npineapple\n\nmangos\n\noranges\n\
    \npapayas\n```\n\n解释：\n\n*   `pattern1` 是 `apples`。\n*   `pattern2` 是 `oranges`。\n\
    *   `+` 表示下方一行，`-` 表示上方一行。\n*   `d` 是删除命令。\n\n如果你只想排序括号内的项，运行 `:g/(/+1,/)/-1 sort`。\n\
    \n```\n(\n  chokeberry\n  blueberry\n  acaiberry\n)\n\n  apples\n  carrots\n \
    \ bananas \n)\n```\n\n解释：\n\n*   `pattern1` 是 `(`（左括号）。\n*   `pattern2` 是 `)`（右括号）。\n\
    *   `/(/+1` 中的 `+1` 和 `/)/-1` 中的 `-1` 意味着全局命令将影响 `(` 之后和 `)` 之前的文本。\n*   `sort`\
    \ 是要执行的命令。\n\n## 合并多个空行\n\n**问题：**\n文件中有多个空行，你需要将它们合并为单行。\n\n**解决方案：**\n你可以使用\
    \ `:g/^$/,/./-1 j` 合并多个空行。\n\n如果你有：\n\n```\nHello\n\nThere are \n\nmany empty\n\
    \nlines\n\nin here\n```\n\n运行 `:g/^$/,/./-1 j` 将将空行合并为单行。这个全局命令使用了两个模式：`/^$/`（空行）和\
    \ `/./-1`（非空行的前的一行）。要执行的命令是合并命令（`:j`）。\n\n或者，如果你在终端中有 `cat` 程序，也可以运行 `:%!cat -s`（`-s`\
    \ 代表“squeeze”，即压缩）将多个空行压缩为单行。\n\n## 在替换命令中重用全局命令的搜索模式\n\n**问题：**\n你想在替换命令中重用全局命令的模式。\n\
    \n**解决方案：**\n如果全局命令后面跟着一个带有空白搜索模式的替换命令，Vim 实际上会重用该全局命令模式。\n\n`:g/apples/s//oranges/g`\
    \ 等同于 `:g/apples/s/apples/oranges/g`。\n\n## 默认命令\n\n**问题：**\n你想打印全局命令的结果。\n\n\
    **解决方案：**\n如果不向全局命令传递任何 `{cmd}`，Vim 将自动运行打印命令（`:p`）。\n\n`:g/bagel` 等同于 `:g/bagel/p`。\n\
    \n注意，该命令的模式为 `g/re/p`。这与终端中找到 grep 命令相同。\n\n这种模式 `g/re/p` 最初源于 Ed 编辑器（记得吗？）。\n\
    \n## 使用 execute 运行复杂表达式\n\n**问题：**\n你想使用复杂表达式运行全局命令。\n\n**解决方案：**\n你可以将 Vim 的\
    \ `:execute` 命令与全局命令配合。\n\n给定一组文件名（不带扩展名）：\n\n```\nfile1\n\nfile2\n\nfile3\n```\n\
    \n为每行生成新的 markdown 文件。运行 `:g/^/execute \"w \" . getline(\".\") . \".md\"`。\n\n\
    该命令执行了 `:w file1.md`、`:w file2.md` 和 `:w file3.md`。Vim 将生成 `file1.md`、`file2.md`\
    \ 和 `file3.md`。太棒了！\n\n## 反转所有行\n\n**问题：**\n你需要反转每一行的顺序。\n\n**解决方案：**\n要反转所有行，只需运行\
    \ `:g/^/m 0`。\n\n*   `^` 将目标文件中的所有行。\n*   `m 0` 是移动命令。它将每行移动到第 1 行，有效地反转了整个顺序。\n\
    \n## 给所有数字加上双引号\n\n**问题：**\n你需要给任何数字加上双引号。\n\n**解决方案：**\n给定以下文本：\n\n```\nconst\
    \ one = 1\n\nconst two = 2\n\nconst three = 3\n\nconst nope = \"don't mind me\"\
    \n\nconst four = 4\n\nconst five = 55\n```\n\n运行 `:g/\\d\\+/s//\"&\"/g` 得到：\n\n\
    ```\nconst one = \"1\"\nconst two = \"2\"\nconst three = \"3\"\nconst nope = \"\
    don't mind me\"\nconst four = \"4\"\nconst five = \"5\"\n```\n\n解释：\n\n*   模式\
    \ `\\d\\+` 匹配一个或多个数字。\n*   `s//` 是一个带有空白替换模式的替换命令。记得如果留空搜索模式，Vim 将使用由全局命令所使用的模式。\n\
    *   `\"&\"` 是替换模式。记得 `&` 代表整个匹配项。`\"&\"` 用双引号包裹整个匹配项。\n\n## 更改分隔符\n\n**问题：**\n\
    你迷失在 `/` 的海洋中了。\n\n**解决方案：**\n就像你可以更改替换命令的分隔符一样你也可以使用任何单字节字符更改全局命令的分隔符。\n\n这是一个有效的全局命令：\n\
    \n```\n:g@console@d\n```\n\n如果你在全局命令中使用替换命令，可以这样做：\n\n```\ng@one@s+const+let+g\n\
    ```\n\n更容易看出哪些部分属于全局命令，哪些部分属于替换命令。\n\n## 程序化全局命令\n\n**问题：**\n你需要程序化运行全局命令。\n\n\
    **解决方案：**\n全局命令非常灵活。你可以用 Vimscript 增强全局命令。\n\n你可以做一些事情：\n\n*   使用 `:g/^/if line(\"\
    .\") % 2 != 0 | norm! d$` 删除偶数行。\n*   使用 `:g/^/if strlen(getline(\".\")) < 3 |\
    \ d` 删除长度小于 3 的行。\n\n# Tags (Tags)\n\n**问题：**\n你想了解 Vim 的标签系统。\n\n**解决方案：**\n\
    在许多现代编辑器中，你可以点击函数或类定义，它会带你到该函数或类定义的地方。你可以在 Vim 中通过标签实现。虽然你可以使用 `grep`、`vimgrep`\
    \ 或外部库（如 `fzf.vim`）搜索任何定义，但标签是处理这类工作的最佳工具。\n\n把 Vim 标签想象成地址簿：\n\n```\nName   \
    \ Address\n\nIggy1   123 Awesome St, 12345\n\nIggy2   987 Incredible Ave, 98765\n\
    \nIggy3   555 Handsome Rd, 55555\n```\n\n"
- fmt: "\nTo look for `Iggy1`’s address, first you open the address book, then search\
    \ for `Iggy1` on the `Name` column, then search for the corresponding address.\
    \ Tags work the same way. Instead of having name-address table, Vim tags store\
    \ word definitions and their locations in the project.\n\nSo how do you get started\
    \ with tags?\n\nYou need a tool called `tag generator` to generate this address\
    \ file. Modern Vim doesn’t come with a tag generator so you have to download it\
    \ separately. There are several options you can choose, but the one I recommend\
    \ is either [Universal Ctags](https://github.com/universal-ctags/ctags) or [Exuberant\
    \ Ctags](http://ctags.sourceforge.net). Follow the direction on their websites\
    \ how to install it.\n\nHere I’ll use the Universal Ctags. After you install it,\
    \ you should get the `ctags` command. If you use a different tags generator, you\
    \ can still follow along.\n\nAssume that you have two ruby files:\n\n```ruby\n\
    ## one.rb\n\nclass One\n  def initialize\n    puts \"Initialized\"\n  end\n\n\
    \  def donut\n    puts \"Bar\"\n  end\nend\n\n## two.rb\n\nrequire './one'\n\n\
    one = One.new\none.donut\n```\n\nRunning `ctags -R .` from the terminal will generate\
    \ a basic tag file (named `tags`). The `-R` means a recursive call.\n\nInside\
    \ that file:\n\n```\nOne\tone.rb\t/^class One$/;\"\tc\ndonut\tone.rb\t/^  def\
    \ donut$/;\"\tf\tclass:One\ninitialize\tone.rb\t/^  def initialize$/;\"\tf\tclass:One\n\
    ```\n\nYours may have additional rows, but it should at least contain a word definition\
    \ and its address.\n\nIf you look at one of them:\n\n```\ndonut\tone.rb\t/^  def\
    \ donut$/;\"\tf\tclass:One\n```\n\n`donut` is the tag name. When your cursor is\
    \ on “donut”, Vim searches the tag file for a row that contains “donut”.\n\n`one.rb\
    \ /^ def donut$/` is the address. It consists of two parts:\n\n* `one.rb` is the\
    \ file name. Vim looks for a file `one.rb`.\n* `/^ def donut$/` is the address.\
    \ `/.../` is a pattern indicator. `^` is a pattern for the first element on a\
    \ line. It is followed by two spaces, then the string `def donut`. Finally, `$`\
    \ is a pattern for the last element on a line. This is the same as if you’re searching\
    \ with `/^ def donut$`.\n* `f class:One` is the tag option that tells Vim that\
    \ “donut” is a function (f) and is part of the `One` class.\n\nIn short, a tag\
    \ file is an address book that tells Vim where to find a particular definition.\n\
    \n## Setting Up the Tag File\n\n**Problem:**\nYou successfully created a tag file\
    \ but you don’t know how to set it up.\n\n**Solution:**\nRun `:set tags?`, Vim\
    \ shows the current tags. To set a custom tag file, use `:set tags+=tags`. The\
    \ `+=` syntax appends the path to the existing list rather than overwriting it.\n\
    \nIf you want to navigate between tags, use `Ctrl` to jump to a definition and\
    \ `Ctrl-t` to pop back. You can also use `:tags` to search for a specific tag\
    \ name.\n"
  raw: "```\n\nTo look for `Iggy1`’s address, first you open the address book, then\
    \ search for `Iggy1` on the `Name` column, then search for the corresponding address.\
    \ Tags work the same way. Instead of having name-address table, Vim tags store\
    \ word definitions and their locations in the project.\n\nSo how do you get started\
    \ with tags?\n\nYou need a tool called tag generator to generate this address\
    \ file. Modern Vim doesn’t come with a tag generator so you have to download it\
    \ separately. There are several options you can choose, but the one I recommend\
    \ is either [Universal Ctags](https://github.com/universal-ctags/ctags) or [Exuberant\
    \ Ctags](http://ctags.sourceforge.net). Follow the direction on their websites\
    \ how to install it.\n\nHere I’ll use the Universal Ctags. After you install it,\
    \ you should get the `ctags` command. If you use a different tags generator, you\
    \ can still follow along.\n\nAssume that you have two ruby files:\n\n```\n\n##\
    \ one.rb\n\nclass One\n\n  def initialize\n\n    puts \"Initialized\"\n\n  end\n\
    \n  def donut\n\n    puts \"Bar\"\n\n  end\n\nend\n\n## two.rb\n\nrequire './one'\n\
    \none = One.new\n\none.donut\n\n```\n\nRunning `ctags -R .` from the terminal\
    \ will generate a basic tag file (named `tags`). The `-R` means a recursive call.\n\
    \nInside that file:\n\n```\n\nOne\tone.rb\t/^class One$/;\"\tc\n\ndonut\tone.rb\t\
    /^  def donut$/;\"\tf\tclass:One\n\ninitialize\tone.rb\t/^  def initialize$/;\"\
    \tf\tclass:One\n\n```\n\nYours may have additional rows, but it should at least\
    \ contain a word definition and its address.\n\nIf you look at one of them:\n\n\
    ```\n\ndonut\tone.rb\t/^  def donut$/;\"\tf\tclass:One\n\n```\n\n`donut` is the\
    \ tag name. When your cursor is on “donut”, Vim searches the tag file for a row\
    \ that contains “donut”.\n\n`one.rb /^ def donut$/;\"` is the address. It consists\
    \ of two parts:\n\n*   `one.rb` is the file name. Vim looks for a file `one.rb`.\n\
    *   `/^ def donut$/` is the address. `/.../` is a pattern indicator. `^` is a\
    \ pattern for the first element on a line. It is followed by two spaces, then\
    \ the string `def donut`. Finally, `$` is a pattern for the last element on a\
    \ line. This is the same as if you’re searching with `/^ def donut$`.\n*   `f\
    \ class:One` is the tag option that tells Vim that “donut” is a function (f) and\
    \ is part of the `One` class.\n\nIn short, a tag file is an address book that\
    \ tells Vim where to find a particular definition.\n\n## Setting Up the Tag File\n\
    \n**Problem:**\nYou successfully created a tag file but you don’t know how to\
    \ set it up.\n\n**Solution:**\nRun `:set tags?`, Vim will display `tags=./tags,tags`\
    \ (depending on your Vim settings, it might be a little different). Vim looks\
    \ at the `tags` option for locations where it can find the tag file.\n\nYou can\
    \ add or remove path locations. If you prefer to have a centralized tags for your\
    \ projects, you can do something like `set tags+=/path/to/your/tags`. Vim will\
    \ search for tags definition in order. If Vim finds a tag file in `./tags` (the\
    \ current directory) it will use that and not the other tag files. If there is\
    \ no tag file in the current directory, Vim will check the next path, `tags` (the\
    \ project root file). Finally, it will look for tags in `/path/to/your/tags`.\n\
    \n## Tags Navigation\n\n**Problem:**\nYou want to quickly jump to a method definition.\n\
    \n**Solution:**\nIf your cursor is on “donut”, you can jump to “donut” origin\
    \ by pressing `Ctrl-]` or by running `:tag donut` (assuming that you already have\
    \ a tag file properly set up in the correct path)\n\nWhat if you have multiple\
    \ methods with the same name? Vim will jump to the definition with a higher tag\
    \ priority.\n\nWait, what is tag priority? When a tag file contains duplicate\
    \ item names, Vim decides which address to jump to based on the tag priority.\n\
    \nThe priorities are, in order:\n\n1.  A fully matched static tag in the current\
    \ file.\n2.  A fully matched global tag in the current file.\n3.  A fully matched\
    \ global tag in a different file.\n4.  A fully matched static tag in another file.\n\
    5.  A case-insensitively matched static tag in the current file.\n6.  A case-insensitively\
    \ matched global tag in the current file.\n7.  A case-insensitively matched global\
    \ tag in a different file.\n8.  A case-insensitively matched static tag in the\
    \ current file.\n\n## Selective Jump\n\n**Problem:**\nYou want to choose which\
    \ keyword to jump to, regardless of tag priority.\n\n**Solution:**\nSuppose that\
    \ you have two “pancake” keyword definitions. If you press `Ctrl-]` while your\
    \ cursor is on the word “pancake”, Vim decides it for you based on its tag priority.\
    \ But what if you want to jump to the one with less priority? How can you fight\
    \ back Vim’s dictatorship?\n\nWith `g Ctrl-]`, if Vim finds multiple matches,\
    \ you can choose which definition to jump. The command-line alternative is the\
    \ command `:tjump pancake`.\n\n## Autocompletion\n\n**Problem:**\nYou want to\
    \ use tags for autocompletion.\n\n**Solution:**\nYou can use autocompletion in\
    \ insert mode using tags. Just press `Ctrl-X Ctrl-]` and Vim will autocomplete\
    \ according to the tag file.\n\n## Automatic Tag Generation\n\n**Problem:**\n\
    You don’t want to keep running the tags generator manually.\n\n**Solution:**\n\
    Your code changes over time. You add, update, and remove methods and classes.\
    \ Meanwhile, the tag file does not know about these changes so it keeps the old\
    \ definitions.\n\nIdeally you need to re-run `ctags -R .` each time you make a\
    \ significant change, but that takes a ton of work! The good news is, you can\
    \ use Vim autocommand (`:autocmd`) to generate tags automatically.\n\nFor example,\
    \ if you want to automatically generate tags each time you save a ruby file, run:\n\
    \n```\n\n:autocmd BufWritePost *.rb silent !ctags -R .\n\n```\n\nAnother alternative\
    \ is to use external plugins to manage the tags. Some popular tag plugins are\
    \ (the list is not comprehensive, so check out if there are better ones to suit\
    \ your coding style):\n\n*   [vim-gutentags](https://github.com/ludovicchabant/vim-gutentags)\n\
    *   [vim-tags](https://github.com/szw/vim-tags)\n*   [vim-easytags](https://github.com/xolox/vim-easytags)\n\
    *   [vim-autotag](https://github.com/craigemery/vim-autotag)\n\n# Text Generation\n\
    \n## Get a File Content\n\n**Problem:**\nYou need to get the content of another\
    \ file into the current file.\n\n**Solution:**\nYou can read the content of a\
    \ file with `:r myfile.txt`. By default it will put the content below the current\
    \ line. If you want to have it on the first line, run `:0r myfile.txt`.\n\n##\
    \ Get the Current Date\n\n**Problem:**\nYou need to get the current date quickly.\n\
    \n**Solution:**\nYour terminal probably has a `date` command. Recall that you\
    \ can insert from a file with `:r somefile.txt`. You can get the current date\
    \ with `:r !date`.\n\nThis command also works with other external commands:\n\n\
    *   If you need to get all the filenames in the current directory, run `:r !ls`.\n\
    *   If you need to get the response of a curl command, run `:r !curl -s https://jsonplaceholder.typicode.com/posts`\
    \ (by the way, the `-s` flag in this command stands for silent).\n\n## Generate\
    \ Numbers\n\n**Problem:**\nYou need to quickly generate numbers from 1 to 10.\n\
    \n**Solution:**\nRun `:put =range(1,10)` to generate the numbers 1 to 10.\n\n\
    The `put` method outputs the text from the given register. In this case, `=` is\
    \ the expression register. The expression is `range(1,10)`.\n\nBy the way, the\
    \ `range()` command also accepts an optional third parameter, stride. Run `:put=range(1,10,2)`\
    \ to generate numbers 1 to 10 incremented by 2\\. Run `:put=range(10,1,-1)` to\
    \ generate decrementing numbers.\n\n## Generate IP Addresses\n\n**Problem:**\n\
    You need to generate different IP addresses.\n\n**Solution:**\nTo generate a sequential\
    \ IP addresses, use `:for i in range(1,10) | put ='192.168.0.'.i | endfor`.\n\n\
    This is an expansion of the `put` + `range` method above using the `for` loop\
    \ and string concatenation.\n\n## Generate Random Dice Throw\n\n**Problem:**\n\
    You want to generate a random number between 1 to 6.\n\n**Solution:**\nTo generate\
    \ 10 different dice rolls, you can use `rand()`:\n\n```\n\n:for i in range(1,10)\
    \ | put='Roll the dice: ' . (rand() % 6 + 1) | endfor"
