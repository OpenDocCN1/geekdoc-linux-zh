    1.  Run `:put a` to paste the instruction string “gUUj”.

    2.  Add the needed action, “w” to the instruction string, making it: “gUUjw”.

    3.  RUN `"AY$` FROM THE START OF THAT LINE TO YANK IT BACK TO REGISTER A.

    4.  Now running `@a` will uppercase the current line, go down one line, and go
    to the next word.


    An alternative is to edit it on the command-line mode.


    *   Type `:let @a =` (don’t press `<Enter>` yet!)

    *   Press `Ctrl-R a`. Vim will output the content of register a.

    *   You can now edit it.


    ## Use the Blackhole Register to Prevent Register Pollution


    **Problem:**

    Some commands, like `:d`, save the affected texts into the register but you don’t
    want to store the affected texts into the register.


    **Solution:**

    Use the blackhole register `_` to make changes without storing it to any register.


    This is particularly useful if you are running a common on multiple rows and that
    command’s side effect saves to a register.


    Instead of running `:g/donut/d` to delete all lines that contain “donut” and pollute
    the numbered registers, running `:g/donut/d _` deletes all lines that contain
    “donut” without polluting the numbered register.


    ## See the Content From All Registers


    **Problem:**

    You want to see what your current registers are.


    **Solution:**

    To see the text from all registers, run `:registers`. You can also check for a
    specific register by passing the register name as an argument. Run `:register
    a` to see the content of the register a.


    ## Execute a Macro Programmatically


    **Problem:**

    You need to execute a macro on multiple lines at the same time.


    **Solution:**

    You can run a macro programmatically using the `:normal` command.


    To execute macro a on lines 5-10, run `:5,10 normal @a`.


    You can also combine this with other commands, like the global command. To execute
    macro a on lines containing “const”, run `:g/const/normal @a`.


    If you need to execute a macro on multiple files on the lines that contain the
    word “const”, you can run `:argdo g/const/normal @a`.


    ## Quickly Append to an Existing Macro


    **Problem:**

    You want to add a few more instructions at the end of an existing macro.


    **Solution:**

    Use the uppercase letter of that register to append to an existing macro.


    If you have the following macro to uppercase the current line then go down one
    line:


    ```


    qagUUjq


    ```


    Later you want to add `dd` after `j`. Instead of recording the macro from scratch,
    simply run `qAddq`. `qA` adds the action `dd` to the existing macro in register
    a. To put it in another word, Vim automatically adds the `dd` operation on top
    of the `gUUj` operations.


    ## Quickly Paste From the Numbered Register


    **Problem:**

    You need to paste sequentially from the numbered registers (`"1P`, `"2P`, `"3P`).


    **Solution:**

    When you paste from the numbered register (`"1P`) followed by a dot command `.`,
    Vim automatically increments the numbered register.


    Try this: paste from the numbered register 1 with `"1P`, then run `.` (this executes
    `"2P`), then run `.` again (this executes `"3P`).


    ## Macro Factory


    **Problem:**

    You want to duplicate and combine macros.


    **Solution:**

    Recall that macro registers are really variables where you can store strings of
    instructions to be executed or texts to be outputted. Since macros are just texts,
    you can perform string operations on them.


    To combine macros b and c and save in the register a, run `:let @a = @b . @c`
    (`.` in a Vimscript expression is a string concatenation; don’t confuse it with
    the dot command). In fact, if you want to add an additional operation to a macro,
    like `dd`, you can do it with `:let @a = @b . @c . ''dd''`.


    ## Recursive Macro


    **Problem:**

    You need to run a recursive macro.


    **Solution:**

    If you have the text:


    ```


    a. chocolate donut


    b. mochi donut


    c. powdered sugar donut


    d. plain donut


    ```


    If you want to toggle the case of the first word using a recursive macro, run:


    ```


    qaqqa0W~j@aq


    ```


    Steps breakdown:


    *   `qaq` records an empty macro. It is imperative in a recursive macro to start
    with an empty register. When you recursively call that macro, it will run whatever
    is in that register.

    *   `qa` records in register a.

    *   `0W~j` goes to the first character in the current line, then goes to the next
    WORD, then toggles the case of the character under the cursor, then finally goes
    down one line.

    *   `@a` executes the macro a (this is the recursive part - you’re still recording
    macro a and here you are also executing macro a).

    *   `q` stops recording.


