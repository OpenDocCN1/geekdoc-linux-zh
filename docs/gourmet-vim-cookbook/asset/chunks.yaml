  trans: "\n要查找 `Iggy1` 的地址，首先打开地址簿，然后在 `Name` 列中搜索 `Iggy1`，然后查找对应的地址。标签（Tags）的工作原理也是如此的。Vim\
    \ 标签并不是存储名称-地址表，而是存储单词定义及其在项目中的位置。\n\n那么，该如何开始使用标签呢？\n\n你需要一个名为 `tag generator`\
    \ 的工具来生成这个地址文件。现代 Vim 并不自带标签生成器，因此你需要单独下载它。你有几个选项可以选择，但我推荐的是 [Universal Ctags](https://github.com/universal-ctags/ctags)\
    \ 或 [Exuberant Ctags](http://ctags.sourceforge.net)。请按照它们网站上的说明进行安装。\n\n在这里我将使用\
    \ Universal Ctags。安装完成后，你应该可以获得 `ctags` 命令。如果你使用不同的标签生成器，仍然可以参考本文。\n\n假设你有两个 ruby\
    \ 文件：\n\n```ruby\n## one.rb\n\nclass One\n  def initialize\n    puts \"Initialized\"\
    \n  end\n\n  def donut\n    puts \"Bar\"\n  end\nend\n\n## two.rb\n\nrequire './one'\n\
    \none = One.new\none.donut\n```\n\n在终端运行 `ctags -R .` 将生成一个基础标签文件（命名为 `tags`）。`-R`\
    \ 表示递归调用。\n\n在该文件内部：\n\n```\nOne\tone.rb\t/^class One$/;\"\tc\ndonut\tone.rb\t\
    /^  def donut$/;\"\tf\tclass:One\ninitialize\tone.rb\t/^  def initialize$/;\"\t\
    f\tclass:One\n```\n\n你的文件可能会包含额外的行，但它至少应该包含一个单词定义及其地址。\n\n如果你查看其中之一：\n\n```\n\
    donut\tone.rb\t/^  def donut$/;\"\tf\tclass:One\n```\n\n`donut` 是标签名。当你的光标置于“donut”上时，Vim\
    \ 会在标签文件中搜索包含“donut”的行。\n\n`one.rb /^ def donut$/` 是地址。它由两部分组成：\n\n* `one.rb`\
    \ 是文件名。Vim 会查找名为 `one.rb` 的文件。\n* `/^ def donut$/` 是地址。`/.../` 是模式指示符。`^` 是行首元素的模式。后面跟着两个空格，然后是字符串\
    \ `def donut`。最后，`$` 是行尾元素的模式。这与你使用 `/^ def donut$` 进行搜索是一样的。\n* `f class:One`\
    \ 是标签选项，它告诉 Vim “donut”是一个函数 (f) 且是 `One` 类的一部分。\n\n简而言之，标签文件就是一个地址簿，告诉 Vim 在何处找到特定的定义。\n\
    \n## 设置标签文件\n\n**问题：**\n你成功创建了标签文件，但你不知道如何设置它。\n\n**解决方案：**\n运行 `:set tags?`，Vim\
    \ 会显示当前的标签。要设置自定义标签文件，请使用 `:set tags+=tags`。`+=` 语法将路径添加到现有列表之后，而不是覆盖它。\n\n如果你想在标签之间跳转，可以使用\
    \ `Ctrl` 跳转到定义，并使用 `Ctrl-t` 返回。你也可以使用 `:tags` 搜索特定的标签名。\n"
- fmt: "\n## Generate Numbers Horizontally\n\n**Problem:**\nYou need to generate a\
    \ number series on the same line.\n\n**Solution:**\nTo generate numbers horizontally,\
    \ use `put` and `join`.\n\n* `:put=join([1,2,3,4], \\\" - \\\")` to generate `1\
    \ - 2 - 3 - 4`.\n* `:put=join(range(1,10), \\\"', '\\\")` to generate `1’, ‘2’,\
    \ ‘3’, ‘4’, … ‘10` (it won’t generate the first and last single-quote, you can\
    \ just add them manually).\n\n## Transform a Text Into a Numbered List Based On\
    \ Line Numbers\n\n**Problem:**\nYou want to turn a text into a numbered list based\
    \ on line numbers.\n\n**Solution:**\nTo create a numbered list on multiple lines,\
    \ run `:%s/^/\\=printf('%-2s', line('.'))`.\n\nIf you have following text starting\
    \ on line 1:\n\n```\nBreakfast is good\n\nBut lunch is better\n\nDinner is still\
    \ the best\n```\n\nRun `:%s/^/\\=printf(\"%-2s\", line(\".\"))` to get:\n\n```\n\
    1 Breakfast is good\n2 But lunch is better\n3 Dinner is still the best\n```\n\n\
    Command breakdown:\n\n* `^` represents the start of the line.\n* `\\=` allows\
    \ you to use Vimscript expression in a substitution.\n* `printf('%-2s')` prints\
    \ the string with space (the -2 is the field with, padded left).\n* `line('.')`\
    \ is the current line number.\n\n# Text Manipulation\n\n## How to Speak Vim\n\n\
    **Problem:**\nYou are having trouble remembering myriads of Vim commands.\n\n\
    **Solution:**\nDon’t try to remember every command. Instead, break it down into\
    \ smaller chunks. Vim commands contain a grammar-like pattern (let’s call it the\
    \ “Vim Grammar”) to create compositions.\n\nThere is one rule in Vim grammar:\n\
    \n```\nverb + noun\n```\n\nOperators are verbs and motions are nouns. Most actions\
    \ are done by following that rule. You only need to master a handful of operator\
    \ and navigation keys to become productive.\n\nFor example:\n\n* To delete the\
    \ next word, run `dw`; verb (`d`) + noun (`w`).\n* To yank two characters to the\
    \ left, `y2h`; verb (`y`) + noun (`2h`). Note that you can pass a count before\
    \ the motion (`2h`).\n* To change the next line, `cj`; verb (`c`) + noun (`j`).\n\
    \nTexts often come structured. There is a concept of a “word”, a “paragraph”,\
    \ a “parentheses”, etc in a file. Vim has an abstraction known as text objects\
    \ to address these structures. There are two different text objects: inner (`i`\
    \ + object) and outer (`a` + object) text objects. This looks complicated, but\
    \ once you get it, it’s fairly simple and intuitive.\n\nA text object is the noun\
    \ in the Vim grammar rule of verb + noun. You need to pass an operator before\
    \ a text object.\n\n```javascript\nconst hello = function() {\n  console.log(\"\
    Hello Vim\");\n  return true;\n}\n```\n\nIf your cursor is on the “H” in “Hello”:\n\
    \n* To delete the entire “Hello Vim”: `di(`.\n* To delete the function block (surrounded\
    \ by {}): `di{`.\n* To delete the “Hello” string: `diw`.\n\nIf you are new to\
    \ Vim, you don’t have to remember dozens of operators. You can start by just committing\
    \ these 3 to memory:\n\n* `d` (delete).\n* `c` (change).\n* `y` (yank).\n\n##\
    \ Changing Cases\n\n**Problem:**\nYou need to change the case of your text.\n\n\
    **Solution:**\nThere are different ways to change the case of your text.\n\nTo\
    \ change the case of a single character:\n\n* `~` toggles the case of the character\
    \ the cursor is on. If your cursor is on “d” in “donut”, pressing `~` toggles\
    \ it to uppercase.\n* `vu` lowers the case of the character the cursor is on.\
    \ If your cursor is on “D” in “Donut”, pressing `vu` lowers the case to “d”.\n\
    * `vU` uppercases the case of the character the cursor is on. If your cursor is\
    \ on “d” in “donut”, pressing `vU` ups the case to “D”.\n\nTo change the case\
    \ using a motion:\n\n* `g~ {motion}` toggles the case of the texts indicated by\
    \ motion. When combined with `g`, `g~` acts as an operator. To toggle the case\
    \ of the next two words, run `g~2w`. To toggle the case of the current inner word,\
    \ run `g~iw`.\n* `gu {motion}` lowers the case of the texts indicated by motion.\
    \ To lowercase the text inside the `()`, run `gui(`.\n* `gU {motion}` ups the\
    \ case of the texts indicated by motion. To uppercase to the end of the file,\
    \ run `gUG`.\n\nTo change the case of the current line:\n\n* To togglecase the\
    \ current line, run `g~~`.\n* To lowercase the current line, run `guu`.\n* To\
    \ uppercase the current line, run `gUU`.\n\n## Swap Two Characters\n\n**Problem:**\n\
    You need to quickly swap two adjacent characters.\n\n**Solution:**\nI do these\
    \ kinds of typos all the time when editing: typing “teh” instead of “the”, “cosnt”\
    \ instead of “const”, etc. The easiest way to fix a two-character typo is to use\
    \ `xp`.\n\n`x` deletes the character under the cursor and `p` pastes that recently\
    \ deleted character.\n\n## Replace Mode\n\n**Problem:**\nYou need to replace characters\
    \ with the ones you are typing.\n\n**Solution:**\nVim has a replace mode that\
    \ you can access with `R`. When in the Replace mode, Vim replaces the existing\
    \ character with each character you type.\n\nYou can also use the virtual replace\
    \ mode with `gR`. This command is similar to `R`, except when you press `<Tab>`,\
    \ it will replace multiple characters (as opposed to only one character in replace\
    \ mode).\n\n## Using a Command-Line Command As a Motion to an Operator\n\n**Problem:**\n\
    There is not really a problem, but it’s neat to know.\n\n**Solution:**\nIn Vim,\
    \ you can use `:` as a motion to an operator. In the context of Vim grammar verb\
    \ + noun, the `:cmd` can act as a noun for a verb.\n\n* To delete from the current\
    \ position to the first match of “b”: `d:call search(\"b\")`.\n* To delete from\
    \ the current position to line 10: `d:10`.\n\nThe examples above look like a lot\
    \ of work just to do a simple task and you’re probably wondering when you will\
    \ ever need this. The truth is, I haven’t spent a lot of time on this revelation.\n\
    \nHowever, if you have an arsenal of Vimscript functions that can move your cursor\
    \ based on a complex pattern, like `d:call FindWordsIn(\"Spanish\")`, `d:call\
    \ FindEnglishAdjectives()`, etc, this can be a useful feature. Also keep in mind\
    \ that you can use it with any terminal command (`d:!{some_command}`).Maybe someone\
    \ will figure out a way to use this effectively.\n\n## Force Motion\n\n**Problem:**\n\
    You need to run an operator on columns.\n\n**Solution:**\nYou can force a motion\
    \ to be line-wise, character-wise, or block-wise, like the visual mode.\n\nIn\
    \ this case, if you need to run the delete operator on the three columns containing\
    \ 0s:\n\n```\nbr0eakfast\nlu0nch\ndi0nner\n```\n"
