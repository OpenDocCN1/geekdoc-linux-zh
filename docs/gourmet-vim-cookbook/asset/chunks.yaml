    ## Guide


    1. [Begin Reading](#chap00.xhtml)


    # First things


    ## What is this book?


    Text editing is an art.


    When programming, we write re-usable codes. Why should it be any different with
    text editing?


    The Gourmet Vim explores the art of efficient text editing using Vim, with 200+
    practical examples. When learning a new skill, examples are indispensable, having
    numerous examples will solidify these concepts more effectively.


    This book is full of tips and tricks on how to do common (and some uncommon) actions
    in Vim that you can practice immediately. It will give you a jump start to use
    Vim like a pro (even if you’re already one, there is always something new that
    you can learn).


    When you’re done reading this, you’ll be better at Vim than ever before.


    ## Some naming conventions


    Here I refer to commands starting with `:` as “command-line commands”. Other literatures
    may refer to them as “Ex commands”. If you wonder if they are different, they
    are the same thing.


    Here I refer to the terminal commands when accessed from inside Vim as “external
    commands”. You may hear them referred to on the internet as “filter command” or
    “bang operator”. Again, these are all referring to the same thing.


    ## Where are the Vimscripts?


    Some tips in this book utilize Vimscript (Vim’s built-in scripting language).
    However, you will find that there is no dedicated section for Vimscript. This
    is because this book is intended to be mainly for practical Vim uses.


    Including a dedicated Vimscript section will expand the scope of this book exponentially
    because now we are dealing with a whole programming language. However, if you
    want to learn Vimscript basics, check out my other work [Learn-Vim](https://github.com/iggredible/Learn-Vim).


    ## Why did you organize this book this way?


    In the beginning, I planned to write a giant monolithic cookbook (I actually did).
    But it was hard to search for things. So I decided to split them into different
    categories.


    The recipes are organized loosely under different categories. Expect some overlaps.


    ## How to read this book?


    You can read the recipes in any order. They are completely independent.


    This is a practical book. To become good in Vim you need to develop your muscle
    memory, not head knowledge. You don’t learn how to cook by only reading cookbooks.
    You learn how to cook by actually cooking foods.


    You need to type along with every command you see in each recipe. Repeat them
    several times. Try different variations. Read the `:help` page for that command.
    Understand the bigger picture. Your goal is to be able to execute that command
    naturally and instinctively.


    Learn the concepts, not the commands.


    # Navigation


    ## Basic Navigations


    **Problem:**


    There are too many commands to remember for moving around in Vim.


    **Solution:**


    You don’t need to learn all Vim navigation keys. You just need to remember a few
    important ones to move comfortably.


    A few commands I suggest you to commit to memory if you are just starting out:


    * `h/j/k/l` - left / down / up / right.

    * `w/e/b` - forward to the start of the next word / forward to the end of the
    next word / backward to the beginning of the previous word.

    * `{/}` - previous / next paragraph.

    * `gg/G` - start of the file / end of the file.


    That’s all. Less than a dozen keys. You can learn more navigation keys as you
    progress.


    ## Toggle Between Files


    **Problem:**


    You need to quickly return to the previous file.


    **Solution:**


    Use `Ctrl-^` to toggle between the current file and the previously edited file.


    When you pass a number to `Ctlr-^`, Vim will go to that buffer number in your
    buffer list. If you have 5 buffers opened and you run:


    * `5 Ctrl-^`, Vim will go to buffer number 5.

    * `2 Ctrl-^`, Vim will go to buffer number 2.


    You can also use `Ctrl-I` and `Ctrl-O` to quickly go to the next and previous
    cursor location in the jump list.


    Vim remembers where you have jumped and stores that in a jump list (`:jumps`).
    `Ctrl-I` and `Ctrl-O` let you to navigate up and down that list. This is useful
    for tracing your steps.


    A jump is typically a movement that moves your cursor for more than one line (`h/j/k/l`
    aren’t jumps but `{/}` are).


    ## Navigating Parentheses, Brackets, and Braces


    **Problem:**


    You are lost in a jungle of parentheses.


    **Solution:**


    Use `%` to go to a matching parentheses / brackets / braces (`( ) [ ] { }`).


    If you have expressions like `(lambda (y) ((lambda (x) (* x y)) 3))`, you can
    quickly navigate to the other end of the parentheses with `%`.


    ## Go to a Different Line


    **Problem:**


    You need to go to a different line number in the file.


    **Solution:**


    Vim has different line operators to go to different lines.


    * You can go to line number n with `:n` or `nG`. If you need to go to line 10,
    run `:10` or `10G`.

    * If you pass a count to `%`, it is now a line operator. `50%` jumps to the middle
    file. `67%` jumps to the 2/3 position of the file.


    ## Same-Line Navigation


    **Problem:**


    You need to go to a different column in the same line.


    **Solution:**


    * Use `f` and `t` for a forward and backward in-line search. To go to the next
    “a” in the current line, run `fa`. To go until the next “b”, run `tb`. To repeat
    this search, use `;` to search forward and `,` to search backward.

    * Use `0` and `$` to go to the beginning and the end of the line. You can also
    go to the first character of a wrapped line with `g0` and to the last character
    of a wrapped line with `g$`. To wrap lines, run `set wrap`.

    * Use `^` and `g_` to go to the first non-blank and last non-blank of the line.

    * Use `n|` to go to the column number n of the current line. `10|` takes you to
    the 10th column.


    ## Screen Adjust


    **Problem:**


    You need to center your cursor to the center of the screen.


    **Solution:**


    * Use `H M L` to put the cursor at the top, middle, or lower part of the screen.

    * Use `zb`, `zz`, and `zt` to move the current line to the bottom, center, or
    top of the screen.


    ## Scroll


    **Problem:**


    You can’t use mouse in Vim, hence you can’t scroll.


    **Solution:**


    Vim lets you use `Ctrl-E / D / F` and `Ctrl-Y / U / B` to scroll up or down a
    line / half a screen / a whole screen.


    ## Go to the Last…


    **Problem:**


    You just did an action and you wanted to go back to the location where you did
    that action.


    **Solution:**


    Vim remembers many actions you did. You can quickly go back to the location where
    you did that action with marks.


    Vim marks can record positions. There are two different mark specificities: line
    marks (less accurate) and location marks (more accurate).


    A line mark uses a single quote, like `''m` (where m is the mark symbol) and a
    location mark uses a single backtick, like ``` `m``. A line mark will only take
    you to the correct row. A location mark will take you to the correct row and column.
    In the following examples, I will only use the line mark, but remember that for
    each line mark, there is a location mark counterpart.


    Use `''[` or `'']` to go to the start or end of a recently changed or yanked text.


    If you recently ran `yj` on the following phrase:


    ```

    I am a phrase


    I am another phrase

    ```

