- fmt: "\nExplanation:\n\n- To match the “donut” in “chocodonut”, run `/choco\\zsdonut`.\n\
    - To match the “choco” in “chocodonut”, run `/choco\\zedonut`.\n- To match “do”\
    \ in “sugardonut”, run `/sugar\\zsdo\\zenut`.\n\n## Search for the Nth Occurrence\
    \ in a Line\n\n**Problem:**\nYou need to search for every 2nd occurrence on each\
    \ line.\n\n**Solution:**\nRunning `/\\(.\\{-}\\zsdonut\\)\\{2\\}` will match every\
    \ second “donut” occurrences (with very magic: `/\\v(.{-}\\zsdonut){2}`)\n\n```\n\
    Chocolate donut, blueberry donut, raspberry donut\n```\n\n## Search for Any Text\
    \ Surrounded by a Particular Pattern\n\n**Problem:**\nYou need to search for any\
    \ text, any length, that is surrounded by a pair of double-quotes.\n\n**Solution:**\n\
    To search for any text that is surrounded by a pair of double-quotes, use `/\"\
    [^\"]*\"`.\n\nThis pattern is useful to search for a body of text surrounded by\
    \ a character.\n\n- To search for any text surrounded by a pair of single quotes,\
    \ use `/'[^']*'`.\n- To search for any text surrounded by a pair of commas, use\
    \ `/,[^,]*'`.\n\nThe collection syntax, `[]`, when you add a caret (`^`) means\
    \ character negation. `[^\"]*` means zero or more any non-double-quote character.\
    \ `[^']` means any non-single-quote character.\n\n## Repeat the Last Search\n\n\
    **Problem:**\nYou want to repeat the last search.\n\n**Solution:**\nTo repeat\
    \ the last search, use `//` or `??`. You can also run an empty search `/<Enter>`\
    \ or `?<Enter>` to use the last search.\n\n## Force a Case-Sensitive Search\n\n\
    **Problem:**\nYou have `ignorecase` and `smartcase` options and you need to specifically\
    \ search for a lowercase word.\n\n**Solution:**\nAdding `\\C` to the keyword forces\
    \ a case-sensitive search.\n\nThis is useful if you have `ignorecase` and `smartcase`\
    \ settings because Vim will do a case insensitive search if you do `/donut`. However,\
    \ `/donut\\C` will explicitly match for “donut” and not “Donut” or “DONUT”.\n\n\
    ## Optional Search\n\n**Problem:**\nYou need to search for optional phrases in\
    \ a word.\n\n**Solution:**\nThe `\\=` modifier makes the preceding character optional.\n\
    \nIf you have the string “hero”, “heroes”, and “heros”, `/hero\\(es\\)\\=` will\
    \ match “hero” and “heroes” (the suffix “es” is optional). While `/heros\\=` will\
    \ match “hero” and “heros” (the suffix “s” is optional).\n\n## Search a Phrase\
    \ in Multiple Files With Vimgrep\n\n**Problem:**\nYou need to search for “food”\
    \ inside multiple files.\n\n**Solution:**\nVim has a built-in grep to search in\
    \ files named `:vim` (you read that right, this command is called `vim`, short\
    \ for `:vimgrep`).\n\nTo search for “food” in all Javascript files recursively,\
    \ run `:vimgrep /food/ **/*.js`. To search for “food” in all Javascript files\
    \ in the current directory, run `:vimgrep /food/ *.js`.\n\nVimgrep uses quickfix\
    \ (`:h quickfix`). Use `:copen` to display the results.\n\nAlternatively, you\
    \ can also use the terminal grep program. Vim has a `:grep` command that uses\
    \ whatever command is assigned to the `'grepprg'` option (by default, it uses\
    \ the terminal grep). To search for “donut” in the current directory, run `:grep\
    \ \"donut\" . -R`.\n\n## Adding Matches to an Existing Quickfix List\n\n**Problem:**\n\
    You did a search with vimgrep and you need to add more items to the result.\n\n\
    **Solution:**\nVimgrep has an append version: `:vimgrepa`.\n\nIf you run `:vimgrep\
    \ /breakfast/ **/*.js` followed by `:vimgrep /lunch/ **/*.js`, the second vimgrep\
    \ search overwrites the first one. That’s not good.\n\nTo add the search results,\
    \ first run `:vimgrep /breakfast/**/*.js`, then run `:vimgrepa /lunch/ **/*.js`.\
    \ Now you have a list of both “breakfast” and “lunch” searches.\n\n## Alias for\
    \ Digits and Words\n\n**Problem:**\nTyping `[0-9]` is too verbose. Is there a\
    \ shorter alias?\n\n**Solution:**\nVim has predefined characters to help with\
    \ search. `\\d` is an alias for digits `[0-9]`. To search for a digit followed\
    \ by “foo”, run `/\\dfoo`. This will match “1foo”, “2foo”.\n\nSimilarly, `\\w`\
    \ is an alias for a “word” character `[0-9A-Za-z_]`. To search for the number\
    \ 0 followed by any two word characters like “0ab” or “0a1” or “0_1”, run `/0\\\
    w\\w`.\n\n## More Predefined Characters\n\n**Problem:**\nYou wonder if there are\
    \ more useful aliases like `\\d` and `\\w`.\n\n**Solution:**\nThe next 5 useful\
    \ character aliases (in my opinion), are:\n\n```\n\\s    Whitespace character\
    \ (space and tab)\n\\S    Non-whitespace character (everything except space and\
    \ tab)\n\\w    Word character [0-9A-Za-z_]\n\\l    Lowercase alphas [a-z]\n\\\
    u    Uppercase character [A-Z]\n```\n\nIf you want to see the whole list, check\
    \ out `:h /character-classes`.\n\n## Quickly Search for the Word Under the Cursor\n\
    \n**Problem:**\nYou want to quickly search for the word your cursor is on.\n\n\
    **Solution:**\nUse `*` and `#` to search for the word under the cursor forward\
    \ and backward. If your cursor is on the word “donut”, if you press `*`, Vim does\
    \ `/\\<donut\\>`. `\\<` and `\\>` means the beginning and end of a word. It matches\
    \ “chocolate donut” but not “chocolatedonut”.\n\nTo match the latter, use `g*`\
    \ and `g#`. These commands are similar to `*` and `#`, but instead of treating\
    \ the word under the cursor as a whole word, Vim treats it as a string pattern.\
    \ If your cursor is on the word “donut” and you press `g*`, Vim does `/donut`.\
    \ It matches “glazed donut”, “donuts”, “donutman”, etc.\n\n## Finding a File\n\
    \n**Problem:**\nYou need to search and open a file.\n\n**Solution:**\nAt the very\
    \ core, you can open a file in Vim with `:e yourfile.txt`. Vim also has the `:find`\
    \ command. When you open a file with either `:e` or `:find`, you can use `<Tab>`\
    \ to autocomplete the directory and/or file name. Try it yourself: go to the directory\
    \ with several files and press `:e` then `<Tab>`. You’ll find that Vim tries to\
    \ autocomplete the name.\n\nYou may wonder, what’s the difference between `:edit`\
    \ and `:find`? The difference is that `:find` finds file in a path while edit\
    \ doesn’t.\n\nTo check what your paths are, run:\n\n```\n:set path?\n```\n\nBy\
    \ default, yours probably look like this: `path=.,/usr/include,,`. The big picture\
    \ here is that you can edit your path so you can find files faster.\n\nSuppose\
    \ that this is your project structure:\n\n```\napp/\n  assets/\n  controllers/\n\
    \    application_controller.rb\n    comments_controller.rb\n    users_controller.rb\n\
    \    ...\n```\n\nThe above is an example of a Rails project structure. To go to\
    \ the `users_controller.rb` from the root directory, you have to go through several\
    \ directories and pressing a considerable amount of tabs. You have to do something\
    \ like `:find a<Tab>c<Tab>u<Tab>` before finally getting to `app/controllers/users_controller.rb`.\n\
    \nLet’s create a shortcut for the `controllers/` directory by adding the controller\
    \ path to the current `'path'`. Run:\n\n```\n:set path+=app/controllers/\n```\n"
