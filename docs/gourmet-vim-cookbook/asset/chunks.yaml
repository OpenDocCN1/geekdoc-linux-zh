    \ all vim related files including vimrc, add this at the start of your vimrc:\n\
    \n```\n\naugroup filetype_vim\n\n  autocmd!\n\n  autocmd FileType vim setlocal\
    \ foldmethod=marker\n\naugroup END\n\n```\n\nYou can now organize your vimrc based\
    \ on categories, like:\n\n```\n\n\" Plugins {{{\n\ncall plug#begin('~/.vim/plugged')\n\
    \n  your plugin here\n\ncall plug#end()\n\n\" }}}\n\n\" Setups {{{\n\nset relativenumber\
    \ number\n\nset ignorecase smartcase\n\nmore setup here\n\n\" }}}\n\n\" Functions\
    \ {{{\n\nfunction! SomeUsefulFunction()\n\n  dosomething\n\nendfunction"
