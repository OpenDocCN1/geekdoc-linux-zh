    # 将当前文件保存到不同目录


    **问题：**

    你需要将当前文件以相同的名称保存到另一个目录。


    **解决方案：**

    要快速将当前文件以相同名称保存到不同的目录，请运行 `:w a/different/directory/%`（记住 `%` 是 Vim 中表示当前文件的特殊变量）。


    ## 在 Vim 中打开手册


    **问题：**

    你需要快速搜索光标下单词的 man page（帮助手册）定义。


    **解决方案：**

    使用 `K` 可以快速打开光标下单词的帮助。


    ## 退出 Vim


    **问题：**

    你无法退出 Vim。


    **解决方案：**

    这是一个经典的 Vim 问题。事实是，有很多方法可以退出 Vim。


    标准方法：


    ```

    :q

    :wq

    :q!

    :qa

    :qa!

    ```


    “我知道大多数人不知道的命令”方法：


    ```

    :x

    :xa

    :quita

    :exit

    :conf wqa

    ```


    普通模式方法：


    ```

    ZZ

    ZQ

    ```


    “我享受痛苦和折磨”方法：


    ```

    :!ps ax | grep vim | grep -v grep | awk ''{print $1}'' | xargs kill -9

    ```


    最后，暴力法：


    ```

    拔掉电脑电源。滋滋。

    ```


    ## 查看最近打开的文件


    **问题：**

    你需要跳转到最近编辑过的文件。


    **解决方案：**

    Vim 有 `:oldfiles` 可以按时间顺序显示你过去编辑过的文件。


    结合 `:browse` 使用可以浏览并选择一个最近打开的文件（`:browse oldfiles`）。


    ## 切换目录


    **问题：**

    你需要更改当前目录。


    **解决方案：**

    你可以通过 `:cd {path}` 在 Vim 中更改目录。


    *   你可以使用 `:cd -` 返回上一个目录。

    *   你可以使用 `:cd some/other/dir/` 进入不同的目录。


    你还可以通过 `:pwd` 打印当前目录的名称。


    ## 在打开文件时执行命令


    **问题：**

    你需要在打开文件时用某些 Vim 命令对其修改。


    **解决方案：**

    你可以在使用 `:edit` 打开文件时通过 `+{cmd}` 传递命令。


    要在打开 `breakfast.txt` 时将所有的 “toast” 替换为 “bagel”，请运行 `:edit +%s/toast/bagel/g breakfast.txt`。


    ## 获取当前文件信息


    **问题：**

    你需要获取当前文件名到剪贴板。


    **解决方案：**

    你可以通过 `:let @*=expand("%")` 将当前文件名复制到剪贴板。


    解释：


    *   `@*` 是剪贴板寄存器之一。

    *   `=expand("%")` 获取当前文件名


    如果你经常使用它，请在 vimrc 中添加此映射：


    ```

    nnoremap <Leader>cf :let @*=expand("%")<CR>

    ```


    你可以对 `%` 当前文件模式添加各种修饰符。一些实用的包括：


    ```

    %:p (全路径)

    %:. (相对于当前目录)

    %:h (文件目录)

    %:t (文件名)

    %:e (文件扩展名)

    ```


    ## 统计单词数


    **问题：**

    你需要统计当前文件的单词数。


    **解决方案：**

    你可以使用 `g Ctrl-G` 统计单词。它会返回类似的内容：


    ```

    Col 1 of 0; Line 141 of 157; Word 748 of 774; Byte 4489 of 4976

    ```


    你也可以使用可视选择来指定文本块。高亮一段文本，然后按 `g Ctrl-G`。


    ```

    Selected 5 of 293 Lines; 70 of 1884 Words; 359 of 10928 Bytes

    ```


    或者，你可以使用 `:s` 命令和 `gn` 标志统计特定关键词的出现次数：


    *   统计字符：`:%s/./&/gn`

    *   统计空行：`:%s/^$/&/gn`

    *   统计特定单词 “donut”：`:%s/\<donut\>/&/gn`


    ## 删除文件


    **问题：**

    你需要删除一个文件。


    **解决方案：**

    你可以使用 `delete()` 函数在 Vim 中删除文件。运行 `:call delete(expand(''%''))` 或 `:call delete(@%)`
    来删除当前文件。


    然而，这仍然会将已删除的文件留在当前缓冲区中。添加 `:bdelete!` 来删除当前缓冲区。


    更完整的命令：


    ```

    :call delete(@%) | bdelete!

    ```


    ## 更简洁的保存并退出方法


    **问题：**

    输入 `:wq` 保存并退出很麻烦。有没有更短的方法？


    **解决方案：**

    与其用 `:wq` 保存文件，使用 `:x` 可以少输入 33%。


    `:x` 命令将：


    *   如果有未保存的更改则保存并关闭缓冲区，或者

    *   如果没有未保存的更改则直接关闭缓冲区。


    ## 挂起 Vim


    **问题：**

    你需要挂起 Vim。


    **解决方案：**

    你可以通过 `:stop` 或 `:suspend` 挂起 Vim。你也可以在 Vim 内部随时按 `Ctrl-Z`。


    返回需要在终端运行 `fg`。


    ## 编译


    **问题：**

    你需要从 Vim 编译。


    **解决方案：**

    Vim 有一个 `:make` 命令，类似于 `make` 程序。事实上，`:make` 程序使用由 `''makeprg''` 定义的命令，默认使用 `make`。


    ## 持久化本地配置


    **问题：**

    你需要持久化某些设置。


    **解决方案：**

    有时你离开 Vim 时打开了多个窗口、创建了折叠并打开了缓冲区，你希望保留它们，以便返回时一切看起来如初。


    你可以通过 Vim 做到这一点。……View 不保存你的布局，但 Session 会。


    Session 保存的属性在 `options` 中……可以它。


    要保存会话，运行 `:mksession`。这会在项目根目录下创建一个 `Session.vim` 文件。顺便说，如果你想将会话保存在其他地方，可以传递新路径。


    要打开之前保存的会话，运行 `vim -S Session.vim` 或你可以在 Vim 中运行 `:source Session.vim`。


    ## 跳转


    **问题：**

    你需要快速跳转到去过的地方。


    **解决方案：**


    在 Vim 中的操作会被视为跳转。Vim 会记住这些跳转并将它们存储在跳转列表中。


    使用 `:jumps` 查看跳转列表。跳转列表显示了你最近跳转的地方。你可以使用 `Ctrl-O` 和 `Ctrl-I` 在跳转列表中移动。


    Vim 将以下命令视为跳转命令：


    ```

    ''       跳转到标记行

    `       跳转到标记位置

    G       跳转到行尾

    /       向后搜索

    ```


    '
- fmt: '

    - `?`: Search backward

    - `n`: Repeat the last search, same direction

    - `N`: Repeat the last search, opposite direction

    - `%`: Find match

    - `(`: Go to the last sentence

    - `)`: Go to the next sentence

    - `{`: Go to the last paragraph

    - `}`: Go to the next paragraph

    - `L`: Go to the last line of displayed window

    - `M`: Go to the middle line of displayed window

    - `H`: Go to the top line of displayed window

    - `[[`: Go to the previous section

    - `]]`: Go to the next section

    - `:s`: Substitute

    - `:tag`: Jump to tag definition


    Try this: move around with jump movements, then press `Ctrl-O` and `Ctrl-I` a
    few times. `Ctrl-O` and `Ctrl-I` are two of my favorite commands.


    ## Trace Edited Texts


    ### Problem

    You need to trace some texts you recently edited.


    ### Solution

    Vim tracks the locations of your recently edited texts. You can view them with
    `:changes`.


    You can go up and down this list with `g;` and `g,`. Vim makes it easy to trace
    recently changed texts.


    ## Search History


    ### Problem

    You need to search the previous searches.


    ### Solution

    Sometimes you need to re-search a keyword but you can’t quite remember what the
    keyword was exactly. `q/` and `g?` can help you. They can show the history of
    previous searches.


    Typing `q/` or `q?` show all the `/` or `?` searches you’ve done. It will open
    a new window that you can navigate around. If you press `<Enter>` on one of the
    keywords, Vim will do a search using that word.


    ## Command-Line History


    ### Problem

    You need to run a command similar to a command you executed before.


    ### Solution

    `q:` shows the history of the command-line commands.


    If you press `q:`, Vim will take you to a history window with a list of command-line
    commands you have used. Regular Vim navigation works here. If you press `<Enter>`
    on a command, Vim will execute that command.


    If in the past you ran `:s/strawberryhoneypancakes/kale/g` and you want to run
    `:s/strawberryhoneywaffles/kale/g`, instead of retyping the commands all over,
    why not find that command from the command history, modify it slightly, and then
    execute it?


    Press `q:`, find that command in history, then edit it. Once you’re done, run
    it.


    The great thing about these histories (`q:`, `q/`, `q?`) is that you can use Vim
    navigation, making navigation in this mode very easy.


    Another way to enter the command-line history is while you’re in the command-line
    mode (`:`), press `Ctrl-F`. This also works with `/` and `?`. During the `/` or
    `?` search, type `Ctrl-F` to open the search history window.


    ## Vim Histories


    ### Problem

    You want to know what other things Vim store.


    ### Solution

    Vim stores 5 different histories


    ```

    :his c or :       - command-line history (q:)

    :his s or / or ?  - search history (q/ or q?)

    :his e or =       - expression history

    :his i or @       - input history

    :his d or >       - debug history

    ```


    # Insert Mode


    ## Entering Insert Mode


    ### Problem

    You need to go to the insert mode.


    ### Solution

    There are many ways to enter the insert mode. The most common ones are:


    ```

    i    Insert text before the cursor

    I    Insert text before the first non-blank character of the line

    a    Append text after the cursor

    A    Append text at the end of line

    o    Starts a new line below the cursor and insert text

    O    Starts a new line above the cursor and insert text

    ```


    If you’re new to Vim, don’t memorize them all. Start with `i` first. Then commit
    `a` and `o` to memory. Finally, you can commit their uppercase counterparts.


    ## Different Ways to Exit Insert Mode


    ### Problem

    Your keyboard doesn’t have an `<Esc>` key and you need to quickly exit insert
    mode.


    ### Solution

    Normally (pun intended) you can exit the insert mode with `<Esc>`. However, not
    all keyboards have the `<Esc>` key (like tablet keyboards). You can use either
    `Ctrl-[` or `Ctrl-C` to escape in addition to `<Esc>`.


    Alternatively, you can create a mapping to escape while in the insert mode:


    ```

    inoremap jk <Esc>

    ```


    I find that the `<Esc>` button is too far, so I map the `<Caps-lock>` button to
    `<Esc>`. If you search for Bill Joy’s ADM-3A keyboard (the Vi creator), you will
    see that his `<Esc>` key is not located on the far top left like modern keyboards
    but to the left of `q` key. This is why I think it makes sense to map `<Caps lock>`
    to `<Esc>`.


    ## Paste a Recently Yanked Text


    ### Problem

    You need to paste a previously yanked text.


    ### Solution

    If you need to paste a text while in the insert mode, you could first quit the
    insert mode then paste it with `p`, but that is mode-switching. A better way to
    paste text while in insert mode is to use `Ctrl-R 0`. Doing `Ctrl-R` while in
    the insert mode lets you to insert the content of a register. `0` is the yank
    register.


    You can insert from any other registers as well. If you need to paste the content
    from a register, run `Ctrl-R a`.


    ## Performing a Quick Calculation


    ### Problem

    You need to do a quick calculation and insert the result.


    ### Solution

    To do a quick calculation in the insert mode, you can use `Ctrl-R` to use the
    expression `=`.


    For example: `Ctrl-R =1+1<Enter>`.


    ## Autocompletion


    ### Problem

    You need to autocomplete a word.


    ### Solution

    The insert mode has built-in autocompletions.


    While in the Insert mode, use `Ctrl-P` for word completion. By pressing `Ctrl-P`
    in the insert mode, Vim searches backward for existing words that start with the
    text under the cursor (press `Ctrl-N` for forward search).


    There are other auto-completions. Some of the common ones are:


    *   `Ctrl-X Ctrl-L` for a line autocompletion.

    *   `Ctrl-X Ctrl-F` for a filename autocompletion.

    *   `Ctrl-X Ctrl-K` for a dictionary autocompletion. Note: this method requires
    you to set the `''dictionary''` first. Assuming there is a dictionary in `/usr/share/dict/words`
    (your computer should have some sort of dictionary path somewhere), add that path
    into the dictionary using `set dictionary=/usr/share/dict/words`.


    For more, check out `:h ins-completion`.


    ## Executing a Normal Mode Command While the Insert Mode


    ### Problem

    You need to execute a normal-mode command without exiting insert mode.


    ### Solution

    You can execute a normal mode command while in the insert mode with `Ctrl-O`.


    For example:


    *   `Ctrl-O zz` to center the screen.

    *   `Ctrl-O /food` to jump to the next “food”.


    ## Larger Deletes


    ### Problem

    You need to delete text chunks.


    ### Solution

    *   Press `Ctrl-U` to delete the entire line.

    *   Press `Ctrl-W` to delete the word before the cursor.


    Meanwhile, `D` in normal mode deletes to the end of the line, but there is no
    insert mode command that does that, so why not create one?


    Add the following mapping:


    ```

    inoremap <C-d> <C-O>D

    ```

    '
  raw: '?       Search backward


    n       Repeat the last search, same direction


    N       Repeat the last search, opposite direction


    %       Find match


    (       Go to the last sentence


    )       Go to the next sentence


    {       Go to the last paragraph


    }       Go to the next paragraph


    L       Go to the the last line of displayed window


    M       Go to the middle line of displayed window


    H       Go to the top line of displayed window


    [[      Go to the previous section


    ]]      Go to the next section


    :s      Substitute


    :tag    Jump to tag definition


    ```


    Try this: move around with jump movements, then press `Ctrl-O` and `Ctrl-I` a
    few times. `Ctrl-O` and `Ctrl-I` are two of my favorite commands.


