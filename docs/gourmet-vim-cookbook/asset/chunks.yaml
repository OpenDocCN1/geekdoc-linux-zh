  trans: "\n\n## 水平生成数字\n\n**问题：**\n你需要在同一行内生成数字序列。\n\n**解决方案：**\n要水平生成生成数字，请使用 `put`\
    \ 和 `join`。\n\n* `:put=join([1,2,3,4], \\\" - \\\")` 生成 `1 - 2 - 3 - 4`。\n* `:put=join(range(1,10),\
    \ \\\"', '\\\")` 生成 `1’, ‘2’, ‘3’, ‘4’, … ‘10`（它不会生成第一个和最后一个单引号，你可以手动添加它们）。\n\n\
    ## 根据行号将文本转换为数字的列表\n\n**问题：**\n你想根据行号将文本转换为编号列表。\n\n**解决方案：**\n若要在多行上创建编号列表，请运行\
    \ `:%s/^/\\=printf('%-2s', line('.'))`。\n\n如果你有如下从第 1 行开始的文本：\n\n```\nBreakfast\
    \ is good\n\nBut lunch is better\n\nDinner is still the best\n```\n\n运行 `:%s/^/\\\
    =printf(\"%-2s\", line(\".\"))` 即可获得：\n\n```\n1 Breakfast is good\n2 But lunch\
    \ is better\n3 Dinner is still the best\n```\n\n命令拆解：\n\n* `^` 代表行首。\n* `\\=`\
    \ 允许在替换中使用 Vimscript 表达式。\n* `printf('%-2s')` 打印带空格的字符串（-2 是宽度，左对齐）。\n* `line('.')`\
    \ 是当前行号。\n\n# 文本操作\n\n## 如何使用 Vim\n\n**问题：**\n你难以记住数以万计的 Vim 命令。\n\n**解决方案：**\n\
    不要尝试记住每一个命令。相反，将它们拆分为更小的部分。Vim 命令包含类似于语法的模式（我们称之为“Vim 语法”）来创建组合。\n\nVim 语法中有一个规则：\n\
    \n```\n动词 + 名词\n```\n\n操作符（operators）是动词，动作（motions）是名词。大多数操作都是遵循该规则完成。你只需要掌握少数操作键和导航键就能提高工作效率。\n\
    \n例如：\n\n* 删除下一个单词，运行 `dw`；动词 (`d`) + 名词 (`w`)。\n* 向左剪切两个字符，`y2h`；动词 (`y`) + 名词\
    \ (`2h`)。注意你可以在动作之前传递计数 (`2h`)。\n* 修改下一行，`cj`；动词 (`c`) + 名词 (`j`)。\n\n文本通常是结构化的。文件中存在“单词”、“段落”、“括号”等概念。Vim\
    \ 有一种名为“文本对象”（text objects）的抽象来处理这些结构。有两种不同的文本对象：内部对象（`i` + object）和外部对象（`a` +\
    \ object）。这看起来可能很复杂，但一旦你理解了它，就会非常简单且直观。\n\n文本对象是 Vim 语法规则“动词 + 名词”中的名词。你需要在文本对象之前传递一个操作符。\n\
    \n```javascript\nconst hello = function() {\n  console.log(\"Hello Vim\");\n \
    \ return true\n}\n```\n\n如果光标在“Hello”的“H”上：\n\n* 删除整个“Hello Vim”：`di(`。\n* 删除函数块（被\
    \ {} 包围的部分）：`di{`。\n* 删除字符串“Hello”：`diw`。\n\n如果你是 Vim 新手，你不需要记住几十个操作符。你可以先从记住这\
    \ 3 个开始：\n\n* `d`（删除）。\n* `c`（修改）。\n* `y`（剪切）。\n\n## 更改大小写\n\n**问题：**\n你需要更改文本的大小写。\n\
    \n**解决方案：**\n有多种方法可以更改文本的大小写。\n\n更改单个字符的大小写：\n\n* `~` 切换光标所在字符的大小写。如果光标在“donut”的“d”上，按下\
    \ `~` 会将其切换为大写字母。\n* `vu` 将光标所在字符转为小写。如果光标在“Donut”的“D”上，按下 `vu` 会将其转为“d”。\n* `vU`\
    \ 将光标所在字符转为大写。如果光标在“donut”的“d”上，按下 `vU` 会将其转为“D”。\n\n使用动作来更改大小写：\n\n* `g~ {motion}`\
    \ 切换动作指定文本的大小写。当与 `g` 结合时，`g~` 作为一个操作符。切换后两个单词的大小写，运行 `g~2w`。切换当前内部单词的大小写，运行 `g~iw`。\n\
    * `gu {motion}` 将动作指定的文本转为小写。将 `()` 内部文本转为小写，运行 `gui(`。\n* `gU {motion}` 将动作指定的文本转为大写。大写到文件末尾，运行\
    \ `gUG`。\n\n更改当前行的大小写：\n\n* 切换当前行的大小写，运行 `g~~`。\n* 将当前行转为小写，运行 `guu`。\n* 将当前行转为大写，运行\
    \ `gUU`。\n\n## 交换两个字符\n\n**问题：**\n你需要快速交换两个相邻字符。\n\n**解决方案：**\n我在编辑时经常犯这类类型错误：输入“teh”\
    \ 而不是“the”，“输入“cosnt” 而不是“const”等。修复双字符拼写错误简单的方法是使用 `xp`。\n\n`x` 删除光标下的字符，`p`\
    \ 粘贴最近删除的字符。\n\n## 替换模式\n\n**问题：**\n你需要用输入的字符替换原有字符。\n\n**解决方案：**\nVim 有一种替换模式（Replace\
    \ mode），可以通过 `R` 进入。在替换模式下，Vim 会用你输入的每个字符替换现有的字符。\n\n你也可以使用 `gR` 进入虚拟替换模式（virtual\
    \ replace mode）。该命令与 `R` ，但当你按下 `<Tab>` 时，它会替换多个字符（而替换模式下只替换一个字符）。\n\n## 将命令行命令作为操作符的动作\n\
    \n**问题：**\n这并不是什么真正的问题，但知道它很有用。\n\n**解决方案：**\n在 Vim 中，你可以使用 `:` 作为操作符的动作。在 Vim\
    \ 语法“动词 + 名词”的语境下，`:cmd` 可以作为动词的名词。\n\n* 从当前位置到“b”的第一个匹配项：`d:call search(\"b\"\
    )`。\n* 从当前位置到第 10 行：`d:10`。\n\n上面的示例看起来为了完成一个简单任务费了很大精力，你可能在想什么时候需要这个。事实是，我并没有花很多时间研究这个感悟。\n\
    \n然而，如果你有一系列 Vimscript 函数可以根据复杂的模式移动光标，例如 `d:call FindWordsIn(\"Spanish\")`, `d:call\
    \ FindEnglishAdjectives()` 等，这可能是一个非常有用的功能。还要记住你可以配合任何终端命令使用它（`d:!{some_command}`）。也许有人会发现有效使用它的方法。\n\
    \n## 强制动作 (Force Motion)\n\n**问题：**\n你需要在列运行操作符。\n\n**解决方案：**\n你可以强制动作按行、按字符或按块执行，就像可视模式一样。\n\
