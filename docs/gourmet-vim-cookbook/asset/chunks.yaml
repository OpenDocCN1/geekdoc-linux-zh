    Now when you type `:find u<Tab>`, Vim now searches inside `app/controllers/` for
    files starting with `u`. You’ve created a path shortcut for autocompletion! You
    can update the path with frequently-visited paths.


    # Search and Replace in Multiple Files


    **Problem:**

    You need to substitute texts in multiple files.


    **Solution:**

    You can use `:vimgrep` or `:grep` combined with `:cfdo` to do multiple-file substitution.


    Let’s say you want to replace all “pancake” with “waffle” inside all files.


    First, find all the instances of that word with `:grep "pancake" . -R` (you can
    also run `:vimgrep /pancake/ **`). Then run `:cfdo %s/pancake/waffle/g | update`.


    # Command-Line Mode


    ## Command Suggestion

    **Problem:**

    You want to see all the relevant commands.


    **Solution:**

    While you are in the command-line mode, press `Ctrl-D` for a list of relevant
    commands.


    If you type `:h fo`, then press `Ctrl-D`, Vim shows all relevant keywords containing
    the phrase “fo”.


    ## Get the Word Under the Cursor

    **Problem:**

    You want to get the word under the cursor to use it in your command.


    **Solution:**

    While in the command-line mode, you can get:


    * The filename under the cursor with `Ctrl-R Ctrl-F`.

    * The word under the cursor with `Ctrl-R Ctrl-W`.

    * The current line with `Ctrl-R Ctrl-L`.

    * The current file name with `Ctrl-R %`.


    ## Faster Delete

    **Problem:**

    Deleting one character at a time in the command-line mode takes forever.


    **Solution:**

    If you make a mistake typing a command-line command, you can delete faster with:


    ```

    Ctrl-H    Delete one character

    Ctrl-W    Delete one word

    Ctrl-U    Delete the entire line

    ```


    These are the same shortcuts as the insert mode.


    ## Are There More Commands?

    **Problem:**

    You want to learn what other commands Vim has.


    **Solution:**

    To get a list of all command-line commands, check out `:h ex-cmd-index`.


    # File


    ## Buffers, Windows, Tabs

    **Problem:**

    You heard that Vim uses buffers, windows, and tabs, but you’re not sure what they
    mean.


    **Solution:**

    Buffers, windows, and tabs are Vim’s approach to file and layout management. Many
    text editors only use two abstractions: windows and tabs.


    So what is this buffer? A buffer is an in-memory space for text. When you open
    a file in Vim, Vim opens a buffer to store that file data. When you open 3 files
    in Vim, you have 3 buffers opened.


    By the way, make sure you have the `set hidden` option in Vimrc. Without it, whenever
    you switch buffers and if your current buffer has unsaved changes, Vim complains
    and prompts you to save the file. This can slow you down.


    A window is a viewport on a buffer. From the outside, Vim windows look like most
    text editors’ windows. You can have multiple windows opened and arranged vertically
    and / or horizontally. Multiple windows can point to the same buffer. Remember,
    each buffer represents each opened file. You can have two windows opened and with
    both pointing to the same buffer, `file1.txt`. You can have only one window open
    but you actually have 3 opened buffers, `file1.txt`, `file2.txt`, and `file3.txt`.
    A window is what you use to see buffers. A buffer is the actual file.


    A tab is a collection of windows. Think of it like a layout for windows. In modern
    text editors, if you close a tab, the file in that tab goes away. Similarly, in
    a web browser, if you close a web page tab, that page is gone. In Vim, a tab does
    not represent an open file (remember, a buffer represents the actual file). You
    can close a tab with a window displaying `file1.txt`, but that file is still opened
    in the buffer behind the scene.


    In short:


    * A buffer is an in-memory space of a file.

    * A window is a viewport on a buffer.

    * Two windows can point to the same buffer or two windows can point to two different
    buffers.

    * A tab is a layout for windows.


    ## Two Different Write Commands With Similar Syntax

    **Problem:**

    You get two very different results running `:w !food` and `:w! food`. What’s the
    difference?


    **Solution:**

    `:w !food` and `:w! food` are actually two different commands (although their
    syntaxes are very similar).


    * `:w !food` executes the external command `food` (if if doesn’t exist, it throws
    an error) with your buffer content as the STDIN.

    * `:w! food` saves the current buffer as `food`.


    ## Save a File That Requires a Root Permission

    **Problem:**

    You need to save a file but you need to do it with a root permission


    **Solution:**

    Save the file that requires a root permission with `:w !sudo tee %`. This uses
    similar write syntax as above. Recall that `:w !cmd` executes the terminal command
    `cmd`. In this case, the command is `sudo tee`.


    `%` in Vim represents the current file.


    ## Time Travel

    **Problem:**

    You need to restore your file state to the state it was 15 minutes ago.


    **Solution:**

    You can go back to an earlier text state with `:earlier`. To go back to the text
    state 15 minutes ago, run `:earlier 15m`. This command accepts other units: `s`
    (seconds), `h` (hours), `d` (days), and `f` (number of saves).


    To go to a later state, there is a `:later` counterpart (I wish I could just run
    `:later 8h` and be done with my work, but that won’t work…).


    ## Converting the Current File to an HTML

    **Problem:**

    You want to convert the current file to a HTML, a la Vim.


    **Solution:**

    Vim has a `:%TOhtml` to convert the HTML version of the current document. It will
    generate a new file in the current directory `your_original_file_name.txt.html`.


    ## Open an URL Content

    **Problem:**

    You need to edit the content of a web page.


    **Solution:**

    You can fetch the content of an URL directly `vim https://www.google.com/`.


    ## Save a Partial File

    **Problem:**

    You need to save only parts of a file.


    **Solution:**

    You can save a partial file with `:{range1},{range2}w filename`. To save lines
    5 and 10 as `partial_stuff.txt`, run `:5,10w partial_stuff.txt`.


    ## Show the Buffers List

    **Problem:**

    You need to see which buffers are open.


    **Solution:**

    Vim has the commands `:ls`, `:buffers`, and `:files` to show the buffers list.


    Why use the buffer? Buffer is Vim’s approach to quickly go to different files
    quickly. Most text editors have only two abstractions: windows and tabs. Vim has
    three: buffers, windows, and tabs.


    Vim saves all the currently opened files in memory, in buffers. If you have `file1.txt`,
    `file2.txt`, and `file3.txt` opened, you have 3 buffers.


    There are different approaches to jump to a particular buffer:


    * Numerical approach: to go to buffer #9, run `:buf 9`.

    * Filename approach: to go to `file2.txt` buffer, run `:buf file2.txt`.

    * `:bnext` and `:bprevious` go to the next and previous buffer in the list.

    * `:brewind` goes to the first buffer in the buffer list (`:blast` goes to the
    last buffer - having a blast yet :D?).


    Finally, use `:bd file1.txt` to remove `file1.txt` from the buffer list.


    Buffer is a clever approach to file management when editing with Vim. It creates
    for you a list of shortcut files. I strongly recommend that you utilize buffers
    more in your daily Vim editing!


    ## Vim Tabs

    **Problem:**

    You need to open a different tab.


    **Solution:**

    Vim has a tab system to contain your window layouts. All buffers are shared between
    different tabs.


    Some useful tab navigations are:


    ```

    :tabnew file.txt    Open file.txt in a new tab

    :tabclose           Close the current tab

    :tabnext            Go to next tab

    :tabprevious        Go to previous tab

    :tablast            Go to last tab

    :tabfirst           Go to first tab

    ```


    By the way if you want to start Vim with multiple tabs, run this from the terminal:


    ```

    vim -p file1.txt file2.txt file3.txt

    ```

