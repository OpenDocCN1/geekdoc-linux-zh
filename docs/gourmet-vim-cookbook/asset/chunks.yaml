    ## 持久化撤销


    **问题：**

    每当你关闭并重新打开 Vim 时，你希望能够撤销关闭 Vim 前执行的最后操作。


    **解决方案：**

    撤销文件（undo file）允许你在关闭 Vim 后仍保留撤销历史；你可以使用 `:wundo` 创建撤销文件并使用 `:rundo` 加载它。


    编辑 `somefile.txt`，然后使用 `:wundo! somefile.undo` 创建撤销文件（你可以给它任何名称），然后关闭 Vim 并重新打开
    `somefile.txt`。运行 `:rundo somefile.undo` 来加载撤销文件。现在你可以从该文件中撤销，就像你从未退出过 Vim 一样。


    ## 分块撤销


    **问题：**

    在输入一个长段落后，执行撤销时，Vim 会删除整个段落，即使你只需要撤销最后一句。


    **解决方案：**

    Vim 的撤销是撤销上一次“更改”。你在插入模式下输入的所有文本都算作一次更改。你可以在每句话后退出插入模式，以创建更小的更改。


    或者，你可以使用 `Ctrl-G u` 创建一个撤销块，在不离开插入模式的情况下将更改拆分为更小的部分。方法如下：


    如果你输入 `ipancake breakfast<Esc>` 然后按 `u`，Vim 会撤销整个“pancake breakfast”。要添加一个断点，运行
    `ipancake <Ctrl-G u>breakfast<Esc>`。现在当你按 `u` 时，Vim 只会移除“breakfast”。


    ## 合并行


    **问题：**

    你需要将下一行合并到当前行。


    **解决方案：**

    如果你按下 `J`，Vim 将将当前行下方的行合并到当前行。Vim 在合并两行时会自动添加一个额外的空格，因此如果你不需要额外的空格，请使用 `gJ` 在不留空格的情况下合并两行。如果你处于视化模式下，可以使用
    `J` 合并所有高选的行。


    `:j`（`:join` 的缩写）是 `J` 的命令行版本。通过运行 `:j`，Vim 的行为将类似于 `J`。如果你想合并所有行，运行 `:%j`。


    ## 使用终端命令


    **问题：**

    你需要使用终端命令过滤你的文本。


    **解决方案：**

    Vim 有一个感叹号（`!`）运算符，可以通过外部命令过滤文本。


    例如，你有以下文本需要将其表格化并移除不包含“Ok”的行：


    ```

    Id|Name|Cuteness

    01|Puppy|Very

    02|Kitten|Ok

    03|Bunny|Ok

    ```


    你可以使用 `column` 终端命令和 `awk` 命令来实现这一点。只需运行：


    ```bash

    !}column -t -s "|" | awk ''NR > 1 && /Ok/ {print $0}''

    ```


    你将得到一个干净的过滤表格：


    ```

    02  Kitten  Ok

    03  Bunny   Ok

    ```


    这是 Vim 的亮功能之一，因为它允许你在 Vim 内部命令之外扩展使用外部命令，允许你组合更复杂的操作。


    # 终端


    ## Vi 模式


    **问题：**

    你想在终端中使用 Vi 键位绑定。


    **解决方案：**

    要在终端中设置 Vi 模式，运行 `set -o vi`（并非所有终端都支持，但大多数终端都支持）。


    现在当你按下 `<Esc>` 时，你将进入 Vi 普通模式。一些可用功能包括：


    *   行导航（`0`, `$`, `w` 等）。

    *   使用 `j` 和 `k` 遍历历史。

    *   使用 `?some command` 或 `/other command` 搜索命令历史，并后续使用 `n` 和 `N`。

    *   等等。


    ## 打开文件


    **问题：**

    你想快速打开多个文件。


    **解决方案：**

    你可以通过 `vim file1.txt file1.txt file3.txt` 同时打开多个文件。


    你可以使用 glob 在 Vim 中打开多个文件：


    *   运行 `vim *.js` 打开当前目录下所有的 Javascript 文件。

    *   运行 `vim **/*.js` 递归打开所有的 Javascript 文件。


    ## 使用 Vim 进行差异比较


    **问题：**

    你需要在两个或多个文件之间进行快速差异比较（diff）。


    **解决方案：**

    运行 `vimdiff file1.txt file2.txt` 使用 Vim 进行差异比较。或者，你也可以运行 `vim -d file1.txt file2.txt`。


    ## 不带插件或 Vimrc 运行 Vim


    **问题：**

    你需要在没有插件的情况下运行 Vim。


    **解决方案：**


    *   不带插件但带 vimrc 启动 Vim，运行 `vim --noplugin`。

    *   带插件但不带 vimrc 启动 Vim，运行 `vim -u NORC`。

    *   不带插件和 vimrc 启动 Vim，运行 `vim -u NONE`。


    这些在你需要调试 Vim 时非常有用。


    ## 作为另一个命令的结果，在 Vim 中打开文件


    **问题：**

    你需要将终端命令的输出传递给 Vim 以打开文件。


    **解决方案：**

    你可以运行 `vim` 后紧接 `$(command)`。一些用例包括：


    *   你可以打开所有的 `git status` 文件，运行 `vim $(git status --porcelain | awk ''{print $2}'')`。

    *   你可以用 `find` 命令的结果打开文件：`vim $(find . -name "my_file*.js)`。


    ## 以只读模式打开文件


    **问题：**

    你你需要在不修改文件的情况下打开文件。


    **解决方案：**

    `vim -R filename.txt` 以只读模式打开文件。这是 `less` 的良好替代方案。你可以享受 Vim 导航的好处，而无需担心意外编辑它。


    ## 使用垂直和水平分屏打开 Vim


    **问题：**

    你想在 Vim 中通过水平或垂直分屏打开多个文件。


    **解决方案：**


    *   你可以使用 `vim -O firstfile.txt secondfile.txt` 打开带有多个垂直分屏 Vim。

    *   你可以使用 `vim -o firstfile.txt secondfile.txt` 打开带有多个水平分屏 Vim。


    你还可以使用 `vim -on` 打开带有多个水平窗口的 Vim，使用 `vim -On` 打开多个垂直窗口，其中 n 是窗口数量。


    *   要打开具有 2 个水平窗口的 Vim，运行 `vim -o2`。

    *   要打开具有 3 个垂直窗口的 Vim，运行 `vim -O5`。


    ## 程序化生成新文件


    **问题：**

    你想在 Vim 中程序化地生成新文件。


    **解决方案：**

    你可以通过 `vim hello{1..10}.txt` 程序化地生成多个新缓冲区。


    ## 将文本作为 STDIN 传递给命令


    **问题：**

    你得到了一个文件，需要从文件中执行终端命令。


    **解决方案：**

    你可以利用 Vim 通过 `:%w !sh` 执行终端命令。Vim 将使用缓冲区中的文本并将其作为 STDIN 传递。


    如果你有以下文本：


    ```

    file1.txt

    file2.txt

    file3.txt

    ```


    *   运行 `:%s/\v(.+)(\.txt)/mv & \1\.md/g` 将每行从“testN.txt”更改为“mv testN.txt testN.md”。

    *   运行 `:%w !sh` 执行该指令。


    这有效地执行了 `mv file1.txt file1.md`、`mv file2.txt file2.md` 和 `mv file3.txt file3.md`。


    ## 在 Vim 中使用终端


    **问题：**

    大多数现代编辑器都有内置终端。你也想要一个。


    **解决方案：**

    Vim (8.1 及以上版本) 有终端模式，你可以通过 `:terminal` 命令访问它。


    更多信息，请查看 `:h terminal.txt`。


    ## 检查可用功能


    **问题：**

    你想查看你的 Vim 版本支持哪些功能。


    **解决方案：**

    你可以运行 `vim --version` 查看可用的版本。同样，你可以在 Vim 内部运行 `:version`。


    # 视化模式


    ## 视化模式基础


    **问题：**

    你不知道如何使用 Vim 的视化模式。


    **解决方案：**

    Vim 的视化模式类似于大多数文本编辑器中的高亮显示（你高亮一段文本，然后对高选的文本应用更改）。


    有三种不同的视化模式：


    *   `v` - 字符级视化模式

    *   `V` - 行级视化模式

    *   `Ctrl-V` - 块级视化模式。


    尝试一下吧！使用每不同的视化模式来感受。你可以使用 Vim 导航来扩展或收缩高选区域。要退出视化模式，按下 `<Esc>`。


    你还可以对高选的文本体执行操作。例如，如果你在高选文本体时按下 `d`，该文本体将被删除。


    ## 在多行中插入文本


    **问题：**

    你需要在多行中插入文本。


    **解决方案：**

    你可以使用块级视化模式 (`Ctrl-V`) 在多行中插入文本。


    如果你有：


    ```

    strawberry

    chocolate

    sugar

    ```


