    \ any digits with double quotes.\n\n**Solution:**\nGiven the following text:\n\
    \n```\n\nconst one = 1\n\nconst two = 2\n\nconst three = 3\n\nconst nope = \"\
    don't mind me\"\n\nconst four = 4\n\nconst five = 55\n\n```\n\nRun `:g/\\d\\+/s//\"\
    &\"/g` to get:\n\n```\n\nconst one = \"1\"\n\nconst two = \"2\"\n\nconst three\
    \ = \"3\"\n\nconst nope = \"don't mind me\"\n\nconst four = \"4\"\n\nconst five\
    \ = \"5\"\n\n```\n\nExplanation:\n\n*   The pattern `\\d\\+` matches one or more\
    \ digits.\n*   `s//` is a substitute command with a blank substitute pattern.\
    \ Recall that if you leave the search pattern blank, Vim will use the pattern\
    \ used by the global command.\n*   `\"&\"` is the substitute pattern. Recall that\
    \ `&` represents the entire match. `\"&\"` surrounds the entire match with double\
    \ quotes.\n\n## Changing the Delimiter\n\n**Problem:**\nYou got lost in the sea\
    \ of `/`.\n\n**Solution:**\nJust like you can change the delimiter of the substitute\
    \ command, you can also change the delimiter of the global command with any single-byte\
    \ characters.\n\nThis is a valid global command:\n\n```\n\n:g@console@d\n\n```\n\
    \nIf you are using a global command with the substitute command, you can do something\
    \ like this:\n\n```\n\ng@one@s+const+let+g\n\n```\n\nIt is easier to see which\
    \ part belongs to the global command and which belongs to the substitute command.\n\
    \n## Programmatic Global Command\n\n**Problem:**\nYou need to programmatically\
    \ run the global command.\n\n**Solution:**\nThe global command is very versatile.\
    \ You can enhance the global command with Vimscript.\n\nA few things of you can\
    \ do:\n\n*   Delete even lines with `:g/^/if line(\".\") % 2 != 0 | norm! d$`\n\
    *   Delete lines that are less than 3 char long with `:g/^/if strlen(getline(\"\
    .\")) < 3 | d`\n\n# Tags\n\n## What Are Tags?\n\n**Problem:**\nYou want to understand\
    \ about Vim’s tag system.\n\n**Solution:**\nIn many modern editors, you can click\
    \ on a function or class definition and it will take you to where that function\
    \ or class is defined. You can do that in Vim with tags. Although you can just\
    \ search for any definition with `grep`, `vimgrep`, or external libraries like\
    \ (`fzf.vim`), tags are the best tool for this kind of job.\n\nThink of a Vim\
    \ tag like an address book:\n\n```\n\nName    Address\n\nIggy1   123 Awesome St,\
    \ 12345\n\nIggy2   987 Incredible Ave, 98765\n\nIggy3   555 Handsome Rd, 55555"
