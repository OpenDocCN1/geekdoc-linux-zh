    `qagUUjq` 后，运行 `"ap`，你应该能看到打印出来的操作按键序列）。


    ## 深入了解 Vim 寄存器


    **问题：**

    你看到 Vim 有 10 个寄存器。你如何使用它们呢？


    **解决方案：**

    如上所述，Vim 有 10 个不同的寄存器。有些由 Vim 自动填充，而有些必须显式输入。


    无名寄存器存储你最后复制、修改或删除的文本。无名寄存器类似于计算机的标准复制/粘贴操作。要从无名寄存器中获取文本，执行 `""p`。粘贴命令 `p` 和 `P`
    会自动从无名寄存器中粘贴内容。


    数字寄存器有两种类型：0 寄存器和 1-9 寄存器。


    0 寄存器留用于复制寄存器（也称为 yank 寄存器）。如果你复制了一行，例如 `yy`，它将存储在寄存器 0 中。使用 `"0p` 粘贴它。


    1-9 寄存器留用于删除或修改。如果你删除一行（`dd`），被删除的文本将按时间顺序存储在从 1 到 9 的数字寄存器中。如果你执行了 3 次 `dd`，最近的删除将存储在寄存器
    1 中，第二次最近的删除存储在 2 中，第三次最近的存储在 3 中。要粘贴这些内容，请使用 `"1p`、`"2p"`、`"3p"` 等。


    小删除寄存器存储少于一行的删除或修改。如果你删除一个单词（如 `diw`），你可以通过 `"-p` 访问（寄存器 1-9 只存储长度至少一行的删除或修改）。


    命名寄存器可能是最常用的寄存器之一。它使用字符 a-z 来存储复制、修改或删除的文本。要将单词删除到寄存器 a，运行 `"adiw`。要粘贴它，运行 `"ap`。要将行的剩余部分复制到寄存器
    b，运行 `"by$`。要粘贴它，运行 `"bp`。


    只读寄存器由 Vim 自动处理。`.` 存储上一次插入的文本，`:` 存储上一次执行的命令行，`%` 存储当前文件名。


    备用文件寄存器存储备用文件的名称（你刚刚编辑的另一个文件）。


    表达式寄存器允许你评估 Vimscript 表达式。要计算表达式 1 + 1 的结果，运行 `=1+1<Enter>`，然后按 `p`。


    选择寄存器 `*` 和 `+` 用于将 Vim 连接到计算机剪贴板。默认情况下，如果你复制了某些内容（例如从网站复制的文本），无法立即将其粘贴到 Vim，反之亦然（如果你在
    Vim 中复制了内容，无法在 Vim 外粘贴）。要将系统剪贴板中的文本粘贴到 Vim，运行 `"+p` 或 `"*p`。`*` 和 `+` 寄存器的区别是历史性的。如果
    Vim 有 `+xterm_clipboard` 且你的机器使用 X11 的主选择，Vim 使用 `*` 寄存器。如果你的机器使用 X11 的剪贴板选择，Vim
    使用 `+`。坦率地说，不用担心。大多数时候，它们是可以通的。


    然而，我发现 `"*p` 粘贴和 `"*yy` 复制很麻烦。在 vimrc 中添加此内容：


    ```

    set clipboard=unnamed

    ```

