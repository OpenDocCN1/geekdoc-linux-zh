- fmt: "\n```\nOnce you’ve highlighted multiple columns with the block-wise visual\
    \ mode, you can use either `I` to insert text before the cursor or `A` to insert\
    \ text after the cursor.\n\n*   To insert the word “sweet” at the start of each\
    \ line, use the visual block-wise selection (`<Ctrl-V>` and down) to highlight\
    \ all 3 lines, then type `0Isweet <Esc>`.\n*   To insert the word “donut” at the\
    \ end of each line, use the visual block-wise selection (`<Ctrl-V>` and down)\
    \ to highlight all 3 lines, then type `$A donut<Esc>`.\n\n## Quickly Reselect\
    \ the Previous Visual Highlight\n\n**Problem:**\nYou need to re-select the last\
    \ visual highlight.\n\n**Solution:**\nRun `gv` to visually highlight the previous\
    \ visual selection.\n\nIf you highlight a body of text with either `v`, `V`, or\
    \ `Ctrl-V`, then you leave the Visual mode, the next time you press `gv`, Vim\
    \ will re-select the same block of text. Use this when you forget to apply an\
    \ additional operation to the previously highlighted test.\n\n## Expanding Visual\
    \ Highlight Bidirectionally\n\n**Problem:**\nYou need to expand your visual highlight\
    \ in any direction.\n\n**Solution:**\nPressing `o` or `O` while in visual highlight\
    \ moves the cursor to the other end of the visual highlight.\n\nSuppose that you\
    \ start highlighting the text below you, then you realize that you also need to\
    \ highlight the text above you. If you move up, it will shrink the visual selection.\
    \ To expand the highlight to the text above, first change the cursor location.\n\
    \nTo change the cursor location, press either `o` or `O`. With your cursor now\
    \ on the opposite location, you can now expand to highlight the text above you\
    \ as well.\n\n## Switching to a Different Visual Mode While in a Visual Mode\n\
    \n**Problem:**\nYou’re currently in the character-wise visual mode but you need\
    \ to switch to line-wise visual mode.\n\n**Solution:**\nWhile in a visual mode,\
    \ you can switch to a different visual mode by pressing another visual mode command.\n\
    \n*   If you’re in the character-wise visual mode (`v`), pressing line-wise visual\
    \ mode command (`V`) switches it to the line-wise visual mode.\n*   If you’re\
    \ in the line-wise visual mode (`V`), pressing block-wise visual mode command\
    \ (`Ctrl-V`) switches it to the block-wise visual mode.\n*   If you’re in the\
    \ block-wise visual mode (`Ctrl-V`), pressing the same visual mode command, in\
    \ this case block-wise visual mode command (`Ctrl-V`), will exit the visual mode.\n\
    \n## Visually Highlight the Last Search Term\n\n**Problem:**\nYou recently searched\
    \ with `/donut` and you realized that you needed to jump back to that word and\
    \ modify it.\n\n**Solution:**\nPress `gn` to jump to the next last search term\
    \ (similar to pressing `n` after `/hello`) and automatically highlights that search\
    \ term.\n\nSuppose that you have the following text:\n\n```\none donut\ntwo donut\n\
    three donut\nfour donut\n```\n\nIf you had just searched for `/donut`, if you\
    \ press `gn`, Vim will jump to the next “donut” phrase and do a visual mode highlight.\n\
    \nThis is also useful when combined with the dot command (`.`). Press `gn`. Vim\
    \ will highlight the next “donut”. Then press `d` to delete it. To delete subsequent\
    \ donuts, just run `n` (next match) and `.`. You can now repeat `n . n . n .`\
    \ etc.\n\n## Replace Multiple Characters With Visual Selection\n\n**Problem:**\n\
    The replace operator `r` only replaces one character at a time.\n\n**Solution:**\n\
    When you use `r{something}` on a visual highlight, Vim will replace all of the\
    \ highlighted texts at once.\n\nIn markdown, `===` represents a header. You can\
    \ quickly generate a header on the following text with this method:\n\n```\nMy\
    \ awesome title\n```\n\n*   Yank the line with `yy`.\n*   Paste it with `p`.\n\
    *   Visually highlight the pasted text with `V`.\n*   Replace the selection with\
    \ “=” by running `r=`.\n\n`yypVr=`. That’s all you need to create:\n\n```\nMy\
    \ awesome title\n================\n```\n\n# Vimrc\n\n## Quick Access to Vimrc\n\
    \n**Problem:**\nYou need to quickly access vimrc.\n\n**Solution:**\nIf you edit\
    \ vimrc often, it can be useful to create a shortcut to go there and another to\
    \ source it.\n\nI have the following mapping in my vimrc:\n\n```\nnnoremap <Leader>vs\
    \ :source ~/.vimrc<CR>\nnnoremap <Leader>ve :vsplit ~/.vimrc<CR>\n```\n\nWhen\
    \ I need to open vimrc, I just run `<Leader>ve`. When I want to source my changes,\
    \ after I save the vimrc, I just run `<Leader>vs`.\n\n## Line Numbers\n\n**Problem:**\n\
    You need a clearer indicator to tell you which line you’re on.\n\n**Solution:**\n\
    Use `:set number` to display numbers on the left column.\n\nAlso, you might want\
    \ to consider using `:set relativenumber` to display relative numbers on the left\
    \ column. This setting is useful for line operations. You can easily see how far\
    \ down or up the text is that you want to delete.\n\n## More Helpful Search\n\n\
    **Problem:**\nYou need to highlight the word as you’re typing the search phrase.\n\
    \n**Solution:**\n`set incsearch` sets up incremental search. With this, Vim will\
    \ highlight the match as you are typing the search phrase.\n\nThis is best combined\
    \ with `set hlsearch` to highlight all matches.\n\nHowever, there are times when\
    \ you don’t want Vim to display highlight. To remove the highlight, run `:noh`.\n\
    \nI have this mapping to quickly run `noh` by pressing `<Esc>` twice because I\
    \ use `noh` often.\n\n```\nnnoremap <Esc><Esc> :noh<return><Esc>.\n```\n\n## Smarter\
    \ Search Case\n\n**Problem:**\nYou need Vim to search smarter and ignore case\
    \ when needed.\n\n**Solution:**\nUse `set ignorecase smartcase` to do both case\
    \ insensitive and smartcase search.\n\n*   If you search using all lowercase or\
    \ all uppercase (homogeneous case) letters, Vim will do a case insensitive search.\n\
    *   If you mix the case of the search case, Vim will do a case sensitive search.\n\
    \nGiven:\n\n```\nhello\nHELLO\nHello\n```\n\n*   `/hello` matches “hello”, “Hello”\
    \ “HELLO”.\n*   `/Hello` matches “Hello”.\n*   `/HELLO` matches “HELLO”.\n\n##\
    \ Programmatic Options\n\n**Problem:**\nYou need to set some options programmatically.\n\
    \n**Solution:**\nYou can use `&` to set an option in vimrc instead of `set`. With\
    \ this, you can use Vimscript expressions.\n\nInstead of `set background=light`,\
    \ you can run `let &background = \"light\"`.\n\nTo set different background values\
    \ depending on the current time, use:\n\n```\nlet &background = strftime(\"%H\"\
    ) < 10 ? \"light\" : \"dark\"\n```\n\n## Create a Custom Command\n\n**Problem:**\n\
    You need to create your own `:` command.\n\n**Solution:**\nYou can create a custom-line\
    \ command with `:command`.\n\nThe following will create a custom command `:GimmeDate`.\n\
    \n```\nfunction MyDate()\n  echo call(\"strftime\", [\"%F\"])\nendfunction\n\n\
    command GimmeDate call MyDate()\n```\n\nNow when you run `:GimmeDate`, Vim will\
    \ run `call MyDate()`.\n\n## Conditionally Run Vim Settings Based On Directory\n\
    \n**Problem:**\nYou want to have some options only you’re doing work and a different\
    \ set of options on personal projects.\n\n**Solution:**\nTo set your background\
    \ to dark when you’re on a “Work” directory and to set your background to light\
    \ when you’re not on a “Work” directory, add this to your vimrc:\n\n```\nlet cwd\
    \ = getcwd()\nif cwd =~# \"Work\"\n  echom \"WORK STUFF\"\n  set background=dark\n\
    else\n  echom \"NON WORK STUFF\"\n  set background=light\nendif\n```\n\n## Organize\
    \ Vimrc With the Fold Syntax\n\n**Problem:**\nYour vimrc is getting too long and\
    \ too hard to read.\n\n**Solution:**\nThe fold syntax can help to organize vimrc.\n\
    \nVim fold syntax by default uses `{{{` and `}}}`. To activate it, run `:set foldmethod=marker`.\
    \ You can toggle the fold with `za`.\n\nTo automatically setup marker folds for\
    \ all vim related files including vimrc, add this at the start of your vimrc:\n\
    \n```\naugroup filetype_vim\n  autocmd!\n  autocmd FileType vim setlocal foldmethod=marker\n\
    augroup END\n```\n\nYou can now organize your vimrc based on categories, like:\n\
    \n```\n\" Plugins {{{\ncall plug#begin('~/.vim/plugged')\n  your plugin here\n\
    call plug#end()\n\" }}}\n\n\" Setups {{{\nset relativenumber number\nset ignorecase\
    \ smartcase\nmore setup here\n\" }}}\n\n\" Functions {{{\nfunction! SomeUsefulFunction()\n\
    \  dosomething\nendfunction\n\" }}}\n```\n"
