    # 插入模式


    ## 进入插入模式


    ### 问题

    你需要进入插入模式。


    ### 解决方案

    进入插入模式有许多方法。最常见的是：


    ```

    i    在光标前插入文本

    I    在行首第一个非空字符前插入文本

    a    在光标后追加文本

    A    在行尾追加文本

    o    在光标下方下方另起一行并插入文本

    O    在光标上方另起一行并插入文本

    ```


    如果你是 Vim 新手，先不要试图记住所有它们。先从 `i` 开始。然后记住 `a` 和 `o`。最后，你再记住它们的大写形式。


    ## 退出插入模式的不同方法


    ### 问题

    你的键盘没有 `<Esc>` 键，并且你需要快速退出插入模式。


    ### 解决方案

    通常情况下（字面意思），你可以通过 `<Esc>` 退出插入模式。然而，并非所有键盘都有 `<Esc>` 键（例如平板键盘）。除了 `<Esc>`，你还可以使用
    `Ctrl-[` 或 `Ctrl-C` 来退出。


    或者，你也可以创建一个映射：


    ```

    inoremap jk <Esc>

    ```


    我发现 `<Esc>` 键太远了，所以我将 `<Caps-lock>` 键映射到 `<Esc>`。如果你搜索一下 Bill Joy 的 ADM-3A 键盘（Vi
    的创造），你会发现他的 `<Esc>` 键并不像现代键盘那样位于左上角，而是在 `q` 键左侧。这就是为什么我认为将 `<Caps lock>` 映射到 `<Esc>`
    是合理的。


    ## 粘贴最近复制的文本


    ### 问题

    你需要粘贴之前复制过的文本。


    ### 解决方案

    如果你在插入模式下需要粘贴文本，可以先退出插入模式然后用 `p` 粘贴，但这涉及模式切换。在插入模式下粘贴文本更好的方法是使用 `Ctrl-R 0`。在插入模式下执行
    `Ctrl-R` 可以让你插入寄存器的内容。`0` 是复制寄存器（yank register）。


    也可以从任何其他寄存器插入。如果你需要粘贴某个寄存器的内容，运行 `Ctrl-R a`。


    ## 执行快速计算


    ### 问题

    你需要进行一个快速计算并插入结果。


    ### 解决方案

    在插入模式下进行快速计算，可以使用 `Ctrl-R` 使用表达式 `=`。


    例如：`Ctrl-R =1+1<Enter>`。


    ## 自动补全


    ### 问题

    你需要补全一个单词。


    ### 解决方案

    插入模式内置了自动补全。


    在插入模式下，使用 `Ctrl-P` 进行单词补全。通过在插入模式下按下 `Ctrl-P`，Vim 会向后搜索以光标下文本开现有单词（按下 `Ctrl-N`向前搜索）。


    还有其他自动补全方法。常见的有：


    *   `Ctrl-X Ctrl-L` 行补全。

    *   `Ctrl-X Ctrl-F` 文件名补全。

    *   `Ctrl-X Ctrl-K` 字典补全。注意：此方法需要你先设置 `''dictionary''`。假设 `/usr/share/dict/words`
    中有一个字典（你的电脑某处会有字典路径），使用 `set dictionary=/usr/share/dict/words` 将该路径添加到字典中。


    更多信息请查看 `:h ins-completion`。


    ## 在插入模式下执行普通模式命令


    ### 问题

    你需要在退出插入模式的情况下执行普通模式命令。


    ### 解决方案

    你可以在插入模式下通过 `Ctrl-O` 执行普通模式命令。


    例如：


    *   `Ctrl-O zz` 使屏幕居中。

    *   `Ctrl-O /food` 跳到下一个“food”。


    ## 大范围删除


    ### 问题

    你需要删除文本块。


    ### 解决方案

    *   按下 `Ctrl-U` 删除整行。

    *   按下 `Ctrl-W` 删除光标前的单词。


    此同时，普通模式下的 `D` 会删除到行尾，但插入模式下没有命令可以实现这一点，那么为什么不自己创建一个呢？


    添加以下映射：


    ```

    inoremap <C-d> <C-O>D

    ```'
- fmt: "\nNow when you press `Ctrl-D` in Insert mode, Vim deletes to the end of the\
    \ line.\n\n## Scrolling While in the Insert Mode\n\n**Problem:**\nYou need to\
    \ scroll from insert mode.\n\n**Solution:**\nPress `Ctrl-X Ctrl-E` and `Ctrl-X\
    \ Ctrl-Y` to scroll down and up.\n\n## Insert Special Characters\n\n**Problem:**\n\
    You need to enter special characters like the `Π`.\n\n**Solution:**\nUse Vim digraph.\
    \ To enter a greek Pi, in insert mode, press `Ctrl-K P*`.\n\nHow did I know to\
    \ use `P*`? I looked it up the digraph table (`:h digraph-table`). You can enter\
    \ all sorts of characters like `Φ` `Ω` `Λ` `Θ` `Π` etc.\n\n# Layout\n\n## Indent\
    \ and Un-indent Lines\n\n**Problem:**\nYou need to indent and unindent lines.\n\
    \n**Solution:**\nThe `<` and `>` operators can indent and un-indent lines.\n\n\
    - To indent the next 3 lines, run `>2j`.\n- To indent to the end of the file,\
    \ run `>G`.\n- `>>` and `<<` to indent and un-indent the current line.\n\n## Fix\
    \ the Indentation of the Entire File\n\n**Problem:**\nThe entire file’s indentation\
    \ is messy.\n\n**Solution:**\n`={motion}` can correct the indent of the lines\
    \ indicated by the motion.\n\nFor example, `=G` fixes the indentation of the current\
    \ line to the end of the file. A common practice is to use `gg=G` to correct the\
    \ indentation of the entire file.\n\nNote that the `=` operator uses the program\
    \ defined in the `'equalprg'` setting, which by default is empty (when it is empty,\
    \ Vim uses `'indent'`).\n\n## Redraw the Screen\n\n**Problem:**\nOccasionally\
    \ Vim will display a stagnant screen after running a certain scripts.\n\n**Solution:**\n\
    If Vim is showing a stagnant or “buggy” display, you may need to refresh it by\
    \ either running `:redraw!` or pressing `Ctrl-L`.\n\n## Folding Lines\n\n**Problem:**\n\
    You want to fold rows of lines.\n\n**Solution:**\nI don’t like to fold my clothes\
    \ but I like to fold rows of lines.\n\nWhy would you ever fold anything?\n\nWhen\
    \ you read a file, there are often many irrelevant texts that obstruct you from\
    \ understanding what that file does in the big picture. To hide this unnecessary\
    \ noise, use Vim fold.\n\nVim supports 6 different folds:\n\n1. Manual\n2. Indent\n\
    3. Expression\n4. Syntax\n5. Diff\n6. Marker\n\nThe manual fold lets you to fold\
    \ rows manually (you can’t fold characters, just lines). The operator is `zf`\
    \ and it works just like any operation: it accepts a motion. If you have the text:\n\
    \n```\nLine one\n\nLine two\n```\n\nWith your cursor on “Line one”, run `zfj`\
    \ to fold both lines. Folded lines look something like:\n\n```\n+-- 2 lines: Line\
    \ one -----\n```\n\nTo open a folded text, use `zo`. To close a fold, use `zc`.\
    \ You can also use the `:fold` command-line. My two favorite fold methods are\
    \ `zR` to open all folds and `zM` to close all folds. The manual fold is useful\
    \ when you want to do quick, impromptu folds.\n\nTo use the indent fold method,\
    \ change the `'foldmethod'` option to indent: `set foldmethod=indent`. Vim will\
    \ fold indented lines according to the `'shiftwidth'` option.\n\nIf you have the\
    \ text:\n\n```\nOne\n\n  Two\n\n  Two again\n```\n\nThe latter 2 lines, having\
    \ 2 spaces of indentation, will be folded. This will only work if you have `'shiftwidth'`\
    \ value of 2 btw. The indent fold is useful when dealing with texts that use indent\
    \ structure, like Python or YAML files.\n\nThe expression fold lets you define\
    \ an expression to determine folding. You need to first tell Vim to use the expression\
    \ fold with `set foldmethod=expr`, then Vim will use whatever expression you define\
    \ for `'foldexpr'` option.\n\nFor example, if you want to fold all items starting\
    \ with “p”:\n\n```\ndonut\npancake\npop-tarts\nprotein bar\nsalmon\nscrambled\
    \ eggs\n```\n\nRun `:set foldexpr=getline(v:lnum)[0]==\\\\\"p\\\\\"`. I won’t\
    \ go into Vimscript deeply here, but the `'foldexpr'` expression will return true\
    \ only if the first character of the current line starts with “p”.\n\nThe syntax\
    \ fold can fold lines based on syntax options. To use it, first set the fold method\
    \ with `:set foldmethod=syntax`. Again, I won’t cover how syntax definitions work\
    \ in Vim here, but in general, if you use syntax plugins like [vim-polyglot](https://github.com/sheerun/vim-polyglot),\
    \ the syntax fold should work right out of the box. Vim uses the syntax definition\
    \ to determine what to fold.\n\nThe diff fold works immediately when you do a\
    \ vimdiff. If you run `vimdiff file1.txt file2.txt`, Vim automatically sets the\
    \ foldmethod to diff and folds all the identical lines.\n\nThe marker fold is\
    \ used to fold the lines marked by a pattern. You can set it up with `:set foldmethod=marker`.\
    \ By default, Vim uses `{{{`, `}}}` patterns as fold identifiers. Vim will fold\
    \ any rows between the identifier.\n\nIf you have:\n\n```\nHello\n{{{\nworld\n\
    vim\n}}}\n```\n\nWhen Vim sees `{{{` and `}}}`, those lines will be folded. You\
    \ can change the indicators by updating the `'foldmarker'` option values. To change\
    \ it to `<<<` and `>>>`, run `:set foldmarker=<<<,>>>`.\n\n## Cursor Visual Helper\n\
    \n**Problem:**\nYou need to draw a straight line across the file.\n\n**Solution:**\n\
    Use `:set cuc` (`'cursorcolumn'`) to display a column that spans across the entire\
    \ screen. Try it!\n\nTo turn it off, run `:set nocuc`. If the cursor column has\
    \ a hard-to-see highlight, you can change the highlight to white by running `:highlight\
    \ CursorColumn guibg=#FFFFFF`.\n\n# Macros And Registers\n\n## Macro Basics\n\n\
    **Problem:**\nYou need to record a command sequence to a register.\n\n**Solution:**\n\
    You can record a sequence of actions inside registers a-z and replay them later.\
    \ This procedure is called a macro.\n\nTo record a macro, press `q`, followed\
    \ by the register character (example: `qq` to record a macro in register q). To\
    \ stop recording, press `q` again.\n\nFor example:\n\n```\nqagUUjq\n```\n"
