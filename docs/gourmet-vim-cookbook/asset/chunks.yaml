    ## I''m a header


    ## I''m another header


    ## I''m yet another header


    ```


    And you want to substitute `##` into incrementing numbers, like:


    ```


    1.)  I''m a header


    2.)  I''m another header


    3.)  I''m yet another header


    ```


    Run:


    ```


    let i = 1 | g/^##/s//\=i . ''.)''/g | let i += 1


    ```


    *   `let i = 1` sets the variable `i` to equal 1.

    *   `g/^##/` runs the global command that matches the `^##` pattern (lines starting
    with “##”).

    *   `s//` to use the substitute command. If you leave the search pattern blank,
    Vim will use the same search pattern as the global command search pattern (which
    is `^##`).

    *   `\=i . ''.)''/g` uses the expression `\=i . ''.)''` as the substitute pattern
    (the variable `i` concatenated with the string “.)”. The `g` is the global flag.

    *   `let i += 1` increments the variable `i` by 1 with each iteration.


    ## Quickly Generate Incrementing Numbers Anywhere


    **Problem:**

    You need to generate a list with incrementing numbers.


    Solution

    If you need to create a list quickly, you can generate incrementing number prefixes
    on the fly. Here is how you can do this using visual mode and the number increment
    operator.


    Suppose that you have this list:


    ```


    first item


    second item


    third item


    ```


    1.  Put your cursor on the first character on the first line, the character “f”
    in “first”,

    2.  Activate the block-wise visual mode (`Ctrl-V`),

    3.  Go down two lines.

    4.  Press `I` to activate insert mode before the cursor and type “0\. “. Press
    `<Esc>`.


    You should have:


    ```


    0\. first item


    0\. second item


    0\. third item


    ```


    5.  Press `gv` to quickly highlight the previously selected visual mode. Vim will
    automatically highlight all “0” texts.

    6.  Press `g Ctrl-A` to sequentially increment numbers and you’re done!


    ```


    1\. first item


    2\. second item


    3\. third item'
