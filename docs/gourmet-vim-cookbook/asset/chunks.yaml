    With your cursor on the “0” in the first line, run `dCtrl-V2j` (note that this
    is similar to block-wise Visual mode).


    ## Persistent Undo


    **Problem:**

    Each time you close and re-open Vim, you wish that you can undo the last action
    you did right before you closed Vim.


    **Solution:**

    An undo file allows you to preserve the undo history even after you close Vim;
    you can create an undo file with `:wundo` and load it with `:rundo`.


    Edit `somefile.txt`, then create an undo file with `:wundo! somefile.undo` (you
    can give it any name), then close Vim and reopen `somefile.txt`. Run `:rundo somefile.undo`
    to load the undo file. You can now undo from that file as if you never exited
    Vim.


    ## Undoing In Chunks


    **Problem:**

    After you typed a long paragraph, when you undo, Vim removes the entire paragraph
    even though you only need to undo the last sentence.


    **Solution:**

    Vim undo undoes the last “change”. All the texts that you typed while you’re in
    the insert command count as a single change. You can exit the insert mode after
    each sentence to create smaller changes.


    Alternatively, you can create an undo chunk with `Ctrl-G u` to break your change
    into smaller parts without leaving insert mode. Here’s how.


    If you type `ipancake breakfast<Esc>` then you press `u`, Vim will undo the entire
    “pancake breakfast”. To add a break-point, run `ipancake <Ctrl-G u>breakfast<Esc>`.
    Now when you press `u`, Vim will remove only “breakfast”.


    ## Join Lines


    **Problem:**

    You need to join the next line to the current line.


    **Solution:**

    If you press `J`, Vim will join the line below the current line to the current
    line. Vim automatically adds an extra space when joining two lines, so if you
    don’t want the extra line, use `gJ` to join two lines without a space. If you
    are on visual mode, you can join all highlighted lines with `J`.


    The `:j` (short for `:join`) is the command-line version of `J`. By running just
    `:j`, Vim will act like `J`. If you want to join all lines, run `:%j`.


    ## Using Terminal Commands


    **Problem:**

    You need to filter your texts using the terminal commands.


    **Solution:**

    Vim has a bang (`!`) operator to filter the text through the external command.


    For example, if you have the following text that you need to tabularize and remove
    the rows without “Ok”:


    ```

    Id|Name|Cuteness

    01|Puppy|Very

    02|Kitten|Ok

    03|Bunny|Ok

    ```


    You can achieve this using the `column` terminal command and the `awk` command.
    Just run:


    ```bash

    !}column -t -s "|" | awk ''NR > 1 && /Ok/ {print $0}''

    ```


    You’ll get a clean, filtered table:


    ```

    02  Kitten  Ok

    03  Bunny   Ok

    ```


    This is one of Vim’s shining features because it lets you extend Vim’s capability
    to use external commands in addition to Vim’s internal commands, allowing you
    to compose more complex actions.


    # Terminal


    ## Vi Mode


    **Problem:**

    You want to use Vi keybindings in the terminal.


    **Solution:**

    To set the Vi mode in the terminal, run `set -o vi` (not supported by all terminals,
    but most terminals should have it).


    Now when you press `<Esc>`, you’ll enter Vi Normal mode. Some available features
    are:


    *   Line navigations (`0`, `$`, `w`, etc.).

    *   Go through history with `j` and `k`.

    *   Search the command history with `?some command` or `/other command` and follow-up
    with `n` and `N`.

    *   Etc.


    ## Opening Files


    **Problem:**

    You want to quickly open multiple files.


    **Solution:**

    You can open multiple files at once with `vim file1.txt file1.txt file3.txt`.


    You can use glob to open multiple files in Vim:


    *   Run `vim *.js` to open all Javascript files in the current directory.

    *   Run `vim **/*.js` to open all Javascript files recursively.


    ## Diffing With Vim


    **Problem:**

    You need to perform a quick diff between two or more files.


    **Solution:**

    Run `vimdiff file1.txt file2.txt` to perform diff with Vim. Alternatively, you
    can also run `vim -d file1.txt file2.txt`.


    ## Running Vim Without Plugins or Vimrc


    **Problem:**

    You need to run Vim without plugins.


    **Solution:**


    *   To launch Vim without plugins but with vimrc, run `vim --noplugin`.

    *   To launch Vim with plugins but without vimrc, run `vim -u NORC`.

    *   To launch Vim without plugins and vimrc, run `vim -u NONE`.


    These are useful when you need to debug Vim.


    ## Open Files in Vim as a Result of Another Command


    **Problem:**

    You need to pass the output of terminal commands to open files in Vim.


    **Solution:**

    You can run `vim` followed by `$(command)`. Some use cases:


    *   You can open all your `git status` files, run `vim $(git status --porcelain
    | awk ''{print $2}'')`.

    *   You can open the result of the `find` command with `vim $(find . -name "my_file*.js)`.


    ## Open Files in Read-Only Mode


    **Problem:**

    You need to open files without modifying it.


    **Solution:**

    `vim -R filename.txt` opens the file in read-only mode. This is a good alternative
    for `less`. You get the benefit of Vim navigation without worrying that you may
    accidentally edit it.


    ## Open Vim With Vertical and Horizontal Splits


    **Problem:**

    You want to open multiple files in Vim with horizontal or vertical splits.


    **Solution:**


    *   You can open Vim with multiple vertical splits with `vim -O firstfile.txt
    secondfile.txt`.

    *   You can open Vim with multiple horizontal splits with `vim -o firstfile.txt
    secondfile.txt`.


    You can also open Vim with multiple horizontal windows with `vim -on` and horizontal
    windows with `vim -On`, where n is the number of windows.


    *   To open Vim with 2 horizontal windows, run `vim -o2`.

    *   To open Vim with 3 vertical windows, run `vim -O5`.


    ## Generate New Files Programmatically


    **Problem:**

    You want to generate new files programmatically in Vim.


    **Solution:**

    You can programmatically generate multiple new buffers with `vim hello{1..10}.txt`.


    ## Passing Text as STDIN to a Command


    **Problem:**

    You are given a file from which you need to execute terminal commands from.


    **Solution:**

    You can utilize Vim to execute terminal commands with `:%w !sh`. Vim will use
    the text in the buffer and pass it as a STDIN.


    If you have the following text:


    ```

    file1.txt

    file2.txt

    file3.txt

    ```


    *   Run `:%s/\v(.+)(\.txt)/mv & \1\.md/g` to change each line from “testN.txt”
    into “mv testN.txt testN.md”.

    *   Run `:%w !sh` to execute the instruction.


    This effectively executes `mv file1.txt file1.md`, `mv file2.txt file2.md`, and
    `mv file3.txt file3.md`.


    ## Using the Terminal From Vim


    **Problem:**

    Most modern editors have a built-in terminal. You want that too.


    **Solution:**

    Vim (8.1 and up) has a terminal-mode that you can access with the `:terminal`
    command.


    For more, check out `:h terminal.txt`.


    ## Check Available Features


    **Problem:**

    You want to see what features are supported in your Vim build.


    **Solution:**

    You can run `vim --version` to see what versions are available. Likewise, you
    can also run `:version` inside Vim.


    # Visual Mode


    ## Visual Mode Basics


    **Problem:**

    You don’t know how to use Vim’s visual mode.


    **Solution:**

    Vim’s visual mode is similar to highlights in most text editors (you highlight
    a body of text, then you apply changes to the highlighted texts).


    There are three different visual modes:


    *   `v` - character-wise visual mode

    *   `V` - line-wise visual mode

    *   `Ctrl-V` block-wise visual mode.


    Try them out! Use each of the different visual modes to get a feel. You can use
    Vim navigation to expand or contract the highlighted area. To exit the visual
    mode, press `<Esc>`.


    You can also perform an operation to the highlighted body of text. For example,
    if you press `d` while having a body of text highlighted, that body of text will
    be deleted.


    ## Insert Text on Multiple Lines


