    *   Use `Ctrl-W c` to close the current window (you can’t close it if it is the
    last window). You can also run `:close`.

    *   Use `Ctrl-W o` to “enlarge” the current window and close other open windows.
    You can also run `:on`.


    ## Moving the Cursor to Another Windows


    **Problem:**

    You have multiple windows open and you need to move your cursor to a different
    window.


    **Solution:**

    Use `Ctrl-W h/j/k/l` to go to the left, down, up, or right window.


    You can also Use `Ctrl-W w` to move to another window. You can pass a count to
    this command. If you run `3 Ctrl-W w`, Vim will go to the 3rd window.


    ## Open a New Window


    **Problem:**

    You need to quickly open a new window.


    **Solution:**


    *   Use `Ctrl-W n` or `:new` to create a new horizontally split buffer.

    *   Use `:vnew` to create a new vertically split buffer.


    ## Use Two Windows to Diff Files


    **Problem:**

    You need to diff two files from Vim.


    **Solution:**

    To create a diff between two files, you can use `:diffthis`. Here is how to use
    it:


    *   First open `file.txt` in Vim.

    *   Then open another file, `file2.txt`, in split mode (`:vsp file2.txt`).

    *   In the first buffer, run `:diffthis`.

    *   In the second buffer, run `:diffthis`.

    *   To turn it off, run `:diffoff`.


    Essentially, you need to run the `diffthis` command from each window.

