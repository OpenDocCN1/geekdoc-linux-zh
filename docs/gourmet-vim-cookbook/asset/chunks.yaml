    If you only need to substitute the first and third match, after running the substitute
    command, Vim will ask you for a confirmation on each match. Just say yes on the
    first one, no on the second one, and yes on the third one.


    ## Group Match In Substitution


    **Problem:**

    You need to reverse the order of a pattern.


    **Solution:**

    You can group the match pattern and refer them as `\n` (where `n` is the integer).


    If you want to substitute “chocolate donut” into “donut chocolate”, you can just
    do `:s/chocolate donut/donut chocolate`.


    But what if you need to make the second word the first and the first word second?
    You need a group match.


    To turn “chocolate donut” into “donut chocolate”, run `:s/\(.\+\) \(.\+\)/\2 \1/g`.


    * The first group `\(.\+\)` matches “chocolate” and is represented by `\1`.

    * The second group `\(.\+\)` matches “donut” and is represented by `\2`.


    Another example: if you need to swap the 1st letter to 2nd, the 2nd letter to
    the 3rd, the 3rd to 1st, you can run `:s/^\(\w\)\(\w\)\(\w)/\2\3\1/g`. This will
    swap “123” to “231”, “abc” to “bca”.


    ## Use Very Magic to Avoid Escaping Special Characters


    **Problem:**

    You are sick and tired of escaping special characters.


    **Solution:**

    Some characters, when doing search / substitution, have special meanings (like
    `.`, `( )`, or `+`). There are times when you have to escape a plethora of characters.
    Use the very magic flag `\v` to avoid escaping special characters.


    * To turn “chocolate donut” into “donut chocolate” with very magic, run `:s/\v(.+)
    (.+)/\2 \1/g` (contrast that with `:s/\(.\+\) \(.\+\)/\2 \1/g`).

    * To swap the 1st letter to 2nd, 2nd to 3rd, and 3rd to 1st with very magic, run
    `:s/\v^(\w)(\w)(\w)/\2\3\1/g` (contrast that with `:s/^\(\w\)\(\w\)\(\w)/\2\3\1/g`).


    ## Representing the Entire Match


    **Problem:**

    You need a way to represent “the entire match” pattern.


    **Solution:**

    In a group match, `\0` is a special keyword that represents the entire match.


    If you have the string “pancake” and you want to update “pancake” into “fluffy
    pancake”, instead of running `:s/pancake/fluffy pancake`, you can run `:s/pancake/fluffy
    \0/`. `\0` represents the entire match, which is the word “pancake”.


    If you need to add parentheses around “pancake”, you can run `:s/pancake/(\0)/g`
    to give you “(pancake)”.


    Alternatively, `&` is also another keyword for the entire match: `:s/pancake/fluffy
    &/` and `:s/pancake/(&)/g`.


    ## Using the Group Match to Remove Words


    **Problem:**

    You need to reuse parts of the search pattern.


    **Solution:**

    You can use group matches, `\1 \2 \3 etc`, to remove words.


    You can delete subsequent duplicate lines with `:%s/(.+)\n\1/\1/g`. Here you are
    using `\1` as a pattern to substitute and pattern to substitute into.


    ```

    chocolate

    donut

    donut

    ```


    Vim deletes the second “donut”.


    Another example, if you have a list of phone numbers:


    ```

    123-123-1234

    111-111-1111

    ```


    If you want to get rid of the area code (the first 3 digits), you can run `:%s/\v(\d{3}-)(\d{3}-)(\d{4})/\2\3`.
    You’ll get:


    ```

    123-1234

    111-1111

    ```


    ## Reusing the Previous Search Pattern


    **Problem:**

    You just searched for a word (`/some keyword`) and you don’t want to retype that
    word again when doing substitution.


    **Solution:**

    If you use an empty substitute search pattern, Vim will use the previous search
    pattern!


    If you recently searched for `/donut` and then you run `:%s//pancake/g`, this
    is equal to `:%s/donut/pancake/g`. Why type more if you can type less?


    ## Deleting In Substitution Quicker


    **Problem:**

    When you’re using a substitution to delete, like in `:s/donut//`, is there a faster
    way to do this?


    **Solution:**

    If you leave the substitute pattern blank, Vim assumes that you want to delete
    them:


    * `:%s/waffles` removes all “waffles” in a buffer.

    * `:%s/^\n` removes all empty lines in a buffer.


    ## Using an Expression in a Substitution


    **Problem:**

    You need to do a complicated substitution using an expression


    **Solution:**

    You can use the expression register in substitution with `\={expr}`.


    To substitute all `__DATE__` string with today’s date, you can run `:%s/__DATE__/\=strftime("%c")/g`.
    `strftime()` is a Vimscript function (`:h strftime()`).


    ## Removing Trailing Whitespaces


    **Problem:**

    You have trailing whitespaces all over the buffer.


    **Solution:**

    To remove trailing whitespaces, run `:%s/\s\+$//g`.


    * `\s` represents whitespace characters (literal spaces and tabs).

    * `\+` means one or more preceding character.

    * `$` here means the end of the line.


    Together, `\s\+$` means one or more whitespace characters at the end of the line.
    Recall that the `:s` command automatically deletes if you leave the second half
    blank, so `:%s/\s\+$` works too.


    ## Add a New Line In Substitution


    **Problem:**

    You need to add a new line to a phrase.


    **Solution:**

    Substitution can also be used to add new lines. Use the `\r` pattern.


    If you want to add a new line after each line that starts with “pancakes”, run
    `:%s/^pancakes.*/\0\r/g`:


    ## Repeat the Last Substitute Command


    **Problem:**

    You need to repeat the last substitute command.


    **Solution:**

    `:s` repeats the last substitute command without the flag.


    If you recently did `:s/pancake/donut` and you repeat it `:s` will quickly repeat
    that. Alternatively, you can also press `&`. `&` is the normal mode version of
    `:s`.


    If you recently did `:s/pancake/donut/g` and you want to keep the `g` flag, run
    `:&&`.


    ## Capitalize the First Letter Of Each Word


    **Problem:**

    You need to capitalize the first letter of each word in a line.


    **Solution:**

    Run `:s/\<./\u\0/g` to capitalize the first letter of each word in a line.


    * `\<.` is the pattern for the beginning of a word.

    * `\u` is a special keyword modifier to uppercase the subsequent pattern.

    * `\0` represents the entire match.


    ## Perform a Chain of Substitutes


    **Problem:**

    You need to substitute a few phrases simultaneously.


    **Solution:**

    You can chain multiple substitutions with `|`.


    To substitute “good” to “awesome”, “bad” to “terrible”, and “ugly” to “hideous”,
    run:


    ```

    :s/good/awesome/ | s/bad/terrible/ | s/ugly/hideous/

    ```


    ## Repeat the Last Substitute String


    **Problem:**

    You need to do a different substitution but with the same substitute string as
    your previous substitution.


    **Solution:**

    Use the `~` pattern in substitution to repeat the last substitute string.


    If you recently ran `:s/pancake/donut/g`, then `:s/waffle/~/g`, Vim will also
    substitute “waffle” with “donut”, the last substitute string.


    ## Repeat the Last Substitution With the Last Search Pattern and the Last Substitute
    String


    **Problem:**

    You just searched with `/`. You just performed a substitution. Now you need to
    substitute using the last search pattern but with the same previous substitute
    string.


    **Solution:**

    Use `:~` to repeat the last substitution using the last search pattern and the
    last substitute string


    If you recently ran `:s/pancake/donut/` and you recently searched `/mochi`, running
    `:~` will do `:s/mochi/donut/`.


    ## Changing the Delimiter


    **Problem:**

    You got lost in the jungle of front-slashes.


    **Solution:**

    You need to substitute a web URL with a long path like `https://mysite.com/a/b/c/d/e`
    and you end up with something like `:s/https:\/\/mysite.com\/a\/b\/c\/d\/e/hello/`.


    Frankly it is hard to tell which forward slashes are part of the substitution
    patterns and which ones are the delimiters. Vim lets you change the substitution
    delimiter with any single-byte characters (except for alphabets, numbers, `"`,
    `|`, and `\`). What that means is that you can do something like:


    ```

    :s+https:\/\/mysite.com\/a\/b\/c\/d\/e+hello+

    ```


    or


    ```

    :s@https:\/\/mysite.com\/a\/b\/c\/d\/e@hello@

    ```

