  trans: "\n现在当你在插入模式下按下 `Ctrl-D` 时，Vim 会删除到行尾。\n\n## 在插入模式下滚动\n\n**问题：**\n你需要从插入模式进行滚动。\n\
    \n**解决方案：**\n按下 `Ctrl-X Ctrl-E` 和 `Ctrl-X Ctrl-Y` 来向下和向上滚动。\n\n## 插入特殊字符\n\n**问题：**\n\
    你需要输入诸如 `Π` 的特殊字符。\n\n**解决方案：**\n使用 Vim 的双字字符（digraph）。在插入模式下，按下 `Ctrl-K P*` 可以输入希腊字母\
    \ Pi。\n\n我是如何知道用 `P*` 的？我查了双字字符表（`:h digraph-table`）。你可以输入如 `Φ` `Ω` `Λ` `Θ` `Π`\
    \ 等各种字符。\n\n# 布局\n\n## 缩进和取消缩进行\n\n**问题：**\n你需要对行进行缩进和取消缩进。\n\n**解决方案：**\n使用运算符\
    \ `<` 和 `>` 可以缩进和取消缩进行。\n\n- 要缩进接下来的 3 行，运行 `>2j`。\n- 要缩进到文件末尾，运行 `>G`。\n- `>>`\
    \ 和 `<<` 用于缩进和取消缩进当前行。\n\n## 修复整个文件的缩进\n\n**问题：**\n整个文件的缩进非常混乱。\n\n**解决方案：**\n\
    `={motion}` 可以修正由移动指令（motion）指定的行的缩进。\n\n例如，`=G` 可以修复从当前行到文件末尾的缩进。常用的做法是使用 `gg=G`\
    \ 来修正整个文件的缩进。\n\n注意，` 运算符使用 `'equalprg'` 设置中定义的程序，默认情况下该设置是空的（当它为空时，Vim 使用 `'indent'`）。\n\
    \n## 重绘屏幕\n\n**问题：**\n偶尔在运行某些脚本后，Vim 会显示一个停滞的屏幕。\n\n**解决方案：**\n如果 Vim 显示停滞或有“错误”的显示，你可能需要通过运行\
    \ `:redraw!` 或按下 `Ctrl-L` 来刷新它。\n\n## 折叠行\n\n**问题：**\n你想折叠几行代码。\n\n**解决方案：**\n\
    我不喜欢折叠衣服，但我喜欢折叠几行代码。\n\n为什么要折叠东西呢？\n\n当你阅读一个文件时，通常有很多无关的文本阻碍你理解该文件的整体功能。为了隐藏这些不必要的噪音，请使用\
    \ Vim 折叠。\n\nVim 支持 6 种不同的折叠方式：\n\n1. 手动\n2. 缩进\n3. 表达式\n4. 语法\n5. 差异 (Diff)\n\
    6. 标记\n\n手动折叠允许你手动折叠行（你不能折叠字符，只能折叠行）。运算符是 `zf`，它的工作方式与任何操作一样：它接受一个移动指令。如果你有文本：\n\
    \n```\nLine one\n\nLine two\n```\n\n将光标放在“Line one”上，运行 `zfj` 折叠这两行。折叠后的行看起来像：\n\
    \n```\n+-- 2 lines: Line one -----\n```\n\n使用 `zo` 打开折叠的文本。使用 `zc` 关闭折折叠。你也可以使用命令行\
    \ `:fold`。我最喜欢的两种折叠方法是使用 `zR` 打开所有折叠和 `zM` 关闭所有折叠。当你想要进行快速、临时的折叠时，手动折叠非常有用。\n\n\
    要使用缩进折叠方法，将 `'foldmethod'` 选项更改为 indent：`set foldmethod=indent`。Vim 将根据 `'shiftwidth'`\
    \ 选项折叠缩进行。\n\n如果你有文本：\n\n```\nOne\n\n  Two\n\n  Two again\n```\n\n后 2 行具有 2 个空格的缩进将被折叠。顺便说一下，这只有在\
    \ `'shiftwidth'` 值为 2 时才有效。在处理使用缩进结构的文本（如 Python 或 YAML 文件）时，缩进折叠非常有用。\n\n表达式折叠允许你定义一个表达式来确定折叠。你首先需要通过\
    \ `set foldmethod=expr` 告诉 Vim 使用表达式折叠，然后 Vim 将使用 `'foldexpr'` 选项中定义的任何表达式。\n\n\
    例如，如果你想折叠所有以“p”开头的项：\n\n```\ndonut\npancake\npop-tarts\nprotein bar\nsalmon\n\
    scrambled eggs\n```\n\n运行 `:set foldexpr=getline(v:lnum)[0]==\\\\\"p\\\\\"`。我在这里不会深入探讨\
    \ Vimscript，但只有当当前行的第一个字符以“p”开头时，`'foldexpr'` 表达式才会返回真。\n\n语法折叠可以根据语法选项折叠行。要使用它，先通过\
    \ `:set foldmethod=syntax` 设置折叠方法。再次，我在这里不会介绍 Vim 中语法定义是如何工作的，但通常情况下如果你使用 [vim-polyglot](https://github.com/sheerun/vim-polyglot)\
    \ 等语法插件，语法折叠应该可以直接工作。Vim 使用语法定义来确定折叠内容。\n\n差异折叠在你执行 `vimdiff` 时会立即生效。如果你运行 `vimdiff\
    \ file1.txt file2.txt`，Vim 会自动将 foldmethod 设置为 diff 并折叠所有相同的行。\n\n标记折叠用于折叠由模式标记的行。你可以通过\
    \ `:set foldmethod=marker` 设置。默认情况下，Vim 使用 `{{{`, `}}}` 模式作为折叠标识符。Vim 会折叠标识符之间的任何行。\n\
    \n如果你有：\n\n```\nHello\n{{{\nworld\nvim\n}}}\n```\n\n当 Vim 看到 `{{{` 和 `}}}` 时，这些行将被折叠。你可以通过更新\
    \ `'foldmarker'` 选项的值来更改指示符。要将其更改为 `<<<` 和 `>>>`，运行 `:set foldmarker=<<<,>>>`。\n\
    \n## 光标视觉辅助\n\n**问题：**\n你需要在文件中跨越画一条直线。\n\n**解决方案：**\n使用 `:set cuc` (`'cursorcolumn'`)\
