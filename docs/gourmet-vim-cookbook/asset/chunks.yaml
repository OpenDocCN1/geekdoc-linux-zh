    ```

    These commands require you to make a list in their respective categories (argument
    list, buffer list, window list, tab list, quickfix list, and location list) before
    you can run the command.


    *   To create an argument list, run `:args file1.txt file2.txt file3.txt`

    *   To create a buffer list, just open more files (like `:e file1.txt`)

    *   To create a window list, create more split windows (like `:vsplit file1.txt`)

    *   To create a tab list, create more tabs (like `:tabnew tab1`)

    *   To create a quickfix list, use a command that uses quickfix (like `:vimgrep
    /searchkeyword/ *.txt`)

    *   To create a location list, use a command that uses location list (like `:lvimgrep
    /searchkeyword/ *.txt`)


