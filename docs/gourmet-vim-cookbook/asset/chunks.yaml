    That’s all. Once the library plugin is inside the `start/` directory, Vim automatically
    uses it when it starts. The next time you start Vim, you can now use the `NERDTree`
    commands. You can clone however many plugin repositories as you need inside this
    path. To remove a plugin, just remove that plugin directory from the `start/`
    directory.


    To load plugins manually, you need to put it inside the `opt/` directory:


    ```

    ~/.vim/pack/*/opt/

    ```


    Again, the `*` stands for “any directory name”. You can use the same directory
    name or a different one. In this case, let’s use `packdemo/` name again.


    ```

    ~/.vim/pack/packdemo/opt/

    ```


    Now let’s install the killersheep game (requires Vim 8.2).


    ```bash

    cd ~/.vim/pack/packdemo/opt/

    git clone https://github.com/vim/killersheep.git

    ```


    Now when you start Vim, the game won’t be available yet. To activate a package
    in the `opt/` directory manually, run `:packadd {package-name}`.


    ```

    :packadd killersheep

    ```


    Now run the killership command, `:KillKillKill`. Enjoy!


    ## Installing Plugins With Plugin Managers


    **Problem:**

    You need to install plugins without Vim’s packages.


    **Solution:**

    There are many Vim plugin manager available out there:


    * [vim-plug](https://github.com/junegunn/vim-plug)

    * [vundle.vim](https://github.com/VundleVim/Vundle.vim)

    * [vim-pathogen](https://github.com/tpope/vim-pathogen)

    * [dein.vim](https://github.com/Shougo/dein.vim)

    * … and many more!


    I personally use `vim-plug`, but most plugin managers are also equally good. Many
    of them are also easy to install. Check them out and find the one you like best!


    ## Trigger Action On Certain Event


    **Problem:**

    You want to perform a specific action each time a file is saved.


    **Solution:**

    Vim has an autocommand that fires when a certain event is triggered, `:autocmd`.


    For example, to set a `filetype` to `awesomefile` each time you open an `.awesome`
    file extension, add this in vimrc:


    ```

    autocmd BufNewFile,BufRead *.awesome set filetype=awesomefile

    ```


    To automatically generate tags when you’re saving a Python file, run:


    ```bash

    autocmd BufWritePost *.py silent !ctags -R .

    ```


    Autocommand supports myriads of different events. To see what all the events are,
    check out `:h autocommand-events`.


    # Window


    ### Splitting Windows Horizontally and Vertically


    **Problem:**

    You need to split the current windows.


    **Solution:**


    * You can use `Ctrl-W s` or `:sp` to split the window horizontally. You can also
    do `:sp somefile.txt` to explicitly specify which file to open on the split window.

    * You can use `Ctrl-W v` or `:vsp` to split the window vertically. You can also
    do `:vsp somefile.txt` to explicitly specify which file to open on the split window.


    ### Resizing Windows


    **Problem:**

    You need to resize the current window.


    **Solution:**

    You can change the window length and width:


    * To make the current window longer or shorter, run `Ctrl-W +` or `Ctrl-W -`.

    * To increase or decrease the current window width, run `Ctrl-W >` or `Ctrl-W
    <`.


    Alternatively, you can also resize with:


    * To set the current window height N, run `zN<Enter>` (ex: `z10<Enter>` to set
    the window height to 10). You can also run `:resize N` to set the height to N
    (ex: `res 10` to set it to 10).

    * To set the current window width, run `Ctrl-W |`. By default, it will set it
    to the max width. You can also run `:vertical res N` where `N` is the width (ex:
    `:vertical res 10` to set it to 10).


    Finally, if you have multiple windows open with different heights and widths,
    run `Ctrl-W =` to make all windows to have equal sizes.


    ### Close or Zoom the Current Window


    **Problem:**

    You need to quickly close the current window or zoom the current window.


    **Solution:**


    * Use `Ctrl-W c` to close the current window (you can’t close it if it is the
    last window). You can also run `:close`.

    * Use `Ctrl-W o` to “enlarge” the current window and close other open windows.
    You can also run `:on`.


    ### Moving the Cursor to Another Windows


    **Problem:**

    You have multiple windows open and you need to move your cursor to a different
    window.


    **Solution:**

    Use `Ctrl-W h/j/k/l` to go to the left, down, up, or right window.


    You can also Use `Ctrl-W w` to move to another window. You can pass a count to
    this command. If you run `3 Ctrl-W w`, Vim will go to the 3rd window.


    ### Open a New Window


    **Problem:**

    You need to quickly open a new window.


    **Solution:**


    * Use `Ctrl-W n` or `:new` to create a new horizontally split buffer.

    * Use `:vnew` to create a new vertically split buffer.


    ### Use Two Windows to Diff Files


    **Problem:**

    You need to diff two files from Vim.


    **Solution:**

    To create a diff between two files, you can use `:diffthis`. Here is how to use
    it:


    * First open `file.txt` in Vim.

    * Then open another file, `file2.txt` in split mode (`:vsp file2.txt`).

    * In the first buffer, run `:diffthis`.

    * In the second buffer, run `:diffthis`.

    * To turn it off, run `:diffoff`.


    Essentially, you need to run the `diffthis` command from each window.

