  trans: "\n\n```\n一旦你使用块可视模式（block-wise visual mode）高了多列，你可以使用 `I` 在光标前插入文本，或使用 `A`\
    \ 在光标后插入文本。\n\n*   要在每行的开头插入单词“sweet”，请使用可视块选择（`<Ctrl-V>` 和向下键）高亮所有 3 行，然后输入 `0Isweet\
    \ <Esc>`。\n*   要在每行的末尾插入单词“donut”，请使用可视块选择（`<Ctrl-V>` 和向下键）高亮所有 3 行，然后输入 `$A donut<Esc>`。\n\
    \n## 快速重新选择上一个可视高亮区域\n\n**问题：**\n你需要重新选择上一次可视高亮区域。\n\n**解决方案：**\n运行 `gv` 可视化高亮上一次可视选择。\n\
    \n如果你使用 `v`、`V` 或 `Ctrl-V` 高亮了一段文本，然后离开了可视模式，下次你按下 `gv` 时，Vim 将重新选择该块文本。当你忘记对之前高亮的文本执行额外的操作时，可以使用此方法。\n\
    \n## 双向扩展可视高亮区域\n\n**问题：**\n你需要向任何方向扩展你的可视高亮。\n\n**解决方案：**\n在可视高亮状态下按下 `o` 或 `O`\
    \ 会将光标移动到可视高亮区域另一端。\n\n假设你开始高亮下方的文本，然后你发现也需要高亮上方文本。如果你向上移动，可视选择将会缩小。要将高亮扩展到上方文本，请先更改光标位置。\n\
    \n要更改光标位置，请按下 `o` 或 `O`。现在你的光标位于对侧位置，你就可以扩展并高亮上方的文本了。\n\n## 在可视模式下切换到不同的可视模式\n\
    \n**问题：**\n你目前正处于字符级可视模式，但你需要切换到行级可视模式。\n\n**解决方案：**\n在可视模式下，你可以通过按下另一个可视模式命令切换到不同的可视模式。\n\
    \n*   如果你处于字符级可视模式（`v`），按下行级可视模式命令（`V`）将切换到行级可视模式。\n*   如果你处于行级可视模式（`V`），按下块级可视模式命令（`Ctrl-V`）将切换到块级可视模式。\n\
    *   如果你处于块级可视模式（`Ctrl-V`），按下相同的可视模式命令（在此例中为块级可视模式命令 `Ctrl-V`）将退出可视模式。\n\n## 可视高亮上一个搜索术语\n\
    \n**问题：**\n你最近使用 `/donut` 进行搜索，现在发现需要跳回那个单词并修改它。\n\n**解决方案：**\n按下 `gn` 跳到下一个上一次搜索术语（类似于在\
    \ `/hello` 后按下 `n`），并自动高亮该搜索术语。\n\n假设你有以下文本：\n\n```\none donut\ntwo donut\nthree\
    \ donut\nfour donut\n```\n\n如果你刚刚搜索了 `/donut`，现在按下 `gn`，Vim 将跳转到下一个“donut”短语并进行可视模式高亮。\n\
    \n这与点命令（`.`）结合使用也非常有用。按下 `gn`，Vim 将高亮下一个“donut”。然后按下 `d` 删除它。要删除后续的 donut，只需运行\
    \ `n`（下一个匹配项）和 `.`。你现在可以重复 `n . n . . n .` 等。\n\n## 使用可视选择替换多个字符\n\n**问题：**\n\
    替换运算符 `r` 每次只能替换一个字符。\n\n**解决方案：**\n当你在可视高亮上使用 `r{something}` 时，Vim 将一次替换所有高亮文本。\n\
    \n在 markdown 中，`===` 代表标题。你可以用这种方法在以下文本上快速生成标题：\n\n```\nMy awesome title\n```\n\
    \n*   使用 `yy` 复制该行。\n*   使用 `p` 粘贴。\n*   使用 `V` 可视化高亮粘贴的文本。\n*   运行 `r=` 将选择替换为“=”。\n\
    \n`yypVr=`。这就是你创建所需的所有操作：\n\n```\nMy awesome title\n================\n```\n\n\
    # Vimrc\n\n## 快速访问 Vimrc\n\n**问题：**\n你需要快速访问 vimrc。\n\n**解决方案：**\n如果你经常编辑 vimrc，创建一个跳转到它的快捷键以及另一个加载（source）它的快捷键会很有用。\n\
    \n我在我的 vimrc 中有以下映射：\n\n```\nnnoremap <Leader>vs :source ~/.vimrc<CR>\nnnoremap\
    \ <Leader>ve :vsplit ~/.vimrc<CR>\n```\n\n当我需要打开 vimrc 时，只需运行 `<Leader>ve`。当我想要加载更改时，在保存\
    \ vimrc 后，只需运行 `<Leader>vs`。\n\n## 行号\n\n**问题：**\n你需要一个更清晰的指示来告诉你你在哪一行。\n\n**解决方案：**\n\
    使用 `:set number` 在左列显示行号。\n\n此外，你可能考虑使用 `:set relativenumber` 在左列显示相对行号。此设置对于行操作非常有用。你可以轻松看到想要删除的文本在上方或下方几行。\n\
    \n## 更实用的搜索\n\n**问题：**\n你需要在输入搜索短语时高亮单词。\n\n**解决方案：**\n`set incsearch` 设置增量搜索。通过它，Vim\
    \ 会在你输入搜索短语时高亮匹配项。\n\n最好与 `set hlsearch` 结合使用以高亮所有匹配项。\n\n然而，有时你不希望 Vim 显示高亮。要移除高亮，运行\
    \ `:noh`。\n\n由于我经常使用 `noh`，我设置了映射通过按下两次 `<Esc>` 来快速运行 `noh`。\n\n```\nnnoremap\
    \ <Esc><Esc> :noh<return><Esc>.\n```\n\n## 更智能的搜索大小\n\n**问题：**\n你需要 Vim 搜索得更智能，并在需要时忽略大小。\n\
    \n**解决方案：**\n使用 `set ignorecase smartcase` 同时实现不区分大小和智能大小搜索。\n\n*   如果你使用全小写或全大写字母（相同大小）进行搜索，Vim\
    \ 将执行忽略大小的搜索。\n*   如果你混合使用搜索词的大小，Vim 将执行大小敏感的搜索。\n\n给定：\n\n```\nhello\nHELLO\n\
    Hello\n```\n\n*   `/hello` 匹配“hello”、“Hello”、“HELLO”。\n*   `/Hello` 匹配“Hello”。\n\
    *   `/HELLO` 匹配“HELLO”。\n\n## 程序化选项\n\n**问题：**\n你需要通过程序方式设置某些选项。\n\n**解决方案：**\n\
    你可以使用 `&` 在 vimrc 中设置选项而不是使用 `set`。通过这种，你可以使用 Vimscript 表达式。\n\n与其运行 `set background=light`，不如运行\
    \ `let &background = \"light\"`。\n\n根据当前时间设置不同的背景值，请使用：\n\n```\nlet &background\
    \ = strftime(\"%H\") < 10 ? \"light\" : \"dark\"\n```\n\n## 创建自定义命令\n\n**问题：**\n\
    你需要创建你自己的 `:` 命令。\n\n**解决方案：**\n你可以使用 `:command` 创建一个自定义行命令。\n\n以下将创建一个自定义命令 `:GimmeDate`。\n\
    \n```\nfunction MyDate()\n  echo call(\"strftime\", [\"%F\"])\nendfunction\n\n\
    command GimmeDate call MyDate()\n```\n\n现在当你运行 `:GimmeDate` 时，Vim 将运行 `call MyDate()`。\n\
    \n## 根据目录条件运行 Vim 设置\n\n**问题：**\n你希望只在工作时使用某些选项，并在个人项目中使用另一组选项。\n\n**解决方案：**\n\
    要在当你在“Work”目录时将背景设置为深色，在不在“Work”目录时将背景设置为浅色，请将以下内容添加到你的 vimrc：\n\n```\nlet cwd\
    \ = getcwd()\nif cwd =~# \"Work\"\n  echom \"WORK STUFF\"\n  set background=dark\n\
    else\n  echom \"NON WORK STUFF\"\n  set background=light\nendif\n```\n\n## 使用折叠语法组织\
    \ Vimrc\n\n**问题：**\n你的 vimrc 变得越来越长，越来越难以阅读。\n\n**解决方案：**\n折叠语法可以帮助组织 vimrc。\n\
    \nVim 折叠语法默认使用 `{{{` 和 `}}}`。要激活它，运行 `:set foldmethod=marker`。你可以使用 `za` 切换折叠。\n\
    \n要为包括 vimrc 在内的所有 vim 相关文件自动设置标记折叠，请将以下内容添加到 vimrc 开头：\n\n```\naugroup filetype_vim\n\
    \  autocmd!\n  autocmd FileType vim setlocal foldmethod=marker\naugroup END\n\
    ```\n\n现在你可以根据类别组织 vimrc，例如：\n\n```\n\" Plugins {{{\ncall plug#begin('~/.vim/plugged')\n\
    \  your plugin here\ncall plug#end()\n\" }}}\n\n\" Setups {{{\nset relativenumber\
    \ number\nset ignorecase smartcase\nmore setup here\n\" }}}\n\n\" Functions {{{\n\
    function! SomeUsefulFunction()\n  dosomething\nendfunction\n\" }}}\n```\n\n"
- fmt: "\nEach time you open `vimrc`, this is what you’ll see:\n\n```\n+-- 5 lines:\
    \ Plugins -------\n\n+-- 5 lines: Setups --------\n\n+-- 5 lines: Functions -----\n\
    ```\n\n## Run a Specific Configuration Depending On File Type\n\n**Problem:**\n\
    You want to use different options depending on the current file type.\n\n**Solution:**\n\
    Vim allows you to run specific configurations when you’re on a certain file type.\n\
    \nVim can generally detect the type of the file you’re on. To check the file type\
    \ of the file you’re currently on, run `:set ft?`.\n\nFor example, if you are\
    \ on `test1.py`, running `:set ft?` will return `filetype=python`.\n\nVim has\
    \ a filetype plugin runtime system that lets you run a particular Vim script depending\
    \ on the filetype. You can find it inside the `.vim` directory. It is usually\
    \ located in the root path.\n\nInside this `.vim` directory, create a directory\
    \ named `ftplugin`. Inside it, create a file with the name of the file type you\
    \ want to have the custom settings. In this case, let’s create two filetype plugin\
    \ files, one for python and one for ruby.\n\n```\n~/.vim/ftplugin/python.vim\n\
    \n# Inside it:\n\nset background=light\n\n~/.vim/ftplugin/ruby.vim\n\n# Inside\
    \ it:\n\nset background=dark\n```\n\nWhen I open `test.py`, Vim has a light background.\
    \ When I open `test.rb`, Vim will have a dark background.\n\n## Toggle a Boolean\
    \ Option\n\n**Problem:**\nYou need to quickly toggle any Vim boolean options.\n\
    \n**Solution:**\nYou can toggle any Vim boolean option values with `!` suffix.\n\
    \nSome values like `number`, `relativenumber`, `wrapscan`, etc contain boolean\
    \ values (`set number`, `set relativenumber`, `set wrapscan`). Their opposite\
    \ values are usually prefixed with `no`: `nonumber`, `norelativenumber`, `nowrapscan`,\
    \ etc.\n\nOne way to turn off `set number` is to run `set nonumber`. A quicker\
    \ way is to toggle it with `set number!`.\n\nBy the way, recall that `@:` can\
    \ repeat the last command-line command. Since `:set number!` is just a command-line\
    \ command, you can use `@:` to toggle between Vim boolean options quickly.\n\n\
    ## Split Vimrc Into Multiple Files\n\n**Problem:**\nYour vimrc got too big and\
    \ you want to split it into multiple smaller files.\n\n**Solution:**\nYou can\
    \ keep your vimrc small by splitting it into multiple smaller files.\n\nTo use\
    \ this, create a new directory for your vimrc files called `settings/` (you can\
    \ name it anything you want): `~/.vim/settings/`.\n\nSuppose that you want to\
    \ split your vimrc into 4 sections, create these 4 files:\n\n*   Third-party plugins\
    \ (`~/.vim/settings/plugins.vim`).\n*   General settings (`~/.vim/settings/configs.vim`).\n\
    *   Custom functions (`~/.vim/settings/functions.vim`).\n*   Key mappings (`~/.vim/settings/mappings.vim`).\n\
    \nInside your main vimrc, add:\n\n```\nsource $HOME/.vim/settings/plugins.vim\n\
    \nsource $HOME/.vim/settings/configs.vim\n\nsource $HOME/.vim/settings/functions.vim\n\
    \nsource $HOME/.vim/settings/mappings.vim\n```\n\nThe key here is to use the `:source`\
    \ command. It is similar to `import` or `require` in many programming languages.\
    \ Inside each of these setting files, add the usual vimrc settings and configs.\n\
    \nInside `~/.vim/settings/plugins.vim`:\n\n```\ncall plug#begin('~/.vim/plugged')\n\
    \n  Plug 'mattn/emmet-vim'\n\n  Plug 'preservim/nerdtree'\ncall plug#end()\n```\n\
    \nInside `~/.vim/settings/configs.vim`:\n\n```\nset nocompatible\n\nset relativenumber\n\
    \nset number\n```\n\nInside `~/.vim/settings/functions.vim`:\n\n```\nfunction!\
    \ ToggleNumber()\n\n  if(&relativenumber == 1)\n\n    set norelativenumber\n \
    \ else\n    set relativenumber\n  endif\n\nendfunc\n```\n\nInside `~/.vim/settings/mappings.vim`:\n\
    \n```\ninoremap jk <esc>\n\nnnoremap <silent> <C-f> :GFiles<CR>\n\nnnoremap <Leader>tn\
    \ :call ToggleNumber()<CR>\n```\n\nNow your main vimrc is only 4 lines long!\n\
    \n## Mapping a New Key\n\n**Problem:**\nYou need to create custom mappings.\n\n\
    **Solution:**\nIf you find yourself repeatedly performing the same complex task,\
    \ it is a good indicator that you should create a new key mapping. There are a\
    \ number of things that you can map.\n\nThe first is the leader key. I like using\
    \ `<Space>` as my leader key. You can change the leader key with:\n\n```\nlet\
    \ mapleader = \"\\<space>\"\n```\n\nYou can also re-map operators and commands.\
    \ For example, I have these two mappings in my vimrc:\n\n```\nnnoremap <silent>\
    \ <C-f> :GFiles<CR>\n\nnnoremap <Leader>tn :call ToggleNumber()<CR>\n```\n\nThe\
    \ first mapping is a map to `fzf.vim` plugin’s `:GFiles` command. The second mapping\
    \ is a custom function call (I have a function called `ToggleNumber()`). By using\
    \ `<C-f>`, I am overwriting Vim’s native `Ctrl-F` native page scroll feature.\
    \ If your mapping collides with Vim’s native command, it will be overwritten.\n\
    \nThe command I use to map, `nnoremap`, is actually composed of three components:\n\
    \n*   `n` represents the normal mode.\n*   `nore` means non-recursive.\n*   `map`\
    \ is the map command.\n\nVim has a mapping for all sorts of modes. The `nnoremap`\
    \ means it will work in normal mode.\n\nIf I want to create mapping in insert\
    \ mode, I’ll use the `i` prefix:\n\n```\ninoremap jk <Esc>\n```\n\nThis only works\
    \ in insert mode and not in normal mode.\n\nIt is also important to use the non-recursive\
    \ version (by using `nnoremap` and `inoremap` instead of `nmap` and `imap`) because\
    \ you could accidentally create an infinite loop.\n\nLet’s do an example. The\
    \ mapping below supposedly moves the cursor to the end of the line, adds a semi-colon,\
    \ then go back one WORD.\n\n```\nnmap B A;<Esc>B\n```\n\nSo what happens when\
    \ you press `B`? Vim adds `;` uncontrollably (interrupt with `Ctrl-C`), because\
    \ in the mapping, the `B` in `A;<Esc>B` doesn’t refer to Vim’s native back-one-WORD\
    \ action, but itself. What you actually have is a recursive call of:\n\n```\n\
    A;<esc>A;<esc>A;<esc>A;esc>...\n```\n\nWhat you want is for Vim to use Vim’s native\
    \ `B` back-one-WORD action, so you use the non-recursive map:\n\n```\nnnoremap\
    \ B A;<Esc>B\n```\n\nIn general when you’re not sure whether to use `nore` or\
    \ not, always use it.\n\nThe other map modes are: map (Normal, Visual, Select,\
    \ and Operator-pending), vmap (Visual and Select), smap (Select), xmap (Visual),\
    \ omap (Operator-pending), map! (Insert and Command-line), lmap (Insert, Command-line,\
    \ Lang-arg), cmap (Command-line), and tmap (terminal-job). I won’t cover them\
    \ in detail. To learn more, check out `:h map.txt.\n\nYou may find that it is\
    \ easier to copy someone else’s vimrc. Although that’s fine, I would suggest building\
    \ your own vimrc from scratch. Everyone codes differently. Create a set of mappings\
    \ that work best for you. Make your vimrc yours.\n\n## Installing Plugins With\
    \ Packages\n\n**Problem:**\nYou want to install plugins with Vim.\n\n**Solution:**\n\
    Ever since version 8, Vim comes with its own built-in plugin manager called packages.\n\
    \nVim will check inside a directory named `pack` inside the `.vim` directory (`~/.vim/pack/`).\
    \ The package feature supports two loading mechanisms:\n\n*   Automatic plugin\
    \ loading.\n*   Manual plugin loading.\n\nTo load a plugin automatically, you\
    \ need to put it inside the `start/` directory using the following path:\n\n```\n\
    ~/.vim/pack/*/start/\n```\n\nNote the asterisk `*` means an arbitrary name. You\
    \ can name it anything you want. In this case, let’s call it `packdemo`:\n\n```\n\
    ~/.vim/pack/packdemo/start/\n```\n\nYou cannot skip the directory between `pack/`\
    \ and `start/`. If you try to do this, it won’t work. You must put a directory\
    \ name between `pack/` and `start/`.\n\n```\n~/.vim/pack/start/\n```\n\nSuppose\
    \ that you want to install the NERDTree plugin. In the terminal, go all the way\
    \ to the `start/` directory and clone the NERDTree repository there.\n\n```\n\
    cd ~/.vim/pack/packdemo/start/\n\ngit clone https://github.com/preservim/nerdtree.git\n\
    ```\n"
