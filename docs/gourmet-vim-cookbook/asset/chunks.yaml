    # 文件


    ## 缓冲区、窗口、标签页

    **问题：**

    你听说 Vim 使用缓冲区（buffers）、窗口（windows）和标签页（tabs），但你不确定它们意味着什么。


    **解决方案：**

    缓冲区、窗口和标签页是 Vim 管理文件和布局的方法。许多文本编辑器只使用两种抽象：窗口和标签页。


    那么什么是缓冲区呢？缓冲区是用于存储文本的内存空间。当你在 Vim 中打开一个文件时，Vim 会打开一个缓冲区来存储该文件数据。当你在 Vim 中打开 3
    个文件时，你有 3 个打开的缓冲区。


    顺便说一下，确保你在 Vimrc 中设置了 `set hidden` 。如果没有它，每当你切换缓冲区且当前缓冲区有未保存的更改时，Vim 会报错并提示你保存文件。这会降低你的速度。


    窗口是缓冲区上的视口。从外部看，Vim 窗口看起来大多数大多数编辑器的窗口一样。你可以打开多个窗口并进行垂直和/水平排列。多个窗口可以指向同一个缓冲区。记住，每个缓冲区代表每个已打开的文件。你可以打开两个窗口，它们都指向同一个缓冲区
    `file1.txt`。你可以只打开一个窗口，但实际上你有 3 个打开的缓冲区：`file1.txt`、`file2.txt` 和 `file3.txt`。窗口是你用来查看缓冲区的工具。缓冲区才是实际的文件。


    标签页是窗口的集合。把它想象成窗口的布局。在现代文本编辑器中，如果你关闭一个标签页，该标签页中的文件就会消失。同样，在网页浏览器中，如果你关闭网页标签页，该页面就消失。在
    Vim 中，标签页并不代表打开的文件（记住，缓冲区代表实际的文件）。你可以关闭显示 `file1.txt` 的窗口标签页，但该文件仍在后台缓冲区中打开。


    简而言之：


    * 缓冲区是文件的内存空间。

    * 窗口是缓冲区上的视口。

    * 两个窗口可以指向同一个缓冲区，也可以两个窗口指向两个不同的缓冲区。

    * 标签页是窗口的布局。


    ## 语法相似的两个不同写入命令

    **问题：**

    运行 `:w !food` 和 `:w! food` 得到了两个完全不同的结果。区别是什么？


    **解决方案：**

    `:w !food` 和 `:w! food` 实际上是两个不同的命令（尽管它们的非常相似）。


    * `:w !food` 执行外部命令 `food`（如果不存在则抛出错误），并将你的缓冲区内容作为标准输入（STDIN）。

    * `:w! food` 将当前缓冲区保存为 `food`。


    ## 保存需要 root 权限的文件

    **问题：**

    你需要保存一个文件，但需要 root 权限。


    **解决方案：**

    使用 `:w !sudo tee %` 保存需要 root 权限的文件。这使用了与上述类似的写入语法。记得 `:w !cmd` 执行终端命令 `cmd`。在这种情况下，命令是
    `sudo tee`。


    `%` 在 Vim 中代表当前文件。


    ## 时空旅行

    **问题：**

    你需要将文件状态恢复到 15 分前的状态。


    **解决方案：**

    你可以使用 `:earlier` 回到较早的文本状态。要回到 15 分前的文本状态，运行 `:earlier 15m`。该命令接受其他单位：`s`（秒）、`h`（小时）、`d`（天）和
    `f`（保存次数）。


    要回到较后的状态，有一个对应的 `:later` 命令（我真希望我直接运行 `:later 8h` 然后就搞定工作，但那行不通……）。


    ## 将当前文件转换为 HTML

    **问题：**

    你想像 Vim 那样将当前文件转换为 HTML。


    **解决方案：**

    Vim 有 `:%TOhtml`可以将当前文档转换为 HTML 版本。它会在当前目录下生成一个新文件 `your_original_file_name.txt.html`。


    ## 打开 URL 内容

    **问题：**

    你需要编辑网页的内容。


    **解决方案：**

    你可以直接获取 URL 内容：`vim https://www.google.com/`。


    ## 保存部分文件

    **问题：**

    你只需要保存文件的部分。


    **解决方案：**

    你可以使用 `:{range1},{range2}w filename` 保存部分文件。要将第 5 和第 10 行保存为 `partial_stuff.txt`，运行
    `:5,10w partial_stuff.txt`。


    ## 显示缓冲区列表

    **问题：**

    你需要查看哪些缓冲区是打开的。


    **解决方案：**

    Vim 有命令 `:ls`、`:buffers` 和 `:files` 显示缓冲区列表。


    为什么要使用缓冲区？缓冲区是 Vim 快速跳转到不同文件的方法。大多数文本编辑器只有两种抽象：窗口和标签页。Vim 有三个：缓冲区、窗口和标签页。


    Vim 将所有当前打开的文件保存在内存的缓冲区中。如果你打开了 `file1.txt`、`file2.txt` 和 `file3.txt`，你有 3 个缓冲区。


    跳转到特定缓冲区有不同的方法：


    * 数字方法：跳转到缓冲区 #9，运行 `:buf 9`。

    * 文件名方法：跳转到 `file2.txt` 缓冲区，运行 `:buf file2.txt`。

    * `:bnext` 和 `:bprevious` 跳到列表中的下一个和上一个缓冲区。

    * `:brewind` 跳到缓冲区列表中的第一个（`:blast` 跳到最后一个——玩得开心吗？:D）。


    最后，使用 `:bd file1.txt` 从缓冲区列表中移除 `file1.txt`。


    缓冲区是使用 Vim 编辑时一种智能的文件管理方法。它为你创建一个快捷文件列表。我强烈建议你在日常 Vim 编辑中多利用缓冲区！


    ## Vim 标签页

    **问题：**

    你需要打开一个新的标签页。


    **解决方案：**

    Vim 有标签页系统来包含你的窗口布局。所有缓冲区在不同的标签页之间共享。


    一些实用的标签页导航是：


    ```

    :tabnew file.txt    在新标签页中打开 file.txt

    :tabclose           关闭当前标签页

    :tabnext            跳转到下一个标签页

    :tabprevious        跳转到上一个标签页

    :tablast            跳转到最后一个标签页

    :tabfirst           跳转到第一个标签页

    ```


    顺便说一下，如果你想带多个标签页启动 Vim，从终端运行此命令：


    ```

    vim -p file1.txt file2.txt file3.txt

    ```

