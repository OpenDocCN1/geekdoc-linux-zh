    *   Custom functions (`~/.vim/settings/functions.vim`).\n*   Key mappings (`~/.vim/settings/mappings.vim`).\n\
    \nInside your main vimrc, add:\n\n```\n\nsource $HOME/.vim/settings/plugins.vim\n\
    \nsource $HOME/.vim/settings/configs.vim\n\nsource $HOME/.vim/settings/functions.vim\n\
    \nsource $HOME/.vim/settings/mappings.vim\n\n```\n\nThe key here is to use the\
    \ `:source` command. It is similar to `import` or `require` in many programming\
    \ languages. Inside each of these setting files, add the usual vimrc settings\
    \ and configs.\n\nInside `~/.vim/settings/plugins.vim`:\n\n```\n\ncall plug#begin('~/.vim/plugged')\n\
    \n  Plug 'mattn/emmet-vim'\n\n  Plug 'preservim/nerdtree'\n\ncall plug#end()\n\
    \n```\n\nInside `~/.vim/settings/configs.vim`:\n\n```\n\nset nocompatible\n\n\
    set relativenumber\n\nset number\n\n```\n\nInside `~/.vim/settings/functions.vim`:\n\
    \n```\n\nfunction! ToggleNumber()\n\n  if(&relativenumber == 1)\n\n    set norelativenumber\n\
    \n  else\n\n    set relativenumber\n\n  endif\n\nendfunc\n\n```\n\nInside `~/.vim/settings/mappings.vim`:\n\
    \n```\n\ninoremap jk <esc>\n\nnnoremap <silent> <C-f> :GFiles<CR>\n\nnnoremap\
    \ <Leader>tn :call ToggleNumber()<CR>\n\n```\n\nNow your main vimrc is only 4\
    \ lines long!\n\n## Mapping a New Key\n\n**Problem:**\nYou need to create custom\
    \ mappings.\n\n**Solution:**\nIf you find yourself repeatedly performing the same\
    \ complex task, it is a good indicator that you should create a new key mapping.\
    \ There are a number of things that you can map.\n\nThe first is the leader key.\
    \ I like using `<Space>` as my leader key. You can change the leader key with:\n\
    \n```\n\nlet mapleader = \"\\<space>\"\n\n```\n\nYou can also re-map operators\
    \ and commands. For example, I have these two mappings in my vimrc:\n\n```\n\n\
    nnoremap <silent> <C-f> :GFiles<CR>\n\nnnoremap <Leader>tn :call ToggleNumber()<CR>\n\
    \n```\n\nThe first mapping is a map to `fzf.vim` plugin’s `:GFiles` command. The\
    \ second mapping is a custom function call (I have a function called `ToggleNumber()`.\
    \ By using `<C-f>`, I am overwriting Vim’s native `Ctrl-F` native page scroll\
    \ feature. If your mapping collides with Vim’s native command, it will be overwritten.\n\
    \nThe command I use to map, `nnoremap`, is actually composed of three components:\n\
    \n*   `n` represents the normal mode.\n*   `nore` means non-recursive.\n*   `map`\
    \ is the map command.\n\nVim has a mapping for all sorts of modes. The `nnoremap`\
    \ means it will work in normal mode.\n\nIf I want to create mapping in insert\
    \ mode, I’ll use the `i` prefix:\n\n```\n\ninoremap jk <Esc>\n\n```\n\nThis only\
    \ works in insert mode and not in normal mode.\n\nIt is also important to use\
    \ the non-recursive version (by using `nnoremap` and `inoremap` instead of `nmap`\
    \ and `imap`) because you could accidentally create an infinite loop.\n\nLet’s\
    \ do an example. The mapping below supposedly moves the cursor to the end of the\
    \ line, adds a semi-colon, then go back one WORD.\n\n```\n\nnmap B A;<Esc>B\n\n\
    ```\n\nSo what happens when you press `B`? Vim adds `;` uncontrollably (interrupt\
    \ with `Ctrl-C`), because in the mapping, the `B` in `A;<Esc>B` doesn’t refer\
    \ to Vim’s native back-one-WORD action, but itself. What you actually have is\
    \ a recursive call of:\n\n```\n\nA;<esc>A;<esc>A;<esc>A;esc>...\n\n```\n\nWhat\
    \ you want is for Vim to use Vim’s native `B` back-one-WORD action, so you use\
    \ the non-recursive map:\n\n```\n\nnnoremap B A;<Esc>B\n\n```\n\nIn general when\
    \ you’re not sure whether to use `nore` or not, always use it.\n\nThe other map\
    \ modes are: map (Normal, Visual, Select, and Operator-pending), vmap (Visual\
    \ and Select), smap (Select), xmap (Visual), omap (Operator-pending), map! (Insert\
    \ and Command-line), lmap (Insert, Command-line, Lang-arg), cmap (Command-line),\
    \ and tmap (terminal-job). I won’t cover them in detail. To learn more, check\
    \ out :h map.txt.\n\nYou may find that it is easier to copy someone else’s vimrc.\
    \ Although that’s fine, I would suggest building your own vimrc from scratch.\
    \ Everyone codes differently. Create a set of mappings that work best for you.\
    \ Make your vimrc yours.\n\n## Installing Plugins With Packages\n\n**Problem:**\n\
    You want to install plugins with Vim.\n\n**Solution:**\nEver since version 8,\
    \ Vim comes with its own built-in plugin manager called packages.\n\nVim will\
    \ check inside a directory named `pack` inside the `.vim` directory (`~/.vim/pack/`).\
    \ The package feature supports two loading mechanisms:\n\n*   Automatic plugin\
    \ loading.\n*   Manual plugin loading.\n\nTo load a plugin automatically, you\
    \ need to put it inside the `start/` directory using the following path:\n\n```\n\
    \n~/.vim/pack/*/start/\n\n```\n\nNote the asterisk `*` means an arbitrary name.\
    \ You can name it anything you want. In this case, let’s call it `packdemo`:\n\
    \n```\n\n~/.vim/pack/packdemo/start/\n\n```\n\nYou cannot skip the directory between\
    \ `pack/` and `start/`. If you try to do this, it won’t work. You must put a directory\
    \ name between `pack/` and `start/`.\n\n```\n\n~/.vim/pack/start/\n\n```\n\nSuppose\
    \ that you want to install the NERDTree plugin. In the terminal, go all the way\
    \ to the `start/` directory and clone the NERDTree repository there.\n\n```\n\n\
    cd ~/.vim/pack/packdemo/start/\n\ngit clone https://github.com/preservim/nerdtree.git"
