    * `qa` to record a macro in the register a.

    * `gUU` to uppercase the current line.

    * `j` to go down one line.


    To replay a recorded macro on register a, run `@a`. To play the last executed
    macro, run `@@`.


    ## Register Basics


    **Problem:**

    You heard that Vim can save texts in different registers.


    **Solution:**

    Vim registers work like your computer clipboard. Vim comes shipped with 10 registers.
    I won’t go over them in detail here. They are:


    * The unnamed register (`""`).

    * The numbered registers (`"0-9"`).

    * The small delete register (`"-"`).

    * The named registers (`"a-z"`).

    * The read-only registers (`":"`, `"."`, and `"%`).

    * The alternate file register (`"#"`).

    * The expression register (`"=").

    * The selection registers (`"*"` and `"+"`).

    * The black hole register (`"_"`).

    * The last search pattern register (`/"`).


    They can be used in a composition with other operators. Run `"` followed by the
    register symbol, then the operator. Registers are commonly used with the yank
    (`y`) operator and the delete (`d`) operator, but it can be used with other operators
    too. You can also enter the content of a register directly. `:put a` outputs the
    content from register a. While in insert mode, you can press `Ctrl-R a` to get
    the content from register a.


    If you need to yank the current word into register a, run `"ayiw`. To paste that
    content, run `"ap`.


    Registers and macros are closely related. If you think about it, macros are executed
    registers. When you record a macro in register a (`qagUUjq`), you are actually
    recording a string of instructions (if you don’t believe me, after running `qagUUjq`,
    run `"ap` and you should see the key sequence of your actions printed out).


    ## Closer Look At Vim Registers


    **Problem:**

    You saw that Vim has 10 registers. How do you use them?


    **Solution:**

    As mentioned above, Vim has 10 different registers. Some are automatically filled
    by Vim while some have to be explicitly inserted.


    The unnamed register stores the last text you yanked, changed, or deleted. The
    unnamed register is like a computer’s standard copy / paste operation. To get
    the text from the unnamed register, do `""p`. The paste commands, `p` and `P`,
    automatically pastes from the unnamed registers.


    There are two types of numbered registers: the 0 register and the 1-9 registers.


    The 0 register is reserved for the yanked register (also known as the yank register).
    If you yank a line, like `yy`, it will be stored in register 0. `"0p` to paste
    it.


    The 1-9 registers are reserved for deletions or changes. If you delete a line,
    `dd`, the deleted text will be stored in the numbered register starting from 1
    going all the way up to 9, chronologically. If you do `dd` 3 times, the most recent
    deletion will be stored in register 1, the second most recent deletion in 2, and
    the third recent deletion in 3. To paste them, use `"1p`, `"2p`, `"3p`, etc.


    The small delete register stores deletions or changes that are less than one line.
    If you delete a word (like `diw`), you can access it with `"-p` (the registers
    1-9 only store deletes or changes that are at least one line size).


    The named register is probably one of the most used registers. It uses the characters
    a-z to store yanked, changed, or deleted texts. To delete a word into the register
    a, run `"adiw`. To paste it, run `"ap`. To yank the rest of the line into the
    register b, run `"by$`. To paste it, run `"bp`.


    The read-only registers are automatically handled by Vim. `.` stores the last
    inserted text, `:` stores the last executed command-line command, and `%` stores
    the name of the current file.


    The alternate file register stores the name of the alternate file (the other file
    you just edited).


    The expression register lets you evaluate Vimscript expressions. To get the result
    of calculating the expression 1 + 1, run `"=1+1<Enter>`, then press `p`.


    The selection registers, `*` and `+` are used to connect Vim to your computer
    clipboard. By default, if you copy something (for example, a text that you copy
    from a website), you can’t paste it immediately to Vim and vice versa (if you
    yank something in Vim, you can’t paste it outside of Vim). To paste a text from
    the system clipboard into Vim, run either `"+p` or `"*p`. The difference between
    `*` and `+` registers are historical. If Vim has `+xterm_clipboard` and your machine
    uses X11’s primary selection, Vim uses `*` register. If your machine uses X11’s
    clipboard selection, Vim uses `+`. To be frank, don’t worry about it too much.
    Most of the time, they are interchangeable.


    However, I find that doing `"*p` to paste and `"*yy` to yank is a lot of work.
    Add this in vimrc:


    ```

    set clipboard=unnamed

    ```

