    # 重复


    ## 重复上一次命令行命令


    **问题：**

    你需要重复上一次的命令行命令。


    **解决方案：**

    使用 `@:` 重复上一次命令行命令。


    如果你刚刚运行了 `:s/donut/pancake`，可以使用 `@:` 重复执行它。


    ## 重复上一次修改


    **问题：**

    你需要重复上一次所做的修改。


    **解决方案：**

    你可以使用 `.`（点命令）来重复上一次修改。


    如果你输入了“I love breakfast”，可以通过按下点命令（`.`）再次插入该文本。


    ## 重复上一次替换


    **问题：**

    你需要重复上一次替换。


    **解决方案：**

    使用 `:&` 或 `&` 重复上一次替换。如果你执行了 `:s/donut/waffle/g`，然后运行 `&`，Vim 将在当前行执行 `:s/donut/waffle`。不过，Vim
    不记得 `g` 标志。


    要重复上一次替换并记住标志，可以使用 `:&&`。如果你执行了 `:s/donut/waffle/g` 并运行 `:&&`，Vim 将在当前行执行 `:s/donut/waffle/g`。


    要在所有具有相同标志的行上重复上一次替换，请使用 `g&`。


    如果你执行 `:s/donut/pancake/g` 然后运行 `g&,`，Vim 会运行 `:%s/donut/pancake/g`。从技术上讲，Vim
    的是 `:%s//~/&`，它包含：


    * `%`s 对所有行进行替换

    * `//` 重复上一个模式

    * `~` 重复替换字符串

    * `&` 使用最后一个标志


    ## 重复上一次执行的宏


    **问题：**

    你需要重复上一次执行的宏


    **解决方案：**

    你可以使用 `@@` 重复上一次执行的宏。


    如果你刚刚通过 `@a` 执行了宏 a，运行 `@@` 将再次执行该宏。


    ## 重复上一次外部命令


    **问题：**

    你需要重复上一次的外部命令。


    **解决方案：**

    你可以使用 `:!!` 重复上一次的外部命令执行 (`:!{cmd}`)。


    如果你刚刚运行了 `:!ls -l`，运行 `:!!` 将重新运行 `:!ls -l`。


    # 排序


    ## 对行排序


    **问题：**

    你需要对多行按字母顺序排序。


    **解决方案：**

    Vim 有 `:sort` 命令可以对多行进行排序。你可以执行以下操作：


    * 排序整个文件，运行 `:sort`。

    * 对第 5-10 行进行排序，运行 `:5,10 sort`。


    该命令还接受标志以不同的方式排序行。


    如果你有重复行：


    ```

    pancake

    donut

    waffle

    donut

    ```


    运行 `:sort u` 对它们进行排序并删除重复项。


    Vim 的 `:sort` 无法正确排序数字。如果你有：


    ```

    2 donuts

    1 donut

    11 donut

    10 donuts

    ```


    运行 `:sort` 将得到：


    ```

    1 donut

    10 donuts

    11 donut

    2 donuts

    ```


    要修复此，运行 `:sort n`。


    使用 `:sort /pattern/` 根据模式进行排序。


    ```

    pancake, donut, waffle

    sushi, pasta, taco

    apple, banana, carrot

    water, apple juice, milk

    ```


    * 如果你想根据第二个项目（“donut”对比“pasta”, “banana”, “apple juice”）进行排序，可以使用 `:sort /,/`。Vim
    将使用匹配项后的字符进行排序。

    * 如果你想根据第三个项目（“waffle”对比“taco”对比“carrot”对比“milk”）进行排序，可以使用 `:sort /,.\+,/`。


    ## 外部排序


    **问题：**

    你需要使用不同的排序程序。


    **解决方案：**

    记住你可以使用外部命令作为过滤器。你的终端可能带有 `sort` 命令。要使用终端 `sort` 命令进行排序，运行 `:%!sort`。


    注意：在使用外部命令过滤 Vim 中的文本时，请传递范围。


    * 排序整个文件，运行 `:%!sort`。

    * 对第 5-10 行进行唯一排序，运行 `:5,10!sort -u`。


    ## 逆序排序


    **问题：**

    你需要进行逆序排序。


    **解决方案：**

    你可以通过 `:sort!` 进行逆序排序。


    你也可以使用终端 `sort` 命令，`:%!sort -r`。


    # 替换


    ## 基本替换


    **问题：**

    你需要替换一个模式。


    **解决方案：**

    替换命令是一个多功能 Vim 命令，可能是你经常使用的命令。它的基本语法为：


    ```

    :s/pattern1/pattern2

    ```


    在当前行将“donut”替换为“pancake”，运行 `:s/donut/pancake`。注意，如果同一行有多个“donut”，Vim 只替换第一个。要替换多个实例，请传递全局
    (`g`) 标志：`:s/donut/pancake/g`。


    你可以在范围内执行替换。


    * 在第 2 到 5 行之间将“donut”替换为“pancake”：`:2,5s/donut/pancake/g`。

    * 在整个缓冲区将“donut”替换为“pancake”，运行 `:%s/donut/pancake/g`。


    ## 不区分大小写匹配


    **问题：**

    你需要进行不区分大小写的替换匹配。


    **解决方案：**

    使用 `i` 标志进行不区分大小写的匹配。


    如果你运行 `:%s/dOnuT/salad/gi`，它会将“donut”、“dOnuT”和“DONUT”替换为“salad”。当你匹配一个大小写变化的短语时，这非常有用。


    ## 替换前确认


    **问题：**

    你希望 Vim 在替换前询问确认。


    **解决方案：**

    使用 `c` 标志在替换前进行确认。


    如果你在一个大型缓冲区中工作，并且只需要替换*部分*而不是所有匹配项，这是一个完美的解决方案。


    假设你需要将“donuts”替换为“waffle”，你可以运行 `:%s/donut/waffle/gc`。


    ```

    Chocolate donut

    Strawberry donut

    Vanilla donut

    ```


