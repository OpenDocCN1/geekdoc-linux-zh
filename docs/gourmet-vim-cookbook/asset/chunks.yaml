    ![](img/title_page.png)


    ![Gourmet Vim Cookbook](img/title_page.png)


    # 美味 Vim 食谱


    ### 200+ 个 Vim 技巧集


    #### Igor Irianto


    此书可在 [`leanpub.com/gourmetvim`](http://leanpub.com/gourmetvim) 购买。


    此版本于 2021-04-10 发布。


    ![publisher''s logo](img/leanpub-logo.png)


    * * * * * *


    这是一本 [Leanpub](http://leanpub.com) 书籍。Leanpub 通过精益出版（Lean Publishing）流程为作者和出版社提供支持。[精益出版](http://leanpub.com/manifesto)
    是使用轻量级工具和多次迭代来出版进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在成功后建立影响力。


    * * * * * *


    © 2021 Igor Irianto


    ## 目录


    ## 指南


    1. 开始阅读


    # 基础知识


    ## 这本书是关于什么的？


    文本编辑是一门艺术。


    在编程时，我们编写可复用的代码。为什么文本编辑又有什么不同呢？


    《美味 Vim 食谱》探索了使用 Vim 进行高效文本编辑的艺术，包含了 200 多个实用示例。在学习新技能时，示例是不可或缺的，大量的示例能更有效地巩固这些概念。


    书中充满了关于如何在 Vim 中执行常见（以及一些不常见）操作的技巧和窍门，你可以立即进行练习。它将帮助你像专业人士一样使用 Vim（即使你已经是专家，也总有新东西可以学习）。


    当你读完这本书后，你的 Vim 水将比以往任何时候都更好。


    ## 一些命名规范


    在这里我将以 `:` 开头的命令称为“命令行命令”（command-line commands）。其他文献可能将其称为“Ex 命令”。如果你怀疑它们是否有不同，其实它们是同一回事。


    在这里我将从 Vim 内部访问的终端命令称为“外部命令”。你可能在互联网上听到它们被称为“过滤器命令”（filter command）或“感叹运算符”（bang
    operator）。同样，这些指的同一东西。


    ## Vimscript 在哪里？


    书中的一些技巧使用了 Vimscript（Vim 的内置脚本语言）。然而，你会发现并没有专门的 Vimscript 章节。这是因为这本书的主要初衷是实用的
    Vim 使用。


    包含专门的 Vimscript 章节将指数级地扩大本书范围，因为现在处理的是一整门编程语言。但是，如果你想学习 Vimscript 基础，请查看我的其他作品
    [Learn-Vim](https://github.com/iggredible/Learn-Vim)。


    ## 为什么你这样组织这本书？


    起初，我计划写一本巨大的单体食谱（我确实这么做了）。但很难查找。所以我决定将它们分成不同的类别。


    食谱被组织在不同的类别下，可能会存在重叠。


    ## 如何阅读这本书？


    你可以按照任何顺序阅读食谱。它们是完全独立的。


    这是一本实用的书。要精通 Vim，你需要肌肉记忆而不是头记忆。你不能只通过阅读食谱来学烹饪。你通过实际烹饪来学习。


    你需要配合每个食谱中看到的每一个命令进行输入。重复几次。尝试不同的变化。阅读该命令的 `:help` 页面。理解大局。你的目标是能够自然且本能地执行该命令。


    学习概念，而不是命令。


    # 导航


    ## 基础导航


    **问题：**


    在 Vim 中移动的命令太多，难以记忆。


    **解决方案：**


    你不需要学习所有的 Vim 导航键。你只需要记住几个重要的键就可以舒适地移动。


    如果你是初学者，我建议你背下这几个命令：


    * `h/j/k/l` - 左 / 下 / 上 / 右。

    * `w/e/b` - 前进到下一个单词的开头 / 前进到下一个单词的末尾 / 后退到上一个单词的开头。

    * `{/}` - 上一个段 / 下一个段。

    * `gg/G` - 文件开头 / 文件末尾。


    就这些。不到十几个键。随着学习的进行，你可以学习更多的导航键。


    ## 在文件间切换


    **问题：**


    你需要快速返回到上一个文件。


    **解决方案：**


    使用 `Ctrl-^` 在当前文件和上一个编辑的文件之间切换。


    当你向 `Ctlr-^` 传递一个数字时，Vim 将跳转到缓冲区列表（buffer list）中的对应缓冲区编号。如果你打开了 5 个缓冲区并运行：


    * `5 Ctrl-^`，Vim 将跳转到缓冲区 5。

    * `2 Ctrl-^`，Vim 将跳转到缓冲区 2。


    你也可以使用 `Ctrl-I` 和 `Ctrl-O` 快速跳转到跳转列表（jump list）中的上一个和光标位置。


    Vim 会记住你跳转到哪里并将其存储在跳转列表 (`:jumps`) 中。`Ctrl-I` 和 `Ctrl-O` 让你在该列表中移动。这对于追踪轨迹很有用。


    跳转通常是指光标移动超过一行的动作（`ijkl 不是跳转，但 `{}` 是）。


    ## 导航括号、中括号和大括号


    **问题：**


    你迷失在了括号的丛林中。


    **解决方案：**


    使用 `%` 跳转到匹配的括号/中括号/大括号 (`( ) [ ] { }`)。


    如果你有像 `(lambda (y) ((lambda (x) (* x y)) 3))` 这样的表达式，你可以用 `%` 快速导航到括号的另一端。


    ## 跳转到不同行


    **问题：**


    你需要跳转到文件中不同的行号。


    **解决方案：**


    Vim 有不同的行操作符跳转到不同的行。


    * 你可以使用 `:n` 或 `nG` 跳到第 n 行。如果你需要跳转到第 10 行，运行 `:10` 或 `10G`。

    * 如果你向 `%` 传递计数，它现在是一个行操作符。`50%` 跳到文件中间。`67%` 跳到文件的 2/3 处。


    ## 同行内导航


    **问题：**


    你需要跳转到同一行的不同列。


    **解决方案：**


    * 使用 `f` 和 `t` 进行正向和反向行内搜索。要跳转到当前行的下一个“a”，运行 `fa`。要跳转到下一个“b”，运行 `tb`。要重复此搜索，使用
    `;` 正向搜索，使用 `,` 反向搜索。

    * 使用 `0` 和 `$` 跳到行首和行尾。你也可以通过 `g0` 和 `g$` 跳到换行行的开头和末尾。要启用换行，运行 `set wrap`。

    * 使用 `^` 和 `g_` 跳到行的第一个和最后一个非空字符。

    * 使用 `n|` 跳到当前行的第 n 列。`10|` 带你到第 10 列。


    ## 屏幕调整


    **问题：**


    你需要将光标居中到屏幕中心。


    **解决方案：**


    * 使用 `H M L` 将光标置于屏幕顶部、中部或下部。

    * 使用 `zb`, `zz` 和 `zt` 将当前行移动到屏幕底部、中心或顶部。


    ## 滚动


    **问题：**


    你在 Vim 中无法使用鼠标，因此无法滚动。


    **解决方案：**


    Vim 允许你使用 `Ctrl-E / D / F` 和 `Ctrl-Y / U / B` 向上或向下滚动一行/半屏/全屏。


    ## 回上次……


    **问题：**


    你刚刚执行了一个操作，想回到执行该操作的地方。


    **解决方案：**


    Vim 会记住你执行的很多操作。你可以通过标记（marks）快速回到执行操作的地方。


    Vim 标记可以记录位置。有两种不同的标记精确度：行标记（不精确）和位置标记（更精确）。


    行标记使用单引号，如 `''m`（其中 m 是标记符号），位置标记使用单反引号，如 ``` `m```。行标记只会带你到正确的行。位置标记将带你到正确的行列。在以下示例中，我将只使用行标记，但记住每个行标记都有对应的位置标记。


    使用 `''[` 或 `'']` 跳转到最近更改或复制的文本的开头或结尾。


    如果你最近对以下短语运行了 `yj`：


    ```

    I am a phrase


    I am another phrase

    ```


    '
- fmt: '

    ```

    Pressing `'']` puts your cursor on the second line.


    Use `''<` or `''>` to go to the start or end of a recently visually highlighted
    text.


    If you recently ran `Vj` to highlight the current line and the line below on the
    following phrase:


    ```

    I am a phrase

    I am another phrase

    ```


    Pressing `''>` puts your cursor on the second line.


    Use `''.` to go to the recently modified line.


    If you recently inserted, modified, or deleted a text, pressing `''.` puts the
    cursor on that line.


    Use `''''` to quickly jump to the last position before your last jump. Use double
    backticks for the location mark counterpart.


    Use `''0` to go to the last position before you exited Vim.


    ## Go to the Filename Under the Cursor


    ### Problem

    You need to jump to a file.


    ### Solution

    When your cursor is on a filename, use `gf` to jump to that file.


    If your cursor is on `"./some_lib.py"`, pressing `gf` will take you to the file
    `some_lib.py` relative to the current directory. If that file doesn’t exist, Vim
    will throw an error.


    ## Go to the Place Where a Text Was Inserted and Enter the Insert Mode


    ### Problem

    You recently wrote a text and you needed to add to that text.


    ### Solution

    With `gi`, you can go to where the last text was inserted and automatically enter
    the insert mode.


    This is useful when you just wrote something and you needed to add to that text.
    It only works within a file (if you recently wrote something on a different file,
    pressing `gi` won’t take you to the other file).


    # Search


    ### Basic Search


    ### Problem

    You need to do a basic keyword search in Vim.


    ### Solution

    You can do a basic keyword search with `/keyword` to search forward and `?keyword`
    to search backward. You can either search for a literal word or use a regular
    expression.


    To repeat the last search forward, use `n`. To repeat the last search backward,
    use `N`.


    ### Starting Regex

    ### Problem

    You want to start using a regular expression in your searches, but don’t know
    where to start.


    ### Solution

    You can get really far with only a little regular expression knowledge. These
    four should be enough to get started:


    - `.` - any character.

    - `n+` - one or more n.

    - `n*` - zero or more n.

    - `n{2,5}` - between two to five n.


    You have to escape the `+` and `{ }` symbols or else Vim will treat them as a
    literal character.


    - `/d.g` matches “dog”, “dig”, “dug”.

    - `/a\+` matches “a”, “aa”, “aaaaaaaaaa”, etc.

    - `/a*` matches “”, “a”, “aaaaa”, etc.

    - `/z\{2,5\}` matches “zz”, “zzz”, “zzzz”, and “zzzzz”


    ### Stop Searching After the Last Match

    ### Problem

    You want to stop searching when you reach the last match instead of looping back
    to the top of the file.


    ### Solution

    This default feature to loop the search matches is enabled by the `''wrapscan''`
    option. To stop it, use the `''nowrapscan''` option (`set nowrapscan`).


    Suppose that in the current document there were 3 matches. When you reached the
    third match, Vim will automatically cycle back to the first match. Sometimes you
    want the search to stop after the last match.


    With `''nowrapscan''` on, Vim now will stop searching after the 3rd match.


    ### Show the Search Count

    ### Problem

    You want to know how many keyword matches is in the file.


    ### Solution

    To display the match number, add this in your vimrc:


    ```

    set shortmess-=S

    ```


    Now when you search (`/keyword`), Vim will display the number of matches, like
    `[3/5]`.


    ### Moving the Cursor Below or Above the Match

    ### Problem

    You need to offset the cursor when searching by a few lines.


    ### Solution

    To offset it by n lines, use `/pattern/n`. Your cursor will land on the nth line
    below the keyword match. If you run `/donut/3`, your cursor will go to 3 lines
    below the “donut” match. This is the same as running `/donut/+3`.


    To go to the third line above the match, run `/donut/-3`.


    ### Moving the Cursor to the End of the Match

    ### Problem

    The cursor always lands at the first character of the match and you need to offset
    it to the right end of the match.


    ### Solution

    Use the `e` offset modifier when searching. If you run `/donut/e`, the cursor
    will no longer be on the “d” of “donut”, but will be on the “t” of “donut”.


    To offset the offset, add numbers to the argument:


    - `/donut/e-2` to offset it 2 characters to the left of the end match (cursor
    will be on the letter “n” of “donut”).

    - `/donut/e+3` to offset it 3 characters to the right of the end match (cursor
    will be 3 characters after “donut”).


    ### Search for a Character Enclosed in a Collection

    ### Problem

    You want to search for either “A”, “B”, or “C”.


    ### Solution

    Use Vim collection (`[]`) to search for any enclosed character. Run `/[ABC]` to
    match either “A”, “B”, or “C”.


    You can use a collection for a sequence of characters too.


    - `/[A-Z]` to search for any uppercase letter.

    - `/[0-9]` to search for any number.

    - `/[A-Za-z]` to search for any lowercase or uppercase letter.


    ### Search for a Keyword at the Start or at the End of the Line

    ### Problem

    You are searching for “Donut” but it has to be at the start of the line.


    ### Solution

    - To search for “Donut” at the start of the line, use `/^Donut`.

    - To search for “donut” at the end of the line, use `/donut$`.


    ### Search for a Line Containing a Starting, Middle, and Ending Keyword

    ### Problem

    You need to search for a line that starts with “strawberry”, has “banana” somewhere
    in the middle, and ends with “chocolate”. You don’t care what goes in-between.


    ### Solution

    Use `/^strawberry.*banana.*chocolate$`.


    - `^strawberry` means that the line starts with “strawberry”.

    - `.*` means zero or more of any character. `.*banana.*` means that anything goes
    before and after `banana`.

    - `chocolate$` means that the line ends with “chocolate”.


    ### Greedy vs Non-Greedy Search Patterns

    ### Problem

    Sometimes you need to search for the longest pattern and sometimes you need to
    search for the shortest pattern.


    ### Solution

    There are two types of search patterns: greedy and non-greedy.


    - Greedy matches the longest pattern. `.*` is an example of greedy.

    - Non-greedy matches the shortest pattern. `\{-}` is an example of non-greedy.


    If you have a string “chocolatedonutdonut”, running `/ch.*donut` matches the entire
    string “chocolatedonutdonut” (longest match) while running `/ch\{-}donut` matches
    “chocolatedonut” (shortest match).


    ### Searching for a Keyword Separated by End-of-Line

    ### Problem

    You need to find keywords that are separated by end-of-line.


    ### Solution

    The `\_.` pattern searches for the subsequent pattern with end-of-line. It is
    best used with `\{-}` or `*` (non-greedy or greedy) modifiers.


    Given the text:


    ```

    strawberry

    blueberry

    chocolate

    pancakes

    and more

    pancakes

    ```


    - `/strawberry\_.\{-}pancakes` matches (non-greedy) “strawberry”, followed by
    anything, including newlines, then the first “pancakes” on line 4.

    - `/strawberry\_.*pancakes` matches (greedy) “strawberry” to the last “pancakes”
    on line 6.


    ### Search for Either Or

    ### Problem

    You need to match for either “pancakes” or “waffles”.


    ### Solution

    `/pancakes\|waffles` searches for either “pancakes” or “waffles”.


    ### Avoid Typing Forward-Slashes

    ### Problem

    When you are searching for a path or an URL, like `/some/very/long/path`, it is
    a hassle having to escape the forward slashes.


    ### Solution

    Instead of searching with `/` and having to escape every single `/` in the pattern
    like `/\/some\/very\/long\/path`, use the `?` search operator instead. `?/some/very/long/path`.


    Note that `?` will search backward, but you can just use `N` to search “forward”.
    This saves you from having to type escapes.


    ### Marking the Start and End of a Match

    ### Problem

    You want to match for a part of a longer pattern.


    ### Solution

    Use the `\zs` (start) and `\ze` (end) to mark the start and end of a match.


    Given the following text:


    ```

    sugardonut

    chocodonut

    chocolate

    ```

