    \ 265：邮件在队列中：\n\n症状：电子邮件未送递并阻塞在队列。\n\n排排除步骤：\n- 查看邮件队列：\n对于 Sendmail：\n```\nmailq\n\
    ```\n对于 Postfix：\n```bash\npostqueue -p\n```\n- 检查日志中的错误信息。\n- 验证邮件服务器的 DNS 解析：\n\
    ```bash\nnslookup mail.example.com\n```\n\n### 场景 266：身份验证失败：\n\n症状：用户无法验证或登录邮件服务器。\n\
