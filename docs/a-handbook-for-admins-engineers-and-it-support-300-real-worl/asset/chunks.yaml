  trans: "\n\n如果 Nginx 使用非标准端口，请更新 SELinux 策略。\n\n```bash\nsemanage port -a -t http_port_t\
    \ -p tcp <port_number>\n```\n\n为 Nginx 日志或代理配置调整 SELinux 上文。\n\n```bash\nchcon\
    \ -Rv --type=httpd_config_t /etc/nginx\n```\n\n### 场景 98：自定义应用的 SELinux 拒绝\n\n\
    #### 故障排除步骤\n1. 查看审计日志中的 SELinux 拒绝记录。\n```bash\nausearch -m avc -ts recent\n\
    ```\n2. 创建自定义 SELinux 策略模块。\n```bash\naudit2allow -a -M myapp\n```\n3. 加载自定义模块。\n\
    ```bash\nsemodule -i myapp.pp\n```\n4. 重新测试自定义应用程序。\n\n### 场景 99：SELinux 阻塞 Sendmail\n\
    \n#### 故障排除步骤\n1. 查看审计日志中的 SELinux 拒绝记录。\n```bash\nausearch -m avc -ts recent\n\
    ```\n2. 如果 Sendmail 尝试使用非标准端口，请更新 SELinux 策略。\n```bash\nsemanage port -a -t mail_port_t\
    \ -p tcp <port_number>\n```\n3. 重新加载或重启 Sendmail。\n```bash\nsystemctl reload sendmail\n\
    ```\n\n### 场景 100：SELinux 拒绝自定义文件访问\n\n#### 故障排除步骤\n1. 检查审计日志中的 SELinux 拒绝记录。\n\
    ```bash\nausearch -m avc -ts recent\n```\n2. 使用 `chcon` 为文件设置正确的 SELinux 上。\n\
    ```bash\nchcon -Rv --type=my_custom_type /path/to/files\n```\n3. 如果需要，更新 SELinux\
    \ 策略。\n\n### 场景 101：SELinux 拒绝 Cron 任务\n\n#### 故障排除步骤\n1. 查看 SELinux 拒绝记录。\n```bash\n\
    ausearch -m avc -ts recent\n```\n2. 如果 cron 任务访问特定文件，请调整文件上下文。\n```bash\nrestorecon\
    \ -Rv /path/to/files\n```\n3. 如必要，为 cron 任务创建自定义 SELinux 模块。\n\n### 场景 102：SELinux\
    \ 拒绝 Samba 共享\n\n#### 故障排除步骤\n1. 检查 SELinux 拒绝记录。\n```bash\nausearch -m avc -ts\
    \ recent\n```\n2. 为 Samba 共享设置合适的 SELinux 上。\n```bash\nsemanage fcontext -a -t\
    \ samba_share_t \"/path/to/share(/.*)?\"\n```\n3. 应用新上下文。\n```bash\nrestorecon\
    \ -Rv /path/to/share\n```\n\n### 场景 103：SELinux 阻塞 Docker 容器\n\n#### 故障排除步骤\n\
    1. 检查 SELinux 拒绝。\n```bash\nausearch -m avc -ts recent\n```\n2. 如果 Docker 使用非标准端口，请更新\
    \ SELinux 策略。\n```bash\nsemanage port -a -t container_port_t -p tcp <port_number>\n\
    ```\n3. 为 Docker 相关目录调整 SELinux 上。\n```bash\nchcon -Rv --type=container_file_t\
    \ /var/lib/docker\n```\n\n这些步骤涵盖了各种 SELinux 场景。请始终检查日志，在需要时创建自定义策略，并使用 SELinux\
    \ 工具以安全的方式排查并解决问题。\n\n# 启动程序与内核参数\n\n### 场景 104：引导程序配置问题\n**场景：** 系统无法启动，并出现与\
    \ GRUB 引导加载程序相关的错误。\n\n#### 故障排除步骤\n1. **从存盘 CD/USB 或救援模式启动：**\n   使用可启动的 Live\
    \ CD/USB 或救援模式访问系统。\n2. **编辑 GRUB 配置文件（`/etc/default/grub`）：**\n   ```bash\n \
    \  nano /etc/default/grub\n   ```\n   根据需要检查并修改 `GRUB_CMDLINE_LINUX`。\n3. **验证\
    \ `GRUB_CMDLINE_LINUX` 参数的正确性：**\n   确保设置了正确的内核参数。\n4. **重新生成 GRUB 配置：**\n   ```bash\n\
    \   grub2-mkconfig -o /boot/grub2/grub.cfg\n   ```\n5. **重启系统：**\n   ```bash\n\
    \   reboot\n   ```\n\n### 场景 105：启动期间内核崩溃 (Kernel Panic)\n**场景：** 系统在引导加载程序之后立即遇到内核崩溃。\n\
    \n#### 故障排除步骤\n1. **进入救援模式或使用 Live CD/USB 启动：**\n   使用救援模式或 Live CD/USB 进行访问。\n\
    2. **检查内核崩溃信息以获取有关问题的线索：**\n   检查屏幕上显示的内核崩溃信息。\n3. **查看内核日志（`dmesg`，`/var/log/messages`）：**\n\
    \   ```bash\n   dmesg\n   cat /var/log/messages\n   ```\n   调查日志以获取更多细节。\n4. **检查硬件相关问题（内存、磁盘故障）：**\n\
    \   检查硬件组件是否存在问题。\n5. **如有必要，重新安装或更新内核：**\n   使用 `yum` 或 `dnf` 等包管理器命令重新安装或更新内核。\n\
    \n### 场景 106：内核参数设置错误\n**场景：** 系统由于内核参数设置错误表现出异常行为。\n\n#### 故障排除步骤\n1. **编辑 GRUB\
    \ 配置（`/etc/default/grub`）：**\n   ```bash\n   nano /etc/default/grub\n   ```\n\
    \   根据需要检查并修改 `GRUB_CMDLINE_LINUX`。\n2. **检查并修改 `GRUB_CMDLINE_LINUX` 中的内核参数：**\n\
    \   确保设置了正确的参数。\n3. **重新生成配置：**\n   ```bash\n   grub2-mkconfig -o /boot/grub2/grub.cfg\n\
    \   ```\n4. **重启并验证问题是否存在：**\n   ```bash\n   reboot\n   ```\n5. **查看内核日志中的任何错误：**\n\
    \   ```bash\n   journalctl -k\n   ```\n\n### 场景 107：启动在特定阶段卡住\n**场景：** 启动进程在某一点停止，没有进度。\n\
    \n#### 故障排除步骤\n1. **启动时访问 GRUB 菜单并在内核命令行添加 single：**\n   编辑 GRUB 条目并在内核命令行中附加\
    \ `single`。\n2. **进入单用户模式并调查问题：**\n   使用 `init 1` 或 `single` 进入单用户模式。\n3. **检查日志（`/var/log/boot.log`，`/var/log/messages`）中的错误：**\n\
    \   ```bash\n   cat /var/log/boot.log\n   cat /var/log/messages\n   ```\n   寻找卡住阶段的错误或警告。\n\
    4. **解决卡住阶段的问题：**\n   处理调查期间发现的问题。\n5. **从内核命令行移除 single 以正常启动：**\n   编辑配置并移除\
    \ `single`。\n\n### 场景 108：启动进程冻结或缓慢\n**场景：** 系统在启动时冻结或花费异常长时间。\n\n#### 故障排除步骤\n\
    1. **访问 GRUB 菜单并在内核命令行添加 nomodeset：**\n   编辑 GRUB 条目并在内核命令行中附加 `nomodeset`。\n\
    2. **进入单用户模式识别资源密集型进程：**\n   使用 `top` 或 `htop` 等命令检查 CPU 和内存占用。\n3. **检查磁盘空间、磁盘状况和\
    \ RAID 配置：**\n   ```bash\n   df -h\n   smartctl -a /dev/sda\n   mdadm --detail\
    \ /dev/md0\n   ```\n4. **调查磁盘问题：**\n   使用 `systemctl` 禁用不需要的服务。\n5. **查看导致延迟的日志：**\n\
    \   ```bash\n   journalctl -b\n   ```\n\n### 场景 109：内核缺失或损坏\n**场景：** 系统在启动时报告内核缺失或损坏。\n\
    \n#### 故障排除步骤\n1. **从 Live CD/USB 或救援模式启动：**\n   使用 Live CD/USB 或救援模式访问系统。\n2.\
    \ **挂载根文件系统并进入 /boot：**\n   ```bash\n   mount /dev/sdXn /mnt #  sdXn 为根分区\n  \
    \ cd /mnt/boot\n   ```\n3. **验证内核镜像的存在性和完整性：**\n   ```bash\n   ls -l vmlinuz*\n\
    \   md5sum vmlinuz*\n   ```\n4. **如果缺失或损坏，重新安装内核：**\n   ```bash\n   yum reinstall\
    \ kernel\n   ```\n5. **重新生成 GRUB 配置：**\n   ```bash\n   grub2-mkconfig -o /boot/grub2/grub.cfg\n\
    \   ```\n6. **重启系统：**\n   ```\n   reboot\n   ```\n\n### 场景 110：Initramfs 问题\n\
    **场景：** 系统在启动时报告 initramfs 镜像问题。\n\n#### 故障排除步骤\n1. **访问 GRUB 菜单并在内核命令行添加 rd.break：**\n\
    \   编辑 GRUB 条目并在内核命令行中附加 `rd.break`。\n2. **以只读模式重新挂载根文件系统：**\n   ```bash\n   mount\
    \ -o remount,ro /sysroot\n   ```\n3. **检查并修复 initramfs 镜像：**\n   ```bash\n   chroot\
    \ /sysroot\n   dracut -f /boot/initramfs-<kernel-version>.img\n   ```\n4. **重启系统：**\n\
    \   ```bash\n   reboot\n   ```\n\n### 场景 111：根文件系统挂载错误\n**场景：** 系统启动时无法挂载根文件系统。\n\
    \n#### 故障排除步骤\n1. **访问 GRUB 菜单并在内核命令行添加 rd.break：**\n   编辑 GRUB 条目并在内核命令行中附加 `rd.break`。\n\
    2. **以读写权限重新挂载根文件系统：**\n   ```bash\n   mount -o remount,rw /sysroot\n   ```\n\
    3. **检查 /etc/fstab 中的根设备指定是否正确：**\n   ```bash\n   cat /etc/fstab\n   ```\n4. **确保指定了正确的根文件系统\
    \ UUID 或设备：**\n   根据需要更新 `/etc/fstab`。\n5. **退出紧急 shell 并继续启动过程：**\n   ```bash\n\
    \   exit\n   ```\n\n### 场景 112：内核模块加载问题\n**场景：** 启动完成，但某些内核模块加载失败。\n\n#### 故障排除步骤\n\
    1. **检查日志（`dmesg`，`/var/log/messages`）中的模块加载错误：**\n   ```bash\n   dmesg | grep\
    \ <module-name>\n   cat /var/log/messages | grep <module-name>\n   ```\n2. **使用\
    \ `lsmod` 验证内核模块：**\n   ```bash\n   lsmod | grep <module-name>\n   ```\n3. **使用\
    \ `modprobe` 或 `rmmod` 手动加载或卸载问题模块：**\n   ```bash\n   modprobe <module-name>\n\
    \   rmmod <module-name>\n   ```\n4. **更新或重新安装内核模块包：**\n   ```bash\n   yum reinstall\
    \ <module-package>\n   ```\n5. **确保满足模块依赖关系：**\n   解决任何缺失的依赖项。\n\n"
