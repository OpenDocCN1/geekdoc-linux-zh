    # sosreport -l


    可以使用 `-n/--skip-plugins` 选项启用或禁用模块。例如，禁用 `kvm` 和 `amd` 模块：


    ```

    sosreport -n kvm,amd

    ```


    某些模块可能提供额外的选项，可以通过 `-k` 选项指定。例如，禁用 RPM 验证输出收集可以如下所示操作：


    ```

    sosreport -k rpm.rpmva=off

    ```


    最后，用户可以使用 `auditctl` 查看审计报告：


    ```

    auditctl

    ```


    这些功能为根据特定需求或偏好生成 `sosreports` 提供了灵活性和定制性。


    ## redhat-support-tool


    它提供了一个文本控制台界面，用于访问基于订阅的 Red Hat Access 服务，需要连接互联网以访问 Red Hat 客户门户。不需要图形化界面。


    在下一页中，将探索有关排查 Red Hat Enterprise Linux (RHEL) 系统各种用户相关问题的显式指南。对于每种场景，请确保您列出了问题识别、诊断、隔离、解决、验证和文档记录的步骤。


    ## 用户登录问题


    ### 场景 1：密码错误

    **问题：** 用户因输入错误密码无法登录。


    **排故障排除：**

    - 验证用户的凭据。

    ```

    id <username>

    ```

    - 使用 `passwd` 重置用户密码。

    ```

    passwd <username>

    ```

    - 确保未激活大写锁定（Caps Lock）。

    - 确认键盘布局正确。


    ### 场景 2：密码过期

    **问题：** 用户因密码过期无法登录。


    **排故障排除：**

    - 使用 `chage` 检查密码过期。

    ```

    chage -l <username>

    ```

    - 使用 `passwd` 重置密码。

    ```

    passwd <username>

    ```

    - 如果使用 `LDAP` 或 `Kerberos`，确保密码策略配置正确。


    ### 场景 3：用户账户被锁定

    **问题：** 用户在多次尝试登录失败后账户被锁定。


    **排故障排除：**

    - 检查账户状态：

    ```

    passwd -S <username>

    ```

    - 解锁账户：

    ```

    passwd -u <username>

    ```

    - 检查 `PAM` 配置中的账户锁定策略。


    ### 场景 4：不允许使用 Shell

    **问题：** 用户被限制使用特定的 shell。


    **排故障排除：**

    - 验证 `/etc/passwd` 中用户的用户的 shell。

    ```

    grep <username> /etc/passwd

    ```

    - 使用 `chsh` 更改 shell。

    ```

    chsh -s /bin/bash <username>

    ```


    ### 场景 5：文件权限问题

    **问题：** 用户在尝试登录时遇到权限错误。


    **排故障排除：**

    - 检查用户主目录的权限。

    ```

    ls -ld /home/<username>

    ```

    - 确保所有权正确。

    ```

    chown <username>:<username> /home/<username>

    ```


    ### 场景 6：账户不存在

    **问题：** 系统上不存在该用户账户。


    **排故障排除：**

    - 验证用户是否存在。

    ```

    id <username>

    ```

    - 如果必要，创建用户账户。

    ```

    useradd <username>

    ```


    ### 场景 7：PAM 配置问题

    **问题：** 因 `PAM`（可插拔认证模块）配置错误导致登录失败。


    **排故障排除：**

    - 检查 `/etc/pam.d/` 中的 `PAM` 配置文件。

    ```

    cat /etc/pam.d/system-auth

    ```

    - 检查语法错误或错误的模块配置。

    - 使用 `authconfig` 或 `authselect` 重新配置 `PAM` 设置。


    ### 场景 8：网络连接问题

    **问题：** 因网络问题导致登录尝试失败。


    **排故障排除：**

    - 确保系统具有网络连接（`ping`、`traceroute`）。

    - 检查 DNS 解析（`nslookup`、`dig`）。

    - 如果适用验证 `LDAP` 或 `Kerberos` 服务器可访问。


    ### 场景 9：LDAP 或 Kerberos 认证失败

    **问题：** 依赖 `LDAP` 或 `Kerberos` 的用户面临认证问题。


    **排故障排除：**

    - 检查 `LDAP` 或 `Kerberos` 客户端配置。

    ```

    cat /etc/nsswitch.conf

    cat /etc/krb5.conf

    ```

    - 验证客户端与 `LDAP` 或 `Kerberos` 服务器的连接。

    - 检查服务器日志中的与认证相关的错误。


    ### 场景 10：Shell 初始化问题

    **问题：** 用户在登录后遇到问题，例如 shell 无法工作。


    **排故障排除：**

    - 检查用户的 shell 初始化文件。

    ```

    cat ~/.bashrc

    cat ~/.bash_profile

    ```

    - 临时切换到不同的 shell。

    ```

    exec /bin/sh

    ```


    ### 场景 11：认证服务不可用

    **问题：** 用户因认证服务问题无法登录。


    **排故障排除：**

    - 检查认证服务的状态。

    ```

    systemctl status sssd

    ```

    - 检查认证服务的配置（`SSSD`、`Winbind` 等）。


    ### 场景 12：错误的 UID 或 GID

    **问题：** 用户因错误的 `UID`（用户 ID）或 `GID`（组 ID）遇到登录问题。


    **排故障排除：**

    - 验证 `/etc/passwd` 和 `/etc/group` 中的 `UID` 和 `GID`。

    ```

    grep <username> /etc/passwd

    grep <groupname> /etc/group

    ```

    - 如必要，使用 `usermod` 或 `groupmod` 修正 `UID` 或 `GID`。


    ### 场景 13：Shadow 文件问题

    **问题：** `/etc/shadow` 文件问题导致无法成功登录。


    **排故障排除：**

    - 检查 `/etc/shadow` 文件的完整性。

    ```

    pwck

    ```

    - 确保正确的权限权限。

    ```

    chmod 600 /etc/shadow

    ```


    ### 场景 14：双重认证问题

    **问题：** 使用双重认证的用户遇到登录问题。


    **排故障排除：**

    - 检查双重认证配置。

    - 验证第二个认证因素的可用性和功能性。


    ### 场景 15：审计和 SELinux 拒绝访问

    **问题：** 审计日志或 `SELinux` 拒绝访问阻止用户登录。


    **排故障排除：**

    - 查看审计日志。

    ```

    grep AVC /var/log/audit/audit.log

    ```

    - 检查 `SELinux` 状态并审核 `SELinux` 拒绝访问。

    ```

    sestatus

    ```


    ### 场景 16：与服务器的连接已关闭

    **问题：** 与服务器的连接已关闭


    **排故障排除：**

    - 以 `root` 登录并获取用户信息。

    ```

    lastlog -u uer1 or cat /etc/passwd | grep user1

    chsh -s /bin/bash user1

    ```

    - 退出并尝试以 `user1` 访问系统。


    ### 场景 17：用户无法登录

    **问题：** 用户报告无法登录。


    **排故障排除：**

    - 验证用户密码：

    ```

    passwd <username>

    ```

    - 检查用户账户是否锁定：

    ```

    passwd -S <username>

    ```

    - 检查认证日志以查找错误：

    ```

    journalctl -xe

    ```

    - 确保用户的 shell 在 `/etc/passwd` 中是合法的。


    ### 场景 18：用户无权限

    **问题：** 用户在访问文件或目录时遇到“拒绝访问”。


    **排故障排除：**

    - 检查文件/目录权限：

    ```

    ls -l /path/to/file_or_directory

    ```

    - 验证用户的组成员身份：

    ```

    id <username>

    ```

    - 确认 `SELinux` 上下文：

    ```

    ls -Z /path/to/file_or_directory

    ```


    ### 场景 19：无法创建用户

    **问题：** 创建新用户失败。


    **排故障排除：**

    - 检查 `/etc/security/limits.conf` 中的限制。

    - 确保新用户的主目录有足够的磁盘空间。

    - 验证用户是否已存在：

    ```

    id <new_username>

    ```


    ### 场景 20：账户过期

    **问题：** 用户因账户过期无法登录。


    **排故障排除：**

    - 检查账户过期：

    ```

    chage -l <username>

    ```

    - 延长账户有效期：

    ```

    chage -E <new-expiration-date> <username>

    ```


    ### 场景 21：组成员身份问题

    **问题：** 用户不在预期的组中。


    **排故障排除：**

    - 验证组成员身份：

    ```

    id <username>

    ```

    - 检查 `/etc/group` 以正确的组成员身份。

    - 确认用户修改在 `/etc/passwd` 中持久化。


    ### 场景 22：密码策略违反

    **问题：** 用户在更改密码时遇到问题。


    **排故障排除：**

    - 检查 `/etc/security/pwquality.conf` 中的密码策略设置。

    - 检查 `/etc/security/pwquality.conf` 中的特定要求。

    - 审核 `/etc/pam.d/passwd` 中的 `PAM` 配置中的密码模块。


    ### 场景 23：主目录权限

    **症状：** 用户在访问其主目录时遇到问题。


    **排故障排除：**

    - 确保主目录的权限正确：

    ```

    ls -ld /home/<username>

    ```

    - 验证 `SELinux` 上下文：

    ```

    ls -Z /home/<username>

    ```

    - 检查 `/etc/passwd` 中准确的主目录路径。


    ### 场景 24：用户无法更改密码

    **症状：** 用户在尝试更改密码时遇到错误。


    **排故障排除：**

    - 验证 `/etc/pam.d/passwd` 中的密码更改权限。

    - 检查 `/etc/security/opasswd` 中的密码历史设置。


