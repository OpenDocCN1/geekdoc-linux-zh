    # Introduction


    “300+ Real-World Linux Troubleshooting Scenarios” is a comprehensive guide designed
    for System Administrators, Engineers, Database Administrators, and IT Support
    professionals seeking hands-on solutions to real-world Linux challenges. In today''s
    dynamic and ever-evolving IT landscape, mastering the art of troubleshooting is
    crucial. This book aims to equip you with the skills and knowledge needed to effectively
    diagnose and resolve a wide array of Linux system issues.


    Linux is the backbone of countless critical infrastructures, and understanding
    how to troubleshoot it is indispensable for anyone responsible for maintaining
    a stable and efficient environment. Whether you are dealing with server outages,
    performance bottlenecks, database connectivity problems, or other system anomalies,
    this book provides you with practical scenarios that mirror the complexities you
    may encounter in your day-to-day responsibilities.


    Each scenario in this book is carefully crafted to offer a hands-on approach to
    problem-solving. You''ll find step-by-step instructions, tips, and best practices
    that will empower you to navigate through various troubleshooting challenges with
    confidence. Let''s dive into the world of Linux troubleshooting and enhance your
    ability to keep systems running smoothly.


    ## What is troubleshooting in Linux?


    Troubleshooting in Linux refers to the process of identifying, diagnosing, and
    resolving issues or problems that may arise within a Linux operating system or
    related software and services. Linux, being a widely used open-source operating
    system, is employed in various environments, from servers to personal computers,
    and troubleshooting is an essential skill for system administrators, IT professionals,
    and anyone responsible for maintaining Linux systems.


    ## Best Practices for systems troubleshooting.


    - **Issue Identification**: The first step in troubleshooting is identifying the
    problem. This could be anything from software errors, hardware failures, network
    issues, or misconfigurations.

    - **Diagnosis**: Once the problem is identified, the next step is to diagnose
    the root cause. This involves a systematic investigation into the factors contributing
    to the issue. Diagnostic tools, log files, and system monitoring are often used
    in this phase.

    - **Isolation**: After determining the root cause, the troubleshooter isolates
    the issue. This may involve narrowing down the scope of the problem, determining
    if it''s localized to a specific component or subsystem, and ruling out other
    potential causes.

    - **Resolution**: With the problem isolated, the next step is to implement a solution.
    This could involve making configuration changes, applying patches, fixing code,
    updating software, or taking other corrective actions to address the underlying
    issue.

    - **Verification**: Once a solution is applied, it''s essential to verify that
    the problem has been resolved. This may involve testing the system, monitoring
    logs for any recurrence of issues, and ensuring that the changes made do not introduce
    new problems.

    - **Documentation**: Effective troubleshooting often involves documenting the
    steps taken, the identified issues, and the solutions applied. This documentation
    can be valuable for future reference, knowledge sharing, and continuous improvement.


    Troubleshooting in Linux requires a good understanding of the operating system,
    command-line tools, log files, and various system components. It also involves
    a combination of technical skills, analytical thinking, and experience in dealing
    with diverse system configurations and environments. As Linux is commonly used
    in server environments, where stability and reliability are critical, the ability
    to troubleshoot effectively is an important skill for Linux system administrators
    and IT professionals.


    # Important Tools


    ### Two logging services: `systemd-journald` and `rsyslogd`


    The most used tools for log checking are:


    `journalctl`


    it tracks all the log files between two different timings and save by default
    in `/run/log` location.


    ```bash

    journalctl -b or journalctl --list-boots (displays journal entries from the current
    boot, providing a chronological view of system events)

    journalctl _SYSTEMD_UNIT=sshd.service (filters the journal to show entries related
    specifically to the "sshd" service)

    journalctl -n 5 (to display last five lines of all the log files)

    journalctl -p err (to display all the error messages)

    journalctl -f (to watch journalctl messages continuously)

    journalctl --since<today> or <yesterday> (to see all the journalctl messages since
    today or yesterday)

    journalctl --since "date" --until "date" (to see the journal messages between
    the specified two dates)

    journalctl -pid=1 (to see the pid=1 process name)

    ```


    ### sosreport


    The `sosreport` command in Linux, specifically designed for RHEL/CentOS systems,
    serves the purpose of gathering comprehensive system configuration and diagnostic
    information. This encompasses details such as the running kernel version, loaded
    modules, as well as configuration files for the system and services. Additionally,
    `sosreport` executes external programs to collect supplementary information, storing
    the entire output in an archive for reference.


    When seeking technical support from Red Hat, generating a `sosreport` becomes
    a crucial step. Red Hat support engineers often require this report to troubleshoot
    issues effectively. To initiate the `sosreport` command, the `sos` package must
    be installed. Typically, this package is included in the default installation
    of most Linux distributions. However, if it''s not installed, the `yum` command
    can be utilized to install it:


    ```bash

    rpm -q sos  # Check if sos is installed

    yum install sos -y  # Install sos if not already installed

    ```


    To generate the `sosreport`, open the terminal and simply type the `sosreport`
    command:


    ```bash

    sosreport

    ```


    The command typically completes within a few minutes, generating a compressed
    file in the `/tmp` folder. The compression format may vary based on the Linux
    version (gz, bz2, or xz). This file should then be provided to the Red Hat support
    representative, usually as an attachment to an open support case.


    It''s important to note that the `sosreport` command necessitates root permissions
    to run. Additionally, users can customize the command using various options. To
    view available modules, users can employ the `-l` option:

