  trans: "\n\n使用 `uptime` 或 `w` 系统负载。\n\n使用 `top` 识别资源密集型进程。\n\n分析系统日志查找任何异常事件。\n\n\
    考虑负载均衡或优化资源分配。\n\n## 虚拟化\n\n### 场景 314：虚拟机 (VM) 启动失败\n**问题：** 虚拟机在虚拟机程序上无法启动。\n\
    \n**故障排除步骤：**\n- 检查虚拟机日志以查找特定的错误信息：\n  ```\n  virsh console <vm-name>\n  less\
    \ /var/log/libvirt/qemu/<vm-name>.log\n  ```\n- 检查虚拟机配置文件是否存在语法错误：\n  ```\n  virsh\
    \ edit <vm-name>\n  ```\n- 检查宿主机上的可用资源：\n  ```\n  virsh nodeinfo\n  ```\n- 确保必要的存储池和网络都是可用的：\n\
    \  ```\n  virsh pool-list\n  virsh net-list\n  ```\n- 尝试手动启动虚拟机并监控错误信息：\n  ```\n\
    \  virsh start <vm-name>\n  ```\n\n### 场景 315：虚拟机程序连接问题\n**问题：** 无法使用 `virsh`\
    \ 等工具连接到虚拟机程序。\n\n**故障排除步骤：**\n- 验证 libvirt 服务状态：\n  ```\n  systemctl status libvirtd\n\
    \  ```\n- 检查 libvirt 守护进程是否运行并监听所需的端口：\n  ```\n  netstat -tulpn | grep libvirtd\n\
    \  ```\n- 检查 libvirt 日志中的错误：\n  ```\n  less /var/log/libvirt/libvirtd.log\n  ```\n\
    - 确保 libvirt 守护进程通过防火墙允许：\n  ```\n  firewall-cmd --list-all\n  ```\n\n### 场景 316：虚拟机网络连接问题\n\
    **问题：** 虚拟机无法相互通信或与外部网络通信。\n\n**故障排除步骤：**\n- 验证虚拟机的网络配置：\n  ```\n  virsh dumpxml\
    \ <vm-name>\n  ```\n- 检查网络桥接配置：\n  ```\n  cat /etc/sysconfig/network-scripts/ifcfg-brX\n\
    \  ```\n- 通过访问控制台确保虚拟机具有有效的 IP 地址。\n- 检查宿主机上的 `iptables` 规则：\n  ```\n  iptables\
    \ -L -n\n  ```\n\n### 场景 317：虚拟机资源不足\n**问题：** 虚拟机性能下降或虚拟机未获得足够的资源。\n\n**故障排除步骤：**\n\
    - 检查宿主机上的可用资源：\n  ```\n  virsh nodeinfo\n  ```\n- 检查虚拟机配置文件中的 CPU 和内存分配：\n  ```\n\
    \  virsh edit <vm-name>\n  ```\n- 使用 `top` 或 `htop` 等工具验证虚拟机内部的 CPU 和内存使用情况。\n\
    - 必要时调整资源分配并重启虚拟机。\n\n### 场景 318：虚拟机快照失败\n**问题：** 无法为虚拟机创建或应用快照。\n\n**故障排除步骤：**\n\
    - 检查虚拟机是否正在运行并处于一致状态。\n- 检查存储池的可用空间：\n  ```\n  virsh pool-info <storage-pool>\n\
    \  ```\n- 检查 libvirt 日志中的快照相关错误：\n  ```\n  less /var/log/libvirt/qemu/<vm-name>.log\n\
    \  ```\n- 验证存储池上的权限：\n  ```\n  ls -l /var/lib/libvirt/images/\n  ```\n\n### 场景\
    \ 319：虚拟机磁盘损坏\n**问题：** 虚拟机显示磁盘损坏或数据丢失的迹象。\n\n**故障排除步骤：**\n- 使用 `qemu-img check`\
    \ 验证虚拟机磁盘镜像的完整性。\n- 检查虚拟机日志文件中的错误：\n  ```\n  less /var/log/libvirt/qemu/<vm-name>.log\n\
    \  ```\n\n### 场景 320：实时迁移失败\n**问题：** 无法对运行中的虚拟机进行实时迁移。\n\n**故障排除步骤：**\n- 确保虚拟机正在运行并处于一致状态。\n\
    - 检查宿主机之间的连接性：\n  ```\n  ping <target-host>\n  virsh nodeinfo <target-host>\n\
    \  ```\n\n### 场景 321：虚拟机性能下降\n**问题：** 虚拟机运行缓慢或正经历高延迟。\n\n**故障排除步骤：**\n- 使用 `top`\
    \ 或 `htop` 等工具监控宿主机上的 CPU、内存和磁盘使用情况。\n- 检查影响性能的错误。\n\n### 场景 322：不支持的虚拟机硬件\n**问题：**\
    \ 由于硬件不支持或缺失虚拟机无法启动。\n\n**故障排除步骤：**\n- 检查虚拟机硬件与硬件的兼容性。\n- 更新虚拟机配置以匹配宿主机的特性：\n\
    \  ```\n  virsh edit <vm-name>\n  ```\n\n### 场景 323：虚拟机程序升级问题\n**问题：** 在升级虚拟机程序或迁移到新版本后出现问题。\n\
    \n**故障排除步骤：**\n- 查看新虚拟机程序版本的发布说明和文档。\n- 检查与现有虚拟机配置的兼容性。\n- 确保所有必要的软件包和依赖项已安装。\n\
    \n"
