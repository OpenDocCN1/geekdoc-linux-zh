    当你在 `bash` 中交互时，命令行上提供了一项编辑功能。这可以帮助你移动正在输入的命令，以便进行编辑。我们已经看到了如何使用方向键配合 `history`
    命令在命令之间移动。以下列表将帮助你在处理特定命令时使用编辑功能。


    - `Ctrl+a`：这将把光标带到命令行的开头。

    - `Ctrl+e`：这将把光标带到命令行的末尾。

    - `Ctrl+u`：清空从光标位置到行首的内容。

    - `Ctrl+k`：清空从光标位置到行尾的内容。

    - `Ctrl+右箭头`：将光标移动到下一个单词的开头。

    - `Ctrl+r`：在历史命令列表中搜索模式。


    # Shell 脚本


    ## Shell 脚本

    shell 是 `Unix` 等操作系统中的命令解释器。`Linux` 是一个使用其他程序的程序。它为 `Unix/GNU` 系统提供了一个计算机接口，用于使用带有特定安装的不同命令或工具。当
    shell 完成程序处理后，它会将输出发送到用户的屏幕上，即标准输出。shell 不仅仅是解释命令。它的系统语言具有完整的结构，如性能、灵活性、任务等。这就是为什么
    `Unix/GNU` shell 比 `Windows` shell 更强大。


    ## Bash Shell

    `Bash` 代表 Bourne Again Shell，是当今大多数 `Linux` 发行版的默认 shell。它还具有与 shell 关联的功能，并在系统中提供了更高效的开发支持，包括：

    - 编辑命令行

    - 性能管理

    - 无限命令历史

    - 别名

    - 无限制布局

    - 任何基础的算术运算


    ## Tcsh / Csh

    `Tcsh` 基于 `C-shell` 开发，可以作为兼容的登录 shell 和脚本命令处理器。`Tcsh` 具有以下特性：

    - `C` 语法

    - 命令行编辑器

    - 和文件补全

    - 拼写检查

    - 性能管理


    ## Zsh 的 Shell

    `Zsh` 设计用于与其他许多 `Unix/GNU` shell 集成，例如 `bash`、`tcsh` 和 `Ksh`。并拥有与其他可用 shell 一样强大的编写语言。它具有一些独特的特性，包括：

    - 文件名生成

    - 启动文件

    - 登录

    - 结论总结

    - 概念指南

    - 灵活索引


    ## Fish

    `fish` 是一个友好的交互式 shell，记录于 2005 年。它被设计为功能全且易于使用，与其他 shell 一样，具有卓越特性：

    - 页面补全

    - 基于 Web 的配置

    - 自动建议

    - 完全用纯脚本编写

    - 终端支持


    # 使用 Linux 的优势

    大多数计算机新手会说“Linux 很复杂”或“Linux 很难”。当然，确实存在只有激情专家才能操作的 `Linux` 发行版，但也有些明确为普通公众设计的：`Linux
    Mint`、`Ubuntu` 及其衍生版本。你会发现 `GNU/Linux` 使用非常简单，而且比大多数人想象的要友好得多。


    使用此软件，你就是局面的主人。除非你明确要求，否则 `GNU/Linux` 什么都不会做，这与几乎由系统决定一切而非由用户决定的专用系统不同。你不需要被强制安装你想要的东西，在你现有的系统仍在良好运行时，也不会被强加一个全新的系统。相反，你可能从开始就就不需要卸载任何东西；没有杀毒软件试用，没有密钥，没有锁定，简而言之，没有垃圾软件。在依赖
    `Windows` 多年后，`Linux` 赋予的自由可能会令人恐惧。然而，应该理解的是 `GNU/Linux` 允许你操控你的操作系统，使其成为一个按照你品味和需求的空间，就像它赋予你做任何事情的权利一样。


    ## 安全

    在 `Linux` 上不需要杀毒软件。这听起来很不可思议，但它是事实，因为这个操作系统的构建初衷就是为了尽可能安全。它是 Unix 类系统（`Linux`、`BSD`）基因的一部分，在这些系统中，安全性是系统其他组件同样本质元素。尽管各种说法，大多数计算机操作员试图解释
    `Linux` 的安全性构建。一方面，一些操作员认为 `Linux` 上有病毒，因此保护自己至关重要；另一些人则认为杀毒软件只能检测针对 `Windows`
    的病毒。此外，`Linux` 世界的多样性意味着影响一个发行版的病毒可能不会影响另一个。


    `Linux` 系统最常见的安全要求是，在你登录时或想要执行潜在危险的系统修改操作（更新、安装新软件等）时，会要求密码。当你想要访问某些文件时也需要密码，因为这可以防止某些在你不在场时搜索你的数据。至于更新，它们看起来频率低得多，而且在大多数情况下执行速度快得多。我们有时听到
    `Windows` 设计是为了一件事：运行。起初，安全甚至不是首要考虑的问题，其考虑程度如此小，以至于被委托给了第三方软件。因此，产生了利润丰厚的杀毒软件和反恶意软件行业。即使有人可以认为现在
    `Microsoft` 严重重视安全问题，但持续且频繁的安全更新流应该鼓励所有用户对 `Microsoft` 操作系统的可靠性提出严肃的问题。


    ## 宁静与效率

    尽管某些发行版很复杂，但某些 `GNU/Linux` 发行版非常适合初。因此，一切的设计都是为了让初者的生活变得更容易。这意味着你不需要计算机科学的硕士学位就能操作
    `Linux`。此外，`GNU/Linux` 提供了一个在技术和人性化方面都可靠的环境。当你第一次安装完一个发行版时，它最引人注目的是其极简的外观。通常，桌面上只有两个图标：“工作站”和一个个人文件夹。甚至没有垃圾箱！这看起来可能很原始，但它也是
    `GNU/Linux` 体验的象征：简单和选择。

    '
- fmt: '

    ## Shortcuts


    - `Tab`: this will complete the command or the filename. If there is more than
    an option, the system will use a visual or audio notification to tell you. If
    the system detects a lot of possibilities, it will ask you whether you would like
    to check all of them.

    - `Tab`: this is going to show the completion possibilities for a filename or
    command.

    - `Ctrl + A`: will move the cursor over to the start of the current command line.

    - `Ctrl + C`: this one will end your computer program and then show the Linux
    prompt.

    - `Ctrl + D`: this one is going to log you out of your current session. This is
    a key combination that is similar to typing `exit` or `logout`.

    - `Ctrl + E`: this will move the cursor to the end of your current command line.

    - `Ctrl + H`: this is going to work similarly to pressing the backspace key on
    the keyboard.

    - `Ctrl + L`: this one is going to clear out the current terminal.

    - `Ctrl + R`: this is going to search through the history of commands

    - `Ctrl + Z`: this is going to allow you to suspend your computer.


    ## Programs


    - `Arrow right/arrow left`: these keys will make it easier to move the cursor
    along the command line that you are currently on. You may find it useful to add
    in more characters or make some changes to the program.

    - `Arrow up/arrow down`: these are the keys that will make it easier to browse
    the system’s history. You can access any lines that you want to repeat, change
    some of the data when needed, and then press `Enter` to quickly execute these
    new commands.

    - `Shift + Page Up/Shift + Page Down`: using these key combinations will allow
    you to check the terminal buffer.


    As you get a bit more familiar with the Linux system, you will begin to understand
    better how these commands work and learn other commands, which will make it easier
    to use the Linux system. These are just a few of the initial commands that you
    should learn how to use because they will make navigating through the system much
    easier for you. Give them a try and practice logging in and out of your system
    so that you can get a feel for how it works before moving on.


    ## A New Version in a Snap of Fingers


    On Linux, if you want to change the version, for example, to have a most recent
    operating system, most distributions are to be reinstalled in full. Under Windows,
    this operation causes stress and takes a lot of time. To change the GNU/Linux
    version is so easy that it can quickly become a routine.


    To perform this in Linux Mint, go to the update manager to install the latest
    version available. It is worth noticing that installing a recent version does
    not mean changing the whole software. GNU/Linux offers operating systems light
    enough to run on computers with less than 4 GB of RAM.


    Generally, consider that with the present Linux distribution, an entry-level computer
    with 4 GB of RAM is almost oversized for everyday uses. The minimum system recommended
    for installing Linux Mint is 9 GB of disk space and 256 MB of RAM (1GB for comfort).
    Obviously, some software will probably require a little more than 1 GB of RAM.
    But between 1 and 4 (or 8 GB of RAM), space is enough.


    The different versions of the distributions are often proposed in “long cycles,”
    commonly called `LTS` (Long Term Support). For example, Linux Mint 18 available
    since spring 2016 will be supported until spring 2021. For the rest, if you know
    how to copy and paste, you will reinstall your software and replace it with the
    recent versions. Above all, it is possible to restore all the software configuration
    of the old system, which includes, for example, your email, your settings, as
    well as the complete parameters of your browser with extensions included.


    How is this magic possible? The advantage of a GNU/Linux distribution is that
    all the personal files are deposited in a single named folder. This folder also
    contains hidden directories, and these are the ones that contain all the settings
    of your software. GNU/Linux does not violate the user.


    GNU/Linux is an operating system that does not exploit you. The default installation
    does not include much more than the most commonly used and fully functional software.
    The Linux community and free software developers do not care what you do with
    your computer for which you are solely responsible.


    A GNU/Linux distribution does not hint, analyze, or transmit any of your actions
    to “third parties,” which may breach users’ privacy.


    ## Linux Tips and Tricks


    There are thousands of command lines, which makes it possible to execute tasks
    in no time. Rather than flipping through pages one after the other, a single command
    can help you get what you want in a few seconds.


    On Linux, you must note that some Windows shortcut keys may perform different
    functions entirely. Hence, don’t expect `Ctrl + S` to help you save items on Linux.


    ```

    ls

    ```


    This command is used to list the files in a folder. You can use `-a` to list hidden
    files, `-l` for detailed list, and `-R` to view subfolders; the `cd` change directory
    command is used to navigate within the existing file system. For example, `cd
    /var/log` to the logs folder. This is effective regardless of where you are since
    we put the start slash, which indicates that it is an absolute address.


    ```bash

    pwd

    ```


    Print working directory. This command displays the absolute path of the folder
    you’re presently in.


    ```

    clear

    ```


    This is used to clean your terminal window, relegating all the text above, and
    leaving you with a clean window. The keyboard shortcut `Ctrl + l` does the same
    thing.


    ```

    Ctrl + s

    ```


    Stop the display; this is very useful when you mistakenly input a wrong command.


    # Conclusion


    To conclude, you have enough basic information to get started and begin to dabble
    in the usage of your own Linux distribution that you have chosen, installed, and
    begun to program. Hopefully, you found the process of reading informative and
    valuable to you as you made your way through it.


    As a beginner, you should familiarize yourself with the Linux commands. This is
    the most exciting thing with Linux.


    One enjoys running the commands on the terminal, which gives different results.
    The exciting thing with Linux is that it comes with various distributions, and
    the majority of the commands are universal in all of these distributions. This
    provides one with ease of transition from one transition to another.


    However, it is good for you to know that each Linux distribution is developed
    for a group of targeted users, and it is designed and developed so that it can
    meet the demands of those users. This calls for you to determine the tasks you
    want to perform with your Linux and then choose the best distribution! For sure,
    however, when you begin to utilize Linux, you are developing a series of essential
    skills to learning.


    It can be beneficial to know how to work with computers. You may even decide to
    take this from a project to a hobby and eventually even a career if it has interested
    you enough to keep exploring. First, however, no matter what is important to remember,
    you should make sure you stay up-to-date on your knowledge. From here, you may
    be ready to install your iteration of Linux if you have not done so yet.


    It is exciting when you begin this process, and you will surely enjoy it.


    If you are unsure whether you are ready to take the plunge into downloading a
    distribution for yourself, maybe you would find interest in running a few different
    distros to test first, using the steps listed for you earlier.


    You can play around with the system, learning which you prefer and which you would
    rather avoid altogether, which may help you make your decision sooner. However,
    no matter what you decide, remember that this was an introduction to the subject.


    This reading focused on providing you with the essentials to understanding what
    Linux is and how it works. From here, you may choose to research the specialized
    distribution you are interested in. You may begin to look into Linux’s uses and
    what you can do with the program.

    '
