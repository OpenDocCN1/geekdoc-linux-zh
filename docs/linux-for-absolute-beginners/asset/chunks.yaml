    As sample #1 shows, quotes surround particular groups of texts. If quotes were
    not used, as shown in sample #2, the script might interpret words as additional
    commands.


    # Ubuntu Installation


    On April 23, 2020, Ubuntu 20.04 (codenamed Focal Fossa) was launched. It’s a Long-Term
    Maintenance (LTS) version, which means support and updates will be provided until
    April 2025.


    This tutorial will show you how to install Ubuntu 20.04 LTS on your computer.


    **Ubuntu 20.04 LTS.**


    *   Linux Kernel 5.4 — This Linux kernel version includes support


    for a larger variety of CPUs. It also contains boot speed, power-sa


    ving, and USB-C enhancements, as well as various security mea


    sures.


    *   Gnome 3.36 — The Gnome desktop environment has been


    upgraded and enhanced. System animations should be smoother


    and consume less CPU power.


    *   Improved speed and native encryption in the ZFS 0.8.3 file


    system.


    *   Theme: gloomy


    *   The login screen has been updated.


    *   Python 3.8, OpenJDK 11, PHP 7.4, Glibc 2.31, Rustc 1.41, GCC


    9.3, Ruby 2.7.0, Perl 5.30, Golang 1.13 are newer versions of


    major programming languages.


    **Installation prerequisites for Ubuntu 20.04LTS**


    *   For storage, there is a total of 25GB accessible on the hard drive.


    *   Memory: 4 GB


    *   A dual-core CPU with a clock speed of 2 GHz


    *   USB compatibility


    Also, a 4GB USB flash drive is required to create the Ubuntu installation disc.


    **Step 1: Save the installation media to your computer.**


    1\. Open a web browser and go to the Ubuntu download page. Select the Ubuntu version
    that is appropriate for your machine. The following are the most common versions:


    *   Ubuntu Desktop (Ubuntu)


    *   Linux Servers (Ubuntu)


    *   Derivatives of Ubuntu


    ![Image](Images/image00111.jpeg)


    2\. When you’ve found the version you’re looking for, click the green Download
    button to get it. Your download should begin after you’ve been directed to a thank-you
    page. (For desktops, we’ll download and install Ubuntu 20.04.)


    .iso file is available for download. It allows you to make a bootable USB device.


    3\. Save the file to your preferred location.


    Note: You may immediately mount the .iso image if you’re installing to a virtual
    computer (like VirtualBox).


    **Step 2: Make a bootable USB drive**


    You’ll need a USB disk with at least 4GB of storage. The data on the USB device
    will be erased as a result of this procedure. Ensure that any existing data on
    the USB device is backed up.


    Option 1: Use Ubuntu to create a bootable USB drive.


    Use the utility to create a startup disk:


    *   Create a search dialog and put “create startup” into it.


    *   If it isn’t already installed, the Software Center will prompt


    you to do so – choose USB drive from the drop-down menu, then


    start the utility.


    *   Click Other in the top pane, then navigate to and pick the Ubuntu 20.04.iso
    file you downloaded.


    *   Select your USB disk in the bottom pane.


    *   Make a startup disk by clicking Make startup disk.


    Option 2: Use Windows to create a bootable USB drive


    To make a USB bootable drive, you’ll need to install Rufus, a third-party application.


    1.Rufus is a program that may be downloaded. To get the current version of Rufus,
    scroll down to the download section and click the link.


    ![Image](Images/image00112.jpeg)


    2\. Once the file has been downloaded, run it.


    3\. A dialog box appears. If you wish to check for online updates, you’ll be asked.
    Select No.


    ![Image](Images/image00113.jpeg)


    4\. The Rufus application starts. When you plug in the USB drive, it should appear
    in the device field.


    *   Set the USB drive as the device to which you want to write.


    *   Select Disk or ISO Image from the Boot Selection drop-down


    menu.


    *   Toggle the right-hand Select button.


    *   Select the.iso Ubuntu file you obtained earlier in the process.


    ![Image](Images/image00114.jpeg)


    5\. Press the Start button.


    **Step 3: Install Ubuntu from a USB drive.**


    4.Shut off your computer. Remove any additional USB devices, such as printers,
    memory cards, and so on.


    2\. Turn on your computer and insert the Ubuntu USB drive into it.


    There are two situations that might happen:


    *   The USB disk is immediately booted by the computer.


    *   In the Boot Menu, you must manually setup USB booting or


    BIOS/UEFI.


    3\. As soon as the computer turns on, hit the boot menu key roughly once or twice
    per second to manually adjust the boot sequence.


    Depending on the manufacturer of your computer, the boot menu key may be different.
    The following is a list of frequent boot keys for each brand:


    ![Image](Images/image00115.gif)


    4\. Select the Ubuntu media to boot from using the arrows after you’ve seen your
    boot menu. The name of the entry for a DVD is generally DVD or Optical. USB is
    commonly referred to as USB.


    The Ubuntu live disc menu should begin to load on your PC.


    Note: If you’re having trouble starting the USB from the boot menu, try booting
    it via BIOS/UEFI instead.


    **Step 4: Install Ubuntu**


    You may try out Ubuntu 20.04 before deciding to install it. A live mode is included
    in the .iso that only runs in memory.


    Click Try Ubuntu to start this mode.


    ![Image](Images/image00116.jpeg)


    **Step 5: Install Ubuntu 20.04 LTS Desktop**


    Click Install Ubuntu to begin the installation process.


    ![Image](Images/image00117.jpeg)


    **Select a Keyboard Layout**


    The system will choose English and English by default.


    You can choose a non-standard keyboard from the list if you have one. Alternatively,
    select Detect Keyboard Layout to have the system choose your keyboard for you.
    Use the to test your keyboard if you need to labeled field.


    Click Continue when you’re ready.


    ![Image](Images/image00118.jpeg)


    Select Applications to Begin With


    *   Normal Installation — This gives you the whole Ubuntu


    Desktop experience, including office applications, games, and


    media players.


    *   Minimal Installation — Select this option to preserve space on


    your hard drive, especially if you won’t be utilizing media players


    or office apps.


    You’ll be prompted to confirm the following selections as well:


    *   While installing Ubuntu, download updates — This automates the process of
    downloading huge package files. The packages will be available to apply as updates
    after the installation is complete.


    *   Install third-party graphics and Wi-Fi hardware software, as well as new media
    formats –Some hardware, like as graphics cards and wireless devices, does not
    support open-source drivers. Furthermore, some media formats, such as.wmv, are
    not covered under the GPL. If you want assistance with them, you will be required
