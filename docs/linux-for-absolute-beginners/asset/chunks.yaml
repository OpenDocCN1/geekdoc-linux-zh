    On most Linux distributions, these messages are saved to disk in the /var/log/dmesg
    file. You can observe the messages the kernel is creating with the dmesg command
    and the /var/log/dmesg log file, even during the early phases of the boot process
    when those messages can fly by your screen.


    **Runlevels and Targets**


    Finally, runlevel 6 is used to reboot a system.


    Runlevel Description


    0Shuts down the system


    1.  S, single-user mode. Used for maintenance.


    2.  Multi-user mode with a graphical interface.


    (Debian/Ubuntu)


    3.Multi-user text mode (RedHat/CentOS)


    4.Undefined


    5.Multi-user mode with graphical interface.


    (RedHat/CentOS)


    6.Reboot


    Previously, the init program was in charge of runlevels. /etc/inittab was used
    to hold the init configuration. You would modify the /etc/inittab file and adjust
    the runlevel number on the initdefault line to alter the default runlevel using
    init. As an example, here’s how to make runlevel 3 the default runlevel.


    id:3:initdefault:


    Init alternatives such as systemd and upstart, on the other hand, are quickly
    displacing init, with systemd currently being the most frequently adopted.


    Systemd uses the concept of targets instead of runlevels. Runlevels are generally
    equal to these targets. Look at /lib/systemd/system for a list of accessible targets.
    The runlevel targets are essentially symlinks to the actual targets.


    Runlevel5.target, for example, is a symlink to graphical.target.


    # cd /lib/systemd/system


    # ls -l runlevel*target


    lrwxrwxrwx. 1 root 15 Jul 17 2014 runlevel0.target -> poweroff.


    target


    lrwxrwxrwx. 1 root root 13 Jul 17 2014 runlevel1.target -> rescue.


    target


    lrwxrwxrwx. 1 root root 17 Jul 17 2014 runlevel2.target -> multi-u


    ser.target


    lrwxrwxrwx. 1 root root 17 Jul 17 2014 runlevel3.target -> multi-u


    ser.target


    lrwxrwxrwx. 1 root root 17 Jul 17 2014 runlevel4.target -> multi-u


    ser.target


    lrwxrwxrwx. 1 root root 16 Jul 17 2014 runlevel5.target -> graphi


    cal.target


    lrwxrwxrwx. 1 root root 13 Jul 17 2014 runlevel6.target -> reboot.


    target'
