    ### Compressing Files to Save Space


    Compress a file with a `gzip` file. `file.gz` is the name of the compressed file
    that results.


    Uncompress files with a `gunzip` file.


    Concatenates and displays compressed files with `gzcat` or `zcat`.


    The command `du` can be used to see how much space a file takes up.


    - `du`: Estimates file usage.

    - `du - k`: Display sizes in Kilobytes.

    - `du -h`: Display sizes in a human-readable format. For example, `1.2M`, `3.7G`,
    etc.


    Here are some simple examples of how to compress and uncompress files:


    ```bash

    $ du -k data

    15360 data

    $ gzip data

    $ du -k data.gz

    26 data.gz

    $ ls data*

    data.gz

    $ gunzip data.gz

    $ ls data*

    data

    $ du -k misc.tar

    10 misc.tar

    $ gzip misc.tar

    $ du -k misc.tar*

    misc.tar.gz

    ```


    ### Compressing Archives


    In modern versions of the `tar` command, `gzip` compression is built-in. If you
    want to create, extract, or list the contents of a compressed archive, use the
    `-z` argument. As a matter of convention compressed tar files will end in either
    `.tar.gz` or `.tgz`. Here is how this looks:


    ```bash

    $ tar zcf tps.tgz tpsreports

    $ ls *.tgz

    tps.tgz

    $ tar ztf tps.tgz

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    ```


    If you run across an older version of `tar` without `gzip` compression built-in,
    you can use pipes to create compressed archives. When a hyphen (`-`) is used in
    place of a file name, that means to use standard output. Running the command `tar
    cf - pattern` will create an archive of “pattern” and send the output to standard
    output which is normally your screen. If you follow the command with a pipe, that
    standard output will be used as the input for the next command following the pipe.
    To force `gunzip` to send its output to standard out, use the `-c` argument. With
    this in mind, here is how you can create, list, and extract a compressed archive
    using `tar`, `gzip`, and pipes:


    ```bash

    $ tar cf - tpsreports | gzip > tps.tgz

    $ ls *.tgz

    tps.tgz

    $ gunzip -c tps.tgz | tar tf -

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    $ cd /tmp

