- fmt: "\nThe `netstat` command is used to monitor the active connections with your\
    \ network and helps you in blocking any unwanted or suspicious connections that\
    \ may provide an entry for hackers and malware. You can also keep track of every\
    \ packet that is delivered and received. This command is always a go-to command\
    \ for most of the network and system administrators.\n\nWhile your network is\
    \ engaged and connected to various devices, all trying to access it and acquire\
    \ or provide information, something needs to step in to keep an eye on the security\
    \ here. This is where the Secure Shell (SSH) comes into play.\n\nBefore SSH came\
    \ along, there was `Telnet`. This was initially seen as a revolution where a person\
    \ could access another remote machine without being there physically. This caught\
    \ the attention of all kinds of people, including some prying eyes too. Soon enough,\
    \ people realized that these methods were not secure and anyone could practically\
    \ “eavesdrop” on their exchange.\n\nThe `SSH` does what `Telnet` failed to do\
    \ so; it encrypts all of your data of the session. It also allows clients of any\
    \ operating system a secure way to transfer their files and folders without worrying\
    \ about prying eyes in the middle. Understanding `SSH` is not a day’s job or even\
    \ that of a book. Individuals interested in learning more about encryption, `SSH`,\
    \ and `SSHD` can find a variety of information online. These are on an advanced\
    \ level and hence would not suit the beginners at this point.\n\nIt takes time\
    \ and practice to get the hang of things in the world of Linux, but once you start\
    \ to understand how things work, you will soon be surfing over issues as if they\
    \ mean nothing. It’s probably better to get used to the concept that the `LUI`\
    \ is your best buddy in this situation.\n\n## Scripting\n\nAn exceptional ability\
    \ of a computer is that it can do automated tasks for you. In a Linux system,\
    \ you can control the function by writing a “program” according to your preferred\
    \ automated activities.\n\nThis is where scripts enter the picture.\n\n### What\
    \ Is Scripting for?\n\nA script is a collection of data and commands that are\
    \ stored in files. A shell is in charge of reading the collection, and as it reads\
    \ data, it follows the instructions.\n\nScripts can handle basic tasks, as well\
    \ as complicated ones. They can be used to perform powerful executions.\n\nScripting\
    \ has many common uses including:\n* Retrieves updates\n* Maintains repositories\
    \ of vital updates\n* Gathers up to thousands of files and transmits them to web\
    \ servers\n* Copy up to thousands of files to web servers\n* Builds a hierarchy\
    \ of pages\n\n### Writing and Editing a Script\n\nA script contains ASCII texts.\
    \ Writing a script is done via a text editor. To write a functional script, you\
    \ should remember that it has to contain three lines.\n\nSample:\n```python\n\
    #! python\n# first ever script\necho “Hello World!”\n```\nAs the sample shows,\
    \ the script has three lines: (1) the first line contains `#! python`; it is an\
    \ important line that indicates the program needed for the script’s interpretation\
    \ (i.e., `python`), (2) the second line contains `# first ever script`; it is\
    \ the preferred title for a script, and (3) the third line contains `echo “Hello\
    \ World!”`; it is the script.\n\nAfter writing the script, the need to set permission\
    \ follows. It enables the script’s execution. It can be done via the `chmod` command.\n\
    \nSample:\n```bash\nchmod 700 first_ever_script\n```\nAs the sample shows, `chmod`\
    \ is used; `chmod` is the command in charge of granting permissions to files and\
    \ directories. `700` is also used; it is a read and write permission to execute.\n\
    \nEditing a script is permitted. Let us say that instead of “700” (a private read\
    \ and write permission), you prefer “755” (a public read and write permission).\
    \ To do so, learn about two commands: (1) `aliases` and (2) shell functions.\n\
    \nAliases are commands that can create sub-commands.\n\nSample:\n```bash\nalias\
    \ tomorrow = ‘current date + “%A, %B, %Y”’\n```\nAs the sample shows, the created\
    \ alias is `tomorrow`. It is tasked to display tomorrow’s date with the provided\
    \ information.\n\nThe other command for script editing is called shell functions.\
    \ Shell functions are like aliases. The difference is in the complexity of execution.\
    \ Aliases are for simple commands. Shell functions can handle instruction sets\
    \ that are more complicated.\n\nShell functions are also called little sub-scripts.\
    \ Due to their nature of managing scripts that can sometimes be difficult to comprehend,\
    \ they are considered scripts within scripts.\n\nSample:\n```bash\nfunction tomorrow\
    \ {\n    echo “Tomorrow’s date is:”\n    current date +”%A, %B %Y”\n}\n```\nAs\
    \ the sample shows, the shell function is designed to display tomorrow’s date.\
    \ It uses data from the current date. It is similar to the provided sample of\
    \ an alias method. The difference is that it can display a custom statement (“Tomorrow’s\
    \ date is:`), on top of the necessary data.\n\n## Learning and Understanding Bash\n\
    \n`BASH`, short for Bourne-again Shell is a command processor that reads scripts.\
    \ It operates in a text window. There, the user inputs commands that cause particular\
    \ actions.\n\n`BASH` supports glob. Glob are patterns that specify a set of filenames.\
    \ These filenames feature wildcard characters.\n\nSome wildcard characters are:\n\
    * `?` – for matching a single character\n* `*` – for matching none or several\
    \ characters\n* `[abc]` – for matching one character that is present in a given\
    \ bracket\n* `[!abc]` – for matching one character that is absent in a given bracket\n\
    * `[a – z]` – for matching one character that is present in the range of a given\
    \ bracket\n* `[!a – z]` – for matching one character that is absent in the range\
    \ of a given bracket\n\nWhen `BASH` is set in concurrent mode, the execution of\
    \ two commands is allowed. For these commands to be executed properly, they have\
    \ to be presented with the use of an ampersand (`&`).\n\n```bash\nfirst command\
    \ & second command\n```\nAs the sample shows, the “first command” is executed.\
    \ Once the execution is finished, the “second command” is processed.\n\nRules\
    \ of `BASH`:\n* With the use of the ampersand, one command can be executed in\
    \ the “big” or background\n* Usually, a command’s execution is done in `fg` or\
    \ foreground\n* A running process is subject to the system administrator’s suspension\
    \ by pressing `ctrl` + `z`\n* A background process might be suspended in favor\
    \ of a running process\n\nMoreover, there exists a command called `BASHBUG`. Once\
    \ it is invoked, the default text editor is launched. It comes with a form that\
    \ a user can fill in. Once completed, the form is mailed to BASH maintainers.\n\
    \n## Substitutions, Variables, and Constants\n\nSubstitutions are allowed in Linux\
    \ programming. It is done for the modification of a file in favor of a preferred\
    \ command.\n\nSample #1:\n```bash\n# create_page ! – A script for production of\
    \ an HTML file\nconcatenate <<- _EOF_\n<HTML>\n<HEAD>\n<TITLE>\nUser_System_Info\n\
    </TITLE>\n</HEAD>\n<BODY>\n<H1>User_System_Info</H1>\n</BODY>\n</HTML>\n_EOF_\n\
    ```\n\nSample # 2:\n```bash\n# create_page ! – A script for production of an HTML\
    \ file\ntitle=”User_System_Info”\nconcatenate <<- _EOF_\n<HTML>\n<HEAD>\n<TITLE>\n\
    System_Info_1\n</TITLE>\n</HEAD>\n<BODY>\n<H1>System_Info_1</H1>\n</BODY>\n</HTML>\n\
    _EOF_\n```\nAs sample # 2 shows, the title of the HTML file in sample # 1, “User\
    \ System Info”, was changed to “System Info 1”.\n\nOne of the commonly used concepts\
    \ in substitutions is variables. Variables are one of the fundamentals in programming.\
    \ They are elements that can store data, and they are referred to by a particular\
    \ name.\n\nReminders when creating a variable name:\n* A variable’s name should\
    \ start with a letter.\n* Punctuation marks are not allowed\n* Refrain from perusing\
    \ embedded spaces; use underscores\n\nSome variables are ready to use. They are\
    \ already pre-defined in scripts every time a system administrator logs in. These\
    \ variables in uppercase letters are called environment variables.\n\nSample:\n\
    ```bash\n# create_page ! – A script for production of an HTML file\ntitle= “System_Information”\n\
    concatenate <<- _EOF_\n<HTML>\n<HEAD>\n```\n"
  raw: 'The netstat command is used to monitor the active connections with your network
    and helps you in blocking any unwanted or suspicious connections that may provide
    an entry for hackers and malware. You can also keep track of every packet that
    is delivered and received. This command is always a go-to command for most of
    the network and system administrators.


    While your network is engaged and connected to various devices, all trying to
    access it and acquire or provide information, something needs to step in to keep
    an eye on the security here. This is where the Secure Shell (SSH) comes into play.


    Before SSH came along, there was Telnet. This was initially seen as a revolution
    where a person could access another remote machine without being there physically.
    This caught the attention of all kinds of people, including some prying eyes too.
    Soon enough, people realized that these methods were not secure and anyone could
    practically “eavesdrop” on their exchange.


    The SSH does what Telnet failed to do so; it encrypts all of your data of the
    session. It also allows clients of any operating system a secure way to transfer
    their files and folders without worrying about prying eyes in the middle. Understanding
    SSH is not a day’s job or even that of a book. Individuals interested in learning
    more about encryption, SSH, and SSHD can find a variety of information online.
    These are on an advanced level and hence would not suit the beginners at this
    point.


    It takes time and practice to get the hang of things in the world of Linux, but
    once you start to understand how things work, you will soon be surfing over issues
    as if they mean nothing. It’s probably better to get used to the concept that
    the LUI is your best buddy in this situation.


    **Scripting**


    An exceptional ability of a computer is that it can do automated tasks for you.
    In a Linux system, you can control the function by writing a “program” according
    to your preferred automated activities.


    This is where scripts enter the picture.


    **What Is Scripting for?**


    A script is a collection of data and commands that are stored in files. A shell
    is in charge of reading the collection, and as it reads data, it follows the instructions.


    Scripts can handle basic tasks, as well as complicated ones. They can be used
    to perform powerful executions.


    Scripting has many common uses including:


    *   Retrieves updates


    *   Maintains repositories of vital updates


    *   Gathers up to thousands of files and transmits them to web


    servers


    *   Copy up to thousands of files to web servers


    *   Builds a hierarchy of pages


    **Writing and Editing a Script**


    A script contains ASCII texts. Writing a script is done via a text editor. To
    write a functional script, you should remember that it has to contain three lines.


    Sample:


    #! python


    # first ever script


    echo “Hello World!”


    As the sample shows, the script has three lines: (1) the first line contains “#!
    python”; it is an important line that indicates the program needed for the script’s
    interpretation (i.e., python), (2) the second line contains “# first ever script”;
    it is the preferred title for a script, and (3) the third line contains “echo
    “Hello World!”; it is the script.


    After writing the script, the need to set permission follows. It enables the script’s
    execution. It can be done via the “chmod” command.


    Sample:


    chmod 700 first_ever_script


    As the sample shows, “chmod” is used; chmod is the command in charge of granting
    permissions to files and directories. “700” is also used; it is a read and write
    permission to execute.


    Editing a script is permitted. Let us say that instead of “700” (a private read
    and write permission), you prefer “755” (a public read and write permission).
    To do so, learn about two commands: (1) aliases and (2) shell functions.


    Aliases are commands that can create sub-commands.


    Sample:


    alias tomorrow = ‘current date + “%A, %B, %Y”’


    As the sample shows, the created alias is “tomorrow”. It is tasked to display
    tomorrow’s date with the provided information.


    The other command for script editing is called shell functions. Shell functions
    are like aliases. The difference is in the complexity of execution. Aliases are
    for simple commands. Shell functions can handle instruction sets that are more
    complicated.


    Shell functions are also called little sub-scripts. Due to their nature of managing
    scripts that can sometimes be difficult to comprehend, they are considered scripts
    within scripts.


    Sample:


    function tomorrow {


    echo “Tomorrow’s date is:”


    current date +”%A, %B %Y”


    }


    As the sample shows, the shell function is designed to display tomorrow’s date.
    It uses data from the current date. It is similar to the provided sample of an
    alias method. The difference is that it can display a custom statement (“Tomorrow’s
    date is:”), on top of the necessary data.


    **Learning and Understanding Bash**


    BASH, short for Bourne-again Shell is a command processor that reads scripts.
    It operates in a text window. There, the user inputs commands that cause particular
    actions.


    BASH supports glob. Glob are patterns that specify a set of filenames. These filenames
    feature wildcard characters.


    Some wildcard characters are:


    *   ? – for matching a single character


    *   – for matching none or several characters


    *   [abc] – for matching one character that is present in a given


    bracket


    *   [!abc] – for matching one character that is absent in a given


    bracket


    *   [a – z] – for matching one character that is present in the ran


    ge of a given bracket


    *   [!a – z] – for matching one character that is absent in the ran


    ge of a given bracket


    When BASH is set in concurrent mode, the execution of two commands is allowed.
    For these commands to be executed properly, they have to be presented with the
    use of an ampersand (“&”).


    Sample:


    first command & second command


    As the sample shows, the “first command” is executed. Once the execution is finished,
    the “second command” is processed.


    Rules of BASH:


    *   With the use of the ampersand, one command can be executed


    in the “big” or background


    *   Usually, a command’s execution is done in “fg” or foreground


    *   A running process is subject to the system administrator’s


    suspension by pressing “ctrl” + “z”


    *   A background process might be suspended in favor of a run


    ning process


    Moreover, there exists a command called BASHBUG. Once it is invoked, the default
    text editor is launched. It comes with a form that a user can fill in. Once completed,
    the form is mailed to BASH maintainers.


    **Substitutions, Variables, and Constants**


    Substitutions are allowed in Linux programming. It is done for the modification
    of a file in favor of a preferred command.


    Sample #1:


    # create_page ! – A script for production of an HTML file


    concatenate <<- _EOF_


    <HTML>


    <HEAD>


    <TITLE>


    User_System_Info


    </TITLE>


    </HEAD>


    <BODY>


    <H1>User_System_Info</H1>


    </BODY>


    </HTML>


    _EOF_


    Sample # 2:


    # create_page ! – A script for production of an HTML file


    title=”User_System_Info”


    concatenate <<- _EOF_


    <HTML>


    <HEAD>


    <TITLE>


    System_Info_1


    </TITLE>


    </HEAD>


    <BODY>


    <H1>System_Info_1</H1>


    </BODY>


    </HTML>


    _EOF_


    As sample # 2 shows, the title of the HTML file in sample # 1, “User System Info”,
    was changed to “System Info 1”.


    One of the commonly used concepts in substitutions is variables. Variables are
    one of the fundamentals in programming. They are elements that can store data,
    and they are referred to by a particular name.


    Reminders when creating a variable name:


    *   A variable’s name should start with a letter.


    *   Punctuation marks are not allowed


    *   Refrain from perusing embedded spaces; use underscores


    Some variables are ready to use. They are already pre-defined in scripts every
    time a system administrator logs in. These variables in uppercase letters are
    called environment variables.


    Sample:


    # create_page ! – A script for production of an HTML file


    title= “System_Information”


    concatenate <<- _EOF_


    <HTML>


    <HEAD>'
