    In this example, the initial RAM disk is initrd.img-3.13.0-46-generic.


    Previous messages are discarded when the pad is full to make room for new ones.
    Use the dmesg command to view the contents of the kernel ring buffer.


    $ dmesg


    [ 0.000000] Initializing cgroup subsys cpuset


    [ 0.000000] Initializing cgroup subsys cpu


    [ 0.000000] Initializing cgroup subsys cpuacct


    [ 0.000000] Linux version 3.13.0-46-generic (buildd@orlo) (gcc


    version 4.8.2 (Ubuntu 4.8.2-19ubuntu1) ) #79-Ubuntu SMP Tue


