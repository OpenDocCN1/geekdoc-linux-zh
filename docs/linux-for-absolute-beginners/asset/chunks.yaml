- fmt: '

    The next step for Linux came from Andrew S. Tanenbaum. At the time, he was a professor
    at the University of Amsterdam. He developed Minix, an operating system for educational
    purposes for his students to demonstrate and understand the UNIX principles. But,
    as he pointed out, Minix was not intended to be used in practice.


    Linus Torvalds, a Finish student at the University of Helsinki, was a user of
    Minix and quite unhappy with its boundaries. In 1990, he began to develop a new
    operating system based on the ideas of Minix, the UNIX principles, and the POSIX
    standard. His motivation was to have his own system that was understandable and
    maximized to the boundaries of the hardware. He also wanted to have fun and had
    no commercial intent in mind. The entire story behind Linux is described in his
    autobiographical book titled Just for Fun. Today, Linus Torvalds oversees the
    development of the Linux kernel.


    It needed a nice logo to make Linux attractive to the outside world. Based on
    a competition for mascots, many proposals were handed in. Larry Ewing sent in
    his idea for a penguin, as seen on the cover of this book, and his proposal won.
    Designed with a cheeky smile and a well-fed body, this penguin named Tux represents
    the image of a happy and satisfied user.


    ## Linux Range of Use


    Linux was originally built for Intel-based systems, although it now runs on a
    wide range of platforms. ARM architectures (`arm` and `arm64`), Motorola/68k Freescale’s
    architecture (`m68k`), Intel x86 (`i386` and `amd64`), IBM s390 (`s390`), PowerPC
    (`PowerPC`), and SPARC (`sparc`) are just a few examples.


    Linux was designed with server systems in mind from the start. As a web server,
    file server, mail and news server, internet gateway, wireless router, and firewall,
    it is widely used. Used as a computing unit, it helped render video sequences
    and entire films such as Titanic, Shrek, and Toy Story. Furthermore, Linux is
    used in automotive products, astronautics, military, logistics, and the engineering
    environment. All of the world’s stock exchanges have been run on Linux servers
    since 2006. Almost all online search engines are also run by it.


    Linux has also swept the desktop during the previous decade. It’s a solid configuration
    for text processing, graphic design, desktop publishing, communication (email,
    chat, audio, and video), and user interfaces for your phone and television because
    of its high flexibility and reliability.


    ## Linux Certifications


    The rising adoption of Linux has boosted the demand for engineers and users who
    are well-versed in the operating system. A Linux certification becomes helpful
    at this time. There are two types of certifications: general (not specific to
    distribution) and targeted (specific to distribution) (specific to a Linux distribution).
    The tables below provide an overview of the most common certifications currently
    available.


    ### Non-specific Certifications


    - Linux Essentials

    - LPIC-1: Linux Server Professional Certification

    - LPIC-2: Linux Engineer

    - Linux Foundation Certified System Administrator (LFCS)

    - Linux Foundation Certified Engineer (LFCE)

    - CompTIA A+

    - CompTIA Network+


    ### Distribution-specific Certifications


    - RedHat Certified Engineer (RHCE)

    - RedHat Certified System Architect (RHCSA)

    - RedHat Certified Architect (RHCA)

    - SUSE Certified Administrator (SCA)

    - SUSE Certified Engineer (SCE)

    - SUSE Enterprise Architect (SEA)


    ## Installing Linux


    People think installing the Linux operating system is a very tough task. It is
    known to have the most uncomplicated installations compared to the other operating
    systems. Most of the Linux operating system versions offer you Live Distribution.
    It means that the installation can be done with the help of a CD or USB without
    making any considerable changes to your hardware. Isn’t this just amazing? These
    distribution options provide you with full functionality without installing it
    forever.


    For example, the following are the steps for Ubuntu Linux that will guide you
    through the installation process:


    - **Preparation**: The first thing to ensure is that your machine meets the requirements.
    Next, it might ask you whether you want to install third-party software.

    - **Wireless setup**: When you install the system on the laptop, you will have
    to connect to a network to ensure that third-party software download is successful.

    - **Hard drive allocation**: It is the step where you need to choose the way you
    want the Linux operating system to be installed on your desktop or laptop. Are
    you going to go with dual booting? Then use the whole hard drive upgrade the present
    installation.


    Choose the kind of installation you prefer and then click on install now.

    - **Location**: choose location from the map

    - **Keyboard setup**: choose the keyboard setup

    - **User setup**: type in your username and password to finish the installation


    After these steps are followed, reboot, and it is ready to go! Installing Linux
    is known to be the simplest, as well as the safest, software when compared to
    other operating systems.


    ## Important Considerations While Installing Linux


    Installing Linux is pretty easy as almost every distribution has its graphical
    install scheme. Nowadays, installation is a piece of cake, involving only a few
    clicks as the software data has grown enormously over the years. That is why most
    distributions only provide the primary material for running the Linux in the shape
    of CD and DVD. Distributions further provide links to the online repositories,
    which can be downloaded later after the primary installation from CD and DVD.
    Installation now is a mere setting of initial configuration, which can be enhanced
    later by downloading the specific drivers of your choice from the online repositories.
    Many distributions also provide you with the freedom of creating your install
    discs. You can install the software of your liking on your own CD/DVD.


    Some important installation considerations include the following:


    - Software available on CDs and DVDs is prone to outdating. Thus, the need for
    online repositories becomes critical as it helps download and update the software.

    - Some distributions keep on updating their original releases now and then. These
    updated versions are available on their respective sites and must be checked for
    their availability.

    - Hardware is mainly automatically detected nowadays. It includes your monitor
    and graphic cards, etc.

    - Most distributions provide `Parted` (partition management tool). It’s straightforward
    to use and helps you in setting up your partitions.

    - Some sources can be utilized for installation purposes. For instance, network
    methods like `NFS`, `Hypertext Transfer Protocol (HTTP)`, and `File Transfer Protocol
    (FTP)`.

    - Boot managers like `GRUB` or `Linux Loader (LILO)` usually support the dual-boot
    installation. These boot loaders can be easily configured to boot Mac, Windows,
    and other Linux installations on the same system.

    - Distributions deal 32-bit and 64-bit as separate entities and provide their
    different releases. Newer computers support 64-bit nowadays, whereas weaker systems
    support 32-bit.

    - Dynamic Configuration Protocol (`DHCP`) or `IPv6` helps connect to a network
    router, and this network configuration usually is automatic.

    - `RAID` and `LVM` file systems can be set up during installation, as you have
    the option to customize your partitions using `Parted`.

    - It’s incredibly vital to have a separate boot partition if you are using `LVM`
    and `Raid` file systems.

    - Most distributions also run a post-installation process. It helps perform the
    basic configuration tasks like creating a user account, setting the date and time,
    and configuring your firewall.

