    ## 关于 Shell


    Shell（或 shell 解释器）是一个允许用户与系统交互并处理所指示命令的程序。从 shell 调用的命令可以分为内部命令（它们实际上对应于 shell
    自身解释的命令）和外部命令（它们对应于 shell 外部的可执行文件）。除了命令外，shell 句提供了其他元素来增强其功能，例如变量、函数或控制结构。内部命令和可用元素的集合以及它们的语法将取决于所使用的特定
    shell。


    ## 用户


    除了从命令行使用 shell（以命令提示符作为 shell 宣告其正等待用户命令的指示）外，它还可以被用于解释 shell 脚本。shell 脚本或称为“命令脚本”是一个包含一组命令和
    shell 可解释的命令的文本文件。


    shell 是一个可执行文件，它必须解释命令、将其传递给系统并产生结果。有多种 shell。最常见的是 `sh`（称为 Bourne shell）、`bash`（Bourne
    again shell）、`csh`（C Shell）、`tcsh`（Tenex C shell）、`ksh`（Korn shell）和 `zsh`（Zero
    shell）。通常，它们的名称与可执行文件的名称一致。


    每个用户都有一个默认 shell，它在打开命令提示符时会被激活。默认 shell 指定在配置文件 `/etc/passwd` 中，位于对应用户的行的最后一个字段。在会话期间可以更改
    shell。为此，你只需执行相应的可执行文件，例如：


    ```bash

    /bin/bash

    ```


    ## 系统指示符


    shell 在读取其完整配置（位于 `/etc` 目录下的文件）时启动，然后读取用户自己的配置（一个以点开头的隐藏文件，位于用户的基本目录中，即 `/home/user_name/.configuration_file`）。随后会显示以下指示符：


    ```

    team: /directory/current $

    ```


    默认情况下，对于大多数 shell，指示符由计算机名称组成，后跟一个冒号（`:`）、当前目录，以及一个指示已连接用户类型的字符：


    - `$` 指定普通用户；

    - `#` 指定管理员，称为 `root`。


    ## 命令行概念


    命令行是由命令组成的字符字符串，该命令对应于系统的一个可执行文件，或者说，是一个 shell 命令以及可选参数（参数）：


    ```bash

    ls -al /home/jf/

    ```


    以 `-` 开头的参数称为选项。通常，对于每个命令，在输入以下命令之一时，会有一定数量的选项可以详细说明：


    ```bash

    command --help

    command -?

    man command

    ```


    ## 重定向


    与任何 Unix 系统一样，Linux 拥有允许将标准输入输出重定向到文件的机制。因此，如果使用 `>` 字符，左侧命令的标准输出可以重定向到右侧的文件：


    ```bash

    ls -al /home/jf/ > toto.txt

    echo “Toto” > /etc/myconfigurationfile

    ```


    以下命令等同于对文件的复制：


    ```bash

    cat toto> toto2

    ```


    重定向 `>` 的目的是创建一个新文件。如果已存在同名文件，则必须将其删除。以下命令简单地创建了一个空文件：


    ```bash

    >file

    ```


    使用双字符 `>>` 允许你将标准输出添加到文件中，即它允许你在不删除文件的情况下在文件末尾添加输出。


    同样，`<` 字符表示标准输入的重定向。以下命令使用 `cat` 命令发送 `toto.txt` 文件的内容，`cat` 的唯一目的是在标准输出中显示内容（这个示例并没用，但具有启发性）：


    ```bash

    cat<toto.txt

    ```


    最后，使用重定向 `<<` 允许在标准输入中读取，直到找到右侧的链。在下面的示例中，读取标准输入直到找到单词 `STOP`。然后显示结果：


    ```bash

    cat<<STOP

    ```


    ## 通信管道


    管道是所有 UNIX 系统中特有的特定通信机制。管道用竖线（字符 `|`）表示，它允许你将一个命令的标准输出分配给另一个命令的标准输入，就像管道允许命令的标准输入与其他标准输出之间进行通信一样。


    在下面的示例中，`ls -al` 命令的标准输出传递给 `sort`，后者将按字母顺序提取结果：


    ```bash

    ls -al | sort

    ```


    这允许通过管道连接一定数量的命令。在下面的示例中，显示当前目录下的所有文件，筛选包含 `zip` 的行，并统计总行数：


    ```bash

    ls -l | grep zip | wc -l

    ```


    ## Linux 中的 Shell 脚本


    ### 调用


    在最基本的形式中，shell 脚本可以是包含一个或多个命令的简单文本文件。为了帮助识别内容，shell 脚本通常具有 `.sh` 扩展名，我们将遵循这一标准（但记住它是信息性的且可选的）。例如，以下文件就是一个
    shell 脚本：


    ```bash

    Script.sh

    echo “ 文件夹内容:”

    ls ~/

    ```


    练习：

    1. 验证 `script.sh` 文件具有通用执行权限（如果没有，只需执行 `chmod +x script.sh`）。

    2. 调用要解释的脚本，例如使用命令：

    ```bash

    ./script.sh

    ```


    除了命令外，shell 脚本可能包含 shell 提供的其他增强脚本功能的元素。总之，shell 脚本的基本结构如下：


    ```bash

    script_ejemplo.sh

    #!/bin/dash

    # 这是注释

    echo Hello

    ps w

    echo “ 读取脚本的进程: $$”

    ```

    - `#!` — Shebang

    - `# 注释（不解释）

    - 脚本内容


    “shebang”允许在使用隐式调用时指定你希望解释脚本其余部分的命令解释器。该行的语法是：#!` 后紧跟 shell 的可执行文件，在此应注意以下几点：


    - 它必须是脚本的第一行，否则它将被解释为注释（以 `#` 字符开头）。

    - `#!` 与 shell 可执行文件之间可以存在空格。

    - shebang 不是强制性的（当使用隐式调用时，如果未指定，将尝试使用调用脚本的相同类型的 shell）。


