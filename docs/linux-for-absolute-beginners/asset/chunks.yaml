    After that, you’ll get a dialog box asking you to choose an installation type.
    By selecting `Erase disk and install Ubuntu`, you may wipe the hard drive clean
    before installing Ubuntu. If you choose this option, skip to the next stage.


    Advanced users may choose to make changes to Advanced Features. Set your own disk
    partitions or other additional parameters using this command:


    With the fresh Ubuntu installation, use LVM:


    *   Logical Volume Management (`LVM`) is an acronym for Logical Volume Management.
    This is a program that allows you to manage many virtual disks on your computer
    in real time. It’s similar to a more advanced version of the `gparted` utility.

    *   To make the new Ubuntu installation more secure, encrypt it: This will encrypt
    the contents of the disk. You’ll need to pick a security key in order to decrypt
    and utilize the disk.

    *   Experiment with erasing the drive and replacing it with ZFS: ZFS stands for
    Zettabyte File System, but it has evolved into a hybrid file system and volume
    manager. Avoid using this option on mission-critical production systems while
    it is still being tested.


    Click `Something Else` if you’d prefer make your own hard drive partitions. You
    can design your own partition table and logical disks on the following screen.
    This allows you to split a physical hard disk into many partitions. Partitions
    are treated as separate disks by the operating system.


    Note: that some users build a second disk for their `/home` directory. The partition
    containing the `/home` directory remains unaffected if the operating system has
    to be reinstalled.


    To apply your modifications to the disk partitions, click `Continue`.


    You’ll be prompted to make disk changes? Until you click `Continue` on this screen,
    none of the selections you’ve chosen are permanent. To continue, click `Continue`.


    ### Choose a time zone

    The installation will ask, “Where are you?” once the machine has formatted the
    disk partitions. Fill in the name of the nearest big city, and the system will
    calculate your local time zone.


    Click `Continue`.


    ### Make a User Account

    After that, you’ll need to create a user account. Please complete the following
    fields:


    *   Name: Your given name.

    *   Hostname or network name: This is the name of the computer.

    *   Username: The name of the user account you wish to utilize.

    *   Enter and confirm a strong password; the installer will evaluate your password
    strength automatically.

    *   Automatically log in: This is not a good idea for servers that are open to
    the public.

    *   To log in, you’ll need my password: This is suggested for servers that are
    open to the public.


    To install Ubuntu, click `Continue`.


    Remove the Ubuntu installation disc after the installer is finished. You’ll be
    asked to restart right away.


    ![Image](Images/image00120.jpeg)


    The machine should now boot into Ubuntu 20.04, which you just installed.


    ### Conclusion

    You should now have Ubuntu 20.04 installed successfully on your machine.


    ### Fixing Grub

    You probably don’t want Ubuntu to appear multiple times on the boot list if you
    are like me. You may want the Windows option to come first, especially if other
    family members use the computer and are used to using Windows.


    Open a terminal window by opening the Dash and typing “Term.” Then, click on the
    terminal icon.


    Type the following into the terminal window:


    ```bash

    sudo gedit /etc/default/grub


    # If you change this file, run ‘update-grub’ afterward to update

    # /boot/grub/grub.cfg.

    # for full documentation of the options in this file, see:

    # info -f grub -n ‘Simple configuration’


    GRUB_DEFAULT=”2”

    #GRUB_HIDDEN_TIMEOUT=”0”

    GRUB_HIDDEN_TIMEOUT_QUIET=”true”

    GRUB_TIMEOUT=”10”

    GRUB_DISTRIBUTOR=``lsb_release -i -s 2> /dev/null || echo Debian`”


    GRUB_CMDLINE_LINUX_DEFAULT=”quiet splash”

    GRUB_CMDLINE_LINUX=""”

    ```


    If you want Windows to be the default option, you can either edit the `grub.cfg`
    file (there is a comment in the file saying not to do this) or you can change
    the default to point to the Windows option first.


    While editing the `/etc/default/grub` file won’t put Windows at the top of the
    list, it will make it the highlighted option when you start the computer.


    To do this, change `GRUB-DEFAULT` to be the position in the Windows list when
    you start the computer.


    On my computer Ubuntu is first, Ubuntu Advanced Options is next, and Windows is
    third.


    Note that the numbering starts from position 0 so Ubuntu is 0, Ubuntu Advanced
    is 1, and Windows is 2.


    Save the file when you have changed the default and run the following command:


    ```bash

    sudo update-grub

    ```


    The Grub file will be updated and if you reboot, Windows will be selected automatically.


    Regarding the extra Ubuntu entries, there are multiple entries because you will
    have more than one Linux kernel installed.


    You can either edit the `grub.cfg` file directly to remove the extra entry (not
    recommended) or you can remove the additional kernels by running `Synaptic` and
    looking for older installed version numbers.


    I would leave the duplicate entries there and just not select them.


    ### A Quick Tour of Ubuntu

    This quick tour is aimed at anyone who has never seen Ubuntu before and highlights
    the look and feel, the applications, and the functionality that comes as standard.


    Ubuntu comes with the `Unity` desktop which has been part of Ubuntu since version
    11.04. The `Unity` desktop has matured and now provides a great user experience.


    If you are a Windows user, the initial look and feel will be unfamiliar to you,
    but after a few weeks, you will appreciate the way Ubuntu and the Unity desktop
    work.


    The first thing to note is the bar at the top of the screen. The bar acts as a
    menu bar for any application that is loaded and this saves screen real estate
    leaving more room for the application itself. Also on the bar is a series of icons
    giving access to the most common system settings such as adjusting power management,
    connecting to the internet, toggling Bluetooth on and off, and adjusting audio
    settings. There is also a clock and a power button.


    The left side of the screen is taken up by a launch bar which contains a list
    of icons for the commonly used applications. The launch bar makes it possible
    to get to your favorite applications with one mouse click. Any application that
    you open appears at the bottom of the launch bar and if you connect an external
    device such as a USB drive or a portable hard drive, this will also appear.


    Navigate Ubuntu is quick and easy. There are no fiddly menu systems to navigate
    and there is no tile insight. Navigate then click the Ubuntu icon at the top of
    the launch bar, but the easiest way to navigate is to press the super key (Windows
    icon) on your keyboard.


    The screen that appears is called the Dash and from here you can accomplish any
    task with a minimum of mouse clicks and/or keystrokes. To find an application,
    you can simply start typing in the search bar. More often than not this is effective
    enough to find what you need without further interaction.


    The lenses provide applications, files and folders, music, photos, and videos.
    As well as files and applications on your computer, the Dash also displays suggestions
    of applications that you might like to purchase. Some people deem this a bad thing,
    but there is an option to turn it off.


    The videos lens enables you to filter your search so that you can search locally
    on your computer or via services such as the BBC and YouTube. The music lens enables
    you to filter your music by sub-genres and age. Ubuntu comes with an impressive
    set of applications installed by default. For example, `LibreOffice` is the default
    office suite and provides most of the functionality that you would get from Microsoft’s
    equivalent office suite.

