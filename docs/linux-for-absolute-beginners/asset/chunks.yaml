    ### 删除、复制、移动和重命名文件


    #### 删除文件


    最终，你会厌倦你创建的所有旧文件到处都是，弄乱你的主目录并并了宝贵的空间。要删除它们，请使用 `rm` 命令。


    `rm file`：删除文件。

    `rm -r directory`：递归删除目录及其内容。如果你想用 `rm` 删除目录，则必须提供 `-r` 参数。

    `rm -f file`：强制删除且从不提示确认。


    可以使用搜索模式来同时删除多个文件。在执行 `rm` 之前，用 `ls` 双重检查你想要删除的内容是个好主意。


    ```

    $ ls s*

    sales-lecture.mp3 sales.data secret secret.bak


    $ rm s*


    $ ls -d .*

    . .. .profile .bash_history


    $ rm .*

    rm: cannot remove ‘.’: Is a directory

    rm: cannot remove ‘..’: Is a directory


    $ ls -d .*

    . ..

    ```


    注意 `rm .*` 不会删除 `.`（当前目录）和 `..`（父目录）。


    #### 复制文件


    要复制文件，请使用 `cp` 命令。如果你想创建一个文件的副本，可以运行 `cp source_file destination_file`。你也可以通过
    `cp file(s) dir` 将文件或一系列文件复制到目录。


    `cp source_file destination_file`：将 `source_file` 复制到 `destination_file`。

    `cp source_file1 [source_fileN …] destination_directory`：将 `source_files` 复制到
    `destination_directory`。

    `cp -i source_file destination_file`：以交互模式运行 `cp`。如果目标文件已存在，`cp`将在覆盖之前询问你。

    `cp -r source_directory destination`：将 `source_directory` 递归复制到目标。如果目标存在，则将 `source_directory`
    复制到目标中，否则用目录内容创建目标。


    ```

    $ cp file1 file2

    $ mkdir dir

    $ cp file1 file2 dir/

    $ ls dir

    file1 file2


    $ rm dir/*

    $ cp file1 file2

    ```


