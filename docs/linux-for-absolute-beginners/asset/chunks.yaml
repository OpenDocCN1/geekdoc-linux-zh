    before you get an answer to this, there is one more question, is the operating
    system you are working on really working as perfectly as you wanted? Are you frequently
    battling slowdowns, viruses, expensive repairs, and malware? If yes, then it is
    the right time to free yourself from the constant frustration, as well as fear
    of losing your important data. Linux is the best solution for you, and you need
    to start using this operating system at your earliest convenience.


    Linux is known to be the most reliable operating system. You get a dedicated operating
    system by paying nothing, seriously. You can install Linux on as many laptops
    or desktops you want for free.


    When Linux is compared to the other servers such as Windows Server, the latter
    costs around $1200 and does not include the basics like Client Access License
    and also additional licenses including mail server, web server, etc., the Linux
    Server is free, and you do not have to pay a cent to use its reliable programs.
    It is free and also simple to install. When you have Linux as the operating system,
    you do not have to do babysitting every day. One service needs restarting, upgrading,
    etc., and the other parts are not affected.


    This operating system is distributed under the open-source license, and mentioned
    below is a list of ideas that follows:


    *   The liberty to run any program.


    *   The liberty to make changes to the programs according to your


    preference.


    *   You can even redistribute copies to help your loved ones.


    *   Lastly, you can distribute the copies of the modified version


    you created to your loved ones.


    Thus, it is a community created by you, for you. It is known to be the most straightforward
    and user-friendly operating system. It is all about freedom. Complete Linux installation
    can be done on your desktop or laptop as it does not involve a lot of complexities.


    **Development**


    The Linux operating system includes some development languages. Most of the distribution
    codes are created in C or C++ Languages. The rest of the regulations are created
    with Perl, Java, as well as Lisp. One of the most important parts of the Linux
    operating system, The Kernel has a 95% C presence. The remaining part is used
    with other languages that make this part more diverse when compared to the other
    systems. There are a few developers that at present use text-based tools to develop
    the code. Linux is known to be the most versatile operating system and a strong
    integrated development environment. It is a platform that can help you generate
    money while being free of cost. Users can be sure that the Linux operating system
    can work best for them.


    # Linux Directory Structure


    Now that you can connect to the server and have been introduced to the interface
    you will be using, it’s time to learn about the directory layout. In addition,
    it can help you answer questions like:


    *   Where are programs located?


    *   Where do configuration files live?


    *   Where might I find the log files for this application?


    **Common Directories**


    Here are the most common top-level directories you need to be aware of and interact
    with as an average user.


    **Comprehensive Directory Listing**


    Here is a comprehensive list of top-level directories that you may find on various
    Linux systems. Some subdirectories are included to help define the purpose of
    the top-level directory. You may never interact with many of these directories.
    These directories will be on every system you encounter, like /usr.


    /cgroup—Control Groups hierarchy.


    Operating system and the system administrators.


    /lib64: System Libraries, 64 bit.


    /media: Used to mount removable media like CD-ROMs.


    /mnt: Used to mount external file systems.


    /proc: Provides information about running processes.


    /sbin: System administration binaries.


    /selinux: Used to display information about SELinux.


    /srv: Contains data that is served by the system.


    /srv/www: Web server files.


    /srv/ftp: FTP files.


    /sys: The device and busses known to the Linux kernel are di


    splayed and sometimes configured with this command.


    /tmp: Temporary space, typically cleared on reboot. This direc


    tory can be used by the OS and users alike.


    /usr: User-related programs, libraries, and documentation. The


    sub-directories in /usr relate to those described above and below.


    /usr/bin: Binaries and other executable programs.


    /usr/lib: Libraries.


    /usr/local: Locally installed software not part of the base opera


    ting system.


    /usr/sbin: System administration binaries.


    /var: Variable data, most notably log files.


    /var/log: Log files.


    **Unix: Specific Directories**


    Linux is often found in environments with other Unix variants. If you ever need
    to log into a Unix server, you may see some of the following Unix-specific directories.


    ![Image](Images/image00104.gif)


    Note that you may encounter other top-level directories that have not been listed
    above. However, those were most likely created by the system administrator


    **Application Directory Structures**


    Applications can follow the same conventions employed by the operating system.
    For example, here is a sample directory structure of Apache installed in /usr/local.


    ![Image](Images/image00105.gif)


    Here is what it might look like if it was installed in /opt.


    ![Image](Images/image00106.gif)


    A common alternative to placing all the application subdirectories in /opt/app-name
    is to also use /etc/opt/app-name and /var/opt/app-name.


    ![Image](Images/image00107.gif)


    Sometimes applications that are not part of the standard operating system are
    installed in a shared manner and are not given their subdirectory. For example,
    if Apache were installed directly into /usr/local, its binaries would live in
    /usr/local/bin, and its configuration would live in /usr/local/etc. However, Apache
    may not be the only locally installed software, sharing that space with the other
    installed applications.


    Another common practice is to create a directory structure based on a company,
    organization, or team name. For example, if you work at the Acme Corporation,
    you may find a directory named /opt/acme or /usr/local/acme. Sometimes scripts
    and utilities are installed directly in that structure, and other times there
    are segregated into their subdirectories. Here’s an example.


    ![Image](Images/image00108.gif)


    Alternatively, you may see something like this.


    ![Image](Images/image00109.gif)


    Here are variations on the same idea but based on a team within the company.


    ![Image](Images/image00110.gif)


    **Example Top Level Directory Listings**


    Here is a listing of the top-level directories for a few different Linux servers:


    Red Hat Enterprise Linux 7 (RHEL)


    [bob@rhel6 ~]$ ls -1 /


    *   bin


    *   boot


    *   group


    *   dev


    *   etc


    *   home


    *   lib


    *   lib64


    *   lost+found


    *   media


    *   mnt


    *   opt


    *   proc


    *   root


    *   sbin


    *   SELinux


    *   srv


    *   sys


    *   top


    *   usr


    *   var


    *   SUSE Linux Enterprise Server 11 (SLES)'
