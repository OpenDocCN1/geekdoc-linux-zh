  trans: '


    对于浏览网页，Ubuntu 默认安装了 Firefox， Thunderbird 邮件客户端提供了 Microsoft Outlook 的许多功能。其他应用程序还包括即时消息工具、`BitTorrent`
    客户端和远程桌面软件。Ubuntu 还自带了游戏、图形应用程序以及一个用于播放音乐的音频播放器（`Rhythmbox`）。添加新应用程序非常简单。只需运行
    `Ubuntu Software Center`（Ubuntu 软件中心），搜索想要安装的应用程序类型或名称，就会出现一个可能的应用程序列表。


    `Ubuntu Software Center` 提供了一系列免费和非免费的应用程序。


    Ubuntu 对硬件的支持非常出色。


    我的多功能打印机和扫描仪在 Ubuntu 上的安装比在 Windows 上简单得多。在使用 Windows 时，打印机需要一张驱动程序光盘，需要运行一系列选项，总共大约需要
    10 分钟才能完成安装。在我运行 Ubuntu 的笔记本电脑上，我只需运行了 `add printer wizard`（添加打印机向导），设置花费不到一分钟。


    我有一个用来听音乐的 `Sony Walkman`，它可以无缝集成到 `Rhythmbox`，这意味着我可以在笔记本电脑和 MP3 播放器之间同步音乐。


    我的外部硬盘在插入后立即被识别，我有一系列 `USB pen drives`（USB 优盘），它们只需插入即可使用。我的数码相机设置也非常简单。


    Ubuntu 提供了一名为 `Ubuntu One` 的服务，你可以用它备份所有的重要文件和照片。该服务是免费的（最高 5 GB），你只需要填写一个表单，写上姓名、电子邮件地址和用于
    `Ubuntu One` 的密码即可。账户创建后，你可以选择想要备份的文件夹，并在电脑与 `Ubuntu One` 之间进行同步。


    如果你想购买更多音乐，Ubuntu 拥有自己的名为“Ubuntu One Music”的音乐服务。这是 Ubuntu 版本的 `iTunes`，其目录和价格与其他类似的服务相当。


    # 从 Ubuntu 开始


    现在，既然你已经安装了 Ubuntu，就是时候开始使用你的 Linux 操作系统了。与 `Windows` 或 `macOS` 等付费操作系统不同，后者需要你支付更多费用来获取额外的软件，而
    Ubuntu 已经预装了你所需的所有软件。你可以在 Ubuntu 中找到一切需要的，从办公套件、网络浏览器到邮件媒体工具。只要安装完成，你就可以开始使用 Ubuntu
    了。


    每个人使用电脑的方式都是独特的，每个用户都喜欢根据自己的需求定制电脑的外观和操作体验。考虑到这一点，Linux 让你可以使用它提供的许多图形界面之一。因此，Linux
    上有数百种图形界面可用，以满足每个用户的需求。


    虽然 Linux 有多种图形界面可用，但其中两个最受欢迎的是 `GNOME` 和 `KDE`。这两个环境都具有用户友好且易于使用的界面。它们在桌面外观以及如何进一步进行个性化方面存在细微差异。


    `KDE` 环境赋予用户完全的控制权和配置选项来个性化桌面。用户可以配置桌面的每个方面，并自由修改桌面的外观和体验。


    另一方面，`GNOME` 的灵感来自 `Windows` 和 `macOS` 的桌面，并优先考虑简单。`GNOME` 也可以被轻松定制，但它向用户隐藏了某些选项。


    Ubuntu 用户可以选择这两个桌面环境中的任何，也可以选择其他的桌面环境。


    Ubuntu 20.04 的默认桌面环境是 `GNOME 3.36`，但这并不意味着你不能安装其他桌面环境。让我们来看看它能为用户提供什么。


    ## 主题


    Ubuntu 20.04 LTS 带有一个经过翻新的 `Yaru` 主题，你可以从启动到桌面一直看到它。操作系统的开发者喜欢让自己的操作系统拥有独特的视觉，这有助于建立品牌形象。2020
    年 1 月，Ubuntu 的母公司 `Canonical` 与 `Yaru` 团队以及 Ubuntu 设计团队合作进行了一次设计冲刺活动。`Yaru` 在
    Ubuntu 18.10 中引入。


    ![Image](img/image00121.jpeg)


    `Yaru` 有三种类型的变体，它还有一个声音主题。在设计冲刺期间，设计师和开发者还识别出一些对桌面有益的 UI 改进。你可以通过 `Appearance`（外观）设置在
    `Light`（浅色）、`Standard`（标准）和 `Dark`（深色）之间切换桌面主题。你还可以使用 `Yaru` 提供的默认提示音。


    ![Image](img/image00122.jpeg)


    翻新的 `Yaru` 主题还让你更改启动界面和安装程序窗口。`Yaru` 团队现在将以前只出现在桌面上的旋转动画也实现在启动屏幕上。如果你使用全磁盘加密选项安装系统，那么启动菜单中的密码框也将与桌面主题匹配。


    最近 Ubuntu 的每个大版本都获得了一个新的动物吉祥物。这次也是，一个设计精美的生物被集成到了发布中。他们还给它起了一个名字。Ubuntu 20.04
    LTS 的吉祥物叫做 `Felicity`。


    默认主题壁纸以 `Felicity` 为特色。除了吉祥物壁纸，该主题还有更多。所有的图片都来自一个无版权网站，每张图片都非常有焦点。


    ## GNOME 3.36


    自 Ubuntu 17.10 发布以来，Ubuntu 一直将 `GNOME` 桌面作为默认桌面环境。Ubuntu 团队与 `GNOME` 开发者以及 Ubuntu
    社区深度合作，为 Ubuntu 用户创建了可靠的 `GNOME` 体验。Ubuntu 还与 `Debian` 的开发者合作，保持 `GNOME` 的最新更新。


    `GNOME 3.36` 具有用户可见的改进以及提升界面性能的隐藏改进。


    新增了 `do not disturb`（请勿打扰）开关，它可以静音所有通知，帮助想要专注于当前任务的用户。`GNOME 3.36` 还具有简洁精美的登录和锁定屏幕，带来了整洁的用户界面。登录和锁定屏幕会对用户的桌面背景进行模糊处理。


    状态菜单提供了挂起选项。此外，喜欢整理应用程序的用户可以使用此版本 `GNOME` 中的 `better app folder management`（更好的应用文件夹管理）功能。


    按照每个新 `GNOME` 版本的传统，桌面和系统动画现在更加流畅，而且对 CPU 的负载更小。


    ## 大型应用程序


    Ubuntu 现在可以轻松集成 `Microsoft Exchange` 和 `Google Gsuite`。它自带 `Firefox 75` 作为默认浏览器，具有持续保护用户隐私的功能。


    Ubuntu 默认邮件客户端是 `Thunderbird`，它可以让你在桌面上快速访问任何提供者的电子邮件。无论你使用什么电子邮件提供商，无论是 `Gmail`、`Microsoft`、其他
    `POP` 或 `IMAP` 服务，你都可以在 `Thunderbird` 上轻松配置邮件账户。Ubuntu 20.04 LTS 预装了 `Thunderbird
    68.7.0`。


    你还获得了 `LibreOffice 6.4` 来满足所有的办公需求。这是一个免费但强大的办公套件，可以让你轻松执行任何与办公相关的任务。


    ## 一级 OEM 支持


    ![Image](img/image00123.jpeg)


    Ubuntu 是一个非常流行的操作系统，在学校、企业、政府和公共部门被大规模使用。Ubuntu 团队与 `HP`、`Dell` 和 `Lenovo` 等电脑制造商紧密合作，以满足这些领域的预装硬件需求。让我们来看一些
    Ubuntu 与 OEM 合作伙伴合作为桌面用户 Linux 体验增值的示例。


    '
- fmt: "\nWith the release of Ubuntu 20.04 LTS, you can get a certified device experience\
    \ when you install the general release of Ubuntu. When you install Ubuntu on certified\
    \ hardware from an OEM manufacturer, all the features of that specific hardware\
    \ will be enabled automatically on the device, just as it would have been with\
    \ factory images.\n\nFor example, if you have installed Ubuntu on a Dell device,\
    \ the boot splash screen will automatically feature the Dell logo. Ubuntu also\
    \ includes `PulseAudio` 14.0, `BlueZ` 5.53, and `Sound Open Firmware` to support\
    \ `SoundWire` and `SMIC`, which is provided by OEM manufacturers on their hardware.\n\
    \nWith security being critical, we can also see that many devices ship with a\
    \ fingerprint reader and users prefer this way to unlock their systems to typing\
    \ in a password. Ubuntu and the `libfprint` project are also making it possible\
    \ to integrate this so that hardware vendors can be relieved for their devices\
    \ that feature biometric authentication.\n\n![Image](Images/image00124.jpeg)\n\
    \n![Image](Images/image00125.jpeg)\n\nA feature called `X11 fractional scaling`\
    \ has been a part of Ubuntu since Ubuntu 19.04 but was never exposed to users\
    \ via the user interface. This has been exposed finally in Ubuntu 20.04 LTS so\
    \ that Ubuntu users can enable fractional scaling easily through display settings.\
    \ They can scale the display in increments of 25% from 100% to 200%.\n\n![Image](Images/image00126.jpeg)\n\
    \n## Performance Computing and Gaming\n\nMachine Learning and Artificial Intelligence\
    \ are the latest in data engineering, and enterprises are adopting these technologies\
    \ rapidly. Ubuntu has taken note of this and is already integrating support for\
    \ Artificial Intelligence for enterprises, from developer workstations to server\
    \ racks, to the Edge and the cloud.\n\nUbuntu empowers data science on desktops\
    \ and servers by providing the latest applications, libraries, and drivers needed\
    \ for it. Data scientists can use `Kubeflow` on powerful Ubuntu systems to create\
    \ AI models before deploying them on servers or public clouds. Ubuntu has become\
    \ a standard for machine learning, from Wall Street to Silicon Valley. It is the\
    \ first choice for both startups and fortune 50 companies.\n\nIf you also have\
    \ a GPU on your system that you use for entertainment and gaming, Ubuntu 20.04\
    \ LTS has new features that will make you very happy. Ubuntu 20.04 LTS has an\
    \ updated `Steam` package that supports new controllers and virtual reality peripherals\
    \ if you are a gamer. You will also have `Feral Interactive GameMode` installed\
    \ by default in Ubuntu. `GameMode` is a daemon that optimizes the operating system\
    \ and the game process temporarily to have a rich gaming experience. At present,\
    \ `GameMode` optimizes the `CPU governor`, `process niceness`, `Input-Output priority`,\
    \ `kernel scheduler`, `GPU performance mode`, `screensaver inhibiting`, `GPU overclocking`,\
    \ and custom scripts. If you have hybrid graphics for your system, you can now\
    \ launch applications through the discrete GPU available in the `GNOME shell`.\
    \ This can be done by using the ‘Launch on Discrete GPU’ item on the menu. This\
    \ is supported for both NVIDIA and AMD GPUs.\n\nUbuntu also supports `VA-API`\
    \ and `nvenc` through `FFmpeg` if you are a live streamer or a video content creator.\
    \ These are features that are integrated into GPUs for encoding, decoding, filtering,\
    \ etc. These features also offload intensive tasks from the CPU such that they\
    \ are processed by the GPU instead. Applications such as `Shotcut` and `OBG Studio`\
    \ use `nvenc` to benefit greatly from these hardware-encoding features.\n\n##\
    \ ZFS and ZSYS\n\nThe `ZFS` file system was introduced as an experiment on Ubuntu\
    \ 19.10. `ZFS` is shipped by default on Ubuntu 20.04 LTS that features encryption\
    \ through hardware, pool trim, device removal, and improved performance. As mentioned\
    \ earlier, `ZFS` is still in its experimental stages.\n\n`Zsys` is an integration\
    \ tool for Ubuntu and `ZFS`. `Zsys` takes an automatic snapshot of the system\
    \ state whenever new software is installed, or the whole operating system is updated.\
    \ You will be able to find these snapshots in the boot menu. This can also be\
    \ used to create backups for the future.\n\n## Changes since Ubuntu 18.04 LTS\n\
    \nIt is a known fact that Ubuntu users like to stick to Long Term Support releases.\
    \ Users who are upgrading from Ubuntu 18.04 LTS to 20.04 LTS will see a huge number\
    \ of changes as Ubuntu 20.04 gathers all the features that have been rolled through\
    \ Ubuntu 18.10, 19.04, and 19.10. Let us highlight the most interesting changes.\n\
    \n`GNOME Disks` now support open-source disk encryption when you are formatting\
    \ any disk. The performance for window previews and desktop zoom has been improved.\
    \ Crash reports are now sent automatically by the bug-reporting tool whenever\
    \ an application crashes. This is helpful, as the user is not interrupted anymore\
    \ while doing their work. Support for microphones and speakers has been improved\
    \ by tuning the sound panel in the `GNOME Settings`. The file search on the desktop\
    \ has been improved by adding a tracker. Application switching has been made smoother\
    \ by improving the `Alt+Tab` feature and the window preview feature. Unexpected\
    \ errors on the system can be investigated with the introduction of the ‘Safe\
    \ Graphics Mode.’\n\nThe CPU usage has been optimized, leading to better Desktop\
    \ performance. The input and output latency has also been optimized for most graphics\
    \ cards. This means that users will not enjoy faster and smoother frame rates.\
    \ Ubuntu also allows `DLNA` sharing to share media to a smart TV or any other\
    \ devices that support `DLNA`. Graphic drivers for NVIDIA GPUs are inbuilt into\
    \ the Ubuntu install media now. This allows users to install drivers directly.\
    \ We urge you to explore more features so that you customize the look and feel\
    \ of Ubuntu as per your needs and enjoy the Ubuntu desktop to the fullest.\n\n\
    # Linux Using Vim\n\nWe will learn about the three modes of Vim. In addition,\
    \ we will learn to edit and save text files in Vim and use the shortcuts available\
    \ in Vim.\n\n## Introduction to Vim\n\nAs a system administrator, editing files\
    \ will be one of the tasks you end up regularly. There are many text editors available\
    \ for Linux. One of the older text editors, which was widely used, is `vi`. `Vi`\
    \ stands for the visual interface, as it was one of the first text editors that\
    \ showed the document while it was edited. Before `vi`, there were only line-based\
    \ editors such as `ed` and `ex`. `Vim` is an improved version of `vi`.\n\n`Vim`\
    \ is highly extensible. It supports scripts in multiple languages, various text\
    \ completion modes, file type plugins, and many other options. It can adapt to\
    \ any role. There are third-party macros and extensions available for `Vim` on\
    \ the internet for any purpose, from editing a particular type of file, completion,\
    \ and introspection for available programming languages, to simple tasks such\
    \ as to-do lists.\n\n Is it Necessary to Learn Vim?\n\nAs a system administrator,\
    \ you will prefer a text editor. Some people use `nano`, others use `gedit`, and\
    \ some even use `emacs`. Even if you already have a choice for an editor, it still\
    \ makes sense to learn the basics of `vi` or `Vim` because, by default, `vi` and\
    \ `Vim` are installed on every Linux distribution.\n\n## Different Versions of\
    \ Vim\n\nThe Red Hat Enterprise Linux supports three different versions of `Vim`.\
    \ There are use cases for every version, but all three versions can be used and\
    \ run side by side. The following three variations are available:\n\n* `Vim-minimal`:\
    \ This package only contains `vi` and related commands. The minimal installation\
    \ of Red Hat Enterprise Linux comes with this version of `Vim`.\n* `Vim-enhanced`:\
    \ This package comes with `Vim`, providing features such as spell check, syntax\
    \ highlighting, and file type plugins.\n* `Vim-X11`: This package comes with `gvim`,\
    \ a `Vim` version with a graphical window instead of running on the terminal.\
    \ The best feature of `gvim` is the menu bar, which is useful for new learners\
    \ of `Vim` who can’t remember specific commands.\n"
