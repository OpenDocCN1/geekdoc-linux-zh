    * Ubuntu


    One of the best features of Ubuntu is that it is free open-source GNU/Linux software.
    This means that the software may be freely used, copied, modified, and redistributed.
    Open-source software is developed, maintained, and distributed by a worldwide
    community of people. The software is owned by the community and the development
    process is transparent. This makes for more stable and reliable code that is practically
    malware-free, easy to install, and easy to use.


    GNU is a set of Unix-like programs that provide basic functionality for the Linux
    system. Linux would not exist without the GNU tools and applications. This is
    why some people refer to the GNU/Linux operating system as opposed to just Linux.
    GNU is an acronym for GNU’s Not Unix. GNU is a FOSS (Free Open Source Software)
    implementation of basic Unix programs.


    GNU/Linux has been under development for over twenty years and is a very mature
    operating system. The Linux kernel was designed by Linus Torvalds in 1991. The
    GNU system was designed by Richard Stallman. GNU/Linux is now maintained by The
    Free Software Foundation. The design of GNU/Linux is based on Unix, which was
    created by AT&T Bell Labs starting in 1969. So the heritage of GNU/Linux spans
    more than forty years. Unix and GNU/Linux have a well-defined file system and
    a simple modular software design which translates to smaller, simpler, and faster
    software. We are all beneficiaries of this elegant design concept.


    The popular Linux logo, Tux the penguin, was created by Larry Ewing and it may
    be found on numerous stickers, decals, pins, tee shirts, and toys.


    ## Installing Ubuntu


    ### New Features


    #### Brasero

    The Brasero CD/DVD burner is no longer part of the distribution. Instead, the
    file manager performs that function.


    ### Launcher Location

    The launcher may be moved to the bottom of the screen, if desired.


    ### Logout, Shutdown, and Reboot Icons

    Searching using Dash, Applications Lens for logout, shutdown, or reboot will display
    the icon that may be placed on the launcher.


    ### Online Search via the Dash

    The default value for online search is now OFF when using the Dash.


    ### LibreOffice 5

    LibreOffice 5 is now the default version for LibreOffice.


    ### Software Center

    The Ubuntu Software Center has been replaced with Ubuntu Software on the launcher.


    ### Installing .deb Packages

    Double-clicking on a `.deb` file activates Ubuntu Software to install the new
    software package; however, I recommend installing `gdebi` and using it to install
    packages because it is faster and more reliable.


    ### Cautions


    #### OS Upgrade Problem

    The Software Updater will automatically check for available updates. The Software
    Updater may ask if you would like to upgrade to a newer release of Ubuntu. This
    is a long and error-prone process. The upgrade process has failed in the past
    but might work ok now. You may choose the upgrade option or install the new version
    of Ubuntu manually. It’s your choice.


    #### Installation Cautions

    You will need to be logged into your system administrator account to perform any
    of the pre-installation or post-installation steps that involve installing new
    software on your computer. You may need to install software to create a bootable
    USB stick, before performing the actual Linux installation. You will also need
    to install updates after performing the Linux installation.


    You will be asked to enter a user name and password during the installation process.
    Since this user will be created with administrative privileges, you should enter
    a user name like `Linux` or `SysAdmin`. You will be able to create your own user
    account after the installation has finished. Your actual login name for Ubuntu
    will be `Linux` if you entered `Linux` during installation. Linux user names are
    historically all lower case. However, that is not the case for passwords.


    You will be asked if you want to try Ubuntu before installing or install Ubuntu
    immediately. I recommend installing Ubuntu without trying it if you have already
    decided to install it. If you decide to try Ubuntu without installing it, there
    will be an Install icon on the desktop that will then allow you to install Ubuntu.
    This will not work on some older computers so I recommend that you do not install
    Ubuntu from the desktop.


    #### Updates during Installation

    Do not check the boxes:

    * [ ] Download updates while installing

    * [ ] Install third-party software


    I strongly recommend installing updates and third-party software after the operating
    system installation has finished. If the updates fail, then the entire installation
    will fail.


    #### Disk Configuration

    You will be asked the following question if your hard drive has an installed operating
    system:


    "This computer currently has multiple operating systems on it. What would you
    like to do?"


    (•) Install Ubuntu alongside them

    ( ) Erase disk and install Ubuntu


    The default option is Install Ubuntu alongside them. However, you may want to
    erase the disk and install Ubuntu as the only operating system by selecting the
    other option.


    If you want to save the current data and operating system, then use disk imaging
    software like `Clonezilla` to save the current disk image.


    Some of the installation dialog boxes may require the use of the keyboard for
    navigation. The navigation keys are the arrow keys, the `Tab` key, and the `Enter`
    key.


    ## Downloading Ubuntu


    Linux distributions are stored in `ISO` files, which may be described as a cd
    image file. Wikipedia has an excellent article on ISO image files if you would
    like more information about ISO files.


    This book assumes that you are installing Ubuntu on a PC-type computer. To create
    a CD that will allow us to install Ubuntu, we need to find and download the `ISO`
    file from the internet first. This could be done by simply searching for Ubuntu
    download or by searching for a specific Ubuntu distribution like Ubuntu 16.04,
    for example.


    The Ubuntu web page will have two basic selections:

    * Download 32 BIT

    * Download 64 BIT


    The 32-bit version will work on any computer. If you have a 64-bit computer and
    would like to try the 64-bit version, then select Download 64 BIT.


    Note that the `ISO` file may be too large to fit on a cd, so you may have to use
    a DVD. Once you have downloaded the cd image file, you may write it to a DVD.
    The image file must not be stored on the DVD as a file. It must be stored as an
    image. This is accomplished by storing the file as an image or burning the contents
    of the image file. Different CD/DVD burning programs may use other terminology
    for creating an image DVD. You cannot simply copy the image to a DVD as a file.


    Ubuntu may also be installed from a USB memory stick. The process for creating
    the memory stick is a bit more complicated than creating the cd. First, you will
    need to download and install the `UNetbootin` application on a Linux or other
    computer. Then you will need to ensure that the `UNetbootin` application is executable
    by setting its file properties. The application may then be executed and it will
    create a bootable USB memory stick. Refer to the screenshot on the next page for
    setting the properties of the `UNetbootin` executable on a Linux computer.


    **Screenshot – UNetbootin Properties**

