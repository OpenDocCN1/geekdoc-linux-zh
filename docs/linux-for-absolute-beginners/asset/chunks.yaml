    If you need an easy comparison, the `bash` shell in Linux operating systems is
    similar to the command prompt utility that is available in Windows operating systems,
    but you can say that the scripting language used in `bash` is far more sophisticated
    compared to the scripting that can be done in command prompt. `Bash` is also comparable
    to the power shell utility, which was made available from Windows 7 and Windows
    Server 2008 R2. The `bash` shell has been called a very powerful tool for administration
    by many professionals. You can automate a lot of tasks on your Linux system using
    the scripting language that is provided by the `bash` shell. Additionally, the
    `bash` shell also has the option to perform many other tasks, which are complicated
    or even impossible if tried via a graphical interface.


    The `bash` shell is accessed through a tool known as the terminal. The input to
    the terminal is your keyboard and the output device is your display monitor. Linux
    operating systems also provide something known as virtual consoles, which can
    be used to access the `bash` shell as well. So, you will have multiple virtual
    consoles on the base physical console and each virtual console can act as a separate
    terminal. Also, you can use each virtual console to create login sessions for
    different users.


    ### Basics of Shell


    There are three parts to commands that are entered on the shell prompt:


    1. Command that you want to run

    2. Options that will define the behavior of the command

    3. Arguments, which are the command’s targets


    The command basically defines the program that you want to execute. The options
    that follow the command can be none, one, or more. The options govern the behavior
    of the command and define what the command will do. Options are usually used with
    one hyphen or two hyphens. This is done so that we can differentiate options from
    arguments. Example: `-a` or `--all`.


    Arguments also follow the command on the command line and can be one or more like
    options. Arguments indicate the target on which a command is supposed to operate.


    Let us take an example command:


    ```

    usermod -L John

    ```


    The command in this example is `usermod`.

    The option is `-L`.

    The argument is `John`.


    What this command does is lock the password of the user `John` on the system.


    To be effective with the commands on the command line, a user needs to know what
    options can be used with a particular command. If you run the `--help` option
    with any command, you will get a set of options, which can be passed with that
    particular command. So, it’s not really necessary that you know by heart all the
    options that will be used by all the commands. The list will also tell you what
    each option does.


    The use of statements can sometimes seem very difficult and complicated to read.
    Once you get used to certain conventions, reading the statement becomes much easier.


    *   Options are surrounded by square brackets `[ ]`

    *   If a command is followed by `…` it specifies the arbitrary list of items belonging
    to that type

    *   If there are multiple items and if the pipe separates them `|` it implies
    that you can specify only one of them

    *   Variables are represented using text, which is in angle brackets `<>`. So
    if you see `<filename>`, you have to replace it with the filename that you wish
    to pass


    For example, check the below command:


    ```bash

    [student@desktop ~]$ date --help

    date [OPTION]… [+FORMAT]

    ```


    This indicates that the command `date` takes the options represented by `[OPTION]…`
    with another option `[FORMAT]`, which will be prefixed with the `+` symbol.


    ### Executing Commands on the Bash Shell


    The Bourne Again Shell, known as `bash`, does the job of interpreting commands
    that are input by the user on the shell prompt. We have already learned how the
    string that you type in a shell prompt is divided into three parts: command, options,
    and arguments. Every word that you type into the shell is separated using blank
    space. The program that is already installed on the system is defined by every
    command that you type, and every command has options and arguments that are associated
    with it.


    When you have typed a command on the shell prompt along with the options and arguments
    and are ready to run it, you can press the Enter key on the keyboard, which will
    execute that command. If you wish to type more than one command on a single line,
    you can use a semicolon to separate the commands.


    Let us go through some simple commands that are used on a daily routine on the
    command line in Red Hat Enterprise Linux 7 and other Linux-based operating systems.


    The `date` command will display the current date and time of the system. You can
    also use this command to set the time of the system. If you are passing an argument
    with the `+` sign for the `date` command, it indicates the format in which you
    want the date to be displayed on the output.


    ```bash

    [student@desktop ~]$ date

    Sat Aug 5 08:15:30 GMT 2019


    [student@desktop ~]$ date +%R

    08:15


    [student@desktop ~]$ date +%x

    08/05/2019

    ```


    The `passwd` command can be used to change the password of a user. You will, however,
    need to specify the original password for the given user before you can set a
    new password. The command requires you to specify a strong password, which makes
    it necessary to include letters belonging to lowercase and uppercase, numbers,
    and symbols. You also need to ensure that the password being specified is not
    a word in the dictionary. The root user has the option to change the password
    of any other user on the system.


    ```bash

    [student@desktop ~]$ passwd

    Changing password for user student.

    Changing password for student.

    (current) UNIX password: type old password here:

    New password: Specify the new password here

    Retype new password: Type the new password again

    passwd: all authentication tokens updated successfully.

    ```


    File types and extensions are not specified in Linux operating system. The `file`
    command can scan any file and tell you the kind it is. The file you want to classify
    needs to be passed as an argument.


    ```bash

    [student@desktop ~]$ file /etc/passwd

    /etc/passwd: ASCII text

    ```


    If you are passing a folder/directory as an argument to the `file` command, it
    will tell you that it is a directory.


    ```bash

    [student@desktop ~]$ file /home

    /home: directory

    ```


    The next set of commands is `head` and `tail`, which print the first lines and
    the last lines of a file respectively. Both these commands can be combined with
    the option `-n`, which can be used to specify the number of lines you want to
    be displayed.


    ```bash

    [student@desktop ~]$ head /etc/passwd

    This will print the first 10 lines that are there in the passwd file.


    [student@desktop ~]$ tail - n /etc/passwd

    This will print the last 3 lines that are there in the passwd file.

    ```


    The `wc` command is used to count lines, words, and characters in a file that
    is passed as an argument. It supports options such as `-l`, `-w`, `-c`, which
    stand for lines, words, and characters respectively.


    ```bash

    [student@desktop ~]$ wc /etc/passwd

    30 75 2009 /etc/passwd

    ```


    This shows that there are 30 lines, 75 words, and 2009 characters in the file
    passwd.


    If you pass the `-l`, `-c`, `-w` options along with the `wc` command, it will
    only display the count of lines, words, or characters based on which option you
    have passed.


    You can use the `!` mark along with the command number to expand what was typed
    in that command along with the output.


    ```bash

    [student@desktop ~]$ history

    1 clear

    2 who

    3 pwd


    [student@desktop ~]$ !3

    /home/student

    ```


    This shows that we used `!3` to expand the `pwd` command, which shows the present
    working directory for which the output was `/home/student`, which was the home
    directory of the student user.


    You can use the arrow keys to navigate through the output given by the `history`
    command. Up Arrow will take you to the commands on top and Down Arrow will take
    you to the commands below. Using the Right Arrow and the Left Arrow keys, you
    can move around in the current command and edit it.

    '
