    注意输出结果，即带有‘Linux’一词的该行，以及它将搜索词标为红色以将其与其他部分区分开来。然而，此搜索是区分大小写的。如果我们搜索的是小写“l”的单词‘linux’而不是
    Linux，那么它将无法被找到。


    同样注意输出是空的（null），这意味着没有单词匹配搜索词。要使搜索不区分大小写（case insensitive），即它不会区分这两个词（大写和小写），请使用
    `–i` 选项。


    `grep` 命令也可以用于执行多次搜索，这意味着我们要在文件中搜索多个一个单词。这是一个很好的功能，你可能某天会需要用到。要使用它，请执行以下操作：


    注意我们使用了以下命令：


    ```bash

    grep –ie ‘am’ –e ‘linux’ first

    ```


    其中 `–i` 用于不区分大小写的搜索，而 `–e` 指定了它是多次搜索。


    如下所示，`grep` 命令也可以用于执行与你提供的相反的操作：


    ```bash

    grep -iv ‘linux’ first

    ```


    上述命令运行后，应该返回所有不包含单词 Linux 的行。在指定文件（即‘first’）中，这应该是第二行。


    注意 `–i` 用于不区分大小写的搜索，而 `–v` 的目的是返回与搜索标准相反的结果。当与 `grep` 命令配合使用时，`–in` 选项会返回行号。若要显示包含单词‘enjoying’的句子的行号，可以使用以下命令：


    ```bash

    grep –in ‘enjoying’ first

    ```


    你还可以返回搜索标准之上的行数。


    ```bash

    grep –iB1 ‘enjoying’ first

    ```


    这将返回紧邻包含搜索标准‘enjoying’的行的上方。


    ### `Tail` 命令


    这是 Linux 中一个非常常用的命令。它用于输出文件的最后部分。文件的最后 10 行将打印在命令行窗口上。使用一个头信息位于每组输出之前。如果没有指定文件名，标准输出将显示一个破折号（–）。要打印文件的最后十行，使用以下命令：


    ```bash

    tail filename

    ```


    让我们先打印文件的最后 10 行。


    ```bash

    tail first

    ```


    注意文件 first 仅包含两行。这就是为什么命令只输出了这两行。尝试使用一个包含多于两行的文件并观察输出。它只会打印文件的最后十行。另一个需要密切关注的要点是文件的扩展名。它是一个
    `.c` 文件，指定它是 `.c` 文件以及其余。


    在我的情况下，文件‘first’只是一个用普通文本编辑器创建的普通文件，所以扩展名并不重要。然而，如果你没有指定输出的行数，打印在标准输出上的最后十行仅仅是默认值。该值可以被设置为任意数量的行数。考虑下方显示的示例：


    ```bash

    tail filename –n 120

    ```


    上述命令将输出你指定的文件的最后 120 行。设置这些行的数量非常容易。通过此命令，人们可以监控文件的实时更新。这意味着他将看到文件中添加的任何新行。考虑下方显示的示例：


    ```bash

    tail -f first | grep 24.12.162.11

    ```


    上述可以用于实时监控文件‘first’。它是 `tail` 和 `grep` 命令的结合。这展示了不同的 Linux 命令如何组合来实现非常有用的功能。


