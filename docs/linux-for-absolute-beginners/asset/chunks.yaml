    ### Listing Files by Type


    When you use the `-F` option for `ls`, a character is appended to the file name
    that reveals what type it is.


    ```

    ls

    dir1 program

    ```


    ```

    ls -F

    dir1/ program*

    ```


    ```

    ls -lF

    total 8

    drwxr-xr-x 2 bob users 117 Sep 28 15:31 dir1/

    lrwxrwxrwx 1 bob users 7 Sep 28 15:32 link@ -> regFile

    -rwxr-xr-x 1 bob users 750 Sep 28 15:32 program*

    ```


    ![Image](Images/image00136.gif)


    A link is sometimes called a symlink, short for symbolic link. A link points to
    the location of the actual file or directory. You can operate on the link as if
    it were the actual file or directory. Symbolic links can be used to create shortcuts
    to long directory names. Another common use is to have a symlink point to the
    latest version of installed software as in this example.


    ```

    bob@linuxsvr:~$ cd /opt/apache

    bob@linuxsvr:/opt/apache ~$ ls -F

    2.4.5/ 2.4.7/ current@ README

    ```


    ```

    bob@linuxsvr:/opt/apache$ ls -l

    drwxr-xr-x 2 root root 4096 Sep 14 12:21 2.4.5

    drwxr-xr-x 2 root root 4096 Nov 27 15:43 2.4.7

    lrwxrwxrwx 1 root root 5 Nov 27 15:43 current -> 2.4.7

    -rw-r--r-- 1 root root 1048 Sep 14 12:58 README

    ```


    ### Listing Files by Time and in Reverse Order


    If you would like to sort the `ls` listing by time, use the `-t` option.


    ```

    ls -t

    tpsreports

    sales-lecture.mp3

    sales.data

    ```


    ```

    ls -lt

    total 2532

    drwxr-xr-x 2 bob users 512 Sep 28 14:49 tpsreports

    -rw-r--r-- 1 bob sales 2562856 Sep 27 08:54 sales-lecture.mp3

    -rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    When you have a directory that contains many files, it can be convenient to sort
    them by time, but in reverse order. This will put the latest modified files at
    the end of the `ls` output. The old files will scroll off the top of your display,
    but the most recent files will be right above your prompt.


    ```

    ls -latr

    total 2532

    drwxr-xr-x 14 root root 512 Sep 27 08:43 ..

    -rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data

    -rw-r--r-- 1 bob sales 2562856 Sep 27 08:54 sales-lecture.mp3

    -rw-r--r-- 1 bob users 28 Sep 28 14:22 .profile

    drwxr-xr-x 2 bob users 512 Sep 28 14:49 tpsreports

    ```

