    There is an editing feature available on the command line in `bash` when you are
    interacting with `bash`. This helps you to move around the current command that
    you are typing so that you can make edits. We have already seen how we can use
    the arrow keys with the `history` command to move through commands. The following
    list will help you use edits when you are working on a particular command.


    - `Ctrl+a`: This will take your cursor to the start of the command line.

    - `Ctrl+e`: This will take your cursor to the end of the command line.

    - `Ctrl+u`: Clear the line from where the cursor is to the start of the command
    line.

    - `Ctrl+k`: Clear the line from where the cursor is to the end of the command
    line.

    - `Ctrl+Right Arrow`: Take the cursor to the start of the next word

    - `Ctrl+r`: Search for patterns in history list of commands used


    # Shell Scripting


    ## Shell Scripting

    The shell is a command interpreter in an operating system like `Unix`. `Linux`
    is a program that uses other programs. It provides a computer interface to `Unix/GNU`
    system to use different commands or tools with specific installation. When the
    shell has finished making the program, it sends the output to the user on the
    screen, standard output. The shell is more than just interpreting a command. Its
    system’s language has a complete structure such as performance, flexibility, tasks,
    and much more. That is why `Unix/GNU` shell is more powerful than `Windows` shell.


    ## Bash Shell

    `Bash` represents Bourne Again Shell and is the default shell in most `Linux`
    distributions today. It also has shell-associated features and provides more efficient
    development over system that includes:

    - Editing the command line

    - Performance Management

    - Unlimited command history

    - Nicknames

    - Unlimited layout

    - Arithmetic on any basis


    ## Tcsh / Csh

    `Tcsh` developed with `C-shell`, can be used as a compatible login shell and script
    command processor. `Tcsh` has the following features:

    - `C` syntax

    - Command-line editor

    - Word and file completion

    - Spelling correction

    - Performance management


    ## The Shell of Zsh

    `Zsh` is designed to work with and integrate many other `Unix/GNU` shells, such
    as `bash`, `tcsh`, and `Ksh`. And a strong writing language like other shells
    available. It has some unique features that include:

    - File name generation

    - Getting started files

    - Login

    - Concluding ideas

    - Conceptual guide

    - Flexible index


    ## The Fish

    `fish` is a friendly interactive shell and was recorded in 2005. It was designed
    to be fully functional and easy to use, like other shells, with excellent features
    including:

    - Personal page completion

    - Web-based configuration

    - Automatic suggestions

    - Written entirely in clean scripts

    - Terminal support


    # Advantages of Using Linux

    Most computer novices say things like “Linux is complicated,” or “Linux is difficult.”
    If there are, of course, `Linux` distributions that only passionate experts can
    operate, there are also some intended explicitly for the general public: `Linux
    Mint`, `Ubuntu`, and its derivatives. You will discover that `GNU/Linux` is straightforward
    to use and much more user-friendly than most people think.


    With this software, you are the master of the board. `GNU/Linux` will do absolutely
    nothing unless you ask it explicitly, unlike a proprietary system that decides
    nearly everything instead of the user. You’re not mandated to install what you
    do not want, nor will a completely new system be imposed on you while the one
    you have is still working well. Conversely, you will probably not have anything
    to uninstall from the start; no antivirus trial, no key, no locks, in short, no
    bloatware. After years of relying on `Windows`, the freedom that `Linux` grants
    can be scary. However, it should be understood that `GNU/Linux` allows you to
    manipulate your operating system to make it a space arranged to your taste, your
    needs, as much as it gives you the right to do anything at all.


    ## Security

    There is no need for antivirus when you are on `Linux`. This seems incredible,
    but it is true because this operating system is built primarily to be as safe
    as possible. It is part of the DNA of Unix-like systems (`Linux`, `BSD`) where
    security is such an essential element as other components of the system. Despite
    claim, most computer operators have tried to explain the security buildup of `Linux`.
    On one hand, some operators suggest that there are viruses on `Linux`, and therefore
    it is crucial to protect yourself. The others argue that antivirus only detects
    those intended for `Windows`. Moreover, the `Linux` world’s diversity means that
    a virus that affects one distribution may not affect the other.


    The most common security requirement for a `Linux` system is that a password is
    requested as soon as you log in or when you want to perform a potentially dangerous
    system modification operation (update, installation of new software, etc.). The
    password will also be required when you want to access some files, as this will
    prevent some people from searching your data when you’re not around. As far as
    updates are concerned, they seem much less frequent and in most cases, much faster
    to perform. We sometimes hear that `Windows` was designed for one thing: to work.
    Initially, security was not even a primary concern, an aspect so little taken
    into consideration that it was delegated to third-party software. Hence, the very
    lucrative industry of antivirus and antimalware. Even if one can argue that nowadays,
    `Microsoft` takes a grave account of security problems, the continuous and frequent
    flow of security updates should encourage all users to ask serious questions about
    the `Microsoft` operating system’s reliability.


    ## Serenity and Efficiency

    Even though some distributions are complicated, some `GNU/Linux` distributions
    are very suitable for beginners. Everything is, therefore, designed to make life
    easier for beginners. This means that you will not need a master’s degree in computer
    science to operate `Linux`. Moreover, `GNU/Linux` offers a reliable environment,
    technically and humanly. When you’re done installing a distribution for the first
    time, the most striking thing about it is its barebones look. Usually, only two
    icons are present on the desktop: the “workstation” and a personal folder. Not
    even the trash! It may seem austere, but it is also the symbol of the `GNU/Linux`
    experience: simplicity and choice.

