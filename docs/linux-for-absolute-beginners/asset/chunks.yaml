  trans: '


    Linux 的下一步来自于 Andrew S. Tanenbaum（Andrew S. Tanenbaum）。当时他是阿姆斯特丹大学的教授。他开发了 Minix，这是一个用于教学的操作系统，供学生演示和理解
    UNIX 原则。但正如他所指出的，Minix 并非用于实际生产。


    来自赫尔辛基大学的芬兰学生 Linus Torvalds 是 Minix 的用户，并对它的局限性非常不满。1990 年，他开始基于 Minix 的理念、UNIX
    原则和 POSIX 标准开发一个全新的操作系统。他的动力是拥有一个既易于理解又能极大发挥硬件极限的系统。他也只是想寻找乐趣，并没有商业意图。Linux 背后的整个故事记录在他名为《趣味之源》（Just
    for Fun）的自传中。如今，Linus Torvalds 负责监督 Linux 内核的开发。


    它需要一个漂亮的标志让 Linux 对外世界产生吸引力。根据一次吉祥物比赛，许多许多方案。Larry Ewing 提交了他关于企鹅的构想（如本书封面所示），他的方案赢了。这只企鹅带着顽皮的微笑，体态丰满，名为
    Tux，代表了一个快乐且满意的用户形象。


    ## Linux 使用范围


    Linux 最初是为基于 Intel 的系统构建的，尽管现在运行在各种平台上。ARM 架构（`arm` 和 `arm64`）、Motorola/68k Freescale
    架构（`m68k`）、Intel x86（`i386` 和 `amd64`）、IBM s390（`s390`）、PowerPC（`PowerPC`）和 SPARC（`sparc`）只是其中的例子。


    Linux 从设计初期就考虑了服务器系统。作为 Web 服务器、文件服务器、邮件和新闻服务器、互联网网关、无线路由器和防火墙，它被广泛使用。作为计算单元，它帮助渲染了视频序列以及整个《泰坦尼克号》、《史莱克》、《玩具总动员》。此外，Linux
    还应用于汽车产品、航天、军事、物流和工程领域。自 2006 年以来，世界上所有的交易所都运行在 Linux 服务器上。几乎所有的在线搜索引擎也由它运行。


    Linux 在过去的十年中也席卷了桌面。由于其极高的灵活性和可靠性，它是文本处理、图形设计、桌面出版、通信（电子邮件、聊天、音频和视频）以及手机和电视用户界面的可靠配置。


    ## Linux 认证


    Linux 采用率的提高增加了对精通该操作系统的工程师和用户的需求。在此时，Linux 认证变得非常有帮助。认证有两种类型：通用型（不特定于特定发行版）和针对型（特定于特定发行版）。下表提供了目前可用常用认证的概述。


    ### 非特定发行版认证


    - Linux Essentials（Linux 基础）

    - LPIC-1: Linux 服务器专业认证

    - LPIC-2: Linux 工程师

    - Linux Foundation Certified System Administrator (LFCS)

    - Linux Foundation Certified Engineer (LFCE)

    - CompTIA A+

    - CompTIA Network+


    ### 发行版特定认证


    - RedHat Certified Engineer (RHCE)

    - RedHat Certified System Architect (RHCSA)

    - RedHat Certified Architect (RHCA)

    - SUSE Certified Administrator (SCA)

    - SUSE Certified Engineer (SCE)

    - SUSE Enterprise Architect (SEA)


    ## 安装 Linux


    人们认为安装 Linux 操作系统是一项非常艰巨的任务。与其他操作系统相比，它的安装过程被认为是最简单的。大多数 Linux 操作系统版本都为你提供 Live
    发行版（Live 系统）。这意味着可以在 CD 或 USB 的帮助下完成安装，而无需对硬件进行任何重大更改。这难道不很神奇吗？这些发行版选项为你提供了完整的功能，而无需永久安装。


    例如，以下是 Ubuntu Linux 的安装步骤，将引导你完成安装过程：


    - **准备工作**：首先要确保你的机器符合要求。接下，它可能会询问你是否想要安装第三方软件。

    - **无线设置**：当你在笔记本电脑上安装系统时，你必须连接网络以确保第三方软件下载成功。

    - **硬盘分配**：这一步是你需要选择将 Linux 操作系统安装在桌面或笔记本电脑上的方式。你是打算采用双启动吗？如果是，请使用整个硬盘来升级现有安装。


    选择你偏好的安装类型，然后点击“立即安装”。

    - **位置**：从地图上选择位置

    - **键盘设置**：选择键盘布局

    - **用户设置**：输入你的用户名和密码以完成安装


    遵循这些步骤后，重启，即可就绪！与其他操作系统相比，安装 Linux 被认为是最简单且最安全的软件。


    ## 安装 Linux 时的注意事项


    安装 Linux 相当容易，因为几乎每个发行版都有图形化安装方案。如今，由于软件数据多年来巨大增长，安装已成为易事，只需点击几次。这就是为什么大多数发行版仅以
    CD 和 DVD 的形式提供运行 Linux 的主要材料。发行版还提供了指向在线存储库的链接，可以在从 CD 和 DVD 完成主安装后以后下载。“现在安装”仅仅是初始配置的设置，稍后可以通过从在线存储库下载你选择的驱动程序来增强。许多发行版还赋予你创建安装光盘的自由。你可以在自己的
    CD/DVD 上安装你喜爱的软件。


    一些重要的安装注意事项包括：


    - CD 和 DVD 上的软件容易过时。因此，在线存储库的需求变得至关重要，因为它有助于下载和更新软件。

    - 某些发行版会更新其原始发布版本。这些更新版本可以在相应的网站获得，必须检查它们的可用性。

    - 硬件现在主要是自动检测的。包括你的显示器、显卡等。

    - 大多数发行版都提供 `Parted`（分区工具）。它易于使用并帮助你设置分区。

    - 某些资源可以用于安装目的。例如网络方法 `NFS`、`超文本传输协议 (HTTP)` 和 `文件传输协议 (FTP)`。

    - 引导加载程序如 `GRUB` 或 `Linux Loader (LILO)` 通常支持双启动。这些引导加载器可以轻松配置为同一系统中启动 Mac、Windows
    和其他 Linux 安装。

    - 发行版将 32 位和 64 位视为不同的实体并提供不同的版本。现在的电脑大多支持 64 位，而较旧的系统支持 32 位。

    - 动态配置协议 (`DHCP`) 或 `IPv6` 有助于连接网络路由器，这种网络配置通常是自动的。

    - `RAID` 和 `LVM` 文件系统可以在安装期间设置，因为你可以使用 `Parted` 自定义分区。

    - 如果你使用 `LVM` 和 `Raid` 文件系统，拥有独立的启动分区是至关重要的。


