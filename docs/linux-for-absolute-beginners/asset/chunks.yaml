    ### Shell Scripting


    At first glance, a shell script may sound daunting, but it is pretty straightforward.
    In the simplest form, it is just a sequence of UNIX/Linux commands stored in a
    file and executed line-by-line by the command interpreter. A shell script is similar
    to single typing commands in the terminal but is performed as a batch. This makes
    it much faster and helps to automate tasks. We will not be delving into the programming
    intricacies of shell scripting for this guide. But it is worth noting the recommended
    structure of a shell script.


    - Shebang line: defines which program will be used to process the instructions
    that follow the shebang line properly. The line starts with `#!` a two-byte number
    indicating that the following lines are an executable shell script. The shebang
    is followed by the path to the interpreter or program to process the instructions.

    - Docstring: a short description of what the script does and the software license
    of the code. This can be a single line but also an extensive description. Such
    lines start with a `#` and are treated as comments by the shell.

    - Commands: the combination of single commands to be executed by the shell. As
    mentioned, this can be as little as a one-line instruction, such as what we have
    in our example below, to a fully-fledged program.

    - Exit state: defines the script’s return value(s). Unless explicitly stated otherwise,
    the exit state of the last command executed in the script will be returned. For
    example, it is common to return `0` on success and a value between 1 and 255 in
    the event of an error.


