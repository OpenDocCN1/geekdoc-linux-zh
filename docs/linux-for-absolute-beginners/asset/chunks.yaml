    In the following example, `tar` is used to create (`tar cf tps.tar`) an archive,
    list the contents of the archive (`tar tf tps.tar`), and extract the contents
    (`tar xf tps.tar`).


    ```bash

    $ tar cf tps.tar tpsreports/

    $ tar tf tps.tar

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    $ cd /tmp

    $ tar xf /home/bob/tps.tar

    $ ls tpsreports/

    coversheet.doc sales-report.txt

    $

    ```


    If you would like to see the files that are getting placed into the archive or
    extracted from the archive, use `-v` to enable verbose mode.


    ```bash

    $ tar cvf misc.tar sec* tpsreports

    secret

    secret.bak

    tpsreports/

    tpsreports/sales-report.txt

    tpsreports/coversheet.doc

    $ tar xvf /home/bob/misc.tar

