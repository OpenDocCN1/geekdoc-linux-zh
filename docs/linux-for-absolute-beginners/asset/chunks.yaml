    执行 shell 脚本有两种方法。我们可以调用像 Bash 这样的 shell 来运行它，也可以为脚本设置执行标记并随后运行。第一种方法使用 Bash，如下所示：


    ```bash

    $ bash uptime.sh

    12:20:31 up 7 days, 2:09, 6 users, load average: 0,74, 0,40, 0,27

    $

    ```


    第二种方法基于两个步骤。首先，我们使用 `chmod` 命令为脚本设置可执行标记，如下所示：


    ```bash

    $ chmod u+x uptime.sh

    $

    ```


    然后我们就可以运行脚本：


    ```bash

    $ ./uptime.sh

    12:26:07 up 7 days, 2:14, 6 users, load average: 0,23, 0,34, 0,28

    $

