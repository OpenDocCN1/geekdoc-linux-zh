- fmt: "\n# Implicit\ninvoking the script as if it were an executable, which requires\
    \ assigning execution permissions to the script. The shebang is read to determine\
    \ which shell should be used to read the script, loading a child process (subshell)\
    \ for that shell (if the script does not have shebang, for the subshell the same\
    \ type of shell will be used as the one in charge of the command line from which\
    \ the invocation was made). Note that shell scripts are text files read by the\
    \ command interpreter, that is, they are interpreted. They are NOT executed. The\
    \ assignment of the execution permission to a shell script is a file system utility\
    \ to accelerate the invocation of scripts, but its internal function is to load\
    \ a new shell process (subshell) so that it interprets the script.\n\n# Implicit\
    \ with. (equivalent to import): \nthe script will be interpreted by the same shell\
    \ process responsible for the command line from which the script is being invoked.\
    \ Consequently, in this case, the shebang is also ignored.\n\nIn cases where subshells\
