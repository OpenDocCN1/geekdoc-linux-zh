    **What Is the Use of Quoting?**


    A factor that leads to a script’s successful execution is quoting. It is a technique
    of grouping data to avoid instances of misinterpretation. Usually, quoting’s primary
    objective is controlling substitutions.


    Sample # 1:


    TITLE=“My system info for $HOSTNAME”


