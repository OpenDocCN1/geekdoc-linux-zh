    ### 在文件名中使用空格


    如果你想在从命令行操作时让生活更轻松，请不要在文件名和目录名中使用空格。连字符（`-`）或下划线（`_`）可以是空格的良好替代。驼峰命名法（CamelCase，即每个单词字母大写的做法）是另一个很好的选择。例如，与其将你最新的文学尝试命名为“the
    next great american novel.txt”，你可以使用“the-next-great-american-novel.txt”、“the_next_great_american_novel.txt”
    甚至是“TheNextGreatAmericanNovel.txt”。


    早晚你都会遇到名称中包含空格的文件或目录。处理这种情况有两种方法。第一种是使用引号。尽管文件名是一个文件，但使用“a file”来对其进行操作。第二种选择是转义空格。转义就像使用引号，但针对的是单个字符。转义符号是
    `\`，也称为反斜杠。要转义空格，请在空格前加上反斜杠字符（`\`）。


    ```

    $ ls -l

    -rw-r—r— 1 bob users 18 Oct 2 05:03 a file


    $ ls -l a file

    ls: a: No such file or directory

    ls: file: No such file or directory


    $ ls -l "a file"

    -rw-r—r— 1 bob users 18 Oct 2 05:03 a file


    $ ls -l a\ file

    -rw-r—r— 1 bob users 18 Oct 2 05:03 a file


    $ ls -lb a*

    -rw-r—r— 1 bob users 18 Oct 2 05:03 a\ file

    ```


    `ls` 的 `-b` 选项会导致其打印转义代码。注意，引用和转义不仅适用于空格，也适用于特殊字符，包括 `|`、`&`、`''`、`;`、`(`、`)`、`<
    `>`, 空和制表符。


