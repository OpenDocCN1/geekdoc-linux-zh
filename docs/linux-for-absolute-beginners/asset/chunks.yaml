    ### `Wc` 命令


    `wc` 命令代表“word count”（单词计数），是 Linux 命令之一。它可以被用于统计文件有多少行。例如，如果你想知道如‘first’这样的文件中有多少行，执行以下操作：


    ```bash

    wc –l first

    ```


    上述命令显示我们的文件只有两行，这是事实。若要同时获取行数和文件名，请执行以下操作：


    ```bash

    wc –l first

    wc first

    ```


    命令将输出文件的行数、文件的单词数以及文件的总字节数。文件名也将被显示。注意这些将按照上述顺序显示，所以不要混淆。上述命令可以被拆分以便你逐个查看详情。你还可以返回搜索标准之上的行数。


    ```bash

    grep –iB1 ‘enjoying’ first

    ```


    这将返回包含搜索标准‘enjoying’的行正上方。


    ### `Last` 命令


    有时，你可能需要查看系统的登录列表。这对于在生产环境中使用 Linux 的人很有用，特别是出于安全考虑。人们无法否认登录过系统。只需进入命令行并输入 `last.`。你将看到登录到系统的用户、他们使用的终端以及登录日期和时间。如果这些用户仍处于登录，你也将收到通知。


    运行下方所示命令：


    ```bash

    last -100

    ```


    '
- fmt: '

    The program above will display your latest 100 logins. The difference between
    the login and logout time is also shown.


    Other options for the `last` command include:

    1. `-R`: this will suppress the display of the hostname.

    2. `-a`: displays the name of the host in the last column.

    3. `-d`: this is for remote logins. Linux stores the IP address and then translates
    it into hostname.

    4. `-F`: full login and logout dates and times are printed.

    5. `-i`: shows the IP address of remote host in numbers.

    6. `-w`: displays domain and full names as outputs.

    7. `-x`: shows shutdown entries as well as level changes.


    It is good to note that the `last` command searches through the `/var/log/wtmp`.
    This file is responsible for storing the names of users who have logged into the
    system. The command will then display logouts since the time the file was created,
    so you can always consult this file at any time. If you need to display all the
    users who ever logged into the system, run the following command: `more` or `less`.


    ```

    last | more or less

    ```


    The command above will again search through `/var/log/wtmp` to find these users.
    Since the output might be too much to fit in a single screen, use the `more` or
    `less` command so that the output will display one page at a time. Rather than
    knowing about login and logout times for all users, you might only be interested
    in knowing about a particular user. With the `last` command, this is easily achieved
    as follows:


    ```

    last username

    ```


    You might also not interested in knowing the hostname. This can be hidden using
    the `-R` option as mentioned above. To use this option, do the following:


    ```

    last -R

    ```


    The year is the default login and login time. You might be interested in knowing
    these times in full. This can be done as follows:


    ```

    last -F

    ```


    As you can see, the time has been shown in full rather than showing the year alone.
    This shows how powerful the `last` command is. Below are a few other options using
    the `last` command. To see the reboot history of the machine since the creation
    of the file:


    ```

    last -x reboot

    ```


    To see when the machine was last shutdown:


    ```

    last -x shutdown

    ```


    ### Listing Files and Understanding ls


    Here is the output from an `ls` command using the `-l` option. The `-l` flag tells
    `ls` to display output in long format. If you need to see what files or directories
    exist, use `ls`. However, if you need detailed information use `ls -l`.


    ```

    ls -l

    -rw-rw-r-- 1 bob users 10400 Sep 27 08:52 sales.data

    ```


    On the far left of the `ls` output is a series of characters that represent the
    file permissions. The number that follows the permissions represents the number
    of links to the file. The next bit of information is the owner of the file followed
    by the group name. Next, the file size is displayed followed by the date and time
    when the file was modified. Finally, the name of the file or directory is displayed.
    Here is the information displayed by the `ls -l` command in table form:


