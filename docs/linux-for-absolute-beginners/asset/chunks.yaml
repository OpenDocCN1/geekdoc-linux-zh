    取决于终端类型和用户的配置，在普通的 Vim 会话中也可以使用鼠标。


    # Vim 模式


    Vim 并不是一个简单直接的编辑器。`Vim` 中可用的命令追求效率和速度，而不是易于记忆。这是因为 `Vim` 有许多模式。这意味着按键和命令的功能根据当前激活的
    vim 模式而改变。


    `Vim` 有以下三种模式。


    ## 功能模式


    - **命令模式 (Command mode)：** 在此模式下，你可以进行文件导航、剪切、复制、粘贴等功能以及其他命令。还可以执行 `undo`（撤销）和
    `redo`（重做）等命令。

    - **插入模式 (Insert mode)：**可以在此模式下进行普通的文本编辑。此外，插入模式的一种变体是替换模式（replace mode），在该模式下你可以替换文本而不是插入文本。

    - **Ex 模式 (Ex mode):** 可以执行打开文件、保存文件或退出 `Vim` 等功能。它还支持一些其他复杂功能。例如，可以使用此模式将程序的输出插入到当前文件中。也可以在此模式下进行
    `Vim` 配置。在 `ex` 中可以执行的所有操作都可以在 `Vim` 的这种模式下完成。


    # Vim 工作流


    ## 编辑器基础


    无论使用哪种编辑器，你都应该能够执行这些基本任务：


    1. 修改文件或向文件中添加新文本

    2. 保存更改并退出


    ### 打开文件


    `Vim` 允许你通过命令行指定文件名作为参数来轻松地打开文件。例如，你可以使用以下命令打开 `/var/log/maillog` 文件，其中 `maillog`
    是文件名。


    ```

    [root@server~]# vim /var/log/maillog

    ```


    注意：如果指定的参数指定的文件不存在，但目录是有效的，`Vim` 将根据指定的文件名创建一个新文件，并通知你正在编辑一个新文件。


    `Vim` 默认在命令模式下打开。屏幕左下角会显示文件名、字符数、行数以及关于打开文件的其他细节。它还会显示关于当前显示部分的信息，例如 `All` 表示全部，`Top`
    表示顶部的行，`Bot` 表示文件的最后几行，或者显示你处于文件位置的百分比。最后一行在 `Vim` 术语中被称为 `ruler`（标尺）。


    ### 编辑文本


    如果你已经使用过 `vi` 或 `Vim`，就会知道在命令模式下，按键的作用方式并不符合预期。这是因为命令模式不是用于插入文本的，而是根据你输入的字符执行功能，例如复制、粘贴或光标移动。


    你可以使用一组对应不同功能的命令切换到插入模式。让我们逐一查看。


    上述提到的相同按键及其结果如下：


    ![Image](img/image00127.gif)


    你可以通过下方的指示器判断自己是处于插入模式还是替换模式，它会显示 —INSERT— 或 —REPLACE—。


    你可以使用键盘上的 `Esc` 键返回命令模式。


    Red Hat Enterprise Linux 自带的 `vi` 或 `Vim` 版本经过预配置，可以在命令模式和插入模式下都能识别光标的正常移动，甚至是
    `PgUp` 和 `End` 键。这并不是所有 `vi` 变体的默认设置，而是 Red Hat Enterprise Linux 特有的。旧版本的 `vi`
    不识别这些命令，你只能在命令模式下使用键盘键 `h`、`j`、`k`、`l` 移动光标。


    下表列出了在命令模式下可移动光标的一些常用按键。


    ![Image](img/image00128.gif)


    注意：按下键盘上的 `Esc` 键始终会取消当前命令或返回 `Vim` 的命令模式。一个良好的习惯是按下两次或多次 `Esc` 键，以确保你已经返回到了命令模式。


    ### 保存文件


    `Ex` 模式用于在 `Vim` 中保存文件。要进入 `Ex` 模式，你需要在命令模式下按下键盘上的冒号（`:`）键。因此，如果你处于插入模式，先按 `Esc`
    键切换到命令模式，然后按冒号进入 `Ex` 模式。当你切换到 `Ex` 模式时，你会在标尺上看到 `:` 符号，你可以在那里输入命令。完成命令输入后，按 `Enter`
    完成命令。


    下表给出了帮助你在 `Ex` 模式下保存更改并退出 `Vim` 的命令列表。


    ![Image](img/image00129.gif)


    ![Image](img/image00130.gif)


    在上面的表格中，`w` 代表写入（write），意味着保存更改，`q` 代表退出（quit），而 `!` 表示操作是强制的。


    ### 在 Vim 中获取帮助


    `Vim` 提供了丰富的在线帮助，可以通过编辑器本身获取。你可以切换到命令模式并输入 `: help`，即可启动帮助屏幕，并获得导航帮助文档所需的帮助。你可以通过在命令模式下输入
    `: help subject` 来查找特定主题或话题的帮助。


    帮助屏幕将在新的拆分窗口中打开。你可以通过 `:q` 关闭帮助屏幕。获取拆分窗口的帮助可以输入 `: help`。


    还有交互式教程。在命令模式下，你可以输入 `vimutor`。这将启动一个关于 Vim 的导览。


    ## Vim 中的移动


    大多数编辑器都支持单字符或单行移动。此外，`Vim` 中的一些高级命令可以帮助你更高效地导航。这些快捷键仅在命令模式下可用。


    ![Image](img/image00131.gif)


    # 用户与权限


    在讨论用户管理时，我们需要理解三个重要概念：


    字体 用户 (Users)

    - 组 (Groups)

    - 权限 (Permissions)


    交互式账户：通常分配给用户。这两种用户类型之间的主要区别在于：


    - 守护进程使用系统账户访问文件和目录。它们通常被禁止通过 shell 或物理控制台交互式登录。

    - 终端用户通过 shell 或物理控制台交互式访问资源。


    有了对用户的基本理解，现在为会计部门创建一个新用户。使用 `adduser` 命令添加新用户。


    以下是 `adduser` 的选项：


    ![Image](img/image00132.gif)


    创建新用户时，使用如下 `-c`、`-m`、`-g`、`-n` 选项：


    ```

    [root@localhost Downloads]# useradd -c “Bob Jones Accounting Dept Manager.”—m
    -g accounting -n bjones

    ```


    现在看看新用户是否已经创建：


    ```

    [root@localhost Downloads]# id bjones

    (bjones) gid = 1001(accounting) groups = 1001(accounting)

    ```


    ```

    [root@localhost Downloads]# grep bjones /etc/passwd

    [root@localhost Downloads]# passwd bjones

    更改用户 bjones 的密码。

    新密码：

    重输新密码：

    passwd：所有身份验证令牌已更新。

    ```


    该用户账户未启用，允许用户登录系统。


    ### 禁用用户账户


    有多种方法可以禁用系统上的账户。从手动编辑 `/etc/passwd` 文件，到使用 `passwd` 命令配合 `-l` 选项。然而，这两种方法都有一个缺点：如果用户拥有
    ssh 权限并使用 RSA 密钥进行身份验证，他们仍然可以使用这种方法登录。


    此外，最好在账户上注明我们禁用它的原因。


    ```

    [root@localhost Downloads]# chage -E 2005-10-01 bjones

    ```

