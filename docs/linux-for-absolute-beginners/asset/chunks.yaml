    之后，你将看到一个对话框，要求你选择安装类型。通过选择 `Erase disk and install Ubuntu`（擦除磁盘并安装 Ubuntu），你可以在安装
    Ubuntu 之前清空硬盘。如果你选择了此选项，请跳到下一个阶段。


    高级用户可能选择更改“高级功能”。可以使用此命令设置你自己的磁盘分区或其他额外参数：


    在使用全新的 Ubuntu 安装时，使用 LVM：


    *   逻辑卷管理 (`LVM`）是 Logical Volume Management（逻辑卷管理）的缩写。该程序允许你实时管理计算机上的许多虚拟磁盘。它类似于
    `gparted` 工具的更高级版本。

    *   为了让新安装的 Ubuntu 更安全，请对其进行加密：这将加密磁盘内容。你需要选择一个安全密钥来解密和使用该磁盘。

    *   尝试擦除驱动器并将其替换为 ZFS：ZFS 代表 Zettabyte File System（泽字节级文件系统），但它已演变为一种混合文件系统和卷管理器。由于它仍处于测试阶段，请避免在任务关键的生产系统中使用此选项。


    如果你希望自己创建硬盘分区，请点击 `Something Else`（其他）。你可以在下一个屏幕上设计你自己的分区表和逻辑磁盘。这允许你将物理硬盘拆分为许多分区。操作系统会将这些分区视为独立的磁盘。


    注意：某些用户为他们的 `/home` 目录创建了第二个磁盘。如果必须重新安装操作系统，包含 `/home` 目录的分区不受影响。


    要将你的修改应用于磁盘分区，请点击 `Continue`（继续）。


    系统将提示你是否更改磁盘？在在此屏幕上点击 `Continue` 之前，你选择的任何选项都不会生效。要继续，请点击 `Continue`。


    ### 选择时区

    在机器格式化磁盘分区后，安装程序会询问：“你在哪里？”填入最近的大型城市名称，系统将计算你的本地时区。


    点击 `Continue`。


    ### 创建用户账户

    之后，你需要创建一个用户账户。请完成以下字段：


    *   Name（姓名）：你的名字。

    *   Hostname or network name（主机名或网络名称）：这是计算机的名称。

    *   Username（用户名）：你希望使用的用户账户名称。

    *   输入并确认强密码；安装程序将自动评估你的密码强度。

    *   Automatically log in（自动登录）：对于面向公共的服务器来说，这不是好主意。

    *   To log in, you’ll need my password（登录时需要密码）：建议面向公共的服务器使用。


    要安装 Ubuntu，点击 `Continue`。


    安装程序完成后，移除 Ubuntu 安装盘。系统将提示你立即重启。


    ![Image](img/image00120.jpeg)


    机器现在应该启动进入你刚刚安装的 Ubuntu 20.04。


    ### 结论

    现在你的机器上应该成功安装了 Ubuntu 20.04。


    ### 修复 Grub

    如果你和我一样，你可能不希望 Ubuntu 在启动列表中出现多次。你可能希望 Windows 选项排在第一位，特别是如果其他家庭成员使用电脑并习惯于使用 Windows。


    通过打开 Dash 并输入“Term”来打开终端窗口。然后，点击终端图标。


    在终端窗口中输入以下内容：


    ```bash

    sudo gedit /etc/default/grub


    # 如果你更改了此文件，之后运行‘update-grub’以更新

    # /boot/grub/grub.cfg.

    # 如要查看此文件中选项的完整文档，请参：

    # info -f grub -n ‘Simple configuration’


    GRUB_DEFAULT=”2”

    #GRUB_HIDDEN_TIMEOUT=”0”

    GRUB_HIDDEN_TIMEOUT_QUIET=”true”

    GRUB_TIMEOUT=”10”

    GRUB_DISTRIBUTOR=``lsb_release -i -s 2> /dev/null || echo Debian`”


    GRUB_CMDLINE_LINUX_DEFAULT=”quiet splash”

    GRUB_CMDLINE_LINUX=""

    ```


    如果你想让 Windows 成为默认选项，你可以编辑 `grub.cfg` 文件（文件中有一个注释说不要这样做），或者你可以更改默认值以指向 Windows
    选项。


    虽然编辑 `/etc/default/grub` 文件不会将 Windows 置于列表顶部，但它会在你启动电脑时使其成为被选中的选项。


    要做到这一点，请将 `GRUB-DEFAULT` 修改为启动电脑时 Windows 在列表中的位置。


    在我的电脑上，Ubuntu 是第一，Ubuntu Advanced Options 其次，Windows 是第三。


    注意编号从位置 0 开始，所以 Ubuntu 是 0，Ubuntu Advanced 是 1，Windows 是 2。


    更改默认值后保存文件并运行以下命令：


    ```bash

    sudo update-grub

    ```


    Grub 文件将被更新，如果你重启，Windows 将被自动选中。


    关于额外的 Ubuntu 条目，之所以有多个条目是因为你安装了多个 Linux 内核。


    你可以直接编辑 `grub.cfg` 文件来移除额外条目（不推荐），或者可以通过运行 `Synaptic` 并查找较旧的安装版本号来删除额外的内核。


    我会把重复的条目留在那里，只需不选择它们即可。


    ### Ubuntu 快速浏览

    本快速浏览面向任何从未见过过 Ubuntu 的人，并介绍了标准的视觉外观、感受、应用程序以及功能。


    Ubuntu 自带 `Unity` 桌面，它从 11.04 版本一直是 Ubuntu 的一部分。`Unity` 桌面已经成熟，现在提供了良好的用户体验。


    如果你是 Windows 用户，最初的外观和感受会让你感到陌生，但在几周后，你会喜欢 Ubuntu 和 Unity 桌面的工作方式。


    首先要注意的是屏幕顶部的栏。该栏作为任何运行应用程序的菜单，为应用程序本身留出更多空间。栏上还有一组图标，用于访问常见的系统设置，如电源管理、连接互联网、开启蓝牙以及调整音频设置。这里还有一个时钟和一个电源按钮。


    屏幕左侧被启动栏占据，它包含常用应用程序的图标列表。启动栏让你只需点击鼠标即可访问你喜欢的应用程序。任何运行的应用程序都会出现在启动栏底部，如果你连接了外部设备如
    USB 驱动器或硬盘，它们也会出现。


    导航 Ubuntu 非常快速快捷。没有繁琐的菜单系统需要导航，也没有磁片视图。点击启动栏顶部的 Ubuntu 图标即可导航，但简单的方法是按下键盘上的 Super
    键（Windows 键）。


    出现的屏幕被称为 Dash，从这里你可以用最少的鼠标点击或按键完成任何任务。要查找应用程序，只需在搜索栏中开始输入。通常情况下，这足以找到你需要的内容而无需进一步交互。


    透镜提供了应用程序、文件和文件夹、音乐、照片和视频。除了电脑上的文件和应用程序外，Dash 还会显示你可能感兴趣的应用程序建议。一些人认为这是坏事，但有一个选项可以关闭它。


    视频透镜允许你过滤搜索，以便搜索本地计算机或通过 BBC 和 YouTube 等服务。音乐透镜允许你按子流派和年龄过滤音乐。Ubuntu 默认自带了令人印象深刻的应用程序集。例如，`LibreOffice`
    是默认办公套件，提供了你可能从 Microsoft 相应的办公套件获得的大部分功能。

