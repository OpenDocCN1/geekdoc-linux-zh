    ```\n/bin/sh script_estandar.sh\n/bin/dash script_estandar.sh\n/bin/bash script_estandar.sh\n\
    ```\n2. Now invoke the script `script_bash.sh` using the following commands:\n\
    ```\n/bin/dash script_bash.sh\n/bin/bash script_bash.sh\n```\nYou can see how,\
    \ due to the non-standard script syntax, the second invocation works, but the\
    \ first one (which uses dash) gives a syntax error.\n\n# General Shell Operation\n\
    The shell language is an interpreted language, in which lines of text (ending\
    \ in `\\n`) are read, analyzed, and processed. The lines to be interpreted are\
    \ read from:\n* The standard input (default keyboard). In this case, the shell\
    \ is said to be an interactive shell.\n* A shell script file.\n* The arguments,\
    \ with the option when running the shell. Example: `bash –c “ls –l”`\n\nWith the\
    \ lines read, the shell performs the following steps (in this order):\n1. The\
    \ lines are divided into different elements: words and operators. The elements\
    \ are separated using spaces, tabs, and operators. The `#` character is used to\
    \ include a comment, which is removed from the processing.\n2. A distinction is\
    \ made between simple commands, compound commands, and function definitions.\n\
    3. Different expansions and substitutions are made. The command to be executed\
    \ and the arguments to be passed are detected.\n4. Inbound /outbound redirects\
    \ are performed and items associated with redirects are removed from the argument\
    \ list.\n\n# Using the Shell\nIt’s impossible to be an effective Linux professional\
    \ without knowing how to use the command line. A shell prompt signifies that the\
    \ system is ready to take a user command. This is referred to as a user-system\
    \ dialogue. For each command entered, the user receives a response from the system:\n\
    1. Another invitation, indicating that the command has been carried out and that\
    \ you may go to the next step.\n2. An error message is a statement from the system\
    \ to the user regarding happenings in the system.\n\nUsers who are accustomed\
    \ to dealing with systems that have a graphical interface may find working with\
    \ the command line cumbersome. This form of interface, on the other hand, has\
    \ always been basic in Linux and hence developed. There are many techniques to\
    \ save effort, that is, keystrokes when completing the most common activities\
    \ in Linux:\n* Automatic addition of long command names or file names\n* Searching\
    \ and re-executing a command that was once performed\n* Substitution of file lists\
    \ by some pattern, and much more\n\nWhen you need to conduct comparable operations\
    \ on a variety of objects, the command line’s advantages become clear. In a graphical\
    \ interface system, you’ll need as many dragging as there are items; on the command\
    \ line, one command will suffice.\n\n# Shells\nA command shell, sometimes known\
    \ as a command interpreter, is software that sends your commands to the operating\
    \ system and application programs, as well as receiving their responses. Scripts\
    \ are short programs written in the shell language that conduct a series of consecutive\
    \ operations with files and the data they contain.\n\nYou will see a command line\
    \ prompt—a line ending in `$`—after you registered in the system by entering a\
    \ username and password. This symbol will be used to represent the command line\
    \ in the future. You can go to the command line on any virtual text console if\
    \ a graphical interface was specified to start at system boot during the installation.\
    \ You may do this by pressing `Ctrl-Alt-F1 - Ctrl-Alt-F6` or by using a terminal\
    \ emulator program like `xterm`.\n\nThe shells listed below are available. Depending\
    \ on the distributor, they may differ:\n\nbash\nThe most popular Linux shell.\
    \ It can add to the names of commands and files, preserves a command history,\
    \ and allows you to alter them.\n\nash\nOn UNIX shell platforms, the korn shell\
    \ clone is well-known.\n\nsash\nThis shell is unique in that it does not rely\
    \ on any shared libraries and provides simpler versions of several of the most\
    \ often used utilities, such as `al`, `dd`, and `gzip`. As a result, the sash\
    \ comes in handy when it comes to recovering from system crashes or updating versions\
    \ of the most crucial shared libraries.\n\ntcsh\nImproved version of C shell.\n\
    \nzsh\nThis is the most recent shell on the list. It has advanced capabilities\
    \ such as command argument autocompletion and a slew of other features that make\
    \ working with the shell even more convenient and efficient. However, because\
    \ all zsh extensions are disabled by default, you must study the documentation\
    \ and enable the capabilities that you require before using this command shell.\n"
  raw: '**Implicit:** invoking the script as if it were an executable, which requires
    assigning execution permissions to the script. The shebang is read to determine
    which shell should be used to read the script, loading a child process (subshell)
    for that shell (if the script does not have shebang, for the subshell the same
    type of shell will be used as the one in charge of the command line from which
    the invocation was made). Note that shell scripts are text files read by the command
    interpreter, that is, they are interpreted. They are NOT executed. The assignment
    of the execution permission to a shell script is a file system utility to accelerate
    the invocation of scripts, but its internal function is to load a new shell process
    (subshell) so that it interprets the script.


    **Implicit with. (equivalent to import):** the script will be interpreted by the
    same shell process responsible for the command line from which the script is being
    invoked. Consequently, in this case, the shebang is also ignored.


    In cases where subshells are created, unless otherwise forced (with su -c for
    example), the subshell will belong to the same user to which the parent shell
    that created it belonged. The user to whom the shell process that interprets a
    script belongs determines the operations that can be done from within the script
    (for example, if the shell belongs to the user dit, the script cannot modify the
    file /etc/passwd, while if the shell belongs to the root superuser, yes you can
    do it). Consider this aspect to determine what operations you can perform within
    a script, and with which user you should invoke it.


    Exercises:


    1.In a command console, execute the command ps w and locate


    the process associated with the shell responsible for the command


    line from which you are working.


    2.Invoke that script using the different invocation methods. For


    each of them, analyze the output obtained to determine in each


    case what is the shell process that is interpreting the script, the


    user to which that process belongs and if a subshell has been ope


    ned or not:


    Explicit:


    /bin/sh script_example.sh


    /bin/dash script_example.sh


    /bin/bash script_example.sh


    Implicit with “.”:


    . script_example.sh


    Implicit: check that the script has execute permission and execute it with:


    ./script_example.sh


    While both bash and dash follow the POSIX standard, especially bash adds multiple
    particular extensions, not supported by other shells such as dash. Consequently,
    every time we design a script we must take into account the shell or shells that
    support it, ensuring that it is invoked by one of them. To get an idea of the
    importance of this aspect, consider the following two scripts, based on the use
    of the structure for (to be used later):


    script_estandar.sh


    #!/bin/sh for VAR in 0 1 2 3


    do


    echo $VAR


    done


    script_estandar.sh


    #!/bin/bash


    for ((VAR=0 ; VAR<4 ; VAR++ ))


    do


    echo $VAR


    done


    Both scripts perform the same functionality, but script_estandar.sh is written
    under the POSIX syntax, while script_bash.sh uses a non-standard syntax supported
    by bash.


    Exercises:


    1.Invoke the script script_standar.sh (remember that you must


    have them already created in the scripts/directory) using the


    following commands, having to verify that they all work correct


    ly and with the same result (the first and second calls are the


    same, using the shell dash):


    /bin/sh script_estandar.sh


    /bin/dash script_estandar.sh


    /bin/bash script_estandar.sh


    2.Now invoke the script script_bash.sh using the following com


    mands:


    /bin/dash script_bash.sh


    /bin/bash script_bash.sh


    You can see how, due to the non-standard script syntax, the second invocation
    works, but the first one (which uses dash) gives a syntax error.


    **General Shell Operation**


    The shell language is an interpreted language, in which lines of text (ending
    in \n) are read, analyzed, and processed. The lines to be interpreted are read
    from:


    *   The standard input (default keyboard). In this case, the shell is


    said to be an interactive shell.


    *   A shell script file.


    *   The arguments, with the option when running the shell. Exam


    ple: bash –c “ls –l”


    With the lines read, the shell performs the following steps (in this order):


    1.The lines are divided into different elements: words and ope


    rators. The elements are separated using spaces, tabs, and opera


    tors. The # character is used to include a comment, which is re


    moved from the processing.


    2.A distinction is made between simple commands, compound


    commands, and function definitions.


    3.Different expansions and substitutions are made. The com


    mand to be executed and the arguments to be passed are detected.


    4.Inbound /outbound redirects are performed and items asso


    ciated with redirects are removed from the argument list.


    **Using the Shell**


    It’s impossible to be an effective Linux professional without knowing how to use
    the command line.


    A shell prompt signifies that the system is ready to take a user command. This
    is referred to as a user-system dialogue. For each command entered, the user receives
    a response from the system:


    1.Another invitation, indicating that the command has been


    carried out and that you may go to the next step.


    2.An error message is a statement from the system to the user


    regarding happenings in the system.


    Users who are accustomed to dealing with systems that have a graphical interface
    may find working with the command line cumbersome. This form of interface, on
    the other hand, has always been basic in Linux and hence extensively developed.
    There are many techniques to save effort, that is, keystrokes when completing
    the most common activities in the Linux command shells:


    *   Automatic addition of long command names or file names


    *   Searching and re-executing a command that was once perfor


    med before


    *   Substitution of file name lists by some pattern, and much more


    When you need to conduct comparable operations on a variety of objects, the command
    line’s advantages become clear. In a graphical interface system, you’ll need as
    many mice dragging as there are items; on the command line, one command will suffice.


    **Shells**


    A command shell, sometimes known as a command interpreter, is software that sends
    your commands to the operating system and application programs, as well as receiving
    their responses. Scripts are short programs written in the command shell language
    that conduct a series of consecutive operations with files and the data they contain.


    You will see a command line prompt—a line ending in $—after you have registered
    in the system by entering a username and password. This symbol will be used to
    represent the command line in the future. You can go to the command line on any
    virtual text console if a graphical user interface was specified to start at system
    boot during the installation. You may do this by pressing Ctrl-Alt-F1 - Ctrl-Alt-F6
    or by using a terminal emulator program like xterm.


    The shells listed below are available. Depending on the distributor, they may
    differ:


    bash


    The most popular Linux shell. It can add to the names of commands and files, preserves
    a command history, and allows you to alter them.


    pdkdh


    On UNIX shell platforms, the korn shell clone is well-known.


    sash


    This shell is unique in that it does not rely on any shared libraries and provides
    simpler versions of several of the most often used utilities, such as al, dd,
    and gzip. As a result, the sash comes in handy when it comes to recovering from
    system crashes or updating the versions of the most crucial shared libraries.


    tcsh


    Improved version of C shell.


    zsh


    This is the most recent shell on the list. It has advanced capabilities such as
    command argument autocompletion and a slew of other features that make working
    with the shell even more convenient and efficient. However, because all zsh extensions
    are disabled by default, you must study the documentation and enable the capabilities
    that you require before using this command shell.'
