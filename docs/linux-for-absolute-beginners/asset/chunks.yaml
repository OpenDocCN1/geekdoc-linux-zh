    ### `Wc` Command


    The `wc` command, which stands for “wall count,” is one of the Linux commands.
    It can be used to count how many lines are in a file. For instance, if you want
    to know the number of lines in a file such as ‘first,’ do the following:


    ```bash

    wc –l first

    ```


    The above command shows our file has only two lines, which is true. To get both
    the number of lines and the name of the file, do the following:


    ```bash

    wc –l first

    wc first

    ```


    The command will output the number of lines in the file, the number of words in
    the file, and the total bytes of the file. The file name will also be shown. Note
    that these will be shown in the order mentioned above so don’t get confused. The
    above command can be split so that you can view the details one at a time.


    ### `Last` Command


    Sometimes, you might need to see the list of logins for your system. This is good
    for those using Linux in production environments, especially for security purposes.
    Someone cannot deny having logged into the system. Just go to the command line
    and type in `last.` You will be shown the users who have logged into your system,
    the terminal they used, and the date and time of login. If these users are still
    logged in, you will be notified of this as well.


    Run the command shown below:


    ```bash

    last -100

    ```

