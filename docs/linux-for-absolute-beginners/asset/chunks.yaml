    Deep Dive


    ## 文件系统层次结构标准

    * man hier

    * RedHat 企业级 Linux

    * SUSE Linux 企业服务器

    * Ubuntu


    Ubuntu 最优特性之一是它是免费开源的 GNU/Linux 软件。这意味着该软件可以自由地使用、复制、修改和分发。开源软件由全球范围内的社区进行开发、维护和分发。软件归社区所有，且开发过程透明。这使得代码更加稳定可靠，实际上几乎没有恶意软件，并且易于安装和使用。


    GNU 是一组类 Unix 程序，它们为 Linux 系统提供基本功能。如果没有 GNU 工具和应用程序，Linux 将不存在。这就是为什么某些人将 GNU/Linux
    操作系统相对于仅仅 Linux。GNU 是“GNU''s Not Unix”（GNU 不是 Unix）的缩写。GNU 是基本 Unix 程序的 FOSS（自由开源软件）实现。


    GNU/Linux 已经开发了二十多年，是一个非常成熟的操作系统。Linux 内核由 Linus Torvalds 于 1991 年设计。GNU 系统由 Richard
    Stallman（理查德·斯托尔曼）设计。现在，GNU/Linux 由自由软件基金会（The Free Software Foundation）维护。GNU/Linux
    的设计基于 Unix，Unix 是由 AT&T 贝尔实验室从 1969 年开始的。因此，GNU/Linux 的传承跨越了多年。Unix 和 GNU/Linux
    拥有定义的文件系统和简单的模块化软件设计，这转化为更小、更简单、更快速的软件。我们都是这种优雅设计理念的受益者。


    流行的 Linux 标志——企鹅 Tux 由 Larry Ewing 创建的，你可以在许多贴纸、标签、别针、T 恤和玩具上找到它。


    ## 安装 Ubuntu


    ### 新功能


    #### Brasero

    Brasero CD/DVD 刻录不再是发行版的一部分。相反，由文件管理器执行该功能。


    ### 启动器位置

    如果需要，可以将启动器移动到屏幕底部。


    ### 注销、关机和重启图标

    使用 Dash（应用程序透镜）搜索注销、关机或重启将显示可以放置在启动器上的图标。


    ### 通过 Dash 进行在线搜索

    使用 Dash 时，在线搜索的默认值现在关闭。


    ### LibreOffice 5

    LibreOffice 5 现在是 LibreOffice 的默认版本。


    ### 软件中心

    Ubuntu 软件中心已由启动器上的 Ubuntu 软件取代。


    ### 安装 .deb 包

    双击 `.deb` 文件将激活 Ubuntu 软件以安装新的软件包；然而，我建议安装 `gdebi` 并使用它来安装包，因为它更快且更可靠。


    ### 注意事项


    #### OS 升级问题

    软件更新器会自动检查可用更新。软件更新器可能会询问你是否想要升级到更高版本的 Ubuntu。这是一个长期且容易出错的过程。升级过程过去失败过，但现在可能可以正常运行。你可以选择升级选项或手动安装
    Ubuntu 的新版本。由你决定。


    #### 安装注意事项

    你需要登录系统管理员账户，以执行任何涉及在计算机上安装新软件的预安装或后安装步骤。在执行实际的 Linux 安装之前，你可能需要安装软件来创建一个可启动的
    USB 闪盘。在执行 Linux 安装后，你还需要安装更新。


    在安装过程中，你会被要求输入用户名和密码。由于该用户将带有管理员权限被创建，你应该输入类似 `Linux` 或 `SysAdmin` 的用户名。安装完成后，你将创建自己的用户账户。如果你在安装期间输入了
    `Linux`，那么你 Ubuntu 的实际登录名将是 `Linux`。从历史上看，Linux 用户名全小写。但密码并非如此。


    系统会询问你是在安装之前尝试 Ubuntu，还是立即安装 Ubuntu。如果你已经决定安装，我建议直接安装 Ubuntu 而不是尝试。如果你决定在不安装的情况下尝试
    Ubuntu，桌面上将有一个安装图标，随后允许你安装 Ubuntu。这在某些旧电脑上可能不起，因此我建议你不要从桌面安装 Ubuntu。


    #### 安装期间的更新

    不要勾选以下框：

    * [ ] 在安装时下载更新

    * [ ] 安装第三方软件


    我强烈建议在操作系统安装完成后再安装更新和第三方软件。如果更新失败，则整个安装将失败。


    #### 磁盘配置

    如果你的硬盘上已经安装了操作系统，你将被问到以下问题：


    “此计算机目前安装了多个操作系统。你想做什么？”


    (•) 与它们并存安装 Ubuntu

    ( ) 擦除磁盘并安装 Ubuntu


    默认选项是“与它们并存安装 Ubuntu”。然而，你可能想通过选择另一个选项来擦除磁盘并将 Ubuntu 作为唯一的操作系统。


    如果你想保存当前的数据和操作系统，请使用 `Clonezilla` 等磁盘镜像工具。


    某些安装对话框可能需要使用键盘导航。导航键为方向键、`Tab` 键和回车键。


    ## 下载 Ubuntu


    Linux 发行版存储在 `ISO` 文件中，可以被描述为光盘镜像。如果你想更多关于 ISO 文件的信息，维基百科有一篇关于 ISO 文件的精彩文章。


    本书假设你正在 PC 类计算机上安装 Ubuntu。为了创建一个允许我们安装 Ubuntu 的光盘，我们首先需要从互联网下载 `ISO` 文件。这可以通过搜索
    Ubuntu 下载或搜索特定的 Ubuntu 发行版（例如 Ubuntu 16.04）来实现。


    Ubuntu 网页有两个基本选择：

    * 下载 32 位

    * 下载 64 位


    32 位版本适用于任何计算机。如果你有一 64 位计算机并想尝试 64 位版本，请选择下载 64 位。


    注意，`ISO` 文件可能太大无法放入光盘，因此你可能需要使用 DVD。一旦下载了光盘镜像文件，你可以将其写入 DVD。镜像文件不能作为文件存储在 DVD
    上。必须作为镜像存储。这通过将文件存储为镜像或刻录镜像文件的内容来实现。不同的 CD/DVD 刻录程序可能使用其他术语来创建镜像 DVD。


    也可以从 USB 闪盘安装 Ubuntu。创建闪盘的过程比创建光盘稍微复杂。首先，你需要在 Linux 或计算机上下载并安装 `UNetbootin` 应用程序。然后，你需要通过设置文件属性来确保
    `UNetbootin` 应用程序是可执行的。然后就可以运行该应用程序，它将创建一个可启动的 USB 闪盘。请参考下一页的截图在 Linux 计算机上设置
    `UNetbootin` 可执行文件的属性。


    **截图 – UNetbootin 属性**


