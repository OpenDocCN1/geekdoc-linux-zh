    file1.renamed file2


    $ mv -i firstdir/file1.renamed firstdir/file2


    overwrite firstdir/file2? (y/n [n]) n


    not overwritten


    $


    In the above example, a directory was renamed with mv dir firstdir. Next, a file
    was renamed with mv file file1.renamed. Next file1.renamed was relocated to the
    firstdir directory with the mv file1.renamed firstdir/ command. A file was overwritten
    with the mv firstdir/file1 firstdir/file2 command. The -i option allows you to
    be prompted before a file is rewritten.


    **Sorting Data**


    You have already seen the sort command in use. In the simplest form, it sorts
    lines of text alphabetically.


    sort file: Sort text in file.


    sort -k F file: Sort by key. The F following -k is the field number.


    sort -r file: Sort in reverse order.


    sort -u file: Sort text in file, removing duplicate lines.


    $ cat more-secrets


    tags: credentials


    user: bob


    pass: Abee!


    tags: credentials


    $ sort more-secrets


    pass: Abee!


    tags: credentials


    tags: credentials


    user: bob


    $ sort -u more-secrets


    pass: Abee!


    tags: credentials


    user: bob


    $ sort -ru more-secrets


    user: bob


    tags: credentials


    pass: Abee!


    $ sort -u -k2 more-secrets


    pass: Abee!


    user: bob


    tags: credentials


    **Creating a Collection of Files**


    To generate an archive from a collection of files and/or directories, use the
    tar command. You might want to make a backup or duplicate of a set of files. You
    might want to transmit numerous files at once or in a batch. In these situations,
    tar can help.


    tar [-] c|x|t f tarfile [pattern]: Create, extract, or list contents of a


    tar archive using a pattern, if supplied.


    You will notice that tar does not require a hyphen (-) to precede its arguments.
    Traditionally, the hyphen is not allowed, but tar allows it. It’s the same as
    tar -cf file.tar if you see tar cf file.tar. Here’s a rundown of some of the most
    popular tar alternatives.


    c: Create a tar archive.


    x: Extract files from the archive.


    t: Display the table of contents (list).


    v: Causes tar to be verbose.


    f file: The tar archive file to perform operations against.'
