  trans: "\n\n# 隐式 (Implicit)\n像执行可执行文件一样调用脚本，这需要为脚本分配执行权限。系统会读取 shebang 解释器路径来确定应该使用哪种\
    \ shell 来读取脚本，并为该 shell 加载一个子进程（子壳）（如果脚本没有 shebang，则子壳将使用与调用时所在的命令行相同类型的 shell）。请注意，shell\
    \ 脚本是由命令解释器读取的文本文件，也就是说，它们是被**解释**的。它们**不是**被直接**执行**的。为 shell 脚本分配执行权限是一种加速脚本调用的文件系统工具，但其内部功能是加载一个新的\
    \ shell 进程（子壳），以便其解释脚本。\n\n# 隐式使用 `.` (等同于 import): \n脚本将由负责调用脚本的命令行的同一个 shell\
    \ 进程进行解释。因此，在这种情况下，shebang 也会被忽略。\n\n在创建子壳的情况下，除非强制要求（例如使用 `su -c`），否则子壳将属于创建它的父\
    \ shell 所所属的用户。解释脚本的 shell 进程所属的用户决定了在脚本内部可以执行的操作（例如，如果 shell 属于用户 `dit`，则脚本无法修改\
    \ `/etc/passwd` 文件，而如果 shell 属于 `root` 超用户，就可以修改）。请考虑这一方面，以确定可以在脚本中执行哪些操作，以及应该以哪个用户调用它。\n\
    \n## 练习\n1. 在命令控制台中，执行命令 `ps w` 并找到与你当前工作的命令行相关的 shell 进程。\n2. 使用不同的调用方法调用该脚本。对于每种方法，分析获取的输出，以确定每种情况下解释脚本的\
    \ shell 进程是什么、该进程属于哪个用户，以及是否打开了子壳：\n\n### 显式 (Explicit)\n```\n/bin/sh script_example.sh\n\
    /bin/dash script_example.sh\n/bin/bash script_example.sh\n```\n\n### 隐式使用 “.”\n\
    ```\n. script_example.sh\n```\n\n### 隐式\n检查脚本是否具有执行权限并使用以下命令执行它：\n```\n./script_example.sh\n\
    ```\n\n虽然 `bash` 和 `dash` 均遵循 POSIX 标准，但 `bash` 增加了许多 `dash` 等其他 shell 不的特定扩展。因此，每当我们设计一个脚本时，必须考虑到支持它的\
    \ shell 或多个 shell，确保它由其中之一调用。为了了解这一方面的重要性，请考虑以下两个基于结构使用（稍后使用）的脚本：\n\n**script_estandar.sh**\n\
    ```bash\n#!/bin/sh\nfor VAR in 0 1 2 3\ndo\necho $VAR\ndone\n```\n\n**script_estandar.sh**\n\
    ```bash\n#!/bin/bash\nfor ((VAR=0 ; VAR<4 ; VAR++ ))\ndo\necho $VAR\ndone\n```\n\
    \n两个脚本的功能相同，但 `script_estandar.sh` 是按照 POSIX 语法编写的，而 `script_bash.sh` 使用了 `bash`\
    \ 支持的非标准语法。\n\n## 练习\n1. 使用以下命令调用脚本 `script_standar.sh`（记住你已经在 `scripts/` 目录下创建了它们），并验证它们是否都工作正常且结果相同（第一次和第二次调用相同，均使用\
    \ shell `dash`）：\n```\n/bin/sh script_estandar.sh\n/bin/dash script_estandar.sh\n\
    /bin/bash script_estandar.sh\n```\n2. 现在使用以下命令调用脚本 `script_bash.sh`：\n```\n/bin/dash\
    \ script_bash.sh\n/bin/bash script_bash.sh\n```\n你可以看到由于由于非标准的脚本语法，第二次调用可以工作，但第一次调用（使用\
    \ dash）会产生语法错误。\n\n# 通用 Shell 操作\nshell 语言是一种解释型语言，其中会读取、分析并处理（以 `\\n` 结尾）的文本行。需要被解释的行从以下位置读取：\n\
    * 标准输入（默认键盘）。在这种情况下，该 shell 被称为交互式 shell。\n* shell 脚本文件。\n* 参数，在运行 shell 时通过选项提供。例如：`bash\
    \ –c “ls –l”`\n\n读取这些行后，shell 会执行以下步骤（按此顺序）：\n1. 将行分为不同的元素：单词和操作符。使用空格、制表符和运算符分隔元素。`#`\
    \ 字符用于包含注释，在处理过程中会被移除。\n2. 在简单命令、复合命令和函数定义之间进行区分。\n3. 进行不同的扩展和替换。检测要执行的命令和要传递的参数。\n\
    4. 执行入站/出站重定向，并将重定向相关的项从参数列表中移除。\n\n# 使用 Shell\n如果不知道如何使用命令行，就不可能成为高效的 Linux 专家。shell\
    \ 提示符表示系统已准备好接收用户命令。这被称为用户与系统的对话。对于输入的每个命令，用户都会收到来自系统的响应：\n1. 另一个提示符，表示命令已执行，你可以进行下一步。\n\
    2. 错误消息是系统对用户关于系统内部发生情况的陈述。\n\n习惯于处理图形界面系统的用户可能会觉得使用命令行很繁琐。相反，这种界面在 Linux 中一直是基础并得到了发展。有很多技术可以节省工作，即在完成\
    \ Linux 常见的活动时：\n* 自动补全命令名或文件名\n* 搜索并重新执行过的命令\n* 通过模式替换文件列表\n\n当你需要对各种对象执行类似的操作时，命令行的优势就显而易见。在图形界面系统中，你需要大量的拖拽；而在命令行中，一个命令就足够了。\n\
    \n# Shell (壳)\n命令行 shell（有时称为命令解释器）是将你的命令发送到操作系统和应用程序，并接收其响应的软件。脚本是用 shell 语言编写的短程序，对文件及其包含的数据执行一系列连续操作。\n\
    \n在输入用户名和密码登录系统后，你会看到命令行提示符（以 `$` 结尾的行）。该符号以后将代表命令行。如果在安装期间指定系统启动时进入图形界面，你可以在任何虚拟文本控制台上进入命令行。你可以通过\
    \ `Ctrl-Alt-F1 - Ctrl-Alt-F6` 或使用终端模拟器程序如 `xterm` 实现。\n\n列出的 shell 可用。根据发行版的不同，它们可能有所差异：\n\
    \nbash\n流行的 Linux shell。它可以为命令和文件名扩展，保留命令历史并允许对其修改。\n\nash\n在 UNIX shell 平台上，korn\
    \ shell 的克隆很有名。\n\nsash\n这种 shell 的独特之处在于不依赖任何共享库，并提供了许多常用工具的简化版本，如 `al`、`dd`\
    \ 和 `gzip`。因此，在系统崩溃或更新关键共享库版本时，sash 非常有用。\n\ntcsh\nC shell 的改进版本。\n\nzsh\n列表中最新的\
    \ shell。它具有高级功能，如命令参数自动补全以及许多其他让 shell 操作变得更加方便高效的功能。然而，由于所有 zsh 扩展默认禁用，因此你必须在使用此命令行\
    \ shell 之前学习文档并启用你所需的功能。\n\n"
- fmt: '

    Bash Bourne Again Shell is the default shell. Use the command `echo $ SHELL` to
    see which shell you’re using.


    Shells differ not only in terms of capability but also in terms of command syntax.
    If you are a new user, we recommend that you start with `bash`; further examples
    demonstrate the work in this area.


    ## Bash Shell


    The command line in `bash` consists of the command’s name followed by keys (options),
    which are instructions that change the program’s behavior. Keys usually start
    with the character —or—and consist of just one letter. After the command, arguments
    (parameters)—the names of the objects on which the command must be executed—can
    be added (often the names of files and directories).


    After pressing the Enter key to finish entering a command, the command is sent
    to the shell for execution. There may emerge notifications concerning the command
    execution or failures as a result of the command execution on the user’s terminal,
    and the arrival of the next command line prompt (ending with the `$` character)
    signals that the command has completed and you can input the next one.


    In `bash`, various strategies make typing and editing the command line easier.
    You can, for example, use the keyboard to:


    - `Ctrl-A`: go to the beginning of the line. The same can be done by pressing
    the Home key;

    - `Ctrl-u`: delete current line;

    - `Ctrl-C`: abort the command’s execution.


    To identify a specific command among those that have previously been run without
    having to go through the entire story, press `Ctrl-R` and enter a term that was
    used in the command you’re looking for.


    Commands that appear in history are numbered. To run a specific command, type:


    `! command number`


    If you participate `!!`, the command you just typed begins.


    On Linux, application and command names might be too long at times. Fortunately,
    `bash` can finish the names for you. You can complete the name of a command, program,
    or directory by using the `Tab` key. Let’s say you wish to utilize the `bunzip2`
    decompression application as an example. To do so, start typing:


    `bu`


    Then press the `Tab` key. If nothing happens, there are a few other possibilities
    for finishing the instruction. By pressing the `Tab` key once again, you’ll get
    a list of names that begin with the letter `bu`. The system, for example, includes
    the following programs: `buildhash`, `builtin`, and `bunzip2`:


    ```

    $ bu

    buildhash builtin bunzip2

    $ bu

    ```


    Press Tab after typing `n>` (`bunzip` is the only name with the letter `n` as
    the third letter). The shell will complete the name for you, and all you have
    to do now is hit Enter to execute the command!


    `bash` searches folders defined in the `PATH` system variable for programs invoked
    from the command line. By default, the current directory, denoted by `./`, is
    not included in this directory listing (dot slash). As a result, you must use
    the command `./prog` to launch the `prog` program from the current directory.


    ## Basic Commands


    Working with data (typically stored in files) and managing programs (processes)
    operating on the system are the primary activities that must be completed in any
    system. The commands listed below allow you to conduct the most common tasks while
    working with files and processes. Only the first, `cd`, is included in the shell
    itself; the others are supplied separately but are always available on every Linux
    system. All of the commands listed below can be used in both text and graphical
    mode (xterm, KDE console). Use the `man` command to learn more about each command,
    for example:


    ```

    man ls

    cd

    ```


    ### `cd`


    Allows you to change the current directory (travel through the file system) (navigate
    through the file system). It works with both absolute and relative paths. Let’s
    say you’re in your home directory and wish to access the `tmp/` subdirectory.
    To do so, type in the following relative path:


    `cd tmp/`


    To change to the `/usr/bin/` directory, type (absolute path):


    `cd /usr/bin/`


    Some options for using the command are:


    - `cd ..`: Allows you to make the current parent directory (note the space between
    `cd` and `..`).

    - `cd -`: With no parameters, the `cd` command returns the shell to the home directory.


    ### `ls`


    `ls` (list) lists the files in the current directory. Two main options: `-a`—view
    all files, including hidden, `-l`—display more detailed information.


    ### `rm`


    This command is used to delete files. Warning: deleting the file, you cannot restore
    it! Syntax: `rm filename`.


    This program has several parameters. The most frequently used ones are: `-i`—file
    deletion request, `-r`—recursive deletion (i.e., deletion, including subdirectories
    and hidden files). Example:


    ```

    rm -i ~/html/*.html

    ```


    Removes all `.html` files in your `html` directory.


    ### `mkdir`, `rmdir`


    The `mkdir` command allows you to create a directory, while `rmdir` deletes a
    directory, provided it is empty. Syntax:


    ```

    mkdir dir_name

    rmdir dir_name

    ```


    The `rmdir` command is frequently superseded with the `rm -rf` command, which
    deletes directories even if they are not empty.


    ### `less`


    `less` allows you to page by page. Syntax:


    `less filename`


    ### `grep`


    This command allows you to search the file for a certain string of characters.
    Please keep in mind that `grep` searches use a regular expression, which means
    you can specify a template for searching a complete group of terms at once. Regular
    expressions allow you to create patterns that describe string classes such as
    “four digits in a row, surrounded by spaces.” Obviously, such an expression may
    be used to find all the years written in numbers in the text. Regular expressions
    have a wide range of search capabilities. You can get additional information about
    `grep` in the on-screen documentation (`man grep`). Syntax:


    `grep search_file`


    ### `ps`


    Shows a list of active processes. The process name is shown in the command column,
    and the PID (process identifier) is the process number (which is needed for activities
    with the process, such as sending signals with the `kill` command). Syntax:


    ```

    ps arguments

    ```


    Argument `u` provides extra information, while `ax` allows you to observe processes
    that are not yours.


    ### `kill`


    If the program stops responding or hangs, use this command to complete it. Syntax:


    `kill PID_number`


    The PID number refers to the process identification number.

