    ## 快捷键


    - `Tab`: 这将补全命令或文件名。如果有多个选项，系统将使用视觉或音频通知提示你。如果系统检测到很多可能性，它会询问你是否想要检查所有选项。

    - `Tab`: 这将显示文件名或命令的补全选项。

    - `Ctrl + A`: 将光标移动到当前命令行的开头。

    - `Ctrl + C`: 这将结束你的计算机程序并显示 Linux 提示符。

    - `Ctrl + D`: 这将退出当前的会话。这是一个类似于输入 `exit` 或 `logout` 的组合键。

    - `Ctrl + E`: 这将光标移动到当前命令行的末尾。

    - `Ctrl + H`: 功能与按下键盘上的退格键（backspace）类似。

    - `Ctrl + L`: 这将清除当前终端。

    - `Ctrl + R`: 这将搜索历史命令。

    - `Ctrl + Z`: 这将允许你挂起计算机。


    ## 程序


    - `右箭头/左箭头`: 这些键将让你更容易地在当前所在的命令行中移动光标。你可能会发现添加更多字符或对程序进行某些更改很有用。

    - `上箭头/下箭头`: 这些键将让你更容易地浏览系统历史记录。你可以访问任何想要重复的行，在需要时更改某些数据，然后按 `Enter` 快速执行这些新命令。

    - `Shift + Page Up/Shift + Page Down`: 使用这些组合键允许你检查终端缓冲区。


    随着你对 Linux 系统变得越来越熟悉，你将开始更好地理解这些命令是如何工作的，并学习其他命令，这会让使用 Linux 系统变得更加容易。这些是你应该学习如何使用的初始命令，因为它们会让你在系统中的导航变得简单得多。尝试一下，并练习登录和退出系统，以便在继续之前先对它的运行方式有一个感觉。


    ## 瞬息之间新版本


    在 Linux 上，如果你想更改版本（例如为了获得最新的操作系统），大多数发行版都需要完全重新安装。在 Windows 下，这种操作非常费力且耗费大量时间。更改
    GNU/Linux 版本如此简单，甚至可以快速成为一种常态。


    要在 Linux Mint 中执行此操作，请前往更新管理器安装最新的可用版本。注意的是，安装最新版本并不意味着更改整个软件。GNU/Linux 提供的操作系统足够轻量，可以在内存小于
    4 GB 的计算机上运行。


    通常，考虑到目前的 Linux 发行版，配备 4 GB 内存的入门级电脑对于日常使用来说几乎是过剩。安装 Linux Mint 的建议最低配置是 9 GB
    磁盘空间和 256 MB 内存（1GB 更为舒适）。显然，某些软件可能需要略大于 1 GB 的内存。但在 1 到 4（或 8 GB）内存之间，空间是足够的的。


    发行版的不同版本通常以“长周期”提供，通称为 `LTS`（长期支持）。例如，自 2016 年春季起提供的 Linux Mint 18 将支持到 2021 年春季。对于其他版本，如果你知道复制和粘贴，你就可以重新安装软件并替换为最新版本。最重要的是，你可以恢复旧系统所有的软件配置，包括你的电子邮件、设置，以及包含扩展在内的浏览器完整参数。


    这种魔法是如何实现的？GNU/Linux 发行版的优势在于所有个人文件都存储在一个命名的单一文件夹中。该文件夹还包含隐藏目录，这些目录包含了你软件的所有设置。GNU/Linux
    不会侵犯用户。


    GNU/Linux 是一个不会剥削你的操作系统。默认安装不包含比常用且功能全软件之外的内容。Linux 社区和自由软件开发者并不关心你对你完全负责计算机做什么，你对此负全部责任。


    GNU/Linux 发行版不会向“第三方”暗示、分析或传输你的任何操作，因为这可能会违反用户的隐私。


    ## Linux 技巧与技巧


    有数千条命令行，这使得在短时间内执行任务成为可能。与其页一页地翻阅，单个命令就可以帮助你在几秒钟内获得想要的内容。


    在 Linux 上，你必须注意某些 Windows 快捷键可能会执行完全不同的功能。因此，不要期望 `Ctrl + S` 在 Linux 上帮助你保存项目。


    ```

    ls

    ```


    此命令用于列出文件夹中的文件。你可以使用 `-a` 列出隐藏文件，使用 `-l` 显示详细列表，使用 `-R` 查看子文件夹；`cd` 切换目录命令用于在现有文件系统中导航。例如，`cd
    /var/log` 进入日志文件夹。无论你在哪里，这都是有效的，因为我们放置了起始斜杠，这表示这是一个绝对地址。


    ```bash

    pwd

    ```


    打印工作目录。此命令显示你当前所在文件夹的绝对路径。


    ```

    clear

    ```


    这用于清理你的终端窗口，将上面的所有文本推后，为你留下一个干净的窗口。键盘快捷键 `Ctrl + l` 执行相同的操作。


    ```

    Ctrl + s

    ```


    停止显示；当你误输入错误命令时，这非常有用。


    # 结论


    总之，你已经足够的信息来开始并使用你所选择、安装并开始尝试的 Linux。希望你发现这个过程对你很有启发且有价值。


    作为初学者，你应该熟悉这些 Linux 命令。这是 Linux 最令人兴奋的地方。


    人们喜欢在终端上运行命令，这产生了不同的结果。Linux 的有趣之处在于它有各种发行版，而大多数命令在这些发行版中是通用的。这使得在不同发行版之间转换变得容易。


    然而，无论你决定如何，请记住这是对主题的介绍。


    '
