    OS`；如果你正在寻找高质量或定制化的工作环境，请选择 `Arch Linux` 或 `Kali`。此外，还有一个 `Terminal`（终端）或命令行界面，它是进行任何技术水平工作的绝佳工具。


    # Linux 操作系统 vs. FreeBSD 操作系统


    `FreeBSD` 和 `Linux` 都是开源源码，与其许可证相互独立，并具有与 Unix 相同的环境。`FreeBSD` 是多年前在许多修改和更新后出现在
    Unix 操作系统中的。相比之下，`Linux` 是从零开始开发的，作为 Unix 的替代方案。`Linux` 和 `FreeBSD` 都拆分了相同的文件管理类别。此外，它们都使用相同类型的
    Shell 环境作为主要的通信手段。除此，它们还共享类似的 API 程序。由于各种相似性，`Linux` 和 `FreeBSD` 可以共享多个工具和应用。


    ## 许可证差异


    - `Linux` 和 `FreeBSD` 的许可证差异是它们之间主要的区别。

    - 所有 `Linux` 发行版、`Linux` 内核、`Linux` 程序以及基于 `GNU` 的应用程序都遵循 `GNU General Public`
    或 `GNU GPL` 许可证。

    - `GNU GPL` 也称为“左拷贝”（copy-left）。

    - `BSD` 许可证与 `GNU GPL` 几乎相同，但来自 `BSD 许可证` 的作品并不需要维护许可证的条款。

    - 任何人都可以轻松地访问、共享或修改他们的源代码，而无需重写或修改修订后的源码。

    - 必须包含原始的 `BSD` 许可证和版权证书，更新后的源码是唯一的要求。

    - 每个许可证的成本完全取决于用户的需求和哲学。

    - `GNU GPL` 许可证促进了开放自由的环境和共享。

    - 相关软件应注意依赖基于 `GNU` 的软件。

    - 另一方面，`BSD` 许可的软件可以轻松且免费地安装在闭源软件上。

    - 这使得 `BSD` 软件对企业和开发者更有吸引力，他们希望出售自己的软件，因为他们可以直接销售存储了其资源的软件。


    - 程序的历史和谱系是 `Linux` 和 `FreeBSD` 之间的另一个主要区别。

    - `Linus Torvalds` 开发了 `Linux` 内核来取代 `MINIX`，后者在赫尔辛基大学被禁止进一步用于研究。

    - 随后它将先进的 `Linux` 内核与来自 `GNU` 的多个组件集成，创建了一个类似于 Unix 的完整系统。

    - `Linux` 完全是从零开始升级的，没有使用任何现有 Unix 系统的东西。

    - `Linux` 在许多方面与 Unix 有不同。

    - 另一方面，`FreeBSD` 与 Unix 应用有密切的关系。

    - `Berkeley Software Distributions`（即 `BSD`）是在加州大学开发的。

    - `BSD` 后来用完整的 `BSD` 许可证重写了所有原始许可证，该操作系统后来完全整合到所有其他开源渠道中。


    ## Linux 的版本


    ### Gentoo

    `Gentoo` 是一个高度灵活的元发行版，允许用户使用字符认证和软件编辑。`Gentoo` 是可以定制的。该项目由 Daniel Robbins 在 2000
    年启动。尽管它提供了灵活性，但它需要相应的技术才能使用。换句话说，这对于没有经验的用户并不友好，因为可能花费大量时间来适应。更新是非常耗时的。


    ### Arch Linux

    `Arch Linux` 由 Judd Vinet 于 2002 年发布。最初，它被视为存在于中高级用户之间的一个独立项目。后来，它通过一种称为“滚动更新”（rolling-release）的机制得以提升。滚动更新意味着应用具有自我更新的能力。`Arch
    Linux` 拥有优秀的软件管理基础设施。它的安装目的是为了能够从源代码安装软件。另一个误解是由于偶尔的不稳定性会导致退化风险。


    ### Ubuntu

    `Ubuntu` 为桌面用户改变了 `Linux` 的个性。它长期以来一直闻名。它于 20 世纪初发布，至今在 `Linux` 用户中仍然流行。`Ubuntu`
    基于 `DEB` 软件包。它拥有 `Canonical` 的长期支持，并现在通过其自己的类型支持业务。`Ubuntu` 的一些特殊功能包括现场 DVD、支持新技术的环境（新手可以轻松使用
    `Ubuntu`）以及不同的桌面环境。`Ubuntu` 最重要的问题之一是它的不兼容性。


    ### MX Linux

    `MX Linux` 作为 `MEPIS Linux` 站点引入。这适用于个人和商业目的。`MX Linux` 最受欢迎的功能是它的图形控制工具，被称为 `MX-Tools`。它具有不同的平台支持、对图形驱动的不同兼容性以及易于管理。与
    `Mint` 和 `Ubuntu` 相比，`MX Linux` 可能对新手不够友好。需要时间来适应它的安装程序，某些工具看起来可能不同。


    ### Mint

    `Linux Mint` 于 2006 年发布，基于 `Ubuntu` 开发。该发行版最适合初。`Mint` 具有多种增强使其易于使用。它提供了与其他程序的交互。因此，它不仅适用于个人使用，也适用于商业用途。开发者提供三种类型的发布，即官方版（12
    月）、点版本（根据需要，例如）和每月版本。


    ### 回到 Kali

    `Kali` 是为系统安全和访问设计的平台。它是目前最流行的测试平台。这一切都始于 `BackTrack` 的创建（`BackTrack` 是一个基于 `Linux`
    的 `Slax` 发行版）。背后的公司是 `Offensive Security`。`BackTrack 5` 基于 `Debian` 并以 `Kali`
    的名称发布。`Kali Linux` 及其功能级测试工具非常稳定，支持 32 位和 64 位格式。


    # 命令基础


    现在你可以打开终端。在桌面上右键点击并选择“打开终端”。


    如果你没有看到此选项，请查看窗口顶部的“应用程序”。点击“应用程序”并进入“辅助”。选择“打开终端”打开文本编辑器，即“Gedit”。只需点击搜索输入“文本编辑器”。向文件中添加你喜欢的文本并保存，可以保存在桌面。我将文件命名为
    `first`，内容如下：


    ```

    我是一个 Linux 大师

    我正在享受这本书

    ```


    现在回到终端并输入：


    ```bash

    cat first

    ```


    按下回车键后，文件内容将显示在窗口中。例如列出短文件的内容。


    ## 切换目录


    你可能想通过终端导航或切换目录。使用 `cd` 命令来实现，它的含义是“切换目录”。


    示例：


    ```bash

    cd /home

    ```


    使用正斜杠 (`/`) 意味着相对于根目录，这意味着无论你在哪个目录，该命令都会执行。现在输入以下命令：


    ```bash

    cd httpd

    ```


    目录将切换到 `httpd`，但相对于 `/home` 目录。因此完整的工作目录将是 `/home/httpd`。现在输入以下命令：在案例中，我们将从 `/home/httpd`
    移动到 `/home` 目录。输入以下命令：


    ```bash

    cd ~

    ```

    '
- fmt: '

    This command changes the user’s home directory `/home/(username)`. The `username`
    will be the name you have used on the computer. The symbol `~` is called the tilde
    and it is used in Linux to represent-present the user’s home directory.


    ## Copying Files


    The command `cp`, which stands for “copy files,” is used for copying files. Note
    that the file is not deleted from its initial location and a duplicate of the
    same is made at the specified location. Type the following command:


    ```bash

    cp first me

    ```


    The command above will duplicate the file `first` at the same directory but with
    a new name, that is `me`. If the file `me` exists in the directory, it will be
    overwritten and you will not be warned before this command is executed. Consider
    the command below:


    ```bash

    cp –i first me

    ```


    Notice that we have added the `-i` option in the above command. If the file `me`
    exists in the directory, you will be notified before it is overwritten. Next,
    try the following command:


    ```bash

    cp –i /d/file

    ```


    The file `/d/file` will be copied into the same current directory and then named
    `file` with the above command. Note that we have used the `-i` option so if it
    already exists, we will be notified before it is overwritten.


    You might also need to copy all the files in a particular directory to another.
    This can be achieved as follows:


    ```bash

    cp -dpr sourcedirectory destinationdirectory

    ```


    All the files in the `sourcedirectory` directory will be copied to the `destinationdirectory`
    directory. Notice that we have used the option `-dpr`. This means the following:


    - `-d` – means that links will be preserved

    - `-p` – file attributes will be preserved

    - `-r` – copying will be done recursively


    It is good to specify those options if needed while copying all the files from
    a directory, otherwise, the default settings will be applied, which might produce
    an unwanted result.


    To show the amount of space on a disk used on each mounted file system, use the
    command `df`.


    ## Less Command


    The `less` command is the same as the `more` command. The difference comes in
    that the user can page up or down through the file with this command. Consider
    the example below:


    ```bash

    less first

    ```


    The above command will display the contents of the file `first`.


    ## Ln Command


    This command creates a symbolic link to a certain file. Write and run the following
    command:


    ```bash

    ln –s first slink

    ```


    The command above will create a symbolic link named `slink` to link to the file
    `first`. For example, the command `ls –i first slink` will show that the two files
    are different and have different “inodes.”


    ## Locate Command


    This is used for searching in the database. Run the following command:


    ```bash

    slocate –u

    ```


    A database named `slocate` will be created. Before you can search for a file,
    this command must be run first. However, `cron` will run this command on a periodical
    basis on most systems. Again, run the following command:


    ```bash

    locate whois

    ```


    This command will look for files in your system whose name contains the string
    “whois.”


    ## Logout Command


    The command is used to log out the user who is currently logged into the system.
    Just go to the terminal and type this command:


    ```bash

    logout

    ```


    You will then be logged out and returned to the login screen.


    ## Ls Command


    `ls` stands for list. It is used for listing files in a directory. However, it
    comes with many options that need to be known as well, otherwise, you will become
    confused. If you need to list all the files in the current directory except for
    those starting with “.” then just type in the command:


    ```bash

    ls

    ```


    Note that only the file names will be listed. You might need to show more details
    about the files in the directory such as the ownership permissions, their size,
    time and date stamp, etc. This can be achieved with the following command:


    ```bash

    ls –al

    ```


    ## More Command


    Send contents of a file one page at a time to the screen. It can also work on
    piped output. Let us list the contents of the file `/etc/profile` to the screen.
    This is an in-built file, meaning that it comes with the operating system and
    it contains the profiles for the users of the system:


    ```bash

    more /etc/profile

    ```


    Note that the contents of the file will be displayed one page at a time. This
    is because the content is too big to be displayed on a single page. Consider the
    command below:


    ```bash

    ls –al | more

    ```


    The command will list all files in the directory and output will be piped through
    `more`. If the output from the directory can’t fit on one page, it will be listed
    on an additional page.


    ## Mv Command


    This command stands for “move” and is used for renaming or moving files. Consider
    the command below:


    ```bash

    mv –i first first2

    ```


    The file will be moved from `first` to `first2`, meaning it will be renamed `firts2`
    rather than `first`.


    ```bash

    mv /d/first

    ```


    The above command will move the file `first` from the directory `/d` to the current
    working directory. So now you have seen how the `mv` command is a powerful tool.


    Now that we have been talking of working directories, what are they exactly? And
    how can we know in which directory they currently are? Just type the command:


    ```bash

    pwd

    ```


    After pressing the Enter key, you notice that the output is a directory. This
    shows the directory which you are currently in. The abbreviation `pwd` stands
    for “print working directory” and shows the current working directory.


    ## Shutdown Command


    This command is used for shutting down the system. The purpose of this command
    is to halt the current process and shut down the system immediately. To do this,
    use the following code:


    ```bash

    shut down –h now –

    ```


    The next command is used to reboot the system, meaning that it will immediately
    shut down and then restart the system. To do this, use the command below:


    ```bash

    shut down –r now-

    ```


    ## Whereis Command


    This command is used for showing the manual, source, and binary files for a command.
    Consider the command below:


    ```bash

    whereis ls

    ```


    This command will show the manual and binary files for the command `ls`.


    Above is the list of commands that have been run on my system. You can try on
    your system and observe the output.


    ## Sudo Command


    This stands for “superuser do.” It has the purpose of allowing a permitted user
    to execute commands as a “superuser.” This is usually defined in the `sudo`-er’s
    list. It is important to ensure security by ensuring that the correct people only
    execute sensitive commands. Another command, the `su` command, enables you to
    log in to the system as a superuser. The purpose of `sudo` is to borrow privileges
    from the superuser. This explains the difference between these two commands, the
    `su` and `sudo` commands. The `sudo` command is normally used in commands that
    will change the system, such as when updating or upgrading the OS. This shows
    how secure the command is compared to the `su` command.


    ## Mkdir Command


    This command stands for “make directory.” It creates a new directory and names
    its path. If this path already exists, an error saying that the folder cannot
    be created will be outputted.


    ```bash

    mkdir m

    ```


    I have made a directory named `m`. Once I list the available directories after
    creating the directory, I find that it has been created. Notice that I have run
    the command as `sudo`. Without this, the command won’t run. This is for security
    purposes. Once you use the `sudo` command for the first time, you will be prompted
    to provide the superuser’s password. It is good to note that you can only create
    a directory inside a folder and you must have a “write permission” on that folder.


    Otherwise, you will be unable to do so.


    ## Uname Command


    It stands for “Unix name.” With this command, you can get detailed information
    about the operating system, kernel, and machine. Information about the OS, the
    kernel, and the machine have been shown:


    - Ubuntu – the name of the kernel of the machine

    - SMP – the machine’s node name

    - I686 – processor configuration

    - GNU/Linux – the name of the operating system


    You can see how the command gives detailed information.


    ## Touch Command

