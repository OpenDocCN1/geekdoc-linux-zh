    此命令更改用户的家目录 `/home/(username)`。`username` 将是你在计算机上使用的名称。符号 `~` 被称为波浪号（tilde），它在
    Linux 中用于表示用户的家目录。


    ## 复制文件 (Copying Files)


    `cp` 命令代表“copy files”，用于复制文件。请注意，文件不会从其初始位置删除，而是在指定位置创建一个相同文件的副本。输入以下命令：


    ```bash

    cp first me

    ```


    上述命令将在相同目录下复制文件 `first`，但将其重命名为新名称，即 `me`。如果目录中存在文件 `me`，它将被覆盖，且在执行此命令之前你不会收到任何警告。请考虑以下命令：


    ```bash

    cp –i first me

    ```


    注意我们在上面的命令中添加了 `-i` 选项。如果目录中存在文件 `me`，在覆盖它之前你将收到通知。接下来，尝试以下命令：


    ```bash

    cp –i /d/file

    ```


    通过上述命令，文件 `/d/file` 将复制到当前相同目录并命名为 `file`。注意我们使用了 `-i` 选项，因此如果它已存在，在覆盖它之前我们将收到通知。


    你可能还需要将特定目录中的所有文件复制到另一个目录。可以通过以下方式实现：


    ```bash

    cp -dpr sourcedirectory destinationdirectory

    ```


    `sourcedirectory` 目录中的所有文件将被复制到 `destinationdirectory` 目录。注意我们使用了 `-dpr` 选项。这意味着：


    - `-d` – 表示将保留链接

    - `-p` – 将保留文件属性

    - `-r` – 将进行递归复制


    在从目录复制所有文件时，如有需要指定这些选项是好的，否则将应用默认设置，这可能会产生不符合预期的结果。


    要显示每个挂载文件系统占用的磁盘空间，请使用 `df` 命令。


    ## Less 命令 (Less Command)


    `less` 命令与 `more` 命令相同。区别在于用户可以使用此命令向上或向下翻页文件。考虑下面的示例：


    ```bash

    less first

    ```


    上述命令将显示文件 `first` 的内容。


    ## Ln 命令 (Ln Command)


    此命令创建一个特定文件的符号链接。编写并运行以下命令：


    ```bash

    ln –s first slink

    ```


    上述命令将创建一个名为 `slink` 的符号链接，链接到文件 `first`。例如，命令 `ls –i first slink` 将显示这两个文件是不同的，具有不同的“节点（inodes）”。


    ## Locate 命令 (Locate Command)


    这用于在数据库中搜索。运行以下命令：


    ```bash

    slocate –u

    ```


    将创建一个名为 `slocate` 的数据库。在搜索文件之前，必须先运行此命令。然而，在大多数系统中，`cron` 会周期性地运行此命令。再次运行以下命令：


    ```bash

    locate whois

    ```


    此命令将在你的系统中查找名称包含字符串“whois”的文件。


    ## 退出命令 (Logout Command)


    该命令用于注销当前登录到系统的用户。只需进入终端并输入此命令：


    ```bash

    logout

    ```


    你将被注销并返回到登录屏幕。


    ## Ls 命令 (Ls Command)


    `ls` 代表 list（列出）。它用于列出目录中的文件。然而，它带有许多也需要了解的选项，否则你会感到困惑。如果你需要列出当前目录中所有非“.”开头的文件，只需输入命令：


    ```bash

    ls

    ```


    注意，只会列出文件名。你可能需要显示目录中文件的更多详细信息，例如所有权权限、大小、时间和日期戳等。可以通过以下命令实现：


    ```bash

    ls –al

    ```


    ## More 命令 (More Command)


    一次向屏幕发送文件的一页内容。它也可以作用于管道输出。让我们将 `/etc/profile` 文件的内容显示在屏幕上。这是一个内置文件，意味着它随操作系统一起提供并包含了系统用户的配置：


    ```bash

    more /etc/profile

    ```


    注意，文件内容将一次显示一页。这是因为内容太大，无法在一个页面上显示。考虑下面的命令：


    ```bash

    ls –al | more

    ```


    该命令将列出目录中的所有文件，并将输出通过管道交给 `more`。如果目录的输出无法在一页内，它将列在额外的页面上。


    ## Mv 命令 (Mv Command)


    此命令代表“move”（移动），用于重命名或移动文件。考虑下面的命令：


    ```bash

    mv –i first first2

    ```


    文件将从 `first` 移动到 `first2`，这意味着它将被重命名为 `first2` 而不是 `first`。


    ```bash

    mv /d/first

    ```


    上述命令将文件 `first` 从目录 `/d` 移动到当前工作目录。现在你已经看到 `mv` 命令是一个强大的工具了。


    既然我们一直在谈论工作目录，它们究竟是什么？我们该如何知道它们当前位于哪个目录呢？只需输入命令：


    ```bash

    pwd

    ```


    按下回车键后，你会发现输出是一个目录。这显示了你所在的目录。


    ## 关命令 (Shutdown Command)


    此命令用于关闭系统。该命令的目的是立即停止系统。要执行此操作，请使用命令：


    ```bash

    shutdown –h now

    ```


    下一个命令用于重启系统。要执行此操作，请使用命令：


    ```bash

    shutdown –r now

    ```


    ## Whereis 命令 (Whereis Command)


    这用于在数据库中搜索。考虑下面的命令：


    ```bash

    whereis ls

    ```


    此命令将显示 `ls` 的手册、源和二进制文件。上述是在我的系统中运行的命令列表。


    ## Sudo 命令 (Sudo Command)


    它代表“superuser do”（超级用户执行）。它的目的是允许许可的用户以超级用户的身份执行命令。这通常定义在 `sudoers` 列表中。为了确保只有正确的人执行敏感命令。另一个命令
    `su` 允许你以超级用户身份登录系统。`sudo` 的目的是借用超级用户的权限。这解释了这两个命令 `su` 和 `sudo`。`sudo` 命令通常用于更改系统的命令，例如更新或升级操作系统。


    ## Mkdir 命令 (Mkdir Command)


    此命令代表“make directory”（创建目录）。它创建一个新目录并命名其路径。如果该路径已存在，将输出无法创建目录。


    ```bash

    mkdir m

    ```


    我创建了一个名为 `m` 的目录。创建目录后列出可用目录，发现它已创建。注意我使用了 `sudo` 运行命令。没有它，命令将无法运行。这是出于考虑。当你第一次使用
    `sudo` 命令时，系统会提示提供超级用户密码。最好注意，你可以在文件夹内创建目录，并且必须对该文件夹拥有“写权限”。


    否则，你无法这样做。


    ## Touch 命令 (Touch Command)


    '
- fmt: '

    This command is used to create a file only if it does not exist. It stands for
    Update the access and modification times of each file to the current time. If
    the file already exists, its timestamp will be changed but its contents will remain
    the same. It is possible to use the command to create a file with a “write permission”
    if the file does not exist. To create a file named ‘touchfile:


    ```bash

    touch touchfile

    ```


    If the file does not exist in the directory, it will be created.


    ## `Cal` Command


    It can be used to display the month of the current date or the month of a past
    or advancing year.


    ## `Date` Command


    Used for displaying both the current date and time on the terminal as shown below:


    If the current date of your system is wrong, you can set it to the correct date
    and time as follows:


    ```bash

    Date –set=''21 march 2015 18:50’

    ```


    We have set both the date and the time in the above command.


