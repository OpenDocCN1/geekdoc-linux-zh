    # 管理组


    在 Linux 中管理组可以方便管理员将容器内的用户组合在一起，并应用适用于所有组员的权限集。例如，`Accounting`（会计部）中的所有用户可能需要访问相同的文件。因此，我们创建一个会计组，并将
    `Accounting` 用户添加其中。


    在大多数情况下，任何需要特殊权限的操作都应该在组中完成。这种方法通常比对单个用户应用特殊权限要节省时间。例如，Sally 负责报告，只有 Sally 需要访问某些文件来制作报告。但是，如果
    Sally 某天生病了，由 Bob 来做报告呢？或者报告需求增加了呢？当创建一个组时，管理员只需要操作一次。添加用户的操作可以根据需求的变化或扩展随时进行。


    以下是用于管理组的一些常用命令：


    * `chgrp`

    * `groupadd`

    * `groups`

    * `usermod`


    `chgrp`: 更改文件或目录的组所有。


    让我们为会计组的人创建一个目录来存储文件，并为文件创建目录。


    ```bash

    [root@localhost Downloads]# mkdir /home/accounting

    [root@localhost Downloads]# ls -ld /home/accounting

    ```


    接下来，将组所有交给会计组。


    ```bash

    [root@localhost Downloads]# chgrp -v accounting /home/accounting/

    changed group of ‘/home/accounting/’ from root to accounting

    [root@localhost Downloads]# ls -ld /home/accounting/

    drwxr-xr-x. 2 root accounting 6 Jan 13 10:18 /home/accounting/

    ```


    现在，会计组中的每个人都对 `/home/accounting` 读和执行权限。他们还需要写权限。


    ```bash

    [root@localhost Downloads]# chmod g+w /home/accounting/

    [root@localhost Downloads]# ls -ld /home/accounting/

    drwxrwxr-x. 2 root accounting 6 Jan 13 10:18 /home/accounting/

    ```


    由于会计组可能处理敏感文档，我们需要对其他人或其他世界应用一些限制性权限。


    ```bash

    [root@localhost Downloads]# chmod o-rx /home/accounting/

    [root@localhost Downloads]# ls -ld /home/accounting/

    drwxrwx—-. 2 root accounting 6 Jan 13 10:18 /home/accounting/

    ```


    ![Image](img/image00133.gif)


    让我们创建一个名为 `secret` 的组。我们将为组设置密码，允许用户使用已知密码将自己加入。


    ```bash

    [root@localhost]# groupadd secret

    [root@localhost]# gpasswd secret

    Changing the password for group secret:

    New Password:

    Re-enter new password:

    [root@localhost]# exit

    exit

    [centos@localhost ~]$ newgrp secret

    Password:

    [centos@localhost ~]$ groups

    secret wheel rdc

    ```


    在实践中，组密码并不常用。次组是非常好的工具，而且在其他用户之间共享密码并不是良好的安全实践。


    `groups` 命令用于显示用户属于哪些组。接下来，在我们对当前用户进行一些更改后将使用它。


    `usermod` 用于更新账户属性。


    以下是常用的 `usermod` 选项。


    ![Image](img/image00134.gif)


    ```bash

    [root@localhost]# groups centos

    centos : accounting secret

    [root@localhost]# usermod -a -G wheel centos

    [root@localhost]# groups centos

    centos : accounting wheel secret

    ```


    # 删除用户


    我们已经学习了如何创建用户，但如果用户太多了呢？如果有人决定离开，而他的凭据仍在系统中呢？你如何删除这些用户？


    同样，我们将采用图形用户界面（GUI）和命令行界面（LUI）方法。这样做是为了确保每个人都了解在这个迷人的 Linux 世界中事情是如何操作的。哪种最适合你，由你决定。


    首先，我们使用图形用户界面：


    1. 进入屏幕右上角的用户菜单。

    2. 点击 `Settings`（设置）。

    3. 选择 `Details`（详情）。

    4. 点击 `users`（用户）。

    5. 点击解锁按钮。

    6. 输入 root 密码。

    7. 使用名为“Remove user”（删除用户）的红色按钮。

    8. 决定你是想保留文件还是删除它们。


    完成后，点击相应的选项。这就搞了！


    当你删除用户时，可以删除用户设置，但如果你认为这些文件仍然有用，请确保保留由该用户创建的文件并确保其可访问。用户一旦被删除，将不再能够访问系统或其创建的文件。


    现在，让我们使用命令行界面（LUI）方法再看一遍。


    1. 打开终端。

    2. 输入：`sudo deluser (username)`。

    3. 按回车，就大搞定！


    # 修改用户密码


    这在图形界面上完成非常容易。要做到这一点，输入以下命令：


    ```bash

    sudo passwd (username)

    ```

