    **Manage Groups**


    Managing groups in Linux makes it convenient for an administrator to combine the
    users within containers applying permission-sets applicable to all group members.
    For example, all users in Accounting may need access to the same files. Thus,
    we make an accounting group, adding Accounting users.


    For the most part, anything requiring special permissions should be done in a
    group. This approach will usually save time over applying special permissions
    to just one user. For example, Sally is in charge of reports and only Sally needs
    access to certain files for reporting. However, what if Sally is sick one day
    and Bob does report? Or does the need for reporting grow? When a group is made,
    an Administrator only needs to do it once. The add users is applied as needs change
    or expand.


    Following are some common commands used for managing groups:


    *   chgrp


    *   groupadd


    *   groups


    *   usermod


    chgrp: Changes the group ownership for a file or directory.


    Let’s make a directory for people in the accounting group to store


    files and create directories for files.


    [root@localhost Downloads]# mkdir /home/accounting


    [root@localhost Downloads]# ls -ld /home/accounting


    [root@localhost Downloads]#


    Next, let’s give group ownership to the accounting group.


    [root@localhost Downloads]# chgrp -v accounting /home/ac


    counting/


    changed group of ‘/home/accounting/’ from root to accounting


    [root@localhost Downloads]# ls -ld /home/accounting/


    drwxr-xr-x. 2 root accounting 6 Jan 13 10:18 /home/accounting/


    [root@localhost Downloads]#


    Now, everyone in the accounting group has read and executed


    permissions to /home/accounting. They will need write permis


    sions as well.


    [root@localhost Downloads]# chmod g+w /home/accounting/


    [root@localhost Downloads]# ls -ld /home/accounting/


    drwxrwxr-x. 2 root accounting 6 Jan 13 10:18 /home/accounting/


    [root@localhost Downloads]#


    Since the accounting group may deal with sensitive documents,


    we need to apply some restrictive permissions for others or the


    world.


    [root@localhost Downloads]# chmod o-rx /home/accounting/


    [root@localhost Downloads]# ls -ld /home/accounting/


    drwxrwx—-. 2 root accounting 6 Jan 13 10:18 /home/accounting/


    p.


    ![Image](Images/image00133.gif)


    Let’s make a new group called secret. We will add a password to the group, allowing
    the users to add themselves with a known password.


    [root@localhost]# groupadd secret


    [root@localhost]# gpasswd secret


    Changing the password for group secret:


    New Password:


    Re-enter new password:


    [root@localhost]# exit


    exit


    [centos@localhost ~]$ newgrp secret


    Password:


    [centos@localhost ~]$ groups


    secret wheel rdc


    [centos@localhost ~]$


    In practice, passwords for groups are not used often. Secondary groups are excellent
    and sharing passwords amongst other users is not a great security practice.


    The groups command is used to show which group a user belongs to. Next, we will
    use this, after making some changes to our current user.


    usermod is used to update account attributes.


    Following are the common usermod switches.


    ![Image](Images/image00134.gif)


    [root@localhost]# groups centos


    centos : accounting secret


    [root@localhost]#


    [root@localhost]# usermod -a -G wheel centos


    [root@localhost]# groups centos


    centos : accounting wheel secret


    [root@localhost]#


    **Removing Users**


    We have learned how to create users, but what if there are just too many of them?
    What if someone has decided to leave and his or her credentials are still on the
    system? How do you remove those?


    Again, we will resort to both the GUI and the LUI methods. We do this to ensure
    everyone gets an idea of how things are done within the thrilling world of Linux.
    Whatever suits you best, later on, is yours to decide.


    First, we use the graphical user interface:


    1.  Go to the user menu on the top right side of the screen.


    2.  Click on Settings.


    3.  Select Details (the last option).


    4.  Click on users.


    5.  Click the unlock button.


    6.  Enter the root password.


    7.  Use the red button named “Remove user.”


    8.  Decide whether you would like to keep the files or delete them.


    Once done, click the appropriate choice. And that is it!


    When you delete a user, you can delete the user settings, but if you believe the
    files could still be useful, ensure that you keep the files created by this user
    saved and accessible. The user, once deleted, will no longer have access to the
    system or his or her created files.


    Now, let us take another look at this using the line user interface (LUI) method.


    1.  Open the terminal.


    2.  Type in: sudo deluser (username).


    3.  Hit Enter, and that is it!


    **Changing Passwords for Users**


    This is rather easily done on the graphical user interface. However, we will only
    be focusing on the terminal here and how we can use it to change the password.
    To do that, punch in the following command:


    sudo passwd (username)


    You can change any account’s password without logging into these as long as you
    are the super-user/root user.


    **Creating Groups**


    We initially touched upon the term “group” when we were doing the permissions.
    We did not dive deeper to know what exactly a group is. Let us shed some light
    on this now as it is relevant to both the topic at hand and to you, the Linux
    user.


    For every file or directory, permissions are set out for the owner, group, and
    others in that specific order.


    A group is literally where a few users are found. For example, you may have a
    file that is relevant to the IT group. This group will have users who have everything
    to do with IT. Instead of assigning permissions to read and write to individual
    users, you can simply create a group and add the relevant users to this group.
    Now, when you share your file with the group, everyone within it will have access.


    To create a new group, simply type in the following command:


    sudo groupadd (groupname)


    **Changing Permissions for Group**


    Now we have created a group, let us now share a file with it for ‘read’ and ‘write’
    accessibility. Don’t worry, all of these commands are already covered by us.


    touch file123


    mkdir test123


    mv file123 test123


    cd test123


    ls -l


    We started out with the “touch” command to create a file named “file123.” We followed
    by creating a directory using the make-directory (mkdir) command, and we named
    it “test123.” We then moved the file using the “mv” command into the directory
    we created. Lastly, we entered the newly created directory and used the listing
    command (long) to show us the permissions, owner, and group information.


    Yet again, the mighty terminal saves us time. Imagine doing that without the terminal.
    It would have taken a little longer to pull all that off. Anyways, enough with
    praising the terminal; let us move forward.


    As a test, let us wait here while you change the ownership to “group” to give
    them read and write permissions by using the “chown” commands. A tip: if it doesn’t
    go smoothly, use the sudo command!


    Is everything done? Bravo! You have just changed the ownership of the file and
    provided the group with the required permission.


    “But we don’t have a user added to the group yet.”


    Right you are! That is why our next step is to ensure we learn how to add users
    to our newly created group. For the sake of an example, let us call this group
    “learners.”


    Use the following command to add the user within this group:


    sudo adduser (username) learners'
