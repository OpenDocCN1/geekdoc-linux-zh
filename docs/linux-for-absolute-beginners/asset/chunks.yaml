    # 引言


    如果你在计算机技术领域花费了很长时间，你可能多次遇到过“Linux”这个名字。你可能听说过它是开源且可以免费下载，但这些信息并不能解释 Linux。


    ## 作为操作系统的 Linux


    Linux 仅仅是一个操作系统。“操作系统”可能是一个你经常使用的词，但大多数人并不理解什么是操作系统。


    你电脑上所有的软件和硬件都是通过操作系统运行的。这就是为什么如果你有一部 Android 手机，你就必须下载 Android 应用；如果你有一部 iPhone，你就必须下载
    Apple 应用。不同的操作系统对硬件和软件都有额外的要求，你必须遵守这些要求，电脑上的程序才能运行。大多数电脑都预装了操作系统，使用户户能够立即开始访问电脑的信息和功能。大多数其他电脑预装了
    `Windows` 操作系统。它们让你能够立即开始电脑。


    操作系统是一个允许你与计算机上的信息交互的接口。早期的操作系统使用命令行界面，这意味着用户必须输入代码来访问程序。最常见的是 `MS-DOS`，由微软于 1981
    年发布。如今的操作系统使用图形用户界面或 `GUI`。这意味着你可以直观地看到（如图像所示）想要访问的不同应用程序和程序。你只需要点击图标它们就会打开。不同的操作系统使用不同的
    `GUI`，因此从一个操作系统切换到另一个最初可能会导致困惑。外观和感受会有所不同，可能需要一些时间适应。


    操作系统必须不断更新，以跟上不断发展的软件和硬件改进。如果你尝试使用最新版本的 `Microsoft Word`（或其他任何程序）并发现它与你的电脑兼容，你可能经历过这种挫败感。问题不在于你的电脑发生了故障，而在于你的操作系统不够先进，无法处理最新版本的软件。更新操作系统可能会占用大量内存，因此拥有最新的系统可能意味着需要一台内存更大的电脑。你可能必须在购买新电脑和使用过时的操作系统之间做出选择。


    三个常用的操作系统是 `Windows`、`Mac` 和 `Linux`。Windows 是微软在 20 世纪 80 年代创建的，用于取代 `MS-DOS`。它友好得多，因为人们不再需要记住访问程序所需的各种代码。


    # 什么是 Linux？


    基于 `UNIX` 概念的操作系统内核被称为 Linux。这个名字源于其芬兰创造者的名字——`Linus Torvalds`，它基于与其他基于 `UNIX`
    的系统相同的技术（最后一个字母是 x）。Linux 现在由全球成千上万的人共同开发和维护。


    操作系统的内核是其跳动的心脏。它对于计算机硬件与你（用户）之间的通信至关重要。操作系统由几个软件组件组成，包括内核、许多工具和库。它是扩展你电脑核心操作系统（称为
    `BIOS`）的软件。


    ## 从 UNIX 到 Linux


    Linux 拥有悠久的历史，可以追溯到 20 世纪 90 年代。然而，为了理解 Linux 的起源，我们必须首先回顾二战后的计算机早期阶段。


    当时的计算设备占据了整栋建筑，从机械元件到电子元件（如微处理器和多层电路）的过渡正在进行中。


    此外，在整个 60 年代和 70 年代，硬件软件组件既昂贵又不标准。有各种特定特定的平台，每个平台都有自己的接口、数据传输和交换协议以及操作系统。这些单一计算设备之间的通信需要专业的知识和对协议的理解。UNIX
    的创建是为了克服这些障碍，并在范围内简化计算设备的使用。


    ### UNIX


    1965 年 1 月，多路信息处理服务（`Multics`）的工作开始。


    Multics 是由马诸理工学院（MIT）、通用电气（GE）和贝尔实验室/AT&T 合作开发的。他们开发的主要产品是 `Unics`，由 `Ken Thompson`
    和 `Dennis Ritchie` 领导。后来它更名为 `UNIX`。`UNIX` 操作系统在加州大学伯克分校被广泛使用。


    ### UNIX 变体


    `UNIX` 的概念被授权给几家公司，它们开发并维护各自的 UNIX 变体。这包括 `Solaris/SUN OS`（现由 Oracle 拥有的）、`AIX`（IBM）、`Scenix`（西门子）、`SCO
    UNIX`、`Xenix`（微软），以及 `HP-UX`（惠普）、`NeXTSTEP`、`Mac OS`（苹果）和 `Android`（谷歌）。


    开源实现包含了伯利系统发行（`BSD`）及其变体：`NetBSD`、`OpenBSD` 和 `FreeBSD`。今天，Linux 是开源开发者中最流行的免费软件。上述系统也有稳固的商业支持。


    ## UNIX 哲学


    UNIX 的设计考虑了几个严格的原则。这些原则涵盖了可移植性、多任务和多用户方向，并结合时间共享方法。此外，它基于遵循 `TCP/IP` 方案的网络连接。


    使用 `C` 语言进行初始开发实现了对硬件平台的独立。通过提供一系列开发工具和库，它允许你轻松地将其扩展到你的特定需求中。自动化支持复杂但易于维护的脚本的任务是简单而强大的。


    类似于工具箱，UNIX 由各种工具组成。每个工具都有特定的功能并设计用于实现该功能。其思想是每个任务使用一个设备。为了实现更复杂的目标，你将几个工具组合成链。下面的示例结合了
    `ls` 和 `wc` 两个命令，利用管道来统计当前目录下 Python 文件的数量。


    ```bash

    $ ls *.py | wc -l

    6

    $

    ```


    我们将在指南的后部分详细解释这些命令及其用法。


    ## Linux 简史


    与 UNIX 类似，Linux 操作系统有不同的根源，并基于相当多大师的工作。这包括 `Richard M. Stallman`、`Andrew S. Tanenbaum`
    和 `Linus Torvalds`。


    Richard M Stallman 是 MIT 的黑客和开发者，自由软件基金会（`FSF`）的首任，也是 `GNU` 项目之父。`GNU` 是口号 `GNU
    不是 UNIX` 的缩写。该项目的目的是提供一个免费的 UNIX 操作系统。直到 20 世纪 90 年代，一组工具可用，但内核仍然缺失。整个软件于 1983
    年左右根据 GNU 许可（`GPL`）发布。


