    # Modes of Vim


    Vim is not exactly a straightforward editor. The commands available in `Vim` aim
    at efficiency and speed and not exactly ease of remembrance. This is because `Vim`
    has many modes. This means that the function of keys and commands change based
    on the vim mode that is currently active.


    `Vim` has the following three modes.


    ## Function Mode


    - **Command mode:** In this mode, you can do file navigation, cut, copy and paste
    functions, and other simple commands. Commands like `undo` and `redo` can also
    be performed in this mode.

    - **Insert mode:** Normal text editing can be performed in this mode. In addition,
    there is a variation of insert mode known as replacing mode, in which you can
    replace text instead of inserting it.

    - **Ex mode:** Functions such as opening a file, saving it, or quitting `Vim`
    can be performed in this mode. It also supports a few other complex functions.
    For example, the output of programs can be inserted into the current file using
    this mode. `Vim` configurations can be done from this mode as well. Everything
    that one can perform in `ex` can be done in this mode of `Vim`.


    # Vim Workflow


    ## Editor Basics


    Irrespective of the editor being used, you should always be able to perform these
    primary tasks:


    1. Make changes to the file or add new text to a file

    2. Save the changes and exit


    ### Opening Files


    `Vim` allows you to open files easily on the command line by specifying the filename
    as an argument. For example, you may use the following command to open a file
    at `/var/log/maillog`, where `maillog` is the file.


    ```

    [root@server~]# vim /var/log/maillog

    ```


    Note: If the file specified as an argument does not exist, but the directory is
    valid, `Vim` will create a new file with the filename specified and inform you
    that you are editing a new file.


    `Vim` will open in the command mode by default. The filename, amount of characters,
    number of lines, and other details about the open file are displayed in the bottom
    left corner of the screen. It also displays information about the part of the
    file being shown, such as `All` for all, `Top` for the lines at the top, `Bot`
    for the last lines of the file, or a percentage that shows what part of the file
    you are at. The last line is called the `ruler` in `Vim` terminology.


    ### Editing Text


    If you have already used `vi` or `Vim`, you will know that keys do not work the
    way they should when you are in command mode. This is because command mode is
    not used to insert text but rather to perform functions based on the characters
    you type, such as copy and paste or cursor movements.


    You can switch to insert mode by using a set of commands that correspond to different
    functions. Let’s go through them one by one.


    The key and result for the same in as mentioned:


    ![Image](Images/image00127.gif)


    You will know that you are in insert mode or replace mode by the indicator below,
    which shows —INSERT— or —REPLACE—


    You can use the `Esc` key on the keyboard to return to command mode.


    The version of `vi` or `Vim` that comes with Red Hat Enterprise Linux is preconfigured
    to identify normal movements of the cursor and even `PgUp` and `End` while you
    are in both command mode and insert mode. This is not the default setting for
    all variations of `vi` but is specific to Red Hat Enterprise Linux. Older versions
    of `vi` did not recognize these commands, and you could only move the cursor while
    in command mode using keyboard keys `h`, `j`, `k`, `l`.


    The following table lists down some common keys that can be used to move the cursor
    while you are in command mode.


    ![Image](Images/image00128.gif)


    Note: Pressing the `Esc` key on the keyboard will always cancel the current command
    or return you to the command mode of `Vim`. A good practice is to press the `Esc`
    key twice or more to make sure you have returned to the command mode.


    ### Saving Files


    The `Ex` mode is used to save files in `Vim`. To enter the `Ex` mode, you need
    to press the colon (`:`) key on the keyboard while you are in the command mode.
    So if you are in the insert mode, first press the `Esc` key to switch to command
    mode and then press the colon to enter the `Ex` mode. When you switch to the `Ex`
    mode, you will see the `:` symbol on the ruler, where you can proceed with typing
    a command. Once you are done typing a command, press `Enter` to complete the command.


    The following table gives a list of commands that will help you save your changes
    and quit `Vim` in the `Ex` mode.


    ![Image](Images/image00129.gif)


    ![Image](Images/image00130.gif)


    In the table above, `w` stands for write, implying saving changes, `q` stands
    for quit, and `!` indicates an action is to be forced.


    ### Getting Help in Vim


    There is extensive online help for `Vim`, which is available through the editor
    itself. You can switch to command mode and type `: help`, and the help screen
    will be launched with the help needed to navigate through the help document. You
    can find help for a specific subject or topic by typing `: help subject` from
    the command mode.


    The help screen will open in a new split window. You can close the help screen
    by typing `:q`. To get help with split windows, you can type `: help windows`.


    A semi-interactive tutor is also available. While in the command mode, you can
    type the command `vimtutor`. This will launch a guided tour of `Vim`, and a new
    user can learn the basics almost within an hour.


    ## Movement in Vim


    Most editors have navigation support with the limitation that you can move through
    a single character or single line. Additionally, there are some advanced commands
    in `Vim`, which will help you navigate through a document more efficiently. These
    command shortcuts only available in the command mode.


    ![Image](Images/image00131.gif)


    # Users and Permissions


    When discussing user management, we have three important terms to understand:


    - Users

    - Groups

    - Permissions


    Interactive accounts: Usually assigned to a user for accessing resources. The
    main difference between the two user types is:


    - Daemons use system accounts to access files and directories. These will usually
    be disallowed from interactive login via shell or physical console login.

    - End-users use interactive reports accessing resources from either shell or physical
    console login.


    With this basic understanding of users, let’s now create a new user for Bob Jones
    in the Accounting Department. A new user is added with the `adduser` command.


    Following are some `adduser` switches:


    ![Image](Images/image00132.gif)


    When creating a new user, use the `-c`, `-m`, `-g`, `-n` switches as follows:


    ```

    [root@localhost Downloads]# useradd -c “Bob Jones Accounting Dept Manager.”-m
    -g accounting -n bjones

    ```


    Now let’ see if our new user has been created:


    ```

    [root@localhost Downloads]# id bjones

    (bjones) gid = 1001(accounting) groups = 1001(accounting)

    ```


    ```

    [root@localhost Downloads]# grep bjones /etc/passwd

    [root@localhost Downloads]# passwd bjones

    Changing password for user bjones.

    New password:

    Retype new password:

    passwd: all authentication tokens updated successfully.

    ```


    The user account is not enabled, allowing the user to log into the system.


    ### Disabling User Accounts


    There are several methods to disable accounts on a system. These range from editing
    the `/etc/passwd` file by hand. Or even using the `passwd` command with the `-l`
    switch. However, both of these methods have one big drawback: if the user has
    ssh access and uses an RSA key for authentication, they can still log in using
    this method.


    Also, it may be good to note on the account why we disabled it.


    ```

    [root@localhost Downloads]# chage -E 2005-10-01 bjones

    ```

