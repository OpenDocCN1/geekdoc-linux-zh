    - `>` creates a new file containing the standard output. If the specified file
    already exists, it will be overwritten. For example, if the command `ls > contents.txt`
    is executed, the output of the `ls` command will be saved to the `contents.txt`
    file and nothing would be displayed on the screen.

    - `>>` appends the standard output to an existing file. Just like the command
    above, we could redirect the output of the `ls` command to the file `contents.txt`,
    but instead of overwriting the file, we would simply add our output to the end
    of the current file.

    - `2>` creates a new file that will have the standard error redirected to the
    file. If the file already exists, its contents will be overwritten.

    - `2>>` appends the standard error to an existing file. If the file doesn’t exist,
    a new one is created. If it does exist, the standard error output will simply
    be added to the end of the file.

    - `&>` creates a new file that contains both the standard output and standard
    error output. If the file already exists, its contents will be overwritten.


    There are also several redirection operators available to more fully control where
    information is input from in the shell.


    - `<` sends the contents of the specified file to the command in place of the
    standard input. For example, if I had a text file called `input.txt` that contained
    a single line of text that said `b??l` and entered the command `ls < input.txt`,
    the output would be equivalent to entering `ls b??l` at the command prompt.

    - `<<` enters a sort of interactive mode, where the following lines entered will
    be redirected to standard input. This will allow you to enter new information
    and redirect it to the same command, one line at a time.

    - `<>` specifies that a file will be used for both the standard input and standard
    output.


    Now, while some of these, like the `<>` option, may seem like something you would
    never use, remember that Linux treats every device as a file that is mounted somewhere
    within its filesystem. So, an option like `<>` may be useful when reading or writing
    to an external hard disk, sending or receiving data to/from a sound card, or other
    such cases.


    As a normal user, you likely won’t use `<>` very often, but if you go on to become
    a Linux developer, then it may become more useful to you at that time.


    Let’s put these concepts into practice using the `grep` command. For example,
    if a system administrator on the root account wanted to search for data about
    a particular user (Jason) within every configuration file in the `/etc` directory,
    they may do so quite simply by typing `grep Jason /etc/*`. Running the command
    without redirection, though, the output of the `grep` search would simply be displayed
    to the screen and not stored for future reference. Also, since our system administrator
    was executing the command as the root user, `grep` is likely to return a long
    series of outputs to the screen, making it long and difficult to read.


    Therefore, the system administrator should instead employ redirection. To accomplish
    this, the system administrator should use a redirection operator and specify the
    filename where the data will be redirected into and stored. For example, entering
    `grep Jason /etc/* > Jason.txt` would send the output of the `grep` search to
    the `Jason.txt` file in the present working directory.


    Another reason for using redirection is to change where the standard error is
    sent. For example, if the system administrator entered `grep Jason /etc/*` as
    a normal user instead of as a root user, the files that contain the username will
    appear on the screen, but so will a lot of error messages. This is because a normal
    user lacks permission to read many of the files within the `/etc` directory. By
    default, the standard errors are also routed to the standard output (the screen).


    To remove all the errors so the system administrator won’t have to see them cluttering
    up the screen, they can be redirected to a special device that exists on every
    Linux system, known as `/dev/null`. This null device is essentially an area where
    we can send garbage for the operating system to delete.


    So, if the system administrator enters the command `grep Jason /etc/* 2> /dev/null`,
    then the `grep` command will search for the name Jason in every configuration
    file in the `/etc` folder, and redirect all of the errors messages to `/dev/null`
    so they are never displayed on the screen and are simply discarded.


    ## Regular Expressions


    While entering a search term like a username is useful, the real power of `grep`
    comes from combining it with regular expressions, also known as `REGEX`. Regular
    expressions are a way to describe patterns that a user might want to look for
    within a given data file or files. Many Linux programs allow for regular expressions,
    and this provides the user with the tools for expressing patterns within text.
    Similar in principle to wildcards, regular expressions can specify multiple filenames
    or other text-based content.


    Regular expressions are divided into two types: basic and extended. Which regular
    expression form is assumed will depend upon the program that is being executed.
    Some programs accept just one expression form, while others can use both types.


    The simplest type of `REGEX` is an alphabetic or alphanumeric string, such as
    `HWaddr` or `Linux`. These regular expressions match any string of the same size
    or longer that contains the regular expression. For instance, the `HWaddr` regular
    expression matches the following three phrases that might appear within a file
    being searched: “Hwaddr,” “This is the HWaddr,” and “The HWaddr is unknown.” But
    it’s when a user inserts special characters that can signify patterns that regular
    expressions really shine.


    Bracket expressions are commonly used when conducting searches in `grep` using
    `REGEX`. A bracket expression uses the square bracket characters (`[ ]` to constitute
    a wildcard search that selects any one of the characters within the bracket. For
    example, the regular expression of `b[aeiou]g` represents five words: bag, beg,
    beg, bog, and bug.


    A range expression also uses the square brackets, but, instead of listing every
    character within the brackets, it relies on using the starting and ending points
    of the range separated by a dash (–). Generally, using a range expression is easier
    than a normal bracket expression when searching for larger sets of data. Ranges
    can also be applied to alphabetic characters, like `[g–t]`, which would represent
    all the letters g, h, i, j, k, l, m, n, o, p, q, r, s, and t. Remember that since
    Linux is case sensitive, the ranges `[a–z]` and `[A–Z]` are considered two different
    sets of ranges.


    The single dot (`.`) is a wildcard that represents any single character except
    for the newline character, which is used when the return or Enter key is pressed
    on a keyboard. For example, if the user entered `b.g`, that would represent `bAg`,
    `bag`, `bBg`, `bbG`, `b2g`, and so on, where any letter, number, or character
    could be inserted between the b and g since the single dot can represent any character.


    ## Using Network to Transfer Files


    This might not be as hard as you might imagine. All it takes is a bit of practice
    and a little eye out for details.


    We have established an understanding of what a network is and how to identify
    machines that are connected to the said network. We use their IP addresses unless
    they have specific domain names, in which case we will use those instead. Now
    we wish to start moving data back and forth. We have quite a lot of files that
    need to be transferred and quite a few that we require from the remote servers
    or locations.


    We start things off by learning a simple command that allows us to copy a file
    from our local system to a remote system.


    If you recall, just moments ago, we mentioned you need to keep an eye out for
    details. See the colon (`:`) in the end? That is not a typographical error. That
    is done on purpose. If you do the command correctly, you will see a confirmation
    for that.

