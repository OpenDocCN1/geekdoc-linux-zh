    - `>` 创建一个包含标准输出的新文件。如果指定的文件已存在，它将被覆盖。例如，如果执行命令 `ls > contents.txt`，`ls` 命令的输出将保存到
    `contents.txt` 文件中，屏幕上将不会显示任何内容。

    - `>>` 将标准输出追加到现有文件中。与上面的命令类似，我们可以将 `ls` 命令的输出重定向到文件 `contents.txt`，但不是覆盖文件，而是简单地将我们的输出添加到当前文件的末尾。

    - `2>` 创建一个文件，将标准错误重定向到该文件。如果文件已存在，其内容将被覆盖。

    - `2>>` 将标准错误追加到现有文件中。如果文件不存在，则创建一个新文件。如果文件已存在，标准错误输出将简单地添加到文件的末尾。

    - `&>` 创建一个包含标准输出和标准错误输出的新文件。如果文件已存在，其内容将被覆盖。


    还有几种重定向操作符可用，以更完全地控制 shell 中从哪里输入信息。


    - `<` 将指定文件的内容发送给命令以代替标准输入。例如，如果我有一个名为 `input.txt` 的文本文件，其中包含一行文本 `b??l`，并输入命令
    `ls < input.txt`，输出将等同于在提示符处输入 `ls b??l`。

    - `<<` 进入一种交互模式，其中输入的后续行将被重定向到标准输入。这将允许你逐行输入新信息并将其重定向到同一个命令。

    - `<>` 指定一个文件将同时用于标准输入和标准输出。


    现在，虽然这些某些选项（如 `<>` 选项）看起来是你永远不会用到的东西，但请记住 Linux 将每个设备都视为挂载在其文件系统某个位置的文件。因此，像 `<>`
    这样的选项在读取或写入外部硬盘、向声卡发送或接收数据或其他类似情况下可能是很有用的。


    作为一个普通用户，你可能不会经常使用 `<>`，但如果你以后成为一名 Linux 开发人员，那么那时它对你来说可能会变得更有用。


    让我们使用 `grep` 命令将这些概念付诸实践。例如，如果根账户的系统管理员想要在 `/etc` 目录下的每一个配置文件搜索关于特定用户（Jason）的数据，他们只需简单地输入
    `grep Jason /etc/*` 即可。然而，在不使用重定向的情况下运行命令，`grep` 搜索的输出将仅仅显示在屏幕上，而不是存储供以后参考。此外，由于我们的系统管理员是以
    root 用户执行命令的，`grep` 可能会向屏幕返回长系列输出，使其变得很长且难以阅读。


    因此，系统管理员应该使用重定向。为了实现这一点，系统管理员应该使用重定向操作符，并指定重定向并存储数据的文件名。例如，输入 `grep Jason /etc/*
    > Jason.txt` 将 `grep` 搜索的输出发送到当前工作目录下的 `Jason.txt` 文件。


    使用重定向的另一个原因是更改标准错误的发送位置。例如，如果系统管理员以普通用户而不是 root 用户输入 `grep Jason /etc/*`，包含用户名的文件将出现在屏幕上，但也会出现大量的错误信息。这是因为普通用户没有权限读取
    `/etc` 目录中的许多文件。默认情况下，标准错误也会路由到标准输出（屏幕）。


    为了移除所有错误，以便系统管理员不必看到它们杂乱屏幕，他们可以将错误重定向到每个 Linux 系统上都存在的特殊设备，即 `/dev/null`。这个空设备本质上是一个我们可以发送垃圾数据让操作系统删除的区域。


    所以，如果系统管理员输入命令 `grep Jason /etc/* 2> /dev/null`，那么 `grep` 命令将在 `/etc` 文件夹中的每个配置文件中搜索名称
    Jason，并将所有错误信息重定向到 `/dev/null`，这样它们永远不会显示在屏幕上并被直接丢弃。


    ## 正则表达式


    虽然输入像用户名之类的搜索词是有用的，但 `grep` 的真正威力来自于与正则表达式（也称为 `REGEX`）结合。正则表达式是描述用户可能想在给定数据文件或文件中查找的模式的方法。许多
    Linux 程序都允许正则表达式，这为用户提供了在文本中表达模式的工具。正则表达式的原理与通配符类似，可以指定多个文件名或其他基于文本的内容。


    正则表达式分为两种类型：基础和扩展。假设哪种正则表达式形式取决于正在执行的程序。某些程序只接受一种表达式形式，而另一些程序可以使用两种类型。


    最简单的 `REGEX` 类型是字母或字母数字字符串，例如 `HWaddr` 或 `Linux`。这些正则表达式将匹配任何包含该正则表达式的相同长度或更长的字符串。例如，`HWaddr`
    正则表达式匹配搜索文件中可能出现的三个短语：“Hwaddr”、“This is the HWaddr” 和 “The HWaddr is unknown”。但当用户插入可以表示模式的特殊字符时，正则表达式才真正大放异彩。


    在 `grep` 中使用 `REGEX` 进行搜索时，通常使用括号表达式。括号表达式使用方括号字符（`[ ]`）构成通配符搜索，选择括号内的任意一个字符。例如，`b[aeiou]g`
    代表了五个单词：bag、beg、big、bog 和 bug。


    范围表达式也使用方括号，但不是列出括号内的每个字符，而是依赖于使用连接符（–）分隔起始和终点。在搜索较大数据集时，使用范围表达式比括号表达式更方便。范围也可以应用于字母，例如
    `[g–t]`，这将代表 g, h, i, j, k, l, m, n, o, p, q, r, s, t。记住 Linux 是区分大小写的，范围 `[a–z]`
    和 `[A–Z]` 被认为是不同的集合。


    点（`.`）是一个通配符，代表除换行符以外的任何字符，换行符是在按下键盘上的返回或 键时使用的。例如，如果用户输入 `b.g`，这将代表 `bAg`、`bag`、`bBg`、`bbG`、`b2g`
    等，在 b 和 g 之间可以插入任何字母、数字或字符。


    '
- fmt: '

    This is one of the most basic commands used in the world of Linux. While there
    are quite a few commands out there, which we will mention here for reference purposes,
    the `SCP` is rather easy to use and understand. Now let us try that the other
    around.


    Now, we used the same command but changed the order. Let us try to see what happened
    here by first understanding the syntax of this command.


    ```

    scp source_file destination_file

    ```


    As we see here, the source file this time was in the remote computer/server. We
    wanted a file named `sample4` to be copied securely into our system (destination
    file). After the colon, we specified the file we wanted and then used a period
    (`.`), which indicated a local machine — i.e., your machine. After you press `Enter`,
    you will have that file copied in your system.


    This will effectively rename the file to `sample5` and place it within the local
    “test” directory. You can specify a path, and the rest will be done for you.


    To get a full spectrum of the `SCP` command, have a look at the manual by using
    the `man` command.


    This command is good if you have a few files, but what if you wish to transfer
    a whole bunch of files or maybe the complete directory? For that, we use another
    command called the `sync` command.


    This command has multiple uses and can be used to move or copy (mirror) data and
    files across a single machine or the entire network. The command is terrific for
    backing up your data on remote machines or servers. To use the command, you need
    to follow the syntax below:


    ```

    rsync [options] source destination

    ```


    With over 50 options, you can easily and securely copy the entire directories
    or the content of the said directory across a single machine or the network itself.
    You might be asked for administrative permission to do that as this uses `SSH`
    to secure the entire connection and prevents anyone from “listening.” That is
    just another word to suggest someone is monitoring your activities.


    There are far too many tools and applications that have come forth in recent times.
    Whether you decide to use the `LUI` as a medium of data transfer or `GUI`, you
    have your options with you. Be sure that you always use reliable sources and monitor
    activities and connections regularly to ensure safety for your data and for the
    network itself.


    ## Network Applications


    There are quite a few commands and diagnostic tools that can help you out on your
    journey as a network specialist or even as a secure home user. Knowing these is
    essential and can protect you from quite a lot of suspicious connections and hackers.
    These tools will also allow you to indulge deeper and create a better understanding
    of how the network operates and how other devices act when they are a part of
    the network. For now, let us proceed in getting ourselves acquainted with some
    important tools.


    Let us clear the terminal by using the `clear` command and use an important command
    you should know as a part of your basic learning. It is called the `ifconfig`.


    Windows users who may have used a command on their command prompt called `ipconfig`
    would find this familiar.


    Go ahead and type in `ifconfig`. You will now be presented with quite a populated
    screen, full of information. This is your network information and shows exactly
    how the network is configured.


    Note: For users who may face errors, you might need to install `net-tools`. The
    command for that is `sudo apt install net-tools`.


    The information that you see here would allow you to take a closer look into what
    some of your network settings are. These will include your ethernet settings,
    your wireless settings, and information about your local host as well. Some of
    these are quite useful pieces of information and can come in handy should the
    situation call for it.


    Most of the information displayed is easy to understand, but if you find any of
    the terms or columns hard to read, you can always rely on the trusty old Ubuntu
    community to acquire further insights.


    Next stop, we will be looking at the command called the `tcpdump`. This is basically
    a packet sniffer—literally! It analyzes all the packets that come in or go out
    of your system. Why do we need this? We will learn that soon enough.


    For us to have this, go ahead and install `tcpdump` by typing in the following
    command:


    ```

    sudo apt-get install tcpdump

    ```


    Once installed, go ahead and run the tool by typing this (requires `sudo`):


    ```

    sudo tcpdump

    ```


    Don’t be alarmed if you are not getting anything as of yet. Just open a browser
    window and go to any website of your choice. As soon as you press `Enter` on the
    browser, switch your window and come back to the terminal. Your terminal screen
    will now start an endless process of sniffing all the packets that are leaving
    or entering your system. You will need to bring this to a halt by pressing `Ctrl+C`.


    The problem with this command is that it never ends if you have a few network-based
    activities running in the background. What you can do, however, is to limit the
    data sniffing. Suppose you only want to capture a set number of packets (let’s
    say 20), you can slightly change the command to do exactly that.


    ```

    sudo tcpdump -c 20

    ```


    The command will execute the moment you hit `Enter` and will capture the next
    20 packets sent out or received. We use the `tcpdump` command to find out where
    these packets are being sent to and where they are being received. In our example,
    you will notice that an outgoing packet will have your IP address, the domain,
    and the address, while the opposite will show accordingly.


    This command is essential to analyze data and can track down any unknown addresses
    where information might be leaking to or coming from. Such suspicious addresses
    or domains can then be clocked accordingly to ensure the safety of the system
    and the network itself. The command also allows you to see the packets that are
    being sent out and received by a specific interface that is connected to your
    network.


    Suppose you have a wireless router on your network and you wish to check the kind
    of activity that is taking place through it. You can do that simply by typing
    in the following command:


    ```

    sudo tcpdump -c (number of packets) -i (device name)

    ```


    This will start collecting results for the said device and capture the number
    of packets you have set—quite a sneaky way to check on what your co-workers or
    colleagues are doing.


    Similarly, you can also use the same command to check up on your ports or have
    the packets shown in ASCII format or even hex format. The application for this
    tool is vast. You can always check the manual of this tool by typing in `man tcpdump`
    to get the complete options you have available with this command.


    Before we go ahead and get into the basics of moving files and folders across
    the network, there is one more command you might find useful to determine who
    is connected to your network. It is called the `netstat` command, and it can provide
    you with a great helping hand to find out if someone is hidden yet connected to
    your network. To do this, type in the command in your terminal with the following
    option:


    ```

    netstat -nr

    ```


    Instead of showing domains, you will now be provided with the IP addresses and
    the IP routing table. You can also check the network interface statistics by using
    the command below:


    ```

    netstat -i

    ```


    This now shows us the usage of all of the devices. You can find out how many packets
    are being sent out or being received by individual devices.


    Lastly, you can find out what active sockets are being used currently by your
    network, and to do that, you need to use another `netstat` command with a `-ta`
    option. This will list out active sockets with their address (local and foreign),
    their state, and some other useful information. This kind of information can be
    vital for anyone who is looking after the security of the entire network.

    '
