    如果你切换到刚刚添加到组的用户名并尝试访问“file123”，你也将能够毫无问题地访问它。发生这种现象的原因是，我们允许整个组对该文件拥有所有权，并拥有查看和编辑它们的必要权限。现在，由于你的新用户是该组的一部分，该用户也将拥有类似的访问权限。


    要验证这一点，请使用不带 `sudo` 的 `Nano` 命令，你现在应该能够随心所欲地写入编辑文件。


    这种现象在大型机构和行业中非常普遍，在这些地方，成千上万的员工和经理被添加到组中，并对用于特定用途的文件和目录拥有统一访问权限。


    我们之后还会介绍其他命令和示例。现在，让我们深入探讨系统配置——它是什么、我们为什么需要配置系统，以及它能为我们提供什么。这些都是你应该能够在初级水平上回答的问题。对于系统及其配置的高级用法，你可以参考优秀的书籍并浏览
    Ask Ubuntu 社区以获取进一步指导。


    ## Linux 与主流操作系统及 Linux 版本的对比


    ### Linux 操作系统 vs Windows 操作系统


    #### 用户

    Linux 上有三种用户（普通用户、管理员 (root) 和服务用户），而 Windows 有四种用户账户类型（管理员、标准用户、儿童和访客）。


    #### 使用

    根据市场研究数据，全球 92.63% 的 PC 运行着 Windows，而至少有 1% 的 PC 用户在使用 Linux。许多用户表示，与 Windows
    相比 Linux 很难使用，因此对 Linux 的抱怨限于家庭使用。它旨在作为服务器程序深度使用。因此，无论是否有 GUI，组织服务器都运行在 Linux
    上。


    此外，得益于与微软的许可协议，各种 PC 厂商都有权将 Windows 操作系统集成到他们的 PC 中，使 Windows 比 Linux 更获得市场普及。尽管
    Dell 和 HP 等许多 PC 厂商开始提供 Linux 作为预装操作系统，但 Windows 仍然主导市场。


    #### 内核

    Linux 使用单内核，空间利用更高效；而 Windows 使用微内核，占用空间比 Linux 小，但降低了系统效率。


    #### 文件程序

    在 Microsoft Windows 中，文件存储在不同数据驱动器（如 C: D: E:）的目录/文件夹中；但在 Linux 上，以根目录为开头的树形结构中的一级文件是导出，不包含其他子记录。


    在 Linux 操作系统中，一切都被视为文件。引用是文件、文件内容，以及外部连接设备（如打印机、鼠标、键盘）也是文件。


    #### 安全

    每个 Windows 用户都时不时遇到安全和稳定性问题。由于 Microsoft Windows 是最常用的操作系统，黑客和垃圾邮件频繁针对 Windows。Windows（消费型）最初设计用于在没有网络连接的单用户
    PC 上轻松使用，且没有内置安全功能。微软经常通过其 Windows 更新服务修复安全漏洞。这每月发布一次，即使在定期或需要提供关键更新时也是如此。


    大多数时候，Windows OS 用户会遇到“蓝屏”（BLUE SCREEN OF DEATH）。这是由于系统无响应。最后，用户必须放下顾虑并手动重启 PC。


    另一方面，Linux 基于多用户构建，使其比像 Windows 这样的单用户操作系统更稳定。此外，由于公众在全球范围内开发者的标准监控下运行 Linux，任何新提出的问题都可以在几小时内解决，所需的资源池可以准备好交付。


    #### 兼容性

    Windows 胜。Windows 的得分更高。当雷德蒙提供的方案让 Linux 黯然失色。尽管近期 Linux 有软件开发或安装，Windows 仍然是协作的主宰。


    Windows 用户可以确定，几乎任何软件（即使是最冷门、过时的）都能运行，或被开发者放弃。这是因为 Windows 拥有良好的资产支持。简单明了。


    相反，Linux 在 Windows 用户认为所当然的基础设施方面存在问题。


    #### 易用性

    近年来，Linux 在可用性方面走得太远且有所局限。发行版（如 Linux Mint 和 Ubuntu）甚至让安装和设置变得更容易，以便非技术用户更轻松地进行日常操作。


    由于市场份额的不断增长，Windows 是大多数设备的默认操作系统。购买新的笔记本电脑或 PC，当然会带有预装的 Windows 10。遗憾的是，用户多年来习惯了点击工具栏并打开喜爱的程序，这使得这种改变变得非常困难。


    #### 隐私

    如果你是 Linux 用户，你拥有一个不会测试你的操作系统。拥有 Linux 意味着程序由你所有。你还可以补充一点，大多数 Linux 程序都内置了加密选项。作为用户，你可以确保设备被盗不会给你的数据造成真实问题。


    相反，Windows 在过去几年中受到了大量的广告。用户获得了选择退出的机会，而智能注册黑客是雷德蒙计划的一部分。Windows 可以监控用户活动，提供与
    Microsoft OneDrive 服务同步，或学习如何改进 Cortana（微软助手）。老实说，我不喜欢这些工具，因为它们太具有干扰性。或者，有些用户喜欢这些功能。这是一种谦逊的。


    #### 源代码

    Linux 是一个活跃的操作系统，而 Windows OS 是商业可行的。Linux 可以访问源代码并根据用户请求修改代码，而 Windows 无法访问源代码。


    在 Linux 中，用户可以访问内核源代码并根据需要更改代码。它有优势。OS 中的漏洞将尽快修复，如果有，开发者可以修复任何缺陷。


    在 Windows 中，只有成员可以访问源代码。


    #### 许可

    在大多数提供中，Linux 内核（以及 GNU 资源和相关库）是免费且开源的。公司为其发行版提供付费支持，但生成的软件仍可下载和安装。


    ## Linux 与 Mac 的对比


    尽管 Linux 和 Mac 都是计算机硬件应用，但 Linux 是可以在任何设备上使用的操作系统。Mac 是只能在 Mac 设备上使用的操作系统。Linux
    作为应用程序、运行其他程序的平台以及服务器单元。同时，Mac 是一个允许其他操作系统在其运行的操作系统。


    ### Mac OS X vs. Linux：硬件支持

    Linux 和 Mac OS 这两个系统在这一领域都表现出色。然而，由于 Mac OS 仅在 Apple 制作硬件上运行，它提供了稳健且集成良好的软件组合，以提供最高性能。


    对于 Linux，它有各种驱动支持软件。那时或以前，这是 Linux 可以提供的问题；不，我应该说；硬件制造商没有为其硬件的 Linux 系统提供驱动支持。但现在时机已经改变。Linux
    是桌面和服务器设备上最广泛使用的操作系统。因此，所有主要零售商在获得 Mac OS 或 Windows 等其他应用程序后，都会为 Linux 发行版提供兼容的硬件驱动。


    ### Linux vs. Mac：识别的用户群体

