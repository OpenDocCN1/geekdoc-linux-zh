    valid, Vim will create a new file with the filename specified and inform you that
    you are editing a new file.


    Vim will open in the command mode by default. The filename, amount of characters,
    number of lines, and other details about the open file are displayed in the bottom
    left corner of the screen. It also displays information about the part of the
    file being shown, such as All for all, Top for the lines at the top, Bot for the
    last lines of the file, or a percentage that shows what part of the file you are
    at. The last line is called the ruler in Vim terminology.


    **Editing Text**


