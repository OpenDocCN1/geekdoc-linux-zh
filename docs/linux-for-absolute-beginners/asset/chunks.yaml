    上述程序将显示最近的 100 次登录记录。还会显示登录和注销时间之间的差异。


    `last` 命令的其他选项包括：

    1. `-R`：这将抑制主机名的显示。

    2. `-a`：在最后一列显示主机名。

    3. `-d`：用于远程登录。Linux 存储 IP 地址并将其转换为主机名。

    4. `-F`：打印完整的登录和注销日期时间。

    5. `-i`：以数字形式显示远程主机的 IP 地址。

    6. `-w`：输出显示域名和全名。

    7. `-x`：显示关机条目以及级别变更。


    注意的是，`last` 命令会搜索 `/var/log/wtmp` 文件。该文件负责存储登录系统用户的用户名。该命令将显示自该文件创建以来的注销记录，因此你可以随时查阅此文件。如果你需要显示所有登录过系统的用户，请运行以下命令：`more`
    或 `less`。


    ```

    last | more or less

    ```


    上述命令再次搜索 `/var/log/wtmp` 以查找这些用户。由于输出内容可能过多，无法在一个屏幕显示，请使用 `more` 或 `less` 命令，以便输出一次显示一页。与其了解所有用户的登录和注销时间，你可能只对某个特定用户感兴趣。通过
