    mode (xterm, KDE console). Use the man command to learn more about each command,
    for example:


    man ls


    cd


    Allows you to change the current directory (travel through the file system) (navigate
    through the file system). It works with both absolute and relative paths. Let’s
    say you’re in your home directory and wish to access the tmp / subdirectory. To
    do so, type in the following relative path:


    cd tmp /


    To change to the / usr / bin directory, type (absolute path):


    cd / usr / bin /


    Some options for using the command are:


    cd ..


    Allows you to make the current parent directory (note the space between cd and
    ..).


    cd -


    With no parameters, the cd command returns the shell to the home directory.


    ls


    ls (list) lists the files in the current directory. Two main options: -a—view
    all files, including hidden, -l—display more detailed information.


    rm


    This command is used to delete files. Warning: deleting the file, you cannot restore
    it! Syntax: rm filename.


    This program has several parameters. The most frequently used ones are: -i—file
    deletion request, -r—recursive deletion (i.e., deletion, including subdirectories
    and hidden files). Example:


    rm -i ~ / html / *. html


    Removes all .html files in your html directory.


    mkdir, rmdir


    The mkdir command allows you to create a directory, while rmdir deletes a directory,
    provided it is empty. Syntax:


    mkdir dir_name


    rmdir dir_name


    The rmdir command is frequently superseded with the rm -rf command, which deletes
    directories even if they are not empty.


    less


    less allows you to page by page. Syntax:


    less filename


    grep


    This command allows you to search the file for a certain string of characters.
    Please keep in mind that grep searches use a regular expression, which means you
    can specify a template for searching a complete group of terms at once. Regular
    expressions allow you to create patterns that describe string classes such as
    “four digits in a row, surrounded by spaces” and “four digits in a row, surrounded
    by spaces.” Obviously, such an expression may be used to find all the years written
    in numbers in the text. Regular expressions have a wide range of search capabilities.
    You can get additional information about grep in the on-screen documentation (man
    grep). Syntax:


    grep search_file


    ps


    Shows a list of active processes. The process name is shown in the command column,
    and the PID (process identifier) is the process number (which is needed for activities
    with the process, such as sending signals with the kill command). Syntax:


    arguments ps


    Argument u provides extra information, while ax allows you to observe processes
    that are not yours.


    kill


    If the program stops responding or hangs, use this command to complete it. Syntax:


    kill PID_number


    The PID number refers to the process identification number. The ps command can
    be used to get the process number for each executable application. The kill command
    normally delivers a regular completion signal to the process, however, it may
    not function in some cases, in which case you must use kill -9 PID number. The
    system will immediately end the command in this scenario, with no chance of saving
    data (abnormal). The command kill -l can be used to get a list of the signals
    that the kill command can deliver to a process.


    # Command-Lines


    **The Bash Shell**


    The command-line utility available on Linux operating systems is known as BASH,
    which is short for Bourne-Again Shell. The command-line utility is basically an
    interface, which allows you to give instructions in text mode to the computer
    and its operating system. There are different types of shell interfaces that are
    available in the many Unix0-ike systems that have been developed over the years,
    but Red Hat Enterprise Linux 7 uses the bash shell. The bash shell is an evolved
    and improved version of the former popular shell known as Bourne Shell.


    The bash shell displays a string, which implies that it is waiting for a command
    to be input by the user. This string that you see is called the shell prompt.
    For a user that is not a root user, the shell prompt ends with a $ symbol.


    [student@desktop ~]$


    If the root user is logged into the system, the shell prompt ends with a # symbol.
    The change in this symbol quickly lets the user know if he is logged in as a root
    or a regular user so that mistakes and accidents can be avoided.


    [root@desktop ~]#'
