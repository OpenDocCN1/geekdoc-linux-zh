- fmt: "\nNote that you may have to unblock the `UNetbootin` application if you are\
    \ installing it on a non-Linux computer. Simply right-click on the `UNetbootin`\
    \ icon and select `Properties` and then simply hit the `Unblock` button.\n\nIf\
    \ you are installing `UNetbootin` on a Linux computer, you will also need to install\
    \ the `p7zip-full` package using the command line or the `Synaptic Package Manager`\
    \ guide.\n\nPlug in a USB memory stick with at least 2 GB storage capacity. Launch\
    \ the `UNetbootin` application. Use the `Select Distribution` plus `Select Version`\
    \ buttons to download the image file.\n\nIf the Linux distribution that you would\
    \ like to install is not listed on the `Select Distribution` and `Select Version`\
    \ `UNetbootin` menus, you will need to download the desired ISO file from the\
    \ internet. Then choose the ISO file that you downloaded by selecting `Diskimage`\
    \ and then click on the `[…]` button to select the ISO file.\n\nSelect the USB\
    \ stick that was just plugged into the computer with the `Drive:` selection menu.\
    \ Once all of the options have been selected, simply hit the `[OK]` button to\
    \ create the bootable USB stick. This could take about five minutes so don’t worry\
    \ if the process seems to be stopped.\n\n# Ubuntu First Approach\n\nUbuntu 16.04\
    \ is an LTS (Long Term Support) version of Ubuntu with a support duration of five\
    \ years. It will run on older computers with an `Intel Celeron` or `Core i3` processor\
    \ and needs little memory or hard drive space. It also helps to have an `SSD`\
    \ (Solid State Drive) in the computer because it is faster than a conventional\
    \ hard drive. For example, I have `Ubuntu Unity` running on an older `Dell E4200`\
    \ laptop I purchased on eBay for about $100, and it boots in 17 seconds.\n\nThe\
    \ `Unity` desktop has sparked a lot of debate, but I’m using it on numerous computers\
    \ and laptops and really like it.\n\nThis edition of the `Ubuntu User Manual`\
    \ covers Ubuntu 16.04, which will be the LTS version for five years. Which version\
    \ to install remains your decision? It is easy enough to try different versions\
    \ yourself.\n\nUbuntu will install and run on computers with one GB of memory\
    \ and eight GB of hard drive space. `Ubuntu Unity` has a unique user interface\
    \ system using the top panel and left sidebar launcher. Options to change the\
    \ launcher, wallpaper, and themes are available. The user may also add or remove\
    \ Linux applications as desired.\n\nUbuntu uses the `Unity` desktop. `Unity` requires\
    \ more physical resources (memory and CPU) than some lighter-weight Linux desktop\
    \ software. Therefore, it may appeal to people who like Apple computers and casual\
    \ users. However, power users may not select the `Unity` user experience. There\
    \ are more technical discussions of `Unity` in Wikipedia and elsewhere. I am only\
    \ interested in how to use and customize Ubuntu.\n\n# Linux Boot\n\n## The BIOS\n\
    \n`BIOS` stands for Basic Input/Output System. It’s a particular type of firmware\
    \ used in the booting process, and it’s the first piece of software that is run\
    \ when a computer is powered. The `BIOS` is an independent operating system.\n\
    \nDepending on the hardware, the `BIOS` provides a list of boot devices such as\
    \ hard disks, DVD drives, USB devices, and others. But, again, the critical combination\
    \ necessary to accomplish this will differ depending on the hardware manufacturer.\n\
    \nThe `BIOS` will launch the boot loader after a bootable device has been discovered.\
    \ Although you may come across older Linux systems that use the `LILO` boot loader,\
    \ the `GRUB` boot loader is the most common.\n\nThe boot loader’s principal function\
    \ is to start the operating system in any event. You will typically see a message\
    \ or series of news from the boot loader, which will allow you to interrupt the\
    \ boot process and interact with the boot loader. For example, you can tell the\
    \ boot loader which operating system to execute if multiple operating systems\
    \ are installed. You can also say to the boot loader to give the operating system\
    \ different boot options.\n\n## The Initial RAM Disk\n\nThe initial RAM disk,\
    \ abbreviated as `initrd`, is a temporary file system put into memory when the\
    \ system boots. This file system may include helpers that conduct hardware detection\
    \ and load the required modules, often known as `drivers`, to mount the existing\
    \ file system. So, if the root file system is stored on an `LVM` (Logical Volume\
    \ Manager) volume, the operating system continues loading from the natural root\
    \ file system.\n\n## Kernel and Initial RAM Disk Location\n\n`/boot` contains\
    \ the Linux kernel, the initial RAM disk, and other files required to boot the\
    \ operating system. The `/boot` directory for an Ubuntu system is listed below.\n\
    \n```bash\n$ ls -1F /boot\n\nabi-3.13.0-46-generic\nconfig-3.13.0-46-generic\n\
    grub/\ninitrd.img-3.13.0-46-generic\nSystem.map-3.13.0-46-generic\nvmlinuz-3.13.0-46-generic\n\
    ```\n\nThe Linux kernel is commonly referred to as `vmlinux` or `vmlinuz`. The\
    \ `vmlinuz` format is used if the kernel is compressed. The kernel used in this\
    \ example is `vmlinuz-3.13.0-46-generic`. In this example, the initial RAM disk\
    \ is `initrd.img-3.13.0-46-generic`. \n\nPrevious messages are discarded when\
    \ the pad is full to make room for new ones. Use the `dmesg` command to view the\
    \ contents of the kernel ring buffer.\n\n```bash\n$ dmesg\n\n[ 0.000000] Initializing\
    \ cgroup subsys cpuset\n[ 0.000000] Initializing cgroup subsys cpu\n[ 0.000000]\
    \ Initializing cgroup subsys cpuacct\n[ 0.000000] Linux version 3.13.0-46-generic\
    \ (build ...)\n```\n\n(Note: The remaining log output is truncated for brevity\
    \ but follows the kernel initialization sequence.)\n\n## Runlevels and Targets\n\
    \n| Runlevel | Description |\n| :--- | :--- |\n| 0 | Shuts down the system |\n\
    | 1 | Single-user mode. Used for maintenance. |\n| 2 | Multi-user mode with a\
    \ graphical interface (Debian/Ubuntu) |\n| 3 | Multi-user text mode (RedHat/CentOS)\
    \ |\n| 4 | Undefined |\n| 5 | Multi-user mode with graphical interface (RedHat/CentOS)\
    \ |\n| 6 | Reboot |\n\nPreviously, the `init` program was in charge of runlevels.\
    \ `/etc/inittab` was used to hold the init configuration. You would modify the\
    \ `/etc/inittab` file and adjust the runlevel number on the `initdefault` line\
    \ to alter the default runlevel using `init`. As an example, here’s how to make\
    \ runlevel 3 the default.\n\nInit alternatives such as `systemd` and `upstart`,\
    \ on the other hand, are quickly displacing `init`, with `systemd` currently being\
    \ the most frequently adopted. `systemd` uses the concept of targets instead of\
    \ runlevels. Runlevels are generally equal to these targets. Look at `/lib/systemd/system`\
    \ for a list of accessible targets. The runlevel targets are essentially symlinks\
    \ to the actual targets. `runlevel5.target`, for example, is a symlink to `graphical.target`.\n\
    \n```bash\n# cd /lib/systemd/system\n# ls -l runlevel*target\n```\n"
