    \ The user to whom the shell process that interprets a script belongs determines\
    \ the operations that can be done from within the script (for example, if the\
    \ shell belongs to the user `dit`, the script cannot modify the file `/etc/passwd`,\
    \ while if the shell belongs to the `root` superuser, yes you can do it). Consider\
