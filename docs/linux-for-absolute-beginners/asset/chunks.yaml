    # Introduction


    If you have spent much time in the world of computer technology, you have probably
    come across the name “Linux” several times. You may have heard that it is open
    source and available for free download, but that information doesn’t explain Linux.


    ## Linux as an Operating System


    Linux is just an operating system. “Operating system” is probably a word that
    you use regularly, but most people don’t understand what an OS is.


    All of the software and hardware on your computer is run through the OS. That
    is why, if you have an Android phone, you have to download Android apps, and if
    you have an iPhone, you have to download Apple apps. Different operating systems
    have additional requirements for both their hardware and software, and you have
    to abide by these requirements for the programs on your computer to work. Most
    computers come with an OS already installed, which enables users to immediately
    begin to access the information and capabilities of their computers. Most other
    computers come with a `Windows` OS pre-installed. They allow you to get started
    with your computer right away.


    An OS is an interface that allows you to interact with the information on the
    computer. The earliest operating systems used a command-line interface, which
    meant that users had to type out a code to access a program. The most common one
    was `MS-DOS`, which Microsoft released in the year 1981. Operating systems today
    use a graphical user interface or `GUI`. This means that you can physically see,
    like images, the different applications, and programs that you want to access.
    You just have to click on the icons and they open up. Different operating systems
    use a different `GUI`, so switching from one OS to another can cause some confusion
    at first. The look and feel will be different and may take some getting used to.


    Operating systems have to be continually updated to keep up with the ever-growing
    software and hardware improvements. You may have experienced this frustration
    if you have tried to use the newest version of `Microsoft Word` (or any other
    program) and found that it is incompatible with your computer. The problem isn’t
    that your computer has malfunctioned but that your operating system isn’t advanced
    enough to handle the latest version of the software. Updating an OS can take up
    a lot of memory, so having an up-to-date one may mean getting a computer that
    has more memory. You may have to choose between getting a new computer and working
    with an outdated OS.


    The three most common operating systems are `Windows`, `Mac`, and `Linux`. Windows
    was created by Microsoft in the 1980s to replace `MS-DOS`. It was much more user-friendly
    because people no longer had to keep track of different codes necessary to access
    their programs.


    # What Is Linux?


    The kernel of an operating system based on `UNIX` concepts is known as Linux.
    The name comes from the first name of its Finnish creator, `Linus Torvalds`, and
    it is based on the same technique as other `UNIX`-based systems (the last letter
    is an x). Linux is now developed and maintained by tens of thousands of people
    all over the world.


    An operating system’s kernel is its beating heart. It’s essential for communication
    between your computer’s hardware and you, the user. An operating system is made
    up of several software components, including a kernel, numerous tools, and libraries.
    It is software that extends your computer’s core operating system, known as the
    `BIOS`.


    ## From UNIX to Linux


    Linux has a long history dating back to the 1990s. However, to comprehend the
    origins behind Linux, we must first take a glance back at the early days of computers
    following World War II.


    Computing devices occupied entire buildings at the time, and the transition from
    mechanical to electronic components, such as microprocessors and multi-layer circuits,
    was well underway.


    Furthermore, hardware and software components were both expensive and non-standardized
    throughout the 1960s and 1970s. There were a variety of vendor-specific platforms,
    each with its own interface, data transfer and exchange protocols, and operating
    system. The communication between these single computing devices needs specialized
    knowledge and protocol comprehension. UNIX was created to overcome these barriers
    and simplify the use of computing devices on a greater scale.


    ### UNIX


    In January 1965, work on the Multiplexed Information and Computing Service (`Multics`)
    began.


    Multics was developed in collaboration by the Massachusetts Institute of Technology
    (MIT), General Electric (GE), and Bell Labs/AT&T. The main product they developed
    was `Unics`, which was led by `Ken Thompson` and `Dennis Ritchie`. It was later
    renamed `UNIX`. The `UNIX` operating system was widely utilized at the University
    of California, Berkeley.


    ### UNIX Variants


    The concept of `UNIX` became licensed to several companies that developed and
    maintained their variant of UNIX. This included `Solaris/SUN OS` (SUN Microsystems
    nowadays owned by Oracle), `AIX` (IBM), `Scenix` (Siemens), `SCO UNIX`, `Xenix`
    (Microsoft), as well as `HP-UX` (Hewlett-Packard), `NeXTSTEP`, `Mac OS` (Apple),
    and `Android` (Google).


    Open-source implementations comprised the Berkeley System Distribution (`BSD`)
    with its variants: `NetBSD`, `OpenBSD`, and `FreeBSD`. Today, Linux is the most
    popular free software among open-source developers. There is also solid commercial
    support for the systems above.


    ## The UNIX Philosophy


    UNIX is designed with several strict principles in mind. These principles cover
    portability, multi-tasking, and multi-user orientation combined with a time-sharing
    approach. Furthermore, it is based on network connectivity following the `TCP/IP`
    scheme.


    The initial development in the `C` programming language resulted in independence
    from a hardware platform. Delivered with a selection of development tools and
    libraries, it allows you to effortlessly extend it to your specific needs. It
    is simple but powerful to automate tasks that support complex but maintainable
    scripts.


    Similar to a toolbox, UNIX consists of a variety of tools. Each one has a certain
    function and is designed to fulfill that function. The idea is to use one device
    per task. To achieve more complex goals, you combine several tools into a chain.
    The following example incorporates the two commands `ls` and `wc` employing a
    pipe to count the number of Python files in the current directory.


    ```bash

    $ ls *.py | wc -l

    6

    $

    ```


    We will explain these commands and their usage in more detail later on in the
    guide.


    ## A Brief History of Linux


    Similar to UNIX, the Linux operating system has different roots and is based on
    the work of quite a few masterminds. This includes `Richard M. Stallman`, `Andrew
    S. Tanenbaum`, and `Linus Torvalds`.


    Richard M Stallman, a hacker and developer at MIT, is the first president of the
    Free Software Foundation (`FSF`) and the father of the `GNU` project. `GNU` abbreviates
    the slogan `GNU is Not UNIX`. The project’s purpose was to provide a free UNIX
    operating system. Until the 1990s, a collection of tools was available, but the
    kernel was still missing. The entire software was published under the GNU Public
    License (`GPL`) around 1983.

