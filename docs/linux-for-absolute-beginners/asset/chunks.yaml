- fmt: "\n```bash\n[root@localhost Downloads]# usermod -c “Disabled Account while\
    \ Bob out of the country for five months” bjones\n[root@localhost Downloads]#\
    \ grep bjones /etc/passwd\nbjones:x:1001:1001:Disabled Account while Bob out of\
    \ the country for four months:/home/bjones:/bin/bash\n[root@localhost Downloads]#\n\
    ```\n\n# Manage Groups\n\nManaging groups in Linux makes it convenient for an\
    \ administrator to combine the users within containers applying permission-sets\
    \ applicable to all group members. For example, all users in `Accounting` may\
    \ need access to the same files. Thus, we make an accounting group, adding `Accounting`\
    \ users. \n\nFor the most part, anything requiring special permissions should\
    \ be done in a group. This approach will usually save time over applying special\
    \ permissions to just one user. For example, Sally is in charge of reports and\
    \ only Sally needs access to certain files for reporting. However, what if Sally\
    \ is sick one day and Bob does report? Or does the need for reporting grow? When\
    \ a group is made, an Administrator only needs to do it once. The add users is\
    \ applied as needs change or expand.\n\nFollowing are some common commands used\
    \ for managing groups:\n\n* `chgrp`\n* `groupadd`\n* `groups`\n* `usermod`\n\n\
    `chgrp`: Changes the group ownership for a file or directory.\n\nLet’s make a\
    \ directory for people in the accounting group to store files and create directories\
    \ for files.\n\n```bash\n[root@localhost Downloads]# mkdir /home/accounting\n\
    [root@localhost Downloads]# ls -ld /home/accounting\n```\n\nNext, let’s give group\
    \ ownership to the accounting group.\n\n```bash\n[root@localhost Downloads]# chgrp\
    \ -v accounting /home/accounting/\nchanged group of ‘/home/accounting/’ from root\
    \ to accounting\n[root@localhost Downloads]# ls -ld /home/accounting/\ndrwxr-xr-x.\
    \ 2 root accounting 6 Jan 13 10:18 /home/accounting/\n```\n\nNow, everyone in\
    \ the accounting group has read and executed permissions to `/home/accounting`.\
    \ They will need write permissions as well.\n\n```bash\n[root@localhost Downloads]#\
    \ chmod g+w /home/accounting/\n[root@localhost Downloads]# ls -ld /home/accounting/\n\
    drwxrwxr-x. 2 root accounting 6 Jan 13 10:18 /home/accounting/\n```\n\nSince the\
    \ accounting group may deal with sensitive documents, we need to apply some restrictive\
    \ permissions for others or the world.\n\n```bash\n[root@localhost Downloads]#\
    \ chmod o-rx /home/accounting/\n[root@localhost Downloads]# ls -ld /home/accounting/\n\
    drwxrwx—-. 2 root accounting 6 Jan 13 10:18 /home/accounting/\n```\n\n![Image](Images/image00133.gif)\n\
    \nLet’s make a new group called `secret`. We will add a password to the group,\
    \ allowing the users to add themselves with a known password.\n\n```bash\n[root@localhost]#\
    \ groupadd secret\n[root@localhost]# gpasswd secret\nChanging the password for\
    \ group secret:\nNew Password:\nRe-enter new password:\n[root@localhost]# exit\n\
    exit\n[centos@localhost ~]$ newgrp secret\nPassword:\n[centos@localhost ~]$ groups\n\
    secret wheel rdc\n```\n\nIn practice, passwords for groups are not used often.\
    \ Secondary groups are excellent and sharing passwords amongst other users is\
    \ not a great security practice.\n\nThe `groups` command is used to show which\
    \ group a user belongs to. Next, we will use this, after making some changes to\
    \ our current user.\n\n`usermod` is used to update account attributes.\n\nFollowing\
    \ are the common `usermod` switches.\n\n![Image](Images/image00134.gif)\n\n```bash\n\
    [root@localhost]# groups centos\ncentos : accounting secret\n[root@localhost]#\
    \ usermod -a -G wheel centos\n[root@localhost]# groups centos\ncentos : accounting\
    \ wheel secret\n```\n\n# Removing Users\n\nWe have learned how to create users,\
    \ but what if there are just too many of them? What if someone has decided to\
    \ leave and his or her credentials are still on the system? How do you remove\
    \ those?\n\nAgain, we will resort to both the GUI and the LUI methods. We do this\
    \ to ensure everyone gets an idea of how things are done within the thrilling\
    \ world of Linux. Whatever suits you best, later on, is yours to decide.\n\nFirst,\
    \ we use the graphical user interface:\n\n1. Go to the user menu on the top right\
    \ side of the screen.\n2. Click on `Settings`.\n3. Select `Details` (the last\
    \ option).\n4. Click on `users`.\n5. Click on the unlock button.\n6. Enter the\
    \ root password.\n7. Use the red button named “Remove user.”\n8. Decide whether\
    \ you would like to keep the files or delete them.\n\nOnce done, click the appropriate\
    \ choice. And that is it!\n\nWhen you delete a user, you can delete the user settings,\
    \ but if you believe the files could still be useful, ensure that you keep the\
    \ files created by this user saved and accessible. The user, once deleted, will\
