- fmt: '

    To change the default runlevel or target using systemd, use the `systemctl` command,
    followed by `set-default`, and then the desired target. You can also manually
    establish a symlink from the `/etc/systemd/system/default.target` file to the
    desired destination. This example makes graphical the default target, which is
    equivalent to runlevel 5.


    ## set-default multi-user.target


    ```bash

    rm ''/etc/systemd/system/default.target''

    ln -s ''/usr/lib/systemd/system/multi-user.target'' ''/etc/systemd/system/default.target''

    ```


    ## Changing Runlevels or Targets


    With the init system, you can change runlevels using the `telinit` command. Simply
    supply the runlevel you want to switch to as an argument to the `telinit` command.


    ### telinit 5


    ```bash

    telinit 5

    ```


    To change the target, the runlevel equivalent for systemd, use the `systemctl`
    command followed by `isolate` and finally the desired target. For example, here
    is how to change to the graphical target.


    ```bash

    systemctl isolate a graphical target

    ```


    ## Rebooting a System


    Even though there is a runlevel/target if you’re using systemd, you can also use
    the `reboot` or `shutdown` commands for rebooting.


    Here’s how to reboot with init.


    ```bash

    telinit 6

    ```


    To reboot using the systemd, use the `systemctl` command.


    ```bash

    systemctl isolate reboot.target

    ```


    Simply type `reboot` into the command prompt to reboot.


    ```bash

    reboot

    ```


    The format of the `shutdown` command is as follows.


    ```bash

    shutdown [options] time [message]

    ```


    The `-r` option instructs `shutdown` to do a reboot. Next, you can specify the
    time to shutdown using the `HH: MM` format. You can also use `+N`, where `N` represents
    the number of minutes to wait before acting. Finally, you can use the `new` keyword
    to start immediately. Optionally, you may specify a message broadcast to all users
    logged into the system.


    ```bash

    shutdown -r now

    ```


    ## Powering Off a System


    To power off a system, use runlevel 0, the `poweroff` target, or the `poweroff`
    command.


    Here is how to issue a power-off with init.


    ```bash

    telinit 0

    ```


    Here is how to power off a system with `systemctl`.


    ```bash

    systemctl isolate poweroff.target

    ```


    Finally, you can use the `poweroff` command.


    ```bash

    poweroff

    ```


    ## Summary


    The BIOS’s job is to perform basic hardware checks and launch the boot loader
    from a bootable device, as you learned. You also learned about the two most commonly
    used bootloaders, `LILO` and `Grub`. The primary job of any boot loader is to
    start the operating system.


    You also learned that the `/boot` directory contains the files required to boot
    a Linux system. The initial ramdisk, often known as `initrd`, is a memory-based
    file system. Its primary function is to mount the file system that contains the
    operating system. The Linux kernel is commonly referred to as `vmlinux` or, if
    compressed, `vmlinuz`.


    Using the `dmesg` program or looking at the `/var/log/dmesg` file, you learned
    how to inspect the messages in the kernel ring buffer.


    You also learned about run levels and how systemd has an equivalent concept known
    as targets. Next, you learned how to change the runlevel with the `telinit` command
    for the traditional init system and the `systemctl` management for systems that
    use the system. Finally, you learned about the `shutdown`, `reboot`, and `poweroff`
    commands.


    ## Quiz


    **1. The BIOS begins the computer’s boot process and passes control to the boot
    loader.**

    a.True

    b. False


    **2. Which of the following are Linux boot loaders?**

    a. `LILO`

    b. `GRUB`

    c. Both `LILO` and `GRUB`

    d. `BIOS`


    **3. The following is a temporary file system loaded into memory when the system
    boots.**

    a. `kernel`

    b. `vmlinux`

    c. `vmlinuz`

    d. `initrd`


    **4. The `/Linux` directory contains the files required to boot Linux.**

    a. True

    b. False


    **5. Which command displays the contents of the kernel ring buffer?**

    a. `ringbuf`

    b. `ringb`

    c. `rmesg`

    d. `dmesg`


    **Quiz Answers**

    1. A

    2. C

    3. D

    4. B

    5. D


    ## Searching and Extracting Data


    ### Objectives:

    * Understand how to redirect output using pipes

    * Be able to redirect operators using `grep`

    * Be able to search for patterns within data files


    A command-line environment is a potent tool. This same concept can also search
    for data within a file or files.


    But first, you must understand how to link multiple commands together using the
    images of command redirect and input/output redirection.


    ## Command Redirection


    Command redirection allows a user to reroute the standard input to a second program
    or command. This is performed using a pipeline or command line pipe. A pipe is
    created using a vertical bar (`|`) between the two commands. This key is usually
    found above the Enter key on the keyboard and accessed by pressing the Shift key
    down while pressing the Backslash key.


    Pipelines can be helpful when applied in various ways. For example, the verbose
    output of the `cat` command (which displays the contents of a file to the screen)
    can be piped together with the `less` command to show only one page of content
    at a time. This avoids jumping to the last page of the file and not seeing the
    content in the rest of the file. The `more` command can also display one page
    of content when combined with the `cat`, but it operates differently than the
    `less` command. Please consult their dedicated man pages to learn more about a
    `cat`, `trim`, and more commands.


    By using pipes, a user can perform two or more commands in sequence and run them
    consecutively. This allows for quick execution of commands and complex tasks,
    resulting in fewer pauses in performance since the system won’t have to wait for
    the user to input the following command.


    The `grep` command is commonly used in pipelines to search for keywords within
    the output of a given command. This command searches for files containing a specified
    string and returns the file’s name, and if it is a text file, the line containing
    that string. The `grep` command can also search within a specified file for a
    specific string. To use `grep`, a user simply types the command’s name, `grep`,
    an optional set of switches and parameters, a regular expression, and an optional
    filename if desired.


    If you plan to enter the world of system administration or cybersecurity, you
    will need to get comfortable using the `grep` command. This command is a security
    operation center analyst’s best friend for finding information from different
    log files in a Security Information and Event Management server. In-depth usage
    of the `grep` tool is beyond the scope of this book, but to learn more about the
    command, please consult its detailed man pages for the complete list of options
    it supports.


    ## Input/Output Redirection


    In addition to redirecting the output of one command into another by using the
    pipe, a user can also turn the input/output of a command to other locations. For
    example, if you need to save a program’s output for future reference, you can
    redirect that output to a file. Similarly, the input to a command can be shifted
    from a file instead of requiring the user to enter it using the keyboard.


    Although input redirection may sound strange, some programs rely on this feature
    to process data. For instance, raw text files fed through a program search the
    text for specified patterns. In addition to all of this, a related technique involves
    the `xargs` command, which enables a user to generate command-line options from
    files or other programs’ output.


    A Linux system has two types of output supported by default: standard output and
    standard error. The expected output is used for average program messages. For
    example, when you run the `ls` command, the output is sent to the standard output
    and, therefore, displayed on your screen. The standard error, on the other hand,
    outputs error messages. This also displays on the screen by default, but users
    can redirect these messages if desired.


    Several redirection operators are available to more fully control where information
    is output to, displayed to, and saved to.

