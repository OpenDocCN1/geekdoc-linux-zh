    Note: Pressing the Esc key on the keyboard will always cancel the current command
    or return you to the command mode of Vim. A good practice is to press the Esc
    key twice or more to make sure that you have returned to the command mode.


    **Saving Files**


    The Ex mode is used to save files in Vim. To enter the Ex mode, you need to press
