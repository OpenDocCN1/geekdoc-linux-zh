    **About the Shell**


    The shell or shell interpreter is a program that allows users to interact with
    the system, processing the orders indicated. Commands invoked from the shell can
    be classified as internal (they actually correspond to orders interpreted by the
    shell itself) and external (they correspond to executable files external to the
    shell). In addition to commands, shells offer other elements to improve their
    functionality, such as variables, functions, or control structures. The set of
    internal commands and available elements, as well as their syntax, will depend
    on the specific shell used.


    **Users**


    In addition to using the shell from the command line (based on the prompt as the
    indication of the shell to announce that it expects a user order), it can be used
    to interpret shell scripts. A shell script or “command script” is a text file
    that contains a set of commands and commands interpretable by the shell.


    The shell is an executable file that must interpret the commands, transmit them
    to the system, and yield the result. There are several shells. The most common
    is sh (called Bourne shell), bash (Bourne again shell), csh (C Shell), Tcsh (Tenex
    C shell), ksh (Korn shell), and zsh (Zero shell). Generally, their names match
    the name of the executable.


    Each user has a default shell, which will be activated when a command prompt is
    opened. The default shell is specified in the configuration file /etc/passwd in
    the last field of the line that corresponds to the user. It is possible to change
    shell during a session. For this, you only have to execute the corresponding executable
    file, for example:


    /bin/bash


    **System Indicator**


    The shell starts when reading its complete configuration (in a file in the / etc
    / directory) and then reading the user’s own configuration (in a hidden file whose
    name begins with a period and is located in the user’s basic directory, that is
    /home/user_name/.configuration_file). Then the following indicator appears:


    team: /directory/current $


    By default, for most shells, the indicator consists of the name of the computer,
    followed by a colon (:), the current directory, and then a character indicating
    the type of user connected:


    $ specifies a normal user;


    # specifies the administrator, called root.


    **The Command Line Concept**


    A command line is a string of characters formed by a command that corresponds
    to an executable file of the system or, rather, a shell command as well as optional
    arguments (parameters):


    ls -al /home/jf/


    The arguments that start with - are called options. Usually, for each command,
    there are a certain number of options that can be detailed when entering one of
    the following commands:


    command —help command -? man command


    **Redirects**


    Like any Unix system, Linux has mechanisms that allow redirecting standard input-output
    to files. Therefore, if the> character is used, the standard output of a command
    on the left can be redirected to a file on the right:


    ls -al /home/jf/ > toto.txt echo “Toto” > /etc/myconfigurationfile


    The following command is equivalent to a copy of the files:


    cat toto> toto2


    The purpose of redirection> is to create a new file. If a file already exists
    with the same name, it must be deleted. The following command simply creates an
    empty file:


    >file


    Using the double character >> allows you to add the standard output to the file,
    that is, it allows you to add the output after the file without deleting it.


    Similarly, the <character indicates a redirection of the standard input. The following
    command sends the contents of the toto.txt file with the cat command, whose sole
    purpose is to display the content in the standard output (the example is not useful,
    but it is instructive):


    cat<toto.txt


    Finally, the use of the redirection << allows reading, in the standard input,
    until the chain located to the right is found. In the following example, the standard
    input is read until the word STOP is found. Then, the result is displayed:


    cat<<STOP


    **Communication Pipes**


    Pipes are specific communication mechanisms for all UNIX systems. A pipe, symbolized
    by a vertical bar (character |), allows you to assign the standard output of one
    command to the standard input of another, in the same way that a pipe allows communication
    between the standard input of a command and the standard output of other.


    In the following example, the standard output of the ls -al command is sent to
    the sort program, which must extract the result in alphabetical order:


    ls -al | sort


    This allows connecting a certain amount of commands through successive pipes.
    In the following example, the command will show all files in the current directory,
    select the lines that contain the zip element (using the grep command), and count
    the total number of lines:


    ls -l | grep zip | wc –l


    **Shell Script in Linux**


    **Invocation**


    In its most basic form, a shell script can be a simple text file that contains
    one or more commands. To help identify the content from the file name, it is common
    for shell scripts to have the extension “.sh”, so we will follow this criterion
    (but remember that it is merely informative and optional). For example, the following
    file would be a shell script:


    Script.sh


    echo “ Personal folder content:”


    ls ~/


