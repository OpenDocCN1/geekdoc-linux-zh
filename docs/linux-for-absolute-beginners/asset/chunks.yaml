    请注意，如果你在非 Linuxget 上安装 `UNetbootin`，可能需要解除该应用程序的锁定。只需右键点击 `UNetbootin` 图标，选择 `Properties`（属性），然后点击
    `Unblock`（解除锁定）按钮。


    如果你在 Linuxget 上安装 `UNetbootin`，你还需要使用命令行或 `Synaptic Package Manager`（同步软件包管理器）指南安装
    `p7zip-full` 包。


    插入一个容量至少为 2 GB 的 USB 闪存。启动 `UNetbootin` 程序。使用 `Select Distribution`（选择发行版）和 `Select
    Version`（选择版本）按钮下载镜像文件。


    如果你想要安装的 Linux 发行版未列在 `UNetbootin` 的 `Select Distribution` 和 `Select Version`
    列表中，你需要从下载所需的 ISO 文件。然后通过选择 `Diskimage`（磁盘镜像）并点击 `[…]` 按钮来选择你下载的 ISO 文件。


    通过 `Drive:`（驱动器）选择菜单选择刚刚插入电脑的 USB 盘。选好所有选项后，点击 `[OK]` 按钮创建可启动的 USB 盘。这可能需要大约五分钟，所以如果过程看起来停止了，请不要担心。


    # Ubuntu 首选


    Ubuntu 16.04 是 Ubuntu 的 LTS（长期支持）版本，支持期限为五年。它可以在配有 `Intel Celeron` 或 `Core i3`
    处理器的旧旧电脑上运行，并且只需要少量内存或硬盘空间。电脑中配备 `SSD`（固态硬盘）也有帮助，因为它比传统的硬盘更快。例如，我在 eBay 上花约 100
    美元买的一台旧 `Dell E4200` 笔记本上运行 `Ubuntu Unity`，它可以在 17 秒内启动。


    `Unity` 桌面引发了许多争论，但我许多电脑和笔记本电脑上使用它并非常喜欢。


    此版本的《Ubuntu 用户手册》涵盖了 Ubuntu 16.04，它将作为五年的 LTS 版本。安装哪个版本取决于你的决定。自己尝试不同的版本其实很容易。


    Ubuntu 可以在具有 1 GB 内存和 8 GB 硬盘空间的电脑上安装和运行。`Ubuntu Unity` 有一个独特的用户界面系统，使用顶部面板和左侧边栏启动器。提供更改启动器、壁纸和主题的选项。用户也可以根据需要添加或删除
    Linux 应用程序。


    Ubuntu 使用 `Unity` 桌面。与其他轻量级 Linux 桌面软件相比，`Unity` 需要更多的物理资源（内存和 CPU）。因此，它可能吸引苹果电脑用户和普通用户。然而，高级用户可能不会选择
    `Unity` 用户体验。Wikipedia 及其他地方有关于 `Unity` 的技术讨论。我只对如何使用和自定义 Ubuntu 感兴趣。


    # Linux 启动


    ## BIOS


    `BIOS` 代表基本输入/输出系统（Basic Input/Output System）。它是启动过程中使用的一种特殊固件，是电脑通电时运行的第一段软件。`BIOS`
    是一个独立的操作系统。


    根据硬件的不同，`BIOS` 会提供一个启动设备列表，如硬盘、DVD 驱动器、USB 设备等。但再次强调，完成此操作所需的关键组合将取决于硬件制造商的不同。


    在发现可启动设备后，`BIOS` 将启动启动加载程序。虽然你可能会遇到使用 `LILO` 启动加载程序的旧版 Linux 系统，但 `GRUB` 启动加载是最常见的。


    启动加载程序的主要功能是在任何情况下启动操作系统。你通常会看到来自启动加载程序的消息或系列信息，这允许你中断启动过程并与启动加载程序交互。例如，如果安装了多个操作系统，你可以告诉启动加载程序执行哪个操作系统。你也可以告诉启动加载程序为操作系统提供不同的启动选项。


    ## 初始 RAM 磁盘


    初始 RAM 磁盘缩写为 `initrd` 是系统启动时放入内存的临时文件系统。该文件系统可能包含用于硬件检测和加载所需模块（通常称为驱动程序）的助手，以挂载现有文件系统。因此，如果根文件系统存储在
    `LVM`（逻辑卷管理器）卷上，操作系统将继续从根文件系统加载。


    ## 内核和初始 RAM 磁盘位置


    `/boot` 包含 Linux 内核、初始 RAM 磁盘以及启动操作系统所需的其他文件。Ubuntu 系统的 `/boot` 目录如下。


    ```bash

    $ ls -1F /boot


    abi-3.13.0-46-generic

    config-3.13.0-46-generic

    grub/

    initrd.img-3.13.0-46-generic

    System.map-3.13.0-46-generic

    vmlinuz-3.13.0-46-generic

    ```


    Linux 内核通常称为 `vmlinux` 或 `vmlinuz`。如果内核经过压缩，则使用 `vmlinuz` 格式。示例中使用的内核是 `vmlinuz-3.13.0-46-generic`。在此示例中，初始
    RAM 磁盘是 `initrd.img-3.13.0-46-generic`。


    当缓冲区满时，旧消息会被丢弃为新消息留出空间。使用 `dmesg` 命令查看内核环形缓冲区的内容。


    ```bash

    $ dmesg


    [ 0.000000] Initializing cgroup subsys cpuset

    [ 0.000000] Initializing cgroup subsys cpu

    [ 0.000000] Initializing cgroup subsys cpuacct

    [ 0.000000] Linux version 3.13.0-46-generic (build ...)

    ```


    （注意：为了简洁，其余日志输出遵循内核初始化序列。）


    | 运行级别 | 描述 |

    | :--- | :--- |

    | 0 | 关机 |

    | 1 | 单用户模式。用于维护。 |

    | 2 | 带有图形界面的多用户（Debian/Ubuntu） |

    | 3 | 多用户文本模式（RedHat/CentOS） |

    | 4 | 未定义 |

    | 5 | 带有图形界面的多用户（RedHat/CentOS） |

    | 6 | 重启 |


    以前，`init` 程序负责运行级别。`/etc/inittab` 用于存储 init 配置。你会修改 `/etc/inittab` 文件并调整 `initdefault`
    行上的运行级别数字来使用 `init` 更改默认运行级别。例如，这里是如何将运行级别 3 设置为默认。


    另一方面，`init` 的替代方案 `systemd` 和 `upstart` 正在快速取代 `init`，目前 `systemd` 被最广泛采用。`systemd`
    使用目标（targets）的概念而不是运行级别。运行级别通常等于这些目标。查看 `/lib/systemd/system` 可获取可用目标列表。运行级别目标本质上是实际目标的符号链接。例如，`runlevel5.target`
    是 `graphical.target` 的符号链接。


    ```bash

    # cd /lib/systemd/system

    # ls -l runlevel*target

    ```

