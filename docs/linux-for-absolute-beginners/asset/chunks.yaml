  trans: "\n\n`netstat` 命令用于监控与网络的活动连接，并帮助你阻止任何不受需要的或可疑的连接，这些连接可能为黑客和恶意软件提供入口。你还可以跟踪每一个发送和接收的数据包。对于大多数网络和系统管理员来说，这个命令始终是常用的。\n\
    \n当你的网络处于运行并连接到各种设备时，所有这些设备都试图访问它并获取或提供信息，需要某些东西介入来监控这里的安全性。这就是安全外壳（SSH）大显身手的地方。\n\
    \n在 SSH 出现之前，还有 `Telnet`。这最初被视为一场革命，人们可以在不需要身临现场的情况下访问另一台远程机器。这引起了各种人的人的注意，也包括一些窥探的目光。很快，人们就意识到这些方法是不安全的，任何人实际上都可以“窃听”他们的交流。\n\
    \n`SSH` 完成了 `Telnet` 未能做到的：它对你会话的所有数据进行加密。它还允许任何操作系统的客户端以一种安全的方式传输其文件和文件夹，而无需担心中间有窥探的目光。理解\
    \ `SSH` 不是一天就能完成的任务，甚至一本书就能掌握的。对学习更多关于加密、`SSH` 和 `SSHD` 信息感兴趣的可以在网上找到各种信息。这些都是高级水平的，因此此时适合初学者。\n\
    \n在 Linux 世界中，需要时间和练习才能掌握技巧，但一旦你开始理解事物是如何运作的，你很快就能处理问题，仿佛它们毫无意义。在这种情况下，最好习惯 `LUI`\
    \ 是你最佳伙伴的概念。\n\n## 脚本编写\n\n计算机的一种卓越能力是它可以为你执行自动化任务。在 Linux 系统中，你可以根据自己偏好的自动化活动编写“程序”来控制功能。\n\
    \n这就是脚本登场的地方。\n\n### 脚本编写用于什么？\n\n脚本是存储在文件中的数据和命令集合。Shell（壳）负责读取该集合，并在读取数据时遵循指令。\n\
    \n脚本可以处理基本任务，也可以处理复杂的任务。它们可以被用于执行强大的操作。\n\n脚本编写有很多常见用途，包括：\n* 获取更新\n* 维护重要更新库\n\
    * 收集数千个文件并将其传输到服务器\n* 将数千个文件复制到服务器\n* 构建页面层次结构\n\n### 编写和编辑脚本\n\n脚本包含 ASCII 文本。编写脚本是通过文本编辑器完成的。要编写一个功能性的脚本，你应该记住它必须包含三行。\n\
    \n示例：\n```python\n#! python\n# first ever script\necho “Hello World!”\n```\n如示例所示，脚本有三行：(1)\
    \ 第一行包含 `#! python`；这是一行重要的代码，指示了脚本解释所需的程序（即 `python`），(2) 第二行包含 `# first ever\
    \ script`；它是脚本的首选标题，以及 (3) 第三行包含 `echo “Hello World!”`；它是脚本本身。\n\n编写脚本后，接着需要设置权限。它启用了脚本的执行。可以通过\
    \ `chmod` 命令完成。\n\n示例：\n```bash\nchmod 700 first_ever_script\n```\n如示例所示，使用了 `chmod`；`chmod`\
    \ 是负责为文件和目录授予权限的命令。`700` 也被使用了；它表示读、写和执行权限。\n\n允许编辑脚本。假设比起“700”（一种私有的读写权限），你更倾向于“755”（公共读写权限）。要做到这一点，请学习两个命令：(1)\
    \ `aliases` 和 (2) shell 函数。\n\n别名（Aliases）是用来创建子命令的命令。\n\n示例：\n```bash\nalias\
    \ tomorrow = ‘current date + “%A, %B, %Y”’\n```\n如示例所示，创建的别名为 `tomorrow`。它的任务是根据提供的信息显示明天的日期。\n\
    \n编辑脚本的另一个命令称为 shell 函数。Shell 函数类似于别名。区别在于执行的复杂性。别名用于简单命令，而 Shell 函数可以处理更复杂的指令集。\n\
    \nShell 函数也被称为小子脚本。由于它们管理的脚本有时难以理解，因此它们被认为是“脚本中的脚本”。\n\n示例：\n```bash\nfunction\
    \ tomorrow {\n    echo “Tomorrow’s date is:”\n    current date +”%A, %B %Y”\n\
    }\n```\n如示例所示，该 shell 函数设计用于显示明天的日期。它使用了当前日期的数据。它与提供的别名方法示例相似。区别在于它可以在必要数据之上显示一个自定义语句（“Tomorrow’s\
    \ date is:”）。\n\n## 学习和理解 Bash\n\n`BASH` 是 Bourne-again Shell（再次 Bourne 的 Shell）的缩写，是一个读取脚本的命令处理器。它在文本窗口中运行。在那里，用户输入命令以触发特定的动作。\n\
    \n`BASH` 支持通配符（glob）。Glob 是指定一组文件名的模式。这些文件名具有通配符字符。\n\n某些通配符字符是：\n* `?` – 用于匹配字符\n\
    * `*` – 用于匹配零或多个字符\n* `[abc]` – 匹配给定括号内存在的任意字符\n* `[!abc]` – 匹配给定括号内不存在的字符\n*\
    \ `[a – z]` – 匹配给定括号范围内的任意字符\n* `[!a – z]` – 匹配不在给定括号范围内的字符\n\n当 `BASH` 处于并发模式时，允许执行多个命令。为了让这些命令正确执行，必须使用符号\
    \ `&`。\n\n```bash\nfirst command & second command\n```\n如示例所示，“第一个命令”正在执行。一旦执行完成，“第二个命令”将被处理。\n\
    \n`BASH` 的规则：\n* 使用符号 `&` 在后台执行\n* 通常，通过 `fg` 回到前台执行\n* 通过按下 `ctrl` + `z` 挂起运行进程\n\
    * 后台进程\n\n此外，存在一个名为 `BASHBUG` 的命令。一旦调用，它会启动默认文本编辑器。它带有用户可以填充的表单。完成后，表单将发送给 BASH\
    \ 维护者。\n\n## 替换、变量和常量\n\nLinux 编程中允许替换。它是为了根据首选命令修改文件。\n\n示例 #1：\n```bash\n# create_page\
    \ ! – A script for production of an HTML file\nconcatenate <<- _EOF_\n<HTML>\n\
    <HEAD>\n<TITLE>\nUser_System_Info\n</TITLE>\n</HEAD>\n<BODY>\n<H1>User_System_Info</H1>\n\
    </BODY>\n</HTML>\n_EOF_\n```\n\n示例 #2：\n```bash\n# create_page ! – A script for\
    \ production of an HTML file\ntitle=”User_System_Info”\nconcatenate <<- _EOF_\n\
    <HTML>\n<HEAD>\n<TITLE>\nSystem_Info_1\n</TITLE>\n</HEAD>\n<BODY>\n<H1>System_Info_1</H1>\n\
    </BODY>\n</HTML>\n_EOF_\n```\n如示例 #2 所示，示例 #1 中 HTML 文件的标题“User System Info”被更改为“System\
    \ Info 1”。\n\n替换中常用的概念之一是变量。变量是编程的基础知识之一。它们是存储数据的元素，并通过特定的名称进行引用。\n\n创建变量名时的注意事项：\n\
    * 变量名应该以字母开头\n* 不允许使用标点符号\n* 避免嵌入空格\n\n某些变量是准备就绪的。当系统管理员登录时，它们已经在脚本中被预定义。这些大写字母变量被称为环境变量。\n\
    \n示例：\n```bash\n# create_page ! – A script for production of an HTML file\ntitle=\
    \ “System_Information”\nconcatenate <<- _EOF_\n<HTML>\n<HEAD>\n```\n\n"
