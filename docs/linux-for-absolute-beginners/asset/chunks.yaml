    # Linux Boot


    **The BIOS**


    BIOS stands for Basic Input/Output System. It’s a particular type of firmware
    used in the booting process, and it’s the first piece of software that is run
    when a computer is powered. The BIOS is an independent operating system.


    Depending on the hardware, the BIOS provides a list of boot devices such as hard
    disks, DVD drives, USB devices, and others. But, again, the critical combination
    necessary to accomplish this will differ depending on the hardware manufacturer.


    The BIOS will launch the boot loader after a bootable device has been discovered.
    Although you may come across older Linux systems that use the LILO boot loader,
    the GRUB boot loader is the most common.


    The boot loader’s principal function is to start the operating system in any event.
    You will typically see a message or series of news from the boot loader, which
    will allow you to interrupt the boot process and interact with the boot loader.
    For example, you can tell the boot loader which operating system to execute if
    multiple operating systems are installed. You can also say to the boot loader
    to give the operating system different boot options.


    **The Initial RAM Disk**


    The initial RAM disk, abbreviated as “initrd,” is a temporary file system put
    into memory when the system boots. This file system may include helpers that conduct
    hardware detection and load the required modules, often known as drivers, to mount
    the existing file system. So, if the root file system is stored on an LVM (Logical
    Volume Manager) volume, the operating system continues loading from the natural
    root file system.


    **Kernel and Initial RAM Disk Location**


    /boot contains the Linux kernel, the initial RAM disk, and other files required
    to boot the operating system. The /boot directory for an Ubuntu system is listed
    below.


    $ ls -1F /boot


    abi-3.13.0-46-generic


    config-3.13.0-46-generic


    grub/


    initrd.img-3.13.0-46-generic


    System.map-3.13.0-46-generic


