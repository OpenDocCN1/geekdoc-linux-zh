    ### The `grep` Command


    This command is used to find a string or a specific pattern in a file. It is available
    in all distros of Linux. However, if you find it uninstalled in your system, it
    can still be installed separately. On Debian and Ubuntu you can install it by
    doing the following:


    ```bash

    sudo apt-get install grep

    ```


    In Red Hat Linux, install it using this command:


    ```bash

    sudo yum install grep

    ```


    From our file ‘first,’ let us perform the `grep` command. Remember the contents
    of the file:


    Let us use the `grep` to search for the word Linux in the file first:


    Notice the output, the line with the word ‘Linux,’ and that it makes the search
    word red to differentiate it from the rest. However, this search is case-sensitive.
    If we could have searched for the word ‘linux,’ with a lower case “L,” rather
    than Linux, then it won’t be found.


    Notice also that the output is null, meaning that no word matched the search word.
    To make the search case insensitive, so that it won’t differentiate the two words,
    use the `–i` option.


    The `grep` command can also be used to perform multiple searches, meaning that
    we are going to search for more than one word in the file. This is a good feature
    and you might need to use it someday. To use it, do the following:


    Notice that we have used the command:


    ```bash

    grep –ie ‘am’ –e ‘linux’ first

    ```


    Where the `–i` is for case insensitive search while `–e` specifies that it is
    multiple searches.


    As shown below, the `grep` command can also be used to do the opposite of what
    you’ve provided:


    ```bash

    grep -iv ‘linux’ first

    ```


    The above command should return all the lines without the word Linux once it has
    been run. In the specified file, that is, ‘first,’ this should be the second line.


    Note the `–i` is for case insensitive search whereas the `–v` has the purpose
    of returning the opposite of the search criteria. The `–in` option when used with
    the `grep` command returns the line number. To show the line number of the sentence
    containing the word ‘enjoying,’ the following command can be used:


    ```bash

    grep –in ‘enjoying’ first

    ```


    You can also return the number of lines above the search criteria.


    ```bash

    grep –iB1 ‘enjoying’ first

    ```


    This will return the line immediately above the line with the search criteria
