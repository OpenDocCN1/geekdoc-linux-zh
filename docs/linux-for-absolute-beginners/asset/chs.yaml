  \ `mv` 命令。`mv` 命令可以将文件或目录移动到另一个位置。\n\n移动或重命名文件是使用 `mv` 命令。`mv` 命令可以将文件或目录移动到另一个位置。\n\
  \n`mv source destination`：将 `source` 移动到 `destination`。如果 `destination` 是一个目录，则将\
  \ `source` 移动到该目录中。\n`mv -i source destination`：运行 `mv` 在交互模式。如果目标文件已存在，`mv`将在覆盖之前询问你。\n\
  \n查看以下示例了解 `mv` 命令在不同情况下的行为：\n\n```\n$ mv file1 new_file\n$ ls -F\nnew_file\n\n\
  $ mv file1 dir/\n$ ls dir\nfile1\n\n$ mv -i file1 file2\nmv: overwrite 'file2'?\
  \ y\n```\n\n#### 排序文件\n\n在 Linux 中在或重文件文件重重重文件使用是使用 `mv`。。在最简单的形式下，`ls` 命令可以将文件重重到文件。。。文件`文件文件文件到到位置。\n\
  \n```\n$ mv file1 new_file\n$ ls -F\nnew_file\n\n$ mv file1 dir/\n$ ls dir\nfile1\n\
  \n$ mv -i file1 file2\nmv: overwrite 'file2'? y\n```\n\n#### 排序数据\n\n在在最简单的形式下，`sort`\
  \ 命令可以将重重重重重重重重重重重重重重重重重重重重重。在 Linux 移动或重命名文件是使用 `mv` 命令。`mv` 命令可以将文件或目录移动到另一个位置。\n\
  \n移动或重命名文件是使用 `mv` 命令。`mv` 命令可以将文件\n\n#### 移动或重命名文件。\n\n`mv source destination`：将\
  \ `source` 移动到 `destination`。如果 `destination` 是一个目录，则将 `source` 移动到该目录中。\n`mv -i\
  \ source destination`：运行 `mv` 在交互模式。如果目标文件已存在，`mv`将在覆盖之前询问你。\n\n查看以下示例了解 `mv` 命令在不同情况下的行为：\n\
  \n```\n$ mv file1 new_file\n$ ls -F\nnew_file\n\n$ mv file1 dir/\n$ ls dir\nfile1\n\
  \n$ mv -i file1 file2\nmv: overwrite 'file2'? y\n```\n\n#### 排序数据\n\n在最简单的形式下，`sort`\
  \ 命令可以将文本进行排序。\n\n`sort file`：对文件进行排序。\n`sort -k F`：按字段排序。跟随 `-k` 的字段编号。\n`sort\
  \ -r`：反序排序。\n`sort -u file`：对文件进行排序并删除重复行。\n\n```\n$ cat more-secrets\ntags: credentials\n\
  user: bob\npass: Abee!\ntags: credentials\n\n$ sort more-secrets\npass: Abee!\n\
  tags: credentials\nuser: bob\n\n$ sort -u more-secrets\npass: Abee!\ntags: credentials\n\
  user: bob\n\n$ sort -ru more-secrets\nuser: bob\ntags: credentials\npass: Abee!\n\
  ```\n\n\n\n\n在下面的示例中，`tar` 被用于创建归包（`tar cf tps.tar`）、列出归包内容（`tar tf tps.tar`）以及提取归包内容（`tar\
  \ xf tps.tar`）。\n\n```bash\n$ tar cf tps.tar tpsreports/\n$ tar tf tps.tar\ntpsreports/\n\
  tpsreports/sales-report.txt\ntpsreports/coversheet.doc\n$ cd /tmp\n$ tar xf /home/bob/tps.tar\n\
  $ ls tpsreports/\ncoversheet.doc sales-report.txt\n$\n```\n\n如果您想查看正在被放入归包或提取的文件，可以使用\
  \ `-v` 启用详细模式。\n\n```bash\n$ tar cvf misc.tar sec* tpsreports\nsecret\nsecret.bak\n\
  tpsreports/\ntpsreports/sales-report.txt\ntpsreports/coversheet.doc\n$ tar xvf /home/bob/misc.tar\n\
  secret\nsecret.bak\ntpsreports/\ntpsreports/sales-report.txt\ntpsreports/coversheet.doc\n\
  ```\n\n### 压缩文件以节省空间\n\n使用 `gzip` 文件对文件进行压缩。`file.gz` 是生成的压缩文件的名称。\n\n使用 `gunzip`\
  \ 文件解压文件。\n\n使用 `gzcat` 或 `zcat` 并并显示压缩文件。\n\n`du` 命令可以查看文件占用了多少空间。\n\n- `du`: 估算文件使用情况。\n\
  - `du - k`: 以字节（Kilobytes）显示大小。\n- `du -h`: 以人类可读的格式显示大小。例如，`1.2M`、`3.7G` 等。\n\n\
  以下是一些压缩和解压文件的简单示例：\n\n```bash\n$ du -k data\n15360 data\n$ gzip data\n$ du -k data.gz\n\
  26 data.gz\n$ ls data*\ndata.gz\n$ gunzip data.gz\n$ ls data*\ndata\n$ du -k misc.tar\n\
  10 misc.tar\n$ gzip misc.tar\n$ du -k misc.tar*\nmisc.tar.gz\n```\n\n### 压缩归包\n\n\
  在现代版本的 `tar` 命令中，`gzip` 压缩是内置的。如果您想创建、提取或列出压缩归包的内容，请使用 `-z` 参数。按照习惯，压缩的 tar 文件以\
  \ `.tar.gz` 或 `.tgz` 结尾。显示如下：\n\n```bash\n$ tar zcf tps.tgz tpsreports\n$ ls *.tgz\n\
  tps.tgz\n$ tar ztf tps.tgz\ntpsreports/\ntpsreports/sales-report.txt\ntpsreports/coversheet.doc\n\
  ```\n\n如果您遇到没有内置 `gzip` 压缩的旧版本 `tar`，可以使用管道（pipes）来创建压缩归包。当用连字符（`-`）代替文件名时，意味着使用标准输出。运行命令\
  \ `tar cf - pattern` 将创建一个“pattern”的归包并将输出发送到标准输出（通常是您的屏幕）。如果您在执行命令后紧跟一个管道，则该标准输出将作为管道后下一个命令的输入。要强制\
  \ `gunzip` 将输出发送到标准输出，请使用 `-c` 参数。基于此，以下是如何使用 `tar`、`gzip` 和管道创建、列出和提取压缩归包：\n\n\
  ```bash\n$ tar cf - tpsreports | gzip > tps.tgz\n$ ls *.tgz\ntps.tgz\n$ gunzip -c\
  \ tps.tgz | tar tf -\ntpsreports/\ntpsreports/sales-report.txt\ntpsreports/coversheet.doc\n\
  $ cd /tmp\n$ gunzip -c /home/bob/tps.tgz | tar xf -\n$ ls tpsreports/\ncoversheet.doc\
  \ sales-report.txt\n```\n\n### 终端与 Shell 简介\n\n使用 Linux 操作系统需要关于终端（terminal）和命令行（command\
  \ line）的知识。因此，了解这些并熟悉它们的用法以及可标准命令至关重要。但不要担心，我们将详细描述每一个。这些术语听起来比实际上要吓得多。\n\n以文本格式与系统通信的能力是程序员青睐\
  \ Linux 的原因，因为这是程序员向计算机发出指令的标准方式。另一个原因是对系统的绝对控制，这是其他操作系统（即使有它们的命令行解释器）也无法提供的。\n\n\
  一些初学者甚至报告说，使用并熟悉这种文本格式的发布命令使得向程序开发的过渡变得更加容易和快速。\n\n在终端内部运行着一个名为 `shell` 的命令行解释器。终端是您通过\
  \ GUI 与 shell 交互的方式。\n\nDebian 支持很长的终端软件列表。这包括 `Aterm` 和 `GNOME terminal`、`Kterm`、`Mate\
  \ Terminal`、`Rxvt`、`Xterm` 和 `Pvt`。\n\n本书将使用 `GNOME terminal`，因为它的稳定性、简单性和可调整性。例如，要增加或减少终端窗口内显示的内容大小，请使用双键组合\
  \ `CTRL+` 和 `CTRL-`。shell 读取您的命令，在某些条件下对其进行修改，并执行结果。\n\n下表显示了可用的特殊字符：\n\n![Image](img/image00138.gif)\n\
  \n出于兴趣，shell 通过以下过程将命令行分为单个单词以确定命令：\n\n![Image](img/image00139.gif)\n\n在步骤 1 和 2\
  \ 中，标记操作仅发生在步骤 5 到 7，且不会发生任何后续操作。\n\n### 可用的 Shell\n\n您的 Linux 系统允许使用各种 shell。每个\
  \ shell 都通过 Debian 作为独立的包提供。shell 列表很长，所以我们只列出最流行的：\n\n- Almquist Shell (`ash`)\n\
  - Bourne Again Shell (`bash`)\n- Debian Almquist Shell (`dash`)\n- Z Shell (`zsh`)\n\
  - C Shell (`csh`)\n- Korn Shell (`ksh`)\n- Tenex C Shell (`tcsh`)\n\n您的 Linux 系统中允许哪些其他\
  \ shell 在配置文件 `/etc/shells` 中设置。使用 `cat` 命令，您可以查看允许的 shell 列表。目前，只需知道该命令只是输出文件的内容：\n\
  \n```bash\n$ cat /etc/shells\n# /etc/shells: valid login shells\n/bin/sh\n/bin/dash\n\
  /bin/bash\n/bin/rbash\n/usr/bin/screen\n```\n\n当前使用的 shell 名称存储在变量 `$0` 中。以下简单命令输出\
  \ shell 名称：\n\n```bash\n$ echo $0\nbash\n```\n\n## Shell 脚本\n\n乍看之下，shell 脚本听起来可能很难，但其实很简单。在最简单的形式下，它是存储在文件中的\
  \ UNIX/Linux 命令序列，由解释器逐行执行。shell 脚本类似于在终端中输入命令，但它是批量执行的。这使得速度更快并有助于自动化任务。我们将不会深入探讨\
  \ shell 脚本的编程细节。但值得注意 shell 脚本的推荐结构。\n\n- Shebang 行：定义使用哪个程序来处理后续指令。该行以 `#!` 两个字节数字开头，指示后面的行是可执行的\
  \ shell 脚本。shebang 之后是解释器或程序的路径。\n- 文档字符串（Docstring）：对脚本功能的简短描述以及软件许可。这可以是单行也可以是详细描述。此类行以\
  \ `#` 开头，shell 将视为注释。\n- 命令（Commands）：由 shell 执行的单命令组合。如所述，这可以少到一条指令（如我们下面的示例所示），也可以是一个完整的程序。\n\
  - 退出状态（Exit state）：定义脚本的返回值。除非明确说明，否则脚本中执行的最后一个命令的退出状态将被返回。例如，通常成功时返回 `0`，发生错误时返回\
  \ 1 到 255 之间的值。\n\n下面的基础脚本包含了我们提到的所有单个元素。脚本的目的是确定计算机的运行时间。\n\n```bash\n#!/bin/bash\n\
  ```\n\n\n\n\n# 确定系统运行时间\n\n# 根据 GNU 通用公共许可证 (GPL) 发布\n\n`uptime`\n\n# 定义退出状态：无错误\n\
  \n`exit 0`\n\n执行 shell 脚本有两种方法。我们可以调用像 Bash 这样的 shell 来运行它，也可以为脚本设置执行标记并随后运行。第一种方法使用\
  \ Bash，如下所示：\n\n```bash\n$ bash uptime.sh\n12:20:31 up 7 days, 2:09, 6 users, load\
  \ average: 0,74, 0,40, 0,27\n$\n```\n\n第二种方法基于两个步骤。首先，我们使用 `chmod` 命令为脚本设置可执行标记，如下所示：\n\
  \n```bash\n$ chmod u+x uptime.sh\n$\n```\n\n然后我们就可以运行脚本：\n\n```bash\n$ ./uptime.sh\n\
  12:26:07 up 7 days, 2:14, 6 users, load average: 0,23, 0,34, 0,28\n$\n```\n\n##\
  \ 关于 Shell\n\nShell（或 shell 解释器）是一个允许用户与系统交互并处理所指示命令的程序。从 shell 调用的命令可以分为内部命令（它们实际上对应于\
  \ shell 自身解释的命令）和外部命令（它们对应于 shell 外部的可执行文件）。除了命令外，shell 句提供了其他元素来增强其功能，例如变量、函数或控制结构。内部命令和可用元素的集合以及它们的语法将取决于所使用的特定\
  \ shell。\n\n## 用户\n\n除了从命令行使用 shell（以命令提示符作为 shell 宣告其正等待用户命令的指示）外，它还可以被用于解释 shell\
  \ 脚本。shell 脚本或称为“命令脚本”是一个包含一组命令和 shell 可解释的命令的文本文件。\n\nshell 是一个可执行文件，它必须解释命令、将其传递给系统并产生结果。有多种\
  \ shell。最常见的是 `sh`（称为 Bourne shell）、`bash`（Bourne again shell）、`csh`（C Shell）、`tcsh`（Tenex\
  \ C shell）、`ksh`（Korn shell）和 `zsh`（Zero shell）。通常，它们的名称与可执行文件的名称一致。\n\n每个用户都有一个默认\
  \ shell，它在打开命令提示符时会被激活。默认 shell 指定在配置文件 `/etc/passwd` 中，位于对应用户的行的最后一个字段。在会话期间可以更改\
  \ shell。为此，你只需执行相应的可执行文件，例如：\n\n```bash\n/bin/bash\n```\n\n## 系统指示符\n\nshell 在读取其完整配置（位于\
  \ `/etc` 目录下的文件）时启动，然后读取用户自己的配置（一个以点开头的隐藏文件，位于用户的基本目录中，即 `/home/user_name/.configuration_file`）。随后会显示以下指示符：\n\
  \n```\nteam: /directory/current $\n```\n\n默认情况下，对于大多数 shell，指示符由计算机名称组成，后跟一个冒号（`:`）、当前目录，以及一个指示已连接用户类型的字符：\n\
  \n- `$` 指定普通用户；\n- `#` 指定管理员，称为 `root`。\n\n## 命令行概念\n\n命令行是由命令组成的字符字符串，该命令对应于系统的一个可执行文件，或者说，是一个\
  \ shell 命令以及可选参数（参数）：\n\n```bash\nls -al /home/jf/\n```\n\n以 `-` 开头的参数称为选项。通常，对于每个命令，在输入以下命令之一时，会有一定数量的选项可以详细说明：\n\
  \n```bash\ncommand --help\ncommand -?\nman command\n```\n\n## 重定向\n\n与任何 Unix 系统一样，Linux\
  \ 拥有允许将标准输入输出重定向到文件的机制。因此，如果使用 `>` 字符，左侧命令的标准输出可以重定向到右侧的文件：\n\n```bash\nls -al /home/jf/\
  \ > toto.txt\necho “Toto” > /etc/myconfigurationfile\n```\n\n以下命令等同于对文件的复制：\n\n\
  ```bash\ncat toto> toto2\n```\n\n重定向 `>` 的目的是创建一个新文件。如果已存在同名文件，则必须将其删除。以下命令简单地创建了一个空文件：\n\
  \n```bash\n>file\n```\n\n使用双字符 `>>` 允许你将标准输出添加到文件中，即它允许你在不删除文件的情况下在文件末尾添加输出。\n\n\
  同样，`<` 字符表示标准输入的重定向。以下命令使用 `cat` 命令发送 `toto.txt` 文件的内容，`cat` 的唯一目的是在标准输出中显示内容（这个示例并没用，但具有启发性）：\n\
  \n```bash\ncat<toto.txt\n```\n\n最后，使用重定向 `<<` 允许在标准输入中读取，直到找到右侧的链。在下面的示例中，读取标准输入直到找到单词\
  \ `STOP`。然后显示结果：\n\n```bash\ncat<<STOP\n```\n\n## 通信管道\n\n管道是所有 UNIX 系统中特有的特定通信机制。管道用竖线（字符\
  \ `|`）表示，它允许你将一个命令的标准输出分配给另一个命令的标准输入，就像管道允许命令的标准输入与其他标准输出之间进行通信一样。\n\n在下面的示例中，`ls\
  \ -al` 命令的标准输出传递给 `sort`，后者将按字母顺序提取结果：\n\n```bash\nls -al | sort\n```\n\n这允许通过管道连接一定数量的命令。在下面的示例中，显示当前目录下的所有文件，筛选包含\
  \ `zip` 的行，并统计总行数：\n\n```bash\nls -l | grep zip | wc -l\n```\n\n## Linux 中的 Shell\
  \ 脚本\n\n### 调用\n\n在最基本的形式中，shell 脚本可以是包含一个或多个命令的简单文本文件。为了帮助识别内容，shell 脚本通常具有 `.sh`\
  \ 扩展名，我们将遵循这一标准（但记住它是信息性的且可选的）。例如，以下文件就是一个 shell 脚本：\n\n```bash\nScript.sh\necho\
  \ “ 文件夹内容:”\nls ~/\n```\n\n练习：\n1. 验证 `script.sh` 文件具有通用执行权限（如果没有，只需执行 `chmod +x\
  \ script.sh`）。\n2. 调用要解释的脚本，例如使用命令：\n```bash\n./script.sh\n```\n\n除了命令外，shell 脚本可能包含\
  \ shell 提供的其他增强脚本功能的元素。总之，shell 脚本的基本结构如下：\n\n```bash\nscript_ejemplo.sh\n#!/bin/dash\n\
  # 这是注释\necho Hello\nps w\necho “ 读取脚本的进程: $$”\n```\n- `#!` — Shebang\n- `# 注释（不解释）\n\
  - 脚本内容\n\n“shebang”允许在使用隐式调用时指定你希望解释脚本其余部分的命令解释器。该行的语法是：#!` 后紧跟 shell 的可执行文件，在此应注意以下几点：\n\
  \n- 它必须是脚本的第一行，否则它将被解释为注释（以 `#` 字符开头）。\n- `#!` 与 shell 可执行文件之间可以存在空格。\n- shebang\
  \ 不是强制性的（当使用隐式调用时，如果未指定，将尝试使用调用脚本的相同类型的 shell）。\n\n\n\n\n\n# 隐式 (Implicit)\n像执行可执行文件一样调用脚本，这需要为脚本分配执行权限。系统会读取\
  \ shebang 解释器路径来确定应该使用哪种 shell 来读取脚本，并为该 shell 加载一个子进程（子壳）（如果脚本没有 shebang，则子壳将使用与调用时所在的命令行相同类型的\
  \ shell）。请注意，shell 脚本是由命令解释器读取的文本文件，也就是说，它们是被**解释**的。它们**不是**被直接**执行**的。为 shell\
  \ 脚本分配执行权限是一种加速脚本调用的文件系统工具，但其内部功能是加载一个新的 shell 进程（子壳），以便其解释脚本。\n\n# 隐式使用 `.` (等同于\
  \ import): \n脚本将由负责调用脚本的命令行的同一个 shell 进程进行解释。因此，在这种情况下，shebang 也会被忽略。\n\n在创建子壳的情况下，除非强制要求（例如使用\
  \ `su -c`），否则子壳将属于创建它的父 shell 所所属的用户。解释脚本的 shell 进程所属的用户决定了在脚本内部可以执行的操作（例如，如果 shell\
  \ 属于用户 `dit`，则脚本无法修改 `/etc/passwd` 文件，而如果 shell 属于 `root` 超用户，就可以修改）。请考虑这一方面，以确定可以在脚本中执行哪些操作，以及应该以哪个用户调用它。\n\
  \n## 练习\n1. 在命令控制台中，执行命令 `ps w` 并找到与你当前工作的命令行相关的 shell 进程。\n2. 使用不同的调用方法调用该脚本。对于每种方法，分析获取的输出，以确定每种情况下解释脚本的\
  \ shell 进程是什么、该进程属于哪个用户，以及是否打开了子壳：\n\n### 显式 (Explicit)\n```\n/bin/sh script_example.sh\n\
  /bin/dash script_example.sh\n/bin/bash script_example.sh\n```\n\n### 隐式使用 “.”\n\
  ```\n. script_example.sh\n```\n\n### 隐式\n检查脚本是否具有执行权限并使用以下命令执行它：\n```\n./script_example.sh\n\
  ```\n\n虽然 `bash` 和 `dash` 均遵循 POSIX 标准，但 `bash` 增加了许多 `dash` 等其他 shell 不的特定扩展。因此，每当我们设计一个脚本时，必须考虑到支持它的\
  \ shell 或多个 shell，确保它由其中之一调用。为了了解这一方面的重要性，请考虑以下两个基于结构使用（稍后使用）的脚本：\n\n**script_estandar.sh**\n\
  ```bash\n#!/bin/sh\nfor VAR in 0 1 2 3\ndo\necho $VAR\ndone\n```\n\n**script_estandar.sh**\n\
  ```bash\n#!/bin/bash\nfor ((VAR=0 ; VAR<4 ; VAR++ ))\ndo\necho $VAR\ndone\n```\n\
  \n两个脚本的功能相同，但 `script_estandar.sh` 是按照 POSIX 语法编写的，而 `script_bash.sh` 使用了 `bash`\
  \ 支持的非标准语法。\n\n## 练习\n1. 使用以下命令调用脚本 `script_standar.sh`（记住你已经在 `scripts/` 目录下创建了它们），并验证它们是否都工作正常且结果相同（第一次和第二次调用相同，均使用\
  \ shell `dash`）：\n```\n/bin/sh script_estandar.sh\n/bin/dash script_estandar.sh\n\
  /bin/bash script_estandar.sh\n```\n2. 现在使用以下命令调用脚本 `script_bash.sh`：\n```\n/bin/dash\
  \ script_bash.sh\n/bin/bash script_bash.sh\n```\n你可以看到由于由于非标准的脚本语法，第二次调用可以工作，但第一次调用（使用\
  \ dash）会产生语法错误。\n\n# 通用 Shell 操作\nshell 语言是一种解释型语言，其中会读取、分析并处理（以 `\\n` 结尾）的文本行。需要被解释的行从以下位置读取：\n\
  * 标准输入（默认键盘）。在这种情况下，该 shell 被称为交互式 shell。\n* shell 脚本文件。\n* 参数，在运行 shell 时通过选项提供。例如：`bash\
  \ –c “ls –l”`\n\n读取这些行后，shell 会执行以下步骤（按此顺序）：\n1. 将行分为不同的元素：单词和操作符。使用空格、制表符和运算符分隔元素。`#`\
  \ 字符用于包含注释，在处理过程中会被移除。\n2. 在简单命令、复合命令和函数定义之间进行区分。\n3. 进行不同的扩展和替换。检测要执行的命令和要传递的参数。\n\
  4. 执行入站/出站重定向，并将重定向相关的项从参数列表中移除。\n\n# 使用 Shell\n如果不知道如何使用命令行，就不可能成为高效的 Linux 专家。shell\
  \ 提示符表示系统已准备好接收用户命令。这被称为用户与系统的对话。对于输入的每个命令，用户都会收到来自系统的响应：\n1. 另一个提示符，表示命令已执行，你可以进行下一步。\n\
  2. 错误消息是系统对用户关于系统内部发生情况的陈述。\n\n习惯于处理图形界面系统的用户可能会觉得使用命令行很繁琐。相反，这种界面在 Linux 中一直是基础并得到了发展。有很多技术可以节省工作，即在完成\
  \ Linux 常见的活动时：\n* 自动补全命令名或文件名\n* 搜索并重新执行过的命令\n* 通过模式替换文件列表\n\n当你需要对各种对象执行类似的操作时，命令行的优势就显而易见。在图形界面系统中，你需要大量的拖拽；而在命令行中，一个命令就足够了。\n\
  \n# Shell (壳)\n命令行 shell（有时称为命令解释器）是将你的命令发送到操作系统和应用程序，并接收其响应的软件。脚本是用 shell 语言编写的短程序，对文件及其包含的数据执行一系列连续操作。\n\
  \n在输入用户名和密码登录系统后，你会看到命令行提示符（以 `$` 结尾的行）。该符号以后将代表命令行。如果在安装期间指定系统启动时进入图形界面，你可以在任何虚拟文本控制台上进入命令行。你可以通过\
  \ `Ctrl-Alt-F1 - Ctrl-Alt-F6` 或使用终端模拟器程序如 `xterm` 实现。\n\n列出的 shell 可用。根据发行版的不同，它们可能有所差异：\n\
  \nbash\n流行的 Linux shell。它可以为命令和文件名扩展，保留命令历史并允许对其修改。\n\nash\n在 UNIX shell 平台上，korn\
  \ shell 的克隆很有名。\n\nsash\n这种 shell 的独特之处在于不依赖任何共享库，并提供了许多常用工具的简化版本，如 `al`、`dd` 和\
  \ `gzip`。因此，在系统崩溃或更新关键共享库版本时，sash 非常有用。\n\ntcsh\nC shell 的改进版本。\n\nzsh\n列表中最新的 shell。它具有高级功能，如命令参数自动补全以及许多其他让\
  \ shell 操作变得更加方便高效的功能。然而，由于所有 zsh 扩展默认禁用，因此你必须在使用此命令行 shell 之前学习文档并启用你所需的功能。\n\n\
  \n\n\n\nBash Bourne Again Shell 是默认的 shell。使用命令 `echo $ SHELL` 可以查看你正在使用哪个 shell。\n\
  \nshell 之间不仅在功能上不同，在命令语法上也有不同。如果你是新用户，我们建议你从 `bash` 开始；后续的示例将演示该领域的工作。\n\n## Bash\
  \ Shell\n\n`bash` 中的命令行由命令名和后面的按键（选项）组成，按键是改变程序行为的指令。按键通常以字符 —or— 开头，并由一个字母组成。在命令之后，可以添加参数（参数）——命令必须在其中执行的对象的名称（通常是文件和目录的名称）。\n\
  \n按下回车键完成命令输入后，命令将发送到 shell 执行。在用户的终端上，可能会出现有关命令执行或由于命令执行导致失败的通知，而下一个命令行提示符（以 `$`\
  \ 字符结尾）的出现标志着命令已完成，你可以输入下一个命令了。\n\n在 `bash` 中，各种策略使得输入和编辑命令行变得更加简单。例如，你可以使用键盘：\n\
  \n- `Ctrl-A`：跳转到行首。按下 Home 键也可以实现相同的功能；\n- `Ctrl-u`：删除当前行；\n- `Ctrl-C`：中止命令执行。\n\
  \n为了在以前运行过的命令中识别特定的命令而无需回顾整个历史，请按下 `Ctrl-R` 并输入你要查找的命令中使用的术语。\n\n历史记录中出现的命令是有编号的。要运行特定的命令，请输入：\n\
  \n`! command number`\n\n如果你输入 `!!`，则会开始你刚刚输入的命令。\n\n在 Linux 上，应用程序和命令名称有时可能长。幸运的是，`bash`\
  \ 可以为你补全名称。你可以使用 `Tab` 键补全命令、程序或目录的名称。假设你想使用 `bunzip2` 解压缩应用作为示例。为了这样做，开始输入：\n\n\
  `bu`\n\n然后按下 `Tab` 键。如果没有发生任何事情，说明还有其他完成指令的可能性。通过再次按下 `Tab` 键，你将获得以字母 `bu` 开头的名称列表。例如，系统包含以下程序：`buildhash`、`builtin`\
  \ 和 `bunzip2`：\n\n```\n$ bu\nbuildhash builtin bunzip2\n$ bu\n```\n\n在输入 `n>` 后按下\
  \ Tab（`bunzip2` 是唯一以 `n` 作为第三字母的名称）。shell 将为你补全名称，你现在只需要按回车键执行该命令了！\n\n`bash` 会在\
  \ `PATH` 系统变量定义的文件夹中搜索从命令行调用的程序。默认情况下，当前目录（用 `./` 表示）不包含在此目录列表中（点斜杠）。因此，你必须使用命令\
  \ `./prog` 从当前目录启动 `prog` 程序。\n\n## 基础命令\n\n处理数据（通常存储在文件中）和管理在系统上运行的程序（进程）是任何系统中必须完成的首要活动。下面列出的命令允许你在处理文件和进程时执行最常见的任务。只有第一个命令\
  \ `cd` 包含在 shell 自身中；其他命令是单独提供的，但在每个 Linux 系统上始终可用。下面列出的所有命令都可以在文本和图形模式（xterm, KDE\
  \ console）下使用。使用 `man` 命令学习更多关于每个命令的知识，例如：\n\n```\nman ls\ncd\n```\n\n### `cd`\n\
  \n允许你更改当前目录（遍历文件系统）（导航文件系统）。它同时支持绝对路径和相对路径。假设你在主目录中并想访问 `tmp/` 子目录。为了这样做，输入以下相对路径：\n\
  \n`cd tmp/`\n\n要进入 `/usr/bin/` 目录（绝对路径），输入：\n\n`cd /usr/bin/`\n\n该命令的一些选项有：\n\n\
  - `cd ..`：允许你进入父目录（注意 `cd` 和 `..` 之间的空格）。\n- `cd -`：无参数时返回主目录。\n\n### `ls`\n\n`ls`（列表）显示当前目录下的文件。两个主要选项：`-a`\
  \ 显示所有文件包括隐藏文件，`-l` 显示详细信息。\n\n### `rm`\n\n此命令用于删除文件。警告：删除的文件无法恢复！语法：`rm filename`。\n\
  \n该程序有多个参数。常用的是：`-i` 请求删除，`-r` 递归删除（即子目录和隐藏文件）。示例：\n\n```\nrm -i ~/html/*.html\n\
  ```\n\n删除 `html` 目录下所有的 `.html` 文件。\n\n### `mkdir`, `rmdir`\n\n`mkdir` 命令允许你创建目录，而\
  \ `rmdir` 删除目录（前提是它是空的）。语法：\n\n```\nmkdir dir_name\nrmdir dir_name\n```\n\n`rmdir`\
  \ 命令经常被 `rm -rf` 命令取代，后者即使目录为空也能删除。\n\n### `less`\n\n`less` 允许你逐页查看。语法：`less filename`\n\
  \n### `grep`\n\n此命令允许你在文件中搜索特定的字符字符串。请记住 `grep` 搜索使用正则表达式，这意味着你可以指定一个模板来一次搜索一组术语。正则表达式允许你创建描述字符串类的模式，例如“空格周围的四个数字”。显然，这种表达式可以用于查找文本中所有的数字年份。正则表达式具有广泛的搜索功能。你可以在屏幕文档\
  \ (`man grep`) 中获取更多关于 `grep` 的信息。语法：`grep search_file`\n\n### `ps`\n\n显示活动进程列表。命令列显示进程名，PID（进程标识符）是进程号（与进程的操作所需的，例如使用\
  \ `kill` 命令发送信号）。语法：\n\n```\nps arguments\n```\n\n参数 `u` 提供额外信息，而 `ax` 允许你观察不属于你的进程。\n\
  \n### `kill`\n\n如果程序停止响应或挂起，使用此命令将其完成。语法：`kill PID_number`。\n\nPID 号指的是进程标识码。\n\n\
  \n\n\n\n如果你需要一个简单的比较，Linux 操作系统中的 `bash` shell 类似于 Windows 操作系统提供的命令提示符（command\
  \ prompt）程序，但你可以说，`bash` 中使用的脚本语言与命令提示符可以执行的脚本相比复杂得多。`Bash` 也可以与从 Windows 7 和 Windows\
  \ Server 2008 R2 开始提供的 PowerShell 实用相比。许多专业人士将 `bash` shell 称为一个非常强大的管理工具。你可以使用\
  \ `bash` shell 提供的脚本语言自动化 Linux 系统上的许多任务。此外，`bash` shell 还有执行许多其他任务的选项，这些任务如果尝试通过图形界面操作将变得复杂甚至是不可能的。\n\
  \n`bash` shell 通过名为终端（terminal）的工具访问。终端的输入设备是你的键盘，输出设备是你的显示器。Linux 操作系统还提供了所谓的虚拟控制台（virtual\
  \ consoles），也可以用它们访问 `bash` shell。因此，你将在基础物理控制台上拥有多个虚拟控制台，且每个虚拟控制台都可以作为一个独立的终端。此外，你可以使用每个虚拟控制台为不同的用户创建登录会话。\n\
  \n### Shell 基础\n\n在 shell 提示符上输入的命令由三个部分组成：\n\n1. 你想要运行的命令\n2. 定义命令行为的选项（Options）\n\
  3. 参数（Arguments），即命令的目标\n\n命令基本上定义了你想要执行的程序。跟在命令后的选项可以是零、一个或多个。选项控制命令的行为并定义命令将执行的操作。选项通常使用一个连字符（-）或两个连字符（--）。这样做是为了让我们能够区分选项和参数。例如：`-a`\
  \ 或 `--all`。\n\n参数也位于命令行的命令后面，可以像选项一样是一个或多个。参数指示了命令应该操作的目标。\n\n让我们来看一个示例命令：\n\n\
  ```\nusermod -L John\n```\n\n此示例中的命令是 `usermod`。\n选项是 `-L`。\n参数是 `John`。\n\n这条命令的作用是锁定系统中用户\
  \ `John` 的密码。\n\n为了有效使用命令行上的命令，用户需要知道特定命令可以使用哪些选项。如果你在运行任何命令时带有 `--help` 选项，你将获得一组可以传递给该特定命令的选项。因此，其实没有背诵所有命令将要使用的选项。列表还会告诉你每个选项的作用。\n\
  \n使用语句（use statements）有时看起来非常困难且难以阅读。一旦习惯了某些惯用法，阅读语句就会变得简单得多。\n\n*   选项被方括号 `[ ]`\
  \ 包围\n*   如果命令后面跟着 `…`，它指定属于该类型的任意项目列表\n*   如果有多个项目且如果用管道符 `|` 将它们隔开，则意味着你只能指定其中一个\n\
  *   变量使用角括号 `<>` 括起来的文本表示。因此，如果你看到 `<filename>`，你必须将其替换为想要传递的文件名\n\n例如，检查下方的命令：\n\
  \n```bash\n[student@desktop ~]$ date --help\ndate [OPTION]… [+FORMAT]\n```\n\n这表示命令\
  \ `date` 接受 `[OPTION]…` 表示的选项，以及另一个选项 `[FORMAT]`，后者将以 `+` 符号为前缀。\n\n### 在 Bash Shell\
  \ 上执行命令\n\n再次布恩 Shell（Bourne Again Shell，称为 `bash`）负责解释用户在 shell 提示符上输入的命令。我们已经学习了你在\
  \ shell 提示符中输入的字符串是如何被分为三个部分的：命令、选项和参数。你在 shell 中输入的每个单词都使用空格分隔。系统中已安装的程序由你输入的每个命令定义，并且每个命令都有与其关联的选项和参数。\n\
  \n当你在 shell 提示符上输入带有选项和参数的命令并准备好运行时，你可以按下键盘上的 Enter 键，这将执行该命令。如果你想在单行上输入多个命令，可以使用分号（`;`）来分隔命令。\n\
  \n让我们回顾一些在 Red Hat Enterprise Linux 7 和其他基于 Linux 的操作系统的日常命令行操作中使用的简单命令。\n\n`date`\
  \ 命令将显示系统的当前日期和时间。你也可以使用此命令来设置系统时间。如果你为 `date` 命令传递一个带有 `+` 符号的参数，它表示你希望在输出中显示日期的格式。\n\
  \n```bash\n[student@desktop ~]$ date\nSat Aug 5 08:15:30 GMT 2019\n\n[student@desktop\
  \ ~]$ date +%R\n08:15\n\n[student@desktop ~]$ date +%x\n08/05/2019\n```\n\n`passwd`\
  \ 命令可用于更改用户的密码。然而，在设置新密码之前，你需要指定指定用户的原始密码。该命令要求你指定一个强密码，这使得包含小写字母、大写字母、数字和符号变得必要。你还需要确保指定的密码不是字典中的单词。root\
  \ 用户有权更改系统上任何其他用户的密码。\n\n```bash\n[student@desktop ~]$ passwd\nChanging password\
  \ for user student.\nChanging password for student.\n(current) UNIX password: type\n\
  New password: \nRetype new password: \npasswd: password updated successfully.\n\
  ```\n\n文件类型和扩展在 Linux 系统中没有指定。`file` 命令可以扫描任何文件并告诉它的类型。你需要将文件作为参数传递。\n\n```bash\n\
  [student@desktop ~]$ file /etc/passwd\n/etc/passwd: ASCII text\n```\n\n如果你将文件夹/目录作为参数传递给\
  \ `file` 命令，它会告诉你这是一个目录。\n\n```bash\n[student@desktop ~]$ file /home\n/home: directory\n\
  ```\n\n组命令是 `head` 和 `tail`，它们分别打印文件的开头行和结尾行。这两个命令都可以结合 `-n` 选项使用，该选项用于指定你想显示的行数。\n\
  \n```bash\n[student@desktop ~]$ head /etc/passwd\n这将会显示 passwd 文件的前 10 行。\n\n[student@desktop\
  \ ~]$ tail - n 3 /etc/passwd\n这将会显示 passwd 文件的最后 3 行。\n```\n\n`wc` 命令用于统计指定文件的行、单词和字符。它支持\
  \ `-l`、`-w`、`-c` 等选项，分别代表行、单词和字符。\n\n```bash\n[student@desktop ~]$ wc /etc/passwd\n\
  30 75 2009 /etc/passwd\n```\n\n这显示 passwd 文件中有 30 行、75 个单词和 2009 个字符。\n\n如果你在使用\
  \ `wc` 命令时传递 `-l`、`-c、`-w` 选项，它将根据你传递的选项仅显示行、单词或字符的计数。\n\n你可以配合命令号使用 `!` 来扩展在该命令中输入的内容及其输出。\n\
  \n```\n[student@desktop ~]$ history\n1 clear\n2 who\n3 pwd\n\n[student@desktop ~]$\
  \ !3\n/home/student\n```\n\n这显示我们使用了 `!3` 来扩展 `pwd` 命令，该命令显示了当前工作目录，其输出为 `/home/student`，这是\
  \ student 用户的家目录。\n\n你可以使用方向键在 `history` 命令的输出中导航。向上箭头将带你进入上方命令，向下箭头将带你进入下方的命令。使用右箭头和左箭头，你可以在当前命令中移动并对其编辑。\n\
  \n\n\n\n当你在 `bash` 中交互时，命令行上提供了一项编辑功能。这可以帮助你移动正在输入的命令，以便进行编辑。我们已经看到了如何使用方向键配合 `history`\
  \ 命令在命令之间移动。以下列表将帮助你在处理特定命令时使用编辑功能。\n\n- `Ctrl+a`：这将把光标带到命令行的开头。\n- `Ctrl+e`：这将把光标带到命令行的末尾。\n\
  - `Ctrl+u`：清空从光标位置到行首的内容。\n- `Ctrl+k`：清空从光标位置到行尾的内容。\n- `Ctrl+右箭头`：将光标移动到下一个单词的开头。\n\
  - `Ctrl+r`：在历史命令列表中搜索模式。\n\n## Shell 脚本\n\n## Shell 脚本\nshell 是 `Unix` 等操作系统中的命令解释器。`Linux`\
  \ 是一个使用其他程序的程序。它为 `Unix/GNU` 系统提供了一个计算机接口，用于使用带有特定安装的不同命令或工具。当 shell 完成程序处理后，它会将输出发送到用户的屏幕上，即标准输出。shell\
  \ 不仅仅是解释命令。它的系统语言具有完整的结构，如性能、灵活性、任务等。这就是为什么 `Unix/GNU` shell 比 `Windows` shell 更强大。\n\
  \n## Bash Shell\n`Bash` 代表 Bourne Again Shell，是当今大多数 `Linux` 发行版的默认 shell。它还具有与\
  \ shell 关联的功能，并在系统中提供了更高效的开发支持，包括：\n- 编辑命令行\n- 性能管理\n- 无限命令历史\n- 别名\n- 无限制布局\n-\
  \ 任何基础的算术运算\n\n## Tcsh / Csh\n`Tcsh` 基于 `C-shell` 开发，可以作为兼容的登录 shell 和脚本命令处理器。`Tcsh`\
  \ 具有以下特性：\n- `C` 语法\n- 命令行编辑器\n- 和文件补全\n- 拼写检查\n- 性能管理\n\n## Zsh 的 Shell\n`Zsh`\
  \ 设计用于与其他许多 `Unix/GNU` shell 集成，例如 `bash`、`tcsh` 和 `Ksh`。并拥有与其他可用 shell 一样强大的编写语言。它具有一些独特的特性，包括：\n\
  - 文件名生成\n- 启动文件\n- 登录\n- 结论总结\n- 概念指南\n- 灵活索引\n\n## Fish\n`fish` 是一个友好的交互式 shell，记录于\
  \ 2005 年。它被设计为功能全且易于使用，与其他 shell 一样，具有卓越特性：\n- 页面补全\n- 基于 Web 的配置\n- 自动建议\n- 完全用纯脚本编写\n\
  - 终端支持\n\n# 使用 Linux 的优势\n大多数计算机新手会说“Linux 很复杂”或“Linux 很难”。当然，确实存在只有激情专家才能操作的 `Linux`\
  \ 发行版，但也有些明确为普通公众设计的：`Linux Mint`、`Ubuntu` 及其衍生版本。你会发现 `GNU/Linux` 使用非常简单，而且比大多数人想象的要友好得多。\n\
  \n使用此软件，你就是局面的主人。除非你明确要求，否则 `GNU/Linux` 什么都不会做，这与几乎由系统决定一切而非由用户决定的专用系统不同。你不需要被强制安装你想要的东西，在你现有的系统仍在良好运行时，也不会被强加一个全新的系统。相反，你可能从开始就就不需要卸载任何东西；没有杀毒软件试用，没有密钥，没有锁定，简而言之，没有垃圾软件。在依赖\
  \ `Windows` 多年后，`Linux` 赋予的自由可能会令人恐惧。然而，应该理解的是 `GNU/Linux` 允许你操控你的操作系统，使其成为一个按照你品味和需求的空间，就像它赋予你做任何事情的权利一样。\n\
  \n## 安全\n在 `Linux` 上不需要杀毒软件。这听起来很不可思议，但它是事实，因为这个操作系统的构建初衷就是为了尽可能安全。它是 Unix 类系统（`Linux`、`BSD`）基因的一部分，在这些系统中，安全性是系统其他组件同样本质元素。尽管各种说法，大多数计算机操作员试图解释\
  \ `Linux` 的安全性构建。一方面，一些操作员认为 `Linux` 上有病毒，因此保护自己至关重要；另一些人则认为杀毒软件只能检测针对 `Windows`\
  \ 的病毒。此外，`Linux` 世界的多样性意味着影响一个发行版的病毒可能不会影响另一个。\n\n`Linux` 系统最常见的安全要求是，在你登录时或想要执行潜在危险的系统修改操作（更新、安装新软件等）时，会要求密码。当你想要访问某些文件时也需要密码，因为这可以防止某些在你不在场时搜索你的数据。至于更新，它们看起来频率低得多，而且在大多数情况下执行速度快得多。我们有时听到\
  \ `Windows` 设计是为了一件事：运行。起初，安全甚至不是首要考虑的问题，其考虑程度如此小，以至于被委托给了第三方软件。因此，产生了利润丰厚的杀毒软件和反恶意软件行业。即使有人可以认为现在\
  \ `Microsoft` 严重重视安全问题，但持续且频繁的安全更新流应该鼓励所有用户对 `Microsoft` 操作系统的可靠性提出严肃的问题。\n\n##\
  \ 宁静与效率\n尽管某些发行版很复杂，但某些 `GNU/Linux` 发行版非常适合初。因此，一切的设计都是为了让初者的生活变得更容易。这意味着你不需要计算机科学的硕士学位就能操作\
  \ `Linux`。此外，`GNU/Linux` 提供了一个在技术和人性化方面都可靠的环境。当你第一次安装完一个发行版时，它最引人注目的是其极简的外观。通常，桌面上只有两个图标：“工作站”和一个个人文件夹。甚至没有垃圾箱！这看起来可能很原始，但它也是\
  \ `GNU/Linux` 体验的象征：简单和选择。\n\n\n\n\n## 快捷键\n\n- `Tab`: 这将补全命令或文件名。如果有多个选项，系统将使用视觉或音频通知提示你。如果系统检测到很多可能性，它会询问你是否想要检查所有选项。\n\
  - `Tab`: 这将显示文件名或命令的补全选项。\n- `Ctrl + A`: 将光标移动到当前命令行的开头。\n- `Ctrl + C`: 这将结束你的计算机程序并显示\
  \ Linux 提示符。\n- `Ctrl + D`: 这将退出当前的会话。这是一个类似于输入 `exit` 或 `logout` 的组合键。\n- `Ctrl\
  \ + E`: 这将光标移动到当前命令行的末尾。\n- `Ctrl + H`: 功能与按下键盘上的退格键（backspace）类似。\n- `Ctrl + L`:\
  \ 这将清除当前终端。\n- `Ctrl + R`: 这将搜索历史命令。\n- `Ctrl + Z`: 这将允许你挂起计算机。\n\n## 程序\n\n- `右箭头/左箭头`:\
  \ 这些键将让你更容易地在当前所在的命令行中移动光标。你可能会发现添加更多字符或对程序进行某些更改很有用。\n- `上箭头/下箭头`: 这些键将让你更容易地浏览系统历史记录。你可以访问任何想要重复的行，在需要时更改某些数据，然后按\
  \ `Enter` 快速执行这些新命令。\n- `Shift + Page Up/Shift + Page Down`: 使用这些组合键允许你检查终端缓冲区。\n\
  \n随着你对 Linux 系统变得越来越熟悉，你将开始更好地理解这些命令是如何工作的，并学习其他命令，这会让使用 Linux 系统变得更加容易。这些是你应该学习如何使用的初始命令，因为它们会让你在系统中的导航变得简单得多。尝试一下，并练习登录和退出系统，以便在继续之前先对它的运行方式有一个感觉。\n\
  \n## 瞬息之间新版本\n\n在 Linux 上，如果你想更改版本（例如为了获得最新的操作系统），大多数发行版都需要完全重新安装。在 Windows 下，这种操作非常费力且耗费大量时间。更改\
  \ GNU/Linux 版本如此简单，甚至可以快速成为一种常态。\n\n要在 Linux Mint 中执行此操作，请前往更新管理器安装最新的可用版本。注意的是，安装最新版本并不意味着更改整个软件。GNU/Linux\
  \ 提供的操作系统足够轻量，可以在内存小于 4 GB 的计算机上运行。\n\n通常，考虑到目前的 Linux 发行版，配备 4 GB 内存的入门级电脑对于日常使用来说几乎是过剩。安装\
  \ Linux Mint 的建议最低配置是 9 GB 磁盘空间和 256 MB 内存（1GB 更为舒适）。显然，某些软件可能需要略大于 1 GB 的内存。但在\
  \ 1 到 4（或 8 GB）内存之间，空间是足够的的。\n\n发行版的不同版本通常以“长周期”提供，通称为 `LTS`（长期支持）。例如，自 2016 年春季起提供的\
  \ Linux Mint 18 将支持到 2021 年春季。对于其他版本，如果你知道复制和粘贴，你就可以重新安装软件并替换为最新版本。最重要的是，你可以恢复旧系统所有的软件配置，包括你的电子邮件、设置，以及包含扩展在内的浏览器完整参数。\n\
  \n这种魔法是如何实现的？GNU/Linux 发行版的优势在于所有个人文件都存储在一个命名的单一文件夹中。该文件夹还包含隐藏目录，这些目录包含了你软件的所有设置。GNU/Linux\
  \ 不会侵犯用户。\n\nGNU/Linux 是一个不会剥削你的操作系统。默认安装不包含比常用且功能全软件之外的内容。Linux 社区和自由软件开发者并不关心你对你完全负责计算机做什么，你对此负全部责任。\n\
  \nGNU/Linux 发行版不会向“第三方”暗示、分析或传输你的任何操作，因为这可能会违反用户的隐私。\n\n## Linux 技巧与技巧\n\n有数千条命令行，这使得在短时间内执行任务成为可能。与其页一页地翻阅，单个命令就可以帮助你在几秒钟内获得想要的内容。\n\
  \n在 Linux 上，你必须注意某些 Windows 快捷键可能会执行完全不同的功能。因此，不要期望 `Ctrl + S` 在 Linux 上帮助你保存项目。\n\
  \n```\nls\n```\n\n此命令用于列出文件夹中的文件。你可以使用 `-a` 列出隐藏文件，使用 `-l` 显示详细列表，使用 `-R` 查看子文件夹；`cd`\
  \ 切换目录命令用于在现有文件系统中导航。例如，`cd /var/log` 进入日志文件夹。无论你在哪里，这都是有效的，因为我们放置了起始斜杠，这表示这是一个绝对地址。\n\
  \n```bash\npwd\n```\n\n打印工作目录。此命令显示你当前所在文件夹的绝对路径。\n\n```\nclear\n```\n\n这用于清理你的终端窗口，将上面的所有文本推后，为你留下一个干净的窗口。键盘快捷键\
  \ `Ctrl + l` 执行相同的操作。\n\n```\nCtrl + s\n```\n\n停止显示；当你误输入错误命令时，这非常有用。\n\n# 结论\n\n\
  总之，你已经足够的信息来开始并使用你所选择、安装并开始尝试的 Linux。希望你发现这个过程对你很有启发且有价值。\n\n作为初学者，你应该熟悉这些 Linux\
