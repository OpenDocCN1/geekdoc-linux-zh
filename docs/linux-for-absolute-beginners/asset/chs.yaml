  \n### 常用 ls 选项\n\n这里是对你学过的 `ls` 选项的回顾：\n\n![Image](img/image00137.gif)\n\n### 在文件名中使用空格\n\
  \n如果你想在从命令行操作时让生活更轻松，请不要在文件名和目录名中使用空格。连字符（`-`）或下划线（`_`）可以是空格的良好替代。驼峰命名法（CamelCase，即每个单词字母大写的做法）是另一个很好的选择。例如，与其将你最新的文学尝试命名为“the\
  \ next great american novel.txt”，你可以使用“the-next-great-american-novel.txt”、“the_next_great_american_novel.txt”\
  \ 甚至是“TheNextGreatAmericanNovel.txt”。\n\n早晚你都会遇到名称中包含空格的文件或目录。处理这种情况有两种方法。第一种是使用引号。尽管文件名是一个文件，但使用“a\
  \ file”来对其进行操作。第二种选择是转义空格。转义就像使用引号，但针对的是单个字符。转义符号是 `\\`，也称为反斜杠。要转义空格，请在空格前加上反斜杠字符（`\\\
  `）。\n\n```\n$ ls -l\n-rw-r—r— 1 bob users 18 Oct 2 05:03 a file\n\n$ ls -l a file\n\
  ls: a: No such file or directory\nls: file: No such file or directory\n\n$ ls -l\
  \ \"a file\"\n-rw-r—r— 1 bob users 18 Oct 2 05:03 a file\n\n$ ls -l a\\ file\n-rw-r—r—\
  \ 1 bob users 18 Oct 2 05:03 a file\n\n$ ls -lb a*\n-rw-r—r— 1 bob users 18 Oct\
  \ 2 05:03 a\\ file\n```\n\n`ls` 的 `-b` 选项会导致其打印转义代码。注意，引用和转义不仅适用于空格，也适用于特殊字符，包括\
  \ `|`、`&`、`'`、`;`、`(`、`)`、`< `>`, 空和制表符。\n\n### 深度学习\n\n- Linux 和 Unix 中的特殊字符转义：带\
  \ 7 个实用示例：一篇深入探讨转义的文章。\n- `man ls`：要学习 `ls` 的所有可用选项，请参考手册（man page）。\n\n### 删除、复制、移动和重命名文件\n\
  \n#### 删除文件\n\n最终，你会厌倦你创建的所有旧文件到处都是，弄乱你的主目录并并了宝贵的空间。要删除它们，请使用 `rm` 命令。\n\n`rm file`：删除文件。\n\
  `rm -r directory`：递归删除目录及其内容。如果你想用 `rm` 删除目录，则必须提供 `-r` 参数。\n`rm -f file`：强制删除且从不提示确认。\n\
  \n可以使用搜索模式来同时删除多个文件。在执行 `rm` 之前，用 `ls` 双重检查你想要删除的内容是个好主意。\n\n```\n$ ls s*\nsales-lecture.mp3\
  \ sales.data secret secret.bak\n\n$ rm s*\n\n$ ls -d .*\n. .. .profile .bash_history\n\
  \n$ rm .*\nrm: cannot remove ‘.’: Is a directory\nrm: cannot remove ‘..’: Is a directory\n\
  \n$ ls -d .*\n. ..\n```\n\n注意 `rm .*` 不会删除 `.`（当前目录）和 `..`（父目录）。\n\n#### 复制文件\n\n\
  要复制文件，请使用 `cp` 命令。如果你想创建一个文件的副本，可以运行 `cp source_file destination_file`。你也可以通过 `cp\
  \ file(s) dir` 将文件或一系列文件复制到目录。\n\n`cp source_file destination_file`：将 `source_file`\
  \ 复制到 `destination_file`。\n`cp source_file1 [source_fileN …] destination_directory`：将\
  \ `source_files` 复制到 `destination_directory`。\n`cp -i source_file destination_file`：以交互模式运行\
  \ `cp`。如果目标文件已存在，`cp`将在覆盖之前询问你。\n`cp -r source_directory destination`：将 `source_directory`\
  \ 递归复制到目标。如果目标存在，则将 `source_directory` 复制到目标中，否则用目录内容创建目标。\n\n```\n$ cp file1 file2\n\
  $ mkdir dir\n$ cp file1 file2 dir/\n$ ls dir\nfile1 file2\n\n$ rm dir/*\n$ cp file1\
  \ file2\n```\n\n#### 移动和重命名文件\n\n在 Linux 中移动或重命名文件是使用 `mv` 命令。`mv` 命令可以将文件或目录移动到另一个位置。\n\
