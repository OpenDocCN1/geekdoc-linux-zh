  \n`wc` 命令代表“word count”（单词计数），是 Linux 命令之一。它可以被用于统计文件有多少行。例如，如果你想知道如‘first’这样的文件中有多少行，执行以下操作：\n\
  \n```bash\nwc –l first\n```\n\n上述命令显示我们的文件只有两行，这是事实。若要同时获取行数和文件名，请执行以下操作：\n\n```bash\n\
  wc –l first\nwc first\n```\n\n命令将输出文件的行数、文件的单词数以及文件的总字节数。文件名也将被显示。注意这些将按照上述顺序显示，所以不要混淆。上述命令可以被拆分以便你逐个查看详情。你还可以返回搜索标准之上的行数。\n\
  \n```bash\ngrep –iB1 ‘enjoying’ first\n```\n\n这将返回包含搜索标准‘enjoying’的行正上方。\n\n###\
  \ `Last` 命令\n\n有时，你可能需要查看系统的登录列表。这对于在生产环境中使用 Linux 的人很有用，特别是出于安全考虑。人们无法否认登录过系统。只需进入命令行并输入\
  \ `last.`。你将看到登录到系统的用户、他们使用的终端以及登录日期和时间。如果这些用户仍处于登录，你也将收到通知。\n\n运行下方所示命令：\n\n```bash\n\
  last -100\n```\n\n\n\n\n上述程序将显示最近的 100 次登录记录。还会显示登录和注销时间之间的差异。\n\n`last` 命令的其他选项包括：\n\
  1. `-R`：这将抑制主机名的显示。\n2. `-a`：在最后一列显示主机名。\n3. `-d`：用于远程登录。Linux 存储 IP 地址并将其转换为主机名。\n\
  4. `-F`：打印完整的登录和注销日期时间。\n5. `-i`：以数字形式显示远程主机的 IP 地址。\n6. `-w`：输出显示域名和全名。\n7. `-x`：显示关机条目以及级别变更。\n\
  \n注意的是，`last` 命令会搜索 `/var/log/wtmp` 文件。该文件负责存储登录系统用户的用户名。该命令将显示自该文件创建以来的注销记录，因此你可以随时查阅此文件。如果你需要显示所有登录过系统的用户，请运行以下命令：`more`\
  \ 或 `less`。\n\n```\nlast | more or less\n```\n\n上述命令再次搜索 `/var/log/wtmp` 以查找这些用户。由于输出内容可能过多，无法在一个屏幕显示，请使用\
  \ `more` 或 `less` 命令，以便输出一次显示一页。与其了解所有用户的登录和注销时间，你可能只对某个特定用户感兴趣。通过 `last` 命令，可以很容易地实现这一点：\n\
  \n```\nlast username\n```\n\n你可能对主机主机名感兴趣。如上所述，可以使用 `-R` 选项隐藏它。要使用此选项，请执行以下操作：\n\
  \n```\nlast -R\n```\n\n年份是默认的登录和登录时间。你可能对这些完整时间感兴趣。可以通过以下方式实现：\n\n```\nlast -F\n\
  ```\n\n如你所见，时间已完整显示，而不是只显示年份。这显示了 `last` 命令有多强大。下面是使用 `last` 命令的其他几个选项。要查看自文件创建以来机器的重启历史：\n\
  \n```\nlast -x reboot\n```\n\n要查看机器最后一次关机的时间：\n\n```\nlast -x shutdown\n```\n\n\
  ### 列出文件和理解 ls\n\n这里是使用 `-l` 选项的 `ls` 命令输出。`-l` 标志告诉 `ls` 以长格式显示输出。如果你需要查看存在哪些文件或目录，请使用\
  \ `ls`。但如果你需要详细信息，请使用 `ls -l`。\n\n```\nls -l\n-rw-rw-r-- 1 bob users 10400 Sep 27\
  \ 08:52 sales.data\n```\n\n`ls` 输出的最左侧是一系列表示文件权限的字符。权限后面的数字代表指向文件的链接数。下一部分信息是文件的所有者，然后是组名。接着显示文件大小，然后是文件修改的日期和时间。最后显示文件或目录的。以下是\
  \ `ls -l` 命令以表格形式显示的信息：\n\n![Image](img/image00135.gif)\n\n### 列出所有文件（包括隐藏文件）\n\n\
  名称中带有点（`.`）的文件和文件夹被视为隐藏文件，默认不显示。使用 `-a` 选项来显示这些隐藏文件和目录。\n\n```\nls -a\n.\n..\n.profile\n\
  .bash_history\nsales-lecture.mp3\nsales.data\ntpsreports\n```\n\n到为止，当你使用选项时，在每个选项前都加了一个连字符（`-`）。例如\
  \ `-l` 和 `-a`。组合不需要参数的选项是可能的。只需要一个连字符，后面跟上选项。如果你想显示带有隐藏文件的长 `ls` 列表，可以运行 `ls -l\
  \ -a` 或 `ls -la`。你甚至可以更改标志的顺序，所以 `ls -al` 同样有效。它们都是的。\n\n```\nls -l\ntotal 2525\n\
  -rw-r--r-- 1 bob sales 2562856 Sep 27 08:54 sales-lecture.mp3\n-rw-r--r-- 1 bob\
  \ users 10400 Sep 27 08:52 sales.data\ndrwxr-xr-x 2 bob users 512 Sep 28 14:49 tpsreports\n\
  ```\n\n```\nls -l -a\ntotal 2532\ndrwxr-xr-x 4 bob sales 512 Sep 28 14:56 .\ndrwxr-xr-x\
  \ 14 root root 512 Sep 27 08:43 ..\n-rw-r--r-- 1 bob users 28 Sep 28 14:22 .profile\n\
  -rwrw------- 1 bob users 3314 Sep 28 14:56 .bash_history\n-rw-r--r-- 1 bob sales\
  \ 2562856 Sep 27 08:54 sales-lecture.mp3\n-rw-r--r-- 1 bob users 10400 Sep 27 08:52\
  \ sales.data\ndrwxr-xr-x 2 bob users 512 Sep 28 14:49 tpsreports\n```\n\n```\nls\
  \ -la\ntotal 2532\ndrwxr-xr-x 4 bob sales 512 Sep 28 14:56 .\ndrwxr-xr-x 14 root\
  \ root 512 Sep 27 08:43 ..\n-rw-r--r-- 1 bob users 28 Sep 28 14:22 .profile\n-rwrw-------\
  \ 1 bob users 3314 Sep 28 14:56 .bash_history\n-rw-r--r-- 1 bob sales 2562856 Sep\
  \ 27 08:54 sales-lecture.mp3\n-rw-r--r-- 1 bob users 10400 Sep 27 08:52 sales.data\n\
  drwxr-xr-x 2 bob users 512 Sep 28 14:49 tpsreports\ndrwxr-xr-x 4 bob sales 512 Sep\
  \ 28 14:56 .\ndrwxr-xr-x 14 root root 512 Sep 27 08:43 ..\n-rw-r--r-- 1 bob users\
  \ 28 Sep 28 14:22 .profile\n-rwrw------- 1 bob users 3314 Sep 28 14:56 .bash_history\n\
  -rw-r--r-- 1 bob sales 2562856 Sep 27 08:54 sales-lecture.mp3\n-rw-r--r-- 1 bob\
  \ users 10400 Sep 27 08:52 sales.data\ndrwxr-xr-x 2 bob users 512 Sep 28 14:49 tpsreports\n\
  ```\n\n### 列出文件按类型\n\n当你使用 `-F` 选项时，文件名后面会加上一个字符来指示文件类型。例如，目录后面会有一个 `/`，符号链接后面会有一个\
  \ `@`。\n\n```\nls -F\n```\n\n输出将如下：\n\n```\nsales.data\nsales-lecture.mp3\ntpsreports/\n\
  ```\n\n### 列出文件按大小\n\n如果你使用 `-S` 选项，`ls` 将按文件大小进行排序。\n\n```\nls -S\n```\n\n输出将如下：\n\
  \n```\n-rw-r--r-- 1 bob sales 2562856 Sep 27 08:54 sales-lecture.mp3\n-rw-r--r--\
  \ 1 bob users 10400 Sep 27 08:52 sales.data\n```\n\n### 列出文件按时间\n\n如果你使用 `-t` 选项，`ls`\
  \ 将按修改时间进行排序。\n\n```\nls -t\n```\n\n输出将如下：\n\n```\n-rw-r--r-- 1 bob users 10400\
  \ Sep 27 08:52 sales.data\n-rw-r--r-- 1 bob sales 2562856 Sep 27 08:54 sales-lecture.mp3\n\
  drwxr-xr-x 2 bob users 512 Sep 28 14:49 tpsreports\n```\n\n### 列出文件按时间反序排序\n\n如果你想按时间排序\
