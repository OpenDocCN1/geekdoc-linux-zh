  md: 'Table 28-1

    Continued


    | Filename | Content |

    |---|---|

    | `/proc/modules` | List of loaded driver modules |

    | `/proc/mounts` | List of mounted file systems |

    | `/proc/net` | Directory with many subdirectories that contain information about
    networking |

    | `/proc/partitions` | List of partitions known to the Linux kernel |

    | `/proc/pci` | Information about PCI devices found on the system |

    | `/proc/rtc` | Information about the PC''s real-time clock (RTC) |

    | `/proc/scsi` | Directory with information about SCSI devices found on the system
    |

    | `/proc/sound` | Information about the sound driver module, if any |

    | `/proc/stat` | Overall statistics about the system |

    | `/proc/swaps` | Information about the swap space and how much is used |

    | `/proc/sys` | Directory with information about the system (you can change kernel
    parameters by writing to files in this directory — this is one way to tune the
    system''s performance, but one that requires expertise to do it properly) |

    | `/proc/uptime` | Information about how long the system has been up |

    | `/proc/version` | Kernel version number |


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_349_0.png)


    # REVIEW


    This session showed you how to keep an eye on your Red Hat Linux system''s performance.
    You learned to use and interpret the displays produced by top, the GNOME System
    Monitor, vmstat, and the uptime command. You also learned some commands to check
