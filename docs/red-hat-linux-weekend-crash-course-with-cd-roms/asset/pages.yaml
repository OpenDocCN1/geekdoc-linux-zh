- pgno: 107
  md: 'might expect, it has a lot more capabilities than the DOS command interpreter.
    The Linux command interpreter is referred to as a shell.


    The default Linux shell is called Bash, and its program is named /bin/bash (found
    in the /bin directory). When you open a terminal window from the GNOME or KDE
    desktop or log in at a text console, the Bash shell prompts you for commands.
    When you type a command, the shell executes that command.


    In addition to the standard Linux commands, Bash can execute any program stored
    in an executable file. Bash can also execute a shell script, which is a text file
    that contains one or more commands.


    In the minutes ahead, you can try out various features of the Bash shell ranging
    from the general command syntax to the basics of shell programming. If you haven’t
    already done so, go ahead and open a terminal window so you can use the shell.


    # Using the Bash Shell


    Because a shell interprets what you type, it is important to know how the shell
    processes the text that you enter. All shell commands have this general format:


    ```

    command option1 option2 ... optionN

    ```


    A single line of command is commonly referred to as a command line. On a command
    line, you enter a command followed by one or more options (or arguments) known
    as command-line options (or command-line arguments).


    One basic rule is that you have to use a space or a tab to separate the command
    from the options. You also must separate options with a space or a tab. If you
    want to use an option that contains embedded spaces, you have to put that option
    inside quotation marks. For example, to search for my name in the password file,
    I enter the following grep command (grep searches for text in files):


    ```

    grep "Naba Barkakati" /etc/passwd

    ```


    When grep prints the line with my name, it looks like this:


    ```

    naba:x:500:500:Naba Barkakati:/home/naba:/bin/bash

    ```


    If you created a user account in your name, go ahead and type the grep command
    with your name as an argument.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_108_0.png)


    In the output from the grep command, you can see the name of the shell (/bin/bash)
    following the last colon (:).


    The number and the format of the command-line options, of course, depend on the
    actual command. When you learn more about the commands, you see that the command-line
    options controlling the behavior of a command usually take the form -X in which
    X is a single character.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_108_1.png)


    Because various GNU tools and utilities implement most Linux commands, you should
    know that GNU command-line options begin with two dashes followed by a descriptive
    word. Thus, the GNU options take the form --xxxx in which xxxx is a word denoting
    the option. For example, the GNU ls --all command shows all directory entries
    including those that begin with a period (.). This is the same as the ls -a command
    in all UNIX systems.


    If a command is too long to fit on a single line, you can press the backslash
    (\ ) key, followed by Enter. Then, continue entering the command on the next line.
    For example, type the following command (press Enter after each line):


    ```

    cat \

    /etc/passwd

    ```


    The cat command then displays the contents of the /etc/passwd file.


    You can concatenate several shorter commands on a single line; just use the semicolon
    (;) as a separator between the commands. For example, the following command


    ```

    cd; ls -F

    ```


    changes the current directory to your home directory and then lists the contents
    of that directory.


    # Combining commands


    Linux follows the UNIX philosophy of giving the user a toolbox of many simple
    commands. You can, however, combine these simple commands to create a more sophisticated
    command. Suppose you want to find out whether a device file named sbpcd resides
    in your system''s /dev directory because some documentation tells you that for
    a Sound Blaster Pro CD-ROM drive, you need that device file. You can'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'use the command ls /dev to get a directory listing of the /dev directory and
    see whether anything that contains sbpcd appears in the listing. Unfortunately,
    the /dev directory has a great many entries and it may be difficult to locate
    any item that has sbpcd in its name. You can, however, combine the ls command
    with grep and come up with a command that does exactly what you want:


    ```

    ls /dev | grep sbpcd

    ```


    The shell sends the output of the ls command (the directory listing) to the grep
    command, which searches for the string sbpcd. That vertical bar (|) is known as
    a pipe because it acts as a conduit between the two programs; the output of the
    first command becomes the input of the second one.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_109_0.png)


    Most Linux commands are designed in a way that enables the output of one command
    to feed into the input of another. To do this, simply concatenate the commands,
    placing pipes between them.


    # Redirecting command input and output


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_109_1.png)


    Linux commands that are designed to work together have a common feature — they
    always read from the standard input (usually the keyboard) and write to the standard
    output (usually the screen). Error messages are sent to the standard error (usually
    the screen). These three devices often are referred to as stdin, stdout, and stderr,
    respectively.


    If you want a command to read from a file, you can redirect the standard input
    to come from that file. Similarly, to save the output of a command in a file,
    redirect the standard output to a file. These features of the shell are called
    input and output redirection, or I/O redirection.


    For example, type cd to change to your home directory and then type the following
    command:


    ```

    grep typedef /usr/include/* > typedef.out

    ```


    This command searches through all files in the /usr/include directory for the
    occurrence of the string typedef and then saves the output in a file called typedef.out.
    As this command shows, the greater than sign (>) redirects stdout to a file.


    This command also illustrates another feature of Bash. When you use an asterisk
    (*), Bash replaces the asterisk with a list of all the filenames in the specified
    directory. Thus, /usr/include/* means all the files in the /usr/include directory.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'You can also redirect stdin so that a command reads from a file instead of
    the keyboard. For example, type the following command:


    ```

    sort < /etc/passwd

    ```


    This should display a sorted list of the lines in the /etc/passwd file. In this
    case, the less than sign (<) redirects stdin so the sort command reads its input
    from the /etc/passwd file.


    # Letting Bash complete your commands


    Many commands take a filename as an argument. To browse through a file named /etc/X11/XF86Config,
    for example, type the following command:


    ```

    more /etc/X11/XF86Config

    ```


    This command displays the file /etc/X11/XF86Config one screen at a time. For the
    commands that take a filename as an argument, Bash includes a feature that enables
    you to type short filenames. All you have to type is the bare minimum — just the
    first few characters — to uniquely identify the file in its directory.


    To see an example, type more /etc/X11/XF but don’t press Enter; press Tab instead.
    Bash automatically completes the filename so that the command becomes more /etc/X11/XF86Config.
    Now press Enter to run the command.


    # Using wildcard characters


    Another way to avoid typing too many filenames is to use wildcards — special characters,
    such as the asterisk (*) and question mark (?), that match zero or more characters
    in a string. If you are familiar with MS-DOS, you may use commands such as COPY
    *. * A: to copy all files from the current directory to the A: drive. Bash accepts
    similar wildcards in filenames. In fact, Bash provides many more wildcard options
    than MS-DOS does.


    Bash supports three types of wildcards:


    +   - The asterisk (*) character matches zero or more characters in a filename.
    Therefore, * denotes all files in a directory.

    +   - The question mark (?) matches any single character.

    +   - A set of characters in brackets matches any single character from that set.
    The string [xX]*, for example, matches any filename that starts with x or X.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Wildcards are handy when you want to perform a task on a group of files. To
    copy all the files from a directory named /mnt/cdrom to the current directory,
    for example, type the following:


    ```

    cp /mnt/cdrom/* .

    ```


    Bash replaces the wildcard character * with the names of all the files in the
    /mnt/cdrom directory. The period at the end of the command represents the current
    directory.


    You can use the asterisk with other parts of a filename to select a more specific
    group of files. Suppose you want to use the grep command to search for the string
    typedef struct in all files of the /usr/include directory that meet the following
    criteria:


    +   - The filename starts with s.

    +   - The filename ends with .h.


    The wildcard specification s*.h denotes all filenames that meet these criteria.
    Thus, you can perform the search with the following command:


    ```

    grep "typedef struct" /usr/include/s*.h

    ```


    The string contains a space you want the grep command to find, so you have to
    enclose that string in quotation marks. This method ensures that Bash does not
    try to interpret each word in the string as a separate command-line argument.


    Although the asterisk (*) matches any number of characters, the question mark
    (?) matches a single character. Suppose you have four files — image1.pcx, image2.pcx,
    image3.pcx, and image4.pcx — in the current directory. To copy these files to
    the /mnt/floppy directory, use the following command:


    ```

    cp image?.pcx /mnt/floppy

    ```


    Bash replaces the single question mark with any single character and copies the
    four files to /mnt.


    The third wildcard format — [...] — matches a single character from a specific
    set. You may want to combine this format with other wildcards to narrow down the
    matching filenames to a smaller set. To see a list of all filenames in the /etc/X11/xdm
    directory that start with x or X, type the following command:


    ```

    ls /etc/X11/xdm/[xX]*

    ```'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_112_0.png)


    If Bash does not find any filenames matching the [...] wildcard format when expanding
    it, Bash leaves the wildcard specification intact.


    # Looking at the command history


    To make it easy for you to repeat long commands, Bash stores up to 500 old commands.
    Essentially, Bash maintains a command history (a list of old commands). To see
    the command history, type history. Bash displays a numbered list of the old commands,
    including those that you entered during previous logins. That list may resemble
    the following:


    ```

    1  cd

    2  ls -a

    3  more /etc/X11/XF86Config

    4  history

    ```


    If the command list is too long, you may choose to see only the last few commands.
    To see the last 10 commands only, type this command:


    ```

    history 10

    ```


    To repeat a command from the list that the history command shows, simply type
    an exclamation point (!), followed by that command’s number. To repeat command
    number 3, type !3.


    You also can repeat an old command without knowing its command number. Suppose
    you typed more /usr/lib/X11/xdm/xdm-config a while ago, and now you want to look
    at that file again. To repeat the previous more command, type the following:


    ```

    !more

    ```


    Often, you may want to repeat the last command that you typed — perhaps with a
    slight change. For example, perhaps you displayed the contents of the directory
    by using the ls -l command. To repeat that command, type two exclamation points
    as follows:


    ```

    !!

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Sometimes, you may want to repeat the previous command but add extra arguments
    to it. Suppose that ls -l shows too many files. Simply repeat that command, but
    pipe the output through the more command as follows:


    ```

    !! | more

    ```


    Bash replaces the two exclamation points with the previous command and then appends
    | more to that command.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_113_0.png)


    An easy way to recall previous commands is to press the up arrow key, which causes
    Bash to go backward in the list of commands. To move forward in the command history,
    press the down arrow key.


    # Using aliases for commands


    To see the benefit of aliases, type the following command:


    ```

    alias goboot=''cd /usr/src/linux/arch/i386/boot''

    ```


    This defines goboot as an alias — another name — for the text that appears within
    the single quotes. That text is a command to change the current directory to /usr/src/linux/arch/i386/boot.


    Now that you’ve defined the alias, type the following at the Bash prompt:


    ```

    goboot

    ```


    Now type pwd to confirm that the current directory is indeed /usr/src/linux/arch/i386/boot.


    As you can see, an alias simply is an alternative (and usually shorter) name for
    a lengthy command. Bash replaces the alias with its definition and performs the
    equivalent command.


    If you no longer need an alias, use the unalias command to remove the alias. For
    example, if you no longer want to use the goboot alias, type:


    ```

    unalias goboot

    ```


    After this step, typing goboot causes you to get an error message like this:


    ```

    goboot

    bash: goboot: command not found

    ```'
  merge: -1
