  md: 'must have it configured correctly. (Session 19 discusses sound card configuration.)
    Figure 27-1 shows a typical view of XMMS playing an MP3 music clip.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_338_0.png)


    Figure 27-1

    Playing MP3 music with XMMS


    # An overview of the basic building steps


    Now you know how to download, unpack, build, and install a typical software package.
    Here''s an overview of the steps you follow:


    +   1. Download the source code, usually in the form of a .tar.gz file, from the
    anonymous FTP site or Web site. Use the Web browser or download the source code
    manually from the anonymous FTP server.

    +   2. Unpack the file with a `tar zxvf filename` command.

    +   3. Change the directory to the new subdirectory where the software is unpacked
    with a command such as this one:

    +      `cd software_dir`

    +   3. Read any README or INSTALL files to learn any specific instructions you
    must follow to build and install the software.

    +   4. The details of building the software may differ slightly from one software
    package to another, but typically you type the following commands to build and
    install the software:

    +      `./configure`

    +      `make`

    +      `make install`'
