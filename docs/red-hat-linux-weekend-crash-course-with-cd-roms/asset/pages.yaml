  img_proc: true
- pgno: 336
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_336_0.png)


    Most open source software packages, including XMMS, also come with a file named
    COPYING. This file contains the full text of the GNU General Public License (GPL),
    which spells out the conditions under which you can use and redistribute the software.
    If you are not familiar with the GNU GPL, you should read this file and show the
    license to your legal counsel for a full interpretation and an assessment of applicability
    to your business.


    For the XMMS package, the README file lists some of the prerequisites — such as
    libraries that you need — and then tells you what commands you should type to
    build and install the package. In the case of XMMS, the instructions direct you
    to use the following commands:


    +   1. Type ./configure to run a shell script that checks your system configuration
    and creates a Makefile, a file that the make command uses to actually build and
    install the package. The configure shell script guesses system-dependent variables
    and creates a Makefile with commands needed to build and install the software.

    +   2. Type make to build the software. This step compiles the source files in
    all the subdirectories.

    +   3. Type make install to install the software. This step copies libraries and
    executable binary files to appropriate directories on your system.


    Although these steps are specific to XMMS, most other packages follow this procedure
    — configure, make, and then install.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_336_1.png)


    Usually you do not have to do anything but type the commands to build the software;
    however, you must install the software development tools on your system. This
    means that you must install the Development package when you install Red Hat Linux.
    To build and run XMMS, you must also install the X Window System package because
    it’s an X application.


    # Building the software


    To begin building XMMS, type the following command to run the configure script
    (while in the xmms-1.0.1 directory):


    ```

    ./configure

    ```


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_336_2.png)'
