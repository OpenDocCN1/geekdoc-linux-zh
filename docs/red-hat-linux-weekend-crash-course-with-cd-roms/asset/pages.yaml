- pgno: 179
  md: '# Learning the Basics of Dial-up Networking


    *Dial-up networking* refers to the connection of a PC to a remote network (such
    as the Internet) through a dial-up modem. In this case, the maximum data transfer
    rate is 56Kbps. A significant difference exists between dial-up networking and
    plain old serial communication. Both approaches use a modem to dial up another
    computer and establish a communications path, but the serial communication software
    (such as Minicom in Session 11) makes your computer act like a terminal connected
    to the remote computer. The serial communications software exclusively uses dial-up
    connection. You cannot run another copy of the communications software and use
    the same modem connection, for example.


    In dial-up networking, you run TCP/IP or other network-protocol software on your
    PC as well as on the remote system with which your PC has a dial-up communications
    path. That communications path simply provides the physical data transport. The
    network protocols exchange data packets over the dial-up connection. You can use
    any number of network applications simultaneously to communicate over the single
    dial-up connection. With dial-up networking, your PC truly becomes part of the
    network to which the remote computer belongs. (If the remote computer is not on
    a network, the dial-up networking creates a network that consists of the remote
    computer and your PC.) Thus, you can have any number of network applications (ranging
    from a Web browser to a TELNET session) running at the same time, with all applications
    sharing the physical data-transport capabilities of the dial-up connection.


    Dial-up networking involves TCP/IP data transfers over a dial-up connection. Like
    TCP/IP networking over an Ethernet, TCP/IP networking over a dial-up link is a
    matter of specifying the *protocol* — the convention — for packaging a network
    packet over the communications link. There are two popular protocols for TCP/IP
    networking over point-to-point (PPP) serial communications links:


    +   - Serial Line Internet Protocol (SLIP) is a simple protocol that specifies
    how to frame an IP packet on a serial line.

    +   - Point-to-Point Protocol (PPP) is a more advanced protocol for establishing
    a TCP/IP connection over any point-to-point link, including dial-up serial links.


    PPP is the most popular method of TCP/IP networking over a dial-up connection.
    Therefore, I show you in the next section how to use PPP to set up a network connection
    to a remote system.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Connecting to the Internet Using PPP


    Many Internet Service Providers (ISPs) provide PPP access to the Internet through
    one or more systems that the ISP maintains. If you sign up for such a service,
    the ISP should provide you the information that you need to make a PPP connection
    to the remote system. Typically, this information includes the following:


    +   - The phone number to connect to the remote system.

    +   - The user name and password that you must use to log into the remote system.

    +   - The IP addresses of the ISP’s Domain Name Servers (DNS). Typically, the
    ISP gives you two IP addresses — for the primary and secondary DNS.

    +   - The IP address for your side of the connection. (This IP address is associated
    with your PC’s PPP interface — the serial port.) Usually, this IP address is assigned
    dynamically (meaning that the IP address may change every time your system establishes
    a connection).


    Most ISPs also provide the IP addresses of the mail and news servers. These addresses,
    however, are not important for the mechanics of setting up a PPP connection.


    Before you set up a PPP connection, you must have an internal or external modem
    installed on your system. The modem should be connected to a phone line. You can
    use Minicom, as described in Session 11, to dial your ISP’s phone number and make
    sure that the modem successfully establishes a connection. After you see a login
    prompt, you can hang up the modem and proceed to set up PPP.


    To set up a PPP connection using Red Hat’s graphical Dialup Configuration tool,
    log in as root and select Main Menu Programs Internet Dialup Configuration Tool
    from the GNOME desktop. The Dialup Configuration tool displays the Add New Internet
    Connection dialog box, as shown in Figure 13-1.


    Click the Next button. The dialog box then guides you through steps where you
    select a modem and provide information, such as the phone number of the ISP, your
    user name, and password (for your account on the ISP’s system). The Dialup Configuration
    Tool saves the configuration information in the /etc/sysconfig/network-scripts/ifcfg-ppp0
    file.'
  merge: -1
  img_proc: true
