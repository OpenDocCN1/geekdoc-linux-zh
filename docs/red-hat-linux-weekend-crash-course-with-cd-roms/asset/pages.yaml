- pgno: 68
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_68_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_68_1.png)


    # Troubleshooting the Red Hat Linux Installation


    # Session Checklist


    +   ✓ Installing Red Hat Linux in text mode

    +   ✓ Installing Red Hat Linux in expert mode

    +   ✓ Configuring the X Window System

    +   ✓ Configuring printers


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_68_2.png)


    In the last three sessions, you installed Red Hat Linux from this book’s companion
    CD-ROMs. The Red Hat Linux installation program attempts to automatically detect
    key hardware components such as a SCSI controller and network card. Based on the
    detected hardware, the installation program takes you through a sequence of steps
    to configure the detected hardware. For example, if the installation program fails
    to correctly detect the network card, it skips the network configuration step.
    The installation program also tries to simplify the installation by skipping some
    system configuration steps such as setting up a printer. You can recover from
    most of the installation and configuration problems because there are other ways
    to perform these tasks. This session shows you several troubleshooting approaches
    for some common installation and configuration problems.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Installing Red Hat Linux in Text Mode


    The Red Hat installation program attempts to use a minimal X Window System (X)
    to display the graphical user installation screens. If the program fails to detect
    a video card, X does not start. If — for this reason or any other reason — X fails
    to start, you can always fall back on the older text mode installation program
    to specify the video card manually. You can also use the text mode installation
    if you are comfortable with the older installation program.


    To use text mode installation, type text at the boot: prompt after you start the
    PC from the Red Hat Linux boot floppy. From then on, the basic sequence is similar
    to that of the graphical installation described in Session 2. However, many small
    details are different. You should be able to respond to the prompts and perform
    the installation.


    In text mode, when the installation program fails to detect the video card, it
    displays a list of video cards. Select one video card from the list. Because of
    your help in selecting the video card, X may work when you install in text mode.
    If it does not, you can configure X using the information in the “Configuring
    X” section later in this session.


    # Installing Red Hat Linux in Expert Mode


    If the Red Hat installation program does not detect your SCSI controller or network
    card, you can specify these devices manually by running the installation in expert
    mode. Look for any indication of SCSI or network devices in the messages displayed
    by the Linux kernel as it boots. To view these boot messages, press Ctrl+Alt+F4.
    This switches to a text-mode virtual console where the messages appear. A virtual
    console is a screen of text or graphical information stored in memory that you
    can view on the physical screen by pressing the appropriate key sequence.


    To run the installation in expert mode, type expert at the boot: prompt in the
    initial text screen that appears during the Red Hat Linux installation. The installation
    program then displays another text screen that asks for a driver disk, if you
    have one.


    Your hardware vendor provides a floppy disk with Linux drivers. You insert that
    floppy into the A: drive. If you have that disk, press Enter and a dialog box
    prompts you to insert the disk into the A: drive. After you do so, press Enter,
    and'
