- pgno: 70
  md: 'the installation program loads the driver and guides you through steps necessary
    to install the driver.


    If you do not have a driver disk, select Cancel. The installation program then
    goes through two more screens in which you select the language and the keyboard
    layout. Then the installation program prompts for the media containing the packages
    to be installed.


    Next, the installation program displays a dialog box that gives you another opportunity
    to add devices. Press Tab to highlight the Add Device button and then press Enter.
    The installation program then displays a dialog box that prompts for the type
    of device — SCSI or Network.


    If you have any SCSI device, such as a SCSI hard drive, select SCSI and press
    Enter. Then, the installation program displays a list of SCSI controllers from
    which you should select the one on your system and press Enter. The installation
    program then loads that driver module.


    The SCSI driver automatically probes and determines the SCSI controller’s settings,
    such as interrupt request (IRQ) and I/O port address. If the driver has problems
    detecting the SCSI controller’s settings, you can specify these parameters manually.
    To do so, select the check box labeled Specify module parameters and press Enter.
    The installation program then prompts you for the module parameters.


    You can then enter a line such as aha152x=0x340,11,7 to specify the parameters
    for the driver module. See the sidebar “Specifying SCSI Controller Settings” later
    in this session for more information on these settings.


    After you add any SCSI controllers, you return to the dialog box that enables
    you to select a device type. You can add network cards from this dialog box as
    well. In the dialog box, select Network from the list and press Enter. The installation
    program then displays a list of network cards from which you can select your network
    card.


    When you press Enter, the installation program loads the driver module for the
    selected network card. That driver probes and determines the network card settings.


    Once you return to the screen from which you select SCSI or network device, select
    Back and press Enter. This takes you to the dialog box that asks you about adding
    devices. Select Done and press Enter. The installation program then switches to
    graphics mode and guides you through the rest of the installation, as outlined
    in Sessions 2 and 3.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Specifying SCSI Controller Settings


    If you have a SCSI controller in your system, the Red Hat installation program
    loads a SCSI driver module for that controller. You have to identify the type
    of SCSI controller (such as Adaptec 1542 or Adaptec 2940). The installation program
    can attempt to determine the controller settings, such as IRQ and I/O port address,
    by probing various I/O port addresses. However, if the installation program fails
    to determine the SCSI controller settings, you have to specify these parameters
    — IRQ and I/O address — as options for the driver module. The exact formats of
    these options vary from one module to another. For example, the driver for an
    Adaptec AHA 152x card accepts the options in the following format:


    ```

    aha152x=IOPORT,IRQ,SCSI_ID[,Reconnect,Parity]

    ```


    where IOPORT is the I/O port address, IRQ is the interrupt request number, and
    SCSI_ID is the SCSI ID of the SCSI controller. The last two items are optional.
    A typical module option for the aha152x module might be:


    ```

    aha152x=0x340,11,7

    ```


    # Configuring the X Window System


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_71_0.png)


    If the installation program cannot detect your video card during the X configuration
    step, you can skip that step and configure X after completing the rest of the
    installation.


    After the installation is complete and you reboot the PC, you get a text login
    screen. Log in as root and type Xconfigurator to run a utility program with that
    name. The Xconfigurator utility enables you to create a configuration file that
    the X server needs.


    The Xconfigurator program starts with a Welcome dialog box that displays a message
    about the X configuration file. After reading the message, press Enter to continue
    with the configuration process.


    Xconfigurator automatically detects the chipset used by your video card and displays
    a summary message, as shown in Figure 4-1.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_72_0.png)


    # Figure 4-1


    The message that results from the Xconfigurator''s probing of the video card


    In this case, Xconfigurator finds a video card based on the S3 ViRGE/DX (or /GX)
    chipset and recommends the SVGA X server. In fact, the message from Xconfigurator
    is somewhat cryptic. The SVGA X server refers to the X server program with the
    full name XF86_SVGA that is installed in the /usr/X11R6/bin directory. Because
    the dialog box in Figure 4-1 is for your information only, press Enter to continue
    with the rest of the configuration. A dialog box then appears that enables you
    to select your monitor from a list.


    Press the up and down arrow keys to browse through the list. If you find your
    monitor model listed, position the cursor on that monitor and then press Enter.
    Otherwise, select Custom and press Enter. If you choose Custom, Xconfigurator
    displays another dialog box in which you have to provide two critical parameters
    for your monitor:


    +   - Horizontal synchronization frequency — the number of times per second that
    the monitor can display a horizontal raster line, in kilohertz (kHz)

    +   - Vertical synchronization rate or vertical refresh rate — how many times
    a second the monitor can display the entire screen


    You can find the parameters for the frequencies in your monitor''s manual. Press
    Enter to continue. Xconfigurator displays a list of predefined horizontal synchronization
    ranges.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_72_1.png)


    Typically, one of the items from this list should match your monitor''s specifications.
    If you need to guess your monitor''s capabilities, be conservative. Do not specify
    a horizontal synchronization range that is beyond the capabilities of your monitor.
    A wrong value of horizontal synchronization frequency can damage your monitor.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'For example, if your monitor''s manual says that it is capable of displaying
    1,280 by 1,024 resolution at 60Hz, then you should pick the item that matches
    this specification. After selecting the horizontal synchronization capabilities,
    press Enter.


    Xconfigurator now prompts you for the vertical synchronization rate of your monitor.
    Pick the vertical synchronization range that is nearest to your monitor''s specifications
    and press Enter.


    If Xconfigurator is unable to detect the amount of video memory on your video
    card, it displays a dialog box that prompts you to select the amount of video
    memory from a list. Select the amount closest to your video card''s memory and
    press Enter.


    Xconfigurator prompts you to identify the clock chip — a timing device on the
    video card. You can safely press Enter to accept the default selection labeled
    No Clockchip Setting (recommended).


    Xconfigurator then displays a Select Video Mode dialog box with a list of video
    modes in terms of pixel resolution such as 1,280×1,024 and color such as 16 bits
    per pixel, as shown in Figure 4-2.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_73_0.png)


    # Figure 4-2


    Selecting one or more video modes


    Press Tab to move the cursor to a video mode and press the Spacebar to select
    that mode. You can choose as many modes as you want. Then press Tab to select
    the OK button and press Enter.


    Next, Xconfigurator gives you the option of starting X to test your configuration.
    You should press Enter. A graphical X screen appears and Xconfigurator shows a
    dialog box that asks if you can read the text. Click with the mouse to close the
    dialog box.


    Xconfigurator then writes the XF86Config file in the /etc/X11 directory and completes
    the X configuration. The next time you reboot the PC, X should start and you should
    get a graphical login screen.'
