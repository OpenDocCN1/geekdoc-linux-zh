- pgno: 77
  md: "by a linefeed. The printer reacts to carriage returns and linefeeds the same\
    \ way as old-fashioned typewriters — linefeed advances to next line and carriage\
    \ return moves to beginning of a line. When printing a DOS text file, the lines\
    \ print one after another as expected. However, when the printer prints a Linux\
    \ text file with lines ending in a linefeed only, the output looks something like\
    \ this:\n\n```\nLine 1 ends here\n        Line 2 here\n                and so\
    \ on\n                        like a staircase.\n```\n\nTo avoid this staircase\
    \ effect, just check the box marked Fix stair-stepping of text in the dialog box\
    \ of Figure 4-6 and Red Hat Linux takes care of the problem by sending a carriage\
    \ return before each linefeed whenever you print a text file. After you select\
    \ the options in Figure 4-6, click OK in successive dialog boxes until you return\
    \ to the main print tool window shown in Figure 4-3. This window should now show\
    \ the information about the new printer. From the main window shown in Figure\
    \ 4-3, you can then print a test page by selecting Tests ⇒ Print ASCII test page\
    \ from the menu.\n\n![](img/eef64cc01382a4448bc55a2ee7dcc4ca_77_0.png)\n\n# REVIEW\n\
    \nThis session showed you how to overcome some common installation problems by\
    \ running the installation in different modes. You learned how to use the text\
