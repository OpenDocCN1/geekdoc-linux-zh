- pgno: 264
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_264_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_264_1.png)


    # Configuring the X Window System


    # Session Checklist


    +   - ✓ Setting up the X Window System

    +   - ✓ Running and controlling the X Window System


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_264_2.png)


    This morning’s sessions focus on various system administration tasks such as configuring
    X, learning the Red Hat Linux boot sequence, installing new software packages
    from RPM and tar files, building a new kernel, scheduling jobs to run at specific
    times, and performing system backups. This session shows you the steps involved
    in configuring the X Window System, or X for short. It’s important to learn how
    to configure X because graphical desktops such as GNOME and KDE require X to work.


    # Setting the X Window System Up


    The term X Window System, or X for short, is loosely applied to several components
    that facilitate window-based graphics output (or a graphical interface) on a variety
    of bitmapped displays. A bitmapped display has two distinct components: a video
    monitor on which the graphics output appears and a video card (or graphics'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'card) — either a plug-in card or some circuitry built into the system’s mother-board
    — that causes the output to appear on the monitor.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_265_0.png)


    The X Window System for Red Hat Linux comes from the XFree86 project — a cooperative
    project of programmers who bring X to the PC. (You can access the XFree86 home
    page at http://www.xfree86.org/.) As a result, the Linux version of X is called
    XFree86.


    # Understanding the X server


    At the heart of X is the X server — a process (computer program) running on a
    computer that has a bitmaped display, a keyboard, and a mouse. Applications (X
    clients) that need to display output do so by communicating with the X server
    via one of several possible interprocess communication mechanisms.


    When you run X on your system, the X server runs on your computer and controls
    the monitor, keyboard, and mouse. The server responds to commands sent by X clients
    that open windows and draw in those windows. The X clients may run locally or
    on remote systems.


    The X server configures the display (number of colors, resolution in terms of
    number of pixels horizontally and vertically), mouse, and keyboard based on information
    stored in a configuration file. Red Hat Linux comes with two versions of XFree86
    — 3.3.6 and 4.0.1. Depending on your video card, the installation program selects
    an X server from one of these versions of XFree86. Each version has a different
    configuration file. For XFree86 3.3.6, the configuration file is `/etc/X11/XF86Config`.
    For XFree86 4.0.1, the configuration file is `/etc/XFree86Config-4`.


    Configuring X requires you to prepare the configuration file. The configuration
    file contains information about your video card, monitor, keyboard, and mouse.
    Red Hat Linux comes with a utility program called `xf86config` (same name as the
    configuration file, but in lower case) that enables you to create the `XF86Config`
    working configuration file.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_265_1.png)


    You don’t need to create the X configuration file with the `xf86config` program
    if when you install Red Hat Linux (following the instructions outlined in Sessions
    1 through 3), the installation program automatically detects your system’s video
    chipset and enables you to configure X through a number of dialog boxes. Additionally,
    Session 4 shows you how to run the `Xconfigurator` utility to create the X configuration
    file.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'This session walks you through the X configuration process using the xf86config
    program so that you can see the configuration options in detail and understand
    the format and purpose of various items of information stored in the configuration
    file. In particular, when you configure X with xf86config, you see the list of
    over 600 video cards supported by the latest version of XFree86. If X is not configured
    correctly during Red Hat Linux installation, you can select your card from this
    list and create a working X configuration file.


    # Using the xf86config program


    The xf86config program asks you questions that you answer. You need to have some
    information about your PC''s video card and monitor to answer these questions.


    To run xf86config, log in as root and type xf86config at the shell command prompt.
    The xf86config program displays a screen of text with some helpful information.
    Press Enter to continue.


    The xf86config program asks you to specify a mouse protocol that determines how
    the X server communicates with the mouse. The program shows you a numbered list
    of mouse types. Type the number that corresponds to your mouse type; then press
    Enter.


    The xf86config program then asks the following:


    ```

    Please answer the following question with either ''y'' or ''n''.

    Do you want to enable Emulate3Buttons?

    ```


    If your mouse has two buttons, xf86config suggests that you enable Emulate3Buttons.
    Enter y. If you enable Emulate3Buttons, you can simulate a middle button click
    by pressing both buttons simultaneously. Many X applications assume that the mouse
    has three buttons, so this feature comes in handy in the PC world where a mouse
    typically has two buttons.


    Next, you have to specify the full device name for the mouse. During Red Hat Linux
    installation, you configure the mouse and the installation program creates a link
    between your mouse device and the standard name /dev/mouse. Therefore, you can
    press Enter.


    The xf86config program displays a list of keyboard types and prompts you for the
    one that matches your keyboard. Enter the number from the list. If none of the
    types match, you can always select 1, which represents Generic 101-key PC keyboard.


    The xf86config program then asks you for the country for which the keyboard should
    be configured. Again, you have to pick from a list displayed by the program.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_266_0.png)'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Next, xf86config informs you that it needs two critical parameters of your
    monitor:


    +   - Horizontal synchronization frequency — the number of times per second that
    the monitor can display a horizontal raster line, in kilohertz (kHz)

    +   - Vertical synchronization rate — the number of times a second the monitor
    can display the entire screen, in Hertz (Hz)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_267_0.png)


    **You can find this information in your monitor''s manual.**


    Press Enter to continue. The xf86config program displays a number of ranges for
    horizontal synchronization frequency, or you can type 11 to enter your own range
    of values.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_267_1.png)


    **Do not specify a horizontal synchronization range that is beyond the capabilities
    of your monitor. A wrong value can damage the monitor.**


    To enter a range of values, type 11 and then press Enter. The program prompts
    you for the range. Enter the range as two values separated by a minus sign (-).
    My monitor''s documentation says that the horizontal synchronization range is
    30–69 kHz, so I enter the following:


    ```

    Horizontal sync range: 30-69

    ```


    Next, xf86config prompts you for the vertical synchronization rate and gives you
    a range of values; or you can type 5 to enter your own range of values. If you
    know the range, type 5 and then press Enter. At the next prompt, enter the range
    for the vertical synchronization. My monitor''s documentation shows this range
    to be 50–120 Hz, so I enter the following:


    ```

    Vertical sync range: 50-120

    ```


    Next, you have to enter an identifier for your monitor''s definition. Typically,
    you enter your monitor''s make and model. You can enter anything here. This identifier
    is used to refer to the monitor in another part of the configuration file. For
    my system''s monitor, I respond as follows:


    ```

    Enter an identifier for your monitor definition: Micron700FGx

    ```'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'The next task is to configure the video-card settings. The xf86config program
    displays an explanatory message and asks this question:


    ```

    Do you want to look at the card database? y

    ```


    Type y and then press Enter. The program then displays a list of several hundred
    cards. (The numbering starts at zero and goes on to over 600.) Press Enter after
    each screen to see the entire list. The make, model, and chipset of the video
    card are crucial pieces of information that you need in order to select the correct
    XFree86 X server and configure it properly.


    Select your video card by typing the appropriate number. One of my PCs, for example,
    has a Diamond Stealth 3D 2000 PRO video card with the S3 ViRGE/DX chipset. I notice
    the following line on one of the screens:


    ```

    240 Diamond Multimedia Stealth 3D 2000 PRO      S3 ViRGE/DX

    ```


    I type 240 — the number corresponding to my video card — and press Enter.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_268_0.png)


    Each new release of XFree86 supports more video cards. For example, XFree86 4.0.1
    supports 749 cards. (As a point of reference, Version 3.1.2 supported only 124
    entries; Version 3.3.1 supported 382 cards; and Version 3.3.6 supported 671 cards.)
    If your video card’s vendor and model do not appear in the list, but you know
    the video chipset, try selecting the entry that corresponds to the generic chipset.


    After you enter your selection, xf86config displays some information (and any
    appropriate instructions) about your chosen video card.


    After you press Enter to continue, xf86config asks how much video memory your
    video card has. Most current video cards have anywhere from 4MB (4,096KB) to 32MB
    (32,768KB) of video memory. You need at least 1MB of video memory to display 256
    colors at 1,024×768 resolution (1,024 pixels horizontally by 768 pixels vertically).
    Type the number that corresponds to the amount of memory in your video card and
    then press Enter.


    Now you have to provide an identifier for your video card. Type the appropriate
    information for your card. Following is what I enter for my PC’s video card:


    ```

    Enter an identifier for your video card definition: Diamond Stealth 3D 2000 PRO

    ```


    The program next asks you to enter the default color depth, in terms of number
    of bits per pixel. The choices range from monochrome (1 bit per pixel) to millions
    of color (24 bits per pixel). Enter the number corresponding to the depth you
    want and then press Enter.'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'This step completes your session with xf86config. The program displays the
    following message asking whether it can write the XF86Config file in the current
    directory:


    ```

    I am going to write the XF86Config file now. Make sure you don''t accidentally
    overwrite a previously configured one.


    Do you want it written to the current directory as ''XF86Config''? n


    Please give a filename to write to: /etc/X11/XF86Config

    ```


    Answer n in response to the first question; then type /etc/X11/XF86Config and
    press Enter. The xf86config program writes the configuration file and exits.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_269_0.png)


    # Running and Controlling the X Window System


    After you have a complete XF86Config file, your X server should be ready to run.
    Typically, you select a graphical login option during Red Hat installation, so
    X starts automatically whenever your system restarts.


    If you do not opt for a graphical login option, you can start the X server by
    running the startx script, which is a file that contains shell commands. This
    shell script is in the /usr/X11R6/bin directory, but that directory should be
    in your PATH environment variable. Therefore, to run that script, type startx
    at the shell prompt.


    There are some special keystrokes you can use to control the X server. The following
    sections describe these methods of controlling X.


    # Aborting X with Ctrl+Alt+Backspace


    If you create a new XF86Config file to try out some new video modes, you can abort
    the X server by pressing Ctrl+Alt+Backspace to kill the X server. (In UNIX, the
    term kill refers to abnormally exiting a program. UNIX even has a kill command
    that stops errant programs.)


    If you select the graphical login option upon installing Red Hat Linux, the X
    server immediately restarts — but this time with the configuration options in
    the new XF86Config file. If your system is not set up for a graphical login screen,
    you return to the text display.'
  merge: -1
  img_proc: true
- pgno: 270
  md: "![](img/eef64cc01382a4448bc55a2ee7dcc4ca_270_0.png)\n\nIf you enable the graphical\
    \ login screen and X does not work properly because of erroneous configuration\
    \ options in the XF86Config file, press Ctrl+Alt+F1 to get a text-mode login screen.\
    \ Then log in as root and follow the procedures in the preceding section for setting\
    \ up X. Press Ctrl+Alt+F7 to get back to the graphical login screen and press\
    \ Ctrl+Alt+Backspace to kill the X server and force it to restart with the new\
    \ configuration options.\n\n# Switching screen modes with Ctrl+Alt+Keypad keys\n\
    \nTo exemplify how to switch screen modes, look at the Screen section that applies\
    \ to your X server in your XF86Config file. Notice that there are several Display\
    \ subsections. Each Display subsection lists the video modes that are supported\
    \ for a specific depth — the number of bits in each pixel’s value. The Display\
    \ subsections list the video modes in terms of the display resolution, which is\
    \ expressed in terms of the number of pixels horizontally and vertically. For\
    \ example, here is a partial listing of a Screen section of the X configuration\
    \ file for an SVGA X server:\n\n```\n# The svga server\nSection \"Screen\"\n \
    \   Driver      \"svga\"\n    Device      \"Diamond Stealth 3D 2000 PRO\"\n  \
    \  Monitor     \"Micron700FGx\"\n\n    Subsection \"Display\"\n        Depth \
    \      8\n        Modes       \"640x480\" \"800x600\" \"1024x768\" \"1280x1024\"\
    \n        ViewPort    0 0\n    EndSubsection\n\n    Subsection \"Display\"\n \
    \       Depth       16\n        Modes       \"640x480\" \"800x600\" \"1024x768\"\
    \ \"1280x1024\"\n        ViewPort    0 0\n    EndSubsection\n\n    ...\nEndSection\n\
    ```\n\nWhen the X server starts, it configures the video card at the default resolution\
    \ (in this case, 640×480, or 640 pixels horizontally by 480 pixels vertically)\
    \ that corresponds to the first mode shown in the Modes entry of the first Display\
    \ subsection."
  merge: -1
  img_proc: true
- pgno: 271
  md: 'You can try the other modes without having to exit the X server. Press Ctrl+Alt+Keypad
    +. (Keypad + means the plus key in the numeric keypad.) The X server switches
    to the next mode — in this case, 800×600. Press Ctrl+Alt+Keypad + again, and the
    X server switches to 1,024×768 mode. When you press Ctrl+Alt+Keypad +, the X server
    cycles forward to the next mode listed in the Modes entry.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_271_0.png)


    Press Ctrl+Alt+Keypad + several times to make sure that the X server works in
    all video modes.


    To cycle backward to the preceding mode, press Ctrl+Alt+Keypad -. (Keypad – means
    the minus key in the numeric keypad.) Therefore, if the X server is displaying
    in 800×600 mode and you press Ctrl+Alt+Keypad -, the server switches to 640×480
    mode.


    You can make the X server start in any of the supported modes. If you want the
    X server to start at the highest-resolution mode, simply change the Modes entry
    in the Screen section that corresponds to your X server (the Driver entry in the
    Screen section indicates the X server type) to the following:


    ```

    Modes    "1024x768"  "800x600"  "640x480"

    ```


    This change makes X start in 1,024×768 mode, which gives you much more screen
    area than 640×480 mode. Some applications require the X server to be run in 16-bit
    color depth. To learn how to run the X server in 16-bit color depth, see the sidebar.


    # Running the X Server in 16-Bit Color


    Some applications, such as the Applixware office suite, require you to run the
    X server in 16-bits per pixel mode (also referred to as a 16-bit color depth).
    To make the X server start with a 16-bit color depth, perform the following steps:


    +   1. Open the `/etc/X11/XF86Config` file using your favorite text editor.

    +   2. Locate the Screen section corresponding to the X section that corresponds
    to your X server. For example, if you use the SVGA server, look for the Screen
    section that has `svga` as the Driver entry.'
