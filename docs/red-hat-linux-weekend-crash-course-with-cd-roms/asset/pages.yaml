    \  2  124  179  3  8 89\n     0  0  0  4724  2052  3420  18244    0    0     0\
    \     2  125  301 57 13 30\n     0  0  0  4724  2124  3420  18232    0    0  \
    \   0     3  134  213  6  8 86\n```"
