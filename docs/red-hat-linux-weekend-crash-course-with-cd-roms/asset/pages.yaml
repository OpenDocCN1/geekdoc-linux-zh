- pgno: 344
  md: '```

    0 0 0 4724 1980 3416 18064 0 0 4 4 182 363 54 15 31

    2 0 0 4724 1960 3416 18064 0 0 0 4 142 126 13 7 80

    0 0 0 4724 1960 3416 18064 0 0 0 3 132 183 7 9 84

    0 0 0 4724 1948 3416 18076 0 0 0 1 112 90 7 8 86

    ```


    The tabular output is grouped into six categories of information, as indicated
    by the fields in the first line of output. The second line shows categories for
    each of the six major fields. You can interpret the six fields and their categories
    using the following table:


    | Field Name | Description |

    |---|---|

    | Procs | Number of processes and their types: r = processes waiting to run; b
    = processes in uninterruptible sleep; w = processes swapped out, but ready to
    run |

    | Memory | Information about physical memory and swap space usage (all numbers
    in kilobytes): swpd = virtual memory used; free = free physical memory; buff =
    memory used as buffers; cache = cached virtual memory |

    | Swap | Amount of swapping (all numbers in kilobytes per second): si = amount
    of memory swapped in from disk; so = amount of memory swapped to disk |

    | Io | Information about input and output (all numbers in blocks per second in
    which the block size depends on the disk device): bi = rate of blocks sent to
    disk; bo = rate of blocks received from disk |

    | System | Information about the system: in = number of interrupts per second
    (including clock interrupts); cs = number of context switches per second — the
    number of times the kernel changes the running process |

    | cpu | Percentages of CPU time used: us = percentage of CPU time used by user
    processes; sy = percentage CPU time used by system processes; id = percentage
    of time CPU is idle |


    The first line of output following the two header lines shows the averages since
    the last reboot. After that, vmstat displays the 5-second average data seven more
    times over the next 35 seconds. In the vmstat utility''s output, high values in
    the si and so fields indicate too much swapping. High numbers in the bi and bo
    fields indicate too much disk activity.'
  merge: -1
  img_proc: true
- pgno: 345
  md: "# Checking Disk Performance and Disk Usage\n\nRed Hat Linux comes with the\
    \ /sbin/hdparm program that you can use to check disk performance and usage. It\
    \ controls IDE or ATAPI hard disks that are common on most PCs. One feature of\
    \ the hdparm program is that the -t option enables you to determine the rate at\
    \ which data can be read from the disk into a buffer in memory. For example, here’s\
    \ the result of this command on my system:\n\n```\n/sbin/hdparm -t /dev/hda\n\n\
    /dev/hda:\n  Timing buffered disk reads:  64 MB in 15.18 seconds =  4.22 MB/sec\n\
    ```\n\nAs you can see, the command requires the IDE drive’s device name (/dev/hda)\
    \ as an argument. If you have an IDE hard disk, you can try this command to see\
    \ how fast data can be read from your system’s disk drive.\n\nTo display the space\
    \ available in the currently mounted file systems, use the df command. If you\
    \ want a more human-readable output from df, type the following command:\n\n```\n\
    df -h\nFilesystem     Size  Used Avail Use% Mounted on\n/dev/hda2      1.9G  1.1G\
    \  765M  59% /\n/dev/hda1      2.0G  1.8G  256M  88% /dos c\n```\n\nAs this example\
    \ shows, the -h option causes the df command to show the sizes in gigabytes (G)\
    \ and megabytes (M).\n\nTo check the disk space a specific directory uses, employ\
    \ the du command. You can specify the -h option to view the output in kilobytes\
    \ (k) and megabytes (M), as shown in the following example:\n\n```\ndu -h /var/log\n\
    12k     /var/log/httpd\n4.0k    /var/log/news/OLD\n8.0k    /var/log/news\n4.0k\
    \    /var/log/vbox\n20k     /var/log/samba\n4.0k    /var/log/sa\n576k    /var/log\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 346
  md: 'The du command displays the disk space used by each directory and the last
    line shows the total disk space used by that directory. If you want to see only
    the total space used by a directory, type the -s option like this:


    ```

    du -sh /home

    16M      /home

