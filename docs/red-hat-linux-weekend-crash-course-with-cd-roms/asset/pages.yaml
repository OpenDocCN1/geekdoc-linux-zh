- pgno: 196
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_196_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_196_1.png)


    # Using Red Hat Linux as a Workgroup Server


    # Session Checklist


    +   - ✓ Sharing files with NFS

    +   - ✓ Setting up your Red Hat Linux PC as a Windows server with Samba


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_196_2.png)


    30 Min.

    To Go


    A low-end Pentium PC (or even a 486) configured with Red Hat Linux (from this
    book’s companion CD-ROMs) makes a very capable workgroup or office server. A workgroup
    is a small local area network (LAN) of perhaps a dozen or so PCs. You can configure
    the Red Hat Linux PC to be the file and print server and the other PCs as the
    clients. The client PCs can run Windows instead of Linux. This session introduces
    you to the Samba package, which comes with Red Hat Linux and provides everything
    you need to set up your Red Hat Linux PC as a server in a Windows network. However,
    first you learn about file sharing through Network File Sharing (NFS), which is
    provides another way of sharing files besides Samba.


    # Sharing Files with NFS


    Sharing files with NFS is simple, involving two basic steps:


    +   - On the Red Hat Linux server, export one or more directories by listing them
    in the /etc/exports file (thereby making them available to the client system).'
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   - On each client system, mount the directories exported by the Red Hat
    Linux server using the mount command.


    The only problem in using NFS for file sharing is that each client system must
    support NFS. Most PCs do not come with NFS. That means you have to buy NFS software
    separately if you want to share files using NFS. It makes sense to use NFS if
    all systems on your LAN run Linux (or other variants of UNIX with built-in NFS
    support). I walk you through NFS setup using an example of two Red Hat Linux PCs
    on a LAN.


    # Exporting a file system with NFS


    On the server, you must run the NFS service and also designate one or file systems
    to export — make available to the client systems. You can perform both tasks using
    the Linuxconf graphical system administration tool.


    To start Linuxconf, log in as root and select Main Menu ⇒ Programs ⇒ System ⇒
    Linuxconf from the GNOME desktop. On the Linuxconf Config tab, select Net-working
    ⇒ Server tasks ⇒ Exported file systems (NFS) from the tree menu. This brings up
    the Exported file systems tab that shows the current contents of the /etc/exports
    file. If that file is empty, Linuxconf displays the empty Exported file systems
    dialog box (as shown in Figure 15-1).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_197_0.png)


    Figure 15-1

    The empty Exported file systems tab box'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Click the Add button. This brings up the One exported file system tab where
    you can specify the details of the exported file system. You specify the file
    system with a full pathname, as shown in Figure 15-2.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_198_0.png)


    # Figure 15-2

    Entering information about exported file systems in Linuxconf


    In this dialog box, you should also enter the names of client systems that may
    mount this exported file system. In the example shown in Figure 15-2, the /home/public
    directory is being exported and the host named LNBP75 can mount this file system
    for read and write operations. After entering the information, click the Accept
    button. Linuxconf returns to the tab shown in Figure 15-1 where it displays summary
    information about the exported file system. You can then click the Quit button
    to finish defining exported file systems.


    As a result of this session, Linuxconf adds the following entry to the /etc/exports
    file:


    ```

    /home/public LNBP75(rw)

    ```


    To verify that the exported directories are listed in the /etc/exports file, type
    cat /etc/exports in a terminal window.


    Now you should turn on the NFS server. To do this, select Control panel Control
    service activity from the tree menu on Linuxconf''s Control tab. Linuxconf displays
    the Service control tab with a list of all the services and their statuses, as
    shown in Figure 15-3.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_199_0.png)


    # Figure 15-3


    Viewing the services and their statuses in the Service control tab in Linuxconf


    Each line has three fields: one provides the name of a service, another indicates
    whether it is enabled to run automatically or manually, and the last reveals whether
    it is already running. Scroll down the list and locate the entry named nfs — the
    NFS service. In this case, the NFS service is not running yet. Click that entry.
    This causes Linuxconf to display the Service nfs tab, as shown in Figure 15-4.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_199_1.png)


    # Figure 15-4


    Starting the NFS service through Linuxconf'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The buttons in this tab enable you to start, stop, or restart the service.
    In this case, click the Start button to start the NFS service. Then click Accept
    to return to the previous tab (Figure 15-3). Now the Service control tab should
    show the status of the nfs entry as Running. Click Quit to exit this tab.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_200_0.png)


    If you ever make any changes to the exported file systems listed in the /etc/exports
    file, remember to restart the NFS service. Click the Restart button in the dialog
    box shown in Figure 15-4.


    If you prefer to start the NFS service using a command, log in as root and type
    the following command in a terminal window:


    ```

    /etc/rc.d/init.d/nfs start

    ```


    That sets up the server side of NFS. Now you can try to mount the exported file
    system from the client system.


    # Mounting an NFS file system


    You can use Linuxconf on the client system to mount an exported NFS file system.
    However, the easiest way to perform the mount operation is to log in as root and
    use the mount command. For example to mount the /home/public file system from
    the lnbp200 system on the /mnt/lnbp200 directory of the client system, type:


    ```

    mount lnbp200:/home/public /mnt/lnbp200

    ```


    To confirm that the NFS file system is indeed mounted, log in as root on the client
    system and type mount in a terminal window. You should see a line similar to the
    following one about the NFS file system:


    ```

    lnbp200:/home/public on /mnt/lnbp200 type nfs (rw,addr=192.168.1.200)

    ```


    # Setting Up the Linux PC as a Windows Server with Samba


    If your business relies on Windows for file and print sharing, you probably use
    Windows in your servers and clients. You can move to a Red Hat Linux PC as your
    server without losing the Windows file and printer sharing because you can set
    up a Linux PC as a Windows server. When you install Red Hat Linux from this book’s
    companion CD-ROMs, you also get a chance to install the Samba software package,
    which performs that task. All you have to do is select the DOS/Windows Connectivity
    package group during installation.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_201_0.png)


    After you install and configure Samba on your Red Hat Linux PC, client PCs running
    Windows 95/98/NT/2000 can access disks and printers on the Red Hat Linux PC by
    using the Server Message Block (SMB) protocol, which is the underlying protocol
    in Windows file and print sharing.


    With the Samba package installed, you also can make your Red Hat Linux PC a Windows
    client. This means that the Red Hat Linux PC can access the disks and printer
    managed by a Windows server. The Samba software package has these major components:


    +   - `smbd`: the SMB server, which accepts connections from Windows clients and
    provides file and print sharing services

    +   - `nmbd`: the NetBIOS name server, which clients use to look up servers. (*NetBIOS*
    stands for *Network Basic Input/Output System* — an interface that applications
    use to communicate with network transports such as TCP/IP.)

    +   - `/etc/samba/smb.conf`: the Samba configuration file that the SMB server
    uses

    +   - `testparm`: a program that ensures the Samba configuration file is correct

    +   - `smbclient`: the Windows client, which runs on Red Hat Linux and allows
    Red Hat Linux to access the files and printer on any Windows server

    +   - `smbprint`: a script, which enables printing on a printer on an SMB server

    +   - `smbadduser`: a program that adds users to the SMB password file

    +   - `smbpasswd`: a program that changes the password for an SMB user

    +   - `smbstatus`: a command that lists the current SMB connections for the local
    host


    The following sections describe how to install Samba from the companion CD-ROMs.
    They also discuss the process of setting up a printer on the Red Hat Linux PC
    to print through Windows.


    # Checking if Samba is installed and installing Samba


    Before installing Samba, first check whether Samba is already installed by typing
    the following command in a terminal window:


    ```

    rpm -q samba

    samba-2.0.7-20

    ```'
