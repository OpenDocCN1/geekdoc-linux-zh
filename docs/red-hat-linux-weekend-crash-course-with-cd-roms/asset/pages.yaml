    # Turning the PPP connection on or off


    You do not always have to run the dialup Configuration tool to turn the PPP connection
    on or off. Instead, after you configure the ppp0 interface, you can simply type
    the following command to initiate the PPP connection:


    ```

    /sbin/ifup ppp0

    ```


    When you no longer need the PPP connection, you can disconnect by logging in as
    root and typing the following command:


    ```

    /sbin/ifdown/ppp0

    ```


