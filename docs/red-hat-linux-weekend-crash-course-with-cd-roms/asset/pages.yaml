- pgno: 320
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_320_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_320_1.png)


    # Backing Up and Restoring Files


    # Session Checklist


    +   - ✓ Selecting a backup strategy and storage media

    +   - ✓ Using tar to backup and restore files

    +   - ✓ Backing up on tapes


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_320_2.png)


    30 Min.

    To Go


    By now, you have learned a number of system administration tasks from configuring
    X to building a new kernel. This session introduces you to another important system
    administration task — backing up and restoring files from backup storage media.
    In this session, you learn how to back up and restore files using the tape archiver
    (tar) program that comes with Red Hat Linux. You also learn how to perform incremental
    and automatic backups on tapes.


    # Selecting a Backup Strategy and Storage Media


    Your Red Hat Linux system’s hard disk contains everything needed to keep the system
    running, as well as other files such as documents and databases that you need
    to keep your business running. You need to back up these files so that you can
    recover quickly and bring the system back to normal in case the hard disk crashes.'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'Typically, you have to follow a strict regimen of regular backups because you
    can never tell when the hard disk might fail or the file system might get corrupted.
    To implement such a regimen, you need to decide what files to back up, how often
    to back them up, and what backup storage media to use. This involves selecting
    a backup strategy and backup media.


    Your choice of backup strategy and backup media depend on your assessment of the
    risk of business disruption due to hard disk failure. Depending on how you use
    your Red Hat Linux system, a disk failure may or may not have much impact on you.


    For example, if you use your Red Hat Linux system as a learning tool (to learn
    about Linux or programming), all you may need are backup copies of some system
    files needed to configure Red Hat Linux. In this case, your backup strategy may
    be to save important system configuration files on one or more floppies every
    time you change any system configuration.


    On the other hand, if you use your Red Hat Linux system as an office server that
    provides shared file storage for many users, the risk of business disruption due
    to disk failure is much higher. In this case, you have to back up all the files
    every week and back up any new or changed files every day. You should perform
    these backups in an automated manner (using the job-scheduling features that you
    learned in Session 25). Also, you probably need a backup storage medium that can
    store large amounts (multiple gigabytes) of data on a single tape. In other words,
    for high-risk situations, your backup strategy is more elaborate and thus requires
    additional equipment such as a tape drive.


    Your choice of backup media depends on the amount of data you have to back up.
    For a small amount of data, such as system configuration files, you can use floppy
    disks as your backup media. If your PC has a Zip drive, you can use Zip disks
    as your backup media. (These are good for backing up a single user directory.)
    To back up servers, you should use a tape drive — typically a 4mm or 8mm tape
    drive that connects to a SCSI controller. Such tape drives can store several gigabytes
    of data per tape, and you can use them to back up an entire file system on a single
    tape.


    When backing up files to these backup storage media, you have to refer to the
    backup device by name. Here are the device names for some common backup devices:


    | Backup Device | Linux Device Name |

    |---|---|

    | Floppy disk | /dev/fd0 |

    | IDE Zip drive | /dev/hdc4 or /dev/hdd4 |'
  merge: -1
  img_proc: true
- pgno: 322
  md: '| Backup Device | Linux Device Name |

    |---|---|

    | SCSI Zip drive | /dev/sda (assuming it’s the first SCSI drive); otherwise, the
    device name depends on the SCSI ID |

    | SCSI tape drive | /dev/st0 or /dev/nst0 (the n prefix means that the tape does
    not rewind after files are copied to the tape) |


    Although this session focuses on backing up and restoring files with the tape
    archiver (tar) program that comes with Red Hat Linux, there are other commercially
    available utilities for Red Hat Linux that perform backups. I highlight some well-known
    commercial utilities in the following sidebar.


    # Backing Up and Restoring Files with the Tape Archiver — tar — Program


    You can use the tape archiver program (tar command) to archive files to a device
    such as a floppy disk or tape. The tar program creates an archive file that can
    contain other directories and files, and (optionally) compress the archive for
    efficient storage. The archive is then written to a specified device or another
    file. In fact, many software packages are distributed in the form of a compressed
    tar file.


    # Commercial Backup Utilities for Red Hat Linux


    Although you can manage backups with tar, a number of commercial backup utilities
    come with graphical user interfaces and other features to simplify backups. Here
    are some well-known backup utilities for Red Hat Linux:


    +   - **BRU**: Backup and Restore Utility from EST (see http://www.estinc.com/)

    +   - **LONE-TAR**: tape backup software package from Lone Star Software Corporation
    (see http://www.cactus.com/)

    +   - **Arkeia**: backup and recovery software for heterogeneous networks from
    Knox Software (see http://www.knox-software.com/)

    +   - **CTAR**: backup and recovery software for UNIX systems from UniTrends Software
    Corporation (see http://www.unitrends.com/)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_322_0.png)'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'The command syntax of the tar program is as follows:


    ```

    tar options destination source

    ```


    The options are usually specified by a sequence of single letters, each specifying
    what tar should do. The device name of the backup device is destination, and source
    is a list of file or directory names denoting the files to back up.


    # Backing up and restoring a single volume archive


    Suppose you want to back up the contents of the /etc/X11 directory on a single
    floppy disk. Log in as root, place a disk in the floppy drive, and then type the
    following command:


    ```

    tar zcvf /dev/fd0 /etc/X11

    ```


    The tar program displays a list of filenames as each file is copied to the compressed
    tar archive on the floppy disk. In this case, the options are zcvf, the destination
    is /dev/fd0 (the floppy disk), and the source is the /etc/X11 directory (which
    implies all its subdirectories and their contents). You can use a similar tar
    command to back up files to a tape. Simply replace /dev/fd0 with the tape device
    — such as /dev/st0 for a SCSI tape drive.


    A few common tar options are defined here:


    | Option | Definition |

    |---|---|

    | z | compresses the tar archive using gzip |

    | c | creates a new archive |

    | v | displays verbose messages |

    | x | extracts files from the archive |

    | t | lists the contents of the archive |

    | M | specifies a multi-volume archive (next section describes multi-volume archives)
    |

    | f | specifies the name of the archive file or device on the next field in the
    command line |


    To view the contents of the tar archive you create on the floppy disk, type the
    following command:


    ```

    tar ztf /dev/fd0

    ```'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'You should see a list of the filenames (each begins with /etc/X11) indicating
    the contents of the backup. In this tar command, the t option lists the contents
    of the tar archive.


    To learn how to extract the files from a tar backup, try the following steps while
    logged in as root:


    +   1. Change the directory to /tmp by typing the command:

    +      `cd /tmp`

    +      That is where you extract the files from the tar backup.

    +   2. Type the following command:

    +      `tar zxvf /dev/fd0`

    +      This tar command uses the x option to extract the files from the archive
    stored on /dev/fd0 (the floppy disk).


    If you check the contents of the /tmp directory, you notice that the tar command
    creates an etc/X11 directory tree in /tmp and restores all the files from the
    tar archive into that directory. The tar command strips off the leading / from
    the filenames in the archive and restores the files in the current directory.
    If you want to restore the /etc/X11 directory from the archive on the floppy,
    use the following command:


    ```

    tar zxvf /dev/fd0 /

    ```


    The / at the end of the command denotes the directory where you want to restore
    the backup files.


    As you can see, the tar command enables you to create, view, and restore an archive.
    You can store the archive in a file or in any device that you specify with a device
    name.


    # Backing up and restoring a multivolume archive


    Sometimes the capacity of a single storage medium is less than the total storage
    space needed to store the archive. In that case, you can use the M option for
    a multivolume archive — meaning that the archive can span multiple tapes or floppies.


    > You cannot create a compressed, multivolume archive. That means you cannot use
    the z option.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_324_0.png)'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'To see how multivolume archives work, log in as root, place one disk in the
    floppy drive, and type the following tar command:


    ```

    tar cvfM /dev/fd0 /usr/doc/ghostscript*

    ```


    Note the M option in the option letters, which tells tar to create a multivolume
    archive. The tar command prompts you for a second floppy when the first one fills
    to capacity. Take out the first floppy and insert another floppy when you see
    the following prompt:


    ```

    Prepare volume #2 for `/dev/fd0` and hit return:

    ```


    When you hit Enter, the tar program continues with the second floppy. In this
    example, you need only two floppies to store the archive. For larger archives,
    the tar program continues to prompt for floppies in case more floppies are needed.


    To restore from this multivolume archive, type cd /tmp to change the directory
    to /tmp and then type:


    ```

    tar xvfM /dev/fd0

    ```


    The tar program prompts you to feed the floppies as necessary.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_325_0.png)


    Use the du -s command to determine the amount of storage you need to archive a
    directory. For example, here’s how you can get the total size of the /etc directory
    in kilobytes:


    ```

    du -s /etc

    8040      /etc

    ```


    The resulting output shows that the /etc directory requires at least 8,040K of
    storage space to back up. If you plan to back up on multiple high-density floppies,
    you need about 8,040/1,200 = 7 floppies.


    # Backing up on Tapes


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_325_1.png)


    Although backing up on tapes is as simple as using the right device name in the
    tar command, you do need to know some nuances of the tape device to use it well.
    When you use tar to back up to the device named /dev/st0 (the first SCSI tape
    drive), the tape device automatically rewinds the tape after the tar program finishes
    copying the archive to the tape. The /dev/st0 device is called a rewinding tape
    device because it rewinds tapes by default.'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'If your tape can hold several gigabytes of data, you may want to write several
    tar archives — one after another — to the same tape. (Otherwise, much of the tape
    may be empty.) To do this, you do not want the tape device to rewind the tape
    after the tar program finishes. To help you with this, some Red Hat Linux tape
    devices are non-rewinding devices. The non-rewinding SCSI tape device is called
    /dev/nst0. Use this device name if you want to write one archive after another
    on a tape.


    After each archive, the non-rewinding tape device writes an end-of-file (EOF)
    marker to separate one archive from the next. You can use the mt command to control
    the tape. Essentially, it moves from one marker to the next or rewinds the tape.
    For example, after you finish writing several archives to a tape using the /dev/nst0
    device name, you can rewind the tape with the following command:


    ```

    mt -f /dev/nst0 rewind

    ```


    After rewinding the tape, you can use the following command to extract files from
    the first archive to the current disk directory:


    ```

    tar xvf /dev/nst0

    ```


    After that, you must move past the EOF marker to the next archive. To do this,
    use the following mt command:


    ```

    mt -f /dev/nst0 fsf 1

    ```


    This positions the tape at the beginning of the next archive. You can now use
    the tar xvf command again to read this archive.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_326_0.png)


    If you save multiple archives on a tape, you have to keep track of the archives
    yourself.


    # Performing incremental backups


    Suppose you backed up your system''s hard disk on a tape using the tar command.
    Because such a full backup can take quite some time, you do not want to repeat
    this task every night. Besides, only a small number of files may have changed
    during the day. You can use the find command to list those files that have changed
    in the past 24 hours, as follows:


    ```

    find / -mtime -1 -type f -print

    ```'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'This command prints a list of files that have changed within the last day.
    The -mtime -1 option means you want the files that were modified less than one
    day ago. You can now combine the find command with the tar command to back up
    only those files that have changed within the last day, as follows:


    ```

    tar cvf /dev/st0 `find / -mtime -1 -type f -print`

    ```


    When you place a command between single back quotes, the shell executes that command
    and places the output at that point in the command line. The net result is that
    the tar program saves only the changed files in the archive. Thus, you get an
    incremental backup that includes files that have changed since the previous day.


    # Performing automated-full and incremental backups


    In Session 25, you learned how to use crontab to set up recurring jobs called
    cron jobs — tasks that the Linux system performs at regular intervals. Backing
    up your system is a good use of the crontab facility. Suppose your backup strategy
    is as follows:


    +   - Every Sunday morning at 1:15 a.m., you back up the entire disk on the tape.

    +   - On the other days of the week (Monday through Saturday), you perform an
    incremental backup at 3:10 a.m. by saving only those files that have changed during
    the past 24 hours.


    To set up this automated backup schedule, log in as root and type the following
    lines in a file named backups. (This example assumes that you are using a SCSI
    tape drive.)


    ```

    15 1 * * 0 tar zcvf /dev/st0 /

    10 3 * * 1-6 tar zcvf /dev/st0 `find / -mtime -1 -type f -print`

    ```


    Next, submit this job schedule with the following crontab command:


    ```

    crontab backups

    ```


    Now you should be set for an automated backup. All you need to do is place a new
    tape in the tape drive every day. You should also label each tape appropriately.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_327_0.png)


    # REVIEW


    In this session, you learned the importance of backing up your files. This session
    highlighted the selection of a backup strategy and backup media based on your'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'needs and your level of tolerance for the risk of business interruption from
    a hard disk failure. You also learned to use the tape archiver program — tar —
    to back up and restore files. Finally, the session showed you how to perform incremental
    tape backups and set up cron jobs for automated-full and incremental tape backups.


    # Quiz Yourself


    +   1. How do you decide what to back up and how often? (See “Selecting a Backup
    Strategy and Storage Media”.)

    +   2. What are some commercial backup utilities for Red Hat Linux? (See the sidebar
    “Commercial Backup Utilities for Red Hat Linux”.)

    +   3. How do you use the tar program to back up files if the total size of files
    exceeds the capacity of a single copy of the backup medium? (See “Backing up and
    Restoring a Multivolume Archive”.)

    +   4. What commands do you use to back up only those files that have changed
    in the previous day? (See “Performing Incremental Backups”.)

    +   5. How do you automate the job of backing up files to a tape? (See “Performing
    Automated-full and Incremental Backups”.)'
  merge: -1
  img_proc: true
