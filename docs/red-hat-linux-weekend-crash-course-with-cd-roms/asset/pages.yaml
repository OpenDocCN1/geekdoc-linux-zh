    # Building and Installing the Kernel and Modules


    This section describes the next three key phases of rebuilding a kernel: building
    the kernel, building and installing the modules, and setting up LILO to load the
    new kernel when you reboot the system.


    # Building the kernel


    You should initiate the next three tasks with a single command line (by entering
    multiple semicolon-separated commands on the same line) so that you can type the
    line, press Enter, and then take a break because building a kernel takes a while.
    Depending on your system, making a new kernel can take anywhere from a few minutes
    to over an hour.


    Type the following on a single line to initiate the building process:


    ```

    make dep; make clean; make zImage

    ```


    The make dep command determines which files have changed and which need compiling
    again. The make clean command deletes old, unneeded files (such as old copies
    of the kernel). Finally, make zImage creates the new kernel in a compressed file
    and places it in a certain directory.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_304_0.png)


    When configuring the kernel, do not link too many features into the kernel by
    answering Yes to configuration options. The kernel file size may be too big to
    fit the 640KB of memory that a PC can use as it boots up. This 640KB limit exists
    because the Intel x86 processors start in what is known as real mode and can only
    access 1MB of memory (of which 640KB is available for programs). This limit is
    a leftover from the old MS-DOS days and applies only as the Linux kernel is initially
    loaded when the PC starts. If the kernel file size is too big, the make command
    displays an error message such as the following:


    ```

    System is too big. Try using bzImage or modules.

    ```


    If you get a “System too big” error, type make bzImage to use a different type
    of compressed kernel that may fit within the memory limits. Otherwise, go through
    the make config step again and eliminate unnecessary features by answering No
    to those configuration questions. For other features that you really need or may
    want to try out, type m to create modules. Although the kernel size is limited
    at startup, the kernel can load as many modules as it needs once the boot process
    is complete.


    As the kernel is built, you see a lot of messages on the screen. When it’s complete,
    a new kernel in the form of a compressed file named zImage appears in the /usr/src/linux/arch/i386/boot
    directory.


    To use the new kernel, you have to copy the kernel to the /boot directory under
    a specific name and edit the /etc/lilo.conf file to set up LILO (the Linux Loader).
    You learn these steps in the “Installing the new kernel and other required files”
    section later in this session. Before you proceed with the kernel installation,
    however, you have to build and install the modules.


    # Building and installing the modules


    If you select any modules during the kernel configuration, you have to build the
    modules and install them. Perform these tasks with the following steps:


    +   1. Type the following commands to build the modules:

    +       cd /usr/src/linux

    +       make modules'
