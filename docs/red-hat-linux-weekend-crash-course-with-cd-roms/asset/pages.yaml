- pgno: 274
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_274_0.png)


    # SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_274_1.png)


    # Understanding How

    Red Hat Linux Boots


    # Session Checklist


    +   - ✓ Understanding the init process

    +   - ✓ Understanding the Red Hat Linux startup scripts


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_274_2.png)


    It is important to learn the sequence in which Red Hat Linux starts processes
    as it boots. You can use this knowledge to start and stop services such as the
    Web server and Network File System (NFS). This session provides you with an overview
    of how Red Hat Linux boots and starts the initial set of processes. You also become
    familiar with the shell scripts that start various services.


    # Understanding the init Process


    When Red Hat Linux boots, it loads and runs the core operating-system program
    from the hard disk. The core operating system, however, is designed to run other
    programs. A process named init starts the initial set of processes on your Linux
    system.


    To see the processes currently running on the system, type the command `ps ax
    | more`. The first column in the output has the heading PID, and that column shows
    a number for each process. PID stands for process ID (identification), which'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'is a sequential number assigned by the Linux kernel. Right at the beginning
    of the list of processes, you notice a process with a process ID (PID) of 1:


    ```

    PID TTY   STAT   TIME COMMAND

    1 ?       S       0:05 init [5]

    ```


    As you can see, init is the first process and it has a PID (or process number)
    of 1. Also, init starts all other processes in your Linux system. That''s why
    init is referred to as the *mother of all processes*.


    What the init process starts depends on the following:


    +   - The *run level*, which designates a system configuration in which only a
    selected group of processes exists

    +   - The contents of the `/etc/inittab` file, a text file that specifies the
    processes to start at different run levels

    +   - A number of shell scripts (located in the `/etc/rc.d` directory and its
    sub-directories) that are executed at a specific run level


    The current run level, together with the contents of the `/etc/inittab` file,
    controls which processes init starts. Linux, for example, has seven run levels:
    0, 1, 2, 3, 4, 5, and 6. By convention, some of these levels indicate specific
    processes that run at that level. Run level 1, for example, denotes a single-user,
    standalone system. Run level 0 means the system is halted, and run level 6 means
    the system is being rebooted. Run levels 2 through 5 are multiuser modes with
    various levels of capabilities.


    The initial default run level is 3 for text-mode login screens and 5 for the graphical
    login screen. As the following section explains, you can change the default run
    level by editing a line in the `/etc/inittab` file.


    To check the current run level, type the following command:


    ```

    /sbin/runlevel

    N 5

    ```


    This command prints two alphanumeric characters as output. The first character
    of the output shows the previous run level (N means there was no previous run
    level), and the second character shows the current level (5).'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Examining the /etc/inittab file


    The /etc/inittab file is the key to understanding the processes that init starts
    at various run levels. You can look at the contents of the file by using the more
    command as follows:


    ```

    more /etc/inittab

    ```


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_276_0.png)


    When looking at the contents of the /etc/inittab file with the more command, you
    do not have to log in as root.


    The following is a listing of the /etc/inittab file on my Red Hat Linux system
    that is set up for a graphical login screen:


    ```

    #

    # inittab      This file describes how the INIT process should set up

    #              the system in a certain run-level.

    # Author:      Miquel van Smoorenburg, <miquels@drinkel.nl.mugnet.org>

    #              Modified for RHS Linux by Marc Ewing and Donnie Barnes

    #

    #

    # Default runlevel. The runlevels used by RHS are:

    # 0 - halt (Do NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS (The same as 3, if you do not have networking)

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (Do NOT set initdefault to this)

    #

    id:5:initdefault:

    # System initialization.

    si::sysinit:/etc/rc.d/rc.sysinit

    10:0:wait:/etc/rc.d/rc 0

    11:1:wait:/etc/rc.d/rc 1

    12:2:wait:/etc/rc.d/rc 2

    13:3:wait:/etc/rc.d/rc 3

    14:4:wait:/etc/rc.d/rc 4

    15:5:wait:/etc/rc.d/rc 5

    16:6:wait:/etc/rc.d/rc 6

    ```'
  merge: -1
  img_proc: true
- pgno: 277
  md: '```

    # Things to run in every runlevel.

    ud::once:/sbin/update


    # Trap CTRL-ALT-DELETE

    ca::ctrlaltdel:/sbin/shutdown -t3 -r now


    # When our UPS tells us power has failed, assume we have a few minutes

    # of power left. Schedule a shutdown for 2 minutes from now.

    # This does, of course, assume you have powerd installed and your

    # UPS connected and working correctly.

    pf::powerfail:/sbin/shutdown -f -h +2 "Power Failure; System Shutting Down"


    # If power was restored before the shutdown kicked in, cancel it.

    pr:12345:powerokwait:/sbin/shutdown -c "Power Restored; Shutdown Cancelled"


    # Run gettys in standard runlevels

    1:2345:respawn:/sbin/mingetty tty1

    2:2345:respawn:/sbin/mingetty tty2

    3:2345:respawn:/sbin/mingetty tty3

    4:2345:respawn:/sbin/mingetty tty4

    5:2345:respawn:/sbin/mingetty tty5

    6:2345:respawn:/sbin/mingetty tty6


    # Run xdm in runlevel 5

    # xdm is now a separate service

    x:5:respawn:/etc/X11/prefdm -nodaemon

    ```


    Lines that start with a hash mark (#) are comments. The first non-comment line
    in the /etc/inittab file specifies the default run level as follows:


    ```

    id:5:initdefault:

    ```


    Even though you do not know the syntax of the /etc/inittab file (and you really
    do not have to learn the syntax), you probably can guess that the 5 in that line
    denotes the default run level for the graphical login screen. Thus, if you want
    your system to run at level 3 after startup (for a plain text-mode login screen),
    all you have to do is change 5 to 3.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_277_0.png)


    Type man inittab to see the detailed syntax of the entries in the inittab file.


    In regard to the file format of the /etc/inittab file, each entry in the /etc/inittab
    file specifies a process that init should start at one or more specified run levels.
    You simply list all the run levels at which the process should run. Each entry
    in the inittab file has four fields — separated by colons — in the following format:


    ```

    id:runlevels:action:process

    ```'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'The fields have the following meanings:


    +   - The *id* field is a unique, one- or two-character identifier. The *init*
    process uses this field internally. You can use any identifier you want as long
    as you do not use the same identifier on more than one line. For example, *si*,
    *x*, and *1* are all valid identifiers.

    +   - The *runlevels* field is a sequence of zero or more characters, each denoting
    a run level. The line with the identifier *1*, for example, applies to run levels
    1 through 5, so the *runlevels* field for this entry is 12345. This field is ignored
    if the *action* field is set to *sysinit*, *boot*, or *bootwait*.

    +   - The *action* field tells the *init* process what to do with that specific
    entry. If this field is *initdefault*, for example, *init* interprets the *runlevels*
    field as the default run level. If this field is set to *wait*, *init* starts
    the process specified in the *process* field and waits until that process exits.
    Table 22-1 summarizes the valid action values you can use in the *action* field.

    +   - The *process* field specifies the process that *init* has to start. Of course,
    some settings of the *action* field require no process field. (When *action* is
    set to *initdefault*, for example, no need exists for a *process* field.)


    Table 22-1

    Valid Actions in /etc/inittab


    | Action | Description |

    |---|---|

    | respawn | Restarts the process whenever it terminates. |

    | wait | Restarts the process once at the specified run level; *init* waits until
    that process exits. |

    | once | Executes the process once at the specified run level. |

    | boot | Executes the process as the system boots, regardless of the run level
    (the *runlevels* field is ignored). |

    | bootwait | Executes the process as the system boots; *init* waits for the process
    to exit (the *runlevels* field is ignored). |

    | off | Nothing happens for this action. |'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Table 22-1

    Continued


    | Action | Description |

    |---|---|

    | ondemand | Executes the process at the specified run level, which must be one
    of a, b, or c. |

    | initdefault | Starts the system at this run level after it boots.

    The *process* field is ignored for this action. |

    | sysinit | Executes the process as the system boots, before any entries with
    the boot or bootwait actions (the *runlevels* field is ignored). |

    | powerwait | Executes the process when *init* receives the SIGPWR signal indicating
    that there is something wrong with the power. Then *init* waits until the process
    exits. |

    | powerfail | Similar to powerwait except that *init* does not wait for the process
    to exit. |

    | powerokwait | Executes the process when *init* receives the SIGPWR signal and
    the */etc/powerstatus* file contains the word OK (indicating the power is back
    on again). |

    | ctrlaltdel | Executes the process when *init* receives the SIGINT signal, which
    occurs when you press Ctrl+Alt+Del. Typically, the *process* field should specify
    the */sbin/shutdown* command with the -r option to reboot the PC. |

    | kbdrequest | Executes the process when *init* receives a signal from the keyboard
    driver that a special key combination has been pressed.

    The key combination should be mapped to KeyboardSignal in the keymap file. |


    The *process* field is typically specified in terms of a shell script, which,
    in turn, can start several processes. The 15 entry, for example, is specified
    as follows:


    ```

    15:5:wait:/etc/rc.d/rc 5

    ```


    This entry specifies that *init* should execute the file */etc/rc.d/rc* with 5
    as an argument. If you look at the file */etc/.rc.d/rc*, you notice that it is
    a shell script file. You can study the file */etc/rc.d/rc* to see how it starts
    various processes for run levels 1 through 5.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'Getting back to the subject of the graphical login screen, the last line of
    the /etc/inittab file starts the graphical login process with the following entry:


    ```

    x:5:respawn:/etc/X11/prefdm -nodaemon

    ```


    This command runs /etc/X11/prefdm, which is a symbolic link to a specific display
    manager. For the GNOME graphical desktop (the default in Red Hat Linux), /etc/X11/prefdm
    is a symbolic link to /usr/bin/gdm — the GNOME display manager. If you use the
    KDE desktop as your default desktop, /etc/X11/prefdm is a symbolic link to /usr/bin/kdm
    — the KDE display manager. This means that regardless of your choice of GUI, init
    starts a display manager at run level 5. The display manager, in turn, displays
    the graphical login dialog box and enables you to log into the system.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_280_0.png)


    If you do not enable the graphical login screen during Red Hat installation (covered
    in Sessions 1 through 3), you can do so by editing the /etc/inittab file. Locate
    the line containing initdefault and make sure that it reads as follows (the run
    level appearing between two colons should be 5):


    ```

    id:5:initdefault:

    ```


    Before you edit the /etc/inittab file, you should know that any errors in this
    file may prevent Red Hat Linux from starting up to a point at which you can log
    in. If you cannot log in, you cannot use your system. As I explain next, you can
    always try out a specific run level with the init command before you actually
    change the default run level in the /etc/inittab file.


    # Trying out a new run level with the init command


    To try a new run level, you do not necessarily have to change the default run
    level in the /etc/inittab file. If you log in as root, you can change the run
    level (and, consequently, the set of processes that run in Linux) with the init
    command. It has the following format:


    ```

    init runlevel

    ```


    Here, runlevel must be a single character denoting the run level that you want.
    To put the system in single-user mode, for example, type the following:


    ```

    init 1

    ```'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'Thus, if you want to try run level 5 (assuming your system is not set up for
    a graphical login screen yet) without changing the /etc/inittab file, enter the
    following command at the shell prompt:


    ```

    init 5

    ```


    The system should end all current processes and enter run level 5. By default,
    the init command waits 20 seconds before stopping all current processes and starting
    the new processes for run level 5.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_281_0.png)


    To switch to run level 5 immediately, type the command init -t0 5. The number
    after the -t option indicates the number of seconds that init waits before changing
    the run level.


    You can also use the telinit command, which is simply a symbolic link to init.
    If you make changes to the /etc/inittab file and want init to reload its configuration
    file, use the command telinit q.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_281_1.png)


    10 Min.

    To Go


    # Understanding the Red Hat Linux Startup Scripts


    The init process runs a number of scripts at system startup. Notice the following
    lines that appear near the beginning of the /etc/inittab file:


    ```

    # System initialization.

    s1::sysinit:/etc/rc.d/rc.sysinit

    ```


    As the comment on the first line indicates, the second line causes init to run
    the /etc/rc.d/rc.sysinit script — the first Red Hat Linux startup script that
    init runs. The rc.sysinit script performs many initialization tasks such as mounting
    the file systems, setting the clock, configuring the keyboard layout, starting
    the network, and loading many other driver modules. The rc.sysinit script performs
    these initialization tasks by calling many other scripts and reading configuration
    files located in the /etc/sysconfig directory.


    After executing the /etc/rc.d/rc.sysinit script, the init process runs the /etc/rc.d/rc
    script with the run level as argument. For example, for run level 5, the following
    line in /etc/inittab specifies what init has to execute:


    ```

    15:5:wait:/etc/rc.d/rc 5

    ```


    This says that init should execute the command /etc/rc.d/rc 5 and wait until that
    command completes.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'The /etc/rc.d/rc script is somewhat complicated. Here is how it works:


    +   - It changes to the directory corresponding to the run level. For example,
    to change to run level 5, the script changes to the /etc/rc.d/rc5.d directory.

    +   - In the directory that corresponds with the run level, it looks for all files
    that begin with a K and executes each of them with an argument stop. This kills
    currently running processes. Then it locates all files that begin with an S and
    executes each file with an argument of start. This starts the processes needed
    for the specified run level.


    To see what gets executed at run level 5, type the following command:


    ```

    ls -l /etc/rc.d/rc5.d

    total 0

    lrwxrwxrwx 1 root root 15 Aug 14 16:24 K01pppoe -> ../init.d/pppoe

