- pgno: 148
  md: '# Exploring Other Tasks Performed by Linuxconf


    Here, you explore the tabs and buttons for the kinds of tasks Linuxconf can perform.
    This session’s coverage of Linuxconf, however, is far from complete. It would
    take many more pages to thoroughly cover Linuxconf’s features and explain each
    of the tasks it can perform.


    Linuxconf has its own home page on the Web at http://www.solucorp.qc.ca/linuxconf/.
    Visit the home page to learn the latest news about Linuxconf and read online documentation.


    Linuxconf includes a Help button in the main Linuxconf window. This Help button
    provides an overview of Linuxconf. A Help window appears when you click the Help
    button.


    Most Linuxconf windows also include Help buttons that provide context-sensitive
    help — information that relates to the task you are performing (see, for example,
    Figure 10-2). Press the nearest Help button to read some relevant information
    about the task at hand. In a few cases, Linuxconf might display a message saying
    that the help file for that item is not written yet.


    In the initial Linuxconf window (see Figure 10-1), you should note that there
    are three tabs: Config, Control, and Status. The Config tab enables you to configure
    various system services, whereas the Control tab includes a tree menu for starting
    and stopping services and controlling various features of Linuxconf. The Status
    tab includes a tree menu that enables you to view various message logs such as
    the messages displayed by the Linux kernel as your Red Hat Linux system boots.


    To explore the Config, Control, and Status buttons, click on each tab and then
    click the tree menu items to see what happens. You should spend a few minutes
    exploring all three tabs in Linuxconf to get a feel for the types of system and
    network administration tasks you can perform with this tool.


    # REVIEW


    This session began with an overview of Linux system-administration and network-administration
    tasks. Then you used Linuxconf to add one or more user accounts. Finally, you
    explored the tabs in Linuxconf to learn the types of system-administration and
    network-administration tasks you can perform using Linuxconf.'
  merge: -1
  img_proc: true
