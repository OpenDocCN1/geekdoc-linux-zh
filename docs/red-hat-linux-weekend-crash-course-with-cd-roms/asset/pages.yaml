    The make menuconfig, make xconfig, and make config commands achieve the same end
    result — each stores your choices in a text file named .config located in the
    /usr/src/linux directory. Because the filename starts with a period, you don’t
    see it when you use the ls command alone to list the directory. Instead type ls
    -a to see the .config file in the directory listing.


    > All that the kernel configuration step does is capture your choices in the .config
    file. The kernel file does not change until you actually compile the kernel with
    the make command. That means you can go through the kernel configuration option
    as many times as you want.


    As noted in the preceding section, you can use any of the configuration tools
    (make xconfig, make menuconfig, or make config) to perform the kernel configuration.
    The easiest way is to type make xconfig. This builds an X Window System-based
    configuration tool and runs it. The initial window displays a set of buttons,
