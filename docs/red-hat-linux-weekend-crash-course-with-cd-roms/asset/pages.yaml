- pgno: 114
  md: 'Many users use the alias feature to give more familiar names to common commands.
    If you are a DOS user and you use the md command to create a directory, you can
    simply define md as an alias for mkdir (the Linux command that creates a new directory).
    You do this as follows:


    ```

    alias md=mkdir

    ```


    Now, you can type md dirname to create a new directory named dirname. Another
    good use of an alias is to redefine a dangerous command, such as rm, to make it
    safer. By default, the rm command deletes one or more specified files. If you
    type rm * by mistake, rm deletes all files in your current directory. I learned
    this the hard way one day when I wanted to delete all files that ended with .xwd.
    (These files contained old screen images that I no longer needed.) I intended
    to type rm *.xwd, but somehow I ended up typing rm * .xwd. I got the following
    message:


    ```

    rm: .xwd: No such file or directory

    ```


    At first I was puzzled by the message, so I typed ls to see the directory''s contents
    again. When the listing showed nothing, I realized that I had an extra space between
    the * and .xwd. All the files in that directory, of course, were gone forever.


    The rm command provides the -i option, which asks for confirmation before deleting
    a file. To make that option a default, add the following alias definition to the
    .bash_profile file in your home directory:


    ```

    alias rm=''rm -i''

    ```


    From now on, when you use rm to delete a file, the command first asks for confirmation
    as follows:


    ```

    rm .bash_profile

    rm: remove `.bash_profile''? n

    ```


    Press y to delete the file; otherwise, press n.


    # Running commands in the background


    When you use MS-DOS, you have no choice but to wait for each command to complete
    before you enter the next command. (You can type ahead a bit, but the MS-DOS system
    can hold only a few characters in its internal buffer.) Linux,'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'however, can handle multiple tasks simultaneously. The only problem you may
    have is that the terminal or console is tied up until a command completes.


    If you work in a terminal window and a command takes too long to complete, you
    can open another terminal window and continue to enter other commands. If you
    work in text mode, however, and a command seems to take too long, you need some
    other way to access your system.


    You can start a lengthy command in the background, which means that the shell
    starts the process corresponding to a command and immediately returns to accept
    more commands. The shell does not wait for the command to complete; the command
    runs as a distinct process in the background. To start a process in the background,
    you simply place an ampersand (&) at the end of a command line.


    For example, when I want to search the entire file system for a file using the
    find command, I typically run that command in the background and send the output
    to a file. To try out the find command in the background, type cd to change to
    your home directory and then type the following command:


    ```

    find / -name "README*.*" -print > all.readme &

    ```


    You should immediately get a Bash prompt. You can now go on with other commands.
    When the find command finishes, the search results should appear in the file all.readme
    in your home directory.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_115_0.png)


    If a command (that you did not run in the background) seems to be taking a long
    time, press Ctrl+Z to stop it. Then type bg to put that process in the background.


    # Using virtual consoles


    Red Hat Linux comes with a number of virtual consoles. Even though your Red Hat
    Linux system only has one physical terminal or console (the combination of monitor
    and keyboard is called the terminal or console), it gives you the appearance of
    having multiple consoles. From the graphical X screen (the GNOME or KDE desktop),
    press Ctrl+Alt+F1 to get to the first virtual console, press Ctrl+Alt+F2 for the
    second one, and so on. Each of these virtual consoles is a text screen where you
    can log in and type Linux commands to perform various tasks.


    Go ahead and press Ctrl+Alt+F2 to switch to the second virtual console. Then log
    in and try some Linux commands. You can log out by typing exit at the Bash prompt.
    To get back to the graphical X display, press Ctrl+Alt+F7.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_115_1.png)'
  merge: -1
  img_proc: true
