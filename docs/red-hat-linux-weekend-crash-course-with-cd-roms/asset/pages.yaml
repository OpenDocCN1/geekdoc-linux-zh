    In the previous session you learned how to log in, log out, and shut down your
    Linux system. This session shows you how to work with files and directories. The
    session starts with a quick introduction to the Linux file system. It then shows
    you how to use the GNOME file manager and several Linux commands to work with
    files and directories.


    # Understanding the Linux File System


    Like any other operating system, Linux organizes information in files and directories.
    The files are, in turn, contained in directories. A directory is a special file
    that can contain other files and directories, giving rise to a hierarchical structure.
    This hierarchical organization of files is called the file system.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'The Linux file system provides a unified model of all storage in the system.
    The file system has a single root directory, indicated by a forward slash (/).
    Then there is a hierarchy of files and directories. Parts of the file system can
    reside in different physical media such as on hard disk, floppy disk, and CD-ROM.
    Figure 6-1 illustrates the concept of the Linux file system and how it spans multiple
    physical devices.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_95_0.png)


    # Figure 6-1


    The Linux file system provides a unified view of storage that may span multiple
    drives.


    If you are familiar with MS-DOS or Windows 95/98/NT/2000, you should note that
    there is no concept of a drive letter in UNIX. Also, filenames do not have a strict
    8.3 name-extension format. (The term 8.3 filename comes from the use of an eight-character
    name and three-character extension in MS-DOS.) In Linux, you can have long filenames
    (up to 256 characters) and filenames are case-sensitive. Often, UNIX filenames
    have multiple extensions such as sample.tar.Z. Here are some UNIX filenames: index.html,
    Makefile, kernel-2.2.15-2.5.0.i686.rpm, .bash_profile, and httpd_src.tar.gz.


    To locate a file, you need more than just the file’s name; you also need information
    about the directory hierarchy. The term pathname refers to the complete specification
    necessary to locate a file — the complete hierarchy of directories leading to
    the file — and the filename. Figure 6-2 shows a typical Linux pathname for a file.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_96_0.png)


    Figure 6-2

    *A typical Linux pathname*


    As you can see from Figure 6-2, a Linux pathname consists of the following parts:


    +   1. The root directory, indicated by a forward slash (/) character

    +   2. The directory hierarchy, with each directory name separated from the previous
    one by a forward slash (/) character. A / appears after the last directory name.

    +   3. The filename, with a name and one or more optional extensions


    Now that you know the basics of the Linux file system, you can explore the file
    system. You can access the files and directories in two ways:


    +   - By using a graphical file manager in the GNOME or KDE desktop

    +   - By typing appropriate Linux commands in a terminal window or a text console


    This session covers both the graphical file manager and the Linux commands. The
    graphical file manager is similar to Windows Explorer and is intuitive to use.
    Now spend a few minutes exploring the file system using the GNOME file manager.
    (The KDE file manager works in a similar manner, so I don''t cover it here.)


