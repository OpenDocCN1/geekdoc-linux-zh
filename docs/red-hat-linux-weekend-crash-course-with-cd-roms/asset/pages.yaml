- pgno: 388
  md: '9. A typical RPM file has the form XFree86-3.3.6-20.i386.rpm. Everything up
    to the first dash is the RPM name (XFree86); the numbers between the two dashes
    is the version number (3.3.6); the next number is Red Hat’s release number (20);
    the next extension (i386) is the architecture; and the final extension is rpm
    to denote that this is an RPM file.


    10. I might rebuild the Linux kernel after I patch the kernel sources, to add
