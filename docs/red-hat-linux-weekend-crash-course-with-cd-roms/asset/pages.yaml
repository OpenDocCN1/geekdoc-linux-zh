- pgno: 283
  md: '```

    lrwxrwxrwx 1 root root 13 Aug 14 15:58 S90xfs -> ../init.d/xfs

    lrwxrwxrwx 1 root root 17 Aug 14 15:55 S95anacron -> ../init.d/anacron

    lrwxrwxrwx 1 root root 19 Aug 14 16:16 S99linuxconf -> ../init.d/linuxconf

    lrwxrwxrwx 1 root root 11 Aug 14 15:56 S99local -> ../rc.local

    ```


    As the output shows, all files with names starting with K and S are symbolic links
    to scripts that reside in the /etc/rc.d and /etc/rc.d/init.d directories. In fact,
    the /etc/rc.d/rc script executes these files exactly in the order that they appear
    in the directory listing.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_283_0.png)


    Note that the last file in the directory listing is a symbolic link to the ../rc.local
    script. This means that /etc/rc.d/rc.local is executed after all other scripts.
    So you can place in that script any command you want executed whenever your Linux
    system boots.


    Most of the startup scripts reside in the /etc/rc.d/init.d directory. You can
    manually invoke scripts in this directory to start, stop, or restart specific
    processes — usually servers. For example, to stop the Web server, type the following
    command:


    ```

    /etc/rc.d/init.d/httpd stop

    Shutting down http: [ OK ]

    ```


    You can enhance your system administration skills by familiarizing yourself with
    the scripts in the /etc/rc.d/init.d directory. To see the listing, type the following
    command:


    ```

    ls /etc/rc.d/init.d

    ```


    ```

    anacron halt keytable netfs pppoe sendmail ypbind

    apmd httpd killall network random single yppasswdd

    arpwatch identd kudzu nfs rawdevices smb ypserv

    atd innd linuxconf nfslock rstatd snmpd

    crond ipchains lpd pcmcia rusersd syslog

    functions isdn mars-nwe portmap rwalld xfs

    gpm kdcrotate named postgresql rwhod xinetd

    ```


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_283_1.png)


    The script names give you some clue about what server the script can start and
    stop. For example, the nfs script starts and stops the processes required for
    NFS (Network File System) services. At your leisure, you may want to study some
    of these scripts to see what each one does. You don’t have to understand all the
    shell programming; the comments should help you learn the purpose of each script.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# REVIEW


    This session provided an overview of how the init process starts an initial set
    of processes. You learned about the /etc/inittab file that controls what init
    does. You also learned about the Red Hat Linux startup scripts in the /etc/rc.d
    directory and its subdirectories.


    # QUIZ YOURSELF


    +   1. Why is init referred to as the “mother of all processes?” (See “Understanding
    the init Process”.)

    +   2. How can you determine the current run level of your Linux system? (See
    “Understanding the init Process”.)

    +   3. What can you do to make your Linux system start at run level 3 when you
    reboot the system? (See “Examining the /etc/inittab File”.)

