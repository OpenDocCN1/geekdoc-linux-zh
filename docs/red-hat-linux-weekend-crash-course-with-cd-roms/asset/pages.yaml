- pgno: 125
  md: 'split command to break up the file into smaller files, each of which can fit
    on a floppy.


    By default, split puts 1,000 lines into each file. The files are named by groups
    of letters such as aa, ab, ac, and so on. You can specify a prefix for the filenames.
    For example, to split a large file called huge file.tar into smaller files that
    fit into several high-density 3.5-inch floppy disks, use split as follows:


    ```

    split -b 1440k huge file.tar part.

    ```


    This command splits the huge file.tar file into 1440K chunks so that each can
    fit onto a floppy disk. The command creates files named part.aa, part.ab, part.ac,
    and so on.


    To combine the split files back into a single file, use the cat command as follows:


    ```

    cat part.?? > huge file.tar

    ```


    In this command-line, each question mark matches a single character. Thus, the
    Bash shell expands part.?? to file names, such as part.aa, part.ab, part.ac, and
    so on.


    # Commands for Maintaining the File System


    Suppose you want to access the files on this book''s companion CD-ROMs. To do
    so, you have to first mount the CD-ROM drive''s file system on a specific directory
    in the Red Hat Linux file system. To try the mount command, log in as root, insert
    a CD-ROM in the CD-ROM drive, and then type the following command:


    ```

    mount /dev/cdrom /mnt/cdrom

    mount: block device /dev/cdrom is write-protected, mounting read-only

    ```


    This command mounts the file system on the device named /dev/cdrom (the CD-ROM)
    in the /mnt/cdrom directory (also called the mount point) in the Linux file system.
    The response from the mount command indicates that the CD-ROM is mounted as a
    read-only file system. After the mount command successfully completes its task,
    you can access the files in the CD-ROM by referring to the /mnt/cdrom directory
    as the top-level directory of the CD-ROM. In other words, to see the contents
    of the RedHat directory in the CD-ROM, type:


    ```

    ls -F /mnt/cdrom/RedHat

    RPMS/  TRANS.TBL  base/

    ```


    You can actually mount a device on any directory on the Linux file system. Essentially,
    the mount point does not have to be /mnt/cdrom; it can be any empty'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'directory. For example, if you like to refer to the CD-ROM drive as /cd, first
    create the /cd directory with the mkdir /cd command and then use the following
    mount command:


    ```

    mount /dev/cdrom /cd

    ```


    Before you try this command, you have to “unmount” the CD-ROM with the following
    umount command:


    ```

    umount /dev/cdrom

    ```


    Only then you can mount the CD-ROM again on another directory in the Linux file
    system.


    I have shown you the longer syntax for the mount command in which you explicitly
    specify the device name and the mount point, but Red Hat Linux contains a line
    in the /etc/fstab file that enables you to mount the CD-ROM through one of the
    following commands:


    ```

    mount /mnt/cdrom

    mount /dev/cdrom

    ```


    It is customary to mount devices on directories in the /mnt directory. Red Hat
    Linux comes with two predefined directories: /mnt/cdrom for mounting the CD-ROM
    and /mnt/floppy for mounting the floppy.


    In addition to mount and umount, you should know two more commands — df and du
    — that enable you to check the disk space usage. These commands are simple to
    use. The df command shows you a summary of disk space usage for all mounted devices,
    as shown in this example:


    ```

    df

    ```


    | Filesystem | 1k-blocks | Used | Available | Use% | Mounted on |

    |---|---|---|---|---|---|

    | /dev/hda2 | 2000236 | 1103852 | 794776 | 59% | / |

    | /dev/hda1 | 2096160 | 1833600 | 262560 | 88% | /dosc |

    | /dev/hdc | 656560 | 656560 | 0 | 100% | /mnt/cdrom |


    The output is a table that shows the device, the total kilobytes of storage, how
    much is in use, how much is available, the percentage being used, and the mount
    point. For example, on my system, the /dev/hda2 device (a disk partition) is mounted
    on the Linux file system’s root directory (/). It has about 2GB of space of which
    1.1GB (or 59 percent) are used and 794MB are available. Similarly, you can see
    from the last line that the CD-ROM has about 656MB of storage in use.'
  merge: -1
