- pgno: 155
  md: '# Connecting a Modem to the PC


    When you install Red Hat Linux from this book’s companion CD-ROMs, you automatically
    install some tools that you can use to dial out from your Linux system with a
    modem. Before you can dial out, however, you have to make sure that you have a
    modem properly connected to one of the serial ports of your PC and that the Linux
    devices for the serial ports are set up correctly. Make sure that your modem is
    properly connected to the power supply and that the modem is also connected to
    the telephone line.


    If you have an external modem, buy the right type of cable to connect the modem
    to the PC. You need a straight-through serial cable to connect the modem to the
    PC. The connectors at the ends of the cable depend on the type of serial connector
    on your PC. The modem end of the cable needs a male 25-pin connector. The PC end
    of the cable often is a female 9-pin connector. You can buy modem cables at most
    computer stores. The 9-pin female - 25-pin male modem cables are often sold under
    the label “AT Modem Cable.”


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_155_0.png)


    If your PC has an internal modem, all you have to do is connect the phone line
    to a phone jack at the back of the internal-modem card.


    # Learning the serial-port device names


    The PC typically has two serial ports, called COM1 and COM2 in MS-DOS parlance.
    (Most new PCs with Universal Serial Bus have only one serial port.) The PC also
    can support two more serial ports: COM3 and COM4. Because of these port names,
    the serial ports are often referred to as COM ports.


    Like other devices, the serial ports need interrupt request (IRQ) numbers and
    I/O port addresses. Two IRQs — 3 and 4 — are shared among the four COM ports.
    Table 11-1 lists the IRQs and I/O port addresses assigned to the four serial ports.
    Like other devices in Linux, device files in the /dev directory represent the
    serial port devices. Table 11-1 shows the serial device names corresponding to
    the PC’s COM ports.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Table 11-1

    Device Names for Serial Ports


    | COM Port | Device Name | IRQ | I/O Address |

    |----------|-------------|-----|-------------|

    | COM1 | /dev/ttyS0 | 4 | 0x3f8 |

    | COM2 | /dev/ttyS1 | 3 | 0x2f8 |

    | COM3 | /dev/ttyS2 | 4 | 0x3e8 |

    | COM4 | /dev/ttyS3 | 3 | 0x2e8 |


    If you install Red Hat Linux from this book’s companion CD-ROMs, all these devices
    should already be in your system. If you check the /dev directory, you should
    find the /dev/ttyS* devices in which * is 0, 1, 2, and 3. From a terminal window,
    type ls -l /dev/ttyS* to see a listing of these device files.


    # Checking if Red Hat Linux detects the serial devices


    When you install Red Hat Linux from this book’s CD-ROMs, following the directions
    in Sessions 1 through 3, the necessary Linux serial devices are automatically
    created for you. You should have the /dev/ttyS* devices for dialing in and out
    through the modem.


    To verify that Linux detects the serial port correctly, check the boot messages
    with the dmesg command:


    ```

    dmesg | grep ttyS*

    ```


    If you see a message such as the following, Linux detects a serial port in your
    PC:


    ```

    ttyS01 at 0x02f8 (irq = 3) is a 16550A

    ```


    In this case, the message indicates that Linux detects the second serial port
    (COM2). It shows the I/O address (0x2f8) and IRQ (3). The last part of the message
    — 16550A — refers to the identifying number of the universal asynchronous receiver/transmitter
    (UART) chip, which is at the heart of all serial communications hardware. (The
    UART converts each byte to a stream of ones and zeros and then back to bytes when
    needed.)'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'The boot messages are also stored in the /var/log/messages file. Therefore,
    you can search for the serial port’s name in the /var/log/messages file with the
    grep command, as follows:


    ```

    grep ttyS /var/log/messages

    ```


    You can also check for the serial ports with the setserial command. Type the following
    command to see detailed information about the serial ports:


    ```

    setserial -g /dev/ttyS*

    ```


    A telltale sign of a problem is a message from setserial that shows the UART as
    unknown (as shown in the following example):


    ```

    /dev/ttyS0, UART: unknown, Port: 0x03f8, IRQ: 4

    ```


    If the UART shows up as unknown, then Linux does not detect the serial port.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_157_0.png)


    Red Hat Linux not detecting the serial port usually occurs because your PC’s BIOS
    is set up to expect a Plug and Play (PnP) operating system. Reboot your PC and,
    as it powers up, press a key (typically a function key, such as F2, but the exact
    key depends on your PC’s BIOS) to enter BIOS setup. In the setup screen, locate
    the option for PnP operating system (often labeled “Plug & Play O/S”) and turn
    off that option. Then save the BIOS settings and exit. This causes the PC to reboot.
    This time, when Red Hat Linux boots, the kernel should be able to detect the PC’s
    serial port correctly.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_157_1.png)


    # Dialing out with Minicom


    After you complete the physical installation of the modem and verify that the
    necessary Linux device files exist, you can try to dial out through the modem.
    The best approach is to use the Minicom serial communications program included
    in the Red Hat Linux distribution on this book’s CD-ROMs and installed in the
    /usr/bin directory. The Minicom program is a serial communications program with
    a text-based interface that emulates a VT102 terminal. Minicom is similar to other
    communications software, such as Procomm or Crosstalk, which you may have used
    under MS-DOS or Windows.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Running Minicom as the root user


    To run Minicom, type minicom at the shell prompt in the terminal window or in
    a virtual console. If you run Minicom as a normal user (not root), Minicom displays
    the following error message and exits (unless the system manager has already set
    up Minicom for use by normal users):


    ```

    minicom

    minicom: there is no global configuration file /etc/minirc.dfl

    Ask your sysadm to create one (with minicom -s).

    ```


    Log in as root and then type


    ```

    minicom -s

    ```


    Minicom starts and displays a dialog box (see Figure 11-1) with a setup menu that
    enables you to configure various aspects of Minicom, including the serial port
    and the modem and dialing commands. To enter the modem initialization commands,
    use the arrow key to highlight the Modem and dialing item (as shown in Figure
    11-1).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_158_0.png)


    Figure 11-1

    Minicom''s setup menu


    With the Modem and dialing entry highlighted, press Enter. Minicom displays another
    menu (see Figure 11-2) with a list of settings you can change. Minicom places
    the cursor on the first line, as shown in Figure 11-2. Press A to change the modem
    initialization string.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_159_0.png)


    # Figure 11-2


    Setting up modem and dialing parameters in Minicom


    You can then use the Backspace key to edit that line and type the AT command you
    need to initialize the modem. For example, I have a 56K modem that I initialize
    with the following AT command:


    ```

    AT &F1 E1 V1

    ```


    After you enter the modem initialization string, press Enter to return to the
    top-level menu.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_159_1.png)


    By the way, the AT commands refer to commands that you can use to control a modem
    and perform tasks such as dialing a number, turning the modem’s speaker on or
    off, and setting the modem to answer an incoming call. These commands start with
    the two characters: AT (for attention). You can use AT commands for situations
    in which the communications software is primitive and all the software does is
    send the modem whatever you type.


    If you have no more changes to make, use the up and down arrow keys to highlight
    the item labeled Save as dfl (meaning save as default) and then press Enter. Minicom
    saves the settings in the /etc/minirc.dfl file — the default configuration file
    for Minicom. After that, you can exit Minicom by selecting Exit from Minicom and
    pressing Enter.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Running Minicom as an ordinary user


    You also need to do the following before any user can run Minicom:


    +   - Open the text file /etc/minicom.users in a text editor and verify that it
    has a line with the word ALL. (This enables all users to access Minicom''s default
    configuration file.) If not, add a line with the word ALL.

    +   - Assuming that you want all users to be able to dial out using the modem,
    enable any user to read from and write to the serial port where the modem is connected.
    For example, if the modem is on COM1 (/dev/ttyS0), type chmod o+rw /dev/ttyS0
    to give everyone write permission for that device.

    +   - Establish a link between the /dev/modem and the serial port device where
    the modem is connected. If the modem is on COM1 (/dev/ttyS0), you should type
    the following command:


    ```

    ln -s /dev/ttyS0 /dev/modem

    ```


    After that, you can run Minicom as an ordinary user. When Minicom first runs,
    it resets the modem. Figure 11-3 shows the result of running Minicom in a terminal
    window.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_160_0.png)


    Figure 11-3

    The initial Minicom screen in a terminal window


    Press Ctrl+A to get the attention of the Minicom program. Then if you press Z,
    a help screen appears in the form of a text window (as shown in Figure 11-4).'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_161_0.png)


    # Figure 11-4

    The Minicom help screen


    In the help screen, you can get information about other Minicom commands. From
    the help screen, press Enter to return to online mode. In online mode, you can
    use the modem’s AT commands to dial out. In particular, you can use the ATDT command
    to dial the phone number of another modem (for example, your Internet Service
    Provider’s computer or a system at your work), as shown in Figure 11-5. Once you
    get the login prompt, you can log in as usual and use the remote system.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_161_1.png)


    # Figure 11-5

    Dialing a remote system using Minicom


    When you log out of the other system and want to exit Minicom, press Ctrl+A and
    then type X to exit the program. Press Enter again in response to the Minicom
    prompt.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_161_2.png)'
  merge: -1
  img_proc: true
