- pgno: 132
  md: '# Text Editing with ed and vi


    All UNIX systems, including Linux, come with two text-mode text editors:


    +   - ed, a line-oriented text editor

    +   - vi, a full-screen text editor which supports the command set of an earlier
    editor named ex


    Although the graphical text editors are easy to use, ed and vi may be more cryptic
    than other — more graphical — text editors. You should learn the basic editing
    commands of ed and vi because sometimes these two may be the only editors available.
    When you run into a system problem and Linux refuses to boot from the hard disk,
    for example, you may have to boot from a floppy. In this case, you have to edit
    system files with the ed editor because that editor is small enough to fit on
    the floppy. As the next two sections demonstrate, learning the basic text-editing
    commands of ed and vi isn’t hard.


    # Using ed


    The ed text editor works with a buffer — an in-memory storage area where the actual
    text resides until you explicitly store the text in a file. Typically, you have
    to use ed only when you boot a minimal version of Linux (for example, from a boot
    floppy) and the system does not support full-screen mode. In all other situations,
    you can use the vi editor that works in a text-mode full-screen.


    As you see in the following examples using the ed editor, you work in either command
    mode or text-input mode:


    +   - Command mode is what you get by default. In this mode, anything that you
    type is interpreted as a command. The ed text editor has a simple command set
    wherein each command consists of one or more characters.

    +   - Text-input mode enables you to enter text into the buffer. You can enter
    input mode with the commands a (append), c (change), or i (insert). After entering
    lines of text, you can leave input mode by entering a period (.) on a line by
    itself.


    To practice editing a file, copy the /etc/fstab file to your home directory with
    the following commands:


    ```

    cd

    cp /etc/fstab .

    ```'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Now you should have a file named fstab in your home directory. Type the following
    command to begin editing a file in ed:


    ```

    ed -p: fstab

    608

    :

    ```


    This example uses the -p option to set the prompt to the colon character (:) and
    opens the fstab file (in the current directory, which should be your home directory)
    for editing. The ed editor opens the file, reports the number of characters in
    the file (608), and displays the prompt (:), and waits for a command.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_133_0.png)


    When editing with ed, you may find it helpful to always turn on a prompt character
    using the -p option. Without the prompt, it’s difficult to tell whether ed is
    in input mode or command mode.


    After ed opens a file for editing, the current line is the last line of the file.
    To see the current line number (the current line is the line to which ed applies
    your command), use the .= command:


    ```

    :.=

    8

    ```


    This output tells you that the fstab file has eight lines. (Your system’s /etc/fstab
    file may have a different number of lines, in which case you see a different number.)


    You can use the 1,$p command to see all lines in a file, as the following example
    shows:


    ```

    :1,$p

    LABEL=/                 /               ext2    defaults        1 1

    /dev/hda1               /dos c          vfat    defaults        0 0

    /dev/cdrom              /mnt/cdrom      iso9660 noauto,owner,ro 0 0

    /dev/fd0                /mnt/floppy     auto    noauto,owner    0 0

    /dev/zip                /mnt/zip        auto    noauto,owner    0 0

    none                    /proc           proc    defaults        0 0

    none                    /dev/pts        devpts  gid=5,mode=620  0 0

    /dev/hda4               swap            swap    defaults        0 0

    :

    ```


    To go to a specific line, type the line number:


    ```

    :8

    /dev/hda4               swap            swap    defaults        0 0

    :

    ```'
  merge: -1
  img_proc: true
