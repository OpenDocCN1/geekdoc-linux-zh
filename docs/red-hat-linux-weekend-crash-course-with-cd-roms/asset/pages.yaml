    # Exploring the /proc File System


    You can find out a great deal about your Red Hat Linux system by consulting the
    contents of a special file system known as the /proc (also called the process
    file system) file system. It can help you monitor a wide variety of information
    about your system. In fact, you can even change kernel parameters through the
    /proc file system and thereby modify the system’s behavior.


    The /proc file system is not a real directory on the disk, but a collection of
    data structures in memory (managed by the Linux kernel) that appears to the user
    as a set of directories and files.


    You can access the /proc file system and navigate it just as you do any other
    directory, but you have to know the meaning of various files to interpret the
    information. Typically, you can use the cat or more command to view the contents
    of a file in /proc; the file’s contents provide information about some aspect
    of the system.


    As with any directory, you may want to start by looking at a detailed directory
    listing of /proc. To do so, type ls -l /proc. In the output, the first set of
    directories (indicated by the letter d at the beginning of the line) represents
    the processes that are currently running on your system. Each directory that corresponds
    to a process has the process ID (a number) as its name.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_346_0.png)


    You should also notice a very large file in the listing named /proc/kcore; that
    file represents the entire physical memory of your system. There is no physical
    file occupying that much space on your hard disk, so do not try to remove the
    file to reclaim disk space.


    The /proc/cpuinfo file in /proc lists the key characteristics of your system,
    such as processor type and floating-point processor information. You can view
    the'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'processor information by typing cat /proc/cpuinfo. For example, here is what
    I get when I type this command on my system:


    ```

    cat /proc/cpuinfo

    processor      : 0

    vendor_id      : GenuineIntel

    cpu family     : 5

    model          : 4

    model name     : Pentium MMX

    stepping       : 3

    cpu MHz        : 199.616468

    fdiv_bug       : no

    hlt_bug        : no

    sep_bug        : no

    f00f_bug       : yes

    fpu            : yes

    fpu_exception  : yes

    cpuid level    : 1

    wp             : yes

    flags          : fpu vme de pse tsc msr mce cx8 mmx

    bogomips       : 398.13

    ```


    This output is from a 200MHz Pentium MMX system. The listing shows many interesting
    characteristics of the processor. Notice the line that starts with fdiv_bug. Remember
    the infamous Pentium floating-point division bug? The bug is in an instruction
    called fdiv (for floating-point division). Thus, the fdiv_bug line indicates whether
    this particular Pentium has the bug (fortunately, my system''s processor does
    not).


    The last line in the /proc/cpuinfo file shows the BogoMips for the processor,
    as computed by the Linux kernel when it boots. BogoMips is something that Linux
    uses internally to calibrate time delay loops.


    Table 28-1 summarizes some of the files in the /proc file system from which you
    can get information about your Red Hat Linux system. You can view some of these
    files on your system to see what they contain.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_347_0.png)


    Not all the files shown in Table 28-1 are present on your system. The contents
    of the /proc file system depends on the kernel configuration and the loaded driver
    modules (which, in turn, depend on your PC''s hardware configuration).'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Table 28-1


    Some Files and Directories in /proc


    | Filename | Content |

    |---|---|

    | /proc/apm | Information about advanced power management (APM) |

    | /proc/bus | Directory with bus-specific information for each bus type, such
    as PCI |

    | /proc/cmdline | The command line used to start the Linux kernel (for example,
    auto BOOT_IMAGE=linux ro root=303) |

    | /proc/cpuinfo | Information about the CPU (the microprocessor) |

    | /proc/devices | Available block and character devices in your system |

    | /proc/dma | Information about DMA (direct memory access) channels in use |

    | /proc/filesystems | List of supported file systems |

    | /proc/ide | Directory containing information about IDE devices |

    | /proc/interrupts | Information about interrupt request (IRQ) numbers and how
    they are used |

    | /proc/ioports | Information about input/output (I/O) port addresses and how
    they are used |

    | /proc/kcore | Image of the physical memory |

    | /proc/kmsg | Kernel messages |

    | /proc/ksyms | Kernel symbol table |

    | /proc/loadavg | Load average (average number of processes waiting to run in
    the last 1, 5, and 15 minutes) |

    | /proc/locks | Current kernel locks (used to ensure that multiple processes do
    not write to a file at the same time) |

    | /proc/meminfo | Information about physical memory and swap space usage |

    | /proc/misc | Miscellaneous information |'
  merge: -1
  img_proc: true
