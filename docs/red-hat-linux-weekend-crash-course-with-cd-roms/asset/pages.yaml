- pgno: 352
  md: '# Maintaining System Security


    # Session Checklist


    +   - [x] Establishing a security policy

    +   - [x] Securing your system

    +   - [x] Monitoring system security


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_352_0.png)


    As a system administrator, you have to worry about your Linux system’s security.
    For a standalone system or a system used in an isolated local area network (LAN),
    you must ensure that a user does not intentionally or inadvertently modify, delete,
    or destroy system files. If your Linux system is connected to the Internet, you
    must also secure the system from unwanted accesses. Intruders, also known as *crackers*,
    typically impersonate a user, steal or destroy information, and even deny access
    to your own system (known as *denial of service*). This session only briefly covers
    some key aspects of securing your Linux system. As you’ll see, Red Hat Linux already
    includes the tools you need to maintain system security.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_353_0.png)


    To learn more about Linux security, consult the Linux Security HOWTO at http://metalab.unc.edu/pub/Linux/docs/HOWTO/Security-HOWTO.
    Another good resource is the Linux Administrator''s Security Guide, which you
    can read online at http://www.securityportal.com/lasg/.


    # Establishing a Security Policy


    The first step in securing your Linux system is to set up a security policy. The
    security policy is your guide (or rules) to what you enable users (as well as
    visitors over the Internet) to do on the Linux system. The level of security depends
    on how you use the Linux system and how much is at risk if someone gains unauthorized
    access to your system.


    If you are a system administrator for Linux systems at an organization of any
    sort, you probably want to involve the management as well as the users in setting
    up the security policy. Obviously, you cannot create such an imposing policy that
    no one can do any work on the system. On the other hand, if the users are creating
    or using data that''s valuable to the organization, you have to set up a policy
    that aims to protect the data from disclosure to outsiders. In other words, the
    security policy should strike a balance between the users'' needs and the need
    to protect the system.


    For a standalone Linux system or a home system that you occasionally connect to
    the Internet, the security policy can be just a listing of the Internet services
    that you want to run on the system and the user accounts you plan to set up on
    the system. For any larger organization, you probably have one or more Linux systems
    on a LAN connected to the Internet — preferably through a firewall (a device that
    controls the flow of Internet Protocol (IP) packets between the LAN and the Internet).
    In such cases, the security policy typically addresses the following areas:


    +   - *Authentication:* Who gets access to system? What is the minimum length
    and complexity of passwords? How often must you change passwords? How long can
    a user be idle before that user is logged out automatically?

    +   - *Authorization:* What can different classes of users do on the system? Who
    can have the root password?

    +   - *Data Protection:* What data has to be protected? Who has access to the
    data?

    +   - *Internet Access:* What are the restrictions on users (from the LAN) accessing
    the Internet? What Internet services (such as Web, Internet Relay Chat, and so
    on) can the users access? Are incoming e-mails and attachments scanned for viruses?
    Is there a network firewall?'
  merge: -1
  img_proc: true
- pgno: 354
  md: '+   - *Internet Services*: What Internet services are allowed on each Linux
    system? Are there any file servers? Mail servers? Web servers? What services run
    on each type of server? What services, if any, run on Linux systems used as desktop
    workstations?

    +   - *Security Audits*: Who tests whether the security is adequate? How often
    is the security tested? How are problems found during security testing handled?

    +   - *Responsibilities*: Who is responsible for maintaining security? Who monitors
    log files and any audit trails for signs of unauthorized access? If any security
    breach occurs, who must be informed?


    The remainder of this session shows you some of the ways in which you can enhance
    and maintain the security of your Red Hat Linux system.


    # Securing the System


    Once you have a security policy defined, you can proceed to secure the system
    according to the policy. The exact steps depend on what you want to do with the
    system — whether it is a server or a workstation and how many users must access
    the system. The general steps for securing the system and maintaining the security
    are as follows:


    +   - When installing Red Hat Linux, select only those package groups that you
    need for your system. Do not install any unnecessary software. For example, if
    your system is a workstation, you do not need to install most of the servers (Web
    server, news server, and so on).

    +   - Create initial user accounts and make sure that all passwords are strong
    ones that password-cracking programs can’t “guess”. As you’ll learn soon, Red
    Hat Linux includes the tools to enforce strong passwords.

    +   - Enable only those Internet services that you need on a system. In particular,
    do not enable services that are not properly configured. Later in this session,
    you learn about enabling and disabling Internet services.

    +   - Periodically check various log files for signs of any break-ins or attempted
    break-ins. These log files are in the `/var/log` directory of your system.

    +   - Check security news by regularly visiting and installing updates from Red
    Hat once a fix becomes available.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Securing passwords


    Historically, UNIX passwords are stored in the /etc/passwd file, which any user
    can read. For example, a typical old-style /etc/passwd file entry for the root
    user looks like this:


    ```

    root:t6Z7NWDK1K8sU:0:0:root:/root:/bin/bash

    ```


    The fields are separated by colons (:) and the second field contains the password
    in encrypted form. To check if a password is valid, the login program encrypts
    the plain-text password entered by the user and compares it with the contents
    of the /etc/passwd file. If there is a match, the user is allowed to log in.


    Password-cracking programs work just like the login program except that these
    programs pick one word at a time from a dictionary, encrypt the word, and compare
    the encrypted word with the encrypted passwords in the /etc/passwd file for a
    match. To crack the passwords, the intruder needs the /etc/passwd file. Often,
    crackers use weaknesses of various Internet servers (such as mail and FTP) to
    get a copy of the /etc/passwd file.


    Recently, several improvements have been made to make the UNIX passwords more
    secure. These include shadow passwords and pluggable authentication modules, described
    in the next two sections.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_355_0.png)


    Red Hat Linux includes password security enhancements that you can use by selecting
    them during installation. In Session 3, as you complete the Red Hat Linux installation,
    one step involves making selections in an Authentication Configuration screen.
    If you accept the default selections — Enable MD5 passwords and Enable shadow
    passwords — you automatically enable more secure passwords in Red Hat Linux.


    # Shadow Passwords


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_355_1.png)


    Instead of storing the passwords in the /etc/passwd file, which any user can read,
    passwords are now stored in a shadow password file. On Red Hat Linux, the shadow
    passwords are in the /etc/shadow file. Only the super user (root) can read this
    file. For example, here is the entry for root in the new-style /etc/passwd file:


    ```

    root:x:0:0:root:/root:/bin/bash

    ```


    As you can see, the second field contains an x instead of an encrypted password.
    The encrypted password is now stored in the /etc/shadow file where the entry for
    root is like this:


    ```

    root:$1$AAAn/iY$uESHbzUpy9Cgfoo1Bf0tS0:11077:0:99999:7:-1:-1:134540356

    ```'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'The format of the /etc/shadow entries with colon-separated fields resembles
    the entries in the /etc/passwd file, but the meanings of many fields differ. The
    first field is still the user name and the second one is the encrypted password.


    The remaining fields in each /etc/shadow entry control when the password expires.
    You do not need to interpret or change these entries in the /etc/shadow file.
    Instead, you should use the chage command to change the password expiration information.
    For starters, you can check a user''s password expiration information by using
    the chage command with the -l option as follows (in this case, you have to be
    logged in as root):


    ```

    chage -l root

    Minimum:          0

    Maximum:          99999

    Warning:          7

    Inactive:         -1

    Last Change:      Apr 30, 2000

    Password Expires: Never

    Password Inactive: Never

    Account Expires:  Never

    ```


    In this case, the output shows various expiration information: you can change
    the root password any time (that''s what zero minimum time means), it lasts for
    99999 days, and the root user gets a warning seven days before the password expires.


    If you want to ensure that the password changes every 90 days, you can use the
    -M option to set the maximum number of days the password stays valid. For example,
    to make sure that user naba is prompted to change the password in 90 days, I log
    in as root and type the following command:


    ```

    chage -M 90 naba

    ```


    You can do this for each user account to ensure that all passwords expire and
    all users must pick new passwords.


    # Pluggable Authentication Modules


    In addition to improving the password file''s security by using the shadow passwords,
    Red Hat Linux also improves the actual encryption of the passwords stored in the
    /etc/shadow file. Password encryption is now done using the MD5 message-digest
    algorithm to convert the plain-text password into a 128-bit fingerprint or digest.
    The MD5 algorithm, described in RFC1321'
  merge: -1
  img_proc: true
- pgno: 357
  md: '(http://www.faqs.org/rfcs/rfc1321.html), compresses a large file in a secure
    manner so that you can digitally sign it through encryption with a private key.
    It works quite well for password encryption as well.


    Another advantage of MD5 over the older-style password encryption is that the
    older passwords were limited to a maximum of eight characters in length; new passwords
    (encrypted with MD5) can be much longer. Longer passwords are harder to guess
    even if the /etc/shadow file falls into the wrong hands.


    A clue to the use of MD5 encryption in the /etc/shadow file is the increased length
    of the encrypted password and the $1$ prefix, as in the second field of the following
    sample entry:


    ```

    root:$1$AAAnI/yN$uESHbzUpy9Cgfoo1Bf0tS0:11077:0:99999:7:-1:-1:134540356

    ```


    A Pluggable Authentication Module (PAM) performs the actual MD5 encryption. PAM
    provides a flexible method for authenticating users on Linux systems.


    Through settings in configuration files, you can change the authentication method
    on the fly without having to actually modify programs such as login and passwd
    that verify a user''s identity.


    Red Hat Linux uses PAM extensively, and the configuration files are located in
    the /etc/pam.d directory of your system. Check out the contents of this directory
    on your system.


    # Securing Internet services


    For an Internet-connected Linux system (or even one on a TCP/IP LAN), a significant
    threat is the possibility that someone will use one of many Internet services
    to gain access to your system. Each service — such as mail, Web, or FTP — requires
    running a server program that responds to client requests arriving over the TCP/IP
    network. Some of these server programs have weaknesses that can allow an outsider
    to log into your system — maybe with root privileges. Luckily, Red Hat Linux comes
    with some facilities that you can use to make the Internet services more secure.


    Potential intruders can employ a port-scanning tool — a program that attempts
    to establish a TCP/IP connection at a port and look for a response — to check
    which Internet servers are running on your system. Then the intruder can potentially
    exploit any known weaknesses of one or more services to gain access to your system.


    # Linuxconf


    To avoid opening up unnecessary entry points into your system, make sure that
    you run only those Internet services that you need. You can enable and disable'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'the services using Linuxconf, the graphical system administration utility.
    Log in as root and select Main Menu → Programs → System → LinuxConf from the GNOME
    desktop. Then select → Control Panel → Control service activity from the tree
    menu on the Control tab. This shows you a list with the status of the current
    services.


    To control a service, you click the service’s name. For example, to control the
    Web server, click httpd. This causes Linuxconf to display the Service httpd tab
    through which you can control the Web server.


    If you do not want the Web server to automatically start at boot time, click the
    Automatic button to turn it off. To immediately stop the Web server, click the
    Stop button.


    # xinetd Server


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_358_0.png)


    In addition to the standalone servers such as Web server (httpd), mail (sendmail),
    and domain name server (named), you have to configure another server separately.
    That other server, xinetd (the Internet super server), starts a host of other
    Internet services such as FTP, TELNET, and so on. Here you briefly look at the
    security aspects of the xinetd server.


    The xinetd server reads a configuration file named /etc/xinetd.conf at startup.
    This file, in turn, refers to configuration files stored in the /etc/xinetd.d
    directory. The configuration files in /etc/xinetd.d tell xinetd which ports to
    listen to and which server to start for each port. You can browse through the
    files in /etc/xinetd.d directory on your system to find out the kinds of services
    that xinetd is set up to start. Some of these services provide information that
    intruders may use to break into your system. You should turn off these services
    by placing a disable = yes line in that service’s configuration file. To learn
    more about the xinetd configuration files, type man xinetd.conf at the shell prompt
    in a terminal window.


    Depending on what you need on your system, you may want to disable everything
    but the ftp and telnet services. After making any changes to the xinetd configuration
    files, you must restart the xinetd server by typing the following command:


    ```

    /etc/rc.d/init.d/xinetd restart

    Stopping xinetd: [  OK  ]

    Starting xinetd: [  OK  ]

    ```


    Another security feature of xinetd is its use of the TCP wrapper facility to start
    various services. The TCP wrapper provides an access control facility for Internet
    services. The TCP wrapper can start other services such as FTP and TELNET; but'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'before starting the service, it consults the /etc/hosts.allow file to see if
    the host requesting service is allowed that service. If nothing appears in /etc/hosts.allow
    about that host, TCP wrapper checks the /etc/hosts.deny file to see if it should
    deny the service. If both files are empty, TCP wrapper allows the host to access
    the requested service.


    You can place the line ALL:ALL in the /etc/hosts.deny file to deny all hosts access
    to any Internet services on your system. Then you can add to /etc/hosts.allow
    the names of those hosts that can access services on your system. For example,
    to allow only hosts from the 192.168.1.0 network to access services on your system,
    place the following line in the /etc/hosts.allow file:


    ```

    ALL: 192.168.1.0/255.255.255.0

    ```


    If you want to permit access to a specific Internet service to a specific remote
    host, you can do so using the following syntax for a line:


    ```

    server_program_name: hosts

    ```


    Here server_program_name is the name of the server program (for example, in.telnetd
    for TELNET and in.ftpd for FTP), and hosts is a comma-separated list of hosts
    allowed to access the service. hosts can also take the form of a network address
    or an entire domain name such as .mycompany.com. For example, here’s how you can
    allow TELNET access to all systems in the mycompany.com domain:


    ```

    in.telnetd: .mycompany.com

    ```


    # Monitoring System Security


    After you set up your system securely, you have to periodically monitor the log
    files for any signs of intrusion. You should also periodically check security
    news to learn about recently discovered weaknesses in any of your system components
    (such as mail server or Web server). If Red Hat provides an upgrade to fix a security
    problem, download the new RPM files and install them on your system.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_359_0.png)


    Follow the steps covered in Session 23 to download the new RPM files and install
    them.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# Log files


    Many Linux system applications, including some servers, write log information
    using the logging capabilities of syslogd. On Red Hat Linux systems, the log files
    written by syslogd reside in the /var/log directory. Make sure that only the root
    user can read and write these files.


    You should routinely monitor the following log files:


    +   - `/var/log/messages` contains a wide variety of logging messages from user
    logins to messages from services started by the TCP wrapper.

    +   - `/var/log/secure` contains reports from services such as in.telnetd and
    in.ftpd that the TCP wrapper starts.

    +   - `/var/log/maillog` contains reports from sendmail.

    +   - `/var/log/xferlog` contains a log of all FTP file transfers.


    Unfortunately, there is no easy-to-use tool for viewing these log files. The best
    approach is to browse them routinely. You can open the log file in the vi editor
    in read-only mode by typing a command such as vi -R /var/log/messages, which prevents
    you from accidentally overwriting the log file. In the editor, you can search
    for a date of interest and begin browsing from that point.


    Because many potential intruders use port-scanning tools that attempt to establish
    TCP/IP connections to well-known ports on your system, you should look for messages
    that indicate attempted connections from unknown hosts (indicated by names or
    IP addresses). For such attempted network accesses, you should browse through
    the /var/log/secure file. For example, here’s what a line in the /var/log/secure
    file shows when I connect to my Linux system from one of the PCs on the LAN:


    ```

    Aug 16 20:18:19 lnbp200 xinetd[511]: START: ftp pid=23824 from=192.168.1.40

    ```


    Notice the text pid=23824 that appears next to the word ftp. That’s the process
    ID of the FTP server program started by xinetd. You can use this number to look
    at corresponding messages in the /var/log/messages file to see whether this attempt
    did or did not succeed. Here is a sample of how I check this:


    ```

    grep "\[23824\]" messages

    Aug 16 20:30:01 lnbp200 ftpd[23824]: FTP LOGIN FROM lnbp400 [192.168.1.40], naba

    Aug 16 20:30:22 lnbp200 ftpd[23824]: FTP session closed

    ```


    The resulting output tells me that the user naba successfully logged in and sometime
    later closed the FTP session.'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'In a similar manner, you should analyze any suspicious messages you find in
    these log files. You may be surprised by the number of attempts curious outsiders
    make to gain access to your system.


    # Security news and updates


    To keep up with the latest security alerts, you may want to visit one or more
    of the following sites on a daily basis:


    +   - CERT Coordination Center at http://www.cert.org/

    +   - Computer Incident Advisory Capability (CIAC) at http://www.ciac.org/

    +   - National Infrastructure Protection Center at http://www.nipc.gov/


    If you have access to Internet newsgroups, you can periodically browse the following
    newsgroups:


    +   - comp.security.announce: a moderated newsgroup that includes announcements
    from CERT about security

    +   - comp.security.unix: includes discussions of UNIX security issues, including
    items related to Red Hat Linux


    If you prefer to receive regular security updates through e-mail, you can also
    sign up on, or subscribe to, various mailing lists:


    +   - redhat-watch-list@redhat.com: Send an e-mail message to redhat-watch-list-req@redhat.com
    with the word subscribe in the Subject line.

    +   - linux-security@redhat.com: Send an e-mail message to linux-security-sub@redhat.com
    with the word subscribe in the Subject line.

    +   - FOCUS-LINUX: Fill out the form in http://www.securityfocus.com/focus/linux/list/subscribe.html
    to subscribe to this mailing list focused on Linux security issues.

    +   - Cert Advisory mailing list: Send an e-mail message to cert-advisory-request@cert.org
    with SUBSCRIBE myname@myisp.com in the Subject line. (Replace myname@myisp.com
    with your e-mail address.)


    Finally, you should check Red Hat’s Web site at http://www.redhat.com/support/errata/
    for updates that may fix any known security problems with Red Hat Linux.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_361_0.png)'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# REVIEW


    This session introduced you to the subject of security for your Red Hat Linux
    system. You learned the importance of establishing a security policy for a medium
    to large organization. Next, the session showed you how to secure two key elements
    — the passwords and the network services — on your Linux system. Finally, I closed
    with a discussion of how to review log files for signs of intrusion attempts and
    how to keep up with any late-breaking security news. Because this session could
    not cover many security topics, I provided you with some additional online resources
    from which you can learn more about securing your Red Hat Linux system.


    # QUIZ YOURSELF


    +   1. Why should you set up a security policy? (See “Establishing a Security
    Policy”.)

    +   2. What are shadow passwords? (See “Shadow Passwords”.)

    +   3. What does MD5 refer to? (See “Pluggable Authentication Modules”.)

    +   4. Why should you secure Internet services? (See “Securing Internet Services”.)

    +   5. Which log files should you periodically review for signs of intrusion attempts?
    (See “Monitoring System Security”.)'
  merge: -1
  img_proc: true
