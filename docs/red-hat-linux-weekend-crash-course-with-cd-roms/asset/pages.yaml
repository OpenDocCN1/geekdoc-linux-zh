    # Navigating and Manipulating Files and Directories with Linux Commands


    Although the graphical file managers are easy to use, you can employ them only
    if you have a graphical login. Sometimes you may not have a graphical environment
    to run a graphical file manager. For example, you might be logged in through a
    text terminal or X might not work on your system. In these situations, you have
    to rely on Linux commands to work with files and directories. The nice part is
    that you can always use Linux commands — even in the graphical environment. All
    you have to do is open a terminal window and type the Linux commands. Click the
    terminal icon in the GNOME panel to start a terminal emulation program that displays
    a terminal window.


    # Directory navigation


    In Linux, your home directory is /root when you log in as root. For other users,
    the home directory is usually in the /home directory. My home directory (when
    I log in as naba) is /home/naba. This information is stored in the /etc/passwd
    file. By default, besides the super user, only you have permission to save files
    in your home directory and only you can create subdirectories in your home directory
    to further organize your files.


    Linux supports the concept of a current directory, which is the directory in which
    all file and directory commands operate. After you log in, for example, your current
    directory is the home directory. To see the current directory from the terminal
    window, type the pwd command.


    To change the current directory, use the cd command. To change the current directory
    to /usr/share/doc, type the following:


    ```

    cd /usr/share/doc

    ```


    Then, to change the directory to the bash-2.04 subdirectory in /usr/share/doc,
    type this command:


    ```

    cd bash-2.04

    ```'
