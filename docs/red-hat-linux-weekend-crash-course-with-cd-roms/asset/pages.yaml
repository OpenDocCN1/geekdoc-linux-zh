  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_84_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_84_1.png)


    # Test Driving Red Hat Linux for the First Time


    # Session Checklist


    +   - Starting Red Hat Linux for the first time

    +   - Exploring GNOME

    +   - Exploring KDE


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_84_2.png)


    Now that you have installed Red Hat Linux from this book’s companion CD-ROMs,
    you are ready to explore and learn it. In this session, you first learn how to
    log in, log out, and shut down your Linux system. Then you power up again and
    take a quick tour of the GNOME and KDE graphical user interfaces (GUIs — pronounced
    “gooe-ease”).


    # Starting Red Hat Linux for the First Time


    After the installation is complete, the Red Hat Linux installation program automatically
    reboots the system. The PC goes through its normal power-up sequence and loads
    LILO from the C: drive and a screen appears with the names of the partitions that
    LILO can boot. If you do nothing, LILO proceeds to boot from the partition that'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'was designated as the default when you configured LILO in Session 1. If you
    press Ctrl+X, the following prompt appears:


    ```

    LILO boot:

    ```


    When you install LILO, if you specify the Linux partition as the default, you
    can simply wait; after a few seconds, LILO boots Linux.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_85_0.png)


    If you want to boot from another partition (such as Windows), press the Tab key.
    LILO displays the names of the available bootable partitions. For example, a typical
    display might be:


    ```

    linux dos

    ```


    You can then type the name of the partition you want to boot or press Enter to
    boot from the first partition.


    After LILO boots Linux, you should see a long list of opening messages — including
    the names of the devices that Linux detects. At the end of all the messages, you
    see a graphical login screen like the one in Figure 5-1.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_85_1.png)


    Figure 5-1

    Graphical login screen in Red Hat Linux'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'The window in the middle of the screen displays a welcome message with your
    system’s host name — the name you assign to your system when you configure the
    network. If the network is not configured, localhost.localdomain is used as the
    host name.


    You can log in using any of the accounts, including root, which you define during
    the installation. For example, to log in as root, type root (move the mouse over
    the login window before you begin typing) in the text field and press Enter. Then
    type the root password (the one you set during installation) to log in as the
    super user.


    Because the default GUI is GNOME, the GNOME desktop appears along with a warning
    dialog box from the GNOME File Manager. Click the OK button to dismiss the warning
    dialog box. The GNOME Hints window appears and you get a desktop (as shown in
    Figure 5-2).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_86_0.png)


    Figure 5-2

    Initial GNOME desktop after logging in as root


    You will explore the GNOME desktop in a few minutes. For now, I want to show you
    how to log out and shut down your Linux system.'
