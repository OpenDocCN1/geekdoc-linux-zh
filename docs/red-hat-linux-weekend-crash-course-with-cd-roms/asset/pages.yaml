- pgno: 337
  md: 'The configure script starts running and prints lots of messages as it checks
    various features of your system, from the existence of the C compiler to various
    libraries that are needed to build XMMS. Finally, the configure script creates
    a Makefile that you can use to build the software.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_337_0.png)


    If the configure script displays error messages and fails, read the INSTALL and
    README files again to find any clues in solving the problem. You may be able to
    circumvent the problem by providing some information through command-line arguments
    to the configure script.


    After the configure script finishes, build the software by typing the following
    command:


    ```

    make

    ```


    This command runs the GNU make utility (which takes 10 to 15 minutes to complete)
    that reads the Makefile and starts compiling the source files according to information
    specified in the Makefile. The make command goes through the source directories,
    compiles the source files, and creates the executable files and libraries needed
    to run XMMS. You see a lot of messages scroll by as each file is compiled. These
    messages show the command used to compile and link the files.


    # Installing the software


    After the make command finishes, you can install the XMMS software with the following
    command:


    ```

    make install

    ```


    This command also runs GNU make, but the install argument instructs GNU make to
    perform a specific set of commands from the Makefile. These instructions essentially
    search the subdirectories and copy various files to their final locations. For
    example, the binary executable files xmms, gnomexmms, wmxmms, and xmms-config
    are copied to the /usr/bin directory.


    # Running the software


    Now that you have installed XMMS, try running it by typing xmms in a terminal
    window from the GNOME or KDE desktop. From the XMMS window, you can open an MP3
    file and try playing it. Note that your PC must have a sound card and you'
  merge: -1
  img_proc: true
