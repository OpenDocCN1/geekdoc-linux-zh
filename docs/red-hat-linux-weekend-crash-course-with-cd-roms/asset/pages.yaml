- pgno: 28
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_28_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_28_1.png)


    # Getting Ready to Install

    Red Hat Linux


    # Session Checklist


    +   - ✓ Taking stock of your PC''s components

    +   - ✓ Creating a Red Hat boot disk


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_28_2.png)


    30 Min.

    To Go


    After installing Red Hat Linux on a PC, the best way to learn it is interactively,
    using the Linux commands and applications. To that end, this evening''s sessions
    guide you through the steps needed to install Red Hat Linux from this book''s
    companion CD-ROMs. Assuming that the installation program recognizes most of the
    hardware installed in your PC, you should finish the installation in an hour or
    so. By the time you get to the third session of this evening, you should have
    Red Hat Linux installed on your PC. In this session, I guide you through the basic
    steps of gathering information about your PC''s hardware and preparing the Red
    Hat boot disk needed to start the installation in Session 2.


    # Taking Stock of Your PC''s Components


    You have to gather information about your PC''s hardware before you install Red
    Hat Linux. Like many other operating systems, Linux supports various types of
    hardware through software components called device drivers. For each type of peripheral'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'device, such as a networking card or a sound card, Linux needs a separate driver.
    Because Linux is available free (or relatively inexpensively), and because many
    programmers scattered throughout the world cooperate to develop Linux, you cannot
    demand support for a specific kind of hardware. Your best bet is to hope that
    someone who can write a Linux driver has the same hardware that you do. In all
    likelihood, that person will write a driver that eventually will find its way
    into a version of Linux; then you can use that hardware under Linux. It may take
    a while for Linux to support new interfaces.


    You can install and run Red Hat Linux even if no Linux drivers are available for
    certain peripherals. At minimum, however, you must have a Linux-compatible processor,
    bus type, hard disk, video card, monitor, keyboard, mouse, and CD-ROM drive to
    install Red Hat Linux from the companion CD-ROMs. If you want to run the X Window
    System and graphical desktops such as GNOME or KDE, you also must ensure that
    XFree86 (the X Window System for Linux) supports the mouse, the video card, and
    the monitor.


    # Checking if Red Hat Linux supports your PC hardware


    To check if Red Hat Linux supports the hardware in your PC, perform the following
    steps:


    +   1. Gather the make, model, and other technical details of all hardware installed
    in your PC. This is your hardware inventory. You can consult the PC’s manuals
    (if you have them). You can also use the current operating system to find information
    about the hardware. For example, under Windows 95/98, double-click the System
    icon in the Control Panel to gather some of this information. (Click the Device
    Manager tab in the System Properties window to view information about specific
    devices in your system.)

    +   2. With your hardware inventory in hand, visit Red Hat’s Web site at http://www.redhat.com/hardware.
    This Web site contains a list of hardware that the latest version of Red Hat Linux
    supports. Check your PC’s hardware against that list and make sure that Red Hat
    Linux supports the key hardware components.


    # Exploring PC hardware


    The following sections provide an overview of the PC hardware that Red Hat Linux
    supports. You should gather as much information as you can about the hardware
    before you proceed to install Red Hat Linux on your PC.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Processor


    The processor is the central processing unit (CPU) — the integrated circuit chip
    that performs all the processing in the PC. At minimum, you need an Intel 80386
    processor to run Red Hat Linux. Any Intel 80386-, 80486-, Celeron-, or Pentium-compatible
    processor can run the Linux operating system. Among the compatibles, Red Hat Linux
    can run on AMD K5, K6, and Cyrix processors. Red Hat Linux also supports motherboards
    with multiple processors with the symmetric multiprocessing (SMP) Linux kernel.


    # Bus


    The bus is the standard electrical connection between the processor and its peripherals.
    Several types of PC buses exist. The most popular bus is the Industry Standard
    Architecture (ISA) bus, formerly called the AT bus because IBM introduced it in
    the IBM PC-AT computer in 1984. Other buses include Extended Industry Standard
    Architecture (EISA); VESA local bus (VL-bus); Micro Channel Architecture (MCA);
    and, most recently, Peripheral Component Interconnect (PCI). Currently, Red Hat
    Linux supports all common PC buses.


    # Memory


    Commonly referred to as random-access memory or RAM, memory is not a factor in
    compatibility. You do, however, need at least 32MB of RAM to get good performance.
    Although you may be able to install and run Red Hat Linux on a PC that has 16MB
    RAM, you cannot run the X Window System on that PC. The X Window System manages
    the graphical interface through an X server, which is a large program that needs
    a lot of memory to run efficiently.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_30_0.png)


    If you are buying a new PC, it probably will come with at least 32MB of RAM —
    if not 64MB or more. If you have an old PC with less than 8MB of RAM, you may
    want to add some more memory to bring up the total to (at least) 16MB. The more
    physical memory a system has, the more efficiently it runs multiple programs because
    the programs can all fit in memory. Although Red Hat Linux can use a part of the
    hard disk as virtual memory, such disk-based memory is much slower than physical
    memory. The required amount of physical memory depends on the size of the Linux
    operating system and the other software that you have to run all the time, such
    as the X Window System.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Video Card and Monitor


    Red Hat Linux works fine with all video cards in text mode. But when it comes
    to XFree86 — the Linux version of the X Window System — the story is quite different.
    If XFree86 does not support your video card explicitly, you may have to work hard
    to get XFree86 configured for your video card.


    The kind of monitor that you use is not particularly critical, but it must be
    capable of displaying the screen resolutions that the video card uses. These resolutions
    are expressed in terms of the number of picture elements, or pixels, horizontally
    and vertically (such as 1024×768).


    Generally, XFree86’s support for a video card depends on the video chipset — the
    integrated circuit that controls the monitor and causes the monitor to display
    output. You can find out the name of the video chipset used in a video card from
    the card’s documentation.


    Do not be alarmed if you do not see your video card’s name in the list that appears
    at http://www.redhat.com/support/hardware/. Most popular video cards use one of
    the video chipsets listed at Red Hat’s site. In fact, the same chipset can function
    in many different video cards. For example, the NVidia RIVA TNT chipset is used
    in many video cards including Diamond Viper V550, Hercules TNT, STB Velocity 4400,
    and ELSA ERAZOR II. As you install Red Hat Linux, the Red Hat Linux installation
    program automatically detects the video chipset as it sets up the X Window System.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_31_0.png)


    # Hard Drive


    Red Hat Linux supports any hard drive that your PC''s basic input/output System
    (BIOS) supports. In many older 386 and 486 PCs, you have to use a separate driver
    to access large hard drives — the system BIOS cannot handle these drives. You
    can’t install Linux on such systems. In short, Red Hat Linux supports your hard
    drive only if the system BIOS supports the hard drive without any additional drivers
    — with one significant restriction.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_31_1.png)


    To be able to boot Red Hat Linux from a large hard drive (any drive with more
    than 1,024 cylinders), the Linux Loader (LILO), the Linux kernel, and the LILO
    configuration files must be located in the first 1,024 cylinders of the drive.
    This is because the Linux Loader uses BIOS to load the kernel and the BIOS cannot
    access cylinders beyond the first 1,024.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'For hard drives connected to your PC through a SCSI (Small Computer System
    Interface) controller card, Red Hat Linux must have a driver that enables the
    SCSI controller to access and use the hard drive.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_32_0.png)


    The only remaining decision about the hard drive is its capacity. If you have
    an old PC, you may have a relatively low-capacity hard drive — perhaps as low
    as 500MB. Although you can install Red Hat Linux and the X Window System within
    500MB, doing so does not leave much room for Windows 95/98/2000. (You need at
    least 2GB of disk space to run both Linux and Windows 95/98/2000.) Therefore,
    if your old PC has an IDE interface and one small hard disk (500MB or less), you
    may want to add a second hard drive because most IDE controllers can support two.
    Adding a second hard drive prevents you from messing up your first hard drive.
    If you have a SCSI card, you can connect up to seven SCSI devices to it.


    If you are buying a new PC, keep in mind that a complete Red Hat Linux installation
    (with all the Red Hat packages) takes over 1GB of disk space. On top of that,
    you need some disk space for your work. Luckily, most new PCs come with hard drive
    sizes ranging anywhere from 2GB to 20GB. Any hard drives within this range is
    large enough, so you can keep Windows on one of the partitions and then opt to
    boot either Windows or Red Hat Linux.


    # Floppy Disk Drive


    As they do for the hard drive, Linux drivers use the PC BIOS to access the floppy
    disk drive. Therefore, your floppy disk drive is compatible with Red Hat Linux.
    You do, however, have to boot Red Hat Linux from a floppy disk drive during the
    installation. For this purpose, you need a high-density 3.5” (1.44MB-capacity)
    floppy disk drive. You can avoid booting from a floppy provided that you can boot
    your PC under MS-DOS (not an MS-DOS window under Windows 95/98/2000) and you can
    access the CD-ROM from the DOS command prompt.


    # Keyboard and Mouse


    Red Hat Linux supports any keyboard that already works with your PC. The mouse,
    however, needs explicit support in Red Hat Linux. You need a mouse if you want
    to configure and run XFree86, the X Window System for Linux. Red Hat Linux supports
    most popular mice, including the commonly found PS/2-style mouse.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Red Hat Linux also supports touchpad devices, such as Alps Glidepoint, as long
    as they are compatible with one of the supported mice.


    # SCSI Controller


    The Small Computer System Interface, commonly called SCSI (and pronounced scuzzy),
    is a standard way of connecting many types of peripheral devices to a computer.
    SCSI is used in many kinds of computers, from high-end UNIX workstations to PCs.
    Typically, you connect hard drives and CD-ROM drives through a SCSI controller.
    To use a SCSI device on your PC, you need a SCSI controller card that plugs into
    one of the connector slots on your PC''s bus.


    A single SCSI controller supports device addresses 0 through 7 with 7 usually
    assigned to the controller itself. This means that you can connect up to seven
    SCSI devices to your PC. If you want to access and use a SCSI device under Linux,
    you have to make sure that Red Hat Linux supports your SCSI controller card. The
    Red Hat Linux release on the companion CD-ROMs supports many popular SCSI controllers.


    # CD-ROM Drive


    CD-ROM (compact disc read-only memory) drives are popular because each CD-ROM
    can hold up to 650MB of data. This is a relatively large amount of storage compared
    with a floppy disk. CD-ROMs are reliable and inexpensive to manufacture. Vendors
    can use a CD-ROM to distribute a large amount of information at a reasonable cost.
    This book provides Red Hat Linux on CD-ROMs, so you need a CD-ROM drive to install
    the software.


    # Sound Card


    With Red Hat Linux, you also can play sound on a sound card to enjoy multimedia
    programs and games. If you have a sound card, you can play audio CDs.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_33_0.png)


    The version of Red Hat Linux on the companion CD-ROMs supports a wide variety
    of sound cards. Check your sound card against the list posted at Red Hat''s Web
    site (http://www.redhat.com/support/hardware/).


    # Network Card


    A network card is necessary only if you connect your Linux PC to a — local area
    network (LAN), which is usually an Ethernet network. Red Hat Linux supports a'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'variety of Ethernet network cards. Arcnet and IBM’s token-ring network are
    also supported. You can determine the name of the network card from the System
    Properties window in the Windows 95/98 Control Panel.


    If you have a network card and your Linux PC is part of a local area network,
    you should also gather the following information needed to configure the network:


    +   - The PC’s host name

    +   - Domain name of the network

    +   - Internet Protocol (IP) address of the PC (or, if the IP address is provided
    by a DHCP server, the server’s address)

    +   - Gateway address

    +   - IP address of name servers


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_34_0.png)


    If you plan to use Linux on a standalone PC at home, you can use Point-to-Point
    Protocol (PPP) to connect to the Internet over a dial-up connection through an
    Internet Service Provider (ISP).


    # Creating the Red Hat Boot Disk


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_34_1.png)


    To boot Red Hat Linux for the first time and start the Red Hat Linux installation
    program, you need a Red Hat boot disk. For this step, you should turn on your
    PC without any disk in the A: drive and then run Windows as usual.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_34_2.png)


    You do not need a boot disk if you can start your PC under MS-DOS — not an MS-DOS
    window in Windows 95 — and access the CD-ROM from the DOS command prompt. If you
    run Windows 95/98, restart the PC in MS-DOS mode. However, you may not be able
    to access the CD-ROM in MS-DOS mode because the startup files — AUTOEXEC.BAT and
    CONFIG.SYS — may not be configured correctly. To access the CD-ROM from DOS, you
    typically must add a CD-ROM driver in CONFIG.SYS and add a line in AUTOEXEC.BAT
    that runs the MSCDEX program. Try restarting your PC in MS-DOS mode and see if
    the CD-ROM can be accessed. If you succeed, then skip this section and proceed
    to Session 2.


    Like the MS-DOS boot disk, the Red Hat boot disk starts your PC and the Red Hat
    Linux installation program. Once you install Red Hat Linux, you no longer need
    the Red Hat boot disk (except when you want to reinstall Red Hat Linux from the
    CD-ROMs).'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'The Red Hat boot disk contains an initial version of Red Hat Linux that you
    use to start Red Hat Linux, prepare the hard disk, and load the rest of Red Hat
    Linux. Creating the Red Hat boot disk involves using a utility program called
    RAWRITE.EXE to copy a special file called the Red Hat Linux boot image to a disk.
    To create the Red Hat boot disk under Windows, follow these steps:


    +   1. Open an MS-DOS window (select Start → Programs → MS-DOS Prompt).

    +   2. In the MS-DOS window, enter the following commands at the MS-DOS prompt.
    (My comments are in parentheses and your input is in boldface):

    +   3. As instructed, you should put a formatted disk into your PC''s A: drive
    and then press Enter. RAWRITE.EXE copies the boot-image file to the disk.


    ```

    d:  (use the drive letter for the CD-ROM drive)

    cd \dosutils

    rawrite

    Enter disk image source file name: \images\boot.img

    Enter target diskette drive: a

    Please insert a formatted diskette into drive A: and press -

    ENTER- :

    ```


    After you see the DOS prompt again, you can take the Red Hat boot disk out of
    the A: drive and (if you haven''t done so already) label it appropriately.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_35_0.png)


    # REVIEW


    This session started with an overview of the Red Hat Linux installation process.
    Then you learned about the hardware installed on your PC and how Red Hat Linux
    needs to support this hardware. Finally, you prepared a boot disk needed for when
    you want to start the Red Hat Linux installation.


    # QUIZ YOURSELF


    +   1. Why do you have to gather information about your PC''s hardware before
    installing Red Hat Linux? (See “Taking Stock of Your PC''s Components”.)

    +   2. Where can you find a list of hardware that Red Hat Linux supports? (See
    “Taking Stock of Your PC''s Components”.)'
