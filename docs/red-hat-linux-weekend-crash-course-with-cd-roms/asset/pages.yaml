- pgno: 104
  md: '# Directory manipulation


    To organize files in your home directory, you have to create new directories.
    Use the mkdir command to create a directory. For example, to create a directory
    named images in the current directory, type the following:


    ```

    mkdir images

    ```


    After you create the directory, you can use the cd images command to change to
    that directory.


    When you no longer need a directory, use the rmdir command to delete it. You can
    delete a directory only when the directory is empty.


    # File and directory finder


    Finally, I want to introduce you to the find command because it’s very useful
    for locating files (and directories) that meet specified search criteria. The
    Linux version of the find command comes from GNU, and it has more extensive options
    than the standard UNIX version. I show the syntax for the standard UNIX find command,
    however, because that syntax works in Linux and you can use the same format on
    other UNIX systems.


    Suppose that you want to find any file or directory with a name that starts with
    gnome. You can use find to perform this search, as follows:


    ```

    find / -name "gnome*" -print

    ```


    This command tells find to start at the root directory (/), look for filenames
    that match gnome*, and display the full pathname of any matching file.


    You can use variations of this simple form of find to locate a file in any directory
    (as well as subdirectories contained in the directory). If you forget where in
    your home directory you stored all files named report* (names that start with
    the string report), you can search for the files using the following command:


    ```

    find ~ -name "report*" -print

    ```


    When you become comfortable with this syntax of find, you can use other options
    of find. For example, to find only specific types of files (such as directories),
    use the -type option. The following command displays all top-level directory names
    in your Linux system:


    ```

    find / -type d -maxdepth 1 -print

    ```'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_105_0.png)


