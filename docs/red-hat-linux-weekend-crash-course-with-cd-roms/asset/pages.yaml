    # Understanding the Shell


    # Session Checklist


    +   - ✓ Getting started with the Bash shell

    +   - ✓ Using the Bash shell


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_106_2.png)


    As discussed in Session 6, unfortunately you can’t do everything from a graphical
    environment such as GNOME or KDE. In such cases, you have to use Linux commands
    to accomplish specific tasks. Session 6 introduced you to some of the Linux commands
    that you can use from a text terminal to manipulate files and directories. This
    session introduces you to the Bash shell — the default command interpreter in
    Linux. Here you learn some important features of how the shell executes commands.


    # Getting Started with the Bash Shell


    If you have used MS-DOS, you may be familiar with the DOS command interpreter.
    That program (named COMMAND.COM) displays the infamous C:\> prompt. (In Windows,
    you can see this prompt in an MS-DOS command window.) Linux provides a command
    interpreter that resembles the DOS command interpreter, but, as you'
