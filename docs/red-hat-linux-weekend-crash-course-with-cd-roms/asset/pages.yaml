    ```

    news://news.myisp.net/comp.os.linux.setup

    ```


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_373_0.png)


    You can also use the Deja.com Power Search page at http://www.dejanews.com/home_ps.shtml
    to search for specific items in the comp.os.linux newsgroups.


    # FTP archive sites


    You can download Red Hat Linux and other Linux distributions from one of several
    FTP sites around the world. In addition to the Linux distribution itself, these
    sites also contain many other software packages that run under Linux.


    For the latest list of Red Hat Linux FTP sites worldwide, visit the following
    Web page maintained by Red Hat:


    ```

    http://www.redhat.com/mirrors.html

    ```


    This page displays a table of URLs of sites that maintain the Red Hat distribution
    for downloading. In that table, the Updates column lists the URLs for downloading
    specific Red Hat Package Manager (RPM) files for the latest Red Hat Linux version
    (for Intel-based PCs).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_373_1.png)


    Red Hat provides many of the fixes and improvements — these updates are in the
    form of Red Hat Packages distributed from Red Hat’s FTP server. (Try ftp://ftp.redhat.com/pub/redhat/updates/;
    if it’s busy, consult http://www.redhat.com/mirrors.html for a mirror site near
    you.) To install these packages, you have to use the Red Hat Package Manager (RPM).


    # Magazines


    Linux Journal is a monthly magazine devoted entirely to Linux. On the Web, the
    magazine home page is at http://www.linuxjournal.com/. There you can find information
    on how to subscribe to this magazine.'
  merge: -1
  img_proc: true
