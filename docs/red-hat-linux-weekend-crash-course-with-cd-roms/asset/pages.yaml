- pgno: 124
  md: 'This causes wc to display the number of lines (57), words (244), and characters
    (1756) in the /etc/inittab file. If you simply want to see the number of lines
    in a file, use the -l option like this:


    ```

    wc -l /etc/inittab

    57 /etc/inittab

    ```


    In this case, wc simply displays the line count. If you don''t specify a filename,
    the wc command expects input from the standard input. You can use the pipe feature
    of the shell to feed the output of another command to wc. This is handy sometimes.
    Suppose you want a rough count of the processes running on your system. You can
    get a list of all processes with the ps ax command; but instead of manually counting
    the lines, just pipe the output of ps to wc to get a rough count as follows:


    ```

    ps ax | wc -l

    61

    ```


    This means the ps command produces 61 lines of output. Because the first line
    simply shows the headings for the tabular columns, you can estimate that there
    are about 60 processes running on your system. (Of course, this count probably
    includes the processes used to run the ps and wc commands as well, but who''s
    counting?)


    # Sorting text files


    You can sort the lines in a text file using the sort command. To see how the sort
    command works, first type more /etc/passwd to see the current contents of the
    /etc/passwd file. Now type sort /etc/passwd to see the lines sorted alphabetically.
    If you want to sort a file and save the sorted version in another file, you have
    to use the Bash shell''s output redirection feature like this:


    ```

    sort /etc/passwd > ~/sorted.text

    ```


    This command sorts the lines in the /etc/passwd file and saves the output in a
    file named sorted.text in your home directory.


    # Splitting any file into several smaller files


    The split command is handy for those times when you want to copy a file to a floppy
    disk, but the file is too large to fit on a single floppy. You can then use the'
  merge: -1
