    publicly accessible files in the /var/ftp/pub directory.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_194_0.png)


    # REVIEW


    This session introduced you to Internet services. You learned how to use the mail
    server (sendmail) to exchange e-mail with other systems on the Internet. You also
    examined the setup of the Apache Web server, as well as where to place the HTML
    documents and where to look for the log files. Finally, you explored how anonymous
    FTP is set up on your Red Hat Linux system.


    # QUIZ YOURSELF


    +   1. Which configuration file stores the association between Internet services
    and port numbers? (See “Understanding Internet Services”.)

    +   2. What is a mail-transfer agent? (See “Using the E-mail Server”.)

    +   3. From which directory does the Apache Web server serve the Web pages (HTML
    files)? (See “Setting Up the Apache Web Server”.)

    +   4. Where are the Web server’s configuration files stored? (See “Setting Up
    the Apache Web Server”.)

    +   5. In which directory should you place the files that you want others to download
    using anonymous FTP? (See “Setting Up the FTP Server”.)'
