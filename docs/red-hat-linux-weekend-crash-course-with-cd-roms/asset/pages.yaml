- pgno: 232
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_232_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_232_1.png)


    # Working with Screen Savers and Playing Games


    # Session Checklist


    +   - ✓ Activating screen savers

    +   - ✓ Playing games in GNOME

    +   - ✓ Playing games in KDE


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_232_2.png)


    Now that you know how to customize the GNOME and KDE graphical desktops and switch
    from one to the other, you can turn to some fun. Both GNOME and KDE desktops in
    Red Hat Linux come with quite a few games and screen savers. In this session,
    you learn how to set up and activate the screen savers and explore some games.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_232_3.png)


    You should have the games installed on your system. This is assuming you selected
    the Games package group when you installed Red Hat Linux from this book’s companion
    CD-ROMs in Session 3.


    # Activating Screen Savers


    By default, your Red Hat Linux system uses a randomly selected screen saver. Whenever
    you do nothing for some time (usually 20 minutes), the screen saver'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'comes on. The screen saver can also act as a screen-locking program — which
    means you must type your password to get back to the graphical desktop.


    # Setting up a screen saver in GNOME


    To select and try out a screen saver from the GNOME desktop, start the GNOME Control
    Center by clicking the toolbox icon on the GNOME panel. Then select Desktop ↩
    Screen saver from the tree menu in the Control Center. A dialog box appears in
    the Control Center''s workspace from which you can select a screen saver. The
    miniscreen on the upper-right corner of the dialog box shows how the selected
    screen saver looks, as shown in Figure 18-1.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_233_0.png)


    Figure 18-1

    Selecting and previewing a screen saver in the GNOME Control Center


    From the dialog box of Figure 18-1 you can also select several other screen saver
    settings. For example, you can set the number of minutes of inactivity after which
    the screen saver comes on. If you click the Require Password checkbox and enable
    it, then the screen saver locks the screen and forces you to enter your password
    before you can return to the desktop.


    The scrollbar labeled Priority enables you to specify the priority of the screen
    saver program. You should leave it at the default setting (which is midway'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'between Low and Normal) or make it low; this ensures that other processes have
    higher priority. After all, just because there is no mouse or keyboard activity
    it does not mean that your Linux system is idle. You may be compiling a huge program
    when the screen saver activates. In that case, you don’t want the screen saver
    to use up too much of the processor’s time.


    The checkbox labeled Use power management applies if your PC supports power management
    features. If you check this checkbox, the screen saver puts the system and monitor
    in a “sleep” mode that draws less power than normal operation.


    # Setting up a screen saver in KDE


    If you use the KDE desktop, you can select and test screen savers from the KDE
    Control Center. Start it by clicking the monitor and circuit board icon on the
    KDE panel or select K ⇔ KDE Control Center. Then select Desktop ⇔ Screensaver
    from the tree menu in the KDE Control Center. The Screensaver tab appears in the
    Control Center’s workspace from which you can select and preview screen savers
    (as shown in Figure 18-2).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_234_0.png)


    Figure 18-2

    Selecting and previewing a screen saver in the KDE Control Center'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Each screen saver also has its own setup. To set up the selected screen saver,
    click the Setup button in the KDE Control Center’s Screensaver tab. This brings
    up that screen saver’s setup dialog box, from which you can set up that screen
    saver’s configurable parameters.


    You can also easily test a screen saver from the KDE Control Panel’s Screensaver
    tab. Simply click the Test button that appears under the list of screen savers.
    This causes the screen saver to activate full screen. You can return to the desktop
    by pressing a key or moving (or clicking) the mouse. The Test button makes it
    really easy to test the KDE screen savers.


    The KDE Control Center’s Screensaver tab also enables you to set other parameters
    that control the screen saver. Specifically, you can set the number of minutes
    of inactivity after which the screen saver should start in the Wait for box. You
    can also click the checkbox labeled Require password to make the screen saver
    require a password before returning to the desktop. Additionally, you can set
    the priority of the screen saver process.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_235_0.png)


    # Playing Games in GNOME


    Next, try some games that come with Red Hat Linux. You can access these games
    from the GNOME or KDE desktops. First start with the GNOME games.


    Select Main Menu (Foot) Programs Games to view the menu of available games. Figure
    18-3 shows a typical game menu in GNOME. As you can see, the GNOME desktop’s game
    menu offers over twenty games.


    In addition to these games, you can also play all the KDE games from the GNOME
    desktop. Simply select Main Menu (Foot) KDE menus Games to view the KDE game menu.
    The rest of this section describes some of the popular GNOME games.


    # Card games


    If you like card games like FreeCell or Solitaire, you’ll like the AisleRiot game.
    AisleRiot is a card program that can play 30 different card games including such
    well-known ones as FreeCell and Klondike.


    To start AisleRiot, select Main Menu (Foot) Programs Games AisleRiot. The default
    game is Klondike, which is what you get when you start AisleRiot.


    If you want to play a different card game in AisleRiot, select Game New game of
    from the menu. This causes AisleRiot to display a long list of card games.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_236_0.png)


    # Figure 18-3


    The game menu in GNOME


    Now you can choose another card game from this list. If you need help, select
    Help → AisleRiot. This brings up the AisleRiot help in the GNOME Help browser.


    GNOME also comes with a standalone FreeCell card game. You can play that game
    by selecting Main Menu → Programs → Games → FreeCell. After the main window appears,
    click the New button on the toolbar to start a new game. Now you can play the
    game.


    # Gnome-Stones


    Gnome-Stones is a game in which you run around a cave collecting diamonds and
    avoid being crushed by rocks. Select Main Menu → Programs → Games → Gnome-Stones
    to start the game. You can select Settings → Preferences to choose the type of
    cave you want to explore. Then select Game → New game to start a game. Use the
    arrow keys to move the little person around and collect the diamonds.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# GNOME Mahjongg


    Select Main Menu ↩ Programs ↩ Games ↩ Mahjongg to start the GNOME Mahjongg game.
    In this version of Mahjongg, your goal is to find and click matching pairs of
    tiles, which are then removed from the game board.


    If you have trouble locating matching tiles, click the Hint button on the toolbar.
    The game program then flashes two matching tiles for a short time. You can then
    click those tiles one after another. Of course, the point of the game is for you
    to figure out which tiles to remove, so you should use the Hint button sparingly.


    # Chess game


    Select Main Menu ↩ Programs ↩ Games ↩ Chess to start a game of chess. By default,
    the computer plays black and you play white. You get the first move. To make your
    move, click and drag a white piece to its new position. The chess program checks
    and stops you from making any illegal moves.


    Once you move, the computer responds with its move. Initially, the computer responds
    promptly, but the moves take longer as the game progresses. A timer counts down
    the time for whoever has the current turn.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_237_0.png)


    # Playing Games in KDE


    To try out the games available on the KDE desktop, log in after selecting KDE
    as the current desktop. (Remember to select Session ↩ KDE from the login window.)
    From the KDE desktop, select K ↩ Games to view the menu of available games.


    Figure 18-4 shows a typical menu of games in KDE.


    As the menu shows, KDE includes more than a dozen games in its game menu. You
    can try any of these games by selecting one from this menu.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_237_1.png)


    KDE includes its own version of Mahjongg, which is similar to the GNOME version
    of Mahjongg introduced earlier in this session.


    Now that you know where to find and how to start the games, you can try them out
    at your leisure. In the remainder of this session, you can play a few KDE games.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_238_0.png)


    Figure 18-4


    The game menu in KDE


    # Minesweeper


    Minesweeper is a popular game that you may have played on your PC (because it
    comes with Microsoft Windows). In Minesweeper, your goal is to locate all the
    mines in a minefield represented by squares arranged in a grid. You are supposed
    to uncover all the squares that do not contain mines and mark the squares that
    contain mines.


    To run the KDE version of Minesweeper, select K Games Minesweeper. To play, click
    squares to clear them. When you uncover a square that does not have any adjacent
    mines, Minesweeper clears out all other neighboring squares that also do not touch
    any squares with mines. The number on an uncovered square tells you how many mines
    are located in the adjacent squares. To mark a square that you suspect has a mine,
    click the right mouse button on that square. When you mark a square by right-clicking,
    a red flag appears on that square.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_239_0.png)


    The game menu in GNOME also includes a Minesweeper game — it’s called Gnome Mines.


    # Patience


    Patience is another Solitaire card game, similar to GNOME’s AisleRiot. In Patience,
    you can play several card games including Klondike and FreeCell. To run Patience,
    select K ⇨ Games ⇨ Patience. By default, Patience starts a Klondike card game.
    To play another card game, select Game ⇨ Choose new game and pick a game from
    the resulting menu.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_239_1.png)


    # Shisen-Sho


    Shisen-Sho is a Mahjongg-like game. To start a game, select K ⇨ Games ⇨ Shisen-Sho.
    To play the game, select matching tiles that can be connected by horizontal or
    vertical lines without crossing over any other tile.


    # REVIEW


    In this session, you learned how to select, configure, and preview screen savers
    in both GNOME and KDE desktops. Then you explored some games in the GNOME desktop.
    Finally, you spent some time trying out a few games in KDE.


    # QUIZ YOURSELF


    +   1. How do you select and try out a screen saver in GNOME? (See “Setting up
    a Screen Saver in GNOME”.)

    +   2. How do you configure a screen saver in KDE? (See “Setting up a Screen Saver
    in KDE”.)

    +   3. How can you make sure that a GNOME screen saver “locks the screen?” (See
    “Setting up a Screen Saver in GNOME”.)

    +   4. How do you access and start the games available in GNOME? (See “Playing
    Games in GNOME”.)

    +   5. What games are available in KDE and how do you start them? (See “Playing
    Games in KDE”.)'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_240_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_240_1.png)


    # Working with Multimedia Applications


    # Session Checklist


    +   - ✓ Configuring the sound card

    +   - ✓ Playing audio CDs

    +   - ✓ Working with graphics and images


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_240_2.png)


    Red Hat Linux comes with quite a few multimedia applications that enable you to
    play audio CDs and manipulate graphics and images. In this session, you try out
    several multimedia applications and learn how to work with graphics and images.
    You start the session by configuring your PC’s sound card in Red Hat Linux because
    you need a working sound card to listen to audio CDs.


    # Configuring the Sound Card


    Your PC must have a sound card and speakers to play audio CDs. I assume that your
    PC has a sound card and you have the speakers hooked up according to the instructions
    from the PC’s manufacturer.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Red Hat Linux needs a sound driver to access and control the sound card. The
    sound drivers are provided as modules that you can load after booting Red Hat
    Linux. You can configure the sound card by running the `/usr/sbin/sndconfig` utility.
    This is a text-mode configuration program, so you should run it from a text console
    using the following procedure:


    +   1. From the graphics screen, press Ctrl+Alt+F1. This brings you to a text-mode
    virtual terminal that displays a login prompt. Log in as root.

    +   2. Type `/usr/sbin/sndconfig`. A message informs you that the utility will
    probe for sound cards. Press Enter to continue with the probing.

    +   3. The utility displays the result of probing for sound cards. Press Enter
    to continue with the configuration.

    +   4. The utility then displays one or more dialog boxes that indicate existing
    configuration files will be replaced. Press Enter to continue with each step.

    +   5. A dialog box informs you that sndconfig will play a sound sample. Press
    Enter.

    +   6. If all goes well, you should hear the sound. A dialog box asks you if you
    hear the sound. If you hear the sound, press Enter to select Yes. Otherwise, press
    Tab to select No and then press Enter.

    +   7. If you select No, sndconfig shows a dialog box from which you can manually
    select the interrupt request number (IRQ), I/O port addresses, and direct memory
    access (DMA) channels.

    +   8. The utility then plays a *MIDI Musical Instrument Digital Interface* sound
    sample. You should now hear the MIDI sound sample. You can go through and confirm
    this part as well.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_241_0.png)


    **You can play audio CDs and other sound files even if you cannot hear the MIDI
    sample play.**


    +   9. After you exit out of sndconfig, type **exit** to log out. Then press Ctrl+Alt+F7
    to return to the graphical user interface.


    Once you configure the sound card for Red Hat Linux, you can play audio CDs and
    other sound files in Red Hat Linux.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Playing Audio CDs


    You need a special application to play audio CDs in Red Hat Linux. Red Hat Linux
    comes with several CD-player applications including xplaycd, which is an X application
    that provides a graphical control panel for playing audio CDs. Additionally, both
    GNOME and KDE come with CD players.


    Before using any CD-player program, make sure that you dismount any CD-ROM currently
    in the drive (use the umount /dev/cdrom command introduced in Session 8) and place
    an audio CD in the drive.


    To try out the xplaycd program, type xplaycd in a terminal window from the GNOME
    or KDE desktop. The graphical user interface of xplaycd is intuitive. Try out
    the buttons to see how they work. Click the Exit button to quit the program.


    If you are using the GNOME desktop, you can play audio CDs using the CD Player
    application. To launch the GNOME CD Player, select the Main Menu (Foot) ➔ Programs
    ➔ Multimedia ➔ CD Player. Figure 19-1 shows this CD player playing a track from
    an audio CD.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_242_0.png)


    Figure 19-1

    The GNOME CD Player playing a track from an audio CD


    As you can see, the GNOME CD Player displays the title of the CD and the name
    of the current track. The GNOME CD Player gets the song titles from CDDB — a CD
    database on the Internet. This means that you need an active Internet connection
    for the CD Player to download song information from the CD database. Once the
    CD Player downloads information about a particular CD, it caches that information
    in a local database for future use. The CD Player’s user interface is intuitive,
    and you can learn it easily. One nice feature is that you have the ability to
    select a track by title.


    To learn more about CDDB, read the Frequently Asked Questions about CDDB at http://www.cddb.com/faq.html.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'If you want to log in as a normal user and play audio CDs on the CD-ROM drive,
    you should first log in as root and set the permissions settings on the CD-ROM
    device so that anyone can read the CD-ROM device. You have to set the permissions
    for the actual CD-ROM device, not the generic /dev/cdrom device. To set the permissions
    settings, follow these steps:


    +   1. Log in as root. If you are already logged in, type the su command and enter
    the super user''s password to assume the identity of root.

    +   2. Make the CD-ROM device readable by all users using the chmod command as
    follows:


    ```

    chmod o+r /dev/cdrom

    ```


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_243_0.png)


    Anyone who has access to your Red Hat Linux PC can now play audio CDs and access
    the CD-ROM drive.


    If you use KDE as your desktop, you can find a similar audio CD player in KDE.
    Start the KDE CD Player by selecting K → Multimedia → CD Player. You can then
    use it to play a track from an audio CD.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_243_1.png)


    20 Min.

    To Go


    # Working with Graphics and Images


    The applications in this category enable you to prepare, view, modify, and print
    graphics and images. In the remainder of this session, you try out a few graphics
    and image manipulation applications.


    # The GIMP


    The GIMP (GNU Image Manipulation Program) is an image-manipulation program written
    by Peter Mattis and Spencer Kimball and released under the GNU General Public
    License (GPL). It is installed if you select the Graphics Manipulation package
    when you install Red Hat Linux from this book''s companion CD-ROMs.


    To try out the GIMP, select Main Menu → Programs → Graphics → The GIMP from the
    GNOME desktop (from the KDE desktop, select K → Red Hat → Graphics → The GIMP).
    The GIMP starts and displays a window with information about how to complete a
    personal installation. The message informs you that a personal installation involves
    creating a directory called .gimp-1.1 in your home directory and placing a number
    of files in that directory. This directory essentially holds information'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'about any changes to user preferences that you might make to the GIMP. You
    should go ahead and click the Continue button at the bottom of the window. The
    GIMP creates the necessary directories, copies some files to those directories,
    and guides you through a series of dialog boxes to complete the installation.


    After the installation is done, click the Continue button. From now on, you don’t
    see those two installation windows any more; you have to deal with them only once
    when you run the GIMP for the first time.


    The GIMP then loads any plug-ins—external modules that enhance its functionality.
    It displays a startup window that shows a message about each plug-in as it gets
    loaded.


    After finishing the startup, the GIMP displays a tip of the day in a window. You
    can browse the tips and then click the Close button to close the tip window. At
    the same time it displays the tips window, the GIMP displays the toolbox (as shown
    in Figure 19-2).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_244_0.png)


    Figure 19-2

    The GIMP toolbox


    The toolbox has three menus on the menu bar: File, Xtns (extensions), and Help.
    The File menu includes options to create a new image, open an existing image,
    and quit the GIMP. The Xtns menu gives you access to a whole lot of extensions
    to the GIMP. The exact content of the Xtns menu depends on which extensions are
    installed on your system. The Help menu items enable you to get help.


    To open an image file in the GIMP, select File → Open. This brings up the Load
    Image dialog box that enables you to select an image file. You can change directories
    and select the image file you want to open. GIMP can read most common image-file
    formats such as GIF, JPEG, TIFF, PCX, BMP, PNG, and PostScript. After you select
    the file and click the OK button, the GIMP loads the image into a new window.
    Figure 19-3 shows an image opened by the GIMP.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_245_0.png)


    Figure 19-3

    Displaying an image with the GIMP


    The toolbox in Figure 19-2 also has a large number of buttons, each with an icon,
    that represent the tools you use to edit images and apply special effects. You
    can get pop-up help on each tool button by placing the mouse pointer on the button.
    You can select a tool by clicking the tool button and then you can apply that
    tool''s effects on an image.


    For your convenience, the GIMP displays a pop-up menu when you right-click your
    mouse on the image window. The pop-up menu has most of the options from the File
    and Xtns menus in the toolbox. You also can pick some additional options such
    as printing or mailing the image. You can then select specific actions from these
    pop-up menus.


    You can do much more than just load and view images with the GIMP, but you have
    to spend quite a bit of time learning all of its features. To learn more about
    GIMP, select Xtns ↩ Web Browser ↩ GIMP.ORG ↩ Documentation. This brings up the
    Web browser with the online documentation for the GIMP. (You need an Internet
    connection for this to work.)


    # Ghostscript


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_245_1.png)


    10 Min.

    To Go


    Ghostscript is a utility for previewing and printing PostScript documents. Ghostscript
    enables you to print PostScript documents on many non-PostScript devices.


    At its heart, Ghostscript is a nearly complete implementation of the PostScript
    language. Ghostscript includes the interpreter that processes PostScript input
    and generates output on an output device. A Ghostscript device can be a printer
    (or display screen), as well as an image-file format such as BMP or PCX.


    Ghostscript is distributed under the GNU GPL, but is copyrighted and maintained
    by Aladdin Enterprises. Some Ghostscript documentation is installed in the /usr/doc
    directory. To change to the appropriate directory, type cd /usr/doc/ ghostscript*.
    (The exact directory name depends on the version of Ghostscript installed on your
    system.) You can find the latest contact information in the'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'README file in that directory. That directory also contains some other Ghostscript
    documentation. All of these documentation files are text files that you can view
    using the more command.


    You typically use Ghostscript to load and view a PostScript file. To see how Ghostscript
    renders a PostScript document, you can use any available PostScript document you
    have. One good solution is to use one of the sample PostScript files in the /usr/share/ghostscript/5.50/examples
    directory (replace 5.50 with whatever version of Ghostscript is installed on your
    system) with the gs command. Type the following command, for example, in a terminal
    window:


    ```

    gs /usr/share/ghostscript/5.50/examples/golfer.ps

    ```


    Ghostscript opens that file, processes its contents, and displays the output in
    another window (as shown in Figure 19-4).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_246_0.png)


    Figure 19-4

    Ghostscript displaying a PostScript file'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'In this case, the output is a picture of a golfer. After displaying the output,
    Ghostscript produces the following message:


    ```

    >>showpage, press <return> to continue<<

    ```


    Press Enter to continue. For a multiple-page PostScript document, Ghostscript
    then shows the next page. After all the pages are displayed, you return to the
    Ghostscript prompt. Type quit to exit Ghostscript.


    # Ghostview


    Ghostview is an X-based graphical front end to the Ghostscript interpreter. Ghostview
    is ideal for viewing and printing PostScript documents. For a long document, you
    can even print selected pages. You also can view the document at various levels
    of magnification (zooming in or out).


    To run Ghostview, type ghostview & in a terminal window. This command causes the
    Ghostview window to appear. The window is divided into three parts:


    +   - Along the top edge, you see eight buttons. The first six buttons are menu
    buttons; when you click any of these buttons, a menu appears.

    +   - On the left side, you see several more buttons, text boxes for information
    display, and scrollbars for scrolling the image.

    +   - The large area occupying most of the Ghostview window is the work area where
    Ghostview displays the PostScript document.


    To load and view a PostScript document in Ghostview, select File Open or click
    the Open button on the left side of the Ghostview window. This action causes Ghostview
    to display a file-selection dialog box. Use this dialog box to select a PostScript
    file. You can choose one of the PostScript files that come with Ghostscript. For
    example, select the file tiger.ps in the /usr/share/ghostscript/5.50/examples
    directory. (If your system has a version of Ghostscript later than 5.50, you have
    to use the new version number in place of 5.50.)


    To open the selected file, click the Open File button in the file-selection dialog
    box. Ghostview opens the selected file, processes its contents, and displays the
    output in its window (as shown in Figure 19-5).


    In the last two buttons on the upper-right corner of the window, Ghostview displays
    the current filename and the date the file was created. Ghostview takes this information
    from the comments in the PostScript file itself, not from the time stamp of the
    file.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_248_0.png)


    # Figure 19-5


    *Ghostview displaying a PostScript file*


    As you move the mouse over the image, Ghostview displays the coordinates of the
    mouse pointer in a button along the upper-left corner of the window.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_248_1.png)


    Ghostview is useful for viewing documentation that comes in PostScript format.
    (Files typically have the .ps extension in their names.) For example, you can
    use Ghostview to view the documentation for the CVS program, which comes in several
    PostScript files that you can find in the /usr/share/doc/cvs* directory. When
    viewing such documents in Ghostview, use the magnification button — the button
    labeled 1.000 in Figure 19-5. If you click that button and hold the mouse down,
    a menu appears with a number of magnification factors from 0.1 to 10.0. You may
    have to select a magnification of 2.000 or more to make the document legible onscreen.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_248_2.png)


    Done!'
  merge: -1
  img_proc: true
