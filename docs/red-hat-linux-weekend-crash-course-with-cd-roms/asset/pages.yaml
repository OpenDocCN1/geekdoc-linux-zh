  md: '+   6. I look for information such as CPU usage, physical memory and swap space
    usage, and hard disk usage to monitor the system’s performance.

    +   7. Red Hat Linux includes tools such as the GNOME System Monitor, top, and
    vmstat to monitor system performance.

    +   8. The “load average” is the average number of processes that were ready to
    run in the past few minutes. Typically, system monitors compute load average over
    the past 1, 5, and 15 minutes.

    +   9. Here’s the `vmstat 10 5` command-line that displays 10-second averages
    and prints a total of 5 lines of output. The first line of output from `vmstat`
    shows the averages since the last reboot.

    +   10. The `/proc` file system is not a real directory on the disk but a collection
    of data structures in memory. The Linux kernel manages these data structures and
    they appear to the user as a set of directories and files. The purpose of `/proc`
    is to allow users to access information about the Linux kernel and the processes
    that are currently running on the system.

    +   11. The security policy provides the rules that I would apply to secure the
    system. The security policy should address areas such as how users are authenticated,
    what can various users do, what data must be protected, which Internet services
    are allowed to run, and who is responsible for maintaining and auditing security.

    +   12. The general steps are to install only those packages that I need, create
    user accounts with strong passwords, enable only the necessary Internet services,
    and periodically check log files for signs of break-in attempts. I should also
    keep up with security news and install upgrades from Red Hat.

    +   13. Shadow passwords and the use of MD5 encryption are two ways in which passwords
    are made more secure in Red Hat Linux.

    +   14. `chage -M 30 mary`

    +   15. The xinetd server starts Internet services using the TCP wrapper program.
    As specified in the `/etc/inetd.conf` file, the `/usr/sbin/tcpd` program starts
    other services such as FTP and TELNET, but Before starting a service, the TCP
    wrapper consults the `/etc/hosts.allow` file to see if the host requesting service
    is allowed that service. If there is nothing in `/etc/hosts.allow` about that
    host, the TCP wrapper checks the `/etc/hosts.deny` file to see if the service
    should be denied. If both files are empty, the TCP wrapper allows the host access
    to the requested service. In this way, the TCP wrapper program provides an access
    control facility for Internet services started by xinetd.'
