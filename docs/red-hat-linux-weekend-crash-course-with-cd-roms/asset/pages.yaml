- pgno: 332
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_332_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_332_1.png)


    # Building Software Packages from Source Files


    # Session Checklist


    +   ✓ Downloading and unpacking software

    +   ✓ Building and installing software from source files


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_332_2.png)


    30 Min.

    To Go


    In Session 23, you learned how to install software packages distributed in the
    Red Hat Package Manager (RPM) format. RPM files bundle everything — all the executable
    binary files and configuration files — needed to install a software package. However,
    many open source software packages are distributed in source code form without
    any executable binaries. Before you can use such software, you have to build the
    executable binary files and then you have to follow some instructions to install
    the package. This session shows you how to download and unpack the source files.
    It then shows you how to build software packages from source files and install
    them.


    # Downloading and Unpacking the Software


    Open source software source files are typically distributed in compressed tar
    archives. As you learned in Session 26, the tar program creates these archives
    and then the gzip program compresses them. The distribution is in the form of
    a single large file'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'with the .tar.gz or .tar.Z extension — often referred to as a compressed tarball.
    If you want the software, you have to download the compressed tarball and unpack
    it.


    You download the compressed tar file using anonymous FTP or the Web browser. Typically,
    this involves no more effort on your part than clicking a link and saving the
    file in an appropriate directory on your system.


    To try your hand at downloading and building a software package, you can practice
    on the X Multimedia System (XMMS) — a graphical X application for playing MP3
    files and other multimedia files. XMMS is bundled with Red Hat Linux and is installed
    on your system when you select the Multimedia Support package group during Red
    Hat Linux installation. However, there is no harm in downloading and rebuilding
    the XMMS package again.


    You can access the source files for XMMS from http://www.xmms.org/download.html
    in the form of a compressed tar archive. You can also download the files from
    the xmms/1.0 directory of the anonymous FTP server (ftp.xmms.org). You should
    try downloading from the anonymous FTP server so you know how to manually download
    files.


    Before attempting to download a file from an FTP server, make sure that your Linux
    system is connected to the Internet. You should also change the directory to the
    location where you want to store the downloaded file (although you can always
    move the file after downloading). I typically log in as root and change the directory
    to /usr/local before typing the ftp command. If you use the GNOME or KDE desktop,
    you type these commands from a terminal window.


    # Downloading the software


    Here is a sample session that you can use as a guideline when you download the
    compressed tar file for XMMS from the anonymous FTP server. The lines I typed
    appear in boldface.


    ```

    ftp ftp.xmms.org

    Connected to ftp.xmms.org.

    220 ProFTPD 1.2.0pre10 Server (FTP server for awpti.org) [awpti.org]

    Name (ftp.xmms.org:naba): anonymous

    331 Anonymous login ok, send your complete e-mail address as password.

    Password: (Type your e-mail address and press Enter)

    230 Anonymous access granted, restrictions apply.

    Remote system type is UNIX.

    Using binary mode to transfer files.

    ftp> cd xmms/1.0

    250 CWD command successful.

    ftp> ls

    200 PORT command successful.

    150 Opening ASCII mode data connection for file list.

    drwxr-xr-x 6 xmms xmms 4096 Jan 30 15:20 rpm

    ```'
  merge: -1
  img_proc: true
- pgno: 334
  md: '```

    -rw-r--r--  1 xmms     xmms     700909 Jan 30 15:22 xmms-1.0.0.tar.gz

    -rw-r--r--  1 xmms     xmms     715574 Jan 30 15:15 xmms-1.0.1.tar.gz

    226 Transfer complete.

    ftp> binary

    200 Type set to I.

    ftp> get xmms-1.0.1.tar.gz

    200 PORT command successful.

    150 Opening BINARY mode data connection for xmms-1.0.1.tar.gz (715574 bytes).

    226 Transfer complete.

    715574 bytes received in 383 secs (1.8 Kbytes/sec)

    ftp> bye

    ```


    Notice that you have to log in with the user name anonymous — that’s why the FTP
    server is called the anonymous FTP server. For the password, you should type your
    e-mail address and then press Enter. To change the directory, use the cd command.
    For a directory listing, use the ls command.


    You need to type the binary command to make sure that the data transfer occurs
    in binary mode (because the .tar.gz file is a binary file). Then you can use the
    get command to download the file — in this case, xmms-1.0.1.tar.gz. As I mentioned
    earlier, the .tar.gz extension tells you that this is a compressed tar archive.
    After the download is complete, type bye to end the anonymous FTP session.


    After downloading the compressed tar file, you should first examine the contents
    with this command:


    ```

    tar ztf xmms*.gz | more

