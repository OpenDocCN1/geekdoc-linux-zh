    # Using vi


    The vi editor is a full-screen text editor that enables you to view a file several
    lines at a time. Most UNIX systems, including Red Hat Linux, come with vi. Therefore,
    if you learn the basic features of vi, you can edit text files on almost any UNIX
    system.


    Like the ed editor, vi works with a buffer. When vi edits a file, it reads the
    file into a buffer — a block of memory — and enables you to change the text in
    the buffer. The vi editor also uses temporary files during editing, but the original
    file is not altered until you save the changes with a specific vi command.


    Before you start a full-screen text editor such as vi, you have to set the TERM
    environment variable to the terminal type (such as vt100 or xterm). For example,
    type export TERM=vt100 to set the terminal type to VT100. The vi editor uses the
    terminal type to control the terminal in full-screen mode.


    When you run X and a graphical user interface such as GNOME or KDE, you can use
    vi in a terminal window. The terminal window''s terminal type is xterm. (To verify
    this, type echo $TERM at the command prompt.) When you start the terminal window,
    it automatically sets the TERM environment variable to xterm. Therefore, you should
    be able to use vi in an xterm window without explicitly setting the TERM variable.


    To start the editor, use the vi name followed by an optional filename. You can
    provide other arguments besides the filename. However, most of the time vi starts
    with a filename as the only argument, as shown here:


    ```

    vi /etc/hosts

    ```


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_136_0.png)'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Another common way to start vi is to jump to a specific line number right at
    startup. To begin editing at line 296 of the file /etc/X11/XF86Config, for example,
    use this command:


    ```

    vi +296 /etc/X11/XF86Config

    ```


    This way of starting vi is useful when you edit a source file after the compiler
    reports an error at a specific line number.


    When you edit a file with vi, the editor loads the file into a buffer, displays
    the first few lines of the file in a full-screen window, and positions the cursor
    on the first line. When you type the command vi /etc/fstab in a terminal window,
    for example, you get a full-screen text window.


    The last line shows information about the file, including the number of lines
    and the number of characters in the file. Later, this area functions as a command-entry
    area. The rest of the lines display the file. If the file contains fewer lines
    than the window, vi displays the empty lines with a tilde (~) in the first column.


    The current line is marked by the cursor, which appears as a small black rectangle.
    The cursor appears on top of a character.


    In vi, you work in one of three modes:


    +   - *Visual command mode* is what you get by default. In this mode, anything
    that you type is interpreted as a command that applies to the line containing
    the cursor. The vi commands are similar to the ed commands.

    +   - *Colon command mode* enables you to read or write files, set vi options,
    and quit. All colon commands start with a colon (:). When you enter the colon,
    vi positions the cursor at the last line and enables you to type a command. The
    command takes effect when you press Enter.

    +   - *Text input mode* enables you to enter text into the buffer. You can enter
    input mode with the command a (insert after cursor), A (append at end of line),
    or i (insert after cursor). After entering lines of text, you have to press Esc
    to leave input mode and reenter visual command mode.


    One problem with all these modes is that you cannot easily tell vi’s current mode.
    It is frustrating to begin typing, only to realize that vi is not in input mode.
    The converse situation also occurs commonly — you may be typing text when you
    want to enter a command. If you want to make sure that vi is in command mode,
    just press Esc a few times. (Pressing Esc more than once doesn’t hurt.)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_137_0.png)


    To view online help in vi, type :help while in command mode. Type :q to exit the
    help screen and return to the file you are editing.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'The vi editor initially positions the cursor on the first character. One of
    the first things that you need to learn is how to move the cursor around. Try
    the following commands. Just type the letter and vi responds.


    | Command | Description |

    |---|---|

    | j | Moves the cursor one line down |

    | k | Moves the cursor one line up |

    | h | Moves the cursor one character to the left |

    | l | Moves the cursor one character to the right |

    | w | Moves the cursor one word forward |

    | b | Moves the cursor one word backward |

    | Ctrl+D | Moves down half a screen |

    | Ctrl+U | Scrolls up half a screen |


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_138_0.png)


    Luckily, you can also move the cursor using the arrow keys. If you cannot remember
    the meaning of the j k h l characters, just use the arrow keys to move around
    the file.


    You can go to a specific line number at any time. This is when a colon command
    comes in. To go to line 1, for example, type the following and then press Enter:


    ```

    :1

    ```


    When you type the colon, vi displays the colon on the last line of the screen.
    From then on, vi uses the text that you type as a command. You have to press Enter
    to submit the command to vi. In colon command mode, vi accepts all the commands
    that the ed editor accepts — and then some.


    To search for a string, first type a slash (/). The vi editor displays the slash
    on the last line of the screen. Type the search string and then press Enter. The
    vi editor locates the string and positions the cursor at the beginning of that
    string. Thus, to locate the string cdrom in the file /etc/fstab, type:


    ```

    /cdrom

    ```


    To delete the line that contains the cursor, type dd (two lowercase ds). The vi
    editor deletes that line of text and makes the next line the current one.


    To begin entering text in front of the cursor, type i (a lowercase i all by itself).
    The vi editor switches to text input mode. Now you can enter text. When you finish
    entering text, press Esc to return to visual command mode.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'After you finish editing the file, you can save the changes in the file with
    the :w command. To quit the editor without saving any changes, use the :q! command.
    If you want to save the changes and exit, you can type :wq to perform both steps
    at the same time. The vi editor saves the changes in the file and exits. You can
    also save the changes and exit the editor by pressing Shift+zz (hold the Shift
    key down and press z twice).


    In addition to the few commands illustrated in the sample session, vi accepts
    a large number of commands. Table 9-2 lists some commonly used vi commands, organized
    by task. To try these commands, copy a file such as /etc/X11/XF86Config to your
    home directory and use vi to edit that file with the following commands:


    ```

    cd

    cp /etc/X11/XF86Config .

    vi XF86Config

    ```


    As you edit the file, try the commands shown in Table 9-2. Because good vi skills
    are useful in all UNIX systems, including Red Hat Linux, you should spend a few
    minutes familiarizing yourself with some of the commands from Table 9-2.


    Table 9-2

    Commonly Used vi Commands


    | Command | Meaning |

    |---|---|

    | *Insert text* | |

    | a | Inserts text after the cursor |

    | A | Inserts text at the end of the current line |

    | I | Inserts text at the beginning of the current line |

    | i | Inserts text before the cursor |

    | *Delete text* | |

    | D | Deletes up to the end of the current line |

    | dd | Deletes the current line |

    | dw | Deletes from the cursor to the end of the following word |

    | x | Deletes the character on which the cursor rests |


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_139_0.png)'
