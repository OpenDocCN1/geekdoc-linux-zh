    \ to the world through Web pages. To become an information provider on the Web,\
    \ you have to run a Web server on your Red Hat Linux PC on the Internet.\n\nWeb\
    \ servers provide information by using HTTP. Web servers are also known as HTTP\
    \ daemons (because continuously running server processes are called daemons in\
    \ UNIX), or HTTPD for short. The Web server program usually is named httpd.\n\n\
    Among the freely available Web servers, Apache Web server is the most popular.\
    \ Apache is freely available over the Internet and it accompanies Red Hat Linux\
    \ on this book’s companion CD-ROMs.\n\nWhen you install Red Hat Linux from this\
