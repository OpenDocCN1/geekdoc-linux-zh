  md: '18. I can use the tar utility to back up files and directories. To back up
    the entire file system on a SCSI tape drive, I’d type:


    `tar cvf /dev/st0 /`


    19. To back up several large file in the /home/share directory onto multiple floppies,
    I’d type the following command:


    `tar cvfM /dev/fd0 /home/share`


    20. To store multiple backup archives on a single tape, I’d use a non-rewinding
    tape device with a command such as `tar cvf /dev/nst0 /home` and use similar tar
    commands to create one archive after another. I can rewind the tape with the following
    command:


    `mt -f /dev/nst0 rewind`


    I can skip over an archive with the following command:


    `mt -f /dev/nst0 fsf 1`


    # Sunday Afternoon Review Answers


    1. Many open source software packages are distributed in source code form without
    any executable binaries. Before I can use such software, I have to build the executable
    binary files. That’s why it’s important to learn how to build software from source
    files.


    2. Open source software is typically distributed in compressed tar archives, also
    known as compressed tarballs. I can download the file using anonymous FTP or through
    the Web browser. To unpack, I can use a command of the form `tar zxvf tarball_name`
    where `tarball_name` is the name of the file I downloaded.


    3. After downloading and unpacking the source files, I would look for files with
    the name RADME or INSTALL for instructions on how to build and install the software.


    4. I would first download the file using anonymous FTP. Then use the tar zxvf
    command to unpack the file. Next, I read any README or INSTALL files for instructions.
    In most cases, I type `./configure` to configure the software, then type `make`
    to build the software, and `make install` to install it.


    5. The XMMS package is the X Multimedia System — a graphical X application for
    playing MP3 files and other multimedia files. I built and installed XMMS with
    the command `./configure; make; make install`.'
