    # Performing Basic System Administration Tasks


    # Session Checklist


    +   ✓ Understanding the Linux system and network administration

    +   ✓ Adding user accounts with Linuxconf

    +   ✓ Exploring other tasks performed by Linuxconf


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_142_2.png)


    This final Saturday morning session introduces you to Linux system and network
    administration. Then you learn to perform some system administration tasks using
    Linuxconf, a graphical system administration tool that comes with Red Hat Linux.
    Specifically, you learn how to add user accounts and then you explore other tasks
    that Linuxconf enables you to perform. This overview of Linuxconf should help
    you execute other system administration tasks as the need arises.


    # Understanding Linux System and Network Administration


    System administration refers to tasks that you must perform to keep a computer
    system up and running properly. Now that almost all computers are networked,'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'another set of tasks is needed to keep the network up and running. These tasks
    are collectively called *network administration*. A site with many computers probably
    has a full-time *system administrator* who takes care of all system- and network-administration
    tasks. Really large sites may have separate system- administration and network-administration
    personnel. If you run Red Hat Linux on a home PC or on a few systems in a small
    company, you probably perform the duties of both the system administrator and
    the network administrator.


    As the following descriptions of system and network administration tasks demonstrate,
    you can perform these tasks using the Linuxconf tool — an X Window application
    that enables you to perform most system and network administration tasks without
    having to manually edit configuration files or type cryptic commands. After the
    overview of system and network administration, you learn to use Linuxconf.


    # System administration tasks


    As a system administrator, your typical tasks (which you can perform with Linuxconf)
    include the following:


    +   - *Installing, configuring, and upgrading the operating system and various
    utilities.* You learned how to install Red Hat Linux in earlier sessions.

    +   - *Adding and removing users.* Later in this session, you learn to use Red
    Hat’s graphical Linuxconf tool to add a new user account. If a user forgets the
    password, you can also change the password using Linuxconf.

    +   - *Installing new software.* For the typical Linux software, which you get
    in source-code form, this task involves using tools such as `gunzip` (to uncompress
    the software), `tar` (to unpack the archive), and `make` (to build the executable
    programs). For software distributed by Red Hat in Red Hat Package Manager (RPM)
    files, you have to use the `rpm` command to install the software.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_143_0.png)


    Session 23 shows you how to install RPM packages. In Session 27, you learn how
    to use tools, such as `tar` and `make`, to build software packages.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '+   - *Making backups.* You can use the tar or cpio program to archive one
    or more directories and to copy the archive to a floppy disk (if the archive is
    small enough) or to a tape (if you have a tape drive).

    +   - *Mounting and unmounting file systems.* When you want to access the files
    on a CD-ROM, for example, you have to mount that CD-ROM''s file system on one
    of the directories of the Linux file system. You have to use the mount command
    to accomplish this task. You can also use Linuxconf to mount a file system. (An
    example appears later in this session.)

    +   - *Monitoring the system''s performance.* You have to use a few utilities,
    such as top (to see where the processor spends most of its time) and free (to
    see the amount of free and used memory in the system).

    +   - *Starting and shutting down the system.* Although starting the system typically
    involves nothing more than powering up the PC, you do have to take some care when
    you want to shut down your Linux system. You should use the shutdown command to
    stop all programs before turning off your PC''s power switch. If your system is
    set up for a graphical login screen, you can perform the shutdown operation by
    selecting a menu item from the login screen.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_144_0.png)


    In Session 26, you learn how to back up and restore files.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_144_1.png)


    Mounting is covered in Session 8.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_144_2.png)


    You learn to use utilities to monitor system performance in Session 28.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Network administration tasks


    Typical network-administration tasks that you can perform with Linuxconf include
    the following:


    +   - *Maintaining the network configuration files.* In Linux (as well as in other
    UNIX systems), the TCP/IP network is configured through several text files that
    you may have to edit in order to make networking work. Linuxconf enables you to
    configure the network.

    +   - *Setting up PPP and SLIP.* You can use Linuxconf to set up PPP and SLIP
    connections.

    +   - *Monitoring network status.* You have to use tools such as netstat (to view
    information about active network connections), /sbin/ifconfig (to check the status
    of various network interfaces), and ping (to make sure that a connection is working).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_145_0.png)


    You learn about the TCP/IP configuration files in Session 12.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_145_1.png)


    You learn about the TCP/IP configuration files in Session 13.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_145_2.png)


    Session 12 introduces you to the tools needed to monitor network status.


    # Adding User Accounts with Linuxconf


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_145_3.png)


    20 Min.

    To Go


    When you install Red Hat Linux, one of the steps gives you the opportunity to
    set up other user accounts besides root. If you do not add other user accounts
    during installation, you can do so now. You also must perform this step if you
    want to enable other users to access and use the system.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'It is a good idea to create other user accounts besides root. Even if you are
    the only user of the system, logging in as a less-privileged user is good practice;
    that way, you cannot damage any important system files inadvertently. When necessary,
    you can log in as root and perform any system-administration tasks.


    To start Linuxconf from the GNOME Main Menu in Red Hat Linux, select Main Menu
    (Foot) ⇨ Programs ⇨ System ⇨ LinuxConf.


    The initial Linuxconf window shows three tabs — Config, Control, and Status (see
    Figure 10-1). Each tab includes tree menus that organize that you can perform
    with Linuxconf. When you click a specific item in the tree menu, the configuration
    options for that item appear in a tabbed dialog box to the right handside of the
    tree menu.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_146_0.png)


    Figure 10-1

    Initial Linuxconf window


    To add myself as a new user, I follow these steps:


    +   1. Click the plus sign next to the User accounts button and then click the
    User accounts item shown under Normal. This causes Linuxconf to display the Users
    Accounts dialog box, as shown in Figure 10-2.'
