    I can gather some of this information by double clicking the System icon in the
    Control Panel and then clicking on the Device Manager tab in the System Properties
    window. From there I can view information about specific devices installed in
    the PC.

    +   2. The Red Hat boot disk allows me to start an initial version of Linux under
    which the Red Hat Linux installation program runs. To create the boot disk, I
