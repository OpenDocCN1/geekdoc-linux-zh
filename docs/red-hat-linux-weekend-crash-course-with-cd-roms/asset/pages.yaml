    # Unpacking the software


    To extract (or unpack) the contents of the tar archive, type the following tar
    command:


    ```

    tar zxvf xmms*.gz

    ```


    You again see the long list of files as they are extracted from the archive and
    copied to the appropriate directories on your hard disk.


    Now you are ready to build the software.


    # Building the Software from Source Files and Installing It


    After you unpack the compressed tar archive, all source files are in a directory
    whose name is usually the name of the software package with a version number suffix.
    For example, the XMMS version 1.0.1 source files are extracted in the xmms-1.0.1
    directory. To start the process of building the software, change the directory
    with this command:


    ```

    cd xmms*

    ```


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_335_0.png)


    You don’t have to type the entire name. The shell can expand the directory name
    and change it to the xmms-1.0.1 directory.


    Nearly all software packages come with some sort of README or INSTALL files —
    text files with instructions on what to do to build and install the packages.
    XMMS is no exception; it comes with a README file that you should read by typing
    more README. There is also an INSTALL file that contains instructions for building
    and installing XMMS.'
