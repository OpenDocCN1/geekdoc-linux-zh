- pgno: 103
  md: 'Xclients.sample file in the current directory (such as your home directory),
    type the following:


    ```

    cp /usr/X11R6/lib/X11/xinit/Xclients Xclients.sample

    ```


    If you want to copy a file to the current directory and retain the same name,
    use a period (.) as the second argument of the cp command. Thus, the following
    command copies the XF86Config file from the /etc/X11 directory to the current
    directory (denoted by a single period):


    ```

