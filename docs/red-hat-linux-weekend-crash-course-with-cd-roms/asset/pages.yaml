  md: "![](img/eef64cc01382a4448bc55a2ee7dcc4ca_121_0.png)\n\n# Commands for Managing\
    \ Processes\n\nEvery time the shell acts on a command that you type, it starts\
    \ a process. The shell itself is a process as are any scripts or programs that\
    \ the shell executes. You can use the ps command to see a list of processes. When\
    \ you type ps x, for example, Bash shows you the current set of processes. Following\
    \ is a partial output from the ps x command. (I also included the --cols 132 option\
    \ to ensure that you can see each command in its entirety):\n\n```\nps x --cols\
    \ 132\n  PID TTY   STAT TIME COMMAND\n    1 ?     S   0:05 init [5]\n  325 ? \
    \    S   0:00 syslogd -m 0\n  335 ?     S   0:00 klogd\n  480 ?     S   0:00 crond\n\
    \  511 ?     S   0:00 xinetd -reuse -pidfile /var/run/xinetd.pid\n  580 ?    \
    \ S   0:00 sendmail: accepting connections\n  596 ?     S   0:00 gpm -t imps2\n\
    \  849 ?     S   0:01 /usr/bin/gnome-session\n  893 ?     S   0:00 gnome-s mproxy\
    \ --sm-client-id default0\n  901 ?     S   0:02 sawfish --sm-client-id=default2\n\
    \  967 ?     S   8:36 magicdev --sm-client-id=default12\n  985 ?     S   0:00\
    \ gnome-name-service\n  994 ?     S   0:01 panel --sm-client-id default7\n 1001\
    \ ?     S   0:00 gmc --nowindows --sm-client-id default8\n21437 ?     S   0:00\
    \ gnome-terminal --use-factory --start-factory-server\n21443 ?     S   0:00 gnome-pty-helper\n\
    21444 pts/1 S   0:00 bash\n21455 pts/0 R   0:00 ps x --cols 132\n```\n\nIn the\
    \ output, the COMMAND column shows the commands that create the processes. This\
    \ list shows the bash shell and the ps command as processes. Other processes include\
    \ all the programs that the shell starts when you log in at the graphical login\
    \ screen and start a GNOME session. In particular, the list includes the sawfish\
    \ (window manager) process and the gnome-terminal (terminal window) process.\n\
    \nThe default ps x command does not provide all the processes running on a Linux\
    \ system. What ps x shows are the commands that you start either directly or indirectly\
    \ through shell scripts that run automatically when you log in. To see the full\
    \ complement of processes, use the a option of the ps command together with the\
    \ x option as follows:\n\n```\nps ax\n```"
