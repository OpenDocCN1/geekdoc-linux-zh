    # Using Gnome RPM to Install and Remove Packages


    A significant innovation of Red Hat is the Red Hat Package Manager (RPM) — a system
    for packaging all the necessary files for a software product in a single file
    (referred to as an RPM file, or simply an RPM). Red Hat Linux is distributed in
    the form of a large number of RPMs. All of the RPM files (packages) are located
    in the /mnt/cdrom/RedHat/RPMS directory (assuming that you have mounted the CD-ROM
    on the /mnt/cdrom directory). Gnome RPM is a graphical front utility for installing
    and uninstalling RPMs. The operations that you can perform with Gnome'
