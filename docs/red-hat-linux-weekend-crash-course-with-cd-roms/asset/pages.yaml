    # Accessing Other Linux Resources


    In addition to the online help I just described, several other resources can provide
    more information on specific topics. Most of the resources are on the Internet
    because that’s where you can get the latest information on Red Hat Linux and Linux
    in general. The rest of this session introduces you to some of these Linux resources.
    Instead of providing a long listing of URLs, I show a few key Web sites that you
    can use as a starting point for your search.'
