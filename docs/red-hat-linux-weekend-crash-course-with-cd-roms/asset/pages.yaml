    # Performing tasks with GNOME File Manager


    In addition to moving around the file system and viewing contents of directories,
    you can use the file manager to perform tasks such as moving a file from one directory
    to another and deleting a file. I don’t show you each and every step, but you
    can take a few moments to try the following tasks:


    +   - To move a file to a different directory, drag-and-drop the file’s icon on
    the directory where you want the file.

    +   - To copy a file to a new location, select the file’s icon and then select
    File → Copy. You may also right-click the mouse on the file’s icon and select
    Copy from the pop-up menu. A dialog box prompts you for the name of the directory
    to which the file should be copied.

    +   - To delete a file or directory, right-click the icon and select Delete from
    the pop-up menu. A dialog box asks you to confirm if you really want to delete
    the file or directory. You can click Yes to delete the selected item or click
