    ↩ gEdit from the GNOME desktop. You can open a file by clicking the Open button
    on the toolbar. This brings up the Open File dialog box. You can then change directories
    and select the file to edit by clicking the OK button.


    The gEdit editor then loads the file in its window. You can open more than one
    file and move among them as you edit the files. Figure 9-1 shows a typical editing
    session with gEdit.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_131_0.png)


    Figure 9-1

    Editing several text files with gEdit


    In this case, the editor has three files — hosts, fstab, and inittab (all from
    the /etc directory) — open for editing. The filenames appear as tabs below the
    tool bar of the editor’s window. You can switch among the files by clicking the
    tabs with the filenames.


    The rest of the text-editing steps are intuitive. To enter new text, click to
    position the cursor and begin typing. You can select text, copy, cut, and paste
    using the buttons on the toolbar above the text-editing area.


    From the KDE desktop, you can start KEdit (the KDE text editor) by selecting K
    ↩ Applications ↩ Text Editor. To open a text file, select File ↩ Open from the
    menu. A dialog box appears. From this dialog box, you can go to the right directory,
