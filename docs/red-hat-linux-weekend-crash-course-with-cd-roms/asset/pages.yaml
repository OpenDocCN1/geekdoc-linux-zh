  md: 'RPM are similar to what you can do with the rpm command from the command line.
    You learn the rpm command later in this session.


    To start Gnome RPM, log in as root and then select Main Menu ⇒ Programs ⇒ System
    ⇒ GnoRPM. Figure 23-1 shows the initial Gnome RPM window. Gnome RPM has a standard
    GNOME user interface with a menu bar and a toolbar. The toolbar has buttons for
