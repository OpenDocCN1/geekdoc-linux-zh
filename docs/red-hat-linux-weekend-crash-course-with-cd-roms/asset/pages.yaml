- pgno: 379
  md: '3. Usually a new PC''s hard disk has a single partition that is used by Windows
    95/98. If I decide to keep Windows on my PC, I have to repartition the hard disk
    to create room for the Linux file system. I can repartition in two ways: by backing
    up everything and destructively repartitioning my disk with the FDISK command
    or by using the FIPS program to non-destructively create room for a new partition.
    I would use the FIPS program because that''s easier than destructive repartitioning.
    I could also use tools such as PartitionMagic to non-destructively create a new
    partition for Linux.


    4. The Red Hat Linux installation program provides four installation types: Server,
    GNOME Workstation, KDE Workstation, and Custom. If I select Server class installation,
    the installation program deletes all existing disk partitions, including any existing
    Windows partitions. Then it creates a fixed size swap partition, a small /boot
    partition for the kernel, a larger root partition, and two even larger partitions
    for the /usr and /home file system, and another partition for the /var file system.
    All in all, the Server-class installation requires approximately 1.6GB of disk
    space.


    5. The IDE disk devices are named /dev/hda, /dev/hdb, /dev/hdc, and /dev/hdd.
    The SCSI disk devices are named /dev/sda, /dev/sdb, and so on. The partition names
    for the /dev/hda disk are /dev/hda1, /dev/hda2, /dev/hda3, and so on.


    6. Linux uses the swap space as virtual memory where disk storage is used as an
    extension of physical memory (RAM). When the Linux kernel runs out of physical
    memory to run a program, it can move (or swap out) the contents of currently unneeded
    parts of RAM to make room for a program that needs more memory. As soon as the
    time comes to access anything in the swapped-out data, the Linux kernel has to
    find something else to swap out and then it swaps in the required data from disk
    into physical memory. I should set aside at least 32MB or the amount of RAM in
    my PC, whichever is more.


    7. In Disk Druid, I must specify / as the mount point for this disk partition.


    8. To mount a DOS partition during installation, I will assign a Linux directory
    name where the DOS partition should appear.


    9. In the LILO Configuration screen, I would select the DOS partition from the
    list and then click the Default boot image button.


    10. I can add one or more normal users during Red Hat Linux installation. To add
    a user account, I enter the user information in the Account Configuration screen
    and click the Add button to add the user.'
