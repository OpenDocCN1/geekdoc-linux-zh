- pgno: 87
  md: '# Logging out


    Before you explore the GNOME GUI, you should learn how to log out. To log out,
    select Main Menu — the stylized foot icon at the left edge of the GNOME Panel
    in the GNOME desktop (see Figure 5-2) — and then select Log Out from the menu.
    The screen grays out and a dialog box prompts to see if you really want to log
    out and also to give you the option to halt or reboot the PC. Click the Yes button
    to log out. After a few moments, the graphical login screen (Figure 5-1) appears
    so that another user (or you again) can log in and use the system.


    # Shutting down Red Hat Linux


    When you are ready to shut down Red Hat Linux, you must do so in an orderly manner.
    Even if you are the sole user of a Linux system, several other programs are usually
    running in the background. Also, operating systems such as Linux try to optimize
    the way that they write data to the disk. Because disk access is relatively slow
    (compared with the time needed to access memory locations), data generally is
    held in memory and written to the disk in large chunks. Therefore, if you simply
    turn the power off, you run the risk of some files not updating properly.


    Any user (you do not have to be logged in) can shut down the system from the desktop
    or the graphical login screen. The System menu in the login dialog box provides
    menu options for rebooting or halting the system. To shut down the system, simply
    select System ↻ Halt in the graphical login screen of Figure 5-1.


    Another dialog box asks you to confirm if you really want to halt the system.
    Click the Yes button. The system then shuts down in an orderly manner.


    As the system shuts down, you see messages about processes being shut down. You
    may be surprised at how many processes there are — even though no one is explicitly
    running any programs on the system. If your system does not automatically power
    off on shut down, you can manually turn off the power.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_87_0.png)


    # Exploring GNOME


    Power up the PC again and log in after you get the graphical login screen. You
    should again get the GNOME desktop because it’s the default. In this section,
    you spend some time exploring the GNOME desktop.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# What Is GNOME?


    GNOME stands for GNU Network Object Model Environment; GNU, as you probably know,
    stands for GNU''s Not UNIX. GNOME is a graphical user interface (GUI) and a programming
    environment. From the user''s perspective, GNOME is like the Motif-based Common
    Desktop Environment (CDE) or Microsoft Windows. Behind the scenes, GNOME has many
    features that enable programmers to write graphical applications that can work
    together well. In this session, I only point out some key features of the GNOME
    GUI and I leave the details to you to explore on your own.


    You can always find out the latest information about GNOME by visiting the GNOME
    home page at http://www.gnome.org.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_88_0.png)


    The exact appearance of the GNOME display depends on the current session. A session
