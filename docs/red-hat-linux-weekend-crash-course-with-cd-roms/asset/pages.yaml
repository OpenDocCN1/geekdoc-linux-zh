- pgno: 364
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_364_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_364_1.png)


    # Getting Help from Available Resources


    # Session Checklist


    +   - ✓ Using the help viewers

    +   - ✓ Using the commands

    +   - ✓ Looking up online HOWTO files

    +   - ✓ Accessing other Linux resources


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_364_2.png)


    By now you have learned a lot about Red Hat Linux, but there is much more that
    this book cannot cover because of the time constraint. To make sure that you can
    find help when you need it, this final session of the weekend introduces you to
    a wide variety of Linux resources that provide more information if you are experiencing
    a problem with a particular topic or with Red Hat Linux in general. Some of the
    help is available right on your system, but you can find many more resources on
    the Internet.


    # Using the Help Viewers


    Both GNOME and KDE desktops come with help viewers — the Gnome Help Browser and
    KDE Help — to view online help information. You try these two help viewers next.'
  merge: -1
  img_proc: true
- pgno: 365
  md: '# GNOME Help Browser


    From the GNOME desktop, select Main Menu Programs Help system or click the question
    mark icon on the GNOME Panel to launch the GNOME Help Browser. The Gnome Help
    Browser provides a Web browser-like graphical interface through which you can
    access various forms of documentation available on your Red Hat Linux system and
    on the Internet. The initial screen of the Gnome Help Browser organizes the help
    information into several categories:


    +   - GNOME User''s Guide is a hyperlink to help information on how to use the
    GNOME desktop.

    +   - GNOME Documents is a link that provides access to documentation on some
    GNOME applications and games.

    +   - Man Pages link refers to the online manual pages (called man pages for short).

    +   - Info Pages link refers to online documentation for the GNU utilities (mostly
    software development tools).


    Typically, you look for help in the man pages. To view a table of contents of
    the available man pages, click the Man Pages link. The table of contents is organized
    by categories and alphabetically within each category. You can jump to a category
    by clicking a link in the category list at the beginning of the page. For example,
    clicking Administration takes you to the system administration commands. You can
    then scroll down in that category and click a command for which you want more
    help. You should explore the table of contents of the man pages and view other
    man pages that interest you.


    You can also access Red Hat''s Web site by clicking on the Red Hat icon on the
    GNOME desktop. The icon is labeled www.redhat.com. That probably gives you a clue
    that this is a link to Red Hat''s Web site. Clicking on that icon causes Netscape
    Communicator to start and go to the URL http://www.redhat.com.


    # KDE Help


    From the KDE desktop, you can start KDE Help by selecting K KDE Help or by clicking
    the icon that shows a light bulb on a book. The KDE Help application has a Web
    browser-like user interface through which you can view online help information.
    When it starts, KDE Help shows a number of links organized into a number of categories.
    There are links to learn about KDE and obtain information about the KDE Project.
    Another set of links provides information that teaches how to use and'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'get the most out of KDE. A third set of links provide access to the man pages
    and GNU info pages, just as the GNOME Help Browser does. One of the links in the
    third set enables you to search for online help using one or more keywords.


    To look for a man page, click the link labeled System man page contents. This
    brings up the online man pages’ table of contents, organized by sections such
    as User Commands, File Formats, and System Administration. Click on a section
    head to view the list of items in that section. You can then click on a specific
    item to read the man page for that item. For example, to learn more about the
    xinetd configuration files, select the section labeled File Formats. Then click
    on the link labeled xinetd.conf. KDE Help then displays the man page with information
    about xinetd configuration file.


    You can also access Red Hat’s Web sites directly from the KDE desktop by clicking
    on one of three Red Hat icons labeled: www.redhat.com, Red Hat Errata, and Red
    Hat Support. Each of these icons is a link to a specific Red Hat Web site. For
    example, clicking on Red Hat Support takes you to the support.redhat.com Web site.


    # Using the Linux Commands to Get Help


    Although it’s convenient to browse help information through graphical help browsers,
    you often need help while typing Linux commands in a terminal window.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_366_0.png)


    Another trick you should know is that most Linux commands have a help option.
    Typically, if you invoke the command with the --help option, the command prints
    some help information. At a minimum, this information includes the command-line
    options the command accepts. Often the help information can span more than one
    screen, so you should pipe the output through more, as shown in the following
    example:


    ```

    ls --help | more

    ```


    # man command


    You may vaguely recall a command’s name, but you cannot remember the exact syntax
    of what you are supposed to type. This is a situation in which the man command
    can come to your rescue. With the man command, you can view the man page on a
    Linux command and then use that command correctly.'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'You do have to remember that command to look up online help. For example, to
    view the man page for the modprobe command, type the following command in a terminal
    window:


    ```

    man modprobe

    ```


    The man command then displays the help information page by page. Press the Spacebar
    to move to the next page. Press b to move backward by a page. To look for a specific
    word in the man page, press the forward slash, type the word, and press Enter.
    For example, to search for the word ‘debug’, type /debug and press Enter. When
    you finish reading the man page, press q to return to the Linux command prompt.


    # whatis command


    If you do not want to read the full man page, you can use whatis to read a one-line
    summary of a command. For example, here’s how you use whatis to see a brief description
    of the modprobe command:


    ```

    whatis modprobe

    modprobe          (8) - high level handling of loadable module

    ```


    The number (8) indicates the man page section where the modprobe command is listed.
    You should try the whatis command to view one-line descriptions of a few other
    commands.


    You can use the shell’s wildcard feature and the whatis command to explore the
    files in various system directories such as /bin, /sbin, /usr/sbin, /usr/bin,
    and so on. Simply change the directory to one of interest and type whatis * to
    view one-line descriptions of the programs in that directory. (whatis displays
    information for those programs for which such information is available.) For example,
    here is how you can explore the /sbin directory:


    ```

    cd /sbin; whatis * | more

    arp               (7) - Linux ARP kernel module

    arp               (8) - manipulate the system ARP cache

    askrunlevel: nothing appropriate

    badblocks         (8) - search a device for bad blocks

    cardctl           (8) - PCMCIA card control utility

    cardmgr           (8) - PCMCIA device manager

    ... rest of the output not shown ...

    ```'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'As you can see, the output is an alphabetical list of all programs in the current
    directory, along with the one-line descriptions where available. The whatis command
    displays a message saying nothing appropriate if there is no information available
    for a program.


    # apropos command


    The man and whatis commands are useful when you know the name of a command. If
    you do not know the exact name of a command, you can use the apropos command to
    search for a command by a keyword (even a part of a word). For example, if you
    remember the command contains the word probe, type the following apropos command
    to search:


    ```

    apropos probe

    modprobe          (8)  - high level handling of loadable modules

    pnpprobe          (8)  - scan ISA bus for PnP sound cards

    SuperProbe        (1x) - probe for and identify installed video hardware

    ```


    In this case, the search result shows three candidate commands, each with a brief
    description. You can then select the command that does what you want to do.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_368_0.png)


    If apropos displays a long list of commands that scroll by too fast for you to
    read, you can type apropos keyword | more to view the output one screen at a time.


    # Looking Up Online HOWTO Files


    Another form of online documentation that you can refer to is the HOWTO file listing
    that you access by opening the URL http://www.redhat.com/mirrors/LDP/ in Netscape
    Communicator. The LDP in that URL refers to the Linux Documentation Project and
    on that Web page, you can find links to Frequently Asked Questions (FAQs) and
    HOWTOs. You can click the HOWTOs link and download (or read) HOWTO documents in
    several formats, including text and HTML format. For example, if you click to
    view text-format HOWTOs, the Web browser shows a list of over 170 HOWTO files
    (see Figure 30-1).'
  merge: -1
  img_proc: true
