- pgno: 311
  md: '# Scheduling One-time Jobs


    You can use the at command to schedule the execution of one or more commands at
    a later time. The atd daemon — a program designed to process jobs submitted using
    at — executes the commands at the specified time and mails the output to you.


    The following configuration files control which users can schedule tasks using
    the at command:


    +   - `/etc/at.allow` contains the names of the users who may submit jobs using
    the at command.

    +   - `/etc/at.deny` contains the names of users who are not allowed to submit
    jobs using the at command.


    If these files are not present or there is an empty /etc/at.deny file, then any
    user can submit jobs using the at command. The default in Red Hat Linux is an
    empty /etc/at.deny file, so anyone can use the at command. If you do not want
    some users to use at, simply list those user names in the /etc/at.deny file.


    # Submitting a one-time job


    To use at to schedule a one-time job for execution at a later date, follow these
    steps:


    +   1. Run the at command with the date or time when you want your commands executed.
    When you press Enter, the at> prompt appears as follows:

    +   2. At the at> prompt, type the commands you want to execute just as you do
    at the shell prompt. After each command, press Enter and continue with the next
    command. When you are finished entering the commands you want to execute, press
    Ctrl+D to end this step. Here is an example showing a single command:


    ```

    at 21:30

    at>

    ```


    This is the simplest way to indicate the time when you want to execute one or
    more commands — simply specify the time in a 24-hour format. In this case, you
    want to execute the commands at 9:30 p.m. tonight (or tomorrow, if it''s already
    past 9:30 p.m.). You can, however, specify the execution time in many different
    ways (see Table 25-1 for examples).


    ```

    at> ps

    at> <EOT>

    ```'
  merge: -1
  img_proc: true
- pgno: 312
  md: '```

    warning: commands will be executed using /bin/sh

    job 2 at 2000-05-15 21:30

    ```


    After you press Ctrl+D, the at command responds with a job number and the date
    and time when the job will execute.


    # Table 25-1


    Specifying the Time of Execution with the at Command


    | Command | When the Job Runs |

    |---|---|

    | at now | Immediately |

    | at now + 15 minutes | 15 minutes from the current time |

    | at now + 4 hours | 4 hours from the current time |

    | at now + 7 days | 7 days from the current time |

    | at noon | At noontime today (or tomorrow, if already past noon) |

    | at now next hour | Exactly 60 minutes from now |

    | at now next day | At the same time tomorrow |

    | at 17:00 tomorrow | At 5:00 p.m. tomorrow |

    | at 4:45pm | At 4:45 p.m. today (or tomorrow, if already past 4:45 p.m.) |

    | at 3:00 Aug 16, 00 | At 3:00 a.m. on August 16, 2000 |


    # Verifying scheduled one-time jobs


    After you enter one or more jobs, you can view the current list of scheduled jobs
    with the atq command:


    ```

    atq

    2        2000-05-15 21:30 a

    3        2000-08-16 03:00 a

    4        2000-05-16 21:57 a

    5        2000-05-16 16:45 a

    ```'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'The first field on each line shows the job number — the same number that the
    at command displays when you submit the job. The next field displays the year,
    month, day, and time of execution. The last field shows that the jobs are pending
    in the a queue.


    # Canceling one-time jobs and receiving the output


    If you want to cancel a job, use the atrm command to remove that job from the
    queue. When removing a job with the atrm command, refer to the job by its number
    as follows:


    ```

    atrm 3

    ```


    This deletes job number 3 scheduled for 3:00 a.m. August 16, 2000.


    When a job executes, the output is mailed to you. Type mail to read your mail
    and view the output from your jobs.


    # Scheduling Recurring Jobs


    While the at command is good for running commands at a specific time, it’s not
    useful for running a program automatically at repeated intervals. You have to
    use crontab to schedule such recurring jobs. You need to do this, for example,
    if you want to back up your files to tape at midnight every day.


    You schedule recurring jobs by placing job information in a file with a specific
    format and submitting this file with the crontab command. The cron daemon — crond
    — checks the job information every minute and executes the recurring jobs at the
    specified times. Because the cron daemon processes recurring jobs, such jobs are
    also referred to as cron jobs.


    Any output from the job is mailed to the user who submits the job. (In the submitted
    job information file, you may specify a different recipient for the mailed output.)


    As with the at command, two files control who can schedule cron jobs using crontab:


    +   - `/etc/cron.allow` contains the names of the users who may submit jobs using
    the crontab command.

    +   - `/etc/cron.deny` contains the names of users who are not allowed to submit
    jobs using the crontab command.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_313_0.png)'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'If the `/etc/cron.allow` file exists, only users listed in this file can schedule
    cron jobs. If only the `/etc/cron.deny` file exists, then users listed in this
    file cannot schedule cron jobs. If neither file exists, the default Red Hat Linux
    setup enables any user to submit cron jobs.


    # Submitting a cron job


    To submit a cron job, perform the following steps:


    +   1. Prepare a shell script (or an executable program in any programming language)
    that can perform the recurring task you want to perform. You can skip this step
    if you want to execute an existing program periodically.

    +   2. Prepare a text file with information about the times when you want the
    shell script or program (from step 1) to execute. This is the file you submit
    using crontab. You can submit several recurring jobs with a single file. Each
    line with timing information about a job has a standard format with at least six
    fields — the first five specify when the job runs and the sixth and subsequent
    fields constitute the actual command to be run. For example, this line executes
    the myjob shell script in a user''s home directory at 5 minutes past midnight
    each day:

    +   3. Submit the information to crontab with the following command:

    +   In this case, the text file jobinfo (in the current directory) contains the
    job information.


    ```

    5 0 * * * $HOME/myjob

    ```


    Table 25-2 shows the meaning of the first five fields. Also, an entry in any of
    the first five fields can be a single number, a comma-separated list of numbers,
    a pair of numbers separated by a dash (indicating a range of numbers), or an asterisk.
    An asterisk (*) means all possible values for that field.


    ```

    crontab jobinfo

    ```


    That''s it! You''re all set with the cron job. From now on, the cron job should
    run at regular intervals (as specified in the job information file) and you should
    receive mail messages with the output from the job.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Verifying the cron job is scheduled


    To verify that the job is indeed scheduled, type the following command:


    ```

    crontab -l

    # DO NOT EDIT THIS FILE - edit the master and reinstall.

    # (jobinfo installed on Tue May 16 20:44:23 2000)

    # (Cron version -- $Id: crontab.c,v 2.13 1994/01/17 03:20:37 vixie Exp $)

    SHELL=/bin/sh

    5 0 * * * $HOME/myjob

    ```


    The output of the crontab -l command shows the cron jobs currently installed in
    your name. To remove your cron jobs, type crontab -r.


    # Table 25-2

    Specifying the Time of Execution in crontab Files


    | Field Number | Meaning of Field | Acceptable Range of Values* |

    |---|---|---|

    | 1 | Minute | 0-59 |

    | 2 | Hour of the day | 0-23 |

    | 3 | Day of the month | 0-31 |

    | 4 | Month | 1-12 (1 means January, 2 means February, and so on) or the names
    of months using the first letters (Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep,
    Oct, Nov, Dec) |

    | 5 | Day of the week | 0-6 (0 means Sunday, 1 means Monday, and so on) or the
    three-letter abbreviations of the weekday (Sun, Mon, Tue, Wed, Thu, Fri, Sat)
    |


    * An asterisk in a field means all possible values for that field. For example,
    if an asterisk appears in the third field, the job executes every day.


    # Setting up cron jobs for any user


    If you log in as root, you can also set up, examine, and remove cron jobs for
    any user. To set up cron jobs for a user, use this command:


    ```

    crontab -u username filename

    ```


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_315_0.png)'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'Here *username* is the user for whom you are installing the cron jobs, and
    *filename* is the file that contains the information about the jobs.


    Use the following crontab command to view the cron jobs for a user:


    ```

    crontab -u username -l

    ```


    To remove a user’s cron jobs, use the following command:


    ```

    crontab -u username -r

    ```


    The cron daemon also executes the cron jobs listed in the system-wide cron job
    file /etc/crontab. Here’s the default /etc/crontab file in Red Hat Linux (type
    cat /etc/crontab to view the file):


    ```

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=root

    HOME=/


    # run-parts

    01 * * * * root run-parts /etc/cron.hourly

    02 4 * * * root run-parts /etc/cron.daily

    22 4 * * 0 root run-parts /etc/cron.weekly

    42 4 1 * * root run-parts /etc/cron.monthly

    ```


    The first four lines set up several environment variables for the jobs listed
    in this file. The MAILTO environment variable specifies the user who receives
    the mail message with the output from the cron jobs in this file.


    The line that begins with a # is a comment line. The last four lines execute the
    run-parts shell script (located in the /usr/bin directory) at various times with
    the name of a specific directory as an argument. Each of the arguments to run-parts
    — /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, and /etc/cron.monthly —
    are directories. Essentially, run-parts executes all scripts located in the directory
    that you provide as an argument. Here is what those directories contain:


    | Directory Name | Contents |

    |---|---|

    | /etc/cron.hourly | scripts executed every hour |

