    # SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_130_1.png)


    # Editing Text Files in

    Red Hat Linux


    # Session Checklist


    +   - ✓ Using the GUI text editors in GNOME and KDE

    +   - ✓ Using the ed and vi text-mode text editors


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_130_2.png)


    30 Min.

    To Go


    In this session, you learn to use text editors — the GUI editors and the ed and
    vi text-mode editors. Text editing is an important part of all operating systems,
    including Red Hat Linux, because many system configuration files are text files.
    In Red Hat Linux, you may have to create and edit a variety of text files, such
    as: system configuration files, including /etc/fstab, /etc/hosts, /etc/inittab,
    and /etc/X11/XF86Config; user files, such as .newsrc and .bash_profile; mail messages
    and news articles; shell script files; Perl and Tcl/Tk scripts; and C or C++ programs.


    # Text Editing with GUI Text Editors


    Both of the Linux graphical desktops — GNOME and KDE — come with GUI text editors
    (text editors that have graphical user interfaces).'
