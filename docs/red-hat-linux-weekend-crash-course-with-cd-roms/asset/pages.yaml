- pgno: 299
  md: '# Installing the Source Files and Rebuilding the Kernel


    Rebuilding the kernel refers to the task of creating a new binary file for the
    core Linux operating system. This binary file runs when Red Hat Linux boots. You
    may have to build the kernel for various reasons:


    +   - After you apply kernel patches that update the operating system’s source
    files, you have to rebuild the kernel and reboot the system to use the new kernel.

    +   - After you initially install Red Hat Linux, you may want to create a new
    kernel that includes support for only the hardware actually installed on your
    system. In particular, if you have a SCSI adapter, you may want to create a kernel
    that links in the SCSI driver. The kernel in the companion CD-ROMs includes the
    SCSI driver as an external module that you must load at startup.

    +   - If you have a system with hardware for which only experimental support is
    available, you have to rebuild the kernel to include that support in the operating
    system.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_299_0.png)


    Before you rebuild the kernel, make sure you have the emergency boot floppy (covered
    in Session 3) that you prepared when installing Red Hat Linux. If the system does
    not boot after you rebuild the kernel, you can use that emergency boot floppy
    to start the system and repeat the kernel build process.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_299_1.png)


    Never rebuild and install a new kernel without first making sure that you have
    an emergency boot floppy. If you did not create the boot floppy during Red Hat
    Linux installation, use the /sbin/mkbootdisk command to create the boot floppy.
    Type man mkbootdisk to learn the syntax of that command.


    Rebuilding the kernel involves the following key phases:


    +   - Installing kernel source files

    +   - Configuring the kernel

    +   - Building the kernel

    +   - Building and installing the modules (if any)

    +   - Installing the kernel and setting up LILO


    Subsequent sections describe the phases of kernel building.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Installing kernel source files


    To rebuild the Linux kernel, you need the kernel source files. The kernel source
    files normally are not installed. Use the following steps to install the kernel
    source package on your system:


    +   1. Log in as root and insert the Red Hat Linux CD-ROM into the CD-ROM drive.

    +   2. Use the mount command to mount the CD-ROM drive on a directory in the file
    system:

    +   3. Change the directory to the RedHat/RPMS directory on the CD-ROM and use
    the following commands to install the kernel source files:


    ```

    mount /mnt/cdrom

    ```


    ```

    cd /mnt/cdrom/RedHat/RPMS

    ```


    ```

    rpm -ivh kernel-source*

    ```


    ```

    kernel-source

    ```


    ```

    ###################################

    ```


    The rpm command indicates progress by displaying a series of hash marks (#). After
    RPM finishes installing the kernel source package, the necessary source files
    appear in the /usr/src/linux directory.


    # Creating a monolithic versus a modular kernel


    Before you start configuring the kernel, you need to understand that you have
    two options for the device drivers needed to support various hardware devices
    in Linux:


    +   - Link in support. You can link the drivers for all hardware on your system
    into the kernel. As you can imagine, the size of the kernel grows as device driver
    code is incorporated into the kernel. A kernel that links in all necessary support
    code is called a monolithic kernel.

    +   - Use modules. You can create the necessary device drivers in the form of
    modules. A module is a block of code that the kernel can load after it starts
    running. You typically use modules to add support for a device without having
    to rebuild the kernel for each new device. Modules do not have to be device drivers;
    you can use them to add new functionality to the kernel. A kernel that uses modules
    is called a modular kernel.


    You do not have to create a fully monolithic or fully modular kernel. In fact,
    it is common practice to link some support directly into the kernel. Conversely,
    you can build infrequently used device drivers in the form of modules. For a company
    such as Red Hat, it makes sense to distribute a modular kernel.'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'Red Hat provides a generic kernel along with a large number of modules to support
    many different types of hardware. Then, the installation program configures the
    system to load only those modules that are needed to support the hardware installed
    in a user''s system.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_301_0.png)


    > When you create a custom kernel for your hardware configuration, you may link
    in all required device drivers into the kernel. You can keep the size of such
    a monolithic kernel under control because you only link in device drivers for
    the hardware actually installed on your system.


    # Configuring the Kernel


    The first phase in rebuilding a kernel is configuring the kernel. To configure
    the kernel, log in as root. Then change the directory to /usr/src/linux by using
    the cd command as follows:


    ```

    cd /usr/src/linux

    ```


    To configure the kernel, you have to indicate the features and device drivers
    (covered in the previous section) that you want to include in your Red Hat Linux
    system. In essence, you build a copy of Linux with the mix-and-match features
    that you want.


    Red Hat Linux provides three ways for you to configure the kernel:


    +   - Type make menuconfig to enter the kernel configuration parameters through
    a text-based interface, similar to the one used by the Red Hat installation program.

    +   - Type make xconfig to use an X Window System-based configuration program
    to configure the kernel. You have to run X to use this configuration program with
    a graphical interface.

    +   - Type make config to use a program that prompts you for each configuration
    option one by one. You can use this configuration program from the Linux command
    prompt. When you use this option, you undergo a long question-and-answer process
    to specify the configuration parameters.


    As you configure the kernel, you have to select how to include support for specific
    devices. Typically, for each configuration option, you must type one of the following
