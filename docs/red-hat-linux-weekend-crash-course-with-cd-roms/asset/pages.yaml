- pgno: 54
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_54_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_54_1.png)


    # Finishing the Red Hat Linux Installation


    # Session Checklist


    +   - ✓ Configuring Red Hat Linux

    +   - ✓ Selecting packages to install

    +   - ✓ Completing the Red Hat Linux installation


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_54_2.png)


    30 Min.

    To Go


    In the previous session, you set aside disk space for Red Hat Linux, started the
    installation program, and prepared the disk partitions, including a swap partition.
    In this session, you finish installing Red Hat Linux. You learn how to configure
    Red Hat Linux, select the packages to install, and let the installation program
    complete the remaining installation chores.


    # Configuring Red Hat Linux


    After you prepare the disk partitions with Disk Druid and specify which partitions
    to format, the installation program moves on to some configuration steps. The
    typical configuration steps are as follows:


    +   - Install LILO

    +   - Configure the network'
  merge: -1
  img_proc: true
- pgno: 55
  md: '+   - Set the time zone

    +   - Set the root password and add user accounts

    +   - Configure password authentication


    The following sections guide you through each of these configuration steps.


    # Install LILO


    LILO stands for Linux Loader — a program that resides on your hard disk and starts
    Red Hat Linux from the hard disk. If you have Windows 95/98 on your hard disk,
    you can configure LILO to load these operating systems as well. LILO is also known
    as the bootloader.


    The Red Hat installation program displays the LILO Configuration screen (see Figure
    3-1), which asks you where you want to install LILO. For systems with Windows
    95/98 and Red Hat Linux residing on a single hard disk, Red Hat recommends installing
    LILO on the master boot record.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_55_0.png)


    Figure 3-1

    The LILO Configuration screen enables you to specify where to install LILO and
    whether to create a boot disk.


    The first button on this screen asks if you want to create a boot disk. This is
    different from the installation boot disk; you can use this disk to boot your
    Linux system if the Linux kernel on the hard disk is damaged or if LILO — the
    Linux'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Loader — does not work. The Create boot disk button is selected by default
    and you should leave it that way. Later on, the installation program prompts you
    to insert a blank floppy into your PC’s A: drive.


    You can use the next button, labeled Do not install LILO, to turn off LILO installation.
    If you choose not to install LILO, you should definitely create a boot disk. Otherwise,
    you can’t start Red Hat Linux when you reboot the PC.


    The next part of the LILO Configuration screen gives you the option to install
    LILO in one of two locations:


    +   - Master Boot Record (MBR), which is located in the first sector of your PC’s
    hard disk (the C: drive)

    +   - First sector of the partition where you loaded Red Hat Linux


    You should install LILO in the MBR, unless you are using another operating system
    loader such as System Commander or OS/2 Boot Manager. The screen includes a text
    field labeled Kernel parameters that enables you to enter any special options
    that Red Hat Linux may need as it boots. Your need for special options depends
    on what hardware you have. On my PC, I have a 3Com 3C503 Ethernet card that is
    connected to the local Ethernet using an external transceiver. When Red Hat Linux
    loads the driver software for the 3Com 3C503 card, I need to specify the option
    xcvr=1 to make sure that the driver uses the external transceiver. I enter that
    option on the Kernel parameters text field.


    The remainder of the LILO Configuration screen gives you the option to select
    the disk partition from which you want to boot the PC. A table then lists the
    Linux partition and any other partitions that may contain another operating system.
    If your system has a Linux partition and a DOS partition (that actually has Windows
    95/98 installed on it), the table shows both of these entries. Each entry in that
    table is an operating system that LILO can boot.


    After you install LILO, whenever your PC boots from the hard disk, LILO runs and
    displays a boot: prompt. At the prompt, you may type the name of an operating
    system to boot. (The Boot label column in the table in the bottom right section
    of Figure 3-1 shows the names you may enter at the LILO prompt). If the list shows
    two entries labeled linux and dos, type linux to boot Linux and dos to boot from
    the DOS partition (which should start Windows 95/98, if that’s what you have installed
    on that partition). If you press tab at the LILO prompt, LILO displays the boot
    labels.


    When rebooting the PC, if you enter nothing at the LILO prompt, LILO waits for
    a few seconds and boots the default operating system. The default operating system
    is the one with a check mark in the Default column in Figure 3-1. In this case,
    Linux is the default operating system.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'All this is for your information. You can essentially accept the default selections
    on this screen and click the Next button to proceed to the next configuration
    step.


    # Configure the network


    Assuming the Linux kernel detected a network card, the Red Hat installation program
    displays the Network Configuration screen (see Figure 3-2) that enables you to
    configure the local area network (LAN) parameters for your Linux system.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_57_0.png)


    Figure 3-2

    The Network Configuration screen enables you to configure the local area network.


    This step is not for configuring the dial-up networking. You need to perform this
    step if your Linux system is connected to a TCP/IP LAN through an Ethernet card.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_57_1.png)


    If the Red Hat installation program does not detect your network card and you
    have a network card installed on the PC, you should restart the installation and
    type expert at the boot prompt. Then you can manually select your network card.
    See Session 4 for more information.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The Network Configuration screen (Figure 3-2) displays tabbed dialog boxes
    — one for each network card installed on your system and detected by the Linux
    kernel. These tabs are labeled eth0, eth1, and so on. If your system has only
    one Ethernet card, you see only the eth0 tab. Figure 3-1 has only one tab. Each
    tab offers two choices for specifying the IP (Internet Protocol) address for the
    network interface:


    +   - Use DHCP — Click the button labeled Configure using DHCP if your PC obtains
    its IP address and other network information from a Dynamic Host Configuration
    Protocol (DHCP) server.

    +   - Provide static IP address — Fill in the necessary network-related information
    manually.


    You should select DHCP only if a DHCP server is running on your local area network.
    If you choose DHCP, your network configuration is set automatically and you can
    skip the rest of this section. You should leave the Activate on boot button selected
    so that the network is configured whenever you boot the system.


    To provide static IP address and other network information, you have to enter
    certain parameters for TCP/IP configuration in the text input fields that appear
    on the Network Configuration screen (refer to Figure 3-2).


    The Network Configuration screen asks for the following key parameters:


    +   - IP address of the Ethernet interface

    +   - The host name for your Linux system (For a private LAN, you can assign your
    own host name without worrying about conflicting with any other existing systems
    on the Internet.)

    +   - IP address of the gateway (the system through which you might go to any
    outside network)

    +   - IP address of the primary name server

    +   - IP address of a secondary name server

    +   - IP address of a ternary name server


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_58_0.png)


    If you have a private LAN (one that is not directly connected to the Internet),
    you may use an IP address from a range designated for private use. Common IP addresses
    for private LANs are the addresses in the range 192.168.1.1 through 192.168.1.254.
    Session 12 provides more in-depth information about TCP/IP networking and IP addresses.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'After you enter the requested parameters, click the Next button to proceed
    to the next configuration step.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_59_0.png)


    # Set the time zone


    After completing the network configuration, you have to select the time zone —
    the difference between the local time and the current time in Greenwich, England,
    which is the standard reference time. The time zone is also known as Greenwich
    Mean Time (GMT) or UTC, which was selected by the International Telecommunication
    Union (ITU) as a standard abbreviation for Coordinated Universal Time. The installation
    program shows you the Time Zone Selection screen (see Figure 3-3) from which you
    can select the time zone, either in terms of a geographic location or as an offset
    from the UTC. Figure 3-3 shows the selection of a time zone in a geographic location.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_59_1.png)


    # Figure 3-3


    *Selecting your time zone in terms of a geographic location*


    Notice that there are two tabs on the Time Zone Selection screen — Location and
    UTC Offset. Initially, the screen shows the Location tab. This tab enables you
    to pick a time zone by simply clicking your geographic location. As you move the
    mouse over the map, the currently selected location’s name appears in a text field.
    If you want, you can also select your location from a long list of countries and'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'regions. If you live on the East Coast of the United States, for example, select
    USA/Eastern. Of course, the easiest way is to simply click eastern USA on the
    map.


    If the worldview of the map is too large for you to select your location, click
    the View button on top of the map. A drop-down list of views appears with several
    choices. You can then click the view appropriate for your location.


    The other way to set a time zone is to specify the time difference between your
    local time and UTC. Click the UTC Offset tab to select the time zone this way.


    For example, if you live in the eastern part of the United States, select UTC-05:00
    as the time zone. This tab also enables you to activate Daylight Saving Time,
    which applies to USA only. After you select your time zone, click the Next button
    to proceed to the next configuration step.


    # Set the root password and add user accounts


    After completing time zone selection, the installation program displays the Account
    Configuration screen (see Figure 3-4) in which you can set the root password and
    add one or more user accounts.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_60_0.png)


    Figure 3-4


    Setting the root password and adding other user accounts


    The root user is the super user in Linux. Because the super user can do anything
    in the system, you should assign a password that you can remember — but that'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'others cannot guess easily. Typically, make the password at least eight characters
    long, include a mix of letters and numbers, and (for good measure) throw in some
    special characters such as + or *. Remember the password is also case sensitive.


    Type the password on the first line and then reenter the password on the next
    line. Each character in the password appears as an asterisk (*) on the screen.
    Both entries must match before the installation program accepts the password.
    The installation program displays a message when it accepts the root password.
    After you type the root password twice, you might also want to add one or more
    user accounts.


    To add a user account, fill in the Account Name, Password, and Full Name fields
    and then click the Add button. The new account information then appears in the
    table underneath the Add button. You do not have to add all the user accounts
    at this time. Later on, you can use the Linuxconf tool (which comes with Red Hat)
    to add more user accounts.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_61_0.png)


    You must enter the root password before you can proceed with the rest of the installation.
    After you do so and add any other user accounts you need, click the Next button
    to continue with the installation.


    # Configure password authentication


    The installation program displays a screen from which you can configure the password
    authentication options. There are several options that you can enable or disable.
    Of these, the first two are already selected:


    +   - **Enable MD5 passwords:** Select this option to enable users to use long
    passwords of up to 256 characters instead of the standard password that can be,
    at most, eight characters long. Note that MD5 refers to Message Digest 5, an algorithm
    developed by RSA, Inc. to compute the digest of the entire data of a message.
    Essentially, MD5 reduces a message to a digest consisting of four 32-bit numbers.

    +   - **Enable shadow passwords:** This option causes the /etc/passwd file to
    be replaced by /etc/shadow, which only the super user (root) can read. This provides
    an added level of security.


    You should use these default settings for increased system security. Click the
    Next button to proceed to the next configuration step.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Selecting the Package Groups to Install


    After you complete the key configuration steps, the installation program displays
    a screen from which you can select the Red Hat Linux package groups that you want
    to install. After you select the package groups, you can take a coffee break and
    the Red Hat installation program can format the disk partitions and copy all selected
    files to those partitions.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_62_0.png)


    Red Hat uses special files called *packages* to bundle a number of files that
    make up specific software. For example, all configuration files, documentation,
    and binary files for the Perl programming language come in a Red Hat package.
    You use a special program called *Red Hat Package Manager (RPM)* to install, uninstall,
    and get information about packages. Session 23 shows you how to use RPM. For now,
    just remember that a package group is made up of several Red Hat packages.


    Figure 3-5 shows the Package Group Selection screen with the list of package groups
    that you can elect to install. An icon, a descriptive label, and a button prefix
    identify each package group.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_62_1.png)


    Figure 3-5

    GUI screen from which you select the components to install'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Some of the components are already selected, as indicated by the pressed-in
    buttons. These are the minimal set of packages that Red Hat recommends for installation
    for the class of installation (Workstation, Server, or Custom) you have chosen.
    You can, however, choose to install any or all of the components. Use the mouse
    to move up and down in the scrolling list and click the mouse on an entry to select
    or deselect that package group.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_63_0.png)


    In an actual Red Hat Linux installation, you install exactly those package groups
    that you need. However, for the purpose of this crash course, choose many different
    package groups because you need them to go through all the sessions. Each package
    group requires specific packages to run. The Red Hat installation program automatically
    checks for any package dependencies and shows you a list of packages that are
    required but that you have not selected. In this case, you should install the
    required packages.


    Because each package group is a collection of many different Red Hat packages,
    the installation program also gives you the option to select individual packages.
    If you select the item labeled Select individual packages that appears below the
    list in Figure 3-5 and then click the Next button, the installation program takes
    you to other screens where you can select individual packages. If you are installing
    Red Hat Linux for the first time, you really do not need to go down to this level
    of detail to install specific packages. Simply pick the components that you think
    you need from the screen shown in Figure 3-5. After you select the components
    you want, click the Next button to continue with the rest of the installation.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_63_1.png)


    You can always install additional packages later on with the RPM utility program,
    described in Session 23.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_63_2.png)


    # Completing the Installation


    After you complete the key configuration steps and select the components to install,
    the installation program configures the X Window System. The installation program
    uses an X server with minimal capability that can work on all video cards. In
    this step, the installation program prepares the configuration file that the X
    server uses when your system reboots.


    The installation program tries to detect the monitor and displays the X Configuration
    screen (see Figure 3-6) with the result, whether or not it succeeds.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_64_0.png)


    # Figure 3-6


    Result of detecting the monitor displayed in the X Configuration screen


    If the installation program displays a wrong monitor or a generic one as the choice,
    you should enter a range of values for the two parameters that appear along the
    bottom of the screen:


    +   - **Horizontal Sync** — the number of times per second that the monitor can
    display a horizontal raster line, in kilohertz (kHz). A typical range might be
    30–64 kilohertz (kHz).

    +   - **Vertical Sync** — how many times a second the monitor can display the
    entire screen, in Hertz (Hz). Also known as *vertical refresh rate*, the typical
    range is 50–90 Hertz (Hz).


    Typically, the monitor’s documentation includes all this information. Other places
    to get information about your monitor include: your Microsoft Windows setup, your
    system’s Windows driver, your computer vendor’s Web site, or the Norton System
    Information tool.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_64_1.png)


    Do not specify a horizontal synchronization range that is beyond the capabilities
    of your monitor. A wrong value can damage the monitor.


    After selecting the monitor, the installation program tries to detect the video
    card and displays the result in a screen. The detected card appears as the selected'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'item in a long list of video cards. If you know the exact name of the video
    card or the name of the video chipset used in the video card, select that item
    from the list.


    On the same screen where you view and select the video card, you should also turn
    on the graphical login by clicking the button labeled Use Graphical Login. Then
    you get a graphical login screen when you reboot the system.


    After you finish selecting X configuration options, click the Next button. The
    installation program displays an informative message telling you that a log of
    the installation is in the /tmp/install.log file. That file essentially lists
    all the Red Hat packages that are installed in your system. You can review the
    install log later on and keep the file for future reference. The content of the
    install log depends on the exact packages you choose to install.


    Click the Next button to proceed with the installation. The Red Hat installation
    program formats the disk partitions and then installs the packages. As it installs
    packages, the installation program displays a status screen showing the progress
    of the installation with information such as the total number of packages to install,
    the number installed so far, an estimated amount of disk space needed, and an
    estimated time remaining to install. Formatting and installation both take a while.


    After all the packages are installed, the installation program displays a screen
    that prompts you to insert a blank floppy into your PC''s A: drive. This floppy
    is the emergency boot disk that you can use to start Red Hat Linux if something
    happens to the hard disk or you do not install the LILO.


    Insert a blank floppy into your PC''s A: drive and click the Next button. The
    installation program copies the Linux kernel and some other files to the floppy.
    After preparing the boot disk, the installation program displays a message informing
    you that installation is complete.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_65_0.png)


    **When you insert a blank floppy into your PC''s A: drive, this destroys all data
    on the floppy.**


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_65_1.png)


    The message goes on to remind you to remove the floppy from drive A: before exiting
    the installation program. Do so, label the floppy appropriately, and save it for
    future use. Then click the Exit button to reboot your PC. When it finishes rebooting,
    you should get the Red Hat Linux graphical login screen. You are now all set to
    explore and learn Red Hat Linux.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# REVIEW


