    +   - To rename a file or a directory, click the name in the Icon view (see Figure
    6-3). Then you can type the new name or edit the name.

    +   - To create a new directory, right-click in an empty area of the right-hand
    window and select New Directory from the pop-up menu. A dialog box prompts you
