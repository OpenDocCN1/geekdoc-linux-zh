    \ 5-second intervals, type the following command (the second argument indicates\
    \ the total number of lines of output vmstat should display):\n\n```\nvmstat 5\
    \ 8\n      procs                       memory      swap            io     system\
    \      cpu\n     r  b  w   swap  free  buff  cache   si   so    bi    bo   in\
    \   cs us sy id\n     1  0  0  4724  1620  3420  18244    0    0     2     0 \
