- pgno: 209
  md: '# Mounting and Accessing a DOS/Windows File System


    Red Hat Linux has built-in support for MS-DOS files. As Session 6 reveals, Red
    Hat Linux has a single file system that starts at the root directory and is denoted
    by a single slash (/). Even if you have a separate hard disk (or multiple hard
    disk partitions on a single disk), the contents of those hard disks appear logically
    somewhere in the Red Hat Linux file system. Mounting, as discussed in Session
    8, is the operation that you perform to cause a physical storage device (a hard
    disk partition or a CD-ROM) to appear as part of the Red Hat Linux file system.


    # Mounting DOS/Windows file systems during installation


    During installation (see Session 2), the Red Hat installation program runs the
    Disk Druid program. This program finds any DOS/Windows partitions by checking
    the hard disk’s partition table. Through the Disk Druid program, you can specify
    where you want to mount each DOS partition. (Mounting makes the DOS directory
    hierarchy appear as part of the Linux file system.) For example, you may mount
    the first DOS partition as /dosc, the second one as /dosd, and so on. (You can
    name these mount points anything you want.) If you specify these mount points,
    Disk Druid performs the necessary steps to ensure that the DOS partitions are
    mounted automatically whenever you boot Linux.


    To see whether your DOS/Windows hard disk partition is mounted automatically,
    follow these steps:


    +   1. Use the grep command to look for the string vfat in the file /etc/fstab.
    Note the result I get with grep on one of my Linux PCs:

    +   ```

    +   grep vfat /etc/fstab

    +   /dev/hda1 /dosc vfat defaults 0 0

    +   ```

    +   2. If the output shows one or more lines that contain vfat, your Linux system
    mounts DOS/Windows hard disk partitions automatically. In this example, the output
    shows a matching line whose first field is the partition name /dev/hda1 (the first
    partition on the first IDE disk); the second field, /dosc, shows where that partition
    is mounted.

    +   3. If the grep command does not show any lines that contain the string vfat
    in /etc/fstab, your system does not mount any DOS/Windows hard disk partitions
    automatically. An explanation, of course, may be that your hard disk does not
    have any DOS partitions.


    ```

    grep vfat /etc/fstab

    /dev/hda1 /dosc vfat defaults 0 0

    ```'
  merge: -1
  img_proc: true
- pgno: 210
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_210_0.png)


    You do not have to be the root user to perform the preceding steps.


    Another quick way to find out about the mounted devices is to type mount (without
    any arguments) at the shell prompt. Following is the output of the mount command
    on my system:


    ```

    /dev/hda3 on / type ext2 (rw)

    none on /proc type proc (rw)

    /dev/hda1 on /dosc type vfat (rw)(Windows partition mounted on /dosc)

    none on /dev/pts type devpts (rw.mode=0622)

    ```


    If you see any vfat in the output, those lines indicate MS-DOS file systems mounted
    on Red Hat Linux. In this case, a MS-DOS partition is mounted on the Linux directory
    /dosc.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_210_1.png)


    Even if you don’t have any DOS/Windows partitions on your hard disk, you should
    learn how to access a DOS/Windows file system from Red Hat Linux because you may
    have to access a DOS/Windows floppy disk under Red Hat Linux. Understanding the
    concept of mounting is key to using a DOS file system in Red Hat Linux.


    # Mounting a DOS/Windows file system with the mount command


    As discussed in Session 8, you can use the mount command to mount a device on
    the Linux file system manually at a specified directory. That directory is referred
    to as the mount point. You can use any directory as the mount point. However,
    if you mount a device on a non-empty directory, you lose the ability to access
    the files in that directory until you unmount the device with the umount command.
    Therefore, you should always use an empty directory (such as /mnt/cdrom) as the
    mount point.


    If your DOS/Windows partition is the first partition on your IDE drive and you
    want to mount it on /dosc, use the following mount command:


    ```

    mount -t vfat /dev/hda1 /dosc

    ```


    The -t vfat part of the mount command specifies that the device you mount — /dev/hda1
    — has an MS-DOS file system. Linux has built-in support for MS-DOS files. Figure
    16-1 illustrates the effect of this mount command.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_211_0.png)


    Figure 16-1

    Mounting a DOS/Windows partition on the /dosc directory


    Figure 16-1 also shows how directories in your DOS partition are mapped to the
    Linux file system. What once was the C:\DOS directory under DOS now becomes /dosc/dos
    under Linux. Similarly, C:\WINDOWS is now /dosc/windows. You probably can see
    the pattern. To convert a DOS filename to Linux (for this specific case, when
    you mount the DOS partition on /dosc), perform the following steps:


    +   - Change the DOS names to lowercase.

    +   - Change C:\ to /dosc/.

    +   - Change all backslashes (\) to slashes (/).


    # Mounting and Accessing DOS/Windows Floppy Disks


    20 Min.

    To Go


    Just as you can mount a DOS/Windows hard disk partition under Linux, you can mount
    a DOS/Windows floppy disk. Usually, you have to log in as root to mount a floppy,
    but you can follow the steps shown in the latter part of this session to set up
    your system so that any user can mount a DOS/Windows floppy disk. You also need
    to know the device name for the floppy drive. By default, Linux defines two generic
    floppy device names:


    +   - /dev/fd0, which is the A: drive (the first floppy drive)

    +   - /dev/fd1, which is the B: drive (the second floppy drive, if you have one)


    As for the mount point, an existing directory named /mnt/floppy is meant specifically
    for this type of temporary mount operation. Thus, you can mount the DOS floppy
    disk on the /mnt/floppy directory with the following command:


    ```

    mount -t vfat /dev/fd0 /mnt/floppy

    ```'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'After the floppy is mounted, you can copy files to and from the floppy using
    Linux’s copy command (cp). To copy the file gnome1.pcx from the current directory
    to the floppy, type the following:


    ```

    cp gnome1.pcx /mnt/floppy

    ```


    Similarly, to see the contents of the floppy disk, type the following:


    ```

    ls /mnt/floppy

    ```


    When you want to remove the floppy disk from the drive, first dismount the floppy
    drive. This action removes the association between the floppy disk’s file system
    and the mount point on the Linux file system. Use the umount command to dismount
    a device, as follows:


    ```

    umount /dev/fd0

    ```


    You can set up your Linux system so that any user can mount a DOS floppy. You
    simply log in as root and add a line in the /etc/fstab file. For example, to enable
    users to mount a DOS floppy in the A: drive on the /a directory, perform these
    steps:


    +   1. Log in as root.

    +   2. Create the /a directory with the following command:

    +      `mkdir /a`

    +   3. Edit the /etc/fstab file in a text editor (such as vi or Emacs) and insert
    the following code. Then save the file and quit the editor.

    +      `/dev/fd0   /a   vfat   noauto,user   0 0`

    +      On that line, the user option (which appears next to noauto) enables all
    users to mount DOS floppy disks. The first field in that line is the device name
    (/dev/fd0), the second one is the mount directory (/a), and the third field shows
    the type of file system (vfat).

    +   4. Log out and log in as a normal (not root) user.

    +   5. To test that you can mount a DOS floppy without being root, insert a DOS
    floppy in the A: drive and type the following command:

    +      `mount /a`

    +      Notice that you use the mount directory as an argument for the mount command.
    The mount operation should succeed, and you should see a listing of the DOS floppy
    when you type the command ls /a.

    +   6. To unmount the DOS floppy, type umount /a.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Accessing and Using DOS/Windows Floppy Disks with mtools


    So far you learned one way to access the MS-DOS file system: mount the DOS hard
    disk or floppy disk using the mount command; then use regular Linux commands,
    such as ls and cp. This approach to mounting a DOS file system is fine for hard
    disks. Linux can mount the DOS partition automatically at startup, and you can
    access the DOS directories on the hard disk anytime.


    If you want to get a quick directory listing of a DOS floppy disk, however, you
    may find mounting tedious. This is where the mtools package comes to the rescue.
    The mtools package is a collection of utilities that implements most common DOS
    commands. The commands have the same names as in DOS, except that you add an m
    prefix to each command. Thus, mdir retrieves a directory listing and mcopy copies
    files. The best part of mtools is the fact that you do not have to mount the floppy
    disk to use the mtools commands.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_213_0.png)


    Because the mtools commands write to and read from the physical device (floppy
    disk), you have to log in as root to perform these commands. If you want any user
    to access the mtools commands, you have to alter the permission settings for the
    floppy-drive devices. Use the following command to permit anyone to read from
    and write to the first floppy drive:


    ```

    chmod o+rw /dev/fd0

    ```


    # Verifying if mtools is installed


    The mtools package comes with the Red Hat Linux distribution on this book’s companion
    CD-ROMs. When you install Red Hat Linux, mtools is installed automatically as
    part of the base Linux. The mtools executable files are in the /usr/bin directory.
    To see whether you have mtools installed, type ls /usr/bin/mdir at the shell prompt.
    If the ls command shows that this file exists, you should have mtools available
    on your system.


    You also can type the following rpm command to verify that mtools is installed
    on your system:


    ```

    rpm -q mtools

    mtools-3.9.7-3

    ```'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'If mtools is installed, the output shows you the full name of the mtools package.
    The sample output shows that mtools version 3.9.7 is installed on the system.
    To try mtools, follow these steps:


    +   1. Log in as root, or type su and then enter the root password.

    +   2. Place an MS-DOS floppy disk in your system''s A: drive.

    +   3. Type mdir. You should see the directory of the floppy disk (in the standard
    DOS directory-listing format).


    # Checking the /etc/mtools.conf file


    The mtools package should work with the default setup; but if you get any errors,
    you should check the /etc/mtools.conf file. This file contains the definitions
    of the drives (such as A:, B:, and C:) that the mtools utilities see. Following
    are a few lines from a typical /etc/mtools.conf file:


    ```

    drive a: file="/dev/fd0" exclusive 1.44m

    drive b: file="/dev/fd1" exclusive 1.44m


    # First SCSI hard disk partition

    #drive c: file="/dev/sda1"


    # First IDE hard disk partition

    drive c: file="/dev/hda1"


    # IDE Zip drive

    drive X: file="/dev/hdd4" exclusive

    ```


    The pound sign (#) indicates the start of a comment. Each line defines a drive
    letter, the associated Linux device name, and some keywords that indicate how
    the device is accessed. In this example, the first two lines define drives A:
    and B:. The third non-comment line defines drive C: as the first partition on
    the first IDE drive (/dev/hda1). If you have other DOS drives (D:, for example),
    you can add another line that defines drive D: as the appropriate disk partition.


    If your system''s A: drive is a high-density, 3.5-inch drive, you do not have
    to change anything in the default /etc/mtools.conf file.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Understanding the mtools commands


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_215_0.png)


    As I explained earlier in this chapter, the mtools package is a collection of
    utilities. So far, you have seen the command mdir — the mtools counterpart of
    the DIR command in DOS.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_215_1.png)


    If you know the MS-DOS commands, using the mtools commands is very easy. Type
    the DOS command in lowercase letters, and add m in front of each command. Because
    the Linux commands and filenames are case-sensitive, use all lowercase letters
    when you type the mtools commands.


    Table 16-1 summarizes the various mtools utilities and some of their corresponding
    commands available in mtools version 3.9.6.


    Table 16-1

    Common mtools Commands


    | mtools Utility | MS-DOS Command (If Any) | Action |

    |---|---|---|

    | mattrib | ATTRIB | Changes MS-DOS file-attribute flags |

    | mcd | CD | Changes an MS-DOS directory |

    | mcopy | COPY | Copies files between MS-DOS and Linux |

    | mdel | DEL or ERASE | Deletes an MS-DOS file |

    | mdel tree | DELTREE | Recursively deletes an MS-DOS directory |

    | mdir | DIR | Displays an MS-DOS directory listing |

    | mformat | FORMAT | Places an MS-DOS file system on a low-level formatted floppy
    disk (use fdformat to low-level format a floppy in Linux) |

    | mlabel | LABEL | Initializes an MS-DOS volume label |

    | mmd | MD or MKDIR | Creates an MS-DOS directory |

    | mmove | N/A | Moves or renames an MS-DOS file or subdirectory |

    | mrd | RD or RMDIR | Deletes an MS-DOS directory |'
  merge: -1
  img_proc: true
- pgno: 216
  md: '| mtools Utility | MS-DOS Command (If Any) | Action |

    |---|---|---|

    | mren | REN or RENAME | Renames an existing MS-DOS file |

    | mtype | TYPE | Displays the contents of an MS-DOS file |

    | xcopy | XCOPY | Recursively copies a DOS directory into another |


    You can use the mtools commands just as you use the corresponding DOS command.
    For example, the mdir command works like the DIR command in DOS. The same goes
    for all the other mtools commands shown in Table 16-1.


    Formatting a DOS/Windows floppy disk


    Suppose you have to copy some files on an MS-DOS/Windows floppy disk. If you already
    have a formatted MS-DOS/Windows floppy, you can simply mount that floppy and copy
    the files to the floppy using the Linux cp command. What if you do not have a
    formatted DOS floppy? The mtools package again comes to the rescue.


    The mtools package provides the mformat utility, which can format a floppy disk
    for use under MS-DOS. Unlike the DOS format command that formats a floppy in a
    single step, the mformat command requires you to follow a two-step process:


    +   1. Use the fdformat Linux command to low-level format a floppy disk. The fdformat
    command expects the floppy device name to be the argument; the device name includes
    all the parameters necessary for formatting the floppy disk. To format a 3.5-inch
    high-density floppy disk in your system''s A: drive, type `fdformat /dev/fd0H1440`.

    +   2. Use the mformat command to put an MS-DOS file system on the low-level formatted
    floppy disk. If the floppy is in drive A:, type the following command:

    +      `mformat a:`


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_216_0.png)


    # REVIEW


    This session showed you how to access and mount the DOS/Windows file systems from
    Red Hat Linux and how to mount a DOS/Windows file system with the mount command.
    You also learned how to use the mtools utility programs to format and access a
    DOS/Windows floppy disk directly from Red Hat Linux without first having to mount
    the floppy disk.'
  merge: -1
  img_proc: true
