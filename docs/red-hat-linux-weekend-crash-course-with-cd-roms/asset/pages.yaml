  md: '2. Save the old System.map file in the /boot directory and copy the new map
    file. (I assume that you rebuild kernel version 2.2.16-21 after changing some
    configuration options):


    ```

    mv /boot/System.map-2.2.16-21 /boot/System.map-.2.16-21-old

    cp /usr/src/linux/System.map /boot/System.map-2.2.16-1

    cd /boot

    ln -s System.map-2.2.16-21 System.map

    ```


    3. Use your favorite text editor to edit the /etc/lilo.conf file and add the following
    lines just after the timeout line in the file:


    ```

    image=/boot/zImage

    label=new

    root=/dev/hda3

    read-only

    ```


    On your system, you should make sure that the root line is correct — instead of
    /dev/hda3, list the correct disk partition where the Linux root directory (/)
    is located. Also, use the correct filename for the kernel image file (for example,
    /boot/bzImage if the kernel file is so named).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_307_0.png)


    I don’t show the initrd line anymore because I assume that you are no longer using
    a modular SCSI driver even if your system has a SCSI adapter.


    4. Save the lilo.conf file and exit the editor.


    5. Install LILO again by using the following command:


    ```

    /sbin/lilo

    ```


    Now you are ready to reboot the system and try out the new kernel.


    # Rebooting the System


    After you finish configuring and installing LILO, you return to the Linux prompt.
    While you are still logged in as root, type the following command to reboot the
    system:


    ```

    reboot

    ```'
