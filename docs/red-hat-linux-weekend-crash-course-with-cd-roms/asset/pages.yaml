- pgno: 371
  md: '# Web pages


    If you browse the Internet, you may notice that there are quite a few Web pages
    with Linux-related information. A good starting point is the following Linux page:


    ```

    http://www.linux.org/

    ```


    This page provides a starting point for locating information about Linux. You
    can click the buttons to access more information on the topic identified by that
    button’s label. At this page, you also find an organized collection of links to
    Linux-related Web sites.


    To browse recent news about Linux, visit the Linux Resources page at:


    ```

    http://www.linuxresources.com/

    ```


    Specialized Systems Consultants (SSC), Inc., the publisher of the Linux Journal,
    maintains this page. You can scan the articles in the latest issue of Linux Journal
    and find out other information such as the latest version of the kernel and links
    to other Linux resources.


    Another popular and definitive source of Linux information is the home page of
    the Linux Documentation Project (LDP) at the following URL:


    ```

    http://www.linuxdoc.org/

    ```


    On this Web site, you can find many more pointers to other Linux resources on
    the Internet. In particular, you can browse and download the latest HOWTO documents
    from http://metalab.unc.edu/pub/Linux/docs/HOWTO/.


    For Red Hat Linux-specific questions, you can visit Red Hat’s Support Web site
    at:


    ```

    http://www.redhat.com/apps/support/

    ```


    This Web site provides links such as Product Updates and Errata, Hardware Compatibility
    List, and Installation Guides and Manuals. In particular, you can find the manuals
    and FAQs (Frequently Asked Questions) at http://www.redhat.com/support/docs/howto/.


    # Internet newsgroups


    To keep up with Linux developments, you really need access to the Internet and
    especially to the newsgroups. You can find discussions on specific Linux-related
    topics in the newsgroups listed in Table 30-1.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# Table 30-1

    Linux Newsgroups on the Internet


    | Newsgroup | Provides the Following |

    |---|---|

    | comp.os.linux.admin | Information about Linux system administration |

    | comp.os.linux.advocacy | Discussions about promoting Linux |

    | comp.os.linux.announce | Important announcements about Linux (This is a moderated
    newsgroup, which means you must mail the article to the moderator who then posts
    it to the newsgroup.) |

    | comp.os.linux.answers | Questions and answers about Linux (All the Linux HOWTOs
    are posted in this moderated newsgroup.) |

    | comp.os.linux.development | Current Linux development work |

    | comp.os.linux.development.apps | Linux application development |

    | comp.os.linux.development.system | Linux operating system development |

    | comp.os.linux.hardware | Discussions about Linux and various hardware |

    | comp.os.linux.help | Help with various aspects of Linux |

    | comp.os.linux.misc | Miscellaneous topics about Linux |

    | comp.os.linux.networking | Networking under Linux |

    | comp.os.linux.setup | Linux setup and installation |

    | comp.os.linux.x | Discussions about setting up and running the X Window System
    under Linux |


    You can use Netscape Communicator to read the newsgroups. For a newsgroup, use
    a URL of the form news://newsserver/newsgroup in which newsserver is the fully
    qualified domain name of your news server (your Internet Service Provider should
    give you this name) and newsgroup is the name of the newsgroup you want'
  merge: -1
  img_proc: true
