- pgno: 38
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_38_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_38_1.png)


    # Making Room for Red Hat Linux


    # Session Checklist


    +   - Repartitioning your hard drive with FIPS

    +   - Starting the Red Hat Linux installation

    +   - Partitioning the hard disk for Red Hat Linux


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_38_2.png)


    In the previous session, you gathered information about your PC''s hardware and
    prepared a Red Hat boot disk. This session shows you how to do one more preparatory
    task — setting aside disk space. It also demonstrates the next step: How to use
    the Red Hat boot disk to begin the Red Hat Linux installation and then partition
    (divide) the disk again — this time under Linux — to create the necessary Linux
    partitions. Then you move on to the next session, which shows you how to finish
    installing Red Hat Linux.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_38_3.png)


    If you plan to install Red Hat Linux on a second hard disk or you want to completely
    wipe out your current disk and install Red Hat Linux on it, you do not have to
    go through the process of repartitioning your hard disk under MS-DOS to create
    room for Red Hat Linux. Skip the next section and proceed to the “Starting the
    Red Hat Linux Installation” section.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Repartitioning Your Hard Drive with FIPS


    If your PC has a single hard disk drive, chances are that you have Microsoft Windows
    95/98 installed on that drive. If your hard drive is at least 1GB, I recommend
    that you keep Windows installed on your system even if you want to work mostly
    in Red Hat Linux. After all, you have to perform some of the Red Hat Linux installation
    steps under MS-DOS or Windows. Also, you can access the Windows files from Red
    Hat Linux. Essentially, you get the best of both worlds by keeping MS-DOS and
    Windows around when you install Red Hat Linux.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_39_0.png)


    If your new PC has one large hard disk (typically larger than 2GB) but two drives
    — C: and D: — that means the disk already has two partitions. In this case, you
    may simply want to use the extended partition (drive D:) for Linux. Skip this
    step and proceed to the “Starting the Red Hat Linux Installation” section.


    Typically, your PC''s hard disk is set up as a single large drive, designated
    by drive C:. Unless you can scrounge up a second hard disk for your PC, or you
    already have a second disk, your first task is to divide your one and only hard
    disk to make room for Red Hat Linux.


    There are two ways to repartition your hard disk:


    +   - Destroy the existing partition and create two smaller, new partitions —
    one for Windows and the other for Red Hat Linux. This requires you to back up
    and restore the existing Windows files. This is the hard way to repartition a
    hard disk.

    +   - Use the FIPS (First Nondestructive Interactive Partition Splitting) utility
    program (included on the companion CD-ROMs) to resize the existing partition and
    free up space for a second partition in which you can install Red Hat Linux. FIPS
    cordons off the unused part of a hard disk and makes a new partition out of that
    unused part without destroying any existing data. You can also use a commercial
    disk partitioning software such as PartitionMagic from PowerQuest (http://www.powerquest.com/partitionmagic/index.html).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_39_1.png)


    No matter which approach you take to repartition your hard disk, do not perform
    this step before you back up the current contents of your hard disk. This is to
    ensure that your files are safe, in case something goes wrong with the repartitioning.


    In this section, I show you how to repartition your hard disk using FIPS (the
    easiest way to create a new partition for Red Hat Linux). The idea is to shrink
    the'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'existing DOS partition and create room for the Linux partition. Later on, during
    Red Hat Linux installation, you have to further divide the partition meant for
    Linux into at least two parts: one for the Linux root file system and the other
    for swap space.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_40_0.png)


    Although you have no guarantee that FIPS will split a DOS partition successfully,
    you should consider using it to create room for Red Hat Linux — especially if
    you have a brand-new PC with only DOS and Windows installed on the hard disk.
    In this case, even if something goes wrong with FIPS, you can reinstall Windows
    and the applications.


    The FIPS.EXE program and related files are located in the \DOSUTIL subdirectory
    of the companion CD-ROMs. To use FIPS, follow these steps:


    +   1. For FIPS to work, all used areas of the disk must be contiguous — or at
    least as tightly packed as possible. You can prepare the disk for FIPS by running
    a defragmenter. How you defragment the hard disk depends on your current operating
    system. For example, in Windows 95/98, select Start ⇨ Programs ⇨ Accessories ⇨
    System Tools ⇨ Disk Defragmenter.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_40_1.png)


    You also should check the hard disk for errors by running a program such as Norton
    Disk Doctor in MS-DOS 6.0 or later (in Windows 95/98, use SCANDISK).


    +   2. In MS-DOS 6.0 or later, create a bootable disk using the command FORMAT
    A: /S. In Windows 95/98, create a startup disk by using the Add/Remove Programs
    option in the Control Panel and then following the instructions in the Startup
    Disk tab.


    +   3. Copy the following files from the CD-ROM to the formatted disk. (The following
    example assumes that D: is the CD-ROM drive.)


    ```

    COPY D:\DOSUTILS\FIPS.EXE A:

    COPY D:\DOSUTILS\RESTORRB.EXE A:

    COPY D:\DOSUTILS\FIPSDOCS\ERRORS.TXT A:

    ```


    FIPS.EXE is the program that splits partitions. ERRORS.TXT is a list of FIPS error
    messages. You consult this list for an explanation of any error messages displayed
    by FIPS. RESTORRB.EXE, which is a program that enables you to restore certain
    important parts of your hard disk from a backup of those areas created by FIPS.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '+   4. Leave the bootable disk in the A: drive, and restart the PC. The PC
    boots from A: and displays the A\> prompt.

    +   5. Type **FIPS**. The FIPS program runs and shows you information about your
    hard disk. FIPS gives you an opportunity to save a backup copy of important disk
    areas before proceeding. After that, FIPS displays the first free cylinder where
    the new partition can start (as well as the size of the partition in megabytes).

    +   6. Use the left and right arrow keys to adjust the starting cylinder of the
    new partition (the one that results from splitting the existing partition) to
    change the partition size. Press the right arrow to increase the starting cylinder
    number. This leaves more room in the existing partition and reduces the size of
    the new partition you create. Try to create a new partition that is 1GB or larger.

    +   7. When you are satisfied with the size of the new partition, press Enter.
    FIPS displays the modified partition table and prompts you to enter **C** to continue
    or **R** to reedit the partition table.

    +   8. Press **C** to continue. FIPS displays some information about the disk
    and asks whether you want to write the new partition information to the disk.

    +   9. Press **Y**. FIPS writes the new partition table to the hard disk and then
    exits.

    +   10. Remove the disk from the A: drive and reboot the PC.


    When the system comes up, everything in your hard disk should be intact — but
    the C: drive will be smaller. You have created a new partition from the unused
    parts of the old C: drive.


    You don’t do anything with the newly created partition under DOS. Later, during
    Red Hat Linux installation, you create two or more Linux partitions out of this
    new partition.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_41_0.png)


    # Starting the Red Hat Linux Installation


    To start the Red Hat Linux installation, put the Red Hat boot disk in your PC’s
    A: drive and restart your PC. (In MS-DOS 6.0 or later, press the reset button
    or press Ctrl+Alt+Delete; In Windows 95/98, select Start → Shutdown and then select
    Restart from the dialog box.) Your PC goes through its normal startup sequence,
    such as checking memory and running the ROM BIOS code. Then the PC loads Red Hat
    Linux from the boot disk and begins running the Red Hat installation program.
    The rest of the installation occurs under the control of the installation program.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_42_0.png)


    As you power up or reboot the PC with the Red Hat boot disk, place this book’s
    companion CD-ROMs in the CD-ROM drive. That way the installation program can find
    and use the Red Hat Linux CD-ROMs to start the installation in graphical mode.
    Otherwise the installation program initially will start in text mode and prompt
    for the CD-ROM. Only then it will start the X Window System and switch to a graphical
    installation screen.


    A few moments after you start the boot process, an initial screen appears. The
    screen displays a welcome message and ends with a boot: prompt. The welcome message
    tells you that more information is available by pressing one of the function keys
    F1 through F5.


    If you want to read the help screens, press the function key corresponding to
    the help you want. If you don’t press any keys after a minute, the boot process
    proceeds with the loading of the Linux kernel into the PC’s memory. To start booting
    Red Hat Linux immediately, press Enter. After the Linux kernel loads, it automatically
    starts the Red Hat Linux installation program. This, in turn, starts the X Window
    System, which provides a graphical user interface for the installation.


    If you have all the configuration information (such as video card, monitor, network
    card details, IP addresses, and host names for the TCP/IP network configuration)
    and all goes well, installing Red Hat Linux from the companion CD-ROMs on a fast
    (200MHz or better) Pentium PC should take 30 to 40 minutes. (This is assuming
    that you select nearly all packages.) For example, on a 200MHz Pentium PC with
    64MB RAM and a 1GB-disk partition devoted to Red Hat Linux, the installation takes
    about 35 minutes. On older 486 PCs, the installation process may take somewhat
    longer.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_42_1.png)


    During the installation, the Red Hat installation program probes — attempts to
    determine the presence of — specific hardware and tailors the installation steps
    accordingly. For example, if the installation program detects a network card,
    the program automatically displays the screens in which you can configure the
    TCP/IP network. This means you may see some variation in the sequence of steps
    depending on your specific hardware configuration.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_42_2.png)


    If you run into any problems during the installation, refer to Session 4 to learn
    how to troubleshoot common installation problems.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'As you get ready to install Red Hat Linux, You go through the following steps
    before moving on to disk setup in the next section and the actual installation
    of various packages in Session 3:


    1. Assuming that you already placed this book’s companion CD-ROMs in the CD-ROM
    drive before starting the installation, the installation program starts the X
    Window System and displays a list of languages in a graphical installation screen.
    Use your mouse to select the language you want and then click the Next button
    to proceed to the next step.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_43_0.png)


    In the graphical mode installation, each screen has online help available on the
    left side. You can read the help message to learn more about what you are supposed
    to select in a specific screen.


    2. The installation program displays a list of keyboard types, as shown in Figure
    2-1. Select a keyboard model that closely matches your PC’s keyboard. If you don’t
    see your keyboard model listed, select one of the generic models: Generic 101-key
    PC or Generic 104-key PC. (Newer keyboards with the Windows keys match this model.)
    Next, select a keyboard layout that depends on your language’s character set (for
    example, English in the United States). Finally, select the Enable dead keys option
    if the language you select has special characters that must be composed by pressing
    multiple keys in sequence. For the English language, you can safely select the
    Disable dead keys option.


    3. The installation program displays a screen (see Figure 2-2) from which you
    can configure the mouse in your system. The various mouse types are listed in
    a tree structure organized alphabetically by manufacturer. You need to know your
    mouse type and whether it is connected to the PC’s serial port or the PS/2 port
    (a small round connector). If your mouse type appears in the list, select it.
    Otherwise, select a generic mouse type. Most new PCs have a PS/2 mouse. Finally,
    for a two-button mouse, you should select the Emulate 3 Buttons option. Because
    many X applications assume that you use a 3-button mouse, you should go ahead
    and select this option. On a typical 2-button mouse, you can simulate a middle-button
    click by pressing both buttons simultaneously. On a Microsoft Intellimouse, the
    wheel acts as the middle button.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_44_0.png)


    # Figure 2-1


    Selecting a keyboard type during Red Hat Linux installation


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_44_1.png)


    # Figure 2-2


    Configuring your mouse during Red Hat Linux installation'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'If you select a mouse with a serial interface, you are asked to specify the
    serial port where the mouse is connected. For COM1, specify /dev/ttyS0 as the
    device; for COM2, the device name is /dev/ttyS1.


    +   4. The installation program displays a welcome message that provides some
    helpful information, including a suggestion that you access the online manuals
    at http://www.redhat.com. Click the Next button to proceed to the next step.

    +   5. The installation program displays a screen asking if you want to install
    a new system or upgrade an older Red Hat installation.


    For a new installation, the installation program requires you to select the installation
    type — Workstation, Server, or Custom. The Workstation and Server installations
    simplify the installation process by partitioning the disk in a predefined manner.
    A Workstation-class installation deletes all currently existing Linux-related
    partitions. A Server-class installation deletes all existing disk partitions,
    including any existing Windows partitions. For maximum flexibility (so you can
    specify how the disk is used), select the Custom installation.


    The next major phase of installation involves partitioning the hard disk for use
    in Red Hat Linux.


    # Partitioning the Hard Disk for Red Hat Linux


    Like MS-DOS, Red Hat Linux requires you to partition and prepare a hard disk before
    you can install Red Hat Linux. For a new PC, you usually do not perform this step.
    This is because the vendor normally takes care of preparing the hard disk and
    installing Windows and all other applications on the hard disk. Because you are
    installing Red Hat Linux from scratch, however, you have to perform this crucial
    step yourself. As you see in the following sections, this task is just a matter
    of following instructions.


    The Red Hat Linux installation program runs Disk Druid — a utility program that
    enables you to partition the disk and, at the same time, specify which parts of
    the Linux file system you want to load on which partition.


    Before you begin to use Disk Druid to partition your disk, you need to know how
    to refer to the disk drives and partitions in Linux. Also, you should understand
    the terms mount points and swap partition. In the next three sections, you learn
    these terms and concepts and then proceed to use Disk Druid.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Naming disks and devices


    The first step is to understand how Red Hat Linux refers to the various disks.
    Linux treats all devices as files and has actual files that represent each device.
    In Red Hat Linux, these device files are located in the /dev directory. If you
    are new to UNIX, you may not yet know about UNIX filenames. But you will learn
    more as you continue to use Red Hat Linux. If you know how MS-DOS filenames work,
    you will find that Linux filenames are similar. However, they have two exceptions:
    they do not use drive letters (such as A: and C:) and they substitute the slash
    (/) for the MS-DOS backslash (\) as the separator between directory names.


    Because Linux treats a device as a file in the /dev directory, the hard disk names
    start with /dev. Table 2-1 lists the hard disk and floppy drive names that you
    may have to use.


    Table 2-1

    Hard Disk and Floppy Drive Names


    | Name | Description |

    |------|-------------|

    | /dev/hda | First Integrated Drive Electronics (IDE) hard drive (the C: drive
    in DOS and Windows) |

    | /dev/hdb |  |

    | /dev/sda | First Small Computer System Interface (SCSI) drive |

    | /dev/sdb | Second SCSI drive |

    | /dev/fd0 | First floppy drive (the A: drive in DOS) |

    | /dev/fd1 | Second floppy drive (the B: drive in DOS) |


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_46_0.png)


    When Disk Druid displays the list of partitions, the partition names take the
    form hda1, hda2, and so on. Linux constructs each partition name by appending
    the partition number (1 through 4 for the four primary partitions on a hard disk)
    to the disk''s name. Therefore, if your PC''s single IDE hard drive has two partitions,
    notice that the installation program uses hda1 and hda2 as the names of these
    partitions.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Mounting a file system on a device


    In Red Hat Linux, you use a physical disk partition by associating it with a specific
    part of the file system. This is a hierarchical arrangement of directories — a
    directory tree. If you have more than one disk partition (you may have a second
    disk with a Linux partition), you can use all of them in Red Hat Linux under a
    single directory tree. All you have to do is decide which part of the Linux directory
    tree should be located on each partition — a process known in Linux as mounting
    a file system on a device. (The disk partition is a device.)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_47_0.png)


    The term mount point refers to the directory you associate with a disk partition
    or any other device.


    Suppose that you have two disks on your PC, and you have created Linux partitions
    on both disks. Figure 2-3 illustrates how you can mount different parts of the
    Linux directory tree (the file system) on these two partitions.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_47_1.png)


    Figure 2-3

    An example of mounting the Red Hat Linux file system on two disk partitions


    # Understanding swap partition


    Most advanced operating systems support the concept of virtual memory, in which
    part of your system’s hard disk functions as an extension of the physical memory
    (RAM). When the operating system runs out of physical memory, it can move (or
    swap out) the contents of currently unneeded parts of RAM to make'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'room for a program that needs more memory. When the operating system needs
    to access anything in the swapped-out data, it has to find something else to swap
    out and then it swaps in the required data from disk. This process of swapping
    data back and forth between the RAM and the disk is also known as paging.


    Because the disk is much slower than RAM, the system’s performance is slower when
    the operating system has to perform a lot of paging. However, virtual memory enables
    you to run programs that you otherwise can’t run.


    Red Hat Linux supports virtual memory and can make use of a swap partition. When
    you create the Linux partitions, you should also create a swap partition. With
    the Disk Druid utility program, described in the next section, it is simple to
    create a swap partition. Simply mark a partition type as a swap device and Disk
    Druid performs the necessary tasks.


    # Preparing disk partitions for Red Hat Linux


    After you select Custom installation, a screen prompts you for the method you
    want to use to partition the disk — the choices are the Linux fdisk program or
    Disk Druid. You should select Disk Druid and click the Next button. You should
    then see the Disk Druid screen (as shown in Figure 2-4).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_48_0.png)


    Figure 2-4

    Disk Druid screen from Red Hat Linux installation program'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Disk Druid gathers information about the hard drives on your system and displays
    a list of disk drives in the lower part of the screen and the current partition
    information for one of the drives in the Partitions list in the upper part. For
    each partition, Disk Druid shows five fields:


    +   - **Mount Point** indicates the directory where the partition will be mounted.
    For example, if you have only one partition for the entire Linux file system,
    the mount point will be the root directory (/). For the swap partition, this field
    shows <Swap>. If this field appears as <not set>, you have to specify a mount
    point. To do so, select the partition and click the Edit button.

    +   - **Device** refers to the partition’s device name. For example, hda1 is the
    first partition on the first IDE drive.

    +   - **Requested** field shows how much space the partition has. For example,
    if the partition has 256MB of space, this field appears as 256M.

    +   - **Actual** field shows the amount of disk space the partition is using.
    Usually, the Requested and Actual fields are the same, but they may differ for
    partitions that can grow in size.

    +   - **Type** field shows the partition’s type, such as Linux Native or DOS.


    If there are no partitions defined, the table in the Partitions list is empty.
    You have to add new partitions by clicking the Add button.


    You perform specific disk setup tasks in Disk Druid through the five buttons that
    run across the middle of the screen. Specifically, the buttons perform the following
    actions:


    +   - **Add** enables you to create a new partition, assuming there is enough
    free disk space available. When you click this button, another dialog box appears
    in which you can fill in information necessary to create a partition.

    +   - **Edit** enables you to alter the attributes of the partition currently
    highlighted in the Partitions list. You make changes to the current attribute
    in another dialog box that appears when you click the Edit button.

    +   - **Delete** removes the partition currently highlighted in the Partitions
    list.

    +   - **Reset** causes Disk Druid to ignore any changes that you may have made.

    +   - **Make RAID Device** sets up a RAID (Redundant Array of Inexpensive Disks)
    device — a technique that combines multiple disks to improve reliability and data
    transfer rates. There are several types of RAID configurations. This button is
    active only if your system has the hardware necessary to support a RAID device.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Exactly what you do in Disk Druid depends on the hard drives in your PC and
    the partitions they already have. For this discussion, I assume that you have
    created the necessary hard disk space for Linux using one of the following methods:


    +   - You start with a single hard drive with a single partition (only the C:
    drive in Windows). Then you use FIPS to split that partition into two. (Refer
    to the “Repartitioning Your Hard Drive with FIPS” section.) After partitioning,
    you end up with two DOS partitions.

    +   - Your PC has a single, large hard drive (greater than 2GB) that has two partitions
    (C: and D: drives in Windows). In this case, the second partition has an extended
    partition that contains the logical drive D:. You want to install Red Hat Linux
    on the extended partition that used to be the D: drive in Windows.


    Both of these situations call for the same sequence of steps, as outlined in the
    next two sections.


    # Setting Up the Partitions


    To prepare an existing DOS partition for Linux, you have to perform the following
    steps in Disk Druid:


    +   1. Delete the DOS partition that you want to use for Linux. To do this, select
    the partition (typically the one with Device name hda2) from the Partitions list
    on the Disk Druid screen and then click the Delete button. Before deleting the
    partition, remember to make a note of the partition’s size from the Partitions
    list.

    +   2. Create a new partition for the Linux file system. To do this, press the
    Add button on the Disk Druid screen. You should see a dialog box (refer to Figure
    2-5) where you can fill in / as the mount point and enter the size in megabytes.
    To compute the size, simply subtract the size of the swap space (32MB or the amount
    of RAM in your PC, whichever is more) from the original size of the partition.
    Select the OK button and then press Enter to complete this step and return to
    the Disk Druid screen.

    +   3. Create another new partition and set it as a Linux swap space. To do this,
    click the Add button in the Disk Druid screen (see Figure 2-4). In the dialog
    box (see Figure 2-5), enter the size of the partition. Click the list of partition
    types and use the mouse to select Linux Swap as the type. When you do so, the
    text <Swap Partition> appears in the Mount Point field. Next, click the OK button
    to define the new partition and return to the Disk Druid screen.'
  merge: -1
  img_proc: true
