- pgno: 435
  md: "![](img/eef64cc01382a4448bc55a2ee7dcc4ca_435_0.png)\n\n# 3 BONUS CD-ROMs\n\n\
    +   - Red Hat Linux 7.0\n+   - Includes the Linux Kernel plus Apache, Samba, Netscape,\
    \ GNOME, KDE, and much more\n+   - Plus assessment software to help gauge your\
    \ progress\n\nSystem Requirements:\nLinux-ready PC with CD-Rom and 3.5\" floppy\
    \ drives. See inside for complete requirements.\n\nCategory:\nLinux\n\n# Get up\
    \ to Speed on Red Hat Linux 7—\nin a Weekend!\n\nThe big day is Monday. The day\
    \ you get to show off what you know about Red Hat Linux. The problem is, you're\
    \ not really up to speed. Maybe it's been a while since you worked with Linux.\
    \ Or maybe you just like a challenge. In any event, we've got a solution for you\
    \ — Red Hat Linux 7 Weekend Crash Course™. Open the book Friday evening and on\
    \ Sunday afternoon, after completing 30 fast, focused sessions, you'll be able\
    \ to jump right in and install, use, and manage Red Hat Linux. It's as simple\
    \ as that.\n\n# The Curriculum\n\n+   **FRIDAY**\n+   *Evening: 4 Sessions, 2\
    \ Hours*\n+   - Getting Ready to Install Red Hat Linux\n+   - Making Room for\
    \ Red Hat Linux\n+   - Finishing the Red Hat Linux Installation\n+   - Troubleshooting\
    \ the Red Hat Linux Installation\n+   \n+   **SATURDAY**\n+   *Morning: 6 Sessions,\
    \ 3 Hours*\n+   - Test Driving Red Hat Linux for the First Time\n+   - Exploring\
    \ Linux Files and Directories\n+   - Understanding the Shell\n+   - Learning Linux\
    \ Commands\n+   - Editing Text Files in Red Hat Linux\n+   - Performing Basic\
    \ System Administration Tasks\n+   \n+   **SATURDAY, continued**\n+   *Afternoon:\
    \ 6 Sessions, 3 Hours*\n+   - Using Modems in Red Hat Linux\n+   - Networking\
    \ Your Red Hat Linux PC\n+   - Connecting Your Red Hat Linux PC to the Internet\n\
    +   - Setting Up Internet Services\n+   - Using Red Hat Linux as a Workgroup Server\n\
    +   - Accessing Windows™ and DOS Files from Red Hat Linux\n+   \n+   *Evening:\
    \ 4 Sessions, 2 Hours*\n+   - Customizing the GNOME and KDE Desktops\n+   \n+\
    \   **SUNDAY**\n+   *Morning: 6 Sessions, 3 Hours*\n+   - Configuring the X Window\
    \ System\n+   - Understanding How Red Hat Linux Boots\n+   - Installing Software\
    \ Packages\n+   - Building a New Kernel\n+   - Scheduling Jobs in Red Hat Linux\n\
    +   - Backing Up and Restoring Files\n+   \n+   *Afternoon: 4 Sessions, 2 Hours*\n\
    +   - Building Software Packages from Source Files"
