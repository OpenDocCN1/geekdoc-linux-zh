- pgno: 186
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_186_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_186_1.png)


    # Setting Up Internet Services


    # Session Checklist


    +   - ✓ Understanding Internet services

    +   - ✓ Using the e-mail server

    +   - ✓ Setting up the Apache Web server

    +   - ✓ Setting up the FTP server


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_186_2.png)


    You can use the Red Hat Linux PC as a server if it’s connected to the Internet
    or an intranet (a private TCP/IP network). Both the Internet and intranets rely
    on Internet services. Each Internet service involves configuring and running one
    or more servers on the Red Hat Linux system. This session introduces you to the
    commonly used Internet services. It then focuses on the servers that implement
    the mail, Web, and information retrieval Internet services: the e-mail server,
    the Apache Web server, and the FTP server (which enable anyone to download files
    from your system in a reasonably secure manner).


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_186_3.png)


    You learn about securing your Red Hat Linux system in Session 29.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Understanding Internet Services


    The term Internet service refers to a number of network applications that employ
    a client/server architecture to perform specific tasks. (In the client/server
    architecture, two separate programs — a server that provides information and one
    or more clients that request information — implement a service.)


    Many Internet services are specifically designed to deliver information from one
    system to another. The information may be in the form of mail messages, news items,
    or data files. As a user, you expect to access these common Internet services
    from a typical Internet host:


    +   - *Electronic mail (e-mail)*. From an Internet host, you can send e-mail to
    any other user on the Internet using addresses such as `president@whitehouse.gov`.

    +   - *World Wide Web*. You can use a Web browser to download and view Web pages
    using a Uniform Resource Locator (URL) address such as `http://www.whitehouse.gov`.
    The Web pages are usually documents formatted in Hypertext Markup Language (HTML).

    +   - *Newsgroups*. You can read newsgroups and post news items to newsgroups
    with names such as `comp.os.linux.networking` or `comp.os.linux.setup`.

    +   - *Information retrieval*. You can search for information with tools such
    as the World Wide Web browser. You also can download files with File Transfer
    Protocol (FTP). Reciprocally, users on other systems also can download files from
    your system — typically through a feature known as anonymous FTP.

    +   - *Remote access*. You can use TELNET to log in to another computer (the remote
    computer) on the Internet, assuming that you have a user name and password to
    access that remote computer.


    All Internet services rely on client and server software. For example, an e-mail
    server takes care of transferring mail from one system to another while you read
    e-mail using e-mail client software. Similarly, you use a Web browser client to
    download and view Web pages from a Web server.


    The clients and servers that implement Internet services employ TCP/IP protocols
    to communicate with one other. You’re already familiar with the IP address that
    identifies a host in a TCP/IP network. The IP address alone, however, cannot sufficiently
    distinguish among many services running on the same system. The concept of a port
    number (or, simply, port) is used to enable various Internet servers to communicate
    with clients. The port is not a physical entity — it’s simply a number'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'between 1 and 65,535 that uniquely identifies each end point of a TCP/IP communications
    link between two processes (typically, a server and a client).


    All well known Internet services have preassigned port numbers. For example, here
    are some commonly used Internet protocols and their assigned port numbers:


    +   - *FTP (File Transfer Protocol)* allows transfer of files among computers
    on the Internet. FTP uses two ports — data is transferred on port 20, while control
    information is exchanged on port 21. FTP is the underlying protocol for file transfers.

    +   - *HTTP (Hypertext Transfer Protocol)* is a recent protocol for sending HTML
    documents from one system to another. HTTP is the underlying protocol of the Web.
    By default, the Web server and client communicate on port 80.

    +   - *SMTP (Simple Mail Transfer Protocol)* exchanges e-mail messages among systems.
    SMTP uses port 25 for information exchange. SMTP is the underlying protocol for
    the e-mail service.

    +   - *NNTP (Network News Transfer Protocol)* distributes news articles in a store-and-forward
    fashion across the Internet. NNTP uses port 119. NNTP is the underlying protocol
    for the newsgroups service.

    +   - *TELNET* enables a user on one system to log into another system on the
    Internet. (The user must provide a valid user ID and password to successfully
    log into the remote system.) TELNET uses port 23 by default. However, the TELNET
    client can connect to any specified port. TELNET is the underlying protocol for
    remote access.

    +   - *NFS (Network File System)* shares files among computers. NFS uses Sun’s
    *Remote Procedure Call (RPC)* facility, which exchanges information through port
    111.


    A text configuration file — /etc/services — stores the association between an
    Internet service and a port number (as well as the underlying data communications
    protocol). To see the contents of this file, use the more command as follows:


    ```

    more /etc/services

    ```


    The following is a small subset of entries in the /etc/services file of a Linux
    system:


    ```

    ftp-data    20/tcp

    ftp         21/tcp

    fsp         21/udp        fspd

    ssh         22/tcp        # SSH Remote Login Protocol

    ssh         22/udp        # SSH Remote Login Protocol

    telnet      23/tcp

    # 24 - private

    ```'
  merge: -1
  img_proc: true
- pgno: 189
  md: '```

    smtp              25/tcp            mail

    # 26 - unassigned

    time              37/tcp            timserver

    time              37/udp            timserver

    rlp               39/udp            resource          # resource location

    nameserver        42/tcp            name              # IEN 116

    whois             43/tcp            nickname

    ```


    Each line starts with the name of a service followed by a port number and a data
    communications protocol (tcp or udp). The rest of the line shows another name
    for the service, if any. Anything following the pound sign (#) is taken as a comment.


    Browsing through the entries in the /etc/services file is instructive because
    they show the breadth of networking services available under TCP/IP.


    During Red Hat Linux installation from this book''s companion CD-ROMs, you can
    opt to install the necessary packages for mail, Web, and news. All you need to
    do is select the Mail/WWW/News Tools package group from the installation screen
    that shows the package groups. Mail refers to the e-mail Internet service; WWW
    refers to the World Wide Web Internet service; and News refers to the newsgroups
    Internet service.


    If you install the mail and news software during Red Hat Linux installation, you
    do not have to do much more to begin using the mail, Web, and news services. Otherwise,
    you can use the Red Hat Package Manager (RPM) to install individual packages.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_189_0.png)


    Session 23 describes how to use the rpm program to install new software.


    # Using the E-mail Server


    Electronic mail — e-mail — is one of the most popular services on the Internet.
    E-mail started as a simple mechanism in which messages were copied to a user''s
    mailbox file. That simple mechanism remains in use. In Red Hat Linux, your mail
    messages are stored in the /var/spool/mail directory in a text file with the same
    name as your user name.


    Messages still are addressed to a user name. That means that if John Doe logs
    in with the user name jdoe, e-mail to him is addressed to jdoe. The only other
    piece of information needed to uniquely identify the recipient is the fully qualified
    domain name of the recipient''s system. Thus, if John Doe''s system is named someplace.net,'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'his complete e-mail address is jdoe@someplace.net. Given that address, anyone
    on the Internet can send e-mail to John Doe.


    To set up and use e-mail on your Red Hat Linux PC, you need two types of mail
    software:


    +   - *Mail-user agent* software enables you to read your mail messages, write
    replies, and compose new messages. Typically, the mail-user agent retrieves messages
    from the mail server using POP3 or IMAP4 protocol. POP3 is the Post Office Protocol
    version 3 and IMAP4 is the Internet Message Access Protocol version 4. The Red
    Hat Linux CD-ROMs include several popular mail user agents such as `pine` and
    `elm`.

    +   - *Mail-transport agent* software actually sends and receives mail-message
    text. The exact method used for mail transport depends on the underlying network.
    In TCP/IP networks, the mail-transport agent delivers mail using the Simple Mail
    Transfer Protocol (SMTP). This book’s Red Hat Linux CD-ROMs include `sendmail`,
    a powerful and popular mail-transport agent for TCP/IP networks.


    Most mail-transport agents run as *daemons* — background processes that run as
    long as your system is up. Because you or another user on the system can send
    mail at any time, the transport agent has to be there to deliver the mail to its
    destination. The mail-user agent runs only when the user wants to check mail.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_190_0.png)


    Typically, a mail-transport agent starts after the system boots. The system startup
    files for Red Hat Linux are set up so that the sendmail mail-transport agent starts
    when the Linux system is in multiuser mode. The shell script file `/etc/rc.d/init.d/sendmail`
    starts sendmail.


    Because the system is already set up to start sendmail at boot time, all you have
    to do is use an appropriate sendmail configuration file to get e-mail going on
    your Linux system.


    You cannot send or receive e-mail until the sendmail mail-transport agent is configured
    properly. The sendmail transport agent has the reputation of being a complex,
    but complete, mail-delivery system. If you take a quick look at sendmail’s configuration
    file, `/etc/sendmail.cf`, you can see that sendmail is indeed complex. Luckily,
    you do not have to be an expert on the sendmail configuration file. All you need
    is the predefined configuration files from this book’s companion CD-ROMs.'
  merge: -1
  img_proc: true
- pgno: 191
  md: "![](img/eef64cc01382a4448bc55a2ee7dcc4ca_191_0.png)\n\nIf you install the Mail/WWW/News\
    \ Tools component during Red Hat Linux installation (see Session 3), your system\
    \ should have a working sendmail configuration file — /etc/sendmail.cf. The default\
    \ file assumes an Internet connection and a name server. Provided you have an\
    \ Internet connection, you should be able to send and receive e-mail from your\
    \ Linux PC once you connect it to the Internet. Then you can use a mail-user agent\
    \ such as elm to compose and send mail messages.\n\n# Setting Up the Apache Web\
    \ Server\n\nYou probably already know how it feels to use the Web, but you may\
