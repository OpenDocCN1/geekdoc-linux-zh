    ```


    Another Linux command, mv, moves a file to a new location. The original copy is
    gone, and a new copy appears at the specified destination. You can use mv to rename
    a file. If you want to change the name of today.list to old.list, use the mv command
    as follows:


    ```

    mv today.list old.list

    ```


    On the other hand, you can move the today.list file to a subdirectory named saved
    with this command:


    ```

    mv today.list saved

    ```


    Another common file operation is deleting a file. Use the rm command to delete
    a file named old.list, for example, by typing the following command:


    ```

    rm old.list

    ```


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_103_0.png)


    Be careful with the rm command, particularly when you log in as root. Inadvertently
    deleting important files with rm is very easy.


    In addition to copying, renaming, and deleting files, you may want to view a file’s
    contents. Use the more command to look at a text file one page at a time. To view
    the file /etc/X11/XF86Config-4, for example, use this command:


    ```

    more /etc/X11/XF86Config-4

    ```


    The more command pauses after each page, so you have to press the Spacebar to
    move to the next page. Press Enter to move forward one line at a time in the file.
    To move to the previous page, press b.


    Another useful Linux command for file viewing is less. (The name is a play on
    words because less does more than more.)'
