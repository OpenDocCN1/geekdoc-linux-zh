    \ This may differ on your system.\n+   - The `initrd=/boot/initrd-2.2.16-21.img`\
    \ line specifies a file that contains an initial RAM disk image that serves as\
    \ a file system before the disks are available. You see the `initrd` line only\
    \ if your system has a SCSI adapter and the kernel uses a modular SCSI driver.\
    \ In this case, the kernel uses the RAM disk — a block of memory used as a disk\
    \ — to get started. Then it loads the SCSI driver module and begins using the\
    \ SCSI hard disk. You do not need the `initrd` line if you create a kernel with\
    \ the SCSI adapter support built into the kernel.\n\n![](img/eef64cc01382a4448bc55a2ee7dcc4ca_306_0.png)\n\
    \nOn systems that have an MS-DOS partition, the LILO configuration file can include\
