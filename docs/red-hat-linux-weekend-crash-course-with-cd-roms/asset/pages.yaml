- pgno: 74
  md: '# Configuring Printers


    The Red Hat installation program does not include a printer configuration step.
    However, as long as the Linux kernel can detect your PC''s parallel port, you
    can configure a printer from an X utility program. To see if Red Hat Linux detects
    the parallel port, type dmesg | grep par in a terminal window. Here is a typical
    output from that command:


    ```

    dmesg | grep par

    parport0: PC-style at 0x378 [SPP,PS2]

    parport0: no IEEE-1284 device present.

    lp0: using parport0 (polling)

    ```


    In this case, the first line starts with the word parport0, which is “programmer
    speak” for parallel port zero or the first parallel port. That line essentially
    indicates that the parallel port was detected by the operating system.


    To set up printers, you must be running X. From the graphical login screen, log
    in as root and select Main Menu Programs System Printer Tool from the GNOME desktop.
    (If you are not logged in as root, type su in a terminal window, enter the root
    password, and then type printtool to run the print tool.)


    The main window of the print tool, formally known as Red Hat Linux Print System
    Manager, appears (as shown in Figure 4-3). If you have not installed the IPX/Netware
    Connectivity package group, you see a dialog box with a message informing you
    that a package named ncpfs is not installed and, therefore, you cannot print to
    a Netware printer. You can click the Ignore button to dismiss this dialog box
    and work with the main window of the print tool.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_74_0.png)


    Figure 4-3

    The main window of the print tool enables you to manage the print queue and add
    a new printer'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'You can manage the printer queue and add a new printer through the print tool
    utility. Click the Add button to configure a new printer. The print tool displays
    the Add a Printer Entry dialog box asking you to select the type of printer, as
    shown in Figure 4-4.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_75_0.png)


    Figure 4-4

    Selecting the type of printer


    You can select from five types of printers:


    +   - **Local Printer:** Refers to a printer connected directly to a parallel
    or serial port of the PC where you install Red Hat Linux

    +   - **Remote Unix (lpd) Queue:** Refers to a printer physically connected to
    another Linux system on the local network (lpd refers to the Linux printer daemon
    — the process that manages the printer queue.)

    +   - **SMB/Windows 95/NT Printer:** Refers to a printer connected to another
    PC that is on the local network and that runs the LAN Manager protocol (typically
    used to share resources such as disks and printers among PCs running Windows 95/98
    or Windows NT)

    +   - **NetWare Printer (NCP):** Refers to a printer connected to a Novell Netware
    server on the local area network

    +   - **Direct to port printer:** Refers to a network-connected printer that prints
    data received at a specific TCP/IP port (typically port number 9100)


    You should specify the printer connection that applies to your configuration.
    For this discussion, I assume that you are connecting a printer to the PC’s parallel
    port, which means that you should select the Local Printer button in the Add a
    Printer Entry dialog box. After you select the Local Printer button and click
    OK, the print tool displays a dialog box with information about the detected parallel
    ports.


    Click OK to continue with the printer configuration. Next, the Edit Local Printer
    Entry dialog box prompts for various entries for the local printer (as shown in
    Figure 4-5).'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_76_0.png)


