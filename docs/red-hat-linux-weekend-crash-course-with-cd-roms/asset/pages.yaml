    to run programs automatically at regular intervals.


    14. For example, suppose I want to execute the /usr/local/bin/ppp-off script at
    11:35 P.M., I’d log in as root and type the following commands:

    ```

    at 23:35

    at> /usr/local/bin/ppp-off

    at> (Press Ctrl+D)

    ```


    15. I would first create a shell script with the commands that I want to execute
    periodically. I would then prepare a text file with information about the times
    when I want the shell script executed. Then I’ll submit this file using the crontab
    command.


    16. I would create the /etc/at.allow file with the names of users who are allowed
    to submit one-time jobs. For recurring jobs, I’d create the /etc/cron.allow file
    with the names of the users who are allowed to submit recurring jobs with the
    crontab command.


