- pgno: 340
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_340_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_340_1.png)


    # Monitoring System Performance


    # Session Checklist


    +   - ✓ Using the top utility

    +   - ✓ Using the GNOME System Monitor

    +   - ✓ Using the vmstat utility

    +   - ✓ Checking disk performance and usage with the hdparm program and other
    commands

    +   - ✓ Exploring the /proc file system


    A key system administration task is keeping track of how well your Red Hat Linux
    system performs. You can monitor the overall performance of your Red Hat Linux
    system by gathering information such as: central processing unit (CPU) usage,
    physical memory usage, virtual memory (swap space) usage, and hard disk usage.
    Red Hat Linux comes with a number of utilities that you can use to monitor one
    or more of these performance parameters. This session introduces you to a few
    of these utilities and shows you how to understand the information presented by
    these utilities.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_340_2.png)


    30 Min.

    To Go'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Using the top Utility


    To view the top CPU processes — the ones that use most of the CPU time — you can
    use the top program. To start that program, select Main Menu Programs Utilities
    Top from the GNOME desktop or type top in a terminal window (or text console).
    The top program then displays a text screen listing the current processes, arranged
    in descending order of CPU usage, along with various other information such as
    memory and swap space usage. Figure 28-1 shows a typical output from the top program.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_341_0.png)


    Figure 28-1

    Viewing top CPU processes


    The top utility updates the display every five seconds. You can keep top running
    in a window so that you can continually monitor the status of your Red Hat Linux
    system. You quit top by pressing Ctrl+C or by closing the terminal window.


    The first five lines of the output screen provide summary information about the
    system. Here is what these five lines show:


    +   1. The first line shows the current time, how long the system has been up,
    how many users are logged in, and three load averages (the average number of processes
    ready to run during the last 1, 5, and 15 minutes).

    +   2. The second line lists the total number of processes and the status of these
    processes.

    +   3. The third line shows CPU usage — what percentage of CPU time user processes
    employ, what percentage system (kernel) processes use, and what percentage of
    time the CPU is idle.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '+   4. The fourth line shows how the physical memory is being used — the total
    amount, how much is used, how much is free, how much is shared, and how much is
    allocated to buffers (for reading from disk, for instance).

    +   5. The fifth line shows how the virtual memory (or swap space) is being used
    — the total amount of swap space, how much is used, how much is free, and how
    much is cached.


    In top''s output screen (Figure 28-1), the table below the summary information
    lists information about the current processes, arranged in decreasing order of
    CPU time usage. Type man top in a terminal window to learn the meanings of the
    column headings in the table that top displays.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_342_0.png)


    If the RSS field is drastically smaller than the SIZE field for a process, it
    means that the process employs too little physical memory compared with what it
    needs. This results in a lot of swapping as the process runs. You can use the
    vmstat utility (which you try later in this session) to find out how much your
    system is swapping.


    # Using the GNOME System Monitor


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_342_1.png)


    20 Min.

    To Go


    Like the text-mode top utility, the GNOME System Monitor tool also enables you
    to view the system load in terms of the number of processes that are currently
    running, their memory usage, and the free disk space on your system. To run the
    tool, select Main Menu → Programs → Systems → System Monitor. You can also start
    the tool by typing gtop in a terminal window. The tool starts and displays its
    output in the Processes tab of its main window, as shown in Figure 28-2.


    This output resembles the output you see when you type top in a text-mode console
    or a terminal window. In fact, the column headings in the table match what the
    top utility uses in its output. As with the text-mode top utility, the display
    keeps updating to reflect the current state of the system. You see the current
    processes in descending order of CPU usage.


    The GNOME System Monitor window has two more tabs that display the memory usage
    and the free space on the file system. To view this information, click the appropriate
    tab. For example, to see how various processes are using memory, click the Memory
    Usage tab.


    The bottom of the window shows the CPU usage summary, system up time (how long
    the system has been up and running), and load averages (the average number of
    processes that are ready to run in the last 1, 5, and 15 minutes).'
  merge: -1
  img_proc: true
