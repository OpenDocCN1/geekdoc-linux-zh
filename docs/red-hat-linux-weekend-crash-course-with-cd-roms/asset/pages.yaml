    # Scheduling Jobs in Red Hat Linux


    # Session Checklist


    +   - ✓ Scheduling one-time jobs

    +   - ✓ Scheduling recurring jobs


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_310_2.png)


    30 Min.

    To Go


    As a system administrator, you may need to run some programs automatically at
    regular intervals or execute one or more commands at a specified time in the future.
    Your Red Hat Linux system includes the facilities so you can schedule jobs to
    run at any future date or time you want. You can set up the system to perform
    a task periodically or just once at any future date. Here are some typical tasks
    you can perform by scheduling jobs on your Red Hat Linux system:


    +   - Back up the files in the middle of the night.

    +   - Download large files in the early morning when the system is not busy.

    +   - Send yourself messages as a reminder of meetings.

    +   - Analyze the system logs periodically and look for any abnormal activities.


    You can perform these tasks on a one-time basis with the at command or on a recurring
    basis with the crontab facility of Red Hat Linux. This session introduces you
    to these job-scheduling features of Red Hat Linux.'
