- pgno: 135
  md: '# Table 9-1

    *Commonly Used ed Commands*


    | Command | Meaning |

    |---|---|

    | !command | Executes a shell command (for example, !pwd shows the current directory)
    |

    | $ | Goes to last line in the buffer |

    | % | Applies a command that follows to all lines in the buffer (for example,
    %p prints all lines) |

    | + | Goes to next line |

    | +n | Goes to n-th next line (n is a number) |

    | , | Applies a command that follows to all lines in the buffer (for example,
    ,p prints all lines); similar to % |

    | - | Goes to preceding line |

    | -n | Goes to nth previous line (n is a number) |

    | . | Refers to the current line in the buffer |

    | /text/ | Searches forward for the specified text |

    | ; | Refers to a range of line: current through last line in the buffer |

    | = | Prints line number |

    | ?text? | Searches backward for the specified text |

    | ^ | Goes to the preceding line; also see the - command |

    | ^n | Goes to nth previous line (where n is a number); also see the -n command
    |

    | a | Appends after current line |

    | c | Changes specified lines |

    | d | Deletes specified lines |

    | i | Inserts text before current line |

