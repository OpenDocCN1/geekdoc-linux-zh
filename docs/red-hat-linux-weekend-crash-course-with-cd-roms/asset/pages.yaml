- pgno: 100
  md: 'Now, if you use the pwd command, that command shows /usr/share/doc/bash-2.04
    as the current directory. Therefore, you can refer to a directory''s name in two
    ways:


    +   - An absolute pathname (such as /usr/share/doc) that specifies the exact directory
    in the directory tree

    +   - A relative directory name (such as bash-2.04, which represents the bash-2.04
    subdirectory of the current directory)


    If you type cd bash-2.04 in /usr/share/doc, the current directory changes to /usr/share/doc/bash-2.04.
    However, the same command in /home/naba tries to change the current directory
    to /home/naba/bash-2.04, which probably does not exist. Incidentally, typing the
    cd command without any arguments changes the current directory to your home directory.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_100_0.png)


    You can use a shortcut to refer to any user''s home directory. Prefix a user''s
    login name with a tilde (~) to refer to that user''s home directory. Therefore,
    ~naba refers to the home directory of the user naba and ~root refers to the home
    directory of the root user. If your system has a user with the login name emily,
    you can type cd ~emily to change to Emily''s home directory.


    The directory names . and .. have special meanings. A single period (.) indicates
    the current directory, whereas two periods (..) indicate the parent directory.
    If the current directory is /usr/share/doc, for example, you can change the current
    directory to /usr/share by typing this command:


    ```

    cd ..

    ```


    Essentially, this command takes you up one level in the file system hierarchy.


    # Directory listings and permissions


    As you move around the Linux directories, you may want to know the contents of
    a directory. You can get a directory listing by using the ls command. By default,
    the ls command — without any options — displays the contents of the current directory
    in a compact, multicolumn format. For example, type the following commands to
    see the contents of the /etc/X11 directory. (Type the commands shown in boldface;
    I omitted the command prompts from the listing.)


    ```

    cd /etc/X11

    ls

    ```'
  merge: -1
  img_proc: true
- pgno: 101
  md: '```

    X  XF86Config-4  applnk  gdm  lbxproxy  proxymngr  twm  xinit

    xsm  XF86Config  Xmodmap  fs  kdm  prefdm  restart  xdm  xserver

    ```


    From this listing, you cannot tell really whether an entry is a file or a directory.
    To distinguish the directories from the files, use the -F option with ls as follows:


    ```

    ls -F

    X@      Xmodmap  gdm/      prefdm*   twm/      xserver/

    XF86Config  applnk/  kdm/      proxymngr/  xdm/      xsm/

    XF86Config-4  fs/      lbxproxy/  restart/   xinit/

    ```


    Now the directory names have a slash (/) appended to them. Plain filenames appear
    as is. The at sign (@) appended to the first filename indicates that that file
    is actually a link to another file (in other words, this filename simply refers
    to another file). An asterisk (*) is appended to executable files (for example,
    the prefdm file in the listing).


    You can see even more detailed information about the files and directories with
    the -l option.


    ```

    ls -l

    ```


    For the /etc/X11 directory, a typical output from ls -l looks like the following:


    ```

    total 76

    lrwxrwxrwx 1 root root 24 Jul 31 20:32 X -> /usr/X11R6/bin/XF86_SVGA

    -rw-r--r-- 1 root root 14549 Jul 31 20:59 XF86Config

    -rw-r--r-- 1 root root 1545 Jul 31 20:32 XF86Config-4

    -rw-r--r-- 1 root root 491 Jul 14 14:46 Xmodmap

    drwxr-xr-x 9 root root 4096 Jul 31 15:29 applnk

    ```


    This listing shows considerable information about each directory entry — which
    can be a file or another directory. Looking at a line from the right column to
    the left, you see that the rightmost column shows the name of the directory entry.
    The date and time before the name show when the last modifications to that file
    were made. Before the date and time is the size of the file, in bytes.


    The file’s group and owner appear to the left of the column that shows the file
    size. The next number to the left indicates the number of links to the file. (A
    link is like a shortcut in Windows.) Finally, the leftmost column shows the file’s
    permission settings, which determine who can read, write, or execute the file.
    The first letter of the permission setting has one of the following special meanings:


    +   - If the first letter is l, the file is a symbolic link to another file.

    +   - If the first letter is d, the file is a directory.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '+   - If the first letter is a dash (-), the file is a normal file.

    +   - If the first letter is b, the file represents a block device such as a disk
    drive.

    +   - If the first letter is c, the file represents a character device such as
    a serial port or a terminal.


    After that first letter, the leftmost column shows a sequence of nine characters
    that appears as rwxrwxrwx when each letter is present. Each letter indicates a
    specific permission: read (r), write (w), and execute (x). A hyphen in place of
    a letter indicates no permission for a specific operation on the file. Thus, the
    string rw- means that the owner has read and write permission, but no execute
    permission. Think of these nine letters as three groups of three letters (rwx),
    interpreted as follows:


    +   - The leftmost group of rwx controls the read, write, and execute permission
    of the file’s owner.

    +   - The middle three rwx letters control the read, write, and execute permission
    of any user belonging to that file’s group.

    +   - The rightmost group of rwx letters controls the read, write, and execute
    permission of all other users (collectively referred to as the world).


    Thus, a file with the permission setting rwx------ is accessible only to the file’s
    owner. Meanwhile, the permission setting rwxr--r-- makes the file readable by
    the world.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_102_0.png)


    Typically, executable programs (including shell programs) have execute permission.
    However, for directories, the execute permission is equivalent to a use permission
    — a user must have execute permission on a directory to open and read the contents
    of the directory.


    An interesting feature of the ls command is the fact that it does not list any
    file whose name begins with a period. To see these files, you must use the ls
    command with the -a option as follows:


    ```

    ls -a

    ```


    # File manipulation


