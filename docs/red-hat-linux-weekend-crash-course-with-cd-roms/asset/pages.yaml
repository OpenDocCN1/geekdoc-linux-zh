  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_339_0.png)


    5. Read any other documentation that comes with the software to learn how to use
    the software and determine whether you must configure the software further before
    using it.


    # REVIEW


    This session showed you how to download and unpack open source software distributed
    in compressed tar archives. Using the X Multimedia System (XMMS) package as an
    example, you learned to build the software and install it.


