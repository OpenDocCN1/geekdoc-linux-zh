    # Using IP Masquerading to Share an Internet Connection


    Linux supports a feature called IP masquerading that enables you to connect an
    Ethernet LAN with a private IP address to the Internet. This occurs through a
    Linux PC (with an officially assigned IP address) that has a connection to the
    Internet. The Linux PC may be connected to the Internet by dial-up PPP or some
    other connection such as DSL or cable modem.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'With IP masquerading enabled, your Red Hat Linux PC acts as a stand-in for
    any of the other systems on the Ethernet LAN. As with the router setup, the Red
    Hat Linux PC is designated as the gateway for the Ethernet LAN. However, masquerading
    involves more than simply forwarding IP packets back and forth between the LAN
    and the Internet.


    When the Red Hat Linux PC masquerades as another system on the LAN, it modifies
    outgoing packets so that they always appear to originate from the Red Hat Linux
    PC. When a response to one of the outgoing packets is received, the Red Hat Linux
    PC performs the reverse task — it modifies the packets so that they appear to
    come from the Internet directly to the system that sends the outgoing packet.
    The end result is that each system on the Ethernet LAN appears to have full access
    to the Internet, even though the Ethernet LAN uses a non-unique private IP address.


    To enable and use IP masquerading, perform the following steps:


    +   1. Make sure that the Linux kernel — the core operating system — supports
    IP firewall chains. This should be true for the version of Red Hat Linux you install
    from the companion CD-ROMs. If the file `/proc/net/ip_fwchains` exists, then the
    kernel supports IP firewall chains. (Type `ls /proc/net/ip_fwchains` to verify
    that the file exists.)

    +   2. Make sure the Red Hat Linux PC has an Internet connection and a network
    connection to your LAN. Typically, the Linux PC has two network interfaces — an
    Ethernet card for the LAN and a dial-up PPP connection to the Internet (through
    an ISP).

    +   3. Make sure that all other systems on your LAN use the Linux PC as the default
    gateway for TCP/IP networking. Use the same ISP-provided DNS addresses on all
    systems.

    +   4. Enable IP forwarding in the kernel by typing the following command:

    +   `echo "1" > /proc/sys/net/ipv4/ip_forward`

    +   This is necessary because IP forwarding is disabled by default. To ensure
    that IP forwarding is enabled when you reboot your system, place this command
    in the `/etc/rc.d/rc.local` file. In Red Hat Linux, you can achieve the same result
    by changing the line `FORWARD_IPV4=false` to `FORWARD_IPV4=true` in the `/etc/sysconfig/network`
    file.

    +   5. Run `/sbin/ipchains` — the IPCHAINS firewall administration program — to
    set up the rules that enable the Linux PC to masquerade for your LAN. For example,
    to enable masquerading for a LAN via the Linux PC''s `ppp0` network interface,
    you can use the following commands:

    +   `/sbin/ipchains -P forward DENY`

    +   `/sbin/ipchains -A forward -i ppp0 -j MASQ`'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'If you want the IP masquerading set up at system startup, you should place
    these commands in the /etc/rc.d/rc.local file.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_185_0.png)


    You may find IP masquerading a convenient way to provide Internet access to a
    small LAN (for example, a LAN at home or in the office). At home, I use IP masquerading
    to connect an Ethernet LAN to the Internet through a Linux system. The Linux PC
    has an Ethernet card for the LAN connection and a modem to connect to the Internet
    via an ISP. (I have a valid IP address from the ISP.) With IP masquerading on
    the Linux PC, everyone in your family or small business now can access the Internet
    from any of the other PCs on the LAN.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_185_1.png)


    # REVIEW


    This session introduced you to dial-up networking — establishing a network connection
    between your Linux PC and the Internet through a dial-up modem. You learned to
    use the Red Hat Dialup Configuration Tool to set up a PPP connection. Finally,
    this session showed you how to share a single Internet connection using the IP
    masquerading feature of the IPCHAINS firewall administration program.


    # QUIZ YOURSELF


    +   1. What are dial-up networking and PPP? (See “Learning the Basics of Dial-up
    Networking”.)

    +   2. What information does an ISP typically provide for you to set up dial-up
    PPP connections? (See “Connecting to the Internet Using PPP”.)

    +   3. What tool do you use to set up a PPP connection? (See “Connecting to the
    Internet Using PPP”.)

    +   4. What commands would you type to turn the PPP connection on and off? (See
    “Turning the PPP Connection On or Off”.)

    +   5. What is IP masquerading? (See “Using IP Masquerading to Share an Internet
    Connection”.)'
