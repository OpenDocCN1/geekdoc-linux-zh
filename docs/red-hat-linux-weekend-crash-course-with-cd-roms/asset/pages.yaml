- pgno: 222
  md: '# SESSION


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_222_0.png)


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_222_1.png)


    # Customizing the GNOME and KDE Desktops


    # Session Checklist


    +   ✓ Customizing the GNOME desktop

    +   ✓ Changing the default desktop

    +   ✓ Customizing the KDE desktop


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_222_2.png)


    This evening, I focus on using the GNOME and KDE graphical desktops and some of
    the applications and utilities that come bundled with Red Hat Linux. This session
    shows you how to customize the GNOME and KDE desktops. You also learn how to switch
    your default desktop from GNOME to KDE and vice versa.


    # Customizing the GNOME Desktop


    As Session 5 discusses, the default look and feel of the GNOME graphical desktop
    is similar to that of Windows 95/98/NT/2000, and you do not really have to customize
    anything to begin using Red Hat Linux. However, if you want, you can customize
    the GNOME desktop just as you can customize Windows 95/98/NT/2000. For example,
    you can select a different background or change the appearance of the window borders.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'To try your hands at customizing the GNOME desktop, log in from the graphical
    login screen. I assume that GNOME is your default desktop environment because
    that''s what you usually get when you install Red Hat Linux. Later in this session,
    you learn how to switch the default desktop from GNOME to KDE and vice versa.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_223_0.png)


    If GNOME is not your default desktop, simply select Session ↪ GNOME from the login
    window and then enter your user name and password.


    You can configure most aspects of the GNOME desktop''s look and feel — the appearance
    and behavior — from a graphical application called the GNOME Control Center. To
    launch the Control Center, select Main menu ↪ Programs ↪ Settings ↪ GNOME Control
    Center or click the toolbox icon in the GNOME panel.


    The GNOME Control Center''s window is vertically divided into two parts — a narrower
    menu area on the left side and a larger workspace on the right side. The left
    side shows a tree menu of all the configuration items (also known as capplets).
    The top-level menu items are organized into several categories, such as Desktop
    and Multimedia. You can click a category to see its subcategories. To configure
    an item, locate the item in the tree menu and click that item. The selected capplet''s
    user interface then appears in the workspace on the right-hand aside. The user
    interface is usually a dialog box with settings you can change.


    In the next sections, you try out a few customization steps with the Control Center.
    After you are finished using the Control Center, select File ↪ Exit to quit.


    # Changing the background


    To try a simple customization, select Desktop ↪ Background from the tree menu.
    The GNOME Control Center then runs the background properties capplet that, in
    turn, displays a dialog box in the workspace (as shown in Figure 17-1).


    As you can see, this dialog box looks similar to the Display Properties dialog
    box in Windows 95/98/NT. It enables you to select a background of solid color
    or pick the wallpaper (an image used as the background). You can select a background
    of solid color or a color gradient in which the background starts with one color
    and gradually changes to another color. The gradient can start in the vertical
    direction (top to bottom) or horizontal (left to right).


    Go ahead and click the Gradient button and see what happens. You get to preview
    the changes in the image of a monitor that appears in the dialog box.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_224_0.png)


    # Figure 17-1


    Customizing GNOME desktop''s background using the GNOME Control Center


    To select new colors for Primary Color or Secondary Color (see Figure 17-1), click
    the button that displays the color (either Primary Color or Secondary Color).
    This brings up a color selection dialog box from which you can pick a color.


    If you want to use an image as the wallpaper, click the Browse button in the Wallpaper
    section of the dialog box. A Wallpaper selection dialog box displays the contents
    of the /usr/share/pixmaps/redhat directory — where you can find some background
    images to select. You can also try the /usr/share/pixmaps/backgrounds directory
    for more background images. Try, for example, the /usr/share/pixmaps/backgrounds/space
    directory that has a collection of images of the earth as seen from space. You
    can select any JPEG or PNG format image file as the wallpaper.


    To try out any of these changes on the desktop, click the Try button. You can
    revert to the original setting by clicking the Revert button. When you are finished
    making the changes, click the OK button to close the dialog box and apply the
    changes.


    # Selecting a theme


    Another more exciting customization is to select a new theme for the entire user
    interface. A theme refers to a consistent collection of appearance and behavior'
  merge: -1
  img_proc: true
- pgno: 225
  md: '(look and feel) for all the user interface components such as buttons, checkboxes,
    scrollbars, and so on. To try out some new themes, select Desktop ⇨ Theme Selector
    from the tree menu. From the theme selector dialog box, you can try out different
    themes and select one that you like. When you select a theme, you can see its
    appearance in the preview area. For example, select the MockMack theme from the
    list of available themes and then click the Try button. It causes the look and
    feel of the GNOME desktop, including the Control Center window, to resemble that
    of the Apple Macintosh.


    If you like a theme, click the OK button to use that theme. Otherwise, click the
    Revert button to return to the default theme.


    # Customizing the window manager


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_225_0.png)


    GNOME does not depend on any one window manager. The default window manager is
    called Sawfish, but you can select another window manager if you want. To choose
    a window manager, select Desktop ⇨ Window Manager from the Control Center tree
    menu. You should see a list of window managers available on your system, as shown
    in Figure 17-2.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_225_1.png)


    Figure 17-2

    Selecting or customizing a window manager'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'In this case, the list shows two window managers: Sawfish and twm. As you can
    see, the parenthetical note shows that Sawfish is the current window manager.
    If you want, you can try out the twm window manager by selecting that window manager
    and then clicking the Try button. Later on, click Revert to return to the Sawfish
    window manager.


    Like any window manager, Sawfish adds the title bar, frame, and other decorations
    around each window so users can click and drag to change a window''s location
    or alter its size. (Think for a moment; if there was no frame and title bar, you
    could not move or resize the window.)


    Sawfish includes a configuration tool for changing the look and feel of the window
    frames and title bars. You can activate the configuration tool by clicking the
    button labeled Run Configuration Tool for Sawfish (see Figure 17-2). This brings
    up the Sawfish configurator, which provides a tree menu of configuration options.
    Through this menu, the Sawfish configurator enables you to change how the Sawfish
    window manager decorates windows, adds special visual effects and sound, and behaves
    in response to mouse clicks and keystrokes. You can try out some of the configuration
    items in the Sawfish configurator.


    # Changing the Default Desktop


    GNOME and KDE are both capable graphical desktop environments. Red Hat Linux comes
    with both of these GUIs, but you get GNOME as the default desktop. Just before
    you log in at the graphical login screen, you can always select a specific desktop
    from the Session menu of the login window. However, Red Hat also includes a Desktop
    Switcher utility that enables you to easily switch the default desktop from GNOME
    to KDE and vice versa. To switch from GNOME to KDE, follow these steps:


    +   1. From your GNOME desktop, select the Main menu (foot) ⇨ Programs ⇨ System
    ⇨ Desktop Switching Tool. The Desktop Switcher dialog box appears.

    +   2. In the Desktop Switcher dialog box, click the KDE radio button to select
    it. Then click the OK button. Another dialog box appears.

    +   3. A message in the new dialog box informs you that the desktop configuration
    has been changed, but you must restart X. Click the OK button to dismiss the dialog
    box.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_226_0.png)'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Although the message in Step 3 says you must restart X, all you need to do
    is log out of the session and log back in. To log out, select Main menu ↩ Log
    out. When you log in again, you should get the KDE desktop.


    To switch the default desktop from KDE to GNOME, log in as root and select K ↩
    Red Hat ↩ System ↩ Desktop Switching Tool from the KDE desktop. In the Desktop
    Switcher dialog box, select GNOME as the desktop. After you log out of KDE and
    log back in, you should get GNOME as your desktop.


    # Customizing the KDE Desktop


    Now that you know how to change your desktop from GNOME to KDE and vice versa,
    select the KDE desktop and log in as a user. Like GNOME, KDE also includes a graphical
    application called the KDE Control Center that you can use to customize various
    aspects of KDE, including the desktop background, icons, and font. To start the
    KDE Control Center, select K ↩ KDE Control Center; or from the panel, click the
    button with the icon of a circuit board and a monitor.


    When the KDE Control Center starts, it displays the main window with a tree menu
    on the left and some summary information about your system in the workspace to
    the right.


    The KDE Control Center’s tree menu shows the items that you can control with this
    tool. The tree menu is organized into eight categories that include Applications,
    Desktop, Information, Input Devices, Keyboard Shortcuts, Network, Sound, and Window
    Behavior. Click the plus sign to the left of an item to view the subcategories
    for that item. To change an item, go through the tree menu to locate the item
    and then click it. That item’s configuration options then appear in a tab dialog
    box on the right side of the window.


    # Changing the background and theme


    To customize the desktop background, select Desktop ↩ Background on the tree menu.
    The Background tab appears (see Figure 17-3) with options for customizing the
    desktop’s background.


    For the current desktop (labeled One) you can select either a one or two color
    background or wallpaper (an image used as a background). For example, if you want
    to use wallpaper as your background, click the Browse button. This brings up'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'an Open dialog box showing the JPEG files in the /usr/share/wallpapers directory.
    You can select one of these images and click OK. Then click the Apply button in
    the KDE Control Center to apply this wallpaper to the desktop. If you like the
    appearance, click OK. Otherwise, click Default and then Apply again to revert
    to the original background.


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_228_0.png)


    # Figure 17-3


    Customizing the desktop background with KDE Control Center


    As you can see from the menu items in the Desktop category (Figure 17-3), you
    can customize a number of aspects of the background from borders and colors to
    language for menus. I won’t go through all the items here, but you should experiment
    with some of these customizations. For example, you can select the Theme Manager
    to try out one of several themes much like the themes offered in the GNOME Control
    Center. Figure 17-4 shows the result of selecting and previewing a theme.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/eef64cc01382a4448bc55a2ee7dcc4ca_229_0.png)


    Figure 17-4

    Selecting and previewing a theme in KDE Control Center


    # Selecting a color scheme


    If you want to pick a color scheme for the desktop colors, much like the color
    schemes in Windows 95/98/NT/2000, select Desktop → Colors in the KDE Control Center’s
    tree menu. The Colors tab then appears. You can then scroll down the list of color
    schemes and select one to preview. When you select a color scheme, the preview
    area in the tab shows how that color scheme looks. To apply a color scheme to
    the desktop, click the Apply button. If you don’t like the scheme, click Default
    and then Apply again to revert to the default color scheme.


    # Performing other tasks


    ![](img/eef64cc01382a4448bc55a2ee7dcc4ca_229_1.png)


    Done!


    In addition to desktop customization, the Information item in the KDE Control
    Center enables you to perform many more tasks, such as associating sound files
    with events (such as opening or closing a window), defining keyboard shortcuts,
    and viewing information about your system. You should take the remaining time
    in this session to explore the other items in the tree menu of the KDE Control
    Center.'
  merge: -1
  img_proc: true
