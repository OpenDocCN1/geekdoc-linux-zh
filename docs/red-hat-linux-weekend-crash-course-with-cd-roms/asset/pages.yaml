- pgno: 8
  md: '# About the Author


    **Naba Barkakati** is an expert programmer and successful computer-book author
    who has experience in a wide variety of systems, ranging from MS-DOS and Windows
    to UNIX and the X Window System. He bought his first personal computer — an IBM
    PC-AT — in 1984 after graduating with a Ph.D. in electrical engineering from the
    University of Maryland. While pursuing a full-time career in engineering, Naba
    dreamed of writing software for the emerging PC software market. As luck would
    have it, instead of building a software empire like Microsoft, he ended up writing
    successful computer books.


    Over the past 12 years, Naba has written 25 computer books on a number of topics
    ranging from C++ programming to Linux. He has authored several best-selling titles,
    such as *The Waite Group''s Turbo C++ Bible*, *Object-Oriented Programming in
    C++*, *X Window System Programming*, *Visual C++ Developer''s Guide*, and *Borland
    C++ 4 Developer''s Guide*. His books have been translated into many languages,
    including Spanish, French, German, Polish, Greek, Italian, Chinese, Japanese,
    and Korean. Naba''s most recent book is the best-selling *Red Hat Linux Secrets,
    3rd Edition*, also published by IDG Books.


    Naba lives in North Potomac, Maryland, with his wife Leha and their children Ivy,
    Emily, and Ashley.'
  merge: -1
  img_proc: true
