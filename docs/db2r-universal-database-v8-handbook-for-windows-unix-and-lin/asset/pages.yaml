    # Colocated Joins


    Colocated joins are used by DB2 whenever possible so that data does not have to
    be shipped from partition to partition. Collocation between two joining tables
    means the matching rows of the two tables always in the same database partition.
    If data is not colocated, DB2 has to move data through the network, whether over
    the SP switch or through an Ethernet or similar network. Since network transfer
    speeds are relatively slow, this results in poor performance.


    Colocated joins can be used if the tables involved meet the following rules (for
    tables in multi-partition database groups):


    +   - The tables must reside in the same database partition group


    The following rules apply to both single and multipartition database partition
    groups:


    +   - The database partition groups of both tables must have the same partitioning
    map.

    - Corresponding partitioning key columns must be partition compatible (the same
    or similar base data type).

    - The partitioning key from both tables must have the number of columns.


    In Figure 13.10 we see that when tables T1 and T2 are joined, the rows from both
    tables reside in the same database partition and therefore can be joined without
    having to send the data between database partitions.


    ![](img/961b0d3b0e157406ef7a293880ab928e_326_1.png)


    Figure 13.10

    Colocated join example.'
  merge: -1
