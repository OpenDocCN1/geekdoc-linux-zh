    # SQL Explain Tools


    There are several SQL tools available for use in evaluating access plans. You
    can use the SQL explain tool of your choice to evaluate access plans in conjunction
    with Design Advisor.


    SQL explain tools provided by DB2 UDB v8 are:


    +   - dynexpln—Can be used from a command line to explain dynamic SQL statements.

    - db2explain—Can be used from a command line to explain both static and dynamic
    SQL.

    - db2exfmnt—Can be used from a command line to format the contents of the explain
    tables.

    - DB2 Visual Explain—Visual Explain can analyze both static and dynamic SQL statements
    and presents the results graphically. Refer to Figure 12.3 for an example of DB2
    Visual Explain output.


    Irrespective of the explain tool used, you will want to use the output to refine
    the access plan of interest. DB2 tools display such items as the indexes being
    used, join methods used, timers, index table statistics, order of operations,
    number and type of sort operations being


