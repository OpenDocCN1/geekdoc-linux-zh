  md: '# InfiniBand Comes to the Rescue


    InfiniBand Architecture (IBA) is promulgated by the InfiniBand Trade Association
    (IBTA). IBTA, formed in August 1999, is an outgrowth of the Intel/Microsoft-led
    NGIO, IBM, COMPAQ, and SUN FUTURE effort. InfiniBand is an industry standard,
    channel-based, switched fabric interconnect architecture for servers.


    InfiniBand is not a replacement for the PCI or PCI Express local bus. Inside,
    it is a new IO fabric for servers within a data center where PCI is a point-to-point
    architecture.


    IBA is an emerging technology that defines a whole new I/O paradigm and way for
    I/O to take place. Instead of being bus-based like PCI, IBA is point to point,
    avoids bus arbitration, and overcomes PCI local bus limitations by using an interface
    to communicate with CPUs messages (commands and data), which do not involve memory
    operations and associated CPU overhead. In fact, one IBM test without IBA drove
    CPU to 100%. The same test using IBA drove the CPU to 15%. A significant reduction!


    See Figure 6.10 for a high-level view of the IBA.


    ![](img/961b0d3b0e157406ef7a293880ab928e_119_0.png)


    **Figure 6.10** IBA high-level overview. (With permission of InfiniBand Trade
    Association)'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Keeping a Map of Your Database


    IBA can be thought of as existing outside the server, unlike PCI, which is a local,
    in-the-box interconnect.


    The name InfiniBand means “infinite bands,” which describes the high degree of
    scalability built into InfiniBand. It can scale to thousands of devices with parallel
    communications between each node.


    > NOTE

    DB2 v8 is the first Relational Database Management System (RDBMS) to provide built-in
    support for InfiniBand.


    IBA consists of four main types of devices: Host Channel Adapters (HCAs), Target
    Channel Adapters (TCAs), switches, and routers. See Figure 6.11 which is an example
    of the main devices making up the InfiniBand fabric.


    ![](img/961b0d3b0e157406ef7a293880ab928e_120_0.png)


    Figure 6.11 InfiniBand component close-up. (Used with permission of InfiniBand
    Trade Association)


    Figure 6.11 lists the primary components of IBA. These components and their functions
    are as follows:


    +   - **Host Channel Adapter (HCA).** HCAs are the interface to the CPU through
    messaging semantics (for legacy systems, this is a PCI adapter). As part of the
    InfiniBand fabric, HCAs manage connections between links.

    - **Target Channel Adapter(TCA).** TCAs are simple devices that deliver requested
    data. A TCA can be a disk interface to a physical hard drive that replaces SCSI
    or FC interfaces.

    - **InfiniBand Switch.**The InfiniBand switch links multiple HCAs and TCAs together
    to form a network. These switches can manage translation and bandwidth and are
    the'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'backbone of the InfiniBand fabric. They allow the integration of existing network
    or I/O components for a smooth migration path and integration and interoperability
    with existing systems.


    +   - **Router.** The IBA router enables interfacing with other networks and for
    the translation of legacy components and networks.


    > NOTE

    The smallest complete IBA unit is a subnet. Multiple subnets joined by routers
    create large IBA networks. HCAs and TCAs are endnodes in the fabric that send
    messages over links to other endnodes.


    And finally, each subnet has a subnet manager that performs routing and subnet
    discovery.


    # IBA Link Speeds


    IBA links come in the following speeds:


    +   - 1x—500 MB/sec. (full duplex)

    - 4x—2 GB/sec. (full duplex)

    - 12x—6 GB/sec. (full duplex)


    Of course, it is so exciting about IBA are the data transfer speeds. The throughput
    of the 12x link is 50 times higher than the theoretical limit of Gigabit Ethernet.


    While InfiniBand offers significant performance benefits through increased I/O
    bandwidth, the industry has been hesitant to replace PCI and thus PCI-Express
    and PCI-X have been developed. There is an emerging interest in Remote Direct
    Memory Access (RDMA) which offers a partial solution to the I/O bottleneck. RDMA
    enables remote processes to transfer data directly to host process with minimal
    demands on the memory bus and CPU. Refer to the Remote Direct Memory Access Consortium
    at www.RDMACConsortium.org for additional details.


