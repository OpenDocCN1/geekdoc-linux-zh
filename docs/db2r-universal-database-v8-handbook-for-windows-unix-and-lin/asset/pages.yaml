    # LOCK WITH FORCE


    The utility acquired various locks, including table locks, in the process of loading.
    Rather than wait, and possibly timeout, when acquiring a lock, this option allows
    the load to force off other applications that hold conflicting locks. Forced applications
    will roll back and release the locks the load utility needs. The load utility
    can then proceed. This requires the same authority as the FORCE applications command
    (SYSADM or SYSCTRL).


    > NOTE

    The new LOCK WITH FORCE option enables a load utility to force applications holding
    locks that are preventing a load from completing.


    ALLOW NO ACCESS loads force applications holding conflicting locks at the start
    of the load operation. At the start of the load the utility may force applications
    that are attempting to either query or modify the table.


    ALLOW READ ACCESS loads force applications holding conflicting locks at the start
    or end of the load operation. At the start of the load the utility may force applications
    that are attempting to modify the table. At the end of the load the utility may
    force applications that are attempting to either query or modify the table.


