  md: '# Call to OS from DB2


    Kernel Interrupt Handler

    Request sent over internal BUS to SCSI adapter

    Adapter sends I/O request to actual disk device (SCSI CMD)

    Device receives I/O request

    Device checks buffer

    In most cases device has to do a SEEK to retrieve the data

    Device disconnects from bus while SEEK performed

    Device reconnects to bus after SEEK completes

    Data is transferred to OS using DMA

    OS notifies DB2 and returns the data

    DB2 receives the data and moves it to buffer pool

    DB2 makes data available to DB2 application


    ![](img/961b0d3b0e157406ef7a293880ab928e_105_0.png)


    # Figure 6.2 The life of an I/O.


    In 6.2, DB2 issues a call (I/O request) to the OS. The OS Kernel routine passes
    the request to either the OS file system, or in the case of DBMS devices, directly
    to the SCSI device driver. The SCSI device driver sends the appropriate SCSI command
    to the target device. The target device receives the request and immediately checks
    its internal buffers for the data; if not found, the device must perform a disk
    seek operation to retrieve the requested data. The device issues the request and
    disconnects from the bus to wait for the seek to complete. In the meantime another
    request can be sent by the adapter over the bus to a different device. The second
    disk device receives the request, checks its own buffer, and starts to retrieve
    the data and disconnect from the bus. In the meantime, the seek to the first device
    completes and this device gains control of the bus and transfers the data. The
    I/O operation is thus complete.


    It is important to note that Figure 6.2 illustrates a single request; however
    the process works the same for multiple requests. Multiple requests can be processed
    if containers are on separate physical disks. DB2 will use a separate prefetcher
    container.


    In that case, while the first disk is seeking and has given control of the bus,
    the next request from the queue is processed, for example, to Disk2. Disk2 checks
    its buffer and has to do a seek, causing it to give up control of the bus. Meanwhile,
    the I/O on Disk1 completes so Disk1 can transfer the data while Disk2 seeks, and
    so on. See Figure 6.3 for a sample tablespace layout.


    In the example, three physical disks enable multiple disk seek operations to occur.
    And, having the data spread over three host adapters ensures that required throughput
    and high availability can be attained. These disks are configured in a RAID-1
    configuration. However, the second copy of the data is not shown. In the next
    section, we show an example that illustrates how to design and configure tablespaces
    in a RAID-5 ESS environment.'
