  md: '# CHAPTER 4


    # # Application Development


    B2 v8 is rich in application development features. The new Development Center
    makes it easy for developers to use their development tool of choice. Important
    changes to various drivers have resulted in improved performance for client applications.
    XML enhancements enable DB2 to act as both a provider and a consumer of Web services.
    SQL enhancements such as INSERT through UNION VIEWS, INSTEAD OF TRIGGERS, ORDER
    BY, and FETCH FIRST in subqueries will enable substantial productivity improvements
    for application developers. New plug-ins for the Websphere Studio integrated development
