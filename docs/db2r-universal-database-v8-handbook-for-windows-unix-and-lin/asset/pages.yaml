    # MONITORING BUFFERPOOL PERFORMANCE


    # Monitor Switches


    In order to obtain DB2 bufferpool performance data, the BUFFERPOOL monitor switch
    must be turned ON. To check the status of the DB2 monitor switches, use the command:


    ```

    GET MONITOR SWITCHES;

    ```


    To turn the bufferpool monitor switch on, use the command:


    ```

    update monitor switches using bufferpool ON;

    ```


    The command above will turn the bufferpool monitor switch on for the current connection
    to DB2. To have buffer monitor performance information available for all connections
    at times, update the database manager configuration and set the default monitor
    switch to ON using the command:


    ```

    Update dbm cfg using dft_mon_bufferpool ON;

    ```


    # Snapshot Commands


    Once the bufferpool monitor switch has been turned on, bufferpool performance
    information can be obtained by issuing DB2 Snapshot commands. Snapshots for DATABASE,
    BUFFERpools, and TABLESPACES provide bufferpool performance information that is
    aggregated to the named level, with DATABASE snapshots providing summaries of
    all bufferpools, BUFFERpools snapshot providing summaries for each bufferpool,
    and TABLESPACES snapshots providing the greatest level of detail for I/O performance
    at the tablespace level.


    To get bufferpool performance summarized at the overall database level, issue
    the command:


    ```

    GET SNAPSHOT FOR DATABASE ON DBNAME;

    ```


    To obtain bufferpool performance for each bufferpool individually, issue the command:


    ```

    GET SNAPSHOT FOR BUFFERpools ON DBNAME;

    ```


    See Example 8.1 for sample output from a "get snapshot for bufferpools" command,


    To obtain bufferpool performance I/O details for each tablespace individually,
    issue the command:


    ```

    GET SNAPSHOT FOR TABLESPACES ON DBNAME;

    ```


    See Example 8.2 for sample output from a "get snapshot for tablespaces" command.'
