  md: '# CHAPTER 2


    # DB2 v8 Product Overview and Architecture


    With the release of v8, IBM continues to refine and improve the DB2 Architecture.
    IBM continues to integrate new patented technology, such as Multidimensional Clustering
    (MDC), and XML and Web Services into the DB2 engine. (MDC is covered in detail
    in Chapter 5.) The DB2 v8 architecture is fully capable of providing complete
    availability through the introduction of MDC, online reorganization, infinite
    logging, dynamic configuration parameters, and online index reorganization.


    DB2 can now be found in small businesses with just a few employees and in Fortune
    500 companies running mission-critical applications. As is typical with any software
    product, IBM has changed the name of various DB2 product offerings to be more
    in keeping with the way they are used and with the value provided to the enterprise.
