- img_proc: true
  md: '# Reorganizing Indexes/Tables


    Use the ALLOW READ ACCESS or ALLOW WRITE ACCESS option to allow other transactions
    either read-only or read-write access to the table while the indexes are being
    reorganized.


    > NOTE

    While ALLOW READ ACCESS and ALLOW WRITE ACCESS allow access to the table, during
    the period in which the reorganized copies of the indexes are made available,
    no access to the table is allowed.


    TABLE table-name

    Specifies the table to reorganize. The table can be in a local or a remote database.
    The name or alias in form schema.table-name may be used. The schema is the user
    name under which the table was created. If you omit the schema name, the default
    schema is assumed. For typed tables, the specified table name must be the name
    of the hierarchy''s root table.


    > NOTE

    You cannot specify an index for the reorganization of a multidimensional clustering
    (MDC) table.


    > NOTE

    In-place reorganization of tables cannot be used for MDC tables.


    INDEX index-name

    Specifies the index to use when reorganizing the table. If you do not specify
    the fully qualified name in the form schema.index-name, the default schema is
    assumed. The schema is the user name under which the index was created. The database
    manager uses the index to physically reorder the records in the table it is reorganizing.


    > NOTE

    For an inplace table reorganization, if a clustering index is defined on the table
    and index is specified, it must be the clustering index.


    The inplace option is not specified, any index specified will be used. If you
    do not specify the name of an index, the records are reorganized without regard
    to order. If the table has a clustering index defined, however, and no index is
    specified, then the clustering index is used to cluster the table. You cannot
    specify an index if you are reorganizing an MDC table.'
  merge: -1
