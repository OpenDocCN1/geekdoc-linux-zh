  md: '# Application Global Memory (app_ctl_heap_sz)


    > NOTE

    DB2 does not use the bufferpool when accessing the catalog, instead it performs
    direct reads from disk if information is not found in the catalog cache.


    The cache stores table descriptor information that is used when a table, view,
    or alias is referenced during compilation of an SQL statement. Use of cache helps
    improve performance of SQL statements when the same views, or aliases have been
    referenced in previous states. Descriptor information for declared temporary tables
    is not stored in catalog cache; it is stored in application control heap. Running
    DDL against a table will purge that table''s entry from the cache. Otherwise,
    it is kept in the cache room until another table, but but not until all units
    of work have been completed. Start with the default and monitor it by using the
    following monitoring elements:


    +   - cat_cache_lookups

    - cat_cache_inserts

    - cat_cache_overflows

    - cat_cache_heap_full


    In v8, catalogue cache elements can be obtained by issuing a snapshot of the Database
    Manager.


    # Application Group Memory (appgroup_mem_sz)


    This parameter determines the maximum size of the application shared memory segment.
    This memory is only used in a partitioned database environment, where intrapartition
    parallelism is enabled or connection concentration is being used. Each application
    has its own application control heap, allocated out of application group memory
    and all applications share one group shared heap. The size of each application
    control heap is calculated as follows:


    ```

    App_ctl_heap_sz * (100-groupheap/ratio)

    ```


    Start with the default and monitor and adjust if performance problems are observed.


    # APPLICATION GLOBAL MEMORY (app_ctl_heap_sz)


    Application global memory is allocated if using DB2 ELSE with intra_parallelism
    enabled or using partitioned databases (see Figure 9.5). For nonpartitioned databases
    its use is minimal.


    Application Global specifies how much application control heap is allocated for
    each application at the database where the application is active (in the case
    of partitioned databases, the heap is allocated at each database partition where
    the application is active). The heap is allocated during connection process by
    the first agent to receive a request for the application at the database (or database
    partition). The heap is used by agents working for the application to share information'
