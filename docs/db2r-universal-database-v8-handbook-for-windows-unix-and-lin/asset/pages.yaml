    sort time |

    | DFT_MON_STMT | Statement | APPLID, connect time, sorts, DML activity, locks
    held, bufferpool activity |

    | DFT_MON_TABLE | Table | Read and write activity |

    | DFT_MON_UOW | UOW | Completion status, start and end times |

    | DFT_MON_TIMESTAMP | Timestamp | Timestamp for time dependent functions |


