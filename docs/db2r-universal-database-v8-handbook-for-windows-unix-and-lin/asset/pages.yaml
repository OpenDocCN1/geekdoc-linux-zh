    # Database Partitioning


    Sometimes it is hard to understand just what makes up a database partition. I
    present a high-level view in Figure 13.3.


    As illustrated in Figure 13.3, each database partition has its own:


    +   * Data

    * Database Configuration File (DB CFG)

    * Log files

    * Bufferpools

    * Local caches (not pictured) for storing table descriptor information, authentication
    information, and local cache of identity column values


    As you can see, there is no Database Manager Configuration (DBM CFG) file pictured.
    That''s because there is 1 DBM CFG file per instance, not database. All partitions
    in the same instance share the same DBM CFG file.


    > NOTE

    Generally, DB CFG parameters should be set the same across all partitions. All
    things being equal this helps to provide similar performance across all partitions.


