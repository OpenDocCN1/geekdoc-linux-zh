  md: 'logs for this tablespace or tables. The minimum recovery time (in UTC) for
    a tablespace can be retrieved using the LIST TABLESPACE SHOW DETAIL command.


    Rolling databases forward may require a load recovery using tape devices. If prompted
    for another tape, the user can respond with one of the following:


    +   - Continue. Continue using the device that generated the warning message (e.g.,
    when a new tape has been mounted).

    - Device terminate. Stop the device that generated the warning message (e.g.,
    when there are no more tapes).

    - Terminate. Terminate all devices.


    If the roll-forward utility cannot find the next log that it needs, the log name
    is returned in the SQLCA, and roll-forward recovery steps. If no more logs are
    available, use the STOP option to terminate roll-forward recovery. Incomplete
    transactions are rolled back to ensure that the database or tablespace is left
    in a consistent state.


    # ARCHIVE LOG COMMAND


    Closes and truncates the active log file for a recoverable database. If user exit
    is enabled, an archive request is issued. As previously mentioned, this command
    can be used to test the archive log userexit, as it will force an active log to
    be archived.


    Authorization One of the following:


    +   - sysadm

    - sysctl

    - sysmain

    - sbadm


    Required connection None. This command establishes a database connection for the
    duration of the command.


    # Command Parameters


    DATABASE database-alias


    Specifies the alias of the database whose active log is to be archived.


    USER username


    Identifies the user name under which a connection will be attempted.


    USING password


    Specifies the password to authenticate the user name.'
