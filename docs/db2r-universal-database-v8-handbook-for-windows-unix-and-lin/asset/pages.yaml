    # The I/O Bottleneck


    Database workloads have caused the PCI bus to become saturated in many cases,
    while CPUs have continued to scale in accordance with Moore''s Law. I/O improvements
    have lagged behind,'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Keeping a Map of Your Database


    thus we have the “I/O bottleneck.” Disks are becoming more dense and thus are
    bigger (72 GB disks with the norm 44 GB disks on the horizon) and to store more
    data. However, even though disk speed (RPMs) has increased from 15,000 to 20,000
    RPM, the time a disk actuator to seek has remained steady. Thus, larger disks
    with moderate increases in RPMs equals slow times. Disk access is getting slower,
    not faster.


    # PCI Bus


    The predominant bus used in most PCs and servers today is also contributing to
    the I/O bottleneck. PCI (peripheral component interconnect) is a bus-system that
    allows the transfer of data between exactly two devices at a time. PCI was developed
    by Intel in 1992 as a local bus for PC and server platforms.


    In DB2 as well as other enterprise-level RDBMS implementations, PCI is a bottleneck
    to the CPU. PCI had a transfer rate of 133 MB/sec (Megabytes per second). It has
    enhanced several times over the past 10 years and the latest PCI-X 1.0 specification
    has up to 1066 MB/sec transfer rate. While these transfer rates may be acceptable
    for the average PC and small-mid tier server, they have fallen behind processor
    speed and Industry. Internet and database applications are saturating the bus,
    while processors sit idle. Industry users, vendors, and the PCI Special Interest
    Group (PCI-SIG), the proponent for PCI, have recognized the problem and have developed
    the faster PCI-X and PCI-Express specifications.


    CPU speed doubles every 18 months and with the rapid drop in memory prices, main
    memory sizes grow faster than CPU speeds. All disk transfer rates have only increased
    7%.

    So does this all mean? It means a revolutionary change has to take place to develop
    an I/O fabric capable of supporting today’s data transfer rates and data transfer
    requirements will need the future.


    # PCI Express (Arapahoe, 3GIO)


    PCI Express was formally named Arapahoe and 3GIO were officially changed to PCI
    Express. PCI Express will be the upgrade path for the existing PCI bus on PCs,
    and will eventually replace PCI, but it will take many years due to the proliferation
    of PCI over the past 10 years. PCI Express is software backward-compatible with
    PCI, but not hardware-compatible. PCI Express can operate at data speeds of 2
    GB/sec. It is scalable and uses serial I/O. It will widespread in late 2003 or
    early 2004.


    # PCI-X


    PCI-X will provide data transfer rates of up to 4.2 GB/sec, and is primarily designed
    for server implementations. PCI-X is designed primarily to compete at the server
    level in the enterprise, or the lower to middle end. It is fully backward-compatible
    with PCI. It is being positioned as an alternative to InfiniBand for the low-end
    server market. PCI-X is a local bus.'
