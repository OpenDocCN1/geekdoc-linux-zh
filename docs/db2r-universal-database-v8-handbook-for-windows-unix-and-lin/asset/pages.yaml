  md: '# ONLINE


    This keyword is specified to allow tablesspace-level roll-forward recovery to
    be done. This means that other agents are allowed to connect while roll-forward
    recovery is in progress.


    # OVERFLOW FOG PATH log-directory


    Specifies an alternate log path to be searched for archived logs during recovery.
    Use this parameter if log files were moved to a location other than that specified
    by the logpath database configuration parameter. In a partitioned database environment,
    this is the (fully qualified) default overflow log path for all partitions. A
    relative overflow log path can be specified for single-partition


    > NOTE

    OVERFLOW LOG PATH command parameter will overwrite the value (any) of the database
    configuration parameter OVERFLOW-LOGPATH.


    # Log-directory ON DBPARTITIONUM


    In a partitioned database environment, allows a different log path to override
    the default overflow log path for a specific partition.


    # NORETRIEVE


    Allows the user to control which log files to be rolled forward on the standby
    machine by allowing the user to disable the retrieval of archive logs. The benefits
    of this are:


    +   - By controlling the logfiles to be rolled forward, one can ensure that the
    standby machine is X hours before the production machine, to prevent the user
    affecting both systems.

    - If the standby system does not have access to archive (e.g., TSM is the archive,
    it only allows the original machine to retrieve the files).

    - It might also be possible that while the production system is archiving a file,
    the standby system is retrieving the same file, and it might then get an incomplete
    log file. NORETRIEVE would solve this problem.


    # RECOVER DROPPED TABLE drop-table-id


    Recovers a dropped table during the roll-forward operation. The table ID can be
    obtained using the LIST HISTORY command.


    # TO export-directory


    Specifies a directory to which files containing the table data are to be written.
    The directory must be accessible to all database partitions.'
