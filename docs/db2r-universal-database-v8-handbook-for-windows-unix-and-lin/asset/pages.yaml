    Key Database snapshot elements to review, monitor, and track on a regular basis
    along with tips are listed in Table 10.4.


    | Table 10.4 Key Database Snapshot Elements | Tuning Tips |

    | Monitoring Element | |

    | Lock waits | The total time an application waited for locks. Use with time database
    waited on locks to compute average time waiting for a lock. This should be < 10
    ms. Look for application sequencing problems, packages bound with RR, and lock
    escalations to X table locks. Get snapshot on application and locks and find all
    locks associated with application holding the most locks. |

    | Time database waited on locks | The total amount of elapsed time that applications
    were waiting for locks. Use last reset time and compute average time waited for
    locks. If lock wait and this parameter are high, you have concurrency issues.
    |'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Table 10.4 Key Database Snapshot Elements (Continued)


    | Monitoring Element | Tuning Tips |

    | :--- | :--- |

    | Deadlocks detected | Monitor and find application sequencing problems if deadlocks
    occur frequently. |

    | Lock escalations | Not necessarily a problem if it occurs constantly, investigate
    application problems, review size of locklist and maxlocks. |

    | Lock timeouts | Set locktimeout to 10–30 seconds and monitor. review applications
    running during this time, review reasons they are timing out and correct application
    problem, and and only then consider increasing locktimeout. |

    | Sort Overflows | Sort overflows should be < 3% in OLTP. This is difficult to
    achieve in DW/BI environments. Eliminate sorts through proper indexing and clustering.
    Since we can''t eliminate sorts in DW/BI environments, tune temporary tablespace
    container placement and create multiple containers on separate devices to maximize
    opportunity for parallel I/O. |

    | Bufferpool data physical reads | In DW/BI, sort overflow tuning I/O tip should
    be used. |

    | Bufferpool data writes | Bufferpool data writes occur to free a page in the
    bufferpool so another page can be read, and to flush the buffer. Consider increasing
    the size of the bufferpool if bufferpool data writes is high in proportion to
    asynchronous page writes. |

    | Bufferpool index physical reads | Same as bufferpool data physical reads. |

    | Dirty page cleaner triggers | Consider increasing size of bufferpool and number
    of chngpages_thres if you cannot increase size of bufferpool. |

    | Dirty page threshold triggers | Indicates number of times chngpg_thres has been
    reached and dirty pages written asynchronously to disk. Start with the default
    and decrease to 40% in OLTP environment. |

    | Database files closed | Try to keep at 0. Unnecessary closing and opening of
    files incurs unneeded overhead. |

    | Failed statement operations | Can be an indicator of application problems. Investigate
    with application staff and resolve. Not necessarily a problem but if high frequency
    is a possible indicator of locking, application, or other problems. |

    | Package cache overflows | Package cache overflows to utility heap, locklist,
    and other dbheap memory. Increase package cache until no overflows occur, but
    do not over allocate. |'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Table 10.4 Key Database Snapshot Elements (Continued)


    | Monitoring Element | Tuning Tips |

    |---|---|

    | Catalog cache overflows | Catalog cache overflows cause table descriptors, etc.
    to be flushed as needed resulting in I/O if descriptors need to be brought in.
    Set catalogcache_sz so that at least 90% ratios are observed. |

    | Number of hash join overflows | Hash joins overflow from sortheap throughpool
    to temporary-space. Increase sortheap and eliminate unnecessary sorts via elimination
    and through clustering techniques described in Chapter 12. |


