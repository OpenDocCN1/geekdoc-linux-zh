  md: '# When Should You Use Partitioned Databases?


    Shared-everything architecture is very common, found mostly in OLTP environments.
    Its scalability is limited, however, by the overhead involved in managing multiple
    CPUs and bus disk contention. The shared-nothing DPF of ESE solves this problem
    by providing the capability to partition data across multiple physical servers
    while at the same time presenting a single-database logical view to the end-user.
    This option provides massive SQL parallelism and can scale almost linearly. Figure
    13.2 provides an overview of the shared-nothing architecture.


    Shared-nothing architecture consists of a high-speed interconnect, used for sending
    SQL queries to multiple physical partitions and for returning query results, and
    usually a backup communications mechanism, in this case an Ethernet network. Each
    server in a shared-nothing architecture is usually using an SMP architecture with
    at least four CPUs.


    Although it has become common to use DB2 on Linux running on blade servers with
    1–2 CPUs. Having four CPUs enables CPU and I/O parallelism on each SMP server.
    In the DB2 ESE Partitioning Option, up to 999 partitions can be attached via the
    high-speed interconnect or network. Sharednothing architecture is IBM’s strategy
    for implementing massively parallel parallelism (MPP) via the ESE Partitioning
    Option. The DB2 ESE Partitioning Option is the DB2 configuration of choice for
    large data warehousing implementations. It is primarily used for decision support,
    business intelligence, and data warehousing applications. However, it is being
    used more and in OLTP applications.


    ![](img/961b0d3b0e157406ef7a293880ab928e_318_0.png)


    **Figure 13.2** Shared-nothing architecture.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# DB2 v8.1 ISE IMPROVEMENTS


    DB2 v8.1 includes several Partitioning Option improvements. Improvements have
    been made in the following areas:


    +   - Autoloader functionality has been included in the LOAD utility

    - Local Catalog caching on each partition

    - Identity Column Support with local cache

    - Identity columns can form part of partitioning key

    - Event Monitoring Enhancements


    The following commands or functions have been integrated into the Control Server


    +   - Multipartition control integrated into Control Center

    - Redistribute Partitiongroup (Nodegroup)

    - Create Table Wizard

    - Add/Drop Partition (Node)

    - MDC Creation


    # New Partitioning Terminology


    With the introduction of v8.1, many terms have changed with partitioned databases.
    Most notably is the change from node and nodegroup to database partitioning and
    database partition group. This should eliminate the confusion from the past where
    at various times a node was referred to as a partition while at the same time
    it was also used to refer to a physical server. This change should help those
    who new to DB2 a lot!


    > NOTE

    Version v8.1 still supports these old terms, so you don''t have to immediately
    change scripts that refer to the old names. However, have a plan to change them
    as they will probably not be supported in a future release or fixpack.


    See Table 13.1 for a comparison of old and new terms.


    # Table 13.1 Old and New Partitioning Terms


    | DB2 v7.2 and Prior | DB2 v8.1 |

    | LIST NODES | LIST DBPARTITIONNUMS |

    | NODE | PARTITION |

    | ADD NODE | ADD DBPARTITIONNUM |

    | LIST NODEGROUPS | LIST DATABASE PARTITION GROUPS |'
