    | SNAPSHOT_TBS_CFG | Information about tablespace configuration |


    # Working with SQL Snapshot Functions


    SQL snapshot functions provide you with another way to monitor DB2 and to be able
    to store the snapshot data in DB2 tables. Again, this gives you the capability
    to save historical data so that you can use this data to identify performance
    problems over time. You can write customized SQL and produce reports for your
    items of interest.


    An SQL snapshot function is issued as follows:


    ```

    SELECT TABLESPACE_ID, BUFFERPOOL_ID

    FROM TABLE (SNAPSHOT_TBS_CFG(''GUNNDB'', -1)) AS PGUN;

    ```


    After issuing the above command from a command line, the data from the snapshot
    function is returned to the screen; if using an application, it is returned to
    the application. The SQL snapshot functions are user defined functions (UDFs)
    stored in the SYSIBM.SYS catalog table (SYSCAT.ROUTINEPARMS view).'
  merge: -1
