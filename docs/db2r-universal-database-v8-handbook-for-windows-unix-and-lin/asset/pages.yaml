  md: '# Database Managed Space


    In DMS tablespaces, DB2 can use either DMS file containers or DMS devices (raw
    logical volumes). DMS file containers are allocated in extents over physical disk
    storage and make use of file system and database manager buffering. This is known
    as "double buffering." DMS file containers allocate specified space at container
    creation. A DMS tablespace can have one or many containers associated with it.
    On the other hand, DMS device containers are managed by the database manager,
    do not use file system buffering, and generally outperform all other types of
    tablespaces.


    # Criteria for Choosing DMS


    DMS tablespaces should generally be used when your requirements meet the following
    criteria:


    +   * ALWAYS, when performance is required

    * For separation of data and indexes over multiple physical disks

    * Data is expected to grow on a regular basis

    * To use RAW devices for performance gain

    * Separation of regular and long data is desired

    * Sufficient DBA resources are available


    When doubt and performance is the overriding factor, use DMS tablespace raw logical
    volumes. Table 6.1 lists the container types for SMS and DMS tablespaces.


    | Table 6.1 SMS and DMS Container Types |

    | Type of Container | SMS | DMS |

    | --- | --- | --- |

    | Directory | X | |

    | File | | X |

    | Device | | X |


    # Extents


    Tablespace Pages are allocated in extents. The EXTENTSIZE is specified on the
    CREATE TABLESPACE command. If not specified the EXTENTSIZE is controlled by the
    DFT_EXTENT_SZ DB CFG parameter. The EXTENTSIZE is the unit of allocation in DB2
    and extents are comprised of pages. Extents are used by DB2 when writing data
    to from containers.


    > NOTE Once the EXTENTSIZE is defined for a tablespace it cannot be altered.'
