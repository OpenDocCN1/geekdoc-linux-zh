  md: '# Multidimensional Clustering


    A block in Figure 5.1 is represented by a rectangle, and is numbered according
    to the logical order of allocated events in the table. The grid in the diagram
    represents the logical partitioning of these blocks, and each square represents
    a logical cell. A column or row in the grid represents a slice for a particular
    dimension. Furthermore, all records containing the value “South-central” in the
    region column are found in the blocks contained in the slice defined by the “South-central”
    column in the grid. In fact, each block in this slice also contains records having
    “South-central” in the region field. Therefore, a block is contained in this slice
    or column of the grid if only it contains records having ''South-central'' in
    the region field.


    To provide for the identification of which blocks comprise a slice, or which blocks
    contain all records having a particular dimension key value, a dimension block
    index is automatically created for each dimension when the table is created. See
    Figure 5.2 for an example of dimensions and dimension block indexes.


    Figure 5.2

    MDC table with dimension block indexes on REGION and YearAndMonth.'
