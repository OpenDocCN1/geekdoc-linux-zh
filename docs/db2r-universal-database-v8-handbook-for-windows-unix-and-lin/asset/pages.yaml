  md: '# Sort Heap Threshold for Shared Sorts


    This new parameter sets a hard limit for shared sorts. When this limit is reached,
    applications will fail with SQL0955C SQL message. If set to 0, the threshold for
    shared sort memory will be the value of the sheaptres DBM CFG setting. sheaptres_shr
    only applies when intra-parallel is set to YES, connection concentration is enabled,
    or when using the cursor WITH HOLD option. When using cursor WITH HOLD, sort heap
    will be allocated from sheaptres_shr memory.


    # Global Control Block


    Contains instance and database control information for all databases defined to
    the instance.


    # Monitor Heap (mon_heap_sz)


    Monitor heap is used across all databases to store monitoring information for
    all logical views of system data. The amount of monitor heap allocated is controlled
    by the number of monitoring applications, data-base activity, monitoring switches
    and use of monitor events. It is allocated at db2start and freed when DB2 is shut
    down. If mon_heap_sz is set to 0, monitoring is disabled. If you receive a -973
    SQLCODE while monitoring, you may need to increase the size of monitor heap.


    # Audit Buffer (audit_buf_sz)


    The audit buffer is used for buffering audit records asynchronously when written
    by the audit facility with audit_buf_sz is set to 0 and auditing is used, records
    are written synchronously, causing the application to wait for the disk write
    to complete.


    > HINT

    FCM resources are fully committed at db2start so you monitor them closely and
    make sure they are not overloaded.


    > NOTE

    FCM performance information can be captured through DB2-base-level snapshot monitoring.
    When FCM resources are exceeded, communication is degraded and error messages
    are returned to applications and are written to the db2diag.log file.


    # FCM Connection Entries (fcm_num_connect)


    FCM connection entries are used by FCM to pass data between agents. This is set
    in conjunction with fcm_num_rqdb and other FCM parameters.'
