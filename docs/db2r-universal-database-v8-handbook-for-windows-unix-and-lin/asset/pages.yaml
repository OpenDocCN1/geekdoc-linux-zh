- img_proc: true
  md: '# Understanding and Tuning DB2 Sort


    To answer business questions and solve business problems, data for reports and
    online queries are required to be presented in an ordered sequence. Plus, generally,
    we need information in an ordered manner. Consequently, many SQL queries contain
    statements such as ORDER BY, GROUP BY, DISTINCT, or other features such as UNIONS
    or JOINS. DB2 provides extensive sort capability and the DB designers continue
    to improve the efficiency of DB2 sort operations in each release of DB2. Many
    times DB2 has to perform a sort because of inadequate physical design (inadequate
    or incorrect indexes), inefficient SQL, or a combination of both of these. Or
    DB2 just needs to perform a sort on an intermediate result set or RID list to
    accomplish efficient join operations or prefetch. In most of my consulting engagements,
    I find SQL queries spending 70% or more of their time performing sorts. They are
    usually consuming a significant amount of processing resources. Which causes unnecessary
    sort operations, most of these sorts can be eliminated and significant CPU resources
    made available for other resources. Usually, these sort operations can be easily
    eliminated by changing an existing index, changing the SQL, or creating a new
    index to eliminate the sort. These are just some of the options available to us.
    In this chapter we will discuss the following:


    +   * DBM and DB CFG parameters that control sort resources

    * Memory areas

    * Sort operations

    * Monitoring

    * Tuning

    * Sizing

    * Eliminating sorts'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'Most sort problems are not caused by the DB2 engine but by external resources
    over which DB2 has little control. One thing you can be sure of, that sort is
    probably a problem with your applications currently in production at your shop.


    > NOTE\While sorts are needed, the actual sort operation can be avoided by the
    use of indexes and properly clustered tables.


    # DB2 Sort Memory Areas


    DB2 reserves special memory areas for sort operations. They are reserved at the
    instance and database level. At the instance level, sort memory is controlled
    by the SHEAPTHRES DEM configuration parameter, which controls the amount of shared
    memory that can be allocated for private and shared sorts across an instance.
    The SHEAPTHRES_SHR and SORTHEAP DB CF parameters control sort memory allocation
    at the database level.


    > NOTE\In v8, the SHEAPTHRES_SHR database configuration parameter specifies how
    much shared memory can be allocated for shared sorts at the database level.This
    capability lets DBAs place a hard limit on the amount of shared sort memory a
    database can use using intrapartition parallelism or connection concentration.


    # SORTHEAP


    This parameter defines the maximum amount of shared sort or agent private sortheap
    that can be allocated. Private sortheap is allocated out of agent private memory
    and shared sortheap is allocated out of database shared memory. DB2 uses sortheap
    to perform sorts.


    > WARNING

    2 v8 enables hash joins by default. Since hash joins use SORTHEAP, you should
    monitor SORTHEAP usage to make sure your previous settings are adequate.


    # TYPES OF SORTS


    Sorting in DB2 can be categorized as shared or private, and depending on the type
    of sort, either shared memory or agent private memory will be allocated.


    The determining factors on whether or not shared sorts are used is the setting
    of the intra_parallel DBM configuration parameter or if connection concentration
    is enabled.'
  merge: -1
