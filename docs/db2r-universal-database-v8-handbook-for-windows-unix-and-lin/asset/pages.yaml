  md: '# Associative Entity


    An associative entity is used to resolve many-to-many relationships. Many-to-many
    relationships are difficult to support in a RDBMS and are subject to modification
    anomalies. In the following example, we have a many-to-many between STUDENT and
    CLASS:


    ```

    STUDENT (ID, NAME, ADDRESS, PHONE_NMR, EMERG_CONTACT)

    CLASS (CLASS_NAME, NAME_BR_CREDITS, PREREQUISITES, CLASS_NBR)

    ```


    We resolve the many-to-many relationship by creating an association entity (STU_CLASS)
    that serves as a “go-between” for the two identified identities.


    ```

    STU_CLASS (ID, CLASS_NBR, NAME)

    ```


    This is done by creating a new entity, STU_CLASS, which contains the primary key
    from STUDENT and CLASS (ID and CLASS_NBR) as the new primary key. These columns
    are also foreign keys, which point to the parent table.


    The new relationship contains one-to-many relationships, which are much easier
    to understand and more accurately reflects how the data is used.


    # NORMALIZATION


    Once you have identified business entities and converted them to a logical model,
    the logical model needs to be normalized. Normalization is the process of identifying
    and eliminating redundant data elements in the logical design to update and delete
    anomalies. The normalization process uses a series of forms (CODD, 1970) that
    have defined rules, and these rules are applied to each entity in an iterative
    approach.


    For our purposes, we will discuss five types of normal forms. They are First Normal
    Form (INF), Second Normal Form (2NF), Third Normal Form (3NF), Boyce-Codd Normal
    Form (BCNF), and Domain/Key Normal Form (DK/NF). DBAs should also become familiar
    with Elementary Normal Form (EKNF) and Project-Join Normal Form (PJNF), but they
    are beyond the scope of this chapter.


    # Functional Dependencies


    A functional dependency is a relationship between or among attributes. An example
    would be that if we are given the value of one attribute, we can obtain the value
    of another attribute. For example, we restate this using the following notation:


    ```

    STUDENT_ID => GRADE_LEVEL

    ```


    which can be read as the attribute STUDENT_ID determines the attribute GRADE_LEVEL
    or GRADE_LEVEL is determined by STUDENT_ID. The attributes on the left side of
    the arrow are called determinants.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'We will see it later in this section how functional dependencies can be used
    to normalize relations.


    # Key


    A key is a group of one or more attributes that uniquely identifies a row. Every
    relation must contain a primary key. It should be noted that keys and functional
    dependencies are not determined by some arbitrary set of rules but are determined
    by the business rules of the organization.


    # FIRST NORMAL FORM


    A relation is in first form (1NF) if it contains no repeating groups. That is,
    each attribute (or column) must have only one value. Arrays not repeating groups
    are allowed. Let''s take a look at the CUSTOMER_ACCOUNT relation:


    ```

    CUSTOMER_ACCOUNT (CUST_ID, ACCT_NBR, CUST_NM, ADDRESS, TYPE, DESCRIPTION, BRANCH_NBR,
    BRANCH_ADDR)

    ```


    where:


    ```

    CUST_ID = customer identifier

    ACCT_NBR = account number

    UST_NM = customer name

    ADDRESS = customer address

    TYPE = account type

    DESCRIPTION = account description

    BRANCH_NBR = branch number

    BRANCH_ADDR = branch address

    ```


    This relation is in 1NF if it has no repeating groups, but has some inherent modification
    anomalies. What happens if a customer closes their account? All data regarding
    a customer such as customer identification, account number, and customer address
    will be lost. Also, inserting new data is a problem. The type of account, description,
    and branch address cannot be inserted until a customer opens an account.


    The problem with the CUSTOMER_ACCOUNT relation is that nonkey attributes are dependent
    on parts of the primary key, but not the entire key. We can see this by identifying
    the functional dependencies:


    ```

    CUST_ID => CUST_NM but ACCT_NBR => CUST_NM

    CUST_ID => ADDRESS but ACCT_NBR => ADDRESS

    CUST_ID => TYPE but ACCT_NBR => TYPE

    ACCT_NBR => DESCRIPTION but CUST_ID => DESCRIPTION

    ACCT_NBR => BRANCH_NBR but CUST_ID => BRANCH_NBR

    ACCT_NBR => BRANCH_ADDR but CUST_ID => BRANCH_ADDR

    ```'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Second Normal Form


    In order to eliminate modification anomalies, relations in 1NF are normalized
    to 2NF and 3NF. This will result in more entities being created throughout the
    normalization process.


    # SECOND NORMAL FORM


    A relation is in second normal form (2NF) if it is in 1NF and all of its nonkey
    attributes are dependent on all of the keys. Therefore, if the key has only one
    attribute, the relation must be in 2NF.


    The CUSTOM_ACCOUNT relation from our previous example can be decomposed into four
    new relations as follows:


    ```

    CUST_MSTR (CUST_ID, CUST_NM, ADDRESS)

    BRANCH_LOC (BRANCH_NBR, BRANCH_ADDR)

    ACCT_TYPE (TYPE, DESCRIPTION)

    C_ACCT (CUST_ID, ACCT_NBR)

    ```


    These new relations are in 2NF. The CUST_MSTR, BRANCH_LOC, and ACCT_TYPE relations
    have primary keys with one attribute, and the ACCT_ACCT relation contains no nonkey
    attributes. Customer information can be inserted into the CUST_MSTR relation before
    an account is opened. Deletion of all customers associated to a certain branch
    will not result in branch information being deleted. Deletion of all accounts
    for a customer will not result in loss of customer data.


    Relations that are in 2NF can still have modification anomalies. For example,
    the relation


    ```

    BANK_FEES (ACCT_NBR, TRAN_TYPE, FEE)

    ```


    is in 2NF, because the primary key ACCT_NBR only has one attribute, but there
    is a dependency involving a nonkey attribute (TRAN_TYPE) on another nonkey attribute
    (FEE). By identifying functional dependencies, you can identify the anomalies
    as follows:


    ```

    ACCT_NBR => TRAN_TYPE

    ACCT_NBR => TRAN_TYPE => FEE

    ```


    We have dependencies between nonkey attributes; the TRAN_TYPE and FEE.


    ```

    TRANTYPE => FEE

    ```


    The fee charged is determined by the transaction type. What if we delete an account
    number from the BANK_FEE relation? We lose the fact that a certain transaction
    type is associated with a specific fee.


    Another method that can be used to normalize relations is the concept of themes.
    Generally, if there are multiple themes in a relation, the relation can be decomposed
    further into relations with single themes to eliminate modification anomalies.
    Using the following relation, we can see that this relation has two themes, one
    containing student activity information and one containing activity cost information.


    ```

    STUD_ACTIVITY (STU_ID, ACTIVITY, FEE)

    ```'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Chapter 3 • Logical and Physical Design


    We can decompose these relations into additional single-theme relations:


    ```

    STU_ACT (STU_ID, ACTIVITY)

    ACTIVITY_COST (ACTIVITY, FEE)

    ```


    So you can use whichever technique you are more comfortable with.


    # THIRD NORMAL FORM (3NF)


    A relation is in 3NF if it is in 2NF and has no transitive dependencies. Another
    well known deinition for 3NF is a situation where an attribute is a "function
    of the key, the whole key, and nothing but the key."


    In the FEES relation, the transitive dependency between TRAN_TYPE and FEE was
    illusory. To resolve the transitive dependency, the relation can be decomposed
    into two new relations as follows:


    ```

    BANK_FEE (TRAN_TYPE, FEE)

    ACTIVITY (ACCT_NRB, TRAN_TYPE)

    ```


    # BOYCECODD Normal Form (BCNF)


    Another level of normalization is BCNF. Relations in 3NF can still have modification
    anomalies. Hence, we can continue to normalize relations in our search to eliminate
    modification anomalies.


    A relation is in BCNF if every determinant is a candidate key. In the following
    relation


    ```

    ADVISER (SID, MAJOR, FAC_NAME)

    ```


    a student can have more than one major (MAJOR). A major can have several faculty
    members (FAC_NAME) as advisers, and a faculty member (FAC_NAME) advises in only
    one major area. The combination (SID, MAJOR) determines FAC_NAME, and the combination
    (SID, FAC_NAME) determines the major. Both of these combinations are candidate
    keys. Additionally, FAC_NAME determines MAJOR (any faculty member advises in only
    one major; therefore, given the FAC_NAME, we can determine MAJOR). So, FAC_NAME
    is a determinant. But ADVISER is in 3NF because it is in 2NF and there are no
    transitive dependencies.


    However, ADVISER still has modification anomalies. Suppose a student drops out
    of school. If we delete the row with the SID of 50, we lose the fact that the
    adviser advises in psychology. This is a deletion anomaly. Similarly, we cannot
    store the fact that an adviser advises in history until a student majors in history.
    This is an insertion anomaly. With previous examples we can decompose ADVISER
    into two relations to resolve the anomalies. The new relations are:


    ```

    STUDENT_ADVISER (STU_ID, FAC_NAM)

    ADV_SUBJ (FAC_NAM, SUBJECT)

    ```


    These new relations are now in BCNF normal form and have no anomalies in regard
    to functional dependencies.


    21'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'Domain Key/Normal Form (DK/NF)


    # DOMAIN KEY/NORMAL FORM (DK/NF)


    This norm was defined in 1981 by R. Fagin. A relation is in DK/NF if every constraint
    on the relation is a logical consequence of the definition of keys and domains.
    In order to understand DK/NF form it is important that you understand the following
    definitions.


    # Constraint


    A constraint is any rule governing static values of attributes that is precise
    enough to enable us to determine whether or not it is true. Note that time-dependent
    constraints are excluded from this definition. Valid constraints are edit rules,
    functional, multi-value dependencies, and inter- and intra-relational constraints.


    # Key


    A key is a unique identifier of a row (tuple).


    # Domain


    A domain is a description of the allowed values of an attribute. Check constraints
    are an example of this in DB2. A domain has two parts: a physical description
    that defines the set of values the attribute can have, and a logical description
    that defines the meaning of the attribute.


    A relation is in DK/NF if enforcing key and domain restrictions allows all of
    the constraints to be met. This is especially important to an RDBMS, since they
    can prohibit modification anomalies by enforcing key and domain restrictions.


    A straightforward approach for converting relations to DK/NF has not been defined.
    However, in a RDBMS the facilities are usually provided as part of the RDBMS.
    If the constraints cannot be implemented by the database, then they can be coded
    into the application logic.


    In the following relation


    ```

    CUSTOMER (CUST_ID, ACCT_LEVEL, ACCT_TYPE, FEE)

    CUST_ID = Customer identifier

    ACCT_TYPE = Account type

    FEE = Fee based on type of account

    ```


    CUST_ID determines ACCT_LEVEL, ACCT_TYPE, and FEE is the key. Our business rules
    in this relation place domain constraints on all of the attributes and we know
    that ACCT_TYPE => FEE. In accordance with the rules for DK/NF, we need to make
    the functional dependency ACCT_TYPE => a logical consequence of keys. If ACCT_TYPE
    were a key attribute, ACCT_TYPE => FEE would be a logical consequence of the key.


    a key in Customer because more than one customer can have the same account type.
    But it can be a key of its own relation. So, we define the following domain definitions,
    relation, and attributes:'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# DOMAIN DEFINITIONS


    CUST_ID in DDDDDD, where D is a decimal digit >0<999999


    ACCT_LEVEL in ("PERS", "CML", "INTB")


    ACCT_TYPE in CHAR (3)


    FEE in DEC (4)


    RELATION AND KEY DEFINITIONS


    CUSTOMER (CUST_ID, ACCT_LEVEL, ACCT_TYPE)


    KEY: CUST_ID


    ACCT_FEE (ACCT_TYPE, FEE)


    KEY: ACCT_TYPE


    We know that by converting the relation to DK/NF, the relations have no modification
    anomalies whatsoever. We could have arrived at this result by converting from
    2NF to 3NF to remove transitive dependencies. However, using DK/NF we just need
    to make all the constraints logical sequences of domain and key definitions.


    # UNIFIED MODELING LANGUAGE (UML)


    The Unified Modeling Language (UML) was adopted by the Object Management Group
    (OMG) in November 1997 as a language for object-oriented analysis and design.
    The OMG received input regarding the UML specification from industry leaders such
    as Microsoft, IBM, and Oracle.


    In addition to being used for designing object-oriented projects, it has in-roads
    to local database design. This is a natural evolution as UML-capable tools are
    widely used to model, construct, and deploy enterprise applications.


    UML class diagrams are similar to entities in ER diagrams and can be used for
    conceptual and logical design. Many UML-capable tools can input and convert ER
    diagrams to class diagrams. Since it is full-featured, UML is well positioned
    to become the enterprise application development and data modeling tool of choice.
    This will be appealing to IT organizations because the entire enterprise from
    business architects to database administrators will all be to work from the same
    model and tool set. As a DBA or data modeler, you should become familiar with
    use of UML and associated outputs. I anticipate that it will eventually become
    widespread in logical design.


    # LOGICAL DESIGN OUTPUTS


    A logical model identifying the entities, relationships, and attributes for the
    data being modeled is the primary output of the logical design process. The logical
    design is complete with foreign keys and constraints defined on the data, and
    should contain data at least normalized to 3NF, or DK/NF if possible. The logical
    model is the primary input to physical design.'
  merge: -1
  pgno: 61
- img_proc: true
  md: "# Physical Design\n\n# PHYSICAL DESIGN\n\nOnce the logical design has been\
    \ completed, physical design can begin. Physical design consists of the following\
    \ five steps:\n\n+   1. Denormalization\n2. Creation of indexes\n3. Creation of\
    \ tablespaces and tables\n   - Container layout\n   - Disk strategy\n4. Tablespace\
    \ breakout strategy\n5. Bufferpool strategy\n\n# DENORMALIZATION\n\nNormalized\
    \ relations eliminate or reduce modification anomalies. However, the process also\
    \ results in many more relations, which will be subsequently converted (in most\
    \ cases) to DB2 tables. Sometimes the costs (query runtime and complexity) outweigh\
    \ the benefits of normalization.\n\nWith continued enhancements to the DB2 optimizer,\
    \ cost is not as much a factor as it used to be (in terms of processing many table\
    \ joins, etc.), but it still is a factor to consider when trying to optimize the\
    \ physical design. Denormalization is the process of combining relations or attributes\
    \ from relation to reduce the number of relations to be processed and reduce the\
    \ complexity of queries. Denormalization is sometimes referred to as \"controlled\
    \ redundancy.\" Denormalization is primarily done for performance gains, to provide\
    \ read-only tables for decision reports, or for ad hoc reporting, but \"caveat\"\
    \ the DA or DBA must be aware of the redundancy subsequent modification anomalies\
    \ that Denormalization can be done just using the logical model but it done much\
    \ better if the DBA has the SQL so that they are aware of the relationships and\
    \ joins involved. A DBA must have the SQL queries associated with the logical\
    \ model in order to develop a proper physical design.\n\n> HINT\nMany logical\
    \ modeling tools can generate Data Definition Language (DDL) to create the physical\
    \ objects. Use this generated SQL (you can modify, if necessary) to save time\
    \ and increase productivity.\n\n# CREATION OF INDEXES\n\nUnique (primary key)\
    \ indexes and indexes on foreign keys should be created on the logical model.\
    \ Secondary indexes, to support SQL queries, join operations, and business reports,\
    \ should be created as part of physical design. In order for this to occur the\
    \ SQL needs to be provided to the DBA staff at time, although this is not the\
    \ case and the SQL is not available. Therefore, it is very difficult to identify\
    \ all the secondary indexes required. What usu-"
  merge: -1
  pgno: 62
- img_proc: true
  md: 'ally happens in this case is that the application does not meet performance
    expectations in production, and significant modification is required to programs
    and indexes.


    If the SQL is available at the initial physical design, then the DBA can create
    indexes to meet the needs of the business.


    Follow these guidelines when creating secondary indexes:


    +   - Create indexes to eliminate SORTS required by ORDER BY, GROUP BY, and DISTINCT
    SQL statements.

    - Create indexes on joined columns.

    - Failure to do so result in cartesian product, which is not always desirable.

    - Create indexes on local predicates to get index-only access.

    - Consider using INCLUDE columns to obtain index-only access.

    - Create indexes including the ALLOW REVERSE SCANS clause to eliminate sorts.

    - Create indexes on foreign keys.

    - Create a clustering index on every table.

    - Consider use of APPEND ON for highly inserted tables.

    - Use Multidimensional Clustering (MDC) indexes for data warehousing environments
    and consider MDC for online transaction processing (OLTP) environments.


    For more information on indexes, refer to Chapter 7.


    # CREATION OF TABLESPACES AND TABLES


    A tablespace and table strategy needs to be developed: the type of space that
    will be used, SMS or DMS, as well the size and number of tables per tablespace,
    along with the number of containers to be used.


    > HINTnPrior to creation of tablespaces, remember to enable the DB2_PARALLEL_IO
    environmental variable so that it is applied to any tablespaces you create.


    File systems must be built or drive assignment verified and raw logical volumes
    requested if DMS device containers are being used. This requires coordination
    with system, storage, and pos-itively network or InfiniBand administrators over
    storage area networks (SANs) or Infiniband networks being used or planned.


    # Tablespace Breakout Strategy


    A tablespace breakout strategy consists of the following:


    +   - Assigning high priority tables to a single tablespace.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '+   - Placing high priority tablespaces in dedicated buffers and/or on separate
    physical disks or disk arrays.


    +   - Creating separate tablespaces for indexes and/or assigning indexes to separate
    buffers.


    # BUFFERPOOL STRATEGY


    Objects should be assigned to buffers based on business priorities and access
    type. Business priorities are contained in or derived from business needs. Access
    type pertains to whether or not access is sequential or random. Place objects
    with different access types into different buffers. That way, an object with list
    of sequential prefetch will not compete for bufferpool space with randomly accessed
    objects. Refer to Chapter 8 for more information on buffers.


    # SUMMARY


    Logical design is the single most important step in database design. It cannot
    be skipped. It can be customized to support specific development efforts.


    Business architects identify business entities and business rules and develop
    the conceptual model. Data administrators or DBAs develop the logical design and
    normalize it to meet business objectives. This is typically to 3NF or DK/NF. The
    importance of identifying and eliminating modification anomalies has been discussed.
    UML was introduced and identified as a future modeling language. The importance
    of having well-defined and documented business rules was presented.


    The logical model is important to the physical design process. Most modeling tools
    can generate DDL for use in building the physical design. Tablespace design, as
    well as container strategy and disk layout, to be planned and coordinated with
    UNIX, SAN, and network administrators. Finally, business priorities need to be
    used in developing a tablespace breakout strategy.'
