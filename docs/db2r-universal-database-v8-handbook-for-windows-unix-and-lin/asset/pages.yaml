  md: '# Read Access Only


    The table data is available for read access queries. Loads using the ALLOW READ
    ACCESS option put the table into Read Access Only state.


    # Unavailable


    The table is unavailable. The table may only be dropped or it may be restored
    from a backup. Roll forward through a nonrecoverable load puts a table into the
    unavailable state.


    # Not Load Restartable


    The table is in a partially loaded state that will not allow a load restart. The
    table will also be in the Load Pending state. Issue a load terminate or a load
    replace to bring the table out of the Not Load Restartable state. The table can
    be in the not load restartable state during a roll-forward operation. This can
    occur if you roll forward to a point in time that is prior to the end of a load
    operation, or if you roll forward through an aborted load operation but do not
    roll forward to the end of the load terminate or load restart.


    # Unknown


    Load query is unable to determine a table state.


    # QUIESCE COMMAND


    Forces all users the specified instance and database and puts it into a quiesced
    mode. In quiesced mode, users cannot connect from outside of the database engine.
    While the database instance or database is in quiesced mode, you can perform administrative
    tasks on it. After administrative tasks are complete, the QUIESCE command to activate
    the instance and database allow other users to connect to the database but avoid
    having to shut down and perform another database state.


    In this mode only users with the authority in this restricted mode are allowed
    to attach or connect to the instance/database. Users with sysadm, sysmain, and
    sysctl authority have access to an instance while it is quiesced, and users with
    sysadm authority always have access to a database while it is quiesced.


    Scope QUIESCE DATABASE database-name results in all objects in the database-name
    in the quiesced mode. Only the allowed user/group and sysadm, sysmain, dbad, or
    sysctl will be able to access the database or its objects.


    QUIESCE instance instance-name means the instance and the database in the instance
    instance-name will be in quiesced mode. The instance will be accessible just for
    sysadm, sysmain, and allowed user/group.


    If an instance is in quiesced mode, a database in the instance cannot be put in
    quiesced mode.'
