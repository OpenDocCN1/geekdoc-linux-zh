  md: '# I/O Performance Measurements: ORMS,ARMS, SRMS


    # Overall Read Milliseconds (ORMS)


    # ORMS FORMULA


    (Total bufferpool read time (ms)) /

    (Bufferpool data physical reads + Bufferpool index physical reads)


    Using the values found in Example 8.2 for tablespace SYSCSPACE,


    ```

    ORMS = 662 / (501 + 610) = 0.60 ms

    ```


    For each tablespace, compute the overall read millisecond time then create an
    ordered list of tablespaces by ORMS. Is there a much higher than average ORMS?
    If so, find out why. Tablespaces with higher ORMS numbers (slower I/O) have containers
    of unequal size, multiple containers accidentally placed on the same physical
    devices, and/or super-sized on a single disk. It''s also possible that tablespaces
    with slower physical I/O performance may be placed on disk devices or controllers
    with above-average activity rates. Improving I/O response time by a few milliseconds
    may seem trivial, but the gain becomes significant when millions of physical I/Os
    are involved.


    # Asynchronous Read Milliseconds (ARMS) and Synchronous Read Milliseconds (SRMS)


    # ARMS FORMULA


    (Total elapsed asynchronous read time (ms)) /

    (Asynchronous pool data page reads + Asynchronous pool index page reads)


    Using the values found in Example 8.2 for tablespace SYSCSPACE,


    ```

    ARMS = 168 / (108 + 21) = 1.32 ms

    ```


    Average asynchronous read time (ms) provides the DBA with the average time to
    complete an asynchronous I/O. Like ORMS, ARMS values can be computed for and compared
    against all tablespaces to discover tablespaces with slower response times.


    # SRMS FORMULA


    (Total bufferpool read time (ms) - Total elapsed asynchronous read time) /

    ((Bufferpool data physical reads + Bufferpool index physical reads))

    (Asynchronous pool data page reads + Asynchronous pool index page reads))


    Using the values found in Example 8.2 for tablespace SYSCSPACE,


    ```

    SRMS = (662 - 168) / ((501 + 610) - (108 + 21)) = .503 ms

    ```'
