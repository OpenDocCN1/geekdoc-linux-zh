  md: '# Tuning Bufferpools


    # INTRODUCTION


    DB2 uses computer areas of memory called bufferpools for the purpose of minimizing
    disk I/O to the computer''s disk storage devices. When DB2 executes SQL statements,
    the DB2 optimizer will control access to certain index and data pages. Often,
    especially in OLTP systems, indexes are accessed first to locate actual table
    (the RID, or Row ID, list), then the tablespace data pages are accessed to retrieve
    the data. DB2 first attempts to locate the required index and data pages in its
    buffer memory by performing “logical reads.” If the required data is not found
    to be already present in buffer memory, then “physical read” is issued to obtain
    the required data from disk storage. Accessing memory is extremely fast, as most
    commercially available memory chips deliver performance that is measured in nanoseconds,
    often 70 ns or faster. Contrast this to the time typically required to access
    disk storage devices, which is commonly measured in milliseconds. Good disk performance
    is typically measured in the 3 ms to 7 ms range, suggesting that accessing memory
    for data is about 1,000 times faster than disk storage. It logically follows,
    that the more data that is stored in DB2 buffer memory, the faster the database
    will perform physical reads of disk storage devices can be avoided. However, be
    cautioned that extremely large bufferpools cannot be successfully used to offset
    poor performance of an application with improper physical design. If indexes are
    missing, or suboptimally defined, DB2 will have to perform hundreds, if not thousands,
    of logical reads (which may require physical reads) to search memory and find
    appropriate results for SQL statements. Large memory scans consume a great deal
    of CPU resources, and this is why many of today’s business applications are CPU
    constrained and fail to scale as new users and data are added. Tuning will be
    discussed in detail later in this chapter.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# MAINTAINING BUFFERPOOLS


    # Creating Bufferpools


    Bufferpools can be defined in 4 K, 8 K, 16 K, or 32 K page sizes. The page size
    used depends on the page size(s) of the tablespace(s) assigned to the bufferpool.
    Larger page sizes will be used when table row widths (number of bytes) exceed
    the capacity of the smaller page sizes. It is good and common practice to limit
    any database to using either one or two different page sizes; 4 K and 8 K pages
    are the most popular.


    The amount of memory allocated to bufferpools will be primarily limited to the
    amount of real memory installed in the machine, less reserves for operating system
    functions, application programs, and other DB2 heaps and caches. As a rule of
    thumb, 50–75% of real memory is often dedicated to DB2 bufferpools on a DB2 server
    machine.


    Bufferpools should have an intended I/O purpose or strategy. If the I/O performed
    within a bufferpool will be predominantly asynchronous I/O, this will dictate
    the certain use of some bufferpool features that optimizeprefetch I/O. If I/O
    will be predominantly synchronous (random), other attributes will be important
    to a bufferpool''s definition.


    To create a bufferpool with an 8 K page size that is intended for random I/O in
    an OLTP database, consider the following sample create create bufferpool command:


    ```

    CREATE BUFFERPOOL randombufferpool IMMEDIATE SIZE 61440 NUMBLOCKPAGES 0 PAGESIZE
    8192;

    ```


    This bufferpool would be (61440 × 8192 / 1048576) 480 megabytes in size with zero
    pages reserved for prefetch block I/O.


    To create a bufferpool with a 4 K page size that is intended for sequential I/O
    in a BI/DW database, consider the following sample create bufferpool command:


    ```

    CREATE BUFFERPOOL seqbufferpool IMMEDIATE SIZE 81920 NUMBLOCKPAGES 80256 BLOCKSIZE
    64 PAGESIZE 4K;

    ```


    This bufferpool would be (81920 × 4096 / 1048576) 320 megabytes in size reserved
    for prefetch block I/O. The NUMBLOCKPAGES value cannot exceed 98% of the bufferpool
    size, and it should be a multiple of the BLOCKSIZE (which, by default, is 32).
    The BLOCKSIZE should ideally match the EXTENTSIZE of the tablespace(s) assigned
    to the bufferpool.


    To find the largest possible NUMBLOCKPAGES value, use the formula:


    ```

    NUMBLOCKPAGES = (Floor(Floor(BP #Pages × 98 / 100)/Blocksize #Pages)) × Blocksize
    #Pages

    ```'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Maintaining Buffpools


    Since all I/O in a BI/DW database is sequential (some random I/O may occur via
    nested loop joins or other DB2 data accesses), consider reserving 60% of the bufferpool
    size for sequential I/O with the formula:


    ```

    NUMBLOCKPAGES =

    (Floor(Floor(BP #Pages × 60 / 100)/Blocksize #Pages)) × Blocksize #Pages

    ```


    Tuning bufferpools for OLTP versus BI/DW databases will be covered in greater
    detail later in this chapter.


    # Altering Buffpools


    The definition of a bufferpool can be changed with an ALTER command. Use ALTER
    BUFFER-POOL to change the SIZE of a bufferpool, change the NUMBLOCKPAGES, or change
    the BLOCK-SIZE. A change to the size of the bufferpool will take effect immediately,
    unless the DEFERRED option is used. NUMBLOCKPAGES and BLOCKSIZE are discussed
    in depth later in this chapter.


    Here is an example of an ALTER BUFFERPOOL command:


    ```

    ALTER BUFFERPOOL bufferpoolname SIZE 81920;

    ```


    Where 81920 is the updated number of pages for the bufferpool to use.


    Prior to v8, the DBHEAP memory required one page of memory for each 30 pages of
    bufferpool memory. Beginning with v8, the bufferpool descriptor pages are now
    stored in database shared memory, so DBHEAP is no longer a concern with respect
    to bufferpool sizes.


    > NOTE

    DB2 v8 uses internal bufferpools at DB2 startup if memory cannot be obtained in
    the amount requested. This enables DB2 to start and then you can alter the buffer
    effect to the appropriate size. To ensure that an appropriate bufferpool is available
    in all circumstances, DB2 creates small bufferpools, one for each page size. The
    size of these bufferpools is 16 pages.


    # Dropping Buffpools


    Bufferpools can be removed from a database by dropping them with the DROP BUFFERPOOL
    command. Before a bufferpool is dropped, the DBA must ensure that there are no
    tablespaces currently assigned to the bufferpool or the DROP will fail. Once a
    bufferpool is dropped, the real memory used by the bufferpool becomes immediately
    available to the operating system for other purposes, including allocation or
    assignment to other DB2 caches, heaps, or buffers.'
