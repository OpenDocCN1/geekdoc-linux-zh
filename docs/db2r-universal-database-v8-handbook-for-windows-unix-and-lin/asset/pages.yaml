    List fetch is a special table access method that involves retrieving the qualifying
    RIDs from the index, sorting them by page number and fetching the data pages.
    Sometimes the optimizer does not have accurate information to determine if list
    fetch is a good access method. This might occur when predicate statistics contain
    parameter markers or host variables that prevent the optimizer from using catalog
    statistics to determine the selectivity.


