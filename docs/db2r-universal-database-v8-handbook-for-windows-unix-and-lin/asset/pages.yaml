    ```


    This returns warning SQL1271 ("Database is recovered but one or more tablespaces
    are offline on database partition(s) 0 and 2.")


    ```

    db2 rollforward db sample to end of logs

    ```


    This rolls TBS1 forward on database partitions 0 and 2. The clause TABLESPACE
    (TBS1) is optional in this case.


    # Example 6 (MPP)


    After restoring tablespace TBS1 on database partitions 0 and 2 only, roll TBS1
    forward on database-partitions 0 and 2:


    ```

    db2 rollforward db sample to end of logs

    ```


    Database partition 1 is ignored.


    ```

