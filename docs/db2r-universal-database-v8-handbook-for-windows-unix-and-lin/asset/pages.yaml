  md: '# USER username


    The user name under which the database is to be roll-forward recovered.


    # USING password


    The password used to authenticate the user name. If the password is omitted, the
    user is prompted to enter it.


    # TO isotime


    The point in time to which all committed transactions are to be rolled forward
    (including the transaction committed precisely at that time, as well as all transactions
    committed previously).


    This value is specified as a time stamp, seven-part string that identifies a combined
    date and time. The format is yyyy-mm-dd-hh.mm.ss.nnnnnn (year, month, day, hour,
    minutes, microseconds), expressed in coordinated universal time (UTC). UTC helps
    to avoid having the same time stamp associated with different logs (because of
    a change in time associated with daylight savings time, for example). The time
    stamp in a backup image is based on the local time at which the backup operation
    started. The CURRENT TIMEZONE special register specifies the difference between
    UTC and local time at the application server. The difference is represented by
    a decimal number in which the first two digits represent the number of hours,
    the next two digits represent the number of minutes, and the last two digits represent
    the number of seconds. Subtracting CURRENT TIMEZONE from a local time converts
    that local time to


    # USING LOCAL TIME


    Allows the user to roll forward to a point in time that is the user''s local time
    rather than GMT time. This makes it easier for users to roll forward to a specific
    point in time on their local time, and eliminates potential user errors due to
    the translation of local to GMT time.


    # Notes


    +   1. If the user specifies a local time for roll-forward, all messages returned
    to the server will also be in local time. Note that all times are converted to
    the server, and if MPP, on the catalog database partition.

    2. The timestamp string is converted to GMT on the server, so the time is local
    to the server''s time zone, not the client''s. If the client is in one time zone
    and the server in another, the server''s local time should be used. This is different
