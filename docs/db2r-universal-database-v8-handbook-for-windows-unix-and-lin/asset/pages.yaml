    # DATABASE MANAGER SHARED MEMORY


    Database Manager shared memory is allocated at the instance level. It is shared
    across all databases within the instance. All other memory used by DB2 is chained
    off shared memory. Shared memory is allocated at db2start and deallocated at db2stop.


    Database Manager shared memory consists of control structures as outlined in Figure
    9.3. Database-based shared memory is used to store and manage activity across
    all databases. It is allocated at db2start and freed at db2stop. The Fast Communication
    Manager (FCM) is the DB2 component that manages communication (messages) between
    multiple logical nodes in a partitioned environment and parallel subagents in
    an ESE environment with the intra_parallel configuration parameter enabled. When
    specifying FCM DBM CFG parameters, keep in mind that the higher the maxagent DB
    CFG setting, the higher the potential for Database Manager Shared Memory to grow
    rather large. In a partitioned environment, Database Manager Shared Memory is
    used differently and is outlined in Chapter 13.'
