  md: '# Preface


    wrote this book to provide you with the necessary knowledge with which to accomplish
    business objectives with DB2 UDB v8.1 for Windows, UNIX, and Linux. After all,
    as a developer or DBA, your primary mission is to accomplish business objectives
    by providing a database environment that provides the requisite performance, availability,
    and scalability required in today''s demanding 24x7 highly competitive business
    environment.


    To end, I have focused this book on key areas of DB2 UDB v8.1 that will enable
    you to meet those objectives. Some of the features covered are: the new Development
    Center, multidimensional clustering, online reorganization and online load, Type-2
    indexes, tablespace enhancement, block-based buffers, buffering pools, new commands
    and utility options, dynamic configuration parameters, autonomic computing features,
    write-to-table event monitors, SQL snapshot features, QUIESCE command, and the
    database partitioning feature with new partitioning terminology updates. And,
    almost all new DB2 UDB v8.1 features and enhancements are covered in this book.
    Also, I have included a chapter on logical and physical design to help you in
    designing top performing databases.


    In the following chapters, I will show you how to design, maintain, monitor, and
    tune high performing DB2 UDB v8.1 databases.


    If you read this book, I have helped you do that, then I have accomplished my
    mission.


    # ACKNOWLEDGMENTS


    I have had a lot of help in writing this book. I would like to thank the following
    people from Prentice Hall: Mike Meehan, for helping me get started on this book;
    Jeff Pepper, for continued support and patience; Scott Suckling, for producing
    the final manuscript; and all the people behind the scenes in the marketing and
    publication of this book.'
