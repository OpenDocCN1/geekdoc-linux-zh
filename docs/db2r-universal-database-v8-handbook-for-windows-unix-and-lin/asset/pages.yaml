  md: 'ONLINE, applicable only when performing a table space-level restore operation,
    is speci-fied to allow a backup image to be restored online. This means that other
    agents can connect to the database while the backup image is being restored, and
    that the data in other tablespaces will be available while the specified tablespaces
    are being restored.


    # HISTORY FILE


    The keyword is specified to restore only the history file from the backup image.


    # INCREMENTAL


    Without additional parameters, INCREMENTAL specifies a manual cumulative restore
    operation. During manual restore the user must use each restore command manually
    for each image involved in the restore. Do so according to the following order:
    last, first, second, third, and so on, up to including the last image.


    # INCREMENTAL AUTOMATIC/AUTO


    Specifies an automatic cumulative restore operation.


    # INCREMENTAL ABORT


    Specifies abortion of an in-progress manual cumulative restore operation.


    # USE TSM


    Specifies that the database is to be restored from TSM-managed output.


