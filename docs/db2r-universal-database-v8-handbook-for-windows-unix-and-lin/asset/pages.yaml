  md: 'Note that two new formulas have been added in v8 to address pseudo-deleted
    RID entries and MDC tables. New fields are ELEAF and NDEL and are defined as follows:


    +   - ELEAF—The number of pseudo-empty index leaf pages (NUM_EMPTY_LEAFS). (A
    pseudo-empty index leaf page is a page on all all RIDS are marked as deleted,
    but have not been physically removed.)

    - NDEL—The number of pseudo-deleted RIDS (NUMIDS_DELETED). (A pseudo-deleted RID
    is a RID that is marked deleted. This statistic reports pseudo-deleted RIDS on
    pages that are not pseudo-empty. It does not include RIDS marked as deleted on
    leaf pages where all the RIDS are marked deleted.)


    # Formula F7


    ```

    100 * (NUMIDS_DELETED / (NUMIDS_DELETED + CARD)) < 20

    ```


    The number of pseudo-deleted RIDs on non-pseudo-empty pages should be less than
    20%.


    # Formula F8


    ```

    100 * (NUM_EMPTY_LEAFS/NLEAF) < 20

    ```


    The number of pseudo-empty leaf pages should be less than 20% of the total number
    of leaf pages.

    If only the results of the calculations for Formula 7 exceed the bounds set, cleanup
    of the indexes using the CLEANUP ONLY option of REORG INDEXES is recommended.
    When the CLEANUP ONLY option is used, a cleanup, rather than a full reorganization,
    is done. The indexes are not rebuilt and any pages freed will be available for
    reuse by indexes only on the involved table.

    If only the results of the calculations for Formula 8 are exceeded, a cleanup
    of the pseudo-empty pages of the indexes using the CLEANUP ONLY PAGES option of
    REORG INDEXES is recommended. The utility will search for and free committed pseudo-empty
    pages. Committed pseudo-empty pages will be removed from the index tree. This
    will not clean up pseudo-deleted keys on pages that are not pseudo-empty. This
    option will run much faster than using the ALL option because it is only checking
    the pseudo-empty leaf pages.


    # DATABASE LOGGING


    Key to any relational database, database logging is the ability to log database
    changes and undo any changes that are not committed to the database. Also, the
    ability to undo inflight transactions which occur when a database crashes as a
    result of a server crash or power failure, is an inherent function that a relational
    database must provide.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# Crash Recovery


    After such an occurrence, DB2 invokes crash recovery (by default), which uses
    the DB2 logs to bring the database to a consistent state. A database configured-in
    this way is referred to as being nonrecoverable because the only recovery ability
    is crash recovery and version recovery. Roll-forward recovery is not supported
    when using a data-base configured as nonrecoverable.


    # Version Recovery


    Version recovery when a database backup is used to restore the database to a previous
    point using a backup of the database. In version recovery, roll-forward is not
    possible with a database using circular logging.


    # Circular Logging


    Circular logging enables version recovery and the backout of uncommitted transactions.
    Circular logging uses primary logs to record changes to the database. When a primary
    log fills up, a second-log file may be used. Circular logging only uses active
    logs and works in a circular manner.


    In circular logging, as one primary log becomes full, the next primary log is
    used. After a log file has all of its transactions committed or rolled back, it
    is eligible for reuse. In circular logging, DB2 will reuse active logs as they
    become available and as needed. If all primary logs are in use, DB2 will allocate
    secondary logs until primary active logs become available again.


    > The default value of LOGFILESIZE is 1,000 4K pages for Linux and UNIX and 250
    K pages for Windows. These values should be adjusted via system testing or benchmark
    testing.


    In circular logging, logs are not archived and forward recovery is not possible.
    This type of logging-is good for applications that are read only or relatively
    few changes to the data are made. In Most Enterprise OLTP or e-commerce environments,
    archival logging is used to fully protect the firm’s data. Figure 7.3 is an example
    of the Configure Database Logging Wizard that can be used to assist you in configuring
    the type of logging appropriate for your environment.


    # Archival Logging


    Archival logging enables a DB2 database to be fully recoverable. That is, all
    the previous recovery-methods mentioned above, plus archival logging provides
    for forward recovery. Forward recovery enables a database or tablespace to be
    recovered just prior to the point of failure. Hence, only inflight transactions
    at the time of failure are nonrecoverable.'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# 112 Chapter 7 • Utilities and Commands


    ![](img/961b0d3b0e157406ef7a293880ab928e_137_0.png)


    Figure 7.3 Configure Database Logging Wizard.


    > NOTE

    ival logging is not enabled by default. If either database configuration parameters
    LOGRETAIN or USEREXIT are enabled, then the database is enabled for archival logging
    and forward recovery.


    DB2 uses three types of log files when configured for archival logging:


    +   - Active logs, which contain information for current units of work that have
    not yet been committed or rolled back. They also contain information about transactions
    that have been committed whose changes have not been written to the database files.
    As discussed earlier, active logs are used for crash recovery and additionally
    for rollback to a point in time or to the end of logs.

    - Online archived–Active logs become online archived logs when all changes in
    the active log are no longer needed for normal processing. The log is closed and
    becomes an archived log. Online archive logs contain information regarding completed
    transactions no longer needed for restart recovery. They are called online beside
    they still reside in the same subdirectory as the active log files.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Database Logging


    > NOTE

    DB2 supports dual logging at the database level. The MIRROR_LOG-PATH DB CFG parameter
    enables this capability, and when enabled, DB2 can write a copy of the log to
    a different path.


    +   - Offline archived—Log files that are moved from the active log file directory
    become offline archived. These files can be moved via the userxit with DB2. They
    can also be managed by an external storage manager such as IBM''s TSM, or some
    other third-party vendor product.


    # Roll-forward Recovery


    Roll-forward recovery can use archived logs, offline archived logs, and active
    logs to rebuild a database or tablespace to the end of the logs or to a specific
    point in time.


    > NOTE

    With the USERXIT enabled, the ARCHIVE LOG COMMAND can be used to force an archive
    of the log. Note that it can also be used to test the userxit if enabling it for
    the first time.


    > NOTE

    When restoring a database using archived logs, the DB CFG NEW-PATH parameter can
    be used to change the log file location so logs that are needed for recovery can
    be placed there.


    # Important Facts Regarding Logs


    If an active log is erased, lost, or destroyed, the database becomes unusable
    and a restore must be done before it can be used again.


    If an archive log file is erased, you will only be able to log forward changes
    up to the first log erased.


    You must take the necessary steps to secure and protect log files.


    For top performance, log files can be placed on raw devices on all supported platforms.
    Consideration when using RAW devices:


    +   - Only the primary log file extents are used

    - The amount of space must be at least (LOGPRIMARY * (LOGFILSZ +2)) + 1) 4 KB
    pages.


    Since secondly log files are not used on raw devices, you will have to take this
    into consideration when sizing your logs and determining how many you need.'
  merge: -1
  pgno: 138
