- img_proc: true
  md: 'For a BI/DW database, I suggest using one large bufferpool for all tablespaces
    of a given page size. Thus, if the database has 4 K and 8 K size tablespaces,
    your BI/DW database should have two large bufferpools, one for each page size.


    # Optimum Bufferpool Assignments


    Armed with the knowledge of the Asynchronous and Synchronous Read Percentages
    for each tablespace, you will be able to prudently assign tablespaces that are
    predominantly read asynchronously to bufferpools designed for asynchronous (sequential)
    I/O, and tablespaces that are mostly read to bufferpools designed for random I/O.
    If the SRP for a tablespace is greater than 80%, assign the tablespace to a random
    I/O bufferpool. If the SRP for a tablespace is less than or equal to 80%, assign
    the tablespace to a sequential I/O (prefetch) bufferpool. Tables with very high
    read activity may have their tablespaces assigned to a special HOT bufferpool.
    Tablespaces that are assigned to an asynchronous (highly sequential/prefetch)
    bufferpool should be large enough to accommodate the prefetch demand that is placed
    on them, but not excessively large since improving hit ratios and reducing physical
    I/O is unlikely (some exceptions apply). The key point is to remove prefetch I/O
    from your random tablespace so that the random bufferpool memory can be effectively
    used toward reducing physical I/O rates.


    In an OLTP database, the TEMSPACE should be assigned its own bufferpool. Access
    tends to be highly asynchronous, although some synchronous access may also be
    observed, especially when Nested Loop Joins are performed. If your database is
    OLTP, the bufferpool for TEMSPACE need not to be very large, maybe 4–8 MB. A Decision
    Support database, on the other hand, should use one large bufferpool for both
    data and TEMSPACE.


    # Sizing Bufferpools


    In a BI/DW environment, one large bufferpool is ideal. Since I/O will be predominantly
    asynchronous, the primary objective is to ensure that prefetching is effective.
    Compute and monitor APPR for each tablespace, and validate that the APPR is not
    less than 80% of the tablespace''s EXTSIZE. If APPRS are not less than 80% of
    the tablespace''s EXTSIZE, then the bufferpool is too small to accommodate prefetch
    I/O demands (requests) placed upon it. As a rule of thumb, a 512 MB bufferpool
    is a good start.


    In an OLTP database environment, a strategy of using multiple bufferpools that
    separates random I/O from sequential I/O should be used (as discussed in the previous
    sections). The sequential I/O bufferpool again should be sufficiently large enough
    to satisfy the prefetch request demands and this should be measured and verified
    by computing the APPR for each tablespace assigned If the APPR is less than 80%
    of the tablespace''s EXTSIZE, then the size of the sequential I/O bufferpool needs
    to be increased. For tablespaces with mostly random I/O, the DBA should determine
    the optimum bufferpool size as the size that is not too small (results in unnecessary
    physical I/O and slows transactions)'
