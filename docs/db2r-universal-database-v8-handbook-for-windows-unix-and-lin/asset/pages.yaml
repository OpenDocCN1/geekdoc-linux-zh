- img_proc: true
  md: '# Chapter 12 • Understanding and Tuning DB2


    Sort overflows are more difficult to prevent in BI/DW environments with large
    result sets requiring large sorts and therefore large amounts of sort memory.
    This problem is obviated to some extent by the availability of 64-bit addressing
    (larger SORTEAPS) and the onset of larger main memories, but sort overflows may
    not be totally eliminated in these environments, due to just just the sheer amount
    of data involved and other constraints.


    > NOTE

    Database Index ANDing and ORing cause bitmaps to be built in sort-heap. Use DB2
    explain to determine if these types of index access are occurring and monitor
    sortheap and adjust as necessary.


    # SHEAPTHRES


    As previously discussed SHEAPTHRES controls the amount of memory available for
    sort operations across the entire instance. When this threshold is reached, it
    has additional adverse effects on shared and private sorts:


    +   - For shared sorts, it serves as a hard limit and additional shared sorts
    are not allowed until the total sort consumption falls below the SHEAPTHRES values.

    - For private sorts, it serves as a soft limit and as agents request private sortheap,
    DB2 reduces the amount allocated (relative to the initial private SORTEAP value)
    and continues to allocate smaller sortheaps to requesting agents. This of course
    causes degradation in response time but it allows the sort to continue instead
    of the sort being terminated. These are known as Post Threshold sorts and can
    be monitored using snapshot monitoring.


    Obviously, since the efficiency of sort operations are so important to us, how
    can we tell if they are performing satisfactorily? DB2 provides extensive capability
    to monitor sort performance through snapshot and event monitoring.


    # SIZING SORT MEMORY AREAS


    Although DB2 provides default values for the various sort memory areas, these
    values are only intended for initial configuration and should be set based on
    monitoring information or bench-testing.


    You should calculate the initial settings for DB2 sort memory areas as follows:


    SORTEAP—use the default for your OS platform initially but monitor database snapshots
    and if sort overflows are observed, few or no sort overflows are observed. Increase
    the value of the SORTEAP parameter until few. While you are doing this also need
    to consider whether or not the SHEAPTHRES parameter needs to be adjusted. If'
