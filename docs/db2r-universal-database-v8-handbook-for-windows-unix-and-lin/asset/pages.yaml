  md: '# GENERAL CONSIDERATION FOR WRITE-TO-TABLE EVENT MONITORS


    When the CREATE EVENT MONITOR statement is issued, all event monitor target tables
    are created. If the creation of a table fails for any reason, an error is passed
    back to the application program and the CREATE EVENT MONITOR statement fails.
    During CREATE EVENT MONITOR processing, if a table already exists, but is not
    defined for use by another event monitor, no table is created, and processing
    continues. A warning is passed back to the application program.


    > NOTE

    For the write-to-table event monitor, the LOCAL and GLOBAL keywords are ignored
    because event monitor output process or thread is started on each database partition
    in the instance, and each of these processes reports data only for the database
    partition on which it is running.


    A target table can only be used by one event monitor. During CREATE EVENT MONITOR
    processing, if a target table fails to have already been defined for use by another
    event monitor, the CREATE EVENT MONITOR statement fails and an error is passed
    back to the application program. You can tell if a table is already defined for
    use by another event monitor if the table name matches a value found in the SYSSC.EVENTTABLE
    catalog view.


    > NOTE

    DB2 does not drop target tables as part of the DROP EVENT MONITOR statement.


    While an event monitor is running it inserts event records into target tables.
    If an insert fails, uncommitted changes are rolled back, a message is written
    to the administration notification log, and the event monitor is deactivated.


    > TIP

    Make sure the tablespaces being used for your event monitor target tables have
    enough space to handle your requirements. For DMS tablespaces, the PCTDEACTIVATE
    option can specify as a percentage how full the tablespace can be before the event
    monitor automatically deactivates.


    # DB2 Event Analyzer (db2eva)


    The db2 event analyzer tool can be used to analyze event monitor data that has
    been tables using the write-to-table option. It can be used with or without parameters.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '248


    Chapter 10 - Monitoring


