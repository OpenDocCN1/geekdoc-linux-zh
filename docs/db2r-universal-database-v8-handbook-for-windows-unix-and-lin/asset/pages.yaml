    # Instance Memory (instance_memory)


    Instance memory, also referred to as Database Shared Memory, can now be automatically
    managed by DB2. I recommend that the default of automatic be used. Care should
    be taken if you decide to specify this value instead of using the default. Remember,
    monitor heap, FCM resources, Java heap, and control blocks are allocated out of
    _instance_memory.


    # Group Heap Ratio (group_heap_ratio)


    This new parameter specifies the percentage of memory allowed for the shared heap.
    Setting this too low limits the size of caches. Setting it too high could cause
    applications to get an SQL0973 error, which indicates that you are running out
    of application control heap. The default of 70% should be used unless you experience
    performance problems, then you should make adjustments based on stress testing.'
