- img_proc: true
  md: '# SQL Compiler Variables


    | Variable name | Operating system | Values |

    |---|---|---|

    | DB2_HASH_JOIN | All | Default = YES

    | | | Values: YES or NO |


    Specifies hash join as a possible join method when compiling an access plan.


    | DB2_INLIST_TO_NLJN | All | Default = NO

    | | | Values: YES or NO |


    In some situations, the SQL compiler can rewrite an IN list to a join. For example,
    the following query:


    ```

    SELECT *

    FROM EMPLOYEE

    WHERE DEPTNO IN (''D11'', ''D21'', ''E21'')

    could be written as

    SELECT *

    FROM EMPLOYEE,

    (VALUES ''D11'', ''D21'', ''E21'') AS V (DNO)

    WHERE DEPTNO = V.DNO

    ```


    This revision might provide better performance if there is an index on DEPTNO.
    The list of values would be accessed first and joined with a nested loop join
    using the index to apply the join predicate. Sometimes the optimizer does not
    have accurate information to determine the best join method for the query. This
    can occur if the IN list contains parameter markers or host variables that prevent
    the optimizer from using catalog statistics to determine the selectivity. This
    registry variable causes the optimizer to favor nested loop joins to the list
    of values, using the table that contains the IN list as the inner table in the
    join.


    | DB2_LIKE_VARCHAR | All | Default = Y, N

    | | | Values: Y, N, S, or a floating point constant between 0 and 6.2 |


    Controls the collection and use of sublement statistics. These are about the content
    of data in columns when the data has a structure in the form of a series of subfields
    or sublements delimited by blanks. This registry variable affects how the optimizer
    deals with a predicate of the form:


    ```

    COLUMN LIKE ''%%

