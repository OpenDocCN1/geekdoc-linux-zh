- img_proc: true
  md: '# Event Monitor Creation


    Event monitors are created via the CLP or Control Center as a database event object.
    Event monitors can write event records to pipes, files, or tables. The type of
    output mechanism is indicated in the Create Event monitor SQL statement. The following
    criteria to determine what type of output mechanism you should use:


    +   - Transaction volume

    - Planned use for the event data

    - Throughput required

    - CPU capacity

    - Disk storage available

    - Use of third-party vendor tools


    To create an event monitor, you must have either DBADM or SYSADM authority.


    The following command can be used to create a connection event monitor that uses
    default values and writes-to tables:


    ```

    CREATE EVENT MONITOR PGUNN

    FOR CONNECTIONS

    TO TABLE

    ```


    > NOTE

    Event monitors are started and stopped by setting the STATE to I or 0, respectively.


    SET EVENT MONITOR <event monitor name> STATE = 1

    SET EVENT MONITOR PGUN2 STATE = 0


    # Create Event Monitor Options


    Options can be specified on the CREATE EVENT MONITOR statement to control the
    amount of information collected, to determine how the event monitor starts and
    stops, to specify the location and size of output files or pipes, types and size
    of buffers, and scope of the event monitor (local or global).


    We have already discussed the various types of event monitors that can be created.
    We will now focus on major event monitor options and associated details.


    WHERE event condition

    WHERE event condition is used to specify one of three possible event conditions
    as follows:


    APPL_ID specifies the application ID of each connection should be compared with
    the comparison-string in order to determine if the connection should generate
    CONNECTION, STATEMENT, or TRANSACTION events, if specified.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Table Options


    This option can also be used for specific AUTH_IDs or APPL_NAMES. The comparison-string
    is a character string that is compared with the APPL_ID, AUTH_ID, or APPL_NAME
    of each application that connects to the database. If the specific event condition
    is met, event data is captured.


    # WRITE TO


    WRITE TO identifies the target output mechanism that will hold the event monitor
    data. An event monitor can write to a table, pipe, or file. I will briefly describe
    how DB2 event monitors write to files and pipes, and then go into much more detail
    using DB2 event monitors that write to the new event monitor WRITE TO TABLE capability
    in DB2 v8. When writing event monitors to a PIPE, the event monitor writes to
    the pipe in a single stream, as if it were infinitely long file. When writing
    data to a pipe, an event monitor does not perform blocked writes. This is important
    because there is no room in the pipe buffer, the event monitor will discard the
    data. The monitoring application using the pipe must read the data without delay
    to ensure no loss of data.


    > NOTE It is uncommon for DBAs to use pipes for event monitors. This is because
    an application is required to read the data from a pipe; and the application must
    be started in advance of writing data to a pipe. However, it is common for ISV
    tools to use pipes, as they provide an application as part of the tool to read
    the pipe and process the data.


    Using a pipe is very efficient and incurs the lowest amount of overhead on the
    database. However, as indicated, an application is required to read and process
    the data.


    When writing event monitor data to a file (or set of files), the event data streams
    to files, which follow the following naming convention:


    ```

    0000000.evt, 0000001.evt, 0000002.evt ... nnnnnnn.evt

    ```


    unless limited by the MAXFILES option. Even though multiple files may be used,
    the data is treated as one logical file.


    # TABLE OPTIONS


    Table options are used to specify what logical data group elements are written
    to event monitors. If not specified, all data elements are written. The evmGroupInfo
    and evmGroup options can be used to customize and limit the amount of data written
    to target tables.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# NOTE


    Event monitors separate the data stream into one or more logical data groups and
    insert each group into a separate table. Data or groups having a target table
    are kept, whereas data is discarded for groups without tables. Each monitor element
    is mapped to a table column with the same name. Elements without corresponding
    columns are discarded.


    # EVENT MONITOR SCOPE


    An event monitor can have one of two scopes, depending on the database configuration
    used. The following are valid scopes.


    # Global


    A global event monitor reports on all database partitions. As of DB2 v8, only
    event monitors defined on DEADLOCKS and DEADLOCKS WITH DETAILS can be defined
    as GLOBAL.


    # Local


    A local event monitor reports only on the database partition that is running.
    Thus, it only gives information on that particular partition.


    # EVENT MONITOR CATALOG TABLES


    Once an event monitor is created, information is stored in the following SYSCAT
    views:


    +   - SYSCAT.EVENT_MONITORS—Records event monitor definition

    - SYSCAT.EVENT_EVENT—Records event monitor events

    - SYSCAT.EVENTTABLES—Records the names of the event monitor target tables when
    the WRITE TO TABLE option is used


    You can query these tables to check on the status of an event monitor or to get
    event monitor data.


    # Write-to-Table Event Monitors


    As indicated previously, write-to-event monitors are new in v8. The power of this
    capability is DB2 to capture and store event monitor data in a 24 x 7 x 365 environment.
    You can then use this data to conduct performance analysis and retain this data
    for historical and trending purposes. You can also create event monitors to run
    during off-hours in an unattended mode. This fills a void that exists in DB2 until
    v8. When a write-to-table event monitor is created, by default the following 13
    event monitor tables are created:'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Event Monitor Catalog Tables


    +   - CONNHEADER

    - DEADLOCK

    - DLCONN

    - CONTROL

    - DLLOCK

    - STMT

    - SUBSECTION

    - XACT

    - CONN

    - DB

    - BUFFERPOOL

    - TABLESPACE

    - TABLE


    If only a subset of events are specified on the CREATE EVENT MONITOR statement,
    then DB2 will only create tables for those events. DB2 uses the following naming
    convention when creating event monitor tables:


    ```

    schemaname.table name_event_monitor_name

    ```


    For example, if a DBA with a user id of PRODBA issued the following create event
    monitor statement:


    ```

    CREATE EVENT MONITOR PGUN2 FOR CONNECTIONS WRITE TO TABLE

    ```


    then the event monitor tables will be created with a schema of PRODBA and with
    a table suffix of PGUN2 appended to the event monitor table name. The event monitor
    tables would be created as follows:


    ```

    proddba.conn_pgun2

    proddba.connheader_pgun2

    proddba.control_pgun2

    ```


    If specified, the tables will be created in tablespaces as specified by the IN
    tablesName clause. If specified, the tablespaces must already exist. The CREATE
    EVENT MONITOR statement does not create tablespaces.


    See Table 10.7 for a list of event monitor types and associated table names.'
