    # Monitoring Load Operations


    LOAD operations on partitioned databases can be monitored using the LOAD QUERY
    command while connected to the partition of interest. To accomplish this, issue
    the following commands from the CLP for the partition of interest:


    ```

    set client connect_node 3

    connect to ATGW_P

    load query table costly

    ```


    This command will display the contents of all message files that currently reside
    on the partition of interest for the name specified. In conjunction with this
    command, remember to check the db2diag.log for load errors. If errors are detected,
    corrective action must be taken to correct the problem or terminate the load operation.


    # Restarting or Terminating a Failed Load Operation


    Now that we know how to load data and monitor the status of a load operation,
    we need to be prepared to respond to failed load operations. Since downtime is
    very costly and most companies have tight maintenance windows in which to accomplish
    database loads, DBAs must be very familiar with load restart procedures. In fact,
    they should be documented as part of your shop standards and practiced prior to
    first use.


    The ISOLATE_PART_ERRORS option controls how errors are handled when loading data
    into a partitioned database. In general, failures during the setup stage do not
    require a restart or terminate. A failure during the load stage will require a
    LOAD RESTART or LOAD TERMINATE on all partitions involved. This can be broken
    down to actions and procedures to take when a failure occurs during either of
    these stages. Before action can be taken, a failed setup or load must be detected,
    as described in the previous section.


    # Failures During the Setup Stage


    When LOAD_ERRS_ONLY or NO_ISOLATION has been specified for the LOAD operation,
    and a LOAD operation fails on at least one partition then the entire LOAD operation
    will be aborted and the state of the table on each partition will be rolled back
    to the state it was in prior to the LOAD operation. In these instances, there
    is no need to issue a LOAD RESTART or LOAD TERMINATE command.'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# Load Utility Operations


    When SETUP_ERRS_ONLY or SETUP_AND_LOAD_ERRS has been specified for the LOAD operation,
    and a LOAD operation fails on at least one partition during the setup stage, the
    LOAD operation will continue on the partitions where the setup stage was successful,
    the table on each of the failing partitions is rolled back to the state it was
    in prior to the LOAD operation. In this case, there is no need to perform a LOAD
    RESTART or LOAD TERMINATE operation, unless there is also a failure during the
    load stage.


    To complete the LOAD process on the partitions where the LOAD operation failed
    during the setup stage, a LOAD REPLACE or LOAD INSERT operation must be run and
    the OUTPUT_DBPARTNUMS specified so that only the partition numbers of the partitions
    that failed are completed. Let''s use the following example:


    TABLEY is defined on partitions 0 through 4.

    The following LOAD command is issued:


    ```

    load from new.del of del replace into manly partitioned db config

    isolate_part_errs setup_load_errs

    ```


    The LOAD operation fails during the setup stage on partitions 1 and 4. Since setup
    stage errors are being isolated, the LOAD operation will completely successfully
    and will be loaded on partitions 0, 2, and 3. To complete the LOAD operation on
    partitions 1 and 4, the following command should be issued:


    ```

    load from new.del of del replace into manly partitioned db config

    output_dpartnums (1,4)

    ```


    # Failure During the Load Stage


    If a LOAD operation fails on at least one partition during the load stage, a LOAD
    RESTART or LOAD TERMINATE command must be issued on all partitions involved in
    the LOAD operation, regardless of whether or not they encountered errors during
    the LOAD operation. This is because the loading of data in a partitioned environment
    is done through a single transaction. When the LOAD RESTART operation is initiated,
    loading will continue where it left off on all partitions.


    Let''s use the following example:

    Tabdeny is defined on partitions 0 through 4. The following command is issued:


    ```

    load from new.del of del replace into manly partitioned db

    config isolate_part_errs no_isolation

    ```


    The LOAD operation fails during the load stage on partitions 1 and 4. To resume
    the LOAD operation, issue the LOAD RESTART command and specify the same set of
    output options as the original command the LOAD operation must be restarted on
    all partitions:


    ```

    load from new.del of del restart into manly partitioned db

    config isolate_part_errs no _isolation

    ```'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Chapter 13 • Enterprise Server Edition—Database Partitioning Feature


    > NOTE

    For LOAD RESTART operations, the options specified in the LOAD RESTART command
    will be honored, so it is important that they are identical to the ones specified
    in the original LOAD command. If they are not the same restart will fail.


    When the LOAD TERMINATE command is issued after LOAD operation failure during
    the load stage, all work done in the previous LOAD operation will be lost and
    the table on each partition will be returned to the state it was in prior to the
    initial LOAD operation.


    Going back to our first load example, if the partitioned DB CONFIG ISOLATE_PART_ERRs
    and NO_ISOLATION modifiers are specified and a failure occurs in the load stage,
    the LOAD operation can be terminated with the LOAD TERMINATE command that specifies
    the same output parameters as the original command:


    ```

    Load from new.del of del terminate into lousy partitioned db config isolate_part_errs
    no_isolation

    ```


    # ADDING A DATABASE PARTITION


    As corporations grow and new accounts, policies, and so on are acquired or if
    mergers and acquisitions occur, the data in the corporation will grow and the
    partitioned DB2 database will have to grow with the changing appropriate requirements.
    Luckily, DB2 provides mechanisms to add database partitions and redistribute the
    data over the new partitions. New partitions can be added using existing servers
    or new servers can be added. There are two ways to add new partitions to a partitioned
    database:


    +   1. Use the db2nodes.cfg file and manually add the new database partition.

    2. Use the db2start command with the ADDDBPARTITIONNUMBER option.


    After the new partition has been added, the REDISTRIBUTE DATABASE PARTITION GROUP
    command must be issued to rebalance the data across all partitions. For detailed
    information on adding partitions and redistributing data, refer to the DB2 Administration
    Guide: Implementation.


    # Improving Import Performance with Buffered Inserts


    Although not specified DPF, the IMPORT utility can take advantage of buffered
    inserts to improve insert performance. Buffered inserts reduce the amount of network
    message traffic required to accomplish inserts across a network.


    Nonbuffered INSERT processing is serialized across all partitions, which means
    there are waits. With buffered INTS, each row is hashed to an insert buffer at
    the coordinator partition (it is the size of the communication block) with one
    buffer for each partition.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Summary


    After each buffer is filled, it is sent to the target partition. Since INSERTS
    are buffered, significantly fewer network messages are exchanged, resulting in
    improved performance.


    The INSERT BUFFER option of the PREP and BIND commands can be used to enable buffered
    inserts. The IMPORT package must be rebound. This can be accomplished by binding
    the db2uipm.bnd bind file against the database in question. This bind file is
    found in the $INSTHOME/sqlite/bnd directory.


    Although buffered inserts will provide improved IMPORT performance, an error during
    the import will result in the entire block being rolled back. The ROLLBACK will
    be reported asynchronously, and the offending record will not be identified and
    a partial loss of data could occur. Make sure that the input data is valid before
    using BUFFERED INSERTS.


    # SUMMARY


    In this chapter we have discussed partitioned database concepts. Central to DB2''s
    partitioning strategy is partitioning keys and a hashing function. The shared-nothing
    architecture was discussed and presented as the architecture of choice for large
    partitioned databases.


    Version 8 enhancements and new terminology were presented and discussed, and comparisons
    between new and old commands to ease your transition to v8.


    Partitioned database concepts such as partitions, database partition groups, partitioning
    keys, partitioning maps, and basic partitioned database performance concepts were
    presented.


    Design for performance was emphasized in our discussion on collocated tables and
    the various parallel join strategies were highlighted. By following the concepts
    presented in this chapter, you should be able to design and support a partitioned
    database environment.'
  merge: -1
