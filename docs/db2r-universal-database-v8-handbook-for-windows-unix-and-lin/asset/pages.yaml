- img_proc: true
  md: '# Database Global Memory


    The amount of memory specified for package cache is a soft-limit and can be exceeded
    if enough memory is available to the database manager. If this occurs, this is
    called a "package cache overflow" and can be monitored using the monitor element
    pkg_cache_num_overflows and pkg_cache_size_top. If package cache overflows, DB2
    will temporarily borrow memory from locklist, dbheap, or other Database Shared
    Memory. This could result in a reduction in overall database concurrency through
    additional locklist usage or a shortage of dbheap. See the DB2 System Monitor
    Guide and Reference for additional monitor elements relating to package cache.


    If you set package cache too large, memory is wasted and not available for use.
    Carefully select and monitor package cache usage and if it is too large, reduce
    the amount used and allocate it to other important areas, like bufferpools. Use
    benchmarking techniques to determine proper package size.


    # Bufferpool Size (bufferpage)


    This parameter is obsolete in DB2 v8.1.


    # Extended Memory Cache


    Extended Memory Cache can be used when the amount of physical memory available
    exceeds the addressable virtual memory in 32-bit operating systems, which is usually
    2 or 4 GB depending on the operating system. Extended memory cache is associated
    with one or more bufferpools.


    Extended memory cache serves as a "second-level cache" for bufferpools and can
    benefit applications that do lots of reads versus updates. Pages are moved to
    extended memory cache and reused when referenced by an application. Because there
    is a CPU cost associated with managing storage cache, it should only be used if
    your database has an I/O bottleneck and is not CPU constrained.


    # Lock List (locklist)


    The locklist DB CF parameter specifies the amount of global memory that should
    be reserved for storing locks by the lock manager. There is one locklist per database.
    It is also allocated at startup and when the last application disconnects from
    the database. locklist in conjunction with the maxlocks database configuration
    parameter. maxlocks specifies the maximum percentage of locklist that can be used
    by a single application, after which lock escalation occurs. Lock escalation only
    occurs for the application exceeding the maxlocks parameter. Since row level is
    the default isolation level in DB2, escalation can cause a table lock to be taken
    on the row locks will be generated. This frees up locklist memory for use by other
    applications. Lock escalation can also take place if the locklist becomes full.
    Lock escalation reduces the amount of concurrency and should generally be avoided.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Database Heap (dbheap)


    The dbheap parameter specifies the amount of global memory that is allocated for
    storing control blocks for tablespaces, tables, and indexes. There is one dbheap
    per database and it is allocated when the first application connects to the database
    and is freed when the last application disconnects from the database. The log
    buffer and catalog cache are also allocated out of dbheap. The dbheap parameter
    should be set through benchmarking techniques. If the size of the log buffer or
    catalog cache changes, dbheap should be changed accordingly. dbheap usage should
    be monitored on a continuous basis using either snapshot monitoring or third-party
    vendor monitoring tool. Monitoring element db_heap_top can be used to monitor
    dbheap high water mark usage. Additional dbheap monitoring elements can be obtained
    by issuing a snapshot on the Database Manager.


    # Log Buffer (logbufsz)


    logbufsz specifies the size of the log buffer. It is allocated and deallocated
    as part of dbheap. The log buffer is used to hold log records before they are
    written to disk. logbufsz should be in conjunction with database configuration
    parameter mincommit. While logbufsz controls the size of the log buffer, mincommit
    is used to group commits and controls how log records are written to disk. Log
    records are written to disk when one of the following:


    +   - A transaction commits or a group of transactions commit as defined by mincommit

    - The log buffer is full

    - As a result of some other internal database manager event


    The log buffer should be sized as large as possible given available memory and
    so that it is large enough so that it doesn''t fill up during a period of normal
    activity, causing unnecessary commits. Use the below formula to set mincommit
    in in environment:


    | Number of Transactions per second |

    | 10 |


    For example:


    ![](img/961b0d3b0e157406ef7a293880ab928e_227_0.png)


    Use the following command to set mincommit to 10:


    ```

    db2 update DB CFG using mincommit 10

    ```


    This grouping of commits enables DB2 to make efficient use of the log buffer,
    which can significantly affect performance.


    # Catalog Cache (catalogcache_sz)


    catalogcache_sz specifies the total amount of memory that can be allocated for
