  md: '# CHAPTER 10


    # Monitoring


    Regardless of how well a RDBMS performs, the monitoring of SQL statements and
    resources is required to ensure continued good performance and to identify problem
    areas. Using the information gathered, adjustments can be made to instance and
    database configuration parameters, physical design, or SQL to improve performance.
    The nature of RDBMS and their implementation, may lead to frequent occurrences
    of events like group lock escalation, low bufferpool hits, disk I/O activity,
    and out-of-space conditions. A DBA group must have a well-established monitoring
    program to ensure that the database is performing to expectations and that the
    database will continue to meet performance expectations. This includes having
    DBA standards and procedures that address monitoring and outline how the DBA organization
    should conduct monitoring activities.


    DB2 provides built-in monitoring capability through the use of snapshot monitoring
    and event monitoring.


    # ENABLING MONITORING


    Before we go into the details of snapshot monitoring, you need to understand how
    to display and set Database Manager monitor switches. We can see the current settings
    of monitor switches by issuing the GET DEM MONITOR SWITCH or GET MONITOR SWITCH
    command and reviewing the output. See Example 10.1.


    The output of the GET MONITOR SWITCH command shows the status of the seven monitor
    switches at the database level. When DB2 is installed all switches are turned
    off. The dft_monswitches DBM parameters can be changed to enable monitoring switches
    at the instance level. A switch that is on at this level has been on by a monitoring
    application. The date and time that the monitoring switch was enabled is also
    shown. Monitor switches can be turned on by a DBA with the appropriate authority
    by issuing the appropriate command from a command line, or through'
