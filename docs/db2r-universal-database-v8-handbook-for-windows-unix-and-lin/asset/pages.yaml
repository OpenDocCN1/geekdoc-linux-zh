  md: '# Java Thread-Safe Routines


    We added a breakpoint to our UPDATE_SALARY procedure by placing the cursor in
    the location where we want the breakpoint inserted, and clicking on the Add Breakpoint
    button from the toolbar. You can use breakpoints to step through the procedure
    to the breakpoint specified.


    Procedures and UDFs can be deployed via the Development Center to server platforms
    through the DB2 family. After you have successfully created and built a procedure
    or UDF, the next time you enter the Development Center you can select existing
    projects instead of creating a new one, as shown in Figure 4.22.


    ![](img/961b0d3b0e157406ef7a293880ab928e_80_0.png)


    Figure 4.22

    Launching Development Center using an existing project.


    Although I have highlighted the creation of SQL procedures, the Development Center
    supports the development of Java stored procedures and structured types. A new
    Execute Privilege has been included to control who can invoke routines (stored
    procedures, UDFs, and methods).


    > NOTE

    IN v8, SQL procedures are now automatically registered as NOT

    FENCED, NOT FENCED routines now support nesting and recursion

    and NOT FENCED procedures can return result sets.


    # JAVA THREAD-SAFE ROUTINES


    Java stored procedures support recursion in v8 and Java routines can invoke routines
    written in other languages and vice versa. The new threading-model of Java UDFs
    and stored procedures has resulted in significant performance improvements for
    Java-based routines. Instead of creating a'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'JVM for each routine, which was done in previous versions of DB2 prior to v8,
    routines that run as thread-safe now have single fenced process. The resulting
    performance improvement is gained by not having to go through the overhead of
    creating a JVM for each routine.


    # JAVA COMMON CLIENT


    The DB2 internal protocol has been totally rearchitected in v8. The new architecture
    results in a much more streamlined interface. Layers of code have been removed
    and unnecessary memory movements have been eliminated. Significant performance
    improvements have been realized with the new architecture.


    A new-type JDBC driver is provided with the new architecture. It is designed to
    replace the type-3 driver in the area of usability and performance. Support for
    DATALINK as a data type has been added. Unnecessary code page conversion between
    a DB2 client and DB2 server previously connecting to a UNICODE database has been
    eliminated. OUTPUT LOG parameter for CallableStatement had been added. The performance
    of PreparedStatements is improved and FetchSize for ResultSet is supported by
    the type-3 driver.


    The type-2 driver is now JEE certified. It is the driver of application servers
    such as Websphere Application Server. The new SQL profile customizer supports
    the java.sql.Blob and java.sql.Clob types of DB2 2.0, as well as host variable
    expressions.


    # SQL ENHANCEMENTS


    DB8 contains many SQL enhancements to enable DB2 to meet the business demands
    of today''s 24 x 7 x 36 operating environment. Demonstrated Global Tables now
    support the addition of indexes and the ability to run RUNSTATS on Temporary Table
    objects. Several new SQL enhancements have been made and will be addressed later
    in the chapter. User-Maintained Materialized Query Tables provides users with
    the ability to load precomputed data, and they can maintain the refresh of this
    by business rules.


    # Declared Global Table (DGTT) Enhancements


    Significant enhancements have been made to DGTTs. You can create indexes on DGTTs.
    Logging support has been added and rollback of table changes is now supported.
    RUNSTATS can now be run against DGTTs.


    # SQL ASSIST


    Previously only available in the Data Warehouse Center, SQL Assist is now part
    of the base product. SQL Assist is launched from the Command Center. It enables
    you to create SELECT, INSERT, UPDATE, and DELETE statements with expert advice.
    Output and detail panels are available to help you write the SQL statement. Assistance
    is also provided for writing joins and'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# SQL ENHANCEMENTS


    syntax checking is built in. You can copy and paste SQL statements and use SQL
    Assist to for- mat them.


    As with previous releases of DB2, v8 contains several SQL enhancements that will
    help you to develop business applications. Version 8 is compliant with ANSI and
    ISO standards.


    # Instead Of Triggers


    Of Triggers can simplify application programming by allowing developers to code
    inserts, updates, and deletes against views, while the actual update operation
    is redirected to the underlying table.


    # New Built-in Functions


    Twelve new trigonometric functions have been added to the SYSIBM schema. The FETCH
    FIRST ORDER BY statements are supported in subqueries.


    # INFORMATIONAL CONSTRAINTS


    DB2 can use new informational constraints to perform query optimization. When
    informational constraints are defined, you indicate to DB2 whether or not they
    can be used for query optimiza- tion. If enabled, the DB2 optimizer can use the
    values in the informational constraint to better optimize the access plan. Not
    enforcing constraints in the database requires that the application enforce the
    constraint with application logic.


    # INSERT THROUGH UNION ALL VIEWS


    The SQL statement is now supported for views that use a UNION ALL construction,
    in addition to the UPDATE and DELETE capabilities provided in previous releases.


    Insert Through Union All Views can be used to accomplish range partitioning via
    a combination of check constraints and use of separate table spaces. This provides
    a flexible solution to the 64 GB per table by allowing you to break up a large
    table into smaller tables and by placing each table into a separate table space.
    Through the use of a check constraint on a data range, the DB2 optimizer can determine
    which table to access.


    # SUMMARY TABLES


    A summary table is a table whose definition is based on the result of a query
    and whose data is in the form of precomputed tables that are taken from one or
    more tables on which the summary table definition is based.'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'Since summary tables contain precomputed results, they can be used to significantly
    improve the performance of queries running against data that is not summarized.
    For example, instead of scanning a large daily sales table to procedure a monthly
    sales report, a summary table can be defined to summarize sales and DB2 use the
    summary table to get the results instead of scanning a very large table to first
    get the data and summarize it. The DB2 optimizer will determine at run time whether
    or not to use a summary table. If it decides a query will benefit from using a
    summary table, the optimizer will develop an access strategy using its query rewrite
    capability.


    A table definition whose fullselect contains a GROUP BY clause is summarizing
    data from tables referenced in the fullselect. This type of summary table, is
    a special type of Materialized Query Table (MQT), new in v8.


    A summary table is created using a CREATE TABLE statement. The following is an
    example of a CREATE TABLE statement to create a summary table:


    ```

    CREATE SUMMARY TABLE SALES SKU AS (SELECT sku,

    SUM(qty) as QTY,

    SUM(class) as CLASS

    From Daily_Sales Group by sku)

    Data Initially Deferred

    Refresh Deferred

    ```


    In the above example, the keyword summary is used to indicate that this is a summary
    table. If it is omitted, DB2 will still recognize this as a summary table as a
    result of the keyword.


    > NOTE

    Summary tables can only be accessed when using Dynamic SQL.


    There are two ways to update the data in the summary table: Refresh Deferred or
    Refresh Immediate. This option is specified on the CREATE TABLE statement using
    one of the refresh options:


    +   * Refresh Deferred—the data in the table is refreshed when a REFRESH TABLE
    statement is executed.

    * Refresh Immediate—the changes made to the underlying tables as part of a DELETE,
    INSERT, or UPDATE statement are cascaded to the summary table immediately.


    The DATA INITIALLY DEFERRED clause means that the data is not inserted at Create
    Table time, but when the REFRESH TABLE statement is executed.


    > NOTE

    System maintained summary tables cannot be directly modified by the INSERT, UPDATE,
    or DELETE statement.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# CURRENT REFRESH AGE SPÉCIAL REGISTER


    The CURRENT REFRESH AGE special register specifies a timestamp duration value
    with a data type of (20, 6). This duration represents the maximum duration since
    a REFRESH DEFERRED.


    It is used by the optimizer to determine if the summary table can be used to optimize
    the query. Use SET CURRENT REFRESH AGE to change the value of the Current Refresh
    Age special register.


    NOTE

    Summary tables are represented by type s in the DB2 catalog.


    +   * Zero (0) means that only summary tables defined with REFRESH IMMEDIATE may
    be used to optimize the query.

    * 99999999999999 (9,999 years, 99 months, 99 days, 99 hours, 99 minutes, and 99
    seconds) OR ANY means any summary tables defined with REFRESH.

    * DEFERRED or REFRESH IMMEDIATE may be used to optimize the processing of a query.


    The initial value of the Current Refresh Age is 0. To enable the optimizer to
    consider using the deferred refresh summary tables, you have to set the CURRENT
    REFRESH AGE Special Register to ANY. This can be done using the SET CURRENT REFRESH
    AGE ANY statement.


    There are several limitations on Summary Tables. Refer to the DB2 SQL Reference
    for further information.


    # MATERIALIZED QUERY TABLE (MQT)


    The definition of an MQT is a table whose definition is based on the result of
    the query, and whose data is in the form of precomputed results that are taken
    from one or more tables on which the MQT definition is based. The definition of
    an MQT contains joins, functions, and other SQL statements that are not allowed
    in summary tables.


    The following is an example of an MQT:


    ```

    CREATE SUMMARY TABLE POAMT

    AS (SELECT VENDOR, CODE, CLASS, SKU

    FROM V, SKU S

    WHERE V.CODE = S.CLASS)

    DATAITIALLY DEFERRED

    ```


    REFRESH DEFERRED;


    The MQT can be used to prejoin tables together. This allows the optimizer to bypass
    the join if the MQT contains the columns and rows that it needs.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# USER-MAINTAINED MQTS


    New in v8, user-maintained MQTs enable you to load precomputed data into a user-defined
    summary table.


    > NOTE

    User-maintained summary tables make it easier for Oracle users to migrate to DB2.


    The primary difference between a system-maintained summary table and the creation
    and loading of the table is under user control.


    Since the data is generated by the user, it is not refreshed by DB2. It is the
    user’s responsibility to periodically update the table based on your particular
    business rules. Use the MAINTAINED BY USER option on the CREATE SUMMARY TABLE
    statement to create a user-maintained summary table. INSERT INTO UMST_INVOICE

    The following is an example of how to load a user-maintained summary table:


    ```

    INSERT INTO UMST_INVOICE

    SELECT * FROM

    (SELECT VENDOR, COUNT(*) SUM (INV_AMT)

    FROM INVOICE

    GROUP BY VENDOR )

    ```


    AS V;

    To prevent other summary tables from being used while loading the table, you can
    use the following command:

    SET CURRENT MAINTAINED TABLE TYPES FOR OPTIMIZATION = NONE;


    Set this register to ALL when you have completed loading the user-maintained summary
    table. Also, don''t forget to set the CURRENT REFRE special register to ANY so
    that the optimizer will consider the summary table for optimization.


    > NOTE

    Insert, Update, and Delete statements can be used to modify and delete data in
    a user-maintained MQT.


    # EXTENSIBLE MARKUP LANGUAGE (XML)


    The XML Extender is provided with DB2 and allows you to store XML documents as
    a new column data type. DB2 also has the ability to decompose and store XML in
    its component parts as columns in multiple tables. Indexes can be defined on XML
    columns for fast retrieval. Furthermore, text search and section searches can
    be done on the XML column or its decomposed parts'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'via the DB2 Net Search Extender. XML documents can be formulated from existing
    DB2 tables to enable business-to-business (B2B) transactions.


    With these capabilities and DB2''s support of Web Services Object Framework (WORF),
    DB2 can serve as both a provider and consumer of Web services.


    # SUMMARY


    The DB2 Development Center is an integrated development environment that offers
    developers a standard platform from which to develop applications for DB2. Visual
    Explain, used in conjunction with Design Advisor, enables you to develop top performing
    applications. Summary tables, MQTs, and user-maintained MQTs offer you opportunities
    with which to obtain significant performance improvements. DB2, through its strong
    support of XML, enables DB2 to serve as a provider or consumer of Web services.'
  merge: -1
