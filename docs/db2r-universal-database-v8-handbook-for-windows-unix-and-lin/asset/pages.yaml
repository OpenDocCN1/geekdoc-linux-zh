    or an earlier application were run in a DB2 v2.1.2 or later environment, DB2DEFPREP
    could be used to indicate the desired "deferred prepare" behavior.


    | DB2_DJ_COMM | All | Default = null Values include: libdrda.a, libsqnet.a, libnet8.a,
    libdrda.dll, libsqnet.dll, libnet8.dll, and so on |


    Specifies the wrapper libraries that frequently loaded when the database manager
    is started. Specifying this variable reduces the runtime cost of frequently used
    wrappers. For other operating systems are supported (.dll extension is for the
    Windows NT operating system; .a extension is for the AIX operating system). Library
    names vary by protocol and operating system. This variable is unavailable unless
    the database manager parameter is set to YES.


    | DB2DMNBCKTLLR | Windows NT | Default = null Values: ? or a domain name |


    If you know the name of the domain for which the DB2 server is the backup controller,
    set DB2DMNBCKTLLR = DOMAIN_NAME. The DOMAIN_NAME must be in upper case. Have DB2
    determine the domain for which the local machine is a backup controller, DB2DMNBCKTLLR
    profile variable is not set or set to link, DB2 performs authentication at the
    primary domain controller.


    > Note: DB2 does not use an existing backup domain controller for default because
    a backup domain controller can get out of synchronization with the primary domain
    controller, causing a security exposure. Getting out of synchronization can occur
    when the primary domain controller''s security database is updated but the changes
    are not propagated to a backup controller. This could occur if there are network
    latencies or if the computer browser is not operational.


    | DB2_ENABLE_LDAP | All | Default = null Values: YES or NO |


    Specifies whether or not the Lightweight Directory Access Protocol (LDAP) is used.
    LDAP is an access method to directory services.


    | DB2_FALLBACK | Windows NT | Default = ON Values: ON or OFF |


    This variable allows you to force all database connections off the falling back
    process. It is used in conjunction with the failover support in the Windows NT
    environment with Microsoft Cluster Server (MSCS). If DB2_FALLBACK is not set or
    set to OFF, database connection exists during the fallback, the DB2 resource cannot
    be brought off. This will mean the fallback processing will fail.'
  merge: -1
  pgno: 481
- img_proc: true
  md: '# Miscellaneous Variables


    | Variable name | Operating system | Values |

    | --- | --- | --- |

    | DB2_GRP_LOOKUP | Windows NT | Default = null

    Values: LOCAL, DOMAIN |


    This variable is used to tell DB2 where to validate user accounts and perform
    group member lookup. Set the variable to LOCAL to force DB2 to enumerate groups
    and validate user accounts on the DB2 server. Set the variable to DOMAIN to force
    DB2 to enumerate groups and validate user accounts on the Windows NT domain where
    the user account belongs.


    | DB2LDAP_BASED | All | Default = null |

    | --- | --- | --- |

    Values: Any valid base domain |


    Specifies the base domain name for the LDAP directory.


    | DB2LDAPCACHE | All | Default = YES |

    | --- | --- | --- |

    Values: YES or NO |


    Specifies that the LDAP cache is enabled. This cache is used to catalog the database,
    node, and DCS directories on the local machine.

    to ensure that you have the latest entries in the cache, do the following:


    ```

    REFRESH LDAP DB DIR

    REFRESH LDAP NODE DIR

    ```


    These commands update and remove incorrect entries from the database directory
    and node directory.

    | DB2LDAP_CLIENT_PROVIDER | Windows 98/NT/2000 only | Default = null (Microsoft,
    if available, is used; otherwise, IBM is used) Values: IBM or Microsoft |


    When running in a Windows environment, DB2 supports using either Microsoft LDAP
    clients or IBM clients to access the LDAP directory. This registry variable is
    used to explicitly select the client to be used by DB2.

    Note: To display the current value of this registry variable, the db2set command:


    ```

    db2set DB2LDAP_CLIENT_PROVIDER

    ```


    | DB2LDAPHOOST | All | Default = null |

    | --- | --- | --- |

    Values: Any valid hostname |


    Specifies the hostname of the LDAP directory.


    | DB2LDAP_SEARCH_SCOPE | All | Default = DOMAIN |

    | --- | --- | --- |

    Values: LOCAL, DOMAIN, GLOBAL |


    Specifies the search scope for information found in partitions or in the Lightweight
    Directory Access Protocol (LDAP). *LOCAL* disables searching in the LDAP directory.
    *DOMAIN* only searches in LDAP for the current directory partition. *GLOBAL* searches
    in LDAP for the current directory partition until the object is found.


    | DB2LOADREC | All | Default = null |


    Used to override the location of the load copy during roll forward. If the user
    has changed the physical location of the load copy; DB2LOADREC must be set before
    issuing the roll forward.'
  merge: -1
  pgno: 482
- img_proc: true
  md: '# Appendix D - DB2 Registry and Environmental Variables


    | Variable name | Operating system | Values |

    |---|---|---|n| DB2LOCK_TO_RB | All | Default = null Values: Statement |


    Specifies when lock timeouts cause the entire transaction to be rolled back, or
    only the current statement. If DB2LOCK_TO_RB is set to STATEMENT, locked timeouts
    cause only the current state to rolled back. Any other setting results in transaction
    rollback.


    | Variable name | Operating system | Values |

    |---|---|---|n| DB2NEWLOGPATH | UNIX | Default = 0 Values: 0 or 1 |


    This parameter allows you to specify whether a secondary path be used to implement
    dual logging. The secondary path name is generated by appending a “2” to the current
    value of the logpath database configuration parameter.


    | Variable name | Operating system | Values |

    |---|---|---|n| DB2NOEXITLIST | All | Default = OFF Values: ON or OFF |


    If defined, this variable indicates to DB2 not to install an exit list handler
    in applications and not to perform a COMMIT. Normally, DB2 installs a process
    exit list handler in applications and the exit list handler performs a COMMIT
    operation if the application ends normally. For applications that dynamically
    load the DB2 library and unload before the application terminates, the invocation
    of the exit handler fails because the handler is no longer loaded in the application.
    If your application operates in this way, you should the DB2NOEXITLIST variable
    ensure and your application explicitly invokes all required COMMITS.


    | Variable name | Operating system | Values |

    |---|---|---|n| DB2REMOTEPEG | Window NT | Default = null Value: any valid Windows
    95 or Windows NT machine name |


    Specifies the remote machine name that contains the Windows32 registry of DB2
    instance profiles and DB2 instances. The value for DB2REMOTEPEG should only be
    set once after DB2 is installed, and should not be modified. Use this variable
    with extreme caution.


    | Variable name | Operating system | Values |

    |---|---|---|n| DB2ROUTINE_DEBUG | AIX and Windows NT | Default = OFF Values:
    ON, OFF |


    Specifies whether to enable the debug capacity for Java stored procedures. If
    you are not debugging Java stored procedures, use the default, OFF. There is a
    performance impact to enable debugging.


    | Variable name | Operating system | Values |

    |---|---|---|n| DB2SORCVBUF | Windows NT | Default = 32767 |


    Specifies the value of TCP/IP receive buffers on Windows NT operating systems


    | Variable name | Operating system | Values |

    |---|---|---|n| DB2SORT | All, server | Default = null |


    Specifies the location of a library to be loaded at runtime by the LOAD utility.
    The library contains the entry points for using in sorting index. DB2SORT to export
    vendor-supplied products for use with the LOAD utility in generating table indexes.
    The path supplied must be relative to the database server.'
  merge: -1
  pgno: 483
- img_proc: true
  md: '# Miscellaneous Variables


    | Variable name | Operating system | Values |

    |---|---|--|

    | DB2SYSTEM | Windows and UNIX | Default = null |


    Specifies the name that is used by your users and database administrators to identify
    the DB2 server system. If possible, this name should be unique within your network.


    This name is displayed in the system level of the Control Center''s object tree
    to aid administrators in the identification of server systems that can be administered
    from the Control Center.


    When using the "Search the Network" function of the Client Configuration Assistant


    +   - On Windows NT setup program sets it equal to the computer name specified
    for the Windows system.

    - On UNIX systems, it is set equal to the UNIX system''s TCP/IP hostname.


    | DB2_VENDOR_INI | AIX, HP-UX, Sun Solaris, Default = null |

    | and Windows | Values: any valid path and file |


    Points to a file containing all vendor-specific environment settings. The value
    is read when the database manager starts.


    | DB2_XBSA_LIBRARY | AIX, HP-UX, Sun Solaris, Default = null |

    | and Windows | Value: any valid path and file |


    Points to the vendor-supplied XBSA library. On AIX, the setting must include the
    shared object if it is not named shr.o. HP-UX, Sun Solaris, and Windows NT do
    not require the shared object name. For example, to use Legacy''s NetWorker Business
    Suite Module for DB2, the registry variable must be set as follows:


    ```

    db2set.DB2_XBSA_LIBRARY="usr/lib/libxdb2.a (bsashr10.0) "

    ```


    The XBSA interface can be invoked through the BACKUP DATABASE or the RESTORE DATABASE
    commands. For example:


    ```

    db2 backup db sample use XBSA

    d2 restore db sample use XBSA

    ```'
