    +   - ROLLFORWARD

    Lists roll-forward operations.


    +   - DROPPED TABLE

    Lists dropped table records.


    +   - LOAD

    Lists load operations.


    +   - CREATE TABLESPACE

    Lists tablespace create and drop operations.'
