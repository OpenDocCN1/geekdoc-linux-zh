  md: "# CHAPTER\n\n# # ProblemnDetermination\n\nGood problem determination skills\
    \ are required for you to be a successful DBA. Even with continued improvements\
    \ in DB2 and client applications, problems still occur and you will need to know\
    \ how to identify and locate problems quickly.\n\nYou should develop standard\
    \ troubleshooting procedures for your environment. If you document and practice\
    \ these procedures when investigating problems, you will be able to routinely\
    \ identify and solve problems in a short amount of time. This will enable you\
    \ to help your company maintain or improve their competitive advantage. Remember,\
    \ downtime costs money and reflects negatively on your company.\n\nThere are several\
    \ categories that we can use to categorize problems. They are:\n\n+   - Connectivity\
    \ problems\n- Performance problems\n  - stall, hang, or loop\n- Application problems\n\
    \  - Inefficient SQL\n  - Unsupported functions being used\n  - Application changes\n\
    - DB2 code (defect) problems\n\n# CONNECTIVITY PROBLEMS\n\nConnectivity problems\
    \ are by far the most common problems you will experience. They usually be isolated\
    \ to either the client or the server. Some of the most common problems are:\n\n\
    +   - Client can't connect to the database\n- UserID and password problems\n-\
    \ Communication errors"
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Chapter 11 • Problem Determination


    +   - Database not cataloged

    - Lack of authorization

    - network changes

    - Driver problems

    - Intermittent connectivity problems

    - Database down

    - Instance down

    - DB2COMM environmental variable not set properly

    - DB2 TCP/IP Service Name (svcname) DBM CFG parameter not set

    - Network changes made and not communicated throughout the organization

    - Connections hanging or being interrupted


    When investigating these types of problems, ask the following questions to help
    isolate the problem:


    +   - Is this the first time you have had this problem?

    - Can anyone else using the same application connect to the database?

    - Can you connect or run the application from another PC?

    - Are other people using the same applications to connect or are they experiencing
    the problems?

    - Does the problem happen all the time or is it intermittent?

    - Can you recreate the problem? If not, how frequently does it occur?

    - Can it be recreated in a test environment?


    After asking these questions, you should have obtained enough information to isolate
    the problem to the client, application, or database. Also, during this fact finding,
    you can be testing connections to the database in question, verifying that the
    instance is up and the database is available. If your quick tests do not reveal
    any problems, immediately check the db2diag.log and administration notification
    log on the server for errors.


    If errors are found, investigate those errors using the Information Center and
    messages codes manual. If no errors are found, then look at the db2diag.log. You
    will typically find errors on the client you eliminated as the server. Look up
    error messages in the Information Center or messages and codes manual. Take action
    as indicated. If this still does not point to the problem, you will need to run
    a CLI/JDBC/ODBC trace on the client. An example of how to enable a CLI trace can
    be found later in this chapter.


    # NOTE


    CLI traces are very valuable in identifying all types of problems. For additional
    information refer to the DB2 problem determination tutorial on the Web.

    As of DB2 v8, the DB2 Troubleshooting Guide is no longer a separately published
    manual. Much of the former manual was as well as DB2 internal return codes have
    been incorporated into the new DB2 Information Center and are available on the
    Web.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# PERFORMANCE AND APPLICATION PROBLEMS


    Performance problems are the second most often type of problem reported. The most
    common performance problems are usually the result of some type of change to the
    application, lack of RUNSTATS, change to the database configuration, or possibly
    the application was never tuned in the first place. I have included application
    problems in this section because many times performance and application problems
    are interrelated. Additional typical areas are long-running SQL, sort overflows,
    OS paging, high I/O wait times, and undersized bufferpools. When investigating
    performance problems ask the following questions:


    +   - When did the problem occur?

    - What is the nature of the problem?

    - Can it be reproduced?

    - Is the problem related to a specific PC or server?

    - How long did the query normally run in the past?

    - Were there any changes made to the application? If so, what changes were made?

    - Is the problem related to a single table or tablespace?

    - Was the query explained and if what access path is it using? Has it changed?

    - Did performance degrade suddenly, or was it a gradual progression to an unacceptable
    level?


    To long-running or suboptimal SQL, use snapshots and event monitoring. When the
    SQL is identified, use Design Advisor and Visual Explain to determine if the access
    path can be improved with either index changes, additional indexes, or through
    changes to the SQL. By using Visual Explain (or any other type of DB2 file) and
    Design Advisor, all of these problems should be able to be resolved. Additionally,
    a combination of snapshot and event monitoring data can be used to identify sort
    problems and provide bufferpool performance data. Many sort problems can be eliminated
    by tuning SQL and by creating or modifying indexes.


    To ensure that RUNSTATS are current for the objects involved, you can use the
    Control Center to review whether or not RUNSTATS are current or to determine if
    they have ever been run. RUNSTATS can be executed from the Control Center, Command
    Center, or CLP.


    # DB2 CODE (DEFECT) PROBLEMS


    At times, you may experience any of the categories of problems highlighted at
    the beginning of this chapter due to DB2 defects. These are relatively infrequent,
    but you need to know where to look for information concerning your particular
    problem.


    These errors are typically written to the db2diag.log file. DB2 supports a DB2
    support page on the Internet at www.3.ibm.com/cgi-bin/db2www/data/udb/wino>2unit/support/index.d2w/report.
    See Figure 11.1 for a view of the DB2 support site.'
