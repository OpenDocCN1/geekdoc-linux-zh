- img_proc: true
  md: '# PARTITIONED DATABASE JOIN STRATEGIES


    > TIP\Always use colocated tables for good performance.


    Chapter 3 discussed join concepts and strategies for nonpartitioned databases.
    In this section we''ll discuss partitioned database join strategies. As shown
    in Table 13.3, there are six basic partitioned join strategies.


    Table 13.3 Partitioned Database Join Attributes


    | Join Strategy | Outer Table | Inner Table |

    |---|---|--|

    | Colocated Table Join | Temporary Table | Temporary Table |

    | Directed Inner Table Join | Temporary Table | Table Queue Hashed |

    | Directed Outer Table Join | Table Queue Hashed | Table Queue Hashed |

    | Directed Inner and Outer Table Join | Table Queue Hashed | Table Queue Hashed
    |

    | Broadcast Inner Table Join | Temporary Table | Table Queue Broadcast |

    | Broadcast Outer Table Join | Table Queue Broadcast | Temporary Table |


    We''ll discuss each one in detail and look at the associated performance impacts
    of each strategy.


    # Directed Inner Table Join Strategy


    With the directed inner join strategy, it may only be chosen as the join strategy
    when there are equijoin predicates on all partitioning key columns of the two
    partitioned tables. With the directed inner join strategy, the rows of the inner
    table are directed to the set of database partitions based on the hashed values
    of the joining columns. Once the rows are relocated to the database partitions,
    the join between the two tables occurs on these database partitions. In Figure
    13.11, we can examine sequence and flow of the directed inner join strategy.


    The sequence of activity in a directed inner table join strategy is as follows:


    +   1. The coordinator node receives the request from the application.

    2. The coordinator node sends the request to all partitions involved.

    3. The partitions scan the outer table and apply any predicates to the intermediate
    result set.

    4. The partitions hash the join columns of the inner table that correspond to
    the outer table''s partitioning key.

    5. Based on the hashed values, the rows are then sent via a table queue to the
    partitions involved.'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Partitioned Database Join Strategies


    303


    ![](img/961b0d3b0e157406ef7a293880ab928e_328_0.png)


    **Figure 13.11**

    Directed inner join strategy.


    +   6. The target partitions receive the inner rows via a table queue.

    7. The receiving partitions scan the outer table and apply any predicates.

    8. The partitions then perform a join of the received inner table rows and the
    outer table.

    9. The partitions then send the results of the join back to the coordinator partition.

    10. The coordinator partition performs any final processing and returns the results
    to the requesting application.


    An explainat of the directed inner table join strategy will always show the outer
    table as a temporary table and the inner table as a table queue that has been
    hashed to the target partitions. With a *directed outer table join strategy*,
    the processing is the same except that the table that was directed to the target
    database partitions based on the hashed value of the joining columns is taken
    by DB2 as the outer table of the join.'
