  md: '# Command Parameters


    DATABASE database-alias


    Specifies the alias of the database to be migrated to the currently installed
    version of the database manager.


    USER username


    Identifies the user name under which the database is to be migrated.


    USING password


    The password used to authenticate the user name. If the password is omitted, but
    a user name was specified, the user is prompted to enter it.


    # Examples


    The following example migrates the database cataloged under the database alias:


    db2 migrate database sales


    # Utility Guidelines and Exceptions


    This command will only migrate a database to a newer version, and cannot be used
    to convert a migrated database to its pervious version.


    The database must be cataloged before migration.


    If an error occurs during migration, it may be necessary to issue the TERMINATE
    command before attempting the suggested user response. For example, if a log error
    occurs during migration (SQL1704: Database migration failed. Reason code “3”),
    it will be necessary to issue the TERMINATE command before increasing the values
    of the database configuration parameters PRIMARY AND LOGFILES. The CLP must refresh
    its database directory cache if the migration failure occurs after the database
    has already been relocated (which is likely to be the case when a “log full” error
    returns).


