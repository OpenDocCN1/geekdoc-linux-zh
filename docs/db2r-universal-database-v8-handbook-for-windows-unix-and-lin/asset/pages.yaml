    # SQL COMPILER VARIABLES


    | Variable name | Operating system | Values |

    | DB2_ANTIJOIN All | Default = NO in an ESE envrionment Default = YES in a non-ESE
    envriononment Values: YES or NO |


    For DB2 Universal Database ESE environments: when YES is specified, the optimizer
    searches for opportunities to transform NOT EXISTS subqueries into anti-joins,
    which can be processed efficiently by DB2. For non-ESE environments: when NO is
    specified, the optimizer limits the opportunities to transform NOT EXISTS subqueries
    into anti-joins.


    | DB2_CORRELATED_PREDICATES All | Default = YES Values: YES or NO |


    The default for this value is YES. When there are unique indexes on correlated
    columns in a join, this registry variable is YES, the optimizer detects and compensates
    for correlation of join predicates. When this registry registry variable is YES,
    the optimizer uses the KEYCARD information of unique index statistics to detect
    cases of correlation, and dynamically adjusts the combined selectivities of the
    correlated predicates, obtaining a more accurate estimate of the join size and
    cost. Adjustment is done for correlation of simple equality predicates like WHERE
    C1=5 AND C2=10 if there is an index on C1 and C2. The index need not be unique
    but the equality predicate must cover all the columns in the index.'
