- img_proc: true
  md: '# Utility Heap (util_heap_sz)


    Utility heap specifies the maximum amount of memory that can be concurrently used
    by the backup, restore, recovery, and load utility. It is allocated when needed
    by a utility and freed when no longer needed by the utility. This parameter generally
    has a low effect on performance.


    # Backup Buffer (backbufsz)


    This parameter is now obsolete in DB2 v8. Backup buffers are now explicitly specified
    as part of the backup command.


    # Restore Buffer (restbufsz)


    This parameter is now obsolete in DB2 v8. Restore buffers are now explicitly specified
    on the restore command.


    # Package Cache Size (pckcachesz)


    Package cache size specifies the amount of memory allocated for caching dynamic
    and static SQL. Allocated at database startup and shutdown. DB2 uses package cache
    to eliminate the access to the DB2 catalog to load a package for static SQL or
    eliminate the prepare for dynamic SQL. SQL statements are stored in the cache
    (in memory) if the amount of cache available is greater than that to store concurrently
    executing SQL. If not, DB2 will not cache SQL. Package sections remain cached
    until the database is shut down, the statement becomes invalidated, or the new
    flush PACKAGE cache command is issued.


    > DB2 uses direct IO to load a package from the catalog if it is not found in
    package cache, which bypasses the bufferpool and is much slower than reading packages
    from the package cache. So to have a well-performing database it''s important
    to make maximum use of the package cache.


    > DB2 matches cached SQL byte by byte. Dynamic SQL should use parameter markers
    instead of literals, which will result in DB2 getting a match in the cache (cache
    hit) and improved performance.


    Package cache is more important in OLTP implementations than in business warehousing
    implementations as OLTP transactions tend to be executed repeatedly versus BI
    transactions, which tend to be more ad-hoc and executed less frequently.'
