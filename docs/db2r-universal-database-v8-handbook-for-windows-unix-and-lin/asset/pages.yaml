    # Example 5


    There are three database partitions: 0, 1, and 2. Tablespace TBS1 is defined on
    all partitions, and tablespace TBS2 is defined on partitions 0 and 2. After restoring
    the database on database partition-1, and TBS1 on database partitions 0 and 2,
    roll the database forward on database partition 1:


    ```

