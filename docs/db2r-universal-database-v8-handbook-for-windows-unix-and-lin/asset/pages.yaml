  md: '# END OF LOGS


    Specifies that all committed transactions from all online archive log files listed
    in the database configuration parameter logpath are to be applied.


    # ALL DEPARTITIONNUMS


    Specifies that transactions are to be rolled forward on all partitions specified
    in the db2node.cfg file. This is the default if a database partition clause is
    not specified.


    # EXCEPTION


    Specifies that transactions are to be rolled forward on all partitions specified
    in the db2nodes.cfg file, except those specified in the database partition list.


    # ON DEPARTITIONNUM/ON DEPARTITIONNUMS


    Roll the database forward on a set of database partitions.


    # db-partition-number1


    Specifies a database partition number in the database partition list.


    # db-partition-number2


    Specifies the second database partition number, so that all partitions from db-partition-number1
    up to and including db-partition-number2 are included in the database partition
    list.


    # COMPLETE/STOP


    Stops the rolling of log records, and completes the roll-forward recovery process
    by rolling back any incomplete transactions and turning off the roll-forward pending
    state of the database. This allows access to the database or tablespaces that
    are being rolled forward. These keywords are equivalent; specify one or the other,
    but not both. The keyword AND permits specification of multiple operations at
    once; for example, db2 rollforward db to end of logs and complete.


    > NOTE When rolling tablespaces forward to a point in time, the tablespaces are
    placed in backup pending state.


    # CANCEL


    Cancels the roll-forward recovery operation. This puts the database or one or
    more tablespaces on all partitions where forward recovery has started in restore
    pending state:


    +   * If a database roll-forward operation is not in process (i.e., the database
    is in roll-forward pending state), this option puts the database in restore pending
    state.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Chapter 7 • Utilities and Commands


    +   - If a tables roll-forward operation is not in progress (i.e., the tablespaces
    are in roll-forward pending state), a tablespace list must be specified. All tablespaces
    in the list are put in restore pending state.

    - If a tablespace roll-forward operation is in progress (i.e., at least one tablespace
    is in roll-forward progress state), all tablespaces that are in roll-forward progress
    state are put in restore pending state. If a tablespace list is specified, it
    must include all tablespaces that are in roll-forward progress state. All tablespaces
    on the list are put in restore pending state.

    - If rolling forward to a point in time, any tablespace name that is passed is
    ignored, and all tablespaces that are in roll-forward progress state are put in
    restore pending state.

    - If rolling forward to the end of the logs with a tablespace list, only the tablespaces
    are put in restore pending state.


    This option cannot be used to cancel a roll-forward operation that is actually
    running. It can only be used to cancel a roll-forward operation that is in progress
    but not actually running at the time. A roll-forward operation can be in progress
    but not running if:


    +   - It terminated abnormally.

    - The STOP option was not specified.

    - An error caused it to fail. Some errors, such as rolling forward through a nonrecoverable
    load operation, can put a tablespace into restore pending state.


    > NOTE

    Use the CANCEL option with caution, and only if the roll-forward operation is
    in progress cannot be completed because some of the tablespaces have been put
    in roll-forward pending state or in restore pending state. When doubt, use the
    LIST TABLESPACE command to identify the tablespaces that are in roll-forward progress
    state, or in roll-forward pending state.


