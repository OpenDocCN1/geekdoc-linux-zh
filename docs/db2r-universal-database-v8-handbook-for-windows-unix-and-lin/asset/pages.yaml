  md: '# Chapter 9 • Tuning Configuration Parameters


    +   - keepdari—This has been replaced by the keepfenced parameter.

    - max_logicagents—This has been replaced by the max_connections parameter, which
    is used to enable connection concentration.

    - maxdari—This has been replaced by the fenced_pool parameter.

    - num_initdari—This has been replaced by the num_initfenced parameter.

    - restbufsz—Like the backbufsz parameter, restbufsz must now be explicitly specified
    on the restore command.

    - ss_logon—Previously applied to OS/2, which is no longer supported.

    - udf_mem_sz—UDFs now pass data in shared memory so udf_mem_sz is no longer required.


    DB CFG parameters:


    +   - buffpage—This parameter provided the default bufferpool size in pages if
    explicitly stated on the create bufferpool command in first releases; in v8 it
    must be explicitly specified on the create bufferpool command.

    - copyprotect—An old parameter used for copy protection on non-UNIX platforms.

    - indexsort—Previously, this parameter specified whether or not DB2 would sort
    entries during index creation; in v8, DB2 will only use sort during index creation
    if intra_parallel is enabled on an SMP server.


    > NOTE

    BM and DB CFG files should not be directly edited.They should be updated through
    the Control Center or from a command line. Direct editing may render your database
    inoperable.


    With my experience, feedback from DBAs during consulting engagements, and from
    presentations I''ve given at DB2 user groups indicates that additional information
    is needed in the field on setting and tuning configuration parameters. This chapter
    concentrates on tuning key DBM and DB CFG parameters. For a complete list of all
    parameters, refer to the DB2 UDB v8 Administration Guide: Performance.


    # AUTOMIC COMPUTING


    With the advent of Autonomic Computing, IBM is helping DBAs to be more productive
    in this era of “do more with less.”


    Autonomic computing is a term coined from the body’s nervous system where body
    processes such as breathing, blood flow, and body temperature are automatically
    managed.


    In v8, several DBM and DB CFG parameters can be set to automatic and DB2 will
    monitor and adjust values for these parameters automatically. These parameters
    will be identified later in this chapter.'
