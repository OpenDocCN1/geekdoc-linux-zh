  md: '# Chapter 6 • High Performance Tablesspace Design and I/O Strategies


    ![](img/961b0d3b0e157406ef7a293880ab928e_101_0.png)


    **Figure 6.1** Example of DB2 using round-robin striping.


    When multiple containers are defined, DB2 writes extents to each container in
    a round-robin fashion. DB2 implements striping by writing extents to each container
    defined. See Figure 6.1 for an example of how extents are written to multiple
    containers.


    Figure 6.1 depicts how DB2 writes extent 1 to Container 1, then extent 2 to Container
    2 and extent 3 to Container 3, and then extent 4 back to Container 1 in a round-robin
    fashion.


    > NOTE

    In an SMS tablespace, if any container becomes full, then the entire tablespace
    is considered full, and no more data can be added.


    > NOTE

    The maximum size of a temporary tablespace is 2TB.


    # Choosing an Extent Size


    Several factors need to be taken into consideration when choosing the extent size
    for a tablespace. DB2 allocates two extents for each object defined for a DMS
    tablespace. If you are using many small tables, then this extent overhead can
    use a significant amount of space. In this case, an SMS tablespace that allocates
    a page at a time is a better choice.


    However, if you have large tables where data is constantly being added and the
    tablespace is DMS, then if you use a small EXTENTSIZE, many extents would now
    be needed that would require additional overhead to retrieve the frequently needed
    new extents.'
