  md: '# Chapter 12 • Understanding and Tuning DB2 Sort


    performed, and optimization class used along with many other important details
    concerning the SQL being analyzed. Refer to the DB2 UDB v8 Administration Guide:
    Performance for additional details. For details on Visual Explain, refer to the
    DB2 v8 Visual Explain Tutorial manual.


    If the SQL can be changed to eliminate the sort, then the SQL should be changed
    in conjunction with application development. If not, use the index recommendations
    from Design Advisor to eliminate the sort.


    Follow these steps for identifying, tuning, and eliminating sorts:


    +   1. Identify SQL statements causing sorts using connection and statement event
    monitors.

    2. Use Design Advisor to assist in identifying index improvements.

    3. Use Visual Explain and change SQL if possible.

    4. Modify or create indexes to eliminate sorts.

    5. Repeat steps 1 thru 4 until all sort problems have been.


    Use these five steps to tuning and eliminating sorts and you will significantly
    increase the performance of your databases.


    # CHANGING SQL


    Changing SQL to eliminate sorts is one of the options available to us but it is
    generally not effective. The reason for this is because applications and ad hoc
    queries usually contain ORDER BY, UNION, DISTINCT, or GROUP BY statements that
    return results in a sorted order for use in developing reports for management
    or for returning results to online applications.


    A UNION can be changed to a UNION ALL to eliminate a sort if the application program
    can handle duplicates. A DISTINCT sort statement can also be eliminated if the
    application can handle duplicates; however, ORDER BY and GROUP BY statements cannot
    be rewritten because the application must return results in an ordered manner.
    Therefore, you will have to use indexes to eliminate the sorts caused by these
    SQL statements.


    Consider using predicates with selectivity. Generally, try to use predicates with
    a selectivity of .01 or lower. Selectivity is used by DB2 to determine the number
    of rows that will be examined.


    # Allow Reverse Scans


    The index option ALLOW REVERSE SCANS can be used to enable a single option is
    used to resolve sorts that require data in an ascending or descending order. This
    option is very effective at eliminating sorts required by MIN and MAX functions,
    fetch, and previous key, and eliminates the need for temporary tables for reverse
    scans. It is most effective when used on tables that already have several or many
    indexes defined on them and upon which the creation of additional indexes would
    cause inserts, updates, or deletes to slow down that unacceptable performance
    would occur.'
