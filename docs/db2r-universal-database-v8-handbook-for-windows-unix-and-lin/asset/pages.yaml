    # Tablespace-name


    Mandatory for tablespace-level roll-forward recovery to a point in time. Allows
    a subset of tablespaces to be specified for roll-forward recovery to the end of
    the logs. In a partitioned database environment, each tablespace in the list does
    not have to exist at each partition that is rolling-forward. If it does exist,
