    # DB2 VISUAL EXPLAIN


    DB2 Visual Explain is an excellent tool for developers to aid in developing efficient
    SQL. Visual Explain is integrated with the DB2 Control Center, Command Center,
    and Development Center. Visual Explain is used to explain and analyze SQL statements
    and display the access plan in a graphical format. It should be used by developers
    and DBAs to review SQL from unit test, acceptance test, and system test through
    post-implementation.


    DB2 Visual Explain should be available to all developers to use in developing
    SQL. Although there are other forms of DB2 Visual Explain available, my experience
    is that using Visual Explain in conjunction with Design Advisor is a very powerful
    combination that is hard to beat. Visual Explain is definitely a tool that improves
    the productivity of developers and DBAs alike and should be used throughout the
    system development life cycle.


    For a complete list of DB2 Developer Tools and components, refer to the DB2 Application
    Development Guide: Programming Client Applications.


    As noted earlier, Visual Explain can be launched from the Control Center and Command
    Center. See Figure 4.1 for example of how to launch Visual Explain from the Center.


