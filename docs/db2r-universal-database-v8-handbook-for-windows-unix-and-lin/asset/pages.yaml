    # Broadcast Table Joins–Inner and Outer


    Broadcast table joins may be used when there is one very large table and one very
    small table involved in the join. Broadcast table joins may be used by the optimizer
    when the following conditions exist:


    +   - Equijoin predicates exist between the joined tables.

    - When the optimizer determines it is the most efficient method.

    - When it is cheaper to broadcast the smaller table to all the database partitions
    where the larger table resides, rather than relocating the data in both tables.

    - When the results of applying predicates to a large table results in a very small
    table.'
