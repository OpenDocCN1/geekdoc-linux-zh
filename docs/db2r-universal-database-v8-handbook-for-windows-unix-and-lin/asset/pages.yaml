  md: '# Database Partition Number


    # Roll-forward Status


    Status can be: database or tablespace roll-forward pending, database or tablespace
    roll-forward in progress, database or tablespace roll-forward processing STOP,
    or not pending.


    # Next Log File to be Read


    A string containing the name of the next required log file. In a partitioned database
    environment, use this information if the roll-forward utility fails with a return
    code indicating that a log file is missing or that a log information mismatch
    occurs


    # Log Files Processed


    A string containing the names of proceeded log files that are no longer needed
    for recovery, and can be removed from the directory. If, for example, the uncommitted
    transaction starts in log file x; the range of obsolete log files will not include
    x; the range ends at x-1.


    # Last Committed Transaction


    A string containing a timestamp in ISO format (yyyy-mm-dd-hh.mm.ss). This time
    stamp marks the last transaction committed after the completion of roll-forward
    recovery. The time stamp applies to the database. For tablespace roll-forward
    recovery, it is the time stamp of the last transaction committed to the database.


    > NOTE

    QUERY STATUS is the default value if the TO, STOP, COMPLETE, or CANCEL clauses
    are omitted. If TO, STOP, or COMPLETE was specified, status information is displayed
    if the command has completed successfully. If the individual tablespaces are specified,
    they are ignored; the status request does not apply only to specified tablespaces.


