    \ statistics are calculated.\n\n# ALLOW READ ACCESS\n\nSpecifies that other users\
    \ can have read-only access to the table while statistics are calculated.\n\n\
    > NOTE\n a partitioned database, the RUNSTATS command collects the statistics\
    \ on only a single node. If the database partition from which the RUNSTATS command\
    \ is executed has a partition of the table, then the command executes on that\
    \ database partition. Otherwise, the command executes on the first database partition\
    \ in the database group across which the table is partitioned.\n\n# Utility Guidelines\
    \ and Exceptions\n\n+   1. It is recommended to run RUNSTATS command:\n   - Tables\
    \ that have been modified considerably (e.g., if a large number of updates have\
    \ been made, or if a significant amount of data has been inserted or deleted if\
    \ LOAD has been done without the statistics option during LOAD).\n   - Tables\
    \ that have been reorganized (using REORG, DISTRIBUTE DATABASE PARTITION GROUP).\n\
    \   - When a new index has been created.\n   - Before binding applications whose\
    \ performance is critical.\n   - When the prefetch query is changed.\n   2. The\
    \ options chosen must depend on the specific table and the application. In general:\n\
    \   - If the table is a very critical table in critical queries, is relatively\
    \ small, or does not change too much and there is not much activity on the system\
    \ itself, it may be worth spending the effort on collecting statistics in as much\
    \ as possible.\n   - If the time to collect statistics is limited, the table is\
    \ relatively large, and the table changes a lot, it might be beneficial to execute\
    \ RUNSTATS limited to the set of columns that are used in predicates. In this\
