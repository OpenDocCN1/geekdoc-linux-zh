    | DB2MEMDISCLAIM | AIX | Default = YES YES or NO |


    On AIX, memory used by DB2 processes may have some associated paging space. This
    paging space may remain reserved when the associated memory has freed. Whether
    or not this depends on the AIX system''s (tunable) virtual memory management allocation
    policy. The DB2MEMDISCLAIM registry variable controls whether DB2 agents explicitly
    request AIX disassociate the reserved paging space from memory.


    A DB2MEMDISCLAIM setting of YES results in smaller paging space requirements,
    and possibly less disk activity from paging. A DB2MEMDISCLAIM setting of NO will
    result in larger paging space requirements, and possibly more disk activity from
    paging. In some situations, such as if paging space is plentiful and real memory
    is so plentiful that a setting of NO provides a minor performance improvement.


