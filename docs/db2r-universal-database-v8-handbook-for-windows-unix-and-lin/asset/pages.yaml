    MDC tables can also have traditional indexes, triggers, and referential integrity
    defined on them.


    # SUMMARY


    Type-2 indexes offer improved performance through the elimination of most next
    key-locking. Type-2 indexes are also key to facilitating many of the new availability
    enhancements in v8. Specifically, type-2 indexes are required for ONLINE REORG
    of tables and indexes, MDC, and ONLINE LOAD.


    Type-2 index migration considerations were discussed and a strategy provided.


    Type-2 indexes and MDC tables are key enablers for superior DB2 performance and
    availability.'
