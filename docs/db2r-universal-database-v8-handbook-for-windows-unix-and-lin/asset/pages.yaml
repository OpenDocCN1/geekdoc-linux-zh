  md: '# LOAD QUERY Command


    # TERMINATE


    One of four modes under which the load utility can execute. Terminates a previously
    interrupted load operation to the point in time at which it started, even if consistency
    points were passed. The states of tablespaces involved in the operation return
    to normal, and all table objects are made consistent (index objects may be marked
    as invalid, in which case index rebuild will automatically take place at next
    access). If the load being terminated is a load REPLACE, the table will be truncated
    to an empty table after the load TERMINATE operation. If the load operation being
    terminated is a load INSERT, the table will retain all of its records after the
    load TERMINATE operation.


    The load terminate operation will not remove a backup pending state from tablespaces.


    > NOTE

    This option is not supported for tables with DATALINK columns.


    # USING directory


    This option has been reserved for future use.


    # WARNINGCOUNT n


    Stops the load operation after n warnings. Set this parameter if no warnings are
    expected, but verification that the correct file and table are being used is desired.
    If n is zero, or this option is not specified, the load operation will continue
    regardless of the number of warnings issued. If the load operation is stopped
    because the threshold of warnings was encountered, another load operation can
    be started in RESTART mode. The load operation will automatically continue from
    the last consistency point. Alternatively, another load operation can be initiated
    in REPLACE mode, at the beginning of the input file.


    # WITHOUT PROMPTING


    Specifies the list of data files contains all the files that are to be loaded,
    and that the devices or directories listed are sufficient for the entire load
    operation. If a continuation input file is not found, or the copy targets are
    filled before the load operation finishes, the load operation will fail, and the
    table will remain in pending state.


    If this option is not specified, and the tape device encounters end of tape for
    the copy image, or the last item listed is a tape device, the user is prompted
    for a new tape on that device.


