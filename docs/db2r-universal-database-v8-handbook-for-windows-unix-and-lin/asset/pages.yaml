    # MDC TABLE CONTIDERATOINS


    For MDC tables, DB2 can find the intersection of slices using index AND on BID
    lists. DB2 can also do a multi-relational scan of each block while scanning a
    list of blocks. This only involves one I/O per block as each block is stored as
    an extent and can be read into the bufferpool as a unit. DB2 only needs to replay
    the predicates on one record in the block as all records in the block are guaranteed
    to have the same dimension key values. If other predicates are present, DB2 only
    needs to check these on the remaining records in the block.


    MDC tables can also have regular RID-based indexes. Also, RID and block indexes
    can be combined by index ANDing and OR. MDC tables can also be used by data partitioning.


    Queries involving columns with equality and range queries and columns with low
    cardinalities are good candidates for MDC tables. MDC benchmark tests have shown
    that MDC can speed up certain queries by 50%. An MDC table can also take advantage
    of the LOAD utility. The loader understands the structure of an MDC table and
    so will generate the appropriate blocks. MDC will also take advantage of the free
    extents that may be created during delete activity. MDC tables reclaim space after
    a delete by releasing the extent back to the tablespace for future use. MDC tables
    do not require reorganization.'
