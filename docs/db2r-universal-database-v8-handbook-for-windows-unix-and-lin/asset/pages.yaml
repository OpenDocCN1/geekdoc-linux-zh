- img_proc: true
  md: '102


    Chapter 7 • Utilities and Commands


    # INPLACE


    Reorganizes the table while permitting user access. In-place table reorganization
    is allowed only on tables with type-2 indexes and without extended indexes.


    ALLOW READ ACCESS—Allows only read access to the table during reorganization.


    > NOTE

    ALLOW WRITE ACCESS—Allows write access to the table during reorganization. This
    is the default behavior.


    NOTTRUNCATE TABLE—Do not truncate the table after inplace reorganization. During
    truncation, the table is S-locked.


    START—Start the inplace REORG processing. Because this is the default, this keyword
    is optional.


    STOP—Stop the inplace REORG processing at its current point.


    PAUSE—Suspend or pause inplace REORG for the time being.


    RESUME—Continue or resume a previously paused in-place table reorganization.


    # USE tablespace-name


    Specifies the name of a system tablespace in which to store a temporary copy of
    the table being reorganized. If you do not provide a tablespace name, the database
    manager stores a working copy of the table in the tablespaces that contain the
    table being reorganized.


    For an 8 KB, 16 KB, or 32 KB table object, the page size of any system temporary
    tablespace you specify must match the page size of the tablespaces in which the
    table data resides, including any LONG or LOB column data.


    # INDEXSCAN


    For a clustering REORG, an index scan will be used to reorder table records. Reorgan
    rows by accessing the table through an index. The default method is to scan the
    table and sort the result to reorganize the table, using temporary tablespaces
    as necessary. Even though the index keys are in sort order, scanning and sorting
    is typically faster than fetching rows by first reading the row identifier from
    an index.


    # LONGLOBDATA


    Long field and LOB data are to be reorganized. This is not required even if the
    table contains long or LOB columns. The default is to avoid reorganizing these
    objects because it is time consuming and does not improve clustering.'
