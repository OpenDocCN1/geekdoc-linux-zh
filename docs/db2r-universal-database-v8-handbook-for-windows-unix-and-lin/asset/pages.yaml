  md: '# Reorganizing indexes/Tables


    # Examples


    For a classic REORG TABLE like the default in DB2, Version 7, enter the following
    command:


    ```

    db2 reorg table employee index empid allow access indexscan

    longlobdata

    ```


    Note that the defaults are different in v8.


    To reorganize a table to reclaim space and use the temporary table space mytemp
    1, enter the fol-


    command:


    ```

    db2 reorg table homer.employee use mytemp1

    ```


    To reorganize tables in a partitiongroup consisting of nodes 1, 2, 3, and 4 of
    a four-node system,

    can you enter either of the following commands:


    ```

    db2 reorg table employee index empid on dbpartitionnum (1,3,4)

    db2 reorg table homer.employee index gprod.empid on all

    dbpartitionnums except dbpartitionnu (2)

    ```


    To clean up the pseudo-entropy pages in all the indexes on the EMPLOYEE table
    while allowing

    other transactions to read and update the table, enter:


    ```

    db2 reorg indexes all for table .employee allow access cleanup

    only pages

    ```


    To reorganize the employee table using the temporary tablespace TEMPSPACE1 as
    a work

    area, enter:


    ```

    db2 reorg table homer.employee using tempspace1

    ```


    To start, pause, and resume an in-place reorganization of the EMPLOYEE table with
    the default

    schema GPROD, which is specified explicitly in previous examples, enter the following
    commands:


    ```

    db2 reorg table employee index empid inplace start

    db2 reorg table employee inplace pause

    db2 reorg table homer.employee inplace allow read access truncate

    table resume

    ```


    > NOTE

    Note that the command to resume the reorganization contains addi-

    tional keywords to specify read access only and to skip the truncation

    step, which share-locks the table.'
