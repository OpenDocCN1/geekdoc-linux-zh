  md: '# Summary


    189


    nor too large (may cause operating system paging and consumes excessive CPU to
    manage all the pages in the pool). The size that is “just right” is the point
    of diminishing returns—the point where a larger bufferpool size does not provide
    improved performance results (as measured by the IHR, OHR, and PRPM) and a smaller
    bufferpool size results in measurably poorer performance results (as measured
    by IHR, OHR, and PRPM). The optimum size can often be determined by sampling performance
    at varying bufferpool sizes until the point of diminishing returns is discovered.


    # Block Prefetch I/O, Special Considerations


    As I previously discussed, new in DB2 V8 is the ability to reserve portions of
    a buffer’s pages for sequential I/O. This new capability makes optimum use of
    memory for block prefetch I/O, and should result in faster query times for SQL
    that performs table scans. To reserve a portion of DB2 bufferpool memory for prefetch
    I/O, use the new NUMBLOCKPAGES parameter with the CREATE or ALTER BUFFERPOOL statement.


    # SUMMARY


    Most database administrators are handed an application or a database and instructed
    to make it faster. There’s no documentation, no SQL activity rates, nothing. The
    DBA needs to use the monitoring facilities available to discover the tuning opportunities.
    Learn which tables are most frequently read and assign them to their own tablespaces.
    Pair synchronously read tablespaces with bufferpools that are intended to have
    random access, and tablespaces that are heavily asynchronously read with bufferpools
    that are intended to prefetch access. Prefetch bufferpools need to be large enough
    to accommodate the demand, while random bufferpools should seek to minimize physical
    I/O rates by size increases until either (1) system paging occurs, or (2) the
    point of diminishing returns is reached.


    In this chapter, bufferpools were introduced and their purpose described. Creating,
    altering, dropping, and monitoring bufferpools was discussed, in conjunction with
    monitoring tables and tablespaces. Several important formulas for evaluating tablespace
    and bufferpool performance were presented, and techniques for tuning tablespaces
    were discussed.'
