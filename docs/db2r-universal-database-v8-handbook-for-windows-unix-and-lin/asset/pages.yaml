  md: '# COMMUNICATIONS VARIABLES


    | Variable name | Operating system | Values |

    | --- | --- | --- |

    | DB2CHECKCLIENTINTERVAL | AIX server only | Default = 0 <br> Values: A numeric
    value greater than zero. |


    Used to verify the status of APPC client connections. Permits early detection
    of client termination, rather than waiting until the completion of the query.
    When set to zero, no check will be made. When set to a numerical value greater
    than zero, the value represents DB2 internal work units. For guidance, the following
    check frequency values are given: low frequency use 300, medium frequency use
    100, high frequency use 50. Checking more frequently for client status while executing
    a database lengthens the time taken to complete. If the DB2 workload is heavy
    (i.e., it involves many internal requests), then setting DB2CHECKCLIENTINTERVAL
    to a low value has a greater impact on performance than in a situation where the
    workload is light and most of the time DB2 is waiting.


