    is now available and allows an active unit of work to span primary logs and archive
    logs, ostensibly enabling a transaction to use an infinite number of logs.


    # BACKUP DATABASE UTILITY


    Backing up your company''s data is one of most important functions you can perform
    as a DBA. Companies entrust DBAs with enormous responsibility and rely on them
    to safeguard the corporate data. Some companies have lost corporate data due to
    databases not being backed up lost sizable amounts of revenue, declared bankruptcy,
    or gone completely out of business.


    As DBAs, we have all had our tense moments when we had difficulty restoring or
    recovering data due to inadequate backups, lack of knowledge of the backup utility,
    or lack of detailed backup and recovery procedures. In v8, we use the Backup Wizard
    to assist us in developing an appropriate backup strategy for our environment.
    See Figure 7.4 for an example of the Backup Wizard.


    # NOTE


    Backup and recovery procedures should be documented, tested, and practiced. Don''t
    wait until you need to do a recovery figure out how to do it. Have documented
    and tested procedures in place.


    ![](img/961b0d3b0e157406ef7a293880ab928e_139_0.png)


    Figure 7.4

    Backup Wizard.'
