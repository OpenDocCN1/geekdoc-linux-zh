    ```


    This fails, because TBS1 is not ready for roll-forward recovery on database partition
    1. Reports SQL4906N.


    ```

    db2 rollforward db sample to end of logs on dbpartitionnums (0,2)

    tablespace (TBS1)

    ```


    This completes successfully.


    ```

    db2 rollforward db sample to 1998-04-03-14.21.56.245378 and stop and

    tablespace (TBS1)

    ```


    This fails, because TBS1 is not ready for roll-forward recovery on database partition
    1; all pieces

    must be rolled forward together.


    > NOTE

    With tablespace roll-forward to a point in time, the database partition-

    clause is not accepted. The roll-forward operation must take

    place on all the database partitions on which the tablespace resides.'
