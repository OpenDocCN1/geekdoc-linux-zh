    # The End Result—Performance


    Collocated table joins are the preferred join method when using the ESE Partitioning
    Option, as this precludes data from having to be shipped from partition to partition.
    Additionally, when joining very small and large tables where no equijoin predicate
    exists, it is beneficial to define the small table to a separate database partition
    group so the optimizer will choose to broadcast the small table to the database
    partitions where the larger table resides.


    # DYNAMIC BITMAP INDEX ANDING (DBIA)


    Dynamic bitmap INDEX ANDING (DBIA) is a powerful feature that results in significant
    performance improvement for queries when chosen by the optimizer. DBIA may be
    chosen by the optimizer when processing queries containing multiple AND predicates
    in which the columns specified in the AND predicates are contained in one or more
    indexes. Figure 13.14 is an example of how DBIA works.


    In Step 1, DB2 performs an index scan to identify the qualifying RIDs for the
    first table and then


    +   - hashes the RIDs to the bitmap,

    - sets the bit in the hashed location of the bitmap to 1, and

    - repeats where all qualifying RIDs are located in the index scan.


    In Step 2, DB2 proceeds to the next table and


    +   - performs an index scan to identify the qualifying RIDs from the current
    table,

    - initiates a probe of the bitmap to which the new RID will be hashed in the previous
    generated bitmap, and

    - if the value in the bitmap location is one, then this indicates that the previous
    scan also found a qualifying RID and this position in the bitmap is to be carried
    forward to the new bitmap being generated by the current scan.


    No locations will be carried forward that do not have a qualifying bitmap slot
    in both the current and previous steps.'
