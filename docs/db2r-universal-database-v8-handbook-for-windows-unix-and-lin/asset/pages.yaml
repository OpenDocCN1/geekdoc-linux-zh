    # DB2DIAG.LOG SQLCA ENTRIES


    The SQLCA is used by DB2 to pass information from one program to another, to record
    the status of a call, and to return the status to the working application.


    DB2 may record the contents of an SQLCA with severe errors in the db2diag.log.
    As it is very useful to help you investigate application errors and other types
    of errors. See Example 11.2 for a sample db2diag.log SQLCA entry.


    ```

    2003-02-08-23.31.37.037935 Instance:db2inst1 Node:000

    PID:2640(asapply) TID:8192 Ajprid:none

    DrDA Request sqljLrDrdaArExecute Probe:90

