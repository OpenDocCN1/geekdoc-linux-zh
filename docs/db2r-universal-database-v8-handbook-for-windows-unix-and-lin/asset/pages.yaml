  md: '# DB2 Limits


    This appendix on DB2 Limits contains a quick reference for information often sought
    after by DBAs and application developers alike on architectural limits in DB2.
    This appendix contains limit definitions in the following areas:


    +   * Identifier length limits

    * Numeric limits

    * String limits

    * Datetime limits

    * Database Manager limits

    * Database Manager page size-specific limits


    Applications developed within these limits will enable applications to be developed
    that are portable across the DB2 family.


