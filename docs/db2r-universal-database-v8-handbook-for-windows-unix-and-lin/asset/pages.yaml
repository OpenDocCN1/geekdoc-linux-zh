  md: '# Index Considerations in a DPF Environment


    It is important to have accurate statistics for the optimizer to use in evaluating
    the use of DBIA during optimization. To provide the optimizer with adequate statistics
    you can execute the RUN-STATS command as follows:


    RUNSTATS on table PO_INVOICE

    with DISTRIBUTION

    and DETAILED INDEXES ALL;

    To just execute RUNSTATS on indexes, use:


    RUNSTATS on table PO_INVOICE

    with DISTRIBUTION

    and DETAILED INDEX PO_QTY_IX


    > CAUTION

    The database manager uses sortheap when creating the Dynamic Bitmap. Based on
    index cardinality, DB2 will estimate the amount of sortheap required. If DB2 shows
    frequent use of DBIA in your environment, take this into consideration when specifying
    the SORTHEAP DBG parameter.


    DBIA can also be very beneficial to queries in Data Warehouse environments.


    # INDEX CONSIDERATIONS IN A DPF ENVIRONMENT


    In DPF, when an index is created, it is created across all database partitions
    for the target table. Like tables, index and data are spread across all database
    partitions where the table resides.


    # OLTP Environments


    A good rule of thumb to follow would be a maximum of 3–5 indexes on a table. However,
    each environment is different, and the business priorities of the corporation
    should help to provide guidelines on what''s important and what''s not. Then you
    can use that information to help you decide whether or not to create an index.
    Additionally, the type of application access must be considered when deciding
    on whether or not to create an index. If a table is heavily updated or inserted
    into, additional indexes would slow down these operations and a new index would
    not be advised. However, if the opposite was true, where selects (reads) were
    the priority, creating a new index would be beneficial. DBAs need to work with
    business architects and developers to arrive at the best solutions.


    # BI/DW Environments


    A good rule of thumb in this environment is 5–10 indexes, depending on the maintenance
    window for the ETL process, space considerations, and again, business priorities.
    Since BI/DW tables are generally read only, more indexes can be used to provide
    the desired access paths to eliminate table scans'
