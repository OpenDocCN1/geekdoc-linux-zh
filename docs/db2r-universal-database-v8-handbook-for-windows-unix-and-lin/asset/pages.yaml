    user is prompted to enter it.


    # TABLESPACE tablespace-name


    A list of names used to specify the table spaces to be backed up.


    # ONLINE


    Specifies online backup. The default is offline backup. Online backups are only
    available for databases configured with logretain or userxit enabled. If this
    option is used, the database must be enabled for forward recovery. Online backups
    use archived logs to enable fully recoverable databases using roll-forward recovery.


    > NOTE

    Online backup operation may time out if there is an IX lock on sysbm.syastables,
    because the DB2 backup utility requires an S lock on objects containing LOBs.


    # INCREMENTAL


    Specifies a cumulative (incremental) backup image. An incremental backup image
    is a copy of all database data that has changed since the most recent, successful
    full backup operation.


    # DELTA


    Specifies a noncumulative (delta) backup image. A delta backup is a copy of all
    database data that has changed since the most recent, successful backup operation
    of any type.


    # USE TSM


    Specifies that the backup is to use Tivoli Storage Manager output.


    # OPEN num-sessionsESSIONS


