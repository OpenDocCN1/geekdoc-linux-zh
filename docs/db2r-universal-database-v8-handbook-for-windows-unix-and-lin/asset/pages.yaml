  md: '# ELIMINATING SORTS


    Sorts can be eliminated by identifying appropriate indexes and ordering the columns
    in the indexes in the order required by the SQL statement being tuned.


    However, when seeking out and eliminating sorts, we can''t take a blanket “create
    indexes” approach. When making the decision to create an index or not, you need
    to identify all the types of SQL activity performed on the table tables involved.
    Putting an index on a 900 million now table that is heavily updated would be a
    wise choice as DB2 would incur significant overhead updating all the index entries.
    Now, if this same table is read out, only then would it make perfect sense to
    create the index to eliminate the sort if it is important and run frequently enough
    to justify it. The only other considerations to analyze in this case are index
    rebuild during utility operations. If the additional time required for index rebuild
    is acceptable, improving response time through sort elimination is the business
    priority, then the index in this case is justified.


    > NOTE

    Index can be used to obtain rows in an ordered sequence, eliminating the need
    for the database manager to sort the rows after they are read from the table.


    While we are discussing indexes to eliminate sorts, we should address who is responsible
    for the decision to create or modify an index. Well, it is clearly the DBA’s responsibility,
    but the DBA cannot do this blindly. The DBA needs to work with application developers
    and business architects to identify the business priorities. After business priorities
    have been identified, then only then can a DBA create or modify an index. The
    ultimate decision to create or modify an index rests solely with the DBA after
    conducting the coordination and finding what we just outlined.


    The reason I address this issue is because I have been in situations where the
    application department had the final say. This approach cannot work because application
    developers are not trained in physical database design. The DBAs are the ones
    that have the skills and tools necessary to make an educated decision based on
    business priorities. Ultimately, the failure to meet business objectives with
    new applications usually falls back on the DBAs!


    Example 12.6 is an example of an SQL statement (that was using of CPU time doing
    sorts) that was captured and used as input to the new Design Advisor (formerly
    Index Advisor).


    ```

    SELECT DISTINCT FILE_NAME FROM PGNN.T_SENT WHERE COLLECTION_ID

    =1 AND FILE_NAME IN (SELECT FILE_NAME FROM PGNN.T_RECE_DEFINED

    WHERE USER_ID = 1 AND AGENT_ID = ''?'');

    ```


    Example 12.6

    SQL statement requiring a sort.'
