    # Application Support Layer Heap (as1heapsz)


    The application support layer heap is used by local clients when communicating
    with local databases. It serves as a communication buffer between the client and
    the database. It serves the same purpose as the `rqrioblk` parameter for remote
    applications. See Figure 9.7.


    # AGENT PARAMETERS


    DB2 uses a client-server based processing model. Clients or applications use agents
    to accomplish work within the database. DB2 uses several types of agents as follows.


    # Coordinating Agents


    Coordinating agents are created for each application and manage work on behalf
    of applications. Coordinating agents also distribute work to subagents in a database
    with intra-partition parallelism enabled. The DBM CF parameter `MAX_COORDINATES`
    is used to define the number of coordinating agents. If a coordinating agent is
    not available for an application, the requesting application will receive a negative
    SQL code. You should set `MAX_COORDINATES` such that this situation does not occur.
    The default for `MAX_COORDINATES` is the setting of the `MAXAGENTS` DBM CF parameter.
    This setting is a good starting point. In an ESE environment without partitioning
    or `intra_parallel` set to YES, `MAX_COORDINATES` must equal `MAXAGENTS`.


    # MAXAGENTS


    The `MAXAGENTS` DBM CF parameter specifies the maximum number of database manager
    agents, whether coordinating or subagents available at any given time to accept
    application requests. In memory constrained environments, `MAXAGENTS` can be set
    low as to limit the total memory usage of the database manager as each additional
    agent requires additional memory. If you use this to limit resources, remember
    it is only a temporary solution. You will need to reduce resource consumption
    or acquire additional capacity to support your business requirements.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# MAXCAGENTS


    MAXCAGENTS defines the Maximum Number of Concurrent Agents that can be executing
    in the database manager. Before an agent can work for an application it must obtain
    a token from the database manager. If a token is not available, the agent will
    wait. MAXCAGENTS controls the number of tokens available. The default is that
    MAXCAGENTS is equal to MAX_COORDINAGENTS. Start with the default and adjust through
    benchmark testing. Generally, you don''t agents waiting for a token. You can monitor
    this with a DBMS snapshot. If waiting for tokens occurs frequently then MAXCAGENTS
    and other related agent parameters should be increased until agents waiting for
    tokens is 0, or occurs very infrequently.


    # MAXAPPLS


    MAXAPPLS defines the maximum number of concurrent applications that can be connected
    to the database. If MAXAPPLS is reached, an error will be returned to any application
    attempting to connect to the database and a connection will not be established.
    In v8, MAXAPPLS can be set to automatic which will allow any number of connected
    applications. If resources are not constrained, set MAXAPPLS to automatic (due
    to CPU or memory constraints), then equal or greater than the sum of the connected
    applications, plus the number of these same applications that may be concurrently
    completing a two-phase commit or rollback; plus the sum of the anticipated number
    of in-doubt transactions that might occur at any time.


    MAXAPPLS is also governed by MAXCAGENTS. An application can only connect to the
    database if there is an available connection (MAXAPPLS) as well as an available
    agent (MAXCAGENTS). Additionally, no new applications (coordinating agents) can
    be started if MAX_COORDINAGENTS has been reached.


    # AGENT MONITORING


    A database manager snapshot will provide you with monitoring elements regarding
    agent activity. Refer to chapter 2 for an example database manager snapshot. Elements
    of interest are as follows:


    +   - High water mark for agents registered

    - High water mark for agents waiting for a token

    - Agents registered

    - Agents waiting for a token

    - Agents stolen from another application

    - High water mark for coordinating agents

    - Max agents overflow


    These elements will indicate whether or not agent settings are adequate or require
    adjustment. Generally, any time when 80% of agent resources are used (High water
    mark) you should increase the associated parameter until less than 80% of the
    setting for the resource are use. Monitor over time to make sure that changes
    are working as desired.'
  merge: -1
