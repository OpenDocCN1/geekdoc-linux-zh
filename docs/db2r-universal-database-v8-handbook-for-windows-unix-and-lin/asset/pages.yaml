- img_proc: true
  md: '# PAGE CLEANERS (db2pclnr)


    Page cleaners are used to write updated (dirty) pages to disk so that free space
    is available for new pages to be brought into the bufferpool. If there are not
    enough page cleaners configured, agents must write dirty pages to disk. This will
    impact performance because the write operation is synchronous. It is important
    to configure enough page cleaners to perform asynchronous writes. See Chapter
    8 for additional information on configuring page cleaners.


    NOTE


    When a page cleaner flushes a dirty page to disk, the dirty flag is removed but
    the page remains in the bufferpool. This page will remain in the bufferpool until
    a prefetcher or overwrites it.


    # LOGS (db2loggr)


    All data pages in the bufferpool are logged. As data is updated, agent processes
    a log record to the log buffer. The log records in the log buffer are flushed
    to the log files asynchronously by the logger. Neither updated data pages in the
    bufferpool nor the log records in the log buffer are written to disk immediately
    to optimize performance. They are written to the disk by page cleaners and the
    logger, respectively.


    The logger and the bufferpool manager make sure that the updated data page is
    not written to disk before its associated log record is written to the log. This
    is known as "write-ahead logging." Refer to Chapter 10 for more information on
    logging.


    # DEADLOCK DETECTOR


    Deadlock detection is one of the most important functions in DB2. A deadlock occurs
    when two applications are holding locks on data that each application needs. Both
    are waiting for each other to release the lock. This is also known as a "dead
    embrace." If a deadlock situation is not resolved, the applications involved could
    wait forever. Plus, they could usually cause many other applications to wait on
    this same data. This results in a clogged system that could stall or hang. Fortunately,
    DB2 has a deadlock detection mechanism that runs in the background and checks
    for deadlocks. When DB2 finds a deadlock, it chooses one of the applications to
    receive a terminal SQL error code and conducts a rollback for the application.
    Once the rollback is complete, the locks previously held are released and the
    deadlock is resolved.


    The dbtimeout parameter controls the interval for deadlock checking. The default
    is 10 seconds. This should be adequate in most situations. If a deadlock is encountered,
    the higher this setting is the longer deadlocked resources are locked. This decreases
    database concurrency. Usually, this is a sign of an application sequencing problem.
    Fix application design problems before changing dbtimeout to accommodate a poorly
    written application. If running ERP, CRM, or SCM packaged applications, check
    the vendor documentation for recommendations. Many of'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'these vendors test their applications in conjunction with IBM and arrive at
    recommended set-ings for this parameter.


    > NOTE

    Lock snapshot information has been significantly improved in v8. Snapshot-on locks
    now provides details on the SQL involved, lists only the connections involved,
    and provides more granularity on locks.


    Information on resolving locking problems is covered in more detail in Chapter
    11.


    # CONNECTION CONCENTRATOR


    Connection concentator allows many applications to connect to DB2 while minimizing
    the amount of memory and processes needed to process and maintain large numbers
    of connections. This is especially beneficial for Internet applications with transient
    connections or similar applications. The new connection concentrator architecture
    reduces the amount of memory used for each connection and decreases the number
    of context switches by using an n:m architecture. This offers significant performance
    improvements.


    > NOTE

    Enable Connection Concentrator by setting the value of max_connections greater
    than the value of max_coordagents.


    As depicted in Figure 2.4, Connection Concentrator works like this:


    After the first connection, the connection concentrator reduces the connection
    time to the host. When a disconnect is processed, the inbound connection is dropped,
    the outbound connection to the host is kept in a pool, where it becomes a logical
    subagent that is controlled by a logical coordinator agent with an active connection
    to the remote host. When a new request is made to connect to the host, DB2 tries
    to reuse an existing connection from the pool.


    # SUMMARY


    DB2 comes in several editions to enable businesses to select the right edition
    for their needs. The former EE and EEE have been merged to form Enterprise Server
    Edition. ESE includes the capability to partition databases on SMP machines. With
    the Database Partitioning feature, you can create partitioned databases across
    multiple physical machines. This enables DB2 to scale as your business requirements
    increase. The DB2 process model provides for a client/server architecture DB2
    processes such as prefetchers and page cleaners process work in the background
    so agents and applications do not wait for data. Connection concentrator paves
    the way for DB2 to be able to efficiently process thousands of connections.'
