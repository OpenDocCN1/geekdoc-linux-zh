  md: '# Prefetching


    How the table will be accessed is another primary concern when determining the
    EXTSIZE. If large amounts of data will be accessed in a sequential manner, as
    with data warehousing, a larger EXTENTSIZE would be appropriate. This would improve
    the performance of sequential prefetch as larger extents enable more data to be
    processed by I/O request.


    On the other hand, in OLTP environment, queries typically only return a small
    amount of data in a random manner. Here, a smaller EXTENTSIZE would bring fewer
    pages into the bufferpool. Since OLTP typically processes data randomly, retrieving
    a row or so at a time, a large EXTENTSIZE would result in too many pages being
    fetched into the bufferpool that are not needed by the application.


    > NOTE Specifying proper EXTENTSIZE is critical to the performance of your DB2
    applications. In conjunction with PREFETCHSIZE, DB2 issues multiple EXTENTSIZE
    I/O requests.


    # PREFETCHING


    DB2 uses a technique called sequential prefetch when accessing data in a sequential
    manner. DB2 issues asynchronous sequential prefetch requests to bring data into
    the bufferpool in advance of the application needing it. Thus, DB2 anticipates
    that the application is accessing data that is sequential, similar to a table
    scan, and provides improved application performance as the application does not
    have to wait for data. DB2 recognizes this at bind (Static SQL) or prefetch time
    (Dynamic SQL) and incorporates sequential prefetch into the access plan.


    DB2 can also detect that data is being accessed in a sequential manner at run
    time. This is called "sequential detection." This behavior is controlled by the
    seqdetect DB CFG parameter. By default it is enabled. In most cases, this should
    not be changed.


    > WARNING If the DB CFG parameter intra_parallel is enabled, DB2 will perform
    more aggressive prefetching as the prefetch algorithm operates wider gaps between
    pages. Make sure you have sufficient I/O bandwidth and additional physical disks
    if you enable this parameter.


    # Prefetching Performance


    The EXTENTSIZE, PREFETCHSIZE, and container layout on a disk are important factors
    in determining prefetch performance and therefore, to a large extent, the overall
    performance of the database. When developing a prefetch request, DB2 considers
    the EXTENTSIZE, PREFETCHSIZE, and number of containers develops I/O requests.
    Tablespace containers are allocated over separate physical disks (disk actuators
    or arms), DB2 can issue parallel read'
