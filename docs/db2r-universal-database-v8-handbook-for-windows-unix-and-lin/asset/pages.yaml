    # Utility Guidelines and Exceptions


    +   1. For check operations on operation tables, the level of processing can be
    specified for the objects. The default is NORMAL level; specifying NONE for an
    object excludes it. Specifying LOW will be a subset of checks that are done for
    NORMAL.

    2. The check database can be specified to start from a specific tablespace or
    from a specific table by specifying the ID value to identify the tablespace or
    the table.

    3. The check tablespace can be specified to start from a specific table by specifying
    the ID value to identify the table.

    4. The processing of tablespaces will affect only the objects that reside in the
    tablespace.

    5. The online inspect processing will access database objects using isolation
    level uncommitted. COMMIT processing will be done during INSPECT processing. It
    is advisable to end the unit of work by issuing a COMMIT or ROLLBACK invoking
    INSPECT.

    6. The online inspect check processing will write outformatted inspection data
    results to the results file specified. The file will be written out to the diagnostic
    data directory'
