    | DB2ATLD_PWFILE | DB2 UDB BSE on AIX, Solaris, and Windows NT | Default = null;
    Value: a file path expression |


    Specifies a path to a file that contains a password used during AutoLoader authentication.
    If not set, AutoLoader extracts the password from its configuration file or prompts
    you interactively. Using this variable addresses password security concerns and
    the separation of AutoLeader configuration information from authentication information.


    This registry variable is no longer needed, but retained for backward compatibility.


    | Variable name | Operating system | Values |

    | --- | --- | --- |

    | DB2CHGPWD_ESE | DB2 UDB BSE on AIX and Windows NT | Default = null; Values:
    YES or NO |


    Specifies whether you allow other users to change passwords on AIX or Windows
    NT NSE systems. You must ensure that the passwords for all partitions or nodes
    are maintained centrally using either Windows NT domain controller on Windows
    NT, or NIS on AIX. If not maintained, passwords may not be consistent across all
    partitions or nodes. This could result in a password being changed only at the
    database partition to which the user connects for the change. In order to modify
    this global registry, you must be at the root directory and on the DAS instance.


    This variable is required only if you use the old db2atld utility instead of the
    new LOAD utility.


    | Variable name | Operating system | Values |

    | --- | --- | --- |

    | DB2_FORCE_FCM_BP | AIX | Default = NO; Values: YES or NO |


    This registry variable is applicable to DB2 UDB BSE for AIX with multiple logical
    partitions. DB2START allocates the FCM buffers from the database global memory
    or from a separate shared memory segment, if there is not enough global memory
    available. These buffers are used by all FCM daemons that on the same physical
    machine. The kind of memory allocated is largely dependent on the number of FCM
    buffers to be created, as specified by the fcm_num_buffers database configuration
    parameter.


    If the DB2_FORCE_FCM_BP variable is set to YES, the FCM buffers are always created
    in a separate memory segment so that communication between FCM daemons from different
    partitions on the same physical node occur through shared memory. Otherwise, FCM
    daemons on the same node communicate through UNIX sockets. Communicating through
    shared memory is faster, but there is one fewer shared memory segment available
    for other users. The DB2_FORCE_FCM_BP registry variable reduces the maximum size
    of database pools, particularly for database bufferpools.


    | Variable name | Operating system | Values |

    | --- | --- | --- |

