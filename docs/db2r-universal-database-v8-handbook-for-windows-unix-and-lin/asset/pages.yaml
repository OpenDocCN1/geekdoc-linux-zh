    # DB2 Memory Areas


    The DB2 memory model (Figure 9.2) consists of Database Manager Shared Memory,
    Database Global Memory, Application Global Memory, and Agent Private Memory. Database
    Manager shared memory is used across the instance for various heaps and for storing
    control information regarding databases defined. Database Global Memory is allocated
    per database and is used to store memory areas related to a particular database.
    Database Global Memory is allocated for each database defined. Application Global
    Memory is used in a partitioned database environment to pass messages between
    agents and subagents. It is allocated per node in a partitioned database environment.
    It is not used in ESE nonpartitioned environment.'
