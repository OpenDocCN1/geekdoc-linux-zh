- img_proc: true
  md: '# Types of Sorts


    Figure 12.2 is an example of an overflowed sort. Overflowed sorts can seriously
    impact your ability to meet response time goals. Overflowed sorts overflow to
    the bufferpool and then possibly to temporary tables in a system temporary tablespace.
    To make things worse, the sort results have to be read back from disk to the bufferpool
    or just possibly from the bufferpool if the temporary table was fully filled with
    overflow. Overflowed sorts use thousands of additional CPU instructions and possible
    disk reads. In a data warehouse environment with gigabytes or terabytes of data,
    it may not be possible to prevent overflows. In this case we need to tune the
    tablespace container placement for the system temporary tablespace. It should
    have multiple containers spread across multiple physical disks. This enables DB2
    to use parallel I/O operations.


    > NOTE

    With the arrival of 64-bit addressability in DB2 v8 and large main memories, even
    large environments will be able to minimize sort overflows by allocating much
    larger sort heaps. So help is on the way.


    In either case, if the sort being performed cannot completely fit into SORHEAP,
    the entire sort overflows through the bufferpool to system temporary space on
    disk.


    > CAUTION

    If a sort overflows, the entire sort overflows through the bufferpool and system
    temporary space to disk. Therefore, sort overflows should be avoided where possible
    and even more so in OLTP environments.


    Figure 12.2 for an example of how sorts overflow.


    ![](img/961b0d3b0e157406ef7a293880ab928e_302_0.png)


    Figure 12.2

    Sort overflow.'
  merge: -1
