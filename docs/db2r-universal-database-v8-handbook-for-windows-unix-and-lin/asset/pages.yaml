  md: '# System Logs


    # Event Properties


    ![](img/961b0d3b0e157406ef7a293880ab928e_288_0.png)


    Figure 11.5

    Event Properties.


    # SYSTEM LOGS


    System logs are another important source of problem determination information.
    We have already discussed the Windows event log.


    > NOTE

    The DBM CFG DIAGPATH parameter controls where FFDC information gets recorded.
    This parameter is null by default and FFDC data will be written to the db2diag.log
    on the following path:

    C:\Program Files\IBM\SQLLIB\DB2\db2diag.log.

    On UNIX by default, FFDC data is written to the following path:

    $HOME/sqlib/db2dump

    Example: /prddb/sqllib/db2dump, where prddb is the name of the instance owner.


    On UNIX, operating system logs are used to record severe DB2 errors and warning
    conditions. Syslog can contain DB2 error information in the event of a DB2 crash.
    In this case, DB2 may not have been able to write to the db2diag.log before it
    crashes. Syslog will then be an important source of information.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Chapter 11 • Problem Determination


    Errors are added to the syslog based on priority and on what facility caused the
    error or warning condition. DB2 typically adds errors to the syslog under the
    following conditions:


    +   - Agents have been killed

    - DB2 architecture compromised

    - I/O errors causing DB2 to panic


    When conducting problem detection, information from the db2diag.log, administration
    notification logs, and syslog should be cross-checked so that all failure data
    is correlated. For additional information on using UNIX system logs, refer to
    specific operating system documentation.


    # CLI TRACE


    The output trace is typically what DB2 support will want. A DB CLI/ODBC trace
    shows the calls received from the ODBC Driver Manager, while an ODBC trace will
    show the calls made by the application to the driver manager. Enable the trace
    on the client by adding the following line to the DB2CLLINI file:


    ```

    [COMMON]

    TRACE = 1

    TRACEFILEMANE = C:\Traces\12022Prob.TXT

    TRACEFULL = 1

    ```


    The above example will cause a trace record to be written to disk after each entry.
    If using JDBC, a DB2 trace can also be used. The settings are similar. For additional
    information, refer to the Information Center.


    # DB2 TRACE


    The DB2 trace facility has significantly improved in v8 and it can now be used
    as one of the primary tools for gathering information regarding a problem. The
    DB2 trace should only be used in conjunction with DB2 Support. DB2 trace records
    information about operations and formats it into a readable form. On UNIX, sysadmin,
    sysctl, or sysmaint authority is required. On Windows, no authorization is required.


    > NOTE

    d2trc can be used to trace activity for an instance or for the DB2 Administration
    server.


    A connection to the database is not required. db2trc is useful when other FFDC
    facilities have failed to provide you and DB2 Support with enough information
    to identify and solve the problem. The following is an example of the db2trc command:


    ```

    db2trc -p 20, 40, 60

    ```'
  merge: -1
