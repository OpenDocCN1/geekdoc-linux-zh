  md: '186


    Chapter 8 · Tuning Buffers


    This particular Windows examples (as found in Examples 8.1 and 8.2) were taken
    on a very fast laptop running NT. We commonly use ARMS numbers of 1–3 ms, SRMS
    of 8–25 ms, and ORMS of 3–10 ms. Of course, actual results will depend on many
    factors, some of which include: the number and types of devices in use, numbers
    of containers on devices, processor, and more.


    # MONITORING AND TUNING TABLES, BUFFERPOOLS, AND TABLESPACES


    Buffers, and memory allocations in general, can have a profound impact on DB2
    Universal Database regardless of platform. Ever since multiple buffers available
    in DB2/MVS V3.1, strategies for configuring multiple buffers a widely discussed
    and often-about topic. Today, many articles can be found on the Internet. While
    opinions and circumstances vary, seems most experts agree that between 6 and 10
    buffers provide optimized performance.


    # Table Activity


    Begin your buffer analysis by determining which tables in your database are the
    most frequent read, for there is little in dedicating buffer memory to tables
    that are rarely referenced. The DB2 Control Center can provide this information,
    or you can use the command line interface.


    ```

    db2 "get snapshot for tables on DBNAME"

    ```


    Sort the results of the snapshot in descending sequence by ROWS READ, and now
    you have your list of “heavy hitters,” or tables that could benefit the most from
    focused buffer pooling. Of course, this list could also include tables that are
    victims of excessive table scans due to missing or suboptimal indexes.


    The trouble, however, with the tables snapshot is that it does not provide the
    low-level I/O numbers found in the tablespace or buffer pools. So, even though
    it is relatively easy to determine the most heavily read tables, it is difficult,
    if not impossible, to know if the reads are random (synchronous) or prefetch (asynchronous).
    Therefore, once you have your list of “Top 10 Most Frequently Read Tables,” you
    need to take steps to ensure these tables are placed into their own tablespaces
    so that the type of I/O can be accurately determined. As a rule of thumb, each
    frequently read table should be assigned to its own tablespace.


    Speaking of private table placements, if you are using Materialized Query Tables
    (formerly Automatic Summary Tables in DB2 v7 and prior), you should define each
    MQT in its own tablespace. By doing so, you will be effectively measure whether
    or not the AST is being used in a manner that is consistent with its objectives.
    You could also assign AST tablespaces to AST tablespace if the frequency of access
    warrants the dedication of resources.'
