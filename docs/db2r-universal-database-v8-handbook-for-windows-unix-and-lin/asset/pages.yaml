    Key Database Manager snapshot elements to review and to monitor on a regular basis
    and tuning tips are listed in Table 10.3.


    # Table 10.3 Key Database Manager Snapshot Elements


    | Monitor Element | Tuning Tips |

    |---|---|

    | Post sort thresholds | If > 0 then sorts are degraded; tune SQL, reduce sortheap,
    increase sheaths in that order. |

    | Pipe sort accepted requested | If these aren''t equal, piped sorts are being
    rejected resulting in degraded performance. Occurs when threshold sorts are occurring.
    |

    | Agents waiting for a token | Agents are waiting for token from the Database
    manager, increase maxagents. |

    | Agents stolen from another application | This should be 0. Idle agents are stolen
    and used to work for another application. This creates unnecessary overhead |'
