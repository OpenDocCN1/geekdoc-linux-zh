    nodes |


    Specifies the number of nodes that can be used as failover nodes in a high availability
    environment. With high availability, if a node fails, the node can be restarted
    as a second logical node on a different host. The number used with this variable
    determines how much memory is reserved for FCM resources for failover nodes.


