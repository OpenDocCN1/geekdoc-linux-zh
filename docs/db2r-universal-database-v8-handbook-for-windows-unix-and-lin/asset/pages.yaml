    described in the catalog and must not be a view of a hierarchy table. For types
    table, table-name must be the name of the root table of the table hierarchy. The
    fully qualified name or alias in the form schema.tablename must be used. The schema
    is the user name under which the table was created.


    index-name


    Identifies an existing index defined on the table. The fully qualified name in
    the form schema.index.name must be used.


    FOR INDEXES


    Identifies an existing index defined on the table. The fully qualified name in
    the form schema.index.name must be used.


    AND INDEXES


    Collects and updates statistics for both the table and the indexes.


    DETAILED


    Calculates extended index statistics. These are the CLUSTERFACTOR and PAGE_FETCH_PAIRS
    statistics that are gathered for relatively large indexes.


    SAMPLED


    This option, when used with the DETAILED option, allows RUNSTATS to employ a CPU
    sampling technique when compiling the extended index statistics. If the option
    is not specified, every entry in the index is examined to compute the extended
    index statistics.'
