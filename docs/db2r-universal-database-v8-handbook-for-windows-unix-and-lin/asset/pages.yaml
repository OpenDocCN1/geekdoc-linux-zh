    # SUMMARY


    Monitoring is one of the most important functions you perform as a DBA. Many new
    features and enhancements have been included in DB2 v8.


    SMART and Autonomic Computing initiatives enable DB2 to be “self-monitoring” and
    “self-healing.” We looked at this in Chapter 9.


    New SQL snapshot functions making taking snapshots much easier for DBAs and applications
    and provide a way to write snapshot output to tables for historical reporting
    purposes. Additionally, write-to-table event monitors also provide you with a
    way to monitor DB2 and capture data for operational and historical purposes. The
    Health Monitor is a new lightweight server-side agent that provides 24×7 monitoring
    capability in conjunction with the Health Center. It provides “monitoring by exception”
    capability for providing the notification of DBAs via emails and pager notifications.
    This is a major requirement at most large companies today.


    Version 8 management and monitoring improvements make DB2 much easier to manage
    for today’s DBA, in an ever increasing empowering and resource constrained environment.'
