- img_proc: true
  md: '# Types of Backup


    The recovery history file is updated automatically with summary information whenever
    you carry out a backup of a database. It is useful for tracking the backup history
    of a database.


    # Offline


    An offline backup records the complete contents of the database. During an offline
    backup, only the backup utility itself can be connected to the database. While
    the backup runs, no other utilities or applications can connect to the database.
    This type of backup already is used when there are no business requirements driving
    the need to enable the database for full access 24×7×365. It is used when the
    load files that were used to populate the database have been retained and the
    database can be reloaded, if necessary. You might use offline in a DW environment
    where the data is mostly read-only. Or when you have a nightly or weekly window
    when you can force off all application connections from the database and take
    an offline backup. With offline backups, only crash and version recovery are possible.


    You may recall that the AUTOSTART DB CFG parameter enables crash recovery at DB2
    to start by default.


    Scope This command affects the database partition on which it is executed.


    Authorization One of the following:


    +   - Sysadm

    - Sysctrl

    - Sysmaint


    Required connection Database. This command automatically establishes a connection
    to the specified database.


    > NOTE

    If a connection to the specified database already exists, it will be terminated
    and a new connection established specifically for the backup operation. The connection
    is terminated at the completion of the backup operation.


    # Command Parameters


    ```

    DATABASE database-alias

    ```


    Specifies the alias of the database to back up.


    ```

    USER username

    ```


    Identifies the user name under which to back up the database.'
