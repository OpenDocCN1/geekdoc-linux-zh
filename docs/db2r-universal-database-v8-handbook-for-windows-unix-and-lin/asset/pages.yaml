    # DB2 DEVELOPMENT CENTER


    The DB2 Development Center is a new integrated development environment in DB2
    v8. The Stored Procedure Builder has been replaced and its functions incorporated
    into the Development Center. Application developers can use the Development Center
    to build, debug, teat, and deploy JAVA and SQL stored procedures, SQL functions,
