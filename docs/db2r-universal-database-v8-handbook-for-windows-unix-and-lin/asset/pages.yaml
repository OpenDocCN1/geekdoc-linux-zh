  md: '# DB2 and IBM ENTERPRISE STORAGE SYSTEM (ESS SHARK)


    IBM first shipped the SHARK, as ESS is known, in 1999. If you were one of lucky
    first customers, then your SHARK may have had a SHARK fin on top of it!


    The ESS uses RAID-5 (prior to Model 800) and consists of arrays containing physical
    disks. The examples in this chapter are based on an F20 ESS. To AIX, these appear
    as hdisks. There are many ways that ranks, arrays, and disks can be configured.
    I''ll cover the main points you need to know to be able to properly lay out your
    tablespaces with performance in mind. My goal in this section is not to make you
    ESS expert, but to provide you with enough information to help you get good performance
    in environments where you are using ESS in support of DB2.


    # ESS Terminology


    When discussing how to lay out containers on ESS, it''s helpful to understand
    the terminology used. I''ll identify and discuss the key terms you need to know
    as a DBA.


    +   - STRIP—in storage terminology, a “STRIP” is a stripe that exists on a single
    device. We can think of this as an extent in DB2.

    - STRIPE WIDTH—the number of DB2 containers spread across multiple physical disks.

    - ESS LOGICAL DISK—an array comprised of 7+P array (7+P means 7 disks + 1 parity
    up the array). So, for example, four DB2 containers containing four ESS logical
    disks would have spread across 32 physical disks. This arrangement would result
    in DB2 being able to drive 32 I/O operations at once.

    - VPATH—an entity built by SDD to represent an ESS logical disk to the OS. Vpaths
    enable SSD to handle I/O across multiple paths and to reroute traffic to good
    paths in the event of path failure.


    # Cache Management


    In ESS, each cluster manages cluster cache and nonvolatile storage (NVS). With
    the latest ESS Model 800 supporting up to 64 GB of cache, database performance
    will benefit as more data will be found in the cache and less access to physical
    disks will be required.


    Whenever reads or writes to an ESS occur, a copy of the data is stored in cluster
    cache. This is in anticipation of the data being re-referenced from the cache.
    Data in cache ages and is subsequently removed from the cache when the caching
    algorithm determines it is unlikely to be referenced again during a predetermined
    time interval. Modified data is destaged from the cluster cache to the RAID arrays
    and changes to the data are made permanent.


    The ESS cache management algorithms take into consideration data access patterns.
    For random reads, ESS will use a record-caching strategy, which means a DB2 page
    will be read into the cache. When nearby physical records are also accessed, this
    will be detected and the ESS'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# DB2 and IBM Enterprise Storage System ESS SHARK


    sequential access algorithms will use a "track-caching" strategy, which results
    in ESS staging additional data into the cache, corresponding to an ESS logical
    track.


    > NOTE

    ESS logical track is the same as the physical stripe size, approximately 32 KB
    for SCSI and Fibre-Channel attached hosts.


    Since DB2 accesses data sequentially for table scans, and more so in a DW environment,
    ESS has been designed to detect and optimize sequential access patterns by detecting
    this activity and prestaging data into ESS cache. So with ESS, we have DB2-sequential
    prefetch on path to ESS asynchronous prefetching into ESS cache. Simply stated,
    DB2 detects and recognizes sequential access and invokes sequential prefetch as
    part of the access plan or sequential detection in anticipation that the application
    is accessing data sequentially. At the same time, ESS is prefetching in advance
    into ESS cache. This DB2 and ESS working together provides substantial performance
    improvements for applications that process large amounts of data sequentially.


    ESS manages the cache so a balanced efficiency is achieved between sequential
    and random access requests, preventing one or two applications from monopolizing
    the cache.


    ESS manages sequential writes by converting RAID-5 sequential writes into RAID-3
    operations. This is accomplished by the ESS cache manager and disk adapter writing
    the data from NVS and cluster cache to the disks in parallel, while at the same
    time internally calculating parity and sending it to a disk. This technique eliminates
    the RAID-5 write penalty previously discussed.


    # Nonvolatile Storage


    NVS provides protection for modified data in case of a cluster failure. The NVS
    for each cluster is physically maintained within the other cluster. In this way,
    the surviving cluster contains all of the cache-modified data. When DB2 writes
    a record, ESS stores two copies of the record in cache (one in cluster cache and
    the other in NVS) and immediately indicates that the write is complete when both
    copies are stored safely. The record is doubly protected at this point. When the
    data is destaged from cache to disk (and doubly protected by RAID-5), the storage
    in NVS is available for reuse by another application.


    To AIX without ESS, each individual fixed-disk drive is called a physical volume
    (PV) and has a name. These PVs correspond to specific hdisks. With ESS using Subsystem
    DeviceDriver (SDD), which enables virtual pairing, each hdisk represents a path
    to an ESS logical disk. The PV is represented by the vpath.


    So in an AIX, ESS implementation, PVs identifying ESS storage are not physical
    devices. They represent logical devices that are striped across multiple disk
    drives.'
