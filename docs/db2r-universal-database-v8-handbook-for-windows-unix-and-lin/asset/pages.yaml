    # Prefetch-Adjustment Parameters


    The prefetch-adjustment parameters are NUMPREFETCHQUEUES and PREFETCHQUEUESIZE.
    These parameters are available on all platforms and can be used to improve bufferdata
    prefetching. For example, consider sequential requests in which the desired PREFETCHSIZE
    is divided into PREFETCHSIZE/EXTSIZE requests. In this case, requests are placed
    on prefetch queues from which I/O servers do perform asynchronous I/O. DB2 maintains
    one queue of size max (100,2*NUM_IOSERVERS) for each database partition. In some
    environments, performance improves with more queues or queues of a different size
    or order. The number of queues should be at most half of the number of I/O servers.
    When you set it greater, consider other parameters such as PREFETCHSIZE, EXTSIZE,
    NUM_IOSERVERS, buffer-pool size, and DB2_BLOCK_BASED_BP, as well as workload characteristics
    such as the current number of users.


    If you think the default values are too small for your environment, first increase
    the NUMPREFETCHQUEUES=4 and PREFETCHQUEUESIZE=200. Make changes to these parameters
    in a controlled manner so that you can monitor and evaluate the effects of the
    change.


    For NUMPREFETCHQUEUES, the default is 1 and the range of values is 1 to NUM_IOSERVERS.
    If you set NUMPREFETCHQUEUES less than 1, it is adjusted to 1. If you set it greater
    than NUM_IOSERVERS, it is adjusted to NUM_IOSERVERS.


    For PREFETCHQUEUESIZE, the default value is max (100,2*NUM_IOSERVERS). The range
    of values is 1 to 32767. If you set PREFETCHQUEUESIZE less than 1 it is adjusted
    to the default. If you set greater than 32767, it is adjusted to 32767.


