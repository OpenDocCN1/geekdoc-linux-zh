    or FALSE |


    Used to eliminate the chance of lock contention in multithreaded applications.
    When this registry is "TRUE", the code page and territory code information is
    saved the first time a thread accesses it. From that point, the cached information
    is used for any other thread that requests this information. This eliminates lock
    contention and results in a performance benefit in certain situations. This setting
    should not be used if the application changes local settings between connections.
    It is probably not needed in such a situation multithreaded applications typically
    do not change their local settings because it is not "thread-safe" to do.


