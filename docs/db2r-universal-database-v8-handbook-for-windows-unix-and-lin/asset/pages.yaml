  md: '# Online Configuration Parameters


    **IBM** has developed the SMART initiative, which stands for “Self Managing and
    Resource Tuning." SMART consists of built-in automation, wizards and tools, and
    expert advice. The goal of the SMART is:


    +   - Automate configuration of parameters

    - Expand wizards and tools

    - Provide automated expert advice


    Additionally, SMART will help to reduce the number and skill level of DBAs required
    to support and maintain DB2. Typically, the average IT budget is devoted to 60%
    people costs and SMART will help to reduce that cost. The intent of SMART is not
    to replace DBAs, but to automate tasks and parameters that don''t require DBA
    intervention.


    # ONLINE CONFIGURATION PARAMETERS


    New to v8 is the ability to dynamically configure over 50 online configuration
    parameters. Online configurable parameters are associated with one of the propagation
    classes that control when the change takes effect. The classes and definitions
    are:


    +   - Immediate—Causes the parameter change to have immediate effect. changing
    the `notify` level has an immediate effect.

    - Statement Boundary—Change takes effect on SQL statement and statement-like boundaries.
    For example, if you change the `stmtheap`, all-new SQL requests will use the new
    value.

    - Transaction Boundary—Parameter changes take effect on the next `COMMIT`. For
    example, changing `avg_appl` would take effect on the next commit.


    For a complete list of the propagation classes for DBM or DB CFG parameter, and
    whether or not they can be changed online, refer to the definitions in the *DB2
    UDB v8 Administration Guide*: Performance.


    Online parameters can be made immediately (depending on the propagation class)
    and/or deferred to the next `db2start`. The default behavior for the `UPDATE DBM
    CFG` command is to apply the change immediately. To display the current value
    of configuration parameters, use the `GET DB CFG` command. To see deferred values,
    use the `SHOW DETAIL` option of these commands. See Figure 9.1.


    In this example `sortheap` has been changed to value 256 from 512. You can see
    the in-memory and deferred values in this example.


    > NOTE

    Changes to immediate online configuration parameters may not take effect until
    memory can be allocated or transactions complete.'
