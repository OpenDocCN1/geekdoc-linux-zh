  md: '# APPENDIX D


    # DB2 Registry and Environmental Variables


    This appendix contains a complete list of DB2 v8 Registry and Environmental variables.
    Also included are 16 variables that have become obsolete in v8. Additionally,
    eight new v8 variables are highlighted. Note that new variables are emphasized
    by a gray background.


    To review a list of all supported registry variables, issue the db2set-lr command.
    Values can be changed for the current or default instance by using the following
    command:


    ```

    db2set registry_variable_name=new_variable

    ```


    On UNIX systems, the export command can be used instead of the set command.

    Depending on your operating system, the DB2INSTANCE, DB2PATH, DB2NODE, and DB2INSTPROF
    may or not be stored in the DB2 profile registries. See the Administration Guide:
    Implementation for additional details.


    > NOTE

    If registry variables requires Boolean values as arguments, the values YES, 1,
    and ON are all equivalent and the values NO, 0, and OFF are also equivalent. For
    any variable, you can specify any of the appropriate values.


    The following variables are obsolete in v8:


    +   - DB2_BLOCK_ON_LOG_DISK_FULL

    - DB2COUNTRY

    - DB2_STRIPED_CONTAINERS

    - DB2DIRPATHNAME'
  merge: -1
  pgno: 456
