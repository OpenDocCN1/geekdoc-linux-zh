  md: '# Tuning Configuration Parameters


    DB2 Database Manager (DBM) and Database Configuration (DB CFG) parameters control
    how memory and resources are used by DB2. How they are set affects the overall
    performance of DB2. DBAs that have worked on DB2 for z/OS are used to setting
    ZPARMS that control subsystem performance. ZPARMS are relatively few in number
    compared to the number of DBM and DB CFG parameters. In DB2 for Linux, UNIX, and
    Windows, there are a multitude of configuration parameters and many are are interrelated.
    In order to tune DBM and DB CFG parameters, you must understand how memory is
    allocated and used, and what parameters control the use and allocation of these
    associated memory areas.


    There have been many changes to DBM and DB CFG parameters in DB2 v8. Some are
    no longer valid, some can be set to automatic, and many can be changed.


    The following list of DBM and DB CFG parameters are obsolete in DB2 v8:


    +   - backbufsz—In version 8, backbufsz must be explicitly specified on the backup
    command.

    - dft_client_adpt, dft_client_comm dir_obj_name, dir_path_name, dir_type, and
    route_obj_name—All have been removed as DCE directory services are no longer supported.

    - dos_rqrioblk—This parameter is obsolete.

    - fcm_num_anchors, fcm_num_connect, fcm_num_rqb—These all have been removed as
    DB2 will now manage the FCM resources automatically.

    - fileserver, ipx_socket, objectname—IPX/SPX is no longer supported as a communication
    protocol.

    - initdari_jvm—Java-stored procedures no use threading and each will get a separate
    Java Virtual Machine (JVM) environment established, so this protection is no longer
    needed.'
