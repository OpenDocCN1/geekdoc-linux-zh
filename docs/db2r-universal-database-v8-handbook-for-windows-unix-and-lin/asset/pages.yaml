    # Command Parameters


    # UPDATE STATISTICS


    Calls the RUNSTATS routine to update table statistics, and then uses the updated
    statistics to determine if table organization is required.


    If a table partition exists on the node where REORGCHK has been issued, RUNSTATS
    executes on this node. If a table partition does not exist on the node, the request
    is sent to the first node in the database partition group that holds a partition
    for the table. RUNSTATS then executes on that node.


    # CURRENT STATISTICS


    Uses the current table statistics to determine if table reorganization is required.


    ON SCHEMA schema-name


    Checks all the tables created under the specified schema.


    ON TABLE


    USER—Checks the tables that are owned by the run-time authorization ID.

    SYSTEM—Checks the system tables.

    ALL—Checks all users and name or alias in

