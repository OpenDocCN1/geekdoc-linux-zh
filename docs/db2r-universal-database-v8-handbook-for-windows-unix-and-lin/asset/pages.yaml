    # Agent Stack Size (agent_stack_sz)


    agent_stack_sz specifies the amount of virtual memory allocated per agent. This
    parameter is not applicable for DB2 on UNIX platforms. Agent stack size is used
    when needed to execute an SQL statement. The more complex the query, the more
    stack space is required. You should start with the default and only increase if
    you run out of space or receive error messages. Error messages will be written
    to the db2diag.log. Large agent_stack_sz settings could affect concurrency, as
    you will probably run out of address space before you reach maxagents on 32-bit
    operating systems.


    # Statistics Heap (stat_heap_sz)


    stat_heap_sz specifies the maximum amount of heap allocated when running RUNSTATS.
    It is allocated when needed and free when the utility completes. The default may
    not be adequate for wide tables or when running RUNSTATS with distribution statistics
    gathered.


    # Sort Heap (sortheap)


    sortheap specifies the amount of sort memory allocated for each agent (private
    sort). It is allocated when needed and free when no longer needed. One exception
    to this is when a piped sort is used and a cursor is still open, in this case
    the sort is not freed until the cursor is closed. This should be taken into consideration
    when designing applications. See Chapter 12 for a complete description of private
    and shared sort configuration parameters and tuning recommendations.'
