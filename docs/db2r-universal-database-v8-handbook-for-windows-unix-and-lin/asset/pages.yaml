  md: 'When using tape devices on SCO UnixWare 7, specify a buffer size of 16.


    With most versions of Linux, using DB2''s default buffer size for backup operations
    to a SCSI tape device results in error SQL2025N, reason code 75. To prevent the
    overflow of Linux internal SCSI buffers, use this formula:


    ```

    Bufferpages <= ST_MAX_BUFFERS * ST_BUFFER_BLOCKS / $

    ```


    Where bufferpages is the value you want to use with the BUFFER parameter, and
    ST_MAX_BUFFERS and ST_BUFFER_BLOCKS are defined in the Linux kernel under the
    drivers/scsi directory.


    # PARALLELISM n


    Determines the number of table spaces that can be read in parallel by the backup
    utility. The default value is 1.


    # WITHOUT PROMPTING


    Specifies that the backup will run unattended, and that any actions normally require
    user intervention will return an error message.


    # Examples


    In the following example, the database WSDB is defined on all partitions, numbered
    0 through 3. The path /dev3/ backup is accessible from all partitions. Partition
    0 is the catalog partition, and needs to be backed up separately since this is
    an offline backup. To perform an offline backup of all the WSDB database partitions
    to /dev3/backup, issue the following commands from one of the database partitions:


    ```

    db2_all ''<<-0 db2 DATABASE wsdb TO /dev3/backup/

    db2_all ''<<-0 db2 DATABASE wsdb TO /dev3/backup/

    ```


    In the second command, the db2_all utility will issue the same backup command
    to each database partition. The four database partition backup images will be
    stored in the /dev3/backup directory.


    In the following example, database SAMPLE is backed up to a TSM server with two
    concurrent TSM client sessions. The backup utility will use four buffers, which
