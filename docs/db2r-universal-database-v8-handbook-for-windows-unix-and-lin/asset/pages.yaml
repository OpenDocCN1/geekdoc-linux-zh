    # Health Monitor and Health Center


    New in v8, the Health monitor is a lightweight server-side agent (implemented
    in the Database Administration Server) and the Health Center is a GUI interface
    to configure the Health Monitor and present monitor data returned from the Health
    Monitor.


    > NOTE

    The Health Monitor uses new monitoring technology in v8 that incurs very little
    overhead in the Database Manager. You should use the Health Monitor and Health
    Center as your initial source of monitoring information and then snapshots and
    event monitors as needed.


    The Health Center can be launched from the Control Center, as indicated in Figure
    10.2.'
