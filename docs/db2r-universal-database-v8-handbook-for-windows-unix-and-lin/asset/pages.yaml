    T_AGENT ON T_ACCT.AGENT_ID = ACCT_AGENT_ID WHERE USER_ID > 99999 AND ACCT_AGENT_ID
    IN (''072303001'',''072303002'',''072303101'') AND PERIOD_ID = 55 AND IS_CURRENT_VERSION
    = ''Y'' ORDER BY ACCT_NAME |


    # Example 10.5


    Dynamic SQL snapshot


    Dynamic SQL snapshots (Example 10.5) add overhead to the database manager and
    should be used only as needed. Output should be written to a file for detailed
    analysis. I have used Dynamic SQL snapshots to identify and tune rogue SQL. Review
    Rows Read, Rows Written, Statement sorts and execution and cpu times, Number of
    compilations, and of course the SQL statement for indications of abnormal activity
    and take action as necessary.'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Resetting Monitor Switches


    An application can reset monitor switches, which in effect resets the counters
    to 0 for the application issuing the reset command. Note: An application in this
    respect could be the CLP, Command Center, Third Party Vendor Tool, or a user-written
    application. This can be accomplished by an application issuing the RESET MONITOR
    FOR DATABASE <database name> command. The GET MONITOR SWITCH command can be used
    to display the current status of monitor switches. The RESET MONITOR ALL command
    can be used to reset the monitor switches for all databases in an instance.


    > NOTE

    Every application has its own copy of the snapshot monitor values.

    Resetting the monitor switches only affects the counters of the application that
    issues the reset.


    # SNAPSHOTS THROUGH NEW SQL Functions


    New in v8 is the ability to issue snapshot commands via SQL functions. These 20
    functions make it easy for you to write programs or scripts that issue snapshot
    commands and process the snapshot data. They can also be issued via the CLP. Previously
    this was only available via the administrative API. These new functions also provide
    you with the opportunity to store snapshot data in tables for historical performance
    analysis and reporting. Table 10.5 contains a list of the new functions and a
    description of Data returned.


    # Table 10.5 Functions and Description of Data Returned


    | Function | Definition of Output Data |

    |---|---|

    | SNAPSHOT_AGENT | Application information associated with agents |

    | SNAPSHOT_APPL_INFO | General application level identification for each application
    connected to the database |

    | SNAPSHOT_APPL | Application information. Counters, status information and most
    recent SQL statement (statement monitor switch must be on) |

    | SNAPSHOT_BP | Physical and logical reads, asynchronous and synchronous writes,
    counters |

    | SNAPSHOT_CONTAINER | Tablespace container information |

    | SNAPSHOT_DATABASE | Database information, counters, sorts, lock escalations,
    memory heaps |

    | SNAPSHOT_DBM | Database manager information, counters, overflows, dbheap, locklist
    heap, other memory heaps |

    | SNAPSHOT_FCM | Database manager level information regarding FCM resources |

    | SNAPSHOT_DYN_SQL | Dynamic SQL from SQL statement cache |'
  merge: -1
  pgno: 261
