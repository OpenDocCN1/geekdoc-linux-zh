  md: "# Directed Inner and Outer Table Joins\n\nThe directed inner and outer table\
    \ join strategy is a combination of a directed inner and directed outer table\
    \ join strategy. In this case, rows from both the outer and inner tables are directed\
    \ to a set of database partitions. The join then occurs on those database partitions.\
    \ This join strategy may be chosen by the optimizer when the following conditions\
    \ exist:\n\n+   * The partitioning keys of both tables are different from the\
    \ join columns.\n* At least one equijoin predicate exists between the tables being\
    \ joined.\n* Both tables are relatively large.\n\nThe following sequence of operations\
    \ occurs during a directed inner and outer join: \n\n+   1. The initial request\
    \ is received by the coordinator database partition.\n2. The coordinator database\
    \ partition sends the request to all involved partitions.\n3. The outer table\
    \ will be scanned on all partitions that contain the table chosen as the outer\
    \ table of the join. Predicates will be applied.\n4. The inner table will be scanned\
    \ on all database partitions that contain the table chosen as the inner table\
    \ of the join. Predicates will be applied.\n5. The outer table database partitions\
    \ will hash each selected row from the outer table using the join columns specified\
    \ in the query.\n6. The inner table database partitions will hash each selected\
    \ row from the inner table using the join columns specified in the query.\n7.\
    \ Each database partition involved will send the hashed rows to the appropriate\
    \ database partition via hashed table queues.\n8. The selected database partitions\
    \ will receive the hashed table queues for the outer table rows.\n9. The selected\
    \ database partitions will receive the hashed table queues for the inner table\
    \ rows.\n10. The database partitions perform the join of the directed outer table\
    \ rows to the received inner table rows. Predicates will be applied.\n11. The\
    \ results of the join are then sent from the database partitions to the coordinator\
    \ partition. The coordinator partition then completes any processing and returns\
    \ the results to the application.\n\nFigure 13.12 depicts a directed inner and\
    \ outer table join sequence.\n\nYou can recognize a directed inner and outer table\
    \ join by the presence of the local join of two hashed table queues, in this example,\
    \ q2 and q3."
