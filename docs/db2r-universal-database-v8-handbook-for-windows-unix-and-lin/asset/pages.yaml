  md: '# DB2 Universal Database v8 Handbook for Windows, UNIX, and Linux


    Philip K. Gunning


    IBM DB2 Universal Database v8 offers breakthrough availability, manageability,performance
    and scalability. Now, straight from IBM, there''s a start-to-finish guide to DB2
    Universal Database v8 administration and development for Windows, UNIX, and Linux.


    This definitive reference covers every aspect of deploying and managing DB2 Universal
    Database v8, including database design for optimal performance, availability,
    and recoverability; day-to-day administration and backup; identifying when SQL
    is required to be available during the system development lifecycle so that appropriate
    physical design commence; identifying and tuning SQL with proper techniques using
    the new Design Advisor; migrating to DB2 UDB from earlier versions of DB2; and
    much more.


    Using real-world examples, this book shows how to take full advantage of DB2 v8''s
    most powerful enhancements. Philip K. Gunning brings best tips and techniques
    from IBM for saving time and money in every facet of database design, deployment,
    and administration. Coverage includes:


    +   - The definitive guide to the IBM DB2 UDB v8!


    +   - Leverage DB2 enhancements in manageability, availability, performance, and
    scalability


    +   - For every DB2 database administrator, developer, and designer


    +   - Leveraging DB2 v8''s new Wizards, Advisors, and other automation/self-management
    features


    +   - High performance table design with ESS by maximizing parallel I/O with DB2


    +   - Quickly creating Stored Procedures and UDFs with the new Development Center


    +   - Exploiting multidimensional clustering, fetching, materialized query tables,
    Java threading, and other performance improvements


    +   - Using the DB2 for improved monitoring and logging facilities


    +   - Maximizing availability via online table and index reorganization and dynamic
    configuration


    +   - Understanding the latest changes in the DB2 product family


    # About the Author


    Philip K. Gunning is a Principal Consultant with Gunning Technology Solutions,
    LLC, an independent consulting and education firm, where he is responsible for
    performance and tuning engagements, course development, and helping companies
    succeed with DB2. He is a member of the IDUG North American Conference Planning
    Committee and Associate List Owner of the DB2-L listerver. He has taught database
    management, operating systems, networking, and systems analysis and design, "Java"
    programming, and computer architecture as an adjunct lecturer at Alvernia College
    and Penn State (Berks Campus). Reading, Pennsylvania. A long-time member of the
    DB2 Scholars program, Phil holds a B.S. in computer science, an M.B.A. from DeSales
    University, and is a graduate of the U.S. Army Command and General Staff College.
    A recognized expert on IBM DB2 database platform, he has earned IBM Certified
    Technical Expert in both Clusters and DRDA.


    PRENTICE HALL

