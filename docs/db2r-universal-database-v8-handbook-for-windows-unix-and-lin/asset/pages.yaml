    the data is recorded and taking snapshots incurs additional performance overhead,
    as discussed. It is important to note that monitor switches must be enabled before
    issuing a snapshot command. If the appropriate monitor switches are not enabled
    at either the instance or database-level, no snapshot information will be returned.


    There are eight snapshot levels available:


    +   * Database Manager—Records information at the instance level

    * Database—Records information at the database level

    * Application—Records application information

    * Bufferpools—Records bufferpool activity

    * Tablespace—Records tablespace activity

    * Table—Records table activity

    * Lock—Records lock information for locks held by applications

    * Dynamic SQL cache—Records point-in-time statement information from the SQL statement
    cache


    > NOTE

    DB2 v8 introduced a new TIMESTAMP monitor switch. By default this switch is enabled.
    If timestamp information is not required, this switch can be turned off, resulting
    in improved database performance. This switch was introduced to reduce the number
    of context switches taking place. See Table 10.2 for a list of snapshot commands.'
