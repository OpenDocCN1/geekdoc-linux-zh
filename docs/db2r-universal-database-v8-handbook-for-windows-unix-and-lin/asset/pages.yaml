  md: '# Chapter 6 • High Performance Tablespace Design and I/O Strategies


    At the simplest level, a logical disk consists of a 7+P+S RAID array. The +S signifies
    a “spare” disk. In ESS, this is free-floating between arrays. Each SCSI ID is
    assigned to each array. A logical unit (LUN) is a subdivision under a SCSI ID.
    Each SCSI ID can have up to eight LUNs assigned to it;; that''s why a logical
    disk has eight disks associated with it. DB2 data is striped across all disks
    in the array and all the disks in the array can be used for parallel I/O by using
    a SCSI technique called command-taguing.


    Internally, ESS uses Serial Storage Architecture (SSA) for performing disk I/O.
    SSA disks are configured to provide redundancy and a loop configuration with multiple
    adapters. In ESS, almost all RAID functions are performed by the SSA disk adapters.
    Parity generation, disk rebuilding, and sparing are all done on the SSA adapter
    level. This provides improved performance by offloading these functions from the
    CPU and cache.


    ESS uses clustering to tie two clusters together. In ESS, a cluster is a collection
    of processors, NVS, and SSA disk adapters. ESS contains two clusters. Each cluster
    controls one half of the storage within ESS, but can assume control of the other
    half if its partner should fail. Each cluster owns separate cache, disk adapters,
    and arrays, so under normal conditions does not affect the performance of the
    other cluster. Clusters even run separate kernels and communicate via an internal
    network connection. The ESS Web interface tool, ESS Specialist, is used to manage
    clusters.


    # Configuring DB2 for Optimal Performance on ESS


    There are five general rules to follow when defining DB2 tablespaces on ESS:


    +   - Know where your data resides and understand how DB2 containers map to ESS
    logical disks. Span data across as many RAID arrays as possible.

    - Balance the workload across ESS resources. Establish a method with which to
    control the allocation of containers, based on business priorities.

    - Use the inherent striping of DB2, placing containers for tablespaces on separate
    ESS logical disks, which reside on separate ESS RAID arrays. This will eliminate
    the need for using underlying OS volume manager striping.

    - Select an ESS logical disk size that allows for granularity and growth without
    proliferating the number of logical disks. Eight logical disks is a good number
    for most environments.

    - Use ESS multipathing along DB2 striping to help balance use of Fibre Channel
    or SCSI paths.


    Let us take a look at the cardinal rule, knowing where your data resides. The
    key to this is balancing the I/O workload across available resources. Keep these
    tips in mind to help balance activity across ESS storage:


    +   1. Span ESS cabinets

    2. Span clusters within a cluster'
