  md: '# DRDA Heap (drda_heap_sz)


    drda_heap_sz is obsolete in DB2 v8.


    # UDF Memory (udf_mem_sz)


    Udf_mem_sz is obsolete in DB2 v8.


    Statement Heap (stmtheap)

    stmheap specifies the amount of memory to be used as a workspace for the SQL compiler
    when compiling a SQL statement. For dynamic SQL this heap will be used during
    the execution of the dynamic SQL statement, whereas for static SQL it is only
    used during the bind process. It is allocated for each statement during compiling
    or binding. It is freed when precompiling or binding of each statement is complete.
    The default should be adequate. If not, an error will be returned indicating the
    statement is "too complex." Increase the size in regular increments until the
    problem is resolved. In EEE, the app_ctl_heap_sz is used instead.


    # Query Heap Size (query_heap_sz)


    query_heap_sz specifies the maximum amount that can be allocated for the query
    heap. Query heap is used to store each query in the agent''s private memory. Information
    stored for each query consists of the SQLDA, statement, SQLCA, package name, creator,
    section number, and consistency token. Memory for blocking cursors is also allocated
    from query heap along cursor control blocks and fully resolved output SQLDA. Query
    heap size defaults to the size of the Application Support Layer Heap Size (aslheapsz).


    # Client IO Block (rqrioblk)


    rqrioblk specifies the size of the communication buffer between the remote applications
    and the database and their local client and the database server. It is allocated
    when a remote client issues a connection request for a server database, and when
    a blocking cursor is opened, additional blocks are opened at the client. It is
    freed when the remote application connects from the server database and when the
    blocking cursor is closed. When a remote client requests a connection to remote
    database, this communication buffer is allocated on the client. buffer of 32,767
    is initially allocated until a connection is established and the database server
    can determine the value of rqrioblk at the client. The server knows this it will
    reallocate its buffer if the client is not 32,767. rqrioblk is also used to determine
    the size of the I/O block at the database client when a blocking cursor is opened.
    The default is generally sufficient. If fetch requests are generated greater than
    by the application, OPTIMIZE FOR N ROWS can be used to influence the access path
    and control the number of rows returned in a block.'
