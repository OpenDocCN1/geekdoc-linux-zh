  md: '# Foreword


    In 2003 DB2 celebrated its 20th anniversary, which is significant in this day
    and age of disposable, ever-changing software. But what exactly does this mean?
    The term “DB2” has a lot of things over the course of its 20-year history. Way
    back in the dark ages of DB2 version 1, back in 1983, DB2 very clearly meant “IBM’s
    mainframe database management system.”


    But times change, and so has DB2. There are five platform (or operating system)
    choices for DB2: mainframe, Linux/UNIX/Windows, AS/400 (iSeries), VSE/VM, and
    PDA (Palm/PocketPC). My opportunity to use DB2 UDB on Linux, UNIX, and Windows,
    too. And there is a lot to learn—even for veterans of DB2 on other platforms.


    Whether you are a DBA or an application programmer using DB2 UDB for Linux, UNIX,
    and Windows, this book will provide you with much valuable information. It offers
    a treasure trove of information. From Logical and physical database design to
    high performance I/O strategies to database tuning to running DB2 utilities, Phil
    offers practical and useful advice to simplify your DB2 UDB experience.


    I think my favorite chapter is Chapter 11 where Phil takes you on a guided tour
    through the mines of identifying and correcting DB2 problems. The diagnostic tools
    and tips he covers in this chapter are essential knowledge for anyone who uses
    DB2 regularly. I mean, how many of you relate to getting that strange problem
    just won''t go away—and the manuals aren''t any help? Well, now you’ll have a
    place to turn.


    But really, this whole book is valuable. Philning has written this comprehensive
    new book to offer you the benefit of hard-won “in the trenches” knowledge of DB2
    UDB. You really need to own this book so you can take advantage of learning from
    the battles Phil has fought over the'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'years because few can approach Phil''s years of hands-on experience. Between
    these pages you will find exhaustive coverage of just about everything you''ll
    need to know as you design, build, and manage your DB2 UDB applications on Linux,
    UNIX, and Windows platforms.


    Importantly, this is not a book for pure novices. Phil assumes that you''ve had
    some exposure to relational databases, so he doesn''t waste any time teaching
    the syntax basics that most people already know. And I also have to note that
    you will enjoy Phil''s writing style. Sometimes when I read software books and
    manuals I get lost in the arcane and convoluted writing style frequently employed
    by technicians. You know what I''m talking about—when you''re sure the information
    is there but it just doesn''t seem like English anymore. Well, you won''t have
    that problem here. This book is well written and in a style that is easy to read
    and understand.


    I am pleased that Phil asked me to write the foreword for this great new book.
    I enjoyed reading it, and I am sure you will enjoy reading it too.


    —Craig S. Mullins

    Director, Technology Planning

    BMC Software

    June 2003'
  merge: -1
  pgno: 23
