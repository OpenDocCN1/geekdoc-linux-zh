  md: '# Partitioning Keys


    DB2 uses a partitioning key and a hashing function to evenly distribute data across
    tables in database partitions. The partitioning key is defined using the CREATE
    TABLE command. Criteria that you should use for selecting partitioning keys are:


    +   - Frequently used joins

    - Columns that have a proportion of different values

    - Integer columns are more efficient than character columns

    - Equi-join columns

    - Use the smallest number of columns possible


    There are rules associated with creating partitioning keys. Most of these rules
    are designed to enable DB2 to provide good performance. The following rules apply
    to partitioning keys:


    +   - Primary key or unique index must include the partitioning key

    - Long varchar and LOB columns cannot be part of the partitioning key

    - If no partitioning key is specified, the first column that is not a long field
    is used

    - Tables containing only long fields cannot have partitioning keys and can only
    be placed into single-partition database partition groups


    > NOTE\New in v8.1, Identity Columns are supported and can be part of the partitioning
    key.


    # Partitioning Map Concepts


    As depicted in Figure 13.8, the value of the partitioning key is input to a hashing
    algorithm that determines what partition will contain the data.


    ![](img/961b0d3b0e157406ef7a293880ab928e_324_0.png)


    | 0 | 1 | 2 | 3 | 5 | 6 | 7 | 8 | 9 | ... | 4095 |

    |---|---|---|---|---|---|---|---|---|---|---||

    | 1 | 2 | 3 | 4 | 1 | 2 | 3 | 4 | 1 | ... | 4 |


    Figure 13.8

    Partitioning map process.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Chapter 13 • Enterprise Server Edition—Database Partitioning Feature


    The following steps describe the flow in Figure 13.8:


    +   1. Data is being inserted into a table in the database and the value of the
    partitioning key is provided.

    2. The partitioning key is provided to the hashing algorithm. The hashing algorithm
    transfers the partitioning key value into a number between 0 and 4095 and that
    new value is used as an index in the partitioning map.

    3. The Partitioning Map (PMAP) contains a value at the index that indicates the
    database partition number where the row is to stored.


    DB2 keeps track of PMAP entries in the DB2 catalog. The SYSCAT.PARTITION column
    contains the PMAP for a particular database partition stored as a Long VARCHAR
    data type. We will see later in this chapter how we can extract the contents of
    the PMAP using the db2cmap utility.


    If we look at the partition number in Figure 13.8, we see that it is being assigned
    in a robin fashion. Partition numbers are assigned in ascending order from 1 to
    4 in this example (because we have four partitions). This is the DB2 default partition
    assignment method. The default partition assignment is generally adequate and
    will provide an even distribution in most cases. A custom PMAP can be created
    if data is a problem. Refer to the DB2 UDB v8.1 Administration Guide: Implementation
    for further details. Now that we have looked at database partitioning and partitioning
    maps, we need to discuss another aspect of database partitioning called a Database
    Partition Group.


    # Database Partition Group


    A database partition group is a grouping of database partitions within a database.
    A partition can be a member of more than one database partition group. A database
    partition group has a database PMAP associated with it. We can use database partition
    groups to specify which partitions contain a particular table''s data. There are
    two types of database partition groups:


    +   - Single-Partition Database Partition Group—Contains only one database partition

    - Multipartition Database Partition Group—Contains more than one database partition


    See Figure 13.9 for an example of a database partition group.


    As we can see in Figure 13.9 we have two database partition groups. Both are multipartition
    databases, with the INV_MATCH database partition group comprising all the database
    partitions, and the ATGW_P database partition group, which does not include database
    partition #1. We will see the importance of database partition groups under the
    next section on collocated joins. The following commands were used to create the
    database partition groups in the previous example:


    ```

