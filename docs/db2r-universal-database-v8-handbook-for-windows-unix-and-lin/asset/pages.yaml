  md: '# Monitoring Bufferpool Performance


    Interpretation of these various numbers, along with additional formulas, will
    be discussed in great detail later in this chapter; see “Formulas for Determining
    Bufferpool Efficiency and Effectiveness.


    # DB2 Event Monitors


    Bufferpool performance information can also be obtained from DB2 Event Monitors,
    Database, Bufferpool, Tablespace, and Connection Events all provide detailed bufferpool
    I/O numbers similar to the DB2 Snapshot commands. Again, the performance metrics
    are aggregated at the corresponding DB2 object level, with Database Events summarizing
    bufferpool performance across all bufferpools for the entire database, Buffer
    Events detailing bufferpool I/O performance at the individual tablespace level,
    and Connection Events detailing bufferpool I/O performance for each individual
    connection to the database.


    Database, Bufferpool, and Tablespace event records are only written by DB2 when
    the database is stopped or the FLUSH command is issued. For purposes of evaluating
    bufferpool performance, the DB2 Snapshot commands are usually the best choice
    because the data is easy to obtain and interpret. Connection event records, however,
    are very interesting to analyze this data can help the DB2 answer such questions:


    +   * Which users or applications experience the best I/O performance? And worst?

    * Which users or applications perform the most physical read or write I/O? Direct
    I/O

    * Are there applications or users experience I/O times that are substantially
    better or worse than the norm; that is, the overall average for the database?

    * Some companies may choose to implement cost center charge-back systems based
    on the CPU times and bufferpool I/O counts reported by the Connection Monitor.


    Event monitors can write their data to raw binary files, to pipes, and beginning
    with v8, directly to DB2 tables. Since a pipe is merely a memory address, this
    output method uses the least overhead, but carries with it the burden of needing
    a program or process that continuously reads and processes the piped data. Writing
    the Event data directly to files uses very little disk space (the flat files have
    an efficient, compact, internal binary format) and captures the information at
    very low overhead cost to the database. Raw Event files will be subsequently processed
    and formatted for human interpretation; most DBAs may want to use the IBM-supplied
    sample program db2evmon for formatting raw Event data. Writing Event data directly
    to tables is the most convenient for interpreting the data, but carries with it
    the highest monitoring cost since DB2 must insert the event records into a table
    that is local to the monitored database.'
