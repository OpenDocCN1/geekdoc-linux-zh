    # REDUNDANT ARRAY OF INDEPENDENT DISKS (RAID)


    The term "RAID" was first coined by researchers at UC-Berkeley. Since then it
    has been implemented in various levels by many storage vendors. There are various
    "types" or "levels" of RAID implementations, some vendors even developing their
    own "levels," It is in widespread use for enterprise database applications. However,
    its various levels and implementations are somewhat misunderstood by IT professionals.
    Further complicating their implementation are the myriad of various vendor storage
    "black box" solutions in use today, and the lack of documentation regarding how
    to lay out DB2 tablespaces on these devices.


    The RAID Advisory Board (RAB) is an industry organization comprised of major hardware
    and software vendors. The RAB coordinates and influences industry directions and
    standards and promulgates RAID terminology and concepts throughout the IT industry.


    In Table 6.2, I have included the most common attributes for the well-known RAID
    levels.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Table 6.2 RAID Levels


    | RAID Type | Striping | Mirroring | Parity | Performance | Data Protection |

    |---|---|---|---|---|--|

    | RAID-0 | | | | | |

    | RAID-1 | | X | | X (Read) | X |

    | RAID-5 | | | X | X (Read) | X |

    | RAID-10 (0+1) | X | X | | X (Read & Write) | X |


    The most common RAID types used with DB2 RAID-1 and RAID-5. RAID-0+1, or RAID-10
    as it is also known, provides the performance of RAID-0, the mirroring of RAID-1,
    and is becoming fairly common.


    I''ll discuss the details of the most popular implementations in use today, RAID-1,
    RAID-5, and RAID-10 (0+1).


    RAID-1 implements mirroring. Two identical copies of the data are stored on two
    drives. If one drive fails, the other is used. This provides a level of fault
    tolerance and data integrity. However, it requires as many disks to implement
    than just a bunch of disks (JOBDS) to secure the second copy of the data. When
    using RAID-1 with AI there are three AI parameters that need to be created: *Write_Scheduling_Policy*
    and *Mirror Write Consistency*. *Write_Scheduling_Policy* controls how writes
    are written to disk. It can be set to parallel or sequential. The default, parallel,
    should be written so that both disks will be in parallel and DB2 doesn''t have
    to wait for the second write to complete. If set to sequential, the write is not
    considered complete until the last copy completes. This would cause DB2 to wait,
    which is not desirable. The *Verify* parameter controls whether or not the AI
    write was successful. If enabled, the LVM will perform a READ for every write
    that was performed. This unnecessarily impacts writes, it is not enabled by default,
    and should not be used.


    Mirror Write Consistency (MWC) ensures that the data is consistent (the same)
    across all mirrored copies. In the event of a system crash or improper shutdown,
    MWC is used by AI to identify copies that are inconsistent. These copies are marked
    as “stale” at boot time and the MWC is used to make copies consistent. If disabled,
    the volume groups containing logical volumes need to have their autovaryon capability
    disabled and then after the system comes back up, each mirrored logical volume
    would need to be resynchronized by running `synccv -f`. It is enabled by default
    and the default should be used with the exception of volumes containing DB2 logs.
    MWC requires that every write consist of two operations: one to write the data
    and one to update the MWC cache, which is located on the outer edge of the disk.


    Logical volumes with MWC enabled should be created on the outer edge of the disk,
    as that is where the MWC cache is stored. This will minimize disk head movement
    when performing writes.'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'Redundant Array of Independent Disks (RAID)


    # RAID-5


    RAID-5 is by far the most popular RAID level in use today. RAID-5 uses block level
    striping with distributed parity and provides a high level of fault tolerance
    and high availability. Unlike RAID-3, RAID-5 writes data and parity across all
    the drives. This prevents one disk from becoming a bottleneck when writing parity
    information. However, the parity information still has to be calculated, so there
    is overhead involved. Fault tolerance is maintained by keeping the parity block
    separated from the data block. That way if one drive fails, all the data on that
    drive can be rebuilt from the parity information stored across the array. When
    a disk in the array fails, the data and parity are automatically rebuilt by the
    RAID controller. Note that an application slowdown occur during the rebuild period,
    but improvements in the size of controller cache and controller improvements have
    continued to reduce the effects of the performance degradation during rebuild
    time. RAID-5 requires a minimum of three disks to implement.


    While offering high availability and a good price/performance ratio, RAID-5 does
    have a “write penalty” associated with it. Each write to the array requires four
    I/O operations:


    +   1. Read old data

    2. Record old parity

    3. Write new data

    4. Write new parity


    However, fast write cache (FWC), which is now fairly common with RAID adaptors,
    can reduce the effects of the write penalty. FWC enables parity information for
    writes to be calculated without reading old parity data from disks in many cases.
    Therefore, the effects of the write penalty are not as significant as it is to
    use.


    Since a RAID-5 array is comprised of some number of physical disks, top priority
    tablespaces should be allocated to only one such array. This enables parallel
    I/O to be used as the data is spread over multiple physical disks in the array.
    Set the DB2_Parallel_IO registry variable to or include a list of TS IDs to enable
    parallel I/O against single containers on RAID-5. If you allocate multiple tablespace
    containers to the same array and the data from one or more tables in these tablespaces
