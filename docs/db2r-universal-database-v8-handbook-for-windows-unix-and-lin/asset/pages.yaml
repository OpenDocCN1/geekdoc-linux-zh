  md: '# FCM Message Anchors (fcm_num_anchors)


    FCM message anchors are used by FCM to pass messages between agents. This is set
    in conjunction with fcm_num_rqdb and other FCM parameters.


    # FCM Request Block (fcm_num_rqdb)


    FCM request blocks are used by FCM as the mechanism by which information is passed
    between an FCM daemon and an agent, or to facilitate passing information between
    agents.


    # FCM Bufferpool


    The FCM bufferpool contains FCM buffers and control blocks that are used to enable
    rapid communication between parallel subagents in a parallel environment.


    # FCM Buffers (fcm_num_buffers)


    fcm_num_buffers are only used in ESE when intrapartition parallelism is enabled
    and specifies the number of 4 KB buffers that are used for internal communication
    between subagents in a partitioned database environment. This parameter is critical
    to database performance and, in a future release, may be adjusted automatically
    by the database manager. The more logical nodes, the more buffers you will need.


    # FCM Control Block


    FCM control blocks are used as control mechanisms to manage the allocation and
    use of FCM buffers.


    > NOTE

    FCM communication is used when using partitioned databases or when using ESE with
    the DBM CFG parameter intra_parallel enabled.


    # Java Heap Size (java_heap_sz)


    This new parameter controls the amount of heap that the Java interpreter uses
    to service Java-stored procedures and UDFs. On UNIX there is one heap for each
    DB2 process (one for each agent or subagent on UNIX-based platforms, and for each
    instance on other platforms). There is one heap per fenced UDF and fenced process.
    Each db2famp process uses one heap. For multithreaded db2famp processes, there
    is only one heap used. Java heap is only allocated by processes that run Java
    UDFs or SPs. For partitioned databases, the same value is used at each database
    partition. Start with the default and monitor to ensure you have set it correctly
    in your environment.'
