  md: '# Business Entities


    In the following sections we will discuss the details of each model. Once we have
    identified and documented business entities, we can convert the business model
    to an entity–relationship diagram (conceptual model), as shown in Figure 3.2.


    Once we have an entity–relationship diagram, we can convert it to a logical model
    by using the following steps:


    +   1. Convert business entities to data entities

    2. Represent the degree of the relationships between entities

    3. Identify conditional relationships

    4. Convert many-to-many relationships

    5. Convert repeating groups to characteristic entities


    In Figure 3.3, we converted the conceptual model in Figure 3.2 to a logical model
    using the steps provided.


    ![](img/961b0d3b0e157406ef7a293880ab928e_52_0.png)


    Figure 3.2 An entity–relationship diagram.


    ![](img/961b0d3b0e157406ef7a293880ab928e_52_1.png)


    Figure 3.3 Entity–relationship diagram converted to logical model.'
  merge: -1
