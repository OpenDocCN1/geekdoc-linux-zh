  md: '# Variable name Operating system system Values


    The registry variable determines the maximum size (in MBs) of the file containing
    the license statistics for the system. A value of 0 turns the license statistic
    gathering off. If the variable is not recognized or not defined, the default variables
    to unlimited. The statistics are displayed using the License Center.


    | DB2DBDFT | All | Default = null |


    Specifies the database alias name of the database to be used for implicit connects.
    If an application has no database connection but SQL statements are issued, an
    implicit connect will be made if the DB2DBDFT environment variable has been defined
    with a default database.


    | DB2LOCALE | All | Default = no |

    | | | Values: YES or OR |


    Specifies whether the default "C" locale of a process is restored to the "C" locale
    after calling DB2 and whether to restore the process back to the original "C"
    after calling a DB2 function. If the original locale was not "C", then this registry
    is ignored.


    | DB2NDISCOVERRCBUFS | All | Default = 16 buffers |

    | | | Minimum = 16 buffers |


    This variable is for the NetBIOS search discovery. The variable specifies the
    number of concurrent discovery responses that can be received by a client. If
    the client receives more concurrent responses than specified by this variable,
    the excess responses are discarded by the NetBIOS layer. The default is (16) NetBIOS
    receive buffers. If a number less than the default value is chosen, then the default
    is used.


    | DB2OPTIONS | All except Windows 3.1 | Default = null |


    Sets command line options.


    | DB2SLOGON | Windows 3.x | Default = null |

    | | | Values: YES or NO |


    Enables a secure login in DB2 for Windows 3.x. If DB2SLOGON = YES, DB2 does not
    write user IDs and passwords to a file, but instead use a segment of memory to
    maintain them. When DB2SLOGON is enabled, the user must log on each time Windows
    3.x is started.


    | DB2TERRITORY | All | Default: from the language ID, as specified by the operating
    system.


    Specifies the region or territory code of the client application, which influences
    date and time formats.


