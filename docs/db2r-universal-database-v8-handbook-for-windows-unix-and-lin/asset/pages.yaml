    # LOAD UTILITY CONSIDERATIONS IN A DPF ENVIRONMENT


    In DB2, the load utility incorporates all functions of the former Autoloader Utility.
    Pre-v8 autoloader behavior is still supported. Pre-v8 autoloader behavior can
    be used by setting the DB2_PARTITIONEDLOAD_DEFAULT MPP Configuration to NO, which
    will cause the default MODE to be set to LOAD_ONLY. This needs to be used if you
    were loading data into a single partition using the former SPLIT_ONLY mode of
    Autoloader and don''t want to change existing scripts. However, there is a plan
    to change them as this support will probably be dropped in a Fixpack or future.
    The db22 executable can be used and still accepts a configuration file. In V8,
    only one connection will be established when loading data into a multipartition
    database. Pre-v8, db2at established one connection per output partition. The LOAD_VERIFY_PART
    mode and any other new features of the v8 LOAD utility cannot be used using the
    db2at executable.


    # LOAD UTILITY OPERATIONS


    Before data is loaded in a partitioned database environment, the data must be
    “partitioned” so that the load utility can load the table over the correct database
    partitions with the associated partitioning keys and PMAP. Prior to v8, this was
    referred to as “splitting” the data. Splitting is no longer applicable and we
    will use “partition or partitioning” to refer to the separation of data in accordance
    with the output from the hash function.


    Before starting a load operation, a connection must be made to the database. By
    default, the partition that you connect becomes the coordinator partition. Typically,
    this is partition 0, which is where the CREATE DATABASE command was issued from
    when you initially created the database. A partitioned load operation has two
    phases: setup and load. During the setup phase, resources and locks are acquired.
    During the load phase, the data is loaded into the appropriate partitions. The
    ISOLATE_PART_ERR option of the LOAD command determines how errors are handled
    during each of these phases. A description of this option can be found later in
    this chapter.


    There can be only one coordinator partition per load operation. The coordinator
    partition can be changed by using the SET CLIENT_CONNECT_NODE command via the
    CLP before issuing the load command.


    A load can have several types of agents associated with it:


    +   - Prepartitioning agent—reads user data and distributes it in a round-robin
    fashion to partitioning agents.'
