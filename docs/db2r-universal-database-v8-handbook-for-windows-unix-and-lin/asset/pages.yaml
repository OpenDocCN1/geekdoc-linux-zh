  md: '# NOTE


    The NOTIFYLEVEL Database Manager parameter controls the level of administration
    notification messages written to the administration notification log. The default
    value is 3. This parameter must be set to a value of 2 or higher to enable the
    Health Monitor to send notifications to contacts defined in its configuration.


    See Figures 11.4 and 11.5 for typical administration notification log entries.
    As indicated in Figure 11.4, the initial record shown using Event Viewer in Windows
    2000 Server gives us a high-level view of the problem.


    By double-clicking on this entry, we can get additional details, as shown in Figure
    11.5. A description of the problem is provided along with a recommended solution.


    For other operating systems, the log is created as an ASCII file with a file name
