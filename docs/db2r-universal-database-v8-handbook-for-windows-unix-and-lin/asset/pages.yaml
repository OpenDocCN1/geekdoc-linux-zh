    +   - LOAD_ERRS_ONLY—Errors that occur on a partition during setup will cause
    the entire LOAD operation to fail. When an error occurs while data is being loaded,
    the partition with errors will be rolled back to their last point of consistency.
    The LOAD operation will continue on the remaining partition until a failure occurs
    or all data is loaded. In the partition where all data was loaded, the data will
    not be visible following the LOAD operation. Because of the errors in the other
    partitions, the transaction will be aborted. Data on all of the partitions will
    remain invisible until a LOAD restart operation is performed. This will make the
    newly loaded data visible on the partitions where the LOAD operation completed
    and resume the LOAD operation on partitions that experienced an error.


    > The LOAD_ERRS_ONLY modifier of the ISOLATE_PART_ERRS option cannot be used with
    the ALLOW, READ ACCESS, or COPY YES options of the LOAD command.


    +   - SETUP_AND_LOAD_ERRS—In this mode, partition-level errors during setup or
    loading data cause processing to stop only on the affected partitions. As with
    the LOAD_ERRS_ONLY mode, when partition errors occur while data is being loaded,
    the data on all partitions will remain invisible until a LOAD restart operation
    is performed.


    > The SETUP_AND_LOAD_ERRS modifier of the ISOLATE_PART_ERRS option cannot be used
    with the ALLOW_READ_ACCESS or COPY YES options of the LOAD command.


    +   - NO_ISOLATION—Any error during the LOAD operation causes the transaction
    to fail.


    # STATUS_INTERVAL


