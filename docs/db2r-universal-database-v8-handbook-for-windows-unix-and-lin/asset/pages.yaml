    # Utility Guidelines and Exceptions


    In addition to locks, the load utility used to control access to the table. The
    LOAD QUERY command can be used to determine the load state; LOAD QUERY may be
    used on tables that are not currently being loaded. The table states described
    by LOAD QUERY are as follows:


    # Normal


    No states affecting the table.


    # Check Pending


    The table has constraints and these have yet to be verified. Use the SET INTEGRITY
    command to take the table out of Check Pending. The load utility puts a table
    into the Check Pending state when it begins a load on a table with constraints.


    # Load in Progress


    There is a load actively in progress on this table.


    # Load Pending


    A load has been active on this table but has been aborted before the load could
    commit. Issue a load terminate, a load restart, or a load replace to bring the
    table out of the Load Pending state.'
