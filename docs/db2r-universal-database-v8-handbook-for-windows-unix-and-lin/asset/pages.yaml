    # Figure 10.2

    Health Center.


    The Health Center can be used to make online changes to database configuration
    parameters and set monitoring thresholds for configuration parameters. In conjunction
    with the Health Monitor, the Health Center reports on threshold violations via
    Health Beacons located on the toolbar of most DB2 tools launched from the Control
    Center. Threshold breaches are recorded by the Health Center and definitions of
    the breached parameters are provided along with the tuning recommendations, as
    seen in Figures 10.3 and 10.4.


    After reviewing the alert and tuning recommendation, you can launch the Memory
    Visualizer to examine and graph DB2 memory usage. See Figure 10.5 for an example
    of the Memory Visualizer.


    Memory usage can be tracked over time and the results used to make memory heap
    parameter changes. It can then be used to track the effects of those changes.
    Lastly, the Health Monitor can be configured to provide emails and pager notifications
    to a DBA or group of DBAs. This new capability goes a long way in enabling DB2
    to provide $24 \times 7 \times 365$ monitoring-capability. For additional information
    on the Health Center and monitoring in general, refer to the *System Monitor Guide
    and Reference.*'
