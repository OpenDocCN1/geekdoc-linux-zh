- img_proc: true
  md: '# System Environment Variables


    | Variable name | Operating system | Values |


    Used to specify the target logical node of a DB2 Enterprise Server Edition database
    partition server that you want to attach to or connect to. If this variable is
    not set, the target logical node defaults to the logical node which is defined
    with port 0 on the machine.


    +   - DB2_PARALLEL_IO: Default: null; Values: *(meaning every tablespace) or a
    comma-separated list of more than one defined tablespace


    While reading or writing data from and to table spaces, DB2 may use parallel I/O
    for each table space you use. The degree of parallelism is determined by the prefetch
    size and extent size for the containers in the tablespace. For example, if the
    prefetch size is four times the extent size, then there are four extent-sized
    requests. The number of containers in the tablespace does not affect the number
    of prefetchers. To enable parallel I/O for all tablespaces, use the wildcard character,\*.
    To enable parallel I/O for a subset of tables, enter the list of tables. If there
    is more than one container, extent-size pieces of any full prefix request are
    broken down into smaller requests executed in parallel based on the number of
    prefetchers. When this variable is not enabled, the number of prefetch requests
    is created based on the number of containers in the tablespace.


    +   - DB2_PATH: Windows operating systems; Default: varying by operating system


    The environment variable used to specify the directory where the product is installed
    on Windows 32-bit operating systems.


    +   - DB2_USE_PAGE_CONTAINER_TAG: Default: null; Values: ON


    By default, DB2 stores a container tag in the first extent of each DMS container,
    whether it is a file or a device. The container tag is the metadata for the container.
    Before DB2 version 8.1, the container tag was stored in a single page, and thus
    required less space for the container. To continue to store the tag in a single
    page, set DB2_USE_PAGE_CONTAINER_TAG to ON.


    However, if you set this registry variable to ON when you use RAID devices, I/O
    performance may degrade. Because for RAID devices you create tablespaces with
    an extent size equal to or a multiple of the RAID stripe size, setting the DB2_USE_PAGE_CONTAINER_TAG
    to ON causes the extents not to line up with the RAID stripes. As a result, an
    I/O request might need to access more physical disks than would be optimal. Users
    are strongly advised against using this registry variable.


    To activate changes to this registry variable, issue a DB2STOP command and then
    enter a DB2START command.'
  merge: -1
