  md: '# TRAPS


    When severe errors are encountered, DB2 will issue a signal (on UNIX platforms)
    or an exception to itself. These are also known as segment violations or traps,
    depending on the operating system.


    Signals or exceptions initiated by DB2 are reported in a trap file, which contains
    a function flow of the last steps that were executed before the system stopped.
    Trap files are used by DB2 Support to assist them in resolving problems.


    Trap files reside in the directory specified by the DIAGPATH database manager
    configuration parameter. Trap files use the following naming convention:


    ```

    t39336.000

    t39338.006

    ```


    Where


    +   - t—identifies this as a trap file

    39336.000—is the name of the process with pid 39336

    39336.010—is the name of the process with pid 39338.006; with 006 signifying the
    database partition on which the process was running.


    > NOTE

    DB2 does not remove trap, dump, core, or trace files. You should delete these
    files on a periodic basis.


    # CALL STACK TRACES


    Call stack traces can be useful in providing DB2 Support with a detailed trace
    of internal DB2 functions in the order they were called. It can be used by DB2
    Support to pinpoint the actual lines of code that were being executed and help
    them to eliminate or identify the module involved as the source of the problem.


    On UNIX operating systems, DB2 can generate a stack traceback when you intentionally
    stop a DB2 process. Each file (trap file) reports the signal or exception that
    was issued by DB2 to stop or interrupt the process. There is one file per process.
    In a partitioned database environment, these files reside on each partition for
    each process involved. To activate a call stack trace, use the following commands:


    +   1. Issue the db2_call_stack command

    2. Stop the DB2 instance'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# NOTE


    The db2_call_stack command should be run by the instance

    owner only. Before running the command, make sure that a /tmp/

    $DB2INSTANCE directory exists at each mode. If not, create it by

    issuing the command: db2_all "mkdir /tmp/

