    | | | Range: 0-25 |


    Specifies the number of NetBIOS requests that can run concurrently on Windows
    3.x clients. The higher you set this, the more memory below the 1MB level is used.
    When the concurrent number of requests to use NetBIOS services reaches the number
    you have, subsequent incoming requests are held in a queue and become active as
    the current requests completes. If you enter (zero) for DB2RETQ, the Windows database
    client allows NetBIOS calls in synchronous mode without the NetBIOS wait option.
    In this mode, the database client allows only the current NetBIOS request to be
