  md: 'extreme case and these values should have been reversed. The problem in this
    case was that a third-vendor package was being used and the DBAs had not looked
    at the SQL running. Instead, they kept increasing the values of SHEAPATHRES and
    SORTHEAP. The first place to look for a problem is the SQL! A quick snapshot of
    SQL being run indicated that applications were spending 90% of their time sorting
    and consuming all of the CPU on a 12-way S-80. One statement was captured and
    run through Index Advisor and some additional indexes were recommended. Visual
    Explanation was used to review the access plan and it revealed eight separate
    sorts were being performed. A combination of Design Advisor recommendations and
    the Bonnie Baker method (local, ORDER BY, join predicates) was used to modify
    indexes and create two new ones. This eliminated five of the eight original sorts
    and reduced overall CPU consumption by 33%.


    As a result of this tuning effort, SHEAPTHRES memory was able to be reduced. In
    addition to the example given, 30 additional SQL statements that were doing sorts
    were identified. Most of these sorts could have been eliminated using the techniques
    just discussed.


    # HINT


    Look for statements with high amounts of CPU and sort time. These will be the
    resource consumers in a system. Eliminating these sorts will provide the biggest
    improvements to database performance.


