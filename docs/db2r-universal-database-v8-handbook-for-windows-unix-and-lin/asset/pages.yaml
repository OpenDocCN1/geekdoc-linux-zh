- img_proc: true
  md: '# CHAPTER 5


    # Type-2 Indexes and Multidimensional Clustering


    New in v8, type-2 indexes have been designed to significantly reduce next key
    share locking for DELETE and UPDATE transactions, and to enable many new availability
    and performance features in v8. These features are explained in more detail in
    this chapter. Multidimensional clustering is a new clustering capability introduced
    in v8 that enables tables to be continuously and automatically clustered along
    multiple dimensions. MDC tables don''t require regular reorganization and provide
    for significant performance and availability enhancements for v8 databases.


    # BENEFITS OF TYPE-2 INDEXES


    Type-2 indexes enable an index to be created on columns whose length is greater
    than 255 bytes (this available in DB2 UDB v7.2 via a registry variable). Type-2
    indexes eliminate most next key share locking, which reduced concurrency in prior
    releases of DB2. With type-2 indexes, index entries are pseudodeteleted instead
    of being physically removed from the page.


    > NOTE

    DB2 uses the one-byte ridFlag byte stored for each row identifier (RID) on the
    leaf page of a type-2 index to mark the RID as logically deleted so that it can
    be physically removed later.


    If possible, these pseudodeleted index entries are then cleaned during a lull
    in database activity. However, if you have a database that is always busy, you
    can run the RECHK utility to identify candidates for a cleanup via the REORG utility.
    Additional ways that pseudodeleted entries can be cleaned up are as follows:


    +   - During subsequent insert, update, or delete activity'
  merge: -1
  pgno: 88
- img_proc: true
  md: "+   - During key insertion, keys that are marked deleted and are known to be\
    \ committed cleaned up if such a cleanup might avoid the need to perform a page\
    \ split and prevent the index from increasing in size.\n\n+   - If there is an\
    \ X lock on the table when a key is deleted, the key is physically deleted instead\
    \ of just being marked deleted. During this physical deletion, deleted keys on\
    \ the same page are also removed if they are marked deleted and known to be committed.\n\
    \n+   - By executing the REORG INDEXES command with CLEANUP options specified.\
    \ Refer to the definition of the REORG utility in Chapter 7 for further details.\n\
    \n+   - Any rebuild of an index by not using one of the following utilities:\n\
    \  - REORG indexes when not using one of the CLEANUP options\n  - REORG TABLE\
    \ when not using the INPLACE option\n  - IMPORT with the REPLACE option\n  - LOAD\
    \ with the INDEXING MODE Rebuild option\n\n# TYPE-2 INDEXES AND NEXT-KEY LOCKING\n\
    \nNext-key locking for type-2 indexes occurs when a key is inserted into an index.\
    \ During insertion of a key an index row that corresponds to the key that will\
    \ follow the new key in the index is locked only if that row is currently locked\
    \ by an RR scan. The lock mode used for the next-key lock is NW (Next Key Exclusive).\
    \ The next-key lock is released before the key insertion is actually performed.\
    \ Key insertion occurs when a row is inserted into a table.\n\nNext-key locking\
    \ with type-2 indexes can also occur when updates to columns in row change the\
    \ value of the index key. When this happens, DB2 marks the original key value\
    \ as deleted and the new key value is inserted into the index.\n\nThis is a significant\
    \ improvement over type-1 indexes, where index deletion requires an X lock on\
    \ the key and the lock is held until commit time.\n\n# MIGRATION CONSIDERATIONS\
    \ FOR TYPE-2 INDEXES\n\nAll new indexes are created as type-2 indexes. The only\
    \ exception to this is when you create a type-2 index on a table that already\
    \ has type-1 indexes. The new index will also be a type-1 index.\n\nYou can use\
    \ the INSPECT command to find out what kind of indexes exist on a table. Refer\
    \ to Chapter 7, Commands and Utilities for detailed information on the INSPECT\
    \ command. Type-1 indexes can be converted to type-2 indexes by executing the\
    \ REORG INDEXES command.\n\nType-2 indexes are required for you to use the following\
    \ new features in v8:\n\n+   - ONLINE Table Reorganization\n  - ONLINE Index Reorganization\n\
    \  - ONLINE LOAD\n  - MDC Clustering\n  - For elimination of most Next-Key locking\
    \ problems"
  merge: -1
  pgno: 89
- img_proc: true
  md: '# SUGGESTED MIGRATION STRATEGY FOR TYPE-2 INDEXES


    You should prioritize your migration to type-2 indexes based on your business
    rules and priorities. Important tables that you need to REORG ONLINE or LOAD ONLINE
    should be done during your normal maintenance window or you may need to schedule
    a maintenance window for these tables. The strategy you use depends on your environment
    and operational procedures. The remaining indexes can be converted to type-2 as
    part of ongoing maintenance via utilities that cause a rebuild of the index. Of
    course, you need to develop a strategy that works for you in your environment
    and within your operational and business constraints.


    # MULTIDENSIONAL CLUSTERING


    MDC enables tables to be physically clustered on more than one dimension (key)
    simultaneously. To understand how MDC works, it''s helpful to understand the following
    definitions:


    +   * A Dimension block index is an index that is automatically created for each
    dimension specified.

    * A Composite block index is an index automatically created that contains all
    dimension columns and will be used to maintain the clustering of data over insert
    and update activity. This index will only be created if a single dimension does
    not already contain all the dimension columns. The optimizer can use both dimension
    indexes and composite block indexes to efficiently retrieve data.

    * A Cell is made up of unique combinations of dimension values composed of blocks
    of pages, where a block is a set of consecutive pages on disk.

    * A Slice is a set of blocks containing pages having a certain key value of one
    of the dimension block indexes.


    Every page of an MDC table is part of exactly one block, and all blocks of an
    MDC table consist of the same number of pages. This is known as the Blocking Factor.
    The Blocking Factor is equal to the extent size that block boundaries line up
    with extent boundaries.


    If you are using SMS tables for MDC tables, the SMS file (directory) is extended
    one page at a time. Since MDC tables are extended by a block, you should run the
    db2empfa utility to enable multipage file allocation. With multipage file allocation
    enabled, the SMS file will be extended by exactly the size required. This will
    significantly improve performance of MDC tables using SMS table spaces.


    Dimension block indexes are structured like traditional index structures except
    at the leaf level. Use a Block Identifier (BID) instead of the index-level use.
    Because BIDs point to blocks that can contain many pages, BID entries are much
    smaller than traditional RID indexes.


    Here is a sample command to create an MDC table :'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# CREATE TABLE REGION


    ( Region INT NOT NULL,

