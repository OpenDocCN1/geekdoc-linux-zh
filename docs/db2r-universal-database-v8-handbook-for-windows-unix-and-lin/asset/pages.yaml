    and administrative events. Recovery events include full database- and tablespace-level
    backup, incremental backup, restore, and roll-forward operations. Additional logged
    events include create, alter, drop or rename tablespace, reorganize table, drop
    table, and load.


    # Authorization


    Required connection Instance. You must attach to any remote database in order
    to run this command against it. For a local database, an explicit attachment is
    not required.


