    # Utility Guidelines and Exceptions


    Any RESTORE DATABASE command of the form db2 restore <name> will perform a full

    database restore, regardless of whether the image being restored is a database
    image or a

    tablespace image. Any RESTORE DATABASE command of the form db2 restore <name>

    tablespace will perform a tablespace restore of the tablespaces found in the image.
    Any

    RESTORE DATABASE command in which a list of tablespaces is provided will perform
    a restore

    of whatever tablespaces are explicitly listed.


    > NOTE

    Following the restore of an online backup, you must perform a roll-forward recovery.


    # ROLL-FORWARD DATABASE


    Roll-forward database recovers a database by applying transactions recorded in
    the database log

    files. It is invoked after a database or tablespace backup image has been restored,
    or if any

    tablespaces have been taken offline by the database due to a media error. The
    database must be

    recoverable (i.e., either logretrain, userexit, or both of these database configuration
    par-meters must be enabled) before the database can be roll-forward recovered.


    # Scope


    In a partitioned database environment, this command can only be invoked from the
    cat-alog partition. A database or tablespace roll-forward operation to a specified
    point in time affects

    all partitions that are listed in the db2nodes.cfg file. A database or tablespace
    roll-forward opera-tion to the end of logs affects the partitions that are specified.
    If no partitions are specified, it

    affects all partitions are listed in the db2nodes.cfg file; if roll-forward recovery
    is not needed

    on a particular partition, that partition is ignored.


    # Authorization


    One of the following:


    +   * Sysadm

    * Sysctrl

    * Sysmaint


    Required connection None. This command establishes a database connection.


    # Command Parameters


    ```

    DATABASE database-alias

    ```


    The alias of the database that is to be roll-forward recovered.'
