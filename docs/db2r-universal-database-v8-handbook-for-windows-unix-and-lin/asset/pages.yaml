  md: '# Physical Reads per Minute (PRPM)


    # PRPM FORMULA


    (Bufferpool data reads + Bufferpool index physical reads) / Number of elapsed
    minutes since monitor switches activated or reset


    Given a reasonably steady workload, PRPM provides a measure of bufferpool effectiveness.
    As bufferpool hit ratio increases, physical I/O rates should conversely decrease,
    yielding quicker elapsed times for SQL statements.


    By computing PRPM for each tablespace, the DBA can quickly determine the tablespaces
    with the heaviest I/O workloads by ranking tablespaces by PRPM. For the tablespaces
    with the highest PRPM rates, performance can be optimized by ensuring tablespaces
    their containers distributed across as many disk devices as possible. This increases
    the number of disk arms and improves opportunities to do parallel I/O, thus generally
    lowering disk read times.


    # Asynchronous Pages per Request (APPR)


    # APPR FORMULA


    (Asynchronous pool data page reads + Asynchronous pool index page reads) / (Asynchronous
    read requests)


    Using the values found in Example 8.1,


    > APPR = (108 + 21) / 17 = 7.6


    APPR provides the DBA with a measure of prefetch effectiveness. Each tablespace
    has a PREFETCHSIZE assigned to it. The PREFETCHSIZE is supposed to determine how
    many pages are asynchronously delivered to the bufferpool in anticipation of the
    application SQL statement''s desire for large quantities of data.


    By way of example, consider the following scenario: Along an SQL statement with
    an access strategy to TBSCAN, DB2 issues prefetch requests (called prefetches)
    and controlled by the NUM.IOSERVER DB CFG PARAMETER and these prefetches will
    fetch data measuring approximately one PREFETCHSIZE worth of data. The NUM_IOSERVER
    goes out to disk, PREFETCHSIZE number of pages, and are returned to the bufferpool
    manager. One of two things happens:


    +   1. The pages are accepted by the bufferpool manager and placed into the designated
    bufferpool. (This is good) APPR is equal, or nearly equal, to the EXTENTSIZE(s)
    of the tablespace(s) assigned to the bufferpool.'
