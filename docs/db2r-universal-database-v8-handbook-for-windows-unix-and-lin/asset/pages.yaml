- img_proc: true
  md: '# Utility Guidelines and Exceptions


    Information about the current progress of table reorganization is written to the
    history file for database activity. The history file contains a record for each
    reorganization event. To view this, execute the db2 list history command for the
    database that contains the table you are reorganizing.


    You can also use table snapshots to monitor the progress of table reorganization.
    Table reorganization monitoring data is recorded regardless of the Database Monitor
    Table switching.


    If an error occurs, an SQLCA dump is written to the history file. For an in-place
    reorganization, the status is recorded as PAUSED.


    When an indexed table has been modified many times, the data in the indexes may
    become fragmented. If the table is clustered with respect to an index, the table
    and index can get out of order. Both of these factors can adversely affect the
    performance of scans using the index, and can impact the effectiveness of index
    page prefetching. REORG INDEXES can be used to generalize all of the indexes on
    a table, remove any fragmentation, and restore physical clustering to the leaf
    pages. Use REORGCHK to help determine if an index needs reorganization.


    > NOTE

    The REORG TABLE command is not supported for declared temporary tables.


    Indexes may not be optimal following an in-place REORG TABLE operation, since
    only the data object and not the indexes are reorganized. It is recommended that
    you perform an in-place REORG INDEXES operation. Indexes are completely rebuilt
    during the last phase of a classic REORG TABLE, however, reorganizing indexes
    is not necessary.


    Tables that have been modified so many times that data is fragmented and access
    performance is noticeably slow are candidates for the REORG TABLE command. You
    should also invoke this after altering the inline length of a structured type
    column in order to benefit from the altered inline length. Use REORGCHK to determine
    whether a table needs reorganization. After reorganization, use REUNSTATS to update
    the table statistics, and REBIND to rebind the packages that use this table. The
    reorganize utility will implicitly close all of the cursors.


    If the table contains a mixed row format before the table value compression has
    been activated or deactivated, an offline table reorganization can convert all
    the rows into the target row format.


    If the table is partitioned onto several database partitions, and the table reorganization
    fails on any of the affected database partitions, only the failing database partitions
    will have the table reorganization rolled back.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# NOTE


    If the reorganization is not successful, temporary files should not be deleted.These
    files are created on the database path. The database manager uses these files
    to roll back the failed reorganization.


    If the name of an index is specified, the database manager reorganizes the data
    according to the order of the index.


    # NOTE


    To maximize performance, specify an index that is often used in SQL queries. If
    the name of an index is not specified, and if a clustering index exists, the data
    will be ordered according to the clustering index.


    The PCTFREE value of a table determines the amount of free space designated per
    page. If the value has not been set, the utility will fill up as much space as
    possible on each page.

    Utility does not support the use of nicknames.


    To complete a table space roll-forward recovery following a table reorganization,
    both data and LONG table spaces must be roll-forward enabled.


    If the table contains LOB columns that do not use the COMPACT option, the LOB
    DATA storage object can be significantly larger following table reorganization.
    This can be a result of the order in which the rows were reorganized and the types
    of tablespaces (SMS/DMS).


    REORG TABLE cannot use an index that is based on an index extension.


    # NOTE


    Reorganizing data is one of the most important performance-improvement actions
    you can take.


    # REORGCHK UTILITY


    Calculate statistics on the database to determine if tables or indexes, or both,
    need to reorganized or cleaned. The REORGCHK utility should be run on a weekly
    basis or more often, if necessary. The output of the utility will indicate if
    a reorganization is required. The REORGCHK utility has been enhanced in v8 to
    report on pseudo-deleted index entries that require cleanup. Also, the ON SCHEMA
    option has been added in v8. This allows you to specify the object schema for
    which you want to run the REORGCHK utility.


    Scope This command can be issued from any database partition in the db2nodes.cfg
    file. It can be used to update table and index statistics in the catalogs.'
  merge: -1
