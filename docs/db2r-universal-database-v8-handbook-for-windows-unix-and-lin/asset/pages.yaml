  md: '# ON ALL COLUMNS


    Statistics collection can be done on some columns and not on others. Columns such
    as LONG VARCHAR or CLOB columns are ineligible. If it is desired to collect statistics
    on all eligible columns, one can use the ON ALL COLUMNS clause. Columns can be
    specified either for basic statistics collection (on-cols-clause) or in conjunction
    with the DISTRIBUTION clause (on-dist-clause). The ON ALL COLUMNS specification
    is the default option if neither of the column specific clauses are specified.


    If it is specified in the on-cols-clause, all columns will have only basic statistics
    collection unless specific columns are chosen as part of the DISTRIBUTION clause.
    Those columns specified as part of the DISTRIBUTION clause will also have basic
    and distribution statistics collected.


    If the DISTRIBUTION ON ALL COLUMNS is specified, both basic statistics and distribution
    statistics are collected for all eligible columns. Anything specified in the on-cols-clause
    is redundant and therefore not necessary.


    # ON COLUMNS


    This clause allows the user to specify a list of columns for which to collect
    statistics. If you specify a group of columns, the number of distinct values for
    the group will be collected. Statistics for columns that you do not list will
    be cleared. This clause can be used in the on-cols-clause and the on-dist-clause.


    > NOTE

    Collecting distribution statistics for a group of columns is not currently supported
    in v8 but planned as a future capability.


    # ON KEY COLUMNS


    Instead of listing specific columns, one can choose to collect statistics on columns
    that make up all the indexes on the table. It is assumed that critical columns
    in queries are also those used to create indexes on the table. If there are no
    indexes on the table, it is as good as an empty list and no column statistics
    will be collected. It can be used in the on-cols-clause or the on-dist-clause.
    It is redundant in the on-cols-clause if specified in both clauses since the DISTRIBUTION
    clause is used to specify collection of both basic and distribution statistics.


    column-name


    column-name must be the name of a column in the table. If you specify the name
    of an ineligible column for statistics collection, such as a nonexistent column
    or a mistyped column name, error (-205) is returned. Two lists of columns can
    be specified, one without and one with distribution. If the column is specified
    in the list that is not associated with the WITH'
  merge: -1
