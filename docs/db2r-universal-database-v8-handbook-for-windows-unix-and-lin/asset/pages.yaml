    # SYSSTAT.TABLES


    Contains one row for each base table. Views or aliases are, therefore, not included.
    For typed tables, only the root table of a table hierarchy is included in this
    view. Statistics are not recorded for inherited columns of typed tables. The CARD
    value applies to the root table only while the other statistics apply to the entire
    table hierarchy.


    | Column Name | Data Type | Nullable | Description | Updatable |

