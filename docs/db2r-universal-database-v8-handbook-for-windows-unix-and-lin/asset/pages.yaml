- img_proc: true
  md: 'Monitoring and Tuning Tables, Bufferpools, and Tablespaces


    # # Table Space Activity


    Once you have the database''“important” tables isolated into their own tablespaces,
    you should compute performance metrics for each tablespace on a regular basis
    and save the results of your calculations in a tablespace performance history
    table or spreadsheet. Of particular importance, be sure to compute I/O performance
    times (ORMS, ARMS, SRMS), APPR, PRPM, and ARP and SRP. If you also track and save
    Used Pages on a periodic basis, you may be able to infer a growth rate, or Pages
    used Per Day (PPD).


    # # Assigning Table Spaces to Bufferpools: General Concepts


    In sense, bufferpools are like a private club. They work best when the majority
    of members share the same beliefs, principles, and behaviors. The DBA should try
    to organize a number of bufferpool “clubs” within his or her database so that
    the bufferpool will be more effective.


    In society, there are certain clubs or organizations whose objectives and behaviors
    clash. In DB2, the central controversy lies between random and sequential I/O.
    When assigning objects to DB2 UDB buffers, it is very important, first and foremost,
    to keep objects with random I/O patterns (high SRP values) separated from sequential
    I/O patterns (low SRP values). Within these two broad groupings, it can also be
    beneficial to create special-purpose bufferpools that have very specific and well-defined
    objectives.


    Given these premises, I suggest the following general guidelines for defining
    bufferpools in an OLTP database (individual circumstances and results may vary):


    +   - TEMBPB—A bufferpool dedicated to TEMSPACE tablespace I/O, which tends to
    be predominantly sequential (low SRP value) and can be substantial when occasional
    decision support queries are executed.

    - RANDOMBP—A bufferpool for objects whose access patterns are highly random in
    nature; that is, rarely exhibit prefect or asynchronous I/O behaviors (high SRP
    value).

    - ASYNCBP—A bufferpool for objects whose access patterns are predominantly asynchronous;
    that is, preface I/O occurs more often than not (low SRP value).

    - HOTINDEXBP—A bufferpool for index of tables that are very frequently read via
    index access. Access should be predominantly random (high SRP value).

    - HOTDATABP—A bufferpool for tables that are very frequently read, especially
    those at the heart of an OLTP system (high SRP value).

    - ASTBP—A bufferpool for tablespaces containing Automatic Summary Tables.

    - SYSCATBP_R—Randomly read bufferpool for the SYSCAT tablespace.


    The first three bufferpools defined above can have broad object membership. The
    latter four are bufferpools with special causes and specific agendas.'
