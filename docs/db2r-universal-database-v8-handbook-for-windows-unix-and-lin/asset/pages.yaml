    PID:2640(asnapply) TID:8192 Appid:none

    oper system services sqlofica Probe:10


    # Example 11.2


    Sample dbdiag.log SQLCA entry. (Contained)


    The SQLCA uses the standard FDDC format. SQLCA field definitions are as follows:


    +   1. Process ID

    2. Unique transaction ID

    3. Node where the error occurred

    4. Title

    5. Eye catcher that identifies the beginning of the SQLCA data structure entries

    6. The SQL return code value

    7. Reason codes, if provided

    8. A hexadecimal value of up to six entries that caused the final SQL return code
    value generated—These codes are recorded in the sequence of events as they occurred

    9. SQLSTATE—the ANSI STANDARD SQLSTATE value


    In our example, we have a return code of 0x8012007E and an SQLCODE of -518. Using
    the DB2 Information Center, we search on these codes and find that a -518 SQL
    code or a 07003 SQLSTATE means “a statement included in the EXECUTE statement
    is not in a prepared state or is a SELECT or VALUES statement.” You can use this
    information to help a developer solve an problem.


    # DB2 ADMINISTRATION NOTIFICATION LOG


    New in v8, the Administration Notification log is used to record errors of interest
    to DBAs and application developers. In Windows 2000, DB2 uses the Windows event
    log as the Administration Notification log. It can be viewed with the Windows
    Event Viewer tool.'
