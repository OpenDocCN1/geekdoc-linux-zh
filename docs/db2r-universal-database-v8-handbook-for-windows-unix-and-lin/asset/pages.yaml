  md: '# Enterprise Server Edition—Database Partitioning Feature


    B2 Enterprise Server Edition (ESE) is shipped with database partitioning as part
    of the ESE product which enables the logical partitioning of data across many
    servers. In prior releases this was known as Enterprise Extended Edition (EEE).
    In order to use this option, you must license the Database Partitioning Feature
    (DPF). DB2 ESE uses a shared-nothing architecture. The shared-nothing architecture
    is very scalable. Unlike the Symmetric Multiprocessor (SMP) architecture, where
    scalability is limited by the amount of real memory that can be added and the
    overhead involved in managing multiple CPUs, shared-nothing architecture can scale
    by adding additional servers. DB2 provides mechanisms for extending data to these
    new servers. They will be covered later in this chapter.


    My goal in this chapter is to provide you with an overview of database partitioning
    and with the details you will need to know to implement, and maintain a DB2-partitioned
    database.


    # When Should You Use Partitioned DATABASES?


    This section is included because this is a question many of us have had to ponder,
    and arriving at a decision is not very easy unless you know what characteristics
    your application should have to work well with a partitioned database environment.


    Besides the need for scalability, which is a basic feature of a partitioned database,
    we need to understand how DB2 uses parallelism so we can then determine if we
    should choose a partitioned or nonpartitioned database environment.


    In a partitioned database environment, DB2 uses interpartition parallelism, where
    a single SQL statement is broken into a number of subset queries and each subset
    query works on a subset of the data. Each subset query is dispatched to the appropriate
    database partition, runs in parallel on a subset of the data, and returns results
    to the coordinating agent. The coordinator partition returns the'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# Chapter 13 • Enterprise Server Edition—Database Partitioning


    results to the application. For example, a simple SELECT statement, such as "SELECT
    COLOR, STORE, SIZE FROM SKUDTL WHERE COLOR = ''BLUE''" in a four-partition database,
    would be decomposed into four subset queries across a subset of the data on the
    four partitions. These subset queries run in parallel, simultaneously, on the
    partitions involved. Since they run in parallel, the results can be returned much
    faster than if run on a uniprocessor. Partitioned databases also process complex
    queries better than nonpartitioned databases. So with complex queries such as
    those with aggregations, multiple dimensions, and time-dependent predicates, a
    partitioned database can process much of the work in parallel across multiple
    partitions and multiple servers, simultaneously. Again, this type of query runs
    well in a partitioned database environment. If your activity is primarily real-time
    inserts, updates, and deletes, then a nonpartitioned database would be a better
    choice as these operations don''t lend themselves to high degrees of parallelism.


    Finally, interpartition parallelism can be combined with intrapartition parallelism
    to return results even faster. When using both types of parallelism, DB2 can run
    subset queries across multiple database partitions and servers, and within these
    database partitions run additional subagents to scan, join, and sort data simultaneously.
    This powerful combination of two types of parallelism returns the results to the
    application very fast. Since each environment is different, you need to apply
    these guidelines to your requirements and then make the decision on whether or
    not to use DB2''s partitioned database.


    The DB2 ESE Partitioning Option can be run on SMP servers or on a special server,
    referred to as a Scalar Power Parallel (SP) Complex. Many DPF environments start
    out on an SMP server with multiple processors and large memory then scale to SMP
    complex as the data grows. See Figure 13.1 for an overview of SMP shared-everything
    architecture.


    # Server 1


    ![](img/961b0d3b0e157406ef7a293880ab928e_317_0.png)


    Figure 13.1

    SMP (shared-everything) architecture.'
  merge: -1
