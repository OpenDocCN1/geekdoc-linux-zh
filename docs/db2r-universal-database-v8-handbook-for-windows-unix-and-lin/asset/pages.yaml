  md: '# High Performance Design Tablespace and I/O Strategies


    The physical layout of tablespaces over various types of disk topologies is a
    complex task and has been identified as one of the areas where DBAs can make significant
    performance improvements if the complexities and technology involved are understood.
    Along with, DBAs are constantly trying to decide which tablespace is best; Database
    Managed Space (DMS) or System Managed Space (SMS). Which type of RAID should be
    used? RAID 1, RAID 5, or the new RAID 0-1, or RAID 10 as it is referred to. Furthermore,
    when using RAID, we are faced with additional questions such as, How do I stripe
    the tablespace? Or should I let the hardware take care of that for me? In that
    respect, you then ask, “How does the use of the AIX Logical Volume Manager striping
    work with hardware RAID?


    In conjunction with all these questions, you then ask, How does DB2 use striping,
    and what effect does the DB2_PARALLEL_IO registry variable Have with RAID devices?
    And what about new technology that is just on the horizon like InfiniBand?


    My goal in this chapter is to answer all these questions and provide you with
    a framework to use when designing your tablespaces and disk strategies for high
    performance. Additionally, we will take a look at existing I/O technologies, as
    well as emerging I/O technology that you will be able to take advantage of to
    provide a competitive advantage to your company.


    # TABLESPACES


    A tablespace is an object used to specify the physical location of data in a database.
    You can think of it as a layer between the database and the actual container that
    holds table data. A container is assigned to a tablespace. This assignment lets
    you specify the number and types of containers associated with a tablespace and
    allows you to control the physical placement of data on disks during the physical
    design process. This capability enables you to create containers on'
