  md: '# DB2 PROBLEM DETERMINATION AIDS


    In v8, diagnostic information is now written to two separate files; the db2diag.log
    and administration notification log. The db2diag.log was split into two files
    because too much information was being written to db2diag.log file and it was
    causing “information overload,” as it contained a mix of informational and severe
    errors. As a result of this and feedback from customers, DB2 Development decided
    to create a separate file for recording application errors, administrative errors,
    and miscellaneous error information. That way, the db2diag.log file can be dedicated
    to only severe-level errors.


    # DB2DIAG.LOG FILE


    The db2diag.log file is located in the SQLLIB directory. It is an ASCII file that
    can be viewed with a text editor. Entries are written by DB2 to the db2diag.log
    file when the following events occur:


    +   - Severe errors

    - DB2 internal errors


    The DIAGLEVEL DB CFG parameter controls the amount of information that is written
    to the db2diag.log file that occur. The default value for this parameter is 3.
    This will ensure that DB2 records all severe errors that occur. I recommend that
    you use this setting. Only set it to 4 when you are trying to debug a particular
    problem you haven''t been able to identify the problem through others. As soon
    as you have captured the additional information, set this parameter back to 3.


    All entries written to the db2diag.log file are written at the end of the file.
    So, you should look to the end of the file if investigating current errors. As
    entries written to the end of the db2diag.log file, it continues to grow in size.
    It will continue to grow until it runs out of disk space or uses all available
    space in the filesystem. DBAs copy the db2diag.log file nightly and delete it.
    DB2 will automatically create a new file when needed. If you copy it nightly,
    that will also give you a historical record for subsequent analysis, if needed.
    With only severe errors being written to the db2diag.log file these procedures
    may not be as important as in prior releases, but should still be done so you
    have a copy of the db2diag.log file for each day. It can aid you in troubleshooting
    later.


    DB2 uses a naming convention for naming its modules. See Table 11.1 for a complete
    list.


    The letter in the fourth position of the function name indicates which DB2 function
    was involved. This is helpful to know when searching for a fix or talking to DB2
    support.


    # Format


    Entries written to the db2diag.log file will be in First Failure Data Capture
    (FFDC) format. See Example 11.1 for a sample db2diag.log FFDC entry.


    ![](img/961b0d3b0e157406ef7a293880ab928e_282_0.png)'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'Chapter 11 • Problem Determination


    # Table 11.1 Module Naming Conventions


    | Letter in fourth position | Function involved |

    | --- | --- |

    | B | Bufferpool management and manipulation |

    | C | Communications between clients and servers |

    | D | Data management |

    | E | Database engine process |

    | O | Operating system calls (privileged instructions) |

    | P | Data protection |

    | R | Relational database services |

    | S | Sorting operations |

    | X | Indexing operations |


    ```

    1 2003-01-22-15.55.51.437000 2 Instance:DB2 3 Node:000

    4 PID:1680 (db2syscs.exe) 5 TID:1608 6 Appid:*LOCAL.DB2.0092C2202617

    7 database monitor 8 sqm.start_evmon 9 Probe:32 10 Database:SAMPLE

    ```


    11 DIA0001E An internal error occurred. Report the following error code :

    12 *ZRC=0x84D000C.",


    # Example 11.1

    Sample db2diag.log FFDC entry.


    Although the primary purpose of the db2diag.log is to record severe errors for
    problem determination analysis by DB2 development, if you learn to interpret FFDC
    information you can use this information to solve problems that are within your
    capacity. And if not, you''ll at least in a good position to provide information
    to DB2 II support. We can break down the data elements in Example 11.1 as follows:


    +   1. Message timestamp

    2. Name of instance

    3. For a partitioned database, the database partition number of the partition
    generating the message

    4. Identification of the process generating the message

    5. The unique transaction identifier of the transaction that generated the entry

    6. Identification of the application for which the process is working; in this
    example the process generating the message is working on behalf of an application
    with the ID *Local.DB2.0092C2202617

    7. The DB2 component that is writing the message

    8. The module reporting the error'
  merge: -1
