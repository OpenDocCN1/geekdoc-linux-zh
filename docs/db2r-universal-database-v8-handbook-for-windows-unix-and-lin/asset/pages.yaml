    Set this to enable performance-related changes in the access plan manager (APM)
    that affect the behavior of SQL cache (package cache). These settings are not
    recommended for production systems. They introduce some limitations, such as the
    possibility of out-of-package cache errors or increased memory use by.

    Setting DB2_APM_PERFORMANCE to ON also enables the No Package Lock mode. This
    allows the Global SQL cache to operate without the use of package locks, which
    are internal system locks that protect cached package entries from being removed.
    The No Package Lock mode might result in some improved performance, but certain
    database operations are not allowed. These prohibited operations might include:
    operations that invalidate packages, operations that operate packages, and PRECOMPILE,
    BIND, and REBIND.


