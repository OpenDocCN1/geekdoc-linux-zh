  md: '# Load Utility Operations


    +   * Partitioning agent—receives data from the prepartitioning agent and partitions
    the data.

    * Load agents—run on each output partition and coordinate the loading of data
    on that partition.

    * Load-to-file agents—receive data from partitioning agents and write to a file
    on their partition.

    * File transfer command agents—run on the coordinator partition and execute file
    transfer commands.


