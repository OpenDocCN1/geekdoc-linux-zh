  md: '# CHAPTER 3


    # Logical and Physical Design


    Logical design is the most important of identifying entities and the relationships
    between those entities. It begins with the business model that is transitioned
    to a logical model as part of the logical design process. All new database projects
    and modifications or improvements to existing applications require a logical design.
    A logical model is used to document the logical design. There are several data
    modeling tools on the market (e.g., Erwin from CA, ERStudio from Embarcadero,
    PowerDesigner from Sybase, and Rational Rose from Rationale Software). The logical
    design process and availability and upkeep of the logical model are key ingredients
    to a successful project and database implementation. Without them a project is
    doomed to failure. The process can be customized or tailored for enhancements
    or maintenance projects but it cannot be skipped.


    Logical design is the most important step in designing a database. If you don''t
    do it in the beginning and if it is not right, then typically an implementation
    will fail and require serious modification to the application and database structure
    in production, usually at the expense of loss of business due to the new system
    not working at all, or providing only limited function.


    I have never worked on a project that skipped logical design and was successful
    and I doubt you have or ever will either. So let''s get on with the details.


    # BUSINESS MODEL


    A business model is a description of business entities, functions, relationships,
    and the business rules associated with them. The business model is essential to
    logical design and is the primary input to the logical design process. Business
    architects and analysts are responsible for developing and maintaining the business
    model. See Figure 3.1 for an example of a business model.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Chapter 3 • Logical and Physical Design


