    # Coordinating Agent (db2agent)


    DB2 assigns a coordinating agent for each connected application. Coordinating
    agents coordinate the work associated with an application. Coordinating agents
    create subagents in a partitioned database environment or if intraparallel is
    enabled, as well as the work of subagents.


    # Subagents (db2agentp)


    Subagents are created by coordinating agents to work in parallel. Subagents are
    used in partitioned database environments or if the intra_parallel DBM CFG parameter
    is enabled.


    # BUFFERPOOLS


    Bufferpools are one of the most important tuning areas in DB2 and are the single
    most important resource in DB2. Bufferpools are used to cache frequently accessed
    indexes and data in memory. Agents read and modify data in the bufferpools. If
    needed data is not found in the bufferpool, it must be retrieved from db. Bufferpools
    are covered in more detail in Chapter 8.


    # PREFETCHS (db2pfchr)


    Prefetchers are used to fetch data from disk into the bufferpool in anticipation
    of the application needing it. Agents send asynchronous prefetch requests to a
    common prefetch queue. Prefetchers process these requests from the prefetch queue
    using big-block (extent) reads or scatter I/O to bring the required pages into
    the bufferpool from disk. Prefetching performance is covered in more detail in
    Chapter 6.'
  merge: -1
