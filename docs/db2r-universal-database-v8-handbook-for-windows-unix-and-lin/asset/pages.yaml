  md: '# What’s New


    B2 Universal Database (UDB) version 8 for Linux, UNIX, and Windows is packed with
    new features that provide for unprecedented performance, manageability, and availability.
    The new version incorporates a host of features requested by DB2 customers, from
    the ability to start DB2 in single-user mode to the new infinite logging capability.


    As a participant of the closed BETA program and the open BETA test program, I
    was able to test and evaluate many of the new features in DB2 v8 that I am writing
    about. I hope that you find the multitude of features and enhancements as exciting
    as I do!


    DB2 v8 is the culmination of several years of research by IBM Labs. DB2 v8 incorporates
    technology developed as part of the LEO (Learning Optimizer) project, SMART (Self
    Management and Resource Tuning) project, and the Eliza project, which is increasing
    the reliability and availability of IBM servers.


    Current and future business practices demand that data available 24 hours a day,
    365 days a year. DB2 v8, through its many enhancements in the areas of maintainability
    and availability, meets or exceeds these demanding requirements through its new
    online reorganization capability, infinite logging capability, online index reorganization
    capability, and online load capability, to name a few.


    Self-management enhancements are evident throughout the project. Autonomic computing
    enhancements have been made in the area of new and improved Wizards, Advisors,
    and a complete suite of database management tools. These enhancements are in response
    to the ever-increasing business requirement to do more with less in an environment
    where highly skilled DBAs are hard to come by. Self-management will help companies
    meet the ever-demanding day-to-day business challenges, now and for the foreseeable
    future.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'DB2 v8 takes the already existing XML support to new levels. The XML Extender
    has been enhanced to support Web services with the Web services Object Runtime
    Framework (WORF), which is a set of tools for implementing Web services with DB2.
    Web services are XML-based functions that can be started from the Internet and
    enable DB2 to be the platform of choice for companies conducting B2B Web transactions.
    The v8 XML Extender also lets users send or retrieve XML documents from MQSeries™
    message queues. These enhancements make it easy for developers to work with XML
    documents.


    DB2 v8, with the new Development Center, offers tight integration with Microsoft
    C++, Visual Basic, and Visual InterDev, making it easy for developers to develop
    and incorporate stored procedures and user-defined functions in the development
    environment.


    The DB2 v8 Universal Developer’s Edition incorporates WebSphere Studio and WebSphere
    Application Server. WebSphere Studio makes it easy for developers to create, publish,
    and maintain dynamic Web Applications. With the WebSphere Application Server,
    developers can create enterprise Java applications that access DB2 databases.


    There are many performance improvements in DB2 Multidimensional clustering (MDC)
    indexes to be automatically created over multiple dimensions. This is especially
    useful for data warehousing and business intelligence environments where data
    is frequently analyzed over multiple dimensions. The optimizer can use these new
    dimension indexes for fast access. Because MDC indexes guarantee 100% clustering,
    they never have to be reorganized. New block-based bufferpools prefer prefix performance
    as blocks of noncontiguous pages can be fetched into blocks of contiguous memory.


    The new compression of nulls and defaults enhancement will benefit companies with
    data warehouses and large databases. This new feature can be enabled with the
    VALUE COMPRESSION and COMPRESS SYSTEM DEFAULT clause of the Table statement. This
    enhancement can reduce disk storage requirements and can increase the performance
    of large tables. Once enabled, a new data row format will used, which provides
    efficient storage of null and length values. By enabling this new feature, significant
    disk space can be saved. Note that only system default values are compressed,
    not user defined.


    # PRODUCT CHANGES


    Along with feature changes, v8 introduces several changes in product names and
    characteristics. IBM combined the first Enterprise Edition and Enterprise-Extended
    Edition into DB2 UDB Enterprise Server Edition (ESE). The base ESE product lets
    you create multiple database partitions on a single SMP server. If you want to
    create multiple database partitions in a clustered environment, then you need
    to order the Database Partitioning Licensing Feature (DPF). Product changes are
    covered in more detail in Chapter 2.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# MANAGEABILITY ENHANCEMENTS


    SMART technology appears in v8 in the form of new wizards and tools that greatly
    simplify DB2 maintainability and operability. Examples include the following:


    # Load Enhancements


    Online Load enables load operations to take place at the table level, allowing
    concurrent access to other tables in a multiple-table table space. This change
    particularly benefits ERP and CRM applications, which often have many tables per
    table space. If you specify the COPY NO option for a recoverable database, the
    table space will be placed in a backup pending table space state when the load
    operation begins. With the READ ACCESS option of the load command, preexisting-data
    can be queried while data is being loaded. A new option, LOCK WITH FORCE, lets
    you applications to release locks on a table so that a load operation can proceed.


    Autoloader functions have been incorporated into the load utility, and the autoloader
    control file is no longer needed.


    The v8 load utility now generates column values for generated columns and no longer
    requires the SET INTEGRITY statement on a table that has only generated columns
    and no other constraints. The LOAD QUERY command now returns the status of the
    target table, in addition to the status information previously included. LOAD
    QUERY can also query table states whether or not a load operation is in progress.


    # Wizards


    In addition to the Load Wizard, IBM added eight wizards to DB2 v8. They are:


    +   * Memory Visualizer

    * Redistribute Data Wizard

    * Backup and Restore Wizard

    * Configure Database Logging Wizard

    * Add Partition Wizard

    * Alter Database Partition Wizard

    * Storage Management View

    * Design Advisor (an enhanced form of the previous Index Advisor)


    # Flush Package Cache


    A FLUSH PACKAGE CACHE SQL statement lets you remove dynamic SQL statements by
    invalidating them. Queries currently using dynamic SQL statements will continue
    to use the previously cached statement; however, any new request for the same
    statement will be prepared and a new statement entry cached.'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Chapter 1 • What''s New


    # Logging Enhancements


    DB2 v8 supports dual logging on all 8.1 platforms, which means you can now specify
    the log-path through the MIRRORLOGPATH DB CFG parameter. This new parameter replaces
    the previous-registry variable DB2NEWLOGPATH2.


    The maximum amount of log space increases to 256 GB from 32 GB. Infinite logging
    allows a current unit of work to span active and archive logs. Previously, log
    records for a unit of work had to fit into the primary and secondary log space.
    This change will accommodate large units of work that require more log space than
    that allocated for the primary and secondary logs. The BLK_ON_LOG_DISK registry
    variable has been replaced with the new database configuration parameter BLK_LOG_DSK,
    which tells DB2 not to fail on a log condition. Instead, DB2 will require the
    write to the log every 5 minutes, giving you time to resolve the full condition.


    # Backup and Recovery Enhancements


    A new tablespace history file identifies log needed for a particular table space
    recovery. Log files that aren''t needed are skipped, resulting in faster tablespace
    recovery.


    You no longer have to specify Coordinated Universal Time (CUT) for rolling forward
    to a pointin-time. You can now specify local time. This improvement eliminates
    the confusion that can result when converting local time to CUT time.


    The DB2DIAG.LOG is split into two files. The Administration Notification Log will
    contain messages for DBAs and systems administrators. Additional information will
    supplement SQL error information. The level of information is controlled by the
    NOTIFYLEVEL database configuration parameter. Detailed diagnostic information
    will still be written to the DB2DIAG.LOG file. The DIAGLEVEL configuration parameter
    will still control the level of information (primarily for DB2 Support) written
    to that file.


    # New Database Maintenance Mode


    This new feature is akin to the ACCESS(MAINT) command available for some time
    on DB2 for z/OS and OS390. You can use the DB2 v8 QUIESCE command to force all
    users off an instance or database and place them in quince mode so maintenance
    can be performed. This feature solves the problem of application servers or transaction
    monitors independently reconnecting to the database after a FORCE APPLICATIONS
    command has been issued. The UNQUIES command takes the database or instance out
    of maintenance mode so users can connect to the database without requiring a shutdown
    and restart.


    # REORGCHK Enhancements


    REORGCHK now includes an ON SCHEMA option to specify a particular schema.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# RUNSTATS Enhancements


    RUNSTATS can now collect statistics on column combinations, prefetching on a table,
    and on index and index-to-table relationships. RUNSTATS can also accept lists
    of indexes and columns which statistics are to be collected. Refer to Chapter
    11, "Problem Determination," and Chapter 7, "Commands and Utilities," for detailed
    information.


    # Management by Exception Monitoring


    The new Health Monitor is a server-side tool that can raise alerts when predefined
    thresholds are exceeded or when it detects an instance is down. Based on the alert
    generated, the Health Monitor can send an email or page to a predefined email
    or pager address, trigger a script, or a run through the New Task Center.


    Health indicators are used by the Health Monitor to evaluate specific aspects
    of database manager or database performance. Refer to the System Monitor Guide
    and Reference for additional details on Health indicators. The Health Monitor
    checks the state of the system against these health indicators when determining
    when to issue an alert. Health Beacons are located on all Control windows. You
    simply click on a Beacon to access the Health Center, a GUI for configuring and
    interfacing with the Health Monitor.


    # Event Monitor and Snapshot Enhancements


    Event monitors can be created that write to tables instead of files or pipes.
    This enhancement will make it easier for DBAs to correlate event monitor data.
    You can write customized queries to query tables containing event monitor data
    and produce reports for your types of interest. In conjunction with this, snapshots
    can now be taken as SQL table functions, the output of which can be joined to
    other tables or written to a file, whereas previously they could only be embedded
    in programs that used the Administrative API. This will make it easier for you
    to take and correlate snapshot data. Monitoring is covered in detail in Chapter
    10.


    # PERFORMANCE ENHANCEMENTS


    Many enhancements have been incorporated into v8 that will enable companies to
    meet the ever-increasing business requirements demanded of companies in a 24 x
    7 x 365 environment. DBAs and developers alike will be able to take advantage
    of these performance enhancements by incorporating these enhancements into new
    and existing applications and databases.


    Performance enhancements are highlighted and covered in detail throughout the
    book. Some of the most important performance enhancements are:


    # Multidimensional Clustering (MDC)


    MDC is new clustering technology that provides a method for automatic, continuous
    clustering of data along multiple dimensions. MDC tables don''t require database
    maintenance opera-'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# 6 Chapter 1 • What''s New


    tions such as reorganization. MDC primarily benefits data warehousing type queries
    and large database environments; however, it can also be useful for transaction
    processing. MDC is cov-ered in detail in Chapter 5.


    # Prefetching Enhancements


    You can now use block-based bufferpools to improve prefetch performance. The BLOCKSIZE
    parameter of the CREATE or ALTER BUFFERPOOL statement is used to define the size
    of the blocks and number of pages to be read from a single I/O. When a block-based
    bufferpool is defined, DB2 will recognize this and use block I/Os to read multiple
    pages into the buff-erol in a single I/O. This enhancement will benefit data warehouse
    and large database environ-ments where prefetching is used.


    # Catalog and Authorization Caching


    For databases with multiple partitions, an extension of catalog cache will be
    provided at each partition. Cached information will include SYSTABLE and authorization
    information. For appli-cations with multiple coordinator partitions, this feature
    will improve performance significantly, as the local cache will service trips
    to the catalog partition.


    # Asynchronous I/O Enhancements


    Version 8 exploits AIX asynchronous page cleaning performance. Because asynchronous
    I/O is always enabled on AIX, it must be enabled before v8 installation. Two AIX
    asynchronous I/O parameters that you can tune are minservers and maxservers. Configure
    these using SMIT. Refer to the AIX Performance Guide for additional information.


    # Java SP and UDF Performance Enhancements


    Java routines are now implemented using a thread-based model, which results in
    significant-performance improvement for multiple routines executing simultaneously.
    Thread-based models, or lightweight threads, process memory and control blocks
    and can block without causing a context switch. Additionally, routines share the
    Java Virtual Machine (JVM); previously, a JVM was created for each executing routine.


    # Connection Concentrator


    Connection concentration enables many transient connections, such as Internet
    connections, to share the same logical coordinating agent. This results in DB2
    being able to accommodate many concurrent users because of the reduced memory
    requirements. Previously, DB2 would create a coordinating agent for each connection.
    With connection concentration, new connections-ing in can use the same logical
    coordinating agent, which results in less memory being used as the coordinator
    agent does not have to be created. This greatly reduces memory requirements for'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'each connection and improves performance by reducing the number of context
    switches (context switches require that the previous execution state and memory
    structures be saved and restored later, which is a lot of overhead). You can enable
    this new feature by setting max_connections greater than the value of max_coordinates.


    # Common Client Enhancement


    The new DB2 client uses DRDA and replaces the previous private protocol, known
    as DB2RA. This common client can connect to all other DB2 databases using the
    same protocol, eliminating costly data conversion, which had to be performed in
    previous releases. The protocol stack has been significantly optimized and offers
    significant performance improvements for client applications. Version 8 clients
    will be able to connect to all other members of the DB2 family without additional
    code.


    # Full 64-bit Support


    Version 8 is 64-bit capable. This will allow DB2 to provide the super-scalability
    needed by demanding business requirements today, and into the foreseeable future.
    Full 64-bit capability enables DB2 to make full use of large memories, which can
    be exploited for larger buffers, short memory, and other DB2 memory areas. This
    capability is urgently by some of the larger DB2 installations and will provide
    immediate relief to memory-constrained systems in use today. The common client
    plays a key role in this regard, as it provides bit capability for client applications
    as well as connectivity to 32-bit versions of DB2.


    # Declared Global Temporary Table (DGTT) Enhancements


    Version 8 adds rollback support for data changes to DGTTs. The NOT LOGGED clause,
    which was mandatory in v7, is not optional. You can now create an index on a temporary
    table and RUN-STATS can be run.


    # Materialized Query Table (MQT)


    In v8, MQTs are tables whose definitions are based on the result of a query that
    uses precomputed results derived from tables where the MQT definition is based.
    Summary tables, previously known as ASTs, are now a subset of MQTs in which the
    AST has a fullselect that contains a GROUP BY clause summarizing the tables referenced
    in the fullselect.


    Queries can now be routed to MQTs whose definitions contain a join that is not
    aggregated. The optimizer will recognize that the MQT contains the requested information
    and will use the MQT instead of the base tables. MQTs can now be incrementally
    maintained, resulting in improved performance.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# User-Maintained MQTs


    IBM recognized the need to provide a mechanism for users to maintain and load
    tables that contain precomputed data. The user-maintained MQT is the solution.
    These MQTs are managed by the user (not the system) and are distinguished by the
    MAINTAINED BY USER option of the CREATE SUMMARY TABLE statement. This enhancement
    makes it easier for existing Oracle users to migrate to DB2.


    # Nickname Support


    MQTs can now be defined as nicknames, resulting in the remote data being cached
    on the local DB2 instance. This can result in huge performance gains for federated
    queries where the remote data is accessed locally. And, if the remote table is
    not available for some reason, DB2 can use the MQT defined on it it meets all
    routing criteria, resulting in improved availability and performance.


    # Type-2 Indexes


    Type-2 indexes improve performance by eliminating most next-key-share locks, as
    entries are marked "deleted" instead of physically deleted from the page. Type-2
    indexes are required for online load, online reorganization, and MDC. A table
    cannot have a mix of type-1 and type-2 indexes. Tables can be migrated to type-2
    via index reorganization. Type-2 indexes allow you to create an index on a column
    that is longer than 255 bytes. Type-2 indexes are covered in more detail in Chapter
    5.


    # AVAILABILITY ENHANCEMENTS


    Customers demand access to their accounts anytime, anywhere, from anywhere. Businesses
    must provide this pervasive capability or risk losing customers. The availability
    of DB2 is significantly enhanced in v8 and those demands can be met. Online table
    reorganization, as well as online index reorganization, will greatly reduce scheduled
    and unscheduled outputs. IBM has taken this step further by providing new capabilities
    for DB2 to adjust to changing business needs. DB2 can automatically set and adjust
    several configuration parameters online, and over 50 configuration parameters
    can now be changed by DBAs. Previously, these changes required an outage and a
    restart of DB2.


    # Online Table Reorganization


    Online table reorganization offers a significant opportunity for DBAs to improve
    the availability and performance of supported databases. No longer will reorganizations
    have to be scheduled for off-hours or during maintenance windows. Online reorganization
    works by reorganizing a table in place for regular tables. There is no requirement
    for temporary space. New commands give you the capability to monitor the status
    of the reorganization.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Availability Enhancements


    Online table reorganization allows applications to access the table during the
    reorganization. Reorganization can also be paused and resumed later, if needed.


    > NOTE

    Online table reorganization is only allowed on tables with type-2 indexes.


    # Online Index Reorganization


    Online index reorganization allows a table to be read or updated during an index
    reorganization. During the reorganization all indexes on the table are rebuilt
    using a “shadow copy.” During the time that the shadow copy is being made available,
    no access is allowed to the table. A new REORG INDEXES command has been provided
    to run online index reorganization. Unlike online table reorganization, online
    index reorganization is not done in-place and requires temporary space. The Reorganization
    Utility is covered in more detail in Chapter 7.


    # Dynamic Online Configuration Parameters


    You can set 50 configuration parameters online having to stop and restart the
    instance or database. Parameters that control key areas can be changed dynamically,
    and the results of these changes monitored by the Memory Visualizer. Changes can
    be deferred so that they take effect at the next instance or database start. The
    GET DB CFG and GET DEM CMD commands feature a SHOW DETAILS option that shows the
    current and deferred parameter values. A few of these parameters can be set to
    automatic, and DB2 will adjust the value automatically as the workload changes.
    Configuration parameters are covered in detail in Chapter 9.


    # Online Bufferpool Enhancements


    You can now create, drop, or alter bufferpools online as well as defer changes.
    And if a buffer-pool is dropped, DB2 will immediately make the memory available
    to the database shared memory so that it can be reused for other memory allocations.

    With these new capabilities, a DBA could create a script that would run after
    the business day and alter parameters for nightly batch or DB2 loads, and run
    another script after nightly processing has completed to alter buffers back to
    the day settings. This scenario would sound familiar to experienced DB2 for OS/390
    DBAs as it is quite common on that platform. Detailed information on bufferpools
    is covered in Chapter 8.


    # DMS Container Enhancements


    You may now drop an existing container, reduce the size, and add new containers
    to avoid a rebalance. To add containers to a DMS table to avoid rebalance, use
    the new BEGIN STRIPE option of the ALTER TABLESPACE command. This forces new containers
    to be added above'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Chapter 1 • What''s New


    the high-water mark. These operations can be performed online and the new container
    is immediately available for use.


    # SERVICEABILITY ENHANCEMENTS


    A new INSPECT command lets be used to identify the architectural integrity of
    tablespaces and tables online. INSPECT can also be used to identify the types
    of indexes on a table. Additionally, the DB2 trace facility has been rearchitected
    to significantly reduce overhead so that it can be used to capture important diagnostic
    information for DB2 Support. A new command in v8, db2support, can be used by a
    DBA to provide DB2 Support with a “support bundle” of diagnostic and problem determination
    information. This new command makes it a lot easier for DBAs to collect and provide
    diagnostic information to DB2 Support.


    The Database Analysis and Reporting Tool (DB2DART) is now fully supported in v8.
    db2dart can be used to diagnose and repair structural problems with underlying
    database objects.


    # Data Warehouse Enhancements


    The DB2 Warehouse Manager, once limited to Windows platforms, now supports AIX
    and Linux. The warehouse server, logger, initialization, external trigger, and
    mail notification programs are all available on AIX, and Warehouse capabilities
    have been extended to Linux (32-bit Intel) with Linux kernel version 2.4.7 and
    glibc 2.2.4.


    # APPLICATION DEVELOPMENT ENHANCEMENTS


    Version 8 tightly integrates application development tools and add-ins into the
    new Development Center. This results in improved productivity for application
    developers and enables Rapid Application Development (RAD). The Development Center
    offers a central point from which all application development can be completed.
    Developers can easily create applications that use DB2 stored procedures and UDFs.
    The Development Center fully integrates DB2 Websphere application development.
    SQL Assist has been enhanced to include an easy to use interface, assistance with
    writing table joins, SQL syntax checking, and the ability to copy and paste SQL
    statements.


    # SQL in External UDFs and Methods


    External UDFs can now contain read-only SQL statements. Both static and dynamic
    SQL are supported. The limit of 90 parameters has been removed from PROGRAM TYPE
    stored procedures.


    # CALL Statement


    The CALL statement is now fully compiled, which means that it can now be dynamically
    prepared in command line interface, open database connectivity, embedded SQL,
    Java database'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# SUMMARY


    connectivity, and SQLJ. You should not use host variables for procedure names
    when invoking a stored procedure with the CALL statement if you want to use package
    cache efficiently and pre-clude additional compilation and reads to the catalog.


    # Development Center


    The Development Center replaces the Stored Procedure Builder and includes more
    features and functions. With the Development Center you can:


    +   - Create, build, and deploy Java and SQL stored procedures

    - Create, build, and deploy SQL table and Scalar UDFs and UDFs that read MQ messages,
    access OLE DB data sources, or extract data from XML documents

    - Deploy Stored Procedures using the integrated debugger

    - Export and import routines and project information


    The Development Center also provides an add-in for each of these development environments:


    +   - Microsoft Visual C++

    - Microsoft Visual Basic

    - Microsoft Visual InterDev


    With these add-ins a developer can pick and choose from a wide variety of development
    options and easily incorporate stored procedures and UDFs into a development effort.


    You can launch the Development Center as a stand-alone application or from the
    Control Center, Command Center, or Task Center.


    # SQL Enhancements


    The new INSTEAD trigger provides an extension to the ability to update views.
    Using an INSTEAD trigger, the update operation against the view gets replaced
    by the trigger logic, which performs the operation on behalf of the view.


    New Informational Constraints are rules that can be used in query rewrite but
    are not enforced by the database manager. You can use Informational Constraints
    where applications have verified the data and you want to let DB2 the constraint
    for query optimization. New options on the Alter table statement, ENABLE QUERY
    OPTIMIZATION or DISABLE QUERY OPTIMIZATION, instruct DB2 whether or not to use
    this capability. Application Development and SQL enhancements are covered in detail
    in Chapter 4.


    # SUMMARY


    DB2 v8 is one of the most complete DB2 releases to date. In fact, it has so many
    features and enhancements that this chapter is just an introduction to some of
    them. Through Autonomic Computing and the SMART initiative, IBM has made DB2 v8
    very easy to operate and manage.'
