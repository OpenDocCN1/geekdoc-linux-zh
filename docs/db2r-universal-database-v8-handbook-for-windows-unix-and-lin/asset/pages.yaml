  md: '# DB2NODES.CFG File


    Key to a successful DB2 installation is the db2nodes.cfg file. This file indicates
    to DB2 what partitions are defined and contains important port and communications
    information. This file must be created in the DB2 instance owner''s home directory
    ($INSTHOME/SQLIB). There is one file per DB2 instance and it contains one entry
    for each database partition per DB2 instance. The db2nodes.cfg file cannot be
    updated while DB2 is running It is locked by DB2 during normal operation. It can
    be updated when DB2 is not running and as part of the ADDDBPARTITIONUM option
    of the DB2START command. This will be covered in more detail later in this chapter.
    See Table 13.2 for list of db2nodes.cfg fields definitions.


    Table 13.2 db2nodes.cfg File Field Definitions


    | DB Partition Num | hostname | Logical Port | netname |

    |---|---|---|--|

    | 1 | host1 | 0 | switch1 |

    | 2 | host1 | 1 | switch1 |

    | 3 | host2 | 0 | switch2 |

    | 4 | host2 | 1 | switch2 |

    | 5 | host3 | 0 | switch3 |


    The db2nodes.cfg file contains one entry for each database partition per DB2 instance,
    which DB2 uses for configuration information as follows:


    +   - DB PARTITIONUM is a required field. Each entry must be unique. The range
    of numbers must be between 0–999. The first value does not have to be 0. Entries
    must be in ascending order. Gaps can exist in the sequence for future growth.

    - HOSTNAME-Name of the host network interface.

    - LOGICAL PORT—Used by DB2 to distinguish between multiple database partitions
    on a single host (server). If not specified defaults to 0. Each entry must be
    unique per host (server). If using a single database partition per host, if the
    logical port is specified it must be 0. If using multiple database partitions
    on a single host (server), the logical port must start at 0 and 1, 2, 3, 4 and
    so forth for each host (server). If multiple database partitions are on a single
    host (server), the number of logical ports defined is the maximum number of database
    partitions for that particular host.

    - NETNAME—If a high speed switch is being used, the NETNAME field is used for
    communications.


    A range of ports must be reserved in the /etc/services file with one port per
    database partition per host server.'
