  md: '# Examples


    # Example I


    The ROLLFORWARD DATABASE command permits specifications of multiple operations
    at once, each being separated with the keyword AND. For example, to roll forward
    to the end of logs and complete the separate commands:


    ```

    db2 rollforward db sample to end of logs

    db2 rollforward db sample complete

    ```


    can be combined as follows:


    ```

    db2 rollforward db sample to end of logs and complete

    ```


    Although the two are equivalent, it is recommended that such operations be done
    in two steps. It is important to verify that the roll-forward operation has progressed
    as expected, before stopping and possibly missing logs. This is especially important
    if a bad log is found during roll-forward recovery, and the bad log is interpreted
    to mean the “end of logs.” In such cases, an undamaged backup copy of that log
    could be used to continue the roll-forward operation through more logs.


    # Example 2


    Roll forward to the end of the logs (two tablespaces have been restored):


    ```

    db2 rollforward db sample to end of logs

    db2 rollforward db sample to end of logs and stop

    ```


    These statements are equivalent. Neither STOP nor AND COMPLETE is needed for tablespace
    roll-forward recovery to the end of the logs. Tablespace names are not required.
    If not specified, all tablespaces requiring roll-forward recovery will be included.
    If only a subset of these tablespaces is to be rolled forward, their names must
    be specified.


    # Example 3


    After three tablespaces have been restored, roll one to the end of the logs, and
    the other to a point in time, both to be done online:


    ```

    db2 rollforward db sample to end of logs tablespace (TBS1) online

    db2 rollforward db sample to 1998-04-03-14.21.56.245378 and stop

    tablespace (TBS2, TBS3) online

    ```


    Note that two roll-forward operations cannot run concurrently. The second command
    can only be invoked after the first roll-forward operation completes successfully.


    # Example 4


    After restoring the database, roll forward to a point in time, using OVERFLOW
    LOG PATH to specify the directory where the user saves archived logs:'
  merge: -1
