    After you create the table for storing the snapshot, you have to enable the correct
    monitor switches and you can then issue an SQL snapshot function and insert the
    output right into the associated table. In our case, the BP_SNAP table (10.6).


    By issuing the following statement, you take a snapshot and insert the results
    into the associated table as:


    ```

    INSERT INTO BP_SNAP

    Select * from TABLE(SNAPSHOT_BP(''GUNNDB'', -1)) as PGUN;

    ```


    All the other snapshot tables can be created using the procedures outlined. You
    can then develop a historical repository which you can use to analyze performance
    and identify trends over time. You can also analyze this data through user-written
    queries and use the information to solve performance problems.


    For additional information on SQL Snapshot Functions, Refer to the DB2 UDB v8.1
    SQL Reference, Volume 2, and the DB2 UDB v8.1 System Monitor Guide and Reference.


    # EVENT MONITORING


    As discussed, snapshot monitoring shows us performance data at a point in time.
    With snapshots, we may or may not capture the information of interest depending
    on the time we take the snapshot; whether or not the event we are trying to capture
    is running or has completed; and the frequency of the snapshot taken. Many times
    snapshot data gives you enough data to identify a suspected problem and then an
    event monitor is required to capture the complete picture. Hence event monitors
    should be used when snapshot data is inconclusive and further data capture is
    required.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '> NOTE

    New in v8, event monitors can write output directly to event monitor tables. Event
    monitor tables are created when the Event monitor is created, or you can use the
    DB2EVTBL tool to create and custom-ize event monitor output and tables.


    Event monitors capture and record data as events complete. DB2 provides eight
    types of event monitors. They are:


    +   - Database

    - Tables

    - Deadlocks

    - Tablespaces

    - Bufferpools

    - Connections

    - Statements

    - Transactions


    # Database Events


    Database event monitors record an event record when the last application disconnects
    from the database.


    > NOTE

    Event monitors can be customized to capture events based on APPL_ID, AUTH_ID,
    and APPL_NAME event conditions.


    # Database Events


    Database event monitors record an event record for each active table when the
    last application disconnects from the database. An active table is a table that
    has changed since the first connection to the database.


    # Deadlock Events


    Deadlock event monitors record an event record for each deadlock event. When WITH
    DETAILS option is used, the event monitor will generate a more complete deadlock
    connection for each application involved. Additional details include:


    +   - The statement text from the application that was executing when the deadlock
    occurred.'
  merge: -1
  pgno: 265
- img_proc: true
  md: "# Event Monitoring\n\n+   The locks held by the application when the deadlock\
    \ occurred. In a partitioned database environment, the locks are only included\
    \ for the database partition where the application was waiting for its lock when\
    \ the deadlock occurred.\n\n> NOTE\n v8, DB2 provides more details for help in\
    \ resolving deadlock situations. Additional information provided is statement\
    \ text from the application involved in the deadlock, connection event information\
    \ for the connections involved, and more detail on locks held.\n\n> TIP\n When\
    \ using the WITH DETAILS option of the DEADLOCK event monitor, additional overhead\
    \ is incurred by the Database Manager. Do not use this option unless specifically\
    \ troubleshooting deadlock problems. Turn the event monitor off when no longer\
    \ needed.\n\n# Tablespace Events\n\nRecords an event record for each active tablespace\
    \ when the last application disconnects from the database.\n\n# Bufferpools Events\n\
    \nBufferpool event monitor records an event record for bufferpools when the last\
    \ application disconnects from the database.\n\n# Connection Events\n\nConnection\
    \ event monitors record an event record for each database connection event when\
    \ an application disconnects from the database.\n\n# Statement Events\n\nStatement\
    \ event monitors record an event for every SQL statement issued by an application\
    \ (for both dynamic and static SQL).\n\n# Transactions Events\n\nTransaction event\
    \ monitors record an event record for every transaction when it completes (indicated\
    \ by a COMMIT or ROLLBACK statement)."
