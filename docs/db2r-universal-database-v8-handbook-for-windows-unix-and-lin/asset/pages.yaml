    \nNote that the db2trc command has to be issued multiple times to gather the information\
    \ and format it to a file. For further information, refer to the DB2 UDB v8 Command\
    \ Reference.\n\n# DRDA TRACE\n\nThe DB2 DRDA trace (db2drdat) allows you to capture\
    \ the DRDA data stream between a client and the DB2 UDB Server. Key outputs from\
    \ this trace are the number of sends and receives that are required to execute\
    \ an application. It can also aid in performance and tuning of client/server applications.\
    \ The trace can be invoked from a CLP as follows:\n\n```\ndb2drdat on\n```\n\n\
    which turns on all as trace events. To stop collecting trace data, issue the db2drdat\
