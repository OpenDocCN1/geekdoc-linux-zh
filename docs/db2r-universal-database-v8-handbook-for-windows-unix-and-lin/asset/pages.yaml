  md: '# DB2DIAG.LOG File


    259


    +   9. The function ID within the module reporting the error; used by DB2 support
    to locate the section of the code that generated the error

    10. The database where the error is occurring

    11. The diagnostic error code and message text

    12. The DB2 internal error code in hex


    The key data elements you need to be concerned with in Example 11.1 are the DB2
    internal return code (12) and the DB2 module reporting the error (8). DB2 internal
