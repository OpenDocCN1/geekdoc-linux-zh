    appears in both lists, distribution statistics will be collected (unless NUM_FREQVALUES
    and NUM_QUANTILES are set to zero).


    # NUM_FREQVALUES


    Defines the maximum number of frequency values to collect. It can be specified
    for an individual column in the ON COLUMNS clause. If the value is not specified
    for an individual column, the frequency limit value will be picked up from that
    specified in the DEFAULT clause. If it is not specified either, the maximum number
    of frequency values to be collected will be what is set in the NUM_FREQVALUES
    database configuration parameter.


    # NUM_QUANTILES


    Defines the maximum number of distribution quantile values to collect. It can
    be specified for an individual column in the ON COLUMNS clause. If the value is
    not specified for any individual column, the quantile limit value will be picked
    up from that specified in the DEFAULT clause. If it is not specified either, the
    maximum number of quantile values to be collected will be what is set in the NUM_QUANTILES
    database configuration parameter.


    # WITH DISTRIBUTION


    This clause specifies that both basic statistics and distribution statistics will
    be collected on the columns. If the ON COLUMNS clause is not specified, distribution
    statistics are collected on all the columns of the table (excluding columns that
    are ineligible for CLOB and LONG VARCHAR). If the ON COLUMNS clause is specified,
    distribution statistics are collected only on the column list provided (excluding
    those ineligible for statistics collection). If the clause is not specified, only
    basic statistics are collected.


    > NOTE Collection of distribution statistics on column groups is not currently
    supported. In v8, distribution statistics will not be collected when column groups
    are specified in the WITH DISTRIBUTION ON COLUMNS clause. This is planned as a
    future enhancement.


    # DEFAULT


    If the DEFAULT NUM_FREQVALUES and/or NUM_QUANTILES limited are specified, these
    will be used to determine how many frequency and/ quantile statistics are attempted
    to be collected for the columns if they are not specified for the individual column
    in the ON COLUMNS clause. If the DEFAULT clause is not specified, the values used
    will be in the corresponding database configuration parameters.'
