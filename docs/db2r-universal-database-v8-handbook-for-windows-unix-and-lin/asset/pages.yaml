  md: '| Variable name | Operating system | Values |

    |---|---|---|

    | DB2DBMSADDER | | Default = 0x20000000 for Windows NT Value: 0x20000000 to 0xB0000000
    in increments of 0x100000 |


    Specifies the default database manager shared memory address in hexadecimal format.
    If fails due to a shared memory collision, this registry variable can be modified
    to force the data-base manager instance to allocate its shared memory at a different
    address.


    | DB2_DISABLE_FLUSH_LOG | All | Default = OFF Value: ON or OFF |


    Specifies whether to disable closing the active log file when the online backup
    is completed. When an online backup completes the last active log file is truncated,
    closed, and made available to be archived. This ensures that your backup has a
    complete set of archived log files for recovery. You might disable closing the
    last active log if you are concerned about wasting portions of the Log Sequence
    Number (LSN) space. Each time an active log file is truncated, the LSN is increased
    by an amount proportional to the space truncated. If you perform a large number
    of online backups each day, you might disable the last active log file if you
    find you are receiving log file messages a short time after the completion of
    the online backup. When a log file is truncated, the reserved active log space
    is increased by the amount proportional to the size of the truncated log. The
    active log space is freed once the truncated log file is reclaimed. The reclamation
    occurs a short time after the log file becomes inactive. During the short interval
    between these two events you may receive log file messages.


    | DB2DISCOVERY | Windows operating systems | Default = 40 seconds Minimum = 20
    seconds |


    Specifies the amount of time that SEARCH discovery will search for DB2 systems.


    | DB2INCLUDE | All | Default = current directory |


    Specifies a path to be used during the processing of the SQL INCLUDE text-statement
    during DB2PREP processing provides a list of directories where the INCLUDE file
    might be found. Refer to the Application Development Guide for descriptions of
    how DB2INCLUDE is used in different preferred languages.


    | DB2INSTDEF | Windows operating systems | Default = DB2 |


    Sets the value to be used if DB2INSTANCE is not defined.


    | DB2OWNER | Windows NT | Default = null |


    The registry variable created in the DB2 profile registry when the instance is
    first created. This variable is set to the name of the instance-owning machine.


    | DB2_LIC_STAT_SIZE | All | Default = null Range: 0 to 32,767 |'
