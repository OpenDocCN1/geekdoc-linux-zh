- img_proc: true
  md: '# Monitoring Buffer Performance


    2. The buffer manager assesses the current state of activity within the target
    destination bufferpool and decides that there isn''t enough room for all PREFETCHED
    pages. In this case, the buffer manager may accept only a few pages and then issue
    additional. Now, please go prefetch requests (This is not good.) The NUM_IOSERVER
    agents return to the disk drives and continue to prefetch requests contents of
    which cannot be fully accepted by the buffer manager. In this case, APPR is less
    than the EXTSIZE(s) of the tablespace assigned to the bufferpool.


    This discussion brings us to the first golden rule regarding the sizing of bufferpools.


    Sizing Rule #1: Asynchronous bufferpools should be sized at least large enough
    to accommodate the prefetch demands placed upon them. APPR should be at least
    90-95% of the EXTSIZE of tablespaces assigned to a given bufferpool.


