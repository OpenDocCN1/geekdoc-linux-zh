    Specifies the environment in which Data Links servers operate. NATIVE indicates
    that the Data Links server is in a single machine environment in which the server
    can take over files on its own machine. DFS indicates that the Data Links server
    is in a distributed file system (DFS) environment in which the server can take
    over files throughout the file system. Mixing DFS file systems and native file
    systems is not allowed.


