  md: '# RUNSTATS Utility


    +   If time to collect statistics is very limited and the effort to tailor the
    RUNSTATS command on a table-by-table basis is a major issue, consider collecting
    statistics for the ''KEY'' columns only. It is assumed that the index contains
    the set of columns that are critical to the table and most likely appear in predicates.


    +   If there are many indexes on the table and DETAILED (extended) information
    on the indexes improve access plans, consider the SAMPLED option to reduce the
    time it takes to collect statistics. Regardless of whether you use the SAMPLED
    option, collecting detailed statistics on indexes is time consuming. Do not collect
    these statistics unless you are sure that they will be useful for your queries.


    +   If there is skew in certain columns and predicates of the type ''column= constant,''
    it may be beneficial to specify a larger NUM_FREQUVALUES value for column.


    +   Collect distribution statistics for all columns that are used in equality
    predicates and for which the distribution of values might be skewed.


    +   For columns that have range predicates (e.g., ''column >= constant'', ''column
    BETWEEN constant1 AND constant2'') or of the type ''column LIKE %xyz,'' it may
    be beneficial to specify a larger NUM_QUALITIES values for columns that are not
    used


    +   If storage space is a concern and cannot afford too much time on collecting
    statistics, do not specify NUM_FREQUVALUES or NUM_QUANTILE values for columns
    that are not used in predicates.


    +   Note that if index statistics are requested, and statistics have never been
    run on the table containing the index, statistics on both the table and indexes
    are calculated.


    3. After the command is run, note the following:


    +   A COMMIT should be issued to release the locks.


    +   To allow new access plans to be generated, the packages that reference the
    target table must be rebound.


    +   Executing the command on portions of the table could result in inconsistencies
    as a result of activity on the table since the command was last issued. In this
    case a warning message is returned. Issued RUNSTATS on the table only might make
    table- and index-level statistics inconsistent. For example, you might collect
    index-level statistics on a table and later delete a significant number of rows
    from the table. If you issue RUNSTATS on the table only, the table cardinality
    might be less than FIRSTKEYCARD, which is an inconsistency. In the same way, if
    you collect statistics on an index when you create it, the table-level statistics
    might be inconsistent.


    4. In the "On Dist Cols" clause of the command syntax, the "Frequency Option and
    "Quantile Options" parameters are not currently supported for Column GROUPS. This
    will be supported in a future enhancement. These options are supported for single
    columns.'
