    being used: a file, a path (directory), or a device. In this example, an AIX Raw
    Logical volume (DMS device container) is being used.


    # Tables


    Tables in DB2 contain rows of data that are organized into blocks called pages.
    Pages can be 4, 8, 16, or 3 KB in size. Groups of pages are stored as extents
    and are used by DB2 when writing data to and prefetching from containers. DB2
    uses extents to stripe data across containers. Tables are created within tablespaces.
    There can be one or many tables per tablespace.


    We will discuss the advantages and disadvantages of single and multiple tablespaces
    later in the chapter.


    # STORAGE MODELS


    There are two types of tablespace storage models in DB2: System Managed Space
    (SMS) and Database Managed Space (DMS).'
