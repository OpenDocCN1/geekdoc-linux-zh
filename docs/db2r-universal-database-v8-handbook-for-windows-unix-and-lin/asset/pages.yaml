  md: '# Utility Guidelines and Exceptions


    A backup of a database, or one more tablespaces, keeps a record of all the tablespace
    containers in use by the tablespaces being backed up. During a restore, all containers
    listed in the backup are checked to see if they currently exist and are accessible.
    If one more of the containers are inaccessible for any reason, the restore will
    fail. In order to allow a restore in such a case, the redirecting of tablespace
    containers is supported during the restore. This includes adding, changing, or
    removing of tablespace containers. It is this command that allows the user to
    add, change, or remove those containers.


