- img_proc: true
  md: 'In Figure 3.3 we have defined the cardinality of the relationships between
    entities and have created the Student_Class associative entity to eliminate the
    many-to-many relationship between Student and Class. We will understand the reason
    for this later in the chapter. In Figure 3.3, notice the circle close to the Meal
    Plan entity. This denotes an optional relationship between Student and Meal Plan.
    A student can exist without having a meal plan, as is the case at times with students
    that commute. The solid line across the connecting line between Class and Classroom
    identifies a mandatory mandatory relationship. A Class cannot exist unless it
    is assigned to a Classroom. Optional and mandatory relationships are useful for
    documenting and enforcing business rules.


    # BUSINESS RULES


    Business rules define how a business operates. An example is that a customer can
    only have one charge account, an invoice cannot be paid unless associated with
    a valid purchase order, and each customer charge account must be associated with
    a valid social security number. These types of business rules are known as constraints.
    Business rules also define the degree and cardinality of the relationship between
    business entities. Business rules are unique to each business and can vary widely
    from business to business.


    # ENTITIES AND RELATIONSHIPS


    Once we have identified business entities, relationships, and rules, we can document
    them as part of the logical design process using entity-relationship (ER) diagrams.
    The conceptual model, as previously illustrated in Figure 3.2, is represented
    using ER diagrams. It is as close to a real-world view of an organization''s data
    as possible. Entity-relationship diagramming was invented by P. P. Chen in 1976.


    However, before you can develop ER diagrams and conduct the normalization process,
    it''s helpful for you to understand some key terms.


    # Entity


    An entity is a person, place, thing, concept or event. You can think of it as
    a noun.


    # Relationship


    A relationship is used to describe the relationship between entities. Relationships
    are defined in terms of action words. You can think of it as a verb. A relationship
    can be optional or mandatory, as previously described.


    # Candidate Key


    A candidate key is an attribute or combination of attributes that uniquely identifies
    an instance of a relation.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Primary Key


    A primary key is a candidate key that is selected as the unique identifier of
    a row.


    # Relation


    A relation is a two-dimensional table consisting of attributes (columns) and tuples
    (rows).


    # Foreign Key


    A foreign key is used to record the relationships between entities. The primary
    key of the entity on the one side of a one-to-one or one-to-many relationship
    is placed in the entity on the one or many side. Foreign keys are used to implement
    referential integrity and can have additional rules associated with them. For
    example, if the parent entity in a parent-child relationship is deleted, the associated
    entities in the child entity will be deleted. This is known as “cascade delete."


    # Cardinality


    Cardinality is the degree of the relationship between entities. We can also identify
    relationships or attributes using functional dependencies by observing two attributes,
    for example, A and B, which can be related in three ways indicated by fd notation
    in the headings (A => B and B => A, etc.). The cardinalities that will be sufficient
    for our purposes are one-to-one, one-to-many, and many-to-many.


    A single instance of one type is related to a single entity of the other type.
    In Figure 3.4, the EMPLOYEE-CUB relationship associates a single employee with
    a single cubicle. According to the relationship, no employee has more than one
    cubicle and no cubicle cannot be assigned to more than one employee.


    ![](img/961b0d3b0e157406ef7a293880ab928e_54_0.png)


    Figure 3.4

    A one-to-one relationship.


    A single instance of one type is related to many instances of the other type.
    In Figure 3.5, the DEPARTMENT-EMPLOYEE relationship shows that an employee is
    assigned to one department and that a department has many employees.


    ![](img/961b0d3b0e157406ef7a293880ab928e_54_1.png)


    Figure 3.5

    A one-to-many relationship.'
  merge: -1
