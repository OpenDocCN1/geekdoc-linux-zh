  md: '# Configuration Advisor


    By setting the type of workload, we are telling the Configuration Advisor to optimize
    DB2 memory for your particular workload. In a data warehousing environment, queries
    tend to run longer, use more sortheap, and differ in use of package cache and
    bufferpool efficiency. Queries in a data warehouse environment tend to be "ad-hoc"
    and dissimilar, which mean the package hit rate will be low and table-objects
    too large to fit in the bufferpool, resulting in physical reads from disk. However,
    bufferpools in this environment tend to support keeping all or part of index pages
    in the bufferpool, resulting in reading indexes from the bufferpool.


