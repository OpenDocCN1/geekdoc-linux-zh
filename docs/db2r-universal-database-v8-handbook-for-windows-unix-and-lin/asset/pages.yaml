    Specifies the control of garbage file collection on the Data Links server. When
    set to SLEEP, no garbage collection occurs. When set to PASSIVE, garbage collection
    runs only if no other transactions are running. When set to ACTIVE, garbage collection
    runs even if other transactions are running.


