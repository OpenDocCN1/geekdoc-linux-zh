  md: '# Archive Log Command


    ON ALL DBPARTITIONNUMS

    Specifies that the command should be issued on all database partitions in the
    db2nodes.cfg file. This is the default if a database partition number clause is
    not specified.


    EXCEPT

    Specifies that the command should be issued on all database partitions in the
    db2nodes.cfg file, except those specified in the database partition number list.


    ON DBPARTITIONNUMON/ON DBPARTITIONNUMS

    Specifies that the logs should be archived for the specified database on a set
    of database partitions.


    db-partition-number

    Specifies a database partition number in the database partition number list.


    TO db-partition-number

    Used when specifying a range of database partitions for which the logs should
    be archived. All database partitions from the first database partition number
    specified up to and including the second database partition number specified are
    included in the database partition number list.


    # Utility Guidelines and Exceptions


    This command can be used to collect a complete set of log files up to a known
    point. The log files can be used to update a standby database.

    This command can only be executed when the invoking application or shell does
    not have a data connection to the specified database. This prevents a user from
    executing the command with uncommitted transactions. As such, the ARCHIVE LOG
    command will not forcibly commit the user''s incomplete transactions. If the invoking
    application or shell already has a database connection to the specified database,
    the command will terminate and return an error. If another application has transactions
    in progress with the specified database when this command is executed, there will
    be a slight performance degradation as the command flushes the log buffer to disk.
    Any other transactions attempting to write log records to the buffer will have
    to wait until the flush is complete.


    > NOTE

    Used in a partitioned database environment, a subset of database partitions may
    be specified by using a database partition number clause. If the database partition
    number clause is not specified, the default behavior for this command is to close
    and archive the active log on all database partitions.'
