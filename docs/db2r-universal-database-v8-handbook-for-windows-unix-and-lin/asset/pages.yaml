  md: '# System Managed Space


    SMS containers are created as directories by the target operating system (OS).
    SMS containers are allocated one page at a time, as needed (unless you have multipage
    file allocation enabled). This makes efficient use of disk storage but incurs
    a performance penalty as result of the time and resources used to allocate pages
    as needed. SMS tablespaces are generally chosen according to the following criteria:


    +   - Good performance is required

    - Only small to moderate growth is expected

    - Few or no DBAs available to administer the database


    Page-at-a-time allocation can be changed so that by issuing the db2empfa command
    from a command line This causes SMS tablespaces to have extents at a time allocated
    and the multipage_alloc informational DB CFG set to YES to reflect that the default
    behavior has been changed. Note that once enabled, it cannot be reversed (db2empfa
    does not change the way temporary space is allocated in System temporary space).


    By default, SYSPACE and system temporary space (TEMSPACE1) are created as SMS
    tablespaces. Since the DB2 catalog is relatively small and is frequently updated,
    SMS is the right choice. The default system temporary space, TEMSPACE1, is used
    for storing intermediate result sets and work tables when sorts or hash joins
    overflow from SORTSHEAP. System temporary space is also used when reorganizing
    tables in SMS tablespaces or using “classic” reorg with temporary tablespace specified.


    By default, an SMS system temporary tablespace called TEMPSPACE1 is created at
    database creation. A system tablespace is required for DB2 to operate. The system
    tablespace can be DMS or SMS. SMS is generally adequate for most workloads. When
    absolute top performance is required, system temporary space may be created as
    DMS. If you don''t want to use TEMPSPACE1, you can create a new system temporary
    tablespace with a different name and drop TEMPSPACE1.


    # HINT


    Create system temporary tablespaces with multiple containers across multiple physical
    disks to exploit opportunities for parallel I/O. Do not create more than one system
    temporary tablespace per page size.


    # NOTE


    The maximum size of a regular tablespace depends on the page size used. For 4
    KB pages the maximum is 64 GB and for 8 KB pages, 128 GB.'
