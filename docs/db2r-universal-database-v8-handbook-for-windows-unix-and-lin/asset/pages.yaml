  md: '# Enabling Monitoring


    # Table 10.3 Key Database Manager Snapshot Elements (Continued)


    | Monitor Element | Tuning Tips |

    |---|---|

    | Maxagents overflow | Occurs when maxagents is reached. If it occurs frequently,
    increase maxagents along with related parameters. |

    | Hash joins after heap threshold exceeded | Consider moderate increases in sortheap
    until none are observed. |

    | Package cache hwm and max size allowed | Used to monitor package cache memory
    growth. Increase if overflows occur. Do not over-allocate. Memory better used
    for buffers if high hit ratio cannot be obtained. |

    | Catalog cache hwm and max size allowed | Increase when hwm > 80% of max size
    allowed. Keep hit ratio above 90%. |

    | Lock manager heap hwm and max size allowed | Increase locklist when hwm > 50%
    of max size allowed. |

    | Database heap hwm and max size allowed | A soft limit. Monitor and increase
    as necessary. |

    | Hwm for agents registered | Hwm of all agents (coordinating and subagents) registered.
    Use this element when evaluating maxagent setting. |

    | Hwm for coordinating agents | Maximum number of coordinating agents working
    one time. Tune in conjunction with maxagents. |


