  md: 'ALLOW NO ACCESS—Specifies that no other users can access the table while the
    indexes are being reorganized. This is the default.


    ALLOW READ ACCESS—Specifies that other users can have read-only access to the
    table while the indexes are being reorganized.


    ALLOW WRITE ACCESS—Specifies that other users can read from and write to the table
    while the indexes are being reorganized.


    CLEANUP ONLY—When CLEANUP ONLY is requested, a cleanup rather than a full reorganization
    will be done. The indexes and any pages freed will be available for reuse by indexes
    defined on this table.


    The CLEANUP PAGES option will search for and free committed pseudo-empty pages.
    A committed pseudo-empty page is one where the keys on the page are marked as
    deleted and all deletions are known to be committed. The number of pseudo-empty
    pages in an index can be determined by running runstats and looking at the NUM
    EMPTY LEAVES if they are determined to be committed.


    The CLEANUP ALL option will free committed pseudo-empty pages, as well as remove
    committed deleted keys from pages that are not pseudo empty. This option will
    also try to merge adjacent leaf pages if doing so will result in a merged leaf
    page, where PCTFREE is 10%. If two pages can be merged, one of the pages will
    be freed. The number of pseudo-deleted keys in an index, excluding those on pseudo-empty
    pages, can be determined by running runstats and selecting the NUMIDS DELETED
    FROM SYSCAT. INDEXES. The ALL option will clean the NUMIDS DELETED if they are
    determined to be committed.


    ALL—Specifies that indexes should be cleaned up by removing committed pseudo-deleted
    keys and committed pseudo-empty pages.


    PAGES—Specifies that committed pseudo-empty pages should be removed from the index
    tree. This will not clean up pseudo-deleted keys on pages that are not pseudo-empty.
    Since it is only checking the pseudo empty leaf pages, it is considerably faster
    than the ALL option in most cases.


    CONVERT—If you are not sure whether the table you are operating on has a type-1
    or type-2 index, but type-2, you can use the CONVERT option. If the index type-1,
    this option will convert it into type-2. If the index is already type-2, this
    option has no effect. All indexes created by DB2 prior to Version 8 are type-1
    indexes. Version 8 are type-2 indexes, except when you create an index on a table
    that already has a type-1 index. In this case the new index will also be of type-1.
    REORG INDEXES will always convert type-1 indexes to type-2 indexes unless you
    use the CLEANUP option. Using the INSPECT command to determine the index type
    can be slow.


    > NOTE CONVERT allows you to ensure that the new index will be type-2 without
    your needing to determine its original type.'
  merge: -1
