  md: '# APPENDIX A

    DB2 Catalog Views


    The DB2 catalog in v8 contains 86 catalog views with a schema of SYSCAT and five
    user-updateable views in a schema of SYSSTAT. These views are defined on tables
    with a schema of SYSIBM CATSCAT tablespace. Select privileges are granted to group
    PUBLIC by default on SYSCAT. Update privileges are granted to group PUBLIC by
    default on SYSSTAT views, as columns in these views can be updated with production
    statistics or “artificial” statistics to replicate a production or test database
    environment.


    This appendix will serve as a quick reference for DBAs and application developers.
    You can use this appendix to develop ad-hoc queries to help solve questions, such
    as What tablespace is a certain table contained in? What indexes are defined but
    not being used? Who has what privileges on a certain package?


    This appendix provides the name for each view, and contains column names, data
    types, and descriptions.


