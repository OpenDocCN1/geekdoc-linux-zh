  md: '+   * Overflowed—A sort overflows from SORTHEAP if the data being sorted cannot
    entirely fit in the sortheap allocated. It overflows into temporary tables in
    the bufferpool and possibly to disk.


    +   * Nonoverflowed—A non own sort completes in the sortheap and does not overflow
    to the bufferpool or disk.


    Furthermore, sorts can be categorized as piped or nonpiped.


    +   * Piped—A piped sort is a sort that can return data directly without requiring
    a temporary table and therefore completes in the allocated sortheap.


    +   * Non-piped—A nonpiped sort requires the use of a temporary table to return
    sort results.


    > HINT

    A piped sort always performs better than a nonpiped sort.


    See Figure 12.1 for an example of a nonoverflowed, piped sort.

    As illustrated in Figure 12.1, the sortheap is adequate in this example and the
    sort can complete in memory. This is the ideal sort if one is necessary.


    > HINT

    In OLTP and Web-based environments, sort overflows should be kept to a minimum
    as queries in these environments typically return one row or a small number of
    rows and response time is key.


    ![](img/961b0d3b0e157406ef7a293880ab928e_301_0.png)


    Figure 12.1: Nonoverflowed sort.'
