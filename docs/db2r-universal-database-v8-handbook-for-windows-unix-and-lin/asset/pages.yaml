  md: '# ALLOW READ ACCESS


    Load lock must be used to take the table out of CHECK share mode. The table state
    will be set to both LOAD IN PROGRESS and READ ACCESS. Readers may access the nondelta
    portion of the data while the table is being loaded. In other words, data that
    existed before the start of the load will be accessible by readers to the table;
    data that being loaded is not available until the load is complete. LOAD TERMINATE
    or RESTART of an ALLOW READ access load may use this option; LOAD TERMINATE or
    RESTART of an ALLOW ACCESS load may not use this option. Furthermore, this option
    is not valid if the index on the target table are marked as requiring a rebuild.


    When there are constraints on the table, the table state will be set to CHECK
    PENDING as well as LOAD IN PROGRESS and READ ACCESS. At the end of the load the
    table state LOAD IN PROGRESS will be removed but the table states CHECK PENDING
    and READ ACCESS will remain. The SET INTEGRITY command in CHECK PENDING and READ
    ACCESS, the nondelta portion of the data is still accessible to readers, the new
    (delta) portion of the data will remain inaccessible until the SET INTEGRITY command
    completes. A user may perform multiple loads on the same table without issuing
    a SET INTEGRITY command. Only the original (checked) data will remain visible,
    however, until the SET INTEGRITY command is issued.


    ALLOW READ access also supports the following modifiers:


    +   USE tablespace-name—If the shadow copy of the index is built in tablespace
    tablespace-name and copied over the original table at the end of the load during
    an INDEX COPY PHASE. Only system-temporary tablespaces can be used with this option.
    If not specified, the shadow index will be created in the same tablespace as the
    index object, the shadow copy of the index object over the old index object is
    instantaneous. If the shadow copy is created in a different tablespace from the
    index object, a physical copy is performed. This could involve considerable I/O
    and time. The copy happens while the table is offline at the end of a load during
    the INDEX COPY PHASE. Without this option is built in the same tablespace as the
    original. Since both the original and shadow index by default remain in the same
    tablespace simultaneously, there may be insufficient space to hold both indexes
    within one tablespace. Using this option ensures that you retain indexes for the
    indexes. This option is ignored if the user does not specify INDEXING MODE REBUILD
    or INDEXING MODE AUTOSELECT. This option will be ignored if INDEXING MODE AUTOSELECT
    is chosen and load chooses to incrementally update the index.


