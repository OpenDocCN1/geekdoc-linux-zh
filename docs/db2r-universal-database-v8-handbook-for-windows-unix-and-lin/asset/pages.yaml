    The v8 query client can connect to all versions of new servers. It can also connect
    to all other members of the DB2 family without the need for additional code. However,
    there are restrictions on down-level feature support to v7 databases.


    # DB2 ARCHITECTURE


    DB2 uses semaphores and shared memory for interprocess communication. This has
    enabled DB2 to be the first Relational Database Management System (RDBMS) to support
    the new InfinBand storage architecture.


    The DB2 Process Model (Figure 2.3) consists of clients or applications connecting
    to DB2 databases where a coordinating agent is assigned to process all requests
    for a particular application. Subagents can be assigned if using the ISE Database
    Partitioning Feature (DPF) or intra-partition parallelism. Bufferpools are used
    to store frequently accessed data and I/O servers process prefetch requests. I/O
    cleaners flush dirty pages from the bufferpools to disk. The logger process records
    changed information and at the appropriate time writes committed changes to disk
    in coordination with the bufferpool manager.


    Communication protocols supported are TCP/IP (the most common), NETBIOS, Named
    Pipes, and APPC. Work in DB2 is accomplished by Engine Dispatchable Units (EDUs).
    In UNIX, EDUs are implemented as processes and in Windows, EDUs are implemented
    as threads. The ps (process status) command can be used on UNIX to display DB2
    processes. The db2_local_ps command to return a list of all DB2 processes to standard
    output. Operating system processes will not show; only DB2 processes will be shown,
    which makes it easier to quickly see what DB2 processes are running. On Windows,
    DB2 threads can be monitored using the TASK MANAGER. See Table 2.3 for a partial
    list of DB2 processes on UNIX platforms. (For a detailed list, refer to the “Everything
    You Wanted to Know About DB2 VDB Processes,” DB2 Developer Domain tech article
    by Snow and R. Chung.)'
