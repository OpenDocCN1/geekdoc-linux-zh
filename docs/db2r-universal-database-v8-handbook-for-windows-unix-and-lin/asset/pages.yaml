    # NOTE


    The REORG utility has been significantly enhanced in v8. Over 20 new command options
    have been added to support online reorganization of tables and indexes, along
    with support for stopping, pausing, and resuming a reorganization.


    Other improvements are the capability to pause a reorg and restart it later. This
    is new in v8 and is an enhancement that gives you, the DBA, more flexibility.
    Prior to v8, a reorg could not be paused and restarted had to run to completion.
    These enhancements enable DB2 to support the demanding business requirements of
    today''s business environment. The REORG utility, along with detailed description
    of each option, follows.


    # NOTE


    For syntax diagrams, refer to the DB2 UDB Command Reference.


    The reorganization utility reorganizes an index or a table.


    The index option reorganizes all indexes defined on a table by rebuilding the
    index data into unfragmented, physically contiguous pages. If you specify the
    CLEANUP ONLY option of the index option, cleanup is performed without rebuilding
    the indexes.


    **Scope** this command cannot be used against indexes on declared temporary tables
    and will return an SQLSTATE of 42995 if attempted.


    **Authorization** The table option reorganizes a table by reconstructing the rows
    to eliminate fragmented data, and by compacting information. This command affects
    all database partitions in the database group. One of the following authorizations
    is required to run the reorg utility:


    +   - Sysadm

    - Sysctl

    - Sysmaint

    - Dbad

    - CONTROL privilege on the table


    **Required Connection** A connection to the database is required.


    # Command Parameters


    INDEXES ALL FOR TABLE table-name


    Specifies the table whose indexes are to be reorganized. The table can be in a
    local or remote database.'
