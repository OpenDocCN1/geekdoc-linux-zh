  md: '# 233

    CHAPTER 7

    Boot, Initialization, Shutdown, and Runlevels


    There must always be a minimum of two partitions: the filesystem (often referred
    to as root) and a swap partition. The swap partition is the memory and some hard
    drive device. The swap partition is always a minimum of the amount of RAM installed
    on the machine, but can be. The ability to use a swap partition greater than the
    amount of installed RAM is known as using virtual memory.


    # # Related Boot Files and Utilities


    Course Objectives Covered


    +   2. Describe the Linux Load Procedure (3037)

    7. Troubleshoot the Boot Process of a SLES 9 System (3038)

    10. Understand the sysfs File System (3038)

    11. Understand How the SLES 9 Hotplug System Works (3038)

    12. Understand the hwup Command (3038)


    There are a few other files and utilities to be aware of before walking through
    a boot. The first of these is the dmesg utility. This utility enables you to display
    bootup messages generated from LILO (in /var/log/messages). By default, when you
    type in dmesg, the messages are displayed on your screen. If there is a problem,
    however, and you want to save the messages for troubleshooting purposes, you can
    use this command:


    ```

    dmesg > (filename)

    ```


    The listing that is returned is rather lengthy; but it is important to check as
    it can be an invaluable aid in troubleshooting.


    As you look at the file on your system, notice the order of operations as the
    system comes up. Notice, as well, how the first line identifies the kernel version
    and vendor.


    Other files to be aware of are


    +   * /var/log/messages

    * /etc/conf.modules

    * /etc/modules.conf

    * utmp

    * wtmp'
