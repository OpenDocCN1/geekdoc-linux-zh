  md: '# Creating and Managing Users


    Course Objectives Covered


    +   1. Managing User Accounts (3036)

    4. Describe Basic Linux User Security Features (3037)

    5. Manage Linux Users and Groups (3037)

    6. Manage and Secure the Linux User Environment (3037)

    11. Understand the Linux User Authentication (3038)


    During the installation of the operating system, at least one user (root/superuser)
    is added to the system. This is the most powerful user on the system, and literally
    able to do anything. After the installation, it is often necessary to add additional
    users and modify variables associated with existing ones. Both tasks will be examined
    further in this section.


    To understand what is involved, however, it is important to know the files operating
    system uses to deal with users. The first file of importance is the /etc/passwd
    file. Fields are delimited by colons, and a sample would represent the following:


    ```

    root:x:0:0:root:/root:/bin/bash

    bin:x:1:1:bin:/bin

    deemon:x:2:2:daemon:/sbin

    adm:x:3:4:adm:/var/adm/

    lp:x:4:7:1lp:/var/spool/lpd

    sync:x:5:6:sync:/bin/sync

    shutdown:x:6:11:shutdown:/sbin/sbin/shutdown

    halt:x:7:0:halt:/sbin/bin/halt

    mail:x:8:12:mail:/var/mail/

    news:x:9:13:news:/var/news/

    uuc:x:10:14:uuc:/var/uuc/

    operator:x:11:0:operator:/root/

    games:x:12:10:games:/usr/games/

    gopher:x:13:30:gopher:/usr/lib/gopher-data:

    ftp:x:14:50:FTP User:/home/ftp

    man:x:15:15:Manual Owner:/nndomon:x:16:16:Majordomon:/:/bin/false

    postres:x:17:17:Postgres User:/home/postgres:/bin/bash

    mysql:x:18:18:MySQL User:/var/lib/mysql:/bin/false

    oday:x:65534:65534:::/bin/false

    edaney:x:100:100:emmett:/home/edaney:/bin/bash

    kudaney:x:101:100:karen:/home/kudaney:/bin/tcsh

    sudaney:x:102:100:spencer:/home/sudaney/bin/zsh

    ```'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Basic Linux Administration

    CHAPTER 5


    The seven fields can be broken down as:


    +   - The login name of the user—This must be unique per system, but is free text
    and can be edited and modified with any editor at any time. Among the entries
    shown in the example, bin is the owner of executables, daemon is used for system
    services, and adm owns the log files. Other entries are users (such as edulaney)
    or individual services (such as ftp)


    +   - The password—This can be an encrypted entry held within this field, or "x".
    In the case of the latter, the single character merely indicates that the values
    are stored elsewhere—in the /etc/shadow file.


    Placing the passwords in the shadow file adds additional security. Everyone can
    read the passwd file, but only the root user can read the shadow file.


    +   - The numerical userid (UID)—This is an incremental number for every user
    and is how the operating system truly references the user (remember that the login
    name is changeable text). The root user is always 0, and maintenance/service accounts
    use small numbers (typically up to 99). Regular user accounts typically start
    at 1000 (this is for SLES, but will differ with other Linux vendors) and increment
    other text value, but the number 0 is always the identifier.


    +   - The numerical groupid (GID)—This identifies the default group associated
    with the user. The root group is always 0, and lower numbers are used for system
    groups. Regular users are assigned groups at a beginning number listed in the
    /etc/login.defs file.


    +   - Free text used for descriptive purposes—One of the main utilities that looks
    at this field is finger, which simply returns information about a user to anyone
    querying.


    +   - The home directory of the user—This is where the users start when they log
    in, and where files are held to define their environmental variables.


    +   - The shell to use for the user—If no data is in this field, the default shell
    is used.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


