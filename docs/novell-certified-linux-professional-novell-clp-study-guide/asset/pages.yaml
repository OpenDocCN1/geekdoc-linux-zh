- img_proc: true
  md: 'Log files can easily be an administrator''s best friend or worst enemy. They
    can monitor the system and report on administrative and security issues 24 hours
    a day, seven days a week, creating fingerprints that allow you to see what is
    happening and by whom. On the other hand, if improperly implemented, every time
    you spend days looking through thousands of unneeded entries to find a single
    item; they eat up your precious disk space; and they serve little purpose.


    An illustration of their negative side: I once worked for an electronic corporation
    that sold computer systems to law enforcement departments. When making the purchase,
    most departments had to scrape together the money to buy the system and cut corners
    where they could (usually saving money by buying small hard drives or minimal
    RAM). Given the sensitive nature of house arrest, log files recorded everything
    that happened—every time a change was made to a person’s information, and so on.
    The machines constantly ran out of hard drive space, and on a weekly basis, customer
    support had to dial in remotely and delete the log files—defeating the whole purpose
    of having them.


    The key to using log files effectively is to know what each of them does. When
    you know that, you can realistically set your expectations and look for necessary
    data without being overwhelmed.


    # # The Log Daemon


    Although individual applications can have their own logging features, there is
    a log service specifically running for the operating system. The service responsible
    for adding entries to the log files is the syslogd—the system daemon—which is
    spawned by the init daemon. When started, syslog'
  merge: -1
  pgno: 190
