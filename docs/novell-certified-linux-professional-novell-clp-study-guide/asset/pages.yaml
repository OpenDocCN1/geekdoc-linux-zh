  md: '# CHAPTER 13


    files are optional and mutually exclusive: You would never have both on the

    same system.


    To see if there is a current crontab file, a user uses this command:


    ```

    crontab -l

    ```


    To remove it, they would use the -r option:


    ```

    crontab -r

    ```


    To edit it, they would use the -e option:


    ```

    crontab -e

    ```


    For the root user to see other user''s files, such as for larry, he would use

    this option:


    ```

    crontab -u larry

    ```


    There is one entry per line in the file, and each line consists of six fields.

    The six fields are separated by whitespace. The first time you look at such a

    file, it will look like a garbled mess. To understand what you are seeing,

    remember that there are six fields:


    +   1. Minutes (0–59)

    2. Hours (0–23)

    3. Day of month (1–31)

    4. Month (1–12)

    5. Day of week (0=Sunday, 6=Saturday)

    6. Command to run


    Here''s an illustration:


    ```

    $ pw

    /home/edulaney

    $ cat example

    logger This is running every five minutes after the hour

    $

    $ crontab -l

    no crontab for edulaney

    $ crontab -e

    ```


    > NOTE


    This opens a blank file within the editor.'
