  md: '# Working with Filesystems

    CHAPTER 8


    Most of the other passes are self-explanatory, but the first requires some further
    detail. Blocks and sizes are understandable, but inodes need some definition.
    An inode is a table entry that stores information about every file on the system.
    It is within the inode that information about the file is stored—in much the same
    way that a phone book holds information about people in a city.


    Every item that appears in a directory listing has an inode associated with it.
    The inode holds the following types of information:


    +   1. A unique inode number

    2. The type of entry that it is (file, directory, pipe, and so on)

    3. Permissions on the file in numerical format

    4. The physical size of the file

    5. The number of links to the entry

    6. The owner of the file

    7. The group owning the file

    8. Times of creation, modification, and access

    9. A pointer to the actual location of the data on the disk


    The inode numbers begin with 1 and increment from there, causing files copied
    during installation to have small numbers, and recently created files to have
    much larger numbers. When files and directories are deleted, their associated
    inode number is marked as unusable once more.


    When corruption occurs, files are dumped to the /lost+found directory, using their
    inode numbers as names. To see the numbers associated with files, you can use
    the -i option with:


    ```

    $ ls -l

    drwx-r-x-- 5 root root 1024 Sep 22 23:57 Desktop

    -rw-r--r-- 1 root root 81 Sep 23 00:25 monday

    -rw-r--r-- 1 root root 152 Sep 23 00:26 tuesday

    -rw-r--r-- 1 root root 38 Sep 23 00:26 wednesday

    $

    $ ls -li

    18471 drwx-r-x-- 5 root root 1024 Sep 22 23:57 Desktop

    18535 -rw-r--r-- 1 root root 81 Sep 23 00:25 monday

    18536 -rw-r--r-- 1 root root 152 Sep 23 00:26 tuesday

    ```'
  merge: -1
