  md: 'Each of these three values is examined in the following sections.


    # IP Address


    Every host on a TCP/IP network must have a unique IP address. An IP address is
    made up of values from a 32-bit binary number. Because it is impossible to memorize
    32-bit binary numbers, IP addresses are usually written in the form of four decimal
    octets. The first octet identifies the “class” of address that it is, which determines
    the number of hosts available on the network as shown in Table 11.2.


    TABLE 11.2

    | CLASS | ADDRESS | NUMBER OF HOSTS AVAILABLE | DEFAULT SUBNET MASK |

    |---|---|---|---|n| A | 01-126 | 16,777,214 | 255.0.0.0 |

    | B | 128-191 | 65,534 | 255.255.0.0 |

    | C | 192-223 | 254 | 255.255.255.0 |

    | D | 224-239 | Used only for multicasting and cannot be assigned to individual
    hosts |

    | E | 240-255 | Reserved addresses that cannot be issued |


    The first octet cannot be 127 because the address 127.0.0.1 is reserved for a
    loopback address to always signify the current host. Depending on the class, the
    second through fourth octets are used to identify the network and the host.


    It is important to understand that the IP address must be unique within the realm
    of the host communicates with. If the host is connected only to three other machines,
    each of the three machines must have a unique value. If the host connects to the
    Internet, the address must be unique within the scope of the Internet.


    # Subnet Mask


    The subnet mask, to oversimplify, tells whether the network has been subdivided
    into smaller networks, or all the hosts can be found on one wire. The default
    value is based on the class of the network as shown in Table 11.2. If you deviate
    from this value, you are divying your possible hosts from one'
