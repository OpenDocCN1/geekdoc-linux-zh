    The /etc/modules.conf is a text-based file that can be used to store

    information that affects the operation of depmod and modprobe. By default,

    this is a zero size file in SLES 9, but the format of the line is here:


    ```

    [root@server7 block]# cat /etc/conf.modules

    alias scsi_hostadapter ncr53c8xx

    alias eth0 tulip

    alias raport_lowlevel raport_pc

    pre-install plip modprobe raport_pc ;

    echo 7 > /proc/parport/0/irq

    pre-install pcmia_core /etc/rc.d/init.d/pcmia start

    post-install supermont modprobe scsi_hostadapter

    alias sound es171

    [root@server7 block]#

    ```


    > NOTE


    The conf/modules.conf file /etc/modules.conf and modules.conf file are one and
    the same. Which one

    is used depends on the Linux vendor.


    When modifying or reading the /etc/modules.conf file, remember:


    +   - All empty lines and all text on a line after a # are ignored.

    - Lines may be continued by ending the line with a backslash ().

    - The lines specifying the module information must fall into one of the following
    formats:


    ```

    keep

    parameter=value

    options module symbol=value ...

    alias module real_name

    pre-install module command ...

    install module command ...

    post-install module command ...

    pre-remove module command ...

    remove module command ...

    post-remove module command ...

    ```


    In the preceding list, all values in the “parameter” lines will be processed by

    a shell, which means that “shell tricks” like wildcards and commands'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    enclosed in back quotes can be used during module processing. For

    example

    path[misc]=/lib/modules/1.1.5?

    path[net]=/lib/modules/`uname`


    These have the effect of values to the path to look for the system modules.

    Table 10.4 lists the legal/allowed parameters.


    # TABLE 10.4 Allowed Configuration Parameters


    | PARAMETER | DESCRIPTION |

    | --- | --- |

    | keep | If this word is found before any lines containing a path description,
    the default set of paths will be saved, and added to it. Otherwise the normal
    behavior is to replace the default set of paths with those defined on the configuration
    file. |

    | depfile=DEPFILE_PATH | This is the path to the dependency file created by depmod
    and used by modprobe. |

    | path=SOME_PATH | The path parameter specifies a directory to search for the
    modules. |

    | path[tag]=SOME_PATH | The path parameter can carry an optional tag. This tells
    us a little more about the purpose of the modules in this directory and allows
    some automated operations by modprobe. The tag is enclosed in square brackets.
    If the tag is missing, the tag misc is assumed. One very useful tag is boot, which
    can be used to mark all modules that should be loaded at boot time. |

    | Options | Define options required for specific modules. |

    | Alias | Provide an alternate to a module. |

    | pre-install module command ... | Execute a command prior to loading the module.
    |

    | install module command ... | Install the following module. |

    | post-install module command ... | Execute a command after the module is loaded.
    |

    | pre-remove module command ... | Execute a command prior to removing the module.
    |'
