- img_proc: true
  md: '194


    # Novell Certified Linux Professional Study Guide


    to see whether kristin has come in yet, I can place the command into a file of
    any name; we’ll use “x” to make it very simple (you can create a similar file
    as well):


    ```

    $ cat x

    who | grep kristin

    $

    ```


    Instead of needing to type in the whole command, you can now accomplish the same
    operation by merely calling x, a shell script file. There are two methods you
    can use to execute the script file. The first method is to call the shell and
    feed it the script. You can accomplish this by calling a shell in the same way
    you could call any other executable—in this case the name of the executable is
    sh:


    ```

    $ sh x

    kristin :1 Dec 8 11:06

    $

    ```


    Or you can make the file an executable by setting the appropriate permissions
    on it. When this is done, it makes the file capable of being run without out the
    user first needing to call the shell:


    ```

    $ chmod 777 x

    kristin :1 Dec 8 11:06

    $

    ```


    The reason the permissions need to be changed is that the default permissions
    for newly created text files are always equal to 666 minus the umask value. By
    default, this sets the initial permissions to 644 (-rw-r--r--) and does not make
    the file executable by anyone.


    # Sprucing Up a Basic Script


    Course Objectives Covered


    +   1. Use Basic Script Elements (3038)

    5. Learn About Useful Commands in Shell Scripts (3038)


    Any command that can run from the command line can be included within a shell
    script. In the example that we have been working with this far, if the user kristin
    is logged in, an entry is returned showing that she has a session established;
    if she has not logged in, an empty line is returned.'
