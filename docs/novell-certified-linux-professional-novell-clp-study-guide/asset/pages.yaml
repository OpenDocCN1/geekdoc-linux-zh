    operator*:10547:0::7:7:

    games*:10547:0::7:7:

    gopher*:10547:0::7:7:

    ftp*:10547:0::7:7:

    man*:10547:0::7:7:

    majordom*:10547:0::7:7:

    postgres*:10547:0::7:7:

