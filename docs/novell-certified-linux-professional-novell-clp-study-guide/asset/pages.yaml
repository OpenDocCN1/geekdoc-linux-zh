    # Printing


    The default option for sed is simply to print. If you gave no parameters at all,
    an entire file would be displayed without any editing truly occurring. The one
    caveat is that sed must always have an option or command. If you simply give the
    name of a file following sed and nothing more, it would misinterpret it as a command.


    You can give a number of lines for it to display, followed with the q command
    (for quit), and see the contents of any file. For example sed 75000q /usr/share/dict/words


    will display all of the words file because the number of lines within the file
    is far less than 75,000. If you only want to see the first 60q, you can use sed
    60q /usr/share/dict/words


    The antithesis, or opposite, of the default action is the -n option. This prevents
    lines from displaying that normally works. For example sed -n 75000q /usr/share/dict/words


    will display nothing. Although it may seem foolish for a tool designed to display
    data to have an option that prevents displaying data, it can actually be a marvelous
    thing. To put it into perspective, though you must know that the p command exists
    and is used to force a print (the default option).'
