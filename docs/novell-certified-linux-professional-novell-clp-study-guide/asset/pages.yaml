    ```


    Notice that the -print option did not need to be specified: This is the default
    action. Notice also, unlike *locate*, it found an exact match and not just entries
    that had the four letters somewhere in the name. If you want to find matches that
    are portions of words, you need to use the asterisk (*) wildcard (find /name "grep*\")."


    When you find the match, you can perform an action on it, such as obtaining a
    list:


    ```

    $ / -name "grep" -exec ls -l {} \;

