    The tr (translate) utility can convert one set of characters to another. Use the
    following to change all lowercase characters to uppercase:


    ```

    $ tr ''[a-z]'' ''[A-Z]'' < fileone

    INDIAPOLIS INDIANA

    COLUMBUS

    PEORIA

    LIVINGSTON

    SCOTTSDALE

    $

    ```


    It is extremely important to realize that the syntax of tr only accepts two character
    sets, not the name of the file. You must feed the name of the file into the utility
    by directing input (as in the example given), by piping to it (|), or using a
    similar


    Not only can you give character sets as string options, but you can also specify
    a number of unique values, including


    +   - lower—All lowercase characters

    - upper—All uppercase characters

    - print—All printable characters

    - punct—Punctuation characters

    - space—All whitespace (blank can be used for horizontal whitespace only)

    - alphan—Alpha characters and numbers

    - digit—Numbers only

    - cntrl—Control characters

    - alpha—Letters only

    - graph—Printable characters but not whitespace


    For example, the output shown earlier can also be obtained like this:


    ```

    $ tr ''[:lower:]'' ''[:upper:]'' < fileone

    INDIAPOLIS INDIANA

    COLUMBUS

