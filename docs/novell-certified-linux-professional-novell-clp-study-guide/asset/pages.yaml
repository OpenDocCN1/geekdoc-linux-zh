    If you use -A in place of -a, it will leave off the first two entries (" and "...").
    Undoubtedly, however, the most useful option of all is -1, which will display
    a long list of the files. Entries look like this


    ```

    drwx------ 5 root root 1024 Aug 30 11:12

    --Desktop

    -rw-r--r-- 1 root root 548 Aug 23 22:01

