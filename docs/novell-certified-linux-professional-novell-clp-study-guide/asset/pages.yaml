    utmp::50:

    ftp::45:

    nbody::65534:

    users::100:


    There are four fields to each entry in the file. The first field is the text name
    (maximum of eight characters) associated with the group (used for -l listings
    and the like). The third field is the numerical GID that must be unique on the
    system. The second field—blank in all cases by default—holds a password that can
    be required for use. The fourth field can be used to list the members of the group.


    # Creating a New Group


    To create a new group, you can manually edit the /etc/group file and append an
    entry to it. If you do so, you must be certain to use a unique name and GID. The
    groupadd utility can also be used to simplify the operation:


    ```

    $ groupadd -g 101 sales

    $ tail -1 /etc/group

    sales::101:

    $

    ```


    The -g option is used to specify the GID number to use. If the number is not unique,
    the utility will fail. As a general rule, GIDs 0—99 are reserved for system groups:


    ```

    $ groupadd -g 101 marketing

    groupadd: GID 101 is not unique.

    $

    ```


    Similarly, if you attempt to rename a group, the utility fails:


    ```

    $ groupadd -g 102 sales

    groupadd: Group `sales` already exists.

    $

    ```


    There are only a few other options available with groupadd besides -g. Chief among
    them, the -o option can be used to create a non-unique group'
