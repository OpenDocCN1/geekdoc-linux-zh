    # Using the hosts Files


    Many years ago (when TCP/IP was new), networks were small—consisting

    of only a handful of hosts at each site. There may have been dozens of users

    accessing the network, but they were doing so as dumb terminals

    to host. The majority of the user''s work would be done on one host, with

    an occasional need to interact with another host—send email to another

    user, access a file, and so on.


    In those days—and in that environment if it still exists today—using

    /etc/hosts file is ideal for name resolution, hosts files are static, ASCII-

    text files that must reside on each host, and hold the information needed

    to resolve names in the form of columns. An example of a hosts file would be


    ```

    #This is an example to show how the HOSTS file works

    #the name of this host is Muncie, and not be listed here

    192.168.14.10 Yorktown

    192.168.14.11 Daleville Chesterfield

    192.168.14.12 Anderson

    192.168.14.13 Lapel #Pendleton

    192.168.14.14 Noblesville Westfield Carmel

    192.168.14.15 Rosston

    192.168.14.16 Lebanon

    ```


    Because hosts files are ASCII text files, they can be created and edited with

    ay text editor. The pound sign (#) is used as a comment character and

    ccauses the line to be ignored from the location where the character is found

    to the end of the line. In the preceding example, the first two lines are all

    comment and completely ignored for purposes of resolution; in the sixth

    line, the name Pendleton is also ignored.


    Whether the entries in the hosts file are sensitive or not dependent on

    the operating system. On Linux and Unix, the entries are sensi-

    tive, whereas on Windows NT 4.0, Windows 2000, and Windows Server 2003,

    entries are not sensitive.


    > NOTE


    Each line of the file can contain up to 255 characters and there can be

    unlimited number of lines within the file. The first column of each line is

    the IP address of the host. Whitespace must follow that to separate the

    columns and can be either a space or a tab—these delimiters must be used'
