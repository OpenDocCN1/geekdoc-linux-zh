  md: '# Novell Certified Linux Professional Study Guide


    commands to know for navigating within the tool (h, d, and so on) and their functions.
    The down arrow is used to scroll through the list one line at a time, and the
    Enter key selects that entry and shows you the information on it. Files are in
    hypertext format, so more often than not, making one selection will lead you to
    another menu.


    To illustrate, you can use the down arrow to scroll through the list to this line:


    +   * Gzip: (gzip). The gzip command for compressing files.


    Then when you press Enter, the menu of options select to gzip will come up, as
