  md: '# Working with iptables


    Although it is somewhat of a generalization, it can be said that ipfwadm with
    the Linux kernel 2.0.x and previous, and ipchains replaced it by 2.2.x. Although
    ipchains is still available—and still in many locations—iptables basically superseded
    it as of 2.4.x.


    iptables is a generic implementation of packet filtering that can function in
    both stateful and stateless modes. More information on iptables can be found in
    the tutorial at http://iptables-tutorial.frozentux.net.


    # Host Security


    The best way to secure a host is to know everything you can about it. When you
    set up a host to provide Web services, its purpose is to deliver Web content and
    pages to users. That host has no business providing DHCP addresses to clients—or
    even the ability to do so—in this situation.


    The /etc/inetd.conf file holds a list of services that will be started when a
    host when networking is started. Carefully audit this on each host and verify
    that there is a legitimate need for each service that will start and that it will
    not jeopardize the system or the network by opening a door by which unwelcome
    guests can enter your site. Audit, and the log files created by the syslog to
    see what services are starting and if you are encountering any problems them to
    die off, restart, and so on.


    You should, as an administrator, regularly keep track of security-related developments
    and problems as they occur in the world, and respond to them accordingly. For
    example, if your entire network is made up of XYZ and it is suddenly reported
    that versions of XYZ have a bug that provides an open door for anyone typing “wizard”
    at a login prompt, you best know about the situation and formulate a plan quickly.


    You can keep on top of security issues by monitoring your vendor’s site as well
    as those of CERT (an acronym for Computer Emergency Response Team) at www.cert.org.
    Now a division of Carnegie Mellon Software Engineering Institute, CERT had 3,734
    incidents in 1998. In 1999, that number almost tripled to 9,859. For 2003 (the
    last reporting period for which numbers are available at press time), that number
    escalated to more than 137,000.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    As the number of incidents reported has grown, so too has the number of vulnerabilities,
    and related statistics. If you suspect a problem on your own network and need
    to contact CERT, you can do so via email at cert@cert.org, or through regular
    mail at


    CERT Coordination Center

    Software Engineering Institute

    Carnegie Mellon University

    Pittsburgh, PA 15213-3890


    It is also highly recommended that you subscribe to the listserv@securityfocus.com
    list, which can be done by sending an email to with a blank subject and in the
    body, indicate "SUBSCRIBE BUGTRAQ".


    When security problems are found, the most common solution is update of the affected
    binaries. These are almost always available at the vendor''s side and you will
    want to obtain and install them immediately. The only way to deal with a threat
    is to eliminate it as expeditiously as possible.


    > Whenever you make any changes to the system, you should always fully document
    what you have done in a method that you can readily refer back to should unforeseenseenproblems
    occur later. You should also complete backups before making any changes.


    # User-Level Security


    If you give a user root-level permissions to the whole network, the scope of the
    damage you can cause is equal to that of the whole network. If you give the user
    very limited permissions to only one machine, the amount of potential damage he
    or she can cause is severely limited. Although this repeats everything that has
    been discussed, it focuses on how to limit the user.


    One of the main methods to limit the user is to use the rule of allows granting
    minimal permissions needed to do their job. It is always better to give someone
    not enough and then to go back and give them a little more, than to give them
    too much and find out the hard way. At the risk of bordering on childish, allow
    me to use an analogy.


    If my five-year-old son wants to be able to drive, I can buy him a Power Wheels
    Jeep (a toy that runs on two-six volt batteries) for roughly the same money as
    I can buy a scrapped Oldmobile Cutlass (a 20-year-old real car) from the auto
    salvage yard. When initially receiving the present, the five-year-old will be
    equally tickled with either one, and both cost him the'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Administrative Tasks Revisited

    CHAPTER 10


    same. With the toy, he can sit low to the ground, drive about four miles hour,
    and bounce off the garage door. With the real car, he can sit fairly off the ground,
    drive about 80 miles an hour, and drive through the garage door and over anything
    that happens to get in his way.


    No one would ever think of giving a real automobile to a five-year-old boy, but
    the analogy is not as far off the mark as it may seem. Far too many administrators
    err on the side of giving too much permission when creating new users. This most
    occurs through group memberships, and is intended (by the administrators) to make
    the administrator’s job easier by not having to respond to calls from users being
    denied access to a file, directory, resource, and so on.


    On the system, the equivalent to being able to drive through the garage door and
    everything in it is the ability to use the rm command to delete only few files
    and inadvertently using recursive commands to delete too much. When that happens,
    the system administrator assuredly wishes she had fewer permissions and had those
    actions denied.


    It is also important to place other limits on the users. You can limit things
    as


    +   The amount of storage space the users are allowed on the system. It is accomplished
    by implementing quotas.


    +   The processes they can run. The ulimit -u command is used to place restrictions
    on this, and will limit the maximum number of processes a single user can have
    at any time.


    +   Their memory usage. The ulimit -v command will allow you to specify a maximum
    amount of virtual memory that is available to a shell.


    The ulimit specifications should be placed in the /etc/profile to apply to all
    users.


    > NOTE


    +   The users'' logins. The /etc/security file holds a list of all terminals from
    which the root user can log in. By default, every known terminal is listed here.
    You may want, taking into account security, to edit this file and remove most
    or most of the terminals from the list. The /etc/ttywhich does not exist by default)
    can be used to hold user restrictions. Within this file, you can specify allowed
    ttys and hosts on a per-user basis under the USERS section. The GROUPS section
    allows the same on a per-group basis, and a CLASSES section can'
