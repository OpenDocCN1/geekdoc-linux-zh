  md: '# Other Useful Utilities


    A number of other useful text utilities are included with Linux. Some of these
    limited usefulness and are intended only for a specific purpose, but are given
    knowing of their existence and purpose can make your life with Linux considerably
    easier.


    In alphabetical order, the additional utilities are as follows:


    +   expand—Allows you to expand tab characters into spaces. The default number
    of spaces per tab is 8, but this can be changed by the -t option. The opposite
    of this utility is unexpand.


    +   file—This utility will look at an entry''s signature and report what type
    of file it is—ASCII text, GIF image, and so on. The definitions it returns (and
    thus the file can correctly identify) are defined in a file called magic. This
    file typically resides in /usr/share/misc or /etc.


    +   more—Used to display only one screen of output at a time.


    +   od—Can perform an octal dump to show the contents of files other than ASCII
    text. With the -x option, it does a hexadecimal dump, and with the -c option,
    it shows only recognizable ASCII characters.


    +   pr—Converts the file into a format suitable for printed pages—including a
    default header with date and time of last modification, filename, and page numbers.
    The default header can be overwritten with the -h option, and the -l option allows
    you to specify the number of lines to include on each page—the default is 66.
    Default page width is 72 characters, but a different value can be specified with
    the -w option. The -d option can be used to double-space the output, and the -m
    option can be used to print numerous files in column format.


    +   split—Chops a single file into multiple files. The default is that a new file
    is created for every 1,000 lines of the original file. With the -b option, you
    can avoid the thousand-line splitting and specify a number of bytes to put into
    each output file, or use -l to specify a number of lines.


    +   uniq—This utility will examine entries in a file, comparing the current line
    with the one directly preceding it, to find lines that are unique.'
  merge: -1
