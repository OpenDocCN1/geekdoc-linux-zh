  md: '# Novell Certified Linux Professional Study Guide


    The first file, messages, is written to by cron and other processes, and can be
    useful in troubleshooting problems. It is some of the contents of this file that
    are displayed by the dmesg command. The second and third files are one and the
    same, but differ based on vendor (on some systems, conf.modules is used, and on
    others, modules.conf is used). The purpose of this file is to hold information
    used by the kernel to identify the machine. The file is a C++ source file and
    usually not accessed by administrators unless corruption has occurred.


    The utmp and wtmp files have been mentioned previously. They are log files that
    act as counterparts of each other and exist in /etc/ or elsewhere. If elsewhere,
    utmp is beneath /var/run and wtmp is beneath /var/log. By default, when the system
    comes up, entries are written to utmp, and when the system goes down, entries
    are written to wtmp.


