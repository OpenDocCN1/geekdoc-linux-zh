    | -name file | True if matching the name given |

    | -perm permission | True if matching the given permissions |

    | -print | Prints the names of matching files |

    | -size number | True if matching the number of blocks or characters |

    | -type type | True if matching the specified type (d=directory, f=file, b=block
    file, c=character file) |

    | -user name | True only if owned by the named user |


    For example, to find all files on the system, beginning with the root directory,
    that are all named *grep*, you would use these specifications:


    ```

    $ / -name "grep"

    /usr/bin/grep

