  md: '# CHAPTER 12

    Working with YaST


    One of the primary features differentiating SuSE from other implementations of
    Linux is its inclusion of YaST (Yet Another Setup Tool). This linetop tool provides
    a convenient interface to virtually every aspect of system administration. The
    latest versions of SuSE—including SLES 9—ship the second version of this tool—YaST.


    This chapter looks at that tool and a sampling of the administrative tasks that
    you can do with it. It covers the following course objectives:


    +   1. Introduction to YaST2 (3036)

    2. Managing User Accounts with YaST2 (3036)

    3. Understanding the YaST2 Software Management Feature (3036)

    4. Obtaining Hardware Configuration from YaST2 (3036)

    5. Managing the Network Configuration Information from YaST2 (3036)

    6. Manage Software Updates with YaST Online Update Server (YOU) (3037)

    7. Enable Remote Administration with YaST (3037)

    8. Configure Security Settings with YaST (3038)


