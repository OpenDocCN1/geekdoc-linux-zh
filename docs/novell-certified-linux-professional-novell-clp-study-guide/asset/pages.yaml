  md: '# Preliminary GNU and Unix Commands


    # CHAPTER 3


    ```

    $ ls -l fileone onefile

    ls: onefile: No such file or directory

    -rw-r--r-- 1 root root 85 Aug 22 10:26

    ->onefile

    ```


    ```

    $ cp fileone onefile

    ls -l fileone onefile

    -rw-r--r-- 1 root root 85 Aug 22 10:26

    ->onefile

    -rw-r--r-- 1 eduelaney users 85 Aug 30 16:16

    ->onefile

    ```


    Notice that the original entry (source) remains unchanged, but now there is a
    second entry (target) as well. On the second entry, the contents are identical,
    but the date and time are those of the present (when cp was executed), not of
    the source. Notice as well that the owner and group of the new file become that
    of the user executing the command. This is the same would take place if you were
    creating the target file completely from scratch.


    > To be able to copy a file—create a new entity equal in content to another—you
    need only read permission to the source.


    The -p option can be used to force as many of the old variables to remain the
    same. It preserves what it can in terms of attributes:


    ```

    $ ls -l filenextfile

    ls: nextfile: No such file or directory

    -rw-r--r-- 1 root root 85 Aug 22 10:26

    ->fileone

    ```


    ```

    $ cp -p fileone nextfile

    ls -l fileone nextfile

    -rw-r--r-- 1 root root 85 Aug 22 10:26

    ->fileone

    -rw-r--r-- 1 eduelaney users 85 Aug 22 10:26

    ->nextfile

    ```


    $nNotice that the date and time associated with the source were kept, but the
    owner and group still must change.'
