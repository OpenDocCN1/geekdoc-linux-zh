  md: '# Introducing Linux


    Course Objectives Covered


    +   1. The History of Linux (3036)


    +   3. Understanding the Multiuser Environment (3036)


    In days of old, when knights were bold, operating systems were most wholly proprietary
    in nature. This means that they were owned by a company and that company charged
    a licensing fee for every implementation of the operating system on a machine—be
    a desktop, laptop, or other device.


    In 1991, Linux Benedict Torvalds, a Finnish student, decided to create an open
    version of Unix for the PC platform. Originally began as a hobby and he was able
    to create the kernel of the operating system, which is known as the kernel. The
    kernel is responsible for all the low-level tasks within the computer; it delegates
    work to all the system peripherals, such as video cards and hard drives. The kernel
    handles all filesystem requests and even processes requests through the TCP/IP
    stack. Without the kernel, there would be no operating system. This day, Linux
    Torvalds is still responsible for the kernel and oversees all modifications to
    it.


    Kernel numbers take the form of linux-x.y.z, where x.y.z is the version number.
    The highest even number is the latest stable version, whereas the highest odd
    number is considered a test version.


    Because Linux is an open, nonproprietary system, others are free to contribute
    to Linux and enhance it. Developers from all over the world would have taken over
    the job of creating the applications, binaries, and utilities that make Linux
    the operating system that it is today.


    The operating system is also multiuser, multitasking, and multithreading. Being
    multiple user merely means that more than one user at a time (concurrently) can
    access and interact with the operating system; a separate shell is used to interface
    with each user.


    Because the operating system is multitasking, it can do more than one thing at
    a time. It can read a file from the hard drive at the same time that it is sending
    a report to the printer, and so on. The tasks can be divided into threads—the
    smallest elements of each task. Because Linux is multithreading as well, it can
    do various parts of a task simultaneously, allowing it to finish the task much
    faster than if it had to synchronously wait for one item to finish before starting
    another.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Introducing SLES 9


    Course Objectives Covered


    +   1. Identify the Components of SLES 9 (3036)

    2. Describe SLES Linux Enterprise Server 9 (3037)


    SuSE Linux Enterprise Server 9 (known as SLES 9) is a robust enterprise Linux
    server marked by Novell. It is an evolutionary advancement from previous versions
    of products from SuSE, acquired by Novell purchased that company.


    SLES 9 is built around the 2.6 kernel and as such supports the following:


    +   * Hyperthreading—The ability to not only do multithreading, but to also split
    threads with processors and complete transactions faster

    * USB 2.0 and Bluetooth with Hotplug support—For quickly identifying and configuring
    devices when they are connected

    * Improved IPv6 support—For the next generation of TCP/IP

    * Up to 128 processors, 4 billion unique users, 65,535 user-level processes

    * NUMA (Non-Uniform Memory Access) support—To more efficiently scale CPUs

    * CKRM (Class-based Kernel Resource Management)—For providing services differentiated
    at the user or job level

    * Flexible I/O scheduling


    In addition to the 2.6 enhancements, SLES 9 offers its own features, including
    new YaST (Yet Another Setup Tool) modules, support for ZENworks, and some developer
    tools.


    SLES 9 supports both the x86 and x86-64 (AMD-64) processor platforms, as well
    as Itanium and processors, IBM Power and S/390 architectures. Support is included
    for SLES 2.0, FireWire, Advanced Configuration and Power Interface (ACPI), and
    Infinib. And just to be politically correct, SLES adheres to the Linux Standard
    Base (LSB), File System Hierarchy (FHS), and TeX Directory Standard (TDS)—all
    of which means that the operating system is truly Linux-based.'
  merge: -1
  pgno: 30
