    nobody*:awVvUsWpigo:11144:0::7:7:

    kdulaney:awZIG94rzQY:11144:0::7:7:

    sdulaney:awZ72Bxwu.Nm:11144:0::7:7:

    ```


    The eight fields


    +   - The log name of the user, which is the only field that must match the /etc/passwd
    file.

    - An encrypted hash of the password. If no password has been defined on system
    accounts, an asterisk (*) is often used. If no password is defined on newly created
    accounts, an exclamation mark (!) often appears. Under no conditions can this
    field be blank for a functioning user.

    - The day the password was last changed, expressed in the number of days that
    have passed since 1/1/1970. An entry of 12711, for example, would mean 12,711
    days had passed and it is now October 19, 2004.

    - Minimum password age expressed in how many days a user must wait between being
    allowed to make password changes. A value of 0 means the users can make changes
    as often as they like.'
