  md: '# Novell Certified Linux Professional Study Guide


    If you want to find all occurrences of the word cat, the syntax becomes


    ```

    $ grep "cat" garbage

    I heard about the cats last night

    and particularly the one cat that

    ran away with all the catnip

    ```


    In this instance, the three-letter sequence “cat” appears in every line. Not only
    is there “cat” in the second line, but also “cats” in the first, and “catnip”
    in the second—all matching the character sequence specified. If you are interested
    in “cat” but not “cats”, the syntax becomes


    ```

    $ grep "cat[s]" garbage

    and particularly the one cat that

    ran away with all the catnip

    ```


    This specifically removes a four-letter sequence of “cats” while finding all other
    three-letter sequences of “cat”. If we were only interested in “cat” and no deviations
    thereof, there are a couple of other possibilities to explore. The first method
    would be to include a space at the end of the word and within the quotation mark:


    ```

    $ grep "cat " garbage

    and particularly the one cat that

    ```


    This finds four-letter combinations equal to that given—meaning that nothing follow.
    The only problem (and it is a big one) that if the word given is the last entry
    in a line of a large file, it would not necessarily be followed by a space, and
    thus would not be returned in the display. Another possibility is to eliminate
    “s” and “n” from the return display:


    ```

    $ grep "cat[sn]" garbage

    and particularly the one cat that

    ```


    This accomplishes the task, but would not catch other words where the fourth character
    differed from “s” or “n”. To eliminate all four characters, it is better to use


    ```

    $ grep "cat[A-z]" garbage

    I heard about the cats last night

    ```'
