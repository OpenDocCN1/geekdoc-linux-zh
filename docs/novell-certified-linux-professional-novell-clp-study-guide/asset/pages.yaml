    The same is true for mounting a DVD drive.


    And the entry added to mount looks like this:

    /dev/hdc on /mnt/cdrom type iso9660 (ro,noexec,nosuid,nodev)


    The /mnt directory holds readily accessible definitions for external devices such
    as the CD-ROM drive and floppy disks. Options that can be used with the mount
    command are


