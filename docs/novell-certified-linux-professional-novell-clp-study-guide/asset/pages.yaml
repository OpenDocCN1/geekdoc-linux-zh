  md: "# Looping Around\n\nCourse Objectives Covered\n\n+   3. Use Control Structures\
    \ (3038)\n4. Use Advanced Scripting Techniques (3038)\n5. Learn About Useful Commands\
    \ in Shell Scripts (3038)\n\nOften you want to run a series of commands or tests\
    \ over and over again. You can do this by adding the same sequence of steps to\
    \ the script over and over, or by adding in looping sequences. Within the scripting\
    \ languages, there are three simple types of loops:\n\n+   - while\n- until\n\
    - for\n\nThe first two types of loops are closely related (opposites of each other,\
    \ in fact), but the last is not. We will look at all three types, and examples\
    \ of where each type would be applicable.\n\n# Using while\n\nThe while loop continues\
    \ to execute as long as a condition tests true. As soon as a condition tests false\
    \ (or \"untrue\"), the loop ceases execution. The syntax for this is\n\n```\n\
    while {condition exists}\ndo\n  (series of commands)\ndone\n```\n\nA common use\
    \ for this type of loop is to continue to process variables as long as variables\
    \ exist: in other words, to continue to shift while variables remain. For example\n\
    \n```\n$ cat show\n!/bin/sh\n# echo back variables and shift until all are gone\n\
    while [ \"$# -gt 0 ]\ndo\n```"
