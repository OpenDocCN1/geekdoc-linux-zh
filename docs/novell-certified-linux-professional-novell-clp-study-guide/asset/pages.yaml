  md: '# Novell Certified Linux Professional Study Guide


    Using the `spec` file, you can try to build the package using the command

    `$ rpm -ba filename.spec`


    This creates the source and binary RPMs for your package. The easiest and best
    way is to install it on a different system. Because you have just installed it
    on your own system, it will be difficult to know if the test was actually successful.
    Even if you remove the package, you might have missed a file in your file list
    and the package will not be completely removed. When the package is reinstalled,
    your system is complete, but the package is not. It is important to consider that
    while you are doing the following operation


    ```

    $ rpm -ba package-name

    ```


    most people will be executing

    `$ rpm -I package name


    So it is important to not miss anything in the package build and install sections.
    Assuming you want to distribute your RPMs, you can upload the new RPM to many
    different sites.


    # Understanding the Linux Kernel


    # Course Objective Covered


    +   6. Manage the Kernel (3037)


    The kernel is a software component of the operating system that acts as the system
    supervisor. The kernel provides all system services to the applications and commands
    users execute. This includes allocation of CPU time, memory management, disk access,
    and hardware interfaces. Users are not typically aware of the kernel functions
    as they are hidden from their view by the applications, such as the shell, that
    the user interacts with. The system administrator becomes familiar with the kernel
    as he or she performs the jobs.


    When a system administrator executes a command as `ps`, the kernel accesses the
    system table to provide information regarding the currently running processes.
    More commonly, however, system administrators interact with the kernel to handle
    the installation of new hardware.'
  merge: -1
