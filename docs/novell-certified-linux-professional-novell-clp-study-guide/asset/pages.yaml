    The utility is pretty straightforward and does not have an unlimited number of
    options, and thus makes a good choice for dissecting an example of the output
    available from man. Using the more or less utilities to display the page (whichever
    is defined by the PAGER variable), you can move through the documentation in a
    number of ways after the first screen appears, as shown in Table 13.2.


    # TABLE 13.2 Navigating with the more and less Utilities


    | KEY COMBINATION | MOVEMENT |

    |---|---|

    | Enter | Scroll down the next line |

    | Spacebar | Scroll down the next page |

    | b | Scroll up to the previous page |

    | q | Quit |

    | / | Search forward for the first page containing specified text |

    | ? | Search backward for the first page containing specified text |

    | N | Move to the next occurrence of a string after a search |

