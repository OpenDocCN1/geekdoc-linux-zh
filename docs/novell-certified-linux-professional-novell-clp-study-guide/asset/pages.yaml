    zip code.


    +   4. Within all earlier confines, find Peachtree Lane.


    +   5. On Peachtree Lane, go to house number 4104.


    Absolute addresses will never change and will point to the entity regardless of
    where you are coming from.


    The absolute address is the same whether the person coming to visit lives in Muncie
    or in Alaska. However, because the first person does live in Muncie as well, we
    can also tell them how to reach their destination using relative addressing:


    +   1. Take Rosewood to Bethel and turn left.


