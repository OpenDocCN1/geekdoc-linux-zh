- img_proc: true
  md: '# 161 CHAPTER 5


    +   - Maximum password age expressed in how many days a user is allowed to keep
    this password. A value of 90 would mean the password must be changed every 90
    days, whereas 99999 (the default) essentially means that no change is required.


    +   - The number of days before the password expires when a warning starts appearing
    to change the password. This is usually 7.


    +   - The number of days after the password expires to wait before disabling the
    account. This field is often blank.


    +   - The expiration date for the password, again in days since 1/1/1970. This
    field is often blank.


    # Creating User Accounts


    New users can be created manually, or by using utilities. To do so manually, simply
    append an entry to the /etc/passwd file (it is strongly recommended that you make
    a backup copy of the file before changing). You can leave the password field blank,
    and then assign a password using the passwd utility. If you simply leave blank,
    it is a valid account without a password:


    ```

    $ cat >> /etc/passwd

    evan::0:100:EvanD:/home/evan:/bin/bash

    {press Ctrl+D}

    $ passwd evan

    New user password: {enter password}

    Retype new user password: {enter password again}

    passwd: all authentication tokens updated successfully

    $

    tail -1 /etc/passwd

    evan:petKv.FLWg/Ig:0:100:EvanD:/home/evan:/bin/bash

    $

    ```


    Any user can use the passwd utility to change his or her password. Only the root
    user, however, can use it to change the password of another user.


    > NOTE


    Notice that this method places the encrypted password in the /etc/passwd file
    itself, and does not utilize the /etc/shadow file. Provided the home directory
    exists, and the user is the owner of it, the user can now be an authenticated
    user.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    A utility provided with Linux (most vendors also have their own utilities as well)
    to simplify this process is useradd. You must use options with the utility, and
    a key one is -D to display default settings. Here''s an example:


    The useradd utility is intended for use su or root. Typical users will get an
    error message when they attempt to use it.


    ```

    $ useradd -D

    GROUP=100

    HOME=/home

    INACTIVE=-1

    EXPIRE=

    SHELL=/bin/bash

    SKEL=/etc/skel

    GROUPS=dialout,ucp,video,audio

    $

    ```


    These are the defaults that will be used when a new user is created with this
    utility. The defaults come from the text file /etc/login.defs. Therefore, the
    following sequence is possible:


    ```

    $ useradd kerby

    $ tail -1 /etc/passwd

    kerby:x:1002:100::/home/kerby:/bin/bash

    $ tail -1 /etc/shadow

    kerby:::12711:0:99999:7:::

    $

    $ passwd kerby

    New user password: {enter password}

    Retype new user password: {enter password again}

    password: all authentication tokens updated successfully

    $ tail -1 /etc/shadow

    kerby:M3cnMnQWhjRD6:12711:0:99999:7:::

    $

    ```


    Note that the /etc/shadow file is used, and the values used to create the entries
    in the two files come directly from the defaults, which are shown in Table 5.1.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Defaults for /etc/shadow


    | DEFAULT | FILE RESULT |

    |---|---|

    | GROUP | Becomes the fourth field of passwd |

    | HOME | Becomes the sixth field of passwd, with the %s variable becoming the
    name given on the command line (which becomes the first field of both passwd and
    shadow) |

    | SHELL | Becomes the seventh field of passwd |

    | PASS variables | Entered into appropriate fields of shadow |


