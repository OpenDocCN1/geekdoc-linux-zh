    # Filesystems Needing Partitions


    | FILESYSTEM NAME PRIMARY/EXTENDED DESCRIPTION |

    | /boot | Primary | This is where your kernel images are located. If you are using
    LILO or plan to support other operating systems, it is best that this partition
    be the first on the disk. |

    | /root | Primary | This is your root filesystem. |

    | /usr | Extended | Most application data is stored here, including system binaries,
    documentation, and the kernel sources. |

    | /home | Extended | This is where home directories for the users on the system
    are located. Depending on the number of users you have and the amount of disk
    space required, you may need multiple home directory partitions. |

    | /var | Extended | This is a spool partition, containing files for log and error
    messages, Usenet mailboxes, and so on. |

    | /tmp | Extended | This is a temporary storage place for files that are being
    processed. Compilers and many applications create many files in this area. Often
    these files are short-lived, but they can sometimes be very large. |


