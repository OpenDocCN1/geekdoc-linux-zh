  md: '# Novell Certified Linux Professional Study Guide


    +   netcat—This utility can be used to establish a connection between two hosts.
    You can use the -h option to see a list of all available parameters. The most
    basic operation, however, is to open a port on one host with a command as netcat
    -1 -p 16000, which pushes port 16000 in detail. Following this, you establish
    a connection with that host by another using the command netcat (hostname to connect
    to) 16000. The connection will stay established until you press Ctrl+C.


    +   netstat—This command shows the statistics of the TCP and UDP protocols. Executing
    netstat without switches displays protocol statistics and current TCP/IP connections.
    When you have determined that your base level communications are working, you
    will need to verify the services on your system. This involves looking at the
    services that are listening for incoming traffic and/or verifying that you are
    creating a session with a remote station. The netstat command will allow you to
    do this. The following listing is an example of the output generated by netstat
    without any options:


