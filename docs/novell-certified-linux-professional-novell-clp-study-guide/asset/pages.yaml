    Before you begin any installation, you need to be certain your system meets the
    requirements for the operating system. The recommended requirements for installation
    are


    +   - 512MB (256MB) is the minimum it will install

    - 4GB free hard disk space (at least 500MB is needed)

    - Network interface


    When you are certain your system meets the requirements, you are ready to begin
    the installation. Insert the first CD into the computer and reboot the system.
    On most computers, the system will boot from the CD and you are ready to begin
    the installation. If this does not happen, you may need to reconfigure the BIOS
    and change the boot drive order to check for media in the CD/DVD drive first.


    The first menu to appear offers a number of choices:


    +   - Boot the Hard Disk—This stops the installation and boots the system already
    on the hard disk. Because this is the safest choice,

    - Installation—This is the option to select to begin the normal installation.

    - Installation—ACPI Disabled—Choose this option if you need the Advanced Configuration
    and Power Interface to not interfere with the installation process.'
