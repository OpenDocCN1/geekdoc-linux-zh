  md: '# Working with the Time


    Course Objectives Covered


    +   4. Describe Basic Linux User Security Features (3037)

    10. Configure SuSE Linux Enterprise Server (3037)

    17. Monitor the Operating System (3038)


    As networking has evolved from simply sharing files to far more complex operations,
    the subject of time has escalated to critical importance. Imagine an implementation
    where Novell''s eDirectory is deployed. Because eDirectory is a distributed database,
    information (data) within replicas is synchronized at frequent intervals. In order
    for the synchronization to work properly, time must be consistently (and properly)
    configured throughout all the servers in the network.


    # Working with NTP


    The Network Time Protocol (NTP) is an open-source protocol that provides the most
    convenient method of synchronizing time on a variety of platforms. For history
    about the protocol, and its information about its implementations, see http://www.ntp.org.


    Within Linux, NTP is implemented as a daemon via ntpd and then you configure it
    to synchronize time with providers over the Internet that get their time from
    the atomic clock. A list of NTP timeservers can be found at http://www.eecis.udel.edu/~mills/ntp/servers.html.
    After a timeserver on your network gets the time from the Internet server, other
    servers in your network then get their time from that server.


    > The xtpd daemon can be used in place of ntpd in many implementations (such as
    is the case with SuSE).


    The ntp service is configured through the entries in the /etc/ntp.conf file. The
    first entry in the file usually points to a loopback of 127.127.1.0. This address
    is used if the daemon cannot contact the NTP time provider. Instead of getting
    time externally, it queries the system BIOS clock.


    The hwclock utility is the primary tool for interacting with the hardware clock.
    You can see the current time, as well as specify it. These are the options to
    know:'
