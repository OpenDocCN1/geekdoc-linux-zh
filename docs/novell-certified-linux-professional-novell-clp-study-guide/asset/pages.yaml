    This sequence showed the present working directory to be /usr/bin and the HOME
    variable to be equal to /usr/home/edulaney. Entering cd without any parameters
    changed to that directory.


    ```

    $ pwd

    /usr/home/edulaney

    $ cd /

    /

    $ cd /usr/home/edulaney

    $ pwd

    /usr/home/edulaney

    $ cd ..

    $ pwd

    /usr/home

    $

    ```


    In this sequence, the first change is to the root directory (/), then to /usr/home/edulaney.
    Using the shortcut for the parent of this directory, it was then possible to move
    back one directory.


    # Absolute and Relative Addressing


    There are two methods of specifying paths to anything—files, directories, and
    so on: absolute and relative. When you give an absolute path, you take nothing
    into consideration, and you give a value that is always true. When you give a
    relative path, you take into account where you are currently and give you a path
    relative to that.


    To use an analogy, suppose two people live in the same city and state: Muncie,
    Indiana. The first person lives at 1990 Rosewood, and the second lives at 4104
    Peachtree. If the first person wants to find/visit the second person, they can
    find out where they are via an absolute path known as their mailing address:


    4104 Peachtree Lane

    Muncie, IN 47304


    This address says to


    +   1. Find Indiana.

    2. Within Indiana, find Muncie.'
