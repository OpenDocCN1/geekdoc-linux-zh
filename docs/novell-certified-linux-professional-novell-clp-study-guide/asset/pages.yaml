    # Working with OpenSSH


    Course Objective Covered


    +   9. Enable FTP Server (3037)


    A File Transfer Protocol (FTP) server can be established to allow users to transfer
    files between their host and the server. This can be done on an anonymous user
    basis, or you can require users to authenticate by giving their username and password.


    There are a great many FTP server available, but the Novell prefers to focus on
    PureFTPD. Although not installed by default, it is included with the SLES 9 packages
    and can be installed at any time (the package name is pure-ftpd.


    After PureFTPD has been installed, you can configure the anonymous home directory
    in /srv/ftp and tweak the settings in pure-ftpd.conf for your environment.


    As something of an alternative to FTP, SSH (Secure Shell) is a protocol suite
    intended to add security to otherwise non-secure standard utilities. OpenSSH is
    a free, open source implementation of the SSH suite.


    OpenSSH is a replacement for telnet (as well as FTP and related utilities) that
    is included with some Linux implementations, and available for all others. Because
    of the weaknesses inherent in both telnet and FTP, the implementation of OpenSSH
    is one of the first steps to undertake in any attempt to harden the operating
    system.


    As a generalization, OpenSSH encrypts all traffic and includes tunneling and authentication.
    This makes it much more secure than the older remote connections that sent plain
    text, or unencrypted, passwords.


    OpenSSH uses the ssh daemon and includes a set of utilities. Quoting from the
    OpenSSH site (http://www.openssh.org):


    The OpenSSH suite includes the ssh program which replaces login and telnet, scp
    which replaces rcp, and sftp which replaces ftp. Also'
  merge: -1
  pgno: 415
- img_proc: true
  md: '# 401

    CHAPTER 11

    Networking Fundamentals


    included is ssh which is the server side of the package, and the other basic utilities
    like ssh-add, ssh-agent, ssh-keysign, ssh-keyscan, ssh-keygen and sftp-server.
    OpenSSH supports SSH protocol versions

    1.3, 1.5, and 2.0.


    OpenSSH is primarily developed by the OpenBSD Project, and its first inclusion
    into an operating system was in OpenBSD 2.6. The software is developed outside
    the USA, using code from roughly 10 countries, and is freely usable and re-usable
    by everyone under a BSD license.


    For the exam, the primary duty to know is the names of the replacement utilities
    (and those replace). There are three options that can be used with scp:


    +   - B repeats the same password when copying multiple files.

    - p preserves time stamps and file permissions.

    - r recursively copies a tree.


    The syntax for the command is

    scp -<b|-p|-r <source file> <destination file>


    Thus to copy from the remote server to the local host, an example would be

    scp -p poweredge:/data/dalaney/anderson.txt

    ->data/scott/indiana.txt


    To do it in reverse—copy the file from the local host to the remote—the

    command would become

    scp -p /data/scott/indiana.txt

    poweredge:/data/dalaney/anderson.txt


