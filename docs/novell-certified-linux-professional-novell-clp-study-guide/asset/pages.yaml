  md: '# Preliminary GNU and Unix Commands


    Alternatively, you can type a bang followed by a set of characters and the shell
    will rerun the most recent command starting with those characters. For example


    ```

    ls

    ```


    will rerun the most recent command that started with ls.

    Important variables for history


    +   - HISTFILE—Points to the file holding the history of commands. By default,
    it is .bash_history in each user''s directory.

    - HISTSIZE—The number of entries to keep each session.

    - HISTFILESIZE—Identifies the number of command history entries to be carried
    over from one session to another (letting you run commands in this session that
    you ran in the previous one).


    An internal alias for history, fc, also exists and can be used to recall and rerun
    commands as well.


    # Command Aliasing


    Although a plethora of commands and utilities are available within the operating
    system and shell, you can create aliases that make more sense to you, or shorten
    the number of characters you have to type. For example, if you are familiar with
    working with the command line of Windows-based operating systems, you are accustomed
    to typing dir to see what files are there. A similar operation in Linux is possible
    with ls -1. It is possible to create an alias so that when you type dir, it is
    ls -1 that runs using the following syntax:


    ```

    alias dir="ls -1*

    ```


    The syntax is always the alias followed by the actual command that will run when
    the alias is entered, separated by the equal sign (=). In rare instances, you
    can get away with not using the quotation marks around the aliased entry, but
    as a general rule, they should always be used.


    For aliases to survive a session, they should be added to the .bashrc file within
    your user''s home directory. If you do not put them within a file that is executed
    upon login (thus re-creating them), the created aliases are lost when you log
    out.'
