    # Deleting


    The d command is used to specify deletion. As with all sed operations, the line
    is deleted from the display only, and not from the original file. The syntax is
    always


    > {the specification} d


    Use this example to delete all lines that have the string "three":


    ```

    $ sed ''/three/ d'' tuesday

    one 1

    two 1

    two 1

    one 1

    $

    ```


    To delete lines 1 through 3, try this:


    ```

    $ sed ''1,3 d'' tuesday

    three 1

    two 1

    one 1

    $

    ```'
