    ```


    The number of characters within the brackets can be virtually unlimited. Therefore,
    if you wanted to find all entries that start with a lowercase letter instead of
    a number (or other character), you could use "[abcdefghijklmnopqrstuvwxyz]". However,
    because this is a range, a much simpler way to signify it would be "[a-z]".


