    # Picking a Group


    When a user is a member of more than one group, his or her default group is the
    one defined by the fourth field of the /etc/passwd file. The id utility will show
    information about the user, including all the groups the user is a of:


    ```

    $ id

    uid=501(edaney) gid=100(users) groups=100(users),101(sales)

    $

    ```


    To change groups, utilize the newgrp utility and the name of the other group you
    want to make your default. Non-group members trying to become a part of the group
    have to give a password, whereas group members do not:


    ```

    $ id

    uid=501(edaney) gid=100(users) groups=100(users),101(sales)

    $ newgrp sales

    $ id

    ```'
