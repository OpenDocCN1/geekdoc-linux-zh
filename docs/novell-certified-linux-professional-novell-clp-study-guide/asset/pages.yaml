    # Background and Foreground


    When a process is started, the default is for it to run in the background. In
    the foreground, it becomes the only job the user can work on interaction is based
    upon completion of the job. For example, when a user ls -1, the display appears
    on his or her terminal, and he or she is unable to issue another command until
    ls has finished.


    To run a process in the background, simply add an ampersand (&) to the end—allows
    you to run more than one command at the same time. For example, the sleep command
    allows the process to wait a given number of seconds before anything else happens
    and can be used by itself as a means of illustration:


    ```

    $ sleep 90 &

    [5] 31168

    $

    ```


    The number that appears in the brackets is equal to the number of jobs currently
    running in the background. The number following it (31168 in this case) is the
    process ID (PID) number of this job.


    > NOTE The PID of the last job placed in the background can also be referenced
    as $!


    Placing the job in the background allows the user to continue working and starting
    other processes. If you must wait for a process to finish starting another, the
    wait command, used with the PID of the process, can cease processing until the
    specified process finishes. For example


    ```

    $ sleep 120 &

    [5] 31175

    ```'
