  md: '# Lab Exercise 11-2: Create an Entry in the hosts File


    In this exercise, you will add a fictitious entry in the /etc/hosts files.


    Complete the following steps:


    +   1. Log in as root.


    +   2. Open a command-line window, if you are not automatically taken to one.


    +   3. Change to the /etc directory:

    cd /etc


    +   4. Add a line to the end of the hosts file that gives this machine an alias
    equal to that of the loopback address:

    cat >> hosts

    127.0.0.1 willpassthisexam

    ^d


    +   5. Verify that the address resolution works by sending five pings to the new
    alias:

    ping willpassthisexam -c 5'
