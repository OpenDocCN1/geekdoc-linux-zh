    | Buildroot | This line allows you to specify a directory as the “root” for building
    and installing the new package. You can use this to help test your package before
    having it installed on your machine. |

    | %description | It’s not really a header item, but should be described with the
    rest of the header. You can use one desc tag for package and/or subprocess. This
    is a multi-line field that should be used to give a comprehensive description
    of the package. |


    The second section is the %prep section. Here are the specifications to build
    the sources are defined. The %prep section contains a series of macros available
    to assist in the compilation and setup of the package. Each of these macros is
    listed in Table 10.2.


    # TABLE 10.2 %Prep Macros


    | MACRO NAME | DESCRIPTION |

    | --- | --- |

    | %setup | This macro unpacks the sources and enters the directory tree. The -q
    option sets the name of the directory tree to the defined %name. |

    | %patch | This macro assists in applying the patches to the source. |


    Everything executed in the %setup and %patch sections, right up to the %build
    section, is executed using the shell. The %build section doesn’t really have any
    macros, but is intended for you to put in commands specifically to build the software
    after you have extracted the source, patched it, and are'
