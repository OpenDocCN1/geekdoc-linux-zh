  md: '# Programming 101


    Course Objectives Covered


    +   9. Understand the Basics of C Programming (3038)

    10. Understand the GNU Build Tool Chain (3038)

    11. Understand the Concept of Shared Libraries (3038)

    12. Perform a Standard Build Process (3038)


    Don''t let the objectives in this section fool you or scare you. This exam is
    aimed at system administrators, not developers or programmers. At the same time,
    you need to know something about the development process that you can communicate
    effectively, and that is truly where these four objectives enter the picture.


    You need to know that Linux, like Unix before it, is written mainly in C or C++,
    both of which are compiler languages. This means the applications must be compiled
    before they can run—unlike scripts, which were discussed in Chapter 6, "Shells,
    Scripting, Programming, and Compiling." The advantages of a compiler language
    that execution is fast and is possible to create add-ons as drivers. The driver
    for C used by Linux is gcc—the GNU Compiler. gcc is installed by default in SuSE,
    and most other Linux implementations.


    The GNU Build Process consists of the following steps:


    +   1. Use the configure utility to prepare a build. This is essentially the startup
    file to begin configuration for the build.

    2. Use the make utility to (compile) the source code. Depending on the size of
    the package, this could take anywhere from a few seconds to a considerable amount
    of time to complete.

    3. Use make install to actually install the compiled program. This command installs
    all the package components in their default directories.

    4. Install required packages.


    It is highly recommended that you read through the man pages for configure and
    make to familiarize yourself with their basic functionality.


    Know that a Linux distribution (any Linux distribution) has hundreds of package
    files. A package file can contain anywhere from one program file to hundreds or
    thousands of them.'
  merge: -1
  pgno: 464
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    Shared libraries are used so that applications perform common functions do not
    need to have those functions embedded within each of them.

    The shared library consists of the shared object and a header file.


    To put everything together, the following represents the steps to a standard build
    process for the `penguins` game:


    +   1. Extract the source archive: `tar xzf penguins-2.2.tar.gz`

    2. Change to the source directory: `cd penguins-2.2/`

    3. Run the configuration script: `./configure`

    4. Start the compilation: `make`

    5. Install the program: `make install`


    At the risk of redundancy, it is worth pointing out again that the administrators''
    exam does not expect you to be a programmer. You do not need to know how to code
    in C. You do, however, need to know the steps given here a standard build process.


    # Monitoring SLES


    Course Objectives Covered


    +   13. Monitor the Operating System (3038)

    14. Monitor the File System (3038)


    When everything is up and running as it should be, the challenge becomes to stay
    on top of it and proactively spot—and respond to—potential problems before they
    become real ones. This is accomplished through monitoring, and two key elements
    to monitor are the operating system and the filesystem.


    Chapter 5, "Basic Linux Administration," discussed configuring system logs and
    the `syslog daemon—syslogd`. Be sure to remember that this daemon is configured
    with the `/etc/syslog.conf` file and remember how to use the `logrotate` command.
    Not found in Chapter 5, but worth knowing, is the `lspci` utility. This tool will
    list all devices connected through the PCI bus.'
