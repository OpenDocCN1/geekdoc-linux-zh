  md: '# 83

    CHAPTER 3

    Preliminary GNU and Unix Commands


    In this section, you''ll learn about utilities used to manage a process and how
    processes are utilized for all transactions. In the previous sections, many utilities
    and commands were discussed—each time one of them is issued, a process is started
    to carry out the request, as you will see in greater detail.


    # What Is a Process


    Crucial to understanding this section is knowing that a process is any instance,
    command, or utility in execution. When you issue the command ls, as was discussed
    earlier, a process is started to run the utility and return the results.


    Even the shell which you are interacting is running as a process. When you give
    a command to be carried out, the shell will look to see if it can do without any
    outside help. (Assume the command was just an empty line: No other utilities are
    needed to return another prompt.) If your shell cannot perform the command, it
    will call another process to perform the action. The other process called is a
    child to your shell, which has become a parent to the new process.


    When the child has completed its task, it returns results to the parent, and then
    goes away. Because Linux is a multitasking operating system, there can be more
    than one child for any given parent. The child cannot perform all of the tasks
    on its own (think of compiling an annual report), the child may need to call one
    or more additional processes. If it does this, it becomes the parent to those
    child processes.


    > Barring any restrictions coded into it, every process has the ability to be
    a parent or child.


    # NOTE


    On a system, at any time, there will be processes that you are running, there
    may be processes that others are running, and there will be processes that the
    system itself is running. The latter are often daemons—services that are running
    without interaction to provide functionality to the operating system. Examples
    of services daemons can perform printing, running-scheduled jobs, sending mail,
    monitoring run state, and so forth.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Working with ps


    The ps command is key to any interaction with processes and is used to show process
    status. When run by itself (no options), ps will show the processes that you currently
    have running, with the last line always being itself (it is a running process
    as well). For example


    | PID | TTY | TIME | CMD |

    | 19605 | pts/0 | 00:00:34 | bash |

    | 30089 | pts/0 | 00:00:00 | vi |

    | 30425 | pts/0 | 00:00:00 | paste |

    | 32040 | pts/0 | 00:00:00 | cat |

    | 1183 | pts/0 | 00:00:00 | awk |

    | 30679 | pts/0 | 00:00:00 | ps |


    The first column is the process ID number—this is a unique number assigned to
    every process that executes. When the system is booted, the numbers begin incrementing
    until they reach a defined limit, then begin again through the numbering, using
    only the numbers that are free.


    The second column indicates the terminal with the user responsible for the process
    is associated. Because the list is only of processes for the user isuing the command,
    all terminal listings will be the same.


    The third column indicates the amount of processor time that the process is utilizing.
    In most cases, processes run quickly, sit idle, and so on, and utilize very little
    time. A very high time reading can indicate a process that is dragging the performance
    of the system.


    The fourth column is the name of the process (command) itself. In the first line,
    there is the user''s shell—which may be there, or there would not be a user at
    all: The user''s shell is known as the session leader. The last line is the command
    that just executed. Those entries in between are other processes that the user
    is running.


    The ps utility has a number of options to make it more flexible. The -a option
    removes obvious choices. For example, you know that you have to have a shell running
    or you would not be interacting with the system, so it isn''t really important
    to see that as others. Using the -a option, the-play shows just:


    ```

    $ ps -a

    PID TTY TIME CMD

    30089 pts/0 00:00:00 vi

    ```'
