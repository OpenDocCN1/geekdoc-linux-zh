    # Using If-Then Mentality


    The simplest logic within any operation is: if a condition exists, then perform
    an action. This can be applied to any situation, including everyday life. For
    example, if the car starts, then I can drive to the store; if the doorbell rings,
    then open the door, and so on, ad infinitum.


    Within a shell script, the syntax for this type of logic is


    ```

    if {some condition exists}

    then {perform some action}

    fi

    ```


    Notice the fi at the end of the syntax. This is if spelled backward and indicates
    the end of the list of then operations. In this sequence, indentation is purely
    arbitrary—it will not make the operations run more smoothly, but will make it
    easier for you to read. For legibility purposes only, you will often see the indentation
    looking like this:


    ```

    if {some condition exists}

    then {perform some action}

    fi

    ```'
