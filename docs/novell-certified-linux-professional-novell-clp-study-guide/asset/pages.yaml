  md: '# Novell Certified Linux Professional Study Guide


    The main file for determining what takes place at different runlevels is the /etc/inittab
    (initialization table) file. This text file is colon-delimited and divided into
    four fields. The first field is a short ID, and the second identity is the runlevel
    at which the action is to take place (blank means all). The third field is the
    action to take place, and the last field is the command to execute.


    The following file is a representative of what every inittab file looks like:


    ```

    # /etc/inittab


    # Copyright (c) 1996-2002 SuSE Linux AG, Nuenberg, Germany.


    # Author: Florian La Roche, 1996

    # Please send feedback to http://www.suse.de/feedback


    # This is the main configuration file of /sbin/init,

    # is executed by the kernel on startup. It describes what scripts are used for
    the different run-levels.


    # All scripts for runlevel changes are in /etc/init.d/.


    # This file may be modified by SuSEconfig unless CHECK_INITTAB

    # in /etc/sysconfig/suseconfig is set to "no"


    # The default runlevel is defined here

    id:5:initdefault:


    # First script to be executed, if booting in emergency (-b) mode

    sii::bootwait:/etc/init.d/boot


    # /etc/init.d/rc takes care of runlevel handling


    # runlevel 0 is System halt (Do not use this for

    --initdefault!)


    # runlevel 1 is Single user mode

    # runlevel 2 is Local multiuser without remote network (e.g.

    --NFS)


    # runlevel 3 is Full multiuser with network

    # runlevel 4 is Not used

    # runlevel 5 is Full multiuser with network and xdm

    # runlevel 6 is System reboot (Do not use this for

    --initdefault!)

    ```'
