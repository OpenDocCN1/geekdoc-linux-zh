    discussed later in this chapter, in the section "Working with vi."


    +   - When you press the Enter key, the shell scans the command line and determines
    what elements it has been looking for-space. It then replaces wildcards with any
    relevant filenames. Following that, it strips all quotes and substitutes variables.
    Lastly, it substitutes any embedded commands and then executes the entry.


    +   - The test utility can be used in conjunction with $ to test almost anything.
    For example, to see if a file exists and is readable, use this combination:


    ```

    test -r snapshot01.gif

