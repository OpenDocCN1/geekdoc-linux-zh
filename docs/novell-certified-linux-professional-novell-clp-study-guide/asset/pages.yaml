    Line 5 identifies the partition to boot from, and line 6 specifies the boot sector.
    Lines 8 through 12 identify the default as linux, and the prompt and timeout both
    have values of 50 deciseconds: You must press Shift or another key within this
    time period or LILO begins loading the default. Line 13 specifies the name of
