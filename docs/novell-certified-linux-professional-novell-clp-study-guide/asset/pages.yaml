    # Modifying Groups


    After groups have been created, you can modify their entries by manually editing
    the files, using gpasswd, and the groupmod utility. This tool allows you to change
    values (name and GID) associated with the group. The parameters that can be used
    with groupmod include


    +   -g to specify a new GID

    -n to change the name of the group to a new text value

    -o to allow a duplicate group ID number to be used

    -p to specify a password

    -A to add a user to the group

    -R to remove a user from the group


    For example


    ```

    $ tail -1 /etc/group

    sales:x:101:edulaney,krist,kerby

    $ groupmod -g 105 sales

    $ tail -1 /etc/group

    sales:x:105:edulaney,krist,kerby

    $ groupmod -n business sales

    $ tail -1 /etc/group

    business:x:105:edulaney,krist,kerby

    $

    ```


    When groups are no longer needed, they can be deleted by manually removing the
    lines from the files, or by using the groupdel command. The utility cannot be
    used if any user has the group as his default group, and it only removes the entry
    from /etc/group.'
