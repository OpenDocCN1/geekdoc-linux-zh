  md: "The example of adding one value to a variable in this method becomes\n\n```\n\
    $ typeset -i x=7\n$ echo $x\n7\n$ let x=\"$x+5\"\n$ echo $x\n12\n$ \n```\n\nThe\
    \ following is an example of a script file that will accept a number\ninput and\
    \ on the command line and then increment to that number by:\n\n```\n$ cat incrmnt\n\
    !/bin/bash\ntypeset -i x y=1\nx=$1\nuntil [ \"$y\" -gt \"$x\" ]\ndo\necho $y\n\
    let y=\"$y+1\"\ndone\n$ incrmnt 7\n1\n2\n3\n4\n5\n6\n7\n$\n```\n\nNotice that\
    \ the incrementing continues until the variable beginning with\none exceeds the\
    \ value given by the user. Notice, as well, that the increment-\ning occurs after\
    \ the echo statement to make certain the last number echoed\nis the one equaling\
    \ that given by the user."
