  md: '# Working with ls


    The ability to list files and directories is one of the most essential to any
    operating system, and the ls utility performs this function for Linux. When given
    by itself it lists the names of files and directories beneath the current directory
    in a column-style format. Entries are always—by default—in alphabetical order
    and there is nothing to differentiate names of directories from names of files.
    An example would be


    ```

    Desktop emmett filethree junk2 questions

    TestPro errors filetwo mischief sample

    brio example Friday myfile sample of the world

    dulaney example2 garbage numbers simplesimon

    eRRors fileone junk1 pull snapshot01.gif

    ```


    The listings are always in alphabetical order by default, with all uppercase entries
    coming before lowercase entries.


    There are a slew of options that can be used with this command, and the most used
    is -F, which will indicate what type of entry is being displayed:


    ```

    Desktop emmett filethree junk2 questions

    TestPro errors filetwo mischief* sample

    brio example Friday myfile sample of the world

    dulaney example2 garbage numbers simplesimon

    eRRors fileone junk1 pull snapshot01.gif

    ```


    Entries without any trailing characters are standard files. Entries with a "/”—such
    as Desktop–are directories. Entries with a trailing asterisk (*) are escaped.
    Symbolic links are signified by an at (@) symbol.


    Another useful option is -a, which will show all files. By default, hidden files
    are not displayed by ls. A hidden file that has a period (.) as its first character:


    ```

    . Desktop emmett filethree junk2 questions

    TestPro errors filetwo mischief sample

    .bash_history brio example Friday myfile sample

    →of the world

    .bash_logout dulaney example2 garbage numbers

    →simplesimon.file.swp eRRors

    fileone junk1 pull snapshot01.gif

    ```'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    > NOTE

    Periods can appear anywhere within a filename and appear as many times as you
    want. The only time they have any special significance is when they are the very
