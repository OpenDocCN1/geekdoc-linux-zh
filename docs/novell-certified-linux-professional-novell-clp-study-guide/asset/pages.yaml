  md: '# 361

    CHAPTER 11


    +   /etc/sysconfig/network/routes—This file is the configuration file used to
    hold routing information.


    The following are the utilities to know for this, and system administration in
    general:


    +   arp-ARP, as a utility, can be used to see the entries in the Address Resolution
    table, which maps network card addresses (MAC addresses) to IP addresses. You
    can check to see if the IP addresses you believe should be in the table are and
    if they are mapped to the computers they use. Usually, you do not know the MAC
    addresses of the hosts on your network. However, if you cannot contact a host,
    or if a connection is made to an unexpected host, you can check this with the
    ARP command to begin isolating host is actually assigned an IP address.


    +   dig—This works with DNS (discussed in this chapter) and looks up entries by
    DNS name servers. Following is an example of the output generated by the dig utility
    without any parameters:

    ;; DIG 9.2.3 <<>

