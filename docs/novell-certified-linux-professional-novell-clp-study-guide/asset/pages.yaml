  md: '# Novell Certified Linux Professional Study Guide


    5 * * * /home/edulaney/example


    > NOTE

    This exits the editor.


    This sets the shell script (which logs an entry to /var/log/messages) to run every
    five minutes after the hour, regardless of the hour (*), the day of the month
    (*), the month (*), or of the day of the week (*). Within each of the fields,
    the asterisk means all, and the following list shows other possible parameters:


    +   - A number means only when there is a match (such as the 5 in the example).

    - A hyphen can indicate an inclusive range of numbers, for example 1-10.

    - A comma can separate numbers, for example: 1,10.


    Some examples of specifications are shown in Table 13.5.


    TABLE 13.5 Examples of cron Entries

    | SYNTAX | RESULT |

    | --- | --- |

    | 1 12 * * * | 12:01 every day of the year |

    | 15 18 1 * * | 6:15 in the evening on the first day of each month |

    | 1,16,31,46 * * * | Every 15 minutes |

    | 30 0,12 * * * * | 12:30 in the morning and afternoon |

    | 20 10 31 10 * | Only on October 31st at 10:20 |

    | 6 * * * 1-5 | At 6:01 every weekday morning


    The cron daemon, started by init, wakes up every minute to look for jobs that
    are set to execute. The jobs are held in the spooler (/var/spool/cron), and come
    from the user crontabs or /etc/crontab. The at jobs are executed by the at daemon
    (atd) on most systems (on others, atrun is started routinely by the cron daemon
    to look for at jobs.'
