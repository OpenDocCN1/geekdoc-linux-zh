    As you see in the sample spec file, there is a common structure to the RPM header.
    The sections are explained in Table 10.1.


    | SECTION | DESCRIPTION |

    | --- | --- |

    | Summary | This is a one-line description of the package. |

    | Name | This must be the name string from the rpm filename plan to use. |

    | Version | This must be the version string from the rpm filename plan to use.
    |

    | Release | This is the release number for a package of the same version. |'
