  md: '# Novell Certified Linux Professional Study Guide


    reads the /etc/syslog.conf file to see what to monitor. Very descriptive in

    nature, each line contains the item you want to monitor followed by a

    period () and the priority, whitespace, and the location of the log file.


    You can use a comma (,) to separate multiple entries. You can also use a

    sicolon;) to denote exceptions to the rule. This is the required syntax:

    item.priority;exceptions log_file


    # NOTE


    The syslog daemon reads the syslog.conf file by default. You can, however,

    modify the startup files that syslogd starts with the -f option, allowing you

    to use another configuration file in place of /etc/syslog.conf.


