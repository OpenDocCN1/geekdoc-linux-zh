  md: '# Using Local Documentation


    Course Objectives Covered


    +   1. Accessing and Using man Pages (3036)

    2. Using info Pages (3036)

    3. Accessing Release Notes and White Papers (3036)

    4. Using GUI-based Help in the Linux System (3036)


    A number of methods are available in all implementations of Linux for helping
    on the operation of utilities. Additionally, many vendors add their own documentation
    and/or utilities for simplifying the process. In this section, we will look at
    these common utilities:


    +   * man

    * --help

    * info


    # The man Utility


    The man (as man) utility dates back to the early days of Unix. Using whatever
    page utility is defined in the user''s environmental variables for PAGER, it displays
    document found beneath the subdirectories included in the MANPATH variable. The
    PAGER variable is usually equal to less on SuSE, but can also be to more. The
    MANPATH variable includes /usr/share/man, /usr/local/man, /usr/X11/man, and /opt/gnome/share/man,
    but can include others as well.


    Although there are a number of directories beneath /usr/share/man, the main ones—and
    their purpose—include the directories listed in Table 13.1.


    Table 13.1 Subdirectories of /usr/share/man

    | SUBDIRECTORY | DESCRIPTIONS CONTAINED WITHIN |

    |--- | --- |

    | man1 | Shell utilities/user commands |

    | man2 | System calls |

    | man3 | libc calls |

    | man4 | /dev descriptions |

    | man5 | /etc and other configurable files (such as protocols) |'
  merge: -1
  pgno: 443
- img_proc: true
  md: '# Table 13.1 Continued


    | SUBDIRECTORY | DESCRIPTIONS CONTAINED WITHIN |

    | man6 | Games |

    | man7 | Linux system files, conventions, and so on |

    | man8 | Root user/system administration utilities |


    When you enter the command to display a manual page (man), these subdirectories
    are searched until the first match is found. For example, if you entered the following
    command


    man nice


    The directories would be searched until the first match of a manual page describing
    nice is found. When the manual page is found, it is displayed using the utility
    specified by the pager variable. An example of the output follows (line numbering
