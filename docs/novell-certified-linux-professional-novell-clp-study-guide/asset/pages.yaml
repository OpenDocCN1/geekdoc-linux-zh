    +   - compress (and its counterpart, uncompress).


    # Adding a Mirror


    Course Objective Covered


    16. Mirror Directories with rsync (2038)


    Although you should never underestimate the need for backups, there is one problem
    with them—they require restoring in order to be accessible. In other words, they
    is an offline method of providing data security, but it could take a while to
    regain file access after a hard drive crash.


    Another way to provide data security is to implement redundancy. By having your
    data online and in more than one location, you can immediately access it at another
    location host should something happen to this one.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    SLES 9 allows you to mirror complete directories from one computer to another
    with the rsync utility. This utility will compare data at the source with any
    already existing at the target and copy only the new or changed data—greatly reducing
    the amount of time it takes to complete the mirroring.


    # NOTE


    The rsync utility can be used to copy directories locally as well as across the
    network. When using it locally, you simply state what you want to copy and where.
    The problem with this is that the data still resides locally and there is no true
    redundancy back upon if the host crashes.

    Where rsync is truly useful in copying the directories from one host to another,
    and that thus is the focus.


    The syntax for the utility is

    rsync {options} {source} {target}


    There are many options that can be used, but the primary ones are

    * -a—To recursively get subdirectories beneath the directory specified and preserve
    the tree

    * -b—For backup copying

    * -e—To run a remote shell

    * -p—Set the permissions on the new files as they were on the old

    * -r—To recursively get directories and subdirectories

    * -R—Use relative paths

    * -u—To update only the changed files

    * -v—Work in verbose mode

    * -x—Do not follow symbolic links to other filesystems

    * -z—Compress the data during transfer


    Connect to remote systems, ssh—the secure shell—can be used to provide security.
    Documentation for the rsync utility can be found at http://samba.anu.edu.au/rsync/,
    and examples of usage can be found at site as well as in the man pages.


    # NOTE


    In earlier implementations of Linux, the functionality of rsync was provided by
    the rcp utility.'
