    # ## DNS Structure


    The hierarchical name system is assembled in a tree-type structure that very closely
    resembles a directory structure, like one we would find in eDirectory, NDS, AD,
    or LDAP. To use an analogy, you can have a file called WARRANTY.DOC in C:\\ and
    another file called WARRANTY.DOC in C:\DOCS\REFRIGERATOR. With a non-tree structure,
    you would be able to have one file by name, whereas the tree structure allows
    you to have multiples and interpret each one as existing on its own. In a network
    using DNS, you can have more than one server with the same name, as long as each
    is located in a different path.


    Resolution is done through the use of a combination of domains and names into
    Fully Qualified Domain Names—FQDNs. The domain can be of several possibilities,
    the most common of which are


    +   - com—Commercial enterprise

    - edu—Educational institution'
