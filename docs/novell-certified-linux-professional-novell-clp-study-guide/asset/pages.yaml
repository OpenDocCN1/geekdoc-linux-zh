    it he or she wants to configure. The second menu opens so that the administrator
    can make configuration choices.


    The make command has another argument. You can also start the configuration process
    with the command make oldconfig, which instructs make to use the previously defined
    configuration. The previously defined configuration is stored in /usr/src/linux/.config.


    The top-level dependency information to build the kernel is stored in /usr/src/linux/.depend.
    If neither of these files exists, you must use one of the previously described
    methods to generate one. The dependency file is created during the kernel build
    process.


    # Building the Kernel


    With the configuration completed through make config, make oldconfig, make menuconfig,
    or make xconfig, you can now proceed to actually build the kernel and associated
    modules. When the kernel scripts are finished, they tell you to create the dependencies
    using the command dep.


    During this process, the dependencies for the kernel code and associated modules
    are determined. This information is saved for the actual build process. This process
    does not in itself take very long.


    When the compile finishes, you have built the kernel. This results in a kernel
    image located in /usr/src/linux and called vmlinux. However, you should create
    a compressed kernel image or a compressed disk image. The compressed kernel image,
    or zImage, is unused at system boot and automatically uncompressed. You create
    this image using the command make'
