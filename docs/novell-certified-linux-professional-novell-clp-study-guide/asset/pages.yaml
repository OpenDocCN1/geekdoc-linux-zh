  md: '# Novell Certified Linux - Professional Study Guide


    9.3

    The spooler holds files for the print job.


    ![](img/38aae1e03db8863dab67582599f6fc83_289_0.png)


    # # Moving Up to CUPS


    In newer implementations, including SuSE, CUPS (Common Unix Printing System) replaces
    much of the functionality of lpr/lpd. From an operations standpoint, however there
    is great simplicity:


    +   1. The user submits the print job.

    2. The file is spooled—in this case beneath /var/spool/cups/.

    3. The cupsd daemon formats the data in the spool and sends it to the printer.

    4. When the job is done printing, the daemon removes the files from the queue.


    The /etc/cups/cupsd.conf file (or /etc/cups/cupsd.y2 sample file) contains an
    enormous amount of narrative and comments that fully explain how to configure
    cups. Although space does not allow printing the file in entirety, it is highly
    recommended that you carefully walk through the file on your system and make sure
    you understand the options available.


    The /etc/init.d/cups stop command is used to stop the service, and the /etc/init.d/cups
    start command is used to manually start it (once configured, it should start automatically
    at boot using the startup script /etc/init.d/cups).'
  merge: -1
  pgno: 289
- img_proc: true
  md: '275


    Managing Printing CHAPTER 9


    # # Formatting a File


    When discussing printing options, one utility to be aware of is valuable for formatting
    is pr. The primary purpose of this utility (/usr/bin/pr) is always to convert
    the contents of a text file before sending the output to a printer.


    The output includes a default header with date and time of last modification,
    filename, and page numbers. The default header can be overwritten with the -n
    option and the -l option allows you to specify the number of lines to include
    on each page—with the default being 66. Default page width is 72 characters, but
    a different value can be specified with the -w option. The -d option can be used
    to double-space the output, and -m can be used to print numerous files in column
    format.


    # # Installing a Printer


    Course Objectives Covered


    +   1. Installing a Printer in the Linux System (3036)


    +   2. Configure and Manage Network Printing Services (3037)


    > NOTE Before installing any printer, you should verify that it is supported in
    Linux by checking the printer database at http://www.linuxprinting.org/ and the
    SuSE Enterprise Server printer database at http://hardwiredb.suse.de/.


    As with everything in Linux, there are a number of different ways to install a
    printer. The earliest printer to install is one connected locally, via YaST. After
    connecting the printer, start YaST (you may be prompted for the root password),
    and then choose Hardware, Printer. A scan of the current environment will occur,
    as shown in 9.4.


    The printer should be autodetected, as shown in Figure 9.5.'
