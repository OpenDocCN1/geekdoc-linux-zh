    screen interface. curses is a language that allows you to graphically manipulate
    the screen and make items such as menus. The command make menuconfig will create
    the curses program to provide a menu interface. Using either the X Window or curses
    interfaces has clear advantages—if you make a mistake it is very easy to go back
    and correct it.


