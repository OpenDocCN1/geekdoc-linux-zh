  md: '# Building RPMs


    With the basics of rpm handling covered, let''s turn to a discussion of constructing
    a simple package.


    Building the RPM isn''t hard, but it is best if you can get the source to build
    on your own. We are going to look at our wumpus tarball and build an RPM package
    with it.


    To build the RPM, you need to perform the following steps:


    +   1. Get the source code you are building the RPM for to build on your system.

    2. Make a patch of any changes you had to make to the sources to build them properly.

    3. Make a spec file for the package.

    4. Make sure everything is in its proper place.

    5. Build the package using RPM.


    RPM requires the construction of a spec file, which includes information regarding
    the package, along with information on how to build it and a file list for all
    the binaries that are installed. The spec file is named according to a defined
    specification:


    Package name — version number — release number . spec


    That would be wumpus-1.3-A.spec for our wumpus allows multiple versions of the
    spec package—at least the .spec file remains intact. Here is a sample spec file:


    ```

    $ *.spec

    summary: Hunt the wumpus

    Name: wumpus

    Version: 1.3

    Release: A

    Copyright: GPL

    Group: Amusement/Games

    Source: /a-URL-pointing-to-the-source

    Patch:

    Buildroot: /var/tmp/%name-buildroot

    ```


    %description

    This is a true implementation of the classic mainframe computer

    game, wumpus.'
  merge: -1
  pgno: 325
- img_proc: true
