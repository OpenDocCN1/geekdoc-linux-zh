  md: '# Novell Certified Linux Professional Study Guide


    All the hidden files are used for processing (setting up variables, environment,
    and so on) with the various shells.


    There are a number of options that can be used with useradd to override default
    settings, and they include the following:


    +   - c to specify the free text (fifth field of passwd) associated with the user.
    Most Linux implementations default to an empty entry here or a variation of their
    name.


    # Switching Between passwd and shadow


    In the manual example for creating a new user, the encrypted password appears
    in the /etc/passwd file and not the /etc/shadow file. If you want to do manual
    additions, and still use /etc/shadow, the pwconv utility can be irreplaceable.
    This utility reads the entry passwd file and converts entries into shadow file
    entries.


    The opposite of pwconv is pwconv, which takes entries from the shadow file and
    places them in the appropriate format in the passwd file. As a final step, pwconv
    removes the shadow file completely.


    # The su utility


    The entries in the passwd file represent valid accounts that can log in. Any user
    can sit at the system and give the correct username and password combination to
    log as that. Any user logged in can also use the su utility to change identity
    to another user if they know the other''s password. This creates a subshell, if
    you will, where one user becomes another, and can revert to his own identity by
    typing exit.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Basic Linux Administration


    # CHAPTER 5


    Although there are dozens of harmful reasons why a user might want to become another,
    there are also very legitimate reasons as well. If su is given without a name
    following it, it tries to make the user the superuser (root), needing the password
    for that account. Therefore, as an administrator, it is possible for you to log
    in as a typical user without root permissions and begin your day. The lack of
    root permissions can be a blessing as it can keep you from deleting entries you
    unintentionally typed, and so on. When a user comes up with a problem, you can
    use su to become root—with all rights and privileges as if you had logged in as
    such—fix the user’s problem, and then exit back to your regular account again.


    # Managing User Accounts


    After an account has been created, you can manage and modify manually or through
    the use of utilities. For example, if a user named Karen Daney marries, and her
    names Karen Brooks, you can edit the passwd and shadow files and change the first
    field of each from kdulaney to kbooks. The same UID is in place, all files and
    those associated with her continue to remain so. The home directory can be renamed,
    and home directory and username match for administrative purposes.


    As another example, if Karen gets promoted to administration, it may be necessary
    to remove her from the users group and place her in the root group. This can also
    be accomplished by manually editing the /etc/passwd file and changing the GID
    field. Similar examples can be given, endlessly, for each field within the files.


    > The utility used by su or the root user. Typical users will get an error message
    when they attempt to use it.


    Just useradd is intended to simplify the addition of users to the system—and avoid
    manual entries—usermod is meant to simplify changing existing values. Options/flags
    must be used with the utility, and these are the possibilities:


    +   - c to replace the descriptive text with a new value.

    - d to alter the home directory.

    - e to change the password expiration date.

    - f to set the inactive parameter.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    +   - G to change secondary group membership. More than one group

    be given as long as commas separate entries.


    +   - g to change the GID.


    +   - -1 to change the login name.


    +   - m (must be used with -d) to make the new home directory.


    +   - p to change the password.


    +   -s for a different shell.


    +   -u to change the UID.


    Aside from the text description, most of the values require the user to not be

    logged in when the change is made. Here''s an example of a change:


    ```

    $ grep krest /etc/passwd

    kristin:petkv.flWG/Ig:506:kristin:/home/kristin:/bin/bash

    $ usermod -l kristin

    $ grep krest /etc/passwd

    kristin:petkv.flWG/Ig:506:kristin:/home/kristin:/bin/bash

    $ ls -1 /home

    drwxr-xr-x 4 evan      users 1024 Jul 6 11:16 evan

    drwxr-xr-x 4 kristin users 1024 Aug 8 10:29 kristin

    drwxr-xr-x 4 spencer users 1024 Jul 6 11:16 spencer

    $ usermod -d /home/kristin -m kristin

    $ ls -1 /home

    drwxr-xr-x 4 evan      users 1024 Jul 6 11:16 evan

    drwxr-xr-x 4 kristin users 1024 Aug 8 10:29 kristin

    drwxr-xr-x 4 spencer users 1024 Jul 6 11:16 spencer

    $ grep krest /etc/passwd

    kristin:petkv.flWG/Ig:506:kristin:/home/kristin:/bin/bash

    ```


    The usermod utility has the -p option to allow for the changing of pass-

    words, but that can be accomplished more commonly with the passwd utili-

    disc earlier. The standalone utility is safer in that it requires you

    to enter the value twice, and thus prevent entering a value that is off by

    one character from what you were thinking (preventing you from logging

    in).


    If there are a large number of passwords that need to be changed (system

    break-in), you can do a batch change with the passwd utility. To use

    it, create a text file with one entry per line. Each line consists of the user-

    name and new password, separated by a colon. For example'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Basic Linux Administration CHAPTER 5


    ```

    $ cat > changes

    kristen:spea23ker

    evan:pho78ne

    kdulaney:fla98sh

    {Ctrl+D}

    $ chpasswd < changes

    $

    ```


    The passwords are in clear text, and for that reason, you will want to remove
    the batch file from your system as soon as possible. An alternative is to use
    encrypted passwords and use the -e option with chpassword.


    > NOTE It is a good idea to encourage users to use good passwords. Good passwords
    consist of at least six characters, which are a mix of letters, characters, and
    numbers and would not be easily guessed.


    # Removing Users


    When a user account is no longer needed, there are a number of ways you can deal
    with the situation. The first question you have to address is why the account
    is no longer needed. When you know that, you can formulate a plan for dealing
    with it. Table 5.2 offers some scenarios and methods of proceeding.


    # Solutions for Unneeded User Accounts


    | PERCEIVED REASON FOR NOT NEEDING ACCOUNT | PROPOSED SOLUTION |

    |---|---|n| User has been temporarily transferred to Siberia | If it is a temporary
    situation, you do not delete the account—doing so will remove all references that
    may be needed later. To temporarily disable the account, edit the /etc/passwd
    file and place a pound sign (#) at the beginning of the line. This will make the
    entire line a comment and disable the account. |

    | User''s password has been jeopardized by a hacker | Change the password to another
    value to keep the other party out. For further security, rename the login name
    and home directory. |'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'Novell Certified Linux Professional Study Guide


    # Table 5.2 Continued


    | PERCEIVED REASON FOR NOT NEEDING ACCOUNT | PROPOSED SOLUTION |

    | User has left the organization | Remove the account from /etc/passwd and /etc/shadow
    and delete the home directory. |


    The userdel utility can also be used to remove the user from system files (passwd
    and shadow), but you must still remove any files associated with them.


    # Working with Groups


