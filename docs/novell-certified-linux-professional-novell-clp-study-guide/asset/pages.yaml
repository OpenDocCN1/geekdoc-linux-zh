    The line id:5:initdefault: is of great importance, as it identifies

    def runlevel system will initially attempt to go to each boot.

    The lines identify that at each runlevel, the shell script rc

    (beneath /etc/rc.d) is to run—using a different variable for each level.

    This script loops for scripts within subdirectories of /etc/rc.d based on

    runlevel: or for example, there are /etc/rc.d/rc0,/etc/rc.d/rc1,

    so on. Within these subdirectories are script files that start with either

    a "S" or a "K". Scripts that start with "K" identifies processes/daemons

    must be killed when changing to this runlevel, and scripts starting with "S"

    identify processes/daemons that must be started when changing to this run-

    level.


    The line ca:ctrlalt:sbin/shutdown -r +4 defines what has-

