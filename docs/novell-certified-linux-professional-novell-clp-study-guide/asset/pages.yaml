    # # TCP/IP Background


    Course Objectives Covered


    +   1. Introduction to Network-Related Command Line Commands (3036)

    10. Understand the Linux Network Terms (3038)


    The Transmission Control Protocol/Internet Protocol (TCP/IP) is an industry-standard
    suite of protocols designed to be routable and efficient. TCP/IP was originally
    designed as a set of wide area network (WAN) protocols for the purpose of maintaining
    communication links and data transfer between sites in the event of an atomic/nuclear
    war. Since those early days, development of the protocols has passed from the
    hands of the government and has been the responsibility of the Internet community
    for some time.


    The evolution of these protocols from a small four-site project into the foundation
    of the worldwide Internet has been extraordinary. But despite more than 25 years
    of work and numerous modifications to the protocol suite, the inherent spirit
    of the original specifications is still intact. TCP/IP has the following advantages
    over other protocols:


    +   An industry-standard protocol. TCP/IP is not maintained or written by one
    company, it is not proprietary or subject to many compatibility issues. The Internet
    community as whole decides whether a particular change or implementation is worthwhile.


    +   A set of utilities for connecting dissimilar operating systems. Many connectivity
    utilities have been written for the TCP/IP suite, including the File Transfer
    Protocol (FTP) and Terminal Emulation Protocol (Telnet).


    +   A scalable, cross-platform client/server architecture. Consider what happened
    during the initial development of the TCP/IP protocol suite. Vendors wanted to
    be able to write their own client/server applications, for instance, SQL Server
    and Simple Network Management Protocol (SNMP). The specification for how to write
    applications was also up for public perusal. Which operating'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# CHAPTER 11


    systems would be included? Users everywhere wanted to be able to take advantage
    of the connectivity options promised through utilizing TCP/IP, regardless of the
    operating system they were currently running.


    +   - Access to the Internet. TCP/IP is the de facto protocol of the Internet
    and allows access to a wealth of information that can be found at thousands of
    locations around the world. To connect to the Internet, though, a valid IP address
    is required.


    # The Four Layers of TCP/IP


    TCP/IP maps to a four-layer architectural model. This model is called the Internet
    Protocol Suite and is broken into the Network Interface, Internet, Transport,
    and Application layers. Each of these layers corresponds to one or more layers
    of the OSI model, which predates. The Network Interface layer corresponds to the
    Physical and Data Link layers. The Internet layer corresponds to the Network layer.
    The Transport layer corresponds to the Transport layer, and the Application layer
    corresponds to the Session, Presentation, and Application layers of the OSI model.


    Each of the four layers of the model is responsible for all the activities of
    the layers to which it maps.


    The Network Interface layer is responsible for communicating directly with the
    network. It must understand the network architecture being used, such as token-ring
    or Ethernet, and provide an interface allowing the Internet layer to communicate
    with it. The Internet layer is responsible for communicating directly with the
    Network Interface layer.


    The Internet layer is primarily concerned with the routing and delivery of packets
    through the Internet Protocol (IP). All the protocols in the Transport layer use
    IP to send data. The Internet Protocol includes rules for how to address and direct
    packets, fragment and reassemble packets, provide security information, and identify
    the type of service being used. However, because IP is not a connection-based
    protocol, it does not guarantee that packets transmitted onto the wire will not
    be lost, damaged, duplicated, or out of order. This is the responsibility of higher
    layers of the networking model, such as the Transport layer or the Application
    layer. Other protocols that exist in the Internet layer are the Internet Control
    Message Protocol (ICMP), Internet Group Management Protocol (IGMP), and the Address
    Resolution Protocol (ARP).'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    The Transport layer maps to the Transport layer of OSI and is responsible for
    providing communication between machines for applications. This communication
    can be connection-based or non-connection-based. The primary difference between
    these two types of communications is whether there is a mechanism for tracking
    data and guaranteeing the delivery of the data to its destination. Transmission
    Control Protocol (TCP) is the protocol used for connection-based communication
    between machines providing reliable data transfer. User Datagram Protocol (UDP)
    is used for non-based communication with no guarantee of delivery.


    The Application layer of the Internet Protocol Suite is responsible for all the
    activities that occur in the Session, Presentation, and Application layers of
    the OSI model. Numerous protocols have been written for use in this layer, including
    Simple Network Management Protocol (SNMP), File Transfer Protocol (FTP), Simple
    Mail Transfer Protocol (SMTP), as well as many others.


    The interface between each of these layers is written to have the capability to
    pass information from one layer to the other.


    The interface between the Network Interface layer and the Internet layer does
    not pass a great deal of information, although it must follow certain rules. Namely,
    it must listen to all broadcasts and send the rest of the data in the frame up
    to the Internet layer for processing, and if it receives frames that do not have
    an IP frame type, they must be silently discarded.


    The interface between the Internet layer and the Transport layer must be able
    to provide each layer full access to such information as the source and destination
    addresses, whether TCP or UDP should be utilized in the transport of data, and
    all other available mechanisms for IP Rules and specifics for the Transport layer
    giving the Transport layer the capability to change these parameters or to pass
    parameters it receives from the Application layer down to the Internet layer.
    The most important thing to remember about all of these boundary layers is that
    they must use the agreed-upon rules for passing information from one layer to
    the other.


    # Primary Protocols


    Six primary protocols are associated with TCP/IP:


    +   - Transmission Control Protocol (TCP)

    - User Datagram Protocol (UDP)'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Networking Fundamentals CHAPTER 11


    +   - Internet Protocol (IP)


    +   - Internet Control Message Protocol (ICMP)


    +   - Address Resolution Protocol (ARP)


    +   - Internet Group Management Protocol (IGMP)


    # Transmission Control Protocol


    The first protocol that lives in the Transport layer is the Transmission Control
    Protocol (TCP). This protocol is a connection-based protocol and requires the
    establishment of a session before data is transmitted between two machines. TCP
    packets are delivered to sockets or ports. Because TCP uses a connection between
    two machines, it is designed to verify that all packets by a machine are received
    on the other end. If, for some reason, packets are lost, the sending machine resends
    the data. Because a session must be established and delivery of packets is guaranteed,
    there is additional overhead involved with using TCP to transmit packets.


    The TCP is a connection-based protocol that requires a connection, or session,
    between two machines before data is transferred. TCP exists in the Transport layer,
    between the Application layer and the IP layer, providing a reliable and guaranteed
    delivery mechanism to a destination machine. Connection-based protocols guarantee
    the delivery of packets by tracking the transmission and receipt of individual
    packets during communication. A session is able to track the progress of individual
    packets by monitoring when a packet is sent, in what order it was sent, and by
    notifying the sender it is received so that it can send more.


    After the TCP session has been created, the machines begin to communicate just
    as people do during a phone call. In the example of the telephone, if the caller
    uses a cellular phone and some of the transmission is sent, the user indicates
    she did not receive the message by saying "What did you say? I didn''t hear that."
    This indicates to the sender that he needs to resend the data.


    During the initialization of a TCP session, often called the "three-way handshake,"
    both machines agree on the best method to track how much data is to be sent at
    any time, and when the connection is no longer necessary because all data has
    been transmitted and received. It is only after this session is created that data
    transmission begins. To provide reliable delivery, TCP places packets in order
    and requires acknowledgments that these packets reached their destination before
    it sends new data. TCP is typically used for'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# 348


    Novell Certified Linux Professional Study Guide


    transferring large amounts of data, or when the application requires acknowledgment
    that data has been received. Given all the additional overhead information that
    TCP needs to keep track of, the format of a TCP packet can be somewhat complex.


    TCP uses the concept of sliding windows for transferring data between machines.
    Sliding windows are often referred to in the Linux\Unix environment as streams.
    Each machine has a both send and a receive window that it utilizes to buffer data
    and make the communication process more efficient. A window represents the subset
    of data that is currently being sent to a destination machine, and is also the
    amount of data that is being received by the destination machine. At first this
    is redundant, but it really isn''t. Not all data that is sent is guaranteed to
    be received, so the packets must keep track of both machines. A sliding window
    allows a sending machine to send the window data in a stream without having to
    wait for an acknowledgment for every single packet.


    # User Datagram Protocol


    The second protocol that lives in the Transport layer is the User Datagram Protocol,
    or UDP. This protocol is a non-connection–based protocol and does not require
    a session to be established between two machines before data is transmitted. UDP
    packets are still delivered to sockets or ports, just as they are in TCP. But
    UDP does not create a session between machines, it cannot guarantee that packets
    are delivered or that they are delivered in order or retransmitted if the packets
    are lost. Given the unreliability of this protocol, some may wonder why a protocol
    such as UDP was developed.


    Sending a UDP datagram has very little overhead involved. A UDP datagram has no
    synchronization parameters or priority options. All that exists is the source
    port, destination port, the length of the data, a checksum for verifying the header,
    and then the data.


    There are actually a number of good reasons to have a transport protocol that
    does not require a session to be established. For one, very little overead is
    associated with UDP, as having to keep track of sequence numbers, Retransmit Timers,
    Delayed Acknowledgment Timers, and retransmission of packets. UDP is quick and
    extremely streamlined functionally; it''s not just guaranteed. This makes UDP
    perfect for communications that involve broadcasts, general announcements to the
    network, or real-time data.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# 349

    Networking Fundamentals

    CHAPTER 11


    Another really good use for UDP is in streaming video and streaming audio.

    Not only does the guaranteed delivery of packets enable more data to be transmitted
    (because a broadcast has little to no overhead), but also the retransmission of
    a packet is pointless, anyway. In the case of a streaming broadcast, users are
    more concerned with what''s coming next than with trying to recover a packet or
    two that may not have made. Compare it to listening to a music CD and a piece
    of dust stuck in one of the little grooves. In the case, the omission is imperceptible;
    your ear barely notices and your brain probably fills in the gap for you anyway.
    Imagine that your CD player decides to guarantee the delivery of that one piece
    of data that it can''t quite get, and ends up skipping and skipping indefinitely.
    It can deftly ruin the listening experience. It is easier to deal with occasional
    packet dropping out to have as fulfilling a listening experience as possible.
    Thankfully, UDP was developed for applications to utilize in this very same fashion.


    # Internet Protocol


    A number of protocols are found in the Internet layer, including the most important
    protocol in the entire suite, the Internet Protocol (IP). The reason that this
    is probably the most important protocol is that the Transport layer cannot communicate
    at all without communicating IP in the Internet layer.


    The most fundamental element of the IP is the address space it uses. Each machine
    on a network is given a unique 32-bit address called an Internet address or IP
    address. Addresses are divided into five categories, called classes, that are
    discussed later in this chapter.


    IP receives information in the form of packets from the Transport layer, from
    either TCP or UDP, and sends out data in what are commonly referred to as datagrams.
    The size of a datagram is dependent upon the type of network that is being used,
    such as token-ring or Ethernet. If a packet has too much data to be transmitted
    in one datagram, it is broken into pieces and several datagrams. Each of these
    datagrams has then to be reassembled by TCP or UDP.


    # Internet Control Message Protocol


    Internet Control Message Protocol (ICMP) is part of the Internet layer and is
    responsible for reporting errors and messages regarding the delivery of IP datagrams.
    It can also send "source quench" and other self-tuning signals during the transfer
    of data between two machines without the intervention of the user. These signals
    are designed to fine-tune and optimize the transfer'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    of data automatically. ICMP is the protocol that warns you when a destination
    host is unreachable, or how long it took to get to a destination host.


    ICMP messages can be broken down into two basic categories: the reporting of errors
    and the sending of queries. Error messages include the following:


    +   - Destination unreachable

    - Redirect

    - Source quench

    - Time exceeded


    ICMP also includes general message queries. The two most commonly used are the
    following:


    +   - Echo request

    - Echo reply


    The most familiar tool for verifying that an IP address on a network actually
    exists is the Packet Groper (PING) utility. This utility uses the ICMP echo request
    and reply mechanisms. The echo request is a simple directed datagram that asks
    for acknowledgment that a particular IP address exists on the network. If a machine
    with this IP address exists and receives the request, it is designed to send an
    ICMP echo reply. This reply is sent back to the destination address to notify
    the source machine of its existence. The PING utility reports the existence of
    the IP address and how long it took to get there.


    # Internet Group Management Protocol


    Internet Group Management Protocol (IGMP) is a protocol and set of specifications
    that allows machines to be added and removed from IP address groups, utilizing
    the class D range of addresses. IP allows the assignment of class D addresses
    to groups of machines so that they may receive broadcast as one functional unit.
    Machines can be added and removed from these units or groups, or be members of
    multiple groups.


    Unicast messages are sent to one host. Multicast messages are sent to a number
    of hosts. Broadcast messages are sent to all hosts. Understanding this distinction
    is helpful when discussing networking.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Address Resolution Protocol


    Unless IP is planning to initiate a full broadcast on the network, it has to have
    the physical address of the machine to which it is going to send data-grams. For
    this information, it relies on Address Resolution Protocol (ARP). ARP is responsible
    for mapping IP addresses on the network to physical addresses in memory. This,
    whenever IP needs a physical address for a particular IP address, ARP can deliver.
    But ARP''s memory does last indefinitely, and occasionally will ask for an IP
    address that is not in ARP''s memory.


    ARP is responsible for finding a map to a local physical address for any IP address
    that IP may request. If ARP does not have a map in memory, it has to go one on
    the network. ARP uses local broadcasts to find physi-cal addresses of machines
    and maintains a cache of recently mapped IP addresses to physical addresses. Although
    this cache does not last indefinitely, it enables ARP not to have to broadcast
    every time IP needs a physical address.


    As long as the destination IP address is local, ARP simply sends a local broadcast
    for that and returns the physical address to IP. IP, realiz-ing that the destination
    IP address is local, simply formulates the datagram with the IP address above
    the physical address of the destination machine.


    # Protocols and Ports


    The Transport layer uses ports numbers to transfer data to the Application layer.
    These ports allow a host to support and track simultaneous sessions with other
    hosts on the network. There are more than 65,000 definable ports, and Table 11.1
    lists the most common assignments.


    For the exam, be sure to memorize the ports that appear in Table 11.1.


