    in the source directory. Because the commands are also passed to the shell, any
    legal shell commands can be executed here.


    With the %build complete, the next step is installation. There are no real macros
    in the %install section, but the commands to install the software are included
    for execution by the shell. If you are using a Makefile, you can either patch
    the Makefile to include a make install command, or install the files by hand in
    this section.


    The %clean macro in the spec file is used to ensure that there is a clean source
    tree for you to build into. Be advised—failing to check the directory you may
    result in the removal of your Linux operating systems because you may be in the
    directory.


    The RPM manager has no way of knowing what files are to be installed when compilation
    of the source files is completed. The %Files section lists the binaries for installation,
    and the location they are installed.


    Finally, the %changelog section lists all of the changes for each version and
    release of the package. Each change is started with an asterisk (*), and includes
    the date, your name, and your email address. The rest of the text is free-form,
    but should follow some coherent manner for readability.


    With the spec file defined, we can now build the package.


    # Building a Package


    We are required to have a properly defined build tree, which can be modified in
    the file /etc/rpmrc or /usr/lib/rpm/rpmc. This is a large and comprehensive set
    of information used for building packages. Most people use the /user/src directory
    for installing their sources to build a package. When creating the source tree
    to build the package, you may need to create some directories including


    +   * BUILD—rpm will build the package

    * SOURCE—Where the source files are located

    * SPECS—Where the spec files should go

    * RPMS—Where rpm will put the binary RPM files after it builds them

    * SRPMS—Where rpm will put the source RPMS


    When this is done, compile the source and review it for the files that are installed,
    where they go, and what you had to compile, such as a patch. With the compilation
    complete you are ready to build the RPM.'
