    +   - bs—file size


    +   - if—input file


    +   - of—output file


    # Related Utilities


    Backup utilities allow you to copy files from the system to the backup, or vice
    versa. There are also utilities designed to reduce/compress data so that it takes
    up space. The most common of these are gzip (to compress) and gunzip (to uncompress).
    The contents of the gzip file can be seen (without uncompressing) using the zcat
    utility in place of cat.


    Two others that exist on our systems


