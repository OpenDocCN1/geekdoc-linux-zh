  md: '# Novell Certified Linux Professional Study Guide


    Whether it''s your first exam or your tenth, understanding the details of the
    exam (how much to spend on questions, the environment you''ll be in, and so on)
    and the exam software used will help you concentrate on the material rather than
    on the setting. Likewise, mastering a few exam-taking skills should help you recognize—and
    perhaps even outfox—some of the tricks and gotchas you''re bound to find in some
    of the exam questions.


    This chapter describes some proven exam-taking strategies that you should be able
    to use to your advantage.


    # The Exam Situation


    When you arrive at the testing center where you scheduled your exam, you''ll need
    to sign in with an exam coordinator. He or she will ask you to show forms of identification,
    one of which must be a photo ID, and both should have your signature. After you''ve
    signed in and your time arrives, you''ll be asked to deposit any books, pagers,
    cell phones, bags, or other items you brought with you. Then, you''ll be escorted
    into a computer room. Typically, the room will be furnished with anywhere from
    one half a dozen computers, and each workstation will be separated from the others
    by dividers designed to keep you from seeing what''s happening on someone else''s
    computer.


    You''ll be furnished with a pen or pencil and a blank sheet of paper, or, in some
    cases, an erasable plastic sheet and an erasable-tip pen. You''re allowed to write
    down any information you want on both sides of the sheet.


    Most test rooms feature a wall with a large window. This permits the exam coordinator
    standing behind it to monitor the room, to prevent takers from cheating. The exam
    coordinator will have preloaded the appropriate certification exam and you''ll
    be permitted to start as soon as you''re seated in front of the computer.


    All certification exams allow a maximum amount of time in which to complete your
    work. Although this may sound quite simple, the questions are constructed not
    only to check your mastery of basic facts and figures about SuSE and Linux technologies,
    but they also require you to evaluate one or more sets of circumstances or requirements.
    You might be asked to select the best or most effective solution to a problem
    that can be tackled in a number of different ways. Taking the exam is quite an
    adventure, and it involves real thinking. This book shows you what to expect and
    how to deal with'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# The NCLP Certification Process and Planning Your Approach


    # CHAPTER 1


    As you''re taking the exam, keep working on each question until you''re certain
    you have done the task thoroughly.


    > With a traditional multiple-choice exam like LPI, you''re better off guessing
    at a solution than leaving a task untackled if you start running out of time.
    Time management on a practicum exam, though, is even more critical as you must
    complete the steps fully and completely. You either get 100% or a 0% on the practicum.
    There is no variation.


    # Exam-Taking Basics


    The most important advice about taking any exam is: Read each question, task,
    or assignment carefully. Some wording is deliberately ambiguous, some questions
    double negatives, and others use terminology in incredibly precise ways.


    Here are some suggestions on how to deal with the tendency to jump to an answer
    quickly:


    +   - Make sure you read every word in the question. If you find yourself jumping
    impatiently, go back and start over.


    +   - As you read, try to restate the question in your own terms. If you can do
    this, you should be able to pick the correct answer(s) much more easily.


    +   - When returning to a question after your initial read-through, read every
    word again—otherwise, your mind can quickly fall into a rut. Sometimes, revisiting
    a question after turning your attention elsewhere lets you see what you missed,
    but the strong tendency is to see what you''ve seen before.


    +   - If you return to a question more than twice, try to articulate what you
    don''t understand about the question, or what appears to be missing. If you chew
    on the subject for a while, your subconscious might provide the details that are
    lacking or you might notice a "trick" that will point to the right answer.


    Above all, try to deal with each question by thinking through what you know about
    the operating system—its characteristics, behaviors, and facts. By reviewing what
    you know (and what you''ve written down on your information sheet), you''ll often
    recall or understand sufficiently to determine the approach to the question.'
  merge: -1
