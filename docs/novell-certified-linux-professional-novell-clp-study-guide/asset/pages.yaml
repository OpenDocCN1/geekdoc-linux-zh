    # Summary


    Looking at this type of scenario can be overwhelming. Before you do anything,
    take a deep breath and break the items down into tasks. Remember that SuSE has
    a wonderful advantage over other implementations of Linux in its inclusion of
    YaST.


    Being able to pass the sample practicum is not a guarantee of readiness for the
    actual exam, but it does provide a measurement tool to allow you to gauge your
    own ability to work through a server''s configuration with a handful of details.


    I wish you the best.'
