  md: "# sed\n\nFor most practical purposes, grep -E is identical to egrep.\n\nThe\
    \ name sed is an acronym for \"stream editor\", and it is as accurate a description\
    \ as possible. The utility accepts input (text) to flow through like a river or\
    \ stream. It edits that text and makes changes to it based on the parameters it\
    \ has been given. The syntax for sed is\n\n```\nsed {options}{commands} filename\n\
    ```\n\nThe number of options is very limited, but the commands are more numerous.\
    \ These are the accepted options:\n\n+   - e to specify a command to execute\n\
    - f to specify a file in which to find commands to execute\n- n to run in quiet\
    \ mode\n\nAs mentioned, the examples are plentiful and the best way to understand\
    \ them is to examine a few examples. One of the simplest commands to give it,\
    \ or any editor, is to substitute one string for another. This is accomplished\
    \ with the s (for substitute) command, followed by a slash, the string to find,\
    \ a slash, the string to replace the first value with, and another slash. The\
    \ entire entry should be placed within single quotes:\n\n```\n/s/old value/new\
    \ value/\n```\n\nAn example would be\n\n```\n$ echo I think the new neighbors\
    \ are getting a new air pump | \nsed 's/air/heat/'\n```\n\nAnd the output displayed\
    \ becomes\n\nI think the new neighbors are getting a new heat pump\n\nThe string\
    \ \"air\" was replaced by the string \"heat\". Text substitution is one of the\
    \ simplest features of sed, and also what it is used for most of the time, for\
    \ it is here that its power and features truly excel."
  merge: -1
  pgno: 121
- img_proc: true
  md: "# Preliminary GNU and Unix Commands\nCHAPTER 3\n\n> It is important to recognize\
    \ that sed is not an interactive editor. When you give it the commands to execute,\
    \ it does so without further action on the user's part.\n\nBy default, sed works\
    \ by scanning each line in successive order. If it does not find a match after\
    \ searching the entire line, it moves to the next. If it finds a match for the\
    \ search text within the line, it makes the change and immediately moves to examine\
    \ the line. This can provide some unexpected results. For example, suppose you\
    \ want to change the word \"new\" to \"old\":\n\n```\n$ echo I think the new neighbors\
    \ are getting a new air pump |\nsed 's/new/old/'\n```\n\nThe output becomes\n\n\
    I think the old neighbors are getting a new air pump\n\nThe second occurrence\
    \ of the search phrase is not changed because sed finished with the line after\
    \ finding the first match. If you want all occurrences within the line to be changed,\
    \ you must make the search global by using a \"g\" at the end of the command:\n\
    \n```\n$ echo I think the new neighbors are getting a new air pump |\nsed 's/new/old/'\n\
    ```\n\nThe output becomes\n\nI think the old neighbors are getting an old air\
    \ pump\n\nThe global parameter makes sed continue to search the remainder of the\
    \ line, finding a match, until the end of the line is reached. This handles multiple\
    \ occurrences of the same phrase, you must go in a different direction if you\
    \ want to change more than one value.\n\nThis can be accomplished on the command\
    \ line with the -e option used to flag every command. For example\n\n```\n$ echo\
    \ this line is shorter | sed -e 's/line/phrase/' -e \n's/short/long/'\n```\n\n\
    The output becomes\n\nthis phrase is longer"
  merge: -1
