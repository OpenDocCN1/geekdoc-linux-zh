    # Drivers and Interfaces


    Course Objectives Covered


    +   13. Understand the Differences Between Devices and Interfaces (3038)

    14. Understand How Device Drivers Work (3038)


    Two terms are often confused when discussing hardware: devices and interfaces.
    In Linux, a device is any piece of hardware that you can actually touch—it has
    a physical presence. An interface, on the other hand, is a soft component that
    allows access to the device. Every device must have an interface, but there can
    be more than one interface for any given device.


    Drivers—software modules loaded into the kernel—create interfaces and act as the
    go-between for interfaces and devices. There are two types of drivers: kernel
    modules and user space modules. Kernel modules are loaded and removed at runtime
    and allow access to hardware elements; they reside beneath /lib/modules/<kernel-version>/.
    Space modules provide additional drivers that work in the user space. With an
    application and a physical printer, for example, there would reside a user space
    module and a kernel module.


    # The Linux Desktop


    Course Objectives Covered


    +   4. Overview of the Linux Desktop (3036)

    5. Using the KDE Desktop Environment (3036)

    6. Using the GNOME Desktop Environment (3036)'
