    # Mounting and Unmounting


    There will be a local filesystem, for it is upon that filesystem Linux is installed.
    If the filesystem is large enough to hold everything you interact with, that is
    all you need. In most cases, however, the local filesystem is not sufficient to
    hold everything you need. When that is the case, you can mount other filesystems
    to make them accessible in your environment.


    The mount command is used without parameters to show what filesystems are currently
    available. A sample of the output would be


    ```

    /dev/hda1 on / type ext2 (rw)

    /dev/hda3 on /home type ext2 (rw)

    ```'
