  md: '# Kernel Modules


    Unlike other Unix implementations, the Linux kernel makes use of loadable modules
    to add new features or support for specific hardware. This provides the administrators
    with the flexibility to reconfigure their systems as required. Typical Unix implementations
    require the administrator to build a new kernel whenever a change is required
    to the kernel. Some changes do require building a new kernel, some do not.


    Loadable modules are components that are not directly linked or included in the
    kernel. The module developer compiles them separately and the administrator can
    insert or remove them into the running kernel. The scope of actual modules available
    has grown considerably and now includes filesystems, Ethernet card drivers, tape
    drivers, PCMCIA, parallel-IDE, and many printer drivers. Using loadable modules
    is done using Table 10.3.


    # Loadable Module Commands


    | COMMAND | DESCRIPTION |

    | --- | --- |

    | lsmod | List the loaded modules |

    | insmod | Install a module |

    | rrmod | Remove a module |

    | modinfo | Print information about a module |

    | modprobe | Probe and install a module and its dependencies |

    | depmod | Determine module dependencies |


    The commands affect the modules in the currently running kernel and will review
    information available in the /proc filesystem. lsmod is used to list the currently
    loaded modules. The output of the command is


    ```

    [root@server7 edulaney]# lsmod

