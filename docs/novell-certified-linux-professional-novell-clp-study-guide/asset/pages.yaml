  md: '# Scheduling Jobs for Later


    Course Objectives Covered


    +   7. Schedule Jobs (3037)

    8. Automate Data Backups with cron (3038)


    Quite often there are jobs that can run in your absence, but which need to run
    either at odd hours, or with a fair amount of frequency. If you have a job that
    needs to run one time, and it is convenient to run it when you are not around,
    you can schedule it using the at command. If you have a job that runs with any
    degree of frequency (once a month month, once a week, and so on), you can schedule
    it with cron.


    # Using at


    The at command allows you to schedule a job to run at a specified time. The syntax
    is simple:


    ```

    at {time}

    ```


    The time can be specified in a great many ways. Here are some examples:


    +   17:31—To run the command at 5:31 in the afternoon.

    now—To run now.

    now + 5 days—To run five days from now at the exact same time.

    17:31 Mar 14—To run at 5:31 in the afternoon on Mar 14th.


    +   midnight—To run at midnight tonight. Other special words are today, tomorrow,
    and noon.


    By default, only the root user can use the at command. This can be changed, by
    utilizing either the /etc/at.allow file or the /etc/at.deny file. By default,
    on most systems the at.deny file exists and holds accounts that a user should
    not be using. If only the at.allow file exists, only users who are listed within
    that file are allowed to use the at command. On the other hand, the at.deny file
    exists, all users are allowed to use the at command except those listed within
    this file. To complica matters a bit, if there is an at.deny file and it is empty,
    only root can use it.'
  merge: -1
  pgno: 457
- img_proc: true
  md: '# CHAPTER 13


    When you give the at command and the time, the prompt changes to the PS2 prompt
    (>, by default), and you can enter as many commands as you want to run at that
    time. When you are finished, press Ctrl+D to return to the PS1 prompt.


    Jobs that are spooled for future execution can be listed with either this command:


    ```

    at -l

    ```


    or


    ```

    atq

    ```


    Individual users will see only their own entries, whereas the listings are stored
    beneath /var/spool/atjobs. These text files hold a copy of environment information
    applied when the user created the job, as well as the commands within the job
    itself. Prior to execution, the command can be stopped with either of the following
    commands and the job number:


    ```

    at -d

    ```


    or


    ```

    atrm

    ```


    When a job is spooled, beneath is a file representing it with a very odd name
    (cryptic format) /var/spool/atjobs. An example of the filename would be a00010011756e1,
    and its contents (which you must root to see) would look like this:


    ```

    #!/bin/sh

    # atrun uid=0 gid=0

    # mail    root

    umask 22

    LESSKEY=/etc/lesskey.bin; export LESSKEY

    NNTPSPSERVER=news; export NNTPSERVER

    INFODIR=/usr/local/info:/usr/share/info:/usr/info; export INFODIR

