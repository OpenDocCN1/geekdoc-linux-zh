    to giving the shell only one command at a time.


    Multiple commands, not connected to one another in any way, can be given on the
    same line as long as the semicolon (;) is used to connect them. For example, it
    is possible to see all the files in the current directory and the current date
    by giving the following two commands in succession:


    ```

    ls

    date

    ```


    These are unrelated commands in that the output of the second has absolutely nothing
    to do with the output of the first. You can combine them on a single command line
    with a semicolon between the two and get the same result:


    ```

    ls ; date

    ```


    The semicolon is a special character signaling that multiple commands are on the
    same line. This character allows you to break the whitespace rule on both sides
    of it (ls;date) while giving you the same result.


    If the commands do have something in common—the output of one is to become the
    input of the next—they are connected using a pipe (|). For example, if a list
    of files within a directory is too long to fit on one screen, you can view a screen
    at a time by using this command:


    ```

    ls -1 | more

    ```


    Here the output of the ls -1 command becomes the input of the more command. If
    the first part of the entire command line fails, the second part-not possibly
    be executed.'
