    In this section, you''ll learn about two important utilities used for working
    with files and output. The grep family of utilities is used to find values, and
    the sed utility can change the value of strings. Many of the utilities discussed
    will be used in the examples in this section.


    # The grep Family


    The utility with the funny name (something common in Linux) is really an acronym
    for the function that performs: "Globally look for Regular Expressions and then
    Print the results." In Layman''s terms, it is one of the most advanced search
    utilities you can use. In order to be proficient with it, you must understand
    what a regular expression is and how to use it in searching for matches to a query.


    There are a number of rules for regular expressions, and these eight the most
    important:


    +   1. Any non-special character will be equal to itself.


    +   2. Any special character will be equal to itself if preceded by a backslash
    (\)


    +   3. The beginning of the line can be signified by an up caret (^), and the
    end of the line by a dollar sign ($).


    +   4. A range can be expressed in brackets ([-]).


    +   5. An up caret (^) as the first character of a bracket will find values matching
    entries within the brackets.


    +   6. A period (.) can signify any single character.


    +   7. An asterisk (*) stands for anything and everything.


    +   8. Quotation marks are not always needed around search strings, but can be
    needed, and should be used as a general rule.


    Table 3.4 offers some examples and elaboration on each of the preceding rules.'
