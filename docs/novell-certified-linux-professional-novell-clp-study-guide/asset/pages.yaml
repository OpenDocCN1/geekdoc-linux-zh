  md: '# Wildcards


    Wildcards are characters used to signify other characters that the shell fills
    in. The two most common wildcard characters are the asterisk (*) and question
    mark (?). Although they are often confused, their meanings are different and can
    lead to completely different results.


    The asterisk is used to signify any and all; anything and nothing; alpha and omega.
    For example


    ```

    ls s*

    ```


    will find all entries (files and directories) within the current directory starting
    with the letter “s” and having any number of characters following—including none.
    Possible results it could generate in the display include


    ```

    s sa sam samp sample samples

    samples.gif

    ```


    Note that it finds “s” alone, and “s” with any number of entries following it.
    In contrast, the question mark is a placeholder for one character, and only one
    character. Using the same file possibilities, the following command


    ```

    ls s?

    ```


    will find only entries (files and directories) in the current directory starting
    with the letter “s” and having only one character following. The resulting display
    generated is


    ```

    sa

    ```


    If you want to find only five-letter entries beginning with “s”, the command to
    use would be


    ```

    ls s???

    ```


    To recap, the asterisk means all or none, and the question mark always means one.
    These two wildcards are not mutually exclusive, and can be used in combination
    with one another as the need arises. For example, find only files with three-letter
    extensions, regardless of the filename, the command would be


    ```

    ls *.???

    ```


    To muddy the waters a bit, you can also use brackets ([]) to specify possible
    values. All the possible values must reside within the brackets and are used'
  merge: -1
