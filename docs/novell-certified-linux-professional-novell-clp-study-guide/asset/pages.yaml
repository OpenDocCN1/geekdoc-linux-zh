- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    The utility to create links is ln. When you create a link, you are merely creating
    another pointer to an already existing entity; because this is the case, only
    one inode is used, not two. Because there is only one copy, you are also saving
    disk space.


    > NOTE

    When you link to a file to give others access, you must make certain they have
    appropriate permissions to access the file, or you are defeating your purpose.


    Two types of links can be created: hard and symbolic. Both are examined in the
    following sections.


    # Hard Links


    The simplest of the two link types is the link type. It is created by default
    with ln, and its use can be illustrated as follows:


    ```

    $ ls -l

    -drwx-r---- 5 root root 1024 Sep 22 23:57

    -Desktop

    -rw-r--r-- 1 root root 81 Sep 23 00:25

    -friday

    -rw-r--r-- 1 root root 81 Sep 23 00:38

    -monday

    -rw-r--r-- 1 root root 152 Sep 23 00:26

    -tuesday

    -rw-r--r-- 1 root root 38 Sep 23 00:26

    -wednesday

    $

    $ ln monday thursday

    $ ls -l

    -drwx-r---- 5 root root 1024 Sep 22 23:57

    -Desktop

    -rw-r--r-- 1 root root 81 Sep 23 00:25

    -friday

    -rw-r--r-- 2 root root 81 Sep 23 00:38

    -monday

    -rw-r--r-- 2 root root 81 Sep 23 00:38

    -thursday

    -rw-r--r-- 1 root root 152 Sep 23 00:26

    -tuesday

    -rw-r--r-- 1 root root 38 Sep 23 00:26

    -wednesday

    $

    ```'
