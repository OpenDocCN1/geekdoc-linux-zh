- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    +   3. Select a Linux File System (3037)

    4. Configure Linux File System Partitions (3037)


    In order to use a hard disk with Linux (and every operating system), at least
    one partition must exist on the disk. A partition is a portion of the disk (some
    or all) that has been properly formatted for storing data. Although there must
    be a minimum of one primary partition on the hard drive, there can be up to a
    total of four if a DOS-style partition table is used (the default), and each partition
    must be formatted before use. A partition must be a primary partition in order
    for the operating system to be able to boot from it.


    If you want, a primary partition (only one) can be further subdivided into extended
    partitions (known as logical drives). Again DOS-style partitions, up to four logical
    drives can be created from a primary partition, and none of them are bootable
    by the operating system.


    > NOTE



    The maximum number of partitions you can have if mixing and matching primary and
    extended is three primary partitions and four logical drives (for a grand total
    of seven).


    In actuality, the theoretical limit on SCSI disks is 15 partitions, and on IDE
    is 63. The limitations mentioned previously are enforced with the DOS-style partition
    table used as a default.


    All partitions must be referenced in the /dev directory, and the first partition
    on the first disk is either


    +   - hda1—For IDE

    - sda1—For SCSI


    The name of the device can always be broken into the four fields that each character
    stands for:


    +   1. The type of drive: h for IDE, or s for SCSI.

    2. The type of device: d for disk.

    3. The number of the disk expressed in alphabetical format: a for the first, b
    for the second, and so on.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# 4. The number of the partition. Numbers 1–4 are set aside for use on primary
    partitions, whether or not you have that many, and the logical drives start numbering
    with 5.


    There must be a minimum of two partitions: the filesystem itself (often referred
    to as root), and a partition. The swap partition consists of the memory and some
    hard drive space. The swap partition is always a minimum of the RAM installed
    on the machine, but can be more (16MB is the minimum recommendation for hard drive
    space). For example, if you have 64MB installed on a machine and the swap partition
    needs 128MB, it can use a 64MB swap partition to read and write from as process-is
    doing.


    If you run out of room in the partition (or have not configured such), a swap
    file will always be created for the same purpose, but the use of the partition
    is preferred.


    > Linux can work with swap files or swap partitions, but partitions provide more
    system efficiency.


    One other note about hard drives: Linux prefers the number of cylinders on a drive
    to be 1024 or less. If the number is larger, there can be complica-tions with
    software that runs at boot time, or booting/partitioning with other operating
    systems.


