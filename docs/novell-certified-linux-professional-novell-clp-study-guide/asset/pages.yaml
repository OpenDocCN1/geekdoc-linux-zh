  md: '# Supplying Values


    The needed values for TCP/IP configuration can be entered manually each time you
    add a host to the network, or you can use the Dynamic Host Configuration Protocol
    (DHCP) service. With DHCP, you do not need to enter any values when adding new
    hosts to the network. A server DHCP Daemon (dhcp) holds a range of addresses—known
    as a scope—and can “lease” IP addresses to clients. The lease duration is configurable—from
    a short time up to forever. So long as forever is not used, the client will regularly
    attempt to renew the lease it is using if possible. If the server does not hear
    it, the client will try at regular intervals all the way up until the lease expires.
    When the lease expires, it goes back into the scope and the client must obtain
    another lease anew. After every expiration, a client requests an address, it will
    always attempt to get the one last time if it is available.


