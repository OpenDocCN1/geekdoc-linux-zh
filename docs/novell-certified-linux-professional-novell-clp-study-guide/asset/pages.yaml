  md: '# Getting Info


    The info utility can be used to display documentation on the GNU utilities.

    The syntax is either


    ```

    info

    ```


    or


    ```

    info {utility name}

    ```


    If the utility is called with no utility name following, it shows a main menu

    screen similar to the one shown in Figure 13.1.


    ![](img/38aae1e03db8863dab67582599f6fc83_448_0.png)


    As the display stays, you are really looking at the top (head) of a file

    dir. This contains a list of all utilities for which the info command

    works, broken into sections (Miscellaneous), GNU file utilities, programming

    languages, and so on). Following each asterisk is the name of the item and

    within each set of parentheses is the text you would type to see the entry for

    that item. For example, to see the info for Bash, at the command line you

    type


    ```

    $ info bash

    ```


    Within the menu, you can also press “m” to bring up a menu prompt, and

    then type the shortcut (“bash” in this case). The first screen lists the'
  merge: -1
