    # Options for grep


    The default action for grep is to find matches within strings speci-

    fied and print them. This can be useful for pulling out data from a large

    display, for example, to find what user karen is on:


    The command, used in the following example, merely shows who is logged on

    to the system.


    ```

    $ who | grep "karen"

    karen  pts/2    Aug 21 13:42

    $

    ```


    From all the output of the who command, only those having the string

    "karen" are displayed. As useful as this is, there are times when the actual

    output is not as important as other items surrounding it. For example, if

    you don''t care where karen is logged on, but want to know how many con-

    current sessions she has, you can use the -c option:


    ```

    $ who | grep -c "karen"

    1

    $

    ```


    You can also modify it to use a logical "or" (| |) to tell you if the user has
    not

    come in yet if the operation fails:


    ```

    who | grep "karen" || echo "She has not come in yet"

    ```


    The -c option is used to count the number of lines that would be displayed,

    but the display itself is suppressed. The -c option is basically performing

    the task as this:


    ```

    $ who | grep "karen" | wc -1

    1

    $

    ```'
