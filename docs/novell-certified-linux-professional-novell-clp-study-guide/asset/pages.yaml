    By default, LILO boots the default operating system each time, but you can enter
    the name of another operating system at the "BOOT": prompt, or force the prompt
    to appear by pressing Shift, Ctrl, or Alt during the boot sequence. Entering a
    question mark (pressing Tab) will show the available operating systems as defined
    in the /etc/lilo.conf file: This is a text file that can range from simple to
    complex based on the number of OSes you have. An example of the file with only
    one operating system (Linux) would be (numbering has again been added to facilitate
    discussion):


    +   1. #

    2. # /etc/lilo.conf - generated by Lizard

    3. #


    +   4. # target


