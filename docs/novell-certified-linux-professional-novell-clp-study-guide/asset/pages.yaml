    This chapter focuses on working with files and the Linux filesystem. This chapter
    covers the following course objectives:


    +   1. Managing File Permissions and Ownership (3036)

    2. Describe Basic Linux User Security Features (3037)

    3. Secure Files and Directories with Permissions (3037)

    4. Implement and Monitor Enterprise Security Policies (3037)

    5. Set Up and Configure Disk Quotas (3037)

    6. Use ACLs for Advanced Access Control (3038)


    # ## Working with File Permissions and Ownership


    Course Objectives Covered


    +   1. Managing File Permissions and Ownership (3036)

    2. Describe Basic Linux User Security Features (3037)

    3. Secure Files and Directories with Permissions (3037)

    4. Implement and Monitor Enterprise Security Policies (3037)


    Permissions determine who and cannot access files and directories, as well as
    what type of access the permission holders have. The first 10 characters of `ls
    -l` listing of any entity resemble the following:


    ```

    - rwxrwxrwx

    ```'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    The first character identifies the type of entity: "-" for a standard file, "d"
    for directory, "b" for a block device (such as a tape drive), "c" for a character
    device, "l" for a link, or "p" for a pipe. The remaining nine characters can be
    broken into three groups, as shown in Figure 4.1.


    # FIGURE 4.1

    Permissions divide into three sections.


    ![](img/38aae1e03db8863dab67582599f6fc83_149_0.png)


    When a user attempts to access a file, the first check is to determine if the
    user is the owner of the file. If so, the first set of permissions apply. If the
    user is not the owner, a check is completed to see if the user is a member of
    the group owning the file. If he or she is a member of the group, the second set
    of permissions applies. If he or she is not the owner of the file, and not member
    of the group, the third set of permissions applies.


    # Standard Permissions


    The available permissions that can be assigned to an entity—either owner, group,
    or other—are


    +   - r—To read a file. This is the only permission needed to copy a file as well.
    When applied to a directory, it grants the ability to read (see) the files within
    the directory.

    - w—To write a file. Writing allows you to change the contents, modify, and overwrite
    files. When this permission is applied to a directory, you can delete and move
    files within the directory (even if you don''t specifically write permission to
    an individual file).

    - x—To execute the file if it contains scripts or can otherwise be run by the
    system. On a directory, it allows you to change to a specific directory. When
    applied in conjunction with read on, it allows you to search the directory.

    - (dash)—Indicates the absence of a permission. For example, r-x would indicate
    that the user can read and execute, but cannot write.


    Thus, to summarize the 10 fields in the permissions, they are


    +   1. What type of entity (file; directory, and so on)

    2. Whether the owner can read'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Working with Files CHAPTER 4


    +   3. Whether the owner can write

    4. Whether the owner can execute

    5. Whether the group can read

    6. Whether the group can write

    7. Whether the group can execute

    8. Whether others (not group or owner) can read

    9. Whether others can write

    10. Whether others can execute


    Numerical values can be associated with these permissions as well:


    | PERMISSION | NUMERICAL VALUE |

    |--- |--- |

    | r | 4 |

    | w | 2 |

    | x | 1 |

    | - | 0 |


    The numerical values make it possible to add a set of permissions and make them
    easier to understand. For example, if a file has permissions for the user of “rwx”,
    the numerical becomes 4(r)+2(w)+1(x)=7. The full set of permissions for the file
    can be computed as shown in Figure 4.2.


    ![](img/38aae1e03db8863dab67582599f6fc83_150_0.png)


    Table 4.1 extrapolates on the numerical conversion and outlines some of the 100+
    possible values for a file''s permissions.


    # Examples of Permission Values for Files TABLE 4.1


    | NUMERICAL VALUE | PERMISSIONS |

    |--- |--- |

    | 1 | ------x |

    | 2 | -----w- |'
