    ####################################################################################

    # Printer permissions data base

    ## #

    ##

    ##

    ## LPRng - An Enhanced Printer Spool

    lpd.perms file

    Patrick Powell papowell@lprng

    ##

    ## VERSION=3.8.25

    ##

    ## Access control to the LPRng facilities is controlled by

    ## entries in a set of lpd.perms files. The common location

    ## for these files: /etc/lpd.perms, /usr/etc/lpd.perms,

    ## and /var/spool/lpd/lpd.perms.

    ## The locations of these files are set by the perms_path entry

    ## in the lpd.conf file or by compile time defaults in the

    ## src/common/defaults.c file.

    ##

    ## Each time the lpd server is given a user request or carries

    ## out an operation, it searches the perms files to

    ## determine if the action is ACCEPT or REJECT. The first

    ## ACCEPT or REJECT found terminates the search.

    ## If none is found, then the last DEFAULT action is used.

    ##

    ## Permissions are checked by the use of ''keys'' and matches.

    ## For each of the following LPR activities, the following

    ## keys have a value.

    ##n## Key Match Connect Job LPQ LPRM LPC

    ## Spool Print

    ## SERVICE S ''X'' ''R'' ''P'' ''Q'' ''M'' ''C''

    ## USER S JUSR JUSR JUSR JUSR JH JH JH

    ## HOST RH JH JH JH RH RH RH

    ## GROUP S JUSR JUSR JUSR JUSR

    ## IP RIP RIP JIP JIP JIP JIP JIP

    ## PORT N PORT PORT PORT PORT PORT PORT

    ## UNIXSOCKET V SK SK SK SK SK

    ## REMOTEUSER S JUSR JUSR JUSR CUSR CUSR

    ## REMOTEHOST S RH JH RH RH RH

    ## REMOTEGROUP S JUSR JUSR JUSR CUSR CUSR

    ## CONTROLLINE S CL CL CL CL

    ## PRINTER S PR PR PR

    ```'
