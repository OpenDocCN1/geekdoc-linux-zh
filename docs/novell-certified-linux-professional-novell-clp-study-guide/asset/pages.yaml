  md: '# CHAPTER 3


    The double quotes cancel the default meaning of the whitespace and allow the value
    between them them to be interpreted as a single entry. The double quotes cancel
    the meaning of most special characters, but not all. For example, suppose there
    is a variable named EXAMPLE that is equal to 25:


    ```

    echo $EXAMPLE

    ```


    This will return “25”. Likewise, the following will also return “25":


    ```

    echo "$EXAMPLE"

    ```


    And the following will return "$EXAMPLE":


    ```

    echo ''$EXAMPLE''

    ```


    The single quotes go above and beyond the double quotes and also cancel out the
    meaning of the dollar sign.


    Going in another direction


    ```

    echo ''date''

    ```


    will return "date". Substituting the single quotes for back quotes will have a
    different result:


    ```

    echo `date''

    ```


    will return the results of the date command. An alternative to the back quotes
    in the shell is to place the command within parentheses and treat it as a variable.
    Thus the date can be echoed as in the preceding example with the command:


    ```

    echo ($date)

    ```


    If you fail to use an even number of any quote set, PS1 is replaced by PS2, and
    continues to be so until the total of quotes used (each set) is an even number.
    This can be useful when you have a lengthy entry you want to break into lines
    during entry. The following example includes the prompts and also shows the use
    of one set of quotes (back quotes) within another (double quotes):


    ```

    [edulaney@server7 home]$ EXAMPLE="Hi, the date

    > time now

    > are ''date''

    [edulaney@server7 home]$ echo $EXAMPLE

    Hi, the date and time now are Thu Aug 10 11:12:37 EDT 2000

    [edulaney@server7 home]$

    ```'
