  md: '# Working with Quotas


    Course Objective Covered


    +   5. Set Up and Configure Disk Quotas (3037)


    Quotas are used to limit the amount of space available to a user or group. By
    default, Linux does not impose any quotas, and thus each user is limited in the
    amount of hard disk space he or she can consume only by the amount of space available
    on the system.


    When quotas are used, they must be applied per partition, and this offers flexibility
    in that the level applied to one partition can differ from applied to another.
    Each quota also operates independently of any other. For example, quotas can be
    applied on a partition limiting therein to 7MB, even to 5MB, and to 3MB. This
    gives the three of them a combined total of 15MB of storage space. However, if
    they belong to the sales group, and it is limited to 10MB, one or more of the
    users will not be able to store files after the 10MB limit is reached even though
    they have room left within their individual quota.


    To turn quotas on, you must edit the /etc/fstab file. A current entry with- the
    file would read


    ```

    /dev/hda3 /home ext2 defaults 1 2

    ```


    The first field is the filesystem, and the second is the mount point. The third
    field is the filesystem type, and the fourth is options for the filesystem. The
    fifth field identifies the order in which the filesystem would be used by a dump,
    and the sixth field is the order in which fsck would use it.


    It is the fourth field where a modification might be made to use quotas, and this
    is accomplished by changing the line to read:


    ```

    /dev/hda3 /home ext2 defaults,usrquota 1 2

    ```


    In some cases, it may be necessary for the kernel to be compiled to support quotas,
    but this is not always the case. After the file has been edited, go to the root
    of the partition where the quota is to be. As the root user, create a file called
    quota.user or quota.group. The permissions on the file must be equal to read and
    write by the root user only, and this is accomplished with the chmod command.
    Thus, the sequence following the edit is


    +   $ touch quota.user

    $ chmod 600 quota.user'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Working with Files


    # CHAPTER 4


    The touch command used in the following example was discussed in Chapter 3, "Preliminary
    GNU and Unix Commands."


    > NOTE


    You must then reboot, and the utilities that can be used


    +   - quotaon—To enable the quotas. -a option can be used to enable for every
    filesystem usrquota in /etc/fstab; other-wise, you must specify the filesystem.


    +   - quotaoff—Disable the use of the quotas.


    +   - edquota—To edit and change the quota limits. -u option allows you specify
    a user, or -g is used for a group. The -t option allows used for a "soft limit."


    +   - repquota—To generate a report of disk usage and the specified quota (created
    with edquota). -a to check all filesystems in /etc/fstab; -g to see the report
    for groups; -u to see the report for users (default); and -v to show numbers even
    if they are zero. Any user can run this utility to see their own numbers, but
    root will see the report for all users.


    +   - quota—Similar to repquota, it shows the quotas in existence. Any user can
    see their own, and can see all.


    +   - quotacheck—Only available to root, it scans the system and creates report
    files with the current usage.


    +   - quotatats—Shows the amount of used space for each individual user and group.


    > NOTE


    Not all the utilities are available in all implementations of Linux.


    By default, when a user or group reaches the quota limit, he or she is no longer
    to save any further entries. If you set a "soft limit," it means the user can
    exceed the limit, but only for a short period of time (defined as grace period;
    the default is seven days).


