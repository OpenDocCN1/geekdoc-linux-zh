  md: '# Networking Fundamentals

    CHAPTER 11


    tcpdump—This command-line utility allows you to monitor network traffic and analyze
    packets flowing through an interface in promiscuous mode. The -i option is used
    to specify an interface. The command tcpdump -i eth0, for example, runs on promiscuous
    mode for the first Ethernet interface and immediately begins displaying data to
    the terminal until you break out of it. The -c option can be used to specify that
    you want to listen to a certain number of packets. tcpdump -i eth0 -c 32, for
    example, will display the output for the next 32 packets and then exit. At the
    end of the day, it will report how many packets were captured, how many were received
    by filter, and how many were dropped by the kernel.


    ![](img/38aae1e03db8863dab67582599f6fc83_386_0.png)


    FIGURE 11.3

    Packets are successfully reaching the host.


    ```

    10.10.1.5 ping statistics

    12 packets transmitted, 12 received, 0% packet loss, time 110161ms

    rtt min/avg/max/mdev = 46.508/51.804/59.697/3.895 ms

    linux: #

    ```


    telnet—Allows you to establish a connection with a remote host. This is often
    used for administrative purposes.


    traceroute—This is a much-enhanced version of the ping utility, and used in place
    of it. Not only shows that the remote host is reachable, but also shows the path
    that was taken to reach the host. Figure 11.4 shows the utility interacting with
    the same host that was pinged in Figure 11.3; now it is possible to see the number
    of hops necessary in order to reach that host.'
