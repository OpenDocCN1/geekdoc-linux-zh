    # # Working with pstree and ps


    Two commands are closely related to ps offer slightly different views of the processes.
    The first of these is pstree, which will graphically depict the relationship between
    the processes as shown in Figure 3.1.


    **FIGURE 3.1** The pstree utility graphically shows the relationship between processes.


    ![](img/38aae1e03db8863dab67582599f6fc83_105_0.png)


    Graphically depicts the children beneath the main processes, and where each process
    fits in—what process is the parent of it, and so on.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Preliminary GNU and Unix Commands


    The second utility related to ps is top. Not only does it show the current processes,
    but it stays active and continually updates the display. Additionally, the top
    of the screen depicts information about how many days the system has been up,
    the number of users, memory and swap statistics, and so on.


    When top is running, you can press any of the following keys to interact with
    it:


    +   - h—Help

    - q—Quit

    - s—Set the delay between updates (default is five seconds)

    - spacebar—Update now rather than waiting for renewal interval

    - u—Display a single user only


    The columns show the standard PID/CMD information, as well as the amount of memory
    and the number of CPU processes being utilized.


    # Ending a Process


    Processes can be started in a plethora of ways. They are started automatically
    by the daemons, and started by the user in attempting to get a job done. Some
    processes start other processes, and the list goes on.


    Under normal circumstances, a child process acts on behalf of, and reports to,
    a parent. When the child is no longer needed, it goes away on its own. There are
    situations, however, when processes become runaways—they are no longer needed,
    yet they continue to run and consume resources.


    A parent process cannot (or should) cease as long as there are child processes
    associated with it. Given that, a child process that fails to cease could keep
    a number of unneeded processes on a system. To illustrate, assume that a user''s
    shell calls another process (A), which cannot do everything, and then it calls
    another (B), and in turn starts another (C).


    Under normal conditions, when Process finishes, it will report back to Process
    A and go away. Process B will massage the data, report back to Process A, and
    A will do whatever it needs to with the data, and then return it to the user''s
    shell and go away.


    For a non-normal condition, assume that Process C has a glitch and does not end
    after reporting back to Process B. It continues to run: This prevents Process
    B from ending because it still has a child associated with it. We can'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    assume Process B returns its values to Process A, and then it returns its values
    to the user''s shell. Process A, like Process B, cannot end because it still has
    a child associated with it. Because there is a glitch in Process C, three processes
    that are no longer needed continue to run.


    Another possibility for the glitch (and it would depend on how applications are
    written) is that Process B could go ahead and end without Process C going away.
    Process A could do its task, and go away as well. What happens in this instance
    is that only Process C remains a problem, but now it has no nonexistent parents
    above it, and has no idea who reports to—it becomes a true runaway.


    To solve problems with erratic processes, there is the command kill. This utility
    works with the following syntax:


    ```

    kill {option} PID

    ```


    To get rid of the cat process, the sequence would be


    | UID PID PPID C STIME TTY TIME CMD |

    | root 19605 19605 Aug10 pts/0 00:00:34 bash |

    | root 30089 19605 Aug20 pts/0 00:00:00 vi fileone |

    | root 30425 19605 Aug20 pts/0 00:00:00 paste -d |

    | root 32040 19605 Aug23 pts/0 00:00:00 cat |

    | root 1183 19605 Aug23 pts/0 00:00:00 awk -F: |

    | root 30990 19605 14:25 pts/0 00:00:00 ps |


    The "politely" asks the process to terminate. It is polite because there are 32
    different ways to kill a process (signals to send), and this is the safest method
    of doing so. In a great many instances, the process will simply ignore the request
    and continue on. When that happens, you can use one of the 32 ways by specifying
    the number to use. Among the possibilities are


    +   - -1 On hangup/disconnect

    - -2 Using an interrupt (Ctrl+C) sequence

    - -3 Upon quit

    - -9 Without regard—immediately

    - -15 (the default)'
