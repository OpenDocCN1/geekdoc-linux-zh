    In addition to resolving a host to an IP address, you can also resolve an IP address
    to a host name through a process known as reverse lookup. Whereas an FDN starts
    with the specific host and then the domain, an IP address starts with the network
    ID and then the host ID. Because you want to use DNS to handle the mapping, both
    must go the same way, so the octets of the IP address is resolved. That is, 148.53.66.7
    in the inverse address resolution is 76.56.13.148.


    Now that the IP address is resolved, it is going the same way as an FDN and you
    can resolve the address using DNS. To do so, you need to create a zone based on
    address class—for example, in the address 148.53.66.7, the portion that was assigned
    to the site by the governing committee is 148.53 (and for 204.12.25.3 it is 204.12.25).
