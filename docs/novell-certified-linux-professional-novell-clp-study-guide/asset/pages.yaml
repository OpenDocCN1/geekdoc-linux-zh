    From here, you would make your selection and choose to read the information relevant
    to what you are attempting to accomplish. Press q will quit, or d will take you
    back to the main menu.


    > Notice the two colons following each choice on the gzip submenu. This means
    that you cannot type "info" followed by any shortcut text to arrive at that location.
