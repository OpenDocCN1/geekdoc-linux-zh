    # Special Permissions


    Three special permissions are used in rare circumstances. Read, write, and execute
    are always used (or their absence expressed), but sometimes you need to do a bit
    more with a file or directory. The three special permissions are


    +   - Set User ID (SUID)

    - Set Group ID (SGID)

    - Sticky bit


    These permissions are discussed in the following sections.


    # SUID


    The Set User ID permission is used when you have an executable file that a normal
    user would not be able to run, but must. For example, the root user should be
    able to function xyz (start backups, do restores, log in to other devices, and
    so on) because of the security ramifications, but what if you need the users to
    run a script to perform this action because you don''t have time to do it personally?


    You can create the shell script as root, and set the SUID permission such that
    whoever runs the script will become root only within the framework of that script.
    Before and after the script, they are themselves, but the script runs as root.


    The numerical permission of SUID is 4000, and is added to the value of other permissions.
    When applied, the “x” that would appear in the execute file for the owner’s permission
    set to an “s”:


    ```

    $ ls -l turbo2

    -rwrrwx 1 root root 542 Sep 9 20:02

    ->turbo2

    $ chmod 4777 turbo2

    ```'
