- img_proc: true
  md: '# The home Directory


    This directory will hold subdirectories that are the home directories for users.
    For example, user eduelaney, when entering the command `cd`, will be placed in
    `/home/eduelaney` providing that variable (the default) is used when setting up
    the account.


    Each user''s home directory is used to provide him or her with a location where
    he or she can store files, as well as individual configuration files can be found
    and accessed. Some services, such as `ftp` and `http`, will also create directories
    beneath home.


    Files that are used to configure the environment for the user, such as `.profile`,
    `.bashrc`, and `.bash_history`, are stored in the home directory.


    > For security reasons, there is not a `/home/root directory. The home directory
    for the root user is `/root`.


    # The lib Directory


    Shared library files needed by binaries (such as those in the `/bin` directory)
    are located in the `/lib` directory and subdirectories beneath it. Generally,
    the libraries consist of executables written in the C language.


    # The media Directory


    The media directory is used for mounting removable media. Two subdirectories are
    created by default: `cdrom` and `floppy`. Other devices—such as `dvd`, `dvrecorder`,
    or `cdrecorder`, as shown in Figure 8.2—may appear as if they are installed.


    # The mnt Directory


    The mnt directory is used to hold external filesystems that are mounted. The entities
    that appear in this directory are never on this filesystem, but rather external
    resources that can be linked to and accessed from here. The external resources
    can be other filesystems, or devices.


    The devices will appear as directories with common names. The `tmp` subdirectory
    here is intended to hold temporary files, but the use of `/tmp` is preferred.
    External filesystems are loaded—and thus appear beneath this directory—with the
    `mount` command, and removed with the `umount` command.'
  merge: -1
  pgno: 259
