  md: '# Novell Certified Linux Professional Study Guide


    All "option" specify the default options needed for a module. For example, if
    we must tell modprobe the option to use, we must define it in our /etc/conf.modules
    file. For example, loading the de620 module, we must do the following:


    ```

    modprobe de620 bnc=1

    ```


    And we must add the entry to the /etc/conf.modules file: options de620 -o bnc=1


    However even though we specify them in this file, the administrator runs himself,
    the options specified on the command line override those specified in the /etc/conf.modules
    file.


    The aliases are used to assign an alternate name to a module. Recalling the /etc/conf.modules
    file, we see: alias scsi_hostadapter ncr53c8xx alias eth0 tulip


    This establishes the alias scsi_hostadapter for the module ncr53c8xx, and eth0
    for the tulip module. This means we do not have to remember the actual module
    name, but address the module through the aliases.


    When you modprobe, it first examines the directory modules compiled for the current
    release of the kernel. If the module is not found there, modprobe will look in
    the directory containing modules for a default release. For example we can determine
    the current release of the kernel with the command uname -r.


    When a new Linux kernel, you should move the modules to a directory related to
    the release (and version) of the kernel you are installing. Then you should create
    a symbolic link from this directory to the "default" directory. Each time you
    compile a new kernel, the command modules_install will create a new directory,
    but won''t change the default. This is discussed later in the chapter during kernel
    construction.


    # Kernel Construction


