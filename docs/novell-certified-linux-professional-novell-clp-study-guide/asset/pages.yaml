    Notice this file has the ability to call settings from other files and need

    be self-contained. If you change any of the settings in this file, you must

    restart the xinetd before the changes will be recognized. There are a num-ber
    of ways to do this—rebooting the system, starting and stop-ping networking, and
    so on. The simplest way of doing so, however, is to

    kill the xinetd daemon with

    /etc/rc.d/xinetd restart


    or

    /etc/rc.d/xinetd reload


    Then the daemon will restart—rerading the configuration file when it does.


    > More information on the daemon can be found at http://www.xinetd.org/. The HowTo
    can be found at http://www.debianhowto.org/howtos/en/xinetd/c_xinetd.html.


    # /etc/services File


    This file was mentioned earlier in this chapter, but its real usefulness is that
    it is checked to determine what port a particular service is to use. This ASCII
    file exists on every host by default, and divides the entries into three fields:


    +   * Service—Whatever name also appears in the /etc/inetd.conf file.

    * Port—What port to use.'
