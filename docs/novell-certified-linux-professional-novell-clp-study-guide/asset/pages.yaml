    # # Moving Up to DNS


    In the early days of the Internet, a hosts file was routinely updated and downloaded
    to all hosts for name resolution. The major problem with the hosts method of resolution
    is it must exist on every host, and changes must be made to every copy to take
    effect.


    DNS—Domain Name Service/Server—solves this problem for large networks. Instead
    of putting an ASCII file locally for every host to use, the hosts access a server
    to do the name resolution for them. First introduced in 1984, DNS allows the host
    names to reside in a database that can be distributed among multiple servers.
    The distribution decreases the load on any one server and more than one point
    of administration. It also allows the database size to be virtually unlimited
    because more servers can be added to handle additional parts of the database.


    Configuring a client to use DNS is simply a matter of supplying it with the IP
    address of the server offering this. On operating systems such as Linux, the DNS
    server can be specified in the ASCII file resolv.conf found in the /etc directory.
    A sample of this file follows:


    ```

    ### BEGIN INFO

    # Modified_by: dhcpcd

    # Backup: /etc/resolv.conf.saved.by.dhcpcd

    # Process: dhcpcd

    # Process_id: 1630

    # Script: /sbin/modify_resolvconf

    ```'
