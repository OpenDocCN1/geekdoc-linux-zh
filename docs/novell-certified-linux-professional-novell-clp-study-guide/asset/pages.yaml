    # CHAPTER 8


    +   - Device files—One file exists for each physical device.


    +   - Links—Pointers to other files.


    +   - Sockets—Used to exchange data between two running processes.


    +   - Pipes(also known as FIFOs for First In, First Out)—Like sockets, they are
    used to exchange data, but the data is queued and can only flow one way.


    As the listing illustrated, some of the entries you will find beneath here are
    for the floppy drive, printer, and terminals.


    # The etc Directory


    In everyday language, "etc." is used to mean "and so on." In the Linux world,
    the etc directory is used to hold configuration files and samples are specific
    to this machine. For example, ABC Corporation and DEF Corporation both install
    the same version of Linux on Intel-based machines at their sites. When they do,
    both will have root directories, both will have /bin directories with matching
    sets of utilities in them, and so on.


    One major difference between the two machines will be the values that can be found
    in the /etc directory. The users who log on ABC are not the same as those who
    log on DEF; thus, user accounts are stored in /etc. The groups are not the same
    at the two organizations; again, those related files will be stored here. Other
    files include


    +   - motd—The Message of the Day for showing when logging on


    +   - X11—A folder holding X Windows values


    +   - HOSTNAME—The name of the machine


    +   - hosts—A file that maps hostname to IP addresses for machines available through
    a network


    +   - SuSE-release—The version number of the server


    +   - initab—The configuration file for startup and the runlevels (the init process)


    +   - profile—the login script for the shell


    In a nutshell, the /etc directory holds system configuration files specific to
    a machine and some configuration files.'
  merge: -1
