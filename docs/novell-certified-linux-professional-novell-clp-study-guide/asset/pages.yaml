  md: '# CHAPTER 9


    # Managing Printing


    This chapter focuses on printing. It examines the topic from the exam perspective,
    as well as the real-world perspective, and includes legacy information you may
    need to know if your environment includes a number of older versions of Linux.


    This chapter covers the following course objectives:


    +   1. Installing a Printer in the Linux System (3036)

    2. Configure and Manage Network Printing Services (3037)


    At the risk of oversimplifying, you can set up and configure a small network in
    one afternoon, and then spend the rest of the week trying to configure the printers
    to work properly. This situation is not as bad as it was a few years ago, thanks
    to standardization-printer technology and improvements in operating-system features,
    but it is still far more frustrating than it should be.


    Compared with a number of other operating systems, Linux is far more straightforward
    and configurable in terms of printer setup than some. The best way to understand
    the printing operations within Linux is simply to jump in and start with the simplest
    of operations and then deviate from there. In order to accomplish this, we start
    with the basic model and move up from there.


    # Printing a File


    Let''s start the discussion by looking at the legacy method of printing and move
    up from there. Traditionally, the daemon running within the Linux'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    operating system for the sole purpose of providing printing services is lpd—the
    line printer daemon. This daemon has been around, and is virtually unchanged in
    operation, since the early days of Unix. The first utility written to allow jobs
    to be submitted to the daemon was 1pr. This utility still exists and is included
    in many versions of Linux, but is generally overlooked in favor of 1pr, which
    is a newer utility with more logical options.


    > NOTE focuses on LPRng, CUPS, an alternative to LPRng, is discussed later in
    this chapter.


    Figure 9.1 shows the process running in SuSE.


    A user can choose to print a file in one of two ways:


    +   - From within a graphical interface

    - From the command line


    # FIGURE 9.1

    lpr service is running.


    ![](img/38aae1e03db8863dab67582599f6fc83_287_0.png)


    The simplest syntax to use to the command line is

    1pr {filename}


    So if you wanted to print a file named Saturday, the command would be

    1pr Saturday'
