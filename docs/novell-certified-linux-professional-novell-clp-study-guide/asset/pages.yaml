  md: '# Novell Certified Linux Professional Study Guide


    define classes of ttys and hostname patterns. An example of this file would be


    ```

    # cat /etc/ustty

    USERS

    evan tty3

    kristin tty4 @152.12.14.0/255.255.255.0

    #

    ```


    This restricts evan to only being able to use tty3. It also restricts kristin
    to tty4, or a machine on the 152.12.14.x network. To apply a restriction to all
    users, begin the line with an asterisk (*).


    With ulimit, which was mentioned in several points in the preceding list, you
    can specify that values are either H (hard) or S (soft). If they are hard values,
    they can never be increased. If they are soft values—default—they can be increased.
    Options that can be used with ulimit other than those already listed include


    +   - a to show all current limits

    - f to specify the maximum size of files created by a shell

    - t to specify the maximum CPU time that can be used (in seconds)

    - n for the maximum number of open files


    > NOTE On most Linux systems, the -n setting can be viewed but not set.


    An example of the command in action follows:


    ```

    # ulimit -a

    core file size (blocks) 0

    data seg size (kbytes) unlimited

    file size (blocks) unlimited

    max memory size (kbytes) unlimited

    stack size (kbytes) 8192

    cpu time (seconds) unlimited

