    # fgrep


    The first attempt to greatly enhance grep fgrep—as in either "file grep" or "fast
    grep". This utility was created under the days of Unix and prior to Linux. It
    enhanced grep by adding the ability to search for more than one item at a time
    (something has since gained with the -f option). The tradeoff for gaining the
    ability to search for multiple items was inability to use regular expressions—never
    mind what the acronym stood for.


    Adding the additional functionality to grep, fgrep still exists but is facing
    the inability to use regular expressions here, fgrep still is rarely used in place
    of grep. In fact, one of the options added grep is -F, which forces it to interpret
    the string as a simple string and work the same as fgrep would (the default action
    is -G for basic regular expressions).


    > NOTE For most practical purposes, grep -F is identical to fgrep.


    # egrep


    The second attempt to enhance grep was egrep—as in "extended grep.\ This utility
    combined the features of grep with those of fgrep—keeping the use of regular expressions.
    You can specify multiple values that you want to look for within a file (-f),
    on separate lines (using uneven numbers of quotation marks), or by separating
    with the pipe symbol (|). For example


    ```

    $ cat names

