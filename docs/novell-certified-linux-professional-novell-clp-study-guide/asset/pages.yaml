  md: '# Summary


    This chapter focused on the fundamentals of networking, and in particular TCP/IP.
    After providing background information on the protocol suite, the chapter examined
    the process of configuring the suite. This chapter also looked at a number of
    network services that are available for Linux. The discussion began by looking
    at the daemons that are in charge of networking—inetd and xinetd—and then turned
    to services as Apache, NFS, and DNS before looking at OpenSSH.


    # Command Summary


    Table 11.5 lists the commands that were discussed in this chapter.


    | UTILITY | DEFAULT PURPOSE |

    | --- | --- |

    | arp | Shows the entries in the Address Resolution table |

    | dig | Shows DNS entries |

    | domainname | Displays the domain name used by the host |

    | ftp | A utility for transferring files between hosts |

    | ifconfig | Displays the TCP/IP configuration parameters |

    | ifdown | Stops a preconfigured network interface |

    | ifup | Starts a preconfigured network interface |

    | ifstat | | Displays the status of a preconfigured network interface |

    | netstat | Displays network status information |

    | ping | Displays echo messages to show whether or not a host can be reached |

    | route | Displays the routing table |

    | telnet | A utility for establishing a connection with a remote host |

    | traceroute | Displays the route taken to reach a remote host |'
