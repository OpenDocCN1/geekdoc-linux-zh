    directories have been searched, the result is an error message (“command

    not found”).


    There are several important things to know about the path:


    +   1. You can view your path using the echo command:

    echo $PATH


    +   2. The path does not, by default, include the present directory. Thus you

    can create an executable file in your home directory, it is right before

    y (with ls), and when you type its name, you will be told that the

    command cannot be found. To circumvent this, you can give the full

