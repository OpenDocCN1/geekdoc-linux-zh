    parameters. Here is an example:


    ```

    root:awYeiEwMpfo6:11144:0::7:7:

    bin*:10547:0::7:7:

    daemon*:10547:0::7:7:

    adm*:10547:0::7:7:

    lp*:10547:0::7:7:

    sync*:10547:0::7:7:

    shutdown*:10547:0::7:7:

    halt*:10547:0::7:7:

