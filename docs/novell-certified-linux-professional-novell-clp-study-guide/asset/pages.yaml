  md: '# Understanding Runlevels


    Course Objectives Covered


    +   1. Understand the Runlevel Concept (3036)


    +   3. Manage Runlevels (3037)


    Before diving into the topic of booting the system, it is important to understand
    the concept of runlevels. In many operating systems, there are only two runlevels—functioning
    and turned off (halt). In Linux, however, there are seven different levels of
    functionality at which the operating system can run. These levels are shown in
    Table 7.1.


    TABLE 7.1 Runlevels in Linux

    | RUNLEVEL | DESCRIPTION |

    | 0 | The system is down. |

    | 1 | Only one user is allowed in. |

    | 2 | Multiple users are allowed in, but without NFS. |

    | 3 | Multiple users and NFS. |

    | 4 | Differs by implementation. |

    | 5 | The X environment. |

    | 6 | Shutdown and reboot. |


    At level 0, the system is in a shutdown state requiring a manual reboot. This
    can be called a halt, or powerdown, as well as a shutdown. When changing to this
    level, files are synchronized with the disk and the system is left in a state
    where it is safe to power it off.


    Level 1 puts the system in single-user mode—and is also known as administrative
    mode. This allows only one user (traditionally the root user) to access the system
    and prevents anyone else from getting in. Often, it restricts the login to only
    one terminal as well; the one defined as the console. This is the level to use
    when rebuilding the kernel and doing similar tasks.


    Level 2 is multiple-user mode—allowing more than one user to log in at a time.
    This is the level where background processes (daemons) start up and additional
    filesystems (root is always mounted), if present, are mounted. NFS is not running.'
  merge: -1
  pgno: 237
- img_proc: true
  md: "# 223\nBoot, Initialization, Shutdown, and Runlevels\nCHAPTER 7\n\nLevel 3,\
    \ also known as network mode, is exactly the same as level 2 only\nwith networking\
    \ or NFS enabled.\n\nLevel 4 is left to each vendor to define what they want to\
    \ define it, as, if any-\nthing.\n\nLevel 5 is also known as a hardware state.\
    \ Here, the command prompt is\navailable, and users are allowed to log in and\
    \ out of the X environment.\n\nLevel 6 represents a shutdown and automatic reboot:\
