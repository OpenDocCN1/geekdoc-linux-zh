  md: '# Preliminary GNU and Unix Commands CHAPTER 3


    were incredibly crude and difficult to manage. Many times, you could not see the
    line you were working on (as with ed); instead, you would specify the line, specify
    the change, and then ask to see the line printed to tell if your change was correct.


    The vi editor (pronounced "v—eye") was created by a graduate student named Bill
    Joy (later to become famous as one of the founders of Sun Microsystems). He created
    an editor that was visual—hence the “v”—and interactive—hence the “i”. With this
    editor, you can see the lines in the file, and see the changes being made as you
    make them.


    By today''s standards, vi is now considered to be crude—who want to work with
    such an application when entities as WordPerfect and Microsoft Word exist? The
    answer is that you must know the bases of this editor the following points are
    among its benefits:


    +   - Every version of Linux ships with this editor—you can be assured that it
    will reside on whatever machine you use.


    +   - It has very low overhead. When a system is damaged and configuration files
    must be modified before it can be brought up, you are often prevented from starting
    large applications. This minimal overhead is possible because vi does not have
    the buttons and scrollbars common in GUI (graphical user interface) applications.


    +   - Though considered a “screen” editor, vi also incorporates features from
    “line”—type and “command”—style editors.


    The learning curve be steep when first starting with vi. Lacking the function
    keys and others In their place are mnemonics (“u”, for example, stands for undo,
    and “o” for open a line, and so on.


    # Starting vi


    You start vi by typing on the command line along with the name of a file to create
    (if it does not already exist) or edit (if it does already exist). If the file
    you want to work is in a directory other than your present working directory,
    you can supply the full path to the file as well.


    The following example starts vi in the current directory to create a file named
    first:


    ```

    $ vi first

    ```'
