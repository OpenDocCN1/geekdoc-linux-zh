  md: '# Working with Files

    CHAPTER 4


    The which command is similar to the locate command. Instead of looking through
    a database, however, which looks through the directories listed in your path statement.
    When it finds a match in a directory for a name give, it stops immediately and
    reports what it found. How is this useful? Suppose there are 14 versions of grep
    on your system; which will tell you the first one it finds via the path search,
    and thus the one that is executed when you use the command.


    The following simple example illustrates this:


    ```

    $ which grep

    /usr/bin/grep

    $

    ```


    If you had to think of an analogy for the find utility, it would be to the Swiss
    army knife in the real world, or to grep on steroids in the operating-system world.
    This tool is capable of looking at all entries in the filesystem and displaying
    results that meet criteria. In many ways it is the vast possibilities of the "criteria"
    you can specify that this tool to be so powerful. The syntax is simply

    find [starting point] [criteria]


    The default starting point is the present working directory, but can be specified
    to be anything. Whatever starting point is used, the search will recursively move
    from all of its subdirectories.


    The criteria can be any of the options shown in Table 4.2.


    # Parameters for find


    | OPTION | PURPOSE |

    | --- | --- |

    | -atime days | Tests true if the file was accessed within the number of days
    specified |

    | -ctime days | Tests true if the file was changed within the number of days specified
    |

    | -exec command | Executes a command. You must specify that the command is for
    a group "{}" and continuing on "\;" |

    | -group name | Tests true if the file belongs to the specified group |

    | -inum number | Tests true if the file has that inode number |

    | -links number | Tests true if the number of links is equal to the specified
    number |


    # TABLE 4.2'
  merge: -1
