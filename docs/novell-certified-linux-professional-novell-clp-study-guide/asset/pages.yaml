    # Join


    You can think of the join utility as a greatly enhanced version of paste. It is
    critically important, however, to know that the utility can only work if the files
    being joined share a common field. For example, if join were used in the same
    example as paste was earlier, the result would be


    ```

    $ join fileone filetwo

    $

    ```


    In other words, there is no display. join must find a common field between the
    files in question and, by default, expects that common field to be the first.
    For example, assume that fileone now contains these entries:


    +   11111 Indianapolis

    22222 Columbus

    33333 Peoria

    44444 Livingston

