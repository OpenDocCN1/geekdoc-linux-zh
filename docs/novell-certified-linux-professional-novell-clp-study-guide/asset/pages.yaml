    +   ping—This utility will send echo messages to a host to see if it is reachable.
    If it is, the ICMP protocol on the remote host will echo the response. If it is
    not reachable, the resulting error message will indicate that. Figure 11.3 shows
    results of pinging a host.


    +   route—This utility is used to see and configure routing. If you give the route
    command with no parameters, it displays the current routing table. This command
    is discussed further in the “Configuring Routes” section that follows.'
