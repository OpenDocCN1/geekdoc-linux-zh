    For more than 1200 lines in length, it is not possible to print the entire listing
    for the file, but the lines shown give you a good feel for what is there. It is
    important to know that the ports appearing by default in the service are common
    port assignments for those services. An administrator can change the service to
    using for security, or other purposes. This still allows the service to run, but
    now requires the user to know of—and specify—the new port.


    One of the best examples of this is the www service, which runs on port 80, by
    default. If you make a website available to the world, using the Fully Qualified
    Domain Name (FQDN) of www.ds-technical.com, then anyone in the world can enter
    that address and want to reach your site by making a call to port 80. On the other
    hand, if you want the site to be up, and accessible from anywhere, yet only used
    by employees in the outbound, you can move the www service to one not being used
    by anything else—15000 for example. Now, anyone entering www.ds-technical.com
    will still be hitting port 80, and unable to use the www service there. Your employees
    will use www .ds-technical.com:15000 and be able to operate as they would with
    a regular website.


    # Network Access


    You can access to your network host to explicitly name machines via the use of
    either a hosts.allow file or a hosts.deny file, both of which reside in the /etc
    directory. The syntax within these files is:

    daemon: group


    They limit who is allowed in (to those specifically named in the .allow file)
    or limit who cannot come in (to those specifically named in the .deny file). The
    use of variables as ALL to indicate all services or ALL EXCEPT to indicate all
    but a particular service is allowed in both files.


    By default, both files exist on a host, though their lines are commented out.
    To recap


    +   - hosts.allow is used to specifically list the names of other hosts that can
    access this machine through any of the /usr/sbin/tcpd services.


    +   - hosts.deny is used to specifically list the names of other hosts that cannot
    access this machine through the /usr/sbin/tcpd services.'
