    To understand the command line and work there effectively, you must understand
    the processes that are taking place. Within Linux, the shell is the command interpreter.
    It takes commands that a user gives, processes them (or them to the appropriate
    utility/interacts with the kernel), and formats results for the user. Thus, the
    shell is the mediator between the operating system and the user. Not only can
    it interpret commands, but it can also handle redirection (input and output),
    filename generation, some programming, variable substitution, piping, and a host
    of other services.


    A number of different shells (interpreters) are available, and different versions
    include different combinations of choices with their operating systems. The simplest
    of all is the Bourne shell (sh), which is one of the earliest ones created for
    the Unix platform and offers the smallest number of features. The Korn shell (ksh)
    was one of the first to expand upon, and deviate from sh, and it includes a larger
    number of options. The Bourne Again shell'
