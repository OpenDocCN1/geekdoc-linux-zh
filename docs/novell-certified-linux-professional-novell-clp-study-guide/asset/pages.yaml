  md: '# NIS


    The Network Information Service (NIS) acts as a giant phone book, or Yellow Pages,
    to resources distributed across the network. NIS acts as so much a directory,
    in fact, most of the files and utilities begin with the letter yp as a carryover
    from when it was known as that. The three components of NIS are


    +   - Master-server—There must be at least one running the ypvers program and
    holding the configuration files.

    - Slave-servers—These are optional and not used in small networks. When used,
    they act as intermediaries on behalf of the master server in processing requests.

    - Clients—These run the ybind program and retrieve data from the server.


    An NIS network is organized into domains with the /etc/defaultdomain file defining
    the domain and /etc/yp.conf holding the server address. Common resources mapped
    with NIS include user information (/etc/passwd), group information (/etc/group),
    and services (/etc/services), though you can add any more.


    There are a number of utilities to know work with NIS:


