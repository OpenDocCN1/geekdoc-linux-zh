    System administration would be so much easier if nothing ever moved or changed.
    Unfortunately, it is very rare for anything to stay any more, and changes take
    place at a nonstop pace. Linux offers two powerful utilities for copying and moving
    files: cp and mv, respectively, and a third utility—dd—that combines features
    of both.


    # cp


    cp works with both files and directories and can move multiple entities at time
    using wildcards. After the name of the utility, you must specify the source, followed
    by the target. The simplest use of all can be illustrated as follows:'
  merge: -1
