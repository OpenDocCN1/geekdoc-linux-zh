  md: "# Configuring Networking Services\n\nCourse Objective Covered\n\n+   8. Enable\
    \ the Extended Internet Daemon (xinetd) (3037)\n\nWithin Linux, there is a superdaemon\
    \ known as init, which is responsible for bringing up the services required at\
    \ specific runlevels and maintaining the integrity of the system. The init daemon\
    \ will start and stop other daemons such as the system logger (syslogd), the swapper\
    \ (kswapd), and so on. One of the daemons it starts is a superdaemon over networking\
    \ services: xinetd (also known as the extended Services Daemons).\n\nThe xinetd\
    \ daemon is a replacement for init that offers a vast improvement in security.\
    \ The configuration options are now modularized. For the exam, you need to know\
    \ that this daemon is a replacement for init and can be downloaded from a number\
    \ of sites and used in place of the original.\n\n> As a general rule, any process\
    \ with a last character of \"d\" is a daemon.\n\nWhen started, the xinetd looks\
    \ at its configuration file, /etc/xinetd.conf, and determines from it what additional\
    \ services it is responsible for. By default, this file exists on whether it is\
    \ used or not. If it is not used, most of the lines are commented out. Following\
    \ is an example of the default file:\n\n```\n#\n# xinetd.conf\n#\n# Copyright\
    \ (c) 1998-2001 SuSE GmbH Nuernberg, Germany.\n# Copyright (c) 2002 SuSE Linux\
    \ AG, Nuernberg, Germany.\n\n{\n    log_type        = FILE /var/log/xinetd.log\n\
    \    log_on_success  = HOST EXIT DURATION\n    log_on_failure  = HOST ATTEMPT\n\
    \    only_from       = localhost\n}\n```"
  merge: -1
  pgno: 389
