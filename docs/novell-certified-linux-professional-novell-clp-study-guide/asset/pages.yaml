    ##

    ## The SAMEUSER and SAMEHOST are options that form values from

    ## information in control files or connections. The GROUP

    ## entry searches the user group database for group names

    ## matching the pattern, and then searches these for the user

    ## name. If the name is found, the search is successful.

    ## The SERVER entry is successful if the request originated

    ## from the current lpd server.


    ## Note carefully that the USER, HOST, and IP values are based

    ## on values found in the control file currently being checked

    ## for permissions. The REMOTEUSER, REMOTEHOST, and REMOTEIP

    ## are based on values supplied as part of a connection to the

    ## LPD server, or on the actual TCP/IP connection.


    ## The LPC entries match an LPC command. For example LPC=topq

    ## would match when an lpc command is being executed. You

    ## must still have the SERVICE=C entry to trigger this action.


    ## Note: the SERVICE=R and SERVICE=P both check the LPR actions

    ## of sending a job. However, SERVICE=R does it when the job

    ## is sent to the LPD server. Some LPD and (LPR)

    ## implementations cannot handle a job rejected due to

    ## resend the job. This is the reason for the SERVICE=P check.

    ## You can accept the job for the printing, and then have the

