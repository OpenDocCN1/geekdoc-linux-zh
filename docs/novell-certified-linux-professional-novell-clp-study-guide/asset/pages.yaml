    5. The hard disk is prepared/partitioned. This will take a few minutes and you
    may need to make other changes later if you are implementing RAID or LVM devices.
    At a minimum, two partitions are created: root and swap.


    6. Packages are installed next, and you will need to insert many CDs as prompted.
    Your goal is usually to complete the installation as quickly as possible, so you
    can go back and add any packages at a later point in time.


    7. You are prompted to give a password for the root user (and enter twice for
    verification). The password can consist of digits, letters, and the standard punctuation
    characters. It is recommended that it contain at least five characters—at a minimum—the
    case is mixed between upper and lower. If you enter more than eight characters,
    you will be prompted to truncate or change it.


    8. Network configuration occurs next and a scan is automatically done to detect
    network cards, DSL connections, ISDN adapters, and modems. A summary screen shows
    you the values found as well as the current settings for Proxy (default is disabled)
    and VNC Remote Administration (default is disabled). You can change any of these
    values, go back, or put the network settings shown to you into effect by clicking
    Next.


    9. After the network configuration is written/saved, the Internet connection is
    tested. This operation is purely optional and you can choose to skip the test
