    There are several things to notice in the display shown. In no particular Order,
    they are as follows:


    +   - Processes started when the system came up have the lowest number PIDs (items
    1 through 19). As a general rule, these are mission-critical processes, and if
    they were not some, or all of the system would be unusable.


    +   - Not all processes are tied to a terminal. If a question mark (?) is present,
    it indicates that the process is running on the system without terminal interaction
    and/or a terminal being default standard output.


    +   - For every terminal using a user, there is a getty, or mengetty, running.
    This process sits and waits for a user to attempt to log on. Even though no user
    is using tty tty6, it is easy to see that six other terminals can be used.


    Other options that can be used to determine what information to display


    +   - 1 to display a long listing (think of ls -1)

    - u to show username and related stats

    - f to show a full listing (everything possible)


    The latter is often used, and favored by administrators, for the additional columns
    it adds to the display:


    ```

    $ ps -f

    UID       PID PPID C TTY          TIME CMD

    root      7054 7053      0 Oct2 pts/1  00:00:00 /bin/bash

    root      13745 7054      0 09:45 pts/1  00:00:00 ps -f

    $

    ```


    There are four columns that were not before. The first column identifies the user
    ID associated with the process. The third column is the Parent Process ID—showing
    which process one reports back to. The fourth column identifies whether scheduling
    is involved, and the fifth column is the time at which the process started.'
