    The first order of business the shell undertakes when given this command is that
    it creates a file named myfile with a size of zero. It then allows the ls utility
    to run and places the output within the newly created file rather than on your
    screen. It is important to remember the order of operations. Suppose you give
    a nonexistent command, such as this:


    ```

    ls -z > myfile

    ```


    The file named myfile is still created with a size of zero that stays at zero.
    The error appears on your screen, but this is after the file was created. This
    is also important because you want to add more information to the file, the file
    will be overwritten first. To add more information, you must append to the file
    using greater-than signs (>>):


    ```

    ls -1 >> myfile

    ```


    This adds the new information to the existing file and keeps the original contents
    intact. In some situations, you want a command to run but don''t care at all about
    what the results are. For example, I might want a database to compile and need
    to run a utility for this to happen. I don''t care about the messages generated—I
    just want the utility to run. When this is the case, you can send the results
    to specifying /dev/null:


    ```

    ls -F > /dev/null

    ```


    The results are sent to this device, which is also known as the trashcan, never
    to be saved or displayed.


    Standard input is typically the keyboard, or interpreted to be among the arguments
    given on the command line. You can, however, specify redirection of standard input
    using the less-than sign (<). Rarely is there ever a need for this, but it is
    available. For example


    ```

    cat myfile

    ```


    will get the same results as


    ```

    cat < myfile

    ```


    In the world of Linux, numerical values exist for these items as well. Standard
    input (abbreviated stdin) is 0, and standard output (abbreviated stdout) is 1.
    These numbers can be used with the redirection, but this is rarely done. An example
    would be


    ```

    ls -F 1> myfile

    ```'
