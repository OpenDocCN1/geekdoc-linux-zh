  md: '# Working with Numbers


    Course Objectives Covered


    +   1. Use Basic Script Elements (3038)

    2. Use Variable Substitution Operators (3038)

    4. Use Advanced Scripting Techniques (3038)


    By default, all variables are considered to be strings, and most of the time,
    this does not matter at all. When you are looking for employee number 12345 in
    a text file, it matters not if the value you are looking for is considered string
    or a number: As long as matching lines are returned, you are happy.


    Numerical variables do a role, however, when you want to perform an action based
    on their value. Consider the following example and its results:


    ```

    $ x=7

    $ echo $x

    7

    $ x=$x+5

    $ echo $x

    7+5

    $

    ```


    Because everything is seen as a string, as far as the shell knows, you just added
    more text to the string. Enter the expr utility—its purpose is to work with expressions
    and interpret them rather than work with them blindly. Revisiting the earlier
    example, but now using this utility, the sequence becomes


    ```

    $ x=7

    $ echo $x

    7

    $ x=`expr $x + 5`

    $ echo $x

    12

    $

    ```


    Another method is to use the typeset command to declare variables as numbers.
    The expr utility exists regardless of which shell you use, whereas typeset is
    not included in all shells (true sh for example). The typeset command is included
    in bash and ksh and the -i option is used to declare the variable as an integer.
    When using typeset, you then use let as its counterpart to perform arithmetic
    functions.'
  merge: -1
  pgno: 230
