    services possible. OpenLDAP is the most popular implementation of LDAP for the
    Linux environment, and it allows you to organize entries into a hierarchical tree
    with all the expected objects—distinguished names, and so on.


    Object classes within LDAP are defined in schema files, which can be found at
    /etc/openldap/schema and contain these classes:


    +   * Root—The root of the directory

    * c—Countries

    * o—Organizations

    * oou—Organizational units

    * dc—Domain components


    Complete administration information for OpenLDAP can be found at http://www.openldap.org
    in the Admin Guide and the Quick Start Guide. For this exam, know that the configuration
    files are beneath /etc/openldap and the two primary files are


    +   * slapd.conf—The main configuration file

    * ldap.conf—The default configuration for the clients


