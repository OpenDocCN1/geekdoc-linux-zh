    Two commands can be used to change the runlevel at which the machine is currently
    operating: shutdown and init. In reality, the shutdown command is nothing more
    than an interface to init, offering a few more friendly features.


    The init utility resides in the /sbin directory and must be followed by a number
    (0–6) or the letters "S" or "s". The numbers identify runlevel to change, and
    the "S" and "s" signify single-user mode ("S" allows only root, where "s" does
    not care which single user). To change to runlevel 2, the command would be


    ```

    init 2

    ```


    > The telinit utility works the same as init, and can be used in place of it.
    It is just a link to init.


    The shutdown utility offers a few more options. It informs all users currently
    logged in that the system is changing state and allows a time (delay) to be specified
    before the change takes place. Options that work with the utility are


    +   - F to force fsck to run after the reboot (the default)

    - -f to prevent fsck from running after the reboot, thus creating a file

    - -h to halt after shutdown (level 0)

    - -k to send out a warning to all users but not really change state

    - -r to reboot after shutdown (level 6)

    - -t to specify the number of seconds before the change begins


    If no parameters are specified, the default runlevel shutdown attempts to is level
    0. An example of this utility would be


    ```

    $ shutdown -h -t3 now

    ```


    This forces a change to runlevel 0 (-h) three seconds (-t) from the current time
    (now). Notice that a time must always be specified. If any other text'
