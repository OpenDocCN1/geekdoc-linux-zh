    You can change the value of umask by specifying a different value on the command
    line (umask 15, for example), and this value will be used for the session. The
    variable is defined in the login information, and will revert to its normal value
    at the beginning of each session.


    # Changing Values


    To change permissions on a file or directory, you can use the chmod utility. The
    arguments the utility will accept can be either numeric or symbolic. For example,
    to change the permissions of a file to allow all and write to it, you could this:


    ```

    $ ls -l turbo

    -rw-r--r-- 1 root root 14 Sep 6 22:42

    tturbo

    $ chmod 666 turbo

    $ ls -l turbo

    -rw-rw-r-- 1 root root 14 Sep 6 22:42

    turbo

    ```


    In symbolic format, "u" signifies user, "g" is group, and "o" is other. You can
    choose to add to existing permissions:


    ```

    $ ls -l turbo

    -rw-r--r-- 1 root root 14 Sep 6 22:42

    turbo

    $ chmod go+w turbo

    $ ls -l turbo

    ```'
