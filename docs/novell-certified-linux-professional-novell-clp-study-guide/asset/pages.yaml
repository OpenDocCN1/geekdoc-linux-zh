  md: '# Shells, Scripting, Programming, and Compiling

    CHAPTER 6


    When there are a limited number of choices a user can make within a script, you
    can hard-code actions for those choices using the case command. The syntax for
    this is


    ```

    case {variable} in

    {first choice}) {commands} ;;

    {first choice}) {commands} ;;

    {first choice}) {commands} ;;

    esac

    ```


    Notice that each possible choice must end with two semicolons (;;), and the entire
    procedure ends with the esac command (which is “case” spelled backward). A rudimentary
    example of the case command would be the following:


    ```

    #!/bin/sh

    # to illustrate use of case

    echo -n "Enter a letter from A-E: "

    read letter

    case $let in

    A) echo "ASCII value is 65";

    B) echo "ASCII value is 66";

    C) echo "ASCII value is 67";

    D) echo "ASCII value is 68";

    E) echo "ASCII value is 69";

    *) echo "Letter does not exist within range";

    esac in c

    ```


    Notice the use of the asterisk (*) as a choice—this will be run if nothing else.
    When case is used, the script scans the possible values one by one in sequential
    order; as soon as it finds a match, it executes that of commands (up to the first
    set of double semicolons) and drops to esac. Given this, you would always want
    to include an “everything else” entry (using the asterisk) and make certain it
    is at the bottom of the list of choices.


    Another item of fact is case—like almost everything in Linux—is case-sensitive.
    If you are going to include choices for user input, make certain you accept all
    valid values. An excellent example of this would be a choice displayed on a menu
    for the user to quit the script without execution. You would want to accept both
    “Q” and “q” as valid entries. There are at least three possible solutions to handle
    this. First, this could be done the hard way by duplicating entries:


    ```

    Q) exit ;;

    q) exit ;;

    ```'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'Second, you could separate accepted values with a pipe (\|) symbol:


    ```

    Q|q) exit ;;

    ```


    Alternatively, you could convert all accepted variables to uppercase (or lowercase)
    using `tr` after reading in the variable and before starting case.


    # A Mild exit


    Over the last several pages, the **exit** command has been used quite a bit. Whenever
    you need to stop execution and leave the script, **exit** is the command to use.
    But what if you need to leave only a portion of the script? The script files we
    have seen so far have been relatively short—only a few lines long—but in the real
    world they grow to hundreds of lines in length as you pull values from files and
    piece together reports, and so on.


    If you need to exit only a portion of the script, the **break** command is the
    one to use. It is rare to see this command used other in conjunction with **case**,
    as the two compliment each other perfectly. The **break** command, in this case,
    will leave the **entire** case procedure, but continue to execute the rest of
    the script. A simple example would be


    ```

    {some commands for adding text}

    while true

    echo -n "Enter S to save or Q to quit: "

    read action

    case $action in

    S|s){save commands}

    break ;;

    Q|q) exit;

    *) echo "Invalid Response"

    esac

    done

    echo You are now ready to read data

    {some commands for reading data}

    ```


    In this example, the **case** procedure is somewhere in the middle of the script
    after the user has entered data. The user is prompted to either enter "S" to save
    or a "Q" to quit—the **while** loop verifies that only one of these two values
    will be accepted (upper- or lowercase). If the user chooses to save, the commands
    to save are run, and a **break** is used to get out of the loop and continue to
    the commands to read data. If the user chooses to quit, an **exit** is invoked
    and nothing further in the script is executed.'
  merge: -1
  pgno: 229
