  md: '# CHAPTER 14


    # Sample Practicums


    The reading is over. Now it is time to take what you learned from the chapters
    of this book and apply it to problem solving. One of the underlying principles
    of learning is known as Bloom''s Taxonomy. To oversimplify, one of the things
    this principle states that there are various levels of understanding. At the bottom
    there is only knowledge—being able to recite facts and figures—and higher up there
    is the ability to apply that knowledge.


    The CLP exam is not a knowledge-level exam—it does not ask you who Linux is named
    after offer four multiple-choice answers. The CLP exam is a practicum-based test
    asking you to complete a series of tasks.


    What follows are two sample practicums. At this point, you should be able to work
    through these tasks without referring to this book or any other help source. Use
    your ability to do so as a guide to how prepared you are for the real exam. If
    you have no problems breezy through, you should consider scheduling an exam. On
    the other hand, if you get stuck, or need to look up information, more studying
    should be undertaken.


    # Practicum One


    You are the head Linux administrator for a medium-sized company. A new server
    has been ordered and has just arrived with only a base installation. This server
    will be at a remote office managed primarily by the sales department. You need
    to configure this server to do the tasks for which it was purchased.


    The server will need to function according to the requirements given in Table
    14.1.'
