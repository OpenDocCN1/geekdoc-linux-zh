    # Working with Links


    The purpose of a link is to allow one file to be referenced by more than one name.
    There are many reasons why you would want or need to do this, for example:


    +   1. For historic purposes—Assume you want to combine all the vendor information
    into a single file. In the case, marketing has always had a file where they kept
    similar information and called *vendor*, while accounting their information in
    a file called *contacts*, and admin called their *references*. When you create
    the single file, you can make it available by all three names so that all parties
    can find it as they formerly did.

    2. For the nonlocal look local—Assume there is a template that all users are to
    use when making system modification requests. This file can exist in the root
    user''s home directory (/root*), and a link created within each user''s home directory
    (/home/user*) to make it appear as if it exists within their directory.'
