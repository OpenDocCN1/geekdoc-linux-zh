  md: '# Novell Certified Linux Professional Study Guide


    The first variable (one) identifies what you want to search for in terms of a
    string value. The second variable (two) identifies the file to search through.
    Thankfully, the shell language understands the use of variables such as these,
    and has several ways of referencing them:


    +   - $0 is the text used to summon the utility itself.

    - $1 is the first variable given.

    - $2–9 represent other variables that can be given.

    - $* represents all variables, regardless of how many there may be.

    - $# shows the number of variables that have been given.


    Consider the following example of an executable script:


    ```

    $ cat show

    echo $1 $2 $3 $4

    $

    $ show one two three four

    one two three four

    $

    ```


    The script (show) simply takes four variables and echoes them to the screen. If
    more than four variables are given, it only shows four, because that is all it
    is coded to do:


    ```

    $ show one two three four five six seven

    one two three four

    $

    ```


    Similarly, if fewer than four variables are given, empty values are echoed:


    ```

    $ show one two

    one two

    $

    ```


