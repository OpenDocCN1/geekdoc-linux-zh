  md: '# Installing Software


    Course Objective Covered


    +   6. Manage the Kernel (3037)


    There are several primary methods of software distribution within the Linux community.
    One is to use of the package management systems, which we will look at later.
    The second is to use the compressed "tarball" file. The tarball is a single file
    containing a tar image of set of files.


    You know are working with a tarball or compressed tarball because there is a .tar
    or .tar.gz on the end of the filename. For example, the following files tarballs:


    ```

    program-1-2-3.tar.gz

    program-1-2-3.tar

    ```


    But the following example is not:


    ```

    program-1.2.3.rpm

    ```


    To install a tarball, you must first identify the software you want to install,
    and obtain it from a provider. For example, to get wumpus from ftp.ccil.org, we
    use ftp as shown in the following example:


    ```

    ftp> bin

    200 Type set to I.

    ftp> get wumpus-1.3.tar.gz

    local: wumpus-1.3.tar.gz remote: wumpus-1.3.tar.gz

    227 Entering Passive Mode (192,190,237,102,124,145)

    150 Opening BINARY mode data connection for wumpus-1.3.tar.gz

    --> (9293 bytes).

    226 Transfer complete.

    9293 bytes received in 0.20 secs (44 Kbytes/sec)

    ft>

    ```


    This results in wumpus-1.3.tar.gz on your system, which must be compressed and
    then untarried. You can do this in one or two steps. The two-step approach, which
    has traditionally been used, involved uncompressing the file and then untaring
    the files. This is done using the following commands:


    ```

    # gzip -d FILE

    # tar xvf FILE

    ```'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# 301

    Administrative Tasks Revisited

