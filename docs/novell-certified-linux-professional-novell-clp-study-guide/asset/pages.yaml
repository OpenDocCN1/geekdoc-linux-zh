    # Working with Filesystems


    This chapter focuses on Linux filesystems and how to interact with them.

    This chapter looks at and covers the following course objectives:


    +   1. Understanding the File System Hierarchy (3036)

    2. Identify File Types in the Linux Systems (3036)

    3. Select a Linux File System (3037)

    4. Configure Linux File System Partitions (3037)

    5. Configure a File System with Logical Volume Management (3037)

    6. Configure and Manage a Linux File System (3037)

    7. Monitor the File System (3038)


    In this chapter, you''ll also learn about the utilities used to work with disks
    and and filesystems.


    # Laying Out the Filesystem


    Course Objective Covered


    +   1. Understanding the File System Hierarchy (3036)


    # The Standard Disk Layout


    During the installation of Linux, a number of directories are created to hold
    system files. Under any normal installation, regardless of the vendor, the file
    structure depicted in Figure 8.1 will be created.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    FIGURE 8.1

    The standard directory layout in Linux.


    ![](img/38aae1e03db8863dab67582599f6fc83_255_0.png)


    The /sys directory does not appear in Figure 8.1. This is a virtual entity created
    by the addition of devices to the system and was discussed in Chapter 7, "Boot,
    Initialization, Shutdown, and Runlevels."


    Together, these directories adhere to the Filesystem Hierarchy Standard (FHS).
    Each of these directories is discussed in the following sections.


    More information about the Filesystem Hierarchy Standard can be found at http://www.pathname.com/fhs.


    # The Directory


    Everything begins at the root directory (/). This is the beginning of which everything
    else becomes a subdirectory, or subcomponent beneath the root directory. When
    specifying locations and using absolute addressing, you always start with the
    root directory; it is impossible to go any further.


    The single and double period that appear at the top of the listing in Figure 8.1
    are shortcuts that appear in each directory. The single period (.) is a shortcut
    for the directory you are currently in, and the double period (..) is a shortcut
    for the parent directory of this directory. In the case of /, there is no parent
    directory for it, but the shortcut appears in the listing anyway.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# The bin Directory


    The **bin** directory holds the binaries (executables) that are essential to using
    the Linux operating system. A large number of the utilities discussed thus far
    are located here, including


    +   - cat

    - cp

    - date

    - dd

    - gzip

    - ls

    - mkdir

    - mv

    - ps

    - rm

    - sed

    - vi


    As a rule of thumb, the executable/binary files located in this directory are
    available to all users. Binary files that are not critical to the operation of
    the system or needed by all users are commonly placed in `/usr/bin` instead of
    here.


    # The boot Directory


    The **boot** directory houses the files needed to boot the system, minus configuration
    files, as well the kernel. In some implementations, the kernel is stored in the
    / directory (a holdover from the days of Unix), but in most newer versions, `/boot`
    contains all the files needed to boot (including the kernel) *except* the configuration
    files.


    # The dev Directory


    The **dev** directory holds the device definitions. When you drag a file to a
    graphical icon of the floppy drive on the desktop, it is possible because a definition
    for the floppy drive is held in the `/dev` directory. There is a definition file
    associated with every device, whether it is a terminal, drive, driver, and so
    on. The following listing shows a few of the files beneath the directory (some
    of the names have been changed to make the entries more decipherable):'
  merge: -1
