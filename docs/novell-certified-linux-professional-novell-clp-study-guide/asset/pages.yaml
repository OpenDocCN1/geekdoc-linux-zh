  md: 'performing filesystem repairs. Each filesystem has a code associated with it,
    and is used by fdisk to specify the filesystem type.


    Some of the valid filesystem types are listed in Table 8.1.


    NOTE

    You can obtain a current list of the filesystems available by using the fdisk
    utility, choosing m, then I. This is discussed further in the "Working with Hard

    Disks" section later in this chapter.


    # TABLE 8.1


    # Valid Filesystem Types


    | CODE | FILESYSTEM TYPE |

    | 5 | Extended |

    | 6 | FAT16 |

    | 7 | HPFS |

    | 8 | AIX |

    | 85 | Linux Extended |

    | 86 | NTFS |

    | 1b | Windows 95 FAT32 |


    At the very least, your Linux system will require the following:


    +   - A boot partition

    - A swap partition


    You can also have any other primary or extended partition as desired. It is recommended
    that you use a primary partition for the boot partition. This eases recovery in
    case of problems later, as only a small amount of data is lost.


    While running, Linux will swap pages of memory to out when the contents have not
    been used for some time. This is much slower than adding more physical memory.
    If you find your system is swapping a lot, it is time to add more memory.


    As discussed earlier, if necessary you can fit everything, including your swap
    file, in a single partition. However, this does not limit how the filesystem is
    managed and the growth of the data within the filesystem. For example, if your
    user mailboxes are on the root filesystem and it fills up, the system will effectively
    hang.'
  merge: -1
