    # Working with NFS, smb, and nmb


    Course Objectives Covered


    +   5. Configure Network File Systems (3037)

    6. Manage Resources on the Network (3037)

    19. Configure a Samba Server as a File Server (3038)


    These objectives address sharing. The three subcomponents of this topic have only
    a passing familiarity with each other, but all fall within the broad category
    of file/directory sharing.


    # NFS


    NFS is the Network File System, and the way in which partitions are mounted and
    shared across a Linux network. NFS falls into the category of being a Remote Procedure
    Call (RPC) service. NFS utilizes three daemons—nfsd, portmap, and rpc_mountd—and
    loads partitions configured in the /exports file. This file exists on every host,
    by default, but is empty. Within this file, you must specify the partition to
    be shared and the rights to it.


    The NFS server can be started with the /etc/init.d/nfsserver start command and
    the daemons rpc.nfsd and rpc.mountd are spawned. rpc.nfsd is the service, although
    rpc.mountd acts as the daemon.


    Problems with NFS generally fall into two categories: errors in the /exports listings
    (fixed by editing and correcting them) or problems with the daemons. The most
    common problem with the daemons involves their not starting in the correct order.
    The portmap daemon must begin first, and is the only daemon needed on a host that
    accesses shares but does not offer any.'
