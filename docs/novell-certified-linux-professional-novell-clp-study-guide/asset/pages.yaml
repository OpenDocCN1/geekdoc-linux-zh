  md: '# Novell Certified Linux Professional Study Guide


    Although Apache is included with most Linux implementations, including SuSE, you
    can obtain documentation and any newer versions of it that become available from
    www.apache.org.


    The primary daemon running Apache is httpd and unlike the others, is started by
    the inetd when networking begins. If you want Apache to start automatically when
    the system is booted, you need to add it to the default runlevels'' directory.


    The exam objective specifies the need to know how to manage the httpd files, which
    is an important point because in the newest versions of Apache, there is only
    one configuration file—etc/apache2/httpd.conf. In older versions, httpd.conf looked
    for additional values in two other files:


    +   access.conf allowed certain pages of the website to be restricted to individual
    users or groups.


    +   srm.conf specified the root directory for the website.


    The default directory now being examined for data files by Apache is /srv/www/htdocs.
    This is the directory that the user will first enter when giving the address of
    the server at an http:// prompt. The default file looked for, and loaded, in this
    directory is index.html.


    Other configuration files to know beneath /etc/apache2 are


    +   default-server.conf—The Default server settings. These are overwritten by
    settings in all other files.


    +   error.conf—This allows you to configure what should happen upon an error.


    +   listen.conf—The configuration file for the port to be used by Apache (80 is
    the default).


    +   server-tuning.conf—Fine-tuning parameters for the server. Under all circumstances,
    the defaults are fine.


    +   ssl-global.conf—This file allows you to configure the Secure Socket Layer
    (SSL) configuration.


    +   uid.conf—This defines the user and group ID that will be used by the anonymous
    user accessing Apache.


    +   vhost.d—A subdirectory that holds the configuration files for virtual hosts.


