  md: 'Novell Certified Linux Professional Study Guide


    Every process has a unique process ID number associated with it—its PID. The process
    may be started by another (its parent, which would have a parent ID, or PPID),
    and may start other processes as well (child processes). Some processes run in
    the foreground, meaning that they need attention within a terminal window, and
    others in the background. Many user processes can be switched from the background
    to the foreground, and the reverse, without affecting their operation.


