  md: '# Working with PAM


    Course Objectives Covered


    +   4. Describe Basic Linux User Security Features (3037)

    7. Configure User Authentication with PAM (3037)


    To increase security, Pluggable Authentication Modules (PAM) can act as intermediaries
    between users and applications. When users are authorized in PAM, they are free
    to access the applications that are available to them. The beauty of this arrangement
    is that you can change any one element in the process, and not affect anything
    else. For example, suppose you are requiring users to enter a password to authenticate
    themselves, and giving them access to 10 applications. You can change the authentication
    method from a fingerprint scan, and then allow them the access to the applications
    without having to reconfigure anything but the authentication method.


    Global files are located beneath /etc/security. Individual configuration files
    for PAM modules are located beneath /etc/pam.d, as shown in Figure 5.1.


    FIGURE 5.1

    Configuration files exist for each program that uses PAM modules.


    ![](img/38aae1e03db8863dab67582599f6fc83_187_0.png)'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Basic Linux Administration

    173 CHAPTER 5


    Notice that the names that appear here have the same name as the utility with
    which they are associated. When a user uses one of these applications, a check
    is made in this directory for an associated configuration file. If found, it is
    read and acted upon.


    Some of the configuration files are only a single line, whereas some are more
    lengthy. Figure 5.2 shows the contents of the su configuration file.


    # FIGURE 5.2

    The configuration file for su.


    ![](img/38aae1e03db8863dab67582599f6fc83_188_0.png)


    There are four fields to each line in the file. The first field identifies the
    module type, and the second is the control flag. The third field lists the modules
    to use, and the fourth (which is optional) lists any arguments that are needed.


    There are four possible values for the module type:


    +   - account—This identifies a need to see if the user has permission to use
    the service he wants.

    - auth—This identifies a need to check the user’s authenticity. This is most often
    accomplished with a password.

    - password—This allows a change in the access/authentication token. Usually, a
    change is done by issuing a password.

    - session—This is the module type used to govern the session between the application
    and the user.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    There are four possible values for the control flags:


    +   - optional—There are no adverse consequences associated with the success/failure
    of this flag.


    +   - required—The flag must be marked successful before being allowed to continue.
    Any other associated flags are processed upon failure, and then the user is told
    there was a problem.


    +   - requisite—Similar to required, except that no other associated flags are
    processed upon a failure and the user is immediately told there was a problem.


    +   - sufficient—If the flag is successful, no other modules need to be processed
    (this is sufficient). If there is a failure, there are no direct consequences.


    The modules are identified in the third field and in /lib/security on most systems,
    and /lib64/security on 64-bit platforms. The arguments that can be passed are
    any that are needed, the most common being debug and nullock. The debug argument
    is used to enable debugging, whereas nullock is used to allow empty passwords
    to be counted as legitimate entities.


    The first line in Figure 5.2 states that the pam_rootok.so module (third field)
    will be used from /lib/security without any arguments (fourth field) to authorize
    (first field) via an authentication request that must be sufficient (second field)
    to continue. This is what you would expect with the su utility when changing from
    one user to another, and makes logical sense.


    The /usr/share/doc/packages/pam/ directory holds the documentation for PAM on
    SLES 9. There is a README in the main directory and beneath the modules subdirectory.
    An Administrators’ Guide can be found in a variety of formats beneath subdirectories
    for txt, pdf, and html.


