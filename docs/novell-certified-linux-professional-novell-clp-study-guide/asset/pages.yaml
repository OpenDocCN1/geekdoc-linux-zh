  md: '# The usr Directory


    Originally an acronym for "user-specific resources," *usr* is now an enormous
    directory with a large number of subdirectories. Subdirectories beginning with
    X are used to define the X Windows environment. The **bin** subdirectory, as has
    been the case each time the same name has been encountered, contains user binary
    (executable) files. The files placed here include


    +   - cut

    - diff

    - file

    - grep

    - killall

    - nl

    - passwd

    - wc


    > As a general rule, necessary utilities for all users are stored in /bin, whereas
    ones that are helpful (but not critical) are stored in /usr/bin. Those for system
    administrative tasks are stored in /sbin.


    > Not all the subdirectories beneath /usr are necessary and they will differ slightly
    based upon the type of installation chosen.


    The **include** directory holds C program header files, whereas **lib** offers
    more libraries for the C-based programs. The **local** directory is a temporary
    holding facility used during installation and the subdirectories beneath it should
    be empty.


    The **sbin** directory (yet again) holds system-specific binaries. Most of the
    utilities found in this subdirectory are related to managing the system from the
    standpoint of adding users, and groups as well as working with networking. These
    are noncritical utilities that the system can function without them, and an administrator
    could manage them as well; it would be more difficult, but certainly possible.


    The **share** directory holds information specific to the machine for certain
    utilities, and holds the **man** directories for manual pages. Lastly, the **src**
    directory contains the operating-system source code.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# The var Directory


    The name var is derived from the word variable, and the data contained beneath
    this directory is fluctuating in nature. There are typically a number of subdirectories
    used here to hold dynamic files, such as pools, logs, and so on.


    The main directories to know these variables are


    +   - lock—Holds locked files

    - log—Used for log files such as those created by login and logout (wtmp), who
    is currently using the system (utmp), and for mail, the spooler, and so on

    - run—Files needed for the runlevel

    - spool—Spooled data waiting for processing (such as printing)


    # Other Directories


    Other directories can be created and exist beneath the / directory. Those listed
    in the preceding sections are always present, and the two that follow may be:


    +   - install—As the name implies, it holds information about the installation,
    such as scripts, errors, and so on.

    - lost+found—On a perfect system, this directory should be empty. When corruption
    occurs, however, the results are placed in this directory.


    # The Hard Disk Layout


    Partitioning your hard disk divides a single disk into many logical sections or
    drives. The partition itself is a set of contiguous sectors on the disk that are
    treated as an independent disk. The partition table is the index on the disk that
    describes how the sections of the disk relate to the actual partitions.


    There is a long-standing argument about the need for multiple partitions. Most
    DOS and Windows users are used to having their entire hard disk, regardless of
    the size, represented as one disk. Although this may seem convenient for some
    users, it is not desirable in the Unix or Linux world.


    By using multiple partitions, you can encapsulate your data and limit filesystem
    corruption to a single filesystem. This limits the potential data loss. You'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Working with Filesystems

    CHAPTER 8


    can also increase disk efficiency. Depending on the purpose of your system, you
    can format different filesystems with different block sizes. If you have lots
    of smaller files, you you want smaller blocks.


    Multiple partitions are also useful to limit data growth. This ensures that users
    who require extra disk space do not crash the system by consuming all available
    root filesystem space.


    There are some constraints that must be considered when planning your disk layout:


    +   - To prevent data loss and corruption, partitions must not overlap.


    +   - To maximize usage of the disk, there should be no gaps between partitions.


    +   - You do not have to fully partition your disk.


    +   - Partitions cannot be moved, resized, or copied without the use of special
    software.


    When working with the disks, you must remember the naming convention. All devices
    in a Linux system are represented as device files. These files are named with
    specific conventions to make it easier to identify the associated device.


    IDE disks are identified with the name /dev/hd followed by the letter "a", "b",
    "c", or "d". The letter identifies the drive as the first IDE controller (a),
    or the second disk on the second IDE controller (d).


    SCSI disks are identified in a similar manner, except the device name is /dev/sd
    followed by a letter. These names, /dev/sda, refer to the entire disk.


    After the drive has been partitioned, a number is added to the device name. Primary
    partitions are numbered 1–4, and extended or logical partitions are numbered 5
    and higher.


    The partition table was originally written in the disk boot sector, and as this
    was a predefined size, there was a limit to four partition entries. These are
    now referred to as primary partitions. One primary partition may be subdivided
    into logical partitions. The partition used to hold the logical partitions is
    called an extended partition. Linux imposes its own limits on the


    Partitions must be labeled to identify the format of the data that will be subsequently
    written on them. This is important for mounting the partition or'
  merge: -1
  pgno: 266
