  md: '# Novell Certified Linux Professional Study Guide


    When you do a copy operation, the utility first checks to see if the source file
    exists. If it does, whatever file is specified as the target is created (with
    a size of zero), and the contents of the source are copied. The emphasis is on
    the fact that the target is always created—regardless of whether existed before
    or not. Here''s an illustration:


    ```

    $ ls -l fileone filetwo

    --r--r-- 1 root root 85 Aug 22 10:26

    >fileone

    --r--r-- 1 root root 16432 Aug 28 13:43

    >filetwo

    $

    $ cp fileone filetwo

    $ ls -l fileone filetwo

    --r--r-- 1 root root 85 Aug 22 10:26

    >fileone

    --r--r-- 1 edulaney users 85 Aug 30 16:18

    >filetwo

    $

    ```


    The original contents of filetwo have been lost, except for any backup tape versions,
    as filetwo is created to be a copy of fileone. There is a -i (as inquire) option,
    which can be used to ask if you really want to erase the contents of the target
    file if it already exists:


    ```

    $ ls -l fileone filetwo

    --r--r-- 1 root root 85 Aug 22 10:26

    >fileone

    --r--r-- 1 root root 16432 Aug 28 13:43

    >filetwo

