  md: "# CHAPTER 1\n\n# The NCLP Certification\nProcess and Planning\nYour Approach\n\
    \nThis book is in your hands for a reason. The title on the cover reads\n“NCLP\
    \ Study Guide,” not “Twenty-Seven Keys to Pool Maintenance,” so we\ncan only assume\
    \ that the reason you are holding this book is that you\nwant to become a Novell\
    \ Certified Linux Professional (NCLP). If this is the\ncase, you've made a wise\
    \ choice.\n\nThis book walks you through the process of obtaining that certification,\
    \ and\ngives you a good start toward the Certified Linux Engineer (CLE) certific-\t\
    ion, if you want to continue on your journey beyond CLP.\n\nAlthough Novell does\
    \ not have prerequisites for this exam, it is highly rec-\\ommended that prior\
    \ to attempting to become certified at the NCLP level,\nyou pass two other exams:\n\
    \n+   1. LPI 101 from the Linux Professional Institute\n2. LPI 102, also from\
    \ the Linux Professional Institute\n\nThese exams are focused on generic Linux—topics\
    \ that you apply when\nare using SuSE, Red Hat, or any other Linux implementation.\
    \ Not only will\nthese exams assist with your studies for the NCLP, but as an\
    \ added\nbon to your journey, after you pass these two exams, you become LPIC\n\
