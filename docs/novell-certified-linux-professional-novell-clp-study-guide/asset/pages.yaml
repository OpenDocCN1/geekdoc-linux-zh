    # xargs


    Another powerful utility to use is xargs. To understand the power of this utility,
    consider the find utility, which is limited in it can return values within the
    filesystem structure. The only real text within the structure is the entity and
    not the data itself (the pointer points to that). To illustrate, suppose the user
    edaney put out a memo months ago on acceptable use of the coffee refrigerator
    in the break room. Since then, user edaney has quit the company and several new
    employees (who would benefit from this policy) have joined. You want to find the
    file and reprint it.


    About the closest you can get to accomplishing this with find (and its results)
    would be'
  merge: -1
  pgno: 96
- img_proc: true
  md: '```

    $ find / -user eduelaney -type f -exec grep -i refrigerator {}\;

    stored in the refrigerator overnight will be thrown out

    $

    ```


    The type **f** option must be used or else errors will occur every time grep tries
    to search a directory. In this case, the line from the file is found, there is
    no way of knowing what file is contained in—rendering the result pretty useless.


    Enter the **xargs** utility: Analogous to a pipe, it feeds output from one command
    into another. Arguments coming into it are passed through without any changes,
    and turned into input to the next command. Thus, the command can be modified to


    ```

    $ find / -user eduelaney -type f | xargs grep -i refrigerator /home/eduelaney/fileone:stored
    in the refrigerator overnight will be thrown out

    $

    ```


    The desired file is indicated, and can now be found and printed for the new employees.


    Food for thought: If **xargs** works like a pipe, why wouldn''t the following
    command suffice?


    ```

    $ find / -user eduelaney -type f | grep -i refrigerator

    ```


    Answer: Because the **grep** operation would take place on the names of the files,
    not the content of the files. The **xargs** utility pipes the entire into the
    next command in succession (**grep**, in this case), not just the resulting filename.


