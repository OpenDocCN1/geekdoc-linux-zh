    noname:(pid11973) on /auto type nfs (rw)


    This reads from the dynamic /etc/mtab and relays the device, the mount point,
    the type of filesystems, and the permissions (rw is read/write).

    in addition to read/write, filesystems can be mounted as read only (ro), not allowing
    users (bouncer), only to run binaries (exec) or not (noexec), not running certain
    files (nosuid), or controllable by all users (user), and interpret special devices
    on the filesystem (dev).


    The entries listed in the preceding output, and that are by default, appear in
    the /etc/fstab file—mentioned earlier in regard to the fsck utility. If there
    are additional filesystems you want to mount, you should add your entries to this
    file. The command mount -a will read the fstab file and remount all entries found
    within.


    If you do not have filesystems mounted, you can dynamically load other filesystems
    using the device name with the mount utility.


    For example, to mount the CD drive, the command is


    ```

    $ mount /mnt/cdrom

