  md: '# DNS Zones


    With the enormous number of hosts and sites on the Internet, it is not possible
    for a single server to hold all the address resolutions needed regardless of the
    capabilities of the database. Instead of a single server, DNS resolution for the
    Internet is performed by a number of servers, each responsible for a zone.


    By using multiple servers/multiple zones, the load and the administrative burden
    of managing the database are diffused. Administrators manage only the DNS database
    records stored in these zones—which can be any portion of the domain name space.
    For each zone, there is a primary server—responsible for all updates—and one or
    more secondary servers. Any changes to the zone file must be made on the primary
    server as the zone file on the secondary server(s) is a read-only copy. Zones
    are copied from the primary to the secondary servers through replication (also
    as zone transfer).


    > Another benefit of multiple zones is that smaller amounts of information are
    replicated than would be necessary if the domain records were located in only
    one zone file.


    In addition to primary and secondary servers, there are also servers known as
    caching-only servers. A caching-only DNS Server does not have a zone file, and
    its only function is to make DNS queries, return the results, and cache the results.
    Although primary and secondary servers always have a file locally, when a caching-only
    server first starts, it has no stored DNS information, and it builds this information
    over time when it caches results of queries after the server starts.


    > The ideal implementation for a caching-only server is in a situation where there
    is a slow WAN link because entire zone files don''t need to be transferred. When
    a query is made, only one record is sent and not the full file. All future queries
    for the same information are resolved locally from the cache—eliminating the need
    to go around the WAN link.


    # DNS Records


    Each record within the DNS zone file consists of a number of entries. The entries
    are also known as resource records, and can vary ever so slightly, the following
    sections examine the most common record types.'
  merge: -1
  pgno: 411
- img_proc: true
  md: '# SOA Record


    Every database file starts with an Start Of Authority (SOA) record. This record
    identifies the zone and contains a number of other parameters, including


    +   - Source host—The name of the primary server (with the read/write copy of
    the file)

    - Contact email—Email address for the administrator of the file

    - Serial number—The incrementing version number of the database

    - Refresh time—The delay in seconds that secondary servers wait checking for changes
    to the database file

    - Retry time—The time in seconds a secondary server waits before another attempt
    if replication fails

    - Expiration time—The number of seconds on secondary servers before the old zone
    is deleted

    - Time to live (TTL)—The number of seconds a caching-only server can cache records
    from this database file before discarding them and performing another query


    # NS Record


    The Name Server record simply specifies the other name servers for the domain,
    or maps a domain name to that of the primary server for the zone.


    # A Record


    The Address record holds the IP address of the name.


    # CNAME Record


    The Canonical Name record is an alias allowing you to specify more than one name
    for each TCP/IP address. For example, the CNAME record for ftp.ds-technical.com
    would indicate that it is an alias for kristin.


    Using CNAME records, you can combine an FTP and a Web server on the same host.


    # MX Record


    The Mail Exchanger record specifies the name of the host that processes mail for
    this domain.'
  merge: -1
