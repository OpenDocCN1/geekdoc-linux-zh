  md: 'Sysfs is a virtual filesystem mounted under /sys that is virtually generated
    by the kernel upon boot and holds the information about the devices and interfaces
    on the Linux system. By changing to the /sys/bus and sys/devices directories,
    you can find files that identify the entities connected with the system.


    In order for a drive to be usable, it must have a driver. If the device is hot-pluggable
    (USB, Firewire, and so on), the Hotplug feature will kick in when the kernel has
    triggered an event indicating that something has happened (a USB drive has been
    plugged in, and so on).


    Upon occurrence/notification of the event, the script file /sbin/hotplug runs
    to add the device. Hotplug can call the hwp script (also in /sbin/hotplug) to
    look for the appropriate configuration file for the device beneath /etc/sysconfig/hardware.
    If it is a network device, instead of a system device, ifup is called instead
    of hup.


    Hotplug agents can be found beneath /etc/hotplug and the file named blacklist
    holds entries for modules that should never be loaded for one reason or another.


    # # Booting from Start to Finish


    Course Objectives Covered


    +   2. Describe the Linux Load Procedure (3037)

    7. Troubleshoot the Boot Process of a SLES 9 System (3038)


    Now you''ve looked at different elements of the boot, it is now possible to put
    it all together and run through the steps of a boot from start to finish:


    +   1. When any machine is started, it first does a Power On Self Test (POST)
    to verify that internal parts and processes are working. This occurs regardless
    of any operating system.

    2. The boot loader for the operator system begins. With Linux, that is LILO. By
    default, it waits 50 seconds (5 seconds) for you to press a key and identify another
    operating system you want to boot. If no key is pressed, the default of Linux
    is loaded.

    3. The kernel is loaded from the hard drive, floppy drive, or other specified
    location into memory. By default, it is located within the /boot directory and
    exists in compressed state; as it loads into memory, it uncompresses.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '+   4. The kernel is booted and messages are written to /var/log/messages.


    +   5. Modules, default and other, from /etc/modules.conf or /etc/conf.modules
    are loaded.


    +   6. The kernel passes control over to the init daemon, which begins reading
    the /etc/initab file. Because of this, the init daemon will always have a process
    ID of 1 and be the parent of many other daemons.


    +   7. Normally, a check of the filesystem (fsck) is carried out and the local
    filesystem is mounted. Other operations can include mounting remote filesystems,
    cleaning up temporary files, and so on.


    +   8. The system begins changing to the runlevel specified by the initdefault
    parameter. In doing so, it runs scripts beneath the /etc/rc directory and usually
    starts other processes/daemons such as a print server, cron, sendmail, and so
    on.


    +   9. The terminals become active for login (getty has initiated), and the boot
    process is finished.


    # # Enter the User


    Course Objectives Covered


    +   2. Describe the Linux Load Procedure (3037)


    +   7. Troubleshoot the Boot Process of SLES 9 System (3038)


    After the system is up, the user(s) can now use it. The init daemon has started
    a getty process for each terminal telling it to listen for a connection. If you
    run ps -ef, you will see a getty process running on each terminal that can log
    in that does not currently have a user using it. The program responsible for printing
    the login prompt is command getty (a tty). getty prompts for the user''s login
    name.


    This login name has been assigned by the system administrator. Often, the login
    name is the user''s initials, first name, last name, or some combination from
    the initials or names. anyone wanting to send a message to or interact with the
    user will do using this name, and it will also appear in directory listings as
    the owner of files and directories.


    After the user has entered his or her login name, getty spawns, or starts, /bin/login
    utility. The login utility prompts the user to enter his or'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Boot, Initialization, Shutdown, and Runlevels


    her password. The user enters the password (which does not print on the screen
    for security reasons). If the user enters the password incorrectly, the system
    responds with a generic message stating that the login is incorrect.


    The login command accepts the password entered by the user and encrypts it using
    the same mechanism used by the password command to put the password in /etc/password
    file. If the encrypted values match, the password is correct. Otherwise, the password
    entered by the user is incorrect. The login command cannot decrypt the password
    after it has been encrypted. When the password is entered properly, the next phases
    of the system files (utmp/wtmp) are updated.


    The /etc/profile shell script is run to set variables for all users, and then
    the user is moved to his home directory and login shell (as specified in the /etc/password
    file) is invoked. If customization files within the home directory (such as .profile
    for BASH or .login for C shell), they are executed next; the user''s environment
    is configured, and the shell starts executing.


