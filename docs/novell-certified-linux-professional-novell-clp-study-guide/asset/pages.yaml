    CHAPTER 3


    (bash) took many of the features from Korn, and some new ones, and combined them
    with sh, while trying to reduce deviations. The Z shell (zsh) is the largest shell
    of all and added a new set of features to the Korn shell.


    Not to be overlooked shells are created to make the environment more friendly
    to those familiar with the C programming language. The first of these was the
    C shell (csh), which added C-like features to the interpreter and deviated greatly
    from the Bourne shell. It has been expanded upon by Tom''s C shell (tcsh).


    As a generalization, every vendor includes more than one shell for the user to
    choose from, but rarely do they include all the available shells. In many versions,
    there are three prevalent shells:


    +   - bash


    +   - tcsh


    +   - zsh


    Additionally, there are often two links within the operating system so that if
    a user attempts to use sh, they are really given bash, and if they attempt to
    use csh, they are really given tcsh.


    > All shells reside in the /bin directory and the default can be specified for
    the user in the user''s /etc/passwd file entry.


    There are slight deviations in the way each shell carries out its tasks, but all
    perform a core set of functions. Throughout this section, we will look at the
    core functions for all shells and discuss differences as they apply.


    # Command-Line Interaction


    When a command is entered, the shell must determine if the command is for it (internal)
    or not (external). If the command is an internal one, it does the processing and
    sends the output back without further interaction being needed. If the command
    cannot be found within the shell itself, it is assumed to be an external utility
    (such as ls, cat, cal, and so on). The command syntax for external commands is
    always assumed to be


    {program} {option(s)} {argument(s)}'
