    +   - domainname—Similar to hostname, it shows the domain used by the host.


    +   - ethereal—This utility is not installed by default, but can be added to the
    system through YaST, as discussed in the next chapter. After ethereal has been
    added, it offers a graphical interface with which you can monitor network traffic.
    This functionality is inherently available at the command line using the tcpdump
    utility.


    +   - ftp—The File Transfer utility, operating on the File Transfer Protocol,
    is used to send files back and forth between a local and remote host.


    +   - hostname—This simple utility shows the name of the host.


    +   - ifconfig—This utility is used to configure the TCP/IP parameters on the
    command line. The syntax is: ifconfig interface options. Thus to configure the
    IP address of 201.13.12.65 for the first Ethernet card, the command would be ifconfig
    eth0 201.13.12.65, and this would use the default subnet mask. To do the same
    with a subnet mask of 192, the command becomes: ifconfig eth0 201.13.12.65 netmask
    255.255.255.192 Figure 11.1 shows an example of the output from the ifconfig utility.'
