    # Shared Libraries


    +   5. Verify and Update Software Library Access (3037)


    Most Linux programs use of shared libraries. A shared library allows a program
    to be smaller and require less storage space because it pulls in the libraries
    it requires when it needs to. For example, if a program is dependent upon libcrypt.a
    during compilation, all of the functions are included in the compiled binary.
    This is not efficient, because changes to libcrypt.a require the programs to be
    recompiled for the new changes to be included. By using shared libraries, as the
    library changes, the programs that depend upon that library can take advantage
    of the changes without the need to recompile.


    Several commands are available to review the configuration of shared libraries
    on your system. They are ldd and ldconfig. ldd is used to see what shared libraries
    a program is dependent upon. To use it, supply a program name as an argument,
    for example


    ```

    ldd /usr/bin/perl

    libsl.so.1 => /lib/libs.so.1 (0x4001e000)

    libdl.so.2 => /lib/libdl.so.2 (0x40035000)

    libm.so.6 => /lib/libm.so.6 (0x40038000)

    libc.so.6 => /lib/libc.so.6 (0x40057000)

    libcrypt.so.1 => /lib/libcrypt.so.1 (0x40175000)

    /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)

    ```


    The output of ldd shows that /usr/bin/perl is dependent upon these shared libraries.
    As these shared libraries are updated, the new functionality or bug fixes are
    automatically available to the program, without the need for recompiling the software.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    The ldconfig program is used to update and maintain the cache of shared library
    data and symbols for the ld.so dynamic linker. ldconfig checks the file /etc/ld.so.conf
    for information on the shared libraries, and also checks each file in the trusted
    directories, /lib and /usr/lib.


    The ldconfig command must be run as root so that any updates to system files can
    be performed. The dynamic linker cache is found at /etc/ld.so.cache and is managed
    using ldconfig. You can rebuild the cache by running ldconfig with no options.
    This rebuilds the cache. You can review the current cache with the option -p:


    ```

    # ldconfig -p | more

    398 libs found in cache `/etc/ld.so.cache`nlibzt.so.2 (lib66) => /usr/lib/libzt.so.2

    libz.so.1 (lib66) => /usr/lib/libz.so.1

    libz.so (lib66) => /usr/lib/libz.so

    libbxxr.so.6 (lib66) => /usr/X11R6/libbxxr.so.6

    libbxxr.so (lib66) => /usr/X11R6/libbxxr.so

    libmms.so.1 (lib66) => /usr/lib/libmms.so.1

    libxl.so.1 (lib66) => /usr/lib/libxl.so.1

    ```


    We see that there are 398 entries in the cache reported by ldconfig. It is only
    necessary to use this command if a new shared library is installed. The new library
    is not used until ldconfig is run and the cache is rebuilt.


    # Package Management with Red Hat


    Course Objectives Covered


    +   1. Executing RPM Package Related Operations (3036)

    2. Manage RPM Software Packages (3037)


    Earlier in this chapter, we examined how to extract a tarball and build an application.
    Today, however, more and more software distribution in the Linux community is
    accomplished using packages. There are two principal methods of package management:
    the RPM or Red Hat package manager and the dpkg approach employed by Debian.


    RPM, the Red Hat Package Manager, is an open system for the packaging and distribution
    of software in the Unix environment. Though most'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'commonly used for Linux, RPM has been compiled and used on other Unix platforms
    also. RPM allows users to take source code and package it in source and binary
    form such that the programs can be easily tracked and rebuilt.


    RPM also created and maintained a database of the packages and files to allow
    for the verification of the package, querying information about the packages and
    files, and the removal of those packages if desired.


    The query options to RPM allow searches through the database for specific packages
    or files, including how to identify which package a file came from. The RPM files
    are themselves compressed images. These compressed images contain a custom binary
    header allowing for quick retrieval of information about the package and its contents.


    The verification options allow the user to determine if portions of packages are
    missing. If so, the user can re-install the package, while maintaining any altered
    configuration files. RPM is an extremely powerful tool, and as we will review
    some of its functionality. Specifically we will look at these aspects:


    +   * Installing and removing software using RPM

    * Verifying an RPM

    * Querying an RPM

    * Building an RPM


    # Installing and Removing Software Using RPM


    The simplest method to install software using RPM is with the command


    ```

    rpm -i rpm-name.rpm

    ```


    For example, to install the foobar-2.3-8.1386.rpm package, the command is


    ```

    # rpm -i foobar-2.3-8.1386.rpm

    ```


    This instructs rpm to read the RPM file, extract the files, and place them in
    the correct location as specified in the RPM file. Removing a package is accomplished
    with the following command:


    ```

    rpm -e foobar

    ```'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    Both of these scenarios expect the RPM file to be local on your hard disk. Because
    we typically do not keep the RPM file after the software is installed, it is also
    possible to install direct from FTP if you know the source path, or URL, for the
    RPM file:


    ```

    rpm -i ftp://ftp.some.site/pub/name.rpm

    ```


    In the preceding example, rpm will use your network connection, retrieve the RPM
    file, and install the package.


    These are simple examples demonstrating rpm''s capabilities. Use the command rpm--help
    to see what capabilities your specific version of rpm has.


    # Verifying an RPM


    rpm is used to also verify that packages are installed and what files are missing.
    This allows the administrator to query the system after a file or directory may
    have been accidentally erased. The following command verifies all of the packages
    installed on the system:


    ```

    # rpm -Va

    ```


    The verification process compares information about the installed files in the
    package with information about the files taken from the original package and stored
    in the rpm database. Among other things, verifying the size, MD5 sum, permissions,
    type, owner, and group of each file. Any discrepancies are displayed.


    # Querying a Package


    The structure of the RPM files and database allows a package to be queried to
    determine information about the package, or to see which package particular file
    belongs to. For example, to see what package particular file belongs to, you must
    use the options -qf of rpm and specify the filename.


    ```

    $ rpm -qf /sbin/insmod

    mod-init-tools-3.0_pre10-37.16

    $

    ```


    In this case, the /sbin/insmod program is part of the mod-init-tools package.


    You can also use the query options to rpm to print information about the module.
    For example, to see what information is available on the zip package you found
    on the Internet, use these options:'
