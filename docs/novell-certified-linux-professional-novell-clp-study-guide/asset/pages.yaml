    KDE_MULTIHEAD=false; export KDE_MULTIHEAD

    HOSTNAME=linux; export GNOME

    GNAME2_PATH=/usr/local:/opt/usr; export GNOME2_PATH

    KEYSYMDB=/usr/X11R6/lib/X11/KeysymDB; export KEYSYMDB

    ```'
