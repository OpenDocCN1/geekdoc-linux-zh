  md: 'The construction of a kernel is not required on a daily basis. It is typically
    needed to support the devices or services that must be included in the kernel.
    newer kernels will have other improvements that may include better process management
    and improved speed and stability. Reconfiguration of the kernel does not necessarily
    mean a whole new version. There may be a series of updates and patches that you
    have included into the new kernel.


    Creating the kernel, however, is not a trivial task. It requires you to have strong
    knowledge of your system hardware and services you need configured. You must have
    a c compiler and the appropriate libraries as recommended by the kernel source
    code. Generally, if you installed the kernel source code from your distribution
    CD, you will have the elements required.


    # Obtaining the Kernel Source Code


    If you are only going to add a new service to your kernel, it is advisable to
    get the most recent kernel source code from your Linux vendor. Alternatively,
    you can download the latest kernel source sources from ftp.funet.fi or any of
    locations that offer mirrors. The kernel software is typically named linux-x.y.z.tar.gz
    where x.y.z is the version number. The highest number is the latest version, and
    is considered a test version. If you are expecting your system to be stable, do
    not use this one.


    After you have retrieved the new source code, you must install and unpack it.
    it is already done, provided you installed the Linux kernel source code from your
    distribution CD. Log in to root, and cd to /usr/src. If there is a linux directory,
    you likely have the kernel source code installed.


    If you have the disk space to spare and are installing a new kernel tree, make
    sure the directory is named with the link-kernel version number. In this case,
    there is a link from linux to the existing source. If that is the case, you must
    remove the link in order to preserve your existing source. It is not recommended
    that you simply destroy the existing source tree, unless you are very short of
    disk space.


