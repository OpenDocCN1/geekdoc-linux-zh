  md: '# Other Useful Utilities


    A number of other useful text utilities are included with Linux. Some of these
    have limited usefulness and are intended only for a specific purpose, but knowing
    of their existence and purpose can make your life with considerably easier.


    In alphabetical order, the additional utilities are as follows:


    +   - awk—Often used in conjunction with sed, a utility/language/tool with an
    enormous amount of flexibility for manipulating text. The GNU implementation of
    utility is called gawk (in GNU awk) but is truly the same.

    - cmp—Compares two files and reports if they are the same, or where the first
    difference occurs in terms of line number and character.

    - comm—Looks at two files and reports what they have in common.

    - diff—Allows you to see the differences between two files.

    - diff3—Similar to diff, but works with more than two files.

    - perl—A programming language useful for working with text.

    - regexp—A utility that can compare a regular expression against a string to see
    if there is a match. If there is a match, a value of 1 is returned and if there
    is no match, a value of 0 is returned.


