  md: '# Table 13.2 Continued


    | KEY COMBINATION | MOVEMENT |

    | PageUp | Scroll half a screen back |

    | End | Move to the end of the page |

    | Home | Move to the beginning of the page |


    Let''s examine the actual display: Line 1 gives the name of the utility and the
    parentheses identify what subdirectory the documentation is coming. In this case,
    the 1 indicates that it is a shell utility or user command that the documentation
    was found for displayed. If there is documentation for other entities named “nice"
    as well, they will not be displayed, as the default actions is to only display
    the first entity found.


    To see if there is more than one set of documentation on the system by the same
    name, you can use the whatis command:


    ```

    $ whatis

    nice (1) - run a program with modified scheduling priority

    nice (2) - change process priority

    nice (1p) - invoke a utility with an altered nice value

    nice (3p) - change the nice value of a process

    $

    ```


    In this case, it turns out that there is another set of documentation for nice
    under man2 and man 1p and 3p as well. The list displayed comes from a whatis database.
    To see the second set of documentation instead of the first, the command would
    be


    ```

    man 2 nice

    ```


    This command specifies that you want the documentation for nice from the man2
    directory (3 would be for man3, 4 for man4, and so on).


    Other lines of the manual file begin sections for Name, Synopsis, Description,
    and Options, respectively. Based on the complexity of the utility and other features,
    there can also be sections for See Also, Diagnostics, Files, Bugs, and History
    and Author.


    The third line is a short synopsis in and of itself of what the utility does,
    and matches the line returned by the whatis utility. Other lines describe the
    options that can be used and go into more detail on the workings of each.'
