  md: '# Using for


    The third method of looping bears only a passing resemblance to the first two.
    Where the first two are primarily concerned with conditions existing or not existing,
    for is used to perform an operation on a set of values. The syntax for the command
    is


    ```

    for {variable} in {set}

    do

    {commands}

    done

    ```


    Notice that the do and done commands still denote the loop, but little else is
    the same. This type of looping is practical whenever you have a set that you need
    to work with.


    This type of loop can be used for any number of repetitive operations. The one
    thing the operations must have in common, is that they are variables coming from
    a set and nothing more.


