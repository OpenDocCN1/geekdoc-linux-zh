    # Command History


    The bash shell keeps a list of commands that you give it and allows you to reuse
    those commands from the list rather than needing to retype them each time. From
    the command line, you can use the up and down arrows to scroll through recent
    commands. You can also enter two bangs (!!) to rerun the very last command you
    gave.


    Typing history shows all the commands that are stored, with an increment number
    on the left. Typing a single bang and one of those commands will rerun that command,
    as is !125.


    > NOTE

    Instead of seeing the entire history list, you can choose to see only the most
    recent entries by following the history command with the number of lines you want
    to see, like this:


    ```

    history 5

    history 10

    ```'
