  md: '# Dedication


    This book is dedicated to my family. Were it not for their patience, contributions,
    and understanding, I would not be able to accomplish a fraction of the little
    I do.


    # Acknowledgments


    A great many people worked behind the scenes on this book, but it would not have
    been possible without the help of Warren Wyrostek. Though he is listed in the
    front as the Technical Editor, he served as far more on this title than that—as
    he does on most books that include him. Without his going above and beyond the
    call of duty, this title would have never come to be, or would would be a dim
    shell of what it currently is.


    A great deal of thanks is owed to Jenny Watson for giving me the opportunity to
    write this book. I appreciate her confidence and encouragement to step out from
    the Development Editor role once in a while.


    Thanks also belong to Matt Purcell, the Project Editor for this book. His ability
    to keep the book on track proved to be the impetus needed every now and then to
    stay up late at night.


    Margaret Berson and Mark Cierzniak rounded out the team and added valuable contributions
    on every page.'
