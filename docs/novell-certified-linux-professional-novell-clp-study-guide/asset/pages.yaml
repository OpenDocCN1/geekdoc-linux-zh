    # Configuring Routes


    Course Objective Covered


    +   3. Configure and Manage Routes (3037)


    Three types of routes exist to help IP packets make their way to their final destination:


    +   - Host routes

    - Network/gateway routes

    - Default routes


    The purpose behind any route is to point the way for the data to its target, and
    to use with routes is simply the route utility. To add a route, use the route
    add command. To delete a route, use the route del command.


    Figure 11.5 shows the simplest display possible—this example is on a server that
    has no routes configured but is able to communicate across the network.'
