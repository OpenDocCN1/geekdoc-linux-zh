  md: '# Performing Administrative Security Tasks


    Course Objectives Covered


    +   7. Create a Security Concept (3038)

    8. Limit Physical Access to Server Systems (3038)

    9. Limit the Installed Software Packages (3038)

    10. Ensure File System Security (3038)

    11. Use ACLS for Advanced Access Control (3038)

    12. Be Informed About Security Issues (3038)

    13. Apply Security Updates (3038)


    Common sense is always the guiding factor when applying security to a system,
    to a network, or to the Internet. If you apply no security whatsoever, you run
    the risk of someone accessing your data who otherwise should not. What they do
    with the data after they access it is anyone’s guess: They can use it to undercut
    or steal trade secrets, they can mischievously delete, or they can alter it in
    a myriad of ways.


    On the other hand, if you apply too much security to a system, you may make it
    too difficult to use. For example, to prevent anyone from seeing the files on
    a system, simply unplug the system and then smash the hard drive with a hammer.
    Although no one would disagree that it is overkill, it accomplishes the purpose.


    Somewhere between no security and total security resides a level of comfort that
    you must find and apply. That level depends on such factors as the value of the
    data you are securing, the type of access (local, remote, dial-in) that users
    utilize, and so on. That level of comfort can always be changing, as well being
    acted upon by extraneous factors. For example, if you’ve just heard that another
    division in your company is having troubles with break-ins, you will want to increase
    your security, and so on.


    Under all conditions, there are some common sense rules that should be applied:


    +   Secure the physical environment. If host machines are providing services and
    are not used by users sitting in front of them, there is no reason why those machines
    need to be sitting in the middle of the office.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# 333

    CHAPTER 10

    Administrative Tasks Revisited


    Move machines to secured wiring closets and reduce the risk of someone sitting
    down in front of them and accessing data.


    +   - Pay attention to ambient factors. Data does not just get corrupted by users—it
    can get corrupted by system failures as well. To reduce system failures—and prevent
    data corruption—pay attention to items such as proper feeds (using an uninterruptible
    power supply—UPS), and don''t run wiring over objects that can cause electro-mechanical
    interference (EMI) such as fluorescent lighting or electric motors. Pay attention
    to moisture conditions, and so on.


    +   - Before you install any software, verify that the software is clean. This
    can prevent you from adding rogue processes to a good machine. There are a number
    of ways in which you can attempt to do this: Verify the checksum to make certain
    no corruption occurred during downloading (and download only from trusted sites),
    list the contents of a package and verify it against what should be, and so on.
    The best method, however, is to install the software on a standalone machine and
    verify it before installing it on a production machine.


    +   - Require all users to use passwords and create a suitable password policy.
    Make sure those passwords are not just single characters (6–8 characters are a
    good minimum), and implement regular expirations. Remember that passwords are
    changed with the `passwd` command and you can disable accounts by adding characters
    to the user''s entry in the `/etc/passwd` file.


    +   - Utilize shadow entries for passwords. This applies to both users and groups.
    Shadowing merely moves the passwords from files that can be accessed by all users
    into files that can only be accessed by the root user and adds security.


    +   - Routinely check the log files and make certain that only logins and logouts
    (which can be seen with **last**) are not suddenly showing odd times. If users
    start accessing the system at 3:00 in the morning when they have never done so
    before, be certain to follow up and verify that it is indeed that is accessing
    the system and not someone else. While on the subject, routinely check all log
    files—they are for a purpose and they can alert you to situations you need to
    catch early on before they become uncontrollable.


    +   - Disable any accounts that need not be in current use. This is true for both
    user and group accounts and provides one less door by which entry can be gained.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# 334


    Novell Certified Linux Professional Study Guide


    +   Assign authentication to dial-in access. PPP is the most commonly used dial-in
    protocol on TCP/IP It allows for authentication using PAP—the Password Authentication
    Protocol—which does not encrypt passwords and allows plain text to be sent—leaving
    the door open for anyone to intercept. Thankfully, it also has the ability to
    authenticate with CHAP—Challenge Handshake Authentication Protocol—which encrypts
    the passwords and makes them much less vulnerable if intercepted.


    +   Use TCP wrappers to reduce the traffic that you are allowing to come in across
    the network. A wrapper (which works with the /etc/hosts.deny and /etc/hosts.allow)
    is a rule determining who can come in. Using a wrapper, you can reduce the allowed
    hosts to only those that are local, or only rule out unknown hosts, or any other
    combination needed to meet your needs.


    +   Regularly run a check to see which files permissions involving SGID or SUID.
    There should be an indisputable reason for their existence, or they should not
    exist at all. If a user cannot run a process as themselves, what level of comfort
    do you have giving them higher-level permissions to run jobs? What if the process
    should crash and they are left to that?


    +   Related to the preceding one—always use the minimal user and group ownership
    for any file or daemon that runs with SUID or SGID permissions, respectively.
    If a daemon can function properly without being owned by root, then ownership
    change should be made.


    +   Use an appropriate umask value to make default permissions for newly created
    files and directories as minimal as possible.


    The majority of these rules were discussed in the previous chapters, or constitute
    common sense. In the real world, and on the exam, always think through both the
    possibilities and the ramifications when considering security to a host or a network.'
  merge: -1
  pgno: 349
