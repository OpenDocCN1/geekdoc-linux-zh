- img_proc: true
  md: '# Exam-Handling Strategies


    The NCLP exam is a hands-on practicum.


    This means you won''t be answering multiple-choice questions about who created
    Linux. Instead, you''re much more likely to be adding a new user to the system.
    In other words, the test centers are performing tasks.


    The tasks assume that you understand the inner workings of Linux utilities inside
    and out. If your knowledge in these areas is well grounded, it will help you cut
    through many confusing questions.


    Time management has been mentioned before, and it cannot be stressed enough. With
    five minutes left in the exam, you should be simply checking that everything is
    working correctly, or you have already failed.


    # Planning Your Approach


    When pursuing a certification, it is best to approach it as you would any other
    large undertaking.


    Becoming an NCLP requires a significant investment on your part. Not only does
    the price of this book cancel out a reasonable dinner for four (or two, with drinks),
    but there is also the cost of the exam to consider as well as the sizable amount
    of time that you are going to spend, studying, and taking the test. You should
    endeavor to get as much out of this investment you can.


    To this end, I encourage you to apply yourself wholly to this enterprise. Sure,
    you can read every chapter now and then skim and skip around as I did with the
    Bill Clinton biography. You can skip topics that you''re familiar with that you''ve
    had experience with, but are you really pursuing the best tactic when you do this?


    This exam is aimed at the same audience level as LPI, RHCA, and similar exams.
    It is, however, focused only on SuSE Linux. When studying for this test, you can
    forget about how things work in Red Hat or Debian and think only in terms of the
    one Linux flavor that you are hopelessly most comfortable with that.


    There are three courses that Novell recommends you have the knowledge before taking
    this exam. You do not need to sit through the courses—in other words, that is
    not a mandatory prerequisite—but you do need to know the topics. The three courses
    in question are'
