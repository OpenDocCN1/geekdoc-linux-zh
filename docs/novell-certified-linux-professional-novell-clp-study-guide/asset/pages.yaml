    # Representing the Variables


    The distinction and difference between $* (all the variables) and %# (of variables)
    is important to understand. The first ($*) will blindly address everything on
    the command line from $1 to infinity (in reality, each shell limits how many variables
    can there be). The second ($# does not address the variables per se, but instead
    returns a number representing how many there are. To illustrate this difference,
    consider the following simple script:


    ```

    $ cat count1

    echo $*

    $

    $ count1 a b c d e f

    ab b c d e f

    $

    ```


    Then contrast it with this script:


    ```

    $ cat count2

    echo $$\n$

    $ count2 a b c d e f

    6

    $

    ```


