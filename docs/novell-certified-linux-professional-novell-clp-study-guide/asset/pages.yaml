  md: '# Shells, Scripting, Programming, and Compiling


    The empty line as output can be confusing. Often, when an empty line is returned,
    it can be mistaken for an error or an incomplete operation versus a successful
    execution in which there were simply no values to show. $? can be used to show
    the return status of the very last operation executed. If the operation was successful,
    a O is returned, and if there is an error, a non-zero value (usually 1) is returned.


    The "x" script can be modified as follows:


    The null device used in the following example (/dev/null) exists as an entity
    in every version of Linux. It allows you to send any generated output to nowhere—literally
    causing it to be ignored.


    ```

    $ cat x

    who | grep kristin > /dev/null

    echo $

    ```


    This particular script will always return a value—O if kristin is logged in, and
    1 she is not. Note that the output has been sent to /dev/null to prevent anything
    other "0" or "1" from being returned to the screen.


    Although this script is very simple, it is possible that whoever inherits your
    machine from now will not have idea what they are looking for. For reason, it
    is always recommended that comments be added to identify the purpose of the script
    and any major operations that take place. The comments always begin with a pound
    sign (#) and can appear anywhere—in the middle of a file, after an operation,
    and so on. It is suggested that you start of them on new lines if you want them
    to be seen and identified. The preceding script should be


    ```

    $ cat x

    # looking to see if kristin is using the system

    who | grep kristin > /dev/null

    # a value of 0 means she has a session, and a value of 1 means

    #she does not

    echo $

    ```


    Another thing that should always be completed is that the first line should indicate
    the correct interpreter (shell) that will be used to run the file. This is signified
    by a line beginning with "#! followed by the full path of the shell. An example
    is


    ```

    #!/bin/sh

    ```'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'Novell Certified Linux Professional Study Guide


    The line must be there to accurately call the correct interpreter. Now wenhave
    the following sample script:


    ```

    $ cat x

    !/bin/sh

    # looking to see if kristin is currently using the system

    who | grep kristin > /dev/null

    # a value of 0 means she has a session, and a value of 1 means

    she does not

    echo $?

    $

    ```


    # Items to Keep in Mind


    Early on, it is important to understand a few premises about script files. The
    first is that a script file is capable of running any command you could type at
    the command line. From the command line, you can give commands to start and stop
    processes, to change the system date and time, to look for string values within
    a text file, and so on. All of those times and commands can be included in a script
    file and be executed from it. The greatest caveat, however that when the script
    file is executed, it must be executed with adequate permissions to carry out the
    actions.


    If the root user creates a script file that will kill system processes and then
    does nothing more with it but tell users to run it if the system hangs, he will
    likely be facing angry users. The reason is that the root user can perform operations
    users cannot. When the root user runs the script, it will kill the processes,
    when a user attempts the same, the result will be completely different because
    the user has fewer permissions.


    The solution to this problem is to assign SUID (user ID) or SGID (set Group ID)
    permissions to the file. SUID is invoked by adding 4000 to the existing permissions
    values, as in this example:


    ```

    $ chmod 4777 x

    ```


    Now, when the script is run, regardless of who is running it, the user will become
    the owner of the file during its duration and within this instance. If the file
    was created by the root user, it will always assume that it is being run by the
    root user, regardless of who actually summons it. Similarly, the SGID is figured
    by adding 2000 to the permissions that would otherwise be there:


    ```

    $ chmod 2777 x

    ```'
