  md: '+   --adjust to add or subtract for drift

    --set to change the time

    --show to see the time the hardware clock has

    --version to see the version of the utility


    > > At any given time, if the time on the server is greater than 17 minutes beyond
    the NTP time provider''s time, NTP will refuse to synchronize. This provides a
    safety of sorts, and the time on your server is said to be "insane." /etc/ntp.drift
    is the default drift file.


    The ntpdate utility is used to set the time on the server using the following
    syntax:


    ```

    ntpdate time_provider_IP_address

    ```


    Thus to set the time on any server to the time found on a provider with the address
    of 192.168.0.12, the command would be


    ```

    ntpdate 192.168.0.12

    ```'
