    # Maintaining Effective Backups


    Course Objectives Covered


    +   2. Archiving Files with tar (3036)

    3. Compressing and Uncompressing Files with gzip and bzip2 (3036)

    8. Backup and Restore the File System (3037)

    12. Develop a Backup Strategy (3038)

    13. Backup Files with tar (3038)

    14. Work with Magnetic Tapes (3038)

    15. Copy Data with dd (3038)

    17. Monitor the Operating System (3038)


    Every system has the ability (sad to say) to crash. When it does, the operating
    system can be reinstalled from the media it came upon and you can start'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Novell Certified Linux Professional Study Guide


    over. What cannot be reinstalled from that media is all the data you''ve created-
    since the system was started up. Enter the lifesaving backups.


    The true definition of backups is copies of your data stored on removable media
    (you can copy files from one drive to another, but those copies do you no good
    if the system gets hit by fire). In recent times, the definition has become a
    bit broadened to include technologies such as clusters and such: A complete understanding
    of the basic definition is what is needed for the exam.


    Although the removable media can be anything from floppy disks to DVD-RWs, most
    of the time, magnetic tapes are the preferred medium. Most tapes allow you to
    store several gigabytes of data, and provide a cheaper, more reusable media than
    other possibilities.


    One of the first things to realize is that one tape, used and over, does not provide
    a good backup strategy. You need to use multiple tapes, to be able to recover
    in the event of the failure of one, and rotate them. You need to store copies
    in safe locations, including off-site (in the entire building is blown away in
    a tornado). Logs should be kept of what is on each tape to allow you to identify
    what is it.


    # NOTE


    It is important to understand the difference between backups and archives. Archives
    are files you copy from your system to store elsewhere and would not put back
    on the system if it crashes. Backups are files on the system that you need and
    would put back if the system crashed.


    There are several strategies for how to back up the data to the tapes:


    +   Daily—Copy all files changed each day to a tape


    +   Full—Copy all files


    +   Incremental—Copy all files added or changed since the last full or incremental
    backup


    +   Differential—Copy all files added or changed since the last full backup


    Real backup plans use some combination of these types. For example, full backups
    are the best, but require the most time to run. For that reason, you might run
    a full backup every Sunday, and an incremental every evening of the week. The
    amount of time it takes to run the incrementals will be much shorter and roughly
    the same night. If the system crashes on Friday, however, it will take quite a
    while to restore as you restore the'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Basic Linux Administration

    CHAPTER 5


    full tape from Sunday, then the incremental from Monday, the incremental from
    Tuesday, the one from Wednesday, and the one from Thursday (a total of five tapes).


    Another possibility would be to do a full backup on Sunday and a different each
    night. The amount of time to do the differentials will get longer each night,
    but if the system crashes on Friday, you only need two tapes: Sunday''s full and
    Thursday''s differential.


    There are also other types of backups recognized: copy and partial. A copy backup
    is simply a copy of a file to the media (think of copying one file to a floppy).
    A partial backup is just a copy of all the files within a directory.


    Just as important a good backup strategy and adherence to it is the knowledge
    that you can restore the data if you want to. This can only come from verifying
    that on a regular basis. Every often, when a backup is completed, run a restore
    and verify that you can read back the data in its original format.


    # Utilities to Know


    Linux includes a number of utilities that can be used to do your backups: tar
    and cpio. The tar utility (tape archiver) will combine multiple files into a single
    file that can be copied to the media. The syntax for it is


    ```

    tar {options} {target_file} {source_files}

    ```


    Both the target file and source files can be paths (such as /dev/tape). The options
    include


    +   - c to create a new file

    - d to compare contents and display the differences between the target and source

    - f to specify a file

    - p to keep the permissions

    - r to append to an existing file

    - t to show the names of the files in the tar file

    - u to only add files that are new

    - v to run in verbose mode

    - x to extract files'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'Novell Certified Linux Professional Study Guide


    Examples of common commands follow.


    To create a new tar file on the tape and do so in verbose mode, use this command:


