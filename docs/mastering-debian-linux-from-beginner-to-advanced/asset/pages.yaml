  md: '# ## APT Configuration


    APT configuration files are located in the `/etc/apt/` directory:


    +   - `/etc/apt/sources.list`: Main repository configuration file.

    +   - `/etc/apt/sources.list.d/`: Directory for additional repository configuration
    files.


    # ## Common APT Commands


    +   1. **Update Package List:**

    +      - `sudo apt update`

    +      - Refreshes the local package cache with the latest information from repositories.


    +   2. **Upgrade Installed Packages:**

    +      - `sudo apt upgrade`

    +      - Upgrades all installed packages to their latest versions.

    +      - `sudo apt full-upgrade` (or `dist-upgrade`): Performs a more aggressive
    upgrade, potentially removing obsolete packages.


    +   3. **Install a Package:**

    +      - `sudo apt install package_name`

    +      - Installs a new package and its dependencies.


    +   4. **Remove a Package:**

    +      - `sudo apt remove package_name`

    +      - Removes a package but keeps its configuration files.

    +      - `sudo apt purge package_name`: Removes the package and its configuration
    files.


    +   5. **Search for Packages:**

    +      - `apt search keyword`'
