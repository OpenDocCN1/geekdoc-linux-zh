- pgno: 35
  md: "# ## System Shutdown Process\n\n+   1. **Shutdown Command:**\n+   \n+   * The\
    \ shutdown process is initiated by the shutdown command or through the desktop\
    \ environment.\n\n+   2. **Systemd Shutdown:**\n+   \n+   * Systemd begins stopping\
    \ running services and processes.\n+   * It sends SIGTERM signals to allow graceful\
    \ termination.\n\n+   3. **Killing Remaining Processes:**\n+   \n+   * Any remaining\
    \ processes are forcefully terminated with SIGKILL.\n\n+   4. **Unmounting File\
    \ Systems:**\n+   \n+   * File systems are unmounted to ensure data integrity.\n\
    \n+   5. **Final System Halt:**\n+   \n+   * The system is halted or rebooted\
    \ as requested.\n\n# ## Important Commands for System Control\n\n+   1. `systemctl`:\
    \ Main command for controlling systemd\n+   \n+   * Start a service: `sudo systemctl\
    \ start service_name`\n+   * Stop a service: `sudo systemctl stop service_name`\n\
    +   * Restart a service: `sudo systemctl restart service_name`\n+   * Enable a\
    \ service to start at boot: `sudo systemctl enable service_name`\n+   * Disable\
    \ a service from starting at boot: `sudo systemctl disable service_name`\n+  \
    \ * Check service status: `systemctl status service_name`\n\n+   2. `shutdown`:\
    \ Shutdown or reboot the system"
