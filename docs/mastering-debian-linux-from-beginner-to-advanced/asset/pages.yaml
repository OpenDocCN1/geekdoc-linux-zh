    # Changing Ownership


    Use the `chown` command to change file ownership:


    ```

    ```chown user:group file```

    ```


    To change ownership recursively for directories:


    ```

    ```chown -R user:group directory```

    ```


    # Special Permissions


    +   1.  SetUID (SUID): When set on an executable file, it runs with the permissions
    of the file owner.

    +   2.  SetGID (SGID): When set on an executable file, it runs with the permissions
    of the file group. When set on a directory, new files created within it inherit
    the directory''s group.

    +   3.  Sticky Bit: When set on a directory, only the owner of a file can delete
    or rename it within that directory.


    To set these special permissions:'
