    \n## 文本处理\n\n## 21. grep：搜索文本\n- 在文本中搜索模式。\n- 示例：`grep \"pattern\" file.txt`\n\
    \n## 22. sed：流编辑器\n- 执行文本转换。\n- 示例：`sed 's/old/new/g' file.txt`\n\n## 23. awk：文本处理工具\n\
