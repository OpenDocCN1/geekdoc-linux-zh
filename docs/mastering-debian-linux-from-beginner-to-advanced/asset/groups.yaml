    \ 的常用选项：\n\n- `-c`：仅显示 CPU 利用率报告。\n- `-d`：仅显示设备利用率报告。\n- `-x`：显示扩展统计信息。\n- `-p`：显示块设备及其所有分区的统计信息。\n\
    \n用法示例：\n\n```\niostat -x 5 3\n```\n\n此命令将每 5 秒显示一次扩展统计信息，共 3 次迭代。\n\n### 其他监控工具\n\
