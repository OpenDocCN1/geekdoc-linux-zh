    - Execute a command in a container: `lxc exec my-debian -- command`\n- Enter a\
    \ container's shell: `lxc exec my-debian -- /bin/bash`\n\n# Creating and Managing\
    \ LXC/LXD Containers\n\n## Creating a Container\n\nTo create a new container:\n\
    \n```\nlxc launch images:debian/10 my-debian\n```\n\nThis command creates and\
    \ starts a new Debian 10 container named \"my-debian\".\n\n## Configuring Container\
    \ Resources\n\nYou can limit a container's resources:\n\n```\nlxc config set my-debian\
    \ limits.cpu 2\nlxc config set my-debian limits.memory 2GB\n```\n\n## Managing\
    \ Container Networking\n\nTo attach a network interface to a container:\n\n```\n\
    lxc network attach lxdbr0 my-debian eth0\n```\n\nTo configure a static IP:\n\n\
    ```\nlxc config device set my-debian eth0 ipv4.address 10.0.0.10\n```\n\n## File\
    \ Transfer to/from Containers\n\nTo push a file to a container:\n\n```\nlxc file\
    \ push /path/to/local/file my-debian/path/in/container/\n```\n\nTo pull a file\
    \ from a container:\n\n```\nlxc file pull my-debian/path/in/container/file /path/to/local/\n\
    ```\n\n## Taking and Managing Snapshots\n\nTo create a snapshot:\n\n```\nlxc snapshot\
    \ my-debian snapshot1\n```\n\nTo restore from a snapshot:\n\n```\nlxc restore\
