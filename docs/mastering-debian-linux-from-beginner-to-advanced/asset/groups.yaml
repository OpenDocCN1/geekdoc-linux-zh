    \n- **合并分支：**\n\n  ```bash\n  git merge <branch-name>\n  ```\n\n### Git 图形界面客户端\n\
    \n虽然 Git 主要通过命令行使用，但对于偏好图形界面的用户，也有多种图形界面客户端可供选择：\n\n- **GitKraken：** 一款功能强大、跨平台的\
