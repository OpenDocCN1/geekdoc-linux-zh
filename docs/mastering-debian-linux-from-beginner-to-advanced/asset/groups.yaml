    11. **/root**：root 用户（系统管理员）的主目录。\n12. **/run**：包含自上次启动以来启动的进程的运行时数据。\n13. **/sbin**：系统二进制文件和管理工具。\n\
    14. **/srv**：系统提供的服务数据。\n15. **/sys**：暴露内核和设备信息的虚拟文件系统。\n16. **/tmp**：在重启时清除的临时文件。\n\
    17. **/usr**：用户程序、库和文档。\n18. **/var**：可变数据，包括日志、spool 文件和临时文件。\n\n**重要文件**\n\n\
    - `/etc/fstab`：文件系统表，定义挂载点和选项。\n- `/etc/passwd`：用户账户信息。\n- `/etc/shadow`：加密的用户密码。\n\
    - `/etc/group`：组信息。\n- `/etc/hostname`：系统主机名。\n- `/etc/hosts`：静态 IP 地址到主机名的映射。\n\
