    +   - Remove a container: `podman rm container_id`

    +   - Remove an image: `podman rmi image_name`


    # **Comparing Docker and Podman**


    | Feature | Docker | Podman |

    | :--- | :--- | :--- |

    | Architecture | Client-server (requires daemon) | Daemonless |

    | Root privileges | Required for daemon | Supports rootless containers |

    | Image compatibility | Docker images | Compatible with Docker images |

    | Orchestration | Docker Swarm | Kubernetes (via CRI-O) |

    | Command-line interface | `docker` | `podman` (mostly compatible with `docker`
    CLI) |


