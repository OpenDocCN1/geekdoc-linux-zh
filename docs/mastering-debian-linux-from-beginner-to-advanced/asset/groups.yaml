    SFTP is a secure file transfer protocol that uses SSH for data transfer and user
    authentication. It''s a more secure alternative to traditional FTP.


    # **Setting up SFTP**


    In Debian, SFTP is typically provided by the OpenSSH server, which is often installed
    by default. If it''s not installed, you can install it with:


    ```

    ```bash

    sudo apt update

    sudo apt install openssh-server

    ```

    ```


    Once installed, SFTP should be available automatically.


    # **Using SFTP**


    To connect to an SFTP server from a client machine:


    ```

    ```bash

    sftp username@remote_host

    ```

    ```


    Replace `username` with your username on the remote server and `remote_host` with
    the server''s IP address or domain name.


    Common SFTP commands include:


    +   - `put filename`: Upload a file

    +   - `get filename`: Download a file

    +   - `ls`: List directory contents

    +   - `cd directory`: Change directory

    +   - `mkdir directory`: Create a directory

    +   - `rm filename`: Remove a file'
  - '[PAGE 139]


    +   - exit: Close the SFTP session


    # Securing SFTP


    To enhance SFTP security:


    +   1. Use strong passwords or SSH keys for authentication

    +   2. Limit SFTP access to specific users or groups

    +   3. Configure the SFTP server to use a chroot jail, restricting users to specific
    directories


    # SSH (Secure Shell)


    SSH is a secure protocol used for remote server administration and secure data
    communication.


    # Setting up SSH


    As with SFTP, SSH is provided by the OpenSSH server. If it’s not already installed:


    ```

    sudo apt update

    sudo apt install openssh-server

    ```


    # Using SSH


    To connect to a remote server using SSH:


    ```

    ssh username@remote_host

    ```'
  - '[PAGE 140]


    Replace `username` with your username on the remote server and `remote_host` with
    the server''s IP address or domain name.


    # SSH Key-Based Authentication


    Using SSH keys instead of passwords provides stronger security and convenience.
    To set up key-based authentication:


    +   1. Generate an SSH key pair on your local machine:


    ```

    ssh-keygen -t rsa -b 4096

    ```


    +   2. Copy the public key to the remote server:


    ```

    ssh-copy-id username@remote_host

    ```


    +   3. Now you should be able to log in without a password:


    ```

    ssh username@remote_host

    ```


    # Securing SSH


    To enhance SSH security:


    +   1. Disable password authentication and use only key-based authentication

    +   2. Change the default SSH port (22) to a non-standard port'
