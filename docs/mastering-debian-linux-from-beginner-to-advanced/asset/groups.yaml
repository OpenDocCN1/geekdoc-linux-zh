    ## 1. Debian 将保持 100% 自由软件

    - 主发行版中的所有软件都必须遵守 DFSG

    - Debian 不会使系统依赖于非自由软件


    ## 2. 我们将回馈自由软件社区

    - 改进和修复将提交回上游项目

    - Debian 将致力于自由软件的开发和传播


    ## 3. 我们不会隐瞒问题

    - 错误报告和安全问题将公开提供

    - 透明度是 Debian 运营的一项关键原则


    ## 4. 我们的优先事项是我们的用户和自由软件

    - 用户和自由软件社区的需求指导着 Debian 的决策

