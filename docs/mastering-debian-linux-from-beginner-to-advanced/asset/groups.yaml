    \  ```\n- **sar**：收集、报告和保存系统活动信息。\n  ```\n  sudo apt install sysstat\n  sar -u\
    \ 5 3\n  ```\n\n# 诊断启动和内核问题\n\n启动和内核问题可能特别难以诊断和解决。这里有一些策略和工具，帮助你排查这些问题。\n\n##\
    \ 理解启动过程\n\n1. **BIOS/UEFI**：执行硬件初始化并加载引导加载程序。\n2. **引导加载程序（例如 GRUB）**：加载内核和初始\
    \ ramdisk（initrd）。\n3. **内核**：初始化硬件并挂载根文件系统。\n4. **init 系统（例如 systemd）**：启动系统服务并将系统带到可用状态。\n\
    \n## 常见的启动问题及解决方案\n\n1. **GRUB 救援提示符**：\n   - 问题：GRUB 配置不正确或损坏。\n   - 解决方案：从 Live\
    \ USB 启动，chroot 进入系统，并重新安装 GRUB。\n2. **内核恐慌（Kernel panic）**：\n   - 问题：内核遇到致命错误，无法继续运行。\n\
    \   - 解决方案：引导到旧版本的内核，检查硬件兼容性，或更新内核。\n3. **服务启动失败**：\n   - 问题：关键系统服务在启动期间未能启动。\n\
    \   - 解决方案：检查服务日志，修复配置文件，或暂时禁用问题服务。\n\n## 用于诊断启动问题的工具\n\n1. **journalctl**：访问系统日志以识别与启动相关的错误。\n\
    \   ```\n   journalctl -b\n   ```\n2. **dmesg**：显示内核环形缓冲区消息。\n   ```\n   dmesg\
