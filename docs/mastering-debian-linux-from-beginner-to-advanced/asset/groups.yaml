    ```


    +   * **tmux:** A terminal multiplexer similar to screen but with more modern
    features.


    Basic usage:


    ```

    ```

    tmux

    # Run your commands

    # Press Ctrl+B, then D to detach

    tmux attach # to reattach

    ```

    ```


    # ## Systemd User Services'
