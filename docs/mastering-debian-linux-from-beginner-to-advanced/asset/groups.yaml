    # Dynamic IP Configuration (DHCP)


    For DHCP, use this configuration in `/etc/network/interfaces` :


    ```

    auto eth0

    iface eth0 inet dhcp

    ```


    # Network Manager


    Network Manager is a more user-friendly alternative for managing network connections,
    especially for desktop environments. To install:


    ```

    sudo apt install network-manager

    ```


    After installation, you can use the `nmcli` command-line tool or the graphical
    interface to manage connections.


    # Hostname Configuration


    To change the system''s hostname:


    +   1. Edit `/etc/hostname`:


    ```

    new-hostname

    ```'
