    # ## Enabling SELinux


    +   1. Edit the GRUB configuration:


    ```

    sudo nano /etc/default/grub

    ```


    +   2. Add security=selinux selinux=1 to the GRUB_CMDLINE_LINUX_DEFAULT line


    +   3. Update GRUB:


    ```

    sudo update-grub

    ```


    +   4. Reboot the system


    # ## SELinux Modes


    SELinux has three modes:


