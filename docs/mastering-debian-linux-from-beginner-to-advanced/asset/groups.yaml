    # Creating a Virtual Machine


    You can create virtual machines using either the command-line interface or the
    graphical virt-manager tool. We''ll cover both methods:


    # Using virt-manager (Graphical Method)


    +   1. Launch virt-manager:


    ```

    virt-manager

    ```


    +   2. Click on the "Create a new virtual machine" button.

    +   3. Choose the installation method (ISO image, network install, etc.).

    +   4. Follow the wizard to configure VM settings (RAM, CPU, storage, etc.).

    +   5. Complete the installation process.


    # Using virsh (Command-line Method)


    +   1. Create a disk image for the VM:


    ```

    qemu-img create -f qcow2 /path/to/vm_disk.qcow2 20G

    ```


    +   2. Install the VM using virt-install:'
  - "[PAGE 190]\n\n```\n```\nvirt-install --name debian_vm --ram 2048 --disk \npath=/path/to/vm_disk.qcow2,size=20\
    \ --vcpus 2 --os-type\nlinux --os-variant debian10 --network bridge=virbr0 --\n\
    graphics vnc --console pty,target_type=serial --cdrom\n/path/to/debian.iso\n```\n\
    ```\n\nAdjust the parameters according to your needs.\n\n# # Managing Virtual\
    \ Machines\n\n# ## Starting and Stopping VMs\n\nTo start a VM:\n\n```\n```\nvirsh\
    \ start debian_vm\n```\n```\n\nTo stop a VM:\n\n```\n```\nvirsh shutdown debian_vm\n\
    ```\n```\n\nTo force stop a VM:\n\n```\n```\nvirsh destroy debian_vm\n```\n```"
