    # # Network Troubleshooting


    Network issues can be frustrating, but Debian provides several tools to help diagnose
    and resolve these problems.


    # ## Ping


    The `ping` command is used to test network connectivity between your computer
    and another network device or website.


    ```

    ping google.com

    ```


    This command sends ICMP echo request packets to the specified host and waits for
    a reply. If successful, you''ll see a series of responses with round-trip times.


    # ## Traceroute


    The `traceroute` command shows the path that packets take to reach a destination,
    helping you identify where network issues might be occurring.


    ```

    traceroute google.com

    ```'
