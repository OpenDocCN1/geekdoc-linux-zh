    \  - 它启动初始化进程（在 Debian 中为 systemd）。\n\n- 4. **Systemd 初始化：**\n  - Systemd 成为第一个用户空间进程（PID\
    \ 1）。\n  - 它读取系统配置并启动系统服务。\n\n- 5. **服务启动：**\n  - Systemd 启动各种系统服务和守护进程。\n  -\
    \ 初始化网络接口、系统日志记录和其他必要服务。\n\n- 6. **显示管理器：**\n  - 如果已配置，显示管理器（例如，GDM、LightDM）将启动图形环境。\n\
    \n- 7. **用户登录：**\n  - 系统显示登录提示（文本或图形）进行用户身份验证。\n\n# Systemd 单元和目标\n\nSystemd 使用单元来管理服务、设备和其他系统组件。最常见的单元类型包括：\n\
    - **服务单元：** 定义系统服务和守护进程。\n- **目标单元：** 将其他单元组合在一起以对应特定的系统状态。\n- **套接字单元：** 管理网络和\
    \ IPC 套接字。\n- **设备单元：** 管理硬件设备。\n\nSystemd 目标取代了传统的运行级别。常见目标包括：\n- **default.target：**\
    \ 默认目标，通常指向 graphical.target 或 multi-user.target。\n- **graphical.target：** 具有网络功能的完整图形环境。\n\
    - **multi-user.target：** 具有网络功能的多用户文本模式。\n- **rescue.target：** 用于系统恢复的单用户模式。\n\
    \n## 系统关机过程\n- 1. **关机命令：**\n  - 关机过程由 shutdown 命令或通过桌面环境发起。\n\n- 2. **Systemd\
    \ 关机：**\n  - Systemd 开始停止正在运行的服务和进程。\n  - 它发送 SIGTERM 信号以允许优雅终止。\n\n- 3. **强制终止剩余进程：**\n\
    \  - 任何剩余进程将使用 SIGKILL 强制终止。\n\n- 4. **卸载文件系统：**\n  - 卸载文件系统以确保数据完整性。\n\n- 5.\
    \ **最终系统停止：**\n  - 根据请求停止或重新启动系统。\n\n## 系统控制的重要命令\n- 1. `systemctl`：控制 systemd\
    \ 的主要命令\n  - 启动服务：`sudo systemctl start service_name`\n  - 停止服务：`sudo systemctl\
    \ stop service_name`\n  - 重启服务：`sudo systemctl restart service_name`\n  - 启用服务在启动时运行：`sudo\
    \ systemctl enable service_name`\n  - 禁用服务在启动时运行：`sudo systemctl disable service_name`\n\
    \  - 检查服务状态：`systemctl status service_name`\n\n- 2. `shutdown`：系统关机或重启\n  - 立即关机：`sudo\
    \ shutdown now`\n  - 重启：`sudo shutdown -r now`\n  - 计划关机：`sudo shutdown +30 \"\
    System will shutdown in 30 minutes\"`\n\n- 3. **reboot**：重启系统\n  - `sudo reboot`\n\
    \n- 4. **poweroff**：关闭系统电源\n  - `sudo poweroff`\n\n- 5. **journalctl**：查看 systemd\
    \ 日志\n  - 查看所有日志：`journalctl`\n  - 查看特定服务的日志：`journalctl -u service_name`\n  -\
    \ 查看内核消息：`journalctl -k`\n\n理解系统启动和关机过程以及控制这些过程的工具，对于 Debian 系统的有效管理和故障排除至关重要。\n\
    \n# 使用 Debian 包管理系统（APT）\n\nDebian 的 Advanced Package Tool（APT）是一个强大的包管理系统，简化了软件包的安装、更新和删除过程。APT\
    \ 处理依赖项、配置和升级，使系统维护更加高效。\n\n## APT 组件\n1. **apt**：包管理的高级命令行界面。\n2. **apt-get**：低级包管理工具。\n\
    3. **apt-cache**：查询 APT 包缓存。\n4. **dpkg**：Debian 包管理器（由 APT 使用）。\n"
