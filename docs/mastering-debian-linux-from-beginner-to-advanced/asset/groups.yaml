    ```


    +   3. Apply the changes:


    ```

    sudo hostnamectl set-hostname new-hostname

    ```


    # **DNS Configuration**


    DNS settings are typically managed through the `/etc/resolv.conf` file. However,
    this file is often managed automatically by other services. To set custom DNS
    servers:


    +   1. For systems using Network Manager, edit the connection settings.

    +   2. For systems using systemd-resolved, edit `/etc/systemd/resolved.conf`.

    +   3. For manual configuration, edit `/etc/resolv.conf`:


    ```

    nameserver 8.8.8.8

    nameserver 8.8.4.4

    ```


    # **Firewall Configuration**'
  - '[PAGE 62]


    Debian uses `iptables` for firewall functionality. For easier management, you
    can use `ufw` (Uncomplicated Firewall):


    +   1. Install `ufw`:


    ```

    sudo apt install ufw

    ```


    +   2. Enable `ufw`:


    ```

    sudo ufw enable

    ```


    +   3. Allow specific ports:


    ```

    sudo ufw allow 22/tcp  # Allow SSH

    sudo ufw allow 80/tcp  # Allow HTTP

    ```


    +   4. Check status:


    ```

    sudo ufw status

    ```


    # ## Network Troubleshooting Tools


    +   1. `ping`: Test connectivity to a host'
