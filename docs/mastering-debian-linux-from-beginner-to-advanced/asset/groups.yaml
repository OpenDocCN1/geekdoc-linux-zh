    # Running Background Processes


    In Linux systems, background processes, also known as daemons, are programs that
    run continuously in the background, providing various services to the system or
    users. Understanding how to manage these processes is crucial for system administrators
    and power users.


    # Types of Background Processes


    +   1. **System Daemons**: These are background processes that start during system
    boot and run continuously until the system is shut down. Examples include `sshd`
    (SSH server), `crond` (cron daemon), and `systemd` itself.

    +   2. **User Daemons**: These are background processes started by individual
    users, often for specific tasks or applications.

    +   3. **Detached Processes**: Regular processes that are manually "detached"
    from the terminal and sent to the background.


    # Starting a Process in the Background


    To start a process in the background from the command line, you can use the `&`
    symbol at the end of the command:'
  - '[PAGE 112]


    ```

    command &

    ```


    For example:


    ```

    long_running_script.sh &

    ```


    This starts the script and returns control to the terminal immediately, with the
    process running in the background.


    # Managing Background Processes


    +   1. Listing Background Jobs:


    Use the `jobs` command to list current background jobs in the current shell session:


    ```

    jobs

    ```


    +   2. Bringing a Background Job to the Foreground:


    Use the `fg` command followed by the job number (as shown by `jobs`):


    ```

    fg %1

    ```'
  - '[PAGE 113]


    # 3. Sending a Foreground Process to the Background:


    Press `Ctrl+z` to suspend the current foreground process, then use the `bg` command
    to continue it in the background:


    ```

    bg

    ```


    # 4. Killing a Background Process:


    Use the `kill` command followed by the process ID or job number:


    ```

    kill %1

    ```


    or


    ```

    kill 1234

    ```


    # Nohup Command


    The `nohup` command is used to run a command immune to hangups, with output to
    a non-tty:


    ```

    nohup command &

    ```'
  - '[PAGE 114]


    This is useful for running processes that should continue even after the user
    logs out.


    # ## Screen and tmux


    For more advanced management of background processes, especially for interactive
    sessions, tools like `screen` and `tmux` are invaluable:


    +   * **Screen:** A full-screen window manager that multiplexes a physical terminal
    between several processes.


    Basic usage:


    ```

    ```

    screen

    # Run your commands

