    \ and restore capabilities\n\n## Installing LXD on Debian\n\n1. Update the package\
    \ index:\n\n   ```\n   sudo apt update\n   ```\n\n2. Install LXD:\n\n   ```\n\
    \   sudo apt install lxd\n   ```\n\n3. Add your user to the lxd group:\n\n   ```\n\
    \   sudo adduser $(whoami) lxd\n   ```\n\n4. Initialize LXD:\n\n   ```\n   sudo\
    \ lxd init\n   ```\n\n   Follow the prompts to configure LXD according to your\
    \ needs.\n\n# Basic LXC/LXD Commands\n\n- Create a container: `lxc launch images:debian/10\
    \ my-debian`\n- List containers: `lxc list`\n- Start a container: `lxc start my-debian`\n\
