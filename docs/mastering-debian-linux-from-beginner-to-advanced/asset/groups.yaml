    # Best Practices for VM Management


    +   1. **Regular Backups:** Implement a backup strategy for your VMs and their
    data.

    +   2. **Resource Monitoring:** Keep an eye on host resource usage to prevent
    overallocation.

    +   3. **Security:** Apply security patches and updates to both host and guest
    systems regularly.

    +   4. **Documentation:** Maintain documentation of VM configurations and purposes.

    +   5. **Performance Tuning:** Optimize VM settings for best performance based
    on workload.


    # Using Docker and Podman for Containerization


    Containerization is a lightweight alternative to full machine virtualization.
    Containers package applications and their dependencies, ensuring consistent behavior
    across different environments. Docker and Podman are two popular containerization
    technologies, each with its own strengths.


    # Introduction to Docker


    Docker is a platform for developing, shipping, and running applications in containers.
    It uses containerization technology to package an application and its dependencies
    into a standardized unit for software development and deployment.


    # Key Concepts in Docker:'
  - "[PAGE 193]\n\n+   1. **Images**: Read-only templates containing an application\
    \ and its dependencies.\n+   2. **Containers**: Running instances of Docker images.\n\
    +   3. **Dockerfile**: A text file that contains instructions for building a Docker\
    \ image.\n+   4. **Docker Hub**: A cloud-based registry for sharing and storing\
    \ Docker images.\n\n# ## Installing Docker on Debian\n\n+   1. Update the package\
    \ index:\n\n```\nsudo apt update\n```\n\n+   2. Install prerequisites:\n\n```\n\
    sudo apt install apt-transport-https ca-certificates curl\n    gnupg lsb-release\n\
    ```\n\n+   3. Add Docker's official GPG key:\n\n```\ncurl -fsSL https://download.docker.com/linux/debian/gpg\
    \ |\n    sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-\n    keyring.gpg\n\
    ```\n\n+   4. Set up the stable repository:"
  - '[PAGE 194]


    ```

    echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-

    archieve-keyring.gpg]

    https://download.docker.com/linux/debian $(lsb_release -cs)

    stable" | sudo tee /etc/apt/sources.list.d/docker.list >

    /dev/null

    ```


    5. Install Docker Engine:


    ```

    sudo apt update

    sudo apt install docker-ce docker-ce-cli containerd.io

    ```


    6. Verify the installation:


    ```

    sudo docker run hello-world

    ```


    # Basic Docker Commands


    +   - Pull an image: `docker pull image_name`

    +   - List images: `docker images`

    +   - Run a container: `docker run image_name`

    +   - List running containers: `docker ps`

    +   - Stop a container: `docker stop container_id`

    +   - Remove a container: `docker rm container_id`

    +   - Remove an image: `docker rmi image_name`


