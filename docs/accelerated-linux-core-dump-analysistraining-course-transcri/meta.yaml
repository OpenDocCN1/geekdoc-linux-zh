    # Memory/Kernel/User Space


    ![](img/505723759b6e3a2f5ec882b013616da5_14_0.png)


    If you come from Windows or Mac OS X background, you find fundamentals almost
    the same. For every process, the Linux memory range is divided into kernel space
    part, user space part, and an inaccessible part to catch null pointers¹. This
    non-accessible region is different from Mac OS X, where it is 1 GB. We follow
    the tradition of using red color for kernel and blue color for user part. Please
    note that there is a difference between space and mode. The mode is the execution
    privilege attribute; for example, code running in kernel space has a higher execution
    privilege than code running in user space. However, kernel code can access user
    space and access data there. We say that code running is running in kernel mode.
    On the contrary, the application from user space is running in user mode, and
    because of its lower privilege, it cannot access kernel space. This division prevents
    accidental kernel modifications. Otherwise, you could easily crash your system.
    It puts addresses on the right. This uniform memory space is called virtual process
    space because it is an abstraction that allows us to analyze core dumps without
    thinking about how it is all organized in physical memory. When we look at process
    dumps, we are concerned with virtual space.


    On my Debian system it is 0xFFFF, as seen from /proc/sys/vm/mmap_min_addr value.


    15'
  - '[PAGE 15]


    # App/Process/Library


    ![](img/505723759b6e3a2f5ec882b013616da5_15_0.png)


    When an app is loaded, all its referenced dynamic libraries are mapped to virtual
    memory space. Different sections of the same file (like code and data) may be
    mapped into a different portion of memory. In contrast, modules in Windows are
    organized sequentially in virtual memory space. A process is then set up for running,
    and a process ID is assigned to it. If you run another such app, it has a different
    virtual memory space.


    16'
  - '[PAGE 16]


    # Process Memory Dump


    ![](img/505723759b6e3a2f5ec882b013616da5_16_0.png)


    When we save a process core memory dump, a user space portion of the process space
    is saved without any kernel space stuff. However, we never see such large core
    dumps unless we have memory leaks. This is because process space has gaps unfilled
    with code and data. These unallocated parts are not saved in a core dump. However,
    if some parts were paged out and reside in a page file, they are usually brought
    back before saving a core dump.'
  - '[PAGE 17]


    # # Kernel Memory Dump


    ![](img/505723759b6e3a2f5ec882b013616da5_17_0.png)


    2022 Software Diagnostics Services


    In case of a kernel panic, a kernel memory dump is saved if the appropriate mechanism
    is configured

