- md: "\n# Presentation Slides and Transcript\n\n找书请加QQ群: 8321178\n\n# Linux\n# Core\
    \ Dump Analysis\n## Accelerated\n### Second Edition\n\nDmitry Vostokov\nSoftware\
    \ Diagnostics Services\n\nHello, everyone, my name is Dmitry Vostokov, and I teach\
    \ this training course.\n\n# Prerequisites\n\nGDB Commands\nWe use these boxes\
    \ to introduce GDB commands used in practice exercises\n\nWinDbg Commands\nWe\
    \ use these boxes to introduce WinDbg commands used in practice exercises\n\n\
    - Basic Linux troubleshooting\n- Beneficial to know basics of assembly language\
    \ (depends on your platform):\n    - Practical Foundations of Linux Debugging,\
    \ Disassembling, Reversing\n    - Practical Foundations of ARM64 Linux Debugging,\
    \ Disassembling, Reversing\n\nThe prerequisites are hard to define. Some of you\
    \ have software development experience, and some do not. However, one thing is\
    \ certain that to get most of this training, you are expected to have basic troubleshooting\
    \ experience. Another thing I expect you to be familiar with hexadecimal notation\
    \ and that you have seen or can read programming source code in some language.\
    \ The ability to read assembly language has some advantages but is not really\
    \ necessary for this training. Windows memory dump analysis experience may help\
    \ ease but is not absolutely necessary. If you read either Accelerated Mac OS\
    \ X Core Dump Analysis or Accelerated Windows Memory Dump Analysis book or both,\
    \ you may find a similar approach here.\n\n# Training Goals\n\n- Review fundamentals\n\
    - Learn how to collect core dumps\n- Learn how to analyze core dumps\n\nOur primary\
    \ goal is to learn core dump analysis in an accelerated fashion. So first, we\
    \ review absolutely essential fundamentals necessary for core dump analysis. Also,\
    \ this training is mostly about user process core dump analysis with an accelerated\
    \ transition to kernel core dump analysis which is a topic fully explored in the\
    \ follow-up course and book **Advanced Linux Core Dump Analysis with Data Structures**.\
    \ An additional goal is to leverage Windows or Mac OS X debugging and memory dump\
    \ analysis experience you may have.\n\n# Training Principles\n\n- Talk only about\
    \ what I can show\n- Lots of pictures\n- Lots of examples\n- Original content\n\
    \nFor me, there were many training formats to consider, and I decided that the\
    \ best way is to concentrate hands-on exercises. Specifically, for this training,\
    \ I developed 30 of them, and they utilize the same pattern-oriented approach\
    \ I used in Accelerated Windows Memory Dump Analysis and Accelerated Mac OS X\
    \ Core Dump Analysis training.\n\n找书请QQ群: 8321178\n\n# Schedule Summary\n\nDay\
    \ 1\n\n- Analysis fundamentals (25 minutes)\n- Process core dump collection (5\
    \ minutes)\n- Process GDB core dump analysis (1 hour 30 minutes)\n\nDay 2\n\n\
    - Process GDB core dump analysis (1 hour 40 minutes)\n- Process WinDbg core dump\
    \ analysis (20 minutes)\n\nDay 3\n\n- Kernel core dump collection (5 minutes)\n\
    - Kernel core dump analysis (55 minutes)\n- Process WinDbg core dump analysis\
    \ (1 hour)\n\nThis slide shows roughly planned schedule subject to changes as\
    \ we go.\n\n# Part 1: Fundamentals\n\nNow, I show you some pictures. I use 64-bit\
    \ examples. Most of the time, fundamentals do not change when we move to 32-bit\
    \ Linux, and the analysis process is mostly the same.\n\n找书加QQ群: 8321178\n\n#\
    \ Memory/Kernel/User Space\n\n![](img/505723759b6e3a2f5ec882b013616da5_14_0.png)\n\
    \nIf you come from Windows or Mac OS X background, you find fundamentals almost\
    \ the same. For every process, the Linux memory range is divided into kernel space\
    \ part, user space part, and an inaccessible part to catch null pointers¹. This\
    \ non-accessible region is different from Mac OS X, where it is 1 GB. We follow\
    \ the tradition of using red color for kernel and blue color for user part. Please\
    \ note that there is a difference between space and mode. The mode is the execution\
    \ privilege attribute; for example, code running in kernel space has a higher\
    \ execution privilege than code running in user space. However, kernel code can\
    \ access user space and access data there. We say that code running is running\
    \ in kernel mode. On the contrary, the application from user space is running\
    \ in user mode, and because of its lower privilege, it cannot access kernel space.\
    \ This division prevents accidental kernel modifications. Otherwise, you could\
    \ easily crash your system. It puts addresses on the right. This uniform memory\
    \ space is called virtual process space because it is an abstraction that allows\
    \ us to analyze core dumps without thinking about how it is all organized in physical\
    \ memory. When we look at process dumps, we are concerned with virtual space.\n\
    \nOn my Debian system it is 0xFFFF, as seen from /proc/sys/vm/mmap_min_addr value.\n\
    \n# App/Process/Library\n\n![](img/505723759b6e3a2f5ec882b013616da5_15_0.png)\n\
    \nWhen an app is loaded, all its referenced dynamic libraries are mapped to virtual\
    \ memory space. Different sections of the same file (like code and data) may be\
    \ mapped into a different portion of memory. In contrast, modules in Windows are\
    \ organized sequentially in virtual memory space. A process is then set up for\
    \ running, and a process ID is assigned to it. If you run another such app, it\
    \ has a different virtual memory space.\n\n# Process Memory Dump\n\n![](img/505723759b6e3a2f5ec882b013616da5_16_0.png)\n\
    \nWhen we save a process memory dump, a user space portion of the process is saved\
    \ without any kernel space stuff. This is because process space has gaps which\
    \ are not saved in a core dump. However, if some parts were paged out and reside\
    \ in a page file, they are usually brought back before saving the dump.\n\n# Kernel\
    \ Memory Dump\n\n![](img/505723759b6e3a2f5ec882b013616da5_17_0.png)\n\n2022 Software\
    \ Diagnostics Services\n\nIn case of a kernel panic, a kernel memory dump is saved\
    \ if the appropriate mechanism is configured (mostly by default for recent distributions,\
    \ such as Ubuntu). Virtual memories of running processes are not saved, however.\
    \ For that, you need various physical memory acquisition methods and tools that\
    \ are outside the scope of this course.\n\n找书加群:8321178\n\n# Fiber Bundle Memory\
    \ Dump\n\n![](img/505723759b6e3a2f5ec882b013616da5_18_0.png)\n\nThe lack of complete\
    \ memory dumps may be circumvented by dumping individual processes and then forcing\
    \ a kernel memory dump to analyze together. We call the resulting dump type Fiber\
    \ Bundle.\n\n找书加QQ群：8321178\n\n# Lightweight Processes (Threads)\n\n![](img/505723759b6e3a2f5ec882b013616da5_19_0.png)\n\
