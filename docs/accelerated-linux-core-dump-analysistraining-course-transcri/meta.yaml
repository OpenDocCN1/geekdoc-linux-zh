    # 关于作者


    Dmitry Vostokov 是一位国际认可的专家、演讲者、教育者、科学家、发明者和作者。他是模式化软件诊断、取证和预后学科（系统化软件诊断）以及软件诊断研究所（DA+TA:
    DumpAnalysis.org + TraceAnalysis.org）的创始人。Vostokov 还编写了 50 多本关于软件诊断、异常检测与分析、软件取证、根本原因分析、软件追踪和日志分析、逆向工程以及恶意软件分析的书。他在各行业的软件架构、设计、开发和维护方面拥有25
    年经验，涵盖领导、技术和人员管理角色。Dmitry 还创立了 Syndromatik、Analogio、BriteTrace、DiaThings、Loglett、OpenTask
    迭代与增量出版（OpenTask.com）、软件诊断技术和服务（原内存转储分析服务）PatternDiagnostics.com 以及软件预后。在空余时间，他针对调试、电视等多个主题进行演讲，并探索软件叙事及其进一步发展为万物叙事和万物诊断（DoT）、软件病理学以及量子诊断。他目前的兴趣领域是理论软件诊断及其数学和计算机科学基础、形式逻辑、人工智能、机器学习和数据挖掘在诊断和异常检测中的应用、软件诊断工程以及诊断驱动开发、诊断工作流和交互。近期兴趣领域还包括云原生、安全、自动化、函数式编程以及范论在软件开发和大数据中的应用。


    '
