    # About the Author


    Dmitry Vostokok is an internationally recognized expert, speaker, educator, scientist,
    inventor, and author. He is the founder of the pattern-oriented software diagnostics,
    forensics, and prognosis discipline (Systematic Software Diagnostics), and Software
    Diagnostics Institute (DA+TA: DumpAnalysis.org + TraceAnalysis.org). Vostokok
    has also authored more than 50 books on software diagnostics, anomaly detection
    and analysis, software forensics, root cause analysis, software trace and log
    analysis, reverse engineering, and malware analysis. He has 25 years of experience
    in software architecture, design, development, and maintenance in various industries,
    including leadership, technical, and people management roles. Dmitry also founded
    Syndromatik, Analogio, BriteTrace, DiaThings, Loglett, OpenTask Iterative and
    Incremental Publishing (OpenTask.com), Software Diagnostics Technology and Services
    (former Memory Dump Analysis Services) PatternDiagnostics.com, and Software Prognostics.
    In his spare time, he presents various topics on Debugging, TV and explores Software
    Narratology, its further development as Narratology of Things and Diagnostics
    of Things (DoT), Software Pathology, and Quantum Diagnostics. His current interest
    areas are theoretical software diagnostics and its mathematical and computer science
    foundations, application of formal logic, artificial intelligence, machine learning
    and data mining to diagnostics and anomaly detection, software diagnostics engineering
    and diagnostics-driven development, diagnostics workflow and interaction. Recent
    interest areas also include cloud native computing, security, automation, functional
    programming, and applications of category theory to software development and big
    data.

