  \ | 0 |\n| `wsrep_replicated_bytes` | 0 |\n\n## 测试复制\n\n为了测试复制，我们将在节点 `sr3` 上创建一个在每个节点中同步的数据库。从创建数据库开始：\n\
  \n```bash\nroot@sr3 ~]# mysql -u root -p\nEnter password:\n```\n\n我们选择创建的数据库并创建一个名为\
  \ `alumnos` 的表：\n\n```sql\nMariaDB [(none)]> CREATE DATABASE empresa;\nQuery OK,\
  \ 1 row affected (0.007 sec)\nMariaDB [(none)]> use empresa;\nDatabase changed\n\
  MariaDB [empresa]> CREATE TABLE alumnos ( Id INT NOT NULL AUTO_INCREMENT, Nombre\
  \ VARCHAR(100), Sexo INT, PRIMARY KEY(Id));\nQuery OK, 0 rows affected (0.022 sec)\n\
  ```\n\n向数据库中插入并显示几条记录：\n\n```sql\nMariaDB [empresa]> insert into alumnos (Nombre,\
  \ Sexo) values ('Fabian Mestre',1);\nQuery OK, 1 row affected (0.004 sec)\nMariaDB\
  \ [empresa]> insert into alumnos (Nombre, Sexo) values ('Juana Mestre',0);\nQuery\
  \ OK, 1 row affected (0.004 sec)\nMariaDB [empresa]> select * from alumnos;\n+----+---------------+------+\n\
  | Id | Nombre         | Sexo |\n+----+---------------+------+\n|  2 | Fabian Mestre\
  \ |    1 |\n|  5 | Juana Mestre |    0 |\n+----+---------------+------+\n2 rows\
  \ in set (0.000 sec)\n```\n\n为了验证复制情况，我们离开 `sr3` 并进入 `sr2`，由于 Galera-MariaDB 集群的配置，我们在这里看到复制的数据：\n\
  \n```bash\nroot@sr2 ~]# mysql -u root -p\n```\n\n\n\n\n\n```\n> Your MariaDB connection\
  \ id is 10\n> Server version: 10.3.28-MariaDB MariaDB Server\n> Copyright (c) 2000,\
  \ 2018, Oracle, MariaDB Corporation Ab and others.\n> Type 'help;' or '\\h' for\
  \ help. Type '\\c' to clear the current input statement.\n> MariaDB [(none)]> use\
  \ empresa;\n> Reading table information for completion of table and column names\n\
  > You can turn off this feature to get a quicker startup with -A\n> Database changed\n\
  > MariaDB [empresa]> select * from alumnos;\n> +----+---------------+------+\n>\
  \ | Id | Nombre        | Sexo |\n> +----+---------------+------+\n> | 2 | Fabian\
  \ Mestre | 1 |\n> | 5 | Juana Mestre | 0 |\n> +----+---------------+------+\n> 2\
  \ rows in set (0.001 sec)\n> MariaDB [empresa]>\n```\n\n进行了以下观察：\n\n* 如果重启额外节点并保持第一个主开启，当额外节点恢复时，它们将连接到集群。\n\
  * 如果关闭第一个主节点，集群在两个额外节点上仍然存。\n* 当主节点关闭且任何节点处于服务中时，主节点将无问题地启动。\n* 在 3 节点的集群中，关闭第一个主节点和一个节点，只留一个节点开启；当节点关闭时，集群将无问题地启动。\n\
  * 在 3 节点的集群中，当三个节点都关闭并打开或重启时，在启动集群节点时，没有任何 `mariadb` 服务启动，因此集群未部署，我们遇到了问题。在本手册的编写之日，曾尝试恢复这三个节点的集群但未成功；我们将继续尝试详细说明此呈现的异常，恢复集群的正确方法将被记录并发布。\n\
  \n# 使用本地媒体创建存储库\n\n如下所示，可以使用安装操作系统的 ISO 镜像建立本地软件存储库：\n\n1. 在你的系统上创建 `/repo` 文件夹：\n\
  ```bash\n[root@pruebas ~]# mkdir /repo\n```\n\n2. 插入安装介质，无论是 USB 还是 DVD。\n```bash\n\
  [root@pruebas ~]# lsblk\nNAME            MAJ:MIN RM  SIZE RO TYPE MOUNTPOINT\nsda\
  \             8:0    0   50G  0 disk\n|-sda1          8:1    0    1G  0 part /boot\n\
  `-sda2          8:2    0   49G  0 part\n|-rhel-root 253:0    0   44G  0 lvm  /\n\
  `-rhel-swap 253:1    0    5G  0 lvm  [SWAP]\nsr0            11:0    1   8.8G  0\
  \ rom\n```\n在验证了 Linux 系统识别的设备后，我们告知 `/dev/sr0` 设备是包含安装 ISO 的设备。\n\n3. 在 `/etc/fstab`\
  \ 文件中**添加以下行**：`\"/dev/sr0 /repo iso9660 defaults 0 0\"` 然后输入 `mount -a`：\n```bash\n\
