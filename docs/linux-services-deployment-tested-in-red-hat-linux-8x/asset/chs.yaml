  \n```bash\n[root@bd2]# ll /pgsql-data/\ntotal 48\n-rw-r--r--. 1 postgres postgres\
  \ 3 Mar 26 13:35 PG_VERSION\ndrwx------. 5 postgres postgres 41 Mar 26 13:35 base\n\
