  \n# 轻松恢复 - 备份并还原 Linux 系统\n\n使用现有备份恢复和还原系统，Red Hat Linux（其他发行版也可以安装）提供了 ReaR。你可以使用该工具作为灾难恢复和系统迁移方案。该工具允许你执行以下任务：\n\
  \n- 构建镜像并从现有备份恢复系统。\n- 复制原始存储。\n- 恢复用户和系统文件。\n- 将系统恢复到不同的硬件。\n\n此外，对于灾难恢复，你还可以集成备份软件\
  \ ReaR。以下步骤用于创建 Linux 系统的救援镜像以及数据备份，此操作的时间取决于保存的数据量。需要说明的是，此备份以 ISO 文件的形式留在管理员指定的路径。首先安装执行此活动所需的应用程序：\n\
  \n```bash\n[root@pruebas ~]# yum install rear genisoimage syslinux\n```\n\n安装软件后，需要告诉\
  \ `rear` 生成救援磁盘和系统备份，编辑配置文件并添加以下语句：\n\n```bash\n[root@pruebas ~]# vim /etc/rear/local.conf\n\
  OUTPUT=ISO\nOUTPUT_URL=file:///root\nBACKUP=NETFS\nBACKUP_URL=iso:///root\n```\n\
  \n在发送备份之前，了解要备份系统的总大小是有意义的：\n\n```bash\n[root@s1 rear]# df -h\nFilesystem      Type\
  \  Size Used Avail Use% Mounted on\ndevtmpfs        tmpfs      15G   0   15G   0%\
  \ /dev\ntmpfs           tmpfs      15G   0   15G   0% /dev/shm\ntmpfs          \
  \ tmpfs      15G  9.2M  15G   1% /run\ntmpfs           tmpfs      15G   0   15G\
  \   0% /sys/fs/cgroup\ndev/mapper/ol-root xfs        44G  20G  25G  44% /*\n/dev/sda1\
  \       xfs      1014M  593M  422M  59% /boot\ntmpfs           tmpfs      2.9G \
  \ 1.2M  2.9G   1% /run/user/42\ntmpfs           tmpfs      2.9G   0   2.9G   0%\
  \ /run/user/0\n```\n\n随后，需要制作 Linux 系统的救援和备份 ISO（单个文件），此 ISO 将留在 `/root/system-name`\
  \ 路径，如下：\n\n```bash\n[root@s1 rear]# rear -d -v mkbackup\nRelax-and-Recover 2.4\
  \ / Git\nUsing log file: /var/log/rear/rear-s1.log\nUsing backup archive '/tmp/rear.w0E22PfRdLwJCFg/tmp/isofs/root/backup.tar.gz'\n\
  Creating disk layout\nUsing guessed bootloader 'GRUB' (found in first bytes on /dev/sda)\n\
  Creating root filesystem layout\nHandling network interface 'ens18'\nens18 is a\
  \ physical device\nHandled network interface 'ens18'\nSkipping 'virbr0': not bound\
  \ to any physical interface.\n\n通过 ssh 登录救援系统，请设置 `/root/.ssh/authorized_keys` 或指定\
  \ `SSH_ROOT_PASSWORD`\n```\n\n\n\n\n\n```\n> 将日志文件 `/var/log/rear/rear-s1.log` 复制到\
  \ initramfs `/tmp/rear-s1-partial-2021-02-22T10:47:38-05:00.log`\n\n> 正在复制文件和目录\n\
  > 正在复制二进制文件和库\n> 正在复制内核模块\n> 正在复制 `/lib*/firmware/` 下的所有文件\n> 正在使用 gzip 默认压缩创建恢复/救援系统\
  \ initramfs/initrd initrd.cgz\n> 使用 gzip 压缩创建 initrd.cgz (340662414 字节)，耗时 35 秒\n\
  > 正在创建 tar 归包 `/tmp/rear.w0E22PfRdLwJCFg/tmp/isofs/root/backup.tar.gz`\n> 已归档 3282\
  \ MiB [平均 6654 KiB/sec] OK\n> 在 506 秒内归档了 3282 MiB [平均 6641 KiB/sec]\n> 正在制作 ISO\
  \ 镜像\n> 已写入 ISO 镜像：`/var/lib/rear/output/rear-s1.iso` (3.6G)\n> 正在将结果复制到文件位置\n>\
  \ 将 `/var/log/rear/rear-s1.log` 保存为 `rear-s1.log` 到文件位置\n> 退出 `rear mkbackup` (PID\
  \ 63025) 及其子进程\n> 正在运行退出任务\n> 你应该执行 `rm -Rf /tmp/rear.w0E22PfRdLwJCFg`\n```\n\n\
  ISO 文件的位置已验证：\n\n```\n[root@s1 ~]# pwd\n/root\n[root@s1 ~]# ll\ntotal 8\n-rw-------.\
  \ 1 root root 1279 Feb 15 10:15 anaconda-ks.cfg\n-rw-r--r--. 1 root root 1566 Feb\
  \ 15 10:17 initial-setup-ks.cfg\ndrwxr-x---. 2 root root  73 Feb 22 10:57 s1\n[root@s1\
  \ ~]# cd s1/\n[root@s1 s1]# ll -h\ntotal 3.6G\n-rw-------. 1 root root  202 Feb\
  \ 22 10:57 README\n-rw-------. 1 root root  274 Feb 22 10:57 VERSION\n-rw-------.\
  \ 1 root root 3.6G Feb 22 10:57 rear-s1.iso\n-rw-------. 1 root root 967K Feb 22\
  \ 10:57 rear-s1.log\n```\n\n\"rear\" 应用已生成了一个 ISO 文件，从该文件可以生成一个可启动的 USB 闪盘，或者根据需要将其放入虚拟化系统中。在本练习中，我们将使用虚拟化平台。\n\
  \n![](img/Image00007.jpg) \n\n当从 ISO 启动时，会出现以下图像：\n\n![](img/Image00008.jpg)\n\n\
  选择第一个选项，Linux 系统恢复过程开始，如下所示：\n\n![](img/Image00009.jpg)\n\n如我们所示，系统要求“登录”（login），在此情况下输入\
  \ \"root\" 并按回车键。接下来我们看到提示输入命令，在此情况下命令将是 `rear -v recover`，这将触发操作系统的恢复，详细如下：\n\n\
  ![](img/Image00010.jpg)\n\n随后，需要等待恢复运行。一旦恢复程序完成，我们将看到类似下面的图像：\n\n![](img/Image00011.jpg)\n\
  \n在这里，系统返回给我们一个提示符，我们在其中发送 \"reboot\"重启）并启动恢复后的系统。需要说明的是，SELinux 将对系统进行重新标记，这会在发生时稍微延迟过程。\n\
  \n![](img/Image00012.jpg)\n\n一旦此过程完成，系统将重启并进入正常运行状态，与 `rear -v mkbackup` 生成时的状态完全相同。\n\
  \n# 安装虚拟化能力 (KVM / VIRT-MANAGER)\n\n在接下来的材料中，你将看到如何将 RHEL 8 宿主机转换为功能强大的虚拟化层管理程序（hypervisor）。需要说明的是，`libvirt`\
  \ 是实现所有虚拟化魔法的核心，正因为有它，诸如 `virsh`、`virt-manager`、`Cockpit` 和 `OVirt` 等工具才能发挥作用。\n\
  \n从 Linux 内核 2.6 版本开始，虚拟化功能已经集成，无需安装新内核即可拥有这些能力。\n\n下面的练习首先显示在宿主机处理器上进行预检，以确定是否在其上进行虚拟化；此处理器必须支持活动虚拟化标志，Intel\
  \ 处理器的标志为 `vmx`，AMD 处理器的标志为 `svm`。如果存在其中任何一个标志，就可以在宿主机上进行虚拟化。一旦验证了标志，我们继续进行 `libvirt`\
  \ 的初始安装，然后继续安装 Hypervisor 和客户端功能，在本例中为 `virt-manager`。执行安装的步骤如下：\n\n```\n[root@pruebas\
  \ ~]# yum groupinfo Virtualization*\nUpdating Subscription Management repositories.\n\
  Last metadata expiration check: 0:12:38 ago on Sun 21 Mar 2021 12:13:24 PM.\nEnvironment\
  \ Group: Virtualization\nEnvironment Group: Virtualization: Minimal.\nEnvironment\
  \ Group: Virtualization: Standard.\nEnvironment Group: Virtualization: Tools\nEnvironment\
  \ Group: Virtualization: Hypervisor\n.\n```\n\n宿主机处理器的虚拟化标志检查：\n\n```\n[root@pruebas\
  \ ~]# cat /proc/cpuinfo | grep -i vmx|svm\n## (假设输出)\n```\n\n另一种验证宿主机具有虚拟化能力的方法：\n\
  \n```\n[root@pruebas ~]# virt-host-validate\nQEMU: Checking for hardware-assisted\
  \ virtualization : PASS\nQEMU: Checking if /dev/vhost-net : PASS\nQEMU: Checking\
  \ if /dev/net/tun : PASS\nQEMU: Checking for cgroup 'cpu' controller support : PASS\n\
  QEMU: Checking for cgroup 'cpuacct' controller support : PASS\nQEMU: Checking for\
  \ cgroup 'cpuset' controller support : PASS\nQEMU: Checking for cgroup 'memory'\
  \ controller support : PASS\nQEMU: Checking for cgroup 'devices' controller support\
  \ : PASS\nQEMU: Checking for cgroup 'blkio' controller support : PASS\nQEMU: Checking\
  \ for secure guest support : PASS\n```\n\n是时候在宿主机上安装 Hypervisor 了：\n\n```\n[root@pruebas\
  \ ~]# yum groupinstall \"Virtualization Hypervisor\" -y\n```\n\n需要安装 `libvirt` 安装通信工具如下：\n\
  \n```\n[root@pruebas ~]# yum groupinstall \"Virtualization Client\" -y --with-optional\n\
  ```\n\n\n\n\n依赖已解析。\n\n--- 跳过输出 ---\n\n已安装：\n\n```\nhexedit-1.2.13-12.el8.x86_64\n\
