  \ 和 MySQL 数据库服务器无法在 Red Hat Enterprise Linux 8.0 上并列安装。随后将使用数据库超级用户（`root`）建立与数据库引擎的本地连接：\n\
  \n```bash\n[root@sr1 ~]# mysql -u root -p\nEnter password:\nWelcome to the MariaDB\
  \ monitor. Commands end with `;` or `\\g`.\nYour MariaDB connection id is 8\nServer\
  \ version: 10.3.28-MariaDB MariaDB Server\nCopyright (c) 2000, 2018, Oracle, MariaDB\
  \ Corporation Ab and others.\nType 'help;' or `\\h` for help. Type `'\\c` to clear\
  \ the current input statement.\nMariaDB [(none)]> exit\nBye\n```\n\n# 初始防护\n\n在数据库引擎安装并验证其相应连接后，MariaDB\
  \ 为我们提供了出于安全考虑进行配置加固的机会，如下所示：\n\n```bash\n[root@sr1 ~]# mysql_secure_installation\n\
  ```\n\n注意：建议对所有生产环境中的 MariaDB 服务器 运行此脚本的所有部分！请仔细阅读每个步骤！\n\n为了登录 MariaDB 并进行安全设置，我们需要\
  \ `root` 用户的当前密码。如果您刚刚安装 MariaDB 且尚未设置 root 密码，则密码将为空，此时只需按回车键。\n\n```text\nEnter\
  \ current password for root (enter for none):\nOK, successfully used password, moving\
  \ on...\nSetting the `root` password ensures that nobody can log into the MariaDB\
  \ `root` user without the proper authorisation.\nSet root password? [Y/n] Y\nNew\
  \ password:\nRe-enter new password:\nPassword updated successfully!\nReloading privilege\
  \ tables..\n... Success!\n```\n\n默认情况下，MariaDB 安装包含一个匿名用户，允许任何人无需为其创建用户账户即可登录 MariaDB。这仅用于测试，并使安装过程更顺畅一些。在进入生产环境之前，您应该删除它们。\n\
  \n```text\nRemove anonymous users? [Y/n] Y\n... Success!\n```\n\n通常情况下，`root` 只应允许从\
  \ `'localhost'` 连接。这确保了有人无法从网络猜测 root 密码。\n\n```text\nDisallow root login remotely?\
  \ [Y/n] n\n... skipping.\n```\n\n默认情况下，MariaDB 自带一个名为 `'test'` 的数据库，任何人都可以访问。这同样仅用于测试，在进入生产环境之前应将其删除。\n\
  \n```text\nRemove test database and access to it? [Y/n] Y\n- Dropping test database...\n\
  ... Success!\n- Removing privileges on test database...\n... Success!\n```\n\n重新加载权限表将确保到目前为止的所有更改都会立即生效。\n\
  \n```text\nReload privilege tables now? [Y/n] Y\n... Success!\n```\n\n正在清理...\n\
  全部完成！如果您已完成上述所有步骤，您的 MariaDB 安装现在应该是安全的。\n感谢使用 MariaDB！\n\n## 网络配置\n\n要为 MariaDB\
  \ 服务器配置网络连接，请使用 `/etc/my.cnf.d/mariadb-server.cnf` 文件中的 `[mysqld]` 部分，您可以在其中设置以下配置指令：\n\
  \n*   `bind-address`：`bind-address` 是服务器监听的地址。可能的选项有：主机、IPv4 地址或 IPv6 地址。\n*   `skip-networking`：可能的值：\n\
  \    *   `0`：监听所有客户端\n    *   `1`：仅监听本地客户端\n*   `port`：MariaDB 监听 TCP / IP 连接的端口；此服务的默认端口是\
  \ `tcp` 中的 `3306`。\n\n查看配置文件可以显示我们以下信息：\n\n```ini\n[root@sr1 ~]# vim /etc/my.cnf.d/mariadb-server.cnf\n\
  [mysqld]\ndatadir=/var/lib/mysql\nsocket=/var/lib/mysql/mysql.sock\nlog-error=/var/log/mariadb/mariadb.log\n\
  pid-file=/run/mariadb/mariadb.pid\nbind-address=0.0.0.0\nskip-networking=0\nport=3306\n\
  ```\n\n如果您对此文件进行了任何更改，请记住您必须重启服务：\n\n```bash\n[root@sr1 ~]# systemctl restart mariadb\n\
  ```\n\n\n\n\n\n为了发布知识的目的，下面列出了删除数据库的方法。然而，如果你正在进行所建议的实验和练习，我们建议不要删除之前创建的数据库，以便你可以继续进行练习：\n\
  \n```sql\nMariaDB [empresa]> DROP DATABASE empresa;\nQuery OK, 2 rows affected (0.019\
  \ sec)\n\nMariaDB [(none)]> show databases;\n+--------------------+\n| Database\
  \           |\n+--------------------+\n| information_schema |\n| mysql         \
  \      |\n| performance_schema |\n+--------------------+\n3 rows in set (0.001 sec)\n\
  ```\n\n## 备份管理\n\n在 MariaDB 数据库中备份数据有两种主要方法：\n\n* 逻辑备份\n* 物理备份\n\n**逻辑备份**由恢复数据所需的\
  \ SQL 语句组成。这种类型的备份将信息和日志导出到纯文本文件中。逻辑备份优于物理备份的主要优势是可移植性和灵活性。数据可以恢复到其他硬件配置、MariaDB\
  \ 版本或数据库管理系统（DBMS）中，而这在物理备份是无法实现的。请注意，在 `mariadb.service` 服务运行时可以进行逻辑备份。逻辑备份不包括日志和配置文件。\n\
  \n**物理备份**由存储内容的文件和目录副本组成。与逻辑备份相比，物理备份具有以下优势：\n\n* 输出更紧凑。\n* 备份文件更小。\n* 备份和恢复更快。\n\
  * 备份包含配置和日志文件。\n\n请注意，物理备份应在 `mariadb.service` 服务未运行时或所有数据库表已锁定以防止备份期间更改时进行。\n\n\
  你可以使用以下 MariaDB 备份方法之一来备份 MariaDB 数据库：\n\n* 使用 `mysqldump` 进行逻辑备份\n* 使用 `Mariabackup`\
  \ 工具进行在线物理备份\n* 文件系统备份\n* 复制作为备份解决方案\n\n`mysqldump` 客户端是一个备份实用，可用于转储数据库或一组数据库以进行备份或传输到另一个数据库服务器。`mysqldump`\
  \ 的输出通常由 SQL 语句组成，用于重建服务器表的结构、填充数据或二者兼之。作为替代，`mysqldump` 还可以生成其他格式的文件，包括 CSV 或其他分隔符文本格式以及\
  \ XML。\n\n要使用 `mysqldump` 执行备份，可以使用以下选项之一：\n\n* 备份选定的数据库\n* 备份数据库中的子集表\n\n## 逻辑备份与恢复\n\
  \n要备份整个数据库，请运行以下：\n\n```bash\n[root@sr1 ~]# mysqldump empresa > /root/backup-empresa.sql\
  \ -p\nEnter password:\n[root@sr1 ~]# ll\ntotal 36\n-rw-r--r--. 1 root root  2026\
  \ Jul 29 10:51 backup-empresa.sql\n```\n\n你可以查看生成的备份文件，如下所示：\n\n```sql\n[root@sr1\
  \ ~]# more backup-empresa.sql\n-- MySQL dump 10.19  Distrib 10.3.28-MariaDB, for\
