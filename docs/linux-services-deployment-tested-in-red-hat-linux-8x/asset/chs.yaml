  \n特别感谢 Juan Carlos Velez 和 Liliana Hoyos，感谢他们多年来的关怀和祷。\n\n## 读者画像\n\n本书面向：\n\n*\
  \   使用或计划使用 Linux 工具构建其技术生态系统的信息技术基础设施管理员。\n*   专注于操作系统教学的信息技术领域人力资源培训师。\n*   在\
  \ Linux 平台上提供服务的解决方案集成商。\n*   负责任何行业公司和机构技术运营的信息技术架构师。\n*   接受过管理信息技术平台培训的学生。\n\n\
  \n*   恢复 \"root\" 用户的访问权限](#\n*   通过 VIRT-MANAGER 安装虚拟机\n```\n\n\n\n\n\n按下字母 \"\
  e\"（编辑）后，找到以 \"linux\" 作为行首单词的行；滚动到该行末尾并添加一个空格，如下：\n\n![](img/Image00001.jpg)\n\n\
  这一行是向内核发送参数的地方。转到该行末尾添加表达式 `rd.break` 以进入控制台模式。在末尾按 `CTRL + X` 启动。\n\n系统一旦启动，Linux\
  \ 将为我们留下一个与下图所示相似的提示符：\n\n![](img/Image00002.jpg)\n\n此时，标准文件系统以只读形式挂载在 `/sysroot`\
  \ 上，因此有必要按照如下方式将其重新挂载为读写模式：\n\n![](img/Image00003.jpg)\n\n需要对根文件系统（`/sysroot`）进行禁闭（Jail，即对文件系统进行隔离，以便在操作运行时没有其他人干扰它），然后更改管理员密码。\n\
  \n需要创建一个空文件 `/.autorelabel`。之后，需要通过输入两次 `exit` 来退出我们所处的模式（chroot 和 GRUB 模式）：\n\n\
  这将立即导致系统重启，如果启用了此操作系统功能，SELinux 最初将负责对相应的上下文（文件、目录、端口和进程）进行适当重新标记。\n\n> 用于后分析的内核数据转储\n\
  \n为了分析系统失败的原因，你可以使用 `kdump` 服务保存系统内存内容供以后分析。在本小节中，我们将通过使用 RHEL Web Console 对 `kdump`\
  \ 进行简要介绍。`Kdump` 是一个为内核提供崩溃转储机制的服务。该服务允许你保存内存内容。`Kdump` 使用 `kexec` 系统调用在不重启的情况下引导第二个内核，从而捕获故障内核的内容并保存数据用于分析。第二个内核位于内存的预留部分。\n\
  \n在系统失败（严重错误）的情况下，内核崩溃转储可能是唯一的可用信息，因此在任务关键型环境中，确保 `kdump` 运行至关重要。下面的步骤显示了如何使用 Cockpit\
  \ 工具中的“内核转储（Kernel Dump）”选项卡来为 `kdump` 内核预留内存大小。该步骤还描述了如何指定 `vmcore` 转储文件的目标位置以及如何测试其配置。\n\
  \n![](img/Image00004.jpg)\n\n在 Cockpit 中注册后，进入内核转储部分：\n\n![](img/Image00005.jpg)\
  \ ![](img/Image00006.jpg)\n\n通过以下指令你可以看到此测试转储的结果（点击了“测试配置”按钮）：\n\n```bash\n[root@pruebas\
  \ ~]# cd /var/crash/\n[root@pruebas ~]# ll\ntotal 0\ndrwxr-xr-x. 2 root root 44\
  \ Feb 20 11:53 127.0.0.1-2021-02-20-09:53:46\n```\n\n详情所示，生成的转储包含一个带有本地 IP 地址以及模拟崩溃发生时间的文件夹。我们将进入该文件夹并观察其内容，如下：\n\
