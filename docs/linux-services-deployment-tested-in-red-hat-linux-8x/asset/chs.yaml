  \ preset: disabled)\nDrop-In: /etc/systemd/system/postgresql-10.service.d/override.conf\n\
  [Service]\nEnvironment=PGDATA=/pgsql-data/\n```\n\nFirewallD 已被允许在默认区域接收请求，如下文所示：\n\
  \n```bash\n[root@bd2]# firewall-cmd --add-service=postgresql --permanent\n[root@bd2]#\
  \ firewall-cmd --reload\n```\n\n现在切换到 `postgres` 用户并连接到数据库：\n\n```bash\n[root@bd2]#\
  \ su - postgres\n[postgres@bd2]$ psql\npsql (10.16)\nType \"help\" for help.\npostgres=#\
  \ \\q\n[postgres@bd2]$ exit\n```\n\n重启系统以验证系统启动时 PostgreSQL 服务正常运行，如下：\n\n```bash\n\
  [root@bd2]# reboot\n[root@bd2]# systemctl status postgresql-10.service\nActive:\
  \ active (running) since Fri 2021-03-26 14:42:30 EDT; 40s\nLoaded: loaded (/lib/systemd/system/postgresql-10.service;\
  \ enabled; vendor preset: disabled)\nDrop-In: /etc/systemd/system/postgresql-10.service.d/override.conf\n\
  [Service]\nEnvironment=PGDATA=/pgsql-data/\n```\n\n## 数据库访问定义\n\n在之前的章节中，通过各种方式安装了\
  \ PostgreSQL，创建了数据库，进行了备份，进行了恢复，并在辅助文件系统中安装了数据库引擎，但是数据库数据对客户是关闭的，这需要进行更改以便引擎能够接收请求并执行事务。\n\
  \n在这方面，我们将首先检查 FirewallD 以确认默认区域允许进入，如下所示：\n\n```bash\n[root@bd2 pgsql-data]# firewall-cmd\
  \ --list-all\npublic (active)\ntarget: default\nicmp-block-inversion: no\ninterfaces:\
  \ ens18\nsources:\nservices: cockpit dhcpv6-client postgresql ssh\nports:\nprotocols:\n\
  masquerade: no\nforward-ports:\nsource-ports:\nicmp-blocks:\nrich rules:\n```\n\n\
  \n\n\n\n在 PostgreSQL 初始路径（`/pgsql-data`）中，有配置数据库引擎的文件；你将在该处找到 `postgresql.conf`\
  \ 和 `pg_hba.conf` 文件，第一个管理数据库引擎的通用配置，第二个管理对数据库的访问。为了接收请求，必须对它们进行编辑，详细如下所示：\n\n```bash\n\
  [root@bd2 pgsql-data]# pwd\n/pgsql-data\n[root@bd2 pgsql-data]# ll postgresql.conf\n\
  -rw-------. 1 postgres postgres 22982 Mar 26 15:41 postgresql.conf\n```\n\n在 `postgresql.conf`\
  \ 文件中，必须激活 `listen_addresses` 和 `port = 5432` 参数：\n\n```bash\n[root@bd2 pgsql-data]#\
  \ vim postgresql.conf\nlisten_addresses = '*' # 监听哪些 IP 地址（地址）；\nport = 5432 # (更改需要重启)\n\
  ```\n\n随后，`pg_hba.conf` 文件必须包含对引擎数据库的相应授权：\n\n```bash\n[root@bd2 pgsql-data]# ll\
  \ pg_hba.conf\n-rw-------. 1 postgres postgres 4305 Mar 26 15:38 pg_hba.conf\n```\n\
  \n在后续指令中观察到的特定情况是针对 PostgreSQL 管理的所有数据库的“host”类型授权，允许所有用户访问，但通过加密的密码输入方法关闭到主机 `192.168.0.200`\
  \ 的连接：\n\n```bash\n[root@bd2 pgsql-data]# vim pg_hba.conf\n## TYPE  DATABASE   \
  \     USER            ADDRESS                 METHOD\n---\nhost all  all       \
  \      192.168.0.200/32         md5\n```\n\n完成更改后，需要重启 `postgresql-10.service` 服务：\n\
  \n```bash\n[root@bd2 pgsql-data]# systemctl restart postgresql-10.service\n```\n\
  \n# POSTGRESQL - 流式复制\n\n流式复制（SR）提供了将 WAL XLOG 日志连续发送并应用到多个备用服务器的能力，以保持它们更新。该功能是在\
  \ PostgreSQL 9.0 中添加的。\n\n演示在两台服务器上进行：`192.168.0.38` (sr1) 作为主服务器，而另一台服务器 `192.168.0.39`\
  \ (sr2) 是相应复制发生的地方。\n\n在服务器 `sr1` 上安装并加了 PostgreSQL（默认流为 10）：\n\n```bash\n[root@sr1\
  \ ~]# yum install postgresql-server\n[root@sr1 ~]# postgresql-setup --initdb\n[root@sr1\
  \ ~]# systemctl enable postgresql.service --now\n[root@sr1 ~]# firewall-cmd --add-service=postgresql\
  \ --permanent\n[root@sr1 ~]# firewall-cmd --reload\n[root@sr1 ~]# reboot\n```\n\n\
  一旦在系统启动时安装并验证了 `postgresql` 服务启动，编辑配置文件，其中的配置行应该如下所示：\n\n```bash\n[root@sr1 ~]#\
  \ vim /var/lib/pgsql/data/postgresql.conf\nlisten_addresses = '*'\nwal_level = replica\n\
  synchronous_commit = on\nmax_wal_senders = 10\nsynchronous_standby_names = '*'\n\
  ```\n\n关于访问 `postgresql` 服务，有必要定义副本主机，如 `pg_hba.conf` 文件末尾所示（应该看起来所示）：\n\n```bash\n\
  [root@sr1 ~]# vim /var/lib/pgsql/data/pg_hba.conf\n## host replication [replication\
  \ user] [allowed network] [authentication method]\n#host    replication     all\
  \             127.0.0.1/32            ident\n#host    replication     all      \
  \       ::1/128                 ident\nhost    replication     rep_user        192.168.0.38/32\
  \            md5\nhost    replication     rep_user        192.168.0.39/32      \
  \     md5\n```\n\n接下来，创建用户 `rep_user`（复制用户）并定义相应的 PostgreSQL 角色：\n\n```bash\n[root@sr1\
  \ ~]# su - postgres\n[postgres@sr1 ~]$ createuser --replication rep_user\nEnter\
  \ password for role:\nEnter it again:\n```\n\n我们退出 `postgres` 用户并重启服务：\n\n```bash\n\
  [postgres@sr1 ~]$ exit\n[root@sr1 ~]# systemctl restart postgresql\n```\n\n接下来我们在\
  \ `sr2` 服务器上启动程序，安装并加固 `postgresql` 服务：\n\n```bash\n[root@sr2 ~]# yum install postgresql-server\n\
  [root@sr2 ~]# postgresql-setup --initdb\n[root@sr2 ~]# systemctl enable postgresql.service\
  \ --now\n[root@sr2 ~]# firewall-cmd --add-service=postgresql --permanent\n[root@sr2\
  \ ~]# firewall-cmd --reload\n[root@sr2 ~]# reboot\n```\n\n一旦 `postgresql` 服务已安装、初始化并投入生产，我们停止它，保存配置并将配置传输到\
  \ `sr1` 服务器，如下所示：\n\n```bash\n[root@sr2 ~]# systemctl stop postgresql\n[root@sr2\
  \ ~]# cp -R /var/lib/pgsql/data/ /root/\n[root@sr2 ~]# rm -rf /var/lib/pgsql/data/*\n\
  [root@sr2 ~]# su - postgres\n[postgres@sr2 ~]# pg_basebackup -R -h 192.168.0.38\
  \ -U rep_user -D /var/lib/pgsql/data -P\n```\n\n一旦 `postgresql` 服务启动并在系统启动时安装并验证，编辑配置文件，其中以下配置行如下所示：\n\
  \n```bash\n[root@sr1 ~]# vim /var/lib/pgsql/data/postgresql.conf\nlisten_addresses\
  \ = '*'\nwal_level = replica\nsynchronous_commit = on\nmax_wal_senders = 10\nsynchronous_standby_names\
  \ = '*'\n```\n\n关于访问 `postgresql` 服务，有必要定义副本主机，如 `pg_hba.conf` 文件末尾所示（应该看起来所示）：\n\
  \n```bash\n[root@sr1 ~]# vim /var/lib/pgsql/data/pg_hba.conf\n## host replication\
  \ [replication user] [allowed network] [authentication method]\n#host    replication\
  \     all             127.0.0.1/32            ident\n#host    replication     all\
  \             ::1/128                 ident\nhost    replication     rep_user  \
  \      192.168.0.38/32            md5\nhost    replication     rep_user        192.168.0.39/32\
  \           md5\n```\n\n接下来，创建用户 `rep_user`（复制用户）并定义相应的 PostgreSQL 角色：\n\n```bash\n\
  [root@sr1 ~]# su - postgres\n[postgres@sr1 ~]$ createuser --replication rep_user\n\
  Enter password for role:\nEnter it again:\n```\n\n我们退出 `postgres` 用户并重启服务：\n\n```bash\n\
