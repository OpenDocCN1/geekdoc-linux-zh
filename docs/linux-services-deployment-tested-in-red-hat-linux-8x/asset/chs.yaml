  \n```bash\n[root@sr1 postfix]# yum install cyrus-sasl-* -y\n\n正在更新订阅管理存储库。\n\n上次元数据过期检查：0:08:43\
  \ 前，时间为 2021 年 3 月 25 日周四 11:59:53 EDT。\n```\n\n安装客户端用于发送电子邮件和验证配置：\n\n```bash\n\
  [root@sr1 postfix]# yum install mailx -y\n\n正在更新订阅管理存储库。\n\n上次元数据过期检查：0:29:03 前，时间为\
  \ 2021 年 3 月 25 日周四 上 11:59:53 EDT。\n```\n\n现在是定义 Postfix 用于与 Gmail 进行身份验证的凭据，此通信是加密的，但必须在文本文件中定义凭据（你必须在\
  \ Google 账户平台生成**应用密码**），Postfix 将从该文件生成查找表，如下所示：\n\n```bash\n[root@sr1 postfix]#\
  \ vim sasl_passwd\n\n[smtp.gmail.com]:587 username@gmail.com:aplicationpassword\n\
  \n[root@sr1 postfix]# chmod 600 /etc/postfix/sasl_passwd\n\n[root@sr1 postfix]#\
  \ postmap hash:/etc/postfix/sasl_passwd\n```\n\n该查找表记录在由 `postmap` 命令生成的文件中，如下：\n\
  \n```bash\n[root@sr2 postfix]# ll sasl_passwd.db\n\n-rw-------. 1 root root 12288\
  \ Mar 25 13:46 sasl_passwd.db\n```\n\n需要注意的是，`aplicationpassword` 字段是 Gmail 安全机制的一部分；**不要**在此字段中定义你的\
  \ Gmail 密码，而是要定义在 Google 账户平台生成的**应用密码**，如下文所示：\n\n![](img/Image00035.jpg)\n\n有必要将\
  \ TLS 加密配置为策略，为此需要创建 `tls_policy` 文件并将其注册到 Postfix 查找表中：\n\n```bash\n[root@sr1 postfix]#\
  \ vim tls_policy\n\n[smtp.gmail.com]:587 encrypt\n\n[root@sr1 postfix]# postmap\
  \ /etc/postfix/tls_policy\n```\n\n现在是编辑 Postfix 配置文件 `main.cf` 的时候，但出于备份考虑，创建了原始文件的副本：\n\
  \n```bash\n[root@sr1 postfix]# cp main.cf main.cf.original\n```\n\n编辑 `main.cf`\
  \ 时验证以下行是否如下所示相关：\n\n```bash\n[root@sr1 postfix]# vim main.cf\n\n#smtpd_tls_cert_file\
  \ = /etc/pki/tls/certs/postfix.pem\n#smtpd_tls_key_file = /etc/pki/tls/private/postfix.key\n\
  #smtpd_tls_security_level = may\nsmtp_tls_CApath = /etc/pki/tls/certs\nsmtp_tls_CAfile\
  \ = /etc/pki/tls/certs/ca-bundle.crt\n#smtp_tls_security_level = may\nmeta_directory\
  \ = /etc/postfix\nshlib_directory = /usr/lib64/postfix\nrelayhost = [smtp.gmail.com]:587\n\
  smtp_use_tls = yes\nsmtp_sasl_auth_enable = yes\nsmtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd\n\
  smtp_sasl_security_options = noanonymous\nsmtp_sasl_tls_security_options = noanonymous\n\
  smtp_tls_policy_maps = hash:/etc/postfix/tls_policy\n```\n\n现在是重启 `postfix` 服务并验证功能的时候：\n\
  \n```bash\n[root@sr2 postfix]# systemctl restart postfix.service\n\n[root@sr2 postfix]#\
  \ echo mailtest | mail -s mailtest fmestre@aptivalabs.com\n```\n\n在第二个控制台中，你将能够验证电子邮件是否已有效发送到\
  \ `smtp.gmail.com:587`，如下：\n\n```bash\n[root@sr1 ~]# tail -f /var/log/maillog\n\
  Mar 25 13:15:42 sr1 postfix/pickup[8203]: 656C620AACA7: uid=0 from=<root>\nMar 25\
  \ 13:15:42 sr1 postfix/cleanup[8209]: 656C620AACA7: message-id=<20210325171542.656C620AACA7@sr1.aptivalabs.net>\n\
  Mar 25 13:15:42 sr1 postfix/qmgr[8204]: 656C620AACA7: from=<root@sr1.aptivalabs.net>,\
  \ size=449, nrcpt=1 (queue active)\nMar 25 13:15:44 sr1 postfix/smtp[8211]: 656C620AACA7:\
  \ to=<fmestre@aptivalabs.com>, relay=smtp.gmail.com[108.177.11.109]:587, delay=2.1,\
  \ delays=0.03/0.05/0.9/1.1, dsn=2.0, status=sent\n```\n\n在 SMTP 协议中，通过 `smtp.gmail.com:587`\
  \ 发送邮件是有效的，这表明：\n\nAWS 通过身份管理服务允许你生成访问凭据以注册 AWS 并能够使用其服务。对于本次练习，使用了测试凭据，它必须保存在 `/etc/passwd-s3fs`\
  \ 文件中，格式如下文所示：\n\n\n\n\n\n```bash\n[root@sr2 s3fs-fuse]# echo \"AKIA2IXLZ7Q4EDGEEC73:W0c/PWvHbn8liNj2BNN869JhdvPaRtXj8SSsmm1J\"\
  \ > /etc/passwd-s3fs\n```\n\n我们验证文件的创建情况：\n\n```bash\n[root@sr2 s3fs-fuse]# ll /etc/passwd-s3fs\n\
  -rw-r--r--. 1 root root 62 Mar 25 15:22 /etc/passwd-s3fs\n[root@sr2 s3fs-fuse]#\
  \ cat /etc/passwd-s3fs\nAKIA2IXLZ7Q4EDGEEC73:W0c/PWvHbn8liNj2BNN869JhdvPaRtXj8SSsmm1J\n\
  ```\n\n你需要为文件的所有者设置读和写权限：\n\n```bash\n[root@sr2 s3fs-fuse]# chmod 600 /etc/passwd-s3fs\n\
  ```\n\n创建了访问 AWS S3 桶的挂载点：\n\n```bash\n[root@sr2 s3fs-fuse]# mkdir /mnt/aptiva\n\
  ```\n\n在 `/etc/fstab` 中定义了存储桶的持久挂载并进行了验证，如下所示：\n\n```bash\n[root@sr2 s3fs-fuse]#\
  \ echo \"s3fs#aptiva /mnt/aptiva fuse _netdev,rw,nosuid,nodev,allow_other,nonempty\
  \ 0 0\" >> /etc/fstab\n[root@sr2 s3fs-fuse]# cat /etc/fstab\n#\n## /etc/fstab\n\
  ## Created by anaconda on Thu Mar 18 14:56:05 2021\ns3fs#aptiva /mnt/aptiva fuse\
  \ _netdev,rw,nosuid,nodev,allow_other,nonempty 0 0\n```\n\n然后执行组装的相关活动：\n\n```bash\n\
  [root@sr2 s3fs-fuse]# udevadm settle\n[root@sr2 s3fs-fuse]# systemctl daemon-reload\n\
  [root@sr1 ~]# mount -a\n```\n\n一旦组装完成，使用以下指令进行验证：\n\n```bash\n[root@sr1 ~]# df -hT\n\
  Filesystem            Type              Size  Used Avail Use% Mounted on\n--- salida\
  \ omitida ---\ns3fs                  fuse.s3fs 256T     0  256T   0% /mnt/aptiva\n\
  ```\n\n通过上一条指令可以详细看到挂载点已定义在 `/mnt/aptiva`，可用存储为 `256T`；此时，作为 Linux 管理员，你将可以将数据放置在该挂载点中，请注意信息传输的质量和速度取决于你与服务商签订的互联网连接。S3\
  \ 桶的内容如下：\n\n```bash\n[root@sr1 ~]# ll /mnt/aptiva/\ntotal 1581057\n-rw-r--r--.\
  \ 1 root root          0 Feb 19  2020 1\n-rw-r--r--. 1 root root     136882 Feb\
  \ 19  2020 archivo.tar\n-rw-r-----. 1 root root      11894 Feb 19  2020 synologic.jpg\n\
  ```\n\n为了结束练习，将在挂载点内创建“tests”文件夹，并通过命令行界面创建空文件，此目的是为了验证数据确实已保存到 S3 桶中，详细所示所示：\n\n\
  ```bash\n[root@sr1 ~]# cd /mnt/aptiva/\n[root@sr1 aptiva]# mkdir pruebas\n[root@sr1\
  \ aptiva]# cd pruebas/\n[root@sr1 pruebas]# touch 1 2 3 4 5 6\n```\n\n展示 AWS Web\
  \ 管理控制台的截图，当我们在两种场景中看到相同的数据时，可以验证练习结果是满意的：\n\n![](img/Image00037.jpg)\n\n# POSTGRESQL\
  \ – 安装与部署\n\n在企业场景中，经常会发现信息系统部署在应用服务器上，这些服务器在本地数据库上执行事务，在这种情况下，数据库是安装并配置在 RHEL 8\
  \ 或其衍生系统上的。在本次练习中，将部署 PostgreSQL 10 版本数据库引擎，这是默认流，，因为还有安装版本 9.6 或 12 版本的选项。\n\n\
  我们从更改主机名开始：\n\n```bash\n[root@loadbalancer ~]# hostnamectl set-hostname bd1.aptivalabs.net\n\
  [root@loadbalancer ~]# exit\nlogout\n$ ssh -l root 192.168.0.200\n[root@bd1 ~]#\n\
  ```\n\n列出 PostgreSQL 模块的不同流：\n\n```bash\n[root@bd1 ~]# yum module list postgresql\n\
  Updating Subscription repositories.\nLast metadata check: 0:06 ago on Fri 26 Mar\
  \ 31:31 AM -05\nRed Enterprise Linux 8 for x86_64 (RPM)\nName                 Stream\
  \          Profiles        Summary\npostgresql            9.6           [d]    \
  \         PostgreSQL server and client\npostgresql            10           [d] \
  \            PostgreSQL server and client\npostgresql            12            \
  \                   \n```\n\n\n\n\n以下指令将创建 \"users\" 表及其相应的结构，然后我们将列出该目录结构：\n\n\
  ```sql\ntest=# create table usuarios ( nombre varchar(30), clave varchar(10) );\n\
  \nCREATE TABLE\n\ntest=# select table_name,column_name,udt_name,character_maximum_length\
  \ from information_schema.columns where table_name = 'usuarios';\n\ntable_name |\
  \ column_name | udt_name | character_maximum_length\n------------+-------------+----------+--------------------------\n\
  usuarios   | nombre      | varchar  |                       30\nusuarios   | clave\
  \       | varchar  |                       10\n(2 rows)\n```\n\n接下来的指令将在数据库中插入记录并列出它们：\n\
  \n```sql\ntest=# insert into usuarios (nombre, clave) values ('Mariano','payaso');\n\
  INSERT 0 1\ntest=# insert into usuarios (nombre, clave) values ('Pablo','jfx344');\n\
  INSERT 0 1\ntest=# insert into usuarios (nombre, clave) values ('Ana','tru3fal');\n\
  INSERT 0 1\ntest=# select * from usuarios;\n\nnombre    clave\n---------+---------\n\
  Mariano | payaso\nPablo   | jfx344\nAna     | tru3fal\n(3 rows)\n```\n\n有必要退出 PostgreSQL\
  \ CLI：\n\n```sql\ntest=# \\q\n```\n\n下方生成了数据库转储并列出了文件内容：\n\n```bash\n[postgres@bd1\
  \ ~]$ pg_dump test > /tmp/backup.sql\n[postgres@bd1 ~]$ cat /tmp/backup.sql\n\n\
  --\n-- PostgreSQL database dump\n--\n-- Dumped from database version 10.15\n-- Dumped\
  \ by pg_dump version 10.15\nSET statement_timeout = 0;\nSET lock_timeout = 0;\n\
  --- omited ---\n```\n\n## 数据库恢复练习\n\nPostgreSQL 数据库管理中的一项常见活动是恢复大型数据库，这项活动可能需要数小时才能完成。在接后的练习中，将恢复一个在转储级别制作备份，其大小为\
  \ 1.56G；为了执行此活动，将创建一个新数据库并在其中恢复备份，如下所示：\n\n```bash\n[postgres@bd1 ~]$ ll -h /tmp/BD-historico20180828.sql\n\
  -rw-r--r--. 1 root root 1.6G Mar 26 10:45 /tmp/BD-historico20180828.sql\n```\n\n\
  创建名为 \"empresa\" 的数据库：\n\n```bash\n[postgres@bd1 ~]$ createdb empresa\n```\n\n在之前生成的转储中启动\
  \ \"empresa\" 数据库的恢复过程：\n\n```bash\n[postgres@bd1 ~]$ pg_restore -d empresa /tmp/BD-historico20180828.sql\n\
  ```\n\n恢复完成后，验证表已创建，如下所示：\n\n```bash\n[postgres@bd1 ~]$ psql empresa\npsql (10.15)\n\
  Type \"help\" for help.\nempresa=# \\d\nList of relations\nSchema |          Name\
  \          |   Type   |  Owner\n--------+------------------------+----------+----------\n\
  public | cartera         | table    | postgres\npublic | ciudades         | table\
  \    | postgres\npublic | departamentos       | table    | postgres\npublic | barrios\
  \         | table    | postgres\n--- omited ---\n```\n\n## POSTGRESQL 中的元数据查询\n\n\
  完成后，可以向数据库引擎查询有关其所占空间的信息，如下指令所示，该指令查询了引擎中所有数据库的大小：\n\n```sql\nempresa=# SELECT pg_database.datname,\
  \ pg_size_pretty(pg_database_size(pg_database.datname)) AS SIZE FROM pg_database;\n\
  datname  |  size\n-----------+---------\npostgres ​ | 7335 kB\ntest ​ | 7343 kB\n\
  template1 ​ | 7201 kB\ntemplate0 ​ | 7201 kB\nempresa ​ | 15 GB\n```\n\n如下所示，查询特定数据库的大小：\n\
  \n```sql\nempresa=# SELECT pg_size_pretty( pg_database_size('empresa') );\npg_size_pretty\n\
  ----------------\n15 GB\n(1 row)\n```\n\n通过这种方式，我们可以看到数据库中表的大小：\n\n```sql\nempresa=#\
  \ SELECT  schemaname, tablename,pg_size_pretty(pg_total_relation_size(tablename::regclass::oid))\n\
  FROM    pg_tables\nWHERE  schemaname NOT('pg_catalog', 'information_schema');\n\n\
  schemaname |      tablename | pg_size_pretty\n------------+----------------+----------------\n\
  public | cartera         | 357 MB\npublic | ciudades         | 240 kB\npublic |\
  \ departamentos       | 608 kB\npublic | barrios         | 96 kB\n```\n\n## 在辅助文件系统中安装\
  \ PostgreSQL\n\n在接后的练习中，将使用不同的存储路径安装 PostgreSQL，创建集群的默认路径为 `/var/lib/pgsql`，本次练习中使用的路径为\
  \ `/pgsql-data`；为了本次实践开发，系统添加了一个新磁盘（显示为 `/dev/sdb`），并将其格式化为 XFS 的 LV，并建立在 `/pgsql-data`\
  \ 上：\n\n```bash\n[postgres@bd1 ~]$ ll -h /tmp/BD-historico20180828.sql\n-rw-r--r--.\
  \ 1 root root 1.6G Mar 26 10:45 /tmp/BD-historico20180828.sql\n```\n\n创建名为 \"empresa\"\
  \ 的数据库：\n\n```bash\n[postgres@bd1 ~]$ createdb empresa\n```\n\n在之前生成的转储中启动 \"empresa\"\
  \ 数据库的恢复过程：\n\n```bash\n[postgres@bd1 ~]$ pg_restore -d empresa /tmp/BD-historico20180828.sql\n\
  ```\n\n恢复完成后，验证表已创建，如下所示：\n\n```bash\n[postgres@bd1 ~]$ psql empresa\npsql (10.15)\n\
  Type \"help\" for help.\nempresa=# \\d\nList of relations\nSchema |          Name\
  \          |   Type   |  Owner\n--------+------------------------+----------+----------\n\
  public | cartera         | table    | postgres\npublic | ciudades         | table\
  \    | postgres\npublic | departamentos       | table    | postgres\npublic | barrios\
  \         | table    | postgres\n--- omited ---\n```\n\n## POSTGRESQL 中的元数据查询\n\n\
  恢复完成后，可以向数据库引擎查询有关其所占空间的信息，如下指令所示，该指令查询了引擎中所有数据库的大小：\n\n```sql\nempresa=# SELECT\
  \ pg_database.datname, pg_size_pretty(pg_database_size(pg_database.datname)) AS\
  \ SIZE FROM pg_database;\ndatname  |  size\n-----------+---------\npostgres ​ |\
  \ 7335 kB\ntest ​ | 7343 kB\ntemplate1 ​ | 7201 kB\ntemplate0 ​ | 7201 kB\nempresa\
  \ ​ | 15 GB\n```\n\n如下所示，查询特定数据库的大小：\n\n```sql\nempresa=# SELECT pg_size_pretty(\
  \ pg_database_size('empresa') );\npg_size_pretty\n----------------\n15 GB\n(1 row)\n\
  ```\n\n通过这种方式，我们可以看到数据库中表的大小：\n\n```sql\nempresa=# SELECT  schemaname, tablename,pg_size_pretty(pg_total_relation_size(tablename::regclass::oid))\n\
  FROM    pg_tables\nWHERE  schemaname NOT('pg_catalog', 'information_schema');\n\n\
  schemaname |      tablename | pg_size_pretty\n------------+----------------+----------------\n\
  public | cartera         | 357 MB\npublic | ciudades         | 240 kB\npublic |\
  \ departamentos       | 608 kB\npublic | barrios         | 96 kB\n```\n\n## 在辅助文件系统中安装\
  \ PostgreSQL\n\n在接后的练习中，将使用不同的存储路径安装 PostgreSQL，创建集群的默认路径为 `/var/lib/pgsql`，本次练习中使用的路径为\
  \ `/pgsql-data`；为了本次实践开发，系统添加了一个新磁盘（显示为 `/dev/sdb`），并将其格式化为 XFS 的 LV，并建立在 `/pgsql-data`\
  \ 上：\n\n```bash\n[postgres@bd1 ~]$ ll -h /tmp/BD-historico20180828.sql\n-rw-r--r--.\
  \ 1 root root 1.6G Mar 26 10:45 /tmp/BD-historico20180828.sql\n```\n\n将 XFS 文件系统映射到新创建的逻辑设备：\n\
  \n```bash\n[root@bd2 ~]$ mkfs.xfs /dev/bd2\nmeta-data=/dev/bd2 isize=512 agcount=4\
  \ agsize=655344 blks sectsz=512\n```\n\n`/pgsql-data` 被创建为之前创建的文件系统的挂载点：\n\n```bash\n\
  [root@bd2 ~]$ mkdir /pgsql-data\n```\n\n是时候持久化设置挂载点以托管 PostgreSQL 数据：\n\n```bash\n\
  [root@bd2 ~]$ blkid | grep bd2 >> /etc/fstab\n[root@bd2 ~]$ vim /etc/fstab\nUUID=\"\
  f32b947b-5203-43dd-9751-c8190542077\" /pgsql-data xfs defaults 0 0\n```\n\n```bash\n\
  [root@bd2 ~]$ udevadm settle\n[root@bd2 ~]$ systemctl daemon-reload\n[root@bd2 ~]$\
  \ mount -a\n```\n\n验证挂载点可用数据库初始化：\n\n```bash\n[root@bd2 ~]$ df -hT\nFilesystem \
  \          Type  Size  Used Avail Use% Mounted on\n/dev/mapper/datos-bd2 xfs   100G\
  \  746M  100G  1% /pgsql-data\n```\n\n由于将通过添加 PostgreSQL 开发者的官方仓库进行安装，因此必须禁用 RHEL\
  \ 模块：\n\n```bash\n[root@bd2 ~]$ yum module disable postgresql\n```\n\n安装 PostgreSQL\
  \ 开发者的官方仓库：\n\n```bash\n[root@bd2 ~]$ yum -y install https://download.postgresql.org/pub/repos/yum/reporms/EL-7-x86_64/pgdg-redhat-repo-latest.noarch.rpm\n\
  ```\n\n新的系统仓库显示在 `/etc/yum.repos.d/`；移动到此路径编辑此类仓库文件以仅启用 PostgreSQL 版本 10 仓库。\n\n\
  ```\n[root@bd2 ~]$ cd /etc/yum.repos.d/\n[root@bd2 yum.repos.d]# ll\ntotal 104\n\
  -rw-r--r--. 1 root root  9738 Sep 24  2020 pgdg-redhat-all.repo\n```\n\n\n\n\n```\n\
  -rw-r--r--. 1 root root 94154 Mar 26 13:05 redhat.repo\n```\n\n在仓库文件 `pgdg-redhat-all.repo`\
  \ 版本中，对于 PostgreSQL 12、11 和 9.6 版本的仓库，必须设置字段 `enabled = 0`；只有版本 10 版本的仓库必须设置 `enabled\
  \ = 1`；以下显示了不应如何使用这些仓库：\n\n```bash\n[root@bd2 yum.repos.d]# vim pgdg-redhat-all.repo\n\
  \n[pgdg12]\nname=PostgreSQL 12 for RHEL/CentOS $releasever - $basearch\nbaseurl=https://download.postgresql.org/pub/repos/yum/12/redhat/rhel-$releasever-$basearch\n\
  enabled=0\ngpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-PGDG\n```\n\n\
  现在是安装 PostgreSQL 了，详细步骤所示：\n\n```bash\n[root@bd2 yum.repos.d]# yum install -y postgresql10-server\
  \ postgresql10-contrib\nUpdating Subscription Management repositories.\nPostgreSQL\
