  \n# RED HAT LINUX 中的容器 – PODMAN/SKOPEO\n\n容器是一个隔离的运行进程，它占用网络资源并与其集成存储相结合；有些人将其与虚拟机相比较，因为目标是相同的，然而，它们在技术上相差甚远。\n\
  \nRHEL8 中的容器管理得益于 `podman`、`skopeo` 和 `buildah` 等应用程序；`podman` 程序用于管理容器和镜像，`skopeo`\
  \ 应用程序检查、复制、删除和签名容器镜像，而 `buildah` 应用程序用于创建新容器，这一切代表了它们现在管理容器的新方式，因为在之前的版本中，用于此类管理的工具是由\
  \ Docker 提供的。\n\n接下来的练习将允许我们安装容器平台、下载镜像并将其作为容器启动、管理该容器并管理其镜像，其目的是为了熟悉个性化处理容器的能力，因为集群化和高可用性管理已通过\
  \ Kubernetes 和 Openshift 等平台提供；我们首先列出与容器平台相关的模块：\n\n```bash\n[root@bd1 ~]# yum module\
  \ list --available container-tools\n```\n\n> 正在更新订阅管理仓库。\n> 上次元数据过期检查：0:19:21 前，时间为\
