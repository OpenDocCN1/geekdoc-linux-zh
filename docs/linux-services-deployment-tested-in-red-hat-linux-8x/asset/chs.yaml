  ```\n\n安装完成后，你已拥有通过虚拟化平台托管虚拟机的能力。为此，你可以使用 `virsh`、`virt-manager`（图形界面）或 `cockpit`（Web\
  \ 控制）。\n\n## 通过 Virt-Manager 安装虚拟机\n\n该练习对应于位于 `/tmp` 路径的 ISO `proxmox-ve_6.3-1.iso`\
  \ 安装虚拟机。此虚拟机的安装将在位于 LVM 结构上的 XFS 文件系统上进行。我们首先验证安装 ISO 是否存在：\n\n```bash\n[root@bd2\
  \ ~]# ll -h /tmp/proxmox-ve_6.3-1.iso\n-rw-r--r-- 1 root root 813M Mar 28 10:41\
  \ /tmp/proxmox-ve_6.3-1.iso\n```\n\n识别并创建用于托管虚拟机的 LVM 结构：\n\n```bash\n[root@bd2\
  \ ~]# lsblk\nNAME MAJ:MIN RM SIZE TYPE\n--- 输出输出 ---\nsdc 8:32 0 100G disk\n[root@bd2\
  \ ~]# pvcreate /dev/sdc\n物理卷 \"/dev/sdc\" 已创建。\n[root@bd2 ~]# vgcreate mv /dev/sdc\n\
  卷组 \"mv\" 已创建\n[root@bd2 ~]# lvcreate -l 100%free -n kvm mv\n逻辑卷 \"kvm\" 已创建。\n\
  ```\n\n分配并持久 XFS 文件系统：\n\n```bash\n[root@bd2 ~]# mkfs.xfs /dev/mv/kvm\n[root@bd2\
  \ ~]# blkid | grep sdc >> /etc/fstab\n[root@bd2 ~]# mkdir /maquinas\n[root@bd2 ~]#\
  \ vim /etc/fstab\nUUID=\"be8228b-ce08-4a38-bc1c-093284b164c\" /maquinas xfs defaults\
  \ 0 0\n[root@bd2 ~]# udevadm settle\n[root@bd2 ~]# systemctl daemon-reload\n```\n\
  \n进程完成后，定义 `/maquinas` 为挂载点，你可以在此处保存从 `virt-manager` 创建的虚拟机，如下所示：\n\n```bash\n[root@bd2\
  \ ~]# df -hT\nFilesystem Type Size Used Avail Use% Mounted on\n--- 输出输出 ---\n/dev/mapper/mv-kvm\
  \ xfs 100G 746M 100G 1% /maquinas\n```\n\n通过 `virt-manager` 添加挂载点，在 `virt-manager`\
  \ 中这被称为添加“池”（pool）：\n\n![](img/Image00013.jpg)\n\n在上方标签页中你可以看到 `storage` 选项，选中后，点击\
  \ `+` 图标，会弹出一个界面，提供命名“池”并选择挂载点的可能性（Image00014.jpg）。添加池（挂载点上的文件系统）时，你应该看到类似（Image00015.jpg）的界面。\n\
  \n接下来，通过搜索 `/tmp` 中的安装 ISO 来创建虚拟机，并将 `Debian 10` 定义为安装的操作系统（Image00016.jpg）。需要建立要使用的\
  \ RAM 内存，详情见（Image00017.jpg）。接下来，定义虚拟机的托管位置，选择“选择或自定义存储”（Image00018.jpg）。我们看到一个界面，其中选择了\
  \ `+` 图标来创建虚拟机文件（Image00019.jpg, Image00020.jpg）。在定义虚拟机名称和大小的进程最后，你应该看到像上面的界面（Image00021.jpg），点击\
  \ `Finish` 按钮将开始安装首选 ISO（Image0023.jpg）。\n\n## 安装并配置 Nginx\n\n可安装的 nginx 模块列如下：\n\
  \n```bash\n[root@bd2 ~]# yum module list nginx\nUpdating Subscription Management\
  \ repositories.\nLast metadata check: 0:44:06 ago on 22 Mar 2021 08:46:03 AM.\n\
  Red Hat Enterprise Linux 8 for x86_64 - AppStream (RPMs)\nName Stream Profiles Summary\n\
  nginx 1.14 [d] common [d] nginx webserver\nnginx 1.16 [d] common [d] nginx webserver\n\
  nginx 1.18 [d] common [d] nginx webserver\n```\n\n该模块的可用配置如下：\n\n```bash\n[root@bd2\
  \ ~]# yum module info nginx:1.14 --profile\nUpdating Subscription Management repositories.\n\
  Last metadata check: 1:01:04 ago on 22 Mar 2021 08:46:03 AM.\nName : nginx:1.14:80000201908302848:f8e95b4e:x86_64\n\
  common : nginx\n: nginx-all-modules\n: nginx-filesystem\n: nginx-mod-http-image-filter\n\
  : nginx-mod-http-perl\n: nginx-mod-http-xslt-filter\n: nginx-mod-mail\n: nginx-mod-stream\n\
  ```\n\n现在是安装 `nginx: 1.14` 的时候，你可以根据需求安装版本：\n\n```bash\n[root@bd2 ~]# yum module\
  \ install nginx:1.14\nUpdating Subscription Management repositories.\nLast metadata\
  \ check: 0:58:57 ago on 22 Mar 2021 08:46:03 AM.\n```\n\n\n\n\n## 安装组/模块包：\n\n```\n\
  nginx               x86_64 1:1.14.1-9.module+el8.0.0+4108+af250afe rhel-8-for-x86_64-appstream-rpms\
  \ 570 k\nnginx-all-modules    noarch 1:1.14.1-9.module+el8.0.0+4108+af250afe rhel-8-for-x86_64-appstream-rpms\
  \  24 k\n```\n\n### 已安装：\n\n```\nnginx-1:1.14.1-9.module+el8.0.0+4108+af250afe.x86_64\n\
  nginx-all-modules-1:1.14.1-9.module+el8.0.0+4108+af250afe.noarch\nnginx-filesystem-1:1.14.1-9.module+el8.0.0+4108+af250afe.noarch\n\
  nginx-mod-http-image-filter-1:1.14.1-9.module+el8.0.0+4108+af250afe.x86_64\nnginx-mod-http-perl-1:1.14.1-9.module+el8.0.0+4108+af250afe.x86_64\n\
  nginx-mod-http-xslt-filter-1:1.14.1-9.module+el8.0.0+4108+af250afe.x86_64\nnginx-mod-mail-1:1.14.1-9.module+el8.0.0+4108+af250afe.x86_64\n\
  nginx-mod-stream-1:1.14.1-9.module+el8.0.0+4108+af250afe.x86_64\n```\n\n有在 `FirewallD`\
  \ 中打开端口以接收连接请求：\n\n```\n[root@pruebas ~]# firewall-cmd --permanent --add-service=http\n\
  success\n[root@pruebas ~]# firewall-cmd --reload\nsuccess\n```\n\n在系统启动时启用 `nginx`\
  \ 服务并立即运行它：\n\n```\n[root@pruebas ~]# systemctl enable nginx --now\nCreated symlink\
  \ /etc/systemd/system/multi-user.target.wants/nginx.service → /usr/lib/systemd/system/nginx.service.\n\
  ```\n\n通过列出系统进程来验证 `nginx` 服务的运行：\n\n```\n[root@pruebas ~]# ps -fe\nroot     10798\
  \       1  0 09:03 ?        00:00:00 nginx: master process /usr/sbin/nginx\nnginx\
  \      10799  10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx    \
  \  10800   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx      10801\
  \   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx      10802   10798\
  \  0 09:03 ?        00:00:00 nginx: worker process\nnginx      10803   10798  0\
  \ 09:03 ?        00:00:00 nginx: worker process\nnginx      10804   10798  0 09:03\
  \ ?        00:00:00 nginx: worker process\nnginx      10805   10798  0 09:03 ? \
  \       00:00:00 nginx: worker process\nnginx      10806   10798  0 09:03 ?    \
  \    00:00:00 nginx: worker process\n```\n\n在操作结束，为了验证 `nginx` Web 服务器的启动，请获取 RHEL\
  \ 服务器的 IP 地址，并在 RHEL 8 以外的计算机上打开您选择的 HTTP 客户端，您将看到类似下面的图像：\n\n`nginx` 服务使用路径 `/usr/share/nginx/html`\
  \ 作为内容发布目录，如果您需要发布某些类型的内容，可以将您的 HTML 文件放置在那里，如下所示：\n\n```\n[root@pruebas html]#\
  \ pwd\n/usr/share/nginx/html\n[root@pruebas html]# ll\ntotal 24\n-rw-r--r-- 1 root\
  \ 3971 Aug 30 404.html\n-rw-r--r-- 1 root 4020 Aug 30 x.html\n-rw-r--r-- 1 root\
  \ 5057 Aug 30 index.html\n-rw-r--r-- 1 root 368 Aug 30 nginx-logo.png\n-rw-r--r--\
  \ 1 root 4148 Aug 30 poweredby.png\n```\n\n配置 `nginx` 服务请使用 `/etc/nginx/nginx.conf`\
  \ 文件：\n\n```\n[root@pruebas ~]# ll /etc/nginx/nginx.conf\n-rw-r--r-- 1 root 2469\
  \ Aug 30 /etc/nginx/nginx.conf\n```\n\n### NGINX 中的虚拟主机\n\n使用 Web 服务器（无论是 `Apache`\
  \ 还是 `Nginx`）的巨大优势之一是在同一主机上配置不同的网站；该操作基于大多数公司使用 Windows 服务器执行活动目录和 DNS 功能的传统方案，在这种情况下，DNS\
  \ 记录 `w1.aptivalabs.net`、`w2.aptivalabs.net` 和 `w3.aptivalabs.net` 指向主机 `192.168.1.201`。在\
  \ `Nginx` 中情况下，该主机将托管不同的网站。\n\n该过程从创建托管 html 文件的文件夹开始：\n\n```\n[root@pruebas ~]#\
  \ mkdir /w1\n[root@pruebas ~]# mkdir /w2\n[root@pruebas ~]# mkdir /w3\n```\n\n接下来，创建用于托管虚拟主机日志的目录：\n\
  \n```\n[root@pruebas ~]# mkdir /var/log/nginx/w1/\n[root@pruebas ~]# mkdir /var/log/nginx/w2/\n\
  [root@pruebas ~]# mkdir /var/log/nginx/w3/\n```\n\n有必要更改托管网站目录的 SELinux 策略并立即生效：\n\
  \n```\n[root@pruebas ~]# semanage fcontext -a -t httpd_content_t \"/w1(/.*)\"\n\
  [root@pruebas ~]# semanage fcontext -a -t httpd_content_t \"/w2(/.*)\"\n[root@pruebas\
  \ ~]# semanage fcontext -a -t httpd_content_t \"/w3(/.*)\"\n[root@pruebas ~]# restorecon\
  \ -Rv /w1\nRelabeled /w1 from unconfined_u:object_r:default_t:s0 to unconfined_u:object_r:httpd_content_t:s0\n\
  [root@pruebas ~]# restorecon -Rv /w2\nRelabeled /w2 from unconfined_u:object_r:default_t:s0\
  \ to unconfined_u:object_r:httpd_content_t:s0\n[root@pruebas ~]# restorecon -Rv\
  \ /w3\nRelabeled /w3 from unconfined_u:object_r:default_t:s0 to unconfined_u:object_r:httpd_content_t:s0\n\
  ```\n\n在编辑 `nginx` 服务配置文件之前，先创建一个副本：\n\n```\n[root@pruebas ~]# cp /etc/nginx/nginx.conf\
  \ /etc/nginx/nginx.conf.ori\n```\n\n在 `nginx` 文件中您将找到一个如下所示的部分：\n\n将以下内容添加到 `/etc/nginx/nginx.conf`\
  \ 文件的 `server` 块中，如下所示：\n\n```\n[root@pruebas ~]# vim /etc/nginx/nginx.conf\nserver\
  \ {\n    server_name w1.aptivalabs.net;\n    root /w1;\n    access_log /var/log/nginx/w1/access.log;\n\
  \    error_log /var/log/nginx/w1/error.log;\n}\nserver {\n    server_name w2.aptivalabs.net;\n\
  \    root /w2;\n    access_log /var/log/nginx/w2/access.log;\n    error_log /var/log/nginx/w2/error.log;\n\
  }\nserver {\n    server_name w3.aptivalabs.net;\n    root /w3;\n    access_log /var/log/nginx/w3/access.log;\n\
  \    error_log /var/log/nginx/w3/error.log;\n}\n```\n\n重启 `nginx` 服务：\n\n```\n[root@pruebas\
  \ ~]# systemctl restart nginx\n```\n\n接下来，为每个网站创建三个 (3) 个 \"html\" 文件，这些将是客户端请求它们时显示的默认页面：\n\
  \n```\n[root@pruebas ~]# echo \"<h1>Server 1</h1>\" > /w1/index.html\n[root@pruebas\
  \ ~]# echo \"<h1>Server 2</h1>\" > /w2/index.html\n[root@pruebas ~]# echo \"<h1>Server\
  \ 3</h1>\" > /w3/index.html\n```\n\n为了验证该操作是否有效，请在您自己的服务器上进行验证：\n\n```\n[root@pruebas\
  \ ~]# curl w1.aptivalabs.net\n[root@pruebas ~]# curl w2.aptivalabs.net\n[root@pruebas\
  \ ~]# curl w3.aptivalabs.net\n```\n\n### HTTP 流量的反向代理\n\n您可以配置 NGINX Web 服务器作为 HTTP\
  \ 流量的反向代理。您可以使用此功能将请求转发到远程服务器，客户端假定它正在从所访问的主机加载内容，但 `nginx` 服务从远程服务器加载实际内容并将其转发给客户端。\n\
  \n\n\n\n\n`192.168.1.202` 服务器已验证正在发布资源 `(test.html)`，如下所示：\n\n![](img/Image00026.jpg)\n\
  \n接下来，在服务器 `192.168.1.201` 上，我们编辑了 `nginx` 配置文件以添加以下行：\n\n```bash\n[root@pruebas\
  \ html]# vim /etc/nginx/nginx.conf\n\nlocation /test {\n    proxy_pass http://192.168.1.202/test.html;\n\
  }\n```\n\n在 `nginx` 配置文件中，配置块应该如下：\n\n```nginx\nserver {\n    listen       80 default_server;\n\
  \    listen       [::]:80 default_server;\n    server_name  _;\n    root       \
  \  /usr/share/nginx/html;\n    # 加载默认 server 块的配置文件。\n    include /etc/nginx/default.d/*.conf;\n\
  \    #location / {\n    #}\n    location /test {\n    proxy_pass http://192.168.1.202/test.html;\n\
  \    }\n    error_page 404 /404.html;\n    location = /40x.html {\n    }\n    error_page\
  \ 500 502 503 504 /50x.html;\n    location = /50x.html {\n    }\n}\n```\n\n接下来，在\
  \ SELinux 中启用布尔变量 `httpd_can_network_connect` 并重新启动服务：\n\n```bash\n[root@pruebas\
  \ html]# setsebool -P httpd_can_network_connect 1\n[root@pruebas html]# systemctl\
  \ restart nginx.service\n```\n\n为了在 HTTP 客户端上确认此设置，向 `http://192.168.1.201/test`\
  \ 发起请求，如下所示：\n\n![](img/Image00027.jpg)\n\n通过之前的练习，通过某种方式，实际上为客户端提供答案的服务器被隐藏了，即\
  \ `192.168.1.202`；用户访问 `192.168.1.201` Web 服务器查找答案，它显示的是另一个 Web 服务器的内容。\n\n## 使用\
  \ NGINX 的 HTTP 负载均衡器\n\n本过程描述了将 `NGINX` 服务配置为 HTTP 负载均衡器，它可以根据请求发送到不同的服务器，取决于哪个服务器的活动连接数最少，也就是说，它是关于确定负载组内哪台服务器健康状况更好以便发送\
  \ http 请求。在处理公司内部的 Web 应用程序时，这是一个非常有用的场景，并且对于该应用程序至少需要一个高可用方案。\n\n为了实现此功能，有以下服务器组：\n\
  \n* `192.168.1.201` = 负载均衡器\n* `192.168.1.202` = 服务器\n* `192.168.1.203` = 服务器\n\n\
  为了验证负载均衡器确实在工作，在服务器 `192.168.1.202` 和 `192.168.1.203` 上（运行着 `nginx` 服务）更改默认索引页（`index.html`），如下所示：\n\
  \n```bash\n[root@sr2 ~]# cd /usr/share/nginx/html/\n[root@sr2 html]# mv index.html\
  \ index.html.ori\n[root@sr2 html]# echo \"<h1>soy 192.168.1.202</h1>\" >> index.html\n\
  ```\n\n在 `192.168.1.203` 服务器上执行相同的指令：\n\n```bash\n[root@sr3 ~]# cd /usr/share/nginx/html/\n\
  [root@sr3 html]# mv index.html index.html.ori\n[root@sr3 html]# echo \"<h1>soy 192.168.1.203</h1>\"\
  \ >> index.html\n```\n\n在将执行负载均衡的服务器上，`nginx` 的配置文件应该如下：\n\n```nginx\nhttp {\n \
  \   log_format  main  '$remote_addr - $remote_user [$time_local] \"$request\" '\n\
  \    '$status $body_bytes_sent \"$http_referer\" '\n    '\"$http_user_agent\" \"\
  $http_x_forwarded_for\"';\n    access_log  /var/log/nginx/access.log  main;\n  \
  \  sendfile            on;\n    tcp_nopush          on;\n    tcp_nodelay       \
  \  on;\n    keepalive_timeout   65;\n    types_hash_max_size 2048;\n    include\
  \             /etc/nginx/mime.types;\n    default_type        application/octet-stream;\n\
  \    # 从 /etc/nginx/conf.d. 加载模块化配置文件。\n    # 更多信息请参见 http://nginx.org/en/docs/ngx_core_module.html\n\
  \    include /etc/nginx/conf.d/*.conf;\n    upstream loadbalancer.aptivalabs.net\
  \ {\n        least_conn;\n        server 192.168.1.202;\n        server 192.168.1.203;\n\
  \    }\n    server {\n        listen       80 default_server;\n        listen  \
  \     [::]:80 default_server;\n        server_name  _;\n        root         /usr/share/nginx/html;\n\
  \        # 加载默认 server 的配置文件。\n        include /etc/nginx/default.d/*.conf;\n  \
  \      #location / {\n        location / {\n            proxy_pass http://loadbalancer.aptivalabs.net;\n\
  \        }\n        error_page 404 /404.html;\n        location = /40x.html {\n\
  \        }\n        error_page 500 502 503 504 /50x.html;\n        location = /50x.html\
  \ {\n        }\n    }\n    # 启用 TLS 的服务器设置。\n    # server {\n    #    listen   \
  \     443 ssl default_server;\n    #    listen       [::]:443 ssl default_server;\n\
  \    #    server_name  _;\n    #    root         /usr/share/nginx/html;\n    # \
  \   ssl_certificate \"/etc/nginx/ssl.crt\";\n    #    ssl_certificate_key \"/etc/nginx/ssl.key\"\
  ;\n    #    ssl_session_cache shared;\n    #    ssl_session_timeout 10m;\n    #\
  \    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;\n    # }\n}\n```\n\n[译文]\n\n本过程描述了将 `NGINX`\
  \ 服务配置为 HTTP 负载均衡器，它可以将请求发送到不同的服务器，取决于哪个服务器的活动连接数最少，也就是说，它是关于确定负载组内哪台服务器健康状况更好以便发送\
  \ http 请求。在处理公司内部的 Web 应用程序时，这是一个非常有用的场景，并且对于该应用程序至少需要一个高可用方案。\n\n为了实现此功能，有以下服务器组：\n\
  \n* `192.168.1.201` = 负载均衡器\n* `192.168.1.202` = 服务器\n* `192.168.1.203` = 服务器\n\n\
  为了验证负载均衡器确实在工作，在服务器 `192.168.1.202` 和 `192.168.1.203` 上（运行着 `nginx` 服务）更改默认索引页（`index.html`），如下所示：\n\
  \n```bash\n[root@sr2 ~]# cd /usr/share/nginx/html/\n[root@sr2 html]# mv index.html\
  \ index.html.ori\n[root@sr2 html]# echo \"<h1>soy 192.168.1.202</h1>\" >> index.html\n\
  ```\n\n在 `192.168.1.203` 服务器上执行相同的指令：\n\n```bash\n[root@sr3 ~]# cd /usr/share/nginx/html/\n\
  [root@sr3 html]# mv index.html index.html.ori\n[root@sr3 html]# echo \"<h1>soy 192.168.1.203</h1>\"\
  \ >> index.html\n```\n\n在将执行负载均衡的服务器上，`nginx` 的配置文件应该如下：\n\n```nginx\nhttp {\n \
  \   log_format  main  '$remote_addr - $remote_user [$time_local] \"$request\" '\n\
  \    '$status $body_bytes_sent \"$http_referer\" '\n    '\"$http_user_agent\" \"\
  $http_x_forwarded_for\"';\n    access_log  /var/log/nginx/access.log  main;\n  \
  \  sendfile            on;\n    tcp_nopush          on;\n    tcp_nodelay       \
  \  on;\n    keepalive_timeout   65;\n    types_hash_max_size 2048;\n    include\
  \             /etc/nginx/mime.types;\n    default_type        application/octet-stream;\n\
  \    # 从 /etc/nginx/conf.d. 加载模块化配置文件。\n    # 更多信息请参见 http://nginx.org/en/docs/ngx_core_module.html\n\
  \    include /etc/nginx/conf.d/*.conf;\n    upstream loadbalancer.aptivalabs.net\
  \ {\n        least_conn;\n        server 192.168.1.202;\n        server 192.168.1.203;\n\
  \    }\n    server {\n        listen       80 default_server;\n        listen  \
  \     [::]:80 default_server;\n        server_name  _;\n        root         /usr/share/nginx/html;\n\
  \        # 加载默认 server 的配置文件。\n        include /etc/nginx/default.d/*.conf;\n  \
  \      #location / {\n        location / {\n            proxy_pass http://loadbalancer.aptivalabs.net;\n\
  \        }\n        error_page 404 /404.html;\n        location = /40x.html {\n\
  \        }\n        error_page 500 502 503 504 /50x.html;\n        location = /50x.html\
  \ {\n        }\n    }\n    # 启用 TLS 的服务器设置。\n    # server {\n    #    listen   \
  \     443 ssl default_server;\n    #    listen       [::]:443 ssl default_server;\n\
  \    #    server_name  _;\n    #    root         /usr/share/nginx/html;\n    # \
  \   ssl_certificate \"/etc/nginx/ssl.crt\";\n    #    ssl_certificate_key \"/etc/nginx/ssl.key\"\
  ;\n    #    ssl_session_cache shared;\n    #    ssl_session_timeout 10m;\n    #\
  \    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;\n    # }\n}\n```\n\n`192.168.1.202` 服务器已验证正在发布资源\
  \ `(test.html)`，如下所示：\n\n![](img/Image00026.jpg)\n\n接下来，在服务器 `192.168.1.201` 上，我们编辑了\
  \ `nginx` 配置文件以添加以下行：\n\n```bash\n[root@pruebas html]# vim /etc/nginx/nginx.conf\n\
  \nlocation /test {\n    proxy_pass http://192.168.1.202/test.html;\n}\n```\n\n接下来，在\
  \ SELinux 中启用布尔变量 `httpd_can_network_connect` 并重新启动服务：\n\n```bash\n[root@pruebas\
  \ html]# setsebool -P httpd_can_network_connect 1\n[root@pruebas html]# systemctl\
  \ restart nginx.service\n```\n\n为了在 HTTP 客户端上确认此设置，向 `http://192.168.1.201/test`\
  \ 发起请求，如下所示：\n\n![](img/Image00027.jpg)\n\n通过之前的练习，通过某种方式，实际上为客户端提供答案的服务器被隐藏了，即\
  \ `192.168.1.202`；用户访问 `192.168.1.201` Web 服务器查找答案，它显示的是另一个 Web 服务器的内容。\n\n## 使用\
  \ NGINX 的 HTTP 负载均衡器\n\n本过程描述了将 `NGINX` 服务配置为 HTTP 负载均衡器，它可以将请求发送到不同的服务器，取决于哪个服务器的活动连接数最少，也就是说，它是关于确定负载组内哪台服务器健康状况更好以便发送\
  \ http 请求。在处理公司内部的 Web 应用程序时，这是一个非常有用的场景，并且对于该应用程序至少需要一个高可用方案。\n\n为了实现此功能，有以下服务器组：\n\
  \n* `192.168.1.201` = 负载均衡器\n* `192.168.1.202` = 服务器\n* `192.168.1.203` = 服务器\n\n\
  为了验证负载均衡器确实在工作，在服务器 `192.168.1.202` 和 `192.168.1.203` 上（运行着 `nginx` 服务）更改默认索引页（`index.html`），如下所示：\n\
  \n```bash\n[root@sr2 ~]# cd /usr/share/nginx/html/\n[root@sr2 html]# mv index.html\
  \ index.html.ori\n[root@sr2 html]# echo \"<h1>soy 192.168.1.202</h1>\" >> index.html\n\
  ```\n\n在 `192.168.1.203` 服务器上执行相同的指令：\n\n```bash\n[root@sr3 ~]# cd /usr/share/nginx/html/\n\
  [root@sr3 html]# mv index.html index.html.ori\n[root@sr3 html]# echo \"<h1>soy 192.168.1.203</h1>\"\
  \ >> index.html\n```\n\n在将执行负载均衡的服务器上，`nginx` 的配置文件应该如下：\n\n```nginx\nhttp {\n \
  \   log_format  main  '$remote_addr - $remote_user [$time_local] \"$request\" '\n\
  \    '$status $body_bytes_sent \"$http_referer\" '\n    '\"$http_user_agent\" \"\
  $http_x_forwarded_for\"';\n    access_log  /var/log/nginx/access.log  main;\n  \
  \  sendfile            on;\n    tcp_nopush          on;\n    tcp_nodelay       \
  \  on;\n    keepalive_timeout   65;\n    types_hash_max_size 2048;\n    include\
  \             /etc/nginx/mime.types;\n    default_type        application/octet-stream;\n\
  \    # 从 /etc/nginx/conf.d. 加载模块化配置文件。\n    # 更多信息请参见 http://nginx.org/en/docs/ngx_core_module.html\n\
  \    include /etc/nginx/conf.d/*.conf;\n    upstream loadbalancer.aptivalabs.net\
  \ {\n        least_conn;\n        server 192.168.1.202;\n        server 192.168.1.203;\n\
  \    }\n    server {\n        listen       80 default_server;\n        listen  \
  \     [::]:80 default_server;\n        server_name  _;\n        root         /usr/share/nginx/html;\n\
  \        # 加载默认 server 的配置文件。\n        include /etc/nginx/default.d/*.conf;\n  \
  \      #location / {\n        location / {\n            proxy_pass http://loadbalancer.aptivalabs.net;\n\
  \        }\n        error_page 404 /404.html;\n        location = /40x.html {\n\
  \        }\n        error_page 500 502 503 504 /50x.html;\n        location = /50x.html\
  \ {\n        }\n    }\n    # 启用 TLS 的服务器设置。\n    # server {\n    #    listen   \
  \     443 ssl default_server;\n    #    listen       [::]:443 ssl default_server;\n\
  \    #    server_name  _;\n    #    root         /usr/share/nginx/html;\n    # \
  \   ssl_certificate \"/etc/nginx/ssl.crt\";\n    #    ssl_certificate_key \"/etc/nginx/ssl.key\"\
  ;\n    #    ssl_session_cache shared;\n    #    ssl_session_timeout 10m;\n    #\
  \    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;\n    # }\n}\n```\n\n`TLS` (Transport Layer\
  \ Security) 是网络通信的加密方法，是 `SSL` 的继任。`TLS` 允许客户端验证服务器的身份，服务器也可以验证客户端的身份。\n\n特性：\n\n\
  * `TLS` 基于证书的概念。\n* 证书包含多个部分：公钥、服务器身份以及权威证书的签名。\n* 对应的私钥永远不会公开。\n* 用私钥加密的数据只能用公钥解密，反之亦然。\n\
  \n通信阶段涉及各种活动的发展；客户端和服务器双方双方的加密规则并交换随机位。客户端使用这些数据生成会话密钥，该密钥将用于更快的对称加密，其中加密和解密使用相同的密钥。为了确保此密钥不泄露，它将在使用服务器公钥加密后发送到服务器。\n\
  \n加密通信所需的证书在下方生成，如下：\n\n```bash\n[root@loadbalancer ~]# openssl req -x509 -out localhost.crt\
  \ -keyout localhost.key -newkey rsa:2048 -nodes -sha256 -subj '/CN=localhost' -extensions\
  \ EXT -config <( \\\nprintf \"[dn]\\nCN=localhost\\n[req]\\ndistinguished_name =\
  \ dn\\n[EXT]\\nsubjectAltName=DNS:localhost\\nkeyUsage=digitalSignature\\nextendedKeyUsage=serverAuth\"\
  )\n```\n\n\n\n\n必须将证书复制到相应的路径，以便 `nginx` 服务读取它们，该路径必须在 `nginx` 文件中定义：\n\n```bash\n\
  [root@loadbalancer ~]# cp localhost.crt /etc/pki/tls/certs/localhost.crt\n[root@loadbalancer\
  \ ~]# cp localhost.key /etc/pki/tls/private/localhost.key\n```\n\n`nginx` 服务的配置文件应该如下：\n\
  \n```bash\n[root@loadbalancer ~]# cat /etc/nginx/nginx.conf\n\nserver {\n    listen\
  \       443 ssl http2 default_server;\n    listen       [::]:443 ssl http2 default_server;\n\
  \    server_name  _;\n    root         /usr/share/nginx/html;\n    ssl_certificate\
  \ \"/etc/pki/tls/certs/localhost.crt\";\n    ssl_certificate_key \"/etc/pki/tls/private/localhost.key\"\
  ;\n    listen       80 default_server;\n    listen       [::]:80 default_server;\n\
  \    #server_name  _;\n    #server_name loadbalancer.aptivalabs.net;\n    #root\
  \         /usr/share/nginx/html;\n    # Load configuration files for the default\
  \ server block.\n    include /etc/nginx/default.d/*.conf;\n    location / {\n  \
  \  }\n    error_page 404 /404.html;\n    location = /40x.html {\n    }\n    error_page\
  \ 500 502 503 504 /50x.html;\n    location = /50x.html {\n    }\n}\n```\n\n可以看出，`nginx`\
  \ 服务被配置为通过 80 和 443 端口接收请求，并使用相同的发布路径 `/usr/share/nginx/html`。同样，也列出了 `nginx` 查找证书的路径。该操作表明需要告诉\
  \ FirewallD 在默认区域接受 HTTPS 请求，而 HTTP 请求已在 FirewallD 中添加：\n\n```bash\n[root@loadbalancer\
  \ ~]# firewall-cmd --permanent --add-service=https\nsuccess\n[root@loadbalancer\
  \ ~]# firewall-cmd --reload\nsuccess\n```\n\n要验证配置，请运行任任的 HTTP 客户端并尝试通过 HTTP 与服务器通信，如下所示：\n\
  \n![](img/Image00028.jpg) \n\n接下来，在你的 HTTP 客户端中，尝试通过 HTTPS 进行通信：\n\n![](img/Image00029.jpg)\
  \ \n\n## 无值安装 - KICKSTART\n\n在经常需要执行 RHEL 8 安装的环境（此过程也可以在 Oracle Linux 和 CentOS\
  \ 8 中模拟），当尝试安装许多系统时，运行手动过程可能会有些疲惫；例如，可能为 20 名学生进行 Linux 实验而安装整个训练环境，或者公司需要实现一个服务集群（存储、虚拟化等），其中涉及到许多\
  \ Linux 系统。\n\n面对这种情况，Kickstart 工具允许生成无人无人值的、自动化的安装。此时，只需告诉安装程序在何处找到安装定义文件，安装程序即可执行此活动，而管理员无需根据每个系统的安装情况亲自到场。\n\
  \n为了开发此项活动，需要执行以下步骤：\n\n1. 生成 kickstart 文件（安装定义文件）\n2. 将 kickstart 文件发布到可见资源\n3.\
  \ 发布安装包\n4. 从安装 ISO 开始安装\n\n在要实现的练习场景中，涉及 IP 地址为 `192.168.0.200` 的服务器，该服务器实现了 `Nginx`\
  \ 服务，并将 RHEL 8 安装 ISO 挂载在 Nginx 发布路径中。\n\n第一步是生成 kickstart 文件，这是一个文本文件，其中以自己的格式定义了安装所需的特性。该文件的生成可以使用\
  \ Red Hat 为此目的提供的工具，该工具位于 URL `https://access.redhat.com/labs/kickstartconfig/`。同样，RHEL\
  \ 8 及其衍生系统在完成安装后，会在 `/root` 下留一个名为 `anaconda-ks.cfg` 的文件，它就是一个 kickstart 文件：\n\n\
  ```bash\n[root@loadbalancer ~]# pwd\n/root\n[root@loadbalancer ~]# ll anaconda-ks.cfg\n\
  -rw-------. 1 root root 1275 Dec 17 17:21 anaconda-ks.cfg\n```\n\n在练习开发过程中，使用了工具\
  \ `https://access.redhat.com/labs/kickstartconfig/`，生成了文件并下载到 RHEL 8 服务器；生成的文件定义了“最小安装”环境的部署；生成的文件详情如下：\n\
  \n```bash\n[root@loadbalancer html]# cat ks.cfg\nlang en_US\nkeyboard us\ntimezone\
  \ America/Bogota --isUtc\nrootpw $1$wRe6mImL$eyda8JWudogBZ5pMTTVU9/ --iscrypted\n\
  ```\n\n```bash\n[root@loadbalancer html]# cat ks.cfg\nlang en_US\nkeyboard us\n\
  timezone America/Bogota --isUtc\nrootpw $1$wRe6mImL$eyda8JWudogBZ5pMTTVU9/ --iscrypted\n\
  ```\n\n```bash\n[root@loadbalancer html]# cat ks.cfg\nlang en_US\nkeyboard us\n\
  timezone America/Bogota --isUtc\nrootpw $1$wRe6mImL$eyda8JWudogBZ5pMTTVU9/ --iscrypted\n\
  ```\n\n（注：此处原文中存在大量重复的命令块描述，已根据逻辑流进行整合和翻译处理……）\n\n## 使用 SAMBA 部署文件服务器\n\nSamba 在\
  \ RHEL 中实现了服务器消息块 (SMB) 协议。该协议用于访问服务器资源，如共享文件和打印机。部署如 Samba 的 SMB 服务可能意味着需要处理与 Samba\
  \ 相关的服务，例如 `smbd`、`nmbd` 和 `winbind`。\n\n\n\n\n`smbd` 服务使用 SMB 协议提供文件共享和打印服务，并负责限制资源以及连接到\
  \ Samba 的用户进行身份验证。\n\n`nmbd` 服务使用 NetBIOS over IPv4 协议提供主机名和 IP 解析。除了名称解析外，`nmbd`\
  \ 服务还允许你浏览 SMB 网络以定位域、工作组、主机、文件共享和打印机。\n\n`winbind` 服务为名称交换服务（NSS - 网络服务切换器）提供接口，以便将本地和\
  \ AD（活动目录）用户及用户组集成到本地系统中。这允许域用户对由 Samba 服务器或其他本地服务管理的服务进行身份验证。如果你将 Samba 配置为域成员，则必须在启动\
  \ `smbd` 服务之前启动 `winbind` 进程，否则本地系统将无法使用域用户和用户组。\n\n为了更深入地了解如何实现 Samba 作为文件服务器的部署，我们将使用\
  \ IP 地址为 `192.168.0.201` 的服务器作为 Samba 服务器；我们将模拟公司内部某些工作组（财务和人力资源 - hr）的场景，他们需要对系统内的文件夹拥有权限以保存文件。访问这些资源的人将使用\
  \ Linux Red Hat、Microsoft Windows 10 和 Apple Mac OSX 系统。这些人可以在个人文件夹和组文件夹中保存个人信息；在任何时候，他们都无法访问\
  \ Linux 器上的 Shell。\n\n### Samba 安装\n\n练习从安装 Samba 开始，如下所示：\n\n```bash\n[root@sr1\
  \ ~]# yum -y install samba\n\n正在更新订阅管理仓库。\n上一次元数据过期检查：2021 年 3 月 24 日周三 下午 03:19:16\
  \ EDT, 0:35:00 前。\n依赖关系已解决。\n================================================================================\n\
  Package             Architecture   Version                    Repository       \
  \                      Size\n================================================================================\n\
  Installing:\nsamba                x86_64         4.12.3-14.el8_3            rhel-8-for-x86_64-baseos-rpms\
  \     840 k\n正在安装依赖项:\nsamba-common-tools     x86_64         4.12.3-14.el8_3   \
  \        rhel-8-for-x86_64-baseos-rpms     484 k\nsamba-libs             x86_64\
  \         4.12.3-14.el8_3           rhel-8-for-x86_64-baseos-rpms     188 k\n事务摘要\n\
  ================================================================================\n\
  安装  3 个软件包\n总下载大小: 1.5 M\n安装后大小: 4.0 M\n已安装:\nsamba-4.12.3-14.el8_3.x86_64  samba-common-tools-4.12.3-14.el8_3.x86_64\
  \  samba-libs-4.12.3-14.el8_3.x86_64\n```\n\n### 目录与权限设置\n\n我们继续创建包含工作组信息的文件夹；需要说明的是，在实际场景中，建议将\
  \ `/datos` 挂载为带有精简卷（LV Thin）的 LVM 结构上的 XFS 文件系统挂载点；创建文件夹：\n\n```bash\n[root@sr1\
  \ ~]# mkdir -p /datos/tesoreria\n[root@sr1 ~]# mkdir /datos/rrhh\n```\n\n创建工作组并在创建的文件夹上分配相应的权限：\n\
  \n```bash\n[root@sr1 ~]# groupadd -r tesoreria\n[root@sr1 ~]# groupadd -r rrhh\n\
  [root@sr1 ~]# chgrp tesoreria /datos/tesoreria\n[root@sr1 ~]# chgrp rrhh /datos/rrhh\n\
  [root@sr1 ~]# chmod 2770 /datos/tesoreria\n[root@sr1 ~]# chmod 2770 /datos/rrhh\n\
  ```\n\n你可以在上一条指令中看到“setgid”权限的创建，以便在每个组文件夹中创建的文件在创建后后仍继续属于同一组；通过默认声明 ACL 也执行了相同的操作，使得未来的文件和目录保留必要的属性，从而让“财务”组和“人力资源”组的用户继续对资源拥有权限：\n\
  \n```bash\n[root@sr1 ~]# setfacl -m g:tesoreria:rwx /datos/tesoreria\n[root@sr1\
  \ ~]# setfacl -m d:g:tesoreria:rwx /datos/tesoreria\n[root@sr1 ~]# setfacl -m g:rrhh:rwx\
  \ /datos/rrhh\n[root@sr1 ~]# setfacl -m d:g:rrhh:rwx /datos/rrhh\n```\n\n### SELinux\
  \ 配置\n\n现在是使用 SELinux 控制对这些目录的访问了，SELinux 必须处于“强制”（enforcing）模式：\n\n```bash\n[root@sr1\
  \ ~]# semanage fcontext -a -t samba_share_t '/datos/tesoreria(/.*)'\n[root@sr1 ~]#\
  \ semanage fcontext -a -t samba_share_t '/datos/rrhh(/.*)'\n[root@sr1 ~]# restorecon\
  \ -vv /datos/tesoreria\n[root@sr1 ~]# restorecon -Rv /datos/rrhh\n```\n\n上述语句通过\
  \ SELinux 控制对这些目录的访问，SELinux 必须处于“强制”模式。上述语句应用了 SELinux 允许 Samba 导出策略。\n\n### Samba\
  \ 用户创建\n\n创建 Samba 用户，以便 Linux 系统创建的用户能够以相同名称的方式访问 Samba 服务，并在 Samba 配置文件中设置密码。\n\
  \n```bash\n[root@sr1 ~]# adduser -N -s /sbin/nologin tesoreria\n[root@sr1 ~]# smbpasswd\
  \ -a\n[root@sr1 ~]# adduser -N -s /sbin/nologin rrhh\n```\n\n查看 `/home` 目录。\n\n\
  如果你查看 `/home` 目录，将看到用户：\n\n```bash\n[root@sr1 ~]# ll /home/\ntotal 4\ndrwx------\
  \ 3 rrhh Mar 24\ndrwx------ 3 t1 Mar 24\n```\n\n### Samba 配置\n\n一旦定义了文件服务器支持的整个结构，出于备份考虑，需要保存\
  \ Samba 文件。Samba 安装了 `/etc/samba` 路径，这是配置文件的所在：\n\n```bash\n[root@sr1 ~]# cd /etc/samba\n\
  [root@sr1 ~]# pwd\n/etc/samba\n[root@sr1 ~]# mv smb.conf smb.conf.original\n[root@sr1\
  \ ~]# mv smb.conf.example smb.conf\n```\n\n`smb.conf.example` 文件包含了 Samba 所需的配置，重命名后将作为主配置文件\
  \ `smb.conf`。按照这些步骤，需要编辑此配置文件以建立以下指南：\n\n```bash\n[root@sr1 ~]# vim /etc/samba/smb.conf\n\
  workgroup = WORKGROUP\ninterfaces = lo ens18\nhost allow = 127.168.0\nsecurity =\
  \ user\npassdb backend = tddb\n```\n\n之前的定义在 `[global]` 部分设置了 Samba 的以下属性：\n- **security**:\
  \ 指定客户端如何访问 Samba，`user` 定义了使用用户名和密码。\n- **interfaces**: Samba 监听请求的接口。\n- **host\
  \ allow**: 允许使用服务的主机或网络。\n\n在编辑 Samba 配置文件后（在文件末尾），需要添加要共享的资源，此处是之前创建的文件夹：\n\n```ini\n\
  [tesoreria]\ncomment = 财务部门共享\npath = /datos/tesoreria\nwritable = yes\nvalid users\
  \ = @tesoreria\n[rrhh]\ncomment = 人力资源共享\npath = /datos/rrhh\nwritable = yes\nvalid\
  \ users = @rrhh\n```\n\n\n\n\n一旦 Samba 配置文件通过验证，服务将启动并激活以启动 Linux 服务器，同时将建立 FirewallD\
  \ 规则以允许接收此类请求：\n\n```bash\n[root@sr1 ~]# systemctl enable smb\n[root@sr1 ~]# systemctl\
  \ start smb\n[root@sr1 ~]# firewall-cmd --permanent --add-service=samba\n[root@sr1\
  \ ~]# firewall-cmd --reload\n```\n\n## SMB 客户端\n\n要访问此文件服务器的服务，你可以使用运行 Apple Mac\
  \ Osx 系统的计算机通过“访达”（Finder）应用程序的“前往 / 连接到服务器...Go / Connect to Server...”菜单进行连接；这次我们将使用之前创建的用户“t1”进行注册，如下所示：\n\
  \n![](img/Image00032.jpg)![](img/Image00033.jpg)\n\n对于 Microsoft Windows 客户端（与 Windows\
  \ 10 一一样），你可以使用“Windows 资源管理器”在该工具的地址栏连接 Samba 服务器，输入 `\\\\192.168.0.201`，如下图所示：\n\
  \n![](img/Image00034.jpg)\n\n一旦你输入了相应的凭据，就可以相应地保存文件了。\n\n如果需要将 Linux RHEL 8 服务器连接到之前部署的\
  \ Samba 文件服务器，你必须在该服务器上执行以下操作：\n\n```bash\n[root@loadbalancer ~]# yum -y install\
  \ cifs-utils\nUpdating Subscription Management repositories.\nLast metadata expiration\
  \ check: 5:42:05 ago on Wed 24 Mar 2021 10:46:12 AM -05.\n------\nComplete!\n[root@loadbalancer\
  \ ~]# mkdir /mnt/t1\n[root@loadbalancer ~]# mount -o username=t1 //192.168.0.201/tesoreria\
  \ /mnt/t1\nPassword for t1@//192.168.0.201/tesoreria:  ******\n[root@loadbalancer\
  \ ~]# df -hT\nFilesystem                Type      Size  Used Avail Use% Mounted\
  \ on\n--- salida omitida ---\n//192.168.0.201/tesoreria cifs       44G  5.1G   39G\
  \  12% /mnt/t1\n```\n\n要执行持久挂载，有必要创建一个包含访问凭据的文件（在此情况下为用户“t1”的凭据），对该文件设置权限并编辑 `/etc/fstab`，如下：\n\
  \n```bash\n[root@loadbalancer ~]# vim credenciales.smb\nusername=t1\npassword=123456\n\
  [root@loadbalancer ~]# chmod 600 credenciales.smb\n[root@loadbalancer ~]# vim /etc/fstab\n\
  //192.168.0.201/tesoreria  /mnt/t1  cifs credentials=/root/credenciales.smb 0 0\n\
  [root@loadbalancer ~]# udevadm settle\n[root@loadbalancer ~]# systemctl daemon-reload\n\
  [root@loadbalancer ~]# mount -a\n```\n\n要验证与服务器 `192.168.0.201` 的连通性，请运行：\n\n```bash\n\
  [root@loadbalancer ~]# df -hT\nFilesystem                Type      Size  Used\n\
  --- salida omitida ---\n//192.168.0.201/tesoreria cifs       44G  5.1G   39G  12%\
  \ /mnt/t1\n```\n\n## RED HAT LINUX 作为 WINDOWS 服务器成员域\n\n从 RHEL 8 开始，提供了相关工具来生成与\
  \ Microsoft Windows Server 及其活动目录（Active Directory）的集成；这种集成允许为域用户提供以下某些功能：\n\n*\
  \ 验证域用户访问本地服务的身份，例如 `sshd`\n* 共享托管在 Linux 服务器上的目录和打印机，使域用户能够访问这些资源。\n\n然而，在享受这些权限之前，有必要将\
  \ RHEL 服务器引入 Windows Server 域，该过程从更新加密策略开始，如下所示：\n\n```bash\n[root@loadbalancer\
  \ ~]# update-crypto-policies --set DEFAULT:AD-SUPPORT\nSetting system policy to\
  \ DEFAULT:AD-SUPPORT\nNote：系统级加密策略在应用程序启动时生效。\n建议重启系统以使策略完全生效。\n```\n\n此更新请求系统进行“重启”：\n\
  \n```bash\n[root@loadbalancer ~]# systemctl reboot\n```\n\n有必要安装一些应用程序，如下：\n\n```bash\n\
  [root@loadbalancer ~]# yum install realmd oddjob-mkhomedir oddjob samba-winbind-clients\
  \ samba-winbind samba-common-tools samba-winbind-krb5-locator\nUpdating Subscription\
  \ Management repositories.\nLast metadata expiration check: 0:59:36 ago on Wed 24\
