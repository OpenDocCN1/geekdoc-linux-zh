  \   484 k\nsamba-winbind               x86_64  4.12.3-14.el8_3            redhel-for-x86_64-os-rpms\
  \   567 k\nsamba-winbind-clients       x86_64  4.12.3-14.el8_3            redhel-for-x86_64-os-rpms\
