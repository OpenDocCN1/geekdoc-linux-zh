  \n# LINUX 系统审计\n\n审计 Linux 系统是记录相关安全事件的绝佳机会。这些审计允许 Linux 管理员监控其想要的文件、系统调用 (`syscall`)、记录用户执行的命令，以及监控与防火墙相关的问题。我们将执行审计任务的工具之一是\
  \ `Audit`。\n\n系统调用 (`syscall - systemcall`) 指应用程序与 Linux 内核通信的方法，提供了文件管理、系统进程和设备的信息。Audit\
  \ 允许你生成规则并将其写入系统控制台，规则不是持久的，但可以通过注册到 `/etc/audit/audit.rules` 实现持久化。安装 `audit` 你可以如下所示操作：\n\
  \n```bash\n[root@pruebas ~]# yum install audit -y\nUpdating Subscription Management\
  \ repositories.\nLast metadata expiration check: 0:53:36 ago on Thu 04 Mar 2021\
  \ 10:29:20 AM -05.\nPackage audit-3.0-0.17.20191104git1c2f87.el8.x86_64 is already\
  \ installed.\nDependencies resolved.\nNothing to do.\nComplete!\n```\n正如你所见，软件包\
  \ `audit-3.0-0.17` 已经通过操作系统部署安装。该软件的配置文件位于 `/etc/audit/audit.conf`。\n\n\n\n\n```bash\n\
  [root@pruebas audit]# pwd\n/etc/audit\n\n[root@pruebas audit]# ll\ntotal 12\n-rw-r-----.\
  \ 1 root root 127 Jan  8  2020 audit-stop.rules\n-rw-r-----. 1 root root 107 Dec\
  \ 17 17:13 audit.rules\n-rw-r-----. 1 root root 856 Jan  8  2020 auditd.conf\ndrwxr-x---.\
  \ 2 root root  49 Dec 17 17:13 plugins.d\ndrwxr-x---. 2 root root  25 Dec 17 17:11\
  \ rules.d\n```\n\n此文件定义了应用程序参数，我们将在后续学习本主题时将使用到这些参数。\n\nAudit 的安装会在系统中生成“audit”服务，如下所示：\n\
  \n```bash\n[root@pruebas ~]# systemctl --type service | grep audit\nauditd.service\
  \                     loaded active running Security Auditing Service\n[root@pruebas\
  \ ~]# systemctl status auditd.service\n● auditd.service - Security Auditing Service\n\
  Loaded: loaded (/usr/lib/systemd/system/auditd.service; enabled; vendor preset:\
  \ enabled)\nActive: active (running) since Thu 2021-03-04 07:17:53 -05; 4h 10min\
  \ ago\n--- salida omitida ---\nMar 04 07:17:53 pruebas.aptivalabs augenrules[1081]:\
  \ lost 0\nMar 04 07:17:53 pruebas.aptivalabs augenrules[1081]: backlog 4\nMar 04\
  \ 07:17:53 pruebas.aptivalabs augenrules[1081]: backlog_wait_time 60000\nMar 04\
  \ 07:17:53 pruebas.aptivalabs systemd[1]: Started Security Auditing Service.\n```\n\
  \nAudit 提供了一种记录系统相关信息的方法。根据预配置的规则，Audit 会生成日志条目，尽尽可能记录关于系统上正在发生的事件的信息。这些信息对于任务关键型环境至关重要，可以识别安全策略违背者以及他们在系统上采取的操作。以下列表总结了\
  \ Audit 能够在日志文件中记录的某些信息：\n\n- 事件的日期和时间、类型和结果。\n- 事件与触发该事件的用户身份的关联。\n- 对 Audit 配置的所有修改，以及对\
  \ `/var/log/audit/audit.log` 的访问尝试。\n- 所有对认证机制（如 SSH、Kerberos 等）的使用。\n- 对任何受信任数据库（如\
  \ `/etc/passwd`）的更改。\n- 你尝试向系统或从系统导入或导出信息。\n- 根据用户身份和其他属性包含或排除事件。\n\nAudit 由两部分组成：用户空间中的应用程序和工具，以及内核侧对系统调用的处理。内核组件接收来自用户空间应用程序的系统调用，并通过以下过滤器之一进行过滤：用户（user）、任务（task）、文件类型（fstype）或退出（exit）。\n\
  \n默认情况下，Audit 将日志条目存储在 `/var/log/audit/audit.log` 文件中；如果配置文件中启用了日志轮转，轮转后的 audit.log\
  \ 文件将存储在同一目录下。\n\n## 使用 AUDIT 建立 AUD 规则\n\n为了建立规则，Audit 使用 `auditctl` 命令，让我们来看一个示例：\n\
  \n```bash\n[root@pruebas ~]# auditctl -w /etc/ssh/sshd_config -p warx -k sshd_config\n\
  ```\n\n前面的指令使用了 `auditctl` 命令的某些参数，解释如下：\n\n- `-w` 表示要审计的文件或目录\n- `-p` 表示要对审计对象进行审计的操作（`w-`\
  \ 写入、`r-` 读取、`x-` 执行以及属性更改）\n- `-k` 表示用于结果报告的关键字\n\n我们将尝试从标准用户（在此例中为用户 \"fmestre\"\
  ）查看此文件的内容；如果 Audit 服务正在运行，我们必须在 `/var/log/audit/audit.log` 中观察到用户 “fmestre” 尝试读取文件内容的记录；让我们看看：\n\
  \n```bash\n[root@pruebas ~]# su - fmestre\n[fmestre@pruebas ~]$ cat /etc/ssh/sshd_config\n\
  cat: /etc/ssh/sshd_config: Permission denied\n```\n\n此审计事件应在日志文件中生成四 (4) 条记录，如下所示：\n\
  \n```bash\n[root@pruebas ~]# tail -n 4 /var/log/audit/audit.log\ntype=SYSCALL msg=audit(1614886599.538:116):\
  \ arch=c000003e syscall=257 success=no exit=-13 a0=ffffff9c a1=7ffce1e84647 a2=0\
  \ a3=0 items=1 ppid=2622 pid=2668 auid=0 uid=1000 gid=1000 euid=1000 suid=1000 fsuid=1000\
  \ egid=1000 sgid=1000 tty=pts1 ses=3 comm=\"cat\" exe=\"/usr/bin/cat\" subj=unconfined:unconfined_r:unconfined\n\
  ```\n\n\n\n\n\n```bash\n-w /etc/passwd -p wa -k passwd_changes\n-w /etc/selinux/\
  \ -p wa -k selinux_changes\n-w /sbin/insmod -p x -k module_insertion\n-a always,exit\
  \ -F arch=b64 -S adjtimex -S settimeofday -k time_change\n```\n\n### AUDIT 中的规则设置\n\
  \n在路径 `/usr/share/audit/sample-rules` 中，可以观察到某些文件会将预配置的规则插入 `Audit`，并且软件会根据这些规则开始审计，如下所示：\n\
  \n```bash\n[root@pruebas ~]# cd /usr/share/audit/sample-rules\n[root@pruebas sample-rules]#\
  \ ll\n\ntotal 156\n-rw-r--r--. 1 root root  244 Jan  8  2020 10-base-config.rules\n\
  -rw-r--r--. 1 root root  284 Jan  8  2020 10-no-audit.rules\n-rw-r--r--. 1 root\
  \ root   93 Jan  8  2020 11-loginuid.rules\n-rw-r--r--. 1 root root  333 Jan  8\
  \  2020 12-cont-fail.rules\n-rw-r--r--. 1 root root  327 Jan  8  2020 12-ignore-error.rules\n\
  --- salida omitida ---\n```\n\n我们可以看到其中一些文件的内容如下：\n\n```bash\n[root@pruebas sample-rules]#\
  \ cat 30-stig.rules\n### 这些规则的目的是满足 STIG 审计要求\n### 这些规则依赖于安装了 10-base-config.rules\
  \ 和 99-finalize.rules\n--- skipped output ---\n\n-a always,exit -F arch=b32 -S adjtimex,settimeofday,stime\
  \ -F key=time-change\n-a always,exit -F arch=b64 -S adjtimex,settimeofday -F key=time-change\n\
  -a always,exit -F arch=b32 -S clock_settime -F a0=0x0 -F key=time-change\n-a always,exit\
  \ -F arch=b64 -S clock_settime -F a0=0x0 -F key=time-change\n```\n\n为了让 `Audit`\
  \ 识别这些规则的内容，只需将相应文件复制到 `/etc/audit/rules.d` 并重新加载配置，如下指令所示：\n\n```bash\n[root@pruebas\
  \ sample-rules]# cp 30-stig.rules /etc/audit/rules.d\n[root@pruebas sample-rules]#\
  \ augenrules --load\nNo rules\nenabled 1\nfailure 1\npid 1061\nrate_limit 0\nbacklog_limit\
  \ 8192\nlost 0\nbacklog 4\nbacklog_wait_time 60000\n--- salida omitida ---\n\n[root@pruebas\
  \ sample-rules]# auditctl -l\n-a always,exit -F arch=b32 -S stime,settimeofday,adjtimex\
  \ -F key=time-change\n-a always,exit -F arch=b64 -S adjtimex,settimeofday -F key=time-change\n\
  -a always,exit -F arch=b32 -S clock_settime -F a0=0x0 -F key=time-change\n-a always,exit\
  \ -F arch=b64 -S clock_settime -F a0=0x0 -F key=time-change\n-w /etc/localtime -p\
  \ wa -k time-change\n-w /etc/group -p wa -k identity\n-w /etc/passwd -p wa -k identity\n\
  -w /etc/gshadow -p wa -k identity\n-w /etc/shadow -p wa -k identity\n-w /etc/security/opasswd\
  \ -p wa -k identity\n-a always,exit -F arch=b32 -S sethostname,setdomainname -F\
  \ key=system-locale\n--- omited ---\n```\n\n# 使用 AUDIT 生成报告\n\n为了生成审计报告，`Audit`\
  \ 拥有 `aureport` 工具。`Aureport` 是一个从审计系统记录中生成摘要报告的工具。将显示不同类型的报告，让你让你对可以生成的报告类型有一个大致了解：\n\
  \n## 基于用户认证的报告\n\n```bash\n[root@pruebas ~]# aureport -au\n身份认证报告\n============================================\n\
  ### date time acct host term exe success event\n============================================\n\
  159\\. 03/03/21 11:37:22 fmestre pruebas.aptivalabs pts/0 /usr/bin/su yes 93\n160\\\
  . 03/03/21 11:41:10 curri pruebas.aptivalabs pts/0 /usr/bin/su yes 103\n161\\. 03/03/21\
  \ 11:41:10 root pruebas.aptivalabs pts/0 /usr/bin/su yes 103\n```\n\n## 系统报告\n\n\
  ```bash\n[root@pruebas ~]# date\nFri Mar 5 07:57:29 2021\n[root@pruebas ~]# systemctl\
  \ start httpd\n[root@pruebas ~]# aureport -e\n事件报告\n==================\n### date\
  \ time auid success\n==================\n13857\\. 03/05/21 07:58:13 root SERVICE_START\n\
