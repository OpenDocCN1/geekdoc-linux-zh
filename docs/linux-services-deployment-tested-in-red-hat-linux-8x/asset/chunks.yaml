    In the edition of the repository file `pgdg-redhat-all.repo` it is necessary to
    carry the field `enabled = 0` for those repositories of versions 12, 11 and 9.6
    of PostgreSQL, only the repository of version 10 must have `enabled = 1`; It shows
    how the repos should not be used:


    ```bash

    [root@bd2 yum.repos.d]# vim pgdg-redhat-all.repo


    [pgdg12]

    name=PostgreSQL 12 for RHEL/CentOS $releasever - $basearch

    baseurl=https://download.postgresql.org/pub/repos/yum/12/redhat/rhel-$releasever-$basearch

    enabled=0

    gpgcheck=1

    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-PGDG

    ```


