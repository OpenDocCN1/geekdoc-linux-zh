    \ in operation by listing the system processes:\n\n```\n[root@pruebas ~]# ps -fe\n\
    root     10798       1  0 09:03 ?        00:00:00 nginx: master process /usr/sbin/nginx\n\
    nginx      10799  10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx\
