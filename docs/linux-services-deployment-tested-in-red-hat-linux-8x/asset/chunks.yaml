    GALERA – MARIADB - SYNCHRONOUS REPLICATION


    Galera-MariaDB replication is based on the creation of a synchronous multimaster
    cluster which is composed of several MariaDB servers. The interface between Galera
    replication and a MariaDB database is defined by the Write Set Replication API
    (wsrep API).


    The main features of MariaDB Galera Cluster are:


    > •  Synchronous replication


    > •  Active-active multimaster topology'
