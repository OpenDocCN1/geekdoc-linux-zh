    # CONTAINERS IN RED HAT LINUX – PODMAN/SKOPEO


    A container is an isolated, running process that takes network resources and integrates
    with its integrated storage; some come to compare it with virtual machines because
    the objective is the same, however they are significantly far from being similar
    technologies.


    Container management in RHEL8 is done thanks to applications like `podman`, `skopeo`
    and `buildah`; the `podman` program is used to manage containers and images, the
    `skopeo` application inspects, copies, deletes and signs container images, and
    the `buildah` application is used to create new containers, all this represents
    the new way of they manage containers since in previous versions the tool for
    this management was made by Docker.


    The following exercise will allow us to install the container platform, download
    an image and then launch it as a container, manage that container and manage its
    image, the purpose of this is to contextualize the capacities for the individual
    handling of containers since the clustered and high management availability is
    given with platforms such as Kubernetes and Openshift; We start by listing the
    modules associated with the container platform:


    ```bash

    [root@bd1 ~]# yum module list --available container-tools

    ```


