    \ VERSION\n-rw-------. 1 root root 3.6G Feb 22 10:57 rear-s1.iso\n-rw-------.\
    \ 1 root root 967K Feb 22 10:57 rear-s1.log\n```\n\n\"rear\" 应用已生成了一个 ISO 文件，从该文件可以生成一个可启动的\
    \ USB 闪盘，或者根据需要将其放入虚拟化系统中。在本练习中，我们将使用虚拟化平台。\n\n![](img/Image00007.jpg) \n\n当从\
    \ ISO 启动时，会出现以下图像：\n\n![](img/Image00008.jpg)\n\n选择第一个选项，Linux 系统恢复过程开始，如下所示：\n\
    \n![](img/Image00009.jpg)\n\n如我们所示，系统要求“登录”（login），在此情况下输入 \"root\" 并按回车键。接下来我们看到提示输入命令，在此情况下命令将是\
    \ `rear -v recover`，这将触发操作系统的恢复，详细如下：\n\n![](img/Image00010.jpg)\n\n随后，需要等待恢复运行。一旦恢复程序完成，我们将看到类似下面的图像：\n\
    \n![](img/Image00011.jpg)\n\n在这里，系统返回给我们一个提示符，我们在其中发送 \"reboot\"重启）并启动恢复后的系统。需要说明的是，SELinux\
    \ 将对系统进行重新标记，这会在发生时稍微延迟过程。\n\n![](img/Image00012.jpg)\n\n一旦此过程完成，系统将重启并进入正常运行状态，与\
    \ `rear -v mkbackup` 生成时的状态完全相同。\n\n# 安装虚拟化能力 (KVM / VIRT-MANAGER)\n\n在接下来的材料中，你将看到如何将\
    \ RHEL 8 宿主机转换为功能强大的虚拟化层管理程序（hypervisor）。需要说明的是，`libvirt` 是实现所有虚拟化魔法的核心，正因为有它，诸如\
    \ `virsh`、`virt-manager`、`Cockpit` 和 `OVirt` 等工具才能发挥作用。\n\n从 Linux 内核 2.6 版本开始，虚拟化功能已经集成，无需安装新内核即可拥有这些能力。\n\
    \n下面的练习首先显示在宿主机处理器上进行预检，以确定是否在其上进行虚拟化；此处理器必须支持活动虚拟化标志，Intel 处理器的标志为 `vmx`，AMD\
    \ 处理器的标志为 `svm`。如果存在其中任何一个标志，就可以在宿主机上进行虚拟化。一旦验证了标志，我们继续进行 `libvirt` 的初始安装，然后继续安装\
    \ Hypervisor 和客户端功能，在本例中为 `virt-manager`。执行安装的步骤如下：\n\n```\n[root@pruebas ~]#\
    \ yum groupinfo Virtualization*\nUpdating Subscription Management repositories.\n\
    Last metadata expiration check: 0:12:38 ago on Sun 21 Mar 2021 12:13:24 PM.\n\
    Environment Group: Virtualization\nEnvironment Group: Virtualization: Minimal.\n\
    Environment Group: Virtualization: Standard.\nEnvironment Group: Virtualization:\
    \ Tools\nEnvironment Group: Virtualization: Hypervisor\n.\n```\n\n宿主机处理器的虚拟化标志检查：\n\
    \n```\n[root@pruebas ~]# cat /proc/cpuinfo | grep -i vmx|svm\n# (假设输出)\n```\n\n\
    另一种验证宿主机具有虚拟化能力的方法：\n\n```\n[root@pruebas ~]# virt-host-validate\nQEMU: Checking\
    \ for hardware-assisted virtualization : PASS\nQEMU: Checking if /dev/vhost-net\
    \ : PASS\nQEMU: Checking if /dev/net/tun : PASS\nQEMU: Checking for cgroup 'cpu'\
