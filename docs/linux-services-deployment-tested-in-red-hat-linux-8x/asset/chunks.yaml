    \     10801   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx  \
    \    10802   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx   \
    \   10803   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx    \
    \  10804   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx     \
    \ 10805   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx      10806\
    \   10798  0 09:03 ?        00:00:00 nginx: worker process\n```\n\nAt the end\
    \ of the procedure and to verify the start-up of the `nginx` web server, take\
    \ the IP address of the RHEL server and open the HTTP client of your choice on\
    \ a computer other than RHEL 8, you will see an image similar to the following:\n\
    \nThe `nginx` service uses the path `/usr/share/nginx/html` as the content publishing\
    \ directory, if you need to publish some type of content you can place your HTML\
    \ files there, as shown below:\n\n```\n[root@pruebas html]# pwd\n/usr/share/nginx/html\n\
    [root@pruebas html]# ll\ntotal 24\n-rw-r--r-- 1 root 3971 Aug 30 404.html\n-rw-r--r--\
    \ 1 root 4020 Aug 30 x.html\n-rw-r--r-- 1 root 5057 Aug 30 index.html\n-rw-r--r--\
    \ 1 root 368 Aug 30 nginx-logo.png\n-rw-r--r-- 1 root 4148 Aug 30 poweredby.png\n\
    ```\n\nTo configure the `nginx` service use the `/etc/nginx/nginx.conf` file:\n\
    \n```\n[root@pruebas ~]# ll /etc/nginx/nginx.conf\n-rw-r--r-- 1 root 2469 Aug\
    \ 30 /etc/nginx/nginx.conf\n```\n\n## VIRTUAL HOSTS IN NGINX\n\nOne of the great\
    \ benefits of using a web server, be it `Apache` or `Nginx`, is to be able to\
    \ configure different web sites within the same host; The procedure to be executed\
    \ is based on the traditional scheme of the vast majority of companies where I\
    \ have done consultancies a network with a Microsoft Windows Server performing\
    \ the functions of Active Directory and DNS, in this case with the direct zone\
    \ `aptivalabs.net` The DNS records `w1.aptivalabs.net`, `w2.aptivalabs.net` and\
    \ `w3.aptivalabs.net` pointing to host `192.168.1.201`. In this case, the host\
    \ `192.168.1.201` will host the different websites.\n\nThe procedure begins by\
    \ creating the folders that will host the html files:\n\n```\n[root@pruebas ~]#\
    \ mkdir /w1\n[root@pruebas ~]# mkdir /w2\n[root@pruebas ~]# mkdir /w3\n```\n\n\
    Next, the directories are created to host the logs based on the access to the\
    \ virtual hosts:\n\n```\n[root@pruebas ~]# mkdir /var/log/nginx/w1/\n[root@pruebas\
    \ ~]# mkdir /var/log/nginx/w2/\n[root@pruebas ~]# mkdir /var/log/nginx/w3/\n```\n\
    \nIt is necessary to change the SELinux policy for the directories that will host\
    \ the websites and apply it immediately to them:\n\n```\n[root@pruebas ~]# semanage\
    \ fcontext -a -t httpd_sys_content_t \"/w1(/.*)\"\n[root@pruebas ~]# semanage\
    \ fcontext -a -t httpd_sys_content_t \"/w2(/.*)\"\n[root@pruebas ~]# semanage\
    \ fcontext -a -t httpd_sys_content_t \"/w3(/.*)\"\n[root@pruebas ~]# restorecon\
    \ -Rv /w1\nRelabeled /w1 from unconfined_u:object_r:default_t:s0 to unconfined_u:object_r:httpd_sys_content_t:s0\n\
    [root@pruebas ~]# restorecon -Rv /w2\nRelabeled /w2 from unconfined_u:object_r:default_t:s0\
    \ to unconfined_u:object_r:httpd_sys_content_t:s0\n[root@pruebas ~]# restorecon\
    \ -Rv /w3\nRelabeled /w3 from unconfined_u:object_r:default_t:s0 to unconfined_u:object_r:httpd_sys_content_t:s0\n\
    ```\n\nBefore editing the `nginx` service configuration file, create a copy of\
    \ it:\n\n```\n[root@pruebas ~]# cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.ori\n\
    ```\n\nIn the `nginx` configuration file you will find a section like the one\
    \ shown:\n\nAdd the following content to the file `/etc/nginx/nginx.conf` as blocks\
    \ under the `server` section, which is shown below:\n\n```\n[root@pruebas ~]#\
    \ vim /etc/nginx/nginx.conf\nserver {\n    server_name w1.aptivalabs.net;\n  \
    \  root /w1;\n    access_log /var/log/nginx/w1/access.log;\n    error_log /var/log/nginx/w1/error.log;\n\
    }\nserver {\n    server_name w2.aptivalabs.net;\n    root /w2;\n    access_log\
    \ /var/log/nginx/w2/access.log;\n    error_log /var/log/nginx/w2/error.log;\n\
    }\nserver {\n    server_name w3.aptivalabs.net;\n    root /w3;\n    access_log\
    \ /var/log/nginx/w3/access.log;\n    error_log /var/log/nginx/w3/error.log;\n\
    }\n```\n\nRestart the `nginx` service:\n\n```\n[root@pruebas ~]# systemctl restart\
    \ nginx\n```\n\nNext, three (3) \"html\" files are created for each of the websites,\
    \ these will be the default pages to show once the clients make requests them:\n\
    \n```\n[root@pruebas ~]# echo \"<h1>Server 1</h1>\" > /w1/index.html\n[root@pruebas\
    \ ~]# echo \"<h1>Server 2</h1>\" > /w2/index.html\n[root@pruebas ~]# echo \"<h1>Server\
    \ 3</h1>\" > /w3/index.html\n```\n\nTo verify that the procedure has been effective,\
    \ please validate on your own server:\n\n```\n[root@pruebas ~]# curl w1.aptivalabs.net\n\
    [root@pruebas ~]# curl w2.aptivalabs.net\n[root@pruebas ~]# curl w3.aptivalabs.net\n\
    ```\n\n## REVERSE PROXY FOR HTTP TRAFFIC\n\nYou can configure the NGINX web server\
    \ to act as a reverse proxy for HTTP traffic. You can use this functionality to\
    \ forward requests to a remote server, the client assumes that it loads the content\
    \ from the host it accesses, however the `nginx` service loads the actual content\
    \ from the remote server and forwards it to the client.\n\nFor the example below,\
    \ there are two web servers running at 192.168.1.202 and 192.168.1.201; The exercise\
    \ consists in that if a user requests to see the content on the server 192.168.1.201/test,\
    \ this server will actually show the public content at the URL http://192.168.1.202/test.html.\
    \ In this sense, let's run the web server at 192.168.1.202 creating the file `test.html`:\n\
    \n```\n[root@ap2 ~]# cd /usr/share/nginx/\n[root@ap2 nginx]# ll\ntotal 0\ndrwxr-xr-x.\
    \ 2 root root  99 Mar 22 09:44 html\ndrwxr-xr-x. 2 root root 143 Mar 22 09:44\
    \ modules\n[root@ap2 nginx]# cd html/\n[root@ap2 html]# echo \"<h1>Contenido 1\
    \ en 192.168.1.202</h1>\" >> test.html\n[root@ap2 html]# echo \"<h1>Contenido\
    \ 2 en 192.168.1.202</h1>\" >> test.html\n[root@ap2 html]# echo \"<h1>Contenido\
    \ 3 en 192.168.1.202</h1>\" >> test.html\n```\n"
