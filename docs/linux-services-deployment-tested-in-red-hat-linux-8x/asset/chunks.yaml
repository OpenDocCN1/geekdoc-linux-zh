    `mariabackup` needs to be provided with the credentials of the user under which
    the backup will run. You can provide the credentials on the command line or through
    a configuration file before applying the procedure. To set the credentials using
    the configuration file, first create the file (for example, `/etc/my.cnf.d/mariabackup.cnf`),
    and then add the following lines in the `[xtrabackup]` or `[mysqld]` section of
    the new archive:


    ```ini

    [xtrabackup]

    user=root

    password=123456

    ```


    Next create the path where the backups will be saved:


    ```bash

    [root@sr1 ~]# mkdir /maria-backup

    ```


    Then run a physical backup of the database, as shown:


    ```bash

    [root@sr1 ~]# mariabackup --backup --target-dir /maria-backup/

    ```


