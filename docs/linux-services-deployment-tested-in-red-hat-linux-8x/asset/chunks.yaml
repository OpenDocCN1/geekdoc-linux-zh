- fmt: "\n- `distribution`: `rhel`\n- `version`: `8.3`\n- `eventLogger`: file\n- `hostname`:\
    \ `bd1.aptivalabs.net`\n\nWorking with containers requires the use of a registry\
    \ where the images that are later deployed as containers are stored, in this case\
    \ Red Hat provides the registry `registry.access.redhat.com` which you can use\
    \ using your login credentials. Red Hat portal, this registration is done as follows:\n\
    \n```\n[root@bd1 ~]# podman login registry.access.redhat.com\nUsername: your.user\n\
    Password:\nLogin Succeeded!\n```\n\nOnce registered you will be able to search\
    \ for container images, in this case we are interested in the image called `ubi8`,\
    \ as shown below:\n\n```bash\n[root@bd1 ~]# podman search registry.access.redhat.com/ubi8\
    \ | more\nINDEX       NAME                                               DESCRIPTION\
    \                                                              STARS OFFICIAL\
    \ A\nAUTOMATED\nredhat.com  registry.access.redhat.com/ubi8/ubi-minimal  Provides\
    \ the latest release of the Minimal R...  0\nredhat.com  registry.access.redhat.com/ubi8\
    \              The Universal Base Image is designed and eng...  0            \
    \    \nredhat.com  registry.access.redhat.com/ubi7/ubi            The Universal\
    \ Base Image is designed and eng...  0\nredhat.com  registry.access.redhat.com/ubi8/ubi-init\
    \     Provides the latest release of the Red Hat U...  0\nredhat.com  registry.access.redhat.com/ubi8-minimal\
    \      The Universal Base Image Minimal is a stripp...  0\nredhat.com  registry.access.redhat.com/ubi8-init\
    \       The Universal Base Image Init is designed to...  0\n```\n\nOnce the image\
    \ is identified, it is brought to the local environment with the `pull` parameter\
    \ of the `podman` command, as shown:\n\n```bash\n[root@bd1 ~]# podman pull registry.access.redhat.com/ubi8:latest\n\
    Trying to pull registry.access.redhat.com/ubi8:latest...\nGetting image source\n\
    Copying blob 13897c4ca57 done\nCopying blob 6460cc74f9c done\nCopying config 9992f1c61c\
    \ done\nWriting manifest to image\nStoring signatures\n9992f1c61c5fa38a691f80c7e13b75960b536a4ce854343b24623b68\n\
    ```\n\nOnce the image is downloaded, we can list it as:\n\n```bash\n[root@bd1\
    \ ~]# podman images\nREPOSITORY                     TAG       IMAGE ID       CREATED\
    \          SIZE\nregistry.access.redhat.com/ubi8  latest    9992f11c61c5   9 days\
    \ ago       213 MB\n```\n\nThe `skopeo` application is used to inspect the image\
    \ to be used:\n\n```bash\n[root@bd1 ~]# skopeo inspect docker://registry.access.redhat.com/ubi8:latest\
    \ | more\n{\n  \"Name\": \"registry.access.redhat.com/ubi8\",\n  \"Digest\": \"\
    sha256:17ff29c0747eade777e89868f97ba376b8b435ed2db504ff9277c1d1ca\",\n  \"RepoTags\"\
    : [\n    \"8.2-343-source\",\n    \"8.1-328\",\n    \"8.2-265-source\",\n    \"\
    8.2-347-source\",\n    \"8.2-299159281049\"\n]\n```\n\nAfter having carried out\
    \ the inspection, the container is displayed from the preferred image, obtaining\
    \ access to it through CLI, as shown in the following instruction:\n\n```bash\n\
    [root@bd1 ~]# podman run -it registry.access.redhat.com/ubi8:latest\n[root@f1103f0c82ed]#\n\
    [root@f1103f0c82ed]# exit\n```\n\nWith the container running, it is possible to\
    \ carry out the activities of stop, elimination, etc., in this case, the container\
    \ in execution is displayed and then eliminated and then re-listed in order to\
    \ validate that the container has been eliminated, as shown:\n\n```bash\n[root@bd1\
    \ ~]# podman ps --all\nCONTAINER ID   IMAGE                            COMMAND\
    \          CREATED           STATUS           NAMES\nf1103f0c82ed   registry.access.redhat.com/ubi8:latest\
    \  /bin/bash         A minute ago   Exited (127) 9 seconds ago   reverent_varahamira\n\
    ```\n\n```bash\n[root@bd1 ~]# podman rm -a\nf1103f0c82ed107c4b4a887d31eeb3b9b8a1727938971f2da3581bb7510db13\n\
    [root@bd1 ~]# podman ps --all\nCONTAINER ID   IMAGE COMMANDCREATED STATUS POR\
    \ NAMES\n```\n\nThe container image previously downloaded is listed below and\
    \ then deleted with the `rmi` subcommand of `podman`:\n\n```bash\n[root@bd1 ~]#\
    \ podman images\nREPOSITORY                     TAG       IMAGE ID       CREATED\
    \          SIZE\nregistry.access.redhat.com/ubi8/ubi  latest    9992f11c61c5 \
    \  9 days ago       213 MB\n[root@bd1 ~]# podman rmi registry.access.redhat.com/ubi8/ubi:latest\n\
    Untagged: registry.access.redhat.com/ubi8/ubi:latest\nDeleted: 9992f11c61c5a38a691f80c7e13b75960b536a4ce854343b24623b68\n\
    [root@bd1 ~]# podman images\nREPOSITORY TAG IMAGE ID CREATED SIZE\n```\n\nAs mentioned\
    \ in previous sections, Red Hat has left `Docker` as a platform for container\
    \ management and has brought other tools for this purpose, the decision is based\
    \ on providing better functionalities for those who manage platforms as well as\
    \ for those who develop on these platforms.\n\n# Deploying A FTP Server - SFTP\n\
    \nOne of the very common use cases in Linux administration is to do with transferring\
    \ files from a client to a server and vice versa. In this exercise we will install\
    \ the `vsftpd` software as an FTP server to obtain the aforementioned functionality,\
    \ which will listen to requests on port `21`, giving local users the ability to\
    \ connect and transfer files in any direction. We start by installing the `vsftpd`\
    \ software:\n\n```bash\n[root@s1 ~]# yum install vsftpd\n--- salida ---\nPreparing:\
    \ 1/1\nInstalling: vsftpd-3.0.3-33.el8.x86_64\nRunning script: vsftpd-3.0.3-33.el8.x86_64\n\
    Verifying: vsftpd-3.0.3-33.el8.x86_64 1/1\nInstalled products updated.\nvsftpd-3.0.3-33.el8.x86_64\n\
    Complete!\n```\n\nIt is necessary to review the configuration of the service configuration\
    \ file, which is where we can adjust the configuration at our discretion; the\
    \ configuration file is located in the path `/etc/vsftpd/vsftpd.conf`. The default\
    \ configuration defines restricted access for anonymous users but allows access\
    \ for local users, as shown:\n\n```conf\n# Allow anonymous FTP? (Beware - allowed\
    \ by default if you comment this out).\nanonymous_enable=NO\n# Uncomment this\
    \ to allow local users to log in.\nlocal_enable=YES\n```\n\nTaking advantage of\
    \ this initial configuration, a standard user will be created which will be able\
    \ to register in the system via FTP on port `21`, as shown below:\n\n```bash\n\
    [root@s1 vsftpd]# adduser fmestre\n[root@s1 vsftpd]# passwd fmestre\nChanging\
    \ password for user fmestre.\nNew password:\nBAD PASSWORD: The password is shorter\
    \ than 8 characters\nRetype new password:\npasswd: all authentication tokens updated\
    \ successfully.\n```\n\nOnce the user is created, we proceed to activate the service\
    \ at the start of the machine and start it immediately, reviewing the corresponding\
    \ process, as shown below:\n\n```bash\n[root@s1 ~]# systemctl enable --now vsftpd\n\
    [root@s1 ~]# ps -fe\nroot     52471      1  0 19:23 ?      00:00:00 /usr/sbin/vsftpd\
    \ /etc/vsftpd/vsftpd.conf\n```\n\nThen we activate the security settings associated\
    \ with SELinux and FirewallD, as follows:\n\n```bash\n[root@s1 ~]# setsebool -P\
    \ ftpd_full_access on\n[root@s1 ~]# firewall-cmd --add-service=ftp --permanent\n\
    [root@s1 ~]# firewall-cmd --reload\n[root@s1 ~]# firewall-cmd --info-zone=public\n\
    ```\n"
