    Once the Samba configuration file is successfully validated, the service is started
    and the service is activated to start the Linux server, as well as the FirewallD
    rule is established to allow receiving this type of requests:


    ```bash

    [root@sr1 ~]# systemctl enable smb

    [root@sr1 ~]# systemctl start smb

    [root@sr1 ~]# firewall-cmd --permanent --add-service=samba

    [root@sr1 ~]# firewall-cmd --reload

    ```


    ## SMB CLIENTS


    To access the services of this file server you can from a computer with Apple
    Mac Osx system make a connection from the “Finder” application, “Go / Connect
    to Server…” menu; this time we will register using the user "t1" previously created,
    as shown below:


