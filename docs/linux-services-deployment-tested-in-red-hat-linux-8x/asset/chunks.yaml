    ## RECOVERING ACCESS AS "root" USER


    Having to recover the password of the "root" user is an unfortunate event, but
    it does have a procedure defined for this purpose. Recovering the password of
    the "root" user is something easy to do when the system administrator is still
    "logged in" in the console or from any type of terminal; Different is the case
    when the system has not yet been entered and it is required to perform administration
    tasks.


    When GRUB2 prompts you to choose a kernel to start, you must stop the kernel startup
    process by defautl pressing any key on the keyboard; With the positioning keys
    ("arrows"), you will choose the kernel to execute, in this example `4.18.0-240.15.1`
    is chosen; Once chosen, press the letter `e`, as indicated in the menu below:


