    ```


    The persistent mount of the bucket is defined in `/etc/fstab` and verified, as
    shown below:


    ```bash

    [root@sr2 s3fs-fuse]# echo "s3fs#aptiva /mnt/aptiva fuse _netdev,rw,nosuid,nodev,allow_other,nonempty
    0 0" >> /etc/fstab

    [root@sr2 s3fs-fuse]# cat /etc/fstab

