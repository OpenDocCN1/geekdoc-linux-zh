    > ... Success!


    > Reloading the privilege tables will ensure that all changes made so far


    > will take effect immediately.


    > Reload privilege tables now? [Y/n] **Y**


    > ... Success!


    > Cleaning up...


    > All done!  If you''ve completed all of the above steps, your MariaDB


    > installation should now be secure.


    > Thanks for using MariaDB!


    CONFIGURATION FOR THE NETWORK


    To configure the MariaDB server for network connection, use the [mysqld] section
    of the /etc/my.cnf.d/mariadb-server.cnf file, where you can set the following
    configuration directives:


    *   > bind-address - Bind-address is the address where the server will listen.
    Possible options are: a host name, an IPv4 address, or an IPv6 address.


    *   > skip-networking - Possible values ​​are:


    > 0 - to listen to all clients


    > 1 - to hear only local clients


    *   > port - The port on which MariaDB listens for TCP / IP connections; the default
    port associated with this service is 3306 in tcp.


    A look at the configuration file could show us the following information:


    > [root@sr1 ~]# vim /etc/my.cnf.d/mariadb-server.cnf


    > ​ [mysqld]


    > ​ datadir=/var/lib/mysql


    > ​ socket=/var/lib/mysql/mysql.sock


    > ​ log-error=/var/log/mariadb/mariadb.log


    > ​ pid-file=/run/mariadb/mariadb.pid


    > ​ bind-address=0.0.0.0


    > ​ skip-networking=0


    > ​ port=3306


    If you have made any changes to this file and require it to be applied, remember
    that you must restart the service (bear in mind the implications that a restart
    of the service could have):


    > [root@sr1 ~]# systemctl restart mariadb.service


    CREATION OF DATABASE AND INSERTION OF RECORDS


    For demonstration purposes and taking advantage of the installation and assurance
    of the MariaDB database engine, the creation of a database and the insertion of
    records in MariaDB is detailed, as shown below:


    > **[root@sr1 ~]# mysql -u root -p**


    > Enter password:


    > Welcome to the MariaDB monitor.  Commands end with ; or \g.


    > Your MariaDB connection id is 8


    > Server version: 10.3.28-MariaDB MariaDB Server


    > Copyright (c) 2000, 2018, Oracle, MariaDB Corporation Ab and others.


    > Type ''help;'' or ''\h'' for help. Type ''\c'' to clear the current input statement.


    > MariaDB [(none)]>


    The following statement creates the database named "empresa":


    > MariaDB [(none)]> CREATE DATABASE empresa;


    > Query OK, 1 row affected (0.001 sec)


    The following instruction shows the databases that MAriaDB has:


    > MariaDB [(none)]> show databases;


    > +--------------------+


    > | Database           |


    > +--------------------+


    > | empresa            |


    > | information_schema |


    > | mysql              |


    > | performance_schema |


    > +--------------------+


    > 4 rows in set (0.001 sec)


    Once the “empresa” database has been created, we proceed to operate within it,
    as shown:


    > MariaDB [(none)]> use empresa


    > Reading table information for completion of table and column names


    > You can turn off this feature to get a quicker startup with -A


    > Database changed


    Next we create a table in MariaDB, which will be called "alumnos", just to introduce
    basic data:


    > MariaDB [empresa]> CREATE TABLE alumnos ( Id INT NOT NULL AUTO_INCREMENT, Nombre
    VARCHAR(100), Sexo INT, PRIMARY KEY(Id));


    > Query OK, 0 rows affected (0.009 sec)


    Once the table is created, we describe it, as shown below:


    > MariaDB [empresa]> desc alumnos ;


    > +--------+--------------+------+-----+---------+----------------+


    > | Field  | Type         | Null | Key | Default | Extra          |


    > +--------+--------------+------+-----+---------+----------------+


    > | Id     | int(11)      | NO   | PRI | NULL    | auto_increment |


    > | Nombre | varchar(100) | YES  |     | NULL    |                |


    > | Sexo   | int(11)      | YES  |     | NULL    |                |


    > +--------+--------------+------+-----+---------+----------------+


    > 3 rows in set (0.002 sec)


    We proceed to insert four (4) records in the “alumnos” table, listing them at
    the end, as shown:


    > MariaDB [empresa]> insert into alumnos (Nombre, Sexo) values (''Fabian Mestre'',1);


    > Query OK, 1 row affected (0.003 sec)


    > MariaDB [empresa]> insert into alumnos (Nombre, Sexo) values (''Juana Mestre'',0);


    > Query OK, 1 row affected (0.002 sec)


    > MariaDB [empresa]> insert into alumnos (Nombre, Sexo) values (''Carlos Perez'',1);


    > Query OK, 1 row affected (0.002 sec)


    > MariaDB [empresa]> insert into alumnos (Nombre, Sexo) values (''Camila Calderon'',0);


    > Query OK, 1 row affected (0.002 sec)


    > MariaDB [empresa]> select * from alumnos;


    > +----+-----------------+------+


    > | Id | Nombre          | Sexo |


    > +----+-----------------+------+


    > |  1 | Fabian Mestre   |    1 |


    > |  2 | Juana Mestre    |    0 |


    > |  3 | Carlos Perez    |    1 |


    > |  4 | Camila Calderon |    0 |


    > +----+-----------------+------+


    > 4 rows in set (0.000 sec)'
