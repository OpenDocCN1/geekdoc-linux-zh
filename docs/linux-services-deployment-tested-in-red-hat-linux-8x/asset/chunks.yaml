    ## DEFIN OF ACCESS TO THE DATABASES


    In the previous sections, PostgreSQL was installed in various ways, databases
    were created, dumps were made, a restore was performed, and the database engine
    was installed using a secondary file system, however, the database data is closed
    to your customers, which needs to be changed so that the engine can receive requests
    and perform transactions.


    In this sense, we will first check FirewallD to verify that the default zone is
    allowing the entry of requests, as shown below:


    ```bash

    [root@bd2 pgsql-data]# firewall-cmd --list-all

    public (active)

    target: default

    icmp-block-inversion: no

    interfaces: ens18

    sources:

    services: cockpit dhcpv6-client postgresql ssh

    ports:

    protocols:

    masquerade: no

    forward-ports:

    source-ports:

    icmp-blocks:

    rich rules:

    ```

