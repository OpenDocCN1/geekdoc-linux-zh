    nginx-mod-http-image-filter-1:1.14.1-9.module+el8.0.0+4108+af250afe.x86_64\nnginx-mod-http-perl-1:1.14.1-9.module+el8.0.0+4108+af250afe.x86_64\n\
    nginx-mod-http-xslt-filter-1:1.14.1-9.module+el8.0.0+4108+af250afe.x86_64\nnginx-mod-mail-1:1.14.1-9.module+el8.0.0+4108+af250afe.x86_64\n\
    nginx-mod-stream-1:1.14.1-9.module+el8.0.0+4108+af250afe.x86_64\n```\n\n有在 `FirewallD`\
    \ 中打开端口以接收连接请求：\n\n```\n[root@pruebas ~]# firewall-cmd --permanent --add-service=http\n\
    success\n[root@pruebas ~]# firewall-cmd --reload\nsuccess\n```\n\n在系统启动时启用 `nginx`\
    \ 服务并立即运行它：\n\n```\n[root@pruebas ~]# systemctl enable nginx --now\nCreated symlink\
    \ /etc/systemd/system/multi-user.target.wants/nginx.service → /usr/lib/systemd/system/nginx.service.\n\
    ```\n\n通过列出系统进程来验证 `nginx` 服务的运行：\n\n```\n[root@pruebas ~]# ps -fe\nroot     10798\
    \       1  0 09:03 ?        00:00:00 nginx: master process /usr/sbin/nginx\nnginx\
    \      10799  10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx  \
    \    10800   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx   \
    \   10801   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx    \
    \  10802   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx     \
    \ 10803   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx      10804\
    \   10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx      10805 \
    \  10798  0 09:03 ?        00:00:00 nginx: worker process\nnginx      10806  \
    \ 10798  0 09:03 ?        00:00:00 nginx: worker process\n```\n\n在操作结束，为了验证 `nginx`\
    \ Web 服务器的启动，请获取 RHEL 服务器的 IP 地址，并在 RHEL 8 以外的计算机上打开您选择的 HTTP 客户端，您将看到类似下面的图像：\n\
    \n`nginx` 服务使用路径 `/usr/share/nginx/html` 作为内容发布目录，如果您需要发布某些类型的内容，可以将您的 HTML 文件放置在那里，如下所示：\n\
    \n```\n[root@pruebas html]# pwd\n/usr/share/nginx/html\n[root@pruebas html]# ll\n\
    total 24\n-rw-r--r-- 1 root 3971 Aug 30 404.html\n-rw-r--r-- 1 root 4020 Aug 30\
    \ x.html\n-rw-r--r-- 1 root 5057 Aug 30 index.html\n-rw-r--r-- 1 root 368 Aug\
    \ 30 nginx-logo.png\n-rw-r--r-- 1 root 4148 Aug 30 poweredby.png\n```\n\n配置 `nginx`\
    \ 服务请使用 `/etc/nginx/nginx.conf` 文件：\n\n```\n[root@pruebas ~]# ll /etc/nginx/nginx.conf\n\
    -rw-r--r-- 1 root 2469 Aug 30 /etc/nginx/nginx.conf\n```\n\n## NGINX 中的虚拟主机\n\n\
    使用 Web 服务器（无论是 `Apache` 还是 `Nginx`）的巨大优势之一是在同一主机上配置不同的网站；该操作基于大多数公司使用 Windows\
    \ 服务器执行活动目录和 DNS 功能的传统方案，在这种情况下，DNS 记录 `w1.aptivalabs.net`、`w2.aptivalabs.net`\
    \ 和 `w3.aptivalabs.net` 指向主机 `192.168.1.201`。在 `Nginx` 中情况下，该主机将托管不同的网站。\n\n该过程从创建托管\
    \ html 文件的文件夹开始：\n\n```\n[root@pruebas ~]# mkdir /w1\n[root@pruebas ~]# mkdir\
    \ /w2\n[root@pruebas ~]# mkdir /w3\n```\n\n接下来，创建用于托管虚拟主机日志的目录：\n\n```\n[root@pruebas\
    \ ~]# mkdir /var/log/nginx/w1/\n[root@pruebas ~]# mkdir /var/log/nginx/w2/\n[root@pruebas\
    \ ~]# mkdir /var/log/nginx/w3/\n```\n\n有必要更改托管网站目录的 SELinux 策略并立即生效：\n\n```\n\
    [root@pruebas ~]# semanage fcontext -a -t httpd_content_t \"/w1(/.*)\"\n[root@pruebas\
    \ ~]# semanage fcontext -a -t httpd_content_t \"/w2(/.*)\"\n[root@pruebas ~]#\
    \ semanage fcontext -a -t httpd_content_t \"/w3(/.*)\"\n[root@pruebas ~]# restorecon\
    \ -Rv /w1\nRelabeled /w1 from unconfined_u:object_r:default_t:s0 to unconfined_u:object_r:httpd_content_t:s0\n\
    [root@pruebas ~]# restorecon -Rv /w2\nRelabeled /w2 from unconfined_u:object_r:default_t:s0\
    \ to unconfined_u:object_r:httpd_content_t:s0\n[root@pruebas ~]# restorecon -Rv\
    \ /w3\nRelabeled /w3 from unconfined_u:object_r:default_t:s0 to unconfined_u:object_r:httpd_content_t:s0\n\
    ```\n\n在编辑 `nginx` 服务配置文件之前，先创建一个副本：\n\n```\n[root@pruebas ~]# cp /etc/nginx/nginx.conf\
    \ /etc/nginx/nginx.conf.ori\n```\n\n在 `nginx` 文件中您将找到一个如下所示的部分：\n\n将以下内容添加到 `/etc/nginx/nginx.conf`\
    \ 文件的 `server` 块中，如下所示：\n\n```\n[root@pruebas ~]# vim /etc/nginx/nginx.conf\n\
    server {\n    server_name w1.aptivalabs.net;\n    root /w1;\n    access_log /var/log/nginx/w1/access.log;\n\
    \    error_log /var/log/nginx/w1/error.log;\n}\nserver {\n    server_name w2.aptivalabs.net;\n\
    \    root /w2;\n    access_log /var/log/nginx/w2/access.log;\n    error_log /var/log/nginx/w2/error.log;\n\
    }\nserver {\n    server_name w3.aptivalabs.net;\n    root /w3;\n    access_log\
    \ /var/log/nginx/w3/access.log;\n    error_log /var/log/nginx/w3/error.log;\n\
    }\n```\n\n重启 `nginx` 服务：\n\n```\n[root@pruebas ~]# systemctl restart nginx\n```\n\
    \n接下来，为每个网站创建三个 (3) 个 \"html\" 文件，这些将是客户端请求它们时显示的默认页面：\n\n```\n[root@pruebas ~]#\
    \ echo \"<h1>Server 1</h1>\" > /w1/index.html\n[root@pruebas ~]# echo \"<h1>Server\
    \ 2</h1>\" > /w2/index.html\n[root@pruebas ~]# echo \"<h1>Server 3</h1>\" > /w3/index.html\n\
    ```\n\n为了验证该操作是否有效，请在您自己的服务器上进行验证：\n\n```\n[root@pruebas ~]# curl w1.aptivalabs.net\n\
    [root@pruebas ~]# curl w2.aptivalabs.net\n[root@pruebas ~]# curl w3.aptivalabs.net\n\
    ```\n\n## HTTP 流量的反向代理\n\n您可以配置 NGINX Web 服务器作为 HTTP 流量的反向代理。您可以使用此功能将请求转发到远程服务器，客户端假定它正在从所访问的主机加载内容，但\
    \ `nginx` 服务从远程服务器加载实际内容并将其转发给客户端。\n\n"
- fmt: "\nThe `192.168.1.202` server is verified to be publishing the resource `(test.html)`,\
    \ as follows:\n\n![](Image00026.jpg)\n\nNext, on the server `192.168.1.201`, we\
    \ edit the `nginx` configuration file to add the following lines:\n\n```bash\n\
    [root@pruebas html]# vim /etc/nginx/nginx.conf\n\nlocation /test {\n    proxy_pass\
    \ http://192.168.1.202/test.html;\n}\n```\n\nIn the `nginx` configuration file,\
    \ the configuration block should look like this:\n\n```nginx\nserver {\n    listen\
    \       80 default_server;\n    listen       [::]:80 default_server;\n    server_name\
    \  _;\n    root         /usr/share/nginx/html;\n    # Load configuration files\
    \ for the default server block.\n    include /etc/nginx/default.d/*.conf;\n  \
    \  #location / {\n    #}\n    location /test {\n    proxy_pass http://192.168.1.202/test.html;\n\
    \    }\n    error_page 404 /404.html;\n    location = /40x.html {\n    }\n   \
    \ error_page 500 502 503 504 /50x.html;\n    location = /50x.html {\n    }\n}\n\
    ```\n\nNext, the Boolean variable `httpd_can_network_connect` is enabled in SELinux\
    \ and the service is launched again:\n\n```bash\n[root@pruebas html]# setsebool\
    \ -P httpd_can_network_connect 1\n[root@pruebas html]# systemctl restart nginx.service\n\
    ```\n\nTo confirm this setting on an HTTP client make a request at `http://192.168.1.201/test`,\
    \ as shown below:\n\n![](Image00027.jpg)\n\nWith the exercise previously developed,\
    \ in one way or another the server that actually gives the answer to the client\
    \ has been hidden, this being `192.168.1.202`; Users go to the `192.168.1.201`\
    \ web server to look for answers and it displays the content of another web server.\n\
    \n# HTTP LOAD BALANCER WITH NGINX\n\nThis procedure describes the configuration\
    \ of the `NGINX` service as an HTTP load balancer that sends requests to different\
    \ servers, depending on which one has the least number of active connections,\
    \ that is, it is about determining which of the servers within the balancing group\
    \ has better health to send you http requests. It is a useful scenario when handling\
    \ web applications within a company and it is necessary to have at least a high\
    \ availability scenario for that application.\n\nTo develop this functionality\
    \ there is the following group of servers:\n\n* `192.168.1.201` = load balancer\n\
    * `192.168.1.202` = server\n* `192.168.1.203` = server\n\nIn order to validate\
    \ that the balancer is actually doing its job, on servers `192.168.1.202` and\
    \ `192.168.1.203` (with the `nginx` service running) change the default index\
    \ page (`index.html`), as shown below:\n\n```bash\n[root@sr2 ~]# cd /usr/share/nginx/html/\n\
    [root@sr2 html]# mv index.html index.html.ori\n[root@sr2 html]# echo \"<h1>soy\
    \ 192.168.1.202</h1>\" >> index.html\n```\n\nThe same instructions are executed\
    \ on the `192.168.1.203` server:\n\n```bash\n[root@sr3 ~]# cd /usr/share/nginx/html/\n\
    [root@sr3 html]# mv index.html index.html.ori\n[root@sr3 html]# echo \"<h1>soy\
    \ 192.168.1.203</h1>\" >> index.html\n```\n\nOn the server that will be doing\
    \ load balancing, the configuration file for `nginx` should look like this:\n\n\
    ```nginx\nhttp {\n    log_format  main  '$remote_addr - $remote_user [$time_local]\
    \ \"$request\" '\n    '$status $body_bytes_sent \"$http_referer\" '\n    '\"$http_user_agent\"\
    \ \"$http_x_forwarded_for\"';\n    access_log  /var/log/nginx/access.log  main;\n\
    \    sendfile            on;\n    tcp_nopush          on;\n    tcp_nodelay   \
    \      on;\n    keepalive_timeout   65;\n    types_hash_max_size 2048;\n    include\
    \             /etc/nginx/mime.types;\n    default_type        application/octet-stream;\n\
    \    # Load modular configuration files from the /etc/nginx/conf.d.\n    # See\
    \ http://nginx.org/en/docs/ngx_core_module.html\n    # for more information.\n\
    \    include /etc/nginx/conf.d/*.conf;\n    upstream loadbalancer.aptivalabs.net\
    \ {\n        least_conn;\n        server 192.168.1.202;\n        server 192.168.1.203;\n\
    \    }\n    server {\n        listen       80 default_server;\n        listen\
    \       [::]:80 default_server;\n        server_name  _;\n        root       \
    \  /usr/share/nginx/html;\n        # Load configuration files for the default\
    \ server.\n        include /etc/nginx/default.d/*.conf;\n        #location / {\n\
    \        location / {\n            proxy_pass http://loadbalancer.aptivalabs.net;\n\
    \        }\n        error_page 404 /404.html;\n        location = /40x.html {\n\
    \        }\n        error_page 500 502 503 504 /50x.html;\n        location =\
    \ /50x.html {\n        }\n    }\n    # Settings for a TLS enabled server.\n  \
    \  # server {\n    #    listen        443 ssl default_server;\n    #    listen\
    \       [::]:443 ssl default_server;\n    #    server_name  _;\n    #    root\
    \         /usr/share/nginx/html;\n    #    ssl_certificate \"/etc/pki/nginx/server.crt\"\
    ;\n    #    ssl_certificate_key \"/etc/pki/nginx/private/server.key\";\n    #\
    \    ssl_session_cache shared:SSL:1m;\n    #    ssl_session_timeout 10m;\n   \
    \ #    ssl_ciphers PROFILE=SYSTEM;\n    #    ssl_prefer_server_ciphers on;\n \
    \   #    # Load configuration files for the default server.\n    #    include\
    \ /etc/nginx/default.d/*.conf;\n    #    location / {\n    #    }\n    #    error_page\
    \ 404 /404.html;\n    #    location = /40x.html {\n    #    }\n    #    error_page\
    \ 500 502 503 504 /50x.html;\n    #    location = /50x.html {\n    #    }\n  \
    \  # }\n}\n```\n\nThe lines `upstream` and `location` can then be highlighted\
    \ from the content of the file, which indicate that at the moment that any user\
    \ who tries to reach `http://loadbalancer.aptivalabs.net` (DNS record previously\
    \ configured pointing to `192.168.1.201`), the ip `192.168.1.201` will balance\
    \ the load of requests it receives; the lines are related:\n\n```nginx\nupstream\
    \ loadbalancer.aptivalabs.net {\n    least_conn;\n    server 192.168.1.202;\n\
    \    server 192.168.1.203;\n}\nlocation / {\n    proxy_pass http://loadbalancer.aptivalabs.net;\n\
    }\n```\n\nOne way to validate this configuration is by using the `curl` application,\
    \ as shown below:\n\n```bash\n[root@sr1 ~]# curl http://loadbalancer.aptivalabs.net\n\
    <h1>soy 192.168.1.202</h1>\n[root@sr1 ~]# curl http://loadbalancer.aptivalabs.net\n\
    <h1>soy 192.168.1.203</h1>\n[root@sr1 ~]# curl http://loadbalancer.aptivalabs.net\n\
    <h1>soy 192.168.1.202</h1>\n[root@sr1 ~]# curl http://loadbalancer.aptivalabs.net\n\
    <h1>soy 192.168.1.203</h1>\n[root@sr1 ~]# curl http://loadbalancer.aptivalabs.net\n\
    <h1>soy 192.168.1.202</h1>\n```\n\nIt can then be seen that by requesting the\
    \ URL `http://loadbalancer.aptivalabs.net` with the command `curl` the `nginx`\
    \ service always shows a different page. For a better visualization you could\
    \ use any HTTP client.\n\n# ENCRYPTING COMMUNICATION WITH TLS\n\n`TLS` (Transport\
    \ Layer Security) is an encryption method for network communications and is the\
    \ successor to `SSL` (Secure Socket Layer). `TLS` allows the client to verify\
    \ the identity of the server and the server to verify the identity of the client.\n\
    \nFeatures:\n\n* `TLS` is based on the concept of certificates.\n* A certificate\
    \ has multiple parts: public key, server identity and a signature of an authority\
    \ certificate.\n* The corresponding private key is never made public.\n* Any data\
    \ encrypted with a private key can only be decrypted with a public key and vice\
    \ versa.\n\nThe stages of communication involve the development of various activities;\
    \ the client and the server agree on the encryption rules supported by both and\
    \ exchange random bits of data. The client uses this data to generate a session\
    \ key, a key that will be used for faster symmetric encryption, where the same\
    \ key is used for encryption and decryption. To ensure that this key is not compromised,\
    \ it is sent to the server encrypted with the server's public key.\n\nThe certificates\
    \ necessary to encrypt the communication are generated below, as shown:\n\n```bash\n\
    [root@loadbalancer ~]# openssl req -x509 -out localhost.crt -keyout localhost.key\
    \ -newkey rsa:2048 -nodes -sha256 -subj '/CN=localhost' -extensions EXT -config\
    \ <( \\\nprintf \"[dn]\\nCN=localhost\\n[req]\\ndistinguished_name = dn\\n[EXT]\\\
    nsubjectAltName=DNS:localhost\\nkeyUsage=digitalSignature\\nextendedKeyUsage=serverAuth\"\
    )\n```\n"
