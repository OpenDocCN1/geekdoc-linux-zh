    然后激活与 SELinux 和 FirewallD 相关的安全设置，如下：\n\n```bash\n[root@s1 ~]# setsebool -P ftpd_full_access\
    \ on\n[root@s1 ~]# firewall-cmd --add-service=ftp --permanent\n[root@s1 ~]# firewall-cmd\
    \ --reload\n[root@s1 ~]# firewall-cmd --info-zone=public\n```\n\n"
