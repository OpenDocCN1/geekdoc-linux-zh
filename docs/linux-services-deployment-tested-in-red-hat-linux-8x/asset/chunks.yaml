    ```


    Audit provides a way to record relevant information from the system. Based on
    preconfigured rules, Audit generates log entries to record as much information
    as possible about the events that are happening on your system. This information
    is crucial in mission critical environments to identify security policy violators
    and the actions they took on the system. The following list summarizes some of
    the information that Audit is able to record in the log files:


    - Date and time, type and result of an event.

    - Association of an event with the identity of the user who triggered the event.

    - All modifications to the Audit configuration and attempts to access `/var/log/audit/audit.log`.

    - All uses of authentication mechanisms, such as SSH, Kerberos, and others.

    - Changes to any trusted database, such as `/etc/passwd`.

    - You try to import or export information to or from the system.

    - Include or exclude events based on user identity and other attributes.


    Audit consists of two main parts: the applications and utilities in the user space,
    and on the kernel side, the processing of system calls. The kernel component receives
    system calls from applications in user space and filters them through one of the
    following filters: user, task, fstype, or exit.


    By default, Audit stores the log entries in the `/var/log/audit/audit.log` file;
    if the rotation is activity in the configuration file, the rotated audit.log files
    are stored in the same directory.


    ## AUD RULES WITH AUDIT


    For the establishment of rules, Audit uses the command `auditctl`, let''s look
    at an example:


    ```bash

    [root@pruebas ~]# auditctl -w /etc/ssh/sshd_config -p warx -k sshd_config

    ```


    The previous instruction uses certain parameters of the `auditctl` command, which
    are explained below:


    - `-w` indicates the file or directory to be audited

    - `-p` indicates the actions to be audited on the audit object (`w-write`, `r-read`,
    `x-execute` and change attributes)

    - `-k` indicates a keyword for the results report


    We will try to see the content of this file from a standard user, in this case
    the user "fmestre"; If the Audit service is running, in `/var/log/audit/audit.log`
    we must observe the record that the user “fmestre” tried to read the contents
    of the file; let''s see:


    ```bash

    [root@pruebas ~]# su - fmestre

    [fmestre@pruebas ~]$ cat /etc/ssh/sshd_config

    cat: /etc/ssh/sshd_config: Permission denied

    ```


    This audit event should generate four (4) records in the log file, as shown below:


    ```bash

    [root@pruebas ~]# tail -n 4 /var/log/audit/audit.log

    type=SYSCALL msg=audit(1614886599.538:116): arch=c000003e syscall=257 success=no
    exit=-13 a0=ffffff9c a1=7ffce1e84647 a2=0 a3=0 items=1 ppid=2622 pid=2668 auid=0
    uid=1000 gid=1000 euid=1000 suid=1000 fsuid=1000 egid=1000 sgid=1000 tty=pts1
    ses=3 comm="cat" exe="/usr/bin/cat" subj=unconfined:unconfined_r:unconfined:s0:c0.ARCH=x86_64
    SYSCALL=open AUID="root" UID="fmestre" GID="fmestre" EUID="fmestre" FSUID="fmestre"
    EGID="fmestre" SGID="fmestre" FSGID="fmestre"

    type=CWD msg=audit(1614886599.538:116): cwd="/home/fmestre"

    type=PATH msg=audit(1614886599.538:116): item=0 name="/etc/ssh/sshd_config" inode=199361
    dev=fd:0 mode=0100600 ouid=0 ogid=0 rdev=0:00 obj=system_u:object_r:etc_t:s0 nametype=NORMAL
    cap_fp=0 cap_fi=0 cap_fe=0 cap_ver=0 OID="root" OGID="root"

    type=PROCTITLE msg=audit(1614886599.538:116): proctitle=636174002F6574632F7373682F73736864F

    ```


    The above event consists of four records, which share the same timestamp (unixtime
    format) and serial number. Records always start with the keyword `type=`. Each
    record consists of multiple `name=` value pairs separated by a blank space or
    a comma, such as the line `type=CWD msg=audit(1614886599.538:116): cwd="/home/fmestre"`.


    On the website unixtestamp.com you can convert this timestamp to a human readable
    format, showing you a result like the following:


    - `type=SYSCALL`: In this example, the `SYSCALL` value specifies that this record
    was generated by a syscall to the kernel.

    - `type=CWD`: This type is used to record the working directory from which the
    process invoked the specified system call in which the first record was executed.

    - `type=PATH`: An audit event contains a `PATH` record for each path that is passed
    to the syscall as an argument. In this audit event, only one path (`/etc/ssh/sshd_config`)
    was used as an argument.

    - `type=PROCTITLE`: The `PROCTITLE` value provides the command that triggered
    this audit event, this number is in hexadecimal. A look at this command could
    expand the report a bit more:


    ```bash

    [root@pruebas ~]# ausearch -i | grep PROCTITLE

    ---

    type=PROCTITLE msg=audit(03/04/21 14:36:39.538:116): proctitle=cat /etc/ssh/sshd_config

    ```


    We can see that the command that generated the security event was `cat /etc/ssh/sshd_config`.


    You could create various audit rules on important files on your file system, as
    well as rules based on auditing system calls by applications, how you use Audit
    depends on the scenario you want to contemplate. Some example rules could be the
    following:


    ```bash

    [root@pruebas ~]# auditctl -w /etc/passwd -p wa -k passwd_changes

    [root@pruebas ~]# auditctl -w /etc/selinux/ -p wa -k selinux_changes

    [root@pruebas ~]# auditctl -a always,exit -F arch=b64 -S adjtimex -S settimeofday
    -k time_change

    ```


    The last statement tells Audit to raise an audit event every time an application
    uses the system calls `adjtimex` and `settimeofday` on systems that use 64-bit
    architectures. To list the rules uploaded to Audit you could send the following
    instruction:


    ```bash

    [root@pruebas ~]# auditctl -l

    -w /etc/passwd -p wa -k passwd_changes

    ```


    To delete a temporary rule made with `Auditid` look at the following instructions:


    ```bash

    [root@pruebas ~]# auditctl -l

    -w /etc/passwd -p wa -k passwd_changes

    [root@pruebas ~]# auditctl -W /etc/passwd -p wa -k passwd_changes

    [root@pruebas ~]# auditctl -l

    No rules

    ```


    In the previous statement, the parameter `-W` was used to stop looking at the
    `/etc/passwd` file.


    ## PERSISTENT AUDIT RULES


    If you require that the rules established for Audit be persistent, you must insert
    them into the `/etc/audit/rules.d/audit.rules` file, the location shown as follows:


    ```bash

    [root@pruebas rules.d]# pwd

    /etc/audit/rules.d

    [root@pruebas rules.d]# ll

    total 4

    -rw-------. 1 root root 244 Dec 17 17:11 audit.rules

    ```


    A look at the file `audit.rules` shows us some persistent rules:


    ```bash

    [root@pruebas rules.d]# cat audit.rules

    --- salida omitida ---

    ## Set failure mode to syslog

    -f 1

    ```

