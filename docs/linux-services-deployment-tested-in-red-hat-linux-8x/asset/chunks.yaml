    INSTALLING POSTGRESQL IN A SECUNDARY FILESYSTEM


    In the following exercise PostgreSQL will be installed using a different path
    for data storage, the default path for creating the PostgreSQL cluster is /var/lib/pgsql
    data, the path that will be used in this exercise is /pgsql-data; For the development
