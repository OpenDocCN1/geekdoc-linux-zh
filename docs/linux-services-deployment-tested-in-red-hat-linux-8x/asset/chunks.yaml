    For the purposes of publishing knowledge, the way in which a database is eliminated
    is listed below, however, if you are doing the labs and exercises proposed, we
    recommend not deleting the previously created database, so that you can continue
    doing the exercises:


    ```sql

    MariaDB [empresa]> DROP DATABASE empresa;

    Query OK, 2 rows affected (0.019 sec)


    MariaDB [(none)]> show databases;

    +--------------------+

    | Database           |

    +--------------------+

    | information_schema |

    | mysql               |

    | performance_schema |

    +--------------------+

    3 rows in set (0.001 sec)

    ```


    # BACKUP MANAGEMENT


    There are two main ways to back up data in a MariaDB database:


    * Logical backup

    * Physical backup


    **Logical backup** consists of the SQL statements required to restore the data.
    This type of backup exports the information and logs in plain text files. The
    main advantage of logical backup over physical is portability and flexibility.
    Data can be restored to other hardware configurations, versions of MariaDB, or
    database management system (DBMS), which is not possible with physical backups.
    Note that logical backup can be done if the service `mariadb.service` is running.
    Logical backup does not include log and configuration files.


    **Physical backup** consists of copies of files and directories that store content.
    Physical backup has the following advantages compared to logical backup:


    * The outlet is more compact.

    * The backup is smaller.

    * Backup and restore are faster.

    * The backup includes configuration and log files.


    Note that the physical backup should be done when the service `mariadb.service`
    is not running or all the database tables are locked to prevent changes during
    the backup.


    You can use one of the following MariaDB backup approaches to back up the data
    from a MariaDB database:


    * Logical backup with `mysqldump`

    * Online physical backup with `Mariabackup` tool

    * File system backup

    * Replication as a backup solution


    The `mysqldump` client is a backup utility, which can be used to dump a database
    or a collection of databases for backup or transfer to another database server.
    The output of `mysqldump` usually consists of SQL statements to recreate the structure
    of the server tables, fill them with data, or both. As an alternative, `mysqldump`
    can also generate files in other formats, including CSV or other delimited text
    formats, and XML.


    To perform backups with `mysqldump`, you can use one of the following options:


    * Backup of a selected database

    * Backup of a subset of tables in a database


    # LOGIC BACKUP AND RESTORATION


    To back up a full database, run the following:


    ```bash

    [root@sr1 ~]# mysqldump empresa > /root/backup-empresa.sql -p

    Enter password:

    [root@sr1 ~]# ll

    total 36

    -rw-r--r--. 1 root root  2026 Jul 29 10:51 backup-empresa.sql

    ```


    You can take a look at the resulting backup file, as shown below:


    ```sql

    [root@sr1 ~]# more backup-empresa.sql

    -- MySQL dump 10.19  Distrib 10.3.28-MariaDB, for Linux (x86_64)

    --

    -- Host: localhost    Database: empresa

    -- ------------------------------------------------------

    -- Server version ​ 10.3.28-MariaDB

    /*!40101 SET @OLD_CHARACTER_SET_CLIENT=@@CHARACTER_SET_CLIENT */;

    /*!40101 SET @OLD_CHARACTER_SET_RESULTS=@@CHARACTER_SET_RESULTS */;

    /*!40101 SET @OLD_COLLATION_CONNECTION=@@COLLATION_CONNECTION */;

