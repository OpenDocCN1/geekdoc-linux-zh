    # POSTGRESQL - 流式复制


    流式复制（SR）提供了将 WAL XLOG 日志连续发送并应用到多个备用服务器的能力，以保持它们更新。该功能是在 PostgreSQL 9.0 中添加的。


    演示在两台服务器上进行：`192.168.0.38` (sr1) 作为主服务器，而另一台服务器 `192.168.0.39` (sr2) 是相应复制发生的地方。


    在服务器 `sr1` 上安装并加了 PostgreSQL（默认流为 10）：


    ```bash

