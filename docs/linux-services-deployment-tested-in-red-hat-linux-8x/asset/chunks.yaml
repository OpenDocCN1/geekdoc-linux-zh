    ## Testing Replication


    To test replication, on node `sr3` we will create a database which must be replicated
    in each node. Start by creating the database:


    ```bash

    root@sr3 ~]# mysql -u root -p

    Enter password:

    ```


    We select the created database and create a table called `alumnos`:


    ```sql

    MariaDB [(none)]> CREATE DATABASE empresa;

    Query OK, 1 row affected (0.007 sec)

    MariaDB [(none)]> use empresa;

