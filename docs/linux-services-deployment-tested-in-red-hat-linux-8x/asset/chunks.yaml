    ## RED HAT LINUX AS A WINDOWS SERVER MEMBER DOMAIN


    From RHEL 8 the tools are provided to generate an integration with Microsoft Windows
    Server and its Active Directory; having this integration allows to offer domain
    users some of the following features:


    * Authenticate domain users to local services, such as `sshd`

    * Share directories and printers hosted on the Linux server so that domain users
    can access these resources.


    However, before enjoying these privileges, it is necessary to introduce the RHEL
    server into the Windows Server domain, the procedure begins by declaring the update
    of the cryptographic policies, as shown below:


    ```bash

    [root@loadbalancer ~]# update-crypto-policies --set DEFAULT:AD-SUPPORT

    Setting system policy to DEFAULT:AD-SUPPORT

    Note: System-wide crypto policies are applied on application start-up.

    It is recommended to restart the system for the change of policies to fully take
    place.

    ```


    This update requests a "reboot" of the system:


    ```bash

    [root@loadbalancer ~]# systemctl reboot

    ```


