    Install  1 Package

    Total download size: 344 k

    Installed size: 908 k

    Is this ok [y/N]: y

    ```


    AWS through the identity management service allows you to generate access credentials
    to register with AWS and be able to use its services. For the development of this
    exercise, a test credential is used which must be saved in the file `/etc/passwd-s3fs`
    in the format described below:

