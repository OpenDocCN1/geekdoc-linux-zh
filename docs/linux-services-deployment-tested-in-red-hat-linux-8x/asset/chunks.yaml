  trans: "\n\n`192.168.1.202` 服务器已验证正在发布资源 `(test.html)`，如下所示：\n\n![](img/Image00026.jpg)\n\
    \n接下来，在服务器 `192.168.1.201` 上，我们编辑了 `nginx` 配置文件以添加以下行：\n\n```bash\n[root@pruebas\
    \ html]# vim /etc/nginx/nginx.conf\n\nlocation /test {\n    proxy_pass http://192.168.1.202/test.html;\n\
    }\n```\n\n在 `nginx` 配置文件中，配置块应该如下：\n\n```nginx\nserver {\n    listen       80\
    \ default_server;\n    listen       [::]:80 default_server;\n    server_name \
    \ _;\n    root         /usr/share/nginx/html;\n    # 加载默认 server 块的配置文件。\n   \
    \ include /etc/nginx/default.d/*.conf;\n    #location / {\n    #}\n    location\
    \ /test {\n    proxy_pass http://192.168.1.202/test.html;\n    }\n    error_page\
    \ 404 /404.html;\n    location = /40x.html {\n    }\n    error_page 500 502 503\
    \ 504 /50x.html;\n    location = /50x.html {\n    }\n}\n```\n\n接下来，在 SELinux 中启用布尔变量\
    \ `httpd_can_network_connect` 并重新启动服务：\n\n```bash\n[root@pruebas html]# setsebool\
    \ -P httpd_can_network_connect 1\n[root@pruebas html]# systemctl restart nginx.service\n\
    ```\n\n为了在 HTTP 客户端上确认此设置，向 `http://192.168.1.201/test` 发起请求，如下所示：\n\n![](img/Image00027.jpg)\n\
    \n通过之前的练习，通过某种方式，实际上为客户端提供答案的服务器被隐藏了，即 `192.168.1.202`；用户访问 `192.168.1.201` Web\
    \ 服务器查找答案，它显示的是另一个 Web 服务器的内容。\n\n# 使用 NGINX 的 HTTP 负载均衡器\n\n本过程描述了将 `NGINX` 服务配置为\
    \ HTTP 负载均衡器，它可以根据请求发送到不同的服务器，取决于哪个服务器的活动连接数最少，也就是说，它是关于确定负载组内哪台服务器健康状况更好以便发送\
    \ http 请求。在处理公司内部的 Web 应用程序时，这是一个非常有用的场景，并且对于该应用程序至少需要一个高可用方案。\n\n为了实现此功能，有以下服务器组：\n\
    \n* `192.168.1.201` = 负载均衡器\n* `192.168.1.202` = 服务器\n* `192.168.1.203` = 服务器\n\
    \n为了验证负载均衡器确实在工作，在服务器 `192.168.1.202` 和 `192.168.1.203` 上（运行着 `nginx` 服务）更改默认索引页（`index.html`），如下所示：\n\
    \n```bash\n[root@sr2 ~]# cd /usr/share/nginx/html/\n[root@sr2 html]# mv index.html\
    \ index.html.ori\n[root@sr2 html]# echo \"<h1>soy 192.168.1.202</h1>\" >> index.html\n\
    ```\n\n在 `192.168.1.203` 服务器上执行相同的指令：\n\n```bash\n[root@sr3 ~]# cd /usr/share/nginx/html/\n\
    [root@sr3 html]# mv index.html index.html.ori\n[root@sr3 html]# echo \"<h1>soy\
    \ 192.168.1.203</h1>\" >> index.html\n```\n\n在将执行负载均衡的服务器上，`nginx` 的配置文件应该如下：\n\
    \n```nginx\nhttp {\n    log_format  main  '$remote_addr - $remote_user [$time_local]\
    \ \"$request\" '\n    '$status $body_bytes_sent \"$http_referer\" '\n    '\"$http_user_agent\"\
    \ \"$http_x_forwarded_for\"';\n    access_log  /var/log/nginx/access.log  main;\n\
    \    sendfile            on;\n    tcp_nopush          on;\n    tcp_nodelay   \
    \      on;\n    keepalive_timeout   65;\n    types_hash_max_size 2048;\n    include\
    \             /etc/nginx/mime.types;\n    default_type        application/octet-stream;\n\
    \    # 从 /etc/nginx/conf.d. 加载模块化配置文件。\n    # 更多信息请参见 http://nginx.org/en/docs/ngx_core_module.html\n\
    \    include /etc/nginx/conf.d/*.conf;\n    upstream loadbalancer.aptivalabs.net\
    \ {\n        least_conn;\n        server 192.168.1.202;\n        server 192.168.1.203;\n\
    \    }\n    server {\n        listen       80 default_server;\n        listen\
    \       [::]:80 default_server;\n        server_name  _;\n        root       \
    \  /usr/share/nginx/html;\n        # 加载默认 server 的配置文件。\n        include /etc/nginx/default.d/*.conf;\n\
    \        #location / {\n        location / {\n            proxy_pass http://loadbalancer.aptivalabs.net;\n\
    \        }\n        error_page 404 /404.html;\n        location = /40x.html {\n\
    \        }\n        error_page 500 502 503 504 /50x.html;\n        location =\
    \ /50x.html {\n        }\n    }\n    # 启用 TLS 的服务器设置。\n    # server {\n    # \
    \   listen        443 ssl default_server;\n    #    listen       [::]:443 ssl\
    \ default_server;\n    #    server_name  _;\n    #    root         /usr/share/nginx/html;\n\
    \    #    ssl_certificate \"/etc/nginx/ssl.crt\";\n    #    ssl_certificate_key\
    \ \"/etc/nginx/ssl.key\";\n    #    ssl_session_cache shared;\n    #    ssl_session_timeout\
    \ 10m;\n    #    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;\n    # }\n}\n```\n\n[译文]\n\
    \n本过程描述了将 `NGINX` 服务配置为 HTTP 负载均衡器，它可以将请求发送到不同的服务器，取决于哪个服务器的活动连接数最少，也就是说，它是关于确定负载组内哪台服务器健康状况更好以便发送\
