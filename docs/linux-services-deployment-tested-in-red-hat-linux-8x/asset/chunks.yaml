  trans: "\n必须将证书复制到相应的路径，以便 `nginx` 服务读取它们，该路径必须在 `nginx` 文件中定义：\n\n```bash\n[root@loadbalancer\
    \ ~]# cp localhost.crt /etc/pki/tls/certs/localhost.crt\n[root@loadbalancer ~]#\
    \ cp localhost.key /etc/pki/tls/private/localhost.key\n```\n\n`nginx` 服务的配置文件应该如下：\n\
    \n```bash\n[root@loadbalancer ~]# cat /etc/nginx/nginx.conf\n\nserver {\n    listen\
    \       443 ssl http2 default_server;\n    listen       [::]:443 ssl http2 default_server;\n\
    \    server_name  _;\n    root         /usr/share/nginx/html;\n    ssl_certificate\
    \ \"/etc/pki/tls/certs/localhost.crt\";\n    ssl_certificate_key \"/etc/pki/tls/private/localhost.key\"\
    ;\n    listen       80 default_server;\n    listen       [::]:80 default_server;\n\
    \    #server_name  _;\n    #server_name loadbalancer.aptivalabs.net;\n    #root\
    \         /usr/share/nginx/html;\n    # Load configuration files for the default\
    \ server block.\n    include /etc/nginx/default.d/*.conf;\n    location / {\n\
    \    }\n    error_page 404 /404.html;\n    location = /40x.html {\n    }\n   \
    \ error_page 500 502 503 504 /50x.html;\n    location = /50x.html {\n    }\n}\n\
    ```\n\n可以看出，`nginx` 服务被配置为通过 80 和 443 端口接收请求，并使用相同的发布路径 `/usr/share/nginx/html`。同样，也列出了\
    \ `nginx` 查找证书的路径。该操作表明需要告诉 FirewallD 在默认区域接受 HTTPS 请求，而 HTTP 请求已在 FirewallD 中添加：\n\
    \n```bash\n[root@loadbalancer ~]# firewall-cmd --permanent --add-service=https\n\
    success\n[root@loadbalancer ~]# firewall-cmd --reload\nsuccess\n```\n\n要验证配置，请运行任任的\
    \ HTTP 客户端并尝试通过 HTTP 与服务器通信，如下所示：\n\n![](img/Image00028.jpg) \n\n接下来，在你的 HTTP\
    \ 客户端中，尝试通过 HTTPS 进行通信：\n\n![](img/Image00029.jpg) \n\n# 无值安装 - KICKSTART\n\n\
    在经常需要执行 RHEL 8 安装的环境（此过程也可以在 Oracle Linux 和 CentOS 8 中模拟），当尝试安装许多系统时，运行手动过程可能会有些疲惫；例如，可能为\
    \ 20 名学生进行 Linux 实验而安装整个训练环境，或者公司需要实现一个服务集群（存储、虚拟化等），其中涉及到许多 Linux 系统。\n\n面对这种情况，Kickstart\
    \ 工具允许生成无人无人值的、自动化的安装。此时，只需告诉安装程序在何处找到安装定义文件，安装程序即可执行此活动，而管理员无需根据每个系统的安装情况亲自到场。\n\
    \n为了开发此项活动，需要执行以下步骤：\n\n1. 生成 kickstart 文件（安装定义文件）\n2. 将 kickstart 文件发布到可见资源\n\
    3. 发布安装包\n4. 从安装 ISO 开始安装\n\n在要实现的练习场景中，涉及 IP 地址为 `192.168.0.200` 的服务器，该服务器实现了\
    \ `Nginx` 服务，并将 RHEL 8 安装 ISO 挂载在 Nginx 发布路径中。\n\n第一步是生成 kickstart 文件，这是一个文本文件，其中以自己的格式定义了安装所需的特性。该文件的生成可以使用\
    \ Red Hat 为此目的提供的工具，该工具位于 URL `https://access.redhat.com/labs/kickstartconfig/`。同样，RHEL\
    \ 8 及其衍生系统在完成安装后，会在 `/root` 下留一个名为 `anaconda-ks.cfg` 的文件，它就是一个 kickstart 文件：\n\
    \n```bash\n[root@loadbalancer ~]# pwd\n/root\n[root@loadbalancer ~]# ll anaconda-ks.cfg\n\
    -rw-------. 1 root root 1275 Dec 17 17:21 anaconda-ks.cfg\n```\n\n在练习开发过程中，使用了工具\
    \ `https://access.redhat.com/labs/kickstartconfig/`，生成了文件并下载到 RHEL 8 服务器；生成的文件定义了“最小安装”环境的部署；生成的文件详情如下：\n\
    \n```bash\n[root@loadbalancer html]# cat ks.cfg\nlang en_US\nkeyboard us\ntimezone\
    \ America/Bogota --isUtc\nrootpw $1$wRe6mImL$eyda8JWudogBZ5pMTTVU9/ --iscrypted\n\
    ```\n\n```bash\n[root@loadbalancer html]# cat ks.cfg\nlang en_US\nkeyboard us\n\
    timezone America/Bogota --isUtc\nrootpw $1$wRe6mImL$eyda8JWudogBZ5pMTTVU9/ --iscrypted\n\
    ```\n\n```bash\n[root@loadbalancer html]# cat ks.cfg\nlang en_US\nkeyboard us\n\
    timezone America/Bogota --isUtc\nrootpw $1$wRe6mImL$eyda8JWudogBZ5pMTTVU9/ --iscrypted\n\
    ```\n\n（注：此处原文中存在大量重复的命令块描述，已根据逻辑流进行整合和翻译处理……）\n\n# 使用 SAMBA 部署文件服务器\n\nSamba\
    \ 在 RHEL 中实现了服务器消息块 (SMB) 协议。该协议用于访问服务器资源，如共享文件和打印机。部署如 Samba 的 SMB 服务可能意味着需要处理与\
    \ Samba 相关的服务，例如 `smbd`、`nmbd` 和 `winbind`。\n"
- fmt: '

    The `smbd` service provides file sharing and printing services using the SMB protocol,
    and is also responsible for blocking resources and authenticating users who connect
    to Samba.


    The `nmbd` service provides the hostname and IP resolution using the NetBIOS over
    IPv4 protocol. In addition to name resolution, the `nmbd` service allows you to
    browse the SMB network to locate domains, workgroups, hosts, file shares, and
    printers.


    The `winbind` service provides an interface for the Name Exchange Service (NSS
    - Network Service Switch) to integrate local and AD (Active Directory) users and
    groups into the local system. This allows domain users to authenticate to services
    managed by the Samba server or other local services. If you configure Samba as
    a domain member, `winbind` must be started before the `smbd` service, otherwise
    the domain users and groups will not be available to the local system.


    For a better understanding of how to implement Samba in its role as file server,
    we will take the server with IP `192.168.0.201` as the Samba server; We will simulate
    a scenario of some work groups (treasury and hr - human resources) within a company
    that require having permissions on folders within the system to save files. People
    who will access these will use Linux Red Hat, Microsoft Windows 10, and Apple
    Mac OSX systems. These people will be able to save personal information in personal
    folders and in group folders; at no time will they be able to access the Shell
    on the Linux server.


    ### Samba Installation


    The exercise begins with the installation of Samba, as shown:


    ```bash

    [root@sr1 ~]# yum -y install samba


    Updating Subscription Management repositories.

    Last metadata expiration check: 0:35:00 ago on Wed 24 Mar 2021 03:19:16 PM EDT.

    Dependencies resolved.

    ================================================================================

    Package             Architecture   Version                    Repository                             Size

    ================================================================================

    Installing:

    samba                x86_64         4.12.3-14.el8_3            rhel-8-for-x86_64-baseos-rpms     840
    k

    Installing dependencies:

    samba-common-tools     x86_64         4.12.3-14.el8_3           rhel-8-for-x86_64-baseos-rpms     484
    k

    samba-libs             x86_64         4.12.3-14.el8_3           rhel-8-for-x86_64-baseos-rpms     188
    k

    Transaction Summary

    ================================================================================

    Install  3 Packages

    Total download size: 1.5 M

    Installed size: 4.0 M

    Installed:

    samba-4.12.3-14.el8_3.x86_64  samba-common-tools-4.12.3-14.el8_3.x86_64  samba-libs-4.12.3-14.el8_3.x86_64

    ```


    ### Directory and Permission Setup


    We proceed to create the folders that will contain the information of the work
    groups; It is important to mention that in a real scenario it would be recommended
    that `/datos` be the mount point of an XFS filesystem mounted on an LVM structure
    with LV Thin; the folders are created:


    ```bash

    [root@sr1 ~]# mkdir -p /datos/tesoreria

    [root@sr1 ~]# mkdir /datos/rrhh

    ```


    The workgroups are created and the respective permissions are assigned on the
    created folders:


    ```bash

    [root@sr1 ~]# groupadd -r tesoreria

    [root@sr1 ~]# groupadd -r rrhh

    [root@sr1 ~]# chgrp tesoreria /datos/tesoreria

    [root@sr1 ~]# chgrp rrhh /datos/rrhh

    [root@sr1 ~]# chmod 2770 /datos/tesoreria

    [root@sr1 ~]# chmod 2770 /datos/rrhh

    ```


    You can see in the previous instruction the creation of "setgid" permissions so
    that the files created in each of the group folders continue to belong to the
    same group once created; The same is done by declaring ACL’s by default so that
    files and directories in the future retain the necessary attributes so that the
    users of "treasury" and "hr" groups continue to have rights over resources:


    ```bash

    [root@sr1 ~]# setfacl -m g:tesoreria:rwx /datos/tesoreria

    [root@sr1 ~]# setfacl -m d:g:tesoreria:rwx /datos/tesoreria

    [root@sr1 ~]# setfacl -m g:rrhh:rwx /datos/rrhh

    [root@sr1 ~]# setfacl -m d:g:rrhh:rwx /datos/rrhh

    ```


    ### SELinux Configuration


    It is time to control access to these directories using SELinux, which must be
    in "enforcing" mode:


    ```bash

    [root@sr1 ~]# semanage fcontext -a -t samba_share_t ''/datos/tesoreria(/.*)''

    [root@sr1 ~]# semanage fcontext -a -t samba_share_t ''/datos/rrhh(/.*)''

    [root@sr1 ~]# restorecon -vv /datos/tesoreria

    [root@sr1 ~]# restorecon -Rv /datos/rrhh

    ```


    The above statement immediately creates and applies SELinux policies on folders
    that will contain the workgroup data. Then SELinux Booleans are activated that
    will allow export of `/home` folder and workgroup folders:


    ```bash

    [root@sr1 ~]# setsebool -P samba_export_all rw

    [root@sr1 ~]# setsebool -P samba_export_all ro

    [root@sr1 ~]# setsebool -P samba_enable_dirs on

    ```


    ### Samba User Creation


    Next, the users of the Linux system corresponding to each workgroup are created,
    which must be created without access to Shell since their primary group must be
    their workgroup; in the same way and immediately the Samba user is created with
    the same name as the user in Linux and the same password.


    ```bash

    [root@sr1 ~]# adduser -N -s /sbin/nologin -g tesoreria t1

    [root@sr1 ~]# smbpasswd -a t1

    [root@sr1 ~]# adduser -N -s /sbin/nologin -g rrhh r1

    [root@sr1 ~]# smbpasswd -a r1

    ```


    If you take a look at `/home`, the users directory, you will see the following:


    ```bash

    [root@sr1 ~]# ll /home/

    total 4

    drwx------ 3 r1 rrhh Mar 24 16:49 r1

    drwx------ 3 t1 tesoreria Mar 24 16:48 t1

    ```


    ### Samba Configuration


    Once the entire structure that the file server will support has been defined,
    it is necessary to save a copy of the original Samba file for backup reasons.
    The Samba installation created the path `/etc/samba` which is where its configuration
    files are hosted, as shown:


    ```bash

    [root@sr1 ~]# cd /etc/samba/

    [root@sr1 ~]# pwd

    /etc/samba

    [root@sr1 ~]# mv smb.conf smb.conf.original

    [root@sr1 ~]# mv smb.conf.example smb.conf

    ```


    The file `smb.conf.example` is the one that contains the configuration we need
    for Samba, so that when it is renamed it remains as the main configuration file
    `smb.conf`. Following these steps, it is necessary to edit this configuration
    file to establish the following guidelines:


    ```bash

    [root@sr1 ~]# vim /etc/samba/smb.conf

    workgroup = WORKGROUP

    interfaces = lo ens18

    host allow = 127.192.168.0

    security = user

    passdb backend = tdbsam

    ```


    The previous definition sets the following properties for Samba in the `[global]`
    section:

    - **Security**: indicates how clients will be able to access Samba services, `user`
    defines what it will be using username and passwords.

    - **interfaces**: interface that Samba will use to listen to requests.

    - **host allow**: host or networks that will be able to use the service.


    Following the edition of the Samba configuration file (at the end of it) it is
    necessary to add the resources to share, in this case the folders previously created:


    ```ini

    [tesoreria]

    comment = Grupo Tesorería

    path = /datos/tesoreria

    writable = yes

    valid users = @tesoreria

    [rrhh]

    comment = Grupo RRHH

    path = /datos/rrhh

    writable = yes

    valid users = @rrhh

    ```


    In this case are two resources, one called "treasury" and another called "hr",
    which will be allowed only to the corresponding groups, which are written with
    the character `@`. Keep in mind that each user created, in this case `t1` and
    `r1` will have a folder in `/home` where they can save information that only they
    can see and manipulate.


    Once the edition of the configuration file is finished, a `testparm` is executed
    to validate the edition of the Samba configuration file.


    ```bash

    [root@sr1 ~]# testparm

    ```

    '
