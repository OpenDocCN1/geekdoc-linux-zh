    rtt min/avg/max/mdev = 0.777/0.800/0.815/0.028 ms


    [root@loadbalancer samba]# nslookup ad1.aptivalabs.net

    Server: 192.168.1.200

    Address: 192.168.1.200#53

    Name: ad1.aptivalabs.net

    Address: 192.168.1.200

    ```


    We register the RHEL server within the Windows Server domain:


    ```bash

    [root@loadbalancer samba]# realm join --membership-software=samba --client-software=winbind
    ad1.aptivalabs.net

    Password for Administrator:

    ```


    Once the domain has been entered, the status of the `winbind` service is reviewed
    and it is relaunched, taking advantage of it to activate it at startup of the
    operating system:


    ```bash

    [root@loadbalancer samba]# systemctl status winbind

    ● winbind.service - Samba Winbind Daemon

    Loaded: loaded (/usr/lib/systemd/system/winbind.service; enabled; vendor preset:
    disabled)

    Active: active (running) since Wed 2021-03-24 17:43:44 -05; 43s ago

    Docs: man:winbindd(8)

    man:samba(7)

    man:smb.conf(5)

