    # 备份管理


    在 MariaDB 数据库中备份数据有两种主要方法：


    * 逻辑备份

    * 物理备份


    **逻辑备份**由恢复数据所需的 SQL 语句组成。这种类型的备份将信息和日志导出到纯文本文件中。逻辑备份优于物理备份的主要优势是可移植性和灵活性。数据可以恢复到其他硬件配置、MariaDB
    版本或数据库管理系统（DBMS）中，而这在物理备份是无法实现的。请注意，在 `mariadb.service` 服务运行时可以进行逻辑备份。逻辑备份不包括日志和配置文件。


    **物理备份**由存储内容的文件和目录副本组成。与逻辑备份相比，物理备份具有以下优势：


    * 输出更紧凑。

    * 备份文件更小。

    * 备份和恢复更快。

    * 备份包含配置和日志文件。


    请注意，物理备份应在 `mariadb.service` 服务未运行时或所有数据库表已锁定以防止备份期间更改时进行。


    你可以使用以下 MariaDB 备份方法之一来备份 MariaDB 数据库：


    * 使用 `mysqldump` 进行逻辑备份

    * 使用 `Mariabackup` 工具进行在线物理备份

    * 文件系统备份

    * 复制作为备份解决方案


    `mysqldump` 客户端是一个备份实用，可用于转储数据库或一组数据库以进行备份或传输到另一个数据库服务器。`mysqldump` 的输出通常由 SQL
    语句组成，用于重建服务器表的结构、填充数据或二者兼之。作为替代，`mysqldump` 还可以生成其他格式的文件，包括 CSV 或其他分隔符文本格式以及 XML。


    要使用 `mysqldump` 执行备份，可以使用以下选项之一：


    * 备份选定的数据库

    * 备份数据库中的子集表


    # 逻辑备份与恢复


    要备份整个数据库，请运行以下：


    ```bash

    [root@sr1 ~]# mysqldump empresa > /root/backup-empresa.sql -p

    Enter password:

    [root@sr1 ~]# ll

    total 36

    -rw-r--r--. 1 root root  2026 Jul 29 10:51 backup-empresa.sql

    ```


    你可以查看生成的备份文件，如下所示：


    ```sql

    [root@sr1 ~]# more backup-empresa.sql

