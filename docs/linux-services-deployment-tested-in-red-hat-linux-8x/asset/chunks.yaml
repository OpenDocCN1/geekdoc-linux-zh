    In the path where PostgreSQL was initialized (`/pgsql-data`) there are the files
    to configure the database engine; there you will find the files `postgresql.conf`
    and `pg_hba.conf`, the first one manages the general configuration of the database
    engine and the second one manages the accesses to the databases. To receive requests
    it is necessary to edit them, as detailed below:


    ```bash

    [root@bd2 pgsql-data]# pwd

    /pgsql-data

    [root@bd2 pgsql-data]# ll postgresql.conf

    -rw-------. 1 postgres postgres 22982 Mar 26 15:41 postgresql.conf

    ```


    In the `postgresql.conf` file, the parameters `listen_addresses` and `port = 5432`
    must be activated:


    ```bash

    [root@bd2 pgsql-data]# vim postgresql.conf

    listen_addresses = ''*'' # what IP address(es) to listen on;

    port = 5432 # (change requires restart)

    ```


    Following this, the file `pg_hba.conf` must contain the pertinent authorizations
    to or to the engine databases:


    ```bash

    [root@bd2 pgsql-data]# ll pg_hba.conf

    -rw-------. 1 postgres postgres 4305 Mar 26 15:38 pg_hba.conf

    ```


    The specific case observed in the following instruction is a "host" type authorization
    to all databases governed by PostgreSQL, allowing access to all users but closing
    the connection to the host `192.168.0.200` through an encrypted method of password
    entry:


    ```bash

    [root@bd2 pgsql-data]# vim pg_hba.conf

    # TYPE  DATABASE        USER            ADDRESS                 METHOD

    ---

    host all  all             192.168.0.200/32         md5

    ```


    After the changes made, it is necessary to restart the `postgresql-10.service`
    service:


    ```bash

    [root@bd2 pgsql-data]# systemctl restart postgresql-10.service

    ```


    # POSTGRESQL - STREAMING REPLICATION


    Streaming Replication (SR) provides the ability to continuously send and apply
    WAL XLOG logs to a number of standby servers to keep them up to date. This feature
    was added to PostgreSQL 9.0.


    The demonstration exercise is carried out on two servers, the `192.168.0.38` (sr1),
    which would be the main server, and the server `192.168.0.39` (sr2) which is where
    the respective replication is taking place.


    PostgreSQL is installed and secured on the server `sr1` (the default stream is
    10):


    ```bash

    [root@sr1 ~]# yum install postgresql-server

    [root@sr1 ~]# postgresql-setup --initdb

    [root@sr1 ~]# systemctl enable postgresql.service --now

    [root@sr1 ~]# firewall-cmd --add-service=postgresql --permanent

    [root@sr1 ~]# firewall-cmd --reload

    [root@sr1 ~]# reboot

    ```


    Once the `postgresql` service startup is installed and verified at system startup,
    the configuration file is edited, where the following configuration lines should
    look like this:


    ```bash

    [root@sr1 ~]# vim /var/lib/pgsql/data/postgresql.conf

    listen_addresses = ''*''

    wal_level = replica

    synchronous_commit = on

    max_wal_senders = 10

    synchronous_standby_names = ''*''

    ```


    Regarding access to `postgresql` services, it is necessary to define the replica
    hosts, as shown at the end of the `pg_hba.conf` file (it should look as shown):


    ```bash

    [root@sr1 ~]# vim /var/lib/pgsql/data/pg_hba.conf

    # host replication [replication user] [allowed network] [authentication method]

    #host    replication     all             127.0.0.1/32            ident

    #host    replication     all             ::1/128                 ident

    host    replication     rep_user        192.168.0.38/32            md5

    host    replication     rep_user        192.168.0.39/32           md5

    ```


    Next, the user `rep_user` (user for replication) is created with its respective
    PostgreSQL role defined:


    ```bash

    [root@sr1 ~]# su - postgres

    [postgres@sr1 ~]$ createuser --replication rep_user

    Enter password for role:

    Enter it again:

    ```


    We exit the `postgres` user and restart the service:


    ```bash

    [postgres@sr1 ~]$ exit

    [root@sr1 ~]# systemctl restart postgresql

    ```


    Next we start the procedures on the `sr2` server, installing and securing the
    `postgresql` service:


    ```bash

    [root@sr2 ~]# yum install postgresql-server

    [root@sr2 ~]# postgresql-setup --initdb

    [root@sr2 ~]# systemctl enable postgresql.service --now

    [root@sr2 ~]# firewall-cmd --add-service=postgresql --permanent

    [root@sr2 ~]# firewall-cmd --reload

    [root@sr2 ~]# reboot

    ```


    Once the `postgresql` service has been installed, initialized and put into production,
    we stop it, save the configuration and transfer the configuration on the `sr1`
    server, as shown:


    ```bash

    [root@sr2 ~]# systemctl stop postgresql.service

    [root@sr2 ~]# cp -R /var/lib/pgsql/data/ /root/

    [root@sr2 ~]# rm -rf /var/lib/pgsql/data/*

    [root@sr2 ~]# ll /var/lib/pgsql/data/

    total 0

    [root@sr2 ~]# su - postgres

    [postgres@sr2 ~]$ pg_basebackup -R -h 192.168.0.38 -U rep_user -D /var/lib/pgsql/data
    -P

    Password:

    22858/22858 kB (100%), 1/tablespace

    [postgres@sr2 ~]$ pwd

    /var/lib/pgsql

    ```


    We can verify the previous steps by listing the content of `/var/lib/pgsql` again:


    ```bash

    [postgres@sr2 ~]$ ll data/

    total 60

    -rw-------. 1 postgres postgres 206 Jul 27 15:36 backup_label

    drwx------. 5 postgres postgres 41 Jul 27 15:36 base

    -rw-------. 1 postgres postgres 30 Jul 27 15:36 current_logfiles

    ```


    The impersonation of the user `postgres` is terminated:


    ```bash

    [postgres@sr2 ~]$ exit

    ```


    We start editing the PostgreSQL configuration files, which should be as follows
    according to our exercise (make sure that the lines with the following variables
    remain defined):


    ```bash

    [root@sr2 ~]# vi /var/lib/pgsql/data/postgresql.conf

    listen_addresses = ''*''

    hot_standby = on

    [root@sr2 ~]# vi /var/lib/pgsql/data/pg_hba.conf

    # host replication [replication user] [allowed network] [authentication method]

    #host    replication     all             127.0.0.1/32            ident

    #host    replication     all             ::1/128                 ident

    host    replication     rep_user        192.168.0.38/32            md5

    host    replication     rep_user        192.168.0.39/32           md5

    ```


    Once the files have been modified, it is necessary to start the PostgreSQL service:


    ```bash

    [root@sr2 ~]# systemctl start postgresql

    ```


    It is time to test the configuration made, trying to create a database and insert
    some records which should be replicated asynchronously on the `sr2` server, as
    shown below:


    In server `sr1`, a database is created with a table and two records are inserted:


    ```bash

    [root@sr1 ~]# su - postgres

    [postgres@sr1 ~]$ createdb test

    [postgres@sr1 ~]$ psql test

    psql (10.17)

    Type "help" for help.

    test=# create table usuarios ( nombre varchar(30), clave varchar(10) );

    CREATE TABLE

    test=# insert into usuarios (nombre, clave) values (''Mariano'',''payaso'');

    INSERT 0 1

    test=# insert into usuarios (nombre, clave) values (''Sara'',''Mestre'');

    INSERT 0 1

    ```


    Entering `sr2` we can see if the replication was successful, as shown below:


    ```bash

    [root@sr2 ~]# su - postgres

    [postgres@sr2 ~]$ psql

    psql (10.17)

    Type "help" for help.

    postgres=#

    postgres-# \c test

    test=# select * from usuarios;

    nombre  | clave

    ---------+--------

    Mariano | payaso

    Sara    | Mestre

    (2 rows)

    test=# \q

    ```

