    \ processes), if this operating system functionality is enabled.\n\n> KERNEL DATA\
    \ DUMP FOR POST ANALYSIS\n\nTo analyze why a system failed, you can use the kdump\
    \ service to save the contents of system memory for later analysis. In this sub\
    \ section we will see a brief introduction to kdump using the RHEL Web Console.\
    \ Kdump is a service that provides a crash-dump mechanism for the kernel. The\
    \ service allows you to save the contents of the memory. Kdump uses the kexec\
    \ system call to boot into a second kernel without rebooting, thus capturing the\
    \ content of the failing kernel and saving the data for analysis. The second kernel\
    \ resides in a reserved part of memory.\n\nA kernel crash dump may be the only\
    \ information available in the event of a system failure (a critical error), therefore\
    \ ensuring that kdump is operational is important in mission critical environments.\
    \ The procedure below shows you how to use the Kernel Dump tab in the Cockpit\
    \ tool to configure the amount of memory reserved for the kdump kernel. The procedure\
    \ also describes how to specify the destination location of the vmcore dump file\
    \ and how to test its configuration.\n\n![](Image00004.jpg) \n\nOnce registered\
