    A network file system (NFS) allows remote hosts to mount file systems over a network
    and interact with those file systems as if they were mounted locally. This makes
    it possible to consolidate resources on centralized servers on the network.


    The NFS server consults the `/etc/export` configuration file to determine if the
    client can access any exported file systems. Once verified, all file and directory
    operations are available to the user. NFS version 4 (NFSv4) works through firewalls
    and on the Internet, does not require an `rpcbind` service, supports access control
    lists (ACLs), and uses stateful operations.


    The default NFS version in Red Hat Enterprise Linux 8 is `4.2`. NFS clients try
    to mount using `NFSv4.2` by default, and fall back to `NFSv4.1` when the server
    does not support `NFSv4.2`. The mount reverts to `NFSv4.0` and then `NFSv3`. The
    `/etc/export` file controls which file systems are exported to remote hosts and
    specifies the options.


    ## Default options


    The default options for an export entry are:


    - `ro` - The exported file system is read-only. Remote hosts cannot change shared
    data on the file system. To allow hosts to make file system changes (that is,
    read and write), specify the `rw` option.

    - `sync` - The NFS server will not respond to requests before the changes made
    by previous requests are written to disk. To enable asynchronous writes instead,
    specify the `async` option.

    - `wdelay` - The NFS server will delay writing to the disk if it suspects that
    another write request is imminent. This can improve performance by reducing the
    number of times the disk must be accessed by separate write commands, thus reducing
    write overhead. To disable this, specify the `no_wdelay` option, which is only
    available if the default `sync` option is also specified.

    - `root_squash` - This prevents root users logged in remotely (rather than locally)
    from having root privileges; instead, the NFS server assigns them user ID `nobody`.
    This effectively "squashes" the power from the remote root user to the lowest
    local user, preventing possible unauthorized writes on the remote server. To disable
    root squashing, specify the `no_root_squash` option.


    ## NFS Service Deployment


    The deployment of the NFS service is shown in the following procedure. The folder
    `/aptivalabs` is created, which will be the path to export:


    ```bash

    [root@sr1 ~]# mkdir /aptivalabs

    ```


    The `nfs-utils` software is installed, which is normally already installed on
    Red Hat Linux and derived systems:


    ```bash

    [root@sr1 ~]# yum install nfs-utils -y

    ```


    We edit the NFS service configuration file:


    ```bash

    [root@sr1 ~]# vim /etc/exports


    /aptivalabs 192.168.0.0/24(rw,sync,wdelay,no_root_squash)

    ```


    For servers that support NFSv2 or NFSv3 connections, the `rpcbind` service must
    be running. To verify that `rpcbind` is active, use the following command:


    ```bash

    [root@sr1 ~]# systemctl status rpcbind

    ```


    If the service is stopped, start it and activate it:


    ```bash

    [root@sr1 ~]# systemctl enable --now rpcbind

    ```


    It is time to start the NFS service, as shown below:


    ```bash

    [root@sr1 ~]# systemctl enable --now nfs-server

    ```


    It is necessary to tell FirewallD to allow listening on the following services:


    ```bash

    [root@sr1 ~]# firewall-cmd --permanent --add-service mountd

    [root@sr1 ~]# firewall-cmd --permanent --add-service rpc-bind

    [root@sr1 ~]# firewall-cmd --permanent --add-service nfs

    [root@sr1 ~]# firewall-cmd --list-all


    public (active)

    target: default

    icmp-block-inversion: no

    interfaces: ens18

    sources:

    services: cockpit dhcpv6-client mountd nfs postgresql rpc-bind ssh

    ```


    To verify the configuration established in the NFS server, in a second Linux system
    we will carry out the temporary and persistent mounting of the exported resource.
    We start by installing the `nfs-utils` package and viewing the exported resource:


    ```bash

    [root@sr2 ~]# yum -y install nfs-utils

    [root@sr2 ~]# showmount -e 192.168.0.38


    Export list for 192.168.0.38:

    /aptivalabs 192.168.0.0/24

    ```


    The exported resource is temporarily mounted in the `/mnt` folder and it is displayed:


    ```bash

    [root@sr2 ~]# mount -t nfs 192.168.0.38:/aptivalabs /mnt

    [root@sr2 ~]# df -hT


    Filesystem               Type      Size  Used Avail Use% Mounted on

    …

    192.168.0.38:/aptivalabs nfs4       44G  5.1G   39G  12% /mnt

    ```


    Persistent mount is done, as shown:


    ```bash

    [root@sr2 ~]# vim /etc/fstab


    192.168.0.38:/aptivalabs /mnt             nfs     defaults          0 0

    [root@sr2 ~]# systemctl daemon-reload

    [root@sr2 ~]# udev settle

    [root@sr2 ~]# mount -a

    ```


    To verify the persistent mount, a reboot is performed and once the system is available,
    the mount points are verified:


    ```bash

    [root@sr2 ~]# reboot

    [root@sr2 ~]# df -hT


    Filesystem               Type      Size  Used Avail Use% Mounted on

    …

    192.168.0.38:/aptivalabs nfs4       44G  5.1G   39G

    ```


    ## MariaDB Relational Service


    MariaDB is a database server based on the technology for some time was deployed.
    The default version of Red Hat Enterprise Linux 8 is MariaDB 10.3. In subsequent
    chapters, the documentation developed by Red Hat Inc will be used to describe
    the characteristics and functionalities of MariaDB, however, there is the profile
    of this author to give this documentation air of step-by-step use to perform the
    different activities on MariaDB.


    ### Installation and Configuration


    To install MariaDB we can see the streams defined by the system for this purpose;
    the Red Hat Linux brings version 10.3 as the default version, shown below:


    ```bash

    [root@sr1 ~]# yum module info mariadb

    Updating Subscription repositories.

    Last metadata check: 19:56:41 ago on 28 Jul 2021 01:43:09 PM.

    Name:            mariadb

    Stream:          10.3 [d][a]

    Version:         8.10.201902091509

    Context:         cdc1202b

    Architecture:    x86_64

    Profiles:        client, server [d]

    Default profiles: server

    Repo:            rhel-8-for-x86_64-appstream-rpms

    Summary:         MariaDB Module

    Description:     MariaDB is a community developed branch of MySQL. MariaDB is
    a multi-user, multi-threaded SQL server. It is a client/server implementation
    consisting of a server daemon (mysqld) and many different client programs and
    libraries. The base package contains the standard MariaDB/MySQL client programs
    and generic MySQL files.

    ...

    ```


    Next we proceed with the installation of MariaDB:


    ```bash

    [root@sr1 ~]# yum module install mariadb:10.3/server

    Updating Subscription repositories.

    Last metadata check: 19:58:16 ago on 28 Jul 2021 01:43:09 PM.

    Dependencies resolved.

    ================================================================================

    Package                 Architecture  Version                            Repository                    Size

    ================================================================================

    Installing group/module packages:

    mariadb-server           x86_64       3:10.3.28-1.module+el8.3.0+10472+7adc332a
    rhel-8-for-x86_64-appstream-rpms   16 M

    Installing dependencies:

    mariadb                  x86_64       3:10.3.28-1.module+el8.3.0+10472+7adc332a
    rhel-8-for-x86_64-appstream-rpms   6.0 M

    ...

    ```


    The service is then started and the start of the service is enabled at startup
    of the operating system:


    ```bash

    [root@sr1 ~]# systemctl enable mariadb.service --now


    Created symlink /etc/systemd/system/mysql.service → /usr/lib/systemd/system/mariadb.service.

    Created symlink /etc/systemd/system/mysqld.service → /usr/lib/systemd/system/mariadb.service.

    Created symlink /etc/systemd/system/multi-user.target.wants/mariadb.service →
    /usr/lib/systemd/system/mariadb.service.

    ```


    The status of the service is validated:


    ```bash

    [root@sr1 ~]# systemctl status mariadb.service


    ● mariadb.service - MariaDB 10.3 database server

    ```

