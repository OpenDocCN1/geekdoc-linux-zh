    \n> postgres    5981    5973  0 09:41 ?        00:00:00 postgres: bgworker: logical\
    \ replication launcher\n\nFirewallD rules are set to receive connections to the\
    \ database engine:\n\n> [root@bd1 ~]# firewall-cmd --add-service=postgresql --permanent\n\
    \n> success\n\n> [root@bd1 ~]# firewall-cmd --reload\n\n> success\n\nBefore putting\
