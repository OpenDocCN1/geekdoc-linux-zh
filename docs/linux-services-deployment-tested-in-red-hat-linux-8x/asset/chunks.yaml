    # 初始防护\n\n在数据库引擎安装并验证其相应连接后，MariaDB 为我们提供了出于安全考虑进行配置加固的机会，如下所示：\n\n```bash\n[root@sr1\
    \ ~]# mysql_secure_installation\n```\n\n注意：建议对所有生产环境中的 MariaDB 服务器 运行此脚本的所有部分！请仔细阅读每个步骤！\n\
    \n为了登录 MariaDB 并进行安全设置，我们需要 `root` 用户的当前密码。如果您刚刚安装 MariaDB 且尚未设置 root 密码，则密码将为空，此时只需按回车键。\n\
    \n```text\nEnter current password for root (enter for none):\nOK, successfully\
    \ used password, moving on...\nSetting the `root` password ensures that nobody\
    \ can log into the MariaDB `root` user without the proper authorisation.\nSet\
    \ root password? [Y/n] Y\nNew password:\nRe-enter new password:\nPassword updated\
    \ successfully!\nReloading privilege tables..\n... Success!\n```\n\n默认情况下，MariaDB\
    \ 安装包含一个匿名用户，允许任何人无需为其创建用户账户即可登录 MariaDB。这仅用于测试，并使安装过程更顺畅一些。在进入生产环境之前，您应该删除它们。\n\
    \n```text\nRemove anonymous users? [Y/n] Y\n... Success!\n```\n\n通常情况下，`root`\
    \ 只应允许从 `'localhost'` 连接。这确保了有人无法从网络猜测 root 密码。\n\n```text\nDisallow root login\
    \ remotely? [Y/n] n\n... skipping.\n```\n\n默认情况下，MariaDB 自带一个名为 `'test'` 的数据库，任何人都可以访问。这同样仅用于测试，在进入生产环境之前应将其删除。\n\
    \n```text\nRemove test database and access to it? [Y/n] Y\n- Dropping test database...\n\
    ... Success!\n- Removing privileges on test database...\n... Success!\n```\n\n\
    重新加载权限表将确保到目前为止的所有更改都会立即生效。\n\n```text\nReload privilege tables now? [Y/n] Y\n\
    ... Success!\n```\n\n正在清理...\n全部完成！如果您已完成上述所有步骤，您的 MariaDB 安装现在应该是安全的。\n感谢使用 MariaDB！\n\
    \n# 网络配置\n\n要为 MariaDB 服务器配置网络连接，请使用 `/etc/my.cnf.d/mariadb-server.cnf` 文件中的 `[mysqld]`\
    \ 部分，您可以在其中设置以下配置指令：\n\n*   `bind-address`：`bind-address` 是服务器监听的地址。可能的选项有：主机、IPv4\
    \ 地址或 IPv6 地址。\n*   `skip-networking`：可能的值：\n    *   `0`：监听所有客户端\n    *   `1`：仅监听本地客户端\n\
    *   `port`：MariaDB 监听 TCP / IP 连接的端口；此服务的默认端口是 `tcp` 中的 `3306`。\n\n查看配置文件可以显示我们以下信息：\n\
