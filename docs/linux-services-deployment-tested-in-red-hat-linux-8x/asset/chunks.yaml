    # RELAX & RECOVER - BACK AND RESTORE LINUX SYSTEM


    To recover and restore a system using an existing backup, Red Hat Linux (can also
    be installed by other distributions) provides the ReaR option. You can use the
    utility as a disaster recovery solution and system migration. The utility allows
    you to perform the following tasks:


    - Build boot image and restore the system from an existing backup, using the image.

    - Replicate the original storage.

    - Restore user and system files.

    - Restore the system to different hardware.


    In addition, for disaster recovery, you can also integrate backup software with
    ReaR. The following steps are used to create a rescue image of your Linux system
    along with a backup of the data, the time of this operation depends on the amount
    of data to saved. It is important to mention that this backup remains in an ISO
    file in the path the Administrator establishes. Initially, the necessary applications
    are installed to carry out this activity:


    ```bash

    [root@pruebas ~]# yum install rear genisoimage syslinux

    ```


    Once the software is installed, it is necessary to tell `rear` to generate the
    rescue disk and the system backup, editing its configuration file and adding the
    following statements:


    ```bash

    [root@pruebas ~]# vim /etc/rear/local.conf

    OUTPUT=ISO

    OUTPUT_URL=file:///root

    BACKUP=NETFS

    BACKUP_URL=iso:///root

    ```


    It is interesting before sending the backup to know the total size of the system
    to be backed up:


    ```bash

    [root@s1 rear]# df -h

    Filesystem      Type  Size Used Avail Use% Mounted on

    devtmpfs        tmpfs      15G   0   15G   0% /dev

    tmpfs           tmpfs      15G   0   15G   0% /dev/shm

    tmpfs           tmpfs      15G  9.2M  15G   1% /run

    tmpfs           tmpfs      15G   0   15G   0% /sys/fs/cgroup

    dev/mapper/ol-root xfs        44G  20G  25G  44% /*

    /dev/sda1       xfs      1014M  593M  422M  59% /boot

    tmpfs           tmpfs      2.9G  1.2M  2.9G   1% /run/user/42

    tmpfs           tmpfs      2.9G   0   2.9G   0% /run/user/0

    ```


    Following this, it is necessary to make the rescue and backup ISO of the Linux
    system (a single file), this ISO will remain in the path `/root/system-name`,
    as shown below:


    ```bash

    [root@s1 rear]# rear -d -v mkbackup

    Relax-and-Recover 2.4 / Git

    Using log file: /var/log/rear/rear-s1.log

    Using backup archive ''/tmp/rear.w0E22PfRdLwJCFg/tmp/isofs/root/backup.tar.gz''

    Creating disk layout

    Using guessed bootloader ''GRUB'' (found in first bytes on /dev/sda)

    Creating root filesystem layout

    Handling network interface ''ens18''

    ens18 is a physical device

    Handled network interface ''ens18''

    Skipping ''virbr0'': not bound to any physical interface.


    To log into the recovery system via ssh set up `/root/.ssh/authorized_keys` or
    specify `SSH_ROOT_PASSWORD`

    ```

