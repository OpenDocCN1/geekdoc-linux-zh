    # LINUX 系统审计


    审计 Linux 系统是记录相关安全事件的绝佳机会。这些审计允许 Linux 管理员监控其想要的文件、系统调用 (`syscall`)、记录用户执行的命令，以及监控与防火墙相关的问题。我们将执行审计任务的工具之一是
    `Audit`。


    系统调用 (`syscall - systemcall`) 指应用程序与 Linux 内核通信的方法，提供了文件管理、系统进程和设备的信息。Audit 允许你生成规则并将其写入系统控制台，规则不是持久的，但可以通过注册到
    `/etc/audit/audit.rules` 实现持久化。安装 `audit` 你可以如下所示操作：


    ```bash

    [root@pruebas ~]# yum install audit -y

    Updating Subscription Management repositories.

    Last metadata expiration check: 0:53:36 ago on Thu 04 Mar 2021 10:29:20 AM -05.

    Package audit-3.0-0.17.20191104git1c2f87.el8.x86_64 is already installed.

    Dependencies resolved.

    Nothing to do.

    Complete!

    ```

    正如你所见，软件包 `audit-3.0-0.17` 已经通过操作系统部署安装。该软件的配置文件位于 `/etc/audit/audit.conf`。

