    Next, the Cyrus-SASL tools are installed, which is an implementation of SASL that
    makes it easier for application developers to integrate authentication mechanisms
    in their applications:


    ```bash

    [root@sr1 postfix]# yum install cyrus-sasl-* -y


    Updating Subscription Management repositories.


    Last metadata expiration check: 0:08:43 ago on Thu 25 Mar 2021 11:59:53 AM EDT.

    ```


    The client is installed for sending emails and validation of the configuration:


    ```bash

    [root@sr1 postfix]# yum install mailx -y


    Updating Subscription Management repositories.


    Last metadata expiration check: 0:29:03 ago on Thu 25 Mar 2021 11:59:53 AM EDT.

    ```


    It is time to define the credentials that Postfix will use to authenticate with
    Gmail, this communication is encrypted but it is necessary to define the credentials
    (you must have the application password generated in the Google Account platform)
    in a text file from which Postfix will generate a table search, as shown below:


    ```bash

    [root@sr1 postfix]# vim sasl_passwd


    [smtp.gmail.com]:587 username@gmail.com:aplicationpassword


    [root@sr1 postfix]# chmod 600 /etc/postfix/sasl_passwd


    [root@sr1 postfix]# postmap hash:/etc/postfix/sasl_passwd

    ```


    This lookup table is captured in the file generated by the `postmap` command,
    as shown:


    ```bash

    [root@sr2 postfix]# ll sasl_passwd.db


    -rw-------. 1 root root 12288 Mar 25 13:46 sasl_passwd.db

    ```


    It is important to note that the `aplicationpassword` field is part of the Gmail
    security mechanisms; Do not define your Gmail password in this field, but rather
    the application password, which must be generated in the Google Account platform,
    as related below:


    ![](Image00035.jpg)


    It is necessary to configure the TLS encryption as a policy, for that the file
    `tls_policy` is created and registered in the Postfix lookup table:


    ```bash

    [root@sr1 postfix]# vim tls_policy


    [smtp.gmail.com]:587 encrypt


    [root@sr1 postfix]# postmap /etc/postfix/tls_policy

    ```


    It is time to edit the Postfix configuration file which is `main.cf`, however
    for backup reasons a copy of the original file is made:


    ```bash

    [root@sr1 postfix]# cp main.cf main.cf.original

    ```


    Editing `main.cf` validate that the following lines are related as indicated below:


    ```bash

    [root@sr1 postfix]# vim main.cf


    #smtpd_tls_cert_file = /etc/pki/tls/certs/postfix.pem

    #smtpd_tls_key_file = /etc/pki/tls/private/postfix.key

    #smtpd_tls_security_level = may

    smtp_tls_CApath = /etc/pki/tls/certs

    smtp_tls_CAfile = /etc/pki/tls/certs/ca-bundle.crt

    #smtp_tls_security_level = may

    meta_directory = /etc/postfix

    shlib_directory = /usr/lib64/postfix

    relayhost = [smtp.gmail.com]:587

    smtp_use_tls = yes

    smtp_sasl_auth_enable = yes

    smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd

    smtp_sasl_security_options = noanonymous

    smtp_sasl_tls_security_options = noanonymous

    smtp_tls_policy_maps = hash:/etc/postfix/tls_policy

    ```


    It is time to restart the `postfix` service and validate the functionality:


    ```bash

    [root@sr2 postfix]# systemctl restart postfix.service


    [root@sr2 postfix]# echo mailtest | mail -s mailtest fmestre@aptivalabs.com

    ```


    In a second console you will be able to validate that the emails are going out
    effectively until `smtp.gmail.com:587`, as shown:


    ```bash

    [root@sr1 ~]# tail -f /var/log/maillog

    Mar 25 13:15:42 sr1 postfix/pickup[8203]: 656C620AACA7: uid=0 from=<root>

    Mar 25 13:15:42 sr1 postfix/cleanup[8209]: 656C620AACA7: message-id=<20210325171542.656C620AACA7@sr1.aptivalabs.net>

    Mar 25 13:15:42 sr1 postfix/qmgr[8204]: 656C620AACA7: from=<root@sr1.aptivalabs.net>,
    size=449, nrcpt=1 (queue active)

    Mar 25 13:15:44 sr1 postfix/smtp[8211]: 656C620AACA7: to=<fmestre@aptivalabs.com>,
    relay=smtp.gmail.com[108.177.11.109]:587, delay=2.1, delays=0.03/0.05/0.9/1.1,
    dsn=2.0, status=sent (250 2.0 OK 161692544 70s2644.9)

    Mar 25 13:15:44 sr1 postfix/qmgr[8204]: 656C620AACA7: removed

    ```


    Within the communication of SMTP protocol, code `250` indicates that the mail
    has been sent.


    # INTEGRATION BETWEEN RED LINUX AND AMAZON WEB S3


    An functionality for those who combining On-Premise environments with Public Cloud
    services, especially with storage services that are available in those clouds,
    is to be able to carry out local assembly through it the data that is required
    in the storage. This time the Amazon Web Services S3 storage service will be used
    as a service to host the data generated on RHEL server, this is interesting for
    example to save in AWS S3 through daily backups generated by applications or dumps
    on databases, actually you need to save, in addition to taking advantage of this
    storage service such as life cycle of the data for optimization. The exercise
    to be developed shows us an object in AWS S3 in which data of any type can be
    stored; what will be executed in this procedure is that a RHEL server can save
    information in that bucket through the definition of local point. The following
    image shows the AWS S3 bucket called "aptiva":


    ![](Image00036.jpg)


    To install the package that will allow us to mount the AWS S3 bucket on the Linux
    server, it is necessary to install an additional repository since this application
    is not part of group supported by Red Hat. This repository is called EPEL. The
    EPEL 8 installation is performed, as shown:


    ```bash

    [root@sr2 ~]# yum install https://dl.fedoraproject.org/pub/el/el-release-latest-8.rpm


    Updating Subscription Management repositories.


    Last metadata expiration check: 1:59:33 ago on Thu 25 Mar 2021 01:41:29 PM EDT.

    el-release-latest-8.rpm                           54 kB/s | 22 kB  00:00


    Dependencies resolved.

    ========================================================

    Package             Architecture    Version            Repository      Size

    ========================================================

    Installing:

