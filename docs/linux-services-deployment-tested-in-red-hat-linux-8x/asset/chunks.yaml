    ```


    Before integrating the RHEL server to the domain, it is verified by different
    methods that the Linux server can reach the Microsoft Active Directory server:


    ```bash

    [root@loadbalancer samba]# ping ad1.aptivalabs.net

    PING ad1.aptivalabs.net (192.168.1.200) 56(84) bytes of data.

    64 bytes from ad1.aptivalabs.net (192.168.1.200): icmp_seq=1 ttl=128 time=0.809
    ms

    64 bytes from ad1.aptivalabs.net (192.168.1.200): icmp_seq=2 ttl=128 time=0.815
    ms

    64 bytes from ad1.aptivalabs.net (192.168.1.200): icmp_seq=3 ttl=128 time=0.777
    ms

    ^C

    --- ad1.aptivalabs.net ping statistics ---

