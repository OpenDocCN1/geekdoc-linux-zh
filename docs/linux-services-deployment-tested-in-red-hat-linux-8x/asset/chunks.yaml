    # Installing Virtual Machine by Virt-Manager


    The exercise that will be carried out corresponds to the installation of a virtual
    machine from the ISO `proxmox-ve_6.3-1.iso` located in the path `/tmp`. The installation
    of this virtual machine will be carried out on an XFS filesystem mounted (`/maquinas`)
    on an LVM structure. We start by verifying the existence of the installation ISO:


    ```bash

    [root@bd2 ~]# ll -h /tmp/proxmox-ve_6.3-1.iso

    -rw-r--r-- 1 root root 813M Mar 28 10:41 /tmp/proxmox-ve_6.3-1.iso

    ```


    The LVM structure is identified and created to host the virtual machines:


    ```bash

    [root@bd2 ~]# lsblk

    NAME MAJ:MIN RM SIZE TYPE

    --- salida omitida ---

    sdc 8:32 0 100G 0 disk

    [root@bd2 ~]# pvcreate /dev/sdc

    Physical volume "/dev/sdc" successfully created.

    [root@bd2 ~]# vgcreate mv /dev/sdc

    Volume group "mv" successfully created

    [root@bd2 ~]# lvcreate -l 100%free -n kvm mv

    Logical volume "kvm" created.

    ```


    The XFS file system is assigned and made available persistently:


    ```bash

    [root@bd2 ~]# mkfs.xfs /dev/mv/kvm

    [root@bd2 ~]# blkid | grep sdc >> /etc/fstab

    [root@bd2 ~]# mkdir /maquinas

    [root@bd2 ~]# vim /etc/fstab

    UUID="be8228b-ce08-4a38-bc1c-093284b1464c" /maquinas xfs defaults 0 0

    [root@bd2 ~]# udevadm settle

    [root@bd2 ~]# systemctl daemon-reload

    ```


    Once the process is finished, it is defined that `/maquinas` is a mounting point
    where you can save virtual machines created from the `virt-manager`, as shown
    below:


    ```bash

    [root@bd2 ~]# df -hT

    Filesystem Type Size Used Avail Use% Mounted on

    --- salida omitida ---

    /dev/mapper/mv-kvm xfs 100G 746M 100G 1% /maquinas

    ```


    Then through `virt-manager` the mount point is added, in `virt-manager` this is
    known as adding a "pool":


    ![](Image00013.jpg)


    In the upper tab you can see the `storage` option, having chosen, click on the
    `+` icon where a screen is presented that offers the possibility of naming the
    `pool` and choosing mounting point (Image00014.jpg). When adding the pool (filesystem
    in mount point) you should see a screen like (Image00015.jpg).


    Next, the virtual machine is created by searching for installation ISO in `/tmp`,
    defining `Debian 10` as the operating system to install (Image00016.jpg). It is
    necessary to establish RAM memory to use, as detailed (Image00017.jpg). Next,
    the virtual machine hosting site is defined, taking "Select or custom storage"
    (Image00018.jpg). We are presented with a screen where the `+` icon is chosen
    to create the virtual machine file (Image00019.jpg, Image00020.jpg). At the end
    of the process of defining the name and size of virtual machine file, you should
    see an image like the one above (Image00021.jpg) when you click on the `Volume`
    option you should see an image like (Image00022.jpg). The last screen will allow
    us to name the virtual machine and define network. Finally, clicking on the `Finish`
    button will start the installation of the preferred ISO, in this case Proxmox
    platform (Image00023.jpg).


