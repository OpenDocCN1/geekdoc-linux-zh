  raw: '> •  Read and write to any node in the cluster


    > •  Automatic member control, failing nodes are removed from the cluster


    > •  Automatic node joining


    > •  Parallel replication at the row level


    > •  Direct client connections (users can connect to cluster nodes and work with
    nodes directly while replication is running)


    Synchronous replication means that a server replicates a transaction at commit
    time, transmitting the write set associated with the transaction to all nodes
    in the cluster. The client (user application) connects directly to the database
    management system (DBMS), and experiences similar behavior to native MariaDB.
    Synchronous replication ensures that a change that occurs on one node in the cluster
    occurs on other nodes in the cluster at the same time.


    Therefore, synchronous replication has the following advantages over asynchronous:


    > •  There is no delay in propagation of changes between particular cluster nodes


    > •  All nodes in the cluster are always consistent


    > •  The latest changes are not lost if one of the cluster nodes crashes


    > •  Transactions on all nodes in the cluster run in parallel


    In order to build MariaDB Galera Cluster, the following packages must be installed
    on your system: mariadb-server-galera, mariadb-server and galera. The mariadb-server-galera
    package contains support files and scripts for MariaDB Galera Cluster. MariaDB
    upstream patches the mariadb-server package to include the Write Set Replication
    API (wsrep API). This API provides the interface between Galera replication and
    MariaDB. MariaDB upstream also patches the galera package to add full support
    for MariaDB. The galley package contains the Galera Replication Library tool and
    the Galera Arbitrator. Galera Replication Library provides all the replication
    functionality. Galera Arbitrator can be used as a member of the cluster participating
    in voting in split brain scenarios. However, Galera Arbitrator cannot participate
    in the actual replication.


    The exercise below displays the creation of a MariaDB multimaster cluster which
    will run on three servers described like this (replace names and addresses according
    to your test scenario):


    *   > 192.168.0.48 named sr1.aptivalabs (primer master)


