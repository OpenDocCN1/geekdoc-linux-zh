    `smbd` 服务使用 SMB 协议提供文件共享和打印服务，并负责限制资源以及连接到 Samba 的用户进行身份验证。


    `nmbd` 服务使用 NetBIOS over IPv4 协议提供主机名和 IP 解析。除了名称解析外，`nmbd` 服务还允许你浏览 SMB 网络以定位域、工作组、主机、文件共享和打印机。


    `winbind` 服务为名称交换服务（NSS - 网络服务切换器）提供接口，以便将本地和 AD（活动目录）用户及用户组集成到本地系统中。这允许域用户对由
    Samba 服务器或其他本地服务管理的服务进行身份验证。如果你将 Samba 配置为域成员，则必须在启动 `smbd` 服务之前启动 `winbind` 进程，否则本地系统将无法使用域用户和用户组。


    为了更深入地了解如何实现 Samba 作为文件服务器的部署，我们将使用 IP 地址为 `192.168.0.201` 的服务器作为 Samba 服务器；我们将模拟公司内部某些工作组（财务和人力资源
    - hr）的场景，他们需要对系统内的文件夹拥有权限以保存文件。访问这些资源的人将使用 Linux Red Hat、Microsoft Windows 10
    和 Apple Mac OSX 系统。这些人可以在个人文件夹和组文件夹中保存个人信息；在任何时候，他们都无法访问 Linux 器上的 Shell。


    ### Samba 安装


    练习从安装 Samba 开始，如下所示：


    ```bash

    [root@sr1 ~]# yum -y install samba


    正在更新订阅管理仓库。

