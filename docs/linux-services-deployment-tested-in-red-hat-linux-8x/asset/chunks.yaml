    M

    Complete!

    ```


    When Postfix was installed, the folder with the service configuration files (including
    `main.cf`, the Postfix configuration file) was created, as shown below:


    ```bash

    [root@sr1]# cd /etc/postfix/

    [root@sr1 postfix]# ll

    total 216

    -rw-r--r--. 1 root root 29374 Jan 26 10:39 main.cf

    ```

