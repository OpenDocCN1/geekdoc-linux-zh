    Status: "winbindd: ready to serve connections..."

    Tasks: 4 (limit: 186419)

    Memory: 10.8M

    CGroup: /system.slice/winbind.service

    ├─9302 /usr/sbin/winbindd --foreground --no-process-group

    ├─9307 /usr/sbin/winbindd --foreground --no-process-group

    ├─9365 /usr/sbin/winbindd --foreground --no-process-group

    └─9367 /usr/sbin/winbindd --foreground --no-process-group


    [root@loadbalancer samba]# systemctl enable winbind --now

    ```


    Already as a member of the domain we list the integration parameters:


    ```bash

    [root@loadbalancer ~]# realm list

    aptivalabs.net

    type: kerberos

    realm-name: APTIVALABS.NET

    domain-name: aptivalabs.net

    configured: kerberos-member

    server-software: active-directory

    client-software: winbind

    required-package: oddjob-mkhomedir

    required-package: oddjob

    required-package: samba-winbind-clients

    required-package: samba-winbind

    required-package: samba-common-tools

    login-formats: APTIVALABS\%U

    login-policy: allow-any-login

    ```


    To verify established connectivity, it is time to list users in Microsoft Active
    Directory as shown:


    ```bash

    [root@loadbalancer samba]# wbinfo -u

    APTIVALABS\administrator

    APTIVALABS\guest

    APTIVALABS\krbtgt

    ```


    The groups defined in Windows Server are:


    ```bash

    [root@loadbalancer samba]# wbinfo -g

    APTIVALABS\domain computers

    APTIVALABS\domain controllers

    APTIVALABS\schema admins

    APTIVALABS\enterprise admins

    APTIVALABS\cert publishers

    APTIVALABS\domain admins

    APTIVALABS\domain guests

    APTIVALABS\group owners

    APTIVALABS\ras servers

    APTIVALABS\allowed rodc password group

    APTIVALABS\denied rodc password group

    APTIVALABS\read-only domain controllers

    APTIVALABS\enterprise read-only domain controllers

    APTIVALABS\cloneable domain controllers

    APTIVALABS\protected users

    APTIVALABS\key admins

    APTIVALABS\enterprise key admins

    APTIVALABS\dns

    APTIVALABS\dnsproxy

    APTIVALABS\dhcp users

    ```


    In the following way it is possible to know the identity of Windows Server users,
    it could even be registered in the system with the `Administrator`:


    ```bash

    [root@loadbalancer samba]# getent passwd "ad1\Administrator"

    AD1\administrator*:10000::/home/administrator@AD1:/bash


    [root@loadbalancer samba]# su "ad1\Administrator"

    Creating home directory for AD1\administrator.

    [AD1\administrator@loadbalancer]$ id

    uid=10000(AD1\administrator) gid=10000(AD1\none) groups=10000(AD1\none) context=unconfined_u:unconfined_r:unconfined_t:s0-s0:c1023

    [AD1\administrator@loadbalancer]$ exit

    ```


    Within Microsoft Active Directory, the user `jarus` is created to verify it can
    be listed on the Linux server, as shown:


    ```bash

    [root@loadbalancer samba]# wbinfo -u

    APTIVALABS\administrator

    APTIVALABS\guest

    APTIVALABS\krbtgt

    APTIVALABS\jarus

    ```


    We take the opportunity to learn a little more about the identity of this user
    and register within the Linux system:


    ```bash

    [root@loadbalancer samba]# getent passwd "APTIVALABS\jarus"

    APTIVALABS\jarus*:2001106:200513::/home/jarus@APTIVALABS:/bash


    [root@loadbalancer samba]# su "APTIVALABS\jarus"

    Creating home directory for APTIVALABS\jarus.

    [APTIVALABS\jarus@loadbalancer]$ id

    uid=2001106(APTIVALABS\jarus) gid=200513(APTIVALABS\domain users) groups=200513(APTIVALABS\domain
    users),2001106(APTIVALABS\jarus) context=unconfined_u:unconfined_r:unconfined_t:s0-s0:c1023

    [APTIVALABS\jarus@loadbalancer]$ exit

    ```


    Finally, in the folder `/root` we find a file called `credentials.smb` to which
    the permissions will be established so that users and groups created in Microsoft
    Windows Server can act on it, as evidenced:


    ```bash

    [root@loadbalancer]# ll

    total 12

    -rw-r--r--. 1 root root  28 Mar 24 16:35 credentials.smb


    [root@loadbalancer]# chown "APTIVALABS\Administrator" "APTIVALABS\Domain Users"
    /root/credentials.smb

    [root@loadbalancer]# ll

    total 12

    -rw-r--r--. 1 APTIVALABS\administrator APTIVALABS\domain users  28 Mar 24 16:35
    credentials.smb

    ```


    # POSTFIX AND GMAIL RELAY IN RED HAT LINUX


    On many occasions it is necessary for a Linux server to be able to notify the
    events that occur in the system through e-mail; Some companies have purchased
    the Gmail console with their business account manager and prefer to use this service
    to send notifications from their servers. This exercise explains how to use a
    local mail service (`Postfix`) so that in its Gmail integration, Linux servers
    can send email safely.


    The procedure begins with the installation of the necessary applications to achieve
    the objective: `Postfix`, the `cypress-sasl` tools and the `mailx` application:


    ```bash

    [root@sr1]# yum install postfix -y

