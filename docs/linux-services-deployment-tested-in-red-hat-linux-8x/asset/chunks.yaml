    keyboard us\ntimezone America/Bogota --isUtc\nrootpw $1$wRe6mImL$eyda8JWudogBZ5pMTTVU9/\
    \ --iscrypted\n```\n\nActually, I will just output the full cleaned content based\
    \ on the instructions.\n\n[content]\nIt is necessary to copy the certificates\
    \ to the corresponding path for the `nginx` service to read them, this path must\
    \ be defined in the `nginx` configuration file:\n\n```bash\n[root@loadbalancer\
    \ ~]# cp localhost.crt /etc/pki/tls/certs/localhost.crt\n[root@loadbalancer ~]#\
    \ cp localhost.key /etc/pki/tls/private/localhost.key\n```\n\nThe configuration\
    \ file for the `nginx` service should look like this:\n\n```bash\n[root@loadbalancer\
    \ ~]# cat /etc/nginx/nginx.conf\n\nserver {\n    listen       443 ssl http2 default_server;\n\
    \    listen       [::]:443 ssl http2 default_server;\n    server_name  _;\n  \
    \  root         /usr/share/nginx/html;\n    ssl_certificate \"/etc/pki/tls/certs/localhost.crt\"\
    ;\n    ssl_certificate_key \"/etc/pki/tls/private/localhost.key\";\n    listen\
    \       80 default_server;\n    listen       [::]:80 default_server;\n    #server_name\
    \  _;\n    #server_name loadbalancer.aptivalabs.net;\n    #root         /usr/share/nginx/html;\n\
    \    # Load configuration files for the default server block.\n    include /etc/nginx/default.d/*.conf;\n\
    \    location / {\n    }\n    error_page 404 /404.html;\n    location = /40x.html\
    \ {\n    }\n    error_page 500 502 503 504 /50x.html;\n    location = /50x.html\
    \ {\n    }\n}\n```\n\nIt can be seen that the `nginx` service is left configured\
    \ to receive requests on ports 80 and 443 using the same publication path, which\
    \ is `/usr/share/nginx/html`. In the same way, the routes where `nginx` will look\
    \ for the certificates are listed. The operation indicates that it is necessary\
    \ to tell FirewallD to accept HTTPS requests in the default zone, the HTTP requests\
    \ were already added in FirewallD:\n\n```bash\n[root@loadbalancer ~]# firewall-cmd\
    \ --permanent --add-service=https\nsuccess\n[root@loadbalancer ~]# firewall-cmd\
    \ --reload\nsuccess\n```\n\nTo verify the configuration, run an HTTP client of\
    \ your choice and try to communicate with the server via HTTP, as shown below:\n\
    \n![](Image00028.jpg) \n\nNext, in your HTTP client, try to communicate via HTTPS:\n\
    \n![](Image00029.jpg) \n\n# UNATTENDED INSTALATIONS - KICKSTART\n\nIn an environment\
    \ where it is frequently necessary to perform RHEL 8 installations (a procedure\
    \ that could also be emulated in Oracle Linux and CentOS 8), it can be a bit tiring\
    \ to run a manual process when trying to install many systems; It may be the case,\
    \ for example, of installing an entire training environment for 20 students to\
    \ carry out Linux labor, or the case of a company that needs to implement a cluster\
    \ of services (storage, virtualization, etc.) where many Linux systems intervene.\n\
    \nFaced with this situation, the Kickstart tool allows generating an unattended,\
    \ automated installation, where it will only be necessary to tell the installer\
    \ where to find the file with the definition of the installation and the installer\
    \ executes this activity without the Administrator having the need to be present\
    \ according to the installation of each system.\n\nFor the development of this\
    \ activity it is necessary to execute the following steps:\n\n1. Generate the\
    \ kickstart file (installation definition file)\n2. Publish the kickstart file\
    \ to a visible resource\n3. Publish the installation package\n4. Start the installation\
    \ from an installation ISO\n\nIn the scenario of the exercise to be implemented,\
    \ it is related to the server with IP address `192.168.0.200`, which has the `Nginx`\
    \ service implemented and the RHEL 8 installation ISO mounted within the Nginx\
    \ publication path.\n\nThe first step consists of generating a kickstart file,\
    \ which is a text file where the required characteristics of the installation\
    \ are defined in its own format. The generation of this file can be done using\
    \ a tool that Red Hat provides for this purpose, which can be found at the URL\
    \ `https://access.redhat.com/labs/kickstartconfig/`. In the same way, RHEL 8 and\
    \ derived systems, once they have finished their installation, leave a file in\
    \ `/root` called `anaconda-ks.cfg` which is a kickstart file:\n\n```bash\n[root@loadbalancer\
    \ ~]# pwd\n/root\n[root@loadbalancer ~]# ll anaconda-ks.cfg\n-rw-------. 1 root\
    \ root 1275 Dec 17 17:21 anaconda-ks.cfg\n```\n\nIn the development of this exercise,\
    \ the tool `https://access.redhat.com/labs/kickstartconfig/` has been used, where\
    \ a file has been generated and downloaded to the RHEL 8 server; the generated\
    \ file defines the deployment of a “minimal installation” environment; the generated\
    \ file is detailed:\n\n```bash\n[root@loadbalancer html]# cat ks.cfg\nlang en_US\n\
    keyboard us\ntimezone America/Bogota --isUtc\nrootpw $1$wRe6mImL$eyda8JWudogBZ5pMTTVU9/\
    \ --iscrypted\n```\n\n(Note: The input text contained repetitive command blocks\
    \ at the end which have been consolidated for clarity and flow).\n\n# DEPLOYING\
    \ A FILESERVER WITH SAMBA\n\nSamba implements the Server Message Block (SMB) protocol\
    \ in RHEL. This protocol is used to access a server's resources such as shared\
    \ files and printers. The deployment of an SMB server such as Samba implies, as\
    \ appropriate, some of the services that Samba has associated with, such as `smbd`,\
    \ `nmbd` and `winbind`.\n"
