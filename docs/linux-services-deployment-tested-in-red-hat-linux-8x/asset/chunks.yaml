    \          PID    PPID  C STIME TTY          TIME CMD\n\n> --- salida omitida\
    \ ---\n\n> postgres    5973       1  0 09:41 ?        00:00:00 /usr/bin/postmaster\
    \ -D /var/lib/pgsql/data\n\n> postgres    5974    5973  0 09:41 ?        00:00:00\
