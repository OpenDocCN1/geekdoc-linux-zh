    After pressing the letter "e" (edit), locate the line with the word "linux" as
    the first word of a line; scroll to the end of that line and add a space, as shown
    below:


    ![](Image00001.jpg)


    This is the line where parameters are sent to the kernel. Go to the end of that
    line and add the expression `rd.break` to start in console mode. At the end press
    `CTRL + X` to boot.


    Once the system has booted, Linux has left us at a prompt similar to the one in
    the following image:


    ![](Image00002.jpg)


    At this moment the standard file system is mounted on `/sysroot` in read-only
    form, which makes it necessary to make changes to remount in read-write mode,
    as follows:


    ![](Image00003.jpg)


    It is necessary to do a Jail (caging of the file system, so that nobody bothers
    it while the operation is running) of the root file system (`/sysroot`) and then
    change the administrator password.


    It is necessary to create the empty file `/.autorelabel`. Following this, it is
    necessary to exit the mode where we were (chroot and GRUB mode) by typing `exit`
    twice:


    This will immediately cause the system to reboot, where initially SELinux will
    do the job of re-labeling the corresponding contexts where appropriate (files,
    directories, ports, and processes), if this operating system functionality is
    enabled.


    > KERN DATA DUMP FOR POST ANALYSIS


    To analyze why a system failed, you can use the `kdump` service to save the contents
    of system memory for later analysis. In this sub section we will see a brief introduction
    to `kdump` using the RHEL Web Console. `Kdump` is a service that provides a crash-dump
    mechanism for the kernel. The service allows you to save the contents of the memory.
    `Kdump` uses the `kexec` system call to boot into a second kernel without rebooting,
    thus capturing the content of the failing kernel and saving the data for analysis.
    The second kernel resides in a reserved part of memory.


    A kernel crash dump may be the only information available in the event of a system
    failure (a critical error), therefore ensuring that `kdump` is operational is
    important in mission critical environments. The procedure below shows you how
    to use the Kernel Dump tab in the Cockpit tool to configure the amount of memory
    reserved for the `kdump` kernel. The procedure also describes how to specify the
    destination location of the `vmcore` dump file and how to test its configuration.


    ![](Image00004.jpg)


    Once registered in the Cockpit, proceed to the Kernel Dump section:


    ![](Image00005.jpg) ![](Image00006.jpg)


    Through the following instructions you can see the result of this test dump (the
    "Test Configuration" button was pressed):


    ```bash

    [root@pruebas ~]# cd /var/crash/

    [root@pruebas ~]# ll

    total 0

    drwxr-xr-x. 2 root root 44 Feb 20 11:53 127.0.0.1-2021-02-20-09:53:46

    ```


