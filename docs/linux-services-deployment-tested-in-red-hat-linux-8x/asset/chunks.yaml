    \ NGINX 的 HTTP 负载均衡器\n\n本过程描述了将 `NGINX` 服务配置为 HTTP 负载均衡器，它可以将请求发送到不同的服务器，取决于哪个服务器的活动连接数最少，也就是说，它是关于确定负载组内哪台服务器健康状况更好以便发送\
    \ http 请求。在处理公司内部的 Web 应用程序时，这是一个非常有用的场景，并且对于该应用程序至少需要一个高可用方案。\n\n为了实现此功能，有以下服务器组：\n\
    \n* `192.168.1.201` = 负载均衡器\n* `192.168.1.202` = 服务器\n* `192.168.1.203` = 服务器\n\
    \n为了验证负载均衡器确实在工作，在服务器 `192.168.1.202` 和 `192.168.1.203` 上（运行着 `nginx` 服务）更改默认索引页（`index.html`），如下所示：\n\
    \n```bash\n[root@sr2 ~]# cd /usr/share/nginx/html/\n[root@sr2 html]# mv index.html\
    \ index.html.ori\n[root@sr2 html]# echo \"<h1>soy 192.168.1.202</h1>\" >> index.html\n\
    ```\n\n在 `192.168.1.203` 服务器上执行相同的指令：\n\n```bash\n[root@sr3 ~]# cd /usr/share/nginx/html/\n\
    [root@sr3 html]# mv index.html index.html.ori\n[root@sr3 html]# echo \"<h1>soy\
    \ 192.168.1.203</h1>\" >> index.html\n```\n\n在将执行负载均衡的服务器上，`nginx` 的配置文件应该如下：\n\
    \n```nginx\nhttp {\n    log_format  main  '$remote_addr - $remote_user [$time_local]\
    \ \"$request\" '\n    '$status $body_bytes_sent \"$http_referer\" '\n    '\"$http_user_agent\"\
    \ \"$http_x_forwarded_for\"';\n    access_log  /var/log/nginx/access.log  main;\n\
    \    sendfile            on;\n    tcp_nopush          on;\n    tcp_nodelay   \
    \      on;\n    keepalive_timeout   65;\n    types_hash_max_size 2048;\n    include\
    \             /etc/nginx/mime.types;\n    default_type        application/octet-stream;\n\
    \    # 从 /etc/nginx/conf.d. 加载模块化配置文件。\n    # 更多信息请参见 http://nginx.org/en/docs/ngx_core_module.html\n\
    \    include /etc/nginx/conf.d/*.conf;\n    upstream loadbalancer.aptivalabs.net\
    \ {\n        least_conn;\n        server 192.168.1.202;\n        server 192.168.1.203;\n\
    \    }\n    server {\n        listen       80 default_server;\n        listen\
    \       [::]:80 default_server;\n        server_name  _;\n        root       \
    \  /usr/share/nginx/html;\n        # 加载默认 server 的配置文件。\n        include /etc/nginx/default.d/*.conf;\n\
    \        #location / {\n        location / {\n            proxy_pass http://loadbalancer.aptivalabs.net;\n\
    \        }\n        error_page 404 /404.html;\n        location = /40x.html {\n\
    \        }\n        error_page 500 502 503 504 /50x.html;\n        location =\
    \ /50x.html {\n        }\n    }\n    # 启用 TLS 的服务器设置。\n    # server {\n    # \
    \   listen        443 ssl default_server;\n    #    listen       [::]:443 ssl\
    \ default_server;\n    #    server_name  _;\n    #    root         /usr/share/nginx/html;\n\
    \    #    ssl_certificate \"/etc/nginx/ssl.crt\";\n    #    ssl_certificate_key\
    \ \"/etc/nginx/ssl.key\";\n    #    ssl_session_cache shared;\n    #    ssl_session_timeout\
    \ 10m;\n    #    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;\n    # }\n}\n```\n\n`TLS`\
    \ (Transport Layer Security) 是网络通信的加密方法，是 `SSL` 的继任。`TLS` 允许客户端验证服务器的身份，服务器也可以验证客户端的身份。\n\
    \n特性：\n\n* `TLS` 基于证书的概念。\n* 证书包含多个部分：公钥、服务器身份以及权威证书的签名。\n* 对应的私钥永远不会公开。\n* 用私钥加密的数据只能用公钥解密，反之亦然。\n\
    \n通信阶段涉及各种活动的发展；客户端和服务器双方双方的加密规则并交换随机位。客户端使用这些数据生成会话密钥，该密钥将用于更快的对称加密，其中加密和解密使用相同的密钥。为了确保此密钥不泄露，它将在使用服务器公钥加密后发送到服务器。\n\
    \n加密通信所需的证书在下方生成，如下：\n\n```bash\n[root@loadbalancer ~]# openssl req -x509 -out\
    \ localhost.crt -keyout localhost.key -newkey rsa:2048 -nodes -sha256 -subj '/CN=localhost'\
    \ -extensions EXT -config <( \\\nprintf \"[dn]\\nCN=localhost\\n[req]\\ndistinguished_name\
    \ = dn\\n[EXT]\\nsubjectAltName=DNS:localhost\\nkeyUsage=digitalSignature\\nextendedKeyUsage=serverAuth\"\
    )\n```\n\n"
- fmt: "\nIt is necessary to copy the certificates to the corresponding path for the\
    \ `nginx` service to read them, this path must be defined in the `nginx` configuration\
    \ file:\n\n```bash\n[root@loadbalancer ~]# cp localhost.crt /etc/pki/tls/certs/localhost.crt\n\
    [root@loadbalancer ~]# cp localhost.key /etc/pki/tls/private/localhost.key\n```\n\
    \nThe configuration file for the `nginx` service should look like this:\n\n```bash\n\
    [root@loadbalancer ~]# cat /etc/nginx/nginx.conf\n\nserver {\n    listen     \
    \  443 ssl http2 default_server;\n    listen       [::]:443 ssl http2 default_server;\n\
    \    server_name  _;\n    root         /usr/share/nginx/html;\n    ssl_certificate\
    \ \"/etc/pki/tls/certs/localhost.crt\";\n    ssl_certificate_key \"/etc/pki/tls/private/localhost.key\"\
    ;\n    listen       80 default_server;\n    listen       [::]:80 default_server;\n\
    \    #server_name  _;\n    #server_name loadbalancer.aptivalabs.net;\n    #root\
    \         /usr/share/nginx/html;\n    # Load configuration files for the default\
    \ server block.\n    include /etc/nginx/default.d/*.conf;\n    location / {\n\
    \    }\n    error_page 404 /404.html;\n    location = /40x.html {\n    }\n   \
    \ error_page 500 502 503 504 /50x.html;\n    location = /50x.html {\n    }\n}\n\
    ```\n\nIt can be seen that the `nginx` service is left configured to receive requests\
    \ on ports 80 and 443 using the same publication path, which is `/usr/share/nginx/html`.\
    \ In the same way, the routes where `nginx` will look for the certificates are\
    \ listed. The operation indicates that it is necessary to tell FirewallD to accept\
    \ HTTPS requests in the default zone, the HTTP requests were already added in\
    \ FirewallD:\n\n```bash\n[root@loadbalancer ~]# firewall-cmd --permanent --add-service=https\n\
    success\n[root@loadbalancer ~]# firewall-cmd --reload\nsuccess\n```\n\nTo verify\
    \ the configuration, run an HTTP client of your choice and try to communicate\
    \ with the server via HTTP, as shown below:\n\n![](Image00028.jpg) \n\nNext, in\
    \ your HTTP client, try to communicate via HTTPS:\n\n![](Image00029.jpg) \n\n\
    # UNATTENDED INSTALATIONS - KICKSTART\n\nIn an environment where it is frequently\
    \ necessary to perform RHEL 8 installations (a procedure that could also be emulated\
    \ in Oracle Linux and CentOS 8), it can be a bit tiring to run a manual process\
    \ when trying to install many systems; It may be the case, for example, of installing\
    \ an entire training environment for 20 students to carry out Linux labor, or\
    \ the case of a company that needs to implement a cluster of services (storage,\
    \ virtualization, etc.) where many Linux systems intervene.\n\nFaced with this\
    \ situation, the Kickstart tool allows generating an unattended, automated installation,\
    \ where it will only be necessary to tell the installer where to find the file\
    \ with the definition of the installation and the installer executes this activity\
    \ without the Administrator having the need to be present according to the installation\
    \ of each system.\n\nFor the development of this activity it is necessary to execute\
    \ the following steps:\n\n1. Generate the kickstart file (installation definition\
    \ file)\n2. Publish the kickstart file to a visible resource\n3. Publish the installation\
    \ package\n4. Start the installation from an installation ISO\n\nIn the scenario\
    \ of the exercise to be implemented, it is related to the server with IP address\
    \ `192.168.0.200`, which has the `Nginx` service implemented and the RHEL 8 installation\
    \ ISO mounted within the Nginx publication path.\n\nThe first step consists of\
    \ generating a kickstart file, which is a text file where the required characteristics\
    \ of the installation are defined in its own format. The generation of this file\
    \ can be done using a tool that Red Hat provides for this purpose, which can be\
    \ found at the URL `https://access.redhat.com/labs/kickstartconfig/`. In the same\
    \ way, RHEL 8 and derived systems, once they have finished their installation,\
    \ leave a file in `/root` called `anaconda-ks.cfg` which is a kickstart file:\n\
    \n```bash\n[root@loadbalancer ~]# pwd\n/root\n[root@loadbalancer ~]# ll anaconda-ks.cfg\n\
    -rw-------. 1 root root 1275 Dec 17 17:21 anaconda-ks.cfg\n```\n\nIn the development\
    \ of this exercise, the tool `https://access.redhat.com/labs/kickstartconfig/`\
    \ has been used, where a file has been generated and downloaded to the RHEL 8\
    \ server; the generated file defines the deployment of a “minimal installation”\
    \ environment; the generated file is detailed:\n\n```bash\n[root@loadbalancer\
