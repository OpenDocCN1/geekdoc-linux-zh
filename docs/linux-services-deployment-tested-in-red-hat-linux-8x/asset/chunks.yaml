    \ was generated by a syscall to the kernel.\n\ntype=CWD → This type is used to\
    \ record the working directory from which the process that invoked the specified\
    \ system call in which the first record was executed.\n\ntype=PATH → An audit\
    \ event contains a PATH record for each path that is passed to the syscall as\
    \ an argument. In this audit event, only one path (/etc/ssh/sshd_config) was used\
    \ as an argument.\n\ntype=PROCTITLE →   the PROCTITLE value specifies that this\
    \ record provides the command that triggered this audit event, this number is\
    \ in hexadecimal. A look at this command could expand the report a bit more:\n\
    \n> [root@pruebas ~]# ausearch -i | grep PROCTITLE\n\n> ---\n\n> type=PROCTITLE\
    \ msg=audit(03/04/21 14:36:39.538:116) : proctitle= **cat /etc/ssh/sshd_config**\n\
    \nWe can see that the command that generated the security event was the \"cat\
    \ /etc/ssh/ sshd_config\".\n\nYou could create various audit rules on important\
    \ files on your file system, as well as rules based on auditing system calls by\
    \ applications, how you use Audit depends on the scenario you want to contemplate.\
    \ Some example rules could be the following:\n\n> [root@pruebas ~]# auditctl -w\
    \ /etc/passwd -p wa -k passwd_changes\n\n> [root@pruebas ~]# auditctl -w /etc/selinux/\
    \ -p wa -k selinux_changes\n\n> [root@pruebas ~]# auditctl -a always,exit -F arch=b64\
    \ -S adjtimex -S settimeofday -k time_change\n\nThe last statement tells Audit\
    \ to raise an audit event every time an application uses the \"system calls\"\
    \ called \"adjtimex\" and \"settimeofday\" on systems that use 64-bit architectures.\
    \ To list the rules uploaded to Audit you could send the following instruction:\n\
    \n> [root@pruebas ~]# auditctl -l\n\n> -w /etc/passwd -p wa -k passwd_changes\n\
    \nTo delete a temporary rule made with Autid look at the following instructions:\n\
    \n> [root@pruebas ~]# auditctl -l\n\n> -w /etc/passwd -p wa -k passwd_changes\n\
    \n> [root@pruebas ~]# auditctl -W /etc/passwd -p wa -k passwd_changes\n\n> [root@pruebas\
    \ ~]# auditctl -l\n\n> No rules\n\nIn the previous statement, the parameter \"\
