    to communicate with the Linux Kernel and have information related to the management
    of files, system processes and devices. Audit allows you to generate rules and
    write them in the system console, rules that are not persistent, but that can
    be, being registered in `/etc/audit/audit.rules`. To install `audit` you can do
    it in the following way:


