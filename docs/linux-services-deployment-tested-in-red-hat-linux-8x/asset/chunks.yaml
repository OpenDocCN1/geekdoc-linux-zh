    \ on;\n\n> #\n\n> #        # Load configuration files for the default server block.\n\
    \n> #        include /etc/nginx/default.d/*.conf;\n\n> #\n\n> #        location\
    \ / {\n\n> #        }\n\n> #\n\n> #        error_page 404 /404.html;\n\n> #  \
    \          location = /40x.html {\n\n> #        }\n\n> #\n\n> #        error_page\
    \ 500 502 503 504 /50x.html;\n\n> #            location = /50x.html {\n\n> #  \
    \      }\n\n> #    }\n\n> }\n\nThe lines \"upstream\" and \"location\" can then\
    \ be highlighted from the content of the file, which indicate that at the moment\
    \ that any user who tries to reach http://loadbalancer.aptivalabs.net (DNS record\
    \ previously configured pointing to 192.168\\. 1.201), the ip 192.168.1.201 will\
    \ balance the load of requests it receives; the lines are related:\n\n> upstream\
    \ loadbalancer.aptivalabs.net {\n\n> least_conn;\n\n> server 192.168.1.202;\n\n\
    > server 192.168.1.203;\n\n> }\n\n> location / {\n\n> proxy_pass http://loadbalancer.aptivalabs.net;\n\
    \n> }\n\nOne way to validate this configuration is by using the “curl” application,\
    \ as shown below:\n\n> [root@sr1 ~]# curl http://loadbalancer.aptivalabs.net\n\
    \n> <h1>soy 192.168.1.202</h1>\n\n> [root@sr1 ~]# curl http://loadbalancer.aptivalabs.net\n\
    \n> <h1>soy 192.168.1.203</h1>\n\n> [root@sr1 ~]# curl http://loadbalancer.aptivalabs.net\n\
    \n> <h1>soy 192.168.1.202</h1>\n\n> [root@sr1 ~]# curl http://loadbalancer.aptivalabs.net\n\
    \n> <h1>soy 192.168.1.203</h1>\n\n> [root@sr1 ~]# curl http://loadbalancer.aptivalabs.net\n\
    \n> <h1>soy 192.168.1.202</h1>\n\nIt can then be seen that by requesting the URL\
    \ http://loadbalancer.aptivalabs.net with the command \"curl\" the \"nginx\" service\
    \ always shows a different page. For a better visualization you could use any\
    \ HTTP client.\n\nENCRYPTING COMMUNICATION  WITH TLS\n\nTLS (Transport Layer Security)\
    \ is an encryption method for network communications and is the successor to SSL\
    \ (Secure Socket Layer). TLS allows the client to verify the identity of the server\
    \ and the server to verify the identity of the client.\n\nFeatures:\n\n*   > TLS\
    \ is based on the concept of certificates.\n\n*   > A certificate has multiple\
    \ parts: public key, server identity and a signature of an authority certificate\n\
    \n*   > The corresponding private key is never made public\n\n*   > Any data encrypted\
    \ with a private key can only be decrypted with a public key and vice versa\n\n\
    The stages of communication involve the development of various activities; the\
    \ client and the server agree on the encryption rules supported by both and exchange\
    \ random bits of data. The client uses this data to generate a session key, a\
    \ key that will be used for faster symmetric encryption, where the same key is\
    \ used for encryption and decryption. To ensure that this key is not compromised,\
    \ it is sent to the server encrypted with the server's public key.\n\nThe certificates\
    \ necessary to encrypt the communication are generated below, as shown:\n\n> [root@loadbalancer\
    \ ~]# openssl req -x509 **-out localhost.crt -keyout localhost.key**    -newkey\
    \ rsa:2048 -nodes -sha256   -subj '/CN=localhost' -extensions EXT -config <( \\\
    \n\n> printf \"[dn]\\nCN=localhost\\n[req]\\ndistinguished_name = dn\\n[EXT]\\\
    nsubjectAltName=DNS:localhost\\nkeyUsage=digitalSignature\\nextendedKeyUsage=serverAuth\"\
    )"
