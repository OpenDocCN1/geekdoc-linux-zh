    \        }\n        error_page 500 502 503 504 /50x.html;\n        location =\
    \ /50x.html {\n        }\n    }\n    # 启用 TLS 的服务器设置。\n    # server {\n    # \
    \   listen        443 ssl default_server;\n    #    listen       [::]:443 ssl\
    \ default_server;\n    #    server_name  _;\n    #    root         /usr/share/nginx/html;\n\
    \    #    ssl_certificate \"/etc/nginx/ssl.crt\";\n    #    ssl_certificate_key\
    \ \"/etc/nginx/ssl.key\";\n    #    ssl_session_cache shared;\n    #    ssl_session_timeout\
    \ 10m;\n    #    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;\n    # }\n}\n```\n\n`192.168.1.202`\
    \ 服务器已验证正在发布资源 `(test.html)`，如下所示：\n\n![](img/Image00026.jpg)\n\n接下来，在服务器 `192.168.1.201`\
    \ 上，我们编辑了 `nginx` 配置文件以添加以下行：\n\n```bash\n[root@pruebas html]# vim /etc/nginx/nginx.conf\n\
    \nlocation /test {\n    proxy_pass http://192.168.1.202/test.html;\n}\n```\n\n\
    接下来，在 SELinux 中启用布尔变量 `httpd_can_network_connect` 并重新启动服务：\n\n```bash\n[root@pruebas\
    \ html]# setsebool -P httpd_can_network_connect 1\n[root@pruebas html]# systemctl\
    \ restart nginx.service\n```\n\n为了在 HTTP 客户端上确认此设置，向 `http://192.168.1.201/test`\
    \ 发起请求，如下所示：\n\n![](img/Image00027.jpg)\n\n通过之前的练习，通过某种方式，实际上为客户端提供答案的服务器被隐藏了，即\
