    ```


    > 管理 pod、容器和镜像

    > 用法:

    > podman [options] [command]

    > 可用命令:

    > attach     附加运行容器

    > auto-update 根据自动更新策略更新容器

    > build      使用 Containerfile 中的指令构建镜像

    > commit     基于更改的容器创建新镜像

    > container  管理容器

    > cp         在容器和本地文件之间复制文件/文件夹

    > create     创建但不启动容器

