    --

    LOCK TABLES `alumnos` WRITE;

    /*!40000 ALTER TABLE `alumnos` DISABLE KEYS;

    INSERT INTO `alumnos` VALUES (''Fabian Mestre'',1),(''Juana Mestre'',0),(''Carlos
