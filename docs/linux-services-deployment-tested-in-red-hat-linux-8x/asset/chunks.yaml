    \nOnce this process is finished, the system reboots and starts in its normal operation,\
    \ equal to the moment when the `rear -v mkbackup` was generated.\n\n# Installing\
    \ VIRTUALIZATION CAPABILITIES (KVM / VIRT-MANAGER)\n\nIn the following material\
    \ you will see how to convert a RHEL 8 host into a thick Virtualization hypervisor.\
    \ It is important to clarify that `libvirt` is what makes all the magic around\
    \ Virtualization happen, from there it is that tools such as `virsh`, `virt-manager`,\
    \ `Cockpit` and `OVirt`, can do their job.\n\nSince version 2.6 of the Linux kernel,\
    \ virtualization functionalities are already integrated, it is not necessary to\
    \ install a new kernel to have these capabilities.\n\nThe exercise below first\
    \ shows a preflight on the host processor, to establish whether or not it is possible\
    \ to Virtualize on it; This processor must support the active virtualization flags,\
    \ the flag being `vmx` for Intel processors and `svm` for AMD processors. If any\
    \ of these flags are present, it is possible to virtualize on the host. Once the\
    \ flags are validated, we proceed with the initial installation of `libvirt` and\
    \ then continue with the Hypervisor and client functionalities, which in this\
    \ case is the `virt-manager`. The procedure used to perform the installation is\
    \ as follows:\n\n```\n[root@pruebas ~]# yum groupinfo Virtualization*\nUpdating\
    \ Subscription Management repositories.\nLast metadata expiration check: 0:12:38\
    \ ago on Sun 21 Mar 2021 12:13:24 PM.\nEnvironment Group: Virtualization Host\n\
    Description: Minimal virtualization.\nMandatory Groups: Base, Standard, Virtualization\
    \ Hypervisor\nOptional Groups: Debugging Tools, Network File System\nVirtualization\
    \ Platform: Virtualization Hypervisor\nDescription: Smallest possible virtualization\
    \ host.\nMandatory Packages: libvirt, qemu-kvm\nGroup: Virtualization Client\n\
    Description: Clients for installing and managing instances.\nMandatory Packages:\
    \ gnome-boxes, virt-install, virt-manager, virt-viewer, virt-top\nGroup: Virtualization\
    \ Tools\nDefault Packages: libguest-tools-c\nDescription: Tools for offline image\
    \ management.\nDefault Packages: libguestfs, virtio-win, libguestfs-inspect-icons,\
    \ libguestfs-java, libguestfs-tools\nGroup: Virtualization Platform\nDescription:\
    \ Provides an interface for accessing virtualized guests and containers.\nMandatory\
    \ Packages: libvirt, libvirt-client, fence-virtd-libvirt, fence-virtd-multicast\n\
    ```\n\nThe virtualization flag is checked on the processor:\n\n```\n[root@pruebas\
    \ ~]# cat /proc/cpuinfo\nprocessor : 0\ncpuid : 11\nwp : yes\nflags : fpu vme\
    \ pse tsc msr pae mce cx8 apic sep mtrr pge cmov pat pse36 clflush mmx fxsr sse\
    \ sse2 nx pdpe1gb rdtscp lm constant_tsc arch_perf rep_good nopl topology cpuid\
    \ tsc_known_freq pni pclmqdq ssse3 cx16 pcid sse4_1 sse4_2 x2apic popcnt tsc_deadline_timer\
    \ aes vmx lahf cpuid_fault pti tsc_adjust umip arch_capabilities\n```\n\nAnother\
    \ way to validate if the host has the capabilities to virtualize is:\n\n```\n\
    [root@pruebas ~]# virt-host-validate\nQEMU: Checking for hardware virtualization\
    \ : PASS\nQEMU: Checking if device /dev/vhost-net exists : PASS\nQEMU: Checking\
    \ if device /dev/net/tun exists : PASS\nQEMU: Checking for cgroup 'cpu' controller\
