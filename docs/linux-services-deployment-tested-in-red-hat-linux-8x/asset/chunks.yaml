- fmt: "\n- Read and write to any node in the cluster\n- Automatic member control,\
    \ failing nodes are removed from the cluster\n- Automatic node joining\n- Parallel\
    \ replication at the row level\n- Direct client connections (users can connect\
    \ to cluster nodes and work with nodes directly while replication is running)\n\
    \nSynchronous replication means that a server replicates a transaction at commit\
    \ time, transmitting the write set associated with the transaction to all nodes\
    \ in the cluster. The client (user application) connects directly to the database\
    \ management system (DBMS), and experiences similar behavior to native MariaDB.\
    \ Synchronous replication ensures that a change that occurs on one node in the\
    \ cluster occurs on other nodes in the cluster at the same time.\n\nTherefore,\
    \ synchronous replication has the following advantages over asynchronous:\n\n\
    - There is no delay in propagation of changes between particular cluster nodes\n\
    - All nodes in the cluster are always consistent\n- The latest changes are not\
    \ lost if one of the cluster nodes crashes\n- Transactions on all nodes in the\
    \ cluster run in parallel\n\nIn order to build MariaDB Galera Cluster, the following\
    \ packages must be installed on your system: `mariadb-server-galera`, `mariadb-server`\
    \ and `galera`. The `mariadb-server-galera` package contains support files and\
    \ scripts for MariaDB Galera Cluster. MariaDB upstream patches the `mariadb-server`\
    \ package to include the Write Set Replication API (`wsrep API`). This API provides\
    \ the interface between Galera replication and MariaDB. MariaDB upstream also\
    \ patches the `galera` package to add full support for MariaDB. The `galley` package\
    \ contains the Galera Replication Library tool and the Galera Arbitrator. Galera\
    \ Replication Library provides all the replication functionality. Galera Arbitrator\
    \ can be used as a member of the cluster participating in voting in split brain\
    \ scenarios. However, Galera Arbitrator cannot participate in the actual replication.\n\
    \nThe exercise below displays the creation of a MariaDB multimaster cluster which\
    \ will run on three servers described like this (replace names and addresses according\
    \ to your test scenario):\n\n- `192.168.0.48` named `sr1.aptivalabs` (primer master)\n\
    - `192.168.0.49` named `sr2.aptivalabs`\n- `192.168.0.50` named `sr3.aptivalabs`\n\
    \nIt is necessary to execute the following instructions on all the nodes that\
    \ will be part of the cluster:\n\n```\n[root@sr1 ~]# yum module install mariadb:10.3/galera\
    \ -y\n[root@sr1 ~]# systemctl enable mariadb --now\n[root@sr1 ~]# mysql_secure_installation\n\
    [root@sr1 ~]# firewall-cmd --add-service=mysql --permanent\n[root@sr1 ~]# firewall-cmd\
    \ --add-port={3306/tcp,4567/udp,4567/tcp,4568/tcp,4444/tcp} --permanent\n[root@sr1\
    \ ~]# firewall-cmd --reload\n[root@sr1 ~]# firewall-cmd --list-all\n```\n\nFor\
    \ ease of operation, in each node of the cluster add the following lines to the\
    \ `/etc/hosts` file:\n\n```text\n192.168.0.48 sr1 sr1.aptivalabs\n192.168.0.49\
    \ sr2 sr2.aptivalabs\n192.168.0.50 sr3 sr3.aptivalabs\n```\n\nIn each of the three\
