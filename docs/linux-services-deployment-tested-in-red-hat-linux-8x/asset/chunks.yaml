    # POSTGRESQL – INSTALLATION AND DEPLOYMENT


    It is recurrent in the corporate scenario to find information systems deployed
    on application servers that perform transactions on local databases, in this case
    databases installed and configured on RHEL 8 or some derived system. In this exercise,
    the PostgreSQL version 10 database engine will be deployed, which is the default
    stream since there is the option to install version 9.6 or 12.


    We start by changing the hostname:


    ```bash

    [root@loadbalancer ~]# hostnamectl set-hostname bd1.aptivalabs.net

    [root@loadbalancer ~]# exit

    logout

    $ ssh -l root 192.168.0.200

    [root@bd1 ~]#

    ```


