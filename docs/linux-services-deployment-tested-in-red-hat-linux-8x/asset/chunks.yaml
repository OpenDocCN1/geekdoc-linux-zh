    The following observations are carried out:


    * If the additional nodes are rebooted and the first master is kept on, when the
    additional nodes come back they will connect to the cluster.

    * If the first master is turned off, the cluster still remains alive in the two
    additional nodes.

    * When the master is turned off and any of the nodes are in service, the master
    starts without problem.

    * In a cluster of 3, the first master and one of the nodes is turned off, and
    one node is left on; when the nodes are turned off, the cluster starts without
    problems.

    * In a cluster of 3, when the three nodes are turned off and on, or restarted,
    when starting the cluster nodes, none of the `mariadb` services come up, therefore
    the cluster is not deployed and we get into problems. At the date of preparation
    of this manual, an attempt was made to recover the cluster of three without any
    success; We will continue to try to detail this anomaly presented, the correct
    way to recover the cluster will be documented and published.


    # CREATING A REPOSITORY WITH LOCAL MEDIA


    As follows, it is possible to establish a local software repository using the
    ISO image with which you installed the operating system:


    1. Create the `/repo` folder on your system:

    ```bash

    [root@pruebas ~]# mkdir /repo

    ```


    2. Insert the installation media, be it USB or DVD.

    ```bash

    [root@pruebas ~]# lsblk

    NAME            MAJ:MIN RM  SIZE RO TYPE MOUNTPOINT

    sda             8:0    0   50G  0 disk

    |-sda1          8:1    0    1G  0 part /boot

    `-sda2          8:2    0   49G  0 part

    |-rhel-root 253:0    0   44G  0 lvm  /

    `-rhel-swap 253:1    0    5G  0 lvm  [SWAP]

    sr0            11:0    1   8.8G  0 rom

    ```

    After verifying the devices recognized by the Linux system, we are told that the
    `/dev/sr0` device is the one with the installation ISO.


    3. **Add the following line** to the `/etc/fstab` file: `"/dev/sr0/repo iso9660
    defaults 0 0"` and then type `mount -a`:

    ```bash

    [root@pruebas ~]# echo "/dev/sr0 /repo iso9660 defaults 0 0" >> /etc/fstab

    [root@pruebas ~]# cat /etc/fstab

    #

    # /etc/fstab

    # Created by anaconda on Thu Dec 17 22:08:06 2020

    #

    …

    …

    /dev/sr0 /repo iso9660 defaults 0 0

    [root@pruebas ~]# mount -a

    mount: /repo: WARNING: device write-protected, mounted read-only.

    ```

    This last message tells us that the `/repo` folder is available as read-only.
    If a list of the folder is made, we will obtain the following information:

    ```bash

    [root@pruebas ~]# ll /repo/

    total 48

    dr-xr-xr-x. 4 root root  2048 Oct  9 05:40 AppStream

    dr-xr-xr-x. 4 root root  2048 Oct  9 05:40 BaseOS

    dr-xr-xr-x. 3 root root  2048 Oct  9 05:40 EFI

    -r--r--r--. 1 root root  8266 Oct  9 05:40 EULA

    -r--r--r--. 1 root root  18092 Oct  9 05:40 GPL

    -r--r--r--. 1 root root  1669 Oct  9 05:40 RPM-GPG-KEY-redhat-beta

    -r--r--r--. 1 root root  5134 Oct  9 05:40 RPM-GPG-KEY-redhat-release

    -r--r--r--. 1 root root   796 Oct  9 05:40 TRANS.TBL

    -r--r--r--. 1 root root  1455 Oct  9 05:40 extra_files.json

    dr-xr-xr-x. 3 root root  2048 Oct  9 05:40 images

    dr-xr-xr-x. 2 root root  2048 Oct  9 05:40 isolux

    -r--r--r--. 1 root root   103 Oct  9 05:40 media.repo

    ```

    This `mount -a` permanently leaves the link between the `/repo` folder and the
    device on your system, in this case CD/DVD drive. If you remove this medium and
    enter, the `/repo` folder will show other information.


    4. Create a file in `/etc/yum.repos.d/` called `repo1.repo` and enter the following
    information:

    ```ini

    [BaseOS]

    name=BaseOS

    baseurl=file:///repo/BaseOS

    gpgcheck=0

    ```


    5. Create a file in `/etc/yum.repos.d/` called `repo2.repo` and enter the following
    information:

    ```ini

    [AppStream]

    name=AppStream

    baseurl=file:///repo/AppStream

    gpgcheck=0

    ```


    6. Type `yum repolist` to verify repository recognition:

    ```bash

    [root@pruebas yum.repos.d]# yum repolist

    Updating Subscription Management repositories.

    repo id                              name

    AppStream                           AppStream

    BaseOS                              BaseOS

    rhel-8-for-x86_64-appstream-rpms   Hat Enterprise Linux 8 for x86_64 - AppStream
    (RPMs)

    rhel-8-for-x86_64-baseos-rpms      Hat Enterprise Linux 8 for x86_64 - BaseOS
    (RPMs)

    ```

    Although repositories are being repeated in this exercise, this scenario is ideal
    when you lose Internet connection and cannot reach the official Red Hat repositories
    because you will be using the software that comes in the installation ISO.

    ```bash

    [root@pruebas yum.repos.d]# yum repfo

    Updating Subscription Management repositories.

    BaseOS                                                              44 MB/s |
    2.3 MB      00:00

    AppStream                                                            60 MB/s |
    6.3 MB      00:00

    Last metadata expiration check: 0:00:01 ago on Wed 24 Feb 2021 09:35:55 AM -05.

    Repo-id            : AppStream

    Repo-name          : AppStream

    Repo-revision      : 160223

    ```


    # AUDIT IN LINUX SYSTEMS


    Auditing Linux systems represents a great opportunity to record events related
    to system security. These audits allow a Linux Administrator to monitor access
    to the files he decides, to system calls (`syscall`), to record commands executed
    by a user, as well as to monitor issues related to the system''s firewall. One
    of the tools that we will use to carry out auditing tasks will be `Audit`.


