  trans: "\n\n```bash\n[root@sr2 s3fs-fuse]# echo \"AKIA2IXLZ7Q4EDGEEC73:W0c/PWvHbn8liNj2BNN869JhdvPaRtXj8SSsmm1J\"\
    \ > /etc/passwd-s3fs\n```\n\n我们验证文件的创建情况：\n\n```bash\n[root@sr2 s3fs-fuse]# ll\
    \ /etc/passwd-s3fs\n-rw-r--r--. 1 root root 62 Mar 25 15:22 /etc/passwd-s3fs\n\
    [root@sr2 s3fs-fuse]# cat /etc/passwd-s3fs\nAKIA2IXLZ7Q4EDGEEC73:W0c/PWvHbn8liNj2BNN869JhdvPaRtXj8SSsmm1J\n\
    ```\n\n你需要为文件的所有者设置读和写权限：\n\n```bash\n[root@sr2 s3fs-fuse]# chmod 600 /etc/passwd-s3fs\n\
    ```\n\n创建了访问 AWS S3 桶的挂载点：\n\n```bash\n[root@sr2 s3fs-fuse]# mkdir /mnt/aptiva\n\
    ```\n\n在 `/etc/fstab` 中定义了存储桶的持久挂载并进行了验证，如下所示：\n\n```bash\n[root@sr2 s3fs-fuse]#\
    \ echo \"s3fs#aptiva /mnt/aptiva fuse _netdev,rw,nosuid,nodev,allow_other,nonempty\
    \ 0 0\" >> /etc/fstab\n[root@sr2 s3fs-fuse]# cat /etc/fstab\n#\n# /etc/fstab\n\
    # Created by anaconda on Thu Mar 18 14:56:05 2021\ns3fs#aptiva /mnt/aptiva fuse\
    \ _netdev,rw,nosuid,nodev,allow_other,nonempty 0 0\n```\n\n然后执行组装的相关活动：\n\n```bash\n\
    [root@sr2 s3fs-fuse]# udevadm settle\n[root@sr2 s3fs-fuse]# systemctl daemon-reload\n\
    [root@sr1 ~]# mount -a\n```\n\n一旦组装完成，使用以下指令进行验证：\n\n```bash\n[root@sr1 ~]# df\
    \ -hT\nFilesystem            Type              Size  Used Avail Use% Mounted on\n\
    --- salida omitida ---\ns3fs                  fuse.s3fs 256T     0  256T   0%\
    \ /mnt/aptiva\n```\n\n通过上一条指令可以详细看到挂载点已定义在 `/mnt/aptiva`，可用存储为 `256T`；此时，作为 Linux\
    \ 管理员，你将可以将数据放置在该挂载点中，请注意信息传输的质量和速度取决于你与服务商签订的互联网连接。S3 桶的内容如下：\n\n```bash\n[root@sr1\
    \ ~]# ll /mnt/aptiva/\ntotal 1581057\n-rw-r--r--. 1 root root          0 Feb 19\
    \  2020 1\n-rw-r--r--. 1 root root     136882 Feb 19  2020 archivo.tar\n-rw-r-----.\
    \ 1 root root      11894 Feb 19  2020 synologic.jpg\n```\n\n为了结束练习，将在挂载点内创建“tests”文件夹，并通过命令行界面创建空文件，此目的是为了验证数据确实已保存到\
    \ S3 桶中，详细所示所示：\n\n```bash\n[root@sr1 ~]# cd /mnt/aptiva/\n[root@sr1 aptiva]#\
    \ mkdir pruebas\n[root@sr1 aptiva]# cd pruebas/\n[root@sr1 pruebas]# touch 1 2\
    \ 3 4 5 6\n```\n\n展示 AWS Web 管理控制台的截图，当我们在两种场景中看到相同的数据时，可以验证练习结果是满意的：\n\n![](img/Image00037.jpg)\n\
    \n# POSTGRESQL – 安装与部署\n\n在企业场景中，经常会发现信息系统部署在应用服务器上，这些服务器在本地数据库上执行事务，在这种情况下，数据库是安装并配置在\
    \ RHEL 8 或其衍生系统上的。在本次练习中，将部署 PostgreSQL 10 版本数据库引擎，这是默认流，，因为还有安装版本 9.6 或 12 版本的选项。\n\
    \n我们从更改主机名开始：\n\n```bash\n[root@loadbalancer ~]# hostnamectl set-hostname bd1.aptivalabs.net\n\
    [root@loadbalancer ~]# exit\nlogout\n$ ssh -l root 192.168.0.200\n[root@bd1 ~]#\n\
    ```\n\n列出 PostgreSQL 模块的不同流：\n\n```bash\n[root@bd1 ~]# yum module list postgresql\n\
    Updating Subscription repositories.\nLast metadata check: 0:06 ago on Fri 26 Mar\
    \ 31:31 AM -05\nRed Enterprise Linux 8 for x86_64 (RPM)\nName                \
    \ Stream          Profiles        Summary\npostgresql            9.6         \
    \  [d]             PostgreSQL server and client\npostgresql            10    \
    \       [d]             PostgreSQL server and client\npostgresql            12\
    \                               \n```\n\n"
- fmt: "\nThe following instruction creates the table \"users\" and its respective\
    \ structure, then we will list this structure of the catalog:\n\n```sql\ntest=#\
    \ create table usuarios ( nombre varchar(30), clave varchar(10) );\n\nCREATE TABLE\n\
    \ntest=# select table_name,column_name,udt_name,character_maximum_length from\
    \ information_schema.columns where table_name = 'usuarios';\n\ntable_name | column_name\
    \ | udt_name | character_maximum_length\n------------+-------------+----------+--------------------------\n\
    usuarios   | nombre      | varchar  |                       30\nusuarios   | clave\
    \       | varchar  |                       10\n(2 rows)\n```\n\nThe following\
    \ instructions will insert records in the database and then list them:\n\n```sql\n\
    test=# insert into usuarios (nombre, clave) values ('Mariano','payaso');\nINSERT\
    \ 0 1\ntest=# insert into usuarios (nombre, clave) values ('Pablo','jfx344');\n\
    INSERT 0 1\ntest=# insert into usuarios (nombre, clave) values ('Ana','tru3fal');\n\
    INSERT 0 1\ntest=# select * from usuarios;\n\nnombre    clave\n---------+---------\n\
    Mariano | payaso\nPablo   | jfx344\nAna     | tru3fal\n(3 rows)\n```\n\nIt is\
    \ necessary to exit the PostgreSQL CLI:\n\n```sql\ntest=# \\q\n```\n\nA dump of\
    \ the database is generated below and the contents of the file are listed:\n\n\
    ```bash\n[postgres@bd1 ~]$ pg_dump test > /tmp/backup.sql\n[postgres@bd1 ~]$ cat\
    \ /tmp/backup.sql\n\n--\n-- PostgreSQL database dump\n--\n-- Dumped from database\
    \ version 10.15\n-- Dumped by pg_dump version 10.15\nSET statement_timeout = 0;\n\
    SET lock_timeout = 0;\n--- omited ---\n```\n\n# DATABASE RESTORATION EXERCISE\n\
    \nA common activity in PostgreSQL database administration is restoring a large\
    \ database, an activity that could take hours to implement. In the following exercise,\
    \ a backup made at the dump level will be restored, which has a size of 1.56;\
    \ To carry out this activity, a new database will be created in which the dump\
    \ will be restored, as shown below:\n\n```bash\n[postgres@bd1 ~]$ ll -h /tmp/BD-historico20180828.sql\n\
    -rw-r--r--. 1 root root 1.6G Mar 26 10:45 /tmp/BD-historico20180828.sql\n```\n\
    \nThe database called \"empresa\" is created:\n\n```bash\n[postgres@bd1 ~]$ createdb\
    \ empresa\n```\n\nThe restoration process is launched in the \"empresa\" database\
    \ of the previously generated dump:\n\n```bash\n[postgres@bd1 ~]$ pg_restore -d\
    \ empresa /tmp/BD-historico20180828.sql\n```\n\nOnce the restoration is complete,\
    \ it is verified that the tables have been created, as shown below:\n\n```bash\n\
    [postgres@bd1 ~]$ psql empresa\npsql (10.15)\nType \"help\" for help.\nempresa=#\
    \ \\d\nList of relations\nSchema |          Name          |   Type   |  Owner\n\
    --------+------------------------+----------+----------\npublic | cartera    \
    \     | table    | postgres\npublic | ciudades         | table    | postgres\n\
    public | departamentos       | table    | postgres\npublic | barrios         |\
    \ table    | postgres\n--- omited ---\n```\n\n# METADATA QUERY IN POSTGRESQL\n\
    \nOnce the restoration has been carried out, it is possible to ask the database\
    \ engine for information related to the spaces occupied in it, as is done in the\
    \ following instruction where it asks for the sizes of all the databases in the\
    \ engine:\n\n```sql\nempresa=# SELECT pg_database.datname, pg_size_pretty(pg_database_size(pg_database.datname))\
    \ AS SIZE FROM pg_database;\ndatname  |  size\n-----------+---------\npostgres\
    \ ​ | 7335 kB\ntest ​ | 7343 kB\ntemplate1 ​ | 7201 kB\ntemplate0 ​ | 7201 kB\n\
    empresa ​ | 15 GB\n```\n\nAs follows, the size of a specific database is queried:\n\
    \n```sql\nempresa=# SELECT pg_size_pretty( pg_database_size('empresa') );\npg_size_pretty\n\
    ----------------\n15 GB\n(1 row)\n```\n\nIn the following way we can see the size\
    \ of the tables in a database:\n\n```sql\nempresa=# SELECT  schemaname, tablename,pg_size_pretty(pg_total_relation_size(tablename::regclass::oid))\n\
    FROM    pg_tables\nWHERE  schemaname NOT('pg_catalog', 'information_schema');\n\
    \nschemaname |      tablename | pg_size_pretty\n------------+----------------+----------------\n\
    public | cartera         | 357 MB\npublic | ciudades         | 240 kB\npublic\
    \ | departamentos       | 608 kB\npublic | barrios         | 96 kB\n```\n\n# INSTALLING\
    \ POSTGRESQL IN SECONDARY FILESSTEM\n\nIn the following exercise PostgreSQL will\
    \ be installed using a different path for storage, the default path for creating\
    \ the cluster is `/var/lib/pgsql`, the path that will be used in this exercise\
    \ is `/pgsql-data`; For the development of this practice, a new disk (it will\
    \ appear as `/dev/sdb`) is added to the system which is taken to an LV formatted\
    \ with XFS and established on the `/pgsql-data` mount point; such preparation\
    \ is carried out as follows:\n\nThe 100GB disk will be taken to the LVM structure\
    \ is identified, as shown in the following:\n\n```bash\n[root@bd2 ~]# lsblk\n\
    NAME      MAJ:MIN RM SIZE TYPE MOUNTPOINT\nsdb       8:16  0   100G \n[root@bd2\
    \ ~]# pvcreate /dev/sdb\nPhysical volume \"/dev/sdb\" created.\n[root@bd2 ~]#\
    \ vgcreate datos /dev/sdb\nVolume group \"datos\" created.\n[root@bd2 ~]# lvcreate\
    \ -l 100%free -n bd2 datos\nLogical volume \"bd2\" created.\n[root@bd2 ~]# lvs\n\
    LV   VG   Attr           LSize     Pool Data%  Meta%  Move Cpy%Sync\nbd2  datos\
    \ -wi----- <100g\nroot rhel -wi---- <44g\nswap rhel -wi---- <5g\n```\n\nThe XFS\
    \ file system is mapped to the newly created logical device:\n\n```bash\n[root@bd2\
    \ ~]# mkfs.xfs /dev/datos/bd2\nmeta-data=/dev/datos/bd2 isize=512 agcount=4, agsize=655344\
    \ blks sectsz=512 attr=2, projid2bit=1\n```\n\n`/pgsql-data` is created as the\
    \ mount point of the previously created file system:\n\n```bash\n[root@bd2 ~]#\
    \ mkdir /pgsql-data\n```\n\nIt's time to persistently set the mount point to host\
    \ PostgreSQL data:\n\n```bash\n[root@bd2 ~]# blkid | grep bd2 >> /etc/fstab\n\
    [root@bd2 ~]# vim /etc/fstab\nUUID=\"f32b947b-5203-43dd-9751-c8198054207\" /pgsql-data\
    \ xfs defaults 0 0\n[root@bd2 ~]# udevadm settle\n[root@bd2 ~]# systemctl daemon-reload\n\
    [root@bd2 ~]# mount -a\n```\n\nThe mount point is verified to be available for\
    \ database initialization:\n\n```bash\n[root@bd2 ~]# df -hT\nFilesystem      \
    \     Type  Size  Used Avail Use% Mounted on\n/dev/mapper/datos-bd2 xfs   100G\
    \  746M  100G  1% /pgsql-data\n```\n\nIt is necessary to disable the RHEL module\
    \ that installs PostgreSQL because the installation will be done by adding the\
    \ official repository of the PostgreSQL developers:\n\n```bash\n[root@bd2 ~]#\
    \ yum module disable postgresql\n```\n\nThe official repository of the PostgreSQL\
    \ developers is installed:\n\n```bash\n[root@bd2 ~]# yum -y install https://download.postgresql.org/pub/repos/yum/reporms/EL-7-x86_64/pgdg-redhat-repo-latest.noarch.rpm\n\
    ```\n\nThe new system repository is displayed in `/etc/yum.repos.d/`; moving to\
    \ this path edits such repository file to only enable the PostgreSQL version 10\
    \ repo.\n\n```bash\n[root@bd2 ~]# cd /etc/yum.repos.d/\n[root@bd2 yum.repos.d]#\
    \ ll\ntotal 104\n-rw-r--r--. 1 root root  9738 Sep 24  2020 pgdg-redhat-all.repo\n\
    ```\n"
