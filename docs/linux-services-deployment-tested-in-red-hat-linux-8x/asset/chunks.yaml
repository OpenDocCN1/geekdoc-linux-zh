    \ necessary to open the ports in `FirewallD` to receive connection requests:\n\
    \n```\n[root@pruebas ~]# firewall-cmd --permanent --add-service=http\nsuccess\n\
    [root@pruebas ~]# firewall-cmd --reload\nsuccess\n```\n\nEnable the `nginx` service\
