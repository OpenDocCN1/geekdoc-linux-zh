    \ 包冲突，MariaDB 和 MySQL 数据库服务器无法在 Red Hat Enterprise Linux 8.0 上并列安装。随后将使用数据库超级用户（`root`）建立与数据库引擎的本地连接：\n\
    \n```bash\n[root@sr1 ~]# mysql -u root -p\nEnter password:\nWelcome to the MariaDB\
