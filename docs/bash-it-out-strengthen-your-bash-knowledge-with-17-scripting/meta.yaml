  pgno: 53
- img_proc: false
  md: '# The solution


    What was the problem?


    Date arithmetic is much more complicated that one might expect. I strongly discourage
    you from taking the path I used in my initial attempt: never do date and time
    calculations by yourself. If you really need an argument to convince you, think
    for example about issues with daylight saving time.


    That being said, which options do we still have? Any decent programming language
    should have some facilities to deal with time specific issues. Here we are using
    the Bash, and we have to rely on the date tool for that purpose.


    How to fix that?


    Converting date to quantities


    When faced with similar problems, the typical solution will be to convert the
    (human readable) date and time to some numeric *quantity*.


    Usually, we convert dates to a number of seconds (or milliseconds) since some
    reference time. Having that numeric quantity, we can now use classic arithmetics
    to add or remove homogeneous quantities (say remove 7200s — that is 2×60×60s —
    to obtain the date it was two hours ago). Finally, using the same facilities as
    in the initial step, we can convert back the result to a date-time format.


    ![](bbox=[0.401, 0.7, 0.589, 0.913])'
  merge: -1
  pgno: 54
- img_proc: false
  md: "In practice, in Unix-like systems, the reference date is usually 00:00:00 UTC\
    \ on 1 January 1970—sometimes known as [Unix Epoch](#). And the date utility does\
    \ provide:\n\n+   - the [%s specifier](#) to convert a date to the number of seconds\
    \ since the Epoch\n- and the [\"@\" symbol](#) to specify an input date is expressed\
    \ as a number of seconds since the Epoch (BSD will use the -r option for that\
    \ purpose)\n\nSo here is a possible solution to my issue:\n\n```\nminus-two-hours()\
    \ {\n    # 1. Convert to number of seconds since Unix Epoch\n    SRC=$(date -d\
    \ \"$1\" +\"%s\")\n    # 2. Remove two hours (expressed as number of seconds)\n\
    \    DST=$((SRC-2*60*60))\n    # 3. Display the result using the required format\n\
    \    date -d \"@$DST\" +\"%F %H:%M\"\n}\n```\n\nUsing the mighty powers of GNU\
    \ date utils\n\nThe solution above is highly portable — even beyond the limits\
    \ of shell programming.\n\nBut when using GNU date as we do on Linux for example,\
    \ we have access to a whole world of subtleties to express the date. In particular,\
    \ you can simply write that:\n\n```\nminus-two-hours() {\n    date -d \"$1 2 hours\
    \ ago\" +\"%F %H:%M\"\n}\n```\n\nYes: *\"2 hours ago\"* is part of the date specification\
    \ and is understood by GNU date as a way to say \"remove two hours to the previous\
    \ date\".\n\nAs you can see, when portability is not a concern, it worth taking\
    \ the time to explore a little bit your specific [tools documentation](#) as they\
    \ may contain hidden gems!\n\n> <sup>4</sup> I always wondered if the *Apoc* character\
    \ name in *Matrix* was related to that. In \"French English\" both are pronounced\
    \ the same..."
  merge: -1
  pgno: 55
