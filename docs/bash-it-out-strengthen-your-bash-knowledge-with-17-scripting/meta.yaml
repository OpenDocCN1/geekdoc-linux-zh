  md: 'For the sake of the demonstration, I only displayed the content of one file.
    But you may imagine I have many of them — too many for considering manual editing.


    It thought I found a solution using the cat command:


    ```

    yesik.it:~/ItsFOSS$ cat HEADER DATA01 | tee DATA01

    # Month, Year, Est.Value

    # Month, Year, Est.Value

    ```


    Unfortunately, for some reason that solution didn''t work: not only I''ve lost
    the data but my header appears twice.


    As you can see, *I really* need your help here — both to explain to me what was
    going on and to help me in solving that issue.


    # The solution


    # What was the problem?


    In a pipeline, all commands are launched in parallel. That means the cat command
    reading the DATA01 file *and* the tee command overwriting that same file are launched
    simultaneously.


    This is really a **race condition.** On my system, tee had time to overwrite the
    destination file before cat had the opportunity to read it. To illustrate that,
    we can delay the commands and see the output is clearly dependent on the timing:


    ```

    **cat** HEADER DATA01 | ( sleep 1; tee DATA01 )

    # Month, Year, Est.Value

    Dec, 2015, 15000

    Jan, 2016, 12540

    Feb, 2016, 11970

    ```


    ```

    **(sleep 1 ; cat** HEADER DATA01 **)** | tee DATA01

    # Month, Year, Est.Value

    ```


    I would have a similar issue (albeit deterministic this time) using the simpler:


    ```

    **cat** HEADER DATA01 > DATA01

    ```'
  merge: -1
  pgno: 48
- img_proc: false
  md: 'In that case, the shell *always* overwrites the destination file before launching
    the cat command. So the content of the file is lost long before cat had even the
    opportunity to read it.


    # How to fix that?


    Obviously, no one would even consider using the sleep hack to solve that challenge
    in a real situation. But this is not an issue: as part of the standard POSIX tools,
    we have several commands at our disposal to insert the header on top of a file.
    Before that, let''s take a look at the most basic solution.


    # The KISS solution


    ```

    cat HEADER DATA01 > DATA01.NEW

    mv -f DATA01.NEW DATA01

    ```


    Do I really need to comment that? Well, while being rudimentary, this solution
    has a nice feature: since `mv` will use the system call `rename`, which itself
    is atomic in that sense other process referencing the DATA01 file will either
    see the old content or the new content—but neither a *half-written* content.


    A somewhat similar solution, but avoiding to create a temporary file *visible*
    on the filesystem would obtain first a [file descriptor](#) to read from the original
    file before overwriting it:


    ```

    exec 3<DATA01           # (1)

    rm -f DATA01            # (2)

    cat HEADER - <&3 >DATA01 # (3)

    exec 3<&-               # (4)

    ```


    +   1. Open the file DATA1 for reading using the file descriptor 3;

    2. Unlink the original file (i.e.: remove its directory entry, but not the data
    since the file is still open);

    3. Use `cat` to read the header first, followed by a `stdin` read from file descriptor
    3 and write to a new DATA01 file;

    4. Close the file descriptor 3. This will effectively delete the old DATA01 content.


    Please note this solution is no longer atomic in the sense described above. Anyways,
    Kudos to [Adithya Kiran Gangu](#) for having suggested me that solution!


    # Using sed


    While encountering such kind of problems, my first idea is often to use `sed`.
    It is quite easy to insert a "header" *after* the first line using `sed`. Unfortunately,
    it''s much more difficult to insert something *before* the first line. In fact,
    to achieve that, we will need a little bit of magic:'
  merge: -1
  pgno: 49
- img_proc: false
  md: "```\nsed -i '1{\n    r HEADER\n    N\n}' DATA01\n```\n\nTo fully understand,\
    \ you need to know the (r)ead command inserts the content of a file in the destination\
    \ stream, but **only once the current line processing has ended**. That's why\
    \ I used the (N)ext command: it will end the line 1 processing early (i.e.: before\
    \ normal line output). So, when encountering that command, sed ends processing\
    \ of line 1. Which triggers output of the content of the HEADER file. But the\
    \ line 1 itself is not sent to the output. It is kept in the sed buffer.\n\nThen\
    \ sed reads the next line of input, append it to the buffer, and as we do not\
    \ have any rule for line 2, process it as usual by sending its buffer to the output\
    \ (remember at that stage, the buffer contains *both* line 1 *and* line 2).\n\n\
    This solution has a major drawback: it assumes *there is* a line 2. If the data\
    \ file contains only one line, this will fail miserably.\n\n# Using ed or ex\n\
    \nWe have very few occasions of using ed or its cousin ex. Both are line oriented\
    \ editors. Their behavior is very similar to vi in that sense you load file into\
    \ memory, and send commands to the editor to modify that file. The only difference\
    \ here is we will script the commands instead of using them interactively.\n\n\
    ```\ned DATA01 << .\n0r HEADER\nwq\n.\nex -s DATA01 << .\n0r HEADER\nwq\n.\n```\n\
    \nThis works great, but as we have to load the whole file into memory which could\
    \ be an issue for very large files.\n\nAs always, those are probably only a subset\
    \ of all possible solutions. For example, I bet you could find more solutions\
    \ using AWK or Perl, for example!"
  merge: -1
  pgno: 50
