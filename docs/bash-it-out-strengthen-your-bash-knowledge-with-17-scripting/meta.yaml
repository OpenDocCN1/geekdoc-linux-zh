  md: '# Challenge 3: My command outputs are in the wrong order!


    # What I tried to achieve?


    This time, I want a shell function to log the round trip time (rtt) to a server.
    Only if the ping command has succeeded, I want to record the date of the measure
    on the line **below** the rtt.


    Given those requirements, I end up with that solution:


    ```

    yesik:~/ItsFOSS$ probe() (

    >    ping -qnc2 www.google.com | \

    >        grep rtt & \

    >        date +"OK %D %T"

    > )

    yesik:~/ItsFOSS$ rm -f log

    yesik:~/ItsFOSS$ probe >> log

    yesik:~/ItsFOSS$ probe >> log

    yesik:~/ItsFOSS$ cat log

    OK 11/22/16 22:52:36

    rtt min/avg/max/mdev = 53.394/77.140/100.887/23.748 ms

    OK 11/22/16 22:52:39

    rtt min/avg/max/mdev = 49.142/49.731/50.320/0.589 ms

    ```


    But, I don''t understand why the date and rtt lines are *swapped* in the log file?!?
    The date should appear *below* the rtt. But here it appears *above*. Why? Could
    you fix that?


    ![](bbox=[0.354, 0.787, 0.659, 0.943])'
  merge: -1
  pgno: 18
- img_proc: false
  md: "# The solution\n\n# What was the problem?\n\nI've simply made a typo: I mistaken\
    \ & for && — maybe was I confused by the pipe (|) symbol above? Indeed, all the\
    \ |, ||, & and && operators can be used to join two shell commands. But they have\
    \ completely different meanings:\n\n| Operator | Name | Description |\n| --- |\
    \ --- | --- |\n| cmd1 \\| cmd2 | The pipe symbol | Run both commands in parallel\
    \ in a sub-shell, using the output of cmd1 as input to cmd2. The pipe is a very\
    \ common way to combine several basic commands in order to accomplish complex\
    \ tasks. |\n| cmd1 & cmd2 | The ampersand | Run cmd1 as a background process,\
    \ and in parallel, to run cmd2 in the foreground. The two commands are not connected\
    \ in any way using that operator. |\n| cmd1 \\|\\| cmd2 | The short-circuit logical\
    \ OR | Run cmd2 only if cmd1 has failed. As a consequence cmd1 must complete before\
    \ cmd2 is eventually run. In other words, commands run sequentially. |\n| cmd1\
    \ && cmd2 | The short-circuit logical AND | Run cmd2 only if cmd1 was successful.\
    \ As a consequence cmd1 must complete before cmd2 is eventually run. In other\
    \ words, commands run sequentially. |\n\nArmed with that knowledge, let's now\
    \ take a look at my original code:\n\n```\nprobe() (\n  ping -qnc2 www.google.com\
    \ | \\\n  grep rtt & \\\n  date +\"OK %D %T\"\n)\n```\n\n+   1. I want to run\
    \ the ping command and send its output to the grep command. The pipe is the right\
    \ operator.\n2. But after that, I wanted to write the date only if the pipe was\
    \ successful. Here, I needed the logical AND operator (&&). But instead of that,\
    \ I used the & operator, that basically run `ping | grep` into the background\
    \ — always. And `date` in the foreground — always. There is a *race condition*\
    \ as both processes are now running in parallel and compete to write on stdout\
    \ (the terminal output). Unsurprinsgly, in that particular example, the `date`\
    \ command won every time over the ping command."
  merge: -1
  pgno: 19
- img_proc: false
  md: "Therefore the correct syntax would have been:\n\n```\nprobe() (\n    ping -qnc2\
    \ www.google.com | \\\n    grep rtt && \\\n    date +\"OK %D %T\"\n)\n```\n\n\
    In my case, the issue was immediately visible because, obviously, the ping command\
    \ takes more time to complete than the date command. But, as this is often the\
    \ case with race conditions, such mistakes could easily remain hidden for a very\
    \ long time when the two \"contestants\" of the race take *almost* the same time\
    \ to complete. For example, the following example is a lot less deterministic:\n\
    \n```\nprobe() (\n    ping -qnc2 itsfoss.com | sed 1q & \\\n    ping -qnc2 kernel.org\
    \ | sed 1q\n)\n```\n\nFrom my location in France, on 2000 runs, the first ping\
    \ lost only 3 times. That means the \"bug\" was visible only in 0.15% of the cases.\
    \ Next time you'll report some occasional software crash — be kind with your favorite\
    \ FOSS developers and remember that even caused by typos, race conditions are\
    \ hard to reproduce and even harder to trace!\n\n![](bbox=[0.392, 0.694, 0.608,\
    \ 0.882])"
  merge: -1
