- img_proc: false
  md: '# The solution


    What was the problem?


    Here the problem is caused by a filename that looks like a command option. We
    have to find a way to avoid the rm command to understand the dash as introducing
    a set of options (and indeed the `-rf` option is particularly dangerous).


    Maybe that was you first reflex, but no, using quotes or backslash is *not* the
    solution. None of these syntax will work:


    ```

    yesik:~/ItsFOSS$ rm ''-rf *''

    rm: invalid option -- ''''

    Try ''rm --help'' for more information.

    yesik:~/ItsFOSS$ rm \-rf\ \*

    rm: invalid option -- ''''

    Try ''rm --help'' for more information.

    ```


    Why those are not valid solutions? Because they would protect special characters
    from shell''s interpretation. But here the problem is not with the shell. But
    with the `rm` command itself.


    How to solve that?


    Hopefully, `rm` like several other standard command supports the `--` special
    option to indicate the start of filename list. After `--` the command will no
    longer try to interpret strings starting by a dash as an option. Which is exactly
    what we need:


    ```

    yesik:~/ItsFOSS$ rm -- ''-rf *''

    ```


    Notice however than quotes (or backslashes) are still necessary to protect the
    space and the star from shell interpretation. If you want to experiment more with
    that, I encourage you to use the `ls` and `touch` commands, since both of them
    supports the `--` option. And they are way less dangerous to use than the `rm`
    command!'
  merge: -1
