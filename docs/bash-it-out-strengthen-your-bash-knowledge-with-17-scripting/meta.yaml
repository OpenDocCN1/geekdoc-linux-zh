  md: '# Challenge 15: My Bash don''t know how to count. Again!


    # What I tried to achieve?


    I just want to add the first and last integer stored in some data file. So I typed
    that at my Bash prompt:


    ```

    yesik:001$ cat sample.data

    1      2      3

    yesik:002$ cut -d'' '' -f1,3 sample.data | read X Z

    yesik:003$ echo $((X+Z))

    0

    ```


    And the result displayed by my shell is 0 (zero). C''mon Bash: 1+3 is 4, not 0.

    My bash don''t know how to count ! Is it broken?


    # The solution


    # What was the problem?


    Kudos to It''s FOSS reader Riccardo Bernard for a great explanation of the "problem":


    > the line [2] is executed by starting the two sides of ''|'' in subprocesses.
    Therefore, read is not run in the shell, but in a subprocess and sets the variables
    in the subshell.


    Indeed, you can only change the content of the variable of the current shell.
    You cannot change the content of a parent shell''s variable. So, since the data
    are read here in a sub-process, only the sub-process environment was changed.
    When line [3] is executed, we are back in the parent shell—where variables were
    *never* modified. Notice this is different in zsh.


    # How to fix that?


    There is several way to fix the problem. All of them require we read the data
    in the same shell as the one that will perform calculations.'
  merge: -1
  pgno: 57
- img_proc: false
  md: 'A simple solution would be to completely discard the cut command, and read
    the data using a simple redirection:


    ```

    yesik:002$ read X Y Z < sample.data

    ```


    If you really want to read the output of some external command though, you may
    use a process redirection instead:


    ```

    yesik:002$ read X Z < <(cut -d'' '' -f1,3 sample.data)

    ```


    ...or a *here string*:


    ```

    yesik:002$ read X Z <<< $(cut -d'' '' -f1,3 sample.data)

    ```


    Finally worth mentioning the Bash in not necessary the best solution for that
    kind of problem. A simple AWK program may do the work much better—especially since
    the implied loop allows you to handle with exactly the same program a file containing
    one row and a file containing thousands of them:


    ```

    yesik:002$ awk ''{ print $1+$3 }'' sample.data

    ```


