  md: '# Challenge 13: Converting text to uppercase


    # What I tried to achieve?


    I have some text file containing twice the same sentence, once written in English
    and once written French:


    ```

    yesik.it:~/ItsFOSS$ cat text

    This text should be written in all

    uppercase letters!


    Ce text doit être affiché uniquement

    en lettres majuscules!

    ```


    I need to display the content of that file in all uppercases. Do you have any
    idea how I could perform that task? I mean without having to retype all the text...


    # The solution


    The canonical tool to perform character substitution is `tr`--which stands for
    *transliteration*. The `tr` command takes two arguments: the source alphabet and
    the destination alphabet. And it performs a one-to-one mapping from the former
    to the latter.


    ```

    yesik.it:~/ItsFOSS$ tr ''[a-z]'' ''[A-Z]'' < text

    THIS TEXT SHOULD BE WRITTEN IN ALL

    UPPERCASE LETTERS!


    CE TEXT DOIT êTRE AFFICHÉ UNIQUEMENT

    EN LETTRES MAJUSCULES!

    ```


    This worked. But only for the US-ASCII letters. The accentuated letter, and any
    letter outside the US-ASCII range were not transliterated.


    If you have some experience in using the regular expression³, you may be tempted
    to use character classes instead of an explicit range:


    > ³ The `tr` command do *not* use regular expression. But it accepts a syntax
    similar to character ranges to specify the source and destination alphabets. For
    example, the syntax `[a-z]` is a shorthand for `abcdefghijklmnopqrstuvwxyz`'
  merge: -1
  pgno: 51
- img_proc: false
  md: "```\nyesik.it:~/ItsFOSS$ tr '[[:lower:]]' '[[:upper:]]' < text\nTHIS TEXT SHOULD\
    \ BE WRITTEN IN ALL\nUPPERCASE LETTERS!\n\nCE TEXT DOIT ÊTRE AFFICHÉ UNIQUEMENT\n\
    EN LETTRES MAJUSCULES!\n```\n\nUnfortunately this doesn't work better. A solution\
    \ would be to explicitly add the mapping for the required characters:\n\n```\n\
    yesik.it:~/ItsFOSS$ tr 'éê[a-z]' 'ÉÊ[A-Z]' < text\nTHIS TEXT SHOULD BE WRITTEN\
    \ IN ALL\nUPPERCASE LETTERS!\n\nCE TEXT DOIT ÊTRE AFFICHÉ UNIQUEMENT\nEN LETTRES\
    \ MAJUSCULES!\n```\n\nThis time, it works, but this is tedious. Especially if\
    \ you don't know in advance the set of letters that will be present in the text\
    \ file. Surprisingly enough, the Bash is much better suited than the `tr` command\
    \ to change the character case:\n\n```\nyesik.it:~/ItsFOSS$ while read; do\n \
    \               echo ${REPLY^^}\n            done < text\nTHIS TEXT SHOULD BE\
    \ WRITTEN IN ALL\nUPPERCASE LETTERS!\n\nCE TEXT DOIT ÊTRE AFFICHÉ UNIQUEMENT\n\
    EN LETTRES MAJUSCULES!\n```\n\nIn that code, the outer `while` loop simply read\
    \ the input file line by line. The Bash read command by default store the read\
    \ value into the `REPLY` variable. And I just have to echo that variable, but\
    \ using the special `${var^^}` notation that will expand to the content of a variable\
    \ but with letters converted to uppercase."
  merge: -1
