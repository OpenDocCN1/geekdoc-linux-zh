    rm -rf ItsFOSS\nmkdir -p ItsFOSS\ncd ItsFOSS\nM=\"CONGRATULATIONS FOR HAVING SOLVED\
    \ THIS CHALLENGE\"\n( echo -n \"$M\" | hexdump -v -e '/1 \"%02X \"'; echo ) >\
    \ SECRET\ndecode() {\n    while read -d' ' c ; do\n        echo -en '\\x'$c\n\
    \    done\n    echo\n}\nclear\ncat SECRET\ndecode < SECRET\n```\n\n# What was\
    \ the problem here?\n\nIn the SECRET file, each character of the message is represented\
    \ by its ASCII code expressed in *hexadecimal*. 41 → A 42 → B … 49 → I 4A → J\
    \ 4B → K … 4F → O 50 → P … 5A → Z\nWe had to find a way to read the data and to\
    \ perform the ASCII → char conversion."
