  md: "# Challenge 9: My Bash can't sum data in columns\n\n# What I tried to achieve?\n\
    \nI have some integer data, stored as a fixed width text file. I just want to\
    \ find the total per column of those data. However, some data are missing in the\
    \ file. And those should be accounted as 0.\n\nUnfortunately, that seems to confuse\
    \ my Bash script:\n\n```\nyesik:~/ItsFOSS$ cat sample.data\n    5    3    7  \
    \  2\n    1        -12\n         0   -7\n   -14        4\n            15\nyesik:~/ItsFOSS$\
    \ declare -i SW SX SY SZ\nyesik:~/ItsFOSS$ while read W X Y Z ; do\n>        SW+=$W\
    \ ; SX+=$X ; SY+=$Y ; SZ+=$Z\n> done < sample.data\nyesik:~/ItsFOSS$ printf \"\
    \  %4d %4d %4d %4d\\n\" $S{W,X,Y,Z}\n   7  -12    7    2\n```\n\nI expected the\
    \ result \"6 -11 7 2\". But for some unknown reason, the total for the first two\
    \ columns as calculated by my shell is off by 1. Could you fix that?\n\nYou can\
    \ assume:\n- the data file follow strictly the formatting used in my \"printf\"\
    \ command.\n- the last column is dense (i.e.: no missing value)\n\n**Extra challenge:**\n\
    could you find a solution using only Bash internal commands and/or shell expansion?"
  merge: -1
  pgno: 37
- img_proc: false
  md: '# What was the problem?


    The default behavior of the read Bash internal command is to discard any space
    at the start of a line and to consider a group of spaces in a middle of a line
    as one and only one separator.


    So basicly, what appears to us as a fixed width data file, will be read a space-delimited
    data file by the read command. Just like if the datafile was:


    ```

    while read ; do echo $REPLY; done < sample.data

    5 3 7 2

    1 -12

    0 -7

    -14 4

    15

    ```


    When displayed like that, it is more obvious why the sum of the first column was
    7 and not 8 as we expected it.


    # How to fix that?


    I can see two main strategies to obtain the right result. First, I could just
    add the missing 0 value in the empty cells, so we will always have 4 integer numbers
    to read on each line. The second strategy will be to enforce the fixed width format
    in the code.


    ![](bbox=[0.371, 0.679, 0.624, 0.89])'
  merge: -1
  pgno: 38
- img_proc: false
  md: "# Add the missing zeros\n\nHere is a possible solution for the first strategy\
    \ described above:\n\n```\ndeclare -i SW=0 SX=0 SY=0 SZ=0\nwhile read W X Y Z\
    \ ; do\n    SW+=$W ; SX+=$X ; SY+=$Y ; SZ+=$Z\ndone < <(sed 's/    /    0/' sample.data)\n\
    printf \" %4d %4d %4d %4d\\n\" $S{W,X,Y,Z}\n```\n\nIn that solution, I put a zero\
    \ in the data each time I encounter a sequence of 5 spaces. Now, I have 4 integer\
    \ numbers on each line, and the read command correctly parses the data so my totals\
    \ are correct.\n\n> **Bonus questions:**\n\nCould you try to shorten that sed\
    \ expression?\n\nWhy using a pipe to connect the sed command and while loop wouldn't\
    \ have been such a good idea¹?\n\n# Split data on fixed position\n\nA completely\
    \ different strategy would be to use the so-called Bash substring expansion using\
    \ the *${parameter:offset:length}* syntax. That way you can slice the data at\
    \ *fixed* positions. But for that to work, we need a second \"trick\": being able\
    \ to read an entire line at once.\n\nTo achieve that, you need to know the `IFS`\
    \ variable. It stores the separator used by the Bash to split a line into words.\
    \ To read an entire line at once, that is to ignore any separator, we simply need\
    \ to temporary set `ISF` to the empty string.\n\nAll that leading to:\n\n```\n\
    declare -i SW=0 SX=0 SY=0 SZ=0\nwhile IFS='' read LINE; do\n    SW+=${LINE:0:5}\
    \  ; SX+=${LINE:5:5}\n    SY+=${LINE:10:5} ; SZ+=${LINE:15:5}\ndone < sample.data\n\
    printf \" %4d %4d %4d %4d\\n\" $S{W,X,Y,Z}\n```\n\n¹ Maybe you could find the\
    \ answer to that question in another challenge..."
  merge: -1
