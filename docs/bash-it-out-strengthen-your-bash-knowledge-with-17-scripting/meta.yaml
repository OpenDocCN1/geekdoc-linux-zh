  md: '# Challenge 6: The dangerous file to remove


    # What I tried to achieve?


    When I was at school (in the VT100 era:/) it wasn''t uncommon for the poor soul
    that has left his terminal without closing the session to find strangely named
    files in his home directory when he was back.


    That was "cruel jokes" made by other students passing by. For this challenge,
    let''s pretend you just found a file named -rf  * in your home directory:


    ![](bbox=[0.11, 0.348, 0.864, 0.566])


    ```

    yesik:~/ItsFOSS$ ls -l

    dont remove!

    -rf *

    ```


    So, how to remove the unwanted file from the command line, without removing any
    other file? Obviously `rm -rf *` is *not* the solution...


    **BEWARE:** before trying to answer this challenge, think first why this was a
    "cruel joke". What are the risks with the name of this file? IF YOU CAN''T ANSWER
    THAT QUESTION FIRST DON''T TRY THIS AS HOME !'
  merge: -1
