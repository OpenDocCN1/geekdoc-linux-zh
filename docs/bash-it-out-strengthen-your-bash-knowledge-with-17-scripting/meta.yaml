  md: "# Challenge 11: The red/blue token counter\n\n# What I tried to achieve?\n\n\
    This challenge is more \"programming-oriented\" that the previous ones. The description\
    \ being a little bit abstract, try to stay with me for few minutes—hopefully,\
    \ the description below should be clear enough:\n\nI have a stream of tokens,\
    \ either 'RED', 'BLUE' or 'GREEN'. If you want, you can consider that as a representation\
    \ of an event stream for example². I have no particular control on that stream.\
    \ I just know it produces either one or the other token, unpredictably. And I\
    \ know the steam is finite (i.e.: at some point, there will be no more data to\
    \ read).\n\nFor the sake of this challenge, I used a Bash function to produce\
    \ that stream. You are not allowed to change that in anyway.\n\n```\n# You MUST\
    \ NOT change that:\nstream() {\n  TOKENS=( \"RED\" \"BLUE\" \"GREEN\" )\n  for((i=0;i<100;++i))\
    \ ; do\n    echo ${TOKENS[RANDOM%3]}\n  done\n}\n```\n\nMy goal is to to count\
    \ the total of each different tokens there was in he stream. By myself, I was\
    \ able find a solution to count the number of RED tokens:\n\n```\n# You MUST change\
    \ that\nyesik:~/ItsFOSS$ stream | \\\n    grep -F RED | wc -l > RED.CNT\nyesik:~/ItsFOSS$\
    \ cat RED.CNT\n38\n```\n\nUnfortunately, I couldn't find any solution to count\
    \ each (RED, BLUE and GREEN) tokens. That's why I need your help. Any idea?\n\n\
    > ² This challenge is inspired from a real-world application where we had to monitor\
    \ the customer flow in a store. There was sensors spread across strategic locations\
    \ on the floor, and each sensor issued an event when it detected someone passing\
    \ by."
  merge: -1
  pgno: 43
- img_proc: false
  md: '# The solution


    What was the problem?


    The only difficulty here was my initial attempt is discarding some part of the
    input, because I directly send the data stream to the grep.


    Basically there are three approach to solve that problem:


    +   - Store the stream data and process them afterward;

    - Duplicate the stream and process independent path for RED, BLUE and GREEN tokens;

    - Handle all cases in the same command as they arrive.


    For what it worth, after each solution, I give the real-time usage observed on
    my system. This just an indication and has to be taken with caution. So feel free
    to make your own the comparison yourself !


    The store and process approach


    The simplest implementation of the store-and-process approach is obvious:


    ```

    stream > stream.cache

    grep -F RED < stream.cache | wc -l > RED.CNT

    grep -F BLUE < stream.cache | wc -l > BLUE.CNT

    grep -F GREEN < stream.cache | wc -l > GREEN.CNT

    rm stream.cache

    (1.3s for 10,000,000 tokens)

    ```


    It works, but has several drawbacks: you have to store all the data before they
    are processed. In addition, we handle the three different cases sequentially.
    More subtle, as you read several times the `stream.cache` file, you potentionally
    have some race condition if a concurrent process updates that file during processing.


    Still in the store-and-process category, here is a completely different solution:


    ```

    stream | sort | uniq -c

    (5.9s for 10,000,000 tokens)

    ```'
  merge: -1
  pgno: 44
- img_proc: false
  md: "Debian system, the sort command creates several temporary file in */tmp* with\
    \ read-write permissions. Basically this solution has the same drawbacks as the\
    \ very first one but with much worst performances.\n\n# Duplicate stream\n\nDo\
    \ we really have to *store* the data *before* processing them? No. A much more\
    \ clever idea would be to split the stream in several parts, processing one kind\
    \ of token in each sub-stream:\n\n```\nstream | tee >(grep -F RED | wc -l > RED.CNT)\
    \ \\\n            >(grep -F BLUE | wc -l > BLUE.CNT) \\\n            >(grep -F\
    \ GREEN | wc -l > GREEN.CNT) \\\n            > /dev/null\n(0.8s for 10,000,000)\n\
    ```\n\nHere, there is no intermediate files. The tee command replicates the stream\
    \ data as they arrive. Each processing unit gets its own copy of the data, and\
    \ can process them on the fly. This is a clever idea because not only we handle\
    \ data as they arrive, but we have now parallel processing.\n\n# Handle data as\
    \ they arrive\n\nIn computer science, we would probably say the previous solution\
    \ took a functional approach to the problem. On the other hand, the next ones\
    \ will be purely an imperative solution. Here, we will read each token in its\
    \ turn, and *if* this is a RED token, *then* we will increment a RED counter,\
    \ *else if* this is a BLUE token, we will increment a BLUE counter *else if* this\
    \ is a GREEN token, we will increment a GREEN counter.\n\nThis is a plain Bash\
    \ implementation of that idea:\n\n```\ndeclare -i RED=0 BLUE=0 GREEN=0\nstream\
    \ | while read TOKEN; do\n    case \"$TOKEN\" in\n        RED) RED+=1\n      \
    \      ;;\n        BLUE) BLUE+=1\n            ;;\n        GREEN) GREEN+=1\n  \
    \          ;;\n    esac\ndone\n(103.2s for 10,000,000 tokens)\n```"
  merge: -1
  pgno: 45
- img_proc: false
  md: "Finally, being a great fan of the Awk command, I will not resist the temptation\
    \ of using it to solve that challenge in a neat and elegant way:\n\n```\nstream\
    \ | awk '\n    /RED/   { RED++   }\n    /BLUE/  { BLUE++  }\n    /GREEN/ { GREEN++\
    \ }\n    END { printf \"%5d %5d %5d\\n\",RED,BLUE,GREEN }\n'\n(2.6s for 10,000,000\
    \ tokens)\n```\n\nMy AWK program is made of four rules:\n\n+   1. When encountering\
    \ a line containing the word RED, increase (++) the RED counter\n2. When encountering\
    \ a line containing the word BLUE, increase the BLUE counter\n3. When encountering\
    \ a line containing the word GREEN, increase the GREEN counter\n4. At the END\
    \ of the input, display both counters.\n\nOf course to fully understand that you\
    \ have to know, for the purpose of mathematical operators, *uninitialized* AWK\
    \ variables are assumed to be zero.\n\nThat works great. But it requires duplication\
    \ of the same rule for each token. Not a big deal here as we have only three different\
    \ tokens. More annoying if we have many of them. To improve that solution, we\
    \ could rely on *arrays*:\n\n```\nstream | awk '\n    { C[$0]++ }\n    END { printf\
    \ \"%5d %5d %5d\\n\",C[\"RED\"],C[\"BLUE\"],C[\"GREEN\"] }\n'\n(2.0s for 10,000,000\
    \ tokens)\n```\n\nWe only need two rules here, whatever is the number of tokens:\n\
    \n+   1. Whatever is the read token ($0) increase the corresponding array cell\
    \ (here, either C[\"RED\"], C[\"BLUE\"] or C[\"GREEN\"])\n2. At the END of the\
    \ input, display the content of the array both for the different tokens.\n\nPlease\
    \ notice that \"RED\", \"BLUE\" and \"GREEN\" are now handled as character strings\
    \ in the program (did you see the double quotes around them?) And that's not an\
    \ issue for AWK since it does support associative arrays. And just like plain\
    \ variables, uninitialized cells in an AWK associative array are assumed to be\
    \ zero for mathematical operators.\n\nAs I explained it before, I made the choice\
    \ of using AWK here. But Perl fans might have a different opinion of the subject.\
    \ If you're one of them, why writing your own solution?"
  merge: -1
