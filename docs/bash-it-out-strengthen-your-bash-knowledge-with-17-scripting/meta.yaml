  md: "# Challenge 14: The Back in Time Function\n\n# What I tried to achieve?\n\n\
    This time, I want a shell function to display the date and time it was *two hours\
    \ ago*. The function output must follow the YYYY-MM-DD hh:mm format.\n\nI came\
    \ to a solution using simple shell arithmetics:\n\n```\nminus-two-hours() {\n\
    \    date -d \"$1\" +\"%F %H:%M\" | \\\n    {\n        IFS=\": \" read -a COMP\n\
    \        echo \"${COMP[0]} $((10#${COMP[1]}-2)):${COMP[2]}\"\n    }\n}\n```\n\n\
    As you noticed, the function takes a date as an argument, parse it, and write\
    \ back that date minus two hours. Unfortunately, the result is far from being\
    \ satisfactory as the expected format is not always respected and I even have\
    \ negative hours sometimes:\n\n```\nyesik.it:~/ItsFOSS$ minus-two-hours now\n\
    2016-11-22 20:55\nyesik.it:~/ItsFOSS$ minus-two-hours \"2016/11/21 05:27:18\"\n\
    2016-11-21 3:27\nyesik.it:~/ItsFOSS$ minus-two-hours \"2016/11/21 01:10:42\"\n\
    2016-11-21 -1:10\n```\n\nCould you help me finding a solution to obtain the desired\
    \ result?"
