  md: '# Challenge 2: My shell don''t know how to count


    What I tried to achieve?


    I have some data file containing integer numbers, one on each line, and I want
    to compute the sum of all those numbers:


    ```

    yesik:~/ItsFOSS$ cat sample.data

    102

    071

    210

    153

    yesik:~/ItsFOSS$ declare -i SUM=0

    yesik:~/ItsFOSS$ while read X ; do

    >     SUM+=$X

    > done < sample.data

    yesik:~/ItsFOSS$ echo "Sum is: $SUM"

    Sum is: 522

    ```


    ![](bbox=[0.108, 0.555, 0.853, 0.79])


    Unfortunately, the result I obtain is wrong (the expected result was 536).

    Could you explain why the result is wrong and fix my commands to obtain the correct
    result.'
  merge: -1
  pgno: 14
- img_proc: false
  md: "**Extra challenge:**\n\ncould you find a solution using only Bash internal\
    \ commands and/or shell substitutions.\n\n# The solution\n\n# How to reproduce?\n\
    \nHere is the raw code we used to produce this challenge. If you run that in a\
    \ terminal, you will be able to reproduce exactly the same result as displayed\
    \ in the challenge illustration (assuming you are using the same software version\
    \ as me):\n\n```\nrm -rf ItsFOSS\nmkdir -p ItsFOSS\ncd ItsFOSS\ncat > sample.data\
    \ << 'EOT'\n102\n071\n210\n153\nEOT\nclear\ncat sample.data\ndeclare -i SUM=0\n\
    while read X ; do\n    SUM+=$X\ndone < sample.data\necho \"Sum is: $SUM\"\n```\n\
    \n# What was the problem?\n\nThe problem was caused by the 071 value. As you noticed,\
    \ this number is starting by a 0 — probably to ensure all data are formatted on\
    \ three digits. Nothing complicated here, except that ... following an unfortunate\
    \ convention inherited from the C programming language, prefixing an integer by\
    \ 0 is a way to specify that number is expressed in **octal**, and not in **decimal.**"
  merge: -1
  pgno: 15
- img_proc: false
  md: "Octal numbers are expressed with digits from 0 to 7. Here is a simple conversion\
    \ table:\n\n| Decimal | Octal | Decimal | Octal | Decimal | Octal | ... | Decimal\
    \ | Octal |\n|---------|-------|---------|-------|---------|-------|-----|---------|-------|\n\
    | 0 | 0 | 8 | 10 | 16 | 20 | | 56 | 10 |\n| 1 | 1 | 9 | 11 | 17 | 21 | | **57**\
    \ | **71** |\n| 2 | 2 | 10 | 12 | 18 | 22 | | 58 | 72 |\n| 3 | 3 | 11 | 13 | 19\
    \ | 23 | | 59 | 73 |\n| 4 | 4 | 12 | 14 | 20 | 24 | | 60 | 74 |\n| 5 | 5 | 13\
    \ | 15 | 21 | 25 | | 61 | 75 |\n| 6 | 6 | 14 | 16 | 22 | 26 | | 62 | 76 |\n| 7\
    \ | 7 | 15 | 17 | 23 | 27 | | 63 | 77 |\n\nThe value in bold in the above table\
    \ is the one that caused the error when evaluating the sum. The Bash read 071\
    \ and, because of the leading 0, interpreted it as the octal number 71₈ representing\
    \ the 57₁₀ decimal value. You can check that easily:\n\n```\necho $((071))\n57\n\
    ```\n\n# How to fix that?\n\nI can see two main strategies to fix that issue.\
    \ Either removing the leading zeros. Or finding a way to make the shell understand\
    \ all my numbers are **decimal** values.\n\n# Removing leading zeros\n\nHere is\
    \ a simple solution using the `sed` external command to remove the leading zeros:\n\
    \n```\ndeclare -i SUM=0\nwhile read X ; do\n    SUM+=$X\ndone < <(sed -E s/^0+//\
    \ sample.data)\necho \"Sum is: $SUM\"\n```\n\n> **Bonus question:** *why didn't\
    \ I used a pipe instead of a process substitution?*"
  merge: -1
  pgno: 16
- img_proc: false
  md: "The previous solution is (mostly) straightforward — but the Bash allows us\
    \ to make things better. Instead of trying to fix the data, we will simply specify\
    \ *explicitly* our numbers are expressed in base 10 (decimal), instead of base\
    \ 8 (octal). You can do that by using the base#value syntax.\n\nCompare those\
    \ three examples:\n\n```\necho $((071))            # The leading 0 specify the\
    \ number as octal\n57\necho $((8#071))          # We *explicitly* specify base\
    \ 8 (octal)\n57\necho $((10#071))         # We *explicitly* specify base 10 (decimal)\n\
    71\n```\n\nTo fix my initial command and obtain the correct result, I only have\
    \ to explicitly specify the base 10 for all my data:\n\n```\ndeclare -i SUM=0\n\
    while read X ; do\n    SUM+=$((10#$X))\ndone < sample.data\necho \"Sum is: $SUM\"\
    \n```\n\nI let you check that yourself, but it definitely should produce the correct\
    \ result this time!\n\n![](bbox=[0.31, 0.83, 0.7, 0.97])"
  merge: -1
