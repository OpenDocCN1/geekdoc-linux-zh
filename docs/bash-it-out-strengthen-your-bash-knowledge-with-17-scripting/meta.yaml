  md: '# Challenge 1: Counting files in the current directory


    # What I tried to achieve?


    I wanted to count the number of files in the current directory. For that, I used
    the `ls` and `wc` commands:


    ```

    yesik:~/ItsFOSS$ ls -l

    total 0

    -rw-r--r-- 1 yesik yesik 0 Nov 22 22:45 file1

    -rw-r--r-- 1 yesik yesik 0 Nov 22 22:45 file2

    -rw-r--r-- 1 yesik yesik 0 Nov 22 22:45 file3

    ok

    yesik:~/ItsFOSS$ ls | wc -l

    4

    ```


    I was expecting a result of 3 since I visibly have three files in that directory.
    But for some unknown reason, that was not the result I''ve obtained. Could you
    explain me why? And most important, how to achieve my goal?


    ![](bbox=[0.124, 0.573, 0.859, 0.837])'
  merge: -1
  pgno: 11
- img_proc: false
  md: '# The solution


    # How to reproduce?


    Here is the raw code we used to produce this challenge. If you run that in a terminal,
    you will be able to reproduce exactly the same result as displayed in the challenge
    illustration (assuming you are using the same software version as me):


    ```

    mkdir -p ItsFOSS

    cd ItsFOSS

    touch file1 file2 $''file3\nok''

    clear

    ls -l

    ls | wc -l

    ```


    # What was the problem here?


    When send to a pipe, the `ls` command write each filename on its line. Just like
    when using `ls -l` from a terminal. And the `wc -l` command count *lines*. Apparently
    `ls | wc -l` should display the number of files or folder in the current directory.


    However a filename may contain the newline character (often denoted \n). It is
    certainly uncommon but perfectly valid though.


    In that challenge, the ok word you can see on the screen capture *was* part of
    the third filename, which in fact was `file3\nok`. Not file3 as one may believe
    it at first sight.


    This is a corner case you must take that into account in your scripts or shell
    commands to not break if a filename contains that character. Either by accident,
    or as the result of some malicious activity.


    # How to fix that?


    Remove non-printable characters from the `ls` output


    ```

    ls -q | wc -l

    ```


    Modern versions of `ls` have the `-q` option that will replace non-printable characters
    by a question mark (?) The `-q` option is more portable than the `-b` option you
    may sometimes see used for that purpose. In both cases, we are absolutely certain
    \n embedded in filename will not interfere with our count. According to POSIX:'
  merge: -1
  pgno: 12
- img_proc: false
  md: '```

    -q Force each instance of non-printable filename characters and <tab>s to be written
    as the question-mark ( ''?'' ) character. Implementations may provide this option
    by default if the output is to a terminal device.

    ```


    On my Debian Squeeze test system, `-q` was not the default. That''s why the `ok`
    word appears on its own line. On Debian Stretch, `-q` is enabled by default and
    the output is different — **only when the output is a console** — and it will
    display the last filename as `file3?ok`.


    Ignore the file''s name


    I want to count the number of *files*. Not the number of *filenames*. So, as an
    alternate solution, we could just ignore the filename and issue a *token* for
    each encountered file. counting the number of tokens will give the same result
    as counting the number of files. And as we have the control of the token, we cannot
    be fooled. We can use the `find` command for that purpose:


    ```

    find . -mindepth 1 -maxdepth 1 -printf ''\n'' | wc -l

    -or-

    find . ! -path . -maxdepth 1 -printf ''\n'' | wc -l

    ```


    Here I made the choice of using an empty line (`\n`) as the token. So, those two
    command will produce one empty line per entry in the current directory. Notice
    the actual filename is never written to the output. So whatever characters may
    be embedded in the filename, they will not interfere with following commands in
    the pipe. I just have then to count the number of lines to know the number of
    files there was.


    Please notice `-mindepth 1` and `! -path .`: those are two different tricks to
    remove the current directory (`.`) from the selection. Otherwise, your count will
    be off by one.'
  merge: -1
  pgno: 13
