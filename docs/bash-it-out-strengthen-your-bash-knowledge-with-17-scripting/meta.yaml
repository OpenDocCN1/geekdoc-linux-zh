  md: '# Challenge 4: Keeping filenames containing some extension


    # What I tried to achieve?


    In a file, I have a list of Windows filenames stored one per line (this is part
    of the logs from an auditing tool running on my Samba server). I want to extract
    from that list all files containing the .bat extension. That extension must be
    spelled exactly like that and must appear at the end of the filename(i.e.: I don''t
    want to keep .bat.orig files nor .batch files).


    The grep command is the canonical tool when you want to find lines containing
    some pattern in a file. Unfortunately, I wasn''t able to achieve my intended result:


    ```

    yesik:~/ItsFOSS$ cat sample.data

    login.bat

    login.exe

    logout.batch

    acrobat.exe

    first-run.pdf

    first-run.bat

    first-run.bat.orig

    yesik:~/ItsFOSS$ grep .bat sample.data

    login.bat

    logout.batch

    acrobat.exe

    first-run.bat

    first-run.bat.orig

    ```


    As you can see, my solution kept filenames I didn''t want.


    It is somewhat understandable for the .batch or .bat.orig files. But could you
    explain why acrobat.exe was retained too? And how could you fix my solution to
    achieve the intended goal?'
  merge: -1
  pgno: 21
- img_proc: false
  md: '# The solution


    # What was the problem?


    My issue here was caused by the grep command taking a *regular expression* as
    search pattern. Not a fixed string.


    Regular expressions allows to describe a set of strings. This is achieved through
    the use of metacharacters. That is characters which have a special meaning rather
    that matching literally with their value.


    The dot is such a character. A dot in a regular expression will match *any* character.
    So, when I write:


    ```

    grep .bat sample.data

    ```


    That means I want to keep lines containing the three letters b, a and t, preceded
    by *any* character. Either a verbatim dot. Or any other character.


    # How to fix that?


    # Protecting the dot from special interpretation


    To fix that, I may remove the special meaning of the dot. In a regular expression,
    you remove the special meaning of a metacharacter by preceding it with a backslash.


    However there is a pitfall here: the argument string is processed *twice*. Once
    by the shell that will parse the command. Then a second time by the grep command
    that will interpret the regular expression. So, for the grep command to see the
    backslash, we must escape that one first from the shell interpretation by using...a
    second backslash:


    ```

    grep \\.bat sample.data

    ```


    If you don''t like the "double backslash", a second option is to use single quotes
    to protect the whole pattern from any shell interpretation:


    ```

    grep ''\.bat'' sample.data

    ```'
  merge: -1
  pgno: 22
- img_proc: false
  md: 'Finally, if you *really* don''t like backslashes, you may use a character set
    in the regular expression:


    ```

    grep ''[.]bat'' sample.data

    ```


    A character set will match any character between the brackets. If you only put
    a dot between the brackets, it can only match a verbatim dot.


    # Anchoring a pattern at the end of a line


    The three solutions above removed the special meaning of the dot. But how to keep
    only files *ending* by `.bat`? Once again the solution lies in the regular expression
    metacharacters. Especially the dollar sign will match the end of the line. And
    once again, since the dollar sign has special meaning in the shell too, we must
    protect it from the shell interpretation.


    All that finally leading to those possible solutions:


    ```

    yesik:~/ItsFOSS$ grep ''\.bat$'' sample.data

    login.bat

    first-run.bat

    ```


    Or


    ```

    yesik:~/ItsFOSS$ grep \.bat\$ sample.data

    login.bat

    first-run.bat

    ```


    or ... I let you find a third one, maybe using some brackets?'
