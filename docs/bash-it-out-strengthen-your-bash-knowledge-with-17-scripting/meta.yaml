- img_proc: false
  md: '# The solution


    # How to reproduce


    Here is the raw code we used to produce this challenge. If you run that in a terminal,
    you will be able to reproduce exactly the same result as displayed in the challenge
    illustration (assuming you are using the same software version as me):


    ```

    # as root :

    cd /tmp

    rm -rf ItsFOSS

    mkdir -p ItsFOSS

    cd ItsFOSS

    date > a

    date > b

    date > c

    sudo chattr +i c

    clear

    ls -ls

    rm *

    rm -f c

    ls -ls

    ```


    # What was the problem?


    You may have noticed I used above the `chattr` command to set the (i)mmutable
    Linux filesystem attribute for the file `c`. Depending your exact filesystem,
    all attribute changes are not available.


    But here, I am using and ext2 filesystem that *does* support the `i` flag. And
    to quote the man:


    > A file with the ''`i`'' attribute cannot be modified: it cannot be deleted or
    renamed, `no` link can be created to **this** file `and` `no` data can be written
    to the file. Only the superuser `or` a process possessing the `CAP_LINUX_IMMUTABLE`
    capability can set `or` clear **this** attribute.


    So basically after the `chattr +i` the file is locked until we clear this flag.
    Please notice the attribute is stored in the filesystem. So it will survive reboots
    & filesystem unmount/mount cycles.'
  merge: -1
  pgno: 41
- img_proc: false
  md: '# How to fix that?


    First, we can check the explaination above by using the `lsattr` command:


    ```

    root:**015**# lsattr c

    ----i--------------- c

    ```


    Clearly, the (i)mmutable flag is set. So, in order to remove that file (or to
    make any change to it), I have to clear that flag. After that, I can do whatever
    I want on the file as usual:


    ```

    root:**016**# chattr -i c

    root:**017**# lsattr c

    ------------------- c

    root:**018**# rm c

    root:**019**# ls -ls

    total 0

    ```


    If you''re not aware of the existence of `chattr`, its effects can be quite puzzling.
    Worth mentioning `chattr` is a Linux-specific command, originally written for
    the ext2/3/4 filesystems. But today''s some of its feature are supported by other
    filesystems.


    In the BSD-world, there is a similar command called `chflags`. Read more on [Wikipedia](https://en.wikipedia.org/wiki/Chattr)
    for a gentle introduction to that commands compared to `chattr`.'
