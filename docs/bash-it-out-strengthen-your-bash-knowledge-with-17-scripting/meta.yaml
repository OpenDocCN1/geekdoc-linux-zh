    \ Year, Est.Value\n# Month, Year, Est.Value\nyesik.it:~/ItsFOSS$\n```\n\n```\n\
    yesik.it:~/ItsFOSS$ head HEADER DATA01\n ==> HEADER <==\n # Month, Year, Est.Value\n\
    \n ==> DATA01 <==\n Dec, 2015, 15000\n Jan, 2016, 12540\n Feb, 2016, 11970\n```"
