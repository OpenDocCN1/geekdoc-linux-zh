  - '[PAGE 19]


    # The solution problem?


    What was the made a typo:

    ''ve simply made a typo: I mistaken for &&&—maybe I was confused by the pipe (|)
    symbol above? Indeed, all the |, ||, & and && operators can be used to join two
    shell commands. They have completely different meanings:


    | cmd1 | cmd2 | The pipe symbol | Run both commands in parallel in a sub-shell,
    using the output of cmd1 as input to cmd2. The pipe is a very common way to combine
    several basic commands in order to accomplish complex tasks. |

    | cmd1 & cmd2 | The ampersand | Run cmd1 as a background process, and in parallel,
    run cmd2 in the foreground. The two commands are not connected in any way using
    that operator. |

    | cmd1 || cmd2 | The short-circuit OR | Run cmd2 only if cmd1 complete before
    cmd2 is eventually run. In other words, commands run sequentially. |

    | cmd1 && cmd2 | The short-circuit AND | Run cmd2 only if cmd1 was successful.
    As a consequence cmd1 must complete before cmd2 is eventually run. In other words,
    commands run sequentially. |


    Armed with that knowledge, let''s now take look at my original code:


    ```

    probe() (

    ping -qnc2 www.google.com | \

    grep rtt & \\

    date +"OK %D %T"

    )

    ```


    +   1. I want to run the ping command and send its output to the grep command.
    The pipe is the right operator.

    2. But after that, I wanted to write the date only if the pipe was successful.
    Here, I needed the logical AND operator (&&). But instead of that, I used the
    & operator, that basically run ping | grep into the background — always. And in
    the foreground — always. There is a race condition as both processes are now running
    in parallel and compete to write on stdout (the terminal output). Unsurprisingly,
    in that particular example, the date command won every time over the ping command.'
  - '[PAGE 20]


    Therefore the correct syntax would have been:


    ```

    probe() (\nping -qnc2 www.google.com | \ \

    grep rtt && \ \

    date +"OK %D %T"

    )

    ```


    In my case, the issue was immediately visible because, obviously, the ping command
    takes\more time to complete than the date command. But, as this is often the case
    with race

    conditions, such mistakes could easily remain hidden for a very long time when
    the two

    "contestants" of the race take almost the same time to complete. For example,
    the following

    example is a lot less deterministic:


    ```

    probe() (\nping -qnc2 itsfoss.com | sed 1q & \ \

    ping -qnc2 kernel.org | sed 1q

    )

    ```


    From my location in France, on 2000 runs, the first ping lost only 3 times. That
    means the "bug"

    was visible only in 0.155% of the cases. Next time you''ll report some occasional
    software

    crash — be kind with your favorite FOSS developers and remember that even caused
    by typos,

    race conditions are hard to reproduce and even harder to trace!


    ![](img/8f6bf8024f58c92982eb49d5f91a7bf7_20_0.png)'
