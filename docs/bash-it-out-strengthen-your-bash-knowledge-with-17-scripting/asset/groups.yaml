- md: "\nDebian system, the sort command creates several temporary file in /tmp with\
    \ read-write permissions. Basically this solution has the same drawbacks as the\
    \ very first one but with much worst performances.\n\n## Duplicate stream\n\n\
    Do we really have to store the data before processing them? No. A much clever\
    \ idea would be to split the stream in several parts, processing one kind of token\
    \ in each sub-stream:\n\n```bash\nstream | tee >(grep -F RED | wc -1 > RED.CNT)\
    \ \\\n>(grep -F BLUE | wc -1 > BLUE.CNT) \\\n>(grep -F GREEN | wc -1 > GREEN.CNT)\
    \ \\\n>/dev/null\n\n0.8s for 10,000,000\n```\n\nHere, there are no intermediate\
    \ files. The tee command replicates the stream data as they arrive. Each processing\
    \ unit gets its own copy of the data, and can process them on the fly. This is\
    \ a clever idea because not only we handle data as they arrive, but we have now\
    \ parallel processing.\n\n## Handle data as they arrive\n\nIn computer science,\
    \ we would probably say the previous solution took a functional approach to the\
    \ problem. On the other hand, the next ones will be purely an imperative solution.\
    \ Here, we will read each token in its turn, and if this is a RED token, then\
    \ we will increment a RED counter, else if this is a BLUE token, we will increment\
    \ a BLUE counter else if this is a GREEN token, we will increment a GREEN counter.\n\
    \nThis is a plain Bash implementation of that idea:\n\n```bash\ndeclare -i RED=0\
    \ BLUE=0\nstream | while read TOKEN; do\n  case \"$TOKEN\" in\n    RED) RED+=1\n\
    \    ;;\n    BLUE) BLUE+=1\n    ;;\n    GREEN) GREEN+=1\n    ;;\n  esac\ndone\n\
    (103.2s for 10,000,000 tokens)\n```\n\nFinally, being a great fan of the Awk command,\
    \ I will not resist the temptation of using it to solve that challenge in a neat\
    \ and elegant way:\n\n```bash\nstream | awk '\n/RED/ { RED++ }\n/BLUE/ { BLUE++\
    \ }\n/GREEN/ { GREEN++ }\nEND { printf \"%d %d %d\\n\",RED,BLUE,GREEN }\n'\n(2.6s\
    \ for 10,000,000 tokens)\n```\n\nMy Awk program is made of four rules:\n\n- 1.\
    \ When encountering a line containing the word RED, increase ((++) the RED counter\n\
    - 2. When encountering a line containing the word BLUE, increase the BLUE counter\n\
    - 3. When encountering a line containing the word GREEN, increase the GREEN counter\n\
    - 4. At the END of the input, display both counters.\n\nOf course to fully understand\
    \ that we know, for the purpose of mathematical operators, uninitialized variables\
    \ are assumed to be zero.\n\nThat works great. But it requires duplication of\
    \ the same rule for. Not a big deal here we have only three different tokens.\
    \ More annoying if we have many of them. To improve that solution, we can rely\
    \ on arrays:\n\n```bash\nstream | awk '\n{ C[0]++ }\nEND { printf \"%d %d %d\\\
    n\",C[\"RED\"],C[\"BLUE\"],C[\"GREEN\"] }\n'\n(2.0s for 10,000,000 tokens)\n```\n\
    \nWe only need two rules here, however when the number of tokens:\n\n- 1. Whatever\
    \ is the read ($0) increase the corresponding array cell (here, C[\"RED\"],C[\"\
    BLUE\"] or C[\"GREEN\"])\n- 2. At the END of the input, display the content of\
    \ the array for the different tokens.\n\nPlease notice that \"RED\", \"BLUE\"\
    \ and \"GREEN\" are now handled as character strings in the program (did you see\
    \ the double quotes around them?) And that's not an issue for AWK since it supports\
    \ associative arrays. And just like plain variables, uninitialized cells in an\
    \ AWK array are assumed to be zero for mathematical operators.\n\nAs I explained\
    \ it before, I made the choice of using AWK. But Perl fans might have a different\
    \ opinion of the subject. If you're one of them, writing your own solution?\n\n\
    ## Challenge 12: Inserting the same header on top of several different files\n\
    \nWhat I tried to achieve?\nThis time I work with several data files and one header\
    \ file. I just want to insert the content of the header file on top of each data\
    \ file:\n\n```bash\nyesik:~/ItsFOSS$ head HEADER DATA01\n==> HEADER <=<\n# Month,\
    \ Year, Est.Value\n\n==> DATA01 <=<\nDec, 2015, 15000\nJan, 2016, 12540\nFeb,\
    \ 2016, 11970\nyesik:~/ItsFOSS$ cat HEADER DATA01 | tee DATA01\n# Month, Year,\
    \ Est.Value\n# Month, Year, Est.Value\n```\n\n```bash\nyesik:~/ItsFOSS$ head HEADER\
    \ DATA01\n==> HEADER <=<\n# Month, Year, Est.Value\n\n==> DATA01 <=<\nDec, 2015,\
    \ 15000\nJan, 2016, 12540\nFeb, 2016, 11970\n```\n\nFor the sake of the demonstration,\
    \ I only displayed the content of one file. But you may imagine I have of them\
    \ — too many for considering manual editing.\n\nI thought I found a solution using\
    \ the cat command:\n\n```bash\nyesIk:-ItsFOSS$ cat HEADER DATA01 | tee DATA01\n\
    # Month, Year, Est.Value\n# Month, Year, Est.Value\n```\n\nUnfortunately, for\
    \ some reason solution didn't work: not only I lost the data but by the header\
    \ appears twice.\n\nAs you can see, I really need help here — both to explain\
    \ to me what was going on and to help me in solving this issue.\n\n## The solution\n\
    \nWhat was the problem?\n\nIn a pipeline, all commands are launched in parallel.\
    \ That means the cat command reading the DATA01 file and the cat command overwriting\
    \ that file are launched simultaneously.\n\nThis is really a race condition. On\
    \ my system, tee had time to overwrite the destination file before cat had the\
    \ opportunity to read it. To illustrate that, we can delay the commands and see\
    \ the output is clearly dependent on the timing:\n\n```bash\ncat HEADER DATA01\
    \ | ( sleep 1; tee DATA01 )\n# Month, Year, Est.Value\nDec, 2015, 15000\nJan,\
    \ 2016, 12540\nFeb, 2016, 11970\n```\n\n```bash\n(sleep 1; cat HEADER DATA01 )\
    \ | tee DATA01\n# Month, Year, Est.Value\n```\n\nI would have a similar issue\
    \ (albeit deterministic this time) using the simpler:\n\n```bash\ncat HEADER DATA01\
    \ > DATA01\n```\n\nIn that case, the shell always overwrites the destination file\
    \ before launching the cat command.\nSo the content of the file is lost long before\
    \ cat had even the opportunity to read it.\n\n## How to fix that?\n\nObviously,\
    \ no one would even consider using the sleep hack to solve that challenge in a\
    \ real situation. This is not an issue: part of the standard POSIX tools, we have\
    \ several commands at our disposal to insert the header on top of a file. Before\
    \ that, let's take a look at the most basic solution.\n\n## The KISS solution\n\
    \n```bash\ncat HEADER DATA01 > DATA01.NEW\nmv -f DATA01.NEW DATA01\n```\n\nDo\
    \ I really need to comment that? Well, while being rudimentary, this solution\
    \ has a nice feature: since we will use the system rename, which itself is atomic\
    \ in sense other process referencing the DATA01.\n\n## Using sed\n\nWhile encountering\
    \ such kind problems, my first idea is often to use sed. It is easy to insert\
    \ a \"header\" after the first line. Unfortunately, it's much more difficult to\
    \ insert something before the first line. In fact, to achieve that, we will need\
    \ a little bit of magic:\n\n```bash\nsed -i '1{\n  r HEADER\nN\n}' DATA01\n```\n\
    \nTo fully understand, you need to know the {r}read command inserts the content\
    \ of a file in the destination stream, but only once the current line has ended.\
    \ That's why I used the (N)next command: it will end the line 1 processing early.e.:\
    \ before normal line output). So, when encountering that command, sed ends processing\
    \ of line 1. Which triggers output of the content of the HEADER file. But the\
    \ line 1 itself is not sent to the output. It is kept in the sed buffer.\n\nThen\
    \ sed reads the next line of input, append it to the buffer, and as we do not\
    \ have any rule for line 2, process it as usual by sending its buffer to the output\
    \ (remember at that stage, the buffer contains both line 1 and line 2).\n\nThis\
    \ solution has a major drawback: it assumes there is a line 2. If the data file\
    \ contains only one line, then this will fail miserably.\n\n## Using ed or ex\n\
    \nWe have very few occasions of using ed or its cousin ex. Both are line oriented\
    \ editors. Their behavior is very similar to vi in that you load file into memory,\
    \ and send commands to the editor to modify that file. The only difference here\
    \ is we will script the commands instead of using them interactively.\n\n```bash\n\
    DATA01 <<\nr HEADER\nw\n.\nex -s DATA01 <<\nr HEADER\nwq\n.\n```\n\nThis works\
    \ great, but as we have to load the whole file into memory which could be an issue\
    \ for very large files.\n\nAs always, those are probably only a subset of all\
    \ possible solutions. For example, I bet you could find more solutions using AWK\
    \ or Perl, for example!\n"
  mdcn: "\n在 Debian 系统中，`sort` 命令会在 `/tmp` 中创建几个具有读写权限的临时文件。基本上，这个解决方案和第一个方案有相同的缺点，但性能差得多。\n\
    \n## 重复流\n\n我们真的必须在处理数据之前存储它们吗？不需要。一个更聪明的想法是将流分成几部分，在每个子流中处理一种类型的标记（token）：\n\n\
    ```bash\nstream | tee >(grep -F RED | wc -1 > RED.CNT) \\\n>(grep -F BLUE | wc\
    \ -1 > BLUE.CNT) \\\n>(grep -F GREEN | wc -1 > GREEN.CNT) \\\n>/dev/null\n\n0.8s\
    \ for 10,000,000\n```\n\n在这里，没有中间文件。`tee` 命令在数据到达时复制流数据。每个处理单元都获得数据的副本，并可以进行实时处理。这是一个聪明的主意，因为我们不仅在数据到达时处理它们，而且现在实现了并行处理。\n\
    \n## 在数据到达时处理数据\n\n在计算机科学中，我们可能会说上一个方案对问题采用了函数式方法。另一方面，接下来的方案将是纯命令式的解决方案。在这里，我们将依次读取每个标记，如果这是一个\
    \ RED 标记，我们就增加 RED 计数器；否则这是一个 BLUE 标记，我们就增加 BLUE 计数器；否则如果这是一个 GREEN 标记，我们就增加 GREEN\
    \ 计数器。\n\n这是该想法的简单 Bash 实现：\n\n```bash\ndeclare -i RED=0 BLUE=0\nstream | while\
    \ read TOKEN; do\n  case \"$TOKEN\" in\n    RED) RED+=1\n    ;;\n    BLUE) BLUE+=1\n\
    \    ;;\n    GREEN) GREEN+=1\n    ;;\n  esac\ndone\n(103.2s for 10,000,000 tokens)\n\
    ```\n\n最后，作为 `Awk` 命令的忠实粉丝，我无法抵抗使用它来以一种简洁优雅的方式解决这个挑战的诱惑：\n\n```bash\nstream |\
    \ awk '\n/RED/ { RED++ }\n/BLUE/ { BLUE++ }\n/GREEN/ { GREEN++ }\nEND { printf\
    \ \"%d %d %d\\n\",RED,BLUE,GREEN }\n'\n(2.6s for 10,000,000 tokens)\n```\n\n我的\
    \ Awk 程序由四个规则组成：\n\n- 1. 当遇到包含单词 RED 的行时，增加 ((++) RED 计数器\n- 2. 当遇到包含单词 BLUE 的行时，增加\
    \ BLUE 计数器\n- 3. 当遇到包含单词 GREEN 的行时，增加 GREEN 计数器\n- 4. 在输入结束（END）时，显示所有计数器。\n\n\
    为了完全理解这一点，我们知道对于数学运算符，未初始化的变量被假设为零。\n\n这效果非常好。但它需要重复相同的规则。在这里我们只有三个不同的标记，所以不是大问题。如果有许多标记，就会更令人麻烦。为了改进这个解决方案，我们可以依赖数组：\n\
    \n```bash\nstream | awk '\n{ C[0]++ }\nEND { printf \"%d %d %d\\n\",C[\"RED\"\
    ],C[\"BLUE\"],C[\"GREEN\"] }\n'\n(2.0s for 10,000,000 tokens)\n```\n\n然而，这里只需要两个规则，当标记数量很多时：\n\
    \n- 1. 无论读取到什么 ($0)，增加对应的数组单元格（这里是 C[\"RED\"]、C[\"BLUE\"] 或 C[\"GREEN\"]）\n- 2.\
    \ 在输入结束时，显示不同标记的数组内容。\n\n请注意，“RED\"、BLUE\" 和 \"GREEN\" 现在在程序中被作为字符字符串处理（你看到它们周围的双引号了吗？）？这对于\
    \ AWK 来说不是问题，因为它支持关联数组。和普通变量一样，AWK 数组中未初始化的单元在数学运算符中也被假设为零。\n\n正如我之前解释的那样，我选择了使用\
    \ AWK。但 Perl 粉丝可能对这个主题有不同意见。如果你是他们之一，会写你自己的解决方案吗？\n\n## 挑战 12：在多个不同的文件顶部插入相同的表头\n\
    \n我想实现的是什么？\n这次我处理多个数据文件和一个表头文件。我只想将表头内容插入到每个数据文件的顶部：\n\n```bash\nyesik:~/ItsFOSS$\
    \ head HEADER DATA01\n==> HEADER <=<\n# Month, Year, Est.Value\n\n==> DATA01 <=<\n\
    Dec, 2015, 15000\nJan, 2016, 12540\nFeb, 2016, 11970\nyesik:~/ItsFOSS$ cat HEADER\
    \ DATA01 | tee DATA01\n# Month, Year, Est.Value\n# Month, Year, Est.Value\n```\n\
    \n```bash\nyesik:~/ItsFOSS$ head HEADER DATA01\n==> HEADER <=<\n# Month, Year,\
    \ Est.Value\n\n==> DATA01 <=<\nDec, 2015, 15000\nJan, 2016, 12540\nFeb, 2016,\
    \ 11970\n```\n\n为了演示，我只显示了一个文件的内容。但你可以想象我有许多这样的文件——多到无法考虑手动编辑。\n\n我以为我找到了一个使用\
    \ `cat` 命令的解决方案：\n\n```bash\nyesIk:-ItsFOSS$ cat HEADER DATA01 | tee DATA01\n\
    # Month, Year, Est.Value\n# Month, Year, Est.Value\n```\n\n遗憾的是，由于某些原因，解决方案没有作用：不仅我丢失了数据，表头还出现了两次。\n\
    \n如你所见，我在这里需要帮助——既需要有人向我解释发生了什么，也需要帮助我解决这个问题。\n\n## 解决方案\n\n问题所在哪里\n\n在管道中，所有命令都是并行启动的。这意味着读取\
    \ DATA01 文件的 `cat` 命令和覆盖该文件的 `cat` 命令是同时启动的。\n\n这确实是一个竞态条件。在 `cat` 命令有机会读取文件之前，`tee`\
    \ 命令就已经覆盖了目标文件。为了说明这一点，我们让命令延迟：\n\n```bash\ncat HEADER DATA01 | sleep 1 | tee\
    \ DATA01\n# Month, Year, Est.Value\nDec, 2015, 15000\nJan, 2016, 12540\nFeb, 2016,\
    \ 11970\n```\n\n```bash\nsleep 1 | cat HEADER DATA01 | tee DATA01\n# Month, Year,\
    \ Est.ValueDec, 2015, 15000\nJan, 2016, 12540\nFeb, 2016, 11970\n```\n\n在这种情况下，`cat`\
    \ 总是覆盖目标文件，直到 `cat` 命令有机会读取它。\n\n## 如何修复？\n\n显然，没有人会使用 `sleep` 这种技巧来解决这个问题。在 POSIX\
    \ 工具中，我们有很多命令可以向文件顶部插入表头。在此之前，让我们看看最基础的解决方案。\n\n## KISS 解决方案\n\n```bash\ncat HEADER\
    \ DATA01 > DATA01.NEW\nmv -f DATA01.NEW DATA01\n```\n\n我需要注释这个吗？嗯，虽然很原始，但这个解决方案有一个优点：由于我们使用了系统重命名，这种操作本身是原子的。\n\
    \n"
