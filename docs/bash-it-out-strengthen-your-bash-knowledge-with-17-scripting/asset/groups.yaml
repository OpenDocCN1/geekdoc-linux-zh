  - '[PAGE 30]


    # The solution


    What was the problem?


    You know a slash cannot be part of a filename. And you may have somehow believed
    the file e was in some subdirectory d.


    But that''s wrong.


    First, there is no reason for the ls -1 command to display the content of a subdirectory
    using that format, And then, we can see, from the rest of the ls output, there
    is no subdirectory d here.


    This problem is a typical homoglyphic confusion. You believed you''ve seen a slash.
    But in fact it was a different character, but displayed with an unfortunately
    confusing glyph. In that particular case, it was the U+2215 DIVISION SLASH Unicode
    character.


    ![](img/8f6bf8024f58c92982eb49d5f91a7bf7_30_0.png)


    31'
