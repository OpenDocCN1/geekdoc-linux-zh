    # Challenge 15: My Bash don''t know how to count.

    Again!


    # What I tried to achieve?


    I just want to add the first and last integer stored in some data file. So I typed
    that at my Bashnprompt:


    ```

    yesik:001$ cat sample.data

    1 2 3

    yesik:002$ cut -d'' '' -f1,3 sample.data | read X Z

    yesik:003$ echo $((X+Z))

    0

    ```


    The result displayed by my shell is 0 (zero). C''mon Bash: 1+3 is 4, not 0.

    My bash don''t know how to count! Is it broken?


    # The solution


    # What was the problem?


    Kudos to It''s FOSS reader Riccardo Bernard for a great explanation of the "problem":


    > the line [2] is executed by starting the two sides of ''['' in subprocesses.
    Therefore, read is

    not run in the shell, but in a subprocess and sets the variables in the subshell.


    Indeed, you can only change the content of the current shell. You cannot change

    t content of a parent shell''s variable. So since the data are read here in a
    sub-process, only

    t sub-process environment was changed. When line [3] is executed, we are back
    in the parent

    shell—where variables were never modified. Notice this is different in zsh.


    # How to fix that?


    There is several way to fix the problem. All of them require we read the data
    in the same shell as

    t one that will perform calculations.'
