    # The solution


    What was the problem?

    The only difficulty here was my initial attempt at discarding some part of the
    input, because I directly send the data stream to the grep.


    Basically there are three approach to solve that problem:


    +   - Store the stream data and process afterward;

    - Duplicate the stream and process independent path for RED, BLUE and GREEN tokens;

    - Handle all cases in the same command as they arrive.


    For it worth, after each solution, I give the real-time usage observed on my system.
    This just an indication and has to be taken with caution. So feel free to make
    your own comparison yourself !


    # The store and process approach


    The simplest implementation of the store-and-process approach is obvious:


    ```

    stream > stream.cache

    grep -F RED < stream.cache | wc -1 > RED.CNT

    grep -F BLUE < stream.cache | wc -1 > BLUE.CNT

    grep -F GREEN < stream.cache | wc -1 > GREEN.CNT

    rm stream.cache

    (1.3s for 10,000,000 tokens)

    ```


    It works, but has several drawbacks: we have to store all the data before they
    are processed. In addition, we handle the three cases sequentially. More subtle,
    as if you read several times the stream.cache file, you potentially have some
    race condition if a concurrent process updates that file during processing.


    Still in the store-and-process category, here is a completely different solution:


    ```

    stream | sort | uniq -c

    (5.9s for 10,000,000 tokens)

    ```


    I consider that a store-and-process approach, since the sort command has to first
    read and store (either in RAM or disk) all data before being able to process them.
