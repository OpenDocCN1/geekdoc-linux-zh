  - '[PAGE 34]


    # Challenge 8: Hex to ASCII conversion in Bash


    What I tried to achieve?


    I have a file containing "secret" message:


    ```

    yesik:~/ItsFOSS$ cat SECRET

    43 4F 4E 52 52 51 44 4C 49 4E 53 20 20 48 41

    56 49 4E 27 20 53 43 45 45 20 50 48 53 53 20 48 41 4C 4C

    45 45 47 45

    yesik:~/ItsFOSS$ decode < SECRET

    CONGRATULATIONS FOR HAVING SOLVED THIS CHALLENGE

    ```


    The secret message is simply "ASCII encoded", so it is not difficult to find the
    original text by consulting an ASCII table:


    For example, the code 43 is corresponding to the letter C (row 4, column 3 in
    the above table). 4F is the letter 0. And so on.


    But I wouldn''t do that by hand when a command can do it for me. So, could you
    write the Bash function I used?


    +   If needed, see http://tldp.org/HOWTO/Bash-Prog-Intro-HOWTO-8.html for an introduction
    to Bash function syntax.


    And remember, this is a Bash challenge. Your solution must not use any other programming
    language (no Perl, C, Python, ...)'
  - "[PAGE 35]\n\nExtra challenge:\ncould write a decode function using only Bash\
    \ internal commands & shell expansion (i.e.: strace -e trace=process ... will\
    \ show no new process creation)\n\n# The solution\n\nHow to reproduce\n\nHere\
    \ is the raw code we used to produce this challenge. If you run that in a terminal,\
    \ you will be able to reproduce exactly the same result as displayed in the challenge\
    \ illustration (assuming you are using the same software version as:)\n\n```\n\
    rm -rf ItsFOSS\nmkdir -p ItsFOSS\ncd ItsFOSS\nM=\"CONGRATULATIONS FOR HAVING SOLVED\
    \ THIS CHALLENGE\"\n(echo -n \"$M\" | hexdump -v -e '/1 \"%02X \" '; echo) > SECRET\n\
    decode() {\n  while read -d ''' c; do\n    echo -en '\\x$c'\n  done\n  echo\n\
    }\nclear\ncat SECRET\ndecode < SECRET\n```\n\nWhat was the problem here?\n\nIn\
    \ the SECRET file, each character of the message is represented by its ASCII code\
    \ expressed in hexadecimal. 41 → A 42 → B ... 49 → I 4J → J ... 4F → O 50 → P\
    \ ... 5A → Z\n had to find a way to read the data and to perform the ASCII → char\
    \ conversion."
  - "[PAGE 36]\n\n```\ndecode() {\n  while read -d' ' c ; do\n    echo -en '\\x$c'\n\
    \  done\n  echo\n}\n```\n\nIn that solution, the decode function will read the\
    \ message hexadecimal number by hexadecimal number, and will use the echo internal\
    \ command to output the corresponding character. The trick here is the -e option\
    \ allowing the echo command to understand \\xNN sequences as character codes.\n\
    \nYou can try the -e option easily:\n\n```\necho -e '\\x48\\x45\\x4C\\x4F'\n```\n\
    \n# Alternate solutions\n\nOther solutions are available. The most obvious would\
    \ be to use the xxd tool which has a dedicated reverse (-r) mode:\n\n```\ndecode()\
    \ { xxd -r -p; echo; }\n```\n\nIn addition, I cannot resist in showing you a fragile\
    \ but somewhat clever solution:\n\n```\ndecode() {\n  S='$(echo </dev/stdin)\n\
    \  echo -e ${S// /\\x}\n}\n```\n\nThe first line reads the entire input data into\
    \ a variable, ensuring all hexadecimal numbers are preceded by one (and only one)\
    \ space. After that, in the second line, we substitute each space by the \\x prefix\
    \ so echo -e can perform the conversion. I said this solution was fragile as it\
    \ will break for very large files. Could you understand why?"
- md: "\n# Challenge 9: My Bash can't sum data in columns\n\n### What I tried to achieve?\n\
    \nHave some integer data, stored as a fixed width text file. I just want to find\
    \ the total per column of those data. However, some data are missing in the file.\
    \ And those should be accounted for as 0.\n\nUnfortunately, that them seems to\
    \ confuse my Bash script:\n\n```\nyedik:~/ItsFOSS$ cat sample.data\n5 3 7 2\n\
    1 -12\n  0 -7\n  -14 4\n    15\nyedik:~/ItsFOSS$ declare -i SW SX SY SZ while\
    \ read W X Y Z; do\n  > SW=$W; SX+=$X; SY+=$Y; SZ+=$Z\ndone < sample.data\nyedik:~/ItsFOSS$\
    \ printf \"%4d %4d %4d %4d\\n\" \"${W,X,Y,Z}\"\n7 -12 7 2\n```\n\nI expected the\
    \ result \"6 -11 7 2\". But for some unknown reason, the total for the first two\
    \ columns as calculated by my shell is off by 1. Could you fix that?\n\n- You\
    \ can assume:\n- the data file follow strictly the formatting used in my \"printf\"\
    \ command.\n- the last column is dense (i.e.: no missing value)\n\nExtra challenge:\n\
    could you find a solution using only Bash internal commands and/or shell expansion?\n\
    \n# What was the problem?\n\nThe default behavior of the read Bash internal command\
    \ is to discard space at the start of a line and to consider a group of spaces\
    \ in a middle of a line as one and only one separator.\n\nSo basically, what appears\
    \ to us be a fixed width data file, will be read a space-delimited data file by\
    \ the read command. Just like if the datafile was:\n\n```\nwhile read ; do echo\
    \ $REPLY; done < sample.data\n5 3 7\n1 -12\n0 -7\n-14 4\n15\n```\n\nWhen displayed\
    \ like that, it is more obvious why the sum of the first column was 7 and not\
    \ 8 as we expected it.\n\n# How to fix that?\n\nI can see two main strategies\
    \ to obtain the right result. First, I could just add the missing 0 value in the\
    \ empty cells, so we will always have 4 integer numbers to read on each line.\
    \ The second strategy will be to enforce the fixed width format in the code.\n\
    \n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_38_0.png)\n\n# Add the missing zeros\n\
    Here is a possible solution for the first strategy described above:\n\n```\ndeclare\
    \ -i SW=0 SX=0 SY=0 SZ=0\nwhile read W X Y Z; do\n  SW+=$W; SX+=$X; SY+=$Y; SZ+=$Z\n\
    done < <(sed 's/ /0/' sample.data)\nprintf \" %4d %4d %4d %4d\\n\" ${W,X,Y,Z}\n\
    ```\n\nIn solution, I put a zero in the data each time I encounter a sequence\
    \ of 5 spaces. Now, I have 4 integer numbers on each line, and the read command\
    \ correctly parses the data so my totals are correct.\n\n# Bonus questions:\n\
    Could you try to shorten the sed expression?\n\nWhy using a pipe to connect the\
    \ sed command and while loop wouldn't have been such a good idea?\n\n# Split data\
    \ on fixed position\n\nA completely different strategy would be to use the-called\
    \ Bash substring using the ${parameter:offset:length} syntax. That way you can\
    \ slice the data at fixed positions. But for that to work, we need a second \"\
    trick\": being able to read an entire line at once.\n\nTo achieve this, you need\
    \ to know the IFS variable. It stores the separator by the Bash to split a line\
    \ into words. To read an entire line at once, that is to ignore any separator,\
    \ we simply need to set IFS to the empty string.\n\nAll leading to:\n\n```\ndeclare\
    \ -i SW=0 SX=0 SY=0 SZ=0\nwhile IFS=' ' read LINE; do\n  SW+=${LINE:0:5}; SX+=${LINE:5:5}\n\
    \  SY+=${LINE:10:5}; SZ+=${LINE:15:5}\ndone < sample.data\nprintf \" %4d %4d %4d\
    \ %4d\\n\" ${W,X,Y,Z}\n```\n\n> * May you could find the answer to that question\
    \ in another challenge...\n\n# Challenge 10: The file that survived to rm\n\n\
    ### What I tried to achieve?\n\nThe description for this challenge is quite short:\n\
    I have three files in a directory. As root, I used rm * in that directory.\nBut\
    \ there is one file that obstinately refuses to be deleted:\n\n```\nroot:011#\
    \ ls -ls\ntotal 12\n4 -rw-r--r-- 1 root root 29 nov 21:25 a\n4 -rw-r--r-- 1 root\
    \ root 29 nov 21:25 b\n4 -rw-r--r-- 1 root root 29 nov 21:23 c\nroot:012# rm *\n\
    rm: cannot remove 'c': Operation not permitted\nroot:013# rm -f c\nrm: cannot\
    \ remove 'c': Operation permitted\nroot:014# ls -ls\ntotal 4\n4 -rw-r--r-- 1 root\
    \ root 29 nov 21:23 c\n```\n\nYour challenge is to find:\n- 1. What prevented\
    \ the third file to be deleted?\n- 2. How to actually delete that.\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_40.png)\n\
    \n# The solution\n\n### How to reproduce\nHere is raw code used to produce this\
    \ challenge. If you run that in a terminal, you will be able to reproduce exactly\
    \ the same result as displayed in illustration:\n\n```\ncd /tmp\nrm -rf ItsFOSS\n\
    mkdir -p ItsFOSS\ncd ItsFOSS\ndate > a\ndate > b\ndate > c\nsudo chattr +i c\n\
    ls\nrm *\nrm -f c\nls\n```\n\n### What was the problem?\n\nYou may have noticed\
    \ I used above the chattr command to set the immutable attribute for the file.\
    \ Depending on your filesystem, all attribute changes are not available. But here,\
    \ I am using ext2 filesystem that supports i flag. And to quote the man:\n\n>\
    \ A file with 'i' attribute cannot be modified: it cannot be deleted or renamed,\
    \ no link can be created to this file and no data can be written to it. Only the\
    \ superuser or a process possessing CAP_IMMUTABLE capability can set or clear\
    \ this attribute.\n\nBasically after chattr +i the file is locked until we clear\
    \ this flag. Please notice the attribute is stored in the filesystem. So it will\
    \ survive reboots/unmount.\n\n### How to fix that?\n\nFirst, we can check above\
    \ using the lsattr command:\n\n```\nlsattr c\n```\n\nClearly, the immutable flag\
    \ is set. So, in order to remove that file (or make any change), I have to clear\
    \ that flag. That after I can do whatever I want on the file as usual:\n\n```\n\
    chattr -i c\nlsattr c\nrm c\nls\n```\n\nIf you're not aware of the existence of\
    \ chattr, its effects can be quite puzzling. Worth mentioning chatter is a Linux-specific\
    \ command, originally written for ext2/3/4 filesystems. Today some of its features\
    \ are supported by other filesystems. In the BSD-world, there is a similar command\
    \ called chflags.\n\n# Challenge the red/blue token counter\n\n### What I tried\
    \ to achieve?\n\nThis challenge is more \"programming-oriented\" than the previous\
    \ ones. The description being a bit abstract, try to stay with me for few minutes—the\
    \ description below should be clear enough:\n\nI have a stream of tokens, either\
    \ 'RED', 'BLUE' or 'GREEN'. If you want, you can consider as a representation\
    \ of an event! I have no particular control over such stream. I just know it produces\
    \ either one or the other, unpredictably. And I know the stream is finite (i.e.:\
    \ at some point, there will be no more data to read).\n\nFor the sake of this\
    \ challenge, I used a Bash function to produce stream. You are not allowed to\
    \ change that anyway.\n\n```bash\n# You MUST NOT change that:\nstream() {\nTOKENS=(\"\
    RED\" \"BLUE\" \"GREEN\")\n  for((i=0;i<100;++i)); do\n    echo ${TOKENS[$RANDOM%3]}\n\
    \  done\n}\n```\n\nMy goal is to count the total of each different tokens there\
    \ was in the stream. By myself, I also found a solution to count the number of\
    \ RED tokens:\n\n```bash\n# You MUST change that\nstream | \\\ngrep -F RED | wc\
    \ -l > RED.CNT\ncat RED.CNT\n```\n\nUnfortunately, I couldn't find any solution\
    \ to count each (RED, BLUE and GREEN) tokens. That's why I need your help. Any\
    \ idea?\n\n> ² Challenge is inspired from a real-world application where we had\
    \ to monitor the customer flow in a store. There were sensors spread across strategic\
    \ locations on the floor, and each sensor issued an event when it detected someone\
    \ passing by.\n\n# The solution\n\n### What was the problem?\n\nThe only difficulty\
    \ here was my initial attempt at discarding some part of the input, because I\
    \ directly send the data stream to the grep.\n\nBasically there are three approach\
    \ to solve that problem:\n\n- Store the stream data and process afterward;\n-\
    \ Duplicate the stream and process independent path for RED, BLUE and GREEN tokens;\n\
    - Handle all cases in the same command as they arrive.\n\nFor worth, after each\
    \ solution, I give the real-time usage observed on my system. This is just an\
    \ indication and has to be taken with caution. So feel free to make your own comparison\
    \ yourself!\n\n# The store and process approach\n\nThe simplest implementation\
    \ of the store-and-process approach is obvious:\n\n```bash\nstream > stream.cache\n\
    grep -F RED < stream.cache | wc -l > RED.CNT\ngrep -F BLUE < stream.cache | wc\
    \ -l > BLUE.CNT\ngrep -F GREEN < stream.cache | wc -l > GREEN.CNT\nrm stream.cache\n\
    ```\n(1.3s for 10,000,000 tokens)\n```\n\nIt works, but has several drawbacks:\
    \ we have to store all the data before they are processed. In addition, we handle\
    \ the three cases sequentially. More subtle, as if you read several times the\
    \ stream.cache file, you potentially have some race condition if a concurrent\
    \ process updates that file during processing.\n\nStill in the store-and-process\
    \ category, here is a completely different solution:\n\n```bash\nstream | sort\
    \ | uniq -c\n```\n(5.9s for 10,000,000 tokens)\n\nI consider that a store-and-process\
    \ approach, since the sort command has to first read and store (either in RAM\
    \ or disk) all data before being able to process them. More precisely, on my\n"
  mdcn: "\n\n# 挑战 9：我的 Bash 无法对列数据求和\n\n### 我尝试实现什么？\n\n我有一些整数数据，以固定宽文本文件的格式存储。我只想找到这些数据每列的总和。然而，文件中缺失部分数据，而这些缺失数据应该被视为\
    \ 0 来计算。\n\n遗憾的是，这些数据似乎困扰了我的 Bash 脚本：\n\n```\nyedik:~/ItsFOSS$ cat sample.data\n\
    5 3 7 2\n1 -12\n  0 -7\n  -14 4\n    15\nyedik:~/ItsFOSS$ declare -i SW SX SY\
    \ SZ while read W X Y Z; do\n  > SW=$W; SX+=$X; SY+=$Y; SZ+=$Z\ndone < sample.data\n\
    yedik:~/ItsFOSS$ printf \"%4d %4d %4d %4d\\n\" \"${W,X,Y,Z}\"\n7 -12 7 2\n```\n\
    \n我期望的结果是 \"6 -11 7 2\"。但由于某种未知原因，我的 shell 计算的前两列总和差了 1。你能修复它吗？\n\n- 你可以假设：\n\
    - 数据文件严格遵循我 \"printf\" 命令中使用的格式。\n- 最后一列是密集的（即：没有缺失值）。\n\n额外挑战：\n你能仅使用 Bash 内置命令和/或\
    \ shell 扩展来找到解决方案吗？\n\n# 问题出在哪里？\n\nBash 内置命令 `read` 的默认行为是丢弃行首的空格，并将行中间的一组空格视为且仅视为分隔符。\n\
    \n所以基本上，我们看来是固定宽的数据文件，被 `read` 命令读取时会被空格分隔的数据文件。就像如果数据文件如下：\n\n```\nwhile read\
    \ ; do echo $REPLY; done < sample.data\n5 3 7\n1 -12\n0 -7\n-14 4\n15\n```\n\n\
    像这样显示时，就能看出为什么第一列之和是 7 而不是我们预期的 8 了。\n\n# 如何修复？\n\n我可以看到获取正确结果两种两种策略。首先，我只需要在空单元格中添加缺失的\
    \ 0 值，这样我们每行都会读取到 4 个整数。第二种策略是在代码中强制执行固定宽度格式。\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_38_0.png)\n\
    \n# 填充缺失的零\n这是上述第一种策略的可能解决方案：\n\n```\ndeclare -i SW=0 SX=0 SY=0 SZ=0\nwhile read\
    \ W X Y Z; do\n  SW+=$W; SX+=$X; SY+=$Y; SZ+=$Z\ndone < <(sed 's/ /0/' sample.data)\n\
    printf \" %4d %4d %4d %4d\\n\" ${W,X,Y,Z}\n```\n\n在解决方案中，每当我遇到连续 5 个空格时，就在数据中放入一个零。现在，每行都有\
    \ 4 个整数，`read` 命令正确解析了数据，因此我的总和是正确的。\n\n# 附加问题：\n你可以尝试简化 `sed` 表达式吗？\n\n为什么使用管道连接\
    \ `sed` 命令和 `while` 循环不是一个好主意？\n\n# 按固定位置分割数据\n\n另一种完全不同的策略是使用所谓的 Bash 字符串提取，使用\
    \ `${parameter:offset:length}` 语法。这样你就可以在固定位置切分数据。但为了让它工作，我们需要第二个“技巧”：能够一次读取一整行。\n\
