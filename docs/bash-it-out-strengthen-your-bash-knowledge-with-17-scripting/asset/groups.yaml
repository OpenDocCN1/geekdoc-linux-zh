    \ illustration (assuming you are using the same software version as me):\n\n```\n\
    rm -rf ItsFOSS\nmkdir -p ItsFOSS\ncd ItsFOSS\ncat sample.data << 'EOT'\n102\n\
    071\n210\n153\nEOT\nclear\ncat sample.data\ndeclare -i SUM=0\nwhile read X; do\n\
    \  SUM+=$X\ndone < sample.data\necho \"Sum is: $SUM\"\n```\n\n# What was the problem?\n\
    \nThe problem was caused by the 071 value. As you noticed, this number is starting\
    \ by a 0—probably to ensure all data are formatted on three digits. Nothing complicated\
    \ here, except that ... following an unfortunate convention inherited from the\
    \ C programming language, prefixing an integer by 0 is a way to specify that number\
    \ is expressed in octal, and not in decimal."
  - '[PAGE 16]


    Octal numbers are expressed with digits from 0 to 7. Here is a simple conversion
    table:


    | Decimal | Octal | Decimal | Octal | Decimal | Octal | Decimal | Octal |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 0 | 0 | 8 | 10 | 16 | 20 | 56 | 10 |

    | 1 | 1 | 9 | 11 | 17 | 21 | ... | 57 | 71 |

    | 2 | 2 | 10 | 12 | 18 | 22 | 58 | 72 |

    | 3 | 3 | 11 | 13 | 19 | 23 | 59 | 73 |

    | 4 | 4 | 12 | 14 | 20 | 24 | 60 | 74 |

    | 5 | 5 | 13 | 15 | 21 | 25 | 61 | 75 |

    | 6 | 6 | 14 | 16 | 22 | 26 | 62 | 76 |

    | 7 | 7 | 15 | 17 | 23 | 27 | 63 | 77 |


    The value in bold in the table above the one that caused the error when evaluating
    the sum. The Bash read 071 and, because of the leading 0, interpreted it as the
    octal number $71_8$ representing the $57_{10}$ decimal value. You can check that
    easily:


    ```

    echo $((071))

    57

    ```


    # How to fix that?


    I can see two main strategies to fix that issue. Either removing the leading zeros.
    Or finding a way to make the shell understand all my numbers are **decimal** values.


    Removing leading zeros


    Here is a simple solution using the sed command to remove the leading zeros:


    ```

    declare -i SUM=0

    while read X ; do

    SUM+=$X

    done <(sed -E s/^\0+//// sample.data)

    echo "Sum is: $SUM"

    ```


    ![](img/8f6bf8024f58c92982eb49d5f91a7bf7_16_0.png)


    **Bonus question:

    why didn''t I used a `pipe` instead of a *process substitution*?'
  - "[PAGE 17]\n\n# Specifying explicitly the base\n\nThe previous solution is (mostly)\
    \ straightforward — but the Bash allows us to make things better. Instead of trying\
    \ to fix the data, we will simply specify *explicitly* our numbers are expressed\
    \ in base 10 (decimal), instead of base 8 (octal). You can do that by using the\
    \ base#value syntax.\n\nCompare those three examples:\n\n```\necho $((071))  \
    \         # The leading 0 specify the number as octal\n57\necho $((8#071))   \
    \   # We *explicitly* specify base 8 (octal)\n57\necho $((10#071))     # We *explicitly*\
    \ specify base 10 (decimal)\n71\n```\n\nTo fix my initial command and obtain the\
    \ correct result, I only have to explicitly specify the base 10 for all my data:\n\
    \n```\ndeclare -i SUM=0\nwhile read X ; do\n  SUM+($(10#$X))\ndone < sample.data\n\
    echo \"Sum is: $SUM\"\n```\n\nI let you check yourself, but it definitely should\
    \ produce the correct result this time!\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_17_0.png)"
- md: "\n# Challenge 3: My command outputs are in the wrong order!\n\nWhat I tried\
    \ to achieve?\n\nThis time, I want a shell function to log the round trip time\
    \ (rtt) to a server. Only if the ping\ncommand has succeeded, I want to record\
    \ the date of the measure on the line below the rtt.\n\nGiven those requirements,\
    \ I end up with that:\n\n```\nyesik:~/ItsFOSS$ probe((\n  > ping -qnc2 www.google.com\
    \ | \\\n  > grep rtt & \\\n  > date +\"OK %D %T\"\n  )\nyesik:~/ItsFOSS$ rm -f\
    \ log\nyesik:~/ItsFOSS$ probe >> log\nyesik:~/ItsFOSS$ probe >> log\nyesik:~/ItsFOSS$\
    \ cat log\nOK 11/22 22:52:36\nrtt min/avg/max/mdev = 53.394/77.140/100.887/23.748\n\
    OK 11/22 22:52:39\nrtt min/avg/max/mdev = 49.142/49.731/50.320/0.589\n```\n\n\
    But, I don't understand why the date and rtt lines are swapped in the log file?!\
    \ The date should\nappear below the rtt. But here it appears above. Why? Could\
    \ you fix that?\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_18_0.png)\n\n# The\
    \ solution problem?\n\nWhat was made a typo:\nI've simply made a typo: I mistaken\
    \ for &&—maybe I was confused by the pipe (|) symbol above? Indeed, all the |,\
    \ ||, & and && operators can be used to join two shell commands. They have completely\
    \ different meanings:\n\n| cmd | operator | Description |\n| :--- | :--- | :---\
    \ |\n| cmd1 \\| cmd2 | The pipe symbol | Run both commands in parallel in a sub-shell,\
    \ using the output of cmd1 as input to cmd2. The pipe is a very common way to\
    \ combine several basic commands in order to accomplish complex tasks. |\n| cmd1\
    \ & cmd2 | The ampersand | Run cmd1 as a background process, and in parallel,\
    \ run cmd2 in the foreground. The two commands are not connected in any way using\
    \ that operator. |\n| cmd1 \\| cmd2 | The short-circuit OR | Run cmd2 only if\
    \ cmd1 complete before cmd2 is eventually run. In other words, commands run sequentially.\
    \ |\n| cmd1 && cmd2 | The short-circuit AND | Run cmd2 only if cmd1 was successful.\
    \ As a consequence cmd1 must complete before cmd2 is eventually run. In other\
    \ words, commands run sequentially. |\n\nArmed with that knowledge, let's now\
    \ take look at my original code:\n\n```\nprobe() {\nping -qnc2 www.google.com\
    \ | \\\ngrep rtt & \\\\\ndate +\"OK %D %T\"\n}\n```\n\n- 1. I want to run the\
    \ ping command and send its output to the grep command. The pipe is the right\
    \ operator.\n- 2. But after that, I wanted to write the date only if the pipe\
    \ was successful. Here, I needed the logical AND operator (&&). But instead of\
    \ that, I used the & operator, that basically run ping | grep into the background\
    \ — always. And in the foreground — always. There is a race condition as both\
    \ processes are now running in parallel and compete to write on stdout (the terminal\
    \ output). Unsurprisingly, in that particular example, the date command won every\
    \ time over the ping command.\n\nTherefore the correct syntax would have been:\n\
    \n```\nprobe() {\nping -qnc2 www.google.com | \\ \\\ngrep rtt && \\\ndate +\"\
    OK %D %T\"\n}\n```\n\nIn my case, the issue was immediately visible because, obviously,\
    \ the ping command takes more time to complete than the date command. But, as\
    \ this is often the case with race conditions, such mistakes could easily remain\
    \ hidden for a very long time when the two \"contestants\" of the race take almost\
    \ the same time to complete. For example, the following example is a lot less\
    \ deterministic:\n\n```\nprobe() {\nping -qnc2 itsfoss.com | sed 1q & \\ \\\n\
    ping -qnc2 kernel.org | sed 1q\n}\n```\n\nFrom my location, on 2000 runs, the\
    \ first lost only 3 times. That means the \"bug\" was visible only in 15% of the\
    \ cases. Next time'll report some occasional crash — be kind with your favorite\
    \ developers and remember that even by typos, race conditions are hard to reproduce\
    \ and even harder to trace!\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_20.png)\n\
    \n# Challenge 4: Keeping filenames\n\nWhat I tried to achieve?\n\nIn a file, I\
    \ have a list of filenames stored one per line (this is part of the logs). I want\
    \ to extract from that all files containing .bat extension. That extension must\
    \ be spelled exactly that and must appear at the end of the filename.\n\nThe grep\
    \ command is the canonical tool to find lines containing some pattern in a file.\
    \ Unfortunately, I wasn't able to achieve my intended result:\n\n```\nyesik:~/ItsFOSS$\
    \ cat sample.data\nlogin.bat\nlogout.batch\nacrobat.exe\nfirst-run.pdf\nfirst-run.bat.orig\n\
    ```\nyesik:~/ItsFOSS$ grep .bat sample.data\nlogin.bat\nlogout.batch\nacrobat.exe\n\
    first-run.pdf\nfirst-run.bat.orig\n\nAs you can see, my solution kept filenames\
    \ I didn't want. It is somewhat understandable for .batch or .bat.orig files.\
    \ But could you explain why acrobat.exe was retained? And how could you fix my\
    \ solution to achieve the intended goal?\n\n# The solution\n\nWhat was the problem?\n\
    \nMy issue here was caused by the grep command taking a regular expression as\
    \ search pattern not a fixed string. Regular expressions allow to describe a set\
    \ of strings. This is achieved through the use of metacharacters. That is characters\
    \ which have a special meaning rather than matching with their value. The dot\
    \ is such a character. A dot in a regular expression will match any character.\
    \ So, when we:\n\n```\ngrep .bat sample.data\n```\n\nThat means I want to keep\
    \ lines containing the letters b, a and t, preceded by any character. Either a\
    \ verbatim dot. Or any other character.\n\nHow to fix that?\n\nProtecting the\
    \ dot from special interpretation\n\nTo fix that, I may remove the special meaning\
    \ of the dot. In a regular expression, you remove the special meaning of a metacharacter\
    \ by preceding it with a backslash. However there is a pitfall: the argument string\
    \ is processed twice. Once by the shell that will parse the command. Then a second\
    \ time by the grep command that will interpret the regular expression. So, for\
    \ the grep command to see backslash, we must escape that one first from the shell\
    \ interpretation using a backslash:\n\n```\ngrep \\\\.bat sample.data\n```\n\n\
    If you don't like the \"double backslash\", a second option is to use single quotes\
    \ to protect the whole pattern from any shell interpretation:\n\n```\ngrep '\\\
    .bat' sample.data\n```\n\nFinally, if you really don't like backslashes, you may\
    \ use a character set in the regular expression:\n\n```\ngrep '[.bat]' sample.data\n\
    ```\n\nA character set will match any character between the brackets. If you only\
    \ put a dot between the brackets, it can only match a verbatim dot.\n\nAnchoring\
    \ a pattern at the end of a line\n\nThe three solutions above removed the special\
    \ meaning of the dot. But how to keep only files ending by .bat? Once again the\
    \ solution lies in the regular expression metacharacters. Especially the dollar\
    \ sign will match the end of the line. And once again, since the dollar sign special\
    \ meaning in the shell too, we must protect it from the shell interpretation.\n\
    \nAll finally leading to those possible solutions:\n\n```\nyesik:~/ItsFOSS$ grep\
    \ '\\.bat$' sample.data\nlogin.bat\nfirst-run.bat\n```\n\nOr\n\n```\nyesik:~/ItsFOSS$\
    \ grep \\.bat\\$ sample.data\nlogin.bat\nfirst-run.bat\n```\n\nor I let you find\
    \ a third one, maybe using some brackets?\n\n# Challenge 5: The lazy typist challenge\n\
    \nWhat I tried to achieve?\n\nI have the following content in my current working\
    \ directory:\n\n```\nyesik:~/ItsFOSS$ ls -F\narchives/\nreport-fall-2015.pdf\n\
    report-summer-2015.pdf\nreport-summer-2016.pdf\nreport-winter-2014.pdf\n```\n\n\
    I just want to copy the summer 2016 & fall 2015 reports in the archive folder.\
    \ That's pretty simple:\n\n```\nyesik:~/ItsFOSS$ cp report-summer-2016.pdf archives/\n\
    yesik:~/ItsFOSS$ cp report-fall-2015.pdf archives/\n```\n\nHowever as I'm lazy,\
    \ I cannot satisfy those commands as they require 70 keystrokes. Way too much\
    \ for my poor fingers! Could you help me in finding a way to copy those files\
    \ with the minimum number of keystrokes.\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_24_0.png)\n\
    \n# My solution\n\nFor this challenge I will not claim to have \"the\" solution.\
    \ Maybe you will be able to achieve a better score than myself? In that case,\
    \ you really deserve congratulations!\n\nAnyway...\nThe first and most obvious\
    \ optimization will be to replace the two commands by only one:\n\n```\ncp report-summer-2016.pdf\
    \ report-fall-2015.pdf archives/\n```\n\nThen we can use glob patterns to shorten\
    \ each filename. Since there is only one \"fall\", report, for this one is easy,\
    \ but we must take extra cares for the summer report since I'm only interested\
    \ in the 206 version:\n\n```\ncp report-s*-2016.pdf report-fall*.pdf archives/\n\
    ```\n\nAs a matter of fact, given the other filenames structure, I can go even\
    \ further into that way:\n\n```\ncp *6* *fa* archives/\n```\n\nBy the way we can\
    \ do the same for the destination directory—which is the only subdirectory here:\n\
    \n```\ncp *6* *fa* */\n```\n\nIn some cases, using brace expansion can further\
    \ reduce the number of required keystrokes. But in that case, we remain stuck\
    \ at 15 characters:\n\n```\ncp *{6,fa} */\ncp *{6,fa*,}\n```\n\nUnless *you* found\
    \ something \"better\"?\n"
  mdcn: "\n\n# 挑战 3：我的命令输出顺序错了！\n\n我想实现什么？\n\n这次，我想写一个 shell 函数来记录到服务器的往返时间 (rtt)。只有当\
    \ `ping` 命令成功后，我才希望在 rtt 的下方记录测量的日期。\n\n根据这些要求，我写出了这样的代码：\n\n```\nyesik:~/ItsFOSS$\
    \ probe((\n  > ping -qnc2 www.google.com | \\\n  > grep rtt & \\\n  > date +\"\
    OK %D %T\"\n  )\nyesik:~/ItsFOSS$ rm -f log\nyesik:~/ItsFOSS$ probe >> log\nyesik:~/ItsFOSS$\
    \ probe >> log\nyesik:~/ItsFOSS$ cat log\nOK 11/22 22:52:36\nrtt min/avg/max/mdev\
    \ = 53.394/77.140/100.887/23.748\nOK 11/22 22:52:39\nrtt min/avg/max/mdev = 49.142/49.731/50.320/0.589\n\
    ```\n\n但是，我不理解为什么日志文件中日期行和 rtt 行反过了？！日期应该出现在 rtt 下方。但在这里它出现在了上方。为什么？你能修复它吗？\n\n\
    ![](img/8f6bf8024f58c92982eb49d5f91a7bf7_18_0.png)\n\n# 解决方案是什么？\n\n出现的拼写错误：\n\
    我只是写错了一个符号：我把 `&&` 错成了 `&`——也许是被上面的管道 (|) 符号搞混了？确实，所有的 `|`、`||`、`&` 和 `&&` 运算符都可以连接两个\
    \ shell 命令。它们的含义完全不同：\n\n| cmd | 运算符 | 说明 |\n| :--- | :--- | :--- |\n| cmd1 \\\
    | cmd2 | 管道 | 在子 shell 中并行运行两个命令，并将 cmd1 的输出作为 cmd2 的输入。管道是组合多个基本命令以完成复杂任务的非常常用方法。\
    \ |\n| cmd1 & cmd2 | 安培符 | 将 cmd1 作为后台进程运行，并并行地在前台运行 cmd2。使用该运算符时，两个命令之间没有任何连接。\
    \ |\n| cmd1 \\| cmd2 | 短路或 | 仅当 cmd1 在 cmd2 运行之前完成后才运行 cmd2。换句话之，命令按顺序执行。 |\n\
    | cmd1 && cmd2 | 短路与 | 仅当 cmd1 执行成功时运行 cmd2。结果 cmd1 必须在 cmd2 运行之前完成。换句话之，命令按顺序执行。\
    \ |\n\n掌握了这些知识，现在来看看我的原始代码：\n\n```\nprobe() {\nping -qnc2 www.google.com | \\\n\
    grep rtt & \\\\\ndate +\"OK %D %T\"\n}\n```\n\n- 1. 我想运行 `ping` 命令并将其输出发送给 `grep`\
    \ 命令。管道是正确的运算符。\n- 2. 但之后，我只想在管道成功后才写入日期。在这里，我需要的是逻辑与运算符 (`&&`)。但我使用了 `&` 运算符，它基本上是总是将\
    \ `ping | grep` 放到后台运行，并总是在前台运行。由于两个进程现在都在并行运行并竞争写入 stdout（终端输出），因此存在竞态条件。意乎不用，在那个特定的示例中，`date`\
    \ 命令每次都赢了 `ping` 命令。\n\n因此，正确的语法应该是：\n\n```\nprobe() {\nping -qnc2 www.google.com\
    \ | \\ \\\ngrep rtt && \\\ndate +\"OK %D %T\"\n}\n```\n\n在我的情况下，问题是立即可见的，因为 `ping`\
    \ 命令完成的时间比 `date` 命令长。但由于竞态条件经常发生，当两个“竞争者”完成所需的时间相似时，这种错误很容易被隐藏。下面的例子确定性高得多：\n\
    \n```\nprobe() {\nping -qnc2 itsfoss.com | \\\nping -qnc2 kernel.org\n}\n```\n\
    \n在 2000 次运行中，这个“bug”只出现了 15% 的情况。对各位开发者友好一点，即使是竞态条件导致的错误也很难以复现，更难以追踪！\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_20.png)\n\
    \n# 挑战 4：保留文件名\n\n我想实现什么？\n\n在一个文件中，我有一行文件名列表（这是日志的一部分）。我想提取所有包含 `.bat` 扩展的文件。该扩展名必须完全匹配并且出现在文件名的末尾。\n\
    \n`grep` 命令是查找包含某些模式的标准工具。遗憾的是，我没有实现预期的结果：\n\n```\nyesik:~/ItsFOSS$ cat sample.data\n\
    login.bat\nlogout.batch\nacrobat.exe\nfirst-run.pdf\nfirst-run.bat.orig\n```\n\
    yesik:~/ItsFOSS$ grep .bat sample.data\nlogin.bat\nlogout.batch\nacrobat.exe\n\
    first-run.pdf\nfirst-run.bat.orig\n```\n\n你可以看到，我的解决方案保留了我不需要的文件。对于 `.batch` 或\
    \ `.bat.orig` 是可以理解的，但为什么保留了 `exe` 呢？如何修复我的解决方案来实现目标？\n\n# 解决方案\n\n这里问题的原因是 `grep`\
    \ 命令接收的是正则表达式而不是固定字符串。正则表达式允许描述一组字符串。这是通过使用元字符实现的。点 `.` 是一个具有特殊含义的字符。在正则表达式中，点会匹配任何字符。所以，当我们执行：\n\
    \n```\ngrep .bat sample.data\n```\n\n这意味着我想保留包含 `b`、`a` 和 `t` 字母的行，前面是任意字符。可以是字面的点或其他字符。\n\
    \n如何修复？\n\n保护点免受特殊解释\n\n为了修复这个问题，我可能移除点的特殊含义。在正则表达式中，通过在它前面加上斜杠来移除元字符的特殊含义。但有一个陷阱：参数被处理了两次。一次由解析命令的\
    \ shell，第二次由解释正则表达式的 grep 命令。所以为了让 grep 命令看到斜杠，我们必须先对 shell 进行转义：\n\n```\ngrep\
    \ \\\\.bat sample.data\n```\n\n如果你不喜欢“双斜杠”，第二个选项是使用单引号保护整个模式免受 shell 的解释：\n\n\
    ```\ngrep '\\.bat' sample.data\n```\n\n最后，如果你真的不喜欢斜杠，你可以在正则表达式中使用字符集：\n\n```\n\
    grep '[.bat]' sample.data\n```\n\n字符集会匹配括号内的任何字符。如果你只在括号内放一个点，它只能匹配字面的点。\n\n在行末尾锚定模式\n\
    \n上面的三个解决方案都移除了点的特殊含义。但如何保留以 `.bat` 结尾的文件呢？再次，解决方案在于正则表达式元字符。特别是美元符号 `$` 会匹配行尾。同样，由于美元符号在\
    \ shell 中也有特殊含义，我们必须保护它免受 shell 的解释。\n\n最终导致这些可能的解决方案：\n\n```\nyesik:~/ItsFOSS$\
    \ grep '\\.bat$' sample.data\nlogin.bat\nfirst-run.bat\n```\n\n或者\n\n```\nyesik:~/ItsFOSS$\
    \ grep \\.bat\\$ sample.data\nlogin.bat\nfirst-run.bat\n```\n\n或者让我找第三种，也许使用括号？\n\
    \n# 挑战 5：懒打字者挑战\n\n我想实现什么？\n\n我的当前工作目录下有以下内容：\n\n```\nyesik:~/ItsFOSS$ ls -F\n\
    archives/\nreport-fall-2015.pdf\nreport-summer-2015.pdf\nreport-summer-2016.pdf\n\
    report-winter-2014.pdf\n```\n\n我只想把 2016 年夏季和 2015 年秋季的报告复制到存档文件夹中。这很简单：\n\n```\n\
    yesik:~/ItsFOSS$ cp report-summer-2016.pdf\nyesik:~/ItsFOSS$ cp report-fall-2015.pdf\
    \ archives/\n```\n\n但是，因为我很懒，我无法满足这些命令，因为它们需要 70 次按键。对我这可怜的手来说太太多了！你能帮我找到一种用最少按键次数复制这些文件的方法吗？\n\
    \n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_24.png)\n\n# 我的解决方案\n\n对于这个挑战我不声称拥有“唯一的”解决方案。也许你可以获得比我更好的分数？如果是那样，你真的值得祝贺！\n\
    \n总之……\n第一个最显而易见的优化是将两个命令合并为一个：\n\n```\ncp report-summer-2016.pdf report-fall-2015.pdf\
    \ archives/\n```\n\n然后我们可以使用通配符（glob）来缩短每个文件名。由于只有一个“秋季”报告，这一个很容易，但对于夏季报告我们必须格外小心，因为我只对\
    \ 2016 版本感兴趣：\n\n```\ncp report-s*-2016.pdf report-fall*.pdf archives/\n```\n\n\
    事实上，考虑到其他文件名的结构，我可以进一步这样操作：\n\n```\ncp *6* *fa archives/\n```\n\n顺便说一下，我们可以对目标目录执行同样的操作——它是这里唯一的子目录：\n\
    \n```\ncp *6* *fa */\n```\n\n在某些情况下，使用大括号扩展可以进一步减少所需的按键次数。但在那种情况下，我们仍然停留在 15 个字符：\n\
