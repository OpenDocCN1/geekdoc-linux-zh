  - '[PAGE 7]


    # Publisher’s Foreword


    Bash It Out is our first attempt in bringing out unique and helpful Linux related
    educational material in book format.


    Some of you might already know us from the It''s FOSS Linux Blog (https://itsfossoss.com),
    an open source web portal promoting Linux and Open Source. With over 250,000 members
    in our community, we feel pride in being one of the most prominent voices in the
    world of Open Source.


    What you are reading as a book was started as a mere Facebook post. It was liked
    by many Linux enthusiasts and that encouraged us to cover it on the website itself.


    Eventually, we thought of putting it all in a more organized form and thus came
    out Bash It Out!


    It consists of a few challenges that we already put on our website and some exclusively
    new problems.


    We plan to add more new problems in this book in future.


    I hope you enjoy solving these problems and learn new things from the solutions.


    Abhishek Prakash

    Co-Founder, It''s FOSS'
  - '[PAGE 8]


    # How to use this Bash Challenge book?


    Since you are taking the Bash challenge, we presume that you are aware of the
    basic fundamentals of the Bash scripting. You don''t have to be a command line
    ninja to take up these challenges but you must know a thing or two about Bash
    and Linux/Unix commands.


    The problem given here doesn''t require you to write a Bash script. It rather
    presents you with a scenario and asks you why the output is not the expected one
    or why the script is behaving while it shouldn''t.


    The Bash scripting challenges in this book are divided into 3 levels of difficulties.
    So, if you are a beginner, you''ll learn a lot with higher level challenges. And
    if you are a pro, you can jump to expert level challenges straightaway though
    I suggest you take all the challenges to test your knowledge.


    The primary aim of this book is not to teach Bash scripting. We aim to provide
    you with tricky question that will force you to go deeper with your Bash knowledge.
    You won''t find these things in text books.


    While taking the challenges, you should refer to man pages of the commands or
    Google for your usage. There is no restriction on that.


    One important thing here, we provide one solution to each Bash exercise here.
    But there can be in fact more than one ways to solve the same problem. So if you
    don''t find your solution in the book, feel free to discuss it on our Facebook
    page or by sending us an email.


    Enough talk! Come on, Bash It Out!'
  - '[PAGE 9]


    # Before you go on bashing


    A few details you should know. To create this challenge, I used:


    +   - GNU Bash, version 4.4.5 (x86_64-pc-linux-gnu)

    - Debian 8.4.7-1 (amd64)

    - All commands are those shipped with a standard Debian distribution

    - No command was aliased


    The challenges are divided in three levels.


    +   - level 1 challenges covers tricks accessible to all Bash scripters;

    - level 2 challenges requires some knowledge of a specific command or shell feature;

    - level 3 challenges are more tricky and may require more advanced concepts or
    more subtle solutions.


    That being said, the division is rather arbitrary, so don''t be afraid to try
    the challenges in the order you want. The only real prerequisites here are some
    basic Bash syntax knowledge and most important, the desire to learn while having
    fun.


    If you feel like discussing any problem, feel free to reach out by any of these
    three means:


    +   - Email: sylvain@yesik.it

    - Facebook page: https://www.facebook.com/Yes.I.Know.IT/

    - Website: https://yesik.it


    So, let''s play together!'
- md: "\n# Level 1\n\n# Bash challenge\n\n## Challenge 1: Counting files in the current\
    \ directory\n\nWhat I tried to achieve?\n\nI wanted to count the number of files\
    \ in the current directory. For that, I used the ls and wc commands:\n\n```\n\
    yesik:~/ItsFOSS$ ls -l\ntotal 0\n-rw-r--r-- 1 yesik yesik Nov 22 22:45 file1\n\
    -rw-r--r-- 1 yesik yesik Nov 22 22:45 file2\n-rw-r--r-- 1 yesik yesik Nov 22 22:45\
    \ file3\nok\nyesik:~/ItsFOSS$ ls | wc -l\n4\n```\n\nI was expecting a result of\
    \ 3 since I visibly have three files in that directory. But for some unknown reason,\
    \ was not the result I've obtained. Could you explain me why? And most important,\
    \ how to achieve my goal?\n\n```\nyesik:-/ItsFOSS$ ls -l\ntotal 0\n-rw-r--r--\
    \ 1 yesik yesik Nov 23 00:29 file1\n-rw-r--r-- 1 yesik yesik Nov 23 00:29 file2\n\
    -rw-r--r-- 1 yesik yesik Nov 23 00:29 file3\nok\nyesik:-/ItsFOSS$ ls | wc -l\n\
    4\nyesik:-/ItsFOSS$ \n```\n\n## The solution\n\nHow to reproduce?\nHere is the\
    \ raw code we used to produce this challenge. If you run that in a terminal, you\
    \ will be able to reproduce exactly the same result as displayed in the challenge\
    \ illustration (assuming you are using the same software version as me):\n\n```\n\
    mkdir -p ItsFOSS\ncd ItsFOSS\ntouch file1 file2 '$file3\\nok'\nclear\nls -1\n\
    ls | wc -l\n```\n\nWhat was the problem?\nWhen to a pipe, the ls command write\
    \ each filename on its line. Just like when using ls -1 from a terminal. And the\
    \ wc -l command count lines. Apparently ls | wc -l should display the number of\
    \ files or folder in the current directory.\n\nHowever a filename may have the\
    \ newline character (often denoted \\n). It is certainly uncommon but perfectly\
    \ valid though.\n\nIn that challenge, the ok you see on the screen capture was\
    \ part of the third filename, which in fact was file3\\nok. Not file3 as one may\
    \ believe it at first sight.\n\nThis is a case you might need to take into account\
    \ in your scripts or shell commands to not break if a filename contains that character.\
    \ Either by accident, or as the result of some malicious activity.\n\nHow to fix\
    \ that?\nRemove non-printable characters from the ls output\n\n```\nls -q | wc\
    \ -l\n```\n\nModern versions of ls have the -q option that will replace non-printable\
    \ characters by a question mark (?) The -q option is more portable than the -b\
    \ option you sometimes see used for purpose. In both cases, we are absolutely\
    \ certain \\n embedded in filename will not interfere with our count. According\
    \ to POSIX:\n\n- -q Force each instance of non-printable filename characters and\
    \ <tab>s to be written as the question-mark ('?') ) character. Implementations\
    \ may provide this option by default if the output is to a terminal device.\n\n\
    My Debian Squeeze test system, -q was not the default. That's why the ok word\
    \ appears on its own line. On Debian Stretch, -q is enabled by default and the\
    \ output is default — **only when the output is a console** — and it will display\
    \ the last filename as file3?\n\nIgnore the file's name\n\nI want to count the\
    \ number of *files*. Not the number of filenames. So, as an alternate solution,\
    \ I could just ignore the filename and issue a *token* for each encountered file.\
    \ counting the number of tokens will give the same result as counting the number\
    \ of files. And as we have the control of the token, we cannot be fooled. We can\
    \ use the find command for that purpose:\n\n```\nfind . -minddepth 1 -maxdepth\
    \ 1 -printf '\\n' | wc -l\n  -or-\nfind . !-path . -maxdepth 1 -printf '\\n' |\
    \ wc -l\n```\n\nHere I made the choice of using an empty line (\\n) as the token.\
    \ So, those two command will produce one empty line per entry in the current directory.\
    \ Notice the actual filename is never written to the output. So whatever characters\
    \ may be embedded in filename, they will not interfere with the pipe. I just have\
    \ to count the number of lines to know the number of files. Please notice -minddepth\
    \ 1 and !-path . are two different tricks to remove the current directory (.)\
    \ from the selection. Otherwise, your count will be off by one.\n\n## Challenge\
    \ 2: My shell don't know how to count\n\nWhat I tried to achieve?\nI have some\
    \ data containing integer numbers, one on each line, I want to compute the sum\
    \ of all numbers:\n\n```\nyesik:~/ItsFOSS$ cat sample.data\n102\n071\n210\n153\n\
    yesik:~/ItsFOSS$ declare -i SUM=0\nyesik:~/ItsFOSS$ while read X ; do\n  SUM+=$X\n\
    done < sample.data\nyesik:~/ItsFOSS$ echo \"Sum is: $SUM\"\nSum is: 522\n```\n\
    \n```\nyesik:~/ItsFOSS$ cat sample.data\n102\n071\n210\n153\nyesik:~/ItsFOSS$\
    \ declare -i SUM=0\nyesik:~/ItsFOSS$ while read X ; do\n  SUM+=$X\ndone < sample.data\n\
    yesik:~/ItsFOSS$ echo \"Sum is: $SUM\"\nSum is: 522\nyesik:~/ItsFOSS$ \n```\n\n\
    Unfortunately, the result I obtain is wrong (the expected result was 536). Could\
    \ you explain why the result is wrong and fix my commands to obtain the correct\
    \ result?\n\nExtra challenge: could you find a solution using only Bash commands\
    \ and substitutions.\n\n## The solution\n\nHow to reproduce?\nHere is the raw\
    \ code we used to produce this challenge. If you run that in a terminal, you will\
    \ be able to reproduce exactly the same result as displayed in the challenge illustration\
    \ (assuming you are using the same software version as me):\n\n```\nrm -rf ItsFOSS\n\
    mkdir -p ItsFOSS\ncd ItsFOSS\ncat sample.data << 'EOT'\n102\n071\n210\n153\nEOT\n\
    clear\ncat sample.data\ndeclare -i SUM=0\nwhile read X; do\n  SUM+=$X\ndone <\
    \ sample.data\necho \"Sum is: $SUM\"\n```\n\n## What was the problem?\nThe problem\
    \ was caused by the 071 value. As you noticed, this number is starting by 0—probably\
    \ to ensure all data are formatted on three digits. Nothing complicated here,\
    \ except that following an unfortunate convention from the C programming language,\
    \ prefixing an integer by 0 is a way to specify that number is expressed in octal,\
    \ and not in decimal.\n\nOctal numbers are expressed with digits from 0 to 7.\
    \ Here is a simple table:\n\n| Decimal | Octal | Decimal | Octal | Decimal | Octal\
    \ | Decimal | Octal |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ |\n| 0 | 0 | 8 | 10 | 16 | 20 | 56 | 10 |\n| 1 | 1 | 9 | 11 | 17 | 21 | ...\
    \ | 57 |\n| 2 | 2 | 10 | 12 | 18 | 22 | 58 | 72 |\n| 3 | 3 | 11 | 13 | 19 | 23\
    \ | 59 | 73 |\n| 4 | 4 | 12 | 14 | 20 | 24 | 60 | 74 |\n| 5 | 5 | 13 | 15 | 21\
    \ | 25 | 61 | 75 |\n| 6 | 6 | 14 | 16 | 22 | 26 | 62 | 76 |\n| 7 | 7 | 15 | 17\
    \ | 23 | 27 | 63 | 77 |\n\nThe value in bold in the table above the one that caused\
    \ the error when evaluating the sum. The Bash read 071 and, because of the leading\
    \ 0, interpreted it as the octal number $71_8$ representing the $57_{10}$ decimal\
    \ value. You can check that easily:\n\n```\necho $((071))\n57\n```\n\n## How to\
    \ fix that?\nI can see two main strategies to fix that issue. Either removing\
    \ the leading zeros. Or finding a way to make the shell understand all my numbers\
    \ are **decimal** values.\n\nRemoving leading zeros\n\nHere is a simple solution\
    \ using the sed command to remove the leading zeros:\n\n```\ndeclare -i SUM=0\n\
    while read X ; do\nSUM+=$X\ndone <(sed -E s/^\\0+//// sample.data)\necho \"Sum\
    \ is: $SUM\"\n```\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_16_0.png)\n\n**Bonus\
    \ question:** why didn't I used a `pipe` instead of a *process substitution*?\n\
    \n## Specifying explicitly the base\n\nThe previous solution is (mostly) straightforward\
    \ — but the Bash allows us to make things better. Instead of trying to fix the\
    \ data, we will simply specify *explicitly* our numbers are expressed in base\
    \ 10 (decimal), instead of base 8 (octal). You can do that by using the base#value\
    \ syntax.\n\nCompare those three examples:\n\n```\necho $((071))           # The\
    \ leading 0 specify the number as octal\n57\necho $((8#071))      # We *explicitly*\
    \ specify base 8 (octal)\n57\necho $((10#071))     # We *explicitly* specify base\
    \ 10 (decimal)\n71\n```\n\nTo fix my initial command and obtain the correct result,\
    \ I only have to explicitly specify the base 10 for all my data:\n\n```\ndeclare\
    \ -i SUM=0\nwhile read X ; do\n  SUM+($(10#$X))\ndone < sample.data\necho \"Sum\
    \ is: $SUM\"\n```\n\nI let you check yourself, but it definitely should produce\
    \ the correct result this time!\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_17_0.png)\n"
  mdcn: "\n\n# 第 1 \n\n# Bash 挑战\n\n## 挑战 1：统计当前目录下的文件\n\n我想实现什么目标？\n\n我想统计当前目录下的文件数量。为此，我使用了\
    \ `ls` 和 `wc` 命令：\n\n```\nyesik:~/ItsFOSS$ ls -l\ntotal 0\n-rw-r--r-- 1 yesik\
    \ yesik Nov 22 22:45 file1\n-rw-r--r-- 1 yesik yesik Nov 22 22:45 file2\n-rw-r--r--\
    \ 1 yesik yesik Nov 22 22:45 file3\nok\nyesik:~/ItsFOSS$ ls | wc -l\n4\n```\n\n\
    我原本预期的结果是 3，因为我肉眼看到目录里有三个文件。但由于某种未知原因，得到的结果并不是我预期的。你能解释一下这是为什么吗？最重要的是，如何实现我的目标？\n\
    \n```\nyesik:-/ItsFOSS$ ls -l\ntotal 0\n-rw-r--r-- 1 yesik yesik Nov 23 00:29\
    \ file1\n-rw-r--r-- 1 yesik yesik Nov 23 00:29 file2\n-rw-r--r-- 1 yesik yesik\
    \ Nov 23 00:29 file3\nok\nyesik:-/ItsFOSS$ ls | wc -l\n4\nyesik:-/ItsFOSS$ \n\
    ```\n\n## 解决方案\n\n如何复现？\n这里是我们用来生成这个挑战的原始代码。如果你在终端中运行它，将能够复现出与挑战插图中完全相同的结果（假设你使用的软件版本与我相同）：\n\
    \n```\nmkdir -p ItsFOSS\ncd ItsFOSS\ntouch file1 file2 '$file3\\nok'\nclear\n\
    ls -1\nls | wc -l\n```\n\n问题出在哪里？\n当使用管道符时，`ls` 命令会将每个文件名写入单独的一行。就像在终端中使用 `ls\
    \ -1` 一一样。而 `wc -l` 命令用于统计行数。显然，`ls | wc -l` 应该显示当前目录下文件或文件夹的数量。\n\n然而，文件名可能包含换行符（通常表示为\
    \ `\\n`）。这虽然罕见，但完全是法的。\n\n在那个挑战中，你在屏幕截图中看到的 `ok` 是第三个文件名的一部分，实际上它是 `file3\\nok`，而不是像初眼看到的那样是\
    \ `file3`。\n\n你在编写脚本或 shell 命令时可能需要考虑这种情况，以防文件名包含该字符时导致程序崩溃。这可能是意外，也可能是恶意活动的结果。\n\
    \n如何修复？\n从 `ls` 的输出中移除不可打印字符\n\n```\nls -q | wc -l\n```\n\n现代版本的 `ls` 有 `-q` 选项，它会将不可打印字符替换为问号（?）。`-q`\
    \ 选项比你有时看到的用于 `-b` 选项更具移植性。在这两种情况下，我们都能完全确定嵌入文件名中的 `\\n` 不会干扰我们的计数。根据 POSIX 标准：\n\
    \n- -q 强制将每个不可打印文件名字符和 <tab> 写入问号字符（'?'）。如果输出目标是终端设备，实现可以默认提供此选项。\n\n在我的 Debian\
    \ Squeeze 测试系统中，`-q` 不是默认的。这就是为什么 `ok` 单词会出现在单独的一行的原因。在 Debian Stretch 上，`-q`\
    \ 是默认开启的，且输出默认——**仅当输出到控制台时**——它会将最后一个文件名显示为 `file3?`\n\n忽略文件名\n\n我想统计*文件*的数量，而不是文件名的数量。所以，作为替代方案，我可以直接忽略文件名并为每个遇到的文件发布一个*令牌*（token）。统计令牌的数量将得到与统计文件数量相同的结果。由于我们控制了令牌，就不会被欺骗。我们可以使用\
    \ `find` 命令来实现此目的：\n\n```\nfind . -maxdepth 1 -printf '\\n' | wc -l\nfind . !\
    \ -path . -printf '\\n' | wc -l\n```\n\n在这里我选择使用空行（`\\n`）作为令牌。因此，这两个命令都会为当前目录产生一个空行。注意实际的文件名从未输出。无论文件名中包含什么字符，都不会干扰管道。我只需要统计行数来获取文件数量。请注意\
    \ `-maxdepth 1` 和 `-path .` 是移除当前目录的两个技巧。否则，你的计数会偏差 1。\n\n## 挑战 2：我的 shell 不会计数\n\
    \n我想实现什么目标？\n我有一些包含整数的数据，每行一个，我想计算所有数字的和：\n\n```\nyesik:~/ItsFOSS$ cat sample.data\n\
    102\n071\n210\n153\nyesik:~/ItsFOSS$ declare -i SUM=0\nyesik:~/ItsFOSS$ while\
    \ read X ; do\n  SUM+=$X\ndone < sample.data\nyesik:~/ItsFOSS$ echo \"Sum is:\
    \ $SUM\"\nSum is: 522\n```\n\n```\nyesik:~/ItsFOSS$ cat sample.data\n102\n071\n\
    210\n153\nyesik:~/ItsFOSS$ declare -i SUM=0\nyesik:~/ItsFOSS$ while read X ; do\n\
    \  SUM+=$X\ndone < sample.data\nyesik:~/ItsFOSS$ echo \"Sum is: $SUM\"\nSum is:\
    \ 522\nyesik:~/ItsFOSS$ \n```\n\n遗憾的是，得到的结果是错误的（预期结果是 536）。你能解释为什么结果是错误的，并修复我的命令以获得正确结果吗？\n\
    \n额外挑战：你能仅使用 Bash 命令找到解决方案吗？\n\n## 解决方案\n\n如何复现？\n这是我们生成此挑战的原始代码。如果你在终端中运行它，将能够复现出与挑战图中完全相同的结果（假设你使用的软件版本与我相同）：\n\
    \n```\nrm -rf ItsFOSS\nmkdir -p ItsFOSS\ncd ItsFOSS\ncat sample.data << 'EOT'\n\
    102\n071\n210\n153\nEOT\nclear\ncat sample.data\ndeclare -i SUM=0\nwhile read\
    \ X; do\n  SUM+=$X\ndone < sample.data\necho \"Sum is: $SUM\"\n```\n\n## 问题是什么？\n\
    问题是由 `071` 值引起的。正如你所看到的，这个数字以 0 开头是为了确保所有数据都是三位数。这里没有什么复杂的，除了遵循 C 语言的约定：在整数前加\
    \ 0 是指定数字为八进制而非十进制的方法。\n\n八进制用数字 0 到 7 表示。这里有一个简单的表格：\n\n| 十进制 | 八进制 | 十进制 | 八进制\
    \ | 十进制 | 八进制 | 十进制 | 八进制 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| 0 | 0 | 8 | 10 | 16 | 20 | 56 | 10 |\n| 1 | 1 | 9 | 11 | 17 | 21\
    \ | ... | 57 |\n| 2 | 2 | 10 | 12 | 18 | 22 | 58 | 72 |\n| 3 | 3 | 11 | 13 | 19\
    \ | 23 | 59 | 73 |\n| 4 | 4 | 12 | 14 | 20 | 24 | 60 | 74 |\n| 5 | 5 | 13 | 15\
    \ | 21 | 25 | 61 | 75 |\n| 6 | 6 | 14 | 16 | 22 | 26 | 62 | 76 |\n| 7 | 7 | 15\
    \ | 17 | 23 | 27 | 63 | 77 |\n\n上表中**加粗**的值是在计算总和时导致错误的那个值。Bash 读取了 `071`，由于前导\
    \ 0，它将其解释为八进制数 $71_8$，代表十进制值 $57_{10}$。你可以轻松地检查这一点：\n\n```\necho $((071))\n57\n\
    ```\n\n## 如何修复？\n我看到了两种解决该问题的主要策略。要么移除前导零，要么找到一种方法让 shell 理解我所有的数字都是**十进制**值。\n\
    \n移除前导零\n\n这是一个使用 `sed` 命令移除前导零的简单解决方案：\n\n```\ndeclare -i SUM=0\nwhile read X\
    \ ; do\nSUM+=$X\ndone <(sed -E s/^\\0+//// sample.data)\necho \"Sum is: $SUM\"\
    \n```\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_16_0.png)\n\n**奖励问题**：我为什么没有使用管道符而是使用了进程替换？\n\
    \n## 显式指定进制\n\n之前的解决方案（大部分）是直观的——但 Bash 允许我们做得更好。与其尝试修复数据，我们只需显式地指定我们的数字是以十进制（base\
    \ 10）表示，而不是八进制（base 8）。你可以通过 `base#value` 语法来实现。对比这三个例子：\n\n```\necho $((071))\
    \           # 前导 0 指定数字为八进制\n57\necho $((8#071))      # 我们显式指定为 8（八进制）\n57\necho\
    \ $((10#071))     # 我们显式指定为 10（十进制）\n71\n```\n\n为了修复我的初始命令并获得正确结果，我只需要为所有数据显式指定进制\
    \ 10：\n\n```\ndeclare -i SUM=0\nwhile read X ; do\n  SUM+($(10#$X))\ndone < sample.data\n\
    echo \"Sum is: $SUM\"\n```\n\n让你自己检查，这次绝对应该产生正确的结果了！\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_17_0.png)\n\
    \n"
