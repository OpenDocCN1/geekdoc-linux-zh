    \nThis work has started by a humble post in the Linux Users Group on Facebook.\
    \ Needless to say, I had no idea at the time there be so many Bash Challenges\
    \ that we could publish an entire book!\n\nCertainly, I couldn't have gone so\
    \ far without the help of Abhishek Prakash who invited me to publish these challenges\
    \ not only on It's FOSS Facebook page but also on the It's FOSS website. Abhishek\
