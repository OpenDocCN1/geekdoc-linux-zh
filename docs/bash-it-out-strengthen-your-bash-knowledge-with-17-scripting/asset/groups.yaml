  - '[PAGE 48]


    For the sake of the demonstration, I only displayed the content of one file. But
    you may imagine I have of them — too many for considering manual editing.


    I thought I found a solution using the cat command:


    ```

    yesIk:-ItsFOSS$ cat HEADER DATA01 | tee DATA01

    # Month, Year, Est.Value

    # Month, Year, Est.Value

    ```


    Unfortunately, for some reason solution didn''t work: not only I lost the data
    but by the header appears twice.


    As you can see, I really need help here — both to explain to me what was going
    on and to help me in solving this issue.


    # The solution


    What was the problem?


    In a pipeline, all commands are launched in parallel. That means the cat command
    reading the DATA01 file and the cat command overwriting that file are launched
    simultaneously.


    This is really a race condition. On my system, tee had time to overwrite the destination
    file before cat had the opportunity to read it. To illustrate that, we can delay
    the commands and see the output is clearly dependent on the timing:


    ```

    cat HEADER DATA01 | ( sleep 1; tee DATA01 )

    # Month, Year, Est.Value

    Dec, 2015, 15000

    Jan, 2016, 12540

    Feb, 2016, 11970

    ```


    ```

    (sleep 1; cat HEADER DATA01 ) | tee DATA01

    # Month, Year, Est.Value

    ```


    I would have a similar issue (albeit deterministic this time) using the simpler:


    ```

    cat HEADER DATA01 > DATA01

    ```'
  - "[PAGE 49]\n\nIn that case, the shell always overwrites the destination file before\
    \ launching the cat command.\nSo the content of the file is lost long before cat\
    \ had even the opportunity to read it.\n\n# How to fix that?\n\nObviously, no\
    \ one would even consider using the sleep hack to solve that challenge in a real\
    \ situation. This is not an issue: part of the standard POSIX tools, we have several\
    \ commands at our disposal to insert the header on top of a file. Before that,\
    \ let's take a look at the most basic solution.\n\n# The KISS solution\n\n```\n\
    cat HEADER DATA01 > DATA01.NEW\nmv -f DATA01.NEW DATA01\n```\n\nDo I really need\
    \ to comment that? Well, while being rudimentary, this solution has a nice feature:\
    \ since we will use the system rename, which itself is atomic in sense other process\
    \ referencing the DATA01 file will either see the old content or the new content—half-written\
    \ content.\n\nA somewhat similar solution, by avoiding creating a temporary file\
    \ visible on the filesystem would first obtain a file descriptor to read from\
    \ the original file before overwriting it:\n\n```\nexec 3DATA01      # (1)\nrm\
    \ -f DATA01       # (2)\ncat HEADER -&3>DATA01 # (3)\nexec 3-<             # (4)\n\
    ```\n\n+   1. Open the file DATA01 for using the file descriptor 3;\n2. Unlink\
    \ the original file (i.e.: remove its directory entry, but not the data since\
    \ the file is still open);\n3. Use cat to read the first header, followed by a\
    \ stdin read from descriptor 3 and to a new DATA01 file;\n4. Close the file descriptor\
    \ 3. This will effectively delete the old DATA01 content.\n\n note this solution\
    \ is not atomic in the sense described above. Anyways, Kudos to [Adithya Kiran\
    \ Gangu](https://github.com/adithyakirangangu) for having suggested me that solution!\n\
    \n# Using sed\n\nWhile encountering such kind of problems, my first idea is often\
    \ to use sed. It is easy to insert a \"header\" after the first line using sed.\
    \ Unfortunately, it's much more difficult to insert something before the first\
    \ line. In fact, to achieve that, we will need a little bit of magic:"
  - "[PAGE 50]\n\n```\nsed -i '1{\n  r HEADER\nN\n}' DATA01\n```\n\nTo fully understand,\
    \ you need to know the {r}read command inserts the content of a file in the destination\
    \ stream, but only once the current line processing has ended. That's why I used\
    \ the (N)ext command: it will end the line 1 processing earlyi.e.: before normal\
    \ line output). So, when encountering that command, sed ends processing of line\
    \ 1. Which triggers output of the content of the HEADER file. But the line 1 itself\
    \ is not sent to the output. It is kept in the sed buffer.\n\nThen sed reads the\
    \ next line of input, append it to the buffer, and as we do not have any rule\
    \ for line 2, process it as usual by sending its buffer to the output (remember\
    \ at that stage, the buffer contains *both line 1 and line 2*).\n\nThis solution\
    \ has a major drawback: it assumes *there is* a line 2. If the data file contains\
    \ only one line, then this will fail miserably.\n\nUsing ed or ex\n\nWe have very\
    \ few occasions of using ed or its cousin ex. Both are line oriented editors.\
    \ Their behavior is very similar to *vi* in that you load file into memory, and\
    \ send commands to the editor to modify that file. The only difference here is\
    \ we will script the commands instead of using them interactively.\n\n```\nDATA01\
    \ <<\nr HEADER\nw\n.\nex -s DATA01 <<\nr HEADER\nwq\n.\n```\n\nThis works great,\
    \ but as we have to load the whole file into memory which could be an issue for\
    \ very large files.\n\nAs always, those are probably only a subset of all possible\
    \ solutions. For example, I bet you could find more solutions using AWK or Perl,\
    \ for example!"
- md: "\n# Challenge 13: Converting text to uppercase\n\n## What I tried to achieve?\n\
    \nI have some text file containing twice the same sentence, once written in English\
    \ and once written French:\n\n```\nyesik.it:~/ItsFOSS$ cat text\nThis text should\
    \ be written in all\nercase letters!\n\nCe text doit être affiché uniquement\n\
    en lettres majuscules!\n```\n\nI need to display the content of that file in all\
    \ uppcases. Do you have any idea how I could perform that task? I mean without\
    \ having retype all the text...\n\n## The solution\n\nThe canonical tool to perform\
    \ character substitution is tr, which stands for transliteration. The tr command\
    \ takes two arguments: the source alphabet and the destination alphabet. And it\
    \ performs a one-to-one mapping from the former to the latter.\n\n```\nyesik.it:~/ItsFOSS$\
    \ tr '[a-z]' '[A-Z]' < text\nTHIS TEXT SHOULD BE WRITTEN IN ALL\nUPPERCASE LETTERS!\n\
    \nCE TEXT DOIT AFFICHÉ UNIQUEMENT\nEN LETRES MAJUSCULES!\n```\n\nThis worked.\
    \ But only for the US-ASCII letters. The accentuated letter, and any letter outside\
    \ the US-ASCII range were not translated.\n\nIf you have some experience in using\
    \ the regular expression, you may be tempted to use character classes instead\
    \ of an explicit range:\n\n> ³ The 'tr' command does not use regular expression.\
    \ But it accepts a syntax similar to character ranges to specify the source and\
    \ destination alphabets. For example, the syntax [a-z] is a shorthand for abcghijklmnopqrstuvwxyz\n\
    \nyesik.it:~/ItsFOSS$ tr '[:lower:]' '[:upper:]' < text\nTHIS TEXT SHOULD BE WRITTEN\
    \ IN ALL\nUPPERCASE LETTERS!\n\nCE TEXT DOIT être AFFICHÉ UNIQUEMENT\nEN LETRES\
    \ MAJUSCLES!\n\nUnfortunately this doesn't work better. A solution would be to\
    \ explicitly add the mapping for the required characters:\n\nyesik.it:~/ItsFOSS$\
    \ tr 'é[a-z]' 'ÉÉ[A-Z]' < text\nTHIS TEXT SHOULD BE WRITTEN IN ALL\nUPPERCASE\
    \ LETTERS!\n\nCE TEXT DOIT ÊTRE AFFICHÉ UNIQUEMENT\nEN LETRES MAJUSCLES!\n\nThis\
    \ time, it works, but this is tedious. Especially if you don't know in advance\
    \ the set of letters that will be present in the text file. Surprisingly, the\
    \ Bash is much better suited than the tr command to change the character case:\n\
    \n```\nyesik.it:~/ItsFOSS$ while read; do\n    echo ${REPLY^^}\n  done < text\n\
    \nTHIS TEXT SHOULD BE WRITTEN IN ALL\nUPPERCASE LETTERS!\n\nCE TEXT DOIT ÊTRE\
    \ AFFICHÉ UNIQUEMENT\nEN LETRES MAJUSCLES!\n```\n\nIn that code, the while loop\
    \ simply read the input file line by line. The Bash read command by default store\
    \ the value into the REPLY variable. And I just have to echo that variable, by\
    \ using the special ${var^^} notation that will expand the content of a variable\
    \ but letters converted to uppercase.\n\nAs an exercise, I you experiment with\
    \ the ${var,,} parameter expansion which works the same, but converting to lowercase\
    \ rather than uppercase.\n\n# Challenge 14: The Back in Time Function\n\n## What\
    \ I tried to achieve?\n\nThis time, I want a shell function to display the date\
    \ and time it two hours ago. The function output must follow the YYYY-MM-DD hh:mm\
    \ format.\n\nI came to a solution using simple shell arithmetics:\n\n```\nminus-two-hours()\
    \ {\n  date -d \"$1\" +%F %H:%M\" | \\\n  IFS=\":\" read -a COMP\n  echo \"${COMP[0]}\
    \ $((${10#${COMP[1]}-2)):${COMP[2]}\"\n}\n```\n\nAs you noticed, the function\
    \ takes a date as an argument, parse it, and write back that date minus two hours.\
    \ Unfortunately, the result is far from satisfying as the expected format is not\
    \ always respected and I even have negative hours sometimes:\n\n```\nyesik.it:~/ItsFOSS$\
    \ minus-two-hours now\n2016-11-22 20:55\nyesik.it:~/ItsFOSS$ minus-two-hours \"\
    2016/11/21 05:27:18\"\n2016-11-21 3:27\nyesik.it:~/ItsFOSS$ minus-two-hours \"\
    2016/11/21 01:10:42\"\n2016-11-21 -1:10\n```\n\nCould you help me finding a solution\
    \ to obtain the desired result?\n\n# The solution\n\nWhat was the problem arithmetic\
    \ is much more complicated than one might expect. I strongly discourage you from\
    \ taking the path I used in my initial attempt: never do date and time calculations\
    \ by yourself. If you really need an argument to convince you, think for example\
    \ about issues with daylight saving time.\n\nThat being said, which options do\
    \ we still have? Any decent programming language should have some facilities to\
    \ deal with time specific issues. Here we are using the Bash, and we have to rely\
    \ on the date tool for that purpose.\n\n# How to fix that?\n\nConverting date\
    \ to quantities\n\nWhen faced with similar problems, the typical solution will\
    \ be to convert the (human readable) date and time to some numeric quantity.\n\
    \nUsually, we convert dates to a number of seconds (or milliseconds) since some\
    \ reference time. Having that numeric quantity, we can now use classic arithmetics\
    \ to add or subtract hours. Finally, we convert it back to date format.\n\nIn\
    \ practice, on Unix, the reference time is 1970-01-01 00:00:00 UTC. So we convert\
    \ the date to seconds, subtract the number of seconds, and then convert back to\
    \ date format.\n\n```bash\nminus-two-hours() {\n  local seconds=$(date -d \"$1\"\
    \ +%s)\n  local new_seconds=$((seconds - 7200))\n  date -d \"@$new_seconds\" +\"\
    %F %H:%M\"\n}\n```\n\nWait, the solution above is for GNU date. On macOS (BSD\
    \ date), you need to use a different syntax:\n\n```bash\nminus-two-hours \"2016/11/21\
    \ 05:27:18\"\n2016-11-21 3:27\n```\n\n# Challenge 15: My Bash don't know to count\n\
    \n## What I tried to achieve?\n\nI just want to add the first and last integer\
    \ stored in some file.\n\n```\nyesik.it:001$ cat sample.data\n1 2 3\nyesik.it:002$\
    \ cut -d' ' -f1,3 sample.data | read X Z\nyesik.it:003$ echo $X\n1\nyesik.it:004$\
    \ echo $((X+Z))\n0\n```\n\nThe result displayed by my shell is 0 (zero). Come\
    \ on: 1+3 is 4, not 0. Is it broken?\n\n## The solution\n\nKudos to Riccardo Bernard\
    \ for a great explanation of the \"problem\": line 2 is executed by starting subprocesses.\
    \ Therefore, read is not run in the shell, but in a subshell and sets variables\
    \ in subshell. When line 3 is executed, we are back in the parent shell—where\
    \ variables were never modified. Notice this is different in zsh.\n\nTo fix this,\
    \ you can use process substitution or a here string:\n\n```bash\nread X Z < <(cut\
    \ -d' ' -f1,3 sample.data)\necho $((X+Z))\n4\n```\n\nor\n\n```bash\nread X Z <<<\
    \ \"$(cut -d' ' -f1,3 sample.data)\"\necho $((X+Z))\n4\n```\n\nFinally worth mentioning\
    \ the Bash in necessary the best solution for that kind of problem. A simple AwK\
    \ program may do the work much better—especially since the implied loop allows\
    \ you to handle with exactly the same program file containing one row and a file\
    \ containing thousands of them:\n\n```bash\nawk '{ print $1+$3 }' sample.data\n\
    ```\n"
  mdcn: "\n\n# 挑战 13：将文本转换为大写\n\n## 我尝试实现什么？\n\n我有一个文本文件，里面包含了两次相同的句子，一次用英语写，另一次用法语写：\n\
    \n```\nyesik.it:~/ItsFOSS$ cat text\nThis text should be written in all\nercase\
    \ letters!\n\nCe text doit être affiché uniquement\nen lettres majuscules!\n```\n\
    \n我需要全大写地显示该文件的内容。你有什么想法可以完成这个任务吗？我的意思是在不需要重新输入所有文本的情况下……\n\n## 解决方案\n\n执行字符替换的标准工具是\
