    \n# Publisher's Foreword\n\nBash Out is our first attempt at bringing out unique\
    \ and helpful material in book format. It started as a mere post on our Facebook\
    \ page. With over 250,000 members, we feel one of the most prominent voices in\
    \ the world. We plan to add more problems in future.\n\nI hope you enjoy the challenges.\n\
    \nAbhishek Prakash\nCo-Founder, It's FOSS\n\n# How to use this Bash Challenge\
    \ book\n\nSince you are taking this challenge, we presume that you are aware of\
    \ the basic fundamentals. The challenges are divided into three levels:\n\n- level\
    \ 1 challenges covers tricks accessible to all Bash scripters;\n- level 2 challenges\
    \ requires some knowledge of a specific command or shell feature;\n- level 3 challenges\
    \ are more tricky and may require more advanced concepts or more subtle solutions.\n\
    \nThat being said, the division is rather arbitrary, so don't be afraid to try\
    \ the challenges in the order you want. The only real prerequisites here are some\
    \ Bash syntax knowledge and most important, the desire to learn while having fun.\n\
    \n# Before you go on bashing\n\nA few details you should know. To create this\
    \ challenge, I used:\n\n- - GNU Bash, version 4.4.5 (x86_64-pc-linux-gnu)\n- -\
    \ Debian 8.4.7-1 (amd64)\n- - All commands are those shipped with a standard Debian\
    \ distribution\n- - No command was aliased\n\nThe primary aim of this book is\
    \ not to teach Bash scripting. We aim to provide you with tricky questions that\
    \ will force you to go deeper with your knowledge. You won't find these things\
    \ in text books.\n\nWhile taking the challenges, you should refer to man pages\
    \ of the commands or Google for your usage. There is no restriction on that.\n\
    \nOne important thing here, we provide one solution to each exercise. But there\
    \ can be in fact more than one way to solve the same problem. So if you do not\
    \ find your solution in the book, feel free to discuss it on our Facebook page\
    \ or by sending us an email.\n\nEnough talk! Come on, Bash It Out!\n"
