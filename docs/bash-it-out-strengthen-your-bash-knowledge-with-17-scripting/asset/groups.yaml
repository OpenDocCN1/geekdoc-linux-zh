  - '[PAGE 25]


    # My solution


    For this challenge I will not claim to have "the" solution. Maybe you will be
    able to achieve a better score than myself? In that case, you really deserve congratulations!


    Anyway...

    The first and most obvious optimization will be to replace the two commands by
    only one:


    ```

    cp report-summer-2016.pdf report-fall-2015.pdf archives/

    [57 characters]

    ```


    Then we can use *glob patterns* to shorten each filename. Since there is only
    one "fall", report, for this one is easy, but we must take extra cares for the
    summer report since I''m only interested in the 206 version:


    ```

    cp report-s*-2016.pdf report-fall*.pdf archives/

    [49 characters]

    ```


    As a matter of fact, given the other filenames structure, I can go even further
    into that way:


    ```

    cp *6* *fa* archives/

    [22 characters]

    ```


    By the way we can do the same for the destination directory—which is the only
    subdirectory

    here:


    ```

    cp *6* *fa* */

    [15 characters]

    ```


    In some cases, using brace expansion can further reduce the number of required
    keystrokes.

    But in that case, we remain stuck at 15 characters:


    ```

    cp *{6,fa} */

    cp *{6,fa*,}

    ```


    Unless *you* found something "better"?'
- md: "\n# Challenge 6: The dangerous file to remove\n\nWhat I tried to achieve?\n\
    \nWhen I was at school (in the VT10 era/) it wasn't uncommon for the poor soul\
    \ that has left his terminal without closing the session to find strangely named\
    \ files in his home directory when he was back.\n\nThat was \"cruel jokes\" made\
    \ by other students passing by. For this challenge, let's pretend you just found\
    \ a file named -rf * in your home directory:\n\n```\nyesik:~/ItsFOSS$ ls -1\n\
    dont remove!\n-rf *\nyesik:~/ItsFOSS$ \n```\n\n```\nyesik:~/ItsFOSS$ ls -1\ndont\
    \ remove!\n-rf *\n```\n\nSo, how to remove the unwanted file from the command\
    \ line, without removing any other file? Obviously rm -rf * is not the solution...\n\
    \n> BEWARE:\n> before trying to answer this challenge, think first why this was\
    \ a \"cruel joke\". What are the risks with the name of this file? IF YOU CAN'T\
    \ ANSWER THAT QUESTION FIRST DON'T TRY THIS AS HOME !\n\n# The solution\n\nMaybe\
    \ that was your first reflex, but no, using quotes or backslash is **not** the\
    \ solution. None of this syntax will work:\n\n```\nyesik:~/ItsFOSS$ rm -rf '*'\n\
    rm: invalid option --'\nTry 'rm --help' for more information.\nyesik:~/ItsFOSS$\
    \ rm \\rf\\ '*'\nrm: invalid option --'\nTry 'rm --help' for more information.\n\
    ```\n\nWhy are those not valid solutions? Because they would protect special characters\
    \ from shell's interpretation. But here the problem is not with the shell. But\
    \ with the rm command itself.\n\n# How to solve that?\n\nHopefully, rm like several\
    \ other standard command supports the -- special option to indicate the start\
    \ of filename list. After -- the command will no longer try to interpret strings\
    \ by a dash as an option. Which is exactly what we need:\n\n```\nyesik:~/ItsFOSS$\
    \ rm '-rf '*'\n```\n\nNotice however quotes (or backslashes) are still necessary\
    \ to protect the space and the star from shell interpretation. If you want to\
    \ experiment more with that, I encourage you to use the ls and touch commands,\
    \ both of them supports the -- option. And they are way less dangerous to use\
    \ than the rm command!\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_28_0.png)\n\
    \n# Challenge 7: The file that didn't want to go away\n\nWhat I tried to achieve?\n\
    \nI was asked to remove the last file of the list displayed below:\n\n```\nyesik:~/ItsFOSS$\
    \ ls -l\ntotal 0\n-rw-r--r-- 1 yesik yesik 0 Nov 23 00:41 a\n-rw-r--r-- 1 yesik\
    \ yesik 0 Nov 23 00:41 b\n-rw-r--r-- 1 yesik yesik 0 Nov 23 00:41 c\n-rw-r--r--\
    \ 1 yesik yesik 0 Nov 23 00:41 d/e\nyesik:~/ItsFOSS$ rm e\nrm: cannot remove 'e':\
    \ No such file or directory\n```\n\n```\nyesik:~/ItsFOSS$ ls -l\ntotal 0\n-rw-r--r--\
    \ 1 yesik yesik 0 Nov 22 22:58 a\n-rw-r--r-- 1 yesik yesik 0 Nov 22 22:58 b\n\
    -rw-r--r-- 1 yesik yesik 0 Nov 22 22:58 c\n-rw-r--r-- 1 yesik yesik 0 Nov 22 22:58\
    \ e\nyesik:~/ItsFOSS$ rm e\nrm: cannot remove 'e': No such file or directory\n\
    ```\n\nBut as you can see, a simple rm command didn't work.\n\nWhy? How to remove\
    \ that file?\n\n# The solution\n\nWhat was the problem?\n\nYou know a slash cannot\
    \ be part of a filename. And you may have somehow believed the file e was in some\
    \ subdirectory d.\n\nBut that's wrong.\n\nFirst, there is no reason for the ls\
    \ -1 command to display the content of a subdirectory using that format, And then,\
    \ we can see, from the rest of the ls output, there is no subdirectory d here.\n\
    \nThis problem is a typical homoglyphic confusion. You believed you've seen a\
    \ slash. But in fact it was a different character, but displayed with an unfortunately\
    \ confusing glyph. In that particular case, it was the U+2215 DIVISION SLASH Unicode\
    \ character.\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_30_0.png)\n\nOn my UTF-8\
    \ terminal the U+2215 DIVISION SLASH Unicode character is encoded using the three\
    \ bytes sequence 0xE2 0x88 0x95. You can check that using the hexdump command\
    \ (with a little bit of shell scripting for a more readable output):\n\n| yesik:~/ItsFOSS$\
    \ for f in *; do echo -n $f | hexdump -C; done | |\n| :--- | :--- |\n| 00000000\
    \ 61 | a |\n| 00000001 | |\n| 00000000 62 | b |\n| 00000001 | |\n| 00000000 63\
    \ | c |\n| 00000001 | |\n| 00000000 64 e2 88 95 | d...e |\n| 00000005 | |\n\n\
    If you have iconv installed on your system, you can even find the corresponding\
    \ Unicode point by converting the data to utf-16:\n\n| yesik:~/ItsFOSS$ for f\
    \ in *; do echo -n $f | iconv -t utf16 hexdump -C; done | |\n| :--- | :--- |\n\
    | 00000000 00 61 | a |\n| 00000002 | |\n| 00000000 00 62 | b |\n| 00000002 | |\n\
    | 00000000 00 63 | c |\n| 00000002 | |\n| 00000000 00 64 22 15 | d..e |\n| 00000006\
    \ | |\n\n# How to achieve my goal?\n\nKnowing that, it is now easy to remove the\
    \ file... if you know the '' syntax:\n\n```\nyesik:~/ItsFOSS$ rm '\\xe2\\x88\\\
    x95' # using the UTF-8 encoding\nor yesik:~/ItsFOSS$ rm '\\u2215' # using unicode\
    \ point\n```\n\nBy the way, this would have worked:\n\n```\nyesik:~/ItsFOSS$ rm\
    \ d*\n```\n\nBut you will agree, by doing this, we would have missed an interesting\
    \ discussion!\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_32_0.png)\n\n# Level\
    \ 2 Bash challenge\n\n# Challenge 8: Hex to ASCII conversion\n\nWhat I tried to\
    \ achieve?\n\nI have a file containing \"secret\" message:\n\n```\nyesik:~/ItsFOSS$\
    \ cat SECRET\n43 4F 4E 52 52 51 44 4C 4E 53 20 20 48 41 56 49 4E 20 53 43 45 45\
    \ 20 50 48 53 53 20 48 41 4C 4C 45 45 47\nyesik:~/ItsFOSS$ decode < SECRET\nCONGRULATIONS\
    \ HAVING SOLVED THIS CHALLENGE\n```\n\nThe secret message is simply \"ASCII encoded\"\
    , so it is not difficult to find the original text by consulting an ASCII table:\n\
    \nFor example, the code 43 corresponds to the letter C (row 4, column 3). 4F is\
    \ the letter O. And so on.\n\nBut I wouldn't do that by hand when a command can\
    \ do it for me. So, could you write the Bash function I used?\n\n- If needed,\
    \ see http://tldp.org/HOWTO/Bash-Prog-Intro-HOWTO-8.html for an introduction to\
    \ Bash function syntax.\n\nAnd remember, this is a Bash challenge. Your solution\
    \ must not use any other programming language (no Perl, C, Python, ...)\n\nExtra\
    \ challenge:\ncould write a decode function using only Bash internal commands\
    \ & shell expansion (i.e.: strace -e trace=process ... will show no new process\
    \ creation)\n\n# The solution\n\nHow to reproduce\n\nHere is the raw code we used\
    \ to produce this challenge. If you run that in a terminal, you will be able to\
    \ reproduce exactly the same result as displayed in the challenge illustration\
    \ (assuming you are using the same software version as:)\n\n```\nrm -rf ItsFOSS\n\
    mkdir -p ItsFOSS\ncd ItsFOSS\nM=\"CONGRATULATIONS FOR HAVING SOLVED THIS CHALLENGE\"\
    \n(echo -n \"$M\" | hexdump -v -e '/1 \"%02X \" '); echo) > SECRET\ndecode() {\n\
    \  while read -d '' c; do\n    echo -en '\\x$c'\n  done\n  echo\n}\nclear\ncat\
    \ SECRET\ndecode < SECRET\n```\n\nWhat was the problem here?\n\nIn the SECRET\
    \ file, each character of the message is represented by its ASCII code expressed\
    \ in hexadecimal. 41 → A 42 → B ... 49 → I 4A → J ... 4F → O 50 → P ... 5A → Z\n\
    had to find a way to read the data and to perform the ASCII → char conversion.\n\
    \n```\ndecode() {\n  while read -d' ' c ; do\n    echo -en '\\x$c'\n  done\n \
    \ echo\n}\n```\n\nIn that solution, the decode function will read the message\
    \ hexadecimal number by hexadecimal number, and will use the echo internal command\
    \ to output the corresponding character. The trick here is the -e option allowing\
    \ the echo command to understand \\NN sequences as character codes.\n\nYou can\
    \ try the -e option easily:\n\n```\necho -e '\\x48\\x45\\x4C\\x4F'\n```\n\n# Alternate\
    \ solutions\n\nOther solutions are available. The most obvious would be to use\
    \ the xxd tool which has a dedicated reverse (-r) mode:\n\n```\ndecode() { xxd\
    \ -r -p; echo; }\n```\n\nIn addition, I cannot resist in showing you a fragile\
    \ but somewhat clever solution:\n\n```bash\ndecode() {\n  S='$(echo </dev/stdin)\n\
    \  echo -e ${S// /\\x}\n}\n```\n"
  mdcn: "\n\n# 挑战 6：要删除的危险文件\n\n我想实现的是什么？\n\n当我上学校时（在 VT10 时代），对于那些离开终端时没有关闭会话的倒霉蛋来说，当他们回来时发现自己的主目录下出现了一些命名奇特的文件，这并不常见见。\n\
    \n那是由其他路过的同学们开的“恶作剧”。对于这个挑战，让我们假设你刚刚在主目录下发现了一个名为 `-rf *` 的文件：\n\n```\nyesik:~/ItsFOSS$\
    \ ls -1\ndont remove!\n-rf *\nyesik:~/ItsFOSS$ \n```\n\n```\nyesik:~/ItsFOSS$\
    \ ls -1\ndont remove!\n-rf *\n```\n\n那么，如何从命令行删除这个不需要的文件，而不删除任何其他文件呢？显然，`rm -rf\
    \ *` 并不是解决方案……\n\n> 注意：\n> 在尝试回答这个挑战之前，请先思考为什么这这是一场“恶作剧”。这个文件的名称包含哪些风险？如果你先无法回答这个问题，千万不要在主目录下尝试这种操作！\n\
    \n# 解决方案\n\n这可能是你的第一个反应，但不，使用引号或反斜杠**并不是**解决方案。这些语法都是无效的：\n\n```\nyesik:~/ItsFOSS$\
    \ rm -rf '*'\nrm: invalid option --''\nTry 'rm --help' for more information.\n\
    yesik:~/ItsFOSS$ rm \\rf\\ '*'\nrm: invalid option --'\nTry 'rm --help' for more\
    \ information.\n```\n\n为什么这些不是有效的解决方案呢？因为它们会保护特殊字符免受 shell 的解释。但这里的问题不在于 shell，而在于\
    \ `rm` 命令本身。\n\n# 如何解决？\n\n希望 `rm` 像其他几个标准命令一样支持 `--` 特殊选项，用于指示文件名列表的开始。在 `--`\
    \ 之后，命令将不再尝试将以杠开头的字符串解释为选项。这正是我们需要的：\n\n```\nyesik:~/ItsFOSS$ rm -- '-rf '*'\n\
    ```\n\n注意，引号（或反斜杠）仍然对于保护空格和星号免受 shell 解释是必要的。如果你想进行更多实验，我鼓励你使用 `ls` 和 `touch`\
    \ 命令，它们都支持 `--` 选项。而且它们使用起来比 `rm` 命令安全得多！\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_28_0.png)\n\
    \n# 挑战 7：不愿离开的文件\n\n我想实现的是什么？\n\n我被要求删除下面列表中的最后一个文件：\n\n```\nyesik:~/ItsFOSS$\
    \ ls -l\ntotal 0\n-rw-r--r-- 1 yesik yesik 0 Nov 23 00:41 a\n-rw-r--r-- 1 yesik\
    \ yesik 0 Nov 23 00:41 b\n-rw-r--r-- 1 yesik yesik 0 Nov 23 00:41 c\n-rw-r--r--\
    \ 1 yesik yesik 0 Nov 23 00:41 d/e\nyesik:~/ItsFOSS$ rm e\nrm: cannot remove 'e':\
    \ No such file or directory\n```\n\n```\nyesik:~/ItsFOSS$ ls -l\ntotal 0\n-rw-r--r--\
    \ 1 yesik yesik 0 Nov 22 22:58 a\n-rw-r--r-- 1 yesik yesik 0 Nov 22 22:58 b\n\
    -rw-r--r-- 1 yesik yesik 0 Nov 22 22:58 c\n-rw-r--r-- 1 yesik yesik 0 Nov 22 22:58\
    \ e\nyesik:~/ItsFOSS$ rm e\nrm: cannot remove 'e': No such file or directory\n\
    ```\n\n但正如你所看到的，简单的 `rm` 命令不起作用。\n\n为什么？如何删除那个文件？\n\n# 解决方案\n\n问题出在哪里？\n\n你知道斜杠\
    \ `/` 不能作为文件名的一部分。你可能以某种方式认为文件 `e` 在某个子目录 `d` 中。\n\n但那是错误的。\n\n首先，`ls -1` 命令没有理由以这种格式显示子目录的内容。而且，从\
    \ `ls` 输出的其余部分我们可以看到，这里并没有名为 `d` 的子目录。\n\n这是一个典型的形似字混淆（homoglyphic confusion）。你认为你看到了一个斜杠。但实际上它是另一个字符，只是显示了一个不幸令人困惑的字形。在特定情况下，它是\
    \ U+2215 DIVISION SLASH Unicode 字符。\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_30_0.png)\n\
    \n在我的 UTF-8 终端上，U+2215 DIVISION SLASH Unicode 字符使用三字节序列 `0xE2 0x88 0x95` 编码。你可以使用\
    \ `hexdump` 命令进行检查（配合一点 shell 脚本以获得更可读的输出）：\n\n| yesik:~/ItsFOSS$ for f in *;\
    \ do echo -n $f | hexdump -C; done | |\n| :--- | :--- |\n| 00000000 61 | a |\n\
    | 00000001 | | |\n| 00000000 62 | b |\n| 00000001 | | |\n| 00000000 63 | c |\n\
    | 00000001 | | |\n| 00000000 64 e2 88 95 | d...e |\n| 00000005 | | |\n\n如果你在系统中安装了\
    \ `iconv`，你甚至可以通过将数据转换为 utf-16 来找到对应的 Unicode 节点：\n\n| yesik:~/ItsFOSS$ for f\
    \ in *; do echo -n $f | iconv -t utf16 hexdump -C; done | |\n| :--- | :--- |\n\
    | 00000000 00 61 | a |\n| 00000002 | | |\n| 00000000 00 62 | b |\n| 00000002 |\
    \ | |\n| 00000000 00 63 | c |\n| 00000002 | | |\n| 00000000 00 64 e2 88 95 | d...e\
    \ |\n\n"
