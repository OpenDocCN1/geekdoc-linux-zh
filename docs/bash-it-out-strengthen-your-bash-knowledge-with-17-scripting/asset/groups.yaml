    \ MAJUSCLES!\n```\n\n在代码代码中，`while` 循环只是逐行读取输入文件。Bash `read` 命令默认将值存储在 `REPLY`\
    \ 变量中。我只需要使用特殊的 `${var^^}` 符号来输出该变量，它会展开变量的内容并将字母转换为大写。\n\n作为一个练习，你可以尝试一下 `${var,,}`\
    \ 参数扩展，它的工作原理相同，但是转换为小写而不是大写。\n\n# 挑战 14：两小时前的函数\n\n## 我尝试实现什么？\n\n这次，我想让一个 shell\
    \ 函数显示两个小时前的日期和时间。函数的输出必须遵循 `YYYY-MM-DD hh:mm` 格式。\n\n我使用简单的 shell 算术得到了解决方案：\n\
    \n```bash\nminus-two-hours() {\n  date -d \"$1\" +%F %H:%M\" | \\\n  IFS=\":\"\
    \ read -a COMP\n  echo \"${COMP[0]} $((${10#${COMP[1]}-2)):${COMP[2]}\"\n}\n```\n\
    \n正如你所看到的，该函数接受一个日期作为参数，解析它，并写回去两小时后的日期。遗憾的是，结果远不如意，因为并不总是遵循预期格式，我有时甚至得到负的小时：\n\
    \n```\nyesik.it:~/ItsFOSS$ minus-two-hours now\n2016-11-22 20:55\nyesik.it:~/ItsFOSS$\
    \ minus-two-hours \"2016/11/21 05:27:18\"\n2016-11-21 3:27\nyesik.it:~/ItsFOSS$\
    \ minus-two-hours \"2016/11/21 01:10:42\"\n2016-11-21 -1:10\n```\n\n能帮我找到一个获得预期结果的解决方案吗？\n\
    \n# 解决方案\n\n算术问题比人们想象的要复杂得多。我强烈建议不要采取我最初尝试时使用的路径：永远不要自己进行日期时间计算。如果你真的需要一个理由来来说服你，可以考虑一下夏令时的问题。\n\
    \n尽管如此，我们还有哪些选择？任何优良的编程语言都应该具有处理特定时间问题的功能。在这里我们使用的是 Bash，我们必须依靠 `date` 工具来实现这一目的。\n\
    \n# 如何修复？\n\n将日期转换为数量\n\n当遇到类似的问题时，典型的解决方案是将（人类可读的）日期和时间转换为某些数值数量。\n\n通常，我们将日期转换为自某个参考时间以来的秒数（或毫秒）。有了这个数值，我们现在可以使用经典的算术来加或减小时。最后，我们将其转换回日期格式。\n\
    \n在实践中，Unix 上的参考时间是 1970-01-01 00:00:00 UTC。因此我们将日期转换为秒，减去秒数，然后转换回日期格式。\n\n```bash\n\
    minus-two-hours() {\n  local seconds=$(date -d \"$1\" +%s)\n  local new_seconds=$((seconds\
    \ - 7200))\n  date -d \"@$new_seconds\" +\"%F %H:%M\"\n}\n```\n\n等等，上面的解决方案适用于\
    \ GNU date。在 macOS (BSD date) 上，你需要不同的语法：\n\n```bash\nminus-two-hours \"2016/11/21\
    \ 05:27:18\"\n2016-11-21 3:27\n```\n\n# 挑战 15：我的 Bash 不会计数\n\n## 我尝试实现什么？\n\n\
    我只想相加文件中存储的和最后一个整数。\n\n```\nyesik.it:001$ cat sample.data\n1 2 3\nyesik.it:002$\
    \ cut -d' ' -f1,3 sample.data | read X Z\nyesik.it:003$ echo $X\n1\nyesik.it:004$\
    \ echo $((X+Z))\n0\n```\n\n我的 shell 显示的结果是 0（零）。拜托，1+3 是 4，不是 0。坏了吗？\n\n## 解决方案\n\
    \n感谢 Riccardo Bernard 对这个“问题”的精彩解释：第 2 行通过启动子进程执行。因此，`read` 不是在 shell 中运行，而是在子壳中运行并设置子壳变量。当执行第\
    \ 3 行时，我们回到了父 shell——这里的变量从未被修改。注意这在 zsh 中是不同的。\n\n要修复这个问题，可以使用进程替换或此处字符串（here\
    \ string）：\n\n```bash\nread X Z < <(cut -d' ' -f1,3 sample.data)\necho $((X+Z))\n\
    4\n```\n\n或者\n\n```bash\nread X Z <<< \"$(cut -d' ' -f1,3 sample.data)\"\necho\
    \ $((X+Z))\n4\n```\n\n最后值得提到 Bash并不是这类问题的最佳解决方案。一个简单的 AwK 程序可能会做得更好——特别是由于隐含循环允许你用完全相同的程序处理包含一行的文件和包含数千行的文件：\n\
    \n```bash\nawk '{ print $1+$3 }' sample.data\n```\n\n"
