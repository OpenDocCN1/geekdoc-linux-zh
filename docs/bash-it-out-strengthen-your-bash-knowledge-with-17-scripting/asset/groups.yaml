  raw:
  - "[PAGE 26]\n\n# Challenge 6: The dangerous file to remove\n\nWhat I tried to achieve?\n\
    \nWhen I was at school (in the VT10 era/) it wasn't uncommon for the poor soul\
    \ that has left his terminal without closing the session to find strangely named\
    \ files in his home directory when he was back.\n\nThat was \"cruel jokes\" made\
    \ by other students passing by. For this challenge, let's pretend you just found\
    \ a file named -rf * in your home directory:\n\n```\nyesik:~/ItsFOSS$ ls -1\n\
    dont remove!\n-rf *\nyesik:~/ItsFOSS$ \n```\n\nyesik:~/ItsFOSS$ ls -1\ndont remove!\n\
    -rf *\n\nSo, how to remove the unwanted file from the command line, without removing\
    \ any other file? Obviously rm -rf * is not the solution...\n\n> BEWARE:\nbefore\
    \ trying to answer this challenge, think first why this was a \"cruel joke\".\
    \ What are the risks with the name of this file? IF YOU CAN'T ANSWER THAT QUESTION\
    \ FIRST DON'T TRY THIS AS HOME !"
  - '[PAGE 27]


    # The solution


    Maybe that was your first reflex, but no, using quotes or backslash is **not**
    the solution. None of

    this syntax will work:


    ```

    yesik:~/ItsFOSS$ rm -rf ''*''

    rm: invalid option --''

    Try ''rm --help'' for more information.

    yesik:~/ItsFOSS$ rm \rf\ ''*''

    rm: invalid option --''

    Try ''rm --help'' for more information.

    ```


    Why are those not valid solutions? Because they would protect special characters
    from shell''s

    interpretation. But here the problem is not with the shell. But with the rm command
    itself.


    # How to solve that?


    Hopefully, rm like several other standard command supports the -- special option
    to indicate the

    start of filename list. After -- the command will no longer try to interpret strings
    by a

    dash as an option. Which is exactly what we need:


    ```

    yesik:~/ItsFOSS$ rm ''-rf ''*''

    ```


    Notice however quotes (or backslashes) are still necessary to protect the space
    and the

    star from shell interpretation. If you want to experiment more with that, I encourage
    you to use

    the ls and touch commands, both of them supports the -- option. And they are way
    less

    dangerous to use than the rm command!'
