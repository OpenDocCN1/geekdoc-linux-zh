    # How to achieve my goal?


    Knowing that, it is now easy to remove the file...if you know the Bash $''$string''
    syntax:


    ```

    yesik:~/ItsFOSS$ rm ''$\xe2\x88\x95e'' # using the UTF-8 encoding

    -or-

