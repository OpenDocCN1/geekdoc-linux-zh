  mdcn: "\n显而易见的结果是不公平的。事实上，你可以识别出正态分布的典型形状：\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_66_0.png)\n\
    \n# 如何修复？\n\n解决方案是考虑取模运算符可以得到公平的解决方案，但仅限于原始范围的一个子集。例如，如果原始范围是 0-15，而目标范围是 0-5，那么对于\
    \ 0-11 范围内的输入值，取模产生的输出与输入一样*公平*。问题出在 12-15 范围内的输入值。这*恰好*就是我最初图表所所示的。\n\n那么，技巧就是简单地忽略问题范围内的值，如果随机生成器产生了这样的值，则取另一个值。这导致了：\n\
    \n```bash\n# 这确实可以解决挑战\ngetRandomNumber() {\n  N=$RANDOM\n\n  while ((N>=32768/6*6))\n\
    \  do\n    # N 处于问题范围内。取另一个值：\n    N=$RANDOM\n  done\n\n  echo $((N%6+1));\n}\n\
    ```\n\n结束该挑战的三个备注：\n\n- 32768/6*6 不同于 32768*6/6。你能知道为什么吗？\n- 使用了这种解决方案，有极小的概率导致\
