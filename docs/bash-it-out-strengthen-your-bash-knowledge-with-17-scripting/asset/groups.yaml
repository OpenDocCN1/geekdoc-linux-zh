    A simple solution would be to completely discard the cut command, and read the
    data using a simple redirection:


    ```

    yesik:002$ read X Y Z < sample.data

    ```


    If you really want to read the output of some external command though, you may
    use a process redirection instead:


    ```

    yesik:002$ read X Z <<($cut -d'' '' -f1,3 sample.data)

    ```


    ...or a here string:


    ```

    yesik:002$ read X Z <<<($cut -d'' '' -f1,3 sample.data)

    ```


    Finally worth mentioning the Bash in necessary the best solution for that kind
    of problem. A simple AwK program may do the work much better—especially since
    the implied loop allows you to handle with exactly the same program file containing
    one row and a file containing thousands of them:


    ```

    yesik:002$ awk ''{ print $1+$3 }'' sample.data

