    # # Acknowledgement


    This work has started by a humble post in the Linux Users Group on Facebook. Needless
    to say, I had no idea at the time there be so many Bash Challenges that we could
    publish an entire book!


    Certainly, I couldn''t have gone so far without the help of Abhishek Prakash who
    invited me to publish these challenges not only on It''s FOSS Facebook page but
    also on the It''s FOSS website. Abhishek is also at the origin of the idea of
    compiling all those challenges—including some unreleased material—to make the
    book you are reading now.


    But there is a whole world between publishing a regular column on a blog and making
    a book. Illustration, pagination, and overall project management were some of
    the tasks Rohini Rachita particularly shined at.


    Last but not least, I must thank all the people on Internet that enjoyed those
    challenges. This work was made for you. My goal was to help you in discovering
    some subtleties or pitfalls of that great tool the Bash is. And given your comments
    and reactions on Internet, I know you liked that work.I I sincerely hope you will
    have even more fun today by reading this enhanced version of the Bash Challenges!


    Sylvain Leroux

    June 2017

    Yes I Know It'
