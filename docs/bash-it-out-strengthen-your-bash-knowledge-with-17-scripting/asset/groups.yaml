    If you have iconv installed on your system, you can even find the corresponding
    Unicode code point by converting the data to utf-16:


    | yesik:~/ItsFOSS$ for f in *; do echo -n $f | iconv -t utf16be | |

    | hexdump -C; done |

    | 00000000 00 61 | |a|

    | 00000002 | |

    | 00000000 00 62 | |b|

    | 00000002 | |

    | 00000000 00 63 | |c|

    | 00000002 | |

