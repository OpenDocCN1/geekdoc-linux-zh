  md: '# How to use this Bash Challenge book?


    Since you are taking the Bash challenge, we presume that you are aware of the
    basic fundamentals of the Bash scripting. You don''t have to be a command line
    ninja to take up these challenges but you must know a thing or two about Bash
    and Linux/Unix commands.


    The problem given here doesn''t require you to write a Bash script. It rather
    presents you with a scenario and asks you why the output is not the expected one
    or why the script is behaving while it shouldn''t.


    The Bash scripting challenges in this book are divided into 3 levels of difficulties.
    So, if you are a beginner, you''ll learn a lot with higher level challenges. And
    if you are a pro, you can jump to expert level challenges straightaway though
    I suggest you take all the challenges to test your knowledge.


    The primary aim of this book is not to teach Bash scripting. We aim to provide
    you with tricky question that will force you to go deeper with your Bash knowledge.
    You won''t find these things in text books.


    While taking the challenges, you should refer to man pages of the commands or
    Google for your usage. There is no restriction on that.


    One important thing here, we provide one solution to each Bash exercise here.
    But there can be in fact more than one ways to solve the same problem. So if you
    don''t find your solution in the book, feel free to discuss it on our Facebook
    page or by sending us an email.


    Enough talk! Come on, Bash It Out!'
  merge: -1
