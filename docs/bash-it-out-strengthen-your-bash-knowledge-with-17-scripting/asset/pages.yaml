  md: "# Challenge 1: Counting files in the current directory\n\nWhat I tried to achieve?\n\
    \nI wanted to count the number of files in the current directory. For that, I\
    \ used the ls and wc commands:\n\n```\nyesik:~/ItsFOSS$ ls -l\ntotal 0\n-rw-r--r--\
    \ 1 yesik yesik Nov 22 22:45 file1\n-rw-r--r-- 1 yesik yesik Nov 22 22:45 file2\n\
    -rw-r--r-- 1 yesik yesik Nov 22 22:45 file3\nok\nyesik:~/ItsFOSS$ ls | wc -1\n\
    4\n```\n\nI was expecting a result of 3 since I visibly have three files in that\
    \ directory. But for some unknown reason, was not the result I've obtained. Could\
    \ you explain me why? And most important, how to achieve my goal?\n\n```\nyesik:-/ItsFOSS$\
    \ ls -l\ntotal 0\n-rw-r--r-- 1 yesik yesik Nov 23 00:29 file1\n-rw-r--r-- 1 yesik\
    \ yesik Nov 23 00:29 file2\n-rw-r--r-- 1 yesik yesik Nov 23 00:29 file3\nok\n\
    yesik:-/ItsFOSS$ ls | wc -l\n4\nyesik:-/ItsFOSS$ \n```"
  merge: -1
  pgno: 11
- img_proc: true
  md: '# The solution


    How to reproduce?

    Here is the raw code we used to produce this challenge. If you run that in a terminal,
    you will be able to reproduce exactly the same result as displayed in the challenge
    illustration (assuming you are using the same software version as me):


    ```

    mkdir -p ItsFOSS

    cd ItsFOSS

    touch file1 file2 ''$file3\nok''

    clear

    ls -1

    ls | wc -1

    ```


    What was the problem?

    When to a pipe, the ls command write each filename on its line. Just like when
    using ls -1 from a terminal. And the wc -1 command count lines. Apparently ls
    | wc -1 should display the number of files or folder in the current directory.


    However a filename may have the newline character (often denoted \n). It is certainly
    uncommon but perfectly valid though.


    In that challenge, the ok you see on the screen capture was part of the third
    filename, which in fact was file3\nok. Not file3 as one may believe it at first
    sight.


    This is a case you might need to take into account in your scripts or shell commands
    to not break if a filename contains that character. Either by accident, or as
    the result of some malicious activity.


    How to fix that?

    Remove non-printable characters from the ls output


    ```

    ls -q | wc -1

    ```


    Modern versions of ls have the -q option that will replace non-printable characters
    by a question mark (?) The -q option is more portable than the -b option you sometimes
    see used for purpose. In both cases, we are absolutely certain \n embedded in
    filename will not interfere with our count. According to POSIX:'
  merge: -1
  pgno: 12
- img_proc: true
  md: "-q Force each instance of non-printable filename characters and <tab>s to be\
    \ written as the question-mark ('?') ) character. Implementations may provide\
    \ this option by default if the output is to a terminal device.\n\nMy Debian Squeeze\
    \ test system, -q was not the default. That's why the ok word appears on its own\
    \ line. On Debian Stretch, -q is enabled by default and the output is default\
    \ — **only when the output is a console** — and it will display the last filename\
    \ as file3?\n\nIgnore the file's name\n\nI want to count the number of *files*.\
    \ Not the number of filenames. So, as an alternate solution, I could just ignore\
    \ the filename and issue a *token* for each encountered file. counting the number\
    \ of tokens will give the same result as counting the number of files. And as\
    \ we have the control of the token, we cannot be fooled. We can use the find command\
    \ for that purpose:\n\n```\nfind . -minddepth 1 -maxdepth 1 -printf '\\n' | wc\
    \ -l\n  -or-\nfind . !-path . -maxdepth 1 -printf '\\n' | wc -l\n```\n\nHere I\
    \ made the choice of using an empty line (\\n) as the token. So, those two command\
    \ will produce one empty line per entry in the current directory. Notice the actual\
    \ filename is never written to the output. So whatever characters may be embedded\
    \ in the filename, they will not interfere with following commands in the pipe.\
    \ I just have to count the number of lines to know the number of files there was.\n\
    \nPlease notice -minddepth 1 and !-path . : those are two different tricks to\
    \ remove the current directory (.) from the selection. Otherwise, your count will\
    \ be off by one."
  merge: -1
  pgno: 13
