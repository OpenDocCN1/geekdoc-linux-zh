  md: '# Challenge 16: Sending a file between two computers


    # What I tried to achieve?


    I have two computers connected on the same local network. Their respective IPv4
    addresses are 192.168.10.10 and 192.168.10.11.


    I want to send a file from 192.168.10.10 to 192.168.10.11. How can I do that,
    knowing they do not have access to any kind of file sharing service and none of
    them has remote terminal facilities like ssh or telnet enabled.


    All you may assume here you can ping them from each other and you have access
    to a terminal running Bash on each host. You should not assume root access to
    any of the hosts.


    Obviously, using a removable media like a USB pen drive would be a solution. But
    I''ve forgotten my pen drive at home. And it''s late Sunday, so all shops are
    closed. Anyway, I want a network-based solution!


    # The solution


    # What was the problem?


    The challenge here is to find a solution to open some kind of network communication
    channel between the hosts. And then copy a file from the source host to the destination
    host through that channel.


    That''s the kind of solution that will be used under the hood by a tool like scp.
    Or rsync in client/server mode. But I assumed in the challenge description those
    facilities were not available.


    So, I have to find a way to create communication by myself. The traditional tool
    for ad-hoc connections is netcat (or nc as it may be spelled in your distribution)
    There are chances netcat was installed as part of standard Linux installation.
    So let''s start using that program—unless your administrator removed it


    # Introducing netcat


    Note: if you don''t have access to two different computers on the same network,
    you can still experiment by testing from two different terminals on your computer
    and using localhost instead of both IP addresses.'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'In order to use netcat to transfer data between two hosts, you may start two
    different instances

    of the tool. One each host.


    The first instance will open a port and wait for incoming requests. It is more
    straightforward to

    op the listener on the destination host. This is what I will do:


    ```

    # On the destination host

    192.168.10.11$ netcat -l 1234

    ```


    With this command, netcat will open the port 1234 (an arbitrary number) and wait
    for an

    incoming connection (option -1 for "listen")


    On the source host, we will use netcat too, but this time to connect to the remote
    host and port

    we''ve just opened:


    ```

    # On the source host

    192.168.10.10$ echo hello | netcat 192.168.10.11 1234

    ```


    Press enter and the "hello" message will be displayed on the destination host.


    What has happened here can be summarized in the following few steps:


    +   1. The destination netcat has opened the port 1234 for incoming connections

    2. The source netcat has established the connection to the destination host

    192.168.10.11 port 1234

    3. The source netcat then started to read from its standard input and to send
    the data

    through the connection established previously

    4. The destination netcat displayed on its standard output the data received from
    the

    connection.

    5. At some point, the source netcat detected there was no more data to read and
    closed

    the connection (the exact behavior when encountering EOF is controlled by the
    -N

    option)

    6. The destination netcat detected the connection has closed and has terminated
    too.'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'Once you know that, transferring a file can be achieved using some simple redirection:


    ```

    # On the destination host

    192.168.10.11$ netcat -l 1234 > my.file

    ```


    ```

    # On the source host

    192.168.10.10$ netcat 192.168.10.11 1234 < my.file

    ```


    # Replacing the client netcat by the Bash


    Unfortunately, we can''t solve that challenge using only the Bash since it is
    not able to open a server socket (the "listener" part of the communication channel).
    But the Bash may act as a client to connect to an existing server socket. So,
    server-side, we will use exactly the same command as above:


    ```

    # On the destination host

    192.168.10.11$ netcat -1 1234

    ```


    client-side, we no longer need netcat:


    ```

    # On the source host

    192.168.10.11$ echo hello > /dev/tcp/192.168.10.11/1234

    ```


    In that case, the shell redirection to /dev/tcp/... will handle under the hood
    the connection to the remote host just like netcat did it previously.


    By the way, no need to search in /dev for the tcp device. It does not really exist.
    It is simply a magic filename the Bash handle specifically. That means you can
    only use those special filenames in redirections.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'Despite limitations, the Bash /dev/tcp/... pseudo-devices can be remarkably
    useful, for testing purposes or to diagnose network issues. To conclude on that
    topic, I can''t resist showing you some fun use case. I let up to you to do the
    necessary researches to understand the details:


    ```

    # Open a connection with a remote web server

    exec 3<> /dev/tcp/httpbin.org/80


    # send a HTTP GET request

    awk -v OS=$''\r\n'' ''{print}'' >&3 << EOT

    GET /ip HTTP/1.1

    host: httpbin.org

    connection: close


    EOT

    # (the line above EOT must be empty. i.e. not even containing spaces)


    # display the server''s reply

    cat <3-

    ```


