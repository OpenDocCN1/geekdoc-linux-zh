- img_proc: true
  md: 'Three remarks to conclude that challenge:


    +   - 32768/6*6 is not the same as 32768*6/6. Can you tell why?

    - With this solution, there is an infinitesimal chance the getRandomNumber will
    *never* return.

    - And of course, all that demonstration is based on the premise the $RANDOM pseudo-variable
    produces fair results. But does it *really*?


    ![](img/8f6bf8024f58c92982eb49d5f91a7bf7_67_0.png)'
