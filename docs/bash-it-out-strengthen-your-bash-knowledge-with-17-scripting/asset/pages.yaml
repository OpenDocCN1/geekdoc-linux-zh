  md: "# Challenge 14: The Back in Time Function\n\nWhat I tried to achieve?\n\nThis\
    \ time, I want a shell function to display the date and time it two hours ago.\
    \ The function output must follow the YYYY-MM-DD hh:mm format.\n\nI came to a\
    \ solution using simple shell arithmetics:\n\n```\nminus-two-hours() {\n  date\
    \ -d \"$1\" +%F %H:%M\" | \\\n  IFS=\":\" read -a COMP\n  echo \"${COMP[0]} $((${10#${COMP[1]}-2)):${COMP[2]}\"\
    \n}\n```\n\nAs you noticed, the function takes a date as an argument, parse it,\
    \ and write back that date minus two hours. Unfortunately, the result is far from\
    \ satisfying as the expected format is not always respected and I even have negative\
    \ hours sometimes:\n\n```\nyesik.it:~/ItsFOSS$ minus-two-hours now\n2016-11-22\
    \ 20:55\nyesik.it:~/ItsFOSS$ minus-two-hours \"2016/11/21 05:27:18\"\n2016-11-21\
    \ 3:27\nyesik.it:~/ItsFOSS$ minus-two-hours \"2016/11/21 01:10:42\"\n2016-11-21\
    \ -1:10\n```\n\nCould you help me finding a solution to obtain the desired result?"
  merge: -1
  pgno: 53
- img_proc: true
  md: '# The solution


    What was the problem arithmetic is much more complicated than one might expect.
    I strongly discourage you from taking the path I used in my initial attempt: never
    do date and time calculations by yourself. If you really need an argument to convince
    you, think for example about issues with daylight saving time.


    That being said, which options do we still have? Any decent programming language
    should have some facilities to deal with time specific issues. Here we are using
    the Bash, and we have to rely on the date tool for that purpose.


    # How to fix that?


    Converting date to quantities


    When faced with similar problems, the typical solution will be to convert the
    (human readable) date and time to some numeric *quantity*.


    Usually, we convert dates to a number of seconds (or milliseconds) since some
    reference time. Having that numeric quantity, we can now use classic arithmetics
    to add or remove homogeneous quantities (say never 7200s — that is 2×60×60s —
    to obtain the date it was hours ago). Finally, using the same facilities as in
    the initial step, we can convert back the result to a date-time format.


    ![](img/8f6bf8024f58c92982eb49d5f91a7bf7_54_0.png)'
  merge: -1
  pgno: 54
- img_proc: true
  md: "In practice, in Unix-systems, the reference date is usually 00:00:00 UTC on\
    \ 1 January 1970—sometimes known as %s Epoch⁴. The date utility does provide:\n\
    \n+   - the %s specifier to convert a date to the number of seconds since the\
    \ Epoch\n- and @@ symbol to specify an input date is expressed as a number of\
    \ seconds since the Epoch (BSD) will use the -r option for that\n\nSo here is\
    \ a possible solution to your:\n\n```\nminus-two-hours() {\n  # 1. Convert to\
    \ number of seconds since Unix Epoch\n  SRC=$(date -d \"1\" +%s)\n  # 2. Remove\
    \ two hours (expressed as a number of seconds)\n  DST=$((SRC-2*60))\n  # 3. Display\
    \ the result using the required format\n  date -d \"$DST\" +\"%F %H:%M\"\n}\n\
    ```\n\nUsing the mighty powers of GNU date utils\n\nThe solution above highly\
    \ portable—even beyond the limits of shell programming.\n\nBut when using date\
    \ as we do on Linux for example, we have access to a whole world of subtleties\
    \ to express the date. In particular, you can simply write that:\n\n```\nminus-two-hours()\
    \ {\n  date -d \"$1 2 hours ago\" +\"%F %H:%M\"\n}\n```\n\n\"2 hours ago\" is\
    \ part of the date specification and is understood by GNU date as a way to say\
    \ \"remove two hours to the previous date\".\n\nAs you can see, when portability\
    \ is not a concern, it worth taking the time to explore a little bit your specific\
    \ tools documentation as they may contain hidden gems!\n\n> ⁴I always wondered\
    \ if the Apoc character name in Matrix was related to that. In \"French English\"\
    \ both are pronounced the same..."
  merge: -1
