- img_proc: true
  md: '# The solution


    # How to reproduce


    Here is the raw code we used to produce this challenge. If you run that in a terminal,
    you will be able to reproduce exactly the same result as displayed in the challenge
    illustration (assuming you are using the same software version as me):


    ```

    # as root :

    cd /tmp

    rm -rf ItsFOSS

    mkdir -p ItsFOSS

    cd ItsFOSS

    date > a

    date > b

    date > c

    sudo chattr +i c

    clear

    ls -ls

    rm *

    rm -f c

    ls -ls

    ```


    # What was the problem?


    You may have noticed I used above the chattr command to set the (i)mutable Linux
    filesystem attribute for the file c. Depending on your filesystem, all attribute
    changes are not available.


    But here, I am using and ext2 filesystem that supports the i flag. And to quote
    the man:


    > A file with the ''i'' attribute cannot be modified: it cannot be deleted or
    renamed, no link can be created to this file and no data can be written to the
    file. Only the superuser or a process possessing the CAP_LINUX_IMMUTABLE capability
    can set or clear this attribute.


    Basically after the chattr +i the file is locked until we clear this flag. Please
    notice the attribute is stored in the filesystem. So it will survive reboots &
    filesystem unmount/cycles.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# How to fix that?


    First, we can check the explanation above by using the lsattr command:


    ```

    root:015# lsattr c

    ----i--------- c

    ```


    Clearly, the (i)mutable flag is set. So, in order to remove that file (or to make
    any change to it), I have to clear that flag. That after, I can do whatever I
    want on the file as usual:


    ```

    root:016# chatter -i c

    root:017# lsattr c

    ------------ c

    root:018# rm c

    root:019# ls -ls

    total 0

    ```


    If you''re not aware of the existence of chatter, its effects can be quite puzzling.
    Worth mentioning chatter is a Linux-specific command, originally written for the
    ext2/3/4 filesystems. Today''s some of its feature are supported by other filesystems.


    In the BSD-world, there is a similar command called chflags. Read more on Wikipedia(https://en.wikipedia.org/wiki/Chattr)
    for a gentle introduction to that commands compared to chatter.'
