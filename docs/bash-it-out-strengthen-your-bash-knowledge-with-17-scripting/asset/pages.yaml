    done\n```\n\nMy goal is to count the total of each different tokens there was\
    \ in he stream. By myself, I also find a solution to count the number of RED tokens:\n\
    \n```\n# You MUST change that\nyesik:-~/ItsFOSS$ stream | \\\ngrep -F RED | wc\
    \ -1 > RED.CNT\nyesik:-~/ItsFOSS$ cat RED.CNT\n38\n```\n\nUnfortunately, I couldn't\
    \ find any solution to count each (RED, BLUE and GREEN) tokens. That's why I need\
    \ your help. Any idea?\n\n> ² Challenge is inspired from a real-world application\
    \ where we had to monitor the customer flow in a store. There were sensors spread\
    \ across strategic locations on the floor, and each sensor issued an event when\
