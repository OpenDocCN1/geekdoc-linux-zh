  md: "```\ndecode() {\n  while read -d' ' c ; do\n    echo -en '\\x$c'\n  done\n\
    \  echo\n}\n```\n\nIn that solution, the decode function will read the message\
    \ hexadecimal number by hexadecimal number, and will use the echo internal command\
    \ to output the corresponding character. The trick here is the -e option allowing\
    \ the echo command to understand \\xNN sequences as character codes.\n\nYou can\
    \ try the -e option easily:\n\n```\necho -e '\\x48\\x45\\x4C\\x4F'\n```\n\n# Alternate\
    \ solutions\n\nOther solutions are available. The most obvious would be to use\
    \ the xxd tool which has a dedicated reverse (-r) mode:\n\n```\ndecode() { xxd\
    \ -r -p; echo; }\n```\n\nIn addition, I cannot resist in showing you a fragile\
    \ but somewhat clever solution:\n\n```\ndecode() {\n  S='$(echo </dev/stdin)\n\
    \  echo -e ${S// /\\x}\n}\n```\n\nThe first line reads the entire input data into\
    \ a variable, ensuring all hexadecimal numbers are preceded by one (and only one)\
    \ space. After that, in the second line, we substitute each space by the \\x prefix\
    \ so echo -e can perform the conversion. I said this solution was fragile as it\
    \ will break for very large files. Could you understand why?"
