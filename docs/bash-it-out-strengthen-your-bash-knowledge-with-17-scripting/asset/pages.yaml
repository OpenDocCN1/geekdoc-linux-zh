  md: '# # Challenge 13: Converting text to uppercase


    # ## What I tried to achieve?


    I have some text file containing twice the same sentence, once written in English
    and once written French:


    ```

    yesik.it:~/ItsFOSS$ cat text

    This text should be written in all

    ercase letters!


    Ce text doit être affiché uniquement

    en lettres majuscules!

    ```


    I need to display the content of that file in all uppcases. Do you have any idea
    how I could perform that task? I mean without having retype all the text...


    # ## The solution


    The canonical tool to perform character substitution is tr-- stands for transliteration.
    The tr command takes two arguments: the source alphabet and the destination alphabet.
    And it performs a one-to-one mapping from the former to the latter.


    ```

    yesik.it:~/ItsFOSS$ tr ''[a-z]'' ''[A-Z]'' < text

    THIS TEXT SHOULD BE WRITTEN IN ALL

    UPPERCASE LETTERS!


    CE TEXT DOIT AFFICHÉ UNIQUEMENT

    EN LETRES MAJUSCULES!

    ```


    This worked. But only for the US-ASCII letters. The accentuated letter, and any
    letter outside the US-ASCII range were not translated.


    If you have some experience in using the regular expression, you may be tempted
    to use character classes instead of an explicit range:


    > ³ The ''tr'' command does not use regular expression. But it accepts a syntax
    similar to character ranges to specify the source and destination alphabets. For
    example, the syntax [a-z] is a shorthand for abcghijklmnopqrstuvwxyz'
  merge: -1
  pgno: 51
- img_proc: true
  md: "yesik.it:~/ItsFOSS$ tr '[:lower:]' '[:upper:]' < text\nTHIS TEXT SHOULD BE\
    \ WRITTEN IN ALL\nUPPERCASE LETTERS!\n\nCE TEXT DOIT être AFFICHÉ UNIQUEMENT\n\
    EN LETRES MAJUSCLES!\n\nUnfortunately this doesn't work better. A solution would\
    \ be to explicitly add the mapping for the required characters:\n\nyesik.it:~/ItsFOSS$\
    \ tr 'é[a-z]' 'ÉÉ[A-Z]' < text\nTHIS TEXT SHOULD BE WRITTEN IN ALL\nUPPERCASE\
    \ LETTERS!\n\nCE TEXT DOIT ÊTRE AFFICHÉ UNIQUEMENT\nEN LETRES MAJUSCLES!\n\nThis\
    \ time, it works, but this is tedious. Especially if you don't know in advance\
    \ the set of letters that will be present in the text file. Surprisingly, the\
    \ Bash is much better suited than the tr command to change the character case:\n\
    \n```\nyesik.it:~/ItsFOSS$ while read; do\n    echo ${REPLY^^}\n  done < text\n\
    \nTHIS TEXT SHOULD BE WRITTEN IN ALL\nUPPERCASE LETTERS!\n```\n\nCE TEXT DOIT\
    \ ÊTRE AFFICHÉ UNIQUEMENT\nEN LETRES MAJUSCLES!\n\nIn that code, the while loop\
    \ simply read the input file line by line. The Bash read command by default store\
    \ the value into the REPLY variable. And I just have to echo that variable, by\
    \ using the special ${var^^} notation that will expand the content of a variable\
    \ but letters converted to uppercase.\n\nAs an exercise, I you experiment with\
    \ the ${var,,} parameter expansion which works the same, but converting to lowercase\
    \ rather than uppercase."
