    yesik:~/ItsFOSS$ cat HEADER DATA01 | tee DATA01

    # Month, Year, Est.Value

    # Month, Year, Est.Value

    ```


    ```

    yesik:~/ItsFOSS$ head HEADER DATA01

    ==> HEADER <=<

