- img_proc: true
  md: '# The solution


    What was the problem?

    The only difficulty here was my initial attempt at discarding some part of the
    input, because I directly send the data stream to the grep.


    Basically there are three approach to solve that problem:


    +   - Store the stream data and process afterward;

    - Duplicate the stream and process independent path for RED, BLUE and GREEN tokens;

    - Handle all cases in the same command as they arrive.


    For it worth, after each solution, I give the real-time usage observed on my system.
    This just an indication and has to be taken with caution. So feel free to make
    your own comparison yourself !


    # The store and process approach


    The simplest implementation of the store-and-process approach is obvious:


    ```

    stream > stream.cache

    grep -F RED < stream.cache | wc -1 > RED.CNT

    grep -F BLUE < stream.cache | wc -1 > BLUE.CNT

    grep -F GREEN < stream.cache | wc -1 > GREEN.CNT

    rm stream.cache

    (1.3s for 10,000,000 tokens)

    ```


    It works, but has several drawbacks: we have to store all the data before they
    are processed. In addition, we handle the three cases sequentially. More subtle,
    as if you read several times the stream.cache file, you potentially have some
    race condition if a concurrent process updates that file during processing.


    Still in the store-and-process category, here is a completely different solution:


    ```

    stream | sort | uniq -c

    (5.9s for 10,000,000 tokens)

    ```


    I consider that a store-and-process approach, since the sort command has to first
    read and store (either in RAM or disk) all data before being able to process them.
    More precisely, on my'
  merge: -1
  pgno: 44
- img_proc: true
  md: "Debian system, the sort command creates several temporary file in /tmp with\
    \ read-write permissions. Basically this solution has the same drawbacks as the\
    \ very first one but with much worst performances.\n\n# Duplicate stream\n\nDo\
    \ we really have to store the data before processing them? No. A much clever idea\
    \ would be to split the stream in several parts, processing one kind of token\
    \ in each sub-stream:\n\n```\nstream | tee >(grep -F RED | wc -1 > RED.CNT) \\\
    \n>(grep -F BLUE | wc -1 > BLUE.CNT) \\\n>(grep -F GREEN | wc -1 > GREEN.CNT)\
    \ \\\n>/dev/null\n\n0.8s for 10,000,000\n```\n\nHere, there are no intermediate\
    \ files. The tee command replicates the stream data as they arrive. Each processing\
    \ unit gets its own copy of the data, and can process them on the fly. This is\
    \ a clever idea because not only we handle data as they arrive, but we have now\
    \ parallel processing.\n\n# Handle data as they arrive\n\nIn computer science,\
    \ we would probably say the previous solution took a functional approach to the\
    \ problem. On the other hand, the next ones will be purely an imperative solution.\
    \ Here, we will read each token in its turn, and if this is a RED token, then\
    \ we will increment a RED counter, else if this is a BLUE token, we will increment\
    \ a BLUE counter else if this is a GREEN token, we will increment a GREEN counter.\n\
    \nThis is a plain Bash implementation of that idea:\n\n```\ndeclare -i RED=0 BLUE=0\n\
    stream | while read TOKEN; do\n  case \"$TOKEN\" in\n    RED) RED+=1\n    ;;\n\
    \    BLUE) BLUE+=1\n    ;;\n    GREEN) GREEN+=1\n    ;;\n  esac\ndone\n(103.2s\
    \ for 10,000,000 tokens)\n```"
  merge: -1
  pgno: 45
- img_proc: true
  md: 'Finally, being a great fan of the Awk command, I will not resist the temptation
    of using it to solve that challenge in a neat and elegant way:


    ```

    stream | awk ''

    /RED/ { RED++ }

    /BLUE/ { BLUE++ }

    /GREEN/ { GREEN++ }

    END { printf "%d %d %d\n",RED,BLUE,GREEN }


    (2.6s for 10,000,000 tokens)

    ```


    My Awk program is made of four rules:


    +   1. When encountering a line containing the word RED, increase ((++) the RED
    counter

    2. When encountering a line containing the word BLUE, increase the BLUE counter

    3. When encountering a line containing the word GREEN, increase the GREEN counter

    4. At the END of the input, display both counters.


    Of course to fully understand that we know, for the purpose of mathematical operators,
    uninitialized variables are assumed to be zero.


    That works great. But it requires duplication of the same rule for. Not a big
    deal here we have only three different tokens. More annoying if we have many of
    them. To improve that solution, we can rely on arrays:


    ```

    stream | awk ''

    { C[0]++ }

    END { printf "%d %d %d\n",C["RED"],C["BLUE"],C["GREEN"] }


    (2.0s for 10,000,000 tokens)

    ```


    We only need two rules here, however when the number of tokens:


    +   1. Whatever is the read (\$0) increase the corresponding array cell (here,
    C["RED"],C["BLUE"] or C["GREEN"])

    2. At the END of the input, display the content of the array for the different
    tokens.


    Please notice that "RED", "BLUE" and "GREEN" are now handled as character strings
    in the program (did you see the double quotes around them?) And that''s not an
    issue for AWK since it supports associative arrays. And just like plain variables,
    uninitialized cells in an AWK array are assumed to be zero for mathematical operators.


    As I explained it before, I made the choice of using AWK. But Perl fans might
    have a different opinion of the subject. If you''re one of them, writing your
    own solution?'
  merge: -1
  pgno: 46
