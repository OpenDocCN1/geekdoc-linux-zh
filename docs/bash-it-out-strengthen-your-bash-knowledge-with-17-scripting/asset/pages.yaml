  md: "# Challenge 17: Generate a fair dice roll\n\nWhat I tried to achieve?\n\nI'm\
    \ starting to write a text adventure game in the purest tradition of the Colossal\
    \ Cave Adventure or Zork. But written in Bash.\n\nFor that game, I need a way\
    \ to generate fair 6-faced dice rolls. Of course, I do not need a \"cryptographically\
    \ strong pseudorandom number generator\". But, on the other hand, the following\
    \ solution in probably not satisfying either:\n\n```\nint getRandomNumber() {\n\
    \    return 4; // chosen by fair dice roll.\n    // guaranteed to be random.\n\
    }\n```\n\n(from https://xkcd.com/221/ by the xkcd author some reserved.)\n\nCould\
    \ you help me in generating a random number in the 1-6 range, each result being\
    \ equally probable?\n\n# The solution\n\nWhat was the problem?\n\nIf you only\
    \ had to know the $RANDOM Bash variable to produce pseudo-random numbers, this\
    \ challenge would have probably been put into the \"Level 2\" section. But there\
    \ is a subtle pitfall involved here. What was it? Let's examine a wrong solution\
    \ to discover that:\n\n```\n# This does NOT solve the challenge\ngetRandomNumber()\
    \ {\n    echo $((RANDOM%6+1));\n}\n```\n\nI repeat: this does not solve the challenge,\
    \ despite the fact by repeatedly calling that you obtain pseudorandom numbers\
    \ in the 1-6 range."
  merge: -1
  pgno: 63
- img_proc: true
  md: 'So what as wrong with that?


    Simple: the outcome is **not** fair.


    # What was the problem, really?


    The Bash random function returns a pseudo-random integer between 0 and 32767.
    That is $2^{15}$ possibilities. In the above function, I used the modulo operator
    (%) to map that range into the 0-5 range. But this mapping can only maintain equiprobability
    if the destination range is an integer divisor of the original range size.


    Simply said, in our case, since the cardinality of the original range is a power
    of two, you can only have equiprobable results if you map to another set whose
    size is a power of two itself. Something 6 isn''t.


    As this is a little bit hard to explain with words, here is a graphical representation
    of the mapping from the 0-15 range ($2^4$ items) to the 0-5 range:


    ![](img/8f6bf8024f58c92982eb49d5f91a7bf7_64_0.png)


    It is quite obvious in the above graph there are **greater** chances of obtaining
    an outcome in the 0-3 range rather than in the 4-5 range. As an exercise I let
    you produce the same graph for N in the 0-32767 range if you want, you will discover
    a similar issue.'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'Knowing that, a solution you might end up with is the following one:


    ```

    # This does NOT solve the challenge

    getRandomNumber() {

    echo $((RANDOM%2+RANDOM%2+RANDOM%2+RANDOM%2+1));

    }

    ```


    There is some logic here: I said if you used a power of two in the modulo operator
    you will have fair results. 2 is a power of two. And %2 will produce either 0
    or 1. Adding five times a number between 0 and 1 will produce a result between
    0 and 5. However:


    ```

    # Gather some statistical data

    for ((i=0; i < 500000; ++i))

    do

    getRandomNumber

    done | sort | uniq -c


    15531 1

    78134 2

    155880 3

    156604 4

    78184 5

    15667 6

    ```


    ![](img/8f6bf8024f58c92982eb49d5f91a7bf7_65_0.png)'
  merge: -1
  pgno: 65
- img_proc: true
  md: "It is quite obvious the result is not fair. In fact, you can recognize the\
    \ typical shape of a normal distribution:\n\n![](img/8f6bf8024f58c92982eb49d5f91a7bf7_66_0.png)\n\
    \n# How to fix that?\n\nThe solution is to consider the modulo operator leads\
    \ to a fair solution, but only in a subset of the original range. For example,\
    \ if the original range is 0-15, and the destination range is 0-5, for input values\
    \ in the 0-11 range, the modulo will produce an output as *fair* as the input.\
    \ The problem lies for input values in the 12-15 range. This is *exactly* was\
    \ is illustrated in my initial graph.\n\nA trick is then simply to ignore values\
    \ in the problematic range, and take another value if the random generator produced\
    \ such value. All that leading to:\n\n```\n# This DO solve the challenge\ngetRandomNumber()\
    \ {\n  N=$RANDOM\n\n  while ((N>=32768/6*6))\n  do\n    # N is in the problematic\
    \ range. Take another value:\n    N=$RANDOM\n  done\n\n  echo $((N%6+1));\n}\n\
    ```"
  merge: -1
