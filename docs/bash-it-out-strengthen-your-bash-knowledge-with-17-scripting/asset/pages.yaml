  md: '# The solution


    Maybe that was your first reflex, but no, using quotes or backslash is **not**
    the solution. None of

    this syntax will work:


    ```

    yesik:~/ItsFOSS$ rm -rf ''*''

    rm: invalid option --''

    Try ''rm --help'' for more information.

    yesik:~/ItsFOSS$ rm \rf\ ''*''

    rm: invalid option --''

    Try ''rm --help'' for more information.

    ```


    Why are those not valid solutions? Because they would protect special characters
    from shell''s

    interpretation. But here the problem is not with the shell. But with the rm command
    itself.


    # How to solve that?


    Hopefully, rm like several other standard command supports the -- special option
    to indicate the

    start of filename list. After -- the command will no longer try to interpret strings
    by a

    dash as an option. Which is exactly what we need:


    ```

    yesik:~/ItsFOSS$ rm ''-rf ''*''

    ```


    Notice however quotes (or backslashes) are still necessary to protect the space
    and the

    star from shell interpretation. If you want to experiment more with that, I encourage
    you to use

    the ls and touch commands, both of them supports the -- option. And they are way
    less

    dangerous to use than the rm command!'
