  md: '# C++ COMMENTS


    Commenting in C++ involves using a double forward slash `//` or a forward slash
    and an asterisk `/*`. You''ve already seen some brief examples but this is how
    they work.


    +   **STEP 1** Using the Hello World code as an example, you can easily comment
    on different sections of the code using the double forward slash:


    ```

    `//My first C++ program`


    `cout << "Hello, world!\n";`

    ```


    ![](img/4aefeb2d095f688b34af6207870c5f39_50_0.png)


    +   **STEP 2** However, you can also add comments to the end of a line of code,
    to describe it in a better way what''s going on:


    ```

    `cout << "Hello, world!\n"; //This line outputs the words ‘Hello, world!’. The
    `\`n` denotes a new line.`

    ```


    Note, you don''t have to put a semicolon at the end of a comment. This is because
    it''s a line in the code that''s ignored by the compiler.


    ![](img/4aefeb2d095f688b34af6207870c5f39_50_1.png)


    +   **STEP 3** You can comment out several lines by using the forward slash and
    asterisk:


    ```

    `/* This comment can`

    `cover several lines`

    `* without the need to add more slashes */`

    ```


    Just remember to finish the block comment with the opposite asterisk and forward
    slash.


    ![](img/4aefeb2d095f688b34af6207870c5f39_50_2.png)


    +   **STEP 4** Be careful when commenting, especially with block comments. It''s
    very easy to forget to add the closing asterisk and forward slash and thus negate
    any code that falls inside the comment block.


    ![](img/4aefeb2d095f688b34af6207870c5f39_50_3.png)


    +   **STEP 5** Obviously if you try and build and execute the code it errors out,
    complaining of a missing curly bracket `}` to finish off the block of code. If
    you''ve made the error a few times, then it can be time consuming to go back and
    rectify. Thankfully, the colour coding in Geany helps identify comments from code.


    ![](img/4aefeb2d095f688b34af6207870c5f39_50_4.png)


    +   **STEP 6** With block comments, it''s good practise in C++ to add an asterisk
    to each new line of the comment block. This also helps you to remember to close
    the comment block before continuing with the code:


    ```

    `/* This comment can`

    `* cover several lines`

    `* without the need to add more slashes */`

    ```


    Thankfully, Geany does this automatically but be aware of it when using other
    IDEs.


    ![](img/4aefeb2d095f688b34af6207870c5f39_50_5.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# # Variables


    Variables differ slightly when using C++ as opposed to Python. In Python, you
    can simply state that ''a'' equals 10 and a variable is assigned. However, in
    C++ a variable has to be declared with its type before it can be used.


    # ## THE DECLARATION OF VARIABLES


    You can declare a C++ variable by using statements within the code. There are
    several distinct types of variable you can declare. Here''s how it works.


    **STEP 1** Open up a new, blank C++ file and enter the usual code headers:


    ```

    #include <iostream>

    using namespace std;


    int main()

    {


    }

    ```


    ![](img/4aefeb2d095f688b34af6207870c5f39_51_0.png)


    **STEP 2** Start simple by creating two variables, a and b, with one having a
    value of 10 and the other 5. You can use the data type int to declare these variables.
    Within the curly brackets enter:


    ```

    int a;

    int b;


    a = 10;

    b = 5;

    ```


    ![](img/4aefeb2d095f688b34af6207870c5f39_51_1.png)


    **STEP 3** You can build and run the code but it won''t do much, other than store
    the values 10 and 5 to the integers a and b. Ignore the warnings about variables
    set but not used, the code still works. To output the contents of the variables,
    add:


    ```

    cout << a;

    cout << "\n";

    cout << b;

    ```


    The `cout << "\n";` part simply places a new line between the output of 10 and
    5.


    ![](img/4aefeb2d095f688b34af6207870c5f39_51_2.png)


    **STEP 4** Naturally you can declare a new variable, call it result and output
    some simple arithmetic:


    ```

    int result;

    result = a + b;

    cout << result;

    ```


    Insert the above into the code as per the screenshot.


    ![](img/4aefeb2d095f688b34af6207870c5f39_51_3.png)'
