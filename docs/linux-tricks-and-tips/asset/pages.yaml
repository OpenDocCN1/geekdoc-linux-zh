- pgno: 25
  md: '# Working with Variables


    We''ve seen some examples of variables in our Python code already but it''s always
    worth going through the way they operate and how Python creates and assigns certain
    values to a variable.


    # VARIOUS VARIABLES


    You''ll be working with the Python 3 IDLE Shell in this tutorial. If you haven''t
    already, open Python 3 or close down the previous IDLE Shell to clear up any old
    code.


    **STEP 1** In some programming languages you are required to use a dollar sign
    to denote a string, which is a variable made up of multiple characters, such as
    a name of a person. In Python this isn''t necessary. For example, in the Shell
    enter: *name*=**David Hayward** (or use your own name, unless you''re also called
    David Hayward).


    ![](img/4aefeb2d095f688b34af6207870c5f39_25_0.png)


    **STEP 3** You''ve seen previously that variables can be concatenated using the
    plus symbol between the variable names. In our example we can use: print (*name*
    + **":** + *title*). The middle part between the quotations allows us to add a
    colon and a space, as variables are connected without spaces, so we need to add
    them manually.


    ![](img/4aefeb2d095f688b34af6207870c5f39_25_1.png)


    **STEP 2** You can check the type of variable in use by issuing the *type*() command,
    placing the name of the variable inside the brackets. In our example, this would
    be: *type* (*name*). Add a new string variable: *title*=**"Descended from Vikings"**.


    ![](img/4aefeb2d095f688b34af6207870c5f39_25_2.png)


    **STEP 4** You can also combine variables within another variable. For example,
    to combine both name and title variables into a new variable we use: *character*=*name*
    + **":** + *title*. Then output the content of the new variable as: print (*character*).
    Numbers are stored as different variables: *age*=44 Type (*age*) Which, as we
    know, are integers.


    ![](img/4aefeb2d095f688b34af6207870c5f39_25_3.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: "# Working with Variables\n\nHowever, you can't combine both strings and integer\
    \ type variables in the same command, as you would a set of similar variables.\
    \ You need to either turn one into the other or vice versa. When you do try to\
    \ combine both, you get an error message:\n\n```\n`print (name + age)`\n```\n\n\
    ```\n```\nPython 3.4.2 (default, Oct 19 2014, 13:31:11)\n[GCC 4.9.1] on linux\n\
    Type \"copyright\", \"credits\" or \"license()\" for more information.\n>>> name='David\
    \ Hayward'\n>>> print (name)\nDavid Hayward\n>>> tclass `<str>`\n>>> title=`Descended\
    \ from Vikings`\n>>> print (name + \" \" + title)\nDavid Hayward: Descended from\
    \ Vikings\n>>> character=name + \":\" + title\n>>> print (character)\nDavid Hayward:\
    \ Descended from Vikings\n>>> age=44\n>>> ttype (age)\n<class `int`>\n>>> print\
    \ (name+age)\nTraceback (most recent call last):\n  File `\"pyshell\"0` , line\
    \ 1, in <module>\nprint (name+age)\nTypeError: Can't convert 'int' object to str\
    \ implicitly\n>>> |\n```\n```\n\nThis is a process known as TypeCasting. The Python\
    \ code is:\n\n```\n```\nprint (character + \" is \"+ str(age) + \" years old.\"\
    )\n```\n```\n\nor you can use:\n\n```\n`print (character, \"is\", age, \"years\
    \ old.\")`\n```\n\nNotice again that in the last example, you don't need the spaces\
    \ between the words in quotes as the commas treat each argument to print separately.\n\
    \n```\n```\n>>> print (name + age)\nTraceback (most recent call last):\n  File\
    \ `\"pyshell\"0` , line 1, in <module>\nprint (name + age)\nTypeError: Can't convert\
    \ 'int' object to str implicitly\n>>> print (character + \" is \"+ str(age) +\
    \ \" years old.\")\nDavid Hayward: Descended from Vikings is 44 years old.\n>>>\
    \ print (character, \"is\", age, \"years old.\")\nDavid Hayward: Descended from\
    \ Vikings is 44 years old.\n>>> |\n```\n```\n\nAnother example of TypeCasting\
    \ is when you ask for input from the user, such as a name. for example, enter:\n\
    \n```\n`age= input (\"How old are you? \")`\n```\n\nAll data stored from the Input\
    \ command is stored as a string variable.\n\n```\n```\nPython 3.4.2 Shell\n\n\
    File Edit Shell Debug Options Windows Help\n\nPython 3.4.2 (default, Oct 19 2014,\
    \ 13:31:11)\n[GCC 4.9.1] on linux\nType \"copyright\", \"credits\" or \"license()\"\
    \ for more information.\n>>> age= input (\"How old are you? \")\nHow old are you?\
    \ 44\n>>> ttype(age)\n<class `str`>\n>>> |\n```\n```\n\nThis presents a bit of\
    \ a problem when you want to work with a number that's been inputted by the user,\
    \ as age + 10 won't work due to being a string variable and an integer. Instead,\
    \ you need to enter:\n\n```\n`int (age) + 10`\n```\n\nThis will TypeCast the age\
    \ string into an integer that can be worked with.\n\n```\n```\nPython 3.4.2 Shell\n\
    \nFile Edit Shell Debug Options Windows Help\n\nPython 3.4.2 (default, Oct 19\
    \ 2014, 13:31:11)\n[GCC 4.9.1] on linux\nType \"copyright\", \"credits\" or \"\
    license()\" for more information.\n>>> age= input (\"How old are you? \")\nHow\
    \ old are you? 44\n>>> ttype(age)\n<class `str`>\n>>> age + 10\nTraceback (most\
    \ recent call last):\n  File `\"pyshell\"0` , line 1, in <module>\n age + 10\n\
    TypeError: Can't convert 'int' object to str implicitly\n>>> int(age) + 10\n54\n\
    >>> |\n```\n```\n\nThe use of TypeCasting is also important when dealing with\
    \ floating point arithmetic; remember: numbers that have a decimal point in them.\
    \ For example, enter:\n\n```\n`shirt=19.99`\n```\n\nNow enter type(shirt) and\
    \ you'll see that Python has allocated the number as a 'float', because the value\
    \ contains a decimal point.\n\n```\n```\nPython 3.4.2 Shell\n\nFile Edit Shell\
    \ Debug Options Windows Help\n\nPython 3.4.2 (default, Oct 19 2014, 13:31:11)\n\
    [GCC 4.9.1] on linux\nType \"copyright\", \"credits\" or \"license()\" for more\
    \ information.\n>>> shirt=19.99\n>>> ttype(shirt)\n<class `float`>\n>>> |\n```\n\
    ```\n\nWhen combining integers and floats Python usually converts the integer\
    \ to a float, but should the reverse ever be applied it's worth remembering that\
    \ Python doesn't return the exact value. When converting a float to an integer,\
    \ Python will always round down to the nearest integer, called truncating; in\
    \ our case instead of 19.99 it becomes 19.\n\n```\n```\nPython 3.4.2 Shell\n\n\
    File Edit Shell Debug Options Windows Help\n\nPython 3.4.2 (default, Oct 19 2014,\
    \ 13:31:11)\n[GCC 4.9.1] on linux\nType \"copyright\", \"credits\" or \"license()\"\
    \ for more information.\n>>> shirt=19.99\n>>> ttype(shirt)\n<class `float`>\n\
    >>> int(shirt)\n19\n>>> |\n```\n```"
  merge: -1
  img_proc: true
- pgno: 27
  md: "# User Input\n\nWe've seen some basic user interaction with the code from a\
    \ few of the examples earlier, so now would be a good time to focus solely on\
    \ how you would get information from the user then store and present it.\n\n#\
    \ USER FRIENDLY\n\nThe type of input you want from the user will depend greatly\
    \ on the type of program you're coding. For example, a game may ask for a character's\
    \ name, whereas a database can ask for personal details.\n\n+   **STEP 1**\n+\
    \   If it's not already, open the Python 3 IDLE Shell, and start a New File in\
    \ the Editor. Let's begin with something really simple, enter:\n+   \n+      \
    \ print(\"Hello\")\n+       firstname=input(\"What is your first name? \")\n+\
    \       print(\"Thanks.\")\n+       surname=input(\"And what is your surname?\
    \ \")\n\n+   **STEP 3**\n+   Now that we have the user's name stored in a couple\
    \ of variables we can call them up whenever we want:\n+   \n+       print(\"Welcome\"\
    , firstname, surname, \" I hope\n+       you're well today.\")\n\n+   **STEP 2**\n\
    +   Save and execute the code, and as you already no doubt suspected, in the IDLE\
    \ Shell the program will ask for your first name, storing it as the variable *firstname*,\
    \ followed by your surname; also stored in its own variable (*surname*).\n\n+\
    \   **STEP 4**\n+   Run the code and you can see a slignt issue, the full stop\
    \ after the surname follows a blank space. To eliminate that we can add a plus\
    \ sign instead of the comma in the code:\n+   \n+       print(\"Welcome\", firstname,\
    \ surname+\" I hope\n+       you're well today.\")"
  merge: -1
  img_proc: true
- pgno: 28
  md: "# STEP 5\n\nYou don’t always have to include quoted text within the input command.\
    \ For example, you can ask the user their name, and have the input in the line\
    \ below:\n\n```\nprint(“Hello. What’s your name?”)\nname=input()\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_28_0.png)\n\
    \n# STEP 6\n\nThe code from the previous step is often regarded as being a little\
    \ neater than having a lengthy amount of text in the input command, but it’s not\
    \ a rule that’s set in stone, so do as you like in these situations. Expanding\
    \ on the code, try this:\n\n```\nprint(“Halt! Who goes there?”)\nname=input()\n\
    ```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_28_1.png)\n\n# STEP 7\n\nIt’s\
    \ a good start to a text adventure game, perhaps? Now you can expand on it and\
    \ use the raw input from the user to flesh out the game a little:\n\n```\nif name==“David”:\n\
    \    print(“Welcome, good sir. You may pass.”)\nelse:\n    print(“I know you not.\
    \ Prepare for battle!”)\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_28_2.png)\n\
    \n# STEP 8\n\nWhat you’ve created here is a condition, which we will cover soon.\
    \ In short, we’re using the input from the user and measuring it against a condition.\
    \ So, if the user enters David as their name, the guard will allow them to pass\
    \ unhindered. Else, if they enter a name other than David, the guard challenges\
    \ them to a fight.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_28_3.png)\n\n#\
    \ STEP 9\n\nJust as you learned previously, any input from a user is automatically\
    \ a string, so you need to apply a TypeCast in order to turn it into something\
    \ else. This creates some interesting additions to the input command. For example:\n\
    \n```\n# Code to calculate rate and distance\nprint(“Input a rate and a distance”)\n\
    rate = float(input(“Rate: ”))\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_28_4.png)\n\
    \n# STEP 10\n\nTo finalise the rate and distance code, we can add:\n\n```\ndistance\
    \ = float(input(“Distance: ”))\nprint(“Time:”, (distance / rate))\n```\n\nSave\
    \ and execute the code and enter some numbers. Using the float(input element,\
    \ we’ve told Python that anything entered is a floating point number rather than\
    \ a string.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_28_5.png)"
  merge: -1
  img_proc: true
- pgno: 29
  md: "# # Creating Functions\n\nNow that you’ve mastered the use of variables and\
    \ user input, the next step is to tackle functions. You’ve already used a few\
    \ functions, such as the print command but Python enables you to define your own\
    \ functions.\n\n# ## FUNKY FUNCTIONS\n\nA function is a command that you enter\
    \ into Python to do something. It’s a little piece of self-contained code that\
    \ takes data, works on it and then returns the result.\n\n+   - **STEP 1** It’s\
    \ not just data that a function works on. They can do all manner of useful things\
    \ in Python, such as sort data, change items from one format to another and check\
    \ the length or type of items. Basically, a function is a short word that’s followed\
    \ by brackets. For example, `len()`, `list()` or `type()`.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_29_0.png)\n\
    \n+   - **STEP 2** A function takes data, usually a variable, works on it depending\
    \ on what the function is programmed to do and returns the end value. The data\
    \ being worked on goes inside the brackets, so if you wanted to know how many\
    \ letters are in the word antidisestablishmentarianism, then you’d enter: `len(\"\
    antidisestablishmentarianism\")` and the number 28 would return.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_29_1.png)\n\
    \n+   - **STEP 3** You can pass variables through functions in much the same manner.\
    \ Let’s assume you want the number of letters in a person’s surname, you could\
    \ use the following code (enter the text editor for this example):\n+   \n+  \
    \ ```python\n+   name=input(\"Enter your surname: \")\n+   count=len(name)\n+\
    \   print(\"Your surname has\", count, \"letters in it.\")\n+   ```\n+   \n+ \
    \  Press F5 and save the code to execute it.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_29_2.png)\n\
    \n+   - **STEP 4** Python has tens of functions built into it, far too many to\
    \ get into in the limited space available here.\n+   \n+   However, to view the\
    \ list of built-in functions available to Python 3, navigate to `www.docs.python.org/3/library/functions.html`.\
    \ These are the predefined functions, but since users have created many more,\
    \ they’re not the only ones available.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_29_3.png)"
  merge: -1
  img_proc: true
- pgno: 30
  md: "# Creating Functions\n\nSTEP 5 Additional functions can be added to Python\
    \ through modules. Python has a vast range of modules available that can cover\
    \ numerous programming duties. They add functions and can be as important as and\
    \ when required. For example, to use advanced Mathematics functions enter:\n\n\
    ```\nimport math\n```\n\nOnce entered, you have access to all the Math module\
    \ functions.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_30_0.png)\n\nSTEP 6 To\
    \ use a function from a module enter the name of the module followed by a full\
    \ stop, then the name of the function. For instance, using the Math module, since\
    \ you've just imported it into Python, you can utilise the square root function.\
    \ To do so, enter:\n\n```\nmath.sqrt(16)\n```\n\nYou can see that the code is\
    \ presented as module.function(data).\n\n![](img/4aefeb2d095f688b34af6207870c5f39_30_1.png)\n\
    \n# FORGING FUNCTIONS\n\nThere are many different functions you can import created\
    \ by other Python programmers and you will undoubtedly come across some excellent\
    \ examples in the future; you can also create your own with the def command.\n\
    \nSTEP 1 Choose File > New File to enter the editor, let's create a function called\
    \ Hello, that greets a user. Enter:\n\n```\ndef Hello():\n    print(\"Hello\"\
    )\n\nHello()\n```\n\nPress F5 to save and run the script. You can see Hello in\
    \ the Shell, type in Hello() and it returns the new function.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_30_2.png)\n\
    \nSTEP 3 To modify it further, delete the Hello(\"David\") line, the new script.\
    \ the last line in the script and press Ctrl+S to save file. Enter the editor\
    \ and create a new file (File > New file). Enter the following:\n\n```\nfrom Hello\
    \ import Hello\n\nHello(\"David\")\n```\n\nPress F5 to save and execute the code.\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_30_3.png)\n\nSTEP 2 Let's now expand\
    \ the function to accept a variable, the user's name for example. Edit your script\
    \ to read:\n\n```\ndef Hello(name):\n    print(\"Hello\", name)\n\nHello(\"David\"\
    )\n```\n\nThis will now accept the variable name, otherwise it prints Hello David,\
    \ in the Shell, enter: name= (“Bob”), then: Hello(name). Your function can now\
    \ pass variables through it.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_30_4.png)\n\
    \nSTEP 4 What you've just done is import the Hello function from the saved Hello.py\
    \ program and then used it to say hello to David. This is how modules and functions\
    \ work: you import the module then use the function. Try this one, and modify\
    \ it for extra credit:\n\n```\ndef add(a, b):\n    result = a + b\n    return\
    \ result\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_30_5.png)"
  merge: -1
  img_proc: true
- pgno: 31
  md: "![](img/4aefeb2d095f688b34af6207870c5f39_31_0.png)\n\n\n\n# # Conditions and\
    \ Loops\n\nConditions and loops are what make a program interesting; they can\
    \ be simple or rather complex. How you use them depends greatly on what the program\
    \ is trying to achieve; they could be the number of lives left in a game or just\
    \ displaying a countdown.\n\n# ## TRUE CONDITIONS\n\nKeeping conditions simple\
    \ to begin with makes learning to program a more enjoyable experience. Let’s start\
    \ then by checking if something is TRUE, then doing something else if it isn’t.\n\
    \n+   **STEP 1** Let’s create a new Python program that will ask the user to input\
    \ a word, then check it to see if it’s a four-letter word or not. Start with File\
    \ > New File, and begin with the input variable:\n+   `word=input(\"Please enter\
    \ a four-letter word: \")`\n\n+   **STEP 2** Now we can create a new variable,\
    \ then use the len function and pass the word variable through it to get the total\
    \ number of letters the user has just entered:\n+   `word=input(\"Please enter\
    \ a four-letter word: \")`  \n+   `word_length=len(word)`\n\n+   **STEP 3** Now\
    \ you can use an if statement to check if the word_length variable is equal to\
    \ four and print a friendly confirmation if it applies to the rule:\n+   `word=input(\"\
    Please enter a four-letter word: \")`  \n+   `word_length=len(word)`  \n+   `if\
    \ word_length == 4:`  \n+   `    print (word, \"is a four-letter word. Well done.\"\
    )`  \n+   The double equal sign (==) means check if something is equal to something\
    \ else.\n\n+   **STEP 4** The colon at the end of IF tells Python that if this\
    \ statement is true do everything after the colon that’s indented. Next, move\
    \ the cursor back to the beginning of the Editor:\n+   `word=input(\"Please enter\
    \ a four-letter word: \")`  \n+   `word_length=len(word)`  \n+   `if word_length\
    \ == 4:`  \n+   `    print (word, \"is a four-letter word. Well done.\")`  \n\
    +   `else:`  \n+   `    print (word, \"is not a four-letter word.\")`\n\n![](img/4aefeb2d095f688b34af6207870c5f39_31_1.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_31_2.png)\n\n![](img/4aefeb2d095f688b34af6207870c5f39_31_3.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_31_4.png)"
  merge: -1
  img_proc: true
- pgno: 32
  md: "# Conditions and Loops\n\n![](img/4aefeb2d095f688b34af6207870c5f39_32_0.png)\n\
    \nPress F5 and save the code to execute it. Enter a four-letter word in the Shell\
    \ to begin with; you should have the returned message that it’s the word is four\
    \ letters. Now press F5 again and rerun the program but this time enter a five-letter\
    \ word. The Shell will display that it’s not a four-letter word.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_32_1.png)\n\
    \nNow expand the code to include another conditions. Eventually, it could become\
    \ quite complex. We’ve added a condition for three-letter words:\n\n```\nword=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length ==\
    \ 4:\n    print(word, \"is a four-letter word. Well done.\")\nelif word_length\
    \ == 3:\n    print(word, \"is a three-letter word. Try again.\")\nelse:\n    print(word,\
    \ \"is not a four-letter word.\")\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_32_2.png)\n\
    \n# LOOP S\n\nA loop looks quite similar to a condition but they are somewhat\
    \ different in their operation. A loop will run through the same block of code\
    \ a number of times, usually with the support of a condition.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_32_3.png)\n\
    \nLet’s start with a simple While statement. Like IF, this will check to see if\
    \ something is TRUE, then run the indented code:\n\n```\nx = 1\nwhile x < 10:\n\
    \    print(x)\n    x = x + 1\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_32_4.png)\n\
    \nThe For loop is another example. For is used to loop over a range of data, usually\
    \ a list stored as variables inside square brackets. For example:\n\n```\nwords=[\"\
    Cat\", \"Dog\", \"Unicorn\"]\nfor word in words:\n    print(word)\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_32_5.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_32_6.png)\n\n![](img/4aefeb2d095f688b34af6207870c5f39_32_7.png)\n\
    \nThe difference between if and while is when while gets to the end of the indented\
    \ code, it goes back and checks the statement is still true. In our example x\
    \ is less than 10. With each loop it prints the current value of x, then adds\
    \ one to that value. When x does eventually equal 10 it stops.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_32_8.png)\n\
    \nThe For loop can also be used in the countdown example by using the range function:\n\
    \n```\nfor x in range(1, 10):\n    print(x)\n```\n\nThe x=x+1 part isn’t needed\
    \ here because the range function creates a list between the first and last numbers\
    \ used.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_32_9.png)\n\n![](img/4aefeb2d095f688b34af6207870c5f39_32_10.png)"
  merge: -1
  img_proc: true
- pgno: 33
  md: '# ## Python Modules


    Think of modules as an extension that’s imported into your Python code to enhance
    and extend its capabilities. There are countless modules available, and the Pi
    has most of them pre-installed; as do many Linux distros.


    # ### MASTERING MODULES


    In this instance we’re using Windows 10 to demonstrate installing modules, since
    they’re already there in Pi OS. The same steps apply for those Linux distro that
    don’t feature any modules, so don’t worry about cross platform compatibility.


    # **STEP 1**


    Although good, the built-in functions within Python are limited. The use of modules,
    however, allows us to make more sophisticated programs. As you are aware, modules
    are Python scripts that are imported, such as `import math`.


    ![](img/4aefeb2d095f688b34af6207870c5f39_33_0.png)


    # **STEP 3**


    The result is an error in the IDLE Shell, as the Pygame module isn’t recognised
    or installed in Python. To install a module we can use PiP (Pip Installs Packages).
    Close down the IDLE Shell and drop into a command prompt or Terminal session.
    At an elevated admin command prompt, enter: `pip install pygame`


    ![](img/4aefeb2d095f688b34af6207870c5f39_33_1.png)


    # **STEP 2**


    Some modules, especially on the Raspberry Pi, are included by default, the Math
    module being a prime example. Sadly, other modules aren’t always available. A
    good example on non-Pi platforms is the Pygame module, which contains many functions
    to help create games. Try: `import pygame`.


    ![](img/4aefeb2d095f688b34af6207870c5f39_33_2.png)


    # **STEP 4**


    The PiP installation requires an elevated status due it installing components
    at different locations. Windows users can search for CMD via the Start button
    and right-click the result then click Run as Administrator. Linux and Mac users
    can use the Sudo command, with sudo pip install package.


    ![](img/4aefeb2d095f688b34af6207870c5f39_33_3.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: "# STEP 5\n\nClose the command prompt or Terminal and relaunch the IDLE Shell.\
    \ You now can enter: import pygame, the module will be imported into the code\
    \ without any problems. You'll find that most code downloaded or copied from the\
    \ internet will contain a module, mainstream of which, these are usually the source\
    \ of errors in execution due to them being missing.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_34_0.png)\n\
    \n# STEP 6\n\nThe modules contain the extra code needed to achieve a certain result\
    \ within your own code, as we've previously experimented with. For example: import\
    \ random\n\nBrings in the code from the Random Number Generator Module. You can\
    \ then use this module to create something like:\n\nfor i in range(10):\n    print(random.randint(1,\
    \ 25))\n\n![](img/4aefeb2d095f688b34af6207870c5f39_34_1.png)\n\n# STEP 7\n\nThis\
    \ code, when saved and executed, will display ten random numbers from 1 to 25.\
    \ You can play around with the code to display more or less, and from a great\
    \ or lesser range. For example:\n\nimport random\nfor i in range(25):\n    print(random.randint(1,\
    \ 100))\n\n![](img/4aefeb2d095f688b34af6207870c5f39_34_2.png)\n\n# STEP 8\n\n\
    Multiple modules can be imported within your code. To extend our example, use:\n\
    \nimport random\nimport math\nfor I in range(5):\n    print(random.randint(1,\
    \ 25))\nprint(math.pi)\n\n![](img/4aefeb2d095f688b34af6207870c5f39_34_3.png)\n\
    \n# STEP 9\n\nThe result is a string of random numbers followed by the value of\
    \ Pi as pulled from the Math module using the print(math.pi) function. You can\
    \ also pull in certain functions from a module by using the from and import commands,\
    \ such as:\n\nfrom random import randint\nfor i in range(5):\n    print(randint(1,\
    \ 25))\n\n![](img/4aefeb2d095f688b34af6207870c5f39_34_4.png)\n\n# STEP 10\n\n\
    This helps create a more streamlined approach to programming. You can use import\
    \ module*, which will import everything defined within the named module. However,\
    \ it's often regarded as a waste of resources but it works nonetheless. Finally,\
    \ modules can be imported as aliases:\n\nimport math as m\nprint(m.pi)\n\nOf course,\
    \ adding comments helps to tell others what's going on.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_34_5.png)"
