- pgno: 9
  md: "# # How to Set Up Python in Linux\n\nWhile the Raspberry Pi’s operating system\
    \ contains the latest, stable version of Python, other Linux distros don’t come\
    \ with Python 3 preinstalled. If you’re not going down the Pi route, then here’s\
    \ how to check and install Python For Linux.\n\n# ## PYTHON PENGUIN\n\nLinux is\
    \ such a versatile operating system that it’s often difficult to nail down just\
    \ one way of doing something. Different distributions go about installing software\
    \ in different ways, so we’re sticking with Linux Mint for this particular tutorial.\n\
    \n+   **STEP 1**  \n+   First you need to ascertain which version of Python is\
    \ currently installed in your Linux system. To begin with, drop into a Terminal\
    \ session from your distro’s menu or hit the Ctrl+Alt+T keys.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_9_0.png)\n\
    \n+   **STEP 2**  \n+   Next enter `python --version` into the Terminal screen.\
    \ You should have the output relating to version 2.x of Python in the display.\
    \ By default, most Linux distros come with both Python 2 and 3, as there’s plenty\
    \ of code out there still available for Python 2. Now enter: `python3 --version`.\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_9_1.png)\n\n+   **STEP 3**  \n+   In\
    \ our case we have both Python 2 and 3 installed; as long as Python 3.x is installed,\
    \ then the code in our tutorials will work. It’s always worth checking to see\
    \ if the distro has been updated with the latest versions, so enter: `sudo apt-get\
    \ update && sudo apt-get upgrade` to update the system.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_9_2.png)\n\
    \n+   **STEP 4**  \n+   Once the update and upgrade completes, enter: `python3\
    \ --version` again to see if Python 3.x is updated or even installed; as long\
    \ as you have Python 3.x, you’re running the most recent major version. The numbers\
    \ after the 3. indicate patches and further updates. Often they’re unnecessary\
    \ but can contain vital new elements.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_9_3.png)"
  merge: -1
  img_proc: true
- pgno: 10
  md: '# How to Set Up Python in Linux


    ![](img/4aefeb2d095f688b34af6207870c5f39_10_0.png)


    However, if you want the latest, cutting edge version, you need to build Python
    from source. Start by entering these commands into the Terminal:


    # STEP 5


    ```

    sudo apt-get install build-essential checkinstall

    sudo apt-get install libssl-dev liblz2-dev

    libncurses5-dev libssl-dev libgdbm libsqlite3-dev tk-dev

    libtcl-dev-dev libbz2-dev libg2z2-dev

    ```


    ![](img/4aefeb2d095f688b34af6207870c5f39_10_1.png)


    # STEP 6


    Open up your Linux web browser and go to the Python download page: www.python.org/downloads.
    Click on Downloads followed by the button under the Python Source window. This
    opens a download dialogue box; choose a location and start the download process.


    ![](img/4aefeb2d095f688b34af6207870c5f39_10_2.png)


    # STEP 7


    In the Terminal, go the Downloads folder by entering cd Downloads/. Then unzip
    the contents of the downloaded Python source code with tar -xvf Python-3.Y.Y.tar.xz
    replacing the Y''s with the version numbers you''ve downloaded. Now enter the
    newly unzipped folder with cd Python-3.Y.Y/.


    ![](img/4aefeb2d095f688b34af6207870c5f39_10_3.png)


    # STEP 8


    Within the Python folder, enter:


    ```

    ./configure

    sudo make altinstall

    ```


    This could take a while depending on the speed of your computer. Once finished,
    enter python3.7 --version to check the installed latest version. You now have
    Python 3.7 installed, alongside older Python 3.x.x and Python 2.


    ![](img/4aefeb2d095f688b34af6207870c5f39_10_4.png)


    # STEP 9


    For the GUI IDLE, you need to enter the following command into the Terminal:


    ```

    sudo apt-get install idle3

    ```


    The IDLE can then be started with the command idle3. Note that IDLE runs a different
    version from the one you installed from source.


    ![](img/4aefeb2d095f688b34af6207870c5f39_10_5.png)


    # STEP 10


    You also need PIP (Pip Installs Packages) which is a tool to help you install
    more modules and extras.


    Enter: sudo apt-get install python3-pip


    When PIP is installed, check for the latest update with: pip3 install --upgrade
    pip


    When complete, close the Terminal and Python 3.x will be available via the Programming
    section in your distro''s menu.


    ![](img/4aefeb2d095f688b34af6207870c5f39_10_6.png)'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# # Starting Python for the First Time


    If you''re using the new Raspberry Pi together with its latest release of the
    Pi OS, then you will need to manually install the Python IDLE. This is due to
    the Pi team removing the core Python IDLE in favour of their own coding text editor.


    # ## STARTING PYTHON


    For those using the Pi4 and new Raspbian, drop into a Terminal and enter: `sudo
    apt-get install idle3.` Older versions of Raspbian already have the official Python
    IDLE pre-installed.


    # **STEP 1**


    With the Raspbian desktop loaded, click on the Menu button followed by Programming
    > Python 3 (IDLE). This opens the Python 3 Shell. Windows and Mac users can find
    the Python 3 IDLE Shell from within the Windows Start button menu and via Finder.


    ![](img/4aefeb2d095f688b34af6207870c5f39_11_0.png)


    # **STEP 2**


    The Shell is where you can enter code and see the responses and output of code
    you''ve programmed into Python. This is a kind of sandbox, where you''re able
    to try out some simple code and processes.


    ![](img/4aefeb2d095f688b34af6207870c5f39_11_1.png)


    # **STEP 3**


    For example, in the Shell enter: `2+2`. After pressing Enter, the next line displays
    the answer: 4. Basically, Python has taken the ‘code’ and produced the relevant
    output.


    ![](img/4aefeb2d095f688b34af6207870c5f39_11_2.png)


    # **STEP 4**


    The Python Shell acts very much like a calculator, since code is basically a series
    of mathematical interactions with the system. Integers, which are the infinite
    sequence of whole numbers can easily be added, subtracted, multiplied and so on.


    ![](img/4aefeb2d095f688b34af6207870c5f39_11_3.png)'
  merge: -1
  img_proc: true
