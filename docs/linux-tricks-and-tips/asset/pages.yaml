- pgno: 52
  md: "# # Variables\n\n**STEP 5** You can assign a value to a variable as soon as\
    \ you declare it. The code you’ve typed in could look like this, instead:\n\n\
    ```\n```\nint a = 10;\nint b = 5;\nint result = a + b;\n\n\ncout << result;\n\
    ```\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_52_0.png)\n\n**STEP 6** Specific\
    \ to C++, you can also use the following to assign values to a variable as soon\
    \ as you declare them:\n\n```\n```\nint a (10);\nint b (5);\n\nThen, from the\
    \ C++ 2011 standard, using curly brackets:\n\nint result {a+b};\n```\n```\n\n\
    ![](img/4aefeb2d095f688b34af6207870c5f39_52_1.png)\n\n**STEP 7** You can create\
    \ global variables, which are variables that are declared outside any function\
    \ and used in any function within the entire code. What you’ve used so far are\
    \ local variables: variables used inside the function. For example:\n\n```\n```\n\
    #include <iostream>\nusing namespace std;\nint StartLives = 3;\n\nint main()\n\
    {\n\tstartLives = StartLives - 1;\n\tcout << StartLives;\n}\n```\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_52_2.png)\n\
    \n**STEP 8** The previous step creates the variable StartLives, which is a global\
    \ variable. In a game, for example, a player’s lives go up or down depending on\
    \ how well or how bad they’re doing. When the player restarts the game, the StartLives\
    \ returns to its default state: 3. Here we’ve assigned 3 lives, then subtracted\
    \ 1, leaving 2 lives left.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_52_3.png)\n\
    \n**STEP 9** The modern C++ compiler is far more intelligent than most programmers\
    \ give it credit. While there are numerous data types you can declare for variables,\
    \ in fact use the auto feature:\n\n```\n```\n#include <iostream>\nusing namespace\
    \ std;\nauto pi = 3.141593;\n\nint main()\n{\n\tdouble area, radius = 1.5;\n\t\
    area = pi * radius * radius;\n\tcout << area;\n}\n```\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_52_4.png)\n\
    \n**STEP 10** Although we said to ignore the warnings in Step 3, there’s a difference\
    \ between a warning and an error. In this case, it’s just a simple warning. The\
    \ new data type, double, means double-precision floating point value, which makes\
    \ the code more accurate. The result should be 7.06858. Essentially, you can often\
    \ work with a warning but not an error.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_52_5.png)"
  merge: -1
  img_proc: true
- pgno: 53
  md: "# # Data Types\n\nVariables, as you’ve seen, store information that the programmer\
    \ can then later call up, and manipulate if required. Variables are simply reserved\
    \ memory locations that store the values the programmer assigns, depending on\
    \ the data type used.\n\n# ## THE VALUE OF DATA\n\nThere are many different data\
    \ types available for the programmer in C++, such as an integer, floating point,\
    \ Boolean, character and so on. It’s widely accepted that there are seven basic\
    \ data types, often called Primitive Built-in Types; however, you can create your\
    \ own data types should the need ever arise within your code.\n\n| Type | Command\
    \ |\n|---|---|\n| Integer | int |\n| Floating Point | float |\n| Character | char\
    \ |\n| Boolean | bool |\n| Double Floating Point | double |\n| Wide Character\
    \ | wchar_t |\n| No Value | void |\n\nThese basic types can also be extended using\
    \ the following modifiers: Long, Short, Signed and Unsigned. Basically this means\
    \ the modifiers can expand the minimum and maximum range values for each data\
    \ type. For example, the int data type has a default value range of -2147483648\
    \ to 2147483647, a fair value, you would agree.\n\nNow, if you were to use one\
    \ of the modifiers, the range alters:\n\n+   - Unsigned int = 0 to 4294967295\n\
    +   - Signed int = -2147483648 to 2147483647\n+   - Short int = -32768 to 32767\n\
    +   - Unsigned Short int = 0 to 65,535\n+   - Signed Short int = -32768 to 32767\n\
    +   - Long int = -2147483647 to 2147483647\n+   - Signed Long int = -2147483647\
    \ to 2147483647\n+   - Unsigned Long int = 0 to 4294967295\n\nNaturally you can\
    \ get away with using the basic type without the modifier, as there’s plenty of\
    \ range provided with each data type. However, it’s considered good C++ programming\
    \ practise to use the modifiers when possible.\n\nThere are issues when using\
    \ the modifiers though. Double represents a double-floating point value, which\
    \ you can use for incredibly accurate numbers but those numbers are only accurate\
    \ up to the fifteenth decimal place. There’s also the problem when displaying\
    \ such numbers in C++ using the cout function, in that cout by default only outputs\
    \ the first five decimal places. You can combat that by adding a cout.precision()\
    \ function and adding a value inside the brackets but even then you’re still limited\
    \ by the accuracy of the double data type. For example, try this code:\n\n```\n\
    ```c++\n#include <iostream>\nusing namespace std;\ndouble PI = 3.141592653589793238463;\n\
    \nint main()\n{\n    cout << PI;\n}\n```\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_53_0.png)\n\
    \nBuild and run the code and as you can see the output is only 3.14159, representing\
    \ cout’s limitations in this example.\n\nYou can alter the code including the\
    \ aforementioned cout.precision function, for greater accuracy. Take precision\
    \ all the way up to 22 decimal places, with the following code:\n\n```\n```c++\n\
    #include <iostream>\nusing namespace std;\ndouble PI = 3.141592653589793238463;\n\
    \nint main()\n{\n    cout.precision(22);\n    cout << PI;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 54
  md: "This is mainly due to the conversion from binary in the compiler and that the\
    \ IEEE 754 double precision standard occupies 64-bits of data, of which 52-bits\
    \ are dedicated to the significant (the significant digits in a floating-point\
    \ number) and roughly 3.5-bits are taken holding the values 0 to 9. If you divide\
    \ 53 by 3.5, then you arrive at 15.142857 recurring, which is 15-digits of precision.\n\
    \nTo be honest, if you’re creating code that needs to be accurate to more than\
    \ fifteen decimal places, then you wouldn’t be using C++, you would use some scientific\
    \ specific language with C++ as the connective tissue between the two languages.\n\
    \nYou can create your own data types, using an alias-like system called typedef.\
    \ For example:\n\n```\n#include <iostream>\nusing namespace std;\ntypedef int\
    \ metres;\n\nint main()\n{\n    metres distance;\n    distance = 15;\n    cout\
    \ << \"distance in metres is: \" << distance;\n}\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_54_0.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_54_1.png)\n\nThis code when executed\
    \ creates a new int data type called metres. Then, in the main code block, there’s\
    \ a new variable called distance, which is an integer; so you’re telling the compiler\
    \ that there’s another name for int. We assigned the value 15 to distance and\
    \ displayed the output: distance in metres is 15.\n\nIt might sound a little confusing\
    \ to begin with but the more you use C++ and create your own code, the easier\
    \ it becomes.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_54_2.png)\n\n![](img/4aefeb2d095f688b34af6207870c5f39_54_3.png)\n\
    \nAgain, build and run the code; as you can see from the command line window,\
    \ the number represented by the variable PI is different to the number you’ve\
    \ told C++ to use in the variable. The output reads the value of PI as 3.141592653589793115998,\
    \ with the numbers going awry from the fifteenth decimal place.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_54_4.png)"
  merge: -1
  img_proc: true
- pgno: 55
  md: "# # Strings\n\nStrings are objects that represent and hold sequences of characters.\
    \ For example, you could have a universal greeting in your code ‘Welcome’ and\
    \ assign that as a string to be called up wherever you like in the program.\n\n\
    # ## STRING THEORY\n\nThere are different ways in which you can create a string\
    \ of characters, which historically are all carried over from the original C language\
    \ and still supported by C++.\n\n+   **STEP 1**\n+   \n+   To create a string,\
    \ you use the char function. Open a new C++ file and begin with the usual header:\n\
    +   \n+   ```\n+   #include <iostream>\n+   using namespace std;\n+   \n+   int\
    \ main ()\n+   {\n+   }\n+   ```\n+   \n+   strings.cpp\n+   1. #include <iostream>\n\
    +   2. using namespace std;\n+   3.\n+   4. int main()\n+   5. {\n+   6. \n+ \
    \  7. \n+   8. }\n+   \n\n+   **STEP 2**\n+   \n+   It’s easy to confuse a string\
    \ with an array. Here’s an array, which can be terminated with a null character:\n\
    +   \n+   ```\n+   #include <iostream>\n+   using namespace std;\n+   \n+   int\
    \ main ()\n+   {\n+       char greet[8] = {'W', 'e', 'l', 'c', 'o', 'm', 'e',\
    \ '\\0'};\n+       cout << greet << \"\\n\";\n+   }\n+   ```\n+   \n+   strings.cpp\n\
    +   1. #include <iostream>\n+   2. using namespace std;\n+   3.\n+   4. int main()\n\
    +   5. {\n+   6.    char greet[8] = {'W', 'e', 'l', 'c', 'o', 'm', 'e', '\\0'};\n\
    +   7.    cout << greet << \"\\n\";\n+   8. }\n+   \n\n+   **STEP 3**\n+   \n\
    +   Build and run the code and ‘Welcome’ appears on the screen. While this is\
    \ perfectly fine, it’s not a string. A string is a class, which defines objects\
    \ that can be represented as a stream of characters and doesn’t need to be terminated\
    \ like an array. The code can therefore be represented as:\n+   \n+   ```\n+ \
    \  #include <iostream>\n+   using namespace std;\n+   \n+   int main ()\n+   {\n\
    +       char greet[] = \"Welcome\";\n+       cout << greet << \"\\n\";\n+   }\n\
    +   ```\n+   \n+   strings.cpp\n+   1. #include <iostream>\n+   2. using namespace\
    \ std;\n+   3.\n+   4. int main()\n+   5. {\n+   6.    char greet[] = \"Welcome\"\
    ;\n+   7.    cout << greet << \"\\n\";\n+   8. \n+   9. \n+   10. }\n+   \n\n\
    +   **STEP 4**\n+   \n+   In C++ there’s also a string function, which works in\
    \ much the same way. Using the greeting code again, you can enter:\n+   \n+  \
    \ ```\n+   #include <iostream>\n+   using namespace std;\n+   \n+   int main ()\n\
    +   {\n+       string greet = \"Welcome\";\n+       cout << greet << \"\\n\";\n\
    +   }\n+   ```\n+   \n+   strings.cpp\n+   1. #include <iostream>\n+   2. using\
    \ namespace std;\n+   3.\n+   4. int main()\n+   5. {\n+   6.    string greet\
    \ = \"Welcome\";\n+   7.    cout << greet << \"\\n\";\n+   8. \n+   9. \n+   10.\
    \ }\n+"
  merge: -1
