  md: "# User Interaction\n\nThere's nothing quite as satisfying as creating a program\
    \ that responds to you. This basic user interaction is one of the most taught\
    \ aspects of any language and with it you're able to do much more than simply\
    \ greet the user by name.\n\n# HELLO, DAVE\n\nYou have already used cout, the\
    \ standard output stream, throughout our code. Now you're going to be using cin,\
    \ the standard input stream, to prompt a user response.\n\n+   STEP 1 \n+    Anything\
    \ that you want the user to input into the program needs to be stored somewhere\
    \ in the system memory, so it can be retrieved and used. Therefore, any input\
    \ must first be declared as a variable, so it's ready to be used by the user.\
    \ Start by creating a blank C++ file with headers.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_59_0.png)\n\
    \n+   STEP 2 \n+    The data type of the variable must also match the type of\
    \ input you want from the user. For example, to ask a user their age, you would\
    \ use an integer like this:\n+   \n+   `#include <iostream>`\n+   `using namespace\
    \ std;`\n+   `int main ()`\n+   `{\n+    int age;\n+    cout << \"What is your\
    \ age: \";\n+    cin >> age;\n+   \n+    cout << \"\\nYou are \" << age << \"\
    \ years old.\\n\";\n+   `}`\n\n![](img/4aefeb2d095f688b34af6207870c5f39_59_1.png)\n\
    \n+   STEP 3 \n+    The cin command works in the opposite way from the cout command.\
    \ With the first cout line you're outputting \"What is your age?\" to the screen,\
    \ as indicated by the chevrons. Cin uses opposite facing chevrons, indicating\
    \ an input. The input is put into the integer age and called up in the second\
    \ cout command. Build and run the code.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_59_2.png)\n\
    \n+   STEP 4 \n+    If you're asking a question, you need to store the input as\
    \ a string. To ask the user their name, you would use:\n+   \n+   `#include <iostream>`\n\
    +   `using namespace std;`\n+   `int main ()`\n+   `{\n+    string name;\n+  \
    \  cout << \"What is your name: \";\n+    cin >> name;\n+   \n+    cout << \"\\\
    nHello, \" << name << \". I hope you're well today?\\n\";\n+   `}`\n\n![](img/4aefeb2d095f688b34af6207870c5f39_59_3.png)"
  merge: -1
  img_proc: true
- pgno: 60
  md: "**STEP 5** The principal works the same as the previous code. The user’s input,\
    \ their name, is stored in a string, because it contains multiple characters,\
    \ and retrieved in the second cout line. As long as the variable `name` doesn’t\
    \ change, then you can recall it wherever you like in your code.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_60_0.png)\n\
    \n**STEP 6** You can chain input requests to the user but just make sure you have\
    \ a valid variable to store the input to begin with. Let’s assume you want the\
    \ user to enter two whole numbers:\n\n```\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main ()\n{\n    int num1, num2;\n    \n    cout << \"\
    Enter two whole numbers: \";\n    cin >> num1 >> num2;\n    \n    cout << \"You\
    \ entered \" << num1 << \" and \" << num2 << \"\\n\";\n}\n```\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_60_1.png)\n\
    \n**STEP 7** Likewise, inputted data can be manipulated once you have it stored\
    \ in a variable. For instance, ask the user for two numbers and do some maths\
    \ on them:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main\
    \ ()\n{\n    float num1, num2;\n    \n    cout << \"Enter two numbers: \\n\";\n\
    \    cin >> num1 >> num2;\n    \n    cout << num1 << \" + \" << num2 << \" is:\
    \ \" << num1 + num2 << \"\\n\";\n}\n```\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_60_2.png)\n\
    \n**STEP 8** While `cin` works well for most input tasks, it does have a limitation.\
    \ `Cin` always considers spaces as a terminator, so it’s designed for just single\
    \ words not multiple words. However, `getline` takes `cin` as the first argument\
    \ and the variable as the second:\n\n```\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    string mystr;\n    \n    cout << \"Enter a sentence:\
    \ \\n\";\n    getline(cin, mystr);\n    \n    cout << \"Your sentence is: \" <<\
    \ mystr.size() << \" characters long.\\n\";\n}\n```\n```\n\n**STEP 9** Build and\
    \ execute the code, then enter a sentence with spaces. When you’re done the code\
    \ reads the number of characters. If you remove the `getline` and replace it with\
    \ `cin >> mystr` and try again, the result displays the number of characters up\
    \ to the first space.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_60_3.png)\n\n\
    **STEP 10** `Getline` is usually a command that new C++ programmers forget to\
    \ include. The terminating white space is annoying when you can’t figure out why\
    \ your code isn’t working. In short, it’s best to use `getline(cin, variable)`\
    \ in future:\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint\
    \ main ()\n{\n    string name;\n    \n    cout << \"Enter your full name: \\n\"\
    ;\n    getline(cin, name);\n    \n    cout << \"\\nHello, \" << name << \"\\n\"\
    ;\n}\n```\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_60_4.png)"
  merge: -1
  img_proc: true
- pgno: 61
  md: '# The Hobbit


    **DID YOU KNOW...** released in 1982 for various platforms, Melbourne House’s
    The Hobbit was a coding work of genius. Developed by Philip Mitchell and Dr. Veronika
    Megler, The Hobbit was uniquely coded using a parser called ‘Inglish’ which allowed
    the player to enter full sentences, such as “Take sword from Gandalf, and kill
    goblin with it.”


    Furthermore, each object in the game had a specific size, weight and solidity;
    so if you sat on a stool, and someone picked up the stool or threw it, then your


    character would be taken along with it. Also, in early versions of the game, the
    non-playing characters would often move around the map and capture and kill each
    other before the player had even reached that stage in the game. There was even
    a randomiser event in place with each start of the game, where any character could
    pick up a random object from any location. This meant that, potentially, it was
    possible for Thorin to pick you up and carry you for the entire adventure. Remarkable
    for a game that took up less than 38KB of memory.


    ![](img/4aefeb2d095f688b34af6207870c5f39_61_0.png)'
  merge: -1
  img_proc: true
