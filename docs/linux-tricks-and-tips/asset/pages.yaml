- pgno: 63
  md: "# Common Coding Mistakes\n\nWhen you start something new you're inevitably\
    \ going to make mistakes, this is purely down to inexperience and those mistakes\
    \ are great teachers in themselves. However, even experts make the occasional\
    \ mishap. Thing is, to learn from them as best you can.\n\n# X=MISTAKE, PRINT\
    \ Y\n\nThere are many pitfalls for the programmer to be aware of, far too many\
    \ to be listed here. Being able to recognise a mistake and fix it is when you\
    \ start to move into more advanced territory, and become a better coder. Everyone\
    \ makes mistakes, even coders with over thirty years' experience. Learning from\
    \ these basic, common mistakes help build a better coding foundation.\n\n# SMALL\
    \ CHUNKS\n\nIt would be wonderful to be able to work like Neo from The Matrix\
    \ movies. Simply ask, your operator loads it into your memory and you instantly\
    \ know everything about the subject. Sadly though, we can't do that. The first\
    \ major pitfall is someone trying to learn too much, too quickly. So take coding\
    \ in small pieces and take your time.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_63_0.png)\n\
    \n# EASY VARIABLES\n\nMeaningful naming for variables is a must to eliminate common\
    \ coding mistakes. Having letters of the alphabet is fine but what happens when\
    \ the code states there's a problem with x variable. It's not too difficult to\
    \ name variables lives, money, player1 and so on.\n\n```\n1\tvar points = 1023;\n\
    2\tvar lives = 3;\n3\tvar totalTime = 45;\n4\twrite(\"Points: \"+points);\n5\t\
    write(\"Lives: \"+lives);\n6\twrite(\"Total Time: \"+totalTime+\" secs\");\n7\t\
    write(\"--------------------------------\");\n8\tvar totalScore = 0;\n9\twrite(\"\
    Your total Score is: \"+totalScore);\n```\n\n# //COMMENTS\n\nUse comments. It's\
    \ a simple concept but commenting on your code saves so many problems when you\
    \ next come to look over it. Inserting comment lines helps you quickly sift through\
    \ the sections of code that are causing problems; also useful if you need to review\
    \ an older piece of code.\n\n```\n52\t\toirg am 2;\n53\t\ttarget = 2;\n54\t\t\
    --Fj\n55\t\n56\t#endif\n57\tif (m == 0)\n58\t\treturn;\n59\t\n60\t//\n61\t// Loop\
    \ unrolling.  Here be dragons.\n62\t//\n63\t\n64\t// (n & (~3)) is the greatest\
    \ multiple of 4 le\n65\t// in the while loop ahead, orig will move ov\n66\t//\
    \ increments (4 elements of 2 bytes).\n67\t// end makes our barrier for not falling\
    \ out\n68\tchar const * const end = orig + 2 * (n & (~3)\n69\t\n70\t// See if\
    \ we're aligned for writing in 64 o\n71\t#if ARCH_SIZEOF_LONG == 8 & \\\n72\t\t\
    ((defined( x_amd64 ) || defined( x_86_64\n```\n\n# PLAN AHEAD\n\nWhile it's great\
    \ to wake up one morning and decide to code a classic text adventure, it's not\
    \ always practical without a good plan. Small snippets of code can be written\
    \ without too much thought and planning but longer and more in-depth code requires\
    \ a good working plan to stick to and help iron out the bugs.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_63_1.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_63_2.png)"
