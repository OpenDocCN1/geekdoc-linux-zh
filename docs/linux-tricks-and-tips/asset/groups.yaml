    \ 的用户，进入终端并输入：`sudo apt-get install idle3`。旧版本的 Raspbian 已预装官方 Python IDLE。\n\n\
    - **步骤 1**\n\n加载 Raspbian 桌面后，点击 Menu 按钮，然后选择 Programming > Python 3 (IDLE)。这将打开\
    \ Python 3 Shell。Windows 和 Mac 用户可以在 Windows 开始按钮菜单内以及通过 Finder 找到 Python 3 IDLE\
    \ Shell。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_11_0.png)\n\n- **步骤 2**\n\
    \nShell 是你可以输入代码并查看代码响应和输出的地方。这是一种沙箱，你可以在此尝试一些简单的代码和过程。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_11_1.png)\n\
    \n- **步骤 3**\n\n例如，在 Shell 中输入：`2+2`。按下回车后，下一行将显示答案：4。基本上，Python 接受了“代码”并产生了相关的输出。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_11_2.png)\n\n- **步骤 4**\n\nPython Shell\
    \ 的行为非常像计算器，因为代码基本上是与系统的一系列数学交互。整数（无限序列的整数）可以轻松地相加、相减、相乘等。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_11_3.png)\n\
    \n- **步骤 5**\n\n虽然这很有趣，但并不特别令人兴奋。相反，请尝试这个：\n\n`print(\"Hello everyone!\")`\n\n\
    只需像前几步一样将其输入到 IDLE 中即可。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_12_0.png)\n\
    \n- **步骤 6**\n\n这更有意思，因为你刚刚编写了第一段代码。Print 命令相当直观，它打印内容。Python 3 需要括号和引号才能将内容输出到屏幕，在本例中是\
    \ `Hello everyone!` 部分。\n\n```python\n>>> print(\"Hello everyone!\")\nHello everyone!\n\
    >>> \n```\n\n- **步骤 7**\n\n你可能已经注意到 Python IDLE 内的颜色编码。这些颜色代表 Python 代码的不同元素。它们如下：\n\
    \n黑色 – 数据和变量  \n绿色 – 字符串  \n紫色 – 函数  \n橙色 – 命令  \n蓝色 – 用户函数  \n深红色 – 注释  \n浅红色\
    \ – 错误消息\n\n#### IDLE 颜色编码\n\n| 颜色 | 用途 | 示例 |\n| :--- | :--- | :--- |\n| 黑色 |\
    \ 数据与变量 | `23 . 6` `<area` |\n| 绿色 | 字符串 | `\"Hello World\"` |\n| 紫色 | 函数 | `len()\
    \ print()` |\n| 橙色 | 命令 | `if for else` |\n| 蓝色 | 用户函数 | `get_area()` |\n| 深红色\
    \ | 注释 | `#Remember VAT` |\n| 浅红色 | 错误消息 | `SyntaxError:` |\n\n- **步骤 8**\n\n\
    Python IDLE 是一个可配置的环境。如果你不喜欢颜色表示的方式，你始终可以通过 Options > Configure IDLE 并点击 Highlighting\
    \ 选项卡来更改它们。然而，我们不建议你这样做，因为你看到的效果将与我们截图中的不同。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_12_1.png)\n\
    \n- **步骤 9**\n\n与大多数可用的程序一样，无论操作系统如何，都有许多快捷键可用。这里没有空间列出所有快捷键，但在 Options > Configure\
    \ IDLE 的 Keys 选项卡下，你可以看到当前绑定列表。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_12_2.png)\n\
    \n- **步骤 10**\n\nPython IDLE 是一个强大的接口，实际上是用 Python 编写的，使用了可用的 GUI 工具包之一。如果你想知道\
