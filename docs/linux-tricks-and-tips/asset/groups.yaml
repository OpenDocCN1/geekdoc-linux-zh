  - "[PAGE 13]\n\n# # Your First Code\n\nEssentially, you’ve already written your\
    \ first piece of code with the `print(“Hello everyone!”)` function from the previous\
    \ tutorial. However, let’s expand that and look at entering your code and playing\
    \ around with some other Python examples.\n\n# ## PLAYING WITH PYTHON\n\nWith\
    \ most languages, computer or human, it’s all about remembering and applying the\
    \ right words to the right situation. You’re not born knowing these words, so\
    \ you need to learn them.\n\n+   **STEP 1**\n+   If you’ve closed Python 3 IDLE,\
    \ reopen it in whichever operating system version you prefer. In the Shell, enter\
    \ the familiar following:\n+   \n+   `print(\"Hello\")`\n\n![](img/4aefeb2d095f688b34af6207870c5f39_13_0.png)\n\
    \n+   **STEP 3**\n+   You can see that instead of the number 4, the output is\
    \ the `2+2` you asked to be printed to the screen. The quotation marks are defining\
    \ what’s being outputted to the IDLE Shell; to print the total of 2+2 you need\
    \ to remove the quotes:\n+   \n+   `print(2+2)`\n\n![](img/4aefeb2d095f688b34af6207870c5f39_13_1.png)\n\
    \n+   **STEP 2**\n+   Just as predicted, the word Hello appears in the Shell as\
    \ blue text, indicating output from a string. It’s fairly straightforward and\
    \ doesn’t require too much explanation. Now try:\n+   \n+   `print(\"2+2\")`\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_13_2.png)\n\n+   **STEP 4**\n+   You\
    \ can continue as such, printing `2+2`, `464+2343` and so on to the Shell. An\
    \ easier way is to use a variable, which is something we will cover in more depth\
    \ later. For now, enter:\n+   \n+   `a=2`\n+   `b=2`\n\n![](img/4aefeb2d095f688b34af6207870c5f39_13_3.png)"
  - '[PAGE 14]


    # **STEP 5**


    What you have done here is assign the letters a and b two values: 2 and 2. These
    are now variables, which can be called upon by Python to output, add, subtract,
    divide and so on for as long as their numbers stay the same. Try this:


    ```

    print(a)

    print(b)

    ```


    ![](img/4aefeb2d095f688b34af6207870c5f39_14_0.png)


    # **STEP 6**


    The output of the last step displays the current values of both a and b individually,
    as you''ve asked them to be printed separately. If you want to add them up, you
    can use the following:


    ```

    print(a+b)

    ```


    This code simply takes the values of a and b, adds them together and outputs the
    result.


    ![](img/4aefeb2d095f688b34af6207870c5f39_14_1.png)


    # **STEP 7**


    You can play around with different kinds of variables and the Print function.
    For example, you could assign variables for someone''s name:


    ```

    name="David"

    print(name)

    ```


    ![](img/4aefeb2d095f688b34af6207870c5f39_14_2.png)


    # **STEP 8**


    Now let''s add a surname:


    ```

    surname="Hayward"

    print(surname)

    ```


    You now have two variables containing a first name and a surname and you can print
    them independently.


    ![](img/4aefeb2d095f688b34af6207870c5f39_14_3.png)


    # **STEP 9**


    If we were to apply the same routine as before, using the + symbol, the name wouldn''t
    appear correctly in the output in the Shell. Try it:


    ```

    print(name+surname)

    ```


    You need a space between the two, defining them as two separate values and not
    something you mathematically play around with.


    ![](img/4aefeb2d095f688b34af6207870c5f39_14_4.png)


    # **STEP 10**


    In Python 3 you can separate the two variables with a space using a comma:


    ```

    print(name, surname)

    ```


    Alternatively, you can add the space yourself:


    ```

    print(name+" "+surname)

    ```


    The use of the comma is much neater, as you can see. Congratulations, you''ve
    just taken your first steps into the wide world of Python.


    ![](img/4aefeb2d095f688b34af6207870c5f39_14_5.png)'
  - '[PAGE 15]


    # Saving and Executing

    Your Code


    While working in the IDLE Shell is perfectly fine for small code snippets, it’s
    not designed for entering longer program listings. In this section you’re going
    to be introduced to the IDLE Editor, where you will be working from now on.


    # EDITING CODE


    You will eventually reach a point where you have to move on from inputting single
    lines of code into the Shell. Instead, the IDLE Editor will allow you to save
    and execute your Python code.


    +   **STEP 1**

    +   First, open the Python IDLE Shell and when it’s up, click on File > New File.
    This will open a new window with Untitled as its name. This is the Python IDLE
    Editor and within it you can enter the code needed to create your future programs.


    +   **STEP 2**

    +   The IDLE Editor is, for all intents and purposes, a simple text editor with
    Python features, colour coding and so on, much in the same vein as Sublime. You
    enter code as you would within the Shell, so taking an example from the previous
    tutorial, enter:

    +   `print("Hello everyone!")`


    +   **STEP 3**

    +   You can see that the same colour coding is in place in the IDLE Editor as
    it is in the Shell, enabling you to better understand what’s going on with your
    code. However, to execute the code you need to first save it. Press F5 and you
    get a Save...Check box open.


