    # # Your First C++ Program


    The Raspberry Pi makes for a great coding base on which to learn C++. You won’t
    need any complicated, third-party IDEs or to install any extra components. Everything
    you need to get started is already built into the Pi.


    # HELLO, WORLD!


    It’s traditional in programming for the first code to be entered to output the
    words ‘Hello, World!’ to the screen. Interestingly, this dates back to 1968 using
    a language called BCPL.


    **STEP 1** You can use the included Geany Programmer’s Editor to write, compile
    and execute your C++ code on the Raspberry Pi. You can find Geany as the first
    entry in the Programming section from the main Raspberry Pi menu. Click the Geany
    icon to open and start coding.


    ![](img/4aefeb2d095f688b34af6207870c5f39_41_0.png)


    **STEP 3** It doesn’t look much at the moment but you can get into what the C++
    header commands mean in due course. Geany uses syntax highlighting, meaning it
    colour-codes the code depending on the lodinge. To activate this, save the code
    by clicking on File > Save As. Now name the code helloworld.cpp and click the
    Save button.


    ![](img/4aefeb2d095f688b34af6207870c5f39_41_1.png)


    **STEP 2** The Geany editor is quite powerful while still being easy to use. All
    the code you enter shows in the main window and is numbered to help you keep track
    of your code. For now, in line 1, enter:

    `#include <iostream>`


    ![](img/4aefeb2d095f688b34af6207870c5f39_41_2.png)


    **STEP 4** The colour coding helps a lot when you coding. Now press Enter and
    start a new command on line 3. Enter the following:

    `int main()`

    Note: there’s no space between the brackets.


    ![](img/4aefeb2d095f688b34af6207870c5f39_41_3.png)'
