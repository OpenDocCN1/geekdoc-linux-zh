  - "[PAGE 59]\n\n# User Interaction\n\nThere's nothing quite as satisfying as creating\
    \ a program that responds to you. This basic user interaction is one of the most\
    \ taught aspects of any language and with it you're able to do much more than\
    \ simply greet the user by name.\n\n# HELLO, DAVE\n\nYou have already used cout,\
    \ the standard output stream, throughout our code. Now you're going to be using\
    \ cin, the standard input stream, to prompt a user response.\n\n+   STEP 1 \n\
    +    Anything that you want the user to input into the program needs to be stored\
    \ somewhere in the system memory, so it can be retrieved and used. Therefore,\
    \ any input must first be declared as a variable, so it's ready to be used by\
    \ the user. Start by creating a blank C++ file with headers.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_59_0.png)\n\
    \n+   STEP 2 \n+    The data type of the variable must also match the type of\
    \ input you want from the user. For example, to ask a user their age, you would\
    \ use an integer like this:\n+   \n+   `#include <iostream>`\n+   `using namespace\
    \ std;`\n+   `int main ()`\n+   `{\n+    int age;\n+    cout << \"What is your\
