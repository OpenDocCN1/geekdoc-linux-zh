  md: "\n## User Input\n\nWe've seen some basic user interaction with the code from\
    \ a few of the examples earlier, so now would be a good time to focus solely on\
    \ how you would get information from the user then store and present it.\n\n###\
    \ USER FRIENDLY\n\nThe type of input you want from the user will depend greatly\
    \ on the type of program you're coding. For example, a game may ask for a character's\
    \ name, whereas a database can ask for personal details.\n\n- **STEP 1**\n\n \
    \ If it's not already, open the Python 3 IDLE Shell, and start a New File in the\
    \ Editor. Let's begin with something really simple, enter:\n\n  ```python\n  print(\"\
    Hello\")\n  firstname=input(\"What is your first name? \")\n  print(\"Thanks.\"\
    )\n  surname=input(\"And what is your surname? \")\n  ```\n\n- **STEP 2**\n\n\
    \  Save and execute the code, and as you already no doubt suspected, in the IDLE\
    \ Shell the program will ask for your first name, storing it as the variable *firstname*,\
    \ followed by your surname; also stored in its own variable (*surname*).\n\n-\
    \ **STEP 3**\n\n  Now that we have the user's name stored in a couple of variables\
    \ we can call them up whenever we want:\n\n  ```python\n  print(\"Welcome\", firstname,\
    \ surname, \" I hope\n  you're well today.\")\n  ```\n\n- **STEP 4**\n\n  Run\
    \ the code and you can see a slight issue, the full stop after the surname follows\
    \ a blank space. To eliminate that we can add a plus sign instead of the comma\
    \ in the code:\n\n  ```python\n  print(\"Welcome\", firstname, surname+\" I hope\n\
    \  you're well today.\")\n  ```\n\n- **STEP 5**\n\n  You don’t always have to\
    \ include quoted text within the input command. For example, you can ask the user\
    \ their name, and have the input in the line below:\n\n  ```python\n  print(\"\
    Hello. What’s your name?\")\n  name=input()\n  ```\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_28_0.png)\n\
    \n- **STEP 6**\n\n  The code from the previous step is often regarded as being\
    \ a little neater than having a lengthy amount of text in the input command, but\
    \ it’s not a rule that’s set in stone, so do as you like in these situations.\
    \ Expanding on the code, try this:\n\n  ```python\n  print(\"Halt! Who goes there?\"\
    )\n  name=input()\n  ```\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_28_1.png)\n\
    \n- **STEP 7**\n\n  It’s a good start to a text adventure game, perhaps? Now you\
    \ can expand on it and use the raw input from the user to flesh out the game a\
    \ little:\n\n  ```python\n  if name==\"David\":\n      print(\"Welcome, good sir.\
    \ You may pass.\")\n  else:\n      print(\"I know you not. Prepare for battle!\"\
    )\n  ```\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_28_2.png)\n\n- **STEP 8**\n\
    \n  What you’ve created here is a condition, which we will cover soon. In short,\
    \ we’re using the input from the user and measuring it against a condition. So,\
    \ if the user enters David as their name, the guard will allow them to pass unhindered.\
    \ Else, if they enter a name other than David, the guard challenges them to a\
    \ fight.\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_28_3.png)\n\n- **STEP 9**\n\
    \n  Just as you learned previously, any input from a user is automatically a string,\
    \ so you need to apply a TypeCast in order to turn it into something else. This\
    \ creates some interesting additions to the input command. For example:\n\n  ```python\n\
    \  # Code to calculate rate and distance\n  print(\"Input a rate and a distance\"\
    )\n  rate = float(input(\"Rate: \"))\n  ```\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_28_4.png)\n\
    \n- **STEP 10**\n\n  To finalise the rate and distance code, we can add:\n\n \
    \ ```python\n  distance = float(input(\"Distance: \"))\n  print(\"Time:\", (distance\
    \ / rate))\n  ```\n\n  Save and execute the code and enter some numbers. Using\
    \ the float(input element, we’ve told Python that anything entered is a floating\
    \ point number rather than a string.\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_28_5.png)\n\
    \n## Creating Functions\n\nNow that you’ve mastered the use of variables and user\
    \ input, the next step is to tackle functions. You’ve already used a few functions,\
    \ such as the print command but Python enables you to define your own functions.\n\
    \n### FUNKY FUNCTIONS\n\nA function is a command that you enter into Python to\
    \ do something. It’s a little piece of self-contained code that takes data, works\
    \ on it and then returns the result.\n\n- **STEP 1** It’s not just data that a\
    \ function works on. They can do all manner of useful things in Python, such as\
    \ sort data, change items from one format to another and check the length or type\
    \ of items. Basically, a function is a short word that’s followed by brackets.\
    \ For example, `len()`, `list()` or `type()`.\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_29_0.png)\n\
    \n- **STEP 2** A function takes data, usually a variable, works on it depending\
    \ on what the function is programmed to do and returns the end value. The data\
    \ being worked on goes inside the brackets, so if you wanted to know how many\
    \ letters are in the word antidisestablishmentarianism, then you’d enter: `len(\"\
    antidisestablishmentarianism\")` and the number 28 would return.\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_29_1.png)\n\
    \n- **STEP 3** You can pass variables through functions in much the same manner.\
    \ Let’s assume you want the number of letters in a person’s surname, you could\
    \ use the following code (enter the text editor for this example):\n\n  ```python\n\
    \  name=input(\"Enter your surname: \")\n  count=len(name)\n  print(\"Your surname\
    \ has\", count, \"letters in it.\")\n  ```\n\n  Press F5 and save the code to\
    \ execute it.\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_29_2.png)\n\n- **STEP\
    \ 4** Python has tens of functions built into it, far too many to get into in\
    \ the limited space available here.\n\n  However, to view the list of built-in\
    \ functions available to Python 3, navigate to `www.docs.python.org/3/library/functions.html`.\
    \ These are the predefined functions, but since users have created many more,\
    \ they’re not the only ones available.\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_29_3.png)\n\
    \n- **STEP 5** Additional functions can be added to Python through modules. Python\
    \ has a vast range of modules available that can cover numerous programming duties.\
    \ They add functions and can be as important as and when required. For example,\
    \ to use advanced Mathematics functions enter:\n\n  ```python\n  import math\n\
    \  ```\n\n  Once entered, you have access to all the Math module functions.\n\n\
    \  ![](img/4aefeb2d095f688b34af6207870c5f39_30_0.png)\n\n- **STEP 6** To use a\
    \ function from a module enter the name of the module followed by a full stop,\
    \ then the name of the function. For instance, using the Math module, since you've\
    \ just imported it into Python, you can utilise the square root function. To do\
    \ so, enter:\n\n  ```python\n  math.sqrt(16)\n  ```\n\n  You can see that the\
    \ code is presented as module.function(data).\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_30_1.png)\n\
    \n### FORGING FUNCTIONS\n\nThere are many different functions you can import created\
    \ by other Python programmers and you will undoubtedly come across some excellent\
    \ examples in the future; you can also create your own with the def command.\n\
    \n- **STEP 1** Choose File > New File to enter the editor, let's create a function\
    \ called Hello, that greets a user. Enter:\n\n  ```python\n  def Hello():\n  \
    \    print(\"Hello\")\n\n  Hello()\n  ```\n\n  Press F5 to save and run the script.\
    \ You can see Hello in the Shell, type in Hello() and it returns the new function.\n\
    \n  ![](img/4aefeb2d095f688b34af6207870c5f39_30_2.png)\n\n- **STEP 2** Let's now\
    \ expand the function to accept a variable, the user's name for example. Edit\
    \ your script to read:\n\n  ```python\n  def Hello(name):\n      print(\"Hello\"\
    , name)\n\n  Hello(\"David\")\n  ```\n\n  This will now accept the variable name,\
    \ otherwise it prints Hello David, in the Shell, enter: name= (\"Bob\"), then:\
    \ Hello(name). Your function can now pass variables through it.\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_30_4.png)\n\
    \n- **STEP 3** To modify it further, delete the Hello(\"David\") line, the new\
    \ script. the last line in the script and press Ctrl+S to save file. Enter the\
    \ editor and create a new file (File > New file). Enter the following:\n\n  ```python\n\
    \  from Hello import Hello\n\n  Hello(\"David\")\n  ```\n\n  Press F5 to save\
    \ and execute the code.\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_30_3.png)\n\
    \n- **STEP 4** What you've just done is import the Hello function from the saved\
    \ Hello.py program and then used it to say hello to David. This is how modules\
    \ and functions work: you import the module then use the function. Try this one,\
    \ and modify it for extra credit:\n\n  ```python\n  def add(a, b):\n      result\
    \ = a + b\n      return result\n  ```\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_30_5.png)\n"
  mdcn: "\n\n## 用户输入\n\n在之前的一些示例中，我们已经看到了一些基本的用户交互代码，因此现在正是专注于如何从用户获取信息，然后存储和呈现信息的好时机。\n\
    \n### 用户友好\n\n你希望从用户那里获取的输入类型将很大程度上取决于你正在编写的程序类型。例如，一个游戏可能会询问角色的名字，而一个数据库可以询问个人详细信息。\n\
    \n- **第 1 步**\n\n  如果尚未打开，请打开 Python 3 IDLE Shell，并在编辑器中创建一个新文件。让我们从非常简单的内容开始，输入：\n\
    \n  ```python\n  print(\"Hello\")\n  firstname=input(\"What is your first name?\
    \ \")\n  print(\"Thanks.\")\n  surname=input(\"And what is your surname? \")\n\
    \  ```\n\n- **第 2 步**\n\n  保存并运行代码，正如你无疑已经猜测到的那样，在 IDLE Shell 中，程序会询问你的名，并将其存储为变量\
    \ *firstname*，接着询问你的姓；也存储在其自己的变量中 (*surname*)。\n\n- **第 3 步**\n\n  现在，既然我们已将用户的名字存储在几个变量中，我们可以随时调用它们：\n\
    \n  ```python\n  print(\"Welcome\", firstname, surname, \" I hope\n  you're well\
    \ today.\")\n  ```\n\n- **第 4 步**\n\n  运行代码，你会发现一个小问题，姓后面的句号跟着一个空格。为了消除这个问题，我们可以在代码中添加一个加号，而不是逗号：\n\
    \n  ```python\n  print(\"Welcome\", firstname, surname+\" I hope\n  you're well\
    \ today.\")\n  ```\n\n- **第 5 步**\n\n  你并不总需要在输入命令中包含带引号的文本。例如，你可以询问用户的名字，并在下一行进行输入：\n\
    \n  ```python\n  print(\"Hello. What’s your name?\")\n  name=input()\n  ```\n\n\
    \  ![](img/4aefeb2d095f688b34af6207870c5f39_28_0.png)\n\n- **第 6 步**\n\n  上一步中的代码通常被认为比在输入命令中包含大量文本更整洁，但这并非铁律，因此在这些情况下可以随你喜欢。基于该代码进行扩展，尝试这个：\n\
    \n  ```python\n  print(\"Halt! Who goes there?\")\n  name=input()\n  ```\n\n \
    \ ![](img/4aefeb2d095f688b34af6207870c5f39_28_1.png)\n\n- **第 7 步**\n\n  这可能是一个文字冒险游戏的不错开端，或许？现在你可以进一步扩展它，并使用来自用户的原始输入来丰富游戏内容：\n\
    \n  ```python\n  if name==\"David\":\n      print(\"Welcome, good sir. You may\
    \ pass.\")\n  else:\n      print(\"I know you not. Prepare for battle!\")\n  ```\n\
    \n  ![](img/4aefeb2d095f688b34af6207870c5f39_28_2.png)\n\n- **第 8 步**\n\n  你在这里创建的是一种条件，我们很快就会详细讲解。简而言之，我们正在使用来自用户的输入并将其与一个条件进行测量。因此，如果用户输入\
    \ David 作为他们的名字，守卫将允许他们畅通无阻地通过。否则，如果他们输入除 David 以外的其他名字，守卫将挑战他们战斗。\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_28_3.png)\n\
    \n- **第 9 步**\n\n  正如你之前所学到的，任何来自用户的输入自动都是字符串，因此你需要应用类型转换（TypeCast）才能将其转换为其他类型。这为输入命令带来了一些有趣的扩展。例如：\n\
    \n  ```python\n  # Code to calculate rate and distance\n  print(\"Input a rate\
    \ and a distance\")\n  rate = float(input(\"Rate: \"))\n  ```\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_28_4.png)\n\
    \n- **第 10 步**\n\n  为了完成速度和距离的代码，我们可以添加：\n\n  ```python\n  distance = float(input(\"\
    Distance: \"))\n  print(\"Time:\", (distance / rate))\n  ```\n\n  保存并运行代码，并输入一些数字。使用\
    \ float(input 元素，我们已告知 Python 任何输入都是浮点数，而不是字符串。\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_28_5.png)\n\
    \n## 创建函数\n\n既然你已掌握变量和用户输入的使用，下一步就是攻克函数。你已经使用过一些函数，例如 print 命令，但 Python 允许你定义自己的函数。\n\
    \n### 古怪的函数\n\n函数是你输入到 Python 中以执行某事的命令。它是一段小的自包含代码，接收数据，对其进行处理，然后返回结果。\n\n- **第\
    \ 1 步** 不仅仅是数据由函数处理。它们在 Python 中可以做各种有用的事情，例如对数据排序，将项目从一种格式转换为另一种格式，以及检查项目的长度或类型。基本上，函数是一个后跟括号的短词。例如，`len()`、`list()`\
    \ 或 `type()`。\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_29_0.png)\n\n- **第\
    \ 2 步** 函数接收数据，通常是一个变量，根据函数编程执行的内容对其进行处理，并返回最终值。被处理的数据位于括号内，因此如果你想知道单词 antidisestablishmentarianism\
    \ 中有多少个字母，那么你可以输入：`len(\"antidisestablishmentarianism\")`，数字 28 将会返回。\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_29_1.png)\n\
    \n- **第 3 步** 你可以以类似的方式通过函数传递变量。假设你想知道一个人姓氏的字母数，你可以使用以下代码（在此示例中进入文本编辑器）：\n\n \
    \ ```python\n  name=input(\"Enter your surname: \")\n  count=len(name)\n  print(\"\
    Your surname has\", count, \"letters in it.\")\n  ```\n\n  按 F5 保存代码以执行它。\n\n\
    \  ![](img/4aefeb2d095f688b34af6207870c5f39_29_2.png)\n\n- **第 4 步** Python 内置了数十个函数，远不止于此，受限于此处可用的空间无法详细介绍。\n\
    \n  但是，要查看 Python 3 可用的内置函数列表，请访问 `www.docs.python.org/3/library/functions.html`。这些是预定义的函数，但由于用户创建了更多函数，它们并非唯一可用的。\n\
    \n  ![](img/4aefeb2d095f688b34af6207870c5f39_29_3.png)\n\n- **第 5 步** 可以通过模块将附加函数添加到\
    \ Python。Python 有各种可用的模块，可以涵盖许多编程任务。它们添加函数，并根据需要变得同样重要。例如，要使用高级数学函数，请输入：\n\n \
    \ ```python\n  import math\n  ```\n\n  输入后，你可以访问所有 Math 模块函数。\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_30_0.png)\n\
    \n- **第 6 步** 要使用模块中的函数，输入模块名称，后跟句点，然后是函数名称。例如，使用 Math 模块，既然你刚刚将其导入 Python，你可以利用平方根函数。为此，请输入：\n\
    \n  ```python\n  math.sqrt(16)\n  ```\n\n  你可以看到代码显示为 module.function(data)。\n\
    \n  ![](img/4aefeb2d095f688b34af6207870c5f39_30_1.png)\n\n### 锻造函数\n\n你可以导入许多由其他\
    \ Python 程序员创建的不同函数，将来你肯定会遇到一些极好的例子；你也可以使用 def 命令创建自己的函数。\n\n- **第 1 步** 选择 File\
    \ > New File 进入编辑器，让我们创建一个名为 Hello 的函数，用于向用户问好。输入：\n\n  ```python\n  def Hello():\n\
    \      print(\"Hello\")\n\n  Hello()\n  ```\n\n  按 F5 保存并运行脚本。你可以在 Shell 中看到 Hello，输入\
    \ Hello() 并返回新函数。\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_30_2.png)\n\n\
    - **第 2 步** 现在让我们扩展该函数以接受变量，例如用户的名字。编辑你的脚本使其读取：\n\n  ```python\n  def Hello(name):\n\
    \      print(\"Hello\", name)\n\n  Hello(\"David\")\n  ```\n\n  现在这将接受变量 name，否则它会在\
    \ Shell 中打印 Hello David，输入：name= (\"Bob\")，然后：Hello(name)。你的函数现在可以传递变量。\n\n  ![](img/4aefeb2d095f688b34af6207870c5f39_30_4.png)\n\
    \n- **第 3 步** 为了进一步修改，删除 Hello(\"David\") 行，新的脚本，脚本的最后一行，并按 Ctrl+S 保存文件。进入编辑器并创建新文件（File\
    \ > New file）。输入以下内容：\n\n  ```python\n  from Hello import Hello\n\n  Hello(\"\
