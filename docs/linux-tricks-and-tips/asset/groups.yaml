    \ pip`\n\n完成后，关闭终端，Python 3.x 将通过发行版菜单中的 Programming 部分可用。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_10_6.png)\n\
    \n## 首次启动 Python\n\n如果你使用的是新款 Raspberry Pi 及其最新发布的 Pi OS，你需要手动安装 Python IDLE。这是因为\
