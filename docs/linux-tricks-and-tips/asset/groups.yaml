    \n**STEP 1** In some programming languages you are required to use a dollar sign\
    \ to denote a string, which is a variable made up of multiple characters, such\
    \ as a name of a person. In Python this isn't necessary. For example, in the Shell\
    \ enter: *name*=**David Hayward** (or use your own name, unless you're also called\
    \ David Hayward).\n\n![](img/4aefeb2d095f688b34af6207870c5f39_25_0.png)\n\n**STEP\
    \ 2** You can check the type of variable in use by issuing the *type*() command,\
    \ placing the name of the variable inside the brackets. In our example, this would\
    \ be: *type* (*name*). Add a new string variable: *title*=**\"Descended from Vikings\"\
    **.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_25_2.png)\n\n**STEP 3** You've\
    \ seen previously that variables can be concatenated using the plus symbol between\
    \ the variable names. In our example we can use: print (*name* + **\":** + *title*).\
    \ The middle part between the quotations allows us to add a colon and a space,\
    \ as variables are connected without spaces, so we need to add them manually.\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_25_1.png)\n\n**STEP 4** You can also\
    \ combine variables within another variable. For example, to combine both name\
    \ and title variables into a new variable we use: *character*=*name* + **\":**\
    \ + *title*. Then output the content of the new variable as: print (*character*).\
    \ Numbers are stored as different variables: *age*=44 Type (*age*) Which, as we\
    \ know, are integers.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_25_3.png)\n\n\
    However, you can't combine both strings and integer type variables in the same\
    \ command, as you would a set of similar variables. You need to either turn one\
    \ into the other or vice versa. When you do try to combine both, you get an error\
    \ message:\n\n```\n`print (name + age)`\n```\n\n```\nPython 3.4.2 (default, Oct\
    \ 19 2014, 13:31:11)\n[GCC 4.9.1] on linux\nType \"copyright\", \"credits\" or\
    \ \"license()\" for more information.\n>>> name='David Hayward'\n>>> print (name)\n\
    David Hayward\n>>> type (name)\n<class 'str'>\n>>> title='Descended from Vikings'\n\
    >>> print (name + \" \" + title)\nDavid Hayward: Descended from Vikings\n>>> character=name\
    \ + \":\" + title\n>>> print (character)\nDavid Hayward: Descended from Vikings\n\
    >>> age=44\n>>> type (age)\n<class 'int'>\n>>> print (name+age)\nTraceback (most\
    \ recent call last):\n  File \"pyshell0\", line 1, in <module>\nprint (name+age)\n\
    TypeError: Can't convert 'int' object to str implicitly\n>>>\n```\n\nThis is a\
    \ process known as TypeCasting. The Python code is:\n\n```python\nprint (character\
    \ + \" is \"+ str(age) + \" years old.\")\n```\n\nor you can use:\n\n```\n`print\
    \ (character, \"is\", age, \"years old.\")`\n```\n\nNotice again that in the last\
    \ example, you don't need the spaces between the words in quotes as the commas\
    \ treat each argument to print separately.\n\n```\n>>> print (name + age)\nTraceback\
    \ (most recent call last):\n  File \"pyshell0\", line 1, in <module>\nprint (name\
    \ + age)\nTypeError: Can't convert 'int' object to str implicitly\n>>> print (character\
    \ + \" is \"+ str(age) + \" years old.\")\nDavid Hayward: Descended from Vikings\
    \ is 44 years old.\n>>> print (character, \"is\", age, \"years old.\")\nDavid\
    \ Hayward: Descended from Vikings is 44 years old.\n>>>\n```\n\nAnother example\
    \ of TypeCasting is when you ask for input from the user, such as a name. For\
    \ example, enter:\n\n```\n`age= input (\"How old are you? \")`\n```\n\nAll data\
    \ stored from the Input command is stored as a string variable.\n\n```\nPython\
    \ 3.4.2 Shell\n\nFile Edit Shell Debug Options Windows Help\n\nPython 3.4.2 (default,\
    \ Oct 19 2014, 13:31:11)\n[GCC 4.9.1] on linux\nType \"copyright\", \"credits\"\
    \ or \"license()\" for more information.\n>>> age= input (\"How old are you? \"\
    )\nHow old are you? 44\n>>> type(age)\n<class 'str'>\n>>>\n```\n\nThis presents\
    \ a bit of a problem when you want to work with a number that's been inputted\
    \ by the user, as age + 10 won't work due to being a string variable and an integer.\
    \ Instead, you need to enter:\n\n```\n`int (age) + 10`\n```\n\nThis will TypeCast\
    \ the age string into an integer that can be worked with.\n\n```\nPython 3.4.2\
    \ Shell\n\nFile Edit Shell Debug Options Windows Help\n\nPython 3.4.2 (default,\
    \ Oct 19 2014, 13:31:11)\n[GCC 4.9.1] on linux\nType \"copyright\", \"credits\"\
    \ or \"license()\" for more information.\n>>> age= input (\"How old are you? \"\
    )\nHow old are you? 44\n>>> type(age)\n<class 'str'>\n>>> age + 10\nTraceback\
    \ (most recent call last):\n  File \"pyshell0\", line 1, in <module>\n age + 10\n\
    TypeError: Can't convert 'int' object to str implicitly\n>>> int(age) + 10\n54\n\
    >>>\n```\n\nThe use of TypeCasting is also important when dealing with floating\
    \ point arithmetic; remember: numbers that have a decimal point in them. For example,\
    \ enter:\n\n```\n`shirt=19.99`\n```\n\nNow enter type(shirt) and you'll see that\
    \ Python has allocated the number as a 'float', because the value contains a decimal\
    \ point.\n\n```\nPython 3.4.2 Shell\n\nFile Edit Shell Debug Options Windows Help\n\
    \nPython 3.4.2 (default, Oct 19 2014, 13:31:11)\n[GCC 4.9.1] on linux\nType \"\
    copyright\", \"credits\" or \"license()\" for more information.\n>>> shirt=19.99\n\
    >>> type(shirt)\n<class 'float'>\n>>>\n```\n\nWhen combining integers and floats\
    \ Python usually converts the integer to a float, but should the reverse ever\
    \ be applied it's worth remembering that Python doesn't return the exact value.\
    \ When converting a float to an integer, Python will always round down to the\
    \ nearest integer, called truncating; in our case instead of 19.99 it becomes\
    \ 19.\n\n```\nPython 3.4.2 Shell\n\nFile Edit Shell Debug Options Windows Help\n\
    \nPython 3.4.2 (default, Oct 19 2014, 13:31:11)\n[GCC 4.9.1] on linux\nType \"\
    copyright\", \"credits\" or \"license()\" for more information.\n>>> shirt=19.99\n\
    >>> type(shirt)\n<class 'float'>\n>>> int(shirt)\n19\n>>>\n```\n"
  mdcn: "\n\n# 使用注释\n\n**步骤 5**\n虽然我们已知变量 A 是存活的，且玩家刚刚失去了一条命，但普通观众或检查代码的人可能并不知情。试想一下，如果代码有两万行长，而不仅仅是我们的七行，你就能明白注释有多么实用了。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_24_0.png)\n\n**步骤 6**\n本质上，新的代码加上注释可以如下所示：\n\
    \n```python\n# Set the start value of A to 10\na=10\n\n# Print the current value\
