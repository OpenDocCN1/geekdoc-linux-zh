    \ just one way of doing something. Different distributions go about installing\
    \ software in different ways, so we’re sticking with Linux Mint for this particular\
    \ tutorial.\n\n+   **STEP 1**  \n+   First you need to ascertain which version\
    \ of Python is currently installed in your Linux system. To begin with, drop into\
    \ a Terminal session from your distro’s menu or hit the Ctrl+Alt+T keys.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_9_0.png)\n\
    \n+   **STEP 2**  \n+   Next enter `python --version` into the Terminal screen.\
    \ You should have the output relating to version 2.x of Python in the display.\
    \ By default, most Linux distros come with both Python 2 and 3, as there’s plenty\
    \ of code out there still available for Python 2. Now enter: `python3 --version`.\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_9_1.png)\n\n+   **STEP 3**  \n+   In\
    \ our case we have both Python 2 and 3 installed; as long as Python 3.x is installed,\
    \ then the code in our tutorials will work. It’s always worth checking to see\
    \ if the distro has been updated with the latest versions, so enter: `sudo apt-get\
    \ update && sudo apt-get upgrade` to update the system.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_9_2.png)\n\
    \n+   **STEP 4**  \n+   Once the update and upgrade completes, enter: `python3\
    \ --version` again to see if Python 3.x is updated or even installed; as long\
    \ as you have Python 3.x, you’re running the most recent major version. The numbers\
