    \  #include <iostream>\n  using namespace std;\n  \n  int main ()\n  {\n     \
    \ string greet = \"Welcome\";\n      cout << greet << \"\\n\";\n  }\n  ```\n \
    \ \n  strings.cpp\n  \n  ```\n  1. #include <iostream>\n  2. using namespace std;\n\
    \  3.\n  4. int main()\n  5. {\n  6.    string greet = \"Welcome\";\n  7.    cout\
    \ << greet << \"\\n\";\n  8. \n  9. \n  10. }\n  ```\n\n- **STEP 5**\n  \n  There\
    \ are also many different operations that you can apply with the string function.\
    \ For instance, to get the length of a string you can use:\n  \n  ```cpp\n  #include\
    \ <iostream>\n  using namespace std;\n  \n  int main ()\n  {\n      string greet\
    \ = \"Welcome\";\n      cout << \"The length of the string is: \";\n      cout\
    \ << greet.size() << \"\\n\";\n  }\n  ```\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_56_0.png)\n\
    \n- **STEP 6**\n  \n  You can see that we used greet.size() to output the length,\
    \ the number of characters there are, of the contents of the string. Naturally,\
    \ if you call your string something other than greet, then you need to change\
    \ the command to reflect this. It’s always stringname.operation. Build and run\
    \ the code to see the results.\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_56_1.png)\n\
    \n- **STEP 7**\n  \n  You can of course add strings together, or rather combine\
    \ them to form longer strings:\n  \n  ```cpp\n  #include <iostream>\n  using namespace\
    \ std;\n  \n  int main ()\n  {\n      string greet1 = \"Hello\";\n      string\
    \ greet2 = \", world!\";\n      string greet3 = greet1 + greet2;\n\n      cout\
    \ << greet3 << \"\\n\";\n  }\n  ```\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_56_2.png)\n\
    \n- **STEP 8**\n  \n  Just as you might expect, you can mix in an integer and\
    \ store something to do with the string. In this example, we created int length,\
    \ which stores the result of string.size() and outputs it to the user:\n  \n \
    \ ```cpp\n  #include <iostream>\n  using namespace std;\n  \n  int main ()\n \
    \ {\n      int length;\n      string greet1 = \"Hello\";\n      string greet2\
    \ = \", world!\";\n      string greet3 = greet1 + greet2;\n\n      length = greet3.size();\n\
    \      cout << \"The length of the combined strings is: \";\n      cout << length\
    \ << \"\\n\";\n  }\n  ```\n\n- **STEP 9**\n  \n  Using the available operations\
    \ that come with the string function, you can manipulate the contents of a string.\
    \ For example, to remove characters from a string you could use:\n  \n  ```cpp\n\
    \  #include <iostream>\n  using namespace std;\n  \n  int main ()\n  {\n     \
    \ string strg (\"Here is a long sentence in a string.\");\n\n      cout << strg\
    \ << \"\\n\";\n      strg.erase (10,5);\n      cout << strg << \"\\n\";\n\n  \
    \    strg.erase (strg.begin()+8);\n      cout << strg << \"\\n\";\n\n      strg.erase\
    \ (strg.begin()+9, strg.end()-9);\n      cout << strg << \"\\n\";\n  }\n  ```\n\
    \n- **STEP 10**\n  \n  It’s worth spending some time playing around with the numbers,\
    \ which are the character positions in the string. Occasionally, it can be hit\
    \ and miss whether you get it right, so practice makes perfect. Take a look at\
    \ the screenshot to see the result of the code.\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_56_3.png)\n\
    \n## C++ Maths\n\nProgramming is mathematical in nature and as you might expect,\
    \ there's plenty of built-in scope for some quite intense maths. C++ has a lot\
    \ to offer someone who's implementing mathematical models into their code. It\
    \ can be extremely complex or relatively simple.\n\n### C++ = MC2\n\nThe basic\
    \ mathematical symbols apply in C++ as they do in most other programming languages.\
    \ However, by using the C++ Math Library, you can also calculate square roots,\
    \ powers, trig and more.\n\n- **STEP 1**\n  \n  C++'s mathematical operations\
    \ follow the same patterns as those taught in school, in that multiplication and\
    \ division take precedence over addition and subtraction. You can alter that though.\
    \ For now, create a new file and enter:\n  \n  ```cpp\n  #include <iostream>\n\
    \  using namespace std;\n\n  int main ()\n  {\n      float numbers = 100;\n\n\
    \      numbers = numbers + 10; // This adds 10 to the initial 100\n      cout\
    \ << numbers << \"\\n\";\n\n      numbers = numbers - 10; // This subtracts 10\
    \ from the new 110\n      cout << numbers << \"\\n\";\n  }\n  ```\n\n- **STEP\
    \ 2**\n  \n  While simple, it does get the old maths muscle warmed up. Note that\
    \ we used a float for the numbers variable. While you can happily use an integer,\
    \ if you suddenly start to use decimals, you would need to change to a float or\
    \ a double, depending on the accuracy needed. Run the code and see the results.\n\
    \  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_57_0.png)\n\n- **STEP 3**\n  \n\
    \  Multiplication and division can be applied as such:\n  \n  ```cpp\n  #include\
    \ <iostream>\n  using namespace std;\n\n  int main ()\n  {\n      float numbers\
    \ = 100;\n\n      numbers = numbers * 10; // This multiplies 100 by 10\n     \
    \ cout << numbers << \"\\n\";\n\n      numbers = numbers / 10; // And this divides\
    \ 1000 by 10\n      cout << numbers << \"\\n\";\n  }\n  ```\n\n- **STEP 4**\n\
    \  \n  Again, execute the simple code and see the results. While not particularly\
    \ interesting, it's an introduction to C++ maths. We used a float here, so you\
    \ can play around with the code and multiply by decimal places, as well as divide,\
    \ add and subtract.\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_57_1.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_58_0.png)\n\n- **STEP 5**\n  \n  The\
    \ interesting maths content comes when you call upon the C++ Math Library. Within\
    \ this header are dozens of mathematical functions along with further operations.\
    \ Everything from computing cosine to arc tangent with two parameters, to the\
    \ value of Pi. You can call the header with:\n  \n  ```cpp\n  #include <iostream>\n\
    \  #include <cmath>\n  using namespace std;\n\n  int main ()\n  {\n      \n  }\n\
    \  ```\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_1.png)\n\n- **STEP 6**\n\
    \  \n  Start by getting the square root of a number:\n  \n  ```cpp\n  #include\
    \ <iostream>\n  #include <cmath>\n  using namespace std;\n\n  int main ()\n  {\n\
    \      float number = 134;\n      \n      cout << \"The square root of \" << number\
    \ << \" is: \" << sqrt(number) << \"\\n\";\n  }\n  ```\n\n- **STEP 7**\n  \n \
    \ Here we created a new float called number and used the sqrt(number) function\
    \ to display the square root of 134, the value of the variable, number. Build\
    \ and run the code and your answer reads 11.5758.\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_5.png)\n\
    \  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_6.png)\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_7.png)\n\
    \n- **STEP 8**\n  \n  Calculating powers of numbers can be done with:\n  \n  ```cpp\n\
    \  #include <iostream>\n  #include <cmath>\n  using namespace std;\n\n  int main\
    \ ()\n  {\n      float number = 12;\n      \n      cout << number << \" to the\
    \ power of 2 is \" << pow(number, 2) << \"\\n\";\n      cout << number << \" to\
    \ the power of 3 is \" << pow(number, 3) << \"\\n\";\n      cout << number <<\
    \ \" to the power of 0.8 is \" << pow(number, 0.8) << \"\\n\";\n  }\n  ```\n \
    \ \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_2.png)\n\n- **STEP 9**\n  \n\
    \  Here we created a float called number with the value of 12 and the pow(variable,\
    \ power) is where the calculation happens. Of course, you can calculate powers\
    \ and square roots without using variables. For example, pow(12, 2) outputs the\
    \ same value as the first cout line in the code.\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_3.png)\n\
    \  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_4.png)\n\n- **STEP 10**\n \
    \ \n  The value of Pi is also stored in the cmath header library. It can be called\
    \ up with the M_PI function. Enter cout << M_PI; into the code and you get 3.14159;\
    \ or you can use it to calculate:\n  \n  ```cpp\n  #include <iostream>\n  #include\
    \ <cmath>\n  using namespace std;\n\n  int main ()\n  {\n      double area, radius\
    \ = 1.5;\n      \n      area = M_PI * radius * radius;\n      \n      cout <<\
    \ area << \"\\n\";\n  }\n  ```\n"
  mdcn: "\n## 字符串\n\n字符串是表示和存储字符序列的对象。例如，你可以在代码中拥有一个通用的问候语 ‘Welcome’，并将其作为一个字符串分配给程序中的任意位置调用。\n\
    \n### 字符串理论\n\n创建字符字符串有不同的方法，这些方法在历史上都是从原始 C 语言继承而来，并且至今仍被 C++ 支持。\n\n- **步骤 1**\n\
    \  \n  要创建一个字符串，你需要使用 char 函数。打开一个新的 C++ 文件，并以常规的头文件开始：\n  \n  ```cpp\n  #include\
    \ <iostream>\n  using namespace std;\n  \n  int main ()\n  {\n  }\n  ```\n  \n\
    \  strings.cpp\n  \n  ```\n  1. #include <iostream>\n  2. using namespace std;\n\
    \  3.\n  4. int main()\n  5. {\n  6. \n  7. \n  8. }\n  ```\n\n- **步骤 2**\n  \n\
    \  很容易将字符串与数组混淆。这里是一个数组，它可以用空字符结尾：\n  \n  ```cpp\n  #include <iostream>\n  using\
    \ namespace std;\n  \n  int main ()\n  {\n      char greet[8] = {'W', 'e', 'l',\
    \ 'c', 'o', 'm', 'e', '\\0'};\n      cout << greet << \"\\n\";\n  }\n  ```\n \
    \ \n  strings.cpp\n  \n  ```\n  1. #include <iostream>\n  2. using namespace std;\n\
    \  3.\n  4. int main()\n  5. {\n  6.    char greet[8] = {'W', 'e', 'l', 'c', 'o',\
    \ 'm', 'e', '\\0'};\n  7.    cout << greet << \"\\n\";\n  8. }\n  ```\n\n- **步骤\
    \ 3**\n  \n  构建并运行代码，屏幕上会出现 ‘Welcome’。虽然这完全没问题，但它不是一个字符串。字符串是一个类，它定义的对象可以表示为字符流，并且不需要像数组那样以特定方式结尾。因此，代码可以表示为：\n\
    \  \n  ```cpp\n  #include <iostream>\n  using namespace std;\n  \n  int main ()\n\
    \  {\n      char greet[] = \"Welcome\";\n      cout << greet << \"\\n\";\n  }\n\
    \  ```\n  \n  strings.cpp\n  \n  ```\n  1. #include <iostream>\n  2. using namespace\
    \ std;\n  3.\n  4. int main()\n  5. {\n  6.    char greet[] = \"Welcome\";\n \
    \ 7.    cout << greet << \"\\n\";\n  8. \n  9. \n  10. }\n  ```\n\n- **步骤 4**\n\
    \  \n  在 C++ 中，还有一个 string 函数，其工作方式非常相似。再次使用问候代码，你可以输入：\n  \n  ```cpp\n  #include\
    \ <iostream>\n  using namespace std;\n  \n  int main ()\n  {\n      string greet\
    \ = \"Welcome\";\n      cout << greet << \"\\n\";\n  }\n  ```\n  \n  strings.cpp\n\
    \  \n  ```\n  1. #include <iostream>\n  2. using namespace std;\n  3.\n  4. int\
    \ main()\n  5. {\n  6.    string greet = \"Welcome\";\n  7.    cout << greet <<\
    \ \"\\n\";\n  8. \n  9. \n  10. }\n  ```\n\n- **步骤 5**\n  \n  你还可以对 string 函数应用许多不同的操作。例如，要获取字符串的长度，你可以使用：\n\
    \  \n  ```cpp\n  #include <iostream>\n  using namespace std;\n  \n  int main ()\n\
    \  {\n      string greet = \"Welcome\";\n      cout << \"The length of the string\
    \ is: \";\n      cout << greet.size() << \"\\n\";\n  }\n  ```\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_56_0.png)\n\
    \n- **步骤 6**\n  \n  可以看到，我们使用 `greet.size()` 输出了字符串内容的长度，即字符数。显然，如果你将字符串命名为 `greet`\
    \ 以外的其他名称，则需要更改命令以反映这一点。它始终是“字符串名称.操作”。构建并运行代码以查看结果。\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_56_1.png)\n\
    \n- **步骤 7**\n  \n  当然，你可以将字符串加在一起，或者更准确地说，将它们组合以形成更长的字符串：\n  \n  ```cpp\n  #include\
    \ <iostream>\n  using namespace std;\n  \n  int main ()\n  {\n      string greet1\
    \ = \"Hello\";\n      string greet2 = \", world!\";\n      string greet3 = greet1\
    \ + greet2;\n\n      cout << greet3 << \"\\n\";\n  }\n  ```\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_56_2.png)\n\
    \n- **步骤 8**\n  \n  正如你所料，你可以混入一个整数并存储与字符串相关的某些内容。在这个例子中，我们创建了 `int length`，它存储了\
    \ `string.size()` 的结果并将其输出给用户：\n  \n  ```cpp\n  #include <iostream>\n  using namespace\
    \ std;\n  \n  int main ()\n  {\n      int length;\n      string greet1 = \"Hello\"\
    ;\n      string greet2 = \", world!\";\n      string greet3 = greet1 + greet2;\n\
    \n      length = greet3.size();\n      cout << \"The length of the combined strings\
    \ is: \";\n      cout << length << \"\\n\";\n  }\n  ```\n\n- **步骤 9**\n  \n  使用\
    \ string 函数附带的可用操作，你可以操作字符串的内容。例如，要从字符串中删除字符，你可以使用：\n  \n  ```cpp\n  #include\
    \ <iostream>\n  using namespace std;\n  \n  int main ()\n  {\n      string strg\
    \ (\"Here is a long sentence in a string.\");\n\n      cout << strg << \"\\n\"\
    ;\n      strg.erase (10,5);\n      cout << strg << \"\\n\";\n\n      strg.erase\
    \ (strg.begin()+8);\n      cout << strg << \"\\n\";\n\n      strg.erase (strg.begin()+9,\
    \ strg.end()-9);\n      cout << strg << \"\\n\";\n  }\n  ```\n\n- **步骤 10**\n\
    \  \n  花点时间玩玩这些数字（它们是字符串中的字符位置）是值得的。有时候，你无法确定是否正确，所以熟能生巧。查看截图以查看代码的结果。\n  \n \
    \ ![](img/4aefeb2d095f688b34af6207870c5f39_56_3.png)\n\n## C++ 数学\n\n编程在本质上是数学的，正如你可能预料的那样，它内置了进行相当激烈的数学运算的广阔空间。对于在代码中实现数学模型的人来说，C++\
    \ 有很多可提供的内容。它可以非常复杂，也可以相对简单。\n\n### C++ = MC2\n\n基本数学符号在 C++ 中与应用于大多数其他编程语言时相同。然而，通过使用\
    \ C++ 数学库，你還可以計算平方根、幂、三角函數等。\n\n- **步骤 1**\n  \n  C++ 的数学运算遵循与学校教授的模式相同的原则，即乘法和除法优先于加法和减法。不过，你可以改变这一点。暂时，创建一个新文件并输入：\n\
    \  \n  ```cpp\n  #include <iostream>\n  using namespace std;\n\n  int main ()\n\
    \  {\n      float numbers = 100;\n\n      numbers = numbers + 10; // This adds\
    \ 10 to the initial 100\n      cout << numbers << \"\\n\";\n\n      numbers =\
    \ numbers - 10; // This subtracts 10 from the new 110\n      cout << numbers <<\
    \ \"\\n\";\n  }\n  ```\n\n- **步骤 2**\n  \n  虽然简单，但它确实能热身一下旧的数学肌肉。注意我们为 `numbers`\
    \ 变量使用了 float。虽然你可以愉快地使用整数，但如果你突然开始使用小数，就需要根据所需的精度更改为 float 或 double。运行代码并查看结果。\n\
    \  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_57_0.png)\n\n- **步骤 3**\n  \n\
    \  乘法和除法可以这样应用：\n  \n  ```cpp\n  #include <iostream>\n  using namespace std;\n\
    \n  int main ()\n  {\n      float numbers = 100;\n\n      numbers = numbers *\
    \ 10; // This multiplies 100 by 10\n      cout << numbers << \"\\n\";\n\n    \
    \  numbers = numbers / 10; // And this divides 1000 by 10\n      cout << numbers\
    \ << \"\\n\";\n  }\n  ```\n\n- **步骤 4**\n  \n  同样，执行简单代码并查看结果。虽然没什么特别有趣的，但这是 C++\
    \ 数学的介绍。我们在这里使用了 float，所以你可以玩弄代码，不仅可以乘以小数位，还可以进行除法、加法和减法。\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_57_1.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_58_0.png)\n\n- **步骤 5**\n  \n  当你调用\
    \ C++ 数学库时，就会出现有趣的数学内容。在这个头文件中，有数十个数学函数以及更多的操作。从计算余弦到双参数反正切，再到圆周率 Pi 的值。你可以这样调用该头文件：\n\
    \  \n  ```cpp\n  #include <iostream>\n  #include <cmath>\n  using namespace std;\n\
    \n  int main ()\n  {\n      \n  }\n  ```\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_1.png)\n\
    \n- **步骤 6**\n  \n  从获取数字的平方根开始：\n  \n  ```cpp\n  #include <iostream>\n  #include\
    \ <cmath>\n  using namespace std;\n\n  int main ()\n  {\n      float number =\
    \ 134;\n      \n      cout << \"The square root of \" << number << \" is: \" <<\
    \ sqrt(number) << \"\\n\";\n  }\n  ```\n\n- **步骤 7**\n  \n  在这里，我们创建了一个名为 `number`\
    \ 的新 float，并使用 `sqrt(number)` 函数显示 134（变量 number 的值）的平方根。构建并运行代码，你的答案读取为 11.5758。\n\
    \  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_5.png)\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_6.png)\n\
    \  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_7.png)\n\n- **步骤 8**\n  \n\
    \  计算数字的幂可以通过以下方式完成：\n  \n  ```cpp\n  #include <iostream>\n  #include <cmath>\n\
    \  using namespace std;\n\n  int main ()\n  {\n      float number = 12;\n    \
    \  \n      cout << number << \" to the power of 2 is \" << pow(number, 2) << \"\
    \\n\";\n      cout << number << \" to the power of 3 is \" << pow(number, 3) <<\
    \ \"\\n\";\n      cout << number << \" to the power of 0.8 is \" << pow(number,\
    \ 0.8) << \"\\n\";\n  }\n  ```\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_2.png)\n\
    \n- **步骤 9**\n  \n  在这里，我们创建了一个值为 12 的名为 `number` 的 float，而 `pow(变量, 幂)` 是发生计算的地方。当然，你不需要使用变量也可以计算幂和平方根。例如，`pow(12,\
    \ 2)` 输出的值与代码中第一行 cout 相同。\n  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_3.png)\n\
    \  \n  ![](img/4aefeb2d095f688b34af6207870c5f39_58_4.png)\n\n- **步骤 10**\n  \n\
    \  圆周率 Pi 的值也存储在 cmath 头文件库中。可以使用 `M_PI` 函数调出它。在代码中进入 `cout << M_PI;`，你会得到 3.14159；或者你可以用它来计算：\n\
    \  \n  ```cpp\n  #include <iostream>\n  #include <cmath>\n  using namespace std;\n\
    \n  int main ()\n  {\n      double area, radius = 1.5;\n      \n      area = M_PI\
    \ * radius * radius;\n      \n      cout << area << \"\\n\";\n  }\n  ```\n\n"
