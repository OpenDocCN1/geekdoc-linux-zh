    \n# 事实上，你正在使用的操作系统就是用 C++ 编写的。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_40_2.png)\n\
    \n# 你的第一个 C++ 程序\n\n树莓派是学习 C++ 的绝佳编码基础。你不需要任何复杂的第三方 IDE 或安装额外的组件。开始所需的一切已经内置于树莓派中。\n\
    \n## 你好，世界！\n\n在编程中，传统上输入的第一段代码会将单词“Hello, World!”（你好，世界！）输出到屏幕上。有趣的是，这一惯例可以追溯到\
    \ 1968 年，当时使用了一种名为 BCPL 的语言。\n\n**步骤 1** 你可以使用自带的 Geany 程序员编辑器，在树莓派上编写、编译和运行你的\
    \ C++ 代码。你可以在主树莓派菜单的“编程”部分找到 Geany，它是该部分的第一项。点击 Geany 图标即可打开并开始编码。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_41_0.png)\n\
    \n**步骤 3** 目前看起来没什么特别，但你稍后可以深入理解 C++ 头文件命令的含义。Geany 使用语法高亮，这意味着它会根据语言（原文 \"lodinge\"\
    \ 疑为 language 的拼写错误，此处按语言翻译）对代码进行颜色编码。要激活此功能，请通过点击“文件 > 另存为”来保存代码。现在将代码命名为 helloworld.cpp\
    \ 并点击“保存”按钮。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_41_1.png)\n\n**步骤 2**\
    \ Geany 编辑器功能强大且易于使用。你输入的所有代码都显示在主窗口中，并带有编号以帮助你跟踪代码。现在，在第 1 行输入：\n`#include <iostream>`\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_41_2.png)\n\n**步骤 4** 颜色编码在编码时非常有帮助。现在按\
    \ Enter 键，在第 3 行开始新命令。输入以下内容：\n`int main()`\n注意：括号之间没有空格。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_41_3.png)\n\
    \n# 你的第一个 C++ 程序\n\n**步骤 5**\n在下一行，即 `int main()` 下方，输入一个左花括号：\n\n`{`\n\n这可以通过按下\
    \ Shift 键和英语 UK 键盘布局中 P 键右侧的按键来实现。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_42_0.png)\n\
    \n**步骤 8**\n现在你需要通过插入相反的右花括号来关闭代码。在第 7 行输入：\n\n`}`\n注意你不需要按退格键删除缩进回到行首，只需输入花括号，Geany\
    \ 会自动跳到行的正确位置，从而结束代码块。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_42_1.png)\n\
    \n**步骤 6**\n请注意 Geany 自动生成了轻微的缩进。这是由于 C++ 的结构决定的，也是代码主体输入的位置。现在输入：\n\n`//My first\
    \ C++ program`\n\n![](img/4aefeb2d095f688b34af6207870c5f39_42_2.png)\n\n**步骤 9**\n\
    本质上，这是你进入 C++ 编码世界的第一步。我们将在接下来的几页中更详细地研究代码结构；不过现在，请点击由带绿色向下箭头的文件柜图标表示的“保存”按钮。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_42_3.png)\n\n**步骤 7**\n再次注意颜色编码的变化。在上一行末尾按\
    \ Return 键，然后输入：\n\n`std::cout << \"Hello, world!\\n\";`\n\n![](img/4aefeb2d095f688b34af6207870c5f39_42_4.png)\n\
    \n**步骤 10**\n如果你还没有这样做，建议创建一个空白文件夹来保存你所有的代码。你可以分别为 Python 和 C++ 创建一个文件夹，或者简单地创建一个名为\
