  - "[PAGE 43]\n\n# Structure of a C++ Program\n\nC++ has a very defined structure\
    \ and way of doing things. Miss something out, even as small as a semicolon, and\
    \ your entire program will fail to be compiled and executed. Many a professional\
    \ programmer has fallen foul of sloppy structure.\n\n# #INCLUDE <C++ STRUCTURE>\n\
    \nLearning the basics of programming, you begin to understand the structure of\
    \ a program. The commands may be different from one language to the next but you\
    \ can start to see how the code works.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_43_0.png)\n\
    \n+   **C++**\n+   \n+   C++ was invented by Danish student Bjarne Stroustrup\
    \ in 1979, as a part of his Ph.D. thesis. Initially C++ was called C with Classes,\
    \ which added features to the already popular C programming language, while making\
    \ it a more user-friendly environment through a new structure.\n\n+   **INT MAIN()**\n\
    +   \n+   int main() initiates the declaration of a function, which is a group\
    \ of code statements under the name ‘main’. All C++ code begins at the main function,\
    \ regardless of where it actually lies within the code.\n\n```\n```cpp\nhelloworld.cpp\n\
    1  #include <iostream>\n2\n3  int main()\n4\n5\n```\n```\n\n+   **#INCLUDE**\n\
    +   \n+   The structure of a C++ program is quite precise. Every C++ code begins\
    \ with a directive: `#include <...>`. The directive instructs the pre-processor\
    \ to include a section of the standard C++ code. For example: `#include <iostream>`\
    \ includes the iostream header to support input/output operations.\n\n```\n```cpp\n\
    helloworld.cpp\n1  #include <iostream>\n2\n3\n4\n```\n```\n\n+   **BRACES**\n\
    +   \n+   The open brace (curly brackets) is something that you may not have come\
    \ across before, especially if you’re used to Python. The open brace indicates\
    \ the beginning of the main function and contains all the code that belongs to\
    \ that function.\n\n```\n```cpp\nhelloworld.cpp\n1  #include <iostream>\n2\n3\
    \  int main()\n4  {\n5\n6  }\n7\n8\n```\n```"
