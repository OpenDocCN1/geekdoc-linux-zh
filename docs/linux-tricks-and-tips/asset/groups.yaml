    \n**步骤 5** 你在声明变量时就可以立即为其赋值。你输入的代码可以替换为如下形式：\n\n```cpp\nint a = 10;\nint b = 5;\n\
    int result = a + b;\n\ncout << result;\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_52_0.png)\n\
    \n**步骤 6** 在 C++ 中，你还可以使用以下语法在声明变量时立即为其赋值：\n\n```cpp\nint a (10);\nint b (5);\n\
    \n然后，根据 C++ 2011 标准，使用大括号：\n\nint result {a+b};\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_52_1.png)\n\
    \n**步骤 7** 你可以创建全局变量，即在任何函数之外声明、并在整个代码的任意函数中使用的变量。你之前使用的是局部变量：即在函数内部使用的变量。例如：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint StartLives = 3;\n\nint\
    \ main()\n{\n\tStartLives = StartLives - 1;\n\tcout << StartLives;\n}\n```\n\n\
    ![](img/4aefeb2d095f688b34af6207870c5f39_52_2.png)\n\n**步骤 8** 上一步创建了变量 StartLives，这是一个全局变量。例如在游戏中，玩家的生命值会随着表现好坏而增减。当玩家重新开始游戏时，StartLives\
    \ 会返回其默认状态：3。在这里，我们分配了 3 条生命，然后减去 1，剩余 2 条生命。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_52_3.png)\n\
    \n**步骤 9** 现代 C++ 编译器比大多数程序员认为的要智能得多。虽然你可以为变量声明多种不同的数据类型，但实际上可以使用 auto 特性：\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nauto pi = 3.141593;\n\nint\
    \ main()\n{\n\tdouble area, radius = 1.5;\n\tarea = pi * radius * radius;\n\t\
    cout << area;\n}\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_52_4.png)\n\n\
    **步骤 10** 虽然我们在步骤 3 中建议忽略警告，但警告和错误之间是有区别的。在这种情况下，这只是一个简单的警告。新的数据类型 double 表示双精度浮点值，这使得代码更加精确。结果应该是\
    \ 7.06858。基本上，你通常可以带着警告工作，但不能带着错误工作。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_52_5.png)\n\
    \n# 数据类型\n\n正如你所见，变量存储着程序员稍后可以调用和操纵的信息。变量只是预留的内存位置，用于存储程序员根据所使用的数据类型分配的值。\n\n\
    ## 数据的值\n\n在 C++ 中，程序员可以使用许多不同的数据类型，例如整数、浮点数、布尔值、字符等。人们普遍认为有七种基本数据类型，通常称为原生内置类型（Primitive\
    \ Built-in Types）；不过，如果代码中需要，你也可以创建自己的数据类型。\n\n| 类型 | 命令 |\n|---|---|\n| 整数 |\
    \ int |\n| 浮点数 | float |\n| 字符 | char |\n| 布尔值 | bool |\n| 双精度浮点数 | double |\n\
    | 宽字符 | wchar_t |\n| 无值 | void |\n\n这些基本类型也可以使用以下修饰符进行扩展：长整型（Long）、短整型（Short）、有符号（Signed）和无符号（Unsigned）。基本上，这意味着修饰符可以扩展每种数据类型的最小和最大值范围。例如，int\
    \ 数据类型的默认值范围是 -2147483648 到 2147483647，这是一个相当大的范围，你应该同意。\n\n现在，如果你使用其中一个修饰符，范围将会改变：\n\
    \n- 无符号 int (Unsigned int) = 0 到 4294967295\n- 有符号 int (Signed int) = -2147483648\
    \ 到 2147483647\n- 短整型 int (Short int) = -32768 到 32767\n- 无符号短整型 int (Unsigned\
    \ Short int) = 0 到 65,535\n- 有符号短整型 int (Signed Short int) = -32768 到 32767\n\
    - 长整型 int (Long int) = -2147483647 到 2147483647\n- 有符号长整型 int (Signed Long int)\
    \ = -2147483647 到 2147483647\n- 无符号长整型 int (Unsigned Long int) = 0 到 4294967295\n\
    \n当然，你可以直接使用基本类型而不使用修饰符，因为每种数据类型都提供了足够的范围。然而，在可能的情况下使用修饰符被认为是良好的 C++ 编程实践。\n\n\
    不过，使用修饰符时也存在一些问题。Double 代表双精度浮点值，你可以用它来表示极其精确的数字，但这些数字只有在第 15 位小数之前才是精确的。在使用 cout\
    \ 函数在 C++ 中显示此类数字时还有另一个问题，cout 默认只输出前五位小数。你可以通过添加 cout.precision() 函数并在括号内添加值来克服这一点，但即便如此，你仍然受限于\
    \ double 数据类型的精度。例如，尝试这段代码：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    double PI = 3.141592653589793238463;\n\nint main()\n{\n    cout << PI;\n}\n```\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_53_0.png)\n\n编译并运行代码，你会发现输出仅为 3.14159，这体现了\
    \ cout 在此示例中的局限性。\n\n你可以修改代码，包括前述的 cout.precision 函数，以获得更高的精度。将精度提高到 22 位小数，代码如下：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\ndouble PI = 3.141592653589793238463;\n\
    \nint main()\n{\n    cout.precision(22);\n    cout << PI;\n}\n```\n\n这主要是由于编译器中的二进制转换，以及\
    \ IEEE 754 双精度标准占用 64 位数据，其中 52 位用于尾数（浮点数中的有效数字），大约 3.5 位用于存储值 0 到 9。如果你用 53 除以\
    \ 3.5，你会得到 15.142857 循环，即 15 位精度。\n\n老实说，如果你创建的代码需要精确到超过 15 位小数，那么你不会使用 C++，你会使用某种专用的科学语言，并以\
    \ C++ 作为两种语言之间的连接组织。\n\n你可以使用一种类似于别名的系统，称为 typedef，来创建自己的数据类型。例如：\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\ntypedef int metres;\n\nint main()\n\
    {\n    metres distance;\n    distance = 15;\n    cout << \"distance in metres\
    \ is: \" << distance;\n}\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_54_0.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_54_1.png)\n\n这段代码执行后创建了一个名为 metres\
    \ 的新 int 数据类型。然后，在 main 代码块中，有一个名为 distance 的新变量，它是一个整数；所以你在告诉编译器 int 有另一个名字。我们将值\
    \ 15 赋给 distance 并显示输出：distance in metres is 15（距离为 15 米）。\n\n起初听起来可能有点令人困惑，但你越经常使用\
    \ C++ 并创建自己的代码，它就越容易掌握。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_54_2.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_54_3.png)\n\n再次，编译并运行代码；正如你可以从命令行窗口中看到，变量\
    \ PI 所代表的数字与你告诉 C++ 在变量中使用的数字不同。输出将 PI 的值读取为 3.141592653589793115998，数字从第 15 位小数开始出现偏差。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_54_4.png)\n\n"
