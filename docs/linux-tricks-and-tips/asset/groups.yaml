  md: "\n## Structure of a C++ Program\n\nC++ has a very defined structure and way\
    \ of doing things. Miss something out, even as small as a semicolon, and your\
    \ entire program will fail to be compiled and executed. Many a professional programmer\
    \ has fallen foul of sloppy structure.\n\n### INCLUDE <C++ STRUCTURE>\n\nLearning\
    \ the basics of programming, you begin to understand the structure of a program.\
    \ The commands may be different from one language to the next but you can start\
    \ to see how the code works.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_43_0.png)\n\
    \n- **C++**\n  C++ was invented by Danish student Bjarne Stroustrup in 1979, as\
    \ a part of his Ph.D. thesis. Initially C++ was called C with Classes, which added\
    \ features to the already popular C programming language, while making it a more\
    \ user-friendly environment through a new structure.\n\n- **INT MAIN()**\n  int\
    \ main() initiates the declaration of a function, which is a group of code statements\
    \ under the name ‘main’. All C++ code begins at the main function, regardless\
    \ of where it actually lies within the code.\n\n```cpp\nhelloworld.cpp\n1  #include\
    \ <iostream>\n2\n3  int main()\n4\n5\n```\n\n- **#INCLUDE**\n  The structure of\
    \ a C++ program is quite precise. Every C++ code begins with a directive: `#include\
    \ <...>`. The directive instructs the pre-processor to include a section of the\
    \ standard C++ code. For example: `#include <iostream>` includes the iostream\
    \ header to support input/output operations.\n\n```cpp\nhelloworld.cpp\n1  #include\
    \ <iostream>\n2\n3\n4\n```\n\n- **BRACES**\n  The open brace (curly brackets)\
    \ is something that you may not have come across before, especially if you’re\
    \ used to Python. The open brace indicates the beginning of the main function\
    \ and contains all the code that belongs to that function.\n\n```cpp\nhelloworld.cpp\n\
    1  #include <iostream>\n2\n3  int main()\n4  {\n5\n6  }\n7\n8\n```\n\n### COMMENTS\n\
    \nLines that begin with a double slash are comments. This means they won't be\
    \ executed in the code and are ignored by the compiler. Comments are designed\
    \ to help you, or another programmer looking at your code, and explain what's\
    \ going on. There are two types of comment: `//` covers multiple line comments\
    \ and `/*` a single line.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_44_0.png)\n\
    \nThe two chevrons used here are insertion operators. This means that whatever\
    \ follows the chevrons is to be inserted into the std::cout statement. In this\
    \ case they're the words ‘Hello, world’ which are to be displayed on the screen\
    \ when you compile and execute the code.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_44_1.png)\n\
    \n**STD** While std stands for something quite different, in C++ it means Standard.\
    \ It's part of the Standard Namespace in C++, which covers a number of different\
    \ statements and commands. You can leave the std:: part out of the code but it\
    \ must be declared at the start with: using namespace std; not both. For example:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_44_2.png)\n\
    \n**OUTPUTS** Leading on, the “Hello, world!” part is what you want to appear\
    \ on the screen when the code is executed. You can enter whatever you like, as\
    \ long as it's inside the quotation marks. Sometimes brackets are needed, depending\
    \ on the compiler. The \\n part indicates a new line is to be inserted.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_44_3.png)\n\
    \n**COUT** In this example we're using cout, which is a part of the Standard Namespace,\
    \ hence why it's there, as you're asking C++ to use it from that particular namespace.\
    \ Cout means Character OUtput, which displays, or prints, something to the screen.\
    \ If you leave std:: out you have to declare it at the start of the code, as mentioned\
    \ previously.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_44_4.png)\n\n**}; AND\
    \ }** Finally you can see that lines within a function code block (except comments)\
    \ end with a semicolon. This marks the end of the statement; all statements in\
    \ C++ must have one at the end or the compiler fails to build the code. The very\
    \ last line has the closing brace to indicate the end of the main function.\n\n\
    ![](img/4aefeb2d095f688b34af6207870c5f39_44_5.png)\n\n## Compile and Execute\n\
    \nYou’ve created your first C++ program and you now understand the basics behind\
    \ the structure of one. Let’s get things moving and compile and execute, or run\
    \ if you prefer, the program and see how it looks.\n\n### GREETINGS FROM C++\n\
    \nCompiling and executing code from within Geany is remarkably simple and just\
    \ a matter of clicking a couple of icons and seeing the result. Here’s how it’s\
    \ done.\n\n**STEP 1**\nOpen Geany, if you haven’t already, and load up the previously\
    \ saved Hello World code you created. Ensure that there are no visible errors,\
    \ such as a missing semicolon at the end of the std::cout line.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_45_0.png)\n\
    \n**STEP 3**\nWhen you click the Build icon, the pane at the bottom of the Geany\
    \ interface displays some results. If all is well, you will see a successful compilation,\
    \ if not then Geany issues an error along with the line the error was found on.\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_45_1.png)\n\n**STEP 2**\nIf your code\
    \ is ready, look to the menu bar along the top of the Geany window. Notice that\
    \ midway along the line of icons there’s a red brick icon. This is Build, which\
    \ when clicked runs through the code, checking it against the C++ standards to\
    \ see if there are any errors that stop it from running.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_45_2.png)\n\
    \n**STEP 4**\nWith the code successfully built, it’s now time to execute it. Next\
    \ to the Build icon there’s a paper aeroplane icon, this is the Run icon. You\
    \ can’t run code that hasn’t been previously built or has an error in place. Click\
    \ the Run icon.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_45_3.png)\n\n**STEP\
    \ 5**\nWhen you click Run, the C++ code executes and a simple Terminal window\
    \ appears displaying the results of the code. In the case of this simple code,\
    \ you can see the word: Hello, world! in the window; as you've already learned,\
    \ the code is cout\\t\\t-ing (outputting) the contents between the quotes in the\
    \ std::cout line.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_46_0.png)\n\n**STEP\
    \ 6**\nPressing Return/Enter in the command line box closes it, returning you\
    \ to Geany. Let's alter the code slightly. Under the #include line, enter:\n\n\
    `using namespace std;`\n\nThen, delete the std:: part of the Cout line; like so:\n\
    \n`cout << \"Hello, world!\\n\";`\n\n![](img/4aefeb2d095f688b34af6207870c5f39_46_1.png)\n\
    \n**STEP 7**\nIn order to apply the new changes you need to save the file, build\
    \ it and execute it again. Go through the process as before, you don't need to\
    \ change the name of the file unless you want to, of course, followed by clicking\
    \ the Brick icon, then the Aeroplane icon.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_46_2.png)\n\
    \n**STEP 8**\nJust as mentioned previously, you don't need to have std::cout if\
    \ you've already declared the standard namespace at the start of the code. Now,\
    \ let's create a deliberate mistake, to see what happens. Remove the semicolon\
    \ from the cout line, so it reads:\n\n`cout << \"Hello, world!\\n\"`\n\n![](img/4aefeb2d095f688b34af6207870c5f39_46_3.png)\n\
    \n**STEP 9**\nNow try and build the code once more. This time, notice that the\
    \ bottom panel is displaying an error, regarding the missing semicolon. Note that\
    \ error reads as being on line 8, the first character, the closed curly bracket.\
    \ This is because there's an expected semicolon missing before the closed bracket.\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_46_4.png)\n\n**STEP 10**\nReplace the\
    \ semicolon and under the cout line, enter a new line to your code:\n\n`cout <<\
    \ \"And greetings from C++!\\n\";`\n\nThe \\n simply adds a new line under the\
    \ last line of outputted text. Build and Run the code, to display your handiwork.\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_46_5.png)\n\n## Virus!\n\n### DID YOU\
    \ KNOW...\n\nThat one of the first programmed computer viruses that spread outside\
    \ of a controlled system, i.e. into the wild, was called Elk Cloner and it was\
    \ coded in 1982 by Rich Skrenta, a fifteen year old student.\n\nElk Cloner was\
    \ programmed to infect the Apple DOS 3.3 operating system, and attached to a game.\
    \ When the game was played fifty times the virus would be activated and instead\
    \ of displaying the game the virus would blank the screen and display a poem:\n\
    \nElk Cloner:\nThe program with a\npersonality\n\nIt will get on all\nyour disks\n\
    It will infiltrate your\nchips\nYes, it's Cloner!\n\nIt will stick to you\nlike\
    \ glue\nIt will modify RAM too\nSend in the Cloner!\n\n![](img/4aefeb2d095f688b34af6207870c5f39_47_0.png)\n"
  mdcn: "\n\n## C++ 程序的结构\n\nC++ 具有非常明确的结构和做事方式。即使遗漏一个小小的元素，比如分号，整个程序也无法编译和执行。许多专业程序员都曾因结构松散而犯错。\n\
    \n### INCLUDE <C++ 结构>\n\n在学习编程基础知识时，你开始理解程序的结构。命令可能因语言而异，但你可以开始了解代码是如何工作的。\n\n\
    ![](img/4aefeb2d095f688b34af6207870c5f39_43_0.png)\n\n- **C++**\n  C++ 由丹麦学生 Bjarne\
    \ Stroustrup 于 1979 年发明，作为其博士论文的一部分。最初，C++ 被称为“带有类的 C”，它在已经很受欢迎的 C 编程语言的基础上增加了功能，同时通过新的结构使其成为更用户友好的环境。\n\
    \n- **INT MAIN()**\n  `int main()` 启动函数声明，这是一组名为 `main` 的代码语句。无论代码实际位于何处，所有 C++\
    \ 代码都从 main 函数开始。\n\n```cpp\nhelloworld.cpp\n1  #include <iostream>\n2\n3  int\
    \ main()\n4\n5\n```\n\n- **#INCLUDE**\n  C++ 程序的结构相当精确。每个 C++ 代码都从一个指令开始：`#include\
    \ <...>`。该指令指示预处理器包含标准 C++ 代码的一个部分。例如：`#include <iostream>` 包含 iostream 头文件以支持输入/输出操作。\n\
    \n```cpp\nhelloworld.cpp\n1  #include <iostream>\n2\n3\n4\n```\n\n- **BRACES**\n\
    \  开括号（花括号）是你可能以前没接触过的东西，特别是如果你习惯使用 Python。开括号表示 main 函数的开始，并包含属于该函数的所有代码。\n\n\
    ```cpp\nhelloworld.cpp\n1  #include <iostream>\n2\n3  int main()\n4  {\n5\n6 \
    \ }\n7\n8\n```\n\n### 注释\n\n以双斜杠开头的行是注释。这意味着它们不会在代码中执行，并被编译器忽略。注释旨在帮助你，或帮助查看你代码的其他程序员，解释正在发生什么。有两种类型的注释：`//`\
    \ 用于多行注释，`/*` 用于单行注释。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_44_0.png)\n\n\
    这里使用的两个尖括号是插入运算符。这意味着尖括号后面的任何内容都将插入到 `std::cout` 语句中。在这种情况下，它们是单词“Hello, world”，这些将在你编译和执行代码时显示在屏幕上。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_44_1.png)\n\n**STD** 虽然 std 代表完全不同的东西，但在\
    \ C++ 中它表示 Standard（标准）。它是 C++ 标准命名空间的一部分，涵盖了许多不同的语句和命令。你可以省略代码中的 `std::` 部分，但必须在开始时声明：`using\
    \ namespace std;`，两者不能同时存在。例如：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_44_2.png)\n\n**OUTPUTS**\
    \ 继续下去，“Hello, world!” 部分是当代码执行时你希望出现在屏幕上的内容。只要它在引号内，你可以输入任何喜欢的内容。根据编译器的不同，有时需要括号。`\\\
    n` 部分表示要插入一个新行。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_44_3.png)\n\n**COUT**\
    \ 在这个例子中，我们使用 `cout`，它是标准命名空间的一部分，这就是它存在的原因，因为你要求 C++ 从该特定命名空间使用它。`cout` 表示 Character\
    \ OUtput（字符输出），它显示或打印某些内容到屏幕上。如果你省略 `std::`，你必须像之前提到的那样在代码开头声明它。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_44_4.png)\n\
    \n**}; AND }** 最后你可以看到，函数代码块内的行（除了注释）以分号结尾。这标记了语句的结束；C++ 中的所有语句末尾必须有一个分号，否则编译器无法构建代码。最后一行有闭合括号，表示\
    \ main 函数的结束。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_44_5.png)\n\n## 编译和执行\n\
    \n你创建了第一个 C++ 程序，现在你理解了其结构的基础知识。让我们行动起来，编译并执行（或者如果你更喜欢，运行）程序，看看它看起来怎么样。\n\n###\
    \ 来自 C++ 的问候\n\n从 Geany 内部编译和执行代码非常简单，只需点击几个图标并查看结果。以下是操作方法。\n\n**步骤 1**\n打开 Geany（如果尚未打开），并加载你之前保存的\
    \ Hello World 代码。确保没有可见的错误，例如 `std::cout` 行末尾缺少分号。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_45_0.png)\n\
    \n**步骤 3**\n当你点击构建图标时，Geany 界面底部的窗格会显示一些结果。如果一切正常，你将看到成功的编译；如果没有，Geany 会发出错误，并指出发现错误的行。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_45_1.png)\n\n**步骤 2**\n如果你的代码已准备好，请查看\
    \ Geany 窗口顶部的菜单栏。注意，在图标行中间有一个红色砖块图标。这是“构建”，点击它会对代码进行运行，对照 C++ 标准检查是否有阻止其运行的错误。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_45_2.png)\n\n**步骤 4**\n代码成功构建后，现在是执行它的时候了。在构建图标旁边有一个纸飞机图标，这是“运行”图标。你不能运行未之前构建或有错误的代码。点击运行图标。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_45_3.png)\n\n**步骤 5**\n当你点击运行时，C++\
    \ 代码执行，并出现一个简单的终端窗口显示代码的结果。对于这个简单的代码，你可以看到窗口中的单词：Hello, world!；如前所述，代码正在 `cout`（输出）`std::cout`\
    \ 行中引号之间的内容。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_46_0.png)\n\n**步骤 6**\n\
    在命令行框中按下回车/Enter 关闭它，返回 Geany。让我们稍微修改代码。在 `#include` 行下方，输入：\n\n`using namespace\
    \ std;`\n\n然后，删除 Cout 行中的 `std::` 部分；如下所示：\n\n`cout << \"Hello, world!\\n\";`\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_46_1.png)\n\n**步骤 7**\n为了应用新的更改，你需要保存文件，构建它并再次执行它。像以前一样经历这个过程，当然，除非你想修改文件名，否则不需要修改文件名，然后点击砖块图标，再点击飞机图标。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_46_2.png)\n\n**步骤 8**\n正如之前提到的，如果你已经在代码开头声明了标准命名空间，就不需要\
    \ `std::cout`。现在，让我们故意制造一个错误，看看会发生什么。从 `cout` 行中删除分号，使其读取为：\n\n`cout << \"Hello,\
    \ world!\\n\"`\n\n![](img/4aefeb2d095f688b34af6207870c5f39_46_3.png)\n\n**步骤 9**\n\
    现在再次尝试构建代码。这一次，注意到底部面板正在显示一个关于缺少分号的错误。注意错误显示在第 8 行，第一个字符，闭合花括号处。这是因为在闭合括号前缺少了一个预期的分号。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_46_4.png)\n\n**步骤 10**\n替换分号，并在 `cout`\
    \ 行下方为你的代码输入一个新行：\n\n`cout << \"And greetings from C++!\\n\";`\n\n`\\n` 只是在最后一行输出文本下方添加一个新行。构建并运行代码，以显示你的作品。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_46_5.png)\n\n## 病毒！\n\n### 你知道吗……\n\
    \n第一个在受控系统之外传播的编程计算机病毒之一，即进入野外，被称为 Elk Cloner，它由 15 岁的学生 Rich Skrenta 在 1982 年编写代码。\n\
    \nElk Cloner 被编程用于感染 Apple DOS 3.3 操作系统，并附带在一个游戏中。当游戏玩到五十次时，病毒会被激活，病毒不会显示游戏，而是会清空屏幕并显示一首诗：\n\
    \nElk Cloner:\nThe program with a\npersonality\n\nIt will get on all\nyour disks\n\
    It will infiltrate your\nchips\nYes, it's Cloner!\n\nIt will stick to you\nlike\
    \ glue\nIt will modify RAM too\nSend in the Cloner!\n\n![](img/4aefeb2d095f688b34af6207870c5f39_47_0.png)\n\
    \n"
