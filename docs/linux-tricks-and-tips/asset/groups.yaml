  - '[PAGE 22]


    # Numbers and Expressions


    **STEP 5** You can also use an operation to see the remainder left over from division.
    For example:


    **10/3**


    Will display 3.333333333, which is of course 3.3-recurring. If you now enter:


    **10%3**


    This will display 1, which is the remainder left over from dividing 10 into 3.


    ![](img/4aefeb2d095f688b34af6207870c5f39_22_0.png)


    **STEP 6** Next up we have the power operator, or exponentiation if you want to
    be technical. To work out the power of something you can use a double multiplication
    symbol or double-star on the keyboard:


    **2\*\*3**


    **10\*\*10**


    Essentially, it’s 2x2x2 but we’re sure you already know the basics behind maths
    operators. This is how you would work it out in Python.


    ![](img/4aefeb2d095f688b34af6207870c5f39_22_1.png)


    **STEP 7** Numbers and expressions don’t stop there, Python has numerous built-in
    functions to work out sets of numbers, absolute values, complex numbers and a
    host of mathematical expressions and Pythagorean tongue-twisters. For example,
    to convert a number to binary, use:


    **bin(3)**


    ![](img/4aefeb2d095f688b34af6207870c5f39_22_2.png)


    **STEP 8** This will be displayed as ‘0b11’, converting the integer into binary
    and adding the prefix 0b to the front. If you want to remove the 0b prefix, then
    you can use:


    **format(3, ‘b’)**


    The Format command converts a value, the number 3, to a formmatted representation
    as controlled by the format specification, the ‘b’ part.


    ![](img/4aefeb2d095f688b34af6207870c5f39_22_3.png)


    **STEP 9** A Boolean Expression is a logical statement that will either be true
    or false. We can use these to compare data and test to see if it’s equal to, less
    than or greater than. Try this in a New File:


    ![](img/4aefeb2d095f688b34af6207870c5f39_22_4.png)


    **STEP 10** Execute the code from Step 9, and you can see a series of True or
    False statements, depending on the result of the two defining values: 6 and 7.
    It’s an extension of what you’ve looked at, and an important part of programming.


    ![](img/4aefeb2d095f688b34af6207870c5f39_22_5.png)'
  - '[PAGE 23]


    # Using Comments


    When writing your code, the flow, what each variable does, how the overall program
    will operate and so on is all inside your head. Another programmer could follow
    the code line by line but over time, it can become difficult to read.


    # #COMMENTS!


    Programmers use a method of keeping their code readable by commenting on certain
    sections. If a variable is used, the programmer comments on what it’s supposed
    to do, for example. It’s just good practise.


    **STEP 1**

    Start by creating a new instance of the IDLE Editor (File > New File) and create
    a simple variable and print command:


    ```

    ```

    a=10

    print("The value of A is,", a)

    ```

    Save the file and execute the code.

    ```


    ![](img/4aefeb2d095f688b34af6207870c5f39_23_0.png)


    **STEP 3**

    Resave the code and execute it. You can see that the output in the IDLE Shell
    is still the same as before, despite the extra lines being added. Simply put,
    the hash symbol (#) denotes a line of text the programmer can insert to inform
    them, and others, of what’s going on without the user being aware.


    ![](img/4aefeb2d095f688b34af6207870c5f39_23_1.png)


    **STEP 2**

    Running the code will return the line: The value of A is, 10 into the IDLE Shell
    window, which is what we expected. Now, add some of the types of comments you’d
    normally see within code:


    ```

    ```

    # Set the start value of A to 10

    a=10

    # Print the current value of A

    print("The value of A is,", a)

    ```

    ```


    ![](img/4aefeb2d095f688b34af6207870c5f39_23_2.png)


    **STEP 4**

    Let’s assume that the variable A that we’ve created is the number of lives in
    a game. Every time the player dies, the value is decreased by 1. The programmer
    could insert a routine along the lines of:


    ```

    ```

    a=a-1

    print("You’ve just lost a life!")

    print("You now have", a, "lives left!")

    ```

    ```


    ![](img/4aefeb2d095f688b34af6207870c5f39_23_3.png)'
