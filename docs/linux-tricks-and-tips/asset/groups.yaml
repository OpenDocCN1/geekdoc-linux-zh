  mdcn: "\n\n# Linux 上的 Python\n\n![](img/4aefeb2d095f688b34af6207870c5f39_35_0.png)\n\
    \n格蕾丝·霍珀海军上将，自 20 世纪 40 年代起便开始调试计算机\n\n# 你知道吗……\n\n# 调试\n\n**你知道吗……** 在计算机术语中，“调试”（debugging）一词源于格蕾丝·霍珀海军上将。早在\
    \ 20 世纪 40 年代，她正在一台庞大的哈佛 Mark II 机电计算机上工作。根据传说，霍珀发现一只蛾子卡在了继电器中，导致系统停止工作。因此，移除这只蛾子的过程就被称为调试。\n\
    \n“软件开发中最重要的一个方面是明确你要构建什么。”\n\n– 比约恩·斯特鲁普 *(C++ 的开发者与创造者)*\n\n![](img/4aefeb2d095f688b34af6207870c5f39_37_0.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_38_0.png)\n\n# Linux 上的 C++\n\nC++\
    \ 是一种卓越的高级编程语言，广泛应用于多种技术中。从你最喜欢的移动应用、主机和 PC 游戏，到整个操作系统，其核心都使用了 C++ 进行开发，并辅以一系列软件开发工具包（SDK）和自定义库。\n\
    \nC++ 是你日常生活中使用的大多数技术背后的驱动力，这使其成为一种复杂且极其强大的语言，需要投入精力去掌握。它是 Linux 本身的代码基础，也是大多数（如果不是全部）操作系统中绝大多数场景驱动、库文件和控件的核心。\n\
    \n本节将展示如何在树莓派上使用 C++ 开始编码。在此基础上，你可以开始创造伟大的事物。\n\n## 为什么选择 C++？\n\n> C++ 是当今最流行的编程语言之一。最初被称为“带类的\
    \ C”（C with Classes），该语言在 1983 年被重命名为 C++。它是原始 C 语言的扩展，是一个通用的面向对象（OOP）环境。\n\n\
    ### C 的所有功能\n\n由于该语言的复杂性，以及其强大的功能和性能，C++ 通常用于开发游戏、程序、设备驱动程序，甚至整个操作系统。\n\n追溯到 1979\
    \ 年，也就是家用计算机黄金时代的开端，C++（更准确地说是“带类的 C”）是丹麦计算机科学家比约恩·斯特鲁普（Bjarne Stroustrup）在其博士论文研究期间的产物。斯特鲁普的计划是进一步发展原始\
    \ C 语言，该语言自 20 世纪 70 年代初以来就被广泛使用。\n\nC++ 在 20 世纪 80 年代的开发者中广受欢迎，因为它比 C 语言更容易上手，更重要的是，它与原始\
    \ C 语言保持了 99% 的兼容性。这意味着它的使用不仅仅局限于主流计算实验室，普通民众在没有访问大型机和大型计算数据中心的情况下也可以使用它。\n\n\
    C++ 在数字世界的影响是巨大的。许多程序、应用程序、游戏甚至操作系统都是使用 C++ 编写的。例如，Adobe 的所有主要应用程序，如 Photoshop、InDesign\
    \ 等，都是用 C++ 开发的。你会发现你用来浏览互联网的浏览器也是用 C++ 编写的，Windows 10、Microsoft Office 以及谷歌搜索引擎的骨干也是如此。苹果的\
    \ macOS 主要使用 C++ 编写（根据功能不同混合了一些其他语言），NASA、SpaceX 甚至 CERN 也使用 C++ 用于各种应用程序、程序、控制以及其他计算任务。\n\
    \n> C++ 代码比 Python 快得多。\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
    void main()\n{\n    char ch;\n    cout<<\"Enter a character to check it is vowel\
    \ or not\";\n    cin>>ch;\n    switch(ch)\n    {\n        case'a': case'A':\n\
    \        cout<<ch<<\" is a Vowel\";\n        break;\n        case 'e': case'E':\n\
    \        cout<<ch<<\" is a Vowel\";\n        break;\n        case 'i': case'I':\n\
    \        cout<<ch<<\" is a Vowel\";\n        break;\n        case 'o': case'O':\n\
    \        cout<<ch<<\" is a Vowel\";\n        break;\n        case 'u': case'U':\n\
    \        cout<<ch<<\" is a Vowel\";\n        break;\n        default:\n    }\n\
    }\n```\n\n# 为什么选择 C++？\n\n![](img/4aefeb2d095f688b34af6207870c5f39_40_0.png)\n\
    \n# 微软的 Visual Studio 是一个学习 C++ 的绝佳且免费的环境。\n\nC++ 还极其高效，各方面表现良好，并且作为核心 C 语言的一个更简单的扩展。与其他语言（如\
    \ Python、BASIC 等）相比，这种更高的性能使其成为现代计算的理想开发环境，因此前述公司如此广泛地使用它。\n\n虽然 Python 是一门很好的入门编程语言，但\
    \ C++ 将开发者置于更广阔的编码世界中。通过精通 C++，你可能会发现自己为微软、苹果等公司开发代码。通常，C++ 开发者的薪水比其他一些语言的程序员更高，而且由于其通用性，C++\
    \ 程序员可以在不同工作和公司之间流动，而无需重新学习任何特定内容。然而，Python 是一门更容易入门的语言。如果你是编程新手，我们建议你\n\n![](img/4aefeb2d095f688b34af6207870c5f39_40_1.png)\n\
    \n从 Python 开始，花些时间去熟悉编程结构以及通过编程解决问题的多种途径和手段。一旦你能轻松地上电脑并闭上一只手（比喻手法，意为轻松/单手操作，原文语境为\
