  - "[PAGE 31]\n\n![](img/4aefeb2d095f688b34af6207870c5f39_31_0.png)\n\n\n\n# # Conditions\
    \ and Loops\n\nConditions and loops are what make a program interesting; they\
    \ can be simple or rather complex. How you use them depends greatly on what the\
    \ program is trying to achieve; they could be the number of lives left in a game\
    \ or just displaying a countdown.\n\n# ## TRUE CONDITIONS\n\nKeeping conditions\
    \ simple to begin with makes learning to program a more enjoyable experience.\
    \ Let’s start then by checking if something is TRUE, then doing something else\
    \ if it isn’t.\n\n+   **STEP 1** Let’s create a new Python program that will ask\
