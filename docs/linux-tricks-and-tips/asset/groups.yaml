    \ \n    cout << num1 << \" + \" << num2 << \" is: \" << num1 + num2 << \"\\n\"\
    ;\n}\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_60_2.png)\n\n- **步骤 8**\
    \  \n  虽然 `cin` 在大多数输入任务中表现良好，但它确实有一个局限性。`cin` 始终将空格视为终止符，因此它专为单个单词设计，而非多个单词。然而，`getline`\
    \ 将 `cin` 作为第一个参数，将变量作为第二个参数：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    string mystr;\n    \n    cout << \"Enter a sentence:\
    \ \\n\";\n    getline(cin, mystr);\n    \n    cout << \"Your sentence is: \" <<\
    \ mystr.size() << \" characters long.\\n\";\n}\n```\n\n- **步骤 9**  \n  编译并执行代码，然后输入一个包含空格的句子。完成后，代码读取字符数量。如果你移除\
    \ `getline` 并用 `cin >> mystr` 替换它，再试一次，结果将显示直到第一个空格之前的字符数量。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_60_3.png)\n\
    \n- **步骤 10**  \n  `getline` 通常是新 C++ 程序员常常忘记包含的命令。当你无法弄清楚代码为什么不起作用时，末尾的空白字符就很烦人。简而言之，将来最好使用\
    \ `getline(cin, variable)`：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main ()\n{\n    string name;\n    \n    cout << \"Enter your full name:\
    \ \\n\";\n    getline(cin, name);\n    \n    cout << \"\\nHello, \" << name <<\
    \ \"\\n\";\n}\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_60_4.png)\n\n##\
    \ 霍比特人\n\n**你知道吗……** 于 1982 年发布在各个平台上的墨尔本屋（Melbourne House）出品的《霍比特人》是一部编程杰作。由\
    \ Philip Mitchell 和 Veronika Megler 博士开发，《霍比特人》独特地使用了名为“Inlish”的解析器进行编码，允许玩家输入完整的句子，例如“从甘道夫手中拿走剑，并用它杀死哥布林”。\n\
    \n此外，游戏中的每个物体都有特定的大小、重量和硬度；因此，如果你坐在凳子上，而某人拿起或扔掉了凳子，那么你的角色也会随之移动。而且，在游戏早期版本中，非玩家角色（NPC）经常会在地图上移动，甚至在玩家到达该阶段之前就会捕捉并杀死彼此。游戏中还设有一个随机化事件，每次游戏开始时，任何角色都可以从任何位置拾取一个随机物体。这意味着，有可能，索林会把你拾起并在整个冒险过程中携带你。对于一款占用内存不到\
    \ 38KB 的游戏来说，这非常了不起。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_61_0.png)\n\n\
    ## 先锋 48K ZX Spectrum\n\n![](img/4aefeb2d095f688b34af6207870c5f39_62_0.png)\n\n\
    ### 霍比特人\n\n《霍比特人》是一个超级程序，是计算机软件史上的里程碑。你将以文字和图形的形式面临危险、刺激和冒险。与《霍比特人》中的所有角色见面，并用普通英语与他们交谈！《霍比特人》程序为你带来一个激动人心且充满挑战的奇幻未来！\n\
    \n#### 墨尔本屋\n\n霍比特人，1982 年高级编码的奇迹。\n\n## 常见编码错误\n\n当你开始接触新事物时，你不可避免地会犯错，这纯粹是由于经验不足，而这些错误本身就是极好的老师。然而，即使是专家也会偶尔出错。关键在于，尽可能地从错误中吸取教训。\n\
    \n### X = 错误，输出 Y\n\n程序员需要意识到许多陷阱，这里无法一一列举。能够识别错误并修复它是你开始进入更高级领域并成为更好编码者的标志。每个人都会犯错，即使是拥有三十年以上经验的程序员也是。从这些基本且常见的错误中吸取教训有助于建立更好的编码基础。\n\
    \n### 小模块\n\n如果能像《黑客帝国》电影中的 Neo 那样工作就好了。只需询问，你的操作员就会将其加载到你的内存中，你立刻就会了解关于该主题的一切。遗憾的是，我们无法做到这一点。第一个主要陷阱是有人试图学得太多、太快。因此，要分小块学习编码，并从容不迫。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_63_0.png)\n\n### 易读变量\n\n为变量赋予有意义的名称是消除常见编码错误的关键。使用字母表中的字母是可以的，但如果代码显示\
    \ x 变量存在问题怎么办。给变量命名并不太难，例如 `lives`（生命）、`money`（金钱）、`player1`（玩家1）等等。\n\n```javascript\n\
    var points = 1023;\nvar lives = 3;\nvar totalTime = 45;\nwrite(\"Points: \"+points);\n\
    write(\"Lives: \"+lives);\nwrite(\"Total Time: \"+totalTime+\" secs\");\nwrite(\"\
    --------------------------------\");\nvar totalScore = 0;\nwrite(\"Your total\
    \ Score is: \"+totalScore);\n```\n\n### // 注释\n\n使用注释。这是一个简单的概念，但给你的代码添加注释，当你下次回顾代码时会节省很多麻烦。插入注释行有助于你快速筛选出导致问题的代码部分；如果你需要审查较旧的代码段，这也很有用。\n\
    \n```c\n52    orig am 2;\n53    target = 2;\n54    --Fj\n\n56    #endif\n57  \
    \  if (m == 0)\n58        return;\n59\n60    //\n61    // Loop unrolling.  Here\
    \ be dragons.\n62    //\n63\n64    // (n & (~3)) is the greatest multiple of 4\
    \ le\n65    // in the while loop ahead, orig will move ov\n66    // increments\
    \ (4 elements of 2 bytes).\n67    // end makes our barrier for not falling out\n\
    68    char const * const end = orig + 2 * (n & (~3)\n\n70    // See if we're aligned\
    \ for writing in 64 o\n71    #if ARCH_SIZEOF_LONG == 8 & \\\n72        ((defined(\
    \ x_amd64 ) || defined( x_86_64\n```\n\n### 提前规划\n\n虽然某天早晨醒来决定编码一个经典文本冒险游戏很棒，但没有良好的计划并不总是可行的。短小的代码片段可以在不太多加思考的情况下编写，但更长、更深入代码需要遵循良好的工作计划来帮助消除错误。\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_63_1.png)\n\n![](img/4aefeb2d095f688b34af6207870c5f39_63_2.png)\n\
    \n"
