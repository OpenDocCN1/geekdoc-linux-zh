    \n- **STEP 4**  \nOnce the update and upgrade completes, enter: `python3 --version`\
    \ again to see if Python 3.x is updated or even installed; as long as you have\
    \ Python 3.x, you’re running the most recent major version. The numbers after\
    \ the 3. indicate patches and further updates. Often they’re unnecessary but can\
    \ contain vital new elements.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_9_3.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_10_0.png)\n\nHowever, if you want the\
    \ latest, cutting edge version, you need to build Python from source. Start by\
    \ entering these commands into the Terminal:\n\n- **STEP 5**\n\n```bash\nsudo\
    \ apt-get install build-essential checkinstall\nsudo apt-get install libssl-dev\
    \ liblz2-dev libncurses5-dev libssl-dev libgdbm libsqlite3-dev tk-dev\nlibtcl-dev-dev\
    \ libbz2-dev libg2z2-dev\n```\n\n![](img/4aefeb2d095f688b34af6207870c5f39_10_1.png)\n\
    \n- **STEP 6**\n\nOpen up your Linux web browser and go to the Python download\
    \ page: www.python.org/downloads. Click on Downloads followed by the button under\
    \ the Python Source window. This opens a download dialogue box; choose a location\
    \ and start the download process.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_10_2.png)\n\
    \n- **STEP 7**\n\nIn the Terminal, go to the Downloads folder by entering `cd\
    \ Downloads/`. Then unzip the contents of the downloaded Python source code with\
    \ `tar -xvf Python-3.Y.Y.tar.xz` replacing the Y's with the version numbers you've\
    \ downloaded. Now enter the newly unzipped folder with `cd Python-3.Y.Y/`.\n\n\
    ![](img/4aefeb2d095f688b34af6207870c5f39_10_3.png)\n\n- **STEP 8**\n\nWithin the\
    \ Python folder, enter:\n\n```bash\n./configure\nsudo make altinstall\n```\n\n\
    This could take a while depending on the speed of your computer. Once finished,\
    \ enter `python3.7 --version` to check the installed latest version. You now have\
    \ Python 3.7 installed, alongside older Python 3.x.x and Python 2.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_10_4.png)\n\
    \n- **STEP 9**\n\nFor the GUI IDLE, you need to enter the following command into\
    \ the Terminal:\n\n```bash\nsudo apt-get install idle3\n```\n\nThe IDLE can then\
    \ be started with the command `idle3`. Note that IDLE runs a different version\
    \ from the one you installed from source.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_10_5.png)\n\
    \n- **STEP 10**\n\nYou also need PIP (Pip Installs Packages) which is a tool to\
    \ help you install more modules and extras.\n\nEnter: `sudo apt-get install python3-pip`\n\
    \nWhen PIP is installed, check for the latest update with: `pip3 install --upgrade\
    \ pip`\n\nWhen complete, close the Terminal and Python 3.x will be available via\
    \ the Programming section in your distro's menu.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_10_6.png)\n\
    \n## Starting Python for the First Time\n\nIf you're using the new Raspberry Pi\
    \ together with its latest release of the Pi OS, then you will need to manually\
    \ install the Python IDLE. This is due to the Pi team removing the core Python\
    \ IDLE in favour of their own coding text editor.\n\n### STARTING PYTHON\n\nFor\
    \ those using the Pi4 and new Raspbian, drop into a Terminal and enter: `sudo\
    \ apt-get install idle3`. Older versions of Raspbian already have the official\
    \ Python IDLE pre-installed.\n\n- **STEP 1**\n\nWith the Raspbian desktop loaded,\
    \ click on the Menu button followed by Programming > Python 3 (IDLE). This opens\
    \ the Python 3 Shell. Windows and Mac users can find the Python 3 IDLE Shell from\
    \ within the Windows Start button menu and via Finder.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_11_0.png)\n\
    \n- **STEP 2**\n\nThe Shell is where you can enter code and see the responses\
    \ and output of code you've programmed into Python. This is a kind of sandbox,\
    \ where you're able to try out some simple code and processes.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_11_1.png)\n\
    \n- **STEP 3**\n\nFor example, in the Shell enter: `2+2`. After pressing Enter,\
    \ the next line displays the answer: 4. Basically, Python has taken the ‘code’\
    \ and produced the relevant output.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_11_2.png)\n\
    \n- **STEP 4**\n\nThe Python Shell acts very much like a calculator, since code\
    \ is basically a series of mathematical interactions with the system. Integers,\
    \ which are the infinite sequence of whole numbers can easily be added, subtracted,\
    \ multiplied and so on.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_11_3.png)\n\
    \n- **STEP 5**\n\nWhile that's very interesting, it's not particularly exciting.\
    \ Instead, try this:\n\n`print(\"Hello everyone!\")`\n\nJust enter it into the\
    \ IDLE as you've done in the previous steps.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_12_0.png)\n\
    \n- **STEP 6**\n\nThis is a little more like it, since you've just produced your\
    \ first bit of code. The Print command is fairly self-explanatory, it prints things.\
    \ Python 3 requires the brackets as well as quote marks in order to output content\
    \ to the screen, in this case the `Hello everyone!` bit.\n\n```python\n>>> print(\"\
    Hello everyone!\")\nHello everyone!\n>>> \n```\n\n- **STEP 7**\n\nYou may have\
    \ noticed the colour coding within the Python IDLE. The colours represent different\
    \ elements of Python code. They are:\n\nBlack – Data and Variables  \nGreen –\
    \ Strings  \nPurple – Functions  \nOrange – Commands  \nBlue – User Functions\
    \  \nDark Red – Comments  \nLight Red – Error Messages\n\n#### IDLE Colour Coding\n\
    \n| Colour | Use for | Examples |\n| :--- | :--- | :--- |\n| Black | Data & variables\
    \ | `23 . 6` `<area` |\n| Green | Strings | `\"Hello World\"` |\n| Purple | Functions\
    \ | `len() print()` |\n| Orange | Commands | `if for else` |\n| Blue | User functions\
    \ | `get_area()` |\n| Dark red | Comments | `#Remember VAT` |\n| Light red | Error\
    \ messages | `SyntaxError:` |\n\n- **STEP 8**\n\nThe Python IDLE is a configurable\
    \ environment. If you don't like the way the colours are represented, then you\
    \ can always change them via Options > Configure IDLE and clicking on the Highlighting\
    \ tab. However, we don't recommend that, as you won't be seeing the same as our\
    \ screenshots.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_12_1.png)\n\n- **STEP\
    \ 9**\n\nJust like most programs available, regardless of the operating system,\
    \ there are numerous shortcut keys available. There is not much room for them\
    \ all here but within the Options > Configure IDLE and under the Keys tab, you\
    \ can see a list of the current bindings.\n\n![](img/4aefeb2d095f688b34af6207870c5f39_12_2.png)\n\
    \n- **STEP 10**\n\nThe Python IDLE is a power interface and one that's actually\
    \ been written in Python using one of the available GUI toolkits. If you want\
    \ to know the many ins and outs of the Shell, we recommend you take a few moments\
    \ to view www.docs.python.org/3/library/idle.html, which details many of the IDLE's\
    \ features.\n\n```\n25.5.5. IDLE\nSource code: Lib/idle\nThis file is part of\
    \ Python's Integrated Development and Learning Environment...\n* **25.5.1. Main\
    \ menu**\n* **25.5.1.1. File menu (Shell and Editor)**\n* **25.5.1.2. Edit menu**\n\
    ```\n"
  mdcn: "\n\n## 如何在 Linux 中设置 Python\n\n虽然 Raspberry Pi 的操作系统包含最新稳定版的 Python，但其他 Linux\
    \ 发行版并未预装 Python 3。如果你不打算采用 Pi 路线，以下是检查并在 Linux 中安装 Python 的方法。\n\n### 企鹅与 PYTHON\n\
    \nLinux 是一个功能极其强大的操作系统，以至于往往很难确定某项操作的唯一执行方式。不同的发行版通过不同的方式安装软件，因此本教程将使用 Linux Mint。\n\
    \n- **步骤 1**  \n首先，你需要确定当前 Linux 系统中安装了哪个版本的 Python。为此，可以从发行版的菜单进入终端会话，或按下 Ctrl+Alt+T\
    \ 键。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_9_0.png)\n\n- **步骤 2**  \n接着在终端中输入\
    \ `python --version`。你应该会在显示中看到与 Python 2.x 版本相关的输出。默认情况下，大多数 Linux 发行版同时自带 Python\
    \ 2 和 3，因为目前仍有许多 Python 2 的代码可用。然后输入：`python3 --version`。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_9_1.png)\n\
    \n- **步骤 3**  \n在我们这个案例中，Python 2 和 3 均已安装；只要安装了 Python 3.x，我们教程中的代码就可以运行。检查发行版是否已更新至最新版本总是值得的，因此输入\
    \ `sudo apt-get update && sudo apt-get upgrade` 来更新系统。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_9_2.png)\n\
    \n- **步骤 4**  \n更新和升级完成后，再次输入 `python3 --version` 以查看 Python 3.x 是否已更新或安装；只要你拥有\
    \ Python 3.x，你就正在使用最新的重大版本。3. 后面的数字表示补丁和进一步的更新。通常这些是不必要的，但可能包含重要的新元素。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_9_3.png)\n\
    \n![](img/4aefeb2d095f688b34af6207870c5f39_10_0.png)\n\n然而，如果你想要最新的前沿版本，你需要从源代码构建\
    \ Python。首先将这些命令输入到终端中：\n\n- **步骤 5**\n\n```bash\nsudo apt-get install build-essential\
    \ checkinstall\nsudo apt-get install libssl-dev liblz2-dev libncurses5-dev libssl-dev\
    \ libgdbm libsqlite3-dev tk-dev\nlibtcl-dev-dev libbz2-dev libg2z2-dev\n```\n\n\
    ![](img/4aefeb2d095f688b34af6207870c5f39_10_1.png)\n\n- **步骤 6**\n\n打开你的 Linux\
    \ 网络浏览器，前往 Python 下载页面：www.python.org/downloads。点击 Downloads，然后是 Python Source\
    \ 窗口下方的按钮。这将打开一个下载对话框；选择一个位置并开始下载过程。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_10_2.png)\n\
    \n- **步骤 7**\n\n在终端中，通过输入 `cd Downloads/` 进入 Downloads 文件夹。然后使用 `tar -xvf Python-3.Y.Y.tar.xz`\
    \ 解压下载的 Python 源代码内容，将 Y 替换为你下载的版本号。现在使用 `cd Python-3.Y.Y/` 进入新解压的文件夹。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_10_3.png)\n\
    \n- **步骤 8**\n\n在 Python 文件夹内，输入：\n\n```bash\n./configure\nsudo make altinstall\n\
    ```\n\n根据计算机速度，这可能花费一些时间。完成后，输入 `python3.7 --version` 以检查安装的最新版本。你现在已安装了 Python\
    \ 3.7，与较旧的 Python 3.x.x 和 Python 2 并存。\n\n![](img/4aefeb2d095f688b34af6207870c5f39_10_4.png)\n\
    \n- **步骤 9**\n\n对于 GUI IDLE，你需要在终端中输入以下命令：\n\n```bash\nsudo apt-get install idle3\n\
