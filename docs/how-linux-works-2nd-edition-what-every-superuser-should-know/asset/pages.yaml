    The following sections outline reasonable defaults for new users.


    # 13.5.1 Shell Defaults


    The default for any new user on a Linux system should be `bash` because:


    +   - Users interact with the same shell that they use to write scripts (for example,
    `csh` is a notoriously bad scripting tool—don''t even think about it)

    - `bash` is standard on Linux Systems.

    - `bash` uses readline, and therefore its interface is identical to that of many
    other tools.

    - `bash` gives you fine, easy-to-understand control over I/O redirection and handles.

    - However, many seasoned Unix use shells such as `csh` and `tcsh` simply because
    they can''t bear to switch. Of course, you may choose any shell you like, but
    choose `bash` if you don''t have any preference, and use `bash` as the default
    for any new user. (A user can change his or her shell with the `chsh` command
    to suit individual preferences.)


    # NOTE


    There are plenty of shells out there (`rc`, `csh`, `zsh`, `es`, and so on). Some
    are not appropriate as beginners, but `zsh` and `fish` are sometimes popular with
    new users looking for an alternative shell.


    # 13.5.2 Editor


    On a traditional system, the default editor should be `vi` or `emacs`. These are
    the editors virtually guaranteed to exist on any fairly Unix system, which means
    they''ll cause the least trouble in the long run for a new user. Linux distributions
    often configure `nano` to be the default editor, it''s easier for beginners to
    use.


    With shell startup files, large default editor files. A little `showmatch` in
    the `.xrc` startup file never anyone but clear of anything that significantly
