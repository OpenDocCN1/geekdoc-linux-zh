    # 12.4.7 Home Directories


    You can add a section [homes] to your smb.conf file if you want to export home
    directories to users. The section should look like this:


    ```

    [homes]


    comment = home directories

    browseable = no

    writable = yes

    ```


    By default, Samba reads the logged-in user''s /etc/passwd entry to determine their
    home directory for [homes]. However, if you don''t want Samba to follow this behavior
    (that is, you want to keep the Windows home directories in a different place than
    the regular Linux home directories), you can use the % substitution in a path
    parameter. Here''s how you would switch a user''s [homes] directory to /u/user:

    path = /u/%


    Samba substitutes the current username for the %S.


    # 12.4.8 Sharing Printers


    You can export all of your printers to Windows clients by adding a [printers]
    section to your smb.conf file. Here''s how the section looks when you are using
    CUPS, the standard Unix printing system:


    ```

    [printers]

    comment = Printers

    browseable = yes

    printing = CUPS

    path = cups

    printable = yes

    writable = no

    ```


    To use the printing = CUPS parameter, your Samba installation must be configured
    and linked against the CUPS library.


    > NOTE


    Depending on your configuration, you may also want to allow guest access to your
    printers with the guest ok = yes option than giving a Samba password or account
    to everyone who needs to access the printers. For example, it is easy to limit
    printers to a single subnet with firewall rules.'
