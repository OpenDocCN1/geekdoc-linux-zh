  md: 'setup typically works like this:


    +   1. You create a systemd (call it Unit A) for the system service that you''d
    like to provide, as normal.


    +   2. You identify a system resource as a network port/socket, file, or device
    that Unit A uses to offer its services.


    +   3. You create another system unit, Unit R, to represent resource. These units
    have special types such as socket units, path units, and device units.


    Operationally, it goes like this:


    +   1. Upon activation of Unit R, system monitors the resource.


    +   2. When anything tries to access the resource, systemd blocks the resource,
    and the input to the resource is buffered.


    +   3. system activates Unit A.


    +   4. When the service from Unit A is ready, it takes control of the resource,
    reads the buffered input, and runs normally.


    There are a few concerns:


    +   You must make sure that your resource unit covers everything that the service
    provides. This normally isn''t a problem, as most services have just one point
    of access.


    +   You need to make sure your resource unit is tied to the service unit that
    it represents. This can be implicit or explicit, and in many cases, options represent
    different ways for systemd to perform the handoff to the service unit.


    +   All others know how to interface with units that systemd can provide.


    If you already know utilities like `inetd`, `xinetd`, and `automount`, you''ll
    see that there are a lot of similarities. Indeed, the concept is nothing new (and
    in fact, systemd includes support for automount units). We''ll go over how these
    resource units help you at boot time.

    An Example Socket Unit and Service. But let''s first take a look at how


    # Boot Optimization with Auxiliary Units


    A common unit of activation in systemd attempts to simplify dependency order and
    speed up boot time. It''s similar to on-demand startup in a service unit and an
    auxiliary unit represent the service unit''s offered resource, except that in
    this case systemd starts the service as soon as it activates the unit.


    The reasoning behind this scheme is that boot-time service units such as `syslog`
    and `dbus` take some time to start, and many other units depend on them. However,
    systemd can activate a unit''s essential resource (such as a socket unit) and
    then it can immediately activate not the essential unit but any units that depend
    on the essential resource. Once the essential unit is ready, it takes control
    of the resource.


    Figure 6-2 shows how this might work in a traditional system. In this boot timeline,
    Service E provides essential Resource R, Services A, B, and C depend on this resource
    and must wait until Service E has started. When booting, the system takes a long
    time to get around starting Service C.'
