    The output is a short list of file and directory names on partition''s filesystem,
    such as `etc/`, `bin/`, and `dev/`. You should realize that this is now a completely
    different function of the GRUB `ls`: Before, you list devices, partition tables,
    and perhaps filesystem header information. Now you''re actually looking at the
