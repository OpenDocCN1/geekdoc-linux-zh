  md: '(such as the block bitmap), and then it compares the newly generated data with
    the filesystem on the disk. If there are mismatches, fsck must fix the link counts
    and determine what to do with any inodes and/or data that didn''t come up when
    it traversed the directory structure. Most fsck programs make these “orphans”
    new files in the filesystem''s lost+found directory.


    # 4.5.2 Working with Filesystems in User Space


    When working with files and directories in user space, you shouldn''t have to
    worry about the implementation going below them. You''re expected to access the
    contents of files and directories of a mounted-file system through kernel system
    calls. Curiously, you do have to access certain filesystem information that doesn''t
    seem to fit in user space—in particular, the stat() system call returns inodes
    and link counts


    When not maintaining a filesystem, do you have to worry about inode numbers and
    link counts? Generally, no. this stuff is accessible to use user modes primarily
    for backward compatibility. Furthermore, no filesystems available in Linux have
    these internals. The Virtual File System (VFS) interface layer ensures that systems
    always return inode numbers and link counts, but those may not necessarily mean
    anything.


    You may be able to perform traditional Unix filesystem operations on nontraditional
    filesystems. For example, you can''t use ln to create a link on a mounted VFAT
    filesystem because the directory entry is entirely different.


    Fortunately, the system calls available to user space on Unix/Linux systems provide
    enough abstraction for painless access—you don''t need to know anything about
    the underlying implementation to access files files. In addition, filenames are
    flexible in format and mixed-case names are supported, making it easy to support
    other hierarchical-style filesystems.


    Remember, specific filesystem support does not necessarily need to be in the kernel.
    In user-space filesystems, the kernel only needs to act as a conduit for system
    calls.


    # 4.5.3 The Evolution of Filesystems


    As you can see, even the simple filesystem just described many different components
    to maintain. At the same time, the demands placed on filesystems continuously
    increase with new tasks, technology, and storage capacity. Today''s performance,
    data integrity, and security requirements are beyond the offers of older filesystem
    implementations, so filesystem technology is constantly changing. We''ve already
    mentioned Bfs as an example of a next-generation filesystem (see 4.2 Filesystem
    Types).


    One example of how filesystems is changing is that new filesystems use separate
    data structures to represent directories and filenames, rather than the directory
    inodes described here. They reference data blocks differently. Also, filesystems
    that optimize for SSDs are still evolving. Continuous change in the development
    of filesystems is the norm, but keep in mind that the evolution of filesystems
    doesn''t change their purpose.'
