    file in a very simple format, as Listing 4-1 shows.


    Example 4-1. List of filesystems and options in /etc/fstab


    ```

    proc /proc dev noexec,nosuid 0 0

    UUID=706ccd6e7-6ae6-44f6-812c-51ab8036d29 / ext4=remount-ro 0 1

    UUID=5992dcdf1-58da-4769-9ea8-5f412a86980 swap 0 0

    /dev/sr0 /cdrom iso9660 ro,nosuid,noauto 0 0

