    # 11.10.4 xargs


    When you run one command on a huge number of files, the command or shell may respond
    that it can''t fit all of the arguments in its buffer. Use xargs to get around
    this problem by running a command on each filename in its standard input stream.


    Many people use xargs with the find command. For example, the script below can
    help you verify every file in the current directory tree that ends with .gif if
    it is a GIF (Graphical Interface Format) image:


    ```

    $ find -name ''*.gif'' -print | xargs file

    ```


    In the example, xargs finds the file. However, this invocation can cause errors
    or leave your system open to problems, because filenames can include spaces and
    newlines. When writing a script, use the following format, which changes the find
    output and the xargs argument delimiter to a NULL character:


    ```

    $ find -name ''*.gif'' -print0 | xargs -file

    ```


    xargs starts a lot of processes, so don''t expect great performance if you have
    a large list of files.


    You may need to add dashes (--) to the end of your xargs command if there is a
    chance that the target files start with a dash (-). The double dash (--) can be
    used to tell that any arguments follow the double dash are filenames, not options.
    However, keep in mind that not all programs use a double dash.


    There''s an alternative to xargs using find: the -exec option. However, the syntax
    is somewhat tricky when you use arithmetic that ends with ) to substitute the
    filename and a literal ; to indicate the end of the command. Here''s how to perform
    the preceding task using find:


    ```

    $ find -name ''*.gif'' -exec file {} \

    ```


    # 11.10.5 expr


    If you need arithmetic operations in your shell, the expr command can help (and
    even do string operations). For example, the command expr 1 + 2 prints 3. (Run
    expr --help for a full list of operations.)

    The expr command is clumsy, if you find yourself it frequently, you should probably
    be using a language like Python instead of a shell script.


    # 11.10.6 exec


    The exec command is a built-in shell function that replaces the current process
    after exec. It carries out the exec() system call that you learned about in Chapter
    1. This feature is designed for saving system resources, but remember that there
    is no return; when you run exec in a shell script, the script and running the
    script are gone, replaced by the new command.

    To test in this shell window, try running exec cat. After you press CTRL-D or
    CTRL-C to terminate the cat program, your window should disappear because its
    process no longer exists.'
