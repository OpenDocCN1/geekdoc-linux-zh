  md: '# Generating a New Configuration File


    If you want to make changes to your GRUB configuration, you won''t edit your grub.cfg
    file directly because it''s automatically generated and the system occasionally
    overwrites it. You''ll add your new configuration elsewhere, run grub-mkconfig
    to generate the new configuration.


    To see how the configuration generation works, look at the very beginning of grub.cfg.
    There should be comments like this:


    ```

    ### BEGIN /etc/grub.d/00_header ###

    ```


    Upon inspection, you''ll find every file in /etc/grub.d is a shell script that
    produces a piece of the grub.cfg file. The grub-mkconfig command itself is a shell
    script that runs everything in /etc/grub.d.


    Try it yourself once. (Don''t worry about overwriting your current configuration.
    This command by itself simply prints the configuration to the standard output.)


    ```

    # grub-mkconfig

    ```


    If you want to add menu entries and other commands to the GRUB configuration?
    The short answer is that you should put your customizations into a new custom.cfg
    file in your GRUB configuration directory, as /boot/grub/custom.cfg.


    The long answer is a bit more complicated. The /etc/grub.d configuration directory
    gives you two options: 40-custom and 41-custom. The first, 40-custom, is a script
    that you can edit, but it''s probably the least stable; a package upgrade is likely
    to destroy any changes you make. The 41-custom config is simpler; it''s a series
    of commands that load custom.cfg when GRUB starts. (Keep in mind that if you choose
    the second option, yours won''t appear when you generate your configuration)


    The options for configuration files /etc/grub.d directory are not particularly
    extensive. You''ll see additions in your particular distribution, Ubuntu adds
    boot options (memtest86+) to the configuration.


    To install and generate a new GRUB configuration file, you can run the configuration
    to your GRUB directory with the -o option to grub-mkconfig, like this:


    ```

    # grub-mkconfig -o /boot/grub/grub.cfg

    ```


    Or if you''re an Ubuntu user, just install-grub. In any case, back up your old
    configuration, make sure you''re installing to the correct directory, and so on.


    Now we''re going to get into some the more technical details of GRUB and boot
    loaders. If you''re tired of hearing about boot loaders and the kernel, feel free
    to skip to Chapter 6.


    # 5.5.3 GRUB Installation


    Installing GRUB is more involved than configuring it. Fortunately, you won''t
    have to worry about installation because your distribution should handle it. However,
    if you''re trying to delete or restore a bootable disk, or replace your boot sequence,
    you might need to install it on your own.


    Before proceeding, read 5.8.3 How GRUB Works to get an idea of how PCs boot and
    determine whether you''re using BIOS or EFI boot. First, build the GRUB software
    and determine where your GRUB installation directory will be; the /boot/grub.
    You may not need to build GRUB if your distribution does it for you, but if you
    do, see Chapter 16 for how to build from source code. Make sure you use the correct
    target: It''s different from BIOS or UEFI boot (and there are differences between
    32-bit and 64-bit EFI).


    # Installing GRUB on Your System


    The install loader requires that you or an installer performs the following:'
