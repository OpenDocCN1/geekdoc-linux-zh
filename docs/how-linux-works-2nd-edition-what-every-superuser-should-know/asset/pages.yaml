    # 9.19 Network Address Translation (IP Masquerading)


    NAT is the most commonly used way to share a single IP address with a private
    network, and it''s nearly universal in home and small office networks. In Linux,
    the most popular that people use is known as IP masquerading.


    The basic idea behind NAT is that the router doesn''t just move packets from one
    subnet to another; it transforms them as it moves. Hosts on the Internet know
    how to connect to the router, they know nothing about the private network behind
    it. The hosts on the private network need no special configuration; the router
    is their default gateway.


    The system works roughly this:


    +   1. A host on the internal network wants to make a connection to the outside
    world, so it sends its connection request packets through the router.

    2. The router intercepts the connection request packet rather than passing it
    out to the Internet (where it would get lost the public Internet knowing nothing
    about private networks).

    3. The router determines the destination of the connection request packet and
    opens its own connection to the destination.

    4. When the router obtains the connection, it fakes a “connection established”
    message back to the original host.

    5. The router is now the middleman between the internal host and the destination.
    The destination knows nothing about the internal host; the remote host looks like
    came from the router.


    This isn''t quite as simple as it sounds. Normal IP routing only knows source
    and destination addresses in the Internet layer. However, if the router only deals
    with the Internet, each host on the internal network could establish only one
    connection to a single destination at one time (other limitations), because there
    is no information in the Internet layer of packet to distinguish multiple requests
    from the same host to the destination. Therefore, NAT must go beyond the Internet
    and dissect packets to get more information, particularly the UDP and TCP port
    from the transport layers. UDP is fairly easily because because there are no ports
    connected, but the TCP transport layer is complex.


    In order to set up a Linux machine to perform as a NAT router, you must activate
    all of the following inside the kernel configuration: network packet filtering
    (“firewall support”), connection tracking, IP tables support, full NAT, and MASQUERADE
    target support. Most distributions come with this.


    Next you need to use some complex-looking iptables commands to make the router
    perform NAT for your private subnet. Here is an example that applies to an Ethernet
    network on eth1 sharing an external connection at eth0 (you''ll learn more about
    the iptables syntax in 9.21 Firewalls):


    ```

    # sysctl -w net.ipv4.ip_forward

    # iptables -P FORWARD DROP

    # iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    # iptables -A FORWARD -i eth0 -o eth1 -m state --ESTABLISHED,RELATED -j ACCEPT

    # iptables -A FORWARD -i eth1 -o eth0 -j ACCEPT

    ```'
