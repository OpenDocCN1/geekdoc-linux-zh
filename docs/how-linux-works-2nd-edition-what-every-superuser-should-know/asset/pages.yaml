  md: '# 10.10 Unix Domain Sockets


    Applications that use network facilities do not have to involve two separate hosts.
    Many applications are built client-server or peer-to-peer mechanisms, where processes
    running the same machine use interprocess communication (IPC) to negotiate what
    needs to be done and who does it. For example, recall that daemons such as systemd
    and NetworkManager use D-Bus to monitor and react to system events.


    Processes can use regular IP networking over localhost (127.0.0.1) to communicate,
    but instead, typically use a special kind of socket, a Unix domain socket, which
    we briefly touched upon Chapter 3, called a Unix domain socket. it behaves almost
    exactly like a network socket: It can listen for and accept connections on the
    socket, and you can choose between different kinds of socket types to make it
    behave TCP or UDP.


    # NOTE


    It''s important to remember that a Unix domain socket is not a network socket,
    and there''s no network behind one. You don''t need networking to be configured
    to use one. And Unix domain sockets don''t have to be bound to socket files. A
    process can create an unnamed Unix domain socket and share the address with another
    process.


    # 10.10.1 Advantages for Developers


    Developers like Unix domain sockets for IPC for two reasons. First, they develop
    the option to use special files in the filesystem to access any process that doesn''t
    have access to a socket file they can''t use. Because there''s no interaction
    with network, it''s simpler and less prone to network intrusion. For example,
    you''ll find the socket file for D-Bus in /var/run/dbus:


    ```

    $ ls -1 /var/run/dbus/system_bus_socket

    ssrw-rw-rw-1 root root 0 08:52 /var/run/dbus/system_bus_socket

    ```


    Second, because the Linux kernel does not have to go through the many layers of
    its networking subsystem when working with Unix domain sockets, performance tends
    to be much better.


    Writing code for Unix domain sockets is not much different from supporting normal
    network sockets. Because the benefits can be significant, network servers offer
    communication through both network and Unix domain sockets. For example, the MySQL
    database server mysqld can accept connections from remote hosts, but it also uses
    a Unix domain socket at /var/run/mysql/mysqld.sock.


    # 10.10.2 Listing Unix Domain Sockets


    You can view a list of Unix domain sockets currently in your system with lsof
    -U:


    ```

    # lsof -U

    COMMAND PID USER FD TYPE DEVICE/OFF NODE NAME

    mysqld 19701 mysql 12u unix 0xe4defcc0 o0 35021227

    /var/run/mysqld/mysqld.sock

    chromium- 26534 juser 5u unix 0xeec99b0 o0 42445141

    socket

    tlsmgr 30480 postfix 5u unix 0xc383240 o0 17009016

    socket

    tlsmgr 30480 postfix 6u unix 0xe20161c0 o0 10965

    private/tlsmgr

    ```'
