    # 15.4 Shared Libraries


    A library file ending with `.a` (as `libgobject.a`) is called a *static library*.
    When you link a program against a static library, the linker copies code from
    library into your executable. Therefore, the final executable does not need the
    original library file to run, and furthermore, the executable''s behavior never
    changes.


    However, library sizes are always increasing, as the number of libraries in use,
    and this makes static libraries wasteful in terms of disk space and memory. In
    addition, if a static library is found to be inadequate or insecure, there''s
    no way to check out any linked library, short of recompiling the executable.


    *Shared libraries* counter these problems. When you run a program linked against
    one, the system loads the library''s code into process space only when necessary.
    Many processes can share the same library code memory. And if you need to slightly
    modify the library code, you can generally do so without recompiling any.


    Shared libraries have their own costs: difficult management and a somewhat complicated
    linking procedure. However, you can bring shared libraries under control if you
    know four things:


    +   - How to list the shared libraries that an executable needs

    - How an executable looks for shared libraries

    - How to link a program against a shared library

    - The common library pitfalls


    The following sections tell you how to use and maintain your system''s shared
    libraries. If you''re interested in how shared libraries work or you want to know
    about linking in general, you can check out *Linkers and Loaders* by John R. Levine
    (Morgan Kaufmann, 1999), "The Inside Story on Shared Libraries and Dynamic Loading"
    by David M. Beazley, Brian D. Ward, and Ian R. Cooke (*Computing in Science &
    Engineering*, September/October 2001), or online resources such as the Program
    Library HOW (http://dweller.com/program-library/). The ldso(8) manual page is
    also worth a read.


    # Listing Shared Library Dependencies


    Shared libraries usually reside in the same place as static libraries. The two
    standard library directories on a Linux system are `/lib` and `/usr/lib`. The
    `/lib` directory does not contain static libraries.


    ```

    $$ ldd /bin/bash

