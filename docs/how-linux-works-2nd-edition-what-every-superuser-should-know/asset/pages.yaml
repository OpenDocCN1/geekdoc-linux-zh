    # ### 8.8.2 High Loads


    A high load does not necessarily mean that your system is having trouble. A system
    with enough memory and I/O resources can easily handle running processes. If your
    load average is high and your system still responds, don''t panic: The system
    has a lot of processes using the CPU. The processes have to compete with each
    other for processor time, and as they''ll take longer to perform their computations
    than if they were allowed to use the CPU all of them. Another case where you might
    see a load average as normal is a web server, where processes start and terminate
    quickly that the load measurement mechanism can''t function effectively.


    However, if the system is slow and the load average is high, you might be running
    into memory performance problems. When the system is low on memory, the kernel
    can start to thrash, or rapidly swap memory to processes and from the disk. When
    this happens, many processes become ready to run, but their memory might not be
    available, so they will remain in the ready-to-run state (and contribute to the
    load average) for much longer than they normally would.


