    # 10.4 The inetd and xinetd daemons


    Implementing standalone servers for every service can be somewhat inefficient.
    Each server must be separately configured to handle port listening, access control,
    and port configuration. These actions are performed in the same way for most services;
    when one server accepts a connection there is any difference in the way communication
    is handled.


    One traditional to simplify the usage of servers is with the inetd daemon, a kind
    of superserver designed to standardize network access and interfaces between server
    programs and network ports. After you start inetd, it reads its configuration
    file and listens on the network ports defined in that. As new connections come
    in, inetd attaches a new started process to the connection.


    A newer version of inetd xinetd offers better configuration and access control,
    but xinetd itself is being phased out in favor of system, which can provide the
    same functionality through socket units, as described in 6.4.7 system On-Demand
    and Resource-Parallelized Startup.


    Although no longer commonly used, its configuration shows everything necessary
    to set up a service. As it turns out, sshd can be invoked by inetd rather than
    as a standalone server, as shown in this /etc/inetd.conf configuration file:


    ```

    ident stream tcp nowait /usr/bin/sshd sshd -i

    ```


    The service fields are, from left to right

    /etc/services (see 9.14.3 Port Numbers and /etc/services).


    +   * Service name. The name from /etc/services

    * Socket type. This is usually stream for TCP and dgram for UDP.

    * Protocol. The transport protocol, usually tcp or udp.

    * Datagram behavior. For UDP, this is wait or nowait. Services using any other
    transport protocol should use nowait.

    * User. The username to run the service. Add group to set a group.

    * Executable. The program that inetd connects to the service.

    * Arguments. The arguments for the executable. The first argument should be the
    name of the program.


    # 10.4.1 TCP Wrappers: tcpd, /etc/hosts.allow, and /etc/hosts.deny


    Before lower-level fighters became popular, many administrators used the TCP wrapper
    and daemon for host control network services. In these implementations, inetd
    runs the tcpd program, which first looks at the incoming connection as well as
    the access control lists in the /etc/hosts.allow and /etc/hosts.deny files. The
    tcpd program logs the connection, and if it decides that the incoming connection
    is ok, hands it to the final service program. (Although you may find a system
    that uses the TCP wrapper system, we won''t cover it in detail because it has
    largely fallen into disuse).'
