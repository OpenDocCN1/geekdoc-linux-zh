  md: '![](img/5a5c4c011c5e04e6871498e12c0cfa93_63_0.png)


    Figure 4-3. Top-down view of a hard disk


    # NOTE


    A track is a part of a cylinder that a single head accesses, so in Figure 4-3,
    a cylinder is also a track. You probably don''t need to worry about tracks.


    The kernel and the various partitioning programs can tell you what a modern disk
    reports as its number of cylinders (and *sectors*, which are slices of cylinders).
    However, on a modern hard disk, the reported values are fiction! The traditional
    addressing scheme that uses CHS does not scale with modern disk hardware, nor
    does it account for the fact that you can put more data into outer cylinders than
    inner cylinders. Disk hardware supports Logical Block Addressing (LBA) to simply
    address a location on the disk by a block number, and remnants of CHS remain.
    For example, the MBR partition table contains CHS information as well as LBA equivalents,
    and some boot loaders are still dumb enough to believe the CHS values (don’t worry—most
    boot loaders use LBA values).


    Nevertheless, the idea of cylinders has been important to partitioning cylinders
    are ideal for partitions. Reading a stream from a cylinder is very fast because
    the head can continuously pick up data as the disk spins. A partition arranged
    as a set of adjacent cylinders allows for continuous data access because the head
    does not need to move between cylinders.


    Some partitioning programs complain if you don’t place your partitions precisely
    on cylinder boundaries. Ignore this; because the reported CHS values of modern
    disks simply aren’t true. The disk’s LBA scheme ensures that your partitions are
    where they are supposed to be.


    # 4.1 Solid-State Disks (SSDs)


    Storage devices with moving parts, as *solid-state disks (SSDs)*, are radically
    different from spinning disks in terms of their access characteristics. For, random
    access is not a problem because there’s no head to sweep across platter, but certain
    factors affect performance.


    One of the most significant factors affecting the performance of SSDs is *partition
    alignment*. When you read data from an SSD, you read it in chunks—typically 4096
    bytes at a time—and the read must begin at a multiple of that same size. If your
    partition and its data do not lie on a 4096-byte boundary, you may have to do
    two reads instead of one for small, common operations, as reading the contents
    of a directory.


    Many partitioning utilities (*parted* and *gparted*, for example) include functionality
    to put newly created'
