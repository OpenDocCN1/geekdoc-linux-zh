    +   - All devices on an Ethernet network have a Media Access Control (MAC) address,
    sometimes called a hardware address. This address is independent of a host''s
    IP address, and is unique to the host''s Ethernet network (but not necessarily
    a larger software network as the Internet). A sample MAC address is 10:78:d2:eb:76:97.


    +   - Devices on an Ethernet network send messages in frames, where headers are
    wrapped around the data. A frame contains the origin and destination MAC addresses.


