    # 12.2.9 rsync Topics


    Whenever you need to copy numerous files, rsync should be one of the first utilities
    that comes to mind. Running rsync in batch mode is particularly useful, and you''ll
    find a number of options to employ auxiliary files related to commands, logging,
    and transfer state. In particular, the state files make transfers faster and easier
    to recover when interrupted.


    You''ll also find rsync useful for making backups. For example, you can attach
    Internet storage, such as Amazon''s S3, to your Linux system and use rsync --delete
    to periodically synchronize a filesystem with the network storage to create a
    very backup backup.


    There are many more command-line options than those described here. For a rough
    overview, run rsync-help. You''ll find more detailed information in the rsync(1)
    manual page as well as at the rsync home page: http://rsync.xamba.org.


    # 12.3 Introduction to File Sharing


    Your Linux probably doesn''t live alone on your network, and when you have multiple
    machines on a network, there''s nearly always a reason to share files between
    them. For the remainder of this chapter, we''ll be primarily concerned with file
    sharing between Windows and Mac OS X machines, because it''s interesting to see
    how Linux adapts to foreign environments. For the purpose of sharing files between
    Linux machines, or for accessing files from a Network Area Storage (NAS) device,
    we''ll briefly talk about using Network File System (NFS) as a client.


    # 12.4 Sharing Files with Samba


    If you have machines running Windows, you''ll probably want to permit access to
    your Linux system''s files and printers from those Windows machines using the
    standard Windows network protocol, Server Message Block (SMB). Mac OS X also supports
    SMB file sharing.


    The standard file-sharing software for Unix is Samba. Not only does Samba allow
    your network''s Windows computers to connect to your Linux system, but it works
    the other way around: You can print and access files on Windows from your Linux
    machine with the Samba client software.


    To set up a Samba server, perform these steps:


    +   1. Create an smb.conf file.


    +   2. Add file-sharing sections to smb.conf.


    +   3. Add printer-sharing sections to smb.conf.


    +   4. Start the Samba daemons nmbd and smbd.


    When you install Samba from a distribution package, your system should perform
    the steps listed above using some reasonable defaults for the server. However,
    it probably won''t be able to determine which particular shares (resources) on
    your Linux machine you offers to.


    # NOTE


    The discussion of Samba in this chapter is brief and limited to getting Windows
    machines on a single standalone Linux machine through the Windows Network Places
    browser. There are countless ways to configure Samba, because there are many possibilities
    for access'
