    # 1.3.3 Device Drivers and Management


    The kernel''s role with devices is pretty simple. A device is typically accessible
    only in kernel mode because improper access (such as a user process asking to
    turn off the power) could crash the machine. Another problem is that different
    devices rarely have the same programming interface, even if they do the same thing,
    as two different network cards. Therefore, device drivers have traditionally been
    part of the kernel, and they strive to provide a uniform interface to user processes
    in order to simplify the developer''s job.


    # 1.3.4 System Calls and Support


    There are several kinds of kernel features available to user processes. For example,
    system calls (or `syscall`) perform tasks that a user process cannot do well or
    at all. For example, the acts of opening, reading, and writing files all system
    calls.


    Two system calls, `fork()` and `exec()`, are important to start a process up:


    +   - When a process calls `fork()`, the kernel creates a nearly identical copy
    of the process.


    +   - When a process calls `exec(program)`, the kernel starts `program`, replacing
    the current process.


    Other than in [Chapter 6], all processes on a Linux system start as a result of
    `fork()`, and most of the time, you also run `exec()` to start a new process instead
    of running an existing process. A very simple example is any program that you
    run at the command line, such as the `ls` command to show the contents of a directory.
    When you `ls` into a terminal, the shell that''s running inside the window calls
    `fork()` to create a copy of the shell, and then the new copy of the shell calls
    `exec(ls)` to run `ls`. Figure 1-2 shows the processes and system calls for starting
    a program like `ls`.


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_11_0.png)


    Figure 1-2: Starting a new process


    System calls are normally denoted with parentheses. In the example shown in Figure
    1-2, the process asking the kernel to create another process perform a `fork()`
    system call. The notation differs from the way it would be used in the C programming
    language. You don''t need to know C to understand this book; just remember that
    a system call is an interaction between a process and the kernel. Addition, this
    simplifies certain groups of system calls. For example, `exec()` refers to an
    entire family of system calls that all perform a similar task but differ in manner.


    The kernel also supports processes with features other than traditional system
    calls, the most common of which are pseudodev. Pseudo-devices look like devices
    to user processes, but they''re implemented purely in software. As such, they
    don''t need to be in the kernel, but they are usually there for practical reasons.
    For example, the kernel random number generator device (`/dev/random`) would be
    difficult to implement securely with a user process.


