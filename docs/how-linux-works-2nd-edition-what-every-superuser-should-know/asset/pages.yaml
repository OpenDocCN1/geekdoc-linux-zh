    The first line says that you''re sending 56-byte packets (if you include the headers)
    to 10.23.2.1 (by default, one packet per second), and the remaining lines indicates
    responses from 10.23.2.1. The most important parts of the output are the sequence
    number (icmp_req) and the round-trip time (time). The number of bytes returned
    is the sequence of the packet sent plus eight (The content of the packet isn''t
    important to).


    A gap in the sequence numbers, like as between 2 and 4, usually means there''s
    some kind of connectivity problem packets to arrive out of order, and if they
    do, there''s some kind of problem ping sends only one packet per second. If a
    response takes more than a second (1000ms) to arrive, the connection is extremely
    slow.


    The round-trip time is the elapsed time between the moment that request packet
    leaves and the response packet returns. If there''s no way to reach the destination,
    the router to see the packet returns an ICMP "unreachable" packet to ping.


    On a wired LAN, you should expect absolutely no packet loss and very low numbers
    for the round-trip time. (The preceding example is from a wireless network.) You
    should also expect no packet loss from your network to and from your ISP and reasonably
    round-trip times.


