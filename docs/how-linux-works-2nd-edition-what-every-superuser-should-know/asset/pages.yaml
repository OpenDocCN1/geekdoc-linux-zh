    # 7.3.5 Working with Groups


    Groups in Unix offer a way to share files with certain users but deny access to
    all others. The idea is that you can read or write permission bits for a particular
    group, excluding everyone else. This feature was important because many users
    shared one machine, but it becomes less significant in recent years as workstations
    shared less often.


    The /etc/group file defines the group IDs (such as the ones found in the /etc/passwd
    file). Example 7-3 is an example.


    Example 7-3. A sample /etc/group


    ```

    root*:0:juser

    daemon*:1:

    bin*:2:

    sys*:3:

    adm*:4:

    disk::*:6:juser,beazley

    group::*:65534:

    user::*:1000:

    ```


    Like the /etc/passwd file, each line in /etc/group is a set of fields separated
    by colons. The fields in each entry are as follows, from left to right:


    +   **The group name.** This appears when you run a command like `ls -`


    +   **The group password.** This is hardly ever used, so you should use it (sudo
    instead). Use * or any other default value.


    +   **The group ID (a number).** The GID must be unique within the group file.
    This number goes into a user''s group field in that user''s /etc/passwd file.


    +   **An optional list of users who belong to the group.** In addition to the
    users listed here, users with the corresponding group ID in their passwd file
    also belong to the group.


    **Figure 7-2** identifies the fields in a group file entry.


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_129_0.png)


    Figure 7-2. An entry in the group file


    To see the groups you belong to, run groups.


    # NOTE


    Linux distributions often create a new group for each new user added, with the
    same name as the user.


    # 7.4 getty and login


    getty is a program that attaches to terminals and displays a login prompt. On
    most Linux systems, getty'
