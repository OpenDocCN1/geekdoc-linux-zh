    # NOTE


    Feel free to skip ahead to Chapter 6 to learn the specifics of user start and
    the init program that the kernel runs as its first process. The remainder of this
    chapter details how the kernel starts.


    # 5.3 Kernel Parameters


    When running the Linux kernel, the boot loader passes in a set of text-based kernel
    parameters that tell the kernel how it should start. The parameters specify many
    different types of behavior, such as the amount of diagnostic output the kernel
    should produce and drive-specific options.


    You can view the kernel parameters from your system''s boot looking at the /proc/cmdline:


    ```

    $ cat /proc/cmdline

    BOOT_IMAGE=/boot/vmlinuz-3.2.0-67-generic-pae root=UUID=70ccd6e7-6ae6-44f6-

    812c-51ab8036d29 ro quiet splash vt.handoff=7

    ```


    The parameters are either one-word flags, such as ro and quiet, or key=value pairs,
    such as vt.handoff=7. Many of the parameters are unset, as the splash for displaying
    a screen, but one that is critical is the root parameter. This is the location
    of the root filesystem; without it, the kernel cannot find init and therefore
    perform the user space.


    The root filesystem is specified as a device file, as in this example:


    ```

    root=/dev/sda

    ```


    However, on most modern desktop systems, a UUID is more common (see 4.2 Filesystem
    UUID):

    root=UUID=70ccd6e7-6ae6-44f6-812c-51ab8036d29


    The ro parameter instructs the kernel to mount the root filesystem in read-only
    mode upon user space start. (Read-only mode ensures that fsck checks the root
    filesystem; after the check, the boot process rems the root filesystem in read-write.


    Upon encountering a parameter that it does not understand, the Linux kernel saves
    the parameter. The kernel later passes the parameter to init when performing the
    user space example. If you add -s to the kernel parameters, the kernel passes
    the -s to the init program to indicate that it should start in single-user mode.'
