    One common feature of network servers is that they usually operate as multiple
    processes. At least one process listens on a network port, and when a new incoming
    connection is received, the listening process uses fork() to create a new process,
    which is then responsible for the new connection. The child, often called a worker
    process, terminates when the connection is closed. Meanwhile, the original process
    continues to listen on the network port. This process allows a server to easily
    handle many connections without much trouble.


    There are some exceptions to this model, however. Calling fork() adds a significant
    amount of overhead. In comparison, high-performance TCP servers like the Apache
    web server can create a number of workers up startup so that they are ready to
    handle connections without seeds. Servers that accept UDP packets receive data
    and react to it; they don''t have connections to listen for.


    # 10.3 Secure Shell (SSH)


    Every server works a bit differently. Let''s take a look at one—the standalone
    SSH server. One of the most common network services is the secure shell (SSH),
    the de facto for remote access to a Unix machine. When configured, SSH allows
    shell logins, remote program execution, file sharing, and—replacing the old, telnet
    and login remote-systems with public-key cryptography for authentication and simpler
    ciphers for session data. Most ISPs and cloud providers provide and many Linux-based
    network appliances (like NAS devices) allow access via SSH. OpenSSH (http://www.openssh.com/)
    is a free SSH implementation for Unix, and nearly all distributions come with
    it preinstalled. The OpenSSH client is ssh, and the server uses two main protocol
    versions: 1 and 2. OpenSSH supports both, but version 1 is rarely used.


    Among its many useful capabilities and features, SSH does the following:


    +   - Encrypts your password and all other session data, protecting you from snooping.


    +   - Tunnels other network connections, including those from X Window System
    clients. You''ll learn more about X in Chapter 14.


    +   - Offers clients for nearly any operating system.


    +   - Uses keys for host authentication.


    # NOTE


    Tunneling is the process of packaging and tunneling one network connection through
    another one. The advantages of using SSH to tunnel X Window System connections
    are that SSH sets up the display environment for you and encrypts the X data inside
    the tunnel.


    SSH has its disadvantages. In order, to set up an SSH connection, you need the
    remote host''s public key, and you don''t necessarily get it in a secure way (you
    can check it to make sure you''re not being spoofed). For an overview of several
    methods of cryptography, get your hands on the book Applied Cryptography: Protocols,
