  md: '# Variables and Specifiers


    The sshd.service unit file also shows you variables—specifically, the $OPTIONS
    and $MAINPID environment variables that are passed by systemd. $OPTIONS are options
    that you can pass to ssh when you activate the unit with systemctl, and $MAINPID
    is the tracked process of the service (6.4 Process Tracking and Synchronization).


    A specifier is another variable-like feature found in unit files. Specifiers start
    with a percent (%). For example, the %n specifier is the current unit name, and
    the %H specifier is the current hostname.


    NOTE


    The unit name can contain some interesting specifiers. You can parameterize a
    single unit file in order to spawn multiple copies of a service, such as getty
    processes running on tty1, tty2, and so on. To use these specifiers, add the @
    symbol to the end of the unit name. For getty, create a unit named getty., which
    allows you to refer to units such as getty@tty1 and getty@tty2. Anything after
    the @ is called the instance, and when processing the unit file, system expands
    the %i specifier for the instance. You can see this in action with the getty@service
    unit file that comes with most distributions running system.


    # 6.4 systemd Operation


    You will interact with systemd primarily through the systemctl command, which
    allows you to activate and deactivate units, status, reload the configuration,
    and much more.


    The most essential commands deal with obtaining unit information. For example,
    to view a list of active units on your system, issue a list-units command. (This
    is actually the default command for systemctl, so you don''t really need the list-units
    part):


    ```

    $ systemctl list-units

    ```


    The output format is typical of a Unix information-listing command. For example,
    the header and the line for media.mount would look like this:


    ```

    UNIT LOAD ACTIVE SUB JOB DESCRIPTION

    media.mount loaded active mounted Media Directory

    ```


    This command produces a lot of output, because a typical system has many active
    units, but it will still be abbreviated because systemctl truncates any really
    large units. To see the full names of the units, use the --full option, and to
    see all units (not just), use the --all option.


    A particularly useful systemctl operation is getting the status of a unit. For
    example, here is a typical status command and its output:


    ```

    $ systemctl status media.mount

    media.mount - Media Directory

    Loaded: loaded (/usr/lib/systemd/system/media.mount; static)

    Active: active (mounted) since Wed, 13 May 2015 11:14:55 -0800;


    37min ago

    Where: /media

    What: tmpfs

    Process: 331 ExecMount=/bin/mount tmpfs /media -t tmpfs -o

    ```'
  merge: -1
