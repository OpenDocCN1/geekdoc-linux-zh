    #  9.14 UDP


    UDP is a far simpler transport than TCP. It defines a transport only for single
    messages; there is no data stream. At the same time, unlike TCP, UDP won''t correct
    for lost or out-of-order packets. In fact, UDP has ports, it doesn''t even have
    connections! One simply sends a message from one of its ports to a port on a server,
    and the server sends something back if it wants to. However, UDP does have error
    detection for data inside a packet; a host can detect if a packet gets mangled,
    but it doesn''t have to do anything about it.


    Where TCP is like having a telephone conversation, UDP is like sending a letter,
    telegram, or instant message (except that instant messages are more reliable).
    Applications that use UDP are often concerned with speed—sending a message as
    quickly as possible. They don''t want the overhead of TCP because they assume
    the network between two hosts is generally reliable. They don''t need TCP''s error
    correction they either have their own error detection systems or simply don''t
    care about errors.


    One example of an application that uses UDP is the Network Time Protocol (NTP).
    A client sends a short and simple request to a server to get the current time,
    and the response from the server is equally brief. Because the client wants the
    response as quickly as possible, UDP suits the application; if the response from
    the server gets lost somewhere in the network, the client can just resent a request
    or give up. Another example is video chat—in this case, pictures are sent with
    UDP—and if some pieces get lost along the way, the client on the receiving end
    compensates the best it can.'
