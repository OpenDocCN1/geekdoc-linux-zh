  md: '# Chapter 9. Understanding your Network and its Configuration


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_158_0.png)


    Networking is the practice of connecting computers and sending data between them.
    That sounds simple enough, but to understand how it works, you need to ask two
    fundamental questions:


    +   - How does the computer sending the data know where to send its data?

    - When the destination computer receives the data, how does it know what it just
    received?


    A computer answers these questions by a series of components, with each responsible
    for a certain aspect of sending, receiving, and identifying data. The components
    are arranged in groups that form network layers, which stack on top of each other
    to form a complete system. The Linux kernel handles networking in a similar way
    to the SCSI subsystem described in Chapter 3.


    Because each layer tends to be independent, it''s possible to build networks with
    many different combinations of components. This is where network configuration
    can become very complicated. For this reason, we''ll begin this chapter by looking
    at the layers in very simple networks. You''ll learn how to view your own network
    settings, and when you understand the basics of each layer, you''ll be ready to
    learn configure those layers by yourself. Finally, you''ll move on to more advanced
    topics like building your own networks and configuring firewalls. (Skip over that
    material if your eyes start to glaze over; you can come back.)


    # 9.1 Network Basics


    Before getting into the theory of network layers, take a look at the simple network
    shown in Figure 9-1.


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_158_1.png)


    Figure 9-1. A typical local area network with a router that provides Internet
    access


    This type of network is ubiquitous; most home and small office networks are configured
    this way. Each machine connected to the network is called a host. The hosts are
    connected to a router, which is a host that can move data from one network to
    another. These machines (here, Hosts A, B, and C) and the router form a local
    area network (LAN). The connections on the LAN can be wired or wireless.


    www-it-ebook.info'
