    # NOTE


    You might have heard of another set of layers known as the Open Systems Interconnection
    (OSI) Reference Model. This is a seven-layer network model used in teaching and
    designing networks, but we won''t cover the OSI model because you''ll be working
    directly with the four layers described here. To learn a more about layers (and
