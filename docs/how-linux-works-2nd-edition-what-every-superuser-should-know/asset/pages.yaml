    # 14.1.2 Toolkits


    Desktop applications include certain common elements, such as buttons and menus,
    called widgets. To speed up development and provide a common look, programmers
    use graphical toolkits to provide these elements. On operating systems as Windows
    or Mac OS X, the vendor provides a common toolkit, and programmers use that. On
    Linux, the GTK+ toolkit is one of the most common, and you''ll frequently see
    widgets on the Qt framework and others.


    Toolkits consist of shared libraries and support files such as images and theme
    information.


    # 14.1.3 Desktop Environments


    Although toolkits provide the user with a uniform outward appearance, some details
    of a desktop require a degree of cooperation between different applications. For
    example, one application may share data with another or use a common notification
    bar on the desktop. To provide for these needs, toolkits and others are bundled
    into larger packages called desktop environments. GNOME, KDE, Unity, and Xfce
    are some Linux desktop environments.


    Toolkits are at the core of most desktop environments, to create a unified desktop,
    desktop environments must also include numerous support files, such as icons and
    configurations, that make them up. All of this is bound together with documents
    that describe design conventions, such as how application menus and titles should
    appear and how applications should react to certain system events.


