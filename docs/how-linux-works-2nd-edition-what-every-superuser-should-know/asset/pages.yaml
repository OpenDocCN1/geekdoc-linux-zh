    # NOTE


    Using ctrl-c to terminate a process that is running in the current terminal is
    the same as using kill to end the process with the INT (interrupt) signal.


    The most brutal way to terminate a process is with the KILL signal. Other signals
    give the process a chance to clean up itself, but KILL does not. The operating
