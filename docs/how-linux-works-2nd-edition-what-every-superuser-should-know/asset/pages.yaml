    You can also define a macro on the command line. For example, you use the clang
    compiler, try


    ```

    $ make CC=clang

    ```


    Here, make use your definition of CC instead of its default compiler, cc. Command-line
    macros come in handy when testing preprocessor definitions and libraries and libraries,
    especially with CFLAGS and DFLAGS macros that we''ll discuss shortly.


    In fact, you don''t even need a Makefile to run make. Built-in make rules a target,
    which you can just make to create the target. For example, if you have the source
    to a very simple program called blah.c, try make blah. The make run proceeds like
    this:


    ```

    $ make blah

    cc blah.o -o blah

    ```


    This use of make works only for the most elementary C programs; if your program
    needs a library or include directory, you should probably write a Makefile. Running
    make without a Makefile is actually most useful when you''re dealing with something
    like Fortran, Lex, or Yacc and don''t know how to compile or utility works. Why
    not let make try to figure it out for you? Even if make fails to create the target,
    it will probably give you a pretty good hint as how to use the tool.


    Two make options stand out from the rest:


    +   - -n Prints the necessary for a build but prevents make from actually running
    any commands


    +   - -f file Tells make to read from file instead of Makefile or makefile


    # 15.2.6 Standard Macros and Variables


    make has many special macros and variables. It''s difficult to tell the difference
    between a macro and a variable, so we''ll use the term macro to mean something
    that usually doesn''t change after make starts building targets.


    As you aware, you can set macros at the start of your Makefile. These are the
    most common macros:


    +   - CFLAGS C options. When creating object code from a .c file, make passes
    this as an argument to the compiler.


    +   - LDLI Like CFLAGS, but they''re for the linker when creating an executable
    from object path, put the library name options in this file.


    +   - CC C compiler. The default is cc.


    +   - CPPFLAGS C preprocessor options. When make runs the C preprocessor in some
    way, it passes this macro''s expansion as an argument.


    +   - CXX GNU make uses this for C++ compiler flags.'
