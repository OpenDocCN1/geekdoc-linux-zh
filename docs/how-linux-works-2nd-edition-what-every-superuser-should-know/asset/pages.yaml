  md: '# 10.9 Sockets: How Processes Communicate with the Network


    We are now going to shift gears a little and look at how processes do the work
    of reading data from and writing to the network. It''s enough for processes to
    read from and write to network connections that are already set up: All you need
    are some system calls, which you can read about in recv(2) and send(2) manual
    pages. From the point of view of process, perhaps the most important thing to
    know is how to refer to the network when using these system calls. On Unix, a
    process uses a socket to identify when it''s talking to the network. Sockets are
    the interface that processes use to access the network through the kernel; they
    represent the boundary between user space and kernel space. They''re often also
    used for interprocess communication (IPC).


    There are different types of sockets because processes need to access the network
    in different ways. For example, TCP connections are represented by stream sockets
    (SOCK_STREAM, from a programmer''s point of view), and UDP connections are represented
    by datagram sockets (SOCK_DGRAM).


    Setting up a network socket can be complicated you need to account for socket
    type, addresses, ports, and transport protocol at particular times. However, after
    all of the initial details are sorted out, servers use standard methods to deal
    with incoming traffic from the network.


    The flowchart in Figure 10-1 shows how many servers handle connections for incoming
    stream sockets. Notice that this type of server involves two kinds of sockets:
    a listener socket and a socket for reading and writing. When a new connection
    comes in, the master process uses the accept() system call to accept the connection,
    which the next, master process uses fork() to create a new child process to deal
    with the connection. The original socket remains the listeners and continues to
    look for more connections on behalf of the master process.


    After a process has set up a socket of a particular type, it can interact with
    it in a way that fits the socket type. This is what makes sockets flexible: if
    you need to change the underlying transport layer, you don''t have to rewrite
    all of the parts that send and receive data; you mostly need to modify the initialization
    code.


    > Original process


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_206_0.png)


    Figure 10-1. One method for accepting and processing incoming connections


    If you''re a programmer and you''d like to learn how to use the socket interface,
    Unix Network Programming, Volume 1, 3rd edition, by W. Richard Stephens, Bill
    Fenner, and Andrew M. Rudoff (Addison-Wesley Professional, 2003) is the classic
    guide. Volume 2 also covers interprocess communication.'
