    The kernel reads from top to bottom, using the first rule that matches.


    The first rule does not match 192.168.34.37, the second does, because it applies
    to all hosts from 192.168.34.1 to 192.168.34.254 and the second rule says to drop
    packets. When a kernel carries out the action and looks no further down the chain.
    (You might think 192.168.34.37 can send packets to any port on your machine except
