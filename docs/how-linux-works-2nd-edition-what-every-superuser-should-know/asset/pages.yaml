    every possible scenario for packet input and flow. It helps to break the diagrams
    by packet source, as in Figure 9-5 and Figure 9-6.


    # 9.21.2 Setting Firewall Rules


    Let''s look at the IP table systems works in practice. Start by viewing the current
    configuration with this command:


    ```

    # iptables -L


    Chain INPUT (policy ACCEPT)

    target     prot opt source      destination


    Chain FORWARD (policy ACCEPT)

    target     prot opt source      destination


    Chain OUTPUT (policy ACCEPT)

    target     prot opt source      destination

    ```'
