  md: 'sends the packet to the router, and it''s someone else''s problem after that.
    Of course, your host needs to know the MAC address for the router, and it can
    use ARP to find it.


    The only real problem you can have with ARP is if your system''s cache can get
    out-of-date if you''re moving an IP address from one network interface to another
    because the cards have different MAC addresses (for, example, when testing a machine).
    Unix invalidates ARP cache entries if there''s no activity after a while, so there
    shouldn''t be trouble other than a small delay for invalidated data, but you can
    delete an ARP cache entry immediately with this command:


    ```

    # arp -d host

    ```


    You can also view the ARP cache for a single network interface with


    ```

    $ arp -i interface

    ```


    The arp(8) manual page explains how to manually set ARP cache entries, but you
    shouldn''t need to do this.


    NOTE


    Don''t confuse ARP with Reverse Address Resolution Protocol (RARP). RARP transforms
    a MAC address back to a hostname or IP address. Because DHCP became popular, some
    workstations and other devices used ARP to get their configuration, but RARP is
    rare today.


    # 9.23 Wireless Ethernet


    In principle, wireless Ethernet (“WiFi”) networks aren''t much different from
    wired networks. Much like wired hardware, they have MAC addresses and use Ethernet
    frames to transmit and receive data, and as result the Linux kernel can talk to
    a wireless network interface as it would be a wired network interface. Everything
    at the network layer and above is the same; the main differences are additional
    components in the physical layer such as frequencies, network IDs, security, and
    so on.


    Unlike wired network hardware, which is very good at automatically adjusting to
    nuances in the physical setup without much fuss, wireless network configuration
    is much more open-ended. To get a wireless interface working properly, Linux needs
    additional configuration tools.


    Let''s take a quick look at the additional components of wireless networks.


    +   - Transmission details. These are physical characteristics, such as the radio
    frequency.

    - Network identification. Because more than one wireless network can share the
    same medium, you will have to distinguish between them. The SSID (Service Set
    Identifier, also known as the “network name”) is the wireless network identifier.


    +   - Management. It''s possible to configure wireless networking to have hosts
    talk directly to each other


    +   - Authentication. You may want to restrict access to a wireless network. To
    do, you can configure access points to require a password or other authentication
    key before they''ll talk to a client.


    +   - Encryption. In restricting the initial access to a wireless network, you
    normally to encrypt all traffic that goes across radio waves.


    The Linux configuration and utilities that handle these components are spread
    out over an area of areas. Some are in the kernel: Linux features a set of wireless
    extensions that standardize user-access to hardware. As far as user space goes,
    wireless configuration can get complicated, so most people prefer to use GUI frontends,
    such as the desktop app for NetworkManager, to get things done. Still, it''s worth
    looking'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'at a few of the things happening behind the scenes.


    # 9.23.1 iw


    You can view and change kernel space device and network configuration with a utility
    iw. To use iw, you normally need to know the network interface name for the device,
    such as wlan0. Here''s an example that dumps a scan of wireless networks. (Expect
    a log output if you''re in an urban area).


    ```

    # iw dev wlan0

    ```


    # NOTE


    The network interface must be up for this command to work (if it''s not, run ifconfig
    wlan0 up), but you don''t need to configure any network layer parameters, such
    as an IP address.


    If the network interface has joined a wireless network, you can view the network
    details like this:


    ```

    # iw dev wlan0

    ```


    The MAC address in the output of this command is the access point that you''re
    currently talking to.


    # NOTE


    The iw command distinguishes between physical device names such as phys0 and network
    interface names such as wlan0 and allows you to change various settings for each.
    You can even create more than one network interface for a single physical device.
    However, in nearly all cases, you''ll just use the network interface name.


    Use iw to connect a network interface to an unsecured wireless network as follows:


    ```

    # iw wlan0 connect network_name

    ```


    Connecting to secured networks is a different story. For the rather insecure Wired
    Equivalent Privacy (WEP) system, you can use the keys parameter with the iw connect
    command. However, you shouldn''t use WEP if you''re serious about security.


    # 9.23.2 Wireless Security


    For most wireless security setups, Linux relies on a daemon called wpa_supplicant
    to manage both authentication and encryption for a network interface. This daemon
    can handle WPA (WiFi Protected Access) and WPA2 schemes of authentication, as
    well as any kind of encryption technique used on wireless networks. When the daemon
    starts, it reads a configuration file (by default, /etc/wpa_supplicant.conf) and
    attempts to identify an access point and establish communication based on a given
    network name. The system is well documented; in particular, the wpa_supplicant(1)
    and wpa_supplicant.conf(5) manual pages are very detailed.


    Running the daemon by every time you want to establish a connection is a lot of
    work. In fact, creating the configuration file is tedious due to the possible
    number of options. To make matters worse, all of the work of iw and wpa_supplicant
    simply allows you to join a wireless network; it doesn''t even set the network
    layer. That''s why automatic network configuration managers such as NetworkManager
    take a lot of pain out of the process. Although they don''t do any of the work
    on own, they know the correct sequence and required configuration for each step
    toward getting a wireless network operational.


    # 9.24 Summary


    You can now see understanding the positions and roles of the various network layers
    is critical to understanding how Linux networking operates and how to perform
    network configuration. Although we''ve'
