  md: 'way to coordinate the new components with it, systemd and Upstart attempt to
    remedy the performance issue by allowing many services to start in parallel speeding
    up the boot process. Their implementations are quite different, though:


    +   - systemd is oriented. You define a target that you want to achieve, along
    with its dependencies, and when you want to reach the target, systemd satisfies
    the dependencies and resolves the target. systemd can also defer the start of
    a service until it is absolutely needed.


    +   - Upstart is reactionary. It receives events, and based on those events, runs
    jobs that in turn produce more events, causing Upstart to run more jobs, and so
    on.


    The systemd and Upstart systems also offer a more advanced way to start and track
    scripts. In traditional systems, daemons are expected to start from scripts. A
    script runs a daemon process, which detaches itself from the script and runs independently.
    To find the PID of a daemon, you need ps or some other mechanism specific to the
    service. In contrast, Upstart and systemd can manage individual daemons from the
    beginning, giving the user more power and insight into exactly what is running
    on the system.


    Because the new systems are not script-centric, configuring services for them
    also tends to be easier. In particular, System V init scripts tend to contain
    many similar commands designed to start, stop, and restart services. You don''t
    need all of this redundancy with systemd and Upstart, which allow you to concentrate
    on the services themselves, rather than their scripts.


    Finally, systemd and Upstart both offer some level of on-demand services. Rather
    than trying to start all the services that may be needed at boot time (the System
    V init would), they start services only when needed. This is not new; this was
    done with the traditional inetd daemon, but the implementations are more sophisticated.


    Both systemd and Upstart support System V backward compatibility. For example,
    support the concept of runlevels.


    # 6.2 System V Runlevels


    At any time on a Linux system, a certain set of processes (such as crond and udev)
    is running. In System V init, this state of the machine is called a runlevel,
    which is denoted by a number from 0 through 6. A system spends most of its time
    in a single runlevel, but when you switch the runlevel, it switches the system
    services in an orderly fashion and to kill the kernel to stop.


    You can check your system''s runlevel with the who -r command. A system running
    Upstart responds with something like this:


    ```

    $ who -r

    run-level 2 2015-09-06 08:37

    ```


    This output tells you that the current runlevel is 2, as well as the date and
    time that the runlevel was established. Runlevels serve various purposes, but
    the most common one is to distinguish between system startup, shutdown, single-user
    mode, and multi states. For example, Fedora-based systems traditionally used runlevels
    2 through 4 for the text console; a runlevel of 5 means that the system will start
    a GUI login.


    But runlevels are becoming a thing of the past. Even though all three init versions
    in this book support them, systemd and Upstart consider runlevels obsolete as
    end states for the system. They exist primarily to start services that support
    the System V init scripts, and the implementations are different that even if
    you''re familiar with one of init, you won''t necessarily know what to do with
    another.


    www-it-ebooks.info'
