    # ## 10.5.3 netcat


    If you need more flexibility in connecting to a remote host than a command like
    telnet host port allows, use netcat (or nc). netcat can connect to TCP/UDP ports,
    specify a local port, listen on ports, scan ports, redirect standard I/O and from
    network connections, and more. To Open a TCP connection to a port with netcat,


    ```

    $ netcat host port

    ```


    netcat only terminates when the other side of the connection ends the connection,
    which can confuse things if you redirect standard input to netcat. You can end
    the connection at any time by pressing CTRL-C. (If you''d like the program and
    network connection to terminate based on the standard input stream, try the sock
    program instead.)


    To listen on a particular port, run


    ```

    $ netcat -l -p port_number

    ```


    # ## 10.5.4 Port Scanning


    Sometimes you don''t know what services the machines on your networks are offering
    or even which IP addresses are in use. The Network Mapper (Nmap) program scans
    all ports on a machine or network of machines looking for open ports, and lists
    the ports. Most distributions have an Nmap package, or you can get it at http://www.insecure.org/.
    (See the Nmap manual page and online resources for all that Nmap can do.)


    When listing ports on your own machine, it often to run the Nmap scan from at
    least two points: from your own machine and another one (possibly outside your
    local network). Doing so will give you an overview of what your firewall is blocking.'
