    # 11.3.2 Number of Arguments: ##


    The variable holds the number of arguments passed to a script and is especially
    important when running shift in a loop to pick through arguments. When $# is 0,
    no arguments remain, so $1 is empty. (11.6 Loops for a description of loops.)


    # 11.3.3 All Arguments: @@


    The $@ represents all of a script''s arguments, and it is very useful for passing
    them to a command inside the script. Ghostcommand (gs) are usually long and complicated.
    Suppose you want a shortcut for rasterizing a PostScript file at 150 dpi, using
    the standard output, while leaving the door open for passing other options to
    gs. You could write a script like this to allow for additional command-line options:


    ```

    #!/bin/sh

    g -q -dBATCH -dNOPAUSE -dSAFER -sOutputFile== -sDEVICE=pnmraw $@

    ```


    If a line in your shell script gets too long for your text editor, you can split
    it up with a backslash (\). For example, you can alter the script as follows:


    ```

    #!/bin/sh

    g -q -dBATCH -dNOPAUSE -dSAFER \

    -sOutputFile== -sDEVICE=pnmraw $@

    ```


    # 11.3.4 Script Name: $0


    The $0 holds the name of the script, and it is useful for generating diagnostic
    messages. Say your script needs to report an invalid argument that is stored in
    the $BADPARM variable. You can print the diagnostic message with the following
    line so that the script name appears in the error message:


    ```

    echo $0: bad option $BADPARM

    ```


    All diagnostic error messages should go to the standard error. Recall from 2.14.1
    Standard Error that >&1 redirects the standard error to the standard output. For
    writing to the standard error, you can reverse the process with 1>&$. To do this
    by the following example, use:


    ```

    echo $0: bad option $BADPARM 1>&2

    ```


    # 11.3.5 Process ID: $$


    The $$ variable holds the process ID of the shell.'
