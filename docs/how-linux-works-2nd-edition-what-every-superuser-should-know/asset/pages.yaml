  md: "# 5.6 UEFI Secure Boot Problems\n\nOne of the newest problems affecting Linux\
    \ installations is the secure boot feature found on recent PCs. When active, this\
    \ mechanism in UEFI requires boot loaders to be digitally signed by a trusted\
    \ authority in order to run. Microsoft has required vendors shipping Windows 8\
    \ to secure boot. The result is if you try to install an unsigned boot loader\
    \ (which is most current Linux distributions), it will not load.\n\nThe easiest\
    \ way around this for anyone with no interest in Windows is to disable secure\
    \ boot in the EFI settings. However, this won't work cleanly for dual-boot systems\
    \ and may not be an option for all users. Linux distributions are offering signed\
    \ boot loaders. Some solutions are front-ends to GRUB, some from the boot loader\
    \ to the kernel), and others are entirely new boot loaders (based on efilux).\n\
    \n# 5.7 Chainloading Other Operating Systems\n\nUEFI makes it relatively easy\
    \ to support loading other operating systems because you can install boot loaders\
    \ in the EFI partition. The old MBR style doesn't support it, and even if you\
    \ have UEFI, you may still have an individual partition with MBR-style boot loader\
    \ that you want to use. You can get GRUB to load and run a different boot loader\
    \ on a specific partition of your disk by *chainloading.*\n\nTo chainload, create\
    \ a new entry in your GRUB configuration (using one of the methods in [Review\
    \ Grub.cfg]). Here's an example for a Windows installation on the third partition\
    \ of a disk:\n\n```\nmenuentry \"Windows\" {\n    insmod chain\n    insmod ntfs\n\
    \    set root=(hd0,3)\n    chainloader +1\n}\n```\n\nThe +1 option to `chainloader`\
    \ tells it to load whatever is at the first sector of a partition. You can also\
    \ get it to directly load a file by using a line like this to the `io.sys` MS-DOS\
    \ loader:\n\n```\nmenuentry \"DOS\" {\n    insmod chain\n    insmod fat\n    set\
    \ root=(hd0,3)\n    chainloader /io.sys\n}\n```\n\n# 5.8 Boot Loader Details\n\
    \nNow we'll look quickly at some boot loader internals. Feel free to skip to the\
    \ next chapter if this material doesn't interest you.\n\nTo understand how loaders\
    \ like GRUB work, let's first survey how a PC boots when you turn it on. Due to\
    \ the repeated inadequacies of traditional PC boot mechanisms, there are several\
    \ variations, but there are two main schemes: MBR and UEFI."
  merge: -1
