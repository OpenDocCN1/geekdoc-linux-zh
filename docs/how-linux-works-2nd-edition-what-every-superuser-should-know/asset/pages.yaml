    # 9.20 Routers and Linux


    In the early days of broadband, users with less demanding simply connected their
    machines directly to the Internet. But it didn''t take long for many users to
    want to share a single broadband connection with their own networks, and Linux
    users in particular would set up an extra machine to use as a router NAT.


    Manufacturers responded to this new market by offering specialized router hardware
    consisting of an efficient processor, some flash memory, and several network ports—with
    enough power to manage a typical simple network, run important software such as
    a DHCP server, and use NAT. When it comes to software, many manufacturers turned
    to Linux to power their routers. They added the necessary kernel features, stripped
    down the user-space software, and created GUI-based administration interfaces.


    Almost as soon as the first of these routers, many people interested in digging
    deeper into hardware. One manufacturer, Linksys, was required to release the source
    code for its software under the terms of license of its components, and so specialized
    Linux distributions like OpenWrt appeared for routers. (The "WRT" in these names
    came from the Linksys model number.)


    Aside from the hobbyist aspect, there are good reasons to use these distributions:
    they are more stable than the manufacturer firmware, especially on older hardware,
    and they often provide additional features. For example, to bridge a network with
    a wireless connection, many manufacturers require you to buy matching hardware,
    but with OpenWrt installed, the manufacturer and age of the hardware doesn''t
    really matter. This is because you''re using a truly open operating system on
    the router that doesn''t care what you use as long as your hardware is supported.


    You can use the knowledge in this book to examine the internals of custom Linux
    firmware, though you''ll encounter differences, especially when using Busy. As
    many embedded systems, open firmware tends to use BusyBox to provide many features.
    Many Unix commands as the shell, ls, grep, cat, and more. (This saves a significant
    amount of memory.) In addition, boot-time is very sensitive on embedded systems.
    However, you won''t find these limitations to be a problem, because custom Linux
    firmware often includes a web administration interface similar to what you get
    from a manufacturer.


    # 9.21 Firewalls


    Routers in particular should always include some kind of firewall to keep undesirable
    traffic out of your network. A firewall is a software and/or hardware configuration
    that usually sits on a router between the Internet and a smaller network, attempting
    to ensure that "bad" from the Internet harms the smaller network. You can also
    set up firewalls for each machine the machine screens all of its incoming and
    outgoing data at the packet level (as opposed to the application layer, where
    server programs usually try to perform some access control of their own). Firewalling
