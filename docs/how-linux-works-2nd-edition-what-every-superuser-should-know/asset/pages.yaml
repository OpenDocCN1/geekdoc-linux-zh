    | ps u | Include more detailed information on processes |

    | ps w | Show full command names, not just fits on one line. |


    As with other programs, you can combine options, as in ps aux and ps auxw. To
    check on a specific process, add its PID to the argument list of the ps command.
    For example, $$ is a variable that evaluates to the current shell''s PID.(You''ll
    find information on the administration commands top and lsof in Chapter 8. These
    can be useful for locating processes, when doing something other than system maintenance.)


    # 2.16.2 Killing Processes


    To terminate a process, send it signal with the kill command. A signal is a message
    to a process from the kernel. When you run kill, you are asking the kernel to
    send a signal to another process. In most cases, you need to do this:


    ```

    $ kill pid

    ```


    There are many types of signals. The default is TERM, or terminate. You can send
    different signals by adding an extra option to kill. For example, to freeze a
    process instead of terminating it, use the STOP signal:


    ```

    $ kill -STOP pid

    ```


    A stopped process is still in memory, ready to pick up where it left off. Use
    the CONT signal to continue running the process again:'
