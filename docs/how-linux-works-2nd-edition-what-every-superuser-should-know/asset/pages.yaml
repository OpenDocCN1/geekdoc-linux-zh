    # 12.2.4 Excluding Files and Directories


    One important feature of rsync is its ability to exclude files and directories
    from a transfer operation. For example, say you''d like to transfer a local directory
    called src to host, but you want to exclude anything named .git. You can do it
    like this:


    ```

    $ rsync -a --exclude=.git src host:

    ```


    Note this command excludes all files and directories named .git because --exclude
    takes a pattern, not an absolute filename. To exclude one specific item, specify
    an absolute path that starts with /, as shown here:


    ```

    $ rsync -a --exclude=/src/.git src host:

    ```


    # NOTE


    The first in /src/.git in this command is not the root directory of your system
    but rather the base directory of the transfer.


    Here are a few tips on how to exclude patterns:


    +   - You can have as many --exclude parameters as you like.

    - If you use the same patterns repeatedly, place them in a plaintext file (one
    pattern per line) and use --exclude-from=file.

    - To exclude directories named .git but include files with this name, a trailing
    slash: --exclude=item/.

    - The pattern is based on a full file or directory name and may contain simple
    globs (wildcards). For example, t* matches this, but does not match equals.

    - If you exclude a directory or filename but find that your pattern is too restrictive,
    use --include to specifically include another file or directory.


    # 12.2.5 Transfer Integrity, Safeguards, and Verbose Modes


    To speed operation, rsync uses a check to determine whether any files on the source
    are already on the destination. The quick check uses a combination of the file
    size and its last-modified date. The first time you transfer an entire directory
    hierarchy to a remote host, rsync sees that none of the files exist at the destination,
    and it transfers everything. Testing your transfer with rsync -n verifies this
    for you.\After running rsync once, run it again using rsync -v. This time you
    will see that no files show up in'
