  md: 'The target GRUB directory as by your currently running system. That''s usually
    /boot/grub, but it might be different if you''re installing GRUB on another disk
    for use on another system.


    The current device of the GRUB target disk.


    For UEFI boot, the mounting point is the UEFI boot partition.


    Remember that GRUB is a modular system, but in order to load modules, it must
    read the filesystem that contains the GRUB directory. Your task is to construct
    a version of GRUB capable of reading that so that it can load the rest of its
    configuration (grub.cfg) and any required modules. On Linux, this means building
    a version of GRUB with its ext2mod module enabled. Once you have this version,
    all you need to do is install on the bootable part of the disk and place the rest
    of the required files into /boot/grub.


    Fortunately, GRUB comes with a a utility called grub-install (not to be confused
    with Ubuntu''s install-grub), which performs most of the work of installing the
    GRUB files and configuration for you. For example, if your current disk is at
    /dev/sda and you want to install GRUB on that disk with your current /boot/grub
    directory, use this command to install GRUB on the MBR:


    ```

    # grub-install /dev/sda

    ```


    # WARNING


    > Incorrectly installing GRUB may break the boot sequence on your system, if you''re
    concerned, read up on how to back up your MBR with dd, back up any other currently
    installed GRUB directory, and make sure you have an emergency boot plan.


    # Installing GRUB on an External Storage Device


    To install GRUB on a storage device outside the current system, you must manually
    specify the GRUB directory on that target device of /dev/sda and that root/boot
    filesystem (for example, /dev/sdc1) is mounted at /mnt of your current system.
    This implies that when you install GRUB, your current system will see the GRUB
    files in /mnt/boot/grub. When running grub-install, tell it where those files
    go as follows:


    ```

    # grub-install --boot-directory=/mnt/boot /dev/sdc

    ```


    # Installing GRUB with UEFI


    UEFI installation is supposed to be easy, because all you need to copy the boot
    loader into place. You also need to “announce” the boot loader to the firmware
    with the efibootmgr command. The grub-install command runs if it''s viable, so
    in theory all you need to install on a UEFI partition is the:


    ```

    # grub-install --efi-directory=efi_dir --bootloader-id=name

    ```


    Here, efi_dir is where the UEFI directory appears on your current system (usually
    /boot/efi), because the UEFI partition is mounted at /boot/efi and name is an
    identifier for the boot loader, as described in 5.8. UEFI Boot.


    Unfortunately, many problems can crop up when installing a UEFI boot loader. For
    example, if you''re installing to a disk that will eventually end up in another
    system, you have to figure out how to announce that boot loader to the new system''s
    firmware. And there are differences in the install procedure for removable media.


    But one of the biggest problems is UEFI secure boot.'
