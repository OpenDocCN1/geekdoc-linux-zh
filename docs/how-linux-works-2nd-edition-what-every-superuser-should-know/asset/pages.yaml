    # 6.7 Shutting Down Your System


    init controls how the system shuts down and reboots. The commands to shut down
    the system are the same regardless of which version of it run. The proper way
    to shut down a Linux machine is to use the shutdown command.


    There are two basic ways to use shutdown. If you halt the system, it shuts the
    machine down and keeps it down. To make the machine halt immediately, run this:


    ```

    # shutdown -h now

    ```


    On most machines and versions of Linux, a halt cuts the power to the machine.
    You can also reboot the machine. For reboot, use -r instead of -h.


    The shutdown process takes several seconds. You should never reset or power off
    a machine during this stage.


    In the preceding example, now is the time to shut down. This argument is mandatory,
    but there are many ways to specify the time. For example, if you want the machine
    to shut down sometime in the future, you can use +n, where n is the number of
    minutes shutdown should wait before its work. (For other options, see the shutdown(8)
    manual page.)


    To make system reboot in 10 minutes, enter:


    ```

    # shutdown -r +10

    ```


    On Linux, shutdown notifies anyone that the machine is going down, but it does
    little real work. If you specify a time now, the shutdown command creates a file
    /etc/loginja. When this file is present, the system prohibits logins anyone except
    the supervisor.


    When system shutdown finally arrives, shutdown tells it to begin the shutdown
    process. On systemd, it means activating the shutdown units; on Upstart, it means
    emitting the shutdown events; and on System V it changes the runlevel to 0 or
    6. Regardless of the implementation or configuration, the procedure generally
    goes like this:


    +   1. init asks any process to shut cleanly.


    +   2. If a process doesn''t respond after a while, init kills it, first trying
    a TERM signal.


    +   3. If the TERM signal doesn''t work, use the KILL signal on any stragglers.


    +   4. The system locks files into place and makes other preparations for shutdown.


    +   5. The system unmounts all filesystems other than root.


    +   6. The system remounts the filesystem read-only.


    +   7. The system writes all buffered data out to the filesystem with the sync
    program.


    +   8. The final step is to tell the kernel to reboot or stop with the reboot(2)
    system. This can be done by it or an auxiliary program as reboot, halt, or poweroff.


    The reboot and halt programs behave differently depending on how they''re called,
    which may cause confusion. By default, both processes call shutdown with the -r
    or -h options. If the system is already at a halt or reboot runlevel, the programs
    tell the kernel to shut off immediately. If you really want to shut your machine
    down in a hurry, regardless of any potential damage from disorderly shutdown,
    use the -f (force) option.'
  merge: -1
