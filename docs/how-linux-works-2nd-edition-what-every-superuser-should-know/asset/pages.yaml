    # 15.1.1 Multiple Source Files


    Most C programs are too large to reasonably fit inside a single source code file.
    Mammoth files become too disorganised by the programmer, and compilers develop
    groups of the source code together, giving each piece its own file.


    When compiling multiple .c files, you don''t create an executable by Instead,
    use the compiler’s -c option on each file to create object files. To see how this
    works, let''s say you have two files, main.c and aux.c. The following two commands
    do most of the work of building the program:


    ```

    $ cc -c main.c

    ```


    ```

    $ cc -c aux.c

    ```


    The preceding two commands compile the source files into the two object files
    main.o and aux.o.


    An object file is a binary file that a processor can understand, except that there
    are still a few ends. First, the operating system doesn''t know how to run an
    object file, and second, you will need to combine several object files and system
    libraries to make a complete program.


    To build a fully functioning executable from one or more object files, use the
    linker, the ld command in Unix. Programmers rarely use ld on the command line,
    because the compiler knows how to run the linker program. To create an executable
    called myprog from the two object files above, run this command:


    ```

    $ cc -o myprog main.o aux.o

    ```


    Although you can compile multiple source files by hand, as the preceding example
    shows, it can be hard to keep track of them all during the compiling process when
    the number of source files multiplies. The make system in 15.2 make is the traditional
    Unix standard for managing compiles. This system is especially important in managing
