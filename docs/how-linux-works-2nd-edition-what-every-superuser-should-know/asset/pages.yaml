    # 6.6.2 The System V Link Farm


    The contents of the rc*.d directories are actually symbolic links to files in
    another directory, init.d. If your goal is to interact, add, delete, or modify
    services in the rc*.d directories, you need to understand these symbolic links.
    A long listing of a directory such as rc.d reveals a structure like this:


    ```

    lrwxxrxrwx S10syslogd -> ../init.d/syslogd

    lrwxxrxrwx S12kernel -> ../init.d/kernel

    lrwxxrxrwx S15netstd_init -> ../init.d/netstd_init

    lrwxxrxrwx S18netbase -> ../init.d/netbase

    --snip--

    lrwxxrxrwx S99httpd -> ../init.d/httpd

    --snip--

    ```


    A large number of links across several subdirectories is what is called a link
    farm. Linux distributions contain these links so they can use the same startup
    scripts for all runlevels. This convention is not a requirement, but it simplifies
    organization.


    # Starting and Stopping Services


    To start and stop services by hand, use the script in the init.d directory. For
    example, one way to start the http web program manually is to run init.d/httpd
    start. Similarly, to kill a running service, you can use the stop argument (httpd
    stop, for instance).'
