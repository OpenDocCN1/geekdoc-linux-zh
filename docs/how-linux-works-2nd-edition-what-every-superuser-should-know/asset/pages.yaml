  md: '# NOTE


    Pressing CTRL-D on an empty line stops the current input entry from the terminal
    (and often terminates a program). Don''t confuse this with CTRL-C, which terminates
    a program regardless of its input or output.


    Standard output is similar. The kernel gives each process a standard output stream
    where it can write its output. The cat command writes its output to standard output.
    When you run cat in the terminal, the standard output was connected to terminal,
    so that''s where you saw the output.


    Standard input and output are often abbreviated as stdin and stdout. Many commands
    operate as cat does; if you don''t specify an input file, the command reads from
    stdin. It is a little different. Some commands (like cat) send output only to
    stdout, but others have the option to send output directly to files.


    There is a third I/O stream called error. You''ll see it in 2.14.1 Standard Error.


    One of the features of standard streams is that you can easily manipulate them
    to read and write to places other than the terminal, as you''ll learn in 2.14
    Shell Input and Output. In particular, you''ll learn how to connect streams to
    files and other processes.


    # 2.3 Basic Commands


    Now let''s look at some Unix commands. Most of the following programs take multiple
    arguments, and have so many options and formats that an unbridled list would be
    pointless. This is a simplified list of the basic commands; you don''t need all
    of the details just yet.


    # 2.3.1 ls


    The ls lists the contents of a directory. The default is the current directory.
    Use ls -l for a detailed (long) listing and ls -F to display file type. On the
    more files and permissions displayed in the list below, see 2.17 File Modes and
    Permissions. Here is a sample listing; it includes the owner of the file (column
    3), the group (column 4), the size (column 5), and the modification date/time
    (between column 5 and the filename):


    ```

    $ ls -l

    total 3616

    -rw-r--r-- 1 user users 3804 Apr 30 2011 abusive.c

    -rw-r--r-- 1 user users 4165 May 26 2010 battery.zip

    -rw-r--r-- 1 user users 13121 Oct 26 2012 beav_1.40-13.tar.gz

    -rw-r--r-- 1 user users 6255 May 30 2010 country.c

    drwx-xr-x 2 user users 4096 Jul 17 20:00 cs335

    -rwxr-xr-x 1 user users 7108 Feb 2 2011 dhry

    -rw-r--r-- 1 user users 11309 Oct 20 2010 dhry.c

    -rw-r--r-- 1 user users 56 Oct 6 2012 doi

    drwxr-xr-x 6 user users 4096 Feb 20 13:51 dw

    drwxr-xr-x 2 user users 4096 May 2 2011 hough-stuff

    ```


    You''ll learn more about the d in column 1 of this output in 2.17 File Modes and
    Permissions.'
