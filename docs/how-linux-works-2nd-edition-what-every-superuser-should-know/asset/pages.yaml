  md: '# 1.5 Users


    The Linux kernel supports the traditional concept of a Unix user. A *user* is
    an entity that can run processes and own files. A user is associated with a *username*.
    For example, a system could have a user named billyjoe. However, the kernel does
    not manage the usernames; instead, it identifies users by numeric identifiers
    called *userids*. (You''ll learn more about how the usernames correspond to users
    in Chapter 7.)


    Users exist primarily to support permissions and boundaries. Every user-process
    has a user *owner*, and processes are said to run as the *root*. A user may terminate
    or modify the behavior of its processes (within certain limits), but cannot interfere
    with other users'' processes. In addition, users may their own files and choose
    whether they share them with other users.


    A Linux system normally has a number of users in addition to those that correspond
    to the human beings who use the system. You''ll read about these in more detail
    in Chapter 3, but the most important user to know is *root*. The root user is
    an exception to the preceding rules because root may terminate and alter another
    user''s processes and read any file on the local system. For this reason, root
    is known as the *superuser*. A person who can operate as root is said to have
    *root access* and is an administrator on a traditional Unix system.


    # NOTE


    Operating as root can be dangerous. It can be difficult to identify and correct
    mistakes because the system will let you do anything, even if what you''re doing
    is harmful to the system. For this reason, system designers constantly try to
    make root access as unnecessary as possible, for example, by not requiring root
    access to switch between wireless networks on a notebook. In addition, as powerful
    as the root user is, it still runs in the operating system''s user mode, not kernel
    mode.


    Groups are sets of users. The primary purpose of groups is to allow a user to
    share file access to other users in a group.


    # 1.6 Looking Forward


    So, you''ve seen what makes up a *running* Linux system. User processes make up
    the environment that you directly interact with; the kernel manages processes
    and hardware. Both the kernel and processes reside in memory.


    This is great background information, but you can''t learn the details of a Linux
    system by reading about it alone; you need to get your hands dirty. The next chapter
    start your journey by teaching you that this chapter doesn''t discuss—long-term
    storage (disks, files, etc.). After all, you need to store your programs and data
    somewhere.'
  merge: -1
