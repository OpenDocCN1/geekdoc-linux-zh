    # ## 6.6.3 run-parts


    The mechanism that System V uses to run the init.d scripts has found its way into
    many Linux systems, regardless of whether you use System V init. It''s a utility
    called run-parts, and the only thing it does is run a bunch of executable programs
    in a given directory, in some kind of predictable order. You can think of it as
    almost a person who runs the ls command in some directory and then runs whatever
    programs they see in the output.


    The default behavior is to run all programs in a directory, but you often have
    the option to select certain programs and ignore others. In some distributions,
    you don''t need control over the programs that you run. For example, Fedora ships
    with a simple run-parts utility.


    Other distributions, such as Debian and Ubuntu, have more complicated run-parts
    program. These features the ability to run programs based on a regular expression
    (for example, using the [0-9]* expression for running all "start" scripts in an
    /etc/init.d runlevel directory) and pass arguments to the programs. These capabilities
    allow you to start and stop System V runlevels with a single command.


    You don''t need to understand the details of how to use run-parts; in fact, most
    people don''t know that run-parts even exists. The main things to remember are
    that it shows up scripts from time to time and it exists to run the programs in
    a given directory.


    # ## 6.6.4 Controlling System V init


    Occasionally, you''ll need to give init a little kick to switch to runlevels,
    reconfigure its configuration, or shut down the system. To control System V init,
    use telinit. For example, to switch to runlevel 3, enter:


    ```

    # telinit 3

    ```


    When switching runlevels, init tries to kill off all processes not in the initab
    file for the new runlevel, so be careful when changing runlevels.


    When you need to add or remove jobs, or any other change to the initab file, you
    must tell init about the change and let it reload the file. The telinit command
    for this is:


    ```

    # telinit q

    ```'
