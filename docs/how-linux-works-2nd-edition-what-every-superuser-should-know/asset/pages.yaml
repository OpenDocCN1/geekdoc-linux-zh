    # NOTE


    It''s worth repeating that when you quote a string, the shell treats everything
    inside the quotes as a single parameter. Therefore, a b c counts as three parameters,
    but a "b c" is only two.


    # 11.3 Special Variables


    Most shell scripts understand command-line parameters and interact with the variables
    they run. To make your scripts from just being a simple list of commands to becoming
    more flexible shell programs, you need to know how to use the special Bourne variables.
    These variables are like any other shell variable as described in 2.8 Environment
    and Shell Variables, except that you cannot change the values of certain ones.


    # NOTE


    After the next few sections, you''ll understand why scripts accumulate many special
    characters as they are written. If you''re trying to understand a shell script
    and you come across a line that looks completely incomprehensible, pick it apart
    piece by piece.


    # 11.3.1 Individual Arguments: $1, $2, ...


    $1, $2, and all variables named as positive nonzero integers contain the values
    of the script parameters, and arguments. For example, say the name of the following
    script is pshow:


    ```

    #!/bin/sh

    echo First argument: $1

    echo Third argument: $2

    ```


    Try running the script as follows to see how it prints the arguments:


    ```

    $ ./pshow one two three

    First argument: one

    Third argument: two

    ```


    The built-in shift command can be used with argument variables to remove the first
    argument ($1) and advance the rest of the arguments forward. Specifically, $2
    becomes $1, $3 becomes $2, and so on. For example, assume the name of the following
    script is shift:


    ```

    #!/bin/sh

    echo Argument: $1

    shift

    echo Argument: $1

    shift

    echo Argument: $1

    ```'
