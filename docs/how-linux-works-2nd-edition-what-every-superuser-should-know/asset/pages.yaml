  md: '# 2.5 find and locate


    It’s frustrating when you know that a certain file is in a directory tree somewhere
    but you just don’t know

    where. Run `find` to find `file` in `dir:`


    ```

    $ find -name file -print

    ```


    Most programs in this section, `find` is capable of some fancy stuff. However,
    don’t try options such as

    `-exec` before you know the form they show by using `-name` and `-print` options.

    The `find` command accepts pattern-matching characters like `*`, which you must
    enclose them in

    single quotes `''''` to protect the characters from the shell’s overall globbing
    feature. (Recall from 2.4.4 Shell Globbing (Wildcards) that the shell expands
    before running commands.)


    Most systems have a `locate` command for finding files. Rather than searching
    for a file in real time,

    `locate` searches an index that the system builds periodically. Searching with
    `locate` is much faster than

    find, but if the file you’re looking for is newer than the index, `locate` won’t
    find it.


    # 2.5.7 head and tail


    To quickly view a portion of a file or stream of data, use the `head` and `tail`
    commands. For example, `head

    `/etc/passwd` shows the first 10 lines of the password, and `tail` `/etc/passwd`
    shows the last 10

    lines.


    To change the number of lines to display, use the `-n` option, where $n$ is the
    number of lines you want to see

    (for example, `head -5` `/etc/passwd`). To print lines starting at $n$, use `tail`
    $+n$.


    # 2.5.8 sort


    The `sort` command quickly puts the lines of a text file in alphanumeric order.
    If file’s lines start

    numbers and you want to sort in numerical order, use the `-n` option. The `-r`
    option reverses the order of the

    sort.


    # 2.6 Changing Your Password and Shell


    The `passwd` command to change your password. You’ll be asked for your old password
    and then

    prompt for your new password. Choose a password that does not include real words
    in any language

    and try to combine words.


    One of the easiest ways to create a good password is to pick a sentence, produce
    an acronym from it, and then

    modify it with a number or some punctuation. All you need to remember is the sentence.


    You can change your shell with the `chsh` command, (to an alternative such as
    `ksh` or `tcsh`), but keep in

    mind that this book assumes that you’re running `bash`.


    # 2.7 Dot Files


    Change to your home directory, take a look around `ls`, and run `ls -a`. Do you
    see the difference

    in the output? When you run `ls` without the `-a`, you won’t see the configuration
    files called `dot files`. These

    are files and directories whose name begin with a dot (.). Common dot files are
    `.bashrc` and `.login`, and there

    are directories, such as `.ssh`.


    There is nothing special about dot files or directories. Programs don’t show them
    by default so you

    won’t see a complete message listing the contents of your home directory. For
    example, `ls` doesn’t list dot

    unless you use the `-a` option. In addition, shell doesn’t match dot files unless
    you explicitly use a

    pattern such as `.*`.'
