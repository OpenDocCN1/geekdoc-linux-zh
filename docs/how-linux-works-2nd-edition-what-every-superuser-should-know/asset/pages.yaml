  md: 'the transfer first because the source side exists on both ends, with the same
    modification dates.


    When the files on the source side are not identical to the destination side, rsync
    transfers the source files and overwrites files that exist on the remote side.
    The default behavior may be inadequate, though you may need additional reassurance
    that files are the same before skipping them over in transfers, or you may want
    to put in some extra safeguards. Here are some options that come in handy:


    +   - checksum (abbreviation: -c) Compute checksums (mostly unique signatures)
    of the file to see if they''re the same. This consumes additional I/O and CPU
    resources during transfers, if you''re dealing with sensitive data or files that
    have uniform sizes, this is a must.


    +   - --ignore-existing Doesn''t clutter files already on the target.


    +   - --backup (abbreviation: -b) Doesn''t clutter files already on the target
    but rather rename existing files by adding a suffix to their names before transferring
    the new files.


    +   - --suffix=s Changes the suffix with --backup from ~ s.


    +   - --update (abbreviation: -u) Doesn''t clutter any file on the target that
    has a later date than the corresponding file on the source.


    With no options, rsync -v for verbose mode or rsync -vv for more details. However,
    when producing output there is a problem. (You can take as many v you use, but
    that is probably more than you need.) For a comprehensive summary of the transfer,
    use rsync --stats.


    # 12.2.6 Compression


    Many use the -z option in conjunction with -a to compress the data before transmission:


    ```

    $ rsync -az host:destination_dir

    ```


    Compression can improve performance in certain situations, such as when uploading
    a large amount of data across a cross connection (like the slow uplink over many
    DSL connections) or when the latency between the two hosts is high. However, across
    a fast local area network, the two endpoints can be constrained by the CPU time
    to compress and decompress data, so uncompressed transfer may be faster.


    # 12.2.7 Limiting Bandwidth


    It''s easy to clog the uplink of Internet connections when uploading a large amount
    of data to a remote host. Even you might not be using your (normal) low bandwidth
    capacity during such a transfer, your connection will still slow quite if you
    let rsync go as fast as it can, causing TCP packets such as HTTP requests will
    have to compete with your transfers for bandwidth on your uplink.


    To get around, use --bwlimit to give your uplink a little breathing room. For
    example, to limit the bandwidth to 10000 Kbps you might do something like this:


    ```

    $ rsync --bwlimit=10000 -a host:destination_dir

    ```


    # 12.2.8 Transferring Files to Your Computer


    The rsync command isn''t just for copying files from your local machine to a remote
    host. You can also sync transfer files from a remote machine to your local host
    by placing the remote host and source path as the first argument on the command
    line. Therefore, to use src_dir on the host to dest_dir on the local host, run
    this command:


    ```

    $ rsync -a host:src_dir dest_dir

    ```'
