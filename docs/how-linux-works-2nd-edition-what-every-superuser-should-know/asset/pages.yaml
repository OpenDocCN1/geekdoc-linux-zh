  md: 'To mount a filesystem, use the mount command as follows with the file-system
    type, device, and desired mount point:


    +   # mount -t type device mountpoint


    For example, mount the Fourth Extended filesystem /dev/sdf2 on /home/extra, use
    this command:


    +   # mount -t ext4 /dev/sdf2 /home/extra


    You normally don''t need to supply the - type option because mount can usually
