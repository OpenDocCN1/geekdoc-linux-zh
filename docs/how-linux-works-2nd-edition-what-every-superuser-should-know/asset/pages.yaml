  md: '*at expands to all filenames that contain at.


    If no files match, the shell performs no expansion, and the command runs with
    literal characters as *. For example, try a command such as echo *dfkdsfah.


    # NOTE


    If you''re used to MS-DOS, you might instinctively type *. to match all files.
    This habit now. In Linux and other versions of Unix, you must use * to match all
    files. In the shell, * matches only files and directories that contain the dot
    (.) character in their names. Unix filenames do not need extensions and do not
    carry them.


    Another shell glob, the question mark (?), instructs the shell to match exactly
    one arbitrary character. For example, bat matches boat and brat.


    If you don''t want to expand a glob in a command, enclose the glob in single quotes
    (''''). For example, the command echo ''*'' prints a star. You will find this
    for a few of commands in the next section, such as grep and find. You''ll learn
    more about quoting in 11.2 Quoting and Literals.


    # NOTE


    It is important to remember that the shell performs expansions before running
    commands, and only then. Therefore, if * makes it to a command without expanding,
    the shell will do nothing with it; it''s up to the command to decide what it wants
    to.


    There is more to a modern shell''s pattern-matching capabilities, but * and ?
    are what you need to know now.


    # 2.5 Intermediate Commands


    The following sections describe the most essential intermediate Unix commands.


    # 2.5.1 grep


    The grep command prints the lines from a file or input stream that match an expression.
    For example, to print the lines in the /etc/passwd file that contain the text
    root, enter this:


    ```

    $ grep /etc/passwd

    ```


    The grep command is extraordinarily handy when operating on multiple files at
    once because it prints the filename to the matching line. For example, if you
    want to check every file in /etc that contains the root word, you could use this
    command:


    ```

    $ grep /etc/*

    ```


    Two of the most grep options are -i (for case-insensitive matches) and -v (which
    inverts the search, is prints all lines that don''t match). There is also a more
    powerful variant called egreg (which is just a synonym for grep -E).


    grep understands patterns how regular expressions are used in computer science
    theory and are common in Unix units. Regular expressions are more powerful than
    wildcard-style patterns, and they have a different syntax. Two are important things
    to remember about regular expressions:


    +   * matches any number of characters (like the * in wildcards)

    * matches one arbitrary character.


    # NOTE


    The grep(1) manual page contains a detailed description of regular expressions,
    but it can be a little difficult to read. To learn more, you can read Mastering
    Regular Expressions, 3rd edition (O''Reilly, 2006), or see the regular expressions
    of Programming Perl, 4th edition (O''Reilly),'
