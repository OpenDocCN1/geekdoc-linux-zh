    wrote 2183 bytes read 24 bytes 401.27 bytes/sec

    ```


    # 12.2.2 Making Extra Copies of a Directory Structure


    By default, rsync copies files and directories without considering the contents
    of the destination directory. For example, if you transferred the directory containing
    the files a and b to a machine that had a file d/c, the destination would contain
    d/a, d/b, and c after the rsync.


    To make an exact copy of the source, you must delete the files in the destination
    directory that do not exist in the source of the directory, such as d/c in this
    case. Use the --delete option to that:


