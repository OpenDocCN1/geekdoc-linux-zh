  md: 'When you refer to a file or directory, you specify a *path* or *pathname*.
    When a path starts with / (such as `/usr/lib`), it''s a *full* or *absolute* path.


    A path identified by two dots (...) specifies the parent of a directory. For example,
    if you''re working in `/usr/lib`, `..` refers to `/usr`. Similarly, `../bin` refers
    to `/usr/bin`.


    One dot (.) refers to the current directory; for example, if you''re in `/usr/lib`,
    the `path` is still `/usr/lib`, and `/X11` is `/usr/lib/X11`. You don''t have
    to use `.` very often because most commands can default to the current directory
    if a path doesn''t start with / (you could just use `X11` instead of `/X11` in
    the preceding example).


    A path not beginning with / is called a *relative path*. Most of the time, you''ll
    work with relative paths because you''ll already be in the directory you need
    to be or somewhere close by.


    Now that you have a sense of the basic directory mechanics, here are some essential
    commands:


    # 2.4.1 cd


    The *working directory* is the directory that a process (such as the shell) is
    currently in. The `cd` command changes the shell''s working directory:


    ```

    $ cd dir

    ```


    If you omit *dir*, the shell returns to your *home directory*, the directory you
    started in when you first logged in.


    # 2.4.2 mkdir


    The `mkdir` command creates a new directory `dir`:


    ```

    $ mkdir dir

    ```


    # 2.4.3 rmdir


    The `rmdir` command removes the directory `dir`:


    ```

    $ rmdir dir

    ```


    If `dir` isn''t empty, this command fails. However, if you''re impatient, probably
    won''t want to laboriously delete all the files and subdirectories inside `dir`
    first. You can use `rm -rf dir` to delete a directory and its contents, but this
    is one of the commands that can cause serious damage, especially if you run it
    as the superuser. The `-r` option specifies *recursive delete* to repeatedly delete
    everything inside `dir`, and `-f` forces the deletion. Only use the `-rf` flags
    with globs as a star (*). And above all, always double-check your command before
    you run it.


    # 2.4.4 Shell Globbing (Wildcards)


    The shell can match patterns to filenames and directory names, a process known
    as *globbing*. The simplest of these is the glob character *, which tells the
    shell to match any number of arbitrary characters. For example, the following
    command prints a list of files in the current directory:


    ```

    $ echo *

    ```


    The shell matches containing globs to filenames, substitutes the filenames for
    those arguments, and then runs the command line. The substitution is called *expansion*
    because the shell substitutes all matching filenames. There are some ways to use
    * to expand filenames:


    +   * expands to all filenames that start with *


    +   * expands to all filenames that end with *'
