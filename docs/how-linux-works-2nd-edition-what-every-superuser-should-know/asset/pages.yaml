  md: 'You''ll hear the term state in reference to memory, processes, the kernel,
    and other parts of a computer system. Strictly speaking, a state is a particular
    arrangement of bits. For example, if you have four bits in your memory, 0110,
    0001, and 1011 represent three different states.


    When you consider a single process can easily consist of millions of bits in memory,
    it''s easier to use abstract terms when talking about states. Instead of describing
    using bits, you describe what something has done or is doing at the moment. For
    example, you might say "the process is waiting for input" or "the process is performing
    Stage 2 of its startup."


    # NOTE


    Because it''s common to refer to the state in abstract terms rather than the actual
    bits, the term image refers to a particular physical arrangement of bits.


    # 1.3 The Kernel


    Why are we talking about main memory and states? Everything that the kernel does
    revolves around main memory. One of the kernel''s tasks is to split memory into
    many subdivisions, and it must maintain certain state information about those
    subdivisions at all times. Each process gets its own share of memory, and the
    kernel must ensure that each process keeps to its state.


    The kernel is in charge of managing tasks in four general systems:


    +   * Processes. The kernel is responsible for determining which processes are
    allowed to use the CPU.

    * Memory. The kernel needs to keep track of all memory—what is currently allocated
    to a particular process, what might be shared between processes, and what is free.

    * Device drivers. The kernel acts as an interface between hardware (such as a
    disk) and processes. It''s usually the kernel''s job to operate the hardware.

    * System calls and support. Processes normally use system calls to communicate
    with the kernel.


    We''ll briefly explore each of these areas.


    # NOTE


    If you''re interested in the details workings of a kernel, two textbooks are Operating
    System Concepts, 9th edition, by Abraham Silbersatz, Peter B. Galvin, and Greg
    G (2012) and Modern Operating Systems, 4th edition, by Andrew S. Tanenbaum and
    Herbert Bos (Prentice Hall, 2014).


    # 1.3.1 Process Management


    Process management describes the starting, pausing, resuming, and terminating
    of processes. The concepts behind starting and terminating are fairly straightforward,
    but describing how a process uses the CPU in its normal course of operation is
    a bit more complex.


    On any modern operating system, many processes run "simultaneously.\ For For example
    you might have a web browser and a spreadsheet on a desktop at the same time.
    However, things are not as they appear: The processes before these typically do
    not run at exactly the same time.


    Consider a system with a one-core CPU. Many processes may be able to use the CPU,
    but only one process actually use the CPU at any given time. In practice, each
    process uses the CPU for a small fraction of a second; then another process uses
    the CPU for another small fraction of a second; then so on. And the act of one
    process giving control of the CPU to another process is called a context switch.


    Each piece of time—called a time slice—gives enough time for significant computation
    (and, indeed,'
