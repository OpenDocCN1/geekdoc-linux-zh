  md: 'partitions at the proper offsets from the beginning of the disks, so you may
    never need to worry about improper partition alignment. However, if you''re curious
    where your partitions are and just want to make sure they begin on a boundary,
    you can easily find this information by looking in `/sys/block`. Here''s an example
    for a partition `/dev/sdf2`:


    ```

    $ cat /sys/block/sdf/sdf2/start

    ```


    1953126


    This part starts at 1,953,126 bytes from the beginning of the disk. Because this
    number is not divisible by 4,096, the partition would not be attaining optimal
    performance if it were on SSD.


    # 4.2 Filesystems


    The last link between the kernel and user space for disks is typically the file-system;
    this is what you''re accustomed to interacting with when you run commands as `ls`
    and `cd`. As previously mentioned, the filesystem is a form of database; it supplies
    the structure to transform a simple block into device the sophisticated hierarchy
    of files and subdirectories that users can understand.


    At one time, filesystems resided on disks and other physical media used exclusively
    for data storage. However, the tree-like directory structure and I/O interfaces
    are quite versatile, so filesystems now perform variety of tasks, such as the
    system interfaces that you see in `/sys` and `/proc`. Filesystems are also implemented
    in the kernel, but the invention of 9P from Plan 9 (http://plan.bell-labs.com/sys/doc9.html)
    has inspired the development of user-space systems. The File System in User Space
    (FUSE) allows user-space filesystems in Linux.


    The Virtual File System (VFS) abstraction layer completes the filesystem implementation.
    As the SCSI subsystem understands communication between different device types
    and kernel control commands, VFS ensures that all filesystem implementations support
    a standard interface so that user-space applications access files and directories
    in the same manner. VFS support has enabled Linux to support an extraordinarily
    large number of filesystems.


    # 4.2.1 Filesystem Types


    Linux supports native designs for Linux, foreign types such as the Windows FAT,
    universal filesystems like ISO9960, and many others. The following list includes
    the most common types of filesystems for data storage. The type names recognized
    by Linux are in parentheses next to what they are


    +   - The Fourth Extended filesystem (ext4) is the current iteration of a line
    of filesystems native to Linux. The Second Extended filesystem (ext2) was a longterm
    debut for Linux systems inspired by traditional Unix filesystems such as the Unix
    File System (UFS) and the Fast File System (FFS). The Third Extended filesystem
    (ext3) added a feature (a small cache outside the normal filesystem data structure)
    to enhance data integrity and hasten booting. The ext4 filesystem is an incremental
    improvement with support for larger files than ext2 or ext3 support and a greater
    number of subdirectories.


    There is a certain amount of backward compatibility in the extended filesystem
    series. For example, you can mount ext2 and ext3 filesystems as each other, and
    you can mount ext2 and ext3 filesystems as ext4, but you cannot mount ext4 as
    ext2 or ext3.


    +   - ISO9960 (iso9960) is a CD-ROM standard. Most CD-ROMs use some variety of
    the ISO 9960 standard.


    +   - FAT filesystems (msdos, vfat, udsdos) pertain to Microsoft systems. The
    simple msdos type supports the very primitiveing variety in MS-DOS systems. For
    most modern Windows filesystems, you should'
