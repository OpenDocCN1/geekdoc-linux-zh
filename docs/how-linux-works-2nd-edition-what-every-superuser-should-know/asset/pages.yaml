  md: '# Dispatching


    One final detail of NetworkManager configuration relates to specifying additional
    system actions for when a network interface goes up or down. For example, some
    network daemons need to know when to start or stop listening on an interface to
    work correctly (such as the sheer daemon discussed in the next chapter).


    When the network interface status on a system changes, NetworkManager runs everything
    in /etc/NetworkManager/dispatcher.d with an argument such as up or down. This
    is relatively straightforward, but many distributions have their own network control
    scripts so they don''t place the individual dispatcher scripts in this directory.
    Ubuntu, for example, has just one script ifupdown that runs everything in an appropriate
    subdirectory of /etc/network, such as /etc/network/if-up.d.


    With the rest of NetworkManager configuration, the details of these scripts are
    relatively unimportant; all you need to know is how to track down the appropriate
    location if you need to make an addition or change. As don''t be ever looking
    layouts on your system.


    # 9.12 Resolving Hostnames


    One of the final tasks in any network configuration is hostname resolution with
    DNS. You''ve already used the host resolution tool which translates a name such
    as www.example.com to an IP address such as 10.23.2.132.


    DNS differs from the network elements we''ve looked at so because it''s out of
    place in the application layer, entirely in user space. Technically, with proper
    DNS configuration, your Internet connection is worthless unless in their right
    advertises IP addresses for websites and email addresses because a host''s IP
    address is subject to change and it''s not easy to remember a bunch of numbers.
    Automatic network configuration services such as DHCP nearly always include DNS
    configuration.


    Nearly all network applications on a Linux system perform DNS lookups. The resolution
    process typically unfolds like this:


    +   1. The application calls a function to look up the IP address for a hostname.
    This function is in the system''s shared library, so the application doesnt need
    to know the details of how it works or what the implementation will change.


    +   2. When the function in the shared library runs, it according to a set of
    rules (found in /etc/nwitch.conf) to determine a plan of action on lookup. For
    example, the rules usually say that before going to DNS, check for a manual override
    in the /etc/hosts file.


    +   3. When the function decides to use DNS for name lookup, it consults an additional
    configuration file to find a DNS server. The name server is given as an IP address.


    +   4. The function sends a DNS lookup request (over) to the name server.


    +   5. The name server replies with the IP address for the hostname, and the function
    returns this IP address to the application.


    This is the simplified version. In a typical modern system, there are more actors
    attempting to speed up the transaction/or add flexibility. Let''s ignore that
    for now and take a closer look at the basic pieces.


    # 9.12.1 /etc/hosts


    On most systems, you can override hostname lookups with the /etc/hosts file. It
    usually looks like this:


    ```

    127.0.0.1     localhost

    ```'
