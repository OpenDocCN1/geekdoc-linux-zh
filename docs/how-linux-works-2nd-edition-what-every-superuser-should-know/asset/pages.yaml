    | dev | cs | queue | sda2 | subsystem |

    | device | ext_range | range | sda5 | trace |


    The files and subdirectories here are meant to be read primarily by programs rather
    than humans, but you can get an idea of what they contain and represent by looking
    at an example such as the /dev. Running cat in this directory displays the numbers
    8:0, which happen to be the major and minor device numbers of /dev/.


    There are a few shortcuts in the /sys directory. For example, /sys/block should
    contain all of the block devices available on a system. However, those are just
    symbolic links; ls -l /sys/block to reveal the type paths.


    It can be difficult to find the sysfs location of a device in /dev. The udevadm
    command to show the path and other attributes:


    ```

    $ udevadm info --query-all --name=/dev/sda

    ```


    # NOTE


    > The udevadm program is in /sbin; you can put this directory at the end of your
    path if it''s not already.


    You''ll find more details udevadm and the entire udev system in 3.5 udev.


    # 3.3 dd and Devices


    The program dd is extremely useful when working with block and character devices.
    This program''s solution is to read from an input file or stream and write to
    an output file, possibly doing some encoding conversion over the way.


    dd copies data blocks of a fixed size. Here''s how to use dd with a character
    device and some common options:


    ```

    $ dd if=/dev/zero new_file bs=1024 count=1

    ```


    As you can see, the dd option differs from the options of most other Unix commands;
    it''s based on an old IBM Job Control Language (JCL) style. Rather than using
    the (—) character to select an option, you name an option and set its value to
    something with the (=). The preceding example copies a 1024-byte block from /dev/zero
    (a continuous stream of zero bytes) to new_file.


    These are the dd options:


    +   - if=file The input file. The default is the standard output.

    - of=file The output file. The default reads and writes bytes of data at a time.
    To abbreviate large chunks of data, you use bs and k to signify 512 and 1024 bytes,
    respectively. Therefore, the example could read bs=1k instead of bs=1024.'
