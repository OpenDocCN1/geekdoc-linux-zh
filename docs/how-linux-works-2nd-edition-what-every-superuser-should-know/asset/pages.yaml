    mode=755,nosuid,nodev,noexec (code-exited, status=0/SUCCESS)

    CGroup: name=systemd:/system/media.mount

    ```


    Notice that there is more information output here than you would see on any traditional
    system. You get not only the status of the unit but also the command to perform
    the unit, PID, and its status.


    One of the most interesting pieces of the unit is the control group name. In the
    preceding example, the control group doesn''t process any information other than
    the name systemd:/system/media.mount because the unit''s processes have already
    terminated. If you get the status of a service such as NetworkManager.service,
    you will also see the process tree of the control group. You can view control
    groups without the rest of the unit using the systemd-cgroups. You''ll learn about
    control groups in 6.4.6 systemd Process Tracking and Synchronization.


    The status command also displays recent information from the unit''s journal (a
    log that records diagnostic information for each unit). You can view your unit''s
    journal with this command:


    ```

    $ journalctl _SYSTEMD_UNIT=unit

    ```


    (This syntax is also odd because journalctl can access the logs of more than just
    a systemd unit.)

    To activate, deactivate, and restart units, use the systemctl start, stop, and
    restart commands. However, if you''ve changed a unit configuration file, you can
    tell systemctl to reload the file in one of two ways:


    | systemctl reload unit | Reloads the configuration for unit. |

    | systemctl daemon-reload | Reloads all unit configurations. |


    Requests to activate, reactivate, and restart units are known as jobs in systemd,
    and they are essentially state changes. You can check the current jobs on a system
    with


    ```

    $ systemctl list-jobs

    ```


    If a system has been running for some time, you can expect there to be no active
    jobs on it because all of the activations will be complete. However, at boot,
    you can sometimes log fast enough to see some units start so slowly they are not
    yet fully active. For example:


    | JOB UNIT | | STATE |

    | 1 graphical.target | start | waiting |

    | 2 multi-user.target | start | waiting |

    | 71 systemd-...nlevel.service | start | waiting |

    | 75 sm-client.service | start | waiting |

    | 76 sendmail.service | start | running |

    | 120 systemd-...ead-done.timer | start | waiting |


    In this case, the sendmail.service unit startup is taking a really long time.
    The other jobs are in a waiting state, most likely because they''re waiting for
    job 76. When sendmail.service finishes starting and becomes fully active, job
    76 completes, the rest of the jobs will also complete, and the job list will be
    empty.'
