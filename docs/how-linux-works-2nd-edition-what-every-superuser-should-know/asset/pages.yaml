  md: '# 9.11 Network Configuration Managers


    There are ways to automatically configure networks in Linux-based systems. The
    most widely used option on desktops and notebooks is NetworkManager. Other network
    configuration systems are mainly targeted for smaller embedded systems, such as
    OpenWRT netif, Android''s Connectivity service, ConnMan, and Wic. We will briefly
    discuss NetworkManager because it is the one you''re most likely to encounter.
    We won''t go into a tremendous amount of detail, though, after you see the picture,
    NetworkManager and other configuration systems will be more transparent.


    # 9.11.1 NetworkManager Operation


    NetworkManager is a daemon that the system starts upon boot. Like all daemons,
    it does not depend on a running desktop environment. Its job is to listen to events
    from the system and users to change the network configuration based on a bunch
    of rules.


    When running, NetworkManager maintains two basic levels of configuration. The
    first is a collection of information about available devices, which it collects
    from the kernel and maintains by monitoring over the Desktop Bus (D-Bus). The
    second configuration level is a more specific list of connections: hardware devices
    and additional physical and network layer configuration parameters. For example,
    a wireless network can be represented as a connection.


    To activate a connection, NetworkManager often delegates the tasks to specialized
    networks and daemons such as dhclient to get Internet configuration from a locally
    attached physical network. Because network configuration and schemes vary among
    distributions, NetworkManager uses plugins to interface with them, rather than
    imposing its own standard. There are plugins for the Debian/Ubuntu and Hat-style
    interface configuration, for example.


    Upon startup, NetworkManager gathers all network device information, searches
    its list of connections, and decides to activate one. Here''s how that decision
    for Ethernet interfaces:


    +   1. If a wired connection is available, try to connect using it. Otherwise,
    the wireless connections.

    2. Scan the list of available wireless networks. If a network is available that
    you''ve previously connected to, NetworkManager will try it again.

    3. If more than one previously connected wireless networks are available, select
    the most recently connected.


    After establishing a connection, NetworkManager maintains it until the connection
    is lost, a better network becomes available (for example, by plugging in a network
    cable while connected wireless), or the user forces a change.


    # 9.11.2 Interacting with NetworkManager


    Most users interact with NetworkManager through an applet on the desktop—it''s
    usually an icon in the upper or lower right that indicates the connection status
    (wired, connected, or not). When you click on the icon, you get a number of connectivity
    options, as a choice of wireless networks and an option to disconnect from your
    current network. Each desktop environment has its own version of this applet,
    so it looks a little different on each.


    In addition to the applet, there are a few tools you can use to control NetworkManager
    from your shell. For a quick summary of your current connection status, use the
    nm-tool command with. You''ll get a list of interfaces and configuration parameters.
    In some ways, this is like ifconfig except that there''s more detail, especially
    when viewing wireless connections.


    To control NetworkManager from the command line, use the nmcli command. This is
    a somewhat extensive'
