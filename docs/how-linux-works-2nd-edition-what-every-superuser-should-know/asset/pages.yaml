- img_proc: true
  md: '# 6.4 systemd Auxiliary Programs


    When starting up with systemd, you notice the exceptionally large number of programs
    in /lib/systemd. These are primary support programs for units. For example, udev
    is part of systemd and you''ll find it as systemd-udev. Another, the systemd-fsck
    program, works as a middleware between systemd and fck inside.


    Many of these programs exist because they contain notification mechanisms that
    the standard system utilities lack. Often, they simply run the system utilities
    and notify systemd of the results. (After all, it would be silly to try reinvent
    all of fck inside systemd.)


    One other interesting aspect of these programs is that they are written in C,
    because one goal of systemd is to reduce the number of shell scripts on a system.
    There is some debate as to whether it''s a good idea to do so (after all, many
    of these programs could probably be written as shell scripts), but also everything
    works does so reliably, securely, and quickly, there''s little reason to bother
    taking sides.


    When you see a program in /lib/systemd that you can''t identify, see the manual
    page. There''s a good chance that the manual page will not only describe the utility
    but also describe the type of unit it''s meant to augment.


    If you''re not running (or interested in) Upstart, 6.6 System V init for an overview
    of the System V process.


    # 6.5 Upstart


    The Upstart version of init revolves around jobs and events. Upstart are startup
    and runtime actions for Upstart to perform (such as system services and configuration),
    and events are messages that Upstart receives from itself or other processes (such
    as udev). Upstart works by jobs to respond to events.


    To get an idea of how this works, consider the udev job for starting the udev
    daemon. The configuration file is typically /etc/init/udev.conf, which includes
    the following:


    ```

    start on virtual-filesystems

    stop on runlevel [06]

    ```


    These lines mean that Upstart starts the udev job upon receiving the virtual-filesystems
    event, and it stops the job upon receiving a runlevel with an argument of 0 or
    6.


    There are many variations on events and their arguments. For example, Upstart
    can react to events emitted in response to the started udev event emitted by the
    udev job above. Before explaining jobs in detail, here''s a high-level overview
    of how Upstart works.


    # 6.5.1 Upstart Initialization Procedure


    Upon startup, Upstart does the following:


    +   1. Loads its configuration and the job configuration files in /etc/init.

    2. Emits the startup event.

    3. Runs jobs configured to start upon receiving the startup event.

    4. These initial jobs emit their own events, with a normal startup, Upstart continues
    to monitor and react to events


    Upon finishing all jobs associated with a normal startup, Upstart continues to
    monitor and react to events during the entire system uptime.'
  merge: -1
  pgno: 109
