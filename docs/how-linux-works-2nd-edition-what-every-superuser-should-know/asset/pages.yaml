    # 7.3.2 Special Users


    You will find few special users in /etc/passwd. The superuser (root) has UID 0
    and GID 0, as in Example 7-2. Some users, such as daemon, have no login privileges.
    The nobody user is an underprivileged user. Processes run as nobody because the
    nobody user cannot write to anything on the system.


    The users that cannot log are called pseudo-users. Although they can''t log, the
    system can start processes with their user IDs. Pseudo-users such as nobody are
    usually created for security reasons.


    # 7.3.3 The /etc/shadow


    The shadow file /etc/shadow on a Linux system normally contains user authentication
    information, including the encrypted passwords and password expiration information
    that corresponds to the users in /etc/passwd.


    The shadow file was introduced to provide a more flexible (and secure) way of
    storing passwords. It includes a suite of libraries and utilities, many of which
    were replaced by pieces of PAM (see 7.10 PAM). Rather than introducing an entirely
    new set of fields for Linux, PAM uses /etc/shadow; but not certain configuration
    files such as /etc/login.defs.


    # 7.3.4 Manipulating Users and Passwords


    Regular users interact with /etc/passwd using the password command. By default,
    passwd changes the user''s password, but you can use -f to change the user''s
    real name or -s to change the user''s shell to one in /etc/shells. (You can also
    use the commands chfn and chsh to change the real name and shell.) The passwd
    command is a sudo-root program, because only the superuser can change the /etc/passwd
    file.


    # Changing /etc/passwd as the Superuser


    Because /etc/passwd is plaintext, the superuser may use any text editor to make
    changes. To add a user, add an appropriate line and create a home directory for
    it; delete, the opposite. However, to edit the file, you''ll mostly want to use
    the vip program, which backs up and locks /etc/passwd while you''re editing it
    as an added precaution. To edit /etc/shadow instead of /etc/passwd, use vip -s.
    (You''ll likely never need to do this.)


    Most organizations avoid editing /etc/passwd directly because it''s easy to make
    a mistake. It''s much easier (and safer) to make changes to users using separate
    commands available from the terminal or the GUI.'
