  md: 'find the files for all the units on a system in one place. That said, there
    are two main directories for system configuration: the system unit directory (globally
    configured, usually /usr/lib/systemd/) and a system configuration directory (local
    definitions, usually /etc/systemd/).


    To prevent confusion, stick to this: Avoid making changes to the system unit directory
    because your distribution will maintain it for you. Make your changes to the system
    configuration directory. So given the choice between modifying in /usr and /etc,
    always change /etc.


    # NOTE


    You can check the system unit configuration search path (including precedence)
    with this command:


    ```

    # systemctl -p UnitPath show

    ```


    However, this particular setting comes from a third source: pkg-config settings.
    To see the system unit and configuration directories on your system, use the following
    commands:


    ```

    $ pkg-config systemd --variable=systemdunitdir

    $ pkg-config systemd --variable=systemdconfdir

    ```


    # Unit Files


    Units are derived from the XDG Entry Specification (for .desktop files, which
    are very similar to .ini files on Microsoft systems), with section names in brackets
    ([]) and variable value assignments (options) in each section.


    Consider the example file media.mount in /usr/lib/systemd/system, which is standard
    on Fedora installations. This file represents the /media tmpfs filesystem, which
    is a container directory for mounting removable media.


    ```

    [Unit]


    Description=Media Directory

    Before=local-fs.target


    [Mount]


    What=/media

    Where=tmpfs

    Options=mode=755,nosuid,nodev,noexec

    ```


    There are two sections here. The [Unit] section gives details about the unit and
    contains dependency information. This unit is set to activate before the local-fs.target
    unit.


    The [Mount] section details the unit as being a mount unit, and gives the details
    on the mount point, the type of filesystem, and the options described in 4.2.6
    Filesystem Mount Options. The What= variable identifies the device or UUID of
    the device to mount, it''s set to tmpfs because this filesystem does not have
    a device.


    Many other unit configuration files are similarly straightforward. For example,
    the service unit sshd.service enables secure logins:


    ```

    [Unit]

    ```'
