    | User Processes |

    | Graphical User Interface | Servers | Shell |


    | Linux Kernel |

    | System Calls | Process Management | Memory Management |

    | Device Drivers |


    | Hardware |

    | Processor (CPU) | Main Memory (RAM) | Disks | Network Ports |


    Figure 1-1. General Linux system organization


    There is a critical difference between the ways that the kernel and user processes
    run: The kernel runs in *kernel mode*, and the user processes run in *user mode*.
    Code running in kernel mode has unrestricted access to the processor and main
    memory. This is a powerful but dangerous privilege that allows a kernel process
    to easily crash the entire system. The area that only the kernel can access is
    called *kernel space*.


    User mode, in comparison, restricts access to a (usually small) subset of memory
    and safe CPU operations. *User space* refers to the parts of main memory that
    user processes can access. If a process makes a mistake and crashes, the consequences
    are limited and can be cleaned up by the kernel. This means that if your web browser
    crashes, it probably won''t take down the scientific computation that you''ve
    been running in the background for days.


    In theory, a user process gone haywire can cause serious damage to the rest of
    the system. In reality, it depends on what you consider "serious damage," as well
    as the particular privileges of the process, because more than others. For example,
    can a user process completely wreck the data on a disk? With the correct permissions,
    yes—and you may consider this to be fairly dangerous. There are safeguards to
    prevent this, however, and most processes simply aren''t allowed to wreak havoc
    in this.


    #  1.2 Hardware: Understanding Main Memory


    Of all the hardware on a computer system, *main memory* is perhaps the most important.
    In its most raw form, main memory is just a big storage area for a bunch of 0s
    and 1s. Each 0 or 1 is called a bit. This is where the running kernel and processes
    reside—they are just collections of bits. All input and output from peripheral
    devices flows through main memory; a CPU is just an operator on memory; it reads
    its instructions from memory and writes data back out to memory.


