  md: 'Escape character is ''^''.


    # Hi there.


    Hi there.


    When you''re bored with this, press CTRL-J on a line by itself, and then CTRL-D.
    To stop the service, you stop the socket unit:


    # systemctl stop echo.socket


    # Instances and Handoff


    Because the echo.service supports multiple simultaneous instances, there''s an
    @ in name (recall from Note that signifies parameterization). Why would you want
    multiple instances? The reason is that you may have more than one network client
    connecting to the service at the same time, and each connection has its own instance.


    In this case, the service unit must support multiple instances because of the
    Accept option in echo.socket. That option instructs systemd not only to listen
    on the port, but also to accept incoming connections and pass the incoming connections
    to the service, with each connection a separate instance. Each instance receives
    data from the connection as standard input, but it doesn''t necessarily need to
    know that the data is coming from a network connection.


    > NOTE


    Most network connections require more flexibility than just a simple gateway to
    standard input and output, so you''t be able to create network services with a
    service unit file like the echo@.service unit shown here.


    Although the service unit would do all the work of accepting the connection, it
    wouldn''t have the @ in name if it did. If it did, it would take complete control
    of the service, and systemd wouldn''t attempt to listen on the network port until
    the service unit has finished.


    The different resources and options for handoff to service units make it difficult
    to provide a categorical summary. Also, the documentation for the options is spread
    out several manual pages. The checks for the resource-oriented units are system.socket(5),
    system.path(5), and system.device(5). One document that''s overlooked for service
    units is system.exec(5), which contains information about how the service unit
    can expect to receive a resource upon activation.


    # 6.4.8 systemd V Compatibility


    One feature that sets systemd apart from other-generation init systems is that
    it tries to do a more complete job of tracking services by System V-compatible
    init scripts. It works like this:


    +   1. First, system activates runlevel in /etc/rc<N>.target, where N is the runlevel.


    +   2. For symbolic link name with a service unit (for example, /etc/init.d),
    systemd identifies the script in /etc/init.d.


    +   3. system activates the service unit and runs the script with a start argument,
    based on its name in rc<N>.


    +   5. system employs to associate any processes from the script with the service
    unit.


    Because systemd makes the association with a service unit name, you can use systemctl
    to restart the service or its status. But don''t expect any miracles from System
    V compatibility mode; it must still run the init scripts serially, for example.'
