  md: '# Chapter 1. The Big Picture


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_7_0.png)


    At first glance, a modern operating system like Linux is very complicated, with
    a dizzying number of pieces simultaneously running and communicating. For example,
    a web server can talk to a database server, which could turn in use a shared library
    that many other programs use. But how does it all work?


    The most effective way to understand how an operating system works through abstraction—a
    fancy way of saying that it is new, and when you drive a car, you normally don''t
    need to think about details such as the mounting bolts that hold the motor inside
    the car or the people who maintain the road over which the car drives. If you''re
    a passenger in a car, you really need to know what the car does (transports you
    elsewhere) and a few basics about how to use it (how to operate the door and seat
    belt).


    But if you''re driving a car, you need to know more. You need to learn how to
    operate the controls (such as the steering wheel and accelerator pedal) and what
    to do when something goes wrong.


    For example, let''s say that the car ride is rough. Now you can break up the abstraction
    of “a car that rolls into three parts: a car, a road, and what you''re driving.
    This helps isolate the problem: If the road is bumpy, you don''t blame the car
    or the way you''re driving. Instead, you may to find out why the road has deteriorated,
    or if the road is new, why the construction workers made a lousy job.


    Software developers use abstraction as a tool when building an operating system
    and its applications. There are many terms for it subsystem, module, and package—but
    we use the term component in this chapter because it''s simple. When building
    a software component, developers typically don''t think much about the internal
    structure of other components, but they do care about what components they can
    use and how to use them.


    This chapter provides a high-level overview of the components that make up a Linux
    system. Each one has a tremendous number of technical details in its internal
    makeup, we''re going to ignore these details and concentrate on what the components
    do in relation to the whole system.


    # 1.1 Levels and Layers of Abstraction in a Linux System


    Using abstraction to split computing systems makes things easier to understand,
    but it''s difficult without organization. We arrange components into layers or
    levels. A layer or level is a classification (grouping) of a component according
    to where it sits between the user and the hardware. Web browsers, games, and such
    sit at the top layer; at the bottom layer we have the memory in the computer hardware—the
    0s and 1s. The operating system occupies most of the layers in


    A Linux system has three main levels. Figure 1-1 shows these levels and some of
    the components inside each level. The hardware is at the base. Hardware includes
    the memory as well as one or more central processing units (CPUs) to perform computation
    and to read from and write to memory. Devices such as disks and network interfaces
    are also part of the hardware.


    The next level is the kernel, which is the core of the operating system. The kernel
    software residing in memory that tells the CPU what to do. The kernel manages
    the hardware and acts as an interface between the hardware and any running program.


    Processes—the running programs that the kernel manages—collectively make up the
    system''s upper level,'
  merge: -1
