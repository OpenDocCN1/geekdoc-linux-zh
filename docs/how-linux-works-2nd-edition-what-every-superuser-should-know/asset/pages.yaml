  md: '# Chapter 5. How the Linux Kernel Boots


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_80_0.png)


    You now know the physical and logical structure of a Linux system, what the kernel
    is, and how to work with processes. This chapter will teach you how the kernel
    starts— or boots. In other words, you’ll learn how the kernel moves into memory
    up to the point where the first user process starts.


    A simplified view of the boot process looks like:


    +   1. The machine’s BIOS or boot firmware loads and runs a boot loader.

    2. The boot loader finds the kernel image on disk, loads it into memory, and starts
    it.

    3. The kernel initializes the devices and its drivers.

    4. The kernel mounts the root filesystem.

    5. The kernel starts a program called *init* with a process ID of 1. This point
    is the *user space start*.

    6. it sets the rest of the system processes in motion.

    7. At some point, init starts a process allowing you to log in, usually at the
    near or end of the boot.


    This chapter covers the first four stages, focusing on the kernel and boot loaders.
    Chapter 6 continues with the user space start.


    Your ability to identify each stage of the boot process will prove invaluable
    in fixing boot problems and understanding the system as a whole. However, the
    default behavior in many Linux distributions makes it difficult, if not impossible,
    identify the first few boot stages as they proceed, so you’ll probably be able
    to get a good look only after they’ve completed and you log in.


    # 5.1 Startup Messages


    Unix systems produce many diagnostic messages upon boot that tell you about the
    boot process. The messages come from the kernel and then from processes and initialization
    routines that start init. These messages aren’t pretty or consistent, and in some
    cases they aren’t even informative. Most current Linux distributions do their
    best to hide them with splash screens, filler, and boot options. In addition,
    hardware improvements have caused the kernel to start faster than before; the
    messages flash so quickly, it can be difficult to see what is happening.


    There are two ways to view the kernel’s boot and runtime messages: You can:


    +   * Look at the kernel log file. You’ll find this in `/var/log/kern.log`, but
    depending on how your system is configured, it might also be logged together with
    that of other system logs in `/var/log/messages` or elsewhere.


    +   * Use the `dmesg` command, but to pipe the output to less because there will
    be more than a screen’s width. The `dmesg` command uses the kernel buffer, which
    is of limited size, but most newest kernels have a large enough buffer to hold
    boot messages for a long time.'
