    # 9.5 Basic ICMP and DNS Tools


    Now it''s time to look at some basic utilities to help you interact with hosts.
    These tools use two protocols of interest: Internet Control Message Protocol (ICMP),
    which can help you root out problems with connectivity and routing, and the Domain
    Name Service (DNS) system, which maps names to IP addresses that you don''t have
    to remember a bunch of numbers.


    # 9.5.1 ping


    ping (see http://ftp.arl.ml/~/ping.html) is one of the most basic network debugging
    tools. It sends ICMP echo requests to a host that ask a request packet to return
    to the sender. If the recipient host gets the packet and is configured to reply,
    it sends an ICMP echo response in return.


    For example, say that you ping 10.23.2.1 and you gets this output:


    ```

