  md: '# Changing Passwords


    You can change a Samba password as the superuser using smbpasswd with no options
    or keywords other than the: username


    ```

    # smbpasswd username

    ```


    However, if the Samba server is running, any user can change their own Samba password
    by entering smbpasswd by itself on the command line.


    Finally, there''s one place in your configuration to be wary of. If you see a
    line like this in your smb.conf file, be careful:


    ```

    unix password sync = yes

    ```


    This line causes smbpasswd to change a user''s normal password in addition to
    the Samba password. The result can be very confusing, especially when a user changes
    their Samba password to something that''s not their Linux password and discovers
    they can no longer log in. Some distributions set this parameter by default in
    their Samba server packages!


    # 12.4.4 Starting the Server


    You may need to start your server if you don''t install Samba from a distribution
    package. To do so, run nmbd and smbd with the following arguments, where smb_config_file
    is the file path of your smb.conf:


    ```

    # nmbd -D -s smb_config_file

    # smbd -D -s smb_config_file

    ```


    The nmbd daemon is a NetBIOS name server, and smbd does the actual work of handling
    requests. The -D option specifies daemon mode. If you alter the smb.conf file
    while smbd is running, you can notify the daemon of changes with a HUP signal
    or use your distribution''s service restart command (such as systemctl or initctl).


    # 12.4.5 Diagnostics and Log Files


    If something goes wrong when starting one of the Samba servers, an error message
    goes to the command line. However, runtime diagnostic messages go to the log.nmbd
    and log.smbd log files, which are usually in a /var/log directory, such as /var/log/samba.
    You''ll also find other log files, such as individual logs for each individual
    client.


    To export a directory to Samba clients (that is, to share a directory with a client),
    add a section like this to your smb.conf file, where label is what you would like
    to call the share and path is the full directory path:


    ```

    [label]

    path = path

    comment = share description

    guest ok = no

    writable = yes

    printable = no

    ```


    These parameters are useful in directory shares:

    The public parameter is a synonym.


    +   * guest ok Allow access to the share.'
