    # 4.5 Inside a Traditional Filesystem


    A traditional Unix filesystem has two primary components: a pool of data blocks
    where you can store data and a database that manages the data pool. The database
    is centered around the inode data structure. An inode is a type of data that describes
    a particular file, including its type, permissions, and perhaps most importantly—where
    in the data pool the file resides. Inodes are identified by listed in an inode
    table.


    Filenames and directories are also implemented as inodes. A directory inode contains
    a list of filenames and corresponding links to other inodes.


    To provide a real-life example, I created a new filesystem, mounted it, and changed
    the directory to the mount point. Then, I added some files and directories with
    these commands (feel free to do this yourself with a flash drive):


    ```

    $ mkdir dir_1

    $ mkdir dir_2

    $ echo a > dir_1/file_1

    ```'
