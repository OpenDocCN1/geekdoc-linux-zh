    ```


    In addition to the block device file, each entry lists a SCSI generic file in
    the last column 1. For example, the generic device for the optical drive is /dev/sr0.


    Why would you want to use a SCSI generic device? The answer is due to the complexity
    of code in the kernel. As tasks get more complicated, it is better to leave them
    out of the kernel. Consider CD/DVD writing and reading. Only writing is significantly
    more difficult than reading, but no critical systems depend on the option of writing.
    A user-space program might do writing a little less efficiently than a kernel
    service, but will not threaten kernel space. To write to an optical device in
    Linux, you run a program that talks to a generic SCSI device, such as /dev/sg1.
    Due to the relative simplicity of reading to writing, you will still read from
    the device using the specialized sr optical driver in the kernel.


