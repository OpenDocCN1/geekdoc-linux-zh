    kill -9 instead of kill -KILL. This is because the kernel uses numbers to denote
    the different signals; you can use kill if you know the number of the signal that
    you want to send.


    # 2.16.3 Job Control


    Shells support job control, which is a way to send TSTP (similar to STOP) and
    CONT signals to programs using various keystrokes. For example, you can send a
    TSTP signal with CTRL-Z, then start the process again by fg (bring to foreground)
    or bg (move to background; see the next section). Despite its utility the habits
    of many experienced users, job control is not necessary and can be confusing for
    beginners: it''s common to use CTRL-Z instead of Ctrl-C, forget what they were,
    and eventually end up with many suspended processes hanging around.


    # HINT


    To see if you''ve accidentally suspended any processes on your current terminal,
    run the jobs command.


    If you want to run multiple shells, run each program in a separate terminal, put
    noninteractive processes in the background (as explained in the next section),
    or to use the screen program.


    # 2.16.4 Background Processes


    Normally, when you run a Unix command from the shell, you don''t get the prompt
    back until the program finishes executing. You can then detach a process from
    the shell and put it in "background" with the ampersand (&); this gives you the
    prompt back. For example, if you have a large file that you need to decompress
    with gunzip (you''ll see this in 2.18 Archiving and Compressing Files), and you
    want to do some other stuff while you''re running, a command like this:


    ```

    $ gunzip file.gz &

    ```


    The shell should respond by printing the PID of the new process, and the prompt
    should return immediately so that you can continue. The process will continue
    to run after you log out, which comes particularly if you have to run a program
    that has a lot of crunching for a while. (Depending on your setup, the shell might
    notify you when the process completes.)


    The dark side of running background processes is that they may expect to work
    with the standard input (or read directly). If a program tries to read from the
    standard input when it''s in the background, it can freeze (fg to bring it back)
    or terminate. If the program writes to the standard output or standard error,
    the output can appear in the terminal with no regard for anything else running,
    meaning that you can get unexpected output when you''re working on something else.


    The best way to make sure a background process doesn''t bother you is to redirect
    its output (and possibly input) as described in 2.14 Shell Input and Output.'
