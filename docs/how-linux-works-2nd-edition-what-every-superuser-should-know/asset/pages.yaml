    the UUID. (Note that the /proc entry has a stand-device name proc.)

    - The mount point.

    - The filesystem type. You may not recognize swap in this list; this is a swap
    partition (see 4.3 swap space).

    - Options. Use long options separated by commas.

    - Backup information for use by the dump command. You should always use a 0 in
    this field.'
