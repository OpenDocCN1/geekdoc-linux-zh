  md: 'Two of the most common are dracut and mkinitramfs.


    # NOTE


    The term initial RAM filesystem (initramfs) refers to the implementation that
    uses the cpio archive as the source of the temporary filesystem. There is an older
    version called the initial RAM disk, initrd, which uses a disk image as the base
    of the temporary filesystem. This has fallen into disuse because it is much easier
    to maintain a cpio archive. However, you''ll often see the term initrd used to
    refer to a cpio-based initial RAM filesystem. Often, as in the preceding example,
    the filenames and configuration files will still contain initrd.


    # 6.9 Emergency Booting and Single-User Mode


    When something goes wrong with the system, the recourse is usually to boot the
    system with a distribution’s “live” image (most distributions'' installation images
    double as live images) or with a dedicated rescue image such as SystemRescueCd
    that you can put on removable media. Common tasks for fixing a system include
    the following:


    +   - Checking filesystems after a system crash

    - Resetting a forgotten root password

    - Fixing problems in critical files, such as /etc/fstab and /etc/passwd

    - Restoring from backups after a system crash


    Another option for booting quickly to a stable state is single-user mode. The
    idea is that the system quickly boots to a root shell instead of going through
    the whole mess of services. In the System V init, single-user mode is usually
    runlevel 1, and you can also enter the mode with an -s parameter to the boot loader.
    You may need to type the root password to enter single-user mode.


    The biggest problem with single-user mode is that it doesn’t offer many amenities.
    The network almost certainly won’t be available (and if it is, you won’t have
    a GUI, and your terminal may not even work correctly. For this reason, live images
    are nearly always considered preferable.'
