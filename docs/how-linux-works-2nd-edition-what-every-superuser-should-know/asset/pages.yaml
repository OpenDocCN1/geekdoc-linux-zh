  md: '# 10.7 Network Security


    Because Linux is a very popular Unix on the PC, and especially because it is widely
    used for web servers, it attracts many unpleasant characters who try to break
    into computer systems. 9.21 Firewalls discussed afterwards, but that''s not really
    the whole story on security.


    Network security attracts extremists—those who really like to break into systems
    (whether for fun or money) and those who come up with elaborate protection schemes
    which really like to sway people trying to break into their systems. (This, too,
    can be very profitable!) Fortunately, you don''t need to keep much of your system
    safe. Here are a few rules of thumb:


    +   Run as few services as possible. Intruders can trick services that do not
    exist on your system. If you know what it is and you''re not using it, don''t
    turn it off for the sole reason that you might want to use "at some later point."


    +   Block as much with a firewall. Unix systems have a number of internal services
    that you may not know about (such as TCP port 111 for the RPC port-mapping server),
    and no other system in the world should know them. It can be very difficult to
    track and regulate the services on your system because many kinds of programs
    listen on various ports. To keep your internal services from discovering, use
    firewall rules, and install a firewall at your root.


    +   Track the services that you offer to the Internet. If you run an SSH server,
    Postfix, or similar services, keep your software up-to-date and get appropriate
    security alerts. (See 10.7.2 Security Resources for some online resources.)


    +   Use "long-term support distribution releases for servers. Security teams normally
    concentrate work on stable, supported distribution releases. Development and testing
    releases Debian Stable and Fedora receive less attention.


    +   Don''t give access on your system to anyone who doesn''t need it. It''s much
    easier to gain superuser access from a local account than it is to break in remotely.
    In fact, given the huge base of software (and the resulting bugs and design flaws)
    available on most systems, it is easy to gain superuser access to the moment you
    get a shell. Don''t assume that your friends know how to protect their passwords
    (or choose good passwords in the first place).


    +   Avoid installing dubious packages. They can contain Trojan horses.


    That''s the practical effect of protecting yourself. But why is it important to
    do so? There are three basic kinds of network attacks:


    +   Full compromise. This means gaining superuser access (full control) of a machine.
    An intruder can accomplish this by trying a service attack, such as a buffer overflow
    exploit, or by taking over a protected user account and trying to exploit a poorly
    written script.


    +   Denial-of-service (DoS) attack. This prevents a machine from carrying out
    its network services or forces a computer to malfunction in one way without the
    use of any special access. These attacks are harder to prevent, but they are easier
    to respond to.


    +   Malware. Linux users are mostly immune to malware such as worms and viruses,
    simply because their email clients aren''t stupid enough to actually run programs
    that they get in attachments. Linux malware does not exist. Avoid downloading
    and installing binary software from places that you''ve never heard of.


    # 10.7.1 Typical Vulnerabilities


    There are two important kinds of vulnerabilities to worry about: direct attacks
    and clear-text password sniffing. Direct attacks try to take over a machine without
    the most common is a buffer overflow'
