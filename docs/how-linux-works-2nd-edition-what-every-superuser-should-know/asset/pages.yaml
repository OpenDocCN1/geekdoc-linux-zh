    # 2.14 Shell Input and Output


    Now that you''re familiar with basic Unix commands, files, and directories, you''re
    ready to learn how to redirect standard input and output. Let''s start with standard
    output.


    To send the output of command to a file instead of the terminal, use the > redirection
    character:


    ```

    $ command > file

    ```


    The shell creates file if it does not already exist. If file exists, the shell
    erases (clobbers) the original file first. (Some shells have parameters that prevent
    clobbering. For example, enter set -C to avoid clobbering in bash.)


    You can append the output to the file instead of overwriting it with the >> redirection
    syntax:


    ```

    $ command >> file

    ```


    This is a way to collect output in one place when executing sequences of related
    commands.


    To send the output of a command to the standard input of another command, use
    the pipe character (|). To see how this works, try these two commands:


    ```

    $ head /proc/cpuinfo

    ```


    ```

    $ head /proc/cpuinfo | tr a-z A-Z

    ```


    You can send output through many piped commands as you wish; just add another
    pipe before each additional command.


    # 2.14.1 Standard Error


    Occasionally, you may redirect standard output but find that the program still
    prints something to the terminal. This is called standard error (stderr); it''s
    an additional output stream for diagnostics and debugging. For example, this command
    produces an:


    ```

    $ ls /ffffffffff > f

    ```


    After completion, f should be empty, but you still see the following error message
    on the terminal as standard error:


    ```

    ls: cannot access /ffffffff: No such file or directory

    ```


    You can redirect the standard error if you like. For example, to send standard
    output to f and standard error to e, use the 2> syntax, like this:


    ```

    $ ls /ffffffff > f 2>

    ```


    The number 2 specifies the stderr Stream ID 1 is standard output (the default),
    and 2 is standard error.


    You can also send the standard error to the same place as stdout with the &> notation.
    For example, to send both standard output and standard error to the file named
    f, try this command:


    ```

    $ ls /ffffffff > f 2>&1

    ```'
