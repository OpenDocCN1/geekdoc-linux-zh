    # 14.2 Understanding Input and Preference Settings


    One of the most baffling challenges of X is that there are more than one way to
    set preferences, and some methods may not work. For example, one common keyboard
    on Linux systems is to remap the Caps Lock key to a Control key. There are many
    ways to do this, from making adjustments with the old xmodmap to providing an
    new keyboard map with the setxkbmap utility. How do you know which one (if) to
    use? It''s a matter of knowing which pieces of the system has responsibility,
    determining that can be difficult. Keep in mind that a desktop environment may
    provide its settings and overrides.


    With this, here are a few pointers on the underlying infrastructure.


    # Input Devices (General)


    The server uses the X Input Extension to manage input from many different devices.
    There are two types of input device—keyboard and pointer—and you can attach as
    many as you like. In order to use more than one of the same type of device simultaneously,
    the X Input Extension creates a "virtual core" device that funnel input to the
    X server. The core device is called the master; the physical devices that you
    plug in the machine become slave.


    To see the device configuration on your machine, try running the xinput --list


    ```

    $ xinput --list

    Virtual core pointer id=2 [master pointer (3)]

    Virtual core XTEST pointer id=4 [slave pointer (2)]

    Logitech Unifying Device id=8 [slave pointer (2)]

    Virtual core keyboard id=3 [master keyboard (2)]

    ```'
