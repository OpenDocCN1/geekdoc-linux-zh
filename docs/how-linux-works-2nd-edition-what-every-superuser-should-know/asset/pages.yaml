  md: 'This, system of inodes pointing to directory data structures and directory
    data structures pointing to inodes, allows you to go with the filesystem you''re
    used to. In addition, that directory contain entries for . (the current directory)
    and .. (the parent directory, except for the root directory). This makes it easy
    to go to a point of reference and navigate back the directory structure.


    # 4.5.1 Viewing Inode Details


    To view the inode numbers for any directory, use the `ls -i` command. Here''s
    what you''d get at the root of this example. (For more detailed information, use
    the `stat` command.)


    ```

    $ ls -i

    12 dir_1 7633 dir_2

    ```


    Now you''re probably wondering about the link count. You''ve already seen the
    link count in the output of the common `ls -i` command, but you ignored it. How
    the link count relate to files in Figure 4-5, particular the "hard-linked" `file_5`.
    The link count field is the number of total directory entries (all directories)
    pointing to an inode. Most files have a link count of 1 because they only occur
    in one directory entries. This is expected: Most of the time when you create a
    file, you create a new directory and an entry to go with it. However, inode occurs
    twice: First it''s created as `dir_1/file_3`, and then it''s linked to `dir_2/file_5`.
    A hard link is manually created in an entry to an inode that already exists. The
    `ln` command (without the -s option) allows you to manually create new links.


    This is why removing a file is called unlinking. If you run `rm dir_1/file_2`,
    the kernel searches for an entry named `file_2` in inode 12''s directory. Upon
    finding that file_2 corresponds to inode 14, the kernel removes the entry and
    decrements 1 from inode 14''s count. As inode 14''s count will be 0, the kernel
    will know that there are no longer any names linking to it. Therefore, it can
    delete the inode and any data associated with it.


    If you run `rm dir_1/file_3`, the result is that the link count of inode 15 goes
    from 2 to 1 (because `dir_2/file_5` still points, and the kernel knows not to
    delete)


    Link counts work the same for directories. Observe that inode 12''s link count
    is 2, because there are two links: one for `dir_1` in the directory entries and
    second for the self-reference (..) in its own directory. If you create a new directory
    `dir_1/dir_3`, the link count for inode 12 would go to 3 because the new directory
    would include a parent (..) entry that links back to inode 12, as inode 12''s
    parent link points to inode 2.


    There is one small exception. The root inode 2 has a link count of 4. Figure 4-5
    shows three directory entry links. The "fourth" link is in the filesystem''s superblock
    because the superblock tells you to find the root inode.


    Don''t be afraid to experiment on your system. Creating a directory structure
    and using `ls -i` or `stat` to walk through the files is harmless. You don''t
    need to be root (unless you mount and create a new filesystem).


    But there''s one piece missing: When allocating data pools for a new file, how
    does the filesystem know which blocks are in use and which are available? One
    of the most basic ways is with an management data structure called a bitmap. In
    this scheme, the filesystem reserves sets of bytes, with each corresponding to
    one block in the data pool. A value of 0 means the block is free, and 1 means
    it''s in use. Thus, allocating and deallocating blocks is a matter of flipping
    bits.


    Problems arise when the inode table doesn''t match the allocation data or when
    the link counts are incorrect; this can happen when you don''t shut down a system.
    Therefore, when you check a filesystem, as is described in 4.2.11 Checking and
    Repairing Filesystems, the `ck` program walks through the inode table and directory
    structure to generate new link counts and a new block allocation map


    www.it-ebooks.info'
