    #  2.17.2 Symbolic Links


    A symbolic link is a file that points to another file or a directory, effectively
    creating an alias (like a shortcut

    in Windows). Symbolic links offer quick access to obscure directory paths.


    In a long directory, symbolic links look like this (the l as the file type in
    the file mode):

    lrwxrwxrwx 1 ruser users 11 Feb 27 13:52 somidir -> /home/origdir


    If you try to access somidir in this directory, the system gives you /home/orig
    instead. Symbolic links are

    simple names that point to other names. The names and the paths to which they
    point do not have to mean

    anything. For example, /home/origdir doesn''t even exist


    In fact, if /home/origdir does not exist, any program that accesses somidir reports
    that somidir doesn''t exist

    (except for ls somidir, a command that stupidly informs you that somidir is somidir).
    This can be baffling

    because you see something right in front of your eyes.


    This is not the only way symbolic links can be confusing. Another problem is that
    you can''t identify the

    characteristics of a link target by looking at the name of the link; you must
    follow the link to see if it goes

    to a file or directory. Your system may have links that point to other links,
    which are called chained

    symymbolic links.


    #  2.17.3 Creating Symbolic Links


    To create a symbolic link from target to linkname, use ln -s:


    ```

    $ ln -s target linkname

    ```


    The linkname is the name of the symbolic link, the target is the argument of the
    file or

    directory that the link points to, and the -s flag signifies a symbolic link (see
    the warning follows).


    When making a symbolic link, the command twice you run it can become several things
    if it goes

    wrong. If you reverse the order of the arguments (ln -s linkname target), you''re
    in for

    sun if linkname is a directory that already exists. If this is the case (and it
    quite often), ln creates a

    named target inside link, and the link will point to itself unless linkname is
    a full path. If

    goes when you create a symbolic link to a directory, check that directory for
    erratic links and

    remove them.


    Symbolic links can also cause headaches when you don''t know they exist. For example,
    you can easily

    edit what you think is a file but actually a symbolic link to the original.


    # WARNING


    Don''t forget the -s option when creating a symbolic link. Without it, ln creates
    a hard link, giving

    an additional real filename to a single file. The new filename has the status
    of the one; it points

    (links) directly to the file data instead of another filename as a symbolic link
    does. Hard links can

    be even more confusing than symbolic links. Unless you understand the material
