    # ## 8.9.1 How Memory Works


    Recall Chapter 1 that the CPU has a memory management unit (MMU) that translates
    virtual memory addresses used by processes into real ones. The kernel assists
    the MMU by breaking the memory used by processes into smaller chunks pages. The
    kernel maintains a data structure, called a page table, that contains a mapping
    of a processes'' virtual page addresses to page addresses in memory. As a process
    accesses memory, the MMU translates the virtual addresses used into real addresses
    based on the kernel''s page table.


    A user does not actually need all pages to be immediately available to run. The
    kernel generally loads and allocates pages as a process needs; this system is
    known as on-demand paging or just paging. To see how a program starts and runs
    a new process:


    +   1. The kernel loads the beginning of the program’s instruction code into memory
    pages.

    2. The kernel may allocate some working-memory pages to the new process.

    3. As the process runs, it might reach a point where the next instruction in its
    code isn’t in any of the pages memory. At this point, the kernel takes over, loads
    the pages into memory, and then lets the process resume execution.

    4. Similarly, if the program requires more working memory than was initially allocated,
    the kernel handles it by finding free pages (or making them) and assigning them
    to the process.


    # ## 8.9.2 Page Faults


    If memory is not ready when a process wants to use it, the process triggers a
    page fault. In the event of a page fault, the kernel takes control of the CPU
    in the process in order to get the page ready. There are two kinds of page faults:
    minor and major.


    # ## Minor Page Faults


    A minor page fault occurs when the desired page is actually in main memory but
    the MMU doesn’t know where it is. This can happen when the process requests memory
    or when the MMU doesn’t have enough space to store all of the page locations.
    In this case, the kernel tells the MMU about the page and permits the process
    to continue. Minor page faults aren’t such a big deal, and occur as a process
    runs. Unless you need maximum performance from some memory-intensive program,
    you probably shouldn’t worry about them.


    # ## Major Page Faults


    A major page fault occurs when the desired page isn’t in main memory at all, which
    means that the kernel must load it from the disk or some other storage mechanism.
    A lot of page faults will blow the system because the kernel must do a substantial
    amount of work to provide the pages, robbing normal processes of their chance
    to run.


    Some page faults are unavoidable, such as those that occur when you load the code
    from disk when running a program for the first time. The biggest problems happen
    when you start running out of memory and the kernel starts to swap pages memory
    out to the disk to make room for new pages.


