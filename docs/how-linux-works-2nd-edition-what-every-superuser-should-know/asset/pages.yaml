    # 8.6 Measuring CPU Time


    To monitor one or more processes over time, use the -p option to top, with this
    syntax:


    ```

    $ top -p pid1 [-p pid2 ...]

    ```


    To find out how much CPU time a command uses during its lifetime, use time. Most
    shells have a built-in command that doesn''t provide extensive statistics, you''ll
    probably need to run /usr/bin/time. For example, use the CPU time used by ls,


    ```

    $ /usr/bin/time ls

    ```


    After ls terminates, total should print out like this. The key fields are in boldface:


    ```

    0.05user      0.09system      0:00.44elapsed  31%CPU (0avgtext+0avgdata

    maxres=k

    inputs+outputs (125major+51minor)pagefaults 0swaps

    ```


    +   **User time.** The number of seconds that the CPU has spent running the program''s
    code. In modern processors, some run so quickly, and therefore the CPU time is
    so low, that time down to zero.


    +   **System time.** How much the kernel spends doing the process''s work (for
    example, reading files and directories).


    +   **Elapsed time.** The total time it took to run the process from start to
    finish, including the time that the CPU spent doing other tasks. By subtracting
    the user and system time from elapsed can give you a general idea of how long
    a process spends waiting for system resources.


    The remainder of the output primarily details memory and I/O usage. You''ll learn
    more about the page fault output in **8.9 Memory.**


