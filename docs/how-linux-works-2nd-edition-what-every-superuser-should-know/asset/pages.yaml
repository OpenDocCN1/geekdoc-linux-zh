    # 16.4 Installation Practice


    Knowing how to build and install software is good, knowing when and where to install
    your own packages is even more useful. Linux distributions try to carry as much
    as possible at installation, and you should always check whether it would be best
    to install a package yourself instead. Here are the advantages of installing your
    own:


    +   - You can customize package defaults.


    +   - When installing a package, you get a clearer picture of how to use the package.


    +   - You control the release that you run.


    +   - It''s easier to back up a custom package.


    +   - It''s easier to distribute self-installed packages across a network (as
    long as the architecture is consistent and the installation location is relatively
    isolated).


    Here are the disadvantages:


    +   - It takes times.


    +   - Custom packages do not automatically upgrade themselves. Distributions keep
    most packages up-to-date without requiring much work. This is a particular concern
    for packages that interact with the network, because you want to ensure you always
    have the latest security updates.


    +   - If you don''t actually use the package, you''re wasting your time.


    +   - There is a potential for misconfiguring packages.


