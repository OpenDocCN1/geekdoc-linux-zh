    # Removing Units


    To remove a unit, follow these steps:


    +   1. Deactivate the unit if necessary:


    ```

    # systemctl stop unit

    ```


    +   2. If the unit has an [Install] section, disable the unit to remove any dependent
    symbolic links:


    ```

    # systemctl disable unit

    ```


    +   3. Remove the unit file, if you like.


    # 6.4.6 systemd Process Tracking and Synchronization


    systemd wants a reasonable amount of information and control over every process
    that it starts. The main problem that it is a service that can start in different
    ways; it may fork new instances of itself or daemonize and detach itself from
    the original process.


    To minimize the work a developer or administrator needs to do in order to create
    a working unit use control groups (cgroups), an optional Linux kernel feature
    that allows finer tracking of a process hierarchy. If you''ve worked with Upstart,
    you know that you have to do a little extra work to figure out which main process
    is for a service. In systemd, you don''t have to worry about how many times a
    process forks—whether it works. Use the Type option in your unit file to indicate
    its status behavior. Here are two basic types:


    +   **Type=simple** The service doesn''t fork.


    +   **Type=forking** The service forks, and systemd expects the original service
    process to terminate. Upon termination, systemd assumes that the service is ready

    The **Type=simple** option doesn''t account for the fact that a service may require
    some time to set up, and systemd doesn''t know when to start any dependencies
    that require a service to be ready. One way to deal with this is using delayed
    start (6.4.7 systemd On-Demand and Resource-Parallelized Startup). However, some
    Type status lines can indicate that the service itself will notify systemd when
    it is ready:


    +   **Type=notify** The service sends a notification to systemd (with the sd_notify()
    function) when it''s ready.


    +   **Type=bus** The service registers itself on the D-bus (Desktop Bus) when
    it''s ready.

    Another service startup style is specified with Type=oneshot; here the process
    actually terminates completely when it''s finished. With such a service, you will
    almost certainly need to add a RemainExit=yes so that systemd will still serve
    the service even after its processes terminate.


    Finally, there''s one last: Type=idle. This simply instructs systemd not to start
    the service until there are no active jobs. This idea is to keep the system load
    down, or to keep services running from one another''s output. (Remember, once
    a service has started, the systemd that started the service terminates.)


    # 6.4.7 systemd On-Demand and Resource-Parallelized Startup


    One of systemd''s most significant features is its ability to delay a unit startup
    until it is absolutely needed.'
