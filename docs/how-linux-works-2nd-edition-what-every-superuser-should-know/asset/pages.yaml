    # 2.17 File Modes and Permissions


    Every Unix file has a set of permissions that determine whether you can read,
    write, or run the file. ls -1 displays the permissions. Here''s an example of
    a display:


    ```

    -rw-r--r-- user somegroup  7041 Mar 26 19:34 endnotes.html

    ```


    The file''s mode represents the file''s permissions and some extra information.
    There are four parts to the mode, as illustrated in Figure 2-1.


    The first character of the mode is the file type. A dash (--) in this position,
    in the example, denotes a regular file, meaning that there''s nothing special
    about the file. This is by the most common kind of file. Directories are also
    common and are indicated by a d in the file type. (3.1 Device Files lists the
    remaining file types.)


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_32_0.png)


    Figure 2-1. The pieces of a file mode


    The rest of a file''s mode contains the permissions, which break down into three
    sets: user, group, and other, in that order. For example, the rw-- characters
    in the example are the user permissions, the r-- characters that follow are the
    group permissions, and the final r-- are the other permissions.


    Each permission can contain four basic representations:


    | r | Means that the file is readable |

    | w | Means that the file is writable |

    | x | Means that the file is executable (you can run it as a program) |

    | - | Means nothing. |


    The user permissions (the first set) pertain to the user who owns the file. In
    the preceding example, that''s user. The second set, group permissions, are for
    the file''s group (somegroup in the example). Any user in that group can take
    advantage of these permissions. (Use the groups command to see what group you''re
    in, and see 7.3. Working with Groups for more information.)


    Everyone on the system has access to the third set, the other permissions, which
    are sometimes called world permissions.


    # NOTE


    Each read, write, and execute file slot is sometimes called a permission bit.
    Therefore, you may hear people refer to them as permissions as "the read bits."


    Some executable files have an s in their permissions instead of an x. This indicates
    that the'
