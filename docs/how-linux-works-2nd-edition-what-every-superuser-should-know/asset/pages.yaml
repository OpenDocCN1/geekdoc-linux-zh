    Because this is a service target, you''ll find the details about the service in
    the [Service] section, including how to prepare, start, and reload the service.
    You''ll find a complete list listing in the systemd.service(5) manual page (in
    systemd.exec(5)), as well as in the discussion of process tracking in 6.4. systemd
    Process Tracking and Synchronization.


    # Enabling Units and the [Install] Section


    The [Install] section in the sshd.service unit file is important because it helps
    us to understand how to use system''s WantedBy and RequiredBy dependency options.
    It''s a mechanism for enabling units without modifying any configuration files.
    During normal operation, systemd ignores the [Install] section. However, consider
    the case when sshd.service is disabled on yours and you would like to turn it
    on. When enable a unit, systemd creates the [Install] section; in this case, enabling
    sshd.service unit creates system to the WantedBy dependency for multi-target.
    In response, systemd creates a symbolic link in the system configuration directory
    follows:


    ```

    ln -s /usr/lib/systemd/system/sshd.service

    /etc/systemd/system/multi-user.target.wants/sshd.service

    ```


    Notice that the symbolic link is placed into a subdirectory corresponding to the
    dependent unit (multi-user in this case).


    The [Install] section is usually responsible for the /etc/systemd/system. However,
    there are also .wants and .requires directories in the system configuration directory
    (/usr/lib/systemd/system), and you© add links that do not correspond to [Install]
    sections in the unit files. These manual additions are a simple way to add a dependency
    without modifying a unit file that may be overwritten (by a software upgrade,
    instance).


    # NOTE


    Enabling a unit is different from activating a unit. When you enable a unit, you
    are installing it into system''s configuration, making permanent changes that
    will require a reboot. But you need to explicitly enable a unit. If the unit file
    has [Install] section, you must enable it with systemctl enable; otherwise, the
    existence of the file is enough to enable it. When you activate a unit with systemctl
    start, you''re just turning it on in the current runtime environment. In addition,
    enabling a unit does not activate it.'
