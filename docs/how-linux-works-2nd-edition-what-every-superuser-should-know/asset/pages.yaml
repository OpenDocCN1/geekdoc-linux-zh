  md: 'Now lets look at the mechanics of how boot loaders start the kernel.


    #  5.4 Boot Loaders


    At the start of the boot process, before the kernel and init start, a boot loader
    starts the kernel. The task of a boot loader sounds simple: It loads the kernel
    into memory, and then starts the kernel with a set of kernel parameters. Consider
    the questions that the boot loader must answer:


    +   - Where is the kernel?


    +   - What kernel parameters should be passed to the kernel when it starts?


    The answers are (typically) that the kernel and its parameters are usually somewhere
    on the root filesystem. It sounds like the kernel parameters should be easy to
    find, except that the kernel is not yet running, so it might traverse a filesystem
    to find the necessary files. Worse, the kernel drivers normally used to access
    the disks are also unavailable. Think of this as a "chicken or egg" problem.


    Let''s start with the driver. On PCs, boot loaders use the Basic Input/Output
    System (BIOS) or Unified Extensible Firmware Interface (UEFI) to access disks.
    Nearly all disk has hardware that allows the BIOS to access attached storage with
    Linear Block Addressing (LBA). Although it poor performance, this mode of access
    allows universal access to disks. Boot loaders are often the only programs to
    use the BIOS for disk; the kernel uses its own high-performance drivers.


    The filesystem is tricky. Most modern boot loaders can read partition tables and
    have built-in support for read-only access to filesystems. Thus, they can find
    and read files. This capability makes it far easier to dynamically configure and
    enhance the boot loader. Linux boot loaders have not always had this capability;
    without it, configuring the boot loader was much difficult.


    #  5.4.1 Boot Loader Tasks


    A Linux boot loader''s core functionality includes the ability to do the following:


    +   - Select among multiple kernels.


    +   - Switch between sets of kernel parameters.


    +   - Allow the user to manually override and edit kernel image names and parameters
    (for example, to enter single-mode user).


    +   - Provide support for booting other operating systems.


    Boot loaders have become considerably more advanced since the inception of the
    Linux kernel, with features such as history and menus, but the basic need has
    always been flexibility in kernel image and parameter selection. One important
    phenomenon is that certain needs have diminished. For example, because you can
    now perform an emergency or reboot partially or entirely from a USB storage device,
    you probably won''t have to worry about manually entering kernel parameters or
    going into single-mode user. But modern boot loaders offer more power than ever,
    which can be particularly handy if you''re building custom kernels or just want
    to tweak parameters.


    #  5.4.2 Boot Loader Diversity


    Here are the main boot loaders that you may encounter, in order of popularity:


    +   - GRUB. A near-universal standard on Linux systems


    +   - LILO. One of the first Linux boot loaders. ELILO is a UEFI loader


    +   - SYLINUX. Can be configured to run from many different kinds of filesystems'
