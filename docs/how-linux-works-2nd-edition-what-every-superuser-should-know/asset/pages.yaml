    Even though C code is usually fairly portable, differences on each platform make
    it impossible to compile with a single Makefile. Early solutions to this problem
    were to provide individual Makefiles for every operating system or to provide
    a Makefile that was easy to modify. This approach evolved into scripts that generate
    Makefiles based on an analysis of the system used to build the package.


    GNU autoconf is a popular system for automatic Makefile generation. Packages using
    this system with files named configure, Makefile.in, and config.h. The .in files
    are templates; the idea is to run the configure script in order to discover the
    characteristics of your system, make substitutions in the .in files to create
    the real files. For the end user, it''s easy; to generate a Makefile from Makefile.in,
    run configure:


    ```

    $ ./configure

    ```


