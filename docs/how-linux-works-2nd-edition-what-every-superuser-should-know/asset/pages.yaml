    # 10.6 Remote Procedure Call (RPC)


    What about the rpcbind service that you saw in the scan in the preceding section?
    RPC stands for remote procedure call, a system residing in the lower parts of
    the application. It''s designed to make it easier for programmers to access network
    applications by leveraging the fact that program calls can function on remote
    programs (identified by program numbers) and the remote programs return a result
    code or message.


    RPC implementations use transport protocols such as TCP and UDP, and they require
    a special service to map program numbers to TCP and UDP ports. The server is called
    rpcbind, and it must be running on any machine that uses RPC services.


    To see rpc services for your computer, run


    ```

    $ rpcinfo -p localhost

    ```


    RPC is one of those protocols that doesn''t want to die. The Network File System
    (NFS) and Network Information Service (NIS) systems use RPC, but they are completely
    unnecessary on standalone machines. Whenever you think you''ve eliminated all
    needed for rpcbind, something else comes up, such as Access Monitor (FAM) support
    in GNOME.'
