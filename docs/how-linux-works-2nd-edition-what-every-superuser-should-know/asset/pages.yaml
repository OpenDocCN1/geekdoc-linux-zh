    V levels and noticed it has the ability to run System V scripts as a job. Here
    a more detailed overview of how it works on Ubuntu systems:


    +   1. The `rc-sysinit` job runs, usually after getting the filesystem and static-network-up
    events. Before it, there is no runlevel.


    +   2. The `rc-sysinit` job determines which runlevel to enter. Usually, the run-level
    is the default, but it can also parse an order `/etc/initab` file or take the
    runlevel from a kernel parameter (in `/proc/cmdline`).'
