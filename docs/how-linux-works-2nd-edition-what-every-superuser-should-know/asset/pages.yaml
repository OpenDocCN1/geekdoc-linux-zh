    # 11.8 Temporary File Management


    It''s necessary to create a temporary file to collect output for use by a later
    command. When making such a file, make sure that the filename is distinct enough
    that no other programs will accidentally write to it.

    Here''s how to use the mktemp command to create temporary filenames. This script
    shows you the device interrupts that have occurred in the last two seconds:


    ```

    #!/bin/sh

    TMPFILE1=$(mktemp /tmp/im1.XXXXXX)

    TMPFILE2=$(mktemp /tmp/im2.XXXXXX)

    ```


    ```

    cat /proc/interrupts > $TMPFILE1

    sleep 2

    cat /proc/interrupts > $TMPFILE2

    diff $TMPFILE1 $TMPFILE2

    rm -f $TMPFILE1 $TMPFILE2

    ```


    The argument to mktemp is a template. The mktemp command converts the XXXXX to
    a unique set of characters and creates an empty file with that name. Notice that
    this uses variable names to store the filenames so you only have to change one
    if you want to change a filename.


    # NOTE


    Not all Unix flavor come with mktemp. If you''re having portability problems,
    it''s best to install the GNU coreutils package for your operating system.


    Another problem with scripting temporary files is if the script is aborted, the
    temporary files could be left behind. In the preceding example, pressing CTRL-C
    the second cat command leaves a temporary file in /tmp. Avoid this possible. Instead,
    use the trap command to create a signal handler to catch the signal that CTRL-C
    generates and remove the temporary files, as in this handler:


    ```

    #!/bin/sh

    TMPFILE1=$(mktemp /tmp/im1.XXXXXX)

    TMPFILE2=$(mktemp /tmp/im2.XXXXXX)

    trap "rm -f $TMPFILE1 $TMPFILE2; exit 1" INT

    --snip-

    ```


    You may exit in the handler to explicitly end script execution, or the shell will
    continue running as you'
