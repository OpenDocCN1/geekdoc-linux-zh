    # 21.8.4 zcat


    The method shown above isn''t the fastest or most efficient way to use tar on
    a compressed archive, and

    it wastes space and kernel I/O time. A better way is to combine archive and compression
    functions with

    p pipeline. For example, this command unpacks <file>.tar.gz:


    ```

    $ zcat file.tar.gz | tar xvf -

    ```


    The zcat command is the same as gzip -dc. The -d option decompresses and the -c
    option sends the

    result to standard output (in this case, to the tar command).


    Because it''s so to use zcat, the version of tar that comes with Linux has a shortcut.
    You can

    z as an option to automatically invoke gzip on the archive; this works both for
    extracting an archive (with

    t x or modes in tar) and creating one (with c). For example, use the following
    to verify a compressed

    archive:


    ```

    $ tar zvf file.tar.gz

    ```


    However, you should try to master the longer form before taking the shortcut.


    > NOTE


    A .tgz file is the same as a .tar.gz file. The suffix is meant to fit into FAT
    (MS-DOS-based)

    filesystems.


    # 21.8.5 Other Compression Utilities


    Another compression program in Unix is bzip2, whose files end with .bz2. While
    marginally

    slower than gzip, bzip2 opens texts a little more, and it is therefore increasingly
    popular in

    the distribution of source code. The decompression program to use bzip2, and the
    options of both

    components are close to those of gzip that you don''t need to learn anything.
    The bzip2

    compression/decompression option for tar is j.


    Another new compression program xz is also gaining popularity. The corresponding
    decompression program

    is unxz, and the arguments are similar to those of gzip.'
