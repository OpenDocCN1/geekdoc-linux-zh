  md: '# 2.2 Using the Shell


    When you install Linux, you should create at least one regular user in addition
    to the root user; this will be your personal account. For this chapter, you should
    log in as the regular user.


    # 2.2.1 The Shell Window


    After logging in, open a shell (often referred to as a terminal). The easiest
    way to do so a GUI like Gnome or Ubuntu''s Unity is to open a terminal application,
    which starts a shell inside a new window. Once you''ve opened a shell, it should
    display a prompt at the top that usually ends with a dollar sign ($). On Ubuntu,
    that prompt should look name@host:$, and on Fedora, it''s [name@host]$$.If you''re
    familiar with Windows, the shell window will look something like a DOS command
    prompt; the Terminal application in OS X is essentially the same as a Linux shell.


    This book contains many commands that you will type at a shell prompt. They all
    begin with a single $ to denote the shell prompt. For example, type this command
    (just the part in bold, not the $) and press ENTER:


    ```

    $ echo Hello there.

    ```


    # NOTE


    Many shell commands in this book start with #. You should run these as the superuser
    (root). These commands require extra caution.


    Now enter this command:


    ```

    $ cat /etc/passwd

    ```


    This command displays the contents of the /etc/passwd system information file
    and returns your shell prompt. Don''t worry about what this file does right now;
    you''ll learn all about it later, in Chapter 7.


    # 2.2.2 cat


    The cat command is one of the easiest Unix commands to understand; it simply outputs
    the contents of one or more files. The general syntax of the cat command is as
    follows:


    ```

    $ cat file1 file2 ...

    ```


    When you run this command, cat prints the contents of file1, file2, and any other
    files that you specify (denoted by ..), and then exits. The command is called
    cat because it performs concatenation when it prints the contents of more than
    one file.


    # 2.2.3 Standard Input and Standard Output


    We''ll use cat to explore Unix input and output (I/O). Unix processes use I/O
    streams to read and write data. Processes read data from input streams and write
    to output streams. These streams are very flexible. For example, the source of
    an input stream can be a file, a device, a terminal, or even the output stream
    from another process.


    To see an input stream work, enter cat (with no filenames) and press ENTER. This,
    you won''t get your shell prompt back because cat is still running. Now typing
    and press ENTER at the end of each line. The cat command repeats any line you
    type. Once you''re sufficiently bored, press CTRL-D on an empty line to terminate
    cat and return to the shell.


    The reason cat adopted an interactive behavior is to do so without a filename,
    cat read from the standard input stream provided by the Linux kernel rather than
    a stream connected to a file. In this case, the standard input was connected to
    the terminal in which you ran cat.'
