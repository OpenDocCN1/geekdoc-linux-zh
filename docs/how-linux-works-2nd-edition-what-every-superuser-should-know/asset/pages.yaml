  md: '# 11.11 Subshells


    You may need to alter the environment in a shell slightly but don''t want a permanent
    change. You can change and restore a part of the environment (such as the path
    or working directory) using shell variables, but that''s a clumsy way to go about
    things. The easy way around these kinds of problems is to use a subshell, an entirely
    new shell process that you can create to run a command or two. The new shell has
    the original shell''s environment, and when the new shell exits, any changes you
    made to its environment disappear, leaving the initial shell to run as normal.


    To use a subshell, the commands must be executed by the subshell in parentheses.
    For example, the following line executes the command `uglyprogram` in `uglydir`
    and leaves the original shell intact:


    ```

    $ (cd uglydir; uglyprogram)

    ```


    This example shows how to add a configuration to the path that might cause problems
    as a permanent change:


    ```

    $ PATH=/usr/confusing:$PATH; uglyprogram

    ```


    Using a subshell to make a single-use alteration to an environment variable is
    such common task that there is no built-in syntax that avoids this subshell:


    ```

    $ PATH=/usr/confusing:$PATH uglyprogram

    ```


    Pipes and commands process well with shells, too. The following example uses `tar`
    to archive the entire directory within `orig` and then unpacks the archive into
    the new target directory, which duplicates the files and folders in `orig` (this
    is useful if it preserves ownership and permissions, and it''s generally faster
    than using a command as `cp -r`):


    ```

    $ tar cf - orig | (cd target; tar xvf -)

    ```


    > WARNING


    Double-check this sort of command before you run it to make sure that the target
    directory exists and is completely separate from the orig directory.


    # 11.12 Including Other Files in Scripts


    If you need to include another file in your shell script, use the dot (.) operator.
    For example, this runs the commands in the file `config.sh`:


    +   . config.sh


    This "file include" does not start a subshell, and it can be useful for a group
    of scripts that need to use a single configuration file.


    # 11.13 Reading User Input


    The `read` command reads a line of text from the standard input and stores the
    text in a variable. For example, the following command stores the input in `$var`:


    ```

    $ read var

    ```


    This is a built-in shell command that can be useful in conjunction with other
    shell features not mentioned in this book.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 11.14 When (Not) to Use Shell Scripts


    The shell is so feature-rich that it''s difficult to condense its important elements
    into a single chapter. If you''re interested in what else the shell can do, have
    a look at some of the books on shell programming, as Unix Shell Programming, 3rd
    edition, by Stephen G. Kochan and Patrick Wood (SAMS Publishing, 2003), or the
    shell script discussion in The UNIX Programming Environment by Bran W. Kenningan
    and Rob Pike (Prentice Hall, 1984).


    However, at a certain point (especially when you start using the read built-in),
    you have to ask yourself if you''re still using the right tool for the job. Remember
    what shell scripts do best: manipulate simple files and commands. As stated earlier,
    if you find yourself writing something that looks convoluted, especially if it
    involves complicated string or arithmetic operations, you should probably look
    to a scripting language like Python, Perl, or awk.'
