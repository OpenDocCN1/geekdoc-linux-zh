  md: '# 11.3.6 Exit Code: $?


    The $ variable holds the exit code of the last command that the shell executed.
    Exit codes, which are critical to mastering shell scripts, are discussed next.


    # 11.4 Exit Codes


    When a Unix program finishes, it leaves an exit code for the parent process that
    started the program. The exit code is a number and is sometimes called an error
    code or exit value. When the exit code is zero (0), it typically means that the
    program runs without a problem. If the program has an error, it usually exits
    with a number other than 0 (but not all, as you will see).


    The shell holds the exit code of the last command in the $? special variable,
    so you can check it out at your prompt:


    ```

    $ ls / /dev/null

    $ echo $?

    0

    $ ls /asdasdf > /dev/null

    ls: /asdasdf: No such file or directory

    $ echo $?

    1

    ```


    You can see that the successful command returned 0 and the unsuccessful asdasdf
    command returned 1 (assuming, of course, that you have a directory named /asdasdf
    on your system).


    If you intend to use the exit code of a command, you must use or store the code
    immediately after running the command. For example, if you run echo $ twice in
    a row, the output of the second command is always 0 because the first echo command
    completes successfully.


    When writing shell code that aborts abnormally, use something like exit 1 to pass
    an exit code of 1 back to whatever process ran the script. (You may want to use
    different numbers for different conditions.)


    One thing to think about is that programs use diff and grep return 0 if it finds
    something matching a pattern and 1 if it doesn''t.or if it doesn''t. For these
    programs, an exit code of 1 is not an error; grep and diff use the exit code 2
    for real problems. If you think a program is using a nonzero code to indicate
    success, read its manual page. The exit codes are usually explained in the EXIT
    VALUE or DIAGNOSTICS section.


    # 11.5 Conditionals


    The Bourne shell has specials for conditionals, such as if/then/else and case
    statements. For example, this simple script with an conditional checks to see
    whether the script''s first argument is hi:


    ```

    #!/bin/sh

    if [ $1 = hi ]; then

    echo ''The first argument was "hi"

    nelse

    ```'
