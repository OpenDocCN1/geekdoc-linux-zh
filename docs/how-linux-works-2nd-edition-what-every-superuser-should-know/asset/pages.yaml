  md: '# 2.18 Archiving and Compressing Files


    Now you''ve learned about files, permissions, and possible errors, you need to
    master gzip and tar.


    # 2.18.1 gzip


    The program gzip (GNU Zip) is one of the current standard Unix compression programs.
    A file that ends with .gz is a GNU archive. Use gzip file.gz to uncompress <file>.gz
    and remove the suffix: to compress it, use gzip file.


    # 2.18.2 tar


    Unlike the programs for other operating systems, gzip does not create archives
    of files; that is, it doesn''t pack multiple files and directories into one. To
    create an archive, use tar command:


    ```

    $ tar cvf archive.tar file1 file2 ...

    ```


    Archives created by tar usually have a suffix (this is by convention; it''s not
    required). For example, in the command above, file1, file2, and so are the names
    of files and directories that you wish to archive <archive>.tar. The c flag activates
    create mode. The r and f flags have more specific roles.


    The v flag activates diagnostic output, causing tar to print the names of files
    and directories in the archive when they encounter them. Adding another v causes
    tar to print details such as file size and permissions. If you don''t want tar
    to tell you what it''s doing, omit the v flag.


    The f flag denotes the file name. The next argument on the command line after
    the f flag must be the file for tar to create (in the preceding example, <archive>.tar).
    You must use this option followed by a filename at all times, except when tar
    to use standard output, or enter a dash - instead of the filename.


    # Unpacking tar files


    To unpack a tar file with tar use the x flag:


    ```

    $ tar xvf archive.tar

    ```


    In this command, the x flag puts tar into extract (unpack) mode. You can extract
    individual parts of the archive by entering the names of the parts at the end
    of the command line, you must know their exact names. (To find out for sure, see
    the table-of-contents described shortly.)


    > NOTE


    When extracting its contents, remember that tar does not remove the archived tar
    file after extracting its contents.


    # Table-of-Contents Mode


    Before unpacking, it''s a good idea to check the contents of a .tar file with
    the table-of-contents mode using the t flag instead of the x flag. This verifies
    the archive''s basic integrity and prints the names of all files. If you don''t
    test an archive before unpacking, you might end up dragging a mess of files into
    the current directory, which can be really difficult to clean up.


    When you check an archive with the t mode, verify that everything is in a rational
    directory structure; that is, all paths in the archive should start with the same
    directory. If you''re unsure, create a temporary directory, change to it, and
    then extract. (You can always use * ... if you didn''t create a mess.)


    When unpacking, consider the p option to preserve permissions. Use this in extract
    mode to override your umask and get the exact permissions specified in the archive.
    The p option is default when working as the superuser. If you''re having trouble
    with permissions and ownership when unpacking an archive as the'
