    # 4.2.1 Checking and Repairing Filesystems


    The optimizations that Unix systems offer are made possible by a sophisticated
    database mechanism. For filesystems to work seamlessly, the kernel has trust that
    there are no errors in a mounted filesystem. If errors exist, data and system
    crashes create mayhem.


    Filesystem errors are usually due to a user shutting down the system in a rude
    way (for example, pulling the power cord). In such cases, the filesystem cache
    in memory may not match the data on the disk, and the system may be in the process
    of aligning the filesystem when you have to give the computer a kick. Although
    a new generation of filesystems uses journals to make filesystem corruption far
    less common, you should always shut the system down properly. Regardless of the
    filesystem in use, filesystem checks are still necessary every now and to maintain.


    The tool to check a filesystem is fsck. As the mkfs program, there is a different
    version of fsck for every filesystem type Linux supports. When you run fsck on
    an Extended filesystem (ext2/ext3/ext4), fsck recognizes the filesystem type and
    starts the e2fsck utility. Generally, you don''t need to use e2fsck, unless fsck
    can''t figure out the filesystem type or you''re looking for the e2fsck manual.


    The information presented in this section is specific to the Extended filesystem
    series and e2fsck.


    To run fsck in interactive mode, give the device or the mount point (as listed
    in /etc/fstab) as the argument. For example:


