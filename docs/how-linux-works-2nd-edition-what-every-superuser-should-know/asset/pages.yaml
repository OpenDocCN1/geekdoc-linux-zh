  md: '# NOTE


    You can run into problems with globes * matches and . .. (the current parent directories).
    You may wish to use a pattern such as [^.]* or ?** to get all dot files except
    the current and parent directories.


    # 2.8 Environment and Shell Variables


    The shell can store temporary variables, called shell variables, containing the
    values of text strings. Shell variables are very useful for keeping track of values
    in scripts, and some shell variables control the way the shell behaves. For example,
    the bash reads the PS1 variable before displaying the prompt.

    To assign a value to a shell, use the equal sign (=). Here''s a simple example:


    ```

    $ STUFF=blah

    ```


    The preceding example sets the value of the variable named STUFF to blah. To access
    this variable, use $STUFF (for example, by running echo $STUFF). You''ll learn
    about many uses of shell variables in Chapter 11.

    An environment variable is like a shell variable, but it''s not specific to the
    shell. All processes on Unix systems have environment variable storage. The main
    difference between environment and shell variables is that the operating system
    passes all of shell''s environment variables to programs that the shell runs,
    whereas shell variables cannot be accessed in the commands that you run.

    Assign an environment variable with the shell''s export command. For example,
    if you''d like to make the $STUFF variable into an environment variable, use the
    following:


    ```

    $ STUFF=blah

    ```


    ```

    $ export STUFF

    ```


    Environment variables are useful because many programs read them for configuration
    and options. For example, you can use your favorite command-line options in the
    LESS environment variable, and less will use those options when you run it. (Manual
    pages contain a section marked ENVIRONMENT that describes these variables.)


    # 2.9 The Command Path


    PATH is a special environment variable that contains the command path (or path
    for short). A command path is a list of directories that the shell searches when
    looking to find a command. For example, when you run ls, the shell searches the
    directories listed in PATH for the ls program. If programs with the same name
    appear in several directories of the path, the shell finds the first matching
    program.

    If you run echo $PATH, you''ll see that the path components are separated by colons
    (:). For example:


    ```

    $ echo $PATH

    /usr/local/bin:/usr/bin:/bin

    ```


    To tell the shell to look in more places for programs, change the PATH environment
    variable. For example, by using this command, you can add a directory dir to the
    beginning of the path so that the shell looks in dir before looking in any of
    the other PATH directories.

    Or you can append a directory name to the end of the PATH variable, causing the
    shell to look in dir last:


    ```

    $ PATH=dir:$PATH

    ```'
