  md: '# NOTE


    The term job can be confusing, especially Up, another init system described in
    this chapter, uses the word job to (roughly) refer to what systemd calls a unit.
    It''s important to remember although a systemd job associated with a unit will
    terminate, the unit itself can be active and running afterwards, especially in
