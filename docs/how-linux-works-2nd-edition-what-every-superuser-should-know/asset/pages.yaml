  md: '# 14.5 D-Bus


    The most important developments to out of the Linux system is the Desktop Bus
    (D-Bus), a message-passing system. D-Bus is important because it serves as an
    interprocess communication mechanism that allows desktop applications to talk
    to each other, and because Linux systems use it to notify of events, such as inserting
    a USB drive.


    D-Bus itself consists of a library that standardizes interprocess communication
    with a protocol and supporting functions for any two processes to talk to each
    other. By itself, this library doesn''t offer much more than a fancy version of
    normal core design rule of Linux Unix domain sockets. What makes D-Bus useful
    is a "hub" around dbus-daemon. Processes that need to react to events can connect
    to dbus-daemon and receive certain kinds of events. Processes also create the
    events. For example, the process usisksdaemon listens to disk events and sends
    them to dbus-daemon, which retransmits the events to applications interested in
    disk events.


    # 14.5.1 System and Session Instances


    D-Bus has become a more integral part of the Linux system, and it now goes beyond
    the desktop. For example, both systemd and Ubuntu have D-Bus channels of communication.
    However, adding dependencies to desktop tools inside the core system goes against
    a design rule of Linux.


    To address this, there are actually two kinds of dbus-daemon instances (processes)
    that can run. The first is the session instance, which is started at boot time
    with the --system option. The system instance usually runs as a D-Bus user, and
    its configuration file is /etc/dbus-1/system.conf (though you probably shouldn''t
    change the configuration). Processes can connect to the system instance through
    /var/run/dbus/system_bus_socket Unix domain socket.


    Independent of the system bus, there is an optional session instance that only
    runs when you start a desktop session. Desktop applications that you run connect
    to this instance.


    # 14.5.2 Monitoring D-Bus Messages


    One of the ways to see the difference between the system and session dbus-daemon
    instances is to monitor the events that you go the bus. Using the dbus-monitor
    utility in system mode like this:


    ```

    $ dbus-monitor --system

    signal sender=org.freedesktop.DBus -> dest=:1952 serial=2 path=/org/freedesktop/DBus;
    interface=org.freedesktop.DBus; member=NameAcquired

    string="1.952"

    ```


    The startup message here indicates that the monitor connected and acquired a name.
    You won''t see much activity when you run it, because the session instance usually
    is not very busy. To see something happening, plugging in a USB storage device.


    By comparison, session instances have much more to do. As you''ve logged in to
    a desktop session, try this:


    ```

    $ dbus-monitor --session

    ```


    Now move your mouse around to different windows; if your desktop is D-Bus aware,
    you should get a flurry of messages indicating activated.'
