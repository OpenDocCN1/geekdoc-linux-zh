    With no firewalling in place, a system processes packets and sends them on their
    way. Firewalls put checkpoints for packets at the points of data transfer identified
    above. The checkpoints drop, reject, or accept packets, usually based on some
    of these criteria:


    +   The source or destination IP address or subnet


    +   The source or destination port (in the transport layer information)


    +   The firewall''s network interface


    Firewalls provide an opportunity to work with the subsystem of the Linux kernel
    that processes IP packets. Let''s look at that now.


    # 9.21.1 Linux Firewall Basics


    In Linux, you create firewall rules in a series known as a chain. A set of chains
    makes up a table. As a packet moves through the various parts of the Linux networking
    subsystem, the kernel applies the rules in certain chains to packets. For example,
    after receiving a new packet from the physical layer, the kernel activates rules
    in chains corresponding to input.


    All of these data structures are maintained by the kernel. The whole system is
    called iptables, with an `iptables` user-space command to create and manipulate
    the rules.


    > NOTE


    There is a newer system called nftables that has a goal of replacing iptables,
    but as of this writing, iptables is the dominant system for firewalls.


    Because there can be many tables—each with their own sets of chains, each of which
    can contain many rules—packet flow can become quite complicated. However, you''ll
    normally work primarily with a single table named `filter` that controls basic
    packet flow. In the `filter` table: INPUT for incoming packets, OUTPUT for outgoing
    packets, and FORWARD for routed packets.


    Figure 9-5 and Figure 9-6 show flowcharts for where rules are applied to packets
    in the filter table. There are two figures packets can either come into the system
    from a network interface (Figure 9-5) or be generated by a local process (Figure
    9-6). As you can see, an incoming packet from the network can be consumed by a
    user process and may not reach the FORWARD chain or the OUTPUT chain. Packets
    generated by user processes won''t reach the INPUT or FORWARD chains.'
