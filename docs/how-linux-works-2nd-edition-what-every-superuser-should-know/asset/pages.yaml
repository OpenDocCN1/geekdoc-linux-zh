  md: 'Each firewall has a default policy that specifies what to do with a packet
    if no rule matches the packet. The policy for all three chains in this example
    is ACCEPT, which means the kernel allows the packet to pass through the packet-filtering
    system. The DROP policy tells the kernel to discard the packet. To set the policy
    on a chain, `iptables -P` like this:


    ```

    # iptables -P FORWARD DROP

    ```


    # WARNING


    Don''t do anything with the policies on your machine until you''ve read through
    the rest of this section.


    Say that someone at 192.168.34.63 is annoying. To prevent them from talking to
    your machine, you run this command:


    ```

    # iptables -A INPUT -s 192.168.34.63 -j DROP

    ```


    The -A INPUT parameter adds a rule to the Input chain. The -s IP address in the
    rule, and -j DROP tells the kernel to discard any packet matching the rule. Therefore,
    your machine will then drop out any packet coming from 192.168.34.63.


    To see the rule in place, run `iptables -L`:


    ```

    Chain INPUT (policy ACCEPT)

    target      prot source               destination

    DROP        all     -- 192.168.34.63      anywhere

    ```


    Unfortunately, your friend at 192.168.34.63 has everyone on your switch to open
    connections to your SMTP server (TCP port 25). To get rid of that traffic, well


    ```

    # iptables -A INPUT -s 192.168.34.0/24 -p tcp --destination-port 25 -j DROP

    ```


    This example adds a netmask to the source address as well as -p tcp to filter
    TCP packets only. A further restriction, --destination-port 25, says that the
    rule should only apply to traffic to port 25. The IP table list for INPUT now
    looks like this:


    ```

    Chain INPUT (policy ACCEPT)

    target      prot source               destination

    DROP        all     -- 192.168.34.63      anywhere

    DROP        tcp     -- 192.168.34.0/24   anywhere      tcp dpt:smtp

    ```


    All is well until you hear from someone you know at 192.168.34.37 saying they
    can''t send you email because you blocked their machine. Thinking that this is
    a quick fix, you run this command:


    ```

    # iptables -A INPUT -s 192.168.34.37 -j ACCEPT

    ```


    However, it doesn''t work. Look at the new chain:


    ```

    Chain INPUT (policy ACCEPT)

    target      prot source               destination

    DROP        all     -- 192.168.34.63      anywhere

    DROP        tcp     -- 192.168.34.0/24   anywhere      tcp dpt:smtp

    ```'
