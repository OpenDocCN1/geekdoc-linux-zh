  md: 'Most Linux distributions come with zip and unzip programs that are compatible
    with the zip archives on Windows systems. They work on the usual .zip files as
    well as self-extracting archives in .exe. If you encounter a file that ends in
    .Z, you have found a relic created by the compress program, which was once the
    Unix standard. The gunzip program can unpack these files, but gzip won''t create
    them.


    # 2.19 Linux Directory Hierarchy Essentials


    Now that you know how to examine files, change directories, and read manual pages,
    you''re ready to start exploring your system files. The details of the Linux directory
    structure are outlined in the Filesystem Hierarchy Standard, or FHS (http://www.pathname.com/fhs/),
    a brief walkthrough would suffice for now.


    Figure 2-2 offers a simplified overview of the hierarchy, showing some of the
    directories under /, /usr, /var. Notice that the directory structure under /usr
    contains some of the same directory names as.


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_37_0.png)


    Figure 2-2. Linux directory hierarchy


    Here are the most subdirectories in root:


    +   - /bin Contains ready-to-run programs (also known as executables), including
    most of the basic Unix commands such as ls and cp. Most of the programs in /bin
    are in binary format, having been created by a C compiler, but some are shell
    scripts in modern systems


    +   - /dev Contains device files. You''ll learn more about these in Chapter 3.


    +   - /etc Let system configuration directory (pronounced EHT-see) contains the
    user password, boot, device, networking, and other setup files. Many items in
    /etc are specific to the machine''s hardware. For example, the /etc/X11 directory
    contains graph and window system configurations.


    +   - /home Holds personal directories for regular users. Most Unix installations
    confirm this for standard.


    +   - /lib An abbreviation for library, this directory holds library files containing
    executables that can use. There are two types of libraries: static and shared.
    The /lib directory should contain only shared libraries, but other lib directories,
    such as /usr/lib, contain various as well as auxiliary files. (We''ll discuss
    libraries later in root in Chapter 15)


    +   - /proc Provides system statistics through a browseable directory-and-file
    interface. Most of the /proc subdirectory on Linux is unique, but many Unix variants
    have similar features. The /proc contains information about currently running
    processes as well as kernel parameters.


    +   - /sys Is similar to /proc in that it provides a device and system interface.
    You''ll learn more about /sys in Chapter 3.


    +   - /sbin The place for system executables. Programs in /sbin directories relate
    to system management, regular users usually do not have /sbin components in their
    command path. Many of the utilities here will not work if you''re not running
    them as root.'
