    Then insert rule at the top of the chain with iptables -I:


    ```

    # iptables -I INPUT -s 192.168.34.37 -j ACCEPT

    ```


    To insert rule else in a chain, put the rule after the chain name (for example,
    iptables INPUT 4 ..).


    # 9.21.3 Firewall Strategies


    Although the tutorial showed you how to insert rules and how the kernel processes
    IP chains, we haven''t seen firewall strategies that actually work. Let''s talk
    about that now.


    There are two basic kinds of firewall scenarios: for protecting individual machines
    (where you set rules in each machine''s INPUT chain) and for protecting a network
    of machines (where you set rules in the router''s FORWARD chain). In both cases,
    you can have serious security if you use a default policy of ACCEPT and continuously
    insert rules from sources to start bad stuff. You must allow only the packets
    that you trust and deny everything else.


    For example, if your machine has an SSH server on TCP port 22. There is no reason
    for any random host to initiate a connection to any other port on your machine,
    and you shouldn''t give any such host a chance. To set that up, first set the
    INPUT chain policy to DROP:


    ```

    # iptables -P INPUT DROP

    ```


    To enable ICMP traffic for ping and other utilities, use this line:


    ```

    # iptables -A INPUT -p icmp -j ACCEPT

    ```


    Make sure you can send packets to both your network IP address and 127.0.0.1 (localhost).
    Assuming your host''s IP address is my_addr, do this:


    ```

    # iptables -A INPUT -s 127.0.0.1 -j ACCEPT

    ```


    ```

    # iptables -A INPUT -s my_addr -j ACCEPT

    ```


    If you control your entire subnet (and trust everything on it), you can replace
    my_addr with your subnet address and mask, for example, 10.23.2/24.


    Now, although you still want to denying TCP connections, you still need to make
    sure that your host can make connections to the outside world. Because all TCP
    connections start with a SYN (connection request), if you drop all packets that
    aren''t SYN packets, you''re still stuck:


    ```

    # iptables -A INPUT -p tcp '''''' --syn -j ACCEPT

    ```


    Next, if you''re using UDP-based DNS, you must accept traffic from your name server
    so that your machine can look up names with DNS. For all DNS servers in /etc/resolv.conf.
    Use this command (where the name server''s address is ns_addr);'
