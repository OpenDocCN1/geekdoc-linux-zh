    controllers. Therefore, there should be no surprise that the Linux kernel has
    a three-layer USB subsystem that closely resembles the SCSI subsystem, with device-class
    drivers at the top, a bus management controller in the middle, and host drivers
    at the bottom. As the SCSI subsystem passes SCSI commands between its components,
    the USB subsystem passes USB messages between its components. There''s an lsusb
    that is similar to lssci.


