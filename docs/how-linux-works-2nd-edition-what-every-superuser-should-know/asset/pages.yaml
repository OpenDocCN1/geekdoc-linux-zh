  md: '# Chapter 4. Disks and Filesystems


    In Chapter 3, we discussed some of the top-level disk devices that the kernel
    makes available. In this chapter, we''ll discuss in detail how to work with disks
    on a Linux system. You''ll learn how to partition disks, create and maintain the
    filesystems that go inside partitions, and work with swap space.


    Recall that disk devices have names like /dev/sda, the first SCSI subsystem disk.
    This kind of block device represents the entire disk, but there are many different
    components and layers inside a disk.


    Figure 4-1 illustrates the schematic of a typical Linux disk (note that the figure
    is not to scale). As you progress through this chapter, you''ll learn where each
    piece fits in.


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_58_0.png)


    Figure 4-1. Typical Linux disk schematic


    Partitions are subdivisions of the whole disk. On Linux, they''re denoted with
    a number after the block device, and therefore have device names as /dev/sda1
    and /dev/sdb3. The kernel presents each partition as a block device, just as it
    would an entire disk. Partitions are defined on a small area of the disk called
    a partition table.


    > NOTE


    Multiple partitions were once common on large disks because older PCs could boot
    from certain parts of the disk. Also, administrators used partitions to reserve
    a certain amount of space for operating system areas; for example, they didn''t
    want to be able to fill the entire system and prevent critical services from working.
    This practice is not unique to Unix; you''ll find many new Windows systems with
    several partitions on a single disk. In addition,'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'most systems have a separate swap partition.


    Although the kernel makes it possible for you to access an entire disk and one
    of its partitions at the same time, you would not normally do so, unless you were
    copying the entire disk.


    The next layer after the partition is the filesystem, the database of files and
    directories that you''re accustomed to interacting with in user space. We''ll
    explore filesystems in 4.2 Filesystems.


    As you see in Figure 4-1, if you want to access the data in a file, you need to
    get the appropriate partition location from the partition table and then search
    the filesystem database on that partition for the desired data.


    To access data on a disk, the Linux kernel uses the system of layers shown in
    Figure 4-2. The SCSI subsystem and everything else described in 3.6 In-Depth:
    SCSI and the Linux Kernel are represented by a single box. (Notice that you can
    work with the disk through the filesystem as well as directly through the disk
    devices. You''ll do both in this chapter.)


    To get a handle on how everything fits, let''s start at the bottom with partitions.


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_59_0.png)'
