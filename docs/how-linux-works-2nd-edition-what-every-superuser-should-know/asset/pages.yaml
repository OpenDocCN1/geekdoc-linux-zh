    # Chapter 13. User Environments


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_240_0.png)


    This book primary focus is on the Linux system that normally lies underneath server
    processes and interactive user sessions. But eventually, the system and the user
    have to meet somewhere. Startup files play an important role at this point, because
    they set defaults for the shell and other interactive programs. They determine
    how the system behaves when a user logs in.


    Most users don''t pay attention to their startup files, only touching them when
    they want to add something for convenience, such as an alias. Over time, the files
    cluttered with unnecessary environment variables and tests that can lead to annoying
    (or quite serious) problems.


    If you''ve run a Linux machine for a while, you may notice that your home directory
    accumulates a bafflingly large array of startup files over time. These are sometimes
    dot files because they nearly start with a dot (.). Many of these are automatically
    created when you first run a program, and you''ll never need to change them. This
    chapter primarily covers startup files, which are the ones you''re most likely
