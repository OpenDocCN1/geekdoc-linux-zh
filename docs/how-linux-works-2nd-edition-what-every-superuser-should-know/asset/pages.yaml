    # 9.3 The Internet Layer


    Rather than at the very bottom of the network stack with the physical layer, we''ll
    start at the network layer because it is easier to understand. The Internet as
    we currently know is based on the Internet Protocol, version 4 (IPv4), though
    version 6 (IPv6) is gaining adoption. One of the most important aspects of the
    Internet is that it places no particular requirements on hardware or operating
    systems. The idea is that you can send and receive Internet packets over any kind
    of hardware, using any operating system.


    The Internet''s topology is decentralized; it''s made up of smaller networks called
    subnets. The idea is that subnets are interconnected in some way. For example,
    in Figure 9-1, the LAN is normally a subnet.


    A host can be attached to more than one subnet. As you see in 9.1 Network Basics,
    that kind of host is called a router if it can transmit data from one subnet to
    another (another term for gateway). Figure 9-2 refines Figure 9-1 by identifying
    the LAN as a subnet, well as Internet addresses for each host and the router.
    The router in the figure has two addresses, the local subnet 10.23.2.1 and the
    link to the Internet (but this Internet''s address is not right now unless it''s
    marked ''Uplink Address''). We''ll look first at the addresses and then the subnet
    notation.


    Each Internet host has at least one numeric IP address in the form of a.b.c.d,
    such as 10.23.2.37. An address in this notation is called dotted-sequence. A host
    is connected to multiple subnets, it has at least one IP address per subnet. Each
    host''s IP address should be unique across the entire Internet, but as you''ll
    see, private networks and NAT can make this little confusing.


