    # 9.14.4 Characteristics of TCP


    TCP is popular as a transport layer protocol because it requires relatively little
    from how to open (or read), from write to, and close a connection. To the application,
    it seems as if there are incoming and outgoing streams of data; the process is
    nearly as simple as working with a file.


    However, there''s a lot of work to do behind the scenes. For one, the TCP implementation
    needs to know how to break an outgoing data stream from a process into packets.
    The hard part is knowing how to convert a series of incoming packets into an input
    stream for processes to read, especially when incoming packets don''t necessarily
    arrive in the correct order. In addition, a host TCP check must check for errors.
