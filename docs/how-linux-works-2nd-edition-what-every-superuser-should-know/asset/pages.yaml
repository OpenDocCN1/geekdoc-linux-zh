    # ## 15.2.2 Built-in Rules


    So does `make` know how to go from `aux.c` to `aux.o`? After all, `aux.c` is not
    in the Makefile. The answer is that `make` follows its built-in rules. It knows
    to look for a `.c` file when you want a `.o` file, and furthermore, it knows how
    to run `cc -c` on `.c` file to get to of creating a `.o` file.


    # ## 15.2.3 Final Program Build


    The final step in getting `myprog` is a little tricky, but the idea is clear enough.
    After you have the two object files in `$ OBJS`, you can run the CC compiler according
    to the following line (where `$ (CC)` expands to the compiler name):


    ```

    $ (CC) -o myprog $

    ```


    The whitespace before `$ (CC)` is a tab. You *must* insert a tab before any real
    command, on its own line.


    Watch out for:


    ```

    Makefile:7: *** missing separator. Stop.

    ```


    An error like this means the Makefile is broken. The tab is the separator, and
    if there is no separator or there''s some other interference, you''ll see this
    error.


    # ## 15.2.4 Staying-to-Date


    One last `make` fundamental is that targets should be up-to-date with their dependencies.
    If you type `make` twice in a row for the preceding example, the first command
    builds `myprog`, but the second yields this:


    ```

    make: Nothing to be done for ''all''.

    ```


    This second time, `make` looked at its rules and noticed that `myprog` already
    exists, so it didn''t build `myprog` because none of the dependencies had changed
    since it was last built. To experiment with this, do the following:


    +   1. Run `make aux.c.`. This time, `make` determines that `aux.c` is newer than
    the `aux.o` already in the directory,

    2. Run `make` again. Then it compiles `aux.o`.'
