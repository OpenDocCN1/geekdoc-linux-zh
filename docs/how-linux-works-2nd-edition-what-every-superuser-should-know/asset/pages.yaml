    # ## 9.2 Ethernet, IP, and ARP


    There is one interesting detail in the implementation of IP Ethernet that we have
    to recall. A host must place an IP packet inside an Ethernet frame in order to
    transmit the packet across the physical layer to another host. Recall, to that
    frames do not include IP information; they use MAC (hardware) addresses. The question
    is: When constructing the Ethernet frame for an IP packet, how does the host know
    which MAC address corresponds to the destination IP?


    We don''t normally worry about this question because networking software includes
    an automatic system of looking up MAC addresses called Address Resolution Protocol
    (ARP). A host using Ethernet as its physical layer and IP network layer maintains
    a small table called ARP cache that maps IP addresses to MAC addresses. In Linux,
    the ARP cache is in the kernel. To view your machine''s ARP cache, use the arp
    command. (As with many other network commands, the -n option returns DNS lookups.)


    # ### arp -n


    | Address | Hwype | Hwaddr | Flags Mask | Iface |

    | --- | --- | --- | --- | --- |

    | 10.1.2.141 | ether | 00:11:32:0d:ca:82 | C | eth0 |

    | 10.1.2.1 | ether | 00:24:a5:b5:a0:11 | C | eth0 |

    | 10.1.2.50 | ether | 00:0c:41:f6:1c:99 | C | eth0 |


    When a machine starts, its ARP cache is empty. How do these MAC addresses get
    in the cache? It starts when the machine wants to send a packet to another host.
    If a IP address is not in an ARP cache, the following steps occur:


    +   1. The origin host creates a special Ethernet frame containing an ARP request
    packet for the MAC address that corresponds to the target IP address.

    2. The origin host broadcasts this frame to the entire physical network for the
    target''s subnet.

    3. If one of the other hosts knows the MAC address, it creates a reply packet
    and frame containing the address and sends it back to the origin. Often, the host
    that replies is the target host and is simply replying with its own MAC address.

    4. The origin host adds the IP-MAC address pair to the ARP cache and can proceed.


    Remember that ARP only applies to machines on local subnets (refer to 9.4 Routes
    and the Kernel Routing Table to see local subnets). To reach destinations outside
    your subnet, your host'
  merge: -1
