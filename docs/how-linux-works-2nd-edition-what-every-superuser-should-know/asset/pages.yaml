    # # iptables -A INPUT -p tcp --destination-port 22 -j ACCEPT


    The preceding iptables settings work for many situations, including any direct
    connection (especially broadband) when there is an intruder who is much likely
    to port-scan your machine. You could also adapt these settings for a firewall
