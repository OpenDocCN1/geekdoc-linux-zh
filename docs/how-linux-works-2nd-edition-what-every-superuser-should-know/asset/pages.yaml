    layer. Some dig into the transport and network layers, ,, everything in the application
    layer eventually maps down to something in those lower layers.


    As discussed in Chapter 9, netstat is a basic network service debugging tool that
    can display a number of transport and network layer statistics. Table 10-2 reviews
    a few useful options for viewing connections.


