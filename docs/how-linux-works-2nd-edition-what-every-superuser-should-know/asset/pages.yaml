    # ## 4.2.5 Disk Buffering, Caching, and Filesystems


    Linux, like other versions of Unix, writes to the disk. This means that the kernel
    usually doesn’t write to filesystems when processes request changes. Instead it
    stores the changes in RAM the kernel can conveniently make the actual change to
    the disk. This buffering system is transparent to the user and improves performance.


    When you unmount the kernel automatically synchronizes with the disk. At any other
    time, you can force the kernel to write its changes in its buffer to the disk
    by running the sync command. For some reason you can’t unmount a filesystem before
    you turn off the system, be sure to run sync first.


    In addition the kernel has a series of mechanisms that use RAM to automatically
    cache reads from a disk. Therefore, if one or more processes repeatedly access
    a file, the kernel doesn’t have to go to the disk again and again—it can simply
    read from the cache and save time and resources.


    # ## 4.2.6 Filesystem Mount Options


    There are many ways to change the mount behavior, as is often necessary with removable
    media or when performing system maintenance. In fact, the total number of mount
    options is staggering. The extensive mount(8) manual page is a good reference,
    but it’s hard to know where to start and what you can safely ignore. Use the most
    useful options in this system.


    Options fall into two categories: general and filesystem-specific ones. General
    options include -t for specifying the filesystem type (as mentioned earlier).
    In contrast, a filesystem-specific option only pertains to certain filesystem
    types.


    To activate a filesystem option, use the -o switch followed by the option. For
    example, -o noruck turns off Rock Ridge extensions on an ISO 9660 file-system,
    but it has no meaning for any other kind of filesystem.


    # ### Short Options


    The most important mount options are:


    +   - -r The -r option mounts the filesystem in read-only mode. This has a number
    of users, from write to boot protection. You don’t need to specify this option
    when accessing a read-only device such as a CD-ROM; the system will do it for
    you (and will tell you about the read-only status)


    +   - -n The -n ensures that mount does not try to update the system mount database,
    /etc/stab. The mount operation fails when it cannot write to this file, which
    is important at boot time because the root partition (and, therefore, the system
    mount database) is read-only at first. You’ll also find this handy to fix a system
    problem in single-user mode, because the system mount database may not be available
    at the time.


    +   - -t The -t type specifies the filesystem type.


    # ### Long Options


    Short options like -r are too limited for the ever-increasing number of mount
    options; there are too few letters in the alphabet to accommodate all possible
    options. Short options are also troublesome because it is difficult to determine
    an option’s meaning based on a single letter. Many general options and filesystem-specific
    options use a longer, more flexible option format.


    To use long options with mount on the command line, start with -o and supply some
    keywords. Here’s a complete example, with the long options following -o:'
