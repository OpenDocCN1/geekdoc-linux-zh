    41475, and 57132 on the local side that are all connected. The first connection
    shows port 47626 connected to port 5222 of 10.194.79.125.


    # 9.14.2 Establishing TCP Connections


    To establish a transport connection, a process initiates the connection from one
    of its local ports to a port on a second host with a special series of packets.
    In order to recognize the incoming connection and respond, the second host must
    have a process listening on the correct port. Usually, the connecting process
    is called the client, and the listener is called the server (more about this in
    Chapter 10).


    The important thing to know is that the client picks a port on its side that isn''t
    currently in use, but it always connects to some well-known port on the server
    side. Recall this output from the netstat command in the preceding section:


    | Proto Recv-Q Send-Q Local Address | Foreign Address | State |

    |---|---|---|---||

    | tcp | 0 | 0 | 10.23.2.4:47626 | 10.194.79.125:5222 | ESTABLISHED |


