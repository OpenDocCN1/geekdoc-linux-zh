  md: "# 5.5.2 GRUB Configuration\n\nThe GRUB configuration directory contains the\
    \ central configuration file (grub.cfg) and numerous loadable modules with a _mod\
    \ suffix. (As GRUB versions progress, these modules will move into subdirectories\
    \ as i386-pc.) The directory is usually /boot/grub or /boot/grub2. We will not\
    \ modify grub.cfg; instead, we use the grub-mkconfig command or grub2-mkconfig\
    \ on Fedora.\n\n# Reviewing Grub.cfg\n\nFirst, take a quick look at grub.cfg to\
    \ see GRUB initializes its menu and kernel options. You'll see that the grub.cfg\
    \ file consists of GRUB commands, which usually begin with a number of initialization\
    \ steps followed by a series of entries for different kernel and boot configurations.\
    \ The initialization isn't complicated; it's a bunch of function definitions and\
    \ video setup like this:\n\n```\nif loadfont /usr/share/grub/unicode.pf2 ; then\n\
    \n  set gfxmode=auto\n\n  load_video\n  insmodmod gfxterm\n  --snip--\n```\n\n\
    Later in this file you should see the available boot configurations, each beginning\
    \ with the menuentry command. You should be able to read and understand this example\
    \ based on what you learned in the preceding section:\n\n```\nmenuentry 'Ubuntu,\
    \ with Linux 3.2.0-34-generic-pae' --class ubuntu --class gnu-linux --class gnu\
    \ --class os {\n\n  recordfail\n  gfxmode $linux_gfx_mode\n  insmod gzio\n  insmod\
    \ part_msdos\n  insmod ext2\n  set root='(hd0,msdos1'\n  search --no-floppy --fs-uuid\
    \ --set-root 70cd6e7-64ae6-44f6-812c-5a1ab8063d29\n  linux /boot/vmlinux-3.2.0-34-generic-pae\
    \ root=UUID=70cd6e7-64ae6-44f6-812c-5a1ab8063d29\n  ro quiet splash $vt_handoff\n\
    \  initrd /boot/initrd.img-3.2.0-34-generic-pae\n}\n```\n\nWatch for submenu commands.\
    \ Your grub.cfg file contains numerous menuentry commands, most of them are properly\
    \ wrapped inside a submenu for older versions of the kernel so that they don't\
    \ crowd the GRUB menu."
