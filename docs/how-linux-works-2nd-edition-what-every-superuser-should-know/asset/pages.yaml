    - **SyslogFacility** name Logs messages with syslog facility `name`.

    - **X11Forwarding** value Enables X Window System client tunneling if `value`
    is set to yes.

    - **XAuthLocation** path Provides a path for `xauth`. X11 tunneling will not work
    without this path. If `xauth` is not in `/usr/bin`, set `path` to the full pathname
    for `xauth`


