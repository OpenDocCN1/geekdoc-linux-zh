  md: '# Chapter 14. A Brief Survey of the Linux Desktop


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_249_0.png)


    This chapter is a quick introduction to the components found in a typical Linux
    desktop system. All of the different kinds of software that you can find on Linux
    systems, the desktop arena is one of the wildest and most colorful because there
    are so many environments and applications to choose from, and most distributions
    make it relatively easy for you to try them out.


    Unlike other parts of a Linux system, such as storage and networking, there isn’t
    much of a hierarchy of layers involved in creating a desktop structure. Instead,
    each component performs a specific task, communicating with other components as
    necessary. Some components share common building blocks (in particular, libraries
    for graphical toolkits), and these can be thought of as simple abstraction layers,
    but that’s about as deep as it gets.


    This chapter offers a high-level discussion of desktop components in general,
    but we’ll look at two pieces in a little more detail: the X Window System, which
    is the core infrastructure behind most desktops, and D-Bus, an interprocess communication
    service used in many parts of the system. We’ll limit the hands-on discussion
    and examples to a few diagnostic utilities that, while not terribly useful-to-day
    (most GUIs don’t require you to enter shell commands in order to interact with
    them), will help you understand the underlying mechanics of the system and perhaps
    provide some entertainment along the way. We’ll also take a quick look at printing.


    # 14.1 Desktop Components


    Linux desktop configurations offer a great deal of flexibility. Most of what the
    Linux user experiences the (“look and feel” of the desktop) comes from applications
    or building blocks of applications. If you don’t like a particular application,
    you can usually find an alternative. And if you’re looking for something doesn’t
    exist, you can write it yourself. Linux developers need to have a wide variety
    of preferences for how a desktop should act, which makes for a lot of choices.


    In order to work together, all applications need to have something in common,
    and at the core of nearly everything on Linux desktops is the X (X Window System).
    Think of X as sort of the (“kernel”) of the desktop that manages everything from
    rendering windows to configuring displays to handling input from devices such
    as keyboards and mice. The X server is also the component that you won’t easily
    find a replacement for (see 14.4 The Future of X).


    The X server is a server and does not dictate the anything anything should act
    or appear. Instead, X client programs handle the user interface. Basic X client
    applications, such as terminal windows and web browsers, make connections to the
    X server and ask to draw windows. In response, the X server figures out to place
    the windows and renders them. The X server also channels input back to the client
    when appropriate.


    # 14.1.1 Window Managers


    X clients don’t have to act like windowed applications; they can act as services
    for other clients or provide'
