    (I arbitrarily chose the names myfirst and mysecond in the GPT table).


    The MBR table in this example contains primary, extended, and logical partitions.
    A primary partition is a normal subdivision of the disk; partition is such a partition.
    The MBR has a limit of four partitions, so if you have more than four, designate
    one as an extended partition. Next, if you subdivide the extended partition into
