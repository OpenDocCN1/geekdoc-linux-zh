    # ## 2.15 Understanding Error Messages


    When you encounter a problem on a Unix-like system such as Linux, you must read
    the error message. Unlike messages from other operating systems, Unix errors usually
    tell you exactly what went wrong.


    # ### 2.15.1 Anatomy of a UNIX Error Message


    Most Unix programs generate and report the same basic error messages, but there
    can be subtle differences between the output of any two programs. Here''s an example
    that you''ll certainly encounter in some form or other:


    ```

    $ ls /dsafda

    ls: cannot access /dsafda: No file or directory

    ```


    There are three components to this message:


    +   - The program name, ls. Some programs omit this identifying information, which
    can be annoying when writing shell scripts, but it''s not really a deal.

    - The filename, /dsafda, which is a more specific piece of information. There''s
    a problem with this path.

    - The error no file or directory indicates the problem with the filename.


    Putting all together, you get something like "ls tried to open /dsafda but couldn''t
    because it doesn''t exist." Even with these messages, it can get a little confusing
    when you run a shell script that includes an erroneous command under a different
    name.


    When troubleshooting errors, always address the first error. Some programs report
    that they can''t do anything before reporting the host of other problems. For
    example, you run a fictitious program called scumd


    ```

    scumd: cannot access /etc/scumd/config: No file or directory

    ```


    Following this is a list of other error messages that looks like a complete catastrophe.
    Don''t let other errors distract you. You would really just need to check /etc/scumd/config.


    > NOTE


    Don''t confuse error messages with warning messages. Warnings often look like
    errors, but they contain the word Warning. A warning usually means something is
    wrong but the program will try to continue anyway. To fix a problem noted in a
    warning message, you may have to hunt down a process and kill it before doing
    anything else. (You''ll learn about listing and killing processes in 2.16 Listing
    and Manipulating Processes.)


    # ## 2.15.2 Common Errors


    Many errors that you''ll encounter in Unix programs result from things that can
    go wrong with files and processes. Here''s an example message hit parade:'
