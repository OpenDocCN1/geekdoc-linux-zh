    6.7 Shutting Down System for how to shut down and reboot the system.


    # 6.4.5 Adding Units to systemd


    Adding units to systemd is primarily a matter of creating, activating and possibly
    enabling, unit files. You should normally put your own unit files in the system
    configuration directory /etc/systemd/system so that you won''t confuse them with
    anything that comes with your distribution and so the distribution won''t overwrite
    them when you upgrade.


    Because it''s easy to create target units that don''t do anything and don''t interfere
    with anything, you should try it. Here is how to create two targets, one with
    a dependency on the other:


    +   1. Create a unit file test.target:


    +   2. [Unit]


    Description=test 1


    +   3. Create a test2.target file with a dependency on test1.target:


    +   4. [Unit]


    5. Description=test\2

    Wants=test1.target


    +   6. Activate the test2.target unit (remember that the dependency in test2.target
    causes systemd to activate test1.target when you do this):


    ```

    # systemctl start test2.target

    ```


    +   7. Verify that both units are active:


    +   8. # systemctl status test1.target test2.target


    +   9. test1.target - test 1


    +   10. Loaded: loaded (/etc/systemd/system/test1.target); static

    11. Active: active since Thu, 12 Nov 2015 15:42:34 -0800; 10s


    +   12. test2.target - test 2

    14. Loaded: loaded (/etc/systemd/system/test2.target); static)

    Active: active since Thu, 12 Nov 2015 15:42:34 -0800; 10s ago


    # NOTE


    If your unit has an [Install] section, "enable" the unit before activating:


    ```

    # systemctl enable unit

    ```'
