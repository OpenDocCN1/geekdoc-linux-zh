    Connected to www.wikipedia.org.

    Escape character is ''^''.

    ```


    Enter


    ```

    GET / HTTP/1.0

    ```


    Press ENTER twice. The server should send a bunch of HTML text as a response and
    terminate the connection.


    This exercise tells us that


    +   - the remote host has a web server process listening on TCP port 80;

    - telnet was the client that initiated the connection.'
