  md: '# Chapter 11. Introduction to Shell Scripts


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_209_0.png)


    If you can enter commands into the shell, you can write shell scripts (also known
    as Bourne shell scripts). A shell script is a series of commands written in a
    file; the shell reads the commands from the file just as it would if you typed
    them into a terminal.


    # 11.1 Shell Script Basics


    Bourne shell scripts generally start with the following line, which indicates
    that the /bin/sh program should execute the commands in the script file. (Make
    sure that no whitespace appears at the beginning of the script file).


    ```

    #!/bin/sh

    ```


    The # part is called a shebang; you''ll see it in other scripts in this book.
    You can list any commands that want the shell to execute following the #!/bin/sh
    line. For example:


    ```

    #!/bin/sh

    ```


    ```

    #

    ```


    ```

    # Print something, then run ls

    ```


    ```

    echo About to run the ls command.

    ls

    ```


    > NOTE


    A # character at the beginning of a line indicates that the line is a comment;
    that, the shell ignores anything on a line after a #. Use comments to explain
    parts of your scripts that are difficult to understand.


    After creating a shell script and setting its permissions, you can run it by placing
    the script file in one of the directories in your command path and running the
    script name on the command line. You can also run ./script if the script is located
    in your current working directory, or you can use the full path.


    As with any program on Unix systems, you need to set the executable bit for a
    shell script file, but you must also set the read bit in order for the shell to
    read. The easiest way to do this is as follows:


    ```

    $ chmod +rx script

    ```


    This chmod allows other users to read and execute script. If you don''t want that,
    use the absolute mode 700 instead (refer to 2.17 File Modes and Permissions for
    a refresher on permissions).


    With the basics before us, let''s look at some of the limitations of shell scripts.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# 11.1 Limitations of Shell Scripts


    The Bourne shell manipulates commands and files with relative ease. In 2.14 Shell
    Input and Output, you saw the way the shell can redirect output, one of the important
    elements of shell script programming. However, the shell script is only one tool
    for Unix programming, and although scripts have considerable power, they also
    have limitations.


    One of the main strengths of shell scripts is that they can simplify and automate
    tasks that you can otherwise perform at the shell prompt, like manipulating batches
    of files. But if you''re trying to pick apart strings, perform repeated arithmetic
    computations, or access complex databases, or if you want functions and control
    structures, you''re better off using a scripting language like Python, Perl, or
    awk, or perhaps even a compiled language like C. (This is important, so we will
    repeat it throughout the chapter.)


    Finally, beware of your shell script sizes. Keep your shell scripts short. Bourne
    shell scripts aren''t meant to be big (though you will undoubtedly encounter monstrosities).


    # 11.2 Quoting and Literals


    One of the most confusing elements of working with the shell and scripts is when
    to use quotation marks (or quotes) and other punctuation, and why it''s sometimes
    necessary to do so. Let''s say you want to print the string $100 and you do the
    following:


    ```

    $ echo $100

    00

    ```


    Why did this print 00? Because the shell saw $1, which is a shell variable (we''ll
    cover it soon). You might think that if you surround it with double quotes, the
    shell will leave the $1 alone. But it still doesn''t work:


    ```

    $ echo "$100"

    00

    ```


    Then you ask a friend, who says that you need to use single quotes instead:


    ```

    $ echo ''$100''

    $100

    ```


    Why did this particular incantation work?


    # 11.2.1 Literals


    When you use quotes, you''re often trying to create a literal, a string that you
    want the shell to pass to the command line untreated. In addition to the $ in
    the example that you just saw, other circumstances include when you want to pass
    a * character to a command such as grep instead of the shell expand it, and when
    you need to use a semicolon (;) in a command.


    When writing scripts and working on the command line, just remember what happens
    when the shell runs a command:


    +   1. Before running the command, the shell looks for variables, globs, and other
    substitutions and performs the substitutions if they appear.


    +   2. The shell passes the results of the substitutions to the command.


    Problems involving literals can be subtle. Let''s say you''re looking for all
    entries in /etc/passwd that match the regular expression r.*t such as a line that
    contains r followed by t later in the line, which would enable you to search for
    usernames using r.* root and root). You can run this command:'
  merge: -1
  pgno: 210
- img_proc: true
  md: '```

    $ grep r.* /etc/passwd

    ```


    It works most of the time, but sometimes it mysteriously fails. Why? The answer
    is probably in your current directory. If that directory contains files with names
    as r.input and r.output, then the shell expands r.*t to r.input r.output and creates
    this command:


    ```

    $ grep r.input r.output /etc/passwd

    ```


    The key to avoiding problems like this is to first recognize the characters that
    can get you in trouble and then apply the correct kind of quotes to protect the
    characters.


    # 11.2.2 Single Quotes


    The easiest way to create a literal and make the shell leave a string alone is
    to enclose the entire string in single quotes, as in this example with grep and
    the * character:


    ```

    $ grep ''r.*t'' /etc/passwd

    ```


    As far as the shell is concerned, all characters between the two quotes, make
    up a single parameter. Therefore, the following command does not work, because
    it asks the grep command to search for the string r.*t /etc/passwd in the standard
    input (because there''s only one parameter to grep):


    ```

    $ grep ''r.*t'' /etc/passwd''

    ```


    When you need to use a literal, you should always turn single quotes first, because
    you''re guaranteed that the shell won''t try any substitutions. As a result, it''s
    generally clean syntax. However, sometimes you need a little more flexibility,
    so you can turn double into quotes.


    # 11.2.3 Double Quotes


    Double quotes (") work just like single quotes, except that the shell expands
    any variables that appear within double quotes. You can see the difference by
    running the following command and then replacing the double quotes with single
    quotes and running it again.


    ```

    $ echo "There is no * in my path: $PATH"

    ```


    When you run the command, notice that the shell substitutes for $PATH but does
    not substitute for the *.


    If you''re using double quotes when printing large amounts of text, consider using
    a here document, as described in 11.9 Here Documents.


    # 11.2.4 Passing a Literal Single Quote


    One tricky part to using literals with the Bourne shell comes when passing a literal
    single quote to a command. One way to do this is to place a backslash before the
    single quote:


    ```

    $ echo I "don\''t contractions inside shell scripts"

    ```


    The backslash and quote must appear outside any pair of single quotes, and a string
    such as ''don\''t results in a syntax error. Oddly enough, you can enclose the
    single quote inside double quotes, as shown in the following example (the output
    is identical to that of the preceding command):


    ```

    $ echo "I don''t contractions inside shell scripts."

    ```


    If you''re in a bind and need a general rule to quote an entire string with no
    substitutions, follow this procedure:'
