  md: '# Chapter 16. Introduction to Compiling Software From C Source Code


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_275_0.png)


    Mostproprietary third-party Unix software packages come as source code that you
    can build and install. One reason for this is that Unix (and Linux itself) has
    so many different flavors and architectures that it would be difficult to distribute
    binary packages for all possible platform combinations. The reason which is at
    least important, is that widespread source code distribution throughout the Unix
    community encourages users to contribute bug fixes and new features to software,
    giving meaning to the term open source.


    You can get everything you see on a Linux system as source code—from the kernel
    and C library to the web browsers. It is ever possible to update and augment your
    entire system by re-installing parts of your system from source code. However,
    you probably shouldn''t update your machine by installing everything from source
    code, unless you really enjoy the process or have some other reason.


    Linux distributions typically provide easy ways to update core parts of the system,
    such as the programs in /bin, and one particularly important property of distributions
    is that they fix security problems very quickly. Don''t expect your distribution
    to provide everything for you. Here are some reasons why you may want to install
    packages yourself:


    +   - To control configuration options.


    +   - To install the software anywhere you like. You can install several different
    versions of the same package.


    +   - To control the version that you install. Distributions don''t always stay
    up-to-date with the latest versions of all packages, particularly-adds to software
    packages (such as Python libraries).


    +   - To better understand how a package works.


    # 16.1 Software Build Systems


    There are many programming environments on Linux, from traditional C to interpreted
    scripting languages such as Python. Each has at least one distinct system for
    building and installing packages in addition to the tools that a Linux distribution
    provides.


    We''re going to look at compiling and installing C source code in this chapter
    with only one of these build systems—the configuration scripts generated from
    the GNU autools suite. This system is generally considered stable, and many of
    the basic Linux utilities use it. Because it''s based on existing tools such as
    make, after you see it in action, you''ll be able to transfer your knowledge to
    other build systems.


    Installing a package from C source code usually involves the following steps:


    +   1. Unpack the source code archive.


    +   2. Configure the package.


    +   3. Run make to build the programs.'
