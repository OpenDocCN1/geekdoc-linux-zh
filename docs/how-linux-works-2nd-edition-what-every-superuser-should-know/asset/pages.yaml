  md: '# 7.2 System Logging


    Most system programs write their diagnostic output to the syslog service. The
    traditional syslog daemon waits for messages, depending on the type of message
    received, funnels the output to a file, the screen, users, or some combination
    of these, or ignores it.


    # 7.2.1 The System Logger


    The system logger is one of the most important parts of the system. When something
    goes wrong and you don''t know where to start, check the system log files first.
    Here is a sample log file:


    ```

    Aug 19 17:59:48 duplex sshd[484]: Server listening on 0.0.0.0 port 22.

    ```


    Most Linux run a new version of configuration syslogd does much more than simple
    log messages to files. For example, you can use it to load a message to send logs
    to a database. But starting up now it''s easiest to start with the log files stored
    in /var/log. Check out some log files—once you know what they look like, you''ll
    be ready to find out how they got there.


    Many of the files in /var/log are not maintained by the system logger. The only
    way to know for sure one belongs to syslog is to look at its configuration file.


    # 7.2.2 Configuration Files


    The base syslog configuration is /etc/syslog.conf, but you''ll find certain configurations
    in other directories, such as /etc/syslog.d. The configuration format is a blend
    of traditional rules and rslog-specific extensions. One rule of thumb is that
    anything beginning with a dollar sign ($) is extension.


    A traditional rule has a selector and an action to show how to catch logs and
    where to send them, respectively. For example:


    Example 7-1. syslog rules


    ```

    kern.

    /dev/console

    *.info;authpriv.none① /var/log/messages

    *.authpriv.* /var/log/secure,root

    mail.* /var/log/maillog

    cron.* /var/log/cron

    *.emerg② /var/log/boot

    local7.* /var/log/syslog

    ```


    The selector is on the left. The type of information to be logged. On the right
    is the action: to send the log. Most actions in Example 7-1 are normal files,
    with some exceptions. /dev/console refers to a special device for the system console,
    root means a message to the superuser if it is logged in, and * clears all users
    on the system. You can also send messages to another network host with @host.


    # Facility and Priority


    The selector is a pattern that matches the facility and priority of log messages.
    The facility is a general category for their name. For example, the configuration
    file in Example (rsyslog.conf(5) for a list of all facilities.)


    The function of most facilities will be obvious from their name. Example-1 catches
    messages carrying the kern, authpriv, mail, cron, and local7 facilities. In this
    listing, the asterisk * is a wildcard that catches related to all facilities.'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'The priority follows the dot (.) after the facility. The order of priorities
    from lowest to highest is debug, info, notice, warning, err, crit, alert or emerg.


    # NOTE


    To exclude log messages from a facility in rsyslog.conf, specify a priority of
    none, as shown at in Example 7-1.


    When you put a specific priority in a selector, rsyslog sends messages with that
    priority and all higher priorities to the destination that on line. Therefore,
    in Example 7-1, the *.info for the line actually catches log messages and puts
    them into /var/log messages because info is relatively low priority.


    # Extended Syntax


    As previously mentioned, the syntax of rsyslog extends the traditional syslog
    syntax. The configuration extensions are directives and usually begin with a $.
    One of the most common extensions allows you to load additional configuration
    files. Check your rsyslog.conf for a directive like, which allows rsyslog to load
    all .conf files in /etc/rsyslog.d into the configuration:


    ```

    $IncludeConfig /etc/rsyslog.d/*.conf

    ```


    Most of the other extended directives are fairly self-explanatory. For example,
    these directives deal with users and permissions:


    ```

    $FileOwner syslog

    $FileGroup adm

    $FileCreateMode 0640

    $DirCreateMode 0755

    $Umask 0022

    ```


    # NOTE


    Additional rsyslog configuration file extensions define output templates and channels.
    If you need to use them, the rsyslog(5) manual page is fairly comprehensive, but
    the web-based documentation is more complete.


    # Troubleshooting


    One of the easiest ways to test the system logger is to send a log message manually
    with the logger command, as shown here:


    ```

    $ logger -p daemon.info something bad happened

    ```


    Little can go wrong with rsyslog. The most common problems occur when a configuration
    doesn''t catch a facility or priority or when logs fill their disks. Distributions
    automatically fill the files in /var/log with automatic invocations of logrotate
    or a similar utility, but if too many messages arrive in a brief period, you can
    still fill the disk or end up with a high load system.


    # NOTE


    The logs caused by rsyslog are not the only ones recorded by various pieces of
    the system. We discussed the startup logs captured by systemd and Upstart in Chapter
    6, but you will find many other sources, such as the Apache Web server, which
    normally records its access and error logs. To find those logs, see the server
    configuration'
  merge: -1
