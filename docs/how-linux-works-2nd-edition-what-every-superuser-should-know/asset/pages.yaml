    where higher networks (such as the Internet) come in. By convention, each Ethernet
    network is usually an Internet subnet. Even though a frame can leave one physical
    network, a router can take the data out of a frame, repackage it, and send it
    to a host on a different physical network, which is exactly what happens on the
