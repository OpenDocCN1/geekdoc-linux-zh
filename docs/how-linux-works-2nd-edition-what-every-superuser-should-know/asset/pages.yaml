  md: '# 2.20 Running Commands as the Superuser


    Before going any further, you should learn how to run commands as the superuser.
    You probably already know you can run the su command and enter the root password
    to start a root shell. This practice works, but it has certain disadvantages:


    +   - You have no record of system-altering commands.

    - You have no record of the users who performed system-altering commands.

    - You don''t have access to your normal shell environment.

    - You have to enter the root password.


    # 2.20.1 sudo


    Most distributions use a package called sudo to allow administrators to run commands
    as root when they are logged in as themselves. For example, Chapter 7, you''ll
    learn about using vipw to edit the /etc/passwd file. You can do it like this:


    ```

    $ sudo vipw

    ```


    When you run this, sudo logs this action with the syslog service under the local2
    facility. You''ll also learn more about system logs in Chapter 7.


    # 2.20.2 /etc/sudoers


    Of course, the system doesn''t let just run any command as the superuser; you
    must configure the privileged users in /etc/sudoers. The sudo package has many
    options (that you''ll never use), which makes the syntax in /etc/sudoers somewhat
    complicated. For example, this file gives user1 and user2 permission to run any
    command without having to enter a password:


    ```

    User_Alias ADMINS = user1, user2

    ```


    ```

    ADMINS ALL = NOPASSWD: ALL

    ```


    ```

    root ALL=(ALL) ALL

    ```


    The first line defines an ADMINS alias with the two users


    The root ALL=(ALL) ALL simply means that the superuser may use sudo to run any
    command on any host. The extra (ALL) means that the superuser may also run commands
    as any user. You can extend this privilege to the ADMINS users by adding (ALL)
    to the /etc/sudoers line, as shown at ①.


    ```

    ADMINS ALL = (ALL)① NOPASSWD: ALL

    ```


    > NOTE


    Use the visudo command to edit /etc/sudoers. This command checks for syntax errors
    after you save the file.'
