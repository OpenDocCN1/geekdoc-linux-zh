    # 14.4 The Future of X


    As you are reading the preceding discussion, you may have gotten the feeling that
    X is a really old system that''s been poked at a lot in order to get it to do
    new tricks. You wouldn''t be far off. The X Window System was first developed
    in the 1980s. Although its evolution over the years has been significant (flexibility
    was an important part of its original design), you can push the architecture only
    so far.


    One sign of the age of the X Window System is that the server itself supports
    an extremely large number of libraries, many for backward compatibility. But perhaps
    significantly, the idea of having a server manager clients, their windows, and
    as an intermediary for the window manager has become a burden on performance.
    It''s faster to allow applications to render the contents of their windows within
    the display memory, with a lighter-weight window manager, called a compositing
    window manager, to arrange the windows and do minimal management of the display.


    A new standard stands on this idea, Wayland is a protocol that defines how clients
    talk to the compositing window manager. Other pieces include input device management
    and an X-compatibility system. As a protocol, Wayland also maintains the indeed
    transparency. Many pieces of the Linux desktop now support Wayland, such as GNOME
    and KDE.


    But Wayland isn''t the only alternative to X. As of writing, another project,
    Mir, has similar goals, though its architecture takes a somewhat different approach.
    At some point, there will be widespread adoption of at least one system, which
    may or may not be one of these.


    These developments are significant because they won''t be limited to the Linux
    desktop. Due to its poor performance and gigantic footprint, the X Window System
    is not suitable for environments such as tablets and smartphones, so manufacturers
    have so far used alternative systems to drive embedded displays. However, standardized
    direct rendering can make for a more cost-effective way to support these.'
