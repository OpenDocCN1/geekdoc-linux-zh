  md: '# Using the CIFS Filesystem


    If you need frequent, regular access to files on a Windows server, you can attach
    a share directly to your system with mount. The command syntax is shown below.
    Notice the use of SERVER:sharename rather than the normal \\SERVER\sharename.


    ```

    # mount -t cifs SERVER:sharename mountpoint -o user=username,pass=password

    ```


    In order to mount like this, you must have the Common Internet File System (CIFS)
    utilities available for Samba. Most distributions offer these as a separate package.


    # 12.5 NFS Clients


    The standard for file sharing Unix systems is NFS; there are many different versions
    of NFS for different scenarios. You can serve NFS over TCP and UDP, with a large
    number of authentication and encryption techniques. Because there are so many
    options, NFS can be a big topic, so we''ll just stick to the basics of NFS clients.


    To mount a remote directory on a server with NFS, use the same syntax as for mounting
    a CIFS directory:


    ```

    # mount -t nfs server:directory mountpoint

    ```


    Technically, you don''t need the -t nfs option because mount should figure this
    out for you, but you may want to investigate the options in the nfs(5) manual.
    You''ll find several different options for security using the sec option. Many
    administrators on small, closed networks use host-based access control. However,
    more sophisticated methods, such as Kerberos-based authentication, require additional
    configuration on other parts of your system.


    When you find you''re making frequent use of filesystems over a network, set up
    the automounter so that your system will mount filesystems when you actually try
    to use them in order to prevent problems with dependencies on boot. The traditional
    tool is called automount, with a newer version called amd, but much of this is
    now being supplanted by the automount type in system.


    # 12.6 Network File Service Options and Limitations


    Setting up an NFS server to share files to Linux machines is more complicated
    than using a simple NFS client. You need to run the server daemons (mountd and
    nfsd) and set up the /etc/exports file to reflect the directories that you''re
    using. However, we won''t configure NFS servers because storage over a network
    is often met by simply purchasing a NAS device to handle it. Many of these devices
    are Linux based, so they''ll naturally have NFS server support. Vendors add to
    their NAS devices by offering their administration tools to take the pain out
    of tedious tasks as setting up RAID configurations and cloud backups.


    Speaking of cloud, another network file system is cloud storage. This can be handy
    when you need the extra storage that comes with automatic backups and don''t mind
    an extra hit on performance. It''s especially useful when you don''t need the
    service for a long time or don''t need to access it very much. You can manually
    mount Internet storage as you would NFS.


    Although NFS and other file-sharing systems work well for general use, dont expect
    great performance when you''re streaming audio or video, because you''re reading
    data in large, predictable chunks that don''t require back-and-forth communication
    between the file server and its client. As long as the network is fast enough
    and the client has enough memory, a server can supply data as needed.'
