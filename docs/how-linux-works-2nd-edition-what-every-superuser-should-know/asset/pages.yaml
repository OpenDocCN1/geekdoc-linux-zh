  md: '# Chapter 7. System Configuration: Logging, System Time, Batch Jobs, and Users


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_124_0.png)


    When you first look in the /etc directory, you might feel a bit overwhelmed. Although
    most of the files that you see affect system''s operations to some extent, a few
    are fundamental.


    The subject material in this chapter covers the parts of the system that make
    the infrastructure discussed in Chapter 4 available to the user-level tools covered
    in Chapter 2.


    +   - Configuration files that the system libraries access to get server and user
    information

    - Server programs (sometimes called daemons) that run when the system boots

    - Configuration utilities that can be used to tweak the system programs and configuration
    files

    - Administration utilities


    As previous chapters, there is virtually no networking material here because the
    network is a separate building block of /etc. In Chapter 9, you''ll see how the
    network fits in.


    # 7.1 The Structure of /etc


    Most system configuration files on a Linux system are found in /etc. Historically,
    each program had one or more configuration files there, and there are so many
    packages on a Unix system, /etc would accumulate files.


    There were two problems with this approach: It was hard to find particular configuration
    files on a running system, and it difficult to maintain a system configured this
    way. For example, if you wanted to change the system logger configuration, you''d
    have to edit /etc/syslog.conf. After your change, an upgrade to your distribution
    could wipe out your customizations.


    The trend for many years now has been to place system configuration files into
    subdirectories under /etc, as you''ve already seen for the boot directories (/etc/init
    for Upstart and /etc/systemd for systemd). There are still a few configuration
    files in /etc, but for the most part, if you run -F /etc, you''ll see that most
    of them are now subdirectories.


    To solve the problem of overwriting configuration files, you can now place configurations
    in separate files in the configuration subdirectories, such as in /etc/grub.d.


    What kind of configuration files are found in /etc? The basic guideline is customizable
    configurations for a single machine, such as user information (/etc/passwd) and
    network details (/etc/network), go into /etc. However, general application details,
    such as a distribution''s defaults for a user interface, don''t belong in /etc.
    And you''ll often find that noncustomable system configuration files may be found
    elsewhere, as with the prepaid system unit files in /usr/lib/systemd.


    You''ve already seen the configuration files that pertain to booting. Now we''ll
    look at a typical system service and how to view and specify its configuration.'
  merge: -1
  pgno: 124
