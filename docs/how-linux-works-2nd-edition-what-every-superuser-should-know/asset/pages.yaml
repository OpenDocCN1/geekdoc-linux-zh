  md: '# Chapter 12. Moving Files Across the Network


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_228_0.png)


    This chapter surveys options for moving and sharing files between machines on
    a network. We''ll start by looking at some ways to copy files other than the scp
    and sftp utilities that you''ve already seen. Then we''ll briefly look at true
    file sharing, where you attach a directory on one machine to another machine.


    This chapter describes some alternative ways to transfer files because not every
    file transfer is simple. Sometimes you need to provide quick, temporary access
    to machines that you don''t know much about, sometimes you need to efficiently
    maintain copies of large directory structures, and sometimes you need more constant
    access.


    # 12.1 Quick Copy


    Let''s say you want to copy a file (or files) from your machine to another one
    on your network, and you don''t care about copying it back or to do anything fancy.
    You just want to do it quickly. There''s a convenient way to do this with Python.
    Go to the directory containing the file(s) and run


    ```

    $ python -m SimpleHTTPServer

    ```


    This starts a web server that makes the directory available to any browser on
    the network. It usually runs on port 8000, so if the machine you run this on is
    at 10.1.2.4, go to http://10.1.2.4:8000$ on the destination and you''ll be able
    to grab what you need.


    # 12.2 rsync


    If you want to move an entire directory structure around, you can do so with rsync
    -r—or if you need a little more performance, tar in a pipeline:


    ```

    $ tar cBf - directory | ssh remote_host tar XBvp -

    ```


    These methods get the job done but are not flexible. In particular, if the transfer
    completes, the remote host may not have an exact copy of the directory. If directory
    exists on the remote machine and contains some extraneous files, those persist
    after the transfer.


    If you need to do this sort of thing (especially if you plan to automate the process),
    use a dedicated synchronizer system. In Linux, rsync is the standard synchronizer,
    offering good performance and many useful ways to perform transfers. We''ll cover
    some of the essential rsync operation modes and look at some of its peculiarities


    # 12.2.1 rsync Basics


    To get rsync working between two hosts, the rsync program must be installed on
    both the source and destination, and you''ll need a way to access one from the
    other. The easiest way to transfer files is to use a remote shell account, and
    we''ll assume you want to transfer files using SSH access. However,'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'remember that rsync can be handy even for copying files and directories between
    locations on a single machine, such as from one filesystem to another.


    On the surface, the rsync command is not much different from scp. In fact, you
    can run rsync with the same arguments. For example, to copy a group of files to
    your home directory at host, enter


    ```

    $ rsync file file2 ... host:

    ```


    On any modern system, rsync assumes that you''re using SSH to connect to the remote
    host.


    Beware of this error message:


    ```

    rsync not found

    rsync: connection unexpectedly closed (0 bytes read stream (far)

    rsync error: error in rsync protocol data (code 12) at io.c(165)

    ```


    This notice says that your remote shell can''t find rsync on its system. If rsync
    isn''t in the remote path but on the system, use --rsync-path=path to manually
    specify its location.


    If your username is on the remote host, user@ to the hostname, where is your username
    on host:


    ```

    $ rsync file file2 ... user@host:

    ```


    Unless you supply extra options, rsync copies only files. In fact, if you just
    specify the source described as far and supply a directory dir as an argument,
    you will see this message:


    ```

    skipping directory dir

    ```


    To transfer entire hierarchies—with symbolic links, permissions, modes, and devices—use
    the -a option. Furthermore, if you want to copy to some place other than your
    home directory on the remote host, place this destination after the remote host,
    like this:


    ```

    $ rsync -a dir host:destination_dir

    ```


    Copying directories is tricky, so if you want to know exactly what will happen
    when you transfer the files, use the -n option to operate in "dry run" mode—that
    is, to run a trial without copying any files. The -v option is for verbose mode,
    which shows details about the transfer and the files involved:


    ```

    $ rsync -nva dir host:destination_dir

    ```


    The output looks like this:


    ```

    building file list ... done

    ml/nftrans/nftrans.html

