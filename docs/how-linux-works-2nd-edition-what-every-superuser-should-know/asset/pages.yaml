  md: '# 5.8.1 MBR Boot


    In addition to partition information described in 4.1 Partitioning Disk Devices,
    the Master Boot Record (MBR) includes a small area (441 bytes) that the PC BIOS
    loads and executes its Power-On Self-Test (POST). Unfortunately, there is too
    little space to house almost any loader, so additional space is necessary, resulting
    in what is called a multi-stage boot loader. In this initial piece of code in
    the MBR does nothing but load the rest of the boot loader. The pieces of boot
    loader are usually stuffed into the space between the MBR and the first partition
    on the disk.


    Of course, this isn''t terribly secure because anything can overwrite the code
    there, but most boot loaders do it, including GRUB installations. In this edition,
    this won''t work with a GPT-partitioned disk using the BIOS to boot the GPT table
    information in the area after the MBR. (GPT leaves the traditional MBR alone for
    backward compatibility.)


    The workaround for GPT is to create a small partition BIOS boot partition with
    a special UUID to give the full boot loader place to reside. But GPT is normally
    used with UEFI, the traditional BIOS, which leads us to the UEFI boot method.


    # 5.8.2 UEFI Boot


    PC manufacturers and software companies realized that the traditional BIOS is
    severely limited, so they decided to develop a replacement Extensible Firmware
    Interface (EFI). EFI took a while to come to most PCs, but now it''s finally common.
    The current standard is Unified UEFI (UEFI), which features such as a built-in
    shell and the ability to read partition tables and navigate filesystems. The GPT
    partitioning is part of the UEFI standard.


    Booting is different on UEFI systems and, for the most, much easier to understand.
    Rather than executing boot code outside of a filesystem, there is a special filesystem
    called the EFI System Partition (ESP), which contains a directory named efi. Each
    boot loader has its own identifier and a corresponding subdirectory, such as emicrosoft,
    efi/apple, or efi/grub. A boot loader has an .efi extension and resides in one
    of these subdirectories, with other supporting files.


    The ESP differs from the BIOS boot partition described in 5.8.1 MBR Boot and has
    a different UUID.


    There''s a wrinkle, though: you can''t just put boot loader into the ESP because
    code was written for the BIOS interface. Instead, you must provide a boot loader
    for UEFI. For example, when using GRUB, you have to install the UEFI version of
    GRUB rather than the BIOS version. In addition, you must "announce" new boot loaders
    to the firmware.


    And, as mentioned in 5.6 UEFI Secure Boot Problems, we have the "secure boot"
    issue.


    # 5.8.3 How GRUB Works


    Let''s wrap up our discussion of GRUB by looking at how it does its:


    +   1. The PC BIOS or firmware initializes the hardware and searches for its boot-order
    storage devices for boot code.

    2. Upon finding the boot code, the BIOS/firmware loads and executes it. This is
    where GRUB begins.

    3. The GRUB core loads.

    4. The core initializes. At this point, GRUB can now access disks and filesystems.

    5. GRUB identifies its boot partition and loads a configuration.

    6. GRUB gives the user a chance to change the configuration.'
  merge: -1
