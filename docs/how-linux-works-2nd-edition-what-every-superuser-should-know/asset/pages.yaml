    # 12.4.3 Passwords


    In general, you should only allow access to your Samba server with password authentication.
    Unfortunately, the basic password system in Unix is different from that of Windows,
    unless you specify clear-text passwords or authenticate with a Windows server,
    you must set up an alternative password system. This section shows how to set
    up an alternative password system using Samba''s Tidal Database (TDB) backend,
    which is appropriate for small networks.


    First, use these entries in your smb.conf [global] section to define the Samba
    password database characteristics:


    ```

    # use the tdb for Samba to enable encrypted passwords

    security = user

    passdb backend = tdbsam

    obey pam restrictions = yes

    smbpasswd file = /etc/samba/passwd_smbd

    ```


    These lines allow you to manipulate the Samba password database with the smbpasswd
    command. The obey pam parameter ensures that any user changing their password
    with the smbpasswd command must obey any rules that PAM enforces for normal password
    changes. For the passdb backend parameter, you can add an optional pathname for
    the TDB file after a colon; for example, tdbsam:/etc/samba/private/passwd.td.


    # NOTE


    If you have access to a Windows domain, you can use security = domain to make
    Samba the domain''s usernames and eliminate the need for a password database.
    However, in order for domain users to access the machine running Samba, each domain
    user must have a local account with the same username on the machine running Samba.


    # Adding and Deleting Users


    The first thing you need to do in order to get a Windows user access to your Samba
    server is to add the user to the password database with smbpasswd -a command:


    ```

    # smbpasswd -a username

    ```


    The username parameter to the smbpasswd command must be a valid username on your
    Linux system. Like the regular system''s password command, smbpasswd asks you
    to enter the new user''s password twice. If the password passes...


    To remove a user, use the -x option to smbpasswd:


    ```

    # smbpasswd -x username

    ```


    To temporarily deactivate a user instead, use the -d option; the -e option will
    reenable the user:


    ```

    # smbpasswd -d username

    ```


    ```

    # smbpasswd -e username

    ```'
