    # 4.4 Looking Forward: Disks and User Space


    In disk-connected systems on Unix, the boundaries between swap space and the kernel
    can be difficult to characterize. As you''ve seen, the kernel handles raw I/O
    from the devices, and user-space tools use the block I/O through file devices.
    However, user space typically uses the block I/O only for initializing operations
    such as partitioning, file-system creation, and swap space creation. In normal
    use, user space uses only the filesystem that the kernel provides on top of the
    block I/O. Similarly, the kernel handles most of the tedious details when dealing
    with swap in the virtual memory system.


