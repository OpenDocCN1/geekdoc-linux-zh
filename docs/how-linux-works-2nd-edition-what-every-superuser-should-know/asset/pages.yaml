    # 7.5 Setting the Time


    Unix machines depend on accurate timekeeping. The kernel maintains the system
    clock, which is the clock that is consulted when you run commands like date. You
    can also set the system clock using the date command, but it is a bad idea to
    do so because you''ll never get the exact right. Your system clock should be as
    close to the correct time as possible.


    PC hardware has a battery-backed real-time clock (RTC). The RTC isn''t the best
    in the world, but it''s better than nothing. The kernel sets its time on the RTC
    at boot time, and you can reset the system clock to the current hardware time
    with hwclock. Keep your hardware in Universal Coordinated Time (UTC) in order
    to avoid trouble with time zone or daylight savings corrections. You can set the
    RTC to your kernel''s UTC clock using this command:


    ```

    # hwclock --htcsys --utc

    ```


    Unfortunately, the kernel is ever worse at keeping time than the RTC, and because
    Unix machines stay for months or years on a single boot, they need to develop
    time drift. Time drift is the difference between the kernel time and the true
    time (as defined by an atomic clock or very accurate clock).


    You should not try to fix the drift with hwclock time-based systems can get lost
    or merged. You could use a utility like adjtimex to smoothly update the clock,
    but it''s best to keep your system with a correct network daemon (see 7.5.2 Network
    Time).


    # 7.5.1 Kernel Time Representation and Time Zones


    The kernel''s clock represents the current time as the number of seconds since
    12:00 midnight on January 1, 1970, UTC. To see this at the moment, run:


    ```

    date +s

    ```


    To convert this into something that humans can read, user-space programs change
    to local time and compensate for daylight savings and other circumstances (such
    as being in India). The local time is controlled by the /etc/localtime (Don''t
    bother to look at it; it''s a binary file).


    The time zones on your system are in /usr/share/zoneinfo. You''ll find that this
    directory contains a list of time zones and aliases for time zones. To set your
    system time manually, copy one of the files in /usr/share/zoneinfo to /etc/localtime
    (make a symbolic link) or change with your distribution''s'
