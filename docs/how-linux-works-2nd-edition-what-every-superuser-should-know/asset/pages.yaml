    # 7.5.2 Network Time


    If you are permanently connected to the Internet, you can run a Network Time Protocol
    (NTP) daemon to maintain the time using a remote server. Many distributions have
    built-in support for NTP daemon, but it may not be enabled by default. You might
    need to install an ntp package to get to work.


    If you need to configure it by hand, you''ll find help on the main web page at
    http://www.ntp.org/, or if you''re not read through the nodes of documentation
    here, do this:


    +   - Find the closest NTP server from your ISP or from the ntp.org page.

    - Put that time server in /etc/ntp.conf.

    - Run ntpdate server at boot time.

    - Run ntpd at boot time, after the ntpdate command.


    If you doesn''t have a permanent Internet connection, you can use a daemon like
    chronyd to maintain the time during disconnections.


    You can also set your hardware clock based on the network time in order to help
    your system maintain coherence when it boots. (Many distributions do this automatically.)
    To do so, set your system time from the network with ntpdate (or ntpd), then run
    the command you saw back in Note:


    ```

    # hwclock --systohc --utc

    ```


    # 7.6 Scheduling Recurring Tasks with cron


    The Unix service runs repeatedly on a fixed schedule. Most experienced administrators
