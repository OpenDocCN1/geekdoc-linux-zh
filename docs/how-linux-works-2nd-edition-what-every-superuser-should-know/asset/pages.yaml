  md: '# 9.14.1 TCP Ports and Connections


    TCP provides multiple network applications on one machine by means of network
    ports. A port is just a number. If an IP address is the postal address of an apartment
    building, a port is like a mailbox number—it''s a further subdivision.


    When using TCP, an application opens a connection (not to be confused with NetworkManager
    connections) between one port on its machine and a port on a remote host. For
    example, an application such as a web browser can open a connection between ports
    36406 on its own machine and port 80 on a remote host. The application''s point
    of view, port 36406 is the local port and port 80 is the remote host.


    You can identify a connection by using a pair of IP addresses and port numbers.
    To view the connections currently open on your machine, use netstat. Here''s an
    example of how TCP connects: The -n option disables hostname (DNS) resolution,
    and the -t limits the output to TCP.


    ```

