    # 6.6 System V init


    System V init implementation on Linux during the early days of Linux; its core
    idea is to support an orderly boot to runlevels with a carefully sequenced startup.
    System V is uncommon on most desktop environments, you may install System V init
    in Red Hat Linux, as well as in embedded Linux environments such as routers and
    phones.


    There are two components to a typical System V init installation: a central configuration
    file and a large set of boot scripts managed by a symbolic link farm. The configuration
    file /etc/initab is where it all starts. If you have System V init, look for a
    line like the following in your initab file:


    ```

    id:initdefault:

