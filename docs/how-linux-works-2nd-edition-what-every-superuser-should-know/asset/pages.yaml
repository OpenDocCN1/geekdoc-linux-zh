- img_proc: true
  md: '# Logging: Past and Future


    The syslog service has evolved over time. For example, there was once a daemon
    called klogd that trapped kernel messages for syslogd. (These messages are the
    ones you see with the dmesg command.) This capability has been folded into rsyslog.


    It''s a near certainty that Linux logging will change in the future. Unix system
    logging has never had a true standard, but efforts are underway to change that.


    # 7.3 User Management Files


    Unix systems allow for multiple independent users. At the kernel level, users
    are simply numbers (user IDs), but because it is easier to remember a name than
    a number, you''ll normally work with usernames (or login names) instead of user
    IDs when managing Linux. Usernames exist only in user space, so any program that
    works with a username needs to be able to map the username to a user ID if it
    wants to refer to a user talking to the kernel.


    # 7.3.1 The /etc/passwd File


    The plaintext file /etc/passwd maps usernames to user IDs. It looks something
    like this:


    ```

    root:x:0:0:/root:/bin/sh

    daemon*:x:1:daemon:/usr/bin:/bin/sh

    bin*:2:2:bin:/bin/sh

    sys*:3:3:sys:/dev:/bin/sh

    nobody*:65534:65534:nobody:/home:/false

    user:x:119:1000:J. Random User:/home/user:/bin/sh

    beazley:x:143:1000:David Beazley:/home/beazley:/bin/bash

    ```


    Each line represents one user and seven fields separated by colons. The fields
    are as follows:


    +   - The username.


    +   - The user''s encrypted password. On most Linux systems, the password is not
    actually stored in the passwd file, but in the shadow file (see 7.3.3 The /etc/shadow
    File). The shadow file is similar to that of passwd, but normal users do not have
    read permission for shadow. The second field in shadow is the encrypted password,
    and it looks like an unreadable garbage, such as dlCWeIB/oppc. (Unix passwords
    are never stored as clear text.)


    +   - An x in the second passwd field indicates that the encrypted password is
    stored in the shadow file. A star (*) indicates the user cannot log in, or if
    the field is blank (that is, you two colons in a row, like : :), no password is
    required to log in. (Beware of blank passwords. You should never have a user without
    a password.)


    +   - The user ID (UID), which is the user''s representation in the kernel. You
    can have multiple, but doing this will confuse you, and your software may mix
    them up as well. Keep the user ID unique.


    +   - The group ID (GID). This should be one of the normed entries in the /etc/group
    file. Groups determine permissions and limit what else. This is also called the
    user''s primary group.


    +   - The user''s real name (often called the GECOS field). You''ll sometimes
    find commas in this field, denoting room and telephone numbers.


    +   - The user''s home directory.'
  merge: -1
