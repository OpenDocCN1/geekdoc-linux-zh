  md: '# Security Implications


    Because the Linux kernel handles all user switches (and as a result, file access
    permissions) through setuid and subsequent system calls, systems developers and
    administrators must be extremely careful with two things:


    +   - The programs that have setuid permissions

    - What those programs do


    If you make a copy of the system bash that is setuid root, any local user can
    execute it and have complete run of the system. It''s really simple. Furthermore,
    even a special-purpose program that is setuid root can cause a danger if it has
    bugs. Exploiting weaknesses in programs running as root is a primary method of
    system intrusion, and there are too many such to count.


    Because there are so many ways to break into a system, preventing intrusion is
    a multifaceted affair. One of the most essential ways to keep unwanted activity
    off your system is to enforce user authentication with your usernames and passwords.


    # 7.9 User Identification and Authentication


    A multius system must provide basic support for security in terms of identification
    and authentication. The identification portion of security answers the question
    of who users are. The authentication pieces users to prove that they are who they
    say are. Finally, authorization is used to define and limit what users are allowed
    to do.


    When it comes to user identification, the Linux kernel knows only the numeric
    IDs for process and file ownership. The kernel knows authorization rules for how
    to run setuid executables and how user IDs may run the setuid() system of calls
    to change identity from one to another. However, the kernel does not know anything
    about authentication: usernames, passwords, and so on. Practically relating to
    authentication happens in user space.


    We discussed the mapping between user IDs and passwords in 7.3.1 The /etc/passwd
    File; now we will explain how processes access this mapping. We begin with an
    simplified case, in which a process wants to know its username (the name corresponding
    to the effective user ID). On a traditional Unix system, a process could do something
    like this to get its username:


    +   1. The process asks the kernel for its effective user ID using the getuid()
    system call.

    2. The process opens the /etc/passwd file and starts reading at the beginning.

    3. The process reads a line of the /etc/passwd file. If there is nothing left
    to read, the process has failed to find the username.

    4. The process parses the line into fields (breaking out everything between the
    colons). The third field is the user ID for the current line.

    5. The process compares the ID from Step 4 to the ID from Step 1. If they''re
    identical, the first field in Step 4 is the desired username, and the process
    can stop searching and use this name.

    6. The process moves on to the next line in /etc/passwd and goes back to Step
    3.


    This is a procedure that''s usually much more complicated in reality.


