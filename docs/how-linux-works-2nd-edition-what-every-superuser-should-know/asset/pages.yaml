    # 12.2.3 Using the Trailing Slash


    Be particular when specifying a directory as the source in an rsync command line.
    Consider the basic command that we''ve been working with so far:


    ```

    $ rsync -a dir host:dest_dir

    ```


    Upon completion, you will have a directory inside dest_dir on host. Figure 12-1
    shows an example of how rsync normally handles a directory with files named a
    and b. However, adding a slash (/) significantly changes the behavior:


    ```

    $ rsync -a dir/ host:dest_dir

    ```


    Here, rsync copies everything inside dest_dir on host without accidentally creating
    a dir on the destination host. Therefore, you can think of a transfer of dir/
    as an operation similar to cp dir/* dest_dir on the local filesystem.


    For example, say you have a directory containing the files a and b (dir/a and
    dir/b). You run the trailing-slash version of the command to transfer them to
    the dest_dir directory on host:


    ```

    $ rsync -a dir/ host:dest_dir

    ```


    When the transfer completes, dest_dir contains copies of a and b but not dir.
    However, if you had omitted the trailing / dir, dest_dir would have gotten a copy
    of dir with a and b inside. Then, as a result of the transfer, you''ve have files
    and directories named dest_dir/a and dest_dir/b on the remote host. Figure 12-1
    illustrates how rsync handles the directory structure from Figure 12-1 when using
    a trailing slash.


    When transferring files and directories to a remote host, accidentally adding
    a / after a path would normally be nothing more than a nuisance; you could go
    to the remote host, add the dir directory, and put all of the transferred items
    back in dir. Unfortunately, you must be careful to avoid combining the trailing
    / with the --delete option, because you can easily remove unrelated files this
    way.


