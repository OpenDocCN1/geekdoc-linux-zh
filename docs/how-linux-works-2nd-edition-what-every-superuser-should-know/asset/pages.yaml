    # 9.16 Understanding DHCP


    When you set a network host to get its configuration automatically from the network,
    you''re telling it to use the Dynamic Host Configuration Protocol (DHCP) to get
    an IP address, subnet mask, default gateway, and DNS servers. Aside from having
    to enter these parameters by hand, DHCP has other advantages for a network administrator,
    such as preventing IP address conflicts and minimizing the impact of network changes.
    It''s very rare to see a modern network that doesn''t use DHCP.


    For a host to get its configuration with DHCP, it must be able to send messages
    to a DHCP server on its connected network. Therefore, as the one in 9.3 The Internet
    Layer), the router usually acts as DHCP server.


    > NOTE


    When making an initial DHCP request, a host doesn''t even know the address of
    a DHCP server, so it broadcasts the request to all hosts (usually all hosts on
    its physical network).


    When a machine asks a DHCP server for an IP address, it''s really asking for a
    lease on an address of time. When the lease is up, a client can ask to renew the
    lease.


    # 9.16.1 Linux DHCP Client


    Although there are many kinds of network manager systems, nearly all use the Internet
    Software Consortium (ISC) dhcp program to do the actual work. You can use dhcp
    by hand on the command line, but you must remove any default gateway route. To
    run the test, simply specify the network interface name (here, it''s eth0):


    ```

