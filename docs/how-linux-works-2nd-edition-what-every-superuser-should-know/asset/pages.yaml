  md: '# Chapter 3. Devices


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_41_0.png)


    This chapter is a basic tour of the kernel-provided device infrastructure in a
    functioning Linux system. Throughout the history of Linux, there have been many
    changes to how the kernel presents devices to the user. We''ll begin by looking
    at the traditional system of device files to see how the kernel provides device
    configuration information through sysfs. Our goal is to be able to extract information
    about the devices on a system in order to understand few rudimentary operations.
    Later chapters will cover interacting with specific kinds of devices in greater
    detail.


    It''s important to understand how the kernel interacts with user space when presented
    with new devices. The udev system enables user-space programs to automatically
    configure and use new devices. You''ll see the basic workings of how the kernel
    sends a message to a user-space process through udev, as well as what the process
    does with it.


    # 3.1 Device Files


    It is easy to manipulate most devices on a Unix system which the kernel presents
    most of the device I/O interfaces to user processes as files. These device files
    are sometimes called device nodes. Not all programmer can use regular operations
    to work with a device, but some devices are also accessible to standard programs
    like cat, so you don''t have to be a programmer to use a device. However, there
    is a limit to what you can do with a file interface, not all devices or device
    capabilities are accessible with standard file I/O.


    Linux uses the same design for device files as other Unix flavors. Device files
    are in the /dev directory, and running ls /dev reveals many few files in /dev.
    How do you work with devices?


    To get started, consider this:


    > $ echo blah blah > /dev/null


    As command with redirected output, this sends some stuff from the standard output
    to a file. The file is /dev/null, and the kernel decides what to do with any data
    written to it. In the case of /dev/null, the kernel simply ignores the inputs
    and throws away the data.


    To identify a device and view its permissions, use ls -l:


    Example 3-1. Device files


    ```

    $ ls -l

    brw-rw---- 1 root disk 8, 1 Sep 08:37 sda1

    crw-rw-rw-- 1 root 1, 3 Sep 08:37 null

    prw-sr-r-- 1 root 0 Mar 3 19:17 fdata

    crw-rw-rw-- 1 root 0 Dec 18 07:43 log

    ```


    Note the first character of each line (the first line of character''s mode) in
    Example 3-1. If this character is b, c, p or s, the file is a device. These letters
    stand for block, character, pipe, and socket, respectively, as described in more
    detail below.


    # Block device


    +   - Programs access from a block device in fixed chunks. The sda1 in the preceding
    example is a disk device, a type of block device. Disks can be easily split into
    blocks of data. Because a block device''s'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'total size is fixed and easy to index, processes have random access to any
    block in the device with the help of the kernel.


    # Character device


    +   - Character devices work with data streams. You can only read characters from
    write characters to character devices, as previously demonstrated with /dev/null.
    Character devices don''t have a size; when you read from or write to one, the
    kernel usually performs a read or write operation on the device. Printers directly
    attached to your computer are represented by character devices. It''s important
    to note that character device interaction, the kernel cannot back up and reexamine
    the data stream after it has passed to data or process.


    # Pipe device


    +   - Named pipes are like character devices, with another process at the other
    end of the I/O stream instead of a kernel driver.


    # Socket device


    +   - Sockets are special-purpose interfaces that are frequently used for interprocess
    communication. They''re often found outside of the /dev directory. Socket files
    represent Unix domain sockets; you''ll learn more about them in Chapter 10.


    The numbers before the first two lines of Example 3-1 are the major and minor
    numbers that help identify the device. Similar devices usually have the same major
    number, such as sda3 and sdb1 (both of which are hard disk partitions).


    # NOTE


    Not all devices have device files because the block and character device I/O interfaces
    are not appropriate in all cases. For example, network interfaces do not have
    device files. It is theoretically possible to interact with a network interface
    using a single character device, but because it would be exceptionally difficult,
    the kernel uses other I/O interfaces.


    # 3.2 The sysdev Device Path


    The Unix /dev directory is a convenient way for user processes to reference and
    interface with devices supported by the kernel, but it''s also a very simplistic
    scheme. The name in dev tells you a little about the device, not a lot. Another
    problem is that the kernel assigns devices in the order in which they are found,
    so a device may have a different name after reboots.


    To provide a uniform interface for attached devices based on their hardware attributes,
    the Linux kernel offers the sysfs through a system of files and directories. The
    base path for devices is /sys/devices. For example, the SATA disk at /dev/sda
    has the following path in sysfs:


    ```

    /sys/devices/pci0000:0000:01f.2/host0/target0:0:0:0:0:0/block/sda

    ```


    As you see, this path is quite long compared with the /dev/sda file which is also
    a directory. But you can''t really compare the two paths because they have different
    properties. The dev file is there so that processes can use the device, whereas
    the /sys/devices path is used to view information and manage the device. If you
    list the contents of a device path such as the preceding one, you''ll see something
    like following:


    | alignment_offs | discard_alignme | removabl | ueven |

    | et | nt | holders | e | size | t |'
