  md: '/tmp a smaller area for temporary files that you don''t care about. Any user
    may read to and /tmp, but the user may not have permission to access another user''s
    files. Many programs use this directory as a workspace. If something is extremely
    important, don''t put it in /tmp because distributions /tmp when the machine boots
    and some remove its old files periodically. Also, don''t let /tmp fill up with
    garbage because space is usually shared with something critical (like the rest
    of /, for example).


    /usr Although pronounced "user", this subdirectory has no user files. It contains
    a large hierarchy, including the block of Linux. Many of the directory names in
    /usr are the same as those in the root directory (/usr/bin and /usr/lib), and
    they hold the same type of files. (The reason that the root directory does not
    contain the complete system is perhaps historic—in the past, it was to keep space
    requirements low for the root)


    /var The variable subdirectory, which programs runtime information. System logging,
    user tracking, caches, and other files that system programs manage and are here.
    (You''ll notice a /var/tmp directory, but the system doesn''t wipe it on boot)


    #  2.19.1 Other Root Subdirectories


    There are a few other interesting subdirectories in the root directory:


    +   /boot contains kernel root files. These files pertain only to the very first
    stage of the Linux startup procedure; you won''t find information how Linux starts
    up its services in this directory. See Chapter 5 for about this.


    +   /media A base attachment point for removable media such as flash drives that
    are found in many distributions.


    +   /opt This may contain additional third-party software. Many systems don''t
    use /opt.


    #  2.19.2 The /usr Directory


    /usr directory may look relatively clean at first, but a quick look at /usr/bin
    and /usr/lib reveals that there''s a lot there; /usr is where most of the user-space
    programs and data reside. In addition to /usr/bin, /usr/sbin, and /usr/lib, /usr
    contains the following:


    +   /include Headers files used by the C compiler.


    +   /info Contains GNU manuals (which are 2.13 Getting Online Help).


    +   /local Where administrators can install their own software. Its structure
    should look like that of / and /usr.


    +   /man Contains manual pages.


    +   /share Contains files that work on other kinds of Unix machines with no loss
    of functionality. In the past, networks of machines would share this directory,
    but a true /share directory is becoming rare because there are no space issues
    on modern disks. Maintaining a /share directory is often just a pain. In any case,
    /man,/info, and some other subdirectories are found outside.


    #  2.19.3 Kernel Location


    On Linux systems, the kernel is normally in /vmlin or /boot/vmlin. A boot loader
    loads this file into memory and sets it in motion when the system boots.(You''ll
    find details on the boot loader in Chapter 5.)\OnceOnce boot loader runs and sets
    the kernel in motion, the main kernel file is no longer used by the running system.
    However, you''ll find many modules that the kernel can load and unload on demand
    during the course of normal system operation. Called loadable kernel modules,
    they are located under /lib/modules.


