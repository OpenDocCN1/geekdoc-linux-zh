  md: '# An Example Socket Unit and Service


    We''ll now look at an example, a simple network echo service that uses a socket
    unit. This is somewhat advanced material, and you may not really understand it
    until you''ve read the discussion of TCP, ports, and listening in Chapter 9 and
    sockets in Chapter 10, feel free to skip this and come back later.

    The idea behind this service is when a network client connects to the service,
    the service repeats anything that the client sends back to the client. The unit
    will listen on TCP port 22222. We''ll call it the echo service and start with
    a socket unit, represented by the following echo.socket unit file:


    ```

    [Unit]

    Description=echo socket

    [Socket]

    ListenStream=22222

    Accept=yes

    ```


    Note that there''s no mention of the service unit that this socket supports the
    unit file. So what is the corresponding service unit file?

    Its name is echo@service. The link is done by naming convention; if a service
    unit has the same prefix as a .socket file (in this case, echo), systemd knows
    to activate that service unit when there''s activity on the socket unit. In this
    case, systemd creates an instance of echo@service when there''s activity on echo@service.

    Here is the echo@service unit file:


    ```

    [Unit]

    Description=echo service

    [Service]

    ExecStart=/bin/cat

    StandardInput=socket

    ```


    NOTE


    If you don''t like the implicit activation of units based on the prefixes, or
    you need to create an activation mechanism between two units with different prefixes,
    you can use an explicit option in the unit defining resource. For example, use
    Socket=bar.socket inside foo.service to have bar.socket hand its socket to foo.service.

    To get this service unit running, you need to start the echo.socket unit here,
    like this:


    +   # systemctl start echo.socket


    Now you can test the service by connecting to your local port 22222. When the
    following telnet command connects, type anything and press ENTER. The service
    repeats whatever you typed back to you:


    ```

    $ telnet localhost 22222

    Trying 127.0.0.1...

    Connected to localhost.

    ```'
  merge: -1
