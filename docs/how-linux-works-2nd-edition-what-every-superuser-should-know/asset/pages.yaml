  md: '# 2.3.2 cp


    In its simplest form, cp copies files. For example, to copy file1 to file2, enter
    this:


    ```

    $ cp file1 file2

    ```


    To copy a number of files to a directory (folder) named dir, try this instead:


    ```

    $ cp file1 ... fileN

    ```


    # 2.3.3 mv


    The mv (move) command is like cp. In its simplest form, it renames a file. For
    example, to rename file1 to file2, enter this:


    ```

    $ mv file1 file2

    ```


    You can also use mv to move a number of files to a different directory:


    ```

    $ mv file1 ... fileN

    ```


    # 2.3.4 touch


    The touch command creates a file. If the file already exists, touch does not change
    it, but it updates the file''s modification time stamped with the ls -l command.
    For example, to create an empty file, enter this:


    ```

    $ touch file

    ```


    Then ls -l on that file. You should see output the following, where the date and
    time 1 indicate when you ran touch:


    ```

    $ ls -l file

    ```


    ```

    -rw-r--r-- 1 juser users 0 May 21 18:321 file

    ```


    # 2.3.5 rm


    To delete (remove) a file, use rm. After you remove a file, it''s gone from your
    system and generally cannot be deleted.


    ```

    $ rm file

    ```


    # 2.3.6 echo


    The echo command prints its arguments to the standard output:


    ```

    $ echo Hello again.

    ```


    ```

    Hello again.

    ```


    The echo command is very useful for finding expansions of shell globs (“wildcards”
    such as *) and variables (such as $HOME), which you will encounter later in this
    chapter.


    # 2.4 Navigating Directories


    Unix has a hierarchy that starts at /, sometimes called the root directory. The
    directory separator is the slash (/), not the backslash (\). There are several
    standard subdirectories in the root directory, such as /usr, as you''ll learn
    in 2.19 Linux Directory Hierarchy Essentials.'
