    # 6.4.2 systemd Dependencies


    Boot-time and operational dependencies are more complicated than they may seem
    at first strict dependencies are too inflexible. For example, imagine a scenario
    in which you want to display a login prompt after starting a database server,
    so you define a dependency from the login prompt to the database server. However,
    if the database server fails, the login prompt will also fail due to that dependency,
    and you won''t even be able to log in to your machine to fix it.


    Unix boot-time tasks are fairly fault tolerant and often fail without causing
    problems for standard services. For example, if a data disk for a system was removed
    without its /etc/fstab entry, the initial filesystem mount would fail. However,
    that failure typically wouldn''t seriously affect standard operating system operations.


    To accommodate the need for flexibility and fault tolerance, systemd offers a
    myriad of dependency types and styles. We''ll label them by their keyword syntax,
    but we won''t go into details about configuration syntax until 6.4.3 systemd Configuration.
    Let''s first look at the basic types:


    +   - Requires Strict. When activating a unit with a Requisite dependency, systemd
    attempts to activate the unit. If the dependency unit fails, systemd deactivates
    the dependent unit.


    +   - Wants. Dependencies for activation only. Upon activating a unit, systemd
    activates the unit''s Wants dependencies, but it doesn''t care if those dependencies
    fail.


    +   - Requisite. Units that must already be active. Before activating a unit with
    a Requisite dependency, systemd first checks the status of the dependency. If
    the dependency has not been activated, systemd fails on activation of the unit
    with the dependency.


    +   - Conflicts. Negative dependencies. When activating a unit with a Conflict
    dependency, systemd automatically deactivates the dependency if it is active.
    Simultaneous activation of two conflicting units fails.'
