  pgno: 158
- img_proc: true
  md: 'The router is also connected to the Internet—the cloud in the figure. Because
    the router is connected to both the LAN and the Internet, all machines on the
    LAN also have access to the Internet through the router. One of the goals of this
    chapter is to see how the router provides this access.

    Your initial point of view will be from a Linux-based machine such as Host A on
    the LAN in Figure 9-1.


    # ## 9.1.1 Packets


    A computer transmits data over a network in small called packets, which consists
    of two parts: a header and a payload. The header contains identifying information
    such as the origin/destination hosts and basic protocol. The payload, on the other
    hand, is the actual data that the computer wants to send (for example, HTML or
    image data).


    Packets allow a host to communicate with others “simultaneously,” because hosts
    can send, receive, and process packets in any order, regardless of where they
    come from or they’re going. Breaking messages into smaller units also makes it
    easier to detect and compensate for errors in transmission.

    For the most part, you will not have to worry about between packets and the data
    that your application uses, because the operating system has facilities to do
    this for you. However, it is important to know the role of packets in the network
    layers that you''re to be about.


    # ## 9.2 Network Layers


    A fully functioning network includes a full set of network layers called a network
    stack. Any functional network has a stack. The typical Internet stack, from the
    bottom to top, looks like this:


    +   - Application layer. Contains the “language” that applications and servers
    use to communicate; usually a high-level protocol of some sort. Common application
    layer protocols include Hypertext Transfer Protocol (HTTP, for the Web), Secure
    Socket Layer (SSL), and File Transfer Protocol (FTP). Application protocols can
    be combined. For example, SSL is commonly used in conjunction with HTTP.

    - Transport layer. Defines the data characteristics of the application layer.
    This layer handles data integrity, checking source and destination points, and
    specifications for baking data into packets (if the application layer has not
    already done so). Transmission Control Protocol (TCP) and User Datagram Protocol
    (UDP) are the most common transport protocols. The transport layer is also sometimes
    called the protocol layer.

    - Network or Internet layer. Defines how to move packets from a source host to
    a destination host. The particular packet transit rule for the Internet is known
    as Internet Protocol (IP). Because we’ll only talk about Internet networks in
    this book, we’ll only be talking about the Internet layer. However, because network
    layers are hardware independent, you can simultaneously configure independent
    network layers (such as IP, IPv6, IPX, and AppleTalk) on a single host.

    - Physical layer. Defines how to send data across a physical medium, such as Ethernet
    or a modem. This is sometimes called the link layer or host-to-network layer.


    It’s important to understand the structure of a network stack and how your data
    must travel through these layers at least twice before it reaches a program at
    its destination. For example, if you’re sending data from Host A to Host B, your
    bytes leave the application layer on Host A and travel through the transport and
    network layers on Host A; they go down to the physical medium, across the medium,
    and up again through the lower layers to the application layer on Host B in the
    same way. If you’re sending something to a host on the Internet through the router,
    it will go some (but usually not all) of the layers on the router and anything
    else in between.

    The layers bleed into each other in strange ways because it can be inefficient
    to process all of them'
