    # 4.1 Partitioning Disk Devices


    There are many kinds of partition tables. The traditional table is the one found
    inside the Master Boot Record (MBR). A newer standard to gain traction is the
    Globally Unique Identifier Partition Table (GPT).

    Here is an overview of many Linux partitioning tools available:


    +   - parted A text-based tool that supports both MBR and GPT.

    - gparted A graphical version of parted.

    - fdisk The traditional text-based linux partitioning tool. fdisk does not support
    GPT.

    - gdisk A version of fdisk that supports GPT but not MBR.


    Because it supports both MBR and GPT, we used parted in this book. However, many
    people prefer the fdisk interface, and there''s nothing wrong with that.


    # NOTE


    Although parted can create and resize filesystems, you shouldn''t use it for filesystem
    manipulation because you can easily get confused. There is a critical difference
    between partitioning and filesystem management. The partition table defines boundaries
    on the disk, whereas a filesystem is a much more involved system. For this reason,
    we''ll use parted for partitioning but use separate utilities for creating filesystems
    (4.2. Creating a Filesystem). Even the parted documentation encourages you to
    create filesystems separately.


    # 4.1.1 Viewing a Partition Table


    You can view your partition table with parted -1. Here is sample output from two
    disk with different kinds of partition tables:


    ```

    # parted -l

    Model: ATA WDC WD3200AAJS-2 (scsi)

    Disk /dev/sda: 320GB

    Sector size (logical/physical): 512B/512B

    Partition Table: mdsos

    ```


    | Number Start End Size Type File system Flags |

    |1 1049kB 316GB 316GB primary ext4 boot |

    2 316GB 320GB 4235MB extended |

    5 316GB 320GB 4235MB logical linux-swap(vl) |


    ```

    Model: FLASH Drive UT_USB20 (scsi)

    Disk /dev/sdf: 4041MB

    Sector size (logical/physical): 512B/512B

    Partition Table: gpt

    ```'
