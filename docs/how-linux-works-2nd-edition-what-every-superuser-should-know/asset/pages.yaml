  md: 'The :0 shown here is called the display, an identifier representing one or
    more monitors that you access with a common keyboard and/or mouse. Usually, the
    display corresponds to the single monitor you attach to your computer, but you
    can put multiple monitors under the display. When using an X session, the DISPLAY
    environment variable is set to the display identifier.


    # NOTE


    Displays can be further subdivided into sections, such as :0:0 and :0:1, but this
    has become increasingly rare because X extensions, such as RandR, can combine
    monitors into one larger virtual screen.


    On Linux, an X server runs on a terminal. In this example, the vt7 argument tells
    us it''s been to load on /dev/vt7 (the, starts on the first virtual available).
    You can run more than one X server at a time on Linux by running them on separate
    virtual terminals, if you do, each server needs a unique identifier. You can switch
    between the servers using the CTRL-ALT-FN keys or the chvt command.


    # 14.2.1 Display Managers


    Normally you do not start the X server with a command line because the server
    doesn''t define any clients that are supposed to run on it. If you start the server
    by itself, you''ll just get a blank screen. Instead, the most common way to start
    an X server is with a display manager, a program that starts the server and puts
    a login box on the screen. When you log in, the display manager starts set of
    clients, such as a window manager and file manager, so that you can use the server.


    There are many different display managers, such as gdm (for GNOME) and kdm (for
    KDE). The lightdm argument list for the X server invocation is a cross-platform
    display manager meant to be able to start GNOME or KDE sessions.


    To start an X server from a virtual console instead of using a display manager,
    you can run the start xinit command. However, you will get likely be a very simple
    one that looks completely unlike that of a display manager, because the mechanics
    and startup files are different.


    # 14.2.2 Network Transparency


    One feature of X network transparency. Because clients talk to the server using
    a protocol, it''s possible to run clients across the network to a server on a
    different machine directly over the network, with the X server listening for TCP
    connections on port 6000. Clients connecting to that could authenticate, but then
    sends windows to the server.


    Unfortunately, this method does not offer any encryption and is insecure as a
    result. To close this, most hosts normally disable the X server''s listener (with
    the -nolisten tcp option to the server, as seen in Note). You can still run X
    clients from a remote machine with SSH tunneling, as described in Chapter 10,
    by connecting the X server''s Unix socket to a socket on the remote machine.


