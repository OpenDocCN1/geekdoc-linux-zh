  md: 'These differences are also important to understanding how these utilities interact
    with the kernel. Both fdisk and parted modify the partitions entirely in user
    space; there is no need to provide kernel support for rewriting a partition table
    because user space can read and modify all of a block device.


    Eventually, though the kernel must read the partition table in order to present
    the partitions as block devices. The fdisk utility uses a relatively simple method:
    After modifying the partition table, fdisk issues a system call on the disk to
    tell the kernel it should reread the partition table. The kernel generates debugging
    output that you can view with dmesg. If you create partitions on /dev/sd1, you
    see:


    ```

    sdf: sdf1 sdf2

    ```


    In comparison, the parted tools do not use this disk-wide system call. Instead,
    they signal the kernel when individual partitions are altered. After processing
    a single partition change, the kernel does not produce the preceding output.


    There are few ways to see the partition changes:


    +   - Use udevadm to watch the kernel events. For example, udevadm --kernel will
    show the old partition devices being removed and the new ones added.

    - Check /proc/partitions for full information.

    - Check /sys/block/device/ for altered partition system interfaces or /dev for
    altered partition devices.


    If you absolutely be sure that you have modified a partition table, you can perform
    the old-style call that fdisk uses by using the block command. For example, to
    force the kernel to reload the partition table on /dev/sd1, run this:


    ```

    # blockdev --reread /dev/sd1

    ```


    At this point, you have all you need to know about partitioning disks. However,
    if you''re interested in a few more details about disks, read on. Otherwise, skip
    ahead to 4.2 Filesystems to learn about putting a file-system on the disk.


    # 4.1.3 Disk and Partition Geometry


    Any device with moving parts introduces complexity into a software system because
    there are physical elements that resist abstraction. A hard disk is no exception;
    even though you think of a hard disk as a block device with random access to any
    block, there are serious performance consequences if you aren''t careful how you
    lay out data on the disk. Consider the physical properties of the simple-cylinder
    partition disk illustrated in Figure 4-3.


    The disk consists of a spinning platter on a spindle, with a head attached to
    an arm that can sweep across the disk. The disk spins underneath the head, the
    head reads data. When the arm is in one position, the head can only read data
    from a fixed circle. This circle is called a cylinder because larger disks have
    more than one platter, all stacked and spinning around the same spindle. Each
    platter can have one or two, for the top and/or bottom of the platter, all are
    attached to the arm and move in concert. Because the arm moves, there are many
    cylinders, and all heads, from small ones around the center to large ones around
    the periphery of the disk. Finally, you can divide a cylinder into slices called
    sectors. This way of thinking about the disk geometry is called CHS, for cylinder-head-sector.'
