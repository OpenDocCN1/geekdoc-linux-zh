  md: '# 6.3 Identifying Your init


    Before proceeding, you need to determine your system''s version of init. If you''re
    not sure, check your system as follows:


    +   - If your system has /usr/lib/systemd and /etc/systemd directories, you have
    systemd. Go to 6.4 systemd.

    - If you have an /etc/init directory that contains several .conf files, you''re
    probably running Upstart (unless you''re running Debian 7, in which case you probably
    have System V init). Go to 6.5 Upstart.

    - If neither of the above is true, but you have an /etc/initab file, you''re probably
    running System V init. Go to 6.6 System V init.


    If your system has manual pages installed, viewing the init(8) manual page should
    help identify your version.


    # 6.4 systemd


    The systemd is one of the newest init implementations on Linux. In addition to
    handling the root boot process, systemd aims to incorporate a number of standard
    Unix services such as cron and inetd. As such, it takes inspiration from Apple''s
    launch. One of its most significant features is its ability to defer the start
    of services and operating system features until they are necessary.


    There are many system features that can be very difficult to know where to start
    learning the basics. Let''s outline what happens when systemd runs at time:


    +   1. systemd loads its configuration.

    2. systemd determines its boot goal, which is usually named default.target.

    3. systemd determines all the dependencies of the default boot goal, dependencies
    of these dependencies, and so on.

    4. systemd activates the dependencies and the boot goal.

    5. After boot, systemd can react to system events (such as uevents) and activate
    additional components.


    When starting, systemd does not follow a rigid sequence. With other modern init
    systems, there is a considerable amount of flexibility in the systemd boot process.
    Most systemd configurations deliberately try to avoid any startup sequence, preferring
    to use other methods to resolve dependencies.


    # 6.4.1 Units and Unit Types


    One of the most interesting things about systemd is that it does not just operate
    processes and services; it can also mount units, monitor network sockets, runtimes,
    and more. Each type of capability is a unit type. When you run a unit, you can
    activate it.


    Rather than describe all of the unit types (you''ll find them in the systemd(1)
    manual page), here''s a look at a few of the units that perform the boot-tasks
    in any Unix system:


    +   - Service units. Control the traditional service daemons on a Unix system.

    - Mount units. Control the attachment of filesystems to system.

    - Target units. Control other units, by grouping them.


    The default boot goal is usually a target that groups a number of service and
    mount units as dependencies. As result, it''s easy to get a picture of what''s
    going to happen when you boot, and you can see a dependency tree diagram with
    the systemctl dot command. You''ll find the tree to be large on a particular target,
    because many units don''t run by default.


    Figure 6-1 shows a part of the dependency tree for the default.target unit found
    on When'
