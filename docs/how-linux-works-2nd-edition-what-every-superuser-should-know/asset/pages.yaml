    # 13.1 Guidelines for Creating Startup Files


    When designing startup files, keep the user in mind. If you''re the only user
    on a machine, you don''t have to worry about errors which only affect you and
    they''re easy enough to fix. If you''re creating startup files means to be the
    defaults for all users on a machine or network, or if you think that someone might
    copy your files for using on a different machine, your task becomes considerably
    more difficult. If you make an error in a startup file for 10 users, you might
    end up fixing this 10 times.


    Keep two essential goals in mind when creating startup files for other users:


    +   - Simplicity. Keep the number of startup files small, and keep the files as
    small and simple as possible that they are easy to modify but hard to break. Each
    item in a startup file is just one more thing that can bring break.


    +   - Readability. Use extensive comments in files so that the users get a good
    picture of what each part of a file does.


