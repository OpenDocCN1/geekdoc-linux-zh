  md: 'ibs=size,obs=sizeThe input and output block sizes. If you can use the same
    block size for both input and output, use the bs option; when not, use ibs and
    obs for input and output, respectively.


    +   - count=num The number of blocks to copy. When working with a huge file—or
    with a device that supplies an endless stream of data, as /dev/—you need dd stop
    at a fixed point or you could waste a lot of disk space, CPU time, or both. Use
    count with the skip parameter to copy a small piece from a large file or device.


    +   - skip=Pass the first num blocks in the input file or stream and do not copy
    them to the output.


    # WARNING


    > dd is very powerful, so make sure you know what you''re doing when you run it.
    It''s very easy to corrupt files and data on devices by making a careless mistake.
    It often helps to write the output to a new file if you''re not sure what it will
    do.


    # 3.4 Device Name Summary


    It can sometimes be difficult to find the name of a device (for example, partitioning
    a disk). Here are a few ways to find it out:


    +   - Query udev using udevadm (3.5 udev).


    +   - Look for the device in the lsx.


    +   - Guess the name from the output of the dmesg (which prints the first few
    kernel messages) or the kernel system log file (7.2 System Logging). This output
    might contain a description of the devices on your system.


    +   - For a device that is visible to the system, you can check the output of
    the mount command.


    +   - Run /proc/devices to see the block and character devices for your system
    currently has drivers. Each line consists of a name and number. The number is
    the major number of the device as described in 3.1 Device Files. If you guess
    the device from the name, look in /dev for the character or block devices with
    the corresponding major number, and you''ve found the device.


    Among these methods, only the first is reliable, but it requires udev. If you
    get into a situation where udev is not available, try the other methods but keep
    in mind that the kernel might not know a device for your hardware.


    The following sections list the most common Linux devices and their naming conventions.


    # 3.4.1 Hard Disks: /dev/sd*


    Most hard disks in current Linux systems correspond to device names with an sd
    prefix, such as /dev/sda, /dev/sdb, and so on. devices represent entire disks;
    the kernel makes separate devices, such as /dev/sda1 and /dev/sda2, for the partitions
    on a disk.


    The naming convention requires a little explanation. The sd portion of the name
    refers to SCSI disk. Small Computer System Interface (SCSI) was originally developed
    as a hardware and protocol standard for communication between devices such as
    disks and other peripherals. Although traditional SCSI hardware is not used used
    in modern machines, the SCSI protocol is everywhere for its adaptability. For,
    USB storage devices use it to communicate. On SATA disks is a little more complicated,
    the Linux kernel still uses SCSI commands at a certain point when talking to them.


    To list the SCSI devices on system, use a utility that walks the device paths
    provided by sysfs. One of the most succinct is lsscs. Here is what you can run
    when you:'
