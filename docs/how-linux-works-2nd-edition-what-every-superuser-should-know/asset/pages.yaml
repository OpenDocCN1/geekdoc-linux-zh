  md: '# Chapter 2. Basic Commands and Directory Hierarchy


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_14_0.png)


    This chapter is a guide to the Unix commands and utilities that will be referenced
    throughout this book. This is preliminary material, and you may already know a
    substantial amount of it. Even if you think you''re up to speed, take a few seconds
    to flip through the chapter to make sure, especially when it comes to the directory
    hierarchy material in 2.19 Linux Directory Hierarchy Essentials.


    Why commands? Isn''t this a book about how Linux works? It is, of course, but
    Linux is a flavor at heart. You''ll see the word Unix in more than Linux because
    you can take what you learn straight over Solaris, BSD, and other Unix-flavored
    systems. I''ve adapted to avoid too many Linux-specific user interface extensions,
    not only to give you a better background for using the other operating systems,
    but also because these extensions tend to be unstable. You will be able to adapt
    to new releases much more quickly if you know the core commands.


    # NOTE


    For more details about Unix for beginners that you''ll find here, consider reading
    the Linux Command Line (No Starch Press, 2012), UNIX for the Impatient (Addison-Wesley
    Professional, 1995), and Learning the UNIX Operating System, 5th edition (O''Reilly,
    2001).


    # 2.1 The Bourne Shell: /bin/sh


    The shell is one of the most important parts of a Unix system. A shell is a program
    that runs commands, like the ones you enter. The shell also serves as a programming
    environment. Unix programmers often break down tasks into little components and
    use the shell to manage and piece things together.


    Many parts of the system are actually shell scripts—text files that contain a
    sequence of commands. If you''ve worked with MS-DOS previously, you can find that
    shell scripts are as powerful .BAT files. Because they''re important, Chapter
    11 is devoted entirely to shell scripts.


    As you progress through this book and gain practice, you''ll add to your knowledge
    of manipulating commands using the shell. One of the best things about the shell
    is that if you make a mistake, you can see what you typed to find what went wrong,
    and try again.


    There are many Unix shells, but all derive of their features from the Bourne shell
    (/bin/sh), a standard developed at Bell Labs for every version of Unix. Every
    Unix system needs the Bourne shell in order to function correctly, which you will
    see throughout this book.


    Linux uses an enhanced version of the Bourne shell bash or the "Bourne-again"
    shell. The bash is the default on most Linux distributions, and /bin/sh is normally
    a link to bash on a Linux system. You should use the bash when running the examples
    in this book.


    # NOTE


    You may not have bash as your default shell if you re using this chapter as a
    guide for a Unix account at an organization where you''re not the system administrator.
    You can change your shell with chsh or ask your system administrator for help.'
