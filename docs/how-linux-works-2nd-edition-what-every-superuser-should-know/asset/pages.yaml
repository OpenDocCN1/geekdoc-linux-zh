  md: "# 6.8 The Initial RAM Filesystem\n\nThe Linux boot process is, for the most,\
    \ fairly straightforward. However, one component has always been somewhat confounding:\
    \ initramfs, or the *initial RAM filesystem*. Think of this as a little user-space\
    \ wedge that goes in front of the normal user mode start. First, let's talk about\
    \ why it exists.\n\nThe problem stems from the availability of many different\
    \ kinds of storage hardware. Remember, the Linux kernel does not talk to the BIOS\
    \ or UEFI interfaces to get data from disks, so in order to mount its root filesystem,\
    \ it needs driver support for the underlying storage mechanism. For example, if\
    \ you are on a RAID array connected to a third-party controller, the kernel needs\
    \ driver for that controller. Unfortunately, there are many storage controller\
    \ drivers that can't include all of them in their kernels, so many drivers are\
    \ loadable modules. But loadable modules are files, and if your kernel doesn't\
    \ have a filesystem mounted in the first partition, it can't load the drivers\
    \ that it needs.\n\nThe workaround is to gather a small collection of kernel driver\
    \ modules along a few other utilities into an archive. The boot loader loads this\
    \ archive into memory before running the kernel. Upon start, the kernel reads\
    \ the contents of the archive into a temporary RAM filesystem (initramfs), it\
    \ mounts at /, and performs then the utilities in the initramfs allow the kernel\
    \ to load the necessary driver modules for the root filesystem. Finally, the utilities\
    \ mount the root filesystem and start true init.\n\nImplementations vary and are\
    \ ever evolving. On some distributions, the init in initramfs is a simple script\
    \ that creates a udev to load drivers, which then mount the root and execute the\
    \ it. On distributions that you use, you'll typically see an entire system installation\
    \ there with no configuration files and just a few udev configurations.\n\nOne\
    \ basic characteristic of the initial RAM filesystem has (so far) remained unchanged\
    \ since its inception is the ability to bypass it if you don't need. That is,\
    \ if your kernel has the drivers it needs to mount your root filesystem, eliminating\
    \ the initial RAM file shortens boot time, usually by a couple of seconds. Try\
    \ it yourself at boot time by using the GRUB menu editor to remove the initrd\
    \ line. (It's best not to experiment changing the GRUB configuration file, as\
    \ you can make a mistake that will be difficult to revert.) Recently, it has been\
    \ a little more difficult to bypass the initial RAM filesystem because features\
    \ as mount-by-UUID may not be available with generic distributions.\n\nIt's easy\
    \ to see the contents of your initial RAM filesystem because, on most systems,\
    \ they are simple gzip-compressed cpio archives (the cpio(1) main file). First\
    \ find the archive by looking at your boot configuration (for example, for initrd\
    \ lines in your grub.cfg configuration file). Then use cpio grep to dump the contents\
    \ of the archive into a temporary directory somewhere and persist the results.\
    \ For example:\n\n```\n mkdir /tmp/myinitrd\n cd /tmp/myinitrd\n zcat /boot/initrd.img-3.2.0-34\
    \ | cpio -i --no-absolute-filenames\n --snap--\n```\n\nOne piece of interest is\
    \ the \"pivot\" near the very end of the init process on the initial RAM filesystem.\
    \ This part is responsible for removing the contents of the temporary filesystem\
    \ (to save memory) and permanently switching to the root fs.\n\nYou won't kindly\
    \ create your own initial RAM filesystem, as that is a painstaking process. There\
    \ are a number of utilities for creating initial RAM filesystem images, and your\
    \ distribution likely comes with one."
  merge: -1
  pgno: 122
