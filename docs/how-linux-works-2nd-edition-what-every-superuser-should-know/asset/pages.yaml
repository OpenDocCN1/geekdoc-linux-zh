  md: 'If you need to emit an event to Upstart, you can do it manually with:


    ```

    # initctl emit event

    ```


    You can add environment variables to the emitted event by adding `key=value` parameters
    after event.


    # NOTE


    You can''t start and stop individual services that started via Upstart''s System
    V compatibility feature. See 6.6.1 System init: Startup Command Sequence for more
    on how to do this in a System V script.


    There are many ways to disable an Upstart job so that it will not start at boot
    time, but the most maintainable is to determine the name of the job configuration
    file (usually `/etc/init/<job>.conf`) and then create a new file `/etc/init/<job>.override`
    using only the line:


    ```

    manual

    ```


    Now the way that your job will start is by running `initctl start job`.

    The primary advantage to this method is that it''s easily reversible. To reenable
    the job at boot, remove the `.override` file.


    # 6.5.5 Upstart Logs


    There are basic kinds of logs in Upstart: service logs, and diagnostic messages
    that Upstart produces. Service logs record the standard output and standard error
    of the scripts and daemons that run under them. These messages, recorded in `/var/log/upstart`,
    are in addition to the syslog messages that a service may produce. You''ll learn
    more about syslog Chapter 7. It''s helpful to categorize what these logs contain
    because there are no standards, but the most common ones are startup and shutdown
    messages, as well as error messages. Many services produce no messages at all
    because they send everything to syslog or their logging facility.


    Upstart''s diagnostic log can contain information when it starts and reloads,
    as well as certain information about jobs and events. This diagnostic log goes
    to the kernel syslog. On Ubuntu, you will usually find this log in `/var/log/kern.log`
    file and the catchall `/var/log/syslog` file.


    That said, default Upstart logs little to nothing, so to see anything in all the
    logs, you must change the Upstart log priority. The name of the default priority
    is `message`. To log events and job changes on a running system, change the log
    priority to:


    ```

    # initctl log-priority info

    ```


    Keep in mind that this won''t be permanent and the priority will reset after a
    reboot. To have Upstart log everything when it starts, add a `--verbose parameter
    as a boot parameter, as described in 5.5 GRUB Introduction.


    # 6.5.6 Upstart Runlevels and System V Compatibility


