    # 9.11.3 NetworkManager Configuration


    The general configuration directory for NetworkManager is usually /etc/NetworkManager,
    and there are several different kinds of configuration. The general configuration
    file is NetworkManager.conf. The format is similar to the XDG-style and Microsoft
    .ini files, with key-value parameters falling into different sections. You''ll
    find that every configuration file has a [main] section that defines the plugins
    to use. Here''s a simple example that activates the ifupdown plugin used by Ubuntu
    and Debian:


    ```

    [main]

    plugins=ifupdown, keyfile

    ```


    Other distribution-specific plugins are ifcfg-rh (for Red Hat-style distributions)
    and ifcfg-suse (for SuSE). The keyfile plugin that you see here represents NetworkManager''s
    native configuration support. Using the plugin, you can see the system''s connections
    in /etc/NetworkManager/system-connections.


    For the most part, you won''t need to change NetworkManager.conf because the more
    specific options are found in other files.


    # Unmanaged Interfaces


    Although you may want NetworkManager to manage most of your network interfaces,
    for example, there will be times when you want it to ignore interfaces. Most users
    would need any kind of dynamic configuration on the localhost (lo) interface because
    the configuration never changes. You also want to configure this interface early
    in the boot process because basic system services often depend on it. Most distributions
    keep NetworkManager away from localhost.


    You can tell NetworkManager to disregard an interface by using plugins. If you''re
    using the ifupdown plugin (for example, in Ubuntu and Debian), add the configuration
    to /etc/network/interfaces file and set the value of managed to false in the ifupdown
    section of the NetworkManager.conf file:


    ```

    [ifupdown]

    managed=false

    ```


    For the ifcfg- that Fedora and Red Hat use, look for a line like this in the /etc/sysconfig/network-scripts
    directory that contains the ifcfg-* configuration files:


    ```

    NM_CONTROLLED=yes

    ```


    If this line is not present or the value is set to no, NetworkManager ignores
    the interface. For example, you''ll find it deactivated in the ifcfg-lo file.
    You can also specify a hardware address to ignore it, like this:


    ```

    HWADDR=10:78:d2:eb:76:97

    ```


    If you don''t use any of these network configurations, you can still use the keyfile
    plugin to specify the unmanaged device inside within your NetworkManager.conf
    file using the MAC address. Here''s how it might:


    ```

    [keyfile]

    unmanaged-devices=mac:10:78:d2:eb:76:97;mac:1c:65:9d:cc:ff:b9

    ```'
