  md: '# Figure 4-4. User-level representation of a filesystem


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_77_0.png)


    # Figure 4-5. Inode structure of the filesystem shown in Figure 4-4


    How do we make sense of this? For any ext2/3/4 filesystem, you start at inode
    2—the root inode. From the inode table in Figure 4-5, you can see that this is
    a directory, so you can follow the arrow over to the data pool, where you see
    the contents of the root directory: two entries dir_1 and dir_2 corresponding
    to inodes 12 and 7633, respectively. To explore these entries, go back to the
    inode table and look at each of those inodes.


    To examine inode_1/file_2 in this filesystem, the kernel does the following:


    +   1. Determines the root inode''s components: a directory named dir_1, followed
    by a component named file_2.

    2. Follows the name dir_1 in inode 2''s directory data, which points to inode
    number 12.

    3. Looks up inode 12 in the inode table and verifies that it is a directory inode.

    4. Follows inode 12''s data link to its directory information (the second box
    down in the data pool).

    5. Locates the second component of the path (file_2) in inode 12''s directory
    data. This entry points to inode number 14.

    6. Looks up inode 14 in the directory table. This is a file inode.


    At this point, the kernel knows the properties of the file and can open it by
    following inode 14''s data link.'
