    # 9.12.3 Caching and Zero-Configuration DNS


    There are two main problems with the traditional DNS configuration. First, the
    local machine does not cache server replies, so frequent network access may be
    unnecessarily slow due to name server requests. To solve this, many daemons (the
    standard Unix name server daemon) you can often tell them to intercept every name
    server request and return a cached answer to name service if possible; otherwise,
    requests go to a real name server. The two most common daemons for Linux are dnsmasq
    and nscd. You can set up DNS caching when you use 127.0.0.1 (localhost) in your
    /etc/resolv.conf file or when you use nslookup -debug-host.


