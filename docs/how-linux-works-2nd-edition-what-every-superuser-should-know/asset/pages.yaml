    particular, partition 2 is an extended partition that contains logical partition
    5.


    # NOTE


    The filesystem that parted is not necessarily the system ID defined in most MBR
    entries. The MBR system ID is just a number; for example, 83 is a Linux partition
    and 82 is Linux swap. Therefore, parted attempted to determine a filesystem on
    its own. If you absolutely must know the system ID for an MBR, use fdisk -.


    # Initial Kernel Read


    When reading the MBR table, the kernel produces the debugging output (remember
    you can view this with dmesg):


    ```

    sda sda sda2 < sda5 >

    ```


    The sda < sda5 output indicates that /dev/sda2 is an extended partition containing
    one logical partition, /dev/sda. You''ll normally ignore extended partitions because
    you''ll typically want to access only the logical partitions inside.


    # 4.1.2 Changing Partition Tables


    Viewing partitions is a relatively simple and harmless operation. Altering partition
    tables is relatively easy but there are risks involved in this kind of change
    to the disk. Keep the following in mind:


    +   - The partition table makes it difficult to recover any on partitions that
    you delete it changes the initial point of reference for a filesystem. Make sure
    that you have a backup of the disk you''re partitioning critical data.


    +   - Ensure that partitions on your target disk are currently in use. This is
    a concern because most Linux distributions automatically mount any detected filesystem.
    (See 4.2.3 Mounting a Filesystem for more mounting and unmounting.)


    When you''re ready, choose your partitioning program. If you''d like to use parted,
    you the command-line or a graphical interface such as gparted; for fdisk-style
    interface, use gdisk if you''re using GPT partitioning. These utilities all help
    and are easy to learn. (Try using on a flash device or similar if you don''t have
    any disks).


    That is, there is a major difference in the way fdisk and parted work. With partition
    before making the changes to the disk; fdisk only makes the changes as you exit
    the program. With parted, partitions are created, modified, and removed as you
    use the commands. You don''t get the chance to review the partition table before
    you change it.'
