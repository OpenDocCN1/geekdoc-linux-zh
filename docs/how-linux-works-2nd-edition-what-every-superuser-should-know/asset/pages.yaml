  md: '# Chapter 17. Building on the Basics


    ![](img/5a5c4c011c5e04e6871498e12c0cfa93_287_0.png)


    The chapters in this book have covered the fundamental components of a Linux system,
    from low-level kernel and process organization, to networking, to some of the
    tools used to build software. With all of that behind you, what can you do now?
    Quite a lot, as it turns out! Linux supports nearly every kind of non-proprietary
    programming environment, it''s only natural that a plethora of applications is
    available. Let''s look at a few application areas where Linux excels and see what
    you''ve learned in this book relates.


    # 17.1 Web Servers and Applications


    Linux is a popular operating system for web servers, and the reigning monarch
    of Linux application servers is the Apache HTTP Server (usually referred to as
    “Apache”). Another web server that you''ll often hear is about Tomcat (also an
    Apache project), which provides support for Java-based applications.


    By themselves, web servers don''t do much—they can serve files, but that''s about
    it. The end goal of most web servers such as Apache is to provide an underlying
    framework to serve web applications. For example, Wikipedia is built on the MediaWiki
    package, which you can use to set up your own wiki. Content management systems
    like WordPress and Drupal let you use your own blogs and media sites. All of these
    applications are built using programming languages that run especially well on
    Linux. For example, MediaWiki, WordPress, and Drupal are all written in PHP.


    The building blocks that make up web applications are highly modular, so it''s
    easy to add your extensions and create applications with frameworks such as Django,
    Flask, and Rails, which offer features for common infrastructure and features,
    such as templates, multiple users, and database support.


    A well-functioning web server depends on a solid operating system foundation.
    In particular, the material in Chapter 8 through Chapter 10 is particularly important.
    Your network configuration must be flawless, and perhaps more importantly, you
    must understand resource management. Adequately-sized, efficient memory and disk
    are critical, especially if you plan to use a database in your application.


    # 17.2 Databases


    Databases are specialized services for storing and retrieving data, and many different
    database servers and systems run on Linux. Two primary features of databases make
    them attractive: They offer easy, uniform ways to manage individual pieces and
    groups of data, and superior access performance.


    Databases make it easier to query and examine data, especially when compared with
    parsing and changing text files. For example, the /etc/passwd and /etc/shadow
    files on a Linux system can become difficult to maintain over a network of machines.
    Instance, you can set up a database that offers user information LDAP (Lightweight
    Directory Access Protocol) to feed this information into the Linux authentication
    system. The configuration on the Linux client side is easy; all you need to do
    is edit the /etc/sswitch.conf file and add a little extra configuration.'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'The primary reason databases generally offer superior performance when retrieving
    data is that they use indexing to keep track of data locations. For example, you
    say you have a set of data representing a directory containing first and last
    names and telephone numbers. Now you use a database to place an index on any of
    these attributes, like the last name. When you query a person by name, the database
    simply consults the index for the last name rather than searching the entire directory.


    # 17.2 Types of Databases


    Databases come in two basic forms: relational and non-relational. Relational databases
    (also called Relational Database Management Systems, or RDBMS), such as MySQL,
    PostgreSQL, Oracle, and MariaDB, are general-purpose databases that excel in tying
    different sets of data together. For example, you have sets of data, with one
    postal (ZIP) codes and another with the postal codes and their corresponding states.
    A relational database would allow you to quickly retrieve all of the nodes located
    in a particular state. You normally talk to relational databases using a programming
    language called SQL (Structured Query Language).


    Non-relational databases, sometimes known as NoSQL databases, tend to solve problems
    that relational databases don''t handle easily. For example, document-store databases,
    such as MongoDB, attempt to make storing and indexing entire documents. Key-value
    databases, such as redis, NoSQL don''t have a common query language like SQL for.
    Instead, you''ll talk to using a variety of interfaces and commands.


    The disk and memory performance issues discussed in Chapter 8 are extremely important
    in most database implementations because there is a trade-off between how much
    you can store in RAM (which is fast) versus disk. Most database systems also involve
    significant networking because they''re distributed over many servers. The most
    common network setup is called replication, where one database is copied to another
    of database servers to increase the number of clients that connect to the servers.


    # 17.3 Virtualization


    In many organizations, it''s inefficient to dedicate hardware to specific server
    tasks such as installing an operating system tailored to task on one server means
    you''re limited to what you can until. Virtual machine technology makes it possible
    to simultaneously install one or more operating systems (often called guests)
    on a single piece of hardware, and then activate and deactivate the systems as
    you. You can even move and copy the virtual machines to other machines.


    There are many virtualization systems for Linux, such as the kernel''s KVM (kernel
    virtual machine) and Xen. Virtual machines are especially handy for web servers
    and database servers. Although it''s possible to set up one Apache server to serve
    several websites, this at a cost of flexibility and maintainability. If those
    sites are all by different users, you have to manage the servers and the users
    together. Instead, it''s preferable to use virtual machines on one physical server
    with their own supporting systems, so they don''t interfere with each other and
    you can alter and move them at all.


    The software that operates virtual machines is a hypervisor. The hypervisor manipulates
    many pieces of the lower levels of a Linux system that you''ve seen in this book
    with the result, if you install a Linux guest on a virtual machine, it should
    behave like any other installed system.


    # 17.4 Distributed and On-Demand Computing


    To ease resource management, you can build sophisticated tools on top of virtual
    machine technology. The term cloud computing is a catch-all term that''s often
    used as label for this area. More specifically, infrastructure as a service (IaaS)
    refers to terms that allow you to provision and control basic computing resources
    such as CPU, memory, storage, and networking on a remote server. The OpenStack
    project is one'
  merge: -1
  pgno: 288
- img_proc: true
  md: "such API and platform that includes IaaS.\n\nMoving past the raw infrastructure,\
    \ by adding platform resources such as the operating system,\ndabase servers,\
    \ and web servers. Systems that offer resources on this level are said to be platform\
    \ as a service\n(PaaS).\n\nLinux is central to many of these computing services,\
