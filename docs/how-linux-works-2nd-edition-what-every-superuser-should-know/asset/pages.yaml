  md: '# 9.9 Boot-Automated Network Configuration


    We discussed ways to manually configure a network, and the traditional way to
    ensure the correctness of a machine''s network configuration was to have init
    a script to run the manual configuration at boot time. This boils down to running
    tools like ifconfig and route somewhere in the chain of boot events. Many servers
    do this by


    There have been many attempts in Linux to standardize configuration files for
    boot-time networking. The tools ifup and ifdown do—for example, a boot script
    can (in theory) run ifup eth0 to run the correct ifconfig and route commands for
    the eth0 interface. Unfortunately, different distributions have completely different
    implementations of ifup and ifdown, and as a result, their configuration files
    are also completely different. Ubuntu, for example, uses the ifsuite with configuration
    files in /etc/sysconfig/network-scripts, and Fedora uses its own set of scripts
    for configuration


    You don''t need to know the details of these configuration files, and you can
    just look up the formats in manual pages as if(8) and interfaces(5). It is important
    to know that this type of boot-activated configuration is not even used. You''ll
    most often see it for the local-host (or lo; see 9.13 Localhost) network interface
    but nothing else because it''s too inflexible to meet the needs of modern systems.


    # 9.10 Problems with Manual and Boot-Automated Network Configuration


    Most systems use linux to configure the network in their boot mechanisms—and many
    servers do—the dynamic nature of modern networks means that machines do not have
    static (unchanging) IP addresses. Rather than storing the IP address and network
    information on your machine, your machine gets this information from somewhere
    on the physical network when it first attaches to that network. Most network client
    applications don''t particularly care what IP address your network uses, as long
    as it Dynamic Host Configuration Protocol (DHCP, configured in 9.16 Understanding
    DHCP) tools do the basic network layer configuration on typical clients.


    There''s more to the story though, for example, wireless networks add additional
    dimensions to interface configuration, such as network names, authentication,
    and encryption techniques. When you step back to look at the bigger picture, you
    see that your system needs a way to answer the following questions:


    +   - If the machine has multiple network interfaces (such as a notebook with
    wired and wireless Ethernet), how do you choose one(s) to use?


    +   - How should the machine set up the physical interface? For wireless networks,
    this includes scanning for network names, choosing a name, and negotiating authentication.


    +   - Once the physical interface is connected, how should the machine set up
    the software network layers, such as the Internet layer?


    +   - How can you let a user choose connectivity options? For example, how do
    you let a user choose a wireless network?


    +   - What should the machine do if it loses connectivity on a network interface?


    Answering these questions is usually more than simple boot scripts can handle,
    and it''s a real hassle to do it all by hand. The answer is to use a system service
    that can monitor physical networks and choose (and automatically configure) the
    kernel network interfaces based on a set of rules that makes sense to the user.
    The service should also be able to respond to requests from users, who should
    be able to change the network they''re without having to become root just to fiddle
    with network settings every time something changes.'
