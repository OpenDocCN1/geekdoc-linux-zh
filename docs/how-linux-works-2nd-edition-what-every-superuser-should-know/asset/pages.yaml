    # Explanation and Fix


    The compiler ran the C processor on src.c but could not find the pkg.h include
    file. The source code likely depends on a library that you need to install, or
    you may just need to provide the compiler with the nonstandard include path. Usually,
    you just need to add a -I include path to the C processor flags (CPPFLAGS). (Keep
    in mind that you might also need a -L linker flag to go along with the include
    files.)


    If it doesn''t look though you''re missing a library, there''s an outside chance
    that you''re attempting to compile for an operating system that this source code
    does not support. Check the Makefile and README files for details about platforms.


    If you''re running a Debian-based distribution, try the apt-file command on the
    header filename:


    ```

    $ apt-file search pkg.h

    ```


    This might find the development package that you need. For distributions that
    provide yum, you can try this instead:


    ```

    $ yum provides /*/pkg.h

    ```


    # Problem


    make error message:


    ```

    make: prog: Command not found

    ```


    # Explanation and Fix


    To build the package, you need prog on your system. If prog is something like
    cc, gcc, or ld, you''d have the development utilities installed on your system.
    On the other hand, if you think prog is already installed on your system, try
    altering the Makefile to specify the full pathname of prog.


    In rares cases, make builds prog and uses prog immediately, assuming the current
    directory, () is in your path. If your $PATH does not include the current directory,
    you can edit the Makefile and change prog to ./. Alternatively, you can append
    . to your path temporarily.


    # 16.7 Looking Forward


    We''ve only touched on the basics of building software. Here are some more topics
    that you can explore after you get the hang of your own builds:


    +   - Understanding how to build systems other than autoconf, such as CMake and
    SCons.'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'Setting up builds for your own software. If you''re writing your own software,
    you want to choose a build system and learn to use it. GNU autoconf packaging,
    Autools by John Calcote (No Starch Press, 2010) can help you.


    +   - Compiling the Linux kernel. The kernel''s build system is completely different
    from that of other tools. It has its own configuration system tailored to customizing
    your own kernel and modules. The procedure is straightforward, though, and if
    you understand how the boot loader works, you won''t have any trouble with it.
    However, you should be careful when doing so; make sure that you always keep your
    old kernel handy in case you can''t boot with a new one.


    +   - Distribution-specific source packages. Linux distributions maintain their
    own versions of software code as special source packages. Sometimes you can find
    useful patches that expand functionality or fix problems in otherwise unmaintained
    packages. The source package management systems include tools for automatic builds,
    such as Debian''s debuild and the RPM-based mock.


    Building software is often a stepping-stone to learning about programming and
    software development. The tools you''ve seen in the past two chapters take the
    mystery out of where your system software came from. It''s not difficult to take
    the next steps of looking inside the source code, making changes, and creating
    your own software.'
  merge: -1
