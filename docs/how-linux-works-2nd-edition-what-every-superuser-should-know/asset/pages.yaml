  md: '# NOTE


    The Wants dependency type is especially significant because it does not propagate
    failures to other units. The systemd documentation states that this is the way
    you should specify dependencies if possible, and it''s easy to see why. This behavior
    produces a much more robust system, similar to that of a traditional unit.


    You can also add dependencies "reverse". For example, in order to add Unit A as
    a Wants dependency to Unit B, you do not have to add the Wants in Unit B''s configuration.
    Instead, you can install it as a WantedBy in Unit A''s configuration. The same
    is true for the RequiredBy dependency. The configuration for (and result of) a
    "By" dependency is slightly more involved than just editing a configuration file;
    see Enabling Units and the Section


    You can view a unit''s dependencies with the systemctl command, as long as you
    specify a type of dependency, such as Wants or Requires:


    ```

    # systemctl show -p type unit

    ```


    # Ordering


    None of the dependency that you''ve seen far so explicitly specify order. By default,
    activating a unit with a Requires or Wants system activates all of the dependencies
    at the same time as the first unit. This is optimal, but you want to start as
    many services as quickly as possible to reduce boot time. There are situations
    when one unit must start after another. For instance, in the system that Figure
    6-1 is based on, the default.target unit is set to start multi-user.service (this
    order is not shown in the figure).


    To activate a unit in a particular order, you can use the following modifiers:


    +   - Before: The current unit will activate before the listed unit(s). For example,
    if Before=bar.target appears in foo.target, systemd activates foo.target before
    bar.target.

    - After: The current unit activates after the listed unit(s).


    # Conditional Dependencies


    Several dependency condition operate on various operation system states rather
    than systemd units. For example:


    +   - ConditionPathExists=: True if the (file) path p exists in the system.

    - ConditionPathDirectory=: True if p is a directory.

    - ConditionFileNotEmpty=: True if p is a file and it''s not zero-length.


    If a conditional dependency is false when systemd tries to activate the unit,
    the unit does not activate, this though applies only to the unit in which it appears.
    If you activate a unit that has a condition dependency as well as other unit dependency,
    systemd attempts to activate the unit dependencies regardless of whether the condition
    is true or false.


    Other dependencies are primarily variations on the preceding. For example, the
    RequiresOverride is just like running normally, but it acts like a Wants dependency
    if a unit is manually activated. (For a full list, see the systemd.unit(5) manual
    page.)


