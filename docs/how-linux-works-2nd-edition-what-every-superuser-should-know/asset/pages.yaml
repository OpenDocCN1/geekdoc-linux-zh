  md: '# Preface


    I wrote this book because I believe you should be able to learn what your computer
    does. You should be able to make your software what you want it to do (within
    the reasonable limits of its capabilities, of course). The key to attaining this
    power lies in understanding the fundamentals of what the software does and how
    it works, and that what this book is all about. You should never have to fight
    with a computer.


    Linux is a great platform for learning because it doesn''t hide anything from
    you. In particular, most system configuration can be found in plaintext files
    that are easy enough to read. The only tricky part is figuring out which parts
    are responsible for what and how it fits together.


    # Who Should Read This Book?


    Your interest in learning how Linux may have come from any number of sources.
    In the professional realm, operations and DevOps folks know well nearly everything
    you''ll find in this book. Linux software architects and developers researchers
    students, often left to run their own Linux systems, also find that this book
    provides useful explanations for why things are set up the way they are.


    Then there are tinkerers—people who just love to play with their computers for
    fun, profit, or both. Want to know certain things work while others don''t? Want
    to know what happens if you move something around? You''re probably a tinkerer.


    # Prerequisites


    Although Linux is beloved by programmers, you do not need to be a programmer to
    read this book; you need only basic computer-user knowledge. That is, you should
    be able to bumble around a GUI (especially the installer and settings interface
    for a Linux distribution) and know what files and directories (folders) are. You
    should also be prepared to check additional documentation on your system and on
    the Web. As mentioned earlier, the most important thing you need is to be ready
    and willing to play with your computer.


    # How to Read This Book


    Building the requisite knowledge is a challenge in tackling any technical subject.
    When explaining how software systems work, things can get really complicated.
    Too much detail drags the reader and makes the important stuff difficult to grasp
    (the human brain can''t process so many concepts at once), but too little leaves
    the reader in the dark and unprepared for later material.


    I''ve designed most chapters to tackle the most important material first: the
    basic information that you''ll need in order to progress. In places, I''ve simplified
    things in order to keep focus. As a chapter progresses, you''ll see more detail,
    especially in the last few sections. Do you need to know those bits right away?
    In cases no, as I often note. If your eyes stray to glaze when faced with a lot
    of extra details about stuff that you only just learned, don''t hesitate to skip
    ahead to the next chapter or just take a break. The nitty-gritty will still be
    there for you.


    # A Hands-On Approach


    However you choose to proceed through this book, you should have a Linux machine
    in front of you, preferably one that you''re confident abusing with experiments.
    You might prefer to play around with a virtual installation—I used VirtualBox
    to test much of the material in this book. You should have superuser (root)


    www.it-ebooks.info'
