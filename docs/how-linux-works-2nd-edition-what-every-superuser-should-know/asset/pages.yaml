    # 2.5.2 less


    The less command comes in handy when it is really big or when a command''s output
    is logs and

    off off the top of the screen.


    To page through a file using /usr/share/dict/words, use the command less /usr/share/dict/words.

    When running less, you''ll see the contents of the file screen at a time. Press
    the spacebar to

    forward in the file and the b key to skip back one scroll. To quit, type q.


    # NOTE


    The less command is an enhanced version of an older program named more. Most Linux

    desktops and servers have less, but it''s not on many embedded systems and other

    Unix systems. If you run into a situation when you can''t use less, try more.


    You can also search for text inside less. For example, to search for a type, /word,
    and to

    search backward, ?word. When you find a match, you can send the output of any
    program directly

    to another program''s standard input. Use n to continue searching.

    As you''ll learn in 2.4 Shell Input and Output, this is exceptionally useful when
    you have a program with a lot

    output to sift and you''d like to use less to view the output. Here''s an example
    of

    sending the output of a grep to less:


    ```

    $ grep ie /usr/share/dict/words | less

    ```


    Try this out for yourself. You''ll probably use less this like a lot.


    # 2.5.3 pwd


    The pwd (working directory) program simply outputs the name of the current working
    directory.

    You may be wondering why you need many Linux distributions set up with the current
    working

    directory in the prompt. There are two reasons.


    First, all prompts include the current working directory, and you may even want
    to get rid of it in your

    own prompt because it takes a lot of space. If you do, you need pwd.


    Second, the symbolic links that you''ll learn about in 2.1.2 Symbolic Links can
    sometimes obscure the true

    full path of the current directory. You will use -P to eliminate this confusion.


    # 2.5.4 diff


    To see the differences between two text files, use diff:


    ```

    $ diff file1 file2

    ```


    Several options can control the format of the output, and the default output format
    is the most

    comprehensible for human beings. However, most programmers prefer the output from
    diff -u when they

    need to send the output to someone else automated tools can make use of.


    # 2.5.5 file


    If you see a file and are unsure of its format, try using the file command to
    see if the system can guess:


    ```

    $ file file

    ```


    You may be surprised by how much this innocent-looking command can do.'
