    # 3.6 Generic SCSI Devices


    When a user-space process communicates with the SCSI subsystem, it normally does
    through the block device layer and/or another kernel service that sits on top
    of SCSI device driver (sd or sr). In other words, most user processes need to
    know anything about SCSI devices or their commands.


    However, user processes can bypass device drivers and give SCSI protocols directly
    to devices through their generic devices. For example, consider the system described
    in 3.6 In-Depth: SCSI and the Linux Kernel, but this time, take a look at what
    happens when you add the -g option to lsscsi in order to show the generic devices:


    +   $ lsscsi -g


    ```

    [0:0:0:0]    disk        ATA         WDC WD3200AAJS-2 01.0    /dev/sda 1 /dev/sg0

    [1:0:0:0]    cd/dvd     Slimtype DVD A DS8A5H   XA15    /dev/sr0 /dev/sg1

    [2:0:0:0]    disk        USB2.0     CardReader CF      0100    /dev/sdb /dev/sg2

    [2:0:0:1]    disk        USB2.0     CardReader MX XD 0100    /dev/sdc /dev/sg3

    [2:0:0:2]    disk        USB2.0     CardReader MS      0100    /dev/sdd /dev/sg4

