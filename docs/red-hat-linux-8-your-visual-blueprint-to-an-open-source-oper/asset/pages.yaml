  md: '# RED HAT LINUX 8


    # UPGRADE LINUX


    You can perform an upgrade to a new version of Red Hat Linux over a previous version
    of Red Hat Linux. The difference between a new installation of Red Hat Linux and
    an upgrade is that when you perform an upgrade, Linux preserves settings and files,
    such as documents, e-mail and graphic files that exist on your system. Upgrading
    your operating system is not the same as installing a new copy of the system.
    When you install an upgrade, the installation program determines where on your
    computer the current version of Linux presently exists.


    When upgrading Linux, the installation program can install a boot loader. A boot
    loader is a program that allows a computer to boot multiple operating systems.
    When you perform a upgrade, you can choose to install a new boot loader.


    You can choose which applications and packages you want to install during an upgrade.
    You can also install new packages after you install Linux. For more information,
    see page 210.


    The applications that you install when you upgrade your operating system make
    the configuration of the existing operating system. For example, if you installed
    the original version of Linux using a server configuration, the upgrade installs
    the latest version of the server configuration. If you installed additional applications
    after the installation of the original operating system, then the installation
    program upgrades those applications.


