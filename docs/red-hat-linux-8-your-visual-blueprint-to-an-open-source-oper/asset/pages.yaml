    +   2 Type the name of the file you want to view.


    +   3 Press Enter.


    +   The vi screen appears with the contents of your file.


    +   The name of the file, and the number of lines and characters in the file,
    appear.


    +   The position of the cursor in the file appears.


    +   The amount of the file visible onscreen appears.


    Note: To start the Terminal window, see page 218.'
