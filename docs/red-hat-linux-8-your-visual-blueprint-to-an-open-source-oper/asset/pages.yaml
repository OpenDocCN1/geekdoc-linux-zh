  md: '# RED HAT LINUX 8


    # REPLACE TEXT


    You can replace text in a file in one simple operation. This prevents you from
    having to perform a manual search and replace in a file. Before you perform a
    search-and-replace operation, vi must be in Command mode. You can change to Insert
    mode by pressing the colon key.


    To replace text on a specific line, you must first position the cursor on that
    line you want to replace between a pair of forward slashes and replace it with
    an n. You must then replace the text followed by another forward slash. For example,
    to replace the word erase with the word /erase/delete/ in a file, the command
    is


    vi replaces the first occurrence of the specified text on the line where the cursor
    is positioned. To replace all the occurrences on the line, you must place a letter
    g after the trailing forward slash.


    You can replace all the occurrences of a combination of characters within a file
    by preceding them with a percent sign (%). You must also follow the search-and-replace
    instruction with the search-and-replace command with the letter g to replace all
    the occurrences of the text within the file, otherwise only the first occurrence
    on each line is replaced. Any text found in the file that matches the search text
    is replaced by the replacement text.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_259_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_259_1.png)


    +   1. Open or create a text file with vi and move to the line that contains the
    phrase you want to replace.

    2. Type : to enter Command mode.


    +   3. Type / followed by the phrase you want to replace.

    4. Type a forward slash followed by the replacement text and another forward slash.

    5. Press Enter.


    +   6 replaces the text.


