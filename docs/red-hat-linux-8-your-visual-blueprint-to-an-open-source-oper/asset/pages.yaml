  md: '# START THE GIMP (CONTINUED)


    The GIMP uses an area of memory referred to as the tile cache to store information
    about the images on which you are working. You can specify the amount of memory
    you want to allocate to the tile cache. In some cases, you should use the default
    value provided by the GIMP setup process.


    During the GIMP setup process, an installation log displays allows you to review
    the setup of the GIMP. The installation log details the files that were created,
    as well as any directories that were created. If there was an error during setup
    and installation of the GIMP, software will be contained in the installation log.
    If the installation log indicates an error, you will probably not be able to start
    the GIMP software.


    The resolution of the monitor that you are affects how an image in the GIMP appears.
    You can specify the resolution of your monitor, and the GIMP can optimally display
    any images that it is working with. The GIMP attempts to detect resolution of
    the monitor from the settings you specified when you installed Linux. You can
    also specify a different resolution if the defaults supplied by the GIMP do not
    match the specification of your monitor. You can determine the exact resolution
    of your monitor by consulting your monitor''s documentation.


    When the GIMP is installed, it will start automatically. When you first start
    the GIMP, a tip dialog boxes providing information about using GIMP. You must
    close this dialog box before you can use the GIMP to work with images.


    # START THE GIMP (CONTINUED)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_209_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_209_1.png)


