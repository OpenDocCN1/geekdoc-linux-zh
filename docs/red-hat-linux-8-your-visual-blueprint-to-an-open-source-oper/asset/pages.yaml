  md: '# CREATE A WEB PAGE


    You can create your own Web pages to display in your Web browser. When you create
    Web pages, you can store and access them on your your own computer, or transfer
    them to a Web server that connects to the Internet, making them accessible to
    other people who use the World Wide Web.


    The Mozilla Web browser includes Composer, a program that you can use to create
    Web pages. The Composer program allows you to create Web pages without having
    to learn Hyper Markup Language, or HTML, the markup language that you use to create
    Web pages. A Web page similar to creating a document in a Web processor. Composer
    then automatically converts and saves the Web page in HTML format.


    Once you add text to a Web page within Composer, you can convert the text to a
    hyperlink. A hyperlink is a link to another document on the Web. When a user clicks
    on a hyperlink, the Web page accesses the link.


    When you save your page for the first time, Composer asks you to choose a title
    for your Web page. The title of Web page appears at the top of the Web browser
    window. When you create Web pages with Composer, you are not limited to using
    the Mozilla Web browser to view them. Your Web page can display in Web browsers
    running on other operating systems, such as Internet Explorer in Windows.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_145_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_145_1.png)


    # CREATE A NEW PAGE


    +   1 Click the Web Browser button to launch Mozilla.


    +   2 Click Window.


    +   3 Click Composer.


    +   4 Type the text that you want to appear in the Web page


    You can also launch Mozilla by clicking the Main Menu button and selecting Extras
    Internet Mozilla Mail.'
