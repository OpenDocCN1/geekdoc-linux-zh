  md: '# USING MULTIPLE DESKTOPS


    You can use multiple desktops to better manage applications. It is common to have
    many applications running at the same time. For example, you may have a Web browser,
    an e-mail program, and a word processor dictate. The dean can become cluttered.
    The panel includes a feature that creates multiple desktops to enable you to better
    manage your applications. Multiple desktops allow you to open any number of applications
    and place them on different areas, which can simplify switching between each area.
    For example, you can have Internet applications, such as an e-mail program, and
    a Web browser running on one desktop, and productivity applications, such as a
    word processor and spreadsheet application running on another desktop. You can
    then


    quickly switch between productivity applications and Internet applications without
    having to navigate through the windows of each open application.


    You can quickly switch from one desktop to another by selecting the desktop from
    the graphical representation on the panel. The Workspace Switcher is the name
    of the application running on the panel that allows you to manage multiple desktops.
    By default, there are four desktop areas created that you can use to manage your
    running applications.


    There is no limit, except the available computer resources, to the number of applications
    you can launch and place on the desktops of your computer.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_61_0.png)


