  md: '# RED HAT LINUX 8


    # ADD A PRINTER


    You can use Linux to print document documents, images, or any other type of information.
    Most applications allow you to print information, such as a Web browser that allows
    you to print a Web page, or a spreadsheet program that allows you to print spreadsheet
    data.


    You must add a printer to your Linux system before you can print. Adding a printer
    creates a print queue for the printer. A print queue is simply a file that stores
    information that is being sent to a printer. Any data that is printed by the printer
    goes through the print queue. After you specified the details of the print queue,
    Linux automatically creates and manages the print queue.


    You can use the printer configuration tool to add a printer to your Linux system.
    The printer configuration tool displays a list of any other printers that have
    been previously installed.


    You must specify the name of the print queue. You should try to make the name
    of the print queue as descriptive as possible to help identify the printer, particularly
    if you are going to share the printer with others. For example, use Colorinkjet
    as the print name as Printer1.


    You can connect to a range of printers, those connected to other computers on
    network, but the most common configuration is to create a printer that is connected
    directly to your computer. A printer directly connected to a computer is called
    a local printer, as it is local to that computer.


    # ADD A PRINTER


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_41_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_41_1.png)


    +   1 Click the Main Menu button.

    2 Click System Settings.

    3 Click Printing.


    +   The Red Hat Printer Config window appears.


    Note: If you are not logged in using the root account, you will be prompted to
    enter the root account password.


    +   4 Click New.'
