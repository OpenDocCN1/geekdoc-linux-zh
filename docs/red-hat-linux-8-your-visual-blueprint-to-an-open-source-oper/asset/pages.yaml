  md: '# RED HAT LINUX


    # RECORD AUDIO


    You can use your computer to record audio data from a diverse range of sources.
    Audio recordings are made with the Sound Recorder application. The Sound Recorder
    uses a simple interface comprised of Play, Stop, and Record buttons, which allow
    you to make recordings.


    To make a recording, your computer must have a sound system that has the ability
    to connect a microphone or other type of audio input. Many computers come equipped
    with built-in sound systems, while other computers require that you add a sound
    system by installing an expansion card, called a sound card.


    The quality of the recording that you make depends on the quality of the signal
    being passed to your computer. The type of device that you connect to the recording
    port of your computer determines the level of quality. For example, a recording
    made from a radio is noticeably inferior to a recording made from a compact disc
    connected to your computer. You can easily connect a wide range of devices to
    your computer, including microphones, tape players, disc players, and recorders.
    When connecting devices such as radios and tape players, you should ensure that
    the volume level of the device is adjusted correctly. Some devices have dedicated
    ports, often called Line Out ports, which you can use specifically to connect
    to your computer. When connecting via a Line Out port, you do not have to adjust
    the volume of the device.


    # RECORD AUDIO


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_129_0.png)


