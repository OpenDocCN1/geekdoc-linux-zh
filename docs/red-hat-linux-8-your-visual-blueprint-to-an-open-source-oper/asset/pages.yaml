  md: '# USING RESCUE MODE


    You can boot your Linux system into a special mode that allows you to attempt
    to recover information when your computer does not boot correctly. The easiest
    way to access the rescue mode of a Linux system is to start the Linux system and
    boot from the first CD-ROM disc or a boot disk. When the disc boots, you are presented
    with a boot prompt that allows you to specify whether to boot rescue mode. You
    must configure your computer to allow booting from the CD-ROM if you do not have
    the CD-ROM boot feature enabled. For more information about enabling the CD-ROM
    boot feature, please refer to the configuration documentation for your computer.


    When the computer starts in rescue mode, a command prompt appears that you can
    use to navigate the system. You can use the `ls` command to list the contents
    of directories, and you can use the `cd` command to move from one directory to
    another.


    When the computer boots into rescue mode, Linux attempts to determine where on
    your computer the files are stored. If Linux can access the files, then Linux
    makes the files available in a directory called /mnt/sysimage. While you cannot
    use the Linux system normally, you can still access the files in order to copy
    important information or make changes that can allow the computer to boot normally.


    Using rescue mode is not the same as booting a Linux system in a normal way. This
    is because the tasks you are allowed to perform are quite limited compared to
    a fully functioning Linux system that has been booted normally.


    # USING RESCUE MODE


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_283_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_283_1.png)


    +   1. Start your computer and immediately insert the first disc of the Red Hat
    Linux installation CD set.


    +   2. The boot screen appears.


    +   3. Type linux rescue.


    +   4. Press Enter.'
