  md: '# # RED HAT LINUX 8


    # CHANGE THE SYSTEM FONTS


    When you install KDE, a number of fonts are installed that KDE uses to display
    information. You can change these fonts for practical purposes, such as making
    them buttons easier to read, or for purely aesthetic reasons as giving your desktop
    more character.


    Fonts can also have different styles. The most common style, other than regular,
    is **bold**, which makes the font thicker. Another common style is *italic*, which
    slants the font forward. A font can also be a combination of styles, such as ***bold
    italic**. Not all fonts are available in all types of styles. Some fonts may only
    be available in regular style while others are available in italic, and bold styles.


    Linux has many different fonts, and each individual font is comprised of different
    characteristics such as size and style. The size of a font is measured in points.
    For example, a font size 12 is large enough for normal viewing while a size of
    8 points is under too small. If you have a high-resolution display, for example,
    1280 x 1024 pixels, you may want to increase the size of the fonts to make them
    easier to read on the display.


    You can only use the fonts installed on your computer. While it may be tempting
    to change the fonts by KDE, you should take care not to adversely affect the display
    of KDE items. For example, if you choose a large font to be used for menu items,
    then some menus may not appear correctly because of space limitations caused by
    using a large font.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_111_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_111_1.png)


    +   1. Click the Main Menu button.


    +   2. Click Preferences.


    +   3. Click Look & Feel.


    +   4. Click Fonts.


    +   5. The Fonts window appears.


    +   6. Click the Choose button for the font you want to change.'
