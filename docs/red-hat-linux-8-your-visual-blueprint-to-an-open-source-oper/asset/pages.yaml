  md: '# WORKING WITH APPLICATIONS


    # Extra


    If an appointment is going to last all day, such as when attending a conference,
    you can make your appointment an all-day appointment. This way, you do not have
    to specify the start and end times, only the day. To set an appointment as an
    all-day appointment, click All Day Event in the Appointment Information dialog
    box.


    If an appointment requires another person, you can assign that person to the appointment.
    Click the Contact button in the Appointment Information dialog box and select
    the person from the list of available contacts. For information about creating
    contacts, see page 168.


    If an appointment is a regular event, such as a staff meeting that is held every
    Friday at the same time, you can specify that an appointment will recur. This
    will save you time from recreating the appointment each time the meeting is scheduled.
    To specify that an appointment will recur, select the Reoccurrence tab in the
    Appointment Information dialog box and choose the number of days between appointments
    and click Save.


