    You must establish a connection to the Internet before you can start viewing Web
    pages on the World Wide Web. If you do not have a connection to the Internet,
    you can still use the Mozilla Web browser to view Web pages stored on your computer
    or on a network to which your computer connects.


    If you try to enter the address of a Web page that you cannot access, Mozilla
    displays a message indicating that the Web page is inaccessible. There are many
    reasons why you might not be able to access a Web page; the most common being
    that it is no longer available. It could also be the result of a network configuration
    error or that you typed the Web page incorrectly.


    You need not restrict yourself to the Mozilla Web browser to access the Web using
    Linux. There are other Web browsers that you can download and install on your
    Linux system. One popular browser for Linux is the Konqueror Web browser. The
