  md: '# COPY FILES AND DIRECTORIES


    You can copy files to make a duplicate of a file. You may want to copy a file
    to make a backup of a file, or simply because you want to share the information
    in the file with another person. As well you can copy directories. When copying
    directories, you create a copy of the directory structure, as well as files contained
    within the directory structure.


    The command to copy files is cp. When using the cp command, you specify the name
    of the file you want to copy as well as a name for the copied file.


    You can copy a file or directory to another file or directory with a different
    name. For example, you may want to copy a file to a file called budget.backup.


    You cannot have a file or directory in the same directory that uses the same name.
    If you want to keep the original name for a file or directory, you must copy it
    to a new location.


    You can verify that a copy of a file has been made using the ls -l command to
    view the contents of the directory that will store the new copy. For more information
    about listing the contents of a directory, see page 246.


    Before you copy a file, you must have the appropriate permissions to enable you
    to read the file. For more information about file permissions, see page 284.


    # COPY FILES AND DIRECTORIES


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_267_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_267_1.png)


    +   - In a Terminal window, type cp.


