  md: '# RED HAT LINUX 8


    # DELETE AN ITEM


    You can use Nautilus to remove items you no longer want. Removing unwanted items
    increases the manageability of the files and directories on your computer and
    frees up resources such as storage on a hard drive.


    Because the Trash contains items in a folder on your computer, the more items
    in the Trash, the more space on the storage media that Trash will require. You
    should periodically empty the Trash to free space on your storage medium. If you
    delete a large item, such as a video file, you may want to empty the Trash immediately
    after deleting the files to free up the space


    When you remove an item, the item is placed in a special folder called *Trash*.
    This folder is accessible from the desktop using the Trash icon. The Trash is
    a holding area for items before they are permanently removed from your computer.


    When you place items in the Trash, the icon represents the change on the desktop.
    When the Trash folder contains no items, the Trash icon appears as an empty trash
    basket. When the Trash folder contains items, the icon changes to an empty trash
    basket with paper. Even if the Trash folder contains only one small item, the
    Trash icon still changes to indicate that there is an item in the Trash folder.


    After you place an item in the Trash, it remains until you empty the Trash. Emptying
    the Trash effectively means that you will permanently remove any item in the Trash.
    After emptying the Trash, you cannot retrieve any items that were in the folder.
    You must ensure that you will never require an item in the Trash before you empty
    it.


    # DELETE AN ITEM


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_83_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_83_1.png)


    +   1 Right-click the item you want to delete.


    +   2 Click Move to Trash in the pop-up menu.


    +   3 The item disappears in the view pane.


    +   4 The Trash icon changes to indicate the Trash folder contains items.'
