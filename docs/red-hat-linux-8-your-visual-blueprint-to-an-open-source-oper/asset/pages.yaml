  md: '# CREATE A SLIDE USING OPENOFFICE.ORG IMPRESS


    A presentation is a series of images, or slides, that you display on a screen
    to provide information to a viewer. You often perform presentations in front of
    an audience to provide visual emphasis to your speech.


    OpenOffice.org Impress is the software application within the OpenOffice.org productivity
    suite that you can use to create a presentation. A presentation consists of one
    or more slides that when viewed in order create a slide show.


    When you first create a presentation, you can start with a blank presentation
    and add slides to it. You can use a variety of media formats to customize the
    appearance of your presentation. For example, if you create your presentation
    to appear on a computer, you can use a slide optimized for screen display.


    You can use transition effects between your slides to add visual impact to your
    presentation. For example, when you replace one slide with another in your presentation,
    the new slide can move from the left side of the screen to the right until it
    replaces the first slide. You can use animation to draw attention to slides that
    contain important information or to create a special effect when a slide appears
    on the screen. You can also adjust the speed of the transition. When displaying
    multiple slides in a slide show, you can adjust the amount of time that each slide
    appears on the screen. You should choose a slide interval that gives the reader
    enough time to view the slide.


