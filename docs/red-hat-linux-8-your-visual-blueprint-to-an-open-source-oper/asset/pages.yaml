    There are many tools that you can use to manipulate images after the image has
    been opened in the GIMP. The Toolbox is a window that allows you to access GIMP
    tools that you use to modify an image.


    There are many tools available within the GIMP, and many of them require an image
    be made before using the tool. For example, after you select an area of the image,
    you can use the Blend tool to apply a color gradient to the selected area of the
    image.


    Before modifying an image, one of the most common tasks is to select an area of
    the image. For example, if you want to change the color of someone''s eyes in
    an image, you must first select the eyes. Using selection allows you to limit
    change to a specific area as opposed to the whole image.


    You can move a selected area of an image to another location within the same image.
    The Rectangular Selection tool, available on the Toolbox window, allows you to
    select a square or rectangular area of an image.


    The GIMP has a number of tools that allow you to select an area of an image. The
    Fuzzy Selection tool enables you to select a contiguous region. A contiguous region
    is an area of an image that has the same color and is contained in one area.


    Each time you make a selection within an image, the area within the selection
    is indicated by a border of black and white dashes, commonly referred to as a
    marque. The black and white dashes move slightly to indicate that a selection
    has been made.


    # MODIFY AN IMAGE


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_213_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_213_1.png)


    # SELECT A CONTIGUOUS AREA


    +   1 Open an image in the GIMP.

    * For more information about opening an image, see page 196.


    +   2 Click the Fuzzy Contiguous Selection tool ().

    3 Click the image.

    * A contiguous area within the image appears selected.


    # CREATE A GRADIENT


    +   1 Select an area of the image.

    2 Click the Blend tool ( ).


    +   3 Click and drag the image a small distance and release the mouse.

    * A gradient area within the image appears.'
  merge: -1
