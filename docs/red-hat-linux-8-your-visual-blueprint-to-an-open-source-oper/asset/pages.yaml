  md: '# SEND AN E-MAIL MESSAGE


    You can send an e-mail message to another person if you know their e-mail address.
    You should always include a subject for the e-mail message that the recipient
    can use to identify the message. Try to be descriptive when specifying the subject
    of an e-mail message. For example, use Schedule Changes as opposed to Hello. The
    body of the message is where you type the contents of.


    Depending on the size of the message and the speed of your Internet connection,
    it may take some time to send the message.


    Evolution stores all messages it sends and receives in folders. When Evolution
    successfully sends an e-mail message, it places the message in the Sent folder.


    Once you compose an e-mail message, you can send the message. Unlike receiving
    e-mail messages, you do not have to enter a password to send e-mail messages,
    although you must have an Internet connection before you can send an e-mail message.
    When you send the message, Evolution displays a window indicating the transfer
    progress.


    Just because the program successfully sends a message, this does not mean it has
    reached the intended recipient. When Evolution indicates that it has sent a message,
    it can only determine if the outgoing e-mail server was able to send the message.
    If there is a problem with the e-program or incoming e-mail server of the intended
    recipients, you may have no reliable way of determining if the e-mail message
    successfully transferred to the intended recipient.


    # SEND AN E-MAIL MESSAGE


