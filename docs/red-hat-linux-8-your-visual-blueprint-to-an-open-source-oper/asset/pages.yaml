  md: '# CREATE A DRAWING USING OPENOFFICE.DRAW


    OpenOffice.org Draw is an excellent tool to create graphics that you want to use
    in a presentation. You can draw pictures using OpenOffice.org Draw, the drawing
    application from the OpenOffice.org suite. There are two primary of image-drawing
    programs: vector and bitmap-based drawing programs. A bitmap-based drawing program
    manipulates images on a pixel-by-pixel basis and is more suited for working with
    photographic images. A vector-based drawing program is more suited for creating
    graphics such as logos and diagrams. A vector-based drawing program, although
    it can import images. A good bitmap-image manipulation program is the GIMP. To
    learn more about using the GIMP see Chapter 12.


    OpenOffice.org Draw first starts, it presents you with a blank document on which
    you can immediately start drawing to create a picture. A drawing consists of objects.
    An object can be any combination of text, lines, and shapes. Lines are one of
    the most common elements in a drawing, and OpenOffice.org Draw lets you alter
    their thickness, color, and direction. Draw also enables you to create quick simple
    shapes as rectangles and o. It allows you to apply color to their interiors and
    outlines, and alter their shape and position by anchoring points located on their
    borders.


    You can also add text to a drawing. With other types of elements you add to a
    drawing, you can simply select the Text tool and click in the drawing area starting
    typing the text you want to add.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_199_0.png)


    +   1 Click the Main Menu button.


    +   2 Click Office.


    +   3 Click OpenOffice.org Draw.


    +   * OpenOffice.org Draw starts and displays a blank document.


    +   * 4 Click the Line and Arrows tool (L).


    +   * The line appears.'
