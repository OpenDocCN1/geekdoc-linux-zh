  md: '# USING A VIRTUAL CONSOLE


    You can use a virtual console to simultaneously access multiple instances of the
    Linux shell. When you first access a virtual console, you must log in to the system
    using a valid username and password. For more information about logging, see page
    30.


    You can use multiple virtual consoles to perform different tasks simultaneously.
    For example, you can use the first virtual console to perform a system backup
    while at the same time use a second virtual console to install an application.
    When you log into each virtual console, you can use different usernames or the
    same username. Linux provides six virtual consoles that you can use to access
    the Linux shell.


    When working in a text-based environment, you can access the virtual console by
    pressing and holding down the Ctrl key which represents the


    number of the virtual console. For example, to access virtual console number 2,
    you would use Ctrl + F2.


    When working in a graphical environment, you access each virtual console by pressing
    and holding both the Control and Alt keys by the Function key that corresponds
    to the virtual console you want to access. When you are working in a graphical
    environment, you must use virtual console number 7 to access the graphical environment.


    Having multiple virtual consoles consumes very few resources; however, the type
    of task you perform using virtual consoles may result in a degradation of system
    performance. When you use a virtual console to perform resources, such as large
    databases, may adversely affect the performance of other tasks running in other
    consoles. Any changes you make to the system, such as modifying files, affect
    all consoles in use.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_235_0.png)


