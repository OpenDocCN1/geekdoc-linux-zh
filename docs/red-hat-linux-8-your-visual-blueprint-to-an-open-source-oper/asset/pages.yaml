  md: '# RED HAT LINUX 8


    # # CHANGE THE BEHAVIOR OF WINDOWS


    Each application that runs on a Linux computer using the KDE desktop appears within
    a window. You can change the characteristics of the window, no matter what application
    is active in the window.


    Generally, different operating systems dictate the behavior of the windows on
    your desktop. With KDE, you can choose exactly how you want a window to behave
    when certain actions are performed on that window. For example, when moving a
    window, you can choose to have the contents of the window as you move it, or just
    move out of the window.


    When multiple windows are open at once only one window can be active, or have
    focus. To focus a window, you can click the window. You can change the focus behavior
    of open windows so that any windows that are directly under the mouse pointer
    focused.


    reduces the amount of clicks the mouse requires when working with multiple windows.


    The title bar of a window is the topmost portion of the window. It includes a
    description of the item in the window, typically the name of the application or
    the document. You can change the action of a window when double-click the title
    bar of the window. By default, KDE shades the window when the title bar is double-clicked.
    Shading an application means hiding the window and only displaying the title bar.
    You can redraw a window by double-clicking on the title bar. You can change double-clicking
    from shading to another action such as maximizing the application, an action that
    is familiar to users of the Windows operating system.


    When you minimize or maximize a window, the procedure is animated. This animation
    is an aesthetic effect that you can turn off if you prefer.


    # CHANGE THE BEHAVIOR OF WINDOWS


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_109_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_109_1.png)


