  md: "# SET DIRECTORY ACCESS PERMISSIONS\n\nYou can use access permissions to control\
    \ who can access a directory and how they can use the directory. Directories use\
    \ the same system as files for setting permissions, although Linux interprets\
    \ directories in a slightly different way.\n\naccess permissions by using the\
    \ chmod command. For more information about the chmod command, see page 28.\n\n\
    The read and write permissions for a directory work similarly to those for a file.\
    \ You can view the listing of files within a directory that gives you permission,\
    \ and you can add or delete files in a directory that gives you permission.\n\n\
    Any permissions that you assign to a directory also apply to any subdirectories\
    \ of that directory, unless the subdirectory itself has a set of permissions that\
    \ override the permissions of the parent directory.\n\nYou use the execute, or\
    \ search, permission to deny or allow access to a directory. A user cannot work\
    \ in any directory for which they do not execute the permission.\n\nEven if a\
    \ user has read, write, and execute permissions for a directory, the actions that\
    \ the user can perform on the files within the directory will still depend on\
    \ the individual file permissions. Thus, a user with read permissions for a directory\
    \ is unable to view files that do not have the read permissions for that user.\n\
    \nAs with files, you can view the permissions for a directory using the ls -l\
    \ parameter. A d precedes the permissions to indicate the listing is for a directory\
    \ and not a file. As with file permissions, you can set\n\nRegardless of the permissions\
    \ that apply to a directory, the root account always has full authority to work\
    \ with that directory, including the ability to change the directory access permissions.\n\
    \n![](img/0fb3b9489380ca1b87c2aa7ab52f3066_301_0.png)\n\n```\n[user@localhost\
