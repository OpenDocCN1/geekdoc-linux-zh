  md: '# RED HAT LINUX 8


    # DETERMINE HARDWARE INFORMATION


    Computers consist of many pieces of hardware. You can view the information about
    the different hardware components of your computer using the KDE desktop. Two
    the most frequently encountered hardware devices on your computer are the network
    interface and the hard drive.


    You can view important information about a network interface such as the IP number
    of the interface. An IP is a unique number that identifies a computer on a network.
    Every device that connects to the Internet has an IP number. IP numbers consist
    of four numbers, each less than or equal to 255, and separated by a period. 192.168.4.45
    and 10.34.244 are examples of IP numbers. As well as the IP number of the network
    interface, you can also determine the netmask of the network. The netmask number
    is another IP number,


    with the IP address of the computer, which networks use to help identify each
    other. As well as the appropriate IP number, you can also determine if a network
    connection is currently established, or up. A network connection that is not established
    is said to be down.


    You can view hard drive information to obtain details about partitions on the
    storage devices connected to your computer. Hard drive information also allows
    you to view the mount point of your computer. A mount point is a directory where
    you may access a storage device. For example, the floppy disk in disk drive of
    your computer may be accessible through the /mnt/floppy directory. The mount point
    for the floppy would then be /mnt/floppy.


    In order to view the information about a device, the device must be connected
    to the computer and currently operating.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_107_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_107_1.png)


    +   1 Click the Main Menu button.


    +   2 Click Preferences.


    +   3 Click Information.


    +   4 Click Network interfaces.


    +   The Network Interfaces window appears showing information about your network
    devices.'
  merge: -1
