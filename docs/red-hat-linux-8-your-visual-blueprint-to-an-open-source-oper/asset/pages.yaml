  md: '# WORKING WITH INTERNET APPLICATIONS


    # Extra


    Your Internet service provider (ISP) specifies the names of the mail servers that
    you must use to send and receive e-mail messages. Most ISPs require you to specify
    the name of the mail server, typically followed by the domain name of the ISP,
    such as mail.myisp.com. You refer to this combination of the name and the domain
    name as a fully qualified domain name. In some cases, especially when using high-speed
    Internet connections, such as cable modem, you may only have to specify a single
    name. For example, your ISP may require you to use the name outgoing for sending
    mail and the name incoming for receiving mail.


    An IP number is a unique number that identifies computers on the Internet. An
    IP number consists of four numbers less than or equal to 255, and separated by
    periods, as in 192.168.23.5. If you know the IP number of your mail server, you
    can use that number instead of the mail server. You often use the IP number of
    the mail server for troubleshooting problems that you experience with sending
    and receiving e-mail messages.


