  md: '# MANIPULATE OBJECTS IN OPENOFFICE.ORG DRAW


    drawing can contain many objects, and you can organize the objects in relation
    to each other. For example, when creating a slide, you may want to align all the
    text to the drawing to the center of the drawing.


    When you place objects in a drawing, you can imagine that each resides on a transparent
    layer. You can arrange objects by sending them forward and backward in relation
    to the layers of other objects in a drawing. For example, if you want to draw
    a border around an item of text, you can draw a rectangle, the type, and then
    place the rectangle behind the text to guide you. You can also send an object
    to the back, behind all the other objects in the drawing, or you can bring it
    to the front, placing it in front of all the objects in a drawing.


    You can align one or more objects with other objects in a drawing. To do this,
    you must first select the objects in the drawing that you want to align. You can
    use the Selection tool to select multiple objects in a drawing. To do this, you
    can press and hold the Shift key while selecting each object. When you select
    multiple objects, you can align them in relation to each. For example, Objects
    can align vertically or horizontally. To align horizontally, you choose to align
    them to the right, or center. When you align objects to the top, bottom, or sides,
    you can align them with the point or side closest to the side to which you align.
    For example, when aligning objects to the right, the right-most point of each
