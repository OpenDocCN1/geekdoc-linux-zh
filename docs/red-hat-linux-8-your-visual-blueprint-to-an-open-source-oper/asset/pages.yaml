  md: '# CLOSE AN APPLICATION


    You can close an application that you no longer need to use. Closing an application
    that you are not using frees up resources, such as memory, and makes those resources
    available to other applications that may be running. Even an application that
    is not performing a task, such as a word processing application that contains
    no documents, uses some resources.


    also has a button in the upper-left corner that contains options you can apply
    to the window, including closing the window of any running application.


    Many applications have their own menus that contain a method of closing the application.
    For example, most word processing applications contain a list of menu choices
    that include an Exit command to close the application.


    All windows that display in a graphical environment have a small button with an
    X in the upper-right corner. You can click the X Icon to immediately close the
    application. This method of closing applications is also used on other operating
    systems besides Linux.


    In graphical applications, the application appears in a window that you can move
    and resize. The display window


    If your application works with data, such as a spreadsheet, you should save the
    application''s data before you exit the application. Most applications will warn
    you if closing the application will result in the loss of any unsaved data.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_175_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_175_1.png)


