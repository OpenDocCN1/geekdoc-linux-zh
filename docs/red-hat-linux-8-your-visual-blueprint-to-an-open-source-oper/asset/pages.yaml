    can provide you with a Web site, or you may already have a Web site available
    from your Internet service provider (ISP). After creating your Web pages, you
    should consult your ISP for instructions on how to transfer the Web pages to the
    Web server.


    You can create hyperlinks to documents that you store on your own computer as
    well as on the World Wide Web. To create a hyperlink to a local file, click the
    Choose File button in the Link Properties dialog box. In the selection window
    that appears, specify the name of the local file you want to use and then click
    OK. Click OK in the Link Properties dialog box.


    When you choose a title for your Web page, try to pick a title that is descriptive.
    For example, instead of using the title Results, use Spring cycles for 5 mile
    run. This is especially important for Web pages that may be categorized by search
