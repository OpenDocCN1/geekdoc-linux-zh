  md: '# MANAGE PACKAGES USING RPM


    You can use the RPM utility to manage the installed packages on your computer.
    Improved and new features are added all the time. Whenever a change is made to
    the package number becomes updated. For example, if you are creating a version
    of the text editor is 1.1, then the next version of the text editor could be 1.2.


    If you no longer need a package, or you are experiencing trouble with a particular
    package, you can remove it from your computer. When removing a package, all the
    files associated with it are removed, including the log and configuration files.
    However, any data that you created using this package is not removed.


    When an updated version of a package is available, you can update the package
    on your computer to take advantage of the new features. Updating a package means
    that you do not have to remove the old package and then install the new version
    of the package. If you try to update a package that does not exist on your computer,
    the package is installed by the RPM utility. By default, the RPM utility only
    updates existing packages with newer versions of the same packages.


    You should be careful when removing some packages from your computer, as they
    may be needed by other applications. For example, you may remove a spell checker
    application that is being used by a word processor. To ensure that you do not
    remove important system files required by Linux, you should only remove packages
    that you have installed.


    # UPDATE A PACKAGE


    ```

    [root@localhost #] rpm -U --percent whois:1.0.10-4.i386.rpm

    warning whois:1.0.10-4.i386.rpm: Header DSA signature: NOKEY, key ID 897da

    07a

    0: 000000

    1: 0435699

    2: 1506941

    3: 6633214

    4: 655841

    5: 949570

    6: 9627092

    7: 9918871

    8: 1000000

    [root@localhost #]

    ```


    +   1 Open a Terminal window.


    +   2 Type rpm --percent followed by the package name and press Enter.


    +   3 When the percentage reaches 100, the package is installed.'
