  md: '# Extra


    OpenOffice.org saves documents using the XML formatting structure. When you save
    your OpenOffice.org documents using XML, you are ensuring that you can use and
    share your documents with many office applications. Using the XML data format
    also results in a smaller file size, thus saving storage space.


    When you save a document in OpenOffice.org for the first time, a Light Bulb icon
    (💡) may appear in the lower-right corner of the document. Selecting this icon
    allows you to access information about the current task you are performing. For
    example, when you save a document for the first time, information appears about
    the OpenOffice.org file format. To access the information, double-click the Light
    Bulb icon (💡).


    OpenOffice.org comes with a printer configuration utility that you can use to
    set up applications to work with your printers. You can even choose to output
    your documents as PDF format files to make them easier to share with others. To
    start the OpenOffice.org printer configuration utility, click the Main Menu button,
    click Office, and then click OpenOffice.org Printer Setup.


    # PRINT A DOCUMENT


