  md: '# SEARCH FILES IN VI


    You can search through files in vi to locate specific phrases or words. The search
    capabilities in vi are an important feature, and although somewhat challenging
    to learn, they are worthwhile to know.


    You can search for any combination of characters, including text and numbers.
    To begin a search in vi, you must first be in Command mode. You can ensure that
    vi is in Command mode by pressing the Esc key.


    Once you are in Command mode, you must press the forward slash (/) key to type
    the text you want to find. The text you type appears at the bottom of the display.
    You can press the Enter key to start the search.


    vi locates the first occurrence of your search text and the cursor at that location
    in the file. If you search for more than one character, then the cursor is placed
    on the first character of the search text located within the file.


    vi can locate additional occurrences of your search text without requiring that
    you retry the text. For example, you may want to search a document for all the
    instances of a phone number. After vi locates the first occurrence of the specified
    text, you can move the cursor to the next occurrence by pressing the n key.


