  md: '# RED HAT LINUX 8


    # SHUT DOWN A LINUX SYSTEM


    You can shut down your computer to perform system or hardware maintenance, to
    prevent an electrical outage, or when you may not need to access it again for
    an extended period, such as overnight.


    You can shut down your computer from the main login screen or from the desktop
    environment. Shutting down from the main login screen is useful if you cannot
    log in to a Linux system because of a malfunction, or because you do not have
    a user account that allows you to access the system. There are no security requirements,
    such as the need for a password, for a user to shut down a computer if the computer
    is left on the main login screen.


    Once you are logged in to a Linux system using a graphical environment, you can
    shut down the computer from the Main Menu. You do not need to log out of a Linux
    system if you want to shut down. Linux automatically logs out all users before
    shutting down the computer. If possible, you should Linux automatically logs out
    all users before shutting down the computer. If possible, you should inform anyone
    connected to your computer before you shut down the computer to prevent others
    from losing data or interrupting their work. Before shutting down a Linux system,
    you should close any open applications and save any unused data.


    You should never shut down a computer by simply turning off the power to the computer.
    Loss of data and possible file corruption can result from a shutdown that does
    not use the proper Linux shutdown procedure. If your computer has power management
    capabilities, it typically powers off after Linux is shut down.


    # SHUT DOWN FROM THE DESKTOP


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_51_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_51_1.png)


