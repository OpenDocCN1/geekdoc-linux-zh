  md: '# CREATE A TEXT DOCUMENT


    You can create a text document to save information, such as a letter. Many files
    on a Linux system are text documents that you can edit with a text editor. Information
    such as the computer name, or more complex information as the video configuration,
    is stored in text documents on your Linux system.


    A word processor is the application used to create text documents. A text editor
    is similar to a word processor, but usually does not contain as many features
    as a word processor, such as a spell checker or advanced text formatting features.


    Red Hat Linux includes many text editors. Some are full-fledged word processing
    applications, such as Office


    Writer, while others are basic text-based text editors suited for creating small
    documents quickly, such as the text editor vi. For more information about Office
    Writer, see page 122. For more information about the text-based editor, see Chapter
    15.


    Linux has a simple graphical-based text editor available in the accessories group
    available in the Main Menu. The text editor is suitable for creating text documents,
    but does not include any advanced features, such as a spell checker.


    After you save a text document, you can close the editing application. You can
    open the text document later to view or modify using another text editor or word
    processor.


    # CREATE A TEXT DOCUMENT


