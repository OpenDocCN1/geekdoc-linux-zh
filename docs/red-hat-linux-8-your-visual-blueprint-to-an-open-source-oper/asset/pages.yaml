- img_proc: true
  md: '# Extra


    Errors can occur for many reasons when you are setting up and installing the GIMP.
    One common cause of errors is the installer not having the appropriate permissions
    to allow file copying and directory creation.


    The GIMP program should not be used on computer systems with older video cards.
    If your video card can display a maximum of 256 colors, you should consider upgrading
    your video card before you attempt to use the GIMP application.


    If the GIMP is not installed on your Linux system, you can install it with your
    Linux installation CDs using the Package Manager. For more information about using
    the Package Manager, see Chapter 13. If you do not have the installation CDs,
    you can use the Package Manager to obtain the GIMP from the Red Hat Web site.
    Alternatively, you can download a complete copy of the GIMP software from the
    main GIMP Web site at www.gimp.org.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_208_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_208_1.png)


