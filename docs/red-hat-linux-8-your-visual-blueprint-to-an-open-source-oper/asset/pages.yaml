  md: '# Extra


    There are many different instant messaging services on the Internet and many different
    software applications that you can use to communicate with these. If you want
    to use other instant messaging services, you may have to use another instant messaging
    application. Jabber is one of the more popular instant messaging software clients.
    You can download Jabber for Linux systems at www.jabber.com.


    You can use the same screenname to access your instant messaging service on multiple
    computers. You can even use the same screenname to access instant messaging software
    on computers running different operating systems. For example, if your computer
    can boot into Windows or Linux, you can use Gain with Linux and the AOL screenname
    with Windows.


    If you sign on to an instant messaging service on one computer and attempt to
    sign on to the service on another computer, the instant messaging service automatically
    signs you out of the location that you are not using.


