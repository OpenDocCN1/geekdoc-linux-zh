  md: '# ADD A DRAWER


    You can add a drawer to the panel to organize the objects you want to add to the
    panel. A drawer is just like adding an additional panel to your computer. Any
    object that you can add to the panel you can add to a drawer.


    Using drawers on the panel enables you to group objects together. For example,
    you can create a drawer that contains system monitor applets that allow you to
    monitor the status of the Linux system you could use another drawer to display
    multimedia applets that you use to play audio and video files.


    Adding drawers to the panel enables you to reduce the amount of space you use
    on the panel. If you have many applets, the panel may not be large enough to simultaneously
    display all of the applets at once. By using


    drawers, you can still access any number of panel objects while still minimizing
    the amount of space used on the panel. You can add as many drawers as you like
    to the panel.


    After you add a drawer to the panel, you can add objects to the drawer. You can
    add objects to a drawer the same way you add an object to the panel. For more
    information about adding, see page 50.


