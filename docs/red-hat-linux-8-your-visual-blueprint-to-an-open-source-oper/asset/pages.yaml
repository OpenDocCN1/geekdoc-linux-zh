  md: '# CREATE AN EXECUTABLE FILE


    You can change the permissions of a regular file to make it an executable file.
    An executable file is one that contains Linux commands. You can create a file
    that contains commands by using a simple text editor or by creating a new file
    that contains the echo command to paint a single command, or a series of commands
    separated by a semicolon, into a new file. After you create the new file, you
    can make the file executable to run those commands.


    After you make a file executable, you can use the `ls -l` command to display the
    file listing and verify that you have set the executable permissions. When listing
    files and directories, Linux systems may display executable files in a different
    color or a bold font to make them easier to locate.


    By default, you must fully specify the name of the directory that contains an
    executable file. If you are currently in the directory that contains the executable
    file, you can use the location code `./` to represent the directory location of
    the file.


    You can change a file to executable by using the `chmod` command. For more information
    about the `chmod` command, see page 284. To specify permissions, instead of using
    an octal number use the abbreviation `+x` to make the file executable for all
    users and groups.


    Even though a file may itself be executable, if you want to execute other commands,
    you must have the permissions for those commands as well as access to those executable
    files.


    # CREATE AN EXECUTABLE FILE


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_307_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_307_1.png)


    +   1 In the Terminal window, use the code to create a file containing a command.


    +   This example uses the echo command to create a file called status that displays
    the date, time, and username.


    +   2 Press Enter.


    +   3 Type chmod +x.


    +   5 Press Enter.


    +   4 Type the name of the file you want to make executable.'
  merge: -1
