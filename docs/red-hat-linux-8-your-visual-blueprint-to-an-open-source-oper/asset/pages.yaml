  md: '# CHANGE FILE OWNERSHIP


    You can change the ownership of a file to reassign the file to a different owner.
    You can use the `chown` command to change the ownership of a file. To use the
    `chown` command, you must specify the new user account to you want to assign the
    file as well as the name of the file. You often use the `chown` command when you
    are creating files in the directories of other users while you are logged in using
    the root account. Other users are often unable to access files that have the root
    as owner. The root account has full access to every file on the system, the ability
    to change the ownership of each file.


    You can view the ownership of a file or directory by using the `ls -l` command
    to display the file or directory listing. The owner name appears right after the
    file or directory permissions.


    After you transfer a file to a new owner, the previous owner can only access the
    file based on the current permissions set for the file. The new owner now has
    full access to the file.


    The username you specify using the `chown` command must already exist on Linux.
    You cannot assign ownership of a file or directory to a username and then create
    the user. When you remove an account, any files that you have assigned to that
    user account still retain the user account as the owner.


    As well as files, you can change the ownership of directories. To perform this
    function, you use the `chown` command, just as you would to change file ownership.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_303_0.png)


    ```

    [root@localhost data]$# mkdir directory

    [root@localhost data]$# touch file1

    [root@localhost data]$]

    ```


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_303_1.png)


    +   1 In the Terminal window, type the code to create a directory.


    +   2 Type touch followed by the name of a file you want to create.


    +   3 Press Enter.


    +   4 Press Enter.


    +   5 Type ls -l.


    +   6 Press Enter.


    +   7 The owner of the directory and file appears.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# ESTABLISHING FILE AND DIRECTORY PERMISSIONS


    # Extra


    You can recursively change the ownership of a directory and any subdirectories
    or files in the directory. This is useful for transferring all the files in an
    old account to a new account. To recursively change ownership, use the -R parameter
    of the chown command.


    Example:


    ```

    chown -R directory1

    ```


    If a user has read access to a file but does not have ownership of the file, then
    the user can simply copy the file, thus creating a duplicate that they own. To
    prevent users from modifying sensitive files, you should always take steps to
    ensure that your files are only available to authorized users.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_304_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_304_1.png)


