  md: '# WORKING WITH APPLICATIONS


    # Extra


    In the task list, the description of each task appears. To the right of each task
    description is a check box that indicates whether the task has been completed.
    To indicate that a task is complete, click the check box to the right of the task
    description in the task listing. Each time you complete a task, the task description
    appears with a line through the description indicating the task is complete. You
    can display, and later modify, the information for a task that you have already
    created. This allows you to update the task with changing information, such as
    scheduling the task for a different time. To display the information for a task,
    click the Notepad icon in the first column of the task list next to the task description.


    If a task involves another person, you can assign the task to that person. Click
