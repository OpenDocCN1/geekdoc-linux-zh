  md: '# VIEW HARDWARE CONFIGURATION


    You can view the hardware configuration of your hardware system if you need details
    about your hardware configuration to help you troubleshoot a problem with your
    Linux system. For example, if media player does not play an audio CD that you
    placed in the CD-ROM, you can view the hardware configuration to determine if
    the hardware browser can detect the CD-ROM. If the hardware browser does not detect
    the CD-ROM, the CD-ROM may have failed or have been disconnected.


    You can use the Hardware Browser to view details about the individual hardware
    items of your computer. For example, you might want to install a new game that
    requires a specific type of sound system. You can use the Hardware Browser to
    view the type of sound system before you install the game.


    When the Hardware Browser starts, it examines the hardware connected to the computer
    and collects the details about the individual hardware components. You can then
    view the details that the Hardware Browser has collected. The Hardware Browser
    may take a number of minutes to collect the information about the computer. During
    this time, you should not use your computer.


    The Hardware Browser will not detect all the connected hardware to your computer,
    such as printers, external modems, and devices. The Hardware Browser will typically
    detect internal computer components such as storage devices and video and sound
    systems.


