  md: '# LOGGING IN TO A LINUX OPERATING SYSTEM


    # Extra


    If you are logged in to a Linux system using a text-based console via Telnet or
    a Terminal window you can reboot the computer using the shutdown command. The
    shutdown command used with the -r option instructs the Linux system to shut down
    the computer and restart, booting Linux you must specify a time to take place.
    To reboot the computer in five minutes using the command prompt, type shutdown
    -r and press Enter.


    There may be times when the system becomes unresponsive and you may not be able
    to reboot the computer from Linux. This is most likely the result of a malfunctioning
    application. When you cannot reboot a computer from Linux you can reboot using
    the reset or power buttons of the computer. Rebooting a computer with the power
    or reset buttons may take longer to restart as it checks the computer to detect
    and repair any data errors that may have been caused when the computer was rebooted.


    Hardware problems are typically detected and reported when the computer reboots.
    If your computer is experiencing hardware problems, such as a defective keyboard,
    the computer may not completely reboot until the error is corrected. Many hardware
    errors can go unnoticed until the computer is rebooted.


    # REBOOT FROM THE DESKTOP


