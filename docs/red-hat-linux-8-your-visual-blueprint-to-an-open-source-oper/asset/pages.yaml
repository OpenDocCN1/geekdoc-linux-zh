  md: '# FORMAT A FLOPPY DISK


    You can format a floppy disk to erase the information on the disk or to prepare
    a new disk to store information. Floppy drives have a built-in mechanism to prevent
    the accidental formatting of a high density disk. Each disk has a rectangular
    hole at one of the corners with a sliding tab that can cover the hole. If the
    tab is not placed over the hole, formatting is not possible. To ensure you can
    format the floppy disk, you must slide the tab into position, obstructing the
    hole.


    Floppy disks come in two sizes, high density and low density. Low-density disks
    can store approximately 720 kilobytes of information while high-density disks
    can store approximately 1440 kilobytes of information. The size of the disk will
    be marked on the floppy disk. You must specify the size of the floppy disk that
    you want to format. By far the most commonly used disk size is high density.


    Each floppy disk uses a file system to determine how the information can be stored
    on the floppy disk. You typically choose between two file systems when formatting
    a disk. The ext2 file system is the file system used primarily by Linux on floppy
    disks while the FAT file system, referred to as DOS (fat), is mainly used by computers
    running the Windows operating system. The ext2 file system offers slightly faster
    access and a bit more storage space than the FAT system if you intended to transfer
    information with Windows.


    If there is any information on the floppy disk, it will be permanently erased
    when the floppy disk is formatted.


    # FORMAT A FLOPPY DISK


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_117_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_117_1.png)


