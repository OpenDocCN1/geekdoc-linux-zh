    +   - Click Extras.


    +   - Click Sound & Video.


    +   - Click grip.


    +   - Click the Main Menu button.


    +   - The Grip window appears and displays a track listing.


    +   - Select the track you want to copy.


    +   - Click the Rip tab.


    > Note: To retrieve disc information, you need a connection to the Internet.'
