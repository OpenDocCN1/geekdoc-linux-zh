  md: '# ESTABLISHING FILE AND DIRECTORY PERMISSIONS


    # Apply It


    To make the change to the path environment variable, add the code that changes
    the path to the .bash_profile login script in your Home directory.


    By default, the shell path does not include the current directory. This is a security
    measure because it requires you to enter the precise location of a file you want
    to execute. This prevents the inadvertent execution of other files on the Linux
    system that use the same name. You can add the current directory to the path of
    the shell by appending the current directory to the path of the shell environment
    variable and exporting that variable.


    ```

    TYPEINS

    PATH=$PATH:./*

    export PATH

    status

    ```


    ```

    RESULT

    Mon Jun 3 10:30:15 EDT 2002

    andrew

    ```


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_308_0.png)


