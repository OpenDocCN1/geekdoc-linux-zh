  md: '# RED HAT LINUX 8


    # FORMAT TEXT IN OPENOFF.ORG WRITER


    You can change the appearance of the text by using the formatting features of
    OpenOffice.org Writer. Formatting text allows you to emphasize important items
    in your document and to make the documents easier to read.

    The first step in formatting text is to select the text you want to change. You
    can do this by clicking and dragging the mouse cursor over the text you want to
    select. When you select text, it reverses color with the background to make the
    text visible. If you want to select more than one section of text, you must hold
    down the Ctrl key while making multiple selections. This allows you to quickly
    format isolated sections of text, such as paragraph headings, and format them
    all at once.

    OpenOffice.org Writer has many tools that you can use to change the appearance
    of text. The formatting changes that


    you make to the text depend on the effect you want to achieve. For example, you
    may want to change the font of the text in your document to make it visually interesting
    or easier to read. You should remember that a serif font, such as Times New Roman,
    is harder to read on screen but easier to read on paper than a sans serif font
    such as Helvetica. This could be an important factor as many documents appear
    exclusively on computer going to print all.

    The most changes that you make to document text are to apply bold or italic formatting.
    When you apply italic formatting to text, the text slants forward. Another type
    of formatting is highlighting, which reverses text against the background. All
    of these formats add emphasis to the text.


    # FORMAT TEXT IN OPENOFF.ORG WRITER


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_189_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_189_1.png)


    CHANGE THE FONT

    1 In a document that contains text, press Ctrl.


    Click and drag to select the text which you want to apply formatting.


    Click and select a new font.


    The selected text changes to the font you selected.


    174'
