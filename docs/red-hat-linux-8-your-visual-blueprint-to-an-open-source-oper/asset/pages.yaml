  md: '# CONFIGURE E-MAIL SETTINGS


    You can use a Linux system to send and receive e-mail messages to and from people
    on the Internet. To send and receive e-mail messages, you can choose from a wide
    variety of e-mail programs. You can use the Evolution program that installs with
    Linux to send and receive e-mail messages. Before you use Evolution, or any e-mail
    program, you must configure the program with your own e-mail settings.


    incoming and outgoing e-mail servers are the same. You should contact your Internet
    service provider for the names of your incoming and outgoing e-mail servers.


    When you start the Evolution program for the first time, the Account Wizard guides
    you through the initial configuration of the program. The Account Wizard asks
    you to specify your name and the e-mail address of your account as well as the
    name of the e-mail server that you use to send and receive e-mail messages. In
    many cases, the name of the


    When you want to read your e-mail messages, you must contact the e-mail server
    to retrieve those messages. An e-mail server is a computer that stores e-mail
    messages.


    There are two methods of receiving e-mail messages, POP and IMAP. Most users use
    the POP method. However, if your e-mail server is on a company network, you may
    use the IMAP method of receiving e-mail and should contact your network administrator
    for more information about configuring your e-mail program.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_165_0.png)


