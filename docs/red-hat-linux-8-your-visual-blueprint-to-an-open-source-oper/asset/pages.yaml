  md: '# START THE GIMP


    Linux comes with many tools, utilities, and applications. You can use an application
    called the GNU Manipulation Program, or the GIMP, to create and manipulate images.
    The GIMP is a very sophisticated application and primarily, the reason many people
    use Linux. As far as capabilities and ease of use, the GIMP compares favorably
    with any other image program available on any other operating system. The GIMP
    uses the X Windowing System with Unix-like operating systems. The GIMP is the
    same regardless of which operating system you are using.


    Before installing the GIMP, you must agree to a license agreement that accompanies
    the GIMP application. The GIMP is available free and there is no charge for its
    use.


    You must specify if you want the GIMP to store any files that it will use to operate,
    such as image locations. You must have full disk and access permissions in the
    directory that you choose to create the GIMP directory.


    When the GIMP, and most other applications, access large amounts of data, such
    as images, computer memory is exchanged with a called swap file. A swap file allows
    you to work with large images in GIMP. You must specify the directory to locate
    the swap file. This location needs to have enough space available to it to accommodate
    large swap files, sometimes up to 1 gigabyte in size.


    The GIMP can only be used when Linux using a graphical interface. The GIMP is
    accessible from the Graphics submenu of the Main Menu. Before running the GIMP
    software for the first time, you will have to configure some options.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_207_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_207_1.png)


    +   1 Click the Main Menu button.


    +   2 Click Graphics.


    +   3 Click The GIMP.


    +   The GIMP User Installation license appears.


    +   4 Click Continue.'
  merge: -1
