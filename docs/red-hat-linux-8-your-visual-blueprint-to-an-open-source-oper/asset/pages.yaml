  md: '# CONFIGURE A SCREENAVER


    You can use a screensaver to display effects and animations on your screen when
    the computer is not being used. Screensavers were originally designed to prevent
    monitors from becoming permanently damaged by displaying the same image for a
    long time. This is known as monitor burn. Computer monitors are no longer susceptible
    to this type of damage, but people still use screensavers to access protection
    and for their entertainment value.


    allow you to choose the number of stars that appear. Many screensavers share common
    options, such as the animation speed of the screensaver. You can configure each
    screensaver individually from the others. When you change the screensaver options,
    they remain in effect for that screensaver even if you do not use it.


    The KDE comes with a wide range of screensavers to choose from, some more elaborate
    than others. As well as choosing an individual screensaver, you can also adjust
    how each screensaver works.


    Some screensavers involve use of complex graphics. These screensavers can use
    many computer resources, such as processor power and memory. For example, if you
    are performing a processor-intensive task, such as calculating large formulas
    in a spreadsheet, you may want to disable the screensaver to increase the processing
    speed of your task. The screensaver becomes active when you do not use the keyboard
    or the mouse for an extended time, which by default, is five minutes.


    Each screensaver may have a number of configuration options; for example, a screensaver
    that displays may-


    # CONFIGURE A SCREENAVER


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_105_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_105_1.png)


