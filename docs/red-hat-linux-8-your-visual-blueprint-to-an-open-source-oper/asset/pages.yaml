  md: '# INSTALL LINUX (CONTINUED)


    When you install Red Hat Linux, you must indicate the type of mouse that you are
    using with your computer. If you cannot find your mouse type, you can simply choose
    a generic mouse type that best matches the description of yours.


    Before installing Linux, you may need to partition the hard drive of your computer.
    The Linux installation program can automatically partition the hard drive for
    you. Users who are more familiar with the Linux operating system can also choose
    to partition the hard drive manually. When you manually partition your hard drive,
    you can specify what type of file systems and what partition sizes you wish to
    use. You can use the Disk Drill or the Idisk program to manually partition your
    hard drive. Experienced users prefer Disk Drill, while intermediate users prefer
    Druid.


    You can choose from four Linux installation options: a workstation, a server,
    desktop, or custom files and programs that your computer would require in a typical
    layout. The server option is for computer that you use as a network server, or
    for the installation of more advanced software. The desktop option is suitable
    for most home users. The custom option allows you to configure the installation
    to match your requirements. For most users, the personal desktop option


    If you are installing Linux for the first time, it is easier to install Linux
    on a clean computer that contains no other operating systems. Before erasing any
    information on your hard drive, the Linux installation program asks you to confirm
