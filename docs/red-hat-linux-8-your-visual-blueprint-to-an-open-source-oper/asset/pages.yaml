  md: '# RED HAT LINUX 8


    # CREATE AN ALIAS


    You can create an alias to save time and prevent errors when using Linux commands
    within a Terminal window. Alias help prevent errors by using one simple command
    to represent a larger, more complex set of commands. For example, if the command
    to mount a CD-ROM appears as mount /dev/cdrom, then you can use an alias, simply
    called mounted. This is especially useful if you use the same long shell commands
    repeatedly.


    You can create an alias by specifying the name of the alias and using the equals
    sign to assign the commands to the new alias. If an alias uses commands that contains
    a space, such as a command that uses parameters, the command must be enclosed
    within quotes.


    Aliases also make commands easier to understand. Linux commands are often cryptic
    and do not give any indication as their function. For example, the Linux command
    ls displays the contents of the current directory. You can use the alias command
    to create a more familiar alias, such as dir, the directory listing command familiar
    to users of the MS-DOS operating system.


    Aliases can contain any commands that you can enter at the shell command line.
    If you are using multiple commands, you must separate each command with a semicolon.
    When you create an alias, you should check the operation of the alias to ensure
    that there are no errors when typing the command or commands that you assign to
    the alias.


    The method you use to create aliases may depend on the type of shell you use.
    If you use a shell other than the bash shell, then consult the documentation for
    your shell for information on creating aliases. Information about changing the
    shell type, see page 230.


    # CREATE AN ALIAS


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_243_0.png)


