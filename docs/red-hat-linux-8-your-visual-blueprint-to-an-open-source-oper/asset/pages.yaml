  md: '# RED HAT LINUX 8: a visual blueprint to an open source operating system


    Chapter 2, "Configuring Hardware," shows how to configure or change the settings
    of common computer hardware devices.


    Chapter 13, "Working with Packages," shows you how to import, remove, and install
    Linux applications.


    Chapter 3, "Logging into a Linux Operating System," details the number of different
    ways you can access the Linux Red Hat 8 system.


    Chapter 14, "Working in the Terminal Window," shows how to utilize your Linux
    system using a text-based interface.


    Chapter 4, "Working with the Graphical Desktop," shows you how to use and configure
    GNOME 2.0, the default desktop environment.


    Chapter 15, "Using the Vi Text Editor," details vi, the text editor available
    on almost all Linux systems.


    Chapter 16, "Working with Files and Directories," shows the processes involved
    in file creation and organization.


    Chapter 5, "Working with KDE," provides you with information on using KDE, a popular
    alternative desktop environment.


    Chapter 17, "Performing System Administration," shows you how to perform common
    administration tasks.


    Chapter 6, "Working with Storage Media," shows you how to perform common tasks
    with media such as floppy disks.


    Chapter 18, "Working with User Accounts," shows how to turn your Linux system
    into a multi-user environment.


    Chapter 7, "Working with Audio," shows how you can use your Linux system to record
    and playback audio.


    The final chapter, "Establishing File and Directory Permissions," demystifies
    the complicated rules file access and creation.


    Chapter 8, "Configuring Internet Connections," details how to connect your Linux
    system to the Internet.


    Chapter 9, "Working with Internet Applications," lets you see the various Internet
    applications that you can use with Linux.


    # What''s On The CD-ROMs


    The CD-ROMs included in this book contain the Red Hat Linux 8.0 Publisher''s Edition.


    Chapter 10, "Working with Applications," shows how applications work on a Red
    Hat Linux system.


    Chapter 11, "Using the OpenOffice.org Suite," details the components in the OpenOffice.productivity
    suite.


    Chapter 12, "Using the GIMP," lets you create and manipulate images using one
    of the most popular Linux applications.'
