  md: '# CONNECT TO A NEWS SERVER


    You can use Mozilla to connect to a news server to read news messages. News servers
    are an excellent resource for technical support from fellow enthusiasts, not just
    computing tasks, but also for a wide variety of issues from automotive to parenting.
    Should not confuse news servers with news items that are found in a newspaper.


    News servers store messages, or news, from all around the world. These messages
    travel from news to server in a process called propagation. It takes relatively
    short for a message to propagate to thousands of news servers across the globe.
    USENET, for short the term Users Network, is the global collection of news servers
    that connect via the Internet.


    Newgroup messages are similar to e-mail messages. Each message has a subject line
    that describes the topic


    of the message. Each message also indicates who created the message. Most Internet
    service providers have a news server that you can access. You must connect to
    these news servers to obtain messages from them. Mozilla Wizard will help you
    set up your news server. Mozilla requires that you specify your name and e-mail
    address before you connect to a news server. You must also specify the name of
    your news server, which you can obtain from your news server provider.


    You can specify an account name, such as Work Account, the news server to which
    you are connecting. If you connect to multiple news servers, this makes it easy
    to distinguish them.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_151_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_151_1.png)


