  md: '# USING THE OPENOFFICE.ORG SUITE


    # Extra


    OpenOffice.org is based upon the popular StarOffice 6 productivity suite from
    Sun Microsystems. OpenOffice.org is available for a number of platforms, apart
    from Linux. You can obtain more information about OpenOffice.org, as well as versions
    of OpenOffice.org for other operating systems, from the Web site at www.openoffice.org.


    You can open documents that you create with other word-processing applications
    on different operating systems with OpenOffice.org Writer. You should keep in
    mind that some documents might not appear exactly as you originally formatted
    them in the other application.


    Because OpenOffice.org Writer is part of a suite of applications, it integrates
    with all the applications in the suite. One of the benefits of this integration
    is that you can quickly create documents with other applications with Writer.
    To create a new document with another application, click File, New, and select
    the document type you want to create. OpenOffice.org starts the appropriate application
    to create the document you want.


