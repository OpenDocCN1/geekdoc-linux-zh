    Once you save your Web page in the Mozilla Web browser, you can start a new instance
    of Mozilla to display your Web page within Composer. It is not unusual for a Web
    page to look slightly different within Composer than it does in Mozilla.


    Once you load the Web page into Mozilla, you can click any of the hyperlinks on
