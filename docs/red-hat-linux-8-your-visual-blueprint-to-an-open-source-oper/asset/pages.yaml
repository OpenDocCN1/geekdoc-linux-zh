  md: '# RED HAT LINUX 8


    # START MOZILLA


    You can use the Mozilla Web browser to view pages on the World Wide Web. The Mozilla
    Web browser is based on the Netscape Navigator browser which is why the appearance
    and functionality of Mozilla is very similar to Netscape Navigator.


    You must correctly configure and establish a connection to the Internet to view
    pages on the World Wide Web. When you first start the Mozilla Web browser, the
    Red Hat registration Web page appears. This is the default Mozilla Web page. When
    you enter the address of a Web page, Mozilla attempts to retrieve the Web page
    from the World Wide Web. If Mozilla successfully retrieves the Web page, the Web
    page downloads and appears.


    Depending on the size of the Web page and the speed of your Internet connection,
    it may take a few moments for the Web page to load and display. Mozilla displays
    a progress indicator at the bottom of the window to indicate the status of the
    page as it downloads.


    The Mozilla Web browser is not restricted to the Linux operating system; you can
    also use Mozilla on other operating systems such as Windows and Mac OS. For more
    information about Mozilla, see the Mozilla Web site at www.mozilla.org.


    # START MOZILLA


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_141_0.png)


