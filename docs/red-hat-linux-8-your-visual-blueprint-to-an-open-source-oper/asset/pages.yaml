  md: '# READ E-MAIL MESSAGES


    You can use the Evolution program to read e-mail messages that other users send
    to your e-mail account. Evolution allows you retrieve e-mail using multiple e-mail
    accounts. You can select which e-mail account you want to check messages.


    When you attempt to retrieve e-mail messages, you must specify the password for
    the e-mail account. The password for the e-mail account is available from your
    Internet service provider (ISP). Once you enter the password, Evolution contacts
    the incoming mail server and determines whether there are any new e-mail messages
    waiting for you. If there are no new e-mail messages, Evolution displays a message
    of this.


    Evolution organizes your e-mail into folders. For example, when you send e-mail
    to another person, the program stores it in the Sent folder, and when you delete
    any e-mail


    messages, the program stores them in the Trash folder. When you receive a new
    message, Evolution stores it in the Inbox folder. When you select a folder, Evolution
    displays the messages found in the folder. You can select any message in the folder
    and display the contents of that message. The list of folders appears in the Shortcuts
    window on the left of the Evolution display.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_169_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_169_1.png)


