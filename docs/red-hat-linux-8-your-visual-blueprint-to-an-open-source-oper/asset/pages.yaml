  md: '# CONFIGURING INTERNET CONNECTIONS


    # Extra


    Red Hat Linux assigns names to the various serial ports on your computer, including
    the serial port to which the modem connects. All modems use a serial port connection,
    whether they are external modems that connect to a serial port on the computer,
    or internal modems that have a built-in serial port.


    Some Internet connections do not use modems, particularly high-speed connections.
    Even though the devices used for high-speed connections to the Internet are called
    modems, the connections do not modulate or demodulate and are thus only modems
    in name. These modems typically use a network interface to connect to the Internet.


