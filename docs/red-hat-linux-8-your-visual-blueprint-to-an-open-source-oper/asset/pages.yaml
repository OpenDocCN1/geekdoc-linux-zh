  md: '# START THE FILE MANAGER


    A file manager is a program that you use to display the contents of a directory
    and access files in the directory. You can also use the file manager to launch
    applications or open documents by clicking on the application or document icon
    in the display pane of the file manager. The file manager for the KDE desktop
    is the Konqueror Web browser with a slightly different display than when Konqueror
    is used to browse the World Wide Web.


    The file manager displays the contents of the directory as icons with the title
    of the file below each icon. The type of icon that represents each file depend
    on which type of file it is. For example, an icon that looks like a typed letter
    represents a text file.


    You can change the appearance, or view, of the contents of a directory. By default,
    all items appear as an icon with the name below the icon. You can change the display
    so that additional information appears, such as file size and the last modification
    date of the file. The multicol view allows you to format the display of the contents
    into columns of data as opposed to just icons.


    When Linux creates a user account, it automatically creates a Home directory for
    that user. The Home directory is the primary directory of the user; it is where
    a user typically stores information, documents, and other data. Applications also
    use the Home directory of a user to store information. You can start the file
    manager and have it display the contents of your Home directory.


    # DISPLAY CONTENTS OF HOME DIRECTORY


