  md: '# WORKING WITH APPLICATIONS


    # Extra


    You can always use the windows option to close an application, even if the application
    contains its own method of shutting down. However, if an application includes
    its own method of shutting down, you should use that method instead.


    While most graphical applications are similar in their methods of shutting down,
    text-based applications vary widely in the methods used to exit the application.
    If you are unsure of the method used to close a text-based application, you should
    always refer to the application''s documentation before closing it.


    Some applications may fail to close after you attempt to close them. In many cases,
    Linux displays a message indicating that the application cannot be closed and
    allows you to kill the application. Killing an application immediately terminates
    the running application, resulting in the loss of any unsaved data.


    If an application simply fails to close, you may have to restart the Linux system
    to close the application.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_176_0.png)


