  md: '# ENABLE OR DISABLE A NETWORK DEVICE


    Some computers may have multiple network interfaces. For example, it is common
    for a portable computer to have a network interface and an inferred network interface
    that can be used to connect to a network.


    The network device control program is used to enable or disable network devices.
    The network device control program can indicate if a network device is active
    or not. Enabling or disabling a network device may take a number of minutes to
    finish.


    You can disable a network connection that you do not want to use. Having a network
    connection enabled when you do not use the connection may decrease the efficiency
    of the network.


    Your computer may have a network connection that you can use with another operating
    system, but do not use within Linux. For example, if you have a computer that
    you can switch between Windows and Linux, you may only use the network interface
    when using Windows. In that case, you should disable the network interface when
    you are using Linux.


    Disabling any network connections increases the security of your Linux operating
    system. This is particularly important if you are using the network connection
    to connect to the Internet, as when a network interface is connected to a DSL
    or cable modem.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_35_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_35_1.png)


    +   1 Click the Main Menu button.


    +   2 Click System Tools.


    +   3 Click Network Device Control.


    +   The Network Device Control window appears.


    +   4 Select the device you want to enable or disable.


    +   5 Click Activate to enable or Deactivate to disable the network device.'
  merge: -1
