  md: '# COPY AN AUDIO COMPACT DISC

    TO YOUR COMPUTER


    You can copy copies of CD audio tracks and store them on your computer, a process
    commonly referred to as ripping. Copying tracks from CDs enables you to store
    and pick selected songs and audio files from your audio collection. Red Hat Linux
    includes an application Grip that you can use to copy CDs.


    You can copy an audio CD file at a faster rate than when playing back the file.
    The amount of time needed to copy an CD depends on the type of CD-ROM drive and
    computer that you are using. Grip displays the speed at which the copy is being
    made while the copying process is taking place.


    Grip copies audio tracks to a file format WAV and saves the files on your computer.
    Grip can copy a single audio track or all of the tracks on the CD. You select
    each track that you want to. If the Grip program can determine the name of the
    audio CD, then creates a directory structure using the artist name and CD title.
    The resulting file receives the name of the track with .wav file extension added
    to the track name.


    Once the file is created, you can play back the file without accessing the original
    CD. For more information about playing back audio files, see page 112. Once the
    MP3 file is created, you can listen to the file on other platforms, such as computers
    that use the Windows operating system or even portable MP3 playback devices.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_125_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_125_1.png)


