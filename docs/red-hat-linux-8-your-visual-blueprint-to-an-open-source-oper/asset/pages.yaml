  md: '# RED HAT LINUX 8


    # USE SPREADSHEET CALCULATIONS


    You can use Calc to perform mathematical calculations. The true power of a spreadsheet
    application lies in the ability of the application to quickly and accurately manipulate
    and analyze data.


    themselves are very limited, but you can use spreadsheet formulas to perform calculations
    on specific cells in the spreadsheet. You can use cells as parameters in formulas,
    so when the numbers in the cells change, the results of the formula calculation
    also change. You can also use a cell that contains a parameter in another formula.


    The simplest and most popular calculation that is addition of numbers. When performing
    a calculation such as addition in a spreadsheet, you must insert a formula into
    the spreadsheet. A formula consists of a keyword, followed by a number of parameters.
    In the formula, the cells used to perform addition would include the numbers you
    want to add together, as in sum(1+3+4).


    Because the function is so popular, Calc includes a Sum button on the toolbar
    to help you quickly insert the results of an addition calculation. You can specify
    the cells that you want to include in the sum calculation.


    When you place a formula into a spreadsheet, the spreadsheet calculates and displays
    the results of the formula, not numeric calculations


    When you insert a formula into a cell, an equals sign precedes it to help Calc
    distinguish the formula from regular text. As you specify the cells to use in
    the sum function, the formula appears in the spreadsheet.


    # USE SPREADSHEET CALCULATIONS


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_205_0.png)


