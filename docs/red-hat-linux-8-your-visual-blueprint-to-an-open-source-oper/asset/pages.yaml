  md: '# WORKING WITH THE GRAPHICAL DESKTOP


    # Extra


    Most resizing and moving of application windows involve dragging the mouse pointer
    to a new location. Dragging a mouse pointer refers to the process of clicking
    the mouse button, holding the mouse button, moving the mouse pointer to a new
    location, and then releasing the mouse button.


    Application windows contain a title bar at the top of the windows that displays
    the application name. If you want to quickly remove an application from your display,
    simply double-click the title bar. The application continues to run, but the application
    window does not display. To redisplay the application, double-click the title
    bar again.


    Most application windows have scroll bars located at the right and bottom of the
    window. These scroll bars allow you to view the information in the window without
    having to continually resize or move the application. Each scroll bar has an arrow
    on either end of the scroll bar to indicate in which direction to move the content
    of the window. Scroll through the window that appears, simply click the direction
    arrows on either end of the scroll bars.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_60_0.png)


    # RESIZE A WINDOW


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_60_1.png)


    +   1 Start an application.


    +   2 Position over the edge or corner of the application window.


    Note: This step will not work if the application is maximized because you cannot
    reach the edges of the window.


    +   3 Drag the window edge to resize it and release the mouse button.


    +   The window appears as a new size.'
  merge: -1
