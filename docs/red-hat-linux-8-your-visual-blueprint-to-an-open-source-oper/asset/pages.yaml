  md: '# CHANGE THE APPEARANCE OF MOZILLA


    You can change the appearance of Mozilla to better suit your tastes. One way to
    do this is to choose a new theme. You can use a theme to control the appearance
    of various Mozilla features such as the toolbars, buttons, and scrollbars.


    You can choose a new theme for a practical purpose. For example, if you are using
    a laptop under bright lighting, you can use a theme that has more contrasting
    colors to make the Mozilla browser easier to see on the display. You may also
    select a theme simply because you like the look of that theme.


    By default, two themes install with Mozilla. Mozilla uses a Classic theme by default.
    However, if you want to give Mozilla a sleek appearance, you can change Mozilla
    to the Modern theme.


    When you apply a theme to change the appearance of Mozilla, it does not affect
    any Web pages that presently appear in Mozilla. The changes apply only to the
    Mozilla browser itself.


    When you change a theme, Mozilla presents you with a preview of the display for
    the selected theme. This allows you to easily compare themes before you choose
    one.


    Once you select a theme, you must restart Mozilla to apply the new theme. If you
    have multiple instances of Mozilla running, you must restart all of those instances
    to apply the theme.


