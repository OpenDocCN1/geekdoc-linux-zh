  md: '# VIEW THE SHELL COMMAND HISTORY


    You can use the shell history of commands to make command entry easier and more
    efficient. When you execute commands within the Linux shell, Linux keeps a record
    of all the commands you use.


    You can display a list of the most recently used commands, with a number beside
    each command. You can then use the number by each command to reuse the command
    without having to type it. To do this, use an exclamation point followed by the
    number of the command.


    For security and organizational purposes, you can eliminate all the commands within
    the command history. Once you clear the history list, any further commands you
    use appear on the new list of commands.


    The list of commands that you have used since starting the current instance of
    the Terminal window is stored in


    memory. When you exit the Terminal window, Linux appends the commands that it
    stores in memory to a file called .bash_history. You can use any simple text editor
    to modify or copy the contents of the .bash_history file.


    The shell history keeps track of all the commands that you enter at the command
    line, regardless of whether the command is valid or not. If you make a spelling
    error when typing a command name, the misspelled command appears in the command
    history even though it is incorrect.


    The method you use to view and use commands in the shell history may differ depending
    on the type of shell you use. If you use a shell other than the bash shell, then
    consult the documentation for your shell for information on using the shell history.
    For information about changing the shell type, see page 230.


    # VIEW THE SHELL COMMAND HISTORY


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_249_0.png)


    ```

    history

    1 ls

    2 ls -l

    3 du

    4 clear

    5 history # 11

    ```


