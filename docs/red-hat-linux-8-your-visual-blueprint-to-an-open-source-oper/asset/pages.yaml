  md: '# WORKING WITH STORAGE MEDIA 6


    # Extra


    It is not uncommon for floppy disks to become damaged, thereby, preventing them
    from being used. If the floppy disk you are attempting to format is damaged, Linux
    will display an error indicating that Linux cannot access track 0 and then stop
    the formatting procedure.


    Each floppy disk stores its information on a series of tracks. The first few tracks
    on a disk are used to store an index of the files stored on the disk. When formatting
    the disk, each track is formatted. To quickly format a disk, you can erase the
    index without having to format the other tracks on the floppy disk, thereby, saving
    time. To quickly format the disk, select the Quick format option in the Format
    a Floppy window.


    It may take a minute or two to format a floppy disk. If the formatting takes longer
    than five minutes, the disk may be damaged. While formatting a damaged disk may
    appear to repair the disk, it is best to discard any floppy disk that is damaged
    because it may be unreliable.


