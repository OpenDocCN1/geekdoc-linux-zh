  md: '# WORK WITH NEWSGROUP MESSAGES


    You can read messages that users post to newsgroups. Messages appear as a list
    of subjects and you can select the subject of a message you want to read. The
    text the message contains is called the body of the message.


    Many newsgroups periodically post guidelines that offer such information as topics
    of conversation, or the appropriate types of material that you may post. If you
    cannot find a copy of the newsgroup guidelines, it is good newsgroup etiquette
    to request a copy before posting. This avoids irritating some of the older users
    of the newsgroup.


    News servers store for a finite period. Some servers store for only a few days,
    while others store them for weeks. Different newsgroups may have retention times
    - the amount of time a message stores on the same news server.


    When you post a message to a newsgroup, it may take an hour or more for the message
    to post and propagate to news servers other than the news server to you connect.
    If you are posting a question, you should probably wait a day or two for others
    to read and reply to your question.


    You can post a message to a newsgroup to start a new discussion, ask a question,
    or simply introduce yourself. Before posting to a newsgroup, you may want to take
    some time to read the messages in the group. If you have a particular question,
    you may find that the question has already been posted and answered by others.


    # READ A MESSAGE


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_155_0.png)


