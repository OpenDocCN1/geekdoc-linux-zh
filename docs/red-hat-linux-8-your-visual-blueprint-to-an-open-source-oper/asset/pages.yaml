  md: '# RED HAT LINUX 8


    # USING THE NAUTILUS FILE MANAGER


    The Nautilus file manager enables you to view and access the contents of your
    computer. A file manager is an application that is used to navigate, locate, and
    access files and information stored on a computer. The Nautilus file manager that
    comes with Linux is a highly sophisticated file manager using icons, buttons,
    and other visual effects allow you to access the contents of your computer.


    Each type of file that the Nautilus file manager displays an icon associated with
    the file type. For example, a folder icon represents a directory, a page icon
    represents a file.


    You can choose which application Nautilus uses to open an item. When you select
    an item, Nautilus shows a preview of the image and then allows you to choose the
    application with which you want to open the file. You can access many file types
    using multiple applications; for example, you can open a text file in a text editor
    or a word processor.


    All users on a Linux system have a home directory where they can save their own
    files and programs. When the graphical desktop is installed, an icon labeled Home,
    prefixed with the user name. This icon allows the users to open the Nautilus file
    manager and display the contents of their home directory.


    You cannot open some items, such as directories, in an application. When you try
    to access a directory within Nautilus, the contents of that directory display.


