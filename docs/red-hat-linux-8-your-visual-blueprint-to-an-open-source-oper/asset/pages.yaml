  md: '# SAVE AND PRINT AN OPENOFFICE.ORG DOCUMENT


    After you create a document using an OpenOffice.org application, you can save
    the document to work on or later view. You can print the document to distribute
    it, for archival or reviewing purposes. Your computer must have access to a printer
    to print the document.


    The extension OpenOffice.org appends to your document depends on the OpenOffice.org
    application that you are using to save the document. Once you save a document,
    the name of the document appears in the title bar of the application in which
    you save the data.


    By default, OpenOffice.org saves the document you are working on to your Home
    directory. Linux assigns you a Home directory when it creates your user account.
    No one can access documents in your Home directory unless you give them permission
    to do so.


    You can print any OpenOffice.org document from a printer. Before printing the
    document, you can preview how the document will look when you print it. Although
    OpenOffice.org displays documents as you work on them, what you see when creating
    the document may not exactly match when you print it. Inconsistencies can occur
    because of configuration differences between your display and the printer.


    When you save a document in an OpenOffice.org application, you must specify the
    name of the document.


    # SAVE A DOCUMENT


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_193_0.png)


    +   1. In an unsaved document, click the Save button (S).

    2. Type the name of the document.

    3. Click Save.

    The Save as dialog box appears.

    OpenOffice.org saves the document and the title bar displays the name of the document.'
