  md: '# SCHEDULE AN APPOINTMENT


    You can use Evolution to keep track of your meetings and appointments. Each day,
    your appointments for that day will appear in the day view of Evolution. You can
    also create a summary for each appointment. The summary is used to display information
    about an appointment when the appointment appears in the calendar.


    Each day is broken into blocks of time, separated by lines, which indicate specific
    times throughout the day. An appointment scheduled for that day appears at the
    appropriate location in the day''s listing.


    Each appointment has a start date and time, and an end date and time. Appointments
    take place on the same day, so the start and end dates will be the same, although
    the times will differ. When the appointment appears in the day view, the time
    between the start and end time is highlighted to let you see how your time on
    day is allocated.


    You can create a reminder for a task so Evolution can notify you before an appointment
    is scheduled. Reminders messages that display on your screen at a specific time
    before the appointment is scheduled allow you to be prepared and punctual for
    your appointments. Make sure Evolution is running for reminder messages to display.


    # SCHEDULE AN APPOINTMENT


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_181_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_181_1.png)


    +   1 Click the Evolution icon on the taskbar.


    +   2 Click Calendar.


    +   3 The Calendar window opens.


    +   4 Click New Appointment.


    +   5 The Appointment window appears.


    +   6 Type the summary of the appointment.


    +   7 Set the location of the appointment.


    +   8 Set the start and end times of the appointment.'
  merge: -1
