  md: '# RED HAT LINUX


    # PLAY AN MP3 AUDIO FILE


    You can play audio files saved in the MP3 audio file format. The MP3 file format
    is one of the most popular formats used to record audio information. This is because
    MP3 audio files can be of excellent quality while still requiring a minimal amount
    of space; a three-minute recording of good quality may only require a floppy file
    of 44MB. Because of the relatively small size of MP3 audio files, they are suitable
    as e-mail attachments or for downloading from the Internet.


    The higher the quality of the recording, the larger the size of the MP3 file.
    The audio player displays the quality of the MP3 file as it plays.


    You can store and play back audio files from a variety of storage devices. If
    you attempt to play back an audio file from a slow storage device, such as a floppy
    disk, or via a slow network connection, the audio playback may be subject to breaks
    in the playback. For best results, copy audio files to the hard drive of your
    computer before playing them.


    You can save MP3 files in a wide range of quality. Some files may have excellent
    quality, rivaling that of CDs, while other MP3 files can be of lower quality.
    The purpose of the MP3 file determines the quality of the audio. For example,
    a speech given at a lecture can be of low quality while the barely audible sound
    of a bird will require a higher quality.


    Before playing an audio file, you must ensure that the computer speakers or headphones
    are connected correctly and turned on.


    # PLAY AN MP3 AUDIO FILE


