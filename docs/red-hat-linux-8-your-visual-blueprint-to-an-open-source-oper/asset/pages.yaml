  md: '# WORKING WITH APPLICATIONS


    # Extra


    Some documents may be hard to read because of the small size of the document when
    it is viewed within xpdf. You can increase, or decrease if needed, the display
    of documents within xpdf. To increase the size of the document, click the down
    arrow on the button labeled+ on the bottom of the xpdf window. Select a new magnification
    level from the pop-up menu.


    Some PDF documents can be quite large, sometimes more than a thousand pages, finding
    information may be difficult. You can perform a text search on a PDF document
    to locate a specific string of text. Click the Search button on the bottom of
    the display, enter the text you want to locate, and press Enter.


    Another option for viewing PDF documents is to use the Acrobat Viewer application
    from Adobe, the creators of the PDF file format. You can obtain the latest version
