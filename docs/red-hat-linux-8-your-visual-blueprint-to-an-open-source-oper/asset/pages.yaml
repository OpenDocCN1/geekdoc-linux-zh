  md: '# # MOVE AND RESIZE A WINDOW


    You can move or resize an application window to better manage it. You can execute
    multiple applications at one time, and in most instances, the applications will
    overlap.


    You can move and resize these applications to better display the information.
    For example, you can move and resize application windows to display a document
    and a spreadsheet side by side.


    Some applications may display only partial content in a window. For example, when
    you display a Web page, only part of it may display. You can resize the application
    window so that you can view the entire contents.


    The ability to move and resize application windows depends largely on the resolution
    of the display screen. The higher the resolution of the display, the easier it
    is to display multiple application windows. For most uses, you should use a screen
    resolution of minimum 800 x 600 pixels.


    You can launch and execute multiple applications on a Linux system. When multiple
    applications are running, there are multiple application windows displayed at
    the same time.


    You also use the panel to manage the display and execution of multiple applications
    at the same time. For more information, see page 46.


    # MOVE A WINDOW


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_59_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_59_1.png)


    +   1. Start an application.


    +   2. Position over the title bar of the application.


    +   3. Click and drag the window to a new location on the desktop and release
    the mouse button.


    +   4. The application window moves to a new location.'
  merge: -1
