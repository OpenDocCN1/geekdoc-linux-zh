  md: '# RED HAT LINUX


    # CONFIGURE INTERNET CONNECTION

    SECURITY


    Y ou can restrict access to your computer while you connect to a network. Each
    external connection represents a potential security risk, as a person may attempt
    to access your computer from another location on the connected network.


    If a computer cannot use port 80, then it cannot access the Web.


    You can prevent access to your computer by restricting the protocols with which
    it communicates. For example, unless you run a Web server, you can reject any
    computer that attempts to communicate with your computer using the HTTP protocol.


    Your computer can experience another type of attack, called a denial of service
    attack, which does not aim to access your data, but to stop your computer from
    performing. This type of attack is more common than computers hosting Web, E-mail,
    or other server service.


    Attacks on computers make use of network protocols. A network protocol is the
    language that software and hardware devices use to communicate with a network.
    For example when you view a Web page, your browser and the Web server that hosts
    it communicate using the HTTP protocol. Protocols require a port number, which
    is the virtual port protocols use to communicate. For example, the HTTP protocol
    uses port 80 to


    The software used to restrict access to network devices is called a firewall.
    By firewalling, you can mark any network device that you use as trusted, meaning
    that no restrictions are applied. You typically mark your own internal network
    connections as trusted.


    You can select different levels of security for each network connection. For connections
    to the Internet, you should choose the highest security level. You can also customize
    your security by selecting the protocols that you want to restrict.


    # CONFIGURE INTERNET CONNECTION SECURITY


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_139_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_139_1.png)


    # CUSTOMIZE SECURITY


    +   1 Click the Main button.


    +   2 Click System Settings.


    +   3 Click Security Level.


    Note: If you are not logged in using the root account, you will be prompted to
    enter the root account password.


    +   4 Select Customize changes to (O).


    +   5 Select the network connection for which you want to configure security.


    +   The Security Level Configuration window appears.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_139_2.png)'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# CONFIGURING INTERNET CONNECTIONS


    # Extra


    Hackers commonly try to access computers to retrieve confidential information
    as credit card numbers, passwords, and other sensitive information. You can protect
    your sensitive information by not storing it on your computer. If you need to
    store information in electronic format that may be of interest to a hacker, you
    should store it on it removable media, such as a floppy disk or CD-ROM, that is
    not stored in your computer but is available if you need it.


    Even though you can use a firewall to protect your computer from attacks via a
    network connection, your computer may be accessible to hackers by other means.
    Unless you can physically restrict access to your computer, the information stored
    on that computer is always vulnerable. You can disable many protocols.


    # COMMON NETWORK PROTOCOLS


    | PROTOCOL | PURPOSE |

    | --- | --- |

    | HTTP | Web browsing |

    | DHCP | Automatically configuring IP numbers of on a network |

    | Telnet | Logging in to a computer via a network |

    | SMTP | Sending e-mail |


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_140_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_140_1.png)


    +   - Select the protocols to which you want to allow access ([ ] changes to [x]).


    +   - Click OK.


