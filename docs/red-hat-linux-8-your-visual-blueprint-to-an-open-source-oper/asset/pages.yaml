  md: '# CREATE BACK UP FILES


    You can make backup copies of files in the case the original files become corrupted
    and you need to restore them. You can use the File Roller archive management tool
    to make backup copies. An archive is a number of files, or just one, that are
    compressed into a smaller file.


    For example, if you choose to archive a directory, you can choose to archive certain
    subdirectories in the directory and not others.


    Once files are placed into an archive, you can copy the archive to a more secure
    location, such as a CD-ROM or another computer connected to your network. If you
    are archiving important files, you should store them in a location away from your
    computer to prevent the total destruction of data in case of a disaster, such
    as fire.


    When you choose an archive, you choose the location and type of archive file you
    want to create. The archive can consist of several types, the most common being
    the .tar file type. TAR files have been used on UNIX systems for many years.


    The files you select to place in the archive can consist of a single file or a
    collection of files and subdirectories. Prior to creating the archive file, you
    can select a wide range of settings to restrict the files that are placed in the
    archive.


    You restore files in an archive to the computer they were backed up or to another
    computer. For more information about restoring files that are backed up, see page
    264.


    # CREATE BACK UP FILES


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_279_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_279_1.png)


    +   1 Click the Main Menu button.


    +   2 Click Accessories.


    +   3 Click File Roller.


    +   5 Click The File Roller window appears.


    +   4 Click New.


    +   The New Archive dialog box appears.


    +   6 Type the location and name of the archive file.


    +   7 Click OK.'
  merge: -1
