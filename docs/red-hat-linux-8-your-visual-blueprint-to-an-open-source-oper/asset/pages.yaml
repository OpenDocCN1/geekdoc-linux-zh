  md: '# HOW TO USE THIS BOOK


    Red Hat Linux 8: Your visual blueprint to an open operating system uses straightforward
    examples to teach you how to install and configure the Red Hat Linux 8 operating
    system and then the installed applications and utilities.

    To get the most out of this book, you should read each chapter in order, from
    beginning to end. Each chapter introduces new ideas and builds on the knowledge
    learned in previous chapters. After you become familiar with Red Hat Linux, this
    book can be used as an informative desktop reference.


    Courier Font


    Indicates the use of HTML code such as tags or attributes, scripting language
    code such as statements, operators, or functions, and ASP code such as objects,
    methods, or properties.


    Bold


    Indicates information that must be typed by you.


    Italics


    Indicates a new term being introduced.


    # Who This Book Is For


    If you are looking for a resource that will help you learn how to use the world''s
    most popular Linux operating system, Red Hat Linux 8: Your visual blueprint to
    an open source operating system is required, but familiarity with UNIX or Microsoft
    Windows is an asset.

    No prior experience with operating systems is required.


    # Apply It


    An It section usually contains a segment of code that takes the lesson you just
    learned one step further. Apply It sections offer inside information and pointers
    that can be used to enhance the functionality of your code.


    # What You Need To Use This Book


    # Extra


    To perform the tasks in this book, you need a computer running the Linux operating
    system with Red Hat 8.0. A computer running the Microsoft Windows operating system
    can also be used in conjunction with Red Hat 8.0.


    An Extra section provides additional information about the task you just accomplished.
    Extra sections often contain interesting tips and useful tricks to make working
    with ASP easier and more efficient.


    # The Conventions In This Book


    # The Organization Of This Book


    A number of typographic and layout styles have been used throughout Red Hat Linux
    8: Your visual blueprint to an open source operating system to distinguish different
    types of information.


    Red Hat Linux 8: Your visual blueprint to an open source operating system contains
    19 chapters.


    The first chapter, "Installing Linux," shows you how to install Red Linux 8.0.'
