  md: '# SET THE DEFAULT PERMISSIONS FOR NEW FILES


    When you create a new file, Linux assigns a default set of permissions to the
    file. You can specify which permissions Linux assigns to new files. Linux creates
    files with read and write permissions for the owner and owner group, and just
    read permissions for all others. You can also alter these permissions to restrict
    user access to new files and increase security. For example, you can set the default
    permissions for a new file so that only the owner can read and modify the file,
    while other users have no access to the file.


    Linux uses the default permissions when creating both files and directories. However,
    some of the permissions differ depending on whether you create a file or a directory.


    You can use the `umask` command to specify the default file permissions. After
    you do this, Linux creates any new files with the new default permissions. The
    default permissions that you specify with the `umask` command are only for the
    current session. Once you log out any changes that are made with the `umask` command
    are discarded. If you are constantly needing to reset default file permissions,
    you should include the `umask` command within the login script .bash_profile so
    that Linux executes the `umask` command each time you log in.


    You can set default permissions using a three-digit number, where each digit specifies
    read, write or execute permission for the owner, the owner''s group, and all other
    users.


    # SET THE DEFAULT PERMISSIONS FOR NEW FILES


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_309_0.png)


    +   In the Terminal window, type the code to create a new file.


    +   This example uses the touch command to create an empty file.


    +   Press Enter.


    +   Type umask.


    +   Type a new set of default permissions 177, which allow the owner all read
    and write permissions, and no permissions for other users.


    +   Press Enter.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_309_1.png)'
  merge: -1
