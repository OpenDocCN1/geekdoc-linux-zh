  md: '# RED HAT LINUX 8


    # CHANGE THE SHELL TYPE


    A shell is a program that allows you to interact with, and run the programs, on
    the Linux system. You can change the shell type you are using in order to access
    different features of different shells. The default shell used on the Red Hat
    Linux system is the bash shell. The bash shell is originally from an older shell
    called the Borne shell, which is probably the most popular shell in use.


    Each shell type typically uses a different prompt to help you distinguish it from
    different shells when you are working with multiple shells. For example, while
    the bash shell typically includes the username and current directory in the command
    prompt, the ash shell uses only a single dollar sign. You can change the prompt
    to match your own preferences. For more information about changing the shell prompt,
    see page 226.


    There are many types of shells, and each shell may have a particular set of characteristics.
    For example, the C shell may be more familiar to programmers who are experienced
    with programming shell scripts.


    In most cases you are likely to use the shell type that you are most familiar
    with. While most shells share commands and characteristics, a user still needs
    time to learn the characteristics of a new shell, particularly if the user has
    used a specific shell for a number of years.


    A new shell can be invoked by typing the name of the shell you want to use, just
    as you would type any other Linux command. You can stop using a shell and return
    to your original shell by typing the exit command.


    # CHANGE THE SHELL TYPE


