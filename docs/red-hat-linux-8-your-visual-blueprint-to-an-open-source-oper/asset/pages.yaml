  md: '# ADD A TASK


    Evolution allows you to keep track of your appointments, meetings, and phone calls
    by creating a task for any action that you have to perform. For example, you can
    create a task that contains information about material you need to prepare for
    a meeting that you plan to attend. Tasks appear in a task list so you can quickly
    see what you need to complete.


    For each task, you must create a summary. The summary is used as the task description
    when the task appears in the task listing. While you should try to keep the summary
    as descriptive as possible. For example, use the summary "File sales report to
    accountant" as opposed to simply "File report."


    time. You can specify a due date and a start date for a task. The due date is
    the date by which you want the task complete, and the start date is the date by
    which you want to commence work on the task. Some tasks, such as creating a large
    presentation, may require a number of days to complete, so the start and due dates
    will be different. You can specify a description for a task, which gives you an
    opportunity to include more details about the task.


    A task list is often referred to as a To-Do list, which is a component of many
    time management systems. It typically contains a list of actions to perform, as
    opposed to appointments that are tracked with Evolution''s calendar features.
    For more information about the calendar features of Evolution, page 166.


    You can specify the date you want to perform a task to help schedule your task
    and in better manage your


    # ADD A TASK


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_179_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_179_1.png)


    +   Click the Evolution icon on the taskbar.


    +   The Evolution information page appears.


    Note: If you have not configured your e-mail settings, you will receive a prompt
    to configure Evolution to access e-mail. For more information, see Chapter 9.


    +   Click Tasks.


    +   The task listing view opens.


    +   Click New Task.'
