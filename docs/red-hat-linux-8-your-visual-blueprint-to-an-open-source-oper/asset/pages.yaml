  md: '# RED HAT LINUX 8


    # MOUNT A CD-ROM DISC


    You can mount a CD-ROM drive to access the information on a compact disc placed
    in the CD-ROM drive. You can also mount DVD media in a DVD-ROM drive using the
    same process for CD-ROM media.


    The easiest way to access a compact disc is via the compact disc icon on the desktop.
    The compact disc icon may be present on your desktop if a compact disc was in
    the CD-ROM drive when you logged in. The icon of the disc on the desktop will
    display the name of the compact disc under the icon. When you click the icon of
    the CD-ROM on the Nautilus file manager will appear displaying the contents of
    the CD-ROM. In many cases, the CD-ROM may automatically mount when you insert
    the CD-ROM disc into the CD-ROM drive.


    Compact discs, like other media, are mounted to a specific directory, known as
    the mount point. This point is an existing directory where the contents of the
    compact disc in the mounted CD-ROM drive are accessible. On a Red Hat Linux system,
    the mount point for CD-ROM drives is /mnt/cdrom.


    The User Tool allows you to select the CD-ROM drive that you want to mount. The
    name of the CD-ROM drive on your computer is /dev/cdrom. Many computers use CD-ROM
    drives that are fully compatible with compact discs that will also be identified
    with the device name /dev/cdrom.


    Unlike other drives on your computer, you cannot copy files to the directory that
    is used as the mount point for the CD-ROM drive. You can copy files from the directory
    to another location on your computer. For more information about copying files
    to a compact disc, see page 106.


    # MOUNT A CD-ROM DISC


