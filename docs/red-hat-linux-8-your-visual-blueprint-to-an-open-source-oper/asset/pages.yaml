  md: '# RED HAT_LINUX 8


    # CONFIGURE A SCREENSAVER


    You can use a screensaver to hide information on your screen when you are not
    at your computer. A screensaver is typically an image or a moving image that covers
    the area of the display for a certain period. You may want to use a screensaver
    to hide sensitive information, such as your e-mail messages, from anyone who happens
    to see your computer screen while you are not. You could close all your applications
    or log off the computer to achieve such a level of security, but this is usually
    an inconvenient and impractical way of protecting data, particularly for people
    who frequently leave their computer for short periods.


    change the settings of many screensavers, such as the speed of motion or the number
    of colors used by the screensaver. The options for each screensaver depend on
    their nature, and may not be the same for each.


    When a screensaver is active, any applications that are running continue to run
    and perform the tasks that they were processing at the time the screensaver started.


    You can increase the security provided by the screensaver by requiring the user
    to type in a password before the screensaver is turned off. When a user tries
    to access a computer that the screensaver is running, the computer will require
    the user to enter a login name and password before deactivating the screensaver
    and allowing access to the computer.


    There are many different screensavers that Linux can use. Some screensavers use
    simple graphics, while others screensavers use elaborate designs and images.


    # CONFIGURE A SCREENSAVER


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_85_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_85_1.png)


