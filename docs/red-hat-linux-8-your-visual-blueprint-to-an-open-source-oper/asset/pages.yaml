  md: '# # REBOOT A LINUX SYSTEM


    You can reboot your computer from within the Linux system. The most common reason
    to reboot a computer is to correct a problem that is occurring with the system.
    Rebooting a computer forces Linux to reload all programs and applications, operating
    the system.


    displays the main login screen again after you reboot. You can reboot a Linux
    system from the desktop environment via the Main Menu. You should save information
    in any applications that you have open before you reboot a computer, otherwise
    the unsaved data may be lost.


    Rebooting a Linux system is also useful if you have attached a device, such as
    a modern or USB device, which is not automatically recognized. Rebooting a computer
    forces the system to search for each device attached to.


    You should never reboot a computer by simply turning the power and then off. Loss
    of data and possible file corruption can result from a reboot that does not use
    the proper Linux procedure.


