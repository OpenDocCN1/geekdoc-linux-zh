  md: '# INSTALL LINUX 8


    You can install Red Hat Linux 8 on your computer using the Red Hat Linux CD-ROM
    installation discs. You can also obtain Linux from many different sources other
    than Red Hat. However, the simplicity of the Red Hat installation process with
    versus appeals to many users.


    In the past, many found the overly complex method of installing Red Hat Linux
    8 confusing to other operating systems. Red Hat Linux 8 now uses an installation
    process that simply finishes completes the installation automatically. The installation
    of Red Hat Linux 8 is so straightforward that it is possible to install Red Hat
    Linux without looking at a manual or textbook.


    Disc 1 of the Red Hat Linux CD-ROM installation set is bootable and requires that
    your CD-ROM drive allow your computer to boot from a CD-ROM. To enable booting
    from


    the CD-ROM drive, refer to the documentation for your computer.


    Once you boot your computer from Disc 1, the Red Hat Linux installation program
    offers you a choice of two installation modes, graphical or text. Although some
    computers only allow you to install Linux using graphical mode. Graphical mode
    installation displays the installation process menus and prompts in a graphical
    environment.


    Once the installation process begins, a prompt appears asking you to choose a
    language for Linux to use during and after the installation. The default setting
    is for English. After you select a language, a prompt asks you to select the keyboard
    configuration for your computer. The default selection, the U.S. English layout
    type, is the most common.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_17_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_17_1.png)


    +   1 Start your computer and immediately insert Disc 1 of the installation set.


    +   2 The installation options screens appear.


    +   2 Press Enter to start the graphical mode installation process.


    +   3 The CD media test window appears.


    +   3 Select the Skip button and press Enter.


    Note: Make sure your computer is set up to boot from a CD-ROM.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# INSTALLING LINUX


    # Extra


    Depending on the programs and configuration you choose to install for Red Hat
    Linux, the installation could take an hour or more. Allow yourself enough time
    to complete the installation properly. You may have to insert additional CD-ROMs,
    so you must be present for the duration of the installation process or check back
    periodically.


    You can choose to install Linux using a text-based installation process if your
    computer has limited video capabilities, or if you experience video problems while
    installing Linux in graphical mode. To do this, type text and press Enter at the
    boot: prompt of the installation options screen.


    Before you start to install any operating system, you should take the time to
    complete an inventory of your computer hardware. You should make note of the devices
    and main components of your computer, such as hard drive and modem types, as well
    as associations with the devices. An example would be the serial port to which
    your modem connects. If you already have an operating system on your computer,
    refer to the system documentation to determine your computer hardware settings.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_18_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_18_1.png)


    Welcome to Red Hat Linux

    Welcome! This installation process is described in detail in the Guide available
    from Red Hat, Inc. (Please see the CD-ROM for more information). Please read the
    entire manual before you begin this installation process.


    HTML and PDF copies of the manual are available online at http://redhat.com. There
    is also an HTML copy on the CD-ROM.


    If you have purchased an official license you may want to register your product
    online at http://www.redhat.com/apps/activate.


    When this installation is complete, click the Release Notes button.


    Language Selection

    Choose the language you would like to use during this installation.


