  md: '# EXTRACT FILES


    You can extract files from an archive file. To do this you can use the File Roller
    archive management tool


    You must specify the directory to you want to extract the files in. You should
    ensure that the directory you are extracting the files does not contain files
    with the same name as the archive, as you may overwrite these files. This also
    applies to subdirectories and the files in those subdirectories.


    The archive file that you want to extract the file does not have to be created
    using the archive manager that comes with Red Hat Linux. As long as the archive
    is in a file format that the archive manager recognizes, you can restore files
    from that archive.


    You do not have to extract archive files to the computer from which they were
    originally archived, but you should be careful when you extract files that may
    contain settings or configuration information for programs on your computer. The
