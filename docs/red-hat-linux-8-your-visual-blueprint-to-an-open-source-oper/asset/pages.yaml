  md: '# CHANGE THE GROUP OWNERSHIP OF A FILE


    You can change the group ownership of a file or directory to expand or restrict
    access to the file or directory. Changing the group ownership allows you to quickly
    alter the access to a file or directory by a large group of users.


    The root account can change the group owner of a file or directory. use the chgrp
    command to change the group owner of a file, you must be the owner of the file,
    a member of the group owners of the file, or the root user.


    The group ownership of files often changes when one department finishes with a
    file and needs to pass control of the file to another department. For example,
    the sales group may change the ownership of an invoice file to the accounts department
    when they ship an item to a client.


    When you change group ownership, the group to you transfer ownership must be a
    valid group and must already exist on the Linux system.


    When changing the group ownership of a file or directory, you must also make sure
    that the new group has ownership of the parent directory that contains that file
    or directory. If the new group does not have access to the parent directory, then
    they cannot access any files and directories within the parent directory, even
    if they have ownership of those files and directories.


    You can identify the current group ownership of a file or directory by using the
    ls -l command to display the directory listing. The group owner of the file or
    directory appears directly after the user owner of the file.


    # CHANGE THE GROUP OWNERSHIP OF A FILE


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_305_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_305_1.png)


    +   1 In the Terminal window, type the code to create a directory.

    2 Press Enter.


    +   3 Type touch followed by the name of the file you want to create.

    4 Press Enter.


    +   5 Type Is -l.

    6 Press Enter.

    7 The group owner of the directory and file appears.


    +   7 Type chgrp followed by the name of the group owner to you want to assign
    the file or directory.

    8 Type the name of the file or directory.

    9 Press Enter.'
  merge: -1
