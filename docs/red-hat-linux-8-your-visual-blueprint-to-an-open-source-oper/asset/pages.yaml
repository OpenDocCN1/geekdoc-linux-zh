    conversation, the IRC network divides these conversations into channels. Channels
    make it easy to find the conversations that interest you. For example, the channel
    #oldcars where people discuss vintage automobiles is where you would get help
    with the Linux operating system. Each IRC network has different channels, and
    each channel name begins with the number character (#). There could be as few
    as five people using a channel, or in the more popular channels, hundreds of users.


    you type the text you want to send at the bottom of the screen, and when you finish
