  md: '# LOGGING IN TO A LINUX OPERATING SYSTEM


    # Extra


    It is important that you do not simply turn off your computer to stop using Linux.
    While Linux is running, even if you have no applications running and you are not
    accessing any data, Linux still has a number of files open and may be accessing
    storage devices. Simply turning the Linux system causes any open file that is
    saved to be lost – at the very worst, this may corrupt files on the Linux system.
    Always properly exit and log out of Linux before shutting the computer off.


    If you are logged in to a Linux system in text mode, simply type the command to
    log out of Linux. If you are presented with a command prompt when using the exit
    command, type the exit command.


    If you are having problems exiting the graphical interface, you can try to log
    out and reset the graphical system to its optimal state by pressing Ctrl + Alt
    + Backspace.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_50_0.png)


