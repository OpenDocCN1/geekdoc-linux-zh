  md: '# CREATE AN IMAGE


    As well as modifying existing images, you can use the GIMP to create new images
    from scratch. When you create a new image, an image of size you specify is created.
    The initial image will contain a solid background on which you can then draw to
    create your own image.


    When you create a new image, you are asked to specify the size of the image. You
    can specify the size in pixels or inches. You can also specify the resolution
    of the image that you want to create. The resolution should depend on the intended
    use of the image. If you only intend to view the image on computer displays, you
    can use a resolution of 72 dots per inch, or dpi. For images that you intend to
    print, you should use a resolution that matches your printer, typically not less
    than 300 dpi.


    The GIMP offers many tools for drawing in a new image. The tools used to draw
    parts of an image are available on the Toolbox window.


    The Paintbrush tool allows you to draw as if you were using a paintbrush. The
    paintbrush tool has many effects that you can apply, such as brush strokes.


    The type of brush that used depends on the selection made in the Brush Selection.
    You can choose from a multitude of brush styles to achieve the desired appearance
    of your newly created image.


    Opposing the Paintbrush tool allows you to delete parts of your image in a similar
    fashion to using an eraser to erase part of a pencil drawing.


    # CREATE AN IMAGE


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_215_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_215_1.png)


    # DRAW AN IMAGE


    +   1 Start the GIMP.


    +   2 Click File.


    +   3 Click New.


    +   4 The New Image dialog box appears.


    +   5 Set the size of the new image.


    +   6 Click OK to continue.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Extra


    You are not restricted to the colors that you can use in your image. On the bottom
    of the Toolbox is a Color Selection tool that lets you select a new color for
    the foreground and background. To select a new foreground color, double-click
    the square at the top of the Color Selection tool, select a new color, and click
    OK. To select a new background color, double-click the square at the bottom of
    the Color Selection tool, select a new color, and click OK.


    You can reverse the most recent changes you made to an image using the Undo feature.
    To undo the last change to an image, right-click the image and Edit -> Undo in
    the menu. You can also quickly perform the same undo procedure by pressing Ctrl
    + Z on the keyboard.


    The foreground color is used by drawing tools such as the Paintbrush tool. The
    background color is used in areas where a background color is applied, such as
    when a selection is moved within an image.


    By default, a new image is created with a solid color that is currently applied
    to the background. If you wish to use the foreground color throughout the new
    image, select Foreground in the Fill Area of the New Image dialog box.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_216_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_216_1.png)


    +   The new image appears.


    +   Select a brush type.


    +   Click the Paintbrush tool ().


    +   Click and drag the image to draw a line.


    ERASE PART OF AN IMAGE


    +   Click the Eraser tool ().


    +   Click and drag on the image.


    +   Parts of the image are erased.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# SAVE AN IMAGE


    You can save an image created with the GIMP to access that image again in the
    future or to move the image to another location. You can select the file type
    of the image you want to save. There are many different file types that you can
    use when saving the GIMP Common file types are JPEG for being displayed on the
    Web and TIFF file for high-quality images.


    Not all applications can access all image file types. If you are sharing images
    with other users, you should inquire to which image format their application could
    access.


    New images are created with the name Untitled. The file displays at the top of
    the window that contains the image. If you assign an image and save it, the name
    of the image displays at the top of the image window.


    After you select the file type, a dialog box may appear allowing you to select
    options for file format. Some file formats may have no options that for others
    have a vast array of parameters that can be modified.


    As with any file you save in Linux, you must have the appropriate permissions
    for the directory where you want to save the file. For more information about
    and directory permissions, see Chapter 16.


    # SAVE AN IMAGE


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_217_0.png)


    +   1 Create an image in the GIMP.


    +   2 Right-click the image and click File in the pop-up menu.


    +   3 Click Save As.


    +   - The Save Image dialog box appears.


    +   4 Type the name of the file.


    +   5 Click and select a file type.


    +   - This example selects the JPEG file type.


    +   6 Click OK.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Extra


    As well as saving a file so that you can access the image later, you can also
    save an image at specific intervals to allow you to access an image at a previous
    point of its development. For example, when working on a complex drawing, you
    may want to save the image at ten-minute intervals with a different file name.
    This allows you to quickly revert to a previous version of the image you want
    to discard some changes you made to the image. You may also want to save your
    image just before you perform large tasks, such as deleting a major area of the
    image. This provides you with a backup of the image should your actions not produce
    the desired results.


    You can quickly access the Save Image dialog by pressing the key combination Ctrl
    + S. If the image has already been saved, pressing Ctrl + S will automatically
    save the image under the assigned name.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_218_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_218_1.png)


    +   - The file type options dialog box appears.


    +   - Click to select options for the image.


    +   - Click OK.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# ADD TEXT TO AN IMAGE


    You can add text to an image. The image can be a new image or it can be an existing
    image that you want to modify. You can choose from many different fonts that are
    installed on your computer.


    Each font has its own characteristics. Some are fancy and are of elaborate designs
    while others are simple and straightforward. If you are using a font that will
    primarily be displayed in an image on a computer display, a simple font will be
    easier to read than a more elaborate font.


    Each font also has characteristics that you can alter to its appearance. The font
    style determines the weight of the font. For example, a font that has a style
    of bold


    will be comprised of a thicker, more heavy font when a font style of light is
    chosen. The size of the font determines the size of the font when it is placed
    in the image. You can choose to specify a font size in points or pixels. By default,
    font size is specified in points.


    To type the text that you want to place in the image and displays it with the
    chosen font, style, and size.


    Initially, the text will be placed in a selection. To permanently place the text
    into the image, you must anchor the text to the layer. For more information about
    layers, select page 206.


    # ADD TEXT TO AN IMAGE


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_219_0.png)


    +   1. Create or open an image.


    +   2. Click the tool (7).


    +   3. Click the image where you want the text to appear.


    +   4. Select font, font style, and size for your text.


    +   5. Type the text you want to appear in your image.


    +   6. Click OK.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# USING THE GIMP


    # Extra


    You can delete the text that you have added to the image before anchoring the
    text to the layer. This allows you to change your text selection after you have
    used the Text Tool dialog box. To delete the text that is selected in an image,
    click the Trash icon [!] in the bottom-right corner of the Layers, Channels &
    Paths window.


    You can move the text in an image before anchoring the text to a layer. This allows
    you to precisely place the text in your image. To move the selected text, position
    mouse cursor over the text until the move symbol appears. Click the text and drag
    it to its new location. After you moved the text, you can anchor the text to the
    layer to fix the text


    You can easily find out information about a font, such as the family of fonts
    it belongs to, or the resolution of the font. In the Text Tool dialog box, select
    the font you want to use and then click the Font Information tab.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_220_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_220_1.png)


    +   * The selected text appears on the image.


    +   * Click the Anchor button [↓] on the Layers, Channels & Paths window.


    +   * The text appears in the image.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# RED HAT LINUX 8


    # WORK WITH LAYERS


    A layer is a tool used with the GIMP to create and efficiently manage an image.
    Layers can be envisioned as separated, transparent canvases that make up an image.
    Individual elements, such as text, can be placed on a layer. When working with
    a layer, such as deleting or moving, only the affected layer remains untouched.
    An image can have many layers. The use of layers is not limited to created images—many
    image image applications support the use of layers to aid in image creation and
    management.


    The number of layers in an image is shown in the Layers, Channels & Paths window.
    Each layer in an image is represented in this window and can be selected by clicking
    on the layer.


    When a layer is selected, any erasing, or other image manipulation that you perform
    on an image will only take place on that layer. To avoid inadvertently modifying
    an image, you must keep track of the layer on which you are working.


    You can remove information from a layer by making a selection and pressing the
    key combination Ctrl + X to delete the selected information. When working with
    selection tools, the selection will only apply to the layer that is selected.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_221_0.png)


    +   - Create or open an image.


    +   - Click the New Layer dialog box appears.


    +   - Type the name for the new layer.


    +   - Click OK.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Extra


    You can change the size of a new layer that you want to add to an image. To change
    the size, in the New Layer Options dialog box, select the new width and height
    for the new layer and click OK. In most cases, you will want to use a layer that
    is the same size as the image you are working with.


    To help you keep track of the layer that you are working on, you can hide any
    other layers in the image. To hide a layer, in the Layer, Channels & Paths window,
    click the Eye icon 👁️ to the right of the layer image. To redisplay the layer,
    click the same area that the Eye icon will reappear and the layer will be visible
    again.


    You can make a layer appear by changing the opacity of the layer. Select the layer
    in the Layers, Channels & Paths window and move the opacity slider at the top
    of the layer listing to the desired opacity.


    To delete a layer that you no longer need, select the layer from the layer listing
    in the Layers, Channels & Paths window and click 🗑️ at the lower-right corner
    of the window.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_222_0.png)


    +   - The new layer appears selected.


    +   - Select some of the image using a selection tool.


    +   - Only the image information on the selected layer is deleted.


    +   - Draw on the image.


    +   - Press Ctrl+X to delete the selection.'
  merge: -1
