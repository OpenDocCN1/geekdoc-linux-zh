  md: '# RED HAT LINUX 8


    # HIDE THE PANEL


    You can hide the panel to increase the amount of area on your display that you
    can use for other applications. The panel itself is not very large, but when you
    hide it, applications can display at their maximum size.


    Before you can hide the panel, you need to select the Show Hide buttons option
    in the Properties menu. After you activate this feature to hide the panel, you
    can quickly hide the panel whenever you want.


    The size of the panel is dictated by the resolution of the display you are currently
    using. If you are using a higher resolution display, such as 1280 x 1024 pixels,
    you will have a larger area than a user with a lower resolution, such as 640 x
    480 pixels.


    Hiding the panel is achieved by using hide buttons that are located at either
    end of the panel. A hide panel button will also display when the panel is hidden
    to facilitate the redisplay of the panel at any time.


    You may also want to hide the panel simply because you use it infrequently. There
    are other methods of accessing applications and information from the panel. You
    may want to use a more familiar method of accessing applications and information
    other than using the panel.


    After the panel is hidden, a small hide button displays in the bottom-right corner
    of the panel. To redisplay the panel, you must use the hide hide button. Hiding
    the panel does not alter any information that the panel displays. All information
    remains intact when you redisplay the panel.


    # HIDE THE PANEL


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_69_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_69_1.png)


    +   1. Right-click the panel and click Properties in the pop-up menu.


    +   2. Click Show hide buttons.


    +   3. Click Arrows on hide buttons.


    +   4. Click Close.


    +   The Panel Properties dialog box appears.


    +   The hide buttons appear.


    +   Click a hide button.'
