    # Extra


    A screensaver will start after a specified period has passed and the computer
    has not been used. Linux will monitor the use of devices such as the keyboard
    and the mouse to determine if the computer is in use. Each time person interacts
    with the computer, the time to activate the screensaver will reset to the time
    specified for the screensaver''s configuration.


    Some elaborate screensavers utilize large amounts of computer resources, such
    as memory or processor usage, you may disable screensaver when performing long
    tasks that require full use of the resources on your computer, such as updating
    a large database with information. Using a complex screensaver will impede the
    performance of other tasks that are running.


    Even though you require a name and password to deactivate a screensaver, this
    may not entirely prevent users from accessing your computer. A person may still
    be able to restart your computer and gain access to your information on the computer
    using readily available software and tools. If you require more security protection
