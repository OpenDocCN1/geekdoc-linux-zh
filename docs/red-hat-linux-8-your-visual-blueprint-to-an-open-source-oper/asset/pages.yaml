  md: '# DISPLAY USER GROUPS


    You can assign each user account to a group. A group is a collection of users
    that typically have something in common. For example, a group called Sales may
    contain all the people who work in the sales department of a company. Groups are
    also commonly created to collect users of a similar task. For example, a group
    called Internet is permitted to access the Internet from the Linux system. Using
    groups makes it easier to manage multiple users on a Linux system.


    When creating user accounts, Linux assigns a user to a group that is the same
    name as the user, and this is the primary group of the user account. This ensures
    that each user account belongs to a group. However, user groups do not have to
    have any user accounts.


    Linux creates groups automatically when you install it. Other groups may also
    be created when applications are installed. Groups are used by applications and
    the operating system and typically contain the user accounts that were automatically
    assigned when the groups were created.


    User groups are displayed in alphabetical order. If you are trying to locate a
    specific user group, you may have to scroll through the group list until you have
    located the group.


