  md: '# Extra


    You can increase the security of your computer by requiring that the user enters
    a password to disable the screensaver. This prevents unauthorized persons from
    using your computer while you are away from it. To enable the password for the
    screensaver, click the Required password check box in the Screensaver preference
    window.


    If required, you can completely disable screensavers so that they are never activated.
    To disable screensaver, uncheck the Enable screensaver check box in the Screensaver
    preference window.


    By default, the screensaver activates after five minutes of inactivity on your
    computer. The computer monitors the keyboard and the mouse for indications that
    you are using the computer. You can change the length of time the computer must
    be idle in order for the screensaver to activate by selecting the amount of time
    in the Wait for area of the Screensaver preference window.


    When you choose a screensaver, a small preview image of the screensaver appears.
    You can view a full preview of the screensaver by selecting the screensaver, and
