  md: '# CONFIGURE THE KEYBOARD SETTINGS


    When you type, the computer uses certain parameters to control how the information
    from a keyboard is transmitted. There are two parameters that you can adjust to
    control how the keyboard transmits about the keys you are pressing.


    When you press a key and continue to hold the key, the keyboard will repeatedly
    send information about the key you are pressing. As soon as you press the key,
    the keyboard transmits the information and then waits a pause moment before sending
    the information again. You can adjust the delay between when you press the key
    and when the keyboard sends the second character. While useful for people who
    have difficulty typing or on keyboards that may experience communication delay,
    such as a wireless keyboard used at a great distance from the computer.


    You can control how long the delay is between each transmission. This is useful
    when you are holding down a key to repeat it. In many cases, you may want to slow
    this delay efficiently when using keys, such as the Backspace key, so you do not
    accidentally delete the entries.


    Some applications, particularly those that are executed in the Terminal window,
    may make a sound to indicate that a key has been pressed to perform an action.
    This sound is useful to draw your attention to the task or to notify you that
    intervention is required. You can enable or disable the sound keyboard makes.
    The sound associated with the keyboard is called the bell.


    The insertion cursor is cursor used to indicate that an application or dialog
    box is waiting for text input. Typically, a vertical line blinks on and off to
    draw your attention to. You can adjust the rate at which the insertion cursor
    blinks when awaiting.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_39_0.png)


    +   1 Click the Main Menu button.

    2 Click Preferences.

    3 Click Keyboard.

    4 Drag the slider to set the keyboard delay.

    5 Drag the slider to set the repeat speed.'
  merge: -1
