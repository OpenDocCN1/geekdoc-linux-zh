  md: '# VIEW SYSTEM PROCESSES


    You can view the programs that are running on your computer and monitor the effect
    that these programs have on the resources of your computer. Programs execute on
    your computer are called processes. You can view active processes to determine
    what programs are running on your computer. Every Linux system has a number of
    programs running even when there is no apparent app. From applications that you
    launch yourself, there are also running system processes such as the graphical
    display, panel applets, and a wide range of system utilities.


    You can view additional information about a process. For example, you can view
    how much memory a particular process uses. This is useful if you intend to run
    an application that requires a large amount of memory, such as a complex game,
    and you want to free up some memory to the application to run faster.


    You can also use the System Monitor to view the overall performance of your computer.
    For example, you can view what percentage of the central processor is currently
    in use as well as what percentage of memory is in use. Generally, the less your
    computer uses the processor and memory, the faster your applications perform.


    You typically view the programs running on your computer to help you troubleshoot
    a problem you may be having. For example, if your computer suddenly starts slower
    than usual, you can look at the processes to determine if there are any running
    applications that may be slowing your computer.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_275_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_275_1.png)


    +   - Click the Main Menu button.


    +   - Click System Tools.


    +   - Click System Monitor.


    +   - The System Monitor window appears.


    +   - Select the process you want to know more about.


    +   - Click More Info.'
  merge: -1
