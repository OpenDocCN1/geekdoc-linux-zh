  md: '# RED HAT LINUX 8


    # CONFIGURE NETWORK SETTINGS


    You can configure your Linux system so that you can access other computers and
    devices, such as printers, using a network. Before you use your computer on a
    network, you may have to configure some settings that allow you to use the network.
    The most common configuration settings involve the Internet Protocol (IP) numbers
    used by the network. Each computer on a network has an individual IP number that
    identifies it on the network.


    If the network you are connected to is attached to another network, such as the
    Internet, you may need to specify the IP number of the gateway computer on your
    network if Linux does not automatically detect it. A gateway computer is the computer
    that connects your network to another network.


    An IP number is made up of four numbers, each number less than or equal to 255,
    and separated by a period. For example, 192.168.255.5 could be the IP number assigned
    to a computer.


    You can have multiple network devices, such as network interface cards, in your
    computer; the network settings for each of these are correctly configured, you
    can use network applications, such as a Web browser, to access the Internet.


    In conjunction with the IP number for a computer, a netmask number may also be
    assigned. A netmask number is similar to an IP number in that it helps identify
    networks to each other.


    If you are connecting to an existing network, or to the Internet, using an Internet
    service provider, you must use the settings specified by the network administrator
    of that network.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_271_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_271_1.png)


    +   1 Click the Main Menu button.


    +   2 Click System Tools.


    +   3 Click Network Device Control.


    +   ■ The Network Device Control window appears.


    +   4 Select the network device to configure.


    +   5 Click Configure.'
  merge: -1
