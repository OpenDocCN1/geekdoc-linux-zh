    # Extra


    If your computer remains powered after Linux shuts down, you may need to enable
    the power-saving features of your computer. Most power-saving features are set
    using a configuration program that you can access when the computer initially
    starts. To determine if and how you can enable the power-saving features of your
    computer, refer to the documentation of your computer.


    If you are using a multi-user system that is part of a network, you may not be
    allowed to shut down the computer. Contact your network system administrator for
    more information.


    If you are logged in to a Linux system using a text-based console — via telnet
    or a Terminal window — you can shut down the computer using the shutdown command.
    When using the shutdown command you must specify a time when the shutdown is to
    take place. To immediately shut down the computer at the command prompt, type
