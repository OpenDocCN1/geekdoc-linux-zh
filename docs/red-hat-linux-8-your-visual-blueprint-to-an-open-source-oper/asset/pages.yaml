    Each cell is referenced by a cell address. For example, the first cell in the
    top-left corner of a spreadsheet has the address A1. To specify a range of cells,
    you can separate the start and end cell with a colon. For example, the cell range
    A1:B2 refers to the two cells in the first and second columns of the spreadsheet.
    The cell range A1:A5 refers to the five cells at the top of the first column.


    There are many formulas that you can use to perform calculations in a spreadsheet.
