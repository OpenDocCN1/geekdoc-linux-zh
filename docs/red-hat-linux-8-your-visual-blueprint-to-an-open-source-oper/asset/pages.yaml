    ```


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_249_1.png)


    +   1 In the Terminal window, history type.


    +   2 Press Enter.


    +   A list of the most recently used commands appears.


    +   4 This example displays the directory list.


    +   3 Type ! followed by the number of the command you want to execute.'
