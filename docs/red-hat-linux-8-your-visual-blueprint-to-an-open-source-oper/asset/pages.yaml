  md: '# RED HAT LINUX 8


    # MOUNT A FILE SYSTEM


    You can mount different media and access the information stored on them. When
    you mount a file system, you can access the media through a directory on your
    computer. For most media, the file system is mounted under a directory called
    /mnt. For example, you can. For most media, the file system is mounted under a
    directory called /mnt. For example, you can mount a CD and access it via a directory
    called /mmcd/cdrom, or you can access the contents of a floppy disk via the directory
    /mnt/floppy.


    The directory to which the file system is mounted must exist prior to mounting
    the file system. For example, if you want to mount a floppy disk to the /mnt/floppy
    directory, the /mnt directory must already exist before you mount the floppy disk.
    If you are mounting a floppy disk, a floppy icon is automatically placed on your
    desktop, allowing you to quickly access the floppy''s contents.


    You can use the User Mount tool to mount a file system so that you can access
    the contents stored on the file system. You can also use the User Mount tool to
    determine which file systems are currently mounted. The User Mount tool displays
    a button labeled Mount that you can use to select a file system. If the file system
    is already mounted, the button reads Unmount instead


    There are many different formats of file systems, such as the file systems used
    on the most common file systems. Storing files on a file system that is compatible
    with multiple operating systems allows you to easily exchange data between applications
    running on differing operating systems.


    # MOUNT A FILE SYSTEM


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_273_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_273_1.png)


