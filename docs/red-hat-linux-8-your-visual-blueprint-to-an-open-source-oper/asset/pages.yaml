  md: '# LOGGING IN TO A LINUX OPERATING SYSTEM


    # Extra


    When Linux starts, it can present you with a text-based or graphical-based login
    screen. A process called init* is responsible for determining which of these two
    interfaces is used by the Linux system. You can determine whether a text-based
    login or a graphical login is by changing a line in the file /etc/initabb. This
    file is processed when the computer starts. Open the file in a text editor that
    reads:


    ```

    id:3:initdefault

    ```


    Change the line to:


    ```

    id:5:initdefault

    ```


    This presents you with a graphical login the time you start Linux. To use a text-based
    login each time you start Linux, change the line to read id:3:initdefault.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_48_0.png)


