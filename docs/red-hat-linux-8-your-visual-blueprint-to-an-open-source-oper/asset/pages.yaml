  md: '# RED HAT LINUX 8


    # LIST THE CONTENTS OF A DIRECTORY


    You can determine the name of files within a directory by listing the contents
    of the directory. The command used to list the files in a directory is the ls
    command. When you use the ls command, the name of each file in the current directory
    displays. As well as files, the ls command also displays the name of any directories
    in the current directory.


    If you want to see the contents of another directory, specify the directory name
    after the ls command. If no directory name is specified, the contents of the current
    directory display.


    You can display a long or more detailed, view of a directory''s contents using
    the -l option with the ls command. A more detailed listing of the files information
    such as the owner of the file, file size, and the permissions of the file.


    Many directories contain hidden files. Hidden files are files that are prefixed
    with a period. Hidden files are commonly used for files that are not edited by
    a user, such as a file containing an application''s configuration details. You
    can view the hidden files in a directory using the -a option with the ls command.
    You can combine different options to create a custom listing of a directory''s
    contents. For example, you can view a detailed list of all the files in a directory,
    including hidden files, using the al -s of the ls command. Most directories contain
    numerous hidden files.


    Depending on the Linux system, some elements in a directory list may appear in
    color or a bold font. For example, executable files and directories appear in
    a bold font.


    # LIST THE CONTENTS OF A DIRECTORY


