  md: '# RED HAT LINUX 8


    # CHANGE THE PATH


    You can change the path environment variable within a Terminal to make it easier
    to execute programs and access files. The path environment variable stores a list
    of directories in which the system searches for a command when you enter that
    command at the command line. If you type a command that does not exist in the
    path, the Linux shell returns an error message stating that it cannot find the
    command.


    each time you execute the command. For example, to execute an application called
    spreadsheet in the subdirectory budget of the Home directory andrew you would
    type `/home/andrew/budget/spreadsheet`.


    You can add a directory to the path so that you do not have to specify the directory
    name each time you execute a command. To change the path, you must first create
    a variable called PATH and then use that variable to create an environment variable.
    You do this by assigning the variable using the equals sign key, and then converting
    the variable using the export command.


    You can see which directories are in the current path by typing `$PATH` after
    the echo command. The echo command tells Linux to display the contents of an environment
    variable. When the contents of the environment variable display, a colon separates
    each directory in the path.


    If the path environment does not contain a command that you want to use, you must
    specify the name of the directory that contains the command


    # CHANGE THE PATH


