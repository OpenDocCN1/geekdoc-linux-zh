  md: '# VIEW INSTALLED PACKAGES


    You can see what components and applications have been installed on your computer
    once Red Hat Linux is installed. When you first install Linux, you can choose
    which components, or packages, to install. A package consists of files needed
    to install, configure, and execute an application, service, or other type of software-based
    component.


    applications of a package that are installed make what is called the base package
    — the default package that Linux installs. If you want to install additional applications
    from that package, you must specify them at the time of installation, or after
    Linux has been installed. For information about installing packages, see page
    210.


    A package consists of hundreds of related files; when a package is installed,
    all of the necessary files are copied to your computer and placed in the appropriate
    directories. A package can consist of separate applications. For example, the
    Editors package contains many text editors, and each text editor can be used to
    edit files.


    When you run the Package Manager, it performs a complete analysis of the packages
    currently installed on your computer. Depending on the number of applications
    installed, it may take several minutes for the Package Manager to determine all
    of the package information. Once it has finished analyzing the installed packages,
    the Package Manager displays the complete space taken by the packages. This figure
    does not include any data that has been created by the applications.


    When Linux is first installed, packages are also installed. While a package can
    consist of many applications, typically only a small number of the applications
    are installed. The


    # VIEW INSTALLED PACKAGES


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_223_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_223_1.png)


    +   1 Click the Main Menu button.

    2 Click System Settings.

    3 Click Packages.


    Note: If you are not logged in using the root account, you will be prompted to
    enter the root password.


    Note: The Package Manager may take a while to analyze the installed packages.


    The Checking system package status message appears.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Extra


    The packages installed by Red Hat Linux are arranged into a few broad categories
    that reflect the purpose of the applications in the package.


    | PACKAGE TYPE | DESCRIPTION |

    | --- | --- |

    | Desktops | A desktop is the primary environment that you will work in, and your
    choice of desktops greatly influences how you will use your computer. You can
    install multiple desktops. |

    | Applications | An application is a software program that performs a specific
    task, such as an e-mail reader or a word processor. Linux comes with a vast array
    of applications that you can use for many types of tasks. |

    | Servers | A server is a computer that performs network tasks, such as a server
    that hosts Web pages. The server packages contain many types of server software
    that you can use, including Web, file, and mail server software |

    | Development | Development tools are used to create programs that can be used
    on a Linux system. Programmers and high-level system administrators use Development
    tools. |

    | System | System packages are used to manage, configure, and maintain your Linux
    system. System packages consist of items such as printer support and network management
    utilities. |


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_224_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_224_1.png)


    +   - The Package Management window appears.


    +   - Click the Details button to view details on an installed package.


    +   - The package details appear for viewing.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# INSTALL A PACKAGE


    A package is a collection of applications that comes with the Red Hat Linux distribution.
    You can install any application that is part of a package that is already installed.


    Some applications are automatically considered part of the base installation of
    a package — if the package is installed, then these packages are always installed.
    The other applications of that package are called the optional applications and
    may or not be installed when Linux is installed. Some packages may not have any
    base applications, in which case all applications in the package are considered
    optional.


    In the list of applications for a package, an option box accompanies each application
    name. If the box contains a check mark, the application has been installed and
    is available for use.


    Once you have selected the application to install, the system displays the amount
    of disk space needed to install the application. You must ensure that you have
    enough free space on your computer to install the package.


    You must have necessary Linux installation CD-ROMs available if you are installing
    an application. The Package Manager informs you that the installation is completed.
    The application should be accessible through the Main Menu of the desktop. For
    example, an e-mail reader is placed on the Main Menu under the Internet submenu
    heading.


    You may be required to configure the application before using it for the first
    time.


    # INSTALL A PACKAGE APPLICATION


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_225_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_225_1.png)


    +   1 Click the Details button to open the window for the package that contains
    the application you want to install.


    +   2 Click the box beside the application you want to install.


    +   3 Click Close.


    +   4 The Package Manager gathers and then displays information about the application.


    +   5 Click Continue.


    +   This example installs Mozilla Mail.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# WORKING WITH PACKAGES


    # Extra


    When Red Hat Linux is first installed, you can choose which packages and applications
    you want to install at that time. Many people install a minimal version of Linux
    during installation, and only when Linux is installed and operating correctly
    do they install additional applications.


    When installing multiple applications, you should log in as the root account of
    the Linux system. Some packages and applications do not install at all if you
    are not using the root account when you start the Package Manager.


    You can install multiple applications from the package at one time. This allows
    you to quickly configure your application set to better suit your needs. To install
    multiple applications, select the option box next to each application name. The
    package installer then installs all the selected applications at the same time.
    When installing multiple applications, you may be asked to insert more than one
    CD-ROM in the computer CD-ROM drive as needed.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_226_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_226_1.png)


    +   - A prompt may appear asking you to insert the CD-ROM that contains the application.


    +   - Click OK.


    +   - A message appears after the application installs.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# REMOVE AN APPLICATION


    You can remove an application from your computer to free up storage space and
    reduce the number of items on the system menus, making the menus easier to use.
    Removing a package from the Red Hat Linux system results in all the applications
    within that package being uninstalled. An application typically uses a number
    of files to run. These can include configuration files, executables, and log files.
    When an application is removed, all the associated files and application are also
    removed. The removal of a package can result in the removal of hundreds of files
    from your computer.


    Once you remove an application, you cannot access any of the programs in that
    application package, because all the files associated with the application are
    removed from your computer. If you want to use a removed application,


    must reinstall the application or package, or restore the needed files from a
    backup. For more information about installing an application in a package, see
    page 210.


    When a package or an application is removed, any data created with the application
    remains on your hard drive. For example, if you use a text editor to create a
    document and store the document in your Home directory, when you remove the text
    editor from your computer, the document is still in your Home directory.


    Before removing a package or application, the system displays a summary of what
    will be deleted. The system also displays the amount of disk space that will become
    free if the package is removed.


    # REMOVE AN APPLICATION


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_227_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_227_1.png)


    +   - Click the Details button to view package information on the application
    you want to remove.


    +   - Click the check box next to the application package you want to remove.


    +   - The check mark disappears to indicate the removal of an application.


    +   - This removes the Mozilla Mail package from the Graphical Internet Package.


    +   - Click Close.


    +   - The Package Manager gathers and displays the information about the package.


    +   - Click Continue.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Extra


    You can view the items that are being deleted when you remove a package from your
    system. This allows you to confirm, before you remove a package, that you are
    not inadvertently removing an application that you still intend to use. To view
    the details of the application that is being removed as part of a package, click
    the Show Details button on the System Update dialog box after the Package Manager
    displays a summary of the items being deleted.


    Next to each package name are two numbers separated by a forward slash. The first
    is the number of applications from this package that are installed, and the second
    is the number of applications in the package.


    You do not have to remove a complete package; if you want, you can remove an individual
    package application. To remove a single application, click the Details button
    next to the package title, and then select the application you want to remove.
    When you select the application, the check box is removed from the option box
    to indicate that the application will be removed. You can select multiple applications
    from the same package for removal.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_228_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_228_1.png)


    +   A message appears indicating your action was successfully completed.


    +   Click OK.


    +   The package information shows a change in the number of applications now installed.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# INSTALL AN APPLICATION USING RPM


    The Package Manager is an easy way to install and manage Linux applications, but
    you must use another system to manage applications that are not part of the Linux
    distribution in these cases, you can install and update applications using the
    RPM management application. RPM stands for Red Hat Package Manager. Applications
    that are compatible with the RPM system are collected into a single file that
    has the .rpm extension.


    The RPM application is used at the command line, so a Terminal will be used to
    work with RPM files, or you can use a virtual console. For more information about
    using Terminal windows, page 218.


    When installing an application, rpm takes a number of parameters: The first parameter
    is the action to be taken, and the second parameter is the name of the RPM package.


    You must know the name of the RPM package that you want to install because you
    must specify the full file name of the RPM package to install the package correctly.
    Before installation, you can use rpm to query the package to determine what the
    package is and various details about the package.


    Depending on the complexity of the package being installed, it may take quite
    a while to install a package using rpm. When installing a package, rpm does not
    give any indication that the package is being installed. You can, however, use
    the percent parameter to have rpm display the progress of the installation.


    You must log in as root user of the Linux system to use rpm to install applications.
    You can use any user account to query a package using rpm.


    # INSTALL AN APPLICATION USING RPM


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_229_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_229_1.png)


    +   1 Click the Main Menu button.


    +   2 Click System Tools.

    3 Click Terminal.


    +   The Terminal window appears.


    +   This example installs the whole package from the Linux installation CD-ROM.


    +   Type rpm -i --percent followed by the name of the RPM package and press Enter.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# WORKING WITH PACKAGES


    # Apply It


    Most applications that have been designed for use on a Linux system are available
    as RPM files. Some applications may not be available in RPM format and you must
    install them other means, typically requiring you to compile or build the applications
    before installing them. Applications installed in this way are accompanied by
    installation instructions that should be followed.


    You cannot install the wine package if it has been installed.


    | TYPE THIS: rpm -It wine-200020605-1.i386.rpm |


    | RESULT: package wine-200020605-1 is already installed |


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_230_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_230_1.png)


    +   - When the percentage reaches 100, the package is installed.


    # QUERY A PACKAGE


