  md: '# LOGIN USING THE GRAPHICAL LOGIN SCREEN


    You can log in to a Linux system using a graphical login. A graphical login allows
    the use of images, icons, and buttons to log in the Linux system. You must have
    the X Window System installed and operating before you use the graphical login.
    A graphical login is the same as text login except you are using a graphical environment.


    Logging to any Linux system requires the use of a valid user account that has
    been created on the system. You must also have the correct password for your account.
    If the username and password that you log in to are not exactly as they exist
    on the Linux system, you must enter them again. As with most text on a Linux system,
    both the username and password are case sensitive.


    When you log in to a Linux system using a graphical login, all the tasks you accomplish
    within the graphical environment are performed using the user account with which
    you log in. For example, if you log to a Linux system using the user account Andrew,
    any documents that you create and save within a word processor are saved using
    the user owner identification of Andrew.


    Some user accounts cannot be used to log in to a Linux system. Many user accounts
    are created and used by the Linux system to execute applications and services
    can only be used for that purpose. With the exception of the root user account
    that is created when Linux is installed, you should only log in with a user account
    that you have created.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_47_0.png)


    +   Start the Linux operating system.


    +   The login screen appears.


    +   Type the username and press Enter.'
