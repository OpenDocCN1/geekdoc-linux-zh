  md: '# LOG OUT OF LINUX


    Once you have finished working with Linux, you can log out of the Linux system.
    Logging out results in the closure of all running applications. You can choose
    to have Linux save your current settings when you log out. Linux can save settings,
    such as applications and window sizes, and retain these settings for the next
    time you log in using the same saved settings. It is useful to save settings if
    you use the same set of applications.


    You should close applications that you have open before logging out of Linux.
    Closing down any open applications first ensures that you do not lose any data
    when you log out.


    If you have an application open when you log out, the application may discard
    any information that it is using. While this is not important for an application
    like a Web browser where you can access the data again, it is critical for word
    processing or spreadsheet applications that may fail to save your data. Some applications
    may automatically save any unsaved data for, even if you do not save the information
    before logging out.


    Once you log out of the system, a login screen appears allowing you to log in
    to the system again or shut down the Linux system completely. You can log in to
    the Linux system again using the same or a different user account from the one
    you were using when you logged out.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_49_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_49_1.png)


    +   1 Click the Main Menu button.


