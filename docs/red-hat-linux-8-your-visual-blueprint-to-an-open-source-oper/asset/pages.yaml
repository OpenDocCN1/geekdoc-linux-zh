  md: '# ESTABLISHING FILE AND DIRECTORY PERMISSIONS


    # Extra


    If you are not the owner of a file and are only a member of the group owner of
    the file, you can still change the group ownership to another group. However,
    changing the group ownership might restrict your access to the file, since you
    are no longer one of the user or group owners. If you inadvertently reassign a
    file or directory to an incorrect group and cannot access the file, you must use
    the root account to assign the file to your group or to add your account to that
    that is now the group owner of the file.


    You can recursively change the group ownership of a directory and any subdirectories
    or files in that directory. This is useful when you want to transfer the ownership
    of a large amount of files from one group to another. To recursively change group
    ownership, use the -R parameter of the chgrp command.


    Example:


    ```

    chgrp -R directory

    ```


