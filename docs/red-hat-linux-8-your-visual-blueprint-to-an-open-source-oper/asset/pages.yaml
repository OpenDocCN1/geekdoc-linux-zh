  md: '# Extra


    Some computer networks designate a computer that manages the IP numbers, netmask
    settings, and other network information for all the computers on the network.
    This computer uses a protocol called DHCP to manage the exchange of information
    between the computers connected to the network. If you have a DHCP computer on
    your network, you can use it to automatically obtain the settings your computer
    needs to access the network.


    Some networks require that you specify a name for your computer as well as an
    IP number. To specify the name of your computer, click the DNS tab in the Network
    Configuration dialog box and enter the name of the computer in the Hostname field.


    When specifying the IP number for a computer to connect to the Internet, you may
    also need to specify the IP address of a computer called a DNS server. A DNS server
    helps you locate computers on the Internet when you use computer names. To specify
    the IP number of a DNS server, click the DNS tab in the Network Configuration
