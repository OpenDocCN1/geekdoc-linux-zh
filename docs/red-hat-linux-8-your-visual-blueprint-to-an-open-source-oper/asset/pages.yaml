    +   1 In the Terminal window, type alias.


    +   2 Type the name of the new alias followed by =


    +   3 Type a single quote ('''') and the name of a command.


    +   4 Type a semicolon (;) and the name of another command followed by a single
    quote.


    +   5 Press Enter.


    228'
