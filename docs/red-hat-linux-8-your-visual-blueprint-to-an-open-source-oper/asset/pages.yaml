  md: '# PERFORMING SYSTEM ADMINISTRATION


    # Extra


    Booting a Linux system in rescue mode is a useful method for recovering data and
    attempting to repair boot problems with a Linux system, but it is also a security
    problem if your computer contains sensitive data. Anyone who has physical access
    to your computer can use a rescue disc to access the data on your computer, any
    security in the form of login names and passwords can be bypassed, allowing access
    to all the information on your computer. To ensure complete security of your Linux
    system, you should restrict physical access to your computer, for example by using
    your computer in a room that can be locked. This problem is not unique to Linux
    systems and is the reason that many organizations keep their most sensitive data
    on computers in secure areas. For particularly sensitive data, you may want to
    use third-party products that can encrypt your data, adding another level of security.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_284_0.png)


