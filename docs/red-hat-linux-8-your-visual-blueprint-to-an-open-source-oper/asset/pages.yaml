  md: '# # ADD A CONTACT


    You can keep track of the people you interact with by adding them to your list
    of contacts. Contacts can contain information about friends, colleagues, and co-workers.
    Creating a contact allows you to quickly access information about a person, apart
    from a contact. For example, you can send an e-mail message to a person''s e-mail
    address each time without having to locate the person when you want to send a
    message.


    You can add additional detailed information about a contact. For example, you
    may want to keep track of the person''s nickname. If the contact is a colleague,
    you can store information about the contact''s manager and the office where the
    contact works. You can use the contact information to keep track of a person''s
    birthday.


    Although there are many fields of information you can specify for a contact, apart
    the name of the contact, there is no requirement that you specify any information.
    You can always add the remaining details later.


    After a contact has been added to the list of contacts, you can use the contact
    information with other features in Evolution, such as scheduling a meeting with
    a contact. For more information about appointments, see page 166. You can view
    all the contacts you have entered by viewing the contact list.


    A contact has general information associated with it that contains the most commonly
    accessed information about a contact, such as the name, address, phone numbers,
    and e-mail address.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_183_0.png)


    +   - Click the Evolution icon on the taskbar.

    - Click Contacts.

    - The list of contacts opens.

    - Click New Contact.

    - The Contact Editor window for the contact.

    - Type the name of the contact.

    - Enter any additional information for the contact that is available.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Extra


    It is common for the list of contacts to grow quite large, consisting of hundreds
    of contacts. You can easily search for a contact using any number of fields in
    the information. For example, you can search for a contact by looking for records
    that start with a specific set of characters. In search criteria that are above
    the list of contacts, type the text to search and click Find Now. The contacts
    that start with the specified characters will display.


    After you have entered the information for a contact, you can add to or update
    that information. To edit or add information for a contact, display the contact''s
    name in the contact list and double-click the name of the contact. When you have
    finished adding or changing the information, click Save and Close.


    To quickly access contacts in a large contact list, Evolution allows you to access
    names that begin with the same letter. To do so, select a letter from the buttons
    located to the right of the contact list.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_184_0.png)


    +   - Click Details.


    +   - Enter any additional information about the contact.


