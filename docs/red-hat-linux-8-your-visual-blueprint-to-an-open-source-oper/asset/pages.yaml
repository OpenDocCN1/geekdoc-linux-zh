    recipient. To reply to an e-mail message, display the message and click the Reply
    button. For more information about sending mail, see page 156.


    E-mail messages can consist of plain text or content with formatted text and images.
    Evolution composes formatted text using HTML, the same type of code you use to
    create Web pages. Unlike other e-mail programs, Evolution can display e-mail from
    other users that contain plain text or messages that consist of HTML code.


