  md: '# CREATE A DIRECTORY


    You can create directories to group multiple files together, making it easier
    to manage and organize your data. Directories also increase the efficiency of
    a Linux system. It is much faster to locate a file that is not stored in a directory
    with a large number of other files. Storing files in directories enables a smaller
    number of subdirectories.


    Directories can contain other directories, called subdirectories. A directory
    that contains a subid is the parent directory of the subdirectory.


    The mkdir command is used to create a directory. If you do not specify the parent
    directory, the directory will be created in the current working directory.


    Typically, you need a parent directory to create a new directory. You can use
    the -p mkdir


    command to create a parent directory and any number of subdirectories. Linux automatically
    creates any subdirectories specified with the mkdir command.


    As with any files and directories, you can use the ls command to view a list of
    directories to confirm that the directory was created successfully. The -s option
    of the ls command displays any subdirectories of a specified directory. For more
    information about the ls command, see page 246.


    You must have the appropriate permissions within a directory to create subdirectories
    in that directory. For more information about file and directory permissions,
    see Chapter 19.


    # CREATE A DIRECTORY


    ```

    root@localhost# mkdir level1

    root@localhost data#

    ```


    ```

    root@localhost.data# mkdir -p level1/level2/level3

    root@localhost data#

    ```


    +   1 In a Terminal window, type mkdir.


    +   2 Type the name of the directory you want to create and press Enter.


    +   4 Type the name of the directory you want to create and press Enter.'
