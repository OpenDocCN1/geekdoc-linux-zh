  md: '# CONFIGURE SERVICES


    Services are programs that start automatically when your computer starts. You
    can enable or disable services to execute only the services you require.

    Services are often programs called daemons, which oversee and manage specific
    features of the Linux system. For example, a service called httpd is the name
    of the daemon that allows your Linux system to act as a Web server. Thus, if the
    httpd service is running, your computer is a Web server.


    The Service Configuration tool displays a list of all the services that are installed
    on your computer. The number and type of these services depend primarily on which
    services you installed when you installed the system.

    Even though the service may be installed, it may not be enabled. You can enable
    or disable services when the computer starts. If you disable or


    enable a service, the change takes effect the next time you restart your computer.
    For example, if you enable a service using the Service Configuration tool, you
    must restart your computer to start the service.

    If you want to stop a service, you can do so immediately. Depending on the service
    you stop, you may not be notified that the service has stopped until you try to
    use it.


    You should use the root account before you enable or disable services. You should
    be cautious as to services you disable. Disabling some services may cause your
    computer to experience problems. For example, if you disable a service gpm, which
    provides mouse support for text-based interfaces, it text-based application will
    prevent you from using the use of a mouse.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_277_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_277_1.png)


    # DISABLE OR ENABLE A SERVICE


    +   1 Click the Main Menu button.

    2 Click Server Settings.

    3 Click Services.


    Note: If you are not logged in using the root account, you will be prompted to
    enter the root account password.

    The Service Configuration window appears.


    +   4 Click the services you want to enable or disable.

    This example displays the gpm service, used to provide mouse support when using
    the console.'
  merge: -1
