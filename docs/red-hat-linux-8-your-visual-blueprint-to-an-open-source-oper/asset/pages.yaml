  md: '# SEND AND RECEIVE INSTANT MESSAGES


    Once you sign into Gaim and the AOL instant-messaging service, you can communicate
    with the people in your buddy list. The person with whom you want to communicate
    must be in the instant messaging service on another computer. If a person in your
    buddy list is available for messaging Gaim displays their names in a list of buddies
    who are available, or online.


    While you are communicating with another person, Gaim displays their screenname.
    It is possible to participate in multiple conversations at once. The two participants
    in a conversation do not have to use Linux to communicate. You can use Gaim on
    your Linux system with other people who may use different operating systems, such
    as Mac OS or Windows.


    Once you select a person from your buddy list, you can type a message and send
    it to them. If the other person accepts your message, your text appears in their
    messaging software. The other person can then type a message and send it to you.
    Gaim displays all messages that you sent to enable you to keep track of your conversation
    with the other person. There may be a small delay from the time you send a message
    until it appears on their display.


    With all Internet services, the speed of your Internet connection has a great
    effect on the performance of the service. Because you use instant messaging to
    transfer small sections of text, instant messaging performs adequately even on
    slower connections. Networks in a work environment completely restrict or disable
    the ability of computers to the network to use instant messaging.


