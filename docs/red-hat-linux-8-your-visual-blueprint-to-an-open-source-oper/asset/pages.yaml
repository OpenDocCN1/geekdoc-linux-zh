  md: '# SWITCH USER ACCOUNTS


    Wile using a Terminal window, you can change to a different user account without
    having to log out of the shell and log in with the new user account.

    Switch user accounts is also a more convenient way to use multiple logins instead
    of a virtual console. For more information about virtual consoles, page 220.


    If you are using the su command while you are logged in as the superuser, or root
    account, then you do not have to specify a password for the account to which you
    are switching. This is because the root account has control of the Linux system
    and is free to make any changes or alterations.


    You can use the Linux shell command su to switch to a different user account.
    You may want to switch to a different account in order to use that account for
    a specific task. For example, a system administrator may create an account backup
    for the purpose of performing backups of system data. When you switch to a new
    user account, you must specify the name of the account you want to switch to as
    well as the password for the account.


    If you use the su account without specifying the name of another account, then
    linux attempts to switch the account to the superuser, or root, account. In most
    cases, only the system administrator of the Linux system switches from one account
    to another.


    When you finish using the new account, the exit command returns you to the original
    user account.


    # SWITCH USER ACCOUNTS


