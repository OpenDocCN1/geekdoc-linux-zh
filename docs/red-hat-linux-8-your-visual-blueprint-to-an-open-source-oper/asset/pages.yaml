  md: '# SPELL CHECK AN

    OPENOFFICE.ORG DOCUMENT


    You can verify the correct spelling of all the words in your document. OpenOffice.org
    applications use a number of dictionaries to check and confirm your spelling is
    accurate. OpenOffice.org applications can visually indicate that a word is misspelled
    by drawing a wavy line under the misspelled word as soon as you type the word,
    allowing you to quickly detect and correct spelling errors as you


    know the spelling is correct, you can add the word to a dictionary. When you add
    a word to a dictionary, OpenOffice.org no longer indicates that you have misspelled
    the word in documents that use the updated dictionary.


    Some words may have correct spelling even if they are not in the OpenOffice.org
    dictionaries. This is often true for abbreviations or obscure place names. If
    OpenOffice.org indicates that you have spelled a word incorrectly, you


    You should always proofread your document, even if you have used a spell checker
    to verify the spelling of each word in the document. While the spelling may be
    correct, you may have used some words out of context, or the grammar in the document
    may be incorrect, problems that the spell checker does not correct. If you are
    creating an important document, such as a business presentation, you should also
    have others proofread your document.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_191_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_191_1.png)


    +   - In a document that contains spelling errors, click Tools.


    +   - Click Spellcheck.


    +   - Click AutoSpellcheck.


    +   - OpenOffice.org underlines the spelling errors in the document with a wavy
    line.


    +   - Position the mouse cursor over a misspelled word, and right-click the word.


    +   - In the drop-down menu that appears, click the correct spelling for the word.


    Note: If the word is not in the dictionary, OpenOffice.org is not able to correct
    it.'
