  md: '# RED HAT LINUX 8


    # SETTING THE INITIAL KDE OPTIONS


    The KDE Desktop Environment (KDE) is a graphical desktop environment that you
    can use instead of the default (GNOME) desktop environment. You start the KDE
    when you first log into Linux with a graphical login. For more information about
    logging into a Linux computer, see page 30. You must install the KDE before you
    start. The easiest way to install KDE is to do so at the time of the Linux installation.
    For more information about installing KDE, see page 2. You can install KDE using
    the Package Manager after KDE has been installed. For more information about the
    Package Manager, see pages 208 to 21.


    KDE can use a wide variety of special effects to make the operating system more
    visually appealing. KDE uses features such as enhancing the appearance of fonts,
    fading menus, and preview windows. Unfortunately, these features require more
    processing power to implement. If you have a computer with a slow processor, you
    can adjust how many of these visual features KDE uses. If you have a computer
    with a powerful processor, you can probably implement all these features without
    a noticeable decrease in performance.


    Different operating systems have different behaviors. For example, some operating
    systems require one click of an icon to launch an application, while others require
    to double-click an icon to launch an application. You can adjust the behavior
    of KDE so that it closely resembles the operating system with you are most familiar.


    KDE, like the default (GNOME) desktop, uses a selection of themes to change the
    appearance of the KDE desktop. Each theme changes the appearance of items such
    as backgrounds, title bars, and mouse pointers. You can choose which theme you
    want KDE when it starts.


    # SETTING THE INITIAL KDE OPTIONS


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_87_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_87_1.png)


