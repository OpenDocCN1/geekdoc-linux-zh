  md: '# APPENDIX


    # WHAT''S ON THE CD-ROMS


    T he two CDs that accompany this book contain the Publisher''s Edition of Red
    Hat Linux 8.0.


    # SYSTEM REQUIREMENTS


    Make sure your computer meets the minimum system requirements listed in this section.
    If your computer does not meet these requirements, you may not be able to install
    Red Hat Linux from these CDs.


    +   * A Pentium-class processor (for text, 200 MHz or greater is recommended);
    for graphical mode, 400 MHz or greater is recommended);


    +   * For an installation without a graphical interface, 64MB or more RAM is recommended;
    for an installation including the graphical interface, a minimum of 128MB of RAM
    is required; it is recommended to have at least 192MB of RAM for optimal performance.


    +   * At least 1.5GB free hard drive for a Personal Desktop installation; 2GB
    for a Workstation installation; 1.3GB for a Server installation, 400MB for a minimal
    Custom installation.


    # TROUBLESHOOTING


    If you have difficulty installing or using any of the materials on the companion
    CDs, consult the detailed installation and troubleshooting instructions in Part
    I.


    If you still have trouble with the CD, please call the Customer Care phone number:
    (800) 762-2974. Outside the United States, call (317) 572-3994. You can also contact
    Customer Service by e-mail at techsupportudum@wiley.com. Wiley Publishing Inc.
    will provide technical support only for installation and other general quality
    control items.


    # INSTALLING AND USING THE SOFTWARE


    To use the CDs to install Red Hat Linux, follow these steps:


    +   * Insert CD-ROM #1 into your computer''s CD-ROM drive.


    +   * Boot (or reboot) your computer, making sure that your BIOS is set to boot
    from CD-ROM.


    The Red Hat installation Welcome screen appears.


    Note: If you cannot boot from the CD-ROM, you will need to create a boot diskette.
    See Chapter 1 for information on creating a boot disk.


    +   * See Chapter 1 for full instructions on installing Red Hat Linux.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_311_0.png)'
