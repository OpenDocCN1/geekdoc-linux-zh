    When you save a Web page in Composer, it automatically assigns a name for your
    Web page based upon the title you give the Web page. Composer replaces the spaces
    in the title of the Web page with underscores and appends the filename with extension
    .html. Some browsers and Web servers have problems interpreting spaces in a filename,
