  md: '# MOVE A FILE OR DIRECTORY


    You can move a file, make a copy of a file, and then delete the original file.
    Moving files is often used to archive files that you no longer need, but want
    to retain on your system if you need to access them again.


    You use the mv command to move files. It is very similar in operation to the cp
    command, which is used to copy files. You must specify the name of the file to
    move as well as the name of the file to move it to. The mv command is also used
    extensively for renaming files within the same directory.


    When you copy a file with the cp command, you must specify whether you want the
    copy to apply recursively to all directories and their contents. That is, if you
    want to


    copy a directory, subdirectories, and the contents in those subdirectories. The
    move command automatically acts recursively. If you use the mv command to move
    a directory, all the subdirectories and the files within those directories will
    move automatically. For more information about copying files, see page 252.


    You can verify that a file has been moved by using the ls -l command to view the
    contents of the directories that will store the new copy of the file or directory.
    For more information about listing the contents of a directory, see page 246.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_269_0.png)


    ```

    MOVE A FILE OR DIRECTORY

    [root@localhost data]$ ls -l

    total 8

    drw-r--r-- 2 root root 4096 Sep 13 06:52 archive

    rw-r-- 1 root root 2606 Sep 13 06:51 mail

    [root@localhost data]# mv mail /root/data/archive

    [root@localhost data]#

    ```


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_269_1.png)


    ```

    [root@localhost data]$ ls -l

    total 8

    drw-r--r-- 2 root root 4096 Sep 13 06:52 archive

    rw-r-- 1 root root 2606 Sep 13 06:51 mail

    [root@localhost data]# mv mail /root/data/archive

    [root@localhost data]#

    ```


    +   1. In a Terminal window, type ls -l and press Enter.


    +   2. The contents of the directory appear.


    +   3. Type mv.


    +   4. Type the name of the file or directory you want to move.


    +   5. Type the name and location where you want to move the file or directory
    and press Enter.'
