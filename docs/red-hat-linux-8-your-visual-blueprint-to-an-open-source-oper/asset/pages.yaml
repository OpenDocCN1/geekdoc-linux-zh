  md: '# PLAY AN AUDIO COMPACT DISC


    An audio disc (CD) contains sounds that you can play using the CD-ROM drive on
    your computer. Audio CDs usually contain musical collections and can store up
    to 70 minutes of audio. Your computer can play an audio CD using a regular rewritable
    CD-ROM drive, a recordable CD-ROM drive, or a Digital Versatile (DVD) drive.


    The CD Player application starts after you insert an audio CD into the CD-ROM
    drive of your computer. If you have a connection to the Internet, the CD Player
    attempts to retrieve information about the audio CD that you are playing, the
    name of the audio CD, the artist and the names of the tracks on the CD. If the
    CD Player cannot identify the name of the CD that you are playing, it presents
    you with a choice of possible titles for the CD. You can choose the correct title
    and the information retrieved.


    Sound recorded on a CD is typically divided into tracks with each track containing
    a separate audio file, as a song. Using separate tracks for each audio file makes
    accessing files quick and easy. For example, a CD can access the first, last,
    or a middle track in the same amount of time. Some audio recordings, especially
    those that have been created on a computer, may only have one track.


    Do not confuse audio CDs with compact discs that contain audio files as MP3 files.
    You cannot play CDs with audio files as an audio CD. For more information about
    playing audio files, page 112.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_123_0.png)


