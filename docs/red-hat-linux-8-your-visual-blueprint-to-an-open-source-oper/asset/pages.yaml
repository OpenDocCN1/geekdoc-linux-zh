  md: '# SET PANEL PREFERENCES


    You can alter the appearance and behavior of the KDE panel by changing the settings
    of the preferences. To set the preferences of the KDE panel, you must right-click
    an empty area of the panel. This is a place on the panel not occupied by another
    item, such as an icon or applet. If you right-click an area of the panel that
    contains an icon or applet, you can only adjust the preferences for that.


    You can place the panel at the top, bottom, or on either side of the display,
    depending on your requirements. Most people leave the panel at the bottom of the
    screen, typical of panel placement in other operating systems.


    As well as adjusting the size and location of the KDE panel, you can have the
    panel disappear when it is not in use. Hiding the panel frees up the area that
    the panel normally occupies. Use it for your other applications. By default, the
    panel disappears after three seconds. To make the panel reappear, simply move
    the mouse pointer to the side of the display where the panel is hiding; the panel
    reappears.


    You can change the size of the KDE panel to better fit your screen or to place
    more or less items on the panel. If you have a high-resolution display, for example,
    1024 x 768 pixels or more, you may want to increase the size of the KDE panel
    to better see the items on the panel. If you have a low-resolution display, you
    can make the panel smaller that it does not occupy as much of the display.


