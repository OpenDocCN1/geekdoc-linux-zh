  md: '# OPEN AN IMAGE


    You can open many images within the GIMP. You can open an image to alter or view
    it. When you first start the GIMP, a number of smaller windows display. One of
    these is the Toolbox, which contains many options, including the File menu, which
    allows you to open files stored on your computer.


    You can use the Load Image dialog box to locate an image, or simply type the name
    and location of the image you want to open using the GIMP.


    The windows that when the GIMP starts may overlap each other, making it hard to
    access certain features of the GIMP. You can move the windows to view the ones
    you are working with.


    When you select an image to open, the GIMP displays it in a separate window. The
    GIMP has no limitation on the size of images that it can open and modify; however,
    if the image is larger than your window, it may be scaled down to view the entire
    image. When working with very large images, you should ensure that your computer
    has adequate resources, such as memory, available for the GIMP.


    There are many image file types that you can open using the GIMP Each image format
    has its own strengths and weaknesses. If the GIMP does not recognize the file
    type of an image you try to open, it displays an error message stating that the
    image cannot be opened. You must ensure that you have named your images correctly
    before opening them using the GIMP.


