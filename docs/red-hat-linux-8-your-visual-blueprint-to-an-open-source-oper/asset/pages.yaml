  md: '# CREATE A SPREADSHEET USING OPENOFFICE.ORG CALC


    You can use OpenOffice.org Calc to create a spreadsheet to work with numerical
    data. OpenOffice.org Calc is the spreadsheet application that installs with the
    OpenOffice.org suite. A spreadsheet application allows you to easily manipulate
    numerical data and convert that data to a graphical representation for ease of
    interpretation.


    Cells in a spreadsheet can contain different types of data. For example, you can
    use text information to label the rows and columns in a spreadsheet. If the information
    in a cell consists of both numbers and text, Calc interprets the data as text.
    For example, Calc treats the data 123 Main St. as text.


    When Calc starts, it creates a blank spreadsheet that you can enter text and numerical
    data. Calc formats the data into rows and columns. The location where a row and
    column intersect is a cell. Each cell has an address, comprised of the row number
    and the column letter of the cell. Calc identifies each column of a spreadsheet
    with a letter, and each row with a number.


    Calc contains many features that you can use to manipulate numerical data. For
    example, you can calculate the totals of a number of cells in a spreadsheet. For
    more information about manipulating numerical data, see page 190.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_203_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_203_1.png)


    +   1 Click the OpenOffice.org Calc button.


    +   An empty spreadsheet appears.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Extra


    You can format the information in a spreadsheet just like the text in a word-processing
    document. Regardless of whether the information is text or numerical, you can
    apply formatting such as bold, italic, size, and alignment to your data. To format
    the text in a cell, select the cell and then click the formatting option that
    you desire on the formatting toolbar.


    When performing actions on cells, such as formatting the appearance of the information
    in the cells, you can select multiple contiguous cells instead of one cell at
    a time. To select multiple cells, click and drag the pointer over the cells you
    want to select. Any formatting you then choose applies to the contents of all
    the cells you selected.


    You can change the size of a cell so that it better accommodates your data. For
    example, you can increase the width of a cell so that it can display a complete
    sentence of text. To increase the width of a cell, place the pointer at the top
    upper-right corner of the column and drag the pointer to the desired width of
    the column. When resizing the width of a cell, all cells in the column are resized.
    To change the height of a row cells, click and drag the bottom of the row label.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_204_0.png)


    +   Click a cell in the spreadsheet and type the information you want to place
    in the cell.


    +   Press Enter.


