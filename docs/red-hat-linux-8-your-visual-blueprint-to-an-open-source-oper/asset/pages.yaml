  md: '# RED HAT LINUX


    # SET FILE PERMISSIONS


    You can use file permissions in Linux to restrict who can access and use a file.
    File permissions determine whether a user can execute, read, or modify a file.
    You can assign file permissions for the owner, the group owner of the file, and
    all other users. For example, you can create a file with permissions that allow
    you to modify and read the file, allow the group owners to only read the file,
    and prevent all other users from accessing the file.


    You can use the chmod command to modify the permissions for a file. To use the
    chmod command, you require two parameters: a three-digit octal number and the
    name of the file for which you are changing permissions. The three digits indicate
    permissions for the owner, group, and other users. Each octal number is a value
    from 0 to 7, and for example the octal number 4 grants read permissions while
    the number 5 grants execute permissions.


    You can use the ls command with the -l parameter to see the permissions that you
    have assigned to a file. A file appears as a sequence of characters, three sets
    of characters that indicate the permissions for the owner, group, and other users.


    When a dash appears in a permission sequence, it indicates that permission is
    not granted for the file in that instance. A single character precedes the nine
    permission and indicates the file type; for a regular file, the character is simply
    a dash.


    Regardless of the file permissions that you set for a file, the root account can
    always access the file and modify the permissions for that file.


    # SET FILE PERMISSIONS


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_299_0.png)


