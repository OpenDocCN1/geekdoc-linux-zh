  md: '# Read Less-Learn More


    # Red Hat Linux 8 on two CD-ROMs!


    Welcome to the only guidebook series that takes a visual approach to professional-level
    computer topics. Open the book and you will discover step-by-step screen shots
    that show you how to install, configure, and use Red Hat Linux:


    The complete Publisher''s Edition of Red Hat Linux 8

    * Includes OpenOffice.org, Mozilla Web browser, and much more


    +   * Navigating the graphical interface

    * Customizing your desktop

    * Creating and working with documents

    * Using the Mozilla Web browser

    * Managing your e-mail with Evolution or Mozilla Mail

    * Backing up and restoring files

    * Working with files and directories

    * Admining auto-mounting file systems

    * Configuring CD writers

    * Configuring the Linux shell


    # CHANGE THE APPEARANCE OF NAUTILUS


    You can change the appearance of the Nautilus windows by opening the Preferences
    dialog. For example, you can change the size of icons, the color of the background,
    and how the files are displayed. You can also arrange the files in different ways,
    such as list view, icon view, or thumbnail view.


    You can also change the appearance of the desktop by opening the Preferences dialog.
    For example, you can change the size of icons, the color of the background, and
    the placement of Desktop icons. You can also move the icons and folders anywhere
    on the desktop just by clicking and dragging them.


    If you want to change the way that files are displayed in Nautilus, click the
    View menu in the Nautilus window and select the view you want. For example, you
    can select list view to see more information about files.


    # Extra Apply It


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_339_0.png)


    +   * "Apply It" and "Extra" sidebars highlight useful tips


    +   * High-resolution screen shots demonstrate each task


    +   * Succinct explanations walk you through each step


    $ 29.99 USA

    $ 44.99 CAN

    £ 22.50 UK


    Category:

    Operating Systems: UNIX / Linux

    System requirements: Pentium class PC 64 MB RAM (128 MB recommended), CD-ROM,
    450 MB hard drive (2.5 GB recommended). See the "What''s on the CD-ROM" page for
    details and complete system requirements.


    maranGraphics

    www.wiley.com/compbooks


    ISBN 0-7645-1793-7


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_339_1.png)


