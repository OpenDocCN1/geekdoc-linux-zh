  md: '# CHANGE THE APPEARANCE OF NAUTILUS


    You can change the appearance of the Nautilus file manager to suit your needs
    and personal preferences. You may want to choose colors and textures that feel
    more appealing than the default colors and textures assigned when Nautilus was
    first installed.


    Nautilus displays information in a main panel, split into two panes. The left
    pane displays information, and the right pane, the view pane, displays items.


    In some cases you may want to change the appearance of the Nautilus file manager
    for a more practical or functional purpose. For example, you may find it easier
    to view a high-contrast color scheme if you are under bright lights or using a
    small laptop device.


    You can change parts of the Nautilus file screen. You can choose to assign a pattern,
    similar to an image, or you can simply assign a solid color to part of the Nautilus
    screen. You can preview a small sample of the patterns and colors before you apply
    them. After you select a color and assign it to area, the area that immediately
    fills with that color. Assigning a pattern or color to an area of the screen does
    not affect any icons or other information provided by Nautilus in that area.


    Any changes you make to the appearance of the Nautilus file manager are only applied
    for the user account that you are logged in as, even if it is the root account.
    Each user starts with the default appearance of the Nautilus manager, regardless
    of any changes made by other users.


