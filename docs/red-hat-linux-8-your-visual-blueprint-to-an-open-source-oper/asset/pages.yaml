  md: '# CREATE A DATA CD WITH KDE KONCD


    You can copy any information from your computer to a recordable CD if the computer
    is equipped with a CD-recordable drive. There are two types of recordable CDs,
    CD-recordable (CD-R) or CD-rewritable (CD-RW). CD-RW allows you to erase and record
    information to a CD-RW multiple times. A CD-R drive can only write information
    to a CD-R, while a CD-RW drive can write information to a CD-R or a CD-RW. In
    a CD-RW drive, only CD-RWs can be erased.


    You can copy any type of information from your computer to a CD. For example,
    you can copy documents, images, video, and audio files. Many people use CD drives
    to back up their important information. Unlike tapes, CDs can last for decades,
    so CDs are a very good archive medium.


    KonCD is an application designed to write CDs from the KDE desktop. Since the
    KonCD application is not installed with the KDE desktop, you can install it the
    package installation features of Red Hat Linux. For more information about package
    installation, see page 210.


    Before copying information to a CD, you must specify what information you want
    to copy. You select this information by directory. When you copy a directory,
    all the files in the directory and any subdirectories are copied to the CD. You
    can access CDs with computers that use other operating systems, such as Windows.
    While data files are accessible to both operating systems, most application files
    will only run on the operating system for which they were designed.


    # CREATE A DATA CD WITH KONCD


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_101_0.png)


