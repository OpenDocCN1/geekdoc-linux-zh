  md: '# RED HAT LINUX 8


    # START VI


    You can use the vi editor to create, edit, and view text files. Because of the
    popularity and widespread use of most Unix- and Linux-based computers, it is a
    good idea to know this program.


    Because vi is a text-based editor, you can use it on Linux systems that do not
    have a graphical-based interface. You can access the vi editor using the shell,
    a text-based interface that allows you to enter Linux commands. For more information
    about the shell, see Chapter 14.


    You can start vi by typing vi at the command line and then specifying the name
    of the file you want to access. If the file you want access is not located in
    the path, then you must specify the correct location and name of the file to access.


    When you load the file, certain information appears about the file at the bottom
    of the display. This information includes the file name, the number of lines and
    characters in the file, and in large files, the location of the cursor in the
    file.


    You can switch between two modes which you work in the vi editor. In Command mode,
    which you can access by pressing the Esc key, you can perform editing and application-level
    functions such as saving your documents or exiting the application. Insert mode
    allows you to work directly with the text in your file.


    When you finish working in vi, you can exit the program in Command mode by pressing
    the colon key, to access the command line at the bottom of the screen. You then
    press the q key and press Enter.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_251_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_251_1.png)


