  md: '# SET UP A MODEM


    You can use a modem to connect to other computers through a phone line. The most
    common type of connection with a modem is to an Internet service provider (ISP),
    which allows a computer to access the Internet.


    Your transfer rate to the serial port of the computer to which the modem connects.
    The slower speed represents the maximum data transfer rate at which the modem
    communicates with other modems.


    You can place a modem inside a computer, or connected to a port on the outside
    of the computer using a cable. A modem inside a computer is called an internal
    modem, while a modem outside a computer is called an external modem.


    Red Hat Linux uses the Internet Configuration Wizard to assist you in setting
    up your internet connection. It requires you to provide information about your
    modem, and then automatically configures your modem for you.


    A modem communicates through a serial port. An external modem connects to the
    serial port, typically located on the back of the computer, while an internal
    modem has a built-in serial port. To use the modem, you must know the name of
    the serial port to which the modem connects.


    Before you connect to an ISP, you will need to have the telephone number of the
    ISP as well as a login name and password that the ISP assigns to you.


    Your ISP may provide a software application for you to use when you connect your
    computer to the Internet using a modem. If so, use it to set up your modem connection
    inside of the Internet Configuration Wizard provided by Red Hat Linux.


    Each modem has two maximum speeds at which it transfers data. The faster speed
    represents the maximum data


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_131_0.png)


