  md: '# RED HAT LINUX 8


    # COPY FILES USING THE NAUTILUS FILE MANAGER


    You can copy files from one directory to another using the Nautilus file manager.
    Copying files from one directory to another makes an exact duplicate of the file
    in the destination directory.


    Nautilus allows you to store a copy of a file in the memory of the computer. You
    can then use Nautilus to navigate to the directory where you want to copy the
    file and create a copy of the file in the destination directory.


    You can copy any type of file, including audio files, documents, and directories.
    When you copy a directory, and all its contents, including subdirectories and
    their contents, will copy to the destination directory.


    When you copy a file using Nautilus, the copy of the file will have the same name
    as the name of the original file. You cannot copy a file into the same directory
    as the original file. You can only copy the file to a directory that does not
    contain a file with the same name as the original.


    You may be able to copy files that you cannot typically modify, and then modify
    the copy of the file. For example, many of the files in a Linux system can be
    modified or changed in any way, other than the root account, which is the account
    used by the system administrator. If you can read a file, but not modify the file,
    you can copy the file to your home directory and then modify the copy of the file.
    Copying a file and modifying the contents of the copied file will have no effect
    on the original, or source, file.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_79_0.png)


