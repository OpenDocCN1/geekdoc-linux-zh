  md: '# RED HAT LINUX 8


    # DISPLAY USER ACCOUNTS


    Each person who has access to a Linux system should have their own user account.
    You can display a list of user accounts to determine who has access to the system.


    Linux displays the name of the person to whom the account belongs. The name of
    the user is typically specified when the account is created. For more information
    about creating accounts, see page 276.


    Each user has a unique name assigned by the operating system when the account
    is created. This identification number is called the Unique Identification Number,
    or UID. When you display a list of the user accounts, you can also see the UID
    for each account.


    Linux creates some user accounts automatically when it is installed. However,
    Linux enables you to create other accounts as well when you install the application.
    These user accounts are used by applications and the operating system and should
    not be used by a person to log in to a Linux system. So, system, or created user
    accounts


    Each user may also belong to a group. A group is used to organize accounts. For
    example, all the users who work in the accounts department of an organization
    may belong to a group called accounts. For more information about groups, see
    page 276.


    User accounts display alphabetically. To locate a specific user account, scroll
    through the list of users until you locate the user you are looking.


