  md: '# BROWSE THE WEB USING CONQUERER


    You can use a browser to browse the World Wide Web or view Web pages from a network
    to which your computer is connected. Although Red Hat Linux uses the Mozilla Web
    browser as default browser, you can also use the Konqueror browser, which installs
    with the KDE desktop. The Konqueror Web browser is a fully functioning browser
    that can view any Web page. Before you view Web pages on the World Wide Web, you
    must have a connection to the Internet.


    If you make an error typing the address of a Web page, an error message appearing
    indicating that the Web is not available.


    Once you specify the address of a Web page, the Konqueror Web browser attempts
    to retrieve the Web page. Depending on the speed of the connection between your
    computer and the computer hosting the Web page, it may take a little while for
    the Web page to download. Complex or graphics-intensive Web pages may also take
    some time to display. Konqueror indicates the progress of the Web page as it downloads.
    While a Web page is downloading, the small cog icon in the upper-right corner
    of the display remains animated.


    When you launch Konqueror, it displays a Welcome page that it stores on your computer.
    You can then type the address of a Web page that you want to display in the Location
    bar field. The address of a Web page is called the Uniform Resource Locator or
    URL. Each URL is unique and starts with characters http:// HTTP is an abbreviation
    for Hypertext Transfer Protocol, the network protocol for transferring Web pages.


