  md: '# WORKING WITH INTERNET APPLICATIONS


    # Extra


    You perform tasks on IRC networks using a Command line at the bottom of the X-Chat
    screen. If you want to connect to an IRC network, type the command /attach and
    then the name of the network, as in /attach dalnet. You must prefix commands with
    a forward slash (/).


    You can connect to many different types of IRC networks. Some networks consist
    of only a few channels, while others can contain thousands of channels at a time.


    | COMMON IRC COMMANDS | FUNCTION |

    |---|---|

    | /quit | Disconnect from the network to which you are currently connected. |

    | /help | Display information about IRC commands and usage. |

    | /nick name | Assign a new nickname or choose another nickname. |

    | /server server | Attach to a specific IRC server. |


