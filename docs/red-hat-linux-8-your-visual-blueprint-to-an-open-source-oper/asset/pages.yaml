  md: '# EXPLORE THE PANEL


    The panel is an interface that you can use to access utilities, information, and
    applications. The desktop is a graphical environment that you can use to manage
    your Linux system. The desktop allows you to access all applications and information,
    and to manage the way you access those items to better suit your work.


    The desktop graphical environment uses the X Window System available on most Unix-like
    computers to produce a graphical display. The desktop environment is just one
    that you use. The desktop is installed by default when Linux is installed. The
    panel is installed with the graphical interface.


    The panel appears at the bottom of the display when the graphical interface starts.
    The panel contains many items that you can access. For example, the panel contains
    an icon that you can quickly access the Mozilla Web


    browser. The panel can contain items that present information, such as the data
    and time, and desktop management, which allows you to manage your open applications.


    You can find more information about an item on the desktop by holding the mouse
    pointer over the icon until a pop-up window opens, which displays more information
    about an item on the panel. Tooltips explain the function of various items.


    The panel has a help manual that you can access to find out the most current information
    about the panel and how to use it. You can use the help manual to better understand
    the features of the panel and how to configure and use its features.


