  md: '# CONNECT TO AN IRC CHANNEL


    You can communicate with other people on the Internet using Internet Relay Chat,
    or IRC. IRC is a service that enables you to seek technical support information
    from other people. IRC is similar to using instant messaging in the text that
    you type on the screen of each person taking part in the conversation.


    Before you connect to an IRC network, you must choose a nickname that identifies
    you on the IRC network. If someone is currently using the IRC network to which
    you are attempting to connect is already using the nickname, you must choose another
    nickname.


    You can use X-Chat, the IRC client that installs with Red Hat Linux, to facilitate
    using IRC. The first step of using IRC is to connect to an IRC network. An IRC
    network is a collection of computers, servers, on the Internet that people connect
    to to communicate using IRC. There are many IRC networks that you can use, each
    having their own collection of IRC networks.


    When you connect to an IRC network, a list of guidelines and usage instructions
    displays. You should read these guidelines and make sure you understand them before
    you start IRC.


    It may take a few moments for you to establish a connection to the IRC network.
    Before connecting to an IRC network, particularly a large IRC network such as
    DALNet, you should keep in mind that there might be some content that people find
    objectionable; you may want to familiarize yourself with appropriate usage guidelines
    before you use the network.


    # CONNECT TO AN IRC CHANNEL


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_161_0.png)


