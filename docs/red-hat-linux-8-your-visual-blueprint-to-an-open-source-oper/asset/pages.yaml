  md: '# START AN APPLICATION


    You start an application to perform a specific task. For example, you can start
    a word processing application to create a text document. There are two types of
    applications that you can use with Linux, graphical applications and text-based
    applications.


    do not require the use of the graphical interface. You can also use text-based
    application when logging in to a Linux system using Telnet.


    You can run the command on the Main Menu to execute a text-based application.
    When the application starts, a Terminal window will appear displaying the text-based
    application. For more information about the Terminal, see page 218.


    Graphical applications are used when you use a graphical interface to interact
    with Linux. You can access applications by accessing the Main Menu and selecting
    the application. Applications are typically divided into related groups on the
    menu. For example, applications related to image manipulation and viewing are
    grouped under a menu called Graphics.


    Linux comes with a wide array of applications already installed. Linux allows
    you to run many applications at the same time, with a combination of graphical
    and text-based applications. However, running many applications at one time may
    slow down the computer and running applications.


    Text applications are applications that use a text-based interface to interact
    with the user. Text-based applications


