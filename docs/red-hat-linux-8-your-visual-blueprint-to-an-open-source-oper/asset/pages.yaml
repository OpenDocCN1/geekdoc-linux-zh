    +   9 Type the name of the swap file directory.


    +   10 Click Continue.


    +   11 Select the resolution of your monitor.


    +   12 Click Continue.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Extra


    Depending on the size and complexity of the images that you work with, the computer
    you use to run the GIMP should have a processor that is Pentium class and have
    a minimum speed of 200 megahertz. Using a computer with a faster processor will
    result in increased performance when using the GIMP.


    If you do not know the resolution of your monitor, and you cannot obtain its specifications,
    you can use the calibrate feature which is available during the GIMP''s setup
    procedure to determine its resolution. During the monitor resolution phase of
    the GIMP setup, click Ruler or tape to measure the rulers displayed on the screen
    and enter their sizes into the appropriate areas. Click OK and the GIMP will determine
    the resolution of the monitor for you.


    The GIMP can run on computers that have as little as 32 megabytes of memory, but
    it is recommended that your computer have at least 128 megabytes of memory prior
    to running the GIMP.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_210_0.png)


