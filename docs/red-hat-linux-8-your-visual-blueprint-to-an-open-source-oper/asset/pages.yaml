  md: '# PERFORMING SYSTEM ADMINISTRATION


    # Extra


    You can choose from many different archive types to suit the type of files you
    are backing up.


    Before you choose the file type of the archive, you should take into account how
    you intend to use the archive file. If you intend to transfer the archive to another
    computer, you must ensure that the computer receiving the file is able to access
    the archive.


    Depending on the compression, and the number and size of files that you place
    into an archive, it may take a while to create it. For example, compressed archives
    take longer to create than archives that are not compressed.


    | EXTENSION | DESCRIPTION |

    | --- | --- |

    | .tar | Uncompressed TAR (Tape Archive). |

    | .tar.gz | TAR file compressed with a compression program called gzip. |

    | .zip | ZIP (Zone Information Protocol), a file type commonly used on Windows
    operating systems. |

    | .jar | JAR (Java Archive), a file type often used when transferring files over
    a network. |


