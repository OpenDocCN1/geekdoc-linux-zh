  md: '# RED HAT LINUX 8


    # CONFIGURE INTERNET SETTINGS


    You can configure your Internet connection to change the settings you have already
    specified or to add functionality to your existing Internet connection. When you
    connect to an Internet service, you should not need to change any of the settings
    of your Internet connection, but when you connect to a computer at another organization,
    such as at school or work, you may have to change these settings.


    Some of the Internet connection settings that you may need to change are the IP
    addresses associated with the connection. An IP address is a number used to uniquely
    identify a computer to the Internet. A subnet mask is IP number used to identify
    the network to which you are connected. You also need an IP number for the router
    on the network you are connecting to that attaches the network. Each IP number
    consists of four numbers, each less than or equal to 255, and separated by periods,
    as in 192.168.1.32.


    You can also set other options for your connection. One common setting is to configure
    your Internet connection to become active when you start your computer. This allows
    you to perform Internet tasks, such as checking your e-mail, when you start your
    computer. If you establish an Internet connection when the computer starts, the
    connection remains active until you disconnect from the Internet or you shut down
    the computer. For more information see page 124.


    All of the settings that you choose for an Internet connection are saved and used
    the next time the Internet connection is made. If you are constantly changing
    the settings of your Internet connection, it may be more efficient to create multiple
    Internet connections, each using different settings.


    # CONFIGURE INTERNET SETTINGS


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_135_0.png)


