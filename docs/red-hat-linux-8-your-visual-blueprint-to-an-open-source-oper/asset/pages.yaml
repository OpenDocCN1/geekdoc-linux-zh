    +   2 Click Preferences.


    +   3 Click Screensaver.


    +   The Screensaver Preferences dialog box appears.


    +   Set the time of inactivity before starting the screensaver.


    +   Click to enable the use of a password to deactivate the screensaver.


    +   Click to select the Only One Screensaver mode.


    +   Click Settings to configure the screensaver.'
  merge: -1
