  md: '# # START INSTANT MESSAGING


    You can use instant messaging to communicate with other people on the Internet
    in real time. Users communicate with each other by typing short messages that
    travel instantly to the recipient. Instant messaging requires the use of an instant-messaging
    service to coordinate the transmission of messages. There are instant-messaging
    services from many different companies.


    The instant-messaging application that comes with Red Hat allows you to communicate
    with others using the AOL instant-messaging service.


    To use instant messaging, you must first register with the AOL instant-messaging
    service. When you register with the messaging service, you receive a screenname
    and password. If you already have an account with the messaging service, you can
    use the same


    Gaim. If you are not registered with the AOL instant-messaging service, visit
    http://www.aol.com to register with the service.


    A buddy list is a list of people with whom you communicate using Gaim. After you
    sign into Gaim, you must add people to your buddy list. You can then communicate
    with them. To use Gaim with someone, the other person must register as a user
    of the AOL instant-messaging service, they also receive a screenname. You must
    know the screenname of the person you want to communicate with to add them to
    your buddy list. You can add many people to your list however you want to make
    your instant-messaging communication easier to manage. For more information about
    communicating with Gaim, see page 156.


    # ## START INSTANT MESSAGING


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_157_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_157_1.png)


    +   1 Click the Main Menu button.


    +   2 Click Internet.


    +   3 Click Instant Messenger.


    +   5 The Gaim-Login window appears.


    +   6 Type your password.


    +   4 Type your screenname.'
