  md: '# RED HAT LINUX 8


    # VIEW A PDF DOCUMENT


    The Portable Document Format, or PDF, is a way of creating electronic documents
    that appear on a display as they would appear when they are printed. PDF files
    can contain many items as images, bookmarks for easy navigation, and hyperlinks
    that can be used to access information on the World Wide Web. You can view a PDF
    document on a Linux system.


    After xpdf has been opened, you can specify the name of the PDF document that
    you want to view. xpdf can only be used to view PDF documents; you cannot create
    PDF documents using xpdf. For more information about creating PDF documents using
    xpdf, you can visit the Adobe site, the creators of the PDF file format, at www.adobe.com.
    Depending on the size and complexity of the PDF document that you attempt to open,
    it may take a few minutes to fully open the document and display it within xpdf.


    When Linux is initially installed, PDF viewing application called xpdf is also
    installed. xpdf allows you to view PDF documents. PDF documents are often retrieved
    from the World Wide Web. Many applications also now come with documentation, such
    as user manuals, in the form of a PDF document.


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_185_0.png)


    ![](img/0fb3b9489380ca1b87c2aa7ab52f3066_185_1.png)


    +   1 Click the Main Menu button.


    +   2 Click Graphics.


    +   3 Click PDF Viewer.


    +   The main xpdf window opens.


    +   4 Right-click the xpdf window to open the pop-up menu.


    +   5 Click Open.


    170'
  merge: -1
