  md: '# CONFIGURE THE VIDEO SYSTEM TYPE


    You can configure the video system to reflect the type of video card you have
    in your computer. You can change the video card if your current video card is
    detected correctly, or if you have changed the video card since Linux was first
    installed.


    One of the more difficult tasks that a computer can perform is detecting the type
    of video card used in your computer. You Linux attempt to detect the type of video
    card in your computer; however, Linux may detect it incorrectly.


    When Linux attempts to detect a video card, it tries to retrieve the information
    from the video card. This process of information retrieval is called probing.
    When Linux is first installed, it attempts to probe the video card during the
    installation process.


    To change the video card, you must choose a new video driver. Linux allows you
    to choose from many different types of video cards, each one represented by a
    different video driver. It is possible for different video cards to use the same
    video drivers.


    The video card can be a separate card installed into an internal expansion slot
    inside your computer, or it can be a built-in video system, such as in a laptop
    computer or computer with integrated video ports.


    Some video cards may have extra options that you can configure. Always refer to
    the video card documentation for enabling or disabling any available options.
    You must be logged on with the root account to change the display settings.


