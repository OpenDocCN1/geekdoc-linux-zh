  md: '# The UNIX File System Continued


    When you access a file using utilities or commands (such as vi or cat) or when
    a program opens a file, UNIX reads and searches the directory for the specified
    filename. There is an i-node associated with each filename that points to a specific
    i-node in the i-node list. UNIX uses your working directory i-number to begin
    search, or if you give a full pathname, it starts from the root directory, which
    always has the i-node 2.


