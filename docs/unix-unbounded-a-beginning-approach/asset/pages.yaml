  md: '# Using [Spacebar], [Tab], [Back Space], and [Return]


    While in the text mode, the vi displays the letters you type on the screen, but
    not all keys on the keyboard produce a displayable character. For example, when
    you press [Return] you intend to move the cursor to the next line, and you do
    not expect to see a [Return] symbol on the screen. As you know now, depending
    on the vi editor''s mode, keys have different meanings. Consider the use of these
    keys in the text input mode.


    [Spacebar] and [Tab] Press [Spacebar] always produces a space character before
    the cursor position. Press [Tab] usually produces eight spaces. The tab size is
    changeable and can be set up for any number of spaces (See chapter 6).


    [Back Space] Press [Back Space] moves the cursor one to the left over the currently
    typed text.


    [Return] Press [Return] always opens a new line. Depending on the position of
    the cursor on the current line, it opens a line above or below the current line:


    +   * If the cursor is at the end of the line or there is no right to it, then
    pressing [Return] opens an empty line below the current line.

    * If the cursor is on the very first character of the current line, then pressing
    [Return] opens an empty line above the current line.

    * If the cursor is somewhere on the line with text to the right of it, then pressing
    [Return] splits the line, and the text on the right of the cursor moves to the
    new line.


    The above explanation applies only when the vi editor is in the text input mode.


