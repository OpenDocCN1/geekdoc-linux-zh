    # 8.4.7 Sorting Text Files: The sort Command


    You can use the sort command to sort the contents of a file into alphabetical
    or numerical order. By default, the output is displayed on your terminal, but
    you can specify a filename as the argument or redirect the output to a file.

    The sort command sorts the specified file on a line-by-line basis. If the first
    characters on two lines are the same, it compares the second characters to determine
    the order of the sort. If the second characters are the same, it compares the
    third characters, and this process goes on until two characters differ or the
    line ends. If two lines are identical, then it does not matter which one is placed
    first.


    This command sorts files alphabetically, but the order might be different from
    one computer to another, depending on the computer''s code set. The most commonly
    used code set in UNIX systems is ASCII.'
