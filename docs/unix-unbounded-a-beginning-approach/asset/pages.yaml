    $ _ . . . . . . . . . . . . . . . . . . . . . Ready for the next command.

    $ cat myfirst[Return] . . . . . . . . . . . . . . . . . . . . . . Check to see
    if myfirst has been cre-ated; display it on the screen.

    ```


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_173_0.png)'
