  md: '# 5.3.1


    # Understanding Paths and Patenames


    Every file has a pathname. The pathname locates the file in the file system. You
    determine a file''s path by tracing a path from the root directory to the file,
    going through all intermediate directories. Figure 5–4 shows a hierarchy and the
    pathnames of its directories and files. For example, using figure 5–4, if your
    current directory is root, then the path to a file (say, myfirst) under the direct
    directory is /usr/david/myfirst.


    At the end of each path is an ordinary file (called file) or a directory file
    (called directory). Ordinary files are at the ends of paths and cannot have further
    directories, or, using the tree analogy, leaves cannot have branches. Directory
    files are the points in the file structure that can support other paths, just
    as tree branches have other branches.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_103_0.png)


    +   1. The forward slash (/) at the ve beginning of a pathname stands for the
    root directory.

    2. The other slashes serve to separate the names of the other directories and
    files.

    3. The files in your working directory are immediately accessible. To access files
    in another directory you need to specify the particular file by its path-name.


    **Absolute pathname** An absolute pathname (full pathname) traces a path from
    the root to the file. An absolute pathname always begins with the name of the
    root directory, forward slash (/). For example, if your working directory is usr,
    the absolute pathname of the file called myfirst under the directory david is
    /usr/david/myfirst.


    +   1. The absolute pathname specifies exactly where to find a file. Thus it can
    be used to specify file location in the working directory or any other directory.

    2. Absolute pathnames always start from the root directory and therefore have
    a forward slash (/) at the beginning of the pathname.


    Figure 5–4

    Pathnames in a directory structure.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_103_1.png)'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Chapter 5


    # Introduction to the UNIX File System


    # 83


    **Relative Pathname** A relative pathname is a shorter form of the pathname. It
    traces a path from the working directory to a file. Like the absolute pathname,
    the relative pathname can describe a path through many directories. For example,
    if your working directory is usr, the relative pathname to the file called REPORT
    under the david directory is david/REPORT.


    There is no initial slash (/) for a relative pathname. It always starts from your
    current directory.


    # 5.3.2


    # Using File and Directory Names


    Every ordinary and directory file has a filename. UNIX gives you much freedom
    in naming your files and directories. The maximum length of the filename depends
    on the UNIX version and system manufacturer. All UNIX systems allow a filename
    to be at least 14 characters, and must support much longer filenames, up to 255
    characters.


    You name a file using a combination of characters or numbers. The only exception
    is the root directory, which is always named / (forward slash) and referred to
    by this single character. No other file can use this character.


    There are certain characters that have a special meaning to the shell you use.
    If these characters are used in a filename, the shell interprets them as part
    of a command and acts on them. Although there are ways to override this interpretation
    of special characters, a better choice is to avoid using them. In particular,
    avoid using the following characters in file names:


    +   < . . less than greater than signs

    () . . open and close parentheses

    [] . . open and close brackets

    {} . . open and close braces

    * . . asterisk or star

    ? . . question mark

    " . . double quotation mark

    '' . . single quotation mark

    $ . . dollar sign

    ^ . . caret

    . . . dot


    You can avoid confusion if you choose characters for filenames from the following
    list:


    +   uppercase letters . . (A-Z)

    lowercase letters . . (a-z)

    numbers . . (0-9)

    underscore . . (_)

    dot (period) . . (.)


    UNIX uses spaces to tell where one command or filename ends and another one begins.
    Use a period or underline where you normally would use a space. For example, if
    you want to give the name MY NEW LIST to a file, you may call it MY_NEW_LIST or
    MY.NEW.LIST instead.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_104_0.png)'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'The filename you choose should mean something. Names like junk, whoopee, and
    ddx are correct filenames, but they are poor choices because they do not help
    you recall what you stored in the file. Choose a filename as descriptive and associate
    it with contents of the file. The following filenames have correct syntax and
    also convey information about the contents of the file:


    ```

    REPORTS   Jan_list my_memos

    shopping.lis Phones edit.c

    ```


    The UNIX operating system is case-sensitive; Uppercase letters are distinguished
    from lowercase letters. You can use a mixture of uppercase and lowercase letters
    in any sequence within your filename. Keep in mind, however, that files named
    MY_FILE, My_File, and my_file are considered to be different entities.


    UNIX makes no distinction between names that can be assigned to ordinary files
    and those that can be assigned to directory files. Hence, it is possible to have
    a directory and a file with the same name, for example, the lost+found could have
    a file in it called lost+found.


    Referring to the parent and child analogy, no two files in the same directory
    have the same name, like children of one parent. It makes good sense for parents
    to give their children different names, but in UNIX it is mandatory. However,
    like children of different parents, files in different directories can have the
    same names.


    You must avoid using spaces in any part of a filename.


    **Filename Extensions** The filename extension helps to further categorize and
    describe the contents of a file. Filename extensions are part of the following
    period and in most cases are optional. Some programming language compilers, like
    those for C, depend on a specific filename extension. (Compilers are explained
    in chapter 10.) In figure 5–5, first.c in the source directory has a typical extension,
    .c, for the C programming language.


    The following examples show some filenames with extensions.


    ```

    report.c   report.o

    memo.04.10

    ```


    Note that the use of more than one period in a file extension is allowed in UNIX.


