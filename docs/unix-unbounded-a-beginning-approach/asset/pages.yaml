    # 11.4.1 Arithmetic Operations (sh): The expr Command


    You can use the expr command to evaluate expressions. This command provides arithmetic
    capability and evaluates either numeric or nonnumeric character strings. The expr
    command takes the arguments as expressions, evaluates them, and displays the results
    on the standard output device.


    # Arithmetic Operators


    The following command sequences introduce the arithmetic operator and demonstrate
    the use of the expr command to evaluate constants.


    Adding and subtracting constants.


    ```

    $ expr 1 + 2 [return] . . . . . . . . . . . . . The + sign is the addition operator.

    3

    $ expr 15 - 6 [return] . . . . . . . . . . . . . The - sign is the subtraction
    operator.

    9

    $ expr 6 - 15 [Return]

    $ expr 2.4 - 1[Return] . . . . . . Bad argument (2.4); integers only.

    expr: nonnumeric argument . . . . . . . . . . UNIX error message.

    $ expr 1+1 [Return] . . . . . . . . . . . . Bad argument (1+1).

    1+1 . . . . . . . . . . . . . . . Displays string 1+1.

    $_

    ```


    Spaces between the elements of an expression are necessary. The correct command
    is typed as expr 1 + 1. Notice the spaces around the + sign.


    Dividing, multiplying, and calculating a division remainder.


    ```

    $ expr 10 / 2 [Return] . . . . . . . . . . . . . The / sign is the division operator.

    5

    $ expr 10 \* 2 [Return] . . . . . . . . . . . . . The * is the multiplication
    operator.

    20

    ```'
