  md: '# WHAT IS AN EDITOR?


    Editing a text file is one of the most frequently performed computer operations.
    In fact, most of the things you will want to do will require some sort of file
    editing sooner or later.


    An editor (text editor) is a tool that facilitates the creation of files or modification
    of existing files. Files may contain notes, memos, program source code, and so
    on. An editor is a washed down, vanilla sort of word processor. It does not have
    the typographical features (bold, center, underline, etc.) that word processors
    do.


    At least one editor program is supplied with the software of every operating system.
    There are two general types of editors:


    +   - line editors

    - full screen editors


    **The Line Editor** In a line editor, most of the changes are applied to only
    one line or group of lines at a time. To make a change you must first specify
    the line number in the text, and then you must specify the change itself. Line
    editors are usually difficult to use because you cannot see the scope and context
    of your editing task. Line editors are good for global operations like searching,
    replacing, and copying large blocks of text in your file.


    **The Screen Editor** A screen editor displays the text that you are editing one
    screen at a time and allows you to move the cursor around the screen and make
    changes. Any changes you make are applied to the file, and you get an immediate
    feedback on the screen. You can easily view the rest of the text one screen at
    a time. The screen editors are more user-friendly than line editors and are preferred
    for everyday editing jobs.


    # UNIX-Supported Editors


    The UNIX operating system supports a number of both line and screen editors, so
    you can create or alter a file easily and efficiently. To name a few, emacs and
    vi are a screen editor under.


    A line editor ed is an old editor supplied with the early versions of the UNIX
    operating systems. Currently, the ex family of editors is supplied with most UNIX
    operating systems. The ex originally provided a display facility that showed and
    let you work with a screen of text instead of a line in time. In order to use
    this capability, you had to give the vi (for visual) command. However, the use
    of the visual mode of the ex editor became so popular that the developers of the
    ex now provide a separate vi editor. This means you can use vi without having
    to start the ex.


    > See page xx for an explanation of the icons used to highlight information in
    this chapter.'
  merge: -1
