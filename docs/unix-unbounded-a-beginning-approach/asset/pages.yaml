    # ## 13.2.4 Timing Programs: The time Command


    You can use the time command to obtain information about the computer your command
    uses. It reports the real time, user time, and system time. Type time followed
    by the command name you want to.


    Real time is the actual time (elapsed time) from the moment you enter the command
    until the command is finished. This includes I/O time, time spent waiting for
    other users, and so on. The real time can be times greater than the total CPU
    time.


    User time is the CPU time dedicated to the execution of your command.


    System time is the time spent executing UNIX kernel routines to service your command.


    CPU time is the time in seconds and fractions of seconds that the CPU spends to
    execute your command.


    Report the time it takes to sort BIG_FILE.


    +   * time sort BIG_FILE > BIG_FILE.SORT [Return]

    60.8 real 11.4 user 4.6 sys


    +   * ................................................ Ready for the next command.


    The reports show that the program runs for 60.8 seconds of real time, using 11.4
    seconds of user time, and 4.6 seconds of system time, for a total of 16 seconds
    of the CPU time.


