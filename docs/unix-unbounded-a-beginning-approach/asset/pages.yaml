    # 8.6.3 Commands History (ksh): The history command


    The Korn shell has a commands history feature that keeps a list of all the commands
    you enter during your sessions. Using this very popular feature you are able to
    list your previous commands, search for a particular command that you have issued,
    easily edit and redo your previous commands.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_248_1.png)


    To display the last few commands you have entered, do the following:


    ```

    $ history [Return] . . . . Issue the command.

    101 Who am i

    102 ls -l

    103 pwd

    104 vi myfirst

    105 mm myfirst

    106 history

    $ _ . . . The prompt appears.

    ```


    +   1. The preceding example displays six lines of commands. The number of command
    lines that ksh keeps track of is controlled by the HISTSIZE variable.

    2. The last item on the list is your last command, and your earlier commands are
    higher on the list.


    The default history file is called .sh_history, and it is created by the system
    in your home directory. You may use another filename by setting the variable HISTFILE
    to the path of your desired history filename.


    ```

    HISTFILE=$HOME/history/my_hist

    ```


    # Restarting The History File


    The history of your commands is kept from one session to another and consequently
    the entry numbers will become large and cumbersome to type or refer to. If you
    want to restart your history file, remove your .sh_history file from your home
    directory. The next time you log in, the system creates a new .sh_history file
    and the entries start from the number one.'
