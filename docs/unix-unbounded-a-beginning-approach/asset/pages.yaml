    which the input files are specified.


    # 7.3 ENHANCED FILE PRINTING


    The lp command sends your file to the printer as it is; it does not change the
    appearance or format of your file. You can however improve the appearance of the
    output by formatting it, for example, adding page numbers, page headings, and
    double-spaced lines to a document before sending it to the printer or viewing
    it on the screen.'
