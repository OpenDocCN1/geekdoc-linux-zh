  md: '# Figure 9–1


    Typical screen conversation: the top screen is David''s and the bottom screen
    is Daniel''s.


    ```

    $ write daniel [Return]

    Hello Dan [Return]

    Is today''s meeting still on? [Return]

    [Ctrl-d]

    <EOT>

    $

    ```


    ```

    Message from david on dan (tty06) [Thu Nov 9:30:30] ...

    Hello Dan

    Is today''s meeting still on?

    <EOT>

    $

    ```


    To use the write command, you must know the user ID of the person with whom you
    want to communicate. You use the who command (discussed in chapter 3) to obtain
    the user IDs of the logged users.


    Daniel can reply by using the write command from his terminal, but he does not
    have to wait for you to finish your message. When he sees the initial message
    that you are writing to him, he can send messages while you send him messages
    if you type write david and presses [Return].


    With write simultaneously active on both terminals, you and Daniel can carry on
    a two-way exchange. Sometimes this two-way exchange becomes confusing, so it is
    useful to establish a protocol for using write. The common protocol for UNIX users
    is to end message lines with the character o (for over) to inform the receiving
    party that a message is finished and you are (possibly) waiting for a reply. When
    you intend to end the conversation, type oo (for over).


    If you receive a write message from another user, the message appears on your
    terminal, regardless of what you are doing. If you are using vi editor and are
    in the middle of an editing job, the write message appears on the screen where
    the cursor is. It does not be alarmed. This is a terminal-to-terminal communication,
    and what write produces does not damage your editing file. It simply overwrites
    information on your screen, and you can continue with your editing or whatever
    other job you were doing.


    Nevertheless, receiving messages while you are concentrating on a job is inconvenient,
    not to mention the mess it makes on your screen. You can prevent your terminal
    from accepting messages coming from the write command.


    # 9.1.2 Inhibiting Messages: The mesg Command


    You can use the mesg command as a toggle to stop receiving messages from the write
    command or to reactivate messages. mesg without argument shows the current status
    of your terminal in this respect.'
