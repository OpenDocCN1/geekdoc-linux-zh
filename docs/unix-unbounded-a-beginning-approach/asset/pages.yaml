  md: "Interpreter Like the compiler, the interpreter translates a high-level language\
    \ into machine language. However, instead of translating the entire source program,\
    \ it translates a single line at a time. An interpreter gives you immediate feedback.\
    \ If the code contains an error, the interpreter picks it up as soon as you press\
    \ [Return] to finish a line of code. Therefore, you can correct errors during\
    \ program development. The interpreter does not produce a separate object code\
    \ file, and it must perform the translation each time a program is executed. Interpreters\
    \ are usually used in an educational environment, and the executable code they\
    \ produce is less efficient than the code produced by a compiler.\n\n# A Simple\
