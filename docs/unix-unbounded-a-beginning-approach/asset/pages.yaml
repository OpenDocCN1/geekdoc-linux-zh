  md: '# UNIX UNBOUNDED: A BEGINNING APPROACH


    Using the cat command with the input redirection operator gives you the same result
    as the cat command with the filename as an argument. There are other commands
    which work in the same manner. If you specify a filename on the command line,
    the command takes its input from the filename. If you do not specify any argument,
    the command takes its input from the default input device (your terminal), and
    if you have the input redirection operator to specify where the input comes from,
    the command takes its input from the file you specify.


    The redirection operator (<) is used mostly in script files (shell programs) to
    provide standard input to other commands. (This topic is discussed in more detail
    in chapter 10.)


    # 7.2.3 The cat command Revisited


    Now that you know about the shell redirection capabilities, we can explore the
    cat command in more detail. The cat command was introduced in chapter 5, where
    it was used to show contents of a small files on the screen. However, the cat
    command can be used for many things other than displaying files.


    # Creating Files


    By using the cat command with the output redirection operator (>), you can create
    a file. For example, if you wanted to create a file myfirst, you would type cat
    > myfirst. This means the output of the cat command is to be redirected to the
    standard output device (your terminal) to a file myfirst. The input comes from
    the standard input device—your keyboard). In other words, you type the text, and
    cat saves it in myfirst file. You signal the end of the file by pressing [Ctrl-d]


    This feature of the cat command is useful for creating small files quickly. Of
    course, you can also use it to create long files, but you must be a very accurate
    typist because after you press [Return] you cannot edit the text you have typed.
    The following command sequences show how to create a file using the cat command.


    Try using the cat command with the output redirection operator to create a file.


    ```

    $ cat > myfirst[Return] . . . . . . . . . . . . . . . . Create a file called myfirst.


    . . . . . . . . . . . . . . . . . . . Cursor for your input. Let''s say

    you type the following:


    I was there a better way to learn

