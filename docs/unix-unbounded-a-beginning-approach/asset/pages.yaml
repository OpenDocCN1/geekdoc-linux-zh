  md: '# 8.1 THE UNIX SHELL


    The UNIX operating system consists of two parts: the kernel and the utilities.
    The kernel is the heart of the UNIX system and memory-resident (which means that
    it stays in the memory from the time you boot the system until it is shut down).
    All the routines that communicate directly with the hardware are concentrated
    in the kernel, which is relatively small in comparison with the rest of the operating
    system.


    In addition to the kernel, other essential modules are also memory-resident. These
    modules perform important functions such as input/output control, file management,
    memory management, processor time management, etc. UNIX maintains several memory-resident
    tables for housekeeping purposes, to keep track of the system''s status.


    The rest of the UNIX system resides on the disk and is loaded into the memory
    only when necessary. Most of the UNIX commands you know are programs (called utilities)
    that reside on the disk. For these programs, when you type a command (request
    the program to be executed), the specified program is loaded into the memory.


    You communicate with the operating system through a shell, and hardware-dependent
    operations are managed by the kernel. Figure 8–1 shows the components of the UNIX
    operating system.


    The shell is a program (a utility program). It loads into the memory whenever
    you log in to the system. When the shell is ready to execute commands, it displays
    a prompt. The shell itself does not carry out most of the commands you type; it
    examines each command and starts the appropriate UNIX program (utility) that carries
    out the requested action. The shell determines what program to start (the name
    of the program is the same as the command you type). For example, when you type
    ls and press [Return] to list current directory files, the shell finds and starts
    a program called ls. The shell treats your application programs the same way:
    you type the program''s name as a command, and the


    # Figure 8–1


    The components of the UNIX operating system.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_215_0.png)


    See page xx for an explanation of the icons used to highlight information in this
    chapter.'
  merge: -1
  pgno: 215
