    The instruction cycle is performed within the control unit; the execution cycle
    is performed within the arithmetic and logic unit.


    # 1.4.1 Performance Measurement


    Most computers are designed to be general-purpose computers; they support a wide
    variety of application programs. It is not possible for computer manufacturers
    or vendors to know the workload of your computer and to provide you with performance
    measurements for various machine actions, Instead, they provide performance measurements
    such as executing an instruction, accessing memory, or reading from a magnetic
    disk. Performance measurement is generally given as specific measures of each
    component of the computer, a measure of the communication capacity among the components,
    and a general measurement that allows to summarize all of the performance measurements.


    CPU Speed Within the CPU, the primary performance consideration is the speed at
    which an instruction can be executed. This is usually specified in terms of millions
    of instructions per second (MIPS). Unfortunately, not all instructions take the
    same amount of time to execute. Certain instructions, such as addition of whole
    numbers, execute quickly; others, as division of fractional (float-'
