    and computer animation. All these tasks require an extremely large number of complex
    calculations and need supercomputer performance. Supercomputers usually have hundreds
    of processors and are used with the latest and most expensive hardware devices.


    Supercomputers are used for numerous other applications. Even Hollywood uses the
    advanced graphics capabilities of supercomputers to create special effects for
    movies.


    Mainframe Computers Mainframe computers are large, fast systems designed to meet
    the information processing needs of large organizations. Mainframes can support
