  md: '# Chapter 11


    # Shell Programming


    # 307


    # Table 11–3


    The shell positional variables.


    | $S0 | Contains the name of the script, as typed on the command line. |

    | $S1,$2,... $S9 | Contains the first through ninth command line parameters, respectively.
    |

    | $$ | Contains the number of command line parameters |

    | $@ | Contains all command line parameters. "$S1 $2......$9" |

    | $? | Contains the exit status of the last command. |

    | $* | Contains all command line parametrs. "$S1 $2......$9" |

    | $$ | Contains the PID (process ID) number of the executing process. |


    +   1. The special variable $S0$ holds the name of the script typed on the command
    line.

    2. Special variables $S1, $S2, $S3, $S4, $S5, $S6, $S7,$ and $S9$ hold arguments
    1 through 9 respectively. Command line arguments after the ninth parameter are
    ignored.

    3. The special variable $S*$ holds all of the command line arguments passed to
    the program in a single string. It can store more than nine parameters.

    4. The special variable $@ holds all of the command line arguments, just like
    the $S*$. However, it stores them with quotation marks around each command line
    argument.

    5. The special variable $$$ holds the count of the command line arguments that
    are typed on the command line.

    6. The special variable $?$ holds the exit status received from the exit command
    in your script file. If you have not coded an exit, then it holds the status of
    the last nonbackground command executed in your script file.

    7. The special variable $$$$ holds the process-ID of the current process.


