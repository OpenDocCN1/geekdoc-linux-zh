  md: '# Chapter 11


    # Shell Programming


    # 305


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_326_0.png)


    The shell recognizes # as the comment symbol; therefore, characters after the
    # are ignored.


    The following command sequences show examples of a comment line.


    +   # .....................................................................................................................................
    This is a comment.


    +   # program version 3 ............................................................................
    This is also a comment line.


    +   date # show the current date ............................................
    Comment in the middle of the line.


    # 11.3.2 Variables


    Like other programming languages, the UNIX shell lets you create variables to
    store values in. To store a value in a variable, you simply write the name of
    the variable, followed by the equal sign and the value you want to store in the
    variable, like this:


    ```

    variable=value

    ```


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_326_1.png)


    Spaces are not permitted on either side of the equal sign.


    The UNIX shell does not support data types (integer, character, floating point,
    etc.) as some programming languages do. It interprets any value assigned to a
    variable as a string of characters. For example, count=1 means store count in
    the variable called count.


    The variable names follow the same syntax and rules that apply to file names as
    described in chapter 7. Briefly, to refresh your memory, names must begin with
    a letter or an underscore character (_); you can use letters and numbers for the
    rest of the name.


    The shell is an interpretive language, and the commands or variables you place
    in your script file can be directly typed at the $ prompt. Of course, this method
    is a one-time process; if you want to repeat the sequence of commands, you have
    to type them again.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_326_2.png)


    The following examples are valid variable assignments, and they remain in effect
    until you change them or log off.


    ```

    $ count=1 [Return] ....................................................... Assign
    character 1 to count.

    $ header="The Main Menu" [Return] ................................ Store the string
    in header.

    $ BUG=insect [Return] ................................................ Another
    variable assignment.

    ```


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_326_3.png)


    If your string contains embedded white space, then you must place it between tween
    quotation marks.


    Variables in your script stay in the memory until the shell is finished, or you
    can erase the variables by using the unset command. To do this, you type the name
    of the variable you want to erase, and press [Return]. For example, the following
    command erases the variable called XYZ:


    ```

    $ unset XYZ [Return]

    ```'
