  md: '# Chapter 11 Shell Programming 339


    sh

    This command invokes a new copy of the shell. You can run your script files using
    this command. Only three of the numerous options are mentioned.


    | Option | Operation |

    |---|---|n| -n | Reads commands, but does not execute them. |

    | -v | Prints the input to the shell as the shell reads. |

    | -x | Prints command lines and their arguments as they are executed. This option
    is used mostly for debugging. |


    (dot)

    This command lets you run a process in the current shell environment, and doesn''t
    allow the shell to create a child process to run the command.


    exit

    This command terminates the current shell program whenever it is executed. It
    can also return a status code (RC) to indicate the success or failure of a program.
    It also terminates your login shell if it is typed at the $ prompt and logs you
    off.


    read

    This command reads input from the input device and stores the input string in
    one or more variables specified as the command arguments.


    test

    This command tests the condition of an expression given to it as an argument,
    and returns true or false depending on the status of the expression. It gives
    you the capability of testing different types of expressions.


    expr

    This command is a built-in operator for arithmetic operations. It provides arithmetic
    and relational operators.


    let (ksh)

    This command is available with the Korn shell and provides arithmetic operations.


