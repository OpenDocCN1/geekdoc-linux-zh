    (ing) numbers, might execute more slowly. The measurement that is specifically
    oriented to computation of fractional numbers is millions of floating-point operations
    per second (MFLOPS).


    The MFLOPS performance measure is commonly given for workstations and supercomputers.
    It is expected that the applications running on these machines perform mostly
    floating-point computations.


    Access Time The speed at which the CPU can retrieve data from storage or input/output
    (I/O) devices depends on the access time. Access is measured in milliseconds (millions
    of a second) or nanoseconds (billions of a second).


    Channel Capacity When access time is stated for a specific device, there is no
    guarantee that the communication channel between the device and the CPU is capable
    of supporting that speed. The ability of the communication channel to support
    data movement between the CPU and a device, or vice versa, is normally specified
    as a data transfer rate. This specifies the amount of data that can be moved over
    the channel in a specified interval of time—for example, one line items per second.


    Overall Performance The overall performance of a computer system is a combination
    of the CPU speed, the access time of the storage and I/O devices, and the capacity
    of the communication channels connecting them to the CPU. Different applications
    create different demands on the various computer components. Thus, overall performance
    measurement is valid only for a particular instance or class of applications.


    # 1.5 WHAT IS SOFTWARE?


    A computer off the assembly line with no software is just a machine (hardware)
    and is not capable of doing much. It is the software that gives a computer its
    diverse capabilities. Through software, a computer can take on any one of many
    personalities. With the right software, a computer can become a word processor,
    a calculator, a database manager, or a sophisticated communications device—or
    all of them at the same time.


    In general, computer programs are called software. You can run numerous programs
    on the machine (hardware) to perform different tasks.


    Program is a set of instructions that directs the activities of a computer system.
    It consists of instructions that are logically sequenced to perform a specific
    operation. Programs are written in one of the available computer programming languages.
    Computer programming languages are necessary to facilitate the creation of the
    application programs. A wide range of development tools are available to aid the
    programmers in developing application and system programs.


    Software Categories The computer software can be categorized into two types: system
    software and application software. The operating system is the most important
    system software and the only software that is absolutely necessary for the computer
    to function. However, it is the application software that makes computers useful
    in different environments and for many jobs. Figure 1–4 shows the general categories
    of software and examples of their associated software programs.


