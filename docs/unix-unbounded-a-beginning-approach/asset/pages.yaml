  md: '# Chapter 11 Shell Programming 301


    ```

    $ chmod u+x bye [Return] ....................... Change the file mode.

    $ bye [Return] ........................................ Log out.

    $_ ....................................................... You are still in UNIX.

    ```


    Why didn''t exit work? When you give a command to the shell, it creates a child
    process to execute the command (as described in chapter 8). Your login shell is
    the parent process, and your script file bye is the child process. The child process
    (bye) gets the exit command that consequently terminates the child process (bye).
    When the child is dead, control goes back to the parent (your login shell). Therefore
    the prompt is displayed.


    To make the bye script work, you must prevent the shell from creating a child
    process using the dot command as described in the following section), so that
    the shell executes your program in its own environment. Then the exit command
    terminates the current shell (your login shell), and you are logged out.


    # 11.2.3 Executing Commands: The dot Command


    The dot command (.) is a built-in shell command that lets you execute a program
    in the current shell and prevents the shell from creating the child process. If
    you are want to test your script files, such as the .profile file in your home
    directory contains any command that you want to execute whenever you log in. You
    do not need to log out or log in to activate your .profile file. Using the dot
    command, you can execute .profile, and the commands in it applied to the current
    shell, your login shell.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_322_0.png)


    Returning to your bye script file, let''s execute it again, this time using the
    dot command.


    ```

    $ bye [Return] ........................................ Using the dot command.

    UNIX System V Release 4.0 ....................................................

    login:_ ................................................................... Login
    prompt.

    ```


    As with other commands in UNIX, there is a space between the dot command and its
    argument (in this case, your bye program).


    Let''s try another version of the bye script that does not require the dot command
    so you can simply bye and press [Return] to log off.

    In chapter 8, you learned about the kill command. The following command placed
    in the bye script file means to kill all processes, including the login shell.


    ```

    $ cat bye [Return] ....................................... bye new version.

    kill -9 0 ................................................ Command to all processes.

    $_ ....................................................................... Prompt.

    ```


    Only one problem remains. You want to be able to use the bye script regardless
    of your current directory. If bye is in your home directory, you have to either
    change your home directory every time you want to execute bye or type the full
    pathname to the bye file.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_322_1.png)'
