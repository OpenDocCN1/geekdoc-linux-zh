  md: '# Chapter 2


    # The UNIX Operating System


    # 27


    **Resident Modules Layer** The resident modules layer provides service routines

    perform user-requested services. These services include input/output control

    services, file/disk access services (called the file system), and process the
    cre-

    tation and termination. A system call is used by application programs to access

    this layer.


    **Utility Layer** The utility layer is the UNIX user interface, commonly referred
    to

    as the shell. The shell and each of the other UNIX commands and utilities are
    sep-\erate programs. They are part of the UNIX distribution software but are not
    con-

    sider of the kernel. There are more than 100 commands and utilities in

    UNIX that provide various types of services to users and application programs.


    **Virtual Computer** The UNIX operating system allocates an execution environ-

    to each user in the system. This environment, or virtual computer, consists

    of a terminal for user interface and shared access to the other computer resources

    as memory, disk disks, and most importantly, the CPU. UNIX, a multiuser

    operating system, is implemented as a collection of virtual computers. To the

    users, it appears that each of them has his or her own pseudocomputer.

    The virtual computers are slower than the base computer due to sharing the CPU

    and hardware resources with other virtual computers.


    **Processes** The UNIX operating system allocates resources to users and pro-

    grams by way of processes. Each process has a process identification number,

    an a set of resources is associated with that number. Each is executed in a vir-

    tual environment. What this really means is that a process runs in a vir-

    tual computer as if it had a dedicated single-user CPU.


    # 2.4 UNIX FEATURES


    This section briefly discusses some features of the UNIX operating system.

    UNIX has some features that are common to most operating systems. It also has

    some unique features.


    # 2.4.1 Portability


    The use of the C programming language made UNIX a portable operating sys-

    tem. Today, the UNIX operating system works on a variety of machines ranging

    from microcomputers to supercomputers. The portability feature helps de-

    crease the user''s learning time when moving from one system to another. It also

    provides more choices among hardware vendors.


    # 2.4.2 Multiuser Capability


    Under UNIX, a number of users can share computer resources simultaneously.

    Depending on the machine being used, UNIX may be able to support more than

    one hundred users, each running a different program. UNIX provides secu-'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'rity measures that permit users to access only the data and programs for which
    they have permission.


    # 2.4.3 Multitasking Capability


    UNIX allows the user to initiate a task and then proceed to perform other tasks
    while the original task is being run in the background. also allows users to switch
    back and forth between the tasks.


    # 2.4.4 Hierarchical File System


    UNIX provides users with the ability to group data and programs in a manner that
    provides easy management. Users can find data, and programs can be lo-cated with
    little difficulty.


    # 2.4.5 Device-Independent Input and Output Operations


    Input and output operations are device-independent because UNIX treats all de-vices
    (as printers, terminals, and disks) as files. With UNIX, you can red-irect your
    commands to any device or file. This redirection process is also possible with
    input data. You can redirect the input that comes from your terminal to come from
    a disk indent.


    # 2.4.6 User Interface: Shell


    The UNIX user interface was designed primarily for users with programming backgrounds.
    Experienced programmers find UNIX simple, concise, and ele-gent. Beginners, on
    the other hand, find it not very friendly, and sometimes difficult to learn; it
    provides no feedback, warning, or hand-holding. For exam-ple, the command rm *
    deletes all files silently and with no warning.


    The user''s interaction with UNIX is controlled by a program called the shell,
    which is a powerful command interpreter. The shell is the face of UNIX and the
    part with which most of users interact. However, the shell is only one part of
    the operating system and one way of interacting with UNIX. The shell is not really
    part of the operating system, so it can be changed. A user might choose a technical
    shell (command-driven user interface), or prefer selecting commands from a menu
    (menu-driven user interface) or pointing at pictures (icons) in what is graphical
    user interface (GUI). A user can write his or her own user interface.


    The Shell, a complex and sophisticated user interface, provides plenty of innovative
    and exciting features. You can create new functions by combining the exiting commands.
    For example, the command date | lp combines the commands date and ip to print
    the current date on the line printer.


    Many data processing applications are run frequently—at daily, weekly, or regular
    intervals. In other situations, a set of commands must be entered many times.
    Typing the same set of commands again and again is-'
