- img_proc: true
  md: '# Program Development


    guage to low-level machine language is the job done by the software programs called
    compilers and interpreters. High-level programming languages are simply a programmer''s
    convenience; they cannot be executed in their original form (source code). This
    section describes a few of the major programming languages.


    COBOL (Common Business Oriented Language) programming language was introduced
    in 1959. Developed in response to business requirements, it was used mostly on
    the mainframe computers providing data processing services to large companies.
    More efficient and faster general-purpose programming languages exist in the market,
    but COBOL is going to remain with us because we use half of all business programs
    are written in COBOL.


    FORTRAN (Formula TRANslator) programming language was developed in 1955. It is
    most suitable for scientific or engineering programming, and remains the most
    popular scientific language. Of course, FORTRAN has been modified to meet the
    demands of new computers. The current version of FORTRAN is FORTRAN77, which is
    a general-purpose language capable of dealing with numeric and symbolic problems.
    With COBOL, a large body of existing code was written in FORTRAN, and it is still
    used in engineering and science.


    Pascal Pascal programming language was developed in 1968 and is named after the
    seventeenth-century French mathematician Blaise Pascal. The idea of good style
    and habits in programming was around and the buzz created structured programming
    when Pascal was created, with incorporated programming ideas. Pascal was designed
    as a language to help students learn structured programming and develop good habits
    in programming. However, the use of Pascal is not limited to educational institutions;
    it is used to create readable and maintainable codes.


    BASIC The BASIC (Beginners All-purpose Symbolic Instruction Code) programming
    language was developed in 1964 to help students with no computer background learn
    about computers and programming. It is accepted as the most effective programming
    language for instrumental purposes. Then, BASIC has evolved into a general-purpose
    language, and its use is not limited to the education field. BASIC is widely implemented
    and is used in business applications.


    C C language was developed in 1972, and it is based on principles practiced in
    Pascal programming. It was mainly for targeted system programming, creating operating
    systems, compilers, and so on. Most of the UNIX operating system is written in
    C. C is also a portable language; it is relatively machine-independent. A program
    written for one type of computer can be run on another with little or no modification.
    C is by far the language choice for many programmers developing for business,
    scientific, and other applications.


    C++ In the 1980s, C++ was developed to add to C languages needed to make an object-oriented
    language. Object-oriented programming (OOP) is a relatively new technique in programming.
    It reduces the development time.'
