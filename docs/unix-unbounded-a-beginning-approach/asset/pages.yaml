  md: '# 8.4 MORE UNIX UTILITIES


    The utilities give you more flexibility and control in day-to-day usage of the
    system. Also, some of the utilities are used in script file (program) examples
    in chapter 11 and 12.


    # 8.4.1 Timing a Delay: The sleep Command


    The sleep command causes the process executing it to go to sleep for a specified
    number of seconds. You can use sleep to delay the execution of a command for a
    period of time. For example, if you type sleep 120 ; echo "I am awake!" and press
    [Return], the sleep command is executed, causes two minutes delay, and then (after
    two minutes) the echo command is executed, and the string argument I am awake!
    is displayed on the screen.


    # 8.4.2 Displaying the PID: The ps Command


    You can use the ps (process status) command to obtain the status of the active
    processes in the system. When without any options, it displays information about
    your active processes. This information is arranged in four columns (see figure
    8–4) with the following column headings:


    +   - PID: the process ID number

    - TTY: your terminal number that controls the process

    - TIME: time duration (seconds) that your process is running

    - COMMAND: the name of the command


    # ps Options


    Only two of the ps options are discussed in this book—the a option and the -f
    option—and they are summarized in table 8–2.


    - a Option The a-option displays status information for all active processes.
    Without this option, only the user''s active processes are displayed.


    # Figure 8–4


    The ps command output format.


    | ps PID | TTY | TIME | COMMAND |

    |---|---|---|--|

    | 24059 | tty11 | 0:05 | sh |

    | 24259 | tty11 | 0:02 | ps |'
