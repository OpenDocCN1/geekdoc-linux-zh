- img_proc: true
  md: '# The vi Editor


    vi is a screen editor you can use to create files, vi has two modes; the command
    mode, and the text input mode. To start vi type vi, press [Spacebar], and type
    the name of the file. There are several keys that place vi in the text input mode,
    and [Esc] returns vi to the command mode.


    | Key | Operation |

    |---|---|

    | [w][q] | Writes (saves) the contents of the buffer and quits the vi editor.
    |

    | [w] | Writes (saves) the contents of the buffer but stays in the editor. |


    # Save and Quit commands


    With the exception of the ZZ command, the rest of these commands start with [:],
    and you must end the command line with [Return].


    | Key | Operation |

    |---|---|

    | [w][q] | Writes (saves) the contents of the buffer and quits the vi editor.
    |

    | [w] | Writes (saves) the contents of the buffer but stays in the editor. |

    | [q] | Quits the editor. |

    | [q!] | Quits the editor and abandons the contents of the buffer. |

    | [Z][Z] | Writes (saves) the contents of the buffer and quits the vi editor.
    |


    # Change Mode Keys


    These keys change vi''s mode from the command mode to the text input mode. Each
    key places vi in the text input mode in a different manner. Pressing [Esc] places
    vi in the command mode.


    | Key | Operation |

    |---|---|

    | [i] | Places the text you enter before the character that the cursor is on.
    |

    | [I] | Places the text you enter at the beginning of the current line. |

    | [a] | Places the text you enter after the character that the cursor is on. |

    | [A] | Places the text you enter after the last character of the current line.
    |

    | [o] | Opens a blank line below the current line and places the cursor at the
    beginning of the new line. |

    | [O] | Opens a blank line above the current line and places the cursor at the
    beginning of the new line. |'
  merge: -1
  pgno: 457
- img_proc: true
  md: '# Cursor Movement Keys


    These keys are all applicable in the command mode only.


    | Key | Operation |

    |---|---|

    | [h] or [left arrow ] | Moves the cursor position one space to the left. |

    | [j] or [down arrow ] | Moves the cursor position one line down. |

    | [k] or [up arrow ] | Moves the cursor position one line up. |

    | [l] or [right arrow] | Moves the cursor position one space to the right. |

    | [S] | Moves the cursor position to the end of the current line. |

    | [w] | Moves the cursor position forward one word. |

    | [b] | Moves the cursor position back one word. |

    | [e] | Moves the cursor position to the end of the word. |

    | [0] (zero) | Moves the cursor position to the beginning of the current line.
    |

    | [Return] | Moves the cursor position to the beginning of the next line. |

    | [Spacebar] | Moves the cursor position one space to the right. |

    | [Back Space] | Moves the cursor position one space to the left. |


    Search Commands

    These keys allow you to search forward or backward in your file for a pattern.

    | Key | Operation |

    |---|---|

    | [/ | Searches forward for a specified pattern. |

    | [?] | Searches backward for a specified pattern. |'
  merge: -1
  pgno: 458
- img_proc: true
  md: '# Cut and Paste Keys


    These keys are used to rearrange text in your file.These keys are applicable in
    vi''s command mode.


    | Key | Operation |

    | --- | --- |

    | [d] | Deletes a specified portion of the text and stores it in a temporary buffer.
    This buffer can be accessed by using the put operator. |

    | [y] | Copies a specified portion of the text in a temporary buffer. This buffer
    can be accessed by using the put command. |

    | [p] | Places the contents of a specified buffer above the cursor position. |

    | [P] | Places the contents of a specified buffer after the cursor position. |


    # Scope Keys


    Using the commands in combination with the scope keys gives you more control in
    your editing task.


    | Key | Operation |

    | --- | --- |

    | [S] | The scope is from the cursor position to the end of the current line.
    |

    | 0 (zero) | The scope is from just before the cursor position to the beginning
    of the current line. |

    | [e] | The scope is from the cursor position to the end of the current word.
    |

    | [b] | The scope is from the letter before the cursor backward to the beginning
    of the current word. |


    # Keys for Correcting Text


    These keys are all applicable in the command mode only.


    | Key | Operation |

    | --- | --- |

    | [x] | Deletes the character specified by the cursor position. |

    | [d][d] | Deletes the line specified by the cursor position. |

    | [u] | Undoes the most recent change. |

    | [U] | Undoes all the changes on the current line. |

    | [r] | Replaces a character that the cursor is on. |

    | [R] | Replaces characters starting from the cursor position. Also enters in
    the text mode. |

    | [.] (dot) | Repeats the last text changes. |'
  merge: -1
  pgno: 459
- img_proc: true
  md: '# Paging Keys


    The paging keys are used to scroll a larger portion of your file.


    | Key | Operation |

    | --- | --- |

    | [Ctrl-d] | Scrolls the cursor down toward the end of the file, usually 12 lines
    at a time. |

    | [Ctrl-u] | Scrolls the cursor up toward the beginning of the file, usually 12
    lines at a time. |

    | [Ctrl-f] | Scrolls the cursor down (forward) toward the end of the file, usually
    24 lines at a time. |

    | [Ctrl-b] | Scrolls the cursor up (backward) toward the beginning of the file,
    usually 24 lines at a time. |


    # Setting the vi Environment


    You can customize the behavior of the vi editor by setting the vi environment
    options. You use the set command to change the option values.


    | Option | Abbreviation | Operation |

    | --- | --- | --- |

    | autoindent | ai | Aligns the new lines with the beginning of the previous ones.
    |

    | ignorecase | ic | Ignores the differentiation between uppercase and lowercase
    letters in search operations. |

    | magic | - | Allows the use of the special characters in a search. |

    | number | nu | Displays the line number. |

    | report | - | Informs you of the number of lines affected by your last command.
    |

    | scroll | - | Sets the number of lines to scroll when [Ctrl-d] command is given.
    |

    | shiftwidth | sw | Sets the number of spaces to indent. Used with the autoindent
    option. |

    | showmode | smd | Displays the vi editor modes in the right corner of the screen.
    |

    | terse | - | Shortens the error messages. |

    | wrapmargin | wm | Sets the right margin to a specified number of characters.'
  merge: -1
  pgno: 460
