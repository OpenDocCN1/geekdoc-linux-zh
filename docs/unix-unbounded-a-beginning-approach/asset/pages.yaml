  md: '# Appendix D


    # Summary of vi Editor Commands


    This appendix contains a summary of all the vi editor commands covered in this
    book. For more information refer to chapters 4 and 6.


    The vi editor mode of operations.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_456_0.png)'
  merge: -1
