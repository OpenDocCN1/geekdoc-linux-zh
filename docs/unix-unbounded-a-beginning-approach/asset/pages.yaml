  md: 'Chapter 4


    The vi Editor: First Look


    55


    # 4.2.1


    # The vi Modes of Operation


    The vi editor has two basic modes of operation: command (edit) mode and text input
    mode. Some commands are applicable only to the command mode, and others work only
    in the text input mode. During a vi editing session you change from one mode of
    vi to the other to doing the editing job.


    **Command Mode** When you start the vi editor, it comes up in the command mode.
    In command mode, key entries (any key or sequence of keys you press) are interpreted
    as commands. The keys are not echoed on the screen, but the commands associated
    with the pressed key or keys are carried out. While the vi editor is in the command
    mode, you can delete lines, search for a word, move the cursor on the screen,
    and perform a number of other useful functions by pressing a key or sequence of
    keys.


    Certain commands in the command mode start with the colon [:], forward slash [/],
    question mark [?]. The vi displays these commands on the last line on the screen.
    To signal the end of the command line for these types of commands, you press [Return].


    **Input Mode** In the input mode, the keyboard becomes your typewriter. vi displays
    any key or sequence of the keys that you press, and input is interpreted not as
    commands but as text that you want to write into your file.


    **Status Line** The bottom line on the screen, usually line 24, is used by vi
    to give you some feedback about your editing operation. Error messages and other
    informative messages are displayed on the status line. vi also displays the commands
    that start with :, j, or ? on line 24.


    # 4.3


    # BASIC vi EDITOR COMMANDS


    The basic editing job usually involves the following operations:


    +   - Creating a new file or modifying an existing file (open file operation)

    - Entering text

    - Deleting text

    - Searching text

    - Changing text

    - Saving the file and quitting the editing session (close file operation)


    The following sections walk you through a few editing sessions, explore the editor''s
    way of working, and show you some of the necessary editing commands in both text
    input mode and command mode.


    > Relying solely on the textbook to learn the vi editor (or any other editor)
    is not a good idea. It is highly recommended that, after an initial reading of
    this chapter, you practice the examples and terminal session exercises on your
    system.'
