  md: '# PS2


    The Prompt String 2 (PS2) variable is set to the prompt sign that is displayed
    whenever you press [Return] before completion of the command line and the shell
    exhausts the rest of the command. You can change the PS2 variable same way you
    change the PS1 variable. The Bourne shell secondary prompt defaults to the greater
    than sign (>).


    The following command sequences shows examples of the second prompt.


    +   $ echo "Good news, UNIX [Return]"

