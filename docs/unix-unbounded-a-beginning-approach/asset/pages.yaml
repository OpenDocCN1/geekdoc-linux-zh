  md: '# 10.1 Program Development


    Chapter 1 discussed software and computer programming in general. You learned
    the important role of software in making computers all these wonderful things
    (open to discussion!). You also learned that there are two categories of software:
    application software and system software.


    A program consists of a set of instructions that guide the computer in performing
    its basic arithmetic and logical operations. Each instruction tells the machine
    to perform one of its basic functions, and usually consists of the operation code
    and one or more operands. The operation code specifies the function to be performed,
    and the operands specify the location or data elements to be manipulated. Figure
    10-1 shows a typical instruction.


    A computer is controlled by programs that are stored in the computer''s memory.
    Memory storage is capable of storing only zeros and ones, so programs in memory
    must be in binary form. This means programs must be written in zeros and ones
    or converted to zeros and ones. Do programmers write programs in zeros and ones?
    Fortunately, they don''t have to. Early programmers had no choice; they had to
    code programs in zeros and ones, for which they deserve a lot of respect. Programmers
    write programs to create both categories of software. To write a program you need
    a programming language, and there are a few you can choose from.


    # 10.2 Program Languages


    Programming is the process of writing instructions (a program) for a computer
    to solve a problem. These instructions must be written in a computer programming
    language. A program can be anything from a simple list of instructions that adds
    a series of numbers together, to a large and complex structure with many sections
    that calculates the payroll of a big corporation.


    Like computer hardware, programming languages have evolved in generations. Each
    new generation of languages improved on the previous ones and incorporated more
    capabilities for programmers.


    Figure 10–2 shows the hierarchy and generations of the programming languages.
    Let''s briefly explore the different levels of this hierarchy.


    Figure 10–1

    The format of a simple instruction.


    | operation code | operands |

    |---|---|

    | MUL | 1000,2000 |


    See page xxii for an explanation of the icons used to highlight information in
    this chapter.'
