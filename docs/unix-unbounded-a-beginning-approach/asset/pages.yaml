  md: '# 10.3 Programming Mechanics


    To write a program, you have to choose a computer programming language. The choice
    of programming language depends on the nature of the application. Many general-purpose
    and specialized programming languages exist that fit any requirement. The exact
    steps you must follow to produce a program depend on the computer environment.


    # 10.3.1 Steps to Creating an Executable Program


    Regardless of the computer system and the programming language you use, the following
    steps are necessary to create an executable program.


    +   1. Creating the source file (source code)

    2. Creating the object file (object code/object module)

    3. Creating the executable file (executable code/load module)


    **Source Code** You usually use an editor (such as the vi) to write a program
    and save what you write in it. This file is the *source code*. The source code
    is written in the programming language of your choice. By itself, your computer
    does not understand it. The goal is to convert the source code file to an executable
    file.


    A source file is a text file, which is also called an *ASCII file*. You can display
    it on the screen, modify it using one of the available editors, or send it to
    the printer to obtain a hard copy of your program''s source code.


    **Object Code** Source code is incomprehensible to the computer. Remember, computers
    understand only machine language (the pattern of zeros and ones). Thus your source
    code must be translated to machine-understandable language. This is the job of
    a compiler or an interpreter. They produce the object code. The object code is
    the machine language translation of your source code. However, it is not an executable
    file; it lacks some necessary parts. These necessary parts are programs that provide
    the interface between the program and the operating system. They are generally
    grouped together in files library files.


    You cannot send an object file to the printer. It is a file of zeros and ones.
    If you display it, you may lock your keyboard or hear beeps as the zeros and ones
    are translated into the ASCII codes that represent codes for locking the keyboard,
    the beep at your terminal, stop, and so on.


    **Executable Code** Your object code might refer to other programs that are not
    part of your object module. Before your program can be executed, these references
    to other programs must be resolved. This is the job of the linker or link editor.
    It creates the executable code, the load module. The load module is a complete,
    ready-to-be-executed program with all its parts put together.


    The load module, like the object file, is not a file to be sent to the printer
    or played on your terminal.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Chapter 10 Program Development 283


    In some systems, you invoke the compiler, and after the compilation process is
    completed, invoke the linker to create the executable file. Other systems have
    the compiler start the linker automatically. On those systems, you just give the
    compiler command, and if your program does not have any compilation error, the
    linker is invoked to link your program.


    Exactly how this works varies among systems, depending on the system environment/configuration
    set up by the system administrator.


    This process, starting from a source file and ending up creating an executable
    file, is depicted in figure 10–3.


    # 10.3.2 Compilers/Interpreters


    The main function of a compiler or an interpreter is to translate your source
    code (program instructions) to machine code so the computer can understand your
    instructions. The compiled languages and interpreted languages represent two different
    categories of computer languages. Each has its advantages and disadvantages.


    Compiler The compiler is a system program that translates high-level program instructions,
    such as a Pascal program, into machine language that the computer can interpret
    and execute. It compiles the entire program at one time and does not give you
    any feedback until it compiles the entire program.


    A separate compiler is required for each programming language you intend to use
    on your computer system. To execute C and Pascal programs, you must have a C compiler
    and a Pascal compiler. Compilers produce a better and more efficient object code
    than interpreters, so a compiled program runs faster and needs less space.


    # Figure 10–3

    Program development steps.


