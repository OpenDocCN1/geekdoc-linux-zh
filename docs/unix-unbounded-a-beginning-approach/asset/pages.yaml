  md: '# 1.3.2


    # Processor Unit


    The processor unit is the intelligent part of the computer system. It is called
    the central processing unit, or CPU, and it directs computer activities. The CPU
    controls the performance of tasks such as sending keyboard data to the main memory,
    manipulating stored data, or sending the results of an operation to the printer.
    The CPU consists of three basic sections:


    +   * Arithmetic and Logic Unit (ALU)

    * Registers

    * Control Unit (CU)


    The CPU is also called the brain, heart, or thinking part of the computer.


    Arithmetic and Logic Unit The arithmetic and logic unit, or ALU, is a section
    of the CPU''s electronic circuitry that controls all arithmetic and logic operations.
    Arithmetic operations include addition, subtraction, multiplication, and division.
    More advanced computational functions such as exponentiation and logarithms can
    be implemented. The logic operations include comparisons of letters, numbers,
    or special characters to recognize whether they are equal to, greater than, or
    less than one another.


    To summarize, the ALU is responsible for the following:


    +   * Performing arithmetic operations

    * Performing logical operations


    Registers A small set of storage cells is generally located within the CPU. These
    storage cells are called registers. A register can typically hold a single instruction
    or data item. Registers are used to store data and instructions that are needed
    immediately, quickly, and frequently. For example, if two numbers are about to
    be added, each is kept in a register. The ALU reads these and stores the result
    of the addition in another register. Because registers are located within the
    CPU, their contents can be accessed quickly by other CPU components.


    To summarize, registers are used for the following:


    +   * Storing instructions and data within the CPU


    Control Unit The control unit is a section of the CPU''s electronic circuitry
    that directs and coordinates the other parts of the system to carry out program
    instructions. It does not execute the instructions themselves; it sends electronic
    signals to the appropriate circuitry to activate other parts. It is primarily
    responsible for the movement of data and instructions from the main memory and
    for controlling the ALU. As program instructions and data are needed by the CPU,
    they are moved from primary storage to registers by the control unit.


    To summarize, the control unit is responsible for the following:


    +   * Activating the other components

    * Transferring instructions and data from the main memory to the registers'
  merge: -1
