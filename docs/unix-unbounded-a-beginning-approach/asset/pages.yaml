    # Operating System as Resource Manager


    The operating system is in control of computer resources: main memory, CPU time,
    and peripheral devices. In a typical computer system, several jobs are executing
    concurrently. All are competing for the available resources, and the operating
    system allocates resources to programs to the availability of the resources and
    priority of the running programs. It allocates the CPU time. After all, there
    is only one CPU and many users, and only one user at a time can have the CPU''s
    attention.


    The operating system monitors and allocates the main memory between programs,
    which have different sizes and memory requirements, preventing your program from
    being mixed with someone else''s program that happens to be in the main memory.
    It coordinates use of the peripheral devices, including things such as whose turn
    it is to read from the disk or write to it, and what job goes to the printer.


    The operating system continually responds to the program''s resource requirements,
    resolves resource conflicts, and optimizes the allocation of resources.


    # Operating System as User Interface


    The operating system provides the means for users to communicate with the computer.
    Every operating system provides a set of commands for directing the operation
    of the computer, a command-driven interface. Command syntax is difficult to learn,
    remember, and use. One alternative is the menu-driven interface, which provides
    a set of menus and lets users choose functions from the menus. Another popular
    alternative is the icon-driven, graphically based user interface, called graphic
    user interface (GUI). You can execute most of the operating system commands by
    manipulating graphical images on the video screen. For example, the graphical
    image (icon) of a folder may represent files, or a picture of a typewriter represent
    a word processing program. This visual metaphor for commands and functions provides
    an easy-to-learn interface. With a GUI, users can choose an icon, usually with
    a pointing device such as a mouse, to activate programs.'
