    # 6.5 THE CURSOR POSITIONING KEYS


    The screen displays 24 lines of text at a time, and if your file contains more
    than 24 lines, use the cursor movement keys to scroll a new line up or down into
    view. If your file contains one thousand lines of text, you need about 999 strokes
    to bring 999 into view on the screen. This is cumbersome and not practical. To
    overcome this problem, use the vi editor''s paging operators. Table 6–3 summarizes
    the paging operators and their capabilities.


    Table 6–3

    The vi''s paging keys.


    | Key | Operation |

    | [Ctrl-d] | Scrolls the cursor down toward the end of your file, usually 12 lines
    at a time. |

    | [Ctrl-u] | Scrolls the cursor up toward the beginning of your file, usually
    12 lines at a time. |

    | [Ctrl-f] | Scrolls the cursor down (forward) toward the end of your file, usually
