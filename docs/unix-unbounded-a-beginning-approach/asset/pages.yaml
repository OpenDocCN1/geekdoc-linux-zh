  md: '# 1.3.3


    # Internal Memory


    A computer is a two-state machine. These two states can be interpreted as 0 or
    1, yes or no, up or down, and so on. Almost any device can store either of two
    states can serve as storage. However, most computers use integrated circuit memory,
    which holds binary digits or bits. Each bit can be either 0 or 1, representing
    one state of bits; a small computer might have enough memory to store millions
    of bits; a larger one might store billions. The difference is one of degree, not
    of memory functionality.


    The internal memory (also called main or primary memory) is storage for the following:


    +   - Holding current program instructions

    - Holding data to be processed by a program

    -Holding intermediate results created by executing program instructions


    Main memory is short-term and retains data only for the period that a program
    is running.


    The main memory storage consists of storage cells that hold programs that are
    currently being executed and their associated data. The execution of programs
    requires a great deal of data movement between the main memory and the CPU.


    The CPU is a fast device; thus it is desirable to implement main memory using
    devices capable of fast access. In the current computer hardware, main memory
    is implemented with silicon-based semiconductor devices called memory chips. Computers
    generally have two types of memory:


    +   - Random access memory (RAM)

    - Read only memory (ROM)


    Random Access Memory Random access memory (RAM) is the memory of the computer.
    It provides the access speed the CPU requires and allows the CPU to read and write
    a specific memory location referring to its address. While the computer is off,
    programs and data are stored temporarily in RAM. Data stored in RAM can be changed,
    modified, and erased.


    RAM is a volatile memory and does not provide permanent storage. When you turn
    off the computer (or turn off power to RAM by any other means), its contents are
    lost.


    Read Only Memory The second type of the memory, read only memory (ROM), contains
    the permanently stored programs and data that manufacture place in the system.
    The CPU can only read instructions from ROM; it can not alter, erase, or write
    over them. When you turn the computer off, none of the information stored in ROM
    is lost. Programs in ROM are sometimes called firmware, something between hardware
    and software.'
