  md: 'The Formatter The UNIX editors are not text formatting programs. They do not
    provide functions like centering a line or setting up margins, things that are
    readily available with any word processing program. To format text, UNIX supports
    utilities like sort and tr.


    Text formatters are usually used to prepare documents. Input to these programs
    are files that you create using editors like the vi. Output from text formatters
    is paginated, and you can display the formatted text on the screen or send it
    to the printer. Table 4–1 shows some of the UNIX operating system editors and
    their categories.


    # 4.2 THE vi EDITOR


    The vi editor is a screen-oriented text editor available on most UNIX operating
    systems, and it provides some of the flexibility and ease of a word processing
    program. Because vi is based on the line editor, it is possible to use commands
    from within vi. When you use vi, changes to your file are reflected on the terminal
    screen, and the position of the cursor on the screen indicates the position within
    your file. Do not panic. Only a few of the commands are necessary to do a simple
    editing task.


    Two versions of vi, the vi editor and the editor vi, are tailored for specific
    tasks or options. These versions are the same as the vi editor except that certain
    flags (options) are preset. Not every system has these versions on it. By the
    end of the two chapters in this book you will have learned to customize the vi
    environment to your own needs.


    The vi editor The vi editor is the version of the editor with the readonly flag
    set it. The vi editor is useful when you want to look only at the contents of
    your file and not modify it. The vi editor prevents you from inadvertently changing
    your file, and so your file remains intact.


    The editor vi The editor vi is a version of the vi editor with several flags set.
    The editor vi is intended for beginners. Its flag settings make it easier to learn
    how to use vi.


    Table 4–1

    Some of the editors supported by UNIX.


    | Editor | Category |

    | ed | The original line editor |

    | ex | A more sophisticated superset of the ed editor |

    | vi | A visual screen editor |

    | emacs | A public-domain screen editor |'
  merge: -1
