  md: '# 8.3.5 Chaining the Commands: Using the Pipe Operator


    The shell lets you use the standard output of one process as standard input to
    another process. You use the pipe metacharacter, |], between the commands. The
    general format is as follows:


    ```

    command | command B

    ```


    where command A output is introduced as input to command B. You can chain a sequence
    of commands together, creating what is called a pipeline. Let''s look at some
    examples that give you an appreciation of this very useful and flexible shell
    capability.


    Type ls -llp and press [Return] to send the output of the ls-l command to the
    printer.


    To count the number of files in your current directory, do the following:


    +   $ ls -C [Return] .................... Let''s see the files in your current
    directory.

    memos myfirst REPORT

    $ ls -C > count [Return] . . Now save the list of files in your count.

    $ wc -w count [Return] . . Count the number of words. You have 3 files in your
    current directory.


    +   3

    ls -C wc -wc [Return] . . . Use the pipe operator to obtain the number of files
    in your current directory.


    The output of the command ls -C (list of the files in your current directory)
    is passed as input to the wc -w command.


    To save the number of users logged in a system, do the following:


    +   $ echo "Number of the logged in users:" "who | wc -l" > outfile [Return]

    $ cat outfile [Return] . . . . Check what is stored in outfile.

    Number of the logged in users: 20


    In the previous command, shell scans the command line, finds the back quotation
    marks, executes the who | wc-l commands, and passes the output of the who to the
    wc as input data. If there are 20 users logged on the system, then the output
    is 20. The shell replaces the ''who -l'' with 20. Then the shell executes the
    echo command that reads Number of the logged in users: 20 and stores the output
    in outfile.


