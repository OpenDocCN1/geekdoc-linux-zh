  md: 'If no password has been assigned to your account, UNIX does not display the
    password: prompt, and the logging in process ends.


    **Password** Like the User Id, a password is supplied by the system administrator.
    A password is a sequence of letters and digits used by UNIX to verify that the
    user is allowed to use the User Id.


