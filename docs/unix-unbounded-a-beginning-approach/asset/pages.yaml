  md: '# Chapter 5


    # Introduction to the UNIX File System


    # 107


    -r Option The -r option deletes every file and subdirectory in a directory. You
    can delete an entire directory structure using `rm` with the `-r` option. Commands
    like this are what make UNIX an operating system for grownups!


    Let''s look at a command sequence using the -r option. Figure 5–15 shows your
    directory structure afterward. In this example the asterisk (*) is a metacharacter
    and means "all files". The metacharacters are explained in chapter 7.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_128_0.png)


    ```

    $ cd [Return] Change to home directory.

    $ rm -r * [Return] Remove all there is under david (home) directory.

    $ ls [Return] List files in david.

    $ _ Sorry, nothing under david; the files are all deleted.

    ```


    +   1. Use the -i option to get the confirmation prompt.

    2. Use the -r option sparingly, and only when it is absolutely necessary.

    3. Use rmdir to remove directories.


    # 5.7.1


    # Before Removing Files


    Under UNIX, deleting files and removing directories is quite easy. However, unlike
    other operating systems, UNIX does not give you any feedback or warning messages.
    Before you know it, the files are deleted, and the remove command is irreversible.
    Thus before typing `rm`, consider the following points:


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_128_1.png)


    +   1. Make sure it is not 2 o''clock in the morning when you start a major delete
    operation.

    2. Make sure you know which file you want to delete, and what the content of that
    file is.

    3. Think twice before pressing [Return] to complete the command.


    Figure 5–15

    The directory structure after the entire directory structure is removed.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_128_2.png)'
