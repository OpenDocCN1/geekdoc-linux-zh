- img_proc: true
  md: '# 6.4.1


    # The Numbered Buffers


    The vi editor uses nine temporary buffers from 1 to 9. Each time you delete or
    yank text, it is placed in these temporary buffers, and you can access any of
    the buffers by specifying the buffer number. Each new deletion or yanking of the
    text replaces the previous contents of these buffers. For example, when you give
    the [d][d] command, vi stores the deleted line in buffer 1. When you use [d][d]
    again, to delete another line, vi bumps the old contents up one buffer, in this
    case to buffer 2, and then stores the new material in buffer 1. This means that
    buffer 1 always holds the most recently changed material. The contents of the
    numbered buffers change each time you issue a delete or yank command. After a
    few changes, of course, you lose track of what is stored in any of the numbered
    buffers. Keep on reading; the best is yet to come!


    The contents of the numbered buffers can be recovered by using the operator, prefixed
    with the buffer number. For example, to recover the material from buffer 9, you
    type "9p". The command "9p" copies the contents of buffer 9 to where the cursor
    is. The format for specifying the buffer number can be presented as:


    +   double quotation mark + n (where n is the buffer number from 1 to 9) + ([p]
    or [P])


    The temporary numbered buffers are depicted in figures 6–1 through 6–5. The examples
    explain the vi editor''s sequence of events when you change text in the file.


    Assume that your screen looks like in figure 6–1, with five lines of text and
    the numbered buffers empty, since you have not done any editing operation.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_146_0.png)


    +   Position the cursor on the first line and use the delete command to delete
    the current line. The vi editor saves the deleted line in buffer 1, and the screen
    and buffers look like figure 6–2.


    # Figure 6–1


    The vi editor uses nine numbered buffers.


    | | 1 |

    |---||

    | AAAAAAAA | |

    | 2222222222222 | 2 |

    | BBBBBBBBBBBB | |

    | 3333333333333 | 3 |

    | CGGGGGGGGGGG |

    | | 9 |'
