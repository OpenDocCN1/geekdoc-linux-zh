    # 8.6.7 Login and Startup: The Korn Shell Style


    Like the standard shell (sh), the Korn shell (ksh) reads the .profile file in
    your home directory where you log in. It executes the commands you want to run
    at login time, initializes the variables that will be in effect for your login
    session. The .profile file typically includes commands such as date, who, and
    calendar provide information for login, terminal settings, and variables that
    you want to export to the environment.


    In addition to the .profile file (in your home directory), ksh also reads your
    environment file. The environment file does not have a predefined name or location
    that ksh looks for. You define its name and location with the ENV variable in
    your .profile file. For example, if your .profile file contains the line,


    ```

    ENV=$HOME/mine/my_env

    ```'
