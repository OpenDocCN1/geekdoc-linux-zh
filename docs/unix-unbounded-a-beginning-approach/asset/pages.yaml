- img_proc: true
  md: "# Chapter 11 Shell Programming 331\n\n```\nwhile [ condition ]\ndo\n  commands\n\
    ...\nlast command\ndone\n```\n\nThe commands in the body of the loop (between\
    \ do and done) are repeatedly executed as the loop condition is true (zero). The\
    \ loop condition must eventually return to false (non-zero); otherwise, your loop\
    \ is an infinite loop and goes on forever. That is one of those times that you\
    \ must know the kill key on your system you can terminate the process.\n\n![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_352_0.png)\n\
    \nThe following command sequence shows how the while loop works.\n\n```\n$ carry_on=Y\
    \ [Return] ... Initial the carry_on variable.\n$ while [carry_on = Y] [Return]\
    \ ... Set up the while loop.\n> echo \"I do the job as long as type Y: _b\" [Return]\n\
    > read carry_on [Return] ............................ Read input.\n> done [Return]\
    \ ............................ Waiting for input.\nI do the job as long as type\
    \ Y_ ................... Waiting for input.\nY [Return] .......................................\
    \ Press [Y] and [Return].\nI do the job as long as type Y_ ...................\
    \ Waiting for input.\nN [Return] ....................................... Press\
    \ [N] and [Return].\n$_ ................................................ The shell\
    \ prompt appears.\n```\n\n![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_352_1.png)\n\
    \n> In the above example, as long as you press [Y], the loop condition is true\
    \ and the body of the loop, the echo and read commands, is repeated. You stop\
    \ the next program by pressing any character [Y].\n\nFigure 11–20 show the source\
    \ code for the script file called COUNTER. The COUNTER program is another example\
    \ of the while loop construct that displays the numbers from 0 to 9. The expr\
    \ command is used to calculate the next number to be displayed. The cat command\
    \ is used to display the source code.\n\nNotice the command expr Scount + 1 is\
    \ enclosed with a pair of single back quotations ('and'). When you run the program,\
    \ the output of this command is stored in the count variable.\n\n![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_352_2.png)\n\
    \nRunning the COUNTER program.\n\n```\n$ COUNTER (Return) ............................\
    \ Execute the COUNTER program.\n1\n2\n3\n```"
  merge: -1
  pgno: 352
