    # 6.2 REARRANGING TEXT


    Deleting, copying, moving, and changing text are collectively referred to as cut-and-paste
    operations. Table 6-1 summarizes the operators that are used in combination to
    cut-and-paste operations in a file. All of the commands are applicable when vi
    is in the command mode. With the exception of the change command, the vi editor
    remains in the command mode after completion of the command. The change command
    places the vi editor in insert mode, which means that you must press [Esc] to
    return to the command mode.


    Assuming that you have myfirst file on the screen and the cursor on m, the following
    examples show the cut-and-paste applications.


    # 6.2.1 Moving Lines: [d][d] and [p] or [P]


    Using the delete and the put keys, you can move text from one part of a file to
    another.


    Table 6–1 vi editor cut and paste keys.

    | Key | Operation |

    | [d] | Deletes a specified portion of the text and stores it in a temporary buffer.
    This buffer can be accessed by using the put operator. |

    | [y] | Copies a specified portion of the text into a temporary buffer. This buffer
    can be accessed by using the put command. |

    | [P] | Places the contents of a specified buffer above the cursor position. |

    | [p] | Places the contents of a specified buffer below the cursor position. |

    | [c] | Deletes text and places vi in the text input mode. This is a combination
    of delete and insert operators. |'
