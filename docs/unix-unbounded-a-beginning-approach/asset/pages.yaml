- img_proc: true
  md: '# 9.5.1 Shell Variables Used by mailx


    Some of the standard shell variables are used by mailx, and their values affect
    the mailx behavior. HOME (which defines your home directory) and MAILCHECK (which
    defines the frequency with which mailx checks your mail). For example, if you
    arrive of mail in your mailbox to be checked once a minute, then define MAILCHECK
    as follows:


    ```

    MAILCHECK=60

    ```


    MAILRC is another shell variable used by mailx. This variable defines the startup
    file that mailx checks each time you invoke it. If this variable is undefined,
    the default value of HOME/.mailrc is used. For example, you can define MAILRC
    in your .profile file (the startup file for your login shell) as follows:


    ```

    MAILRC=$HOME/e-mailrc

    ```


    THE, MAILCHECK, and MAILRC shell variables are used by mailx, but you cannot change
    them while in mailx.


    A large number of mailx variables can be manipulated to tailor the environment
    to your wishes. You can set these variables within mailx or set them in mailrc.
    You use the set command to set mailx variables and the unset command to reverse
    their setting. The format of the set command and the way you create and set up
    your .mailrc file are similar to those of .extrc (the editor startup file).


    These variables can be set in the startup file .mailrc or internally from mailx.


    append When you are terminating mail, if the append variable is set, then mailx
    appends messages to the end of the mbox instead of the beginning.


    You have two choices for the append setting:


    +   - Type set append and [Return] to add messages to the mbox.

    - Use unset append and [Return] to add messages to the beginning of the mbox.
    This is the default.


    asksub When asksub is set, mailx prompts you for the Subject: field. It is set
    by default.


    crt and PAGER The crt variable is set to the number of lines on your screen. Messages
    that have lines more than the set number are piped through the command defined
    by the PAGER variable.


    To set up mailx so that, if a message is longer than 15 lines, it is piped to
    the pg command and displayed one page at the time, do the following:'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Chapter 9 UNIX Communication 269


    +   - Type set PAGER=''pg'' and press [Return]. (This is the default value of
    the PAGER variable, unless your system administrator has changed it)

    - Type set crt=15 and press [Return] to set the number of lines to 15.


    You can use the pg command options to scan messages up and down (chap-7).


    DEAD Your partially composed messages that were interrupted (or messages that
    for some reason or another are undeliverable) are stored in the specified file-name.
    The default is as follows:


    ```

    set DEAD=$HOME/dead.letter

    ```


    To change the dead file specified by the DEAD variable, you could type DEAD=$HOME/e-mail/dead.mail
    and press [Return].


    EDITOR EDITOR variable sets the editor invoked when you use the edit (or -e) commands.
    The default is as follows:


    ```

    set EDITOR=ed

    ```


    To change the default EDITOR variable, you could type set EDITOR=ex and press
    [Return]. It is changed to an editor.


    escape The escape variable lets you change the mailx escape character. The default
    value is the tilde (~).


    To change the default escape variable character to @, you can type set escape=@
    and press [Return].


    folder folder variable makes a specified directory the standard directory for
    mailx. All mail files are saved in the directory specified by the folder vari-able.
    There is no default value for the folder variable.


    To specify the EMAIL file in the HOME directory for mail files, you type folder=$HOME/EMAIL
    and press [Return].


    This command does not create the EMAIL directory. It assigns the specified directory
    to the variable folder. You use the mkdir command to create the direc-ory.


    header If the header variable is set, as it is by default, mailx displays the
    header of messages when you are reading mail.


    To unset the header variable, type unset header and press [Return].


    The command is enclosed in a pair of back quotation marks.


