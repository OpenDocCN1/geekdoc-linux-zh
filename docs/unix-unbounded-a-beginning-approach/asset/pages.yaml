    # 12.2 UNIX INTERN: THE SIGNALS


    How do you terminate a process? You terminate a process by generating an interrupt
    signal. What is a signal? A signal is a report to your process about a specific
    condition. For example, [Del], [Break], and [Ctrl-c] are used to send an interrupt
    signal to a process to terminate it.

    Remember, your process thinks it is working with files and does not know about
    your terminal. How does an interrupt that you enter from the keyboard terminate
    your process? Your interrupt signals go to the UNIX kernel and sends a signal
    to your process and not your process. It is the kernel that knows about the devices,
    and it is notified when you press any of the interrupt keys. UNIX sends a signal
    to your process telling it that an interrupt has occurred. In response to this
    signal, your process terminates or takes some other action.

    There are several events that make the kernel send a signal to your process. These
    signals are numbered to specify the specific event they present. Table 12–1 summarizes
    some of these signals that are usually used in the script files. The numbers may
    be different in your system. Ask your system administrator, or look it up in your
    system reference manual.


    **The hang-up Signal** Signal 1 is used to tell the process that the system has
    lost the connection to its terminal. This signal is generated when the cord runs
    from your terminal to the computer is disconnected, or when the phone line (your
    modem connection) is lost. Also, on some systems the hang-up signal is generated
    when you turn off your terminal.


    Table 12–1nSome of the shell signals.


    | Signal Number | Name | Meaning |

    |---|---|--|

    | 1 | hang up | Terminal connection is lost. |

    | 2 | interrupt | One of the interrupt keys has been pressed. |

    | 3 | quit | One of the quit keys has been pressed. |

    | 9 | kill | The kill -9 command has been issued. |

    | 15 | terminator | The kill command has been issued. |'
