    # 8.2.4 Understanding the Standard Shell Variables


    The values assigned to the standard shell variables are usually set by the system
    administrator. Thus, when you log in, the shell refers to these variables to keep
    track of things in your environment. You can change the value of these variables.
    However, the changes are temporary and apply only to the current session. The
    next time you log in, you will have to set them again. If you want the changes
    to be permanent, place them in a file called .profile. The .profile file is explained
    in this chapter.


    # HOME


