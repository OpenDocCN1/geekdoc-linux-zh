  md: '# Chapter 13


    # Farewell to UNIX


    # 407


    decryption of a file, you must provide the same key that you specified to its
    en- crypt. Let''s look at some examples.


    Encrypt a file called names in your current directory.


    +   $ cat names [Return] . . . . Display the content of the names.

    David Emma Daniel Gabriel Susan Marie


    +   $ crypt xyz < names > names.crypt [Return] . Use xyz as the encryption key.

    $ rm names [Return] . . . . . . . . . . . Remove names.

    $ crypt xyz < names.crypt > names [Return] . Decode names.crypt.


    +   $ cat names [Return] . . . . . . . . Check the contents of names.

    David Emma Daniel Gabriel Susan Marie . . . . . . Back to the prompt.


    The xyz is the key used to encrypt the file. The key is actually a password that
    you use to unlock your file later.


    Using input/output redirection, the input to the command is names, and the output
    is stored in names.crypt.


    Usually, you remove the original copy of a file after file encryption and leave
    only the encrypted version, making the information in the file accessible only
    to someone who knows the encryption key.


    Encrypt the names file without specifying the encryption key on the command line.


    +   $ crypt < names > names.crypt [Return] . No encryption key is specified.

    Key . . . . . . . . . . . . . . . . . . . . . . . . . . . . The prompt for entering
    the key

    appears.

    $ . . . . . . . . . . . . . . . . . . . . . . . . . . . Back to the prompt.


    If you don''t specify the encryption key on the command line, then crypt prompts
    you to enter one. The key that you enter is not echoed, and this method is pre-ferred
    over typing the key on the command line.


    If you type the wrong code entering the password (key) the first time when you
    encrypt a file, you will not be able to decrypt the file later. As a safety check,
    you may want to try decrypting the encrypted file before you remove the original.


