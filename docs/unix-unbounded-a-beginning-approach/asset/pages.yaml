    \ then [Return] . . . . . . . . . . . . . . . . . . . . . Secondary prompt.\n\
    > echo \"READABLE\" [Return] . . . . . . . . . . . . Show message.\n> elif test\
    \ -w \"$FILE\" [Return] . . . . . . . . . . Check to see if myfile is writeable.\n\
    > then [Return] . . . . . . . . . . . . . . . . . . . . . . \n> echo \"WRITEABLE\"\
    \ [Return] . . . . . . . . . . . . Show message.\n> else [Return] . . . . . .\
