    Single Quotation Marks Single quotation marks [''''] work very much like the double
    quotation marks. Any special character between a pair of single quotation marks
    loses its special meaning, except the single quote mark. (You use \ to move its
    special meaning.)


    Single quotation marks also preserve the white-space characters. The string between
    the single quotation marks becomes a space argument, and the space character no
    longer has its special meaning as argument separator.


    The open and close quotation marks for this purpose are the same character, the
    forward quote. Do not use the back quotation mark (the grave accent character
    ['']). This distinction is very important. The shell interprets the string inside
    the back quotation marks as an executable command.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_221_0.png)


    Display special characters using a pair of single quotation marks.


