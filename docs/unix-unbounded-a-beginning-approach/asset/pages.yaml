  md: '# Chapter 8


    # Exploring the Shell


    # 215


    You can terminate only your own processes. The system administrator is authorized
    to terminate anybody''s processes.


    To terminate all of your processes, do the following:


    ```

    $ (sleep 120 ; echo "sleep tight"; sleep 120) & [Return]

    11234 ................................................................. . . .
    . . Sleep PID.

    $ kill -9 0 [Return] .................................................................
    . . . . . . You are logged out.

