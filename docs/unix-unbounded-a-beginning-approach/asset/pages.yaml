  md: '# 8.4.3


    # Keep On Running: The nohup Command


    When you log out, your background processes are terminated. The nohup causes your
    background processes to be immune to terminating signals. This is useful when
    you want your programs to continue processing after you have logged out.


    If you type nohup (sleep 120 ; "job done") and press [Return] and then log out,
    your command process will continue in the background. Where is the echo command
    output displayed? Since you are logged out, the process is not associated with
    any terminal, and the output is automatically saved in a file called nohup.out.


    When you log in, you can check the contents of this file to determine the output
    of your background processes. Alternatively, you can always redirect the output
    of your background programs to specified files.


    To experiment with the nohup command, try the following command sequence:


    ```

    $ nohup (sleep 120 ; "job done") & [Return]

    ....................................................................................
    Create a background job.

    12235 ......................................................................................
    Background job PID.

    $ [Ctrl-d] ................................................................ Log
    out and wait a few minutes.

    login: david [Return] ...................................................................
    Log in again.

    password: ........................................................................
    Enter your password; it''s not echoed to

    the screen.

    $ cat nohup.out [Return] ........................................ Check the contents
    of nohup.out file.

    job done

    $ _ ...................................................................................................................
    Ready for the next command.

    ```


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_234_0.png)


    # 8.4.4


    # Terminating a Process: The kill Command


    Not all programs behave normally all the time. A program might be in an infinite
    loop or waiting for resources that are not available. Sometimes an unruly program
    locks your keyboard, and then you are in real trouble! UNIX provides you with
    the kill command to terminate the unwanted process (process is a running program).
    The kill command sends a signal to the specified process. The signal is an integer
    indicating the kill type (UNIX is a morbid language), and the process is identified
    by the process ID number (PID). In order to use the kill command, you must know
    the PID of the process that you intend to terminate.


    Signals range from 1 to 15 are mostly implementation-dependent. However, 15 is
    the default signal value and causes the receiving process to terminate.


    Some processes protect themselves from the kill signals. You use the signal value
    9 (9 kill) to terminate these.


    The following command sequences illustrate the use of the kill command and its
    signals.'
