    You know how to create files and directories. You know how to remove empty-

    ories. But what if the directory is not empty? You must remove all the files\and
    subdirectories. How do you remove (delete) files?

    Use the rm (remove) command to delete files that you do not want to keep any

    more. You specify the pathname to the file you intend to delete if it is in another
    directory.

    Figure 5–14 shows how your directory structure looks after the deletion of some

    files.


    Figure 5–14

