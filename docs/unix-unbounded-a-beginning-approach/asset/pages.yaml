    # 7.4.3 Linking Files: The In Command


    You can use the In to create new links (names) between an existing file and a
    new filename. This means you can create additional names for an existing file
    and refer to the same file with different names. For example, suppose you have
    a file called REPORT in your current directory, and you type In REPORT and RP
    [Return]. This creates a filename RP in your current directory and links that
    to REPORT. Now, REPORT and RP are two names for a single file. Figure 7–6 shows
    your directory structure before and after the In command application.

    At glance, this looks like the cp command, but the cp command is but it is not!


