  md: '# Numeric Values


    You can use the test command to test (compare) two integer numbers algorithmically.
    You can also combine expressions comparing numbers with logical operators. The
    format is as follows:


    ```

    test expression_1 logical operator expression_2

    ```


    The logical operators are as follows:


    +   - Logical and operator (-): The test command returns 0 (condition code true)
    if both expressions are true.

    - Logical or operator (-): The test command returns 0 (condition code true) if
    one or both of the expressions are true.

    - Logical not operator (!): The test command returns 0 (condition code true) if
    the expression is false.


    The operators available for comparing variables that hold numeric values are summarized
    in table 11–4.


    Scenario Suppose you want to write a script that accepts three numbers as input
    (line arguments) and displays the largest of the three. Using the cat command,
    figure 11–16 shows one way of writing this program which named largest.


    +   1. When you run the largest number, it waits for you to enter three numbers.
    Then your input is passed through the if-then-elif construct to find the largest
    number.

    2. If none of the first two numbers you enter is the largest, then the first statement
    fails; next, the elif also fails, and your program gets to the else statement.
    There is no need for more checking. If the largest number is neither the first
    nor the second number, then it must be the third.


    # Table 11–4


    The test command numeric test operators.


    | Operator | Example | Meaning |

    |---|---|--|

    | -eq | number1-eq number2 | Is number1 equal to number2? |

    | -ne | number1-ne number2 | Is number1 not equal to number2? |

    | -gt | number1-gt number2 | Is number1 greater than number2? |

    | -ge | number1-ge number2 | Is number1 greater than or equal to number2? |

    | -lt | number1-lt number2 | Is number1 less than number2? |

    | -le | number1-le number2 | Is number1 less than or equal to number2? |


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_338_0.png)'
  merge: -1
