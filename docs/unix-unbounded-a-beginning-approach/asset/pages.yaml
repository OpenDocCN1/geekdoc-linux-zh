    # Command Substitution


    You can store the output of a command in a variable. You enclose a command in
    a pair of quotation marks (''''), and the shell executes the command and places
    the command with its output, like this:


    +   $ DATE=''date'' [Return] . . . . . . . . . . . . . . Save the output of the
    date command in the variable DATE.


    +   $ echo $DATE [Return] . . . . . . . . . . . . . Check what is stored in DATE.


    +   Wed Nov 29 14:30:52 DET 2001 . . . . . . . . . . . . . . . . . . . . Prompt.


    +   $_ . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .


    The output of the date command is stored in the DATE variable, and the echo command
    is used to display DATE.


    # 11.3.3


    # The Command Line Parameters


    The shell scripts can read up to ten command line parameters (also called arguments)
    from the command line into the special variables (also called positional variables,
    or parameters). Command line arguments are the items you type after the command,
    usually separated by spaces. These arguments are passed to the program and change
    the behavior of the program or make it act in a special order. The special variables
    are numbered in sequence from 0 to 9 (no number 10) and are named $0, $1, $2,
    and so on. Table 11–3 shows the list of the special (positional) variables.


    # Using Special shell Variables


    Let''s look at examples to understand how these special shell variables are used
    and arranged. Suppose you have a shell script named BOX, whose mode you have changed
    to an executable file, using the chmod command. Figure 11–9 shows your BOX script
    file.'
