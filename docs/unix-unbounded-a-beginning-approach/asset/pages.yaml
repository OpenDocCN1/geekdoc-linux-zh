    Lines 22 and 23: the echo command displays the prompt and the read command waits
    for the user''s answer, which is saved in the answer variable.


    Lines 23–27: These lines make the case construct. The case construct checks for
    the user''s answer by matching the value in answer to the case patterns.


    The first pattern is [Y]. This pattern matches all sequences of characters that
    start with [Y] or [y]. You can type any word that starts with the letter y and
    the program interprets it as the yes answer. The answer variable is set to the
    letter y, the loop condition (line 8) is true, and the program continues.


    The second pattern is [*]. This pattern matches any word that doesn''t start with
    the letter y and interprets it as the no answer. The answer variable is set to
    the letter n, the loop condition (line 8) fails, and the program ends.


    # 12.5.5 Record Retrieval


    Part of the code in each of the remaining programs in the library application
    needs to display an existing record on the screen. In order to display a record,
    you must specify what record you want displayed. For example, if you specify the
    author''s name, the library file is searched to check whether the specified author''s
    name is in the file. If it is found, the record is read (retrieved) and displayed.
    If the record is not found, an error message is displayed.


