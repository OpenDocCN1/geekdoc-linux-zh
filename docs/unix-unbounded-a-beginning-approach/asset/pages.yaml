  md: '# Directory Permission


    Directories have permission modes that work in a similar manner to file permission
    modes. However, the directory access permissions have different meanings:


    +   - read: The read (r) permission in a directory means you can use the ls command
    to list the files.

    - write: The write (w) permission in a directory means you can add and remove
    files from that directory.

    - execute: The execute (x) permission in a directory means you can use the cd
    command to change to that directory or the directory name as part of a path.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_427_0.png)


    Grant access permission to all users on the directory called mybin.


    ```

    $ chmod 777 mybin [Return] ...... Change the access mode of a directory.

    $ ................. Done; prompt is back.

    ```


    As with file permissions, each digit stands for one of the user groups (owner,
    group, and other). The digit 7 means granting write, read, and access execute
    to a particular group of users.


    # The Super-user


    It is time to know who the super-user is, as some of the commands explained in
    this chapter may be available only to a super-user on your system. The superuser
    is a user who has privileged authority and is not restricted by the file permissions.
    The system administrator must be a super-user in order to perform administrative
    tasks as establishing new accounts, changing passwords, and so on. Usually, the
    super-user logs in as root and can write to, or remove any file in the system,
    or shut the system down. Super-user status is usually granted to the system administration
    personnel.


    # File Encryption: The crypt Command


    The super-user can access any file regardless of file permissions. How can you
    protect your sensitive files from others (super-user or not?) UNIX provides the
    crypt command, which encrypts your life and makes it un to others. The crypt command
    changes each character in your file in a reversible way, so you can obtain the
    original file later. The encoding mechanism relies on simple substitution. For
    example, the letter A in your file is changed to the symbol ~. The crypt command
    uses a key to scramble its standard input into an unreadable text that is sent
    to the standard output.


    The crypt command is used for both encryption and decryption. In fact, for'
  merge: -1
  pgno: 427
