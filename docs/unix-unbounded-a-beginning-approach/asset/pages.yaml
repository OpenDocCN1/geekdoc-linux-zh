    # Command Summary


    The following commands and options have been discussed in this chapter.


    ```

    chmod changes the access permission of a specified file according to the option
    letters indicating different categories of users. The user categories are: u (for
    user/owner), g (for group), o (for others), and a (for all). The access categories
    are: r (for read), w (for write), and x (for executable).

