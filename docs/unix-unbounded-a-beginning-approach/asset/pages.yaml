    # 5.4.3 Creating Directories


    The very first time you log on to the UNIX system, you begin work from your

    home directory, which is also your working directory. Probably no file or subdi-

    exists in your home directory at this point, and you will want to build

    your own subdirectory system.


    # Advantages of Creating Directories


    There are no restrictions on directory structure in UNIX. If you want to keep
    all

    your files under your home directory, you can. Although creating an effective
    di-

    rect structure takes some time, it also provides many advantages. The adv-

    tages become apparent, particularly when you have a large number of files. The

    following lists some of the advantages of using directories:


    +   * Grouping related files in one directory makes it easier to remember and

    access them.

    * Displaying a shorter list of your files on the screen enables you to find a

    file more quickly.

    * You can use identical file names for files that are stored in different-

    directories.

    * Directories make it feasible to share a large-capacity disk with other\users
    (perhaps other students) with a well-defined space for each user.

    * You can take advantage of the UNIX commands that manipulate directo-

    ries.


    Using directories requires careful planning. If you group your files logically

    manageable directories, your plan will pay off handsomely. If you haphazardly

    create and fill directories, then you may have difficulty finding your files or
    re-

    quire more time to recognize them.'
