    # 13.4 UNIX SECURITY


    Information and computer time are valuable resources that require protection.
    System security is a very important part of multiuser systems. There are various
    aspects of system security to consider.


    +   - Keeping unauthorized people from gaining access to the system

    - Keeping an authorized user from tampering with the system files or other users''
    files

    - Granting some users certain privileges


    Security on the UNIX system is implemented by using simple commands, and the system
    security can be as lax or tight as you desire. Let''s examine some of the available
    means to secure your system.


    # 13.4.1 Password Security


    All the information system needs to know about each user is saved in a file called
    /etc/passwd. This file includes each user''s password; however, it is encrypted,
    using an encoding that makes the deciphering of the passwords a very difficult
    task.(Encryption is discussed in more detail later in this section.)


    The passwd file contains one entry for each user. Each entry is a line that consists
    of seven fields, which are separated by colons. The following line shows the format
    of each line in the passwd file, followed by the explanation of each field in
    the line.'
