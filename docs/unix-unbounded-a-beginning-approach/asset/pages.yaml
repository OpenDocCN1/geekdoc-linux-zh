    # 8.5 STARTUP FILES


    When you log in, the login program verifies your user ID and password against

    t list of authorized users stored in the password file. If the login attempt is
    suc-cessful, the login program brings your home directory upon the system, sets
    up

    y user ID and group ID, and finally starts your shell. Before displaying its

    prom sign, the shell checks for two special files. These two files are called
    pro-file files, and they contain shell scripts (programs) that the shell can execute.


    # 8.5.1 System Profile


    The system profile file is stored in /etc/profile. The first thing your shell
    does

    execute it file. It typically contains commands that display the message of the

    day, set up system-wide environment variables, and so on. This file is usually

    created and maintained by the system administrator, and only the super-users can

    modify it.


    Figure 8–12 shows an example of the system profile file. The shell executes

    commands in the file, so it displays the current date and time, then the mes-sage
    of the day (stored in /etc/mot file), and finally the new news items.


    +   * Usually, the system profile file is complex and incorporate some system

    administration commands and requires some programming.

    * You can look at your system profile file by typing cat/etc/profile [Return].

    Usually, this file is a read-only file. You can read it, but not edit it.'
