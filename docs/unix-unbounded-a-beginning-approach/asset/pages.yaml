  md: '# MORE ABOUT THE vi EDITOR


    The vi editor is part of the ex family of editors, vi is the screen-oriented part
    of the ex, and it is possible to switch between the vi and ex editors. In fact,
    vi commands that start with[:] are ex commands. While in vi''s command mode, pressing[:]
    displays the colon prompt at the bottom of the screen and causes vi to wait for
    your command. When you complete your command line by pressing [Return], ex executes
    the command and, upon completion, returns control to vi.


    To change the ex editor, type :Q and press [Return]. If you have intentionally
    or accidentally changed to the ex editor, type vi to get back to the vi editor,
    or type q to exit the ex editor and return to the shell prompt.


    # Invoking the vi Editor


    In chapter 4, you learned how to start vi, how to save a file, and how to quit
    vi. Expanding on those commands, lets explore other ways the vi editor can be
    invoked and ended.


    You can start the vi editor without providing the file name. In this case, you
    use the (:w) or write and quit (:wq) command to name your file.


    The following command sequences show you how to do this:


    +   - Type vi and press [Return] to invoke the vi editor without the file name.

    - Type :w myfirst and press [Return] to save the contents of the temporary buffer
    into the myfirst file and stay in the vi editor.

    - Type :wq myfirst and press [Return] to save the contents of the temporary buffer
    into the myfirst file and quit the vi editor.


    If your current editing file editor does not have a name and you type :w or :wq
    with giving a file name, vi displays the following message:


    No filename


    The vi editor normally prevents overwriting an existing file. Thus if you type
    :w myfirst and, myfirst already exists, it warns you by showing the following
    message:


    "myfirst" File exists - :w to overwrite


    If you want to overwrite an existing file, use the :w command.


    See page xxii for an explanation of the icons used to highlight information in
    this chapter.'
