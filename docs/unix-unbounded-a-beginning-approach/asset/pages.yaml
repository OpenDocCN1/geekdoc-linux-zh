  md: '# UNIX UNBOUNDED: A BEGINNING APPROACH


    Universities and colleges have played an important role in the popularity of the
    UNIX operating system. In 1975, Bell Labs offered the UNIX operating system to
    educational institutions at minimal cost. UNIX courses were incorporated into
    the computer science curriculum, and students, in turn, became familiar with UNIX
    and its sophisticated programming environment. As those students graduated and
    joined the work force, they carried their UNIX skills to the commercial world
    and UNIX was introduced to industry.


    There are two major versions of the UNIX operating system:


    +   * AT&T UNIX version V

    * Berkeley UNIX


    Other UNIX varieties are based on either of these two versions.


    # 2.1.1


    # UNIX System V


    In 1983, AT&T released the standard UNIX System V, which was based on the UNIX
    that AT&T was using internally. As the UNIX development effort continued, other
    features were added and some existing features were improved. Over the years,
    UNIX System V grew larger in size as well as the number of its tools and utilities.
    The early improvements and new features were incorporated into the UNIX operating
    system''s later releases, UNIX System Release 3.0 in 1986 and UNIX System Release
    4.0 in 1988.

    UNIX System Release 4.0 was an effort to merge most of the popular features of
    the Berkeley UNIX and other UNIX systems. This unification helped simplify the
    UNIX product and reduced the need for manufacturers to create new variants.


    > This book describes the commands applicable to the UNIX System V Release 4,
    (SVR4).


    # 2.1.2


    # Berkeley UNIX


    The Computer Systems Research Group at the University of California at Berkeley
    added new features and made significant changes to the UNIX operating system.
    This version of UNIX is called the Berkeley Software Distribution (BSD) version
    of the UNIX system and has been distributed to other colleges and universities.


    # 2.1.3


    # UNIX Standards


    The UNIX operating system is available on all types of computers (micros, minis,
    mainframes, and supercomputers) is an important operating system in the computer
    industry. As more UNIX-based systems were introduced into the market, and more
    application programs became available, an effort toward UNIX standardization began.
    AT&T''s UNIX System V Release 4.0 was an effort'
