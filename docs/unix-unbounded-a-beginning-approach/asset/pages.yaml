    Good news, UNIX is on video tape.


    +   $ \| [Return]

    The command line is not completed.

    This is signaled by the backslash.


    +   >

    The shell displays the second prompt sign, and waits for the rest of the command.

    Now the command line is complete.

    The shell puts it together as Is -l and executes it.


    +   $_

    And the prompt is back.


    # CDPATH


    The CDPATH variable is set to a list of absolute pathnames, similar to the PATH
    variable. The CDPATH affects the operation of the cd (change directory) command.
    If this variable is not defined, then cd searches your working directory to find
    the pathname that matches its argument. If the subdirectory does not exist in
    your working directory, UNIX displays an error message. If this variable is defined,
    cd searches for the specified directory according to the pathnames signed to the
    CDPATH variable. If the directory is found, it becomes your working directory.


    For example, if you type CDPATH=SHOME;SHOME/memos and [Return], the next time
    you use the cd command, it will start searching from your current directory, then
    your home directory, and eventually the memos directory to find a match to the
    filename specified as the cd argument.


    # SHELL


    The SHELL variable is set to the full pathname of your login shell:


    ```

    SHELL=/bin/sh

    ```


    # TERM


    The TERM variable sets your terminal type:


    ```

    TERM=vt10

    ```'
