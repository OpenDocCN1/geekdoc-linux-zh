  md: 'Command Layer The command layer, also called the shell (because it is the outermost
    layer), provides the user interface and is the only part of the operating system
    with which users can interact directly. The command layer responds to a set of
    specific commands supported by each operating system. The set of the commands
    and their syntax requirements is referred to as a command language. There are
    other alternatives to the command language.


    # Operating Systems Environment


    Operating system functions can be fulfilled in many ways. In single-user environments,
    like most microcomputers, all available resources are allocated to a single program.
    That program is the only program in the computer. On larger computers (and on
    microcomputer networks), where more than one user is sharing the resources, the
    operating system must resolve conflicts arising from the request for the same
    resource by different programs. Let''s explore some basic concepts and terminology
    describing the different operating systems and their environments.


    Although several programs can be in the memory of a microcomputer, only one program
    is active at a time.


    +   Single-tasking A single-tasking (single-programming) operating system is designed
    to execute only one process at a time. This is the usual arrangement with the
    single-user environment, and it is generally restricted to microcomputers and
    specialized applications.


    +   Multitasking A multitasking (multiprogramming) operating system is capable
    of executing more than one program at a time for a user. It can run several programs
    in the background while you are working on another task in the foreground. For
    example, you can direct the operating system to sort a large file in the background
    while you are typing memos using a word processor at a time. The operating system
    informs you when a background task is finished. Multitasking is the capability
    that allows one user (terminal) to execute more than one program concurrently.


    +   Multiuser In a multiuser environment, more than one user (terminal) can use
    the same host computer. The multiuser operating system is complex software that
    provides services for all users concurrently. The users'' programs are in the
    main memory, and it appears that they are executed simultaneously; however, there
    is only one CPU, and the processor can execute only one program at a time. The
    multiuser operating system takes advantage of the speed disparity between the
    computer and its peripheral devices (disks, printers, and so on). In comparison
    with the processor speed, input/output devices are very slow. Then, when one program
    is waiting for its I/O request, the processor has plenty of time and can turn
    its attention to another program in the memory. The process of switching programs
    is concealed from the user and can give the illusion that the user is the only
    one using the system.


    Figure 1–7 shows an example of a multiuser system. There are four users, one printer,
    and some I/O devices. The users share the same host computer and its resources.


    The multiuser operating system is capable of providing services for many users
    (terminals), using the same host computer.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_37_0.png)'
  merge: -1
