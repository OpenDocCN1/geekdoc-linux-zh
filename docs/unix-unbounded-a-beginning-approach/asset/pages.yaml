    # 12.3 MORE ABOUT TERMINALS


    The UNIX operating system supports numerous types of terminals. Each terminal
    has its own capabilities and characteristics. These capabilities are documented
    in the terminal user/technical manual along with a set of escape characters that
    can be used to manipulate the terminal capabilities. Each terminal has its own
    set of escape characters. In chapter 11, escape character \032 was used to clear
    the screen. The \032 is the clear screen code for vt100-type terminals. You type
    the following line to clear the:


    $ echo "\032" [Return] ............................ Clears screen on the vt100-type
    terminals.


    Terminal capabilities are not limited to the clear screen function. There are
    dozens of other characteristics, such as boldface text, blinking, underlining,
    and so on. You use them to make your display more meaningful, better organized,
    and simply like never.


    # 12.3.1 The Terminal Database: The terminfo File


    Each terminal supported in your system has an entry in the terminal database (file)
    called terminfo (terminal information). The terminfo database is a single file
    that contains descriptions of many types of terminals. For each terminal in the
    database, there is a list of capabilities associated with that terminal.


    # 12.3.2 Setting the Terminal Capabilities: The tput Command


    The tput utility, which is standard on any system with the terminfo database,
    lets you print the values of any single capability. This makes it possible to
    use terminals'' capabilities in shell programming. For example, to clear the screen
    you type:


    ```

    $ tput clear [Return]

    ```'
