    # 9.6


    # COMMUNICATIONS OUTSIDE THE LOCAL SYSTEM


    This chapter has discussed the UNIX communication utilities that enable you to
    send mail to users who have login accounts on your local host. You can also send
    mail to users on other UNIX computers. If you are on a UNIX network, as as big
    companies and universities usually, you can use the same commands. However, you
    must give more information. For example, the destination of your message needs
    to have the name of the computer (node on the network) in addition to the user
    Id of the person on the specified computer. For example, if the computer nodes
    between you and David on the network were X, Y, and Z, then you would type the
    following to send mail to David:


    ```

    mail X!Y\!Z\!david

    ```


    The details of communicating with other UNIX systems are outside the scope of
    this book. The commands in this chapter are all the basic skills you need; the
    rest is just a matter of looking up the commands in a reference book. Appendix
