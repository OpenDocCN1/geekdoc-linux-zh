  md: '# Appendix C Command Summary


    mailx 251

    Provides the electronic mail system for the users. You can send messages to other
    users on the system, regardless if they are logged in or not. You can read, save,
    etc., your received mail. With many options and commands in different modes, mailx
    gives you plenty of room in regards to the mail manipulation.


    | Option | Operation |

    | | -f [filename] | Reads mail from the specified filename instead of the system
    mailbox. If no file is specified, it reads from mbox. |

    | -H | Displays a list of the message headers. |

    | -s subject | Sets the subject field to the string subject. |


    mailx tilde escape commands 252

    When you invoke mailx to send mail to others, it places itself in input mode,
    ready for you to compose your message. The commands in this mode start with a
    ~ and are called tilde escape commands.


    | Command | Operation |

    | ~? | Displays a list of all the tilde escape commands. |

    | ~! command | Lets you invoke the specified shell command while composing your
    message. |

    | ~e | Invokes an editor for editing your message. The editor to be defined in
    the mail variable called EDITOR. |

    | ~q | Quits the input mode. Saves your partially composed message in the file
    called dead.letter. |

    | ~r filename | Reads the file specified by filename and adds its contents to
    your message. |

    | ~< filename | Reads the file specified by filename (using the redirection operator)
    and adds its contents to your message. |

    | ~<! command | Executes the specified command and places its contents into your
    message. |

    | ~v | Invokes the default visual editor, the vi editor, or uses the value of
    the mail variable VISUAL, which can be set up for other editors. |

    | -w filename | Writes the message currently being composed to the file specified
    by filename. |


    man. 43

    Shows pages from the on-line system documentation.


    mesg 246

    This command is set to n to prohibit unwanted write messages. It is set to y to
    receive messages.'
