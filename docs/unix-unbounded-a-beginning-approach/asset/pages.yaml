  md: "# Chapter 11\n\n# Shell Programming\n\n# 329\n\ntimes? The shell provides you\
    \ with three looping constructs: the for loop, while loop, and until loop. These\
    \ loops enable you to repeatedly execute commands for a certain number of times\
    \ or until certain conditions are met.\n\n# 11.5.1\n\n# The For Loop: The for-in-done\
    \ Construct\n\nThe for loop is used to execute a set of commands a specified number\
    \ of times. Its basic format is as follows:\n\n```\nfor variable\n  list-of-values\n\
    \    do\n      commands\n      ....\n      last-command\n  done\n```\n\nThe shell\
    \ scans the list-of-values, stores the first word (value) in the loop variable,\
    \ and the commands between do and done (what is called the body of the loop) are\
    \ executed. The next word is assigned to the loop variable, and again the body\
    \ of the loop is executed. The commands in the body of the loop are executed for\
    \ as many values as the list-of-values contains.\n\nThe following command sequences\
    \ show how the for loop works.\n\n```\n$ count in 1 2 3 [Return] . . . Set the\
    \ loop header.\n> do [Return] . . . . . Waiting for you to complete the command.\n\
    > echo \"In the loop for Scount times\" [Return]\nDisplay message.\n> done [Return]\
    \ . . . . . End of the for loop.\nIn the loop for 1 times\nIn the loop for 2 times\n\
    In the loop for 3 times\n$_ . . . . . . . . . . . . . . . . . . . . . . . . .\
    \ Prompt.\n```\n\n+   1. In this example, count is the loop variable, the list-of-values\
    \ consists of numbers (1, 2, and 3), and the body of the loop is a single echo\
    \ command.\n2. Because three values are listed in the list-of-values, the body\
    \ of the loop is executed a total of three times.\n3. The values in list-of-values\
    \ are assigned one by one to the count variable. Each time through the loop, a\
    \ new value is assigned until the list-of-values is exhausted.\n\nScenario you\
    \ want to save the name of the files you print along with the time you print them\
    \ in a file. You write a script called slp (Super LP) that prints your files and\
    \ saves the information about them in a file called pfile.\nFigure 11–19 shows\
    \ one way to write an slp script.\n\n![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_350_0.png)"
  merge: -1
  pgno: 350
- img_proc: true
  md: "# Figure 11–19\n\nThe slp script slp.\n\n```\n# cat slp\n#\n# The super line\
    \ printer program (slp).\n#\necho \"Enter the name of the file(s). \\c\" # prompt\
    \ the user\n  read filename # read input\n  for FILE in $filename\n    do echo\
    \ \"\\nFilename: $FILE\\n Printed: \\date\" >> # save in file\n    lp $FILE #\
    \ print the file\n  done\n  echo \"\\n07JobJob done\" # inform user\n  exit 0\n\
    __\n```\n\n+   1. You can enter more than one filename. Each filename from the\
    \ list of files in variable filename is assigned to the loop variable FILE. The\
    \ echo command takes care of saving the information in pfile, and the lp command\
    \ prints it.\n\n+   2. The echo command creates pfile the first time you use this\
    \ program. On consequent runs, it appends (the >> redirection operator) the filenames\
    \ of the printed files.\n\nRun the slp program.\n\n| $ slp [Return] ............................\
    \ Run it. |\n| Enter the name of the files(s)> ...... Waiting for input. |\n|\
    \ myfile [Return] ................. You enter myfile. |\n| lp: request id is lp\
    \ 1-9223 (if file) ...... The lp message. |\n| Job done ...........................\
    \ Beep and final message. |\n| $.......................................... .Prompt.\
    \ |\n| $ cat pfile [Return] .............. Check pfile. |\n| Filename: myfile\
    \ |\n| Printed: Mon Dec 6 12:01:35 EST 2001 |\n| $...........................................\
    \ The shell prompt appears. |\n\n# 11.5.2 The While Loop: The while-do-done Construct\n\
    \nThe second type of looping construct explained here is the while loop. Unlike\
    \ the for loop, whose number of iterations depends on the number of values in\
    \ the list-of-values, the while loop continues as long as the loop condition is\
    \ true. The format is as follows:"
  merge: -1
