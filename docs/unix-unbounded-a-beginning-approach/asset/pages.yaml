  md: '# Table 11–7


    The shell variable evaluation options.


    | Variable Option | Meaning |

    | --- | --- |

    | $variable | The value stored in variable. |

    | ${variable} | The value stored in variable. |

    | ${variable: -string} | The value of *variable* if it is set and not empty; otherwise,
    the value of string. |

    | ${variable: +string} | The value of *variable* if it is set and not empty; otherwise,
    nothing. |

    | ${variable: =string} | The value of *variable* if it is set and not empty; otherwise,
    *variable* is set to the value of string. |

    | ${variable: ?string} | The value of *variable* if it is set and not empty; otherwise,
    print the value of string and exit. |


    ```

    $ mv $FILE($FILE)X [Return] . . . . Change memo to memoX.

    $_ . . . . . . . . . . . . . . Job done; the prompt is back.

    ```


    This command worked because the shell considers $FILE the variable name and substitutes
    its value, in this case.


    $(parameter:-word) The - (hyphen) option means if the listed variable (parameter)
    is set and not empty (non-null), use its value. Otherwise, if the variable is
    empty (null) or unset, substitute its value with word. For example:


    ```

    $ FILE=[Return] . . . . . . . . . . Empty variable.

    $ echo $FILE:/usr/david/xfile [Return] . . . . . Display FILE value.

    /usr/david/xfile

    $ echo "$FILE" [Return] . . . . . . . . . . Check the FILE variable.

    . . . . . . . . . . . . . . . . It remains empty.

    $_ . . . . . . . . . . . . . . . . . . . Prompt.

    ```


    +   1. The shell evaluates the variable FILE; it is empty; so the - option results
    in substitution of the /usr/david/xfile string, which is passed to the echo command
    to display it.

    2. The FILE variable remains an empty variable.


    $(parameter:+word) The + option is the opposite of the option. It means that if
    the listed variable (parameter is set and not empty (non-null), then substitute
    its value with word. Otherwise, the variable''s value remains the same. For example:


    ```

    $ HELP="wanted" [Return] . . . . . . . . Set the HELP variable

    $ echo $HELP:+"Help is under way"} [Return]

    ```'
