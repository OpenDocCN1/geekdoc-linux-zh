  md: '# 12.1


    # WRITING APPLICATIONS


    Chapter 11 introduced shell programming basics and mentioned using the shell command
    language to write application programs. This chapter explains the process of developing
    application programs. The examples are complete programs, and, when necessary,
    new commands or constructs are introduced and explored.


    **Scenario** You want to protect your terminal (say when you are away from it
    for few minutes), without logging off and then logging again. You can write a
    script file that, when invoked, shows a message on the screen and doesn''t go
    away until you enter the correct password. But do you really want to lock your
    terminal? Yes. The goal here is to learn about commands and programming techniques,
    and apply them to script files, whether you want to lock your terminal or not.


    # 12.1.1


    # The lock1 Program


    12–1 shows a script named lock1 (lock version 1), which does the job by locking
    your keyboard. The lock1 program is shown using the vi editor, and line numbers
