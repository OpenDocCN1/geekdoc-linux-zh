    # 10.2.1


    # Low-level Languages


    **Machine Language** In machine language, instructions are coded as a series of
    zeros and ones. It is cumbersome and difficult to write programs in the most basic
    language. Machine language programs are written at the most basic level of computer
    operation; it is the only language computers can understand and execute. Programs
    written in other programming languages must be translated into the machine language
    of the computer on which the program is to be executed.(Programs called *compilers*
    do this translation and are discussed in the next section.)


    **Assembler Language** like machine language, assembler language is unique to
    a particular computer, but the instructions are represented differently. Instead
    of a series of zeros and ones, assembler language uses recognized symbols, called
    mnemonic (memory aid), to represent instructions. For example, the mnemonic MUL
    is used to represent a multiply instruction. Because computers understand only
    zeros and ones, you must change a program in assembler to machine language format
    for execution. This translation is done by invoking a program called an *assembler*.
    The assembler program translates the mnemonics in your program back to zeros and
    ones.


    # 10.2.2


    # High-level Languages


    No matter what computer and which high-level language you use to write your program,
    the program must be translated into machine language before it can be executed.
    This conversion of a program from a high-level programming lan-'
