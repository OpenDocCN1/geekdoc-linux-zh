    +   1. Fields are separated by one or more spaces.

    2. Fields enclosed in brackets [...] are optional for most of the commands.


    You must signal that you have completed entry of a command by pressing [Return]
    at the end of every command.


    **Command Name** Any valid UNIX command or utility program functions as a command
    name. Under UNIX, commands and utilities are different. In this text, the word
    *command name* refers to both of them.


    UNIX is a case-sensitive system and only accepts command names in lower-case letters.


    **Options** Options are variations on the command. If they are included in the
    command line, they are usually preceded by a minus sign (-). Most options are
    designated by a single lowercase letter, and more than one option can be specified
    on one command line. This text does not describe all possible options for every
    command.


    **Arguments** Arguments are commands that perform some sort of operation, such
    as printing a file or displaying information. Commands often need to operate on
    something, which means you must provide additional information. The additional
    information the command needs to operate on is called an *argument*. For example,
    if the command is *print*, you will have to tell UNIX what to print (the name
    of a file) and where to find the file you want to print (somewhere on the disk).
    The name of the file plus where the file is located on the disk is an example
    of the *argument field.*


    # 3.2.3 Date and Time Display: The date command


    The **date** command displays the current date and time on the screen (see Figure
    3–10). The date and time are set by the system administrator. Users cannot change
    them.


