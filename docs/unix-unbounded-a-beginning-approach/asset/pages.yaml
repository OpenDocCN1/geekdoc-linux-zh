    Korn Shell The Korn shell (ksh) is a superset of the Bourne shell. It has the
    bash syntax and features of the Bourne shell (sh) as well as many other features.
    You can generally run the shell program written for sh under ksh without modifications.
    The prompt for the Korn shell is the dollar sign ($).


    C Shell The C shell (csh) was developed at the University of California at Berkeley
    and is part of the BSD (Berkeley Software Distribution) version of UNIX. The syntax
    of shell programming under C is different from sh and ksh since it is a C language
    style syntax. The prompt for C shell is the percent sign (%).


    This Book''s Shell The Bourne shell is the default shell on many systems. As far
    as the basic commands and features are concerned, however, all three shells are
    very similar. This book assumes you the Bourne shell although it also covers some
    convenient Korn shell enhancements.


    +   - Commands applicable to the Korn shell are identified by the ksh designation.


    # 3.6 MORE ABOUT THE LOGGING IN PROCESS


    When you boot (bootstrap) the UNIX system, the resident part of the operating
    system (kernel) is loaded into the main memory. The rest of the operating system
    programs (utilities) remain on the system disk and are brought into memory only
    when you request that command be executed. The shell program is also loaded into
    memory for execution when you log in. Learning the sequence of events that occur
    when you log in will help you gain a better understanding of the UNIX system''s
    internal operation.


    After UNIX completes the boot process, a program called init activates a program
    called getty for each terminal port on the system. The getty program displays
    the login: prompt at the assigned terminal, and waits for you to type your User
    Id (see figure 3-21).


    When you enter your User Id, getty reads it and starts another program, called
    login, to complete the logging process. It also gives the login characters you
    typed at the terminal, which are presumed to be your User Id (login name). Next,
    the login program begins execution and displays the password: prompt at the terminal.
    The login program waits for you to enter your password (see figure 3-22).


    After you have typed your password, the login program verifies your User Id and
    password. It then checks for the name of a program to execute. In most cases,
    this will be the shell program. If it is the Bourne shell (standard shell), it
    displays a $ prompt. Now the shell is ready to accept your commands


    When you log off the system, the shell program is terminated and the UNIX system
    starts up a new program at the terminal and waits for someone to log in. This
    cycle continues as long as the system is up and running (figure 3-24).'
