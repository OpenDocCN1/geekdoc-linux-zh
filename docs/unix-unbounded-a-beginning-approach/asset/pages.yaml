- img_proc: true
  md: '# Chapter 2


    # The UNIX Operating System


    # 25


    to standardize the UNIX system and in turn to facilitate the writing of the applications
    that run on all versions. The written UNIX standard from AT&T is called System
    V Interface Definition (SVID). Other companies that market UNIX operating systems
    or related UNIX products have joined together and developed a standard called
    Portable Operating System Interface for Computer Environments (POSIX). POSIX is
    largely based on the System V Interface Definition.


    # 2.2 Other UNIX Systems


    Almost all major UNIX vendors offer versions of the UNIX system that are based
    on UNIX System V. Most of the UNIX variants share a large number of commands and
    features similar to System V Release 4 (SVR4). The following is a brief description
    of some of these variants.


    # 2.2.1 AIX


    AIX is IBM''s version of the UNIX operating system. It is similar to SVR4 and
    is optimized and enhanced to run on IBM machines. It supports graphical interfaces.


    # 2.2.2 HP-UX


    HP-UX is Hewlett-Packard''s version of the UNIX operating system. It was developed
    and sold for use on HP computers and workstations, and is based on UNIX System
    V Release 2.


    # 2.2.3 LINUX


    The Linux variant of the UNIX system is the brainchild of Linux Torvalds, a computer
    science student at the University of Helsinki in Finland. It was designed to run
    on 80x86 Intel processor-based personal computers. Since the release of Linux,
    many people have been involved in building and enhancing implementation of UNIX.
    Unlike other versions of UNIX, Linux is a freely distributable implementation
    of UNIX. Linux shares many features of UNIX System V and has many enhancements.
    It is a popular version of UNIX for use on personal computers.


    # 2.2.4 Solaris


    SunOS, later called Solaris, was the operating system of Sun Microsystems that
    was based on UNIX System V Release 2 and BSD (Berkeley Software Distribution)
    4.3. Solaris 2.0 is based on SVR4, and the current version of Solaris is Solaris
    2.4 that has a large installations base. There is a wide range of'
  merge: -1
