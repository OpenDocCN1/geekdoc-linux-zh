    # ## 6.6.2


    # # Setting the vi Environment


    The behavior of the vi editor can be customized by setting the edit parameters
    to new values, and there are different methods you can use to set them. The direct
    method of changing these values is to use the vi set command to set the values
    as desired. In this case, you must be in the command mode before you issue the
    set commands. You can set every option using this method; however, the changes
    are temporary, and they are in effect only for your current editing session. When
    you quit the vi editor your options settings are abandoned.


    This section describes some useful vi parameters (listed alphabetically), and
    table 6–4 summarizes these options. Most of the option names have abbreviations,
    and you can use the full or abbreviated names in the set command.


    **autointent** Option The **ai** option aligns each new line you type in the text
    mode with the beginning of the previous line. This option is useful for writing
    computer programs in C, Ada, or other structured programming languages. You can
    use [Ctrl-d] to backspace one level of indentation. Each [Ctrl-d] backs up the
    number of columns specified by the *shiftwidth* option. The default value for
    this option is set to **noai**.


    **ignorecase** Option The vi editor performs case-sensitive searches—i.e., it
    differs between uppercase and lowercase letters. In order to make the vi editor
    ignore the letter cases, type: `set ignorecase` and press [Return].


    ### Table 6–4

    Some of the vi’s environment options.


    | Option | Abbreviation | Operation |

    |---|---|---|

    | autointent | ai | Aligns the new lines with the previous ones. |

    | ignorecase | ic | Ignores the uppercase/lowercase difference in search options
    |

    | magic | | Allow use of the special characters in search. |

    | number | nu | Displays line numbers. |

    | report | - | Informs you of the number of lines affected by your last command.
    |

    | scroll | - | Sets number of lines to scroll when [Ctrl-d] command is given.
    |

    | shiftwidth | sw | Sets number of spaces to indent. Used with autointent option.
    |

    | showmode | smd | Displays the vi modes on the right corner of the screen. |

    | terse | - | Shortens the error message |

    | wrapmargin | wm | Sets the right margin to a specified number of characters.
    |'
