  md: "# Figure 11–20\nThe COUNTER script file.\n\n```\n$ cat COUNTER\n#\n# COUNTER:\
    \ counts from 1-9 using while loop\ncount=1 # initialize the count variable\n\
    while [ $count -lt 10 ];\n\n  echo $count #display count value\n  count=`expr\
    \ $count + 1` # increment count\ndone\n$_\n```\n\n4\n5\n6\n7\n8\n9\n$_ ............................................................................\
    \ The shell prompt appears.\n\nFigure 11–21 shows a new version of the COUNTER\
    \ script, using the let instead of the expr command. The cat command is used to\
    \ show the source code.\n\nThe following versions of the COUNTER program work\
    \ only with the ksh shell.\n\n# The let command Abbreviated\n\nYou can abbreviate\
    \ the let command to double parentheses, (()). Figure 11–22 shows yet another\
    \ version of the COUNTER program. In this version the let abbreviation is used\
    \ instead of expr.\n\n# 11.5.3 The Until Loop: The until-do-done Construct\n\n\
    The third type of the looping construct explained here is the until loop. The\
    \ until loop is similar to the while loop, except that it continues executing\
    \ the body of the loop as long as the condition of the loop is false (non-zero).\
    \ The until loop is useful in writing scripts whose execution depends on other\
    \ events occurring. The format is as follows:\n\n```\nuntil [ condition ]\ndo\n\
    \  commands\n\nlast-command\ndone\n```"
  merge: -1
  pgno: 353
- img_proc: true
  md: "# Figure 11-21\n\nThe new version of the COUNTER script file.\n\n```\n$ cat\
    \ COUNTER\n#\n# COUNTER: counts from 1-9 using while loop and the let command\n\
    #\ncount=1 # initialize the count variable\nwhile [ $count -lt 10 ]\ndo\n    echo\
    \ $count #display count value\n    let count=count + 1 # increment count\ndone\n\
    $\n```\n\nThe body of the loop might never get executed if the loop condition\
    \ is true (zero) the first time it is executed.\n\n**Scenario** You want to check\
    \ whether a specified user is on the system or, if not, to be informed as soon\
    \ as the user logs in. Figure 11–23 shows one way to write the script file uon\
    \ (User ON).\nIn *script*, the *until* loop stops as soon as the loop condition\
    \ is true. If **grep** (chapter 8) does not find the specified user ID passed\
    \ to it by the **who** command in the list of users, then the loop condition becomes\
    \ false (nonzero) and the *until* loop continues executing the body of the loop,\
    \ the **sleep** command. As soon as **grep** finds the specified user ID in the\
    \ users list, the loop condition becomes true (zero) and the loop stops. Next,\
    \ the command after the loop is executed, which informs you, with two beeps, that\
    \ the user is logged in.\n\n# Figure 11-22\n\nAnother version of the COUNTER script\
    \ file.\n\n```\n$ cat COUNTER\n#\n# COUNTER: counts from 1-9 using while loop\
    \ and the let command\n#\nabbreviation (( ))\n\ncount=1 # initialize the count\
    \ variable\nwhile (( count < 10 ))\ndo\n    echo $count #display count value\n\
    \    (( count = count + 1 )) # increment count\ndone\n$\n```"
  merge: -1
  pgno: 354
- img_proc: true
  md: "# Figure 11–23\nA uon script file.\n\n```\n# cat uon\n#\n# uon: Let me know\
    \ if xxx is on the system.\n#\nuntil I grep \"$1\">/dev/null #redirect the output\
    \ of grep\ndo\n    sleep 30                        # wait half a minute\n    done\
    \                            #display count value\necho \"%07%07$1 is logged on.\"\
    \ # inform the user\n    exit 0\n$_                               # end of the\
    \ if statement.\n```\n\n+   1. The output of the grep command is redirected to\
    \ the null device (never-never land). That means you neither want to see the output\
    \ nor save it.\n2. The sleep command stops your program for half a minute. The\
    \ next effect is that the grep command checks the list of users every half minute.\n\
    \nThere is only one problem. If you run this program in the foreground and the\
    \ specified user is not logged in, then you are at the mercy of the user to log\
    \ in and cannot use your terminal while the above program is running. A better\
    \ idea is to run uon in the background.\n\nRunning uon in the background.\n\n\
    | $ uon emma &[Return] ............................ Run it in the background.\
    \ Check to see |\n| ................. if emma is logged in. |\n| 4483 ................................\
    \ Process ID. |\n| $ ................................ The prompt is back. |\n\n\
    You can do other work. You will be informed when emma logs in.\nemma is on the\
    \ system ........................ Beep beep. You are informed.\nYou can go on\
    \ with whatever you were doing.\n\n# Debugging shell Programs\n\nIt is easy to\
    \ make mistakes when you write long and complex script files. Because you do not\
    \ compile script files, you do not have the luxury of compiler error checking.\
    \ Therefore, you have to run the program and try to decipher the error messages\
    \ displayed on the screen. But do not despair!"
  merge: -1
