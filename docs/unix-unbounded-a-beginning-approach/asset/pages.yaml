    # Terminating Programs: The exit Command


    The exit command is a built-in shell command that you can use to immediately terminate
    execution of your shell program. The format of this command is as follows:


    ```

    exit n

    n is the exit status, which is also called the return code (RC). If no exit value
    is provided, the exit value of the last command executed by the shell is used.
    To be consistent with the other UNIX programs (commands) that usually return a
    status code upon completion, you can program your script to return an exit status
    to the parent process. As you know, typing exit at the Prompt terminates login
    and consequently logs off.

    ```


    # 11.3.4 Conditions and Tests


    You can specify that certain commands will be executed depending on the results
    of the other commands'' executions. You often need this kind of control over writing
    shells.

    Every command executed in the UNIX system returns a number that you can test to
    control the flow of your program. A command returns either a 0 (zero), which means
    success (the true condition), or some other number, which indicates failure (the
    false condition). These true and false conditions are used in the shell programming
    constructs and are tested to determine the flow of the program. Let''s look at
    these constructs.'
