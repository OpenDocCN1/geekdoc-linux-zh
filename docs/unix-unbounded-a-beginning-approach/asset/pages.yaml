    # 7.7 UNIX INTERNALS: THE FILE SYSTEM


    How does the UNIX file system keep track of your files? How does it know the location
    of your files on the disk? From your point of view, you create directories to
    organize your disk space, directories and files have filenames to identify them.
    This hierarchical structure of directories and files is a logical view of the
    file system. Internally, however, UNIX organizes the disk and keeps track of files
    in a different manner.


    The UNIX file system associates every filename with a number called its i-node
    number and identifies each file with its i-node number. UNIX keeps all these i-node
    numbers in a list, appropriately called an i-node list. The list is saved on the
    UNIX disk.


    # 7.7.1 UNIX Disk Structure


    Under UNIX, a disk is a standard block device, and a UNIX disk is divided into
    four blocks (regions):'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# UNIX UNBOUNDED: A BEGINNING APPROACH


    +   * boot block

    * super block

    * i-node list block

    * files and directories block


    **The Boot Block** The boot block holds the boot program, a special program that
    is activated at the system boot time.


    **The Super Block** The super block contains information about the disk itself.
    This information includes the following:


    +   * total number of disk blocks

    * number of free blocks

    * block size in bytes

    * number of used blocks


    **The i-list Block** The i-list block keeps the list of i-nodes. Each entry in
    this list is an i-node, a 64-byte storage area. The i-node of a regular file or
    a directory file contains the location of its disk block(s). The i-node of a special
    file contains the information that identifies the peripheral device. An i-node
    also contains information, including the following:


    +   * file access permission (read, write, and execute)

    * owner and group ids

    * file link count

    * time of the last file modification

    * time of the last file access

    * location of blocks for each regular file and directory file

    * device identification number for special files


    The i-nodes are numbered sequentially.


    # **i-nodes and Directories**


    i-node 2 contains the location of the block(s) that contains the root directory
    (/). A UNIX directory contains the list of filenames and their associated i-nodes.
    When you create a directory, it automatically creates two entries, for the ..
    (dot dot) or a parent directory and one the . (dot) or child directory.


    Filenames are stored in directories and not in the i-nodes.


    # 7.7.2 Putting It Together


    When you log in, UNIX reads the root directory (i-node 2) to find your home directory
    and saves your home directory i-node number. When you change your directory using
    cd, UNIX replaces this i-node number with the new directory''s i-node number.'
