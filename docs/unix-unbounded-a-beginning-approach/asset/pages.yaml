  md: '# Preface


    The price break for the UNIX operating system on microcomputers and recent hardware
    advances have boosted the acceptance and popularity of UNIX for micros. Consequently,
    there are students and novice UNIX users with computer skills but no experience
    with any operating system.


    This book is for this group of users and students. It is neither an operating
    system book nor a UNIX reference book. It is a textbook in a tutorial manner,
    intended as a teaching/learning tool in a classroom/lab environment. It is an
    introductory book for introductory operating system courses. It discusses operating
    systems concepts in general, leading into UNIX and the UNIX environment. It covers
    the topics necessary for the UNIX to function independently and do most of the
    everyday, routine jobs. It also gives readers a good base of knowledge so they
    can move to more advanced courses or books.


    I wrote this book relying mostly on my experience as a UNIX teacher. The organization
    of the chapters is what I follow, and the examples are what I usually use in UNIX
    classes. This book is an introductory book, but not a simple book. I did not try
    to change the technical aspect of the material to make the storytelling of explanation,
    nor did I use irrelevant stories to make the material more interesting. As I have
    promised my students, I have not used the word *obviously* in the sense of meaning
    the material is simple or obvious that I did not need any explanation.


    The chapters are short, and in cases where the extent of coverage of a topic requires
    more pages, the material is presented in two chapters. As much as possible, the
    format of the chapters is the same. However, consistency is sacrificed when the
    format does not serve as an appropriate vehicle for presenting


    Each chapter starts with a general explanation of concepts and topics. Simple
    concrete examples clarify the explanations or how to use the commands, followed
    by more detailed and complex commands as the chapter progresses. Each chapter
    ends with questions, a review section, and, when appropriate or necessary, practical
    exercises for using a terminal are ended.


    Chapter 1 briefly describes the fundamentals of computer hardware and software
    and explains basic computer terms and concepts. It discusses the topics of software
    and moves the emphasis to the system software. It explains the importance of the
    operating system and explores its primary functions.


    Chapter 2 presents a brief history of the UNIX operating system. It explores the
    development of UNIX over the years, discusses the major UNIX versions, and explores
    some of the system''s important features.


    Chapter 3 explains how to start and end a UNIX session. Simple UNIX commands are
    introduced, and their applications are explained. The process of establishing
    contact with UNIX is explored, and some internal UNIX operations are discussed.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Preface


    Chapter 4 is the first of the two chapters that cover the UNIX operating system
    editor. After a brief discussion of the editors that are supported by UNIX, the
    vi editor is introduced, and the rest of the chapter presents the basic commands
    necessary to do a simple editing job.


    Chapter 5 is the first of two chapters that discuss the file structure of the
    UNIX system. It covers the basic concepts of files and directories, and their
    arrangement in a hierarchical tree structure. It presents commands that facilitate
    the manipulation of the file system.


    Chapter 6 is the second chapter about the vi editor. It shows the vi editing power
    and flexibility by covering the more advanced vi commands, and explains various
    ways the vi editor can be customized.


    Chapter 7 is the second chapter about the UNIX file system it presents file manipulation
    commands, explains the shell input/output operators, and introduces files substitution
    metacharacters.


    Chapter 8 covers the shell and its role in the UNIX system. It explains the shell
    features and capabilities, the shell variables, and the shell metacharacters.
    Startup process and process management under UNIX are also covered.


    Chapter 9 concentrates on the UNIX communications utilities. It explains the UNIX-mail
    facilities and shows the commands and options available. It discusses the shell
    and other variables that affect the e-mail environment. It shows how to make a
    startup file that customize of the e-mail utilities.


    Chapter 10 discusses the essentials of program development. It explains the steps
    in the process of creating a program. It gives an example of a simple program
    and walks through the process of writing the source code and creating an executable
    program.


    Chapter 11 concentrates on shell programming. It explains the capabilities of
    the shell as an interpretive high-level language. It covers shell programming
    constructs and particulars. It shows the creation, debugging, and running of shell
    programs.


    Chapter 12 builds on the commands and concepts of the previous chapter and covers
    more of the shell programming commands and techniques. It also presents a simple
    application program and shows the process of developing programs using shell language.


    Chapter 13 presents a few additional UNIX commands. Disk commands, file manipulation
    commands, and security are the major topics of this chapter.


    Appendix A is a quick index to the commands covered in this book. The commands
    are listed in alphabetical order.


    Appendix B is an index to the commands, categorized according to their functions.


    Appendix C is a summary of the commands and their options presented in tables
    at the end of the chapters.


    Appendix D is a summary of the vi editor commands.


    Appendix E is a table of the ASCII commands.


    Appendix F is a list of some of the books I''ve evaluated.


    # New to this Edition


    This second edition of UNIX Unbounded: A Beginning Approach includes new features
    and commands (mostly from the Korn shell). As my colleagues have advised, the
    structure, level, and goals of the book have not changed. Some'
  merge: -1
  pgno: 17
