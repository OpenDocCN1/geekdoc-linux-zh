  md: '# Data Representation


    We are accustomed to using the decimal numbering system. The decimal system (base
    10) consists of ten digits that range from 0 to 9. On the other hand, computers
    work with a binary system (base 2) that consists of 2 digits, 0 and 1.


    **Binary Digital)** Each bit can hold either a 0 or a 1. A *bit* is the smallest
    unit of information a computer can understand.


    **Byte** Computer memory must be able to store letters, numbers, and symbols,
    and a single bit by itself cannot be much of use. Bits are combined to represent
    some meaningful data. A group of eight bits is called a *byte* (pronounced *bite*),
    and it can represent a character. A character could be an uppercase or lowercase
    letter, a punctuation mark, or a special symbol.


    ASCII When you input data to a computer, the system must change from what you
    recognize (letters, numbers, and symbols) into some format that the computer understands.
    The American Standard Code for Information Interchange (ASCII, pronounced *ask-ee*)
    is one of the coding schemes used to represent characters in eight-bit bytes.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_29_0.png)


    The ASCII code can represent a maximum of 256 characters, including all uppercase
    and lowercase letters, numbers, punctuation marks, and special symbols.

    Bytes are fine for storing characters but are too small to hold large numbers.
    In fact, 256 is the largest number that can be stored in one byte. Certainly,
    to be of any use, computers need space for large numbers. Most computers are able
    to manipulate a group of bytes called a word. The word size is system dependent
    from 16-bit (2 bytes) to 32-bit (4 bytes) or even 64-bit (8 bytes).


