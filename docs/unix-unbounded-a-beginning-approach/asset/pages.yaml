    # 6.1.2 Using the vi Invocation Options


    The vi editor provides flexibility from the very start. You can invoke vi with
    certain invocation options that you type as part of the command line.


    **The Read-Only Option - -R** (for read-only) option makes a read-only file and
    allows you to step through the contents of the file without making accidental
    changes. To use this option with the myfirst file, type vi -R myfirst and press
    [Return]. The vi editor shows the following message on the bottom line of the
    screen:


    > "myfirst" [Read Only] 3 lines, 106 characters


    If you try to save the read-only file using the :w or :wq command, vi displays
    the following message:


    > "myfirst" File is read only


    **The Command Option -c** (for command) option allows you to give vi commands
    as part of the command line. This is useful to position the cursor or search for
    a pattern in a file before you begin editing. To use this option with the myfirst
    file, type vi -c /most first and press [Return]. You are giving a search command
    (/most) as part of the command line. The vi editor copies the myfirst file into
    the temporary work buffer and places the cursor on the line with first occurrence
    of the word.


    # 6.1.3 Editing Multiple Files


    You can start and give it a list of filenames instead of one filename. Then, when
    you finish editing one file, you start the next file without reinoking the vi
    editor. Press :[:n] (for next) to invoke the next editing file. When you issue
    the :n command, it replaces the contents of the working buffer with text from
    the next file. However, if you have modified the current text, vi displays a message:'
