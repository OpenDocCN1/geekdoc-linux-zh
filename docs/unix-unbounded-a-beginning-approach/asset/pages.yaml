    # 6.6.3


    # Line Length and Wraparound


    Your terminal screen usually has 80 columns. When you type text and reach the
    end of the line (pass the 80th column), the screen starts a new line; that is
    what called wraparound. The screen also starts a new line when you press [Return].
    Thus, the length of a line on the screen could be any length from 1 to 80 characters.
    However, the vi editor starts a new line in your file only when you press [Return].
    If you type 120 characters before pressing [Return], your text appears in two
    lines, on the screen but in your file it is one line of 120 characters; it is
    confusing to relate the number of lines on the screen to the actual number of
    lines in the file. The simplest way to limit the length of a line is by pressing
    [Return] any time reaching the end of the line on the screen. Another way to limit
    the length is to set the wraargin parameter and let the vi editor insert returns
    automatically.


    wraparound Option *The wraparound option allows the vi editor to break the line
    that you are entering when it reaches a specified number of characters from the
    right. To set the wraparound to 10 (where 10 is the number of characters from
    the right side of the screen), type :set wraparound=10 and press [Return]. Then,
    when you are reaching columns 70 (80 minus 10), the vi editor starts a new line,
    just as you had pressed [Return]. If you are typing a word as the pass column
    70, vi moves the whole word to the next line. This means the right margin will
    be perhaps uneven. Remember, the vi is not a formatter or a word processor.


    The default value for the wraparound option is 0 (zero). To turn wraparound off,
    type :set wraargin=0 and press [Return]


