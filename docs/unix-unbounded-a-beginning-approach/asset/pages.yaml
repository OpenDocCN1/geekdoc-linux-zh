    # 6.4


    # USING BUFFERS IN vi


    The vi editor has several buffers used for temporary storage. The temporary buffer
    (work buffer) holds a copy of your file as discussed in chapter 3, and when you
    use the write command, the contents of this buffer are copied to a permanent file.
    There are two categories of temporary buffers, numbered buffers (or alphabetic
    buffers), that you can use for storing your changes and later retrieving them.'
