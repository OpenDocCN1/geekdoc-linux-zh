    # 8.7 UNIX PROCESS MANAGEMENT


    In chapter 3, we introduced the process of booting the system. Now let''s go deeper
    into the UNIX internal process and see how it manages the running of programs.


    In this chapter, you have encountered the word process here and there. The execution
    of a program is called a process: you call it a program, but when your program
    is loaded into the memory for execution UNIX calls it a process.


    In order to keep track of the processes in the system, UNIX creates and maintains
    a process table for each process in the system. Among other things, the process
    table contains the following information:


    +   * Process number

    * Process status (ready/waiting)

    * Event number that the process is waiting for

    * System data address area


    A process is created by a system routine called fork. A running process calls
    fork, and in response UNIX duplicates that process, creating two identical copies.
    The process that calls the fork routine is called the parent, and the copy of
    the parent by fork is called the child. UNIX differentiates between the parent
    and the child by giving them different process IDs (PIDs).


    The following steps are involved in managing a process:


    +   * The parent calls fork, starting the process.

    * Calling fork is a system call. UNIX gets control, and the address of the calling
    process is recorded in the process table''s system data area. This is what is
    called the return address, so that the parent knows where to start when it gets
    control again.

    * fork duplicates (copies) the process and returns to the parent.

    * The parent receives the PID of the child, a positive integer number, and the
    child receives the return code zero. (A negative code indicates an er-'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# UNIX UNBOUNDED: A BEGINNING APPROACH


    +   - The parent receiving a positive PID calls another system routine called
    wait and goes to sleep. Now the parent is waiting for the child process to finish
    (in UNIX terminology, waiting for the child to die).


    +   - The child process gets control and begins to execute. It checks the return
    code; because the return code is zero, the child process calls another system
    routine exec. The exec routine responds by overlaying the child process with the
    new program.


    +   - The new program''s first instruction is executed. When the new program gets
    to the end of the instruction, it calls another system routine called exit, and
    the death of the child awakens the parent, and the parent takes over.


    This process is depicted in figures 8-15 through 8-18. An example is in order
    to shed some light on this apparently confusing process. Imagine that the shell
    (sh process) is running, and you type a command, say is. Let''s explore the steps
    UNIX takes to run your command.


    The shell is the parent process, and when created, the ls process becomes the
    child process. The parent process (shell) calls fork. The fork routine duplicates
    the parent (shell) process, and if the creation of the child process is successful,
    assigns the child process a PID and adds it to the system process table. The parent
    receives the child PID, the child receives code zero, and control is-


