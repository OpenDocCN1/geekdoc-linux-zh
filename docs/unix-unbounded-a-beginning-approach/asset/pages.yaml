    turned to the parent. The shell calls the wait routine and goes to the wait state
    (goes to sleep). Meanwhile, the child gets control and calls exec to overlay the
    child process area with the new program—in this case Is, the command typed. Now
    Is carries out the command. It lists your current directory filenames and when
