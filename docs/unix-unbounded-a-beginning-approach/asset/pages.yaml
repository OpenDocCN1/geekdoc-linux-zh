- img_proc: true
  md: '# 2.2.5 UNISWARE


    applications and tools available with Solaris 2.4, including the graphic user
    interface.


    The Novell version of UNIX was based on UNIX System V and was marketed as UnixWare.
    Novell sold UnixWare to the Santa Cruz Operation, and UnixWare and its related
    products are now offered by SOC. There are two versions of UnixWare: UnixWare
    Personal Edition, which is designed for desktop use, and UnixWare Application
    Server, which is used on servers. UnixWare is available only for Intel-based computers,
    and there are many applications available for it.


    # 2.3 Overview of the UNIX Operating System


    As explained earlier, a typical computer system consists of the hardware, the
    system software, and application software. The operating system is system software
    that controls and coordinates the activities of the computer. Like other operating
    systems, the UNIX operating system is a collection of programs that includes text
    editors, language compilers, and other system utility programs.

    Figure 2–1 shows the UNIX system architecture. The UNIX operating system is implemented
    in a layered-style software model.

    Kernel The UNIX kernel, also called the base operating system, is the layer that
    manages all the hardware-dependent functions. These functions are spread over
    a number of modules within the UNIX kernel. The kernel layer consists of modules
    closest to the hardware that are for the most part protected from the application
    programs. Users have no direct access to it.


    +   1. The utility programs and UNIX commands are not part of the kernel.

    2. A user''s application programs are protected from inadvertent writes by other
    users.


    Figure 2–1

    The UNIX system components.


