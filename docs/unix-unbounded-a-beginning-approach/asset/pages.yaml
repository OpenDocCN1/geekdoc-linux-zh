  md: '# Table 5–2

    The file''s permission characters.


    | Key | Permission Settings |

    | [r] | Read permission granted. |

    | [w] | Write permission granted. |

    | [x] | Execute permission granted (permission to run the file as a program).
    |

    | [-] (hyphen) | Permission is not granted. |


    +   1. The execute permission (x) makes sense if the file is an executable file
    (a program).

    2. If a hyphen appears instead of a letter, then permission is denied.

    3. If the file is a directory file, then x is interpreted as permission to search
    the directory for a specific file.


    Each set of letters grants or denies permission to a different group of users.
    The first set of the rwx letters grants read, write, and execute permission to
    owner (user), the second rwx is for group, and the third one is for others. By
    setting the access letters for different groups of users, you can control who
    have permission for your files and what type of access they. For example, suppose
    you are in david directory, and you issue the following command:


    ```

    $ ls -l myfirst [Return]

    -rwx------ 1 david  student  342 Jun 25 12:28 myfirst

    ```


    The output shows that myfirst is an ordinary file since the first character is
    a hyphen. The first group of letters (rwx) means the owner has read, write, and
    execute permission. The second group of letters (--) means the group has read
    and write permission, but execute permission is denied. The last three characters
    (---), three hyphens, show that others are denied all access rights.


    The second column shows a number that indicates the number of links. Links (in
    command) are discussed in chapter 7. In our example the number of links for myfirst
    is 1.


    The third column shows the owner of the file. Usually this name is the same as
    the user id of the person who created it, in this case, david.


    The fourth column shows the user group. Every UNIX user has a user id and a group
    id. Both are assigned by the system administrator. For example, people who are
    working on a project get the same group id. In our example the file''s group is
    student.


    The fifth column shows the file size. This is the number of bytes (characters)
    in the file. In our example, the file size is 342 bytes.


    The sixth column shows the date and time of the last modification. In our example,
    myfirst was last modified on Jun 25, 12:10.'
