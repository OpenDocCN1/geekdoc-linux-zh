    # 9.5 CUSTOMIZING THE MAILX ENVIRONMENT


    You can customize the mailx environment by setting the mailx variables in the

    .mailrc file. To define these variables, you use the mailx set command. The

    mailx command also recognizes some of the shell''s standard variables.'
  merge: -1
