    # 8.6 THE KORN SHELL (ksh)


    In chapter 3 the Korn shell (ksh) was introduced. Here, a few features of ksh
    that are different from sh are explained.


    # 8.6.1 The Korn Shell (ksh) Variables


    The Korn shell (ksh) uses many of the variables used by the standard shell (sh).
    You can define variables, redefine them, get their values, and in general manipulate
    variables to customize your environment just like the sh shell. The following
    are some important variables that are used only by the Korn shell:


    ENV variable is to set the absolute pathname of the environment file that is read
    by ksh at startup. In the following example ENV ($HOME/mine/my_env) is set to
    the path-name that tells ksh where to find the environment file.


    ```

    ENV=$HOME/mine/my_env

    ```


    HISTSIZE The HISTSIZE variable is set to the number of commands you in-tend to
    keep in your commands history list. The default size is 128 but you can set it
    to any number of entries you wish. For example, the following command line sets
    the number of entries in your history file to 100.


    ```

    HISTSIZE=100

    ```'
