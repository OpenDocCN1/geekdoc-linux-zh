    # And Some Final Words


    The three commands cp, mv, and In all affect the filenames and work in a similar
    manner, but they are different commands and are used for different purposes:


    +   - cp creates a new file.

    - mv changes the filename or moves files from one place to another.

    - In creates additional names (links) for an existing file.


    # 7.4.4 Counting Words: The wc Command


    You can use the wc command to find out the number of lines, words, or characters
    in a file or a list of specified files.

    The following command sequences show the output of the wc command, assuming you
    have myfirst file in your current directory.


    First display the contents of myfirst. Show the number of lines, words, and characters
    in it.


    > $ wc myfirst [Return] ... Display the contents of myfirst.

    I wish there were a better way to learn

    UNIX. Something like having a daily UNIX pill.

    However, for now, we have to suffer and read all these boring UNIX books.

    $ wc myfirst [Return] ... Count the number of lines, words and characters in myfirst.

    4 30 155 myfirst

    $_ ... Ready for the next command.


    The first column shows the number of lines, the second column shows the number
    of words, and the third column shows the number of characters.


    > A word is considered a sequence of characters with no white space (space or
    tab character). Therefore, what is one word, and what ? counts as two words.


    If no filename is specified, then wc gets its input from the standard input device
    (keyboard). You signal the end of the input by pressing [Ctrl-d], and wc shows
    the results on the screen.


    Use the wc command to get the count of input from the keyboard.


    > $ wc [Return] ... Invoke the wc command with no-filename.

    - The sign is the prompt indicating that the shell is waiting for the rest of
