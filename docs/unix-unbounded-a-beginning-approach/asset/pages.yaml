  md: '# The sh Command


    You can use the sh command with one of its options to make the debugging of your
    script files easier. For example, the -x option causes the shell to echo each
    command it executes. This trace of your script execution can help you to find
    the whereabouts of the bugs in your program.


    # sh Options


    Table 11–8 summarizes the sh command options, and the following examples show
    how to use them.

    If you want to debug the BOX script file, you type the following:


    ```

    $ sh -x BOX [Return]

    ```


    You can also place the sh options as commands in your script file. Use the set
    command and type the following line at the beginning of your file, or place it
    wherever you want the debugging to start.


    ```

    -x

    ```


    -x Option The -x option shows the commands in your script file as they look after
    the parameter and command substitutions have taken place. Using the sh command
    with the -x option, let''s execute the BOX script file in different ways and explore
    the possibilities.


    Run BOX with sh -x option, but not specify command line arguments.


    +   $ sh -x BOX[Return] . . . . . . . . . . . . Use the -x option.

    + echo The following is the output of the BOX script.

    The following is the output of the BOX script.

    + echo Total number of command line arguments: 0

    Total number of command line arguments: 0

    + echo The first parameter is:

    The first parameter is:

    + echo The second parameter is:


    Table 11–8

    The sh command options.


    | Option | Operation |

    | --- | --- |

    | -n | Reads commands but does not execute them. |

    | -v | Shows the shell input lines as they are read. |

    | -x | Shows the commands and their arguments as they are executed. |'
