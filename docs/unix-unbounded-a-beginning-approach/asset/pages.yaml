    # Leaving the vi Editor


    There is only one way to enter vi, but there are several ways to leave it. The
    vi editor gives you a choice depending on what you intend to do with your file
    editing. Table 4-5 summarizes the vi quit commands.


    **The :wq Command** Most of the time, you use the :wq command at the end of an
    editing session. This saves the file and exits the vi. UNIX displays the :Prompt,
    indicating that the shell has returned. The ZZ command (uppercase z) works just
    the same: it saves your file and quits the vi editor.


    **The :q Command** You use the :q to look at the contents of a file without doing
    any editing and exit the vi editor. However, if you have changed something in
    your file and use the command to exit, vi responds by showing the following message
    at the bottom line on the screen—typically terse UNIX message—and the vi remains
    on the screen:


    No write since last change (:q overrides).


    **The :q! Command** If you change something in a file and then decide not to save
    the changes, use the :q! to leave the vi editor. In this case, the original file
    remains intact and changes are abandoned.


    **The :w Command** Use the :w command to save your file periodically during the
    course of a long editing session and to prevent losing your work accidentally.


