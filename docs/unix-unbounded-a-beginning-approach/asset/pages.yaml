  md: '# 7.1.3


    # Specifying Page or Line Number


    You can specify a page number or line number from the beginning of the file or
    relative to the current page number. Use unsigned integers to indicate that the
    reference is relative to the beginning of the file. For example, type 10 to go
    to page 10, or 601 (that''s six, zero, lowercase letter l) to go to line 60 in
    the file.


    Use signed integers to indicate that the reference is relative to the current
    page. For example, type +10 to move forward 10 lines, or type -301 (three, zero,
    lowercase letter l) to move back 30 lines. If you use only + or - without any
    numbers, the command is interpreted as +1 or -1, respectively.


    These operators are applicable only while you are viewing your file and pg is
    displaying the prompt sign.


    > > If you use pg with the -n option, then you do not need to press [Return] for
    single-letter operators.


    # SHELL REDIRECTION


    One of the most useful facilities that shell provides is the shell redirection
    operators. Many UNIX commands take input from the standard input device and send
    the output to the standard output device. This is usually the default setting.
    Using the shell redirection operators, you can alter where a command gets its
    input and where it sends its output. The command''s standard (default) input/output
    device is your terminal.


    The shell redirection operators allow you to do the following things:


    +   - Save the output of a process in a file.

    - Use a file as input to a process.


    +   1. A process is any executable program. This could be an appropriate shell
    command, an application program, or a program you have written.


    +   2. The redirection operators are instructions to the shell and not part of
    the command syntax. Accordingly, they can appear anywhere on the command line.


    +   3. Redirection is temporary and effective only with the command using it.


    # Output Redirection


    Redirection allows you to store the output of a process in a file. You can edit
    it, print it, or use it as input to another process. The shell recognizes the
    greater sign (>) and double greater than sign (>>) as output redirection operators.


    The format is as follows:


    ```

    command > filename

    ```'
