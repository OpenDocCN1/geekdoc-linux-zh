    # 7.4 FILE MANIPULATION COMMANDS


    Some of the file manipulation commands were discussed in chapter 5. From that
    discussion, you know how to create directories (using the mkdir command), create-files
    (using the vi and cat commands), and delete files and directories (using the rm
    and rdir commands). Here are a few more commands to increase your knowledge of
    file manipulation in UNIX. These commands are used to copy (cp), link (in), and
    move (mv) files. The general format of these commands is as follows:


    ```

    command source target

    ```


    where command is any of the three commands, source is the name of the original
    file, and target is the name of the destination file.


    # 7.4.1 Copy Files: The cp Command


    The cp (copy) command is used to create a copy (duplicate) of a file. You can
    copy files from one directory to another, make a backup copy of a file, or just
    copy files for the fun of it!


    Suppose you have a file REPORT in your current directory and want to create a
    copy of it. To do so, you type cp REPORT REPORT.COPY and press [Return].


    REPORT is the source file and REPORT.COPY is the target file. If you do not provide
    the correct pathname/filename for the source or target file, cp complains by showing
    a message similar to the following:


    ```

    File cannot be copied onto itself

    file(s) copied

    ```


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_179_0.png)


    Figure 7–2 shows your directory structure before and after application of the
    cp command.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_179_1.png)


    If the target file already exists, then its contents are destroyed.


    # cp Options


    Table 7–4 summarizes the cp command options.


    -i Option protects you from overwriting an existing file. It asks for confirmation
    if the target file already exists. If your reply is yes, it copies the source
    file, overwriting the existing file. If your answer is no, it quits, and your
    existing file remains intact.'
