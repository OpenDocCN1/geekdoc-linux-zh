    message.

    ```


    The feedback message indicates the size of first.mail: It contains 3 lines and
    115 characters.


    The -w is used to save the currently composed message in the specified file first.mail.
    This is a good habit to practice so that you have a copy of transmitted messages.
    If you set the mailx record variable, then your outgoing mail is automatically
    saved.


    ```

    -q [Return] ................................................................ Quit
    mailx input mode.

    $ ................................................................................
    Back to the shell.

    ```


    Using ~q to quit mailx input mode saves your partially composed message in a file
    called dead.letter in your home directory (or any filename assigned to the DEAD
    variable).


    Let''s start and complete the sending of your mail. At this scenario this is:
    you david and you want to send mail to yourself. You have a copy of your message
