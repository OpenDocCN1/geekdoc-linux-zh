    # Relational Operators


    The expr command provides relational operators that work on both numeric and nonnumeric
    arguments. If both or more arguments are numeric, the comparison is numeric. If
    both arguments are nonnumeric, the comparison is nonnumeric and uses the ASCII
    values. The relational operators are:


    +   - = equal to

    - != not equal to

    - < less than

    - <= less than or to

    - > greater than

    - >= greater than or equal to


    +   1. The expr command displays 1 when the comparison is true.

    2. The expr command displays 0 when the comparison is false.


    The following command sequences show the use of the expr command with the relational
    operators.


    $ expr Gabe = Gabe [Return] ................... Alphabetic comparison

    1 ................................................................ Displays 1,
    indicating true.

    $ expr Gabe = Daniel [Return] ................ Alphabetic comparison.

    0 ................................................................ Displays 0,
    indicating false.

    $ expr 10 \< 20 [Return] ................. Numeric comparison.

    1 ................................................................ Displays 1,
    indicating true.'
