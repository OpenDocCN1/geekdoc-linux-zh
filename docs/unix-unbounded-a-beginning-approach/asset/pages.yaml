  md: '# UNIX Communication


    Send first.mail to david using the input redirection sign (<) on the command line.


    ```

    $ mailx david < first.mail [Return] .. Send mail.

    $ ................................................ Done.

    ```


    The < sign directs the shell to pass the specified filename (first.mail) to the
    mailx command.


    You can specify more than one input file.


    By default, the Bourne shell checks every ten minutes for your new mail, so you
    have to wait a while before you can read the mail you just sent to yourself. When
    there is new mail in your mailbox, UNIX displays the message you have mail before
    the next prompt.


    To send first.mail to david using the tilde escape command, do the following:


    ```

    $ mailx david [Return] ........................ Send mail to yourself.

    Subject: ............................................ Ready for you to type your
    message.

    <- first.mail [Return] ................ Read in the first.mail.

    "first.mail" 3/115 ............................ Feedback message.

    [Ctrl-d] ............................................ Transmit it.

    EOT ................................ mailx shows EOT.

    $ ................................................ Back to the shell.

    ```


    The ~ < reads in the specified file, in this case first.mail, and adds its contents
    to the message you are currently composing. You can also use the ~ r command to
    achieve the same results.


