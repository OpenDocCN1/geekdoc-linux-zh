    # Invisible Files


    A filename beginning with a period refers to an invisible file or a hidden file
    directory listing commands normally do not display them. Startup files are usually
    invisible (named with the dot at the beginning) so that they do not clutter your
    directory. (Startup files are discussed in chapter 7).


    You can create your own invisible file at home, or any other subdirectories you
    wish. Just start the file name with [.]. Two special invisible entries, a single
    and double dot (. and ..), appear in every directory except the root directory.


    The . and .. Directory Entries The mkdir (make directory) command automatically
    puts two entries in every directory you create. They are a single and double period,
    representing the current and one level higher directories respectively. Using
    the parent and child analogy, dot (.) represents the parent directory and dot
    (..) the child directory.


    These directory abbreviations can be used in UNIX commands to refer to the parent
    and current directories when the pathname is required.


