  md: '# UNIX UNBOUNDED: A BEGINNING APPROACH


    After you quit mail using q, you can no longer use the undelete command to restore
    deleted messages, so make sure that you have deleted only the messages you intended
    to delete before you quit mail.


    # 9.4.3 Ways to Save Your Mail


    The mailx command saves your messages in a specified file while you are reading
    them. You can save all your messages, a single message, or a range of messages.
    Let''s look at some examples. The scenario remains before: david is your login
    name, and there are three messages in your system mailbox.


    ```

    $ mailx [Return] Read your mail.

    ```


    ```

    mailx version 4.0 Type ? for help.

    > /usr/student/mail/david": 3 messages 3 new

    > N 1 daniel Thu Sep 30 12:26 6/103 Room

    > N 2 susan Thu Sep 30 12:30 6/107 Project

    > N 3 marie Thu Sep 30 13:30 6/109 Welcome

    ```


    ```

    $ s mfile [Return] Appends the current message to mfile.

    "mfile" [New file] 12/86 Feedback message.

    ```


    The s command saves your indicated message in the specified file. At this point
    mfile contains your current message, message 1, indicated by the > sign.


    ```

    ? s 2 3 mfile ...... Append messages 2 and 3 to mfile.

    "mfile" [Appended] 18/286 ...... Feedback message.

    ? s 1-3 mfile [Return] ...... Append messages 1 through 3 to mfile.

    "mfile" [Appended] 18/286 ...... Feedback message.

    ? x [Return] ...... Exit: mailbox remains the same.

    $_ Back to the shell prompt.

    ```


    At this point, all your messages are appended to mfile. You can use the mailx
    command option -f to read your mail from mfile.


    +   1. Do not confuse mailx command option -f (to which you add a filename to
    read a specified file) with mailx command option f (which displays only the headline
    of the current message).

    2. Do not confuse mailx command option -s (which sets the subject field to the
    specified characters) with mailx command option s (which saves your messages in
    the specified file).


    # 9.4.4 Ways to Send a Reply


    You can send a reply to the sender of a message while reading your mail. It is
    convenient because you can send a reply right after you read a message.'
