    # Pattern Search: Using [/] and []


    The vi editor provides operators to search for a file for a specified pattern.
    The forward slash [/] and question mark [?] are the keys used to search forward
    and backward, respectively, through file. If you are editing a file, you can also
    use these operators to position the cursor at a specific place in the file. For
    example, if you want to look for the word UNIX in your file, press [Esc] (to make
    sure vi is in command mode) and type /UNIX and press [Return].


    When you press [/], vi shows / at the bottom of the screen and waits for the rest
    of the command. After you press [Return], the vi editor starts searching for the
    character string UNIX from the current position of the cursor. If the character
    UNIX is present in your file, vi positions the cursor on the first occurrence
    of it.


    You can move the cursor to the next occurrence of UNIX (or whatever word you are
    looking for) by pressing [n] (for next). Every time you press [n], vi shows the
    next occurrence of the pattern you are searching for, until the vi editor reaches
    the end of the file. Then it goes back to the beginning of the file and continues
    the process.


    If you prefer to search backward through the file, type ?UNIX and press [Return].
    The vi editor continues to search backward as long as you press [n] after each
    finding of the word UNIX.


    # Repeating of the Previous Change: Using [].


    The [.] key is used in the command mode to repeat the most recent previous text
    changes. This feature is quite useful when you want to do a lot of repetitive
    changes in a file.


    To experiment with [], try the following:


