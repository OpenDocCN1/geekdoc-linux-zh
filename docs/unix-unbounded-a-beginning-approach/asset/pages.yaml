    # 7.6.2


    # Displaying the End of a File: The tail Command


    You can use the tail command to display the last part (the tail end) of a specified
    file. The tail command gives you a quick way to check the contents of a file.

    For example, to display the last part of the file called MEMO in your current
    directory, you type the following:


    ```

    $ tail MEMO [Return]

    ```


    By default, tail shows the last 10 lines of the specified file. You can override
    the default value by using one of the available options.

    tail Options The tail options are summarized in table 7–9, and they cause the
    tail command to count by blocks, characters, or lines.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_196_0.png)


    +   1. If a plus sign precedes the option, tail counts from the beginning of the
    file.

    2. If a hyphen precedes the option, tail counts from the end of the file.

    3. If a number precedes the option, tail uses that number instead of the de-ten
    lines count.


    The following command sequences demonstrate the use of the tail command.


    ```

    $ tail MEMO [Return] ......................... Display the last 10 lines (no option).

    $ tail +1 MEMO [Return] ....................... Display the last 10 lines (+1).

    $ tail -4 MEMO [Return] ....................... Display the last 4 lines (-4).

    $ tail -10c MEMO [Return] ................ Display the last 10 characters (-10c).

    ```


    You can specify only one filename as an argument.


