  md: '# 13.3.1


    # Creating Your Own Spelling List


    On most UNIX systems, you can create your own dictionary file that supplements
    the standard dictionary with additional words. For example, you can create a file
    that contains the correct spellings of the special words and terms that are specific
    to your site or project. Using the plus option, you specify your dictionary file
    on the command line. The spell command first checks its dictionary against your
    file. You can use the vi editor to create your own spelling list.


    +   1. Each word in your dictionary file must be typed on one line.

    2. Your dictionary file must be sorted alphabetically.


    Assuming you have created your own dictionary file called my_own, specify that
    file on the command line using the plus option.


    ```

    $ spell +my_own BIG_FILE > MISSPELLED_WORDS[RETURN]

    ................ Prompt.

    ```


    The +my_own indicates you want to use your own dictionary file called my_own.
    The spell command lists the words that are not found in either of the two dictionary
    files, its own and yours. The output is redirected into the MISSPELLED WORDS file.


    Scenario The default spelling list (dictionary) doesn''t contain the shell commands
    or other UNIX words. Therefore, if you have words like grep and mkdir in your
    text, they are displayed as suspicious words.

    You can create a file similar to the one depicted in figure 13–5, which contains
    the shell commands or UNIX words with correct spelling.


    Run the spell command with and without your spelling list.


    ```

    $ spell +U_DICTIONARY [Return] ............ With your spelling list.

    gre p pwd mkdir is [Return] .......................Your input.

    ```'
