    # 11.4.2 Arithmetic Operations (ksh): The let Command


    You can use the let command for dealing with integer arithmetic. The let command
    is a simpler alternative to the expr command and includes all the basic arithmetic
    operations, including addition, subtraction, multiplication, and division. For
    example:


    ```

    $ x= 100 [Return] . . . . . . . . Initialize x to 100.

    $ let x=x+1 . . . . . . . . . Add one to x.

    $ echo $x . . . . . . . . . . . . Display x value.

    101

    $ let y=x*2 [Return] . . . . Use let command for multiplication.

    echo $y . . . . . . . . . . . . . . . Display y value.

    202

    $ .

    ```


    +   1. The let command automatically uses the values of the variables. In the
    above example, the value of the variable x is obtained by typing x instead of
    $x.

    2. The let command interprets the * and % signs as the multiplication and remainder
    operators respectively, and there is no need to use the \* or \% to prevent their
    special meanings.


