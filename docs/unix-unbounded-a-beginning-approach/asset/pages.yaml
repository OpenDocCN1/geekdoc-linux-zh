    ```


    # 9.3. Mailing Existing Files


    You do not have to compose your messages using the mailx editor at all. Maybe

    You have a memo already written that you want to send to another user. In that

    case, you use the shell input redirection operator to redirect the mailx input

    default input device (the keyboard) to the mailbox of the person you want to

    receive the file.


    Send a file called memo to Daniel, whose user ID is daniel.


    ```

    $ mailx daniel < memo [Return] . . . . . Mail memo to daniel.

    $_ . . . . . . . . . . . . . . . . . . . . . Back to the shell.

    ```


    Assuming that your message is in a file called memo and you want to send it to

    the user ID daniel, the above command will do the job.


    # 9.3.2 Sending Mail to a Group of Users


    What if you want to send your memo file to Daniel and a few others? It would

    very inconvenient to type the mailx command to send the same message to

    ten different users. In that case, you specify a list of the user IDs of the people

    you intend to receive the mail, and mailx sends the mail to all of them.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_281_0.png)'
