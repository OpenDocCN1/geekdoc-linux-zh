  md: '# Chapter 11


    # Shell Programming


    # 293


    # 11.1


    # UNDERSTANDING UNIX shell PROGRAMMING LANGUAGE: AN INTRODUCTION


    Command languages provide the means for writing programs using a sequence of commands,
    the same commands that you type at the prompt. Most of today’s command languages
    provide more than just the execution of a list of commands. They have features
    that you find in traditional high-level languages, such as looping constructs
    and decision-making statements. This gives you a choice of programming in high-level
    languages or command languages. Command languages are interpreted languages, unlike
    compiled languages such as C and FORTRAN. Programs written in a command language
    are easier to debug and modify programs written in compiled languages. But you
    pay a price for this convenience: these programs typically take much longer to
    execute the compiled ones.


    The UNIX shell has its own built-in programming language, and all shells (Bourne,
    C shell, etc.) provide you with this programming capability. The shell language
    is a command language with a lot of features common to many computer programming
    languages, including the structured language constructs: sequence, selection,
    and iteration. Using the shell programming language makes it easy to write, modify
    and debug programs, and this language does not need compilation. You can execute
    a program as soon as you finish writing it.


    The shell programs are called procedures, shell scripts or simply scripts. A script
    is a file that contains a series of commands for the shell to execute. As you
    execute a shell script, each command in the script is passed to the shell to execute,
    one at a time. When all the commands in the file are executed, or if an error
    occurs, the script ends.


    You do not have to write shell programs. But, as you use UNIX, you will find that
    you want to write small scripts to perform functions you want to do UNIX does
    not have a command for or perform several commands simultaneously. UNIX commands
    are numerous, difficult to remember, and involve a lot of typing. If you do not
    want to have to remember all that strange UNIX syntax, or if you are not a good
    typist, then you may want to write scripts.


    > The cat command is used to display most of the script (program) files on the
    screen. You can use vi to create these files. Also, you can use the cat command
    to create any one of these files quickly. Remember, the cat command is


    for creating small files with few lines of code.


    # 11.1.1


    # Writing a Simple Script


    You do not need to be a programmer to write simple script files. For example,
    suppose you want to know how many users are currently on the system.


    The command and output look like this:


    See page xxii for an explanation of the icons used to highlight information in
    this chapter.'
