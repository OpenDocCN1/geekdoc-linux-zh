    # 12.4 MORE COMMANDS


    In the next section, we''re going to put all of our shell programming skills together
    and write an application that consists of more than just one script file. Before
    presenting the scenario for this application program, however, we need to exam-
    ine a few more commands.


    # 12.4.1 Multi-Way Branching: The case Construct


    The shell provides you with the case construct, which enables you to selectively
    execute a set of commands from the list of commands. You can use the if-else construct
    to achieve the same result, but when you have to use many elif else statements
    (more than two or three, for example), the case construct is preferred. Using
    the case construct rather than multiple elif statements is a more elegant way
    to program.


    The syntax of the case construct is as follows:


    ```

    case variable in

    pattern_1)

    commands_1 ;;

    pattern_2)

    commands_2 ;;

    ...

    *

    default_commands ;;

    esac

    ```


    case, in and esac (case typed backward) are reserved words (keywords). The state-
    ments between the case and esac are all called the body of the case construct.

    When your shell executes the case statement, it compares the contents of the variable
    with each of the patterns until either a match is found or the shell reaches the
    keyword esac. The shell executes the commands associated with the matching pattern.
    The default case, represented by *), must be the last case in your program. The
    end of each case is indicated by two semicolons (;;).


    Let''s look at a simple menu program and explore the application of the case construct.
    A menu system provides an easy and simple user interface, and most computer users
    are familiar with the menu systems, and are easy to implement menus in shell scripts.


    You usually expect a menu program to perform the following functions:


    +   - Display the possible options.

    - Prompt the user to select a function.

    - Read the user input.'
