  md: 'The ls command is used to verify the fact that its access mode is changed.
    The u indicates the user access to myfile; the +x indicates that myfile access
    mode is to be changed to executable.


    The following command removes the write access for all other users.


    ```

    $ chmod o-w myfile [Return] ........................ Change myfile mode.

    $_ ...................................................................................
    Prompt.

    ```


    You and members of your group still have read and write access privileges, others
    can only read from your file. (You can use the ls command to verify the changes.)
    The letter o indicates others, and -w indicates that the others do not have write
    access to myfile.


    The following command changes the access privileges for all users (owner, group,
    and other) to read and write.


    ```

    $ chmod a=rw myfile [Return] ...................... Change myfile mode.

    $_ ...................................................................................
    Prompt.

    ```


    Now anyone can read or write to myfile. (Again you can use the ls command to verify
    the changes.) The letter a indicates all users, and =rw indicates read and write
    access.


    The following commands remove all access privileges for the group and other users.


    ```

    $ ls -l myfile [Return] ........................ Display myfile mode.

    - rwx rw- r--  1      david student 64 Oct 18 15:45 myfile

    $ chmod go= myfile [Return] ........................ Change myfile mode.

    there is at least one space between "=" and "myfile".

    ```


    ```

    $ ls -l won [Return] ........................ Check the mode changes.

    - rwx - - - - - 1      david student 64 Oct 18 15:45 won

    $_ ................................................................... Prompt.

    ```


    The owner (in this case) is the only one who has access to myfile. The ls command
    verifies the changes. The go command indicates group and others, so go= indicates
    removal of all access privileges to myfile.


    Returning to your won shell, let''s make it an executable file.


    ```

    $ ls -l won [Return] ........................ Check mode set for won.

    -rw rw- r--  1      david student 64 Oct 18 15:45 won

    $ chmod u+x won [Return] ....................... Change mode.

    ```'
