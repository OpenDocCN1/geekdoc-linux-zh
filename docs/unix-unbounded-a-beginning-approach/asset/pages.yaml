    is necessary so each time you add a new record, it is appended to the end of the
    file and the rest of the records in the file remain intact.


    # Delimiter Character


    The fields in each record are stored in sequential order. However, this method
    of saving makes it difficult to retrieve each field when you want to read and
    display a record. You must designate a field delimiter and separate the fields
    in the record with your selected character. Keys which UNIX uses as separators
    ([Tab], [Return], and [Spacebar]) are not good choices. Remember, the title of
    a book or name of an author may contain space characters. If you choose the space
    char-


