- img_proc: true
  md: 'Only one banner page (first page) is produced for this request. However, each
    file is printed at the top of the page.


    Each print request is associated with an id number. Use the id number to refer
    to the print job, such as when you want to cancel a print request. Table 5–3 shows
    the options you can use to make your print request specific.


    -d Option Your system may be hooked up to more than one printer. Use the -d option
    to specify a particular printer. If the printer is not specified, the default
    printer (the system printer) is used.


    The following command sequence shows an example of the -d option.


    ```

    $ lp -d lp2 myfirst [Return] ................... Print myfirst on lp2 printer.

    request id is lp2-6879 (1 file)

    $ ............................................ Ready for the next command.

    ```


    The names of the printers are not standardized and are different from one installation
    to another:


    -m Option Upon normal completion of your print request, the -m option sends mail
    to your mailbox. (Mail and mailbox are discussed in chapter 9.)


    The following command sequence shows an example of the -m option.


    ```

    $ lp -m myfirst [Return] ................... Print the myfile, and send mail to

    the completion of the print request.

    request id is lp1-6869 (1 file)

    $ ............................................ Ready for the next command.

    ```


    Upon completion of the print request, you receive mail similar to the message
    in your mailbox.


    # Table 5–3

    The lp command options.


    | Option | Operation |

    | -d | Prints on a specific printer. |

    | -m | Sends mail to the user mailbox after completion of the print request. |

    | -n | Prints specified number of copies of the file. |

    | -s | Suppresses feedback messages. |

    | -t | Prints a specified title on the banner page of the output. |

    | -w | Sends a message to the user''s terminal after completion of the print request.
    |'
