  md: '# WAYS TO COMMUNICATE


    UNIX provides an array of commands and capabilities for communicating with other
    users. You can have a simple interactive communication with another user by sending
    and receiving mail through the mail delivery system or broadcast messages to everyone
    on the system.


    Be sure to follow some basic guidelines for communication with other users in
    the system:


    +   - Be polite; do not use profanity.

    - Think before sending. Do not send mail that you may regret later.

    - Save a copy of all your outgoing mail.


    # Using Two-Way Communication: The write Command


    You can use the write command to communicate with another user. This communication
    is interactive, from your terminal to another terminal, the receiving terminal
    must be a logged on user. The message you send appears on the receiver''s screen.
    Then that user can send you by replying with the write command from his or her
    terminal. Using the write command, two users can effectively have a conversation
    with their terminals.


    Let''s follow an example step by step to see how write works. Suppose your user
    ID is david, and you want to chat with Daniel, whose user ID is daniel.


    Type write daniel and press [Return].


    If Daniel is not logged on, you see the message:


    ```

    daniel not logged on.

    ```


    If Daniel is logged on, he sees a message similar to this on his screen:


    ```

    Message from david on (tty06) [Thu Nov 9:30]

    ```


    On your terminal, the cursor is placed on the next line, and the system waits
    for you to type your message. Your message may contain many lines, and each line
    you type is transmitted to Daniel when you press [Return]. You signal the end
    of your message by pressing the [Ctrl-d] key at the beginning of an empty line.
    This terminates your write and sends an EOT (End Of Transmission) message to Daniel.


    Figure 9–1 shows two screens-depicting a typical conversation. The top screen
    is David''s terminal and the bottom one is Daniel''s.


    See page xxii for an explanation of the icons used to highlight information in
    this chapter.'
