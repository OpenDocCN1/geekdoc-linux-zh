  md: '# THE UNIX OPERATING SYSTEM:

    A BRIEF HISTORY


    During the early 1960s, many computers were working in batch mode, running single
    jobs. Programmers had to use punch cards to input their programs and wait for
    the output on the line printer. The UNIX operating system was born in 1969 as
    a response to the frustration of the programmers and the need for new computing
    tools to help them with their projects.


    The UNIX operating system is the brainchild of Ken Thompson and Dennis Ritchie,
    two Bell Laboratories researchers. At the time, Ken Thompson was working on a
    program called Space Travel, a program simulating the motion of the planets in
    the solar system. The program was one of the first operating systems that provided
    a multiuser environment, and ran on a General Electric 6000 Series computer. Thompson
    found a smaller computer and transferred the Space Travel to run on it. The smaller
    computer was a little-used PDP-7, one of the series of machines made by Digital
    Equipment Corporation DEC. and Thompson created a new operating system that he
    called UNIX, and that operating system adopted some of the Multics concepts. Operating
    systems other than Multics existed had more or less the capabilities, and UNIX
    took advantage of the work that had gone into those operating systems by combining
    some of the most desirable aspects of each of them.


    UNIX was transferred to the PDP-11/20 in 1970, and to the PDP-11/40, PDP-11/45,
    and eventually to the PDP-11/70. Each of these machines had features that gradually
    added to the complexity of the hardware that UNIX could support. Dennis Ritchie
    and others at Bell Labs continued the development process of UNIX, adding utilities
    (such as a text processor).


    Like most of the operating systems, UNIX was originally written in assembly language.
    *Assembly language* is a primitive set of instructions that depend on the computer
    architecture. Programs written in assembly language dependent and work on only
    one computer (or one family of computers). Therefore, moving the UNIX from one
    computer to another involved significant rewriting of the programs.


    Thompson and Ritchie experienced Multics, which was written in a high-level language
    called PL/1, and they were aware of the advantages of using a high-level language
    to write operating systems. (A high-level language is much easier to use than
    the assembly language.) They decided to rewrite the UNIX operating system in a
    high-level language. The language of their choice was C. The C programming language
    is a general-purpose language featuring the commands and structures of modern,
    high-level languages. In 1973, Ken and Dennis successfully rewrote the UNIX operating
    system in C.


    About 95 percent of the UNIX operating system is written in C. A small part of
    the UNIX is still written in assembly language; that part is mostly contained
    in the kernel, the part that interacts with the hardware.


    See page xxii for an explanation of the icons used to highlight information in
    this chapter.'
  merge: -1
