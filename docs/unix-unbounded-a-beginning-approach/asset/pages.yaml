    # 1.4 PROCESS OPERATION


    A complex chain of events occurs when a computer executes a program. To begin,
    the program and its associated data are loaded into the main memory. The control
    unit (CU) reads the first instruction and its data inputs from the main memory
    into the CPU. If the instruction is a computational (or comparison) instruction,
    the control unit signals the ALU in function to perform, where the input data
    are located, and where to store the output data. Some instructions, as input and
    output to secondary storage or I/O devices, are executed by the control unit until.
    After the first instruction is executed, the next instruction is read and executed.
    This process continues until the last instruction of the program is read from
    the main memory into the registers in the CPU and is executed.


    > Each instruction is known to the ALU by a unique number called the instruction
    code or the operation code ("op code").


    The steps required process each instruction can be grouped into two phases: the
    instruction cycle and the execution cycle. The operation of the instruction and
    execution cycles is depicted in figure 1–3, followed by the explanation for sequence
    of events.


    Instruction Cycle The sequence of events during the instruction cycle, also referred
    to as the fetch cycle, is as follows:


    +   * Step 1: The control unit reads an instruction from main memory to a CPU
    register called the instruction register.

    * Step 2: The control unit increments the pointer register to show the location
    of the next instruction in the main memory.

    * Step 3: The control unit generates a signal to the ALU to execute the instruction.'
