    the abbreviated word instead of typing the whole text. For example, to abbreviate
    the words UNIX Operating System, which are used often in this text, type :ab uno
    UNIX Operating System and press [Return]


    In this example, uno is the abbreviation assigned to UNIX Operating System; when
    vi is in input mode, any time you type uno and then a space, vi expands uno to
    UNIX Operating System. If uno is part of another word, such as'
