    # 1.3.4 Extern Storage


    External or secondary storage is a nonvolatile extension of the main memory. Main
    memory is expensive, and on most computers it is a scarce resource. Main memory
    is volatile; it loses its contents when the power is turned off. Hence it makes
    sense to save your programs and data on another medium. Secondary storage media
    could be a floppy disk (diskette), hard disk, and/or magnetic tape.


    +   1. Secondary storage is an extension of main memory, not a replacement for
    it. A computer cannot execute a program or manipulate data stored on disk unless
    the data are first copied into main memory.

    2. Main memory holds the current programs and data, whereas secondary storage
    is for long-term storage.


    Table 1–2 summarizes the computer''s various types of storage devices and their
