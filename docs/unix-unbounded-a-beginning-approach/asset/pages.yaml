    # 8.4.5 Splitting the Output: the tee command


    Sometimes you will want to look at the output of a program on the screen and also
    to store the output in a file for later reference or obtain a hard copy of the
    output on the printer. You can always do this way: first run the command and view
    the output on the screen; then, using the redirection operator, save the output
    in a file or send it to the printer.


    Alternatively, you can use the tee command to get the same result in less time
    and with less typing. The tee command is usually used with the pipe operator.
    For example, when you type sort phone.list | tee phone.sort and [Return], the
    pipe passes the output of the sort command (the sorted phone.list) to tee. Then
    tee displays it on the terminal and also saves it in phone.sort, the specified
    file.


    This is an indispensable command when you want to capture the user/program dialog
    while running an interactive program.


    Try viewing the contents of your current directory and saving the output in a
    file as follows:


    ```

    $ ls -C tee dir.list [Return] ........................................ Display
    the current directory filenames

    and also save the output in dir.list.

    memos myfile REPORT

    $ cat dir.list [Return] ...................................................................
    Check the contents of dir.list.

    memos myfile REPORT

    $ ............................................................................................................................................................
    The prompt.

    ```


