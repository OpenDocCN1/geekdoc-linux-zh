  md: 'Path Modification You can modify the PATH shell variable and add your home
    directory to it. Thus your home directory is also searched to find the commands.


    Changing the PATH variable to add your home directory.


    ```

    $ echo $PATH [Return] . Check the PATH assignment.

    PATH=/bin:usr/bin

    $ echo $PATH:$SHOME [Return] . Add your home directory.

    $ echo $PATH [Return] . Check again.

    PATH=/bin:usr/bin:usr/students/david

    $_ . Prompt.

    ```


    Now everything is ready: type bye and press [Return] to place the new PATH in
    your .profile file. Then, any time you log in, the PATH variable is set to your
    desired path.


    Command Substitution You can place the output of a command in the string. The
    shell executes the command surrounded by a pair of quotation marks ('''') and
    then substitutes the output of the command in the string passed to the echo. For
    example, if you type:


    ```

    $ echo "your current directory: ''pwd'' [Return]

    ```


    The output looks like this:


    Your current directory: /usr/students/david


    > In this case, pwd is executed, and its output, your current directory name,
    is placed in a string that is passed to the echo command.


    # 11.2.4 Read Inputs: The read Command


    One way to assign values to variables is to use the assignment operator, the equal
    sign (=). You can also store values in variables by reading strings from the standard
    input device.


    You use the read command to read the user input and save it in a user-defined
    variable. This is one of the most common uses of the user-defined variables, especially
    in interactive programs where you prompt the user for information and then read
    the user response. When read is executed, the shell waits until the user enters
    a line of text; then it stores the entered text in one or more variables. The
    variables are listed after the read command line, and the end of user input is
    signaled when the user presses [Return].


    Figure 11–7 is a sample script named kb_read that shows how the read works.


    The read command is used in combination with echo. You use the echo to prompt
    the user for what you want to be entered, and the read command waits for the user
    to enter something.'
