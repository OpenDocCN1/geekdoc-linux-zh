    Line 7: This line starts the terminal code for the boldface display in a variable

    called BOLD.


    Line 8: This line starts the terminal code for the normal display in a variable

    called NORMAL.


    Line 9: This line makes the variables BOLD and NORMAL available to the sub-

    shell.'
