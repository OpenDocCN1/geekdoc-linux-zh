  md: '# THE DISPLAY Program


    The DISPLAY program displays a specified record from the ULIB_FILE file on the
    screen, and it is activated when you select the display function from the edit
    menu. It first prompts you to enter the book''s title or the author''s name. Then,
    it searches the ULIB_FILE file to find a match for the specified book. If the
    record is not found, it is displayed in a presentable format. If an error message
    is displayed, and you are prompted for the next input. This process continues
    until you indicate your intention to end the program. The DISPLAY program ends,
    the control is returned to the calling program, in this case the EDIT program,
    and you are back to the edit menu for your next section.


    Line 12–21 shows the DISPLAY program source code. The following is the line-by-line
    explanation of this program.


    Line 1–6: These lines align with the # sign and documentation lines.


    Line 7: This line copies the value of the environment variable IFS to OLD_IFS.
    You want to save the old value before assigning the new value. Later, you want
    be able to restore the IFS variable to its original setup.


    Line 8: This line initializes the variable answer to the letter y. Consequently
    it forces the first iteration of the while loop.


    Line 9, 10, and 45: These lines construct the while loop The body of the loop
    consists of all the lines between lines 10 and 45. As the condition of the while
    loop is true (answer is equal to the letter y), then the body of the loop is executed.


    Line 11: This line consists of three commands. It clears the screen, the cursor
    on line 5, column 6, and prompts the user to enter the title or the author of
    the book to be displayed.


    Line 12: This line waits for the user input and saves the input in the response
    variable.


    Line 13: This line uses the grep command (see chapter 8) to find all the lines
    in the ULIB_FILE file that contain the pattern in the response variable (the user
    input), and the output is redirected to TEMP file. If the TEMP file is not empty,
    it means the specified book record is found, and if TEMP remains an empty file,
    it means the specified book record is not found.


    Lines 14, 15, 33, and 37: These lines make an if-then-else construct. The condition
    tests for the existence of a nonzero-length file, in case the TEMP file. If the
    condition is true (TEMP exists and there is something in it), then the body of
    the if (lines 16–18) is executed. If the condition is false (TEMP is an empty
    file), then the body of the else (line 36) is executed.


    Line 16: This line sets the delimiter to the colon (:). In this application, the
    colon is the symbol that separates the fields in the records.


    Line 17: This line reads each field of the specified book record from the TEMP
    file.


    Lines 18 and 19: These lines place the cursor at the specified location and display
    the record header.'
