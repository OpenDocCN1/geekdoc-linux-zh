    **exec Option** The exec action option gives you a command to be applied to

    the found files. You type -exec followed by the specified command, space,

    backslash, and then a semicolon. You can use a set of braces ({}) to represent
    the

    name of the files found. An example will help to clarify the sequence.


    Find and delete all instances of the first.c file that are 90 days old.


    ```

    $ .name first.c -mtime +90 -exec rm {}; [Return]

    $ _ Prompt.

    ```


    The search starts from your current directory (represented by .) and is continued

    through the hierarchy of the directories. The **find** command locates and removes

    instances of first.c that are 90 days old.


    Two search options are in effect: the **-name** and the **-mtime** options. That

    means find is seeking files that simultaneously satisfy these two search cate-

    gories.


    The command is comprised of many parts, and its syntax is peculiar:


    +   1. the **-exec** option followed by the command (in this case **rm**)

    2. a set of braces ({}) followed by a space

    3. a backslash (\) followed by a semicolon


    All instances of first.c are deleted. No warning or feedback message is dis-

    played. When you see the $ prompt, the job is done.


    **-ok Option** The -ok action option is just like the -exec option, except that
    it asks

    for your confirmation before applying the command to the file.


    Find and delete all instances of the first.c file, but ask for confirmation before

    deleting any file.


    ```

    $ .name first.c +90 -ok rm {}; [Return]

    $ _ Prompt.

    ```


    If a file, for first.c, satisfies the criterion, then the following prompt is

    displayed:


    ```

    <rm .../source/first.c> ?

    ```


    If you reply with [Y] or [y], the command is executed (in this case, file.c is

    deleted); otherwise, your file remains intact.


    You can also use the logical operators or, **and**, and **not** to combine the
    search

    options. The search starts from your current directory; and it is continued

    trough the hierarchy of the directories.'
