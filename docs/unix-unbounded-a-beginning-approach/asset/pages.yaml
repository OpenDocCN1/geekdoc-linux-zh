    The kill Signals 9 and 15 are generated by the kill (see chapter 8) command. 15
    is the default signal, and 9 is generated by the kill command option -9 is used.
    Both terminate the receiving process.


    # 12.2.1


    # Trapping the Signals: The trap command


    The default action taken by your process when it receives any of the signals is
    immediate termination. You can use the trap command to change the process action
    to whatever you specify. For example, you can instruct your process to ignore
    interrupt signals or to execute a specified command of termination. Let''s explore
    the possibilities. The format of the trap command is as follows:


    trap "optional commands" signal numbers


    The commands part is optional. When it is present, the commands are executed whenever
    your process receives one of the signals you have specified to be trapped.


    The commands that are specified to the trap command must be enclosed in single
    or double quotation marks.


    +   1. You can specify more than one signal number to be trapped.

    2. The signal numbers are the numbers associated with the signals that you want
    the trap command to catch.


    The following command sequences show how the trap command works.


    trap "echo I refuse to die!" 15


    This command executes the echo command and displays the I refuse to die! message
    when it receives a simple kill command. However, your script continues.


    trap "* echo Killed by a signal; exit*" 15


    If your process receives a kill command (signal 15), the echo command is executed
    and the Killed by a signal! message. Next, the exit command is executed, which
    causes your script to terminate.


    trap "*" 15'
