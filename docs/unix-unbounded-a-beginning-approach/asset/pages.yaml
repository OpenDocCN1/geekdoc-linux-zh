    # 11.3.6 Parameter Substitution


    The shell provides a parameter substitution facility that lets you test the value
    of

    a parameter and change its value according to a specified option. This is useful

    in shell programming when you want to check whether a variable is set to some-thing.
    For example, when you issue a read command in a script file, you want to

    s sure the user has entered something before taking any action.


    The format consists of a dollar sign ($), a set of braces ({}), a variable, a

    colon (;); an option character and a word, as follows:


    ```

    $$(parameter.option word)

    ```


    An option character determines what you intend to do with the word. The four

    option characters are specified by the -, =, ?, + signs. These four options

    perform differently depending on whether the variable is an empty variable.


    A variable is an empty variable (a null variable) if its value is an empty string.

    For example, all of the following variables are set to a null value and are empty
    variables.


    | EMPTY= . | An empty variable called EMPTY |

    | EMPTY="" . | An empty variable called EMPTY |

    | EMPTY='''' . | An empty variable called EMPTY |


    To create an empty variable, put no blank characters between the quotation marks.


    Table 11–7 summarizes the shell variable substitution (evaluation) options. A

    brief explanation and example of each type follows.


    $$(parameter) inside the braces prevents any

    conflict caused by the character that follows the variable name. The following

    example clarifies this matter.


    Suppose you want to change the name of a file called memo, specified in the

    variable called FILE, to memoX.


    ```

    $FILE [Return] . . . . . . . . . . . . . . . Check what is stored in FILE.


    memo


    $ mv $FILELEX [Return] . . . . . . . . . . Change memo to memoX.

    Usage: mv


    $_ . . . . . . . . . . . . . . . . . . . . . . . . Prompt.

    ```


    This command did not work because the shell considers $FILELEX the name of the

    variable, which does not exist.'
