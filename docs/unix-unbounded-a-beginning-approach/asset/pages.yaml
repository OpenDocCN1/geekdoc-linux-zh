    Every [Ctrl-s] must be canceled by a [Ctrl-q]. Otherwise the screen remains locked,
    and the input from your keyboard is ineffective.


    # 5.6 PRINTING FILE CONTENTS


    You can look at the contents of a file on the screen by using the vi editor or
    the cat command. However, there are times when you want a hard copy of your file.
    UNIX provides commands to send your file to the printer, give the status of your
    print job, and let cancel your print job if you change your mind. Lets investigate
    these commands.


    # 5.6.1 Printing: The lp Command


    The lp command sends a copy of a file to the printer for producing a hard (paper)
    copy of the file. For example, if you want to print the contents of the myfirst
    file, you type lp myfirst and press [Return].


    UNIX confirms your request by displaying a request id similar to the following:


    > request id is lp-8054 (1 file)


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_122_1.png)


    As always, there is a space between the command (lp) and the argument (file-name).


    If you specify a filename that does not exist, or one that UNIX cannot locate,
    then lp returns a message similar to the following:


    ```

    lp: cannot access file "xyz"

    lp: request not accepted

    ```


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_122_2.png)


    You can select several files on one command line.


    ```

    $ lp myfirst REPORT phone [RETURN]. . Print myfirst, REPORT, and phone files.

    request id is lp1-6877 (3 files)

    $ ............................................................ . . . . . . Ready
    for the next command.

    ```'
