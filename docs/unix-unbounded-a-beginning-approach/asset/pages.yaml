  md: '# FILE READING


    Chapter 5 explained how you can use the vi editor or the cat command to read files.
    To refresh your memory, you can use vi with the read-only option to read files,
    or you can use cat to view a small file. Using the cat command to view a large
    file, [Ctrl-s] to stop screen output, and [Ctrl-q] to resume screen output is
    very inconvenient. Try following the following examples to get the feel of it.
    Doing so will make you appreciate the other file reading commands that let you
    view files one at a time.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_168_0.png)


    Assume that your working directory is david and you have a file (20 pages long)
    called large_file in it.


    +   - To read large_file using the vi editor, type vi -R large file and press
    [Return]. This opens large_file for read only. Contents of large_file are displayed
    on the screen, and you can use vi commands to view the other pages.

    - To read large_file using the cat command, type cat large file and press [Return].
    The contents of large_file are displayed and scroll before your eyes. You can
    use [Ctrl-s] and [Ctrl-q] to stop and resume scrolling.


    # The vi Editor Read/Only Version: The view Command


    Some UNIX systems provide the vi editor called view that you can use to read files.
    It is a good tool for reading large files because you can use all the vi editors
    to facilitate the reading of different parts of your file. Viewing a file using
    the view command prevents you from saving your editing or changes to the file.
    You can use it only to read a file.


    # Reading Files: The pg command


    You can use the pg command to view files one screen at a time. A prompt sign (:)
    is produced at the bottom of the screen, and you press [Return] to continue viewing
    the rest of the file. The pg command shows EOF (End Of File) on the last line
    of the screen when it reaches the end of your file. You press [Return] at this
    point to get the $ prompt.


    Using the pg command options gives you more control over the format and the way
    you want to view your file. Table 7–1 summarizes these options.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_168_1.png)


    Unlike other commands'' options, some pg options start with the plus sign (+).


    Assuming you have a file called large_file in your working directory, use the
    pg command to read it by doing the following:


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_168_2.png)


    See page xxii for an explanation of the icons used to highlight information in
    this chapter.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# UNIX UNBOUNDED: A BEGINNING APPROACH


    Table 7–1

    The pg command options.


    | Option | Operation |

    | -n | Does not require [Return] to complete the single letter commands. |

    | -s | Displays messages and prompts in reverse video. |

    | -num | Sets the number of lines per screen to the integer *num*. |

    | -pstr | Changes the prompt: (colon) to the string specified as *str*. |

    | +line-num | Starts displaying the file from the line specified in *line-num*.
    |

    | +pattern | Starts viewing at the line containing the first occurrence of the
    specified *pattern*. |


    +   - Type pg **large_file** and press [Return]. This is a simple way of looking
    at large_file one screen at a time.

    - Type pg **-p Next** **+45 large_file** and press [Return] to view large_file
    from line 45 and show the prompt **Next** instead of the normal prompt : (colon).


    Two options are used: **-p** to change the default prompt from : to Next, and
    + to start viewing from line 45.


    +   - Type pg **-s/+large_file** and press [Return] to show prompt and other messages
    in reverse video, and start viewing from the first line that contains the word
    **hello**.


    Two options are used; **-s** to show prompt and other messages in reverse video,
    and **+/hello** to search for first occurrence of the word **hello**.

    When the pg command displays the prompt sign : (or any other prompt if you have
    used the **-p** option), you can give commands to move forward or backward a specified
    number of pages or lines to view different parts of the text. Table 7–2 summarizes
    some of these commands.


    Table 7–2

    The pg command key operators.


    | Key | Operation |

    | +n | Advances *n* screens where *n* is an integer number. |

    | -n | Backs up *n* screens where *n* is an integer number. |

    | +nl | Advances *n* lines where *n* is an integer number. |

    | -nl | Backs up *n* screens where *n* is an integer number. |

    | n | Goes to *n* screens where *n* is an integer number. |'
