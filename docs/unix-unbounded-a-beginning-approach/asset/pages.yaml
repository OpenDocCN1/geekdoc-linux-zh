    # 3.5 USING SHELLS AND UTILITIES


    Much of UNIX''s strength and flexibility comes from its shells. The shell is a
    program that handles user interaction with the UNIX system. The UNIX commands
    are processed by a shell that lies between the user and the other parts of the
    operating system. Each time you type a command and press [Return], you send a
    command to the shell. The shell analyzes the line you typed and then proceeds
    to carry out your request, that is, it is a command interpreter. For example,
    if you type the date command, shell locates where the program is kept and runs
    it. So you, the user, are actually addressing the shell and not UNIX, technically
    speaking.


    **Shell Commands** Some commands are part of the shell; these built-in commands
    are recognized by the shell and are executed internally.


    **Utility Programs** Most UNIX commands are executable programs (utilities) that
    the shell locates and executes.


    In this book, the word command is used to refer to both shell commands and utility
    programs.


    # 3.5.1 Kinds of Shells


    The shell is just a program. Like other programs, the shell has no special privileges
    on the system. This is one reason various flavors of the shell programs exist.
    If you are a professional programmer, you can create your own shell program with
    some effort and devotion. UNIX V Release 4 (SVR4) provides three different shells
    for you to choose from. These shells are: the Bourne shell (sh), the Korn shell
    (ksh), and the C shell (sh).


    Bourne Shell The Bourne shell (sh) is the standard shell that is part of most
    operating systems. It is usually the default shell on your system. The prompt
    for Bourne shell is the dollar sign ($).'
