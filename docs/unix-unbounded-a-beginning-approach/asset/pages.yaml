    # 11.1.2 Executing a Script


    There are two ways to execute a shell script: you can use the sh command, or you
    can make the shell script file an executable file.


    # Invoking Scripts with sh


    You can use the sh command to execute script files. Every time you type sh you
    invoke another copy (instance) of the shell. The shell script won is not an executable
    file, so you must invoke another shell to execute it. You specify the filename,
    and the new shell reads the script, executes the commands listed in it, and ends
    when all the commands have been executed (or when it reaches an error).

    Figure 11–2 shows how the won file can be executed using this method. Typing sh
    to invoke another shell each time you want to execute a script file is not very
    convenient. However, this method has its advantages, especially when you write
    complex script applications that need debugging and tracing tools. These tools
    are discussed later in this chapter.) Under normal circumstances, the second method
    of making the script executable is preferred. After all, the lesser typing the
    better.


    # Making Files Executable:Using chmod to Change File Permissions


    The second method of executing a shell program is to make the script executable
    file. In this case, you do not need to invoke another shell; all you do is type
    the name of the script program, just as you do any other shell program (command).
    This is the preferred method.


    # Figure 11–1


    A simple shell script.


    ```

    $ cat won

    #

    # won

    # display # of users currently logged in

    #

    who wc -l

    $_

    ```'
