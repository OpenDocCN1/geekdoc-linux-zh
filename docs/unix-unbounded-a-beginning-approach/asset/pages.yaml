    # 8.1.3 Removing Metacharacters’ Special Meanings


    The metacharacters have special meanings to the shell. But sometimes you want
    to remove those meanings. The shell provides you with a set of characters that
    remove the meanings of the metacharacters. This process of removing the special
    meanings of the metacharacters is called quoting or escaping. The set of quoting
    characters is


    +   - backslash []

    - double quotation mark [


    Backslash The backslash \\ is used to cause the character that follows it to be
    interpreted as an ordinary alphanumeric character. For example, [?] is a sub-character
    (wildcard) and has a special meaning to the shell. But \? is interpreted as the
    real question mark.


    Delete a file temp? from your directory.


    $ rm temp? [Return] Remove temp?


    The shell interprets this command as deleting all files whose consist of temp
    and one character after it. Therefore, it deletes any file that matches this pattern,
    such as temp, temp1, temp2, tempa, tempo, etc.

    But if you wanted to delete a single file called temp?, then you would have the
    following:


    $ rm temp?! [Return] Try again, \? to represent the ?


    This time the shell scans the command line, the \? ignores the special meaning
    of the question mark, and passes the filename temp? to the rm program.


    Display the metacharacters.


    $ echo \<\>\"\\\$\\?&\\\\ [Return]. Let''s display them all.

    <>"\''$?&\\\\n$ . . Ready for the next command.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_219_0.png)


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_219_1.png)'
