  md: '# UNIX UNBOUNDED

    A Beginning Approach, SECOND EDITION


    UNIX Unbound: A Beginning Approach was the first practical textbook written for
    students and other readers about the UNIX operating system. The second edition
    is written in a tutorial manner, covering operating system concepts in general,
    and the UNIX and its environment in particular. Each chapter begins with a general
    explanation of concepts topics, and ends with questions and a review section.


    UNIX Unbound: A Beginning Approach is not merely a reference or technical book.
    It is a very useful guide that enables readers to build confidence in using UNIX
    and in understanding the system''s complexities.


    For more information about this book or any of Prentice Hall''s other new technology
    titles, visit our Web site at http://www.prenhall.com


