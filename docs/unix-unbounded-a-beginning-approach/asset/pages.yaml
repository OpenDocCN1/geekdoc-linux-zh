    # PATH


    The PATH variable is set to the directory names that the shell searches for the
    location of commands (programs) in the directory structure. For example, PATH=$/bin:/usr/bin.

    The directories in the path string are separated by colons. If the very first
    character in the path string is a colon, the shell interprets it as .: (dot, colon),
    meaning that your current directory is first on the list and is searched first.

    UNIX usually stores the executable files in a directory called bin. You can create
    your own bin directory and store your executable files in it. If you add your
    bin directory (or any other name you call it) to the PATH variable, the shell
    looks there for any commands it cannot find in the standard directories.


    Suppose all of your executable files are located in a subdirectories called mybin
    that is located in your home directory. To add it to the PATH variable, you type
    PATH=$/bin:/usr/bin:$HOME/mybin and press [Return].


