- img_proc: true
  md: '# UNIX UNBOUNDED: A BEGINNING APPROACH


    The following command sequence shows how to use the rm command.


    ```

    $ cd [Return] ................................ Change to your home directory.

    $ rm myfirst [Return] Delete myfirst from your home directory.

    $ rm REPORT phones [Return] ............ Delete 2 files, REPORT and phones.

    $ rm xyz [Return] ........................ Delete xyz; if the file does not exist,
    the system plainly complains by showing an error message.

    rm: file not found

    $_ ................................................ Ready for next command.

    ```


    The rm command does not give you any warning, and when a file is deleted, it is
    deleted for good!


    # rm Options


    Like UNIX commands, rm options modify the capabilities of the rm command in opposite
    ways. Table 5–4 summarizes the rm options.

    -i Option The -i option gives you more control over the delete operation. If you
    use the -i option, rm prompts you for confirmation before deleting each file.
    You may press [y] for yes, if you are sure you want to delete the specified file,
    or [n], if you do not want to delete the file. This is the safest way to remove
    files.


    The following command sequence shows examples of the use of the -i option.


    ```

    $ pwd [Return] ................................ Check where you are.

    /usr/david

    $ ls source [Return] ................. List files in the source directory.

    first.c

    $ rm -i first.c [Return] .............. Delete first.c; the system displays the
    confirmation prompt before deletion.

    Press [y] for yes.

    rm: remove first.c? y

    $ ls source [Return] ........................ Check whether the file was deleted.

    $_ ................................................ No files in the source directory.

    ```


    Table 5–4

    The rm command options.


    | Option | Operation |

    |---|---|

    | -i | Asks confirmation before deleting any file. |

    | -r | Deletes the specified directory and every file and subdirectory in it.
    |'
