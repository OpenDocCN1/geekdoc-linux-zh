  md: 'Batch The operating system is designed to execute programs (batch process)
    that do not require active user intervention. A batch process normally uses noninteractive
    I/O devices such as disks or document scanners for input and returns to those
    same devices. The batch processing is used only in especially large transaction
    processing environments, for example, nightly processing of checks in a bank.


    # Memory Capacity Limitation


    How large can a computer program be? Remember, the entire program and its associated
    data must be in the main memory throughout its execution. Thus the capacity of
    the computer''s main memory becomes the limitation on the size of an application
    program. However, that is not as limiting as it might seem at first. The computer
    is a sequential machine; it executes one instruction at a time in each processing
    cycle, so it is not necessary for the entire application to be in the main continuously.


    Virtual Memory Under virtual memory, programs are subdivided into smaller portions
    called pages. Under the control of the operating system only the necessary pages
    of program are swapped into the main memory to support the ongoing process. This
    approach permits you to use a relatively large program with minimal demands for
    the main memory space.


    Within a virtual memory system, secondary storage devices can be regarded as an
    extension of the main memory.


    # 1.5.2


    # Application Software


    Application software is designed and written to solve problems or provide automation
    and efficiency in personal, business, and scientific environments. Application
    programs are available for most data processing needs. You can buy off-the-shelf
    programs such as payroll systems, inventory systems, word processing, spreadsheets,
    and so on. All you need is to select the right application program for the job.
    If you are not happy with off-the-shelf application programs, you can write your
    own program, using one of the available computer programming languages.


