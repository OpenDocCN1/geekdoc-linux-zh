    # 7.6 MORE FILE MANIPULATION COMMANDS


    The following commands facilitate the search for a specific file in a crowded
    hierarchy of directories, and display a specified portion of a file for a quick
    look.


    # 7.6.1 Finding Files: The find command


    You can use the find command to locate files that match a set of criteria in a
    hierarchy of directories. The criterion may be a filename or a specified property
    of a file (such as its modification date, size, or type). You can also direct
    the command to remove, print, or act on the file. The find command is a very useful
    and important command that is not used to its full potential. Its unusual command
    format is discouraging.


    The format of the find command is different from that of the other UNIX commands.
    Let''s look at its syntax:


    ```

    find pathname options action option

    ```


    pathname indicates the directory name from which find begins its search, continues
    into the subdirectories and their subdirectories and so on. This process of searching
    is called a recursive search. The search option part identifies which file you
    are interested in, and the action option part tells what to do with the file once
    it is found. Let''s look at a simple example:


    ```

    $ find -print [Return]

    ```


    This command displays the names of all the files in the specified directory and
    all its subdirectories.'
