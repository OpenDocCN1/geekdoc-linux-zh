  md: '# How to Read This Book


    If this is the first time you are learning about the UNIX operating system, I
    suggest that you start from the first chapter and continue the chapters in the
    same sequence in which they are presented.


    If you already know some aspects of the UNIX operating system, I suggest that
    you browse through the chapters about things you know and read the main points
    as a review and to help you understand the other chapters. Most of the chapters
    are related to one another in the sense that your skills from the previous chapter
    help you—and sometimes are necessary for you to go to the next one.


    A number of concrete examples clarify concepts or show different ways you can
    use a command. I encourage you to try them on your system.

    IX comes in many dialects and is also easily modifiable. This means you may find
    discrepancies between the manual and the reality, and some of the screen displays
    or command sequences in this book may not exactly match your system.


    # Typographical Notes


    Throughout the text of this book, certain words are emphasized by using different
    typefaces. In the running text, **bold words** are UNIX commands or specific characters
    that you type on the keyboard as part of an example; sans serif words are directory
    names, pathnames, and filenames; and *italic* words are keywords or terms being
    introduced for the first time.


    The following shows an example of a terminal screen. This is what you expect to
    see on your system when you practice the commands.


    ```

    UNIX System V release 4.0

    login: david

    password:

    ```


    The following is an example of the command sequences. Characters you type on the
    keyboard are indicated in bold type. The information at the right is commentary
    on the action being performed at the left. This format is used when a line-by-line
    explanation of the commands or outputs is necessary.


    +   $ pwd [Return] ...................................................................
    Check your current directory.

    /usr/david ........................................................................
    You are in david.

