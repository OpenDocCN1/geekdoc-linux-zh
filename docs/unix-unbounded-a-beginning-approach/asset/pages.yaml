    # 9.2


    # ELECTRONIC MAIL


    Electronic mail (e-mail) is an essential part of the contemporary office environment.
    E-mail gives you the capability to send and receive messages, memos, and other
    documents to and from other users. The main difference between sending mail using
    the e-mail service and using the write command is that with the write command
    only you see the messages sent to you if you are logged on. e-mail, your mail
    is automatically kept for until you issue the command to read it. E-mail service
    is more convenient and faster than conventional mail service, and does not interrupt
    the receiving party with phone calls.


    Under UNIX, either the mail or mails command can be used to send or read e-mail.
    The mail utility is based on Berkeley UNIX mail and has more powerful features
    than mail, enabling you to manipulate (review, store, dispose of, etc.) your mail
    easily and efficiently. mails is the e-mail command discussed in this book. It
    has a large number of features and options; using some of them requires advanced
    UNIX experience. In this chapter, we describe enough to make you feel comfortable
    using it and interested in looking for more information about it.


    Where do you find more information? Well, how about the man command? (In case
    you have forgotten, man was discussed in chapter 3.)


    You use the mails command to send mail to other users or read mail that is sent
    to you. The mail operation involves a number of files; the way it appears and
    functions depends on the environment variables that are set up in files, and it
    needs files for storing your mail.


    # 9.2.1


    # Using Mailboxes


    In the UNIX mail system, you have two kinds of mailboxes: a system mailbox and
    a private mailbox.


    # Your System Mailbox


    Every user of the system has a mailbox, which is a file with the same name as
    your login name (user ID). This file is typically stored in/usr/mail. Mail sent
    to you is stored in this file, and when you read a message, mails reads from your
    mailbox. If your login name is david, the full pathname to your mailbox could
    be /usr/mail/students/david.


    You can use the set command (discussed in chapter 8) to see your system mailbox
    pathname. The variable MAIL is set to the filename that receives your mail.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_272_0.png)'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Your Private Mailbox: The mbox File


    After you read your mail, mailx automatically appends a copy of it to a file called
    mbox in your home directory. If an mbox file does not exist, then mailx creates
    one in your home directory the first time you read your mail. This file contains
    mail that you have read $HOME/mbox not deleted or saved-where. The variable MBOX
    controls the filename. The default value is HOME/mbox. For example, the following
    command changes the default setting and sets up your private mailbox in the EMAIL
    directory.


    ```

    MBOX=$HOME/EMAIL/mbox

    ```


    The explicit saving of a message or using the x (xit) command to exit mailx disables
    the automatic saving of your messages.


    # The Customizable mailx Environment


    You can customize your mailx environment by setting up appropriate variables in
    two startup files: the mailrc file in the system directory and the mailrc file
    in your home directory.


    When mailx calls, it checks for a startup file called mail.rc. The full pathname
    to this file is similar to the following:


    ```

    /usr/share/lib/mailx/mail.rc

    ```


    This file is usually created and maintained by the system administrator. Variables
    set in this file are applicable to all the system users.


    The second file that mailx looks for is a file called mailrc in your home directory.
    You can change the mailx environment that the system administrator has set up
    in the mailrc file by setting variables in your mailrc. This file is not necessary,
    and mailx works without it, as long as you are happy with the system administrator''s
    arrangement. Ways to customize your mailx environment are discussed in detail
    in section 9.5.


    # 9.2.2 Sending Mail


    In order to send mail to another person, you must know that person''s login name.
    For example, if you want to send mail to a user identified by the login name daniel,
    you type mailx daniel and press [Return].


    By default, the input to mailx (your message) comes from the keyboard (standard
    input). Depending on how your environment variables are set, mailx may show the
    Subject: prompt. If it does, you type the subject for your message. mailx changes
    the input mode and waits for you to enter the rest of your message. The signal
    of your message by pressing [Ctrl-d] at the beginning of a line, mailx sends <EOT>
    (for End Of Transmission), and your message is transmitted.


    While in the input mode, mailx provides you with a large number of commands, enabling
    you to compose your message with ease and efficiency. All input mode commands
    start with a tilde (~), and they are called tilde escape commands. (The tilde
    escape commands are explained later in this chapter.)


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_273_0.png)'
