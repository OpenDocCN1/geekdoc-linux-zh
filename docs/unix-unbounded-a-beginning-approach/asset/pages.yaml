    # 10.5 UNIX Programming Tracking Utilities


    # 10.5.1 The make Utility


    The make utility is useful when your program consists of more than one file. make
    automatically keeps track of the source files that are changed and need recompilation,
    and relinks your programs if required. The make program gets its information from
    a control file. The control file contains rules that specify source dependencies
    and other information.


    # 10.5.2 The SCCS Utility


    The SCCS (Source Code Control System) is a collection of programs that helps you
    maintain and manage the development of your programs. If your program is under
    SCCS control, then you can create different versions of your program easily. The
    SCCS keeps track of all the changes among different versions.'
