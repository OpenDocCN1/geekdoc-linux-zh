    desirable to save the compiler error messages in a file for easy reference. The
    redirection capability of the shell becomes handy again!


    The default error device is usually the same as the output device, your terminal,
    so the errors are displayed on your terminal. Suppose you want to redirect the
    errors to a specified file.


    Compile first.c and save compilation errors, if any, in another file.


    ```

    $ cc first.c -o first 2> [Return] . Recompile.

    $ ................................. . . . . . . . . . The shell prompt appears.

    ```


    The digit 2 before the > sign is necessary and indicates the redirection of the
    standard error device.


    Where does the digit 2 come from? The command just shown needs some explanation.
    Let''s go back to the UNIX redirection concept and explore the origins of the
    digit 2.


    # 10.4.2 Redirecting the Standard Error


    The shell interprets the > as standard output redirection. The notation I> is
    the same as > and tells the shell to redirect the standard output. The number
    1 in I> is the file descriptor number; by default, file descriptor 1 is assigned
    to the standard output device. For example, the following two commands do the
    same job: redirect the output of the ls command to a file.


    ```

    $ ls -C list [Return]

    ```


    or


    ```

    $ ls -C 1> list [Return]

    ```


    File descriptor 2 is assigned to the standard error device. The shell interprets
    the notation 2> as the redirection of the error output. For example, suppose you
    do not have a file called Y in your current directory, and you issue the following
    command:


    ```

    $ cat Y > Z [Return] .................................... Copy Y to Z.

    cat: cannot open Y ................................. . . . . . . . . Error message.

    ```


    The error message appears on the screen. Now redirect the error output to a file.


    ```

    $ cat Y > Z 2> error [Return] ................ Copy Y to Z. Keep errors in a file
    called error in the current directory.

    ```


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_308_0.png)'
