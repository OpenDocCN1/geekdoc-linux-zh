  md: '# 6.6.1


    # The Options Formats


    The set command is used to set the options, and the general format of the options
    falls into three categories, each set in a different manner:


    +   - Boolean (toggle)

    - numeric

    - string


    Assuming there is an option X, the following examples show how to set the three
    categories of options.


    # The Boolean Options


    The Boolean options work like a toggle switch: you can turn them on or off. These
    options are set by typing the option name and are disabled by adding the word
    no in front of the option name. Typing set X enables option X, and typing set
    no disables option X.


    There is no space between the word no and the option''s name.


    # The Numeric Options


    The numeric options accept a numeric value, and depending on the option, the range
    of the numeric value is different. Typing set X=12 assigns value 12 to option
    X.


    # The String Options


    The string options are similar to the numeric options, but they accept a string
    value. Typing set X=PP assigns PP to option X.


    There is no space on either side of the equal sign.


    # The Set Command


    The set command is used to set the different environment options, list them, or
    get the value of a specified option. The basic formats of the set command are
    as follows/each command is completed by pressing [Return]:


    ```

    :set all

    ```


    shows all the options on the screen.


    ```

    :set

    ```


    shows only the changed options.


    ```

    :set X?

    ```


    shows the value of the option X.'
  merge: -1
  pgno: 151
