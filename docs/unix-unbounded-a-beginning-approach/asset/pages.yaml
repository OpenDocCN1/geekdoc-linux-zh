  md: '# 13.1 DISK SPACE


    There is a limit to the number of files you can store on a disk or in a file system.
    That limit depends on two things:


    +   - the total amount of storage space available

    - the amount of space set aside for i-nodes


    An i-node number (discussed in chapter 7) is assigned to each file in the system;
    these numbers are kept in the i-node list. An i-node contains specific information,
    such as its location on the disk, its size, and so on.


    # 13.1.1 Finding Available Disk Space: The df command


    You can use the df (disk free) command to find the total amount of disk space
    or the space available on a specified file system. If you don''t specify a particular
    file system on the command line, then the df command reports the free space for
    all file systems.


    Find the total amount of disk space available.


    $ df [Return] ... No name is specified.

    / (/dev/dsk/c0d0s0) 14534 blocks 2965 i-nodes

    usr (/dev/dsk/c0d0s2) 20308 blocks 51007 i-nodes

    $_ Ready for the next command.


    The output shows that this system has two file systems. The first is the number
    of free blocks, and the second is the number of i-nodes. Each block is usually
    a 512-byte block; some systems use 1024-byte blocks for this report.


    -t Option Using the -t option makes the df include the total number of blocks
    in the file system in the output.


    Invoke the df command with the -t option.


    $ df [Return] ... Use the -t option.

    / (/dev/dsk/c0d0s0) 14534 blocks 2965 i-nodes

    total: 31552 blocks 3936 i-nodes

    usr (/dev/dsk/c0d0s2) 203028 blocks 51007 i-nodes

    total: 539136 blocks 65488 i-nodes

    $_ Prompt.


    You may want to place the df command in your profile file so you get a report
    as soon as you log in.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_412_0.png)


    See page xxii for an explanation of the icons used to highlight information in
    this chapter.'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# 13.1.2 Summarizing Disk Usage: The du Command


    You can use the du (disk usage) command to obtain a report that includes each
    directory in the file system, the number of blocks used by the files in that directory,
    and its subdirectories. This command is useful when you want to know how the space
    on a file system is being used.


    Obtain a disk usage report on the current directory and its subdirectories.


    ```

    $ du [Return] ................. Report disk usage on current directory.

    22 /source/basic

    35 /source/c

    26 /source

    122 /memos

    997 ............................ Prompt.

    ```


    The current directory is identified by the dot (.). Here /source/basic occupies
    22 blocks, /source/c occupies 35 blocks, and so on.


    The du command can be used to obtain reports on any directory structure.


    # du Options


    Table 13–1 summarizes the du command options, and explanations for each option
    follow.


    -a Option The -a option displays the space used by each file in the specified
    directory, as well as the directory.


    # 13.2 MORE UNIX COMMANDS


    This section adds to your command repertoire and introduces new commands that
    help you to manipulate certain aspects of the UNIX environment, create banners,
    and obtain necessary information about the status of programs.


    Table 13–1

    The du command options.


    | Option | Operation |

    | -a | Displays the directories and file sizes. |

    | -s | Displays only the total blocks for the specified directory: subdirectories
    are not listed. |'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# 13.2.1 Displaying Banners: The banner Command


    You can use the banner command to produce output in large letters. It displays
    its arguments (10 characters or less) on the standard output, one argument per
    line. This is useful for creating banners, signs, report titles, etc.


    Make a happy birthday banner.


    ```

    $ banner happy birthday lp [Return] . Make a banner and send it to the printer.

    $ ................. Prompt.

    ```


    The pipe (| routes the output to the printer. Each word (argument) is printed
    on a separate line. You can use quotation marks to make two or more words a single-argument.


    Make a GO HOME banner, with both words on the same line.


    ```

    $ banner "GO HOME" lp [Return]

    $ ................. Prompt.

    ```


    # 13.2.2 Running Commands at a Late Time: the at Command


    You can use the at command to run a command or list of commands at a later time.
    This is useful if you want to run your programs when the computer is busy, or
    when you want to send mail on a certain date. You can specify the time and date
    part of the command in various formats, and the syntax is quite flexible.


    On any given UNIX system, there may be restrictions on who can use the at command.
    The system administrator can limit the access to the at command to only a few
    users. You can try it; if you are not authorized, the following message is displayed:


    at: You are not authorized to use at. Sorry.


    +   1. You specify the command line the time and date on which you want your command
    to be carried out.

    2. You don''t have to be logged in when the commands are scheduled to run.


    # Specifying the Time


    If the time part of the at command is one or two digits (HH format), then it is
    interpreted as time in hours. Thus, 04 and 4 both mean four o''clock in the morning.
    If the time part is four digits (HHMM format), then it is interpreted as time
    and minutes. Thus 0811 is 08:11. You can also specify the time by typing the word
    noon, midnight, or by in the time part of the command.


    UNIX assumes a 24-hour clock, unless you specify using the am or pm suffix. Accordingly,
    2011 is 08:11 pm.'
  merge: -1
  pgno: 414
- img_proc: true
  md: '# Specifying the Date


    The date part of the at command can be a day of the week such as Wednesday or
    Wed (three-letter abbreviation). It can be in month, day, and year format as Aug
    10, 2001. It can also consist of the special word today or tomorrow. Here are
    some examples of legal at time and date formats.


    +   $ 1345 Wed [Return] ................. Run a job on Wednesday at 1:45 p.m.

    $ 0145 pm Wed [Return] ............... Run a job on Wednesday at 1:45 p.m.

    $ 0925 am Sep 18 [Return] ............ Run a job on September 19 at 9:25 a.m.

    $ 11:00 pm tomorrow [Return] ....... Run a job tomorrow at 11 p.m.


    The following command sequences show how to use the at command and specifies time
    and date in different formats.


    Run a job at 4 a.m. the next day.


    +   $ 04 tomorrow [Return] ................... Specify the time and date.

    sort BIG_FILE [Return] ........................ Sort BIG_FILE.

    [Ctrl-d] ............................................ Indicate the end of the
    input.

    user= david ......................... 75969600.a Wed Jan 26 14:32:00

    $ ....................................................... Ready for the next command.


    The sort command will be invoked tomorrow morning at 4 o''clock. The job ID number
    is (7596600.a).

    What does at do with the possible output produced by your command—in this case,
    the output of sort? If you don''t specify an output file, the output is mailed
    to you, and you can find it in your mailbox.


    Run a job using output redirection.


    +   $ 04 tomorrow [Return] ................... Specify the time and date.

    sort BIG_FILE > BIG_SORT[Return] ...... Save output in BIG_SORT.

    [Ctrl-d] ............................................ Indicate the end of the
    command list.

    user=david ......................... 75969600.a Wed Jan 26 14:32:00

    $ ....................................................................... Prompt.


    The output of the sort command is redirected to BIG-FILE.

    You can use cat, vi, or any of the pagination commands to look at the BIG_FILE.file.


    Run a job using input redirection.


    +   $ at noon Wed [Return] ........................... At on Wednesday.

    mailx david < memo [Return] ............ Mail to david the memo file.

    [Ctrl-d] ............................................ End of the list of the commands.

    user=david ......................... 75969600.a Wed Jan 26 14:32:00 2001

    $ ....................................................................... Prompt.'
  merge: -1
  pgno: 415
- img_proc: true
  md: '# Chapter 13 Farewell to UNIX


    This mails your memo to david at noon on Wednesday. A file called memo must be
    in your current directory before noon on Wednesday.


    Execute the script file called cmd_file [Return] ... at 3:30 p.m. on Friday.


    ```

    $ 1530 Fri < cmd_file [Return] . . Input comes from cmd_file.

    user=david7596901.a . . Fri Jan 28 14:32:00 2001

    $_ Ready for the next command.

    ```


    at Options Table 13–2 summarizes the at command options.


    Show the list of your jobs that are scheduled to run later (submitted to at).


    ```

    $ -l [Return] . . . . . . . . . . List all jobs.

    75969601.a . . . . . . . . at Fri Jan 26 14:32:00 2001

    $_ . . . . . . . . . . . . Prompt.

    ```


    Remove the job from the at queue.


    ```

    $ -r 75969601.a [Return] . . . . Remove the job.

    $ -l [Return] . . . . . . . . . Check the at queue.

    $_ . . . . . . . . . . . . . . Nothing is in the queue.

    ```


    You must specify the job process ID you intend to remove from the queue. You can
    remove more than one job from the queue by specifying the jobs'' process IDs on
    the command line, separated by a space.


    # 13.2.3 Revealing the Command Type: The type Command


    The type command is useful when you want to know more about a command. It shows
    the specified command is a shell program or a shell built-in command. The built-in
    commands are part of the shell, and no child process is created when any of them
    are invoked.


    Table 13–2

    The at command options.


    | Option | Operation |

    | -l | List all jobs that are submitted with at. |

    | -m | Mails you a short message of confirmation at completion of the job. |

    | -r | Removes the specified job numbers from the queue of jobs scheduled by at.
    |'
