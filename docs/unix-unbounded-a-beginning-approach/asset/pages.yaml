  md: '# Appendix C


    # # Command Summary


    The following is a list of the UIX commands (utilities) in alphabetical order.
    The numbers after the commands are the page numbers. To refresh your memory, the
    command line format is repeated here.


    The command line format.


    ```

    $ command [ -options ] [ arguments ]

    ```


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_442_0.png)


    | | 228 |

    |---|---|

    | alias (ksh) Creates aliases for commands. |


    | | 393 |

    |---|---|

    | at. This command runs your programs at a later time or date. You can specify
    the time and date in different formats. It executes your commands at the specified
    time even if you are not logged in. |


    | Option | Operation |

    |---|---|

    | -l | Lists all jobs that are submitted with at. |

    | -m | Mails you a short message of confirmation at completion of the job. |

    | -r | Removes the specified job numbers from the queue of jobs scheduled by at.
    |'
