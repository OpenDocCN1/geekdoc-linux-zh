    $ echo ''< > " $ ? & l\''[Return] . . . Use the echo command and single quotation
    marks.

    < > " $ ? & __

    . . . . . The prompt is back.

    ```


    The spaces between the characters are preserved.


    # 8.2 SHELL VARIABLES


    The shell program handles the user interface and acts as a command interpreter.
    In order for the shell to serve all your requests (executing commands, manipulating
    files, etc.), it needs to have certain information and to keep track of that information
    i.e., your home directory, terminal type, and prompt sign.


    This information is stored in what are called the shell variables. Variables are
    named items you set specific values to control or customize your environment.
    The shell supports two types of variables: environment variables and local variables.


    Environment Variables are also known as standard variables; they have names that
    are known to the system. They are used to keep track of the essential things and
    are usually defined by the system administrator. For example, the standard variable
    TERM is assigned to your terminal type:


    ```

    TERM=vt100

    ```


    Local Variables Local variables are user defined; they are entirely your control.
    You can define, change, or delete them as you wish.


    # 8.2.1 Displaying and Removing Variables: set and unset Commands


    You can use the set command to find out what shell variables are set for your
    shell to use.'
