    # EXPLORING THE shell PROGRAMMING BASICS


    Now that you know you can place a sequence of commands in a file and create a
    simple script file, let''s explore the shell script as a full-powered programming
    language that you can use to write applications.


    Like any programming language, the shell provides you with commands and constructs
    that help you write well-structured, readable, and main-tainable programs. This
    section explains the syntax of these commands and constructs.


    # 11.3.1 Comments


    Documentation is important when writing computer programs, and writing a shell
    script program is no exception. Documentation is essential to explain the purpose
    and logic of the program and commands used in the program that are not obvious.
    Documentation is for you and anyone else who reads your program. If you look at
    a program a few weeks after you''ve written it, you will be surprised at how much
    of your code do not remember.'
