  md: 'To remove the special meaning of the backslash, precede it with a backslash.


    **Double Quotation Marks** You can use the double quotation marks ["] to override
    meaning of most of the special characters. Any special character between a pair
    of double quotation marks loses its special meaning, except the dollar sign (before
    a variable name), the single quotation mark, and the double quotation mark. (You
    use the backslash to remove their special meanings.)


    Double quotation marks also preserve the white-space characters, i.e. the blank
    space, tab, and new line characters. The use of double quotation marks for this
    purpose was demonstrated in the **echo** command examples.


    The following command sequences show the application of the double quotation


    ```

    $ echo > [Return] ................................................ Display the
    sign.

    syntax error: ''newline'' or ''unexpected

    $ ........................................................................ And
    the prompt appears.

    ```


    The shell interprets your command as redirecting the output of the **echo** command
    to a file. It looks for the filename and because none is specified, it responds
    with the cryptic error message.


    ```

    $ echo "> [Return] ........................................ Enclose the argument
    with double

    quotation marks. The > is displayed.

    ```


    ```

    $ is-C [Return] ................................................... Check the
    current directory files.

    memos             myfirst REPORTS

    $ echo * [Return] ................................................... Use a metacharacter
    as the argument

    memos             myfirst REPORTS

    ```


    The shell substitutes * with the names of all the files in your current directory.


    ```

    $ echo "*" [Return] ........................................ Now use the double
    quotation marks.

    $ ........................................................................................
    And the prompt appears.

    ```


    No substitution occurs between the double quotation marks. Therefore, the special
    meaning of the * is removed.


    Display the message "The UNIX System".


    ```

    $ echo "\The UNIX System\" [Return]

    "The UNIX system"

    ```


    A backslash is necessary before a double quotation mark to override the special
    meaning of the double quotation marks.'
