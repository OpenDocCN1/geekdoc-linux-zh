  md: '# Operating System Model


    Using the software layers approach, you can view the operating system as a layered
    set of software. Figure 1–6 shows a model of an operating system and its program
    layers. Input from a user or an application program travels through the layers
    to reach the hardware, and results from the hardware travel back to the user through
    the same layers. Let''s explore the general responsibilities of each layer.


    **Kernel Layer** The kernel is the innermost layer of the operating system ware.
    It is the only layer that interacts directly with the hardware. This provides
    a measure of machine independence within the operating system. In theory at least,
    an operating system can be altered to interact with a different set of hardware
    by making changes to the kernel only. It provides the basic functions of an operating
    system, including loading and executing programs and allocating hardware resources
    (CPU time, access to disk drives, and so on) to individual programs. Localizing
    the interaction between hardware and software in this layer isolates the users
    of the application level from direct knowledge of hardware specifications.


    **Service Layer** The service layer accepts service requests from the command
    layer, or the application programs, and translates them into detailed instructions
    to the kernel. Processing results, if any, are passed back to the program that
    requested the service. The service layer consists of a set of programs that provide
    the following type of services:


    +   * Access to I/O devices—for example, the movement of data from an application
    to a printer or terminal

    * Access to storage devices—for example, the movement of data from a tape drive
    or a magnetic disk to an application program

    * File manipulation—for example, opening and closing files, reading from a file,
    and writing a file

    * Other services such as window management, access to communication networks,
    basic database services


    Figure 1–6

    Operating systems layers.


