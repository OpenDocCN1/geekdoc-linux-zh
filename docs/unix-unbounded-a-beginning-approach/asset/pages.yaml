    # sort Options


    The sort example showed that the result of the sort command, the sorted output,
    is probably not what you would consider sorted. The sort command gives you freedom
    to sort files in a variety of options. Table 8–5 summarizes some of the useful
    options.


    -b Option The -b option causes sort to ignore the leading blanks (tabs and space
    characters). These characters are usually delimiters (field separators) in your
    file, and when you use this option sort does not consider them in sort comparison.


    -d Option The -d option, used for dictionary sorting, uses only letters, digits,
    and blanks (spaces and tabs) in sort comparison. It ignores the punctuation and
    control characters.


    -f Option The -f condition allows lowercase characters as uppercase characters;
    it ignores the difference between them in sort comparison.


    -n Option The -n option causes numbers to be sorted by their arithmetic values
    rather than their first digit. This includes ascribing minus signs and decimal
    points to their arithmetic values.


    -o Option The -o option places the output in a specified file instead of the standard
    output.


    -r Option The -r option reverses the order of the sort, such as z to a instead
    of a to.


