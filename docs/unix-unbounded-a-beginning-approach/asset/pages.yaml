  md: '# Chapter 5


    # Introduction to the UNIX File System


    # 101


    specified in the command line). For example, type cat myfirst yourfirst and press
    [Return] to display the contents of the two files, myfirst and yourfirst, on the
    screen.


    If the file is long, all you see on the screen is the last 23 lines of the file;
    the rest of the lines scroll up your eyes. Unless you are a fast reader, this
    is not much use. You can stop the scrolling process by pressing [Ctrl-s]. To continue
    scrolling, pressing [Ctrl-q].


    It is rather inconvenient to look at the contents of a file in this manner. Please
    be patient; the best is yet to come. UNIX has other commands that show a long
    file at a time.


