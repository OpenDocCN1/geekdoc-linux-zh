  md: '# Chapter 8


    # Exploring the Shell


    # 195


    shell executes the program for you. Figure 8–2 shows the user interaction with
    the shell program.


    The shell also contains several built-in commands. These commands are part of
    the shell itself and are recognized and executed internally. You already know
    some of the built-in commands (cd, pwd, and others).


    The standard UNIX system comes with more than 200 utility programs. One of these
    programs is sh, the shell itself.


    # 8.1.1


    # Understanding the Shell''s Major Functions


    The shell is the most frequently used utility program on the UNIX system. It is
    a sophisticated program that manages the dialogue between the user and the UNIX
    system. It is a regular executable C program that is usually stored in /bin directory.
    One of the most commonly used shell programs is the Bourne shell, named after
    its developer; it is stored under the name sh in the /bin directory. When you
    log in, an interactive Bourne shell is invoked automatically. However, you can
    invoke another copy of the shell by typing sh at the prompt.


    The shell includes the following major features. You are already familiar with
    some of these features, and the rest of them are explored in this chapter.


    **Command Execution** Command (program) execution is a major function of the shell.
    Just about anything you type at the prompt is interpreted by the shell. When you
    press [Return] at the end of the command line, the shell starts analyzing your
    command; if there are filename substitution characters, or input/output redirection
    schemes, it takes care of them, and then executes the appropriate program.


    **Filename Substitution** If filename substitution (also called filename generation)
    is specified on the command line, then the shell first performs the substitution


    # Figure 8–2


    User interaction with the shell.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_216_0.png)'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'tion and executes the program. The shell program itself is not involved in
    the substitution process. (The filename substitution characters—metacharacters
    * and ?—were discussed in chapter 7.)


    I/O Redirection The input/output redirection is handled by the shell. Again the
    shell program itself is not involved, and the redirection is set up before the
    command execution. If input or output redirection is specified on the command
    line, the shell opens the file and connects it to the standard input or output
    respectively. This topic was discussed in chapter 7.


    Pipes, also called pipelines, let you connect shell programs together to perform
    a more complex task. The vertical line on the keyboard, [1], is the pipe operator.


    Environment Control The shell lets customize your environment to suit your needs.
    By setting the appropriate variables, you may change your home directory, prompt
    sign, or other aspects of your working environment.


    Background Processing The background processing capability of the shell allows
    you to run programs in the background while doing other jobs in the foreground
    for time-consuming, noninteractive programs.


    Shell Scripts Commonly used sequences of the shell commands can be stored in files
    called scripts. The name of the file can be used to execute the stored program,
    enabling you to execute the stored commands with a single command. The shell also
    includes language constructs that allow you to build shell scripts that perform
    more complex jobs. Shell scripts are discussed in chapter 11.


    # 8.1.2


    # Displaying Information: the echo Command


    You can use the echo command to display messages. It displays its arguments on
    your terminal, the standard output device. Without the argument, it produces an
    empty line and appends a new line to the end of the output. For example, if you
    type echo here and press [Return] at the prompt, you will see the following:


    hello there


    The argument string can be any number of characters. However, if your string contains
    any metacharacters, the string must be enclosed in quotation marks. (This topic
    is discussed further in this chapter.)


    Table 8–1 shows the characters that you can use as part of a shell to control
    the format of the message. These characters are preceded by a backslash (\) and
    are interpreted by the shell to produce the desired output. They are also called
    escape characters.


    The backslash itself is a shell metacharacter. Therefore, if it is used in your
    string, it must be enclosed in quotation marks.


    The following command sequences show how to use the echo command, and the result
    of incorporating the escape characters in the argument string.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_217_0.png)'
