    # 7.2.2 Input Redirection


    The input redirection operator allows you to issue commands or run programs that
    get their input from a specified file. The shell recognizes the less than sign
    (<) as the input redirection operator. The format is as follows:


    ```

    command < filename

    ```


    or


    ```

    command << word

    ```


    For example, to send mail to another user, you use the mailx command (mailx is
    discussed in chapter 9) and type mailx daniel < memo. This command tells the computer
    to send mail to the user called daniel (his user id). The input to mailx is not
    coming from the standard input device, your terminal, but the file called memo.
    Thus, the input redirection (<) is used to indicate where the input comes from.


    Try using the cat command with the input redirection operator.


    +   Type cat < mydir.list and press [Return] to display the contents of mydir.list;
    UNIX responds:


    ```

    myfirst         yourlast

    ```'
