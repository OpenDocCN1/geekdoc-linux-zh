  md: '# Terminal Session


    Before starting your first terminal session, spend a few minutes to determine
    the following information about your system.


    Find out your login name (User Id).

    If your system requires a password to log in, then find out your password.

    Find out which keys are assigned as the following:


    +   - erase key

    - kill key

    - interrupt key


    Now that you are ready, start by turning on your terminal and wait for the login:
    prompt.


    +   1. Using your User Id and password, log on to the system. Take notice of the
    messages appearing on the screen.

    2. Check the prompt sign and find out shell variety you are using.

    3. Use the who command to find out who is currently logged on to the system and
    the last time the system was booted.

    4. Use the who command options to find out the number of users in the system and
    the last time the system was booted.

    5. Find out what help utilities are available in your system.

    6. Use the date command to see the current date and time.

    7. Use the cal command to find the day of your birth date.

    8. Look at the calendar for the year 2001.

    9. Use the passwd command to change your password.

    10. Try new passwords that do not meet the password format, so that you become
    familiar with the types of error messages that UNIX displays.

    11. After you have successfully changed your password, log out and log in using
    your new password.

    12. Try to correct your typing mistakes using the erase key.

    13. Try to terminate a line of command using the kill key.

    14. Log off to end your session.'
