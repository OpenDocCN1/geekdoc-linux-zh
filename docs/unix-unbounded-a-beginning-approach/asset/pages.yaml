    and their values.


    # 8.6.2 Korn Shell (ksh) Options


    The Korn shell provides a number of options to turn its special features on or
    off. To turn an option you use the set command with -o (option) followed by the
    option name. To list your options simply type set -.

    noclobber The noclobber option prevents you from clobbering your files, as it
    prevents you from overwriting an existing file if you redirect output from a command.
    This can save you from losing important data by inadvertently overwriting your
    files.


    Suppose a file called xyz exists in your current directory. The following command
    sequences demonstrate the use of the noclobber option.


    $ set -o noclobber [Return].....................................................
    Set the noclobber option.

    $ who > xyz....................................................................................
    Redirect the output to xyz.

    xyz: file exists..................................................................................
    Warning message.

    $.......................................................................................................
    The prompt appears.


    If you really want to overwrite an existing file, ksh will oblige. Type a [|]
    pipe symbol after the redirection operator.


    $ who > | xyz [Return]...................................................................
    xyz file is overwritten.

    $.......................................................................................................
    The prompt appears.


    To turn off the noclobber option you use the set command with the +o option. For
    example,


    $ set +o noclobber [return].....................................................
    The noclobber option is turned off.

    $.......................................................................................................
    The prompt appears.'
