  md: '# COMPUTER HARDWARE


    Regardless of how complex or simple a computer system is, it has four fundamental
    functions: input, processing, output, and storage. Also, computers consist of
    two distinct parts: hardware and software. These two parts complement each other,
    and the integration of hardware and software enables computers to perform their
    fundamental functions.


    Figure 1–1 shows the four functions of a computer system and the typical hardware
    devices associated with each function.

    Most computer systems have five basic hardware components that work together to
    accomplish the computer’s required tasks. The number implementation, complexity,
    and power of these components varies among computer systems. However, the functions
    performed by each component are generally quite similar. These components are
    as follows:


    +   - Input devices

    - Processor unit

    - Internal memory

    - External storage unit

    - Output devices


    The way these components are put together and arranged is called the system hardware
    configuration. For example, in one system the processor unit and the external
    storage unit may be housed in a single component; in another system, they may
    separate components.


    # 1.3.1 Input Devices


    Input devices are used to enter instructions or data into the computer. Numerous
    input devices are available, and their number is growing. The keyboard, light
    pen, scanner, and mouse are the most popular input devices, with the keyboard
    being used almost universally.


    > Certain devices can be used for either input or output—magnetic disks and touch
    screen terminals, for example.


    Figure 1–1

    Functional parts of a computer system.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_26_0.png)'
