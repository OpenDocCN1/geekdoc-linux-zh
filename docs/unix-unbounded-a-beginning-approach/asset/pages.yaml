  md: "such as testing two numbers for equality, or complex, like testing several\
    \ commands that are related with logical operators. The test command is particularly\
    \ helpful in writing script files. In fact, the brackets around the condition\
    \ in the if statement are a special form of the test command. Figure 11–15 shows\
    \ a sample script file using the test command to test the if condition.\n\n![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_337_0.png)\n\
    \n+   1. The test script prompts the user to enter (Y)es or (N)o, and then reads\
    \ the user answer.\n2. If the user response is the letter Y, the test command\
    \ returns zero, and the if condition is true, then the body of the if is executed.\
    \ The message Glad to hear that is displayed, and the body of the else is skipped.\n\
    3. Any input from the user other than a single letter Y makes the if condition\
    \ fail; the body of the if is skipped and the else is executed. The message Go\
    \ home is displayed.\n\nInvoking test with Brackets The shells offer another way\
    \ to invoke the test. You can use brackets [ and ] instead of the word test. Then\
    \ the if statement can be written as follows:\n\n```\ntest \"$variable\" = value\n\
