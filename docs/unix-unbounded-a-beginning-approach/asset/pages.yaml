    # 5.5 DISPLAYING FILE CONTENTS


    So far in this book you have learned file manipulation commands to scan directories
    locate files and look at a list of filenames. What about looking at the content
    of a file? You can always print a file to obtain a hard copy of its contents,
    or use the vi editor to open a file and look at it on the screen. You can also
    use the cat command for this purpose.


    You can use the cat (for catenary) command to display a file (or files), to create
    files, and join files. In this chapter, only the display capability of the cat
    command is discussed. For example, to display a file named myfirst, you type cat
    myfirst and press [Return].


    If myfirst exists in your current directory (if no name is specified, the default
    is your current directory), the cat command displays the contents of myfirst on
    the screen (standard output device). If you specify two filenames, you see the
    contents of the two files (one after the other in the same sequence'
