    # A MENU-DRIVEN APPLICATION


    Scenario Suppose you want to write a menu-driven application that facili-

    tates keeps track of your UNIX books. You want to be able to update the list

    of your books, to know whether any specified book is in your library (or not)

    and whether a book has been borrowed, when it was, and what it was.


    Of this is a typical application for a database, but the goal is to prac-

    time of the UNIX commands and to get a feeling about how you can put

    the commands and constructs together to create useful programs.


    # The Hierarchy Chart


    12–9 shows the hierarchical chart of a menu-driven UNIX library pro-

    gram called ULIB. When you invoke the ULIB, it shows the main menu and

    waits for you to enter your choice. Each entry takes you to another level of

    menus. Like most of the menu-driven interfaces, the top levels of ULIB’s hi-

    archy chart presents the user interface. In this case, the three programs ULIB,

    EDIT, and REPORTS show the appropriate menu and wait for the user’s

    selection of the items on the menu.


    Each box in the hierarchy chart represents a program. Let’s start with the first

    program, ULIB at the top of the chart. Figure 12–10 shows one how to write

    this program. The line numbers are not part of the source code. Whenever nec-

    essary, the line numbers are referred to provide more explanation on the

    commands or logic of the program.


