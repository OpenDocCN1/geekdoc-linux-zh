    # 9.2.3 Reading Mail


    In order to read your mail, you type mailx with no argument. If you have mail
    in your mailbox, then mailx shows two lines of information followed by a numbered
    list of headers in your mailbox and then the mailx prompt, which by default is
    a question mark. At this point, mail is in the command mode, and you can use commands
    to delete, save, or reply to messages, etc. You press [q] at the ? prompt to exit
    mailx.


    The list of headers consists of one line for each mail item in your mailbox. The
    format is as follows:


    ```

    > status message # sender date lines/characters subject

    ```


    Each field in the header line conveys certain information about your mail:


    +   * The status indicates that the message is the current message.

    * The status is N if the message is new. This means that you have not read this
    mail.

    * The status is U (unread) if the message is not new. That means you have seen
    the message header before, but you have not read the mail itself yet.

    * The message # indicates the sequence number of the mail in your mailbox.

    * The sender is the login name of the person who sent you the mail.'
