  md: '# UNIX UNBOUNDED: A BEGINNING APPROACH


    MBOX The MBOX variable saves your read messages automatically with the specified
    filename. The default filename is $HOME/mbox.


    To change the specified filename for read messages, you could type set MBOX=$HOME/EMAIL/mbox
    and press [Return].


    Saving a message in another file or using the xit command overrides the automatic
    saving process.


    The PAGER variable is set to a paging command and works with the setup of the
    cr variable. The default paging command is pg.


    To change the paging command to more, type set PAGER=''more'' and press [Return].


    record The record variable is set to the filename that captures all your outgoing
    mail automatically. There is no default value for this variable.


    To save outgoing mail in keep, type set record=$HOME/EMAIL/keep and press [Return].


    This command does not create the EMAIL directory. It assigns the specified directory
    to the record variable. You use the mkdir command to create the directory.


    SHELL The SHELL variable is set to the shell program you intend to use. It is
    applicable when you use ! or ~ to issue a command to the shell while you are in
    mailx environment. The default is the sh shell.


    To change the default SHELL variable, you could type set SHELL=esh and press [Return].
