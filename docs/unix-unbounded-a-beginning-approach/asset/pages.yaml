    # The if-then-else Construct


    By adding the else clause to the if construct, you can execute certain commands
    when the test of the condition returns a false status. The syntax of this more
    complex if construct is as follows:


    ```

    if [condition]

    then

    true-commands

    ...

    last-true-commands

    else

    false-commands

    ...

    last-false-commands

    fi

    ```


    +   1. If the condition is true, then all the commands between the then and else,
    the body of the if, are executed.

    2. If the condition is false, the body of the if is skipped and all the commands
    between else and fi, the body of the else, are executed.


    Modify the svi script file to include the if and else statements. Figure 11–12
    shows this modification.


    # Figure 11–12


    Another version of the svi script file.


    ```

    $ svi

    #

    # svi: save and invoke vi (svi) program.

    # Add if and else statements

    if [$# = 1] # check for the number of command line arguments.

    then

    cp $1 $HOME/keep # copy specified file to keep.

    vi $1 # invoke vi with specified filename.

    else

    echo "You must specify a filename. Try again." #display error message

    fi # end of the if statement.

    exit 0

    # end of the program, exit.

    $_

    ```'
