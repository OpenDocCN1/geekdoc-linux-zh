  md: '# DISK ORGANIZATION


    The information a computer uses is stored in files. The memos you write, the programs
    you create, and the text you edit are all stored in files. But where are the files
    stored? How do you keep track of them? You give each file a name, and the files
    are usually saved on a particular section of the hard disk. By considering the
    capacity of disks, how do you keep track of the whereabouts of the files on the
    disk? You divide your disk into smaller units and subunits, name each of them,
    and store related information in the same unit or subunit.


    UNIX follows the same procedure in handling your disk. While you are working on
    a computer


    UNIX allows you to divide your hard disk into many units (called directories),
    and subunits (called subdirectories), thereby nesting directories within directories.
    UNIX provides methods to create, organize, and keep track of directories and files
    on the disk.


    # FILE TYPES UNDER UNIX


    For the UNIX operating system, a file is a sequence of bytes. UNIX does not support
    other structures (such as records or fields), as some other operating systems
    do. UNIX has three categories of files:


    +   **Regular Files** Regular files contain sequenees of bytes that could be programming
    code, data, text, and so on. The files you create using the vi editor are regular
    files, and most of the files you manipulate are this type of file.


    +   **Directory Files** In most respects, a directory file is a file like any
    other file, and you name it as name any other file. It is not, however, a standard
    ASCII text file. The directory file is a file that contains information (like
    the filename) about other files. It consists of a number of such records in a
    special format defined by your operating system.


    +   **Special Files** Special files (device files) contain specie information
    corresponding to peripheral devices such as printers, disks, and so on. UNIX treats
    I/O (input and output) deiecees as files, and each device in your system—the printer,
    floppy disk, terminal, and so on—has a separate file.


    See page xxii for an explanation of the icons used to highlight information in
    this chapter.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# 5.3 ALL ABOUT DIRECTORIES


    Directories are an essential feature of the UNIX file system. The directory system
    provides the structure for organizing files on a disk. To visualize a disk and
    its directory structure, think of your disk as a file cabinet. A file cabinet
    may have several drawers, which can be compared to directory directories. A drawer
    may be divided into several sections, which are comparable to subdirectories.


    In UNIX, the directory structure is organized in levels and is known as a hierarchical
    structure. This structure allows you to organize files so you can easily find
    any particular one. The highest level directory is called the root and all other
    directories branch directly or indirectly from it. Directories do not contain
    the information in your files, but instead provide a reference path to you to
    organize and find your files. Figure 5–1 shows the root and all other directories.


    One example of a hierarchical structure is your family tree. A couple may have
    a child, that may have several children, and each of those may have more children.
    The parent and child describe the relationship between levels of the hierarchy.
    Figure 5–2 shows this relationship. Only the root directory has no parents. It
    is the ancestor of all other directories.


    A hierarchical structure is often illustrated as a tree. The tree representing
    a file structure is usually pictured upside down, with its root at the top. Using
    this tree analogy, the tree’s root represents the root directory, the branches
    directories, and the leaves are files.


    # The Home Directory


    The system administrator creates all user accounts on the system and associates
    each user account with a particular directory. This directory is the home directory.
    When you log on to the system, you are placed automatically into your home directory.
    From this single directory (your home directory), you can expand your directory
    structure according to your needs. You can add as many subdirectories as you like,
    and by dividing subdirectories into additional subdirectories, you can continue
    expanding your directory structure. Figure 5–3 shows that the directory called
    usr has three subdirectories called david, daniel, and gabriel. The directory
    david contains three files, but the other directories are empty.


    Figure 5–1

    Directory structure.


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_101_0.png)'
