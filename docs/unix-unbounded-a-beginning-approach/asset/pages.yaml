    and gets control. The shell program continues, starting execution from the same
    address it was before going to sleep (recall this address was stored in the process
    table system data area as return address) and the prompt is displayed.


    What happens if the child is a background process? In that case, the parent (shell)
    does not call the wait routine; it continues in the foreground, and you see the
    prompt right away.


    Who creates the first parent and child processes? When UNIX is booted, the init
    process is activated. Next, init creates one system process for each terminal.
    Thus, init is the original ancestor to all processes in the system. For example,
    if your system supports 64 concurrent terminals, then init creates 64 processes.
    When you log in to one of these processes, the login process executes the shell.
