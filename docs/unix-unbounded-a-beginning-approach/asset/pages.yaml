    # # 3.2 USING SOME SIMPLE COMMANDS


    When you are using a UNIX system, you have hundreds of UNIX commands and utilities
    at your disposal. Some basic commands you will use frequently, some you will use
    occasionally, and some you never use! The difficult part of systems such as UNIX
    that have a rich set of commands is learning to master the details of each command.
    Fortunately, most UNIX commands share the same basic structure, and on-line help
    is available on most of the UNIX systems to assist your memory.


    # # 3.2.1 The Command Line


    Every operating system has commands that facilitate use of the system. By typing
    the commands, you tell the UNIX system to do something. For example, the command
    date tells the system to display the date and time. To see this type, use date
    and [Return]. This line of instruction is known as the command line. UNIX interprets
    the press of [Return] as the end of the command line and responds by showing the
    current date and time on the screen:


    ```

    $ Sat Nov 29 14:00:52 EDT 2001

    ```


    Each time you give UNIX a command, it carries out the command and then displays
    a new prompt, indicating that it is ready for the next command.


    # # 3.2.2 Basic Command Line Structure


    Each command line consists of three fields:


    +   - Command name

    - Options

    - Arguments


    Figure 3–9 shows the general form of a UNIX command.


    Figure 3–9

    The command line format.


    ```

    $ command [- options ] [ arguments ]

    ```


    ![](img/9bc78cf6fd0dc9f28ed030a3704f5a4d_58_0.png)'
