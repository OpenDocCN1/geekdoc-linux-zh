    # 3.1.3 Logging Off


    The process of signing off when you have finished with the system is called logging
    off or logging out. When you want to log off, the prompt sign must be displayed
    on the screen. You cannot log off in the middle of a process. To log off, at the
    prompt sign press [Ctrl-d]. (This means to simultaneously hold the key labeled
    Ctrl (for control) and press key for the letter d.) When this key sequence is
    pressed, nothing is displayed on the screen; the command, however, is recognized
    by the system. The UNIX system responds first by displaying logging messages that
    your system administrator has set up. The screen shows your system''s standard
    welcome message and login: prompt. This lets you know that you have logged off
    properly and that the terminal is ready for the next user.


