    # 2.4.7


    # Utilities


    The UNIX system includes more than one hundred utility programs, also called commands.
    Utilities are part of the standard UNIX system and are designed to perform a variety
    of functions required by the users. These utilities include the:


    +   - Text editing and text formatting utilities (see chapters 4 and 6)

    - File manipulation utilities (see chapters 5 and 7)

    - Electronic mail (e-mail) utilities (see chapter 9)

    - Programmers'' tools tools (see chapter 10)


    # 2.4.8


    # System Services


    The UNIX system provides a number of services that facilitate administration and
