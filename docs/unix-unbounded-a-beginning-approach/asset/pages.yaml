    # 8.3 MORE METACHARACTERS


    As you remember from chapter 7, metacharacters, or special characters, are interpreted
    and processed in a special manner by the shell. So far, we have discussed the
    file substitution and redirection metacharacters. This section explores some more
    of them.


    # 8.3.1 Executing the Commands: Using Single Back Quotation Marks


    The single back quotation marks `\` ` tell the shell to execute the enclosed command
    and to insert the command''s output at the same point on the command line. It
    is also called *command substitution*. The format is as follows:


    ```

    `command`

    ```


    where is the name of the command to be executed.


    The following command sequences show examples of command substitution.


    ```

    $ echo The date and time is: ''date'' [Return] . Command date is executed.

    The date and time is: Mon 16 30:14:14 EDT 2001

    $ _

    ```


    The prompt is back.


    The shell scans the command line, finds the back quotation marks, and executes
    it replaces the ''date'' on the command line with the output from the date and
    executes the echo command.


    ```

    $ echo "List of filenames in your current directory:"n ''ls -C'' > LIST [Return]

    $ cat LIST [Return]

    ```


    Check what you have stored in LIST.


    +   List of filenames in your current directory:

    memos myfirst REPORT

    $ _


    Ready for the next command.


    # 8.3.2 Sequencing the Commands: Using the Semicolon


    You can enter a series of commands on a command line, separated by semicolons.
    The shell executes them in sequence from left to right.'
