  md: '# Terminal Session


    Practice the following commands on your system.


    +   1. Sort a file at 13:00 tomorrow.

    2. Send mail to another user at 6 p.m. on Wednesday.

    3. Use the time command on a few commands such as sort, spell, and so on, and
