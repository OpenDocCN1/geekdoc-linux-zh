    # 7.5 FILENAME SUBSTITUTION


    Most manipulation commands require filenames as arguments. When you want to manipulate
    a number of files, for example, to transfer all files with a filename starting
    with letter a to another directory, typing all the files by one is tiring and
    boring. The shell supports file substitution, which allows you to select which
    filenames match a specified pattern. These patterns are created by specifying
    filenames that contain certain characters that have a special meaning to the shell.
    These special characters are called metacharacters (or wild cards). Table 7–6
    summarizes the wild cards that can stand for one or more characters in a filename.


    File substitution metacharacters (wild cards) can be used in any part, at the
    beginning, middle, or end, of the filename to create a search pattern.


    # 7.5.1 The ? Metacharacter


    The question mark (?) is a special character that the shell interprets as a single
    character substitution and expands the filename accordingly.


    Table 7–6

    The file substitution metacharacters.


    | Key | Operation |

    | ? | Matches any single character |

    | * | Matches any string, including the empty string |

    | [list] | Matches any one of the characters specified in the list |

    | ![list] | Matches any one of the characters not specified in the list |'
