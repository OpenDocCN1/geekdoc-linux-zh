  md: '# Welcome


    Congratulations! If you are reading this it means you are about to embark on an
    exciting journey. A journey that will not only improve your technical skills but
    also introduce you to the exciting world of information security and penetration
    testing. In this booklet, you will learn how to set up a penetration testing lab
    where you will hone your hacking skills in a safe training environment before
    you unleash them on the world.


    This book follows a step by step approach. We will start by prepping your hardware
    and downloading the necessary software you will need to get your lab in professional
    shape. We will then follow that with installing virtualization software and finally
    building your virtual machines. Ready to go? Ok, let''s do this!'
  merge: -1
  pgno: 5
- img_proc: true
  md: '# # Hardware Preparation


    Every great human endeavor starts with the laying of a solid foundation. The foundation
    of your penetration testing lab is the hardware which you will need to run multiple
    machines. These machines will be running different operating systems which you
    will need to host multiple services and applications.


    This booklet aims to build a real-world penetration testing lab so not only will
    we be configuring Kali Linux which is a platform with many of the security tools
    you will need, we will also configure a few exploitable machines which will serve
    as targets for your simulated attacks. Honing your skills by exploiting systems
    will go a long way in making you a skilled penetration tester. We want to build
    an environment where you can exploit and compromise targets so that you are able
    to replicate this when you move on to real world penetration testing.


    You may think that this sounds very expensive in that you will need plenty of
    hardware for your lab. The good news is that virtualization technology will keep
    your hardware costs down. In the past, before virtualization was the industry
    norm, you would have needed to procure multiple machines to host these servers
    and applications but now you can host all of them on a single machine assuming
    of course you have the right amount of memory, CPU and storage resources.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# Minimum Requirements


    Here are the minimum requirements to host the virtual machines we will use in
    this book to setup our pen testing lab:


    +   * x64 CPU - Quad Core 1.7 GHz (Virtualization Capable)

    * RAM - 8GB

    * Storage – 65GB


    These minimum requirements will give you a working pen testing lab where you will
    have the capacity to run any two or perhaps three virtual machines at the same
    time. You may however at some point need to run many more machines at the same
    time and so this booklet recommends the following hardware specification for your
    virtual machine host.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Recommended Requirements


    Here are the recommended requirements to host the virtual machines we will use
    in this book to setup our pen testing lab:


    +   - x64 CPU - i7 2.8 GHz (Virtualization Capable)

    - RAM - 16GB

    - Storage – 135GB'
  merge: -1
