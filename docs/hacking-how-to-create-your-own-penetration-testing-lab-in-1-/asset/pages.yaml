- img_proc: true
  md: '# Enable Virtualization in your BIOS


    To ensure we can run virtual machines, your BIOS needs to be configured to enable
    virtualization. Without this setting enabled you will not be able to install the
    software needed to host your virtual machines.


    To do this you will need to enter your BIOS during startup of your physical machine.
    Each system is different so the key to press to enter the BIOS is different on
    vendor platforms. It is usually F2, F10, F12 or Esc so watch your boot up screen
    carefully to see which keys need to be pressed to enter your machine’s BIOS settings.
    You can also google this if you are not able to find this setting on your specific
    machine.


    Once you have entered the BIOS settings menu you will find the virtualization
    option and it is set to enabled. Below is an example and as you can see it is
    under the ‘Advanced’ tab so you may need to search for it on your system’s menu
    options as well. In some systems, it may not say Virtualization instead say "VT-x".


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_11_0.png)


    Once you have enabled this setting you can then exit the BIOS menu. Make sure
    you remember to save changes. Your system should now restart and virtualization
    should now be enabled'
  merge: -1
  pgno: 11
