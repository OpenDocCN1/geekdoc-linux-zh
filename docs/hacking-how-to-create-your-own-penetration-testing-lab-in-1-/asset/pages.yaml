  md: '# Importing and Configuring the Metasploitable VMware Image


    Importing the Metasploitable VMware Image


    Metasploitable is downloaded as a VMware image so all we need to import it it
    our VMware console. First, we need to extract the downloaded zip file. **Right-click
    on the file** and click on ‘**Extract**’. In the dialog box that opens **browse
    to the location** where you want to store your virtual machine files as per the
    image below.


    Your extracted files should open and you should have a collection of VMware files
    as per the example below.


    | Name | Date modified | Type | Size |

    |---|---|---||

    | Metasploitable.nvram | 2012/05/21 12:45 ... | NVRAM File | 9 KB |

    | Metasploitable | 2012/05/21 12:46 ... | VMware virtual dis... | 1 900 864 KB
    |

    | Metasploitable.vmsd | 2012/05/21 12:46 ... | VMSD File | 1 KB |

    | Metasploitable | 2012/05/21 12:46 ... | VMware virtual m... | 3 KB |

    | Metasploitable.vmf | 2012/05/21 12:37 ... | VMXF File | 1 KB |


    Now that we have extracted the files we follow by importing the virtual machine
    so that we can access it via the VMware console. To begin, open VMware Workstation
    Player and click on ‘**Open a New Virtual Machine**’.


    Browse to the location you extracted your Virtual Machine files to click on ‘**Open**’.


    Your virtual machine should now appear in your virtual machine list. Click on
    ‘**Play virtual machine**’ to start Metasploitable.'
  merge: -1
