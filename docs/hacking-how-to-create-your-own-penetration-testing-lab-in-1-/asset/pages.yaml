  md: '# Configuring the Metasploitable VMware Image


    To ensure working with Metasploitable is a consistent experience in your Penetration
    Testing Lab we need to configure the Metasploitable virtual machine with a fixed
    IP address. To begin we need to login to Metasploitable once we have started it
    and we are presented with the login prompt as per the image below. The **username
    and password** are both msfadmin.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_51_0.png)


    VMWare Workstation Player creates a NAT network for all the virtual machines we
    have created in this lab and the IP address range is random from host to host.
    To see what your VMware NAT network range is ‘ifconfig’ at the prompt. As you
    can see below this virtual machine is on IP address 192.168.83.29 and on a subnet
    mask of 255.255.255.0. **Make a note of yours** as you will need it when we assign
    a fixed IP.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '![](img/dd853c1dd14d8c4c5030bf979b4573ea_52_0.png)


    We also need to ascertain the default gateway assigned to your virtual machine
    by VMware. To check what your default gateway is type `ip route | grep default`
    at the prompt. As you can see below the virtual machine in the example has a default
    gateway of 192.168.56.32. **Make a note of yours** as you will need it in the
    next step.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_52_1.png)


    To set a fixed IP address on Metasploitable we need to **configure the interfaces**
    file located at /etc/network on the Metasploitable file system. To start configuring
    this file open it with nano by typing the command `sudo nano`'
  merge: -1
  pgno: 52
