  md: '# # Installing VMware


    Now that we have our hardware prepared and have downloaded all the software we
    will need; the next step is to install VMware Workstation Player on our machine
    so that we can start building our virtual machines.


    This booklet illustrates the VMware Workstation Player install process on Windows.
    For a detailed explanation on how to install VMware Fusion on an Apple Mac go
    to this VMware knowledgebase: https://kb.vmware.com/selfservice/search.do?language=en_US&cmd=displayKC&externalId=2014097


    Once you double-click the VMware Workstation Player install file you will be presented
    with a splash screen.


    Once the **welcome screen opens**, click on ‘Next’ to start the installation.


    You will then be presented with the **EULA**. Ensure you **select the tick-box**
    to accept the terms and then click on ‘Next’.


    You will now be presented with the **Custom Setup** options where you can change
    the installation directory and enabled an enhanced keyboard driver. Click ‘Next’
    once you have made the changes or leave the default settings.


    You will then move on to the **User Experience Settings** where you can opt to
    let the software check for updates on startup and send anonymous data to VMware
    to help improve the software. You have made the selection, click ‘Next’. Both
    selections are optional and not enabling them will not influence VMware’s features
    or performance.


    Next select the **shortcuts** you want the software to install for you. Desktop
    / Start menu. Once you have made your selection, click ‘Next’.


    You are now ready to start the installation. Click ‘Install’.


    You will be presented with a progress screen which will show you progress'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'being made by your machine on the installation.


    Once the installation has completed click on ‘Finish’ to finalize the installation
    and close the installation wizard.


    When you start VMware Workstation Player for the first time you will be presented
    with a first start welcome message. Select use for non-commercial use and enter
    your email address. Once completed click on ‘Continue’


    Your VMware Workstation Player is now installed and ready to go. Click ‘Finish’
    to open the management console.'
