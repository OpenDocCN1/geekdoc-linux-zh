- img_proc: true
  md: '# A Note on Contention


    As you may be running multiple machines simultaneously, each virtual machine will
    compete with its neighbors for hardware resources which could result in poor performance.
    If possible split your virtual machines across multiple storage devices. USB storage
    devices which are USB 3 or better can easily run virtual machines. Splitting your
    virtual machines across multiple disks will most definitely increase the performance
    of each one.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# USB Wi-Fi Adapters


    To perform wireless penetration testing you will need a USB Wi-Fi adapter which
    is capable of packet injection. Unfortunately, not all USB Wi-Fi adapters are
    created equal and some are not compatible with the tools you will use to perform
    wireless penetration testing. For a list of compatible USB Wi-Fi adapters please
    read this post: https://www.raymond.cc/blog/best-compatible-usb-wireless-adapter-for-backtrack-5-and-aircrack-ng/'
  merge: -1
