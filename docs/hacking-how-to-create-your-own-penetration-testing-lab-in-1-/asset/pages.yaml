  md: '# # Installing Windows 10


    # ## Configuring the Virtual Machine on VMware Workstation Player


    Now that we have Kali up and running let''s install and configure our Windows
    virtual machine.


    The configuration of your Windows 10 virtual machine will be similar to the configuration
    we did for the Kali Linux virtual machine. Refer to the screenshots in the Kali
    Linux section if you need a refresher.


    On the VMware Workstation Play Console click on ‘Create a New Virtual Machine’.


    Click **browse** and navigate to the location where you saved your Windows ISO.
    Once done click ‘Next >''.


    On the next screen, you will need to **fill in the name of the virtual machine**
    as it will appear on the VMware console and you will need to **specify a storage
    location** for the virtual machine files. Once completed, click ‘Next >''.


    On the following screen, you will need to specify the **capacity of the hard drive**
    for your virtual machine. As always is better than less so allocate accordingly.
    **60 GB should be sufficient for your Windows 10 virtual machine.** Once completed,
    click on the ‘Store virtual disk as a single file’ radio button and the click
    ‘Next >’ to continue.


    On the next screen click on ‘Customize Hardware...’


    On the Hardware screen click on ‘Processors’ to increase the processor count.


    As with storage more is better than less. Increase your **processor count to least
    2**. It is recommended that 4 processors be assigned to your Windows virtual machine.
    Click ‘Close’ once you have increased your CPU’s.'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Finally, click on ‘Finish’ to close the ‘Create a New Virtual Machine’ wizard.


    VMware may take a little longer to create the virtual machine due to the size
    of the hard drive. Once this process is completed you can then start the virtual
    machine.'
  merge: -1
