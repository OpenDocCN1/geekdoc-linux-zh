    ## Importing and Configuring the Metasploitable VMware Image


    ### Importing the Metasploitable VMware Image


    Metasploitable is downloaded as a VMware image so all we need to import it in
    our VMware console. First, we need to extract the downloaded zip file. **Right-click
    on the file** and click on ‘**Extract**’. In the dialog box that opens **browse
    to the location** where you want to store your virtual machine files as per the
    image below.


    Your extracted files should open and you should have a collection of VMware files
    as per the example below.


    | Name | Date modified | Type | Size |

    |---|---|---|---|

    | Metasploitable.nvram | 2012/05/21 12:45 ... | NVRAM File | 9 KB |

    | Metasploitable | 2012/05/21 12:46 ... | VMware virtual disk | 1 900 864 KB |

    | Metasploitable.vmsd | 2012/05/21 12:46 ... | VMSD File | 1 KB |

    | Metasploitable | 2012/05/21 12:46 ... | VMware virtual machine | 3 KB |

    | Metasploitable.vmf | 2012/05/21 12:37 ... | VMXF File | 1 KB |


    Now that we have extracted the files we follow by importing the virtual machine
    so that we can access it via the VMware console. To begin, open VMware Workstation
    Player and click on ‘**Open a New Virtual Machine**’.


    Browse to the location you extracted your Virtual Machine files to click on ‘**Open**’.


    Your virtual machine should now appear in your virtual machine list. Click on
    ‘**Play virtual machine**’ to start Metasploitable.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_50_0.png)


    The first time you start Metasploitable it will prompt you as per the image below.
    Select ‘I copied it’ so that VMware creates a new machine ID for it.


    ## Configuring the Metasploitable VMware Image


    To ensure working with Metasploitable is a consistent experience in your Penetration
    Testing Lab we need to configure the Metasploitable virtual machine with a fixed
    IP address. To begin we need to login to Metasploitable once we have started it
    and we are presented with the login prompt as per the image below. The **username
    and password** are both msfadmin.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_51_0.png)


    VMWare Workstation Player creates a NAT network for all the virtual machines we
    have created in this lab and the IP address range is random from host to host.
    To see what your VMware NAT network range is ‘ifconfig’ at the prompt. As you
    can see below this virtual machine is on IP address 192.168.83.29 and on a subnet
    mask of 255.255.255.0. **Make a note of yours** as you will need it when we assign
    a fixed IP.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_52_0.png)


    We also need to ascertain the default gateway assigned to your virtual machine
    by VMware. To check your default gateway is type `ip route | grep default` at
    the prompt. As you can see below the example default gateway is 192.168.56.32.
    **Make a note of yours** as you will need it in the next step.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_52_1.png)


    To set a fixed IP on Metasploitable we need to configure the interfaces file located
    at /etc/network. To start configuring this open it with `sudo nano /etc/interfaces`.


    If you are prompted for an password use msfadmin. To set a fixed IP use the configuration
    as illustrated by the image below but remember to change your NAT address to 192.168.83.10.
    Note that the default gateway and DNS servers are both set to the default gateway
    obtained in the previous step. Once you have configured your file ‘Ctrl+x’ to
    exit and save the changes.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_53_0.png)


    Metasploitable virtual machine is now configured and ready. To shutdown Metasploitable
    type ‘sudo shutdown -h 0’ at the prompt and enter msfadmin if prompted to do so.


