    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_70_0.png)


    To resolve most of these issues we need to modify DVWA''s config file. On your
    DVWA server and type **sudo nano /var/www/html/config/config.inc.php** and hit
    enter.


    Once the config.inc.php file has opened you need to **modify the sections highlighted
    in the example below. Enter your database credentials in the database section**
    and enter **RECAPTCHA keys in the area set aside for these**. You can generate
    RECAPTCHA keys by going to https://developers.google.com/recaptcha/. Once you
    have made the changes ‘Ctrl + x’ to exit and **save your changes.**


    ## DVWA - VMware Workstation 12 Player (Non-commercial use)


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_71_0.png)


    If you are having problems connecting to the MySQL database and all of the variables
    below are Try changing the db_server to 127.0.0.1. A problem due to sockets Use
    the following for the fix:


    # Database management system to use

    RDMS = MYSQL; // Currently disabled


    # Variables

    WARNING: The database specified under db_database WILL BE deleted during setup.


    ```

    db_server = ''127.0.0.1''

    db_database = ''dwan''

    db_user = ''dwan''

    db_password = ''password''

    ```


    # Using with PostgreSQL

    RDMS = PostgreSQL;


    # Using ''RECAPTCHA CAPTCHA''

    You will need to generate a key and secret at: https://www.google.com/recaptcha/admin/create


    ```

    recaptcha_site_key = ''6LCX_T66N55ALQit17ui-daP1B8HMTi_ylq=''

    recaptcha_secret_key = ''6LCX_T66N55ALw_wYAXU00HP2fZ2KiSNUQ=''

    ```


    # Default security

    Default value for security is 1. You may wish to set it to ''low'', ''medium'',
    ''high'' or impossible

    db_security_level = ''1''


    Now we need to make a specific folder and file writeable. Enter the following
    commands:


    `sudo chmod 777 /var/www/html/hackable/uploads/`

    `sudo chmod 777 /var/www/html/external/phpids/0.6/lib/IDS/phpids_log.txt`


    Finally, we need to make a modification to the php.ini file on our server. Open
    the php.ini file by typing: sudo nano /etc/php5/apache2/php.ini.


    As php.ini is a long file we are going to use nano''s search functionality to
    find the location we need. Hit Ctrl + W to open search, type allow_url_include
    and hit enter.


    Modify the setting by changing ‘Off’ to ‘On'' as per the image below.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_72_0.png)


    Save the php.ini file by exiting with **Ctrl+X** and **saving your changes**.
    Now we need to restart the Apache service to ensure all our changes take effect.
    To do this type `sudo service apache2 restart` and hit enter.


    Go to the DVWA web app in your browser as before and you will now be presented
    with a login screen. The **default username is ‘admin’** and the **default password
    is ‘password’**.


    Your DVWA setup page should be good to go with no errors. Click on **‘Create /
    Reset Database’** to finalize the installation.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_73_0.png)


    Once this is completed and login again again, you should be presented with the
    DVWA welcome page which means your installation is now complete.


    ## What Next?


    Well done. You have now completed setting up your very own Penetration Testing
    Lab.


    Check out these resources where you can start using your Penetration Testing Lab
    to get your skills to the next level.


