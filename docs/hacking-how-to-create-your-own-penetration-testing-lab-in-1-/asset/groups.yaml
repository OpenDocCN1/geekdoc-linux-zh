  - '[PAGE 55]


    # Installing Ubuntu Server on VMware


    # Configuring the Virtual Machine on VMware and Running ''Easy Install''


    VMware Workstation Player comes with a useful feature called ‘Easy Install’, which
    makes the installation of an operating system a very simple process. We will be
    using this feature to install Ubuntu server. To start click on ‘Create a New Virtual
    Machine’ as you did for the Kali and Windows virtual machines you already created.


    Browse to the location of your Ubuntu Server ISO and click ‘Next >’.


    Enter the user information needed by Easy Install as illustrated by the image
    below and click ‘Next >’.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_55_0.png)


    On the next screen give the virtual machine a name and select a location where
    you wish to install your virtual machine files. Click ‘Next >’.


    Next select the disk capacity. 20GB is more than enough for DVWA. Select the'
- md: '

    ‘Store virtual disk as a single file’ and then click ‘Next >’.


    On the next screen, click ‘Customize Hardware...’.


    On the hardware screen click on ‘Processors’.


    Increase your CPU count to 2 and then click ‘Close’.


    Click Finish to finalize the creation of the virtual machine.


    VMware Easy Install will now install Ubuntu server for you with no interaction
    needed.


    # Finalizing Ubuntu Install on VMware


    We now also need to give our DVVA server a fixed IP address. First, we need to
    login to Ubuntu server with the credentials created during the installation process.
    **Enter the username and password to login to the server.**


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_56_0.png)


    Check the IP address config assigned to your Ubuntu server by running the ‘ifconfig’
    command. Remember **to take note of it** as we will need to set a fixed IP address.


    Open the interfaces file by typing `sudo nano /etc/network/interfaces` and hitting
    enter. If you are prompted for an administrative password enter it and hit enter.


    Now amend the interfaces file so that it mirrors the one in the example image
    below. Remember that your IP address will differ so ensure you create a fixed
    IP address which is part of the NAT IP range that VMware has allocated for you.
    Your default gateway and DNS server IP addresses should be the same as those used
    for Metasploable.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_57_0.png)


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_57_1.png)


    To save your changes hit **Ctrl + x** and then hit enter after confirming you
    want to **save the changes**. Once completed, type `sudo reboot` to restart your
    virtual machine so that changes can take effect.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_58_0.png)


    The changes have in fact taken effect by typing `ifconfig` once your virtual machine
    has restarted and you have logged back in.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_58_1.png)


    It is important to ensure DNS is configured correctly and that your Ubuntu server
    virtual machine has access to the Internet as you will need this to configure
    the LAMP stack. A quick way to achieve this is to ping a website address that
    responds to ICMP requests. Test your virtual machine by running the following
    command ‘ping www.news24.com’.


    # Configuring the LAMP Stack on Ubuntu Server


    Now that we have our Ubuntu server installed and configured it is time to start
    the installation of the LAMP stack. First, we will install the Apache web server.
    To do this type ‘sudo apt-get install apache2’ at the prompt and hit enter. If
    prompted for your sudo password enter your server admin password and hit enter.


    Your virtual machine will now go out into the Internet and look for the files
    needed to install Apache. If all goes well you should be prompted to start the
    install as per the example below. Type ‘Y’ and hit enter.


    Now we repeat the same process for the other components of the LAMP stack. To
    install MySQL type ‘sudo apt-get install mysql-server’ and hit enter.


    At the prompt type ‘Y’ and hit enter to proceed with the installation.


    During the installation process for MySQL you will be prompted to set a root password
    for MySQL as per the image below. Type in a password and hit enter. Remember this
    password as you will need to install PHPMyAdmin and DVWA later.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_60_0.png)


    When prompted to confirm your password retype it and hit enter.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_61_0.png)


    Once MySQL has completed we now need to install PHPMyAdmin which will install
    the necessary PHP files as well as the PHPMyAdmin application which we will need
    to configure MySQL for DVWA. To install PHPMyAdmin type **‘sudo apt-get install
    phpmyadmin’** and hit enter.


    At the prompt type ‘Y’ and hit enter to proceed with the install.


    During the installation process for PHPMyAdmin you will be asked to assign a web
    server. **Hit your space bar to select Apache** and then tab to ‘OK’ and hit enter.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_61_1.png)


    You will also be asked to setup the PHPMyAdmin database during the installation
    process. Select ‘YES’ when prompted and hit enter.


    When you are prompted to enter the password for the database’s administrative
    **user enter the password you created during the MySQL installation process**
    and hit enter.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_62_0.png)


    You will now be asked to create a password for PHPMyAdmin. **Enter a password**
    and hit enter. You will need to **remember this password** so that you can login
    to PHPMyAdmin later during the DVWA installation process.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_63_0.png)


    **Reenter the password** for PHPMyadmin to confirm it and hit enter.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_63_1.png)


    Once the installation for PHPMyAdmin has completed the configuration of the LAMP
    stack is complete. To test your installation, open a web browser on your host
    machine or on your Kali Linux or Windows virtual machine and **go to ‘http://<IP
    address of your DVWA server>’** to see if Apache has been installed correctly.
    You should be presented with a page as the example below.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_64_0.png)


    Check your PHPMyAdmin installation. **Go to ‘http://<ip address of DVWA server>/phpmyadmin’**.
    You should be presented with a login screen as per the example below. Enter ‘root’
    as the username and enter the PHPMyAdmin password you created during the installation
    of PHPMyAdmin.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_65_0.png)


    # Installing DVWA


    Now that we have the prerequisites in place the time has come to install and configure
    DVWA. The first thing we need to do is create an empty database. To do **login
    to PHPMyAdmin** and click on ‘**Users**’ as shown in the image below.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_66_0.png)


    On the Users page click on ‘**Add User**.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_67_0.png)


    Fill in the necessary information as shown in the image below and make a note
    of the username and password as you will need these later. Note that the username
    will also be the name of the database and the host must be set to ‘localhost’.
    Also tick the two tick-boxes in the database for user area and once all the data
    has been entered click on ‘Go’.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_68_0.png)


    We now need to login to our Ubuntu server and install Unzip which we will need
    in the next step. To install unzip type ‘sudo apt-get install unzip’ and hit enter.
    If asked to enter a sudo password enter your Ubuntu server administrative password.


    Now we will use wget to download DVWA. At the prompt type: ‘wget https://github.com/ethicalhackr/DVWA/archive/master.zip’


    Once the DVWA zip file has downloaded unzip it by typing ‘unzip master.zip’


    Once all the files and folders have been extracted check the extracted files are
    in place by typing ‘ls’ to check your directory, then ‘cd DVWA-master’ followed
    by ‘ls’. Since we want to copy all files and folders to our web directory type
    ‘cd ..’ to go back one level.


    Now copy all files and folders to the /var/www/html directory by running the command
    ‘sudo cp -rf DVWA-master/* /var/www/html’. If you are prompted to enter a password,
    enter your server administrative password.


    To confirm all files and folders have been copied type ‘ls /var/www/html’ to check
    if all the files and folders have copied. We now need to remove index.html from
    /var/www/html to ensure Apache renders our.php file. To accomplish this type ‘mv
    /var/www/html/index.html/home/<user folder>’ as shown in the example below.

