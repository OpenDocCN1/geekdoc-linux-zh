- md: "\n# HACKING\n\nCreate Your Own Penetration Testing Lab in 1 Hr!\n(Kali Linux\
    \ Booklet)\n\n![](img/dd853c1dd14d8c4c5030bf979b4573ea_0_0.png)\n\nGary Mitnick\n\
    \n# HACKING: Create Your Own Penetration Testing Lab In 1 Hr!\n(Kali Linux Booklet)\n\
    \nGary Mitnick\n\n© Copyright 2017. All rights reserved.\n\nNo part of this book\
    \ may be reproduced or transmitted in any form or by any means, electronic or\
    \ mechanical, including photocopying, recording, or by any information storage\
    \ or retrieval system without prior written permission from the author or copyright\
    \ holder except in the case of brief quotations embodied in reviews.\n\nAlthough\
    \ the author has exhaustively researched all sources to ensure the accuracy and\
    \ completeness of the information contained in this book, we assume no responsibility\
    \ for errors, inaccuracies, omissions, or any inconsistency herein. Any slights\
    \ of people or organizations are unintentional. Reader should use their own judgment\
    \ and/or consult a programming expert for specific applications to their individual\
    \ needs.\n\n# Table of Contents\n\n- Welcome\n- Hardware Preparation\n    - Minimum\
    \ Requirements\n    - Recommended Requirements\n    - A Note on Contention\n \
    \   - USB Wi-Fi Adapters\n    - Enable Virtualization in your BIOS\n- Downloading\
    \ Software\n    - VMware\n    - Kali Linux\n    - Windows\n    - Metasploitable\n\
    \    - Ubuntu Server\n    - Damn Vulnerable Web App (DVWA)\n    - Alternatives\
    \ to VMware\n    - Virtual Box\n    - Hyper-V\n- Installing Kali Linux\n- Configuring\
    \ the Virtual Machine on Kali Workstation Player\n- Installing Kali on VMware\n\
    - Finalizing Kali Install on VMware\n- Installing Windows 10\n- Configuring the\
    \ Virtual Machine on Windows Workstation Player\n- Installing Windows 10 on VMware\n\
    - Finalizing Windows 10 Install on VMware\n- Importing and Configuring the Metasploitable\
    \ VMware Image\n- Importing the Metasploitable VMware Image\n- Configuring the\
    \ Metasploitable VMware Image\n- Installing DVWA\n- Installing Ubuntu Server on\
    \ VMware\n- Configuring the Virtual Machine on VMware and Running ‘Easy Install'\n\
    - Finalizing Ubuntu Install on VMware\n- Configuring the LAMP Stack on Ubuntu\
    \ Server\n\n# Installing DVWA\n\n# What Next?\n\n# Welcome\n\nCongratulations!\
    \ If you are reading this it means you are about to embark on an exciting journey.\
    \ A journey that will not only improve your technical skills but also introduce\
    \ you to the exciting world of information security and penetration testing. In\
    \ this booklet, you will learn how to set up a penetration testing lab where you\
    \ will hone your hacking skills in a safe training environment before you unleash\
    \ them on the world.\n\nThis book follows a step by step approach. We will start\
    \ by prepping your hardware and downloading the necessary software you will need\
    \ to get your lab in professional shape. We will then follow that with installing\
    \ virtualization software and finally building your virtual machines. Ready to\
    \ go? Ok, let's do this!\n\n## # Hardware Preparation\n\nEvery great human endeavor\
    \ starts with the laying of a solid foundation. The foundation of your penetration\
    \ testing lab is the hardware which you will need to run multiple machines. These\
    \ machines will be running different operating systems which you will need to\
    \ host multiple services and applications.\n\nThis booklet aims to build a real-world\
    \ penetration testing lab so not only will we be configuring Kali Linux which\
    \ is a platform with many of the security tools you will need, we will also configure\
    \ a few exploitable machines which will serve as targets for your simulated attacks.\
    \ Honing your skills by exploiting systems will go a long way in making you a\
    \ skilled penetration tester. We want to build an environment where you can exploit\
    \ and compromise targets so that you are able to replicate this when you move\
    \ on to real world penetration testing.\n\nYou may think that this sounds very\
    \ expensive in that you will need plenty of hardware for your lab. The good news\
    \ is that virtualization technology will keep your hardware costs down. In the\
    \ past, before virtualization was the industry norm, you would have needed to\
    \ procure multiple machines to host these servers and applications but now you\
    \ can host all of them on a single machine assuming of course you have the right\
    \ amount of memory, CPU and storage resources.\n\n# Minimum Requirements\n\nHere\
    \ are the minimum requirements to host the virtual machines we will use in this\
    \ book to setup our pen testing lab:\n\n- * x64 CPU - Quad Core 1.7 GHz (Virtualization\
    \ Capable)\n- RAM - 8GB\n- Storage – 65GB\n\nThese minimum requirements will give\
    \ you a working pen testing lab where you will have the capacity to run any two\
    \ or perhaps three virtual machines at the same time. You may however at some\
    \ point need to run many more machines at the same time and so this booklet recommends\
    \ the following hardware specification for your virtual machine host.\n\n# Recommended\
    \ Requirements\n\nHere are the recommended requirements to host the virtual machines\
    \ we will use in this book to setup our pen testing lab:\n\n- - x64 CPU - i7 2.8\
    \ GHz (Virtualization Capable)\n- RAM - 16GB\n- Storage – 135GB\n\n# A Note on\
    \ Contention\n\nAs you may be running multiple machines simultaneously, each virtual\
    \ machine will compete with its neighbors for hardware resources which could result\
    \ in poor performance. If possible split your virtual machines across multiple\
    \ storage devices. USB storage devices which are USB 3 or better can easily run\
    \ virtual machines. Splitting your virtual machines across multiple disks will\
    \ most definitely increase the performance of each one.\n\n# USB Wi-Fi Adapters\n\
    \nTo perform wireless penetration testing you will need a USB Wi-Fi adapter which\
    \ is capable of packet injection. Unfortunately, not all USB Wi-Fi adapters are\
    \ created equal and some are not compatible with the tools you will use to perform\
    \ wireless penetration testing. For a list of compatible USB Wi-Fi adapters please\
    \ read this post: https://www.raymond.cc/blog/best-compatible-usb-wireless-adapter-for-backtrack-5-and-aircrack-ng/\n\
    \n# Enable Virtualization in your BIOS\n\nTo ensure we can run virtual machines,\
    \ your BIOS needs to be configured to enable virtualization. Without this setting\
    \ enabled you will not be able to install the software needed to host your virtual\
    \ machines.\n\nTo do this you will need to enter your BIOS during startup of your\
    \ physical machine. Each system is different so the key to press to enter the\
    \ BIOS is different on vendor platforms. It is usually F2, F10, F12 or Esc so\
    \ watch your boot up screen carefully to see which keys need to be pressed to\
    \ enter your machine’s BIOS settings. You can also google this if you are not\
    \ able to find this setting on your specific machine.\n\nOnce you have entered\
    \ the BIOS settings menu you will find the virtualization option and it is set\
    \ to enabled. Below is an example and as you can see it is under the ‘Advanced’\
    \ tab so you may need to search for it on your system’s menu options as well.\
    \ In some systems, it may not say Virtualization instead say \"VT-x\".\n\n![](img/dd853c1dd14d8c4c5030bf979b4573ea_11_0.png)\n\
    \nOnce you have enabled this setting you can then exit the BIOS menu. Make sure\
    \ you remember to save changes. Your system should now restart and virtualization\
    \ should now be enabled\n\n# Downloading Software\n\nYou will need the following\
    \ pieces of software to create a proper penetration testing lab:\n\n# VMware\n\
    \n![](img/dd853c1dd14d8c4c5030bf979b4573ea_13_0.png)\n\nOR\n\n![](img/dd853c1dd14d8c4c5030bf979b4573ea_13_1.png)\n\
    \nVMware Workstation Player - VMware Workstation Player, formerly VMware Player,\
    \ is a virtualization software package for x64 computers running Microsoft Windows\
    \ or Linux, supplied free of charge by VMware, Inc. You can download VMware Workstation\
    \ Player from here: https://my.vmware.com/en/web/vmware/free#desktop_end_user_computing/vn\n\
    \nIf you are using an Apple Mac you will need to download and install VMware Fusion\
    \ which is a software hypervisor developed by VMware for Macintosh computers.\
    \ Unfortunately, VMware Fusion is not free but does come with a 30-day trial.\
    \ You can download VMware Fusion from here: https://my.vmware.com/en/web/vmware/info/slug/desktop_end_user_computin\n"
  mdcn: "\n\n# 黑客攻击\n\n在 1 小时内创建你自己的渗透测试实验室！\n（Kali Linux 手册）\n\n![](img/dd853c1dd14d8c4c5030bf979b4573ea_0_0.png)\n\
    \nGary Mitnick\n\n# 黑客攻击：在 1 小时内创建你自己的渗透测试实验室！\n（（Kali Linux 手册）\n\nGary Mitnick\n\
    \n© Copyright 2017. 版权所有。\n\n未经作者或版权所有者的事先书面许可，不得以任何形式或通过任何手段（电子或机械）复制或传输本书的内容，包括复印、录制或通过任何信息存储或检索系统，但评论中包含简短引用除外。\n\
    \n尽管作者已对所有来源进行了详尽研究，以确保书中包含信息的准确性和完整性，但我们对其中的错误、不准确、遗漏或任何不一致之处不承担责任。对个人或组织的任何轻视均非本意。读者应根据自己的判断并/或咨询编程专家以针对其个人需求进行特定应用。\n\
    \n# 目录\n\n- 欢迎\n- 硬件准备\n    - 最低配置\n    - 推荐配置\n    - 关于竞争的说明\n    - USB Wi-Fi\
    \ 适配器\n    - 在 BIOS 中启用虚拟化\n- 下载软件\n    - VMware\n    - Kali Linux\n    - Windows\n\
    \    - Metasploitable\n    - Ubuntu Server\n    -  Damn Vulnerable Web App (DVWA)\n\
    \    - VMware 的替代方案\n    - Virtual Box\n    - Hyper-V\n- 安装 Kali Linux\n- 在 Kali\
    \ Workstation Player 上配置虚拟机\n- 在 VMware 上安装 Kali\n- 完成 VMware 上的 Kali 安装\n- 安装\
    \ Windows 10\n- 在 Windows Workstation Player 上配置虚拟机\n- 在 VMware 上安装 Windows 10\n\
    - 完成 VMware 上的 Windows 10 安装\n- 导入并配置 Metasploitable VMware 镜像\n- 导入 Metasploitable\
    \ VMware 镜像\n- 配置 Metasploitable VMware 镜像\n- 安装 DVWA\n- 在 VMware 上安装 Ubuntu Server\n\
    - 在 VMware 上配置虚拟机并运行“快速安装”\n- 完成 VMware  Ubuntu 安装\n- 在 Ubuntu Server 上配置 LAMP\
    \ 栈\n\n# 安装 DVWA\n\n# 接下来做什么？\n\n# 欢迎\n\n恭喜！如果你正在阅读这些，说明你即将开启一段精彩的旅程。这段旅程不仅将提高你的技术技能，还将向你介绍信息安全和渗透测试的精彩世界。在本手册中，你将学习如何搭建一个渗透测试实验室，在向世界展示你的能力之前，在一个安全的训练环境中磨练你的黑客技巧。\n\
    \n本书采用循序渐进的方法。我们将从准备硬件和下载所需的软件开始，以确保你的实验室达到专业水平。随后，我们将安装虚拟化软件，最后构建你的虚拟机。准备好了吗？好的，我们开始吧！\n\
    \n## 硬件准备\n\n每一项伟大的人类事业都始于坚实的基础。你的渗透测试实验室的基础是硬件，你需要它来运行多台机器。这些机器将运行不同的操作系统，你需要在这些系统中托管多个服务和应用程序。\n\
    \n本手册旨在构建一个真实的渗透测试实验室，因此我们不仅将配置 Kali Linux（一个包含许多你所需的安全工具的平台），还将配置几个可被利用的机器，作为你模拟攻击的目标。通过利用系统来磨练技能将对你成为一名熟练的渗透测试员大帮助。我们希望构建一个可以让你利用并攻破目标的环境，以便在转向真实世界的渗透测试时能够复制这些操作。\n\
    \n你可能认为这听起来非常昂贵，因为实验室需要大量的硬件。好消息是，虚拟化技术将降低你的硬件成本。在过去，虚拟化成为行业标准之前，你需要购买多台机器来托管这些服务器和应用程序，但现在，只要你拥有足够的内存、CPU\
    \ 和存储资源，你就可以将它们全部托管在一个机器上。\n\n# 最低配置\n\n以下是用于书中搭建渗透测试实验室的虚拟机的最低配置要求：\n\n- x64\
    \ CPU - 四核 1.7 GHz（支持虚拟化）\n- RAM - 8GB\n- 存储 – 65GB\n\n这些最低配置将为你提供一个可运行的渗透测试实验室，你有能力同时运行两个或可能三台虚拟机。然而，在某些时刻你可能需要同时运行更多机器，因此本手册建议为你的虚拟机主机采用以下硬件规格。\n\
    \n# 推荐配置\n\n以下是用于书中搭建渗透测试实验室的虚拟机的推荐配置要求：\n\n- x64 CPU - i7 2.8 GHz（支持虚拟化）\n- RAM\
    \ - 16GB\n- 存储 – 135GB\n\n# 关于竞争的说明\n\n由于你可能同时运行多台机器，每台虚拟机都会与其相邻竞争硬件资源，这可能会导致性能下降。如果可能，将你的虚拟机分散在多个存储设备上。USB\
    \ 3 或更好的 USB 存储设备轻松运行虚拟机。将虚拟机分散在多个磁盘上绝对会提高每台设备的性能。\n\n# USB Wi-Fi 适配器\n\n要进行无线渗透测试，你需要一个能够注入包的\
    \ USB Wi-Fi 适配器。遗憾的是，并不是所有的 USB Wi-Fi 适配器都是相同的，有些与你执行无线渗透测试所需的工具不兼容。兼容的 USB Wi-Fi\
    \ 适配器列表请阅读这篇文章：https://www.raymond.cc/blog/best-compatible-usb-wireless-adapter-for-backtrack-5-and-aircrack-ng/\n\
    \n# 在 BIOS 中启用虚拟化\n\n为了确保我们可以运行虚拟机，需要配置 BIOS 以启用虚拟化。如果不启用此设置，将无法安装托管虚拟机所需的软件。\n\
    \n要实现这一点，你需要在物理机启动期间进入 BIOS。每个系统都是不同的，进入 BIOS 的按键在不同厂商平台上也不同。通常是 F2、F10、F12 或\
    \ Esc，请仔细查看启动屏幕，以查看需要按下哪些键进入机器的 BIOS 设置。如果你无法在特定机器上找到此设置，也可以通过 Google 搜索。\n\n\
    一旦进入 BIOS 设置菜单，你将找到虚拟化选项并将其设置为已启用（enabled）。下面是一个示例，如你所示，它位于“Advanced”（高级）标签下，因此你可能需要在系统的菜单选项中搜索它。在某些系统中，它可能不显示\
    \ Virtualization，而是显示“VT-x”。\n\n![](img/dd853c1dd14d8c4c5030bf979b4573ea_11_0.png)\n\
    \n启用此设置后，你可以退出 BIOS 菜单。确保记得保存更改。你的系统现在应该会重启，虚拟化也已启用。\n\n# 下载软件\n\n你需要以下软件来创建一个完善的渗透测试实验室：\n\
    \n# VMware\n\n![](img/dd853c1dd14d8c4c5030bf979b4573ea_13_0.png)\n\n或者\n\n![](img/dd853c1dd14d8c4c5030bf979b4573ea_13_1.png)\n\
    \nVMware Workstation Player - VMware Workstation Player（以前称为 VMware Player）是一种适用于运行\
    \ Microsoft Windows 或 Linux 的 x64 计算机的虚拟化软件包，由 VMware, 公司免费提供。你可以从这里下载 VMware\
    \ Workstation Player：https://my.vmware.com/en/web/vmware/free#desktop_end_user_computing/vn\n\
    \n如果你使用的是 Apple Mac，将需要下载并安装 VMware Fusion，这是由 VMware 为 Macintosh 计算机开发的软件虚拟机监控程序。遗憾的是，VMware\
    \ Fusion 不是免费的，但它提供 30 天试用期。你可以从这里下载 VMware Fusion：https://my.vmware.com/en/web/vmware/info/slug/desktop_end_user_computin\n\
    \n"
