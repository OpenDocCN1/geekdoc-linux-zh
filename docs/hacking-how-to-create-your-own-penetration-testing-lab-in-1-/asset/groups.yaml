    done this, click ‘**Continue**’.


    The next screen asks you to **select your location**. Once done click ‘**Continue**’.
    Please note that location settings are used to configure your time zone settings
    so choose the correct location to ensure your clock and date are always correct.


    The next screen asks you to **choose a keymap** so that your keyboard can be configured.
    Select the keymap that matches your keyboard and then click on ‘**Continue**’.


    The installation wizard will now load the installation components it needs to
    proceed with the install.


    Once the installation components have been loaded you will need to **choose a
    hostname for your Kali instance**. It is important to note that in your penetration
    testing this will not be an issue. However, in a real-world penetration test,
    Intrusion Prevention Systems and Intrusion Detection Systems have alerts that
    look for the hostname ‘Kali’ on the network so choosing ‘Kali’ as a hostname in
    that instance would result in you being discovered. Once you have chosen your
    hostname, click ‘**Continue**’.


    Next you will be asked for a domain. If you have a domain fill in the necessary
    information or leave it blank and click on ‘Continue’.


    Now you will need to fill in the root password for your Kali instance. Fill it
    in and verify by filling it in again and REMEMBER it as there is no ‘Lost your
    password’ on Kali Linux so remembering your password is vital. Once done, click
    on ‘Continue’.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_31_0.png)


    You will be prompted for a specific time zone if you have chosen a location with
    multiple time zones. If you are prompted choose your time zone and then click
    on ‘Continue’.


    The next step is to partition the disk. Choose the default Guided – use entire
    disk if you do not want to have multiple partitions. For beginners, this is recommended.
    Once done, click ‘Continue’ to move to the next screen.


    You will then be asked to choose which partition to install Kali Linux on. If
    you have followed this guide, your virtual machine should only have a single disk
    select it and click ‘Continue’.


    Next you will be asked to choose which partition you want the different Linux
    folders and files located. Choose the default which is recommended for new users
    and then click ‘Continue’.


    Finally, you will get a confirmation screen showing your disk partition configuration.
    If you are happy with the information click on ‘Continue’.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_32_0.png)


    Now you will be asked to confirm your changes one last time. Select the ‘Yes’
    radio button and then click on ‘Continue’.


    The installation will now copy files from the ISO to your newly formatted hard
    drive. After that has completed you will be asked if you want to use a network
    mirror to sort that updates can be downloaded. Select the ‘Yes’ radio button and
    then click on ‘Continue’.


    After some time, you will be prompted to configure the package manager. If you
    use a proxy to access the Internet fill in the information or leave it blank if
    you do not use a proxy. Once done, click ‘Continue’.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_33_0.png)


    The installation wizard will now configure APT which is the package tools used
    by Kali to install new software and update existing software.


    Once APT has been configured you will be prompted to install GRUB boot loader.
    Select the ‘Yes’ radio button and then click on ‘Continue’.


    Select your boot disk which should be /dev/sda and then click ‘Continue’ to start
    the installation of GRUB.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_33_1.png)


    The Kali Linux installation wizard will now finish the installation.


    Once the installation has completed you will be presented with the Installation
    Complete screen. Click ‘Continue’ to finalize the install.


    You have now successfully install Kali Linux on VMware Workstation Player.


    # Finalizing Kali Install on VMware


    Now that you have successfully installed Kali Linux you need to install the VMware
    Tools and update your Kali instance. Kali is now what is called a ‘rolling release’
    so new functionality and updates are added all the time. To take advantage of
    these new features and patches you must update your Kali instance regularly.


    First let''s get the VMware tools installed. Which will give better integration
    into your host system and allow you to resize the screen as well as copy and paste
    documents from your host machine to the Kali virtual machine and vice versa.


    Login to your Kali virtual machine with the default username ‘root’ and then click
    ‘Next’.


    Enter the **password** you created during the installation and then click **Sign
    In**.


    On the VMware Workstation Player menu click ‘Player’ then ‘Manage’ and finally
    ‘Install VMware Tools’ as shown in the image below.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_36_0.png)


    If prompted choose to download and install the VMware tools for Linux


    If all goes well, VMware Workstation Player should mount the VMware tools CD for
    you as shown in the image below. **Double click the icon to open the disk image.**


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_37_0.png)


    Once the folder opened **right-click on the tar.gz** file and select ‘Extract
    To...’


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_37_1.png)


    Choose to extract the files and folders to your ‘**Home**’ directory and then
    click on ‘**Extract**’.


    Once this has completed **open a terminal** by going to Applications / Favorites
    / Terminal as per the image below.


    At the terminal prompt type ‘**ls** to get a directory listing and ensure vmware-tools-distrib
    is present.


    Then navigate into that directory by typing the command `cd vmware-tools-distrib`.


    Finally start the installation by typing `./vmware-install.pl`


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_38_0.png)


    At each prompt hit Enter to accept all the default settings.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_39_0.png)


    Once the script has run its course and finished and you are once again presented
    with a prompt. Type ‘reboot’ to reboot the virtual machine and finalize the installation
    of the VMware tools.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_39_1.png)


    Once the virtual machine has rebooted, login so that we can run updates to ensure
    you have latest version of all the software that comes bundled with Kali Linux.


    Open a terminal and type ‘sudo apt-get update && sudo apt-get upgrade’ to start
    the process.


    You will then be prompted to proceed with the installation once Kali has informed
    you which packages are out of date as shown by the image below. ''Y'' to proceed
    with all the updates and restart the virtual machine once this process has completed.
    This could take a long time depending on your Internet speed and number of updates
    needed.


    Once you have restarted the installation and configuration of Kali Linux has been
    completed. To shut down the machine click on the shutdown icon which is in the
    top right-hand corner of the screen as shown in the image above.


    # Installing Windows 10


    ## Configuring the Virtual Machine on VMware Workstation Player


    Now that we have Kali up and running let''s install and configure our Windows
    virtual machine.


    The configuration of your Windows 10 virtual machine will be similar to the configuration
    we did for the Kali Linux virtual machine. Refer to the screenshots in the Kali
    Linux section if you need a refresher.


    On the VMware Workstation Player Console click on ‘Create a New Virtual Machine’.


    Click **browse** and navigate to the location where you saved your Windows ISO.
    Once done click ‘Next >''.


    On the next screen, you will need to **fill in the name of the virtual machine**
    as it will appear on the VMware console and you will need to **specify a storage
    location** for the virtual machine files. Once completed, click ‘Next >''.


    On the following screen, you will need to specify the **capacity of the hard drive**
    for your virtual machine. As always is better than less so allocate accordingly.
    **60 GB should be sufficient for your Windows 10 virtual machine.** Once completed,
    click on the ‘Store virtual disk as a single file’ radio button and the click
    ‘Next >’ to continue.


    On the next screen click on ‘Customize Hardware...’


    On the Hardware screen click on ‘Processors’ to increase the processor count.


    As with storage more is better than less. Increase your **processor count to least
    2**. It is recommended that 4 processors be assigned to your Windows virtual machine.
    Click ‘Close’ once you have increased your CPU’s.

