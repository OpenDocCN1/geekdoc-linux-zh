    Player from here: https://my.vmware.com/en/web/vmware/free#desktop_end_user_computing/vn


    If you are using an Apple Mac you will need to download and install VMware Fusion
    which is a software hypervisor developed by VMware for Macintosh computers. Unfortunately,
    VMware Fusion is not free but does come with a 30-day trial. You can download
    VMware Fusion from here: https://my.vmware.com/en/web/vmware/info/slug/desktop_end_user_computin'
- md: '

    # Kali Linux


    Kali Linux is a Debian-derived Linux distribution designed for digital forensics
    and penetration testing. It is maintained and funded by Offensive Security Ltd.
    This will be your primary attacking platform and you can download it from here:
    https://www.kali.org/downloads/


    # Windows


    There are a few Pen testing tools that only run on Windows so it is always a good
    idea to have a Windows VM handy for those occasions. You can download Windows
    10 from here: https://www.microsoft.com/en-gb/software-download/windows10ISO


    # Metasploitable


    Metasploitable is an intentionally vulnerable Linux virtual machine. This VM can
    be used to conduct security training, test security tools, and practice common
    penetration testing techniques. This will be another one of your targets and you
    can download it from here:

    https://sourceforge.net/projects/metasploitable/


    # Ubuntu Server


    Ubuntu Server edition runs on physical or virtual servers comes with many enterprise-class
    features. We will need Ubuntu server to host DVWA. You can download Ubuntu Server
    from here: https://www.ubuntu.com/download/server


    # Damn Vulnerable Web App (DVWA)


    The creator’s state that Damn Vulnerable Web App (DVWA) is a PHP/MySQL web application
    that is damn vulnerable. Its main goals are to be an aid for security professionals
    to test their skills and tools in a legal environment, help web developers better
    understand the processes of securing web applications and aid teachers/students
    to teach/learn web application security in a classroom environment. This will
    be one of your targets and you can download it from here: http://www.dvwa.co.uk


    # Alternatives to VMware


    There are some alternatives to VMware which you could also install to host your
    virtual machines. However, as Metasploitable is a native VMware virtual machine
    you will need to tweak the Metasploitable VM to whichever platform you choose.
    This book will use VMware as the chosen virtualization platform.


    # Virtual Box


    VirtualBox is a cross-platform virtualization application. It runs on Intel or
    AMD-based computers, whether they are running Windows, Mac, Linux or Solaris operating
    systems. You can download VirtualBox from here: https://www.virtualbox.org/wiki/Downloads


    To install Metasploitable so on VirtualBox you can follow the instructions detailed
    at this blog post: http://www.hacking-tutorial.com/tips-and-trick/install-metasploitable-on-virtual-box/#sthash.LMUoK8L5.dpbs


    # Hyper-V


    Hyper-V is a native hypervisor which only runs on Microsoft Windows. You can use
    it to create and run virtual machines. Hyper-V is not recommended for the purposes
    of penetration testing as it has no USB support which you will require for any
    wireless hacking you intend on performing with your Kali or Windows VM. To enable
    Hyper-V on your Windows machine, follow these steps: https://technet.microsoft.com/en-us/library/hh846766(v=ws.11).aspx


    # Installing VMware


    Now that we have our hardware prepared and have downloaded all the software we
    will need; the next step is to install VMware Workstation Player on our machine
    so that we can start building our virtual machines.


    This booklet illustrates the VMware Workstation Player install process on Windows.
    For a detailed explanation on how to install VMware Fusion on an Apple Mac go
    to this VMware knowledgebase: https://kb.vmware.com/selfservice/search.do?language=en_US&cmd=displayKC&externalId=2014097


    Once you double-click the VMware Workstation Player install file you will be presented
    with a splash screen.


    Once the **welcome screen opens**, click on ‘Next’ to start the installation.


    You will then be presented with the **EULA**. Ensure you **select the tick-box**
    to accept the terms and then click on ‘Next’.


    You will now be presented with the **Custom Setup** options where you can change
    the installation directory and enabled an enhanced keyboard driver. Click ‘Next’
    once you have made the changes or leave the default settings.


    You will then move on to the **User Experience Settings** where you can opt to
    let the software check for updates on startup and send anonymous data to VMware
    to help improve the software. You have made the selection, click ‘Next’. Both
    selections are optional and not enabling them will not influence VMware’s features
    or performance.


    Next select the **shortcuts** you want the software to install for you. Desktop
    / Start menu. Once you have made your selection, click ‘Next’.


    You are now ready to start the installation. Click ‘Install’.


    You will be presented with a progress screen which will show you progress being
    made by your machine on the installation.


    Once the installation has completed click on ‘Finish’ to finalize the installation
    and close the installation wizard.


    When you start VMware Workstation Player for the first time you will be presented
    with a first start welcome message. Select use for non-commercial use and enter
    your email address. Once completed click on ‘Continue’


    Your VMware Workstation Player is now installed and ready to go. Click ‘Finish’
    to open the management console.


    # Installing Kali Linux


    # Configuring the Virtual Machine on VMware Workstation Player


    The first step in getting Kali Linux up and running on VMware Workstation Player
    is to configure the virtual machine settings before starting the actual operating
    system install.


    To begin click on ‘Create a New Virtual Machine’ on your VMware Workstation Player
    console as per the image below.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_23_0.png)


    On the welcome screen click on ‘Browse’ and navigate to the location of the Kali
    Linux ISO you downloaded. Then click ‘Next’.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_24_0.png)


    On the Select Guest Operating System screen **select the Linux radio button**
    and in the dropdown list for the version **select Ubuntu 64-bit**. Click ‘Next
    >’.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_24_1.png)


    On the Name the Virtual Machine window **enter a name for your Kali VM** and **configure
    the location** where you want your virtual machine files to be saved. In the example
    below the machine name is Kali and the chosen location for the virtual machine
    files is C:\VM. Once done, click ‘Next >’.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_25_0.png)


    You will now need to specify your virtual machine’s disk capacity. The larger
    the better. In the example below we have gone with the default of 20GB. Then select
    the radio button to store the virtual disk as a single file which will enhance
    the virtual machine’s performance. Click ‘Next >’ once done.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_26_0.png)


    The configuration is now complete but we need to customize our virtual machine
    by adding more memory and vCPUs. Click on **‘Customize Hardware...’**.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_26_1.png)


    Increase the memory of your virtual machine. The more the better. In the example
    below we have increased it to 2GB. Kali Linux run on 1 GB will be very slow so
    to allocate at least 2GB. Once done on ‘Processors’ as illustrated below.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_27_0.png)


    Increase your processors. As with memory the more the better. Configure at least
    2 vCPU’s. Once done click ‘Close’.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_28_0.png)


    Your configuration is now complete. Click on ‘Finish’.


    # Installing Kali on VMware


    Now that we have configured the virtual machine it''s time to do the actual Kali
    Linux install.


    To get started click on ‘Play virtual machine’ on the VMware Workstation Console
    as shown in the image below.


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_29_0.png)


    You may get certain warnings when first starting your VM. Read through the alert
    and accept or decline any changes VMware wishes to make. As per the example below
    we have chosen to longer receive warnings on keyboard related errors as it does
    not affect the performance of the virtual machine.


    When the virtual machine starts, you will be presented with boot options. Use
    your arrows to select Graphic Install and then hit enter.

    '
  mdcn: '


    # Kali Linux


    Kali Linux 是一种基于 Debian 的 Linux 发行版，专为数字取证和渗透测试设计。它由 Offensive Security Ltd 维护并资助。这将是你的主要攻击平台，你可以从这里下载：https://www.kali.org/downloads/


    # Windows


    有一些渗透测试工具仅在 Windows 上运行，因此在这些情况下准备一个 Windows 虚拟机始终是一个好主意。你可以从这里下载 Windows 10：https://www.microsoft.com/en-gb/software-download/windows10ISO


    # Metasploitable


    Metasploitable 是一个故意留漏洞的 Linux 虚拟机。该虚拟机可以用于安全培训、测试安全工具以及练习常见的渗透测试技术。这将是你的目标之一，你可以从这里下载：

    https://sourceforge.net/projects/metasploitable/


    # Ubuntu Server


    Ubuntu Server 版本运行在物理或虚拟服务器上，带有许多企业级功能。我们需要 Ubuntu Server 来托管 DVWA。你可以从这里下载 Ubuntu
    Server：https://www.ubuntu.com/download/server


    # Damn Vulnerable Web App (DVWA)


    创建者指出，Damn Vulnerable Web App (DVWA) 是一个极其脆弱的 PHP/MySQL Web 应用程序。它的主要目标是作为安全专业人员在法律环境中测试其技能和工具的辅助，帮助
    Web 开发人员更好地理解保护 Web 应用程序的过程，并帮助教师/学生在教室环境中教授/学习 Web 应用程序安全。这将是目标之一，你可以从这里下载：http://www.dvwa.co.uk


    # VMware 的替代方案


    有一些 VMware 的替代方案，你也可以安装它们来托管你的虚拟机。然而，由于 Metasploitable 是原生的 VMware 虚拟机，你可能需要根据选择的平台对
    Metasploitable 虚拟机进行调整。本书将使用 VMware 作为虚拟化平台。


    # Virtual Box


    VirtualBox 是一款跨平台的虚拟化应用程序。它可以运行基于 Intel 或 AMD 的计算机上，无论运行的是 Windows、Mac、Linux 还是
    Solaris 系统。你可以从这里下载 VirtualBox：https://www.virtualbox.org/wiki/Downloads


    要在 VirtualBox 上安装 Metasploitable，你可以按照此博客文章中的详细说明：http://www.hacking-tutorial.com/tips-and-trick/install-metasploitable-on-virtual-box/#sthash.LMUoK8L5.dpbs


    # Hyper-V


    Hyper-V 是一个仅运行在 Microsoft Windows 上的原生虚拟机程序。你可以用它创建和运行虚拟机。不建议将 Hyper-V 用于渗透测试，因为它不支持
    USB，而你打算对 Kali 或 Windows 虚拟机进行任何无线黑客攻击时都需要它。要在你的 Windows 机器上启用 Hyper-V，请遵循以下步骤：https://technet.microsoft.com/en-us/library/hh846766(v=ws.11).aspx


    # 安装 VMware


    现在我们已经准备好了硬件并下载了所有需要的软件；下一步是在我们的机器上安装 VMware Workstation Player，以便我们开始构建虚拟机。


    本小册说明了在 Windows 上安装 VMware Workstation Player 的过程。如需了解如何在 Apple Mac 上安装 VMware
    Fusion 的详细说明，请访问此 VMware 知识库：https://kb.vmware.com/selfservice/search.do?language=en_US&cmd=displayKC&externalId=2014097


    双击 VMware Workstation Player 安装文件后，将看到一个启动界面。


    一旦**欢迎界面打开**，点击“下一步”开始安装。


    随后你将看到 **EULA（用户许可许可协议）**。确保你**勾选选框**以接受条款，然后点击“下一步”。


    你现在将看到**自定义设置**选项，你可以在此处更改安装目录并启用增强键盘驱动程序。在做出更改后点击“下一步”，或保持默认设置。


    然后你将进入**用户体验设置**，你可以在此处选择软件在启动时检查更新，并向 VMware 发送匿名数据以帮助改进软件。做出选择后，点击“下一步”。这两个选项都是可选的，不启用它们不会影响
    VMware 的功能或性能。


    接下来，选择你想让软件为你安装的**快捷方式**。桌面 / 开始菜单。做出你的选择后，点击“下一步”。


    你现在准备好开始安装了。点击“安装”。


    你将看到一个进度屏幕，显示你的机器正在执行安装的进度。


    安装完成后，点击“完成”以结束安装并关闭安装向导。


    当你第一次启动 VMware Workstation Player 时，将看到首次启动欢迎消息。选择“用于非商业用途”并输入你的电子邮件地址。完成后，点击“继续”。


    你的 VMware Workstation Player 现在已安装完毕并准备就绪。点击“完成”打开管理控制台。


    # 安装 Kali Linux


    # 在 VMware Workstation Player 上配置虚拟机


    在 VMware Workstation Player 上运行 Kali Linux 的第一步是在开始实际操作系统安装之前配置虚拟机设置。


    要开始，如如下所示，在你的 VMware Workstation Player 控制台上点击“创建新虚拟机”。


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_23_0.png)


    在欢迎界面上，点击“浏览”，并导航到你下载的 Kali Linux ISO 所在。然后点击“下一步”。


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_24_0.png)


    在“选择客户操作系统”屏幕上，**选择 Linux 单选按钮**，并在版本下拉列表中**选择 Ubuntu 64-bit**。点击“下一步 >”。


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_24_1.png)


    在“命名虚拟机”窗口中，**为你的 Kali 虚拟机输入一个名称**，并**配置你希望保存虚拟机文件的位置**。在下面的示例中，机器名称为 Kali，选定的虚拟机文件位置为
    C:\VM。完成后，点击“下一步 >”。


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_25_0.png)


    你现在需要指定虚拟机的磁盘容量。越大越好。在下例示例中，我们选择了默认的 20GB。然后选择单选按钮将虚拟磁盘存储为单个文件，这将提高虚拟机的性能。完成后，点击“下一步
    >”。


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_26_0.png)


    配置现在已完成，但我们需要通过添加更多内存和 vCPUs 来自定义我们的虚拟机。点击**“自定义硬件...”**


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_26_1.png)


    增加虚拟机的内存。越大越好。在下例示例中，我们将其增加到 2GB。Kali Linux 在 1 GB 上运行会非常慢，因此至少分配 2GB。完成后，在如下所示的“处理器”中进行。


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_27_0.png)


    增加你的处理器。和内存一样，越大越好。配置至少 2 个 vCPU。完成后，点击“关闭”。


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_28_0.png)


    你的配置已完成。点击“完成”。


    # 在 VMware 上安装 Kali


    现在我们已经配置好了虚拟机，是时候进行实际的 Kali 安装了。


    要开始，如图像所示，在 VMware Workstation 控制台上点击“播放虚拟机”。


    ![](img/dd853c1dd14d8c4c5030bf979b4573ea_29_0.png)


    当你首次启动虚拟机时，可能会收到某些警告。阅读警报并接受或拒绝 VMware 想要进行的任何更改。如下例所示，我们选择不再接收与键盘相关的错误警告，因为这不会影响虚拟机的性能。


    当虚拟机启动时，你将看到启动选项。使用方向键选择“Graphic Install（图形化安装）”并按回车。


    '
