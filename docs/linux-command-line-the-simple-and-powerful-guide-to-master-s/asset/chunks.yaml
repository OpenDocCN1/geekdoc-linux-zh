    这一次，再次执行了 `echo` 命令来打印变量 `name`。现在脚本正在获取变量的值，该值被设置为全局变量‘Tom’。`echo` 命令不会获取在 `print`
    函数中设置的局部变量。简单来说，局部变量定义在函数内部，并且仅在调用函数的地方使用。在所有调用变量的地方，它使用的都是设置为全局变量的值。这就是局部变量和全局变量的区别，以及如何在脚本中实际应用它们的方法。


    现在，让我们通过一个示例来巩固对函数的学习。。通过这个示例，你将更清晰地理解更多概念。在示例中，我们将创建一些较小的部分并解释每个部分；最后，我们将所有部分组合成一个完整且有意义的脚本。因此，你可能需要重读这一部分以获得更清晰思路。


    ### 使用我们的脚本检查文件是否存在

    每当用户运行脚本时，必须将文件名作为参数传递给运行的脚本。脚本将检查文件是否存在并打印结果。我们在之前的章节中也见过可以完成此任务的方法，但现在我们将使用函数并学习更多概念。


    #### 第 1 部分：创建一个名为‘is_file_exist’的函数

    ```bash

    is_file_exist() {

    local file="$1"

    }

    ```

    我们将按照其使用的格式创建一个名为 `is_file_exist` 的函数。在调用此函数时，我们需要将文件名作为参数传递；它将被定义为一个局部变量。变量名为
    `file`，其值将是参数 `$1`。这是我们在上一节中学习过的。


    #### 第 2 部分：--- AND 的第 1 条件 --- AND ------AND 的第 2 条件 -------

    ```bash

    [[ -f "file" ]] && return 0 || return 1

    ```

    --- 第 1 个条件 --- OR --- 第 2 个条件

    在这一部分中，我们将使用 `AND` 运算符、`OR` 运算符和 `-f` 标志来验证文件是否存在。这将成为我们编写的函数的一部分。我们想要检查文件是否存在，因此将使用
    `AND` 运算符的格式。双括号配合 `-f` 标志可以检查指定的文件名是文件还是目录。在 `-f` 之后，我们将编写定义为局部变量的文件变量 `$file`。这将成为
    `AND` 运算符的第一个条件。它将显示文件是否存在。到目前为止，我们已经完成了 `AND` 条件的第一个部分。现在来看第 2 个条件。


    注意，我们没有给出 `if` 条件，现在我们将使用返回值。如果你熟悉任何编程语言，你可能对三元运算符熟悉。我们正在检查操作是否为真；根据结果，如果真，它将返回某个值，如果为假，它将返回另一个值。我们将使用双
    `AND` 运算符 (`&&`) 以及关键字 `return 0` 和 `return 1`。在 `return 0` 和 `return 1` 之间有一个
    `OR` 运算符 (`||`)。


    所以这里发生的情况是：如果文件存在，则第一个条件为真；这意味着输出为 1。当输出为 1 时，它将检查下一个条件——`return 0 || return 1`。由于文件存在，意味着结果为
    1，所以它将执行 `return 1`。如果没有提供参数或文件不存在，意味着结果为 0。在这种情况下，当它检查 `AND` 的第 2 个条件时，它将执行 `return
    0`。


    #### 第 3 部分：创建一个名为‘usage’的函数

    ```bash

    usage () {

    echo "You need to provide an argument : "

    echo "usage : $0 file_name"

    }

    ```

    我们将提供函数名 `usage`；然后使用两个 `echo` 命令打印两条消息。第一条消息是打印“你需要提供一个参数”。在第二个 `echo` 消息中，我们将通过
    `$0` 提供脚本名称，通过 `file_name` 提供文件名。


    #### 第 4 部分：检查用户是否提供了任何参数

    ```bash

    [[ $# -eq 0 ]] && usage

    ```

    条件 1 ----------- AND --条件 2--

    这一行也包含 `AND` 运算符；第一个条件是验证提供的参数数量是否为零。第二个条件将调用我们在上面第 3 部分创建的 `usage` 函数。如果你还记得，`$#`
    将获取脚本时提供的参数计数。接下来，如果数字等于（`-eq`）零，我们需要向用户显示一条消息。为此，我们将进入 `AND` 运算符的下一个部分，即调用函数
    `usage`。


    #### 第 5 部分：创建一个‘if’语句

    ```bash

    if (is_file_exist "$1")

    then

    echo "File found"

    else

    echo "File not found"

    fi

    ```

    现在这里在 `if` 中，我们通过将变量名设置为 `is_file_exist` 且值为 `$1` 来编写一个表达式。**需要注意的是**，在 `if` 语句中我们给名为
    `is_file_exist`，这意味着我们正在调用在第 1 部分创建的函数。接下来是 `$1`，这是我们提供给脚本的参数。


