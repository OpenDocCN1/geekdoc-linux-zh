- fmt: "\n`./hello.sh`\nEnter some character : `#sW4`\n`Unknown input` \nThis looks\
    \ fine as expected from the rules defined in `case.` In this way, you can match\
    \ characters using the defined patterns. For more information, you can find a\
    \ Wikipedia page on regular expressions. There will be more details about every\
    \ symbol and character used in script. So the `case` is not just used for a strict\
    \ letter or characters; you can evaluate any patterns.\n\nSummary: In this chapter,\
    \ we learned the `case` statement for simple arguments with script and using the\
    \ pattern. We learned its syntax and some options that are used generally in scripting.\n\
    \n# Chapter Eleven: Array Variables\n\nWe have learned so far about variables.\
    \ Variables in shell scripting can hold a single value. Now think of a situation\
    \ where we have a large number of values to hold; in that case, it will be a complex\
    \ situation to create a variable for each value. The array comes into the picture\
    \ now. The array can hold multiple values at the same time. It has a mechanism\
    \ of grouping the variables.\n\n## How to use an array?\n\nIt is simple, define\
    \ the name of an array like a variable. For example, we will keep `os` as the\
    \ name of the variable. To declare the values, the `os` will be followed by `equal\
    \ to` symbol (`=`), and in parentheses, there will be names of elements declared.\
    \ A space will separate the element names that will be in individual parentheses.\
    \ In this example, we gave three elements of the array variables `os` as Ubuntu,\
    \ windows, and kali. It shows the following:\n\n```bash\nos=('ubuntu' 'windows'\
    \ 'kali')\n```\n\nTo display the value, it can be done with `echo` command as\
    \ `-\"${os[@]}\"`. The symbol `@` will show all the elements of the array variable\
    \ `os.`. Script will look as below:\n\n```bash\n#! /bin/bash\nos=('ubuntu' 'windows'\
    \ 'kali')\necho \"${os[@]}\"\n```\n\nLet’s execute the script now.\n`$ ./hello.sh`\n\
    ```bash\nubuntu windows kali\n```\n\nThis way, in output, we can see all element\
    \ values. All the values in the curly bracket have their index numbers, starting\
    \ from number `0`. In the above example, there are three elements defined: Ubuntu,\
    \ windows, and kali. Since the index number starts from `0`, that means they have\
    \ `0`, `1` and `2` index numbers assigned in serial order. To print any specific\
    \ element, we can use these index numbers.\n\nTo display only `windows` in output,\
    \ in the `echo` command inside the square bracket we will define the index number\
    \ as `1`, as shown below in the script:\n\n```bash\n#! /bin/bash\nos=('ubuntu'\
    \ 'windows' 'kali')\necho \"${os[@]}\"\necho \"${os[1]}\"\n```\n\nWhen we execute\
    \ the script, two lines will be the output; for the line with `[@]`, it should\
    \ display all elements, and the next line with `[1]` should show only index number\
    \ `1` that is `windows.`\n`$ ./hello.sh`\n```bash\nubuntu windows kali\nwindows\n\
    ```\n\nThis looks perfect.\n\nNext, let’s look how to print the indexes of the\
    \ array that can be done by adding an exclamation mark symbol (`!`) before the\
    \ variable name in brackets `\"${!os[@]}\"`. Now we will add this also in the\
    \ script.\n\n```bash\n#! /bin/bash\nos=('ubuntu' 'windows' 'kali')\necho \"${os[@]}\"\
    \necho \"${os[1]}\"\necho \"${!os[@]}\"\n```\n\nWe will execute the script now.\n\
    `$ ./hello.sh`\n```bash\nubuntu windows kali\nwindows\n0 1 2\n```\n\nNow we can\
    \ see the index numbers of the array. Since we have three elements, it has shown\
    \ `0`, `1`, and `2`.\n\nNext, let’s see how to print the length of the array,\
    \ that can be done by adding hash symbol (`#`) before the variable name `os` as\
    \ `\"${#os[@]}\"`. Let’s add this line also in the script:\n\n```bash\n#! /bin/bash\n\
    os=('ubuntu' 'windows' 'kali')\necho \"${os[@]}\"\necho \"${os[1]}\"\necho \"\
