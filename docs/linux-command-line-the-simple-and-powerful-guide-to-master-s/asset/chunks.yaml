  trans: "\n\n`HOME`: 显示主目录。\n`PWD`: 显示当前工作目录。\n\n现在脚本看起来像这样。\n\n```bash\n#! /bin/bash\n\
    # 这是一个注释\necho \"Hello World\"   # 这也是一个注释\necho $BASH\necho $BASH_VERSION\necho\
    \ $HOME\necho $PWD\n```\n\n当我们执行脚本时，输出将如下：\n```bash\n$ ./hello.sh\nHello World\n\
    /bin/bash\n4.4.23(1)-release\n```\n\n- `echo $BASH_VERSION` 的输出，即系统中的 Bash 版本：`/home/user1`\n\
    - `echo $HOME` 的输出，即用户的主目录：`/home`\n- `echo $PWD` 的输出，即执行脚本时的当前目录。\n\n下面你将看到一些常见的系统变量列表。\n\
    \n### 用户定义变量\n自定义变量是由像我们这样的用户创建并维护的。通常情况下，这些变量用小写定义，但并没有规则阻止你用大写编写这些变量。变量名应该包含字母而不包含数字值。如果任何变量名以数字开头，脚本可能会执行而不报错，但输出可能是错误的。\n\
    \n要定义此变量，编写变量名——可以是任何内容——然后给它赋一个值。用符号 `=` 分隔变量名和它的值。通过在变量名前加上 `$` 符号，`echo` 命令可以显示变量的值。\n\
    \n例如，我们的 `hello.sh` 脚本允许我们添加一个用户定义变量 `name` 及其值为 `John`。在赋值之前，我们还可以输入一个文本字符串，并在字符串之间使用该值，如下所示。\n\
    \n脚本看起来像这样：\n\n```bash\n#! /bin/bash\n# 这是一个注释\necho \"Hello World\"   # 这也是一个注释\n\
    # 下面是系统定义的变量\necho $BASH\necho $BASH_VERSION\necho $HOME\necho $PWD\n# 下面是用户定义的变量\n\
    name=John\necho $name\n```\n\n现在，当你执行脚本时，带有系统变量和新的用户定义变量，输出将如下所示：\n```bash\n$\
    \ ./hello.sh\nHello World\nMy shell is /bin/bash\nMy Shell version name is 4.4.23(1)-release\n\
    My home directory is /home/user1\nMy present working directory is /home\nJohn\n\
    ```\n\n同样，文本字符串也可以用于系统定义的变量，如下文所示。现在脚本看起来像这样：\n\n```bash\n#! /bin/bash\n# 这是一个注释\n\
    echo \"Hello World\"   # 这也是一个注释\n# 下面是系统定义的变量\necho My shell is $BASH\necho My\
    \ Shell version name is $BASH_VERSION\necho My home directory is $HOME\necho My\
    \ present working directory is $PWD\n# 下面是用户定义的变量\nname=John\necho The name is\
    \ $name\n```\n\n当我们执行脚本时，输出将如下所示：\n```bash\n$ ./hello.sh\nHello World\nMy shell\
    \ is /bin/bash\nMy Shell version name is 4.4.23(1)-release\nMy home directory\
    \ is /home/user1\nMy present working directory is /home\nThe name is John\n```\n\
    \n**总结：** 你学习了如何在 shell 脚本中使用注释、变量、系统变量和用户定义变量。\n\n### 第三章：读取用户输入\n在本章中，你将学习如何从脚本中终端提供的输入中读取输入。要从键盘获取输入，请使用\
    \ `read` 命令。它从键盘获取输入并将其赋值为变量的值。这是一种获取变量输入的交互式方法。简而言之，当我们执行脚本时，它会提示用户输入某些值，而这个输入就变成了该变量的值。\n\
    \n让我们看看脚本中的示例，它会要求你输入一个名称。我们输入的名称将成为变量的值，最后，`echo` 将显示输入的名称。脚本看起来像这样：\n\n```bash\n\
    #! /bin/bash\necho \"Enter the name : \"\nread name\necho \"The name entered is\
    \ : $name\"\n```\n\n- 输入名称的消息：`read name`\n- `read` 命令提示用户输入名称，这将成为变量的值。\n- `echo\
    \ \"The name entered is : $name\"`：显示上方输入中为变量输入的名称。\n\n现在当我们执行脚本时，系统会在 `read`\
    \ 命令之后等待“值”输入：\n```bash\n$ ./hello.sh\nEnter the name :\nJohn\nThe name entered\
    \ is: John\n```\n- 显示脚本的第一行：`John`\n- 用户输入的类型：`John`\n- 显示脚本的第三行，输出为‘John’，即第\
    \ 2 行给出的值。\n\n#### 添加多个变量\n可能会出现你想在同一个命令中添加多个变量的情况。可以通过在 `read` 命令后添加多个变量名来实现。每个变量之间用空格分隔。为了在输出中显示多个值，输出行也必须包含我们想要查看输出的所有变量名。\n\
    \n例如，在之前的脚本中，我们希望用户输入三个名称并在输出中显示。在这种情况下，脚本看起来像这样：\n\n```bash\n#! /bin/bash\necho\
    \ \"Enter the names : \"\nread name1 name2 name3\necho \"The names entered are\
    \ : $name1, $name2\"\n```\n\n当我们我们执行脚本时，输出如下：\n```bash\n$ ./hello.sh\nEnter the\
    \ names :\nJohn Mak Adam\nThe names entered are: John, Adam\n```\n- 所有输入应在同一行，用空格分隔。在上面的示例中，当我们执行脚本时，脚本提示我们输入名称，该提示在同一行。\n\
    \n有时我们需要在同一行获取提示。通过在 `read` 命令后添加 `-p` 标志可以实现这一点。例如，在下面的示例中：第一行让 shell 感知到类型；第二行是\
    \ `read` 命令带有 `-p` 标志运行，所以系统应该在同一行提示值；第三行是 `echo`，显示变量名的值。\n\n```bash\n#! /bin/bash\n\
    read -p \"Enter the names : \" name1 name2 name3\necho \"The names entered are\
    \ : $name1, $name2, $name3\"\n```\n\n执行脚本后，输出如下：\n```bash\n$ ./hello.sh\nEnter\
    \ the names : John Mak Adam\nThe names entered are: John, Mak, Adam\n```\n\n####\
    \ 静默输入\n有时需要静默输入。静默意味着不在屏幕上显示输入，例如密码。出于安全考虑，可以通过添加 `-s` 标志来实现。在之前的脚本中，我们将 `pass_var`\
    \ 作为变量输入密码，并且应该是静默的。在这种情况下，我们必须使用两个标志：`-p` 在同一行提示，`-s` 保持输入静默。\n\n```bash\n#!\
    \ /bin/bash\nread -p \"username : \" username\nread -s \"password : \" pass_var\n\
    echo \"Entered username : $username\"\necho \"Entered password : $pass_var\"\n\
    ```\n\n执行脚本后，输出如下：\n```bash\n$ ./hello.sh\nusername : john\npassword : \nEntered\
    \ username : john\nEntered password : \n```\n\n#### 数组\n在输入成千上万的情况下，单独设置所有变量的值将是一个可行的方案。在这种情况下，`array`\
    \ 出现了。数组可以通过设置索引来存储多个值。Bash shell 的索引从 0 开始。\n\n现在让我们了解如何创建数组以及如何显示数组的值。如果你允许用户输入多个输入并将这些输入保存到数组中，`-a`\
    \ 标志将实现。\n\n```bash\n#! /bin/bash\necho \"Enter Names : \"\nread -a names\necho\
    \ \"Names : ${names[0]}, ${names[2]}\"\n```\n\n在带有 `read` 命令的脚本中，我们设置了 `-a` 标志，这意味着我们可以提供多个输入值。最后一行对索引\
    \ 0 和 2 执行 `echo`。让我们执行脚本并查看输出是怎样的。\n\n```bash\n$ ./hello.sh\nEnter Names :\n\
    John Mak Adam\nNames : John, Adam\n```\n在这个示例中，我们为数组 `names` 提供了 4 个名称的输入，并用空格分隔。最后一行显示数组中创建的元素值，即第一个名称\
    \ `john` 和第三个名称 `adam`。\n\n#### REPLY\n另一个名为 `REPLY` 的变量是 `read` 命令的默认变量。当 `read`\
    \ 前面没有写变量时会发生什么？默认变量 `REPLY` 起作用，它只是显示提供给 `read` 的输入。\n\n```bash\n#! /bin/bash\n\
    echo \"Enter Names : \"\nread\necho \"Names: $REPLY\"\n```\n\n当我们执行脚本时：\n```bash\n\
    $ ./hello.sh\nEnter Names :\nJohn Mak Adam\nNames: John Mak Adam\n```\n我们将 4 个名称的输入设置为\
    \ `REPLY` 的值，输出与输入相同。\n\n### 第四章：向脚本传递参数\n在上章中，我们查看了读取参数。当你需要向脚本传递参数时，会有要求。参数是标准输入的输入，以获取过滤输出。例如当我们写\
    \ `ls /home` 时，这意味着 `ls` 是命令，`/home` 是参数，用于显示 `/home` 目录的文件列表。同样，命令 `ls` 现在有两个参数。在本章中，我们将发现参数是如何传递给脚本的。\n\
    \n在下面的脚本中，在 `echo` 之后，`$1`、 `$2` 和 `$3` 意味着三个参数。\n\n```bash\n#! /bin/bash\necho\
    \ \"Argument 1: $1\"\necho \"Argument 2: $2\"\necho \"Argument 3: $3\"\n```\n\n\
    现在执行脚本（带上三个参数），输出如下：\n```bash\n$ ./hello.sh arg1 arg2 arg3\nArgument 1: arg1\n\
    Argument 2: arg2\nArgument 3: arg3\n```\n\n### 第五章：if 语句\n在本章中，我们将学习 `if` 语句。如果你熟悉任何编程语言，你可能知道\
    \ `if` 语句可以测试某些条件，如果条件为真，则执行代码；否则进入 `else` 或不执行。\n\n#### 如何在语句中写 if\n在脚本中，一旦 `if`\
