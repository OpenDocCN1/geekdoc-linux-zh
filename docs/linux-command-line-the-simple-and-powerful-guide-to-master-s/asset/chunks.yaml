    To understand ‘expr,’ let’s make the changes in our script. Also, changing the
    variable `num1` and now the script will look as below:


    ```bash

    #! /bin/bash

    num1=21

    num2=5

    echo "addition of 21 + 5"

    echo $( expr $num1 + $num2 )

    echo "subtraction of 21 - 5"

    echo $( expr $num1 - $num2 )

    echo "multiplication of 21 * 5"

    echo $( expr $num1 \* $num2 )

    echo "division  of 21 / 5"

    echo $( expr $num1 / $num2 )

    echo "modulus of 21 % 5"

    echo $( expr $num1 % $num2 )

    ```


    Let’s execute the script again. All operations should work, and now the change
    in modulus operations will be there.

    ```bash

    $ ./hello.sh

    addition of 21 + 5

    26

    subtraction of 21 - 5

    16

    multiplication of 21 * 5

    105

    Division of 21 / 5

    4

    modulus of 21 % 5

    1

    ```

    All looks good. Now you can see for modulus operation has an output as 1, which
    will be the remainder when 21 is divided by five as per arithmetic rules. Remember
    to use `\*` for multiplication when `expr` is being used.


    ## Decimal Number


    In this section, we will learn how to perform arithmetic operations with a decimal
    number. Default scripting does not support decimal arithmetic operations using
    the last two methods. To perform these operations, there are multiple tools available.
    We will use one tool. Before that, let’s understand why the decimal number does
    not perform with the methods we have learned until now. To understand the problem,
    let’s change the value of variable `num1` from 21 to 20.5 and add both ways to
    the script.


    Script will be as below:


    ```bash

    #! /bin/bash

    num1=20.5

    num2=5

    echo "addition of 20 + 5"

    echo $(( num1 + num2 ))

    echo "subtraction of 20 - 5"

    echo $(( num1 - num2 ))

    echo "multiplication of 20 * 5"

    echo $(( num1 * num2 ))

    echo "division  of 20 / 5"

    echo $(( num1 / num2 ))

    echo "modulus of 20 % 5"

    echo $(( num1 % num2 ))

    echo " addition of 20.5 + 5"

    echo $( expr $num1 + $num2 )

    echo " subtraction of 20.5 - 5"

    echo $( expr $num1 - $num2 )

    echo " multiplication of 20.5 * 5"

    echo $( expr $num1 \* $num2 )

    echo " division  of 20.5 / 5"

    echo $( expr $num1 / $num2 )

    echo " modulus of 20.5 % 5"

    echo $( expr $num1 % $num2 )

    ```


    Now let’s execute the script. The output will be as below:

    ```bash

    $ ./hello.sh

    addition of 20 + 5

    ./hello.sh: line 7: 20.5: syntax error: invalid arithmetic operator (error token
    is ".5")

    subtraction of 20 - 5

    ./hello.sh: line 9: 20.5: syntax error: invalid arithmetic operator (error token
    is ".5")

    multiplication of 20 * 5

    ./hello.sh: line 11: 20.5: syntax error: invalid arithmetic operator (error token
    is ".5")

    division of 20 / 5

    ./hello.sh: line 13: 20.5: syntax error: invalid arithmetic operator (error token
    is ".5")

    modulus of 20 % 5

    ./hello.sh: line 15: 20.5: syntax error: invalid arithmetic operator (error token
    is ".5")

    addition of 20.5 + 5

    expr: non-integer argument

    subtraction of 20.5 - 5

    expr: non-integer argument

    multiplication of 20.5 * 5

    expr: non-integer argument

    division of 20.5 / 5

    expr: non-integer argument

    modulus of 20.5 % 5

    expr: non-integer argument

    ```


    Here was can see with double parenthesis the error comes as “invalid arithmetic
    operator” and for operations using `expr` gives the error “non-integer argument.”
    To resolve such an issue, we can use tools, here in this book, we will explain
    a tool called `bc` stands for basic calculator. Most Linux operating systems come
    along with `bc` distribution. If this is not installed by default, it can be installed
    based on the Linux distribution you are working on (yum, yast, zypper, etc.).
    To learn in detail about `bc`, you can check the man page of `bc` as below.


    ```bash

    man bc

    ```

    This will open the man page of `bc`. With the definition of `bc`, you can see
    it defined as arbitrary-precision arithmetic language. It is a language for basic
    calculations. The man page will give all details for all options that can be used,
    but in this chapter, we will learn what we can do with `bc` for basic arithmetic
    operations.


    To understand `bc`, we will use it in our script. Now we are keeping only the
    variables, and defining the decimal arithmetic operation, we use the `echo` command.
    With `echo`, write the numbers to be calculated with the symbol of operation in
    double-quotes, and after the quotes close, put a pipe symbol and write `bc`. This
    means the numbers written in double-quotes will be treated as input to the `bc`
    written on the right-hand side of the pipe symbol.


    The script will become as below:


    ```bash

    #! /bin/bash

    num1=20.5

    num2=5

    echo "20.5+5" | bc

    ```

    Let’s execute the script.

    ```bash

    $ ./hello.sh

    25.5

    ```

    It has given the right result for the two integers we have put across the script.
    Similarly, we can do other arithmetic operations using this command. In below
    example, we are performing addition, subtraction, division, and modulus for the
    same numbers:


    ```bash

    #! /bin/bash

    num1=20.5

    num2=5

    echo "addition of 20.5 + 5"

    echo "20.5+5" | bc

    echo "subtraction of 20.5 - 5"

    echo "20.5-5" | bc

    echo "multiplication of 20.5 * 5"

    echo "20.5*5" | bc

    echo "division  of 20.5 / 5"

    echo "20.5/5" | bc

    echo "modulus of 20.5 % 5"

    echo "20.5%5" | bc

    ```

    Now let’s execute the script.

    ```bash

    $ ./hello.sh

    addition of 20.5 + 5

    25.5

    subtraction of 20.5 - 5

    15.5

    multiplication of 20.5 * 5

    102.5

    division  of 20.5 / 5

    4

    modulus of 20.5 % 5

    5

    ```

    Now we can see all operations have worked and gave the right answers except division.
    For division, it has not given us proper result. Let’s understand why it happened
    and how to solve this problem. To solve this problem with division, we will set
    function of `scale`. The `scale` defines up to which decimal place we want to
    see. In our example, let’s define a scale for two decimal places, so we will give
    the value of `scale` as 2 in the division operation.


    ```bash

    echo "division  of 20.5 / 5"

    echo "scale=2;20.5/5" | bc

    ```

    If you want to see output up to 2 decimal places, you can write it. For now, in
    our example, we are keeping the value as 2. Now we will execute the script.

    ```bash

    $ ./hello.sh

    addition of 20.5 + 5

    25.5

    subtraction of 20.5 - 5

    15.5

    multiplication of 20.5 * 5

    102.5

    division  of 20.5 / 5

    4.10

    modulus of 20.5 % 5

    5

    ```

    That means that whenever we have to do a division operation, we need to define
    up to which decimal place we want to see using the scale. If it is not written,
    then in output, it won’t show any decimal number, which might be the correct answer.
    Also, in the above example, we have seen that we have used numbers for calculation
    and haven’t used variables. The `bc` works for variables too. Let’s change the
    numbers to variables in the same script and check:


    ```bash

    #! /bin/bash

    num1=20.5

    num2=5

    echo "addition of 20.5 + 5"

    echo "$num1+$num2" | bc

    echo "subtraction of 20.5 - 5"

    echo "$num1-$num2" | bc

    ```

    Execute the script.

    ```bash

    $ ./hello.sh

    addition of 20.5 + 5

    25.5

    subtraction of 20.5 - 5

    15.5

    ```

    This looks fine. As we have seen in the man page, `bc` is not only for simple
    arithmetic calculations, but it can do much more than that. It can do arithmetic
    operations for square root, trigonometry, etc.


    ## Square Root


    Let’s now find the square root of a number. This can be done by an option of `bc`
    known as `sqrt()`. Option `sqrt()` will help to find the square root of the number
    followed by this string. Also, like previous calculations, we used a simple `bc`
    with no other options, but now for square root, we will use math operation; to
    get this done, we will add `-l` option with `bc`. Flag `-l` will call the math
    library in which there is a square root function. For example, we want the square
    root of number 27. First, we will set the variable `num` with 27. Also, we will
    set the scale to 2; as mentioned earlier, if you do not put the scale, there will
    be zero decimal places. After setting the scale, we will write `sqrt()` and, finally,
    the variable name. After writing this expression, we will pass this input to `bc`
    with option `-l`.


    ```bash

    #! /bin/bash

    num=27

    echo "scale=2;sqrt($num)" | bc -l

    ```

    Let’s execute the script now.

    ```bash

    $ ./hello.sh

    5.19

    ```

    We got the square root.


    ## Arithmetic Power Function


    Now let’s learn the arithmetic power function. To get the power of any number,
    it is done by the caret symbol `^`. Here also we need to set the scale with the
    number of decimal places we want to see in the output. For this function also
    we will use the `-l` flag with `bc`. To understand with an example, now we want
    to get 2 to the power of 3, the script will become like below:


    ```bash

    #! /bin/bash

    num=4

    echo "scale=2;2^3" | bc -l

    ```

    Let’s execute the script now.

    ```bash

    $ ./hello.sh

    8

    ```

    Which looks good.


    Some flags that can be used with `bc` are listed below:

    - `-h`, `--help`: Print the usage and exit.

    - `-i`, `--interactive`: Force interactive mode.

    - `-l`, `--mathlib`: Define the standard math library.

    - `-w`, `--warn`: Give warnings for extensions to POSIX `bc`.

    - `-s`, `--standard`: Process exactly the POSIX `bc` language.

    - `-q`, `--quiet`: Do not print the normal GNU bc welcome.

    - `-v`, `--version`: Print the version number and copyright and quit.


    More operations that can be done with `bc`:

    - `++ var`: Post increment in variable

    - `++var`: The variable is incremented by one, and the new value is the result
    of the expression.

    - `--var`: The variable is decremented by one, and the new value results from
    the expression.

    - `var ++`: The result of the expression is the value of

