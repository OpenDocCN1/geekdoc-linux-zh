    # 第八章：逻辑 ‘ AND ’ 和 ‘ O R ’ 运算符


    在本章中，我们将看到如何在 `if` 语句中使用 `AND` 和 `OR` 运算符。


    ## AND 运算符

    假设有一项需要在 `if` 语句中编写两个或多个表达式；在这种情况下，我们使用 `AND` 运算符。当我们使用 `AND` 运算符时，脚本将验证所有表达式以输出
    `then.` 中定义的成功信息。如果任何条件未通过验证，脚本将执行 `else` 中定义的代码。到目前为止，我们学习了如何在 `if` 语句中编写条件。现在要编写第二个条件，我们将使用
    `AND` 运算符。


    有三种使用 `AND` 运算符的方法：


    1. 两个表达式写在方括号中，这些括号由双 `&` 符号隔开，如下：

    ```bash

    if [ expression 1 ] && [expression 2 ]

    ```


