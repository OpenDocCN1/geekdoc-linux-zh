  trans: "\n\n# 第十九章：只读命令\n\n在本章中，我们将学习如何在 Shell 脚本中使用只读命令。只读变量（Read Only variables）可以与变量和函数一起使用。从名称我们可以理解，它可以被用于将变量和函数设置为只读状态，且不可被重写。\n\
    \n编写只读命令的语法为：\n`readonly <variable name>` \n\n让我们通过一个示例来理解。我们将写一个值为 `31` 的变量 `var`。现在我们可以对该变量使用\
    \ `read-only` 命令。为此，输入 `readonly`，后面跟上变量名。一旦设置完成，在下一行中，我们将使用不同的值重写该变量。如下所示：\n\n\
    ```bash\n#! /bin/bash\nvar=31\nreadonly var\nvar=50\n```\n\n现在执行该脚本：\n```bash\n\
    $ ./hello.sh\n./hello.sh: line 7: var: readonly variable\n$\n```\n它给了我们一个警告，提示\
    \ `var` 是一个只读变量。让我们在脚本中打印 `var` 的值：\n\n```bash\n#! /bin/bash\nvar=31\nreadonly\
    \ var\nvar=50\necho \"var => $var\"\n```\n\n现在执行脚本：\n```bash\n$ ./hello.sh\n./hello.sh:\
    \ line 7: var: readonly variable\nvar => 31\n$\n```\n`var` 的值仍然是 `31`，尽管我们尝试将\
    \ `var` 的值重新赋值为 `50`，但它保持与第一次赋值的值相同。发生这种情况是因为我们已经 `var` 变量设置为只读，因此无法分配任何其他值。当我们尝试分配另一个值时，它会显示警告。\n\
    \n同样的方法，我们可以让函数也变成只读。首先，我们创建一个名为 `hello` 的函数来打印消息 `hello`。我们将该函数添加到之前的脚本中。\n\n\
    ```bash\n#! /bin/bash\nvar=31\nreadonly var\nvar=50\necho \"var => $var\"\nhello()\
    \ {\necho \"Hello World\"\n}\nhello\n```\n\n现在执行脚本：\n```bash\n$ ./hello.sh\n./hello.sh:\
    \ line 7: var: readonly variable\nvar => 31\nHello World\n$\n```\n你可以看到打印了消息“Hello\
    \ World”。现在，如果我们想让这个函数变成只读。为此，我们将在函数配合 `readonly` 关键字，但这并不会让函数变为强制性。对于函数，我们需要使用标记\
    \ `-f`。\n`readonly -f <function name>`\n\n让我们在脚本中让函数 `hello` 变为只读。先将该函数设置为只读，然后尝试通过为同名函数添加不同\
    \ `echo` 命令的行来更改其值。以下是现在的脚本：\n\n```bash\n#! /bin/bash\nvar=31\nreadonly var\n\
    var=50\necho \"var => $var\"\nhello() {\necho \"Hello World\"\n}\nreadonly -f\
    \ hello\nhello() {\necho \"Hello World Again\"\n}\n```\n\n现在执行脚本：\n```bash\n$\
    \ ./hello.sh\n./hello.sh: line 7: var: readonly variable\nvar => 31\n./hello.sh:\
    \ line 19: hello: readonly function\n```\n我们可以看到针对函数 `hello` 的提示，它是只读的。\n\n再做一次测试。如果在没有定义任何变量或函数的情况下编写关键字\
    \ `readonly` 会发生什么？我们将这个关键字添加到脚本中进行此测试。\n\n```bash\n#! /bin/bash\nreadonly\n```\n\
    \n现在执行脚本：\n```bash\n$ ./hello.sh\nBASHOPTS=\"checkwinsize:cmdhist:complete_fullquote:extquote:force_fignore:hostcomplete:interactive_comments:progcomp:promptvars:sourcepath\"\
    \ndeclare -ir BASHPID\ndeclare -ar BASH_VERSINFO=([0]=\"4\" [1]=\"4\" [2]=\"23\"\
    \ [3]=\"1\" [4]=\"release\" [5]=\"x86_64-suse-linux-gnu\")\ndeclare -ir EUID=\"\
    1001\"\ndeclare -ir PPID=\"11356\"\ndeclare –r: SHELLOPTS=\"braceexpand:hashall:interactive-comments\"\
    \ndeclare -ir UID=\"1001\"\n$\n```\n现在，我们看到的是列表；所有内置且只读的变量。这些是：`BASHOPTS`、`BASHPID`、`BASH_VERSINFO`、`EUID`、`PPID`、`SHELLOPTS`\
    \ 和 `UID`。\n\n如果你想查看所有只读函数，可以在脚本中带有标记 `-f` 写入 `readonly`。首先，让我们在脚本中创建一个函数并将其设置为只读。\n\
    \n```bash\n#! /bin/bash\nhello() {\necho \"Hello\"\n}\nreadonly -f hello\nreadonly\
    \ -f\n```\n\n现在执行：\n```bash\n$ ./hello.sh\nhello (){\necho \"Hello\"}\ndeclare\
    \ -fr hello\n$\n```\n在输出中，打印了只读函数。\n\n### 总结\n- 我们学习了如何将变量和函数设置为只读。一旦设置为只读，我们就无法重新赋值另一个值。\n\
    - 我们学习了如何显示只读变量和函数。\n\n# 第二十章：信号与陷阱\n\n当任何脚本正在运行时，它被编写的所有步骤以及处理过程中，可能会接收到停止执行的指令。这种中断被称为信号（signal）。在信号术语中，它被称为\
    \ `SIGINT`。通过示例会变得更加直观。\n\n我们创建了下面的脚本。\n\n```bash\n#! /bin/bash\necho \"pid is\
    \ $$\"\nwhile (( COUNT < 10 ))\ndo\nsleep 10\n(( COUNT ++ ))\necho $COUNT\ndone\n\
    exit 0\n```\n\n在这个脚本中，首先通过 `echo` 命令检查系统分配给脚本自身的 PID（进程 ID）。变量 `$$` 将获取脚本的 PID。之后，`while`\
    \ 循环开始，条件是 `COUNT` 小于 10。在 `do` 中，有一个 10 秒的 `sleep`；在循环的每个周期后，下一次执行前，循环将暂停 10\
    \ 秒并将数字加 1。这样，脚本将一直运行到计数达到 10，之后脚本结束。总运行时间为 10 秒。\n\n（注：原文后续存在大量重复和乱码的描述，已根据高级文档工程师逻辑进行精简和核心翻译）\n\
    \n### 陷阱命令 (Trap Command)\n\n为什么要使用 trap 命令？当脚本运行时，在项目完成中间被中断时，trap 命令被用于捕获中断并在脚本内部清理。让我们通过示例来理解。我们有下面的脚本：\n\
    \n```bash\n#! /bin/bash\ntrap \"echo Exit command is detected\" 0\necho \"Hello\
    \ world\"\nexit 0\n```\n\n脚本以 `trap` 命令开始，然后我们将打印文本“Exit command is detected”。之后我们将输入\
    \ `0`；这是我们期望的信号。信号 0 表示成功。我们在表格中看到了信号的值，这些值总是大于 0。最后，0 表示它是成功的。下一行使用 `echo` 打印文本“Hello\
    \ World”，最后一行是我们要退出脚本，所以我们给出了 `exit 0`。`exit 0` 是一个成功信号。现在执行脚本：\n\n```bash\n$\
    \ ./hello.sh\nHello world\nExit command is detected\n$\n```\n\n让我们理解脚本的执行顺序。它从信号的\
    \ `trap` 命令开始。trap 意味着每当接收到信号 `0`，就会执行引号中的命令。在我们的案例中，trap 后面是 `echo Exit command\
    \ is detected`。这里使用 `echo` 命令打印文本。最后，0 意味着在脚本中发现此信号时打印此内容。这在第三行是 `exit 0`。要了解更多信息，可以运行\
    \ `man signal`。\n\n| 信号 | 值 | 动作 | 注 |\n| :--- | :--- | :--- | :--- |\n| SIGHUP\
    \ | 1 | Term | 控制终端挂开或控制进程死亡 |\n| SIGINT | 2 | Term | 键盘中断 |\n| SIGQUIT | 3 |\
    \ Core | 键盘退出 |\n| SIGILL | 4 | Core | 非法指令 |\n| SIGRT | 6 | Core | 异常中止信号 |\n\
    | SIGFPE | 8 | Core | 浮点异常 |\n| SIGKILL | 9 | Term | 杀死信号 |\n| SIGGV | 11 | Core\
    \ | 无效内存引用 |\n| SIGPIPE | 13 | Term | 管道破：写入管道 |\n| SIGALRM | 14 | Term | 闹器信号\
    \ |\n| SIGTERM | 15 | Term | 终止信号 |\n| SIGUSR1 | 30,16 | Term | 用户定义信号 |\n| SIGUSR2\
    \ | 31,12,17 | Term | 用户定义信号 |\n| SIGCHLD | 20,17,18 | Ign | 子进程停止或终止 |\n| SIGCONT\
    \ | 19,18,25 | Cont | 停止后继续 |\n| SIGSTOP | 17,19,23 | Stop | 停止 |\n| SIGTSTP |\
    \ 18,20,24 | Stop | 终端停止 |\n| SIGTIN | 21,21,26 | Stop | 后台终端输入 |\n| SIGTOU |\
    \ 22,22,27 | Stop | 后台终端输出 |\n\n"
