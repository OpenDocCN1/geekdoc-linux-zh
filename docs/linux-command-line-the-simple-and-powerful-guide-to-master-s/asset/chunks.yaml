    To evaluate the upper case character, it will be as below:\n\n`[A-Z]` )`echo \"\
    User entered $value; it is A to Z\" ;;`\n\nTo evaluate the integer character,\
    \ it will be as below:\n\n`[0-9]` )`echo \"User entered $value, it is 0 to 9\"\
    \ ;;`\n\nTo evaluate the single special character, it will be as below:\n\n`?`\
    \ )`echo \"User entered $value; it is a special character\" ;;`\n\nTo evaluate\
    \ more than one special or mix characters, it will be as below:\n\n`*` )`echo\
    \ \"Unknown input\" ;;`\n\nNow the script will become as below:\n\n```bash\n#!/bin/bash\n\
    echo -e \"Enter some character : \\c\"\nread value\ncase $value in\n[a-z] )echo\
    \ \"User entered $value; it is a to z\" ;;\n[A-Z] )echo \"User entered $value;\
    \ it is A to Z\" ;;\n[0-9] )echo \"User entered $value, it is 0 to 9\" ;;\n? )echo\
    \ \"User entered $value; it is a special character\" ;;\n* )echo \"Unknown input\"\
    \ ;;\nesac\n```\n\nLet’s execute the script now:\n\n*   Giving input as ‘f.’:\n\
    \    ```\n    $ ./hello.sh\n    Enter some character : f\n    User entered f;\
    \ it is a to z\n    ```\n\n*   Giving input as ‘G.’:\n    ```bash\n    $ ./hello.sh\n\
    \    Enter some character : G\n    User entered G; it is a to z\n    ```\n   \
    \ Here we see an error. We have input as `G.`, and when we gave input, the expected\
