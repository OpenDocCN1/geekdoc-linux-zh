  raw: 'the variable and then the variable is incremented by one.var --The result
    of the expression is the value of the variable, and then the variable is decremented
    by one.There are many more functions like comparisons or logical operations as
    you can see in the man page dealing with bc.SummaryWe learned two ways of doing
    arithmetic operations:


    1.  Variables do arithmetic operations inside double parenthesis brackets.


    2.  Variables to do arithmetic operations inside single bracket using ‘expr.’
    All are the same except multiplication for that \* is used as a symbol to multiply.


    3.  To do simple arithmetic operations, we can use bc


    4.  The square root is done with the flag ‘sqrt’ along with bc and option ‘-l.’


    5.  To get power of any number, this is done with symbol ‘^.’


    Chapter Ten: The Case StatementThe case statement is a good alternate for multi-level
    if, then, or else statements, it helps to match several values again one value.
    Now let’s see the basic syntax for the case statement.#! /bin/bashcase expression
    inpattern1 )statement ;;pattern2 )statement ;;...esacThe first line is to start
    the case statement; we will start it with ‘case,’ and then ‘expression’ to evaluate;
    this can be any variable name or expression. This line ends with the keyword ‘in.’case
    expression inThe next lines will have multiple patterns. There could be multiple
    cases to evaluate. The pattern could be a string, a pattern, a regular expression.
    The pattern line is closed with the closing parenthesis, which means that this
    is the end of this case.pattern1 )After pattern comes the ‘statement.’ If the
    expression is true, then the ‘statement’ will be executed. At the end of the line,
    there will be double semicolon (;;), which means that the statement of the above
    case is ended and starts evaluating the next case. This will keep going as many
    cases we want to evaluate.esacThe ‘case’ statement closes with ‘esac’, which is
    the reverse of case.Let’s understand how we can use the ‘case’ statement in practice
    with an example.Let’s say we are in the vehicle rental business. We will run an
    argument with a script, and we will save this argument in a variable. For the
    demo, we are keeping the variable name as ‘vehicle.’ The first value that will
    be entered into the argument is the value of the variable.Variable=$1To evaluate
    the variable ‘vehicle’ in the first expression after ‘case’, this variable will
    come here with a ‘$’ sign. This variable will have the value that will be passed
    to the argument, may be a model, brand, etc. We will end this line with ‘in.’
     The syntax will be as below:case $vehicle inNow comes the pattern; for now, we
    will just compare the pattern here. For example, if the variable ‘vehicle’ has
    the value ‘car’ in the argument, we will execute the statement. It will execute
    the statement as ‘echo’ that ''rent of the $vehicle is 100 dollars’ and then end
    the line with two semicolon symbols (;;)."car" )echo "Rent of the $vehicle is
    100 dollars" ;;For the next pattern, let’s say the argument given as ‘van.’ Now
    the variable value has become for ‘van.’ For this value, it will execute the echo
    statement with the message as “Rent of the $vehicle is 80 dollars,” and again,
    the line will with ended with;;."van" )echo "Rent of the $vehicle is 80 dollars"
    ;;Let’s add two more patterns for the inputs ‘bicycle’ and ‘truck’, the same format
    will be used, and in echo, we can change the statement as required. In this way,
    we have now four patterns in this example."bicycle" )echo "Rent of the $vehicle
    is 5 dollars" ;;"truck" )echo "Rent of the $vehicle is 800 dollars" ;;One more
    pattern we will add now that if the input is any other random value apart from
    these four patterns, then the pattern value will be ‘*.’ In Linux ‘*’ is a wild
    card, which means it matches everything. In that case, the statement will echo
    “vehicle unknown.”* )echo "Unknown vehicle" ;;Last, the script is ended by ‘esac.’The
    script will look as below:#! /bin/bashvehicale=$1case $vehicle in"car" )echo "Rent
    of the $vehicle is 100 dollars" ;;"van" )echo "Rent of the $vehicle is 80 dollars"
    ;;"bicycle" )echo "Rent of the $vehicle is 5 dollars" ;;"truck" )echo "Rent of
    the $vehicle is 500 dollars" ;;* )echo "Unknown vehicle" ;;esacNow let’s run our
    script. We will test it first, giving no argument. In this case, the condition
    * should execute$ ./hello.shUnknown vehicleThis looks right. It has send an echo
    message of the default case.Next, let’s try with an argument car.$ ./hello.sh
    carRent of the car is 100 dollarsIn this case, the condition of the car is met
    as per the script, so the echo command for the car has executed and gives the
    right message as expected.Similarly, we can test other patterns:$ ./hello.sh vanRent
    of the van is 80 dollars$ ./hello.sh truckRent of the truck is 500 dollarsThis
    way, we can check for the case strings, which are provided as input with the script.
    Right now, we are matching the strict pattern - that is matching the exact word
    which is given as an argument - but this could be any regular pattern also, that
    can also be done with the case. A regular pattern means an expression with strings
    of characters.Now we will look another example of the case statement and then
    merge our knowledge with the previous example that we just read.For now, we learned
    how ‘case’ works in scripting; we learned it with a basic syntax that we learned.
    Now in this example, we will evaluate some patterns in some cases.Let’s say we
    allow the user to enter any character, and then we evaluate that character. Based
    upon the character entered by the user, we will display if it is in uppercase,
    lowercase character, integer, any other special character, or that is not a character
    but a string. Now let’s start writing our script.First, after writing the script,
    we will define the script type that is the bash in our case. Next, we will ask
    to enter some character with an ‘echo’ command using the ‘-e’ option. As already
    explained, the ‘-e’ option to make script knows it must interpret the backslash
    escapes. We will use ‘\c’ in the ‘echo’ string so that the user can provide input
    in the same line.#! /bin/bashecho -e "Enter some character : \c."Now next, we
    will use the ‘read’ command to save that value in a variable. For this example,
    we keep that variable name as ‘value’.read  valueAny input entered by the user
    will not be stored in this variable. We will evaluate this value in the expression
    whether the entered character is an uppercase or lowercase. To check that, we
    will use patterns. There are rules to follow the pattern below is the list of
    some patterns.


    *   Small case: To evaluate if the pattern is lower case, small ‘a-z’ in square
    bracket [a-z] will be used.


    *   Upper case: To evaluate if the pattern is upper case, capital ‘A-Z’ in square
    bracket [A-Z] will be used.


    *   Integer: To evaluate if the pattern is an integer, ‘0-9’ in square bracket
    [0-0] will be used.


    *   Special character: to evaluate if the pattern is a special character, ‘?’
    symbol will be used in without square bracket. The symbol question mark ‘?’ is
    a pattern that expects any special one character letter.              If there
    is one or more than one character, then the asterisk symbol ‘*’ will be used.
    So, symbol ‘?’ is for one character, and ‘*’ is for one or more special characters
    in the string.'
