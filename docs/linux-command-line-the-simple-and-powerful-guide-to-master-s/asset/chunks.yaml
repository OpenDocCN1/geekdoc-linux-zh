    ## 引言

    本指南包含了如何使用 Linux 命令行界面成为 Shell 脚本高手的经过证明的步骤和策略。Shell 脚本是 Linux 管理员（无论是新手还是专业人士）所需的主要技能之一。本书为从基础到熟练的
    Linux 管理员提供了实用的操作知识。无论你是 Shell 脚本世界的新手，还是已经掌握了我们第一本初学者指南中的知识，这本书都将为你提供独特的见解。Shell
    脚本是你能够通过非常系统化的方法自动化大部分日常工作的唯一途径，从而节省你的时间和精力。在理解本书并完成所有提供的实际练习后，你的专业水平将提高很多许多级。你将理解
    Shell 的概念、它在后台如何工作，以及使用什么方法来编写实用的脚本。本书作者是行业内的专家和专业人士，分享了他们花费多年才学会的所有知识。本书为中级用户编写的，但如果你没有基础知识，前几章将为你提供概述并带你进入更高级的水平。我将涵盖基础知识，包括参数、运算符、数组、循环等，这些是任何专业人士每天进行
    Linux 管理任务都需要的内容。你将学习从非常基础到专家级练习的每个主题，并对使用的逻辑得到清晰。这本书将帮助你阅读和理解复杂的脚本，并根据预期结果对其进行动态更改。本书拥有更多的实际示例，并基于你已经读过我们的第一本书《初学者
    Shell 脚本教程》。如果你想获取更多基础方面的知识，我们建议购买该系列的第一本书，以理解 Shell 脚本的历史和理论。


    ## 第一章：什么是 Shell？

    Unix shell 解释用户直接执行的命令，或者通过读取名为 shell 脚本或 shell 程序的文件来执行命令。


    ### shell 的用法

    请看下图。

    当 Linux 机器启动时，它首先加载其内核（kernel）。内核是硬件和操作系统之间的接口。内核管理 CPU、内存、输入/输出设备等硬件资源，供任何软件运行。任何应用程序都需要连接到内核才能工作。这就是
    Shell 连接到内核的地方。


    了解 Shell 脚本是可以被解释的而不是被编译的是重要的。当你编写 Shell 脚本时，操作系统会解释它。有多种脚本类型可用。


    ### 你的操作系统支持哪些 Shell？

    要检查系统支持哪些 shell，检查 `/etc/shells` 文件。


    ```bash

    cat shells/bin/bash/bin/csh/bin/dash/sh

    ```

    上述输出显示系统可以运行的 shell：ash, bash, csh, dash, tcsh。


    `sh` 代表 Bourne shell，它是 Unix 或类 Unix 环境中使用的原始 shell。`sh` 是 Unix 系统使用的第一个 shell。


    **Bash** 代表 Bourne Again Shell，它是 `sh` 的改进版本。这些，`bash` 是标准 shell。它是直观且灵活的。它是系统中最常用的
    shell。它们也用于 MacOS 和 Windows 环境。


    要检查你的 shell 的位置，可以使用 `which` 命令。例如，你想检查操作系统系统中 `bash` shell 的位置，运行以下命令：


    ```bash

    which bash

    /bin/bash

    ```

    上述输出显示系统可以运行的 shell：ash, bash, csh, dash, sh, tcsh。


    ### 第一个脚本

    例如，你想检查操作系统系统中 `bash` shell 的位置，运行以下命令：


    ```bash

    which bash

    /bin/bash

    ```

    上述输出显示系统可以运行的 shell：ash, bash, csh, dash, sh, tcsh。


    要检查你的 shell 的位置，可以使用 `which` 命令。例如，你想检查操作系统系统中 `bash` shell 的位置，运行以下命令：


    ```bash

    which bash

    /bin/bash

    ```

    上述输出显示系统可以运行的 shell：ash, bash, csh, dash, sh, tcsh。


    （注：原文中关于“第一个脚本”的部分存在大量重复，译文已根据逻辑进行了精简和格式对齐）。


    要创建一个文件，使用 `touch` 命令：


    ```bash

    touch hello.sh

    ```

    检查权限，使用 `ls -l`：


    ```bash

    ls -l hello.sh

    ```

    -rw-r--r-- 1 user 0 date


    要使文件可执行，使用 `chmod +x`：


    ```bash

    chmod +x hello.sh

    ```

    再次检查权限：


    ```bash

    ls -l hello.sh

    ```

    -rwxr-xr-x 1 user 0 date


    要运行脚本：


    ```bash

    ./hello.sh

    ```


    ## 第二章：使用变量和注释

    在最后一章，我们查看了创建和执行新脚本。在本章中，我们将学习注释和变量。


    ### 注释

    注释是脚本中不执行的代码行，但有助于了解某些信息。脚本中以 `#` 开头的任何行都是注释，不会被脚本执行。

    示例：

    ```bash

    #!/bin/bash

    # 这是一个注释

    echo "Hello World"

    ```

    另一种方法是在代码后面加上 `#`。

    示例：

    ```bash

    #!/bin/bash

    echo "Hello World" # 这也是一个注释

    ```


    ### 变量

    变量是存储数据的容器。当你定义一个变量时，它存储某些数据。变量可以是字符串、数字等。变量有两种类型：


    #### 系统变量

    Unix 或 Linux 系统创建系统变量。这些是预定义的变量。按照标准约定，系统变量是大大写的。例如，在我们的 hello.sh 脚本中，我们可以添加一个系统变量
    `echo $BASH` 来检查用户的 shell 路径。


    ```bash

    #!/bin/bash

    echo "Hello World"

    echo $BASH

    ```

    现在，当我们执行脚本时，输出如下：


    ```bash

    ./hello.sh

    Hello World

    /bin/bash

    ```

    这显示了 bash 脚本的路径。为了熟悉系统变量：

    BASH_VERSION：显示 bash 版本


    '
- fmt: "\n`HOME`: To display the home directory.\n`PWD`: To display the present working\
    \ directory.\n\nNow the script will look like this.\n\n```bash\n#! /bin/bash\n\
    # This is a comment\necho \"Hello World\"   # This is also a comment\necho $BASH\n\
    echo $BASH_VERSION\necho $HOME\necho $PWD\n```\n\nWhen we execute the script,\
    \ the output will come like this.\n```bash\n$ ./hello.sh\nHello World\n/bin/bash\n\
    4.4.23(1)-release\n```\n\n- Output of `echo $BASH_VERSION` that is the version\
    \ of Bash in system: `/home/user1`\n- Output of `echo $HOME`, that is the home\
    \ directory of the user: `/home`\n- Output of `echo $PWD`, that is current directory\
    \ from where the script is executed.\n\nBelow you will find a list of some common\
    \ system variables.\n\n### User-Defined Variables\nThe user-defined variables\
    \ are created and maintained by users like us. As a general practice, these are\
    \ defined in lower case, but there is no rule which stops you from writing these\
    \ variables in upper case. The variable's name should contain alphabetic and not\
    \ numeric values. If any variable name starts with a number, then the script may\
    \ execute with no error, but the output may be incorrect.\n\nTo define this variable,\
    \ write the name of the variable - that could be anything and then give it a value.\
    \ Separate the name of the variable and its value with symbol `=`. The `echo`\
    \ command can display the value of the variable by putting the `$` symbol before\
    \ the variable name.\n\nFor example, our `hello.sh` script lets us add a user-defined\
    \ variable `name` and its value as `John`. Before giving its value, we can also\
    \ type a text string and use the value in between the strings as in the example\
    \ below.\n\nThe script will look like this:\n\n```bash\n#! /bin/bash\n# This is\
    \ a comment\necho \"Hello World\"   # This is also a comment\n# Below are the\
    \ system-defined variables.\necho $BASH\necho $BASH_VERSION\necho $HOME\necho\
    \ $PWD\n# Below is the user-defined variable\nname=John\necho $name\n```\n\nNow,\
    \ when you execute the script, having system variables and the new user-defined\
    \ variable, the output will be displayed as below:\n```bash\n$ ./hello.sh\nHello\
    \ World\nMy shell is /bin/bash\nMy Shell version name is 4.4.23(1)-release\nMy\
    \ home directory is /home/user1\nMy present working directory is /home\nJohn\n\
    ```\n\nSimilarly, text string can also be used in system-defined variables, also\
    \ as below. Now the script will look like this:\n\n```bash\n#! /bin/bash\n# This\
    \ is a comment\necho \"Hello World\"   # This is also a comment\n# Below are the\
    \ system-defined variables\necho My shell is $BASH\necho My Shell version name\
    \ is $BASH_VERSION\necho My home directory is $HOME\necho My present working directory\
    \ is $PWD\n# Below are user-defined variables\nname=John\necho The name is $name\n\
    ```\n\nAnd when we execute the script, the output will look like below:\n```bash\n\
    $ ./hello.sh\nHello World\nMy shell is /bin/bash\nMy Shell version name is 4.4.23(1)-release\n\
    My home directory is /home/user1\nMy present working directory is /home\nThe name\
    \ is John\n```\n\n**Summary:** You learned how to use comments and variables,\
    \ system variables, and user-defined variables in the shell script.\n\n### Chapter\
    \ Three: Read User Input\nIn this chapter, you will learn how we read inputs from\
    \ the inputs given from your terminal in your script. To get some input from the\
    \ keyboard, use the `read` command. This takes input from the keyboard and assigns\
    \ it as a value for the variable. This is a user-interactive way to get the input\
    \ of a variable. In a nutshell, when we execute the script, it prompts us for\
    \ some value from the user, and this input becomes the value of that variable.\n\
    \nLet’s see an example in the script that will ask you to enter a name. The name\
    \ we enter will become the value of the variable, and finally, `echo` will display\
    \ the name given. The script will look like this:\n\n```bash\n#! /bin/bash\necho\
    \ \"Enter the name : \"\nread name\necho \"The name entered is : $name\"\n```\n\
    \n- Message to enter a name: `read name`\n- `read` command prompts the user to\
    \ enter the name, and this will become the value of variable.\n- `echo \"The name\
    \ entered is : $name\"`: Display the name entered for the variable in the input\
    \ above.\n\nNow when we execute the script, the system will wait for the ‘value’\
    \ input after the `read` command:\n```bash\n$ ./hello.sh\nEnter the name :\nJohn\n\
    The name entered is: John\n```\n- Displays the 1st line of script: `John`\n- Input\
    \ typed by user: `John`\n- Displays 3rd line of script with output as ‘John’,\
    \ the value given in line 2.\n\n#### Add Multiple Variables\nThere may be a situation\
    \ when you want to add multiple variables in the same command. It can be done\
    \ by adding multiple variable names after the `read` command. A space should separate\
    \ each variable. To display the multiple values in output, the output line must\
    \ also have all variable names defined for which we want to see the output.\n\n\
    For example, in the previous script, we wanted the user to input three names and\
    \ display the same in output. In that case, the script would look like this:\n\
    \n```bash\n#! /bin/bash\necho \"Enter the names : \"\nread name1 name2 name3\n\
    echo \"The Names entered are : $name1, $name2, $name3\"\n```\n\nAnd when we execute\
    \ the script, the output looks like this:\n```bash\n$ ./hello.sh\nEnter the names\
    \ :\nJohn Mak Adam\nThe names entered are: John, Mak, Adam\n```\n- All inputs\
    \ should be in the same line, separated by space.\n\nIn the above example, when\
    \ we execute the script, the script prompts us to enter that name and that prompt\
    \ goes on the next line. Sometimes we would need to get the prompt on the same\
    \ line as a string. In that scenario, we place the input on the same line where\
    \ the query was prompted. Sometimes is it necessary to have the prompt on the\
    \ same line as the string. By adding a flag `-p` after `read` command, this can\
    \ be done.\n\nFor example, in the example below:\nWe make the first line the system\
    \ aware of the shell type being used.\nThe second line is where the `read` command\
    \ is running with a `-p` flag, so the system should prompt the value on the same\
    \ line, and then `user_var` is the variable name.\nThe third line, `echo`, will\
    \ display the text `username` with the variable value, entered the second line\
    \ as a value of `user_var`. The script will look like this:\n\n```bash\n#! /bin/bash\n\
    read -p 'username : ' user_var\necho \"Entered username : $user_var\"\n```\n\n\
    The script will execute as below:\n```bash\n$ ./hello.sh\nusername : john\nEntered\
    \ username: john\n```\n- System prompt input in same line.\n- Output displayed\
    \ as the input given in the previous step.\n\n#### Silent Input\nSometimes there\
    \ is a requirement to have silent input. Silent means it does not display the\
    \ input on the screen, like passwords. When we type a password on the system,\
    \ we prefer that the system does not display it for security reasons. We can do\
    \ this by adding the flag `-s`.\n\nIn the previous script, let’s add `pass_var`\
    \ as a variable to enter the password, and it should be silent. So in this case,\
    \ we have to use two flags, `-p` to prompt on the same line and `-s` to keep the\
    \ input silent. Now the script will look like this:\n\n```bash\n#! /bin/bash\n\
    read -p 'username : ' user_var\nread -s 'password : ' pass_var\necho \"Entered\
    \ username : $user_var\"\necho \"Entered password : $pass_var\"\n```\n\nThe output\
    \ shown below will come when we execute the script:\n```bash\n$ ./hello.sh\nusername\
    \ : john\nEntered username: john\nEntered password:\n```\nThe password looks silent,\
    \ but the system has captured it as the value in `pass_var`. With the `echo` command\
    \ to display the password variable, the output-output does not look meaningful.\
    \ It needs a correction to display the outputs of `echo` in the next line. To\
    \ fix this, you can add a blank `echo` to the next line.\n\n```bash\n#! /bin/bash\n\
    read -p 'username : ' user_var\nread -s 'password : ' pass_var\necho \"Entered\
    \ username : $user_var\"\necho \"Entered password : $pass_var\"\n```\n\nNow execute\
    \ the script, the output looks like this:\n```bash\n$ ./hello.sh\nusername : john\n\
    Entered username: john\nEntered password: \n```\n\n#### Array\nThere are situations\
    \ when inputs are in thousands; the time needed to set the values of all variables\
    \ individually will be a viable solution. In that case, `array` comes into the\
    \ picture. An array can store multiple values by setting up the index number.\
    \ Bash shell starts index numbers from `0`.\n\nNow let’s understand how we can\
    \ create arrays and how to display the values of an array. In case you want to\
    \ allow users to enter multiple inputs and want to save those inputs into an array,\
    \ the `-a` flag will help to get done.\n\n```bash\n#! /bin/bash\necho \"Enter\
    \ Names : \"\nread -a names\necho \"Names : ${names[0]}, ${names[2]}\"\n```\n\n\
    In the script with `read` command, we have set `-a` flag, which means we can give\
    \ multiple input as input. The last line is doing an `echo` for index number at\
    \ 0 and 2. Let’s execute the script and see how output looks.\n```bash\n$ ./hello.sh\n\
    Enter Names :\nJohn Mak Adam\nNames : John, Adam\n```\nIn this example, we have\
    \ given input of 4 names for the array `names` separated by a space. The last\
    \ line shows the value of elements created in the array as the first name `john`\
    \ and third name `adam`.\n\n#### REPLY\nThere is another variable known as `REPLY`\
    \ which is a default variable with the `read` command. What happens when there\
    \ is no variable written in front of `read`? The default variable `REPLY` works,\
    \ it just displays the inputs given to `read`.\n\n```bash\n#! /bin/bash\necho\
    \ \"Enter Names : \"\nread\necho \"Names: $REPLY\"\n```\n\nWhen we execute the\
    \ script:\n```bash\n$ ./hello.sh\nEnter Names :\nJohn Mak Adam\nNames: John Mak\
    \ Adam\n```\nWe set the input of 4 names as the value of `REPLY`, and the output\
    \ is the same as input.\n\n### Chapter Four: Pass Arguments to Script\nIn the\
    \ last chapter, we looked at reading parameters. There are requirements when you\
    \ need to pass arguments to the script. Arguments are the inputs to the standard\
    \ input to get a filtered output. An example when we write `ls /home`, that means\
    \ `ls` is the command and `/home` is an argument to show the listing of files\
    \ in `/home` directory. Similarly, command `ls /home` now has two arguments `/`\
    \ and `/home`. In this chapter, we will discover how arguments are passed to a\
    \ script.\n\nIn the script shown below, after `echo`, the `$1`, `$2`, and `$3`\
    \ means there would be three arguments that would be the inputs. These three variables\
    \ will store the values that will be entered as input variables.\n\n```bash\n\
    #! /bin/bash\necho $1 $2 $3\n```\n\nNow to execute the script, we will give three\
    \ arguments along with the script, and in the output, we should see these three\
    \ values printed.\n```bash\n$ ./hello.sh John Mak Tom\nJohn Mak Tom\n```\nWe saw\
    \ that we got an output for `$1`, `$2`, and `$3` variable as `John`, `Mak`, and\
    \ `Tom`, respectively. But in input apart from these 3 inputs there is another\
    \ 4th variable in the input that is `./hello.sh`, that has not come in output.\
    \ This is the variable at 0th number. Since in our script we have not written\
    \ `$0`, it does not print this. Now let’s add `$0` to the script, and then we\
    \ should see `./hello.sh` in the output.\n\n```bash\n#! /bin/bash\necho $0 $1\
    \ $2 $3\n```\n\nLet’s execute and see the output:\n```bash\n$ ./hello.sh John\
    \ Mak Tom\n./hello.sh John Mak Tom\n```\nWe expected this, now we have got the\
    \ 0th variable - `./hello.sh` also in the output.\n\nNow you need to understand\
    \ how you can parse the arguments whatever you give to your script as an array.\
    \ To do this in the script, let’s add a variable `args`. There is a default variable\
    \ in which these arguments go in as an array, and that is `$@`. To define an array,\
    \ you need to write `$@` in a bracket `($@)`. `$@` stores your arguments as an\
    \ array; these arguments will be the values of the variable `args`. Once these\
    \ are set, we can print the output with the `echo` command. To print the output,\
    \ we will use the format of the array to display the values of the variables.\
    \ There you can define that array `args` should print the value of which the index\
    \ number.\n\n```bash\n#! /bin/bash\necho $0 $1 $2 $3\nargs=($@)\necho ${args[0]}\
    \ ${args[1]} ${args[2]} ${args[3]}\n```\n\nNow the script will become as below:\n\
    ```bash\n#! /bin/bash\necho $0 $1 $2 $3\nargs=($@)\necho ${args[0]} ${args[1]}\
    \ ${args[2]} ${args[3]}\n```\n\nOnce the script is executed the output looks like\
    \ this:\n```bash\n$ ./hello.sh John Mak Tom\n./hello.sh John Mak Tom\nJohn Mak\
    \ Tom\n```\nWait, the logic above for array indexing is off. Let's use the correct\
    \ syntax:\n\n```bash\n#! /bin/bash\necho \"Enter Names : \"\nread -a names\necho\
    \ \"Names : ${names[0]}, ${names[2]}\"\n```\n```bash\n$ ./hello.sh\nEnter Names\
    \ :\nJohn Mak Adam\nNames : John, Adam\n```\nIn this example, we have given input\
    \ of 4 names for the array `names` separated by a space. The last line shows the\
    \ value of elements created in the array as the first name `john` and third name\
    \ `adam`.\n\n### Chapter Five: if Statement\nIn this chapter, we will learn about\
    \ the `if` statement. If you are familiar with any programming language, then\
    \ you may know an `if` statement can test some condition and if the condition\
    \ is true, then the code will be executed; otherwise it goes to `else` or is not\
    \ executed.\n\n#### How to Write the if in a Statement\nIn the script, once the\
    \ `if` condition is there, it will have a square bracket that enclose the condition.\
    \ There should be a space for text in the beginning, and towards the end of the\
    \ square bracket, or the script will give an error. The text written in the next\
    \ line follows the keyword `then`. The next line says if the condition is true,\
    \ then follow the statement, and once the statement is executed, the last line\
    \ will have `fi` for the end.\n\nBelow is the basic syntax of `if` statement how\
    \ it will look:\n\n```bash\nif [condition]\nthen\n    statement\nfi\n```\n\nBelow\
    \ is the list of the operator that integers and string comparison will use:\n\
    - `-eq`: is equal to - `if [ \"$a\" -eq \"$b\" ]`\n- `-ne`: is not equal to -\
    \ `if [ \"$a\" -ne \"$b\" ]`\n- `-gt`: is greater than - `if [ \"$a\" -gt \"$b\"\
    \ ]`\n- `-ge`: is greater or equal to - `if [ \"$a\" -ge \"$b\" ]`\n- `-lt`: is\
    \ less than - `if [ \"$a\" -lt \"$b\" ]`\n- `-le`: is less or equal to - `if [\
    \ \"$a\" -le \"$b\" ]`\n- `<`: is less than - `if [ \"$a\" < \"$b\" ]`\n- `<=`\
    \ is less or equal to - `if [ \"$a\" <= \"$b\" ]`\n- `>` is greater than - `if\
    \ [ \"$a\" > \"$b\" ]`\n- `>=`: is greater or equal to - `if [ \"$a\" >= \"$b\"\
    \ ]`\n\n**String Comparisons:**\n- `=` is equal to - `if [ \"$a\" = \"b\" ]`\n\
    - `==` is equal to - `if [ \"$a\" == \"b\" ]`\n- `!=` is not equal to - `if [\
    \ \"$a\" != \"b\" ]`\n- `<` is less than, in alphabetical order - `if [[ \"$a\"\
    \ < \"b\" ]`\n- `>` is greater than, in alphabetical order - `if [[ \"$a\" > \"\
    $b\" ]`\n- `-z`: String is null, that is, it has zero length.\n\nThis example\
    \ is used to understand the first operation `equal to` (`-eq`). In the condition,\
    \ we can put some parameters to compare the number. For that, we will use comparison\
    \ operators with an integer. For comparison, we will use equality, non-equality,\
    \ greater than, less than, greater than and equal to, less than and equal to,\
    \ etc.\n\nFor this example, we are setting up a variable `unit` with its value\
    \ as `10`. We will use `equal to–eq` as a comparison operator. After giving the\
    \ operator, provide a number, in our example, we are giving number `9`. Now we\
    \ know that the condition is not true as ten is not equal to 9. In `then` we are\
    \ putting an `echo`, that condition is true. In our case, the condition is not\
    \ true; it will print to nothing in the output. The script will look like below:\n\
    \n```bash\n#! /bin/bash\nunit=10\nif [ $unit -eq 9 ]\nthen\n    echo \"condition\
    \ is true.\"\nfi\n```\n\nNow let’s execute the script:\n```bash\n$ ./hello.sh\n\
    ```\nAs expected, nothing printed in output as the condition is not true. To make\
    \ the condition true, we will change the number from `9` to `10`, and then the\
    \ condition becomes true. Now the script will look like this:\n\n```bash\n#! /bin/bash\n\
    unit=10\nif [ $unit -eq 10 ]\nthen\n    echo \"condition is true.\"\nfi\n```\n\
    \nNow let's execute the script:\n```bash\n$ ./hello.sh\ncondition is true\n```\n\
    Now it prints \"condition is true.\" To get more familiar with this, you can try\
    \ other expressions mentioned in the table.\n\n#### -ne (not equal to)\nLet's\
    \ change the script and execute:\n```bash\n#! /bin/bash\nunit=10\nif [ $unit -ne\
    \ 9 ]\nthen\n    echo \"condition is true.\"\nfi\n```\n```bash\n$ ./hello.sh\n\
    condition is true\n```\n\n#### -gt (greater than)\nLet's change the script and\
    \ execute:\n```bash\n#! /bin/bash\nunit=10\nif [ $unit -gt 9 ]\nthen\n    echo\
    \ \"condition is true.\"\nfi\n```\n```bash\n$ ./hello.sh\ncondition is true\n\
    ```\n\n#### Else\nWhen learning about the `if` statement, we learned one other\
    \ condition which is `then`. There is another condition you can use which is the\
    \ `else` condition. In the `if` statement, the `if` condition met the `if` expression,\
    \ the script executes the command defined in `then`, but what will happen if the\
    \ condition is false, then we may need to run some other command, `else` condition\
    \ does that. In short, if the condition matches, the command defined in `then`\
    \ will execute. If it does not meet the condition, the script will run the command\
    \ defined in `else`. Examples illustrated below will give more clarity.\n\nWe\
    \ will add `else` condition in our existing script now. After we define the condition\
    \ in `then`, in the next line, we will add the `else` condition with a next line\
    \ with the command to execute it. Also, we will change the `if` statement to check\
    \ if `a` is equal to `b`. In this script, the script will check first if this\
    \ condition is true or not; it is not. Now the script will ignore the `then` condition\
    \ and directly run the command written in the `else` condition. The script will\
    \ look like below:\n\n```bash\n#! /bin/bash\nunit=a\nif [[ $unit == b ]]\nthen\n\
    \    echo \"condition is true.\"\nelse\n    echo \"condition is false.\"\nfi\n\
    ```\n```bash\n$ ./hello.sh\ncondition is false\n```\nThis is what we expected.\
    \ So the `else` condition will execute if the condition is not true.\n\n#### elif\
    \ (multiple conditions)\nIf you want, you can evaluate multiple conditions, and\
    \ based on those multiple conditions, the statement will take action. In that\
    \ case, `elif` does it.\n\n```bash\n#! /bin/bash\nunit=a\nif [[ $unit == b ]]\n\
    then\n    echo \"condition is true.\"\nelif [[ $unit == a ]]\nthen\n    echo \"\
    condition is true.\"\nelse\n    echo \"condition is false.\"\nfi\n```\n"
