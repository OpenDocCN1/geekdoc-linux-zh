    number. Since in our script we have not written $0, it does not print this. Now
    let’s add $0 to the script, and then we should see ./hello.sh in the output.Now
    the script has become#! /bin/bashecho $0 $1 $2 $3Let’s execute and see the output.$
    ./hello.sh John Mak Tom./hello.sh John Mak TomWe expected this, now we have got
    the 0th variable - ./hello.sh also in the output.Now you need to understand how
    you can parse the arguments whatever you give to your script as an array. To do
    this in the same script, let’s add a variable ‘args.’ There is a default variable
    in which these arguments go in as an array, and that is "@.” To define an array,
    you need to write $@ in a bracket - ($@).  ‘$@’ stores your arguments as an array;
    these arguments will be the values of the variable ‘args.’ Once these are set,
    we can print the output with the ‘echo’ command. To print the output, we will
    use the format of the array to display the values of the variables. There you
    can define that array ‘args’ should print the value of which the index number.Now
    the script will become as below:#! /bin/bashecho $0 $1 $2 $3args=("$@")echo ${args[0]}
    ${args[1]} ${args[2]} ${args[3]}Once the script is executed the output looks like
    this$ ./hello.sh John Mak Tom./hello.sh John Mak TomJohn Mak TomIn the first line,
    we executed the script with the same three arguments. The second line shows the
    output of arguments as the 1st command (echo $0 $1 $2 $3), and the third line
    shows the output of array (args=("$@")). Now the critical point to note here is,
    in the second line, the index 0 was ./hello.sh, and when it becomes the argument
    for an array, the index 0 was John. For arguments, the script name 0 index did
    not print.Therefore, the default variable starts from 0, where 0 is the variable
    for the script name. But when you assign them as an array, then the 0th index
    will be the first argument similarly 1st index will be the second argument, 2nd
    index will be the third argument and so on. That means if we delete ‘${args[3]}’
    from the script, the result will be the same. Let’s try this:#! /bin/bashecho
    $0 $1 $2 $3args=("$@")echo ${args[0]} ${args[1]} ${args[2]}Now, still, the output
    is the same.$ ./hello.sh John Mak Tom./hello.sh John Mak TomJohn Mak TomIf you
    want to display all the values of the array, then you can echo the $@ variable.
    This is the default variable that will show all the arguments. Now in the script,
    let’s comment on the echo line and add a new echo line with $@ to display all
    the arguments.#! /bin/bashecho $0 $1 $2 $3args=("$@")# echo ${args[0]} ${args[1]}
    ${args[2]} ${args[3]}echo $@Now let’s execute the script with the same arguments,
    the output will show all arguments.$ ./hello.sh John Mak Tom./hello.sh John Mak
    TomJohn Mak TomAnd yes, it did. This shows it saved all the arguments in the default
    variable @Sometimes there is a need to know the number of arguments passed to
    the script, a default variable for this that is ‘# can do this. The "#” variable
    is a default variable to show the number of arguments passed to the script.In
    our script, we have passed three arguments, so when we made the changed to the
    script by adding this variable, it should display the number 3.  Let’s add this
    variable to the script. The script will look like this:#! /bin/bashecho $0 $1
    $2 $3args=("$@")# echo ${args[0]} ${args[1]} ${args[2]} ${args[3]}echo $@echo
    $#When we execute the script, the output will be$ ./hello.sh John Mak Tom./hello.sh
    John Mak TomJohn Mak Tom3Now here we can see the number 3, which shows that three
    numbers of arguments passed to the script as input.These are the few ways you
    can pass on the arguments to the shell script.Chapter Five: if StatementIn this
    chapter, we will learn about the "if” statement. If you are familiar with any
    programing language, then you may know that an if statement can test some condition
    and if the condition is true, then the code will be executed; otherwise, it goes
    to the else condition or is not executed.  Let’s know how we can use the "if”
    statement in our script.How to Write the if in a StatementIn the script, once
    the “if” condition is there, it will have a square bracket that will enclose the
    condition. There should be a space for text in the beginning, and towards the
    end of the square bracket, or else the script will give an error. The text written
    in. The next line follows the keyword “then.”  The next line says if the condition
    is true, then follow the statement, and once the statement is executed, then the
    last line will have “fi” for the end of the ‘if’ statement.Below is the basic
    syntax of ‘if’ statement how it will lookif [condition]then​ StatementfiBelow
    is the list of the operator that integers and string comparison will use:-eq -
    is equal to - if ["$a" -eq "$b"]-ne - is not equal to - if [ "$a" -ne "$b" ]-gt
    - is greater than - if [ "$a" -gt "$b" ]-ge - is greater than or equal to - if
    [ "$a" -ge "$b"]-lt - is less than - if [ "$a" -le "$b" ]-le - is less than or
    equal to - if [ "$a" -le "$b" ]< - is less than - (("$a" < "b"))<= - is less than
    or equal to - (("$a" <= "$b"))> - is greater than - (("$a" > "$b"))>= -  is greater
    than or equal to - (("$a" >= "$b"))String Comparisons= - is equal to - If [ "$a"
    == "b" ]== - is equal to - If [ "$a" == "b" ]!= - is not equal to - if [ "$a"
    != "b" ]< - is less than, in ASCII alphabetical order - if [[ "$a" < "b" ]]> -
    is greater than, in ASCII alphabetical order - if [[ "$a" > "b" ]]-z - String
    is null, that is, it has zero lengthThis example is used to understand the first
    operation ‘equal to’ ( -eq).  In the condition, we can put some parameters to
    compare the number. For that, we will use comparison operators with an integer.
    For comparison, we will use equality, non-equality, greater than, less than, greater
    than and equal to, less than and equal to, etc.For this example, we are setting
    up a variable "unit” with its value as 10\. We will use ‘equal to–eq’ as a comparison
    operator.  After giving the operator, provide a number, in our example, we are
    giving number 9. Now we know that the condition is not true as ten is not equal
    to 9\. In “then” we are putting an echo, that condition is true.  In our case,
    the condition is not true; it will print to nothing in the output.The script will
    look like below:#! /bin/bashunit=10if [$unit -eq 9 ]thenecho "condition is true."fiNow
    let’s execute the script.$ ./hello.sh$As expected, nothing printed in output as
    the condition is not true. To make the condition true, we will change the number
    from 9 to 10, and then the condition becomes true.Now the script will look like
    this:#! /bin/bashunit=10if [ $unit -eq 10 ]thenecho "condition is true."fiLet’s
    execute the script .$ ./hello.shcondition is trueNow it prints “condition is true.”
    To get more familiar with this, you can try other expressions mentioned in the
    table. Below are more examples to get good clarity on using comparisons.For expression–ne,
    that is ‘not equal to’ and Let''s use 9 in the ''if’ statement. That means the
    condition is true as nine is not equal to 10. Let’s change the script and execute
    it.#! /bin/bashunit=10if [ $unit -ne 9 ]thenecho "condition is true."fiLet’s execute
    the script.$ ./hello.shcondition is trueIt works well.Expression –gt – greater
    than. Now in our script, ten is greater than 9, which means the condition is true,
    so we should get the same output. Let’s change the expression in the “if” statement
    and execute the script.#! /bin/bashunit=10if [ $unit -gt 9 ]thenecho "condition
    is true."fiLet’s execute the script.$ ./hello.shcondition is trueSimilarly, you
    can try all the operators. As you can see in the table. For angle bracket symbols
    - < and >, the format is different. For angle brackets, which side the side which
    angle bracket opens has to be the bigger number, for example, the right format
    to write is 10 > 9. Here the angle bracket opens toward 10, as that is a bigger
    number. To fulfill the condition, we need to follow this rule.Now we are changing
    the script with an angle bracket and see how the script works.#! /bin/bashunit=10if
    [ $unit > 9 ]thenecho "condition is true."fiNow let’s execute the script:$ ./hello.shcondition
    is trueOne more change in the ‘if’ statement. In place of the square bracket,
    we will put double parentheses, and it should work.Let’s change the script with
    double parentheses and see the result.#! /bin/bashunit=10if (( $unit > 9 ))thenecho
    "condition is true."fiNow let’s execute the script:$ ./hello.shcondition is trueNext,
    we will see the greater than and equal to expression (>=) in the script and see
    how it works. In our script, this condition is also true.Make the changes script;
    it looks like as below:#! /bin/bashunit=10if (( $unit >= 9 ))thenecho "condition
    is true."fiNow let’s execute the script:$ ./hello.shcondition is trueSimilarly,
    you can try the other integer expressions.To compare the string expression, the
    conditions work in the same way; only the format will change. For expression equal
    to ( = or == ), not equal to ( != ), in the ‘if’ syntax the conditions go in the
    square brackets. The angled brackets (< or >) are used for alphabetical order.In
    our script, now we will use alphabet expressions. To use the alphabetic expressions,
    we will put square brackets in the ‘if’ statement. We are using the value for
    variable ‘unit’ as abc and in ‘if’ condition, let’s put the value also ‘abc.’Now
    the script will as below:#! /bin/bashunit=abcif [ $unit == abc ]thenecho "condition
    is true."fiNow let’s execute the script:$ ./hello.shcondition is trueLet’s change
    the value in the condition value for ‘if’ from abc to abcd, which is not a true
    condition.Now the script will as below:#! /bin/bashunit=abcif [ $unit == abcd
    ]thenecho "condition is true."fiExecute the script; the output should be blank:$
    ./hello.sh$The result is as expected.In this above example for the string, we
    have used double equal signs (==), even if we use the single equals to sign, that
    will also work. Normally in programming languages like C++, Java, etc., uses only
    ==, but in scripting, it works both = or ==.Another condition string is not equal
    to (!=). We are now changing the script to check this condition. Changing the
    condition for an if statement from abc to abcd. The script will be now as below:#!
    /bin/bashunit=abcif [ $unit != abcd ]thenecho "condition is true."fiThe condition
    is true, so when we execute the script, we should get the success message.$ ./hello.shcondition
    is trueThis looks perfect.If you want to check the alphabetical order, angular
    brackets can do that (< or >). To check this in the script, we are changing the
    unit value to ‘a’ and putting ‘b’ as a condition value in the ‘if’ statement using
    an angular bracket with an open side towards ‘b.’ Here one more rule will be applied
    now when there are integers to compare with angular symbols; then double brackets
    are used. Now, in this case, we are using alphabets to compare, so we need to
    use double square brackets. If the same brackets are used for the alphabet script,
    it won’t work and end up with an error.Script will be as below:#! /bin/bashunit=aif
    [[ $unit < b ]]thenecho "condition is true."fiIn alphabetical order, ‘a’ comes
    before ‘b’, that means the condition is true. When the script is executed, the
    message will come.$ ./hello.shcondition is trueIn summary, keep the conditions
    shown below in mind.Square brackets [ or ] are used in comparison operators with
    integers with eq, ne, gt, ge, lt, and le operations.Double parentheses (( or ))
    are used where integer comparison using angular brackets < or >.Square brackets
    [ or ] are used to compare equality of the strings with operators =, == or !=.Double
    square brackets [[ or ]] are used when a string comparison is done with angular
    brackets < or >.ElseWhen learning about the if statement, we learned one other
    condition which is ‘then’. There is another condition you can use which is the
    ‘else’ condition. In the ‘if’ statement, the if condition met the ‘if’ expression,
    the script executes the command defined in ‘then,’ but what will happen if the
    condition is false, then we may need to run some other command, ‘else’ condition
    does that. In short, if the condition matches, then the command defined in ‘then’
    will execute. If it does not meet the condition, the script will run the command
    defined in ‘else.’ Examples illustrated below will give more clarity.We will add
    ‘else’ condition in our existing script now.After we define the condition in ‘then,’
    in the next line, we will add the ‘else’ condition with a next line with the command
    to execute it. Also, we will change the ‘if’ statement to check if ‘a’ is equal
    to ‘b.’ In this script, the script will check first if this condition is true
    or not; it is not. Now the script will ignore the ‘then’ condition and directly
    run the command written in the ‘else’ condition. The script will look like below:#!
    /bin/bashunit=aif [[ $unit ==  b ]]thenecho "condition is true."elseecho "condition
    is false."fiScript will give the below output once executed:$ ./hello.shcondition
    is falseThis is what we expected. So the ‘else’ condition will execute if the
    condition is not true.If you want, you can evaluate multiple conditions, and based
    on those multiple conditions, the statement will take action. In that case, ‘elif’
    does it. This is another way with which we can use the else condition with the
    ‘if’ statement. In the script, after writing the ‘then’ statement on the next
    line, we write the ‘elif’ statement. In case the script does not execute the ‘then’
    condition, in that case, the script will look for code written in ‘elif.’ We elaborate
    on this in the example below of our running script.In the example, we have kept
    ‘unit’ variable with value ‘a’ and in ‘if’ expression we are checking if variable
    ‘unit’ is equal to ‘b.’if [[ $unit ==  b ]]In the ‘then’ statement, we are changing
    the statement of echo to ‘condition b is true.’'
