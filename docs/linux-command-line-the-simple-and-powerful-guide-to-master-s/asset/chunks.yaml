    `$ ./hello.sh`

    `Enter the name of the file : test`

    `“test found"`

    We have the expected output.


    Next, if we want to check if the directory exists, `-d` flag can do that. In our
    script, we are changing the flag from `-f` to `-d`. Also, we are changing the
