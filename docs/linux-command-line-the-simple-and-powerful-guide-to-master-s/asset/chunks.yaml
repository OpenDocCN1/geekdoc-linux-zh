    Modulus is an operation where, when we divide the two numbers, the number left
    as a remainder is the output. Let’s use the variables in our script with all arithmetic
    operations. The script will look like below:


    ```bash

    #! /bin/bash

    num1=20

    num2=5

    echo “addition of 20 + 5"

    echo $(( num1 + num2 ))

    echo “subtraction of 20 - 5"

    echo $(( num1 - num2 ))

    echo “multiplication of 20 * 5"

    echo $(( num1 * num2 ))

    echo “division  of 20 / 5"

    echo $(( num1 / num2 ))

    echo “modulus of 20 % 5"

    echo $(( num1 % num2 ))

    ```


    Let’s execute the script now.


    ```bash

    $ ./hello.sh

    addition of 20 + 5

    25

    subtraction of 20 - 5

    15

    multiplication of 20 * 5

    100

    Division of 20 / 5

    4

    modulus of 20 % 5

    0

    ```


    Now we can see all arithmetic operations have done well as expected results. This
    is the way to perform simple arithmetic operations. There is another way to do
    these expressions by using `expr.`. To use `expr` expression, the following changes
    will happen:


    - In place of double parentheses, it will use a single parenthesis.

    - In front of the variables, use the `$` symbol.

    - For multiplication in place of the asterisk symbol (`*`), we will use it with
    a symbol backslash followed by an asterisk symbol - `\*`.

