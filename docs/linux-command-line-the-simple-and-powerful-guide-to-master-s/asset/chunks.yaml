    变量，然后变量加 1。`var` --` 表达式的结果是变量的值，然后变量减 1。正如你在处理 `bc` 的 man 页面中看到的，还有许多像比较或逻辑操作这样的函数。


    ## 总结

    我们学习了两种执行算术运算的方法：


    1. 在双括号内对变量进行算术运算。

    2. 在单括号内使用 ‘`expr’ 对变量进行算术运算。除了乘法外，其他的都是相同的，`*` 作为乘法符号。

    3. 执行简单的算术运算，我们可以使用 `bc`。

    4. 平方根通过 `sqrt` 配合 `bc` 和选项 `-l.` 完成。

    5. 获取任何数字的幂，通过符号 `^` 完成。


    ## 第十章：case 语句

    `case` 语句是多级 `if, then, or else` 语句的良好替代方案，它可以帮助将多个值匹配到一个值。现在让我们来看看 `case` 语句的基本语法。


    ```bash

    #! /bin/bash

    case expression in

    pattern1 )

    statement ;;

    pattern2 )

    statement ;;

    ...

    esac

    ```


    第一行是启动 `case` 语句；我们以 `case,` 开始，然后是要评估的 `expression`；这可以是任何变量名或表达式。该行以关键字 `in.`
    结束。


    `case expression in`


    接下来的行将有多个模式。可能有多个需要评估的 case。模式可以是字符串、模式或正则表达式。模式行以右括号闭合，这意味着该 case 的结束。


    `pattern1 )`


    模式之后是 `statement.`。如果表达式为真，则将执行 `statement`。在行末尾将有两个双分号（`;;`），这意味着上面的 case 语句结束，并开始评估下一个
    case。这将一直持续，直到达到我们想要评估的 case 数量。


    `esac`


    `case` 语句以 `esac` 结尾，它是 `case` 的反过来。


    让我们通过一个例子来理解如何在实践中使用 `case` 语句。假设我们正在从事车辆租赁业务。我们将通过脚本运行一个参数，并将此参数保存在变量中。为了演示，我们将变量名设为
    `vehicle.`。输入参数的值将是变量的值。


    `Variable=$1`


    为了在 `case` 后的第一个表达式中评估变量 `vehicle`，该变量将带有 `$` 符号出现在这里。该变量将具有传递参数的值，可能是型号、品牌等。我们用
    `in.` 结束此行。语法如下：


    `case $vehicle in`


    现在是模式了；目前，我们只在这里比较模式。例如，如果变量 `vehicle` 在参数中的值为 `car`，我们将执行该语句。它将通过 `echo` 执行语句，内容为‘rent
    of the $vehicle is 100 dollars’，然后用两个分号符号（`;;`）结束该行。


    `"car" )

    echo "Rent of the $vehicle is 100 dollars" ;;`


    对于下一个模式，假设给出的参数为 `van.`。现在变量值变为 `van.`。对于此值，它将执行 `echo` 语句，消息为“Rent of the $vehicle
    is 80 dollars，”并再次以分号结尾。


    `"van" )

    echo "Rent of the $vehicle is 80 dollars" ;;`


    （注：原文后续存在大量重复的模式示例，已根据要求进行去重并保持逻辑性翻译）


    示例：

    ```bash

    #! /bin/bash

    vehicle=$1

    case $vehicle in

    "car" )

    echo "Rent of the $vehicle is 100 dollars" ;;

    "van" )

    echo "Rent of the $vehicle is 80 dollars" ;;

    "bicycle" )

    echo "Rent of the $vehicle is 5 dollars" ;;

    "truck" )

    echo "Rent of the $vehicle is 500 dollars" ;;

    * )

    echo "Unknown vehicle"

    esac

    ```

    '
