    "${!os[@]}"echo "${#os[@]}"string=abcdefghiecho "${string[@]}"echo "${string[0]}"echo
    "${string[1]}"echo "${#string[@]}"Let’s execute the script now:$ ./hello.shubuntu
    windows macwindows0 1 63abcdefghiabcdefghi1Here we can see in the output for the
    whole string that it counted one element in the array. And it number 1 element
    by default as the 0th element on the array.Summary:In this chapter, we learned:How
    to define an array and elements and print all the values or individual valuesHow
    to get the index numbers of the arrayHow to get a total number of elements in
    an arrayHow to print a new value of the defined element by overwriting the element
    value.How to remove an element from an arrayWe also count strings as a single
    element of an array.Chapter Twelve: WHILE LoopsIn this chapter, we will understand
    loops and how to use it. First, let’s understand what loops are. The loops are
    used to execute the list of commands repeatedly. The place where the repeated
    command to use, that is where we can use loops.Before we begin, let’s understand
    the syntax of the loop.The keyword for loop is ‘while’, which will start the loop
    command with a square bracket we can give the condition which needs to evaluate.While
    [ condition ]If the condition is true, it will move to the section ‘do’, which
    contains the list of commands to be executed. Once commands are done, and it completes
    the while loop. It ends with ‘done.’docommand1command2command3doneSo the complete
    syntax will be as belowwhile [ condition ]docommand1command2command3doneLet’s
    understand it more with an example.We want to print the numbers 1 to 10 using
    the ‘while’ loop. So first let’s declare a variable ‘n’ as value 1n=1Now let’s
    put a condition in ‘while’ statement to check if the value of ‘n’ is less than
    or equal to 10 or not. We will use the ‘–le’ flag. We have learned the ‘le’ flag
    in ‘if’ condition. It is to compare the number is ‘less than or equal to’ value.
    So the syntax will become as below:while [ $n –le 10 ]Next, between ‘do and ‘done’,
    we can execute any command. We will use ‘echo’ command to print the value ‘n’,
    but we are not done only with this, as this will only print the value of ‘n’,
    which is 1\. It will execute infinitely because one is always less than 10, which
    is a true condition, which will make a loop to keep repeating it. So we need a
    code to increment the value on variable ‘n’ by one it executes every time, and
    then we are good to go. That can be done by adding a line having command executing
    n+1, as shown below, in the example. This will keep on adding 1 to the value of
    variable every time it executes, and once its value becomes equal to or greater
    than 10, it will end the loop.doecho “$n”n=(( $n+1 ))doneSo the script will become
    as below:#! /bin/bash#  while loopsn=1while [ $n -le 10 ]doecho "$n"n=$(( n+1
    ))doneLet’s execute the script now$ ./hello.sh12345678910It prints value from
    1 to 10, now let’s understand what is happening in this loop. Initially, we assigned
    the value of ‘n’ as 1\. When it reach to ‘while’ loop, this loop evaluates if
    the value of n is less than or equal to 10\. First, the value of n was one as
    the defined value of the variable, which is less than or equal to 10\. This is
    a true condition, so it prints the value of $n as 1\. Next, with n+1, it increment
    the value of 1, now the value of n becomes 2\. Once again, it goes in loop to
    ‘while’ condition with the value of n as 2, which is still less than or equal
    to 10, so once again, echo “$n” code is executed, and it prints the number 2\.
    In this way, it will keep increment the number by one every time until it reached
    the value of n as 10\. Once it reached value 10, still the condition is valid
    as ten is now equal to 10\. Once the value of n becomes 11, and it reached to
    ‘while’ condition, now 11 is not less than or equal to 10; this makes the loop
    condition false, and commands written in ‘do’ will not be executed, and it will
    end the loop by done.The increment of the variable can be done in several ways. 
    In the above example, we have seen one format.n=$(( n+1 )), other way to use just
    (( n++ ))to increment the value of n, which means post-increment. If we use this
    way, the script will become as below:#! /bin/bash#  while loopsn=1while [ $n -le
    10 ]doecho "$n"(( n++ ))DoneIf we execute the script, the result will be the same
    as above. Another way is to use way pre-increment, that is done as (( ++n )),
    the script will look as below:#! /bin/bash#  while loopsn=1while [ $n -le 10 ]doecho
    "$n"(( ++n ))DoneIf you execute, the result will still be the same.Another way
    to use a while statement is to use double parentheses instead of using square
    brackets. In that case, ‘-le’ will be replaced by symbol ‘<=’ as we have used
    in ‘if’ statement. When we use this way, the script will look as below:#! /bin/bash#  while
    loopsn=1while (( $n <= 10 ))doecho "$n"(( ++n ))DoneWhen this script is executed,
    the result would be the same.  It will still print the value 1 to 10.Using Sleep
    with LoopTo proceed further, we will use the below script, and when we execute
    this, it prints the numbers 1 to 10.#! /bin/bash#  while loopsn=1while [ $n -le
    10 ]doecho "$n"(( n++ ))DoneWhen we execute the script, all values from 1 to 10
    are written as a flash on the screen. Let’s say we want some delay while printing
    the values; we can do this with ‘sleep’ command. After ‘sleep’ we can give any
    number. The number we give will make the loop to pause for that many seconds.
    For our example, we are using ‘sleep’ value as 1\. Means after every increment
    of the variable by 1, the loop will pause for 1 second and then proceed. The script
    will look as below now:#! /bin/bash#  while loopsn=1while [ $n -le 10 ]doecho
    "$n"(( n++ ))sleep 1doneThis time when we will execute the script, after every
    line, it will pause for a second. In this book, we will show the output that will
    be the same, but when you execute on the terminal, you can experience the pause
    of 1 second after every line until loops end.$ ./hello.sh1 ☐ pause 1 second2 ☐
    pause 1 second3 ☐ pause 1 second4 ☐ pause 1 second5 ☐ pause 1 second6 ☐ pause
    1 second7 ☐ pause 1 second8 ☐ pause 1 second9 ☐ pause 1 second10 ☐ pause 1 second$Now
    we saw there was a pause of 1 second after every line, and once the condition
    is met, it comes out of the loop, and you can see the prompt on the terminal.No
    incrementWhat will happen if there is no increment for the variable means we will
    remove the command to increment the variable by 1? If we do that, then the loop
    will keep running infinitely. Let’s do the change and see how the script looks:$
    vi hello.sh#! /bin/bash#  while loopsn=1while [ $n -le 10 ]doecho "$n"sleep 1doneHere
    we have removed line - (( n++ )), Now let’s execute the script. Since there will
    be no increment, so the loop will keep on running. To end the script, we can use
    ctrl+c to end the loop and get back the prompt on the terminal.$ ./hello.sh11111^C$So
    if you ever want a continuous loop, you give the condition, which is always true.
    Also, when you have a loop which is having a true condition with no sleep parameter,
    then it will execute infinitely. This can cause performance degradation of your
    computer Open Multiple Terminals with LoopUsing a loop, it can open multiple terminals.
    To do this function, you must be aware which kind of terminal can run on your
    system.Now let’s open three terminals using the loop. Then in ‘while’, we will
    set the value as 3, so the loop will keep opening terminals until this number
    is reached. We want to open the terminal using our script, so we need to define
    what kind of terminal we want to open. In Linux, mostly xterm and gnome are there.
    Depending on your operating system, you can select that terminal type.  For this
    example, let’s open the gnome terminal. We will add a line to open the terminal
    as below in the ‘do’ section is ‘gnome-terminal &.’ Now the script will be as
    below:#! /bin/bash#  while loopsn=1while [ $n -le 3 ]doecho "$n"(( n++ ))gnome-terminal
    &doneto open xterm terminal, the script will be as below:#! /bin/bash#  while
    loopsn=1while [ $n -le 3 ]doecho "$n"(( n++ ))xterm &doneWhen you execute the
    above scripts, the terminal mentioned in the scripts, three terminals will open.Read
    Files using WHILE LoopIn this section, we will learn how to read files using a
    loop. There are multiple ways of reading files using while loop; we will use some
    of them in this book.The first way of reading files using ‘while’ loop is using
    input redirection. Add ‘read’ command after ‘while’ and then write a variable
    in which we will save the content of the file line by line. For this example,
    we will keep the variable as ‘p’.while read pNext, in the ‘do’ section, we need
    to write commands. We will do echo to the variable with $p.doecho $pNext step,
    we need to read the file. We will use function file redirection to read the file
    using an angular bracket symbol (< or >). This is a common Linux functionality
    to redirect the input from or to a file. The direction towards which the angular
    bracket is pointing to will take the input from the file on the open side of the
    bracket.For the script, with ‘done’, we will use an angular bracket to get input
    format file we want to read. In this example, we will read our script file, hello.sh.done
    < hello.shWhen the script executes, the above line will read the file hello.sh,
    and this will go to variable ‘p’ as a value in ‘while’, then ‘echo’ will print
    the line that it will read from the variable. In this way, the content of hello.sh
    will go in while loop.The script will look as below:#! /bin/bash#  while loopswhile
    read pdoecho $pdone < hello.shLet’s execute the script now$ ./hello.sh#! /bin/bash#
    while loopswhile read pdoecho $pdone < hello.sh$You can see that the script has
    printed the content of the file.The other way to read the file in a single variable
    and then print it. If you know pipe ( | ) function in Linux, it will be easier
    to understand.We will make some changes in our script; we will add a ‘cat’ command
    before ‘while’ to read a file and then the filename to read that it is hello.sh.
    After that, on the same line, we will keep ‘while’ will ‘read p’. What will happen
    now, whatever the content is read by ‘cat’ command, will become the input for
    the while command. The output of the ‘cat’ will be the input to the ‘while’ loop,
    and then it will read it using the ‘read’ command and finally with ‘echo’ will
    print the content of the file.Now the script will be as below:#! /bin/bash#  while
    loopscat hello.sh | while read pdoecho $pdoneWe will execute the script now.$
    ./hello.sh#! /bin/bash# while loopscat hello.sh | while read pdoecho $pdone$You
    can see the content of the file is printed as before.While with IFSUntil now,
    we have learned two methods; the first way is using the input redirection, and
    we read the second way is the file content into one variable and then print it.
    Sometimes it is hard to read a file using these two methods because of special
    characters in the file, for example, line indentation. So what we can do is, in
    the second method, we will use the read command once again, but we will use the
    Internal Field Separator (IFS). The script uses IFS to determine how to work splitting
    that is how to recognize word boundaries. Let’s see how to do it with IFS.In our
    example, we will use ‘while’ keyword here and after ‘while’ use IFS followed by
    equal to sign (=) with space. It is important to know that we are not assigning
    the ‘read’ to IFS, we are assigning a space to IFS. This is important to keep
    a space between the ‘=’ sign and the ‘read’ command. With the ‘read’ command,
    we will use ‘-r’ flag here. The flag ‘-r’ prevents that backslash-escape from
    being interpreted. If we don’t use this, backslash can be interpreted in an unknown
    way and may cause wrong output.while IFS= read lineFor this example, we are using
    a variable name in ‘read’ command as ‘line,’ which is more meaningful, and we
    will use the input redirection method to provide the input file hello.sh with
    ‘done’.doecho $linedone < hello.shNow the script will be as below:#! /bin/bash#  while
    loopswhile IFS= read linedoecho $linedone < hello.shWe will execute the script
    now:$ ./hello.sh#! /bin/bash# while loopswhile IFS= read linedoecho $linedone
    < hello.sh$The output is the same as expected.There is another option to use IFS,
    that is before read command, in place of space given, we can also put a set of
    single quotes with space in between. As belowwhile IFS='' '' read lineEven if
    we use this and execute the script, the output will be the same.Using ‘while’
    with a File PathWe want to read a file which is not in the current working directory
    but in some other folder. Now let’s understand how can we do that.In our example,
    we will read file /etc/vconsole.conf using the ‘while’ loop. Before we proceed,
    let’s read the content of /etc/vconsole.conf file using the ‘cat’ command.$ cat
    vconsole.confKEYMAP=usFONT=eurlatgr.psfuFONT_MAP=FONT_UNIMAP=We do only one change
    in our script to define the path of the file as an input file to read. We will
    replace hello.sh with /etc/vconsole.conf as below:done < /etc/vconsole.confAfter
    this change, the script will look as below:#! /bin/bash#  while loopswhile IFS=
    read –r linedoecho $linedone < /etc/vconsole.confWe will execute the script now$
    ./hello.shKEYMAP=usFONT=eurlatgr.psfuFONT_MAP=FONT_UNIMAP=$The content is the
    same as the file we have read before.There are more methods to read the file using
    file descriptors. That we will learn in coming chapters.Summary:We learned the
    while loop, its function, and syntax.We also learned different ways to increment
    the value of a variable.We understood how to use sleep in a loop, how to open
    multiple terminals using a loop, multiple ways to read the file with a loop using
    the angular bracket, pipe symbol, and using IFS in two ways, with space and ''
    ''.By defining the path of file also the while loop can read the contents of the
    file.Chapter Thirteen: UNTIL LoopsNow we will learn about the ‘until’ loop. Until
    loop is similar to ‘while’ loop with a slight difference. The difference ‘while’
    and ‘until’ is, like in while the command defined between do and done executes
    if the condition is true, but in ‘until’ the commands will execute if the condition
    is false.Before we proceed, let’s understand the syntax of ‘until’ loop.With the
    keyword ‘until’ in square brackets or double parenthesis we write the condition until
    [ condition] or until (( condition ))If the condition is false, the commands written
    between ‘do’ and ‘done’ will be executed.The complete syntax will be as below:until
    [ condition]docommand1command2…..…..commanddoneThe listed commands will execute
    only if the condition is false, that is the difference between ‘while’ and ‘until’
    loop.Let’s understand this with an example.Once again, we want to print the value
    from 1 to 10 on the terminal; we will create a variable ‘n’ and assign value 1
    to it.n=1Next, we will update the ‘condition’ in ‘until’ statement. This time
    for variable $n, we will assign flag as ‘-ge’. We have learned before about ‘-ge’
    that is greater than and equal to in if’ and next to it there is number 10\. Now
    the condition becomes, if the value of n is not greater than or equal to 10, it
    will execute the commands under ‘do.’until [ $n -ge 10 ]In this case, we want
    to print the value of n by the ‘echo $n’ command. To increment the number, we
    can write notation n+1 in double parentheses.doecho $n(( n+1 ))doneThe complete
    script will become as below:$ vi hello.sh#! /bin/bash#  until loopsn=1until [
    $n -ge 10 ]doecho $nn=$(( n+1 ))doneLet’s execute the script now:$ ./hello.sh123456789It
    has a printed value of 1 to 9\. Why is it happening here? This has happened; the
    condition ‘$n –ge 10’ is false. When we started our script with n=1\. In the ‘until’
    condition, it checked if one is greater than or equal to 10, and it checks for
    the false condition. The ‘until’ loop works when the condition is false, which
    makes commands to execute under ‘do.’ Under ‘do’ there are two commands, first
    is to print the value of n and next is to increment the value of n by 1\. It keeps
    repeating in a loop until it reaches number 11\. Once it reaches 11, the condition
    becomes true, and the loop will not execute further.To print 10 in the output,
    then in a condition of ‘until’ we will replace –ge with –gt. Means now the condition
    will become true once n reaches to 10; this makes the condition true, and the
    loop will end.Like the ‘while’ loop, in the ‘until’ loop the square brackets in
    the ‘condition’ can be replaced by double parenthesis and the flag –gt will be
    replaced by angular bracket ‘>’.  Let’s make these changes and run the script.
    Since this time, we apply the condition only ‘greater than’ and removed ‘equal
    to’, so now it will print the number 10 also.#! /bin/bash#  until loopsn=1until
    (( $n > 10 ))doecho $nn=$(( n+1 ))doneLet’s execute the script$ ./hello.sh12345678910We
    can see the output ten is printed now.As we have seen in ‘while’ there are multiple
    ways to increment the variable. Let’s see the same here as well.We can replace
    n+1 to n++ or ++n; all these methods will do the increment by 1 to variable n
    at every step. Let’s try one of these, and we will see the result is the same.
    On more change we have done, we have used symbols for greater than or equal to
    (>=) in the ‘until’ condition.The script will be as below:#! /bin/bash#  until
    loopsn=1until (( $n >= 10 ))doecho $nn=$(( ++n ))doneWe will execute the script
    now:$ ./hello.sh123456789We can see the result is the same.Chapter Fourteen: FOR
    LoopsNow let’s learn how to use ‘for’ loops in shell scripting. The ‘for’ loops
    are also used to loop over the list of values and execute the commands in the
    loop.First, let’s understand the syntax of ‘for’ loopThere are multiple syntaxes
    of ‘for’ loop; we will show a few of them.Method 1f or VARIABLE in 1 2 3 4 5 ..
    Ndocommand1command2commandNdoneIn this method, first, we use the ‘for’ keyword
    and declare the key, ‘VARIABLE’ followed by a keyword ‘in’ and then we gave a
    list of values, for example, 1 2 3 4 5 ..N or it could be in the list format.
    The list format we will learn later in the chapter when we will see the examples.Method
    2for VARIABLE in file1 file2 file3docommand1command2commandNdoneYou can give the
    files as an input here. All the commands will be between ‘do’ and ‘done’ which
    will be executedMethod 3for OUTPUT in $(Linux command here)docommand1command2commandNdoneYou
    can give Linux command using the syntax as shown above. We can assign this command
    as a variable.Method 4for (( EXP1; EXP2; EXP3 ))docommand1command2commandNdoneThe
    ‘for’ loop can also be used similarly as in C programming. In this method, we
    can use a three number of expressions between double parentheses. We can use the
    first expression to initialize the value, second is to compare, or if it fulfills
    the condition, the third expression is where we can increment the value of the
    first expression.              Let’s now understand the ‘for’ loop in a better
    way. We will start by using method 1.Let’s say we want to read some numbers and
    then print them. In our example, we will use five numbers. Also, we will set the
    variable name as ‘v’.for v 1 2 3 4 5Between ‘do’ and ‘done’ keyword, we will write
    the commands to execute. In ‘do’, we will run command ‘echo’ to the numbers using
    the variable ‘v’.doecho $vdoneSo the complete script will be as below:#! /bin/bash#  for
    loopsfor v in 1 2 3 4 5doecho $vdoneLet’s execute the script now:$ ./hello.sh12345It
    has printed numbers 1 to 5; it is quite simple. Now consider a scenario we have
    hundreds of numbers to be printed, then we might not use this method. For that,
    we will change this syntax. In that case, we will give a range in curly brackets.
    A double dot symbol separates the range of numbers. The script will now be as
    shown below#! /bin/bash#  for loopsfor v in {1..10}doecho $vdoneLet’s execute
    the script.$ ./hello.sh12345678910$It prints all range numbers.There is one more
    way of using the range. In the previous example, 1 was the starting value, 10
    was the ending value, and we separated these two by putting two dots. If after
    10, we add two more dots and give a number, this number will be the increment
    number. The format will be as below:{START..END..INCREMENT}For example, after
    10 two more dots added, followed by number 2\. Means we want to increment the
    value by two like this: {1..10..2}. Now every time the loop executes, the variable
    value will keep increasing by 2.The script will look as below:#! /bin/bash#  for
    loopsfor v in {1..10..2}doecho $vdoneLet’s execute the script now.$ ./hello.sh13579$Here
    we can see, 1 starts the number, and every time it goes through a ‘for’ loop,
    the value gets incremented by 2.Some old scripts do not follow this format, so
    you need to check if your script version supports this format. Now here the question
    may come, how to check the version, this can be done by checking the first system
    variable for which shell you are working on, and then check the version of the
    shell. It is shown below:$ echo $SHELL/bin/bash$ echo $BASH_VERSION4.4.23(1)-releaseHere
    we can see the system is running bash shell (/bin/bash) ver  4.4.23(1)-release.
    For bash, it does not work on below version 3.MethodLet’s see another method for
    loop command by using three expressions between the double parentheses. In the
    first expression, we will use variable ‘v’ with value 0\. In the next expression,
    we will check if the variable value is less than five or not and, in third expression,
    we will increment the value of the variable by 1\. All three expressions are separated
    by a single semicolon (;).for v in (( v=1; v<5; v++ ))Between ‘do’ and ‘done’
    we will display the value of variable v, until the loop ends.The script will be
    as below now:#! /bin/bash#  for loopsfor (( v=0; v<5; v++ ))doecho $vdoneLet’s
    execute the script now.$ ./hello.sh01234Here we can see the value printed by script
    is from 0 to 5\. Since the condition is that it should print the value less than
    5, so after 4, the loop ends.Loop ‘for’ with Files and CommandsNow let’s see how
    to use ‘for’ loop with some command with some example for better understanding.In
    this way, we write command with ‘for’ expression, which will be the variable in
    this case. After command, we provide keyword ‘in’ followed by which we give some
    input in the form of some list or some commands. Then between do and done keyword,
    we give the command to execute the variable value. The basic syntax will be as
    below:for command indoecho $commanddoneWe can give a list of commands to execute.
    Let’s understand with an example. In the ‘for’ expression, we will give a list
    of commands, which are ls, pwd, and date. These commands will be executed one
    by one in order by which we write the commands. Between ‘do’ and ‘done’, we will
    write echo to mark a line with variable name, so this will give information about
    which command is getting executed now. Next to this line, we will show the output
    of the command by displaying the value of $command. The script will look as below:#!
    /bin/bash#  for loopsfor command in ls pwd datedoecho "---------- $command ----------"$commanddoneLet’s
    execute the script now.$ ./hello.sh---------- ls ----------backup  doc  examples  glass  hello.sh  hello.sh.org  myhome  scripts  test----------
    pwd ----------/home/user1---------- date ----------Fri Nov 15 16:31:39 IST 2019$In
    this way, we can give as many numbers of commands to be executed one by one, and
    it can print the output as explained in the above example.Let’s take one practical
    example.We are in our home directory right now, and we want to print all the directories
    in it. First, let’s list our home folder, and then see the list of files and directories$
    ls -ltotal 32drwxr-xr-x 2 user1 users     6 Nov 15 16:35 backup-rw-r--r-- 1 user1
    users   454 Nov 15 16:37 doc-rw-r--r-- 1 user1 users   501 Nov 15 16:38 examples-rw-r--r--
    1 user1 users     0 Nov 15 16:38 glass-rwxr-xr-x 1 user1 users   115 Nov 15 16:28
    hello.sh-rwxr-xr-x 1 user1 users   357 Nov 11 22:15 hello.sh.orgdrwxr-xr-x 2 user1
    users     6 Nov 15 16:34 myhomedrwxr-xr-x 2 user1 users     6 Nov 15 17:19 qrt
    function is the-rw-r--r-- 1 user1 users 13336 Nov 15 16:39 scriptsdrwxr-xr-x 2
    user1 users     6 Nov 15 16:34 test$First, in our script, we will define a variable
    ‘item’ for ‘for’ expression. To display the content of our home directory, in
    ‘for’ expression we will fill the commands with an asterisk sign *.for item in
    *Between ‘do’ and ‘done’, we will use ‘if’ statement. In the ‘if’ statement, we
    will evaluate the value of variable ‘’item’ weather that is a directory or not;
    if that is a directory, the script should print it. We can do this by adding a
    flag ‘-d’ and the variable ‘item’. As a format of ‘if’ expression, there is ‘then’
    and ‘else’ sections. When the statement is true, it goes to the ‘then’ section.
    In ‘then’ we will ‘echo’ the directory name.  Lastly,  the if statement will be
    close by ‘fi’.if [ -d $item ]thenecho $itemfiThe script will become as below:#!
    /bin/bash#  for loopsfor item in *doif [ -d $item ]thenecho $itemfidoneLet’s execute
    the script now.$ ./hello.shbackupmyhome./hello.sh: line 7: [: too many argumentstest$We
    can see it has displayed all directories names in the current directory. Apart
    from that, there is an error also:./hello.sh: line 7: [: too many argumentsWhy
    has it come? This error has come for a directory shown below:drwxr-xr-x 2 user1
    users     6 Nov 15 17:19 qrt function is theIn this directory, there are four
    keyword functions - qrt, function, is and the. Space separates these four keyword
    functions. Because of this, the script cannot understand if these are the separate
    names of a single name of a directory. Let’s delete this directory and then rerun
    the script. The error should not come.$ rm -rv "qrt function is the"removed directory
    ''qrt function is the''$ ./hello.shbackupmyhometest$It has worked perfectly by
    printing all the directories.To print all the files in the script, we will change
    the flag ‘-d’ to ‘-f’. Let’s do this change and print all the files.#! /bin/bash#  for
    loopsfor item in *doif [ -f $item ]thenecho $itemfidoneLet’s execute the script.$
    ./hello.shdocexamplesglasshello.shhello.sh.orgscripts$It has printed all the files
    now.Understood ‘for’ loop and the three syntax methods. Loop ‘for’ with files
    and commands.Chapter Fifteen: SELECT LoopsIn this chapter, we will learn about
    ‘select’ loops.First, let’s understand why we use loops. ‘Select’ allows us to
    construct easy menus. Whenever you write a script that requires menus, there we
    can use ‘select’ loop.Before we process, first, let’s understand the basic syntax
    of the loop.#! /bin/bashselect varName in listdocommand1command2.........commandNdoneThis
    loop starts by defining ‘select’ then the variable name. Next will be the keyword
    ‘in’ and in last, will have a list of items.  Then between ‘do’ and ‘done’ keywords,
    there will be a list of commands that will be executed based on the list you have
    provided. Let’s learn this in detail now.We will start the ‘select’ loop and keep
    variable labeling as ‘name’ followed by the keyword ‘in’. In the list, we will
    give some names.select name in mark john tom benBetween ‘do’ and ‘done’, we will
    write command to print the name with ‘echo’ and the variable name. After a variable
    name, we will add a keyword as ‘selected’.doecho "$name selected."doneThe script
    will look as below:#! /bin/bashselect name in mark john tom bendoecho "$name selected."doneLet’s
    execute the script.$ ./hello.sh1) mark2) john3) tom4) ben#?Here you can see the
    list of names that are listed in a line. It associates every name with a number.
    Now the script is waiting for us to input any of the numbers in the list from
    1 to 4\. For now, we are giving number 2, which is associated with ‘john’ and
    let’s see what happens$ ./hello.sh1) mark2) john3) tom4) ben#? 2john selected#?Here
    we can see that as we entered number 2, it displays the name ‘john’. This is the
    easy usage of the ‘select’ loop. The ‘select’ loop construct is like ‘for’ loop.
    What it does is reads the list first and displays the menu’s structure, and then
    we can select any item from the menu. Based on the selected menu, the command
    executes given in ‘do’ and ‘done’ keywords. Also, you can see it does not end
    the script; it is still prompting the number. To end the script, press ctrl=c.The
    ‘select’ loop is often used with the ‘case’ statement. We can use some cases with
    the ‘select’ loop; we will see how to use it.Between keyword do and done, we will
    start the basic structure of ‘case’. With the case, we write the variable ‘name’
    and keyword ‘in’.docase $name inNow we will create the case statement based on
    the four names we have given in the list. First, let’s create a case for the name
    ‘mark’ and assign an ‘echo’ command to display the message that ‘mark selected’.
    Similarly, we will create a case for all four names as below:mark)echo mark selected
    ;;john)echo john selected ;;tom)echo tom selected ;;ben)echo ben selected ;;In
    the last, we will create the default ‘case’ with the asterisk symbol (*) to display
    an error message and print some text. This will execute if it does not select
    the number between 1 to 4\. With this, close the ‘case’ statement by keyword ‘esac’.*)echo
    "Error, please provide the number between 1..4"esacdoneThe script will become
    like below:#! /bin/bashselect name in mark john tom bendocase $name inmark)echo
    mark selected ;;john)echo john selected ;;tom)echo tom selected ;;ben)echo ben
    selected ;;*)echo "Error, please provide the number between 1..4"esacdoneLet’s
    execute the script.$ ./hello.sh1) mark2) john3) tom4) ben#? 4ben selected#? 2john
    selected#? 3tom selected#? 1mark selected#? 7Error, please provide the number
    between 1..4#?Here you can see that the script will keep prompting the number,
    and the command is getting executed that is associated with the number we are
    proving as input. This way ‘select’ loop is often used with ‘case’. In the example
    we are using a simple ‘echo’ command, but you can provide any complex logic based
    upon the selected value from the select loop.This is the primary usage of ‘select’
    loop usage.Summary:We learned how to use the ‘select’ loop, its syntax. The simple
    format of using it. Also learned how to use it with ‘case’.Chapter Sixteen: Break
    and ContinueIn this chapter, we will learn how to use ‘break’ statement and ‘continue’
    statement.Break StatementA break statement is used to exit the current loop before
    its normal execution. Whenever we want to break out the loop prematurely, then
    we can use a break statement. Let’s understand this with an example.Below is the
    script of ‘for’ loop:#! /bin/bashfor (( v=1 ; v<=10 ; v++ ))doecho "$v"doneIn
    this script, it initializes the value of variable ‘v’ as 1, and then we are waiting
    for the condition of value ‘v’ is less than or equal to 10, and last, we are incrementing
    the value by 1\. This we have learned in detail in previous chapters. Between
    ‘do’ and ‘done’, we run the ‘echo’ command to print the value of ‘v’. Let’s run
    the script and see how it works.$ ./hello.sh12345678910$This a normal operation
    that we have learned. Now for some reasons, we want to come out of the loop prematurely;
    when the value of ‘v’ is greater than 5, then we want to come out of the loop.To
    do this, we will start ‘if’ condition under ‘do’ by defining that if its value
    is greater than 5, then we want to come out of the loop. Under ‘then’, we will
    use the command ‘break’ to end the loop.if [ $v -gt 5 ]thenbreakfiWhat it does
    is, whenever the value of ‘v’ goes greater than 5, then the condition is true
    in ‘if’ statement. Next, it comes to ‘then’ and it execute the program ‘break’,
    and it comes out of the loop. Now the complete script will be as below:#! /bin/bashfor
    (( v=1 ; v<=10 ; v++ ))doif [ $v -gt 5 ]thenbreakfiecho "$v"doneLet’s execute
    the script.$ ./hello.sh12345$Now, as expected, it has printed the values from
    1 to 5\. When the condition is true that ‘v’ is greater than 5, keyword ‘break’
    is called, and the program comes out of the loop.We have seen, though ‘for’ loop
    has a condition to print the numbers up to 10, but we have given a special keyword
    ‘break’. It makes when the ‘if’ statement is true, it ends the loop.This way,
    you can break the normal execution of the loop prematurely.  Now next, let’s see
    how to use the ‘continue’ statement.             Continue StatementThe ‘continue’
    is different from ‘break’. When we use ‘continue’, it skips the normal execution
    for that statement, so whatever comes after the ‘continue’ word will be skipped,
    and the program will go to the next statement.To explain this, we will change
    the previous script. Let’s change the value of ‘v’ from 5 to 3\. The condition
    greater than –gt will be changed to equal to –eq, and we will also add OR operation.
    The second condition after OR is where it checks the value of ‘v’ is equal to
    6 –eq. The ‘if’ condition will look as below:if [ $v -eq 3 OR $v -eq 6 ]If the
    condition is true, then the ‘continue’ statement will execute whenever there is
    the input of value 3 or 6\. The complete script will look as below:#! /bin/bashfor
    (( v=1 ; v<=10 ; v++ ))doif [ $v -eq 3 OR $v -eq 6 ]thencontinuefiecho "$v"doneLet’s
    execute the script now.$ ./hello.sh124578910$Here we can see it print the numbers
    from 1 to 10\. If you look closely, numbers 3 and 6 are missing. That means whenever
    the condition is met where v=3 or v=6, then the keyword ‘continue’ is called.
    So whenever your program sees this keyword in a loop, then whatever comes after
    this keyword will be skipped.In this script, ‘echo comes after ‘continue’ keyword.
    That means if it meet then the condition which makes ‘echo’ command to skip and
    the program will go to the next attrition. So when number 3 or 6 comes, that time
    condition is met which makes the ‘continue’ statement is called, and the ‘echo’
    command is skipped. This makes it will not print these two numbers.Summary:In
    this chapter, we learned about break statements, and continue statements, their
    syntax to use with examples.Chapter Seventeen: FunctionsA function is a subroutine
    or a code block that implements a set of operations. For a user, it is like a
    black box; it has some name on it, and it implements some functionality. Later,
    users can use this function once or multiple times. Like any other language, Linux
    scripting also supports function, though it has some limited implementations.There
    are two ways with which we can use function.Method 1Function name(){​ Commands}For
    this notation, we use the keyword ‘function’, and then we assign a name to the
    function followed by parenthesis with the start of the curly bracket. Next, we
    execute some commands.Method 2name () {​ Commands}In this method, first, we assign
    the name of the function followed by a parenthesis and a curly bracket. Next,
    there will be commands.We will see both notations and how to use it.We want to
    print ‘hello world’ using the ‘function’. For method 1, first, we will give a
    name to the function; in our case we are giving a name as ‘Hello’. We will write
    commands between curly brackets. For this example, we will run command ‘echo’
    to display ‘Hello’.function Hello(){echo "Hello"}Let’s create another function;
    whenever we call it, it will quit the script. Now let’s name this function as
    ‘quit’. This function will just be called command ‘exit’ which will exit the shell
    script.quit () {exit}Now we have two functions in the script as below:#! /bin/bashfunction
    Hello(){echo "Hello"}quit () {exit}Let’s execute the script having two functions:$
    ./hello.sh$Nothing came up. Though we have created the functions but haven’t used
    them.Let’s use these functions in the script now.First, we will use ‘hello’ function
    to print something. To use a function in the script, you can call it. To call
    the function, write the name of the function. First, we will call the function
    ‘Hello’ by writing ‘Hello’. Script will be as below:#! /bin/bashfunction Hello(){echo
    "Hello"}quit () {exit}Hello  Let’s execute the script$ ./hello.shHello$Now the
    script has printed ‘Hello’ as we have called only ‘Hello’ function. Now let’s
    call our second function, that is ‘quit’ function.We will call the function ‘quit’
    before ‘Hello’ and after Hello. Also, we are adding another command ‘echo’ to
    print some text. The script will be as below:#! /bin/bashfunction Hello(){echo
    "Hello"}quit () {exit}quitHelloecho "dummy text."Let’s execute the script now.$
    ./hello.sh$Nothing came up. This has happened because we called ‘quit’ function
    first, which has executed the exit command and ended the script. The function
    Hello and the echo command could not execute.Let’s change the sequence now. We
    will first call ‘Hello’ function then ‘quit’ and at last echo command as below:#!
    /bin/bashfunction Hello(){echo "Hello"}quit () {exit}Helloquitecho "dummy text."We
    will execute the script now$ ./hello.shHello$This time Hello is printed but echo
    command is not. This has happened because of the sequence we have given. Hello
    function worked fine, but before echo command, we have provided the ‘quit’ function,
    which has called ‘exit’ command, and it has terminated the script.Now let’s use
    the quit function after the echo command. The sequence will be first Hello function,
    then echo command and finally quit function. The script will become as below:#!
    /bin/bashfunction Hello(){echo "Hello"}quit () {exit}Helloecho "dummy text."quitLet’s
    execute the script now$ ./hello.shHellodummy text$This time first hello function
    has executed and made Hello message to display, then the echo command to print
    the text, finally the quit function to run exit command.This has been explained
    well that it can make the function declaration in any sequence, but calling of
    the function sequence matters for the behavior of the script.Next, let’s learn
    how we can pass an argument to a function.Let’s change the name of the function
    Hello to print. To prompt argument by the function, echo command can do this with
    a $1 function. The $1 means one argument if we have $2, $3, etc. that means the
    second and third argument. function print(){echo $1Now next is to understand how
    we can give an argument to the function print. That can be done by simply writing
    an argument after we call the function on the same line as below. For example,
    with function print, we want to call an argument ‘Hello’ as shown belowprint HelloSo
    when the function print is called in script, the word ‘Hello’ will go as an argument
    in echo command as the value of $1\. This will print the word ‘Hello’. Now the
    script will be as below:#! /bin/bashfunction print(){echo $1}quit () {exit}print
    Helloecho "dummy text."quitNow let’s execute the script$ ./hello.shHellodummy
    text$Now Hello is printing from the print function and ‘dummy text’ printed from
    ‘echo’ command. We can also call function multiple times, and they may be different
    arguments. Let’s call print function two times with different arguments:#! /bin/bashfunction
    print(){echo $1}quit () {exit}print Helloprint Worldprint Againecho "dummy text."quitLet’s
    execute the script now.$ ./hello.shHelloWorldAgaindummy text$This has come as
    expected.  This way we can call the function multiple times with multiple argumentsNow
    let’s add two more arguments for print functions as $2 and $3\. When the print
    function is called, we will write three arguments there. Now it should print all
    the three arguments. The script will be as below:#! /bin/bashfunction print(){echo
    $1 $2 $3}quit () {exit}print Hello World Againecho "dummy text."quitLet’s execute
    the script now.$ ./hello.shHello World Againdummy text$It prints all three words
    on the same line as it captures these by three variables $1, $2, and $3.Summary:We
    understood the functionality of the ‘function’, the syntax, and its use. We also
    learned that the sequence of function created does not matter; the sequence in
    which we call function in script matters. Got the introduction to the ways to
    add arguments to the function.Chapter Eighteen: Local VariablesUntil now, we understood
    the simple functions, now let’s learn functions in a bit more detail. By default,
    every variable which you define in a script is a global variable, which means
    that it can be accessed from anywhere from your script. First, let’s understand
    why we need a local variable and how to use it.See the below script we have saw
    in the previous chapter:#! /bin/bashfunction print(){echo $1}print Helloecho "dummy
    text."quitHere we have a function ‘print,’ which will have one argument for variable
    $1\. The function ‘print’ is called with an argument ‘Hello’, and then an echo
    command prints the text. When this script executes, the word ‘Hello’ will be assigned
    to a variable $1.Let’s say we want to use this function to print a name, so we
    will declare a variable name in this function, and the value of this variable
    will be out the first argument, which is $1\. Let’s modify the echo command with
    more text as below. In the argument, we are giving the name ‘Max’ here. The script
    will be as below now.#! /bin/bashfunction print(){name=$1echo "the name is $name"}print
    Maxecho "dummy text."Let’s execute the script now.$ ./hello.shthe name is Maxdummy
    textIt prints ‘the name is Max,’ which is correct. The name ‘Max’ was assigned
    to variable $1\. It assigns the first argument to variable ‘name’ and echo will
    print the value of the ‘name,We just read above that all variables are global
    in a shell script, so the variable name can be declared at any other line as well.
    In the script, before calling the function ‘print’ let’s write variable ‘name’
    again with value ‘Tom’, and in the next line, we can run echo command to type
    text to print the name.  Now the script will be as below:#! /bin/bashfunction
    print(){name=$1echo "the name is $name"}name="Tom"echo "The name is $name."print
    Maxecho "dummy text."Let’s execute the script and see what happens.$ ./hello.shThe
    name is Tomthe name is Maxdummy textNow first, it says ‘The name is Tom’ because
    first, we have assigned the variable name value as Tom. The function was created
    before, but until the time function is not called, it will not be executed, it
    will just sit ideal. So the shell script starts execution from the line where
    we set the variable ‘name’ and assigned the value as Tom. After that the ‘print’
    function will be called with argument as Max. Now the ‘print’ function will set
    this as the value of variable $1, and next to the echo command will print the
    value as Max. Next, the echo command will print the value of this variable set.What
    it tells us is that the variable name ‘name’ where we defined it as the ‘Tom’
    is a global variable name, as we can access it from anywhere in the script. Sometimes
    we want the variable we define in the function should remain as a local variable;
    it should not change outside the function. That is where the ‘local’ command comes
    in. Whenever you add ‘local’ command, the variable becomes local. We can use it
    only inside the function. To define a local variable in function, add ‘local’
    keyword before the variable name as shown below:function print(){local name=$1echo
    "the name is $name"We will show you how the ‘local’ keyword works in script in
    detail later in this chapter. For that first, let’s see how the script works before
    adding the ‘local’ keyword.Now we are working on the same script as shown before.
    Another echo command is being added after ‘print Max’. Now the echo command is
    there before and after the print function. We will mark ‘Before’ and ‘After’ as
    a comment in both the echo commands, as shown below.#! /bin/bashfunction print(){name=$1echo
    "the name is $name"}name="Tom"echo "The name is $ name: Before."print Maxecho
    "The name is $ name: After."Let’s execute the script and understand what the output
    means.$ ./hello.shThe name is Tom: Beforethe name is MaxThe name is Max: AfterNow
    let’s understand every line.'
