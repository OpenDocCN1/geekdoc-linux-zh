    # Chapter Six: File Test Operators

    In this chapter, we will learn how to use `if` statements in `File test operators.`
    Mostly when you are writing a shell script, you are dealing with the files. There
    would be situations when you want to check if the file exists or not, whether
    there is a regular file, block special file or character special file, and many
    other options you can check with File test operators. Let’ s learn how to use
    those conditions.


    We will understand step by step of the script now.

    - The First line is to define the shell used in our case; it is `bash`

    ```bash

    #! /bin/bash

    ```

    - Second line to write the statement with `echo`:

    `echo –e “Enter the name of the file : \c"`

    `\c` will make the script to prompt the next input on the same line. `-e` will
    make `echo` command to make aware that inside the statement of `echo` ` \c ` is
    not normal text, but this is a switch. So when `echo` command is executed, then
    ` \c ` should not be printed as a text.

    - The Third Line is having `read` command to read a variable `file_name`. This
    will be the variable name for the filename to check.

    `read file_name`

    - In the Fourth Line, we will use `if` expression; the expression will be in a
    square bracket as a rule. In brackets, a flag `-e` is used. `-e` flag will check
    if the file exists or not. After `-e`, we will write the variable `file_name.`

    ```bash

    if [ -e $file_name ]

    ```

    - The Fifth Line will define `then`.

    ```bash

    then

    ```

    - The Sixth Line will execute if the condition is true and echo the message that
    `file_name` is found.

    `echo “$file_name found"`

    - The Seventh Line will write the `else` condition:

    ```bash

    else

    ```

    - The Eighth Line will execute if the condition is not met and echo the message
    that `file_name` not found.

    `echo “$file_name not found.”`

    - The Ninth Line will end the script by `fi.`


    Now the script will look like below:

    ```bash

    #! /bin/bash

    echo –e “Enter the name of the file : \c”

    read file_name

    if [ -e $file_name ]

    then

    echo “$file_name found”

    else

    echo “$file_name not found.”

    fi

    ```

    Now let’ s execute the script. When we execute, the second line having `echo`
    command will prompt for the file name on the same line. In our example, we are
    giving a random file name `test` which does not exist in the present working directory.
    That means condition will not meet, and that will make `else` condition to execute.

    Below we have shown the script executed and gave the file name as `test` , after
    the message, we have checked the existence of the filename in the current directory,
    which is not there.

