    为了理解 ‘expr’，让我们对脚本进行更改。同时，更改变量 `num1`，现在脚本将如下所示：


    ```bash

    #! /bin/bash

    num1=21

    num2=5

    echo "addition of 21 + 5"

    echo $( expr $num1 + $num2 )

    echo "subtraction of 21 - 5"

    echo $( expr $num1 - $num2 )

    echo "multiplication of 21 * 5"

    echo $( expr $num1 \* $num2 )

    echo "division  of 21 / 5"

    echo $( expr $num1 / $num2 )

    echo "modulus of 21 % 5"

    echo $( expr $num1 % $num2 )

    ```


    让我们再次执行脚本。所有操作都应该正常工作，现在取模运算的变化将会显示出来。

    ```bash

    $ ./hello.sh

    addition of 21 + 5

    26

    subtraction of 21 - 5

    16

    multiplication of 21 * 5

    105

    Division of 21 / 5

    4

    modulus of 21 % 5

    1

    ```

    一切看起来良好。现在你可以看到取模运算的输出为 1，根据算术规则，这是 21 除以 5 的余数。记住在使用 `expr` 时，乘法要要使用 `\*`。


    ## 小数


    在本节中，我们将学习如何对小数进行算术运算。默认脚本不支持通过后两种方法进行小数算术运算。为了执行这些操作，有多种工具可用。我们将使用其中一个。在此之前，让我们了解为什么小数无法用我们目前学的方法进行运算。为了理解这个问题，让我们变量
    `num1` 的值从 21 更改为 20.5，并将两种方法都加入脚本。


    脚本将如下：


    ```bash

    #! /bin/bash

    num1=20.5

    num2=5

    echo "addition of 20 + 5"

    echo $(( num1 + num2 ))

    echo "subtraction of 20 - 5"

    echo $(( num1 - num2 ))

    echo "multiplication of 20 * 5"

    echo $(( num1 * num2 ))

    echo "division  of 20 / 5"

    echo $(( num1 / num2 ))

    echo "modulus of 20 % 5"

    echo $(( num1 % num2 ))

    echo " addition of 20.5 + 5"

    echo $( expr $num1 + $num2 )

    echo " subtraction of 20.5 - 5"

    echo $( expr $num1 - $num2 )

    echo " multiplication of 20.5 * 5"

    echo $( expr $num1 \* $num2 )

    echo " division  of 20.5 / 5"

    echo $( expr $num1 / $num2 )

    echo " modulus of 20.5 % 5"

    echo $( expr $num1 % $num2 )

    ```


    现在让我们执行脚本。输出将如下：

    ```bash

