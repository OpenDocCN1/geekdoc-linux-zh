    more, let’s see our old script again as below:#! /bin/bashecho "pid is $$."while
    (( COUNT < 10 ))dosleep 10(( COUNT ++ ))echo $COUNTdoneexit 0We will make some
    changes here now. We will add trap command with the text in echo. At the end of
