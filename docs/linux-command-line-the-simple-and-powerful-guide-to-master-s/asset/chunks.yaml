    by $0 and the filename by file_name.Section 4: In this section, we will check
    if the user has given any argument or not with the shell scripting.[[ $# -eq 0
    ]] && usage--------cond 1-----------      AND   --cond 2--This line also has an
    AND operator; the first condition is validating if the number of arguments provided
    is not zero.  The second condition will call the usage function that we created
    in section 3 above.If you remember, the $# will get the count number of arguments
    that are given with the script. Next, if the number is equal to (-eq) zero, in
    that case, we want to show a message to the user. For that, we will go the next
    section of AND operator, which is calling function ‘usage’.Section 5: Creating
    an ‘if’ statementif (is_file_exist "$1")thenecho "File found"elseecho "File not
    found"fiNow here in if we are writing an expression by setting variable name as
    ‘is_file_exist’ with value as $1\. IMPORTANT to note here that in ‘if’ statement
    we have given name as ‘is_file_exist’, this means we are calling the function
    that we have created in section 1\. Next is the $1, this is the argument that
    we have provided to the script.In short:$1 used in ‘if’ variable is the argument
    that we will give with the script$1 used in the function of a local variable of
    is_file_exist function as the first argumentSo both $1 mentioned in the script
    are different.Now combining all the sections and below will be the script.#! /bin/bashusage
    () {echo "You need to provide an argument : "echo "usage : $0 file_name"}is_file_exist()
    {local file="$1"[[ -f "$file" ]] && return 0 || return 1}[[ $# -eq 0 ]] && usageif
    (is_file_exist "$1")thenecho "File found"elseecho "File not found"fiBefore we
    execute the script, let’s list the files in the current directory:$ ls -ltotal
    32drwxr-xr-x 2 user1 users     6 Nov 15 17:20 backup-rw-r--r-- 1 user1 users  
    454 Nov 15 16:37 doc-rw-r--r-- 1 user1 users   501 Nov 15 16:38 examples-rw-r--r--
    1 user1 users     0 Nov 15 16:38 glass-rwxr-xr-x 1 user1 users   291 Nov 16 23:54
    hello.sh-rwxr-xr-x 1 user1 users   357 Nov 11 22:15 hello.sh.orgdrwxr-xr-x 2 user1
    users     6 Nov 15 16:34 myhome-rw-r--r-- 1 user1 users 13336 Nov 15 16:39 scriptsdrwxr-xr-x
    2 user1 users     6 Nov 15 16:34 testNow first, let’s execute the script. It is
    expected to provide an argument with the script, but first, we will execute the
    script with no argument.$ ./hello.shYou need to provide an argument :usage : ./hello.sh
    file_nameFile not foundThis has given a message to provide an argument and also
    the usage instructions to provide the file_name after the script name.Let’s execute
    the script again with a filename as an argument.$ ./hello.sh glassFile foundNow
    it gives a successful messageSo what we have learned mainly are two things from
    this example:


    1.  First, the $1 in function is_file_exist, and $1 in ‘if’ statement is different.
    The $1 with ‘if’ statement is the variable that is provided as an argument with
    the script to execute.  And $1 in function is the one which is provided to the
    function as a local variable.


    2.  Second, we learned how to use AND and OR operator without ‘if’ condition in
    section 2\. We could have used ‘if’ conditions, but it could have taken many more
    lines. If you are not comfortable with the way explained in section 2, you can
    use it with normal ‘if’ conditions.'
