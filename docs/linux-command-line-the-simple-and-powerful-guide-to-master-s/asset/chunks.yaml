    ))echo $COUNTdoneexit 0Again like earlier, we will execute the script in terminal
    1, and on terminal 2, we will issue the kill -15 PID command. As soon as the command
    is issued, on terminal 1 ‘file deleted’ message should be printed.Terminal 1:
    Executed the script and got the message as soon as the kill command was issued
    from terminal 2$ ./hello.shpid is 227581234file deletedfile deleted$Terminal 2:
    First created the file ‘test’ before the script was executed in terminal 1\. After
    the script started, the command kill -15 was issued and checked the file; it is
    deleted.$ lshello.sh$ touch test$ lshello.sh  test$ kill -15 22758$ lshello.sh$We
    can see the message ‘file deleted’ messaged was printed on terminal 1, where the
    script was getting executed.So you can use any command in the trap when the signal
    is received.Let’s see one scenario of the trap. The file is deleted; now, we will
    execute the script again on one terminal and on another terminal, we will run
    a command trap without any argument or a flag.Terminal 1: Executing the script$
    ./hello.shpid is 2297012345Terminal 2: Running the trap command$ traptrap -- ''''
    SIGTSTPtrap -- '''' SIGTTINtrap -- '''' SIGTTOUWe saw that in output, there is
    a list of traps. These traps are from our script. If any other trap script is
    also executing in the system that will also be listed here. In some cases, even
    the script is over still, it will list here. Let’s understand how to remove traps.
    To remove the traps below is the syntax.$ trap – trap value or nameLet’s remove
    the trap from the system by running the below command$ trap – 0 2 15This command
    will remove the three traps which we in the list. Once this is executed and you
    recheck the trap command, it will be blank.Summary:We learned the usage of Signal
    and Trap command with examples. We understood the two exceptions of tarp command
    – SIGKILL and SIGSTOP.We learned how to delete the files with trap command.How
    to clear the traps from the system.Chapter Twenty One: How to Debug ScriptIn this
    chapter, we will learn to debug the script. Sometimes when the things are not
    going as planned, we need to determine what is causing the script to fail. There
    are features built in the shell to debug. The most common is start a subshell
    with –x option.To understand this, we will use the script in the last chapter:1
    #! /bin/bash23 file=/home/user1/test4 trap "rm -f $file && echo file deleted;
    exit" 0 2 1556 echo "pid is $$"7 while (( COUNT < 10 )8 do9         sleep 1010         ((
    COUNT ++ ))11         echo $COUNT12 done13 exit 0We have checked in the previous
    chapter that this script will work well. Let’s say we missed to put double parenthesis
    in while loop1 #! /bin/bash23 file=/home/user1/test4 trap "rm -f $file && echo
    file deleted; exit" 0 2 1556 echo "pid is $$"7 while (( COUNT < 10 )8 do9         sleep
    1010         (( COUNT ++ ))11         echo $COUNT12 done13 exit 0Now when we execute
    the script we get error as below:$ ./hello.shpid is 23323./hello.sh: line 12:
    syntax error near unexpected token `done''./hello.sh: line 12: `done''file deleted$This
    is a straight forward message “syntax error near unexpected token `done''” on
    line 12\. Though the problem is in while loop, it has shown the error for line
    12 for ‘done’, but still, it is very close. But if you want to debug it more,
    then you can use the “-x”  option. Every script has its tools for debugging. For
    bash below syntax can be used:$ bash –x <script name>Let’s execute this command
    for our script.$ ./hello.shpid is 23323./hello.sh: line 12: syntax error near
    unexpected token `done''./hello.sh: line 12: `done''file deleted$ bash -x ./hello.sh+
    file=/home/user1/test+ trap ''rm -f /home/user1/test && echo file deleted; exit''
    0 2 15+ echo ''pid is 23349''pid is 23349./hello.sh: line 12: syntax error near
    unexpected token `done''./hello.sh: line 12: `done''+ rm -f /home/user1/test+
    echo file deletedfile deleted+ exit$Now we can see it more verbose and getting
    more detail for each line. It is showing the execution of each line in detail
    and will help to debug around which line the error is coming.If you do not want
    to use it from command line, then other option is to use –x option in the script
    only on the first line where the script is define. This is shown below:1 #! /bin/bash
    -x23 file=/home/user1/test4 trap "rm -f $file && echo file deleted; exit" 0 2
    1556 echo "pid is $$"7 while (( COUNT < 10 )8 do9         sleep 1010         ((
    COUNT ++ ))11         echo $COUNT12 done13 exit 0Now when you execute the script,
    you will get a similar output as shown before.In case you want to use debug for
    certain lines but not the whole script that you can use the ‘set’ option. You
    can use ‘set -x’ at the point you want to activate the debugging and the ‘set
    +x’ at the point where you want to deactivate it. Below is the script where we
    are debugging the script only for  line 3 and 4.1 #! /bin/bash2 set -x3 file=/home/user1/test4
    trap "rm -f $file && echo file deleted; exit" 0 2 155 set +x6 echo "pid is $$"7
    while (( COUNT < 10 )8 do9         sleep 1010         (( COUNT ++ ))11         echo
    $COUNT12 done13 exit 0Let’s execute the script and see what happens:Summary:Three
    ways to debug by using bash –x, then by adding –x option in the first line of
    the script and finally set option by using two switched –x and +xConclusionThe
    next step is to implement the learning. The complete manual is set up with practical
    commands and is a swift reference guide for administrators. Try all the exercises
    from this book and do practice. To understand the script in depth using more complex
    logic, you can refer to the expert edition of Linux Shell scripting.Referencesauthor,
    l. (2019).  echo man page . [online] Linuxcommand.org. Available at: http://linuxcommand.org/lc3_man_pages/echoh.html
    [Accessed 17 Nov. 2019].Linux.die.net. (2019).  bc(1): arbitrary precision calculator
