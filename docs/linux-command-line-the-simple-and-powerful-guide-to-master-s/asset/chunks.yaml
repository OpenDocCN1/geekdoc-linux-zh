    `if [[ expression 1 && expression 2 ]]` Let’s understand AND operation this with
    an example.


    Suppose we have a student, and we need to test his age. We need to test in such
    a way that his age should be greater than 18 years and less than 30 years. How
    do we do it? Let’s create the script.


    By default the first line is to mention the shell. Then we are assigning a variable
    `age` with value `18`. Now we will write the `if` expression with a condition.


    ```bash

    #! /bin/bash

    age=25

    ```


    Since we have to check two conditions, condition 1, the age has to be greater
    than 18 years and condition 2, that the age should be less than 30 years. Expressions
    will be written in separate square brackets with `if` statements. The first bracket
    will have the condition to check the variable `$age`, if its value is greater
    than (`-gt`) number `18`. In the second condition, we check that the variable
    `$age` is less than (`-lt`) number `30`. The symbol `&&` will separate these brackets.


    ```bash

    if [ $age -gt 18 ] && [ $age -lt 30 ]

    ```


    Next, we will mention in `then` and `else` if the condition is a success or not.
    If the condition is true, in that case, `then` script will execute `echo` code
    “valid age.”


    ```bash

    then

    echo "Valid age."

    ```


    If the condition is not true, in that case, the `else` script will execute `echo`
    code “age not valid.”


    ```bash

    else

    echo "Age not valid"

    ```


    In the last line, we will end the `if` script with `fi`. The script will look
    like this:


    ```bash

    #! /bin/bash

    age=25

    if [ $age -gt 18 ] && [ $age -lt 30 ]

    then

    echo "Valid age."

    else

    echo "Age not valid"

    fi

    ```


    Let’s execute the script:

    `$ ./hello.sh`

    Valid age


    Since `25` falls between `18` and `30`, and both expressions met the condition,
    the script executes the code mention in `then` statement and displays ‘Valid age’.
    Now let’s change the number from `25` to `50` in the script, which is out of conditions
    range set.


    ```bash

    #! /bin/bash

    age=50

    if [ $age -gt 18 ] && [ $age -lt 30 ]

    then

    echo "Valid age."

    else

    echo "Age not valid"

    fi

    ```


    Execute the script again:

    `$ ./hello.sh`

    Age not valid


    Now what happened in the 2nd case is that the first condition was true; `age`
    is greater than `18`, but it is not meeting the second condition that the age
    has to be less than `30`; that’s why code written in `else` executes.


    If you want to change the format of `AND` condition by using the single square
    bracket, that will also give the same result. Then the script will look as below:


    ```bash

    #! /bin/bash

    age=50

    if [ $age -gt 18 -a $age -lt 30 ]

    then

    echo "Valid age."

    else

    echo "Age not valid"

    fi

    ```


    If you execute the script, the result will be the same. The third way to write
    the same script with double square brackets and the AND operations will be defined
    by `&&`. So we will replace `-a` with `&&`. The script will look as below.


    ```bash

    #! /bin/bash

    age=50

    if [[ $age -gt 18 && $age -lt 30 ]]

    then

    echo "Valid age."

    else

    echo "Age not valid"

    fi

    ```


    ### Operators


    In this section, we will learn about `OR` operators. In `if` statement, `OR` operator
    is used when any of the conditions are true. Let’s see how to use `OR` with different
    brackets:


    1.  `||` in separate brackets.

    2.  `-o` in single brackets.

    3.  `||` in double square brackets.


    Example:

    ```bash

    if [ $age -gt 18 ] || [ $age -lt 30 ]

    ```


    Example:

    ```bash

    if [ $age -gt 18 -o $age -lt 30 ]

    ```


    Example:

    ```bash

    if [[ $age -gt 18 || $age -lt 30 ]]

    ```


    ### Summary


    In this chapter, you learned how to use `AND` and `OR` operator with the `if`
    statement.


    **Three ways to use AND operator:**

    - `&` in separate square brackets.

    - `-a` in the same square brackets.

    - `&&` in double square brackets.


    **Three ways to use OR operator:**

    - `||` in separate square brackets.

    - `-o` in the same square brackets.

    - `||` in double square brackets.


    ### Chapter Nine: Perform Arithmetic Operations


    These are the operators used for any arithmetic or mathematic operations. To understand
    it with a practical example, let’s create two variable `num1` with value `20`
    and the second variable as `num2` with value `5`. Now we want to do simple arithmetic
    operations like addition, subtraction, multiplication, division, and modulus.


    To do addition, in front of the `echo` command, we write the two variables in
    double parentheses. There will be a space on both sides, and the `+` symbol separates
    both variables. The `$` symbol has to be on the starting of the double parenthesis
    bracket.


    ```bash

    #! /bin/bash

    num1=20

    num2=5

    echo $(( num1 + num2 ))

    ```


    Now let’s execute the script, the output should have the sum of two variables:

    `$ ./hello.sh`

    25


    We got the output as `25`, which results from the addition of `20 + 5`. Means
    arithmetic operation has been performed on these two variables. Similarly, you
    can do the other arithmetic operations in the same format. Below are the symbols
    used for the above mentioned operation:


    | Symbol | Operation |

    | :--- | :--- |

    | `+` | Addition |

    | `-` | Subtraction |

    | `*` | Multiplication |

    | `/` | Division |

    | `%` | Modulus |

