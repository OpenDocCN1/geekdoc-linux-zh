    现在我们可以看到所有的算术运算都已按预期结果完成。这是执行简单算术运算的方法。另一种执行这些表达式的方法是使用 `expr.`。要使用 `expr` 表达式，将发生以下变化：


    -   将双括号替换为单括号。

    -   在变量前使用 `$` 符号。

    -   乘法，不使用星号符号 (`*`)，而是使用反斜杠加星号符号 - `\*`。

