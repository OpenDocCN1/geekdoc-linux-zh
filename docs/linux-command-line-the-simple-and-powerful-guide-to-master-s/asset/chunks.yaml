    - In ‘if’ statement putting flag `-f` to check for existence.

    ```bash

    if [ -f $file_name ]

    ```


    - If the file exists, then we will check for write permission on this file. For
    that in ‘then’, we will add one more ‘if’ statement.


    - In the new ‘if’ statement, add flag `-w` to check if the file has write permission.
    Next to `-w`, there will be the `file_name` variable.

    ```bash

    thenif [ -w $file_name ]

    ```


    - If write permission is there, the script will move to ‘then,’ under ‘then’ execute
    two commands. The command `echo` to type some text and the `cat` command, which
    will write the text in the file. In the `cat` command, we are using the double
    angle brackets (`>>`) to append the file. If we use a single angle bracket (`>`),
    then it will overwrite the data. Next to angle brackets, there will be variable
    `file_name`, the file to be appended.


    ```bash

    thenecho "Type some text data. To quit press ctrl+d"cat >> $file_name

    ```


    - Next, we will maintain the ‘else’ section with `echo` command to type that file
    does not have write permissions.

    ```bash

    elseecho "This File does not have write permission."

    ```


    - Now the ‘then’ and ‘else’ conditions are written, we will close the nested ‘if’
    section by `fi.`


    - The next line will define the ‘else’ section with `echo` command saying ‘$file_name
    does not exist’

    ```bash

    elseecho "$file_name does not exist"

    ```


    - Last, the script will be closed by `fi.`


    Script will like below:

    ```bash

    #! /bin/bash

    echo -e "Enter the name of the file : \c"

    read file_name

    if [ -f $file_name ]

    then

    if [ -w $file_name ]

    then

    echo "Type some text data. To quit press ctrl+d"

    cat >> $file_name

    else

    echo "This file does not have write permission."

    fi

    else

    echo "$file_name not exists"

    fi

    ```


    Now execute the script. The file name we will give now to append is ‘abc,’ which
    does not exist.

    ```bash

    $ ./hello.sh

    Enter the name of the file : abc

    abc doesn’t exist

    $ lsdir hello .sh

    ```

    Since the file does not exist, we will create the file by `touch` command. By
    default, new file created with owner write permissions. To test our script, we
    will remove the write permission using command `chmod` command with the flag `-w`.
    `-w` will remove the write permission from the file.

    ```bash

    $ touch abc

    $ ls –al abc

    -rw-r--r-- 1 user1 users      0 Nov  7 18:56 abc

    $ chmod -w abc

    $ ls –al abc-r--r--r-- 1 user1 users      0 Nov  7 18:56 abc

    ```


    Now we can see that write permission is removed from the file. Once again, we
    will run our script.

    ```bash

    $ ./hello.sh

    Enter the name of the file : abc

    This file does not have write permission

    ```

    The script has worked well and gave “This file does not have write permission”
    as we have removed it. Now giving back the write permission with `chmod +w` command.

    ```bash

    $ chmod +w abc

    $ ls -al abc

    -rw-r--r-- 1 user1 users 0 Nov  7 18:56 abc

    ```

    The write permission to file ‘abc’ is is back. Now let’s execute the script again,
    this time we should be able to write to the file, as all conditions meet now,
    the file exists and is a regular text file which is checked by `-f` flag and last
    file have write permissions.

    ```bash

    $ ./hello.sh

    Enter the name of the file : abc

    Type some text data. To quit press ctrl+d

    Let’s write some data - Hello World! ☐ After this we pressed ctrl+d

    ```

    After pressing `ctrl+d`, we will come back to the prompt. Now let’s check if we
    have got the text written is there in the file ‘abc.’ We will check the content
    of the ‘abc’ file with the `cat` command.

    ```bash

    $ ls -la abc

    -rw-r--r-- 1 user1 users 38 Nov  7 19:10 abc ☐ File has got some data

    $ cat abc

    Let’s write some data - Hello World!

    ```

    We have checked that the data written is there now. Next, let’s check to append
    the file. For that, we will rerun the script and add more text. The added text
    should not overwrite the data but add the line after the previous line added.

    ```bash

    $ ./hello.sh

    Enter the name of the file : abc

    Type some text data. To quit press ctrl+d

    Shell Scripting course

    $ cat abc

    Let’s write some data - Hello World!

    Shell Scripting course

    ```

    This looks perfect. The text has been appended in the file and not overwritten.


    **Summary:** We have learned how to use nested ‘if’ conditions and different scenarios
    on how to append the file with a script.


    # Chapter Eight: Logical ‘ AN D ’ and ‘ O R ’ Operator


    In this chapter, we will see how to use `AND` and `OR` operator with the `if`
    statement.


    ## AND Operators

    Let’s say there is a requirement to write two or more expressions with the `if`
    statement; in that case, we use the `AND` operator. When we use the `AND` operator,
    then the script will validate all expressions to give a successful message that
    is defined in `then.` If any condition is not validated, the script will execute
    code defined in `else`. Until now we have learned how to write the condition with
    the `if` statement. Now to write the second condition, we will use the `AND` operator.


    There are three ways with which an `AND` operator can be used:


    1. Two expressions are written in square brackets, and these brackets are separated
    by double `&` symbols, as shown below.

    ```bash

    if [ expression 1 ] && [expression 2 ]

    ```


    2. Two expressions are written in square brackets. The two `&` symbols shown above
    will be replaced by `-a` flag. `-a` stands for AND. If you want to use a square
    bracket, you can use `-a`. This is shown below:

    ```bash

    if [expression 1 –a expression 2 ]

    ```


    3. You can use double square brackets to start and close the `if` statement, and
    expressions are separated with double `&&` symbol to define AND conditions. It
    is shown below:

