  trans: "\n\n### 第一行输出：“The name is Tom: Before”：\n\n此输出是通过脚本中以下两行代码设置第一个变量后产生的：\n\
    ```bash\nname=\"Tom\"\necho \"The name is $ name: Before.\"\n```\n这在调用 `print`\
    \ 函数之前就已经打印了，这是正确的。\n\n### 第二行输出：“the name is Max.”\n\n这一行是在带入参数 `Max` 调用 `print`\
    \ 函数时打印的。当 `print` 函数被调用时，在那个函数内部，变量 `name` 的值被设置为了 `Max`。\n\n### 第三行输出：“The name\
    \ is Max : After.”：\n\n在上一步中，变量 `name` 被赋值了值 `Max`。当使用 `echo` 命令打印变量 `name` 的文本时，它只读取到\
    \ `Max`。现在，在对变量值进行任何更改之前，它会一直保持 `Max` 这个值。这有点让人困惑，因为我们最初在函数外部将变量 `name` 设置为 `Tom`。我们期望函数内部定义的变量不应该改变函数外部（全局变量）的值。这意味着在第二个\
    \ `echo` 命令中，我们期望输出仅为 `Tom`。这种保持全局变量值不变且不被函数内定义的任何变量所改变的要求，正是 `local` 关键字用用场。\n\
    \n让我们对 `print` 函数进行更改，在变量定义之前定义 `local` 关键字。现在脚本看起来如下：\n\n```bash\n#! /bin/bash\n\
    function print(){\n    local name=$1\n    echo \"the name is $name\"\n}\nname=\"\
    Tom\"\necho \"The name is $name : Before.\"\nprint Max\necho \"The name is $name\
    \ : After.\"\n```\n\n现在让我们执行脚本：\n```\n ./hello.sh\nThe name is Tom : Before\n\
    the name is Max\nThe name is Tom : After\n```\n你可以看到，当在变量前面加上 `local` 关键字时，该变量就变成了局部变量，它无法访问函数外部的变量。这仅用于局部执行，不会影响全局变量。\n\
    \n现在让我们来理解每一行输出是如何产生的：\n\n*   **第一行输出：The name is Tom : Before**\n    这是来自第一个\
    \ `echo` 命令的输出。在执行此 echo 命令之前，全局变量 `name` 的值被设置为 `Tom`。\n\n*   **第二行输出：the name\
    \ is Max**\n    在此阶段，带参数 `Max` 调用了函数 `print`。在函数内部，变量 `name` 的值被设置为提供的参数，并将其打印为\
    \ `Max`。这次的变量来自函数 `print`，并设置了 `local` 关键字。\n\n*   **第三行输出：The name is Tom : After**\n\
    \n"
- fmt: '

    This time again, `echo` command has been executed to print the variable `name`.
    Now the script is picking the value of variable, which is set as a global variable
    that is ‘Tom’. The `echo` command will not pick the local variable which was set
    in the `print` function. In short, the local variables will be defined in a function
    and will be used only in the places where the function is called. All the places
    when the variable is called, i uses the value that is set as a global variable.
    This is how the local and global variables can be differentiated and can be used
    in practice in the script.


    Now let’s understand an example to consolidate the learnings of function. With
    this example, you will get clear on more concept. In the example, we will create
    small sections and explain each section; in the end, we will combine all the sections
    to make a complete meaningful script. So you might need to reread this section
    to have more clarity.


    ### To Check if the File Exists or Not using our Script

    Whenever the user runs the script, it has to be the file name as an argument for
    which the script is being run. The script will check if the file exists or not,
    and it will print. We have seen this in previous chapters also which can do this
    task, but now we will use the function and learn more concepts.


    #### Section 1: Create a function name ‘is_file_exist’

    ```bash

    is_file_exist() {

    local file="$1"

    }

    ```

    We will create a function with name `is_file_exist` in the format it has to be
    used. We have to pass the name of the file when we call this function as an argument;
    it will be defined as a local variable. The variable name will be `file`, and
    its value will be an argument `$1`. This we have learned in the previous section.


    #### Section 2: --- 1st cond. of AND --- AND ------2nd cond. of AND -------

    ```bash

    [[ -f "file" ]] && return 0 || return 1

    ```

    --- 1st cond. --- OR --- 2nd cond---

    In this section, we will use `AND` operator, `OR` operator, and `-f` flag to verify
    if the file exists or not. This will be a part of the function that we are writing.
    We want to check if the file exists for that we will use `AND` operator format.
    A double square bracket having `-f` flag checks whether the mentioned filename
    is a file or directory. Next to `-f`, we will write the file variable that we
    defined as a local variable `$file`. This will become a 1st condition of `AND`
    operator. It will show if the file exists or not. Until now, we have completed
    the 1st part of `AND` condition. Now let see the 2nd condition.


    Note we have not given `if` condition, now we will use return value. If you know
    any programing language, you might be familiar with ternary operations. We are
    checking whether the operation is true; depending on the result, if it is true,
    it will return some value, and if it is false, then it will return some other
    value. We will use double `AND` operator (`&&`) and keyword `return 0` and `return
    1`. Between `return 0` and `return 1` there will be `OR` operator (`||`).


    So what is happening here is, if the file exists, then the 1st condition is true;
    that means the output is 1. When the output is 1, it will go to check the next
    condition – `return 0 || return 1`. Since the file exists, that means the result
    is 1, so it will go to return 1. If the argument is not given or that file is
    not there, that means the result is 0. In that case, when it will check the 2nd
    condition on `AND`, it will go to `return 0`.


    #### Section 3: Create a function with name ‘usage’

    ```bash

    usage () {

    echo "You need to provide an argument : "

    echo "usage : $0 file_name"

    }

    ```

    We will provide the name of the function `usage`; then, two `echo` commands to
    print two messages. First message is to print the message “you need to provide
    an argument”. In a second echo message, we will give the name of the script that
    will be done by `$0` and the filename by `file_name`.


    #### Section 4: Check if the user has given any argument

    ```bash

    [[ $# -eq 0 ]] && usage

    ```

    cond 1 ----------- AND --cond 2--

    This line also has an `AND` operator; the first condition is validating if the
    number of arguments provided is not zero. The second condition will call the `usage`
    function that we created in section 3 above. If you remember, the `$#` will get
    the count number of arguments that are given with the script. Next, if the number
    is equal to (`-eq`) zero, in that case, we want to show a message to the user.
    For that, we will go the next section of `AND` operator, which is calling function
    `usage`.


    #### Section 5: Creating an ‘if’ statement

    ```bash

    if (is_file_exist "$1")

    then

    echo "File found"

    else

    echo "File not found"

    fi

    ```

    Now here in `if` we are writing an expression by setting variable name as `is_file_exist`
    with value as `$1`. IMPORTANT to note here that in `if` statement we have given
    name as `is_file_exist`, this means we are calling the function that we have created
    in section 1. Next is the `$1`, this is the argument that we have provided to
    the script.


    In short:

    - `$1` used in `if` variable is the argument that we will give with the script

    - `$1` used in the function of a local variable of `is_file_exist` function as
    the first argument

    So both `$1` mentioned in the script are different.


    ### Complete Script

    Now combining all the sections and below will be the script.

    ```bash

    #! /bin/bash

    usage () {

    echo "You need to provide an argument : "

    echo "usage : $0 file_name"

    }

    is_file_exist() {

    local file="$1"

    [[ -f "$file" ]] && return 0 || return 1

    }

    [[ $# -eq 0 ]] && usage

    if (is_file_exist "$1")

    then

    echo "File found"

    else

    echo "File not found"

    fi

    ```


    Before we execute the script, let’s list the files in the current directory:

    ```bash

    $ ls -lt

    total 32

    drwxr-xr-x 2 user1 users      6 Nov 15 17:20 backup

    rw-r--r-- 1 user1 users   454 Nov 15 16:37 doc

    rw-r--r-- 1 user1 users   501 Nov 15 16:38 examples

    rw-r--r-- 1 user1 users     0 Nov 15 16:38 glass

    rwxr-xr-x 1 user1 users   291 Nov 16 23:54 hello.sh

    -rwxr-xr-x 1 user1 users   357 Nov 11 22:15 hello.sh.org

    drwxr-xr-x 2 user1 users      6 Nov 15 16:34 myhome

    rw-r--r-- 1 user1 users 13336 Nov 15 16:39 scripts

    drwxr-xr-x 2 user1 users      6 Nov 15 16:34 test

    ```

    Now first, let’s execute the script. It is expected to provide an argument with
    the script, but first, we will execute the script with no argument.

    ```bash

    $ ./hello.sh

    You need to provide an argument :

    usage : ./hello.sh file_name

    File not found

    ```

    This has given a message to provide an argument and also the usage instructions
    to provide the file_name after the script name.


    Let’s execute the script again with a filename as an argument.

    ```bash

    $ ./hello.sh glass

    File found

    ```

    Now it gives a successful messageSo what we have learned mainly are two things
    from this example:


    1.  First, the `$1` in function `is_file_exist`, and `$1` in `if` statement are
    different. The `$1` with `if` statement is the variable that is provided as an
    argument with the script to execute. And `$1` in function is the one which is
    provided to the function as a local variable.

    2.  Second, we learned how to use `AND` and `OR` operator without `if` condition
    in section 2. We could have used `if` conditions, but it could have taken many
    more lines. If you are not comfortable with the way explained in section 2, you
    can use it with normal `if` conditions.

    '
