    \ case. In case you also got the same error, then here a small hack to be done.\
    \ The hack is you need to set system environmental `LANG` as `C`. The `LANG` environmental\
    \ variable shows the language/locale and encoding, where `C` is the language setting.\
    \ Run the below command on the prompt.\n    ```bash\n    $ LANG=C\n    ```\n \
    \   Now you have set the environment to the language `C`. This has to be done\
    \ in case it does not meet the condition of uppercase. Let’s try the script again\
    \ with the same input as ‘G.`:\n    ```bash\n    $ ./hello.sh\n    Enter some\
    \ character : G\n    User entered G; it is A to Z\n    ```\n    It worked well\
    \ now.\n\n*   Giving input as ‘6.’:\n    ```\n    $ ./hello.sh\n    Enter some\
    \ character : 6\n    User entered 6; it is 0 to 9\n    ```\n\n*   Giving input\
    \ as ‘%’:\n    ```\n    $ ./hello.sh\n    Enter some character : %\n    User entered\
    \ % special character\n    ```\n\n*   Giving input as ‘#sW4’\n"
