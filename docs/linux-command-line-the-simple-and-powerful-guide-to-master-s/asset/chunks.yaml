    ```\n\n## Chapter Two: Using Variables and Comments\nIn the last chapter, we looked\
    \ at creating and executing a new script. In this chapter, we will learn about\
    \ comments and variables.\n\n### Comments\nComments are the lines of the code\
    \ that are not executed by the script but are helpful to know some information.\
    \ Any line in script started with a `#` becomes comment and would not be executed\
    \ by the script.\nExample\n```bash\n#!/bin/bash\n# This is a comment\necho \"\
    Hello World\"\n```\nAnother way you can write a comment after the code is to put\
    \ `#` after the command.\nExample:\n```bash\n#!/bin/bash\necho \"Hello World\"\
    \ # This is also a comment\n```\nThese are two ways we can use comments. Remember,\
    \ comments are not executed as part of the script.\n\n### Variables\nVariables\
    \ are the containers that store data inside them. Whenever you define a variable,\
    \ it stores some data. The variable could be a string, number, etc. There are\
    \ two types of variables:\n\n#### System Variables\nIn the Unix or Linux operating\
    \ system creates system variables. There are pre-defined variables. As a standard\
    \ convention, system variables are defined in upper case.\nFor example, in our\
    \ hello.sh script, we can add a system variable, `echo $BASH`, to check the path\
    \ of the shell for the user logged in.\n```bash\n#!/bin/bash\necho \"Hello World\"\
    \necho $BASH\n```\nNow, when we execute the script, the output comes out like\
    \ this:\n```bash\n./hello.sh\n```\nHello World\n/bin/bash\n```\nThis shows the\
    \ path of bash scripts /bin/bash.\nLet's practice more examples to be familiar\
