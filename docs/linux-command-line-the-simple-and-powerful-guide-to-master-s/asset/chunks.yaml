    `$ touch test`

    `$ ls`

    `hello.sh  test`

    `$ ./hello.sh`

    `Enter the name of the file : test`

    `“test found"`

    Now in the script code defined in `then` statement is executed as the file is
    existing now. Flag `-e` is the one that validates the existence of the file in
    the `if` statement.

    To check if the input name given is the regular file or not, `-f` flag will do
    that. We will change our script by changing flag `-e` to `-f` in the `if` statement.
    The script will look as below:

    ```bash

    #! /bin/bash

    echo -e "Enter the name of the file : \c"

    read file_name

    if [ -f $file_name ]

    then

    echo “$file_name found”

    else

    echo “$file_name not found.”

    fi

    ```

    Now let’s execute, and we will input the same filename; we know that `test` is
