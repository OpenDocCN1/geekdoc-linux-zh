    expr: non-integer argument

    subtraction of 20.5 - 5

    expr: non-integer argument

    multiplication of 20.5 * 5

    expr: non-integer argument

    division of 20.5 / 5

    expr: non-integer argument

    modulus of 20.5 % 5

    expr: non-integer argument

    ```


    在这里我们可以看到，使用双括号的错误是“invalid arithmetic operator”，而使用 `expr` 的操作则给出“non-integer
    argument”错误。为了解决此类问题，我们可以使用工具，在书中我们将介绍一个名为 `bc` 的工具，它代表 basic calculator（基础计算器）。大多数
    Linux 操作系统都带有 `bc`。如果默认没有安装，可以根据你正在使用的 Linux 发行版（yum, yast, zypper 等）进行安装。要详细学习
    `bc`，你可以查看如下 `bc` 的 man 页。


    ```bash

    man bc

    ```

    这将打开 `bc` 的 man 页。通过 `bc` 的定义，可以看到它被定义为任意精度算术语言。它是一种用于基础计算的语言。man 页将提供所有可用选项的细节，但在本章，我们将学习如何使用
    `bc` 进行基础算术运算。


    为了理解 `bc`，我们将在脚本中使用它。现在我们只保留变量，并定义小数运算，使用 `echo` 命令。在双引号中写入数字，引号关闭后加上管道符号，然后写入
    `bc`。这意味着双引号内的数字将作为视为右侧 `bc` 的输入。


    脚本将变为：


    ```bash

    #! /bin/bash

    num1=20.5

    num2=5

    echo "20.5+5" | bc

    ```

    让我们执行脚本。

    ```bash

    $ ./hello.sh

    25.5

    ```

    它为整数给正确的结果。同样，我们可以使用此命令执行其他算术运算。在下面的示例中，我们对相同的数字执行加法、减法、除法和取模：


    ```bash

    #! /bin/bash

    num1=20.5

    num2=5

    echo "20.5+5" | bc

    echo "20.5-5" | bc

    echo "20.5*5" | bc

    echo "20.5/5" | bc

    echo "20.5%5" | bc

    ```

    现在执行脚本。

    ```bash

    $ ./hello.sh

    addition of 20.5 + 5

    25.5

    subtraction of 20.5 - 5

    15.5

    multiplication of 20.5 * 5

    102.5

    division  of 20.5 / 5

    4

    modulus of 20.5 % 5

    5

    ```

    现在我们可以看到所有操作都已生效，除了除法之外都是正确答案。对于除法，它没有给我们适当的结果。让我们理解发生这种情况以及如何解决这个问题。为了解决除法问题，我们将设置
    `scale`。`scale` 定义了我们看到的小位数。在我们的示例中，我们在除法运算将 `scale` 设置为 2。


    ```bash

    echo "scale=2;20.5/5" | bc

    ```

    如果你想看到两位小数，可以这样写。现在在我们的示例中，我们将值保留为 2。现在执行脚本。

    ```bash

    $ ./hello.sh

    addition of 20.5 + 5

    25.5

    subtraction of 20.5 - 5

    15.5

    multiplication of 20.5 * 5

    102.5

    division  of 20.5 / 5

    4.10

    modulus of 20.5 % 5

    5

    ```

    这意味着每当我们要做除法运算时，都需要使用 `scale` 定义要看到的小位数。如果没有写，输出将不会显示任何小数，而这可能是正确的答案。此外，在上面的示例中，我们看到使用了数字进行计算而没有使用变量。`bc`
    也适用于变量。让我们在同一个脚本中将数字改为变量：


    ```bash

    #! /bin/bash

    num1=20.5

    num2=5

    echo "$num1+$num2" | bc

    echo "$num1-$num2" | bc

    ```

    执行脚本。

    ```bash

    $ ./hello.sh

    addition of 20.5 + 5

    25.5

    subtraction of 20.5 - 5

    15.5

    ```

    这看起来很好。正如我们在 man 页中看到的，`bc` 不仅用于简单的算术计算，还可以做更多。它可以执行平方根、三角函数等算术运算。


    ## 平方根


    现在让我们找到数字的平方根。可以通过 `bc` 的名为 `sqrt()` 的选项来实现。`sqrt()` 选项将帮助找到跟随该字符串数字的平方根。对于之前的计算，我们使用了没有其他选项的简单
    `bc`，但现在对于平方根，我们将使用数学运算；为了完成，我们将为 `bc` 添加 `-l` 选项。`-l` 标志将调用包含平方根函数的数学库。例如，我们想要数字
    27 的平方根。首先，我们将变量 `num` 设置为 27。同时，我们将 `scale` 设置为 2；如前所述，如果不放 scale，将会有 0 位小数。在设置
    scale 后，我们写入 `sqrt()`，最后是变量名。写完这个表达式后，我们将带有 `-l` 选项的输入传递给 `bc`。


    ```bash

    #! /bin/bash

    num=27

    echo "scale=2;sqrt($num)" | bc -l

    ```

    现在执行脚本。

    ```bash

    $ ./hello.sh

    5.19

    ```

    我们得到了平方根。


    ## 幂函数


    现在让我们学习幂函数。获取任何数字的幂是通过脱号符号 `^` 实现的。在这里我们还需要用 `scale` 设置想要在输出中看到的小位数。对于此函数，我们也为
    `bc` 使用 `-l` 标志。通过示例理解，现在我们想要获取 2 的 3 次，脚本将如下：


    ```bash

    #! /bin/bash

    num=4

    echo "scale=2;2³" | bc -l

    ```

    现在执行脚本。

    ```bash

    $ ./hello.sh

    8

    ```

    看起来良好。


    使用 `bc` 的的一些标志列如下：

    - `-h`, `--help`: 打印用法并退出。

    - `-i`, `--interactive`: 强制交互模式。

    - `-l`, `--mathlib`: 定义标准数学库。

    - `-w`, `--warn`: 对 POSIX `bc` 的扩展给出警告。

    - `-s`, `--standard`: 仅处理 POSIX `bc` 语言。

    - `-q`, `--quiet`: 不打印正常的 GNU bc 欢迎。

    - `-v`, `--version`: 打印版本号和版权并退出。


    使用 `bc` 可以进行的更多操作：

    - `++ var`: 变量后自增

    - `++var`: 变量加 1，新值为表达式的结果。

    - `--var`: 变量减 1，新值源于表达式。

    - `var ++`: 表达式的结果是变量的值


