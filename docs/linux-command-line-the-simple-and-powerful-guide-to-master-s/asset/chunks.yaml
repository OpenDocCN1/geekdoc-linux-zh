- fmt: "\n# Chapter Nineteen: Read Only Command\n\nIn this chapter, we will learn\
    \ how to use a read-only command in shell scripting. Read Only variables can be\
    \ used with variables and functions. With the name only we can understand that\
    \ it can use to make variables and functions read-only and cannot be overwritten.\n\
    \nThe syntax to write read-only command is:\n`readonly <variable name>` \n\nLet’s\
    \ understand with an example. We will write a variable `var` with value as `31`.\
    \ Now we can use `read-only` command on this variable. For that, write `readonly`,\
    \ followed by a variable name. Once this is set, in the next line, we will write\
    \ the same variable with a different value. It is shown below:\n\n```bash\n#!\
    \ /bin/bash\nvar=31\nreadonly var\nvar=50\n```\n\nLet’s execute the script now:\n\
    ```bash\n$ ./hello.sh\n./hello.sh: line 7: var: readonly variable\n$\n```\nIt\
    \ gives us a warning that `var` is a read-only variable. Let’s print the value\
    \ of `var` in the script:\n\n```bash\n#! /bin/bash\nvar=31\nreadonly var\nvar=50\n\
    echo \"var => $var\"\n```\n\nExecute the script now:\n```bash\n$ ./hello.sh\n\
    ./hello.sh: line 7: var: readonly variable\nvar => 31\n$\n```\nThe value of `var`\
    \ is still `31`, though we have reassign the value of `var` to `50`, but it remains\
    \ the same with the first value assigned. This has happened as we have made `var`\
    \ variable as read-only, and any other value cannot be assigned. When we try to\
    \ assign another value, it displays a warning.\n\nThe same way we can make functions\
    \ also read-only. First, let’s create a function name, `hello` to print message\
    \ `hello`. We will add the function in our previous script.\n\n```bash\n#! /bin/bash\n\
    var=31\nreadonly var\nvar=50\necho \"var => $var\"\nhello() {\necho \"Hello World\"\
    \n}\nhello\n```\n\nLet’s execute the script now:\n```bash\n$ ./hello.sh\n./hello.sh:\
    \ line 7: var: readonly variable\nvar => 31\nHello World\n$\n```\nYou can see\
    \ the message ‘Hello World’ is printed. Now, if we want to make this function\
    \ read-only. For that, we will use the `readonly` keyword with function, but this\
    \ will not make function as required. For function, we need to use the flag `-f`.\n\
    `readonly -f <function name>`\n\nLet’s make the function `hello` as read-only\
    \ in our script. Let’s make this function as read-only in our script, and then\
    \ we will try to change the value by adding lines for the same function with different\
    \ `echo` command. Below is the script now:\n\n```bash\n#! /bin/bash\nvar=31\n\
    readonly var\nvar=50\necho \"var => $var\"\nhello() {\necho \"Hello World\"\n\
    }\nreadonly -f hello\nhello() {\necho \"Hello World Again\"\n}\n```\n\nLet’s execute\
    \ the script now:\n```bash\n$ ./hello.sh\n./hello.sh: line 7: var: readonly variable\n\
    var => 31\n./hello.sh: line 19: hello: readonly function\n```\nWe can see the\
    \ message has come for the function `hello` that it is read-only.\n\nLet’s do\
    \ one more test. What will happen if we write the keyword `readonly` without defining\
    \ any variable or function? Let’s add this keyword to our script and do this test.\n\
    \n```bash\n#! /bin/bash\nreadonly\n```\n\nLet’s execute the script now:\n```bash\n\
    $ ./hello.sh\nBASHOPTS=\"checkwinsize:cmdhist:complete_fullquote:extquote:force_fignore:hostcomplete:interactive_comments:progcomp:promptvars:sourcepath\"\
    \ndeclare -ir BASHPID\ndeclare -ar BASH_VERSINFO=([0]=\"4\" [1]=\"4\" [2]=\"23\"\
    \ [3]=\"1\" [4]=\"release\" [5]=\"x86_64-suse-linux-gnu\")\ndeclare -ir EUID=\"\
    1001\"\ndeclare -ir PPID=\"11356\"\ndeclare –r: SHELLOPTS=\"braceexpand:hashall:interactive-comments\"\
    \ndeclare -ir UID=\"1001\"\n$\n```\nNow, what can we see is the list; all variables\
    \ which are built-in and read-only. These are: `BASHOPTS`, `BASHPID`, `BASH_VERSINFO`,\
    \ `EUID`, `PPID`, `SHELLOPTS` and `UID`.\n\nIf you want to see all read-only functions,\
    \ then in script, we will write `readonly` with the flag `-f`. First, let’s create\
    \ a function in the script and make it read-only.\n\n```bash\n#! /bin/bash\nhello()\
    \ {\necho \"Hello\"\n}\nreadonly -f hello\nreadonly -f\n```\n\nLet’s execute now:\n\
    ```bash\n$ ./hello.sh\nhello (){\necho \"Hello\"}\ndeclare -fr hello\n$\n```\n\
    In the output, the read-only function is printed.\n\n### Summary\n- We learned\
    \ how we could make variable and function as read-only. Once it is made as read-only,\
    \ we cannot reassign to another value.\n- We learned how to display read-only\
    \ variables and functions.\n\n# Chapter Twenty: Signals and Traps\n\nWhen any\
    \ script is running to compete, all steps written in it, and during its processing,\
    \ it gets an instruction to stop the execution. This interruption is called a\
    \ signal. In signal terms, it is called `SIGINT`. It will be more transparent\
    \ with an example.\n\nWe have created a script below.\n\n```bash\n#! /bin/bash\n\
    echo \"pid is $$\"\nwhile (( COUNT < 10 ))\ndo\nsleep 10\n(( COUNT ++ ))\necho\
    \ $COUNT\ndone\nexit 0\n```\n\nIn this script, 1st with `echo` command, it is\
    \ checking PID (process ID) of the script itself that is assigned in the system.\
    \ The variable `$$` will get the PID of the script. After that, the `while` loop\
    \ starts with a condition for the `COUNT` to be less than 10. In `do`, there is\
    \ a `sleep` of 10 seconds; after every one cycle of the loop, for the next execution,\
    \ the loop will suspend for 10 seconds and increment the number by 1. In this\
    \ way, the script will run until the count reaches ten after that script will\
    \ be ended. The total runtime of the script will be 100 seconds.\n\n```bash\n\
    $ ./hello.sh\npid is 16245\n12345\n^C\n```\nHere the script has started with PID\
    \ as `16245`, and every count is printed on the screen at the interval of 10 seconds.\
    \ Now while running the script, some scenarios can happen. Users can press `ctrl+c`\
    \ to come out of the script. Here in the above example, we have pressed `ctrl+c`\
    \ to terminate the script while it was in the middle of processing. In this case,\
    \ we have provided `ctrl+c` SIGNAL, and this is called an interrupted signal,\
    \ and in a signal term, it is called `SIGINT`. So we have sent `SIGINT` command\
    \ to terminate the script in between before its completion.\n\nLet’s rerun the\
    \ same script and do one more test to understand more options.\n\n```bash\n$ ./hello.sh\n\
    pid is 16269\n12345\n^Z\n[1]+ Stopped ./hello.sh\n$\n```\nThe PID of the script\
    \ is now `16269`. This time in place of `ctrl+c`, we have pressed `ctrl+z` to\
    \ terminate the script. The `ctrl+z` is called a suspend signal; in signal term,\
    \ it is called `SIGTSTP`. When we pressed `ctrl+z`, the script gave the message\
    \ ‘Stopped’ and this also an interrupt signal as the script was in the middle\
    \ of something.\n\nLet’s understand interrupting the process with the `kill` command.\
    \ Let’s execute the script again. The PID of the script now is `16481`. While\
    \ script is running, open a new terminal, and run `kill` to end this process.\
    \ Run the below command in another terminal:\n\n```bash\nkill -9 16481\n```\n\
    The `-9` option is also a signal, it is called `SIGKILL`, and `16481` is the PID.\
    \ As soon as we give the `kill` command, we will see on the terminal where the\
    \ script was running, that it ended with a message ‘killed’, and the script is\
    \ stopped.\n\n```bash\n$ ./hello.sh\npid is 16481\n1234\nKilled\n$\n```\nIn this\
    \ way there will be scenarios when the script is interrupted, while script was\
    \ running some interruption can come or some behavior can stop the execution.\
    \ This is where we use command `trap`. The complete list of signals is listed\
    \ in the man page of signal. Run `man signal`, and if you scroll, there will be\
    \ a complete list of signals. That is shown below:\n\n| Signal | Value | Action\
    \ | Comment |\n| :--- | :--- | :--- | :--- |\n| SIGHUP | 1 | Term | Hangup detected\
    \ on controlling terminal or death of controlling process |\n| SIGINT | 2 | Term\
    \ | Interrupt from keyboard |\n| SIGQUIT | 3 | Core | Quit from keyboard |\n|\
    \ SIGILL | 4 | Core | Illegal Instruction |\n| SIGRT | 6 | Core | Abort signal\
    \ from abort |\n| SIGFPE | 8 | Core | Floating-point exception |\n| SIGKILL |\
    \ 9 | Term | Kill signal |\n| SIGGV | 11 | Core | Invalid memory reference |\n\
    | SIGPIPE | 13 | Term | Broken pipe: write to pipe |\n| SIGALRM | 14 | Term |\
    \ Timer signal from alarm |\n| SIGTERM | 15 | Term | Termination signal |\n| SIGUSR1\
    \ | 30,16 | Term | User-defined signal |\n| SIGUSR2 | 31,12,17 | Term | User-defined\
    \ signal |\n| SIGCHLD | 20,17,18 | Ign | Child stopped or terminated |\n| SIGCONT\
    \ | 19,18,25 | Cont | Continue if stopped |\n| SIGSTOP | 17,19,23 | Stop | process\
    \ |\n| SIGTSTP | 18,20,24 | Stop | Stop at terminal |\n| SIGTIN | 21,21,26 | Stop\
    \ | Terminal input for background process |\n| SIGTOU | 22,22,27 | Stop | Terminal\
    \ output for background process |\n\nIn the above table, we can see, when `ctrl+c`\
    \ was processed, that was an interruption from the keyboard and had signal name\
    \ `SIGINT` listed in the table. It has value `2`. Next, we have pressed `ctrl+z`.\
    \ When we did that, we could see ‘stop’ was typed on the screen. As per table,\
    \ that will be `SIGTSTP` with value `12` and `24`. In the third example, we terminated\
    \ the script using `kill` command, which means there was signal `SIGKILL`. It\
    \ has value `9`. When we gave `kill` command, we have mentioned this value as\
    \ `-9`. To get more details about the signal, you can run below command:\n`man\
    \ signal`\n\n### Trap Command\n\nWhy we use trap command? When a script is running,\
    \ and is interrupted in between the completion of project, that time trap command\
    \ is used to capture the interrupt and then clean it up within the script. Let’s\
    \ understand with an example. We will have the script below:\n\n```bash\n#! /bin/bash\n\
    trap \"echo Exit command is detected\" 0\necho \"Hello world\"\nexit 0\n```\n\n\
    The script starts with a `trap` command, and then we will echo some text that\
    \ “Exit command is detected”. After that we will type `0`; this is a signal we\
    \ expect. Signal 0 means success. We have seen the value of signals in the table,\
    \ and the values are always greater than 0. At the end, 0 means it is a success.\
    \ The next line has an `echo` to print text ‘Hello World’, and the last line is\
    \ that we want to exit from the script, so we gave `exit 0`. The `exit 0` is a\
    \ success signal. Let’s execute the script now:\n\n```bash\n$ ./hello.sh\nHello\
    \ world\nExit command is detected\n$\n```\n\nLet’s understand the sequence of\
    \ execution of the script. It has started with a command `trap` for a signal.\
    \ The trap means whenever it receives the signal `0`, then it will execute the\
    \ command, which is written in quotes. In our case, after trap written is `echo\
    \ Exit command is detected`. Here command `echo` is used to print the text. In\
    \ the end, 0 means to print this when this signal is found in the script. This\
    \ is on the third line as `exit 0`. To understand more, let’s see our old script\
    \ again as below:\n\n```bash\n#! /bin/bash\necho \"pid is $$.\"\nwhile (( COUNT\
    \ < 10 ))\ndo\nsleep 10\n(( COUNT ++ ))\necho $COUNT\ndone\nexit 0\n```\n\nWe\
    \ will make some changes here now. We will add `trap` command with the text in\
    \ `echo`. At the end of the trap line, we want to detect a `SIGINT` signal; then,\
    \ this word will be written in the end. To mention `SIGINT`, it can be written\
    \ either by the name of a signal or by its value `2`. `SIGINT` is an interruption\
    \ by a keyboard that is `ctrl+c`. By adding this line, the script will be as below:\n\
    \n```bash\n#! /bin/bash\ntrap \"echo Exit command is detected\" SIGINT\necho \"\
    pid is $$\"\nwhile (( COUNT < 10 ))\ndo\nsleep 10\n(( COUNT ++ ))\necho $COUNT\n\
    done\nexit 0\n```\n\nLet’s execute the script now, and while it is executing,\
    \ we will press `ctrl+c` and see what happens.\n\n```bash\n$ ./hello.sh\npid is\
    \ 18741\n1234\n^C\nExit command is detected\n56\n^C\nExit command is detected\n\
    7\n^C\nExit command is detected\n8\n^C\nExit command is detected\n9\n^C\nExit\
    \ command is detected\n10\n$\n```\n\nWe can see that script started with PID `18741`,\
    \ and after counter 4, we pressed `ctrl+c` and messages printed on-screen “^ C\
    \ Exit command is detected”. This is the message we wrote in the `trap` with `echo`\
    \ command. The interesting thing is even we have pressed `ctrl+c`, the script\
    \ is not ending up. We pressed `ctrl+c` multiple times, and every time the same\
    \ message was printed, but the script didn’t terminate. It has completed its counter\
    \ and then ended. Let’s try to trap the `SIGKILL` signal. So do this, with `trap`\
    \ command we will mention `SIGKILL` or its value as `9`:\n\n```bash\n#! /bin/bash\n\
    trap \"echo Exit command is detected\" SIGKILL\necho \"pid is $$\"\nwhile (( COUNT\
    \ < 10 ))\ndo\nsleep 2\n(( COUNT ++ ))\necho $COUNT\ndone\nexit 0\n```\n\nLet’s\
    \ execute the script. When the script is running, we will open another terminal\
    \ and run `kill -9` `<PID>`. It will generate PID when we start the script.\n\n\
    ```bash\n$ ./hello.sh\npid is 18816\n123\nKilled\n$\n```\n\nWhen the script was\
    \ executing, we opened another session and ran the command `kill -9` `18816` (`18816`\
    \ is the PID). This time the executing of script got ended with message ‘killed’,\
    \ we did not saw the text written in `trap`. Why this happened? The command `trap`\
    \ was supposed to print the message written in `echo`. There are some exceptions\
    \ to `trap`. The `trap` cannot capture `SIGKILL` and `SIGSTOP`. So anytime when\
    \ `SIGKILL` or `SIGSTOP` is used, the `trap` cannot catch these signals. Now we\
    \ will see more examples and how it works. This time we want that when a signal\
    \ is received, it will delete a file. Let’s do it now. First, let’s check the\
    \ files in our directory and creating a new empty file with `touch`:\n\n```bash\n\
    $ ls\npwd/home/user1/\ntouch test\n$ls\nhello.sh\ntest\n```\n\nWe want to define\
    \ a signal in our script, and when that signal is received, it should delete the\
    \ file. we create `test` and give its value `file=\"/home/user1/test\"`. Another\
    \ change we will do in `trap`. In place of `echo`, command, we will add `rm -f`\
    \ with the file variable that is `$file`. Also, on the same line, we write that\
    \ after deleting this file `exit`. This can be done by writing `exit`. Also, we\
    \ want to catch signal as `0` (SUCCESS), `2` (SIGINT), and `15` (SIGTERM). The\
    \ line will become as:\n\n```bash\ntrap \"rm -f $file; exit\" 0 2 15\n```\n\n\
    The semicolon symbol (`;`) is used to combine two commands. Now the `trap` will\
    \ delete the file when it receives any of these signals.\n\n```bash\n#! /bin/bash\n\
    file=\"/home/user1/test\"\ntrap \"rm -f $file; exit\" pid is $$\nwhile (( COUNT\
    \ < 10 ))\ndo\nsleep 5\n(( COUNT ++ ))\necho $COUNT\ndone\nexit 0\n```\n\nWe will\
