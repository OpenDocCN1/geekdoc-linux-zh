    is used, the trap cannot catch these signals. It is recommended not to use SIGKILL
    or SIGSTOP for trap command.Now we will see more examples and see how it works.This
    time we want that when a signal is received, it will delete a file. Let’s do it
    now.First, let’s check the files in our directory and creating a new empty file
    with touch command$ lshello.sh$ pwd/home/user1/$ touch test$ lshello.sh  test$We
    want we will define a signal in our script, and when that signal is received,
    it should delete the file we create ‘test’. To do this, we will create a variable
    in our script ‘file’ and to give its value, we will define its complete path of
    the file name ‘test’ as shown below:file=”/home/user1/test”Another change we will
    do in trap command. In place of echo, command, we will add command rm –f with
