    ./hello.sh: line 7: 20.5: syntax error: invalid arithmetic operator (error token
    is ".5")

    subtraction of 20 - 5

    ./hello.sh: line 9: 20.5: syntax error: invalid arithmetic operator (error token
    is ".5")

    multiplication of 20 * 5

    ./hello.sh: line 11: 20.5: syntax error: invalid arithmetic operator (error token
    is ".5")

    division of 20 / 5

    ./hello.sh: line 13: 20.5: syntax error: invalid arithmetic operator (error token
    is ".5")

