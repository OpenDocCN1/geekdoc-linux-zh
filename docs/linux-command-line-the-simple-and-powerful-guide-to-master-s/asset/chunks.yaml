    \ has come as the first variable set with the below two lines in the script:\n\
    ```bash\nname=\"Tom\"\necho \"The name is $ name: Before.\"\n```\nThis has been\
    \ printed before the `print` function was called, which is correct.\n\n### The\
    \ second line of output: “the name is Max.”\n\nThis line has been printed as the\
    \ `print` function was called with an argument `Max`. When the `print` function\
    \ was called, then in that function, the variable `name` has been set its value\
    \ as `Max`.\n\n### The third line of output : “The name is Max : After.”\n\nIn\
    \ the previous step, the variable `name` has been assigned with the value `Max`.\
    \ With the `echo` command when it prints text for the variable `name`, it reads\
    \ as `Max` only. Now until any change is done in the variable value, it keeps\
    \ the value as `Max` throughout. This is a bit confusing, as we have set the variable\
    \ `name` as `Tom` initially, which is outside our function. We expect the variable\
    \ defined in function should not change the value defined outside the function\
    \ which a global name. That means in the second `echo` command we expect output\
    \ as `Tom` only. This requirement of keeping the same variable value which is\
    \ global and should not be changed by any variable defined in the function. This\
    \ where `local` keyword comes in the picture.\n\nLet’s do a change in the `print`\
    \ function we will define `local` keyword before the variable is defined. Now\
    \ the script will look as below:\n\n```bash\n#! /bin/bash\nfunction print(){\n\
    \    local name=$1\n    echo \"the name is $name\"\n}\nname=\"Tom\"\necho \"The\
    \ name is $name : Before.\"\nprint Max\necho \"The name is $name : After.\"\n\
    ```\n\nLet’s execute the script now:\n```\n ./hello.sh\nThe name is Tom : Before\n\
    the name is Max\nThe name is Tom : After\n```\nYou can see when the keyword `local`\
    \ has been added in front of the variable; then this variable has become a local,\
    \ it cannot access the variable outside the function. This will be just for local\
    \ execution and will not affect the global variable.\n\nHow every line of output\
    \ has come, let’s understand now:\n\n*   **The first line of output: The name\
    \ is Tom : Before**\n    This is output from the 1st `echo` command. Before this\
    \ echo command, the value of the global variable `name` was set as `Tom`.\n\n\
    *   **The second line of output: the name is Max**\n    At this stage, the function\
    \ `print` was called with argument `Max`. In this function, the variable value\
    \ of `name` has been set as the argument provided and it printed it as `Max`.\
    \ The variable this time is from the function `print` was set with `keyword` local.\n\
    \n*   **The third line of output: The name is Tom : After**\n"
