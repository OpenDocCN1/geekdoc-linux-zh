    \ we recommend getting the first book in the series to understand the history\
    \ and theory of shell scripting.\n\n## Chapter One: What is Shell?\nUnix shell\
    \ interprets user commands which are directly executed by the user or by reading\
    \ from a file known as the shell script or shell program.\n\n### Usage of shell\n\
    Please see the diagram below.\nWhen the Linux machine is powered ON, first it\
    \ loads its kernel. A kernel is an interface between hardware and the operating\
    \ system. The kernel manages hardware resources like CPU, RAM, Input/Output devices\
    \ to the application for any software to run. Any application needs to connect\
    \ to the kernel to work. That is where the shell comes into the picture to connect\
    \ the application to the kernel.\n\nIt is essential to know that shell script\
    \ can be interpreted but cannot be compiled. When you write a shell script, the\
    \ operating system interprets it, and there is no need to compile the shell script\
    \ to execute it. There are multiple types of scripting options available.\n\n\
    ### Which Shell does your Operating System Support?\nTo check which shell type\
    \ your operating system will support, check the `/etc/shells` file.\n\n```bash\n\
    cat shells/bin/ash/bin/bash/bin/csh/bin/dash/bin/sh\n```\nThe above output of\
    \ the command shows that the system can run shells – ash, bash, csh, dash, sh,\
    \ and tcsh.\n\nThe `sh` shell stands for the Bourne shell, which is the original\
    \ shell still used on Unix or in Unix-like environments. The `sh` was the first\
    \ shell used in the Unix operating system.\n\n**Bash** – it stands for Bourne\
    \ Against the Shell and is the improved version of `sh`. These days, `bash` is\
    \ the standard GNU shell. It is intuitive and flexible. These days, this is the\
    \ most commonly used shell in UNIX or LINUX based operating systems. They also\
    \ use it in MacOS and Windows 10 environments.\n\nTo check about the location\
    \ of your shell, you can check with the `which` command. For example, you want\
    \ to check the location of the `bash` shell in your operating system, run the\
    \ below command:\n\n```bash\nwhich bash\n/bin/bash\n```\nThe above output of the\
    \ command shows that the system can run shells – ash, bash, csh, dash, sh, and\
    \ tcsh.\n\n### The First Script\nTo check about the location of your shell, you\
