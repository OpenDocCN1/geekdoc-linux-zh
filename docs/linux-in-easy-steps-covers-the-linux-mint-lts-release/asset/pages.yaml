  md: "# Comparing Files\n\nThe shell provides several ways to compare two files.\
    \ You can check to see if two files are identical with the cmp command. If they\
    \ are indeed identical the command reports nothing, but if they differ it reports\
    \ the location of the first difference.\n\nThe cmp command can also be used to\
    \ compare binary files such as images.\n\nText files can be compared line-by-line\
    \ with the comm command. Its output is slightly unusual, as it creates three columns\
    \ to lines that match in each:\n\n+   - Column 1 – lines found in the first file,\
    \ but not the second.\n- Column 2 – lines found in the second file, but not the\
    \ first.\n- Column 3 – lines found in both files.\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_151_0.png)\n\
    \nUse a text editor to create a file named abc.txt, with three lines \"Alpha\"\
    , \"Bravo\", and \"Charlie\", and a file named acd.txt with three lines \"Alpha\"\
    , \"Charlie\" and \"Delta” – save the files in the current directory\n\nLaunch\
    \ a shell Terminal window and enter the command cmp abc.txt acd.txt to discover\
    \ where the first difference occurs between these two files\n\nEnter comm abc.txt\
    \ acd.txt to see a line-by-line comparison\n\nThe cmp command has options to suppress\
    \ column output – the option -12 suppresses the first two columns to show only\
    \ lines that are common to both files.\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_151_1.png)\n\
    \n```\nmike@linux-pc:~/Data\nFile Edit View Search Terminal Help\nmike@linux-pc:~/Data\
    \ comm abc.txt acd.txt\nabc.txt acd.txt differ: byte 7, line 2\nmike@linux-pc:~/Data\
    \ comm abc.txt acd.txt\n\nBravo\tAlpha\n\tCharlie\tDelta\nmike@linux-pc:~/Data\
    \ |\n```"
  merge: -1
  pgno: 151
- img_proc: true
  md: '# cont''d


    The diff command offers an alternative to the comm command for comparison of text
    files. It too compares line-by-line, and it produces a detailed report showing
    any unique lines. It can also be used to compare two directories to reveal unique
    files.


    Files may also be compared using checksum numbers to verify their integrity. Checksum
    numbers are often found on internet download pages so the user can ensure that
    a downloaded file is intact – typically, the checksum is made using the md5 algorithm.


    The md5sum command produces a 32-byte checksum for the file specified as its argument,
    and which should exactly match that stated by the originator if the file is indeed
    intact.


    An alternative checksum can be created in the same way as the cksum command. This
    generates a CRC (Cyclic Redundancy Check) value and includes the file''s byte
    size in the output.


    +   4 Enter a diff abc.txt abd.txt command to discover those lines that are unique
    to each file


    +   5 Now, enter md5sum abc.txt to create a checksum number for that file


    +   6 Similarly, enter cksum abc.txt to create another checksum number for that
    file


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_152_0.png)


    You can enter the command man diff to discover more about the diff output from
    its manual page.'
  merge: -1
  pgno: 152
