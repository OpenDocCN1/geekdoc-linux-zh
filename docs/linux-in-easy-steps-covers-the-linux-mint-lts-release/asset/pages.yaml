  md: "# Examining File Properties\n\nThe Linux shell provides many commands that\
    \ can be used to examine attributes of any file. The most comprehensive is the\
    \ stat command that lists every attribute of the file stated as its argument.\n\
    \nIf you just want to discover the file size, use the du disk usage command with\
    \ its -b option to count the number of bytes.\n\nUse the wc word count to quickly\
    \ discover how many newlines, and bytes of a text file contains, or assess what\
    \ type of file it is with the file command:\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_149_0.png)\n\
    \nUse the wc command with its -m option to see a total word count.\n\n+   Enter\
    \ stat Box/some.txt to discover the attributes of a file named \"some.txt\" in\
    \ a Box sub-directory\n\n+   Enter du -b Box/some.txt to discover the size of\
    \ this file in byte units\n\n+   Enter wc Box/some.txt to discover that file's\
    \ line count, word count, and byte count\n\n+   Now, enter file Box/some.txt and\
    \ file Box/tuk.png commands to discover the file type of two files\n\nSee that\
