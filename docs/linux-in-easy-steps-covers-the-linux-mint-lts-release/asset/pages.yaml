  md: '# Exchanging Email


    Many Linux distros include the popular Thunderbird email app. The first time Thunderbird
    starts it off offers you a new email account or the option to use an existing
    email account. Typically, you will need to supply the name of your ISP''s mail
    servers (POP and SMTP), and your email address and password. When this is complete,
    and you have an internet connection, you can start sending and receiving email
    messages:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_81_0.png)


    Thunderbird Mail


    +   Click Menu, Internet, Thunderbird Mail, then click the Get Messages button
    on Thunderbird''s toolbar


    +   Expand the folders in the left-hand pane, then click the Inbox to see received
    messages in the top right-hand pane


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_81_1.png)


    Thunderbird is also a contact manager. Right-click this "From" and choose Add
    to Address Book and click the Address Book button on the toolbar to see your contacts.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_81_2.png)


    +   Click on a received message in the top right-hand pane to see its contents
    in the right-hand pane


    +   To write a message, click the Write button on the toolbar to open a "Write"
    window - as seen opposite


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_81_3.png)


    The POP (Post Office Protocol) server handles incoming emails and the SMTP (Simple
    Mail Transfer Protocol) server handles outgoing emails.


    +   In the Write window''s From field, select the account from which to send the
    message


    +   In the To field, type the email address you are sending to


    +   In the Subject field, type a short message title'
