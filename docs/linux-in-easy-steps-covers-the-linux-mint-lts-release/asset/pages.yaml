  md: '# Writing Text


    The plain text Text Editor app (xed) in Linux Mint is the equivalent of the Notepad
    app in Windows – but Text Editor has many more features. It can number lines,
    sort lines into alphabetic order, and provides syntax highlighting for a whole
    range of scripting, programming, and markup languages.


    You must recognize, however, that Linux does not treat text endings the same way
    as Windows. Linux adds a non-printing line feed \n (''\newline'') character, whereas
    Windows adds non-printing carriage return and line feed \r\n characters. This
    means text files created in Linux do not maintain their line endings correctly
    when viewed on a Windows system. The Text Editor app provides an option when saving
    text files that lets you choose your preferred type of line endings:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_127_0.png)


    +   - Click Menu, Accessories, Text Editor to launch the app


    +   - Next, click Tools, Autocheck Spelling to turn the spellchecker on


    +   - Now, type in some lines of text – see the spellchecker place red beneath
    suspicious items


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_127_1.png)


    The Notepad app in versions of the Windows 10 operating system from October 2018
    supports both Linux and Windows \r\n line endings.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_127_2.png)


    ```

    HTML5 in easy 2nd edition contains examples and screenshots that illustrate each
    feature of HTML, describing how to incorporate metadata and structured body content.
    You''ll learn how to create web pages to display text, images, tables, hyperlinks,
    forms, media, video and how to animate graphics on embedded ''canvas'' areas.
    Each chapter builds your knowledge so by the end of the book you''ll have gained
    solid understanding

    ```


    You can click Edit, Sort lines into alphanumeric order, then click Edit, Undo
    to revert to the original.


    +   - Click Edit, Preferences, Editor, to toggle the "Display line numbers" switch
    to On – to see the lines generated


    +   - Turn off the spellchecker and click Edit, Select All (or press Ctrl + A)
    to select all text, then hit the Delete key to remove all'
