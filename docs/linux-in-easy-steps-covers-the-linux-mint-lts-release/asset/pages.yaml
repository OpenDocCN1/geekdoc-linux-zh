    +   7 Enter unmount /dev/sdb1 to unmount the file system on the USB drive


    +   8 Now, issue command sudo fsck /dev/sdb1 to check the USB drive file system
    for errors


    +   9 When the check completes, remove the flash drive from the USB port – reinsert
