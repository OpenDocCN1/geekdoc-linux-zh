  md: '# # Installing Updates


    Having set up Timeshift to make regular backups of your Linux Mint system (see
    page 22), it is recommended that you regularly apply all updates for your system:


    +   - Connect your PC to the internet, then click Menu, Administration, Update
    Manager to open an “Update Manager” window


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_0.png)


    A “Welcome” screen may appear when you first open the Update Manager. Click its
    OK to proceed.


    +   - If the Update Manager suggests you switch to a local mirror server, click
    this OK


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_1.png)


    +   - Enter your password, then click the Authenticate button to open a “Software
    Sources” dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_2.png)


    Previous versions of Linux Mint recommended you perform selective updates, in
    case they introduce problems. Timeshift changed that, as you can restore your
    system.


    +   - Double-click in the Main (tara) box and select a local mirror from the list
    that appears, then click Apply


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_3.png)


    +   - Now, select a local mirror for the Base (bionic) box, then click OK to close
    the “Software Sources” dialog'
