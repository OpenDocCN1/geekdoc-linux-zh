  md: 'You can confirm the current user and domain name at any time with the **whoami**
    and **hostname** commands:


    +   2. Type the **whoami** command at a prompt, then hit Return


    +   3. Now, type the **hostname** command and hit Return again


    ```

    $ milke@linux-pc:~$ whoami

    mike

    milke@linux-pc:~$ hostname

    host

    milke@linux-pc:~$ $

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_142_0.png)


    Commands use lowercase only - in uppercase the command will not be recognized.


    Some commands call upon individual programs that reside on your system - for example,
    the **clear** command that removes previous content from the Terminal. Others
    are “built-in” commands that are built into the shell itself - for example, the
    **exit** command that quits the shell and closes the Terminal window. You can
    determine whether a command is a builtin using the **type** command and the command''s
    name as its argument:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_142_1.png)


    +   4. Type **clear** and hit Return to remove the previous content, then enter
    **type clear** and hit Return again to discover the location of the **clear**
    command program


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_142_2.png)


    +   5. Enter **type exit** and hit Return to discover that the exit command is
    a shell builtin instruction, then type the **exit** command and hit Return to
    quit the shell


    Type a **--help** argument (two hyphens) & “help”) after any command, then hit
    Return, to see a list of options for that command.


    ```

    $ milke@linux-pc:~$ clear

    clear is hashed (/usr/bin/clear)

    milke@linux-pc:~$ exit

    exit is a shell builtin

    milke@linux-pc:~$ $

    ```'
