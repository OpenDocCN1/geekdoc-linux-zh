  md: '# Installing Packages


    The Advanced Packaging Tool (APT) is a command-line tool that automates the process
    of retrieving, configuring, and installing software packages. It relies upon online
    repositories to locate software and resolve dependencies – so that the installation
    package will include any libraries required by the application.


    Surprisingly, as package installation modifies your system, all APT commands must
    be run using **sudo** for superuser privileges.


    The APT''s **apt-get** command has several options with which to manage packages.
    It''s useful to first execute an **apt-get update** command to update the list
    of available repository packages, before issuing an **apt-get install package-name**
    command.


    Once installed, a package can be upgraded to the latest version with an **apt-upgrade
    package-name** command.


    After a package has been installed it can be removed later using an **apt-get
    remove package-name** command – but this retains the configuration files for that
    package. For complete removal of a package and its configuration files you can
    instead use the command **apt-get --purge remove package-name**.


    +   Enter the sudo apt-get update command to ensure the package list is up-to-date


    +   Now, issue a command to install a package – for example, enter **sudo apt-get
    install corebird** to install the “Corebird” Twitter client package:


    ```

    mike@linux-pc:~$ sudo apt-get install corebird

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    The following NEW packages will be installed:

    corebird

    ```


    +   Some packages request confirmation before installation that requires you to
    type **Y** and hit Return if you are happy to proceed, or enter **N** to cancel
    the installation'
