  md: '# Watching Movies


    Many Linux distros include a fast light-weight Media Player app (xplayer) that
    can play audio and video content in many file formats including AVI, MPG, WMV,
    WAV, MP3, and many more. On the Google Play Store this app is even named “Video
    Player All Format”. In Mint it is the default media player for audio or video
    file playback:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_119_0.png)


    +   1 Click Menu, Sound & Video, Media Player to launch the app


    +   2 Click File, Open to launch a “Select Movies or Playlists” dialog showing
    the contents of your Videos folder


    The Media Player also supports subtitles – click View, Subtitles, Download Movie
    Subtitles, then select a language and click the Find button to search for a subtitle
    file.


