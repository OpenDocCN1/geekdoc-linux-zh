  md: '# Summary


    +   - The whoami command reveals the user name, hostname

    reveals the domain name, clear empties the shell window, and

    exit terminates the shell session.


    +   - The pwd command reveals the current working directory and

    t directory location can be changed with the cd command.


    +   - The ~ tilde character is an alias for the home directory and

    any directory''s content can be revealed by the ls command.


    +   - The basename command returns the last part of an address,

    whereas the dirname command returns just the first part.


    +   - New directories are created with the mkdir command and

    empty directories can be removed by the rmdir command.


    +   - Files are moved or renamed with the mv command, copied

    with the cp command, and removed with the rm command.


    +   - The in command is used to create hard links and soft links,

    but the readlink command can only be used with soft links.


    +   - The stat command lists all file properties, du reports the

    size, and the file command reports the file type.


    +   - Timestamps of a file can be modified by the touch command,

    and the wc command can be used to report the word count.


    +   - Files can be compared with cmp, comm, and diff commands,

    and checksums generated by the cksum and md5 commands.


    +   - The find command locates a file, grep locates a string within

    file, and look locates lines beginning with a given letter.


    +   - Files can be viewed using the cat command, lines numbered

    with ni, and spelling checked by the aspell command.


    +   - The head command displays the first 10 lines of a file,

    whereas the tail command displays its final 10 lines.


    +   - The vi editor can be used to create files and individual

    text columns manipulated by the cut and paste commands.


    +   - A shell pipeline directs output to be used as input for another

    command and can include tee to write a file, tr to transform

    the output, and sort to order the output alphanumerically.'
