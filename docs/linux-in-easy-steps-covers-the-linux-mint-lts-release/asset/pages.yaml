  md: "# Enabling Backups\n\nHaving completed the installation process, by following\
    \ the steps on the previous pages, Linux Mint will launch to your Desktop. Before\
    \ you start using the operating system it is recommended you enable the “Timeshift”\
    \ backup utility. This is like “System Restore” on Windows and will allow you\
    \ to restore the operating system to an earlier backup should any problems arise:\n\
    \n![](img/7b6ecabd34062cd153290258f3b9cd5b_23_0.png)\n\nTimeshift Utility\n\n\
    +   - Click on Menu (“Start” button), Administration, Timeshift\n\n+   - Next,\
    \ enter the password you chose in the “Who are you?” dialog during the installation\
    \ process, then click the Authenticate button\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_23_1.png)\n\
    \nThe “Timeshift” utility is a new feature that was introduced in Linux Mint version\
    \ 19 (Tara).\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_23_2.png)\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_23_3.png)\n\
    \n+   - Now, select the “RSYNC” option, then click the Next button\n\n\"RSYNC”\
    \ is a disk-based backup system that only backs up what has changed since the\
    \ previous backup.\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_23_4.png)\n\n|\
    \ RSYNC | BTRFS |\n|---|---|\n| Snapshots are created by creating copies of file\
    \ systems using rsync, and hard-linked unchanged files from previous snapshots.\
    \ | |\n All files are copied when snapshot is created. Subsequent snapshots are\
    \ incremental; unchanged files will be hard-linked from the previous snapshot\
    \ if available. | |\n Snapshots can be saved to any disk formatted with a Linux\
    \ file system. Saving snapshots takes time but allows the system to be restored\
    \ even if system is damaged or re-formatted. | |\n Files and directories can be\
    \ excluded to save disk space | |"
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Select the device on which you want the system backup snapshots to be saved,
    then click the Next button. (Here, the chosen device is an external hard drive
    that is connected, but you could alternatively connect a USB drive and choose
    that device)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_24_0.png)


    Do not choose your main hard drive as the location at to save snapshots – this
    would not help you if your hard drive fails.


    Select the frequency for when you would like system snapshots to be saved on your
    chosen device, then click the Finish button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_24_1.png)


    Boot snapshots are saved in a newly-created timeshift directory at the root level
    of the chosen device. Boot snapshots are performed in the background so do not
    affect the speed when the system boots.


    Re-open Timeshift in the future and select a saved backup snapshot, then click
    the Restore to restore your Linux Mint system


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_24_2.png)'
