  md: '# Exporting Documents


    When saving documents from the LibreOffice word processor, the default file format
    used is the ODF (Open Document Format) Text format (.odt). Many alternative formats
    are available, however, your documents can be made compatible with Microsoft Office:


    +   - Click File, Save (or press Ctrl + S) to launch the "Save" dialog, type a
    document name in the Name field


    +   - Click the arrowed file type button to open a list of possible formats in
    which to save the document – choose the format Microsoft Word 2007-2013 XML (.docx)


    +   - Choose a location at which to save the document, such as your Documents
    folder, then click the Save button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_93_0.png)


    The Save dialog you don''t need to include a file extension in the Name field
    – it gets added automatically.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_93_1.png)


    If a "Confirm Format" dialog appears, click the button to confirm you wish to
    save using the docx file format – the file is then saved at the chosen location


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_93_2.png)'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'LibreOffice Writer has built-in support for the PDF (Portable Document Format)
    format. This allows you to create read-only versions of your documents in the
    popular PDF format, without any additional software. The PDF format maintains
    the style and content of the original document in a very compact file that can
    be easily transferred around networks and the internet:


    +   - Click File, Export As, Export as PDF to create a PDF version of the document
    – with the same file name but with a .pdf file extension


    +   - Copy the documents created in LibreOffice on Linux to a Windows system for
    comparison


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_94_0.png)


    > The uneditable PDF version maintains its appearance precisely, but the editable
    DOCX version may substitute a different font if the original is not installed
    in Windows – more importantly, both versions maintain color and layout formatting.'
