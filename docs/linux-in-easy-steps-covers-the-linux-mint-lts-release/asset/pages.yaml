  md: 'The contents of the current directory can be revealed using the ls command
    to display a list of its files and immediate sub-directories. This is a comprehensive
    command that has many useful options:


    +   - Use the -a option to see all directory contents – including hidden files
    and sub-directories.

    - Use the -l option to see long format listing for each item – including user
    and group ownership names.

    - Use the -t option to sort the contents by the time they were created or last
    modified.

    - Use the -o option to suppress group ownership details.


    Options can be combined to produce a complex option where each parameter is applied:


    +   Enter the command cd "My Topics" to move to an immediate sub-directory whose
    name contains a space


    +   Next, enter the ls command to simply list all its contents


    +   Enter the command ls -altog to list all contents including hidden files, in
    long format, listed by modification time – but with user and group details suppressed


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_144_0.png)


    > Directory names that contain spaces must be enclosed in quotation marks when
    specified as a command argument – avoid truncation of the name.


    ```

    mike@linux-pc:~$ cd "My Topics"

    mike@linux-pc:~$ ls -l "My Topics"

    ls linux.txt sample.txt

    mike@linux-pc:~$ ls -altog

    total 29

    drw-xr-x-- 1 4036 Jul 25 08:28

    drw-rw-r-- 1 1137 Jul 25 08:26 linux.txt

    drw-r--r-- 1 31 Jul 25 08:26 sample.txt

    drw-xr-x-- 2 4036 Jul 25 08:28 articles

    drw-xr-x-- 3 4096 Jul 25 08:25

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_144_1.png)


    All absolute directory addresses begin with a "/" as they descend from the / root
    location.


    143'
