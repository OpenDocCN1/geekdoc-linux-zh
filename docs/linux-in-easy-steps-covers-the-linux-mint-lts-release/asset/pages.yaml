  md: '# Chatting Online


    Linux distros typically include a cross-platform instant messaging application.
    Mint includes the free-source HexChat IRC (Internet Relay Chat) app. This can
    be used to chat about Linux and other topics on the "freenode" IRC network:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_83_0.png)


    +   1 Click **Menu, Internet, HexChat** to launch the app – connecting to the
    "Official Linux Mint Support Channel"


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_83_1.png)


    +   2 Next, click the **HexChat, Network** **List** menu option – to open the
    “Network List” dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_83_2.png)


    The **Nick name** will be your name visible in the IRC channels and the **User
    name** is your identity to the server.


    +   3 Enter a Nick name and a **User name**, then select the “freenode” network


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_83_3.png)


    +   4 Now, click the **Connect** button – to connect to the “freenode” network


    +   5 Once connected, enter the command **/join ##Linux** in the HexChat text
    field – to join freenode’s Linux Support Channel


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_83_4.png)'
