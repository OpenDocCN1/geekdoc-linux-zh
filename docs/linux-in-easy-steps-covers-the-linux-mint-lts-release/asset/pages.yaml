  md: '# Creating Spreadsheets


    The spreadsheet app that is part of the free LibreOffice suite provides the powerful
    ability to perform calculations on data using given formulas. It also allows spreadsheets
    to be saved in the format compatible with Microsoft Excel (.xlsx):


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_95_0.png)


    +   - Click **Menu, Office, LibreOffice Calc** to launch the spreadsheet app with
    a new blank spreadsheet


    +   - Enter some row and column headings, then use the **Font Color** button to
    accent their purpose


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_95_1.png)


    LibreOffice Calc


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_95_2.png)


    **Hot tip**

    You can choose cell colors, fonts, borders, alignment, and more in the **Format
    Cells** dialog.


    +   - Drag over all cells that will contain data, then right-click and choose
    **Format Cells** from the context menu – open a “Format Cells” dialog


    +   - Choose the **Currency** category in the dialog, then click the dialog''s
    **OK** button to apply the selection


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_95_3.png)


    +   - Enter numerical values in all cells for each week row and column – each
    value is treated as a currency amount'
