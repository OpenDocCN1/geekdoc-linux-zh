  md: "# Navigating at the Prompt\n\nWhen you start a shell session you are, by default,\
    \ located in your home directory of the Linux file system. You can switch to any\
    \ directory to which you have access permission by stating its absolute address\
    \ as the argument to the cd command. Similarly, you can return to your home directory\
    \ by stating its absolute address as the argument to the cd command, or using\
    \ itstilde alias with the command cd ~.\n\nFor shorter hierarchical moves, the\
    \ command cd .. moves up one level to the parent directory of the current directory.\
    \ Stating just the name of an immediate sub-directory as the argument to the cd\
    \ command moves down one level to that sub-directory:\n\n+   Launch a shell window\
    \ when you enter the pwd command at the prompt to print the current working directory\n\
    \n+   Enter the combined command cd /etc; pwd to switch to the /etc directory\
    \ and confirm it as the working directory\n\n+   Next, enter the combined command\
    \ cd ~; pwd to return to the home directory and confirm the location\n\n+   Enter\
    \ the combined command cd ..; pwd to switch to the parent directory and confirm\
    \ the location\n\n+   Now, enter the combined command cd mike; pwd to switch to\
    \ the named sub-directory and confirm it\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_143_0.png)\n\
    \nThere must be space between the command and its argument.\n\n```\nmike@linux-pc:~$\
    \ pwd\n/home/mike\nmike@linux-pc:~$ cd /etc; pwd\n/etc\nmike@linux-pc:/etc$ cd\
    \ -; pwd\n/home/mike\nmike@linux-pc:~$ cd ..; pwd\n/home\nmike@linux-pc:/home$\
    \ cd mike; pwd\n/home/mike\nmike@linux-pc:~$ \n```"
  merge: -1
