  md: "# Controlling Processes\n\nA Linux system has many processes running at any\
    \ time representing open apps, shell jobs, and background services. Each process\
    \ has a unique PID (Process ID) number. We can see a list of every current process\
    \ with the ps -e command, or for a particular user, with ps -u followed by the\
    \ username. The process owner can terminate a process by stating its PID as the\
    \ argument to a kill command:\n\n+   - Open a Terminal window, then enter a command\
    \ to begin a new process – for example, to start the ftp internet file transfer\
    \ program\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_177_0.png)\n\nEnter the\
    \ command ftp to discover more about the ftp file transfer program.\n\n```\nmike@linux-pc:~\
    \ $ ftp speedtest.tele2.net\nConnected to speedtest.tele2.net.\n220 (vsFTPD 2.3.5)\n\
    Name (speedtest.tele2.net:net): anonymous\n331 Please specify the password.\n\
    Password:\n230 Login successful.\nRemote system type is UNIX.\nUsing binary mode\
    \ to transfer files.\nftp> \n```\n\n+   - Next, open a second Terminal window,\
    \ then enter the command ps -e to see a list of all processes\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_177_1.png)\n\
    \n```\nmike@linux-pc:~ $ ps -e\nPID TTY TIME CMD\n1 00:00:02 system\n2 00:00:00\
    \ kthread\n3 00:00:00 kworker/0:0\n4 00:00:00 me_percpu_wq\n5 00:00:00 kworker/u:0\n\
