  md: '# Downloading Content


    Linux distros typically include the Transmission BitTorrent Client to acquire
    content via the BitTorrent protocol. This lets you download directly from other
    groups of people – in which each person is called a "peer". Pieces of content
    from various peers are automatically assembled, making the BitTorrent protocol
    very efficient and reliable, particularly for large content files.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_0.png)


    The Transmission BitTorrent client first requires you to download a "torrent file"
    containing information about the content you wish to acquire. This can be found
    in a BitTorrent directory such as Public Domain Torrents (publicdomaintorrents.info),
    Internet Archive (archive.org), or Legit Torrents (legittorrents.info):


    +   1 Open the **Firefox** web browser and visit a BitTorrent directory, then
    select an item you would like to download


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_1.png)


    Torrent downloads are often associated with illegal downloads, but free open content
    can be legally downloaded.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_2.png)


    +   2 Choose to save the torrent file – by default to the **Downloads** folder
    within your home directory


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_3.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_4.png)


    The first time you launch the **Transmission** app a dialog appear in which you
    need to agree to share content responsibly.


    +   3 Click **Menu**, **Internet**, **Transmission** to launch the app


    +   4 Click the **Open** button on the Transmission toolbar – to open an "Open
    a Torrent" dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_5.png)'
  merge: -1
  pgno: 85
- img_proc: true
  md: '...cont''d


    5 Select the torrent file you downloaded and check the Show options dialog option


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_86_0.png)


    6 Click the Open button to open a "Torrent Options" dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_86_1.png)


    > Hot tip

    You can download multiple torrents simultaneously and click here to set each''s
    priority to Low, Normal, or High.


    7 Check the Download and Start when added options


    8 Click the Open button to start downloading the content


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_86_2.png)


    > Hot tip

    Click the Edit, Preferences menu to specify how your downloads should be managed.'
