  md: '# Adding Interaction


    LibreOffice apps allow interactive “form” controls to be added to documents –
    like those found in web forms. They allow the user to quickly produce a finished
    document by providing minimal input, and this is particularly useful when repeating
    the same document with differing data:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_103_0.png)


    +   1. In LibreOffice Writer, click **View, Toolbars, Form Controls** to open
    a “Form Controls” dialog, then click its **Design Mode** button to set it to **On**
    – so form controls can be added


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_103_1.png)


    +   2. Click the *Label Field* button on the “Form Controls” dialog, then drag
    the mouse on the document to create two labels – by default, these will each contain
    the text “Label Field"


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_103_2.png)


    +   3. Double-click on each label in turn to open their “Properties” dialog, and
    change the value of each *Label* property, then hit **Return** to see the label
    change


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_103_3.png)


    > Hot tip


    Right-click on a control, select **Position** and **Size** from the context menu,
    and choose **Anchor**, **To Paragraph** from the dialog that appears to allow
    easier positioning of the control.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_103_4.png)


    +   4. Click the **Text Box** button on the controls dialog, then drag the mouse
    on the document to create two text boxes'
  merge: -1
