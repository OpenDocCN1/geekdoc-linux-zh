  md: '# Exploring the Network


    In much the same way each house on a street has a unique address, every computer
    can be addressed for direct communication, every computer on a network has a unique
    number, known as its IP (Internet Protocol) address, which can be used to directly
    communicate with a particular computer.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_179_0.png)


    You can discover the IP address of the computer behind a web address by stating
    the URL as the argument to the host command. In some cases, for large-scale websites,
    this may reveal multiple IP addresses:


    +   1. At a shell prompt, enter host www.google.com to discover the IP address
    for that


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_179_1.png)


    Add a -a option to a host command to see all information about that host.


    ```

    mike@linux-pc:- $ host www.google.com

    www.google.com has address 216.58.289.94

    www.google.com has IPv6 address 2607:f8b0:4007::2004

    mike@linux-pc:- $

    ```


    The most basic test to see if another computer is reachable across the network
    sends tiny data packets to its IP address using the ping command. This continues
    sending test packets until you stop it, but may limit the number of packets by
    adding a -c option stating the total number of packets to send:


    +   2. Enter the command ping -c 3 216.58.209.4 to send three packets to this
    IP address — to see if it is reachable


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_179_2.png)


    The IP address used here is one of those for the Google URL - revealed by the
    host command in Step 1.


    ```

    mike@linux-pc:- $ ping -c 3 216.58.209.4

    PING 216.58.209.4 (216.58.209.4): 64 bytes of data.

    64 bytes from 216.58.209.4: icmp_seq=1 ttl=12.6 ms

    64 bytes from 216.58.209.4: icmp_seq=2 ttl=13.7 ms

    64 bytes from 216.58.209.4: icmp_seq=3 ttl=13.3 ms

    -

    216.58.209.4 ping statistics

    3 packets transmitted, 3 received, 0% packet loss, time 2003ms

    rtt min/avg/max/mdev = 12.638/13.238/13.724/0.456 ms\mike@linux-pc:- $

    ```'
  merge: -1
