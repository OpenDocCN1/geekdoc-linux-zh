  md: '# Doing Calculations


    Linux Mint includes a Calculator app that can perform different types of calculations
    and conversions. It provides a scrollable History View of your previous calculations
    so you can select a previous calculation to manipulate further.


    There are five modes available in the Calculator app in which you can enter basic
    equations, execute math and financial functions, and perform conversions of currency,
    size, and number base:


    +   1 Click Menu, Accessories, Calculator to launch the app in "Basic Mode"


    +   2 Enter some equations to see the result and see them get added to the History
    View area


