  md: '# # Adding Desklets


    Linux Mint offers a number of small apps ("applets") that run on the Desktop.
    These are similar to the Desktop widgets you may have seen in Windows but are
    called "Desklets" (Desktop applets) in Linux Mint. Three desklets are installed
    as standard, and you can download many more:


    +   1. Right-click anywhere on the Desktop wallpaper to open the context menu,
    then select **Add Desklets** – to open a "Desklets" settings window


    +   2. Next, select an installed desklet, such as the **Clock desklet**


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_31_0.png)


    You can click the **General Settings** button in the Desklets window to modify
    width and decoration aspects of your desklets.


    +   3. Now, click the + **Add** button to instantly add the desklet to your Desktop


    You can drag desklets around the Desktop to arrange them to your preference.'
