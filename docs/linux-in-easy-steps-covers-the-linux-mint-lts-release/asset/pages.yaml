  md: '# Handling Files


    All data files you create in Linux should only be saved in your home directory,
    or a sub-directory ("folder”). They can be revisited at any time using the Nemo
    file browser and can be easily copied, moved, renamed, or deleted:


    +   - Click on Menu, Accessories, Text Editor to launch a plain text editor, then
    type in some text and click the Save on the toolbar (or click the File, Save menu)


    +   - In the "Save As" dialog, double-click to open, then type a name for the
    text document (say, sample.txt) and click the Save button


    +   - Launch the Nemo file browser, then open the Documents folder that is located
    in your home directory and find the saved text file


    +   - Right-click on the file''s icon and choose Copy from the context menu –
    to copy that file to the "clipboard"


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_67_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_67_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_67_2.png)


    The clipboard is a memory buffer provided by the operating system and is used
    for short-term data transfer.


    Directories may contain hidden files – click the View, Show Hidden Files menu
    in the Nemo file browser to also show hidden files.


    +   Next, right-click on the Public folder within your home directory, then choose
    Paste Into Folder from the context menu to deposit a copy of the file'
