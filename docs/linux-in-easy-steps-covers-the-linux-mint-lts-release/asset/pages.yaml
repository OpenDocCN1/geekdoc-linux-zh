    button PrSc to immediately capture an image of your screen or use the Alt + PrSc
    key combination to immediately capture the currently-active window. Additionally,
    Linux Mint includes a Screenshot app that provides delay and other options – much
    like the Snipping Tool in Windows:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_135_0.png)


