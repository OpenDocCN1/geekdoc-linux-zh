  md: '...cont''d


    +   Use the Page Up and Page Down keys to scroll through the text in less mode,
    then press the > key to skip to the end of the text and hit the Q key to quit
    less mode


    The head command lets you preview the first 10 lines of a text file, and its companion
    tail command lets you preview the final 10 lines – great for skipping to the end
    of a long log file.


    You can also display text with added line numbers using the nl line count command
    that provides useful control over numbering. Its -v option specifies an integer
    at which to start numbering, and its -b option numbers only non-empty lines.


