  md: '# Printing from the Shell


    The lpr command takes a file name or path as its argument to establish a print
    job by send the specified file to the printer. Each job is placed in a queue awaiting
    transmission to the printer – when the job reaches the front of the queue, data
    from the file is sent to the printer and gets printed.


    You can examine jobs in the print queue with the lpq command – each job is automatically
    assigned a job number. A job can be removed from the queue, before it gets sent
    to the printer, using the lpr command together with its job number:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_181_0.png)


    +   At a shell prompt, enter lpr tux.png to create a print job – to print an image
    file named “tux.png”


    +   Enter lpr ballad.txt to create another print job – to print the specified
    text file “ballad.txt”


    +   Issue an lpq command to see the current print queue


    ```

    mike@linux-pc:~/Data

    File Edit View Search Terminal Help

    mike@linux-pc:~/Data lpr tux.png

    mike@linux-pc:~/Data lpr ballad.txt

    mike@linux-pc:~/Data lpq

    samsung-2028 is ready and printing

    Rank Job File(s) Total Size

    active mike 1 tux.png 57344 bytes

    ist 2 ballad.txt 22528 bytes

    mike@linux-pc:~/Data lpr 2

    mike@linux-pc:~/Data _|

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_181_1.png)


    The print queue reveals that the printer is actively printing job number one –
    the image file.


    +   Before print job number one completes, issue the command lpr 2 (or alternatively,
    the command cancel 2) to remove that job from the print queue


    The printer removes that job while continuing to the image file – the text file
    in job number two is not sent to the printer, so does not get printed.


    A print job can only be removed from the queue by its owner or the root supervisor.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# ...cont''d


    Printing from a shell prompt is not restricted to simply printing files – data
    can also be queued for printing using the lpr command together with the | pipe
    character:


    +   Enter ls -l /etc | lpr to print a list of the /etc directory – by piping results
    is truly and printing an ls command to the lpr command


    +   While the list is printing, issue an lpq command to see the print queue source
    is piped from standard input


    ```

    mike@linux-pc:~/Data

    mike@linux-pc:~/Data ls -l /etc | lar

    mike@linux-pc:~/Data lpq

    samsung-M2020 is roly and printing

    Rank Owner Job File(s) Total Size

    active mike 3 (stdin)

    mike@linux-pc:~/Data$

    ```


    The ability to print in Linux is provided by the CUPS (Common Unix Printing System)
    facility. This provides a print spooler, which buffers data in a format the printer
    will understand, and a scheduler, which sends the buffered data to the printer
    when it is ready to be received.


    The lpstat command has individual options to provide CUPS status information about
    the scheduler, spooler, and printer/s:


    +   Issue the command lpstat -t to see printer status


    ```

    mike@linux-pc:~/Data

    mike@linux-pc:~/Data lpstat -t

    scheduler is running

    system default destination: Samsung-M2020

    samsung-M2020 accepting requests since Thu 26 Jul

    sprint queue: samsung-M2020 now printing

    samsung-M2020-3 mike _

    mike@linux-pc:~/Data$

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_182_0.png)


    More than one printer is available, use lpr -P to nominate the printer to print
    the job.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Evaluating Expressions


    The expr command enables you to perform simple math calculations at the shell
    prompt. It recognizes all the usual arithmetic operators, but those that have
    other meanings in the shell need to be prefixed by a backslash escape character.
    For instance, the * wildcard must be escaped for multiplication.


    The arithmetic operators are + add, - subtract, * multiply, / divide, and % modulo.


    Each argument must be separated by whitespace, and parentheses can be used to
    establish order precedence in longer expressions - but each parenthesis character
    must be escaped.


    The expr command can also perform Boolean evaluations that return true (1) or
    false (0) answers, and perform simple string manipulation with functions length,
    substr, and index.


    +   * At a shell prompt, enter expr 7 + 3 to perform addition, and expr 7 * 3
    to perform multiplication


    +   * Enter expr 7 * \( 3 + 1 \) to evaluate a complex expression, and expr 7
    = 3 to make a Boolean equality evaluation


    +   * Issue the command expr length "Linux in easy steps" to discover the length
    of the specified string


    +   * Issue the command expr substr "Linux in easy steps" 7 13 to extract a substring
    of the specified string


    +   * Issue the command expr index "Linux in easy steps" "x" to discover the position
    of the first "x" in the string


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_183_0.png)


    You can quickly launch a graphical calculator from a Terminal window using the
    xcalc command.


    ```

    mike@linux-pc: ~ expr 7 + 3

    18

    mike@linux-pc: ~ expr 7 * \( 3 + 1 \)

    28

    mike@linux-pc: ~ expr 7 = 3

    0

    mike@linux-pc: ~ expr length "Linux in easy steps"

    19

    mike@linux-pc: ~ expr substr "Linux in easy steps" 7 13

    in steps

    mike@linux-pc: ~ expr index "Linux in easy steps" "x"

    5

    mike@linux-pc: ~ expr **

    ```'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# ...cont''d


    The result of an expression evaluation can be made to cause a particular action
    using if-then-else statement. This has three separate parts that specify a test
    expression, the action to perform when the test is true, and the action to perform
    when it is false.


    The if keyword identifies the statement and is followed by the expression enclosed
    within a pair of [] square brackets. Each part of the entire statement must be
    separated from the next by whitespace, to enable the shell to evaluate the expression.


    The then keyword begins the second part of the statement, specifying the commands
    to execute when the test is true. Similarly, the else keyword begins the third
    part of the statement, specifying the commands to execute when the test is false.
    Finally, the fi keyword must be added to the end of the statement.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_184_0.png)


    You must leave a space after the if keyword to avoid an error. Also leave a space
    after the [ bracket and before the ] to avoid an error.


    You may type the first part of the statement then Return to be prompted to enter
    the rest of the statement, or type the entire statement separating each part with
    a semicolon:


    +   Type if [ ''expr 7 % 2 '' = 0 ] to test if the remainder of dividing by two
    is zero, then hit Return


    +   At the statement prompt, enter then echo "Even Number"


    +   Now, enter else echo "Odd Number"


    +   Type fi then hit Return to perform the appropriate action


    +   Make a similar test in a continuous statement by typing if [ expr 8 % 2 =
    0 ]; then echo Even; else echo Odd; then hit Return to perform the appropriate
    action


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_184_1.png)


    The backtick ` operators enclose expr 7 % 2 so that operation gets performed before
    the test expression is evaluated - in this case, the remainder of 1 is substituted,
    making the expression if [ 1 = 0 ].


    ```

    @linux-pc:~\$ if [ expr 7 % 2 = 0 ]

    > then echo "Even Number"

    else echo "Odd Number"

    > fi

    Odd Number

    @linux-pc:~$ if [ expr 8 % 2 = 0 ]; then echo Even; else echo Odd;

    Even

    @linux-pc:~$ *

    ```'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Scripting the Shell


    Lengthy shell routines, like those on page 183, can be conveniently saved as a
    shell script for execution when required. Shell scripts are simply plain text
    files that begin their first line with #!/bin/bash, specifying the location of
    the bash program, and are typically given a .sh file extension.


    Once a shell script file has its access permission set to "executable" it can
    be executed at any time by prefixing its name or path with the ./ dot-slash characters
    at a shell prompt.


    A script might, perhaps, employ the RANDOM variable that generates an integer
    from zero to 32,767 each time it is called. These are not truly random, however,
    as the sequence is generated given the same starting point (seed) – in order to
    ensure different sequences, it is necessary to set it with different seeds.


    One solution is to extract a dynamic value from the current time using the date
    +%s command to deliver the current number of seconds that have elapsed since 00:00:00
    GMT January 1, 1970. Using this to seed the RANDOM variable gets better random
    number generation.


    Arithmetic can be performed on shell variables, such as $RANDOM, by including
    the let command in a script:


    +   - Open any plain text editor and begin a new file with the line #!/bin/bash


    +   - On a new line, type to seed the $RANDOM variable RANDOM= date +%s


    +   - Add a line to assign a value 1-20 to a variable let NUM=$ ($RANDOM % 20
    + 1)


    +   - On the next line, type an instruction to clear the window clear


    +   - Add these lines to output text for the user echo "I have chosen a number
    between 1 and 20" echo "Can you guess what it is?”


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_185_0.png)


    Hot tip

    Enter RANDOM=1 whennecho $RANDOM three times to see the pattern.

    Repeat both commands to see the pattern repeat.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_185_1.png)


    Don''t forget

    nYou must not introduce whitespace around the = = character in the assignments.'
  merge: -1
  pgno: 185
