  md: '# Getting More Apps


    In addition to the apps that are supplied with your Linux distro, there are many
    free apps that can be easily installed. The Linux Mint distro includes a Software
    Manager utility app that lets you search for more apps by name or by category.
    When you select an app, there is a description and screenshot accompanied by user
    reviews that help you decide if you want to install that app:


