  md: '# # Handling Archives


    The traditional file compression tool in Linux uses the gzip command to compact
    one or more files into a single archive – adding a ".gz" file extension and replacing
    the original files. Its companion bzip2 can be used to extract files from an archive
    created with gzip – replacing the compressed archive:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_169_0.png)


    +   1. Enter du -b ele to learn the byte size of local files whose names begin
    “ele” – in this case it is named ele.txt


    +   2. Next, enter gzip elegy.txt to create a compressed archive of that file
    – named with an added ".gz" file extension


    +   3. Now, use a further du -b ele to compare the file size of the compressed
    archive to the original file


    +   4. Enter gunzip elegy.txt to extract the original file


    ```

    mike@linux-pc:~$ du -b ele

    6239 elegy.txt

    mike@linux-pc:~$ gzip elegy.txt

    mike@linux-pc:~$ du -b ele

    3693 elegy.txt

    mike@linux-pc:~$ gunzip elegy.txt

    mike@linux-pc:~$ ele

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_169_1.png)


    A bzip2 archive file size is smaller than gzip and zip archives – notice the size
    of the archives in these examples.


    The modern bzip2 compression tool gets better compression than gzip but is less
    widely used – distributing bzip2 archives may not find universal acceptance. It
    works like the gzip tool, but adds ".bz" file extension and has a companion bzip2
    uncompressor:


    +   5. Enter du -b ele to learn the byte size of local files whose names begin
    “ele” – in this case it is named ele.txt


    +   6. Next, enter bzip2 elegy.txt to create a compressed archive of that file
    – named with an added ".bz" file extension


    +   7. Now, use a further du -b ele to compare the file size of the compressed
    bzip2 archive to the original file'
