  md: '# Creating Visualizations


    The LibreOffice suite includes an accomplished drawing tool that can be launched
    from any LibreOffice app to quickly create drawings, charts, diagrams and graphs:


    +   From any LibreOffice app, click File, New, Drawing or click Menu, Format,
    LibreOffice Draw to launch the app


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_99_0.png)


    +   Click the arrowed button beside the Insert Basic Shapes on the Drawing toolbar,
    then choose the rounded rectangle object from the selection offered


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_99_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_99_2.png)


    If the Drawings toolbar is not immediately visible, click View, Toolbars, Drawing
    to make it appear.


    +   Drag the mouse in the drawing area to create a rectangle and press Ctrl +
    C to copy the object, then press Ctrl + V five times to make more rectangles on
    top of the first


    +   Drag the rectangles to separate areas, then click the Connector button on
    the Drawing toolbar


    +   Click on a rectangle, then drag to another rectangle to create connecting
