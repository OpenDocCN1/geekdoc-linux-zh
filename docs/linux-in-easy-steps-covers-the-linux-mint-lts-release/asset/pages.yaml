  md: '# The Evolution of Linux


    In 1983 a visionary programmer named Richard Stallman began a movement called
    the GNU Project. His philosophy was that software should be free from restrictions
    against copying or modification in order to make better and more efficient programs.
    This inspired programmers around the world to create programs driven by efficiency
    rather than by financial incentive.


    By 1991 the GNU Project had created a lot of software tools including the GNU
    Compiler written by Stallman. At that time many of these tools were incorporated
    into a Unix-compatible operating system by a 21-year old student at the University
    of Helsinki. His name was Linus Torvalds and he named the operating system Linux
    (Unix).


    Linux was made available for download on the internet so other programmers could
    test and tweak the source code, then return to Linus Torvalds. After a period
    of enthusiastic development, Linux 1.0 was made available globally by the GNU
    General Public License, which ensured it would remain free.


    Programmers were keen to explore Linux and found some uses for it. In April 1996,
    researchers at Los Alamos National Laboratory used Linux to run 68 PCs as a single
    parallel processing machine to simulate atomic shock waves. At $150,000 this supercomputer
    cost just-tenth the price of a comparable commercial machine. It reached a peak
    speed of 19 billion calculations per second, making the 315th most powerful supercomputer
    in the world. It proved to be robust – three months later it still had not tive
    been rebooted.


    Linux continued to grow in popularity as a text-based operating system, while
    Windows became the dominant graphical desktop operating system. Recognizing that
    most PC want the point-and-click convenience of a graphical environment, the Linux
    camp began to develop a system comparable to the Windows desktop.


    From a handful of enthusiasts in 1991 to millions of users now - Linux has come
    of age. Today''s K Desktop Environment (KDE) and the Gnome desktop environment
    now offers a user-friendly alternative for Windows users – Linux for the desktop!


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_10_0.png)


    The term "GNU" is a recursive acronym for GNU''s Not Unix.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_10_1.png)


    Discover more about the GNU General Public License online at gnu.org/licenses/gpl.html


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_10_2.png)


    Discover more about the Gnome desktop environment online at gnome.org'
  merge: -1
