  md: "# cont'd\n\nDirectories can be removed in the shell using the rmdir command.\
    \ This takes the directory name as its argument and will instantly remove an empty\
    \ directory, but will simply warn you that the directory is not empty if it contains\
    \ files.\n\nHaving to delete files manually, one by one, may provide safeguards\
    \ but can be tedious. An intelligent alternative is available by using the recursive\
    \ interactive -ri option of the rm command. This steps into the directory and\
    \ examines every file—requesting your confirmation before deleting each file.\
    \ When all files have been deleted it then asks if you want to delete the directory:\n\
    \n![](img/7b6ecabd34062cd153290258f3b9cd5b_146_0.png)\n\nYou can use a -v option\
    \ with both the rmdir command and the rm command to produce verbose output— describing\
    \ what is happening.\n\n+   6 Launch the Text Editor using the xed command, and\
    \ create three text files in the “Sub2” directory\n\n+   7 Issue the command rmdir\
    \ Sub1 to remove the empty “Sub1” directory\n\n+   8 Now, issue the command rmdir\
    \ Sub2 to attempt to remove the non-empty “Sub2” directory\n\n+   9 Enter the\
    \ command rm -ri Sub2 to interactively delete the files within the “Sub2” directory,\
    \ and remove the directory itself, by replying “Y” (yes) to each question\n\n\
    ![](img/7b6ecabd34062cd153290258f3b9cd5b_146_1.png)\n\n```\nmike@linux-pc:~/ \n\
    File Edit View Search Terminal Help\nmike@linux-pc:~$ rmdir Sub1\nSub1\nmike@linux-pc:~$\
    \ rmdir Sub2\nrmdir: failed to remove 'Sub2': Directory not empty\nmike@linux-pc:~$\
    \ rm -ri Sub2\nrm: Descend into directory 'Sub2'? Y\nrm: remove regular file 'Sub2/file-2.txt'?\
    \ Y\nrm: remove regular file 'Sub2/file-1.txt'? Y\nrm: remove regular file 'Sub2/file-3.txt'?\
    \ Y\nrm: remove directory 'Sub2'? Y\nmike@linux-pc:~$ \n```\n\nIf you are feeling\
    \ brave, and are absolutely certain that the directory contains nothing you will\
    \ miss, you can use the rm command with just a -r option to instantly delete a\
    \ directory and its entire contents — use with care!"
