    ![](img/7b6ecabd34062cd153290258f3b9cd5b_172_0.png)


    Here used hard drive systems are mounted on /dev/sda1 and /dev/sdb1 were automatically
    mounted on the Linux tree during the boot process, and the media drive file system
    on /dev/sda2 was automatically mounted when the flash drive was inserted into
    the device port. A file system can be manually unmounted using the unmount command
    to perform performance without it fear of file corruption. For instance, the root
    superuser can run the fsck file system check command to check for integrity and
    errors:


    See that there are many items of the "tmpfs" type, but these are merely temporary
    file system storage facilities in volatile memory. Only the highlighted items
