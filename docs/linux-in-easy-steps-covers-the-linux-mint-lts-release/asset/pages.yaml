  md: '# Choosing a Distro


    At the very heart of Linux is a bunch of tried-and-tested code called the "kernel".
    The kernel provides the operating system with its core functionality, like the
    engine in a car. It takes care of the basics, such as helping other programs access
    hardware and sharing your computer''s processor among various programs.


    In addition to the kernel, Linux contains a number of system-level programs, such
    as the services to handle your email, web connection and bootloader. Consider
    these as the car''s transmission, gears, and chassis – without them, the engine
    is not much use.


    Linux distributions generally also include a large number of user-level programs
    – the applications for daily use: for instance, browsers, word processors, text
    editors, graphics editors, media players, and so on. These are the finishing touches
    to the car that ensure a great ride – whitewall tires and soft leather upholstery.


    All of these components are bundled together in a variety of Linux distribution
    packages, commonly referred to as "distros” – just as all the components of a
    car are bundled together to make a complete car.


    In the same way that there are many makes and models of cars, there are many Linux
    distros to choose from. Some of the best known distros are RedHat Fedora, SUSE,
    Ubuntu, and Mint. Each distro has its own installer and unique default configuration
    according to what the distributor considers to be the best arrangement. The ideal
    one for you will depend on your own preferences and how you want to use Linux.
    The most popular distros are described below to help you choose:


    # RedHat Fedora


    One of the most publicized Linux distros, comprising the commercial RedHat Enterprise
    Linux product line and the Fedora distro that is developed by the Fedora Project
    community. There are several editions of the Fedora distro – “Workstation” for
    PCs, “Server” for servers, and “Atomic” for cloud computing.


    **Pros:** Widely used, excellent community support, innovative.

    **Cons:** Limited product life-span of Fedora editions, poor multimedia support.


    Free download from getfedora.org


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_11_0.png)


    Most Linux distros are available as a “live” version that lets you run Linux from
    a disk – so you can try it without installing Linux onto your hard drive.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_11_1.png)


    > Choose Freedom.

    Choose Fedora."'
