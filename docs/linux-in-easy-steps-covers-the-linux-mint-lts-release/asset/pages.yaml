  md: '# Understanding Permissions


    In Linux each file and directory has an “Owner” – generally, this is the user
    who created it. The Owner has full permission to read the file, write to the file,
    and to execute the file (if it''s executable).


    The Owner may also set permissions to specify if other users can read, write,
    and execute the file. The file''s accessibility can be restricted to the Owner,
    to a “Group” of which the owner is a member, or to any of the system (“Others”).


    Permission settings of a file can be found on the Permissions tab of its Properties
    dialog:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_73_0.png)


    When a user account is created, a **Group** of the same name is also created –
    of which that user is a member.


    +   1. Right-click on a file, then choose the **Properties** item from the context
    menu – to launch the “Properties” dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_73_1.png)


    example.txt Properties

    | Permissions | Open With | Emblems |


    | Type | Text (2/plain) |

    | Size | 27 bytes |

    | Location | Home/Mike/Documents |

    | Volume | unknown |

    | Accessed | Wed 01 Aug 2018 12:00:00 PM EEST |

    | Modified | Wed 01 Aug 2018 12:00:00 PM EEST |


    You can select the **Emblems** tab to add a symbol to the file icon – for example,
    denoting the file as important.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_73_2.png)


    +   2. Click on the **Permissions** tab to view the current settings


    Here, the **Owner** and **Group** have “Read and write” permission, but **Others**
    have “Read-only” permission.


    example.txt Properties

    | Basic | Open With | Emblems |


    | Owner | Mike McGrath |

    | Access | Read and write |

    | Group | mike |

    | Access | Read and write |

    | Access | Read-only |

    | Execute | Allow executing file as program |

    | Last changed | Wed 01 Aug 2018 12:00:00 PM EEST |'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'Usually the Owner, Group and Others will have permission to at least read the
    file. If you are the owner of the file, the Owner will have permission to write
    – and to execute the file if it''s executable.


    As the owner of the file you can use the arrow buttons to change the access permissions
    of this file:


    +   Click the arrow button in the “Others” field, then choose None from the drop-down
    menu to restrict access to the Owner and Group members


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_74_0.png)


    If you need to change permissions on files where you are not the owner, you need
    superuser status – see page 164 for details.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_74_1.png)


    Checking this option makes the file executable for those users who have permission
    to access it.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_74_2.png)


    +   Click on the Open With tab if you would also like to change the default app
    that opens this file


