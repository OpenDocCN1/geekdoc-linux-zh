  md: '# Streaming Content


    The VLC media player is a powerful cross-platform media player for audio and video.
    It can also be used to stream media across your network. This means you can broadcast
    media and video from your Linux PC to other devices connected to your Wi-Fi router:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_123_0.png)


    +   - Click Menu, Administration, Terminal to open a window at a command prompt


    +   - Enter the command ifconfig to discover the IP address assigned to your PC
    on the network


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_123_1.png)


    If you get a message "VLC is unable to get the MRL" when trying to open a network
    stream it may be that your firewall is blocking it. In Linux Mint, click Menu,
    Preferences, Firewall Configuration then add a rule to allow VLC to stream media.


    +   - Click Menu, Sound, VLC media player to launch the app, then click Media,
    Stream to open "Open Media" dialog


    +   - Click the Add button and select a video file to stream, then click the stream
    button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_123_2.png)


    +   - See that the Source is selected, then click the Next button'
  merge: -1
  pgno: 123
- img_proc: true
  md: '...cont''d


    +   6 Set the destination to HTTP, then click the Add button


    +   7 Notice that the default port is 8080, then click Next


    +   8 Uncheck the Activate Transcoding option, then set the “Profile” to the selected
    file''s format and click Next


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_124_0.png)


    > Transcoding to MP4 format is not required here, as the video file is already
    in that format.


    +   9 Click the Stream button to broadcast the video


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_124_1.png)


    > The IP address of your PC will most likely differ from the address used in this
    example.


    +   10 Open the VLC app on another network device, then enter the IP address and
    port of the broadcasting PC to open the network stream


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_124_2.png)


    > This is the VLC Universal app on a network PC running Windows 10 receiving the
    stream from the Linux PC.'
