  md: '# Reading Text Files


    The simplest way to view a text file in the shell is with the cat command. Just
    state one or more arguments and it will display their content, concatenating the
    text together. Viewing one or two small text files will fit comfortably in a single
    window so you will see the entire text. Larger files, however, will exceed the
    space in a single window so you will only see the final part of text. The solution
    is to send the text stream to less command via the "|" pipe operator. This means
    that the text is displayed one screen at a time, starting from the


    +   * At a shell prompt, enter cat quote1.txt quote2.txt to display the content
    of two text files on standard output


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_155_0.png)


    You can use a -n option with the cat command to number each line in standard output


    ```

    mike@linux-pc:~/Data

    File Edit View Search Terminal Help

    mike@linux-pc:~/Data cat quote1.txt quote2.txt

    [ At The New York custom home ]

    I have nothing to declare except my genius.

    [ huge fee for an operation was mentioned ]

    I suppose I have to die by my means.

    mike@linux-pc:~/$ cat ballad.txt | less

    ```


    +   * Now, type cat.txt | less then hit Return to display the file contents in
    less mode - in which a ": prompt appears above the content text where you can
    enter special less mode commands to display select text


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_155_1.png)


    The "less" facility offers many great options – press the H key in less mode to
    see them all.


    ```

    mike@linux-pc:~/Data

    File Edit View Search Terminal Help

    The Ballad of Reading Good by Oscar Wilde

    I

    H did not wear his scarlet coat,

    For blood and wine are red.

    And blood and wine were on his hands

    When they found him with the dead,

    The poor woman whom he loved,

    And murdered in her bed.

    ```'
