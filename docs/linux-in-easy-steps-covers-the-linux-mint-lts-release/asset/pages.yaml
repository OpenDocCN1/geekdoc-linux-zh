  md: '# Setting Access Permissions


    The ls -l long command reveals the access permissions of each item in the current
    directory as a string of 10 characters at the start of each line. The first is
    a d for a directory, or a dash for a file, followed by sequential Read (r), Write
    (w) and Execute (x) permissions for the owning User, Group, and Others. In the
    listing below, a script may be Read and Executed by everyone and the owner may
    also Write to it. The owner can both Read and Write a text notes may only Read.
    Other text files may be Read or Written to by their respective owners.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_175_0.png)


    Notice that this is a member of the group named "fund" that was created on page
    173.


    ```

    mike@linux-pc:~# mkdir mike

    mike@linux-pc:~$ ls -lt

    total 26

    -rw-r--r-- 1 tony 34 Jul 26 07:49 toni-scripts

    -rw-xr-x 1 andy 48 Jul 26 07:48 andy-notes

    --rw-r--r-- 1 dave 44 Jul 26 07:47-dave-notes

    -rw-r--r-- 1 mike 30 Jul 26 07:47 mike-notes

    -rw-r--r-- 1 tony 37 Jul 26 07:46 toni-notes

    mike@linux-pc:~$ cat tony-notes

    Here are Toni''s notes to remember...

    mike@linux-pc:~$ cat dave-notes

    cat: Permission denied

    caty-notes: Permission denied

    Here are Mike''s thoughts of the day...

    mike@linux-pc:~$

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_175_1.png)


    See page 72 for more on access permissions.


    Each set of permissions can also be described numerically Read = 4, Execute =
    1. For instance, a value of 7 describes permissions to Read, Write and Execute
    (4 + 2 + 1), 6 describes permissions to Read, Write Execute (4 + 2), and so on.


    Permissions can be changed at a shell prompt with the chmod command, stating the
    permission values and the file name as its arguments. For example, the command
    chmod 777 myfile sets full permissions for a file named "myfile". You must first
    root superuser with the sudo command if you are not the owner. The chgrp command
    can be used to change the group membership of a file by stating the group name
    and the file name as its arguments. Similarly, the chown command can specify a
    username and the file name to change the user ownership.'
  merge: -1
