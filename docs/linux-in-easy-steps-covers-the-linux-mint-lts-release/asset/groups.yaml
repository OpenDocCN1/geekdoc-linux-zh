    ## Creating Presentations


    The presentation app that is part of the free LibreOffice suite provides the ability
    to easily produce great slideshows. It also allows presentations to be saved in
    the format compatible with Microsoft PowerPoint (.ppt).


    - 1. Click Menu, Office, LibreOffice Impress to launch the app with a new blank
    presentation

    - 2. A “Select a Template” dialog should also appear when you launch the app –
    select a template, such as Lights


    If the “Select a Template” dialog does not appear when you launch the app, click
    the File, Close menu to close the blank presentation, then select Templates in
    the “backstage” window.


    - 3. Select how you want the content grouped from an option in the “Layouts” pane,
    such as Title and 2 Content


    If the “Layouts” pane is not immediately visible, click View, Slide Layout to
    make it appear.


    Click on the “Click to add Title” box, then type a title


    Click Format, Align, Center to position the title


    Next, type some narrative text in the left “Click to add Text” box


    Click on the right “Click to add Text” box, then click Insert, Image to launch
    an “Insert Image” dialog


    Choose an appropriate image to add to the slide, then use the grab handles around
    the image to adjust its size to your liking


    Right-click this slide in the “Slides” pane, then choose New Slide with the same
    template and layout – make further slides to complete the presentation


    Click Slideshow, Start from First Slide (or press F5) to run the presentation


    Click File, Save (or press Ctrl + S) to launch the “Save” dialog, then type a
    presentation name in the Name field


    Click the arrow file button to open a list of possible formats – accept the default
    ODF Presentation format (.odp) or choose Microsoft PowerPoint 2007-2013 XML (.pptx)


    You can switch to “Master Slide View” where you can add elements to appear on
    all slides. Slides you have created in Master Slide View, are not visible, so
    it looks like they have disappeared. Click View, Normal to continue working on
    your slides.


    The “Slides” pane is not immediately visible, click View, Slide Pane to make it
    appear.


    ## Creating Visualizations


    The LibreOffice suite includes an accomplished drawing tool that can be launched
    from any LibreOffice app to quickly create drawings, charts, diagrams and graphs:


    - From any LibreOffice app, click File, New, Drawing or click Menu, Format, LibreOffice
    Draw to launch the app

    - Click the arrowed button beside the Insert Basic Shapes on the Drawing toolbar,
    then choose the rounded rectangle object from the selection offered


    If the Drawings toolbar is not immediately visible, click View, Toolbars, Drawing
    to make it appear.


    - Drag the mouse in the drawing area to create a rectangle and press Ctrl + C
    to copy, then press Ctrl + V five times to make more rectangles on top of the
    first

    - Drag the rectangles to separate areas, then click the Connector button on Drawing
    toolbar

    - Click on a rectangle, then drag to another rectangle to create lines

    - Now, click the Text button and label each rectangle


    Drawings can be saved in the native ODF (Open Document Format), Drawing (.odg),
    or exported in a variety of image formats such as PNG (.png), GIF (.gif), and
    SVG (.svg).


    Click the Insert, Chart menu to add a default bar chart to the drawing area –
    a chart toolbar also appears


    On the Formatting menu, click the Data button and modify the default values in
    the “Data” dialog that appears, then close that dialog


    The chart toolbar can be launched from the View, Toolbars menu after you have
    inserted a chart.


    Click the Chart Type button to launch a “Chart Type” dialog, then choose Line
    in the left-hand pane and Points and Lines as the type of chart


    Click the OK button to close the “Chart Type” dialog and apply the chosen line
    style


    To insert an existing chart into a document, click Insert, Object, OLE Object
    – to insert the default editable chart just Insert, Chart.


    ## Running Macros


    A “macro” is a recorded sequence of keystrokes stored with a given name. Running
    a macro replays the sequence, writing into the correct document. This is particularly
    useful for recreating frequently-typed text within spreadsheets in LibreOffice
    Calc and within text documents in LibreOffice Writer:


    Launch Writer, then click Tools, Options, LibreOffice, Advanced and check the
    Enable macro recording option


    A Runtime Environment JRE is required on the Linux system to run macros. Linux
    Mint includes the OpenJDK Runtime for Java, but you may need to install a Java
    Runtime Environment on other distros.


    - 2 Next, click Tools, Macros, Record Macro to begin recording – a small window
    appears, bearing a Stop Recording button

    - 3 Click the Text button on the toolbar, type your address

    - 4 Click the Stop Recording button in the small window, then see a “Basic Macros”
    dialog appear

    - 5 In the Macro Name text field, replace the name “Main” by the name “Address”,
    then click the Save button


    To run this macro at any time, first click Tools, Macros, Run Macro to launch
    a “Macro Selector” dialog


    Select the Address macro from My Macros. Standard, Calc Module1, then click the
    Run button to write your address


    The macro recorder only records actions relating to document content in the window
    where it started, and it only works with the LibreOffice Writer and Calc apps.


    To edit this macro, click Tools, Macros, Edit Macros to launch a “Macros” dialog,
    then select the Address macro to see the code behind the macro actions


    Locate the text values describing your address, then replace them with different
    values and click File, Save to apply the changes


    Click on Tools, Macros, Organize Macros, LibreOffice Basic, then select an existing
    macro and use the Delete button to remove it.


    Finally, repeat steps 6 and 7 to run this macro once more and see the modified
    address written


    ## Adding Interaction


    LibreOffice apps allow interactive “form” controls to be added to documents –
    like those found in web forms. They allow the user to quickly produce a finished
    document by providing minimal input, and this is particularly useful when repeating
    the same document with differing data:


    - 1. In LibreOffice Writer, click View, Toolbars, Form Controls to open a “Form
    Controls” dialog, then click its Design Mode button to set it to On – so form
    controls can be added

    - 2 Click the Label Field button on the “Form Controls” dialog, then drag the
    mouse on the document to create two labels – by default, these will each contain
    the text “Label Field”

    - 3 Double-click on each label in turn to open their “Properties” dialog, and
    change the value of each Label property, then hit Return to see the label change


    Right-click on a control, select Position and Size from the context menu, and
    choose Anchor, To Paragraph from the dialog that appears to allow easier positioning
    of the control.


    - 4. Click the Text Box button on the controls dialog, then drag the mouse on
    the document to create two text boxes

