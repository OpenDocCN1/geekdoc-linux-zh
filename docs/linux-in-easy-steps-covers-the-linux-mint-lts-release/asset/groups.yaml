  - '[PAGE 59]


    # # Meeting the Directory Tree


    When moving from Windows, the new Linux user needs to be aware of some differences
    between the two operating systems:


    +   - Linux is case-sensitive – Windows is not. For instance, files named "readme.txt"
    and "README.txt" are seen as two different files in Linux, but there is no distinction
    in Windows.


    +   - Linux directories and files have ownership permissions that can restrict
    accessibility to the owner or group – Windows directories and files are generally
    universally accessible.


    +   - Linux was developed as a multi-user operating system – Windows evolved from
    MS-DOS (Microsoft Disk Operating System) as a single-user home system.


    +   - Linux users cannot change system settings; the "root" Super User may do
    – Windows desktop users have free reign to wreak havoc.


    +   - Linux partitions are created using the Ext4 filesystem – Windows partitions
    use FAT, FAT32 and NTFS filesystems.


    +   - Linux paths contain forward slash characters – Windows path names contain
    backslash characters: for instance, a Linux path /home/mike and a Windows path
    C:\Users\


    +   - Linux does not have any drive letters – Windows typically uses C: for the
    hard disk drive, D: for the optical drive, E: for an external drive, and so on.


    The lack of drive letters in Linux indicates what is, probably, the biggest difference
    between Linux and Windows – the way their directory structures are arranged. In
    Linux everything is contained within a single unified hierarchical system – beginning
    with the "root" directory, symbolized by a single forward slash "".


    The Linux installation creates a number of standard directories within the root
    directory. Each one of them, in turn, houses its own sub-directory structure,
    thereby creating a directory "tree" – the "root" directory of / is the root of
    the tree.'
  - '[PAGE 60]


    Contents of peripheral drives appear in the tree at which they are “mounted” by
    Linux, creating a unified structure. The table below lists the directory structure
    of the Linux Mint file system. All are sub-directories of the basic root directory
    “/”.


    # Root of the file system hierarchy


    | Directory | Description |

    | --- | --- |

    | /bin | Essential binaries |

    | /boot | Static boot files |

    | /cdrom | Historical mount point |

    | /dev | Device files |

    | /etc | Configuration files |

    | /home | User home folders |

    | /lib | Library files (32-bit) |

    | /lib64 | Library files (64-bit) |

    | /lost+found | Recovered files |

    | /media | Removable media |

    | /mnt | Temporary mount point |

    | /opt | Optional packages |

    | /proc | Kernel and process files |

    | /root | Root user home folder |

    | /run | Application state files |

    | /sbin | System binaries |

    | /srv | Service data |

    | /sys | Virtual file system |

    | /timeshift | Backup files |

    | /tmp | Temporary files |

    | /usr | User binaries |

    | /var | Variable data files |


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_60_0.png)


    > Beware

    Dont confuse the /root directory (the home directory of the root superuser) with
    the /root of file system.


    The purpose of each standard Linux directory is described in more detail on the
    ensuing pages of this chapter.'
- md: '

    ## Recognizing Directories


    ## /bin

    Contains small executable programs (binaries) that are required when your PC boots
    up, and programs that execute basic commands. This directory is roughly equivalent
    to the C:\Windows directory in Windows.


    ## /boot

    Contains important files required when your PC boots up and also the Linux kernel
    itself – the heart of the operating system. The kernel controls access to all
    the hardware devices your computer supports, and allows multiple programs to run
    concurrently and share that hardware.


    ## /cdrom

    This is historically a directory in which CD-ROMs inserted into the system were
    mounted – the standard location is now /media.


    ## /dev

    Special file system entries that represent devices that are attached to the system.
    These allow programs access to the device drivers that are essential for the system
    to function properly although the actual driver files are located elsewhere. The
    entry /dev/sda represents the first hard drive on your PC.


    ## /etc

    Contains system configuration files storing information about everything from
    user passwords and system initialization to screen resolution settings. These
    are plain text files that can be viewed in a text editor. The files in this directory
    are roughly equivalent to the combination of .ini files and the Registry entries
    found in the Windows operating system.


    ## /home

    Contains a sub-directory for each user account to store personal data files. If
    there is a user account named "mike" there will be a /home/mike directory where
    that user can store personal files – other users cannot save files. This directory
    is where you store all your working documents, images, and media files.


    ## /lib

    Contains 32-bit library files that are used by the executable programs in the
    /bin and /sbin directories. These shared libraries are particularly important
    for booting the system and executing commands within the root file system. They
    are roughly equivalent to the .dll (Dynamic Link Libraries) in Windows.


    ## /lib64

    Contains 64-bit library files that are used by the executable programs in the
    /bin and /sbin directories.


    ## /lost+found

    Contains misplaced files that may be corrupted, but from which data can still
    be recovered.


    ## /media

    This is a directory in which removable media inserted into the system gets mounted.
    When you connect a USB flash drive to your PC a sub-directory, such as /media/flash-drive,
    is created.


    ## /mnt

    This is a directory in which the system administrator can temporarily mount an
    additional file system.


    ## /opt

    /opt contains nothing initially, but this directory provides a special area where
    optional add-on software packages can be installed. If “example” is the name of
    a particular software package in the /opt directory, then all its files could
    be placed within sub-directories of an /opt/example directory.


    ## /proc

    /proc contains special files that relay information to and from the kernel. The
    hierarchy of “virtual” files within this directory represents the current state
    of the kernel. Unlike binary and text files, most virtual files are listed as
    zero bytes in size and are stamped with the current date and time. This reflects
    the notion that they are constantly updating.


    ## /root

    /root is the home directory of the root account superuser – for security reasons
    regular users cannot access this directory.


    ## /run

    /run contains transient files required by applications at runtime to supply data
    such as process IDs.


    ## /sbin

    /sbin contains executable system programs (binaries) that are only used by the
    root superuser and Linux when the system is booting up or performing system recovery
    operations. For instance, the clock program that maintains the system time when
    Linux is running is located in the /sbin directory. This directory is roughly
    equivalent to the C:\Windows\system directory in Windows.


    ## /srv

    Contains files that supply data for services provided by the system.


    ## /sys

    This is a virtual file system that stores the kernel''s view of the system and
    of the devices connected to the system.


    ## /timeshift

    Contains backup snapshots of the system taken at intervals specified by the Timeshift
    app.


    ## /tmp

    Contains temporary files that have been created by running programs. Most these
    are deleted when the program gets closed, but some do get left behind - periodically
    these should be deleted. This directory is roughly equivalent to the C:\Temp directory
    in Windows.


    ## /usr

    Contains sub-directories storing programs that can be run by any user of that
    system: for instance, games, word processors and media players. This directory
    is roughly equivalent to the C:\Program Files directory in Windows.


    ## /var

    Contains variable data files that store information about ongoing system status,
    particularly logs of system activity. The system administrator (root superuser)
    can type more /var


    ## Navigating with Nemo

    The standard directories can be viewed graphically. In Linux Mint, Nemo can be
    launched by clicking the "Files" icon on the desktop.


    - Click on the "Files" icon on the desktop

    - Click the Home item in the sidebar to navigate to the user''s home directory

    - Click the [] button to reveal the location field, and type the address of the
    user''s home directory (in this case /home), then hit Return

    - Type the user''s home directory (in this case /home/mike), then hit Return to
    navigate to the home directory


    ## Handling Files

    All data files you create in Linux should only be saved in your home directory,
    or a sub-directory (“folder”). They can be revisited at any time using the Nemo
    file browser and can be easily copied, moved, renamed, or deleted:


    - Click on Menu, Accessories, Text Editor to launch a plain text editor, then
    type in some text and click the Save on the toolbar.

    - In the "Save As" dialog, double-click to open, then type a name for the text
    document (say, sample.txt) and click the Save button.

    - Launch the Nemo file browser, then open the Documents folder that is located
    in your home directory and find the saved text file.

    - Right-click on the file''s icon and choose Copy from the context menu – to copy
    that file to the "clipboard".

    - Next, right-click on the Public folder within your home directory, then choose
    Paste Into Folder from the context menu to deposit a copy of the file.

