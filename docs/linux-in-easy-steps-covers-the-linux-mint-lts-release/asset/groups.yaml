    Many Linux distros include a simple Image Viewer that can zoom and scroll. In
    Linux Mint you can find its launcher in the Accessories category, usually you
    will launch it from a right-click menu:


    1. Drag the mouse over image icons to select them, then right-click and choose
    Open with Viewer.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_109_0.png)


    You can also double-click on any file icon to instantly open that image in Image
    Viewer.


    2. See the Image Viewer launch, displaying the first image.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_109_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_109_2.png)


    You can use your mouse to zoom too. Place the cursor over an image in Image Viewer
    then use the mouse wheel to zoom in and out.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_109_3.png)


    Click the Forward button to view all the selected images, or click View, Slideshow
    to view them full-screen.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_110_0.png)


    A full-screen slideshow displays each image for five seconds, but you can change
    this with Edit, Preferences, Slideshow. Click Esc to quit a running slideshow.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_110_1.png)


    Click View, Image Gallery to open a scrollable gallery pane within the Image Viewer
    window.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_110_2.png)


    You can convert images to different file formats using the image gallery. Press
    Ctrl + A to select all images in the gallery, then click File, Save As and choose
    the preferred file format in the dialog.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_110_3.png)


    Scroll to an image, click File, Set as Wallpaper to make that image your Desktop
