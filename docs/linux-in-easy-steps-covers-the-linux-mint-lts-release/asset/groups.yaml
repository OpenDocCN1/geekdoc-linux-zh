    ![](img/7b6ecabd34062cd153290258f3b9cd5b_141_1.png)热点提示

    你可以在本系列的配套书籍中学习更多 Bash 的知识：Bash 入门。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_141_2.png)选项并不是标准化的——同一个选项在不同命令中具有不同的含义。


    img/7b6ecabd34062cd153290258f3b9cd5b_141_3.png)上面的终端窗口显示了默认 bash 命令提示符，并将光标放在提示符之后——准备接收命令。默认提示符包含当前用户名（mike）、分隔符
    (@）、主机域名名（linux-pc）、当前目录 (~ 波浪号字符表示主目录）以及最后的终止字符 ($)。


