    ## 进行计算


    Linux Mint 包含一个计算器应用 (Calculator)，它可以执行不同类型的计算和转换。它提供了一个可滚动的历史视图 (History View)，你可以选择之前的计算结果进行进一步处理。


    计算器应用提供五种模式，你可以在其中输入基础方程、执行数学和财务函数，并进行货币、尺寸和进制的转换：


    - 1 点击菜单 (Menu)、附件 (Accessories)、计算器 (Calculator) 在“基础模式”下启动应用

    - 2 输入一些方程查看结果，并查看它们被添加到历史视图区域


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_129_0.png)


    历史视图区域中的计算数量没有限制。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_129_1.png)


    - 3 从标题栏菜单中选择“高级模式 (Advanced Mode)",然后选择选项转换测量的距离


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_129_2.png)


    高级模式提供了额外的按钮来执行数学函数，例如对数 (log)。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_129_3.png)


    - 4 从标题栏菜单中选择“财务模式 (Financial Mode)",选择选项转换货币总和


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_0.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_1.png)


    财务模式提供了额外的按钮来执行财务函数，例如未来价值 (FV)。


    - 5 从标题栏菜单中选择“编程模式 (Programming Mode)",选择选项转换进制


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_2.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_3.png)


    十进制 100 是二进制 1100100，代表 64+32+4。十进制 100 是八进制 144 和十六进制 64。


    - 6 从标题栏菜单中选择“键盘模式 (Keyboard Mode)",选择选项转换温度范围


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_4.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_5.png)


    编程模式提供了额外的按钮来执行编程函数，例如布尔代数 (AND, OR, XOR)。


    ## 管理压缩包


    Linux Mint 包含一个多功能的归管理器可以将文件压缩为多种格式。如果你选择流行的 .zip 格式，可以对压缩包进行加密，但这种格式通常产生的文件不是最小。你可以在菜单的附件分类中找到管理器，但通常通过右键菜单启动它：


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_131_0.png)


    归管理器


    - 1. 右键点击想要压缩的文件夹，在右键菜单中选择压缩... (Compress...)——打开“压缩”对话框

    - 2. 输入压缩文件名，然后选择 .zip 压缩格式


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_131_1.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_131_2.png)


    注意：并非所有压缩格式都支持密码保护。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_131_3.png)


    - 3. 选择位置并展开“其他选项 (Other Options)",然后输入密码

    - 4. 点击创建 (Create) 按钮在你处创建原始文件夹及其内容的备份

    - 5. 右键点击原始文件夹并在右键菜单中选择删除 (Delete)——移除文件夹及其内容


    压缩包不会替换原始文件夹——它是在原始之外创建的。


    接下来，右键点击压缩文件并选择“用归管理器打开 (Open With Archive Manager)”——查看其内容


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_0.png)


    现在，点击提取 (Extract) 按钮尝试提取文件夹及其内容


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_1.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_2.png)


    你可以通过选择此菜单上的“测试完整性 (Test Integrity)”选项来检查压缩包是否有错误。


    输入该压缩包的密码，然后点击确定 (OK) 按钮——提取文件夹及其内容的副本


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_3.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_4.png)


    点击关闭 (Close) 按钮退出归管理器应用。


    使用 7-ZIP (.7z) 压缩格式对相同文件夹创建另一个压缩包，并比较文件大小。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_5.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_6.png)


    更多压缩管理请参见第168页。


    ## 记录笔记


    Linux Mint 包含 Tomboy 应用，可以让你跟踪碎片化信息。你可以像在 Windows 上使用“便签 (Sticky Notes)”一样使用它，但你也可以在
    Tomboy 笔记中添加一个或多个链接来引用其他笔记，并可以在笔记本中按主题对 Tomboy 笔记：


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_133_0.png)


    Tomboy 笔记


    - 点击菜单 (Menu)、附件 (Accessories)、Tomboy 笔记 (Tomboy Notes) 来启动应用

