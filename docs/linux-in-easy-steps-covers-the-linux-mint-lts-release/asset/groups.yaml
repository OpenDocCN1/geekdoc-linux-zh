    # # Summary


    +   - The Linux file system comprises a number of standard directories arranged
    hierarchically beneath the / system root.


    +   - Data files created by a user should only be stored in the /home directory
    structure – in the user''s home directory structure.


    +   - A user can navigate around the filesystem graphically using the Nemo file
    browser app.


    +   - An individual file can be copied, moved, renamed, and deleted with the file
    browser.


    +   - Desktop launcher shortcuts are easily created by selecting the Add to desktop
    option on the Menu.


    +   - The “Launcher Properties” dialog can create shortcuts to apps.


    +   - A shortcut to a local file can be created as a link, which is merely a reference
    to the target file.


    +   - Care must be taken to avoid orphaning links when the target file gets moved
    or renamed.


    +   - It is important to recognize that many Linux directories contain hidden
    sub-directories and files.


    +   - Hidden files and directories always have names that begin with a . period
    character.


    +   - The View, Show Hidden Files menu in the file browser allows all content
    to be seen.


    +   - Files can be located using the file browser’s Search box to match file names
    or file extensions.


    +   - The owner of a file can specify access permissions to allow the Owner, Group,
    and Others to read, write, and execute.'
