    # 6 Producing with Office


    This chapter describes the productive apps within the free LibreOffice suite.


    - 90 Creating Documents

    - 92 Exporting Documents

    - 94 Creating Spreadsheets

    - 96 Creating Presentations

    - 98 Creating Visualizations

    - 100 Running Macros

    - 102 Adding Interaction

    - 104 Handling Data

    - 106 Summary


    ## Creating Documents


    The LibreOffice suite that is included with most Linux distros contains a set
    of tools similar to those in Microsoft Office: word processor, spreadsheet, and
    presentation programs, together with a program to create charts, graphs and diagrams,
    and a database app. If you are familiar with Microsoft Office you will feel instantly
    at home with the LibreOffice equivalents.


    Most importantly, LibreOffice contains file filters that allow it to work with
    standard Microsoft Office documents from Word, Excel and PowerPoint. Files can
    be saved in Microsoft Office file formats, as well as formats native to LibreOffice,
    and objects (OLE systems, plugins, video, applets, charts) that can be embedded
    within a document in much the same way as in Microsoft Word:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_91_0.png)


    LibreOffice Writer


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_91_1.png)


    LibreOffice is forked from OpenOffice, which was based on original code from the
    StarOffice application by Sun Microsystems. Sun made the code freely available
    for development by the open-source community – so LibreOffice has no proprietary
    ties.


    - Click Menu, Office, LibreOffice Writer to launch a processor with a new blank
    document

    - Type some content in the new document


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_91_2.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_91_3.png)


    There are versions of LibreOffice for Linux, Mac and Windows – all available for
    free download at libreoffice.org


    Java in easy steps instructs you how to create your own exciting Java programs.
    It is written for beginners and covers the major features of the Java language.
    Complete examples illustrate each important concept of programming – with easy-to-follow
    step-by-step instructions.


    Java is here mainly for beginners who want to quickly create your own Java programs.
    Development Kit (JDK) is also when to learn any new programming language. It is
    ideal for the newcomer to program. Each chapter starts with a simple example and
    ends with a sound understanding of the Java language and being able to write your
    own Java programs with confidence.


    Java in easy steps has an easy-to-follow style that will appeal to anyone who
    wants to learn Java quickly. It is suitable for beginners, for hobbyists who want
    to explore the opportunities offered by Java, and to experienced programmers who
    want to quickly add Java to their skillset.


    - Click the Edit, Select All menu item (or press Ctrl + A) to select all content,
    choose a font from its drop-down list on the toolbar


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_92_0.png)


    ## Java in easy steps


    Java in easy steps instructs you how to easily create your own Java programs.
    It is updated for the latest release and contains separate chapters on the major
    features of the Java language, complete examples covering important aspect of
    Java programming - with easy-to-follow step-by-step instructions.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_92_1.png)


    The Writer interface shown here contains the Standard toolbar and Formatting toolbar.


    - Select the heading text then use these toolbar buttons to modify the font height,
    weight and font color

    - Click the Insert, Image menu item to launch an “Insert Image” dialog, then choose
    an image file to add to the document at the cursor position

    - Click on the image and drag it to position it over the text body, then drop
    it to see the text automatically wrap around


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_92_2.png)


    Java in easy steps instructs you how to easily create your own exciting Java programs.
    It is updated for the latest release and contains separate chapters on the major
    features of the Java language, complete examples illustrate each important aspect
    of Java programming - with easy-to-follow step-to-step instructions.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_92_3.png)


    Notice that an Image toolbar automatically replaces the Formatting toolbar when
    an image is selected. Double-click the image to open “Image” dialog where you
    can adjust the Wrap spacing, and much more.


    - Click File, Properties to open a “Properties” dial where you can add a document
    description and security options


    ## Exporting Documents


    When saving documents from the LibreOffice word processor, the default file format
    used is the ODF (Open Document Format) Text format (.odt). Many alternative formats
    are available, however, your documents can be made compatible with Microsoft Office:


    - Click File, Save (or press Ctrl + S) to launch the "Save" dialog, type a document
    name in the Name field

    - Click the arrow file type to open a list of possible formats – choose Microsoft
    Word 2007-2013 XML (.docx)

    - Choose a location to save the document, such as a folder


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_93_0.png)


    The ODF format is an open-standard format for documents. It is designed to be
    platform-independent and accessible by a variety of software applications. LibreOffice
    uses ODF as its native file format, ensuring that your documents remain accessible
    in the long term.


    - Click File, Export As, Export as PDF to create a read-only version

    - Click the PDF format to save the document file


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_93_1.png)


    The PDF format is a widely used format for preserving the layout of documents
    across different devices and software. It is ideal for sharing documents and printing.


    ## Creating Spreadsheets


    The spreadsheet app that is part of the free suite provides the powerful ability
    to perform calculations on data. It also allows spreadsheets to be compatible
    with Excel.


    - Click Menu, Office, LibreOffice Calc to launch a new blank spreadsheet

    - Enter some row headings, then use the Font button to accent their purpose


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_95_2.png)


    **Hot tip** You can choose cell colors, borders, alignment, and more in the Format
    Cells dialog.


