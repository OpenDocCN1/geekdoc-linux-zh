- md: "\n## Summary\n\n- The Linux file system comprises a number of standard directories\
    \ arranged hierarchically beneath the / system root.\n- Data files created by\
    \ a user should only be stored in the /home directory structure – in the user's\
    \ home directory structure.\n- A user can navigate around the filesystem graphically\
    \ using the Nemo file browser app.\n- An individual file can be copied, moved,\
    \ renamed, and deleted with the file browser.\n- Desktop launcher shortcuts are\
    \ easily created by selecting the Add to desktop option on the Menu.\n- The “Launcher\
    \ Properties” dialog can create shortcuts to apps.\n- A shortcut to a local file\
    \ can be created as a link, which is merely a reference to the target file.\n\
    - Care must be taken to avoid orphaning links when the target file gets moved\
    \ or renamed.\n- It is important to recognize that many Linux directories contain\
    \ hidden sub-directories and files.\n- Hidden files and directories always have\
    \ names that begin with a . period character.\n- The View, Show Hidden Files menu\
    \ in the file browser allows all content to be seen.\n- Files can be located using\
    \ the file browser’s Search box to match file names or file extensions.\n- The\
    \ owner of a file can specify access permissions to allow the Owner, Group, and\
    \ Others to read, write, and execute.\n\n## 5 Engaging the Internet\n\nThis chapter\
    \ demonstrates popular Linux apps for your voting online activities:\n\n- 76 Browsing\
    \ the Web\n- 78 Customizing Firefox\n- 80 Exchanging Email\n- 82 Chatting Online\n\
    - 84 Downloading Content\n- 86 Getting More Apps\n- 88 Summary\n\n## Browsing\
    \ the Web\n\nMost Linux distros include the open-source Firefox browser. This\
    \ popular free browser is available for various platforms and is highly customizable.\
    \ It has been developed by the open-source community from original Netscape code\
    \ into a standards-compliant product.\n\nEnsure you are connected to the internet,\
    \ then click Menu, Internet, Firefox Web Browser to launch the web browser at\
    \ its Start Page\n\nYou can enter a URL in the address bar and hit Return to visit\
    \ a page. The address bar is also a Search box for Yahoo search engine.\n\n| Close\
    \ tab | New tab | Address bar | Add bookmark | Bookmarks | Show/Hide sidebar |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- |\n\n| Reader view | Page actions |\
    \ Save to Pocket | Options |\n| :--- | :--- | :--- | :--- |\n\nThe Save to Pocket\
    \ lets you save web pages so you can view them later on any device. Click the\
    \ Tab button to open a new tab containing a Search box and links to Top Sites\n\
    \nSearch for an item of interest, such as \"How solar cells work\", then select\
    \ a link from the results to visit the page\n\n## Solar Cells Work\n\nYou've probably\
    \ seen calculators with solar cells, devices that never needed batteries and in\
    \ some cases, don't even have a button. As an example, small solar cells can power\
    \ a calculator. You may have also seen large panels on emergency road signs, cell\
    \ phones and even watches. Although these large panels aren't as common as solar\
    \ powered devices, they are used in many places too. For example, photographs\
    \ which once used only back in the 1980s - now being used more and in less ways.\
    \ The technology continues to power new devices all the time, from calculators\
    \ to electric charging stations.\n\nSolar Cell Data\n\nThis is once you've probably\
    \ used to save bookmarks and power them up as the years go by.\n\nDon't forget\
    \ the Reader button is not available for all web pages, but when it toggles between\
    \ views. Click it to return to the regular page view. Next, click the Reader button\
    \ on the toolbar to make the page clear\n\n## Solar Cells Work | HowStuffWorks\n\
    \nYou've probably seen下去 with solar cells - devices that never needed batteries\
    \ and in some cases, don't even have a button. As long as there's enough light,\
    \ they will work for you. You may have also seen large solar panels on emergency\
