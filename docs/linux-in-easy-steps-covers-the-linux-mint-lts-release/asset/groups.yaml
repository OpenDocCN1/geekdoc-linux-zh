- md: "\n# Scripting the Shell\n\nLengthy shell routines, like those on page 183,\
    \ can be conveniently saved as a shell script for execution when required. Shell\
    \ scripts are simply plain text files that begin their first line with #!/bin/bash,\
    \ specifying the location of the bash program, and are typically given a .sh file\
    \ extension.\n\nOnce a shell script file has its access permission set to \"executable\"\
    \ it can be executed at any time by prefixing its name or path with the ./ dot-slash\
    \ characters at a shell prompt.\n\nA script might, perhaps, employ the RANDOM\
    \ variable that generates an integer from zero to 32,767 each time it is called.\
    \ These are not truly random, however, as the sequence is generated given the\
    \ same starting point (seed) – in order to ensure different sequences, it is necessary\
    \ to set it with different seeds.\n\nOne solution is to extract a dynamic value\
    \ from the current time using the `date +%s` command to deliver the current number\
    \ of seconds that have elapsed since 00:00:00 GMT January 1, 1970. Using this\
    \ to seed the RANDOM variable gets better random number generation.\n\nArithmetic\
    \ can be performed on shell variables, such as $RANDOM, by including the let command\
