    \ that specify a test expression, the action to perform when the test is true,\
    \ and the action to perform when the test is false.\n\nThe if keyword identifies\
    \ the statement and is followed by the expression enclosed within a pair of []\
    \ square brackets. Each part of the entire statement must be separated from the\
    \ next by whitespace, to enable the shell to evaluate the expression.\n\nThe then\
    \ keyword begins the second part of the statement, specifying the commands to\
