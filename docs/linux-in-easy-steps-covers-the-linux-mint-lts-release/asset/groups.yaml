    # Managing Archives


    The Linux Mint distro includes a versatile Archive Manager app that can compress
    files into many archive formats. If you choose the popular ZIP (zip) format you
    can password-protect the archive, but this format often does not produce the smallest
    archive file size. You can find the Archive Manager launcher on the Menu in the
    Accessories category, but usually you will launch it from a right-click context
    menu:


