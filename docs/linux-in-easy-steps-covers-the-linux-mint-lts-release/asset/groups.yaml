    # Providing Disk Space


    An operating system is installed on an area of the hard drive called "partition".
    When Windows is the only installed operating system its partition will normally
    occupy the entire hard drive. To install Linux in this situation there are three
    possible options:


    A Hard Disk Drive (HDD) or simply "hard drive" can be partitioned into one or
    more regions so that the operating system can manage each region separately.


    +   * **Delete the Windows partition** – replacing it with Linux partitions that
    occupy the entire drive. *This option will delete the Windows operating system
    along with all the applications and data files.* It creates a dedicated Linux
    computer that will immediately start Linux when the PC gets switched on.


    +   * **Reduce the Windows partition size** – so that it no longer occupies the
    entire drive, create Linux partitions in the resulting free space. This option
    will retain the Windows operating system, applications and data files. It creates
    a "dual-boot" computer that allows the user to choose whether to start Linux or
    Windows whenever the PC gets switched on.


    +   * **Add a second hard drive to the system** – this allows Linux partitions
    to occupy the entire second drive and retains the Windows operating system, applications
    and data files on the first drive. It creates a dual-boot computer that allows
    the user to choose whether to start Linux or Windows whenever the PC gets switched
    on.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_13_0.png)


    Resizing partitions is a scary process where data loss can, and does, occur –
    even in expert hands. All contents of the partition must be backed up before attempting
    this operation.


    The option to install an additional hard drive for Linux is a popular choice for
    many people as they have often upgraded their original hard drive to a larger
    one, and so have their original drive spare. It has several benefits over the
    other options:


    +   * The free space on the Windows drive is not reduced.

    * It removes the risk of data loss through partition resizing.

    * The familiar Windows operating system is retained.

    * It distinctly separates the two operating systems.

    * Drive failure would only disrupt one operating system.'
  - '[PAGE 14]


    ...cont''d


    # # Adding a Second Hard Drive


    Most modern PCs can accommodate up to four EIDE (Enhanced Integrated Device Electronics)
    devices, such as hard drives and optical CD/DVD drives, but typically ship with
    just two – one hard drive and one optical drive. This means that more drives can
    be added by plugging them into the existing system.


    The first hard drive in a system is known as the “Master” drive and a second hard
    drive is called the “Slave” drive.


    A “jumper” connects two tiny pins to determine if the drive should be regarded
    as a MASTER (MA) drive or Slave (SL) drive. The top of each hard drive usually
    has a diagram depicting which pins need to be connected in each case.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_0.png)


    If you are not comfortable working inside your PC case, a computer store should
    be pleased to undertake the fitting of a second drive for a modest fee.


    +   Ensure that the jumper on the original drive is set to Master, then set the
    jumper on the second drive to Slave


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_1.png)


    +   Connect the wide SATA data cable to the Master drive, by the plug at the end
    of the cable – not the plug part way along the cable


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_3.png)


    +   Now, connect the SATA data cable to the Slave drive, by the plug part way
    along the cable


    SATA (Serial Advanced Technology Attachment) is the standard for connecting devices
    such as hard drives and optical drives to the PC’s motherboard.


    +   Connect the power cables to both drives, then close the PC case


    +   Start up the PC and check that both drives are now detected by the system
    – if the second drive is not detected, you may need to change the boot settings
    to “auto-seek” it booting up'
