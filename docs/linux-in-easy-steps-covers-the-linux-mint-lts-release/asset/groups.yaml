    \ shell 内部——例如，**exit** 命令可以退出 shell 并关闭终端窗口。你可以使用 **type** 命令并将命令名称作为参数来判断某个命令是否为内置命令：\n\
    \n- 4. 输入 **clear** 并按回车键删除之前的内容，然后输入 **type clear** 并再次按回车以发现 **clear** 命令程序的位置\n\
    - 5. 输入 **type exit** 并按回车，发现 exit 命令是一个 shell 内置指令，然后输入 **exit** 命令并按回车退出 shell\n\
    \n在任何命令后输入 **--help** 参数（两个连字符）和 “help”）然后按回车，即可查看该命令的选项列表。\n\n```\n$ mike@linux-pc:~$\
    \ clear\nclear is hashed (/usr/bin/clear)\nmike@linux-pc:~$ exit\nexit is a shell\
    \ builtin\nmike@linux-pc:~$ $\n```\n\n# 在提示符处导航\n\n当你启动 shell 会话时，默认你位于 Linux\
    \ 文件系统的家目录下。你可以通过将绝对路径作为 `cd` 命令的参数，切换到任何你有访问权限的目录。同样，你可以通过将绝对路径作为 `cd` 命令的参数，或使用波浪别名\
    \ `cd ~` 来返回家目录。\n\n对于较短的层级移动，`cd ..` 命令向上移动一级到当前目录的父目录。将直接子目录的名称作为 `cd` 命令的参数，则向下移动一级到该子目录：\n\
    \n- 在提示符处输入 `pwd` 命令时启动 shell 窗口以打印当前工作目录\n- 输入组合命令 `cd /etc; pwd` 切换到 /etc 目录并确认其为工作目录\n\
    - 接下来，输入组合命令 `cd ~; pwd` 返回家目录并确认位置\n- 输入组合命令 `cd ..; pwd` 切换到父目录并确认位置\n- 现在，输入组合命令\
    \ `cd mike; pwd` 切换到命名的子目录并确认它\n\n命令与其参数之间必须有空格。\n\n```\nmike@linux-pc:~$ pwd\n\
    /home/mike\nmike@linux-pc:~$ cd /etc; pwd\n/etc\nmike@linux-pc:/etc$ cd -; pwd\n\
    /home/mike\nmike@linux-pc:~$ cd ..; pwd\n/home\nmike@linux-pc:/home$ cd mike;\
    \ pwd\n/home/mike\nmike@linux-pc:~$ \n```\n\n可以使用 `ls` 命令显示当前目录的内容，列出文件和直接子目录。这是一个具有许多实用选项的命令：\n\
    \n- 使用 -a 选项查看所有目录内容——包括隐藏文件和子目录。\n- 使用 -l 选项查看每个项目的详细格式列表——包括用户和组的所有权名称。\n- 使用\
    \ -t 选项按创建或最后修改时间对内容进行排序。\n- 使用 -o 选项隐藏组所有权的详细信息。\n\n选项可以组合以产生复杂的选项，每个参数都会被应用：\n\
    \n- 输入命令 `cd \"My Topics\"` 移动到一个名称包含空格的直接子目录\n- 接下来，输入 `ls` 命令简单列出所有内容\n- 输入命令\
    \ `ls -alt` 列出所有内容（包括隐藏文件），采用详细格式并按修改时间列出——但隐藏用户和组信息\n\n指定包含空格的目录名称作为命令时，必须用引号括起来——以避免截断。\n\
    \n```\nmike@linux-pc:~$ cd \"My Topics\"\nmike@linux-pc:~$ ls -l \"My Topics\"\
    \nls sample.txt\nmike@linux-pc:~$ ls -alt\ntotal 29\ndrw-xr-x-- 1 Jul 25 08:28\n\
    drw-rw-r-- 1 Jul 25 08:26 linux.txt\ndrw-r--r-- 1 Jul 25 08:26 sample.txt\ndrw-xr-x--\
    \ 2 Jul 25 08:28\ndrw-xr-x-- 3 Jul 25 08:25\n```\n\n所有绝对目录地址都以 \"/\" 开头，因为它们从根目录向下延伸。\n\
    \n# 对目录的操作\n\n有时使用 `basename` 命令从路径末尾提取文件、程序或目录的名称是有用的。相反，你可以使用 `dirname` 命令移除文件路径的最后部分——留下指向父目录的路径。\n\
    \n`basename` 和 `dirname` 命令仅仅是对路径字符串的操作——它们不会执行任何动作。\n\n可以通过向 `mkdir` 命令指定你选择的目录名称在当前目录下创建一个新目录。或者，可以通过指定完整路径作为参数在其他地方创建新目录：\n\
    \n- 1. 在提示符下输入 `echo SHELL` 发现默认 shell 的 bash 程序的位置\n- 2. 使用 `basename SHELL`\
    \ 提取路径中的程序名\n- 3. 使用 `dirname SHELL` 提取文件所在的父目录路径\n- 4. 输入 `mkdir Sub1` 在当前目录下创建一个名为\
    \ Sub1 的目录\n- 5. 输入 `mkdir /home/mike/Sub2` 使用绝对路径创建一个名为 Sub2 的目录\n\n```\nmike@linux-pc:~$\
    \ echo SHELL\n/bin/bash\nmike@linux-pc:~$ basename SHELL\nbash\nmike@linux-pc:~$\
    \ dirname SHELL\n/bin\nmike@linux-pc:~$ mkdir Sub1\nmike@linux-pc:~$ mkdir /home/mike/Sub2\n\
    mike@linux-pc:~$ pwd ; ls\n/home/mike/Data\nSub1 Sub2\nmike@linux-pc:~$\n```\n\
    \n# 目录\n\n可以使用 `rmdir` 命令在 shell 中删除目录。它接收目录名称作为参数，并立即删除空目录，但如果目录包含文件，会警告你。\n\n\
    一个个删除文件可以提供保护，但很麻烦。一种更智能的替代方案是使用 `rm` 命令的递归交互选项 `-ri`。它会进入目录并在删除每个文件之前请求确认。在删除所有文件后，它会询问你是否删除目录：\n\
    \n你可以对 `rmdir` 命令和 `rm` 命令使用 -v 选项产生详细输出——描述发生的过程。\n\n- 6. 使用 `nano` 命令启动文本编辑器，并在\
    \ Sub2 目录下创建三个文本文件\n- 7. 执行 `rmdir Sub1` 命令删除空的 Sub1 目录\n- 8. 现在，执行 `rmdir Sub2`\
    \ 尝试删除非空的 Sub2 目录\n- 9. 输入命令 `rm -ri Sub2` 交互式删除 Sub2 目录内的文件并删除目录本身，通过对每个问题回答“Y”（是）\n\
    \n```\nmike@linux-pc:~/Data\nFile Edit View Search Terminal Help\nmike@linux-pc:~$\
    \ rmdir Sub1\nSub1\nmike@linux-pc:~$ rmdir Sub2\nrmdir: failed to remove 'Sub2':\
    \ Directory not empty\nmike@linux-pc:~$ rm -ri Sub2\nrm: Descend into directory\
    \ 'Sub2'? Y\nrm: remove regular file 'Sub2/file-2.txt'? Y\nrm: remove regular\
    \ file 'Sub2/file-1.txt'? Y\nrm: remove regular file 'Sub2/file-3.txt'? Y\nrm:\
    \ remove directory 'Sub2'? Y\nmike@linux-pc:~$ \n```\n\n如果你足够勇敢，并且绝对确定目录中没有任何你会丢失的内容，可以使用仅带\
    \ -r 选项的 `rm` 命令立即删除目录及其所有内容——请谨慎使用！\n\n"
