    # Emulating Photoshop


    The GIMP app is a great editor, but many who are familiar with Adobe Photoshop
    find its default interface unfriendly:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_117_0.png)


    You can, however, replace the default GIMP configuration folder with a custom
    Theme to emulate the look and feel of Photoshop. The popular GimpPs Theme for
    this purpose is available from the online GitHub repository, which requires the
    Git package to be installed on your system in order to clone the GimpPs Theme.
    Backup of the original GIMP configuration folder, installation of the Git package,
    and cloning of the GimpPs Theme can all be easily achieved by issuing commands
    in the Linux Terminal:


    GimpPs Theme supports GIMP version 2.8 and may not succeed with other versions.
    Installation instructions are correct at the time of writing but may be subject
    to change. Find more details online at github.com/doctormo/GimpPs


    +   - Click **Menu, Administration, Terminal** to launch a command-line "Terminal"
    window


    +   - At the prompt, precisely enter this command to rename the GIMP configuration
    folder – and create a backup `mv ~/gimp-2.8 ~/gimp-2.8-backup`


    +   - Next, enter this command to install the Git package `sudo apt-get install
    git-all`'
  - '[PAGE 118]


    # cont''d


    Enter your password then, when asked, press the Y key and hit Return to proceed
    with the installation


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_118_0.png)


    Upon completion, precisely enter this command to clone the Theme folder from the
    GitHub repository

    sh - c "$curl -fSL https://raw.githubusercontent.com/doctormo/GimpPS/master/tools/install.sh"


    The backslash character here simply allows the command to continue on the next
    line.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_118_1.png)


    ```

    mike@linuxpc:~

