    ## Configuring the Desktop


    One of the first changes many people want to make to the Linux Desktop is to the
    background “wallpaper” of the Desktop:


    - Right-click anywhere on the Desktop wallpaper – to open a context menu


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_29_0.png)


    - On the context menu, select the Change Desktop Background option – to open a
    “Backgrounds” settings window


    - Choose Tara in the left-hand pane – to see a selection of wallpaper images appear
    in the right-hand pane


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_29_1.png)


    You can click the Settings button to adjust how the image fits your Desktop, or
    to choose a background color instead of an image.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_29_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_29_3.png)


    You can also click on the Pictures folder to choose one of your own images.


    - Scroll down and click on any image – to see it instantly applied as background
    wallpaper on your Desktop


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_29_4.png)


    If you are used to seeing the “Recycle Bin” icon on the Windows Desktop, or would
    simply like to restore deleted files easily, you will want to see the “Trash”
    icon on Linux Mint’s Desktop:


    - Right-click anywhere on the Desktop wallpaper to open the context menu and select
    Desktop Settings — to open a “Desktop Settings” window


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_30_0.png)


    - See that the toggle switch for the Trash icon is in the “Off” position


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_30_1.png)


    > Hot tip you can select options from this drop-down list for dual monitor setups
    and hide all Desktop icons. Your selection of “On/Off” settings will be remembered
    for the next time you choose to show all Desktop icons.


    - Slide the toggle switch to the “On” position to see the Trash icon now appear
    on the Desktop


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_30_2.png)


    - To adjust the Desktop icons, right-click on the Desktop and expand the Desktop
    option


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_30_3.png)


    - Select your preferred icon size and arrangement from the options


    ## Adding Desklets


    Linux Mint offers a number of small apps ("applets") that run on the Desktop.
    These are similar to the Desktop widgets you may have seen in Windows but are
    called "Desklets" (Desktop applets) in Linux Mint. Three desklets are installed
    as standard, and you can download many more:


    - 1. Right-click anywhere on the Desktop wallpaper to open the context menu, then
    select **Add Desklets** – to open a "Desklets" settings window


    - 2. Next, select an installed desklet, such as the **Clock desklet**


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_31_0.png)


    You can click the **General Settings** button in the Desklets window to modify
    width and decoration aspects of your desklets.


    - 3. Now, click the + **Add** button to instantly add the desklet to your Desktop


    You can drag desklets around the Desktop to arrange them to your preference.


    Click the Download button, then choose a desklet and click the down arrow button
    to install it on your PC


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_32_0.png)


    > When you select the Download button a dialog might advise you that "Your cache
    is out of date". Click the Yes button on the dialog to update it now.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_32_1.png)


    Click the Manage button to see your chosen desklet has been added to the list
    of installed desklets


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_32_2.png)


    > Click the Hot - button to remove a selected desklet from the Desktop, or click
    the x button to uninstall a selected desklet.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_32_3.png)


    Select the newly-installed desklet, then click the + Add button to instantly add
    it to your Desktop


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_32_4.png)


    > Right-click on a desklet to see a context menu that offers configuration options
    and an option to remove the desklet from the Desktop.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_32_5.png)


    ## Adjusting the Taskbar


    The Taskbar panel contains an icon for each running window that you can click
    to restore a minimized window to its original size. Usefully you can hover the
    mouse cursor over the icon of an app to see a thumbnail of that window:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_33_0.png)


    Additionally, you can add useful applets to the Taskbar panel:


    - 1. Right-click on the Taskbar to open a context menu

    - 2. Select the option to Add applets to the panel – to open an “Applets” settings
    window


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_33_1.png)


    You can click the Panel settings item on this context menu for options to automatically
    hide the Taskbar, add more panels, and edit panels.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_33_2.png)


    Notice that the Applets settings window functions like the Desklets window described
    on page 31.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_33_3.png)


    Click the Manage button to select from a list of installed applets, or click the
    Download button to install another applet – for example, the “Weather” applet


    Click the Manage button and select the Weather applet, then click the + Add button
    to add it to the Taskbar panel. The weather applet needs you to choose a location.
    Right-click on the applet then choose the Configure –


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_34_0.png)


    In the Weather settings window, click Get WOID and enter a location in the “Search
    Place” box that appears


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_34_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_34_2.png)


    WOID (Where On Earth) is a unique number that identifies any feature on planet
    Earth. Click the Lookup button to get a WOID number, then enter the number here
    and close the window


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_34_3.png)


    Now, click the Taskbar applet to see the weather for your chosen location


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_34_4.png)


    Right-click on an applet to see a context menu that offers configuration options
    and an option to remove the applet from the Desktop.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_34_5.png)


    ## Launching Apps


    Apps can be launched in Linux Mint from the (Start) Menu and additional launchers
    can easily be added to the Taskbar, or on the Desktop, for frequently-used applications:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_35_0.png)


    - 1. Click the **Menu** button, at the far left of the Taskbar, then position
    the mouse pointer over the **Accessories** category to see that category''s list
    of apps


    You can also type the name of an app into this **Search** box to find it.


    - 2. On the Accessories menu list, click the **Text Editor** item to launch the
    Text Editor app


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_35_1.png)


    The apps on the menus shown here are from the Linux Mint distro – those on other
    distros will vary.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_35_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_35_3.png)


    The launchers in the "Favorites" sidebar are You can choose **Add to favorites**
    on the context menu to add a launcher in the sidebar.


    - 3. Right-click on the Text Editor item in the Accessories menu, then choose
    **Add to panel** from the context menu to create a launcher button on the Taskbar


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_35_4.png)


    - 4. Click the new launcher that has been added to the Taskbar to launch the Text
    Editor


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_36_0.png)


    - 5. Right-click on the Text Editor item in the Accessories menu, then choose
    Add to desktop to create a launcher icon on the Desktop


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_36_1.png)


    - 6. Click the shortcut launcher that has been added to the Desktop, to launch
    the Text Editor


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_36_2.png)


    To delete a launcher from the Taskbar, right-click on it and choose Remove. To
    remove a launcher from the Desktop, right-click on it and choose Delete.


    You can also create a Desktop launcher for any application if you know its precise
    command name. In this instance, the Text Editor for the Cinnamon Desktop is named
    "zed".


    - 7. Right-click on the Desktop, then choose Create a launcher here... from the
    context menu that appears


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_36_3.png)


    - 8. Type a name and the zed command name into the appropriate input fields in
    the “Launcher Properties” dialog, then click its OK button to create the Desktop
    launcher


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_36_4.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_36_5.png)

