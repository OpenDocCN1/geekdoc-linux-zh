  - '[PAGE 181]


    # Printing from the Shell


    The lpr command takes a file name or path as its argument to establish a print
    job by send the specified file to the printer. Each job is placed in a queue awaiting
    transmission to the printer – when the job reaches the front of the queue, data
    from the file is sent to the printer and gets printed.


    You can examine jobs in the print queue with the lpq command – each job is automatically
    assigned a job number. A job can be removed from the queue, before it gets sent
    to the printer, using the lpr command together with its job number:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_181_0.png)


    +   At a shell prompt, enter lpr tux.png to create a print job – to print an image
    file named “tux.png”


    +   Enter lpr ballad.txt to create another print job – to print the specified
    text file “ballad.txt”


    +   Issue an lpq command to see the current print queue


    ```

    mike@linux-pc:~/Data

    File Edit View Search Terminal Help

    mike@linux-pc:~/Data lpr tux.png

    mike@linux-pc:~/Data lpr ballad.txt

    mike@linux-pc:~/Data lpq

    samsung-2028 is ready and printing

    Rank Job File(s) Total Size

    active mike 1 tux.png 57344 bytes

    ist 2 ballad.txt 22528 bytes

    mike@linux-pc:~/Data lpr 2

    mike@linux-pc:~/Data _|

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_181_1.png)


    The print queue reveals that the printer is actively printing job number one –
    the image file.


    +   Before print job number one completes, issue the command lpr 2 (or alternatively,
    the command cancel 2) to remove that job from the print queue


    The printer removes that job while continuing to the image file – the text file
    in job number two is not sent to the printer, so does not get printed.


    A print job can only be removed from the queue by its owner or the root supervisor.'
