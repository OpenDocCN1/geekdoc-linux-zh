    ## Writing Text


    The plain text Text Editor app (xed) in Linux Mint is the equivalent of the Notepad
    app in Windows – but Text Editor has many more features. It can number lines,
    sort lines into alphabetic order, and provides syntax highlighting for a whole
    range of scripting, programming, and markup languages.


    You must recognize, however, that Linux does not treat text endings the same way
    as Windows. Linux adds a non-printing line feed \n (''\newline'') character, whereas
    Windows adds non-printing carriage return and line feed \r\n characters. This
    means text files created in Linux do not maintain their line endings correctly
    when viewed on a Windows system. The Text Editor app provides an option when saving
    text files that lets you choose your preferred type of line endings:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_127_0.png)


    - Click Menu, Accessories, Text Editor to launch the app

    - Next, click Tools, Autocheck Spelling to turn the spellchecker on

    - Now, type in some lines of text – see the spellchecker place red beneath suspicious
    items


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_127_1.png)


    The Notepad app in versions of the Windows 10 operating system from October 2018
    supports both Linux and Windows \r\n line endings.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_127_2.png)


    ```

    HTML5 in easy 2nd edition contains examples and screenshots that illustrate each
    feature of HTML, describing how to incorporate metadata and structured body content.
    You''ll learn how to create web pages to display text, images, tables, hyperlinks,
    forms, media, video and how to animate graphics on embedded ''canvas'' areas.
    Each chapter builds your knowledge so by the end of the book you''ll have gained
    solid understanding

    ```


    You can click Edit, Sort lines into alphanumeric order, then click Edit, Undo
    to revert to the original.


    - Click Edit, Preferences, Editor, to toggle the "Display line numbers" switch
    to On – to see the lines generated

    - Turn off the spellchecker and click Edit, Select All (or press Ctrl + A) to
    select all text, then hit the Delete key to remove all


    Select View, Highlight Mode, Markup, HTML to turn on syntax highlighting for HTML
    markup code.


    Now, type in some HTML markup tags – see the elements, attributes, and content
    appear colored


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_128_0.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_128_1.png)


    The line numbers appear only in the Text Editor window – they are not inserted
    into the text.


    Click File, Save As to open a "Save As" dialog, then enter a file name and choose
    the Windows line ending option


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_128_2.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_128_3.png)


    This file saved with Linux line endings may appear like this on older versions
    of Windows Notepad.


    Click the Save button, copy the file to a Windows system and see the line endings
    are preserved


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_128_4.png)


    ## Doing Calculations


    Linux Mint includes a Calculator app that can perform different types of calculations
    and conversions. It provides a scrollable History View of your previous calculations
    so you can select a previous calculation to manipulate further.


    There are five modes available in the Calculator app in which you can enter basic
    equations, execute math and financial functions, and perform conversions of currency,
    size, and number base:


    - 1 Click Menu, Accessories, Calculator to launch the app in "Basic Mode"

    - 2 Enter some equations to see the result and see them get added to the History
    View area


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_129_0.png)


    There is no limit to the number of calculations in the History View area.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_129_1.png)


    - 3 Select "Advanced Mode" from the title bar menu, then select options to convert
    a measured distance


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_129_2.png)


    The Advanced Mode provides additional buttons to perform math functions, such
    as logarithm (log).


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_129_3.png)


    - 4 Select "Financial Mode" from the title bar menu, select options to convert
    a sum of currency


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_0.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_1.png)


    The Financial Mode provides additional buttons that perform financial functions
    such as future value (FV).


    - 5 Select "Programming Mode" from the title bar menu, select options to convert
    number bases


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_2.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_3.png)


    Decimal 100 is binary 1100100, which represents the sum of 64+32+4+0. Decimal
    100 is octal 144 and hexadecimal 64.


    - 6 Select "Keyboard Mode" from the title bar menu, select options to convert
    temperature scales


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_4.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_130_5.png)


    The Programming Mode provides additional buttons that perform programming functions,
    such as Boolean algebra (AND, OR, XOR).


    ## Managing Archives


    The Linux Mint distro includes a versatile Archive Manager app that can compress
    files into many archive formats. If you choose the popular ZIP (.zip) format you
    can password-protect the archive, but this format often does not produce the smallest
    archive file size. You can find the Archive Manager launcher on the Menu in the
    Accessories category, but usually you will launch it from a right-click context
    menu:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_131_0.png)


    Archive Manager


    - 1. Right-click on a folder you would like to compress, and choose Compress...
    on the context menu – open a “Compress” dialog

    - 2. Enter an archive file name, then select the .zip archive file format


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_131_1.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_131_2.png)


    Beware Not all archive file formats support password protection.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_131_3.png)


    - 3. Choose a location and expand “Other Options”, then enter a password

    - 4. Click the Create button to make an archive copy of the original folder and
    its contents at your choice

    - 5. Right-click on the original folder and choose Delete on the context menu
    – to remove the folder and its contents


    The archive does not replace the original folder – it is created in addition to
    the original.


    Next, right-click on the archive file and choose Open With Archive Manager – to
    see its contents


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_0.png)


    Now, click the Extract button in an attempt to extract the folder and its contents


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_1.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_2.png)


    You can check an archive for errors by choosing the Test Integrity option on this
    menu.


    Enter the password for this archive, then click the OK button – to extract a copy
    of the folder and its contents


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_3.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_4.png)


    Click the Close button to exit the Archive Manager app.


    Create another archive of the same folder using the 7-ZIP (.7z) archive file format,
    and compare the file sizes


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_5.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_132_6.png)


    See page 168 for more archive management.


    ## Taking Notes


    Linux Mint includes the Tomboy app that lets you keep track of small pieces of
    information. You can use this much in the same way as “Sticky Notes” on Windows,
    but you can also add one or more links in a Tomboy note to reference your other
    notes, and you can group Tomboy notes by topic in notebooks:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_133_0.png)


    Tomboy Notes


    - Click Menu, Accessories, Tomboy Notes to launch the app

    - Select File, Notebooks, New Notebook... to open a dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_133_1.png)


    - Enter a name for the notebook, such as “Web”, then click the Create button –
    see a “Web” notebook icon added in the left-hand pane of the app


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_133_2.png)


    You can use the Tools menu to export notes as HTML documents that you can view
    in the Firefox web browser.


    - Next, click File, Notebooks, New “Web” Note to create a new note that opens
    in a separate window


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_133_3.png)


    - See that by default the new note is named with the current date and time, which
    is also a hyperlink


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_133_4.png)


    You can right-click on a note and choose Always on Top to see it above other open
    windows.

