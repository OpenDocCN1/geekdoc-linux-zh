    # 6 使用 Office 进行生产


    本章介绍了免费 LibreOffice 办公件中的生产力应用。


    - 90 创建文档

    - 92 导出文档

    - 94 创建电子表格

    - 96 创建演示文稿

    - 98 创建可视化图表

    - 100 运行宏

    - 102 添加交互

    - 104 处理数据

    - 106 总结


    ## 创建文档


    大多数 Linux 发行版包含的 LibreOffice 办公件包含一组与 Microsoft Office 类似的工具：文字处理器、电子表格程序和演示文稿程序，以及一个用于图表、图形和流程图的程序和一个数据库应用程序。如果你熟悉
    Microsoft Office，将很快发现 LibreOffice 的对应工具如得胜。。


    最重要的是，LibreOffice 包含了文件过滤器，使其处理来自 Word、Excel 和 PowerPoint 的标准 Microsoft Office
    文档。文件可以保存为 Microsoft Office 文件格式，也可以为 LibreOffice 的原生格式，并且对象（OLE 系统、插件、视频、小程序、图表）可以像在
    Microsoft Word 中一样被嵌入文档中：


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_91_0.png)


    LibreOffice Writer


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_91_1.png)


    LibreOffice 是从 OpenOffice 分叉出来的，而 OpenOffice 基于 Sun Microsystems 的 StarOffice
    程序的原始代码。Sun 将代码免费提供给开源社区开发——因此 LibreOffice 没有所有权限制。


    - 点击菜单（Menu）、Office、LibreOffice Writer 以启动一个带有新空白文档的处理器

    - 在新文档中输入某些内容


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_91_2.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_91_3.png)


    LibreOffice 有适用于 Linux、Mac 和 Windows 版本——均可在 libreoffice.org 免费下载。


    《Java 快速入门》(Java in easy steps) 教你如何创建自己的精彩的 Java 程序。它是为初学者编写的，涵盖了 Java 语言的主要特性。完整的示例说明了编程的每个重要概念——配有易于遵循的逐步操作说明。


    《Java 快速入门》主要面向想要快速创建自己的 Java 程序的初学者。开发工具包 (JDK) 是学习任何新编程语言的时刻。它对于编程新手来说非常理想。每一章从一个简单的示例开始，以对
    Java 语言有良好的理解并能够有信心地编写自己的 Java 程序而结束。


    《Java 快速入门》具有易于遵循的风格，将吸引任何想要快速学习 Java 的人。它适用于初学者、想要探索 Java 提供的机会的爱好者，以及想要快速将 Java
    加入到自己技能树中的资深程序员。


    - 点击编辑（Edit）、全选（Select All）菜单项（或按 Ctrl + A）选择所有内容，从工具栏上的下拉列表中选择字体


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_92_0.png)


    ## Java 快速入门


    《Java 快速入门》教你如何轻松创建自己的精彩的 Java 程序。它已针对最新版本进行了更新，包含了关于 Java 语言主要特性的独立章节，涵盖 Java
    编程重要方面的完整示例——配有易于遵循的逐步操作说明。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_92_1.png)


    此处显示的 Writer 接口包含标准工具栏和格式工具栏。


    - 选择标题文本，然后使用这些工具栏按钮修改字体高度、粗细和字体颜色

    - 点击插入（Insert）、图像（Image）菜单项启动“插入图像”对话框，然后选择一个图像文件添加到光标所在的位置

    - 点击图像并拖动将其置于正文上方，然后松开以查看文本自动环绕


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_92_2.png)


    《Java 快速入门》教你如何轻松创建自己的精彩的 Java 程序。它已针对最新版本进行了更新，包含了关于 Java 语言主要特性的独立章节，完整的示例说明了
    Java 编程每个重要方面——配有易于遵循的逐步操作说明。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_92_3.png)


    注意选择图像时，图像工具栏会自动替换格式工具栏。双击图像打开“图像”对话框，你可以在其中调整环绕间距等更多设置。


    - 点击文件（File）、属性（Properties）打开“属性”对话框，你可以在其中添加文档说明和安全选项


    ## 导出文档


    当从 LibreOffice 文字处理器保存文档时，使用的默认文件格式是 ODF（开放文档格式）文本格式 (.odt)。然而，有许多备用格式可用，你可以将文档设置为与
    Microsoft Office 兼容的格式：


    - 点击文件（File）、保存（或按 Ctrl + S）启动“保存”对话框，在名称（Name）字段中输入文档名称

    - 点击文件类型箭头打开可能格式的列表——选择 Microsoft Word 2007-2013 XML (.docx)

    - 选择一个位置保存文档，例如某个文件夹


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_93_0.png)


    ODF 格式是一种文档开放标准格式。它设计为独立平台并可被各种软件访问。LibreOffice 使用 ODF 作为其原生文件格式，确保你的文档长期可访问。


    - 点击文件（File）、导出为（Export As）、导出为 PDF 创建一个只读版本

    - 选择 PDF 格式保存文件


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_93_1.png)


    PDF 格式是一种广泛用于跨设备和软件保留文档布局的格式。它非常适合共享文档和打印。


    ## 创建电子表格


    免费套件中的电子表格程序提供了处理数据的强大能力。它还允许电子表格与 Excel 兼容。


    - 点击菜单（Menu）、Office、LibreOffice Calc 启动一个新的空白电子表格

    - 输入某些行标题，然后使用字体按钮突出其目的


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_95_2.png)


    **热点提示** 你可以在单元格式对话框中选择单元格颜色、边框、对齐等。


    - 拖动选择所有单元格，然后右键点击并选择**单元格式**

    - 在对话框中选择货币类别，然后点击对话框的**确定**应用选择


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_95_3.png)


    - 在每周行和列的所有单元格中输入数值


    用鼠标跨越一行中的每天单元格及其“总计”单元格，然后点击工具栏上的 Σ 字符——公式字段中出现 SUM 公式，总计单元格中出现行总值


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_96_0.png)


    在行的“平均值”单元格中输入 =AVERAGE 并按回车，然后跨越该行的单元格并再次按回车——平均值单元格中出现行数据


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_96_1.png)


