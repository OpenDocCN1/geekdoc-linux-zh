    can resist everything except temptation.

    mike@linux-pc:~//data cat vegas-column2.txt

    can resist everything except temptation.

    ```


    ## Matching Patterns


    The grep command is one of the most powerful tools. It has many options, but its
    primary use is to find lines that match a pattern. To use grep, you provide the
    pattern and the file(s) to search in.


    - 1. At a shell prompt, enter grep "pattern" file.txt to find all lines containing
    "pattern".

    - 2. Use grep -i "pattern" file.txt to perform a case-insensitive search.

    - 3. Use grep -v "pattern" file.txt to find all lines that do not match the pattern.

    - 4. Use grep -n "pattern" file.txt to show the line numbers of the matching lines.


    ```

    $ grep "pattern" file.txt

    This is a line containing the pattern.

    This is another line with the pattern.

    ```


    grep can also use regular expressions, which allow for much more complex matching.
    For example, grep "^pattern" file.txt will find all lines that start with "pattern",
    and grep "pattern$" file.txt will find all lines that end with "pattern".


    ```

    $ grep "^pattern" file.txt

    This is a line starting with the pattern.

    $ grep "pattern$" file.txt

    This is a line ending with the pattern.

    ```


    The grep command can also be used to search multiple files at once. For example,
    grep "pattern" file1.txt file2.txt will search for "pattern" in both files and
    display the filename before each matching line.


    ```

    $ grep "pattern" file1.txt file2.txt

    file1.txt: This is a line containing the pattern.

    file2.txt: This is another line with the pattern.

    ```


    ## Look


    The look command is used to quickly find lines that start with a specific prefix.
    It is particularly useful when searching through sorted files.


    - 1. Enter look "prefix" file.txt to find all lines starting with "prefix".

    - 2. Use look -b "prefix" file.txt to show the byte offset of the matching lines.


    ```

    $ look "prefix" file.txt

    prefix-based line

    prefix-based line

    ```


    The look command can also be used with regular expressions to find more complex
    patterns. For example, look -E "pattern" file.txt will find all lines that match
    the regular expression.


    ```

    $ look -E "pattern" file.txt

    pattern-matching line

    pattern-matching line

    ```


    ## Aspell


    The aspell is a powerful spellchecker that has a -c option that lets you interactively
    check a file for spelling errors. This highlights errors and suggests alternatives
    that you can choose to replace or ignore each word in turn:


    - 1. Enter aspell -c ballad.txt to begin the spellchecker for this

    - 2. Type the number against a suggested replacement to immediately replace the
    highlighted word with it


    ```

    $ aspell -c ballad.txt

    The sky above my head became

    Like a casque of scorching steel;

    And, though I was a soul in pain,

    My pain I could not feel.

    ```


