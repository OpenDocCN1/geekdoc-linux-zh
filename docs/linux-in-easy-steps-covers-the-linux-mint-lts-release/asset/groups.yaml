- md: '

    # Editing the Menu


    Like many things in the Linux Mint operating system, the (Start) Menu can be customized
    to suit your personal taste:


    - 1. Right-click on the **Menu** button, at the far left of the Taskbar, then
    select the **Configure...** option

    - 2. Click the **Panel** button and select from the available options to adjust
    Appearance and Behavior. For example, change the Menu''s **Text** value


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_37_0.png)


    The **“Super”** key refers to the special key on your keyboard. Typically, this
    is the Windows Key. Press it to open the Menu, then press it again to close the
    Menu.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_37_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_37_2.png)


    - 3. See that your selected options are instantly applied to the Menu


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_37_3.png)


    - 4. Click the **Menu** button in the “Menu” window, then click the **Open the
    menu editor** button ...cont''d)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_1.png)


    You can click the hamburger button and save your Menu settings as a file, which
    can be imported later to resume those settings.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_2.png)


    - Slide all toggle switches to the “Off” position to simplify the Menu


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_3.png)


    - Now, click the Open menu editor button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_4.png)


    - Click any category in the left-hand pane, then select Menu items in the right-hand
    pane,


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_5.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_6.png)


    You can uncheck individual items to remove them from the Menu and click the Restore
    System Configuration button to resume its default appearance.


    # Installing Updates


    Having set up Timeshift to make regular backups of your Linux Mint system (see
    page 22), it is recommended that you regularly apply all updates for your system:


    - Connect your PC to the internet, then click Menu, Administration, Update Manager
    to open an “Update Manager” window


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_0.png)


    A “Welcome” screen may appear when you first open the Update Manager. Click its
    OK to proceed.


    - If the Update Manager suggests you switch to a local mirror server, click this
    OK


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_1.png)


    - Enter your password, then click the Authenticate button to open a “Software
    Sources” dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_2.png)


    Previous versions of Linux Mint recommended you perform selective updates, in
    case they introduce problems. Timeshift changed that, as you can restore your
    system.


    - Double-click in the Main (area) box and select a local mirror from the list
    that appears, then click Apply


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_3.png)


    - Now, select a local mirror for the Base (bionic) box, then click OK to close
    the “Software Sources” dialog. Wait while the software list gets updated, then
    return to the “Update Manager” window. Click the Select All button, then click
    Updates


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_40_0.png)


    Take a little time to update the cache and download updates, so it is important
    to choose a fast local server.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_40_1.png)


    If additional packages are required, click OK. Enter your password, click the
    Authenticate button – Linux Mint will now download and install available updates.![](img/7b6ecabd34062cd153290258f3b9cd5b_40_2.png)


    Notice that in Linux Mint the updates are referred to as “packages”. These are
    managed by the Synaptic Package Manager, which can be found in the Administration
    category on the Menu.![](img/7b6ecabd34062cd153290258f3b9cd5b_40_3.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_40_4.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_40_5.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_40_6.png)


    # Closing the Desktop


    - 1. Click Menu, then click the "Lock screen" button to instantly close the Desktop.

    - 2. See the screensaver fill the screen so your PC cannot be used.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_41_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_41_1.png)


    You can also lock the screen using the **Ctrl + Alt + L** shortcut. To discover
    more Linux Mint shortcuts, click **Menu**, **Preferences**, **Keyboard** to open
    the “Keyboard” window, then click the **Shortcuts** button. Select a category,
    such as **System**, in the left-hand pane to see available shortcuts in the right-hand
    pane.![](img/7b6ecabd34062cd153290258f3b9cd5b_41_2.png)


    - 3. Move your mouse when you want to unlock your PC, and you will be presented
    with a password request – enter your password to return to the Desktop.![](img/7b6ecabd34062cd153290258f3b9cd5b_41_3.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_41_4.png)


    You can click the **Switch User** button to log out – you will then see the **Log
    in** screen illustrated on page 26.


    You may sometimes want to log out of the Linux Mint operating system for security
    purposes or to switch users:


    - 1. Click Menu, then click the “Log Out” button to see a “Session” options dialog
    appear.![](img/7b6ecabd34062cd153290258f3b9cd5b_42_0.png)


    - 2. Click the Log Out option button, or the Switch User option button, to see
    the Log in screen appear.![](img/7b6ecabd34062cd153290258f3b9cd5b_42_1.png)


    > Hot tip: The Switch User option saves your session state to allow someone else
    to log in. When they log out and you log back, you will be where you left off
    – your open apps will still be running. The Log Out option, on the other hand,
    ends the session and closes your open apps – when you log back in they will not
    be running.


    When you are going to be away from your PC for a long time you will probably want
    to shut down the operating system:


    - 1. Click Menu, then click the “Quit” button to see a “Shut down this system
    now?” options dialog appear.

    - 2. Click the Shut Down option button to exit Linux Mint and power off your PC.


    > Hot tip: The Suspend option stops all apps, and the system state is saved in
    RAM as your PC goes into low-power mode. Hit any key to awaken the PC exactly
    where you left off.![](img/7b6ecabd34062cd153290258f3b9cd5b_42_2.png)


    # Summary


    - Unless the “Log in automatically” option was selected during installation, the
    Log in screen will request your password whenever you start.

    - The Linux Mint GUI comprises a Desktop and Taskbar.

    - The Desktop contains shortcuts and background wallpaper.

    - The Taskbar contains a Menu button, Show Desktop button, app launchers, and
    the System Tray.

    - The System Tray provides access to User Info, Network Status, Battery Status,
    Time & Date, and Volume Control.

    - The Desktop can be configured to have different wallpaper and to contain Shortcut
    icons.

    - Desklets are small apps that run on the Desktop.

    - Hovering the mouse cursor over the Taskbar icon of a running app will display
    a Thumbnail Preview of that app.

    - Useful applets can be added to the Taskbar panel.

    - App launchers are grouped by category on the Menu.

    - App launchers can be added to the Taskbar and Desktop.

    - The Menu can be configured to customize its Appearance and its Behavior.

    - With the Timeshift backup utility enabled, all updates can be regularly applied
    with the Update Manager.

    - Selecting local mirrors as Software Sources usually allows updates to be downloaded
    faster.

    - The Desktop can be closed by switching to the Lock screen for security.

    - The Log Out option and Switch User option closes the Desktop and opens the Log
    in.

    - The Shut Down option closes the Desktop and powers off the PC.

