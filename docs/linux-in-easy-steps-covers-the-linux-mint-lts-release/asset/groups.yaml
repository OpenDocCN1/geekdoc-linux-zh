    ## 编辑图像


    Linux 中主要的图像编辑应用是 GIMP (GNU Image Manipulation Program)，标准安装中包含超过 220 多个插件。这些插件为
    GIMP 提供了许多 Adobe Photoshop 的功能，但不支持 CMYK 颜色的原生支持。


    GIMP 具有高度的可配置性和强大的脚本支持，但其外观独特，将工具放置在与您处理的图像不同的窗口中。GIMP 可用于编辑图像和创建吸引人的网页图形：![](img/7b6ecabd34062cd153290258f3b9cd5b_115_0.png)


    GIMP 图像编辑器![](img/7b6ecabd34062cd153290258f3b9cd5b_115_png)


    - 1. 点击“菜单、图形、GNU图像处理程序”启动应用 – 看到一个空白 GIMP 窗口和一个“工具箱 (Toolbox)”窗口

    - 2. 在 GIMP 窗口中，点击“文件、新建 (New)”启动“新建图像”对话框

    - 3. 在“新建图像”对话框中，设置宽度为 600px，高度为 240px

    - 4. 展开“高级选项 (Advanced Options)”并设置“填充透明”，然后点击“确定” – 看到新图像出现在 GIMP 窗口中

    - 5. 在 GIMP 窗口中，点击“选择、全部 (All)”选择整个区域，然后点击“圆角矩形 (Rounded Rectangle)” – 将角半径设置为
    50%

    - 6. 点击“工具箱”中的颜色块打开“更改颜色 (Change Color)”窗口 – 然后在 HTML 框中将前景设为 #f3f28，背景设为 #f5d087

    - 7. 选择“油漆桶填充 (Bucket Fill)”点击图像中的选定区域 – 用颜色填充该区域


    如果工具箱窗口不可见，点击 GIMP 窗口中的“窗口、新建工具箱”让其出现![](img/7b6ecabd34062cd153290258f3b9cd5b_115_2.png)


    在 GIMP 窗口中，点击“滤、光照和阴影、投影 (Drop Shadow)”启动“投影”对话框 – 设置 X 和 Y 偏移为 4，半径为 10，颜色为 #f3f28，不透明度为
    80


    选择“矩形工具 (Rectangle Tool)”从 X:20, Y:20 拖动到 X:580 选择一个区域，然后点击“圆角矩形” – 如前一样将角半径设置为
    50%


    选择“混合工具 (Blend Tool)”，从底部拖到顶部选定区域 – 应用从前景到背景的线性渐变


    现在，将前景设为 #FFFFFF，然后选择“文本工具 (Text Tool)”点击选定区域 – 输入“Web 2.0”


    选择所有文本并将字体大小调整为 120，然后拖动文本使其位于图像中心


    在 GIMP 窗口中，点击“层、向下合并 (Merge Down)”将层合并到图像


    点击“文件、导出 (Export)”并命名为 image.png，然后点击“导出”按钮保存图像


    右键点击保存的图像并选择“用图像查看器打开”查看外观![](img/7b6ecabd34062cd153290258f3b9cd5b_116_0.png)


    GIMP 可以读取许多图像类型 – 包括 Photoshop 生成的 PSD 文件![](img/7b6ecabd34062cd153290258f3b9cd5b_116_1.png)


    对于没有经验的用户来说，某些 GIMP 插件的结果可能没有 Photoshop 那么可预测。


    ```

    button.png

    文件 编辑 视图 帮助

    <- [ ] [ ] [ ] [ ]

    100 x 42 像素 4.6 kB 100% 1/8

    ```

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_116_2.png)


    ## 模拟 Photoshop


    GIMP 应用是一个很棒的，但许多熟悉 Adobe Photoshop 的人认为其默认界面并不友好![](img/7b6ecabd34062cd153290258f3b9cd5b_117_0.png)


    然而，可以使用自定义主题替换默认的 GIMP 配置文件夹以模拟 Photoshop 的视觉效果。用于此目的流行的 GimpPs 主题可以在 GitHub 仓库获取，这需要在系统中安装
    Git 软件包才能克隆 GimpPs 主题。原始 GIMP 配置文件夹的备份、Git 软件包的安装以及 GimpPs 主题的克隆可以通过 Linux Terminal
    中的命令轻松实现：


    GimpPs 主题支持 GIMP 2.8，在其他版本上可能失败。安装说明在编写时是正确的，但可能会发生变化。可以在 github.com/doctormo/GimpPs
    找到更多详情。


    - 点击**菜单、管理、终端 (Menu, Administration, Terminal)** 启动命令行“终端”窗口

    - 在提示处，精确地输入此命令重命名 GIMP 配置文件夹 – 并创建备份 `mv ~/gimp-2.8 ~/gimp-2.8-backup`

    - 接下来，输入此命令安装 Git 软件包 `sudo apt-get install git-all`


    ## 续


    输入您的密码，然后在被问及时按 Y 键并按回车继续安装![](img/7b6ecabd34062cd153290258f3b9cd5b_118_0.png)


    完成后，精确地输入此命令从 GitHub 仓库克隆主题文件夹

    sh - c "$curl -fSL https://raw.githubusercontent.com/doctormo/GimpPS/master/tools/install.sh"


    这里的反斜杠字符仅允许命令继续到下一行![](img/7b6ecabd34062cd153290258f3b9cd5b_118_1.png)


    ```

    mike@linuxpc:~$ sh - c "$curl -fSL https://raw.githubusercontent.com/doctormo/GimpPS/master/tools/install.sh"

    Cloning Gimps...

    Cloning into /home/make/gimp-2.8...

    remote: Counting objects: 81, done.

    remote: Compressing objects: 100% (78/78), done.

    remote: Indexing objects: 100% (delta 1)

    Unpacking objects: 100% (81/81), done.

    Gimps successfully installed

    ```


    克隆会创建一个配置文件夹。可以使用两个命令恢复备份

    rm - r ~/gimp-2.8

    mv ~/gimp-2.8-BAK ~/gimp-2.8


    点击“菜单、图形、GNU图像处理程序”启动 GIMP 应用 – 看到窗口布局和感觉现在模拟了 Photoshop


