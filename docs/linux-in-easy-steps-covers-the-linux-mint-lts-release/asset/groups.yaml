  - '[PAGE 45]


    # Selecting Appearance


    By default, your Linux Mint Desktop will automatically switch to the screensaver
    if you do not interact with your PC for a while. This means you may frequently
    have to enter your password to return to the Desktop and is unnecessary if your
    PC is located in an environment where security is not a concern. Fortunately,
    you can disable this behavior so the Desktop will always be visible unless you
    choose to explicitly lock the PC.


    You may also choose how the screen appears by selecting a custom screensaver,
    and you can add a message to the Lock screen:


    +   1. Click Menu, Preferences, Screensaver to open a “Screensaver” window


    +   2. Next, click the Settings button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_45_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_45_1.png)


    Notice that you can choose to extend the delay before the screensaver will appear
    if you don’t want to totally disable the screensaver.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_45_2.png)


    +   3. Now, open the drop-down menu for “Screensaver settings” and select the
    Never option – to stop your PC automatically switching to the Lock screen


    +   4. Click the Screensaver button'
