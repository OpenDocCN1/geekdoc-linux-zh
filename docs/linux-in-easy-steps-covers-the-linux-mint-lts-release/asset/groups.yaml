    # Working with Accounts


    User accounts are administered by the superuser. The useradd command will create
    a new user of a specified name, the usermod command can modify a specified user,
    and the userdel command can delete a specified user. A''s login password can be
    changed by the passwd command. The user''s full name can be changed by the chfn
    command, and their default shell program can be changed by the chsh command. Each
    user may employ these to change their own details, or the superuser can change
    the user''s details.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_173_0.png)


    Never change any aspect of the root user account.


    +   Enter the command sudo useradd tony and your regular user password to create
    a new user named "tony"


    +   Next, enter the command sudo usermod -l tony to rename the user "tony" to
    "toni", then enter the command sudo passwd tony and set a login password


    +   Issue the command sudo chfn tony and enter the full name of this user, then
    issue the command sudo chsh tony and enter /bin/bash to set the bash program as
    the default


    +   Enter the command pinky -l tony to see this user''s details


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_173_1.png)


    The user''s personal information details are typically more extensive than the
    brief details in this example - they are simplified for brevity.


    ```

    mike@linux-pc:~ # sudo useradd tony

    [sudo] password for mike:

    mike@linux-pc:~ $ sudo usermod -l tony

    mike@linux-pc:~ $ passwd tony

    Enter new UNIX password:

    Retype new UNIX password:

