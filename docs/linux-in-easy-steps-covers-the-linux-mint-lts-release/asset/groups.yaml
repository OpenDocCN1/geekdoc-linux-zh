    ## Setting Access Permissions


    The ls -l long command reveals the access permissions of each item in the current
    directory as a string of 10 characters at the start of each line. The first is
    a d for a directory, or a dash for a file, followed by sequential Read (r), Write
    (w) and Execute (x) permissions for the owning User, Group, and Others. In the
    listing below, a script may be Read and Executed by everyone and the owner may
    also Write to it. The owner can both Read and Write a text file, others may only
    Read. Other text files may be Read or Written to by their respective owners.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_175_0.png)


    Notice that this is a member of the group named "fund" that was created on page
    173.


    ```

    mike@linux-pc:~# mkdir mike

    mike@linux-pc:~$ ls -lt

    total 26

    -rw-r--r-- 1 tony 34 Jul 26 07:49 toni-scripts

    -rw-xr-x 1 andy 48 Jul 26 07:48 andy-notes

    --rw-r--r-- 1 dave 44 Jul 26 07:47 dave-notes

    -rw-r--r-- 1 mike 30 Jul 26 07:47 mike-notes

    -rw-r--r-- 1 tony 37 Jul 26 07:46 toni-notes

    mike@linux-pc:~$ cat tony-notes

    Here are Toni''s notes to remember...

    mike@linux-pc:~$ cat dave-notes

    cat: Permission denied

    cat dave-notes: Permission denied

    Here are Mike''s thoughts of the day...

    mike@linux-pc:~$

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_175_1.png)


    See page 72 for more on access permissions.


    Each set of permissions can also be described numerically Read = 4, Execute =
    1. For instance, a value of 7 describes permissions to Read, Write and Execute
    (4 + 2 + 1), 6 describes permissions to Read, Write Execute (4 + 2), and so on.


    Permissions can be changed at a shell prompt with the chmod command, stating the
    permission values and the file name as its arguments. For example, the command
    chmod 777 myfile sets full permissions for a file named "myfile". You must first
    root superuser with the sudo command if you are not the owner. The chgrp command
    can be used to change the group membership of a file by stating the group name
    and the file name as its arguments. Similarly, the chown command can specify a
    username and the file name to change the user ownership.


    Enter chmod 644 mike-notes to allow everyone to read this owned file, then enter
    sudo chown mike andy-notes to change ownership of that file - so this user can
    read it.


    Next, enter sudo usermod -G fund dave, to make the user "dave" a member of the
    group named "fund", then enter sudo chgrp fund dave-notes to change the file''s
    group.


    Now, enter sudo chmod 640 dave-notes, to allow all members of the group to read
    this file, then reboot the system to apply the group permissions.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_176_0.png)


    Do not fall into the habit of setting everything to permissions of 777 thoughtfully
    to maintain useful restrictions.


    ```

    mike@linux-pc:~/Docs

    File Edit View Search Terminal Help

    mike@linux-pc:~/Docs whoami

    mike

    mike@linux-pc:~/Docs chmod 644 mike-notes

    mike@linux-pc:~/Docs sudo chmod 644 -G fund andy-notes

    mike@linux-pc:~/Docs sudo usermod -G fund dave

    mike@linux-pc:~/Docs sudo chgrp fund dave-notes

    mike@linux-pc:~/Docs sudo chmod 640 dave-notes

    mike@linux-pc:~/Docs reboot#

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_176_2.png)


    When the system has restarted, issue is ls -l to see the changes, then read the
    files where access previously denied.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_176_3.png)


    ```

    mike@linux-pc:~/Docs

    File Edit View Search Terminal Help

    mike@linux-pc:~/Docs ls -l

    total 25

    -rw-r--r-- 1 mike andy 48 Jul 26 08:47 andy-notes

    -rw-r--r-- 1 fund dave 44 Jul 26 08:47 dave-notes

    -rw-r--r-- 1 mike 50 Jul 26 08:47 mike-notes

    -rw-r--r-- 1 tom 31 Jul 26 08:47 tom-notes

    -rw-r--r-- 1 tony 30 Jul 26 08:47 toni-notes

    mike@linux-pc:~/Docs$ cat dave-notes

    Here are some pearls from Dave...

    mike@linux-pc:~/Docs$ cat andy-notes

    Here are some acts from Andy...

    mike@linux-pc:~/Docs$

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_176_4.png)


    ## Controlling Processes


    A Linux system has many processes running at any time representing open apps,
    shell jobs, and background services. Each process has a unique PID (Process ID)
    number. We can see a list of every current process with the ps -e command, or
    for a particular user, with ps -u followed by the username. The owner can terminate
    a process by stating its PID as the kill command. Open a Terminal window, then
    enter a command to begin a new process – for example, to start the ftp program.


    ```

    mike@linux-pc:~ $ ftp speedtest.tele2.net

    Connected to speedtest.tele2.net.

    vsFTPD 2.3.5).

    Name (speedtest.tele2.net): anonymous

    Please specify the password.

    Password:

    Login successful.

    Remote system type is UNIX.

    Using binary mode to transfer files.

    ftp>

    ```


    Next, open a second Terminal window, then enter the command ps -e to see a list
    of all processes.


    ```

    mike@linux-pc:~ $ ps -e

    PID TTY TIME CMD

    1 00:00:02 system

    2 00:00:00 kthread

    3 00:00:00 kworker/0

    4 00:00:00 percpu_wq

    5 00:00:00 kworker/u

    6 00:00:05 sched

    7 00:00:00 rcu_bh

    8 00:00:00 migration/0

    10 00:00:00

    ```


    Each PID is dynamically allocated by the operating system when a process is launched,
    to identify that process instance. Scroll down the list to find the Terminal windows
    listed as “pseudo terminals” named as pts/0 and pts/1.


    Now, enter the command ps -e | grep pts to refine the list to just the processes
    running in each Terminal window. See that the first number against each listed
    process is its PID number - the ftp program is PID 2627 in this case.


    ```

    mike@linux-pc:~$ ps -e | grep pts

    2619 p/0 00:00:00 bash

    2627 p/0 00:00:00 ftp

    2826 p/1 00:00:00 bash

    3163 p/1 00:00:00 ps

    3164 p/1 00:00:00 grep

    ```


    Highlighted here are the ftp process PID and the message in the first window after
    you issue a kill command. Enter the command kill 2627 to terminate the ftp process
    in the first window.


    ```

    mike@linux-pc: ~$ ftp speedtest.tele2.net

    Connected to speedtest.tele2.net.

    vsSFTP 2.3.5).

    Name (speedtest.tele2.net:mike): anonymous

    Please specify the password.

    Password:

    Login successful.

    Remote system type is UNIX.

    /usr/bin/binary mode to transfer files.

    ftp> Terminated

    mike@linux-pc: ~$

    ```


    Enter the command ps -e | grep pts once to see the process is no longer in the
    list.


    ```

    mike@linux-pc:~$ kill 2627

    ps -e | grep pts

    2619 p/0 00:00:00 bash

    2826 p/1 00:00:00 bash

    3205 p/1 00:00:00 ps

    3206 p/1 00:00:00 grep

    ```


    > Hot tip: At a prompt you can enter the top command to view the most active processes
    - press the Q to quit.


    ## Exploring the Network


    In much the same way each house on a street has a unique address, every computer
    can be addressed for direct communication, every computer on a network has a unique
    number, known as its IP (Internet Protocol) address, which can be used to directly
    communicate with a particular computer. You can discover the IP address of the
    computer by stating the URL as the argument to the host command. In some cases,
    for large-scale websites, this may reveal multiple IP addresses:


    ```

    mike@linux-pc:- $ host www.google.com

    www.google.com has address 216.58.289.94

    www.google.com has IPv6 address 2607:f8b0:4007::2004

    mike@linux-pc:- $

    ```


    Add -a option to a host command to see all information about that host. The most
    basic test to see if another computer is reachable across the network sends tiny
    packets packets to IP address using the ping command. This continues sending packets
    until you stop it, but may limit the number of packets by adding a -c option stating
    the total number of packets to send.


    The IP address used here is one of those for the Google URL - revealed by the
    host command in Step 1.


    ```

    mike@linux-pc:- $ ping -c 3 216.58.209.4

    PING 216.58.209.4 (216.58.209.4): 64 bytes of data.

    64 bytes from 216.58.209.4: icmp_seq=1 ttl=12.6 ms

    64 bytes from 216.58.209.4: icmp_seq=2 ttl=13.7 ms

    64 bytes from 216.58.209.4: icmp_seq=3 ttl=13.3 ms

    -

    216.58.209.4 ping statistics

