- md: "\n## Handling Archives\n\nThe traditional file compression tool in Linux uses\
    \ the gzip command to compact one or more files into a single archive – adding\
    \ a \".gz\" file extension and replacing the original files. Its companion bzip2\
    \ can be used to extract files from an archive created with gzip – replacing the\
    \ compressed archive:\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_169_0.png)\n\
    \n- 1. Enter du -b ele to learn the byte size of local files whose names begin\
    \ “ele” – in this case it is named ele.txt\n- 2. Next, enter gzip elegy.txt to\
    \ create a compressed archive of that file – named with an added \".gz\" file\
    \ extension\n- 3. Now, use a further du -b ele to compare the file size of the\
    \ compressed archive to the original file\n- 4. Enter gunzip elegy.txt to extract\
    \ the original file\n\n```\nmike@linux-pc:~$ du -b ele\n6239 elegy.txt\nmike@linux-pc:~$\
    \ gzip elegy.txt\nmike@linux-pc:~$ du -b ele\n3693 elegy.txt\nmike@linux-pc:~$\
    \ gunzip elegy.txt\nmike@linux-pc:~$ ele\n```\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_169_1.png)\n\
    \nA bzip2 archive file size is smaller than gzip and zip archives – notice the\
    \ size of the archives in these examples.\n\nThe modern bzip2 compression tool\
    \ gets better compression than gzip but is less widely used – distributing bzip2\
    \ archives may not find universal acceptance. It works like the gzip tool, but\
    \ adds \".bz\" file extension and has a companion bzip2 uncompressor:\n\n- 5.\
    \ Enter du -b ele to learn the byte size of local files whose names begin “ele”\
    \ – in this case it is named ele.txt\n- 6. Next, enter bzip2 elegy.txt to create\
    \ a compressed archive of that file – named with an added \".bz\" file extension\n\
    - 7. Now, use a further du -b ele to compare the file size of the compressed bzip2\
    \ archive to the original file\n\n## ...cont'd\n\nEnter bunzip2 elegy.txt.bz2\
    \ to extract the original file – being sure to include the added \"bz2\" file\
    \ extension\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_170_0.png)\n\nCompressed\
    \ archives created in Windows systems invariably use the zip compression format.\
    \ In Linux systems their contents can be extracted by the unzip command and archives\
    \ created for distribution to Windows users with the unzip command does not delete\
    \ the archive file after extraction:\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_170_1.png)\n\
    \nEnter zip elegy.elegy.txt to specify the archive name and the file it should\
    \ contain in compressed form\n\nThe zip command requires the archive name as its\
    \ first argument, followed by a list of files to be included in that archive.\n\
    \nIssue another -du ele* command to compare file sizes, then enter unzip elegy.zip\
    \ to extract the archive contents\n\nWhen asked, choose the \"r\" option, then\
    \ rename the extracted file elegy.unzipped – to differ from the original\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_170_2.png)\n\
    \n```\nmike@linux-pc:~/Data\nunzip elegy.elegy.txt\nadding: elegy.txt (deflated\
    \ 52%)\ndu -bu ele*\n6239 elegy.txt\n3191 elegy.zip\nunzip - elegy.zip elegy.txt\n\
    Archive: elegy.txt\nreplacing Iyles, jojo, [A]1, [None], [rename:\nnew name: elegy.unzipped\n\
    inflating: elegy.unzipped\nmike@linux-pc:~/Data$\n```\n\nUse a -c option with\
    \ gunzip, bunzip2, or unzip commands to display the content of compressed text\
    \ files on standard output.\n\n## Examining File Systems\n\nA Linux system may\
    \ span multiple hard disks and extend across many disk partitions. Each partition\
    \ is represented by a special file in the /dev directory – typically, /dev/sda1\
    \ may represent the first partition on your master hard drive. During installation\
    \ of the Linux operating system, each partition is formatted as a persistent storage\
    \ \"file system\" on the hard drive in which files can be stored and recalled.\
    \ Similarly, media drives are formatted with their own file systems in which to\
    \ store data. Media drives must be \"mounted\" onto the Linux file tree in order\
    \ to make them accessible, and this can be achieved automatically:\n\n- 1. Click\
    \ Menu, Accessories, Files – to open the \"Nemo\" file manager\n- 2. In Nemo,\
    \ click Edit, Preferences, Behavior, then scroll down to the \"Media Handling\"\
    \ category\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_171_0.png)\n\n- 3. Now,\
    \ ensure that the option to \"Automatically remove removable media when inserted\
    \ and on startup\" is selected\n- 4. Click the Close button to confirm the selection\
    \ and to close the \"File Management Preferences\" dialog\n\nThe df disk free\
    \ command shows how file systems are being used by indicating free space. A -h\
    \ option to make the output more understandable and -t option to display file\
    \ system types:\n\n- 5. Insert a flash drive into your device\n- 6. Open a Terminal,\
    \ then enter the command df -hT to discover how the file system currently appears\n\
    \n## ...cont'd\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_172_0.png)\n\nHard\
    \ drives are mounted on /dev/sda1 and /dev/sdb1 were automatically mounted on\
    \ the Linux tree during the boot process, and the media drive on /dev/sda2 was\
    \ automatically mounted when the flash drive was inserted into the device. A file\
    \ system can be manually unmounted using the umount command to perform without\
    \ fear of corruption. For instance, the superuser can run the fsck command to\
    \ check for integrity and errors: see there are many items of the \"tmpfs\" type,\
    \ but these are merely temporary storage facilities in volatile memory.\n\n- 7.\
    \ Enter umount /dev/sdb1 to unmount the file system\n- 8. Now, issue the command\
    \ fsck /dev/sdb1 to check the file system for errors\n- 9. When the check completes,\
    \ remove the flash drive and reinsert it into the port\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_172_1.png)\n\
    \nThe fsck command uses the same checker that is used during the boot process\
    \ prior to the mounted on devices:\n\n## Working with Accounts\n\nUser accounts\
    \ are administered by the superuser. The useradd command will create a new user,\
    \ the usermod command can modify a specified user, and the userdel command can\
    \ delete a specified user. The user's password can be changed by the passwd command.\
    \ The user's full name can be changed by the chfn command, and their default shell\
    \ can be changed by the chsh command. Each user may employ these to change their\
    \ own details, or the superuser can change the user's details.\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_173_0.png)\n\
    \nNever change any aspect of the root account.\n\n- Enter the command sudo useradd\
    \ tony and your regular password to create a new user named \"tony\"\n- Next,\
    \ enter the command sudo usermod -l tony to rename the user \"tony\" to \"toni\"\
    , then enter the command sudo passwd tony and set a login password\n- Issue the\
    \ command sudo chfn tony and enter the full name of this user, then issue the\
    \ command sudo chsh tony and enter /bin/bash to set the bash program as the default\n\
    - Enter the command id -l tony to see this user's details\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_173_1.png)\n\
    \nThe user's personal information details are typically more extensive than the\
    \ brief details in this example - they are simplified for brevity.\n\n```\nmike@linux-pc:~\
    \ # sudo useradd tony\n[sudo] password for mike:\nmike@linux-pc:~$ sudo usermod\
    \ -l tony\nmike@linux-pc:~$ passwd tony\nEnter new UNIX password:\nRetype new\
    \ UNIX password:\npasswd: password updated successfully\nmike@linux-pc:~$ sudo\
    \ chfn tony\nChanging the user information for tony\nEnter the new value, or press\
    \ ENTER for the default\nFull Name []: Antonia Smith\nmike@linux-pc:~$ sudo chsh\
    \ tony\nChanging the login shell for tony:\nEnter the new value, or press ENTER\
    \ for the default\nLogin Shell: [/bin/sh]\nmike@linux-pc:~$ id -l tony  In real\
    \ life: Antonia Smith\ndirectory: /home/tony\nShell: /bin/sh\nmike@linux-pc:~$\n\
    ```\n\n## ...cont'd\n\nA \"group\" is a set of user accounts whose rights can\
    \ be modified simultaneously by the superuser. For example, a group may be granted\
    \ permission to access a previously inaccessible file – all users who are members\
    \ of that group are then allowed access.\n\nAny user can discover which groups\
    \ they belong to with the groups command and specify a username as its argument\
    \ to reveal the group membership of one particular user. The superuser can employ\
    \ the groupadd command to specify the name of a new group, or groupmod -n to change\
    \ the name of an existing group, or groupdel to delete a specified group. The\
    \ superuser can also add a user to an existing group with the usermod -G command\
    \ stating the group name and username as its arguments:\n\n- 5. Enter the command\
    \ groups tony to discover that this user is only a member of a group named \"\
    tony” – added when the user account was created\n- 6. Enter the command sudo groupmod\
    \ -n tony tony to change the group name to match the modified username\n- 7. Enter\
    \ sudo groupadd fund to create a new group named \"fund\", then enter sudo usermod\
    \ -G fund tony to make the user a member of the new group\n- 8. Issue the command\
    \ groups tony once more to see all groups of this user is now a member\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_174_0.png)\n\
    \n> Hot tip Group information is typically stored in a file at /etc/group that\
    \ lists all group names, together with a comma-separated list of users belonging\
    \ to each group.\n\n```\nmike@linux-pc: ~ \nFile Edit View Search Terminal Help.\n\
    mike@linux-pc:~$ groups tony\ntony : tony\nmike@linux-pc:~$ sudo groupmod -n tony\
    \ tony\nmike@linux-pc:~$ sudo groupadd fund\nmike@linux-pc:~$ sudo usermod -G\
    \ fund tony\nmike@linux-pc:~$ groups tony\ntony : tony fund\nmike@linux-pc:~$\
    \ _\n```\n"
  mdcn: "\n\n## 处理归档\n\nLinux 中传统的文件压缩工具使用 `gzip` 命令将一个或多个文件压缩成单个归档——添加 \".gz\" 文件扩展名并替换原始文件。它的伴侣\
    \ `bzip2` 可用于从由 gzip 创建的归档中提取文件——替换压缩后的归档：\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_169_0.png)\n\
    \n- 1. 输入 `du -b ele` 来学习以“ele”开头的本地文件的字节大小——在这种情况下，它名为 ele.txt\n- 2. 接下来，输入 `gzip\
    \ elegy.txt` 创建该文件的压缩归档——文件名带有添加的 \".gz\" 扩展\n- 3. 现在，再次使用 `du -b ele` 比较归档与原始文件的大小\n\
    - 4. 输入 `gunzip elegy.txt` 提取原始文件\n\n```\nmike@linux-pc:~$ du -b ele\n6239 elegy.txt\n\
    mike@linux-pc:~$ gzip elegy.txt\nmike@linux-pc:~$ du -b ele\n3693 elegy.txt\n\
    mike@linux-pc:~$ gunzip elegy.txt\nmike@linux-pc:~$ ele\n```\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_169_1.png)\n\
    \nbzip2 归档文件的大小比 gzip 和 zip 归档更小——注意这些示例中归档的大小。\n\n现代 bzip2 压缩工具比 gzip 有更好的压缩率，但使用并不广泛——分发\
    \ bzip2 归档可能无法获得普遍接受。它的工作方式类似：\n\n- 5. 输入 `du -b ele` 来学习以“ele”开头的本地文件的字节大小——在这种情况下，它名为\
    \ ele.txt\n- 6. 接下来，输入 `bzip2 elegy.txt` 创建该文件的压缩归档——文件名带有添加的 \".bz\" 扩展\n- 7.\
    \ 现在，再次使用 `du -b ele` 比较 bzip2 归档与原始文件的大小\n\n## ...续\n\n输入 `bunzip2 elegy.txt.bz2`\
    \ 提取原始文件——确保包含添加的 \"bz2\" 文件扩展\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_170_0.png)\n\
    \nWindows 系统创建的压缩归档始终使用 zip 压缩格式。在 Linux 系统中，可以通过 `unzip` 命令提取其内容，而使用 `unzip`\
    \ 命令为分发给 Windows 用户创建归档在提取后不会删除归档文件：\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_170_1.png)\n\
    \n输入 `zip elegy.elegy.txt` 指定归档名称及其应以压缩形式包含的文件。\n\n`zip` 命令要求归档名称作为第一个参数，随后是要包含在该归档中的文件列表。\n\
    \n执行另一个 `-du ele*` 命令比较文件大小，然后输入 `unzip elegy.zip` 提取归档内容。\n\n当询问时，选择 \"r\" 选项，然后将提取的文件重命名为\
    \ `elegy.unzipped`——以区分原始文件。\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_170_2.png)\n\
    \n```\nmike@linux-pc:~/Data\nunzip elegy.elegy.txt\nadding: elegy.txt (deflated\
    \ 52%)\ndu -bu ele*\n6239 elegy.txt\n3191 elegy.zip\nunzip - elegy.zip elegy.txt\n\
    Archive: elegy.txt\nreplacing Iyles, jojo, [A]1, [None], [rename:\nnew name: elegy.unzipped\n\
    inflating: elegy.unzipped\nmike@linux-pc:~/Data$\n```\n\n使用 `gunzip`、`bunzip2`\
    \ 或 `unzip` 命令的 `-c` 选项在标准输出显示压缩文本文件的内容。\n\n## 检查文件系统\n\nLinux 系统可能跨越多个硬盘并扩展到许多磁盘分区。每个分区由\
    \ `/dev` 目录下的一个特殊文件表示——通常，`/dev/sda1` 可能代表主硬盘上的第一个分区。在安装 Linux 操作系统期间，每个分区被格式化为硬盘上的持久存储“文件系统”，在其中可以存储和找回文件。同样，介质驱动器也被格式化为它们自己的文件系统以存储数据。介质驱动器必须“挂载”到\
    \ Linux 文件树上才能访问，这可以通过自动实现：\n\n- 1. 点击 菜单、 辅助工具、文件 – 以打开“Nemo”文件管理器\n- 2. 在 Nemo\
    \ 中，点击编辑、偏好设置、行为，然后向下滚动到“介质处理”类别\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_171_0.png)\n\
    \n- 3. 现在，确保选中了“在插入和启动时自动移除可移动介质”选项\n- 4. 点击关闭按钮确认选择并关闭“文件管理偏好设置”对话框\n\n`df` 命令通过指示可用空间显示文件系统的使用情况。`-h`\
    \ 选项使输出更易于理解，`-t` 选项显示文件系统类型：\n\n- 5. 插入闪存驱动器到设备\n- 6. 打开终端，然后输入命令 `df -hT` 查看文件系统状态\n\
    \n## ...续\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_172_0.png)\n\n硬盘 `/dev/sda1`\
