    # Invoking the Terminal


    At the very heart of the Linux operating system is a core series of machine instructions
    known as the “kernel” – this is a technical program that is not user-friendly,
    as it is mainly designed to communicate with electronic components. A Linux “shell”
    is a facility that allows the user to communicate directly with the kernel in
    a human-readable format. It translates command-line instructions so they can be
    processed.


    Most Linux distros include several shell programs that offer different features.
    The default Linux shell program, however, is called Bash (Bourne Again Shell),
    which is an updated version of the original Bourne shell found in the Unix operating
    system.


    The shell understands a large number of commands, and each has a number of “options”
    that may (optionally) be specified to modify their behavior – usually these are
    prefixed by a hyphen. Many also accept “arguments” that provide data to be used
    by the command. The typical syntax of a shell command looks like:


    ```

    command -option argument

    ```


    Shell commands can be executed at a prompt in a Terminal window on a graphical
    desktop interface.


    +   1 Click Menu, Administration, Terminal (or click the launcher on the Taskbar)
    to launch a Terminal window


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_141_0.png)


    Terminal


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_141_1.png)


    Hot tip

    You can learn more about Bash in the companion book in this series: Bash in easy
    steps.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_141_2.png)


    Options are not standardized – the same option can have different meanings for
    different commands.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_141_3.png)


    The Terminal window above displays the default bash command prompt and places
    the cursor after the prompt – ready to receive a command. The default prompt comprises
    the current user name (mike), a separator character (@), the host domain name
    (linux-pc), the current directory (~ tilde character denoting the Home directory),
    and a final terminating character ($).'
- md: "\nYou can confirm the current user and domain name at any time with the **whoami**\
    \ and **hostname** commands:\n\n- 2. Type the **whoami** command at a prompt,\
    \ then hit Return\n- 3. Now, type the **hostname** command and hit Return again\n\
    \n```\n$ mike@linux-pc:~$ whoami\nmike\nmike@linux-pc:~$ hostname\nhost\nmike@linux-pc:~$\
    \ $\n```\n\nCommands use lowercase only - in uppercase the command will not be\
    \ recognized.\n\nSome commands call upon individual programs that reside on your\
    \ system - for example, the **clear** command that removes previous content from\
    \ the Terminal. Others are “built-in” commands that are built into the shell itself\
    \ - for example, the **exit** command that quits the shell and closes the Terminal\
    \ window. You can determine whether a command is a builtin using the **type**\
    \ command and the command's name as its argument:\n\n- 4. Type **clear** and hit\
    \ Return to remove the previous content, then enter **type clear** and hit Return\
    \ again to discover the location of the **clear** command program\n- 5. Enter\
    \ **type exit** and hit Return to discover that the exit command is a shell builtin\
    \ instruction, then type the **exit** command and hit Return to quit the shell\n\
    \nType a **--help** argument (two hyphens) & “help”) after any command, then hit\
    \ Return, to see a list of options for that command.\n\n```\n$ mike@linux-pc:~$\
    \ clear\nclear is hashed (/usr/bin/clear)\nmike@linux-pc:~$ exit\nexit is a shell\
    \ builtin\nmike@linux-pc:~$ $\n```\n\n# Navigating at the Prompt\n\nWhen you start\
    \ a shell session you are, by default, located in your home directory of the Linux\
    \ file system. You can switch to any directory to which you have access permission\
    \ by stating its absolute address as the argument to the cd command. Similarly,\
    \ you can return to your home directory by stating its absolute address as the\
    \ argument to the cd command, or using its tilde alias with the command cd ~.\n\
    \nFor shorter hierarchical moves, the command cd .. moves up one level to the\
    \ parent directory of the current directory. Stating just the name of an immediate\
    \ sub-directory as the argument to the cd command moves down one level to that\
    \ sub-directory:\n\n- Launch a shell window when you enter the pwd command at\
    \ the prompt to print the current working directory\n- Enter the combined command\
    \ cd /etc; pwd to switch to the /etc directory and confirm it as the working directory\n\
    - Next, enter the combined command cd ~; pwd to return to the home directory and\
    \ confirm the location\n- Enter the combined command cd ..; pwd to switch to the\
    \ parent directory and confirm the location\n- Now, enter the combined command\
    \ cd mike; pwd to switch to the named sub-directory and confirm it\n\nThere must\
    \ be space between the command and its argument.\n\n```\nmike@linux-pc:~$ pwd\n\
    /home/mike\nmike@linux-pc:~$ cd /etc; pwd\n/etc\nmike@linux-pc:/etc$ cd -; pwd\n\
    /home/mike\nmike@linux-pc:~$ cd ..; pwd\n/home\nmike@linux-pc:/home$ cd mike;\
    \ pwd\n/home/mike\nmike@linux-pc:~$ \n```\n\nThe contents of the current directory\
    \ can be revealed using the ls command to display a list of its files and immediate\
    \ sub-directories. This is a comprehensive command that has many useful options:\n\
    \n- Use the -a option to see all directory contents – including hidden files and\
    \ sub-directories.\n- Use the -l option to see long format listing for each item\
    \ – including user and group ownership names.\n- Use the -t option to sort the\
    \ contents by the time they were created or last modified.\n- Use the -o option\
    \ to suppress group ownership details.\n\nOptions can be combined to produce a\
    \ complex option where each parameter is applied:\n\n- Enter the command cd \"\
    My Topics\" to move to an immediate sub-directory whose name contains a space\n\
    - Next, enter the ls command to simply list all contents\n- Enter the command\
    \ ls -alt to list all contents including hidden files, in long format, listed\
    \ by modification time – but with user and group suppressed\n\nDirectory names\
    \ that contain spaces must be enclosed in quotation marks when specified as a\
    \ command – avoid truncation.\n\n```\nmike@linux-pc:~$ cd \"My Topics\"\nmike@linux-pc:~$\
    \ ls -l \"My Topics\"\nls sample.txt\nmike@linux-pc:~$ ls -alt\ntotal 29\ndrw-xr-x--\
    \ 1 Jul 25 08:28\ndrw-rw-r-- 1 Jul 25 08:26 linux.txt\ndrw-r--r-- 1 Jul 25 08:26\
    \ sample.txt\ndrw-xr-x-- 2 Jul 25 08:28\ndrw-xr-x-- 3 Jul 25 08:25\n```\n\nAll\
    \ absolute directory addresses begin with a \"/\" as they descend from the root.\n\
    \n# Operating on Directories\n\nIt is sometimes useful to be able to extract the\
    \ name of a file, program, or directory from the end of a path using the basename\
    \ command. Conversely, you can use the dirname command to remove the final part\
    \ of the path address to a file – leaving the path to its parent directory.\n\n\
    The basename and dirname commands simply manipulate the path string – they do\
    \ not implement any action.\n\nA new directory can be created in the current directory\
    \ by specifying a directory name of your choice to the mkdir command. Alternatively,\
    \ a new directory can be created elsewhere by specifying a full path as the argument:\n\
    \n- 1. To discover the location of the bash program that is the default shell,\
    \ at a prompt enter the command echo SHELL\n- 2. Issue a basename SHELL to extract\
    \ the program name from the path\n- 3. Issue a dirname SHELL to extract the parent\
    \ directory of the bash program from the path\n- 4. Enter the command mkdir Sub1\
    \ to create a directory named “Sub1” in the current directory\n- 5. Enter the\
    \ command mkdir /home/mike/Data/Sub2 to create a directory named “Sub2” using\
    \ an absolute path\n\n```\nmike@linux-pc:~/Data\nmike@linux-pc:~$ echo SHELL\n\
    /bin/bash\nmike@linux-pc:~$ basename SHELL\nbash\nmike@linux-pc:~$ dirname SHELL\n\
    /bin\nmike@linux-pc:~$ mkdir Sub1\nmike@linux-pc:~$ mkdir /home/mike/Data/Sub2\n\
    mike@linux-pc:~$ pwd ; ls\n/home/mike/Data\nSub1 Sub2\nmike@linux-pc:~$\n```\n\
    \n# Removing Directories\n\nDirectories can be removed in the shell using the\
    \ rmdir command. This takes the directory name as its argument and will instantly\
    \ remove an empty directory, but will simply warn you that the directory is not\
    \ empty if it contains files.\n\nHaving to delete files manually, one by one,\
    \ may provide safeguards but can be tedious. An intelligent alternative is available\
    \ by using the recursive interactive -ri option of the rm command. This steps\
    \ into the directory and examines every file—requesting your confirmation before\
    \ deleting each file. When all files have been deleted it then asks if you want\
    \ to delete the directory:\n\nYou can use a -v option with both the rmdir command\
    \ and the rm command to produce verbose output— describing what is happening.\n\
    \n- 6. Launch the Text Editor using the nano command, and create three text files\
    \ in the “Sub2” directory\n- 7. Issue the command rmdir Sub1 to remove the empty\
    \ “Sub1” directory\n- 8. Now, issue the command rmdir Sub2 to attempt to remove\
    \ the non-empty “Sub2” directory\n- 9. Enter the command rm -ri Sub2 to interactively\
    \ delete the files within the “Sub2” directory, and remove the directory itself,\
    \ by replying “Y” (yes) to each question\n\n```\nmike@linux-pc:~/\nFile Edit View\
    \ Search Terminal Help\nmike@linux-pc:~$ rmdir Sub1\nSub1\nmike@linux-pc:~$ rmdir\
    \ Sub2\nrmdir: failed to remove 'Sub2': Directory not empty\nmike@linux-pc:~$\
    \ rm -ri Sub2\nrm: Descend into directory 'Sub2'? Y\nrm: remove regular file 'Sub2/file-2.txt'?\
    \ Y\nrm: remove regular file 'Sub2/file-1.txt'? Y\nrm: remove regular file 'Sub2/file-3.txt'?\
    \ Y\nrm: remove directory 'Sub2'? Y\nmike@linux-pc:~$ \n```\n\nIf you are feeling\
    \ brave, and are absolutely certain that the directory contains nothing you will\
    \ miss, you can use the rm command with just a -r option to instantly delete a\
    \ directory and its entire contents — use with care!\n"
