    Next, navigate to the Linux Mint directory at /usr/share/icons/Mint-Y/apps/64
    and select an appropriate icon for the shortcut


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_70_0.png)


    The selected icon should now appear in the “Launcher Properties” dialog


    Click the OK button to place a shortcut on the Desktop


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_70_1.png)


    If a selected icon does not appear in the Launcher Properties dialog it will not
