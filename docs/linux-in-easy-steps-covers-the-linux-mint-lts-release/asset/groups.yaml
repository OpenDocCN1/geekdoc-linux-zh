    # Examining File Systems


    A Linux system may span multiple hard disks and extend across many disk partitions.
    Each partition is represented by a special file in the /dev directory – typically,
    /dev/sda1 may represent the first partition on your master hard drive. During
    installation of the Linux operating system, each partition is formatted as a persistent
    storage "file system" on the hard drive in which files can be stored and recalled.
    Similarly, media drives are formatted with their own file systems in which to
    store data. Media drives must be "mounted" onto the Linux file tree in order to
    make them accessible, and this can be achieved automatically:


    +   1. Click Menu, Accessories, Files – to open the "Nemo" file manager


    +   2. In Nemo, click Edit, Preferences, Behavior, then scroll down to the "Media
    Handling" category


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_171_0.png)


    +   3. Now, ensure that the option to "Automatically remove removable media when
    inserted and on startup" is selected


    +   4. Click the Close button to confirm the selection and to close the "File
    Management Preferences" dialog


    The df disk free command shows how file systems are being used by indicating free
    space. A a-h option to make the output more understandable and a-t option to display
    file system types:


    +   5. Insert a flash drive into a USB port on your device


    +   6. Open a Terminal window, then enter the command df -hT to discover how the
    file system currently appears'
