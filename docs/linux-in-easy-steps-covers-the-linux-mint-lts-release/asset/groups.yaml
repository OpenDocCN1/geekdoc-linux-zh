  - '[PAGE 185]


    # Scripting the Shell


    Lengthy shell routines, like those on page 183, can be conveniently saved as a
    shell script for execution when required. Shell scripts are simply plain text
    files that begin their first line with #!/bin/bash, specifying the location of
    the bash program, and are typically given a .sh file extension.


    Once a shell script file has its access permission set to "executable" it can
    be executed at any time by prefixing its name or path with the ./ dot-slash characters
    at a shell prompt.


    A script might, perhaps, employ the RANDOM variable that generates an integer
    from zero to 32,767 each time it is called. These are not truly random, however,
    as the sequence is generated given the same starting point (seed) – in order to
    ensure different sequences, it is necessary to set it with different seeds.


    One solution is to extract a dynamic value from the current time using the date
    +%s command to deliver the current number of seconds that have elapsed since 00:00:00
    GMT January 1, 1970. Using this to seed the RANDOM variable gets better random
    number generation.


    Arithmetic can be performed on shell variables, such as $RANDOM, by including
    the let command in a script:


    +   - Open any plain text editor and begin a new file with the line #!/bin/bash


    +   - On a new line, type to seed the $RANDOM variable RANDOM= date +%s


    +   - Add a line to assign a value 1-20 to a variable let NUM=$ ($RANDOM % 20
    + 1)


    +   - On the next line, type an instruction to clear the window clear


    +   - Add these lines to output text for the user echo "I have chosen a number
    between 1 and 20" echo "Can you guess what it is?”


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_185_0.png)


    Hot tip

    Enter RANDOM=1 whennecho $RANDOM three times to see the pattern.

    Repeat both commands to see the pattern repeat.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_185_1.png)


    Don''t forget

    nYou must not introduce whitespace around the = = character in the assignments.'
