  mdcn: "\n\n## 管理文件\n\nshell `mv` 命令允许你从命令行在 Linux 系统中方便地移动移动文件。该命令需要两个参数，分别指定要移动的文件名以及它要移动的目标位置。有趣的是，`mv`\
    \ 命令也可以通过指定文件的当前名称和新名称作为两个参数来重命名文件。\n\n如果你想将文件复制到新位置而不是移动，可以使用 `cp` 命令。该命令可以接受一个或多个文件作为要复制的文件的参数，并将目标位置作为最后一个参数：\n\
    \n- 启动 shell 终端（Terminal），然后输入 `ls` 命令查看当前目录的内容\n- 发出 `mv` 命令来重命名现有文件——例如，将 \"\
    alpha.txt\" 重命名为 \"zebra.txt\"，命令为 `alpha.txt zebra.txt`，并使用 `ls` 命令确认名称已更改\n\
    - 输入 `mv zebra.txt Box` 将重命名后的文件移动到子目录，并输入 `ls` 命令查看\n- 输入 `cp some.txt Box` 将名为\
    \ \"some.txt\" 的文件复制到同一个子目录\n- 输入带有子目录名称的 `ls` 命令 – 确认一个文件已移动，一个文件已复制\n\n在使用 `mv`\
    \ 命令时配合 `-i` 选项，可以在覆盖同名文件之前进行提示。\n\n```\nmike@linux-pc:~\\$ ls\nalpha.txt Box\
    \ some.txt\nmike@linux-pc:~\\$ mv alpha.txt zebra.txt\nmike@linux-pc:~\\$ ls\n\
    Box some.txt zebra.txt\nmike@linux-pc:~\\$ mv zebra.txt Box\nmike@linux-pc:~\\\
    $ ls\nBox some.txt\nmike@linux-pc:~\\$ cp some.txt Box\nmike@linux-pc:~\\$ ls\
    \ Box\nsome.txt zebra.txt\nmike@linux-pc:~\\$ ls _\n```\n\n`rm` 命令可用于删除作为参数的一个或多个文件。通配符\
    \ `*` 也可以用于删除目录中的所有文件——前提是你完全确定其中没有重要文件。\n\n你可以使用 `ln` 命令创建硬链接（指向文件的系统地址）和软链接（符号链接，存储文件的路径）。默认情况下，这将为名为参数指定名称的文件创建一个硬链接——使用\
    \ `-s` 选项来创建符号链接。\n\n`readlink` 命令可以发现符号链接所指向的目标：\n\n- 输入 `Box/zebra.txt` 删除子目录中的文件，并输入\
    \ `ls Box` 确认其已删除\n- 输入 `Box/some.txt hardlink` 为子目录中的文件创建一个名为 \"hardlink\" 的硬链接\n\
    - 现在，输入 `ln -s Box/some.txt softlink` 命令为同一个文件创建一个名为 \"softlink\" 的软链接\n- 输入 `ls`\
    \ 命令查看主目录下已创建了两个链接\n- 输入 `readlink softlink` 命令查看软链接指向的目标\n\n通配符 `*` 字符表示“所有”，应谨慎使用。\n\
    \n```\nmike@linux-pc:~/Data\nmike@linux-pc:~/$ ls\nBox some.txt\nmike@linux-pc:~/$\
    \ rm Box/zebra.txt\nmike@linux-pc:~/$ ls\nsome.txt\nmike@linux-pc:~/$ ln Box/some.txt\
    \ hardlink\nmike@linux-pc:~/$ ln -s Box/some.txt softlink\nmike@linux-pc:~/ls\n\
    hardlink softlink readlink some.txt\nBox/some.txt\nmike@linux-pc:~/$ _\n```\n\n\
    你可以在第 68 页找到关于快捷链接的更多细节。\n\n## 检查文件属性\n\nLinux shell 提供了许多命令可用于检查任何文件的属性。最全面的是\
    \ `stat` 命令，它会列出参数指定文件的每一个属性。\n\n如果你只想发现文件大小，可以使用 `du`（磁盘使用情况）命令并配合 `-b` 选项来计算字节数。\n\
    \n使用 `wc`（字数计数）可以快速发现文本文件包含多少行换行符和多少字节，或者使用 `file` 命令评估它是什么类型的文件：\n\n使用带有 `-m`\
    \ 选项的 `wc` 命令来查看总单词数。\n\n- 输入 `stat Box/some.txt` 发现 Box 子目录下名为 \"some.txt\" 的文件的属性\n\
    - 输入 `du -b Box/some.txt` 发现该文件以字节为单位的大小\n- 输入 `wc Box/some.txt` 发现该文件的行数、字数和字节数\n\
    - 现在，输入 `file Box/some.txt` 和 `file Box/tuk.png` 命令来发现两个文件的类型\n\n可以看到 `wc` 命令显示了该文件的换行符数\
    \ (29)、单词数 (175) 和字节数 (1137)。\n\n```\nmike@linux-pc:~/ \nFile Edit View Search\
    \ Terminal\nmike@linux-pc:~/ stat Box/some.txt\nFile: Box/some.txt\nSize: 1137\n\
    Blocks: 4096\nDevice: 802h/2058 Inode: 2110694\nLinks: 1\nAccess: (0644/-rw--)\
    \ U: (1000) Gid: (1000)\nModify: 2019-07-25 08:25:39.94670968+038\nChange: 2019-07-25\
    \ 09:05:39.94673490+038\nBirth:\nmike@linux-pc:~/ du/some.txt\nmike@linux-pc:~/\
    \ wc Box/some.txt\n29 175 1137\nmike@linux-pc:~/ file/some.txt\nBox/some.txt:\
    \ UTF-8 text, with long lines\nfile Box/tuk.png\nBox/tuk.png: PNG image data,\
    \ 8-bit color RGBA, non-interaced\n```\n\n`touch` 命令引入了一些可能性，因为它可以更改文件的“最后访问”（Last\
    \ Accessed）和“最后修改”（Last Modified）属性。单独使用时，它会将这些更新为当前时间，但配合 `-d` 使用时允许你以各种格式指定日期——指定日期和月份可以将时间戳设置为当年该日的午夜，或者指定包括年份和时间的完整日期。作为\
    \ `touch` 命令参数提供的日期必须包含在引号内。\n\n- 输入 `touch -d \"02/21\" more.txt` 将名为 \"more.txt\"\
    \ 的文件的时间戳更新为当年的日期\n- 输入 `stat more.txt` 命令确认时间戳已更新\n- 现在，输入 `touch -d \"06/15/2020\
    \ 12:00\" more.txt` 将时间戳更新为指定的日期时间\n- 输入 `stat more.txt` 命令确认时间戳已更新\n\n```\nmike@linux-pc:~/\
    \ $\nm@linux-pc:~$ touch -d \"02/21\" more.txt\nmike@linux-pc:~$ stat more.txt\n\
    File: more.txt\nSize: 0\nBlocks: 0\nDevice: 802h/2058 Inode: 2110694\nLinks: 1\n\
    Access: (0644/-rw--) U: (1000) Gid: (1000)\nAccess: 2024-02-21 00:00:00.00000000+038\n\
    Modify: 2024-02-21 00:00:00.00000000+038\nChange: 2024-05-22 10:00:00.00000000+038\n\
    Birth:\nmike@linux-pc:~$ touch -d \"06/15/2020 12:00\" more.txt\nmike@linux-pc:~$\
    \ stat more.txt\nFile: more.txt\nSize: 0\nBlocks: 0\nDevice: 802h/2058 Inode:\
    \ 2110694\nLinks: 1\nAccess: (0644/-rw--) U: (1000) Gid: (1000)\nAccess: 2020-06-15\
    \ 12:00:00.00000000+038\nModify: 2020-06-15 12:00:00.00000000+038\nChange: 2024-05-22\
    \ 10:00:00.00000000+038\nBirth:\n```\n\n可以看到属性显示了最后更改日期和修改后的新时间戳。\n\n## 比较文件\n\
    \nshell 提供了多种比较文件的方法。可以使用 `cmp` 命令检查两个文件是否相同。如果它们确实相同，命令不会报告任何内容，但如果它们不同，它将报告第一个差异之处。\n\
    \n`cmp` 命令也可以用于比较二进制文件（如图像）。\n\n可以使用 `comm` 命令逐行比较文本文件。它的输出略有不同，因为它为每个文件中匹配的行创建了三列：\n\
    \n- 第一列——存在于第一个文件但不在第二个文件的行。\n- 第二列——存在于第二个文件但不在第一个文件的行。\n- 第三列——同时于两个文件中的行。\n\
    \n```\nmike@linux-pc:~/Data\nFile Edit View Search Terminal\nmike@linux-pc:~/Data\
    \ cmp abc.txt acd.txt\nabc.txt acd.txt differ: byte 7, line 2\nmike@linux-pc:~/Data\
    \ comm abc.txt acd.txt\n\nBravo\tAlpha\n\tCharlie\tDelta\n```\n\n"
