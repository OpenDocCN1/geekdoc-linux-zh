    +   - The **Mozilla Firefox** web browser is included with most Linux distros.


    +   - The + **New Tab** button in Firefox opens a new tab containing a Search
    box and links to "Top Sites".


    +   - Firefox provides **Reader view** to hide page distractions.


    +   - Firefox web browser is highly customizable and allows the installation of
    **add-ons** for extra functionality.


    +   - Many Linux distros include the **Thunderbird** app with which to send and
    receive email messages.


    +   - The **formatting bar** in Thunderbird allows you to adjust the font, layout,
    and content, and to insert emojis in your message.


    +   - The **Thunderbird** email app is also a contact manager.


    +   - Linux Mint includes the **HexChat** cross-platform instant messaging app.


    +   - The **Official Linux Mint Support Channel** is available to chat about Linux
    topics,


    +   - The **Transmission** app can download content using the BitTorrent protocol.


    +   - Transmission requires a **torrent file** containing information about the
    content to be acquired.


