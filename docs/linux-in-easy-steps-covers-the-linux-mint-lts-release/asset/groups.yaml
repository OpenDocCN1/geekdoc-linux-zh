  - "[PAGE 165]\n\n# Becoming the Superuser\n\nA regular user can call upon many shell\
    \ commands, but some are only available to a privileged 'superuser'. These restricted\
    \ commands typically perform system administration functions to which regular\
    \ users should not be allowed instant access.\n\nOn a typical home Linux system\
    \ the default user created during installation is given access to the sudo command,\
    \ which allows commands to be executed as the regular user is the superuser.\n\
    \nThe sudo command is most often needed where you receive a 'Permission denied'\
    \ message when attempting to perform an operation. Prefixing the previous command\
    \ effectively grants the required permission. If the previous command was lengthy,\
    \ you can simply issue a sudo !! to run it again with the required sudo prefix:\n\
    \n+   At a shell prompt, enter parted /dev/sda to attempt to launch the partition\
    \ editor for the hard-drive device\n\n+   As the shell informs you you are not\
    \ the superuser, type c then hit Return to cancel the attempt\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_165_0.png)\n\
    \n```\nmike@linux-pc:~\\$ \nFile Edit View Search Terminal Help\nmike@linux-pc:~\\\
    $ parted /dev/sda\nWARNING: You are not the superuser. Watch out for permissions.\n\
    Error: Error opening /dev/sda: Permission denied\nRetry/Cancel? c~\nmike@linux-pc:~\\\
    $\n```\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_165_1.png)\n\nThe hard drive\
    \ is a Small Computer System Interface (SCSI) – pronounced “scuzzy” device. These\
    \ are labeled alphabetically so the first device on your system is scsi device\
    \ \"a\" (sda).\n\n+   Now, enter sudo parted /dev/sda (or just enter sudo !) to\
    \ launch the partition editor successfully\n\n+   At the (parted) prompt, enter\
    \ a print command to list the partition information for the hard drive\n\n+  \
    \ Now, enter a help command to see the available operations that may be performed,\
    \ or enter a quit command to exit the partition editor"
