- md: '

    # Watching Movies


    Many Linux distros include a fast light-weight Media Player app (xplayer) that
    can play audio and video content in many file formats including AVI, MPG, WMV,
    WAV, MP3, and many more. On the Google Play Store this app is even named “Video
    Player All Format”. In Mint it is the default media player for audio or video
    file playback:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_119_0.png)


    - 1 Click Menu, Sound & Video, Media Player to launch the app

    - 2 Click File, Open to launch a “Select Movies or Playlists” dialog showing the
    contents of your Videos folder


    The Media Player also supports subtitles – click View, Subtitles, Download Movie
    Subtitles, then select a language and click the Find button to search for a subtitle
    file.


    | Select Movies or Playlists | | | |

    |---|---|---|---|

    | Home | | Size | Modified |

    | mike | | | |

    | Destrec | | | |

    | Documents | | HOW TO TRAIN YOUR DRAGON.mp4 | |

    | Images | | | |

    | Pictures | | | |

    | Supported files | | | |

    | Cancel | Add Directory | | |


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_119_1.png)


    - 3 Select a movie, then click the Add button to see it immediately begin to play
    in the display area


    Click the Volume button and drag its pop-up slider to adjust the volume level.


    | HOW TO TRAIN YOUR DRAGON 3.mp4 | |

    |---|---|

    | File Edit View Go Sound Help | |

    | HOW TO TRAIN YOUR DRAGON | THE HIDDEN WORLD |

    | OFFICIAL TRAILER | |

    | Seek/Pause | Volume Fullscreen Playlist |

    | 0:05/2:38 | |


    ...cont''d


    - Click the **Pause** button to halt playback

    - Drag the the corner of the window to change its size – see border areas appear
    around the movie in the display area


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_120_0.png)


    > You can advance a paused movie by dragging the slider, or by placing the cursor
    over the display area and rolling your mouse wheel.


    - Click **View, Zoom In** to fit the movie to the width of the display area

    - Click the **Play** button to resume playback


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_120_1.png)


    > Click **File, Properties** to discover details about the current movie file.


    - Click **Edit, Take Screenshot** to place an image of the current movie frame
    in your Pictures folder


    # Playing Music


    The Rhythmbox music player is great for playing music files and is also a podcast
    aggregator – and an internet radio tuner:


    - Click Menu, Sound & Video, Rhythmbox to launch the Rhythmbox app

    - Select Music in the "Library" pane, then click the Import button on the toolbar


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_121_0.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_121_1.png)


    Play button will change to a Pause button during playback.


    Use the drop-down menu to choose a folder containing music files, such as a sub-folder
    within your Music folder


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_121_2.png)


    Right-click on a track and choose Remove to delete it from the playlist.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_121_3.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_121_4.png)


    You can also right-click on a music file icon and choose Open with, Rhythmbox
    to play it.


    - See Rhythmbox list the music files within the chosen folder as "tracks",

    - Click on the tracks in the list to select them, click the Import selected tracks
    button to make a playlist


    ...cont''d


    Click the Play button to start playing from “Track 1” or double-click any listed
    track to play that track


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_122_0.png)


    A icon gets added to the System Tray when playback begins of music, podcasts,
    or radio. You can close the Rhythmbox window and playback will continue. Click
    the F icon and use the controls on the panel that appears to control playback,
    or click its X to quit playback.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_122_1.png)


    Select Podcasts in the “Library” pane, then click the Add button on the toolbar
    and search for podcasts by topic


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_122_2.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_122_3.png)


    Double-click a listed podcast to begin playback, then select Radio in the “Library”
    pane and double-click one of the listed stations to start


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_122_4.png)


    You can add more radio stations by clicking the Add button and entering a URL
    - use a search engine to find URLs for internet radio stations and podcasts.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_122_5.png)


    # Streaming Content


    The VLC media player is a powerful cross-platform media player for audio and video.
    It can also be used to stream media across your network. This means you can broadcast
    media and video from your Linux PC to other devices connected to your Wi-Fi:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_123_0.png)


    - Click Menu, Administration, Terminal to open a window at command prompt

    - Enter the command ifconfig to discover the IP address assigned to your PC


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_123_1.png)


    If you get a message "VLC is unable to get the URL" when trying to open a network
    stream it may be that your firewall is blocking it. In Linux Mint, click Menu,
    Preferences, Firewall Configuration then add a rule to allow VLC to stream media.


    - Click Menu, Sound, VLC media player to launch the app, then click Media, Stream
    to open "Open Media" dialog

    - Click the Add button and select a video file to stream, then click the stream
    button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_123_2.png)


    - See that the Source is selected, then click the Next button


    ...cont''d


    - 6 Set the destination to HTTP, then click the Add button

    - 7 Notice that the default port is 8080, then click Next

    - 8 Uncheck the Activate Transcoding option, then set the “Profile” to the selected
    file''s format and click Next


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_124_0.png)


    > Transcoding to MP4 format is not required here, as the video file is already
    in that format.


    - 9 Click the Stream button to broadcast the video


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_124_1.png)


    > The IP address of your PC will most likely differ from the address used in this
    example.


    - 10 Open the VLC app on another network device, then enter the IP address and
    port of the broadcasting PC to open the network stream


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_124_2.png)


    > This is the VLC app on a network PC running Windows 10 receiving the stream
    from the Linux PC.


    # Summary


    - The Image Viewer app displays images and can create a slideshow of multiple
    images.

    - Image Viewer can make a selected image the Desktop wallpaper.

    - The Pix viewer app has a Browser mode and a Viewer mode.

    - Pix viewer can arrange images and photos in a Catalog by grouping them with
    a common tag.

    - The Simple Scan app can import images from a scanner.

    - Scanned text and photos can be cropped and saved as a file.

    - The GNU Image Manipulation Program (GIMP) is the primary image editing application
    in Linux.

    - The GIMP app includes over 220 plugins that provide many of the capabilities
    of Adobe Photoshop.

    - The default GIMP configuration folder can be replaced with a custom Theme to
    emulate the look and feel of Photoshop.

    - The online GitHub repository contains packages that can be installed by issuing
    commands in the Linux Terminal.

    - The Media Player app can play audio and video content in many file formats.

    - Media Player can zoom and change the aspect ratio of the movie it is playing.

    - The Rhythmbox music player is also a podcast aggregator and an internet radio
    tuner.

    - Rhythmbox can import selected music files as tracks within a library.

    - The VLC media player is a powerful cross-platform media player for audio and
    video.

    - VLC can stream music and video from a Linux PC to other devices connected to
    the Wi-Fi router.


    # 8 Using Accessories


    This chapter describes notes of the useful accessory apps included with Linux
    Mint:


    - 126 Writing Text

    - 128 Doing Calculations

    - 130 Managing Archives

    - 132 Taking Notes

    - 134 Grabbing Screenshots

    - 136 Reading Documents

    - 138 Summary

    '
