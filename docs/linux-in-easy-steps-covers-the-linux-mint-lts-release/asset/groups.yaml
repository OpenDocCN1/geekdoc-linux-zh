    # The diff command offers an alternative to the comm command for comparison of
    text files. It too compares line-by-line, and it produces a detailed report showing
    any unique lines. It can also be used to compare two directories to reveal unique
    files.


    Files may also be compared using checksum numbers to verify their integrity. Checksum
    numbers are often found on internet download pages so the user can ensure that
    a downloaded file is intact – typically, the checksum is made using the md5 algorithm.


    The md5sum command produces a 32-byte checksum for the file specified as its argument,
    and which should exactly match that stated by the originator if the file is indeed
    intact.


    An alternative checksum can be created in the same way as the cksum command. This
    generates a CRC (Cyclic Redundancy Check) value and includes the file''s byte
    size in the output.


    - 4 Enter a diff abc.txt abd.txt command to discover those lines that are unique
    to each file

    - 5 Now, enter md5sum abc.txt to create a checksum number for that file

    - 6 Similarly, enter cksum abc.txt to create another checksum number for that
    file


    You can enter the command man diff to discover more about the diff output from
    its manual page.


    # Finding Files


    Locating a file on your system can be achieved from a shell prompt using the find
    command. This is a very powerful command, with over 50 possible options, but it
    has an unusual syntax. Possibly the one most often used looks like this:


    ```

    find DirectoryName -type f -name FileName

    ```


    The directory name specifies the hierarchical starting point from which to begin
    searching. If you know the file exists in your home directory structure, you could
    begin searching there (~). The -type f option specifies that the search is for
    a file – denoted by the letter "F". The -name option makes the search by name
    – seeking the specified file name.


    The search may include "Permission denied" error messages, relating to cached
    copies, but you can exclude error messages by appending 2>/dev/null to the command:


    - Enter find -type f -name some.txt to see all files named some.txt within your
    home directory structure – see the result file and include an error message


    Use the wildcard with the file name when you know the name but not the extension.


    You can recall the last command entered by pressing the Up key.


    - Now, enter find -type f -name some.txt 2>/dev/null – to see the result now locate
    the file without an error message


    ```

    mike@linux-pc:~/$ find -type f -name some.txt 2>/dev/null

    /home/mike/Data/Box/some.txt

    find: /home/mike/cache/deconf'': Permission denied

    ```


    ```

    mike@linux-pc:~/$ find -type f -name some.txt 2>/dev/null

    /home/mike/Data/Box/some.txt

    ```


    By default, the **find** command will only report the location of actual files,
    but you can also have it include symbolic links in the report by adding a **-L**
    option as its first argument:


    - Enter `find -L -type f -name some.txt 2>/dev/null` to seek the location of a
    file, report the location of any softlinks to that file, and suppress error messages


    In addition to searching for files, the -type option can specify that the search
    is for directories - denoted by the letter "d".


    When searching deep directory structures, with many sub-directory levels, it is
    sometimes desirable to limit the depth of search with the find command''s **-maxdepth**
    option. This requires an integer to specify the number of levels to search:


    - Enter `find /usr -maxdepth 1 -type d` to report only those directories that
    are direct descendants of the /usr


    The /usr directory has many levels - remove the **-maxdepth 1** option from the
    command in Step 4 and run the command again to see all directories.


