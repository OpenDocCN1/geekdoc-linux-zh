  - '[PAGE 147]


    # Managing Files


    The shell mv command lets you easily move files around your Linux system from
    the command line. This command requires two arguments stating the name of the
    file to be moved, and the destination to which it should be moved. Interestingly,
    the mv command can also be used to rename a file by stating its current name and
    a new name as its two arguments.


    If you wish to copy rather than move a file to a new location, the cp command
    can be used. This command can accept one or more files to be copied as its arguments,
    stating the destination as the final argument:


    +   Launch a shell Terminal, then enter an ls command to see the contents of the
    current directory


    +   Issue an mv command to rename an existing file – for example, from "alpha.txt"
    to "zebra.txt" with alpha.txt zebra.txt and an ls command to confirm the name
    change


    +   Enter mv zebra.txt Box to move the renamed file to a sub-directory, and an
    ls command to see it''s


    +   Enter cp some.txt Box to copy a file named "some.txt" to the same sub-directory


    +   Issue an ls command with the name of the sub-directory – confirming a file
    was moved and a file copied


    Use the -i option with the mv command to prompt before overwriting a file of the
    same name.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_147_0.png)


    ```

    mike@linux-pc:~\$ ls

    alpha.txt Box some.txt

    mike@linux-pc:~\$ mv alpha.txt zebra.txt

    mike@linux-pc:~\$ ls

    Box some.txt zebra.txt

    mike@linux-pc:~\$ mv zebra.txt Box

    mike@linux-pc:~\$ ls

    Box some.txt

    mike@linux-pc:~\$ cp some.txt Box

    mike@linux-pc:~\$ ls Box

    some.txt zebra.txt

    mike@linux-pc:~\$ ls _

    ```'
  - '[PAGE 148]


    The rm command can be used to delete one or more files named as its arguments.
    The * wildcard can also be used to delete all files in a directory - if you are
    absolutely certain none are.


    You can create hard links, pointing to the system address of a file, and soft
    (symbolic) links, storing the path to a file, with the ln command. By default
    this will create a hard link to the file named as its argument - use it -s option
    to create a symbolic link.


    The readlink command can be used to discover the target to which a symbolic link
    is pointing:


    +   6 Enter Box/zebra.txt to delete a file in a sub-directory

    and an ls Box to confirm it''s gone


    +   7 Enter Box/some.txt hardlink to create a hard link named "hardlink" to a
    file in the sub-directory


    +   8 Now, enter ln -s Box/some.txt softlink command to create a soft link named
    "softlink" to the same file


    +   9 Enter an ls command to see both links have been created in the home directory


    +   10 Enter a readlink softlink command to see the target to which the soft link
    points


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_148_0.png)


    The wildcard * character means "all" and should be used with caution.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_148_1.png)


