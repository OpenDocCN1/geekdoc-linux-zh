    \n要恢复已删除回收篓的文件，点击文件浏览器侧边栏上的回收篓图标（或桌面上的图标），右键点击文件图标，然后从右键菜单中选择“还原”选项。\n\n## 创建快捷方式\n\
    \n为你最经常访问的应用程序和文件创建桌面快捷方式通常非常方便。应用程序的快捷方式可以通过菜单选项创建，也可以通过桌面右键菜单创建。文件的快捷方式可以使用文件浏览器作为链接创建：\n\
    \n![](img/7b6ecabd34062cd153290258f3b9cd5b_69_0.png)\n\n快捷方式或链接的删除方法与文件相同——选择其图标然后按“删除”键。或者，右键点击图标，然后选择“删除”或选择“移到回收篓”。\n\
    \n- 在菜单上右键点击应用图标，然后点击“添加到桌面”选项以在桌面上放置快捷方式\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_69_1.png)\n\
    \n- 在桌面的任何地方右键点击，从右键菜单中选择“在此处新建启动器”——打开“启动器属性”对话框\n\n- 输入快捷方式名称，然后点击“浏览”按钮打开“选择命令”对话框\n\
    \n![](img/7b6ecabd34062cd153290258f3b9cd5b_69_2.png)\n\n- 导航到 /usr/bin 目录并选择你想要创建快捷方式的应用程序——在“命令”字段中添加其路径\n\
    \n/usr 目录包含存储可供任何用户运行的程序的子目录。\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_69_3.png)\n\
    \n- 点击图标按钮打开“选择图标”对话框\n\n接下来，导航到 /usr/share/icons/Mint-Y/apps/64 下 Linux Mint\
    \ 目录，并为快捷方式选择合适的图标\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_70_0.png)\n\n选中的图标现在应该出现在“启动器属性”对话框中\n\
    \n点击“确定”按钮在桌面上放置快捷方式\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_70_1.png)\n\n\
    如果选中的图标未出现在“启动器属性”对话框中，它将不会出现在快捷方式上——将显示默认图标\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_70_2.png)\n\
    \n在你的主目录“文档”中打开文件浏览器，右键点击一个文本文件并选择“编辑”、“创建链接”菜单——该目录下会出现一个快捷方式图标，并带有一个箭头表示这是一个链接\n\
    \n![](img/7b6ecabd34062cd153290258f3b9cd5b_70_3.png)\n\n将链接图标拖动到桌面以创建一个快捷方式，点击该快捷方式即可启动显示目标文件的文本编辑器\n\
    \n必须维护链接，因为对目标文件的更改（如重命名或移动它）会导致链接变成“孤儿”——不再正确指向目标文件\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_70_4.png)\n\
    \n![](img/7b6ecabd34062cd153290258f3b9cd5b_70_5.png)\n\n## 定位文件\n\n认识到 Linux 中的许多目录包含包含配置数据的子目录和隐藏文件是非常重要的。这些就像\
    \ Windows 操作系统中默认隐藏的“系统”文件。在 Linux 中，每个隐藏目录和文件的名称始终以点开头。\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_71_0.png)\n\
    \n1. 在你的主目录中打开文件浏览器\n2. 现在，点击“查看”、“显示隐藏文件”以查看所有内容\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_71_1.png)\n\
    \n3. 右键点击文件浏览器窗口，然后选择“项目”来选择你希望排列内容的方式\n- 创建新文件\n- 创建新文件夹\n- 在终端打开\n- 以 root 身份打开\n\
    - 显示隐藏文件\n- 属性\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_71_2.png)\n\n在系统中查找文件最简单的方法是使用\
