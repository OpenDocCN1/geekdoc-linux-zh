    # 为什么选择这本书？


    ### 它使用通俗英语编写

    被术语吓跑了吗？别担心，我们保持内容简单直接。


    ### 现在已出版第六版

    介绍了 Linux 环境以及如何在这个流行的免费操作系统中发挥更多价值。它从如何下载、安装和自定义 Linux 开始，引导你熟悉桌面，然后介绍许多出色的应用程序，包括：


    ### 它易于遵循

    清晰、循序渐进的指令让学习变得简单。


    - LibreOffice 应用套件：Writer（文字处理器）、Calc（电子表格）、Impress（演示文稿）、Draw（绘图工具，用于创建图形、图表、图和图形）以及
    Base（数据库）。

    - 用于浏览的 Firefox。

    - 用于交换电子邮件的 Thunderbird。

    - GIMP、Pixx、VLC 和 Rythmbox 媒体应用，用于编辑照片和视频并享受音乐和电影。


    本指南展示了如何使用强大的 Linux shell 与 Linux 核心内核直接通信以实现完全控制。这本入门书开启了使用 Linux 进入全新数字可能的大门！


