  - "[PAGE 151]\n\n# Comparing Files\n\nThe shell provides several ways to compare\
    \ two files. You can check to see if two files are identical with the cmp command.\
    \ If they are indeed identical the command reports nothing, but if they differ\
    \ it reports the location of the first difference.\n\nThe cmp command can also\
    \ be used to compare binary files such as images.\n\nText files can be compared\
    \ line-by-line with the comm command. Its output is slightly unusual, as it creates\
    \ three columns to lines that match in each:\n\n+   - Column 1 – lines found in\
    \ the first file, but not the second.\n- Column 2 – lines found in the second\
    \ file, but not the first.\n- Column 3 – lines found in both files.\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_151_0.png)\n\
    \nUse a text editor to create a file named abc.txt, with three lines \"Alpha\"\
    , \"Bravo\", and \"Charlie\", and a file named acd.txt with three lines \"Alpha\"\
    , \"Charlie\" and \"Delta” – save the files in the current directory\n\nLaunch\
    \ a shell Terminal window and enter the command cmp abc.txt acd.txt to discover\
    \ where the first difference occurs between these two files\n\nEnter comm abc.txt\
    \ acd.txt to see a line-by-line comparison\n\nThe cmp command has options to suppress\
    \ column output – the option -12 suppresses the first two columns to show only\
