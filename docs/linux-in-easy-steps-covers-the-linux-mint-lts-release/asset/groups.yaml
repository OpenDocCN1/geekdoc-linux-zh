    ![](img/7b6ecabd34062cd153290258f3b9cd5b_105_3.png)


    你可以在**设置类型和格式**步骤中限制字段仅接受特定类型的数据。默认情况下，一个字段可以接受最多100个字符的文本。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_105_4.png)


    -   点击一个可用字段，然后点击 **>** 按钮将其移动到**已选字段**窗格中将其包含在你的表中。

    -   选择所有需要的字段，然后点击**完成**关闭对话框并查看“表数据视图”窗口。


