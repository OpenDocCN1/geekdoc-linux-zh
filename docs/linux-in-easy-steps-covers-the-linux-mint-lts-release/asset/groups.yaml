    # 总结


    -   LibreOffice 包含一组与 Microsoft Office 套件类似的办公工具。

    -   文件可以保存为 Microsoft Office 文件格式和 LibreOffice 应用程序的本地格式。

    -   LibreOffice Writer 是一款用于文档的文字处理器，可以包含文本和嵌入对象。

    -   LibreOffice Writer 内置支持 PDF 格式 (PDF)。

    -   LibreOffice Calc 是一个电子表格程序，可以使用给公式对数据输入进行计算。

    -   LibreOffice Calc 提供了单元格格式功能，用于指定单元格内容的形式。

    -   LibreOffice Impress 是一个演示文程序，可以制作幻灯片。

    -   LibreOffice Impress 提供了许多标准模板和许多布局。

    -   LibreOffice Draw 是一种绘图程序，可以创建插图、图表和图形。

    -   LibreOffice Draw 提供了图表功能，提供了许多标准图表。

    -   宏是记录的按键序列，可以重复执行。

    -   LibreOffice 应用程序可以向文档添加控件以进行交互。

    -   LibreOffice Base 是一个数据库程序，可以存储数据并检索特定的数据项。

    -   LibreOffice Base 提供了创建表和执行查询的向导。


