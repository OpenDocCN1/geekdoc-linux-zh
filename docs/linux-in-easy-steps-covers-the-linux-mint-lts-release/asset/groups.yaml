    ![](img/7b6ecabd34062cd153290258f3b9cd5b_95_3.png)


    - Enter numerical values in all cells for each week row and column


    Drag the mouse across each day cell on a row and its “Total” cell, then the Σ
    character on the toolbar – a SUM formula appears in the formula field and a row
    total value appears in the Total cell


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_96_0.png)


    Type =AVERAGE in an “Average” cell at a row and hit Return, then drag across the
    cells on that row and hit Return again – a row appears in the Average cell


