    ## 选择发行版


    Linux 的核心是一系列被称为“内核（kernel）”的经过测试的代码。内核为操作系统提供了核心功能，就像汽车的引擎一样。它负责处理基础工作，例如帮助其他程序访问硬件，并在各种程序之间共享计算机的处理器。


    除了内核之外，Linux 还包含许多系统级程序，例如处理您的电子邮件、网络连接和引导加载程序的服务。可以把这些程序看作汽车的变速箱、齿轮和底盘——没有了它们，引擎也无用武之地。


    Linux 发行版通常还包含大量的用户级程序——即日常使用的应用程序：例如浏览器、文字处理器、文本编辑器、图形编辑器、媒体播放器等。这些是汽车的最后装点，确保了佳的驾驶体验——如白壁轮胎和软皮质座椅。


    所有这些组件都组合在各种 Linux 发行版包中，通常被称为“发行版（distros）”——就像汽车的所有组件组合在一起形成一辆完整的汽车一样。


    就像有许多品牌和型号的汽车一样，Linux 发版也有很多。最知名的发行版包括 RedHat Fedora、SUSE、Ubuntu 和 Mint。每个发行版根据发行者认为的最佳安排，都有其自己的安装程序和独特的默认配置。最适合您的发行版取决于您自己的喜好以及您想如何使用
    Linux。下面介绍了最流行的发行版，以帮助您选择：


    ## RedHat Fedora


    这是最著名的 Linux 发行版之一，由商业 RedHat Enterprise Linux 产品线和由 Fedora Project 社区开发的 Fedora
    发行版组成。Fedora 发行版有几个版本——用于 PC 的“Workstation”、用于服务器的“Server”以及用于云计算的“Atomic”。


    - **优点：** 广泛使用，卓越的社区支持，创新。

    - **缺点：** Fedora 版本的生命周期有限，多媒体支持较差。


    从 getfedora.org 免费下载


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_11_0.png)


    大多数 Linux 发行版都以“现场（live）”版本的形式提供，让您能够从磁盘运行 Linux——这样您就可以不将 Linux 安装到硬盘上就能尝试它。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_11_1.png)


    > 选择自由。选择 Fedora。


    ## SUSE


    基于社区的“openSUSE”发行版由 Novell 赞助，是另一个侧重于桌面的发行版，其安装程序和 YaST 配置工具收到了好评。随盒产品附带的文档被誉为迄为止最完整、详尽且易于使用的。该发行版为
    Novell 屡奖的 SUSE Linux Enterprise 产品提供了基础。


    - **优点：** 关注细节，易于使用的 YaST 配置工具。

    - **缺点：** 发行版庞大——包含超过 1500 个捆绑包。从 opensusese.org 免费下载


    ## Ubuntu


    这个复杂的社区发行版通常采用流行的 Gnome 桌面管理器。它的优势是具有固定的六个月发布周期，并且每两年会有一次支持五年的 LTS（长期支持）版本。Ubuntu
    发行版有几个版本——用于 PC 的“Desktop”、用于服务器的“Server”以及用于 IoT（物联网）设备的“Core”。Ubuntu Desktop
    版本的默认界面与 Windows 桌面非常不同。


    - **优点：** 优秀的社区，固定的发布周期。

    - **缺点：** 界面对 Windows 用户来说可能陌生。从 ubuntu.com 免费下载


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_12_0.png)


    一个现代、优雅且易于使用的操作系统。它基于 Ubuntu 操作系统，开箱即用，具有完全的多媒体支持。所有的 Linux Mint 发行版都是在每个 Ubuntu
    发布后不久推出的版本，并支持五年。鼓励用户发送反馈，以便他们的想法能用于改进 Linux Mint。该操作系统通常采用 Cinnamon GUI 桌面管理器，对于从
    Windows 系统的用户来说会很熟悉。由于原因，本书全程使用 Mint 来演示 Linux 操作系统的功能。


    - **优点：** 优秀的社区，界面对 Windows 用户来说很熟悉——最适合初者的发行版。

    - **缺点：** Ubuntu 拥有更大的用户群。从 linuxmint.com 免费下载


    ## Linux Mint


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_12_1.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_12_2.png)


    > “系统管理员、开发者和桌面用户的首选。”


    > “快速、安全、简单，Ubuntu 为全球数百万台 PC 提供动力。”


    > “Linux Mint。优雅源自自由。”


    ## 提供磁盘空间


    操作系统安装在硬盘上称为“分区（partition）”的区域。当 Windows 是唯一安装的操作系统时，它的分区通常会占用整个硬盘。在这种情况下安装 Linux
    有三种可能的选择：


    硬盘驱动器（HDD）或简单的“硬盘”可以被划分为一个或多个区域，以便操作系统单独管理每个区域。


    - **删除 Windows 分区** —— 用占据整个硬盘的 Linux 分区替换。*此选项将删除所有 Windows 数据。*

    - **缩小 Windows 分区** —— 为 Linux 出空间。*此选项不会删除 Windows 数据。*

    - **添加第二个硬盘** —— 为 Linux 添加一个新驱动器。*此选项不会影响现有的 Windows 数据。*


    调整分区是一个危险的过程，即使在专家手中也可能发生数据丢失。在尝试此操作之前，必须备份分区的所有内容。


    安装额外硬盘的选择是许多人的流行选择，因为他们经常会升级驱动器。它有几个优点：


    - Windows 的空闲空间不会减少。

    - 消除了数据丢失的风险。

    - 保留了 Windows 操作系统。

    - 区分了两个操作系统。

    - 驱动器故障只会影响一个系统。


    ## 添加第二个硬盘


    大多数现代 PC 可以容纳多四个 EIDE（增强型设备电子）设备，如硬盘和光驱，但通常只配带两个——一个硬盘和一个光驱。这意味着可以通过将驱动器插入现有系统来添加更多驱动器。


    系统中的第一个硬盘被称为“主（Master）”硬盘，第二个硬盘被称为“从（Slave）”硬盘。


    “跳线（jumper）”连接两个微小的引脚，以决定驱动器应该被视为主（MA）硬盘还是从（SL）硬盘。每个硬盘的顶部通常有一个图表，描述了在每情况下需要连接哪些引脚。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_0.png)


    如果您不习惯在 PC 机箱内部操作，电脑商店应该乐意以合理的费用为您安装驱动器。


    - 确保原始硬盘上的跳线设置为主，然后将第二个硬盘上的跳线设置为从。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_1.png)


    - 将宽 SATA 数据线连接到主硬盘，使用电缆末端的插头——而不是电缆中间的插头。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_3.png)


    - 现在，将 SATA 数据线连接到从硬盘，使用电缆中间的插头。


    SATA（串行高级技术连接）是将硬盘和光驱等设备连接到 PC 主板的标准。


    - 将电源线连接到两个驱动器，然后关上 PC 机箱。


    - 启动 PC 并检查系统现在是否检测到两个驱动器——如果没有检测到第二个驱动器，您可能需要更改启动设置以“自动搜索”它。


    '
