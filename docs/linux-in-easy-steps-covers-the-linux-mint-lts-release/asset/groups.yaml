    ## Editing Images


    The primary image editing application in Linux is the GIMP (GNU Image Manipulation
    Program) open-source app that includes over 220 plugins in a standard installation.
    These provide the GIMP with many of the capabilities of Adobe Photoshop but do
    not provide native support for CMYK colors.


    The GIMP is highly configurable and has powerful scripting support, but has an
    unusual appearance that places the tools in a different window to the image you
    are working on. GIMP can be used to edit images and to create attractive web graphics:![](img/7b6ecabd34062cd153290258f3b9cd5b_115_0.png)


    GIMP Image Editor![](img/7b6ecabd34062cd153290258f3b9cd5b_115_1.png)


    - 1. Click Menu, Graphics, GNU Image Manipulation Program to launch the app –
    see it starts with a blank GIMP window and a "Toolbox" window

    - 2. In the GIMP window, click the File, New menu to launch a "Create New Image"
    dialog

    - 3. In the "Create New Image" dialog, set Width to 600px and set Height to 240px

    - 4. Expand Advanced Options and set Fill With Transparency, then click OK to
    close the dialog – see the new image appear in the GIMP window

    - 5. In the GIMP window, click the Select, All menu to select the entire area,
    then click Select, Rounded Rectangle – rounding the corners to 50% radius

    - 6. Click the color blocks in the "Toolbox" window to open their "Change Color"
    windows – then, in the HTML box, set the foreground to #f3f28 and background to
    #f5d087

    - 7. Choose the Bucket Fill Tool, then click inside the selected area in the image
    window – filling that area with the foreground color


    If a Toolbox window is not immediately visible, click Windows, New Toolbox in
    the GIMP window to make it appear![](img/7b6ecabd34062cd153290258f3b9cd5b_115_2.png)


    In the GIMP window, click the Filters, Light and Shadow, Drop Shadow menu to launch
    the “Drop Shadow” dialog – set X and Y Offset to 4, Blur radius to 10, Color to
    #f3f228, and Opacity to 80


    Choose the Rectangle Select Tool and drag from coordinates X:20, Y:20 to X:580
    to select an area, then click Select, Rounded Rectangle – rounding the corners
    to 50% radius as before


    Choose the Blend Tool, then drag over the selected area from bottom to top – applying
    a linear gradient of foreground-to-background color


    Now, set the foreground to #FFFFFF, then choose the Text Tool and click on the
    selected area – type “Web 2.0”


    Select all the text and adjust the font size to 120, then drag the corner of the
    text to center it over the image


    In the GIMP window, click Layer, Merge Down to flatten the layer onto the image


    Click File, Export and name the image button.png, then click the Export button
    to save the image file


    Right-click on the saved image icon and choose to Open With Image Viewer to see
    how it looks![](img/7b6ecabd34062cd153290258f3b9cd5b_116_0.png)


    The GIMP can read many image file types – including PSD files produced by Photoshop![](img/7b6ecabd34062cd153290258f3b9cd5b_116_1.png)


    The results of some GIMP plugins can be less predictable than Photoshop for inexperienced
    users.


    ```

    button.png

    File Edit View Help

    <- [ ] [ ] [ ] [ ] [ ]

    100 x 42 pixels 4.6 kB 100% 1/8

    ```

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_116_2.png)


    ## Emulating Photoshop


    The GIMP app is a great editor, but many who are familiar with Adobe Photoshop
    find its default interface unfriendly![](img/7b6ecabd34062cd153290258f3b9cd5b_117_0.png)


    You can, however, replace the default GIMP configuration folder with a custom
    Theme to emulate the look and feel of Photoshop. The popular GimpPs Theme for
    this purpose is available from the online GitHub repository, which requires the
    Git package to be installed on your system in order to clone the GimpPs Theme.
    Backup of the original GIMP configuration folder, installation of the Git package,
    and cloning of the GimpPs Theme can all be easily achieved by issuing commands
    in the Linux Terminal:


    GimpPs Theme supports GIMP version 2.8 and may not succeed with other versions.
    Installation instructions are correct at the time of writing but may be subject
    to change. Find more details online at github.com/doctormo/GimpPs


    - Click **Menu, Administration, Terminal** to launch a command-line "Terminal"
    window

    - At the prompt, precisely enter this command to rename the GIMP configuration
    folder – and create a backup `mv ~/gimp-2.8 ~/gimp-2.8-backup`

    - Next, enter this command to install the Git package `sudo apt-get install git-all`


    ## cont''d


    Enter your password then, when asked, press the Y key and hit Return to proceed
    with the installation![](img/7b6ecabd34062cd153290258f3b9cd5b_118_0.png)


    Upon completion, precisely enter this command to clone the Theme folder from the
    GitHub repository

    sh - c "$curl -fSL https://raw.githubusercontent.com/doctormo/GimpPS/master/tools/install.sh"


    The backslash character here simply allows the command to continue on the next
    line![](img/7b6ecabd34062cd153290258f3b9cd5b_118_1.png)


    ```

    mike@linuxpc:~

    File Edit View Search Terminal Help

    mike@linuxpc:~$ sh - c "$curl -fSL https://raw.githubusercontent.com/doctormo/GimpPS/master/tools/install.sh"

    Cloning Gimps...

    Cloning into /home/make/gimp-2.8...

    remote: Counting objects: 81, done.

    remote: Compressing objects: 100% (78/78), done.

    remote: Indexing objects: 100% (delta 1)

    Unpacking objects: 100% (81/81), done.

    Gimps successfully installed

    ```


    Cloning creates a new configuration folder. You can restore the backup with two
    commands

    rm - r ~/gimp-2.8

    mv ~/gimp-2.8-BAK ~/gimp-2.8


    Click Menu, Graphics, GNU Image Manipulation Program to launch the GIMP app –
    see that the window layout and feel now emulates Photoshop![](img/7b6ecabd34062cd153290258f3b9cd5b_118_2.png)

