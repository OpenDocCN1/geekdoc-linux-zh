    # 处理数据


    LibreOffice 套件包含一个数据库应用程序，即 Microsoft Access，它可以让你存储数据并轻松提取特定的数据项：


    -   点击**菜单、Office、LibreOffice Base** 启动该程序，然后选择“创建新数据库”并点击**完成** – 打开“保存”对话框。

    -   输入一个**名称**，然后点击**保存**关闭对话框。

    -   选择**表格**，然后点击**使用向导创建表** – 打开“表向导”对话框。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_105_0.png)


    **设计视图**和**创建视图**选项提供了更大的控制力，但向导更简单。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_105_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_105_2.png)


