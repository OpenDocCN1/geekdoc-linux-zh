    Double-click on any user in the **User List** to switch to a "Dialog with" to
    chat directly with that user.


    Click the **Chat** button to send a chat request to that user.


    Wait until the user accepts the request, then begin to chat.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_84_1.png)


    You can click the **Send** button to send a file to the user, and click the **Whols**
    button to see connection details.


    ## Downloading Content


    Linux distros typically include the Transmission BitTorrent Client to acquire
    content via the BitTorrent protocol. This lets you download directly from other
    groups of people – in which each person is called a "peer". Pieces of content
    from various peers are automatically assembled, making the BitTorrent protocol
    very efficient and reliable, particularly for large content files.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_0.png)


    The Transmission BitTorrent client first requires you to download a "torrent file"
    containing information about the content you wish to acquire. This can be found
    in a BitTorrent directory such as Public Domain Torrents (publicdomaintorrents.info),
    Internet Archive (archive.org), or Legit Torrents (legittorrents.info):


    - 1 Open the **Firefox** web browser and visit a BitTorrent directory, then select
    an item you would like to download.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_1.png)


    Torrent downloads are often associated with illegal downloads, but free open content
    can be legally downloaded.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_2.png)


    - 2 Choose to save the torrent file – by default to the **Downloads** folder within
    your home directory.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_3.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_4.png)


    The first time you launch the **Transmission** app a dialog appear in which you
    need to agree to share content responsibly.


    - 3 Click **Menu, Internet, Transmission** to launch the app.


    - 4 Click the **Open** button on the Transmission toolbar – to open an "Open a
    Torrent" dialog.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_85_5.png)


    ...cont''d


    - 5 Select the torrent file you downloaded and check the Show options dialog.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_86_0.png)


    - 6 Click the **Open** button to see details.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_86_1.png)


    - 7 Click the **Open** button to start.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_86_2.png)


    ## Getting Apps


    In addition to the apps supplied with Linux distro, there are many apps that can
    be easily installed. Linux Mint includes a Software Manager that helps you search
    for apps.


    - 1 Click **Menu, Internet, Software** to launch the app.


    - 2 Click the **Open** button to see a description.


    - 3 Click this link to find apps by category.


    - 4 Click the **Open** button to open a "Torrent" dialog.


    - 5 Click the **Open** button to see a description.


    - 6 Click the **Open** button to start how the torrent app.


    - 7 Click the **Open** button to see details.


    - 8 Click the **Open** button to start downloading.

