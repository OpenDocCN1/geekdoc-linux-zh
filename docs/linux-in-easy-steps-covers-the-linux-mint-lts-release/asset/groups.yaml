    # Summary


    - The Text Editor app is a plain text editor that can number lines and sort lines
    alphanumerically.

    - Text Editor can provide syntax highlighting for many scripting, programming,
    and markup languages.

    - Linux does not treat line endings in the same way as Windows, but Text Editor
    supports both types of endings.

    - Calculator app can perform basic equations, execute math and financial functions,
    and perform conversions.

    - Calculator provides a scrollable History of previous calculations so they can
    be quickly recalled.

    - The Archive Manager app compresses files into many archive formats.

    - The ZIP file format supports password-protection but may not produce the smallest
    archive files.

    - The 7-ZIP file format produces smaller archive files than the ZIP file format.

    - The Tomboy Notes app can keep track of small pieces of information grouped in
    notebooks.

    - Tomboy Notes supports hyperlinks to other notes.

    - The Screenshot can capture an image of the entire screen, current window, or
    a selected area.

    - Screenshot provides a delay and border options.

    - Document Viewer app can display multi-page documents and provide Thumbnail views
    of each page.

    - Document Viewer supports bookmarks that mark a page for future reference.

    - Document Viewer supports annotations that provide additional information on
    a page.


