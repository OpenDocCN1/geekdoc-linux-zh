    (Undo) 还原原始状态。


    - 点击编辑 (Edit)、偏好 (Preferences)、编辑器 (Editor)，将“显示行号”开关切换到开启 —— 以查看生成的行

    - 关闭拼写检查并点击编辑 (Edit)、全选 (Select All)（或按 Ctrl + A）选择所有文本，然后按 Delete 键删除所有内容


