    Notice that the date is preserved but not in the chosen long date format.


    # Handling Data


    The LibreOffice suite includes a database app that, Microsoft Access, lets you
    store data and easily extract specific items of data:


    - Click **Menu, Office, LibreOffice Base** to launch the app, then select “Create
    a new database” and click **Finish** – to open a “Save” dialog.

    - Enter a **Name**, then click **Save** to close the dialog.

    - Select **Tables**, then click **Use Wizard to Create Table** – to open a “Table
    Wizard” dialog.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_105_0.png)


    The **Design View** and **Create View** options offer greater control but the
    Wizard is simpler.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_105_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_105_2.png)


    - Choose the **Personal** category, then select a **Sample table** – to see the
    available fields within that table.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_105_3.png)


    You can limit fields to accept only particular types of data in the **Set types
    and formats** step. By default, a field can accept up to 100 characters of text.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_105_4.png)


    - Click an available field, then click the **>** button to move it to the **Selected
    fields** pane – to include it in your table.

    - Select all the fields you want, then click **Finish** to close the dialog and
    see a “Table Data View” window appear.


    Enter and save your data, then close the window.


    Select Queries, then click Use Wizard to Create Query – to open a “Query Wizard”
    dialog.


    Click the >> button to select all fields, then click Next.


    Select Search conditions, then choose a field to query.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_106_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_106_1.png)


    There is a “Report Wizard” that can quickly produce a summary of your data.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_106_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_106_3.png)


    You can specify others, such as Greater than for numerical values, and you can
    specify multiple conditions for finer-precision queries.


    Enter a value to match within the chosen field, then click the Finish button –
    see that a query icon gets added in the app’s “Queries” pane.


    Double-click the query icon to see the results in a “Table Data View” window –
    extracting only specific data.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_106_4.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_106_5.png)


    There is also a “Form Wizard” that can quickly produce a user form for data entry.


    # Summary


    - LibreOffice contains a set of office tools similar to those in the Microsoft
    Office suite.

    - Files can be saved in Microsoft Office file formats and file formats native
    to LibreOffice apps.

    - LibreOffice Writer is a word processor app for documents that can contain text
    and embedded objects.

    - LibreOffice Writer has built-in support for the Portable Document Format (PDF).

    - LibreOffice Calc is a spreadsheet app that can perform calculations on data
    entries using given formulas.

    - LibreOffice Calc provides a Format Cells facility to specify how cell content
    should appear.

    - LibreOffice Impress is a presentation app that can produce slideshows.

    - LibreOffice Impress provides a number of standard Templates and offers many
    Layouts.

    - LibreOffice Draw is a drawing app that can create illustrations, diagrams, and
    graphs.

    - LibreOffice Draw provides a Chart facility that provides many standard charts.

    - A macro is a recorded sequence of keystrokes that can be replayed to repeat
    those.

    - LibreOffice apps can add form controls to a document for interaction with the
    user.

    - LibreOffice Base is a database app that can store data and retrieve specific
    items of data.

    - LibreOffice Base provides wizards that can create Tables and perform Queries
    in database.


    # Enjoying Media


    This chapter describes how to enjoy media with various Linux apps.


