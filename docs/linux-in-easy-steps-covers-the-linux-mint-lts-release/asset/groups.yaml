  mdcn: "\n\n# Shell 脚本\n\n冗长的 shell 程序（如第 183 页所示）可以方便地保存为 shell 脚本，以便在需要时执行。shell\
    \ 脚本只是纯文本文件，其第一行以 `#!/bin/bash` 开头，指定了 bash 程序的位置，并通常赋予 `.sh` 文件扩展名。\n\n一旦 shell\
    \ 脚本文件的访问权限被设置为“可执行”，就可以在 shell 提示符中通过在名称或路径前加上 `./` 点斜杠字符来随时执行它。\n\n脚本可能会使用 `RANDOM`\
    \ 变量，它在每次调用时都会生成一个从 0 到 32,767 的整数。然而，这些并不是真正的随机，因为序列是在给定相同起点（种子）的情况下生成的——为了确保不同的序列，有必要用不同的种子设置它。\n\
    \n一种解决方案是使用 `date +%s` 命令从当前时间提取一个动态值，提供自 GMT 1970 年 1 月 1 日 00:00:00 以来过的秒数。使用这作为\
    \ `RANDOM` 变量的种子可以获得更好的随机数生成。\n\n通过在脚本中包含 `let` 命令，可以在 shell 变量（如 `$RANDOM`）上执行算术运算：\n\
    \n- 打开任何纯文本编辑器并以 `#!/bin/bash` 行开始一个新文件\n- 在新行上，输入 `RANDOM=date +%s` 为 `$RANDOM`\
    \ 变量设置种子\n- 添加一行为变量分配一个 1-20 之间的数值：`let NUM=$($RANDOM % 20 + 1)`\n- 在下一行，输入一个清除窗口的指令\
    \ `clear`\n- 添加这些行为用户输出文本：`echo \"I have chosen a number between 1 and 20\"`，`echo\
    \ \"Can you guess what it is?\"`\n\n热点提示\n当你连续三次输入 `echo $RANDOM` 时，输入 `RANDOM=1`\
    \ 来观察其模式。重复这两个命令以看到该模式的重复出现。\n\n不要忘记\n在赋值时，你不能在 `=` 字符周围引入空格。\n\n现在，添加一行将用户的猜测读入变量：\n\
    `read GUESS`\n\n准确地输入以下行，用以判断用户的猜测是否与生成的数字匹配，并为每次错误的尝试输出适当的响应：\n`while [ $GUESS\
    \ -ne $NUM ]`\n\n```bash\nif [ $GUESS -gt $NUM ]\n    then echo \"No - try lower\"\
    \n    else echo \"No - try higher\"\nfi\nread GUESS\n```\n\n`while-do` 语句是一个循环，它使用了\
    \ `-ne`（不等于）比较运算符和 `-gt`（大于）比较运算符。\n\n添加一行确认正确的猜测：\n`echo \"Yes the number is\
    \ $NUM\"`\n\n将脚本保存为 `guess.sh` 在当前目录下。\n\n在 shell 提示符处，使用此命令更改所有者的访问权限使其可执行：\n\
    `chmod 711 guess.sh`\n\n记住方括号周围必须有空格以避免错误。\n\n输入 `./guess.sh` 执行脚本，然后由脚本随机选择数字：\n\
    \n```bash\nmike@linux-pc:~/Scripts$\nFile Edit Search\nI have chosen a number\
    \ between 1 and 20\nCan you guess what it is?\n10\nNo - try lower...\n5\nNo -\
    \ try lower...\n1\nNo - try higher...\n3\nYes the number is 3\nmike@linux-pc:~/Scripts$\n\
    ```\n\n# 总结\n\n- `sudo` 命令在 shell 提示符处以 root 用户身份执行命令。\n- 高级软件包工具 (APT) 列表可以通过\
    \ `apt-get update` 更新，通过 `apt-get install` 安装，通过 `apt-get remove` 。\n- 文件可以使用\
    \ `gzip`、`bzip2`、`zip` 压缩，使用 `gunzip`、`bzip2`、`unzip` 解压缩。\n- 文件系统可以使用 `mount`\
    \ 挂载，`umount` 卸载，以及 `fsck` 检查。\n- 用户账户可以使用 root 用户通过 `useradd`、`userdel` 和 `usermod`\
    \ 创建编辑。\n- 密码可以使用 `passwd` 命令更改，详情可以使用 `chfn` 命令编辑。\n- 组可以使用 root 用户通过 `groupadd`、`groupdel`\
    \ 和 `groupmod` 创建编辑。\n- 访问权限可以使用 `chmod` 修改，所有权可以使用 `chown` 和 `chgrp` 更改。\n- 每个进程都有一个唯一的进程\
    \ ID (PID)，通过 `ps` 命令显示，并可以使用 `kill` 命令终止。\n- URL 的 IP 地址可以通过 `host` 命令发现，你电脑的\
    \ IP 地址可以通过 `ifconfig` 显示。\n- 打印作业可以使用 `lpr` 创建，`lprm` 移除，`lpq` 列出，状态通过 `ipstat`\
    \ 显示。\n- 表达式可以使用 `expr` 命令求值，字符串可以使用 `length`、`substr` 和 `index` 函数处理。\n\n## B\n\
    - 反斜杠字符 182\n- 备份快照 22-23\n- `basename` 命令 144\n- Bash 程序，`/bin/bash` 184\n- 基础输入输出系统\
