    - 28 配置桌面

    - 30 添加桌面组件（Desklets）

    - 32 调整任务栏

    - 34 启动应用程序

    - 36 编辑菜单

    - 38 安装更新

    - 42 总结


    ## 熟悉界面


    当您启动 Linux Mint 操作系统时，系统开始加载时您看到的第一个是显示操作系统名称和版本数的黑屏：


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_27_0.png)


    除非您在安装过程中选择了“自动登录”选项（见第21页），否则您看到的下一个是所示的登录屏幕：


    - 计算机名称、用户名、密码、辅助功能、键盘布局


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_27_1.png)


    当前时间也显示在登录屏幕的右上角。将鼠标光标悬停在时间上方，即可在弹出提示框中看到当前日期。


