    # 编辑菜单


    与 Linux Mint 操作系统中的许多功能一样，（开始）菜单也可以根据你的个人喜好进行自定义：


    - 1. 右键点击任务栏左侧的**菜单（Menu）**按钮，然后选择**配置...（Configure...**选项

    - 2. 点击**面板（Panel）**按钮并从可用选项中调整外观和行为。例如，更改菜单的**文本（Text）**值


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_37_0.png)


    **“Super”** 键指的是你键盘上的特殊键。通常，这就是 Windows 键。按下它打开菜单，再次按下即可关闭菜单。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_37_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_37_2.png)


    - 3. 看到你所选的选项立即应用到菜单中


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_37_3.png)


    - 4. 在“菜单”窗口中点击**菜单（Menu）**按钮，然后点击**打开菜单编辑器（Open the menu editor）**按钮 ...续)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_1.png)


    你可以点击汉堡按钮并将你的菜单设置保存为文件，以后可以导入该文件以恢复这些设置。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_2.png)


    - 将所有切换开关滑到“关闭（Off）”位置以简化菜单


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_3.png)


    - 现在，点击打开菜单编辑器按钮


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_4.png)


    - 点击左侧面板中的任何类别，然后在右侧窗格中选择菜单项目


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_5.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_38_6.png)


    你可以取消勾选单个项目以从菜单中移除它们，并点击恢复配置（Restore System Configuration）按钮。


    # 安装更新


    设置了 Timeshift 为你的 Linux Mint 系统定期备份（见第 22 页），建议定期为系统应用所有更新：


    - 将电脑连接到互联网，然后点击菜单（Menu），管理（Administration），打开“更新管理器（Update Manager）”窗口


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_0.png)


    首次打开更新管理器时，可能会出现“欢迎（Welcome）”屏幕。点击 OK 继续。


    - 如果更新管理器建议你切换到本地镜像服务器，点击此 OK


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_1.png)


    - 输入你的密码，点击验证（Authenticate）按钮打开“软件源（Software Sources）”对话框


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_2.png)


    之前的 Linux Mint 版本建议执行选择性更新以防引入问题。Timeshift 改变了这一点，你可以恢复系统。


    - 双击主（Main）区域框并从列表中选择本地镜像，然后点击应用（Apply）


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_39_3.png)


    - 现在，为 Base（bionic）框选择本地镜像，然后点击 OK 关闭“软件源”对话框。等待软件列表更新，然后返回“更新管理器（Update Manager）”窗口。点击全选（Select
    All），然后点击更新（Updates）


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_40_0.png)


    更新缓存和下载更新需要一点，因此选择快速的本地服务器很重要。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_40_1.png)


    如果需要额外的软件包，点击 OK。输入你的密码，点击验证（Authenticate）按钮 – Linux Mint 现在将下载并安装可用更新。![](img/7b6ecabd34062cd153290258f3b9cd5b)


    注意 Linux Mint 中的更新被称为“软件包（packages）”。这些包由 Synaptic 软件包管理器管理，可以在菜单的管理（Administration）类别中找到它。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_40_3.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_40_4.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_40_5.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_40_6.png)


    # 关闭桌面


    - 1. 点击菜单（Menu），然后点击锁定屏幕（Lock screen）按钮立即关闭桌面。

    - 2. 看到屏屏填充屏幕，这样你的电脑就无法使用了。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_41_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_41_1.png)


    你也可以使用 **Ctrl + Alt + L** 快捷键锁定屏幕。要发现更多 Linux Mint 快捷键，点击**菜单（Menu）**、**偏好（Preferences）**、**键盘（Keyboard）**打开“键盘”窗口，然后点击**快捷键（Shortcuts）**按钮。在左侧面板中选择一个类别，例如**系统（System）**，在右侧窗格中查看可用快捷键。![](img/7b6ecabd34062cd153290258f3b9cd5b_41_2.png)


    - 3. 当你想解锁电脑时移动鼠标，将提示输入密码 – 输入你的密码返回桌面。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_41_3.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_41_4.png)


    你可以点击**切换用户（Switch User）**按钮注销 – 你将看到第 26 页所示的**登录（Log in）**屏幕。


    你有时可能出于安全目的或切换用户而退出 Linux Mint 操作系统：


    - 1. 点击菜单（Menu），然后点击注销（Log Out）按钮，显示“会话（Session）”选项对话框。![](img/7b6ecabd34062cd153290258f3b9cd5b_42_0.png)


    - 2. 点击注销（Log Out）选项按钮，或切换用户（Switch User）选项按钮，查看登录界面。![](img/7b6ecabd34062cd153290258f3b9cd5b_42_1.png)


    当你打算离开电脑一段时间时，你可能想要关闭系统：


    - 1. 点击菜单（Menu），然后点击退出（Quit）按钮查看“现在关闭此系统吗？（Shut down this system）”选项出现。

    - 2. 点击关机（Shut Down）选项退出 Linux Mint。


    > 提示：挂起（Suspend）选项会停止所有应用程序并将状态保存在内存中，进入低功耗模式。按下任意键即可唤醒电脑回到离开的地方。![](img/7b6ecabd34062cd153290258f3b9cd5b_42_2.png)


    # 总结


    - 除非安装时选择了“自动登录”选项，否则启动时将要求输入密码。

    - Linux Mint GUI 由桌面和任务栏组成。

    - 桌面包含快捷方式和壁纸。

    - 任务栏包含菜单按钮、显示桌面按钮、应用程序启动器和系统托盘。

    - 系统托盘提供用户信息、网络状态、电池状态、日期时间和音量控制。

    - 桌面可以配置不同的壁纸并包含快捷图标。

    - 小组件（Desklets）是运行在桌面上的小型应用程序。

    - 将鼠标光标悬停在任务栏运行应用程序图标上将显示该应用程序的缩略图。

    - 有用的应用插件（applets）可以添加到任务栏面板。

    - 应用程序启动器在菜单按分类分组。

    - 应用程序启动器可以添加到任务栏和桌面。

    - 菜单可以配置以自定义其外观和行为。

    - 启用 Timeshift 备份工具后，可以使用更新管理器定期应用所有更新。

    - 选择本地镜像作为软件源通常允许更快地下载更新。

    - 可以切换到锁定屏幕来关闭桌面。

    - 注销选项和切换用户选项关闭桌面并打开登录界面。

    - 关机选项关闭桌面并关闭电脑。


    '
