  - '[PAGE 145]


    # Operating on Directories


    It is sometimes useful to be able to extract the name of a file, program, or directory
    from the end of a path address using the basename command. Conversely, you can
    use the dirname command to remove the final part of the path address to a file
    – leaving the path to its parent directory.


    The basename and dirname commands simply manipulate the path string – they do
    not implement any action.


    A new directory can be created in the current working directory by specifying
    a directory name of your choice as the argument to the mkdir command. Alternatively,
    a new directory can be created elsewhere by specifying a full path as the argument:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_145_0.png)


    +   1. To discover the location of the bash program that is the default shell,
    at a prompt enter the command echo SHELL


    +   2. Issue a basename SHELL command to extract the program name from the path
    address


    +   3. Issue a dirname SHELL command to extract the parent directory of the bash
    program from the path


    +   4. Enter the command mkdir Sub1 to create a directory named “Sub1” in the
    current working directory


    +   5. Enter the command mkdirdir/home/mike/Data/Sub2 to create a directory named
    “Sub2” using an absolute path address


    ```

    mike@linux-pc:~/Data

    mike@linux-pc:~$ echo SHELL

    /bin/bash

    mike@linux-pc:~$ basename SHELL

    bash

    mike@linux-pc:~$ dirname SHELL

    /bin

    mike@linux-pc:~$ mkdir Sub1

    mike@linux-pc:~$ mkdir /home/mike/Data/Sub2

    mike@linux-pc:~$ pwd ; ls

    /home/mike/Data

    Sub1 Sub2

    mike@linux-pc:~$

    ```'
  - "[PAGE 146]\n\n# cont'd\n\nDirectories can be removed in the shell using the rmdir\
    \ command. This takes the directory name as its argument and will instantly remove\
    \ an empty directory, but will simply warn you that the directory is not empty\
    \ if it contains files.\n\nHaving to delete files manually, one by one, may provide\
    \ safeguards but can be tedious. An intelligent alternative is available by using\
    \ the recursive interactive -ri option of the rm command. This steps into the\
    \ directory and examines every file—requesting your confirmation before deleting\
    \ each file. When all files have been deleted it then asks if you want to delete\
    \ the directory:\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_146_0.png)\n\nYou\
    \ can use a -v option with both the rmdir command and the rm command to produce\
    \ verbose output— describing what is happening.\n\n+   6 Launch the Text Editor\
    \ using the xed command, and create three text files in the “Sub2” directory\n\
    \n+   7 Issue the command rmdir Sub1 to remove the empty “Sub1” directory\n\n\
    +   8 Now, issue the command rmdir Sub2 to attempt to remove the non-empty “Sub2”\
    \ directory\n\n+   9 Enter the command rm -ri Sub2 to interactively delete the\
    \ files within the “Sub2” directory, and remove the directory itself, by replying\
    \ “Y” (yes) to each question\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_146_1.png)\n\
    \n```\nmike@linux-pc:~/ \nFile Edit View Search Terminal Help\nmike@linux-pc:~$\
    \ rmdir Sub1\nSub1\nmike@linux-pc:~$ rmdir Sub2\nrmdir: failed to remove 'Sub2':\
    \ Directory not empty\nmike@linux-pc:~$ rm -ri Sub2\nrm: Descend into directory\
    \ 'Sub2'? Y\nrm: remove regular file 'Sub2/file-2.txt'? Y\nrm: remove regular\
    \ file 'Sub2/file-1.txt'? Y\nrm: remove regular file 'Sub2/file-3.txt'? Y\nrm:\
    \ remove directory 'Sub2'? Y\nmike@linux-pc:~$ \n```\n\nIf you are feeling brave,\
    \ and are absolutely certain that the directory contains nothing you will miss,\
    \ you can use the rm command with just a -r option to instantly delete a directory\
    \ and its entire contents — use with care!"
- md: "\n## Managing Files\n\nThe shell mv command lets you easily move files around\
    \ your Linux system from the command line. This command requires two arguments\
    \ stating the name of the file to be moved, and the destination to which it should\
    \ be moved. Interestingly, the mv command can also be used to rename a file by\
    \ stating its current name and a new name as its two arguments.\n\nIf you wish\
    \ to copy rather than move a file to a new location, the cp command can be used.\
    \ This command can accept one or more files to be copied as its arguments, stating\
    \ the destination as the final argument:\n\n- Launch a shell Terminal, then enter\
    \ an ls command to see the contents of the current directory\n- Issue an mv command\
    \ to rename an existing file – for example, from \"alpha.txt\" to \"zebra.txt\"\
    \ with alpha.txt zebra.txt and an ls command to confirm the name change\n- Enter\
    \ mv zebra.txt Box to move the renamed file to a sub-directory, and an ls command\
    \ to see it\n- Enter cp some.txt Box to copy a file named \"some.txt\" to the\
    \ same sub-directory\n- Issue an ls command with the name of the sub-directory\
    \ – confirming a file was moved and a file copied\n\nUse the -i option with the\
    \ mv command to prompt before overwriting a file of the same name.\n\n```\nmike@linux-pc:~\\\
    $ ls\nalpha.txt Box some.txt\nmike@linux-pc:~\\$ mv alpha.txt zebra.txt\nmike@linux-pc:~\\\
    $ ls\nBox some.txt zebra.txt\nmike@linux-pc:~\\$ mv zebra.txt Box\nmike@linux-pc:~\\\
    $ ls\nBox some.txt\nmike@linux-pc:~\\$ cp some.txt Box\nmike@linux-pc:~\\$ ls\
    \ Box\nsome.txt zebra.txt\nmike@linux-pc:~\\$ ls _\n```\n\nThe rm command can\
    \ be used to delete one or more files named as its arguments. The * wildcard can\
    \ also be used to delete all files in a directory - if you are absolutely certain\
    \ none are.\n\nYou can create hard links, pointing to the system address of a\
    \ file, and soft (symbolic) links, storing the path to a file, with the ln command.\
    \ By default this will create a hard link to the file named as its argument -\
    \ use it -s option to create a symbolic link.\n\nThe readlink command can be used\
    \ to discover the target to which a symbolic link is pointing:\n\n- Enter Box/zebra.txt\
    \ to delete a file in a sub-directory and an ls Box to confirm it's gone\n- Enter\
    \ Box/some.txt hardlink to create a hard link named \"hardlink\" to a file in\
    \ the sub-directory\n- Now, enter ln -s Box/some.txt softlink command to create\
    \ a soft link named \"softlink\" to the same file\n- Enter an ls command to see\
    \ both links have been created in the home directory\n- Enter a readlink softlink\
    \ command to see the target to which the soft link points\n\nThe wildcard * character\
    \ means \"all\" and should be used with caution.\n\n```\nmike@linux-pc:~/Data\n\
    mike@linux-pc:~/$ ls\nBox some.txt\nmike@linux-pc:~/$ rm Box/zebra.txt\nmike@linux-pc:~/$\
    \ ls\nsome.txt\nmike@linux-pc:~/$ ln Box/some.txt hardlink\nmike@linux-pc:~/$\
    \ ln -s Box/some.txt softlink\nmike@linux-pc:~/ls\nhardlink softlink readlink\
    \ some.txt\nBox/some.txt\nmike@linux-pc:~/$ _\n```\n\nYou can find more details\
    \ on shortcut links on page 68.\n\n## Examining File Properties\n\nThe Linux shell\
    \ provides many commands that can be used to examine attributes of any file. The\
    \ most comprehensive is the stat command that lists every attribute of the file\
    \ stated as its argument.\n\nIf you just want to discover the file size, use the\
    \ du disk usage command with its -b option to count the number of bytes.\n\nUse\
    \ the wc word count to quickly discover how many newlines, and bytes of a text\
    \ file contains, or assess what type of file it is with the file command:\n\n\
    Use the wc command with its -m option to see a total word count.\n\n- Enter stat\
    \ Box/some.txt to discover the attributes of a file named \"some.txt\" in a Box\
    \ sub-directory\n- Enter du -b Box/some.txt to discover the size of this file\
    \ in byte units\n- Enter wc Box/some.txt to discover that file's line count, word\
    \ count, and byte count\n- Now, enter file Box/some.txt and file Box/tuk.png commands\
    \ to discover the file type of two files\n\nSee that the wc command reveals the\
    \ number of newlines (29), words (175), and bytes (1137) of this file.\n\n```\n\
    mike@linux-pc:~/ \nFile Edit View Search Terminal\nmike@linux-pc:~/ stat Box/some.txt\n\
    File: Box/some.txt\nSize: 1137\nBlocks: 4096\nDevice: 802h/2058 Inode: 2110694\n\
    Links: 1\nAccess: (0644/-rw--) U: (1000) Gid: (1000)\nModify: 2019-07-25 08:25:39.94670968+038\n\
    Change: 2019-07-25 09:05:39.94673490+038\nBirth:\nmike@linux-pc:~/ du/some.txt\n\
    mike@linux-pc:~/ wc Box/some.txt\n29 175 1137\nmike@linux-pc:~/ file/some.txt\n\
    Box/some.txt: UTF-8 text, with long lines\nfile Box/tuk.png\nBox/tuk.png: PNG\
    \ image data, 8-bit color RGBA, non-interaced\n```\n\nThe touch command introduces\
    \ some possibilities, as it can change the Last Accessed and Last Modified attributes\
    \ of a file. Used alone it updates these to the present time, but used with -d\
    \ allows you to specify a date in various formats – specify a day and month to\
    \ set the timestamps to midnight on that day of the current year, or specify a\
    \ complete date including year and time. Dates supplied as an argument to the\
    \ touch command must be enclosed within quotes.\n\n- Enter touch -d \"02/21\"\
    \ more.txt to update the timestamps of a file named \"more.txt\" to that date\
    \ in the current year\n- Enter a stat more.txt command to confirm the timestamps\
    \ have been updated\n- Now, enter touch -d \"06/15/2020 12:00\" more.txt to update\
    \ timestamps to the specified date, time, and year\n- Enter a stat more.txt command\
    \ to confirm the timestamps have been updated\n\n```\nmike@linux-pc: ~$\nm@linux-pc:~$\
    \ stat more.txt\nFile: more.txt\nSize: 0\nBlocks: 0\nDevice: 802h/2058d Inode:\
    \ 2110691\nLinks: 1\nAccess: (0644/rw--r--)Uid: (1000/)\nAccess: 2020-02-21 00:00:00.00000000+0200\n\
    Modify: 2019-07-21 08:00:00.00000000+0200\nChange: 2019-07-25 09:17:59.953465728+0300\n\
    Birth:\nmike@linux-pc:~$ touch -d \"06/15/2020 12:00\" more.txt\nmike@linux-pc:~$\
    \ stat more.txt\nFile: more.txt\nSize: 0\nBlocks: 0\nDevice: 802h/2058d Inode:\
    \ 2110691\nLinks: 1\nAccess: (0644/rw--r--)Uid: (1000/)\nAccess: 2020-06-15 12:00:00.00000000+0300\n\
    Modify: 2019-07-21 08:00:00.00000000+0200\nChange: 2019-07-25 09:17:59.953465728+0300\n\
