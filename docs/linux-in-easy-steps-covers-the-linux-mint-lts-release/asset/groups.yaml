  - '[PAGE 68]


    Open the Public folder, then right-click on the copied file and choose Rename
    from the context menu to see the file name get highlighted – ready to be changed


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_68_0.png)


    You can right-click in the file browser and choose Create New Folder from the
    context menu to add a new directory – but remember that this should be within
    your home directory hierarchy.


    Now, type a new file name (“copy”), for instance), then hit Return to rename the
    file as copy.txt – the file extension remains


    Right-click on the renamed file and choose Cut from the context menu


    Navigate back into the Documents folder, then right-click on the file browser
    window and choose Paste from the context menu – depositing the renamed file


    Drag the mouse pointer across both files, then right-click and choose Move to
    Trash to delete the files


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_68_1.png)


    To recover a trashed file, click the Trash icon on the file browser''s sidebar
    (or the one on the Desktop), right-click the file icon, then choose the Restore
    option from the context menu.'
  - '[PAGE 69]


    # Creating Shortcuts


    It is often convenient to create Desktop shortcuts to the apps and files you access
    most frequently. Shortcuts for apps can be created from options on the Menu, or
    from the Desktop context menu. Shortcuts for files can be created as links using
    the file browser:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_69_0.png)


    A shortcut or a link can be deleted in the same way as a file - select its icon
    then hit the Delete key. Alternatively, right-click on the icon then choose Delete
    or choose Move to Trash.


    +   * Right-click an app icon on the Menu, then click the Add to desktop option
    to place a shortcut on the Desktop


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_69_1.png)


    +   * Right-click anywhere on the Desktop, then Choose a new launcher here from
    the context menu – to open a "Launcher Properties" dialog box


    +   * Enter a shortcut Name, then click the Browse button to open a "Choose a
    command" dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_69_2.png)


    +   * Navigate to the /usr/bin directory and select the app for which you want
    to create a shortcut – to add its path in the Command field


    The /usr directory contains sub-directories storing programs that can be run by
    any user.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_69_3.png)


    +   * Click the icon button to open a "Choose an icon" dialog'
