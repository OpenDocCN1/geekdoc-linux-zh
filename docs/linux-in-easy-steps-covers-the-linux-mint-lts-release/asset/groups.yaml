    ## Selecting Appearance


    By default, your Linux Mint Desktop will automatically switch to the screensaver
    if you do not interact with your PC for a while. This means you may frequently
    have to enter your password to return to the Desktop and is unnecessary if your
    PC is located in an environment where security is not a concern. Fortunately,
    you can disable this behavior so the Desktop will always be visible unless you
    choose to explicitly lock the PC.


    You may also choose how the screen appears by selecting a custom screensaver,
    and you can add a message to the Lock screen:


    - 1. Click Menu, Preferences, Screensaver to open a “Screensaver” window

    - 2. Next, click the Settings button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_45_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_45_1.png)


    Notice that you can choose to extend the delay before the screensaver will appear
    if you don’t want to totally disable the screensaver.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_45_2.png)


    - 3. Now, open the drop-down menu for “Screensaver settings” and select the Never
    option – to stop your PC automatically switching to the Lock screen

    - 4. Click the Screensaver button


    Choose any item in the Select screensaver list to see its preview play in the
    “Screensaver” window – your final choice will become your screensaver


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_46_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_46_1.png)


    All screensavers are animations except for the standard Cinnamon Lock screen "Screen
    Locker".


    Next, click the Customize button, then type a custom Away message to be displayed
    on the Lock screen


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_46_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_46_3.png)


    Click the Lock screen button to see your screensaver, then click to see your message
    on the Lock screen


    There is also a Customize option to “Ask for a custom message when locking the
    screen from the menu” – so you can add a unique message when you leave your PC.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_46_4.png)


    ## Managing Windows


    The control buttons on the Linux Mint window title bars perform the same actions
    as in the Windows operating system:


    - Minimize to Taskbar

    - Maximize/Reduce Size

    - Close Window


    Windows that are not full-size, snapped, or tiled, can be resized by dragging
    their edges or corners.


    You can also snap windows to the screen edges, tile windows to the corners of
    the screen, and move windows between workspaces:


    - Click Menu, Accessories, Text Editor to open the Text Editor app

    - Click the window''s control button to reduce it from full-screen size

    - Next, click on the window''s title bar and hold down the mouse button, then
    drag the window to any screen edge

    - When you see a zone preview, release the mouse button to snap the window to
    that edge – filling half of your screen


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_47_0.png)


    You can ignore the on-screen instruction to Hold <ctrl>. Simply snap two apps
    to the left and right sides of your screen to work on two documents at the same
    time.


    - Now, click on the window''s title bar and hold down the mouse button, then drag
    the window to any screen corner

    - 6 When you see a zone preview, release the mouse button to snap the window to
    that corner – filling a quarter of your screen


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_48_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_48_1.png)


    You can tile up to four apps. Also, you can snap and tile. For example, tile two
    apps at the top corners and snap another app across the bottom half of the screen
    on three documents at the same time.

    - 7 Click Menu, Preferences, Hot Corners to open a “Hot Corners” window

    - 8 Enable the top left-hand corner to show workspaces, then move the mouse cursor
    to that corner to see the workspaces


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_48_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_48_3.png)


    You can drag apps from one workspace to another and click any workspace to begin
    working there. The apps remain running on hidden workspaces so you can switch
    back to them.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_48_4.png)


    ## Personalizing Options


    You can personalize the behavior and appearance of windows by specifying preferences
    on your Linux Mint system. For example, many people prefer to change the default
    light gray to dark gray:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_49_0.png)


    Slide this toggle switch to the "Off" position to disable snapping or tiling your
    windows.


    - Click Menu, Preferences, Window Tiling to open a "Window Tiling" window – here
    you can disable Tiling or modify its behavior


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_49_1.png)


    Select the Shade option on this drop-menu to add an extra button that lets you
    minimize a window in another way. Click the Alt-Tab button at the top explore
    switcher options. To use the switcher hold down the Alt key then the Tab key.
    Release the Alt key to give window focus.

    - Click Menu, Preferences, Windows to open a "Windows" window – here you can modify
    title bar and window actions

    - Click Menu, Preferences, Themes to open a "Themes" window, then click the Themes
    button to see the current appearance


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_49_3.png)


    ## Themes


    > Hot tip: Click the Add/Remove button to see a list of themes you can download
    and install. These provide additional options on the fly-out menu for the Desktop.


    Click the current Mint-Y setting for “Window borders” to open a fly-out menu,
    then select the Mint-Dark option to instantly change the border appearance. Similarly,
    click the current Mint-Y setting for “Controls”, then select Mint-Dark on the
    fly-out menu to instantly change the appearance of window controls


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_50_1.png)


    > Hot tip: Click the Settings button to see options to show or hide icons on window
    buttons and menus.


    ## Controlling Connections


    Linux Mint allows you to easily control how you connect to the internet via wireless
    Wi-Fi or wired Ethernet connections. You can also mask your presence via a proxy
    server or through a Virtual Private Network (VPN) connection:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_51_0.png)


    - Click Menu, Preferences, Network to open a “Network” window, then click Wi-Fi
    in the left-hand pane – see available wireless connections in the right-hand pane


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_51_1.png)


    You can also click the “Wireless connection” icon on the System Tray to view network
    status.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_51_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_51_3.png)


    - Similarly, click Wired to see available wired connections


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_51_4.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_51_5.png)


    - Click Network proxy to see or add details for a proxy server with which you
    could mask your presence


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_51_6.png)


    Click the + Add button to open an “Add VPN” dialog, then choose the Point-to-Point
    Tunneling Protocol (PPTP) option


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_52_0.png)


    Next, enter the Name, URL, and details of your VPN service, then click the Advanced...
    button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_52_1.png)


    You will need to click this icon and choose whether to store the password before
    you enter a password.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_52_2.png)


    Select authentication and security options and click OK, then click the + Add
    button on the “Add VPN” dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_52_3.png)


    Click the newly-added VPN entry in the “Network” window, then slide the toggle
    to the ‘On’ position to connect


    Also in the “Preferences” category there is a Network Connections app that displays
    your connection history. You can double-click any network item to open an Editing
    dialog for connection.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_52_4.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_52_5.png)

