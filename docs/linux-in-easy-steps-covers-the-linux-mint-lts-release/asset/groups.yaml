    # 添加打印机


    Linux Mint 提供了广泛打印机的驱动程序，因此添加打印机只需将打印机连接到电脑的 USB 端口并开启电源即可。操作系统应该识别打印机并显示通知，说明它已自动添加到您的系统：


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_53_0.png)


    USB 连接的打印机


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_53_1.png)


    添加的打印机的属性和选项可以在“打印机”（Printers）应用程序中找到，该程序也可用于添加网络打印机：


    - 点击菜单（Menu）、管理（Administration）、打印机（Printers）打开“打印机”窗口


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_53_2.png)


    您可以点击“属性”（Properties）对话框上的“打印测试页”来测试您的打印机。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_53_3.png)


    - 双击已安装的打印机打开其“属性”对话框


    点击“打印机”菜单并选择“查看打印队列”以打开“文档打印状态”对话框，您可以在其中控制打印任务。


    - 接下来，开启网络打印机并按下其 Wi-Fi 按钮使其对网络可见


    - 现在，点击“打印机”窗口上的“+ 添加”按钮 – 打开“新打印机”对话框，列出可用的打印机


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_53_4.png)


    # 展开“网络打印机”类别，然后选择您的打印机并点击“前进”按钮


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_0.png)


    Wi-Fi 连接的打印机


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_2.png)


    如果您的打印机没有立即列在列表中，可以点击“查找网络打印机”选项来搜索您的打印机。


    # 输入打印机的名称和描述，然后点击“应用”按钮


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_3.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_4.png)


    带有勾选标记的打印机图标表示系统默认打印机。您可以通过其右键菜单更改默认打印机。


    # 确认网络打印机已添加到“打印机”窗口并已准备好打印


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_5.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_6.png)


    # 通过蓝牙配对


    Linux Mint 允许您使用 USB 适配器和蓝牙设备管理器连接支持蓝牙技术的外部设备，例如蓝牙扬声器：


    您可以在 bluetooth.com 在线了解更多关于蓝牙的信息


    - 1. 将蓝牙适配器连接到电脑的 USB 端口

    - 2. 开启蓝牙扬声器


    如果您的电脑没有内置蓝牙适配器，则需要连接适配器。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_55_0.png)


    - 3. 按住扬声器的“配对”按钮三秒钟将其切换到配对模式

    - 4. 在电脑上，点击菜单（Menu）、偏好（Preferences）、蓝牙（Bluetooth）打开蓝牙设备管理器

    - 5. 将开关拨到“开启”位置以搜索附近的蓝牙设备


    在蓝牙设备管理器上拨动开关启用或禁用蓝牙。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_55_1.png)


    # ...续


    - 6. 找到扬声器后，点击“设备”列表中的蓝牙项将其与电脑配对


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_0.png)


    > 出于安全考虑，蓝牙设备管理器有时要求您确认设备的 PIN 码以建立连接。


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_56_1.png)


    - 7. 当扬声器连接后，点击“设备”列表中的蓝牙项查看状态对话框


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_56_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_56_3.png)


    配对后，可以断开并重新连接设备，但如果移除它，将需要再次配对。


    - 8. 点击设置并将开关拨到“开启”位置显示托栏图标

    - 9. 将光标悬停在系统托栏图标上查看配对


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_56_4.png)


    # 总结


    - 可以使用屏保程序禁用或选择动画屏保。

    - 锁定屏幕可以自定义用户不在时显示“离开”消息。

    - Linux Mint 的标题栏包含最小化、最大化和关闭按钮。

    - 窗口可以吸附到屏幕边缘和角落。

    - 可以启用热点功能来显示工作区。

    - 窗口可以从一个工作区拖到另一个，应用程序将在隐藏工作区继续运行。

    - 窗口平铺程序可以禁用平铺和吸附或修改其行为。

    - 应用程序可用于修改标题栏操作和窗口。

    - 可以通过 Alt 和 Tab 键选择窗口。

    - 主题程序可以更改窗口边框、图标、控件、鼠标指针和桌面。

    - 网络应用程序可以控制 Wi-Fi 连接、有线连接和代理连接。

    - 网络应用程序也可用于添加 VPN 连接以隐藏您的。

    - 网络应用程序也可用于添加系统 VPN 连接。


    Linux 中缺少盘符可能是 Linux 与 Windows 之间最大的差异——目录结构的排列方式。在 Linux 中，一切都包含在一个单一的系统中——以单斜杠
    / 表示的“根”目录。


    Linux 安装在根目录下创建了若干标准目录。每个目录又有自己的子目录结构，从而形成目录“树”——文件系统的 /root。


    # 浏览文件系统


    外部驱动器的内容出现在 Linux 挂载的树中，创建一个统一结构。下表列出了 Linux Mint 文件系统的目录结构。所有这些都是根目录 的子目录。


    # 系统层次结构根


    | 目录 | 描述 |

    | --- | --- |

    | /bin | 基本二进制文件 |

    | /boot | 静态启动文件 |

    | /cdrom | 历史挂载点 |

    | /dev | 设备文件 |

    | /etc | 配置文件 |

    | /home | 用户主目录 |

    | /lib | 库文件 (32位) |

    | /lib64 | 库文件 (64位) |

    | /lost+found | 恢复的文件 |

    | /media | 可移动式介质 |

    | /mnt | 临时挂载点 |

    | /opt | 可选软件包 |

    | /proc | 内核和进程文件 |

    | /root | root 用户主目录 |

    | /run | 应用程序状态文件 |

    | /sbin | 系统二进制文件 |

    | /srv | 服务数据 |

    | /sys | 虚拟文件系统 |

    | /timeshift | 备份文件 |

    | /tmp | 临时文件 |

    | /usr | 用户二进制文件 |

    | /var | 可变数据文件 |


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_60_0.png)


    > 注意

    不要将 /root 目录（root 超用户的家目录）与文件系统的 /root 混淆。


    本章后续页面将更详细描述每个标准 Linux 目录的作用。


    '
