    # Summary


    +   - Unless the “Log in automatically” option was selected during installation,
    the Log in screen will request your password whenever you start the Linux Mint
    operating system.


    +   - The Linux Mint GUI comprises a Desktop and Taskbar.


    +   - The Desktop contains shortcuts and background wallpaper.


    +   - The Taskbar contains a Menu button, Show Desktop button, app launchers,
    and the System Tray.


    +   - The System Tray provides access to User Info, Network Status, Battery Status,
    Time & Date, and Volume Control.


    +   - The Desktop can be configured to have different background Wallpaper and
    to contain different Shortcut icons.


    +   - Desklets are small apps that run on the Desktop.


    +   - Hovering the mouse cursor over the Taskbar icon of a running app will display
    a Thumbnail Preview of that app.


    +   - Useful applets can be added to the Taskbar panel.


    +   - App launchers are grouped by category on the Menu.


    +   - App launchers can be added to the Taskbar and Desktop.


    +   - The Menu can be configured to customize its Appearance and its Behavior.


    +   - With the Timeshift backup utility enabled, all updates can be regularly
