  - '[PAGE 71]


    # # Locating Files


    It is important to recognize that many directories in Linux contain sub-directories
    and hidden files containing configuration data. These are like the "System" files
    that are hidden by default in the Windows operating system. In Linux, the name
    of each hidden directory and file always begins with a dot.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_71_0.png)


    1 Open the file browser in your home directory


    2 Now, click View, Show Hidden Files to see all contents


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_71_1.png)


    > > Right-click on the file browser window then select Arrange Items from the
    context menu to choose how you would like the contents arranged.


    +   - Create New File

    - Create New Folder

    - Open in Terminal

    - Open as Root

    - Show Hidden Files

    - Properties


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_71_2.png)'
  - '[PAGE 72]


    The easiest way to find a file on your system is with the “Search” box in the
    Nemo file browser. You can find all files of a particular file by entering a file
    extension into the Search box. For example, enter txt to find all files with a
    “.txt” file extension.


    Conversely, you can find all files of a known name regardless of the file extension
    by entering a name into the Search box. The file browser begins searching as soon
    as you enter three characters into the Search box, so you don''t need to know
    the full name, and the letters not be the first three letters of the name – just
    three consecutive letters within the name. You can substitute a wildcard for unknown
    letters. The search is not case-sensitive, so the results will include uppercase
    and lowercase matches to the name (or part-name) that you enter:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_72_0.png)


    The Search results will not include hidden files.


    +   1. Open the file in your home directory


    +   2. Click the Search button on the toolbar


    +   3. Type three characters into the Search box to match a file name or sub-directory
    within your home directory


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_72_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_72_2.png)


    You can click the Favorites button to save or searches, and right-click it to
    display saved favorites to quickly make a search again.


    +   Type three characters in the Search box to match any file whose extension
    ends with “pg”


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_72_3.png)'
  - '[PAGE 73]


    # Understanding Permissions


    In Linux each file and directory has an “Owner” – generally, this is the user
    who created it. The Owner has full permission to read the file, write to the file,
    and to execute the file (if it''s executable).


    The Owner may also set permissions to specify if other users can read, write,
    and execute the file. The file''s accessibility can be restricted to the Owner,
    to a “Group” of which the owner is a member, or to any of the system (“Others”).


    Permission settings of a file can be found on the Permissions tab of its Properties
    dialog:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_73_0.png)


    When a user account is created, a **Group** of the same name is also created –
    of which that user is a member.


    +   1. Right-click on a file, then choose the **Properties** item from the context
    menu – to launch the “Properties” dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_73_1.png)


    example.txt Properties

    | Permissions | Open With | Emblems |


    | Type | Text (2/plain) |

    | Size | 27 bytes |

    | Location | Home/Mike/Documents |

    | Volume | unknown |

    | Accessed | Wed 01 Aug 2018 12:00:00 PM EEST |

    | Modified | Wed 01 Aug 2018 12:00:00 PM EEST |


    You can select the **Emblems** tab to add a symbol to the file icon – for example,
    denoting the file as important.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_73_2.png)


    +   2. Click on the **Permissions** tab to view the current settings


    Here, the **Owner** and **Group** have “Read and write” permission, but **Others**
    have “Read-only” permission.


    example.txt Properties

    | Basic | Open With | Emblems |


    | Owner | Mike McGrath |

    | Access | Read and write |

    | Group | mike |

    | Access | Read and write |

    | Access | Read-only |

    | Execute | Allow executing file as program |

    | Last changed | Wed 01 Aug 2018 12:00:00 PM EEST |'
  - '[PAGE 74]


    Usually the Owner, Group and Others will have permission to at least read the
    file. If you are the owner of the file, the Owner will have permission to write
    – and to execute the file if it''s executable.


    As the owner of the file you can use the arrow buttons to change the access permissions
    of this file:


    +   Click the arrow button in the “Others” field, then choose None from the drop-down
    menu to restrict access to the Owner and Group members


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_74_0.png)


    If you need to change permissions on files where you are not the owner, you need
    superuser status – see page 164 for details.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_74_1.png)


    Checking this option makes the file executable for those users who have permission
    to access it.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_74_2.png)


    +   Click on the Open With tab if you would also like to change the default app
    that opens this file


