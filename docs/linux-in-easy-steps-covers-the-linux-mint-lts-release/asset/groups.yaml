    ## 总结


    - **Linux** 是一种源自强大的 Unix 系统的免费、多多操作系统。“Linux”名称结合了其创始人 Linus Torvalds 的名字和 Unix
    的最后一个字母。

    - **KDE** 和 **Gnome** 桌面都是用户友好的图形界面，提供了与 Windows 桌面相同的点击便利性。

    - **内核（kernel）**提供了 Linux 的核心功能。

    - Linux **发行版（distros）** 将内核、系统级程序和免费的用户级程序打包。

    - 最流行的 Linux Mint 发行版使用 *Cinnamon* 桌面管理器，是初学者的最佳发行版。

    - 运行 Linux Mint 的最低硬件**要求（requirements）**：1GB RAM、15GB 磁盘空间以及 1024 x 768 的分辨率——更高的规格更好。

    - 可以轻松为电脑添加第二个**硬盘**，使其能够双启动 Linux 或 Windows。

    - 可以下载 Linux 发行版并作为文件镜像写入 USB 驱动器以创建**启动媒体（boot media）**。

    - 为了从 USB 闪启动，可能需要使用**设置工具（Setup Utility）**更改启动设备顺序。

    - Linux Mint **安装程序（installer）**允许您将 Linux 作为唯一操作系统，或与 Windows 同时安装。

    - 在开始使用 Linux Mint 操作系统之前，建议启用 **Timeshift** 备份工具，以便在出现问题时恢复系统。


