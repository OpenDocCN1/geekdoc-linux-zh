  mdcn: "\n\n## 创建启动介质\n\nLinux Mint 发行版提供三个版本，分别带有名为“Cinnamon”、“MATE”和“Xfce”的桌面环境。最流行的版本是\
    \ Cinnamon 版本，本书将贯穿使用该版本。它可以被下载到 USB 闪盘中以创建“启动介质”。这让你你可以在不更改系统的情况下尝试 Linux，并在需要时将\
    \ Linux 安装到你的系统上。首先，你需要确保你的系统满足这些最低要求：\n\nUSB 闪盘 —— 也被称为 Thumb Drive、Pen Drive、Disk\
    \ Key、Gig Stick 或 Memory Stick。\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_15_0.png)\n\
    \n- 1GB 运行内存（建议 2GB）\n- 15GB 磁盘空间（建议 20GB）\n- 1024 x 768 屏幕分辨率\n\n与其他 Linux 发行版一样，Linux\
    \ Mint 发行版是一个 ISO 镜像文件，其内容必须被“刻录（burnt）”到 USB 闪盘中（而不仅仅是复制），才能创建启动介质：\n\n1. 启动浏览器，导航到下载页面\
    \ linuxmint.com/download.php\n2. 接下来，点击 Cinnamon 64-bit \n\n| 版本 | 32-位 | 64-位\
    \ | 说明 |\n| :--- | :--- | :--- | :--- |\n| Cinnamon | 32-bit | 64-bit | 具有 Cinnamon\
    \ 桌面的版本 |\n| MATE | 32-bit | 64-bit | 具有 MATE 桌面的版本 |\n| Xfce | 32-bit | 64-bit\
    \ | 具有 Xfce 桌面的版本 |\n\n> 提供 32 位版本仅是为了兼容旧电脑 —— 即在 2008 年之前制造的电脑。你通常应该下载 64 位版本。如果你的电脑不兼容，你会看到错误信息\
    \ —— 这不会造成任何伤害。\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_15_1.png)\n\n3. 现在，从出现的列表中点击你所在国家的下载镜像链接\n\
    4. 选择将 ISO 镜像文件保存到系统中的常用位置以开始下载\n5. 当 ISO 下载完成后，你需要一个应用将镜像刻录到 USB 闪盘。Linux Mint\
    \ 推荐使用 Etcher 应用。导航浏览器到 etcher.io 并下载适用于你系统的安装程序。例如，“Download for Windows x64”\n\
    \n...续\n\n当安装程序下载完成后，运行其 **Setup** 向向导在你的系统上安装 Etcher\n\n接下来，将 USB 闪盘连接到你的电脑\n\
    \n现在，启动 Etcher 应用并点击 **Select image** 按钮，然后选择你下载的 ISO 镜像文件\n\n> 小贴：如果你想验证 ISO\
    \ 镜像文件（建议如此），可以在 linuxmint-installation-guide.readthedocs.io/en/latest/verify.html\
    \ 上找到如何操作的说明\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_16_0.png)\n\n点击 **Select\
    \ drive** 按钮，然后选择连接到电脑的 USB 闪盘\n\n点击 **Flash!** 按钮将 ISO 内容刻录到 USB 闪盘 —— 创建 Linux\
    \ 启动介质\n\n![](img/7b6ecabd34062cd153290258f3b9cd5b_16_1.png)\n\n## 实时会话\n\n创建启动介质后，按照第\
    \ 14-15 页的步骤，你现在能够在“实时会话（Live Session）”中运行 Linux Mint。这意味着你可以在硬盘上已安装 Windows 系统的\
    \ PC 上安全地探索 Linux 操作系统。\n\n为了开始实时会话，你的 PC 必须能够从包含启动介质的 USB 闪盘启动。这要求 PC 的启动设置在从硬盘查找指令之前，先从\
    \ USB 闪盘查找指令。如果你的电脑首先尝试从硬盘启动，你需要更改设置：\n\n现代电脑中的 UEFI（统一可扩展接口）取代了早期电脑中的 BIOS（基本输入/输出系统）固件接口。这些控制着你的电脑如何启动。\n\
