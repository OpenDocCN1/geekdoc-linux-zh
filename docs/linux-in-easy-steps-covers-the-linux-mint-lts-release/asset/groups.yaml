    # Adding Printers


    Linux Mint provides drivers for a wide range of printers, so adding a printer
    is often simply a matter of connecting the printer to a USB port on your PC and
    turning the printer on. The operating system should recognize the printer and
    display a notification that it has been automatically added to your system:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_53_0.png)


    USB connected printer


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_53_1.png)


    The properties and options of added printers can be found in the “Printers” app,
    which can also be used to add network printers:


    - Click Menu, Administration, Printers to open a “Printers” window


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_53_2.png)


    You can click the Print Test page on the “Properties” dialog to test your printer.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_53_3.png)


    - Double-click on an installed printer to open its “Properties” dialog


    Click the Printer menu and select the View Print Queue to open a “Document Print
    Status” dialog where you can control print.


    - Next, turn on a network printer and press its Wi-Fi button to make it visible
    to the network


    - Now, click the + Add button on the “Printers” window – to open a “New Printers”
    dialog, listing available printers


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_53_4.png)


    # Expand the Network Printer category, then select your printer and click the
    Forward button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_0.png)


    Wi-Fi connected printer


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_2.png)


    If your printer is not immediately listed you can click the Find Network Printer
    option to seek your printer.


    # Enter a name and description of the printer, then click the Apply button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_3.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_4.png)


    The printer icon marked with check denotes the system-wide default printer. You
    can change the default printer from its right-click menu.


    # See that the network printer is now added to the "Printers" window and is ready
    to print


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_5.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_54_6.png)


    # Pairing via Bluetooth


    Linux Mint allows you to connect an external device that supports Bluetooth technology,
    such as a Bluetooth speaker, using a USB dongle and the Bluetooth device manager:


    You can discover more about Bluetooth online at bluetooth.com


    - 1. Connect a Bluetooth dongle to a USB port on your PC

    - 2. Turn on the Bluetooth speaker


    You only need to connect a dongle if your PC does not have a built-in Bluetooth
    adapter.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_55_0.png)


    - 3. Press and hold the speaker’s “pair” button for three seconds to switch the
    speaker into pairing mode

    - 4. On your PC, click Menu, Preferences, Bluetooth to open the Bluetooth device
    manager

    - 5. Slide the toggle switch to the “On” position to search for nearby Bluetooth
    devices


    Slide the toggle switch on the Bluetooth device manager to enable or disable Bluetooth.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_55_1.png)


    # ...cont''d


    - 6. When the speaker is found, click on the Bluetooth item in the “Devices” list
    to pair it with your PC


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_56_0.png)


    > For security reasons the Bluetooth device manager will sometimes require you
    to confirm a device''s PIN in order to establish a connection.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_56_1.png)


    - 7. When the speaker is connected, click on the Bluetooth item in the “Devices”
    list to see its status dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_56_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_56_3.png)


    Once paired, you can disconnect and reconnect to the device, but if you remove
    it you will need to pair it again to re-establish a connection.


    - 8. Click the Settings button and slide the toggle switch to the “On” position
    for Show a tray icon

    - 9. Place the cursor over the System Tray Bluetooth icon to see the pairing


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_56_4.png)


    # Summary


    - The Screensaver app can be used to disable the screensaver or to choose an animated
    screensaver.

    - The Lock screen can be customized to display an “Away message” for times when
    the user is absent.

    - The window title bars in Linux Mint contain familiar Minimize, Maximize/Reduce,
    and Close buttons.

    - Windows can be snapped to the screen edges and tiled corners.

    - The Hot Corner feature can be enabled to display workspaces.

    - Windows can be dragged from one Workspace to another and the apps will remain
    running on hidden workspaces.

    - The Window Tiling app can be used to disable Tiling and Snapping or to modify
    their behavior.

    - The Windows app can be used to modify title bar actions and to modify window
    actions.

    - A window can be selected with the Window Switcher feature, by pressing the Alt
    and Tab keyboard keys.

    - The Themes app can be used to change the look of Window Borders, Icons, Controls,
    Mouse Pointer, and Desktop.

    - Wi-Fi connections, wired connections, and proxy connections can be controlled
    with the Network app.

    - The Network app can also be used to add a VPN connection to mask your presence
    when.

    - The Network app can also be used to add a VPN connection to the system.


    The lack of drive letters in Linux indicates what is, perhaps, the biggest difference
    between Linux and Windows – the way their directory structures are arranged. In
    Linux everything is contained within a single unified system – beginning with
    the "root" directory, symbolized by a single slash /.


    The Linux installation creates a number of standard directories within the root
    directory. Each one of them, in turn, houses its own sub-directory structure,
    thereby creating a directory "tree" – the /root of file system.


    # Touring the File System


    Contents of peripheral drives appear in the tree at which they are “mounted” by
    Linux, creating a unified structure. The table below lists the directory structure
    of the Linux Mint file system. All are sub-directories of the basic root directory
    "".


    # Root of the system hierarchy


    | Directory | Description |

    | --- | --- |

    | /bin | Essential binaries |

    | /boot | Static boot files |

    | /cdrom | Historical mount point |

    | /dev | Device files |

    | /etc | Configuration files |

    | /home | User home folders |

    | /lib | Library files (32-bit) |

    | /lib64 | Library files (64-bit) |

    | /lost+found | Recovered files |

    | /media | Removable media |

    | /mnt | Temporary mount point |

    | /opt | Optional packages |

    | /proc | Kernel and process files |

    | /root | Root user home folder |

    | /run | Application state files |

    | /sbin | System binaries |

    | /srv | Service data |

    | /sys | Virtual file system |

    | /timeshift | Backup files |

    | /tmp | Temporary files |

    | /usr | User binaries |

    | /var | Variable data files |


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_60_0.png)


    > Beware

    Dont confuse the /root directory (the home directory of the root superuser) with
    the /root of file system.


    The purpose of each standard Linux directory is described in more detail on the
    ensuing pages of this chapter.

