    Drag the mouse pointer across both files, then right-click and choose Move to
    Trash to delete the files


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_68_1.png)


    To recover a trashed file, click the Trash icon on the file browser''s sidebar
    (or the one on the Desktop), right-click the file icon, then choose the Restore
    option from the context menu.


    ## Creating Shortcuts


    It is often convenient to create Desktop shortcuts to the apps and files you access
    most frequently. Shortcuts for apps can be created from options on the Menu, or
    from the Desktop context menu. Shortcuts for files can be created as links using
    the file browser:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_69_0.png)


    A shortcut or a link can be deleted in the same way as a file - select its icon
    then hit the Delete key. Alternatively, right-click on the icon then choose Delete
    or choose Move to Trash.


    - Right-click an app icon on the Menu, then click the Add to desktop option to
    place a shortcut on the Desktop


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_69_1.png)


    - Right-click anywhere on the Desktop, then Choose a new launcher here from the
    context menu – to open a "Launcher Properties" dialog box


    - Enter a shortcut Name, then click the Browse button to open a "Choose a command"
    dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_69_2.png)


    - Navigate to the /usr/bin directory and select the app for which you want to
    create a shortcut – to add its path in the Command field


    The /usr directory contains sub-directories storing programs that can be run by
    any user.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_69_3.png)


    - Click the icon button to open a "Choose an icon" dialog


    Next, navigate to the Linux Mint directory at /usr/share/icons/Mint-Y/apps/64
    and select an appropriate icon for the shortcut


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_70_0.png)


    The selected icon should now appear in the “Launcher Properties” dialog


    Click the OK button to place a shortcut on the Desktop


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_70_1.png)


    If a selected icon does not appear in the Launcher Properties dialog it will not
    appear on the shortcut – a default icon will appear.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_70_2.png)


    Open the file browser in your home Documents directory, right-click on a text
    file and choose the Edit, Make Link menu – a shortcut icon appears in that directory
    and has an arrow denoting it to be a link


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_70_3.png)


    Drag the link icon onto the Desktop to create a shortcut that can be clicked to
    launch a Text Editor displaying the target file


    Care must be taken to maintain links, as changes to the target file, such as renaming
    or moving it, will leave the links “orphaned” – no longer pointing correctly at
    the target file.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_70_4.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_70_5.png)


    ## Locating Files


    It is important to recognize that many directories in Linux contain sub-directories
    and hidden files containing configuration data. These are like the "System" files
    that are hidden by default in the Windows operating system. In Linux, the name
    of each hidden directory and file always begins with a dot.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_71_0.png)


    1. Open the file browser in your home directory

    2. Now, click View, Show Hidden Files to see all contents


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_71_1.png)


    3. Right-click on the file browser window then select Items to choose how you
    would like the contents arranged

    - Create New File

    - Create New Folder

    - Open in Terminal

    - Open as Root

    - Show Hidden Files

    - Properties


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_71_2.png)


    The easiest way to find a file on your system is with the “Search” box in the
    Nemo file browser. You can find all files of a particular file by entering a file
    extension into the Search box. For example, enter .txt to find all files with
    .txt extension.


    Conversely, you can find all files of a known name regardless of the file extension
    by entering a name into the Search box. The file browser begins searching as soon
    as you enter three characters into the Search box, so you don''t need to know
    the full name, just three consecutive letters within the name. The search is not
    case-sensitive, so results will include uppercase and lowercase matches to the
    name you enter:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_72_0.png)


    The Search results will not include hidden files.


    1. Open the file in your home directory

    2. Click the Search button on the toolbar

    3. Type three characters into the Search box to match a file name or sub-directory
    within your home directory


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_72_1.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_72_2.png)


    You can click the Favorites button to save searches, and right-click it to display
    saved favorites to quickly search again. Type three characters in the Search box
    to match any file whose extension ends with .txt


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_72_3.png)


    ## Understanding Permissions


    In Linux each file and directory has an “Owner” – generally, this is the user
    who created it. The Owner has full permission to read the file, write to the file,
    and to execute the file (if it''s executable).


    The Owner may also set permissions to specify if other users can read, write,
    and execute the file. The file''s accessibility can be restricted to the Owner,
    to a “Group” of which the owner is a member, or to any of the system (“Others”).


    Permission settings of a file can be found on the Permissions tab of its Properties
    dialog:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_73_0.png)


    When a user account is created, a **Group** of the same name is also created –
    of which that user is a member.


    1. Right-click on a file, then choose the **Properties** item from the context
    menu – to launch the “Properties” dialog


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_73_1.png)


    example.txt Properties


    | Permissions | Open With | Emblems |

    | :--- | :--- | :--- |

    | Type | Text (plain) | |

    | Size | 27 bytes | |

    | Location | Home/Mike/Documents | |

    | Volume | unknown | |

    | Accessed | Wed 01 Aug 2018 12:00:00 PM EEST | |

    | Modified | Wed 01 Aug 2018 12:00:00 PM EEST | |


    You can select the **Emblems** tab to add a symbol to the file icon – for example,
    denoting the file as important.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_73_2.png)


    2. Click on the **Permissions** tab to view the current settings


    Here, the **Owner** and **Group** have “Read and write” permission, but **Others**
    have “Read-only” permission.


    example.txt Properties


    | Basic | Open With | Emblems |

    | :--- | :--- | :--- |

    | Owner | Mike McGrath | |

    | Access | Read and write | |

    | Group | mike | |

    | Access | Read-only | |

    | Execute | Allow executing file as program | |

    | Last changed | Wed 01 Aug 2018 12:00:00 PM EEST | |


    Usually the Owner, Group and Others will have permission to at least read the
    file. If you are the owner of the file, the Owner will have permission to write
    – and to execute the file if it''s executable.


    As the owner of the file you can use the arrow buttons to change the access permissions
    of this file:


    - Click the arrow button in the “Others” field, then choose None from the drop-down
    menu to restrict access to the Owner and Group members


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_74_0.png)


    If you need to change permissions on files where you are not the owner, you need
    superuser status – see page 164 for details.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_74_1.png)


    Checking this option makes the file executable for those users who have permission
    to access it.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_74_2.png)


    - Click on the Open With tab if you would also like to change the default app
    that opens this file


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_74_3.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_74_4.png)


    Changing the default app is applied to all files of this type, whereas changing
    permissions is applied to this file only. Here, the change will make LibreOffice
    Writer the default app to open plain text files instead of the Text Editor app.

