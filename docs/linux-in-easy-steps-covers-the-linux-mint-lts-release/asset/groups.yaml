    # Meeting the Interface


    When you start up the Linux Mint operating system, the first thing you see will
    while the system begins loading is a black screen displaying the operating system
    name and version number:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_27_0.png)


    Unless you selected the option to “Log in automatically” during the installation
    process (see page 21), the next thing you see is the Log in screen shown below:


    +   - Computer Name Username Password Accessibility Keyboard Layout


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_27_1.png)


    The current time is also shown at the top right of the Log in screen. Hover your
    mouse cursor above the time to see the current date appear in a pop-up Tooltip
    box.


    You can now enter the password you chose, then click the arrow button that appears
    in the password box (or hit the Enter key) to log in to the Linux Mint operating
    system.'
