  mdcn: '


    ## 识别目录


    ## /bin

    包含 PC 启动时所需的小型可执行程序（二进制文件）以及执行基本命令的程序。此目录大致等同于 Windows 中的 `C:\Windows` 目录。


    ## /boot

    包含 PC 启动时所需的重要文件以及 Linux 内核本身——它是操作系统的核心。内核控制对计算机所支持的所有硬件设备的访问，并允许多个程序并发运行并共享这些硬件。


    ## /cdrom

    在历史上，这是一个用于挂载插入系统的 CD-ROM 的目录——现在的标准位置是 `/media`。


    ## /dev

    特殊文件系统条目，代表连接到系统的设备。这些条目允许程序访问驱动程序，驱动对于系统的正常运行至关重要，尽管实际的驱动文件存储在其他地方`/dev/sda`
    条目代表你 PC 上的第一个硬盘。


    ## /etc

    包含系统配置文件，存储了从用户密码、系统初始化到屏幕分辨率设置等所有信息。这些可以用文本编辑器查看的纯文本文件。此目录中的文件大致等同于 Windows 操作系统中的
    .ini 文件和注册表项的组合。


    ## /home

    包含每个用户账户的子目录，用于存储个人数据文件。如果存在名为 "mike" 的用户，则会有一个 `/home/mike` 目录，该用户可以在其中存储个人文件——其他用户无法保存文件。你存储所有工作文档、图像和媒体文件的地方就在这里。


    ## /lib

    包含 `/bin` 和 `/sbin` 目录中可执行程序使用的 32 位库文件。这些共享库对于启动系统和在根文件系统内执行命令尤为重要。它们大致等同于 Windows
    中的 .dll（动态链接库）。


    ## /lib64

    包含 `/bin` 和 `/sbin` 目录中可执行程序使用的 64 位库文件。


    ## /lost+found

    包含错错的文件，这些文件可能已损坏，但仍可以从中恢复数据。


    ## /media

    这是一个用于挂载插入系统的可移动介质的目录。当你将 USB 闪盘连接到 PC 时，会创建一个类似 `/media/flash-drive` 的子目录。


    ## /mnt

    这是一个系统管理员可以临时挂载额外文件系统的目录。


    ## /opt

    `/opt` 初始为空，但该目录提供了一个特殊区域，用于安装可选的附加软件包。如果 “example” 是 `/opt` 目录中某个软件包的名称，那么它的所有文件都可以放在
    `/opt/example` 目录的子目录下。


    ## /proc

    `/proc` 包含与内核之间传递信息的特殊文件。该目录内“虚拟”文件的层次结构代表了内核的当前状态。与二进制和文本文件不同，大多数虚拟文件的大小显示为零字节，并盖有当前日期和时间。这反映了它们不断更新的特性。


    ## /root

    `/root` 是 root 超级用户的家目录——出于安全考虑，普通用户无法访问此目录。


    ## /run

    `/run` 包含应用程序运行时所需的瞬态文件，用于提供进程 ID 等数据。


    ## /sbin

    `/sbin` 包含可执行系统程序（二进制文件），仅供 root 超级用户和 Linux 在系统启动或执行系统恢复操作时。例如，在 Linux 运行时维护系统时间的钟程序位于
    `/sbin` 目录。此目录大致等同于 Windows 中的 `C:\Windows\system` 目录。


    ## /srv

    包含为系统服务提供数据的文件。


    ## /sys

    这是一个虚拟文件系统，存储了内核对系统以及连接到系统的设备的视图。


    ## /timeshift

    包含由 Timeshift 应用按间隔拍摄的系统备份快照。


    ## /tmp

    包含运行程序创建的临时文件。大多数在程序关闭时会被删除，但有些会遗留——应该定期删除它们。此目录大致等同于 Windows 中的 `C:\Temp` 目录。


    ## /usr

    包含存储该系统任何用户都可以运行程序的子目录：例如游戏、文字处理器和媒体播放器。此目录大致等同于 Windows 中的 `C:\Program Files`
    目录。


    ## /var

    包含存储正在运行系统状态信息的变量数据文件，特别是系统活动日志。系统管理员（root 超级用户）可以输入 /var


    ## 使用 Nemo 导航

    可以通过图形界面查看标准目录。在 Linux Mint 中，可以通过点击桌面上的“文件”图标启动 Nemo。


    - 点击桌面上的“文件”图标

    - 点击侧边栏中的“主目录”导航到用户家目录

    - 点击 [] 按钮显示位置字段，输入用户家目录的地址（在此例中为 /home），然后按回车键

    - 输入用户家目录（在此例中为 /home/mike），然后按回车键进入家目录


    ## 处理文件

    你在 Linux 中创建的所有数据文件都应保存在你的家目录或子目录（“文件夹”）中。你可以随时使用 Nemo 文件浏览器重新访问这些文件，并轻松地复制、移动、重命名或删除它们：


    - 点击菜单、辅助程序、文本编辑器启动纯文本编辑器，然后输入一些文本并点击工具栏上的“保存”。

    - 在“另存为”对话框中，双击打开，然后为文本文档命名（例如 sample.txt）并点击“保存”按钮。

    - 启动 Nemo 文件浏览器，然后打开你家目录下的“文档”文件夹并找到保存的文本文件。

    - 右键点击文件图标，从右键菜单中选择“复制”——将文件复制到剪贴板。

    - 接下来，右键点击家目录下的“公共”文件夹，从右键菜单中选择“粘贴到文件夹”以存放该文件的副本。


    '
