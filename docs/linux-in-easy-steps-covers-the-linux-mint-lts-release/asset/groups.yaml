    File Edit View Search Terminal Help

    This is some simple text that is being written using

    The Vi text editor in a Linux shell.


    :w simple.txt

    ```


    You can launch vi and open a file for editing in one single action by typing "vi"
    at a prompt, followed by a space and the file name:


    At a shell prompt, enter the command vi simple.txt to re-open the text file in
    the vi editor


    ```

    mike@linux-pc: ~/Data

    File Edit View Search Terminal Help

    This is some simple text that is being written using

    The Vi text editor in a Linux shell.


    "simple.txt" 2 lines, 90 characters

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_158_1.png)


    To edit a file opened in vi you need to first hit the Insert key to enter insert
    mode.'
  - '[PAGE 159]


    # # Manipulating Text Content


    The shell cut and paste commands may not be what you expect. They work with text
    arranged in columns, delimited by an invisible tab character. Each column of text
    is known as a “field” and the cut command can specify which field to display –
    for instance, the option -f3 chooses the third column from the left. The paste
    command is the opposite of the cut command horizontally, combining columns multiple
    files for display horizontally:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_159_0.png)


    +   1 Use to create two text files "nums.txt" and "vegs.txt", each with two columns
    separated by tab characters


    +   2 Enter cat nums.txt vegs.txt to display the file contents vertically, one
    above the other


    +   3 Now, enter paste nums.txt vegs.txt to display the file contents horizontally,
    side-by-side


    +   4 Enter cut -f2 vegs.txt to display the contents from the second column of
    one file


    ```

    ```cat -f1 vegs.txt

    Tomato

    Cucumber

    Lettuce

    Cabbage


    ```

    ```


    A -T option with the cat command to display invisible tab characters as "^I" on
    output.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_159_1.png)


    Multiple fields can be specified as a comma-separated list, like -f1,3 or a range
    such as -f2.


    ```

    ```mike@linux-pc:~/data cat nums.txt vegs.txt

    One Four

    Two Five

    Three Six

    Tomato Cucumber

    Lettuce Onion

    Cabbage Cauliflower

    mike@linux-pc:~/data paste nums.txt vegs.txt

    Four Tomato Cucumber

    Five Lettuce Onion

    Six Cabbage Cauliflower

    mike@linux-pc:~/data cut -f2 vegs.txt

    Cucumber

    Onion

    Cauliflower

    mike@linux-pc:~/data$ \```

    ```


    Simple text transformations can easily be made by piping a text stream to the
    tr command. This requires two arguments to specify what to change, and how it
    should be changed. For instance, the command tr a "* changes all occurrences of
    the letter "a", replacing each one with an asterisk output.'
  - '[PAGE 160]


    # ...cont''d


    Typically, the tr command is used to transform capitalization on output. The sort
    command is often used at the end of a pipeline to display lines of text sorted
    alphabetically. It can also be used to order lines numerically if a -n option
    is used. The tee command is useful in a pipeline that has a sort instruction to
    write the text stream as a file before sorting. The file name is specified by
    the argument to the tee command and the file is created in the current directory:


    +   - Enter cat quote3.txt : \ cat quote3.txt | tr "a-z" "A-Z" to display the
    contents of a file named "quote1.txt" – both in its original format and after
    transformation


    +   - Enter cut -f2 vegas.txt | sort to display the contents of a second column,
    sorted alphabetically


    +   - Now, enter cut -f2 vegas.txt \| tee vegas-column2.txt | sort to save a second
    column as a text file before displaying it sorted alphabetically on standard output


    +   - Finally, enter cat vegas-column2.txt to display the file


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_160_0.png)


    ```

    mike@linux-pc:~//data cat quote3.txt :\

    cat quote3.txt | tr "a-z" "A-Z"

    can resist everything except temptation.

    I CAN resist EVERYTHING EXCEPT TEMPTATION.

    mike@linux-pc:~//data cut -f2 vegas.txt | sort

    Cauliflower Cucumber Onion

    mike@linux-pc:~//data cut -f2 vegas-column2.txt \\

    | tee vegas-column2.txt | sort

    Cauliflower Cucumber Onion

    mike@linux-pc:~//data cat vegas-column2.txt

    Cucumber Cauliflower Onion

    mike@linux-pc:~//data

    ```


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_160_1.png)


    Remember that the sequence of characters specified to the tr command must be enclosed
    in quotes.


    Use a -a option with the tee command to append text to a file, rather than overwriting
    previous text.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_160_2.png)'
  - '[PAGE 161]


    # # Matching Text Patterns


    The **grep** command is one of the most useful of all commands. It has many possible
    options, but its purpose is simply to display all lines from a text file that
    contain a specified string or pattern. A grep command can specify a string to
    seek as its first argument, and a file name in to search as its second argument:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_161_0.png)


    The **grep** command can also match regular expressions. For instance, **grep
    [Y] ballad.txt** would output all lines that have an uppercase Y. See the **grep**
    man page for more regular expressions.


    +   1. At a shell prompt, `grep sword ballad.txt` to display all lines in this
    text file that contain the word "sword"


    ```

    mike@linux-pc:~$ grep sword ballad.txt

    the brave man with a sword

    For, right within, the sword of Sin

    the brave man with a sword!

    mike@linux-pc:~$

    ```


    Notice that the output has two duplicate lines. The **sort** command can be used
    to re-order lines, to make duplicate lines appear successive, and duplicated successive
    lines can be removed with the **uniq** command. Output from the **grep** command
    can be piped to a **sort** command to make the duplicate lines successive, then
    piped to **uniq** so only unique lines remain:


    +   2. Enter `grep sword ballad.txt | sort | uniq` to display all unique lines
    in this text file that contain the word "sword"


    ```

    mike@linux-pc:~$ grep sword ballad.txt | \

    sort | uniq

    For, right within, the sword of Sin

    the brave man with a sword!

    mike@linux-pc:~$

    ```


    The **look** command is useful to quickly output all lines of text from a file
    that begin with a specified prefix. It can accept a **-d** option to only seek
    to match alphanumeric characters.'
  - '[PAGE 162]


    # ...cont''d


    Enter look -d Y ballad.txt to see a list of lines beginning with the letter "Y"
    from this file, ignoring spaces and tabs


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_162_0.png)


    ```

    mike@linux-pc:~/Data

    File View Search Terminal Help

    mike@linux-pc:~/Data look -d Y ballad.txt\Yet each man kills the thing he loves

    Yet each man does not die.

    Yet each lives hideous prison-wall

    Yet all is well; he has but passed

    mike@linux-pc:~$

    ```


    You can also use the look command with a string argument to see a list of words
    starting with that string taken from an editable dictionary file that is normally
    located at /usr/share/dict/words


    The aspell is a powerful spellchecker that has a -c option that lets you interactively
    check a file for spelling errors. This highlights errors and suggests alternatives
    that you can choose to replace or ignore each highlighted word in turn:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_162_1.png)


    Enter aspell -c ballad.txt to begin the spellchecker for this


    Type the number against a suggested replacement to immediately replace the highlighted
    word with it


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_162_2.png)


    ```

    mike@linux-pc:~/Data

    File Edit View Search Terminal Help

    The sky above my head became

    Like a casque of scorching steel;

    And, though I was a soul in pain,

    My pain I could not feel.

    ```


    +   1) Basque

    2) basque

    3) masque

    4) Claque

    5) Coque

    i) Ignore

    r) Replace

    na) Add

    b) Abort

    6) case

    7) Cassie

    8) ask

    9) cost

    0) Cirque

    I Ignore all

    R) Replace all

    L) Add Lower

    x) Exit


    Press the I key to ignore a word, the R key to type your own replacement, or the
    X key to exit the aspell spellchecker.'
- md: "\n# Summary\n\n- The whoami command reveals the user name, hostname, reveals\
    \ the domain name, clear empties the shell window, and exit terminates the shell\
    \ session.\n- The pwd command reveals the current working directory and the directory\
    \ location can be changed with the cd command.\n- The ~ tilde character is an\
    \ alias for the home directory and any directory's content can be revealed by\
    \ the ls command.\n- The basename command returns the last part of an address,\
    \ whereas the dirname command returns just the first part.\n- New directories\
    \ are created with the mkdir command and empty directories can be removed by the\
    \ rmdir command.\n- Files are moved or renamed with the mv command, copied with\
    \ the cp command, and removed with the rm command.\n- The ln command is used to\
    \ create hard links and soft links, but the readlink command can only be used\
    \ with soft links.\n- The stat command lists all file properties, du reports the\
    \ size, and the file command reports the file type.\n- Timestamps of a file can\
    \ be modified by the touch command, and the wc command can be used to report the\
    \ word count.\n- Files can be compared with cmp, comm, and diff commands, and\
    \ checksums generated by the cksum and md5 commands.\n- The find command locates\
    \ a file, grep locates a string within file, and look locates lines beginning\
    \ with a given letter.\n- Files can be viewed using the cat command, lines numbered\
    \ with ni, and spelling checked by the aspell command.\n- The head command displays\
    \ the first 10 lines of a file, whereas the tail command displays its final 10\
    \ lines.\n- The vi editor can be used to create files and individual text columns\
    \ manipulated by the cut and paste commands.\n- A shell pipeline directs output\
    \ to be used as input for another command and can include tee to write a file,\
    \ tr to transform the output, and sort to order the output alphanumerically.\n\
    \n# 10 Performing Operations\n\nThis chapter demonstrates how to perform useful\
    \ operations with the Linux command-line shell app.\n\n- Becoming the Superuser\
    \ 164\n- Installing Packages 166\n- Handling Archives 168\n- Examining File Systems\
    \ 170\n- Working with Accounts 174\n- Setting Access Permissions 176\n- Controlling\
    \ Processes 178\n- Exploring the Network 180\n- Printing from the Shell 182\n\
    - Evaluating Expressions 184\n- Scripting the Shell 186\n- Summary\n\n# Becoming\
    \ the Superuser\n\nA regular user can call upon many shell commands, but some\
    \ are only available to a privileged 'superuser'. These restricted commands typically\
    \ perform system administration functions to which regular users should not be\
    \ allowed instant access.\n\nOn a typical home Linux system the default user created\
    \ during installation is given access to the sudo command, which allows commands\
    \ to be executed as if the regular user is the superuser.\n\nThe sudo command\
    \ is most-most often needed where you receive a 'Permission denied' message when\
    \ attempting to perform an operation. Prefixing the previous command effectively\
    \ grants the required permission. If the previous command was lengthy, you can\
    \ simply issue a sudo !! to run it again with the required sudo prefix:\n\n- At\
    \ a shell prompt, enter parted /dev/sda to attempt to launch the partition editor\
    \ for the hard-drive device.\n- As the shell informs you you are not the superuser,\
    \ type c then hit Return to cancel the attempt.\n\n```\nmike@linux-pc:~\\$ \n\
    File Edit View Search Terminal Help\nmike@linux-pc:~\\$ parted /dev/sda\nWARNING:\
    \ You are not the superuser. Watch out for permissions.\nError: Error opening\
    \ /dev/sda: Permission denied\nRetry/Cancel? c~\nmike@linux-pc:~\\$\n```\n\nThe\
    \ hard drive is a Small Computer System Interface (SCSI) – pronounced “scuzzy”\
    \ device. These are labeled alphabetically so the first device on your system\
    \ is scsi device \"a\" (sda).\n\n- Now, enter sudo parted /dev/sda (or just enter\
    \ sudo !) to launch the partition editor successfully.\n- At the (parted) prompt,\
    \ enter a print command to list the partition information for the hard drive.\n\
    - Now, enter a help command to see the available operations that may be performed,\
    \ or enter a quit command to exit the partition editor.\n\n```\nmike@linux-pc:-$\
    \ sudo parted /dev/sda\n[sudo] password for mike:\nGNU Parted 3.2\nUsing /dev/sda\n\
    Welcome to GNU Parted! Type 'help' to view a list of commands\n(parted) print\n\
    Model: ATA 570TL12-DG1 (scsi)\nDisk /dev/sda: 50GB\nSector size (logical/physical):\
    \ 512/40968\nPartition Table: gpt\nDisk Flags:\nNumber Start End Size File system\
    \ Name Flags\n1 104918 538M 517M fat32 EFI System Partition boot\n2 538M 506GB\
    \ 506GB ext4\n(parted) quit\nmike@linux-pc:-$ \n```\n\nIn order to perform system\
    \ administration, the sudo command can be used together with the su (switch) command.\
    \ This makes the \"root\" user, with system-wide access, the user whose home directory\
    \ is the /root directory:\n\nThe root superuser can access any file or program\
    \ on the system with the potential to wreak havoc! Only log in as the root superuser\
    \ if it's absolutely essential.\n\n- Issue the sudo command, then enter your regular\
    \ user password to assume superuser status.\n- Enter cd ~ pwd to navigate to the\
    \ root superuser's home directory and display its location.\n- Log out from the\
    \ root superuser account by entering the exit command to resume regular user status\
    \ back in the user's home directory.\n\n```\nmike@linux-pc:-$ sudo su\n[sudo]\
    \ password for mike:\nroot@linux-pc:/home/mike# cd ~\nroot@linux-pc:~# exit\n\
    mike@linux-pc:/home/mike\nmike@linux-pc:-$ pwd\n/home/mike\nmike@linux-pc:-$ \n\
    ```\n\n# Installing Packages\n\nThe Advanced Packaging Tool (APT) is a command-line\
    \ tool that automates the process of retrieving, configuring, and installing packages.\
    \ It relies upon online repositories to locate software and resolve dependencies.\n\
    \nSurprisingly, as package installation modifies your system, all APT commands\
    \ must be run with sudo for superuser privileges.\n\nThe APT apt-get command has\
    \ several options with which to manage packages. It's useful to first execute\
    \ an apt-get update to update the list of available packages, before issuing an\
    \ apt-get install package-name command.\n\nOnce installed, a package can be upgraded\
    \ to the latest version with an apt-upgrade package-name command.\n\nAfter a package\
    \ has been installed it can be removed later using an apt-get remove package-name\
    \ – but this retains the configuration files for that package. For complete removal\
    \ of a package and its configuration files you can instead use the command apt-get\
    \ --purge remove package-name.\n\n- Enter the sudo apt-get update to ensure the\
    \ package list is up-to-date\n- Now, issue a command to install a package – for\
    \ example, enter sudo apt-get install corebird to install the “Corebird” Twitter\
    \ client package\n- Some packages request confirmation before installation that\
    \ requires you to type Y and hit Return if you are happy to proceed, or enter\
    \ N to cancel the installation.\n\n```\nmike@linux-pc:~$ sudo apt-get install\
    \ corebird\nReading package lists... Done\nBuilding dependency tree\nReading state\
    \ information... Done\nThe following NEW packages will be installed:\ncorebird\n\
    ```\n\nThe packages are retrieved, unpacked, and set up, the installation is complete\
    \ and the application is ready to run:\n\n- Check the Menu to see that a launch\
    \ icon has been added for the newly-installed package – in this case, click Menu,\
    \ Internet to see a Twitter client app launcher.\n"
  mdcn: "\n\n# 摘要\n\n- `whoami` 命令显示用户名、主机名和域名，`clear` 清空 shell 窗口，而 `exit` 终止 shell\
    \ 会话。\n- `pwd` 命令显示当前工作目录，可以通过 `cd` 命令更改目录位置。\n- 波浪线字符 `~` 是主目录的别名，可以使用 `ls` 命令显示任何目录的内容。\n\
    - `basename` 命令返回路径的最后部分，而 `dirname` 命令则仅返回第一部分。\n- 使用 `mkdir` 命令创建新目录，并可以使用 `rmdir`\
    \ 命令删除空目录。\n- 使用 `mv` 命令移动或重命名文件，使用 `cp` 命令复制文件，使用 `rm` 命令删除文件。\n- `ln` 命令用于创建硬链接和软链接，但\
    \ `readlink` 命令只能用于软链接。\n- `stat` 命令列出所有文件属性，`du` 报告大小，`file` 命令报告文件类型。\n- 可以\
    \ `touch` 命令修改文件时间戳，`wc` 命令可报告字数。\n- 可以 `cmp`、`comm` 和 `diff` 命令比较文件，并使用 `cksum`\
    \ 和 `md5` 命令生成校验和。\n- `find` 命令定位文件，`grep` 在文件中定位字符串，`look` 定位以给定字母开头的行。\n- 使用\
    \ `cat` 命令查看文件，使用 `ni` 进行行号显示，并使用 `aspell` 命令进行拼写检查。\n- `head` 命令显示文件的前 10 行，而\
    \ `tail` 命令显示其最后 10 行。\n- 可以使用 `vi` 编辑器创建文件，并使用 `cut` 和 `paste` 命令操作单个文本列。\n-\
    \ shell 管道（pipeline）将输出重定向作为另一个命令的输入，并可以包含写入文件的 `tee`、转换输出的 `tr` 以及按字母顺序排序输出的\
    \ `sort`。\n\n# 10 执行操作\n\n本章演示了如何使用 Linux 命令行 shell 应用执行有用操作。\n\n- 成为超级用户 164\n\
    - 安装软件包 166\n- 处理存档 168\n- 检查文件系统 170\n- 账户操作 174\n- 设置访问权限 176\n- 控制进程 178\n\
    - 探索网络 180\n- 从 shell 打印 182\n- 评估表达式 184\n- shell 脚本 186\n- 摘要\n\n# 成为超级用户\n\n\
    普通用户可以调用许多 shell 命令，但某些命令仅对特权“超级用户”（superuser）可用。这些受限命令通常执行系统管理功能，普通用户不应被即时访问这些功能。\n\
    \n在典型的家用 Linux 系统上，安装期间创建的默认用户拥有 `sudo` 命令的权限，这允许以类似于普通用户是超级用户的身份执行命令。\n\n当你尝试执行某项操作并收到“Permission\
    \ denied”（拒绝访问）消息时，通常最需要 `sudo` 命令。在之前的命令前加上该前缀可以有效授予所需的权限。如果之前的命令很长，你只需输入 `sudo\
    \ !!` 即可带有所需的 `sudo` 前缀重新运行它：\n\n- 在 shell 提示符处，输入 `parted /dev/sda` 尝试启动硬盘设备的分区编辑器。\n\
    - 当 shell 提示你不是超级用户时，输入 `c` 然后按回车键取消尝试。\n\n```\nmike@linux-pc:~\\$ \nFile Edit\
    \ View Search Terminal Help\nmike@linux-pc:~\\$ parted /dev/sda\nWARNING: You\
    \ are not the superuser. Watch out for permissions.\nError: Error opening /dev/sda:\
    \ Permission denied\nRetry/Cancel? c~\nmike@linux-pc:~\\$\n```\n\n硬盘是小型计算机系统接口（SCSI）——读音为“scuzzy”。这些设备按字母顺序标记，因此你系统上的第一个设备是\
    \ scsi 设备 \"a\" (sda)。\n\n- 现在，输入 `sudo parted /dev/sda`（或直接输入 `sudo !`）成功启动分区编辑器。\n\
    - 在 (parted) 提示符处，输入打印命令列出硬盘的分区信息。\n- 现在，输入帮助命令查看可以执行的操作列表，或输入退出命令退出分区编辑器。\n\n\
    ```\nmike@linux-pc:-$ sudo parted /dev/sda\n[sudo] password for mike:\nGNU Parted\
    \ 3.2\nUsing /dev/sda\nWelcome to GNU Parted! Type 'help' to view a list of commands\n\
    (parted) print\nModel: ATA 570TL12-DG1 (scsi)\nDisk /dev/sda: 50GB\nSector size\
    \ (logical/physical): 512/40968\nPartition Table: gpt\nDisk Flags:\nNumber Start\
    \ End Size File system Name Flags\n1 104918 538M 517M fat32 EFI System Partition\
    \ boot\n2 538M 506GB 506GB ext4\n(parted) quit\nmike@linux-pc:-$ \n```\n\n为了执行系统管理，可以将\
    \ `sudo` 命令与 `su`（切换）命令结合使用。这使得具有系统级访问权限的“root”用户成为其主目录为 `/root` 目录的用户：\n\nroot\
    \ 超级用户可以访问系统上的任何文件或程序，并可能造成破坏性！只有在绝对必要时才以 root 超级用户登录。\n\n- 执行 `sudo` 命令，然后输入你的普通用户密码以获取超级用户状态。\n\
    - 输入 `cd ~ pwd` 导航到超级用户的主目录并显示其位置。\n- 输入 `exit` 命令退出 root 超级用户账户，恢复普通用户状态。\n\n\
    ```\nmike@linux-pc:-$ sudo su\n[sudo] password for mike:\nroot@linux-pc:/home/mike#\
    \ cd ~\nroot@linux-pc:~# exit\nmike@linux-pc:/home/mike\nmike@linux-pc:-$ \n```\n\
    \n# 安装软件包\n\n软件包工具（APT）是一个命令行工具，可自动化检索、配置和安装软件包的过程。它依赖在线仓库来查找软件并解决依赖关系。\n\n事实上，由于软件包安装会修改系统，所有\
    \ APT 命令都必须以 `sudo` 权限运行。\n\nAPT `apt-get` 命令有多种选项可以管理软件包。在执行 `apt-get install\
    \ 软件包` 命令之前，先执行 `apt-get update` 来更新软件包列表是有用的。\n\n一旦安装，可以使用 `apt-upgrade` 命令将软件包升级到最新版本。\n\
    \n安装后，可以使用 `apt-get remove 软件包` 进行删除——但这会保留软件包的配置文件。如果想彻底删除软件包及其配置文件，可以使用命令 `apt-get\
    \ --purge remove 软件包`。\n\n- 输入 `sudo apt-get update` 确保软件包列表是最新的。\n- 现在，发布命令安装软件包——例如，输入\
    \ `sudo apt-get install corebird` 安装“Corebird”Twitter 客户端包。\n- 部分软件包在安装前会请求确认，要求你输入\
    \ `Y` 并按回车以继续，或输入 `N` 取消安装。\n\n```\nmike@linux-pc:~$ sudo apt-get install corebird\n\
    Reading package lists... Done\nBuilding dependency tree\nReading state information...\
    \ Done\nThe following NEW packages will be installed:\ncorebird\n```\n\n软件包已检索、解压并设置，安装完成，应用程序已就绪：\n\
    \n- 检查菜单查看是否为新安装的软件包添加了启动图标——在这种情况下，点击菜单、Internet 看到一个 Twitter 客户端启动器。\n\n"
