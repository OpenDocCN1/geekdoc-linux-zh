- md: '

    ## Completing Installation


    6 On the “Installation type” screen...


    If you want this to be the only operating system on your PC, select Erase disk
    and install Linux Mint.


    New users should avoid choosing the Encrypt and LVM options here as they can cause
    problems.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_21_0.png)


    OR


    If Windows is installed and you also want to keep that on your PC, select the
    option to Install Linux Mint alongside Windows Boot Manager


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_21_1.png)


    Advanced users can choose to manage disk partitions by choosing the Something
    else here. Linux Mint requires one partition to be mounted on the root/directory.
    The operating system occupies around 15GB so this partition should ideally be
    100GB+. The ext4 filesystem is recommended. A swap partition is also required
    as a memory buffer, and this should be of equal size to the amount of RAM in your
    PC.


    If you choose to retain Windows alongside Linux Mint, the installer will automatically
    resize the operating system and then install Linux Mint in the free space created.
    A boot menu will appear so you can choose between operating systems whenever you
    start your PC – a “dual-boot” setup.


    7 After choosing the installation type in either case, click the Install Now button
    to proceed...


    ## On the “Where are you?” screen, select your timezone then click the Continue
    button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_22_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_22_1.png)


    Simply click your approximate location on the global map to select your timezone.


    ## On the “Who are you?” screen, enter your details then click the Continue button
    to install system files


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_22_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_22_3.png)


    If you are the only user of the PC you can select the option to Log in automatically
    so you will not be asked for your password whenever you start Linux Mint. You
    may also select the Encrypt my home folder option if you are concerned about security.


    ## Enjoy the slideshow while Linux Mint gets installed, then upon completion click
    the Restart Now button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_22_4.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_22_5.png)


    ## Enabling Backups


    Having completed the installation process, by following the steps on the previous
    pages, Linux Mint will launch to your Desktop. Before you start using the operating
    system it is recommended you enable the “Timeshift” backup utility. This is like
    “System Restore” on Windows and will allow you to restore the operating system
    to an earlier backup should any problems arise:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_23_0.png)


    Timeshift Utility


    - Click on Menu (“Start” button), Administration, Timeshift

    - Next, enter the password you chose in the “Who are you?” dialog during the installation
    process, then click the Authenticate button


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_23_1.png)


    The “Timeshift” utility is a new feature that was introduced in Linux Mint version
    19 (Tara).


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_23_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_23_3.png)


    - Now, select the “RSYNC” option, then click the Next button. “RSYNC” is a disk-based
    backup system that only backs up what has changed since the previous backup.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_23_4.png)


    | RSYNC | BTRFS |

    | :--- | :--- |

    | Snapshots are created by creating copies of file systems using rsync, and hard-linked
    unchanged files from previous snapshots. | All files are copied when snapshot
    is created. Subsequent snapshots are incremental; unchanged files will be hard-linked
    from the previous snapshot if available. |

    | Snapshots can be saved to any disk formatted with a Linux system. | Saving snapshots
    takes time but allows the system to be restored even if system is damaged or reformatted.
    |

    | Files and directories can be excluded to save disk space |


    Select the device on which you want the system backup to be saved, then click
    the Next button. (Here, the chosen device is an external hard drive that is connected,
    but you could alternatively connect a USB drive and choose that device)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_24_0.png)


    Do not choose your main hard drive as the location to save snapshots – this would
    not help you if your hard drive fails. Select the frequency for when you would
    like system snapshots to be saved on your chosen device, then click the Finish
    button


    ![](img/76ecabd34062cd153290258f3b9cd5b_24_1.png)


    Boot snapshots are saved in a newly-created timeshift directory at the root level
    of the chosen device. Boot snapshots are performed in the background so do not
    affect the speed when the system boots. Re-open Timeshift in the future and select
    a saved backup, then click the Restore to restore your Linux Mint system


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_24_2.png)


    ## Summary


    - **Linux** is a free, stable multi-user operating system that is derived from
    the powerful Unix system.

    - The name “Linux” combines letters from the first name of its originator, Linus
    Torvalds, with the final letter of Unix.

    - Both **KDE** and **Gnome** desktop are user-friendly graphical user interfaces,
    providing the same point-and-click convenience of the Windows desktop.

    - The **kernel** provides the core functionality of Linux.

    - Linux **distros** bundle the kernel, system-level programs, and free user-level
    programs in a variety of combinations.

    - The most popular Linux Mint distro employs the *Cinnamon* desktop manager, and
    is the best distro for beginners.

    - Minimum hardware **requirements** to run Linux Mint: 1GB of RAM, 15GB of disk
    space, and a screen resolution of 1024 x 768 – higher specifications will perform
    better.

    - A second **hard drive** can easily be added to a PC so it can dual-boot to Linux
    or Windows.

    - A Linux distro can be downloaded and burned as a filesystem image onto a USB
    drive to create **boot media**.

    - In order to boot from a USB flash drive it may be necessary to change the boot
    device order using the **Setup Utility**.

    - The Linux Mint **installer** allows you to install Linux as the sole operating
    system, or install it alongside Windows.

    - Before you start using the Linux Mint operating system it is recommended to
    enable the **Timeshift** backup utility so you can restore your system should
    problems arise.


    ## 2 Exploring the Desktop


    This chapter describes the Linux Mint interface, explains how to use it, and demonstrates
    how to customize it.


    - 26 Meeting the Interface

    - 28 Configuring the Desktop

    - 30 Adding Desklets

    - 32 Adjusting the Taskbar

    - 34 Launching Apps

    - 36 Editing the Menu

    - 38 Installing Updates

    - 42 Summary


    ## Meeting the Interface


    When you start up the Linux Mint operating system, the first thing you will see
    while the system begins loading is a black screen displaying the operating system
    name and version number:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_27_0.png)


    Unless you selected the option to “Log in automatically” during the installation
    process (see page 21), the next thing you see is the Log in screen shown below:


    - Computer Name, Username, Password, Accessibility, Keyboard Layout


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_27_1.png)


    The current time is also shown at the top right of the Log in screen. Hover your
    mouse cursor above the time to see the current date appear in a pop-up Tooltip
    box.


    You can now enter the password you chose, then click the arrow button that appears
    in the password box (or hit the Enter key) to log in to the Linux Mint operating
    system.


    After you log in to Linux Mint, whether via the Log in or by choosing the automatic
    option, the GUI (Graphical Interface) Desktop and Taskbar will appear, as shown
    below:


    ## Desktop Shortcuts


    ## Desktop Wallpaper


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_28_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_28_1.png)


    The Welcome dialog provides helpful information for new users. Uncheck if you
    don''t want to see this dialog again. Click the X button in the top right of any
    window to close that window.


    - Menu Desktop

    - App Launchers

    - Taskbar

    - System Tray


    If you have experience of the Windows operating system, the Linux Mint Desktop
    will seem familiar – as is the intention.


    ## System Tray


    The System Tray contains, by default, five icons that provide access to useful
    features when you click on the icon:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_28_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_28_3.png)


    Hover your mouse cursor above any System Tray icon to see information appear in
    a pop-up Tooltip box.


    - User Info

    - Network Status

    - Battery Status

    - Time & Date

