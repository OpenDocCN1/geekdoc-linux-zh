    ## Choosing a Distro


    At the very heart of Linux is a bunch of tried-and-tested code called the "kernel".
    The kernel provides the operating system with its core functionality, like the
    engine in a car. It takes care of the basics, such as helping other programs access
    hardware and sharing your computer''s processor among various programs.


    In addition to the kernel, Linux contains a number of system-level programs, such
    as the services to handle your email, web connection and bootloader. Consider
    these as the car''s transmission, gears, and chassis – without them, the engine
    is not much use.


    Linux distributions generally also include a large number of user-level programs
    – the applications for daily use: for instance, browsers, word processors, text
    editors, graphics editors, media players, and so on. These are the finishing touches
    to the car that ensure a great ride – whitewall tires and soft leather upholstery.


    All of these components are bundled together in a variety of Linux distribution
    packages, commonly referred to as "distros" – just as all the components of a
    car are bundled together to make a complete car.


    In the same way that there are many makes and models of cars, there are many Linux
    distros to choose from. Some of the best known distros are RedHat Fedora, SUSE,
    Ubuntu, and Mint. Each distro has its own installer and unique default configuration
    according to what the distributor considers to be the best arrangement. The ideal
    one for you will depend on your own preferences and how you want to use Linux.
    The most popular distros are described below to help you choose:


    ## RedHat Fedora


    One of the most publicized Linux distros, comprising the commercial RedHat Enterprise
    Linux product line and the Fedora distro that is developed by the Fedora Project
    community. There are several editions of the Fedora distro – “Workstation” for
    PCs, “Server” for servers, and “Atomic” for cloud computing.


    - **Pros:** Widely used, excellent community support, innovative.

    - **Cons:** Limited product life-span of Fedora editions, poor multimedia support.


    Free download from getfedora.org


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_11_0.png)


    Most Linux distros are available as a “live” version that lets you run Linux from
    a disk – so you can try it without installing Linux onto your hard drive.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_11_1.png)


    > Choose Freedom. Choose Fedora.


    ## SUSE


    The community-based "openSUSE" distro, sponsored by Novell, is another distro
    with desktop focus that has received positive reviews for its installer and YaST
    configuration tools. The documentation, which comes with the boxed product, has
    been labeled as the most complete, thorough and usable by far. This distro provides
    the base for Novell''s award-winning SUSE Linux Enterprise products.


    - **Pros:** Attention to detail, easy-to-use YaST configuration tools.

    - **Cons:** Huge distro – including over 1,500 bundled packages. Free download
    from opensusese.org


    ## Ubuntu


    This sophisticated community distro typically employs the popular Gnome desktop
    manager. It has the advantage of a fixed six-month release cycle, and every two
    years there is an LTS (Long Term Support) release that is supported for five years.
    There are several editions of the Ubuntu distro – “Desktop” for PCs, “Server”
    for servers, and “Core” for IoT (Internet of Things) devices. The default interface
    of the Ubuntu Desktop edition is quite different from that of the Windows desktop.


    - **Pros:** Great community, and fixed release cycle.

    - **Cons:** The interface will seem unfamiliar to Windows users. Free download
    from ubuntu.com


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_12_0.png)


    A modern, elegant operating system that is easy to use. It is based on the Ubuntu
    operating system and works out of the box, with full multimedia support. All Linux
    Mint distros are releases that appear shortly after each Ubuntu release, and are
    supported for five years. Users are encouraged to send feedback so their ideas
    can be used to improve Linux Mint. This operating system typically employs the
    Cinnamon GUI desktop manager, which will feel familiar to moving from the Windows
    operating system. For reason, Mint is used throughout this book to demonstrate
    the features of a Linux operating system.


    - **Pros:** Great community, and the interface will seem familiar to Windows users
    – the best distro for beginners.

    - **Cons:** Ubuntu has a larger community of users. Free download from linuxmint.com


    ## Linux Mint


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_12_1.png)

    ![](img/7b6ecabd34062cd153290258f3b9cd5b_12_2.png)


    > “The makers’ choice for sysadmins, developers and desktop users.”


    > “Fast, secure and simple, Ubuntu powers millions of PCs worldwide.”


    > “Linux Mint. From freedom came elegance.”


    ## Providing Disk Space


    An operating system is installed on an area of the hard drive called "partition".
    When Windows is the only installed operating system its partition will normally
    occupy the entire hard drive. To install Linux in this situation there are three
    possible options:


    A Hard Disk Drive (HDD) or simply "hard drive" can be partitioned into one or
    more regions so that the operating system can manage each region separately.


    - **Delete the Windows partition** – replacing it with Linux partitions that occupy
    the entire drive. *This option will delete all Windows data.*

    - **Reduce the Windows partition** – making up space for Linux. *This option will
    not delete Windows data.*

    - **Add a second hard drive** – adding a new drive for Linux. *This option will
    not affect existing Windows data.*


    Resizing partitions is a scary process where data loss can occur, even in expert
    hands. All contents of the partition must be backed up before attempting this.


    The option to install an additional hard drive is a popular choice for many as
    they often upgraded their drive. It has several benefits:


    - The free space on Windows is not reduced.

    - It removes the risk of data loss.

    - The Windows operating system is retained.

    - It distinctly separates the two operating systems.

    - Drive failure would only disrupt one system.


    ## Adding a Second Hard Drive


    Most modern PCs can accommodate up to four EIDE (Enhanced Device Electronics)
    devices, such as hard drives and optical drives, but typically ship with just
    two – one hard drive and one optical drive. This means that more drives can be
    added by plugging them into the existing system.


    The first hard drive in a system is known as the “Master” drive and a second hard
    drive is called the “Slave” drive.


    A “jumper” connects two tiny pins to determine if the drive should be regarded
    as a MASTER (MA) or Slave (SL) drive. The top of each hard drive usually has a
    diagram depicting which pins need to be connected in each case.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_0.png)


    If you are not comfortable working inside your PC case, a computer store should
    be pleased to undertake the fitting of a drive for a modest fee.


    - Ensure that the jumper on the original drive is set to Master, then set the
    jumper on the second drive to Slave.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_1.png)


    - Connect the wide SATA data cable to the Master drive, by the plug at the end
    of the cable – not the plug part way along the cable.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_14_3.png)


    - Now, connect the SATA data cable to the Slave drive, by the plug part way along
    the cable.


    SATA (Serial Advanced Technology Attachment) is the standard for connecting devices
    such as hard drives and optical drives to the PC’s motherboard.


    - Connect the power cables to both drives, then close the PC case.


    - Start up the PC and check that both drives are now detected by the system –
    if the second drive is not detected, you may need to change the boot settings
    to “auto-seek” it up

