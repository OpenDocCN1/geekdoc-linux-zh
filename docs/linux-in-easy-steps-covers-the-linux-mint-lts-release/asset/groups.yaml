    ## 编写文本


    Linux Mint 中的纯文本编辑器 (xed) 相当于 Windows 中的记事本应用 (Notepad) —— 但编辑器具有更多功能。它可以对行进行编号，按字母顺序对行进行排序，并为一系列脚本、编程和标记语言提供语法高亮。


    然而，你必须意识到，Linux 处理行结束符的方式与 Windows 不同。Linux 添加一个不可打印的换行符 `\n` (''\newline'')`，而
    Windows 则添加不可打印的回车符和换行符 `\r\n`。这意味着在 Linux 中创建的文本文件在 Windows 系统上查看时无法正确保持其行结束符。编辑器在保存文本文件时提供了一个选项，让你选择喜好的行结束符类型：


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_127_0.png)


