  - '[PAGE 15]


    # Creating Boot Media


    The Linux Mint distro is available in three editions, with desktop environments
    called "Cinnamon","MATE", and "Xfce respectively. The most popular version is
    the Cinnamon edition that will be used throughout this book. It can be downloaded
    onto a USB flash drive to create "boot media". This lets you try out Linux without
    making changes to your system, and lets you install Linux onto your system if
    desired. First you you will need to ensure your system meets these minimum requirements:


    USB Flash Drive – also variously known as Thumb Drive, Pen Drive, Disk Key, Gig
    Stick, or Memory Stick.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_15_0.png)


    +   - 1GB of RAM (2GB preferred)


    +   - 15GB of disk space (20GB preferred)


    +   - 1024 x 768 screen resolution


    Like other Linux distros, the Linux Mint distro is an ISO image file whose content
    must be "burnt" onto the USB flash drive (not merely copied onto) to create the
    boot media:


    +   1. Launch a web browser, navigate to the download page linuxmint.com/download.php


    +   2. Next, click on the Cinnamon 64-bit link


    | Cinnamon | 32-bit | 64-bit | An edition featuring the Cinnamon desktop |

    |---|---|---||

    | MATE | 32-bit | 64-bit | An edition featuring the MATE desktop |

    | Xfce | 32-bit | 64-bit | An edition featuring the Xfce desktop |


    > The 32-bit versions are only provided for compatibility with older computers
    – those manufactured before 2008. You should generally download the 64-bit version.
    If your computer is not compatible you will see an error message – no harm will
    be done.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_15_1.png)


    +   3. Now, click a Download mirror link in your country from the list that appears


    +   4. Choose to save the ISO image file in a preferred location on your system
    to begin the download


    +   5. When the ISO download has completed, you now need an app to burn the image
    onto the USB flash drive. Linux Mint recommends the Etcher app. Navigate your
    web browser to etcher.io and download the installer for your system. For example,
    "Download for Windows x64"'
  - '[PAGE 16]


    ...cont''d


    When the installer download has completed, run its **Setup** wizard to install
    Etcher on your system


    Next, connect a USB flash drive to your computer


    Now, start the Etcher app and click the **Select image** button, then select the
    ISO image file you downloaded


    > Hot tip\If you wish to verify the ISO image file (recommended) you can find
    instructions on how to do so on linuxmint-installation-guide. readthedocs.io/en/latest/verify.html


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_16_0.png)


    Click the **Select drive** button, then select the USB flash drive you connected
    to your computer


    Click the **Flash!** button to burn the contents of the ISO onto the USB flash
    drive – creating the Linux boot media


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_16_1.png)'
  - '[PAGE 17]


    # # Starting a Live Session


    Having created the boot media, by following the steps on pages 14-15, you now
    have the ability to run Linux Mint in a “Live Session”. This means you can safely
    explore the Linux operating system on a PC where Windows is already installed
    on the hard drive as its operating system.


    In order to begin a Live Session your PC must be able to boot up from the USB
    flash drive containing the boot media. This requires your PC''s boot settings
    to seek instructions from the USB flash drive before seeking instructions on the
    hard drive. If your PC looks to boot from the hard drive first, you will need
    to change the settings:


    The UEFI (Unified Extensible Interface) in modern PCs replaces the BIOS (Basic
    Input/Output System) firmware interface in earlier PCs. These control how your
    PC boots up.


    +   - Consult your PC''s documentation to discover how to access its Setup utility.
    This often requires you to press the F2 key when starting the PC – but it varies


    +   - Connect the USB flash drive boot media to your PC


    +   - Start up your PC and enter the Setup utility


    +   - Select the section relating to the PC''s Boot process


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_17_0.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_17_1.png)


    The Setup utility is unique to your PC, so its appearance will probably differ
    from the one shown here. Most PCs will, however, provide a way to change the Priority
    Order so you can boot the PC from the USB flash drive.


    | Information | Configuration | Security | Exit |

    | --- | --- | --- | --- |

    | UEFI Boot | | [Enabled] | | Item Specific Help |

    | Boot Priority Order | | | | Use < or > to select a device. Then <F6> to move
    it up the list, or <F5> to move it down the list.

    | 2. ATA HDD0 | | | |

    | 3. ATA HDD1: ST5500423AS | | | |

    | 4. ATAFI CD: MATSHHITA JVD-RAM UJ8C1 | | | |

    | 5. USB FD: | | | |

    | 6. PCI LAN: Realtek PXE 803 D00 | | | |

    | 7. USB CD: | | | |


    | Help | Change Values | Setup Defaults |

    | --- | --- | --- |

    | Select Item | | |

    | Exit | Select Menu | Select Sub-Menu | Save and Exit |


    +   - Make the flash drive (USB HDD) the first boot device by following the Setup
    utility''s Help instructions'
  - '[PAGE 18]


    +   Save the new settings and exit the Setup utility – typically by pressing the
    F10 key


    +   If your PC is configured to boot in legacy BIOS mode, Linux Mint will now
    automatically start a Live Session


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_18_0.png)


    > Hot tipnWhen there is an option to choose between UEFI boot mode and legacy
    BIOS mode, UEFI offers several advantages – UEFI supports large hard drive partitions,
    has secure booting, and provides efficient system management.


    If your PC is configured to boot in UEFI mode, you will be presented with a menu.
    Select the “Start Linux Mint” option, then hit the Enter key to start a Live Session


    ```

    Start Linux Mint 20.3 Cinnamon (compatibility mode)

    UEFI install for manufacturers

    USB install for removable media

    ```


    > Hot tipnYou may also see “UEFI” referred to as “EFI” – UEFI is simply EFI 2.0.'
  - '[PAGE 19]


    # Beginning Installation


    Having started a Live Session by following the steps on pages 16-17, you can try
    out the Linux Mint operating system. It will perform in a similar manner to when
    it is permanently installed on the hard drive, but with these notable exceptions:


    +   - The Live Session is slower – it is loaded from the USB drive, rather than
    quickly from a hard drive.

    - Changes are not permanent – they are not saved on the USB flash drive, or written
    anywhere on your PC.

    - Some apps behave differently – system utilities, such as the Update Manager,
    cannot be used effectively.


    The Live Session provides an installer icon on the Desktop that can be used to
    begin permanent installation of Linux Mint:


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_19_0.png)


    The username in a Live Session is "mint". If asked for a password just hit the
    Enter key.


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_19_1.png)


    This book features Linux Mint version 19 (Tara) Cinnamon throughout. This version
    has Long Term Support until 2023.


    Double-click on the “Install Mint” icon to launch the installer wizard


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_19_2.png)


    ![](img/7b6ecabd34062cd153290258f3b9cd5b_19_3.png)'
