    ## 第 13 章 数据库驱动的网站


    在本章中，你将创建一个支持 PHP 的虚拟服务器，它通过 PHP 连接到 MySQL 数据库。这将允许客户端通过 Web 上的表单查询数据库。你将从在服务器上安装
    MySQL 数据库开始，然后在命令行创建并测试数据库，最后创建一个连接 MySQL 数据库的 PHP 页面以及用于向远程用户显示表单的 PHP 页面。表单嵌入第一个
    PHP 页面中。用户在第一个 PHP 页面提交请求的信息后，数据将发送到第二个 PHP 页面，由该页面查询数据库并将结果返回给用户。最后，你将在测试并在局域网和远程使用在线网络工具进行数据库查询。


