    ## Chapter 12


    ## Running Virtual Servers in Parallel


    In this chapter, you will configure two virtual servers that run in parallel.
    Which virtual server handles a request is dependent on the domain name menu in
    the requested URL rather than the IP Address of the server. Recall that in the
    previous chapter you used two different names for the same virtual server. This
    server used two different rules that were based on the port number to handle each
    domain. In this chapter, you can use the Match Nickname matching option to separate
    the two virtual servers based on their domain names. In the following examples,
    the first virtual server will use the webserver.dynu.com name and the second virtual
    server will use the christos.dynu.com domain name.


    ## Disabling the Port Forwarding Service


    In this section, you will find out why the Port Forwarding DDNS service is required
    to implement the Match Nickname Cherokee Host match.


    The Match Nickname option of the Method drop-down menu on the Host tab is used
    to create a virtual server that will respond when the domain name in the URL of
    the client''s request matches the virtual server''s name. For example, when the
    user types a URL in the browser''s address bar:


    ```

    http://webserver.dynu.com/news/file.html

    ```


    The URL is included in the HTTP connection request message, as can be seen from
    the resultant HTTP request:


    ```

    GET/news/file.html HTTP/1.1

    Host: webserver.dynu.com

    ```


    The Cherokee server compares the Host of the HTTP request with the virtual server
    names and if a match is found (e.g., the virtual server''s name is webserver.dynu.com),
    the specific virtual server handles the request.


    That being said, the previous sequence of events does not take place when port
    forwarding DDNS service is used, all client-server messages are routed to the
    DDNS Service Provider''s Port Forwarding service. When the DDNS service receives
    a request for a domain name for which Port Forwarding is enabled, the DDNS service
    responds with the IP address of its own Port Forwarding server instead of the
    public IP address of the router in front of the Cherokee server. When the Port
    Forwarding server receives the client''s HTTP request, the Port Forwarding redirects
    the client to send a new HTTP connection to the public IP address of the router
    in front of the Cherokee server, instead of the default port number 80, the port
    number on which your server listens (e.g., port 8080). The Port Forwarding server
    alters the domain name in the Host of the HTTP connection request, (e.g., from
    webserver.dynu.com, it will become <router''s-public-ip-address:8080>. Both the
    port as as the domain name must have been previously registered with the DDNS
    service provider (which was done in chapter 6).


    To illustrate the sequence of events, we''ll look at the initial HTTP request
    (from the client''s system) as well as the HTTP request that is received by the
    Web server. We''ll look at both cases: with Port Forwarding enabled and with Port
    Forwarding Disabled. We examine the headers of the HTTP protocol, we''ll use the
    online network tool HTTP Viewer:


    http://www.rexswain.com/httpviewer.html


    Another site offering a similar service is http://web-sniffer.net. Let''s look
    first at the case with the DDNS port forwarding service disabled. In the URL field
    of the HTTP Viewer server''s site:


