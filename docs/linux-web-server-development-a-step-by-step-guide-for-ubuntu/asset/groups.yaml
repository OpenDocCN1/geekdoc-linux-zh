    ## Cherokee 安装


    安装和配置 Cherokee 需要 *root* 权限。Linux 的一种方法是以 *root* 身份登录。另一种方法是在每个命令前加上 *sudo* 命令。*sudo*
    实用允许允许以 *root* 用户身份运行程序，这是 Ubuntu 推荐的方法。对于 Fedora Linux，如附录所示，我们将使用 *root* 用户账户。


    安装 Ubuntu 的用户使用 *sudo* 命令执行需要 *root* 权限的命令。要启用另一个用户（例如用户 christos）使用 sudo，您可以使
    /etc/sudoers 文件可写。在 Linux 终端中输入：


    ```

    $ sudo chmod +w /etc/sudoers

    ```


