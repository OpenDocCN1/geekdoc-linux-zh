    # Creating a PHP page


    PHP is a popular programming language used for server-side scripting, which offers
    dynamic content. In chapter 9, you will enable a Cherokee virtual server to allow
    the client request to be handled by the PHP parser. Also in chapter 13, you will
    run a database-enabled web site that builds on PHP and MySQL. In this section,
    you create your first PHP page called index.php.


    As your first PHP page, you will create an online network tool similar to the
    one you have used before to find your IP address. The PHP page will display the
    current IP address of the visitor of your site.


    Create the index.php file with your text editor and place the following lines:


    ```

    <?php

    $ip = $_SERVER[''REMOTE_ADDR''];

    echo "Your IP address is $ip";

    ?>

    ```


    The previous code snippet assigns to variable $ip the value of the $_SERVER array’s
    element with index REMOTE_ADDR. Array $_SERVER is a ‘defined variable containing
    information such as headers, paths, and script locations. The entries in this
    array are created on the fly by the Web server. At index REMOTE_ADDR in the array,
    the server stores the IP address of the user.


    To change the text format – for example, to use green-colored text center aligned
    with text size 80 pixels – use the style attribute of the HTML paragraph (<p>)
    tag:


    Note in order to escape the double-quotes (") inside the echo command so that
    they are not interpreted as the end of the echo string, you use the backslash
    (\) as the escape character.


    Follow the steps described later in chapter 9 to create a PHP enabled virtual
    server for Cherokee with the directory file index.php. Test the site with an online
    network tool. The following image shows the page as viewed from tools.pingdom.com:


    ![](img/5bf591327968a4c0190eb6adbf83042b_84_0.png)


    Click the remote browser’s screen of the previous image to zoom in:


    ![](img/5bf591327968a4c0190eb6adbf83042b_85_0.png)


    The IP address displayed is the IP address of the remote online tool. You can
    repeat the test by selecting a different system at tools.pingdom.com. Click the
    Settings link and select another server from a different country to display its
    IP address.


    ![](img/5bf591327968a4c0190eb6adbf83042b_85_1.png)


    # Chapter 8 Manually Creating a Virtual Server


    The focus in this chapter is on the process of creating a virtual server and setting
    its behavior manually. In the next chapter, you will use a Wizard to help you
    develop a PHP server. Wizards are configuration assistants that help the system
    administrator configure a new virtual server.


    # Matching the Virtual Server


    When creating a new virtual server, the first three tabs of the vServers section
    of the Administration Panel contain the settings for the basic attributes of the
    server, the settings that determine when the server will be chosen to handle the
    request, and the settings for how the server serves the client''s requests.


    ![](img/5bf591327968a4c0190eb6adbf83042b_89_0.png)


    In the first tab named Basics, you set the basic characteristics of the virtual
    server (e.g., the name, the directory index and the document root). The Cherokee
    web server must determine which virtual server will process the request. The virtual
    server values that will be evaluated in this phase are set in the Host Match page
    in the vServers section of the Administration Panel. In the Method drop-down menu,
    one of the following four methods for matching a server can be selected:


    - Match Nickname

    - WildCards

    - Regular Expressions

    - Server IP


    Each virtual server that you create is added to the Virtual Servers list found
    at the left of the vServers section of the Cherokee Administration Panel. This
    list is evaluated from top to bottom. As soon as a virtual server matches, the
    evaluation stops. If the request does not match one of the non-default virtual
    servers, the default server will handle the client''s request.


    As an example, consider that two virtual servers already exist in the Cherokee
    server (later you will create several virtual servers), with the nicknames:


    - webserver.dynu.com

    - myWebServer


    The following image shows the two virtual servers on the server list:


    ![](img/5bf591327968a4c0190eb6adbf83042b_90_0.png)


    You can change the order of the virtual servers in the list by clicking on the
    double arrow next to the server name and dragging the server name up or down.
    You can also disable and enable the server by clicking on the circular button
    to the right of the server name. There is also an ''x'' button that deletes the
    server.


    The nickname of the first server corresponds to a valid domain name used by the
    site, while the nickname of the second server does not. For the first server,
    the Match Nickname method is selected at the Host Match tab, which requires a
    valid domain name as the virtual server''s name, and for the second Server IP
    is selected, which requires a specified IP address (e.g. 192.168.1.101).


    # Server Rules Lookup and Handling


    Once the virtual server has been chosen from the Virtual list to handle the request,
    the request is evaluated against the list of rules you have created for the specific
    virtual server. For example, consider a rule for requesting files with .html extensions
    or a rule for a connection to port 8080. Therefore, the number of lists that must
    be searched two lists. Again, the evaluation is performed in the order from the
    top of the list to the bottom. If no rule applies to the client''s request, the
    Default rule wins.


    The virtual server rules define the condition on which the server will act and
    also how the request will be handled. You can set the rules in the Behavior tab
    of the vServers section. This section includes a table with the rules you have
    currently set and also the Default rule that is predefined for each virtual server.


    You can create new rules, set a handler for any rule you create, and also set
    a handler for the default rule. The rules are managed by the Rule Management button,
    which swaps to a new set of tabs relating to rules. The first two, called Rule
    and Handler, are the most important.


    ![](img/5bf591327968a4c0190eb6adbf83042b_91_0.png)


    In the Rule tab, you set the rule type for the rule currently selected from the
    list. The types are:


    - Directory

    - Extensions

    - Regular Expressions

    - Header

    - File Exists

    - HTTP method

    - Incoming IP/Port

    - SSL / TLS

    - Full Path

    - Connected from

    - URL Argument

    - GeoIP

