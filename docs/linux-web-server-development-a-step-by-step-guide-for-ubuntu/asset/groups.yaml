    ## 第 12 章


    ## 并行运行虚拟服务器


    在本章中，你将配置两个并行运行的虚拟服务器。由哪个虚拟服务器处理请求取决于请求 URL 中的域名菜单，而不是服务器的 IP 地址。回想一下在上一章中，你为同一个虚拟服务器使用了两个不同的名称。该服务器使用了两个基于端口号的不同规则来处理每个域名。在本章中，你可以使用
    `Match Nickname`（匹配昵称）选项根据它们的域名来区分这两个虚拟服务器。在以下示例中，第一个虚拟服务器将使用 webserver.dynu.com
    名称，第二个虚拟服务器将使用 christos.dynu.com 域名。


    ## 禁用端口转发服务


    在本节中，你将了解到为什么需要端口转发（Port Forwarding）DDNS 服务来实现 `Match Nickname` Cherokee 主机匹配。


    Host 选项卡中 Method 下拉菜单的 `Match Nickname` 选项用于创建一个虚拟服务器，当客户端请求 URL 中的域名与虚拟服务器名称匹配时，该服务器将做出响应。例如，当用户在浏览器地址栏中输入
    URL 时：


    ```

    http://webserver.dynu.com/news/file.html

    ```


    URL 被包含在 HTTP 请求消息中，正如生成的 HTTP 请求所示：


    ```

    GET/news/file.html HTTP/1.1

    Host: webserver.dynu.com

    ```


    Cherokee 服务器会将 HTTP 请求的 Host 与虚拟服务器名称进行比较，如果找到匹配（例如，虚拟服务器的名称为 webserver.dynu.com），则由特定的虚拟服务器处理该请求。


    尽管如此，当使用端口转发 DDNS 服务时，之前的事件序列不会发生，所有的客户端-服务器消息都将路由到 DDNS 服务提供者的端口转发服务。当 DDNS 服务接收到已启用端口转发的域名请求时，DDNS
    服务将用其自身的端口转发服务器 IP 地址进行响应，而不是 Cherokee 服务器前端路由器的公 IP 地址。当端口转发服务器接收到客户端的 HTTP 请求时，端口转发会将客户端重定向到
    Cherokee 服务器前端路由器的公 IP 地址发送新的 HTTP 连接，而不是默认端口号 80（即你的服务器监听的端口，例如端口 8080）。端口转发服务器会修改
    HTTP 连接请求中 Host 的域名（例如，将从 `webserver.dynu.com` 变为 `<router''s-public-ip-address:8080>`）。端口和域名都必须先在
    DDNS 服务提供者处注册（这在第 6 章中已完成）。


    为了说明这一事件序列，我们将查看初始的 HTTP 请求（来自客户端系统）以及 Web 服务器接收到的 HTTP 请求。我们将查看两种情况：启用端口转发和禁用端口转发。我们将检查
    HTTP 协议的标头，并将使用在线网络工具 HTTP Viewer：


    http://www.rexswain.com/httpviewer.html


    另一个提供类似服务的网站是 http://web-sniffer.net。让我们先看禁用 DDNS 端口转发服务的情况。在 HTTP Viewer 服务器网站的
    URL 字段中：


    http://webserver.dynu.com:8080


    ![](img/5bf591327968a4c0190eb6adbf83042b_136_0.png)


