- md: '

    Next go to the Behavior tab and click on the Rule Management button. A new set
    of tabs (Rule, Handler, etc.) appears.


    In the Rule tab, choose Incoming IP/Port in the Rule Type drop-down menu. In the
    Incoming IP/Port drop-down menu that appears, select 8181. Since the virtual servers
    are selected based on the domain name and not the port number (as we did in the
    previous chapter), you can assign more port numbers for this virtual server. In
    the drop-down menu in the Assign new IP/Port area, choose port 8080.


    ![](img/5bf591327968a4c0190eb6adbf83042b_150_0.png)


    In the Handler tab, select List & Send in the Handler drop-down menu and delete
    any entry in the Document root textbox. This is an alternative document root path.


    ![](img/5bf591327968a4c0190eb6adbf83042b_150_1.png)


    You can also disable any predefined rules created by Cherokee by clicking on the
    green circle button next to the Rule list at the left area of the window. You
    can also set the handler of the Default rule to None to avoid dispatching content
    out of the rules you set.

    Next click the SAVE button to confirm the settings. Click the Graceful restart
    button in the dialogue window that appears.


    ## Creating the Second Virtual Server


    We next create the virtual server that will match the domain name webserver.dynu.com.
    Click on the Add New Virtual Server button and enter the domain name webserver.dynu.com
    in the Nick text field. Create directory /var/www5 and the file index.html in
    this directory. In the file index.html, enter HTML code for a simple colored page.
    Enter /var/www5 in the Document Root field. Click the Add button and select the
    name of the new virtual server (webserver.dynu.com) in the server list, placed
    on the left area of the window.

    In the Basics tab, enter index.html in the Directory indexes field. In the Host
    Match tab, select the Match Nickname method and click on the Rule Management button
    in the Behavior tab. In the new set of tabs, click the Rule tab, select Incoming/Port
    in the Route type drop-down menu and in the Incoming IP/Port drop-down menu, select
    8080, one of the two ports used in this chapter. Also set the handler of the Default
    rule to None. As with the previous virtual server, you can also assign the port
    used by the other server, 8181.


    In the Handler tab, select List & Send in the Handler drop-down menu and delete
    any entry in the Document Root textbox. Finally click the SAVE button in the upper-right
    area of the window to confirm the settings. Click the Graceful restart button
    in the dialogue window that appears.


    ## Testing the Virtual Servers


    At this point, the two virtual servers are running simultaneously and each virtual
    server is


    ![](img/5bf591327968a4c0190eb6adbf83042b_151_0.png) providing different content.
    In this example, christos.dynu.com should serve an HTML page with a green background
    and webserver.dynu.com should serve an HTML page with a red background.


    ![](img/5bf591327968a4c0190eb6adbf83042b_152_0.png) We''ll use www.webpagetest.org
