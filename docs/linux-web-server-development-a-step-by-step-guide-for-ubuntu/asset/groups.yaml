    之前是 rexswain.com 向 DDNS 提供的者的端口转发服务器发送连接请求。端口转发服务器使用“对象已移动”（Object Moved）消息将客户端重定向到
    Web 服务器局域网路由的公网 IP 地址，端口为 8080，这正是被转发的端口。随后是另一个步骤，通过另一个连接请求让客户端（rexswain.com）连接路由器并最终连接
    Web 服务器。从 rexswain.com 到 Web 服务器的连接是通过两个请求完成的。第二个连接请求消息也包含在 rexswain 的网页中：


    ```

    GET / HTTP/1.1


    Host: 87.202.110.63:8080

    User-Agent: Mozilla/5.0 (Windows NT 6.1) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/43.0.2357.65 Safari/537.36

    Referer: http://www.rexswain.com/httpview.html


    Connection: close

    ```


    - 正在查找 TCP 协议...

    - 正在绑定到本地套接字...

    - 正在连接到主机...

    - 正在发送请求...

    - 等待响应:...


    接收到报头：


    # Web 服务器的响应是 HTTP 消息 200 (OK)：


    ```

    HTTP/1.1-200-OK(CR)(LF)

    Connection: close(CR)(LF)

    Date: Sun, 24-May-2015 03:58:46-GMT(CR)(LF)

    Server: Cherokee/1.2.101 (UNIX)(CR)(LF)

    Content-Length: 6708(CR)(LF)

    Content-Type: text/html(CR)(LF)

    Expires: Tue, 01-Jan-1970-00:00:00-GMT(CR)(LF)

    (CR)(LF)

    ```


    在禁用端口转发时，客户端消息中的 Host 字段对应服务器的域名。然而，在启用端口转发时，发送到服务器的第一个请求消息的 Host 字段虽然对应服务器的域名，但它会被重定向。随后的第二个连接请求消息将具有一个修改过的
    Host 字段。


    你也可以使用数据包嗅探器检查到达服务器计算机的客户端 HTTP 请求，数据包嗅探器是一种用于捕获和分析通过网络的数据包的程序。如果你没有数据包嗅探器，你需要安装
    Wireshark。从你 Web 服务器的 Linux 终端上运行：


    ```

