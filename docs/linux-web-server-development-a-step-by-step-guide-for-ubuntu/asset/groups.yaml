    Other names may be trademarks of their respective owners.


    Type ''help''; or ''h'' for help. Type ''c'' to clear the current input statement.


    mysql>

    ```


    ![](img/5bf591327968a4c0190eb6adbf83042b_156_0.png)


    ## Creating a MySQL Database and Table from the Command Line


    Use the create database command to create a database called bookstore:


    ```sql

    mysql> create database bookstore;

    ```


    Note that MySQL commands can also be uppercase (e.g., CREATE DATABASE) and all
    commands should end with a semicolon (;).


    Enter the use command to use a specific database (in this case, the database just
    created):


    ```sql

    mysql> use bookstore;

    ```


    Let''s add a table to the bookstore database named books. Table books is created
    with the create table command:


    ```sql

    mysql> create table books(book_id int auto_increment primary key, title varchar(255)
    not null, author varchar(255) not null);

    ```


    or


    ```sql

    mysql> create table books(book_id int auto_increment, title(255) not null, author
    varchar(255) not null, primary key(book_id));

    ```


    Table books includes a field named book_id, which is an integer (int) number.
    The keyword auto_increment indicates that book_id increments automatically by
    one in each record you add, starting (by default) from 1. The primary key constraint
    indicates that this field uniquely identifies each record in this table.


    The table will include two more fields, called title and author. Both are of varchar,
    which holds a variable length string with a maximum size specified in parenthesis.
    Fields title and author can hold up to 255 characters. The not null directive
    enforces a field to not accept null values.


    Use the show tables command to display the tables that the bookstore database
    contains. You have created just one table named books:


    ```sql

    mysql> show tables;

    ```


    The command''s output is shown below:


    ```text

    mysql> show tables;

    +----------------------+++

    | Tables_in_bookstore |

    +----------------------+

    | books               |

    +----------------------|


    1 row in set (0.01 sec)

    ```


    ```sql

    mysql>

