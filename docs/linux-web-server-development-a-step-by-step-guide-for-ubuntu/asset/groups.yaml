    ## Requesting Port Numbers from the OS


    The TCP port numbers in the range 0 to 1023 are the well-known ports and are sometimes
    referred to as system ports. On Unix-like operating systems (e.g., Linux), a process
    must execute with super privileges to be able to bind a network socket to an IP
    address using one of the well-known ports.


    A Web server can use port 80, the default port for HTTP, or any other port over
    the range of well-known ports. Ports 8080 and 8181 are two ports that will be
    used in this book.


    On some Linux systems (e.g., Fedora), you must configure the firewall to allow
    the use of any specific port. (A firewall restricts access to IP addresses and
    ports).


    The appendix has more information on the Fedora firewall and other differences
    between Fedora Linux and Ubuntu. For Ubuntu, no further configuration is required
    for using specific port.


    ## Testing the Server from another Computer of your LAN


    You can now check the Cherokee test page from another computer on your LAN. If
    you previously configured your Cherokee server to use IP address 192.168.1.101,
    use the following address in a browser:


    ```

    http://192.168.1.101

    ```


    Provided that the Cherokee server is running, the Cherokee test page should appear:


    ![](img/5bf591327968a4c0190eb6adbf83042b_41_0.png)


    In chapter 5, you will go a step further by allowing the Web server to be visible
    from outside of the LAN and thus be available from the entire Internet.


    ## Chapter 4 Cherokee Administration Panel


    In this chapter, you will take a tour of the main sections of the Cherokee Administration
    Panel. Each section is accessed from the corresponding icon at the top of the
    panel''s web page. Notice that the number of sections and other features of the
    Administration Panel may vary according to the Cherokee version.


    ![](img/5bf591327968a4c0190eb6adbf83042b_43_0.png)


    ## The Home Section of the Administration Panel


    In the Home section, you can find some information about the status of the server,
    the system''s memory and the processor, the system''s hostname and the path of
    the Cherokee configuration file. In the Language drop-down menu, you can select
    the language used at the Administration Panel interface.


    ![](img/5bf591327968a4c0190eb6adbf83042b_44_0.png)


    In the right area of the window are included some support links for the Cherokee
    server. As was already mentioned, you must start the server with the green Start
    Server button and stop the server with the same button (which is red-colored)
    and has the caption Stop Server when the server is running. The Start/Stop Server
    button is the most important feature of the Home section.


    ### The Status of the Administration Panel


    To go to the Status section, click the Status link. The Status section offers
    a monitoring tool. To activate this monitoring, click on the Information Collection
    link, which brings you to the General section.


    ![](img/5bf591327968a4c0190eb6adbf83042b_44_1.png)


    In the General section, select the RRDtool option in the Graphs Type drop-down
    menu if it is not already selected.


    The last chapters of this book describe how you can run simultaneously a number
    of Web servers, called Virtual Servers. To enable the graphs for a specific virtual
    server individually (instead of viewing system-wide data for all servers), you
    must enable data collection for the specific server. So far, there is only one
    virtual server running – the default. To permit data collection for the default
    server, return to the Status section and click the server’s name (default) just
    below the General link. Click the Enabled check box.


    Remember – each time a preference in the Administration Panel is configured, press
    the SAVE button next to the Cherokee section icons. After configuring some options
    (like the previous option – Graphs Type) the Cherokee program will ask you to
    restart the server.


    ![](img/5bf591327968a4c0190eb6adbf83042b_45_0.png)


    Click the Graceful restart button in the Save Configuration dialogue window that
    appears. After configuring these options the Status page looks like this:


    ![](img/5bf591327968a4c0190eb6adbf83042b_45_1.png)


    If no graphs are available at this point, it is because the RRDtool package is
    missing from the example system. RRDtool (Round-Robin Database Tool) is the data
    logging and graphing tool that handles time series data like network bandwidth,
    CPU load, etc. You can install RRDtool (if it is not already installed) with the
    following command at the Linux terminal:


    ```

    $ sudo apt-get install rrdtool

    ```


    You must restart the server afterwards. After the RRDtool installation is complete,
    the graphs are available:


    ![](img/5bf591327968a4c0190eb6adbf83042b_46_0.png)


    You can test the graph by visiting the Cherokee test page from another computer
    on your LAN or, as we describe in the next chapter, from external computers using
    an online network tool.


    There are three types of graphs to view by selecting the corresponding option
    from the drop-down menu:


    - Server Traffic

    - Connections / Requests

    - Connection Timeouts


    You can also set the time period for the data collection by clicking on one of
    the following tabs at the top of the graph: 1 Hour, 6 Hours, 1 Day, 1 Week, and
    1 Month.


    On the left side of the graph, you can click General to display data for system-wide
    data or you can click the server’s name to display data for a specific virtual
    server.


    To learn more about Cherokee graphs, visit the Cherokee Documentation page:

    http://cherokee-project.com/doc/other_graphs.html


    ## The General Section of the Administration Panel


    The General section provides the tabs Network, Ports to listen, Permissions, Icons,
    and MIME types. You have already visited the Network tab and set the value of
    Graphs Type to RRtool graphs. This page also provides network configuration options.
    For example, you can configure the time interval a server will wait until it closes
    inactive connections. As another example, you can enable protocol support for
    IPv6.


    ![](img/5bf591327968a4c0190eb6adbf83042b_47_0.png)


    In the Ports to listen tab, you can add and delete the ports on which the server
    listens. The default port for the HTTP protocol, port 80, is already included.
    You may wish to add additional port numbers for the following reason: Some Internet
    Service Providers (ISPs) forbid incoming packets to port 80 or you can experiment
    with another server that uses port 80. If this is the case, you must use a different
    port for your Web server. A common port number you can use is 8080, sometimes
    referred to as the alternate port. Chapter 12 describes the simultaneous use of
    two virtual servers that listen on different ports, ports 8080 and 8181.


    Before you add a new port, make sure that the port is not already used by another
    service. At the Linux terminal run the following command:


    ```

    $ netstat --tcp --listening --programs

    ```


