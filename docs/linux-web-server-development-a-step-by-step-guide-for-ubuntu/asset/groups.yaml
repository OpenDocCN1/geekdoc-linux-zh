    ## 第 3 章 操作系统配置


    ### 为服务器分配私有静态 IP 地址


    你必须为你的 Web 服务器分配静态 IP 地址。让我们以 IP 地址 192.168.1.101 为例。这是一个私有 IP 地址。私有 IP 地址仅对你的局域网有效。之前的地址是来自私有网络
    192.168.1.0 的随机 IP 地址。按照习惯，路由器使用此地址引用 C 类私有网络，这是最常见的 IP（互联网协议）网络类。另一个常用的常用的私有网络是
    192.168.0.0 网络。IP 地址也可以是静态的，这意味着在系统管理员手动更改之前，该 IP 地址不会发生变化。


    家庭路由器通常使用 DHCP（动态主机配置协议）来动态分配 IP 地址，这些地址在一段时间后会更改，通常以天为单位。使用静态 IP 地址，你可以远程配置 Cherokee
    服务器，并从局域网内的其他节点测试服务器。此外，且更重要的是，你可以在路由配置中指定服务器的静态 IP 地址，将其作为处理 HTTP（HTTP 代表超文本传输，万维网的协议）的服务器。


    为了让服务器从互联网各个客户端可见，服务器必须有一个关联的公共 IP 地址。此关联地址是公共 IP 地址，即服务器局域网路由器面向互联网的接口地址。通过使用路由器的虚拟服务器服务（将在第
    5 章中讨论），所有发往路由器的 HTTP 请求将由路由器转发到 Cherokee 服务器。在接下来的图中，Web 服务器是主机 192.168.1.101。通过使用路由器的
    IP 地址 94.69.219，可以在互联网上访问该 Web 服务器。路由器的私有 IP 地址为 102.168.1，允许从内部访问路由器。


    ![](img/5bf591327968a4c0190eb6adbf83042b_37_0.png)


    为了将局域网内的一台计算机指定为 Web 服务器（如第 5 章所述），该计算机必须使用静态 IP 地址。你必须禁用 DHCP 并手动配置服务器的静态 IP
    地址、子网掩码、网关和 DNS 参数。


    对于 Ubuntu Linux，点击启动按钮并选择设置，然后选择网络。点击添加按钮添加新连接。


    ![](img/5bf591327968a4c0190eb6adbf83042b_38_0.png)


    在弹出的对话框中，在连接名称框中输入连接名称（例如 Ethernet IP），并点击 IPv4 设置标签页。在方法下拉菜单中选择手动（默认设置为 DHCP）。


    点击添加按钮编辑地址、子网掩码和网关字段。


    输入以下值：


    地址：192.168.1.101


    这是我们分配给 Cherokee 服务器的 IP 地址。


    子网掩码：255.255.255.0


    子网掩码（Network mask）字段指示如何将 IP 地址划分为网络部分和主机部分。255.255.255.0 的掩码值表示 IP 地址的前三个字节指定网络，第四字节指定主机。


    网关：192.168.1.1


    网关是路由器的另一个名称。输入路由器的私有 IP 地址，即路由器内部接口的 IP 地址。当然，路由器也有一个对于整个互联网有效的公共 IP。在本示例中，路由器的私有
    IP 为 192.168.1.1。


    再次将路由器的私有 IP 地址输入到 DNS 服务器（域名系统服务器）字段：


    DNS 服务器：192.168.1.1


