    # Testing the Database Site Locally


    From a computer at the server’s LAN, test the database site. At web browser’s
    address bar enter the following URL:


    http://192.168.1.101


    Or if you run the server to a different port than 80, for instance port 8181,
    use the following URL:


    http://192.168.1.101:8181


    The virtual server dispatches the directory index, which you set previously to
    index.php.


    ![](img/5bf591327968a4c0190eb6adbf83042b_167_0.png)


    At the text box of the form, enter a word to make a keyword search. You can use
    the same word used previously from the command line (e.g., Web) to compare the
    results. Press the Search button in the form. The form defines database.php as
    the program that handles the data at the server. The PHP parser runs the code
    and the output is received by the client:


    ![](img/5bf591327968a4c0190eb6adbf83042b_167_1.png)


    # Testing the Database Site Remotely


    Use an online network tool like http://tools.pingdom.com/ or http://www.webpagest.org/
    to test the database site. You can view the Home page, which includes the form,
    by entering in the text box site''s address:


    http://webserver.dynu.com/


    Click the Test Now button and the page index.php appears in the virtual browser
    of the online network tool:


    ![](img/5bf591327968a4c0190eb6adbf83042b_168_0.png)


    Click on the image at the left to zoom into the web page:


    ![](img/5bf591327968a4c0190eb6adbf83042b_168_1.png)


    Testing the home page of the database site is certainly required, but it would
    be more helpful to query the database using the online network tool. Certainly,
    you cannot control the remote browser to type the keyword in the textbox and press
    the Search button. However you can request the query by sending the data appended
    on the URL. In the online network tool, enter at the text box the following URL:


    Using the previous URL, you provide the data directly to database.php, by attaching
    them in the URL, instead of requiring a user typing them at the form provided
    by index.php.


    In this example the keyword Web is the one sent, as it would be sent by the text
    box name


    The result is shown below:


    ![](img/5bf591327968a4c0190eb6adbf83042b_169_0.png)


    By clicking on the browser’s icon at the left, you can enlarge the icon (by zooming
    in) and inspect the web page and view the results:


    ![](img/5bf591327968a4c0190eb6adbf83042b_169_1.png)


    The question mark (?) used in the URL for the remote queries separates the query
    string from the directory path to the resource that will handle the data (database.php).


    A query string is the portion of the URL submitted to the Web server that includes
    the database fields and their values. In the previous example, there is only one
    field submitted to the server, namely title with a value of Web. If our site used
    two or more fields, the ampersand (&) would be used to separate the field/value
    pairs. For example, if the query also included the author field:


    http://webserver.dynu.com/database.php?title=Web&author=Tim Berners Lee


    Next, use the following URL in the text box of tools.pingdom.com:


    http://webserver.dynu.com/database.php?title=Weaving The Web


    Running the test again has the following result:


    Weaving The Web, Tim Berners Lee


    ![](img/5bf591327968a4c0190eb6adbf83042b_170_0.png)


    Note that in order to submit the query in a way that was accepted by all browsers,
    we could replace any space with the special URL encoding character %20 or the
    plus sign. The previous query could be submitted as:


    http://webserver.dynu.com/database.php?title=Weaving%20The%20Web


    or


    http://webserver.dynu.com/database.php?title=Weaving+The+Web


    # Appendix: The Fedora Linux Implementation


    The following sections describe the Fedora implementation of the Cherokee Web
    server. We chose Fedora because this distribution has some significant differences
    with Ubuntu, the version we have used throughout the book. Studying another Linux
    distribution in addition to Ubuntu could possibly increase your confidence in
    using the Cherokee Web server on any Linux distribution.


    The main differences you may notice when moving from Ubuntu to Fedora are the
    following:


    - the availability of a root user

    - the presence of a firewall

    - the yum package manager

    - the IP address configuration


    # The root user


    Fedora, by default, creates a root user during the installation process. To run
    commands for the installation packages or start cherokee-admin, you can use the
    root account or the sudo command. In the first case, sudo is not required. The
    root prompt (#) appears at the command line:


    # cherokee-admin -b


    # The Firewall


    Modern Operating systems like Windows, Linux and Macintosh have a built-in mechanism
    to allow and prohibit connections on certain ports, IP addresses, and services.
    In order to prevent external attacks that target specific services, only necessary
    ports and services are not filtered by the firewall.


    Fedora Linux''s firewall is an application named (appropriately enough) Firewall.
    A firewall allows or prohibits ports, IP addresses, protocols (e.g. UDP or TCP)
    or a combination of these (e.g., allow only 192.168.1.25 on port 4000). If you
    want to use a port in Fedora, you must configure the Firewall application to open
    this port.


    To open the Firewall application, click on the Activities menu. This will expand
    the options in the left area of the desktop.


    ![](img/5bf591327968a4c0190eb6adbf83042b_176_0.png)


    Click on the **Show Applications** option, the last icon in the expanded menu
    in the previous image. Locate the Firewall application either in *Frequent* or
    *All*. We can also use the *Type to search* textbox to search for Firewall.


    ![](img/5bf591327968a4c0190eb6adbf83042b_176_1.png)


    Click on the Firewall icon and the application starts.


    ![](img/5bf591327968a4c0190eb6adbf83042b_177_0.png)


    Applying the configuration for Runtime and Permanent options in the configuration
    menu. In the Zones tab for the public and external zone, click on the Services
    tab to select the well-known Internet services you want to add. Click on the Ports
    tab to Add open ports. In the following, the opened ports are 80, 8080 and 8181.
    80, the default port for HTTP, 8080, the alternative port, and 8181, a port number
    occasionally used in this scenario, will be used in this book. You must also open
    port 990, the default for cherokee-admin.


    ![](img/5bf591327968a4c0190eb6adbf83042b_177_1.png)


    To see which ports are open with Firewall with the netstat command. Start cherokee-admin
    and then enter the following command in a Linux terminal:


    # netstat -ntulp


    The command outputs port numbers 80, 8080 and 8181 that are used by Cherokee as
    well as port number 990, used by cherokee-admin.


    ![](img/5bf591327968a4c0190eb6adbf83042b_178_0.png)


    The Fedora Firewall is a graphical interface to the Linux iptables command line
    tool. You can use iptables from Ubuntu and all other distributions to configure
    port numbers and IP addresses for your firewall. To list the open ports by iptables,
    use the -n (numeric output) and the -L (list) arguments:

    iptables -n


    The image displays the terminal with the command''s output:


    ![](img/5bf591327968a4c0190eb6adbf83042b_178_1.png)


    # The yum Package Manager


    By default, Fedora uses the yum package manager instead of apt-get. For example,
    we use:


    ```

    # yum install cherokee

    # yum install rdtool

    # yum install ddclient

    # yum install php

    # yum install mysql mysql-server php-mysql

    # yum install wireshark

    ```


