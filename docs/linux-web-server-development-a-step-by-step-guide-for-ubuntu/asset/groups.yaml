- md: '

    Assigning a static IP address for Fedora is similar with the Ubuntu configuration.
    You must enter the same information: the static IP address, the network mask,
    the gateway, and the DNS server.


    Click on the **Activities** menu to expand the options in the left area of the
    desktop:


    ![](img/5bf591327968a4c0190eb6adbf83042b_180_0.png)


    Select the **Show Applications** option, which is the last icon on the expanded
    menu in the previous image. Some application icons appear on the desktop.


    ![](img/5bf591327968a4c0190eb6adbf83042b_180_1.png)


    Click the button **All** in the bottom of the desktop and locate the **Settings**
    icon. Click on the icon to move to the *All Settings* window:


    Click the *Network* icon to move to the *Network* window.


    In the *Wired* section, the DHCP configuration profile (*em1*) is already set.
    Click the *Add Profile* button to add a new network configuration with a static
    IP. In the dialogue window that appears, select *IPv4*. In the *Address* drop-down
    menu, select *Manual* instead of *DHCP* (the default option).


    ![](img/5bf591327968a4c0190eb6adbf83042b_182_0.png)


    Enter the following values at the corresponding text boxes:


    **IP**: 192.168.1.101

    this is the IP address we wish to assign to the Web server.


    **Netmask**: 255.255.255.0

    The **Netmask** indicates how the IP address is divided to a network part and
    a host part.


    **Gateway**: 192.168.1.1


    **DNS**: 192.168.1.1


    In the **Gateway** textbox, enter the private IP address of the router. Also enter
    the router’s IP in the **DNS** text box. Click the Apply button to confirm the
    configuration settings.


