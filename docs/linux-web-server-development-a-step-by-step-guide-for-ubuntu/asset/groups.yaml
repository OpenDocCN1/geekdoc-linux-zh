    IP address of the router (87.202.110.63) and eventually through the virtual servers
    router configuration to the server that was assigned port 8080, which is your
    Web server.


    ```

    GET / HTTP/1.1

    Host: webserver.dynu.com:8080

    User-Agent: Mozilla/5.0 (Windows NT 6.1) AppleWebKit/537.336 (KHTML, like Gecko)
    Chrome/43.0.2357.65 Safari/537.36

