    # Creating a PHP page


    PHP is a popular programming language used for server-side scripting, which offers
    dynamic content. In chapter 9, you will enable a Cherokee virtual server to allow
    the client request to be handled by the PHP parser. Also in chapter 13, you will
    run a database-enabled web site that builds on PHP and MySQL. In this section,
    you create your first PHP page called index.php.


    As your first PHP page, you will create an online network tool similar to the
    one you have used before to find your IP address. The PHP page will display the
    current IP address of the visitor of your site.


