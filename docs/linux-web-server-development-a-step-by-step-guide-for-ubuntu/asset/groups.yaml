    # 管理面板的虚拟服务器部分


    下一个要讨论的部分是 vServers，它是 Virtual Servers（虚拟服务器）的缩写。Cherokee 支持多个同时运行的 Web 服务器（虚拟服务器）。每个虚拟服务器可以使用不同的域名、支持不同的网站并利用不同的工具。即使你不想创建多个虚拟服务器，仍然会使用默认虚拟服务器。这个名为
    default 的虚拟服务器存在于每个 Cherokee 中。


    在 Servers（服务器）的 Basics（基础）选项卡中，你可以配置网站的 Document Root（文档根目录）目录。这是 Cherokee 提供文件的目录。例如，如果
    Document Root 是 /var/www，那么客户端对 http://www.example.com/index.html 的请求指向 /var/www/index.html。如上一张图片所示，对于
    Ubuntu，Document Root 默认为 /var/www 或 /usr/local/www/。如果我们想更改 Document Root 目录，可以在
    Document Root 文本框中输入新目录的路径。


    ![](img/5bf591327968a4c0190eb6adbf83042b_52_0.png)


    Directory Indexes（目录索引）文本字段设置目录索引。目录索引指示当客户端请求域名结尾带有斜杠（/）的 URL（例如，http://webserver.dynu.com/）时，要发送的文件列表。目录索引文件的常见名称是
    index 加上对应的文件扩展名（例如，index.html， index.php）。如果目录索引设置为 index.html，则之前的 URL 等同于：


    http://webserver.dynu.com/index.html


    在 Logging（日志）选项卡中，你可以配置 Cherokee 服务器的日志（例如，使用哪两个文件名进行错误和访问日志）。Error Logging（错误日志）和
    Access Logging（访问日志）文件名也可以从默认值更改。


    要在 Format（格式）下拉菜单中启用访问日志，请选择 Apache compatible（兼容 Apache）而不是默认的（None）。在 Filename（文件名）文本框中，为日志文件选择新名称和路径。你也可以保持默认。在
    Time（时间）标准下拉菜单中，选择 Local time（本地时间）或 UTC（协调世界时）。


    如果默认访问日志位置未从默认位置更改，可以使用以下命令查看访问日志文件：


    $ sudo more /usr/local/var/log/cherokee.log


    下图中所示示例输出显示了有关 Web 客户端连接服务器的信息记录。该信息包括 Web 客户端连接服务器的 IP 地址、时间、客户端请求的 URL。例如：


    50.22.226 - [13/Feb/2015:17:24] "GET /HTTP/1.1" 200 251 "-" "Mozilla/5.0 (X11;
    Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/40.0.2214.93 Safari/537.36"
    ![](img/5bf591327968a4c0190eb6adbf83042b_53_0.png)


    ![](img/5bf591327968a4c0190eb6adbf83042b_53_1.png)


    你也可以通过在下拉菜单中选择索引并在 Filename 文本框中指定文件名来配置错误日志。选项有 Standard、Execute、Disabled。


    第 8 到 12 章包含了创建和运行虚拟服务器的许多示例。这些章节还讨论了 vServers 部分。


    # 从互联网可见


    此时，Cherokee 服务器正在运行，但它仅对局域网可见。在本章中，你将使服务器对整个互联网可用。假设你的路由器目前使用 NAT（网络地址转换）允许局域网内的每台计算机伪装成路由器。通过虚拟服务器选项，路由器管理员可以注册一个端口，由指定的计算机负责监听。例如，如果你希望使用局域网内
    IP 地址为 192.168.1.200 的计算机作为使用端口 80 的 Web 服务器，使用另一台计算机 192.168.1.110 作为使用端口 8080
    的 Web 服务器，并在虚拟服务器设置中将端口 80 分配给 IP 192.168.1.200，将端口 8080 分配给 IP 192.168.1.110。更改配置后，当客户端连接到
    webserver.dynu.com:80（或简单的 webserver.dynu.com，因为请求发送到了路由器的公 IP 地址，例如 94.69.235.77，这是
    webserver.dynu.com 对应的 IP），根据虚拟服务器表，路由器会将请求传递给 IP 为 192.168.1.200 的服务器。同样，到 webserver.dynu.com:8080
    的连接将传递给 IP 为 192.168.1.110 的服务器。


    # 虚拟服务器路由器选项


    路由器的公 IP 地址可以是静态的或动态的。对于静态 IP，你可以通过 DNS 系统注册与该 IP 对应的域名。对于动态 IP（更常见且成本更低），可以使用从
    DDNS（动态 DNS）提供商分配的域名（通常免费）。DDNS 将在下一章解释。


