    ## Choosing the Web Server


    The most popular Web servers are Microsoft IIS and Apache, an Open Source web
    server that has been around for years. Cherokee, a new server with a Web-based
    interface, has become popular recently.


    Here is what Wikipedia says about Cherokee:


    > Cherokee is an open-source cross-platform web server that runs on Linux, BSD
    variants, Solaris, Mac OS X, and Microsoft Windows. It is a lightweight, high-performance
    web server/reverse proxy licensed under the GNU General Public License. Its goal
    is to be fast and fully functional yet still light. Major features of Cherokee
    include a graphical tool for administration named cherokee-admin and a modular
    light-weight design.


    Independent tests have shown Cherokee to be better performing than Apache when
    serving both static and dynamic content.


    Cherokee is maintained and developed by the open source community.


    The following image shows the Cherokee home page (www.cherokee-project.com):


    # CHEROKEE WEB IS ARCHITECTED FOR TODAY


    Cherokee Web is an intuitive, feature, lightning fast and easy to configure open
    source-web server designed for the next generation of highly concurrent secured
    web.


    ## Features Highlights


    - User-friendly: Manage your web easily through Cherokee Admin, a beautiful and
    powerful web interface

    - Modern Technologies: Cherokee Web supports all latest web technologies, including
    SSL, COOP, LOMT, TLS/SSL, HTTP proxy, video streaming, content caching, traffic
    shaping, API

    - Cross Platform: Cherokee works on Linux, Windows, OS X, Solaris, FreeBSD.


    ![](img/5bf591327968a4c0190eb6adbf83042b_19_0.png)


    # Chapter 2 Cherokee Installation and Configuration


    ## Cherokee Installation


    To install and configure Cherokee, *root* privilege is required. One option for
    Linux is to login as *root*. An alternative is to precede each command with the
    *sudo* command. The *sudo* utility allows a user to run programs as the *root*
    user and is the recommended approach for Ubuntu. For the Fedora Linux, as described
    in the appendix, we will use the *root* user account.


    The user who installs Ubuntu uses the *sudo* command to execute commands that
    require *root* privilege. To enable another user, for example user christos, to
    use sudo you may make /etc/sudoers file writable. Enter in the Linux terminal:


    ```

    $ sudo chmod +w /etc/sudoers

    ```


    To edit /etc/sudoers file:


    ```

    $ sudo edit /etc/sudoers

    ```


    Add the following entry to the /etc/sudoers to the original permissions:


    ```

    christos ALL=(ALL) NOPASSWD: ALL

    ```


    Instead of edit you can also use the echo command:


    ```

    $ echo "christos ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

    ```


    Reset the permissions of /etc/sudoers to the original permissions:


    ```

    $ sudo chmod -w /etc/sudoers

    ```


    The command to download and install Cherokee varies among the Linux distributions.
    For Ubuntu:


    ```

    $ sudo apt-get install cherokee

    ```


    The *apt-get* command is a command-line tool which uses Ubuntu''s *Advanced Packaging
    Tool (apt)* to download, install, upgrade, and remove software packages.


    Note that the previous command requires an active Internet connection since the
    *apt-get* command downloads packages.


    To update the package repositories used by *apt-get* and install the most recent
    Cherokee version, enter the following command before using the previous *apt-get*:


    ```

    $ sudo apt-get update

    ```


    In the case that the *apt-get* depositories are not updated with the latest version,
    you can download and install Cherokee from source. At the home page of *cherokee-project.com*,
    click on the *Download Cherokee* link.


    ## Quickstart Guide


    Download Cherokee


    - Stable releases

    - Nightly releases


    Install Ubuntu


    ```

    sudo add-apt-repository ppa:cherokee/stable

    sudo apt-get update

    sudo apt-get install cherokee

    ```


    ![](img/5bf591327968a4c0190eb6adbf83042b_26_0.png)


    When downloading is complete, right-click an ISO image and choose Burn disc image.


    ![](img/5bf591327968a4c0190eb6adbf83042b_27_0.png)


    Follow the usual method to unzip. In a Linux terminal, change directories to the
    unzipped package:


    ```

    cd ~/Downloads

    tar -xvf cherokee-1.2.101.tar.gz

    cd cherokee-1.2.101

    ./configure --prefix=/usr --sysconf=/etc

    make

    sudo make install

    ```


    Note that for the example to work on some systems, some tools must be installed
    (gcc, make, gettext):


    ```bash

    sudo apt-get install gcc gettext

    ```


    Installing Cherokee from the Ubuntu Software Center is another option. The Ubuntu
    Software Center is a GUI (Graphical User Interface) for browsing, installing,
    and removing applications.


    On the Ubuntu desktop, click the Applications menu and select Ubuntu Software
    Center. In the search box, enter cherokee and press Enter. In the results, select
    the Cherokee entry and click the Install button to start Cherokee download.


    ![](img/5bf591327968a4c0190eb6adbf83042b_27_0.png)


    ## Starting the Cherokee Administration Panel with cherokee-admin


    Cherokee configuration is straightforward because it has a big advantage: a simple
    browser-based configuration interface provided by the utility cherokee-admin.


    You can configure Cherokee using Firefox, Internet Explorer, Chrome or any other
    browser.


    To open the browser-based Administration Panel, a one-time password is required.
    A one-time password, as implied by its name, is valid only for a single login.
    After it is used, it expires and a new password must be created. A potential intruder
    records that a one-time password will not be able to reuse it since the password
    will not be valid after its first and only use.


    The Cherokee one-time password is generated by cherokee-admin. cherokee-admin,
    which must be executed with root privilege, is the administrative interface to
    Cherokee. The cherokee-admin output conveniently reminds the user of the address
    to be entered in the browser’s address line to open the Cherokee Administration
    Panel.


    To start cherokee-admin and obtain the one-time password, enter in a Linux terminal:


    ```

    [sudo] password for christos:

    Cherokee Web Server 1.2.101 (May 23 2015): Listening on port 127.0.0.1:9090,

    TLS disabled, IPv6 enabled, using epoll, 4096 fds system limit, max. 2041

    connections, caching I/O, single thread

    ```


    $ sudo cherokee-admin


    Here is the output of cherokee-admin:


    Login:

    User: admin


