    因此，通过虚拟服务器（Virtual server router）选项，不同端口上的多台计算机都可以使用路由器的公 IP 地址。（相比之下，在 Cherokee
    的虚拟服务器配置中，你的 Cherokee 服务器可以虚拟化多个 Web 服务器。）


    ## 路由器配置


    为了配置路由器，以便任何连接互联网的客户端计算机都能访问你的服务器，你可以使用路由器的 Web 界面。许多路由器还支持通过 *telnet* 服务调用的命令行界面。然而，我们不会详细介绍命令行界面，因为图形化界面通常更容易使用。这将是你在书中第二次使用
    Web 界面。第一次是在使用 Cherokee 管理面板时。


    我们使用一台一级 FBR-1161 ADSL2+ 路由器作为案例研究。不同路由器的 Web 界面各不相同。每个型号的菜单和选项通常也不同。有时它们的功能也存在差异。接下来，将描述大多数现代路由器共有的基本功能。示例中路由器的私有
    IP 地址为 192.168.1.1。在路由器局域网（LAN）的任何计算机的浏览器地址栏中输入此地址。弹出的对话窗口提示你输入用户名和密码。你输入的值可以是默认用户名/密码（在路由器手册中找到），也可以是你之前选择替换默认值的新值。*Status*（状态）页面将会：


    在该页面的 WAN（广域网）部分，你可以找到路由器的公 IP 地址（有时称为其外部 IP 地址）。如果你的互联网服务提供商（ISP）为你分配了动态 IP 地址（大多数情况都是如此），路由器的公
    IP 地址会在一段时间后或每次你关闭并重启路由器时更改。在上一个示例中，路由器的公 IP 地址是 79.130.85.60。还有其他方法可以获取你的 IP，例如，一些网站会报告你的
    IP 地址：http://www.whatssmyipaddress.com


    点击 **Advanced Setup**（高级设置）链接，会出现以下页面：


    点击 **NAT** 链接配置 **Network Address Translation**（网络地址转换）选项。会出现以下页面：


    可见 NAT 处于激活状态。（如果路由器未激活 NAT，你必须点击 Interface Setup（接口设置），然后点击 Internet 链接，并在 NAT
    下拉菜单中选择 Enable，然后点击 SAVE 按钮）。激活 NAT 后，点击 Virtual Server（虚拟服务器）链接来配置虚拟服务器选项。在 Application
    下拉菜单中选择 HTTP_Server（这随路由器型号而异）。在 Start Port Number（起始端口号）和 End Port Number（结束端口号）字段中输入端口号（例如
    8080）。在 Local IP Address（本地 IP 地址）字段中输入 Web 服务器的私有 IP 地址（例如 192.168.1.101）。点击
    SAVE。对其他端口重复相同的过程。


    在此示例中，私有 IP 地址为 192.168.1.101 的计算机被分配了处理端口 8080 和 8181 流量的任务。端口 8080 是提供 Web 服务的常用端口
    80，而端口 8181 是一个随机端口号。如果你的 ISP 允许接入端口 80 的入连接，你也可以添加官方的 HTTP 端口。你可以尝试包含端口 8080，并使用在线网络工具进行测试（在本章下文中将描述该方法）。如果你使用非标准端口（例如端口
    8080），URL 将从常用的：


    http://some_site.com


    变为：


    http://some_site.com:8080


    这没有问题，因为大多数 DDNS 服务都会处理此问题（使用端口重定向 DDNS 将第 6 章讨论）。目前，你可以使用带有 IP 地址而不是域名的 URL 访问网站。


    ## 从互联网测试你的网站


    到为止，你已经通过 Cherokee Web 服务器的私有 IP，从 Web 服务器或局域网内的其他计算机查看了 Cherokee 测试页面：


    ```

    http://192.168.1.101

    ```


    （如果互联网服务提供商禁止，端口 80 在你的局域网内仍然有效）


    或者


    ```

    http://192.168.1.101:8181

    ```


    或者


    ```

    http://192.168.1.101:8080

    ```


    配置好路由器后，你可以从局域网外的互联网计算机上测试你的网站。那么，路由器的公 IP 地址以及（因此）你网站的 IP 地址是多少？下面的图片显示了 www.howfindmypipaddress.com
    的结果：


    那么你难道不能从内部局域网的浏览器中使用路由器的外部 IP 地址吗？遗憾的是，这在大多数情况下行不通。许多路由器出于安全考虑会阻止环回连接（loopback
    connections）。这意味着局域网上的机器（即路由器后面的机器）无法连接到同样位于局域网内的机器的外部 IP 地址。你无法通过端口 80 连接到路由器的内部
    IP，因为这将指向 Web 路由器配置界面。你还无法从路由器的内部（私有）地址访问 8080 和 8181 端口，因为虚拟服务器服务不支持内部接口。


    就像人需要镜子来看自己的形象一样，你需要一台外部计算机来查看你的网站在局域网外的样子。即使网站在局域网内部计算机上看起来良好，也不能确保它从互联网访问时没有问题。使用在线网络工具，你还可以确定不同国家的下载速度并确定哪些端口是关闭的。


    这些网站之一是 pingdom.com。


    这些网站之一是 pingdom.com。如果公地址是 79.130.85.60 且我们使用的端口是 8181，请在文中输入：


    http://79.130.85.60:8181



