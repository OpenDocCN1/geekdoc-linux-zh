    hardware. Port 9090 is the default TCP port on which the cherokee-admin process
    listens for connections.


    Open the browser and type at the address line the following URL (Uniform Resource
    Locator):


    http://localhost:9090


    or


    http://127.0.0.1:9090


    A dialog box appears with two fields: User Name and Password.


    ![](img/5bf591327968a4c0190eb6adbf83042b_30_0.png)


    we enter admin as the User Name and the one-time password returned from cherokee-admin
    as the Password, which was YW61JCFdXKonYij in the previous example. If the login
    is successful, you reach the main admin page of the Cherokee Administration Panel:


    ![](img/5bf591327968a4c0190eb6adbf83042b_30_1.png)


    By default, cherokee-admin binds to only 127.0.0.1 (localhost), which means you
    can only connect to it from the same system. You, however, run cherokee-admin
    with the bind (-b) option to specify the network address on to listen. If no IP
    address is provided in the -b option, Cherokee will bind to all interfaces. In
    the following example you can use the Administration Panel from any computer on
    your LAN:


    $ sudo cherokee-admin -b


    Assuming that the private IP address of your Web server is 192.168.1.101, the
    following to start the Administration Panel should be used in any browser on your
    LAN:


    http://192.168.1.101:9090


    You will learn how to set the private IP address of the server in Chapter 3.

    For more information on the cherokee-admin options, use the utility’s manual:


    $ man cherokee-admin


    ## The Cherokee Administration Panel


    From the home page of the Cherokee Administration Panel, we can go to the other
    configuration pages using the tabs: Status, General, vServers, Sources and Advanced.
    The following image shows the home page of the Administration Panel:


    ![](img/5bf591327968a4c0190eb6adbf83042b_31_0.png)


    The most important feature of the Home tab is the green button that starts Cherokee,
    labeled *Start Server*. When you click this button, the button toggles from green
    to red and the *Stop Server* caption appears.


    ## The Cherokee Test Page


    Let''s test the server you just started. Using the same IP address as we used
    to access *cherokee-admin*, enter the following URL in the browser’s address bar:


    ```

    http://127.0.0.1

    ```


    Cherokee uses by default the official port for the *HTTP protocol*, the protocol
    of the World Wide Web, port 80. You don''t have to explicitly denote this port
    at the URL. On the other hand, it would not be an error to use:


    ```

    http://127.0.0.1:8080

    ```


    Instead of the *loopback* IP address, you could also use the *localhost* hostname:


    ```

    http://localhost

    ```


    The Cherokee test page appears in the browser’s window. The test page has the
    filename *index.html* and is titled *Cherokee Test Page*. When you set up your
    Web site, you will replace the Cherokee test page with your own page.


    The Cherokee test page or any page from your Web site can thus be tested from
    the Web server computer itself.


    ![](img/5bf591327968a4c0190eb6adbf83042b_32_0.png)


    What if something goes wrong and the Cherokee test page is not displayed? If you
    use Fedora, you must open each port used by the Web server in your system''s firewall.
    For the Web server, the default port is port 80. Also ports 8080 and 8181 are
    used in the examples of this book. You must allow these ports and also open port
    9090, which is the port on which default cherokee-admin listens for connections.
    You must configure the firewall as described in the appendix.


    Note that some versions of Ubuntu come the test page with the Apache Web server
    pre-installed. This server already uses port 80 and you must disable the apache
    process from starting on system setup or use another port number (e.g., port 8080).
    Both approaches are described in chapter 4. Finally, in Ubuntu systems the -t
    option must be used to start the cherokee-admin program:


    ```

    $ sudo cherokee-admin -b -t

    ```


    In chapter 3, you will test Web pages from another computer on your LAN.


    ![](img/5bf591327968a4c0190eb6adbf83042b_33_0.png)


    In chapter 5, you will test your Web pages from another computer on the Internet
    using online network tools.


    ![](img/5bf591327968a4c0190eb6adbf83042b_33_1.png)


    ## Chapter 3 Operating System Configuration


    ### Assigning a Private, Static IP Address to the Server


    You must assign a static IP address for your Web server. Let''s use as an example
    the IP address 192.168.1.101. This is a private IP address. An IP address that
    is private is an IP address that is valid only for your LAN. The previous address
    is a random IP address from the private network 192.168.1.0. Routers by convention
    use this address to reference a private network of Class C, which is the most
    common IP (Internet Protocol) network class. Another private network commonly
    used is network 192.168.0.0. IP addresses can also be static, which means that
    the IP address will not change until it is manually changed by the system administrator.


    A home router typically uses DHCP (Dynamic Host Configuration Protocol) to dynamically
    assign IP addresses that change after a period of time, typically in the order
    of days. With a static IP address, you can configure the Cherokee server remotely
    and be able to test the server from the other nodes of the LAN. In addition to
    and certainly more importantly, you can designate in the router''s configuration
    the static IP address of the server as the server responsible for handling HTTP
    (HTTP stands for Hyper Text Protocol, the protocol for the Wide Web).


    In order for the server to be visible from clients across the Internet, the server
    must have an associated public IP address. This associated IP address is the public
    IP address, the address of the Internet-facing interface of the router of the
    server''s LAN. By using the router''s Virtual server service (which is discussed
    in Chapter 5), every HTTP request destined for the router is forwarded by the
    router to the Cherokee server. In the following image, the Web server is a host
    of 192.168.1.101. The Web server will be accessible in the Internet by using the
    IP address of the router, 94.69.219.68. The router has the private IP address
    102.168.1.1, which allows the router to be reachable from the inside.


    ![](img/5bf591327968a4c0190eb6adbf83042b_37_0.png)


    In order to designate a computer on your LAN as the Web server (as explained in
    chapter 5), this computer must use a static IP address. You must disable DHCP
    and manually configure the server''s static IP address, with the Netmask, Gateway,
    and DNS parameters.


    For Ubuntu Linux, click on the Start button and select Preferences and then Network
    Connections. Click the Add button to add a new connection. At the dialogue window
    that appears, select Ethernet in the Connection Type drop-down. Click next at
    the Create button.


    ![](img/5bf591327968a4c0190eb6adbf83042b_38_0.png)


    In the dialogue window that appears, enter the connection name, e.g. Ethernet
    IP in the Connection name text box and click on the IPv4 Settings tab. In the
    Method drop-down menu, select Manual (by default, the option is set as DHCP).


    Click the Add button to edit the Address, Netmask and Gateway fields.


    Enter the following values:


    Address: 192.168.1.101


    This is the IP address that we wish to assign to the Cherokee server.


    Netmask: 255.255.255.0


    The Netmask (Network mask) field, indicates how the IP address is divided into
    a network portion and a host portion. A netmask value of 255.255.255.0 indicates
    that the first three bytes of the IP address specify the network and the fourth
    byte specifies the host.


    Gateway: 192.168.1.1


    Gateway is another name for your router. Enter the private IP address of the router,
    the IP address of the router on its internal interface. Certainly the router also
    has a public IP which is valid for the whole Internet. In this example, the router''s
    private IP is 192.168.1.1.


    Enter the private IP address of the router again to the DNS servers (Domain Name
    System servers) field:


    DNS servers: 192.168.1.1

