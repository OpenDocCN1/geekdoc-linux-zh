    # The Virtual Servers Section of the Administration Panel


    The next section to be discussed is vServers, which stands for Virtual Servers.
    Cherokee can support multiple Web servers, called Virtual Servers, which can run
    simultaneously. Each virtual server may have a different domain name, support
    different sites and utilize different tools. Even if you don''t want to create
    multiple virtual servers, you will still use the default virtual server. This
    virtual server, named default, will exist in every Cherokee.


    On the Basics tab of Servers, you can configure your Web site''s Document Root
    directory. The directory from which Cherokee will serve files. For example, if
    the Document Root is /var/www, then a client''s request for http://www.example.com/index.html
    refers to /var/www/index.html. As can be seen in the previous image, the Document
    Root defaults either to /var/www or /usr/local/www/ for Ubuntu. If we wish to
    change the Document Root directory, the path of the new directory can be entered
    in the Document Root textbox.


    ![](img/5bf591327968a4c0190eb6adbf83042b_52_0.png)


    The Directory Indexes text field sets the directory index. The directory index
    indicates the list of files to send when the client requests a URL with a forward
    slash (/) at the end of the domain name (e.g., http://webserver.dynu.com/). A
    common name for the directory indexes file is index plus the corresponding file
    name extension (e.g., index.html, index.php). If the directory index is set to
    index.html, the previous URL becomes equivalent of:


    http://webserver.dynu.com/index.html


    In the Logging tab, you can configure the logging for your Cherokee server (e.g.,
    which two filenames to use for error and access logging). The Error Logging and
    the Access Logging file names can also be changed from their default.


    To enable the Access Logging at the Format drop-down menu, select Apache compatible
    instead of the default (None). In the Filename textbox, select a new name and
    path for the log file. You can also leave the default. In the Time standard drop-down
    menu, select either Local time or UTC (Coordinated Universal Time).


    If the default access log location was not changed from its default location,
    you can review the Access Logging file with the following command:


    $ sudo more /usr/local/var/log/cherokee.log


    The output for the example, shown in the following image, shows records with information
    about Web client connections to the server. The information includes the IP Address,
    the time of access, the URL requested by the client, the client''s browser, and
    the client''s OS. For instance:


    50.22.90.226 - - [13/Feb/2015:17:24:43 +0200] "GET /HTTP/1.1" 200 251 "-" "Mozilla/ila/5.0
    (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/40.0.2214.93
    Safari/537.36"


    ![](img/5bf591327968a4c0190eb6adbf83042b_53_0.png)


    ![](img/5bf591327968a4c0190eb6adbf83042b_53_1.png)


    You can also configure the error logging by selecting index in the drop-down menu
    and specifying a filename in the Filename textbox. The options are Standard, Execute,
    Disabled.


    Chapters 8 through 12 contain many examples of creating and running virtual servers.
    Those chapters also discuss the vServers section.


    # Visible from the Internet


    At this point, the Cherokee server is running but it is only visible from your
    LAN. In this chapter, you make the step to allow your server to be available from
    the whole Internet. It is assumed that your router currently uses NAT (Network
    Address Translation) to allow each computer on your LAN to masquerade as the router.
    With the Virtual Server router option, the router administrator can register a
    port number on which a given computer will be responsible for listening. For example,
    if you wish to use a computer on our LAN with IP address 192.168.1.200 as your
    Web server that uses port 80 and a second computer 192.168.1.110 as a second Web
    server that uses port 8080, and you assign in the Virtual Server settings port
    80 to the IP address 192.168.1.200 and you assign port 8080 to the IP address
    192.168.1.110. After making this configuration change, when the client connects
    to webserver.dynu.com:80 (or simply webserver.dynu.com since the request is sent
    to the router''s public IP address (e.g., 94.69.235.77) since this is the corresponding
    IP address of webserver.dynu.com, the router passes the request to the server
    with IP address 192.168.1.200, according to the Virtual Server tables. Similarly,
    a connection to webserver.dynu.com:8080 will be passed to the server with IP address
    192.168.1.110.


    # The Virtual Server Router Option


    The public IP address of the router can be either static or dynamic. For a static
    IP, you have the option of registering a domain name that corresponds to this
    IP via the DNS system. For a dynamic IP, which is more common and less expensive,
    you can use a domain name (typically for free) allocated from DDNS (Dynamic DNS)
    provider. DDNS is explained in the next chapter.

