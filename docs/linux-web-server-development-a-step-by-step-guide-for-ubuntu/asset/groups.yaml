    # ## A simple HTML page


    Through the examples in the next chapters, you run multiple virtual servers, sometimes
    simultaneously. To differentiate the content provided by each server, you can
    use single-colored pages. To paint the web page background with a specific color,
    use the `bgcolor` attribute of the `<body>` tag with a value that corresponds
    to the color name.

    For example, to create a green-colored page, use the following simplified code:


    ```

    <html>

    <head>

    <title>A Green page</title>

    </head>

    <body bgcolor="green">

    </body>

    </html>

    ```


