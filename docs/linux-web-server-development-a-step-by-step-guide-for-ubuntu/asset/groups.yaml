    # Inserting Data to the Database from the Command Line


    Use the **insert** command to insert three records into the books table. Recall
    that the field book_id is auto incremented and you don''t have to enter book_id
    values.


    ```

    mysql> insert into books (title, author) values (''Waving The Web'', ''Tim Berners
    Lee'');

    mysql> insert into books (title, author) values (''Just for Fun'', ''Linus Torvalds'');

    mysql> insert into books (title, author) values (''How the Web was Born'', ''Gillies
    & Cailliau'');

    ```


    To view the three records, use the **select** command. You can specify the records
    to view or you can select any record by using the star ''*'' wildcard:


    The output is shown below:


    ```

    mysql> select * from books;

    +-----------+--------------------------+----------------+

    | book_id   | title                    | author           |

    +-----------+--------------------------+----------------+

    | 1 | Weaving The Web         | Tim Berners Lee  |

    | 2 | Just for Fun             | Linus Torvalds   |

    | 3 | How the Web was Born     | James Gillies and Robert Cailliau |

    +-----------+--------------------------+----------------+

    3 rows in set (0.07 sec)

    ```


    # Querying the Database from the Command Line


    You can use the select command to query the database. Perform a specific query
    that you will repeat also from the online network tool that will query remotely
    the database in your site. For, view the title and author of the books that include
    the keyword Web.


    ```

    mysql> select title, author from books where title like "%Web%"

    ```


    The SQL like operator is used in the where clause to search for a specific pattern
    in a field. In the previous example, like is used with the % wildcard character,
    which matches any sequence of characters or none. Another wildcard character,
    the underscore _ matches exactly one character. The query result is therefore
    any pair of title and author, where the title includes the Web keyword.


    As expected, two titles of the database include the Web keyword:


    ```

    mysql> select title, author from books where title like "%Web%"

    +------------------------------------------------+

    | title | author |

    +------------------------------------------------+

    | Weaving The Web | Tim Berners Lee |

    | How the Web was Born | James Gillies and Robert Cailliau |

    +------------------------------------------------+

    2 rows in set (0.02 sec)


    mysql>

    ```


    To exit MySQL enter:


    ```

    mysql> \c

    ```


    and then:


    ```

    mysql> exit

    ```


    # Creating the PHP-enabled Virtual Server


    In a Linux terminal, start cherokee-admin:


    ```

    $ sudo cherokee-admin -b

    ```


    Open your browser from any computer of your LAN and enter in the address bar:

    http://192.168.1.101:9090


    where 192.168.1.101 is the private IP address of the Web server.


    At the dialogue window that appears provide admin as Username and the one-time
    password returned by the cherokee-admin output at the Password field to enter
    the Cherokee administration panel.


    In the vServers section, click the Add New Virtual Server button (the blue plus
    sign button) to create a new virtual server. In the Add New Virtual Server dialogue
    window, enter a nickname for the server (e.g., Bookstore) and provide the document
    root (/var/www6), which was previously created with the following command:


    ```

    $ sudo mkdir /var/www6

    ```


    Click the Add button.


    In the Basics tab, enter index.php in the Directory Indexes textbox. In the Host
    Match, select the Server IP option of the Method drop-down menu. Click the Add
    new IP/Subnet button that appears and in the dialogue window, enter the private
    IP address of the Web server (e.g., 192.168.1.101). Click the Add button.


    In the Behavior tab, click the Rule Management button to view the new set of tabs
    (Rule, Handler, etc.). Click the Add Behavior Rule button (the blue plus sign
    button in the upper-left area of the panel). In the new dialogue window, click
    Languages to the left and select PHP to the right.


    Click the Add button in the window and in the new window with the caption Configuration
    Assistant that appears, click on the Create button. In the newly created rule,
    Extensions PHP, that appears in the list on the left, click on the NON-FINAL button.
    The FastCGI option now appears in the Handler drop-down menu in the Handler tab.
    Click the SAVE button and click Graceful restart in the next dialogue window.


    The new PHP-enabled virtual server that can make connections to the MySQL server
    is now ready. The PHP pages you create next will be placed in the directory /var/www6.


    # Creating a PHP page with a Form


    To allow the client to query your database, you must provide her a web page with
    a form, where she can type the keywords and send them to the database. One can
    easily establish a connection to MySQL with PHP. This simplicity makes PHP an
    attractive option.


    Create a PHP enabled Cherokee virtual server following the steps described in
    the previous paragraph. Move this virtual server to the top of the Virtual Servers
    list in the vServers section using the double arrow. Create a directory index
    for this virtual server (e.g., index.php). This file will implement an HTML form
    that includes a text box for entering the keyword and the Submit button to send
    data from the client''s computer to your PHP virtual server and eventually to
    the database.


    The action parameter in the <form> tag specifies the program on the server side
    that will receive the client''s data and return the result back to the client.
    Set this to database.php. This is another php file that you will create in the
    same directory as index.php. database.php will connect to the MySQL server and
    perform the query on the string passed by the client and generate the results.

