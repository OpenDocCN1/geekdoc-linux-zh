    A summary of the Hypertext Transfer Protocol header for this packet is listed
    next:


    Hypertext Transfer Protocol

    GET / HTTP/1.1

    Host: 802.110.63:8080

    Connection: keep-alive

    Pragma: no-cache

    Cache-Control: no-cache


    Accept: text/html,application/xml+application/xml;q=0.9,image/webp/*;q=0.8

    User-Agent: Mozilla/5.0 (X11; Linux; x86_64) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/39.0.2171.95 Safari/537.36

    Accept-Encoding: gzip, deflate

    Accept-Language: en-US,q=0.8


    Full request URI: http://802.110.63:8080/

    HTTP request 1/2

    Response in frame: 75

    Next request in frame: 88


    Compare the Host value in the selected packet with the packet saved previously.
    Note that the Host value in the first packet that was saved (when port forwarding
    was disabled) is exactly the same as the packet sent by the client. This is:

    Host: webserver.dynu.com:8080

    where \r is the Carriage Return and \n the Line Feed characters, used as separators
    in the HTTP header fields.


    When port forwarding is enabled, the port forwarding server alters the Host field
    as sent by the client and replaces it with the public IP address of the router
    concatenated with the port number, e.g.:802.110.63:8080. In that case the Host
    field does not indicate the server''s domain name and you cannot use Matchname
    option to separate the two virtual servers based on the domain name. Therefore
    to use Matchname option, we must disable Port Forwarding for the domains.


    ## Schematic Overview of the Port Forwarding Service


    The next figures show how the connection request is formed at the Web client.
    When using the HTTP network tool (e.g., websniffer.net), the tool acts as a Web
    client and queries the DDNS server to resolve the Web''s domain name to an IP
    address and then sends a request to the Web server. It is recommended to use the
    tool twice – once with port forwarding enabled and once with port forwarding disabled.


    With port forwarding enabled, the URL used by the online tool is: http://webserver.dynu.com
    As described in the following image, the DDNS server, contacted by the online
    tool (1), resolves this URL to the IP address of the Port Forwarding server. The
    network tool acts as a client and sends a connection request to the Port Forwarding
    Server (2), which redirects the client to the IP address of the Web server’s LAN.
    The redirected address includes the appropriate port (e.g., port 8080) and, in
    this case, the redirected address becomes <router’s public IP address>:8080. The
    client then connects to the router and with Virtual Servers configuration, the
    client eventually connects to the Web Server (3).


    With port forwarding disabled, the URL used in the online tool to make a request
    from the Web server is webserver.dynu.com:8080. This time, the DDNS system (1)
    resolves the Web server’s domain name to the IP address of the Web server’s router
    and the router, with its Virtual Servers service, redirects the request to the
    Web Server (2). In this case, Port Forwarding was not interfered with and the
    Host field in the packet remained unchanged.


    | Web Client (Online Network Tool) | |

    |---|---|

    | I | Port Forwarding enabled: Host: webserver.dynu.com |

    | II | Port Forwarding disabled: Host: webserver.dynu.com:8080 |


    | Internet DDNS Server Web Server | |

    |---|---|

    | I | Port Forwarding enabled: Host: <IP address:8080> |

    | II | Port Forwarding disabled: Host: webserver.dynu.com:8080 |


    When port forwarding is enabled, the Host field in the packet captured by Wireshark
    has already been altered by the Port Forwarding server of the DDNS system. The
    server’s domain name has been replaced by the public IP address of the server’s
    router. The Matchname option of the Host tab cannot be used in this to match the
    virtual server because the Host field of the packet does not contain the server’s
    domain name (e.g., webserver.dynu.com) but instead contains the <router’s public
    IP address>:port number.


    ## Creating the First Virtual Server


    We must create two new virtual servers, one for the domain name *christos.dynu.com*
    and one for the domain name *webserver.dynu.com*. For the reason discussed in
    the previous section, visit the DDNS service provider’s site and disable Port
    Forwarding for both domain names before creating the servers. Also disable any
    other virtual servers that could respond (and therefore interfere with) the client’s
    request. Set the handler of the *default* server to *None*.


    First create a new Document Root Directory.


    ```

    $ sudo mkdir /var/www4

    ```


    Create the file *index.html*, a simple HTML page with a non-white background,
    in the wwww4 directory.


    In the *vServers* section, click the *Add New Virtual Server* button (the blue
    plus sign button) in the upper-left area of the Cherokee Administration Panel.
    In the *Nick* text field of the dialogue window, enter christos.dynu.com, which
    is the first domain registered in this book. Also enter the directory you just
    created in the Document Root text field (/var/www4). Click the Add button to confirm
    the settings.


    Click next on the new virtual server in the server list in the left area of the
    window to apply other settings to the new virtual server. In the Basics tab, enter
    the filename index.html in the Directory Indexes text field.


    In the Host Match tab, select the option Matchname from the Method drop-down menu.

