- md: "\n# Pingdom Website Speed Test\n\nEnter a URL to start the speed test of any\
    \ page, analyze it and test benchmarks.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_113_0.png)\n\
    \n未识别\n\n## Chapter 10 Virtual Server for Both Dynamic and Static Content\n\n\
    ### Implementing Multiple Rules\n\nWe next enable the PHP Server to also provide\
    \ static HTML site. A new Document Root for the static content was previously\
    \ created:\n\n```\n$ sudo mkdir /var/www2/www\n```\n\nRecall the file /var/www2\
    \ was set as the document root for the PHP Server.\n\nUsing gedit or another editor,\
    \ create the file index.html in the www directory:\n\n```\n$ sudo gedit /var/www2/www/index.html\n\
    ```\n\nEnter the following HTML code in index.html:\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html\"\
    \n charset=\"utf-8\"/>\n<title>Cherokee Server</title>\n</head>\n<body bgcolor=\"\
    yellow\">\n</body>\n</html>\n```\n\nNext, add the new directory to the Directory\
    \ Indexes textbox of the virtual server, separating the two Directory Indexes\
    \ with a comma:\n\n```\nindex.php, www/index.html\n```\n\nClick the Behavior tab\
    \ and click the Rule Management button. Here you will create a rule for managing\
    \ static HTML content. Click the Add Behavior Rule button, the button with a blue\
    \ plus sign in the upper-left area of the window.\n\nIn the dialogue window that\
    \ appears, select Extensions in the Rule Type drop-down menu and enter html in\
    \ the Extensions check box. Click the Add button.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_118_0.png)\n\
    \nThe new rule, called Extensions html, appears in the rule list in the left area\
    \ of the Administration Panel:\n\n![](img/5bf591327968a4c0190eb6adbf83042b_118_1.png)\n\
    \n```\n/var/www2/www\n```\n\n![](img/5bf591327968a4c0190eb6adbf83042b_120_0.png)\n\
    \nClick the SAVE button to confirm the changes and then click the Graceful Restart\
    \ button to commit the changes.\n\n## Testing the Extended tool\n\nUsing the online\
    \ network tool tools.pingdom.com, you'll test your site. Enter the URL webserver.dynu.com\
    \ in the text field. The Directory index of the PHP Server (index.php) is dispatched,\
    \ as previously described in Chapter 9. Run the test for a second time and enter\
    \ the URL webserver.dynu.com/index.html. This time the Static Server provides\
    \ the new colored page index.html that we created in this section.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_120_1.png)\n\
    \n### Using Logical Operators with the Cherokee Rules\n\nNext, modify the Extensions\
    \ html rule to create a compound rule with two rules combined with the AND logical\
    \ operator. Cherokee provides three logical operators to combine rules: AND, OR\
    \ and NOT. The rule handler remains the same as with Extensions html. When a request\
    \ for a file with extension html arrives on port 8080, the handler Static Content\
    \ responds with the directory index (which is an HTML file).\n\nSelect the Rule\
    \ tab and click on the Extension html rule in the list to modify this rule. Click\
    \ the AND button and a new Rule Type menu appears. Select rule type Incoming IP/Port\
    \ and then Port 8080 in the Incoming IP/Port menu. Click the SAVE button and restart\
    \ the server. The compound rule, called Extensions AND Port 8080 is activated.\n\
    \n![](img/5bf591327968a4c0190eb6adbf83042b_121_0.png)\n\nTo ensure that a request\
    \ that breaks this rule will not be saved, disable the Default rule. The rule\
    \ list in the Handler tab, click Default and select the option None in the Handler\
    \ menu. This will reject, for example, a request for index.html on port 8181.\n\
    \nTo test the new rule, use the online network tools.ping.com. This time, you\
    \ can use the public IP address of the router to test the server. Find your current\
    \ IP address with an online tool or just find my ip in the Google search textbox.\
    \ Your current IP address, for example 87.202.110.63, will be displayed. In the\
    \ Test Now textbox field of tools.ping.com, enter:\n\n```\n87.202.110.63:8080/index.html\n\
    ```\n\nClick on the Test Now button to view the results. The following page is\
    \ dispatched:\n\n![](img/5bf591327968a4c0190eb6adbf83042b_122_0.png)\n\nRun the\
    \ test once more. This time, use port number 8181 (which does not satisfy the\
    \ second condition of the compound rule):\n\n87.202.110.63:8181/index.html\n\n\
    The result is displayed below:\n\n![](img/5bf591327968a4c0190eb6adbf83042b_122_1.png)\n\
    \nClick on the browser's window to zoom in. The HTTP 405 Error message (Method\
    \ Not Allowed) is displayed.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_123_0.png)\n\
    \n## Chapter 11 Using Multiple Domain Names\n\nA virtual server was configured\
    \ in the previous chapter to provide two rules for different content types (html\
    \ and php). In this chapter we will configure a server to provide two rules: one\
    \ that accepts connections on port 8080 and one rule that accepts connections\
    \ on port 8181. Recall that we now have two registered DDNS domains:\n\n- webserver.dynu.com\
    \ that uses port forwarding on port 8080\n- christos.dynu.com that uses port forwarding\
    \ on port 8181\n\nFor a given request for a resource, Cherokee will look in its\
    \ rules for a match with the requested domain name.\n\n### Applying Multiple Rules\n\
    \nIn the vServers section of the Cherokee Administration Panel, click on the Add\
    \ New Virtual Server (the blue plus sign button). In the dialogue window that\
    \ appears, enter in the New textbox One Server with Two domains and in the Document\
    \ Root textbox the value /var/www3. Click on the Add button. In the Basics tab\
    \ of the vServers section, enter index.html in the Directories textbox.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_126_0.png)\n\
    \nClick the Host match and in the Method drop-down menu, select Server IP. Click\
    \ the Add Subnet and in the dialogue window, enter the private IP (e.g., 192.168.1.101)\
    \ and click the Add button.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_127_0.png)\n\
    \nThe server's private IP is now reflected. Next the Behavior tab and click the\
    \ Rule Management button. In the left area of the Administration Panel, you can\
    \ find the predefined rules.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_127_1.png)\n\
    \nTo delete the predefined rules, click the 'x' to the right of the rule names.\
    \ Click again on the Add Behavior button (the blue plus sign at the upper-left\
    \ area). In the dialogue window, in the Rule Type drop-down menu, select Incoming\
    \ IP/Port and choose one of the ports the server listens, namely 8080, in the\
    \ Incoming IP/Port drop-down menu. Click the Add button.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_128_0.png)\n\
    \nThe Rule tab reflects those settings and allows you to change them.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_128_1.png)\n\
    \nIn the Handler tab, select Server Info.\n\nWe need another rule. Click again\
    \ on the Add Behavior button. In the dialogue window, in the Rule Type drop-down\
    \ menu, select Incoming IP/Port again and choose the other port number, 8181.\
    \ Click the Add button.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_129_0.png)\n\
    \nIn the Handler tab, select Only Listing.\n\nFinally, click the SAVE button in\
    \ the upper-left area of the window and then select Graceful restart in the dialogue\
    \ window.\n\n## Testing the Virtual Server using multiple URLs\n\nTo test your\
    \ virtual server, you will use tools.pingdom.com again. Before you start the test,\
    \ remember to enable port forwarding for the two domain names. In the previous\
    \ examples this would be port 8080 for webserver.dynu.com and port 8181 for christos.dynu.com.\
    \ In the text field, enter webserver.dynu.com. Click on the Test Now button to\
    \ start the test.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_130_0.png)\n\nThe\
    \ result includes information about the Web server.\n"
  mdcn: "\n\n# Pingdom 网站速度测试\n\n输入 URL 开始任何页面的速度测试，对其进行分析并基准测试。\n\n![](img/5bf591327968a4c0190eb6adbf83042b_113_0.png)\n\
    \n未识别\n\n## 第 10 章 同时用于动态和静态内容的虚拟服务器\n\n### 实现多条规则\n\n接下来我们将启用 PHP 服务器也提供静态 HTML\
    \ 站点。之前已为静态内容创建了一个新的文档根（Document Root）：\n\n```\n$ sudo mkdir /var/www2/www\n```\n\
    \n记得 `/var/www2` 已设置为 PHP 服务器的文档根。\n\n使用 gedit 或或其他编辑器，在 `www` 目录中创建 `index.html`\
    \ 文件：\n\n```\n$ sudo gedit /var/www2/www/index.html\n```\n\n在 `index.html` 中输入以下\
    \ HTML 代码：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta http-equiv=\"\
    Content-Type\" content=\"text/html\"\n charset=\"utf-8\"/>\n<title>Cherokee Server</title>\n\
    </head>\n<body bgcolor=\"yellow\">\n</body>\n</html>\n```\n\n接下来，在虚拟服务器的 Directory\
    \ Indexes（目录索引）文本框中添加新目录，用逗号分隔两个目录索引：\n\n```\nindex.php, www/index.html\n```\n\
    \n点击 Behavior（行为）选项卡并点击 Rule Management（规则管理）按钮。在这里，你将创建一个用于管理静态 HTML 内容的规则。点击\
    \ Add Behavior Rule（添加行为规则）按钮，即窗口左上角带有蓝色加号的按钮。\n\n在弹出的对话框中，在 Rule Type（规则类型）下拉菜单中选择\
    \ Extensions（扩展名），并在 Extensions 复选框中输入 `html`。点击 Add（添加）按钮。\n\n![](img/5bf591327968a4c0190eb6adbf83042b_118_0.png)\n\
    \n新规则名为 `Extensions html`，它将出现在管理面板左侧区域的规则列表中：\n\n![](img/5bf591327968a4c0190eb6adbf83042b_118_1.png)\n\
    \n```\n/var/www2/www\n```\n\n![](img/5bf591327968a4c0190eb6adbf83042b_120_0.png)\n\
    \n点击 SAVE（保存）按钮确认更改，然后点击 Graceful Restart（软重启）按钮提交更改。\n\n## 测试扩展工具\n\n使用在线网络工具\
    \ tools.pingdom.com 测试你的站点。在文本字段中输入 URL `webserver.dynu.com`。如第 9 章之前所述，PHP 服务器的目录索引（`index.php`）将被分发。再次运行测试并输入\
    \ URL `webserver.dynu.com/index.html`。这一次，静态服务器将提供我们在本节中创建的新型彩色页面 `index.html`。\n\
    \n![](img/5bf591327968a4c0190eb6adbf83042b_120_1.png)\n\n### 在 Cherokee 规则中使用逻辑运算符\n\
    \n接下来，修改 `Extensions html` 规则，创建一个通过 AND 逻辑运算符组合的两个规则的复合规则。Cherokee 提供了三个逻辑运算符来组合规则：AND、OR\
    \ 和 NOT。规则处理器与 `Extensions html` 相同。当在端口 8080 上接收到对扩展名为 `html` 的文件的请求时，句器 Static\
    \ Content（静态内容）将响应目录索引（这是一个 HTML 文件）。\n\n选择 Rule（规则）选项卡并点击列表中的 `Extension html`\
    \ 规则以修改该规则。点击 AND 按钮，出现一个新的 Rule Type 菜单。选择规则类型 Incoming IP/Port（入站 IP/端口），然后在\
    \ Incoming IP/Port 菜单中选择 Port 8080。点击 SAVE 按钮并重启服务器。名为 `Extensions AND Port 8080`\
    \ 的复合规则被激活。\n\n![](img/5bf591327968a4c0190eb6adbf83042b_121_0.png)\n\n为了确保不符合此规则的请求不会被保存，请禁用\
    \ Default（默认）规则。在 Handler（处理器）选项卡的规则列表中，点击 Default 并在 Handler 菜单中选择 None。这将拒绝例如对端口\
    \ 8181 上的 `index.html` 的请求。\n\n要测试新规则，请使用在线网络 tools.ping.com。这一次你可以使用路由器的公 IP\
    \ 地址来测试服务器。使用在线工具查找当前的 IP 地址，或直接在 Google 搜索框中输入 \"find my ip\"。将显示你当前的 IP 地址，例如\
    \ `87.202.110.63`。在 tools.ping.com 的 Test Now 文本字段中输入：\n\n```\n87.202.110.63:8080/index.html\n\
    ```\n\n点击 Test Now 按钮查看结果。将分发以下页面：\n\n![](img/5bf591327968a4c0190eb6adbf83042b_122_0.png)\n\
    \n再次运行测试。这一次，使用端口号 8181（它不满足复合规则的第二个条件）：\n\n87.202.110.63:8181/index.html\n\n\
    结果显示在：\n\n![](img/5bf591327968a4c0190eb6adbf83042b_122_1.png)\n\n点击浏览器窗口进行放大。显示\
    \ HTTP 405 错误信息（Method Not Allowed，方法不允许）。\n\n![](img/5bf591327968a4c0190eb6adbf83042b_123_0.png)\n\
    \n## 第 11 章 使用多个域名\n\n在上一章中配置了一个虚拟服务器，为不同类型的内容（html 和 php）提供两条规则。在本章中，我们将配置服务器提供两条规则：一个是接受端口\
    \ 8080 连接的规则，另一个是接受端口 8181 连接的规则。记得我们现在有两个注册的 DDNS 域名：\n\n- `webserver.dynu.com`，使用端口\
    \ 8080 的端口转发\n- `christos.dynu.com`，使用端口 8181 的端口转发\n\n对于给定的资源请求，Cherokee 将在其规则中查找与请求域名匹配的项。\n\
    \n### 应用多条规则\n\n在 Cherokee 管理面板的 vServers 部分，点击 Add New Virtual Server（添加新虚拟服务器，即蓝色加号按钮）。在弹出的对话框中，在\
    \ New 文本框输入 `One Server with Two domains`，并在 Document Root 文本框中输入值 `/var/www3`。点击\
    \ Add 按钮。在 vServers 部分的 Basics 选项卡中，在 Directories 文本框中输入 `index.html`。\n\n![](img/5bf591327968a4c0190eb6adbf83042b_126_0.png)\n\
    \n点击 Host match并在 Method 下拉菜单中选择 Server IP。点击 Add Subnet，对话框中输入私有 IP（例如 192.168.1.101）并点击\
    \ Add 按钮。\n\n![](img/5bf591327968a4c0190eb6adbf83042b_127_0.png)\n\n现在反映了服务器的私有\
    \ IP。进入 Behavior 选项卡并点击 Rule Management 按钮。在管理面板左侧区域你可以找到预定义的规则。\n\n![](img/5bf591327968a4c0190eb6adbf83042b_127_1.png)\n\
    \n要删除预定义规则，点击规则名称右侧的“x”。再次点击 Add Behavior 按钮（左上角的蓝色加号）。在对话框中，在 Rule Type 下拉菜单中选择\
    \ Incoming IP/Port，并在 Incoming IP/Port 下拉菜单中选择服务器监听的端口之一，即 8080。点击 Add 按钮。\n\n\
    ![](img/5bf591327968a4c0190eb6adbf83042b_128_0.png)\n\nRule 选项卡反映了这些设置并允许你更改。\n\
    \n![](img/5bf591327968a4c0190eb6adbf83042b_128_1.png)\n\n在 Handler 选项卡中选择 Server\
    \ Info。\n\n我们需要另一条规则。再次点击 Add Behavior 按钮。在对话框中，在 Rule Type 下拉菜单中再次选择 Incoming\
    \ IP/Port，并选择另一个端口 8181。点击 Add 按钮。\n\n![](img/5bf591327968a4c0190eb6adbf83042b_129_0.png)\n\
    \n在 Handler 选项卡中选择 Only Listing。\n\n最后，点击窗口左上角的 SAVE 按钮，然后在对话框中选择 Graceful restart。\n\
    \n## 使用多个 URL 测试虚拟服务器\n\n要测试你的虚拟服务器，你将再次使用 tools.pingdom.com。在开始测试之前，记得启用两个域名的端口转发。在之前的示例中，这将是\
    \ webserver.dynu.com 的端口 8080 和 christos.dynu.com 的端口 8181。在文本字段中输入 `webserver.dynu.com`。点击\
    \ Test Now 按钮开始测试。\n\n![](img/5bf591327968a4c0190eb6adbf83042b_130_0.png)\n\n\
    结果包含了有关 Web 服务器的信息。\n\n"
