    | tcp | 0 | 0 | 0:server:domain | *:* | LISTEN | 905/dnsmasq |

    | tcp | 0 | 0 | 0:localhost:ipp | *:* | LISTEN | 601/cupsd |

    | tcp6 | 0 | 0 | [::]:http | [::]:* | LISTEN | 28928/apache |

    | tcp6 | 0 | 0 | ipv6-localhost:ipp | [::]:* | LISTEN | 601/cupsd |


