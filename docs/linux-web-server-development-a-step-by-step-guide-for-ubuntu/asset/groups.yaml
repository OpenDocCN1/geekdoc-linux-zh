- md: "\nThe URL:\n\nhttp://cherokee-project.com/doc/config_virtual_servers_rule_types.html\n\
    \ndescribes the rule types.\n\nIn the Handler tab, you set the handler for the\
    \ rule that is currently selected from the list. You can select one of the following\
    \ rule handlers:\n\n- None\n- List & Send\n- Static Content\n- Only listing\n\
    - Redirection\n- CGI Execution\n- FastCGI Server Support\n- SCGI Server Support\n\
    - uWSGI Server Support\n- HTTP Reverse Proxy\n- Audio/Video streaming\n- Server\
    \ Side Includes\n- Hidden Downloads\n- MySQL Bridge\n- HTTP Error\n- 1x1 Transparent\
    \ GIF\n- Server Info\n- Remote Administration\n\n## The URL:\n\nhttp://cherokee-project.com/doc/config_virtual_servers_rule.html\n\
    \nTo continue with the example of the current section, the virtual server with\
    \ the name webserver.dynu.com was selected. This includes two rules and the Default.\
    \ For the two rules, rule type Extensions were selected; html was used for the\
    \ first and htm was used for the second. Furthermore, handler List & Send was\
    \ selected for the first and Only Listing for the second. The Default rule cannot\
    \ be assigned any rule type but the handler can be set. We assume this is set\
    \ to None and the Default rule of the default server is also set to None.\n\n\
    By entering the following URL at the browser's address field:\n\nhttp://webserver.dynu.com/info.html\n\
    \nthe virtual server dispatches the web page info.html to the client's browser.\
    \ The rule that applies in this case is List & Send, therefore the web page can\
    \ be submitted.\n\nBy entering the following URL:\n\nhttp://webserver.dynu.com/info.html\n\
    \nthe result is an HTTP error message 404. This is the Not Found error message\
    \ and is caused by the fact that Only Listing was selected as the handler that\
    \ applies here.\n\nIf index.htm is set as the directory index in the request:\n\
    \nhttp://webserver.dynu.com\n\nlists the document root directory (the directory\
    \ where index.htm is found).\n\nIf index.html is set as the directory index, the\
    \ request:\n\nhttp://webserver.dynu.com\n\nsends the page index.html to the client\
    \ browser.\n\nBy entering the following URL:\n\nhttp://webserver.dynu.com/about.pdf\n\
    \nthe result is the HTTP error message 405 (Method Not Allowed).\n\n![](img/5bf591327968a4c0190eb6adbf83042b_94_0.png)\n\
    \n## Basic Steps to Create a Virtual Server\n\nYou create next a virtual server\
    \ that dispatches static (HTML) content. At the vServers section of the Administration\
    \ Panel, click on the Add New Virtual Server button, the button with the blue\
    \ plus sign at the upper-left area of the Cherokee window.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_95_0.png)\n\
    \nAt the dialogue window that appears, enter the nickname HTML Server at the Nick\
    \ text field and the directory /var/www1 at the Document Root field. Cherokee\
    \ will serve files from this directory, for your virtual server.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_95_1.png)\n\
    \nBefore clicking the Add button, open a terminal window and enter the following\
    \ command to create directory /var/www1:\n\n$ sudo mkdir /var/www1\n\nUsing edit\
    \ or any other text editor, edit index.html:\n\n$ sudo edit index.html\n\nThe\
    \ HTML source code of index.html is the following:\n\n```\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html;charset=utf-8\"\
    />\n<title>Cherokee Server</title>\n</head>\n<body bgcolor=\"orange\">\n```\n\n\
    Return to the Administration Panel and click Add.\n\nThe new server is added in\
    \ the Virtual Server list in the left area of the vServers section. To be certain\
    \ that the correct server is being configured, verify the virtual server's name\
    \ directly above the tags. If this is not the case, click on the server name in\
    \ the servers' list.\n\n## Configuring the Basics Tab\n\nIn the Basics tab, enter\
    \ the filename index.html in the Directory Indexes text field. The Directory Indexes\
    \ text field sets list of file names to search for when the client requests an\
    \ index of a directory by specifying a forward-slash (/) at the end of the directory\
    \ name. We click on the SAVE button in the upper-right area of the panel. The\
    \ Administration Panel asks whether a computer restart is desired. A restart is\
    \ necessary to apply the new changes. Click the Graceful restart button in the\
    \ dialogue window that appears.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_96_0.png)\n\
    \n## Configuring the Host Match tab\n\nNext, click on the Host Match tab, where\
    \ there are four available methods. From the Method drop-down menu, select the\
    \ Server IP option. Click the Add new IP/Subnet button and in the dialogue window\
    \ that appears the Web server's private IP address in the text field. In the following\
    \ example, the address 192.168.1.101 is used. Click the Add button. The IP or\
    \ subnet textbox reflects now the server's private IP address.\n\nWith the previous\
    \ configuration any client request that receives to the server on a packet with\
    \ destination address 192.168.1.101 will be accepted.\n\n## Configuring the Behavior\
    \ Tag\n\nClick the Behavior tab of the vServers section to apply the rules for\
    \ the virtual server. Click on the Rule Management button and a new set of tabs\
    \ (Rule, Handler, etc.) appears. If you must later return to the previous tabs,\
    \ click on the vServers link at the top.\n\n## Configuring the Rule Tag\n\nIn\
    \ the Rule tab, select Extensions in the Rule Type drop-down menu and enter html,\
    \ htm in the Extensions text box. Click on the Check local file checkbox. Delete\
    \ any other predefined rules for instance Directory /icons by clicking in the\
    \ 'x' box to the right of the rule's name.\n\n![](img/5bf591327968a4c0190eb6adbf83042b_97_0.png)\n\
    \n## Configuring the Handler Tag\n\nIn the Handler drop-down menu, select List\
    \ & Send and at the Document Root textbox, clear any entry. This specifies an\
