    \n# 创建 PHP 页面\n\nPHP 是一种流行的用于服务器端脚本的编程语言，它可以提供动态内容。在第 9 章中，你将启用一个 Cherokee 虚拟服务器，允许客户端请求由\
    \ PHP 解析器处理。在第 13 章中，你将运行一个基于 PHP 和 MySQL 的数据库功能网站。在本节中，你将创建一个名为 `index.php` 的第一个\
    \ PHP 页面。\n\n作为你的第一个 PHP 页面，你将创建一个类似于你以前使用过的查找 IP 地址的在线网络工具。该 PHP 页面将显示你网站访问者的当前\
    \ IP 地址。\n\n使用你的文本编辑器创建 `index.php` 文件并放置以下行：\n\n```\n<?php\n$ip = $_SERVER['REMOTE_ADDR'];\n\
    echo \"Your IP address is $ip\";\n?>\n```\n\n之前的代码段将变量 `$ip` 赋值为 `$_SERVER` 数组中索引为\
    \ `REMOTE_ADDR` 的元素值。`$_SERVER` 数组是一个定义变量，包含头、路径和脚本位置等信息。该数组中的项是由 Web 服务器动态创建的。在数组的索引\
    \ `REMOTE_ADDR` 处，服务器存储了用户的 IP 地址。\n\n更改文本格式——例如，使用绿色文字且字体大小为 80 像素并居中对齐——可以使用\
    \ HTML 段标签（<p>）的 `style` 属性：\n\n注意，为了转义 `echo` 命令内部的双引号（\"）以便其不被解释为 echo 字符串的结束，你使用反斜杠（\\\
    ）作为转义字符。\n\n按照第 9 章后面描述的步骤，为带有 `index.php` 目录文件的 Cherokee 创建一个启用 PHP 的虚拟服务器。使用在线网络工具测试网站。下面的图片显示了从\
    \ tools.pingdom.com 看到的页面：\n\n![](img/5bf591327968a4c0190eb6adbf83042b_84_0.png)\n\
    \n点击上一图中远程浏览器的屏幕进行放大：\n\n![](img/5bf591327968a4c0190eb6adbf83042b_85_0.png)\n\n\
    显示的 IP 地址是远程在线工具的 IP 地址。你可以通过在 tools.pingdom.com 上选择不同的系统来重复测试。点击 Settings（设置）链接并选择另一个国家的服务器以显示其\
    \ IP 地址。\n\n![](img/5bf591327968a4c0190eb6adbf83042b_85_1.png)\n\n# 第 8 章 手动创建虚拟服务器\n\
    \n本章的重点是创建虚拟服务器并手动设置其行为的过程。在下一章中，你将使用向导来帮助你开发 PHP 服务器。\n\n# 匹配虚拟服务器\n\n创建虚拟服务器时，vServers\
    \ 选项卡包含了决定服务器如何行为的设置。向导是帮助系统配置虚拟服务器的助手。\n\n 虚拟服务器的规则\n\n在 Host Match 选项卡中，你设置虚拟服务器的规则。该部分包含了虚拟服务器的三个属性，以及服务器如何处理请求的设置。\n\
    \n![](img/5bf591327968a4c0190eb6adbf83042b_89_0.png)\n\n在 Basics 选项卡中，你设置虚拟服务器的set属性（例如\
    \ `index.php` 目录文件）。在 Method 方法的下拉菜单中，可以选择以下方法来匹配服务器：\n\n- 匹配名称（Match Nickname）\n\
    - 通配符（Wildcards）\n- 正则表达式（Regular Expressions）\n- 服务器 IP（Server IP）\n\n你创建的每个虚拟服务器都会添加到\
    \ vServers 列表中。该列表从上到下进行评估。一旦匹配到虚拟服务器，评估就会停止。例如，考虑已经存在两个虚拟服务器：\n\n- webserver.dynu.com\n\
    - myWebServer\n\n下面的图片显示了列表中的两个虚拟服务器：\n\n![](img/5bf591327968a4c0190eb6adbf83042b_90_0.png)\n\
    \n你可以通过点击服务器名称旁的双箭头来更改列表中服务器的顺序。你还可以通过点击服务器名称右侧的圆形按钮禁用或启用服务器。还有一个 'x' 按钮可以删除服务器。\n\
    \n第一个服务器的名称对应一个有效的域名，而第二个服务器的名称则不是。对于第一个服务器，选择了 Host Match 方法，这需要一个有效的域名；而第二个服务器选择了\
    \ Server IP，这需要一个特定的 IP 地址（例如 192.168.1.101）。\n\n# 服务器规则查找与处理\n\n一旦从列表中选择了处理请求的虚拟服务器，请求将针对你为该虚拟服务器创建的规则进行评估。例如，考虑一个请求\
    \ .html 扩展名的规则，或者一个针对端口 8080 的规则。因此，必须搜索两个列表。再次，评估是从列表顶部到部执行的。如果没有规则适用于客户端请求，则由默认规则胜出。\n\
    \n虚拟服务器规则定义了服务器采取行动的条件以及如何处理请求。你可以在 vServers 的 Behavior 选项卡中设置规则。此部分包含了你当前设置的规则以及每个虚拟服务器预设的默认规则。\n\
    \n"
