  md: '# Using Logical Operators with the Cherokee Rules


    Next, modify the Extensions html rule to create a compound rule with two rules
    combined with the AND logical operator. Cherokee provides three logical operators
    to combine rules: AND, OR and NOT. The rule handler remains the same as with Extensions
    html. When a request for a file with extension html arrives on port 8080, the
    handler Static Content responds with the directory index (which is an HTML file).


    Select the Rule tab and click on the Extension html rule in the list to modify
    this rule. Click the AND button and a new Rule Type menu appears. Select rule
    type Incoming IP/Port and then Port 8080 in the Incoming IP/Port menu. Click the
    SAVE button and restart the server. The compound rule, called Extensions AND Port
    8080 is activated.


    ![](img/5bf591327968a4c0190eb6adbf83042b_121_0.png)


    To ensure that a request that breaks this rule will not be saved, disable the
    Default rule. The rule list in the Handler tab, click Default and select the option
    None in the Handler menu. This will reject, for example, a request for index.html
    on port 8181.


    To test the new rule, use the online network tools.ping.com. This time, you can
    use the public IP address of the router to test the server. Find your current
    IP address with an online tool or just find my ip in the Google search textbox.
    Your current IP address, for example 87.202.110.63, will be displayed. In the
    Test Now textbox field of tools.ping.com, enter:


    ```

    87.202.110.63:8080/index.html

    ```


