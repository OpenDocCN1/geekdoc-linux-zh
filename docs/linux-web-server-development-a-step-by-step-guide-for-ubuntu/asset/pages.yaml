  md: '# Starting the Cherokee Administration Panel with cherokee-admin


    Cherokee configuration is straightforward because it has a big advantage: a simple
    browser-based configuration interface provided by the utility cherokee-admin.


    You can configure Cherokee using FireFox, Internet Explorer, or Chrome or any
    other browser.


    To open the browser-based Administration Panel, a one-time password is required.
    A one-time password, as implied by its name, is valid only for a single login.
    After it is used, it expires and a new password must be created. A potential intruder
    records that a one-time password will not be able to reuse it since the password
    will not be valid after its first and only use.


    The Cherokee one-time password is generated by cherokee-admin. cherokee-admin,
    which must be executed with root privilege, is the administrative interface to
    Cherokee. The cherokee-admin output conveniently reminds the user of the address
    to be entered in the browser’s address line to open the Cherokee Administration
    Panel.


    To start cherokee-admin and obtain the one-time password, enter in a Linux terminal:


    ```

    [sudo] password for christos:

    Cherokee Web Server 1.2.101 (May 23 2015): Listening on port 127.0.0.1:9090,

    TLS disabled, IPv6 enabled, using epoll, 4096 fds system limit, max. 2041

    connections, caching I/O, single thread

    ```


    $ sudo cherokee-admin


    Here is the output of cherokee-admin:


    Login:

    User: admin


    ![](img/5bf591327968a4c0190eb6adbf83042b_28_0.png)'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'One-time Password: YW61JCFdXConKyj


    Web Interface:

    URL: http://127.0.0.1:9090/


    ![](img/5bf591327968a4c0190eb6adbf83042b_29_0.png)


    cherokee-admin indicates that we should enter 127.0.0.1:9090 in our browser’s
    address bar to start the Cherokee Administration Panel. On most computer systems
    the localhost hostname resolves to address 127.0.0.1. localhost uses the computer’s
    loopback network interface. The loopback interface bypasses the network interface
    hardware. Port 9090 is the default TCP port on which the cherokee-admin process
    listens for connections.


    Open the browser and type at the address line the following URL (Uniform Resource
    Locator):


    http://localhost:9090


    or


    http://127.0.0.1:9090


    A dialog box box appears with two fields: User Name and Password.'
  merge: -1
