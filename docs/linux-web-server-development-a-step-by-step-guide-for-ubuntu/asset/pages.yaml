  md: '# Querying the Database from the Command Line


    You can use the select command to query the database. Perform a specific query
    that you will repeat also from the online network tool that will query remotely
    the database in your site. For, view the title and author of the books that include
    the keyword Web.

    mysql> select title, author from books where title like "%Web%"


    The SQL like operator is used in the where clause to search for a specific pattern
    in a field. In the previous example, like is used with the % wildcard character,
    which matches any sequence of characters or none. Another wildcard character,
    the underscore _ matches exactly one character. The query result is therefore
    any pair of title and author, where the title includes the Web keyword.


    As expected, two titles of the database include the Web keyword:


    ```

    mysql> select title, author from books where title like "%Web%"

    +------------------------------------------------+

    | title | author |

    +------------------------------------------------+

    | Weaving The Web | Tim Berners Lee |

    | How the Web was Born | James Gillies and Robert Cailliau |

    +------------------------------------------------+

    2 rows in set (0.02 sec)


    mysql>

    ```


