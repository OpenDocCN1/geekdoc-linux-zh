  md: '# Basic Steps to Create a Virtual Server


    You create next a virtual server that dispatches static (HTML) content. At the
    vServers section of the Administration Panel, click on the Add New Virtual Server
    button, the button with the blue plus sign at the upper-left area of the Cherokee
    window.


    ![](img/5bf591327968a4c0190eb6adbf83042b_95_0.png)


    At the dialogue window that appears, enter the nickname HTML Server at the Nick
    text field and the directory /var/www1 at the Document Root field. Cherokee will
    serve files from this directory, for your virtual server.


    ![](img/5bf591327968a4c0190eb6adbf83042b_95_1.png)


    Before clicking the Add button, open a terminal window and enter the following
    command to create directory /var/www1:


    $ sudo mkdir /var/www1


    Using edit or any other text editor, edit index.html:


    $ sudo edit index.html


    The HTML source code of index.html is the following:


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta http-equiv="Content-Type" content="text/html;

    charset=utf-8"/

    <title>Cherokee Server</title>

    </head>

    <body bgcolor="orange">

    ```'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'Return to the Administration Panel and click Add.


    The new server is added in the Virtual Server list in the left area of the vServers
    section. To be certain that the correct server is being configured, verify the
    virtual server''s name directly above the tags. If this is not the case, click
    on the server name in the servers'' list.


    # Configuring the Basics Tab


    In the Basics tab, enter the filename index.html in the Directory Indexes text
    field. The Directory Indexes text field sets list of file names to search for
    when the client requests an index of a directory by specifying a forward-slash
    (/) at the end of the directory name. We click on the SAVE button in the upper-right
    area of the panel. The Administration Panel asks whether a computer restart is
    desired. A restart is necessary to apply the new changes. Click the Graceful restart
    button in the dialogue window that appears.


    ![](img/5bf591327968a4c0190eb6adbf83042b_96_0.png)


    # Configuring the Host Match tab


    Next, click on the Host Match tab, where there are four available methods. From
    the Method drop-down menu, select the Server IP option. Click the Add new IP/Subnet
    button and in the dialogue window that appears the Web server''s private IP address
    in the text field. In the following example, the address 192.168.1.101 is used.
    Click the Add button. The IP or subnet textbox reflects now the server''s private
    IP address.


    With the previous configuration any client request that receives to the server
    on a packet with destination address 192.168.1.101 will be accepted.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Configuring the Behavior Tag


    Click the Behavior tab of the vServers section to apply the rules for the virtual
    server. Click on the Rule Management button and a new set of tabs (Rule, Handler,
    etc.) appears. If you must later return to the previous tabs, click on the vServers
    link at the top.


    # Configuring the Rule Tag


    In the Rule tab, select Extensions in the Rule Type drop-down menu and enter html,
    htm in the Extensions text box. Click on the Check local file checkbox. Delete
    any other predefined rules for instance Directory /icons by clicking in the ''x''
    box to the right of the rule''s name.


    ![](img/5bf591327968a4c0190eb6adbf83042b_97_0.png)


    # Configuring the Handler Tag


    In the Handler drop-down menu, select List & Send and at the Document Root textbox,
    clear any entry. This specifies an alternate document root directory.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '![](img/5bf591327968a4c0190eb6adbf83042b_98_0.png)


    Click on the SAVE button and select Graceful restart in the Save Configuration
    window that appears.


    ![](img/5bf591327968a4c0190eb6adbf83042b_98_1.png)


    # Testing the New Virtual Server


    An online network tool is needed to the new virtual server. We will use tools.pingdom.com.
    In the text field, enter christos.dynu.com and press the Test Now button. The
    directory index (index.html) is dispatched. The result is shown below:'
