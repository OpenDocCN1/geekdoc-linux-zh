  md: 'From the home page of the Cherokee Administration Panel, we can go to the other
    configuration pages using the tabs: Status, General, vServers, Sources and Advanced.
    The following image shows the home page of the Administration Panel:


    ![](img/5bf591327968a4c0190eb6adbf83042b_31_0.png)


    The most important feature of the Home tab is the green button that starts Cherokee,
    labeled *Start Server*. When you click this button, the button toggles from green
    to red and the *Stop Server* caption appears.


    # The Cherokee Test Page


    Let''s test the server you just started. Using the same IP address as we used
    to access *cherokee-admin*, enter the following URL in the browser’s address bar:


    ```

    http://127.0.0.1

    ```


    Cherokee uses by default the official port for the *HTTP protocol*, the protocol
    of the World Wide Web, port 80. You don''t have to explicitly denote this port
    at the URL. On the hand, it would not be an error to use:


    ```

    http://127.0.0.1:8080

    ```


    Instead of the *loopback* IP address, you could also use the *localhost* hostname:


    ```

    http://localhost

    ```


    The Cherokee test page appears in the browser’s window. The test page has the
    filename *index.html* and is titled *Cherokee Test Page*. When you set up your
    Web site, you will replace the Cherokee test page with your own page.'
