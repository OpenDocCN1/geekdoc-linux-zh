    (CR)(LF)

    End of Header (Length = 195)

    ```


    Notice that the (CR) and (LF) correspond to the Carriage Return and Line Feed
    ASCII characters, used as separators at the HTTP message fields.


    Next, log in to your DDNS provider’s administration web site and enable port forwarding.
    Return to the HTTP Viewer (www.rexswain.com) and use the following URL:


    ```

    http://webserver.dynu.com

    ```


    Note that the port number (8080) is not given since port forwarding is enabled.
    The result is shown in the following image:'
