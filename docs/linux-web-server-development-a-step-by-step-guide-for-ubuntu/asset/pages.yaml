    the home page of www.yougetsignal.com, click the Port forwarding Tester link.


    ![](img/5bf591327968a4c0190eb6adbf83042b_63_0.png)


    The port tester detects and displays your router’s public IP address – you must
    simply enter the port numbers you wish to test. Here is the result for port 80
    for the case that the Internet Service Provider blocks incoming port 80:


    ![](img/5bf591327968a4c0190eb6adbf83042b_63_1.png)


    The result after you click on the Check button:

    Port 80 is closed on 79.130.85.60

    The specific Cherokee Web server uses port 8181 instead. Port 8181 should be listed
    as open.


    ![](img/5bf591327968a4c0190eb6adbf83042b_63_2.png)'
