  md: '# The URL:


    http://cherokee-project.com/doc/config_virtual_servers_rule.html


    To continue with the example of the current section, the virtual server with the
    name webserver.dynu.com was selected. This includes two rules and the Default.
    For the two rules, rule type Extensions were selected; html was used for the first
    and htm was used for the second. Furthermore, handler List & Send was selected
    for the first and Only Listing for the second. The Default rule cannot be assigned
    any rule type but the handler can be set. We assume this is set to None and the
    Default rule of the default server is also set to None.


    By entering the following URL at the browser''s address field:


    http://webserver.dynu.com/info.html


    the virtual server dispatches the web page info.html to the client''s browser.
    The rule that applies in this case is List & Send, therefore the web page can
    be submitted.


    By entering the following URL:


    http://webserver.dynu.com/info.html


    the result is an HTTP error message 404. This is the Not Found error message and
    is caused by the fact that Only Listing was selected as the handler that applies
    here.


    If index.htm is set as the directory index in the request:


    http://webserver.dynu.com


    lists the document root directory (the directory where index.htm is found).


    If index.html is set as the directory index, the request:


    http://webserver.dynu.com


    sends the page index.html to the client browser.


    By entering the following URL:


    http://webserver.dynu.com/about.pdf


    the result is the HTTP error message 405 (Method Not Allowed).


    ![](img/5bf591327968a4c0190eb6adbf83042b_94_0.png)'
