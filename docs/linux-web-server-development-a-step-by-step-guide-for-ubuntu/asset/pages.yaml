    Function mysql_select_db() specifies the database that will be used. Function
    mysql_query() performs the query and returns the query result. Inside the while
    loop, the function mysql_fetch_array() is called to fetch each row of the result
    and print it with the echo command. The echo command is also used to enclose the
    results to a <p></p> pair of HTML tags that format the text. Finally, mysql_close()
    closes the connection with the MySQL server.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# Testing the Database Site Locally


    From a computer at the server’s LAN, test the database site. At web browser’s
    address bar enter the following URL:


    http://192.168.1.101


    Or if you run the server to a different port to 80, for instance port 8181 use
    the following URL:


    http://192.168.1.101:8181


    The virtual server dispatches the directory index, which you set previously to
    index.php.


    ![](img/5bf591327968a4c0190eb6adbf83042b_167_0.png)


    At the text box of the form, enter a word to make a keyword search. You can use
    the same word used previously from the command line (e.g., Web) to compare the
    results. Press the Search button in the form. The form defines database.php as
    the program that handles the data at the server. The PHP parser runs the code
    and the output is received by the client:


    ![](img/5bf591327968a4c0190eb6adbf83042b_167_1.png)'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# # Testing the Database Site Remotely


    Use an online network tool like http://tools.pingdom.com/ or http://www.webpagest.org/
    to test the database site. You can view the Home page, which includes the form,
    by entering in the text box site''s address:


    http://webserver.dynu.com/


    Click the Test Now button and the page index.php appears in the virtual browser
    of the online network tool:


    ![](img/5bf591327968a4c0190eb6adbf83042b_168_0.png)


    Click on the image at the left to zoom into the web page:


    ![](img/5bf591327968a4c0190eb6adbf83042b_168_1.png)


    Testing the home page of the database site is certainly required, but it would
    be more helpful to query the database using the online network tool. Certainly,
    you cannot control the remote browser to type the keyword in the textbox and press
    the Search button. However you can request the query by sending the data appended
    on the URL. In the online network tool, enter at the text box the following URL:'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'Using the previous URL, you provide the data directly to database.php, by attaching
    them in the URL, instead of requiring a user typing them at the form provided
    by index.php.


    In this example the keyword Web is the one sent, as it would be sent by the text
    box name


    The result is shown below:


    ![](img/5bf591327968a4c0190eb6adbf83042b_169_0.png)


    By clicking on the browser’s icon at the left, you can enlarge the icon (by zooming
    in) and inspect the web page and view the results:


    ![](img/5bf591327968a4c0190eb6adbf83042b_169_1.png)


    The question mark (?) used in the URL for the remote queries separates the query
    string from the directory path to the resource that will handle the data (database.php).


    A query string is the portion of the URL submitted to the Web server that includes
    the database fields and their values. In the previous example, there is only one
    field submitted to the server, namely title with a value of Web. If our site used
    two or more fields, the ampersand (&) would be used to separate the field/value
    pairs. For example, if the query also included the author field:'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'http://webserver.dynu.com/database.php?title=Web&author=Tim Berners Lee


    Next, use the following URL in the text box of tools.pingdom.com:


    http://webserver.dynu.com/database.php?title=Weaving The Web


    Running the test again has the following result:


    Weaving The Web, Tim Berners Lee


    ![](img/5bf591327968a4c0190eb6adbf83042b_170_0.png)


    Note that in order to submit the query in a way that was accepted by all browsers,
    we could replace any space with the special URL encoding character %20 or the
    plus sign. The previous query could be submitted as:


    http://webserver.dynu.com/database.php?title=Weaving%20The%20Web


    or


    http://webserver.dynu.com/database.php?title=Weaving+The+Web'
  merge: -1
