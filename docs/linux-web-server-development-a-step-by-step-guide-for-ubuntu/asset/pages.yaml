  merge: -1
  pgno: 138
- img_proc: true
  md: '(CR)(LF)

    The previous was the connection request from rexswain.com to the Port Forwarding
    server of the DDNS provider. The Port Forwarding server uses a Object Moved message
    to redirect the client to the public IP address of the router of the Web server''s
    LAN at the port number 8080, which is the port forwarded. Another step follows,
    with another connection request this the client (rexswain.com) to the router and
    eventually to the Web server. The connection from rexswain.com to the Web server
    is performed with two connection requests. The second connection request message
    is also included in the web page of rexswain:


    ```

    GET / HTTP/1.1


    Host: 87.202.110.63:8080

    User-Agent: Mozilla/5.0 (Windows NT 6.1) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/43.0.2357.65 Safari/537.36

    Referer: http://www.rexswain.com/httpview.html


    Connection: close

    ```


    +   * Finding TCP protocol...

    * Binding to local socket...

    * Connecting to host...

    * Sending request...

    * Waiting for response:...


    Receiving Header:


    # The reply from the Web server is the HTTP message 200 (OK):


    ```

    HTTP/1.1-200-OK(CR)(LF)

    Connection: close(CR)(LF)

    Date: Sun, 24-May-2015 03:58:46-GMT(CR)(LF)

    Server: Cherokee/1.2.101 (UNIX)(CR)(LF)

    Content-Length: 6708(CR)(LF)

    Content-Type: text/html(CR)(LF)

    Expires: Tue, 01-Jan-1970-00:00:00-GMT(CR)(LF)

    (CR)(LF)

    ```


    With port forwarding disabled, the Host field in the client’s message corresponds
    to the server’s domain name. However, with port forwarding enabled, the first
    request message sent to the server has a Host field that corresponds to the server’s
    domain name, but this is redirected. The second connection request message that
    follows will have an altered Host field.


    You can also inspect the client’s HTTP request when it arrives at the server’s
    computer, with a packet sniffer, a program that captures and analyzes packets
    passing over a network. If you don''t have a packet sniffer, you’ll need to install
    Wireshark. From a Linux terminal on your Web server, run:


    ```

    $ sudo apt-get install wireshark

    ```


    After the installation is complete, enter the following in a terminal window:


    ```

    $ sudo wireshark

    ```'
