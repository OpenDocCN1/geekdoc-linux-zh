  md: '# Chapter 2 Cherokee Installation and Configuration


    # Cherokee Installation


    To install and configure Cherokee, *root* privilege is required. One option for
    Linux is to login as *root*. An alternative is to precede each command with the
    *sudo* command. The *sudo* utility allows a user to run programs as the *root*
    user and is the recommended approach for Ubuntu. For the Fedora Linux, as described
    in the appendix, we will use the *root* user account.


    The user who installs Ubuntu uses the *sudo* command to execute commands that
    require *root* privilege. To enable another user, for example user christos, to
    use sudo you may make /etc/sudoers file writable. Enter in the Linux terminal:


    ```

    $ sudo chmod +w /etc/sudoers

    ```


    To edit /etc/sudoers file:


    ```

    $ sudo edit /etc/sudoers

    ```


    Add the following entry to the /etc/sudoers to the original permissions:


    ```

    christos ALL=(ALL) NOPASSWD: ALL

    ```


    Instead of edit you can also use the echo command:


    ```

    $ echo "christos ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

    ```


    Reset the permissions of /etc/sudoers to the original permissions:


    ```

    $ sudo chmod -w /etc/sudoers

    ```


    The command to download and install Cherokee varies among the Linux distributions.
    For Ubuntu:


    ```

    $ sudo apt-get install cherokee

    ```


    The *apt-get* command is a command-line tool which uses Ubuntu''s *Advanced Packaging
    Tool (apt)* to download, install, upgrade, and remove software packages.


    Note that the previous command requires an active Internet connection since the
    *apt-get* command downloads packages.


    To update the package repositories used by *apt-get* and install the most recent
    Cherokee version, enter the following command before using the previous *apt-get*:


    ```

    $ sudo apt-get update

    ```


    In the case that the *apt-get* depositories are not updated with the latest version,
    you can download and install Cherokee from source. At the home page of *cherokee-project.com*,
    click on the *Download Cherokee* link.'
  merge: -1
  pgno: 25
- img_proc: true
