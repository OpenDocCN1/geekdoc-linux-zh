  md: 'Follow the usual Linux method for installing a program using the configure
    and make commands. In a Linux terminal, change directories to the directory of
    the unzipped package:


    +   - cd Downloads/cherokee-1.2.101


    and run configure and make using the arguments suggested at the Download link
    at the home page of cherokee-project.com:


    +   - sudo ./configure --prefix=usr --locatedir=/var --sysconfdir=/etc


    +   - sudo make && sudo make install


    Note that for the previous example to work on some systems, some Linux tools must
    be installed (the compiler gcc, make, gettext utilities). Run:


    +   - sudo apt-get install gcc


    +   - sudo apt-get install gettext


    +   - sudo apt-get install make


    The Cherokee package used in this book, cherokee-1.2.101.orig.tar.gz, was downloaded
    from the following URL:


    https://launchpad.net/ubuntu/+source/cherokee/1.2.101-1


    Installing Cherokee from the Ubuntu Software Center is another option. The Ubuntu
    Software Center is a GUI (Graphical User Interface) utility for browsing, installing,
    and removing applications.


    On the Ubuntu desktop, click the Applications menu and select the Ubuntu Software
    Center option. In the search box, enter cherokee and press Enter. In the results,
    select the cherokee entry and click the Install button to start the Cherokee download
