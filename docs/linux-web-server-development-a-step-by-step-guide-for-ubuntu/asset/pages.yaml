  md: 'The new virtual server appears in the Virtual Servers list at the left side
    of the Administration Panel.


    After the new virtual server has been added, you must be careful to select the
    server from the list in the left area of the vServers when you wish to configure
    this server. Otherwise you may accidentally change the settings of a different
    virtual server. The current server name appears immediately above the tabs.


    In the Basics tab, enter index.php as the directory index in the Directory Indexes
    textbox. Later you will create a PHP file named index.php.


    In the next section, you will install and enable the PHP language for Cherokee.


    For this virtual server, we have selected a nickname that does not correspond
    to the domain name of the Web server since we will use the Use IP option for the
    Host Match method. Click on the Host Match tab and from the Method drop-down menu,
    choose the Server IP method. Click next at the Add new IP/Subnet button that appears,
