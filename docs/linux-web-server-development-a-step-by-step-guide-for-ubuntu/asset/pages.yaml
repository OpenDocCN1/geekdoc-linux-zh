    The following is the output of the netstat command after cherokee-admin and the
    Cherokee server, which listens to ports 80 (http), 8080 (http-alt) and 8181. Note
    that port 9090, for which cherokee-admin listens, is also included in the output:


    christos@server- $ sudo netstat —tcp —programs —listening

    Active Internet connections (only servers)


    | Proto Recv Send-Q Local Address | Foreign Address State | PID/Program Name |

    |---|---|---|---|---||

    | tcp | 0 | server:domain | *:* | LISTEN | 981/dnsmasq |

    | tcp | 0 | localhost:ip | *:* | LISTEN | 612/cupsd |

    | tcp | 0 | localhost:4000 | *:* | LISTEN | 1782/python |

    | tcp | 0 | localhost:9090 | *:* | LISTEN | 1723/cherokee-admin |

    | tcp6 | 0 | [::]:http-alt | *:* | LISTEN | 1838/cherokee-woke |

    | tcp6 | 0 | [::]:http | *:* | LISTEN | 1838/cherokee-woke |

    | tcp6 | 0 | [::]:8181 | *:* | LISTEN | 1838/cherokee-woke |

    | tcp6 | 0 | [::]localhost:ipp | *:* | LISTEN | 612/cupsd |


    ![](img/5bf591327968a4c0190eb6adbf83042b_51_0.png)


    # The Virtual Servers Section of the Administration Panel


    The next section to be discussed is vServers, which stands for Virtual Servers.
    Cherokee can support multiple Web servers, called Virtual Servers, which can run
    simultaneously. Each virtual server may have a different domain name, support
    different sites and utilize'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'different tools. Even if you don''t want to create multiple virtual servers,
    you will still use the default virtual server. This virtual server, named default,
    will exist in every Cherokee


    On the Basics tab of Servers, you can configure your Web site''s Document Root
    directory. The directory from which Cherokee will serve files. For example, if
    the Document Root is /var/www, then a client''s request for http://www.example.com/index.html
    refers to /var/www/index.html. As can be seen in the previous image, the Document
    Root defaults either to /var/www or /usr/local/www/ for Ubuntu. If we wish to
    change the Document Root directory, the path of the new directory can be entered
    in the Document Root textbox.


    ![](img/5bf591327968a4c0190eb6adbf83042b_52_0.png)


    The Directory Indexes text field sets the directory index. The directory index
    indicates the list of files to send when the client requests a URL with a forward
    slash (/) at the end of the domain name (e.g., http://webserver.dynu.com/). A
    common name for the directory indexes file is plus the corresponding file name
    extension (e.g., index.html, index.php). If the directory index is set to index.html,
    the previous URL becomes equivalent of:


    http://webserver.dynu.com/index.html


    In the Logging tab, you can configure the logging for your Cherokee server (e.g.,
    which two filenames to use for error and access logging). The Error Logging and
    the Access Logging file names can also be changed from their default.


    To enable the Access Logging at the Format drop-down menu, select Apache compatible
    instead of the default (None). In the Filename textbox, select a new name and
    path for the log file. You can also leave the default. In the Time standard drop-down
    menu, select either Local time or UTC (Coordinated Universal Time).'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'If the default access log location was not changed from its default location,
    you can review the Access Logging file with the following command:


    $ sudo more /usr/local/var/log/cherokee.log


    The output for the example, shown in the following image, shows records with information
    about Web client connections to the server. The information includes the IP Address,
    the time of access, the URL requested by the client, the client''s browser, and
    the client''s OS. For instance:


    50.22.90.226 - - [13/Feb/2015:17:24:43 +0200] "GET /HTTP/1.1" 200 251 "-" "Mozilla/

    Ila/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/40.0.2

    214.93 Safari/537.36"


    ![](img/5bf591327968a4c0190eb6adbf83042b_53_0.png)


    ![](img/5bf591327968a4c0190eb6adbf83042b_53_1.png)


    You can also configure the error logging file by selecting File in the Write errors
    to drop-down menu and specifying a filename in the Filename textbox. The other
    menu *'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'options are Standard Error, Execute Program, System Logger and Disabled.

    Chapters 8 through 12 contain many examples of creating and running multiple virtual
    servers. Those chapters also discuss the other tabs of the vServers section.'
  merge: -1
  pgno: 54
