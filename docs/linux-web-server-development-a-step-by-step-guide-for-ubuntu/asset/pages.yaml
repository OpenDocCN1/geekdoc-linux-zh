  md: '![](img/5bf591327968a4c0190eb6adbf83042b_100_0.png)


    Note that the domain name *christos.dynu.com* uses port forwarding to port 8181,
    which along with port 8080 are two port numbers used in the example server. This
    domain name is then resolved to the public IP address of the router and then through
    the virtual server router service to the private IP of the server (192.168.1.101
    in this example). Since the server matching method is the *Server IP*, which contrary
    to *Match nickname* is independent of the server’s domain names, the second domain
    used in this book examples, *webserver.dynu.com*, could also be used.'
