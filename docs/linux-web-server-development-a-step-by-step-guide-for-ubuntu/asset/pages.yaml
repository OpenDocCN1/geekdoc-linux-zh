  md: '# Chapter 9 Creating a PHP Virtual Server Using a Wizard


    So far, you have used the default virtual server and you have also created another
    server with HTML static content called HTML Server. You will now create another
    virtual server that will use the PHP language for dynamic Web content. This time,
    you will use a Wizard, a program that simplifies the process by guiding you through
    the required steps.


    In the following configurations, another domain name is required as well as another
    registration with domu.com. Recall that earlier the domain name christos.dynu.com
    was used on port number 8181 and port forwarding was used. The second domain name
    will be webserver.dynu.com and will use port 8080 and will also use the port forwarding
    service. In the configuration file of the DDNS client, /etc/ddclient.conf, another
    entry is required with the new values for the webserver.dynu.com. Add the following
    lines at the end of /etc/ddclient.conf:


    ```

    # check every 60 seconds

    daemon=60

    # log update msgs to syslog

    syslog=yes

    # mail all msgs to root

    mail=root

    # mail failed update msgs to root\mail-failure=root

    # record PID in file.

    pid=/var/run/ddclient.pid

    # use ssl-support. Works with ssl-library

    ssl=yes

    # get ip from server.

    use=web, web=checkip.dynu.com/, web-skip=''IP Address''

    # default server

    server=api.dynu.com

    # default login

    login=webserver

    # default password

    password=fwa4k7e

    protocol=dyndns2

    webserver.dynu.com

    ```'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# # Starting the Virtual Server


    Click on the vServers section of Cherokee Administration Panel and then click
    the Add New Virtual Server button. This is the button with the blue plus sign
    in the upper-left area of the Cherokee Administration Panel.


    In the dialogue window that appears, enter a nickname for the server in the Nick
    textbox. This nickname can be the domain name that corresponds to the new virtual
    server. In our example, this is a simple name like PHP Server. You must also enter
    the Document Root. The default Document Root for Ubuntu is:


    /var/www


    or


    /usr/local/var/www


    For your virtual server, create the directory /var/www2. This new directory will
    be our Document Root. In a Linux terminal window enter:


    ```

    $ sudo mkdir /var/www2

    ```


    Return to the Cherokee Administration Panel and enter the newly created directory
    name at the Document Root text field and click the Add button.


    ![](img/5bf591327968a4c0190eb6adbf83042b_103_0.png)'
