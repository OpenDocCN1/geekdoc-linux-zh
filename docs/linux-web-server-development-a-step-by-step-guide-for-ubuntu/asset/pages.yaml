  md: '![](img/5bf591327968a4c0190eb6adbf83042b_99_0.png)


    A request for a file with the .htm extension (e.g., info.htm) is also dispatched
    according to the rule you previously set. However, a request for a file with another
    extension (e.g., http://christos.dynu.com/info.pdf) is also dispatched although
    the .pdf extension is not included in the rule. This request is not fulfilled
    by the rule you just set from the Default rule. To disable the Default rule in
