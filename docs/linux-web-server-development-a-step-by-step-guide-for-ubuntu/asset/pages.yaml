  md: '# Chapter 8 Manually Creating a Virtual Server


    The focus in this chapter is on the process of creating a virtual server and setting
    its behavior manually. In the next chapter, you will use a Wizard to help you
    develop a PHP server. Wizards are configuration assistants that help the system
    administrator configure a new virtual server.


    # Matching the Virtual Server


    When creating a new virtual server, the first three tabs of the vServers section
    of the Administration Panel contain the settings for the basic attributes of the
    server, the settings that determine when the server will be chosen to handle the
    request, and the settings for how the server serves the client''s requests.


    ![](img/5bf591327968a4c0190eb6adbf83042b_89_0.png)


    In the first tab named Basics, you set the basic characteristics of the virtual
    server (e.g., the name, the directory index and the document root). The Cherokee
    web server must determine which virtual server will process the request. The virtual
    server values that will be evaluated in this phase are set in the Host Match page
    in the vServers section of the Administration Panel. In the Method drop-down menu,
    one of the following four methods for matching a server can be selected:


    +   * Match Nickname

    * WildCards

    * Regular Expressions

    * Server IP'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'Each virtual server that you create is added to the Virtual Servers list found
    at the left of the vServers section of the Cherokee Administration Panel. This
    list is evaluated from top to bottom. As soon as a virtual server matches, the
    evaluation stops. If the request does not match one of the non-default virtual
    servers, the default server will handle the client''s request.


    As an example, consider that two virtual servers already exist in the Cherokee
    server (later you will create several virtual servers), with the nicknames:


    +   * webserver.dynu.com

    * myWebServer


    The following image shows the two virtual servers on the server list:


    ![](img/5bf591327968a4c0190eb6adbf83042b_90_0.png)


    You can change the order of the virtual servers in the list by clicking on the
    double arrow next to the server name and dragging the server name up or down.
    You can also disable and enable the server by clicking on the circular button
    to the right of the server name. There is also an ''x'' button that deletes the
    server.


    The nickname of the first server corresponds to a valid domain name used by the
    site, while the nickname of the second server does not. For the first server,
    the Match'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'Nickname method is selected at the Host Match tab, which requires a valid domain
    name

    as the virtual server''s name, and for the second Server IP is selected, which
    requires a

    specified IP address (e.g. 192.168.1.101) and corresponds to the Web server. In
    this example,

    if a user typed the following in the address field of his browser:


    http://webserver.dynu.com/page.html


    the first server matches. Because webserver.dynu.com is first in the list, the
    evaluation

    stops. On the other hand, if the client types the following in the address field
    of the

    browser:


    http://christos.dynu.com/page.html


    and christos.dynu.com is a valid domain name that corresponds to the router''s
    public IP

    and eventually (with the router''s virtual server service) at the Web server''s
    IP address

    192.168.1.101, the first server does not match (i.e., the first server has a different

    name) but the second server matches (i.e., the second server uses the Host Match
    method that

    resolves to the server''s IP address.


    # Server Rules Lookup and Handling


    Once the virtual server has been chosen from the Virtual Servers list to handle
    the request,

    the request is evaluated against the list of rules that you have created for the
    specific

    virtual server. For example, consider a rule for requesting files with .html extensions
    or a

    rule for a connection to port 8080. Therefore, the number of lists that must be
    searched

    two lists. Again, the evaluation is performed in the order from the top of the
    list to the

    bottom. If no rule applies to the specific client''s request, the Default rule
    wins.


    ![](img/5bf591327968a4c0190eb6adbf83042b_91_0.png)


    The virtual server rules define the condition on which the server will act and
    also how the

    request will be handled. You can set the rules in the Behavior tab of the vServers
    section.

    This section includes a table with the rules that you have currently set and also
    the Default

    rule that is predefined for each virtual server.'
  merge: -1
  pgno: 91
