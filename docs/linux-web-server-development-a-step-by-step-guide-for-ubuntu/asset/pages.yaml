  md: '# Creating a PHP page with a Form


    To allow the client to query your database, you must provide her a web page with
    a form, where she can type the keywords and send them to the database. One can
    easily establish a connection to MySQL with PHP. This simplicity makes PHP an
    attractive option.


    Create a PHP enabled Cherokee virtual server following the steps described in
    the previous paragraph. Move this virtual server to the top of the Virtual Servers
    list in the vServers section using the double arrow. Create a directory index
    for this virtual server (e.g., index.php). This file will implement an HTML form
    that includes a text box for entering the keyword and the Submit button to send
    data from the client''s computer to your PHP virtual server and eventually to
    the database.


    ![](img/5bf591327968a4c0190eb6adbf83042b_164_0.png)


    The action parameter in the <form> tag specifies the program on the server side
    that will receive the client''s data and return the result back to the client.
    Set this to database.php. This is another php file that you will create in the
    same directory as index.php. database.php will connect to the MySQL server and
    perform the query on the string passed by the client and generate the results.
    The database.php output is what the client receives after pressing the Search
    button.


    Set the second parameter in the <form>, named method, to get. There are two methods
    for submitting the data in a form: GET and POST. PHP programs can handle both
    and retrieve the data sent with automatic global variables.


    To create the file index.php, enter the following command in a Linux terminal:

    $ sudo edit /var/www6/index.php


    The source code of index.php is the following:


    ```

    <html>

    <head><title>Search the Bookstore</title></head>

    <body bgcolor="yellow">

    <p style="color:red; font-size:48px">

    Search the Bookstore by Title:

    </p>

    <form action="database.php" method="get">

    <input type="text" name="title" style="color:red; font-size:48px">

    <input type="submit" value="Search" style="color:red;

    ```'
