  md: '# Inserting Data to the Database from the Command Line


    Use the **insert** command to insert three records into the books table. Recall
    that the field book_id is auto incremented and you don''t have to enter book_id
    values values.


    ```

    mysql> insert into books (title, author) values (''Waving The Web'', ''Tim Berners
    Lee'');

    mysql> insert into books (title, author) values (''Just for Fun'', ''Linus Torvalds'');

    mysql> insert into books (title, author) values (''How the Web was Born'', ''Gillies
    & Cailliau'');

    ```


    To view the three records, use the **select** command. You can specify the records
    to view or you can select any record by using the star ''*'' wildcard:


    The output is shown below:


