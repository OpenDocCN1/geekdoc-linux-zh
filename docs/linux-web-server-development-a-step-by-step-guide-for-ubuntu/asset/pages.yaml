  md: '# Chapter 13 A Database-driven Web Site


    In this chapter, you will create a PHP-enabled virtual server that connects via
    PHP to a MySQL database. This will allow the client to query the database through
    a form on a Web page. You will start by installing the MySQL database server on
    the server, then you create and test the database from the command line, and finally
    you will create a PHP page that connects to the MySQL database and a PHP page
    that will used to display the form to the remote user. The form is embedded in
    the first PHP page. After the user submits the requested information on this first
    PHP page, the data is sent to the second PHP page, which queries the database
    and returns the result to the user. Finally you will test it and query the database
    from both your LAN and remotely using online network tools.


    # MySQL Installation


    Open the Linux terminal and enter the following command:


    ```

    $ sudo apt-get install mysql-server mysql-client php5-mysql

    ```


    During the installation process, a simple blue-colored window will ask for the
    password of the MySQL root user. Enter the password and press Enter on your keyboard.


    ![](img/5bf591327968a4c0190eb6adbf83042b_155_0.png)


    Another window appears; retype your password.


    When the installation process is complete, enter the following command in the
    Linux terminal to login to mysql as the mysql user root (not to be confused with
    the Linux user root). Use the -p argument to provide the required password and
    -u to specify your user:'
