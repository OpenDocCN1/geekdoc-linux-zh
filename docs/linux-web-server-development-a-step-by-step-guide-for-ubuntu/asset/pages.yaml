    Finding host ip...

    Host IP address = 87.202.110.63

    Finding TCP protocol...

    Binding to local socket...

    Connecting to host...

    Sending request...

    Waiting for response...

    Receiving Header:

    ```


    # The Host field at the client''s request is:


    http://webserver.dynu.com:8080


    The web page also includes the Web server reply to the client (rexswain.com).
    This is a message of type OK:


    ```

    HTTP/1.1-200-OK(CR)(LF)

    Connection:close(CR)(LF)

    Date: Sun, 24-May-2015-04:38:37-GMT(CR)(LF)

