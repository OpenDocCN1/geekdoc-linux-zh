    # # PHP Installation and Configuration


    To install PHP on Ubuntu, enter the following command at the terminal:


    ```

    $ sudo apt-get install php5 php5-cgi

    ```


    To configure PHP, edit the *php.ini* file using the gedit command. According to
    the version of PHP, this file can be found in different directories. Try:


    ```

    $ sudo gedit /etc/php5/cgi/php.ini

    ```


    or


    ```

    $ sudo gedit /etc/php/php.ini

    ```


    Uncomment the following configuration option by deleting the semicolon (;);

    ;cgi.fix_pathinfo=1'
