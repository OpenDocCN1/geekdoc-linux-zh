  md: 'Note that MySQL commands can also be uppercase (e.g., CREATE DATABASE) and
    all commands should end with a semicolon (;).


    Enter the use command to use a specific database (in this case, the database just
    created):


    ```

    mysql> bookstore;

    ```


    Let''s add a table to the bookstore database named books. Table books is created
    with the create table command:


    ```

    mysql> create table books(book_id int auto_increment primary key, title varchar(255)
    not null, author varchar(255) not null);

    ```


    or


    ```

    mysql> create table books(book_id int auto_increment, varchar(255) not null, author
    varchar(255) not null, primary key(book_id));

    ```


    Table books includes a field named book_id, which is an integer (int) number.
    The keyword auto_increment indicates that book_id increments automatically by
    one in each record you add to the table, starting (by default) from 1. The primary
    key constraint indicates that this field uniquely identifies each record in this
    table.


    The table will include two more fields, called title and author. Both are of type
    varchar, which holds a variable length string with a maximum size specified in
    parenthesis. Fields title and author can hold up to 255 characters. The not null
    directive enforces a field to not accept null values.


    Use the show tables command to display the tables that the bookstore database
    contains. You have created just one table named books:


    ```

    mysql> show tables;

