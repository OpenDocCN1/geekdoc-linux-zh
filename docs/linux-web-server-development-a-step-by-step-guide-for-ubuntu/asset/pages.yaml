  md: '# Chapter 11 Using Multiple Domain Names


    A virtual server was configured in the previous chapter to provide two rules for
    different content types (html and php). In this chapter we will configure a server
    to provide two rules: one that accepts connections on port 8080 and one rule that
    accepts connections on port 8181. Recall that we now have two registered DDNS
    domains:


    +   * webserver.dynu.com that uses port forwarding on port 8080

    * christos.dynu.com that uses port forwarding on port 8181


    For a given request for a resource, Cherokee will look in its rules for a match
    with the requested domain name.


    # Applying Multiple Rules


    In the vServers section of the Cherokee Administration Panel, click on the Add
    New Virtual Server (the blue plus sign button). In the dialogue window that appears,
    enter in the New textbox One Server with Two domains and in the Document Root
    textbox the value /var/www3. Click on the Add button. In the Basics tab of the
    vServers section, enter index.html in the Directories textbox.


    ![](img/5bf591327968a4c0190eb6adbf83042b_126_0.png)


    Click the Host match and in the Method drop-down menu, select Server IP. Click
    the Add new IP/Subnet button that appears and in the dialogue window, enter the
    private IP of the Web server (e.g., 192.168.1.101) and click the Add button.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '![](img/5bf591327968a4c0190eb6adbf83042b_127_0.png)


    The server''s private IP address is now reflected in the IP or Subnet textbox.


    Next click the Behavior tab and click the Rule Management button. A new set of
    tabs (Rule, Handler, etc.) appears. In the left area of the Administrations Panel
    you can find the Default rule as well as some predefined rules.


    ![](img/5bf591327968a4c0190eb6adbf83042b_127_1.png)


    Click on the ''x'' button to the right of the rule names to delete the predefined
    rules. Also click Delete in the pop-up window that appears. You cannot delete
    the Default rule. Click next on the Add Behavior Rule button (the blue plus sign
    at the upper-left area of the window) to add a new rule. In the dialogue window
    that appears, click Manual in the list on the left and select Incoming IP/Port
    from the Rule Type drop-down menu to the right and then choose one of the ports
    on which the server currently listens (e.g., 8080) in the Incoming IP/Port drop-down
    menu that appears. Click the Add button.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '![](img/5bf591327968a4c0190eb6adbf83042b_128_0.png)


    The *Rule* tab reflects those settings and allows you to change them.


    ![](img/5bf591327968a4c0190eb6adbf83042b_128_1.png)


    In the **Handler** tab, select the handler for this rule. For this example in
    the **Handler** drop-down menu, select **Server Info**. In the **Show Information**
    drop-down menu that appears, select **Server Information**. This time, the virtual
    server instead of static content or dynamic PHP content provides some info about
    the Web server itself.'
