  md: '# Chapter 7 Building Your Site


    In this chapter, you will replace your current home page, the default Cherokee
    directory index, index.html, with another. As you may recall, index.html is the
    Cherokee test page.


    Next, you will create web pages in the simplest way, using HTML. HTML stands for
    Hypertext Markup Language and was the first language invented for creating web
    pages. A detailed study of HTML is out of scope in this book but we''ll look at
    some basic HTML to get started. There are plenty of online tutorials (e.g., http://www.w3schools.com)
    and http://www.w3schools.com) where you can continue building your knowledge of
    HTML.


    At the last section of this chapter, you will create a PHP page that you can use
    with your Cherokee server after you enable the server for PHP. The steps to install
    PHP and create a PHP virtual server are included in this chapter 9. The PHP page
    that will create is an online network tool that displays the IP address of the
    visitor.


    # Creating an HTML file


    To create a new HTML file use gedit at the command line or right-click on the
    desktop or a folder and select Create New and then Empty File.


    ![](img/5bf591327968a4c0190eb6adbf83042b_79_0.png)


    In the window that appears, enter the file name. If you create the directory index
    for your site and you want to keep the default directory index name, enter index.html.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '![](img/5bf591327968a4c0190eb6adbf83042b_80_0.png)


    To open the file as a web page, double-click on the file or right-click and choose
    one of the available browsers (e.g. Firefox Web Browser). To edit the web page
    and enter HTML code, right-click and choose a text editor (e.g. edit). If gedit
    is not available, install the package with apt-get. In a Linux terminal, enter:


    ```

    $ sudo apt-get install edit

    ```


    ![](img/5bf591327968a4c0190eb6adbf83042b_80_1.png)


    # The HTML Tags


    You are ready to enter the HTML code. The HTML language uses various tags to define
    the limits in the document where a specific attribute is applied. For example,
    to make text bold:'
  merge: -1
  pgno: 80
- img_proc: true
  md: '<b>this is bold text</b>


    The first tag indicates the start of the bold attribute and the second indicates
    the end (/) of the bold.

    In the HTML code, you create two general sections: the head and the body. Those
    are specified by the `<head>` and `<body>` tags, respectively, and are included
    in the `<html>` tags. The head contains metadata (about data) (e.g., the title
    of the document and the encoding). The body contains all of the contents of an
    HTML document (e.g., text, hyperlinks, images).

    A simplified HTML document:


    ```

    <!DOCTYPE html>

    <html>

    <title>Page Title</title>

    <body>

    The content of the document......

    </body>

    </html>

    ```


    # ## A simple HTML page


    Through the examples in the next chapters, you run multiple virtual servers, sometimes
    simultaneously. To differentiate the content provided by each server, you can
    use single-colored pages. To paint the web page background with a specific color,
    use the `bgcolor` attribute of the `<body>` tag with a value that corresponds
    to the color name.

    For example, to create a green-colored page, use the following simplified code:


    ```

    <html>

    <head>

    <title>A Green page</title>

    </head>

    <body bgcolor="green">

    </body>

    </html>

    ```


    # ## Designing Your Site'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'Earlier, you set the default web page (see the vServers section in Chapter
    4). This is configured in the Directory input field in the Administration Panel.
    By default, this is set to index.html. If, for example, your site is webserver.dynmu.com
    and a user types http://webserver.dynmu.com in the address bar, this will be the
    equivalent of typing http://webserver.dynmu.com/index.html in the address bar.
    The HTML file specified by the Directory input field must be found in the Document
    Root directory. This is also configured in the vServers section of the Administration
    Panel. The default setting is /var/www or /usr/local/var/www for Ubuntu but this
    value can be changed. Subdirectories can be created within this directory. For
    example, you could create the directory /var/www/images and place all the images
    for your site in this directory:


    ```

    $ sudo mkdir /var/www /var/www/docs for additional documents and so on.

    ```


    You can also create the directory


    # A New Home Page for Your Site


    Let''s go to the default root directory (which we can change, as described later):


    ```

    $ sudo cd /var/www

    ```


    Instead of modifying index.html, let''s make a copy of the original. You can start
    with your new index.html:


    ```

    $ sudo mv index.html index_old.html

    ```


    In your favorite editor, let''s create your new index.html using the application
    edit:


    ```

    $ sudo edit index.html

    ```


