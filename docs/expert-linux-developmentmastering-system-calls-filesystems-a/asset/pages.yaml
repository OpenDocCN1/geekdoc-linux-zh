    forcibly reclaim resources from one process to allocate them to another. This
    tactic is applicable only if the resource state can be safely saved and restored.

    * Circular Wait: Imposing a total ordering of all resource types and requiring
    that requests in in an increasing order of enumeration can prevent the formation
    of cycles in resource allocation graphs.


