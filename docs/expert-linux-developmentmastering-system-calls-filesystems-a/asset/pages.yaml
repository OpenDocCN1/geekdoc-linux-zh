    # Generating Cryptographic Keys Using OpenSSL


    The foundation of secure communication is strong cryptographic keys. OpenSSL provides
    ample utilities for generating private keys and their respective public certificates.
    Two types of cryptographic keys used in SSL/TLS are RSA and ECDSA. The following
    command demonstrates how to generate an RSA private key:


    ```

    $ openssl genkey -algorithm RSA -out private_key.pem -pkeyopt rsa_keygen_bits:2048

    ```


    This command produces a 2048-bit RSA private key, which is stored in the file
    private_key.pem. The key length of 2048 bits offers a good balance between security
    and performance. For applications requiring higher security levels, a bit of 4096
    may be utilized, this impacts performance due to the increased computational requirements.


    For ECDSA keys, which are known for their shorter key length but similar security
    levels to RSA, the command changes slightly:


    ```

    $ openssl ec ecparam -name secp384r1 -genkey -out ecdsa_private_key.pem

    ```


    This generates an ECDSA private key using the secp384r1 curve, which is one of
    the recommended curves due to its strong security properties.


    # Creating Digital Certificates


    Once a key is in place, the next step involves creating a certificate signing
    request (CSR), which is used to obtain a certificate from a Certificate Authority
    (CA). For self-signed certificates, which are useful in testing environments,
    OpenSSL can execute the following directly:


    ```

    $ openssl req -new -x509 -key private_key.pem -out certificate.pem -days 365

    ```


    The -x509 flag tells OpenSSL to create a self-signed certificate.-days 365 makes
    the certificate valid for one year from the date of creation. The CSR details,
    such as the organization name, common name (domain name), and email, are filled
    during execution.


