- img_proc: true
  md: 'Linux filesystems, including ext4, XFS, and Btrfs, support a fundamental set
    of file permissions categorized into three groups: user (owner), group, and others.
    Each file or directory is associated with a user, a group, and a set of permissions
    that define how the file can be accessed. The permissions are usually represented
    either in numeric (octal) or by symbolic format. Numeric permissions range from
    0 (no access) to 7 (full access), representing read, write, and execute permissions
    sequentially.


    To illustrate, here is an example of setting permissions with the octal notation:


    ```

    chmod 755 /path/to/file

    ```


    This command sets the permissions to read, write, and execute for the user, and
    read and execute for the group and others. The configuration ''755'' breaks down
    into:


    +   * 7 (user) = read + write + execute (4+2+1)

    * 5 (group) = read + execute (4+1)

    * 5 (others) = read + execute (4+1)


    In symbolic format, permissions are modified using characters ''r'' for read,
    ''w'' for write, and ''x'' for execute. For instance:


    ```

    chmod u=rwx,g=rx,o=rx /path/to/file

    ```


    This command achieves the same permission settings as the previous numeric example
    but provides a clearer visual representation of who is granted what kind of access.


    Besides standard permissions, Linux filesystems support several special permissions
    or attributes that can enhance security and system efficiency. Among these are:


    +   * Set User ID (SUID): When set on an executable file, allows the file to be
    executed with the permissions of the file''s owner.

    * Set Group ID (SGID): Similar to SUID but operates at the group level. When set
    on a directory, files created within the directory inherit the group ID of the
    directory instead of the creating user''s primary group.

    * Sticky Bit: Primarily used on directories, ensures that only the file''s owner,
    the directory''s owner, or the superuser can delete or rename files within the
    directory.


    The following command sets the SUID, SGID, and Sticky Bit respectively:


    ```

    chmod 5777 /path/to/directory

    ```


    Here, the leftmost bit ''5'' in the octal representation includes SUID (4) and
    Sticky Bit (1) alongside the usual read, write, and execute settings.


    Linux also supports file attributes accessed via the chattr command. These include,
    but are not limited to:


    +   * a: Append only'
