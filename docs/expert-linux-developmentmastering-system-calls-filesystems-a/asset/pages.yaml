  md: '# 7.10 Signal Masks and Queues


    The concept of signal masks and signal queues is pivotal in managing complex signal
    workflows in Linux systems. Signal masks serve the purpose of blocking certain
    signals from being delivered to a thread or process, thus providing a mechanism
    for signal deferral when needed. Signal queues, on the other hand, manage the
    backlog of signals that are pending delivery, allowing for ordered and selective
    signal processing based on defined priorities and characteristics.


    **Signal Masking:** Signal masking is implemented in Linux using the sigprocmask()
    function, which allows a process to specify a set of signals to be blocked from
    being delivered until the mask is changed. The core functionality of sigprocmask()
    involves modifying the signal mask of the calling thread, which effectively dictates
    whether certain signals are permitted to be handled.


    Consider the following example where a process wishes to block SIGINT and SIGTERM
    signals temporarily during a critical operation:


    ```

    #include <signal.h>

    #include <stdio.h>


    int main() {

    sigset_t sigSet, oldSet;


    sigemptyset(&sigSet);

    sigaddset(&sigSet, SIGINT);

    sigaddset(&sigSet, SIGTERM);


    sigprocmask(SIG_BLOCK, &sigSet, &oldSet);


    // Critical code section

    // ...


    // Restore the previous signal mask

    sigprocmask(SIG_SETMASK, &oldSet, NULL);

    ```'
