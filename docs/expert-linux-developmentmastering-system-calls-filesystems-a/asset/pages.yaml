    require exclusivity, minimizing mutual exclusion for others can reduce deadlock
    risks. This strategy may involve pooling or other forms of resource sharing.

    * Hold and Wait: Systems can require processes to request all resources at once,
    thus preventing a situation where a process holds resources while waiting for
    others. Alternatives include gradually releasing held resources while awaiting
    additional ones.

