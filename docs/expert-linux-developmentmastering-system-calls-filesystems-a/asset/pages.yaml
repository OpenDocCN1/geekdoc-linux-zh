    # 1.4 How System Calls Work: From User Space to Kernel Space


    To understand the transition of system calls from user space to kernel space,
    it is essential to grasp the mechanisms underlying this process. The transition
    involves a controlled procedure whereby applications in user space interact with
    the operating system at a more privileged level, namely the kernel.


    The primary initiating factor for a system call is the need for user-space applications
    to request services that are only executable within the kernel due to their privileged
    nature, such as direct hardware access and sensitive data management. The mechanism
    to achieve this is often facilitated via a software interrupt. In Linux, the software
    interrupt used is the `int 0x80`, or in more recent kernels, the `syscall` instruction
    for x86_64 architectures.


    +   1. Execution of the System Call Instruction: When a user-space application
    needs to perform an operation that requires kernel-level privileges, it executes
    a special system call instruction. This instruction temporarily transfers control
    from user space to kernel space. This is accomplished by setting up registers
    with appropriate values corresponding to the system call number and its arguments.

    2. Context Switch: Upon execution of a system call instruction, a context switch
    occurs. This is a critical phase where the system transitions from running in
    user mode (lesser privilege) to kernel mode (higher privilege). The kernel takes
    control and begins executing its code to handle the request. The CPU state is
    saved so that the system can return to the original user-space process upon completion
    of the system call.

    3. System Call Dispatch: When the kernel receives control, it uses the system
    call number placed in a register to determine which kernel'
