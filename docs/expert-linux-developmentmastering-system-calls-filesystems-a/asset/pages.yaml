    # 1.5 Creating Your Own System Calls


    Creating a custom system call in Linux requires an understanding of the kernel''s
    functionality and architecture. The process involves modifying the kernel source
    code, compiling, and then testing the kernel. For the purpose of demonstration,
    a simple system call that calculates the total of three integers will be introduced.


    Step 1: Define the System Call. First, create a new file for your system call
    in the Linux kernel source tree. Conventionally, this can be placed in the ‘linux/kernel/’
    directory. For example, create a file named ‘addthree.c’.


    ```

    1 #include <linux/kernel.h>

    2 #include <linux/syscalls.h>

    3

    4 SCALL_DEFINE3(addthree, int, a, int, b, int, c)

    5 {

    6     return a + b + c;

    7 }

    ```


    This code snippet defines a new system call, ‘addthree’, which takes three integer
    arguments and returns their sum. The macro ‘SYSCALL_DEFINE3’ is used to define
    a system call with three parameters.


