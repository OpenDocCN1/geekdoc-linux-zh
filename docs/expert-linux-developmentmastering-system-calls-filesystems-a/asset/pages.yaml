    # 2.9 Virtual Filesystems: procs and sysfs


    Virtual filesystems in Linux as procs and sysfs provide mechanisms for kernel-user
    space interactions. These filesystems do not store data but instead dynamically
    generate information about system and kernel internals in a file-like interface.
    This allows various utilities and applications to access vital information about
    the system''s state and configuration.


    procs, or the Process Filesystem, is mounted at /proc and is designed primarily
    for accessing process information and system statistics. Each running process
    on the Linux system is represented by a directory named with its process ID (PID).
    Each of these directories contains files and subdirectories providing details
    about the process state, memory usage, and internal metrics.


    +   - /proc/cpuinfo - Displays information about the CPU, such as model, vendor,
    and configuration.

