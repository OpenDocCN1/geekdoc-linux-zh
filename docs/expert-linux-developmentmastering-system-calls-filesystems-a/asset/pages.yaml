    # 3.5 Synchronization in IPC: Semaphores


    Semaphores are an essential tool in the domain of interprocess communication (IPC),
    providing a means to manage concurrent access to shared resources in multi-threaded
    and multi-process systems. They are particularly crucial in environments where
    processes share memory or files, or when coordinating order is necessary.


    A semaphore is fundamentally a counter that controls access to shared resources.
    The value of the counter indicates the number of instances a resource can be accessed
    concurrently. Typically, semaphores provide two atomic operations:


    +   * wait(): This operation decrements the semaphore counter. If the counter
    is greater than zero, access is granted, and the process continues. If it is zero,
    the process blocks until the semaphore is released by another process.


    +   * signal(): This operation increments the semaphore counter, signaling that
    a process has finished using a shared resource. This potentially unblocks a blocked
    wait() operation by another process.


    In a Linux system, semaphores are typically managed through the System V IPC mechanisms
    or the POSIX standard. Both provide a slightly different API and semantics, but
    the underlying principle of controlling access through atomic operations remains
    constant.


