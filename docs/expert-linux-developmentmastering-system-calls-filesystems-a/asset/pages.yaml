  md: '# Unmounting Filesystems


    The unmount command is used to safely detach filesystems from their mount points.
    It is crucial that no files or directories within the mount point are being used
    by applications or users. Active usage can lead to data corruption or prevent
    the unmounting process from completing successfully.


    The basic syntax for unmount is as follows:


    ```

    umount directory

    ```


    Where directory is the specific mount point. For example, to unmount the /mnt/data
    directory, one would execute:


    ```

    umount /mnt/data

    ```


    For situations where devices are stubborn or busy, options as -l (lazy unmount)
    and -f (force unmount) can be used to facilitate the unmounting process. However,
    these should be used with caution as they may lead to data loss if data is still
    being written to the disk.


    ```

    umount -l /mnt/data

    ```


    This command will perform a lazy unmount on /mnt/data, detaching the filesystem
    instantly from the file tree and cleaning up all resources once it is no longer
    busy.


    # Auto-Mounting during Boot


    To automate the mounting of filesystems at boot time, entries are made in the
    /etc/fstab file. This file contains one line for each filesystem known to the
    system, listing essential information like device name, mount point, filesystem
