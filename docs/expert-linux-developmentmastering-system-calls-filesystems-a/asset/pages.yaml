    # 2.2 Understanding Filesystem Hierarchy Standard (FHS)


    The Filesystem Hierarchy Standard (FHS) defines the directory structure and directory
    contents in Unix and Unix-like operating systems, such as Linux. It is maintained
    by the Linux Foundation and serves as a reference for software developers and
    system administrators to ensure compatibility and consistency across different
    distributions.


    The FHS categorizes all directories into three types: required, optional, and
    variable. Required directories must exist on all FHS-compliant systems, optional
    directories may exist, and variable directories are subject to change.


    +   * /bin Essential user command binaries that must be available in single user
    mode; by all users, e.g., cat, ls, cp.

    * /boot Static files of the boot loader.

    * /dev Host-specific system configuration.

    * /etc Essential shared libraries and kernel modules.

    * /mnt Mount point for mounting a temporary filesystem.

    * /opt Add-on application software packages.

    * /sbin Essential system binaries, e.g., fschk, route.

    * /usr Secondary hierarchy for read-only user data; contains the majority of (multi-)user
    utilities and applications.

    * /var Variable files—whose content is expected to continually change during normal
    operation of the system, such as logs, spool files, and temporary e-mail files.

    * /home User home directories (optional).'
  merge: -1
  pgno: 34
- img_proc: true
  md: '+   • /root - Home directory for the root user (optional).


    Each of these directories serves a specific purpose and follows guidelines that
    dictate what files should be stored in them. For example, /bin contains executable
    programs necessary for booting the system and performing basic operations, they
    need to be stored on the same partition as /. Meanwhile, /usr is intended for
    less essential program binaries and can be mounted from a different disk.


    Maintaining strict adherence to the FHS standard enables system administrators
    and software engineers to predict the location of installed files and scripts,
    leading to more predictable system behavior and better compatibility among different
    distributions.


    Additionally, it simplifies the management and configuration of systems. For instance,
    backing up system configuration files or updating system applications becomes
    more manageable when files are well-organized and every data type has its designated
    place.


    An important aspect of the FHS is how it handles user data in /home and variable
    data in /var. By separating system files and dynamic user files, the FHS minimizes
    the risk of system malfunction during routine operations and user-specific applications.
    Furthermore, system-wide configuration files in /etc allow for fine-grained control
    of the system settings, which is crucial for security and performance tuning.


    Given the diversity of file types and the complex needs of modern computing applications,
    the FHS provides a robust framework for maintaining an organized and efficient
    filesystem hierarchy. This organization supports efficient system administration
    and enhances the overall stability of Linux systems. By adhering to any standard,
    Linux systems ensure that applications can be developed that are portable across
    any FHS-compliant system without modification.


    # 2.3 Types of Filesystems: ext4, XFS, Btrfs, and Others


    Linux supports a variety of filesystems, each designed to offer specific benefits
    and tailored to particular use cases. This section delves into the attributes,
    advantages, and suitable applications of prominent filesystems such as ext4, XFS,
    Btrfs, and introduces some less commonly used filesystems such as JFS and ReiserFS.


    # ext4 (Fourth Extended Files)


    The ext4 filesystem is a widespread filesystem in Linux, standing as an evolution
    of its predecessor ext3 and offering numerous enhancements in terms of performance,
    scalability, and stability. ext4 supports up to 16 terabytes and filesystems as
    large as 1 exabyte. Notable features of ext4 include:


    +   • Delayed allocation: This improves performance and reduces fragmentation
    by delaying the allocation of disk blocks until the data is about to be written
    to the disk.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '+   * Journaling: ext4 supports journaling, which logs changes before they
    are committed to the main filesystem. This enhances reliability and recovery processes.


    +   * Extents: An extent is a range of contiguous blocks, improving performance
    over the bitmap method used in ext3 by efficiently managing files and reducing
    fragmentation.


    +   * Compatibility: ext4 is backward compatible with ext3 and ext2, allowing
    mounts of ext3 and ext2 as ext4 without conversion.


    A typical use case for ext4 includes general-purpose filesystem scenarios where
    journaling and backwards compatibility are required.


    # XFS


    XFS, designed by Silicon Graphics, is known for its ability to handle large files
    and volumes efficiently. This makes it particularly suitable for applications
    involving large-scale data operations, as as digital content streaming and big
    data analytics. Key features of XFS include:


    +   * Scalability: XFS supports systems up to 8 exabytes and file sizes up to
    9 exabytes.


    +   * Allocation groups: XFS partitions the filesystem into allocation groups,
    where each group can manage filesystems independently. This design supports high
    levels of parallelism and is advantageous in multi-threaded applications.


    +   * Journaling: XFS employs a log space to recover metadata changes and offers
    robust crash recovery mechanisms.


    +   * Delayed allocation and dynamic inode: These features contribute to the efficient
    management of disk space and inodes.


    Due to its dynamic advanced allocation mechanisms and large filesystem support,
    XFS is optimally used in environments with large files and heavy IO operations.


    # Btrfs (B-tree Filesystem)


    Btrfs is a modern filesystem in Linux that focuses on fault tolerance, repair
    mechanisms, and easy management features. Distinctive functionalities of Btrfs
    include:


    +   * Copy-on-write (COW): This feature makes it possible to maintain snapshot
    versions of files and directories, which is valuable for backup and replication
    processes.


    +   * Integrated volume management: Btrfs allows the creation of subvolumes, which
    are akin to dynamic partitions that can be resized and managed independently.


    +   * Data checksums: Btrfs goes a step further in data protection by not only
    offering metadata checksums but also for data, helping to prevent data corruption.


    +   * Dynamic inode allocation: No static inode tables, which means easier storage
    management and enhanced storage efficiency.


    Btrfs is particularly used in environments where data integrity and flexible storage
    management are crucial, such as for database storage and data centers.'
