    # 10.3 Using PAM (Pluggable Authentication Modules)


    Pluggable Authentication Modules PAM provide a flexible mechanism for authenticating
    users on

    Linux systems. PAM separates the task of authentication into independent modules
    which can be

    configured and organized under different service names.


    # Understanding PAM Architecture


    PAM operates on a module-centric architecture that revolves around the concept
    of stacking modules.

    Each service requiring authentication has a configuration file in the /etc/pam.d/
    directory,

    named after the service. This file contains a list of PAM modules that are stacked
    and executed in a

    sequence determined by the module type and control flag.


    The primary module types listed within PAM configuration files are:


    +   - auth Handles the authentication of the user.

    - account - Manages user account properties, typically checking for account expiration,
    expiration, and login hours.

    - session - Takes care of tasks that need to take place at the beginning and end
    of sessions.

    - password - Responsible for password management, allowing updates and validation.


    Each module configuration line in the PAM service follows the syntax:

    ```

    modletype controlflag modulepath arguments

    ```


    The control_flag dictates how PAM responds to the success or failure of the module
    and can include

    settings such as required, optional, or sufficient.


    # Configuring PAM


    To modify or set authentication for a program, one must configure the program''s
    associated PAM

    file. Suppose we are configuring SSH (Secure Shell). The configuration file would
    be

    /etc/pam.d/ssd.


