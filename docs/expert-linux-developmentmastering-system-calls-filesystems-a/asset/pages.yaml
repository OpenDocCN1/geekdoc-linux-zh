  md: 'Handling the interaction between user space and kernel space, while maintaining
    security and efficiency, epitomizes one of the fundamental aspects of modern operating
    systems design. Recognizing how these conceptual spaces coexist and cooperate
    enables developers to better understand underlying mechanisms at play, thereby
    creating more robust applications by appropriately utilizing system calls.


    # 1.3 Introduction to System Calls


    A system call is an essential interface between an application and the Linux kernel.
    This interface allows a running program to request a service from the kernel,
    typically operations related to low-level hardware management including input/output
    processing, memory management, and process scheduling. System calls act as a controlled
    gateway for user-space applications to interact with kernel-space resources.


    To utilize the benefits of system calls, developers must understand the various
    types of system calls available within the Linux operating system. These can be
    classified broadly into several categories:


    +   **Process control** - These system calls manage the execution of processes.
    For example, fork, exit, and execve are used to create and terminate processes
    and execute new programs.

    **File manipulation** - This involves the creation, deletion, opening, closing,
    reading, and writing of files. System calls such as open, read, write, and close
    fall under this category.

    **Device manipulation** - System calls like ioctl allow for the control of devices.

    **Information maintenance** - These system calls retrieve and set system information.
    An example is the time call, which sets or retrieves the system time.'
