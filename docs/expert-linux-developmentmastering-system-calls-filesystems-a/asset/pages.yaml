    # 8.3 IPv4 vs IPv6 Programming


    When programming networks, the shift from IPv4 to IPv6 is significant and not
    merely because of increase in address length from 32 bits to 128 bits. This transition
    affects fundamental aspects of programming and network configuration, requiring
    developers to possess clear understanding and strategies to handle both protocols
    effectively.


    IPv4 was the backbone of the internet for several decades, using an addressing
    system that accommodates about 4.3 billion unique addresses. The exponential growth
    of internet devices, IPv4 addresses are no longer sufficient, leading to the development
    and adoption of IPv6, which supports approximately 3.4 × 10³ addresses, ensuring
    scalability far into the future.


    When embarking on network programming, one of the initial considerations is the
    choice of IP protocol. This choice impacts the entire application design. Key
    differences between IPv4 and IPv6 include socket addresses, system calls, and
    adaptations to different network layers.


    +   - Socket Address Structures: IPv4 uses the sockaddr_in structure for socket
    operations, which includes an IP address and a port number. In IPv6, utilizes
    the sockaddr_in6 structure. The main difference lies in size and format of the
    address, adapting to the larger address space of IPv6.

    - API Functions: Functions like inet_pton() and inet_ntop() are critical when
    dealing with address connection in both IPv4 and IPv6. These functions are protocol-independent
    and are pivotal in ensuring that the applications are compatible with both families.

    - Dual Stack Support: An essential feature in modern systems is the ability to
    support both IPv4 and IPv6 simultaneously. Through dual-stack programming, a single
    application can handle connections over both protocols. This is often achieved
    through use of the AF_INET6 address family which can accept both IPv4 and IPv6
    connections if configured properly.


    The following example demonstrates the creation of a socket that is compatible
    with both IPv4 and IPv6 using the dual stack approach:


    ```

    1 #include <sys/socket.h>

    2 #include <netinet/in.h>

    3 #include <string.h>

    ```'
