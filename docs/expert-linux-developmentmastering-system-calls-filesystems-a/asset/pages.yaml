    # 4.8 Process Communication: Pipes, Sockets, and Signals


    Inter-process communication (IPC) is critical in the development of software that
    involves multiple processes that need to cooperate a task. Linux supports various
    IPC mechanisms including pipes, sockets, and signals, each suited to different
    scenarios and requirements.


    # Pipes


    Pipes provide a unidirectional communication channel between processes. A pipe
    operates on a producer-consumer model, where one process writes to the pipe and
    another reads from it. The simplest form of pipes in Linux is anonymous pipes,
    created using the `pipe()` system call.


    ```

    1 int fd[2]; // File descriptor array for the pipe

    2 if (pipe(fd) == -1) {

    3   perror("pipe");

    4   exit(EXIT_FAILURE);

    5 }

    ```


    Here, fd[0] is set for reading, while fd[1] is set for writing. Data written to
    fd[1] can be read from fd[0].


    Named pipes, or FIFOs, are another variation that exists in the filesystem. These
    can be accessed by unrelated processes and persist after the creating process
    has terminated.


    ```

    1 mkfifo("/tmp/myfifo", 0666);

    ```


    This code snippet creates a FIFO named ''myfifo'' in the ''/tmp'' directory with
    allows read and write permissions for all users.


    # Sockets


    Sockets provide a robust mechanism for IPC, supporting both connection-oriented
    (TCP) and connectionless (UDP) communication protocols. Unlike pipes, sockets
    support bi-directional communication and can be used only for IPC on a single
    machine but to communicate across network machines.


    Creating a socket is performed using the `socket()` call:


    ```

    1 int sockfd = socket(AF_INET, SOCK_STREAM, 0);

    2 if (socket(fd) < 0) {

    3   perror("socket");

    4   exit(EXIT_FAILURE);

    5 }

    ```


    Here, AF_INET specifies the IPv4 Internet protocols, SOCK_STREAM indicates a reliable,
    connection-based stream (TCP), and 0 is the protocol value (default protocol for
    the type).'
