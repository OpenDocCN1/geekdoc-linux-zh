    \ This relationship forms a tree-like structure that governs not the interactions\
    \ between processes but also impacts system resource management and cleanup processes.\n\
    \n**Parent and Child Relationships:** Each process in Linux is created by a unique\
    \ Process ID (PID) and is linked to a process from which it was spawned. When\
    \ a parent creates a new process through system calls as fork() or clone(), the\
    \ originating process becomes the parent of the new, child process. The child\
    \ inherits properties like environment variables and file descriptors, but has\
    \ a unique PID. This relationship forms a critical part of the process management\
    \ life in Linux.\n\n**Orphan Processes:** An orphan process occurs when the parent\
    \ process exits or terminates before the child process. In normal operations,\
    \ a child process should report its status back to its parent upon termination,\
    \ through a status code. If the parent is no longer available, the orphaned child\
    \ is automatically adopted by the init process, which has a PID of 1. The init\
    \ process handles the reaping of the orphaned child once it terminates to ensure\
    \ that resources are properly released, and no memory leaks occur.\n\n**Zombie\
    \ Processes:** A zombie process is one that has completed execution but still\
    \ has an entry in the process table. This situation occurs when the child process\
    \ has terminated, but its parent has not yet called wait() or waitpid() to read\
    \ the status. The zombie state is denoted as \"Z\" in the status field when viewing\
