    # 2.8 Advanced Features: Journaling, Encryption, and Compression


    Journaling is a crucial functionality in modern filesystems that enhances their
    reliability and reduces recovery time following an unplanned shutdown. The primary
    purpose of journaling is to record changes to the filesystem in a dedicated area
    before they are actually implemented. This sequential logging ensures that the
    filesystem can be restored to a consistent state in cases of partial writes or
    unexpected interruptions. Linux supports journaling in filesystems like ext4,
    Btrfs, and XFS.


    For instance, ext4, the journaling feature can operate in three different modes:


    +   - data=ordered — This is the default mode where only metadata is journaled,
    while actual data blocks are only written after the corresponding metadata. This
    ensures data consistency without the overhead of full journaling.


    +   - data=journal — In this mode, both data and metadata are journaled, which
    offers the highest level of integrity and is useful in scenarios demanding high
    reliability.


    +   - data=writeback — This mode allows metadata to be committed to the journal
    waiting for the data blocks to be written, which can result in faster performance
    but with a trade-off in terms of potential corruption.


    Implementing journaling requires minimal user interaction. To enable a specific
    journaling mode on an ext4 filesystem, one can use the tune2fs command. The following
    code demonstrates how to set the data=journal mode:


    ```

    sudo tune2fs -o journal_data /dev/sdxN

    ```


    Next, we explore filesystem encryption, which protects data privacy by encoding
    the file contents stored on disk. This encoding is transparent to the user but
    crucial for security, especially for sensitive data or systems that can be physically
    accessed by non-trusted parties. Linux supports filesystem encryption directly
    through mechanisms like ecryptfs and dm-crypt, with LUKS (Linux Unified Key Setup)
    being a popular implementation feature in modern distributions.


    Setting up LUKS for full-disk encryption creates an encrypted container using
    cryptsetup as shown:


    ```

    1 sudo cryptsetup luksFormat /dev/sdxN encrypted_volume_name

    ```


    ```

    2 sudo cryptsetup open /dev/sdxN encrypted_volume_name

    ```


    After these steps, any data written to /dev/mapper/encrypted_volume_name will
    be automatically encrypted when disk operations are performed.


    Compression in Linux filesystems comes with its benefits, primarily regarding
    storage efficiency and sometimes even read/write performance, depending on the
    workload nature. Btrfs and ZFS support'
