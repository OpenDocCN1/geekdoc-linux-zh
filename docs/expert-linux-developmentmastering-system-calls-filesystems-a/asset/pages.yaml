    # 4.9 Resource Limits and Controls


    Resource limits in Linux are crucial for process management, potentially impacting
    the performance of other processes or the stability of the system itself. These
    limits are managed primarily through the getrlimit() and setrlimit() system calls.
    Each resource limit is respectably associated with a resource type, defined in
    sys/resource.h header file.


    The structure used for managing resources is struct rlim. This structure includes
    two fields, rlim_cur and rlim_max. The rlim_cur represents the soft limit, which
    is the limit that the kernel enforces for the corresponding resource. The rlim_max
    represents the hard limit, which is the maximum value that rlim_cur can be set
    by a non-root process. These fields are of type rlim_t, which is typically an
    alias for unsigned long.


