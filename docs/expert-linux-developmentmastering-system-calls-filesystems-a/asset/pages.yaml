    # 5.1 Overview of Memory Management in Linux


    Memory management is a fundamental aspect of operating system functionality, critical
    for the efficiency and stability of systems. In Linux, memory management deals
    primarily with the virtual memory and physical RAM, crafting a layer of abstraction
    that allows programs to run effectively without interference. The guiding principle
    of Linux memory management, is to maximize performance while providing isolation
    and protection among processes.


    Linux uses a combination of hardware and software techniques to manage memory.
    Hardware mechanisms include the use of the MMU (Memory Management Unit), which
    translates virtual addresses to physical addresses through a mechanism known as
    paging. The Linux kernel employs several algorithms and data structures to manage
    these mappings efficiently and to handle memory protection, allocation, and deallocation.


    The kernel distinguishes between physical and virtual memory. Physical memory
    refers to the actual RAM (Random Access Memory) available on the system, while
    virtual memory extends the available memory by using disk storage as temporary
    memory storage, which is significantly slower but provides a large pool of memory
    to programs. This system ensures that each process running on a Linux system appears
    to have access to its isolated memory space, thus enhancing security and stability.


    The Linux memory management system uses three types of memory allocations:


    +   - Kernel allocation, where memory is allocated to the kernel and its data
    structures.

    - Space allocation, where memory is allocated to user processes.

    - Page allocation, where memory is managed in blocks or pages.


    The memory allocation strategies are supported by several mechanisms:'
