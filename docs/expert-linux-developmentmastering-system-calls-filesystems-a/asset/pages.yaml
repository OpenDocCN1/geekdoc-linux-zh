    will not use all the memory they request simultaneously. This optimization strategy
    can lead to significant efficiency gains in environments like virtualized systems,
    where many processes run concurrently. However, it also introduces the risk of
    the system running out of memory (OOM), a situation that can lead to application
    failures and system instability if not properly managed.


