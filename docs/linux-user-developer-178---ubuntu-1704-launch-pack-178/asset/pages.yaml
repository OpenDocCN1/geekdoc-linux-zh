    # ## What is an index?


    An index is a data structure that allows you to access data more efficiently.
    A chosen index can speed up all query operations on a database table. However,
    every index has a cost, so you should define and index indexes wisely!

    Indexing can slow down operations on tables with a large number of columns.

    Indexing, however, helps you avoid accessing all the rows of a table to find the
    one that matches your query. The more specific the value of a constant clause,
    the more the index can filter all rows where their second column is exactly 10
    or larger than 10 and so on. In dear, the more that you are not about indexes
    and the more data you have, the more useful an index can be.


