    \ entire row. If any of your tables do not have such a column, you can add an\
    \ extra column with an integer type to serve as a primary key, which by definition\
    \ makes it unique and easy to reference.\n\nSo, put simply, primary keys are fields\
    \ that allow you to uniquely identify each record in a table. A table can have\
