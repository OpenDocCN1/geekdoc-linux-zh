    # ## Learn how develop fault-tolerant applications in Erlang using OTP


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_45_0.png)


    # Resources


    Erlang

    www.erlang.org


    Your favorite text editor


    There are many kinds of applications that need to be working constantly without
    the luxury of downtime. One such is telephone, because there''s an expectation
    that calls can be made at any time on with each other. OTP stands for Open Telecom
    Platform and Erlang''s collection of open-source libraries and tools that help
    developers create fault-tolerant applications. OTP is the most important vital
    part of Erlang.


    > OTP is not the functionality of Erlang applications. But when your application
    shuts down for any reason, the second important thing to remember is that both
    the supervisor and the application are linked with each other through rules that
    help them communicate quickly and allow the supervisor to be there when needed.


    In this tutorial, we will write a simple Erlang supervisor that we will watch.
    We will observe what will happen when the application encounters problems. We
    will continue talking about OTP and present more examples for you to work with,
    but let''s get started.


    your application''s code compatible with the Erlang code of the supervisor! Once
    the supervisor detects the process fails, it automatically restarts the process.
    If you are going to write real-world applications, you will inevitably have to
    learn the OTP framework.


    # ## About OTP


    Despite the name Open Telecom Platform, OTP is more than just built on Erlang.
    It is a framework for building big projects with tools and is taking about all
    the general components required, putting them into libraries and making their
    work well and easily reusing them. As a developer the programmer has to deal with
    things that change from application to application. But this simplicity is what
    enables you to survive Erlang crashes. To order an example, we write an additional
