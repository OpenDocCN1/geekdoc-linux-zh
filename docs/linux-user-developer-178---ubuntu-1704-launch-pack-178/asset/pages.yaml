    +   How to Erlang program


    To terminate an Erlang program you will need to know its ID or be able to find
    the process using tools, such as the Observer. There are many ways to terminate
    a process. One method is calling exit(child), which takes two parameters: The
    first parameter is the process ID and the second parameter is the reason for killing.
    Although an Erlang program can handle various exits, you can specify any reason
    for exiting, which will immediately terminate the process. So, here is a simple
    example that shows the following:


    ```

    > (ok, Pid) = app:start_link().

    {ok, Pid}

    > exit(Pid, kill).

    exception: killed

    ```


