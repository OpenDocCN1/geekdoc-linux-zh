    # Administrative commands


    This section will show you how to discover the version of MySQL 8 you are using,
    before briefly showing administrative commands that can enable you to find out
    what is going on your database server. So, you can learn about your version of
    the MySQL 8 server as:


    ```

    $ mysql --version

    MySQL 8.0.22 for Linux on x86_64 (Community Server) (GPL)

    ```


    The previous command will verify that you have the correct MySQL version active
    on your Linux.

    Next, you will learn how to start and stop the MySQL 8 server, which can happen
    as follows:


    ```

    $ sudo mysql_upgrade -u root -p

    $ sudo mkdir /var/run/mysql

    $ sudo chown mysql:mysql /var/run/mysql

    $ sudo /usr/bin/mysql --skip-networking --user= 610

    ```


    The output of the last command is the process ID of the MySQL 8 server process,
    which can be found at /var/run/mysql/mysql.pid. Please note that it is important
    to execute the MySQL_upgrade command - this should be done only once. Stopping
    the MySQL 8 server process can be done as follows:'
