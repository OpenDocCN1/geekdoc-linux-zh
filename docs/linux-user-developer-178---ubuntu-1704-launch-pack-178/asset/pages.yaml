    # UBUNTU


    # Ubuntu halts development of Unity


    Canonical ends love affair with convergence


    Unity was Ubuntu''s long-term project to produce its own environment for Ubuntu
    desktop, but for a long time, it was plagued with bugs that made it unsuitable
    for potential users. However, as announced in a recent blog post by Canonical
    and Ubuntu founder, Marshall Cox is ending investment in Unity, and switching
    the desktop back to popular GNOME.


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_7_1.png)


    For a long time, Unity was the central pillar of the Ubuntu project, enabling
    a link between desktop and smartphone. Despite some decent feedback, the project
    struggled to gain and maintain traction, with a lack of Ubuntu-based smartphones
    being one of the major downfalls. And if that wasn''t enough, other closely linked
    areas were also lacking their support. The Ubuntu touch software (or Ubuntu Personal)
    was facing the choice: Convergence as Canonical p30, for more


    details), as well as Canonical''s in-house display server. Mr. latter is of particular
    interest, with Canonical switching to work on the popular Wayland display server.

    At this point, Ubuntu is far from done. "I like to embrace our passion for innovation,
    investment in and commitment to the Ubuntu desktop that millions rely on," said
    Shuttleworth in his blog post. "We want to continue producing the most open source
    desktop in the world, to maintain the expectations of our commercial partners
    to deliver desktop, to support our customers while IoT and cloud developers who
    innovate on it."


    Ubuntu''s convergence dream has come to an end


    lose access to Unity, the process will

    be drawn out over the next few months,

    giving users plenty of time to find an

    alternative platform that suits them.

    While the future may come out of the blue, Shuttleworth explained.

    "The choice, ultimately, is to invest in

    areas which are best for the growth

    of the company. As Ubuntu is itself,

    cloud cloud infrastructure provides OpenStack

    and Kubernetes, and our capabilities

    and our id story in snaps and Ubuntu Core."


