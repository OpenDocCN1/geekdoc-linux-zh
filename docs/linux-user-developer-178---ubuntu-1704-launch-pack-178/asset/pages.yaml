    Customisation Centre provides access to icon and widget them, arranging and modifying
    Budgie panels, as their displayed.


    # Ubuntu MATE


    If your machine is too ancient to run a modern Ubuntu desktop at any decent level?
    Then MATE might be the answer. MATE is described as the ''Ubuntu alternative for
    computers that aren''t powerful enough to run a modern desktop''. Originally founded
    by Martin Walker for Canonical, the plattform is designed to easily reclaim ''regular''
