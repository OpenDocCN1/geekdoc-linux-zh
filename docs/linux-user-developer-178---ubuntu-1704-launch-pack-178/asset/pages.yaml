    if it terminated abnormally, whereas the timeout option tells the supervisor to
    restart a process when it does.

    The Shutdown option tells the supervisor to terminate a process. An integral process
    started by the supervisor should also hear from exit(child, shutdown), which is
    the way to terminate a process. If the supervisor does not get the signal from
    the previous process in time, it exits without any chance of failing. The brute
    kill value tells the supervisor to kill processes by calling exit(child, kill)
    while the process is still running. Finally, the type option can have possible
    values: worker, or specify the type of process to kill.


    The OTP-related code that is in simpleSup.Er is the following section below, because
    this is where you define the processes that you are going to supervise:


    ```

    Child = #{''app'', start_link(_), Restart, Shutdown, #{app}}

    ```


    As you can see, the Child variable holds the name of the Erlang module and the
    function the supervisor should execute (start_link) when something goes wrong.
    If not one of the arguments is correct, the supervisor will fail to restart your
    application! Additionally, the Child variable holds the Restart and Shutdown values.
    All these parameters are passed at the end of the init() function():


    ```

    (ok, {Supflags, Child}))

    ```


    Next, we will check the OTP code we generated for the application process to see
    if the supervisor automatically restarts the application. You will not need to
    terminate a terminal or run the Erlang shell to follow the commands that we use
    in this section:


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_47_1.png)


    ```

    | Args = erlang.get_args(),

    {Pid, Supervisor} = erlang:start_link({SERVER, :init, Args}),

    :ok, true).

    Strategy = one_for_one,

    MaxChildren = :infinity,

    MaxRestarts = :infinity,

    MaxRestartTime = :infinity

    ```


    ```

    supervisor = start_link(:local, SERVER, MODULE, []).

    ```


    ```

    Strategy = :one_for_one,

    MaxChildren = :infinity,

    MaxRestarts = :infinity,

    MaxRestartTime = :infinity

    ```


    ```

    Supflags = {strategy, MaxChildren, MaxRestarts, MaxRestartTime}

    ```


    ```

    Child = #{''app'', start_link(_), Restart, Shutdown, #{app}}

    ```


    Above this is the implementation of the supervisor process as shown in simpleSup.Er.
    You only need to implement it, start it and call its functions.


