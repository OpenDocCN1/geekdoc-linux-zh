    # Cons


    Limited fiber optic cover vs Wi-Fi ratings, use of AC1200 routers than others
    for seeking fast internet speeds.


    # Pros


    Very easy to set up and manage; value in comparison with competitors and features
    an excellent design.


    # Summary


    This means that any three units can function as the ''router'' of the system,
    while the others are wired (which is beamed to them automatically) with Ethernet
    ports. All units are powered via USB-C.

    Setup is straightforward with Google''s hardware design, using an Android or iOS
    app to facilitate the process. The app connects your Wi-Fi network by first scanning
    the QR code on the Wi-Points. From there you can name them, set a password, then
    pair the additional Wi-Fi points and label them for reference. After that, it
    takes seconds to recognise the Wi-Fi units and begin roaming from room to room
    without getting the same depth of access, so no switching is required. For overall,
    Google Wi-Fi handles the task with great ease.

    The app offers many more useful features, like constant monitoring of your network,
    and the devices connected to it. The app also included a feature to run a mesh
    test that measures the health of your Points'' connections as well as a Wi-Fi
    test that measures your connection strength from within the network. You can also
    prioritize one device at a time, control smart home devices and pause internet


    access to devices in a family setting - all within this app.

    In terms of performance, results from the Google Wi-Fi system show that Google
    draws more speed from our 100Mbps connection, but can do so room to room without
    any loss. Web-mesh tests like Google Wi-Fi aren''t focused on much throughput
    as they are.

    The traffic prioritisation also ensures you get more of that crunch than other
    devices in your house. Plus, the network can block certain Wi-Points from being
    online or otherwise limit.

    While Google Wi-Fi operates in 2.4 and 5GHz using 802.11 mesh protocol better
    than Netgear''s 5GHz tri-band system, there''s no huge difference between either
    in terms of speed in Mbps in the 2.4GHz band from the Orbi over the Google Wifi,
    but that could be an anomaly.\Ultimately, the true benefit of Google Wifi is its
    simplicity, but coverage, for the price.

    Joe Constantine


