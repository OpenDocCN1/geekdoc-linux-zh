    \ 1\n\nhas support for the stop/0, print_message/0 and crash_me/0 functions, the\
    \ handle_call/3 function supports the get_connections()/0 function.\n\n# Explaining\
    \ the OTP code\n\nAs mentioned earlier, the OTP server of the example will have\
    \ to implement functions, start_link/0 and init/0 to supervise the code of app.\
    \ You can see the Erlang code of example_server in Figure 3 how the p48 handles\
    \ these functions.\n\nThe value of the RestState variable, which is set by the\
    \ supervisor dies, only one process gets started in its place. Other acceptable\
    \ values are one_all and rest_one. The one_all value will terminate all processes\
    \ if one crashes, while the rest_one value does something different: if a child\
    \ process dies, then the processes that were started after that child process\
    \ will be terminated, and the rest continue.\n\nPut simply, if you have two child\
    \ processes A and B, the supervisor will restart all processes A and B if one\
    \ of them crashes. However, if only process B dies, then only process B will be\
    \ restarted.\n\nMaxSecondsBetweenRestStarts parameter and the\n\nMaxSecondsBetweenRestStarts\
    \ is defined in relation to a way, when the set restarts happen in a faster period\
    \ of time than MaxSecondsBetweenRestStarts, the supervisor will terminate all\
    \ processes before killing itself, which helps to avoid an endless loop of crashes.\n\
    \nThe Restart option, which in this case is permanent, tells the supervisor to\
    \ restart a child process if it dies. Other options are transient. The transient\
    \ options to supervise a child process\n\nAcross This is the skeleton code for\
    \ an OTP supervisor - the developer has to implement the start_link/0 and the\
    \ init/0 functions\n\nWe need to implement Erlang functions. This is an easy and\
    \ simple task since these implementations need to be small and follow standard\
    \ Erlang code, which makes the development job a lot easier.\n\nOur example is\
    \ simple: it is implemented in two functions: the get_count/0 returns the number\
    \ of successful starts and the print_message/0 function prints a message on the\
    \ screen. Each time you call print_message/0 the variable that holds the count\
    \ is incremented by 1. We use one other approach: to intentionally crash the link\
    \ by trying to find the process of the supervisor.\n\nThe program and the supervisor\
    \ will be implemented in different modules, which makes perfect sense because\
    \ the code you want to supervise in the Erlang code can be found in the app.file\
    \ which we use in the simple example.\n\n# Our sample project\n\nOur designed\
    \ program does not perform any difficult tasks but uses Erlang functions that\
    \ allow the application to be controlled with the chosen behaviour.\n\nThis means\
