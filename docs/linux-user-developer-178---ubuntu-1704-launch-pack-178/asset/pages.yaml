  md: '# GIMP


    # Drawpile


    # GIMP continues to provide users with tools to get the job done


    Can Drawpile''s multi-user support make it the winner here?


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_82_0.png)


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_82_1.png)


    +   GIMP has a wide variety of tools on offer, which should cater for both new
    and seasoned designers alike


    +   Other users can make edits to your images in Drawpile, thanks to the onboard
    collaboration system


    # Design and Ui


    GIMP''s UI has done some improvements in the recent 2.8, there are all the usual
    tools and menus to navigate through, but GIMP is one of the few editors that can
    be used ''straight out of the box''. There is little that users can do to customise
    the look and feel of GIMP, while there is nothing wrong with it default, the lack
    of freedom is a disappointment.


    # Design and Ui


    The management tools are a noticeable feature when loading Drawpile. They are
    handy for importing and exporting files in a matter of seconds. However, many
    of its core tools hide behind various menus, some of which can be a little taxing
    to navigate without it. It provides a relatively quick and stable user interface
    throughout.


    # Tool selection


    Tool selection help is an efficient way to manage all your editing tools without
    the need for navigating between different menus, but some could do with being
    bundled together. A few tools also have additional features, which can be accessed
    with a right click of your mouse, without looking at the documentation, you wouldn''t
    know this existed.


    # Tool selection


    Drawpile''s greatest area is its choice of embedded editing tools. Basic drawing
    and shaping tools are here, but they lack the additional options we need here.
    However, we did find that the included brushes are quite comfortable and offer
    some ways of improving your images.


    # Advanced features


    Linux aficionados will find great pleasure in GIMP''s support for multiple programming
    languages. Scripted image manipulation is a real possibility here there is support
    for Python, Perl and native. GIMP has also documented how to get started image
    management you please.


    # Advanced features


    As well as management tools its shining height is the reason we recommend checking
    it out. It is one of the few image-editing suits that also offer import tools.
    These tools are very useful if you need specific colours in your images, and can
    also be used to remove grainy portions of your portraits.


    # Extras and plugins


    On top of its editing features, GIMP also gives users the capabilities to work
    with a series of industry-standard colour management features. They coincide with
    other programs, although the integration is a little ropey, and some of these
    programs simply won''t work on older or low-resource machines.


    # Extras and plugins


    Drawpile does try to be a little different from the rest, and it does succeed,
    for the most part. While multiple people to work on the same project simultaneously,
    with each having access to the same set of tools. Initially it can be a little
    on the difficult side, but this is just a small annoyance in the scheme of things.


    # Overall


    The only real drawback with GIMP is that it doesn''t have the customisation that
    Krita brings to the table. Being said, its tool selection remains second-to-none.


    # Overall


    Drawpile does try to be a little different from the rest, and it does succeed,
    for the most part. While the collaboration feature is great, further work needs
    to be elsewhere.


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_82_2.png)'
