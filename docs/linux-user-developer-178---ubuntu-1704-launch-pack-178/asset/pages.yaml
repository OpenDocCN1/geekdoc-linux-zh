    \ snap\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_28_0.png)\n\n```\n### snapcraft-hello\n\
    $ snapcraft hello-world\n$ cd hello-world\n$ touch hello.py\ncat <<EOF\nprint\
    \ \"First snap project (Ubuntu))\nimport sys\nif __name__ == \"__main__\":\n \
    \   if len(sys.argv) > 1:\n        print(f\"Hello {sys.argv[1]}!\")\n    else:\n\
    \        print(\"Hello world!\")\nEOF\nchmod +x hello.py\nsnap build hello-world\n\
    snap install hello-world_latest_amd64.snap\n```\n\n```\n### snapcraft-hello\n\
    $ snapcraft hello-world\n$ cd hello-world\n$ touch hello.py\ncat <<EOF\nprint\
    \ \"First snap project (Ubuntu))\nimport sys\nif __name__ == \"__main__\":\n \
    \   if len(sys.argv) > 1:\n        print(f\"Hello {sys.argv[1]}!\")\n    else:\n\
    \        print(\"Hello world!\")\nEOF\nchmod +x hello.py\nsnap build hello-world\n\
    snap install hello-world_latest_amd64.snap\n```\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_28_1.png)\n\
    \n```\n### snapcraft-hello\n$ snapcraft hello-world\n$ cd hello-world\n$ touch\
    \ hello.py\ncat <<EOF\nprint \"First snap project (Ubuntu))\nimport sys\nif __name__\
    \ == \"__main__\":\n    if len(sys.argv) > 1:\n        print(f\"Hello {sys.argv[1]}!\"\
    )\n    else:\n        print(\"Hello world!\")\nEOF\nchmod +x hello.py\nsnap build\
    \ hello-world\nsnap install hello-world_latest_amd64.snap\n```\n\n# 01 Preparing\
    \ for snap development\n\nIn order to run snaps on your Ubuntu machine, you'll\
    \ need to install pre-requisites. If you're running Ubuntu, you'll need to effectively\
    \ install an Ubuntu craft-core. Use snap install classic --devmode and then launch\
    \ the snap with sudo snap. If you want to develop a snap, you'll need to install\
    \ dependencies. Snapcraft uses plugins to handle the build requirements:\n\n#\
    \ 02 Create the base snap\n\nAs we are going to starting from scratch, you'll\
    \ need to create a directory for your snap (preferably in your home directory)\
    \ and use a simple template as the start. In your terminal, run `mkdir hello`\
    \ and `snapcraft init`. This creates a snapcraft.manifest file. This manifest\
    \ will contain properties we use:\n\n# 03 Describe the snap\n\nIn the editor of\
    \ your choice, you'll be editing the manifest file. Here you'll define the name\
    \ of your snap. The version should be a human readable string, independent from\
    \ the version, summary is a short-line description of your snap and description\
    \ is a longer version used to identify it. builds will be published to the snap\
    \ channel. Finally, confinement must be devise or use dev mode.\n\n# 04 Add a\
    \ part\n\nSnaps can contain multiple parts - a simple snap might contain only\
    \ one part source or source plugin. You can pick a repo, tarball, or directory.\
    \ Snapcraft includes a host of parts, but for now, we'll just create one part\
    \ called 'hello-hello' from the source and we'll include a tarball from the GNU\
    \ project. To configure it run `configure --base make` which adds the lines to\
    \ show your manifest.\n\n# 05 Building and install\n\nNow that you've finished\
    \ the first part, you'll need to build your snap. If you're missing some optional\
    \ dependencies such as 'autopush', then they'll be installed at this point after\
    \ running snap build. Install the snap with `snap install --devmode hello_2.18_amd64.snap`.\
    \ If it doesn't work, you'll check the logs. Now we just need to define a command\
    \ for our snap.\n\n# 06 Defining a command\n\nTo expose commands to users, you'll\
    \ need to define them in the manifest file. You can define the name of your snap\
    \ as before and then you'll be in business. Remember to use `devmode` in the manifest\
    \ first part! Now that everything works, we can create a snap that can be installed\
    \ without flags. Non-classic snaps are not uploaded, unless you want to share.\
    \ Create an Ubuntu account and upload snap to avoid this issue."
