    and code.


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_74_0.png)


    # 02 Fresh SD card install


    Before you start, it is recommended that you use a new SD card with a fresh image
    of the Raspberry Pi''s operating system. You can download the operating system,
    directly from the Raspberry Pi website at https://www.raspberrypi.com/software/
    using your preferred method. This project setup was tested using the Pi OS image.


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_74_1.png)


    # 03 Update the Pi


    Boot up your Raspberry Pi. At this stage you need to connect your Xbox 360 controller
    or Oculus Rift. When loaded, use the LXTerminal and update and upgrade the OS
    using the two lines below. This may take some time.


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    # 04 Install the Xbox 360 controller drivers


    Now install the package dependencies for the Xbox 360 controller. You can link
    the library by adding the code using -upgrade to the end of the line. First install
    sudo then install the images. Use the two lines below as press Enter.


    ```

    sudo apt-get install -y libhid-usb0 xboxdrv

    sudo pip install pi3d==14

    ```


    # 05 Install the VR software - part 1


    The VR-Version is available from the GitHub and is easily downloaded using the
    git clone command. Type cd vr-python to move to the folder (line two) and run
    the program (three lines). This deploys the software to interact with the hardware,
    3D software and VR environment.


    # 06 Install the VR software - part 2


    Once the installation is complete, select and install the line one which enables
    the data from the Oculus Rift to be read and written with. Type line one into
    the LXTerminal and press Enter, then line two to link to the required module.
    Enter line three to link all the required libraries:


    ```

    sudo dpkg -i install-openhelper_0.0.1_armhf.deb

    sudo apt-get install -f

    sudo ldconfig

    ```


    # 07 Copy the configuration files - part 1


