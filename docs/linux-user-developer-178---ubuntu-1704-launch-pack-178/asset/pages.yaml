  md: '# # Reviews


    81 Group test | 86 Hardware | 88 Distro | 92 Free software


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_80_0.png)


    # ## GROUP TEST

    # Image editors


    The choice of Linux-based image editors is overwhelming, so which application
    is the best at breathing new life into your images?


    **Pinta**

    While not that well-known, Pinta helps strip the complexity usually found in image-editing
    programs and provides users with all the tools they need to make small enhancements
    to images. With a range of adjustment and effects also on hand, could this be
    a dark horse?


    **Krita**

    For accustomed to image-related operations on Linux, Krita will be a recognisable
    name. Its core software has grown through a myriad of changes, but it remains
    a powerhouse for artists. Content additions to its selection of tools has helped
    it garner a user base of new and advanced users alike.


    **GIMP**

    The GNU Image Program, or GIMP to most of us, is all going strong, despite its
    initial release around 19 years ago. Since then, it''s fast become one of the
    more user-friendly editors, but how does it stand up against some of the more
    substantial editors out there?


    **Drawpile**

    While it may look like options in its field, Drawpile offers some standout features.
    By far its most used feature is its system that enables multiple users to work
    on the same project simultaneously, however it may boast the same usability as
    most of the others in this group test? Let''s find out.'
