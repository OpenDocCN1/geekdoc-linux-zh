  md: 'WordPress, Drupal and Joomla site, as well as Google, Facebook and Wikipedia!
    The new, MySQL 8 comes with a plethora of new features and changes including the
    following:


    +   * Support for roles, which are essentially collections of privileges


    +   * A transactional data dictionary.


    +   * Many InnoDB enhancements.


    +   * Many JSON improvements in the optimizer.


    +   * Support for common table applications.


    Additionally, you will find some things that were removed from MySQL 8:


    +   * The sync_frm system variable has been removed.


    +   * The mysql_db_executable is no longer available and has been removed because
    it is not compatible with the suitable parameters.


    +   * The InnoDB server library is now more.


    +   * The myinfo utility has also been removed


    +   * There is no longer support for the Dtrace utility


    After all the changes it is big and might frighten you, the experienced developer
    has to adapt is likely to find that most changes will not affect you.


    # Why use MySQL 8?


    Sooner than later, MySQL 8 will come with almost any Linux database and replace
    older MySQL versions. Once you know why, it will be for you. But what are the
    advantages of using MySQL 8? First, MySQL 8 can support tables with a large number
    of records, which will support your web applications and databases with massive
    amounts of data. MySQL 8 is also easier to administer, as it is the standard language
    for querying and most all programming languages offer support for MySQL. MySQL
    8 is also faster than its predecessors, and it uses more modern technologies and
    algorithms than the previous versions.


    Additionally, after a small amount of time, you will be able to find tutorials
    or books about the older MySQL 8, so you may well start preparing for the change!


