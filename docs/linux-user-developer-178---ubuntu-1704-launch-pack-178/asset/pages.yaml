    If regular Ubuntu is the ''heavyweight'' and Mate and Ubuntu are at the other
    end of the scale, Xubuntu is probably the middle ground. Xubuntu believe that
    ''you should be able to get system performance to you care about'', which makes
    use of lightweight software and just the right of applications to enable the task
    at hand, whether you are on a powerful machine or something much more modest.
    Xubuntu is based on the Xfce environment, which is fast and light on system resources,
    while still appealing and user friendly. With the Xfce environment being so versatile,
