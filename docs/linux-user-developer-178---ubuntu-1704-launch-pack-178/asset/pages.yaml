    # ## The necessary theory


    Behaviors are at centre of all OTP applications and are like a contract between
    two parties that define the way they communicate with each other. We''ll cover
    the mechanics, but what needs to be implemented for the gen_supervisor behavior
    is listed below with what:


    +   1. init/1 function is used for setting up the server process.

    2. handle_call/3 is used for handling synchronous calls.

    3. handle_cast/2 is used for handling asynchronous calls.

    4. handle_info/2 handles no other messages.

    5. terminate/2 is what its name means including process class.

    6. code_change/6 function is used for upgrades or downgrades.


    A developer should take good care of separating the actual functionality of the
    application from the high-availability and fault-tolerant parts that are taken
    by the supervisor from the application.


