  md: '# Feature Ubuntu 17.04


    Right Installed snaps live in the /snap directory, which you can browse manually


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_27_0.png)


    Right Snapweb (sudo apt install snapweb) provides a web interface to snaps on
    localhost port 420


    After you''ve installed a Snap, it''s incredibly easy to update, courtesy of the
    Ubuntu Software Centre. That''s right, it actually becomes much easier, not for
    initial installation and distribution but for updates. The most widely used format
    for today is apt and that it is driving adoption from others, including Dell,
    HP, Mozilla, LibreOffice, as many as many. Strangely, the support from Canonical
    and Ubuntu will help tap less popular distribution for anyone, as a container
    built with Ubuntu in mind will still work elsewhere.


    So how does a snap work? It''s really a zip file (sound family, JAVA JAR users/Android
    APK packs). Included in the file is a metadata file, an icon and the


    application with its dependencies. When the snap is installed, it will be mounted
    at /snap/<name>/current and ready to run. Snaps bring-needed additional security
    to the Linux platform as they are sandboxed (in, they are isolated from the underlying
    system and other applications), are read-only and segregated data. Although they
    are sandboxed, snaps can communicate with each other using service ''interfaces'',
    with ''plugs'' and ''slots''.

    Snaps from the command line is a great way to get ideas of how they work - so
    let''s try the ''hello'' world tour. Come from anywhere, you''ll search the Ubuntu
    store and only see ''promoted'' snaps - those that have been reviewed and vetted
    for security. Try the command `snap find hello` and see the result. Now you have
    the snap, and you can install it. We use the command `snap install hello`. It''s
    just like any other app, type ''hello'' and it will run. You can see all the snaps
    installed with `snap list`, which will tell you the version, unique revision and
    the developer details. And when you''re ready to update, just do `sudo snap refresh`.


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_27_1.png)


