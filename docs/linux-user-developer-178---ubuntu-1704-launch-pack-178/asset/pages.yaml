  md: "# # Can we make this easier?\n\nLIKELY AND VERY, UNLIKELY. You can then check\
    \ to see how much emotion is in the face. To see what the values are, you can\
    \ use the following code:\n\n```\njoy = str(response['responses'])\n[0]['faceAnnotations'][0]\n\
    ['Likelihood']][0]\nheadrow = str(response['responses'])\n[0]['faceAnnotations'][0]\n\
    ['Likelihood']][0]\nsprise = str(response['responses'])\n[0]['faceAnnotations'][0]\n\
    sorrow = str(response['responses'])\n[0]['faceAnnotations'][0]\n['Likelihood']][0]\n\
    joy = str(response['responses'])\n[0]['faceAnnotations'][0]\n['Likelihood']][0]\n\
    print(\"Happy: \" + str(happy))\nprint(\"Surprise: \" + str(surprise))\nprint(\"\
    Sorrow: \" + str(sorry))\n```\n\n```\njoy = str(response['responses'])\n[0]['faceAnnotations'][0]\n\
    ['Likelihood']][0]\nif joy == \"VERY_LIKELY\":\nif headrow == \"VERY_LIKELY\"\
    :\nunlock_system()\n```\n\nThe vision service can be used for other recognition\
    \ tasks, such as detection of objects within a given image. With it, you could\
    \ send an image of your living room and get back whether your cat is in it.\n\n\
    This article uses the Google Cloud API client to make requests to the vision service.\
    \ If you are only going to be using the Google Cloud services, there is a specific\
    \ module that supports only these services. You can install it:\n\n```\npip install\
    \ --upgrade google-cloud-vision\n```\n\nThe equivalent to the facial recognition\
    \ in the main article would look like this:\n\n```\nimport io\nfrom google.cloud\
    \ import vision\nclient = vision.Client()\nwith io.open('path/to/image.jpg', 'rb')\
    \ as image_file:\n    content = image_file.read()\n    image = vision.Image(content=content)\n\
    \    faces = client.detect_faces(image)\n    for face in faces:\n        print(f'Face:\
    \ {face.detection_annotation}')\n```\n\nYou can now tailor the behavior of your\
    \ code based on results. For example, if someone is sad, you could ask the user\
    \ what is wrong, in the following example:\n\n```\nif (sorry == \"VERY_LIKELY\"\
    ):\n    print('you looks sad. Do you want to talk about it?')\n```\n\nSince Raspberry\
    \ Pi is capable of detecting physical objects with its pins, you could also use\
    \ it to control home automation, like lighting LEDs or reacting to events.\n\n\
    The Vision service can also return the same call to the facial recognition request\
    \ service. If you wanted to see if someone was wearing a hat, some headwear. Using\
    \ data, the following code could be used to unlock the doors to your clubhouse:\n\
    \n```\ndescription = str(response['responses'])\n[0]['labelAnnotations'][0]\n\
    ['description']\nif (description == 'cat'):\n    print('there is a kitty!')\n\
    ```\n\nIn this case, we use the same type of service request as before. Except\
    \ that the type of request is changed from 'FACE_DETECTION' to 'LABEL_DETECTION'.\
    \ If you want to detect objects outside, you can use the method for detecting\
    \ features within a given image. It is used to identify specific landmarks and\
    \ their geographical location, along with a confidence score. For example, to\
    \ find out who your favourite rival is, you could provide their photo.\n\nWith\
    \ all the power of the Google service, you can build a more responsive Pi person\
    \ to interact with you. As you are building a robot that responds to your commands\
    \ using the Google artificial intelligence engine, you will have a system that\
    \ is capable of amazing functionality.\n\nThe big advantage of using this Python\
    \ API client is that everything is accessible as a method or property of the objects\
    \ classes. You can create image and also detect faces, and call `detect_faces()`\
    \ to access the labels. It returns objects without parsing JSON manually.\n\n\
    You also have the benefit to do the processing off-site. Too, if you have a camera\
    \ in a remote location, you can use the Raspberry Pi there to send the images\
    \ back to the Google Cloud services. The code would look like this:\n\n```\nclient\
    \ = vision.Client()\nimage = vision.Image(source=uri)\nlabels = client.detect_labels(image)\n\
    for label in labels:\n    print(label.description)\n```\n\nThe variable uri will\
    \ point to the image location for the Pi camera. This code will identify the objects\
    \ within your images."
