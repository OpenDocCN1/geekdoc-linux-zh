    # Linux users can finally

    ''Netflix and chill''


    Netflix bingeing is now a real possibility on Linux with the Firefox browser


    It''s been a long time coming, but Linux users can finally get a full and plugin
    Netflix experience using the Firefox browser. In a recent update by Mozilla, Firefox
    now includes support for the variety of DRM graphics to play Netflix. Until recently,
    users had to essentially trick their browser to get Netflix functionality, but
    this new update requires additional plugins to work.


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_10_0.png)


    One of the best things about this update is that Linux users can now take further
    with the original quality playback. One is also to optimize quality of files,
    and months to come, could allow for high-resolution machines to take advantage
    of 4K playback. In the latest update,


    Engineering Manager Nicholas Eddy, says the news about its HTML5 developments:


    > "Our excitement over HTML video has remained strong over the past four years.
    Plugin-play back that works seamlessly on all major platforms helps us deliver
    experiences no matter how you watch it. This is just the beginning!"


    Linux users want to get their streaming fix, head across to Mozilla''s Firefox
    site and source resources available. If you''re downloading, check out their free
    trial!


    # VIRTUAL REALITY


    # SteamVR makes Linux beta debut


    Valve officially launches its VR service for Linux


    Valve has been following Linux users a lot for a few years now, but with the recent
    to finally launch its VR service beta, this partnership shows no signs of slowing
    down.


    For Linux developers, Valve has opened a variety of tools for creation of content
    for the HTC Vive and associated hardware. In its current state, the program is
    very much in the beta phase. Access to the kernel NVIDIA driver is available,
    which acts as a successor to OpenVR.


    However, it is important to note that current restrictions do apply. Development
    is currently limited to a few graphical, with limited graphics support at all.
    Limitations to remain compatible headset elements have also been noted, and the
    ability to switch between different display models.


    Despite these caveats, the official launch means within the next couple of months,
    all Linux users will be able to reap the benefits of virtual reality gaming. If
    you could just wait in time...


