    Your source of Linux news & views


    # DISTRIBUTION


    # # OpenELEC 8.0 now available with Pi support


    The entertainment distribution is better than ever


    OpenELEC has gained a reputation as being the premier entertainment-focused distribution
    on the market, so we know plenty of you will be excited to hear that the official
    8.0 update has now made available. Primarily powered by the new OpenELEC 8.0 kernel
    it releases updated components, which have proven vital to the distribution''s
    previous versions. Updates to the kernel, PulseAudio, and Samba are all present,
    while the lesser-known Gini and Bliss have also received much needed attention.


    Dig little deeper and eye-eyed user will also see a lot of omissions from the
    new update. There isn''t any support for NFS, ISIS and NDB network boot and there''s
    a surprising removal of the HFS filesystems. In the time of writing, there''s
    no official reason for some of these changes.


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_9_0.png)


    > You can create a wireless media box out of the single-board computer without
    buying more components


    However, the biggest news is that it''ll be one of the first to claim full credit
    for the Raspberry Pi. OpenELEC makes a near-faultless transition onto the Pi,
    enabling users to create a wireless media box out of their single-board computer
    without buying any additional components. OpenELEC 8.0 supports for the popular


    WeTek''s latest media boxes, with integrated 4K come as a standard. Despite some
    omissions, OpenELEC 8.0 looks to be a great release for the development team,
    and the added Raspberry Pi support is the cherry on top. Interested users should
    go across the official OpenELEC site for all available downloads and for more
    information on the update.


    # # LINUX FOUNDATION


    # # Intel Data Plane added to Linux Foundation


    Users can transfer data packets efficiently


    The Linux Foundation has rapidly acquiring a vast of diverse projects, many of
    which are benefiting from the support of the community that they can count on.

    The latest to join its over-expanding list of projects is the DPDK, which was
    originally created in 2010, offering a set of tools for the transfer of data packets
    across various servers. Infrastructure open started the project in 2013, stalling
    support has seen join the Linux Foundation.


    Now that DPDK is an official Linux Foundation project, it will benefit from free
    hosting that has all within the foundation''s umbrella. With other projects, the
    Linux Foundation can provide free assistance needed, which is particularly helpful
    for managing the murky world of open-source software.

    Jim Zemelin, Executive Director of the Linux Foundation, is excited about its
    latest acquisition: ''An open structure will encourage continued growth


    and in investment. ''We believe the DPDK developer community will quickly grow
    in their new home and fuel rapid innovation in networking.''

    The DPDK is a stellar group of projects, which includes Intel, Red Hat, Huawei
    and ZTE to name a few. Although not confirmed at the time of writing, it is expected
    Intel will soon make more of its other open-source projects to the Linux Foundation
    later this year. We will include more news in future issues.


