    \ connected to a limited number of peripherals to computers while providing high\
    \ bandwidth. For storage media and de- ADCs or DACs, the interface can handle\
    \ a variety of displays. In this tutorial we have a 128x64 display we purchased\
    \ from AliExpress for relatively low price - we got ours for less than $5 each\
    \ from a supplier in China. The choice was for many reasons. First of all, the\
    \ price is significantly lower.\n\nwith our displays requires control of both\
    \ GPIO and SPI. Setting the GPIO pins was sufficiently discussed in the previous\
    \ issue, which means that we will focus on SPI here.\n\n# ## Complex configuration\n\
    \nConnecting a display to the SPI1306 controller is possible on various single-board\
    \ computers including the Arduino and Orange. To find out how it works on the\
    \ Raspberry Pi3 running OpenWRT.\n\nWhile we could, in theory, access SPI by directly\
    \ writing into the various bits of the controller found mapped memory, a cleaner\
    \ solution, is to use the /dev interface. First of all, it does not require us\
    \ to access sensitive memory which could cause problems. Using the kernel kernel\
    \ modules ensures a higher degree of portability. Code directly accessing the\
    \ hardware would be hardware-specific and the board connector would be very unlikely\
    \ to work when confronted from a different architecture.\n\nBefore starting the\
    \ implementation of the driver, let's take a look at the schematics. In SPI, junction\
    \ is simple. The line MOSI (Master Slave In) and the line MISO (Master Slave Out)\
    \ are for the other direction. The clock pulses, while one or more chips selects\
    \ lines that enable the master and slave communication.\n\nIn the last issue,\
    \ the kernel must be configured. After that, it's recommended to use the numerical\
    \ memory mapping. Using one of the kernel modules on the /dev/spi-x/y device is\
    \ the best way to access the SPI modules on the Linux. The number of modules available\
    \ depends on the target hardware, and the spi-mod-ssd1306 kernel is unlikely to\
    \ be found on a good working with a non-broadband architecture.\n\nDisplays based\
    \ on the SPI1306 controller expand their relatively simple interface with a trick:\
    \ three pins (for Data/Control) instead of four. The display controller unit should\
    \ be connected to the SPI transceiver. This way, commands can be written into\
    \ the control not without having delays, which would slow down buffer transfers.\
    \ It is a cursory glance at the schematics to that interfacing\n\n```\n# /root/dev/spi0.0\n\
    \  - audio mckblk1p tty3 tty56\n  - audio mckblk1p speed0.1 tty3 tty57\n  - bus\
    \ network_latency speed0.1 tty3 tty58\n```\n\n# Resources\nOpenWRT\n@openswrt.org\n\
