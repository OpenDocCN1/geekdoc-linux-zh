    Linux is much better than the Linux in the Kremlin.


    Above Linux users are sorry.


    In the year of keeping things, there are two things one can expect to see every
    April Fools Day. The first is an IETF (Internet Engineering Task Force) RFC (Request
    for Comment) which contains most of the standards that underpin the Internet as
    we know it. New standards are presented in the form of "RFC" which may be adopted
    or rejected. Many April Fools exist, in the particular RFC1149 (IP Datagrams over
    Avion Carriers) actually implemented last year using a Linux tunpacket driver
    in userspace to provide a pigeon tunnel - how crazy!). This example used RFC8136
    (mandating the anarchy of the year) on all IPv4 packets as a flag to indicate
    a preference for IPv6 transition and my personal favorite, RFC2535, which mandates
    the use of complex numbers, as well as a floating point for internet addresses,
    with special use for primes.


    This year''s a little bit more topical, with one "Donald Trump" taking a stand
    against the "small" group of elites in the corrupt MAINTAINERS file "who for long
    [have] existed". The Inevitable joke is back in time, so reference to a literal
    "Great" movement


