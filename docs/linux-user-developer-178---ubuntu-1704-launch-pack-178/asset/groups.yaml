    # Tutorial Erlang\n\n## Program in Erlang: Erlang and OTP\n\nMihalis Tsoukalos\n\
    \nMihalis is an administrator, programmer (UNIX) and mathematician. He has been\
    \ using Linux since 1993. Contact him at @mactouk.org\n\n## Learn how to develop\
    \ fault-tolerant applications in Erlang using OTP\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_45_0.png)\n\
    \n# Resources\n\nErlang\nwww.erlang.org\n\nYour favorite text editor\n\nThere\
    \ are many kinds of applications that need to be working constantly without the\
    \ luxury of downtime. One such is telephone, because there's an expectation that\
    \ calls can be made at any time with each other. OTP stands for Open Telecom Platform\
    \ and Erlang's collection of open-source libraries and tools that help developers\
    \ create fault-tolerant applications. OTP is the most important vital part of\
    \ Erlang.\n\n> OTP is not the functionality of Erlang applications. But when your\
    \ application shuts down for any reason, the second important thing to remember\
    \ is that both the supervisor and the application are linked with each other through\
    \ rules that help them communicate quickly and allow the supervisor to be there\
    \ when needed.\n\nIn this tutorial, we will write a simple Erlang supervisor that\
    \ we will watch. We will observe what will happen when the application encounters\
    \ problems. We will continue talking about OTP and present more examples for you\
    \ to work with, but let's get started. your application's code compatible with\
    \ the Erlang code of the supervisor! Once the supervisor detects the process fails,\
    \ it automatically restarts the process. If you are going to write real-world\
    \ applications, you will inevitably have to learn the OTP framework.\n\n## About\
    \ OTP\n\nDespite the name Open Telecom Platform, OTP is more than just built on\
    \ Erlang. It is a framework for building big projects with tools and is taking\
    \ about all the general components required, putting them into libraries and making\
    \ their work well and easily reusing them. As a developer the programmer has to\
    \ deal with things that change from application to application. But this simplicity\
    \ is what enables you to survive Erlang crashes. To order an example, we write\
    \ an additional Erlang module, and you will need to\n\n## The necessary theory\n\
    \nBehaviors are at centre of all OTP applications and are like a contract between\
    \ two parties that define the way they communicate with each other. We'll cover\
    \ the mechanics, but what needs to be implemented for the gen_supervisor behavior\
    \ is listed below with what:\n\n- 1. init/1 function is used for setting up the\
    \ server.\n- 2. handle_call/3 is used for synchronous calls.\n- 3. handle_cast/2\
    \ is used for asynchronous calls.\n- 4. handle_info/2 handles other messages.\n\
    - 5. terminate/2 is what its name means including process.\n- 6. code_change/6\
    \ function is used for upgrades or downgrades.A developer should take good care\
    \ of separating the actual functionality of the application from the high-availability\
    \ and fault-tolerant parts that are taken by the supervisor. For the gen_supervisor\
    \ behavior you will need to use the functions provided by it. For the supervisor\
    \ behavior you will need the functions provided in Figure 1. To implement a supervisor\
    \ for an Erlang server, you will\n\n```erlang\n-module(example).\n-behaviour(supervisor).\n\
    -export(start_link/0).\n-export(init/0).\n\n-define(SERVER, MODULE).\n\nstart_link()\
    \ ->\n    init('Start').\n\ninit() ->\n    init('child'),\n    ok(Supervisor,start(One)).\n\
    ```\n# Figure 1\n\n## Explaining the code\n\nAs mentioned earlier, the OTP server\
    \ of the example will have to implement functions start_link/0 and init/0 to supervise.\
    \ You can see the Erlang code of example in Figure 2 how it handles these functions.\
    \ The value of RestState, which is set by the supervisor dies, only process gets\
    \ started in its place. Other acceptable values are one_all and rest_one. The\
    \ one_all value will terminate all processes if one crashes, while the rest_one\
    \ value does something different: if a child dies, then the processes that were\
    \ started after that child will be terminated, and the rest continue. Put simply,\
    \ if you have two processes A and B, the supervisor will restart all processes\
    \ and B if one of them crashes. However, if only process B dies, then process\
    \ B will be restarted. MaxSecondsBetweenStarts parameter and the defined in relation\
    \ to a way, when restarts happen in a faster period of time than MaxSecondsBetweenStarts,\
    \ the supervisor will terminate all processes before killing itself, which helps\
    \ to avoid an endless loop of crashes. The Restart option, which in this case\
    \ is permanent, tells the supervisor to restart a child process if it dies. Other\
    \ options are transient. The transient options to supervise a child process this\
    \ is the skeleton code for an OTP supervisor - the developer has to implement\
    \ the start_link/0 and init/0 functions This is an easy and simple task since\
    \ these implementations need to be small and follow standard Erlang code, which\
    \ makes the development job lot easier. Our example is simple: it is implemented\
    \ in two functions: the get_count/0 returns the number of starts and the print_message/0\
    \ function prints a message on the screen. Each time you call print_message/0\
    \ the variable that holds the count is incremented by 1. We use one other approach:\
    \ to crash the link by trying to find the process of the supervisor. The program\
    \ and the supervisor will be implemented in different modules, which makes perfect\
    \ sense because the code you want to supervise in the Erlang code can be found\
    \ in the app.file which we use in the simple example.\n\n# Our sample project\n\
    \nOur designed program does not perform any difficult tasks but uses Erlang functions\
    \ that allow the application to be controlled with the chosen behaviour. This\
    \ means that any program can be monitored by OTP and become highly available and\
    \ fault tolerant, thanks to the Erlang statement that defines the behaviour that\
    \ it will be used:\n\n- behaviour(gen_server).\n\nThis line Erlang explains that\
    \ the app.file will implement the gen_server and gives permission, as to implement\
    \ the link, for a supervisor to watch it. Please note that you can use either\
    \ behaviour(gen_server) or behaviour(gen_server). As you will see, the gen_server\
    \ behaviour will have to do with the names and the definitions of functions. If\
    \ you do not start the application using the start_link/0 and execute the init/0\
    \ function afterwards, you will not be able to communicate with the application\
    \ unless you manually restart it using start_link. Figure 2 shows the full Erlang\
    \ code of app.file where handle_case/2 you see that the implementation of handle_case/\n\
    \n```erlang\n-module(app).\n-behaviour(gen_server).\n-export(start_link/0, init/0,\
    \ handle_call/3, handle_cast/2, handle_info/2).\n\nstart_link() ->\n    gen_server:start_link(module(),\
    \ [], init(), [], [], [], []).\n\ninit() ->\n    {ok, {Count = 0}}.\n\nhandle_call(get_count,\
    \ _From, {Count = Count}) ->\n    {reply, ok, {Count = Count + 1}}.\n\nhandle_cast(print_message,\
    \ _From, State = Count}) ->\n    io:format(\"Count is ~p~n\", [Count]),\n    {noreply,\
    \ State}.\n\nhandle_info(_Info, State) ->\n    {noreply, State}.\n```\n# Figure\
    \ 2\n\nLeft this is the code of app.file where you can see the implementation\
    \ of the functions required for supporting the gen_server.\n\nwww.lukuxer.com\
    \ 47\n"
  mdcn: "\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_44_0.png)\n\n现在开始编译程序。如果进程计算机和显示器之间的所有连接都是正确的，屏幕上将出现一个由稀疏线条组成的测试图案（**参见图\
    \ 1**）。\n\n## 玩转缓冲区（buffer）\n\n既然我们已经显示了一个基础图像，接下来的挑战是找出显示器内存中的单词是如何与显示器的物理像素匹配的。实现此点的最好方法是进行实验。例如，我们在没有查看控制器数据表的情况下，已经为多个显示器编写了程序。第一个实验涉及更改线条模式，使得只写入交替位。\n\
    \n```cpp\nfor(int i=0;i<128*6/8;i++){\n  buffer[i]=2;\n  if(i%2==0)\n    buffer[i]=0;\n\
    }\nSendBuffer();\n```\n\n上方是显示器处处于的一组线条\n\n运行此程序会将显示器上的输出更改为一系列点线（**参见图 2**）。我们的实验表明，树莓派能够与\
    \ SPI 显示器通信。你可以使用你喜欢的 BITMAP 图像，将其序列化并发送到屏幕。除了显示网络活动图表外，你还可以使用 BITMAP 或 TrueType\
    \ 字体创建提供有关有用位信息的文本。\n\n遗憾的是，我们的 OpenWRT 之之旅即将结束。我们概述的步骤应该为你提供为自定义项目工作所需的技能，这些项目不仅适用于树莓派，还适用于其他单板平台。在大多数情况下，OpenWrt\
    \ 的硬件特定页面提供了涵盖编译和显示过程中硬件特定方面的说明。对于其他任务，请继续阅读本系列教程吧！\n\n```cpp\nOUT_GPIO(6);\n\
    IN_GPIO(13);\nOUT_GPIO(13);\n\nGPIO_SET = 1<<13;\n\nint myFD=wiringPiSPISetMode(0,\
    \ 4*1000000, 3);\n\n// 电荷泵 (Charge Pump)\nSendCommand(0x80);\nSendCommand(0xA0);\n\
    // 内存模式\nSendCommand(0x28);\nSendCommand(0x40);\n// 显示开启\nSendCommand(0xAF);\n\
    ```\n\n接口配置完成后，是时候查看控制器了。它包含一组寄存器，允许你修改功率缓冲器的行为、内存位置并查看其他因素。要开始使用 SPI 显示器，以下命令就足够了：\n\
    \n处理完这些后，显示缓冲区将被填充。使用标准缓冲区的开发者将处于这种状态：由于我们的显示器是单色的，一个 8 位字描述了八个相邻的的总点。将值设置为二可以确保八个像素中的每一个都会被填充。之后，可以使用\
    \ **SendBuffer** 方法将信息发送到显示器。\n\n```cpp\nvoid main(){\nSendCommand(0xAF);\nfor\
    \ (int i=0;i<128*6/8;i++) {\n  buffer[i]=2;\n}\nSendBuffer();\n}\n```\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_44_1.png)\n\
    \n上方更改 SPI 显示器缓冲区的内容会影响其输出\n\n# Erlang 教程\n\n## Erlang 语言程序：Erlang 和 OTP\n\nMihalis\
    \ Tsoukalos\n\nMihalis 是一位管理员、程序员（UNIX）和数学家。他自1993年以来一直使用 Linux。可以通过 @mactouk.org\
    \ 联系他。\n\n## 学习使用 OTP 在 Erlang 中开发容错应用程序\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_45_0.png)\n\
    \n# 资源\n\nErlang\nwww.erlang.org\n\n你喜喜欢的文本编辑器\n\n许多应用程序需要不断运行，而没有停机的奢侈。电话就是其中之一，因为人们期望可以随时互相拨打电话。OTP\
    \ 代表开放电信平台（Open Telecom Platform）以及 Erlang 的开源库和工具集合，它们帮助开发者创建容错应用程序。OTP 是 Erlang\
    \ 中最重要的部分。\n\n> OTP 不是 Erlang 应用程序的功能。但当你的应用程序由于任何原因关闭时，需要记住的第二重要点是监控器（supervisor）和应用程序通过规则相互链接，这些规则帮助它们快速通信，并允许监控器在需要时存在。\n\
    \n在本教程中，我们将编写并观察一个简单的 Erlang 监控器。我们将观察应用程序遇到问题时会发生什么。我们将继续讨论 OTP 并提供更多示例供你工作，但让我们开始吧。让你的应用程序代码与监控器的\
    \ Erlang 代码兼容！一旦监控器检测到进程失败，它会自动重启该进程。如果你要编写现实世界的应用程序，将不可避免地需要学习 OTP 框架。\n\n##\
    \ 关于 OTP\n\n尽管名为开放电信平台，OTP 不仅仅是 Erlang。它是一个用于构建大型项目的框架，通过库和工具帮助开发者创建容错应用程序。OTP\
    \ 是 Erlang 中最重要的部分。在大多数情况下，OpenWrt 的硬件特定页面提供了涵盖编译和显示过程中硬件特定方面的说明。对于行为（behaviors）是\
    \ Erlang 的核心，对于任务，它们将通过以下行为列出：\n- `handle_call/3` 用于同步调用。\n- `handle_cast/2` 用于异步调用。\n\
    - `handle_info/2` 处理消息。\n- `terminate/2` 用于退出。\n- `handle_change/6` 用于升级或降级。\n\
    - `init/2` 用于初始化。要开始使用 SPI 显示器，以下命令就足够了：\n\n```erlang\n-module(example).\n-behaviour(supervisor).\n\
    -export(start_link/0, init/2).\n\nstart_link() ->\n    supervisor:start_link(module(),\
    \ [], [], [], [], []).\n\ninit(Args) ->\n    {ok, []}.\n```\n"
