    # Ubuntu Touch


    Convergence has had a long and troubled existence, but represents a huge amount
    of effort and investment during its development. Mark Shuttleworth, the Canonical
    CEO, announced in 2011 (via his personal blog) at the 14.04 release of Ubuntu,
    the blog post to clear that Fairphone was on the way - a world where convergence
