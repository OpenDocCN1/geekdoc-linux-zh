    There are many kinds of applications that need to be working constantly without
    the luxury of downtime. One such is telephone, because there''s an expectation
    that calls can be made at any time on with each other. OTP stands for Open Telecom
    Platform and Erlang''s collection of open-source libraries and tools that help
    developers create fault-tolerant applications. OTP is the most important vital
    part of Erlang.


    > OTP is not the functionality of Erlang applications. But when your application
    shuts down for any reason, the second important thing to remember is that both
    the supervisor and the application are linked with each other through rules that
    help them communicate quickly and allow the supervisor to be there when needed.


    In this tutorial, we will write a simple Erlang supervisor that we will watch.
