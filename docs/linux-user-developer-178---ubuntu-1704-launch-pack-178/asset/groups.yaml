    \ to teach the Raspberry Pi to recognize emotion.\n\nTo do this, we will use Google\
    \ Cloud Vision API to analyze the images the Pi takes. The API is free if you\
    \ are using it for personal projects, but for a large number of transactions,\
    \ you will need to pay on usage.\n\nYou start an account setting up Google and\
    \ creating a file\n\nIn either case, you will need to send the pictures of the\
    \ faces you need the filesystem of your Raspberry Pi, ready to be analyzed.\n\n\
    Once you have your images, the first step is to make sure all the required packages\
    \ are installed. If you are using a Debian-based system, you can install the required\
    \ packages with the following commands:\n\nTo use this service, you need to send\
    \ your request in a JSON data set. This set includes the data containing the face\
    \ you want to analyze. Each face image is stored in the file image. The python\
    \ code you will need to send it to Google with 'Google Cloud Vision API' is as\
    \ follows:\n\n```\nsudo apt-get install python3-oauthclient\nsudo pip install\
    \ --upgrade google-cloud-vision\n```\n\n```\nimage_content = base64.b64encode(image.read())\n\
    requests = {\n    'requests': [\n        {'features': [{'type': 'FACE', 'DETECTION':\
    \ {'maxResults': 10}}]}\n    ]\n}\nresponse = service.execute()\n```\n\n# # Make\
    \ your Pi respond to people\n\nWith your authentication credentials. Read more\
    \ about this official documentation at https://cloud.google.com/vision/docs/auth.\
    \ If you need a JSON file with your credentials, you can make it available by\
    \ executing the following code on the command line:\n\nThe second command is needed\
    \ because there is no library in the Raspberry Pi repository. You now import the\
    \ libraries you need to connect to the service and start requests. Input the following\
    \ code:\n\n```\nexport GOOGLE_APPLICATION_CREDENTIALS=/path/to/your/credentials.json\n\
    ```\n\n```\nimport googleapiclient.discovery\nfrom google.oauth2.client import\
    \ service_account\n```\n\nSince this is a web service, your Raspberry Pi will\
    \ need to send the images to the Google Cloud and get the results. We will assume\
    \ that you are taking the pictures with either the PiCamera or a USB webcam. You\
    \ can take the pictures with the PiCamera using the following code:\n\nAs you\
    \ can see, you will need to base64 encode your image in order to be sent to the\
    \ Google Vision service. Once you have received the response, you can use the\
    \ execute() method to send and get the results. The Google Vision recognition\
    \ returns a list of details about the face that you sent, in- and for all the\
    \ faces of the image.\n\nAlong with vision, the Google Vision returns a list of\
    \ potential emotional content, which is what we want. There are four categories\
    \ of emotional content returned: sadness, anger, and surprise. The values of these\
    \ emotions are given as a range between 0.0 and 100. This percentage-based approach\
    \ may change with the image, so it is not so useful for an end user.\n\n```\n\
    import piccamera\ncamera = picamera.PiCamera()\ncamera.resolution=(1600, 1200)\n\
    camera.sharpness=100\ncamera.capture('image.jpg')\ncamera.close()\n```\n\n```\n\
    credentials = google.Credentials.from_application_default()\nservice = discovery.build('vision',\
    \ 'v1', credentials=credentials)\n```\n\nLuckily, more categories are available.\
    \ They are labeled UNKNOWN, UNLIKELY, UNLIKELY, POSSIBLE...\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_77_0.png)\n\
    \n78"
