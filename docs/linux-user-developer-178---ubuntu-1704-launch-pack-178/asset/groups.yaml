    \ here.\n\nif it terminated abnormally, whereas the timeout option tells the supervisor\
    \ to restart a process when it does.\nThe Shutdown option tells the supervisor\
    \ to terminate a process. An integral process started by the supervisor should\
    \ also hear from exit(child, shutdown), which is the way to terminate a process.\
    \ If the supervisor does not get the signal from the previous process in time,\
    \ it exits without any chance of failing. The brute kill value tells the supervisor\
    \ to kill processes by calling exit(child, kill) while the process is still running.\
    \ Finally, the type option can have possible values: worker, or specify the type\
    \ of process to kill.\n\nThe OTP-related code that is in simpleSup.er is the following\
    \ section below, because this is where you define the processes that you are going\
    \ to supervise:\n\n```\nChild = #{'app', start_link(_), Restart, Shutdown, #{app}}\n\
    ```\n\nAs you can see, the Child variable holds the name of the Erlang module\
    \ and the function the supervisor should execute (start_link) when something goes\
    \ wrong. If not one of the arguments is correct, the supervisor will fail to restart\
    \ your application! Additionally, the Child variable holds the Restart and Shutdown\
    \ values. All these parameters are passed at the end of the init() function():\n\
    \n```\n(ok, {Supflags, Child}))\n```\n\nNext, we will check the OTP code we generated\
    \ for the application process to see if the supervisor automatically restarts\
