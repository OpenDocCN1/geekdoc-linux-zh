- md: "\n# Tutorial\n\n# OpenWRT\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_41_0.png)\n\
    \n# Add a display to your router\n\nTam Hanna\n@openswrt.org\n\nI am the CEO of\
    \ the Bravata-based consulting firm Tammogogen Holding & Co. My firm focuses on\
    \ consulting in the development of interdisciplinary systems, software, and hardware.\n\
    \n# Making display status information easier by a cheap display\n\nSPI (Serial\
    \ Peripheral Interface) is a highly efficient bus that is usually connected to\
    \ a limited number of peripherals to computers while providing high bandwidth.\
    \ For storage media and ADCs or DACs, the interface can handle a variety of displays.\
    \ In this tutorial we have a 128x64 display we purchased from AliExpress for relatively\
    \ low price - we got ours for less than $5 each from a supplier in China. The\
    \ choice was for many reasons. First of all, the price is significantly lower.\n\
    \nUsing our displays requires control of both GPIO and SPI. Setting the GPIO pins\
    \ was sufficiently discussed in the previous issue, which means that we will focus\
    \ on SPI here.\n\n## Complex configuration\n\nConnecting a display to the SSD1306\
    \ controller is possible on various single-board computers including the Arduino\
    \ and Orange Pi. To find out how it works on the Raspberry Pi 3 running OpenWRT:\n\
    \nWhile we could, in theory, access SPI by directly writing into the various bits\
    \ of the controller found in mapped memory, a cleaner solution is to use the /dev\
    \ interface. First of all, it does not require us to access sensitive memory which\
    \ could cause problems. Using the kernel modules ensures a higher degree of portability.\
    \ Code directly accessing the hardware would be hardware-specific and the board\
    \ connector would be very unlikely to work when confronted from a different architecture.\n\
    \nBefore starting the implementation of the driver, let's take a look at the schematics.\
    \ In SPI, the connection is simple. The line MOSI (Master Slave In) and the line\
    \ MISO (Master Slave Out) are for the other direction. The clock pulses, while\
    \ one or more chips select lines that enable the master and slave communication.\n\
    \nIn the last issue, the kernel must be configured. After that, it's recommended\
    \ to use the numerical memory mapping. Using one of the kernel modules on the\
    \ /dev/spi-x/y device is the best way to access the SPI modules on the Linux.\
    \ The number of modules available depends on the target hardware, and the spi-mod-ssd1306\
    \ kernel is unlikely to be found on a good working with a non-broad architecture.\n\
    \nDisplays based on the SSD1306 controller expand their relatively simple interface\
    \ with a trick: three pins (for Data/Control) instead of four. The display controller\
    \ unit should be connected to the SPI transceiver. This way, commands can be written\
    \ into the control without having delays, which would slow down buffer transfers.\
    \ It is a cursory glance at the schematics to that interfacing:\n\n```\n# /root/dev/spi0.0\n\
    - audio mckblk1p tty3 tty56\n- audio mckblk1p speed0.1 tty3 tty57\n- bus network_latency\
    \ speed0.1 tty3 tty58\n```\n\n# Resources\nOpenWRT\n@openswrt.org\n\n# Raspberry\
    \ Pi 1\n\nYou'll find that connecting an SPI display to a process computer is\
    \ not particularly difficult principle.\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_42_0.png)\n\
    \nSPI is but another serial device and can be handled accordingly. One of the\
    \ significant benefits of open source code is that developers can stand on the\
    \ shoulders of giants; if a piece of code already exists, rewriting it would be\
    \ pointless effort.\n\nIn case of the SPI interface, the tool of choice goes by\
    \ the Raspberry Pi. In particular, the SPI library comes in using wiringPi and\
    \ its accompanying header wiringPi.h.\n\nCopy the files over using root or SCP\
    \ operations. When the code is on the process computer, proceed to the steps outlined\
    \ in Dominik Spiegele's, Code Reading: The Open Source Perspective. The book advocates\
    \ that development starts with the code being tested as already working. In the\
    \ case of our SPI library, try to kick off a compilation process follows:\n\n\
    ```\n# gcc wiringPi.c\nwiringPi.c:In function\n```\n\n> ‘wiringPIPISupMode’\n\
    wiringPi.c:83:12: warning: implicit declaration of function 'wiringPiFailure'\n\
    [-Wimplicit-function-declaration]\n    return wiringPiFailure(WPI_ALMOST,\n  \
    \  \"Unable to open SPI device: %s\\n\", strerror(errno));\n\n> wiringPi.c:83:29:\
    \ error: 'WPI_ALMOST'\nndeclared (first use in this function)\n    return wiringPiFailure(WPI_ALMOST,\n\
    \    \"Unable to open SPI device: %s\\n\", strerror(errno));\n\nAs some components\
    \ are missing – portant the full Raspberry library would be a significant and\
    \ unjustified effort – open the file wiringPi.c and eliminate the offending references.\
    \ Instead of returning wiringPiFailure, e.g., change the code that it returns\
    \ a constant value:\n\n```c\nint wiringPiSetupMode (int channel, int speed, int\
    \ mode)\n```\n\n# Tutorial OpenWRT\n\n## Beware the OLED stock\n\nWe assisted\
    \ in the deployment of a demand-now-defunct brand in the past. A common problem\
    \ encountered was introduced to improve:\n\n```c\nint fd = 0;\nif (ioctl(fd, SPI_IOC_MODE,\
    \ &mode) < 0) {\n    return -1;\n}\n```\n\nIn the last issue, the kernel must\
    \ be configured. After that, it's recommended to use the numerical memory mapping.\
    \ Using one of the kernel modules on the /dev/spi-x/y device is the best way to\
    \ access the SPI modules on the Linux. The number of modules available depends\
    \ on the target hardware, and the spi-mod-ssd1306 kernel is unlikely to be found\
    \ on a good working with a non-broad architecture.\n"
  mdcn: "\n\n# 教程\n\n# OpenWRT\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_41_0.png)\n\
    \n# 为你的路由器添加显示器\n\nTam Hanna\n@openswrt.org\n\n我是基于 Bravata 的咨询公司 Tammogogen Holding\
    \ & Co. 的执行官。我的公司专注于跨学科系统、软件和硬件开发的咨询。\n\n# 通过廉价的显示器让状态信息变得更简单\n\nSPI（串行外接口）是一种高效的总线，通常连接到计算机的有限数量外设上，同时提供高带宽。对于存储媒体以及\
    \ ADC 或 DAC，该接口可以处理各种显示。在教程中，我们从 AliExpress 购买了一块 128x64 的显示器，价格非常低——我们从一个中国供应商那里购买的价格每个不到\
    \ 5 美元。选择它有很多原因。首先，价格便宜得多。\n\n使用我们的显示器需要同时控制 GPIO 和 SPI。GPIO 引脚的设置在上一期中已经得到了充分讨论，这意味着我们在这里将关注\
    \ SPI。\n\n## 复杂的配置\n\n将显示器连接到 SSD1306 控制器在各种单板计算机（包括 Arduino 和 Orange Pi）上都是可能的。要了解它在运行\
    \ OpenWRT 的树莓派 3 上如何工作：\n\n虽然理论上我们可以通过直接向映射内存中找到控制器的各个位来访问 SPI，但更整洁的解决方案是使用 `/dev`\
    \ 接口。首先，它不需要我们访问可能导致问题的敏感内存。使用内核模块可以确保更高程度的可移植性。直接访问硬件的代码将是特定特定的，而且当面对不同的架构时，板载连接器可能无法工作。\n\
    \n在开始实现驱动程序之前，让我们来看看原理图。在 SPI 中，连接非常简单。MOSI（主入从入）线和 MISO（主出从出）线用于相反的方向。时钟脉冲，以及一个或多个片选选择线，用于启用主从机之间的通信。\n\
    \n在上一期中，必须配置内核。之后，建议使用数值内存映射。使用 `/dev/spi-x/y` 设备上的内核模块之一是访问 Linux 上 SPI 模块的最佳方法。可用模块的数量取决于目标硬件，在非通用架构的良好运行平台上不太可能找到\
    \ `spi-mod-ssd1306` 内核模块。\n\n基于 SSD1306 控制器的显示器通过一个技巧扩展了其相对简单的接口：三个引脚（用于数据/控制）而不是四个。显示控制器单元应连接到\
    \ SPI 收发器。这样，命令就可以写入控制中而不会产生延迟，延迟会减慢缓冲区传输。这是该接口的原理图简览：\n\n```\n# /root/dev/spi0.0\n\
    - audio mckblk1p tty3 tty56\n- audio mckblk1p speed0.1 tty3 tty57\n- bus network_latency\
    \ speed0.1 tty3 tty58\n```\n\n# 资源\nOpenWRT\n@openswrt.org\n\n# 树莓派 1\n\n你会发现，将\
    \ SPI 显示器连接到处理计算机在原理上并不特别困难。\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_42_0.png)\n\
    \nSPI 只是另一个串行设备，可以相应进行处理。开源代码的显著优势之一是开发者可以站在巨人的肩膀上；如果一段代码已经存在，重写它将是徒劳的努力。\n\n\
    对于 SPI 接口，首选工具是树莓派。特别是，SPI 库使用了 `wiringPi` 及其配套的头文件 `wiringPi.h`。\n\n使用 root 或\
    \ SCP 操作复制文件。当代码位于处理计算机上后，按照 Dominik Spiegele 的《代码阅读：开源视角》中所述的步骤进行。该书主张开发应从测试已为正常运行的代码开始。在我们的\
    \ SPI 库的情况下，尝试启动以下编译过程：\n\n```\n# gcc wiringPi.c\nwiringPi.c:In function\n```\n\
    \n> ‘wiringPIPISupMode’\nwiringPi.c:83:12: warning: implicit declaration of function\
    \ 'wiringPiFailure'\n[-Wimplicit-function-declaration]\n    return wiringPiFailure(WPI_ALMOST,\n\
    \    \"Unable to open SPI device: %s\\n\", strerror(errno));\n\n> wiringPi.c:83:29:\
    \ error: 'WPI_ALMOST'\nndeclared (first use in this function)\n    return wiringPiFailure(WPI_ALMOST,\n\
    \    \"Unable to open SPI device: %s\\n\", strerror(errno));\n\n由于某些组件缺失——移植整个树莓派库将是一项巨大且不合理的努力——请打开\
    \ `wiringPi.c` 文件并消除引起问题的引用。与其返回 `wiringPiFailure`，例如，更改代码使其返回一个常量值：\n\n```c\n\
    int wiringPiSetupMode (int channel, int speed, int mode)\n```\n\n# 教程 OpenWRT\n\
    \n## 注意 OLED 股票\n\n我们过去协助部署过一个现在已不存在的品牌。遇到的一个常见问题是引入了：\n\n```c\nint fd = 0;\n\
    if (ioctl(fd, SPI_IOC_MODE, &mode) < 0) {\n    return -1;\n}\n```\n\n"
