- md: "\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_26_0.png)\n\nLeft Trying an alternative\
    \ desktop environment such as KDE Plasma lets you see a different slant on Ubuntu\n\
    \nvirtualiser- has been updated to version 2.8. Primarily QEMU enables servers\
    \ for Oses and applications for one machine (on an ARM board) or by using dynamic\
    \ translation, it achieves near native performance by executing the guest code\
    \ directly on the host CPU. With the Xen hypervisor or using KVM kernel module\
    \ in Linux when using QEMU, the software can virtualize x86 server with PowerPC,\
    \ POWER90, 32-bit and 64-bit ARM, MIPS and others.\n\nSticking with the libvirt\
    \ library it has been updated to version 2.5. An API for a number of languages\
    \ like Python provides access to platform virtualisation management. It can be\
    \ used with QEMU, Xen, VMware ESXi and is widely used in the orchestration of\
    \ hypervisors.\n\nUbuntu 17.04 includes the latest release of DPDK, which is version\
    \ 1.6. The Data Development Kit is a set of libraries and drivers for userland-based\
    \ high speed data packet networking, also providing the EAL (Environment Abstraction\
    \ Layer) to offer a standard environment and therefore programming interface.\
    \ A number of developers have already invested a lot of effort in developing around\
    \ the Qt-based UI toolkit, including large projects such as GIMP and LibreOffice.\
    \ As Ubuntu reverts to Gnome, efforts will be around the GTK+ toolkit- the Gnome\
    \ Developer Center is a good place to start. Try https://developer.gnome.org if\
    \ you're a new Linux developer with application development overview, and a number\
    \ of helpful guidelines (as well as a free API reference).\n\nOne concept you\
    \ can familiarise with today is Snap packages. As the level of snap increase in\
    \ 17.04 towards deprecation of the legacy software package format, it's worth\
    \ understanding why containers offer and are important for Ubuntu - and indeed\
    \ Linux's future. The vision behind snaps was to create a 'container' for applications\
    \ that enabled them to run not just one distribution but Linux versions.\n\nThe\
    \ cross-distro support is so vital with snaps that include all the libraries that\
    \ an application requires to run. How many times have you had an application to\
    \ run but failed because dependencies have been missing or the wrong version?\
    \ Those issues will be a thing of the past. Of course, you've probably noticed\
    \ that including these resources means the files themselves will be bigger, but\
    \ that's a small price to pay.\n\nwww.linuxuser.com 27\n\n# Feature Ubuntu 17.04\n\
    \n- Installed snaps live in the /snap directory, which you can browse manually\n\
    \n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_27_0.png)\n\n- Snapweb (sudo apt install\
    \ snapweb) provides a web interface to snaps on localhost port 420.\n\nAfter you've\
    \ installed a Snap, it's incredibly easy to update, courtesy of the Ubuntu Software\
    \ Centre. That's right, it actually becomes much easier, not for initial installation\
    \ and distribution but for updates. The most widely used format for today is apt\
    \ and that it is driving adoption from others, including Dell, HP, Mozilla, LibreOffice,\
    \ as many as many. Strangely, the support from Canonical and Ubuntu will help\
    \ tap less popular distribution for anyone, as a container built with Ubuntu in\
    \ mind will still work elsewhere.\n\nSo how does a snap work? It's really a zip\
    \ file (sound family, JAVA JAR users/Android APK packs). Included in the file\
    \ is a metadata file, an icon and the application with its dependencies. When\
    \ the snap is installed, it will be mounted at /snap/<name>/current and ready\
    \ to run. Snaps bring-needed additional security to the Linux platform as they\
    \ are sandboxed (in, they are isolated from the underlying system and other applications),\
    \ are read-only and segregated data. Although they are sandboxed, snaps can communicate\
    \ with each other using service 'interfaces', with 'plugs' and 'slots'.\n\nSnaps\
    \ from the command line is a great way to get ideas of how they work - so let's\
    \ try the 'hello' world tour. Come from anywhere, you'll search the Ubuntu store\
    \ and only see 'promoted' snaps - those that have been reviewed and vetted for\
    \ security. Try the command `snap find hello` and see the result. Now you have\
    \ the snap, and you can install it. We use the command `snap install hello`. It's\
    \ just like any other app, type 'hello' and it will run. You can see all the snaps\
    \ installed with `snap list`, which will tell you the version, unique revision\
    \ and the developer details. And when you're ready to update, just do `sudo snap\
    \ refresh`.\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_27_1.png)\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_27_2.png)\n\
    \n# Build a snap\n\nWe take you all the steps to develop and install your own\
    \ snap\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_28_0.png)\n\n### snapcraft-hello\n\
    ```bash\n$ snapcraft hello-world\n$ cd hello-world\n$ touch hello.py\ncat <<EOF\n\
    print \"First snap project (Ubuntu))\nimport sys\nif __name__ == \"__main__\"\
    :\n    if len(sys.argv) > 1:\n        print(f\"Hello {sys.argv[1]}\")\n    else:\n\
    \        print(\"Hello world!\")\nEOF\n```\n\n### snapcraft-hello\n```bash\n$\
    \ snapcraft hello-world\n$ cd hello-world\n$ touch hello.py\ncat <<EOF\nprint\
    \ \"First snap project (Ubuntu))\nimport sys\nif __name__ == \"__main__\":\n \
    \   if len(sys.argv) > 1:\n        print(f\"Hello {sys.argv[1]}\")\n    else:\n\
    \        print(\"Hello world!\")\nEOF\n```\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_28_1)\n\
    \n### snapcraft-hello\n```bash\n$ snapcraft hello-world\n$ cd hello-world\n$ touch\
    \ hello.py\ncat <<EOF\nprint \"First snap project (Ubuntu))\nimport sys\nif __name__\
    \ == \"__main__\":\n    if len(sys.argv) > 1:\n        print(f\"Hello {sys.argv[1]}\"\
    )\n    else:\n        print(\"Hello world!\")\nEOF\n```\n\n# 01 Preparing for\
    \ snap\n\nIn order to run snaps on your machine, you'll need to install pre-requisites.\
    \ Use snap install-core and then launch the snap with snap. If you want to develop\
    \ a snap, you'll need to install dependencies. Snapcraft uses plugins to handle\
    \ the build requirements:\n\n# 02 Create the base snap\n\nAs we are going to starting\
    \ from scratch, you'll need to create a directory for your snap (preferably in\
    \ your home directory) and use a simple template. In your terminal, run `mkdir\
    \ hello` and `snapcraft init`. This creates a snapcraft file. This manifest will\
    \ contain properties we use:\n\n# 03 Describe the snap\n\nIn the editor of your\
    \ choice, you'll be editing the manifest file. Here you'll define the name of\
    \ your snap. The version should be a human readable string, independent from the\
    \ version, summary is a short-line description of your snap and description is\
    \ a longer version used to identify it. builds will be published to the snap channel.\
    \ Finally, confinement must be devise or use dev mode.\n\n# 04 Add a part\n\n\
    Snaps can contain multiple parts - a simple snap might contain only one part source\
    \ or source plugin. You can pick a repo, tarball, or directory. Snapcraft includes\
    \ a host of parts, but for now, we'll just create one part called 'hello-hello'\
    \ from the source and we'll include a tarball from the GNU project. To configure\
    \ it run `configure --base make` which adds the lines to show your manifest.\n\
    \n# 05 Building and install\n\nNow that you've finished the first part, you'll\
    \ need to build your snap. If you're missing some optional dependencies such as\
    \ 'autopush', then they'll be installed at this point after running snap build.\
    \ Install the snap with `snap install --devmode hello_2.18_amd64.snap`. If it\
    \ doesn't work, you'll check the logs. Now we just need to define a command for\
    \ our snap.\n\n# 06 Defining a command\n\nTo expose commands to users, you'll\
    \ need to define them in the manifest file. You can define the name of your snap\
    \ as before and then you'll be in business. Remember to use `devmode` in the manifest\
    \ first part! Now that everything works, we can create a snap that can be installed\
    \ without flags. Non-classic snaps are not uploaded, unless you want to share.\
    \ Create an Ubuntu account and upload snap to avoid this issue.\n"
