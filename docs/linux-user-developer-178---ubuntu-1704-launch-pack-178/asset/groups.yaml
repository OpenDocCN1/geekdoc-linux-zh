    ## Ubuntu 系统


    ## Ubuntu 停止 Unity 的开发


    Canonical 结束与融合的爱恋


    Unity 曾是 Ubuntu 为其桌面打造专属环境的长期项目，但长期以来，它一直受到漏洞的困扰，使其不利潜在用户。然而，正如 Canonical 和 Ubuntu
    创始人 Marshall Cox 在最近的博客中所述，他将结束对 Unity 的投资，并将桌面切换回流行的 GNOME。


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_7_1.png)


    长期以来，Unity 一一直是 Ubuntu 项目的核心支柱，实现了桌面与智能手机之间的联系。尽管收到一些良好的反馈，项目在获得和维持热度方面仍然困难，缺乏基于
    Ubuntu 的手机是主要失败原因之一。如果这不够，其他密切相关的领域也缺乏支持。Ubuntu Touch 软件（或 Ubuntu Personal）正面临选择：随着
    Canonical 的推动进行融合（详情请见……），以及 Canonical 内部的显示服务器。后者特别受到关注，因为 Canonical 正在切换到流行的
    Wayland 显示服务器工作。


    此时，Ubuntu 的工作远未结束。Shuttleworth 在他的博客中表示：“我喜欢拥抱对创新的热情，对数百万人赖的 Ubuntu 桌面进行投资和承诺。我们希望继续生产世界上最开源的桌面，以维持商业合作伙伴交付桌面的期望，同时支持在上面进行创新的
    IoT 和云开发者。”


    Ubuntu 的融合之梦已经结束。


    失去对 Unity 的访问将将在未来几个月内逐步进行，为用户提供足够的时间寻找自己的替代平台。尽管未来可能突如其来，Shuttleworth 解释道：“最终的选择是投资于最有利于公司增长的领域。对于
    Ubuntu 本身，云基础设施提供了 OpenStack 和 Kubernetes，而我们的能力和故事在于 snaps 和 Ubuntu Core。”


