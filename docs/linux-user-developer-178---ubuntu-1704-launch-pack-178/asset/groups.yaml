  mdcn: "\n# Qt5 开发\n\n看起来非常像 Visual Studio\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_35_0.png)\n\
    \n由于 QML 的出现，QGUI 不再特别流行，我们将对其略过忽略，但关于其使用的更多信息可以在 http://doc.qt.io/getting-started/qt-5/starting-point\
    \ 处找到。\n\n在 Qt Creator 的项目视图中点击 `MainWindow` 以切换模式。点击 UI 文件会进入 WYSIWYG（所见即所得）编辑器，其布局与图片中的类似。\n\
    \n在下一步中，从屏幕左侧显示的列表中拖入一个 `Push Button`（推送按钮）。将其拖到树中间：右上角的表单视图将创建一个新屏幕，并显示该部件已添加到表单层中。\n\
    \n开发应用程序的 Qt 开发者此时会使用 Qt Creator 中找到的部件创建信号与槽连接。在本教程中，该部件通常会从编辑器的视图中隐藏，随表单一起存在。\n\
    \n立即，使用屏幕左侧模式选择器中的“Edit”选项来保存表单并编辑 WYSIWYG 编辑器。Qt Creator 通常会找到 `MainWindow.ui`\
    \ —— 编辑器通过我们讨论的过程将 XML 结构插入到头文件中。不支持直接编辑 XML 文件，但\n\n现在，是时候开始编写代码了。打开 `main.cpp`\
    \ 文件查找后代码结构；由于 `QOBJECT:` 的放置位置，主类的声明看起来很奇怪：\n\n```cpp\nclass MainWindow : public\
    \ QMainWindow\n{\n    QOBJECT\npublic:\n    explicit MainWindow(QWidget *parent\
    \ = nullptr);\n    MainWindow();\nprivate:\n    ui::MainWindow *ui;\n```\n\n`QOBJECT`\
    \ 宏充当 `moc` 工具的占位符括号。它不能以分号结束，且在编译文件时添加代码的位置是灵活的。`QOBJECT` 用于任何派自 `QObject` 或其子类的类。在\
    \ `MainWindow` 的情况下，它是在多或复杂的区域开发的 Qt 框架类所要求的。\n\n实现定义了 WYSIWYG 中表单表示的实现头文件是正确的。为此，它还允许我们访问变量，包括头文件中定义的私有变量。\n\
    \nQt 开发者传统上通过创建一个表单本身当时的信号槽系统...\n\n注意：信号槽问题是因为 \n除了本文讨论的信号槽语法外，互联网上的示例可能使用基于配置字符串的旧版本语法。关于新方法的信息可以在\
    \ http://qt.io/New/Signal_Slot_Syntax 处找到。建议支持 Qt 6.x 的用户完全坚持新语法，因为它为信号槽关系涉及的元素提供了编译时检查的优势。\n\
    \n# MainWindow\n\n# 图 3\n\n# 卓越的调试器！\n\n从理论上讲，Qt Creator 能够自动发现 PRO 文件结构的变化，并根据需要触发同步。然而，这在实践中很少运行得良好。你可能会发现自己面临一组无法解释的错误，作为最后的手段，激活\
    \ Qt Creator 菜单中找到 `run-cmake` 命令。最后在某些情况下，问题将会消失，不需要额外的开发。\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_36_0.png)\n\
    \n现在，还有一个挑战：实际控件必须进行链接。这是通过 `MainWindow` 类构造函数中的以下更改实现的——图 3 显示了我们工作的结果。\n\n#\
    \ MessageBox 上方工作完美良好\n\n这可以通过将按钮的点击信号连接到表单的 `close()` 槽来实现。我们现在将采取不同的方法，不再使用外部槽，而是为主表单类添加一个新的槽。从纯代码的角度来看，实现此目的所需的更改并不特别显著：\n\
    \n```cpp\nMainWindow(QWidget *parent) : MainWindow(parent), ui(Ui::MainWindow)\n\
    {\n    ui->setupUi(this);\n    connect(ui->pushButton, &QPushButton::clicked,\
    \ this, &MainWindow::runResponse);\n}\n```\n\n```cpp\nclass MainWindow : public\
    \ QMainWindow\n{\n    Q_OBJECT\npublic slots:\n    void runResponse();\n};\n```\n\
    \n槽被声明为普通方法；槽的可见性修饰符通知元对象有额外工作。在下一步中，必须实现该槽。如下文所述，槽是一个成员函数——我们的实现弹出了列表（见图 3），这导致了以下代码：\n\
    \n上述内容的一个方面是通过由于 `QObject` 类的静态方法链接的信号与槽。该类执行复杂性验证——可能无法通过的信号和槽不能相互连接。\n\n```cpp\n\
    void MainWindow::runResponse() {\n    QMessageBox *object = new QMessageBox(this);\n\
    \    object->setText(\"Hello Qt!\");\n    object->show();\n}\n```\n\n# 去掉外观！\n\
    \nC++ 和 Java 之间最显著的区别是后者具有垃圾回收。开发者无法对对象引用特别关注，因为一段时间未使用的对象将被消除。\n\n在 C++ 中添加垃圾回收是一个重大问题。在实践中，Qt\
    \ 的父子系统被称为该系统。大多数派自 `QObject` 的类在构造期间都会接收一个父对象的指针。实现定义了 WYSIWYG 中表单表示的实现头文件是正确的。为此，它还允许我们访问变量，包括头文件中定义的私有变量。\n\
    \nQt 开发者传统上通过创建一个表单本身当时的信号槽系统...\n\n注意：信号槽问题是因为 \n除了本文讨论的信号槽语法外，互联网上的示例可能使用基于配置字符串的旧版本语法。关于新方法的信息可以在\
    \ http://qt.io/New/Signal_Slot_Syntax 处找到。建议支持 Qt 6.x 的用户完全坚持新语法，因为它为信号槽关系涉及的元素提供了编译时检查的优势。\n\
    \n# Ubuntu 教程\n\n# 第一部分：故障排除\n\n在第一个教程中，我们仔细观察 Ubuntu 中各种类型的故障排除\n\n![](img/f96eeeb05685565f9f67cf36c9ea3ae1_37_0.png)\n\
    \n```cpp\n#ifndef MAINWINDOW_H\n#define MAINWINDOW_H\n\n#include <QMainWindow>\n\
    \nclass MainWindow : public QMainWindow\n{\n    Q_OBJECT\npublic:\n    explicit\
    \ MainWindow(QWidget *parent = nullptr);\n    MainWindow();\nprivate:\n    ui::MainWindow\
    \ *ui;\n};\n\n#endif // MAINWINDOW_H\n```\n"
