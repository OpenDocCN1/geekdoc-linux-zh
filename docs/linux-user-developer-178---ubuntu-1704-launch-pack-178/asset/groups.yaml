    ## 隧道传输的新方式：WIREGUARD


    WireGuard 是一种安全的网络隧道，运行在第 3 层，并实现为 Linux 的内核网络接口。它旨在大多数用场景下取代 IPsec，以及像 OpenVPN
    等流行的用户空间/TLS 解决方案，同时变得更安全、更高效且更易于使用。


    WireGuard 在不到一年前发布了“0 版本”，因此在达到 1.0 之前，它还不是你个人应该使用的东西，但我们已经迅速看到 WireGuard 是安全且快速的。无论
    VPN 是否如人所意，它都是一种针对当前隐私工具范式的不同方法。


    WireGuard 摒弃了 VPN 构建在 IPsec 或路由网络上的假设，而是通过使用加密密钥（CryptoKey）构建小型且易理解的协议。


    代码库非常小，第一个版本仅有 3904 行代码，而 OpenVPN 则超过 100,000 行。由于没有对 OpenSSL 的依赖，它的方法变得如梦似完美。这段代码实现在
    Linux 内核中，较小的体积使其易于审计。


    WireGuard 中的每一个部分都经过了重新思考，从提供清晰度并提供简单管理的“加密密钥路由表”，到它使用的方式：


