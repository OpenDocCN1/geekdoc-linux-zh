    ## 我在两方面都错了


    Mark Shuttleworth, 2017年4月5日


    2017年4月是 Canonical 开发的 Ubuntu 操作系统 17.04 版本—— Zesty Zapus 的发布日期。它的发布使得目前支持的 Ubuntu
    版本数量达到了令人惊讶的四个——这个新版本将持续到 18.10，以及两个当前的 LTS（长期支持）版本：14.04 LTS 和 16.04 LTS。由于没有新的
    LTS（下一个具有长期支持的版本将只有九个月的官方支持，但更具“前沿性”，带来了许多最新功能，但也可能有更多错误），不稳定的可能性是一个问题，那就是 LTS
    版本的退出。


    那么我们对这个最广泛使用的 Linux 发行版的新版本期待什么？首先值得提到不该期待什么——尽管社区存在推测，Unity 并不是 Canonical 迈向云和物联网技术新动作的桌面环境，它将是（参见
