    for instance, how to discover and fix vulnerabilities in applications, they are
    building and map that currently disclosed libraries. We provide them with what
    we call a quality index; of how large the vulnerability is; how critical it is
    in terms of history; how current version we are using. We provide that information
    and allow companies to automate fix and remediation of license compliance risks.
    As open source is basically now commonplace, the entire code base built on Linux
