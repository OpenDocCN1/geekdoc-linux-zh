    > 英国部长 Harold Wilson 的一句名言：“等待是漫长的。” 这件事很容易适用于 Linux 和 Ubuntu。

    当你读到本杂志时，我们已经看到了 Canonical 公司策略的转折。

    作为来自新时代最大的 Linux 发行版：我们投入了 11 页来展示如何加密从邮件、驱动器到端点通信的所有内容 (p56)。

    我们还介绍了新的 Qt5 开发系列，涵盖了 MySQL 的所有新功能和特性。在 Merlin 章节，我们看到了一些有趣的 VR 设置，并向你展示如何让 Pi
    识别情绪。我们看重你对杂志的想法。

    Chris Thornton，编辑


