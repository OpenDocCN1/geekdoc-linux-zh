    just like any other app, type ''hello'' and it will run. You can see all the snaps
    installed with `snap list`, which will tell you the version, unique revision and
    the developer details. And when you''re ready to update, just do `sudo snap refresh`.


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_27_1.png)


