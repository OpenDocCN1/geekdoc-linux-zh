    CIA 的泄密事件（包括 WikiLeaks 的“保险库 7”）是层出不穷的。很可能在你读到这些内容时，泄密事件已经产生了自己的套量身定制的漏洞和漏洞。这些文件证明了
    CIA 破解你设备的能力，以及来自 Android 和 Cisco 的泄露信息，这些信息引发了犯罪分子利用并制造混乱。


    并非所有加密都是同等的。计算机能力的不断增长意味着曾经认为足够的手段现在都有被破解的可能。例如，RSA-768 程序存在缺陷，会导致加密被绕过，因此请保持你的软件持续更新并准备就绪。


    使用的素数位至少为 2048 位。建议使用 Diffie-Hellman 或椭圆曲线 Diffie-Hellman（ECDH）以实现完美机密性。


    更令人担忧的是情报机构拥有的大量漏洞，以及这些漏洞可能泄露的危险（BitBy/ForItStayHidden）。采取措施保护自己是必不可少的。学习如何使用
    VeraCrypt 加密你的笔记本电脑或便携设备；使用 GPG 加密电子邮件以及生活的许多其他方面，以及如何保护你的连接。


    CIA 不会是唯一这样做的实体，考虑到犯罪分子监视数据的可能性，加密敏感文档比以往任何时候都更加必要。


    近期 CIA 泄密事件的一份加密需求报告指出：“密钥交换 Diffie-Hellman、椭圆曲线 Diffie-Hellman 或 RSA。对于椭圆曲线，素数必须至少为
    256 位。对于 Diffie-Hellman 和 RSA……”


    ## 隐私的钥匙


    传统上，将信息隐藏在秘密代码中，你可以与拥有密钥的人一起加密。在互联网上传递信息会让每个访问密钥部分的人看到。


    问题在一个方向上是困难的，但在其他方向上相对容易。这使得公钥成为问题中困难的部分，并可以轻松发布在所有人都能看到的地方，但私钥让谜题变得容易解决。


    RSA 是非对称加密首次首次实现（除了英国 GCHQ 拥有的秘密版本外）——它生成的密钥长达数百位。RSA 由 Ron Rivest、Adi Shamir
    和 Leonard Adleman 发明——“RSA”源于他们的姓氏——它使用模幂运算，密钥越大，生成私公钥就越越容易。


    这一概念在 20 世纪 70 年代在大西洋两岸双方独立开发，但英国版本一直由情报机构保密，而 Field Diffie 和 Martin Hellman 的非对称加密系统概念被发布并获得了专利。


    尽管对数和椭圆曲线关系经常被使用，但一种更简单的方法（用于解释）是寻找大数素因数的问题。用笔和纸可以很容易地找到 2,701 的因子是 37 和 73。乘以
    37 和 73 是你在学校学过的知识。


    公钥加密（也称为非对称加密）建立在 RSA 之上。RSA2048 使用 2,048 位的密钥——长度足够确保安全。在终端中使用计算器并询问它 2 的 2048
    次方是多少。要等多年后技术进步会让 RSA 不再安全。


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_56_0.png)


    ## 功能加密


    ## 文件和数据加密的工具与技术


    当你转过身离开电脑丢失时，让你的所有数据对任何人都是不可读的。别担心，它在 eBay 上只花了 260 美元，但现在陌生人拥有了你所有账户、客户信息以及许多你没发现流传的客户文档的权利。通过确保文件被加密——如果你丢失了笔记本电脑，整个硬盘——可能保持不可读状态，从而避免潜在的尴尬、财务损失和诉讼。有很多选项可供选择，安全性、便利性和可行性之间存在权衡。一个简单的选项是使用如
    TrueCrypt（见书籍）之类的工具在驱动器或 USB 闪存上保持加密卷，任何与你共享密码的人都可以读取。除非从头开始，否则你应该考虑加密你的分区。许多
    Linux 发行版（如 Ubuntu）在安装期间使用 Linux（如 LUKS）和结合了性能与安全的设备映射加密，这使得过程变得非常简单。一旦完成，对性能的影响微乎其微，如果你确保了安全的数据备份设置，那么可能从故障的瓶颈磁盘中无法恢复任何内容。你至少可以做的（而且要快地完成）是安装许多加密应用程序之一进行即时加密。


    TrueCrypt 长期以来使其容器成为事实上的标准，你可能需要选择一个兼容的解决方案与一组旧引擎配合工作。TruePax 9 兼容基于 TrueCrypt
    的应用程序。VeraCrypt 还提供一个跨平台版本，可以在任何地方运行，但它的模型更贴近 TrueCrypt，提供了熟悉感和易用性。（好吧，如果你在使用
    VeraCrypt，你可能已经知道这一切了。）


    无论使用我们下一页的 VeraCrypt 教程、尝试替代方案之一，还是在加密的硬盘分区上从头安装 Ubuntu，使用良好的密码都至关重要。数字、字符和大写字母将有助于防止字典攻击，但无法被暴力破解攻击破解。（访问
    https://xcd.com/936 了解该技术的其他优势。）


    ## 安息吧，TrueCrypt


    VeraCrypt 的开发者已经解决了 Open Crypt 审计根据 TrueCrypt 源代码发现的所有 TrueCrypt 疑虑，并且对安全以及独立研究人员提出的问题反应非常迅速。


    你在互联网上遇到的很多老用户仍然提到 TrueCrypt。


    ## 使用工具


    ### 替代方案：使用数据隐藏


    - 01 创建容器：选择要放入卷的文件大小。如果你不确定，可以稍后选择较大的卷。接下来，输入密码。如果你记不住长密码，请在 VeraCrypt 中选择此加密选项。


    - 02 良好的默认：点击加密选项，VeraCrypt 将给出各种选项的摘要。作为起点，AES 提供了安全性，请使用默认的 SHA-256 哈希。


    - 03 增大空间：使用 JPEG、MP3 或压缩文件都可以。


    - 04 密钥文件：VeraCrypt 将卷的前 1024KB 与密码结合。这样做时，没有迹象表明文件是特殊的。复杂的密码多个共享卷的人可能记住，但在单用户设置中注意到。或者，生成随机密钥文件更安全、更不易破解。


    - 05 随机性池：你格式化这取决于你何时开始。Windows 用户可能会对此感到困难，下一个跨平台兼容性也是如此。VeraCrypt 通过格式化驱动器移动鼠标来增加生成的随机性。在
    VeraCrypt 中选择卷，输入密码，它可以作为目录、分区或命令行的形式可用。


