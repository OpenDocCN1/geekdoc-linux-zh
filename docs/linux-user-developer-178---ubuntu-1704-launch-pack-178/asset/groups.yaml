    ## Main official Ubuntu spins


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_23_0.png)


    ## Ubuntu Budgie


    Ubuntu Budgie uses the GNOME-based Budgie desktop environment as its default.
    The desktop makes use of modern GNOME technologies and integrates tightly with
    WPS. It is not specifically a GNOME fork. Part of the ''Solar'' desktop, the mantra
    of Budgie is ''simplicity and elegance'', delivering it in spaces with feel.


    Key features of Budgie include a quick access menu for apps with compact and category
    centre called ''Rawen''. The centre allows users to easily access information,
    sound and media player controls, notifications in the Notifications view and the
    Customisation Centre provides access to icon and widget them, arranging and modifying
    Budgie panels, as their displayed.


    ## Ubuntu MATE


    If your machine is too ancient to run a modern Ubuntu desktop at any decent level?
    Then MATE might be the answer. MATE is described as the ''Ubuntu alternative for
    computers that aren''t powerful enough to run a modern desktop''. Originally founded
    by Martin Walker for Canonical, the plattform is designed to easily reclaim ''regular''
    Ubuntu features. The artwork is simple to distribute and approve, the default
    packages are also included, with the caveat that they prioritize functionality
    and stability over cleverness and whimsy.


    MATE is the immediate family to Ubuntu. And last


    ## Xubuntu


    If regular Ubuntu is the ''heavyweight'' and Mate and Ubuntu are at the other
    end of the scale, Xubuntu is probably the middle ground. Xubuntu believe that
    ''you should be able to get system performance to you care about'', which makes
    use of lightweight software and just the right of applications to enable the task
    at hand, whether you are on a powerful machine or something much more modest.
    Xubuntu is based on the Xfce environment, which is fast and light on system resources,
    while still appealing and user friendly. With the Xfce environment being so versatile,
    the Zesty of Ubuntu has benefits in the base build, returning Xfce 4.2 for a few
    packages receiving updates, around task management and notifications.


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_23_1.png)


    ## Ubuntu Kylin


    Ubuntu Kylin is an official flavour of Ubuntu created for China with the Chinese
    government procurement regulations. It includes all the features you''d expect
    in Ubuntu includes Chinese software and apps. The app is specifically tailored
    to the Chinese market, with added support for touch screens and HIDPI monitors.
    Kylin partnered with China Software and Integrated Chip Provisions Centre (CISP)
    and the National University of Defense Technology (NDUT) to develop the Zesty
    release of Ubuntu Kylin utilizes the UKUI desktop, which will look familiar to
    Windows 7 users. Part of the work by the UKUI team was to move the Unity dock
    to the bottom of the screen, which benefits all Ubuntu users


    ## Lubuntu


    As with MATE, Lubuntu is designed as a fast and lightweight version of Ubuntu.
    Lubuntu uses a minimal desktop LXDE (Lightweight Desktop Environment) and a selection
    of applications. The developers leads to low hardware requirements, which focus
    primarily on energy and efficiency,


    How lightweight is Ubuntu? The system can be installed on a Pentium or Celeron
    with 128MB of RAM, but with 512MB of RAM, the performance will be better and the
    system will be better daily. With 256MB of RAM, you don''t need to worry much.
    Pretty lightweight!


    Lubuntu aims to cover the main things you would like to do with your desktop OS.
    It includes free office applications like Word and Excel (via LibreOffice), Gnumeric,
    and other end-user friendly elements for viewing, editing, playback, and archive.


    The intention was to bring LXDE environment to Ubuntu with the release of 17.04,
    but this is not going ahead. LXQt can be installed manually however, for a view
    of where Ubuntu is.


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_24_0.png)


    ## Kubuntu


    It''s easy to understand what the ''friendly computing'' community distribution
    is – it''s Ubuntu, but with the KDE desktop environment. Plasma instead of Unity,
    which are both underpinned by Qts,


    Kubuntu''s desktop environment was designed for users transitioning from Windows
    or Apple Macs, so by providing a familiar design functionality it to be used easily.


    The desktop is highly configurable in nature through the GUI, without manually
    editing files. It is fundamentally different from Unity, as they both use the
    same sources to create and share applications.


    The Zephyr release of Kubuntu includes the Plasma 5.9 environment with updated
    elements, including the KDE 16.12.3 applications and version 3.0.1 of the popular
    office productivity suite,


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_24_1.png)


    ## Ubuntu GNOME


    Ubuntu GNOME is an official flavour of Ubuntu featuring, you guessed it... Originally
    released back in 2012, it was based on the decision of the community to stick
    with GNOME as Ubuntu switched to Unity.


    GNOME 3.24 brings a new feature in the month - a light theme which changes the
    screen tones based on the time of day, reducing blue light to reduce strain. The
    notifications have also been much improved in the latest release with a more useful
    information display such as.


    A number of settings have been improved, including rounding printing. Finally,
    power users will once again choose which.


    ## Ubuntu Studio


    Ubuntu Studio is a custom Ubuntu... designed for creative production. It provides
    a huge range of audio, graphics, and photography applications. It includes:

    - Blender

    - Gimp

    - OpenShot

    - Krita

    - DarkTable


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_24_2.png)


    ## Ubuntu GNOME


    Ubuntu GNOME is an official flavour of Ubuntu featuring, you guessed it... Originally
    released back in 2012, it was based on the decision of the community to stick
    with GNOME as Ubuntu switched to Unity.


    GNOME 3.24 brings a new feature in the month - a light theme which changes the
