    ## Unity 8: 尝试历史的一片段


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_20_0.png)


    - **菜单栏**

    向下滑动菜单栏以访问快速设置，设置按章节组织。向右滚动以访问新章节。


    - **任务切换**

    Unity 8 任务切换器提供了打开窗口的 3D 视图。可以通过 Alt+Tab 或触摸启动。


    - **兼容性**

    针对 Unity 8 优化的应用程序将显示单个菜单栏，较旧的应用程序可能会显示双条栏。


    - **作用域 (Scopes)**

    使用登录时默认打开的 Scopes 窗口，浏览并尝试随新操作系统安装的不同作用域。


    - **网络 浏览**

    Unity 8 浏览器运行快速并支持大多数基本功能。基于 X 的浏览器（如 Chrome）可以在其上运行（像既往一样）。


    - **启动器**

    从屏幕左侧滑出启动器，按字母顺序查看已安装的应用，或访问商店。


    Ubuntu 最近刚刚适应了该系统，尽管对其性能与其他替代方案的对比存在一些争议，它是最后一个完成的合格组件。为了这种变化我们应该使用哪些商店？


    即使 Unity 8 不是 17.04 的功能，但用来尝试一下仍然很快。如果它尚未准备就绪——而且速度没有之前的版本快，或者当你切换到它时，它是对平台不同取角的有趣观察，比之前的版本明显更稳定，且今天拥有更多功能。Unity
    8 可以通过登录屏幕上选择它来启动。登录后，如果你使用的是触摸设备，即使是现在也会注意到一个边缘，因为现在没有集成显示设置选项。如果你知道的话，这是一个简单的修复方法——只需在文本编辑器中打开
    .profile 文件，并添加行 `GRID_UNIT_PK=16` 来更改缩放大小；默认值为 0。当然，你可以设置在两个值之间的任何位置。


    在探索 Unity 8 的新功能时，值得记住更新的目标。如果你有一台带有触摸屏的 Ubuntu 笔记本电脑，或者一个可以安装新操作系统的平板电脑，那么你就可以很好地感受到“Ubuntu”体验初衷是如何工作的。登录后，向下滑动屏幕右侧的通知区域，注意它是针对触摸优化的程度。


    ## Feature Ubuntu 17.04


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_21_0.png)


    实际上什么都没有接线完成，但你可以点击进入设置应用并查看不同的部分。“语言和文本”部分提供了 Ubuntu 18 改进后的屏幕键盘预览。该平台很好支持智能手机、平板电脑和许多应用程序，包括
    Ubuntu Web 和一些针对更新界面专门优化的应用。从通用 UI 角度来看，从屏幕右侧滑动可以在应用之间切换（看起来很棒），并从左侧滑动打开启动器。


    ## Fairphone 2 上的 Ubuntu


    ## Ubuntu Touch


    融合 (Convergence) 有着漫长而充满波折的历史，但它代表了开发期间巨大的努力和投资。Canonical 首席执行官 Mark Shuttleworth
    在 2011 年 Ubuntu 14.04 发布时（通过他的个人博客）宣布，该博客文章明确了 Fairphone 已经在路上——一个融合在所有设备上即时可用的、带有域域同步和共享的世界——这对
    Linux 来说是一个巨大的机会。人们想确切知道，当需要使用 Ubuntu 时它到底有多困难，以及 Linux 在 Android 设备上会变成什么样，或者可能以
    Linux 内核生成 Android 系统的形式存在。


    在巴塞罗纳举行的 Mobile Worlds 2017 上，旨在让 Ubuntu 用于从智能手机开始每个设备上的 Ubports 小组演示了 Fairphone
    2 上的 Ubuntu。Fairphone 作为一个开放且伦理的手机，在电子价值链中创造了无缝体验。他们的伦理方法扩展到设备的模块化——所有者可以选择维修或升级设备的部分。Ubuntu
    作为操作系统的开源性质为其用户提供了强有力的替代方案，并避免了供应商锁定。


    为这些设备开发 Ubuntu 版本始于 Ubuntu Touch。

    '
