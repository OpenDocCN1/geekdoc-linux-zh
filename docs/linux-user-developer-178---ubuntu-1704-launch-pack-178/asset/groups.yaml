    # About ACID


    ACID means Atomicity, Consistency, Isolation and Durability is a set of properties
    that guarantee transactions are performed reliably

    Atomicity means that if you do something that changes a database, the whole thing
    should work or fail at once. Consistency ensures that a transaction leaves the
    database in a consistent state. If there are other things happening at the same
    time on the same data, isolation keeps them consistent. Durability is the guarantee
    that once a user has been notified of a transaction, the transaction will persist
    even in the event of a power failure or the hardware crashes afterwards. MySQL
    8 supports all these properties.


