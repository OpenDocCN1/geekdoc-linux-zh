    # # Back up and restore a database


    Once you have valuable data on a database you should be able to make a backup
    copy of it, because bad things happen all the time and it''s best to be prepared.
    This section will briefly explain how to make a backup and how to restore data.
    First, you can back up a MySQL 8 database as:


    ```

    ```bash

    mqldump --add-drop --all-databases -tsoukalos -p dumpFile.sql

    ```

    ```


    Similarly, you can restore a MySQL 8 database with the next command:


    ```

    ```bash

    mysql -u tsoukalos -p < dumpFile.sql

    ```

