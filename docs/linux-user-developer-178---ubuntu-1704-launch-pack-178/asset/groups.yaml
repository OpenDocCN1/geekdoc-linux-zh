    ## Ubuntu 17.04 特性


    ## Ubuntu 官方主要版本


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_23_0.png)


    ## Ubuntu Budgie


    Ubuntu Budgie 默认使用基于 GNOME 的 Budgie 桌面环境。该桌面利用了现代 GNOME 技术并与 WPS 紧密集成。它并不是专门的
    GNOME 分叉。作为“Solar”桌面的一部分，Budgie 的格言是“简单与优雅”，提供具有设计感的空间体验。


    Budgie 的主要功能包括一个用于应用程序的快速访问菜单，以及一个名为“Rawen”的紧凑且分类的中心。该中心允许用户轻松访问信息、声音和媒体播放器控制、通知视图中的通知，而“个性化中心”则可以访问图标和小部件主题、排列和修改其所示的
    Budgie 面板。


    ## Ubuntu MATE


    如果你的机器太老旧，无法以任何体面的水平运行现代 Ubuntu 桌面？那么 MATE 可能是答案。MATE 被描述为“性能不足以运行现代桌面的电脑的 Ubuntu
    替代方案”。它最初由 Martin Walker 为 Canonical 创立，该平台旨在轻松恢复“常规”Ubuntu 特性。其设计易于分发和审核，也包含了默认软件包，但前提是它们优先考虑功能性和稳定性，而不是奇巧和新奇。


    MATE 是 Ubuntu 的直系家族。最后


    ## Xubuntu


    如果说普通的 Ubuntu 是“重量级”，而 Mate 和 Ubuntu 处于天平的另一端，那么 Xubuntu 可能是中间折地带。Xubuntu 认为“你应该能够获得你关心的系统性能”，它利用轻量级软件和恰当的应用程序来完成任务，无论你是在强大的机器还是非常简陋的设备上。Xubuntu
    基于 Xfce 环境，该环境运行快速且占用系统资源，同时仍然具有吸引力且用户友好。由于 Xfce 环境如此多功能，Ubuntu Zesty 在基础构建中具有优势，为少数接收更新的软件包返回了
    Xfce 4.2，主要涉及任务管理和通知。


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_23_1.png)


    ## Ubuntu Kylin


    Ubuntu Kylin 是根据中国政府采购法规为中国创建的 Ubuntu 官方版本。它包含了你对 Ubuntu 预期的所有功能，包括中国软件和应用。该应用专门为中国市场定制，并增加了对触摸屏和
    HIDPI 监控器的支持。麒麟与中国软件与集成电路产业中心（CISP）以及国防科技大学（NDUT）合作开发。Ubuntu Kylin Zesty 版本利用
    UKUI 桌面，这会让 Windows 7 用户感到很眼熟。UKUI 团队的工作之一是将 Unity 栏移动到屏幕底部，这对所有 Ubuntu 用户都有益。


    ## Lubuntu


    与 MATE 一样，Lubuntu 被设计为快速且轻量的 Ubuntu 版本。Lubuntu 使用了极简的 LXDE（轻量级桌面环境）和一系列应用程序。开发者追求的是低硬件需求，主要关注能源和效率。


    Ubuntu 有多轻量？系统可以安装在带有 128MB RAM 的奔腾或赛扬处理器上，但如果有 512MB RAM，性能会更好，系统日常运行也会更好。有了
    256MB RAM，你就不需要太担心。非常轻量！


    Lubuntu 旨在涵盖你想要在桌面操作系统执行的主要事项。它包含了免费的办公软件，如 Word 和 Excel（通过 LibreOffice）、Gnumeric
    以及其他用于查看、编辑、播放和存档的用户友好元素。


    原本意图是在发布 17.04 时将 LXDE 环境引入 Ubuntu，但此并未实施。不过，可以手动安装 LXQt，以了解 Ubuntu 的现状。


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_24_0.png)


    ## Kubuntu


    很容易理解什么是“友型计算”社区发行版——它是 Ubuntu，但配备了 KDE 桌面环境。使用 Plasma 代替 Unity，这两者都由 Qt 提供底层支持。


    Kubuntu 的桌面环境是为从 Windows 或苹果 Mac 过过渡的用户设计的，因此通过提供熟悉的设计功能，使其易于使用。


    该桌面本质上可以通过 GUI 进行高度配置，而无需手动编辑文件。它从根本上与 Unity 不同，因为它们都使用相同的源码来创建和共享应用程序。


    Kubuntu Zephyr 版本包含带有更新元素的 Plasma 5.9 环境，包括 KDE 16.12.3 应用程序和流行的办公生产套件 3.0.1 版本。


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_24_1.png)


    ## Ubuntu GNOME


    Ubuntu GNOME 是 Ubuntu 的官方版本，其特点是，正如你猜的……它最初在 2012 年发布，它是社区在 Ubuntu 切换到 Unity 时决定坚持
    GNOME 的结果。


    GNOME 3.24 在版本中引入了一个新功能——根据时间更改屏幕色调的光色主题，减少蓝光以缓解疲劳。通知在最新版本中也得到了极大改进，提供了更有用的信息显示。


    许多设置得到了改进，包括打印设置。最后，高级用户将再次选择哪一个。


    ## Ubuntu Studio


    Ubuntu Studio 是一个定制的 Ubuntu……专为创意制作而设计。它提供了大量的音频、图形和摄影应用程序。它包含了：

    - Blender

    - Gimp

    - OpenShot

    - Krita

    - DarkTable


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_24_2.png)


    ## Ubuntu GNOME


    Ubuntu GNOME 是 Ubuntu 的官方版本，其特点是，正如你猜的……它最初在 2012 年发布，它是社区在 Ubuntu 切换到 Unity 时决定坚持
    GNOME 的结果。


    GNOME 3.24 在版本中引入了一个新功能——根据时间更改屏幕色调的光色主题，减少蓝光以缓解疲劳。通知在最新版本中也得到了极大改进，提供了更有用的信息显示。


    许多设置得到了改进，包括打印设置。最后，高级用户将再次选择哪一个。


