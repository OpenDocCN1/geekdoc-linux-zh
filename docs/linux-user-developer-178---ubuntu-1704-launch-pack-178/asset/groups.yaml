    for Linux. What wanted wanted to know exactly how difficult it would be to use
    Ubuntu when it needs to be there and what Linux would become on Android devices,
    or maybe in form of the Linux kernel generating Android OS.


    At Mobile Worlds 2017 in Barcelona, Ubports, a group aiming to enable Ubuntu to
    be used on every device starting with smartphones, demonstrated Ubuntu on the
    Fairphone 2. Fairphone as an open and ethical phone that creates a seamless experience
    across the value chain of electronics. Their ethical approach extends to the device''s
    modularity - owners can choose to repair or upgrade parts of the device. The open
    source nature of Ubuntu as the operating system forms a strong alternative to
    Android and non-vendor lock-in for its users.


    Development of a version of Ubuntu for these devices began with Ubuntu 13.04 Ubuntu
    Touch Preview, based on Ubuntu 13.04 and primarily supporting a number of Android
    phones. Initial functionality included the dialer, camera, gallery, browser, player
    and a reasonable start, with the ability to link to ''tap apps''.


    The Fairphone 2 packs a fast Qualcomm processor, 2GB RAM and flash storage, dual
    cameras and a high degree of connectivity essentials. The 5-inch Gorilla glass
    screen however, offering an impressive 446 pixels per inch. UbPorts also has Ubuntu
