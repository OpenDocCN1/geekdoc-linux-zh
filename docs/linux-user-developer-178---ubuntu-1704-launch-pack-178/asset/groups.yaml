    80-90% 是开源的，如果你不进行追踪，你就无法防御漏洞。


    > 我们的大多数客户都担心这个问题，我们所做的是，例如如何在应用程序中发现并修复漏洞，他们正在构建并映射当前已公布的库。我们为他们提供所谓的“质量索引”；即漏洞有多大；在历史记录中它有多关键；我们正在使用的版本有多新。我们提供这些信息，并允许公司自动修复和缓解许可证合规风险。由于开源现在基本上已成为常态，构建在
    Linux 之上的整个代码库对当前网络安全威胁的意识和关注也随之增加。关键问题仍然在于开源获取获取。开发者可以去 GitHub 或 GitLab——任何一个来获取开源。大多数组织要么没有任何形式的有效追踪机制，最后其他类型的代码缺陷或安全漏洞对应用程序的风险不在于生产环境，而是在代码公开时，类似于
    Heartbleed 的事件，问题不在于正在开发的应用，而是我们在生产环境中的代码。


