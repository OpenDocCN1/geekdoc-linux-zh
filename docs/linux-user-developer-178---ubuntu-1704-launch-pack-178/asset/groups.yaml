    # Review Google Wi-Fi


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_85_0.png)


    # HARDWARE


    # Google Wi-Fi


    | Price |

    | :--- |

    | £129–£229 |

    | Website |

    | madeby.google.com/ |

    | Specs |

    | Wireless connection: WiFi 802.11a/b/g/n/ac, AC1200 2x2 dual-band mesh, Bluetooth,
    Tx beamforming |

    | Processor: Quad-core ARM CPU |

    | Memory: 512MB RAM |

    | Ports: 2x Ethernet ports per Wi-Fi point (1 WAN port) |

    | Dimensions: 106.7mm, 7xcm each |

    | Weight: 362g each |


    The simplest and most value-packed home Wi-Fi mesh system that has been made yet


    Mesh networking is not new technology – it was originally developed for the military
    and used in hospitals and large commercial applications for years. Google, along
    with Eero and Netgear, have launched whole-home mesh Wi-Fi networking systems.
    These use routers and nodes throughout your house to combat dead zones, congestion,
    faster speeds and a more consistent connection.


    Naturally, the smart home-obsessed Google is likely to have crafted the best Wi-Fi
    mesh system to date. Google Wi-Fi offers more mesh units than competitors for
    far less, with a focus on simple setup and management. Google Wi-Fi costs £129
    for a one-pack and £229 for the two-pack, which Google classifies as its ‘medium’
    for 1,500 to 3,000 square feet (the large pack). There’s one primary ‘Wi-Fi Point’
    (the one you hook up to your modem or gateway) and however many secondary Wi-Fi
    Points you like to buy. Contrast this with the likes of Orb and others that cost
    $400 (or $320) and Google offers more units for less money than any competitor.


    Each Google Wi-Fi unit is a tiny, unassuming cylinder with a simple LED band in
    the centre and capable of the same functionality.


    ## Google Wi-Fi benchmarks


    Here is how Google Wi-Fi fared in our brief suite of tests (which we conducted
    on a 100Mbps service):


    | Test | Test details | Download | Upload |

    | :--- | :--- | :--- | :--- |

    | Ookla Speed Test 5GHz | Within 5 feet/1.52 metres; no obstructions | 101.41
    | 117.83 |

    | Ookla Speed Test 5GHz | Within 13 feet/3.96 metres; three plaster walls | 97.05
    | 118.67Mbps |

    | Ookla Speed Test 2.4GHz | Within 5 feet/1.52 metres; no obstructions | 47.53
    | 96.72Mbps |

    | Ookla Speed Test 2.4GHz | Within 13 feet/3.96 metres; three plaster walls |
    50.95 | 82.98Mbps |


    | Test | Test details | Peak speed |

    | :--- | :--- | :--- |

    | 1.5GB Steam download 5GHz (peak speed): | Within 5 feet/1.52 metres; no obstructions
    | 101.41 | 117.63Mbps |

    | 1.5GB Steam download 5GHz (peak speed): | Within 13 feet/3.96 metres; three
    plaster walls | 97.05 | 118.67Mbps |

    | Ookla Speed Test 2.4GHz | Within 5 feet/1.52 metres; no obstructions | 47.53
    | 96.72Mbps |

    | Ookla Speed Test 2.4GHz | Within 13 feet/3.96 metres; three plaster walls |
    50.95 | 82.98Mbps |


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_86_0.png)


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_86_1.png)


    # Cons


    Limited fiber optic cover vs Wi-Fi ratings, use of AC1200 routers than others
    for seeking fast internet speeds.


    # Pros


    Very easy to set up and manage; value in comparison with competitors and features
    an excellent design.


    # Summary


    This means that any three units can function as the ''router'' of the system,
    while the others are wired (which is beamed to them automatically) with Ethernet
    ports. All units are powered via USB-C.


    Setup is straightforward with Google''s hardware design, using an Android or iOS
    app to facilitate the process. The app connects your Wi-Fi network by first scanning
    the QR code on the Wi-Points. From there you can name them, set a password, then
    pair the additional Wi-Fi points and label them for reference. After that, it
    takes seconds to recognise the Wi-Fi units and begin roaming from room to room
    without getting the same depth of access, so no switching is required. For overall,
    Google Wi-Fi handles the task with great ease.


    The app offers many more useful features, like constant monitoring of your network,
    and the devices connected to it. The app also included a feature to run a mesh
    test that measures the health of your Points'' connections as well.

