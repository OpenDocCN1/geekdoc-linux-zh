    # Google Wi-Fi测评


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_85_0.png)


    # 硬件


    # Google Wi-Fi


    | 价格 |

    | :--- |

    | £129–£229 |

    | 网站 |

    | madeby.google.com/ |

    | 规格 |

    | 无线连接：WiFi 802.11a/b/g/n/ac, AC1200 2x2 双频 mesh, 蓝牙, Tx 波束成形 |

    | 处理器：四核 ARM CPU |

    | 内存：512MB RAM |

    | 端口：每个 Wi-Fi 点具有 2 个以太网端口 (1 个 WAN 端口) |

    | 尺寸：每个 106.7mm x 7cm |

    | 重量：每个 362g |


    迄今为止的最简单且性价比最高的家庭 Wi-Fi mesh 系统


    Mesh 网络并不是新鲜技术——它最初是为军事开发的，多年来一直用于医院和大型商业应用。Google 与 Eero 和 Netgear 一起，推出了全屋 mesh
    Wi-Fi 网络系统。这些系统通过遍布房屋的路由器和节点来解决信号盲区、拥堵、提高速度并提供更稳定的连接。


    自然地，对智能家居痴迷的 Google 可能打造了迄今为止最好的 Wi-Fi mesh 系统。Google Wi-Fi 以低得多的提供了比对手更多的 mesh
    设备，并专注于简单的设置和管理。Google Wi-Fi 单装售价 £129，双装售价 £229，将其分类为适用于 1,500 到 3,000 平英里的“中型”（大装）。有一个主“Wi-Fi
    点”（连接调制调器或网关的那个）以及根据需要购买任意数量的辅助 Wi-Fi 点。相比 Orb 等售价 400 美（或 320 美）的产品，Google 比任何竞争对手都更便宜且数量更多。


    每个 Google Wi-Fi 单元都是一个微小不起眼的圆柱体，中心有一个简单的 LED 灯带，具备相同的功能。


    ## Google Wi-Fi 基准测试


    以下是 Google Wi-Fi 在我们简短测试系列（我们在 100Mbps 服务上进行）中的表现：


    | 测试 | 测试细节 | 下载 | 上传 |

    | :--- | :--- | :--- | :--- |

    | Ookla Speed Test 5GHz | 距离 5 英尺/1.52 米内；无障碍 | 101.41 | 117.83 |

    | Ookla Speed Test 5GHz | 距离 13 英尺/3.96 米内；隔三堵石膏墙 | 97.05 | 118.67Mbps |

    | Ookla Speed Test 2.4GHz | 距离 5 英尺/1.52 米内；无障碍 | 47.53 | 96.72Mbps |

    | Ookla Speed Test 2.4GHz | 距离 13 英尺/3.96 米内；隔三堵石膏墙 | 50.95 | 82.98Mbps |


    | 测试 | 测试细节 | 峰值速度 |

    | :--- | :--- | :--- |

    | 1.5GB Steam 下载 5GHz (峰值速度): | 距离 5 英尺/1.52 米内；无障碍 | 101.41 | 117.63Mbps |

    | 1.5GB Steam 下载 5GHz (峰值速度): | 距离 13 英尺/3.96 米内；隔三堵石膏墙 | 97.05 | 118.67Mbps |

    | Ookla Speed Test 2.4GHz | 距离 5 英尺/1.52 米内；无障碍 | 47.53 | 96.72Mbps |

    | Ookla Speed Test 2.4GHz | 距离 13 英尺/3.96 米内；隔三堵石膏墙 | 50.95 | 82.98Mbps |


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_86_0.png)


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_86_1.png)


    # 缺点


    光纤覆盖范围相对于 Wi-Fi 评级有限；在追求快速网速方面使用了其他产品更好的 AC1200 路由器。


    # 优点


    设置和管理非常简单；与竞争对手相比极具性价比，且设计出色。


    # 总结


    这意味着任何三个单元都可以作为系统的“路由器”，而其他单元通过以太网端口有线连接（信号会自动传输到它们）。所有单元均通过 USB-C 供电。


    Google 的硬件设计使得设置非常简单，使用 Android 或 iOS 应用程序辅助该过程。应用程序通过首先扫描 Wi-Points 上的二维码 连接你的
    Wi-Fi 网络。从那里你可以为它们命名、设置密码，然后配对额外的 Wi-Fi 点并对其进行标记以便参考。之后，只需几秒钟即可识别 Wi-Fi 单元并在各个房间之间漫游，而无需获得相同的访问深度，因此不需要手动切换。总体而言，Google
    Wi-Fi 非常轻松地完成了任务。


    该应用程序提供了许多更多实用功能，例如持续监控你的网络以及连接到网络上的设备。应用程序还包含一个运行 mesh 测试的功能，可以测量你的节点连接的健康状况。


    '
