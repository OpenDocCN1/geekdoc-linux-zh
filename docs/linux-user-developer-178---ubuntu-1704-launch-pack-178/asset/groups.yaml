    ## 浏览器


    ## Linux 用户终于可以享受“Netflix 加闲时光”了


    通过 Firefox 浏览器，在 Linux 上疯狂刷 Netflix 现在已成为可能。


    虽然这已经等待很久，但 Linux 用户终于能够使用 Firefox 浏览器获得完整且无需插件的 Netflix 体验。在 Mozilla 最近的更新中，Firefox
    现在包含了对各种 DRM 图形的支持，以播放 Netflix。直到最近，用户基本上必须“欺骗”他们的浏览器才能获得 Netflix 功能，但这次新更新不需要额外的插件即可工作。


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_10_0.png)


    这次更新的优点之一是，Linux 用户现在可以在原始画质播放的基础上进一步提升。另一个是优化文件质量，在未来的几个月里，可能允许高分辨率设备利用 4K 播放功能。在最新的更新中，


    工程经理 Nicholas Eddy 谈了关于其 HTML5 进展的消息：


    > “过去四年来，我们对 HTML 视频的热情一直很强烈。在所有主要平台上都能无缝运行的插件即插播放有助于我们无论你如何观看都能提供体验。这只是一个开始！”


    Linux 用户如果想要获得流媒体体验，可以前往 Mozilla 的 Firefox 网站并获取可用资源。如果你正在下载，请查看他们的免费试用！


    ## 虚拟现实


    ## SteamVR 在 Linux 测试版亮相


    Valve 正式推出其 Linux 版本的 VR 服务


    几年来，Valve 一直非常关注 Linux 用户，但随着最近终于推出了其 VR 服务测试版，这种伙伴关系没有任何放缓的迹象。


    对于 Linux 开发者来说，Valve 开放了多种工具用于为 HTC Vive 及相关硬件创建内容。在目前阶段，该程序仍处于 Beta 阶段。可以访问 NVIDIA
    内核驱动程序，它是 OpenVR 的继者。


    然而，重要的是注意的是，目前的限制仍然适用。开发目前仅限于少数图形界面，且图形支持非常有限。还注意到为了保持与头戴式设备元素兼容性而存在的限制，以及在不同显示模型之间切换的能力。


    尽管有这些警告，正式发布意味着在未来几个月内，所有 Linux 用户都将从虚拟现实游戏中受益。只要你等得及时间……


