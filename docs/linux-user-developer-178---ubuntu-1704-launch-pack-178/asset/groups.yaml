    ## GIMP


    ## Drawpile


    ## GIMP 持续为用户提供完成工作所需的工具


    Drawpile 的多用户支持会让它成为这里的胜者吗？


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_82_0.png)


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_82_1.png)


    - GIMP 提供了各种工具，兼顾新手和资深设计师。

    - 得益于内置的协作系统，其他用户可以在 Drawpile 中对你的图像进行编辑。


    ## 设计与 UI


    GIMP 的 UI 在最近的 2.8 版本中有所改进，有所有常用的工具和菜单可供导航，但 GIMP 是少数可以“开箱即用”的编辑器之一。用户在自定义 GIMP
    的外观和感受方面能做的非常非常少，虽然它的默认设置没有问题，但自由度的缺失令人失望。


    ## 设计与 UI


    在加载 Drawpile 时，管理工具是一个显著的特征。它们对于在几秒钟内导入和导出文件非常方便。然而，许多核心工具隐藏在各种菜单之后，如果没有这些工具，导航某些菜单可能会有些费力。它在全程提供了相对快速且稳定的用户界面。


    ## 工具选择


    工具选择帮助是管理所有编辑工具的高效方式，无需在不同的菜单之间切换，但某些工具本可以整合在一起。一些工具还具有额外功能，可以通过鼠标右键进行访问，如果不看文档，你不会知道这些功能的存在。


    ## 工具选择


    Drawpile 最大的优势在于其嵌入编辑工具的选择。这里有基础的绘制和形状工具，但它们缺乏我们需要的额外选项。然而，我们发现包含的笔刷非常好用，并提供了一些改进你图像的方法。


    ## 高级功能


    Linux 爱好者会发现 GIMP 对多种编程语言的支持感到非常愉快。脚本化的图像处理在这里是完全可能的，它支持 Python、Perl 和原生脚本。GIMP
    还记录了如何根据你的需要开始图像管理。


    ## 高级功能


    除了管理工具外，它的亮点也是我们推荐你尝试它的原因。它是少数也提供导入工具的图像编辑套件之一。如果你在图像需要特定的颜色，这些工具非常有用，也可以用于移除肖像中的颗粒感部分。


    ## 附加功能与插件


    除了编辑功能，GIMP 还赋予了用户处理一系列行业标准色彩管理功能的能力。它们与其他程序同步，尽管集成程度有点糟糕，而且其中一些程序无法在旧设备或低资源机器上运行。


    ## 附加功能与插件


    Drawpile 确实尝试与众不同，而且在大多数情况下它成功了。虽然多个人可以同时处理同一个项目，每个人都可以访问同一组工具。刚开始可能有点困难，但在大局上这只是一个小小的困扰。


    ## 总结


    GIMP 的唯一真实缺点是它没有 Krita 所提供的自定义功能。尽管如此，它的工具选择仍然是无与伦比的。


    ## 总结


    Drawpile 确实尝试与众不同，在大多数情况下它成功了。虽然协作功能很棒，但在其他方面还需要进一步努力。


    ![](img/f96eeeb05685565f9f67cf36c9ea3ae1_82_2.png)


    ## 图像编辑器测评


    ## 简要：对比并总结我们的结论


    | 设计与 UI | Pinta | Krita | GIMP | Drawpile |

    |---|---|---|---|---|

    | 这种极简的方法意味着从头到尾的导航都非常轻松。 | 导航非常方便，如果你想让它个性化，还有自定义选项。 | 缺乏自定义是一个遗憾，但 GIMP 提供了此类中最好的布局之一。
    | 管理工具可以访问，但 Drawpile 隐藏了编辑工具。 |

    | 工具选择 | 基础工具齐全，但高级用户可能会感到很遗憾。 | 有点不同，Krita 没有在各种范围内包含这些工具。 | 同样，Krita 功能足够全，提供了设计师可能需要的一切。
    | 它没有超出你预期的基础任务范围。 |

    | 高级功能 | 多层支持很好，但没什么令人兴奋的。 | 笔刷引擎提供了相当不错的笔刷，但引擎目前还很粗。 | 如果能让该功能运行，就可以进行滚动图像管理。
    | 输入非常有利于改善导入图像的粗边。 |

    | 附加功能与福利 | 包含插件库，但在资源上使用很笨重。 | 增加了对 HDR 编辑的支持，你的细节图像可以获得一些关注。 | 图层的使用可以帮助图像提升到新的水平。
    | 一个出色的协作工具，供多个用户连接使用。 |

    | 总结 | 如果简单性是一个重要因素，那么 Pinta 可能适合你。 | 你很难找到另一个拥有 Krita 所提供功能的图像编辑器。 | 只要对 UI 进行稍小改进，Krita
    就能并驾齐。 | 通过对内置工具的改进，GIMP 是一个有力的竞争者。 |


    ## 获胜者是……


    **Krita**


    这组测试中最令人愉目的开源图像编辑器之一是，发现它们正在不断改进。你会发现它们在不断改进。多个人可以同时处理同一个项目，每个人都可以访问同一组工具。刚开始可能有点困难，但在大局上这只是一个小小的困扰。


    （注：此处原文存在大量重复的 OCR 错误，已根据逻辑上下文进行清理并完成翻译。）

