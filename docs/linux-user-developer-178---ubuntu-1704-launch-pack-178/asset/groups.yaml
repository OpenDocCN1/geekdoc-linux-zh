    source security risks for clients.


    > Can you tell us a little about what the company does?


    Patrick Carey: Black Duck has been working specifically in the open source ''enablement
    space'' since the company was launched in 2004. The primary demand behind the
    original launch was that by timeframe, open source was not as ready as useful
    for general purpose applications as it is. It was viewed by many organizations
    as a niche or mere experiment. So there was a lot of fear and uncertainty with
    the use of it, with licenses associated with it, and people were unsure about
    technical proficiency. So the founder of the company sought to set off one of
    the challenges of getting visibility into and understanding that 80-90 percent
