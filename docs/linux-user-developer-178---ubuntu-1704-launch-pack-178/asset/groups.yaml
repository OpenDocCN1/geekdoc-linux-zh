    information on the update.


    # # LINUX FOUNDATION


    # # Intel Data Plane added to Linux Foundation


    Users can transfer data packets efficiently


    The Linux Foundation has rapidly acquiring a vast of diverse projects, many of
    which are benefiting from the support of the community that they can count on.

    The latest to join its over-expanding list of projects is the DPDK, which was
    originally created in 2010, offering a set of tools for the transfer of data packets
    across various servers. Infrastructure open started the project in 2013, stalling
    support has seen join the Linux Foundation.


