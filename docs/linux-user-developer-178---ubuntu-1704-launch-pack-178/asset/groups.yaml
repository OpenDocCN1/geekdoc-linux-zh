    ## 持续中的开发


    许多正在开发中的补丁与通过指针保护提高安全性有关，例如针对 ARMv8 支持的新策略（对内存指针免受攻击的加密保护），或者关于内核结构布局的改进，这使得攻击者难以利用内核缓冲区溢出（如上所述）。


    多年来，已经建立了各种检查和保护措施来限制对 `dev/mem` 的访问，并防止因读取它导致的崩溃。为此，提出了一种方案：向任何请求未在 UEFI 系统表中标记为“预留”内容的用户返回零数据。


    后者导致了 Keeks、Linux 和 GCC（GNU 编译器集合）插件之间关于重命名内核数据结构的反复讨论。特别是，Keeks 必须重命名 `task_struct`
    的内存层，该层包含有关运行进程（在内核内部时称为“任务”）的信息，但如果它的大小不够固定。


    最后在本月，作者最近花了大量时间研究 PCI Express 互连总线的外部，特别是考虑到获得了一台全新的 AMD Ryzen 设备并进行硬件直通。每个实现
    PCIe 的系统都使用一个“根”（root），该根通常位于连续内存空间内主核心附近。了解这一切是如何运作是非常有趣的，如果你玩过 IO 虚拟化（也称为 SR-IOV）并使用
    VFIO 驱动将设备传递给客户虚拟机，这将会非常有帮助。


    `dev/mem` 安全噩梦由 `dev WANTS_DYNAMIC_TASK_STRUCT` 描述，它末尾包含一个变长数组。这涉及到内核中所有进程对内存的硬性要求，要求
    Keeks 重新考虑整个结构的随机化（randubanding）。


    然后，非常愉快的是，发现并在新的热点电脑上运行工作，Kevin Vijay Abraman 的《PCI 子系统概览》中关于 da''xx 芯片仪器的驱动程序已在
    Linux Foundation Events 的 YouTube 上提供。


    回到最初，由 Jones、Linux 和 Tommi Tomati 介绍的特性。后者一直在使用 Dave 的 `x86info` 工具，该工具允许从物理内存中提取信息，包括来自
    x86 系统中亚小于 1MB 内存窗口内的固定位置，即 MDA（扩展）。


    它很好地涵盖了许多主题，你可以在以下链接查看它：www.youtube.com/watch?v=UwccPR66xwy8


