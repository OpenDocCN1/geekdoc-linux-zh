    # Adding printing functions to the case


    Thanks to the personalised casing, Pierre could easily hide a cheap thermal printer
    into the top of the unit. It is attached with just four miniscule screws, which
    have their own cut-out groove in the unit.


    # Printing on-the-go


    One of the biggest issues Pierre faced with this project was the original printing
    speed. However, thanks to a series of hardware tweaks, he could get his taken
    images fully printed in just a matter of seconds.


    # 3D-printed case


    Pierre took the time to design the entire casing of the Pi Zero in Autodesk. He
    stripped back the complexity traditionally found in 3D printing, choosing to print
    three plastic components for the Polah Zero.


    # Tinkering the camera settings


    To maximise the capabilities of the Pi camera module used here, Pierre used its
    onboard Python library. With this, he could tinker with the finer points of the
    camera set up, and toggle how it worked with the printer.


    # Components list


    +   - Raspberry Pi Zero

    - Thermal receipt printer

    - Sharp memory LCD

    - Official Pi camera module

    - 3D-printed case

    - 3A voltage regulator

    - 7.2V battery


    Left: The nano printer used here prints on regular receipt paper, which means
    printing quality isn''t the best.


    Far right: The LCD screen at the rear of the unit is used to manage prints, as
    well as to de-spot previews of taken images.'
