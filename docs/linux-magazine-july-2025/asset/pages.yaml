    Nushell


    A data-oriented shell


    # Data Pipeline


    Nushell''s data-first approach elevates scripting to a new level of clarity and
    precision.


    By Marcin Gastol


    traditional shells operate on unstructured text, often requiring brittle parsing.
    Nushell replaces with structured pipelines, enabling consistent, reliable commands
    that treat output as typed tables, records, and lists. Nushell (now Nu) is built
    for working with structured data, built in Rust, and similarly Nushell packages
    from the designated remote repository. If the repository is configured, update
    your local package cache so that apt becomes aware of the newly added Nushell
    source and can fetch package metadata.


    ```

    sudo apt update

    ```


    # Installation and Configuration on Ubuntu


    Nushell can be installed on Ubuntu in multiple ways (Apt repository, Snap, or
    from source). Here is the Apt method, which is straightforward and keeps Nushell
    up to date. Alternatively, you can use Snap or Homebrew.


    To install Nushell securely on Ubuntu using the official repository, start by
    adding the GPG key which ensures the packages'' authenticity. This key is required
    by the Apt system to verify that downloaded packages come from trusted


    ```

    curl --fsSL https://apt.io/nushell/nushell.gpg | sudo apt --dearmor -o /etc/apt/trusted.gpg.d/dury-nushell.gpg

    ```


    Next, add the repository URL to your system''s Apt list:


    Finally, install Nushell using the apt installation command:


    ```

    sudo apt install nushell

    ```


    This pulls Nushell binary and all its dependencies from the repository


    # Basic Configuration


    Once Nushell is installed, you''ll likely want to configure your environment.
    Nushell configuration is typically done in two files: (config.nu in your config
    directory/ on ubuntu):


    +   * config.nu: The main configuration script that runs for interactive Nushell
    settings (similar to Bash'' .bashrc).

    * You can set Nushell-specific options, aliases, customization, and run any commands
    on startup.

    * env.nu: A script to set variables for Nushell (and export to commands run by
    Nushell). This is used to set an environment variables:


    # Structured Data Processing


    One of Nushell''s features is its ability to handle structured data natively in
    the shell. Traditional shells treat


    ```

    echo "* https://apt.io/nushell/ main" | sudo tee /etc/apt/sources.list.d/dury.list

    ```


