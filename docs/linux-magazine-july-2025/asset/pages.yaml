  md: "# MAKERESPACE NiceGUI Web Apps\n\nI mounted Pi on a protected railing where\
    \ I wasn't concerned about moisture. For a more weatherproof setup, I recommend\
    \ that you use the Raspberry Pi and BME280 sensor in a tight container and then\
    \ mount a second Pi and weather looking out a window. The outside Pi could run\
    \ the full NiceGUI code and the second Pi's its IP address for the device.\n\n\
    The only additional software that is required for the BME280 sensor is that you\
    \ can install with `pip install bme280`. Listing 1 shows the we code to display\
    \ the outside temperature. The configuration was spread across multiple lines,\
    \ but only 12 lines of code were needed for this. The UI is automatically refreshed\
    \ by the `ui.interval` streamer, and the temperature is updated every 15 seconds\
    \ using a NiceUI timer.\n\n# Listing 1: Weather Station Project\n\n```\n01 #/bin/python3\n\
    02 #\n03 # gauge.py write BME280 sensor data to a gauge\n04 # from bme280 import\
    \ Sensor\n05 from nicegui import ui\n06 #\n07 # Define the BME280 device with\
    \ I2C address\n08 # Sensor (offset=-37)\n09 \n10 with ui.header(background_color='#3878c8'):\n\
    11 ui.markdown('## My Weather')\n12 \n13 v = ui.image('http://192.168.0.105:8081/action?action=')\n\
    14 \n15 chart = ui.chart({\n16 'title':{\n17 'outer': 'Outside Temperature',\n\
    18 'left': 'center',\n19 'series':[\n20 {'type': 'gauge', 'min':-20, 'max': 40,\n\
    21 'startangle': 180, 'endangle': 0,\n22 'data': [round(sensor.get_temperature(),1)]\n\
    23 'detail': {'formatter': '{value} C'}}\n24]}\n25})\n26 \n27 \n\n28 # Create\
    \ a refresh function that updates the temperature\n29 def update():\n30 chart.options['series'][0]['data']\
    \ = [\n31 round(sensor.get_temperature(),1)]\n32 update()\n33 \n34 # use the nicegui\
    \ timer to periodically refresh the data\n35 ui.interval(15, update)\n36 \n37\
    \ # Run the framework on the desktop port 8080\n38 ui.run(title='My Weather Station',\
    \ show=False)\n```\n\n# ##-A Pi Rover Project\n\nFor the project, you will need\
    \ a Raspberry Pi, a Pi portable shuttle, a USB bag, and some straps and erasers.\
    \ Ive used a Pimoroni Explorer Hat Pro Shield, but any motor or relay shield would\
    \ be fine. It's important that you don't connect the motors directly to the Raspberry\
    \ Pi pins, because the Fe+ hardware is not designed to handle large surges.\n\n\
    Your specific rover will probably have some software. With my hardware, I needed\
    \ the Pimoroni Python library that can be installed with:\n\n```\ncurl get.pimoroni.com/explorer/\
    \ | bash\n```\n\nListing 2 shows all it takes to create a web interface that controls\
    \ the Pi rover and includes a real-time video stream from driving. Ive implemented\
    \ the project numerous times using Bash Config, Node-RED, Pi, and several Python\
    \ libraries, and I believe that NiceGUI offers one cleanest and fastest solutions\
    \ with only 14 lines of code.\n\nThe script uses ui to create colored buttons\
    \ to control the rover's directions (16-21). A button group (from line 19) handles\
    \ the LEFT, RIGHT, STOP and buttons on one line. All of the connect() function\
    \ that sets the first and second motor speeds (11-13). Figure 4 shows the rover\
    \ and NiceGUIbased interface.\n\n![](img/5d8ea078bd95ce53a498c7a527477ee9_71_0.png)\n\
    \nFigure 3: The NiceGUI-based Raspberry Pi weather station the page on the right.\n\
    \n72 JULY 2025 ISSUE 296 LINUX-MAGAZINE.COM"
