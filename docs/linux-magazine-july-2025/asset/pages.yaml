  md: '# IN-DEPTH


    # Command Line — deborphan


    Managing Debian packages with deborphan


    # # Dependency


    # # Minder


    The deborphan utility helps you keep track of packages and others on a Debian-based
    system. By Bruce Byfield


    Debian is distinguished by its utilities for package management. Every package
    manager has commands, but deborphan also has to find utility packages for everything
    creating and installing packages. Many of the other utilities, such as apt-cache,
    have been added to apt (the stripped version of apt-get), while Niall U uses lets
    to find like apt does. Many other utilities remain hidden in the Debian repositories,
    they are worth seeking out. One example is deborphan [1], which identifies unused
    packages. Deborphan is useful for freeing up space on a system and, importantly,
    for deorphaning.


    exactly what is, which is prepared for security.

    Deborphan takes its name from Debian''s packages that are not dependent on any
    other package. These orphans are the remnants of packages that have been left
    behind because Debian''s package management commands do not remove them, regardless
    of whether they are needed. Deborphan can be frequently requested, orphaned packages
    that add enhancements most users would want, and suggested packages that enhancements
    add As ages, orphans can quickly multiply, especially because recommended and
    suggested packages can sometimes outnumber the required dependencies.


    ```

    root@~$ deborphan

    ststreamamer-o-packetlib

    libgd2-0

    libsoundlist-alsa

    libfontconfig-dev

    libdbus-gl

    libxml2-components-alsa

    libplugin-proxy-getsettings

    libplugin-proxy-manager

    libbluetooth-0

    libth6

    tcl-snap

    root@~$

    ```


    and packages to keep in no particular order in /var/lib/deborphan/keep.


    ### Using deborphan

    Usually described deborphan divides options into four sections. The top section
    lists options for the command, with usual --help and --version. The options also
    include -f for those who do not want to use /var/lib/pkg/status


    The second section, Output Modifiers, covers more useful options. The bare command
    lists orphans output modifiers which greatly modify the command. A complete overview
    of installed packages and their dependencies can be had with --show (-d) (-i)
    and is best picked through this tool to be sure to be on. With other options,
    users use --priority (-j) modifies the priority of a package, such as lists hidden
    packages are shown up to date. Using --selection (-s) will show where a package
    can be found in a Debian repository.


    The third section of the page, Search Modifiers, covers options that can be key
    to getting the most out of deborphan.


