  md: '# # IN-DEPTH


    # Ptcpcdump


    devices simulated at the software level (TUN devices). Anyone who works with containers
    or standard VMS needs TUN support. Ptcpcdump is


    designed as a drop-in replacement for tcpcdump, and many of the same commands
    will work for both tools (the built "CLIT Compatibility")


    Docker is known to have a relatively complex network of bridges and other types
    of interfaces. With tcpcdump, admin needs to search through interfaces to find
    the network traffic of a specific container. Ptcpcdump removes the extra steps
    by providing native integration into Docker and Kubernetes. You only need to find
    the PID or the ID to connect to the traffic. The tool takes care of the working
    automatically, as the Docker runtime is installed and active.


    # ## CLIT Compatibility


    When tools use as Ptcpcdump set up to replace established detectors, compatibility
    at command-line level is a crucial question. Administrators prefer the most important
    tools by using the new tool to support the old commands and adapt to the learning
    curve.


    Ptcpcdump has adopted most of the parameters from ptcpcdump. This is because ptcpcdump
    --interface -w output.pcap will capture the content you would expect if you were
    a Ptcpcdump.


    GitHub directory for a complete overview of all of Ptcpcdump''s features and the
    details which they are supported.


    Differences with respect to required options might mean that one of the two tools
    does not work. For example, tcpcdump uses the -p parameter to track the traffic
    of a specific PID, whereas tcpdump uses it.


    # ## Close Inspection


    Ptcpcdump is relatively new and not adopted by most of the popular distributions,
    yet ready-to-run binaries for x86_64 and ARM64 are available. If you have a build
    environment for Go, you can also install it locally.


    To install Ptcpcdump, simply download the tar, unpack ptcpcdump to /usr/local/bin
    (Figure 3). You can then start tracking data, because the mandatory BPF is enabled
    and available on all-of-the-date Linux distributions.


    Some administrators might get alarmed the first time they run Ptcpcdump, because
    the initial error messages on systems without a Docker runtime don''t need to
    worry about. None of the other feature of Ptcpcdump is practically useful in Kubernetes-environments:
    native isolate containers.


    If you prefer not overwhelmed with output, it doesn''t have to. You can easily
    tailor the output to the what you need. You will need to set the parameters like
    the PID and the source destination of the traffic in the unit. In the first example
    from Linux 1, you can see the traffic from that process with process ID 35268.
    The traffic originates from a Docker container named test, which in turn returns
    to the default.


    If you prefer more output, you can use the -g option


    ```

    $root@host:~# wget https://github.com/molillag/ptcpcdump/releases/download/v0.3.1/ptcpcdump_0.3.1_linux_amd64.tar.gz

    $ tar -xvf ptcpcdump_0.3.1_linux_amd64.tar.gz

    $ cd ptcpcdump_0.3.1_linux_amd64

    $ sudo cp ptcpcdump /usr/local/bin/

    $ ptcpcdump --version

    ptcpcdump version 0.3.1 (2022-05-01 11:00:42) (88.3 MB/s in 0.2s)

    ```


    ```

    LICENSE

    README

    README-cn.md

    ls /usr/local/bin/ptcpcdump

    ```


    Figure 3: To install the tool, simply unpack the downloaded archive and move the
    file to /usr/local/bin.'
