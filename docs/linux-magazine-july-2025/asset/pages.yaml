  md: '# NEWS

    Linux News


    Graham also points out that the idea of Long Term Support doesn''t automatically
    go away because they''re dropping the label and, in the end, the dev team "decided"
    to strengthen our messaging that users of KDE software on LTS distros should be
    reporting to their distro, and not to KDE.


    Make sure to read the full post from Graham here: https://tiestick.com/2025/05/01/notes-from-the-graz-plasma-soft/?ref=news.itsfoss.com.


    # Arch Linux Available for Windows Subsystem for Linux


    Robin Candid (https://antitz.fr/) recently announced that Arch Linux is now available
    to use within Windows Subsystem for Linux (WSL).

    Until recently, the only distributions available to WSL included Ubuntu, Debian,
    Fedora Remix, openSUSE, Kali Linux, and Penguin, so Arch Linux will be a welcome
    addition to many who have been hoping to try the rolling release distro or develop
    for it.


    Candau, the official maintainer of the Arch WSL image, is building and releasing
    new versions via Github CI/CD. The goal is to provide a complete system that offers
    the Arch Linux experience.


    For those looking to run a full-blown desktop environment with Arch Linux, you''ll
    need WSL2 installed because the original WSL doesn''t support GUI apps. Candau
    also warns that as Arch is booted into WSL, it''s important to upgrade with the
    pacman -Sy command to ensure you have the most recent build and packages.


    You can find more information on the official GitLab for the Arch Linux image
    (as the code - https://gitlab.archlinux.org/archlinux-wsl). There, you''ll need
    the necessary command for installing Arch via the automated process (wsl install
    will do just fine) and even instructions on how to install the image manually.


    This project started in February 2025 and is now enjoying its first official release.


    # System76 Releases COSMIC Alpha 7


    System76 has released the latest version of its COSMIC desktop with bug fixes
    and features.


    First off, there''s the usual round of bug fixes that isn''t just squashing bugs,
    because Arch Alpha 7 has a few new tricks up its sleeve. For example, the newly
    minted ability to not only click and drag a workspace to reorder it, but you can
    also pin a workspace so it can''t be moved.


    Then there are the new accessibility features, including high contrast mode, color
    filters, color inversion, and mono sound. The desktop has been improved both that
    the Super + Scroll can be disabled, as well as various improvements.


    COSMIC also has new widgets, which appear when you move your mouse in the app
    tray, workspaces, library and layers. As well as you to use an application-specific
    shortcut, even if that app is not in focus.


    Other improvements include scaling optimizations, improved shortcuts, seek-alpha
    search in COSMIC files, a left-right balance scale added to settings, and tons
    of bug fixes.


    You can read all the changes in the official alpha 7 release (https://blog.system76.com/post/cosmic-alpha-7-never-been-beta)
    and download an ISO from the official COSMIC site (https://system76.com/cosmic/).


