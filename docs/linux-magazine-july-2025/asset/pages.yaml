    # # Nate explores the top FOSS including the latest KDE app suite, a passphrase
    generator, a post-apocalyptic roguelike, and an AI-powered tarot card generator.


    BY NATE DAKE


    # ## The Battle for Open Source


    Unfortunately, the OTF faced the casualty of the White House''s defense industry.
    In a statement by USAGM CEO Kari Lake, the OTF declared a "huge and burden on
    the American taxpayer" and was cut, leading to an ongoing lawsuit.


    As I read through the comments on this story in the r/linux subreddit, one user
    noted that they visit the whistle-host website. Sure enough, its SSL certificates
    issued by Let''s Encrypt, as a number of other federal agencies. The Tor is used
    by the US, now downloading the onion routing software TOR users. The OTF is a
    staunch supporter of OpenVPN, a popular protocol used by people living under repressive
    regimes to evade censorship.


    The bottom line is that open source funding is like the tide: When it rises, we
    benefit. When it falls, we lose all again.


    # ## KDE Gear 25.04


    Fans of KDE know that it comes with a powerful set of applications and libraries.
    The official release of 25.04


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_81_1.png)


    The dolphin manager has been overhauled for better accessibility and usability.
    This integration with the Orca screen reader lets you navigate through files using
    the arrow keys and press to open them. The Crash in text menu now appears in red,
    so happily users won''t click on again. Users can also rename tabs. The file manager
    now includes support for right-to-left languages such as Hebrew, which you can
    enable by running it. Theer browser is now the version you downloaded files. KDE
    Connect has been upgraded to transfer files faster without. The Oklar document
    viewer now supports PGP digital signatures. Kmail email lets you check the validity
    of PGP certificates. The


    Keysmith G24 can now import tokens from QR codes and OTP. The KDE travel itinerary
    has introduced new features, including support for European country travel. It
    is now well compatible with Bluetooth and PKP PDF tickets, as well as International
    ticker allows users to configure region settings for public holidays. The K2 engine
    has been overhauled for improved performance. Despite the official announcement
    and the new release of Ubuntu I was able to find the latest version of KDE Gear
    in star Linux distro. If you want to test these new features, I did recommend
    downloading the Unstable or Edition of KDE from neon.kde.org.


