  md: '# MADDOG''S DOGHOUSE


    Remembering the USENIX ATC before its 50th – and last – event in July 2025. BY
    JOHN "MADDOG" HALL


    # The final USENIX ATC


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_76_0.png)


    Recently, a long time friend and fellow Bell Labs alum made a comment on my Facebook
    page about the 50th (and last) USENIX Annual Conference (ATC) of usenix.org.

    For those of you not unfamiliar with the USENIX organization, they encourage research
    in computing systems. While this was oriented around ACID and Unix-like systems,
    they also encouraged research in operating systems, concurrency, memory management,
    filesystems, networking, and other elements

    They encouraged peer-reviewed papers and bringing these papers to conferences
    for all, they changed to access these papers, but in 2008 they opened up to everyone.

    They also offered free conferences on security and privacy. One of the largest
    (and in my opinion) best conferences in administration was the Large Installation
    System Administration (LISA) conference which (unfortunately) ended early.

    I did not attend the first one, which started in 1975. I was programming IBM mainframes
    in assembly language. By the time I started using a USENIX system in 1980, I was
    hired to be a system administrator for an operating system I had never seen before.
    I knew that I would have access to the code for the entire system and also to
    the people who wrote it.

    I learned quickly, mostly because I had used other operating systems and had taught
    operating system for three years at State Technical College. The fundamentals
    of how the hardware interacted with Bell Labs'' techniques helped me learning
    Linux, and how those papers showed me the problems they encountered then.

    We followed research from Bell Labs to other places. The University of California
    Berkeley BSD research, Carnegie Mellon, MIT, and other universities, as well as
    those who used Unix in the early days met at USENIX to discuss various methods
    that could implement in their system.

    It was at USENIX that people would bring their 9-track tapes (per internet) to
    copy software from one person to another.


    Jon "maddog" is an author, educator, scientist, and former pioneer who has been
    a passionate advocate for Linux since 1999 when he first met Lin Torvalds and
    facilitated the growth of Linux as a platform. He serves as president of Linux
    International®.


    USENIX with remote terminals permitted people to read email on carrier-cell phones
    (Before laptops and WiFi). USENIX had places where you could have a beer or wine
    in your hand with some of the people whose code you used every day – people that
    I respected not only for the code


    I remember one of the attendees'' room where we had to start a "small" store to
    sell copies of free and open source software (FOSS) on DECUS. They had candies
    in the room, soft music, and wine that we produced as copies of codes named “Cwaln”
    and “Prime Time favors” as well as books from Free Software Foundation and O’Reilly’s
    Annual.


    When I met DECUS in 1994, it was at the ATC that I got to him some "Linux Products"
    for free and saw a "Linux of Products set be returned to me. I remember that Linux
    system with a hot dot in his head.

    It was another USENIX event in Boston where I was honored as the DECUS Committee
    member for outreach, who saw the growth of Software Tools Groups (STG) and the
    atmosphere Achievement (“The Flame”) headed up the Bell Labs department that joined
    Ken Thompson and Dennis Ritchie (and others) that they research in 1969. Many
    could could handle the concept of “pipes and filters” and wrote some of the them.

    There is more, but it was USENIX (in 1997), when the program was for (“UNIX”)
    that used Unix and Linux together.

    I worked with the Board of Directors for since the needs of the Linux community
    helped me away from serving, remembering the good times I had at USENIX events
    and with USENIX staff that will remain with me.

    If you may want to consider this 50th (and last) ATC in Boston (where we met him)
    July 7-9,2025 and see what the USENIX ATC is about.'
