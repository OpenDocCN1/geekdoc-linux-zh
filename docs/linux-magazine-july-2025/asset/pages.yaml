    ![](img/5d8ea078bd95ce53a498c7a527477ee9_91_0.png)


    On the System configuration, you can define the maximum number of feeds and categories
    that every user may have. The default values for these partners (13,107 and, respectively,
    16,384) are what any normal human could ever read, it might be a good idea to
    reduce the load on your database server. Another parameter that you should set
    according to your needs and usage patterns is longer users logged in before being
    out again, which is about 2 hours.


    Even more important is the User Registration: If you do, you will be the only
    one who can create accounts. If you enable it, you can still limit how many accounts
    be created by it and force email address for those accounts.


    As far authentication goes, by default FreshRSS only lets users in with an ordinary
    format for their username and password. You may disable authentication (which
    is always a really bad idea) or enforce authentication procedures by connecting
    FreshRSS to a single-sign-on (SSO) service.


    You: can import many feeds at once or share with others, in many different formats.


    private feeds, which cookies to use or to accept cookies in the first place. Other
    things you may configure, but are not limited to, the refresh frequency of a feed,
    and also how to avoid showing new duplicates. Finally, it is possible to import
    or export full lists of feeds in several formats (Figure 10).


    The really interests of FreshRSS authentication capabilities, however, are support
    for anonymous users and third-party applications. You can allow anonymous reading
    and refreshing of all the feeds loaded by the administrator or offer free of selected
    feeds to visitors who visit your company or school intranet.


    # Administration and Management


    The first user created in the initial configuration of FreshRSS can, and should,
    do more than simply read. With begin, FreshRSS supports users, and even if you
    are the only user of FreshRSS installation, you should set up one account (with
    a fresh password) just for reading the news. Doing making your installation a
    bit more secure and ensure you don''t change configuration unless you really want.


    The API Access Function, instead, allows all the desktop or mobile applications
    that FreshRSS supports to read all the feeds of your user. In order for that to
    actually happen, however, those applications must know the API password that user
    must have in the Profile section of his or her own account. This is necessary
    to let people share feeds with others without revealing their password.


    The default user of FreshRSS installation must also manage two kinds of tasks:
    Administration and Configuration, both accessible by clicking on the gear icon
    in Figure 2a.


    Speaking of administration, it''s worth noting that many FreshRSS administrative
    actions can be done on the command line using the tools in the cli of FreshRSS-installation.
    For some important examples. Besides handling users, the Administration menu has
    five entries: Three dedicated to regular maintenance (Installation Check, Update,
    and Logs), and to System Configuration and User Authentication.


    Finally, to get out of FreshRSS, you will need to learn and utilize the Configuration,
    whose main functions — besides those I already hinted at — sharing, archiving,
    and installing extensions.


    Listing 4: FreshRSS-Command Line


    Create a new user:


    ```

    ./cli/create-user.php --username username --password ''password''

    ```


    Fetch feeds for the specified user:


    ```

    ./cli/actualize-user.php --username username

    ```'
