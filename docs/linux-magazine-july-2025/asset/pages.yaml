  md: '# JUST ONE MORE YEAR ...


    Dear Reader,


    So much of the big news these days is all about AI. AI advances, Politics, Colerate
    maneuvering, Power usage ... I was feeling a bit downcast about the prospect of
    writing another AI column when, in fact, there isn''t much I can say on a page
    that isn''t either speculation or well-trodden predictions. I noticed a letter
    from a reader who had swung the way back into the deep past. Retros: The PC-style
    computer you bought a couple months ago, remember?


    The BBC website recently brought an article on contemporary uses for really Windows
    computer systems (1), and I''m not just talking about people logging on at home.
    I also noticed some low-tech induction systems out in the real world. High-tech
    street. I''ve always had a love-hate relationship with wanting to throw out my
    computer and buy a new one because some company (or anyone) wanted to chalk up
    older. One of the things that attracted me to Linux was the idea that I wouldn''t
    have to go through timelines of planned obsolescence.


    Commuter trains in Germany run on Windows 3.11 ... ATMs with Windows XP ... Software
    for veterans hospitals that still run on Windows NT. According to the article,
    the computer that starts the automatic train control system for the San Francisco
    light rail system runs on MS-DOS, and the system won''t boot in the morning unless
    someone carries a floppy disk into the floppy drive.


    As the expression goes, ''If it ain''t break, don''t fix it.'' These systems are
    all doing what they were designed to, so no one seems to mind that they exist
    in a world where time waits. One of the takeaways from all this is just the reminder
    of how much time and effort it takes to write complex infrastructure-managing
    software systems - and how risky it is to change something that is already functional.
    Power on the subway train aren''t going to say, ''Wow, this subway is a much better
    experience since they they


    upgraded their software. But if you just the upgrade and nothing works for a couple
    months while you smooth out the kinks, you''ll hear about it from just about everybody.
    Also, it is worth noting, deferred maintenance is a common strategy for governments
    (and even many companies) in difficult years. It worked for years so fix it now
    and then they and three years have passed.


    Many of these systems run legacy software because they are tied to legacy hardware.
    If you''re not ready to buy a new machine, and the old machine is tied to old
    software, you''re stuck with the old software work. I''d wish someone sat down
    and thought through all the security implications, and I''m not confident that
    that has actually happened. A closed system, with no direct Internet access for
    a cybercriminal to use for a break-in, is how secure is that room where you store
    your most bespoke PC that is the brains of your operation


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_2_0.png)


    Joe Casad,

    Editor in Chief


    Info

    (1) "Still Booting After All These Years: People Using Ancient Windows Computers"
    by Thomas German, BBC Future: https://www.bbc.com/future/article/20250516-the-people-using-ancient-windows-computers'
