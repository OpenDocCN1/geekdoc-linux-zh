  md: '# # MakerSpace

    Use simulation to reduce risks

    in electronic design

    SPICE-ing Up KiCad


    Designing a power supply can be an interesting yet dangerous engineering task.
    You can reduce the inherent risk by building a model and running simulations with
    SPICE in KiCad. By Andrew Malcolm


    I was recently tasked with designing a small mains power supply with an output
    of 5V at 1A. As the design would have to pass stringent safety and compliance
    approvals, an off-the-shelf supply was not an option. I set out consider how to
    do this by design with many components and with each design iterations as possible.


    Classic output voltage supplies use a transformer to reduce the AC mains to a
    much lower AC voltage that is rectified, smoothed and regulated to produce DC
    output. However, transformers that operate at a mains frequency of 50/60Hz are
    bulky and often generate magnetic fields that can be troublesome to some nearby
    circuitry.


    In the case of a mains supply (sometimes referred rather confusingly as "off-line"
    supply), the incoming mains is first rectified to produce high voltage DC. For
    a universal input of 85-246VAC (RMS), the input range from 120 to 360VDC. This
    DC is then switched with a high voltage metal-oxide-semiconductor field-effect-transistor
    (MOSFET) or bipolar junction transistor (BJT) at a frequency between 50kHz and
    MHz, which is then smoothed to provide low voltage DC output. The transformer
    is much smaller and lighter due to high operating frequencies, and provides isolation
    between the potentially high input voltage and the low voltage output. The quality
    of this output is crucial for safe use of a power supply, and depends on design
    and construction of the supply. Many of the low cost chargers and other walls
    use transformers with woefully inadequate insulation regard for safety. A quick
    search of the internet will confirm this; one article in particular goes into
    some detail [1], and there are several channels devoted to tear-downs of these
    standard devices.


    # ## Switched Mode


    Almost all current power supplies and voltage converters are switched mode power
    supplies (SMPS). This term covers all manner of power conversion devices, which
    they have in common is converting a DC voltage into a pulsed signal that is then
    fed to some inductor that is in turn to convert those pulses into pulses at a
    different voltage for subsequent back to DC.'
