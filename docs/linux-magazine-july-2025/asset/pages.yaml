  md: '# LINUX VOICE TUTORIAL – FRESHRSS


    # Get all your news from the source with FreshRSS

    Newsie


    # Avoid information pollution from social media with RSS and the FreshRSS aggregator.
    BY MARCO FIORETT


    I can think of two really important things users could do right now to preserve
    their sanity and make the world a better place. One is self-hosting their life
    with Nextcloud [1][2]. The other, which might be even more urgent for many people,
    is start getting online news from reputable outlets totally healthy RSS


    aggregators introduced from toxic social media. In this tutorial, I''ll show you
    how to access RSS news using FreshRSS [3], a multi-user option RSS aggregator.


    # Why RSS


    Really Simple Syndication, or RSS [4], is the most efficient, self-safe way to
    keep up with today''s news. Even if social media platforms are deliberately engaged
    in profiling every user for profit, social media might not be adequate source
    of information. Scrolling endless flows of news that are almost submerged by advertising
    and toxic content is not "staying focused". Luckily, RSS almost completely handles
    all, in a very simple way.


    Every website worth mentioning can be automatically published as a list of URLs,
    and a short excerpt of every web page at a predefined URL. RSS client can access
    these URLs, which are called "RSS feeds," periodically updating and aggregating
    all the information in one list, search, sort, or filter. For the noisy, chaotic,
    and mutually incompatible atmosphere of social media, RSS feels like heaven, because
    you get the news from the source in a single interface, with no distractions,
    advertising, or tracking.


    # Why FreshRSS


    FreshRSS is a great choice for an RSS aggregator. The FreshRSS aggregator is fast
    and supports multiple users from any operating system. FreshRSS is a LAMP application
    [1], an application written in the PHP language that runs on Apache and stores
    all its data in a MySQL or similar database. If you''re already running a LAMP
    stack on your Linux box or a minimum of familiarity with the command line, installing
    FreshRSS is relatively simple


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_87_0.png)


    Figure 1: The web-based part of FreshRSS installation consists of four steps,
    but only the three shown here require custom inputs.


    # Listing 1: Database Creation


    ```

    CREATE DATABASE freshrss;

    CREATE USER ''freshadmin''@''localhost'' IDENTIFIED BY ''linuxest'';

    GRANT ALL ON freshrss.* TO ''freshadmin''@''localhost'' IDENTIFIED BY ''linuxest''
    WITH GRANT OPTION;

    FLUSH PRIVILEGES;

    ```


    EXIT;


