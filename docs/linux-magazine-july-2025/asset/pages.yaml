    \  32 func(path string) {\n  33 websocketerver.Notify(path)\n  34 }\n  35 }())\n\
    \  36 \n  37 addr := \"localhost:8080\"\n  38 log.Debug(\"Starting\", zap.String(\"\
    addr\", addr))\n  39 log.Debug(\"Serving on \" + addr)\n  40 err := http.ListenAndServe(addr,\
    \ nil)\n  41 if err != nil {\n  42 log.Error(\"Server start\", zap.Error(\"err\"\
    , err))\n  43 }\n44 })\n```\n\n# # Preventing Extensions\n\nThe WebSocket protocol\
    \ assumes that the connection from the client is going to stay up. If you restart\
    \ the WebSocket server during development, you might be surprised to see that\
    \ the browser will not reconnect automatically. The currently displayed page will\
    \ not show a change. The reason for this lack of connection is, that the browser's\
    \ JavaScript has no way of knowing the server restart. A manual reload of the\
    \ page is needed to establish the connection.\n\nTo prevent the WebSocket from\
    \ blowing up in your face at some point during its operation, it is important\
    \ to establish basic rules for connections that are no longer needed. How long\
    \ do you wait before a connection should be considered inactive? What is the maximum\
    \ number of connections the server should keep open? What about alarmed and closed\
    \ in the case of flickers or long-term connections? The devil is in the details,\
    \ and it is a very good idea to list the plenty of potential scenarios before\
    \ avoiding issues on the web.\n\n# Listing 4: build.sh\n\n```\n$ go mod init live\n\
    $ go mod tidy\n$ go build -o live init websocket.go\n$ ./live --debug\n```\n\n\
    # # Info\n\n+   [1] WebSocket protocol: https://en.wikipedia.org/wiki/WebSocket\n\
    [2] \"Your Repository with Go\" by Mike Shilli, Linux Magazine, issue 295, June\
    \ 2022, pp. 50-55\n\nThe typical three commands shown in list 4 set all the browsers.\n\
    \n62 JULY 2025\n\nISSUE 29\n\nLINUX-MAGAZINE.COM"
