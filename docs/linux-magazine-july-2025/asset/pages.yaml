  md: '# NEWS


    Improvement comes by the weakness of flatpak permission-reset command.


    Now, the command will only write entries that have actually changed, to reduce
    unnecessary operations. As well, Flatpak applications now use Flatpak IDs from
    top-level process IDs, which help make Flatpak access much easier.


    There are also hardware compatibility updates, bug fixes, stability improvements,
    and developer/documentation improvements.


    Financ, version 1.16.1 adds an improvement in the way Flatpak accesses USB devices.


    According to George Basaves (https://hearnos.com/20250201/flatpak-16-edit/), "technically
    still a sandbox hole that should be treated with caution." The change allows Flatpak
    apps to limit the scope of USB access to input devices.


    As of now, the latest version has to set history standards, but it should be added
    soon. In the meantime, version 1.16.0 is available in the Flatpak Stable Beta.


