  md: "# NiceGuis Web Apps MAKESAPER\n\n+   * Line 9 uses the ui.html method. This\
    \ approach is useful if you want to cut-and-paste some HTML text.\n\n+   * In\
    \ line 12, you can see the ui.label method. It sets two Tailwind CSS [style] to\
    \ configure the text bold and color.\n\n+   * The third approach (line 15) uses\
    \ the ui.mark method. The markdown can adjust the type of text with bold, italics,\
    \ and underlining. For example, each ### header has a set of 3. Colored text is\
    \ not natively supported in the Markdown syntax.\n\nThe final step is to call\
    \ the NiceGUI server framework (line 1). The ui.run() method has a few options.\
    \ In this I ask the web application to run on port 8080 (the default port for\
    \ NiceGUI), and doesn't automatically launch a web browser (browser).\n\nspinner.\
    \ This element is also configured with an on_change event which calls update().\n\
    \nBelow the input, the script adds a field and a knob (line 17). Both widgets\
    \ have a binding configured between their values and number input using the bind_value(obj,\
    \ 'value').\n\n(The first command is only necessary if you haven't previously\
    \ installed Snap.) Once the video streaming is loaded, it can run in the background\
    \ on port 8080. The following command launches jj-streamer in background daemon\
    \ mode:\n\nLine 20-26 can also create a component on the page that can contain\
    \ several presentations. For this, I've defined a single horizontal bar (line\
    \ 24). The update function refreshes the bar's value by calling it on the number\
    \ element. Modifying a value in a chart is a bit more complex than simply changing\
    \ a slider or a knob - example, you can set the first (0th) series and the first\
    \ (0th) item in the chart to a new value and then update the chart\n\n```\njj-streamer\
    \ -b -1 --output_http http:// \"action-stream\"\n```\n\nYou can then create a\
    \ NiceGUI-based video streaming with the ui.run() method:\n\n```\nfrom nicegui\
    \ import ui\ni.image('http://ip_address:8081/action-stream')\nui.run()\n```\n\n\
    This basic example uses the earlier 8081 port with the parameter action-stream\
    \ to see real-time video on the web page. You can get a static image, use action-snapshot.\n\
    \n# Read Input\n\nNiceGUI allows a variety of input controls. Interaction between\
    \ user input and the Python script is handled via event callbacks and/or properties.\
    \ Figure 2 shows an example that uses both methods. The web application adds a\
    \ numeric input (ui.number) to the top of the chart. The value can be adjusted\
    \ by manually changing a new value or toggling the up/down\n\n# Add Video Stream\n\
    \nI will want to stream video from a USB webcam for both the weather station and\
    \ the Pi projects. There are a number of video solutions; for the projects, I\
    \ have used the lightweight jj-streamer [tool] to be installed using Snap:\n\n\
    ```\nsudo apt install snap\nsudo snap install jj-streamer\n```\n\n```\n# Update\
    \ and bind components using a user input\nfrom nicegui import ui\nchart = ui.chart({'series':\
    \ [{'data': [0], 'name': 'min_number'}]})\nnumber = ui.number('A user number',\
    \ value=50, step=10, on_change=lambda: chart.update())\nslider = ui.slider(min=0,\
    \ max=100).bind_value(number, 'value')\n = ui.color('blue', show_value=True).bind_value(number,\
    \ 'value')\nchart.bind_update(number, 'series', 0, 'data', lambda v: [v])\n```\n\
    \n# Weather Station Example\n\nThe hardware for my weather station project includes\
    \ a BME280 sensors ($5-$20), but other components such as low-cost DHT22 sensors.\
    \ I used a newer webcam and found that it had excellent video quality. However,\
