    # Safety Warning


    Simulation allows you to examine the inner workings of a power supply. However,
    in the real world, AC mains and DC mains are potentially lethal, so you are only
    as experienced and expedient as please don''t attempt to build, modify, or take
    measurements from any such supply. No of the "high side" of these circuits is
    at ground, so it''s not possible to connect an oscilloscope to


