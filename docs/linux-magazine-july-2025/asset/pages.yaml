    # Outlook


    All tod, Ptcpcdump is a largely CLI-compatible alternative to its past ancestor
    Ptcpdump. In most cases, you can use Ptcpcdump locally and reference it using
    an alias. Installation is currently still a rough reality due to the fact that
    many popular Linux distributions are still unavailable for Ptcpcdump.


    hope that, as Ptcpcdump continues to spread, Linux developers will take an interest
