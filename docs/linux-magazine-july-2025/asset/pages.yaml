    determine the resolution and detail of the scan, with the scaling feature enabling
    resizing of the scanned image by factors such as 2x, 4x, or 8x.


    In the auto-save settings, you can automate the saving process, directing scans
    to a predefined location with specified file names and extensions.


    Placeholders can be used in file names based on page number or dates. Each page
    or chapter can be saved individually or into one document per scan session, with
    optional features for patches.


    For those prefer not not retain images within NAPS2 after saving, the Clear images
    option will automatically remove them. Otherwise, the original images remain.


    The quality settings provide a balance between scan clarity and size. Maximum
    quality ensures no losses, ideal for PNG files which may look better in larger
    sizes, for detailed documents. For JPEG files, a quality level from 1 to 100 can
    be set, a default setting of 75 offering a good balance between quality and storage
    efficiency (Figure 3). Black-and-white scans, are easily aligned, unaffected by
    this setting.


    Figure 2: The NAPS2 interface is straightforward.


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_78_0.png)


    across a local network. For more advanced edits, scanned files can be saved and
    modified using tools as Gimp or LibreOffice.


    # Scanner Sharing


    Using the ESL driver, scanners can be shared across Windows, Mac, and Linux systems.
    On the computer hosting the scanner, navigate to the scanner sharing window using
    the Profiles section. Click Share to select the scanner you wish to share and
    rename it for easier identification on other devices. Multiple devices can be
    simultaneous, and remain accessible as long as NAPS2 is running on the host computer.


    To share from another computer, create a NAPS2 profile using the ESL driver and
    select the shared scanner. This sharing features leverages the ESL protocol, which
    is widely supported, including on Android devices. For example, the Moira Scan
    app, available on the Google Play Store, can locate the scanner seamlessly.


    # OCR Function


    One feature of NAPS2 is its ability to make text within scanned PDFs searchable,
    thanks to optical character recognition (OCR) support in over 100 languages. Unlike
    standard scanned documents, which treat text as an image, NAPS2 can extract and
    recognize text from scanned files.


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_78_1.png)


    When using OCR for the first time, the OCR button


    The quality settings allow automatic exclusion of blank pages. By adjusting the
    white threshold (brightness level for white pixels) and the coverage threshold
    (percentage of white) that qualifies as a blank page, you can control de-noise
    on pages. Low coverage threshold prevent blank pages from being skipped, while
    high ensures blank pages are excluded. If these false positives and negatives
    occur, experimenting with the white threshold and coverage settings can resolve
    the issue.


    Brightness and contrast adjustments, from -1000 to 1000, enable fine-tuning of
    scan parameters. NAPS2 also supports basic image importing, including brightness,
    and contrast and drag-and-drop. Manual duplex scanning is made easy with interleaving,
    and pages can be rotated manually or automatically for proper alignment.


    The application supports for over 40 languages and enables use of a single scanner


