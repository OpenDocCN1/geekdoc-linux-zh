    Practicing Pen Testing


    # Practice your pen testing skills with the OWASP Juice Shop challenge


    # Juicy


    The OWASP Juice Shop has over 100 tasks that will get you up to speed on pen testing.
    This article guides you through your first steps. By Tim Schürmann


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_21_0.png)


    You can test whether your web server is an open door for attackers by breaking
    into your own system. All you need to do is ... well, what actually? Isn''t there
    anyone offering tasty fruit juices, the Juice Shop also delivers fire against
    the server? But before you perform massive unknown weapons upon your server, you
    might want to take some time to familiarize yourself with the available tools
    and their purposes. The best way to get started is by running Juice Shop in a
    Docker container.


    The Open World Application Security Project (OWASP) makes its Juice Shop [1] available
    for pen testing. It contains a number of vulnerabilities, providing newcomers
    with an ideal target for hands-on pen testing practice. You can play with Juice
    Shop in a Docker container.


    As soon as your distribution is running on the VM or on an old computer, use the
    package manager to integrate the tools I just mentioned. On Kali Linux, all you
    need to do is


    ```

    sudo apt install docker.io

    ```


    All other tools are already in place. The two commands from Listing 1 will download
    the container with the Juice Shop and launch it.


    To monitor the status messages from the container, just leave the terminal window
    open. You can run the security tools against the Juice Shop in a second terminal.
    It is also good to interrupt the internet connection in order you have a completely
    isolated environment.


    # Open for Business


