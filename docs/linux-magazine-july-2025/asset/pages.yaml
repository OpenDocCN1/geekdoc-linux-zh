    # IBM Announces Powerhouse Linux Server


    A new server is released by IBM, the LinuxONE Emperor 5, is going to turn heads.
    The new server uses of the Intel Xeon CPU with built-in AI acceleration, as well
    as the IBM PCIe accelerator to help power the capabilities of the new server.


    According to the official release statement (https://community.ibm.com/community/user/ibm-and-linux/blog/linuxone-targino/2025/05/06/new-generation-of-linuxone/).
    Confidential computing, significant bandwidth, NIST-standardized post quantum
    algorithms, and edge-case hardware security modules provide LinuxONE with secure
    protection of workloads and data. This advanced level of security can help clients
    prepare for existing and emerging threats such as harvest-decrypt-attacks in the
    post-quantum era.


    This new server has been engineered to help address the cost, space, and energy
    challenges that surround AI, such as organizations reduce operational complexity
    by consolidating workloads across multiple servers onto a single high-capacity.


    The LinuxONE Emperor 5 is designed to deliver up to 99.999999% availability, and
    the Intel CPUs include a second-generation-on AI accelerator, so you can make
    more scalable predictive AI.


    The LinuxONE Emperor 5 will be available with Red Enterprise Linux, SUSE, or Ubuntu.
    You can learn more about it on the official IBM site (https://www.ibm.com/products/linuxone-5)


    # Plasma EDS LTS Releases


    For some time, the KDE Plasma developers have offered Long Term releases for the
    development environment.


    However, Nate Graham recently posted (https://pointiestack.com/202505/01-status-of-plasma-system-nate-graham.com/)
    about the status of Plasma LTS, stating, "It''s not to secret that our Plasma
    LTS (Long-Term Support) isn''t really great. It means we work back bug-fixes for
    longer than usually without using them, since Plasma developers enjoy living on
    or testing out new edges." Graham adds, "And there''s no corresponding LTS product
    for Frameworks or Gear apps,".


    Graham mentions on the other that LTS means different things to different people.
    In the end, it''s problematic for the development team to continue with the LTS
    releases.


    And given how quickly Plasma development has ramped up, the need for LTS is no
    longer as apparent as it was.


    At the same time, the developers have considered moving from two to three years
    per release, with a much bug fix release cycle. In the end, of this would make
    every KDE Plasma release (according to Graham) a "mini-LTS."


    LINUX-MAGAZINE.COM


