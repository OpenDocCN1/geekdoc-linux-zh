  md: '# LINUX NEWSSTAND


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere else.
    Explore our full catalog of back issues for specific topics or to complete your
    collection.


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_94_0.png)


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_94_1.png)


    # GRUB GUIs


    Customizing the Linux boot process requires a dive into GRUB. If you''re the type
    who likes to speeling through documentation, you can get by tweaking the config
    files, but a GRUB GUI tool is a safer and simpler route.

    On the DVD: Zorin OS 17.3 Core elementary OS 8.0


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_94_2.png)


    # Secure Browsers


    The Internet is much noisier than used to be, and many believe leading browsers
    like Chrome and Firefox are part of the problem. This month we highlight some
    secure browser alternatives that will help you surf without leaving a trail.

    On the DVD: Rocky Linux 9.5 and SystemRescue 11.03


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_94_3.png)


    # Trojan Horse


    We''re all afraid to fear Trojan horse programs, but what are they really? This
    month we steal a look to show how attackers use Trojans to stash their nefarious
    code in ordinary applications.

    On the DVD: Debian 12.9 Gnome and Arch Linux 2025.02.01


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_94_4.png)


    # What Comes After?


    Git is practically part of the work in open source circles, but can we do better?
    Pijul developers we know can. This month we look at the Pijul project and the
    effort to build a next-generation version management system based patches rather
    than snapshots.

    On the DVD: AlmaLinux 9.5 and Manjaro Linux 24.2


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_94_5.png)


    # Optimizing Linux


    All the classic distros are optimized for abstract "general" use case that nobody
    makes exactly. If you want to get better performance out of your system, you''ll
    need to tune it. This month we study steps for tweaking system and network performance.

    On the DVD: Linux Mint 22 Cinnamon and EndeavourOS


    ![](img/5d8ea078bd95ce53a498c7a527477ee9_94_6.png)


    # LibreOffice Alternatives


    LibreOffice is the reigning king of the desktop, but some users would rather explore
    the other offerings opting-bein for the perennial default suite. We explore some
    of the contenders.

    On the DVD: Fedora 41 Live Workstation and Manjaro Xfce 24.1.1'
