    # Fedora Workstation 42

    64-bit


    # Ubuntu Budgie 25.04

    64-bit


    Fedora, one of the largest and oldest distributions, is the source of packages
    for commercial distributions such as Red Hat Enterprise, AlmaLinux, and Rocky
    Linux. Fedora Workstation is one of a half dozen download editions. Like Server,
    Core, and the newly added KDE Plasma, the Workstation edition features leading
    desktop technology, and Fedora. Fedora Workstation 42 is no exception. Many of
    these features continue the transition from X11 to Wayland. Notable features include
    the latest alpha release of COSMIC, the Rust-written desktop being developed by
    System76; FEX, a speedy emulator for running x86 and x86-64 binaries on an ARM64
    host; and additional support for Intel in x64 slots. More importantly, Fedora
    Workstation 42 is one of the first distributions to include Intelligent Bus Input
    (ibus), an advanced framework for multilingual input available on Wayland. Fedora
    Workstation now supports pop-ups for non-Wayland applications on various Wayland
    desktops as well as the advanced ibus-speech-to-text feature that runs without
    needing an X1 session.


    Code named Plucky Puffin, Ubuntu Budgie 25.04 is a community-developed flavor
    of Ubuntu that defaults to the popular independently developed Budgie desktop.
    The 25.0 release will be supported until January 2025. The release notes emphasize
    that it should be installed separately and is not designed as an update to previous
    releases.


    Like many releases in 2025, Plucky Puffin is part of the transition to Wayland,
    which will not be completed until the 25.10 release, although progress could be
    through PPAs. As part of this effort, Plucky Puffin contributes to their Wayland
    protocols. Another project is a user vote to decide the default email client between
    Evolution, Kont,,, or Thunderbird. A future vote is also being considered for
    snap icons. Plucky Puffin uses the Xfce terminal and Bibata circus, developed
    by Abdulkhaai Khatri, has been described as a "masterpiece.".


