    removing emojis. At the same time, I have no use for the extension that adds a
    three-pane interface that displays the articles'' contents. As they say, their
    mileage may vary, and at the end of the day, the only thing that really matters
    is quality.


    At the time of writing, FreshRSS has about 40 extensions, all reachable from the
    corresponding section of the Configuration menu. Installation is simple, consisting
    of downloading and installing the extension in your FreshRSS subdirectory. Extensions
    can do all sorts of things that make FreshRSS efficient or easier to use, possibly
    connecting it to third-party online services, such as extensions that generate
    article summaries, or how automatically fetch the frequency of new articles is
    downloaded to its website, and change the look and feel of FreshRSS, for example,
    coloring article titles according to the website they are.


    # Go Back to RSS Already!


    RSS has been around for more than 20 years, but social media pushed it into obscurity
    only to us in the changes we have seen in the world today. The sooner we go back
    to the future with RSS, the better for all of us. FreshRSS is an easy way to access
    the power of RSS. ■


