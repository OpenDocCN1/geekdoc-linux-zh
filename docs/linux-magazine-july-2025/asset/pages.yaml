    # openSUSE Joins End of 10


    If you''ve not heard of it yet


    Recently, it was announced that openSUSE would be joining the initiative. In fact,
    openSUSE has decided to rethink its Upgrade to Freedom campaign to the End of
    10 movement (https://opensuse.org/2023/05/05/utf-campaign-shifts-to-end/). Dubois
    Maio says, "A new initiative End of 10 launched that shares the purposes and origin
    of openSUSE''s Upgrade to Freedom efforts. As the #end10 initiative also intends
    to help extend the life of devices that otherwise become e-waste, the narrative
    and members of openSUSE marketing have decided to transition the language campaign
    to joining End of 10 initiative."


    At the same time, openSUSE announced (https://opensuse.org/2023/05/05/desktop-take-run.html)
    that it would be dropping support for the Desktop Environment with Matthias Gerster
    (from openSUSE states). "We, noticed a policy in the Packaging of the Deepin desktop
    within openSUSE. To get around security requirements, our Deepin community package
    implemented a workaround which bypasses the RPM mechanisms to install restricted
    aspects.\ "As a result of this, and in the light of the desktop history we have,
    we will continue using the Deepin desktop packages from openSUSE distributions
    for the time being."


    Although the change is for "the time being," we''ll have to see if there''s a
    reverse change on the part of the DE details that will openSUSE back into the
    fold.


    # New Version of Flatpak


    The development team behind Flatpak has released the latest iteration of the universal
    package, which includes a number of enhancements.


    One of the biggest improvements comes by way of parental control enhancements.
    With the latest release, children are now able to update existing applications,
    by default, when parental controls are enabled. Thanks to this addition, the installation
    of security and bug fix updates can be installed in a more timely manner.


    The release also includes a number of performance and system management improvements,
    as the flatpak prune--dry-run now runs much faster because it skips unnecessary
    calculations that are related to potential disk space recovery.'
