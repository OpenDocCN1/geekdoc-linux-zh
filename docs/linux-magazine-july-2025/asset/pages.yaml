    # ## OpenMandriva Lx 6.0 Available for Installation


    Good news, OpenMandriva fans, version 6.0 is available for download and installation,
    and there''s plenty to be excited about.


    For starters, this is the first time the developers have released a server edition
    into the mix. This new edition includes a minimal set of applications, a pre-configured
    user, support for cloud-init, and more. This version is available for the following
    architectures: x86, 64 (64-bit), AArch64 (ARM64) with UEFI support, and AMD Zen
    (EPYC, Ryzen).


    As for the details, you''ll find 6.1, Plasma 6.3, KDE Gear 25.0, and spins for
    Gnome 48.1, LXQ 2.2, XFCE 4.20, and COSMIC 1.0 alpha. On the Plasma side of things,
    you''ll find X11 and Wayland available.


    If you plan on running OpenMandriva as a VirtualBox guest, the developers strongly
    suggest using X11 because there are issues with Wayland on VirtualBox guests.


    You''ll also find LibreOffice 25.3 with Qt 6 and Plasma 6 integration, Chrome
    135.0.70943 with Google spanish disabled and JPEG-XL support re-enabled, Firefox
    127.0.2 patched with wayland disabled, Falcon 25.04.0, G 3.0.2, and VirtualBox
    7.1.8. As for development tools, there''s LLVM/Clang 19.1, kernel 6.1.251, system
    Mesa 25.0.4, and Java 24.


    Read about the latest release in the official release notes (https://www.openmandriva.org/en/news/article/openmandriva-lx-6-0-the-spring-release)
    and download an ISO from the official OpenMandriva site (https://www.openmandriva.org/release-picking).


    # ## TrueNAS 25.04 Arrives with Changes of Changes


    The latest version of TrueNAS has arrived, and it''ll no longer confuse you with
    CORE and SCALE versions. Inside, the company TrueNAS has merged these versions
    into one release, TrueNAS 25.04.


    This new release (Fangtooth) is built on the foundation of Electric Eel (TrueNAS
    24.10) and includes features such as the Linux kernel 6.12, fast deduplication,
    SX acceleration of the RAID-Z process, LXC containers (OS virtualization) via
    Incus instances, configurable IP addresses for newly added apps, and more.


    There are also new enterprise extensions, including improved security (GOPS STIC),
    RDMA extensions for improved latency on iSCSI and NFS, SCSI cloning, fast file
    copy, fiber channel support for enterprise SAN, and NFS access to snapshot directories.


    You can download a copy of the TrueNAS community edition (https://www.truenas.com/download-truenas-scale/)
    and get help from the TrueNAS community forums (https://forums.truenas.com/?gl=1&18xij0*_g0_clau*MTI402E00DM1MC4znQOI1JM5Y).
    In, you can read more about the latest release from the 25.04 (Fangtooth) Version
    Notes (https://www.truenas.com/docs/scale/25.04/get-started/scalereleasenotes/).'
