  md: "# MAKERSPACE NiceGUI Web Apps\n\n![](img/5d8ea078bd95ce53a498c7a527477ee9_69_0.png)\n\
    \n# MakerSpace\nNiceGUI Lets You Create Web Apps in Python\n\n# What a Nice Web\
    \ App\n\nWith a Raspberry Pi and the NiceGUI Python library you can build a weather\
    \ station or a Pi Rover app in less than 15 lines of Python code. By Pete Metcalfe\n\
    \nThe Python ecosystem is incredibly large, so it will not be unexpected that\
    \ there are some excellent Python libraries to help you create web apps. Packages\
    \ like Remix [1] and SimpleGUI [2] are great tools for building web apps totally\
    \ in Python, and for web charting there are some solid choices [3] and Plotly\
    \ [4].\n\nand multi-media components, and the web server is built-in, too.\n this\
    \ article, I introduce NiceGUI with two Raspberry Pi web projects: a Pi-based\
    \ rover and a basic weather station. Both projects will include live video, and\
    \ the Python scripts will contain less than 15 lines of code.\n\n# Getting Started\n\
    \nTo install NiceGUI on a Raspberry Pi, run `pip install nicegui`. For example,\
    \ create a simple web app with text elements. NiceGUI gives you several options\
    \ for showing text: Figure 1 presents three of the common options:\n\n```\nFile\
    \ Edit View Document Help\n1 #.py /home/pi/nicegui/main.py - Modified\n2 # Show\
    \ some basic writing of text\n3 \n4 from nicegui import ui\n6 temp = 10.7\n8 #\
    \ In HTML format\n9 ui.html('<h1><h1>MY HOME WEATHER STATION</h1>')\n11 # A label\
    \ with CSS styling options\n12 ui.label('BME280 Sensor Data ').tailwind(weight='bold').color('blue')\n\
    14 # A Generic Markdown with code heading 3\n15 ui.markdown(f'## Temperature:\
    \ <code style=\"color:red\">{temp} C</a>')\n17 # Run the web server on port 8080\
    \ with a title, don't open a browser\n18 ui.run(port=8080, title=\"My Weather\"\
    , show=False)\n```\n\n![](img/5d8ea078bd95ce53a498c7a527477ee9_69_1.png)\n\nMY\
    \ HOME STATION\nBME280 Sensor Data\nTemperature: 10.7 C\nui.markdown\n\nFigure\
    \ 1: There are three ways to add text on a web page using NiceGUI.\n\n70 JULY\
    \ 2025 ISSUE 296 LINUX-MAGAZINE.COM"
