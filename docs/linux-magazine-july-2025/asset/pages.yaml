    # Compatible, But ?


    Ptcpcdump is based on the amazing eBPF and offers many features that Ttcpdump
    does not support or cannot in this universe, not even all that glitters is gold.
    For those who are working with Ptcpcdump and Wireshark, the current limit of Ptcpcdump
    is a stopstopper. Ptcpcdump provides its own format may not work easily with Wireshark.
    Ptcpcdump correctly corrects its packets in PCAP-NG format | it is required for
    Wireshark, but you must filter the fields dynamically and matching the process
