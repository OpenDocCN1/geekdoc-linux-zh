- pgno: 76
  md: "# Listing 4.2 flush.sh\n\n```\n#!/bin/bash\n# Flush disks if nobody is on the\
    \ computer\n# Ken O. Burtch\n# CVS: $Header$\n\nshopt -s -o nounset\n\n# Global\
    \ Declarations\n\ndeclare -rx SCRIPT=${0##*/}          # SCRIPT is the name of\
    \ this script\n\ndeclare -rx who=\"/usr/bin/who\"       # the who command - man\
    \ 1 who\ndeclare -rx sync=\"/bin/sync\"          # the sync command - man 1 sync\n\
    declare -rx wc=\"/usr/bin/wc\"         # the wc command - man 1 wc\n\n# Sanity\
    \ checks\n\nif test -z \"${BASH}\" ; then\n       printf \"${SCRIPT}:${LINENO}:\
    \ please run this script with the BASH shell\\n\" >&2\n       exit 192\nfi\nif\
    \ test ! -x \"$who\" ; then\n       printf \"${SCRIPT}:${LINENO}: the command\
    \ $who is not available - aborting\\n\" >&2\n       exit 192\nfi\nif test ! -x\
    \ \"$sync\" ; then\n       printf \"${SCRIPT}:${LINENO}: the command $sync is\
    \ not available - \\\naborting\\n\" >&2\n       exit 192\nfi\nif test ! -x \"\
    $wc\" ; then\n       printf \"${SCRIPT}:${LINENO}: the command $wc is not available\
    \ - aborting\\n\"\n       exit 192\nfi\n\n# Flush disks if nobody is on the computer\n\
    \nUSERS=`$who | $wc -l`\nif [ ${USERS} -eq 0 ] ; then\n       $sync\nfi\n\n# Cleanup\n\
    \nexit 0 # all is well\n```"
