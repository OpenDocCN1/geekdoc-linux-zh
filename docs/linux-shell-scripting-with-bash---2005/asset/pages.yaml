    \ using square brackets. You can list individual characters or ranges.\n\n```\n\
    if [[ $COMPANY = [ABC]* ]] ; then\n      printf \"The company name begins with\
    \ a A, B or C\\n\"\nfi\nif [[ $COMPANY = [A-Z]* ]] ; then\n      printf \"The\
