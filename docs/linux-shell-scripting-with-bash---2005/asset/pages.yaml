- pgno: 321
  md: '# # 17

    # Data Structures and Databases


    ALWAYS SAID THAT I would rather die than work in a tiny, windowless office with
    a green monochrome terminal. Of course, the first job I had after university featured
    just that, except the monochrome terminal was amber instead of green.


    While I was pondering a taxation problem in the custom-built BASIC software that
    company used, I got a buzz on my phone and the president asked me to come to his
    office. His office, of course, had windows. The president had written much of
    the software in his early days and he mentioned me to come over to his terminal.
    “Look at this,” he said. “Here is an array of nine numbers. I turned it into a
    two-dimensional 3×3 array by multiplying one index by three and adding a second
    index! Pretty slick, huh?”


    Having graduated from university with straight A’s, I suppressed a yawn and said,
    “Oh, yes, sir. You are very clever.”


    It was my first introduction to the fact that most software in that company and
    every other company I ever worked at was written at a high school programming
    level. Hash tables and binary trees are considered dangerously elaborate and unnecessarily
    risky, even though they save time and money. Multimillion dollar corporations
    rely on flat files and simple arrays—things that the boss will understand and
    are, therefore, safe. If the software is slow and clunky, the corporation can
    always requisition the newest hardware to improve performance.


    Working in a small company can put a premium on programming skills. This chapter
    demonstrates how to do some of these “dangerous” things, if you’re lucky enough
    that you won’t be reprimanded for programming above a junior level.


    # ## Associative Arrays Using Bash Arrays


    *Associative arrays* (also called “lookup tables” or what the Perl language calls
    “hashes”) are tables containing pairs of values. The first item is the *key*,
    the known value being looked up. The second item is the value *associated* with
    the key. For a table of phone numbers, the key might be the names of employees
    and the associated value is the phone number extension for each employee.'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'Associative arrays can be created quite easily using Bash arrays. Pairs of
    items can be combined into a single item using a special separator character.
    The character should be a seldom-used character, such as a tilde.


    ```

    TABLE[SNEXTITEM]="$1""$SEPARATOR""$2"  # add the pair to the table

    printf "%s\n" "Added $1 / $2 at $NEXITEM"

    let "NEXTITEM++"

    ```


    If NEXTITEM is an integer variable containing the next free position in the TABLE
    array, the pair is added to the table and NEXTITEM is advanced to the next free
    position. If NEXTITEM starts at zero, the pair is added at position zero and NEXTITEM
    is incremented to one.


    To find an item, the table must be searched until the item is found or until the
    end of the table is reached.


    ```

    while [ $ITEM -lt $NEXITEM ] ; do     # reached end of table?

    KEY=${TABLE[$ITEM]}

    KEY=${KEY%$SEPARATOR*}

    if [ "$KEY" = "$KEY2FIND" ] ; then

    break

    else

    let "ITEM=ITEM+1"

    done

    ```


    If ITEM is the position in the table, when the loop completes, ITEM will either
    be the table position containing the correct pair or ITEM will be equal to NEXTITEM;
    one position past the end of the table.


    Listing 17.1 contains a complete script for creating an associative array and
    searching item pairs within it.


    # Listing 17.1 lookup.sh


    ```

    #!/bin/bash

    # lookup.sh

    #

    # create a lookup table and look up items

    #

    # Ken O. Burtch

    # CVS: $Header$

    shopt -s -o nounset


    declare -ax TABLE             # the lookup table

    declare -ix NEXTITEM=0        # next free spot in table

    declare -x SEPARATOR="-"      # delimiter for key/value

    declare -rx SCRIPT=${0##*/}  # name of the script

    ```'
  merge: -1
  img_proc: true
- pgno: 323
  md: "# Listing 17.1 Continued\n\n```\n# add_table: add a key/value pair to the lookup\
    \ table\n#\t\t\t\t (doesn't check for uniqueness)\n#\n#\tparameter 1: the key\n\
    #\tparameter 2: the associated value\n\nfunction add_table {\n\tdeclare TEMP\n\
    \n\t# Check the number of parameters\n\n\tif [ $# -ne 2 ] ; then\n\t\tprintf \"\
    &e\\n \"$$SCRIPT: $FUNCNAME: Expected two parameters\" >&2\n\t\treturn\n\tfi\n\
    \n\t# Make sure the separator isn't in the key or value\n\n\tTEMP=\"${1//$$SEPARATOR/_}\"\
    \t\t\t\t# remove separator (if any)\n\tif [ \"$1\" != \"$TEMP\" ] ; then\t\t\t\
    # from key. Found any?\n\t\tprintf \"&e\\n \"$$SCRIPT: $FUNCNAME: Key $1 must\
    \ not contain $$SEPARATOR\" >&2\n\t\treturn\n\tfi\n\tTEMP=\"${2//$$SEPARATOR/_}\"\
    \t\t\t\t# remove separator (if any)\n\tif [ \"$2\" != \"$TEMP\" ] ; then\t\t\t\
    # from value. Found any?\n\t\tprintf \"&e\\n \"$$SCRIPT: $FUNCNAME: Value $2 must\
    \ not contain $$SEPARATOR\" >&2\n\t\treturn\n\tfi\n\n\tTABLE[$$NEXTITEM]=\"${1}$$SEPARATOR\"\
    ${2}\t# add the pair to the table\n\tprintf \"&s\\n \"Added $1 / $2 at $$NEXTITEM\"\
    \n\tlet \"$$NEXTITEM++\"\n}\nreadonly -f add_table\n\n# lookup_table: search for\
    \ and display item matching key in the lookup table\n#\nfunction lookup_table\
