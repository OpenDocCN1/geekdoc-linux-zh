- pgno: 126
  md: '# Variable Name Matching (! *)


    If the contents of curly braces start with an exclamation point (!) and end with
    an asterisk (*), a list of all variables starting with the specified letters is
    returned.


    ```

    $ COMPANY="Nightlight Inc."

    $ printf "\$\n" "${COMP*}"

    COMPANY

    ```


    # Variable Length (#)


    A dollar sign with curly braces and a leading number sign (#) returns the length
    of the variable''s contents.


    ```

    $ printf "\$\n" "${#COMPANY}"

    15

    ```


    An asterisk or at sign returns the number of parameters to the shell script.


    ```

    $ printf "\$\n" "${#*}"

    0

    ```


    This is similar to $*.


    # Default Values ( :- )


    If the content of the curly braces includes a trailing colon minus after the variable
    name, a default value can be specified which will be substituted if the variable
    is an empty string.


    ```

    $ COMPANY=

    $ printf "\$\n" "${COMPANY:-Unknown Company}"

    Unknown Company

    ```


    The actual value of the variable is left unchanged.

    The colon can be removed to ignore the default:


    ```

    $ COMPANY=

    $ printf "\$\n" "${COMPANY-Nightlight Inc.}"

    $

    ```


    # Assignment of Default Values ( := )


    If, in curly braces, a trailing colon equals appears after the variable name,
    a default value is assigned to the variable if the variable is an empty string.


    ```

    $ printf "\$\n" "${COMPANY:=Nightlight Inc.}"

    Nightlight Inc.

    $ printf "\$\n" "$COMPANY"

    Nightlight Inc.

    ```'
