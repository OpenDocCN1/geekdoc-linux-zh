- pgno: 145
  md: '# # 8


    # Debugging and Version Control


    WHEN I WAS IN BROCK UNIVERSITY, the Macquarrie lab was filled with used Macintosh
    Plus computers passed down from professors who had outgrown them. One day I was
    working on a program for my third-year operating system course. The short C program
    I was working on was reported to be error free. When I ran it, vertical bars appeared
    on the monochrome desktop, my floppy disk ejected, and the computer rebooted.
    Upon closer inspection, I noticed that I used an `!=` instead of a `==` in an
    `if` statement. That small mistake created unforeseen results. Ever since then,
    I treat the C language as a psychotic roommate; we might live and work together,
    but I never take my eye off it for a minute in case it tries to stab me in the
    back.


    Unfortunately, shell scripts are almost as difficult to debug as C programs. Like
    C, shell commands usually assume you know what you are doing and issue an error
    only when the offending line actually runs. Unless shell scripts are thoroughly
    tested, bugs can linger for months or years until the faulty command is finally
    executed. A solid knowledge of shell debugging tools is essential for professional
    script development.


    # ## Shell Debugging Features


    There are several Bash switches and options useful in tracking down problems in
    scripts.


    The `-n` (*no execution*) switch checks a script for syntax errors without running
    it. Use this switch to check a script during development.


    ```

    ```

    $ bash -n bad.sh

    bad.sh: line 3: syntax error near unexpected token `fi`

    bad.sh: line 3: `fi''

    ```

    ```


    In this example, there is an error on or before line 3 of the script. The term
    *token* refers to a keyword or another piece of text near the source of the error.


    The `-o errxit` option terminates the shell script if a command returns an error
    code. The exceptions are loops, so the `if` command cannot work properly if commands
    can''t return a non-zero status. Use this option only on the simplest scripts
    without any other error handling; for example, it does not terminate the script
    if an error occurs in a subshell.'
  merge: -1
  img_proc: true
- pgno: 146
  md: "The -O nounset option terminates with an error if unset (or nonexistent) variables\
    \ are referenced. This option reports misspelled variable names. nounset does\
    \ not guarantee that all spelling mistakes will be identified (see Listing 8.1).\n\
    \n# Listing 8.1 nounset.bash\n\n```\n#!/bin/bash\n#\n# A simple script to list\
    \ files\n\nshopt -O -s nounset\ndeclare -i TOTAL=0\n\nlet \"TOTAL=TTOTAL+1\" \
    \     # not caught\nprintf \"%s\\n\" \"$TOTAL\"\n\nif [ $TTOTAL -eq 0 ] ; then\
    \  # caught\n   printf \"TOTAL is %s\\n\" \"$TOTAL\"\nfi\n```\n\nThe -O xtrace\
    \ option displays each command before it's executed. The command has all substitutions\
    \ and expansions performed.\n\n```\ndeclare -i TOTAL=0\nif [ $TOTAL -eq 0 ] ;\
    \ then\n   printf \"%s\\n\" \"$TOTAL is zero\"\nfi\n```\n\nIf this script fragment\
    \ runs with the xtrace option, you should see something similar to the following\
    \ results:\n\n```\n+ alias 'rm=rm -i'\n+ alias 'cp=cp -i'\n+ alias 'mv=mv -i'\n\
    + '\\. /etc/bashrc \\'\n+ . /etc/bashrc\n+++ id -gn\n+++ id -u\n++ '[' root =\
    \ root -a 0 -gt 99 ']'\n++ umask 022\n++ '[' '' ']'\n+ declare -i TOTAL=0\n+ '['\
    \ 0 -eq 0 ']'\n+ printf '%s\\n' '0 is zero'\n0 is zero\n```"
