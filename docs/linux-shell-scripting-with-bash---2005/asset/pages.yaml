    \ key on IBM-style keyboards)—Moves left and erases one character.\n+   \n+  \
    \ - intr (usually ^C)—Interrupts/stops the current program or cancels the current\
    \ line.\n+   \n+   - kill (usually ^X)—Erases the current line."
