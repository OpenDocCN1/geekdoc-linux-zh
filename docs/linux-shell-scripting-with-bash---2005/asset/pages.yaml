- pgno: 257
  md: '# The Console Display


    The console''s VT-100 compatible display is not controlled by Linux commands but
    through special sequences of characters printed to the display. The console recognizes
    these characters as commands to execute and the characters are not shown.


    The Linux `setterm` command acts like a `printf` command, printing the appropriate
    characters to execute a display command. Some of the `setterm` switches use the
    words \"on\" or \"off\" to enable or disable features. Because `setterm` is essentially
    a `printf` command, you can save common commands into a variable by capturing
    the command''s output. Doing so improves the performance of a script.


    The `-reset` switch restores the terminal settings to their startup state. This
    is the same as using the `reset` command described in Chapter 3, \"Files, Users,
    and Shell Customization.\"


    There are several switches for changing the color of text. A color is one of black,
    red, green, yellow, blue, magenta, cyan, white, or one of these with `bright`
    in front of it. `default` is the default color. The `-foreground` switch sets
    the console normal text color. The `-background` sets the console background text
    color. The `-ulcolor` switch sets the console underline text color. The `-hcolor`
    switch sets the console dim text color.


    Different text styles can be turned on or off with the appropriate switch: `-bold`,
    `-half-bright`, `-blink`, `-reverse`, or `-underline`.


    ```

    $ setterm -ulcolor bright blue

    $ setterm -underline on; printf \"This is bright blue!\n\" ; \

    setterm -underline off

    This is bright blue

    ```


    Because the Linux console cannot show underlining, underlined text is shown in
    the underline color you select. In this case, the color is bright blue. In an
    xterm window, the text is actually underlined.


    The same can be done by storing the `setterm` results in variables.


    ```

    $ UNDERON=$(setterm -underline on)

    $ UNDEROFF=$(setterm -underline off)

    $ printf \"$UNDERON\"\"This is underlined\"\"$UNDEROFF\"\n\"

    This is underlined

    ```


    The `-inversescreen` switch reverses the console''s colors. If you use it twice,
    `-inversescreen` can make the display flash to alert the user to an important
    event. For example, to flash the screen for one second, do this


    ```

    $ setterm -inversescreen on

    $ sleep 1

    $ setterm -inversescreen off

    ```'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Other useful switches include:


    +   - -cursor—Shows or hides the input cursor

    +   - -repeat—Turns a console''s keyboard repeating on or off

    +   - -appcrskeys—Turns cursor key application mode on or off

    +   - -linewrap—Turns a console''s line wrapping on or off


    These can be turned on or off. For example, to hide the input cursor, type this


    ```

    $ setterm -cursor off

    ```


    There are other attributes to control features like power saving and Tab usage.
    See the reference section at the end of this chapter for a complete list of switches.


    # tput


    You can use the `setterm` command for any terminal display, but an attempt to
    use a feature specific to the console is ignored. Instead, there is an old command
    called `tput` (*terminal put*) that works much the same as `setterm` but works
    with all text-only displays.


    `tput` has one parameter; a screen attribute code based on the `terminfo` terminal
    database. These codes are different from the `setterm` switches. You can find
    a complete list on the `terminfo` manual page (`$ man 5 terminfo`).


    ```

    $ tput cols # width of display

    80

    $ tput clear # clear the screen

    ```


    # select Menus


    The built-in `select` command creates simple menus. `select` is a special loop.
    The command is followed by a list of arguments and displays them as numbered options.
    When the user selects an item by typing that number, the argument is assigned
    to the `select` variable and the commands inside the `select` statement are executed.
    See Listing 13.1.


    ```

    Listing 13.1 select_demo.sh

    #!/bin/bash

    # # select_demo.sh: a simple select menu

    #

    shopt -s -o nounset


    declare -i

    SCRIPT=${0##*/}


    printf "\$\n" "Select a document type:"

    ```'
  merge: -1
  img_proc: true
