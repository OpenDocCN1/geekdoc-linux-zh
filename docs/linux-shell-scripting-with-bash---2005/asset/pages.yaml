    free is not script-friendly. To get the information you need, you have to use
    cut and grep. The columns are separated by spaces, which must be compressed for
    use with cut.


    ```

    $ free | grep "Mem"

    Mem: 61792 58880 2912 10120 36156 9068

    $ free | grep "Mem" | tr -s ''\ ''

    Mem: 61792 58876 2916 10120 36156 9068

    $ free | grep "Mem" | tr -s '' '' | cut -d| -f2

    61792

    ```


    # noclobber and Forced Overwriting


    Normally, when standard output is redirected using >, an existing file with the
    same name is overwritten.


    ```

    $ printf "First line\n" > temp.txt

    $ printf "Second line\n" > temp.txt

    $ cat temp.txt

    Second line

    ```


    To provide a safety measure against overwriting an important file, the noclobber
    shell option prevents a file from being overwritten by a redirection.


    ```

    $ shopt -s -o noclobber

    $ printf "First line\n" > temp.txt

    $ printf "Second line\n" > temp.txt

    bash: temp.txt: cannot overwrite existing file

    ```


    A file can be forcibly overwritten using >| instead of >.


    ```

    $ printf "Second line\n" >| temp.txt

    $ cat temp.txt

    Second line

    ```


    The noclobber option is primarily intended for interactive sessions whereby a
    user might type the wrong filename. However, it can also be used as a debugging
    tool in scripts, identifying places where > is used instead of > or where files
    are not cleaned up between script runs.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'For example, in the following script fragment, a log is created, but the date
    is missing from the log. Using `noclobber`, Bash displays an error for the line
    overwriting the date.


    ```

    #!/bin/bash


    short -s -o unset

    short -s -o noclobber


    declare -rx LOG="log.txt"


    date > $LOG

    printf "Results of night batch run:\n" > $LOG


    # etc.

    ```


    The `printf` should use `a >>` redirection. `>` shouldn''t be used in a script
    because it defeats the purpose of using `noclobber`.


    # The fc Command


    The built-in `fc` ( *fix command* ) command lists and edits the command history.
    This command has been largely superseded by the `history` and `!` history recall
    commands.


    `fc` starts the default editor to alter the last command executed. When you leave
    the editor, the command executes. Instead of the entire command, only the first
    characters of a command are needed to make a match. Alternatively, you can specify
    a range of lines to edit. If the lines begin with a minus sign, the lines are
    counted from the end of the history (with `-1` being the most recent command).


    With the `-s` ( *substitute* ) switch, instead of starting the editor, `fc` substitutes
    all occurrences of a word that you specify before executing the command for another
    word. For example, to edit a file with `pico` and then compile the file with the
    `gcc` compiler, use `-s "pico=gcc"` to substitute `gcc` for `pico`.


    ```

    $ pico project.c

    $ fc -s "pico=gcc" p

    gcc project.c

    ```


    The `-l` ( *list* ) switch lists the most recent items in the history, and you
    can specify the first line, or the first and last lines, to display. The `-n`
    ( *no line numbers* ) switch suppresses the line numbers in the history, and `-r`
    ( *reverse* ) reverses the order in which they are printed.


    # ! Word Designators and Modifiers


    The basic features of the `!` history recall command were discussed in Chapter
    3. In fact, `!` has a number of features that enable you to select which command
    is recalled and determine whether or not new information should be substituted
    into the command before executing it.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '!: recognizes word designators, which recall a different word than the command.
    The term “word” is a word in the shell sense; a string separated by whitespace.
    The word designator is separated from the rest of the history recall command with
    a colon.


    A:n selects the nth word on the history line. Word zero is the command.


    ```

    $ printf “%s\n” “date”^\

    Jul 14 14:34:41 EDT 2001

    $ NOW=!!!2

    NOW=“date”^\

    $ printf “%s\n” “$NOW”\

    Jul 14 14:34:55 EDT 2001

    ```


    A:^ indicates the first word after the command, the same as !:1. A:$ indicates
    the last word. A:* represents ^ through $.


    ```

    $ touch temp.txt

    $ rm !!!^\

    rm temp.txt

    ```


    Other designators include :$ (the last word matched by a history search), :x–y
    (words x through y, inclusive), :x* (word x through to the end), :x- (word x through
    to the end, not including the last word) .


    ```

    $ printf “%s and %s\n” “apples” “oranges”\

    apples and oranges

    $ printf “Two fruits are %s and %s\n” !!!:2*\

    printf “Two fruits are %s and %s\n” “apples” “oranges”

    Two fruits are apples and oranges

    ```


    After a word designator, you can include a series of command modifiers, each proceeded
    by a colon:


    +   * :s—Indicates the suffix of a pathname

    +   * :g—Makes the changes “global” over the entire command line

    +   * :h—Indicates the path of a pathname

    +   * :p—Prints but doesn’t execute

    +   * :r—Shows the pathname without the filename

    +   * :s/old/new—Substitutes the first occurrence of the string old with new (essentially
    the same as :)

    +   * :t—Shows the filename of a pathname

    +   * :q—Quotes the words substituted

    +   * :x—Quotes the words after breaking them into individual words

    +   * :l—Repeats the last :s


    Here are a few examples.


    ```

    $ touch /home/kburtch/temp.txt

    $ ls -l /home/kburtch/temp.txt

    ```'
  merge: -1
  img_proc: true
