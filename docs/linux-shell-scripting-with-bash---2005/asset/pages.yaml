  md: 'With the \u2013portability \(-p\) switch, pathchk enforces stricter portability
    checks for all POSIX\u2011compliant Unix systems. This identifies characters not
    allowed in a pathname, such as spaces.


    ```

    $ pathchk “new file.txt”

    $ pathchk -p “new file.txt”

    pathchk: path ''new file.txt'' contains nonportable character ''''

    ```


    pathchk is useful for checking pathnames supplied from an outside source, such
    as pathnames from another script or those typed in by a user.


    # File Truncation


    A particular feature of Unix\u2011based operating systems, including the Linux
    ext3 file system, is the way space on a disk is reserved for a file. Under Linux,
    space is never released for a file. For example, if you overwrite a 1MB file with
    a single byte, Linux still reserves one megabyte of disk space for the file.


    If you are working with files that vary greatly in size, you should remove the
    file and re\u2011create it in order to free up the disk space rather than simply
    overwriting it.


    This behavior affects all files, including directories. If a program removes all
    5,000 files from a large directory, and puts a single file in that directory,
    the directory will still have space reserved for 5,000 file entries. The only
    way to release this space is to remove and re\u2011create the directory.


    # Identifying Files


    The built\u2011in type command, as discussed in Chapter 3, “Files, Users, and
    Shell Customization,” identifies whether a command is built\u2011in or not, and
    where the command is located if it is a Linux command.


    To test files other than commands, the Linux file command performs a series of
    tests to determine the type of a file. First, file determines whether the file
    is a regular file or is empty. If the file is regular, file consults the /usr/share/magic
    file, checking the first few bytes of the file in an attempt to determine what
    the file contains. If the file is an ASCII text file, it performs a check of common
    words to try to determine the language of the text.


    ```

    $ file empty_file.txt

    empty_file.txt: empty


    $ file orders.txt

    orders.txt: ASCII text

    ```


    file also works with programs. If check-orders.sh is a Bash script, file identifies
    it as a shell script.


    ```

    $ file check-orders.sh

    check-orders.sh: Bourne\u2011Again shell script text


    $ file /usr/bin/test

    ```'
