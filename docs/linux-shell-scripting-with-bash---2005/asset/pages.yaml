- pgno: 152
  md: '```

    $ cvs update

    cvs update: Updating .

    ```


    Sometimes the changes involve the same part of the script and CVS can''t combine
    the changes automatically. CVS calls this a conflict and notes this with a c during
    an update. CVS marks the place where the conflict occurred; you have to edit the
    script yourself to resolve the conflict.


    If there are no other problems after an update, you can continue working on your
    source code.


    To delete a script that is already in the repository, remove it using the `rm`
    command and perform a `CVS` update. `CVS` will delete the file.


    While working on your source code, changes are not distributed to the rest of
    your team until you are ready. When the script is tested and you''re ready to
    make it available, use `commit` (or `ci`, which stands for *check in*). Before
    committing changes, delete non-essential files (such as temporary files) to save
    space in the repository.


    ```

    $ cvs commit

    ```


    Like `import`, `CVS commit` command starts your editor and prompts you for a description
    of the changes you''ve made.


    `CVS commit` also increments the version number of your changed scripts automatically.
    By convention, `CVS` begins numbering your project with `1.1`. To start a new
    version `2.1`, edit the version number in the `#header`''s line (or any other
    `CVS` keywords in your script) and change the number to `2.0`. `CVS` saves the
    script as version `2.1`.


    At any time, you can retrieve the log for a script or an entire project. The `CVS
    log` command displays all the related log entries, scripts, and version numbers:


    ```

    $ cvs log project

    cvs log: Logging project

    RCS file: /home/repository/scripts/ftp.sh,v

    Working file: scripts/ftp.sh

    head: 1.1

    branch: 1.1.1

    locker: atrict

