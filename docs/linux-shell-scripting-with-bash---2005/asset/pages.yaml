  md: '# Glossary


    **Absolue paths** are pathnames leading to a file from the root directory.


    **Aliases** are the short forms for commands.


    **Arguiment**s are additional information supplied to a command to change its
    behavior.


    **Arrays**, in Bash programming, are variables containing open-ended lists of
    values.


    **Archiving** is the storage of a number of files into a single file.


    **Attributes** are variable options that can be turned on or off with the declare
    command.


    **Bindings** are the association of particular keys to a Bash editing feature.


    **Blocking** is the stopping of a script while it waits for more information to
    read on a pipe or socket, or while it waits for information to be read because
    the pipe or socket is full.


    A **built-in** is a command that is a part of Bash and not a Linux command stored
    externally on a disk.


    **CGI** stands for Common Gateway Interface, a method of running scripts from
    a Web server.


    **Command history** is a list of the most recently typed commands.


    **Compression** is a reduction of file size by encoding the file.


    **Conflicts** are changes involving the same part of the script that CVS is unable
    to combine automatically.


    **Consol es** are administration terminals attached to a system.


    **Constants** are variables declared with the read-only attribute.


    A **cron tab** is a list of jobs for the cron command to execute.


    The **current directory** is the default directory for a file, denoted by . in
    Linux.


    **CVS** is the Concurrent Version System, a popular version control system.


    **Daemons** are programs that run independently of a shell session, continually
    performing some task.


    **Dangling links** are symbolic links that point to a deleted file.


    **Distributions** are complete Linux systems, usually assembled on CD-ROMS or
    DVD-ROMs.


    **efs2** is the second extended file system, the standard Linux disk storage standard.


    **efs3** is the third extended file system, a variation that uses a technique
    called “journaling” to prevent data loss due to an equipment failure.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '**_emacs mode_** involves command editing in an interactive session using keys
    similar to the emacs editor.


    **Environment** is a Linux term for the collection of variables and open files
    exported from one program to another.


    **Environment variables** are the variables Linux shares between programs via
    its environment.


    The **epoch** is the start of the Linux calendar, January 1, 1970.


    **Expansion** is the replacement of variables and expressions embedded in a executable
    line.


    **Exporting variables** is the process of providing the variables to programs
    run from the script.


    **Expressions** are formulas that calculate values.


    **FIFOs** (First-In, First-Out) are named pipes.


    **Filename completion** is when Bash, in an interactive session, searches for
    a suitable filename matching specified characters.


    **Filters** are commands that take the results of one command and modify them
    in some way in order to supply them to another command or file.


    **Flags** are string variables that indicate a given condition if the value is
    not an empty string.


    **Globbing** is pattern matching by the shell’s wildcard filename matching conventions.


    **Hard links** are links that act identically to the files they represent.


    **Here files** are the lines of data associated with the << redirection operator.


    A **home directory** is the directory a user is given when he or she logs in,
    specified with ~ in Bash.


    **Hostnames** are computer names used to reference specific machines on a network.


    **Indexes** are the positions of items in an array.


    **inode density** represents the number of inodes per storage capacity.


    **Inodes** are the unique identification numbers for Linux files.


    **Job control** is the capability to manage background tasks using built-in shell
    commands.


    **Jobs** are background tasks started from the shell.


    **Keywords** are words or symbols with special meaning to Bash.


    **Links** are shortcuts referring to a file.


    **Lock files** are files that indicate a certain condition, typically that a resource
    or another file is in use.


    **Named pipes** are special files that can be read by one script while being written
    to by another.


    **Open source** refers to software that is released with the source code to the
    general public so that programmers can rebuild or alter the software to suit their
    needs.


    A **parameter** is a switch or an argument.'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'The **parent directory** is a directory immediately containing the current
    directory, specified by `..` in Linux.


    **Patch files** contain lists of changes to upgrade one set of files to another
    set.


    **Pathnames** (or *paths*) are strings that describe the location of a file.


    **Permissions** are the access rights to a file.


    **PIDs** are process identification numbers.


    **Pipe files** are named pipes.


    A **pipeline** is a series of commands joined by the pipe symbol (`|`).


    **Polling** is the act of continually checking to see whether a daemon has new
    work to do.


    **Process substitution** is the redirection of the input or output of a command
    through a temporary pipe file to be read or written by another command.


    **Regular files** contain data that can be read or instructions that can be executed,
    as opposed to files such as directories or pipes.


    **Relative paths** are pathnames leading to a file from the current directory.


    A **repository** is the database maintained by a version control system where
    all master copies are kept.


    The **root directory** is the top-most directory in the directory hierarchy, the
    `/` directory.


    **Sanity checks** are tests at the beginning of a script that verify the existence
    of files and variables.


    A **shar file** is a shell archive created by the `shar` command.


    A **shell** is a program that runs operating system commands.


    **Shell archives** are collections of text files or scripts encoded as single
    shell scripts.


    A **shell option** is a flag that enables or disables a particular Bash feature.


    **Sparse files** are files that contain a large amount of zeros that, under `ext2`,
    don''t consume any disk space.


    **Standard error** is the default file to which error messages are written. The
    symbol is `&2` and the path is `/dev/stderr`.


    **Standard input** is the default file from which input is read for commands.
    The symbol is `&0` and the path is `/dev/stdin`.


    **Standard output** is the default file to which output is written. The symbol
    is `&1` and the path is `/dev/stdout`.


    **Status codes** are numbers between 0 and 255 that indicate what problems occurred
    when the previous command was executed.


    **Switches** (also called "options" or "flags") are characters processed by a
    minus sign that enable command features.


    **Symbolic links** are links that are sometimes treated as different files than
    the ones they represent.


    **Text streams** are text files in a shell pipeline.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '**TCP/IP** stands for Transport Control Protocol/Internet Protocol, the communications
    standard of the Internet.


    **Traps** are signal handlers.


    **UDP** stands for User Datagram Protocol.


    **Utilities** are commands that provide a general-purpose function useful in many
    applications, such as returning the date or counting the number of lines in a
    file.


    **Version control systems** are programs that maintain a master copy of data files,
    scripts, and source programs to track changes and share scripts among several
    programmers.


    **vi mode** is command editing in an interactive way using keys similar to the
    vi editor.


    **Word designators** are the `!` history recall command''s syntax for selecting
    or modifying specific line items.


    **Word splitting** is the act of Bash dividing up the parameters of a command
    into individual words.


    **Words** consist of a shell command and each of its parameters after quotation
    marks and backslashes are interpreted.'
  merge: -1
  img_proc: true
