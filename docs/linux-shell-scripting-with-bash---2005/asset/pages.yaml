  md: '# 1

    # The Linux Environment


    IN THE EARLY DAYS OF COMPUTERS, instructions and data were often divided into
    two separate storage areas. Modern computers follow what is called a “von Neumann
    architecture,” a design proposed by the Hungarian-born computer scientist John
    von Neumann. These machines have one storage area for both data and instructions.
    Effectively, instructions and data were treated the same, making computer simpler
    to build and use.


    Unix-based operating systems, including Linux, extend this principle to long-term
    storage. Linux organizes information on a disk as a collection of files. Every
    file, whether a program or data, is treated the same, making the operating system
    very simple to build as well as flexible to use. Commands that work on a certain
    kind of file tend to have a similar effect on other kinds of files as well, thus
    reducing the number of commands a programmer needs to learn.


    This chapter presents an overview of the Linux operating system, including how
    it is organized and its common conventions. If you are new to Linux, you are not
    expected to understand all the terms presented here. After this foundation, future
    chapters demonstrate these principles using practical examples.


    # ## The Origin of Linux


    The Linux operating system was created as a hobby by a young student, Linus Torvalds,
    at the University of Helsinki in Finland. Linus, interested in the Unix clone
    operating system Minix, wanted to create an expanded version of Minix with more
    capabilities. He began his work in 1991 when he released version 0.02 and invited
    programmers to participate in his project. Version 1.0 was released in 1994.


    Linux uses GNU General Public License (GPL) and its source code is freely available
    to everyone. Linux distributions, CD-ROMs with the Linux kernel and other software
    ready for installation, do not have to be free, but the Linux source code must
    remain available. Making source code available is known as distributing open source.


    The word “Linux” is properly pronounced using a Swedish accent, making it difficult
    to say in North America. It is most often pronounced with a short “i” and with
    the first'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'syllable stressed, as in LIH-nicks, but it is sometimes pronounced LYE-nicks
    (the angli-cized “Linus’ Unix”) or LEE-nicks.


    Strictly speaking, Linux refers to the operating system kernel that starts and
    manages other programs and provides access to system resources. The various open
    source shells, compilers, standard libraries, and commands are a part of another
    project called **GNU**. The GNU project was started by the Free Software Foundation
    (**FSF**) as an attempt to create a free version of Unix. The main Linux C compiler,
    *gcc*, is a part of the GNU project.


    There is also a GNU kernel project, but the Linux kernel has largely superseded
    this effort.


    X Windows is also not strictly a part of Linux. Xfree86, the open source version
    of X Windows, was adapted to the Linux operating system and was released under
    a different license.


    # Files and File Systems


    Each Linux disk (or other long-term block storage device) contains a collection
    of files organized according to a policy or set of rules called a *file system*.
    Each disk can be divid-ed into *partitions* (or “slices”), whereby every partition
    has its own file system. Linux is not restricted to a single file system for all
    disks: the user can use disks created by other operating systems as if they were
    native Linux disks.


    The standard file system is the second extended file system, or *ext2*. This is
    the second revision of the Minix file system with support for large disk sizes
    and filenames. ext2 permits partitions up to 4TB (terabytes), files up to 2GB
    (gigabytes), and 255-character filenames. Newer distributions use *ext3*, a version
    of ext2 with special features for error recovery.


    Support for other file systems might be available depending on your distribution
    and installation options. They might include Microsoft Windows NT, Apple HFS,
    or journal-ing file systems.


    The ext2 file system uses caching to increase performance. If an ext2 disk is
    not properly shut down, files can be corrupted or lost. It is vitally important
    that a Linux computer is shut down properly or is protected by some kind of uninterruptible
    power supply.


    To save space, ext2 files that contain large amounts of zeros (called *sparse
    files*) are not actually stored on a disk. Certain shell commands provide options
    for creating and hand-ling sparse files.


    Each file is identified by a name, and the allowed names are determined by the
    file system. For practicality, the names seldom exceed 32 characters and usually
    consist of lowercase characters, underscores, minus signs, and periods. Spaces
    and punctuation sym-bols, for example, are permitted, but can cause problems in
    shell scripts that do not expect them.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   - .sh—A Bash shell script

    +   - .txt—A generic text file

    +   - .log—A log file

    +   - .html—A HTML Web page

    +   - .tgz (or .tar.gz)—Compressed file archive


    Commands usually have no suffix.


    # ## Directories


    Shell scripts, text files, and executable commands and other normal files are
    collectively referred to as regular files. They contain data that can be read
    or instructions that can be executed. There are also files that are not regular,
    such as directories or named pipes; they contain unique data or have special behaviors
    when they are accessed.


    Files are organized into directories, or listings of files. Like all other files
    in Linux, a directory is also treated as a file. Each directory can, in turn,
    contain subdirectories, creating hierarchical listings.


    Directories are organized into a single monolithic tree. The top-most directory
    is called the root directory. Unlike some other operating systems that have separately
    labeled disks, Linux treats any disk drives as subdirectories within the main
    directory structure. From a user’s point of view, it’s impossible to tell which
    disk a particular directory belongs to: Everything appears as if it belongs to
    a single disk.


    A pathname is a string that identifies the location of a particular file, the
    sequences of directories to move through to find it. The root directory is denoted
    by the forward slash (/) character, and so /payroll.dat represents a file named
    payroll.dat, located in the top-most directory. Using more directory names and
    forward slashes can specify additional directories.


    When users log in, they are placed in a personal directory called their home directory.
    By convention, Linux home directories are located under the directory /home. The
    pathname /home/jgubbis/payroll.dat indicates a file named payroll.dat in the home
    directory of the user jgubbis. The home directory is represented by a tilde (~)
    in Bash. The current directory (or working directory) is denoted by a period (.).
    When a pathname doesn’t start with a leading slash, Bash assumes it’s a path relative
    to the current directory. ./payroll.dat and payroll.dat both refer to a file named
    payroll.txt in the current directory. When running programs, this might not be
    true. This exception is discussed in the next chapter.


    The parent directory is represented by a double period (..). The double period
    can be used at any place in a path to move towards the root of the directory tree,
    effectively canceling the previously mentioned directory in a path. However, it
    makes the most sense to use the double period as the first directory in a path.
    If your current directory is /home/jgubbis, the pathname ../kburch/payroll.dat
    is the same as the pathname /home/kburch/payroll.dat. The double period represents
    the parent directory of /home/jgubbis, the /home directory.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Pathnames without a beginning slash are called relative paths because they
    specify the location of a file in comparison to the current directory. Relative
    paths are useful for representing files in your current directory or subdirectories
    of your current directory.


    Pathnames with a beginning slash are called absolute paths. Absolute paths describe
    the location of a file in relationship to the root directory. No matter where
    your current directory is, absolute paths always identify the file precisely.
    Absolute paths are useful when locating common files that are always stored in
    the same place.


    There are no set rules governing where files are located, and their placement
    is chosen by your Linux distribution. Early variations of Unix stored standard
    programs in /bin, home directories in /usr, and programs specific to a computer
    in /usr/bin. As the number and type of programs grew, the number and function
    of the common directories changed.


    Most Linux distributions include the following directories:


    +   - */dev*—Contains device drivers

    +   - */bin* and */usr/bin*—Contains standard Linux commands

    +   - */lib* and */usr/lib*—Contains standard Linux libraries

    +   - */var*—Contains configuration and log files

    +   - */etc*—Contains default configuration files

    +   - */usr/local/bin*—Contains commands not a part of the distribution, added
    by your administrator

    +   - */opt*—Contains commercial software

    +   - */tmp*—Stores temporary files

    +   - */sbin* and */usr/sbin*—Contains system administration commands (*/sbin*
    stands for "safe" bin)


    # ## Inodes and Links


    Normally, each file is listed in a single directory. Linux can create additional
    listings for a single file. These shortcuts are called *links* and can refer to
    any kind of file.


    Links come in two varieties. A *hard link* is a reference to another file in the
    current directory or a different directory. Whenever some action is performed
    to the hard link, it is actually done to the file the hard link refers to. Hard
    links are accessed quickly because they do not have to be *dereferenced*, but
    Linux limits where a hard link can be placed. As long as a file is being referred
    to by at least one directory entry, it won''t be deleted. For example, if a file
    has one hard link, both the link and the original file have to be deleted to remove
    the file.


    The second and more common link is the *symbolic link*. This link is a file that
    contains the pathname of another file. Unlike hard links, symbolic links have
    no restrictions on where they can be used. They are slower and some commands affect
    the link file itself instead of the file the link points to. Symbolic links are
    not "hard" because they have to'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'be dereferenced: When Linux opens the symbolic link file, it reads the correct
    pathname and opens that file instead. When the file being referred to is deleted,
    the symbolic link file becomes a *dangling link* to a non-existent file.


    Using links means that two different pathnames can indicate the same file. To
    identify a particular file, Linux assigns a number to each file. This number is
    called the *inode* (or "index node") and is unique to any storage device. If two
    pathnames refer to a file with the same inode, one of the paths is a hard link.


    In the ext2 file system, there is a limited number of inodes, which in turn places
    an upper limit to the number of files that can be stored on a disk. The number
    of inodes compared to the amount of disk space is called the *inode density*.
    The density is specified when a disk or partition is initialized. Most Linux distributions
    use an inode density of 4K, or one node per every 4096 bytes of disk space.


    # ## Pipe and Socket Files


    *Pipe files* are a special kind of file shared between two programs. The file
    acts as a buffer for sharing information. One program writes to the pipe file
    and the other reads from the pipe. When the pipe file reaches a certain size,
    Linux halts the writing program until the reading program can "catch up".


    A similar kind of file is called a UNIX domain *socket file*. A socket file acts
    like a pipe but works using network sockets. However, this kind of file is not
    easily used in shell scripts and it won''t be covered in this book.


    # ## Device Files


    The last common kind of nonregular file is a *device file*. Keeping with the file-oriented
    design of Linux, devices are represented by files. Device files allow direct communication
    to a particular device attached to a computer. There are actually two kinds of
    device files, but shell programmers are mainly interested in the type called *character
    device files*.


    All device files are located in the `/dev` directory. Even though many files are
    listed in `/dev`, not all of these devices might actually be present. Rather,
    `/dev` contains a list of devices that can be attached to your computer because
    the Linux kernel was configured to recognize them if they were attached.


    Most of these files are not accessible to regular users, but there are a few that
    are open to general use. One important device file available to all users is `/dev/null`.
    This file represents an imaginary "black hole" device attached to your computer
    that consumes anything sent to it. This is useful for discarding unwanted responses
    from a shell command. `/dev/null` can also be read, but the file is always empty.


    Another device file is `/dev/zero`. This file contains an endless stream of zeros,
    and can be used to create new files that are filled entirely with zeros.


    There are a variety of other devices that might appear in `/dev`, depending on
    your distribution and computer hardware. Common device files include:'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   - `/dev/tty`—The terminal window (or console) your program is running under

    +   - `/dev/dsp`—The interface that plays AU sound files on your sound card

    +   - `/dev/fd0`—The first floppy drive

    +   - `/dev/hda1`—The first IDE drive partition

    +   - `/dev/sda1`—The first SCSI drive partition


    The name tty, for historical reasons, is a short form of “teletypewriter,” a printer
    and keyboard connected to a computer by a cable.


    With this overview of the Linux philosophy, you are ready to begin using Linux
    through the Bash shell.'
  merge: -1
