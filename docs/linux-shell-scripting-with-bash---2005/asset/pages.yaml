- pgno: 239
  md: 'File Editing (sed)


    The Linux **sed** (*stream editor*) command makes changes to a text file on a
    line-by-line basis. Although the name contains the word “editor,” it''s not a
    text editor in the usual sense. You can''t use it to interactively make changes
    to a file. Whereas the **grep** command locates regular expression patterns in
    a file, the **sed** command locates patterns and then makes alterations where
    the patterns are found.


    **sed''s** main argument is a complex four-part string, separated by slashes.


    ```

    $ sed "s/dog/canine/g" animale.txt

    ```


    The first part indicates the kind of editing **sed** will do. The second part
    is the pattern of characters that **sed** is looking for. The third part is the
    pattern of characters to apply with the command. The fourth part is the range
    of the editing (if there are multiple occurrences of the target pattern). In this
    example, in the **sed** expression “s/**dog**/canine/g”, the **edit** command
    is **s**, the pattern to match is **dog**, the pattern to apply is **canine**,
    and the range is **g**. Using this expression, **sed** will substitute all occurrences
    of the string **dog** with **canine** in the file **animale.txt**.


    The use of quotation marks around the **sed** expression is very important. Many
    characters with a special meaning to the shell also have a special meaning to
    **sed**. To prevent the shell from interpreting these characters before **sed**
    has a chance to analyze the expression, the expression must be quoted.


    Like **grep**, **sed** uses regular expressions to describe the patterns. Also,
    there is no limit to the line lengths that can be processed by the Linux version
    of **sed**.


    Some **sed** commands can operate on a specific line by including a line number.
    A line number can also be specified with an initial line and a stepping factor.
    **1-2** searches all lines, starting at line 1, and stepping by 2. That is, it
    picks all the odd lines in a file. A range of addresses can be specified with
    the first line, a comma, and the last line. **1,10** searches the first 10 lines.
    A trailing exclamation point reverses the sense of the search. **1,10!** searches
    all lines except the first 10. If no lines are specified, all lines are searched.


    The **sed s** (*substitute*) command replaces any matching pattern with new text.


    To replace the word **Pine** with **Cedar** in the first 10 lines of the order
    file, use this


    ```

    $ head order5.txt | sed ‘s/Pine/Cedar/g’


    Birdwood China Hutch,475.99,1,756

    Bookcase Oak Veneer,205.99,1,756

    Small Bookcase Oak Veneer,205.99,1,756

    Reclining Chair,1599.99,1,757

    Bunk Bed,705.99,1,757

    Queen Bed,925.99,1,757

    Two-drawer Nightstand,125.99,1,756

    Cedar Toy Chest,65.99,1,757

    Six-drawer Dresser,525.99,1,757

    Cedar Round Table,375.99,1,757


    Pine Round Table becomes Cedar Round Table.

    ```'
  merge: -1
  img_proc: true
