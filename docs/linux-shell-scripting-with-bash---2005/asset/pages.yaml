  md: '36 Chapter 3 Files, Users, and Shell Customization


    # # Shell Aliases


    An alias is a short form of a command. The built-in `alias` command creates simple
    abbreviations for the current Bash session.


    To create an alias, use the `alias` command to assign a command and its switches
    a name.


    ```

    $ alias lf=''ls -qPl''

    $ lf

    -rw-r----- 1 kurtch devgroup 10809 Apr 6 11:00 assets.txt

    -rw-r----- 1 kurtch devgroup 4713 Mar 9 2000 mailing_list.txt

    ```


    Typing the alias command by itself, or with the `-p` switch, lists the current
    aliases.


    ```

    $ alias

    alias lf=''ls -qPl''

    ```


    Bash interprets an alias only once, allowing the aliasing of a command with its
    own name.


    ```

    $ alias ls=''ls -qP'' # Bash isn''t confused

    ```


    Normally, only the first word of a command is checked for an alias. As a special
    exception, if the last character in the alias string is a blank, Bash checks the
    next word in the command to see whether it is also an alias.


    There is no method for giving arguments to an alias. If arguments are needed,
    define a more powerful shell function instead.


    The built-in `unalias` command removes an alias. Use the `-a` switch to remove
    them all.


    Most Linux distributions have aliases defined for common commands. `dir`, for
    example, is often an alias for `ls`. Some distributions define an alias for commands
    such as `rm -i` to force user prompting, which is not required by default. This
    can be a problem for some users such as experienced Unix programmers who are used
    to working with these features disabled. Use `unalias` to remove any aliases that
    you don''t want to use.


    Aliases mixed with shell functions can be confusing because aliases are expanded
    only when a line from a script is read. If aliases are used in a shell function,
    they are expanded when the shell function is defined, not when it is executed.
    For this reason, it is safer to avoid aliases altogether in shell scripts. However,
    they can be turned on in scripts using the `shopt -s expand_aliases` command.


    # # The Bash Hash Table


    When a command is executed without naming a path, the shell searches for the command
    (in the directories listed in the `PATH` variable). When the Bash finds the command,
    it remembers where it is, storing the location in a *hash table*. Thereafter,
    Bash checks the table for the location of the command instead of searching for
    the command again, making commands run faster. However, if the command moves after
    Bash has recorded its location, the shell won''t be able to find the command.'
  merge: -1
  img_proc: true
