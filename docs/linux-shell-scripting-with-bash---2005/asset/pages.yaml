- pgno: 177
  md: '# 10


    Job Control and Signals


    Although I grew up on a grape farm, I didn''t spend a lot of time out in the fields.
    I suppose that was my father''s way of not biasing me towards a life of sweat
    and sunburns. Somehow one farming skill that I never mastered was the use of hand
    signals. It seemed like those who had spent years outdoors were used to gestulating
    over distances and noise, able to understand the most incomprehensible motioning.
    Not so for me.


    One summer my father was trying to place a heavy piece of equipment into the back
    of a pickup truck using his tractor. He had me stationed at the base of the truck
    to line up the equipment and tell him when to start lowering. When everything
    looked in position, I gave him the signal. Unfortunately, my glasses are thick
    enough that they cause spherical aberration—that is, things sometimes appear crooked
    because the light passing through the lenses is bent. Almost at once I saw that
    the equipment wasn''t centered and I started hopping up and down, gesturing wildly.
    But my father didn''t notice anything was wrong until the equipment caved in the
    side of the truck with a sickening crunch.


    Whether it was my bad signaling or his failure to pay attention is beside the
    point. An important condition had risen that was unable to be communicated. Similarly,
    scripts need to be able to delegate responsibilities to other scripts and to interrupt
    each other when pressing matters arise. This cooperation is achieved through job
    control and Linux signal handling.


    # Job Control


    You can start background tasks by typing an ampersand (&) at the end of a command.
    Bash refers to background tasks as *jobs*. Any command or script running in the
    background is a *job*. During an interactive session, the shell keeps a list of
    all outstanding jobs. Managing background tasks using Bash commands is called
    *job control*.


    Job control is available by default at the command prompt but must be enabled
    in scripts with the `-o monitor` shell option. Without job control, background
    tasks can still be started from a script, but Bash''s job-management commands
    are unavailable.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'The built-in `jobs` command lists active jobs. When a background task completes,
    the job is removed from the list.


    ```

    ```

    $ sleep 60 &

    [1]+ 28875

    $ jobs

    [1]+  Running          sleep 60 &

    ```

    ```


    In interactive sessions, Bash automatically checks and reports any changes to
    the background jobs before showing the command prompt. The job status is shown
    in the same format as the `jobs` command. The `set -b` command causes changes
    in job status to be displayed immediately when they occur, even if it means interrupting
    the user while he or she types. In scripts running with job control, the status
    of background tasks is also checked and printed.


    The plus sign indicates the current running job, the one that moves into the foreground
    when the `fg` command is used. A minus sign indicates the last job started.


    Linux assigns all jobs a unique *process identification number* (or PID). You
    can view it by using the `-1` (*long*) switch.


    ```

    ```

    $ jobs -1

    [1]+ 28875 Running      sleep 60 &

    ```

    ```


    The number in square brackets is the position of the job in the shell’s job list.
    The PID number for the job can be expanded into a command using a percent sign
    (%). The `kill` command can stop a job. To kill the first background task, use
    a `%1`. The following example produces the same results as typing `kill 28875`.


    ```

    ```

    $ kill %1

    [1]+  Terminated         sleep 60

    ```

    ```


    Other job list percent codes include `%` and `%+` for the current background task,
    `%-` for the last background task started, and `%*name*` for a job with the name
    *name*. You can search the job names by using `%?`, which matches a job containing
    a particular substring.


    ```

    ```

    $ sleep 10 &

    [1] 13692

    $ kill %?ele

    $

    [1]+  Terminated         sleep 10

    ```

    ```


    The job number substitution is not the same as variable substitution, although
    the `jobs` command `-x` (*execute*) switch makes it behave that way.


    ```

    ```

    $ printf "${d\n" %1

    bash: printf: $1: invalid number

    $ jobs -x printf "${d\n" %1

    6259

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'In this case, the `printf` command (unlike `kill`) is not a job control command
    and has no knowledge of job numbers. The `jobs -x` command substitutes PID numbers
    for job numbers and then runs the `printf` command.


    The `-p` (`PID`) switch lists only the process identification number. The jobs
    displayed can be narrowed to three types: jobs with status changes `-n` (`new
    status`), running jobs `-r` (`running`), and stopped jobs `-s` (`stopped`).


    You can remove background tasks from Bash''s job list using the built-in `disown`
    command.


    ```

    $ sleep 10 &

    [1] 14611

    $ sleep 10 &

    [2] 14623

    $ sleep 10 &

    [3] 14628

    $ disown $2

    $ jobs

    [1] Running         sleep 10 &

    [3]+ Running        sleep 10 &

    ```


    A disowned task continues to run even though it is no longer appears in the shell''s
    job list, but job control commands will not accept the task. In this case, the
    second job continues to run, but $2 is no longer defined. When the second job
    is complete, Bash cannot notify the user because it is no longer monitoring the
    task. The `disown` command is useful when removing background commands you are
    not interested in tracking, such as MP3 players, Web browsers, or other background
    applications on the X Window desktop.


    The `-a` (`all`) switch disowns all jobs just as if the background tasks were
    started in a script without job control. The `-r` (`running`) switch disowns all
    running jobs.


    You can force a script to wait for one or more background tasks to complete by
    using the built-in `wait` command. If no jobs are specified, `wait` suspends the
    script until all the background tasks are finished.


    ```

    $ sleep 5 &

    [1] 7338

    $ wait

    [1]+ Done                 sleep 5

    ```


    # Signals


    A *signal* is sometimes referred to as a *software interrupt*; it''s a request
    to break away from a program and perform an urgent task. When a Bash receives
    the signal, it finishes the current command, identifies which signal was received,
    and takes the appropriate action. If it is able to continue executing the script
    afterwards, it does so, advancing to the next command.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Signals are sent to scripts with the built-in `kill` command. Despite what
    its name implies, `kill` can do more than just terminate programs with its default
    `SIGTERM` signal. Suppose a slow command is running in the background.


    ```

    $ ( sleep 60; echo "DONE"; ) &

    [1] 7613

    ```


    The `kill` command can suspend the command using the `SIGSTOP` signal.


    ```

    $ kill -SIGSTOP 7613

    [1]+ Stopped                ( sleep 60; echo "DONE"; )

    ```


    After the command is stopped, it remains inactive until it receives another signal,
    such as `SIGCONT`.


    ```

    $ kill -SIGCONT 7613

    $ DONE

    [1]+ Done                    ( sleep 60; echo "DONE"; )

    ```


    The `SIGCONT` signal continues execution at the point of interruption. Linux defines
    63 different signals. The signals most commonly sent to scripts are `SIGTERM`
    (immediately exit the script), `SIGSTOP` (stop the script, putting it to sleep
    temporarily), `SIGHUP` (hang up a connection), and `SIGCONT` (continue a stopped
    script). A complete list appears in Appendix E, “Signals.”


    The built-in `disown` command affects how signals are shared with background tasks.
    If the `-h` (`SIGHUP`) switch is used, Bash does not share `SIGHUP` with the background
    jobs of a particular task when a `SIGHUP` is received (such as when a user logs
    out).


    # ## The suspend Command


    The built-in `suspend` command stops a script until a signal is received, just
    as if the script received a `SIGSTOP` signal. It is equivalent to using the command
    `kill -SIGSTOP $$` to force the script to stop itself. When used in a script,
    `suspend` requires job control to be enabled. See Listing 10.1.


    ```

    **Listing 10.1** `suspend_demo.sh`

    ```bash

    #!/bin/bash

    #

    # suspend_demo.sh

    #

    # Wait for a SIGCONT signal and then print a message

    #

    # Turn off shell settings that interfere with script execution.

    # Specifically, we turn off the nounset and monitor settings.

    # This is because we need to be able to handle the SIGCONT signal,

    # and the monitor setting interferes with that.

    shopt -s -o nounset

    shopt -s -o monitor # enable job control


    # wait for SIGCONT

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Listing 10.1 Continued


    ```

    suspend

    printf "%s\n" "Who woke me up?"

    exit 0

    ```


    When this script runs, it is stopped until a SIGCONT is received.


    ```

    $ bash suspend_demo.sh &

    [1] 9185

    $

    [1]+  Stopped                bash suspend_demo.sh

    $ kill -SIGCONT 9185

    $ Who woke me up?

    [1]+  Done                   bash suspend_demo.sh

    $

    ```


    # Traps


    While Bash is running interactively, it handles most signals on behalf of the
    user. When a script is running and special actions need to be taken, it is the
    responsibility of the script to handle the appropriate signals. The action taken
    by Bash depends on which signal was received.


    +   - SIGQUIT is always ignored

    +   - SIGTIN is ignored if job control is enabled; otherwise, it suspends the
    script

    +   - SIGTTOU is ignored if job control is enabled; otherwise, it suspends the
    script

    +   - SIGSTOP is ignored if job control is enabled; otherwise, it suspends the
    script

    +   - SIGTSTP is ignored if job control is enabled; otherwise, it suspends the
    script

    +   - SIGHUP is sent to all background tasks started by the script, waking up
    stopped tasks if necessary


    For example, Bash normally handles the SIGHUP signal by passing the signal to
    all sub-scripts (unless disown -h is used). You can activate the same behavior
    in an interactive session by setting the huponexit shell option: When a session
    is terminated, SIGHUP is sent to all running jobs.


    Other signals terminate a script unless a signal handler (or trap) is created.
    A trap is a set of commands that executes when a signal is received. The built-in
    trap command manages the signal handlers for a script.


    The -1 (list) switch lists all signals and their corresponding numbers.


    Not all signals can be caught with traps. Some signals, such as SIGKILL, always
    terminate a script even if a signal handler is installed.


    Signal handlers are created by supplying a command and a list of handlers to the
    trap command. Either the signal name or number can be used. SIGWINCH, for example,
    is the'
  merge: -1
  img_proc: true
- pgno: 182
  md: "signal generated when a window changes its size. By installing a trap, a message\
    \ can be displayed each time the window is resized.\n\n$ trap \"printf \"There\
    \ are %s lines\\n\" \"${LINES}\" SIGWINCH\n\nAltering the window size results\
    \ in:\n\n$ There are 32 lines\n$ There are 43 lines\n$ There are 37 lines\n\n\
    You can view the current trap with the -p (print) switch.\n\n$ trap -p SIGWINCH\n\
    trap -- \"printf \"There are %s lines\\n\" \"${LINES}\" SIGWINCH\n\nTo restore\
    \ the default handler, don’t supply a trap.\n\n$ trap SIGWINCH\n$ trap -p SIGWINCH\n\
    \nSIGUSR1 and SIGUSR2 are user-defined signals that have no pre-defined meaning.\
    \ They can be freely used in scripts. When the following script receives a SIGUSR1\
    \ signal, it waits for the current command to complete, prints the message SIGUSR1,\
    \ and resumes the script, as shown in Listing 10.2.\n\n# Listing 10.2 trap_demo.sh\n\
    \n```\n#!/bin/bash\n#\n# trap_demo.sh\n#\n# Wait indefinitely for SIGUSR1, print\
