- pgno: 171
  md: "# The getopt Command\n\nAlthough the `getopts` command makes programming scripts\
    \ somewhat easier, it doesn't adhere to the Linux switch standards. In particular,\
    \ `getopts` doesn't allow double minus long switches.\n\nTo get around this limitation,\
    \ Linux includes its own `getopt` (singular, *not* `getopts`) command. Similar\
    \ to `getopts`, `getopt` allows long switches and has other features that `getopts`\
    \ does not, and it is used in scripts in an entirely different way.\n\nBecause\
    \ `getopt` is an external command, it can't save switches into variables the way\
    \ `getopts` does. It has no way to export environment variables back to the script.\
    \ Likewise, `getopt` doesn't know what switches the shell has unless they are\
    \ copied to the `getopt` command using `$@`. As a result, instead of being run\
    \ in a loop, `getopt` runs once to process all the parameters as a single group.\n\
    \nLike `getopts`, `getopt` uses a `OPTARG` list of options. The list can be preceded\
    \ by `--options` (or `-o`) to make it clear that these are the list of switches.\
    \ The items can be listed as in `getopts` or as a comma-separated list.\n\nThe\
    \ list of options given to the script must be appended to the `getopt` command\
    \ using a double minus and `$@`. The double minus indicates where the `getopt`\
    \ switches end and where the script switches begin.\n\nListing 9.5 contains a\
    \ script that duplicates the `getopts.sh` using `getopt`. Notice that the `--name`\
    \ (or `-n`) switch is used to give `getopt` the name of the script to be used\
    \ in any error messages.\n\n# Listing 9.5 getopt.sh\n\n```\n#!/bin/bash\n#\n#getopt.sh\
    \ - a demonstration of getopt\ndeclare -rx SCRIPT=$0##/)\ndeclare RESULT\nRESULT=`getopt\
    \ --name \"$SCRIPT\" --options \"-h,-c\" -- \"$$\"`\nprintf \"status code=$? result=\\\
    \"$RESULT\\\"\\n\"\n```\n\nHere are the results:\n\n```\n$ bash getopt.sh -h\n\
    \ status code=0 result=\" -h --\"\n$ bash getopt.sh -c\n getopt.sh: option requires\
    \ an argument -- c\n status code=1 result=\" --\"\n$ bash getopt.sh -x\n getopt.sh:\
    \ invalid option -- x\n status code=1 result=\" --\"\n```\n\nThe status code indicates\
    \ whether `getopt` was successful. Status code 1 indicates `getopt` printed error\
    \ messages. Status code 2 indicates a problem with options given to the `getopt`\
    \ command itself."
  merge: -1
  img_proc: true
- pgno: 172
  md: "Long switches are supported using the `--longoptions` (or `-l`) switch. Include\
    \ a comma-separated list of expected long options. For example, to allow a `--help`\
    \ switch, do this\n\n```\n```\nRESULT=\\`getopt --name \"$$SCRIPT\" --options\
    \ \"-h, -c:\\\" \\\n\\`   --longoptions \"help\" -- \"$$@\"\\`\n```\n```\n\n`getopt`\
    \ has other enhancements. To specify an optional argument for a long option, add\
    \ an equals sign and the name of the argument.\n\nIf a double colon follows a\
    \ switch name, it indicates an optional argument to the switch instead of a required\
    \ one. If the `POSIXLY_CORRECT` variable exists and the option list begins with\
    \ a +, arguments are not allowed for switches and the first argument is treated\
    \ as the end of the switches.\n\nIf the `GETOPT_COMPATIBLE` shell variable exists,\
    \ `getopt` behaves more like the C language `getopt` standard library function.\
    \ Some older versions of `getopt` have this behavior by default. If you need to\
    \ check for this behavior, use the `-t-test` (or `-T`) switch to test for C compatibility\
    \ mode: If it is not running in compatibility mode, the status code is 4.\n\n\
    What do you do with the switches after `getopt` examines them? They can replace\
    \ the original parameters using the `set` command\n\n```\n`eval set -- \"$$RESULT\"\
    `\n```\n\nNow the parameters can be examined using positional parameters or using\
    \ the built-in `getopts`, as shown in Listing 9.6.\n\n# **Listing 9.6  getopt_demo.sh**\n\
    \n```\n```\n#!/bin/bash\n\n# getopt_demo.sh\n# This script expects the switch\
    \ -c and a company name. --help (-h) is also allowed.\n\nshopt -s -o nounset\n\
    \ndeclare -rx SCRIPT=\\$\\{0##*/\\}\ndeclare -r OPTSTRING=\"-h, -c:\"\ndeclare\
    \ COMPANY\ndeclare RESULT\n\n# Check getopt mode\n\ngetopt -T\nif [ $? -ne 4 ]\
    \ ; then\n    printf \"$$SCRIPT: \\$a\\n\" \"getopt is in compatibility mode\"\
    \ >&2\n```\n```"
  merge: -1
  img_proc: true
