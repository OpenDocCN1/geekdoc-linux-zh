- pgno: 47
  md: '# 3


    Files, Users, and Shell Customization


    WHEN A FRIEND OF MINE GOT A NEW Unix computer, the console display didn''t look
    quite right. When we tried to view files, the operating system didn''t know how
    big the screen was. It displayed the entire file instead of a screen at a time.


    My Unix was a bit rusty at the time, but I remembered that there was a stty command
    to change attributes of the display. Looking at the help listing for stty, I noticed
    a person could set the rows and the line. Thinking that line must be the number
    of lines on the display, I typed stty line 24. The computer stopped responding,
    forcing us to reboot it.


    We phoned up a Unix professional who had the same operating system. He said, "That
    should have worked. Let me try it." There was a brief pause. "I locked up my computer,
    too."


    It turned out that stty line 24 set the serial port for the display, changing
    it to port 24 when there was no device connected to port 24. With the wide variety
    of options available to Unix-based operating systems like Linux, it can sometimes
    be difficult to predict what a command actually does. This chapter expands on
    the last chapter, covering more basic commands and their many, sometimes confusing,
    options.


    # ### Listing Files


    The `ls` (*list*) command shows the contents of the current directory. Although
    `ls` is a familiar command available on all Unix-like operating system, Linux
    uses the `ls` command from the GNU `fileutils` project and has many special switches
    and features.


    ```

    ```

    $ ls

    archive  check-orders.sh  orders.txt

    ```

    ```


    `ls` has switches that affect how the files are listed, including the level of
    detail, the sorting order, and the number of columns. Most Linux distributions
    set up certain'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'defaults for ls command. Red Hat, for example, has the -q and -F switches on
    by default. From the point of view of script writing, it''s not safe to use the
    ls command in a script without specifying the appropriate switches because you
    can''t be sure which defaults a particular distribution uses.


    ls hides files that begin with a period. This is the Linux convention for configuration
    files, history files, and other files that a user isn''t normally interested in.
    To see these files, use the -a (all) switch. Use -A (absolutely all) to show the
    implicit . and .. files as well.


    ```

    $ ls -A

    .bash_history .bash_logout .bash_profile .bashrc archive

    check-orders.sh orders.txt

    ```


    The filenames can be printed in color to show the kind of file they are. The colors
    are defined in a file /etc/DIR_COLORS. You can customize the colors using a .dir_colors
    file in your own directory. The format of the file is described in the /etc/DIR_COLORS
    file.


    To display the files without color and with symbols instead, use the --color and
    --classify (or -F) switches. (On most Linux distributions, this feature is turned
    on using aliases.)


    ```

    $ ls --color=never --classify

    archive/ check-orders.sh* orders.txt

    ```


    The --classify symbols are directories (/), programs (*), symbolic links (@),
    pipes (|), and Unix domain socket files (=). These symbols are not a part of the
    name: They are hints as to the type of file. In this example, archive is a directory
    and check-orders.sh is a program.


    Another very important switch is --hide-control-chars (or -q). Linux filenames
    can contain any character, even control characters. It is possible to create a
    filename with hidden characters in the name. In these cases, you can''t rename
    or delete the file unless you know what the hidden characters are. Contrary to
    what the name implies, the --hide-control-chars switch displays any unprintable
    characters in the filename as question marks, making their locations visible.


    ```

    $ rm orders.txt

    rm: orders.txt: non-existent

    $ ls --color=never --classify --hide-control-chars

    archive/ check-orders.sh* orders.txt

    ```


    A complete list of switches appears at the end of this chapter.


    # printf Command


    The built-in printf (*print formatted*) command prints a message to the screen.
    You will use this command a lot in shell scripts.


    printf is very similar to the C standard I/O printf() function, but they are not
    identical. In particular, single- and double-quoted strings are treated differently
    in shell scripts than in C programs.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'The first parameter is a format string describing how the items being printed
    will be represented. For example, the special formatting code `*$d*` represents
    an integer number, and the code `*$f*` represents a floating-point number.


    ```

    $ printf "*$d*\n" 5

    5

    $ printf "*$f*\n" 5

    5.000000

    ```


    Include a format code for each item you want to print. Each format code is replaced
    with the appropriate value when printed. Any characters in the format string that
    are not part of a formatting instruction are treated as printable characters.


    ```

    $ printf "There are *%d* customers with purchases over *%d*.\n" 50 20000

    There are 50 customers with purchases over 20000.

    ```


    printf is sometimes used to redirect a variable or some unchanging input to a
    command. For example, suppose all you want to do is pipe a variable to a command.
    Instead of using printf, Bash provides a shortcut << redirection operator. <<
    redirects a string into a command as if it were piped using printf.


    The tr command can convert text to uppercase. This example shows an error message
    being converted to uppercase with both printf and <<.


    ```

    $ printf "*$a*\n" "$ERRMSG" | tr [[:lower:]] [[:upper:]]

    WARNING: THE FILES FROM THE OHIO OFFICE HAVEN''T ARRIVED.

    $ tr [[:lower:]] << [[:upper:]] << "$ERRMSG"

    WARNING: THE FILES FROM THE OHIO OFFICE HAVEN''T ARRIVED.

    ```


    The format codes include the following.


    +   * *%a*—Represent a floating-point number in hexadecimal format, using lowercase
    letters

    +   * *%A*—Represent a floating point number in hexadecimal format, using uppercase
    letters

    +   * *%b*—Expand backslash sequences

    +   * *%c*—Represent a single character

    +   * *%d*—Display a signed number

    +   * *%e*—Display a floating-point number, shown in exponential (also called
    “scientific”) notation

    +   * *%f* (or *%F*)—Display a floating-point number without exponential notation

    +   * *%g*—(General) Let Bash choose *%e* or *%f*, depending on the value

    +   * *%i*—Same as *%d*

    +   * *%o*—Display an octal number

    +   * *%q*—Quote a string so it can be read properly by a shell script'
  merge: -1
  img_proc: true
- pgno: 50
  md: "+   * `$s`—Display an unquoted string\n+   * `$u`—Display an unsigned number\n\
    +   * `$x`—Display an unsigned hexadecimal number, using lowercase letters\n+\
    \   * `$X`—Display an unsigned hexadecimal number, using uppercase letters\n+\
    \   * `$%`—Display a percent sign\n\nIf a number is too large, Bash reports an\
    \ out-of-range error.\n\n```\n$ printf \r\"%d\\n\" 123456789123456789012\nbash:\
    \ printf: warning: 123456789123456789012: Numerical result out of range\n```\n\
    \nFor compatibility with C's printf, Bash also recognizes the following flags,\
    \ but treats them the same as %d:\n\n+   * `$j`—A C intmax_t or uintmax_t integer\n\
    +   * `$t`—A C ptrdiff_t integer\n+   * `$z`—A C size_t or ssize_t integer\n\n\
    Also for C compatibility, you can preface the format codes with a 1 or L to indicate\
    \ a long number.\n\nThe %q format is important in shell script programming and\
    \ it is discussed in the quoting section, in the Chapter 5, “Variables.”\n\nTo\
    \ create reports with neat columns, numbers can process many of the formatting\
    \ codes to indicate the width of a column. For example, “%10d” prints a signed\
    \ number in a column 10 characters wide.\n\n```\n$ printf \r\"%10d\\n\" 11\n11\n\
    ```\n\nLikewise, a negative number left-justifies the columns.\n\n```\n$ printf\
    \ \r\"%-10d % -10d\\n\" 11 12\n11\n12\n```\n\nA number with a decimal point represents\
    \ a column width and a minimum number of digits (or decimal places with floating-point\
    \ values). For example, “%10.5f” indicates a floating-point number in a 10-character\
    \ column with a minimum of five decimal places.\n\n```\n$ printf \r\"%10.5f\\\
    n\" 17.2\n17.20000\n```\n\nFinally, an apostrophe (') displays the number with\
    \ thousands groupings based on the current country locale."
