- pgno: 37
  md: '+   rpint (usually ^x)—Redraws the current line.


    +   stop (usually ^s)—Pauses the program so you can read the results on the screen.


    +   start (usually ^q)—Resumes the program.


    +   susp (usually ^z)—Suspends the current program.


    +   werase (usually ^w)—Erases the last word typed.


    To change the suspend character to control-v, type

    ```bash

    $ stty susp ''^v''

    ```


    Changing key combinations can be very difficult. For example, if you are running
    an X Windows server (the software that runs on a client computer) on a Microsoft
    Windows computer to access a Linux computer, key combinations can be affected
    by the following:


    +   Microsoft Windows


    +   The X server software


    +   The Linux window manager


    +   The stty settings


    Each acts like layers of an onion and they must all be in agreement. For example,
    shift-insert, often used to paste text, might be handled by your X Window server
    before your Linux computer or your shell have a chance to see it.


    # Variable Assignments and Displaying Messages


    Variables can be created and assigned text using an equals sign. Surround the
    text with double quotes.

    ```bash

    $ FILENAME="info.txt"

    ```


    The value of variables can be printed using the printf command. printf has two
    arguments: a formatting code, and the variable to display. For simple variables,
    the formatting code is " %s\n" and the variable name should appear in double quotes
    with a dollar sign in front of the name

    ```bash

    $ printf "%s\n" "$FILENAME"

    info.txt

    ```


    printf can also display simple messages. Put the message in the place of the formatting
    code.

    ```bash

    $ printf "Bash is a great shell.\n"

    Bash is a great shell.

    ```


    printf and variables play an important role in shell scripting and they are described
    in greater detail in the chapters to come.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The results of a command can be assigned to a variable using backquotes.


    ```

    $ DATE= "date"

    $ print `$\n" $DATE"`

    Wed Feb 13 15:36:41 EST 2002

    ```


    The date shown is the date when the variable DATE is assigned its value. The value
    of the variable remains the same until a new value is assigned.


    ```

    $ print `$\n" $DATE"`

    Wed Feb 13 15:36:41 EST 2002

    $ DATE= "date"

    $ print `$\n" $DATE"`

    Wed Feb 13 15:36:48 EST 2002

    ```


    # Multiple Commands


    Multiple commands can be combined on a single line. How they are executed depends
    on what symbols separate them.


    If each command is separated by a semicolon, the commands are executed consecutively,
    one after another.


    ```

    $ print `$\n" This is executed" ; print `$\n" And so is this"`

    This is executed

    And so is this

    ```


    If each command is separated by a double ampersand (&), the commands are executed
    until one of them fails or until all the commands are executed.


    ```

    $ date & print `$\n" The date command was successful"`

    Wed Aug 15 14:36:32 EDT 2001

    The date command was successful

    ```


    If each command is separated by a double vertical bar (||), the commands are executed
    as long as each one fails until all the commands are executed.


    ```

    $ date `duck'' || print `$\n" The date command failed"`

    date: bad conversion

    The date command failed

    ```


    Semicolons, double ampersands, and double vertical bars can be freely mixed in
    a single line.


    ```

    $ date `format-this!'' || print `$\n" The date command failed" &\

    print `$\n" But the print didn''t!"`

    date: bad conversion

    The date command failed

    But the print didn''t!

    ```


    These are primarily intended as command-line shortcuts: When mixed with redirection
    operators such as >, a long command chain is difficult to read and you should
    avoid it in scripts.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Command History


    Bash keeps a list of the most recently typed commands. This list is the *command
    history*.


    The easiest way to browse the command history is with the Up and Down arrow keys.
    The history can also be searched with an exclamation mark (!). This denotes the
    start of a command name to be completed by Bash. Bash executes the most recent
    command that matches. For example,


    ```

    $ date

    Wed Apr 4 11:55:58 EDT 2001

    $ !d

    Wed Apr 4 11:55:58 EDT 2001

    ```


    If there is no matching command, Bash replies with an event not found error message.


    ```

    $ !x

    bash: !x: event not found

    ```


    A double ! repeats the last command.


    ```

    $ date

    Thu Jul 5 14:03:25 EDT 2001

    $ !!

    date

    Thu Jul 5 14:03:28 EDT 2001

    ```


    There are many variations of the ! command to provide shortcuts in specific situations.


    A negative number indicates the relative line number. That is, it indicates the
    number of commands to move back in the history to find the one to execute. !-1
    is the same as !-1.


    ```

    $ date

    Thu Jul 5 14:04:54 EDT 2001

    $ printf "%a\n" $PWD

    /home/kburch/

    $ !-2

    date

    Thu Jul 5 14:05:15 EDT 2001

    ```


    The !# repeats the content of the current command line. (Don’t confuse this with
    #! in shell scripts.) Use this to run a set of commands twice.


    ```

    $ date ; sleep 5 ; !#

    date ; sleep 5 ; date ; sleep 5 ;

    Fri Jan 18 15:26:54 EST 2002

    Fri Jan 18 15:26:59 EST 2002

    ```'
  merge: -1
  img_proc: true
- pgno: 40
  md: "Bash keeps the command history in a file called `.bash_history` unless a variable\
    \ called `HISTFILE` is defined. Each time you quit a Bash session, Bash saves\
    \ the history of your session to the history file. If the `histappend` shell option\
    \ is on, the history is appended to the old history up to the maximum allowed\
    \ size of the history file. Each time you start a Bash session, the history is\
    \ loaded again from the file.\n\nAnother shell option, `histverify`, enables you\
    \ to edit the command after it's retrieved instead of executing it immediately.\n\
    \nBash has a built-in command, `history`, which gives full control over the command\
    \ history. The `history` command with no parameters lists the command history.\
    \ If you don't want to see the entire history, specify the number of command lines\
    \ to show.\n\n```\n```\n$ history 10\n  1026  set -o emacs\n  1027  stty\n  1028\
    \  man stty\n  1029  stty -a\n  1030  date edhhh\n  1031  date edhhh\n  1032 \
    \ date\n  1033  date\n  1034  !\n  1035  history 10\n```\n```\n\nYou can test\
    \ which command will be matched during a history completion using the `-p` switch.\n\
    \n```\n```\n$ history -p id\nhistory -p date\ndate\n```\n```\n\nA particular command\
    \ line can be referred to by the line number.\n\n```\n```\n$ !1133\ndate\nThu\
    \ Jul  5 14:09:05 EDT 2001\n```\n```\n\n`history -d` deletes an entry in the history.\n\
    \n```\n```\n$ history -d 1029\n$ history 10\n  1027  stty\n  1028  man stty\n\
    \  1029  date edhhh\n  1030  date edhhh\n  1031  date\n  1032  date\n  1033  !\n\
    \  1034  history 10\n  1035  history -d 1029\n  1036  history 10\n```\n```"
  merge: -1
  img_proc: true
- pgno: 41
  md: 'The -s switch adds new history entries. -w (write) and -r (read) save or load
    the history from a file, respectively. The -a (append) switch appends the current
    session history to the history file. This is done automatically when you quit
    the shell. The -n switch loads the complete history from the history file. history
    -c (clear) deletes the entire history.


    The command history can be searched with !? for the most recent command containing
    the text. If there is additional typing after the !? search, the command fragment
    will be delimited with a trailing ?.


    ```

    $ date

    Thu Jul 5 14:12:33 EDT 2001

    $ !?ate

    date

    Thu Jul 5 14:12:38 EDT 2001

    $ !?da? ''+%Y''

    date ''+%Y''

    2001

    ```


    The quick substitution history command, ^, runs the last command again, replacing
    one string with another.


    ```

    $ date ''+%Y''

    2001

    $ ''+%Y''=''+''

    date ''+%m''

    07

    ```


    The Bash history can be turned off by unsetting the -o history shell option. The
    cshhist option saves multiple line commands in the history. The lithist option
    breaks up commands separated by semicolons into separate lines.


    # # Directory Commands


    The built-in pwd (present working directory) command returns the name of your
    current directory.


    ```

    $ pwd

    /home/kburch

    ```


    Although you might not think such a simple command needs options, pwd has a couple
    of switches. The -P (physical) switchshows the actual directory, whereas the default
    -L (logical) switch shows the directory, including any symbolic links. For example,
    if /home was a link to a directory called /user_drive/homes, the switches work
    as follows:


    ```

    $ pwd -P

    /user_drive/homes/kburch

    $ pwd -L

    /home/kburch

    ```'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'The built-in cd (change directory) command changes your current directory.
    As discussed in Chapter 1, “The Linux Environment,” the special directory . .
    represents the parent directory, whereas . represents the current directory.


    ```

    $ pwd

    /home/ikburtch

    $ cd .

    $ pwd

    /home/ikburtch

    $ cd ..

    $ pwd

    /home

    $ cd kburtch

    $ pwd

    /home/ikburtch

    ```


    Each time you change the directory, Bash updates the variable PWD containing the
    path to your current working directory. Bash also maintains a second variable
    called OLDPWD that contains the last directory you were in.


    Using the minus sign (-) with cd, you can switch between the current directory
    and the last directory. This is a useful shortcut if you are doing work in two
    different directories.


    ```

    $ pwd

    /home/ikburtch

    $ cd ..

    $ pwd

    /home

    $ cd -

    $ pwd

    /home/ikburtch

    $ cd -

    $ pwd

    /home

    ```


    The tilde (\~) represents your current directory. Use it to move to a directory
    relative to your home directory. To move to a directory called mail in your home
    directory, type


    ```

    $ cd ~/mail

    ```


    Although . and .. work in all Linux programs, ~ and - are features of Bash and
    only work with Bash and Bash scripts.


    cd by itself returns you to your home directory, the same as cd .. .


    If a CDPATH variable exists, it is assumed to contain a list of directories similar
    to the PATH variable. This is a throwback to the days when a user was only able
    to use one shell session on his terminal and is now considered a security risk.
    Its use should be avoided.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Specialized Navigation and History


    Because most users can open multiple shell sessions, there is little need for
    complex movement between directories. cd - switches between two directories, which
    is suitable for most circumstances. However, if you are restricted to a single
    shell session and want Bash to remember more directories, there are three built-in
    commands that maintain a list of directories.


    The built-in dirs command shows the list of saved directories. The current directory
    is always the first item in the list.


    ```

    $ dirs

    ~

    ```


    The built-in pushd (push directory) command adds (or pushes) directories onto
    the list and changes the current directory to the new directory.


    ```

    $ pushd /home/kburtch/invoices

    ~/invoices

    $

    $ pushd /home/kburtch/work

    ~/work ~/invoices

    $

    $ pwd

    /home/kburtch/work

    ```


    There are now three directories in the list.


    The -n (no change) switch will put a directory into the list without changing
    directories. -N (rotate Nth) moves the nth directory from the left (or, with +N,
    from the right) to the top of the list.


    The dirs -1 switch displays the directory names without any short forms.


    ```

    $ dirs -1

    /home/kburtch/work /home/kburtch/invoices /home/kburtch

    ```


    The -v switch displays the list as a single column, and -p shows the same information
    without the list position. The -c switch clears the list. The -N (view Nth) shows
    the nth directory from the left (or, with +N, from the right).


    ```

    $ dirs +1

    ~

    ```


    The built-in popd (pop directory) command is the opposite of the pushd. popd discards
    the first directory and moves to the next directory in the list.


    ```

    $ popd

    ~/invoices

    $

    $ pwd

    /home/kburtch/invoices

    ```


    The switches for popd are similar to pushd: -n to pop without moving, and -N to
    delete the Nth entry from the left (or, with +N, the right).'
  merge: -1
  img_proc: true
- pgno: 44
  md: "# The Colon Command\n\nThe simplest shell command is the colon ($:$). This\
    \ is the *colon command* (sometimes called a \"no-op\" or \"null command\") and\
    \ does nothing. What's the use of a command that does nothing? There are some\
    \ places in shell programs where a statement is required. In those cases, you\
    \ can use $:$ to indicate nothing special should be done.\n\nAt the command prompt,\
    \ $:$ has no effect.\n\n```\n```\n$ :\n$ \n```\n```\n\nThe colon command can have\
    \ parameters and file redirections. This can have strange effects, such as running\
    \ the date command using backquotes, giving the results to the null command that\
    \ quietly discards them.\n\n```\n```\n$ : `date`\n$ \n```\n```\n\nThis has the\
    \ same effect as redirecting the output of date to the /dev/null file.\n\n```\n\
    ```\n$ date > /dev/null\n```\n```\n\nBackquotes and redirection are discussed\
    \ in an upcoming chapter.\n\n# Reference Section\n\n# date Command Switches\n\n\
    +   - **--date=$s** (or -d $s) —Displays time described by $s.\n+   - **--file=$f**\
    \ (or -f $f) —Displays times listed in file $f.\n+   - **--iso-8601=t** (or -I\
    \ $t) —Displays an ISO-8601 standard time.\n+   - **--reference=$f** (or -r $f)\
    \ —Displays last modification date of file.\n+   - **--rfc-822** (or -R) —Uses\
    \ RFC-822 format.\n+   - **--universal** (or --utc or -u) —Uses Coordinated Universal\
    \ Time.\n\n# stty Command Switches\n\n+   - **--all** (or -a) —Displays all stty\
    \ settings.\n+   - **--save** (or -g) —Displays settings so they can be used as\
    \ parameters to stty.\n+   - **--file=$d** (or -F $d) —Opens tty device $d instead\
    \ of stdin."
  merge: -1
