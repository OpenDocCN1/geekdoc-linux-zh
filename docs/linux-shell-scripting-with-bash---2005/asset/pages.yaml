    \                 # remember last variable\n        VAR=\"${VARIABLES%%\\&}*\"\
    \     # extract next variable\n        REMAINING=\"${VARIABLES$&*}\"  # variables\
    \ left to process\n        NAME=\"${VAR$&=*}\"           # variable's name is\
