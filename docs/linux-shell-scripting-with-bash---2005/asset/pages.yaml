    # Running Scripts from C


    Scripts are often combined with high-level languages like C to provide customizations
    without having to recompile and link a large project. Although scripting languages
    such as Guile and Scheme are popular choices, Bash itself is a scripting language,
    perhaps the quintessential scripting language under Linux.


    The C function `system` starts a shell and runs a command in the shell. The command''s
    parameter is a string that''s executed as if a user typed in the command in an
    interactive session. `system` returns the shell''s exit status, or a −1 if there
    was a problem starting the shell.


    The C program shown in Listing 18.1 runs an `ls` command.


    ```

    Listing 18.1 c\_system.c


    ```c

    /* c\_system.c: run a shell command from C using system */


    #include <stdio.h>

    #include <stdlib.h>


    int main() { int result;


    result = system ( "ls -l *.sh" );

    return 0; }

    ```

    ```


    When the program runs, the shell command is executed.


    ```

    $ c\_system

    company.txt

    log.txt

    orders.txt

    temp.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 350
  md: "When using system to run a script, two shell sessions are created; one for\
    \ *system* and another to run the script (unless the script is started with *execl*).\
    \ To run scripts instead of shell commands, the C *popen* function is a less cumbersome\
    \ method. *popen* runs a program and attaches a pipe to or from the program, as\
    \ if the shell pipe operator | was used. The command has two parameters: the program\
    \ to run and its arguments, and an *r* if the C program reads the standard output\
    \ of the script, or a *w* if the program writes to the standard input of the script.\
    \ When the program is finished, close the pipe with the *p close* command.\n\n\
    In the case of shell scripts, the program *popen* runs is Bash. You can rewrite\
    \ the *c_system.c* program using *popen*, as shown in Listing 18.2.\n\n# **Listing\
    \ 18.2** c_popen.c\n\n```\n/** c_popen.c: run a Bash command from C using popen\
    \ */\n#include <stdio.h>\n#include <stdlib.h>\n\nint main() { \n    FILE *f =\
    \ NULL;                  /* the pipe file */\n    char s[ 255 ] = \"\";      \
    \        /* a string buffer */\n\n    f = popen( \"/bin/bash -c \\\"ls -l *.txt\\\
    \", \"xr\" ); /* open the pipe */\n    while ( ! feof( f ) ) {         /* while\
    \ more output */\n        fgets( s, 255, f );         /* get the next line */\n\
    \        printf( \"%s\", s );           /* print the results */\n    }\n    pclose(\
    \ f );                     /* close the pipe */\n    \n    return 0;         \
    \               /* successful status */\n}\n```\n\nThe results are the same.\n\
    \n```\n$ ./c_popen\ncompany.txt\nlog.txt\norders.txt\ntemp.txt\n```\n\nIf C variables\
    \ are to be shared with a Bash script, they must be exported to the shell's environment.\
    \ The C *putenv* function declares or changes an environment variable. The declaration\
    \ should be in the same form as a Bash variable assignment. Because *putenv* increases\
    \ the size of the environment, there is a chance it might fail. The command returns\
    \ a zero if the assignment was successfully carried out."
