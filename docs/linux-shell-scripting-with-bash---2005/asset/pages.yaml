    # # Hash Tables Using Bash Arrays


    Hash tables store single items in a way that makes them quick to find again. Hash
    tables rely on a hash, or mathematical formula, which converts the item being
    stored into a single number. This number is used to determine where in the hash
    table the item is stored. A good hash algorithm scatters items as evenly as possible
    throughout the table.


    It is possible to write your own hash formula, but for the purposes here, the
    Linux MD5 checksum function works quite nicely and creates a unique number. You
    can use this as your hash formula.


    ```

    ```

    HEXCODE=`echo "$1" | $MD5SUM`          # compute the hash value (hex)

    HEXCODE=`${HEXCODE:0:4}`                # take first 4 hex digits

    CODE=`printf "%d\n" 0x"$HEXCODE"`        # convert to 0...65535

    printf "%d\n" "${CODE%TABLE_SIZE}"       # restrict to table size

    ```

    ```


    This routine takes the first four hexadecimal digits computed by md5sum and converts
    these to a number between 0 and 65535. The number is then constrained to the size
    of the table. If the table size is 100, the hash code is between 0 and 99, the
    positions in an array of 100 items.'
