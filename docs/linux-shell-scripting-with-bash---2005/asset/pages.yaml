- pgno: 71
  md: '# # 4

    # Script Basics


    I WAS FIRST INTRODUCED TO COMPUTERS when my high school purchased a shiny new
    TRS-80, Model I. The computer was installed in the library, free for anybody to
    use. I remember following the dog-eared manual and typing in my first BASIC program.


    ```

    10 PRINT "KEN WAS HERE";

    20 GOTO 10

    ```


    When I ran the program, I was in for a surprise. Not only did the computer faithfully
    carry out my instructions over and over, but also the words scrolling up the screen
    formed a shifting pattern. When the screen became full, it scrolled to make room
    for more messages. If I changed the length of the message to a number that evenly
    divided into 64 (the TRS-80 had 64 character lines), the messages marched up the
    screen in neat columns. There was unexpected magic in my name.


    The joy of programming is the joy of creating something new by giving "to airy
    nothing a local habitation and a name." Even bugs, in their quaint way, are unexpected
    signposts on the long road of creativity that offer choices depending on how you
    decide to deal with them. One choice leads to another, and no two programs of
    any size are the same. They are truly the offspring of a creative process as much
    as any painting, song, or poem.


    In Bash, the journey starts with a programmer''s first script. This chapter introduces
    the basic techniques of shell scripting—creating an organized script, redirecting
    standard file descriptors, and working with different kinds of commands.


    # ## Creating a Script


    By convention, Bash shell scripts have names ending with .sh. Listing 4.1 shows
    a script called hello.sh, a very short script that writes a message on the screen.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Listing 4.1 hello.sh


    ```

    # hello.sh

    # This is my first shell script


    printf "Hello! Bash is wonderful."

    exit 0

    ```


    Lines beginning with number signs (#) are comments. They are notes to the reader
    and do not affect the execution of a script. Everything between the number sign
    and the end of the line is effectively ignored by Bash.


    Comments should always be informative, describing what the script is trying to
    accomplish, not a blow-by-blow recount of what each command is doing. I’ve seen
    too many scripts with only a single comment at the top reading “Abandon Hope All
    Ye Who Enter Here”. In a business environment, clear and informative comments
    help to troubleshoot and debug obscure problems.


    The exit command, followed by a zero, informs the program running your shell script
    that the script ran successfully.


    You can run your script by starting a new shell:


    ```

    $ bash hello.sh

    ```


    If there are no mistakes, Bash responds with this message:


    ```

    Hello! Bash is wonderful.!

    ```


    # Creating a Well-Behaved Script


    Suppose your job is to write a shell script to run the sync command when there
    are no users on the system. The following commands are adequate to do the job.


    ```

    USERS=`who | wc -l`

    if [ $USERS -eq 0 ] ; then

    sync

    fi

    ```


    This works suitably well at the Bash prompt. But consider the following questions:


    +   How does Linux know that this is a Bash script?

    +   If there is more than one who command on the computer, which one executes?

    +   How does the script inform the program that runs it if it succeeds or fails?

    +   What happens if the sync command was accidentally deleted or if the system
    administrator altered the permissions?


    Bash is a very flexible language: It needs to if it is going to be used interactively.
    But in script writing, this flexibility can lead to security loopholes and unexpected
    behavior. For a shell script to be “well-behaved,” it has to do more than simply
    execute the same commands typed at the Bash dollar prompt.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'A well-structured Bash script can be divided into five sections:


    +   - The header

    +   - Global declarations

    +   - Sanity checks

    +   - The main script

    +   - Cleanup


    Each of these sections plays an important role in the design of a script. Next,
    you take a look at the previous example and see how you can improve it by examining
    each of the sections.


    # ## The Header


    The header defines what kind of script this is, who wrote it, what version it
    is, and what assumptions or shell options Bash uses.


    The very first line of a script is the *header line*. This line begins with #
    ! at the top of the script, flush with the left margin. This character combination
    identifies the kind of script. Linux uses this information to start the right
    program to run the script. For Bash scripts, this line is the absolute pathname
    indicating where the Bash interpreter resides. On most Linux distributions, the
    first header line is as follows


    ```

    #!/bin/bash

    ```


    If you don''t know the location of the Bash shell, use the Linux whereis command
    to find it:


    ```

    $ whereis bash

    bash: /bin/bash

    ```


    The beginning of a typical script looks like this


    ```

    #!/bin/bash

    #

    # Flush disks if nobody is on the computer

    #

    # Ken O. Burch

    # CVS: $Header$


    shopt -S -o nounset

    ```


    The Bash header line is followed by comments describing the purpose of the script
    and who wrote it. The *CVS* line is explained in Chapter 8, “Debugging and Version
    Control.” The *shopt -S -o nounset* command detects some spelling mistakes by
    reporting undefined variables.'
  merge: -1
  img_proc: true
- pgno: 74
  md: "# Glo bal Declarations\n\nAll declarations that apply to the entirety of the\
    \ script should occur at the top of the script, beneath the header. By placing\
    \ *glo bal declarations* in one place, you make it easy for someone to refer to\
    \ them while reading the script\n\n```\n# Glo bal Declarations\ndeclare -rx SCRIPT=$({0#*)})\t\
    # SCRIPT is the name of this script\ndeclare -rx who=\" /usr/bin/who\"\t# the\
    \ who command - man 1 who\ndeclare -rx sync=\"/bin/sync\"\t# the sync command\
    \ - man 1 sync\ndeclare -rx wc=\"/usr/bin/wc\"\t# the wc command - man 1 wc\n\
    ```\n\n# Sanity Checks\n\nThe next section, *sanity checks*, protects the script\
    \ from unexpected changes in the com-puter. Normally, when a command runs at the\
    \ command prompt, Bash searches several directories for the command you want to\
    \ run. It can't find the command, perhaps because of a spelling mistake, Bash\
    \ reports an error. This kind of behavior is good for working interactively with\
    \ Bash because it saves time and any mistakes are easily correct-ed with a few\
    \ keystrokes.\n\nScripts, on the other hand, run without any human supervision.\
    \ Before a script exe-cutes any statements, it needs to verify that all the necessary\
    \ files are accessible. All required commands should be executable and stored\
    \ in the expected locations. These checks are sometimes called *sanity checks*\
    \ because they do not let the script begin its main task unless the computer is\
    \ in a known, or \" sane;\" state. This is especially important with operating\
    \ systems such as Linux that are highly customizable: What is true on one com-puter\
    \ might not be true on another.\n\nAnother way of putting it is that Bash relies\
    \ on runtime error checking. Most errors are only caught when the faulty statement\
    \ executes. Checking for dangerous situations early in the script prevents the\
    \ script from failing in the middle of a task, otherwise mak-ing it difficult\
    \ to determine where the script left off and what needs to be done to con-tinue.\n\
    \nSometimes system administrators unintentionally delete or change the accessibility\
    \ of a file, making it unavailable to a script. Other times, changes in the environment\
    \ can change which commands are executed. Malicious computer users have also been\
    \ known to tamper with a person's login profile so that the commands you think\
    \ you are running are not the ones you are actually using.\n\nIn the case of the\
    \ sample script, you need to verify that the commands you need are where they're\
    \ supposed to be and are available to the script.\n\n```\n# Sanity checks\nif\
    \ test -z \"$BASH\" ; then\n```"
  merge: -1
  img_proc: true
- pgno: 75
  md: "```\n```bash\nprintf \"$SCRIPT:$LINENO: please run this script with the BASH\
    \ shell\\n\" >&2\nexit 192\nfi\nif test ! -x \"$who\" ; then\n    printf \"$SCRIPT:$LINENO:\
    \ the command $who is not available — \\\\\naborting\\n \" >&2\n    exit 192\n\
    fi\nif test ! -x \"$sync\" ; then\n    printf \"$SCRIPT:$LINENO: the command $sync\
    \ is not available — \\\\\naborting\\n \" >&2\n    exit 192\nfi\nif test ! -x\
    \ \"$wc\" ; then\n    printf \"$SCRIPT:$LINENO: the command $wc is not available\
    \ — \\\\\naborting\\n \" >&2\n    exit 192\nfi\n```\n```\n\n# ## The Main Script\n\
    \nWhen you have verified that the system is sane, the script can proceed to do\
    \ its work.\n\n```\n```bash\n# Flush disks if nobody is on the computer\nUSERS=`who\
    \ | wc -1`\nif [ $USERS -eq 0 ] ; then\n    sync\nfi\n```\n```\n\n# ## Cleanup\n\
    \nFinally, the script needs to clean up after itself. Any temporary files should\
    \ be deleted, and the script returns a status code to the person or program running\
    \ the script. In this case, there are no files to clean up. More complex scripts\
    \ might use a variable to keep track of that status code returned by a failed\
    \ command.\n\nBy placing the cleanup section at the end of the program, there\
    \ is one unique place to perform your housekeeping tasks, as opposed to duplicating\
    \ them throughout the script.\n\n```\n```bash\nexit 0  # all is well\n```\n```\n\
    \nThe completed script looks like Listing 4.2."
