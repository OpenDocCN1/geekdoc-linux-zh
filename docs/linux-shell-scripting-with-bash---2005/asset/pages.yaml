    # Substring Replacement by Pattern ( // )


    If the variable is followed by a slash (/), the first occurrence of the pattern
    following the slash is replaced. Following the pattern, there is a second slash
    and the replacement string. If the variable is followed by two slashes, all occurrences
    of the pattern are replaced.


    ```

    $ printf "%s\n" "${COMPANY/Inc./Incorporated}"

    Nightlight Incorporated

    $ printf "You are the I in %s" "${COMPANY//I/1}"

    You are the I in Night1ight Inc.

    ```


    If the pattern begins with a number sign (#), the pattern matches at the beginning
    of the variable’s value. If the pattern ends with a percent sign (%), the pattern
    matches at the end of the variable’s value. Other occurrences are ignored.


    ```

    $ COMPANY="NightLight Night Lighting Inc."

    $ printf "%s\n" "${#COMPANY}"

    NightLight Night Lighting Inc.

    $ printf "%s" "${COMPANY//Night/NIGHT}"

    NIGHTlight NIGHT Lighting Inc.

    $ printf "%s" "${COMPANY//#Night/NIGHT}"

    NIGHTLight Night Lighting Inc.

    ```


    If no new value is indicated, the matching substring is deleted.


    ```

    $ COMPANY="Nightlight Inc."

    $ printf "%s\n" "${COMPANY/light}"

    Nigh Inc.

    ```


    Ranges can also be used. For example, to delete all the punctuation in a string,
    use the range [:punct:]:.


    ```

    $ printf "%s" "${COMPANY//[[:punct:]]}"

    NightLight Inc

    ```


    Using an asterisk or @ sign instead of a variable applies the substitutions to
    all the parameters to the shell script. Likewise, an array with an asterisk or
    @ sign applies the substitutions to all elements in the array.'
