  md: "Linux also has a time command. This variation cannot time a pipeline, but it\
    \ displays additional statistics. To use it, use the command to override the Bash\
    \ time.\n\n```\n$ command time myprog \n3.09user 0.95system 0:05.84elapsed 69%CPU(0avgtext+0avgdata\
    \ 0maxresident)k\n0inputs+0outputs(4786major+4235minor)pagefaults 0swaps\n```\n\
    \nLike Bash time, Linux time can format the results. The format can be stored\
    \ in a variable called TIME (not TIMEFORMAT) or it can be explicitly indicated\
    \ with the -format (-f) switch.\n\n+     - $A—A literal $.\n+     - $E—The real\
    \ time; the elapsed time in the hours:minutes:seconds format.\n+     - $e—The\
    \ real time; the elapsed time in seconds.\n+     - $S—The system time in CPU seconds.\n\
    +     - $U—The user time in CPU seconds.\n+     - $P—The percentage of the CPU\
    \ used by the program.\n+     - $M—The maximum size in memory of the program in\
