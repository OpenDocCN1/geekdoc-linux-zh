- pgno: 194
  md: "# ## Moving and Copying Files\n\nFiles are renamed or moved to new directories\
    \ using the `mv` (move) command. If `-f` (force) is used, move overwrites an existing\
    \ file instead of reporting an error. Use `-f` only when it is safe to overwrite\
    \ the file.\n\nYou can combine `touch` with `mv` to back up an old file under\
    \ a different name before starting a new file. The Linux convention for backup\
    \ files is to rename them with a trailing tilde (\\~). See Listing 11.4.\n\n#\
    \ **Listing 11.4  backup\\_demo.sh**\n\n```\n```bash\n#!/bin/bash\n#\n# backup_demo.sh\n\
    \nshopt -s -o nounset\n\ndeclare -rx RUN_RESULTS=\"./run_results.txt\"\n\nif [\
    \ -f \"$RUN_RESULTS\" ] ; then\n    mv -f \"$RUN_RESULTS\" \"$RUN_RESULTS\"~\n\
    \    if [ $? -ne 0 ] ; then\n        printf \"%s\\n\" \"Error: unable to backup\
    \ $RUN_RESULTS\" >&2\n    fi\n    touch \"$RUN_RESULTS\"\nfi\n\nprintf \"Run stated\
    \ %s\\n\" `date`\" >> \"$RUN_RESULTS\"\n```\n\n```\n\nBecause it is always safe\
    \ to overwrite the backup, the move is forced with the `-f` switch. Archiving\
    \ files is usually better than outright deleting because there is no way to \"\
    undelete\" a file in Linux.\n\nSimilar to `mv` is the `cp` (copy) command. `cp`\
    \ makes copies of a file and does not delete the original file. `cp` can also\
    \ be used to make links instead of copies using the `--link` switch.\n\n# ## More\
    \ Information About Files\n\nThere are two Linux commands that display information\
    \ about a file that cannot be easily discovered with the `test` command.\n\nThe\
    \ Linux `stat` command shows general information for the file, including the owner,\
    \ the size, and the time of the last access.\n\n```\n$ stat ken.txt\n```\nFile:\
    \ \"ken.txt\"\nSize: 84        Blocks: 8        Regular File\n```\n```"
