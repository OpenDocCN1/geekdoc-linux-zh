    # exec2.sh


    declare -rx SCRIPT=${0##*/}


    printf "$$SCRIPT: now running exec2.sh"

    exit 0

    ```


    After the **exec** command is performed in `exec1.sh`, the script is discarded
    and Bash begins executing `exec2.sh` instead. When `exec2.sh` is finished, `exec1.sh`
    doesn''t resume.


    ```

    $ bash exec1.sh

    exec1.sh: Transferring control to exec2.sh, never to return...

    exec2.sh: now running exec2.sh

    ```


    You can use the **exec** command to run other programs, not just other shell scripts.
    If the -c switch is used, **exec** destroys all variables before running the new
    program. The -i switch runs the program as if it were the first program being
    run when a user logs in (by putting a minus sign in parameter $0). The -a switch
    can specify a specific name for $0.


    The **exec** never returns unless you set the **execfail** option. If it is not
    set and the script cannot run the new program, the script simply exits.


    A specialized command, **execl**, is used primarily for scripts that are a "front
    end" to a series of other scripts. For example, a script can examine a file sent
    by a customer, categorize it, and then run an appropriate script to process it
    using **execl**. Because there''s no reason to return to the original script,
    **execl** is the appropriate command to use.


    # ## Writing Recurring Scripts


    There are several Linux commands for scheduling recurring jobs. The main scheduling
    program is called **cron** (as in *chronological*). The **cron** program runs
    continually in the background, starting up scripts or other programs at specific
    times.'
