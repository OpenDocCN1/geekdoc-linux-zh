  md: 'Scripts will not normally execute the login profile scripts. Bash will load
    a profile for scripts if the `BASH_ENV` environment variable contains a pathname
    to a file to execute. However, you should avoid using `BASH_ENV`. Setting the
    common environment for a set of scripts is usually done with the `source` command,
    which is discussed in Chapter 14, “Functions and Script Execution.” `BASH_ENV`
    has no effect on interactive sessions.


    You can stop the running of the login profile files by using the `--noprofile`
    switch.


    Bash runs a different set of files for interactive sessions that are not also
    login sessions. Bash looks for a customization script called `~/.bashrc` (Bash
    resources) and executes it instead of the login profile files. Aliased functions
    are only allowed in the resource files. A different resource file can be specified
    with the `--init-file` or `--rcfile` switch. A typical resource file might contain
    the following:


    ```

    ```

    # /etc/bashrc

    # Don''t let others write to the user''s files

    umask 002

    # Alias ls to provide default switches

    alias ls=''ls -qF''

    ```

    ```


    Some distributions add lines to your login profile to run the commands in `~/.bashrc`
    as well. This is not a feature of Bash, but a change made by your Linux distribution.
    You can add the following lines to the `~/.bashrc` file to test its behavior:


    ```

    ```

    # My bashrc Resource File Customizations

    printf "&\n" ".bashrc has run"

    ```

    ```


    Test it from the command prompt by starting new sessions. In this case, SuSE Linux
    always runs the resource file.


    ```

    ```

    $ bash --login

    .bashrc has run

    $ logout

    $ bash

    .bashrc has run

    $ exit

    ```

    ```


    As a result, you cannot be certain of the behavior of the resource file without
    checking your distribution.


    Resource files can be suppressed with the `--norc` switch. Your distribution can
    run other files as well during login:


    +   * Red Hat and Mandrake Linux separates your customizations, putting functions
    and aliases in `~/.bashrc` and other customization in `~/.bash_profile`. Their
    `.bash_profile` script will automatically run a `.bashrc` file as well, if it
    is present.


    +   * SuSE Linux separates your customizations, putting functions and aliases
    in `~/.bashrc` and other customization in `~/.profile`. Their `.profile` script
    will automatically run a `.bashrc` file as well, if it is present.


    +   * SCO Linux (also called Caldera Linux) uses `~/.profile`, which calls `~/.bashrc`.
    It then runs the profile script from `/etc/config.d/shells` to configure the system'
