  md: "# Source Code Patches\n\nThe Linux *diff* command lists the changes between\
    \ two or more files.\n\nWhen used with the proper switches, diff creates a *path\
    \ file* containing a list of changes necessary to upgrade one set of files to\
    \ another.\n\n```\n$ diff -u -recursive -new-file older_directory newer_directory\
    \ > update.diff\n```\n\nFor example, suppose you have a script to count the files\
    \ in the current directory, as shown in Listing 8.5.\n\n# Listing 8.5 *file_count.bash*\n\
    \n```\n```\n#!/bin/bash\n\n#\n# file_count: count the number of files in the current\
    \ directory.\n# There are no parameters for this script.\n\nshopt -s -o nounset\n\
    \ndeclare -rx SCRIPT=$0@##/\\) # SCRIPT is the name of this script\ndeclare -rx\
    \ ls=\"/bin/ls\" # ls command\ndeclare -rx wc=\"/usr/bin/wc\" # wc command\n\n\
    # Sanity checks\n\nif test -z \"$BASH\" ; then\n printf \"Please run this script\
    \ with the BASH shell\\n\" >&2\n exit 192\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 160
  md: "```\n```list\ntest ! -x \"$ls\" ; then\n    printf \"$${SCRIPT}:$LINENO: the\
    \ command $ls is not available - aborting\\n \" >&2\n    exit 192\nfi\n\nif test\
    \ ! -x \"$wc\" ; then\n    printf \"$${SCRIPT}:$LINENO: the command $wc is not\
    \ available - aborting\\n \" >&2\n    exit 192\nfi\n\nls -l | wc -l\n\nexit 0\n\
    ```\n```\n\nYou decide that the script is better with `exit $?` instead of `exit\
    \ 0`. This code\n$ diff -u -recursive -new-file older.sh newer.sh > file_count.diff\n\
    \ncreates the patch file containing\n@@ -26,5 +26,5 @@\nls -l | wc -1\n-exit 0\n\
    +exit $?\n\nThe - indicates the `exit 0` line will be removed. The + indicates\
    \ that `exit $?` will be inserted. Then the old script will be upgraded to the\
    \ new script.\n\nThe Linux patch command applies a patch file created by `diff`.\
    \ Use the `-p1` and `-s` switches.\n$ cd older_directory\n$ patch -pl -s < update.diff\n\
    \nIn the file_count script example, because the patch was created for one file\
    \ and not for a directory, patch asks for the name of the older file to patch.\n\
    $ patch -pl -s < file_count.diff\nThe text leading up to this was:\n\n```\n```\n\
    --- older.sh  Tue Feb 26 10:52:55 2002\n+++ newer.sh  Tue Feb 26 10:53:56 2002\n\
    ---\nFile to patch: older.sh\n```\n```\n\nThe file `older.sh` is now identical\
    \ to `newer.sh`."
