- pgno: 94
  md: 'The attributes of a variable can be displayed with the `-p (print)` switch.


    ```

    $ declare -p NUMBER_ACCOUNTS

    declare -i NUMBER_ACCOUNTS=\"12\"

    ```


    The information is displayed in such a way that it can be saved for use in another
    script. This allows you to experiment with declarations at the command prompt
    and then write the declarations to a script file when you are satisfied with the
    results.


    The integer attribute can be turned off with a plus sign.


    ```

    $ declare +i NUMBER_ACCOUNTS # turn off integer attribute

    $ printf \"$d\n\" \"$NUMBER_ACCOUNTS\"

    bash: printf: Smith Account: invalid number

    $ printf \"%s\n\" \"$NUMBER_ACCOUNTS\"

    Smith Account

    ```


    Although Bash does not consider the assignment of a non-numeric value an error,
    the `printf` command does report that the value can''t be formatted as a number.


    Like the `printf` command, integer variables can be assigned octal or hexadecimal
    numbers as well.


    ```

    $ declare -i NUMBER_ACCOUNTS=0x0F

    $ printf \"%i\n\" \"$NUMBER_ACCOUNTS\"

    15

    ```


    Constants are unchanging variables that are created with the `-r (read-only)`
    attribute. If you attempt to assign a value to a constant, Bash reports an error.
    Suppose the constant `COMPANY` has the name of a company.


    ```

    $ declare -r COMPANY=\"Smith and Jones\"

    $ printf \"%s\n\" \"$COMPANY\"

    Smith and Jones

    $ COMPANY=\"Wilson Distribution\"

    bash: COMPANY: readonly variable

    ```


    The `readonly` attribute can be turned off using a plus sign. However, this can
    make your scripts confusing to read because the reader will assume that a readonly
    variable is always read-only. Either remove the `readonly` attribute or change
    the structure of the script.


    # Arrays


    Arrays are lists of values that are created with the `-a (array)` attribute. A
    number called an *index* refers to the position item in the array. Bash arrays
    differ from arrays in other computer languages because they are open-ended. Arrays
    can be any length and are initially filled with empty strings for items.


    ```

    $ declare -a PRODUCTS

    ```'
