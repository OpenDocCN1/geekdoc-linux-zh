- pgno: 325
  md: 'The add_table function adds a pair of items to the associative array. The two
    items are combined into a single value separated by the separator character (in
    this case, a tilde). The pair is added to the end of the table and NEXTRID, the
    next free position in the table, is increased by 1.


    The lookup_table function searches the table for a key and returns the associated
    value. The table is searched for the key. If the key is found, the company name
    is displayed. Otherwise, the script announces that the ID number is not in the
    table.


    The script creates a sample lookup table containing ID numbers and associated
    company names.


    ```

    ```

    $ lookup.sh

