    The two most common uses for signal handlers are to awaken suspended scripts and
    to temporarily block signals for some critical commands that must not be interrupted.
    To temporarily ignore a signal, use empty quote marks or the `null` command as
    a signal handler and restore the original signal handler after the uninterruptable
    commands are finished.


    ```

    trap : SIGINT SIGQUIT SIGTERM

    # some command that must not be interrupted

    trap SIGINT SIGQUIT SIGTERM

    ```


    # ## Exit Handlers


    An exit handler is a set of commands executed whenever a script is finished. Exit
    handlers use the non-existent signal `EXIT` (signal number 0), as shown in Listing
    10.3.


    # **Listing 10.3 exithrap_demo.sh**


    ```

    #!/bin/bash

    #

    # exithrap_demo.sh

    #

    # Display "Goodbye" when this script exits.


    short -s -o nounset

    trap ''printf "Goodbye\\n"'' EXIT


    sleep 5


    exit 0

    ```


    When the shell is exited, the message `Goodbye` is printed.


    ```

    $ bash exithrap_demo.sh

    Goodbye

    ```


    When there is a lot of cleaning up to do, exit handlers usually invoke a shell
    function to perform the work. Shell functions are described Chapter 14, "Functions
    and Script Execution."


    # ## The killall Command


    The Linux `killall` command kills by a program name instead of by a process ID
    number. As the name suggests, all matching jobs are killed. If an absolute path
    is specified, only processes running a particular file are killed.'
