- pgno: 81
  md: 'Using standard output is a way to send all the output from a script and any
    com- mands in it to a new destination.


    A script doesn''t usually need to know where the messages are going;There''s al-
    ways the possibility they were redirected. However, when errors occur and when
    warning messages are printed to the user, you don''t want these messages to get
    redirected along with everything else.


    Linux defines a second file especially for messages intended for the user called
    standard error. This file represents the destination for all error messages. The
    symbol for standard error is &2. /dev/stderr can also be used. The default destination,
    like standard out- put, is the screen. For example,


    ```

    `printf "${SCRIPT}:${LINENO: No files available for processing" >&2`

    ```


    This command appears to work the same as a printf without the >&2 redirection,
    but there is an important difference. It displays an error message to the screen,
    no matter where standard output has been previously redirected.


    Because standard error, like standard output, is a kind of renaming of another
    destina- tion, standard error can likewise be redirected. The redirection symbols
    for standard error are the same as standard output except they begin with the
    number 2.


    ```

    `$ bash listorders.sh 2> listorders_errors.txt`

    ```


    In this example, all the error messages from the listorders.sh script are saved
    in the file listorders_errors.txt.


    If the ls command wrote the error messages directly to the screen with /dev/tty,
    there would be no way to redirect the messages to a separate file.


    Linux treats all input as if it was being read from a file. This special file
    is called standard input, and uses the symbol &0. /dev/stdin can also be used
    for standard input. When commands are joined together with the | symbol, the standard
    input of the sec- ond command becomes the standard output of the first command.


    Redirections can be combined for a single command. Order is important as each
    redirection is handled left-to-right. To redirect both standard output and standard
    error to a single file, the following command works.


    ```

    `$ bash listorders.sh > listorders_errors.txt >&2`

    ```


    However, reversing the order of the redirections does not work because it redirects
    standard error to the old standard output and then redirects standard output to
    the file listorders_errors.txt.


    Because redirecting both standard input and standard error is so common, Bash
    pro- vides a short form &> that redirects both.


    ```

    `$ bash listorders.sh &> listorders_errors.txt`

    ```'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Built-In Versus Linux Commands


    The original Bourne shell was designed in a way that anything that was not an
    essential part of the shell was implemented as some program outside of the shell
    itself. Even arithmetic, for example, had to be performed by an outside program.
    This design made the Bourne shell very flexible, but it also introduced a couple
    of drawbacks. First, it was slow because programs were constantly loading and
    restarting to perform even the simplest of tasks. Second, it made shell scripts
    difficult to port because there were no guarantees that a command on one operating
    system was implemented the same way on another; such commands might not even have
    been available.


    To deal with these problems, Bash has many of its fundamental commands built-in.
    But for basic compatibility with the older Bourne shell, Linux still implements
    its own version of Bash''s commands. For instance, **test** is a built-in command
    in Bash, but Linux also provides its own program **/usr/bin/test** for shells
    that don''t provide a built-in version of **test**.


    If you don''t know whether a command is built-in, the Bash **type** command will
    tell you. If the command is a Linux command, it shows the path of the command
    (like the Linux **whereis** command).


    ```

    $ type cd

    cd is a shell builtin

    $ type id

    id is /usr/bin/id

    ```


    The **-t** (_type_) switch displays the type of command. The **-p** (_path_) switch
    returns just the hash table value for this command, as opposed to the first occurrence
    in the **PATH** variable, suppressing other information. The **-a** (_all_) flag
    lists all variations of a command.


    ```

    $ type -a pwd

    pwd is a shell builtin

    pwd is /bin/pwd.

    ```


    There are two switches that limit the scope of a search. The **-f** switch does
    not check any Bash functions that are declared. The **-p** switch goes further,
    checking for the path to a Linux command and ignoring any Bash commands, functions,
    or aliases.


    The **builtin** command explicitly runs a built-in command. The command runs even
    if there''s an alias with the same name.


    ```

    builtin pwd

    ```


    Likewise, **command** explicitly runs a Linux command, even if there''s a built-in
    command or alias with the same name.


    ```

    command pwd

    ```


    With **-v** or **-V**, **command** lists information about the command such as
    its pathname. If **-p** is used, **command** searches the standard Linux **bin**
    libraries for the command; this is useful if you''ve changed the **PATH** variable.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'A complete list of built-in shell commands appears in Appendix B.


    Although *builtin* and *command* are useful in testing and porting older scripts
    to Bash, well-structured scripts should not rely on them because they indicate
    ambiguity in a script''s design.


    The built-in *enable* command temporarily hides the shell built-in commands and
    re-enables them later. The *-n* switch disables the command.


    ```

    ```

    $ enable test

    $ type test

    test is a shell builtin

    $ enable -n test

    $ type test

    test is /usr/bin/test

    ```

    ```


    The *-d* switch disables the built-in command and releases any memory it was using.
    It can be reloaded with the *-f* switch, whereby the filename containing the built-in
    must be specified.


    With *-p*, all enabled shell built-ins are printed. You can combine *-p* with
    *-n* to list the disabled built-ins, or use *-a* to show them all. The *-s* switch
    restricts the listing to POSIX special built-ins.


    ```

    ```

    $ enable -pn

    enable -n test

    ```

    ```


    In well-structured scripts, *enable* should be used in your global declaration
    section. Using *enable* throughout a script makes it difficult to remember whether
    a particular command is a built-in command.


    # The Set and Shop Commands


    Bash contains many optional features that can be enabled or disabled. These options
    pertain to how Bash responds interactively with the user, how it behaves in shell
    scripts, and how compatible Bash is with other shells and standards.


    Bash options can be enabled or disabled by commands or as a command switch when
    Bash is started. For example, to start a Bash session and disallow the use of
    undefined variables, use this:


    ```

    ```

    $ bash -o nounset

    ```

    ```


    In a script or at the Bash dollar prompt, you can disallow the use of undefined
    variables by using this:


    ```

    ```

    $ shopt -s -o nounset

    ```

    ```


    Historically, the *set* command was used to turn options on and off. As the number
    of options grew, *set* became more difficult to use because options are represented
    by single letter codes. As a result, Bash provides the *shopt* (*shell option*)
    command to turn options on and off by name.'
