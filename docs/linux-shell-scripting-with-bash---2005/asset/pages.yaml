    `  9 15:49:01 2001`

    ```


    ```

    $`date`

    `Wed May  9 15:49:01 2001`

    ```


    `stattime` can create meaningful archive filenames. Often files are sent with
    a name such as `orders.txt` and the script wants to save the orders with the date
    as part of the name.


    ```

    $`stattime -f "a_%_a_%_L%M%d.txt" orders.txt`

    `orders_0509.txt`

    ```


    Besides generating new filenames, `stattime` can be used to save information about
    a file to a variable.


