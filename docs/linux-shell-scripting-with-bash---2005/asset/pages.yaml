    \ -ax TREE                      # the binary tree\ndeclare -rx SCRIPT=${0##*/}\
    \          # name of the script\n\n# add_tree: add item to the binary tree\n#\n\
    function add_tree {\n    declare -i ITEM=0                # current position in\
