  md: '# About the Author


    **Ken Burch** graduated with a Computer Science first class honors degree from
    Brock University in St. Catharines, Canada, and did his Masters work at Queen''s
    University in Kingston, Canada. He has been using Linux since version 0.97, at
    a time before Linux was popular. He is the founder of PegaSoft Canada (`http://www.pegasoft.ca`),
    an association that promotes Linux advocacy, education, and development in southern
    Ontario. He has worked with a number of companies, including Mackenzie Financial
    Corporation, one of Canada''s largest mutual fund companies. Ken is an active
    member of the Writers'' Circle of Durham Region and his award-winning short story,“Distance,”
    was recently published in the “Signatures” anthology (ISBN 0973210001).'
