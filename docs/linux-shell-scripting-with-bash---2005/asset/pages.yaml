    ```


    You must follow the *insert*, *append*, and *change* commands by an escaped end
    of line.


    The `i` (*lit*) command is used to display unprintable characters. It displays
    characters as ASCII codes or backslash sequences.


    ```

    ```

    $ printf \"%s\015\t\004\n\" \"ABC\" | sed -n \"i\"

    ABC^c^t^L^@\f^s

    ```

    ```


    In this case, `\015` (a carriage return) is displayed as `\r`, a `\t` Tab character
    is displayed as `\t`, and a `\n` line feed is displayed as a `$` and a line feed.
    The character `\004`, which has no backslash equivalent, is displayed as `\004`.
    `A`, `B`, and `C` are displayed as themselves.


    The `y` (*transform*) command is a specialized short form for the *substitution*
    command. It performs one-to-one character replacements. It is essentially equivalent
    to a group of single character substitutions.


    For example, `y/, /i` is the same as `a//i`:


    ```

    ```

    $ head orders.txt | sed \"y/ /,\n/\nBirchwood China Hutch,475.99,1,756

    Bookcase Oak Veneer,205.99,1,756

    Small Bookcase Oak Veneer,205.99,1,756

