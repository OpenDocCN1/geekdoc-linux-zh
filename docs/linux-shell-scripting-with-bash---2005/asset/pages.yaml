    The content and addresses of Web pages are prone to change. When stripping Web
    pages, take care to verify that the page hasn''t moved and the content hasn''t
    changed. The `compare_time.sh` script checks both that lynx retrieved the Web
    page and that the timeline containing the time was actually found by grep. If
    the Web page has changed location, you can find it again using a search engine
    such as Google.


    Running the script shows a side-by-side comparison between the NRCC time and the
    time on your local computer.


    ```

    $ bash compare_time.sh

