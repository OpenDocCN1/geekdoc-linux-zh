  md: "The built-in `hash` command maintains the hash table. Without any switches,\
    \ `hash` lists the memorized commands, where they are, and the number of times\
    \ the command has been executed during this session.\n\n```\n```\n$ hash\nhits\
    \      command\n  1       /bin/ls\n  1       /bin/uname\n  1       /usr/bin/tput\n\
    \  1       /bin/stty\n  1       /usr/bin/uptime\n  1       /usr/bin/man\n```\n\
    ```\n\nWhen a command is specified, Bash searches for the new location of the\
    \ command. For example, if you create your own `ls` command in your current directory,\
    \ and the `PATH` variable gives precedence to files in your current directory,\
    \ the `hash ls` command finds your `ls` command first, replacing `/bin/ls` with\
    \ `./ls`.\n\n```\n```\n$ hash ls\n$ hash\nhits      command\n  1       /bin/touch\n\
    \  0       ./ls\n  1       /bin/cmdop\n```\n```\n\nThe `-p` (`path`) switch explicitly\
    \ sets a path for a command. The `-d` (`delete`) switch deletes a specific entry,\
    \ and `-r` (`remove`) clears the hash table, removing all commands. The `-t` (`table`)\
    \ option lists the pathnames for specific commands, and `-l` (`list`) lists the\
    \ commands in a format that allows them to be reused by the `hash` command.\n\n\
    ```\n```\n$ hash -t ls less\nls        /bin/ls\nless      /usr/bin/less\n```\n\
    ```\n\n# # Customizing Your Prompt\n\nThe default Bash interactive prompt is a\
