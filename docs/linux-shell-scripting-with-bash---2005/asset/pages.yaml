- pgno: 174
  md: 'This might seem like a lot of work, but for scripts with many complex switches,
    `getopt` makes the job of handling them much easier.


    There are also a number of special switches. The `--alternative` (or `-a`) switch
    allows long options with only a single leading minus sign. Using this switch violates
    Linux convention. `--quiet-output` (or `-q`) can be used to check the switches
    without returning the processed list to standard output. `--quiet` (or `-q`) indicates
    any errors by the status code but hides the error messages so that you can create
    your own custom messages. The `--shell` (or `-u`) switch uses quotation marks
    to protect special characters like spaces that might be treated in a special way
    by a shell. (This is necessary only in C compatibility mode.)


    # # Subshells


    Chapter 7, “Compound Commands,” mentioned that a set of commands can be grouped
    together using curly braces. These commands act as a group and return a single
    status code.


    ```

    $ ( sleep 5 ; printf "%s\n" "Sleep for 5 seconds" ; )

    Sleep for 5 seconds

    ```


    A subshell is a set of commands grouped using round parentheses instead of curly
    braces. Unlike a command group, if a subshell appears on a single line, a semicolon
    is not required after the last command.


    ```

    $ ( sleep 5 ; printf "%s\n" "Sleep for 5 seconds" )

    Sleep for 5 seconds

    ```


    Subshells act like a hybrid of a curly braces command set and a separate script.
    Like a statement group, a subshell is a set of statements that returns a single
    status code. Like a separate shell script, a subshell has its own environment
    variables.


    ```

    $ declare -ix COUNT=15

    $ ( COUNT=10 ; printf "%d\n" "$COUNT" ; )

    10


    $ printf "%d\n" "$COUNT"

    15


    $ ( COUNT=20 ; printf "%d\n" "$COUNT" )

    20


    $ printf "%d\n" "$COUNT"

    10

    ```


    In this example, a command group can change the value of the variable `COUNT`
    in the shell session because the group runs as part of the session. The subshell
    cannot change the value of `COUNT` in the main program because it runs as if it
    were a separate shell script. `COUNT` is a copy of the variable from the session
    and the subshell can only change its private copy of `COUNT`.'
  merge: -1
  img_proc: true
- pgno: 175
  md: "Subshells are often used in conjunction with pipes. Using a pipe (or file redirection),\
    \ the results of a command can be redirected to the subshell for processing. The\
    \ data appears on the standard input of the subshell, as shown in Listing 9.7.\n\
    \n# **Listing 9.7** subshell.sh\n\n```\n#!/bin/bash\n#\n# subshell.sh\n#\n# Perform\
    \ some operation to all the files in a directory\n\nshopt -s -o nounset\ndeclare\
    \ -rx SCRIPT=$$0##//\ndeclare -rx INCOMING_DIRECTORY=\"incoming\"\n\nls -1 \"\
    $INCOMING_DIRECTORY\" |\n(\n    while read FILE ; do\n        printf \"$SCRIPT:\
    \ Processing $...\\n\" \"$FILE\"\n        # <-- do something here\n    done\n\
    )\nprintf \"Done\\n\"\nexit 0\n```\n\nThe read command in the subshell reads one\
    \ line at a time from standard input. In this case, it is reading the list of\
    \ files created by the ls command.\n\n```\n$ bash subshell.sh\nsubshell.sh: Processing\
    \ alabama_orders.txt...\nsubshell.sh: Processing new_york_orders.txt...\nsubshell.sh:\
    \ Processing ohio_orders.txt...\nDone\n```\n\nSubshells inherit more than just\
    \ environment variables. This topic is discussed in detail in Chapter 14, “Functions\
    \ and Script Execution.”\n\nArgument handling greatly increases the flexibility\
    \ of scripts, and subshells are an indispensable tool. But there is still more\
    \ fundamental material to master before a script can be truly called professional.\
    \ A script without job control and signal handling is still incomplete."
  merge: -1
  img_proc: true
