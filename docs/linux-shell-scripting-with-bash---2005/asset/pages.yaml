    # Locating Files


    The Linux `locate` command consults a database and returns a list of all pathnames
    containing a certain group of characters, much like a fixed-string `grep`.


    ```

    $ locate /orders.txt

    /home/kburch/test/orders.txt

    /home/kburch/orders.txt

    $ locate orders.txt

    /home/kburch/test/orders.txt

    /home/kburch/test/advocacy/old_orders.txt

    /home/kburch/orders.txt

    ```


    Older versions of `locate` show any file on the system, even files you normally
    don''t have access to. Newer versions only show files that you have permission
    to see.


    The `locate` database is maintained by a command called `updatedb`. It is usually
    executed once a day by Linux distributions. For this reason, `locate` is very
    fast but useful only in finding files that are at least one day old.


    # Finding Files


    The Linux `find` command searches for files that meet specific conditions such
    as files with a certain name or files greater than a certain size. `find` is similar
    to the following loop where *MATCH* is the matching criteria:


    ```

    ls --recursive | while read FILE ; do

    # test file for a match

    if [ $MATCH ] ; then

    printf "%s\n" "$FILE"

    fi

    done

    ```


    This script recursively searches directories under the current directory, looking
    for a filename that matches some condition called *MATCH*.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'find is much more powerful than this script fragment. Like the built-in test
    command, find switches create expressions describing the qualities of the files
    to find. There are also switches to change the overall behavior of find and other
    switches to indicate actions to perform when a match is made.


    The basic matching switch is -name, which indicates the name of the file to find.
    Name can be a specific filename or it can contain shell path wildcard globbing
    characters like * and ?. If pattern matching is used, the pattern must be enclosed
    in quotation marks to prevent the shell from expanding it before the find command
    examines it.


    ```

    ```

    $ find . -name ''*.txt''

    ./orders.txt

    ./advocacy/linux.txt

    ./advocacy/old_orders.txt

    ```

    ```


    The first parameter is the directory to start searching in. In this case, it''s
    the current directory.


    The previous find command matches any type of file, including files such as pipes
    or directories, which is not usually the intention of a user. The -type switch
    limits the files to a certain type of file. The -type f switch matches only regular
    files, the most common kind of search. The type can also be b (block device),
    c (character device), d (directory), p (pipe), l (symbolic link), or s (socket).


    ```

    ```

    $ find . -name ''*.txt'' -type f

    ./orders.txt

    ./advocacy/linux.txt

    ./archive/old_orders.txt

    ```

    ```


    The switch -name ''*.txt'' -type f is an example of a find expression. These switches
    match a file that meets both of these conditions (implicitly, a logical "and").
    There are other operator switches for combining conditions into logical expressions,
    as follows:


    +   - ( expr )—Forces the switches in the parentheses to be tested first

    +   - -not expr (or ! expr)—Ensures that the switch is not matched

    +   - expr -and expr (or expr -a expr)—The default behavior; looks for files that
    match both sets of switches

    +   - expr -or expr (or expr -o expr)—Logical "or". Looks for files that match
    either set of switches

    +   - expr , expr—Always checks both sets of switches, but uses the result of
    the right set to determine a match


    For example, to count the number of regular files and directories, do this:


    ```

    ```

    $ find . -type d -or -type f | wc -1

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'The number of files without a `.txt` suffix can be counted as well.


    ```

    $ find . -name "*.txt" -type f | wc -l

    185

    ```


    Parentheses must be escaped by a backslash or quotes to prevent Bash from interpreting
    them as a subshell. Using parentheses, the number of files ending in `.txt` or
    `.sh` can be expressed as


    ```

    $ find . "( -name "*.txt" -or -name "*.sh" )" -type f | wc -l

    11

    ```


    Some expression switches refer to measurements of time. Historically, `find` times
    were measured in days, but the GNU version adds `min` switches for minutes. `find`
    looks for an exact match.


    To search for files older than an amount of time, include a plus or minus sign.
    If a `plus sign (+)` precedes the amount of time, `find` searches for times greater
    than this amount. If a `minus sign (-)` precedes the time measurement, `find`
    searches for times less than this amount. The plus and minus zero days designations
    are not the same: `+0` in days means “older than no days,” or in other words,
    files one or more days old. Likewise, `-5` in minutes means “younger than 5 minutes”
    or “zero to four minutes old.”


    There are several switches used to test the `access time`, which is the time a
    file was last read or written. The `-anewer` switch checks to see whether one
    file was accessed more recently than a specified file. `-atime` tests the number
    of days ago a file was accessed. `-amin` checks the access time in minutes.


    Likewise, you can check the inode change time with `-cnewer`, `-ctime`, and `-cmin`.
    The inode time usually, but not always, represents the time the file was created.
    You can check the `modified time`, which is the time a file was last written to,
    by using `-newer`, `-mtime`, and `-mmin`.


    To find files that haven''t been changed in more than one day:


    ```

    $ find . -name "*.sh" -type f -mtime +0

    ./archive/old_orders.txt

    ```


    To find files that have been accessed in the last 10 to 60 minutes:


    ```

    $ find . -name "*.txt" -type f -amin +9 -amin -61

    ./orders.txt

    ./advocacy/linux.txt

    ```


    The `-size` switch tests the size of a file. The default measurement is 512-byte
    blocks, which is counterintuitive to many users and a common source of errors.
    Unlike the time-measurement switches, which have different switches for different
    measurements of time, to change the unit of measurement for `size` you must follow
    the amount with a `b (bytes)`, `c (characters)`, `k (kilobytes)`, or `w (16-bit
    words)`. There is no `m (megabytes)`. Like the time measurements, the amount can
    have a minus sign (-) to test for files smaller than the specified size, or a
    plus sign (+) to test for larger files.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'For example, use this to find log files greater than 1MB:


    ```

    $ find . -type f -name "*.log" -size +1024k

    ./logs/giant.log

    ```


    find shows the matching paths on standard output. Historically, the `-print` switch
    had to be used. Printing the output is now the default behavior for most Unix-like
    operating systems, including Linux. If compatibility is a concern, add `-print`
    to the end of the find parameters.


    To perform a different action on a successful match, use `-exec`. The -exec switch
    runs a program on each matching file. This is often combined with rm to delete
    matching files, or grep to further test the files to see whether they contain
    a certain pattern. The name of the file is inserted into the command by a pair
    of curly braces ({} ) and the command ends with an escaped semicolon. (If the
    semicolon is not escaped, the shell interprets it as the end of the find command
    instead.)


    ```

    $ find . -type f -name "*.txt" -exec grep Table {} \

    ;;

    Pine Round Table,375.99,1,757

    Pine Round Table,375.99,1,757

    ```


    More than one action can be specified. To show the filename after a grep match,
    include `-print`.


    ```

    $ find . -type f -name "*.txt" -exec grep Table {} \; -print

    ./orders.txt

    Pine Round Table,375.99,1,757

    ./archive/old_orders.txt

    ```


    find expects {} to appear by itself (that is, surrounded by whitespace). It can''t
    be combined with other characters, such as in an attempt to form a new pathname.


    The -exec switch can be slow for a large number of files: The command must be
    executed for each match. When you have the option of piping the results to a second
    command, the execution speed is significantly faster than when using -exec. A
    pipe generates the results with two commands instead of hundreds or thousands
    of commands.


    The -ok switch works the same way as -exec except that it interactively verifies
    whether the command should run.


    ```

    $ find . -type f -name "*.txt" -ok rm {} \;

    < rm ... ./orders.txt > ? n

    < rm ... ./advocacy/linux.txt > ? n

    < rm ... ./advocacy/old_orders.txt > ? n

    ```


    The -ls action switch lists the matching files with more detail. find runs ls
    -dils for each matching file.


    ```

    $ find . -type f -name "*.txt" -ls

    243000    4 -rw-rw-r--   1 kburtch    kburtch       592 May 17 14:41 ./orders.txt

    114683    0 -rw-rw-r--   1 kburtch    kburtch         0 May 17 14:41 ./advocacy/1

    ```'
  merge: -1
  img_proc: true
