- pgno: 301
  md: '# 16

    Network Programming


    “SO YOU’RE KEN BURCHT?” he said with a smile that wasn’t pleasant. The Sun computer
    dealer shook my hand.


    At the time, a friend and I were running the first Internet news and email service
    in the Niagara Falls region. Looking for a secondary Usenet feed, we approached
    the Sun dealer to see whether they would let us network with their computers.
    We emailed several times but received no response. The mystery was solved as the
    dealer explained that he had set up a Usenet feed and emailed us the connection
    information. Unfortunately, he didn’t realize that his emails were being routed
    along with the news, aviating our computer to connect, and so we never received
    his messages. A simple communication’s oversight left him with a bad impression.


    Networking is a very complex issue because, by its nature, it requires intricate
    communications over uncertain channels. Fortunately, Bash takes care of most of
    the details, thus making enterprise-wide scripts easy to write and use.


    # Sockets


    To communicate over a network, two programs must follow a communications protocol.
    The protocol defines how to respond new connections, how to acknowledge the safe
    arrival of the data over the network, what to do when a connection is unexpectedly
    terminated, and so forth. Sending files across a network is a much more unreliable
    procedure than saving files to a hard drive.


    Each computer on a network is designated an IP number and one or more hostnames.
    Hostnames can often be aliases for the same machine.You can look up the IP number
    of the machine a hostname refers to by using the host command.


    ```

    ```

    $ host www.vaxxine.com

    www.vaxxine.com is a nickname for alpha.vaxxine.com

    alpha.vaxxine.com has address 209.5.212.5

    alpha.vaxxine.com has address 209.5.212.5

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'The `-v` switch produces a copy of the domain master file. Specific information
    can be requested by the `-t` switch—there are many options for `t`.


    `localhost` is an alias in Linux for the current computer on all Linux systems.
    Connections between machines are referred to as *sockets*. The name dates back
    to the early 1980s when they were first used with BSD Unix. The term symbolizes
    two imaginary connectors on separate computers. When a connection is established
    (picture a cable connected to the sockets), the two computers can communicate.


    The primary protocol of the Internet and many local area networks (LANs) is *TCP/IP*
    (Transport Control Protocol/Internet Protocol). You can open network TCP/IP sockets
    in Bash using a special `/dev/tcp` pathname. This is not the location of an actual
    file: Bash interprets this pathname as a request to open a socket.


    Bash can also create UDP (User Datagram Protocol) sockets using `/dev/udp` pathnames.
    However, UDP is used to send short messages that might not arrive at their destination
    and isn''t covered in this chapter.


    In addition to the protocol, sockets require a *port*. Ports are numbers used
    to identify different services on the remote computer. Different programs listen
    to different port numbers, waiting for new connections. Although there''s no requirement
    that a particular service be available on a particular port, some services are
    given traditional port numbers. Web servers, for example, are usually assigned
    to port number 80. This is the port Web browsers connect to by default.


    Bash takes care of most of the details of opening and maintaining sockets. To
    a Bash script, a socket is a regular file with an unusual pathname. Sockets act
    like named pipes, blocking until there is new information to read. When a socket
    is closed, the `read` command indicates that the end of the file has been reached.
    Unlike pipes, sockets are always readable and writable.


    # Client-Server and Peer-to-Peer


    Although the networking protocol sets up the rules for communication, they impose
    no strictures on the messages exchanged between two computers. If a socket is
    opened between two computers and both wait for the other to send the first message,
    the programs will wait indefinitely. To resolve this problem, there are two common
    networking strategies—client-server and peer-to-peer.


    The most common strategy is *client-server*. One program is designated the *server*.
    It “serves up” data upon request. The other program is the *client*, and it makes
    the requests. Web servers and browsers are an example of a client-server pair.
    The Web browser always initiates the conversation with the server.


    Alternatively, the *peer-to-peer* (or P2P) strategy has both a client and a server
    integrated into a single program, typically by assigning the client and server
    functions to separate ports. Each program can receive requests or make them. Because
    all programs are considered equal (or “peers”) and there is no single server acting
    as overseer to the data being shared, this strategy is useful for sharing a large
    task or data across several computers operating in parallel.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'Client-server is the most common method of networking because of its simplicity.
    The server, like a Bash function, hides all the complexity of finding and processing
    the data returned to the client.


    Bash scripts can only be written as clients because there is no way to configure
    Bash to listen for incoming connections on a given port.


    # # Network Clients


    Network connections are always opened as readable and writable files (<>). The
    path-names beginning with `/dev/tcp` open TCP/IP connections. Follow the pathname
    with the host and port numbers. For example, to open a connection to the Web server
    on the current computer, do this


    ```

    $ exec 3<> /dev/tcp/localhost/80

    ```


    Suppose a Web server is running on the current computer on port 8080. (Port 8080
    is the standard port for running a Web server under a personal account.) A connection
    can be opened for read and write with `exec` and the default Web page retrieved,
    as shown in Listing 16.1.


    # Listing 16.1 getpage.sh


    ```

    #!/bin/bash

    #

    # getpage.sh - get a web page

    #

    shopt -o -s nounset


    declare LINE

    declare -rx SCRIPT=$0###/}


    # Open an HTML socket to the localhost

    # For both read and write


    printf "Connecting to host\n"

    exec 3<> /dev/tcp/localhost/8080


    # Send the HTTP request to retrieve the default page


    printf "Sending request to host\n"

    printf "$s HTTP/1.0\r\n" "GET \">/" >&3

    printf "Accept: text/html, text/plain\r\n" >&3

    printf "Accept-Language: en\r\n" >&3

    printf "User-Agent: $s (Bash Script)\r\n" "$SCRIPT" >&3

    printf "\r\n" >&3

    ```'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Listing 16.1  **Continued**


    ```

    # Read the response and display it on the screen


    printf "Receiving page\n"

    printf "%%s\n" "___________________"

    while read LINE < &3 ; do

    printf "%%s\n" "$LINE"

    done


    exit 0

    ```


    Running this script retrieves and displays the Web page.


    ```

    $ bash getpage.sh

    Connecting to host

    Sending request to host

    Receiving page


    HTTP/1.0 200 Document follows

    Date: Wed, 04 Jul 2001 18:26:27 GMT

    Server: NCSA/1.5.2

