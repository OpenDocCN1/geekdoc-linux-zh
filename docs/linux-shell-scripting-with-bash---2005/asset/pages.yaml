- pgno: 211
  md: '# # File Statistics


    The Linux `wc` (word count) command provides statistics about a file. By default,
    `wc` shows the size of the file in lines, words, and characters. To make `wc`
    useful in scripts, switches must be used to return a single statistic.


    The `-bytes` (or `-c` or `-C`) switch returns the file size, the same value as
    the file size returned by `stat`\`fsize`.


    ```

    $ `wc -bytes invoices.txt`

    20411 invoices.txt

    ```


    To use `wc` in a script, direct the file through standard input so that the filename
    is suppressed.


    ```

    $ `wc -bytes < status_log.txt`

    57496

    ```


    The `-lines` (or `-1`) switch returns the number of lines in the file. That is,
    it counts the number of line feed characters.


    ```

    $ `wc -lines < status_log.txt`

    1569

    ```


    The `-max-line-length` (or `-L`) switch returns the length of the longest line.
    The `-words` (or `-w`) switch counts the number of words in the file.


    `wc` can be used with variables when their values are printed into a pipeline.


    ```

    $ `declare -r TITLE=''Annual Grain Yield Report''`

    $ `printf "%s\n" "$TITLE" | wc -words`

    4

    ```


    # # Cutting


    The Linux `cut` command removes substrings from all lines contained in a file.


    The `-fields` (or `-f`) switch prints a section of a line marked by a specific
    character. The `-delimiterr` (or `-d`) switch chooses the character. To use a
    space as a delimiter, it must be escaped with a backslash or enclosed in quotes.


    ```

    $ `declare -r TITLE=''Annual Grain Yield Report''`

    $ `printf "%s\n" "$TITLE" | cut -d '' '' -f2`

    Grain

    ```


    In this example, the delimiter is a space and the second field marked by a space
    is `Grain`. When cutting with `printf`, always make sure a line feed character
    is printed; otherwise, `cut` will return an empty string.


    Multiple fields are indicated with commas and ranges as two numbers separated
    by a minus sign (-).


    ```

    $ `printf "%s\n" "$TITLE" | cut -d '' '' -f 2,4`

    Grain Report

    ```'
  merge: -1
  img_proc: true
- pgno: 212
  md: "You separate multiple fields using the delimiter character. To use a different\
    \ delimiter character when displaying the results, use the `-output-delimiter`\
    \ switch.\n\nThe `-characters` (or `-c`) switch prints the specified characters'\
    \ positions. This is similar to the dollar sign expression substrings but any\
    \ character or range of characters can be specified. The `-bytes` (or `-b`) switch\
    \ works identically but is provided for future support of multi-byte international\
    \ characters.\n\n```\n$ printf \"%s\\n\" \"STITLE\" | cut -characters 1,3,6-8\n\
    Anl G\n```\n\nThe `-only-delimited` (or `-s`) switch ignores lines in which the\
    \ delimiter character doesn't appear. This is an easy way to skip a title or other\
    \ notes at the beginning of a data file.\n\nWhen used on multiple lines, cut cuts\
    \ each line\n\n```\n$ cut -d, -f1 < orders.txt | head -3\nBirchwood China Hutch\n\
    Bookcase Oak Veneer\nSmall Bookcase Oak Veneer\n```\n\nThe script in Listing 11.8\
    \ adds the quantity fields in orders.txt.\n\n# Listing 11.8 cut_demo.sh\n\n```\n\
    #!/bin/bash\n#\n# cut_demo.sh: compute the total quantity from orders.txt\n\n\
    shopt -o -s nounset\n\ndeclare -i QTY\ndeclare -ix TOTAL_QTY=0\n\ncut -d, -f3\
    \ orders.txt | {\n  while read QTY ; do\n    TOTAL_QTY=TOTAL_QTY+QTY\n  done\n\
    \n  printf \"The total quantity is %d\\n\" \"$TOTAL_QTY\"\n}\nexit 0\n```\n\n\
    # ## Pasting\n\nThe Linux paste command combines lines from two or more files\
    \ into a single line. With two files, paste writes to standard output the first\
    \ line of the first file, a Tab character, and the first line from the second\
    \ file, and then continues with the second line"
