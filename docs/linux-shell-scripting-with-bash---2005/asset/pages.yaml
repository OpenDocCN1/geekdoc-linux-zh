  md: "```\nFILES=`find . -type f -mmin +30 -print`\n\n# If new files exist, move\
    \ them to the processing directory\n\nif [ ! -z \"$FILES\" ] ; then\n    printf\
    \ \"$SCRIPT: new files have arrived at $\\n\" \"$date\"\n    printf \"\\n\" \"\
    $FILES\" | {\n        while read FILE ; do\n            # Remove leading \"./\"\
    \n            FILE=\"${FILE#./}\"\n            # Rename the file with the current\
    \ time\n            NEW_FILE=\"$STATFTIME -f \"%L_%T.dat\" \"$FILE\"\n       \
    \     if [ -z \"$NEW_FILE\" ] ; then\n                printf \"\\n\" \"$SCRIPT:$LINENO:\
    \ statftime failed to\\\ncreate a new filename-skipping\"\n            else\n\
    \                # Move the file to the processing directory\n               \
    \ printf \"\\n\" \"$SCRIPT: moved $FILE to \\\n$PROCESSING_DIR/$NEW_FILE\"\n \
    \               mv \"$FILE\" \"$PROCESSING_DIR/$NEW_FILE\"\n            fi\n \
    \       done\n    }\n    sleep 30\ndone\n\nprintf \"$SCRIPT finished unexpectedly\
    \ at $\\n\" \"$date\"\nexit 1\n```\n\nThe script can use *blocking* instead of\
    \ polling. By replacing the `sleep` command with a `suspend` command, the script\
    \ will sleep indefinitely until it wakes up with the `kill -SIGCONT` command.\
    \ This is useful when one script relies upon another.\n\nA daemon script runs\
    \ until it's suspended or stopped with the `kill` command. It can be started so\
    \ that it runs in the background and automatically restarts itself:\n\n```\n$\
    \ { ( while true ; do nohup bash polling.sh ; done ; ) \\\n>/dev/null 2>&1 </dev/null\
    \ & } &\n```\n\nThis command line creates two processes. The outer process redirects\
    \ standard input, output, and error to `/dev/null` because they no longer apply.\
    \ The inner process repeats the bash script in the `while` loop. When the command\
    \ prompt returns, use the `ps` command to see that the `polling.sh` script is\
    \ running. (It is possible to get rid of one of the command groupings by using\
