    # # Version Control (CVS)


    In a business environment, where money and careers are at stake, it''s not enough
    to create a flawless program. There''s always a chance some last-minute change
    will cause a program to produce the wrong result or even to crash. When that happens,
    the changes need to be undone or corrected as quickly as possible with no data
    loss.


    A *version control system* is a program that maintains a master copy of the data
    files, scripts, and source programs. This master copy is kept in a directory called
    a *repository*. Every time a program is added or changed, it''s resubmitted to
    the repository with a record of which changes were made, who made them, and when.


    *CVS* (*Concurrent Versions System*) is the version control software supplied
    with most Linux distributions. Based on an older program called RCS (*Revision
    Control System*), CVS can share a script among multiple programmers and log any
    changes. It can work with individual files, whole directories, or large projects.
    They can be organized into groups of files called *modules*. CVS timestmps files,
    maintains version numbers, and identifies possible problems when two programmers
    update the same section of a program simultaneously.


    CVS is also very popular for open source development. It can be configured to
    enable programmers all over the world to work on a project.


    To use CVS, the project or team leader must create a directory to act as the version
    control repository as well as a subdirectory called *CVSROOT*. Then you define
    an environment variable called *CVSROOT* so CVS knows where to find the repository
    directory. For example, to make /home/repository the repository for your team,
    you set up the *CVSROOT* under Bash as follows


    ```

    $ declare -rx CVSROOT=/home/repository

    ```


    The repository holds copies of all the files, change logs, and other shared resources
    related to your project.'
