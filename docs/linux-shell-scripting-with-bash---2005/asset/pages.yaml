- pgno: 197
  md: "# Transferring Files Between Accounts (wget)\n\nLinux has a convenient tool\
    \ for downloading files from other logins on the current computer or across a\
    \ network. *wget* (*web get*) retrieves files using FTP or HTTP. *wget* is designed\
    \ specifically to retrieve files, making it easy to use in shell scripts. If a\
    \ connection is broken, *wget* tries to reconnect and continue to download the\
    \ file.\n\nThe *wget* program uses the same form of address as a Web browser,\
    \ supporting ftp:// and http:// URLs. Login information is added to a URL by placing\
    \ *user:* and *password* prior to the hostname. FTP URLs can end with an optional\
    \ ;*type*=a or ;*type*=i for ASCII or IMAGE FTP downloads. For example, to download\
    \ the *info.txt* file from the *kburtch* login with the password *jabber12* on\
    \ the current computer, you use:\n\n```\n$ wget ftp://kburtch:jabber12@localhost/info.txt;type=i\n\
    ```\n\nBy default, *wget* uses --*verbose* message reporting. To report only errors,\
    \ use the --*quiet* switch. To log what happened, append the results to a log\
    \ file using --*append-output* and a log name and log the server responses with\
    \ the --*server-response* switch.\n\n```\n$ wget --server-response --append-output\
    \ wget.log \\\n ftp://kburtch:\\\n jabber12@localhost/info.txt;type=i\n```\n\n\
    Whole accounts can be copied using the --*mirror* switch.\n\n```\n$ wget --mirror\
    \ ftp://kburtch:jabber12@localhost;type=i\n```\n\nTo make it easier to copy a\
    \ set of files, the --*globopt* switch can enable file pattern matching. --*globopt*\
    \ on causes *wget* to pattern match any special characters in the filename. For\
    \ example, to retrieve all text files:\n\n```\n$ wget --globopt on 'ftp://kburtch:jabber12@localhost/*.txt'\n\
    ```\n\nThere are many special-purpose switches not covered here. A complete list\
    \ of switches is in the reference section. Documentation is available on the *wget*\
    \ home page at http://www.gnu.org/software/wget/wget.html.\n\n# Transferring Files\
    \ with FTP\n\nBesides *wget*, the most common way of transferring files between\
    \ accounts is using the ftp command. FTP is a client/server system: An FTP server\
    \ must be set up on your computer if there isn't one already. Most Linux distributions\
    \ install an FTP server by default.\n\nWith an FTP client, you'll have to redirect\
    \ the necessary download commands using standard input, but this is not necessary\
    \ with *wget*.\n\nTo use *ftp* from a script, you use three switches. The -n (*not\
    \ interactive*) switch disables the normal FTP prompts to the user. -u (*no auto-login*)\
    \ suppresses the login prompt, requiring you to explicitly log in with the *open*\
    \ and *user* commands. -v (*verbose*) displays more details about the transfer.\
    \ The ftp commands can be embedded in a script using a here file."
  merge: -1
  img_proc: true
- pgno: 198
  md: "```\nftp -i -n -v <<!\nopen ftp.nightlight.com\nuser incoming_orders password\n\
    cd linux_lightbulbs\nbinary\nput $1\n!\nif [ $? -ne 0 ] ; then\n\tprintf \"%s\\\
    n\" \"$SCRIPT: FTP transfer failed\" >&2\n\texit 192\nfi\n```\n\nThis script fragment\
    \ opens an FTP connection to a computer called ftp.nightlight.com. It deposits\
    \ a file in linux_lightbulbs directory in the incoming_orders account. If an error\
    \ occurs, an error message is printed and the script stops.\n\nProcessing files\
    \ sent by FTP is difficult because there is no way of knowing whether the files\
    \ are still being transferred. Instead of saving a file to a temp file and then\
    \ moving it to its final location, an FTP server will create a blank file and\
    \ will slowly save the data to the file. The mere presence of the file is not\
    \ enough to signify the transfer is complete. The usual method of handling this\
    \ situation is to wait until the file has been modified within a reasonable amount\
    \ of time (perhaps an hour). If the file hasn't been modified recently, the transfer\
    \ is probably complete and the file can be safely renamed and moved to a permanent\
    \ directory.\n\nSome distributions have an ftpcopy (or a ftpcp) command, which\
    \ will copy whole directories at one time. Care must be taken with it because\
    \ it is primarily intended as a mirroring tool and it will delete any local files\
    \ not located at the remote account.\n\n# Transferring Files with Secure FTP (sftp)\n\
    \nPart of the OpenSSH (Open Secure Shell) project, Secure FTP (sftp) is another\
    \ file-transfer program that works in a similar way to FTP, but encrypts the transfer\
    \ so that it cannot be intercepted or read by intermediary computers. The encryption\
    \ process increases the amount of data and slows the transfer but provides protection\
    \ for confidential information.\n\nYou must specify the computer and user account\
    \ on the sftp command line. SFTP prompts you for the password.\n\n```\n$ sftp\
    \ root@our_web_site.com:/etc/httpd/httpd.conf\nConnecting to our_web_site.com...\n\
    root@our_web_site.com's password:\nFetching /etc/httpd/httpd.conf to httpd.conf\n\
    ```\n\nFor security purposes, SFTP normally asks the user for the Linux login\
    \ password. It doesn't request the password from standard input but from the controlling\
    \ terminal. This"
  merge: -1
  img_proc: true
- pgno: 199
  md: 'means you can''t include the password in the batch file. The solution to this
    problem is to use SSH''s public key authentication using the `ssh-keygen` command.
    If you have not already done so, generate a new key pair as follows.


    ```

    $ ssh-keygen -t rsa

    ```


    A pair of authentication keys are stored under `~/.ssh` in your home directory.
    You must copy the public key (a file ending in `.pub`) to the remote machine and
    add it to a text file called `~/.ssh/authorized_keys`. Each local login accessing
    the remote login needs a public key in `authorized_keys`. If a key pair exists,
    SFTP automatically uses the keys instead of the Linux login password.


    Like FTP, SFTP needs a list of commands to carry out. SFTP includes a `-b` (*batch*)
    switch to specify a separate batch file containing the commands to execute. To
    use a convenient here file in your script, use a batch file called `/dev/stdin`.


    The commands that SFTP understands are similar to FTP. For purposes of shell scripting,
    the basic transfer commands are the same. Transfers are always "binary." There
    is a `-v` (*verbose*) switch, but it produces a lot of information. When the `-b`
    switch is used, SFTP shows the commands that are executed so the `-v` switch is
    not necessary for logging what happened during the transfer.


    ```

    ```sftp -C -b /dev/stdin root@our_web_site.com <<!

    cd /etc/httpd

    get httpd.conf

    !

    STATUS=$?

    if [ $STATUS -ne 0 ] ; then

    printf "%s\n" "Error: SFTP transfer failed" >&2

    exit $STATUS

    fi```

    ```


    The `-c` (*compress*) option attempts to compress the data for faster transfers.
    For more information about *ssh*, *sftp*, and related programs, visit http://www.openssh.org/.


    # ## Verifying Files


    Files sent by FTP or wget can be further checked by computing a checksum. The
    Linux `cksum` command counts the number of bytes in a file and prints a cyclic
    redundancy check (CRC) checksum, which can be used to verify that the file arrived
    complete and intact. The command uses a POSIX-compliant algorithm.


    ```

    $ cksum orders.txt

    491404265 21799 orders.txt

    ```


    There is also a Linux `sum` command that provides compatibility with older Unix
    systems, but be aware that `cksum` is incompatible with `sum`.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'For greater checksum security, some distributions include a `md5sum` command
    to compute an MD5 checksum. The `–status` switch quietly tests the file. The `–binary`
    (or `-b`) switch treats the file as binary data as opposed to text. The `–warn`
    switch prints warnings about bad MD5 formatting. `–check` (or `-c`) checks the
    sum on a file.


    ```

    ```

    $ md5sum orders.txt

    945eeccl37074a43e232730a44774004  orders.txt

    $ md5sum orders.txt > orderssum.txt

    $ md5sum –check orderssum.txt

    file1.txt: OK

    ```

    ```


    Differences between two files can be pinpointed with the Linux `cmp` command.


    ```

    ```

    $ cmp orders.txt orders2.txt

    orders.txt orders2.txt differ: char 179, line 6

    ```

    ```


    If two files don’t differ, `cmp` prints nothing.


    # Splitting Large Files


    Extremely large files can be split into smaller files using the Linux `split`
    command. Files can be split by bytes or by lines. The `–bytes=s` (or `–b s`) switch
    creates files of no more than *s* bytes. The `–lines=s` (or `-l s`) switch creates
    files of no more than *s* lines. The `–line-bytes=s` (or `-c s`) switch constrains
    each line to no more than *s* bytes. The size is a number with an optional b (512
    byte blocks), k (kilobytes), or m (megabytes). The final parameter is the prefix
    to use for the new filenames.


    ```

    ```

    $ split –bytes=10k huge_file.txt small_file

    $ ls -l small_file*

    -rw-rw-r-- 1 kburtch kburtch 10240 Aug 28 16:19 small_fileaa

    -rw-rw-r-- 1 kburtch kburtch 10240 Aug 28 16:19 small_fileab

    -rw-rw-r-- 1 kburtch kburtch  1319 Aug 28 16:19 small_fileac

    ```

    ```


    You reassemble a split file with the Linux `cat` command. This command combines
    files and writes them to standard output. Be careful to combine the split files
    in the correct order.


    ```

    ```

    $ cksum huge_file.txt

    491404265 21799  huge_file.txt

    $ cat small_fileaa small_fileab small_fileac > new_file

    $ cksum new_file

    491404265 21799 new_file

    ```

    ```


    If the locale where the split occurred is the same as the locale where the file
    is being reassembled, it is safe to use wildcard globbing for the `cat` filenames.


    The Linux `caplt` (*context split*) command splits a file at the points where
    a specific pattern appears.'
  merge: -1
  img_proc: true
- pgno: 201
  md: "The basic `csplit` pattern is a regular expression in slashes followed by an\
    \ optional offset. The regular expression represents lines that will become the\
    \ first line in the next new file. The offset is the number of lines to move forward\
    \ or back from the matching line, which is by default zero. The pattern `*/\\\
    d\\cg/\\+\\*` will separate a file into two smaller files, the first ending with\
    \ the first occurrence of the pattern `\\d\\cg`.\n\nQuoting the pattern prevents\
    \ it from being interpreted by Bash instead of the `csplit` command.\n\nThe `-prefix=R`\
    \ (or `-f P`) switch sets the prefix for the new filenames. The `-suffix=S` (or\
    \ `-b S`) writes the file numbers using the specified C printf function codes.\
    \ The `-digits=D` (or `-n D`) switch specifies the maximum number of digits for\
    \ file numbering. The default is two digits.\n\n```\n```\n$ csplit -prefix \"\
    chairs\" orders.txt \"/Chair/\"   \n107   \n485   \n$ ls -l chairs*\n-rw-rw-r--\
    \   1 kburcht  kburcht   107 Oct  1 15:33 chairs00\n-rw-rw-r--   1 kburcht  kburcht\
    \   485 Oct  1 15:33 chairs01\n$ head -1 chairs01\nReclining Chair,1599.99,1,757\
    \  \n```\n```\n\nThe first occurrence of the pattern `Chair` was in the line `Reclining\
    \ Chair`. Multiple patterns can be listed. A pattern delimited with percent signs\
    \ (`%`) instead of with slashes indicates a portion of the file that should be\
    \ ignored up to the indicated pattern. It can also have an offset. A number by\
    \ itself indicates that particular line is to start the next new file. A number\
    \ in curly braces repeats the last pattern a specific number of times, or an asterisk\
    \ to match all occurrences of a pattern.\n\nTo split the `orders.txt` file into\
    \ separate files, each beginning with the word `Chair`, use the all occurrences\
    \ pattern.\n\n```\n```\n$ csplit -prefix \"chairs\" orders.txt \"/Chair/*\" \"\
    (* *)\"\n107   \n222   \n23    \n179   \n61    \n$ ls -l chairs*\n-rw-rw-r-- \
    \  1 kburcht  kburcht   107 Oct  1 15:37 chairs00\n-rw-rw-r--   1 kburcht  kburcht\
    \   222 Oct  1 15:37 chairs01\n-rw-rw-r--   1 kburcht  kburcht   23  Oct  1 15:37\
    \ chairs02\n-rw-rw-r--   1 kburcht  kburcht   179 Oct  1 15:37 chairs03\n-rw-rw-r--\
    \   1 kburcht  kburcht   61  Oct  1 15:37 chairs04\n```\n```\n\nThe `-elide-empty-files`\
    \ (or `-z`) switch doesn’t save files that contain nothing. `-keep-files` (or\
    \ `-k`) doesn’t delete the generated files when an error occurs. The `-quiet`\
    \ (or `-silent` or `-q` or `-B`) switch hides progress information.\n\n`csplit`\
    \ is useful in splitting large files containing repeated information, such as\
    \ extracting individual orders sent from a customer as a single text file."
  merge: -1
  img_proc: true
- pgno: 202
  md: "# Tabs and Spaces\n\nThe Linux expand command converts Tab characters into\
    \ spaces. The default is eight spaces, although you can change this with -tabs=n\
    \ (or -t n) to n spaces. The -tabs switch can also use a comma-separated list\
    \ of Tab stops.\n\n```\n$ printf '\\tA\\tTEST\\n' > test.txt\n$ wc test.txt\n\
    \        1       2       8 test.txt\n$ expand test.txt | wc\n        1       2\
    \      21\n```\n\nThe -initial (or -i) switch converts only leading Tabs on a\
    \ line.\n\n```\n$ expand -initial test.txt | wc\n        1       2      15\n```\n\
    \nThe corresponding unexpand command converts multiple spaces back into Tab characters.\
    \ The default is eight spaces to a Tab, but you can use the -tabs=n switch to\
    \ change this. By default, only initial tabs are converted. Use the -all (or -a)\
    \ switch to consider all spaces on a line.\n\nUse expand to remove tabs from a\
    \ file before processing it.\n\n# Temporary Files\n\nTemporary files, files that\
    \ exist only for the duration of a script's execution, are traditionally named\
    \ using the $$ function. This function returns the process ID number of the current\
    \ script. By including this number in the name of the temporary files, it makes\
    \ the name of the file unique for each run of the script.\n\n```\n$ TMP=\"/tmp/reports.$$\"\
    \n$ printf '%s\\n' \"$TMP\"\n/tmp/reports.20629\n$ touch \"$TMP\"\n```\n\nThe\
    \ drawback to this traditional approach lies in the fact that the name of a temporary\
    \ file is predictable. A hostile program can see the process ID of your scripts\
    \ when it runs and use that information to identify which temporary files your\
    \ scripts are using. The temporary file could be deleted or the data replaced\
    \ in order to alter the behavior of your script.\n\nFor better security, or to\
    \ create multiple files with unique names, Linux has the mktemp command. This\
    \ command creates a temporary file and prints the name to standard output so it\
    \ can be stored in a variable. Each time mktemp creates a new file, the file is\
    \ given a unique name. The name is created from a filename template the program\
    \ supplies, which ends in the letter X six times. mktemp replaces the six letters\
    \ with a unique, random code to create a new filename."
  merge: -1
  img_proc: true
- pgno: 203
  md: "```\n$ TMP=`mktemp /tmp/reports.XXXXXX`\n$ printf \"%s\\n\" \"$TMP\"\n/tmp/reports.3LnWVw\n\
    $ ls -1 \"$TMP\"\n-rw---- 1 kburcch kburcch    0 Aug  1 14:34 reports.3LnWVw\n\
    ```\n\nIn this case, the letters XXXXXX are replaced with the code 3LnWVw.\n\n\
    `mktemp` creates temporary directories with the `-d (directories)` switch. You\
    \ can suppress error messages with the `-q (quiet)` switch.\n\n# Lock Files\n\n\
    When many scripts share the same files, there needs to be a way for one script\
    \ to indicate to another that it has finished its work. This typically happens\
    \ when scripts overseen by two different development teams need to share files,\
    \ or when a shared file can be used by only one script at a time.\n\nA simple\
    \ method for synchronizing scripts is the use of lock files. *A lock file* is\
    \ like a flag variable: The existence of the file indicates a certain condition,\
    \ in this case, that the file is being used by another program and should not\
    \ be altered.\n\nMost Linux distributions include a directory called `/var/lock`,\
    \ a standard location to place lock files.\n\nSuppose the invoicing files can\
    \ be accessed by only one script at a time. A lock file called `invoices_lock`\
    \ can be created to ensure only one script has access.\n\n```\ndeclare -r INVOICES_LOCKFILE=\"\
    /var/lock/invoices_lock\"\nwhile test ! -f \"$INVOICES_LOCKFILE\" ; do\n   printf\
    \ \"Waiting for invoices to be printed...\\n\"\n   sleep 10\ndone\ntouch \"$INVOICES_LOCKFILE\"\
    \n```\n\nThis script fragment checks every 10 seconds for the presence of `invoices_lock`.\
    \ When the file disappears, the loop completes and the script creates a new lock\
    \ file and proceeds to do its work. When the work is complete, the script should\
    \ remove the lock file to allow other scripts to proceed.\n\nIf a lock file is\
    \ not removed when one script is finished, it causes the next script to loop indefinitely.\
    \ The `while` loop can be modified to use a timeout so that the script stops with\
    \ an error if the invoice files are not accessible after a certain period of time.\n\
    \n```\ndeclare -r INVOICES_LOCKFILE=\"/var/lock/invoices_lock\"\ndeclare -ir INVOICES_TIMEOUT=1800\
    \    # 30 minutes\nTIME=$(date +%s)\nTIME_STARTED=$TIME\ntime_out=0\nwhile test\
    \ ! -f \"$INVOICES_LOCKFILE\" ; do\n   printf \"Waiting for the invoices to be\
    \ printed...\\n\"\n```"
  merge: -1
  img_proc: true
- pgno: 204
  md: "```\nsleep 10\nTIME='date +%s'\nTIME=TIME-TIME_STARTED\nif [ $TIME -gt $INVOICES_TIMEOUT\
    \ ] ; then\n\tprintf \"Timed out waiting for the invoices to print\\n\"\n\texit\
    \ 1\nfi\ndone\n```\n\nThe `date` command's `$s` code returns the current clock\
    \ time in seconds. When two executions of `date` are subtracted from each other,\
    \ the result is the number of seconds since the first `date` command was executed.\
    \ In this case, the timeout period is 1800 seconds, or 30 minutes.\n\n# ## Named\
    \ Pipes\n\nLock files are convenient when a small number of scripts share the\
    \ same file. When too many scripts are waiting on a lock file, a *race condition*\
    \ occurs: the computer spends a lot of time simply checking for the presence of\
    \ the lock file instead of doing useful work. Fortunately, there are other ways\
    \ to share information.\n\nTwo scripts can share data using a special kind of\
    \ file called a *named pipe*. These pipes (also called FIFOs or queues) are files\
    \ that can be read by one script while being written to by another. The effect\
    \ is similar to the pipe operator (|), which forwards the results of one command\
    \ as the input to another. Unlike a shell pipeline, the scripts using a named\
    \ pipe run independently of one another, sharing only the pipe file between them.\
    \ No lock files are required.\n\nThe `mkfifo` command creates a new named pipe.\n\
    \n```\n$ mkfifo website_orders.fifo\n$ ls -l website_orders.fifo\nprw-rw-r-- 1\
    \ khurcht khurcht 0 May 22 14:14 orders.fifo\n```\n\nThe file type p to the left\
    \ of the `ls` output indicates this is a named pipe. If the `ls` filename typing\
    \ option (-F) is used, the filename is followed by a vertical bar (|) to indicate\
    \ a pipe.\n\nThe named pipe can be read like a regular file. Suppose, for example,\
    \ you want to create a script to log incoming orders from the company Web site,\
    \ as shown in Listing 11.5.\n\n```\nListing 11.5\ndo_web_orders.sh\n#!/bin/bash\n\
    #\n# do_web_orders.sh: read a list of orders and show date read\n\nsleep 10\n\
    time=date +%s\ntime=time-time_started\nif [ time -gt invoices_timeout ] ; then\n\
    \tprint printf \"Timed out waiting for the invoices to print\\n\"\n\texit 1\n\
    fi\ndone\nshopt -s -o unset\n```"
  merge: -1
  img_proc: true
- pgno: 205
  md: "```\n``` \ndeclare -rx SCRIPT=$ {0##*/}\ndeclare -rx QUEUE= \t “website_orders.fil\
    \ o”\ndeclare DATE\ndeclare ORDER\n\nif test ! -r“$QUEUE” ; then\n\t printf “%s\\\
    n” “$SCRIPT: $LINENO: the named pipe is missing or \\”\n\t not readable” >&2\n\
    \t exit 192\nfi\n\n{\n\t while read ORDER ; do\n\t\t DATE=date’\n\t\t printf “%s\
    \ : %s\\n” “$DATE” “$ORDER”\n\tdone\n} < $QUEUE\n\nprintf “Program complete”\n\
    exit 0\n```\n```\n\nIn this example, the contents of the pipe are read one line\
    \ at a time just as if it was a regular file.\n\nWhen a script reads from a pipe\
    \ and there’s no data, it sleeps (or blocks) until more data becomes available.\
    \ If the program writing to the pipe completes, the script reading the pipe sees\
    \ this as the end of the file. The while loop will complete and the script will\
    \ continue after the loop.\n\nTo send orders through the pipe, they must be printed\
    \ or otherwise redirected to the pipe. To simulate a series of orders, write the\
    \ orders file to the named pipe using the cat command. Even though the cat command\
    \ is running in the background, it continues writing orders to the named pipe\
    \ until all the lines have been read by the script.\n\n```\n``` \n$ cat orders.txt\
    \ > website_orders.fil o &\n$ sh do_web_orders.sh\nTue May 22 14:23:00 EDT 2001:\
