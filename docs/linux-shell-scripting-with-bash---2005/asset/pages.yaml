- pgno: 165
  md: "![](img/7da864b222941ec315ee1c456ff472dd_165_0.png)\n\n# # Parameters and Subshells\n\
    \n**T**O SERVE AS A FLEXIBLE TOOL, a script has to be qualified when it is called,\
    \ given additional information about how and where to perform its task. Like commands,\
    \ a script is qualified using parameters. Switches and arguments make a script\
    \ reusable, which in turn reduces costs and time.\n\n# ## Positional Parameters\n\
    \nThere are three methods available to extend Linux scripts using parameters.\
    \ The first method uses *positional parameters*. A script can refer to the parameters\
    \ on the command line by the position (or order) in which they appear. Because\
    \ the other two methods rely on positional parameters, they are discussed first.\n\
    \nThe Bash variable $0 is the pathname of the script. It is not necessarily the\
    \ full path-name, but rather the path used to specify the script when it was executed.\n\
    \n```\n$ printf \"%s\\n\" \"$0\" `/bin/bash`\n\n```\n\nIn this case, the Bash\
    \ session was started with the command `/bin/bash`.\n\nWhen combined with the\
    \ `basename` command, the name of the script is removed from the rest of the pathname.\n\
    \n```\n$ declare -rx SCRIPT=`basename $0` \n$ printf \"%s\\n\" \"$SCRIPT\" \n\
    bash\n\n```\n\nA slightly faster version uses Bash’s substring features and avoids\
    \ running an outside program.\n\n```\n$ declare -rx SCRIPT=${0%%*/} \n$ printf\
    \ \"%s\\n\" \"$SCRIPT\" \nbash\n\n```"
  merge: -1
  img_proc: true
- pgno: 166
  md: 'By finding the name of the script from $0, there is no danger that the wrong
    name will be printed after the script has been copied or renamed. SCRIPT is always
    the correct name of the script.


    The variable $# contains the number of parameters to a script or a shell session.
    If there are no parameters, $# is zero. The number doesn’t include the script
    name in $0.


    ```

    $ printf "%d\n" $#

    0

    ```


    The first nine parameters are placed in the variables $1 through $9. (Parameters
    beyond nine can be accessed if curly braces surround the number.) When the nounset
    shell option is used, accessing an undefined parameter results in an error, just
    as if it were an undeclared variable name.


    ```

    $ printf "%s\n" $9

    bash: $9: unbound variable

    ```


    The variable ?* (or $@) returns a complete list of all the parameters as a single
    string.


    When using positional parameters, Bash doesn’t differentiate between switches
    and arguments. Each item on the command line is a separate parameter to the script.
    Consider the following script, shown in Listing 9.1.


    # Listing 9.1 params.sh


    ```

    #!/bin/bash


    # # params.sh: a positional parameter demonstration


    printf "There are %d parameter(s)\n" "$#"

    printf "The complete list is %s\n" "$@"

    printf "The first parameter is %s\n" "$1"

    printf "The second parameter is %s\n" "$2"

    ```


    When the script runs using the parameters -c and t2341, $1 refers to -c and $2
    refers to t2341.


    ```

    $ bash params.sh -c t2341

    There are 2 parameter(s)

    The complete list is -c t2341

    The first parameter is -c

    The second parameter is t2341

    ```


    Although both $@ and $* refer to all the parameters, they differ when they are
    enclosed in double quotes. $* parameters are separated by the first character
    of the IFS variable, or by spaces if IFS is empty, or without anything when IFS
    is unset. $* treats the set of parameters as a single group.


    $@, on the other hand, always separates the parameters by spaces and treats the
    parameters as individual items, even when they are enclosed in double quotes.
    $@ is often used to transfer the entire set of switches to another command (for
    example, ls $@).'
  merge: -1
  img_proc: true
- pgno: 167
  md: "Although positional parameters are a straightforward way to view switches and\
    \ arguments, they do not “walk through” the list. There is a built-in `shift`\
    \ command that discards the parameter in $1 and moves the remaining parameters\
    \ down one number to take its place. Using `shift`, you can check each parameter\
    \ in turn as if it were the first parameter.\n\nListing 9.2 shows a complete example,\
    \ using `shift`.\n\n# Listing 9.2 param2.sh\n\n```\n#!/bin/bash\n#\n# param2.sh\n\
    #\n# This script expects the switch -c and a company name. --help (-h)\n# is also\
    \ allowed.\n\nshopt -s -o nounset\ndeclare -rx SCRIPT=$ {0##*/}\n\n# Make sure\
    \ there is at least one parameter or accessing $1\n# later will be an error.\n\
    \nif [ $# -eq 0 ]; then\n    printf \"%s\\n\" \"Type --help for help.\"\n    exit\
    \ 192\nfi\n\n# Process the parameters\n\nwhile [ $# -gt 0 ]; do\n    case \"$1\"\
    \ in\n        -h | --help) # Show help\n            printf \"%s\\n\" \"Usage:\
    \ $SCRIPT [-h] [--help] -c company\\r\"\n            exit 0\n        -c) shift\n\
    \            if [ $# -eq 0 ]; then\n                printf \"${SCRIPT}:${LINENO}:\
    \ %s\\n\" \"company for -c is missing\" >&2\n                exit 192\n      \
    \      fi\n            COMPANY=\"$1\"\n        ;;\n        *) printf \"${SCRIPT}:${LINENO}:\
    \ %s\\n\" \"switch $1 not supported\" >&2\n        exit 192\n```"
  merge: -1
  img_proc: true
- pgno: 168
  md: "# **Listing 9.2 \t Continued**\n\n```\n`i; \n\\`* ) printf \\\"$SCRIPT:$LINENO:\
    \ $@\\n\\\" \\\"extra argument or missing switch\\\" >&2 \n\t\t\t\t\t\t\texit\
    \ 192 \n\t\t\t\t\t\ti; \n\t\t\t\t\tesac \n\t\t\t\tshift \n\tdone \nif [ -z \\\"\
    $COMPANY\\\" ] ; then \n\tprintf \\\"$@\\n\\\" \\\"company name missing\\\" >&2\
    \ \n\texit 192 \nfi \n# <-- begin work here \nexit 0`\n```\n\nA final parameter-related\
    \ switch is $\\_ (dollar underscore).This switch has two purposes. First, it represents\
    \ the pathname to the shell or shell script when the shell (or shell script) is\
    \ first started.Second, after each command is executed, the command is placed\
    \ in the environment as a variable containing the pathname of the command.\n\n\
    ```\n$ /bin/date\nFri Jun 29 14:39:58 EDT 2001\n$ printf \"$@\\n\" \"$\\_\"\n\
    /bin/date\n$ date\nFri Jun 29 14:40:04 EDT 2001\n$ printf \"$@\\n\" \"$\\_\"\n\
    date\n```\n\nYou can use $\\_ to repeat the last argument.\n\n# ### The **getopts**\
    \ Command\n\nThere are two limitations to the positional parameter approach. First,\
    \ it requires the script writer to test for errors and create the corresponding\
    \ messages. Second, the **shift** command destroys all the parameters. If you\
    \ want to access them later, you can't.\n\nTo deal with these issues, Bash includes\
    \ a built-in **getopts** (*get options*) command that extracts and checks switches\
    \ without disturbing the positional parameter variables. Unexpected switches,\
    \ or switches that are missing arguments, are recognized and reported as errors.\n\
    \nUsing **getopts** requires some preparation by the script writer. First, you\
    \ must define a string containing a list of expected switch letters. By convention,\
    \ this variable is called **OPTSTRING**. If any switch requires an argument, add\
    \ a colon after the switch character."
  merge: -1
  img_proc: true
- pgno: 169
  md: "For example, if the param2.sh script expects -n (help) and -c (company ID)\
    \ with a company ID argument, the OPTSTRING would be hc::.\n\nThere is a second\
    \ required parameter after the list of options: The name of a shell variable into\
    \ which to record each option encountered.\n\nEach time the getopts command runs,\
    \ the next switch on the command line is examined and the name of the switch is\
    \ saved in the variable SWITCH. The position of the next parameter to be examined\
    \ is in a variable called OPTIND. If it doesn't exist, OPTIND automatically set\
    \ to 1 before the first script parameter is checked. If there is any argument\
    \ to the script, it is saved in a variable called OPTARG. Listing 9.3 shows a\
    \ short script that tests the first parameter of the script.\n\n# Listing 9.3\
    \ getopt.sh\n\n```\n```\n#!/bin/bash\n#\n# getopt.sh\n\n\n\ndeclare SWITCH\ngetopts\
    \ \"hc:\" SWITCH\nprintf \"The first switch is SWITCH=%s OPTARG=%s OPTIND=%s\\\
    n\" \\\\\n    \"$SWITCH\" \"$OPTARG\" \"$OPTIND\"\n```\n```\n\nIn this short script,\
    \ unknown switches assign a question mark (? ) to the SWITCH variable; an error\
    \ message is displayed.\n\n```\n```\n$ bash getopt.sh -h\nThe first switch is\
    \ SWITCH=h OPTARG= OPTIND=2\n$ bash getopt.sh -c a4327\nThe first switch is SWITCH=c\
    \ OPTARG=a4327 OPTIND=3\n$ bash getopt.sh -a\nt.sh: illegal option -- a\nThe first\
    \ switch is SWITCH=? OPTARG= OPTIND=1\n```\n```\n\nThe error message can be hidden\
    \ using a colon as the first character in the switch list. By using :hc:: the\
    \ error on the bad switch -a disappears, but the bad option is saved in OPTARG\
    \ to be used in a custom error message.\n\n```\n```\n$ bash getopt.sh -a\nThe\
    \ first switch is SWITCH=? OPTARG=a OPTIND=1\n```\n```\n\nYou can also hide errors\
    \ by creating an OPTERR variable with the value of 0. This overrides the contents\
    \ of the legal switches string.\n\nSwitches are usually checked with a while and\
    \ case statement. See Listing 9.4.\n\n# Listing 9.4 getopt_demo.sh\n\n```\n```\n\
    # getopt_demo.sh\n#\n```\n```"
