- pgno: 271
  md: "Instead of running a second script, you can insert a second script into the\
    \ first. The built-in source command (often abbreviated with a period .) copies\
    \ the second script into the first script as if the programmer had typed the lines.\
    \ Because the second script is treated as part of the first script, no declarations\
    \ in the second script are lost when the second script finishes execution. It\
    \ acts as if it were a single combined script. For example, consider the two scripts\
    \ shown in Listing 14.1.\n\n# Listing 14.1 source1.sh\n\n```\n#!/bin/bash\n#\n\
    # source1.sh: including source fragments\n#\n# Source command example\nshopt -s\
    \ -o nounset\n\ndeclare -rx SCRIPT=$${0##*/}\ndeclare -r source2=\"source2.sh\"\
    \n\nif test ! -r \"${source2}\" ; then\n  printf \"SCRIPT: the command ${source2}\
    \ is not available\\n\" >&2\n  exit 1\nfi\n\nsource ${source2}\nprintf \"The variable\
    \ YEAR is %s\\n\" \"$YEAR\"\nexit 0\n\n# source2.sh: this will be inserted into\
    \ source1.sh\n\ndeclare -r YEAR=‘date ‘+%Y’\n```\n\nWhen the script runs, the\
    \ content of source2.sh is inserted into the original script at the point of the\
    \ source command. When the variable YEAR is declared, it is effectively being\
    \ declared in the original script.\n\n```\n$ bash source1.sh\nThe variable YEAR\
    \ is 2003\n```\n\nThe variable YEAR exists at the point of the printf command;\
    \ there is no error.\n\nNotice that the sourced script is a fragment and not a\
    \ standalone script; it doesn’t contain an exit command or a #! line.\n\nThe source\
    \ command can be used to define commonly declared items shared among several scripts.\
    \ This saves a programmer from having to type the same definitions over and over\
    \ again into several different scripts. Placing the declared items in a single\
    \ place also makes scripts easier to maintain. See Listing 14.2."
  merge: -1
  img_proc: true
- pgno: 272
  md: "# Listing 14.2\tcommon.sh\n\n```\n```\n# common.sh\n\n# This script contains\
    \ fragment global definitions and should be executed\n# with the source command\
    \ ( . ).\n\n# Common constants\n\ndeclare -rx SCRIPT=$0(#*/)              \ndeclare\
    \ -r ORDERS_DIR=\"/usr/local/orders\"\ndeclare -r ARCHIVE_DIR=\"$ORDERS_DIR/archive\"\
    \ndeclare -r START_DATE=\"date\"\n```\n```\n\nParameters in script fragments refer\
    \ to the parameters included in the source command, not the original script. If\
    \ there are no parameters included with source, the original script parameters\
    \ are used.\n\nYou can end source script fragments prematurely with the return\
    \ command. This command has the same format as the exit command. If you use exit,\
    \ the entire script stops.\n\nBecause source script fragments aren't executed\
    \ like a program, they do not need to have execute permissions to run; they simply\
    \ need read permissions so that Bash can load them.\n\n# Switching Scripts with\
    \ exec\n\nA third way to run a script is with the built-in exec command. When\
    \ running another script or inserting a script fragment with source, control always\
    \ resumes at the next line in the original script. The exec command instead provides\
    \ an unconditional change to a new script. Bash discards the original script entirely,\
    \ never to return. See Listings 14.3 and 14.4.\n\n# Listing 14.3\texec1.sh\n\n\
    ```\n```\n#!/bin/bash\n\n# exec1.sh\n#\n# Source command example\nshopt -s -o\
    \ nounset\n\ndeclare -rx SCRIPT=$0(#*/)\ndeclare -r exec2=\"./exec2.sh\"\nif test\
    \ ! -x \"$exec2\" ; then\n\tprintf \"\\$SCRIPT:$LINENO: the script $exec2 is not\
    \ available\\n\" >&2\n\texit 192\n```\n```"
