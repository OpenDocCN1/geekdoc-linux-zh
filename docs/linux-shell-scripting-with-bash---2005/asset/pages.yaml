- pgno: 280
  md: "# # Shell Functions\n\nFunctions are a way of embedding small subscripts into\
    \ a Bash script without saving them in a separate file. Because they are embedded\
    \ in a script, they do not have to be loaded in order to be used. This, in turn,\
    \ makes them run faster than separate scripts. Like separate scripts, functions\
    \ can be used to break up a complex script into separate, named, tasks to improve\
    \ readability.\n\nShell functions differ from functions in other programming languages\
    \ in that they return a status code instead of a return value. Without a return\
    \ value, they cannot be used in expressions.\n\nLike variables, functions must\
    \ be declared before they can be used. Instead of the *declare command*, functions\
    \ are declared using the *function command*. Each function has a name and the\
    \ statements composing the function are enclosed in curly brackets. See Listing\
    \ 14.10.\n\n# Listing 14.10 function.sh\n\n```\n```bash\n#!/bin/bash\n#\n# function.sh\
    \ - A simple function example\n\ndeclare -rx SCRIPT=${0##*/}\ndeclare -rx TMP=\"\
    /tmp/temp.$$\"\ndeclare -rx TRASH_DIR=\"$HOME/.trash\"\n\n# $TRASH_TMP\n#\n# Move\
    \ the TMP file to the trash directory\n\nfunction trash_tmp {\n\n  if test ! -d\
    \ \"$TRASH_DIR\" ; then\n    printf \"%s\\n\" \"$SCRIPT:$FUNCNAME:$LINENO: trash\
    \ directory \\\\\n$TRASH_DIR is missing\" >&2\n    exit 1\n  fi\n  if test -f\
    \ \"$TMP\" ; then\n    mv $TMP \"$TRASH_DIR/.\"/\n  fi\n}\n\nreadonly -f trash_tmp\n\
    declare -t trash_tmp\n\nprintf \"This is a function test\\n\" > $TMP\ntrash_tmp\n\
    \nexit 0\n```\n```"
