- pgno: 213
  md: 'until all the lines have been written out. If one file is shorter than the
    other, blank lines are used for the missing lines.


    The `–delimiters (–d) switch is a list of one or more delimiters to use in place
    of a Tab. The paste command cycles through the list if it needs more delimiters
    than are provided in the list, as shown in Listing 11.9.


    # Listing 11.9 two\_columns.sh


    ```

    #!/bin/bash

    #

    # two\_columns.sh


    shopt -s -O nounset


    declare -r ORDERS="orders.txt"

    declare -r COLUMN1="column1.txt"

    declare -r COLUMN2="column2.txt"

    declare -i LINES


    LINES=`wc -l < "$ORDERS"`

    LINES=LINES/2


    head -SLINES < "$ORDERS" > "$COLUMN1"


    LINES=LINES+1

    tail +$LINES < "$ORDERS" > "$COLUMN2"


    paste -delimiters="|" "$COLUMN1" "$COLUMN2"


    rm $COLUMN1

    rm $COLUMN2

    exit 0

    ```


    Running this script, the contents of orders.txt are separated into two columns,
    delineated by a vertical bar.


    ```

    $ sh two_columns.sh


    Birchwood Cima Hutch,475.99,1,756|Bar Stool,45.99,1,756

