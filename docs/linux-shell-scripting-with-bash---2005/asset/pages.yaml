- pgno: 107
  md: '# Expressions


    An expression is a formula that calculates a value. Bash has several built-in
    commands and functions to compute expressions, and not all have the same syntax
    or features. In some cases there is more than one way to calculate the same expression.
    There are also many specialized features for use in rare cases. As a result, few
    Bash programmers have all the nuances memorized.


    During one of my many conversations with the late professor and author F. Ray
    Skilton, we were discussing the use of pull-down menus as a tool not for making
    selections but as a memory aid for commands. He turned away from his Atari computer
    and asked me, “Have you learned enough computer languages to start forgetting
    the syntax of commands you haven’t used in while?” “Not really,” I said. He chuckled.
    “Don’t worry—you will.”


    # Expansions


    Expressions in Bash include more than arithmetic. Because variables are strings,
    many expressions involve replacing some kind of shorthand notation with the full
    value the string represents. This process of string substitution is called expansion
    because the string usually expands, becoming longer, after the substitution is
    performed.


    Pathname pattern matching is an example of a string expansion. Asterisks, question
    marks, and other characters are replaced by the filenames they represent, creating
    a longer, complete string value.


    Bash divides expansions into six separate categories. The shell always evaluates
    them in the following order:


    +   * Filename brace expansion

    +   * Pathname tilde expansion

    +   * Dollar, variable, and arithmetic expressions

    +   * Command substitution (performed left to right)'
  merge: -1
  img_proc: true
- pgno: 108
  md: "+   - Word splitting (that is, argument separation by whitespace or the contents\
    \ of the `IFS` variable)\n+   - Pathname expansion (that is, pathname pattern\
    \ matching)\n\nAll these expansions are discussed in detail later in this section.\n\
    \nThe order is important and can cause subtle problems in scripts. Suppose you\
    \ assign a path with a tilde in it to a variable.\n\n```\n$ ls -d ~/tmp\n/home/kyburg/ch/tmp\n\
    $ TMP=\"~/tmp\"\n$ ls $TMP\n~/tmp not found\n```\n\nThe `ls` command cannot find\
    \ the directory `~/tmp`, despite the fact that it exists and `ls` can find it\
    \ when typed directly into the command. This problem is caused by the order of\
    \ expansion. Because variable expansion happens after tilde expansion, Bash first\
    \ tries to replace any tildes. Finding only a variable, it substitutes the value\
    \ of `TMP`. Because tilde expansion has already finished, the tilde is left in\
    \ the command and `ls` looks for a `tmp` directory inside another directory called\
    \ `~`. This wouldn't have happened if the order of expansion could be reversed.\n\
    \nAs a result, tildes should never be used in paths assigned to variables. Use\
    \ the `HOME` variable instead.\n\nOther types of expansions not listed here are\
    \ handled by commands. Because these are commands that must be executed, they\
    \ only run after Bash completes its six expansions. There are two common built-in\
    \ commands that interpret expressions.\n\nThe `test` command checks a wide variety\
    \ of conditions and indicates whether the condition is true or not. `test` can\
    \ compare files, strings, or numbers. Don't confuse it with the Linux `test` command.\n\
    \nThe `let` command computes an expression and assigns the results to a variable\
    \ in a single command.\n\nTo test the results, you need a command that checks\
    \ the result of a test and takes a course of action. The `if` command is a good\
    \ choice.\n\n# ## The Basic `if` Command\n\nThe built-in `if` command runs a command\
    \ and checks the results. If the command was successful, it executes another set\
    \ of commands. The only command normally used with the `if` command is `test`.\
    \ The other uses of `if` are described in more detail in Chapter 7, \"Compound\
    \ Commands.\"\n\nThe syntax for the basic `if` command is as follows\n\n```\n\
    if test arguments; then\n    statements to run\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 109
  md: "The keyword then is treated as a separate command, requiring a semicolon to\
    \ separate it from the if command. The keyword fi appears after the final command\
    \ to be executed inside the if.\n\nFor example, the test -f command checks for\
    \ the existence of a file.\n\n```\nif test -f ./report.out ; then\n\n    printf\
    \ \"The report file ./report.out exists!\\n\"\nfi\n```\n\nThe message \"The report\
    \ file ./report.out exists!\" is printed only if the file exists. If the file\
    \ does not exist, the printf command is skipped and execution proceeds after the\
    \ fi.\n\n# # File Expressions\n\nThe built-in test command contains a wide variety\
    \ of tests for files. It can test the type of file, the accessibility of the file,\
    \ compare the ages of files or other file attributes. The following is a complete\
    \ list of Bash file tests:\n\n+   - -b file—True if the file is a block device\
    \ file\n+   - -c file—True if the file is a character device file\n+   - -d file—True\
    \ if the file is a directory\n+   - -e file—True if the file exists\n+   - -f\
    \ file—True if the file exists and is a regular file\n+   - -g file—True if the\
    \ file has the set-group-id permission set\n+   - -h file (or -1 file)—True if\
    \ the file is a symbolic link\n+   - -k file—True if the file has the sticky permission\
    \ bit set\n+   - -p file—True if the file is a pipe\n+   - -r file—True if the\
    \ file is readable (by your script)\n+   - -s file—True if the file exists and\
    \ is not empty\n+   - -S file—True if the file is a socket\n+   - -t fd—True if\
    \ the file descriptor is opened on a terminal\n+   - -u file—True if the file\
    \ has the set-user-id permission set\n+   - -w file—True if the file is writable\
    \ (by your script)\n+   - -x file—True if the file is executable (by your script)\n\
    +   - -O file—True if the file is (effectively) owned by you\n+   - -G file—True\
    \ if the file is (effectively) owned by your group\n+   - -N file—True if the\
    \ file has new content (since the last time it was read)\n+   - f1 -nt f2—(never\
    \ than) True if file f1 is newer than f2"
  merge: -1
  img_proc: true
- pgno: 110
  md: "+   • f1 -ot f2—(older than) True if file f1 is older than f2\n+   • f1 -ef\
    \ f2—(equivalent file) True if file f1 is a hard link to f2\n\nFile testing is\
    \ commonly used in the sanity checks at the beginning of a script. They can be\
    \ used to check that all files are present and readable (and writable, if necessary).\
    \ All commands must be executable (see Listing 6.1).\n\n# Listing 6.1 archive.bash\n\
    \n```\n#!/bin/bash\n#\n# archive.bash - Archive old order files\n#\n# Ken O. Burtch\n\
    # CVS: $Header$\nshopt -s -o nounset\n# Global Declarations\ndeclare -rx SCRIPT=${0##*/}\
    \           # SCRIPT is the name of this script\ndeclare -rx who=\"/usr/bin/who\"\
    \       # the who command - man 1 who\ndeclare -rx TMP=\"/tmp/temp.$$\"      \
    \ # TMP is a temporary file\n# Sanity Checks\nif test ! -x \"$who\" ; then\n \
    \       printf \"${SCRIPT}:$LINENO: the command $who is not available - aborting\"\
    \ >&2\n        exit 192\nfi\nif test -f \"$TMP\" ; then\n        if test ! -w\
    \ \"$TMP\" ; then\n                printf \"${SCRIPT}:$LINENO: the temp file $TMP\
    \ exists and cannot \"\\\n\"be overwritten - aborting\" >&2\n                exit\
    \ 192\n        fi\nfi\n```\n\nThis script fragment ensures that the who command\
    \ is executable and that the temp file named in TMP either doesn’t exist or exists\
    \ and can be overwritten.\n\n# Multiple Tests\n\nSingle tests can be combined\
    \ together with -a (and) and -o (or) switches. The temp file test in the previous\
    \ section can be rewritten as:"
  merge: -1
  img_proc: true
- pgno: 111
  md: '```

    if test -f "$TMP" -a ! -w "$TMP" ; then

    printf "${SCRIPT}:${LINE}: the temp file $TMP exists and cannot\" "be overwritten
    — aborting" >&2

    exit 192

    fi

    ```


    This is not exactly the same as


    ```

    if test -f "$TMP" && test ! -w "$TMP" ; then

    printf "${SCRIPT}:${LINE}: the temp file $TMP exists and cannot\" "be overwritten
    — aborting" >&2

    exit 192

    fi

    ```


    The version using && executes the test command twice and can run slower than the
    version using the -a switch, so the -a switch is preferred over using && in an
    if expression.


    Parentheses can also be used as long as they are escaped with backslashes. Parentheses
    have special meaning to the shell. In certain cases, they are required.


    One situation that tends to confuse shell programmers is when mixing the not operator
    with -a or -o switch. In most computer languages, not takes precedence as a unary
    operator and executes first. In Bash, -a and -o take precedence over the not operator,
    causing the following test to always be false:


    ```

    if test ! -f "$TMP" -o -f "$TMP" ; then

    ```


    Bash interprets this command as “if the file neither exists nor exists.” This
    odd behavior is in accordance with the POSIX standard. To get the expected result,
    you must use parentheses.


    ```

    if test \( ! -f "$TMP" \) -o -f "$TMP" ; then

    ```


    Square brackets are an alternative form of the test command. Using square brackets
    makes your if commands easier to read.


    ```

    if [ -f "$TMP" -a ! -w "$TMP" ] ; then

    printf "${SCRIPT}:${LINE}: the temp file $TMP exists and cannot\" "be overwritten
    — aborting" >&2

    exit 192

    fi

    ```


    The square brackets version is in all ways identical to the normal test command.
    The Korn shell introduced a variation of the test command that used double square
    brackets. This variation is supported by Bash for compatibility. The Korn shell
    test will not perform word splitting or pathname expansion between the brackets,
    making double quotes unnecessary around variable substitutions.


    ```

    if [ [ -f $FILE ] ] ; then

    printf "%s\n" "The file exists"

    fi

    ```'
  merge: -1
  img_proc: true
- pgno: 112
  md: "It also has enhanced pattern-matching features, but lacks many of the features\
    \ of Bash's `test` command. Unless you are porting Korn shell scripts to Bash,\
    \ you are well advised not to use the Korn shell `test` command.\n\n# ## Strings\n\
    \nThe `test` command can compare a pair of strings.\n\n+   - `-z s`—*(zero length)*\
    \ True if the string is empty\n+   - `-n s` (or just *s*)—*(not null)* True if\
    \ the string is not empty\n+   - *s1* = *s2*—True if string *s1* is equal to *s2*\n\
    +   - *s1* != *s2*—True if string *s1* is not equal to *s2*\n+   - *s1* < *s2*—True\
    \ if string *s1* is less than *s2*\n+   - *s1* > *s2*—True if string *s1* is greater\
    \ than *s2*\n\n```\n```bash\nDAY=`date '+%a'`\nif [ \"$DAY\" = \"Mon\" ] ; then\n\
    \    printf \"The weekend is over...get to work!\\n\"\nfi\n```\n```\n\nThe `-z`\
    \ (*zero length*) and `-n` (*not zero length*) switches are short forms of `=`\
    \ and `!=`, respectively. Notice that there are no greater than or equal to, or\
    \ less than or equal to, operators. You can simulate these operators by combining\
    \ the two tests with the `-a` switch.\n\nIf you are used to other computer languages,\
    \ remember that the quotation marks used in the `test` command are not being used\
    \ for string delineation but for special character handling.\n\nBecause the less\
    \ than and greater than operators are also used by the shell for redirection,\
    \ the operator must be quoted to prevent Bash from interpreting them instead of\
    \ passing them on to the `test` command.\n\n```\n```bash\nCOMPANY=\"Athabasca\"\
    \nif [ \"$COMPANY\" \\< \"M\" ] ; then\n    printf \"The company name begins with\
    \ a letter less than M\\n\"\nfi\n```\n```\n\nA common use for string comparisons\
    \ is the testing of shell flag variables. *Flags* are variables used to indicate\
    \ whether a particular condition is true. They provide a way to remember previous\
    \ tests.\n\nAny pair of values can be used to represent the flag’s condition,\
    \ such as true and false or yes and no. However, this can lead to ambiguous conditions\
    \ when the flag contains an unexpected string such as \"NO\". Traditionally, if\
    \ the variable contains anything except a null string, the condition is considered\
    \ true."
  merge: -1
  img_proc: true
- pgno: 113
  md: "```\n```\nWEEKEND=\nDAY=\"date \\'+%a'\nif [ \"$DAY\" = \"Sat\" -o \"$DAY\"\
    \ = \"Sun\" ] ; then\n    WEEKEND=1\nfi\n\nTo determine whether it is the weekend,\
    \ use -n (not null) and -z (null).\nif [ -n \"$WEEKEND\" ] ; then\n    printf\
    \ \"\"\"The weekend is here\"\"\nelse\n    printf \"\"It isn\\t the weekend\"\"\
    \n```\n\n# Arithmetic Expressions\n\nThe built-in `let` command performs math\
    \ calculations. `let` expects a string containing a variable, an equals sign,\
    \ and an expression to calculate. The result is assigned to the variable.\n\n\
    ```\n```\n$ let \"SUM=5+5\"\n$ printf %d \"$SUM\"\n10\n```\n```\n\nYou don't need\
    \ to use `$` to expand a variable name in the string. `let` understands that any\
    \ variable appearing on the right side of the equals sign needs to have its value\
    \ substituted into the expression.\n\n```\n```\n$ let \"SUM=SUM+5\"\n$ printf\
    \ %d \"$SUM\"\n15\n$ let \"SUM=SUM-5\"\n$ printf %d \"$SUM\"\n20\n```\n```\n\n\
    The optional dollar sign is a special feature of the `let` command and does not\
    \ apply to other commands.\n\nIf a variable is declared as an integer with the\
    \ `-i` switch, the `let` command is optional.\n\n```\n```\n$ SUM=SUM+5\n$ printf\
    \ %d\n$ $SUM\n25\n```\n```\n\nIf `SUM` was a string variable, it would be assigned\
    \ the string value `\"SUM+5\"`:\n\n```\n```\n$ unset SUM\n$ declare SUM=0\n$ SUM=SUM+5\n\
    $ printf %s\n$ $SUM\nSUM=5\n```\n```"
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Any special characters appearing in the `let` expression have to be quoted
    to prevent Bash from expanding them.


    The `let` command provides the four basic math operators, plus a remainder operator.
    Only integer expressions are allowed (no decimal points).


    ```

    $ let "RESULT=5 + 2"

    $ printf "5 plus 2 is %d\n" "$RESULT"

    5 plus 2 is 7

    ```


    ```

    $ let "RESULT=5 - 2"

    $ printf "5 minus 2 is %d\n" "$RESULT"

    5 minus 2 is 3

    ```


    ```

    $ let "RESULT=5 * 2"

    $ printf "5 times 2 is %d\n" "$RESULT"

    5 times 2 is 10

    ```


    ```

    $ let "RESULT=5 / 2"

    $ printf "5 divided by 2 is %d\n" "$RESULT"

    5 divided by 2 is 2

    ```


    ```

    $ let "RESULT=5 % 2"

    $ printf "remainder of 5 divided by 2 is %d\n" "$RESULT"

    remainder of 5 divided by 2 is 1

    ```


    Here are the arithmetic operators in order of precedence. Many of these operators
    will be familiar to C programmers:


    +   - `-,+`—Unary minus and plus

    +   - `!`—Logical and bitwise negation (disable shell history to use `!`)

    +   - `*, /, %`— Multiplication, division, and remainder

    +   - `+, -`— Addition and subtraction

    +   - `<<, >>`— Left and right bitwise shifts

    +   - `<=, >=, <, >`— Comparison

    +   - `==, !=`— Equality and inequality

    +   - `&`— Bitwise AND

    +   - `^`— Bitwise XOR

    +   - `|`— Bitwise OR

    +   - `&&`— Logical AND

    +   - `||`— Logical OR

    +   - `expr ? expr :`— Conditional expression

    +   - `=, *=, /=, %=, +=, -=, <<=, >>=, &=, ^=, |=`— Self-referential operations'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'For example, to round to the nearest 10, do this:


    ```

    ```

    $ declare -i COST=5234

    $ COST=$(COST+5)/10*10

    $ printf ''%d\n'' $COST

    5230

    ```

    ```


    The parentheses must be escaped to prevent the shell from treating them as a reference
    to a subshell.


    The let command will also handle octal and hexadecimal values.


    ```

    ```

    $ declare -i OCTAL=0

    $ let "OCTAL=0775"

    $ printf ''%d\n'' "$OCTAL"

    509

    ```

    ```


    The operations are described in the next section.


    # ## Logical Expressions


    In let, true is represented by the value of 1, and false by 0. Any value other
    than 1 or 0 is treated as true, but the logical operators themselves only return
    1 or 0.


    Remember that logical truth (a value greater than zero) is not the same as the
    success of a command (a status code of zero). In this respect, test and let are
    opposites of each other.


    To use logical negation at the shell prompt, you must disable the shell history
    option or Bash will interpret the ! as a history look-up request.


    ```

    ```

    $ let "RESULT=!0"

    $ printf "logical negation of 0 is %d\n" "$RESULT"

    logical negation of 0 is 1

    ```

    ```


    ```

    ```

    $ let "RESULT=!1"

    $ printf "logical negation of 1 is %d\n" "$RESULT"

    logical negation of 1 is 0

    ```

    ```


    ```

    ```

    $ let "RESULT=1 && 0"

    $ printf "logical and of 1 with 0 is %d\n" "$RESULT"

    logical and of 1 with 0 is 0

    ```

    ```


    ```

    ```

    $ let "RESULT=1 || 0"

    $ printf "logical or of 1 with 0 is %d\n" "$RESULT"

    logical or of 1 with 0 is 1

    ```

    ```


    There is no logical exclusive-or operator.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# ## Relational Operations


    Unlike string comparisons, `let` provides a full complement of numeric comparisons.
    These are of limited value because most of comparisons are tested with the `test`
    command in the `if` command, resulting in two sets of tests. In logical expressions,
    0 is a failure.


    ```

    $ let "$RESULT=1 > 0"

    $ printf "1 greater than 0 is %d\n" "$RESULT"

    1 greater than 0 is 1


    $ let "$RESULT=1 >= 0"

    $ printf "1 greater than or equal to 0 is %d\n" "$RESULT"

    1 greater than or equal to 0 is 1


    $ let "$RESULT=1 < 0"

    $ printf "1 less than 0 is %d\n" "$RESULT"

    1 less than 0 is 0


    $ let "$RESULT=1 <= 0"

    $ printf "1 less than or equal to 0 is %d\n" "$RESULT"

    1 less than or equal to 0 is 0


    $ let "$RESULT=1 == 0"

