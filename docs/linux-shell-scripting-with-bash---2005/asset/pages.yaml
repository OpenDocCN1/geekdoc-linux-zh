- pgno: 344
  md: '+   * `LC_MESSAGES`—The formatting of diagnostic messages and user dialogue

    +   * `LC_TIME`—The local month spellings and other aspects of date formatting


    Each of these variables contains a locale category name to use. The categories
    are stored in a locale database located in `/usr/lib/locale`. The database is
    updated with the Linux `localedef` command.


    The `locale` command displays the current locale settings. `en_US` is the category
    for United States English, `en_CA` is Canadian English, `fr_CA` is Canadian French,
    and so forth.


    ```

    ```

    $ locale

    LANG=en_US

    LC_CTYPE="en_US"

    LC_NUMERIC="en_US"

    LC_TIME="en_US"

    LC_COLLATE="en_US"

    LC_MONETARY="en_US"

    LC_MESSAGES="en_US"

    LC_PAPER="en_US"

    LC_NAME="en_US"

    LC_ADDRESS="en_US"

    LC_TELEPHONE="en_US"

    LC_MEASUREMENT="en_US"

    LC_IDENTIFICATION="en_US"

    LC_ALL=

    ```

    ```


    `locale -a` (`all`) displays a list of all locale categories. The `-m` (`map`)
    switch displays a list of all character mappings.


    Locales are usually selected by the user during the Linux installation process.
    To change the locale, assign new values to an `LC` variable.


    ```

    ```

    $ LC_NUMERIC=fr_CA # use French Canadian number conventions

    ```

    ```


    Certain Bash and Linux commands are affected by the settings. For example, dollar
    double quote substitution converts a string to the preferred character set for
    the current locale. The value of `LC_COLLATE` affects the order in which pathname
    are pattern matched by Bash as well as the sorting order of the Linux `sort` command.


    # # The du Command


    The Linux `du` (`disk usage`) command shows the amount of disk space used by a
    directory and all subdirectories within it. The `-s` (`summarize` (or `-S`) switch
    displays only the grand total. The `--human-readable` (or `-h`) switch converts
    the total to the nearest megabytes or gigabytes.


    ```

    ```

    $ pwd

    /home/kburch

    ```

    ```'
