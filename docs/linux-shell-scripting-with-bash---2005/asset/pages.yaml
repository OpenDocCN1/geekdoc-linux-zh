  md: 'interactive shell is not necessarily a login shell. A user can start a non-login
    interactive shell by typing bash at a Bash prompt, thus starting a new copy of
    Bash.


    Whether the Bash session is interactive or a login shell determines which profile
    files are used. This way, Bash separates commands specifically for customizing
    an interactive session from the more general-purpose commands.


    The */etc/profile* file contains the setup commands and environment changes common
    to all users. A general profile file might look something like this:


    ```

    ```bash

    #!/etc/profile

    # No core files by default

    ulimit -S -C 0 > /dev/null 2>&1

    # HOSTNAME is the result of running the hostname command

    declare -x HOSTNAME="`/bin/hostname`"

    # No more than 1000 lines of Bash command history

    declare -x HISTSIZE=1000

    # If PostgreSQL is installed, add the Postgres commands

    # to the user''s PATH

    if test -r /usr/bin/psql/bin ; then

    declare -x PATH="${PATH}*:*/usr/bin/psql/bin"

    fi

    # end of general profile

    ```

    ```


    Only the superuser can edit this file. When Bash is used as a login shell, it
    executes the first file it finds named *~/.bash_profile*, *~/.bash_login*, or
    *~/.profile*. When a session completes, Bash runs *~/.bash_logout*, if it exists.


    For example, SuSE Linux uses *~/.profile* for the user''s profile file. (You can
    check this by listing the files in your home directory.) By editing this file,
    you can add commands that will always execute when you log in.


    ```

