- pgno: 135
  md: '# ## 7

    # Compound Commands


    E. EXCEPT FOR THE SIMPLEST SCRIPTS, you seldom want to execute every command.
    It''s helpful to execute one set of commands instead of another, or repeat a set
    of commands several times. *Compound commands* are commands that enclose a group
    of other commands.


    For readability, the enclosed commands are indented to make it clear that their
    execution depends on the compound command. I once had a supervisor complain that
    I occasionally indented my lines one space less than the standard he insisted
    on. (I had to put a ruler up to the screen to see whether it was true.) I figured
    this was a minor problem because he went to another programmer and pointed out
    that his program crashed when a zero was typed.


    Compound commands always consist of two commands that bracket the commands inside.
    The ending command is usually the name of the first command spelled backwards.
    The mysterious sounding **case** command is actually the ending command for the
    compound command *case*.


    # ### Command Status Codes


    Every Linux command returns a *status code* (or exit status), which is a number
    between 0 and 255 that indicates what problems the command experienced. A status
    code of zero indicates that the last command ran successfully. Any other status
    code indicates some kind of error.


    The status code is contained in the variable $?


    ```

    $ unzip no_file.zip

    unzip:  cannot find no_file.zip, no_file.zip.zip or no_file.zip.ZIP.

    $ printf "%d\n" " $?"

    9

    ```


    When **unzip** command doesn''t find a file to decompress, the status code returned
    is 9 (an error).'
  merge: -1
  img_proc: true
- pgno: 136
  md: "The unofficial Linux convention uses codes 127 and below for Linux standard\
    \ error codes. In this case, `ls` returned a status code of 9, which is the Linux\
    \ error code for “bad file number”. The complete set of Linux error codes is listed\
    \ in Appendix D, “Error Codes.”\n\nIf a command is interrupted by a signal, Bash\
    \ returns a status code of 128, plus the signal number. As a result, user-defined\
    \ error codes should be above 191, and the code returned by Bash for the final\
    \ Linux signal, number 63. The list of signal codes is in Appendix E, “Signals.”\n\
    \n```\n```\nif test ! -x \"$who\" ; then\n    printf \"${SCRIPT}:${LINE#}o: the\
    \ command $who is not available - \\\"\n          \"aborting\\n\" >&2\n    exit\
    \ 192\nfi\n```\n```\n\nUnfortunately, most Linux commands simply return a one\
    \ or zero to indicate failure or success. This is often all the information needed\
    \ by a script if it stops immediately when an error occurs. The particular error\
    \ message is still displayed on standard output.\n\n```\n```\n$ ls po_1473.txt\n\
    po_1473.txt\n$ printf '%d\\n' $?\n0\n\n$ ls no_file\nno_file not found\n$ printf\
    \ '%d\\n' $?\n1\n```\n```\n\nThe status code is different from the truth values\
    \ returned by the `let` command as discussed in Chapter 6, in the section called\
    \ “Logical Expressions.” In `let`, `false` (a failed comparison) has the value\
    \ of 0. This follows the conventions of computer languages such as C. However,\
    \ a status code of 0 is success, not a failure.\n\n```\n```\n$ let \"RESULT=1>0\"\
    \n$ printf '%d %d\\n' \"$RESULT\" $?\n1 0\n\n$ test 1 -gt 0\n$ printf '%d\\n'\
    \ $?\n0\n```\n```\n\n`let` assigns 1 to RESULT, indicating that 1 is greater than\
    \ 0. The `test` command returns a status code of 0 to indicate that 1 is greater\
    \ than 0. What’s more, the `let` command has a status code of 0, indicating the\
    \ `let` command successfully performed the comparison.\n\nThese opposite codes\
    \ and conventions can lead to mistakes that are hard to debug. Bash has two built-in\
    \ commands called `true` and `false`. These return status codes, not `let` truth\
    \ values."
  merge: -1
  img_proc: true
- pgno: 137
  md: "```\n$ true\n$ printf \"%d\\n\" \"$?\"\n0\n$ false\n$ printf \"%d\\n\" \"$?\"\
    \n1\n```\n\ntrue assigns a successful status code (0). false assigns an error\
    \ status code (1).\nConfused yet?\n\nIf you need to save the success of a logical\
    \ comparison, it’s best to use the test command for consistency. Most shell commands\
    \ expect status codes, not truth values.\n\nIn a pipeline, several commands can\
    \ run at once. The status code returned from a pipe is the status code of the\
    \ final command. In the following example, the status code is for the wc command,\
    \ not ls.\n\n```\n$ ls badfile.txt | wc -l\nls: badfile.txt: No such file or directory\n\
    0\n$ printf \"%d\\n\" \"$?\"\n0\n```\n\nAlthough ls reported an error, the result\
    \ of the pipeline is zero because wc was successful at counting no lines.\n\n\
    Bash also defines an array called PIPESTATUS that contains the individual status\
    \ codes for each command in the last pipeline.\n\n```\n$ ls badfile.txt | wc -l\n\
    ls: badfile.txt: No such file or directory\n0\n$ printf \"%d %d\\n\" \"${PIPESTATUS[0]}\"\
    \ \"${PIPESTATUS[1]}\"\n1 0\n```\n\n$? is essentially another name for the final\
    \ PIPESTATUS Value.\n\nA command or pipeline can be preceded by a ! to negate\
    \ the status code. If the status is 0, it becomes 1. If the status is greater\
    \ than 0, it becomes 0.\n\n# # if Command\n\nThe if command executes one of two\
    \ or more alternative series of commands based on a status code returned by other\
    \ commands.\n\nNormally, the if statement is used in conjunction with the test\
    \ command.\n\n```\nNUM_ORDERS=`ls -l | wc -l`\nif [ \"$NUM_ORDERS\" -lt \"$CUTOFF\"\
    \ ]; then\n    printf \"%s\\n\" \"Too few orders...try running again later\"\n\
    \    exit 192\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 138
  md: "This example counts customer orders stored as files in a directory. If there\
    \ are not enough order files in the current directory, the script will run the\
    \ statements between the `then` and `fi` keywords, printing a message and stopping\
    \ the script.\n\nThe semicolon before the `then` is required. `then` is technically\
    \ a separate command, although it works in conjunction with `if`. Because they\
    \ are on one line, the semicolon is needed to separate the commands.\n\n`if` commands\
    \ can have an `else` part that is only executed when the condition fails.\n\n\
    ```\nNUM_ORDERS=`ls -1 | wc -1`\nif [ \"$NUM_ORDERS\" -lt \"$CUTOFF\" ]; then\n\
    \    printf \"\\n\\n\" \"Too few orders...but will process them anyway\"\nelse\n\
    \    printf \"\\n\\n\" \"Starting to process the orders\"\nfi\n```\n\n`if` commands\
    \ can be nested inside other `if` commands.\n\n```\nNUM_ORDERS=`ls -1 | wc -1`\n\
    if [ [ \"$NUM_ORDERS\" -lt $TOOFEW ]; then\n    printf \"\\n\\n\" \"Too few orders...but\
    \ will process them anyway\"\nelse\n    if [ [ \"$NUM_ORDERS\" -gt $TOOMANY ];\
    \ then\n        printf \"\\n\\n\" \"There are many orders.  Processing may take\
    \ a long time\"\n    else\n        printf \"\\n\\n\" \"Starting to process the\
    \ orders\"\n    fi\nfi\n```\n\nThe commands cannot be cross-nested; the inner\
    \ `if` must always be completed before the outer `if`.\n\nTo choose between a\
    \ series of alternatives, `if` commands can have an `elif` part. `elif` is a shortcut\
    \ for `else if` and reduces unnecessary `if` nesting. The `elif` part can be followed\
    \ by a final `else` part that, if it is present, is executed only when there are\
    \ no alternatives. Combining these ideas, you can rewrite the previous example\
    \ as follows.\n\n```\nNUM_ORDERS=`ls -1 | wc -1`\nif [ \"$NUM_ORDERS\" -lt \"\
    $TOOFEW\" ]; then\n    printf \"\\n\\n\" \"Too few orders...but will process them\
    \ anyway\"\nelif [ \"$NUM_ORDERS\" -gt \"$TOOMANY\" ]; then\n    printf \"\\n\\\
    n\" \"There are many orders.  Processing may take a long time\"\nelse\n    printf\
    \ \"\\n\\n\" \"Starting to process the orders\"\nfi\n```\n\nThe `if` command doesn't\
    \ have to be used with the `test` command. It can run and test the status code\
    \ of any command."
  merge: -1
  img_proc: true
- pgno: 139
  md: "```\n```sh\nif rm \"STEMPFILE\" ; then\n    printf \"%s\\n\" \"SSCRIPT:temp\
    \ file deleted\"\nelse\n    printf \"%s - status code $d\\n\" \\\n    \"SSCRIPT:$LINENO:\
    \ unable to delete temp file\" $2\nfi\n```\n```\n\nEmbedding complex commands\
    \ into an if command can make a script difficult to read and debug; you should\
    \ avoid doing this. In this case, the rm command is not as prominent as it would\
    \ be if it appeared on a line of its own. Likewise, it is possible to declare\
    \ variables inside of an if command, but it makes it very difficult to determine\
    \ which variables exist and which do not.\n\n# case Command\n\nThe case command\
    \ compares a variable against a series of values or patterns. If the value or\
    \ pattern matches, the corresponding statements are executed. The name comes from\
    \ the fact that the variable is tested on a case-by-case basis.\n\nUnlike elif\
    \ commands that test the status code for individual commands, case tests the value\
    \ of a variable. The case command is preferable to a long set of elifs when testing\
    \ string values.\n\nEach individual case must end with a pair of semicolons. Without\
    \ the semicolons, Bash will attempt to execute the next case designation and report\
    \ an error.\n\n```\n```sh\nprintf \"%s -> %s 1= delete, 2= archive. Please choose\
    \ one\"\nread REPLY\ncase \"$REPLY\" in\n    1) rm \"STEMPFILE\" ;;\n    2) mv\
    \ \"STEMPFILE\" \"STEMPFILE.old\" ;;\n    *) printf \"ss\\n\" \"$REPLY was not\
    \ one of the choices\" ;;\nesac\n```\n```\n\nThe pattern asterisk (*) is the catch-all\
    \ case; it matches all values that were not handled by a previous case. Although\
    \ this case is optional, it’s good design to always include a catch-all case,\
    \ even if it only contains a null statement (:).\n\nThe pattern-matching rules\
    \ follow the file globbing rules, as discussed in the previous chapter. For example,\
    \ vertical bars can separate multiple patterns.\n\nThe cases don’t “fall through”\
    \ as some computer languages do, notably C. When one case is selected, only those\
    \ commands are executed. The commands in the following cases are not executed.\n\
    \n# while Loop\n\nThere are several commands for repeating a set of commands.\n\
    \nThe while command repeats the enclosed commands while the command being tested\
    \ succeeds. If the command fails on the first try, the enclosed commands are never\
    \ executed."
  merge: -1
  img_proc: true
- pgno: 140
  md: "```\n```bash\nprintf \"&s\\n\" \"Enter the names of companies or type control-d\"\
    \nwhile read -p \"Company ?\" COMPANY; do\n    if test -f \"orders_$COMPANY.txt\"\
    \ ; then\n        printf \"&s\\n\" \"There is an order file from this company\"\
    \n    else\n        printf \"&s\\n\" \"There are no order files from this company\"\
    \n    fi\ndone\n```\n```\n\nA while loop is completed with the `done` command,\
    \ not `elihw` as you might expect.\nAn *infinite* loop can be created using the\
    \ `true` command. Because `true` always succeeds, the loop will continue indefinitely.\n\
    \n```\n```bash\nprintf \"&s\\n\" \"Enter the names of companies or type quit\"\
    \nwhile true ; do\n    read -p \"Company ?\"  COMPANY\n    if [ \"$COMPANY\" =\
    \ \"quit\" ] ; then\n        break\n    elif test -f \"orders_$COMPANY.txt\" ;\
    \ then\n        printf \"&s\\n\" \"There is an order file from this company\"\n\
    \    else\n        printf \"&s\\n\" \"There are no order files from this company\"\
    \n    fi\ndone\n```\n```\n\nA while loop can be stopped prematurely with the `break`\
    \ command. On reaching a break, Bash stop executing commands and “breaks out”\
    \ of the loop and begins executing the *first* command *after* the loop.\n`break`\
    \ can be followed by a number indicating how many enclosing loops to break out\
    \ of. For example\n`break 2` breaks out of the current loop as well as the loop\
    \ enclosing the current loop.\nThe counterpart to `break` is `continue`, which\
    \ causes the remainder of the enclosed statements to be ignored; the loop is resumed\
    \ at the top. `continue` can be followed by a number indicating how many enclosing\
    \ statements to break out of before continuing.\n\n# ## until Loop\n\nThe counterpart\
    \ of the while loop is the `until` loop. The `until` command is identical to the\
    \ `while` command except that it repeats the enclosed statements until the condition\
    \ is *successful*, essentially the same as `while !`.\n\n```\n```bash\nuntil test\
    \ -f \"$INVOICE_FILE\" ; do\n    printf \"&s\\n\" \"Waiting for the invoice file\
    \ to arrive...\"\n    sleep 30\ndone\n```\n```"
  merge: -1
  img_proc: true
- pgno: 141
  md: "Using `until` with the `false` command creates an infinite loop.\nThe `break`\
    \ and `continue` commands can be used with an `until` loop.\n\n# ## **for Loops**\n\
    \nThe standard Bourne `for in loop` is a variation on the here file. The `for`\
    \ command reads a sequence of values into a variable and repeats the enclosed\
    \ commands once for each value.\n\n```\n```\nfor FILE_PREFIX in order invoice\
    \ purchase order; do\n    if test -f \"$FILE_PREFIX\"*_vendor1.txt\" ; then\n\
    \        printf \"%%s\\n\" \"There is a $FILE_PREFIX file from vendor l...\"\n\
    \    fi\ndone\n```\n```\n\nIf the `in` part is missing, the `for` command will\
    \ excute the enclosed statemets for each argument to the shell script.\n\nThe\
    \ `break` and `continue` commands can be used with a `for` loop.\n\nBecause of\
    \ the other shell features, this kind of `for` loop isn't commonly used.\n\n#\
    \ ## **Embedded let( ( . . . ) )**\n\nThe `let` command returns a status code\
    \ of 1 if an expression is zero, or 0 if the expression is a value other than\
    \ zero. In the same way that the `test` command can be expressed with a pair of\
    \ square brackets for easier reading in compound statements, the `let` command\
    \ also has a form for easier reading: double parentheses.\n\nThe `for` loop, as\
    \ found in other programming languages, is created using an embedded `let`, as\
    \ shown in Listing 7.1.\n\n```\n```\nListing 7.1  forloop.sh\n\n#!/bin/bash\n\
    # forloop.sh: Count from 1 to 9\nfor (( COUNTER=1; COUNTER<10; COUNTER++ )) ;\
    \ do\n    printf \"The counter is now %d\\n\" $COUNTER\ndone\nexit 0\n```\n```\n\
    \nThe first expression in the double parentheses is executed when the loop is\
    \ started. Each time the loop is restarted, the third expression is executed and\
    \ the second expression is checked. When the second expression returns `false`,\
    \ the loop ends.\n\n```\n```\n$ bash forloop.sh\nThe counter is now 1\nThe counter\
    \ is now 2\nThe counter is now 3\n```\n```"
  merge: -1
  img_proc: true
- pgno: 142
  md: "```\nThe counter is now 4\nThe counter is now 5\nThe counter is now 6\nThe\
    \ counter is now 7\nThe counter is now 8\nThe counter is now 9\n```\n\n# ## Grouping\
    \ Commands ( {...} )\n\nCommands can be grouped together using curly braces (\
    \ {...} ).\n\n```\nls -1 | {\n    while read FILE ; do\n        echo \"$FILE\"\
    \n    done\n}\n```\n\nIn this example, the results of the `ls` command become\
    \ the input for all the state-ments in the group.\n\n```\n$ test -f orders.txt\
    \ && { ls -l orders.txt ; rm orders.txt; } \\\\\n    || printf \"no such file\"\
    \n```\n\nIf the file `orders.txt` exists, the file will be listed and deleted;\
    \ otherwise, “no such file” is printed. The semicolon after the last braced command\
    \ is required only when the braces are on a single line.\n\nCommands can also\
    \ be grouped using subshells. Subshells are described in Chapter 9, “Parameters\
    \ and Subshells.”\n\n# ## report .bash: Report Formatter\n\nreport .bash is a\
    \ script that reads a list of sales figures and creates a simple report. The sales\
    \ figure file consists of product names, local country sales, and foreign country\
    \ sales. For example, report .bash turns this\n\n```\nbinders 1024 576\npencils\
