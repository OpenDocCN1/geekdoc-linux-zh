- pgno: 99
  md: 'Under rare cases, you might want to force Bash to perform an additional round
    of substitutions. The Bash `eval` command can do substitutions on demand and run
    the results. Take the following simple example, shown in Listing 5.3, whereby
    one of three variables is shown on the screen.


    # Listing 5.3 eval_example.sh


    ```

    # eval_example.sh


    short -s -o nounset


    declare -r DISPLAY_VARIABLE="''"''$SALES_EAST''


    declare -i SALES_EAST=1000

    declare -i SALES_WEST=2000

    declare -i SALES_NORTH=3000


    printf "DISPLAY VARIABLE = %s\n" "$DISPLAY VARIABLE"

    printf "reprocessed with eval, DISPLAY_VARIABLE = %s\n" \

    ''eval printf "%s\n" "$SALES_EAST"''

    ```


    This script can display the sales figures for one of three company branches. The
    constant `DISPLAY_VARIABLE` contains the variable to display, `SALES_EAST`, `SALES_WEST`,
    or `SALES_NORTH`. But if `DISPLAY_VARIABLE` is substituted, only the string “`$SALES_EAST`”
    is printed.


    The backquotes run `eval` and perform a new set of substitutions. The results
    can be substituted into the original `printf` command. Now the results are as
    you expected.


    ```

    $ bash eval_example.sh

    DISPLAY VARIABLE = $SALES_EAST

    reprocessed with eval, DISPLAY_VARIABLE = 1000

    ```


    In this example, Bash first processes the `printf` command as


    ```

    printf "reprocessed with eval, DISPLAY_VARIABLE = %s\n" \

    ''eval printf "%s\n" "$SALES_EAST"''

    ```


    This only prints $ `SALES_EAST` because Bash is finished substituting the values
    of variables. When Bash executes the `eval` command, there is a second examination
    of the `echo` command.


    ```

    printf "reprocessed with eval, DISPLAY_VARIABLE = %s\n" ` printf "%s\n" 1000''

    ```


    Because Bash also attempts to run the result, the `echo` command, a simpler version
    of `printf`, is required. `eval` tries to execute the re-evaluated `DISPLAY_VARIABLE`
    as if it were a command. That is, with `eval 1000`, Bash would try to execute
    the number `1000`, which is not what you want.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Although not particularly realistic in this example, the `eval` command is
    useful when the user types commands to execute, or when reading commands to execute
    from a file. The commands can contain variables, dollar functions, and so forth,
    provided you use `eval` to process them.


    A common pitfall is not following through the substitution process. Suppose, for
    example, that instead of assigning `DISPLAY_VARIABLE` the value `$SALES_EAST`,
    `SALES_EAST` was assigned and a second dollar sign was added to the `printf` statement:


    ```

    ```text

    printf "reprocessed with eval, DISPLAY_VARIABLE = $a\n" \\

    ''eval printf "$a\n" "$$$DISPLAY_VARIABLE"''

    ```

    ```


    You would get a response similar to this:


    ```

    ```text

    reprocessed with eval, DISPLAY_VARIABLE = 1423SALES_EAST

    ```

    ```


    In this case, the first substitution leaves the command:


    ```

    ```text

    printf "reprocessed with eval, DISPLAY_VARIABLE = $a\n" \\

    ''eval printf "$a\n" $SALES_EAST''

    ```

    ```


    But `$a` is a built-in shell function. Bash doesn''t understand that `$SALES_EAST`
    is supposed to be nested inside the first dollar sign; it simply reads from left
    to right, substituting as it does. The second substitution would execute the `$$`
    function, not substitute the value of the `SUM` variable. To execute this properly,
    you have to escape the first dollar sign with a backslash to keep Bash from substituting
    it.


    ```

    ```text

    printf "reprocessed with eval, DISPLAY_VARIABLE = $a\n" \\

    ''eval printf "$a\n" "\\$DISPLAY_VARIABLE"''

    ```

    ```


    After the first substitution, you get this:


    ```

    ```text

    printf "reprocessed with eval, DISPLAY_VARIABLE = $a\n" \\

    ''eval printf "$a\n" "$SUM"''

    ```

    ```


    This prevents `$$` from being treated as a built-in function: Bash substitutes
    for `$SALES_EAST` instead. You bypassed these issues in the first example when
    the dollar sign was inside `DISPLAY_VARIABLE`.


    The same effect can be achieved by escaping some quotation marks in the right
    places.


    Variables and constants form the building blocks of all scripts, but they only
    serve as storage containers without expressions. These are covered in the next
    chapter (Chapter 6, “Expressions”).


