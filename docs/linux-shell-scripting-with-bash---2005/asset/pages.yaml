  md: "```\nLooking up some items...\nHazel's Ladies Wear is in the table at 34\n\
    Summer Water is in the table at 71\nBogus test data is not in the table\n```\n\
    \nHash tables can be combined with associative arrays to create Perl-style hashes\
    \ with fast lookup times.\n\n# Binary Trees Using Bash Arrays\n\nHashes chose\
    \ apparently random positions to store items. Because the items are scattered,\
    \ it is difficult to sort them.\n\nBinary trees provide a compromise: They are\
    \ slower than hashes, but the items they contain are sorted and can be displayed\
    \ in sorted order. A *binary tree* is a family tree whereby each parent has two\
    \ children. The children are sorted according to the parent. Usually children\
    \ that are alphabetically before the parent are stored to the left, and children\
    \ that are alphabetically after the parent are stored to the right.\n\nA common\
    \ problem with binary trees are *degenerate trees*. If the items being added to\
    \ the binary tree are sorted under the same conditions that the tree is sorted,\
    \ the tree is a single long list. If necessary, randomize the items before adding\
    \ them to the tree.\n\nBinary trees can be represented in a Bash array. The size\
    \ of each tier of the tree is known. The first item, or the *root* of the tree,\
    \ is always a single item. The next row of the tree has two items, the two children\
    \ of the root. The next row has four items, and so forth. So if the root of the\
    \ tree is position zero in the Bash array, the second row is in positions 1 and\
    \ 2, and the third row is in positions 3, 4, 5, and 6.\n\n```\n```bash\nif [ \"\
    ${TREE[$ITEM]}\" \\> \"$1\" ] ; then   # sort alphabetically\n    let \"ITEM=ITEM*2+1\"\
    \                       # lesser items to left child\nelse\n    let \"ITEM=ITEM*2+2\"\
    \                       # greater items to right child\nfi\n```\n```\n\nYou can\
    \ use this simple mathematical formula to store the tree in the array. For example,\
    \ the left child of the item at position 1 in the tree is stored at position 1*2+1,\
    \ or position 3. The right child is located at position 4, the following position.\
    \ The items are sorted alphabetically (or, at least, according to their ASCII\
    \ values) .\n\nBecause new items are added at empty positions in the TREE array,\
    \ the *nounset* shell option has to be temporarily turned off while checking for\
    \ empty positions. Empty positions are technically \"unset\" and cause an error\
    \ if this option is left on.\n\nListing 17.2 shows a script that stores a binary\
    \ tree in a Bash array.\n\n# Listing 17.3 `binary.sh`\n\n```\n```bash\n#!/bin/bash\n\
    #\n# binary.sh\n```\n```"
