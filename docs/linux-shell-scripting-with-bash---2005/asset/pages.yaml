    are using Bash, use declare instead. declare has all the features of the older
    typeset command.


    Choosing good variable names is important. One time, when I was grading a first-year
    computer science assignment, a student used 26 variables named A to Z. There was
    no explanation about what the variables represented and it took me half an hour
    to determine whether the program actually worked. (Surprisingly, it did.)


    Names should also be consistent. In the mutual fund industry, for example, "portfolios,"
    "accounts," and "funds" often mean the same thing. It is better to use one of
    these three names throughout your script. If three different terms are used, the
    reader might assume there are subtle differences in meaning between them.


    Because Bash does minimal checking of variable names, even with the nounset option
    turned on, another common mistake is using a variable that looks the same. In
    my first year in university, I ran into an old friend who was frustrated because
    his Fortran'
