    Cedar Toy Chest, 65.99, 1,757

    Bunk Bed, 705.99, 1,757

    Queen Bed, 925.99, 1,757

    ```

    ```


    The key position can be followed by the ending position, separated by a comma.
    For example, to sort only on the second field, use a key of -k 2,2.


    If the field number has a decimal part, it represents the character of the field
    where the key begins. The first character in the field is 1. The first field always
    starts at the beginning of the line. For example, to sort by ignoring the first
    character, indicate that the key begins with the second character of the first
    field.


    ```

    ```

    $ head orders.txt | sort -f -kl.2

    Reclining Chair, 1599.99, 1,757

    Cedar Toy Chest, 65.99, 1,757

    Pine Round Table, 375.99, 1,757

    Birchwood China Hutch, 475.99, 1,756

    Six-drawer Dresser, 525.99, 1,757

    Small Bookcase Oak Veneer, 205.99, 1,756

    Bookcase Oak Veneer, 205.99, 1,756

    Queen Bed, 925.99, 1,757

    Bunk Bed, 705.99, 1,757

    Two-drawer Nightstand, 125.99, 1,756

    ```

    ```


    There are many switches that affect how a key is interpreted. The -b (blanks)
    switch indicates the key is a string with leading blanks that should be ignored.
    The -n (numeric) switch treats the key as a number. This switch recognizes minus
    signs and decimal portions, but not plus signs. The -g (general number) switch
    treats the key as a C floating-point number notation, allowing infinities, NaNs,
    and scientific notation. This option is slower than -n. Number switches always
    imply -b. The -d (phone directory) switch only uses alphanumeric characters in
    the sorting key, ignoring periods, hyphens, and other punctuation. The -i (ignore
    unprintable) switch only uses printable characters in the sorting key. The -M
    (months) switch sorts by month name abbreviations.


    There can be more than one sorting key. The key interpretation switches can be
    applied to individual keys by adding the character to the end of the key amount,
    such as -k4,4M, which means "sort on the fourth field that contains month names".
    The -x and -f switches can also be used this way.'
