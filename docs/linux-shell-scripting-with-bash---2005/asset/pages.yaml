- pgno: 290
  md: '# Transferring Ownership (chown/chgrp)


    The Linux `chown` (*change owner*) command changes the owner of a file. To use
    `chown`, you must be the owner of the file. Only root can use `chown` to change
    ownership. An ordinary user can use it to change the group, as long as the user
    is also a member of the target group.


    The owner can either be a numeric *uid* or a name.


    ```

    $ chown order_sys orders.txt

    ```


    The `--reference` switch can copy the ownership from another file.


    ```

    $ chown --reference=last_orders.txt orders.txt

    ```


    For additional security in switches, the `--from` switch can verify the old owner
    before changing it to a new owner. The `--reference` and `--from` switches can''t
    be combined in a single `chown`.


    ```

    $ chown --from="kburtch" order_sys orders.txt

    ```


    When a colon and a group name follow the owner, `chown` changes both the owner
    and the group. If the group part is missing, the group is set to the owner''s
    group. If the owner part is missing, only the owner is changed. A group can also
    be specified in the `--from` switch using a colon.


    ```

    $ chown order_sys:ngroup orders.txt

    ```


    The `--recursive` (or `-R`) switch recursively changes files in subdirectories.
    The `--changes` (or `-c`) switch announces each change. The `--verbose` (or `-v`)
    switch provides even more information. The `--quiet` (or `-silent` or `-f`) switch
    hides error messages. The `--dereference` switch dereference symbolic links.


    Use `chown` to determine who can access a script and its related files, minimizing
    the problems a hidden script problem can cause.


    Avoid running scripts under the superuser login. A script running under the superuser
    login can change the owner of any file. However, if you find that you have to
    use the superuser login for a script that performs a task other than system administration,
    it is an indication that the ownership of the files is wrong. Change the owner
    of the files, or even create a new fictitious user to own the files, instead of
    running under the superuser login. Mistakes in a superuser script can be wide-ranging,
    very dangerous, and difficult to track down.


    The Linux `chgrp` (*change group*) command is a short form for `chown :group`.
    `chgrp` changes only the ownership group.


    # Changing Access Rights (chmod)


    Like `chown` to change file ownership, the Linux `chmod` (*change mode*) command
    changes a file''s permissions. The name comes from the Linux term *file mode*,
    a number consisting'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'of the permission bits and some other file information. Although the name suggests
    that the command can change any file mode settings, this command changes just
    the access rights.


    The permissions can be expressed in two ways.


    First, they can be represented by the four-digit octal permissions number.


    ```

    ```bash

    $ touch orders.txt

    $ ls -l orders.txt

    -rw-r-- 1 ken users 0 May 9 12:48 orders.txt

    $ chmod 0755 orders.txt

    $ ls -l orders.txt

    -rwxr-xr-x 1 ken users 0 May 9 12:48 orders.txt

    ```

    ```


    For those who are not used to octal numbers, permissions can be added with a plus
    sign, or removed with a minus sign. Permissions are grouped by user (u), group
    (g), others (o), or all (a) and can have read (r), write (w), or execute (x) permissions.
    Therefore, to add read permissions for the user and the file''s group, you do
    this


    ```

    ```bash

    $ chmod 0000 orders.txt

    $ ls -l orders.txt

    ------ 1 ken users 0 May 9 12:48 orders.txt

    $ chmod ug+r orders.txt

    $ ls -l orders.txt

    -r-r--- 1 ken users 0 May 9 12:48 orders.txt

    ```

    ```


    To remove write permission from users who don''t own the file and aren''t in the
    same group, do this


    ```

    ```bash

    $ chmod a+rwX orders.txt

    $ ls -l orders.txt

    -rwxrwXrwx 1 ken users 0 May 9 12:48 orders.txt

    $ chmod o-w orders.txt

    $ ls -l orders.txt

    -rwxwR-rx-x 1 ken users 0 May 9 12:48 orders.txt

    ```

    ```


    An equals sign causes the permissions to be set to the specified values, rather
    than adding or subtracting them from the existing set. The letters u, g, and o
    refer to the current values of the user, group, and other access bits respectively.
    For example, g=u assigns the group permissions the same value as the user permissions.


    ```

    ```bash

    $ chmod 0755 orders.txt

    $ ls -l orders.txt

    -rwxr-xr-x 1 ken users 0 May 9 12:48 orders.txt

    $ chmod g=u orders.txt

    $ ls -l orders.txt

    -rwxrwXr-x 1 ken users 0 May 9 12:48 orders.txt

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'Another shorthand, the x symbol, assigns execute permissions only if the file
    is a directory or already has execute permissions for some user.


    Besides r, w, and x, there are three special access bits that can be changed.
    These are all found in the left-most octal digit of the file permissions number:
    set_uid or set_gid (s), or the so-called "save program text on swap device" (t)
    bit.


    The t permission, commonly called the sticky bit, is used primarily for temporary
    file directories. Normally, only the owner of a file can delete a file. With the
    sticky bit set, the owner of the file or the owner of the directory the file is
    in can delete the file, making it easier to write temporary file clean-up scripts.
    Anyone can add files to a directory with the sticky bit set. The sticky bit has
    no meaning for other kinds of files; even though it can be set, it is ignored.
    On some other versions of Unix, the sticky bit has other meanings.


    The effect of setting the setuid/setgid bits is described in the next section.
    These bits have no effect on shell scripts.


    chmod does not change symbolic links. Linux ignores the permissions on a symbolic
    link and they always appear as 0777 permissions. The only access rights that matter
    are the permissions of the file that the symbolic link points to. If a file cannot
    be accessed, it also won''t be accessed through a symbolic link.


    The chmod switches are the same as the chown command, except there is no -from
    switch to verify old permissions.


    If no g, o, or a appears, the permission is applied as if a was typed, except
    that only reasonable changes are allowed. What is a reasonable change? This is
    determined by the umask command.


    Use chmod to qualify how the users with the right to access a file can change
    the file. The correct permissions should reflect how the file is to be used. If
    a file is infrequently updated, remove the write permission to protect against
    accidental changes. If a file is maintained by its owner and only read by its
    group, remove the group''s permission to write. Files with 777 permissions are
    a sign of a sloppy programmer or the hasty work of a busy consultant.


    In most cases, you don''t want other users to have any access to the file; remove
    all access rights for other users. If you can''t remove all access rights for
    other users, consider changing the file ownership.


    Users who run a script should always be able to read it. Unlike a normal program,
    execute permission does not allow a user to run a script. Because Bash must load
    a script in order to execute it, scripts must be read. If you want a user to be
    able to run a script directly, without referring to the Bash program, include
    both execute and read rights.


    Don''t depend on the access rights of a directory to protect a file. There is
    always a chance that the file will move in the future; moving the file should
    not change the access to the data it contains.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Default Access Rights (umask)


    Bash determines the default access rights to a file using the built-in `umask`
    command. The `umask`, or *user file creation mask*, is a number indicating which
    access rights are normally disallowed. Running `umask` by itself shows the current
    `umask` value as an octal number, and the `-s` switch shows which bits the `umask`
    allows.


    ```

    ```

    $ touch newfile.txt

    $ ls -l newfile.txt

    -rw-rw-r-- 1 kburcht kburcht     0 May 22 11:34 newfile.txt

    $ umask

    0002

    $ umask -S

    u=rw, g=rw, o=rx

    ```

    ```


    In this example, the `umask` is set to 2, meaning bit 2 (others can write to the
    file) should normally be off. The `touch` command gave all users read and write
    access except for other users who are not allowed to write.


    You can create new `umask` values by specifying either an octal number or a permission
    string.


    ```

    ```

    $ umask 0

    $ rm newfile.txt

    $ touch newfile.txt

    $ ls -l newfile.txt

    -rw-rw-rw- 1 kburcht kburcht     0 May 22 11:40 newfile.txt

    ```

    ```


    With a `umask` of 0 (everything allowed), the `touch` command created a file that
    can be written or read by anyone.


    Honoring the `umask` command is strictly up to an individual script or command.
    There is nothing built into Bash that forces programs to check the `umask` value.
    In a script, applying `umask` is cumbersome because the `umask` and the permissions
    are in octal notation, but it can be done, as shown in Listing 15.1.


    # Listing 15.1 calculate_mode.sh


    ```

    ```

    #!/bin/bash

    #

    # calculate_mode.sh: fragment showing how to honor the umask


    DESIRED_MODE="$1"

    # Convert from octal to decimal

    DESIRED_MODE_DECIMAL=`printf "\$d" 0*$DESIRED_MODE`

    # Get umask and convert to decimal

    UMASK_DECIMAL=`printf "$d" \`umask\`

    # Invert the bits in the umask so set bits are the allowed bits

    let "UMASK_INVERT=~$UMASK_DECIMAL"

    # Only allow bits that are allowed by the umask

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'Listing 15.1 Continued


    ```

    let `*EFFECTIVE_MODE=DESIRED_MODE_DECIMAL & UMASK_INVERT*`

    # Convert back to octal

    `MODE= printf "%o" "`$EFFECTIVE_MODE*"`

    printf "Desired mode = %d\n" `*DESIRED_MODE*`

    printf "Umask id = %d\n" umask

    printf "Effective mode = %d\n" *MODE*

    ```


    The results for reading and writing by everyone with a umask of 2 is:


    ```

    $ sh calculate_mode.sh 666

    Desired mode = 666

    Umask id = 0002

    Effective mode = 664

    ```


    If the umask -p switch is used, the umask prints the umask command needed to restore
    the current umask value.


    # setuid/setgid and Scripts


    Sometimes a program has to perform actions on behalf of a number of people. For
    example, the Linux lp command prints files on behalf of the users on a computer.
    Rather than running the program under a particular user''s ownership, the program
    can run under its own permissions, the permissions of its creator. To accomplish
    this, Linux provides setuid and setgid permissions. When these permissions are
    set, the program temporarily runs with the permissions of its creator instead
    of the person running it.


    setuid and setgid permissions are necessary under certain circumstances, but they
    also introduce security loopholes. If there is a bug in the program, it can allow
    users to perform actions that bypass the normal system security. This is especially
    dangerous when a setuid or setgid program acts on behalf of the superuser.


    In the case of Bash scripts, Bash ignores the setuid and setgid bits on a script.
    Scripts always run with the ownership of the user running the script. After all,
    a script is data, not a compiled program that runs as a certain owner.


    If a script absolutely must run with setuid or setgid, you can create a short
    C language "wrapper" program to run the script, and then set setuid or setgid
    on the C program. When the wrapper program runs, it runs as the owner of the wrapper
    and then runs the Bash script.


    There are two drawbacks to using wrapper programs. First, it is risky from a security
    viewpoint. Unless the script is serving the needs of a large number of users,
    setuid probably opens up access to too many people. It''s easy to forget either
    the wrapper or the script when changing permissions. Scripts also are more sensitive
    than compiled programs to environment and exit changes. For an alternative to
    a wrapper program, consider using the Linux sudo command.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'Secondly, wrappers place extra load on the machine, because two programs must
    run instead of one. It’s good practice to avoid wrappers unless they are absolutely
    necessary and apply as many security checks as possible.


    # # The chroot Command


    The Linux chroot command is available only to superuser scripts. chroot changes
    the apparent location of the root directory / . By moving the root directory,
    you can isolate the files a script can access to a particular branch of the file
    system.


    chroot can be applied to a command. The command to be run must appear within the
    new directory structure, and the path should be relative to the new root directory.


    ```

    $ chroot /home/kburtch ls /

    ```


    In this example, ls refers to /home/kburtch/lg/ls; ls must be in the kburtch directory.


    It is now impossible for ls to access files outside of /home/kburtch. When the
    / is altered, there’s no way to undo a chroot except by ending the session using
    the new root directory.


    Without a command, chroot assumes there’s a command called /bin/sh (usually a
    link to Bash) under the new root directory and attempts to start a new shell session.
    For example, this command


    ```

    $ chroot /home/kburtch/

    ```


    starts a new shell session by running /home/kburtch/bin/sh. The directory / now
    refers to /home/kburtch/. A reference to orders.txt now refers to /home/kburtch/orders.txt.


    chroot provides a measure of security for superuser scripts by limiting the directories
    that can be accessed. However, use care with chroot. In the previous examples,
    a script cannot access any Linux commands in /usr/bin because that directory can
    no longer be “seen.” Any Linux commands required by the script have to be linked
    to a directory visible to the chroot-using script.


    # # Resource Limits (ulimit)


    The built-in ulimit command places limits on the resource usage of a script. Like
    chroot, this command places boundaries on the environment that a script is operating
    in. Resources refer to operating system limits such as the number of files that
    are allowed to be open or the maximum amount of memory a program can request.


    The word unlimited indicates that there is no limit imposed. The -a switch displays
    a list of all resource limits.


    ```

    $ ulimit -a

    core file size          (blocks, -c) 0

    data seg size          (kbytes, -d) unlimited

    file size               (blocks, -f) unlimited

    ```'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'max locked memory    (kbytes, -l) unlimited

    max memory size      (kbytes, -m) unlimited

    open files              (-n) 1024

    pipe size              (512 bytes, -p) 8

    stack size            (kbytes, -s) unlimited

    cpu time              (seconds, -t) unlimited

    max user processes        (-u) 1024

    virtual memory        (kbytes, -v) unlimited


    Individual switches specify specific resources:


    +   - `-c`—Maximum size of core files

    +   - `-d`—Maximum size of a process’s data segment

    +   - `-f`—Maximum size of shell-created files

    +   - `-l`—Maximum amount of memory that can be locked

    +   - `-m`—Maximum resident set size

    +   - `-n`—Maximum number of open file descriptors

    +   - `-p`—Pipe size (cannot be set)

    +   - `-s`—Maximum stack size

    +   - `-t`—Maximum CPU time

    +   - `-u`—Maximum number of processes for a single user

    +   - `-v`—Maximum amount of virtual memory available to the shell


    Each resource has both a maximum hard limit, and a current soft limit, which can
    be any amount up to the maximum. For example, the stack size can have both a hard
    and soft limit. You can check these limits with the -H (hard limit) and -S (soft
    limit) switches.


    ```

    $ ulimit -H -s

    unlimited

    $ ulimit -S -s

    8192

    ```


    The stack size here is limited to 8K, but it can be changed to any number of bytes.
    To change a limit, supply a new value to the ulimit command


    ```

    $ ulimit -S -s 16384

    $ ulimit -S -s

    16384

    ```


    The special values hard and soft, refer to the current hard or soft limit. Use
    them to copy one limit to the other limit.


    ```

    $ ulimit -H -s soft

    $ ulimit -H -s

    16384

    ```'
  merge: -1
