  md: 'Linux divides its manual pages into a number of logical volumes. man displays
    any matching entries from any volume. Volume 1 contains the commands you can execute
    from the shell. To restrict your search to shell commands, use man 1.


    ```

    $ man 1 date

    ```


    If there are pages in more than one manual volume, only the page from the first
    volume that matches your search is displayed. To find matching pages across all
    manual volumes, use the -a (all) switch.


    The -k switch searches the Linux manual for a particular keyword and lists all
    man pages referring to that keyword.


    ```

    $ man 1 -k alias

    ```


    The command help type gives you different information than man 1 type. The help
    type command tells you about Bash''s built-in type command, whereas the man 1
    type command tells you about the Linux type command. If you are not sure whether
    a command is a Bash command, always try the help command before using the man
    command.


    # ## Fixing the Display


    There will be times when a Bash session becomes unusable. Certain character sequences
    can lock your display, hide what you type, or change the characters being shown
    into strange symbols. This can happen, for example, when you''re trying to display
    a binary file.


    The reset command attempts to restore a Bash session to a safe, sane state. If
    reset fails, you might also need to use stty sane to restore the session to a
    normal state.


    The clear command clears the display and returns the cursor to the upper-left
    corner.


    # ## Working with Files


    There are several Linux commands for removing, copying, and moving files.


    mkdir (make directory) creates a new directory. Use mkdir to organize your files.


    ```

    $ mkdir prototypes

    $ ls -l

    total 4

    drwxr-xr-x   2 ken     users        4096 Jan 24 12:50 prototypes

    ```


    There are two switches for mkdir:


    +   * -mode=m (-m)—Sets the permission mode (as in chmod)

    +   * -parents (-p)—Makes all necessary directories even if they don''t currently
    exist


    ```

    $ mkdir --parents --mode=550 read_only/backup/january

    $ ls -l

    ```'
