    The read command has no knowledge of what text on the line belonged originally
    to which variable. It assumes that the values are separated by spaces and assigns
    Alpha to COMPANY. When $q is used, read knows that the backslash protected spaces
    belong with the first value and it reads everything up to the first unprotected
    space, assigning Alpha Systems Inc to COMPANY.


    Word splitting is controlled by the value of the special variable IFS. Normally,
    IFS treats spaces, tabs, and newline characters as word delimiters—that is, it
    uses whitespace characters. If the content of IFS is changed, the new characters
    are used as word delimiters. However, this is an older feature for compatibility
    with the Bourne shell and the IFS variable should not be altered by scripts because
    newer features such as $q formatting are available.


    Whenever values are assigned or are substituted with a dollar sign, it is good
    practice to always enclose the values in double quotes to prevent problems with
    values containing spaces.


    # Variable Attributes


    All Bash variables are stored as simple strings. Each variable has certain options
    called attributes, which can be turned on or off by using the declare command
    in a similar way to shell options and the shopt command.


    If a variable is declared with the -i (integer) switch, Bash turns on the integer
    attribute for that variable. The shell will remember that the string should be
    treated as an integer value. If a non-numeric value is assigned to an integer
    variable, Bash does not report an error but instead assigns a value of zero.


    ```

    $ declare -i NUMBER_ACCOUNTS=15

    $ printf "%d\n" "$NUMBER_ACCOUNTS"

    15

    $ NUMBER_ACCOUNTS="Smith"  # mistake

    $ printf "%d\n" "$NUMBER_ACCOUNTS"

    0

    $ NUMBER_ACCOUNTS=12

    $ printf "%d\n" "$NUMBER_ACCOUNTS"

    12

    ```


    Sometimes an attempt to assign a string produces an error, but you can''t rely
    on this behavior.


    ```

    $ NUMBER_ACCOUNTS="Smith Account"  # mistake

    bash: Smith Account: syntax error in expression (error token is `Account'')

    ```'
