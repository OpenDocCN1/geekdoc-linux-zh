- pgno: 33
  md: '# 2

    Operating the Shell


    O

    NE DAY MY FATHER WAS WORKING on the electrical wiring on his pontoon boat. He
    worked for several hours without success. No matter what he tried, he couldn’t
    get his running lights to work. Frustrated, he turned the light switch off...
    and the lights came on.


    This chapter is a brief overview of how to use the shell in an interactive session
    at the Bash command prompt. Like my father and his wiring problem, understanding
    how commands work at the fundamental, interactive level is important before digging
    into the intricacies of scripts. That is, unless you like unexpected surprises.


    # Bash Keywords


    A *keyword* is a word or symbol that has a special meaning to a computer language.
    The following symbols and words have special meanings to Bash when they are unquoted
    and the first word of a command.


    |   |   |   |   |   |

    |---|---|---|---|---|

    | !   | esac  | select  | }       |       |

    | case  | fi    | then    | [[      |       |

    | do    | for   | until   | ]]      |       |

    | done  | function | while  |       |       |

    | elif  | if    | time    |       |       |

    | else  | in    | {       |       |       |


    Unlike most computer languages, Bash allows keywords to be used as variable names
    even though this can make scripts difficult to read. To keep scripts understandable,
    key-words should not be used for variable names.


    # Command Basics


    The commands that can be typed at the Bash shell prompt are usually Linux programs
    stored externally on your file system. Some commands are built into the shell
    for speed, standardization, or because they can function properly only when they
    are built-in.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'No matter what their source, commands fall into a number of informal categories.
    *Utilities* are general-purpose commands useful in many applications, such as
    returning the date or counting the number of lines in a file.


    *Filters* are commands that take the results of one command and modify them in
    some way, such as removing unwanted lines or substituting one word for another.
    Many commands act as filters under the right circumstances.


    To execute a command, type it at the Bash command prompt. The prompt is usually
    a $, but often Linux distributions customize it to something else. S.u.S.E., for
    example, uses a > command prompt.


    The date command prints the current date and time on the screen.


    ```

    $ date

    Wed Apr 4 10:44:52 EDT 2001

    ```


    All files, including shell commands, are case-sensitive. By convention, all shell
    commands are in lowercase.


    ```

    $ DATE

    bash: DATE: command not found

    ```


    *Arguments* are additional information supplied to a command to change its behavior.
    The date command takes a format argument to change the appearance of the date
    and time.


    ```

    $ date ''+%H:%M''

    10:44

    ```


    *Switches* (also called “options” or “flags”) are characters preceded by a minus
    sign that enable command features. To see the date in Coordinated Universal Time
    (UTC, formerly called GMT), use the -u switch.


    ```

    $ date -u

    Wed Apr 4 14:46:41 UTC 2001

    ```


    Because the terms “options” and “flags” are used in so many contexts, they are
    referred to as switches in this book.


    Switches and arguments are collectively called *parameters*. Some commands allow
    any number of parameters or have parameters that can be arranged in complex ways.


    The GNU and Linux convention is for longer, more readable options to be proceeded
    by a double minus sign. The longer equivalent to the -u switch is --universal.


    ```

    $ date --universal

    Wed Apr 4 14:46:41 UTC 2001

    ```


    The long switches remind the reader exactly what the switch does. This makes future
    debugging of shell scripts much easier because there is no standard convention
    for the short switches across Linux commands. Most Linux commands recognize the
    long switches --help, --verbose, and --version.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Comments can be added to the end of any command or they can be typed on a line
    by themselves. Comments are denoted with a number sign (#).


    ```

    $ date --universal # show the date in UTC format

    ```


    Built-in Bash commands and most other GNU software treat -- as a special switch
    that indicates the end of a list of switches. This can be used when one of the
    arguments starts with a minus sign.


    # ## Command-Line Editing


    There are special key combinations to edit what you type or to repeat previous
    commands.


    Bash has two editing modes. These modes emulate the keys used in two popular Linux
    text editors. *Vi mode* mimics the vi and vim editors. *Emacs mode* works like
    emacs, nano or pico.


    The current editing mode can be checked with the `shopt` command. `shopt -o emacs`
    is on if you are in emacs mode. `shopt -o vi` is on if you are in vi mode. Only
    one mode can be on at a time.


    ```

    $ shopt -o emacs

    emacs on

    $ shopt -o vi

    vi off

    ```


    Regardless of the mode, the arrow keys move the cursor and step through the most
    recently executed command:


    +   - *Left arrow*—Moves back one character to the left. No characters are erased.

    +   - *Right arrow*—Moves forward one character to the right.

    +   - *Up arrow*—Moves to the previous command in the command history.

    +   - *Down arrow*—Moves to the next command in the command history (if any).


    Using the left and right arrows, the cursor moves to any position in the command.
    In the middle of a line, new text is inserted into the line without overwriting
    any old typing.


    Emacs mode is the default mode on all the major Linux distributions. The most
    common emacs keys are as follows:


    +   - **control-b**—Moves back one character to the left. No characters are erased.

    +   - **control-f**—Moves forward one character to the right.

    +   - **control-p**—Moves to the previous command in the command history.

    +   - **control-n**—Moves to the next command in the command history (if any).

    +   - **Tab key**—Finds a matching filename and completes it if there is one exact
    match.'
  merge: -1
  img_proc: true
