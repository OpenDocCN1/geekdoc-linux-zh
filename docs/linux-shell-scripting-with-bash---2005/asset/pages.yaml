  md: 'replaced. Any suffix provided by the `-s` switch or prefix provided by the
    `-P` switch are added to all surviving items. This is the final list.


    ```

    $ compgen -A directory -X tia t

    test

    texttools

    $ compgen -A directory -S ''.txt,'' -X tia t

    test.txt

    texttools.txt

    ```


    The `complete` command sets the default completion behavior when completing a
    certain command. It uses the same options as `compgen`, but saves them for future
    use with the command. You can also assign completion commands and functions this
    way.


    ```

    $ compgen -A directory t

    temp

    tia

    texttools

    $ complete -A directory -X tia ls

    $ ls t

    temp

    texttools

    $ complete -A directory -P info ls

    $ ls t Cmd=ls P=info ls

    $ complete -p ls

    complete -d -P info ls

    ```


    The `-p` (`print`) switch lists the currently defined completion for a command.


    ```

    $ complete -r ls

    $ complete -d -P info ls

    ```


    The `-r` (`remove`) command removes the defined completion.


    The `-o` (`option`) switch sets various options. `-o` `dirnames` attempts to match
    directories if no other matches exist. `-o` `filenames` allows the word to be
    altered (such as dropping a trailing slash) to help identify matches. `-o` `default`
    is the default, providing no special handling when a match fails. Newer versions
    of Bash also support `-o` `nospace`, which prevents a space from being appended
    to the end of a completed word.


    The completion commands can be combined with functions to create powerful new
    command-line utilities.


    # # Locales


    Under Linux, the language and culture of a user is represented by his or her “locale.”The
    locale information is stored in environment variables. Some of the standard ones
    are:


    +   - `LC_CTYPE`—The character classes and case conversion

    +   - `LC_COLLATE`—The collating sequence for the character set

    +   - `LC_NUMERIC`—The radix character (character used to separate number from
    base) and thousands separator

    +   - `LC_MONETARY`—Like `LC_NUMERIC`, but for formatting money'
  merge: -1
