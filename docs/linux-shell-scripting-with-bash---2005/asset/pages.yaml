    # # Arithmetic Tests


    The `test` command can compare numeric values, but it uses different operators
    than the ones used to compare string values. Because all shell variables are stored
    as strings, variables can either be compared as numbers or strings depending on
    the choice of operator. Perl programmers will find this similar to Perl. Bash
    will not report an error if string operators are used with integer variables.


    +   - n1 `-eq` n2—(*equal*) True if n1 is equal to n2

    +   - n1 `-ne` n2—(*not equal*) True if n1 is not equal to n2

    +   - n1 `-lt` n2—(*less than*) True if n1 is less than n2

    +   - n1 `-le` n2—(*less than or equal*) True if n1 is less than or equal to n2

    +   - n1 `-gt` n2—(*greater than*) True if n1 is greater than n2

    +   - n1 `-ge` n2—(*greater than or equal*) True if n1 is greater than or equal
    to n2


    For example, suppose `RESULT` contains the number of files in the current directory.


    ```

    $ RESULT=`ls -1 | wc -1`

    $ printf "4d" "$RESULT"

    22

    $ test "$RESULT" -gt 20 && printf "&s" "There are a lot of files."

    There are a lot of files.

    $ test "$RESULT" -le 20 && printf "There are few files"

    $

    ```


    These tests are not the same as the string comparison tests. Consider the following
    example.


    ```

    $ test "$RESULT" \< 3 && printf "As a string, the result is less than 3"

    As a string, the result is less than 3

    ```'
