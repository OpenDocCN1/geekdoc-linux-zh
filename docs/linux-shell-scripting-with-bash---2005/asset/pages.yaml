  md: "tr supports character equivalence. To translate any e-like characters in a\
    \ variable named FOREIGN_STRING to a plain e, for example, you use\n\n```\n$ printf\
    \ \"$FOREIGN_STRING\" | tr \"[ees]\" \"e\"\n```\n\nThe -truncate-set-n (or -t)\
    \ ignores any characters in the first parameter that don't have a matching character\
    \ in the second parameter.\n\nThe -complement (or -c) switch reverses the sense\
    \ of matching. The characters in the first parameter are not mapped into the second,\
    \ but characters that aren't in the first parameter are changed to the indicated\
    \ character.\n\n```\n$ printf \"%s\\n\" \"The cow jumped over the moon\" | tr\
    \ -complement 'aeiou' '?'  \n???e???o??uu???o??e???e???e???moo??\n```\n\nThe -squeeze-repeats\
    \ (or -s) switch reduces multiple occurrences of a letter to a single character\
    \ for each of the letters you specify:\n\n```\n$ printf \"%s\\n\" \"aaabbbccc\"\
    \ | tr -squeeze-repeats 'c'  \naaabbbc\n```\n\nBy far the most common use of tr\
    \ is to translate MS-DOS text files to Unix text files. DOS text files have carriage\
    \ returns and line feed characters, whereas Linux uses only line feeds to mark\
    \ the end of a line. The extra carriage returns need to be deleted.\n\n```\n$\
    \ tr -d '\\r' < dos.txt > linux.txt\n```\n\nApple text files have carriage returns\
    \ instead of line feeds. tr can take care of that as well by replacing the carriage\
    \ returns.\n\n```\n$ tr '\\r' '\\n' < apple.txt > linux.txt\n```\n\nThe other\
    \ escaped characters recognized by tr are as follows:\n\n+   * \\o — ASCII octal\
    \ value o (one to three octal digits)\n+   * \\\\ — Backslash\n+   * \\a — Audible\
    \ beep\n+   * \\b — Backspace\n+   * \\f — Form feed\n+   * \\n — New line\n+\
    \   * \\r — Return\n+   * \\t — Horizontal tab\n+   * \\v — Vertical tab\n\nYou\
    \ can perform more complicated file editing with the sed command, discussed next."
