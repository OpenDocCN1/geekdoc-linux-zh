  md: 'Here’s an example of some groff markup codes:


    ```

    .\$IdS

    .TH MAN 9 "25 July 1993" "Linux" "Nightlight Corporation Manual"

    .SH NAME

    ftp.sh \- script to FTP orders to suppliers

    .SH SYNOPSIS

    .B ftp.sh

    .I file

    ```


    The groff codes begin on lines by themselves with a period (.), followed by a
    one- or two-letter code. For example, the .B code indicates that the text that
    follows is bold (similar to the HTML <b> tag).


    The groff predefined macros pertaining to manual pages are documented in the section
    7 manual page on man (man 7 man). Some of the more commonly used groff codes are
    as follows:


    +   - .B—Bold

    +   - .I—Italics

    +   - .PP—Begin new paragraph

    +   - .RS i—Indent by i characters

    +   - .RE—End last RS indentation

    +   - .UR u—Begin text linked by a URL

    +   - .UE—End linked text started by .UR

    +   - .\—Indicate a comment

    +   - .TH—Heading of the page

    +   - .SH—A subheading


    Although there are no firm requirements for a manual page, most man pages include
    one or more of the following sections: SYNOPSIS, DESCRIPTION, RETURN VALUES, EXIT
    STATUS, OPTIONS, USAGE, FILES, ENVIRONMENT, DIAGNOSTICS, SECURITY, CONFORMING
    TO, NOTES, BUGS, AUTHOR, and SEE ALSO. If you are using CVS, you can include a
    CVS keyword such as $Id$ in a VERSION section.


    The easiest way to create a simple man page for your program is to find a similar
    man page and make a modified copy.


