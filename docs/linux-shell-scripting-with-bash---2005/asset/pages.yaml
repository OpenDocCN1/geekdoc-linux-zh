- pgno: 334
  md: 'Select a starting database with the `--dbname db` (or `-d db`) switch. You
    can run short queries with the `-command sqlcmd` (or `-c sqlcmd`) switch. This
    is similar to Bash''s `-e` switch. There is also a `-file` switch to run commands
    contained in a separate file.


    ```

    $ psql --user gordon --dbname custinfo --command "SELECT COUNT(*) FROM USER"  count  --------  3  (1
    row)

    ```


    psql can be used from a script to access databases. SQL commands can be redirected
    to psql through standard input. You can use `-file=''-` to provide special features
    for scripts such as line numbers on errors. A here file can be used to place the
    SQL commands immediately after invoking psql.


    ```

    psql --user gordon --dbname custinfo --file=- <<! select count(*) from products
    !

    ```


    This script fragment counts the number of products in the `products` table.


    ```

    count  -----  165  (1 row)

    ```


    Shell variables can be included in the here file to customize your SQL commands.


    ```

    declare Id=5 psql --user gordon --dbname custinfo --file=- <<! select product_name
    from products where product_id = $ID !

    ```


    The query results are placed on standard output. They can be captured using back-quotes
    or by redirecting standard output.


    ```

    RESULT=''psql --user gordon --dbname custinfo --file=- <<! select product_name
    from products where product_id = $ID !''

    ```


    or even


    ```

    RESULT=`printf ''%s'' "select product_name from products where product_id = $ID"
    | psql --user gordon --dbname custinfo --file=-`

    ```


    psql displays the results of commands with column headings, borders, and totals.
    Although these are attractive for interactive sessions, they create more work
    for scripts. These formatting features can be turned off using the appropriate
    switches.


    ```

    psql --user gordon --dbname custinfo --file=^- -quiet --no-align --tuples-only
    \ --field-separator ""," -file "-" <<!

    ```'
