- pgno: 206
  md: 'Using `tee`, a program can write to two or more named pipes simultaneously.


    Because a named pipe is not a regular file, commands such as `grep`, `head`, or
    `tail` can behave unexpectedly or block indefinitely waiting for information on
    the pipe to appear or complete. If in doubt, verify that the file is not a pipe
    before using these commands.


    # # Process Substitution


    Sometimes the vertical bar pipe operators cannot be used to link a series of commands
    together. When a command in the pipeline does not use standard input, or when
    it uses two sources of input, a pipeline cannot be formed. To create pipes when
    normal pipelines do not work, Bash uses a special feature called *process substitution*.


    When a command is enclosed in `<(...)`, Bash runs the command separately in a
    subshell, redirecting the results to a temporary named pipe instead of standard
    input. In place of the command, Bash substitutes the name of a named pipe file
    containing the results of the command.


    Process substitution can be used anywhere a filename is normally used. For example,
    the Linux `grep` command, a file–searching command, can search a file for a list
    of strings. A temporary file can be used to search a log file for references to
    the files in the current directory.


    ```

    $ ls -1 > temp.txt

    $ grep -f temp.txt /var/log/nightrun_log.txt

    Wed Aug 29 14:18:38 EDT 2001 invoice_error.txt deleted

    $ rm temp.txt

    ```


    A pipeline cannot be used to combine these commands because the list of files
    is being read from `temp.txt`, not standard input. However, these two commands
    can be rewritten as a single command using process substitution in place of the
    temporary filename.


    ```

    $ grep -f <(ls -1) /var/log/nightrun_log.txt

    Wed Aug 29 14:18:38 EDT 2001 invoice_error.txt deleted

    ```


    In this case, the results of `ls -1` are written to a temporary pipe. `grep` reads
    the list of files from the pipe and matches them against the contents of the `nightrun_log.txt`
    file. The fact that Bash replaces the `ls` command with the name of a temporary
    pipe can be checked with a `printrf` statement.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '```

    $ printf *%s\n* <(ls -1)

    /dev/ fd/ 63

    ```


    Bash replaces ` -f < (ls -1)` with ` -f / dev/ fd/ 63`. In this case, the pipe
    is opened as file descriptor ` 63`. The left angle bracket `< >` indicates that
    the temporary file is read by the command using it. Likewise, a right angle bracket
    `( >)` indicates that the temporary pipe is written to instead of read.


    # # Opening Files


    Files can be read by piping their contents to a command, or by redirecting the
    file as standard input to a command or group of commands. This is the easiest
    way to see what a text file contains, but it has two drawbacks. First, only one
    file can be examined at a time. Second, it prevents the script from interacting
    with the user because the `read` command reads from the redirected file instead
    of the keyboard.


    Instead of piping or redirection, files can be opened for reading by redirecting
    the file to a descriptor number with the `exec` command, as shown in Listing 11.6.


    Listing 11.6 open_file.sh


    ```

    #!/bin/bash

    #

    # open_file.sh: print the contents of orders.txt


    s h o p t - s - O n o u s e t


    d e c l a r e L I N E


    e x e c 3 < o r d e r s . t x t

    w h i l e r e a d L I N E < 6 3 ; d o

    p r i n t f "% s \n " "$LINE"

    d o n e

    e x i t 0

    ```


    In this case, the file orders.txt is redirected to file descriptor 3. Descriptor
    3 is the lowest number that programs can normally use. File descriptor 0 is standard
    input, file descriptor 1 is standard output, and file descriptor 2 is standard
    error.


    The `read` command receives its input from descriptor 3 (orders.txt), which is
    being redirected by `<.`. read can also read from a particular file descriptor
    using the Korn shell -u switch.


    If the file opened with `exec` does not exist, Bash reports a `bad file number`
    error. The file descriptor must also be a literal number, not a variable.


    If `exec` is not used, the file descriptor can still be opened but it cannot be
    reassigned.


    ```

    3< orders.txt

    3< orders2.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 208
  md: "In this example, file descriptor 3 is *orders*.txt. The second line has no\
    \ effect because descriptor 3 is already opened. If *exec* is used, the second\
    \ line re-opens descriptor 3 as *orders2*.txt.\n\nTo save file descriptors, *exec*\
    \ can copy a descriptor to a second descriptor. To make input file descriptor\
    \ 4 the same file as file descriptor 3, do this\n\n```\nexec 4<&3\n```\n\nNow\
    \ descriptor 3 and 4 refer to the same file and can be used interchangeably. Descriptor\
    \ 3 can be used to open another file and can be restored to its original value\
    \ by copying it back from descriptor 4. If descriptor 4 is omitted, Bash assumes\
    \ that you want to change standard input (descriptor 0).\n\nYou can move a file\
    \ descriptor by appending a minus sign to it. This closes the original file after\
    \ the descriptor was copied.\n\n```\nexec 4<&3-\n```\n\nYou can likewise duplicate\
    \ output file descriptors with *>&* and move them by appending a minus sign. The\
    \ default output is standard output (descriptor 1).\n\nTo open a file for writing,\
    \ use the output redirection symbol *(&)*.\n\n```\nexec 3>orders.txt\nexec 4>&3\n\
    while read LINE <&3 ; do\n    printf \"${A}n\\\" \"$LINE\" >&4\ndone\n```\n\n\
    The *<&* symbol opens a file for both input and output.\n\n```\nexec 3<>orders.txt\n\
    ```\n\nThe reading or writing proceeds sequentially from the beginning of the\
    \ file. Writing to the file overwrites its contents. As long as the characters\
    \ being overwritten are the same length as the original characters, the new characters\
    \ replace the old. If the next line in a file is *dog*, for example, writing the\
    \ line *cat* over *dog* replaces the word *dog*. However, if the next line in\
    \ the file is *horse*, writing *cat* creates two lines—the line *cat* and the\
    \ line *se*. The linefeed character following *cat* overwrites the letter *r*.\
    \ The script will now read the line *se*.\n\n*<&* has limited usefulness with\
    \ regular files because there is no way to “back up” and rewrite something that\
    \ was just read. You can only overwrite something that you are about to read next.\n\
    \nThe script in Listing 11.7 reads through a file and appends a “*Processed* on”\
    \ message to the end of the file."
  merge: -1
  img_proc: true
- pgno: 209
  md: "# Listing 11.7  open_files2.sh\n\n```\n#!/bin/bash\n#\n# open_files2.sh\n\n\
    shopt -o -S nounset\n\ndeclare LINE\n\nexec 3>orders.txt\nwhile read LINE <&3\
    \ ; do\n    printf \"%s\\n\" \"$LINE\"\ndone\nprintf \"\\n\" \"Processed on \"\
    'date' >&3\nexit 0\n```\n\n`<>` is especially useful for socket programming, which\
    \ is discussed in Chapter 16, “Network Programming.”\n\nAs files can be opened,\
    \ so they can also be closed. An input file descriptor can be closed with `<&-`.\
    \ Be careful to include a file descriptor because, without one, this closes standard\
    \ input. An output file descriptor can be closed with `>&-`. Without a descriptor,\
    \ this closes standard output.\n\nAs a special Bash convention, file descriptors\
    \ can be referred to by a pathname. A path in the form of `/dev/fd/n` refers to\
    \ file descriptor `n`. For example, standard output is `/dev/fd/1`. Using this\
    \ syntax, it is possible to refer to open file descriptors when running Linux\
    \ commands.\n\n```\n$ exec 4>results.out\n$ printf \"\\n\" \"Send to fd 4 and\
    \ standard out\" | tee /dev/fd/4\nSend to fd 4 and standard out\n$ exec 4>&-\n\
    $ cat results.out\nSend to fd 4 and standard out\n```\n\n# Using head and tail\n\
    \nThe Linux `head` command returns the first lines contained in a file. By default,\
    \ `head` prints the first 10 lines. You can specify a specific number of lines\
    \ with the `-lines=n` (or `-n n`) switch.\n\n```\n$ head -lines=5 orders.txt\n\
    Birchwood China Hutch, 475, 99, 1, 756\nBookcase Oak Veneer, 205, 99, 1, 756\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 210
  md: '```

    Small Bookcase Oak Veneer,205.99,1,756

    Reclining Chair,1599.99,1,757

    Bunk Bed,705.99,1,757

    ```


    You can abbreviate the --lines switch to a minus sign and the number of lines.


    ```

    $ head -3 orders.txt

    Birchwood China Hutch,475.99,1,756

    Bookcase Oak Veneer,205.99,1,756

    Small Bookcase Oak Veneer,205.99,1,756

    ```


    The amount of lines can be followed by a c for characters, an l for lines, a k
    for kilobytes, or an m for megabytes. The -bytes (or -c) switch prints the number
    of bytes you specify.


    ```

    $ head -9c orders.txt

    Birchwood

    $ head -bytes=9 orders.txt

    Birchwood

    ```


    The Linux tail command displays the final lines contained in a file. Like head,
    the amount of lines or bytes can be followed by a c for characters, an l for lines,
    a k for kilobytes, or an m for megabytes.


    The switches are similar to the head command. The -bytes=n (or -c) switch prints
    the number of bytes you specify. The -lines=n (-n) switch prints the number of
    lines you specify.


    ```

    $ tail -3 orders.txt

    Walnut TV Stand,388.99,1,756

    Victorian-style Sofa,1225.99,1,757

    Grandfather Clock,2045.99,1,756

    ```


    Combining tail and head in a pipeline, you can display any line or range of lines.


    ```

    $ head -5 orders.txt | tail -1

    Bunk Bed,705.99,1,757

    ```


    If the starting line is a plus sign instead of a minus sign, tail counts that
    number of lines from the start of the file and prints the remainder. This is a
    feature of tail, not the head command.


    ```

    $ tail +17 orders.txt

    Walnut TV Stand,388.99,1,756

    Victorian-style Sofa,1225.99,1,757

    Grandfather Clock,2045.99,1,756

    ```


    When using head or tail on arbitrary files in a script, always check to make sure
    that the file is a regular file to avoid unpleasant surprises.'
  merge: -1
