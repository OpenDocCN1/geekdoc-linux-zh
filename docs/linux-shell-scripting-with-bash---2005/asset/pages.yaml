  md: 'The -t switch displays an additional total line.


    ```

    $ free -t

    Mem: total used free shared buffers cached

    61792 58760 3032 10136 36152 8988

    -/+ buffers/cash: 13620 48172

    Swap: 514072 8180 505892

    Total: 575864 66940 508924

