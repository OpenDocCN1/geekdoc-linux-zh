- pgno: 154
  md: '# # Watching Running Scripts


    To test cron scripts without installing them under `cron`, use the `watch` command.
    `watch` periodically `re-runs` a command and displays the results on the screen.
    `watch` runs the command every two seconds, but you can specify a different number
    of seconds with the `--interval=` (or `-n`) switch. You can filter the results
    so that only differences are shown (`--differences` or `-d`) or so that all the
    differences so far are shown (`--differences=cumulative`).


    # ## Timing Execution with Time


    There are two commands available for timing a program or script.


    The `Bash` built-in command `time` tells you how long a program took to run. You
    can also use `time` to time a series of piped commands. Except for the real time
    used, the statistics returned by `time` refer to the system resources used by
    the script and not any of the commands run by the `script`.


    The results are formatted according to the value of the `TIMEFORMAT` variable.
    The layout of `TIMEFORMAT` is similar to the `date` command formatting string
    in that it uses a set of `%` format codes.


    +   * `$$` —A literal `%`.

    +   * `%` `[precision]` `[I]` `R` —The real time; the elapsed time in seconds.

    +   * `%` `[precision]` `[I]` `U` —The number of `CPU` seconds spent in user mode.

    +   * `%` `[precision]` `[I]` `S` —The number of `CPU` seconds spent in system
    mode.

    +   * `%` `P` —The `CPU` percentage, computed as `( $U + $S ) / $R`.


    The `precision` indicates the number decimal positions to show, with a default
    of `3`. The character `I` (`iong`) prints the value divided into minutes and seconds.
    If there is no `TIMEFORMAT` variable, `Bash` uses `\nreal` `\t$*3` `R\nuser` `\t$*3`
    `U\nsys\n$*3` `S`.


    ```

    $ unset TIMEFORMAT

    $ time ls > /dev/null

    real    0m0.018s

    user    0m0.010s

    sys     0m0.010s

    ```


    ```

    $ declare -x TIMEFORMAT="$P"

    $ time ls > /dev/null

    75.34

    ```


    ```

    $ declare -x TIMEFORMAT="The real time is %lR"

    $ time ls > /dev/null

    The real time is 0m0.023s

    ```


    Notice the times can vary slightly between the runs because other programs running
    on the computer affect them. To get the most accurate time, test a script several
    times and take the lowest value.'
