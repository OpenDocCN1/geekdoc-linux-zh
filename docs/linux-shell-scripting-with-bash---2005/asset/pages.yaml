- pgno: 345
  md: "```\n$ du -summarize --human-readable\n36M\t\t.\n$ du -summarize --human-readable\
    \ . archive\n36M\t\t.\n28M\t\tarchive\n```\n\nFor scripts, there are a number\
    \ of switches controlling how the results are grouped and what units are used.\
    \ The space totals can be in −bytes (or −b), −kilobytes (or −k), −megabytes (or\
    \ −m), or blocks of −blocksize=b bytes. The default units are kilobytes. The −si\
    \ (or −h) switch uses units of 1000 instead of 1024. You can determine a −total\
    \ (or −c) for all files on the command line, as well as totals for −all (or −a)\
    \ all files within directories. −separate-dirs (or −s) shows the totals for subdirectories,\
    \ the default behavior.\n\nThe amounts and the filenames are separated by a Tab\
    \ character. To extract one column or the other, use the cut command.\n\n```\n\
    $ TAB='printf \\t'\n$ du −all −kilobytes incoming_orders | cut −d\"$TAB\" −f1\n\
    20\n12\n40\n56\n132\n```\n\nOther switches affect the way files are searched.\
    \ The −dereference-args (or −D) switch dereferences paths that are symbolic links.\
    \ The −count-links (−l) switch counts each hard link to the same file as separate\
    \ files. The −one-file-system (−x) switch constrains the search to the current\
    \ file system. The search can be constrained to −max-depth=n levels of subdirectories,\
    \ or can exclude any files with −exclude=ℓ or a list of files in a file ℓ with\
    \ −exclude-from=ℓ (or −X ℓ) .\n\n# ## Memory Usage\n\nThe Linux `free` command\
    \ reports the memory usage on the system.\n\n```\n$ free\n\t\ttotal\tused\tfree\t\
    shared\tbuffers\tcached\nMem:\t\t61792\t58756\t3036\t10116\t36152\t8988\n/+ buffers/cache:\t\
    13616\t48176\nSwap:\t\t514072\t8180\t505892\n```\n\nThe total, used, and free\
    \ columns are the total amount of memory, the amount of memory currently used\
    \ by the Linux kernel, and the amount of free memory, respectively. The free and\
    \ used columns always add up to the total. The last three columns show how the\
    \ used memory is allocated; within shared memory, buffers, or caches. The final\
    \ line shows the swap space allocated, used, and free on disk."
