- pgno: 308
  md: '# # CGI Environment Variables


    CGI programs have additional environment variables assigned by the Web server.
    Different Web servers include different variables. Here is a list of some common
    variables:


    +   - AUTH_TYPE—Authorization type if pages are password protected

    +   - CONTENT_LENGTH—Number of bytes being written to standard input (for POST
    forms)

    +   - CONTENT_TYPE—The form''s content type

    +   - DOCUMENT_ROOT—The root directory of the Web server''s document tree

    +   - GATEWAY_INTERFACE—The version of the CGI standard being used by the Web
    server

    +   - HTTP_ACCEPT—Types of data acceptable to the browser (for example, `text/html`)

    +   - HTTP_ACCEPT_CHARSET—Character set requested by the Web browser

    +   - HTTP_ACCEPT_ENCODING—Compression methods allowed by the Web browser (for
    example, `gzip`)

    +   - HTTP_ACCEPT_LANGUAGE—Language requested by the Web browser (for example,
    `en for English`)

    +   - HTTP_USER_AGENT—The browser used by the user

    +   - HTTP_HOST—The URL''s hostname

    +   - HTTP_REFERER—The Web page executing this CGI program

    +   - PATH_INFO—Extra information included in the URL

    +   - PATH_TRANSLATED—PATH_INFO, as a file/directory under the root of the document
    tree

    +   - QUERY_STRING—for GET forms, the variables on the form

    +   - REMOTE_ADDR—IP of the user''s computer

    +   - REMOTE_HOST—Hostname of the user''s computer

    +   - REMOTE_USER—Username used when accessing password-protected pages

    +   - REQUEST_METHOD—Usually `GET` or `POST`

    +   - SCRIPT_NAME—Pathname of the script being executed

    +   - SCRIPT_FILENAME—The absolute pathname of the script being executed

    +   - SERVER_ADDR—IP address of the Web server

    +   - SERVER_ADMIN—Email address to email messages to the person in charge of
    the Web server

    +   - SERVER_NAME—Domain name of the Web server'
  merge: -1
  img_proc: true
- pgno: 309
  md: '+   • `SERVER_PORT`—The TCP/IP port used to connect to the Web server


    +   • `SERVER_PROTOCOL`—Version of HTTP used by the server


    +   • `SERVER_SOFTWARE`—Description of the Web server


    # # Processing Forms


    The HTML equivalent of environment variables is the form. Each form contains a
    set of variables. For example, the form input tag


    ```

    `<input type ''hidden" name="user" value="bmith">`

    ```


    is the HTML equivalent of


    ```

    `declare user="bmith"`

    ```


    Other nonhidden input tags represent variables whose values can be changed by
    the user through items on the form. Such items include buttons, menus, and text
    boxes. In all these cases, the choices made by the user are saved as new values
    of the variable before the form is sent to a CGI script.


    Because the CGI script doesn''t receive a copy of the Web page, how then does
    it know the values of the input tags? There are two methods. The older **GET**
    method stores the HTML variables in an environment variable called `QUERY_STRING`.
    Consider the following form.


    ```

    """

    <html>

    <head>

    <title>Form Test</title>

    </head>

    <body>

    <form action="http://localhost/cgi-bin/form.cgi">

    <input type="hidden" name="user" value="bmith">

    <input type="submit" name="submit" value="Click Me!">

    </form>

    </body>

    </html>

    """

    ```


    The query string contains the names and values of the two variables.


    user=bmith&submit=Click+Me%21


    One of the reasons forms are difficult to work with is that the information is
    encoded. The standard form encoding (x-www-form-urlencoded) converts spaces to
    plus signs and non-alphanumeric characters to ASCII hexadecimal numbers with leading
    percent signs. In this case, the exclamation point is converted to hexadecimal
    21.


    The **POST** method writes the variables to standard input, eliminating the risk
    of a buffer overflow in the Web server if the list of variables becomes very long.
    It also keeps the variables off of the Web page URL. If a script reads the variables
    in a while loop, the final line is not executed in the while because the line
    doesn''t end in a line feed.'
  merge: -1
  img_proc: true
- pgno: 310
  md: "```\nwhile read LINE ; do\n    echo \"&LINE&cr />\"\ndone\n    echo \"&LINE&cr\
    \ />\"\n```\n\nThis displays the same encoded information that appears in QUERY_STRING\
    \ when the GET method is used.\nuser=&smith&#amp;smith=Click=Me%21\n\nThe form.cgi\
