- pgno: 150
  md: "There are no special requirements for the software being added to the repository.\
    \ However, when a program is added or updated, CVS read through the file looking\
    \ for special strings. If they are present, CVS replaces these strings with the\
    \ latest information about this copy of the program. CVS documentation refers\
    \ to these strings as *keywords*, although they are not keywords in the Bash sense.\n\
    \n+   • $Author$—The login name of the user who checked in the revision.\n+  \
    \ \n+   • $Date$—The date and time (UTC) the revision was checked in.\n+   \n\
    +   • $Header$—A standard header containing the full pathname of the RCS file,\
    \ the revision number, the date (UTC), the author, and so forth.\n+   \n+   •\
    \ $Id$—Same as $Header$, except that the RCS filename is without a path.\n+  \
    \ \n+   • $Name$—If tags are being used, this is the tag name used to check out\
    \ this file.\n+   \n+   • $Locker$—The login name of the user who locked the revision\
    \ (empty if not locked, which is the normal case unless *cvs admin -l* is in use).\n\
    +   \n+   • $Log$—The log message supplied during the commit, preceded by a header\
    \ containing the RCS filename, the revision number, the author, and the date (UTC).\
    \ Existing log messages are not replaced. Instead, the new log message is inserted\
    \ after *$Log$*.\n\n+   • $RCSfile$—The name of the CVS file without a path.\n\
    +   \n+   • $Revision$—The revision number assigned to the revision.\n+   \n+\
    \   • $Source$—The full pathname of the CVS file.\n+   \n+   • $State$—The state\
    \ assigned to the revision.\n\nThe CVS keywords can be added anywhere in a script,\
    \ but they should appear in a comment or in a quoted string if not in a comment.\
    \ This prevents the keyword from being treated as an executable shell command.\n\
    \n```\n# CVS: $Header$ \n\nWhen the script is added to the repository, CVS will\
    \ fill in the header information.\n\n# CVS: $Header: /home/repository/scripts/t.sh,v\
    \ 1.1 2001/03/26 \n20:35:27 kburch Exp $\n```\n\nThe CVS keyword header should\
    \ be placed in the header of a script.\n\n```\n#!/bin/bash\n#\n# flush.sh: Flush\
    \ disks if nobody is on the computer\n#\n# Ken O. Burch\n# CVS: $Header$\n```\n\
    \nCVS is controlled using the Linux *cvs* command. *cvs* is always followed by\
    \ a CVS command word and any parameters for that command."
  merge: -1
  img_proc: true
- pgno: 151
  md: "To add a new project directory to the CVS repository, use the **import** command.\
    \ **Import** places the current directory's files in the repository under the\
    \ specified name. **Import** also requires a short string to identify who is adding\
    \ the project and a string to describe the state of the project. These strings\
    \ are essentially comments and can be anything: Your login name and **init-rel**\
    \ for initial release are good choices.\n\n```\n$ cvs import scripts kburcht init-rel\n\
    ```\n\nCVS starts your default text editor as indicated by the environment variables\
    \ **EDITOR** or **CVSEDITOR**. CVS doesn't recognize the **VISUAL** variable.\
    \ The file to be edited contains comment lines marked by a leading **CVS**: \n\
    \n```\nCVS:  \nCVS: Enter Log. Lines beginning with `CVS:' are removed automatically\
    \  \nCVS:  \nCVS:\n```\n\nWhen you are finished editing, CVS adds your program\
    \ to the repository, recording your comments in the change log. The results are\
    \ written to screen.\n\n```\nN scripts/ftp.sh\nNo conflicts created by this import\n\
    ```\n\nThe N **scripts/ftp.sh** line indicates that CVS created a new project\
    \ called **scripts** and added the Bash script **ftp.sh** to it. **ftp.sh** is\
    \ now stored in the CVS repository, ready to be shared among the development team\
    \ members. It is now safe to delete the project directory from your directory.\
    \ In fact, it must be deleted before work can continue on the project.\n\nUse\
    \ the CVS command **checkout** (or **co**) to work on a project. This CVS command\
    \ saves a copy of the project in the current directory. It also creates a CVS\
    \ directory to save private data files used by CVS.\n\nTo use **checkout**, move\
    \ to your home directory and type:\n\n```\n$ cvs checkout scripts\ncvs checkout:\
    \ Updating .\nU scripts/ftp.sh\n```\n\nThe subdirectory called **scripts** contains\
    \ personal copies of project files from the repository. CVS maintains the original\
    \ copy of **ftp.sh**. Another programmer can also **checkout** **ftp.sh** while\
    \ you are working on your personal copy.\n\nTo add new files or directories to\
    \ the project directory, use the **add** command. To add a file called **process_orders.sh**,\
    \ use this:\n\n```\n$ cvs add process_orders.sh\n```\n\nAs you work on your scripts,\
    \ periodically check your work against the repository using the **update** command.\
    \ If another programmer makes changes to the scripts, CVS will update your project\
    \ directory to reflect the changes to the scripts. Any changes you have made,\
    \ however, will not yet be added to the repository copies."
