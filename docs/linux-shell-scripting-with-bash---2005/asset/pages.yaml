  md: "# Listing 14.6 **Continued**\n\n```\n# run the script\n\n$SCRIPT2RUN 2>&1 >\
    \ \"$OUTPUT\"\n\n# mail errors to USER\n\nif [ $? -ne 0 ] ; then\n    $mail -s\
    \ \"$SCRIPT2RUN failed\" \"$USER\" < \"$OUTPUT\"\nfi\n\n# cleanup\n\nrm \"$OUTPUT\"\
    \nexit 0\n```\n\n# ## Writing Continually Executing Scripts\n\nA **daemon** is\
    \ a program that runs independently of a shell session, continually performing\
    \ some task. Server software, for example, is almost always a daemon because it\
    \ runs continually, waiting for clients to request services.\n\nThe Linux **nohup**\
    \ (*no hang up*) command runs a program so that it will not quit after a session\
    \ has disconnected. You need this command if you want to start daemons interactively\
    \ from the command line. *nohup* reduces the priority of a program slightly and,\
    \ if standard output is open, redirects it to a file called **nohup.out** because,\
    \ the moment the shell session terminates, there will no longer be a standard\
    \ output to write to.\n\nGenerally speaking, a front-end script is necessary to\
    \ set up and start the daemon script. To avoid the **nohup.out** file, it's good\
    \ design practice to close standard output or redirect it using *exec* with a\
    \ front-end script to the daemon script. Also, *nohup* does not automatically\
    \ place a command in the background. The front-end script has to do this with\
    \ an *&*.\n\nFor example, Listings 14.7 and 14.8 show a pair of scripts that check\
    \ files coming into a directory called **ftp_incoming**.\n\n# Listing 14.7 ftp_daemon.sh\n\
    \n```\n#!/bin/bash\n#\n# ftp_daemon.sh: a script fragment for the wrapper.\n\n\
    shopt -s -o nounset\n\ndeclare -rx SCRIPT=${0##*/}\ndeclare -rx INCOMING_FTP_DIR=\"\
    /home/ftp/ftp_incoming\"\n```"
