  md: "```\nselect * from products\n;\n```\n\nThe results are displayed in CSV (comma-separated\
    \ value) format. `--no-align` (or `-A`) removes the whitespace padding between\
    \ the columns. `--field-separator` `,` (or `-F` `,`) separates columns with a\
    \ particular character; in this case, they are separated with commas. `--tuples_only`\
    \ (or `-t`) removes the headings and totals. Finally, progress information is\
    \ suppressed with `--quiet` (or `-q`).\n\nPostgreSQL has an unusual set of status\
    \ codes. It returns a status code of 0 on success or a 1 if an internal error\
    \ occurred (for example, unable to allocate memory). 2 if the client was disconnected,\
    \ or 3 if the SQL commands were aborted because of an error. The 3 code occurs\
    \ only if you declare a variable called `ON_ERROR_STOP`; Unless this variable\
    \ exists, PostgreSQL ignores the error and continues with the next database command;\
    \ it does not report a problem.\n\nBecause of this status code scheme, if the\
    \ script looks for a SQL command file with the `--file` switch and the file doesn’t\
    \ exist, psql returns a successful status. It’s very important to check all files\
    \ prior to executing psql.\n\nListing 17.4 shows a complete example that executes\
    \ a set of SQL commands stored in a separate file.\n\n# **Listing 17.4** show_users.sh\n\
    \n```\n#!/bin/bash\n#\n# show_users.sh: show all users in the database table \"\
    users\"\n\nshopt -s o_nounset\n\ndeclare -rx SCRIPT=$0${##*/}\ndeclare -r SQL_CMDS=\"\
    sort_inventory.sql\"\ndeclare -rx ON_ERROR_STOP\n\nif [ ! -r \"${SQL_CMDS}\" ];\
    \ then\n  printf \"${SCRIPT}: the SQL script ${SQL_CMDS} doesn’t exist or is not\
    \ \\\nreadable\" >&2\n  exit 192\nfi\n\nRESULTS=`psql --user gordon --dbname custinfo\
    \ --quiet --no-align --tuples-only \\\n--field-separator \",\" --file \"${SQL_CMDS}\"\
    `\nif [ $! -ne 0 ]; then\n  printf \"${SCRIPT}: SQL statements failed.\" >&2\n\
    \  exit 192\nfi\n```"
