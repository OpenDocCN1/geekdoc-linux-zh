  md: 'to write the message "The processing is complete" to a file named results.txt,
    you use


    ```

    printf "The processing is complete" > results.txt

    ```


    The > operator always overwrites the named file. If a series of printf messages
    are redirected to the same file, only the last message appears.


    To add messages to a file without overwriting the earlier ones, Bash has an append
    operator, >>. This operator redirects messages to the end of a file.


    ```

    printf "The processing is complete" >> results.txt

    printf "There were no errors" >> results.txt

    ```


    The results.txt file contains these two lines:


    ```

    The processing is complete

    There were no errors

    ```


    In the same way, input can be redirected to a command from a file. The input redirection
    symbol is <. For example, the wc (word count) utility gathers statistics about
    a file. To count the number of lines in a file, use


    ```

    wc -lines < purchase_orders.txt

    ```


    wc -lines treats the contents of purchase_orders.txt as if it were typed in from
    the keyboard.


    Instead of files, the results of a command can be redirected as input to another
    command. This process is called piping and uses the vertical bar (or pipe) operator
    |.


    ```

    who | wc -lines   # count the number of users

    ```


    Any number of commands can be strung together with vertical bar symbols. A group
    of such commands is called a pipeline.


    If one command ends prematurely in a series of pipe commands, for example, because
    you interrupted a command with a control-c, Bash displays the message “Broken
    Pipe” on the screen.


    The lines following a command can also be read and processed by the command. The
    operator << treats the lines following it in a script as if they were typed from
    the keyboard. The operator needs to be followed by a marker that denotes the end
    of the lines.'
