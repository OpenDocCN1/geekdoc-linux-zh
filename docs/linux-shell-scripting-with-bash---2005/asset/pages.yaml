    semicolon, the command separator, and expects a new statement to follow. It tries
    to execute the *Paris* command (there is none). It tries to do the same with the
    *New* command, giving it the *York* argument.


    For this reason, it is a safe practice to enclose all assignment values in double
    quotation marks. Even if your company only has a distribution center in London,
    there’s always the chance that a new distribution center will be added to the
    string, causing the shell script to crash. Always enclosing values in quotes ensures
    that Bash knows exactly what value is to be assigned.


    ```

    $ DISTRIBUTION_CENTERS="Londan ; Paris ; New York"

    $ printf "%s" $DISTRIBUTION_CENTERS

    Londan; Paris; New York

    ```


    The results are still not correct. Bash took the `DISTRIBUTION_CENTERS` value
    and removed the spaces so that `printf` doesn’t interpret it as separate arguments
    of *London*, `;`, *Paris*, `;`, *New*, and *York*. The `printf` argument must
    also be enclosed in double quotes to keep the value of the variable as a single
    argument with the spacing intact.


    ```

    $ printf "%s" "$DISTRIBUTION_CENTERS"

    London ; Paris ; New York

    ```


    Again, it is a safe practice to always enclose variable substitutions with quotes.
    Because the quotation marks are not delimiters but hints on how to interpret special
    characters, they can be used back-to-back. This is a convenient way to separate
    variables from the surrounding text in a string.


    ```

    $ TAX=7.25

    $ TAX_MESSAGE="The tax is "$TAX"%"

    $ printf "%s" "$TAX_MESSAGE"

    The tax is 7.25%

    ```'
