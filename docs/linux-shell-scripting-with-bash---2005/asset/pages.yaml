- pgno: 287
  md: '# 15

    Shell Security


    **S**ystem security can often be a two-edged sword. Many companies spend large
    sums of money on system administration tools; often then inadequately train their
    admin staff. The first word of system resource shortages invariably comes from
    the programmers themselves.


    At one company I worked for, the official policy was to prevent the programmers
    on the system from accessing the performance monitoring utilities. When head of
    administration discovered the tools were accessible, he ordered them to be made
    secure. After a couple of weeks, the staff silently enabled the utilities again
    because disabling them bottled up the company’s first line of defense.


    Security in a shell script, like system security, is a matter not of tightening
    everything to the point that the script barely functions, but of ensuring that
    the script doesn’t make any unnecessary assumptions that make porting to a new
    system or debugging a difficult problem worse later. It involves making your scripts
    crash-proof in case of an emergency or during the malicious sabotage of a coworker.
    Like using the `nounset` shell option, more security means less maintenance.


    # The Basic Linux Security Model


    All files on Linux are owned by an owner and a group. But who owns a file? Each
    file is assigned the user ID number of a particular login. Users are further divided
    into groups, and each user is assigned a group number. Originally, Unix assigned
    users to a single group, called the primary `gid`. BSD 4.3 introduced additional
    supplemental groups. In terms of files, a user must have a primary or supplemental
    group that matches the file `GID` in order to qualify for group access.


    Each Linux user has a `uid` (a user ID number) and every file on a Linux system
    has a `uid` number that indicates who owns that file.


    The `numeric-uid-gid` 1a switch shows the octal numbers instead of the names of
    the file’s `uid` and `gid` owners.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '$ id

    uid=500(ken) gid=100(users) groups=100(users),14(uucp),16(dialout)

    $ ls -numeric -uid -gid -l

    total 11068

    drwx— 2 500 100 4096 Dec 5 2000 Mail

    drwxr-xr-x 11 500 100 4096 Jan 23 00:52 archive

    -rw-r-r— 1 500 100 267 Nov 30 09:33 script.sh

    -rw-r-r— 1 500 100 36 Feb 12 11:51 company.txt

    -rw-r-r— 1 499 100 309 Feb 12 15:45 eval_example.sh


    Most of the files are owned by user 500 (ken) and primary group 100 (users). Because
    my login is ken, I qualify for owner''s access rights on all files except the
    last one. Because eval_example.sh is owned by someone else but is in one of my
    groups, group access rights apply if I try to access the file.

    Only the owner of a file can delete it.

    Each file has a file access permissions number that indicates which users can
    access it. Each bit in the file permissions represents the right to perform certain
    kinds of actions such as reading the file, writing the file, or executing a program.


    The file permissions are grouped into sets of three bits. Each set represents
    access rights for a particular kind of user. Because three bits form one octal
    (base 8) digit, permissions are often written as four octal digits. The right-most
    digit represents the access rights for users not in any other category: These
    are commonly called “other” or “world” permissions. The second digit from the
    right represents the access rights for users in the same group as the file. The
    third digit represents the access rights for the file''s owner. For example, the
    /tmp directory has user permission numbers of 777, which indicate full rights
    to any user.


    For directories, read access indicates the capability to read the directory''s
    contents. Write access enables a user to create new files in the directory, effectively
    “writing” a new directory entry. Because directories can never be executed, the
    execute permission enables a program to search the contents of the directory.
    Without execution permissions, users can run a program in a directory only if
    they know the name.


    The meaning of the bits within each set of three is partially determined by the
    kind of file. The left bit indicates the capability to read a file. The middle
    bit enables writing. The right bit enables the file to be executed, or in the
    case of a directory, the capability to move the current directory to that directory.
    A common user permission number of 755 indicates a file can be read or executed
    by anyone, but only the file''s owner can make changes.


    The following is a complete breakdown of the bits.


    +   * 1 (octal 1)—Others execute

    +   * 2 (octal 2)—Others write

    +   * 4 (octal 4)—Others read

    +   * 8 (octal 10)—Group execute'
  merge: -1
  img_proc: true
- pgno: 289
  md: '+   * 16 (octal 20)—Group write

    +   * 32 (octal 40)—Group read

    +   * 64 (octal 100)—User execute

    +   * 128 (octal 200)—User write

    +   * 256 (octal 400)—User read

    +   * 512 (octal 1000)—Sticky bit

    +   * 1024 (octal 2000)—Set gid

    +   * 2048 (octal 4000)—Set uid


    The `la` command doesn’t display the octal digits. Instead, it displays the list
    of bits, `-rwxrwxrwx.` When the letter appears, the corresponding bit is on. A
    minus sign indicates that the access right is turned off.


    The actual Linux security model is much more complex with more types of ID numbers,
    but these don’t affect shell scripting. The fourth and left-most permissions digit
    represents access rights for special programs and directories. These are covered
    in the section on chmod, later in this chapter. Normally, this digit is a zero.


    The superuser, root, or uid 0 always has full access to all files.


    # Knowing Who You Are (id)


    The Linux `id` command identifies your login name and group and any supplementary
    groups you belong to. The command displays both the names and the corresponding
    numbers.


    ```

    ```

    $ id

    uid=503 (kburtch) gid=503 (kburtch) groups=503 (kburtch)

    ```

    ```


    Any files created under the current session are owned by the `uid` and belong
    to the group `gid`.


    ```

    ```

    $ touch temp.txt

    $ ls -1 temp.txt

    -rw-rw-r-- 1 kburtch kburtch 0 Jun 25 11:45 temp.txt

    ```

    ```


    The various ID switches hide parts of the information. The `--user` (or `-u`)
    switch prints only the `uid` information. The `--group` (or `-g`) switch prints
    only the group information. The `--groups` (or `-G`) switch prints only the supplementary
    groups information. The `--real` (or `-r`) switch displays real, instead of effective,
    uids or gids. The `--name` (or `-n`) switch displays only names, not the numeric
    values.


    ```

    ```

    $ id --user --real --name

    kburtch

    ```

    ```'
