- pgno: 253
  md: '# 13


    # Console Scripting


    IN ANY OF THE COMPANIES THAT I worked for, if you were given the task of writing
    a short utility program and, after two weeks, you returned with a beautiful-looking
    X Windows application, you would be called in front of the boss and be sharply
    criticized. In the business world, time is money and developing GUI applications
    is time-consuming and expensive.


    Console scripts, sometimes called text-based or terminal scripts, are scripts
    designed to run in a text-only environment such as the Linux console, a Telnet
    session, or an xterm window. Console scripts are easy to design and quick to build,
    but they don’t have to be hostile to the user. Bash and Linux both provide features
    for writing friendly console scripts that won’t drain a department’s development
    budget.


    # The Linux Console


    In the early days of Unix, a computer was a number-crunching device that had neither
    keyboard nor monitor. To control the computer, a separate administration workstation
    had to be attached to the system. This dedicated workstation was known as the
    console. From its keyboard, the system administrator oversaw the startup and shutdown
    of the computer. All critical error messages were displayed on the console’s screen
    or, sometimes, on its printer.


    Linux, which is based on Unix, still requires a dedicated console. But from Linux’s
    point of view, the console is not a separate device—it’s the computer’s keyboard
    and monitor. The console is the text-only display that appears when a Linux computer
    first starts up. When terminal windows are opened in X Windows, they are not consoles.
    The console is hidden “behind” the desktop.


    Linux actually creates seven virtual consoles (also called VCs or VTs) that act
    much the same way as separate X Windows terminal sessions. Each one can be selected
    using the Alt-F1 through Alt-F7 keys.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# 234 Chapter 13 Console Scripting


    A console acts as if it were an enhanced DEC VT-100 terminal and any program designed
    to run on a VT-100 (or in an xterm window) can also run on the Linux console.
    The text is drawn in the current console font as selected by the Linux `consolechars`
    command (or the obsolete `setfont` command).


    To determine whether the current session is in a console, use the `t ty` command.
    This command prints the name of the terminal you are on.


    ```

    $ tty # not a console

    /dev/pts/1

    ```


    Each console has a unique `t ty` device name, /dev/ttly1 to /dev/tty7. The main
    console, the one that appears on Linux startup, is /dev/tty1.


    ```

    $ tty # the main console

    /dev/tty1

    ```


    The Linux fgconsole command prints the number of the console. It reports an error
    if you are not on a console.


    ```

    $ fgconsole

    1

    ```


    If your distribution doesn''t have fgconsole, check the name returned by `t ty`:


    ```

    IS_CONSOLE=

    TT Y="tty"

    case ''$TT Y'' in

    /dev/tty*|/dev/vc/* IS_CONSOLE="1" ;;

    *) printf "&s\n" "This is a console" ;;

    esac

    ```


    Some Linux commands work only on a console, not a text session. The error messages
    are not always intuitive.


    ```

    $ showkey

    Couldn''t get a file descriptor referring to the console

    $ setleds

    KDG E T T L E D: Invalid argument

    Error reading current led setting. Maybe stdin is not a VT?

    ```


    # The Console Keyboard


    A shell script can control the console keyboard''s key layout, change the current
    input mode, and the LED lights.


    The console input mode determines how the keystrokes typed by the users are pre-processed.
    There are four input modes:


    +   • *Scan code* (or **RAW**) mode—Scripts read the numeric codes representing
    the individual keys on the keyboard. Pressing or releasing a key results in separate
    codes. Up to six individual scancodes can be returned for a single key press.'
  merge: -1
  img_proc: true
- pgno: 255
  md: "+   - **Keycode** (or **MEDUMBRAG**) **mode**—Scripts read the numeric codes\
    \ representing the console driver's interpretation of the keys. Usually two keycodes\
    \ are returned, one for pressing and another for releasing a key. Different keys\
    \ have different keycodes. For example, pressing the left or right Shift key returns\
    \ different keycodes.\n\n+   - **ASCII** (or **XLATE**) **mode**—This is the normal\
    \ console mode. A script reads the ASCII character codes for each keyboard character.\
    \ Modifier keys like the Shift key only affect other keys.\n\n+   - **UTF-8**\
    \ (or **UNICODE**) **mode**—THE same as ASCII mode except that 16-bit Unicode\
    \ characters are returned instead of ASCII. For most characters, ASCII and UTF-8\
    \ are the same. However, this mode can return as many as three bytes for a particular\
    \ key instead of the usual ASCII single byte.\n\nThe Linux `showkey` command can\
    \ demonstrate each of these modes. Use `--scancodes` to run the program in scancode\
    \ mode, `--keycodes` to run the program in keycode mode, and so on. The following\
    \ example shows what happens when the a key is pressed.\n\n```\n```\n$ showkey\
    \ --keycodes\nkb mode was XLATE\npress any key (program terminates after 10s of\
    \ last keypress)... \nkeycode  28 release\nkeycode  30 press\nkeycode  30 release\n\
    $ showkey --scancodes\nkb mode was XLATE\npress any key (program terminates after\
    \ 10s of last keypress)... \n0x9c\n0x1c\n0x9e\n$ showkey --keycodes\nkb mode was\
    \ XLATE\npress any key (program terminates after 10s of last keypress)... \na\
    \ ( 0xe1 )\n```\n```\n\nThe `kbd_mode` command changes the current keyboard mode:\
    \ -s (scancode), -k (keycode), -a (ASCII) or -u (UTF-8).\n\nScripts can safely\
    \ switch between ASCII and UTF-8 mode. In both cases, the Return or Enter key\
    \ is treated normally and commands such as `read` behave as expected.\n\nThings\
    \ are more difficult when in scancode or keycode mode. Pressing the Return key\
    \ no longer returns the ASCII/UTF-8 code 13 and, as a result, `read` is no longer\
    \ certain when to finish reading. The only solution is to use the `timeout` feature\
    \ and have the script check for the appropriate scancode or keycode representing\
    \ the Return key.\n\nIf a console has LED lights for caps lock, scroll lock, and\
    \ number lock, they can be turned on and off using the `setleds` command. Without\
    \ arguments, `setleds` shows the current settings."
