- pgno: 170
  md: "Listing 9.4 Continued\n\n```\n# This script expects the switch -c and a company\
    \ name. --help (-h)\n# is also allowed.\n\nshopt -s -o nounset\n\ndeclare -rx\
    \ SCRIPT=$0##*/*\ndeclare -r OPTSTRING=\"hc:\"\ndeclare SWITCH\ndeclare COMPANY\n\
    # Make sure there is at least one parameter\n\nif [ $# -eq 0 ] ; then\n   printf\
    \ \"%s\\n\" \"Type --help for help.\"\n   exit 192\nfi\n\n# Examine individual\
    \ options\n\nwhile getopts \"$OPTSTRING\" SWITCH ; do\n   case $SWITCH in\n  \
    \ h) printf \"%s\\n\" \"Usage: $SCRIPT [-h] -c companyid\"\n      exit 0\n   i)\
    \ COMPANY=\"$OPTARG\"\n      ;;\n   \\?) exit 192\n      ;;\n   *) printf \"$SCRIPT:\
    \ $LINE: %s\\n\" \"script error: unhandled argument\"\n      exit 192\n      ;;\n\
    \   esac\ndone\n\nprintf \"$SCRIPT: %s\\n\" \"Processing files for $COMPANY...\"\
    \n```\n\nThis script is shorter than the positional parameter version. The only\
    \ error the script must look for is a legitimate switch listed in `OPTSTRING`\
    \ that isn’t handled by the `switch` statement.\n\nAs a special case, `getopts`\
    \ can process variables instead of script parameters if they are supplied with\
    \ the `getopts` command as extra arguments. This can be used to test a switch\
    \ using specific parameters."
