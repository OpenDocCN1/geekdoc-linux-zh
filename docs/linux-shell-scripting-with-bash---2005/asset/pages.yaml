- pgno: 274
  md: 'The **crontab** (*chronological table*) command maintains a list of jobs for
    **cron** to execute. Each user has his or her own crontab table. The -i (*list*)
    switch lists currently scheduled tasks. Linux reports an error if you don''t have
    permission to use *cron*. Because jobs are added or removed from the crontab table
    as a group, always start with the -1 switch, saving the current table to a file.

    `$ crontab -1 > cron.txt`


    After the current table is saved, the file can be edited. There are five columns
    for specifying the times when a program is to run: The minute, hour, day, month,
    and the day of the week. Unused columns are marked with an asterisk, indicating
    any appropriate time. Times are represented in a variety of formats: Individually
    (1), comma-separated lists (1,15), ranges (0-6, 9-17), and ranges with step values
    (1-31/2). Names can be used for months or days of the week.


    The final column contains the name of the command to execute. The following line
    runs a script called cleanup.sh at 1:00 AM every morning.

    `* * 1 * * /home/kcburch/cleanup.sh`


    Environment variables can also be initialized in the crontab. When a shell script
    is started by *cron*, it is not started from a login session and none of the profile
    files are executed. Only a handful of variables are defined: `PWD`, `HOSTNAME`,
    `MACHTYPE`, `LOGNAME`, `SHELL`, `SHELL`, `HOSTTYPE`, `OSTYPE`, `HOME`, `TERM`,
    and `PWD`. You have to explicitly set any other values in the script or in the
    crontab list.


    `PATH` is defined as only `/usr/bin:/bin`. Other paths are normally added by profile
    files and so are unavailable.


    Because a script running under *cron* is not in a login session, there is no screen
    to write standard output to. Anything that is normally written to standard output
    is instead captured by *cron* and mailed to the account owning the *cron* script.
    The mail has the unhelpful subject line of *cron*. Even printing a blank line
    results in a seemingly empty email being sent. For this reason, scripts designed
    to run under *cron* should either write their output to a log file, or should
    create and forward their own email with a meaningful subject line. It is common
    practice to write a wrapper script to capture the output from the script doing
    the actual work.


    The example in Listing 14.6 shows a wrapper script that runs the script in Listing
    14.5 called `show_users.sh`.


    # Listing 14.5 show_users.sh


    ```

    ```bash

    #!/bin/bash


    # show_users.sh: show all users in the database table "users"


    export -0 -o nounset


    declare -rx SCRIPT=${0##*/}

    ```

    ```'
