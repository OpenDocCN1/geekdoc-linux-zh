- pgno: 315
  md: 'You can get the same effect by opening a socket with Bash and sending the appropriate
    HTTP commands. However, the browser can take care of Web server issues like cookies
    and Web site aliases for you.


    The -source switch is useful when a Web page contains many kinds of information.
    For example, you can search HTML tags and identify headlines on a news site by
    looking for the fonts and styles of headline text.


    The -dump switch returns a rendered version of the Web page. On Web pages with
    simple content, this switch hides the HTML tags, thus making the page easier to
    work with. Normally, lynx footnotes all the links on a Web page, but you can hide
    these with the -no-list switch.


    ```

    ```

    $ lynx -dump --no-list http://www.pegasoft.ca

    REFRESH(10 sec): http://www.pegasoft.ca/frames.html


    ```


