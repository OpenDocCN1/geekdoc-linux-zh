    # Draw a vertical bar graph 10 characters high. The bar is drawn with `''`\n#
    and the blank areas with `''.''`.\n#\n# Parameter 1 - the value of the graph ,
    a percent\n# Parameter 2 - the old value of the bar , to speed drawing\n#\n\nfunction
    vertical_bar {\n\n    declare -i DOTCNT  # number of periods to draw\n    declare
    -i CNT     # number of number signs to draw\n\n    # If the new bar is equal to
    the old one in this spot , don''t bother\n    # redrawing since it hasn''t changed--unless
    it''s zero since we may be\n    # drawing this column for the first time.\n\n    if
    [ $1 -ne 0 ] ; then\n        if [ $1 -eq $2 ] ; then\n            printf "%s"
    "$RIGHT""$RIGHT"\n            return\n\n        fi\n    fi\n\n    # Convert the
    magnitude of the bar to a number between 0 and 10\n    # Round to the nearest
    integer\n    # Constrain the percent to 0..10 if it is out of range\n\n    if
    [ $1 -gt 100 ] ; then\n        CNT=10\n    elif [ $1 -lt 0 ] ; then\n        CNT=0\n    else\n        CNT=$(($1+5))
    / 10     # 0..100 rounded to 0..10\n    fi\n\n    # Draw the vertical bar. DOTCNT
    is the number of periods to draw\n    # to fill in the graph.\n\n    DOTCNT=10-CNT\n    while
    [ $((DOTCNT--)) -gt 0 ] ; do\n        printf "%s" ".""$DOWN""$LEFT"\n    done\n    while
    [ $((CNT--)) -gt 0 ] ; do\n        printf "%s" "#""$DOWN""$LEFT"\n    done

