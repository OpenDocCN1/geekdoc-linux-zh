- pgno: 262
  md: "A gauge is a thermometer bar showing the percentage progress. New percentages\
    \ are read one at a time from standard input until the end of file is reached.\
    \ The ~gauge switch requires a text message, the height, width, and an optional\
    \ starting percentage (see Listing 13.2). The percentages can be sent to the gauge\
    \ by a named pipe, discussed in Chapter 11, \"Text File Basics.\"\n\nSuppose you\
    \ would like to show a thermometer graph showing the progress of printing a series\
    \ of invoice files stored in a directory called invoices. The following demo displays\
    \ the invoices as they are sent another script called print_invoice.\n\n# Listing\
    \ 13.2  **gauge_demo.sh**\n\n```\n#!/bin/bash\n#\n# gauge_demo.sh: a thermometer\
    \ graph demo\n\nshopt -s -o nounset\n\ndeclare -rx SCRIPT=$({\ndeclare -rx QUEUE=/status_fifo\"\
    \ndeclare -rx INVOICES_DIR=\"invoices\"\ndeclare -ix TOTAL_INVOICES=0\ndeclare\
    \ -ix NUM_INVOICES=0\ndeclare -ix PERCENT=0\n\n# count the invoices waiting to\
    \ print\n\nTOTAL_INVOICES='ls -i $INVOICES_DIR | wc -1'\n\n# create the pipe\n\
    \nmkfifo $QUEUE\nif [ $? -ne 0 ] ; then\n    printf *%s\\n\" \"$SCRIPT:$LINENO:\
    \ unable to create $QUEUE\" >&2\n    exit 192\nfi\n\n# print the invoices in a\
    \ background subshell\n# print the progress to the pipe\n\n(\n    ls -1 | (\n\
    \        while read INVOICE ; do\n            let \"NUM_INVOICES++\"\n       \
    \     print_invoice \"$INVOICE\"\n            PERCENT=100*$NUM_INVOICES/$TOTAL_INVOICES\n\
    \            printf *%d\\n\" \"$PERCENT\"\n```"
  merge: -1
  img_proc: true
- pgno: 263
  md: "```\ndone\n    )\n)\n    > $QUEUE &\n\n# display the progress.  dialog will\
    \ stop when nothing\n# more is printed by the subshell\n\ndialog --gauges \"Printing\
    \ invoices\" 7 70 0 < $QUEUE\n\nwait          # wait for the subshell to finish\n\
    rm $QUEUE     # delete the pipe\nsleep 1       # make sure results can be read\
    \ by user\n\nexit 0\n```\n\nAn *info box* is a status message to the user. It\
    \ has no buttons and the **dialog** command completes immediately. The `--infobox`\
    \ switch requires a text message, as well as a height and width.\n\n```\n$ dialog\
    \ --infobox \"Connecting to server\" 7 70\n```\n\nAn *input box* enables the user\
    \ to type a response. The `--inputbox` switch requires the prompt text, the height,\
    \ width, and an optional default response for the user.\n\n```\n$ dialog --print-size\
    \ --inputbox \"Connect to which host?\" 7 70 0  2> size.txt\n$ cat size.txt\n\
    Size: 7, 70\n$ rm size.txt\n$ dialog --print-size --no-shadow --nocancel --inputbox\
    \ \\\n    \"Connect to which host?\" 7 70\n```\n\nThe remaining dialog boxes are\
    \ similar to the ones already discussed.\n\nA *menu* is a list of selections that\
    \ the user can make a choice from. The `--menu` switch requires the menu heading\
    \ text, the height, width, and the menu height. Each item is specified with a\
    \ tag name and the menu item’s text.\n\nA *message box* presents a message to\
    \ the user with a single **OK** button. The `--msgbox` switch requires the text\
    \ message, as well as the height and width.\n\nA *password box* is similar to\
    \ an input box except what the user types is not shown. The `--passwordbox` requires\
    \ the text message, the height and width, and an optional default password.\n\n\
    A *radio list* presents a list of choices of which the user can select only one\
    \ item. The `--radiolist` switch requires the heading text, the height, width,\
    \ and the list height. Each item is specified the same way as a checklist.\n\n\
    A *tail box* displays final text in a file as if the `tail -f` command were used.\
    \ The `--tailbox` switch requires the filename, as well as the height and width."
  merge: -1
  img_proc: true
- pgno: 264
  md: 'A *text box* shows the contents of a text file in the dialog box. The user
    can browse through the file. The `-textbox` switch requires the filename, height,
    and width.


    The *background text box* is a combination of a tail box and a text box. The text
    is viewed as if the “tail -f” command was used, but the user is free to browse
    the content. The `-textboxbg` switch requires a filename, the height, and width.


    A *time box* enables the users to select a time. The `-timebox` switch requires
    prompt text, a height, a width, and the initial time in hours, minutes, and seconds.


    A *calendar box*, shown in Figure 13.3, shows a calendar and enables the users
    to select a date. The `-calendar` switch requires prompt text, a height, a width,
    and the day, month, and year to start with.


    ![](img/7da864b222941ec315ee1c456ff472dd_264_0.png)


    Figure 13.3     A Calendar dialog box.


    You can combine consecutive dialog boxes with the `-and-widget` switch.


    ```

    $ dialog -inputbox "Connect to which host?" 7 70 "" -and-widget -inputbox \

    "And what TCP/IP port?" 7 70

    ```


    You must give an input box an initial string parameter (as `""` for none) or *dialog*
    assumes that `-and-widget` is the optional string.


    There are a large number of switches for customizing the appearance and behavior
    of the boxes. These are listed in the reference section of this chapter.'
  merge: -1
  img_proc: true
