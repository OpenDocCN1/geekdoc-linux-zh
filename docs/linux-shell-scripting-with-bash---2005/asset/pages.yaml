- pgno: 339
  md: '# 18

    Final Topics


    THE ARCANIC AND THE OBSCURE. The obsolete and the advanced. This final chapter
    contains a mix of subjects suitable for those who need to know every last detail
    about the Bash shell.


    # The echo Command


    The built-in **echo** command is an older form of *printf*. Bash provides it for
    compatibility with the Bourne shell. *echo* does not use a format string; it displays
    all variables as if “$@\n” formatting was used. It can sometimes be used as a
    shortcut when you don’t need the full features of *printf*.


    ```

    $ echo "$BASH_VERSION"

    2.05a.0(1)-release

    ```


    A line feed is automatically added after the string is displayed. It can be suppressed
    with the -n (*no new line*) switch.


    ```

    $ echo -n "This is "; echo "one line."

    This is one line

    ```


    If the -e (*escape*) switch is used, *echo* interprets certain escape sequences
    as special characters.


    +   - \\a—A beep (“alert”)

    +   - \\b—A backspace

    +   - \\c—Suppresses the next character; at the end of the string, suppresses
    the trailing line feed

    +   - \\e—The escape character

    +   - \\f—A form feed

    +   - \\n—A line feed (new line)

    +   - \\r—A carriage return

    +   - \\t—A horizontal tab'
  merge: -1
  img_proc: true
- pgno: 340
  md: '+   * \v---A vertical tab

    +   * \\\---A backslash

    +   * \num---The octal ASCII code for a character


    ```

    $ echo \''101\''

    \\101

    $ echo -e \''101\''

    A

    ```


    The -e switch turns off escape sequence interperation. This is the default setting.


    # ## More Uses for set


    The built-in set command is used to turn on or off certain shell options. However,
    set has other uses as well.


    When set has arguments, the arguments are assigned to the position parameters.
    This is the only way to change the value of positional parameters.


    ```

    $ printf \''%s %s \\n\'' "\$1" "\$2" "\$3\"


    $ set \''first\'' \''second\'' \''third\''

    $ printf \''%s %s \\n\'' "\$1" "\$2" "\$3\"

    first second third

    ```


    When set is used by itself, it acts like the env command, displaying all variables.
    It also displays all functions.


    # ## Date Conversions


    The Linux date command returns the current date in a variety of formats. date
    with the -d switch converts an arbitrary text date and displays it in different
    formats.


    ```

    $ date -d \''may 1 10am\''

    Tue May  1 09:00:00 2001

    $ date -d \''8pm 01/03/02\''

    Thu Jan  3 19:00:00 2002

    ```


    On some older Linux distributions, the convdate command is provided and performs
    a similar function.


    ```

    $ convdate \''8pm 01/03/02\''

    Thu Jan  3 19:00:00 2002

    ```


    The -n (*number*) switch returns the seconds since January 1, 1970 (the epoch).
    The -c switch returns a date string for the seconds from the epoch.


    ```

    $ convdate -n \''may 1 10am\''

    998722000

    $ convdate -o 998722000

    Tue May  1 10:00:00 2001

    ```'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Completions


    Completions occur when Bash makes a guess about what a user is typing. With filename
    completion, a user presses the Tab key (or Esc in vi mode) to determine whether
    Bash recognizes the filename being typed based on the first few characters. This
    completion mechanism is available to shell scripts through the use of two built-in
    commands.


    The *compgen* (*generate completions*) command generates a list of possible completions.
    In order to use *compgen*, you need to indicate the type of completion with the
    *-A* (*action*) switch:


    +   - *-A alias* (or *-a*)—Alias names

    +   - *-A arrayvar*—Array variable names

    +   - *-A binding*—Bind command key binding names

    +   - *-A builtin* (or *-b*)—Built-in shell commands

    +   - *-A command* (or *-c*)—Linux commands

    +   - *-A directory* (or *-d*)—Directory names

    +   - *-A disabled*—Names of disabled built-in shell commands

    +   - *-A enabled*—Names of enabled built-in shell commands

    +   - *-A export* (or *-e*)—Exported shell variables

    +   - *-A group* (or *-g*)—Group name completion

    +   - *-A file* (or *-f*)—Filenames

    +   - *-A functions*—Shell function names

    +   - *-A helpopic*—Subjects recognized by the shell *help* command

    +   - *-A hostname*—Hostnames in the file indicated by *HOSTFILE* variable

    +   - *-A job* (or *-j*)—The names of jobs in the job table

    +   - *-A keyword* (or *-k*)—Shell reserved words

    +   - *-A running*—The names of running jobs

    +   - *-A service* (or *-s*)—Complete a networking service name

    +   - *-A setopt*—The names of short -o options

    +   - *-A shopt*—The names of short options (not the -o options)

    +   - *-A signal*—The names of signals

    +   - *-A stopped*—The names of stopped jobs

    +   - *-A user* (or *-u*)—Usernames

    +   - *-A variable* (or *-v*)—Shell variable names'
  merge: -1
  img_proc: true
- pgno: 342
  md: "To find all the directories beginning with *t*, use\n\n```\n$ compgen -A directory\
    \ t\ntia\ntest\ntexttools\n```\n\nThe completion process is more complicated than\
    \ you might think. A script can run functions or programs specified with the `-F\
    \ (function)` switch or run commands with the `-C (command)` switch to create\
    \ the initial list of possible completions. The arguments include the name of\
    \ the command being completed ($1), the shell word being completed ($2), and the\
    \ word before the word being completed ($3).\n\n```\n$ function info { printf\
    \ \"\\$1\\n\" \"$Cmd=$1 Word=$2 Prev=$3\" ; }\n$ compgen -A directory -F info\
    \ t\nbash: warning: compgen: -F option may not work as you expect\nCmd= Word=t\
    \ Prev=\ntemp\ntia\ntexttools\n```\n\nIn this case, *t* is the word being completed,\
    \ and there is no command or word prior to *t*.\n\nAcceptable matches are returned\
    \ in the COMPREPLY variable (or to standard output for -O). Assigning `trucking_reports`\
    \ to COMPREPLY adds `trucking_reports` to the list of possible matches.\n\n```\n\
    $ function info { printf \"\\$1\\n\" \"$Cmd=$1 Word=$2 Prev=$3\" ; \\\n      \
    \  COMPAREPLY=\"trucking_reports\" ; }\n$ compgen -A directory -F info t\nbash:\
    \ warning: compgen: -F option may not work as you expect\nCmd= Word=t Prev=\n\
    temp\ntia\ntexttools\ntrucking_reports\n```\n\nSeveral variables provide additional\
    \ information when completing functions and commands. COMP_LINE is the command\
    \ being completed. COMP_POINT is the cursor position relative to the start of\
    \ the command. COMP_WORDS is an array of the words in the command. COMP_CWORD\
    \ is the cursor position as an index into the COMP_WORDS array.\n\nBash contains\
    \ profiles for many commands so that it knows the kind of completion that is necessary.\
    \ These are called *completion specifications*. If the -G switch is used, the\
    \ process takes a pathname pattern and creates additional matches. After a list\
    \ of possible solutions is found, any items found in the shell variable FIGNORE\
    \ are discarded. The -n (*words*) switch is used to narrow the list.\n\nAfter\
    \ the user’s custom filtering, the -X (*exclude*) switch applies a pathname pattern\
    \ match to further reduce the list. An ampersand represents the text of the word\
    \ being"
  merge: -1
  img_proc: true
