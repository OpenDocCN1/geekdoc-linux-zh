    ```


    Other types of time can be selected by using a time code. The format argument
    is read left to right, which means different time codes can be combined in one
    format string. Using $_{c}$, for example, changes the format codes to the inode
    change time (usually the time the file was created). Using $_{L}$ (*local time*)
    or $_{U}$ (*UTC time*) makes `stattime` behave like the date command.


    ```

    $`stattime -f "modified time = %c current time = %L%o" orders.txt`

