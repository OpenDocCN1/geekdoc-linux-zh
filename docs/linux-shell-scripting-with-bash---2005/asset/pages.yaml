- pgno: 297
  md: '# # Restricted Shells


    Bash enters restricted mode when it starts with the name rbash or when the -r
    option is supplied when Bash runs. A restricted shell prevents a script or user
    from creating or accessing files outside of the current directory. In particular,
    a restricted shell has the following restrictions:


    +   * No changing directories with cd

    +   * No setting or unsetting the values of SHELL, PATH, ENV, or BASH_ENV

    +   * No specifying command names containing /

    +   * No specifying a filename containing a / (slash) as an argument to the built-in
    command

    +   * No specifying a filename containing a slash as an argument to the -p option
    to the hash built-in command

    +   * No parsing the value of SHELLOPTS from the shell environment at startup

    +   * No redirecting output using the $\, |, <$, &$,$, >>$ redirection operators

    +   * No using the exec built-in command to replace the shell with another command

    +   * No adding or deleting built-in commands with the -f and -a options to the
    enable built-in command

    +   * No specifying the -p option to the built-in command

    +   * No turning off restricted mode with set +r or set +o restricted

    +   * No exporting of shell functions


    Otherwise, a restricted Bash shell operates the same as a normal shell. These
    restrictions are enforced after any start-up files are read, so the profile files
    can set up the user''s environment without restrictions. The only exception is
    that function definitions can''t be imported at startup.


    ```

    ```

    $ bash -r

    $ cd ..

    bash: cd: restricted

    $ echo $DATE > temp.txt

    bash: temp.txt: restricted: cannot redirect output

    $ NOW="date"

    $ printf "$a\n" "$NOW"

    Thu Jul 5 16:59:28 EDT 2001

    $ exit

    exit

    ```

    ```


    Restricted shells are very confining but provide a high level of security. When
    used in script programming, redirect standard output and standard error prior
    to running the restricted script because the script itself cannot redirect standard
    output.'
  merge: -1
  img_proc: true
- pgno: 298
  md: "# # Secure File Deletion (wipe)\n\nThe `rm` command removes a file by deleting\
    \ the directory entry, but the old information is still available on the disk\
    \ until a new file overwrites it. Normally, this information is not accessible\
    \ except at the device driver level. However, for critical information that must\
    \ never be read, this might not be acceptable.\n\nThe `wipe` utility first overwrites\
    \ all the information in a file with random data and then deletes the file like\
    \ the `rm` command does. Nothing remains on the disk that can be read by an unscrupulous\
    \ person.\n\n```\n```\n$ ls\nloginz.txt\n$ wipe loginz.txt\n$ ls\n$ \n```\n```\n\
    \nThe `-s` switch wipes quietly (not the usual `-q`). `-r` wipes all subdirectories.\
    \ `-D` wipes the data but keeps the file. For faster wiping, `-z` fills the file\
    \ with zeros instead of random data. `-b` overwrites the file using a specific\
    \ character. There are a few other `wipe` switches, primarily related to how the\
    \ random data is generated.\n\nUse `wipe` with caution. If a device file, such\
    \ as a hard disk partition, is specified instead of a file, `wipe` attempts to\
    \ erase the entire partition.\n\nAll shell script programmers need to pay careful\
    \ attention to security concerns. They not only keep important programs and data\
    \ safe, but they limit the amount of damage a script mistake can cause.\n\n# ##\
    \ Reference Section\n\n# ### id Command Switches\n\n+   - **`-g`**`roup` (or **-g**)—Prints\
    \ only the group ID\n+   - **`-g`**`roups` (or **-G**)—Prints only the supplementary\
    \ groups\n+   - **`-n`**`ame` (or **-n**)—Prints a name instead of a number; for\
    \ **-ugG**\n+   - **`-r`**`eal` (or **-r**)—Prints the real ID instead of the\
    \ effective ID; for **-ugG**\n+   - **`-u`**`ser` (or **-u**)—Prints only the\
    \ user ID\n\n# ### chown Command Switches\n\n+   - **`-c`**`hanges` (or **-c**)—Is\
    \ verbose whenever changes occur\n+   - **`-d`**`ereference`—Follows symbolic\
    \ links\n+   - **`-no-`**`dereference` (or **-h**)—Affects symbolic links instead\
    \ of any referenced file"
  merge: -1
  img_proc: true
