    | mailwarn | Off | Informs the user when new mail arrives when at the shell prompt.
    |

    | -o monitor | On | Enables job control. |

    | no_empty_cmd_completion | Off | Doesn’t allow command completion on an empty
    line. |

    | nocaseglob | Off | Ignores case when pattern-matching filenames. |

    | -o noclobber | Off | If set, does not allow existing regular files to be overwritten
    by redirection of output. |

    | -o noexec | Off | Reads commands but does not execute them. |

    | -o noglob | Off | Disables filename generation (*globbing*). |

    | -o notify | Off | Notifies users of job termination immediately. |

    | -o nounset | Off | Treats unset variables as errors when substituting. |

    | nullglob | Off | Patterns that do not match anything return an empty string
    instead of themselves. |

    | -o onecmd | Off | Exits after reading and executing one command. |

    | -o physical | Off | If set, does not follow symbolic links when executing commands,
    such as cd, that change the current directory. |

    | -o posix | Off | Conforms to the POSIX 1003.2 standard. |

    | -o privileged | Off | Turned on whenever the real and effective user IDs do
    not match. Disables processing of the *$ENV* file and -o importing of shell functions.
    Turning this option off causes the effective uid and gid to be set to the real
