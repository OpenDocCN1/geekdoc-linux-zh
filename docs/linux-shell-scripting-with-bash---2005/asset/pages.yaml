- pgno: 277
  md: "```\ncd $INCOMING_FTP_DIR\nwhile true; do\n    # Do something to files in the\
    \ incoming directory here\ndone\n```\n\nListing 14.8 shows a wrapper script to\
    \ daemonize ftp_daemon.sh.\n\n# Listing 14.8  ftp_daemon_wrapper.sh\n\n```\n#!/bin/bash\n\
    #\n# ftp_daemon_wrapper.sh - start our sample daemon\n#\n\nshopt -s -o nounset\n\
    \ndeclare -rx SCRIPT=$0##//)\ndeclare -rx DAEMON=\"ftp_daemon.sh\"\ndeclare -rx\
    \ DAEMON_LOG=\"ftp_daemon.log\"\n\nif test -f \"$DAEMON_LOG\" ; then\n    if test\
    \ ! -w \"$DAEMON_LOG\" ; then\n        printf \"\\$\\n\" \"SCRIPT:$LINENO: unable\
    \ to write to the log file\\\n—aborted\" >&2\n        exit 1\n    fi\nfi\n\n#\
    \ Standard Output is now the log file\n# Redirect Standard Error there as well\n\
    \nexec 1>$DAEMON_LOG\nexec 2>&1\n\n# Start the daemon in the background\n\nnohup\
    \ bash ftp_daemon.sh &\necho \"Daemon $DAEMON started\"\nexit 0\n```\n\nThe daemon\
    \ itself is a script with an infinite loop. There are two methods of checking\
    \ for a task to do. In the first, polling, the daemon checks to see whether there\
    \ is work for it to do. If there is no work, it puts itself to sleep for a few\
    \ seconds, freeing up CPU time for other tasks, before checking again.\n\nThe\
    \ script shown in Listing 14.9 checks every 30 seconds for files arriving in a\
    \ directory called ftp_incoming. If the files are more than 30 minutes unchanged,\
    \ their names are time-stamped and the files are moved to a new directory called\
    \ processing."
