    # Self-Referential Operations


    Self-referential operators are shorthand notations that combine assignment with
    one of the other basic operations. The operation is carried out using the assignment
    variable, and then the result is assigned to the assignment variable. For example,
    `RESULT+=5` is a short form of `RESULT=RESULT+5`.


    $ let "RESULT=5"

    $ let "RESULT+=5"

    $ printf "The result is \d" "$RESULT"

    The result is 10


    The other self-referential operators are multiplication (*=), division (/=), remainder
    (%=), subtraction (-=), right shift (<<=), left shift (>>=), bitwise AND (&=),
    bitwise exclusive OR (^=), and bitwise OR (|=).


    Notice that certain kinds of self-referential operations are impossible to express
    with the shorthand operators. `RESULT-RESULT-10` can be written as `RESULT-=10`
    but `RESULT=10-RESULT` must be written out in full.


    The increment (++) operator adds one to a variable. The decrement operator (--
    ) subtracts one from a variable.


    $ let "CNT=0"

    $ let "CNT++"

    $ printf "\d\n" "$CNT"

    1


    When increment or decrement are used in another expression, the placement of the
    operator is important. If the operator is placed before a variable, it indicates
    that the variable should be updated prior to the rest of the expression. If the
    operator is placed after a variable, the update will occur after the expression
    is evaluated.


    $ let "CNT=5"

    $ let "PRODUCT=0"

    $ let "PRODUCT++=CNT*5"

    $ printf "\d\n" "$PRODUCT"'
