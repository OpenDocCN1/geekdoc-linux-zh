- pgno: 227
  md: '# # 12


    # # Text File Processing


    SEVERAL YEARS AGO, DAN, AN OLD HIGH SCHOOL FRIEND, arrived at my house with two
    photocopied binders and a CD-ROM. “You’ve got to try this,” he said. “This is
    version 0.9 of a free operating system called Linux.”


    We loaded Linux onto a spare 386 computer. The distribution didn’t show the current
    directory in the command prompt. After several minutes of searching and experimenting,
    Dan deleted his temporary files with rm -f * . After several seconds, he interrupted
    the command with a control-c and looked worried. “That was taking way too long.
    I think I was in the wrong directory.”


    “How bad could the damage be?” I asked, typing 1 s. The shell responded with “command
    not found”. He had been removing files in the / bin directory.


    “What are we going to do?” he asked. “The CD-ROM’s still mounted, but we can’t
    find the file to restore the bin directory when we can’t list anything.”


    I didn’t criticize: I had a few rm horror stories of my own. After a few moments,
    I took a chance and typed find . -type f -maxdepth 1 -print and the files in the
    current directory scrolled up the screen. I smiled. “You fried 1 s, but the find
    command is still intact.” We managed to replace the missing files and were back
    in business. The find command saved us from performing a complete reinstall.


    This chapter contains more examples of working with text files using the orders.txt
    file introduced at the start of the last chapter.


    # ## Finding Lines


    The Linux grep command searches a file for lines matching a pattern. On other
    Unix-based systems, there are two other grep commands called egrep (extended grep)
    and egrep (fixed string grep). Linux combines these variations into one command.
    The egrep command runs grep with the --extended-regexp (or -E) switch, and the
    fgrep command runs grep with the --fixed-strings (or -F) switch.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'The strange name `grep` originates in the early days of Unix, whereby one of
    the line-editor commands was `g/ze/p` (globally search for a regular expression
    and print the matching lines). Because this editor command was used so often,
    a separate `grep` command was created to search files without first starting the
    line editor.


    `grep` uses matching patterns called *regular expressions*, which are similar
    to the pattern matching of the extended test command (`[[ . . ]]`). The basic
    symbols are as follows:


    +   - `.*`—Zero or more characters

    +   - `.+`—One or more characters

    +   - `?`—Follows a character, which is optional

    +   - `.`—A single character (this is `?` in the extended test)

    +   - `^`—The start of the line

    +   - `$`—The end of the line

    +   - `[. . .]`—A list of characters, including ranges and character classes

    +   - `[n]`—Follows an item that is to appear *n* times

    +   - `{n}`—Follows an item that is to appear *n* or more times

    +   - `{n, m}`—Follows an item that is to appear *n* to *m* times

    +   - `(…)`—A subpattern that’s used to change the order of operations


    Notice that the symbols are not exactly the same as the globbing symbols used
    for file matching. For example, on the command line a question mark represents
    any character, whereas in `grep`, the period has this effect.


    The characters `?`, `+`, `{`, `}`, and `)` must appear escaped with backslashes
    to prevent Bash from treating them as file-matching characters.


    Suppose you wanted to match all orders in the `orders.txt` file containing a *w*.


    ```

    ```

    $ grep ''w'' orders.txt

    Mahogany Writing Desk,463.99,1,756

    Walnut TV Stand,388.99,1,756

    ```

    ```


    The asterisk (`*`) is a placeholder representing zero or more characters.


    ```

    ```

    $ grep "*Desk" orders.txt

    Mahogany Writing Desk,463.99,1,756

    ```

    ```


    The `--fixed-strings` switch suppresses the meaning of the pattern-matching characters.
    When used with `*Desk`, `grep` searches for the exact string, including the asterisk,
    which does not appear anywhere in the file.


    ```

    ```

    $ grep --fixed-strings "*Desk" orders.txt

    $

    ```

    ```


    The caret (`^`) character indicates the beginning of a line. Use the caret to
    check for a pattern at the start of a line.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '```

    $ grep "*R*" orders.txt

    ```


    Reclining Chair,1599.99,1,757

    Rocking Chair,287.99,1,757


    The −ignore-case (or −i) switch makes the search case insensitive. Searching for
    shows all lines containing w or v.


    ```

    $ grep −ignore-case "*W*" orders.txt

    ```


    Birchwood China Hutch,475.99,1,756

    Two-drawer Nightstand,125.99,1,756

    Six-drawer Dresser,525.99,1,757

    Lawn Chair,55.99,1,756

    Mahogany Writing Desk,463.99,1,756

    Walnut TV Stand,388.99,1,756


    The −invert-match (or −v) switch shows the lines that do not match. Lines that
    match are not shown.


    ```

    $ grep −invert-match "*r*" orders.txt

    ```


    Bunk Bed,705.99,1,757

    Queen Bed,925.99,1,757

    Pine Round Table,375.99,1,757

    Walnut TV Stand,388.99,1,756


    Regular expressions can be joined together with a vertical bar (|). This has the
    same effect as combining the results of two separate grep commands.


    ```

    $ grep "*Stool*" orders.txt

    Bar Stool,45.99,1,756

    $ grep "*Chair*" orders.txt

    Reclining Chair,1599.99,1,757

    Lawn Chair,55.99,1,756

    Rocking Chair,287.99,1,757

    Chair − Rocking,287.99,1,757

    $ grep "*Stool*||*Chair*" orders.txt

    Reclining Chair,1599.99,1,757

    Bar Stool,45.99,1,756

    Lawn Chair,55.99,1,756

    Rocking Chair,287.99,1,757

    Chair − Rocking,287.99,1,757

    ```


    To identify the matching line, the −line-number (or −n) switch displays both the
    line number and the line. Using cut, head, and tail, the first line number can
    be saved in a variable. The number of bytes into the file can be shown with −byte-offset
    (or −b).


    ```

    $ grep −line-number "*Chair − Rock*" orders.txt

    19:Chair − Rocking,287.99,1,757

    $ FIRST=$(grep −line-number "*Chair − Rock*" orders.txt | cut −d: −f1 | head −1)

    $ printf "First occurrence at line \n" "$FIRST"

    First occurrence at line 19

    ```'
