    <body>

    This is the home page for Widget Inc.

    </body>

    </html>

    ```


    Other network services such as Telnet and SMTP can be accessed the same way.


    # CGI Scripting


    *CGI* (Common Gateway Interface) scripts are programs run by a Web server. Information
    is given to the script through environment variables and standard input and the
    script responds by returning a Web page or document to standard output.


    CGI scripts must be placed in a special directory (usually called `.cgi-bin`).
    Having a standard directory keeps all the scripts in a central location and prevents
    unauthorized people from posting scripts as well as Web pages. Your Web server
    has to be configured to allow CGI scripts if it is not so already. The script
    files end with `.cgi` instead of `.sh` or `.bash` to differentiate them from general-purpose
    scripts.'
  merge: -1
  img_proc: true
- pgno: 305
  md: "A CGI script must write a proper HTTP Web server response (or header) before\
    \ returning any information. The shortest header is a content line describing\
    \ the kind of data being returned to the Web browser, followed by a blank line.\
    \ The content is either `text/plain` for pure text or `text/html` for a Web page.\
    \ For example, to return simple text, use this\n\n```\n```\nprintf \"Content-type:\
    \ text/plain \\r\\n\"\nprintf \"\\r\\n\"\n```\n```\n\nLike the HTTP client example,\
    \ Web servers expect all lines to end in a carriage return and line feed rather\
    \ than a simple line feed. Data appearing after the header doesn't have to be\
    \ formatted with the extra carriage return character.\n\nListing 16.2 shows a\
    \ short CGI script that runs the `env` command and returns a list of environment\
    \ variables to a Web browser.\n\n# Listing 16.2  env.cgi\n\n```\n```\n#!/bin/bash\n\
    #\n# env.cgi - display the environment variables available to a CGI program\n\
    #\n\nshopt -s -O nounset\n\ndeclare -rx SCRIPT=$ {0##*/}\ndeclare GATEWAY_INTERFACE\n\
    \nif [ -z \"$GATEWAY_INTERFACE\" ] ; then\n   printf \"$$\\n\" \"$SCRIPT: this\
    \ script should be run by a web browser\" >&2\n   exit 192\nfi\n\n# Write Response\
    \ Header\n\nprintf \"Content-type: text/plain\\r\\n\"\nprintf \"\\r\\n\"\n\n#\
    \ Generate text message to Return\n\nenv\n\nexit 0\n```\n```\n\nBecause CGI scripts\
    \ run under a unique environment, it is difficult to test them from the command\
    \ line. Instead, store them in the `cgi-bin` directory and attempt to run the\
    \ script through the Web browser. The most common errors are listed here:"
  merge: -1
  img_proc: true
- pgno: 306
  md: "+   * 403 Forbidden—The script permissions are wrong or the script is not in\
    \ a CGI directory\n+   * 404 Not Found—The CGI script was missing or the wrong\
    \ URL was used.\n+   * 500 Internal Server Error—The script didn’t return a proper\
    \ CGI header.\n\nThe server error is the most common error. This occurs when the\
    \ script stops with an error before it is able to write the HTTP header. Any messages\
    \ written to standard error appear in the Web server’s error log. If a Web page\
    \ returned has missing or incorrect information, check the Web server log for\
    \ errors.\n\nBecause it’s inconvenient to check the Web server error log, the\
    \ CGI script should attempt to capture any errors and display them through standard\
    \ output on the Web page.\n\nTo return a Web page instead, change the content\
    \ to text/html. When displaying errors using a Web page, make sure the font and\
    \ colors are set to reasonable values so that the errors are clearly visible.\
    \ In Listing 16.3, errors are displayed in a white box with black print at the\
    \ bottom of the page.\n\n# Listing 16.3 html_env.cgi\n\n```\n#!/bin/bash\n#\n\
    # html_env.cgi - display the environment variables given to a CGI program\n\n\
    show $-o nounset\n\n# Declarations\n\ndeclare -rx SCRIPT=$ {0#*/*}\ndeclare GATEWAY_INTERFACE\n\
    if [ -z \"$GATEWAY_INTERFACE\" ]; then\n    printf \"&e;\" \"$SCRIPT: this script\
    \ should be run by a web browser\" >&2\n    exit 192\nfi\ndeclare -ix ERRORS=\"\
    mktemp /tmp/env_errors.XXXXX\"\nif [ -z \"$ERRORS\" ]; then\n    ERRORS=\"/tmp/env_errors.$$\"\
    \n    printf \"&e;\" \"mktemp failed\" 2> \"$ERRORS\"\nfi\n\n# Write Response\
    \ Header\n\nprintf \"Content-type: text/html\\r\\n\"\n```"
