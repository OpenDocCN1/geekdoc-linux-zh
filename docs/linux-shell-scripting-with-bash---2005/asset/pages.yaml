- pgno: 316
  md: "The script shown in Listing 16.6 strips the official time from the NRCC and\
    \ compares it to the time on the local computer.\n\n# Listing 16.6\\quad\\quad\
    \ compare\\_time.sh\n\n```\n```bash\n#!/bin/bash\n#\n#  compare_time.sh: compare\
    \ our time against National Research\n#  Council of Canada's atomic clock.\n\n\
    shopt -s -o nounset\n\n# Global declarations\n\ndeclare -rx SCRIPT=$0##*/    #\
    \ name of our script\ndeclare -rx lynx=\"/usr/bin/lynx\"   # lynx command\ndeclare\
    \ -rx date=\"/bin/date\"    # data command\n\ndeclare  OUR_TIME      # our time\
    \ as reported by date(1)\ndeclare  TIME_PAGE     # the content of the NRCC web\
    \ page\ndeclare  TIME_LINE     # the page line with the time on it\ndeclare  OFFICIAL_TIME\
    \   # the correct time from the line\n\ndeclare -rx NRCC=\"time5.nrc.ca/webclock_e.shtml\"\
    \  # NRCC web site\n\n# Sanity Check\n\nif test ! -x \"$date\" ; then\n    printf\
    \ \"$$SCRIPT: the command $$date is not available -- aborting\\n\" >&1\n    exit\
    \ 192\nfi\nif test ! -x \"$lynx\" ; then\n    printf \"$$SCRIPT: the command $$lynx\
    \ is not available -- aborting\\n\" >&1\n    exit 192\nfi\n\n# Get the Time\n\n\
    OUR_TIME=`$$date --universal '+%H:%M:%S'`\nTIME_PAGE=`$$lynx -dump -nolist \"\
    http://$$NRCC\"`\nif [ -z \"$$TIME_PAGE\" ] ; then\n    printf \"$$SCRIPT: the\
    \ web page $$NRCC has moved -- aborting\\n\" >&1\n    exit 192\nfi\nTIME_LINE=`printf\
    \ \"$$e\\n\" \"$$TIME_PAGE\" | grep UTC | head -1`\nif [ -z \"$$TIME_PAGE\" ]\
    \ ; then\n    printf \"$$SCRIPT: the format of the web page $$NRCC has changed\
    \ --\\)\\\n```\n```"
  merge: -1
