  md: '# setterm Command Switches


    +   - -append [ c ]—Dumps a console screen (default is current) to a file, appending
    it if the file exists


    +   - -appcursorkeys [on|off]—Sets Cursor Key Application Mode on or off


    +   - -background c—Sets the background text color to color c


    +   - -blank [ 0-60 ]—Number of minutes until the screen is blanked (default is
    0, which is no blanking)


    +   - -blength [ n ]—Console beep duration in milliseconds (default is 0)


    +   - -bfreq h—Console beep frequency (pitch) in Hertz (default is 0)


    +   - -blink [on|off]—Turns blinking text printing on or off. When not on a console,
    turning blinking text off also turns off all other attributes


    +   - -bold [on|off]—Turns bold printing on or off. When not on a console, turning
    bold off also turns off all other attributes


