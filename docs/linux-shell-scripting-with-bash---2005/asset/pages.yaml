    # ## Working with MySQL Databases


    The MySQL database is available with most Linux distributions, but it might not
    be installed by default depending on your installation settings. The MySQL database
    has a console client called, appropriately, `mysql`. The remainder of this section
    assumes that you have MySQL installed and the database server is up and running.


    To log into MySQL, use `mysql` with the `--user=username` (or `-u` *username*)
    and `--password=pwd` (or `-p` *pwd*) switches. If you omit a password with `--password`,
    MySQL prompts you for one.


    Type `quit` (or `\q`) to quit the client.


    ```

    $ mysql --user gordon --password=tifbigl98

    mysql> quit

    $


    ```


    You can run short queries with the `--exec=sqlcmd` (or `-e` *sqlcmd* *execute*
    *command*) switch. This is similar to Bash’s `-e` switch.


    ```

    $ mysql --user gordon --password=tifbigl98 --exec="SHOW DATABASES"

    +----------+

    | Database |

    +----------+

    | bahaetest |

    | mysql    |

    | test     |

    +----------+

    $


    ```


