  md: '# ## Acknowledgments


    You''re reading the acknowledgements? Excellent!


    Technical books today can go from first word to press in as little as four months.
    This project took more than two years to complete, painstakingly researched and
    carefully developed. If this book seems different from other titles on your bookshelf,
    there''s good reason for it and a lot of good people behind it.


    In the summer of 1999, I talked with Michael Slaughter at Addison-Wesley publish-ing
    about writing a series of Linux books. Because Linux begins with Bash, Bash would
    be the topic of my first book. So if you''ve been dying for a good Bash book,
    thank Michael.


    Lawrence Law, a Unix programmer who''s worked both sides of the Pacific, offered
    practical tips for keeping the book fresh and interesting, while debating the
    existence of God and competent IT management.


    Chris Browne, Linux author and speaker, took time out from maintaining the `.org`
    and `.info` domains to give much needed advice on getting published. A big thanks
    for fitting me in between TLUG and Postgres.


    Chris Johnson took time away from chess tournaments and writing Bash algorithms
    to question all aspects of my research. I haven''t seen him since we discussed
    this book, but I imagine he''ll show up to a PegaSoft meeting to collect a signed
    copy soon enough.


    When Addison-Wesley was taken over by Prentice Hall, the manuscript bounced around
    until it fell into the inbox of Katie Mohr at Sams Publishing. If you''re glad
    this book is in your hands, buy her a coffee. She was the one who pitched it to
