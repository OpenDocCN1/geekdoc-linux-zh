    text/plain, ASCII\n```\n\n# Creating and Deleting Files\n\nAs discussed in Chapter\
    \ 3, “Files, Users, and Shell Customization,” files are deleted with the\nrm (remove)\
    \ command. The -f (force) command removes a file even when the file per-\nmissions\
