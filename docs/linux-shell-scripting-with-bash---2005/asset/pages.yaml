- pgno: 215
  md: '# Folding


    The Linux fold command ensures that a line is no longer than a certain number
    of characters. If a line is too long, a carriage return is inserted. fold wraps
    at 80 characters by default, but the -width=n (or -w) switch folds at any characters.
    The -spaces (or -s) switch folds at the nearest space to preserve words. The -bytes
    (or -b) switch counts a Tab character as one character instead of expanding it.


    ```

    $ head -3 orders.txt | cut -d, -f 1

    Birchwood China Hutch

    Bookcase Oak Veneer

    Small Bookcase Oak Veneer

    $ head -3 orders.txt | cut -d, -f 1 | fold -width=10

    Birchwood

    China Hutch

    h

    Bookcase O

    ak Veneer

    Small Book

    case Oak V

    eneer

    $ head -3 orders.txt | cut -d, -f 1 | fold -width=10 -spaces

    Birchwood

    China

    Hutch

    Bookcase

    Oak Veneer

    Small

    Bookcase

    Oak Veneer

    ```


    # Joining


    The Linux join command combines two files together. join examines one line at
    a time from each file. If a certain segment of the lines match, they are combined
    into one line. Only one instance of the same segment is printed. The files are
    assumed to be sorted in the same order.


    The line segment (or field) is chosen using three switches. The -1 switch selects
    the field number from the first file. The -2 switch selects the field number from
    the second. The -t switch specifies the character that separates one field from
    another. If these switches aren''t used, join separates fields by spaces and examines
    the first field on each line.


    Suppose the data in the orders.txt file was separated into two files, one with
    the pricing information (orders1.txt) and one with the quantity and account information
    (orders2.txt).'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'To join these two files together, use a comma as a field separator and compare
    field 1 of the first file with field 1 of the second.


    ```

    $ join -i 1 -2 1 -t, orders1.txt orders2.txt

    Birchwood China Hutch,475.99,1,756

    Bookcase Oak Veneer,205.99,1,756

    Small Bookcase Oak Veneer,205.99,1,756

    Reclining Chair,1599.99,1,757

    Bunk Bed,705.99,1,757

    ```


    If either file contains a line with a unique field, the field is discarded. Lines
    are joined only if matching fields are found in both files. To print unpaired
    lines, use -a 1 to print the unique lines in the first file or -a 2 to print the
    unique lines in the second file. The lines are printed as they appear in the files.


    The sense of matching can be reversed with the -v switch. -v 1 prints the unique
    lines in the first file and -v 2 prints the unique lines in the second file.


    The tests are case-insensitive when the -ignore-case (or -i) switch is used.


    The fields can be rearranged using the -o (output) switch. Use a comma-separated
    field list to order the fields. A field is specified using the file number (1
    or 2), a period and the field number from that file. A zero is a short form of
    the join field.


    ```

    $ join -i 1 -2 1 -t, -o ''1.2,2.3,2.2,0'' orders1.txt orders2.txt

    475.99,756,1,Birchwood China Hutch

    205.99,756,1,Bookcase Oak Veneer

    205.99,756,1,Small Bookcase Oak Veneer

    1599.99,757,1,Reclining Chair

    705.99,757,1,Bunk Bed

    ```


    # ## Merging


    The merge command performs a three-way file merge. This is typically used to merge
    changes to one file from two separate sources. The merge is performed on a line-by-line
    basis. If there is a conflicting modification, merge displays a warning.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'For easier reading, the `-L (label)` switch can be used to specify a title
    for the file, instead of reporting conflicts using the filename. This switch can
    be repeated three times for each of the three files.


    For example, suppose there are three sets of orders for ice cream. The original
    set of orders (`file1.txt`) is as follows:


    ```

    1 quart vanilla

    2 quart chocolate

    ```


    These orders have been modified by two people. The Barrie store now has (`file2.txt`)
    the following:


    ```

    1 quart vanilla

    1 quart strawberry

    2 quart chocolate

    ```


    And the Orillia (`file3.txt`) is as follows:


    ```

    1 quart vanilla

    2 quart chocolate

    4 quart butter almond

    ```


    The merge command reassembles the three files into one file.


    ```

    $ merge -L "Barrie Store" -L "Original Orders" -L "Orillia Store" file2.txt

    file1.txt file3.txt

    ```


    `file1.txt file3.txt` will change `file2.txt` so that it contains:


    ```

    1 quart vanilla

    1 quart strawberry

    2 quart chocolate

    4 quart butter almond

    ```


    However, if the *butter almond* and *strawberry* orders were both added as the
    third line, merge reports a conflict:


    ```

    $ merge -L "Barrie Store" -L "Original Orders" -L "Orillia Store" file2.txt

    file1.txt file3.txt

    merge: warning: conflicts during merge

    ```


    `file2.txt` will contain the details of the conflict:


    ```

    ««««« Barrie Store

    1 quart strawberry

    =======

    4 quart butter almond

    >>>>>>> Orillia Store

    ```


    If there are no problems merging, merge returns a zero exit status.


    The `-q (quiet)` switch suppresses conflict warnings. `-p (print)` writes the
    output to standard output instead of overwriting the original file. The `-3` switch
    reports conflicts in the `diff3 -A` format.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# **Reference Section**


    # **type Command Switches**


    +   - `-a`—Shows all locations of the command

    +   - `-p`—Shows the pathname of the command

    +   - `-t`—Indicates the type of command


    # **file Command Switches**


    +   - `-b`—Brief mode

    +   - `-c`—Displays magic file output

    +   - `-f file`—Reads a list of files to process from *file*

    +   - `-i`—Shows the MIME type

    +   - `-L`—Follows symbolic links

    +   - `-m list`—Colon-separated list of magic files

    +   - `-n`—Flushes the output after each file

    +   - `-p`—Allows block or character special files

    +   - `-v`—Version

    +   - `-z`—Examines compressed files


