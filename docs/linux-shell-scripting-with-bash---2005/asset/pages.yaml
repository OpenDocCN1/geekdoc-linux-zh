- pgno: 97
  md: 'In the same way, any variables declared in your profile scripts must be exported
    or they won''t exist at the command prompt. They will disappear after the profile
    scripts are finished running.


    When a variable is exported, any changes made by programs executed by the script
    are discarded when the program completes. If a second script were to change `CVSROOT`
    to the value `/home/local/cvsroot`, when the second script is finished, `CVSROOT`
    will once again be `/home/cvs/cvsroot`. The changes are "rolled back."


    Create global constants by using both the export and read-only switches.


    ```

    $ declare -rx COMPANY_BRANCH="West Coast Branch"

    ```


    `COMPANY_BRANCH` is only a read-only variable in the current script. When it''s
    exported to a second script, it''s exported as a normal variable—the read-only
    effect is lost. The reason for this strange behavior is rooted in the way Linux
    shares environment variables between programs and has nothing to do with the Bash
    shell itself.


    *Environment variables* are the variables Linux shares between a program and the
    program that executed it. Like layers of an onion, each program must explicitly
    export a variable into the environment for the next program to see it.


    Although Linux has provisions for exporting environment variables, there is no
    way to assign any attributes to them. Linux has no notion of attributes. Bash
    attributes were thought up after environment variables were first invented. When
    Bash variables are given to Linux to share with a new program, the attributes
    are lost. When the second shell script starts, it has no way of knowing what the
    original attributes were.


    The variables shared with a new program are copies of the original. If a script
    declares an exported variable and runs a second script, any changes made to the
    variable by the second script are invisible to the first. There is no way for
    a second script to assign a new value to a variable that the first script will
    see. Unlike other programming languages, exporting shell variables is a one-way
    street.


    Suppose there are two scripts called *outer.sh* and *inner.sh*. outer.sh declares
    a variable and then runs the *inner.sh* script, as shown in Listings 5.1 and 5.2.


    # Listing 5.1 outer.sh


    ```

    # outer.sh

    #

    # This script runs first.


    declare -rx COMPANY_BRANCH="West Coast Branch"

    bash inner.sh

    printf "%s\n" "$COMPANY_BRANCH"


    exit 0

    ```'
