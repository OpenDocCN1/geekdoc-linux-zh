    The Linux statftime command has similar capabilities to *stat*, but has a wider
    range of formatting options. statftimе is similar to the *date* command: It has
    a string argument describing how the status information should be displayed. The
    argument is specified with the *-f* (*format*) switch.


    The most common statftime format codes are as follows:


    +   * %c—Standard format

    +   * %d—Day (zero filled)

    +   * %D—mm/dd/yy

    +   * %H—Hour (24-hr clock)

    +   * %I—Hour (12-hr clock)

    +   * %j—Day (1..366)

