- pgno: 351
  md: "One common mistake when using putenv is reusing the string assigned to the\
    \ environment. The command actually creates a pointer to the string being assigned;\
    \ it does not copy the string into the environment. Running a command such as\
    \ `putenv(s)` means that the string `s` must be untouched until it is removed\
    \ from the environment.\n\nFor a simple variable sharing example, suppose you\
    \ created a script called `c_script.sh` to multiply a variable called `COUNT`\
    \ by the first script argument, as shown in Listing 18.3.\n\n# **Listing 18.3**\
    \ c_script.sh\n\n```\n```\n#!/bin/bash\n#\n# c_script.sh: an example of exporting\
    \ a C variable to a script\n\nshopt -s -o nounset\nlet \"COUNT=COUNT*$1\"\necho\
    \ \"$COUNT\"\n\nexit 0\n```\n```\n\nThe script assumes the variable `COUNT` exists.\n\
    \n```\n```\n$ declare -ix COUNT=4\n$ bash c_script.sh 3\n12\n```\n```\n\nUsing\
    \ putenv and popen, a C variable can be copied to the environment, and a new value\
    \ for the variable can be read from the pipe, as shown in Listing 18.4.\n\n# **Listing\
    \ 18.4** c_script.c\n\n```\n```\n/* c_script.c: run a script from C using popen\
    \ */\n\n#include <stdio.h>\n#include <stdlib.h>\n\nint main() {\n\n    FILE *f\
    \ = NULL;                /* the pipe file */\n    char env_count[255] = \"\";\
    \      /* string buffer for COUNT */\n    int count = 5;                 /* C\
    \ variable count */\n\n    /* Declare COUNT in the environment */\n\n    sprintf(env_count,\
    \ \"COUNT=%d\", count);  /* declare env var */\n    putenv(env_count);       \
    \           /* export it */\n```\n```"
