  md: 'linux.txt

    114684 4 -rw-rw-r- 1 kburtch kburtch 592 May 17 14:41 ./advocacy/o

    ld_orders.txt


    The `-printf` switch makes `find` act like a searching version of the `stat`/`fstat`
    command. The `%` format codes indicate what kind of information about the file
    to print. Many of these provide the same functions as `stat`/`fstat`, but use
    a different code.


    +   - `%a` — File''s last access time in the format returned by the `C` `ctime`
    function.

    +   - `%c` — File''s last status change time in the format returned by the `C`
    `ctime` function.

    +   - `%f` — File''s name with any leading directories removed (only the last
    element).

    +   - `%g` — File''s group name, or numeric group ID if the group has no name.

    +   - `%h` — Leading directories of file''s name (all but the last element).

    +   - `%i` — File''s inode number (in decimal).

    +   - `%m` — File''s permission bits (in octal).

    +   - `%p` — File''s pathname.

    +   - `%P` — File''s pathname with the name of the command line argument under
    which it was found removed.

    +   - `%s` — File''s size in bytes.

    +   - `%t` — File''s last modification time in the format returned by the `C`
    `ctime` function.

    +   - `%u` — File''s username, or numeric user ID if the user has no name.


    A complete list appears in the reference section.


    The time codes also differ from `stat`/`fstat`: `stat`/`fstat` remembers the last
    type of time selected, whereas `find` requires the type of time for each time
    element printed.


    ```

    `$ find . -type f -name "*.txt" -printf "%f access time is %a\n"`

    `orders.txt access time is Thu May 17 16:47:08 2001`

    `linux.txt access time is Thu May 17 16:47:08 2001`

    `old_orders.txt access time is Thu May 17 16:47:08 2001`

    `$ find . -type f -name "*.txt" -printf "%f modified time is %` \

    `hours%minutes is %H:%M\n"`

    `orders.txt modified time as hours:minutes is 14:41`

    `linux.txt modified time as hours:minutes is 14:41`

    `old_orders.txt modified time as hours:minutes is 14:41`

    ```


    A complete list of `find` switches appears in the reference section.


    # # Sorting


    The Linux `sort` command sorts a file or a set of files. A file can be named explicitly
    or redirected to sort on standard input. The switches for sort are completely
    different from commands such as `grep` or `cut`. `sort` is one of the last commands
    to support long versions of switches; as a result, the short switches are used
    here. Even so, the switches for common options are not the same as other Linux
    commands.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'To sort a *file* correctly, the `sort` command needs to know the *sort key*,
    the characters on each line that determine the order of the lines. Anything that
    isn’t in the key is ignored for sorting purposes. By default, the entire line
    is considered the key.


    The -f (*fold character cases together*) switch performs a case-insensitive sort
    (doesn’t use the -i switch, as many other Linux commands use).


    ```

    $ sort -f orders.txt

    Bar Stool,45.99,1,756

    Birchwood China Hutch,475.99,1,756

    Bookcase Oak Veneer,205.99,1,756

    Bunk Bed,705.99,1,757

    Cedar Armoire,825.99,1,757

    Cedar Toy Chest,65.99,1,757

    Chair - Rocking,287.99,1,757

    Garden Bench,149.99,1,757

    Grandfather Clock,2045.99,1,756

    Lawn Chair,55.99,1,756

    Mahogany Writing Desk,463.99,1,756

    Pine Round Table,375.99,1,757

    Queen Bed,925.99,1,757

    Reclining Chair,1599.99,1,757

    Rocking Chair,287.99,1,757

    Six-drawer Dresser,525.99,1,757

    Small Bookcase Oak Veneer,205.99,1,756

    Two-drawer Nightstand,125.99,1,757

    Victorian-style Sofa,1225.99,1,757

    Walnut TV Stand,388.99,1,756

    ```


    The -r (*reverse*) switch reverses the sorting order.


    ```

    $ head orders.txt | sort -f -r

    Two-drawer Nightstand,125.99,1,756

    Small Bookcase Oak Veneer,205.99,1,756

    Six-drawer Dresser,525.99,1,757

    Reclining Chair,1599.99,1,757

    Queen Bed,925.99,1,757

    Pine Round Table,375.99,1,757

    Cedar Toy Chest,65.99,1,757

    Bunk Bed,705.99,1,757

    Bookcase Oak Veneer,205.99,1,756

    Birchwood China Hutch,475.99,1,756

    ```


    If only part of the line is to be used as a key, the -k (*key*) switch determines
    which characters to use. The field delimiter is any group of space or Tab characters,
    but you can change this with the -t switch.


    To sort the first 10 lines of the orders file on the second and subsequent fields,
    use this'
