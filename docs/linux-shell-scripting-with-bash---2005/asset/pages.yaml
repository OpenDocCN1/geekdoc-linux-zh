    # Other `let` Features


    Parentheses are allowed in the expressions.


    ```

    $ let "RESULT=(5+3)*2"

    $ printf "The expression is %d" "$RESULT"

    The expression is 16

    ```


    Assignment in the `let` command is an operator that returns the value being assigned.
    As a result, multiple variables can be assigned at once.


    ```

    $ let "TEST=TEST2=5"

    $ printf "The results are %d and %d\n" "$TEST" "$TEST2"

    The results are 5 and 5

    ```


    `let` can evaluate more than one expression at a time. Several, small assignments
    can be combined on one line.


    ```

    $ let "SUM=5+5" "SUM2=10+5"

    ```


    Excessive numbers of assignments in a single `let` command will lead to readability
    problems in a script. When each `let` is on a single line, it’s easier to look
    through the script for a specific assignment.


    The conditional expression operator (?) is shorthand for an `if` statement when
    one of two different expression are evaluated based on the left condition. Because
    this is a feature of the `let` command, it works only with numeric expressions,
    not strings. The following example constrains a truth value to a 1 or a 0.


    ```

    $ VALUE=5

    $ let "RESULT=VALUE > 1 ? 1 : 0"

    $ printf "%d\n" "$VALUE"

    1

    ```'
