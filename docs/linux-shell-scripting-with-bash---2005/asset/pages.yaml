- pgno: 243
  md: 'Lines unaffected by `sed` can be hidden with the `~quiet` (or `~n` or `~silent`)
    switch.


    Like the `transform` command, there are other `sed` commands that mimic Linux
    commands. The `p` (print) command imitates the `grep` command by printing a matching
    line. This is useful only when the `~quiet` switch is used. The `~` (line number)
    command prints the line number of matching lines. The `q` (quit) command makes
    `sed` act like the `head` command, displaying lines until a certain line is encountered.


    ```

    $ head orders.txt | sed -quiet ''/^$B/p''\

    Bunk Bed,705.99,1,757\

    Queen Bed,925.99,1,757\

    \

    $ head orders.txt | sed -quiet ''/^$B/d''\

    5\

    6

    ```


    The remaining `sed` commands represent specialized actions. The flow of control
    is handled by the `n` (next) command. Files can be read with `r` or written with
    `w`. `a` (append next) combines two lines into one for matching purposes. `d`
    (multiple line delete) deletes multiple lines. `p` is multiple line print. `h`,
    `H`, `g`, `G`, and `x` enable you to save lines to a temporary buffer so that
    you can make changes, display the results, and then restore the original text
    for further analysis. This works like an electronic calculator''s memory. Complicated
    `sed` expressions can feature branches to labels embedded in the expressions using
    the `b` command. The `t` (test) command acts as a `shell if` or `switch` statement,
    attempting a series of operations until one succeeds. Subcommands can be embedded
    in `sed` with curly brackets. More documentation on these commands can be found
    using `info sed`.


    Long `sed` scripts can be stored in a file. You can read the `sed` script from
    a file with the `~files` (or `~f`) switch. You can include comments with a `#`
    character, like a `shell` script.


    `sed` expressions can also be specified using the `~expression` (or `~e`) switch,
    or can be read from standard input when a `~filename` is used.


    You cannot use `ASCII` value escape sequences in `sed` patterns.


    # ## Compressing Files


    Most Linux programs differentiate between archiving and compression. *Archiving*
    is the storage of a number of files into a single file. *Compression* is a reduction
    of file size by encoding the file. In general, an archive file takes up more space
    than the original files, so most archive files are also compressed.


    The Linux `bzip2` (BWH zip) command compresses files with Burrows–Wheeler–Huffman
    compression. This is the most commonly used compression format. Older compression
    programs are available on most distributions. `gzip` (GNU zip) compresses with
    `LZ77` compression and is used extensively on older distributions. `compress`
    is an older Lempel–Ziv compression program available on most versions of `Unix`.
    `zip` is the Linux version of the DOS `pkzip` program. `hexbin` decompresses certain
    Macintosh archives.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'The **Linux tar** (*tape archive*) command is the most commonly used archiving
    com-

    mand, and it automatically compresses while archiving when the right command-line

    options are used. Although the command was originally used to collect files for
    storage

    on tape drives, it can also create disk files.


    Originally, the **tar** command didn''t use command-line switches: A series of
    single

    characters were used. The Linux version supports command-line switches as well
    as the

    older single character syntax for backward compatibility.


    To use **tar** on files, the `--file` (*F* (or *-f*) switch indicates the filename
    to act on. At

    least one action switch must be specified to indicate what **tar** will do with
    the file.

    Remote files can be specified with a preceding hostname and a colon.


    The `--create` (*-c*) switch creates a new tar file.


    ```

    $ ls -1 orders.txt

    -rw-rw-r--  1 kburcht  kburcht     592 May 11 14:45 orders.txt

    $ tar --create --file orders.tar orders.txt

    $ ls -1 orders.tar

    -rw-rw-r--  1 kburcht  kburcht   10240 Oct  3 12:06 orders.tar

    ```


    The archive file is significantly larger than the original file. To apply compression,

    choose the type of compression using `--bzip` (or *-I*), `--gzip` (or *-z*), `--compress`
    (or *-Z*),

    or `--use-compress-program` to specify a particular compression program.


    ```

    $ tar --create --file orders.tbz --bzip orders.txt

    $ ls -1 orders.tbz

    -rw-rw-r--  1 kburcht  kburcht     421 Oct  3 12:12 orders.tbz

    $ tar --create --file orders.tgz --gzip orders.txt

    $ ls -1 orders.tgz

    -rw-rw-r--  1 kburcht  kburcht     430 Oct  3 12:11 orders.tgz

    ```


    More than one file can be archived at once.


    ```

    $ tar --create --file orders.tbz --bzip orders.txt orders2.txt

    $ ls -1 orders.tbz

    -rw-rw-r--  1 kburcht  kburcht     502 Oct  3 12:14 orders.tbz

    ```


    The new archive overwrites an existing one.


    To restore the original files, use the `--extract` switch. Use `--verbose` to
    see the file-

    names. **tar** cannot auto-detect the compression format; you must specify the
    proper

    compression switch to avoid an error.


    ```

    $ tar --extract --file orders.tbz

    tar: 502 garbage bytes ignored at end of archive

    tar: Error exit delayed from previous errors

    $ tar --extract --bzip --file orders.tbz

    $ tar --extract --verbose --bzip --file orders.tbz

    orders.txt

    orders2.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'The `--extract` switch also restores any subdirectories in the pathname of
    the file. It''s important to extract the files in the same directory where they
    were originally compressed to ensure they are restored to their proper places.


    The `tar` command can also append files to the archive using `--concatenate` (or
    `-A`), compare to archives with `--compare` (or `--diff` or `-d`), remove files
    from the archive with `--delete`, list the contents with `--list`, and replace
    existing files with `--update`. `tar` silently performs these functions unless
    `--verbose` is used.


    A complete list of `tar` switches appears in the reference section.


    Another archiving program, `cpio` (*copy in/out*) is provided for compatibility
    with other flavors of `Unix`. The `rpm` package manager command is based on `cpio`.


