    \ name begins with a letter a ?\\n\"\nfi\n```\n\nThis behavior doesn't work when\
    \ quotation marks are used. Quotation marks tell the Korn shell *test* command\
    \ not to interpret special characters. A test for \"A*\" would indicate a file\
    \ named \"A*\".\n\n```\nCOMPANY=\"Athabasca\"\nif [[ \"$COMPANY\" = \"A*\" ]]\
    \ ; then\n      printf \"The company name is A*\\n\"\nfi\n```\n\nThe question\
    \ mark (?) character is a wildcard representing any single character.\n\n```\n\
    COMPANY=\"AIC\"\nif [[ $COMPANY = A?? ]] ; then\n      printf \"The company name\
