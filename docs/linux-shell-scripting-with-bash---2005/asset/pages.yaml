- pgno: 95
  md: 'New items are assigned to the array using square brackets to indicate the position
    in the list. The first position is position zero (not one). If an initial value
    is specified, it is assigned to the first position. Assigning one value is not
    particularly useful but is included for compatibility with other shells. Alternatively,
    the initial values can be assigned to specific positions by including a position
    in square brackets.


    ```

    $ declare -a DEPT[0]="accounting" DEPT[1]="shipping" \

    DEPT[2]="customer service"

    ```


    Because of the square brackets, use curly braces to delineate the variable name
    and supercede the shell''s pathname matching process.


    ```

    $ echo "${ DEPT[0]}"

    accounting

    $ echo "${ DEPT[2]}"

    customer service

    ```


    All unassigned positions in an array have no value. The position number 5 in the
    PRODUCTS array, for example, is initially an empty string. It can be assigned
    a value of hammers with an assignment statement.


    ```

    $ printf "%s" "${PRODUCTS[5]}"


    $ PRODUCTS[5]="hammers"

    $ printf "%s" "${PRODUCTS[5]}"

    hammers

    ```


    If there is an item in position zero, it is also the value returned when no position
    is specified.


    ```

    $ PRODUCTS[0]="screwdrivers"

    $ printf "%s" "${PRODUCTS}"

    screwdrivers

    $ printf "%s" "${PRODUCTS[0]}"

    screwdrivers

    ```


    The entire array can be accessed using an asterisk (*) or an at sign (@) for the
    array position. These two symbols differ only when double quotes are used: The
    asterisk returns one string, with each item separated with the first character
    of the IFS variable (usually space), and the at sign returns each item as a separate
    string with no separation character.


    ```

    $ printf "%s" "${PRODUCTS[*]}"

    screwdrivers hammers

    /home/kbrutch $[bash]

    $ printf "%s" "${PRODUCTS[@]}"

    screwdrivershammers

    ```'
