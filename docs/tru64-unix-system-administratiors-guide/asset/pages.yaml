- img_proc: true
  md: '# The Tru64 UNIX Printing System


    The Tru64 UNIX subsystem is managed by the lpd daemon. This daemon is typically
    started when the system enters multiuser mode (run level 3) and runs continuously.
    Any queued print jobs that were not printed when the system was last shut down
    are printed when lpd starts up. When a user submits a print job via the lpr or
    lcp command, the following sequence of events occurs:


    +   1. The master lpd daemon copies the requested file(s) to the specified printer''s
    spooling directory. If a printer was not specified when the job was submitted,
    lpd uses the printer specified by the LPDEST environment variable if defined,
    or else the system default printer is selected. The /etc/printcap file is scanned
    to determine the spooling directory.

    2. The master lpd reader forks a copy of itself to handle the print job, then
    returns to silently waiting for another print request.

    3. The newly forked, or child, lpd printer daemon performs the following operations:


    +   - The child lpd reads the /etc/printcap file to determine the printer''s characteristics.

    - If the printer is remote, the child lpd contacts the master lpd daemon on the
    remote system, transfers the print job to the remote system, and deletes the local
    copy from the spool directory.

    - If the printer is local, the child lpd checks the spool directory for a lock
    file. The existence of a lock file usually indicates that another child lpd is
    already processing this print queue. The lock file contains the process ID (PID)
    of the existing child lpd process and the name of the file currently being printed.
    If the lock file exists and the PID contained in the lock file is an actively
    running lpd process, the newly forked lpd printer daemon exits, since the existing
    lpd process will take care of the submitted job. The purpose of the lock file
    is to prevent more than one child lpd daemon from processing the same print queue.
    The results would be unpredictable if this synchronization was not in place and
    multiple lpd daemons were essentially fighting over incoming print requests.


    > Only if the Common Desktop Environment (CDE) is in use.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# 8.3 Adding a Local Printer


    +   - If, however, the lock file does not exist or the PID in the lock file does
    not correspond to a running lpd process, the child lpd process creates or overwrites
    the lock file, inserting its own PID and the name of the first file in the spool
    directory. Then the child lpd begins sending the file(s) to the device special
    file supporting the actual printer.


    +   - As files are printed, the child lpd daemon updates the status file contained
    in the spool directory. This status file describes the current status of the printer.


    +   - Once the print job has been printed, the child lpd daemon removes the local
    copy of the file(s) from the spool directory and updates the status file. If additional
    print jobs have been spooled for this printer, this child lpd will submit them
    in turn to the printer.


    +   - This child lpd daemon will exit when there are no more files to be printed
    in this spool directory.


    # 8.3 Adding a Local Printer


    Configuring local print services on a Tru64 UNIX system includes the following
    administrative tasks:


    +   - Ensuring the Tru64 UNIX Local Printer Support subset is installed

    - Connecting a printer to a port on a Tru64 UNIX system

    - Collecting printer information

    - Adding an entry for the printer to the /etc/printcap file

    - Creating the required printer device file and directories in the spool area

    - Starting the lpd printing daemon if it is not already running

    - Testing the printer


    # 8.3.1 Required Printing Environment Software


    The first step is to verify that the optional Tru64 UNIX Printer Support OSFPRINT
    subset is loaded. This subset is named OSFPRINTXXX, where the “xxx” specifies
    the version of the subset. It contains lpd, the line printer daemon; the various
    configuration and management utilities; and the system directory structure. To
    determine if this subset is loaded, execute the following command:'
