  md: '# Computer—Operating Systems


    # Tru64™ UNIX


    # System Administrator''s Guide


    Matthew Cheek, Scott Fafrak, Steven Hancock, Martin Moore, and Gregory Yates


    # Complete update of Digital UNIX System Administrator''s Guide


    Tru64 UNIX System Administrator''s Guide is a complete, easily accessible reference
    for both the novice and the experienced administrator. it is a generous overview
    of admin tasks and a foothold of critical needs of information so necessary to
    the stability and availability of complex systems.

    —Alan Davis, Digital Computer Consulting


    instruction to both new and experienced administrators dealing with the latest
    UNIX operating systems. The authors reveal their most useful shortcuts and "how-tos"
    and point out pitfalls to be avoided. The material included in Tru64 UNIX System
    Administrator''s Guide can''t be found in any other publication.


    With the wealth of information about Tru64 UNIX available today, it is often difficult
    to decide where to start and what to do. Tru64 UNIX System Administrator''s Guide
    provides an excellent set of materials that are easy to understand, and well-thought.
    The logical progression from installation through system management makes this
    a must reference book for any administrator''s bookshelf"

    —Steve Gonzalez, Senior Consultant, Compaq Advanced Technology


    +   - Companion website offers updates

    - Only book available for Tru64 system administrators

    - Revised by top experts on Compaq Tru64 UNIX


    I''ve just read Tru64 UNIX System Administrator''s Guide, and it is a MUST have
    for anyone who is managing a Tru64 UNIX Vx or TruCluster system. I have been using
    and managing Alpha systems since the product was DEC OS/V1.2, and there are major
    new features in Vx that can be confusing unless you get a good and clear explanation
    of how to use them—and this book provides a wealth of understandable explanations.
    I learned things I didn''t know about Tru64 UNIX from reading this book of course
    there are lots of UNIX and True clusters, which aid the function;

    —Dr. Thomas F. Blinn, software engineering, Compaq Technology Engineering


    Matt Cheek is a Senior UNIX System Administrator at Medical Archives Systems,
    Inc. (part of Pittsburgh Medical Center) and the author of Digital UNIX System
    Administrator''s Guide. Cheek has installed, configured, and written about UNIX
    systems from a variety of vendors since 1988.


    Scott Fafrak is a Senior Consultant/Integrator with BRUD Corporation and a Compaq
    Tru64 UNIX Ambassador.


    Tru64 UNIX System Administrator''s Guide is an indispensable aid to Tru64 UNIX
    system administrators. - it provides clear explanations and practical, step-by-step


    Steve Hancock is a Support Engineer in Compaq''s Tru64 UNIX Support Engineering
    Group and the author of Tru64 File System Administration Handbook from Digital
    Press.


    > In Moore is the leader of Compaq''s UNIX Expert Team within Compaq''s Customer
    Support and a recognized expert on UNIX Internals, Computer Security, and Performance.


    Greg Yates is a Senior Consultant on the UNIX Expert Team within the Customer
    Support Center at Compaq Computer Corporation. He currently specializes in UNIX
    Serviceability.


    ISBN: 1-55558-255-9


