    # 9.3.2 Process Identifiers


    Each active process is assigned a process identifier, or PID, which is a unique
    positive number. There is also a special process with PID of zero; the ps-command
    shows this as the "kernel idle" process. Despite the name, this process is far
    from idle. It contains numerous threads that perform all of the kernel''s "housekeeping"
    functions. In some cases, the "idle" process may actually be the largest and busiest
    process on the system. The /sbin/init program, which initializes the system and
    changes the system run level as needed.


    Beginning in Tru64 UNIX version 5, PIDs include information showing cluster member
    a process is running on. The "local" PID is stored in the lowest 19 bits of the
    PID and therefore range from 0 to 524,287 (2^19–1). The cluster member ID is stored
    in bits 19–24. Thus, a version 5 PID is equal to:


    ```

    (member_id * 2^19) + local_pid

    ```


    A standalone system (i.e., one that is not part of a TruCluster), has a member
    ID of zero. For example, since it is always process 1, we see the following on
    a standalone system:


    ```

    % ps -ef | grep inid

    root 1 0 0.0 10:48:09 ?? 0:00.04 /sbin/init -a

    ```


    The number 1 (immediately after "root") is the PID. Now let''s try the same thing
    on a system that''s part of a cluster:


    ```

    % ps -ef | grep inid

    root 524289 524288 0.0 Jan 21 ?? 0:01.05 /sbin/init -a

    ```


    In this case, init''s PID is 524289. If we break this into the local PID and cluster
    member fields, we see that the PID value is (1 * 2^19) + 1. This represents a
    local PID of 1, as expected, and a cluster member ID of 1. We can verify the member
    ID as follows:


    ```

    /sbin/sysconfig -q generic memberid

    generic:

    memberid=1

    ```'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# Let''s try another cluster member:


    ```

    % ps -ef | grep init

    root 1048577 1048576 0.0 Jan 21 22 ?? 0:06:05 /sbin/init -a

    ```


    On this system, init has a PID of 1048577, or (2 * 2^19) + 1, which breaks down
    to a local PID of 1 and a cluster member ID of 2. Checking the member ID:


    ```

    % /sbin/sysconfig -q generic memberid

    memberid = 2

    ```


    The PID is simply a value used by the kernel to report status changes to the user,
    and by which a user can identify individual processes when, for example, sending
    a signal to a process. A PID is assigned to each new process in a somewhat random
    manner, and there is no correlation between a process and a PID. In addition,
    a PID is unique among any active processes; PIDs are reused as needed by the system.
    Never make any assumptions about which PID will be assigned to an active process.
    Instead, use the ps utility and search for the command name of the desired process
    in order to obtain the PID of that process. For example:


    ```

    % ps -ef | grep syslogd

    root 95 1 0.0 Jun 03 ?? 0:16:80

    /usr/sbin/syslogd

    ```


    # 9.3 PID and PGID


    In addition to the PID, two other process identifiers are assigned to a process
    when the process is created: the parent process identifier (PPID) and process
    group identifier (PGID). These two IDs are inherited from the process''s parent
    process rather than being generated, and consequently, do not have the uniqueness
    requirement of the PID.


    The parent process identifier (PPID) of a particular process is simply the PID
    of the parent process that started this particular process. All processes are
    children of some other process and, except for the "kernel idle" process (PID
    0), can ultimately trace their lineage back to init (PID 1), the ancestor of all
    other processes.


    The PPID is a default output field in the SYS version of ps. The PID is useful
    to the system administrator in tracing process ownership, especially when it becomes
    necessary to terminate processes. Whenever possible, send'
  merge: -1
  pgno: 327
- img_proc: true
  md: 'processes the termination signal (via the kill(1) command) in the reverse order
    of creating. This avoids zombie processes and other unpleasant situations where
    processes can hang. (See Section 9.5 for more information on zombie processes.)


    The process group identifier PGID is a number similar to the PID, except that
    instead of identifying a single process, the PGID is used to identify a set of
    processes or a process group. An example of a process group would be a set of
    commands in a pipeline issued from a shell prompt. For example, the following:


    ```

    # cat /etc/passwd | grep ksh | cut -d - -f1 | sort

    ```


    which displays a sorted list of user IDs whose default is /bin/ksh, consists of
    four distinct processes (the cat, grep, and sort commands) in a pipeline, each
    with their own PID. All four processes, however, will have the same PGID. This
    is especially useful if, for instance, such a pipeline were long-running and you
    wanted to terminate the job. Instead of searching for and then specify each process''s
    PID in a kill command, you could specify just the PGID, and the termination signal
    would be broadcast to each member of the process group. Process groups are the
    foundation for the job-control facility in the C shell and Korn.


