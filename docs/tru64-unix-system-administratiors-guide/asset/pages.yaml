    fact that the name of each begins with the letter “r” for “remote”. These commands
    are login(1), rsh(1), and rcp(1), and are used to log in, execute commands on,
    and copy files to remote hosts. For example, the following command will log in
    to the host pluto:


    ```

    $ login pluto

    ```


    The rsh command is usually used to execute a command on a remote system. For instance,
    this command will return the process status of the remote system pluto:


    ```

    $ rsh pluto ps -ef

    ```


    Finally, the rcp command will copy a file from the local system to a remote system:


    ```

    $ rcp /tmp/file.txt pluto:/tmp/file.txt

    ```


    These r-commands will fail unless the remote host specified in each command is
    configured to allow these operations. This configuration, in which one system
    allows a second system to connect via the r-commands, is known as trusted—the
    first system trusts the second system. This trusted relationship must be managed
    carefully by the system administrator, especially if two systems in such a relationship
    are not managed by the same department, organization, or company. Depending on
    the level of trust granted, a user on one system could, either inadvertently or
    maliciously, compromise or damage another system that the user may not normally
    be able to access.'
