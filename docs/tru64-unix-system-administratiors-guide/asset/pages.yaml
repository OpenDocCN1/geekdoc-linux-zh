    is one in which a system is installed based on the contents of a pre own configuration
    file. This facility provides the ability to install a system with minimal user
    interaction. For sites with many similarly configured systems, this can result
    in quick, consistent, and accurate installations. The key to the cloned installation
    is the Configuration Description File, or CDF. The CDF contains the following
    information describing how to install a system:


    +   Details about the file systems to be created, including name, disk, and partition
    in which they will reside, and file system type


    +   Swap area(s) to be created and disk and partitions where they will reside


    +   Installation Media (CD-ROM or RIS)


    +   Various-system-specific details, such as host name, root password, geographic
    locations and time zone, and options to use when initially building the kernel


