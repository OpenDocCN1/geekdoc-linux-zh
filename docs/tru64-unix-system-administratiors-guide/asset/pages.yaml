    # 12.3.2 Starting and Stopping binlog


    The binary error log daemon, binlog, is usually started when the system starts
    from the binlog startup script, /bin/rc3.d/S10binlog, which is actually a symbolic
    link to the /sbin/init.d/binlog script. The binlog daemon is started fairly early
    in the boot process due to its importance in the error-logging process.


    When binlogd starts, it creates the file /var/run/binlog.pid, if possible. This
    file contains a single line with the process ID (PID) of the binlog process. This
    file can then be consulted to obtain binlogd''s PID when it is necessary to stop
    or restart binlogd. For example, to terminate binlog using either of these commands:


    ```

    # kill ''cat /var/run/binlogd.pid''

    ```


    or


    ```

    # /sbin/init.d/binlog stop

    ```


    Running the binlog script with a “stop” will kill binlogd by using the “kill”
    command above.


    # 12.3.3 The Binlog Configuration Files


    The binlog facility has two configuration files, /etc/binlog.conf and /etc/binlog.auth,
    that are read when binlogd starts up, and reread when it receives a hang-up signal.
    Like the syslog configuration files, these are also text files.


    # 12.3.3.1 /etc/binlog.conf


