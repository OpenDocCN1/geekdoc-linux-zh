    # 3.8 Summary


    In this chapter, we''ve explored the mechanisms by which data is stored on a Tru64
    UNIX system. This discussion should give you the basics you need to get your system
    up and manage the available storage on the system. Storage is a complex and highly
    evolving subject, and new technology will come along that will undoubtedly make
    the information in this chapter seem out-of-date. Our goal has been to give you
    a foundation for understanding where we''ve been and how to manage storage as
    it is used on a typical Tru64 UNIX system, rather than trying to cover all the
    details of a particular technology.'
