    - Scan the devices and add any new ones.

    - Create the device special files.

    - Add a disk label to the device.

    - Add the device to LSM (optional).

    - Make and mount the file system (optional).


    # 3.4.1.1 Hardware Steps


    These are the steps that are required by the storage system you are using. Since
    Tru64 UNIX can handle almost any standard device that behaves like a SCSI disk,
    the exact steps taken will depend greatly on the complexity of the devices being
    connected. There are many things that could be covered, but here are at least
    some of the things that you need to consider at this step:


    +   - Ensure the device is cabled to the system properly. This includes using
    correct cables, following proper cabling distance requirements, and using proper
    termination on the buses.

    - Make sure the external storage shelves are plugged in and operating properly.
    For example, if a wide device is used, make sure you have a wide shelf, or the
    devices will not operate as expected.

    - For Fibrechannel, some additional steps may be required to program any hubs
    and other connectivity devices so the correct disks are seen by the correct hosts.
    The primary and redundant paths should be correctly connected and logically enabled.

    - If an intelligent controller (e.g., a SCSI attached or backplane RAID controller)
    is used, then the units must be set up so they can be seen by the system console
    before the operating system will be able to access them.


