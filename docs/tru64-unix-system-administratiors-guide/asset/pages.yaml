    # 5.3.4 User Management Scripts


    Tru64 UNIX has historically provided a set of Korn scripts (adduser, removeruser,
    addgroup, and removegroup) for adding and removing user accounts and groups. In
    version 5, these scripts are little more than front-end interfaces to the command
    line utilities discussed in the previous section. The older scripts are considered
    obsolete, are likely to disappear from Tru64 UNIX in the near future. If you are
    using any of these scripts for account management, it would be advisable to migrate
    to one of the other tools described.


    # 5.3.5 Manually Editing Files


    Of the possible account management methods, the least desirable is manually editing
    the necessary system files. For example, to add a new user with this method, you
    would have to add an entry to the /etc/passwd file and possibly the /etc/group
    file, create the user''s home directory, and copy in default "dot" files (.profile,
    .xrc, etc). In addition, if you have Enhanced security enabled, you must create
    an appropriate protected password authentication database file, which, among other
    things, contains the actual encrypted password.'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'method is discouraged unless you have a thorough understanding of all the

    details of the security database files.


    If you absolutely have to manually edit the password file, use the vipw(8)

    instead of a standard editor such as vi. vipw has several useful features:


    +   - It locks the password file to prevent multiple users from making

    changes at the same time.


    +   - It performs consistency checks on the root entry in the password file.


    +   - If the hashed password database is in the password file, vipw automatically
    updates it.


    A common mistake in manually editing the password file is to use vi or

    another common editor on a system where the hashed password database is in

    use. Although the password file is modified, the hashed database is not

    updated with the changed information, system utilities (which access the

    hashed database) do not see the changes. If this happens, you can manually

    re-create the hashed database with the mkpasswd(8) utility:


    ```

    # cd /etc

    # rm passwd dir.pag

    # mkpasswd passwd

    ```


    # 5.3.6 Verification Tools


    Tru6 provides three programs to verify the consistency and integrity

    of your password database. The pwck(8) and grpck(8) utilities check the pass-

    word and group files, respectively, authck(8) checks the Enhanced

    security authentication database. For example, pwck checks each entry in the

    password file for the proper number of fields; verifies that the user name,

    UID, and GID are valid; and checks for the existence of the user''s home direc-

    tory and default shell. These utilities are extremely helpful in tracking

    down user login problems. It''s also a good idea to run them periodically as

    part of your regular system maintenance.


    # 5.4 User Account Creation


    Any of the tools described above can be used to add new user accounts.

    Which one you choose to use will depend on your system environment and

    personal preferences; however, in most cases, the Account Manager is the rec-

    ommended method. When you use it to add a user account, the Account

    Manager performs several useful tasks for you:'
