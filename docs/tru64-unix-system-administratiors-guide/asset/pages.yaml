    directory is /usr/firmware, but the location is completely arbitrary. The following
    is an example session of mounting the Firmware Update CD-ROM and copying the firmware
    update image for an AlphaServer ES40 onto a directory on the BOOTP server:


    ```

    # mkdir /usr/firmware

    # mount -rt cdfs -o noversion /dev/cdrom0 /mnt

    # cp /mnt/es40/es40_v6_0.exe /usr/firmware

    ```


    # 2.3.9.2 Modify or Create the Client Entry in the /etc/bootptab File


    The BOOTP daemon''s configuration file is /etc/bootptab, and this configuration
    file is read when the daemon receives a boot request. This configuration file
    defines information for remote clients. Edit the /etc/bootptab file and add or
    modify an entry for each system whose firmware will be updated. The format of
    an /etc/bootptab client entry is:


    ```

    <host_name>:ht=<hw_type>:ha=<hw_address>:bf=<filename>:ip=<ip_address>

    ```


    where:


    +   * host_name is the client''s system name as specified in /etc/hosts.

    * hw_type is the network interface type. Type is Ethernet and FDDI are ht=1, and
    Regular token-ring (IEEE 802) is ht=6.'
