    # 2.3.8 Bootable Firmware Update Floppy Disk


    While the Alpha Systems Firmware Update CD-ROM is the most convenient method of
    updating a system''s firmware, there may be times when using the CD-ROM is not
    possible. Perhaps the correct CD-ROM is simply unavailable, Compaq has released
    an interim firmware release between the regularly scheduled releases of the Firmware
    Update CD-ROM, which is upgraded quarterly. For these situations, Compaq has provided
    a second method of updating any AlphaSystem''s: a bootable floppy disk. Updating
    a system via a bootable floppy is not as convenient as a CD-ROM since you must
    download the necessary firmware image from Compaq and copy this image to a floppy
    disk. The advantage, of course, is that if you need the very latest firmware update,
    you do not have to wait for the next release of the Firmware Update CD-ROM.


    Compaq provides a Web site specifically for the distribution of firmware updates.
    This page provides the contents of the most recent Firmware Update CD-ROM for
    those without access to a local copy. In addition, any interim firmware updates
    that have not yet been released on a Firmware Update CD-ROM are also available
    for download. The firmware updates are listed by supported Alpha systems. The
    URL for this Firmware Update page is:


    ```

    http://gatekeeper.research.compaq.com/pub/DEC/Alpha/firmware/

    ```


    Additionally, the firmware updates are also available via anonymous FTP from:


    ```

    ftp://gatekeeper.research.compaq.com/pub/DEC/Alpha/firmware/

    ```'
