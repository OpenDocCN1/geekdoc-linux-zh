    # 10.4.3 I/O Resource


    The I/O resource on a Tru64 UNIX system is typically related to the disk subsystem.
    Disk performance on a system is usually the greatest determining factor in that
    system''s perceived overall performance. Modern CPUs, memory, and networks all
    have greater throughput than disks, and therefore, understanding disk I/O problems
    is key to configuring and tuning disk subsystems.


    Systems with disk performance problems usually fall into one of two categories:


    +   - Disk-bound systems


    +   - Swap-bound systems'
