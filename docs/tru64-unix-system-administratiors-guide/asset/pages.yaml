  md: "where n equals the number of network threads to configure. After making change\
    \ in /etc/sysconfigtab, reboot the system.\n\n# 10.5 Finding Performance Bottlenecks\n\
    \nFinding a performance problem is the first step in fixing such a problem. The\
    \ following is a simple four-step approach to identifying Tru64 UNIX bottlenecks:\n\
    \n+   1. Examine the system load average using the uptime(1) command.\n   - Load\
