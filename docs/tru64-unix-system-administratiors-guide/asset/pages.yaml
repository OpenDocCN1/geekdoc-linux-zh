    # 3.4.2 Disk Partitioning


    A characteristic of UNIX disk management is the concept of disk partitioning.
    Disk partitioning is logically dividing a disk (possibly overlapping) areas of
    varying sizes. The system administrator uses disk partitions to subdivide a disk
    into manageable pieces for containing the operating system, paging areas, and
    user applications as data. As the capacity of an individual disk increases, partitioning
    allows more efficient use of storage. In addition, segregating different types
    of data prevents system problems. For instance, placing home directories on a
    partition other than the one containing the /usr file system prevents user activity
    from affecting the operating system.


    As mentioned earlier, there are eight partitions on a Tru64 UNIX disk, and the
    partitions are labeled with the letters "a” through "h". The sizes and uses of
    the partitions on a disk are user-definable, and the system administrator is responsible
    for defining the partition layout. In Tru64 UNIX, only two partitions (a and c)
    have any particular significance. On a boot disk, the root file system must reside
    in partition a, which must start at the beginning of the disk (block 0.) Partition
    c normally refers to the entire disk.


    Determining how to partition a disk is often a matter of personal preference.
    UNIX partitioning philosophies range from the practice of not partitioning at
    all and simply using an entire disk as one large partition, to the other extreme
    of partitioning each disk into the maximum possible number of partitions. Each
    strategy has pros and cons and, with most situations, the best solution is probably
    somewhere between the two extremes. The main advantage of a single, large partition
    is that all processes and users have access to the entire disk and are not limited
    to a single partition that may be only a portion of the total disk space. This,
    however, is also a disadvantage in that any process or user has the ability to
    fill the disk and possibly impact other other processing. The other end of the
    disk-partitioning spectrum is to create many small partitions. Depending on the
    disk''s intended purpose, this'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'exactly what is needed for the most efficient use of the disk space. If, however,
    one or more of the partitions needs to be resized, the system administrator may
    find it difficult and time-consuming to manage the disk repartitioning.

    The best recommendation regarding disk partitioning is to create only enough partitions
    on a disk to sufficiently isolate different types of users and processes to prevent
    each from impacting others in the event of an unexpected or inadvertent disk usage
    increase. For example, in addition to separating partitions for the Tru64 UNIX
    operating system (the root, /usr, and possibly the /var file systems and the swap
    partitions), create a separate partition for home directories.


    Compa provides a default disk partition table, but it is up to the system administrator
    to decide whether to use this default layout or customize the partition sizes
    and locations. Most default layouts are similar to that described in Figure 3.1.
    Using this example, it should be clear that it would be impossible to use all
    of these partitions at the same time, since there would be overlap, which is not
    permitted. Assuming the partition sizes were not changed, the following are the
    possible partition combinations:


    +   * c only

    * a, b, d, e, and f

    * a, b, g, and h

    * a, b, d, and h

    * a, b, f, and g


    The first three combinations would use the entire disk, while the fourth and fifth
    would leave some of the disk unallocated. Fortunately, Tru64 UNIX allows partition
    sizes to be adjusted to suit the system requirements. The tool for adjusting the
    partition layout of a disk from the command line is disklabel(8) or diskconfig(8),
    if using a graphics terminal. We will discuss the method using the former tool
    in the following section.


    # 3.4.3 The disklabel(8) Command


    The disklabel(8) command is used to display, install, and modify a disk''s partition
    layout, or disk label, as Tru64 UNIX terms it. The disk label is physically located
    on the disk on one of the first sectors of each disk (located block 0). In addition
    to the partition layout, the disk label also contains detailed information about
    the characteristics of the disk.'
