    shell login when creating the account, or by placing /usr/bin/Rsh in the last
    field of the /etc/passwd file entry for an existing account. Upon logging into
    an account running Rsh, the $HOME/.profile for that account is executed before
    the restrictions are enforced. For this reason, the creator of a restricted account''s
