- img_proc: true
  md: '# 3.2.2 RAID Levels


    There were five theoretical levels of RAID defined by the original work done at
    the University of California at Berkeley, and they are known as RAID 1 through
    RAID 5. Some of these are never seen in practice because they offer little differentiation
    from the common levels. Each level offers different performance and redundancy
    features, and each has different trade-offs in implementation. Later on, RAID
    0 and RAID 0+1 levels were added to provide some features that were missing from
    the original theory. RAID Levels 2, 3, and 4 are rarely, if ever, seen in practice,
    but we include them here for completeness. The following is a list of each RAID
    level and its definition:


    +   - RAID 0—This RAID level is also known as striping. RAID Level 0 is not redundant,
    and hence does not fit the "RAID" acronym. In level 0, data is distributed across
    drives, resulting in higher data throughput. Since no redundant information is
    stored, performance is very good, but the failure of any disk in the array results
    in data loss.


    +   - RAID 1—RAID Level 1, also known as mirroring, provides redundancy by writing
    all to two or more drives. The performance of a level 1 array tends to be faster
    on reads and slower than a single drive, but if either drive fails, no data is
    lost. This is a good entry-level redundant system, since only two drives are required.
    On the other hand, since the data is completely duplicated, the cost per megabyte
    is relatively high.


    +   - RAID 0+1—This level was never referred to in the original Berkeley paper,
    but it is a logical extension of it. This is the combination of mirroring with
    striping, and it provides complete redundancy along with the performance improvement
    of using striping for each copy of the data. The cost per megabyte for this RAID
    level is the same as for RAID 1, but the performance tends to be better.


    +   - RAID 2—RAID Level 2, which uses Hamming error correction codes, is intended
    for use with drives that do not have built-in error detection. All SCSI drives
    support built-in error detection, so this level is of little use when using SCSI
    drives. Thus, you will never see this RAID level implementation in the real world.


    +   - RAID 3—RAID Level 3 stripes data at a byte-level across several drives,
    with parity stored on one drive. It is otherwise similar to level 4. Byte-level
    striping requires hardware support for efficient use.


    +   - RAID 4—RAID Level 4 stripes data at a block level across several drives,
    with parity stored on one drive. The parity information allows'
