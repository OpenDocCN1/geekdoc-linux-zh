    # 2.3.3 System Console


    In order to install Tru64 UNIX, the target system must have a system console.
    The system console is the display/keyboard from which many important system administration
    activities, including installation, must occur. There are two types of supported
    system consoles for Compaq found on a desktop workstation:


    +   - A graphical display, keyboard, and mouse, such as those commonly found on
    a desktop workstation


    +   - A character-based display and keyboard, such as a serial terminal connected
    to the system''s console or serial port


    An additional supported console serial interface is a modem connected to the console
    port, but this feature is only available on Compaq AlphaServers that support Remote
    System Management. This allows a remote system to be installed over a dial-up
    connection. Consult the system documentation to determine if this remote console
    is an option for your system.


    If you are installing Tru64 UNIX on a system with graphical display capabilities,
    a graphical point-and-click Installation Setup application is displayed. The two
    installation procedures, text-based and graphical, provide equivalent flexibility
    when installing a Tru64 UNIX system.


    # 2.3.4 System Disk


    Before beginning a Tru64 UNIX installation, the disk that will be the system disk
    must be selected. The system disk, or more accurately the disk that will contain
    the root file system, will be the disk from which the operating system will boot.
    There are two requirements for this disk:


    +   - The selected disk must be a supported disk for your platform. These specifications
    can be found at:


    ```

    http://www.compaq.com/alphaserver/platforms.html

    ```


    Select your platform and select the supported options link.'
