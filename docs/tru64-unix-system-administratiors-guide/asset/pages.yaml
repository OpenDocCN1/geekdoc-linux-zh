- img_proc: true
  md: '# Electronic Resources


    # A.I Mailing Lists


    There are a couple of mailing lists that are of direct interest to Tru64 UNIX
    system administrators. These mailing lists contain a great deal of useful information
    and can be an invaluable resource. Be aware, though, mailing lists can easily
    overwhelm you with their volume. An active mailing list can and will generate
    hundreds of e-mails a day. One useful strategy when subscribing to mailing lists
    is to use an e-mail list-mail] with filtering capabilities and to transfer incoming
    mailing list traffic into another folder for later perusal. In addition, many
    mailing lists provide the ability to receive “digests” where you are periodically
    sent a summary of list activity. Such digests typically are sent weekly or monthly,
    depending on the list volume. Some mailing lists are also archived, allowing easy
    keyword searching through months or years of list activity.


    Note: Always regard information read in a mailing list with caution, especially
    if the list is unmoderated. Although there will always be experts who happily
    share their experience and knowledge, there are also less experienced folks who,
    either through error or malice, provide incorrect information. Never blindly believe
    a single person''s contribution. Always substantiate any piece of information
    if you are unsure of its source or validity. Remember as well that even the experts
    can make mistakes. Mailing lists are frequently valuable sources of useful and
    pertinent information, but you should tread carefully.'
  merge: -1
  pgno: 458
- img_proc: true
  md: '# A.I.1 Tru64-UNIX-Managers List


    The Tru64-UNIX-Managers list is a quick-turnaround troubleshooting aid for people
    who administer and manage Alpha systems running Tru64 UNIX. Its primary purpose
    is to provide a Tru64 UNIX system administrator with a quick source of information
    for system management problems that are of a time-critical nature. This list allows
    any subscriber to pose a question to the entire list or contribute to another
    individual''s question.


    To subscribe to the list, send an e-mail to majordomo@ornl.gov containing the
    command "subscribe tru64-unix-managers".


    The Tru64-UNIX-managers list is archived at:


    ```

    http://www.ornl.gov/archives/mailing-lists/

    ```


    Additionally, the following URL provides the ability to keyword search the entire
    Tru64-UNIX-managers list archive:


    ```

    http://www-archive.ornl.gov:8000/

    ```


    And a couple more archive search engines:


    ```

    http://www.geocrawler.com/lists/3/Miscellaneous/530/0/

    ```


    ```

    http://www.xray.mpe.mpg.de/mailing-lists/tru64-unix-managers/

    ```


    # A.I.2 Tru64 UNIX Patch List


    The Tru64 UNIX Patch list is a nondiscussion list provided by Compaq Corporation
    that announces the latest patches on the Tru64 UNIX operating system and layered
    software products. These notices cover both Public and Entitled patches. While
    the Entitled patches are available only to contract customers, the Public patches
    are readily available via anonymous FTP from:


    ```

    http://ftp.support.compaq.com/public/unix/

    ```


    also view:


    ```

    http://www.support.compaq.com/patches/

    ```'
  merge: -1
  pgno: 459
- img_proc: true
  md: '# A.2 USENET Newsgroups


    To subscribe to the mailing list and receive individual patch notices, click on
    the "join mailing list" link on this page.


    There are several USENET newsgroups that may be of interestToTru64 UNIX system
    administrators. These newsgroups typically have an even higher "noise ratio" than
    mailing lists, and the recommendation is to be cautious with information presented
    in a newsgroup.


    +   - comp.unix.tru64—The primary Tru64 UNIX discussion group

    - comp.unix.osf.misc—Miscellaneous Tru64 UNIX discussions

    - comp.unix.admin—General UNIX system administration topics

    - comp.unix.admin.policy—General UNIX system administration issues

    - comp.unix.security.unix—UNIX security

    - comp.unix.security.misc—Miscellaneous system and network security

    - comp.unix.questions—A forum for general UNIX user questions

    - comp.unix.wizards—Advanced UNIX questions


    # A.3 Web Resources


    The Wide Web has grown tremendously since its inception and is now a valuable
    resource. Some Web pages are extremely broad in content, while others are narrowly
    focused or address single topics. The pages listed below are a good starting point
    for Tru64 UNIX system administrators. Many of these pages provide links to other
    associated pages. Over time, you will build a personal set of favorite pages.


    Note that online resources do change, and these addresses may not apply in the
    future. Readers may always use a Web search engine to identify the new location
    if an address is not found.


    # A.3.1 The Tru64 UNIX Homepage


    Compaq Computer Corporation has created a comprehensive Tru64 UNIX Web site with
    many useful and informative links to other Web pages related to Tru64 UNIX at:


    ```

    http://www.tru64unix.compaq.com/

    ```'
  merge: -1
  pgno: 460
- img_proc: true
