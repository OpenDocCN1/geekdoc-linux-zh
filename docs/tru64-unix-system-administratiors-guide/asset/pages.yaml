  md: '# 10.8 Summary


    We have barely scratched the surface of monitoring and managing performance on
    a Tru64 UNIX system. However, it is our hope that we have impressed upon you the
    importance of being familiar with a system and understanding what is “normal”
    before attempting to make adjustments. Performance problems are usually resource
    deficiencies, and the first step is identifying which resource is constrained.
    Once the resource limitation is isolated, the system administrator’s next step
    is to adjust either the workload or the resource, if possible, or collect justification
    for increasing the resource, such as purchasing more hardware.'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# Backups


    # 11.1 System Backups


    System backups are often a neglected or completely overlooked function on all
    too many UNIX systems. The reasons for this are many and varied. Many novice system
    administrators are simply unfamiliar with the variety of backup utilities available,
    while more experienced administrators may consider backups to be “grunt” . . .
    In other cases, backups are not a priority with management or users . until, of
    course, the inevitable cases and data or files are lost. Statistics have shown
    that most companies are unable to recover quickly from a data loss often never
    recover. The key to preventing this situation is developing and implementing a
    backup strategy. Given the information presented in this chapter one should be
    able to easily develop one’s own backup strategy. Following that, the various
    backup tools and utilities provided on Tru64 UNIX systems will be discussed. The
    focus will be on those that are part of the base Tru64 UNIX product, but several
    alternative backup solutions will be briefly mentioned.


    # 11.2 Backup Strategy


    Backups on a Tru64 UNIX system must be more than an occasional file dump to a
    tape. Developing an effective backup strategy is an important responsibility for
    a Tru64 UNIX system administrator. How such backup plan must take into account
    the type of data to be backed up, how frequently the data should be saved, or
    more importantly, how much data can afford to be lost, the amount of time available
    for the backup operation itself, and the tools available. Finally, backing up
    the system is only half of a complete backup strategy. Being able to restore from
    the system backups, whether the entire'
  merge: -1
  pgno: 394
- img_proc: true
  md: 'system or just a file or two, is equally important. A complete backup strategy
    must backup the entire system. This may not mean, of course, copying every file
    to tape every night. It may mean backing up key file systems nightly, or even
    more frequently if necessary, while only backing up some of the more static system
    areas, such as the root and /usr file systems, on a weekly basis. The key is having
    an understanding of your system''s data and use.


    An effective backup strategy should address at least the following issues:


    +   - What will be backed up?

    - When will the backups occur?

    - How will the backups be done?

    - Selection of backup device and media

    - Backup and restore documentation

    - Restore dress rehearsal


    Additionally, planning for the following items will make a good backup strategy
    a great one:


    +   - Offsite storage

    - Disaster recovery plan


    # 11.2.1 What Will Be Backed Up?


    Determining what to back up is the first step in developing a backup strategy.
    Of course the answer is “everything,” right? Given unlimited resources and time,
    backing up everything would be ideal. However, the requirement for systems to
    be available around the clock, and the ever-increasing amount of disk space on
    today''s modern UNIX systems, probably backing up every file each night. Of course,
    if time and resources permit, doing a daily complete backup is certainly an option.
    If this is the case, by all means do and avoid the added complexity of managing
    incremental backups. If this is not a feasible option, however the system administrator
    must decide the frequency with which to copy the system''s data to the backup
    media. The answer to this question requires some thought the nature of the system
    users'' data, the amount of data the users can afford to lose, and the restore
    strategy.


    The two categories of data on a Tru64 UNIX system are data system, which is primarily
    located in the root, /usr and /var file systems, and user data, which can be anywhere,
    including in the previously listed system file systems. Obviously, to be able
    to restore the entire system, it is necessary to have a backup copy of the entire
    system. This usually means copying all files to a'
  merge: -1
  pgno: 395
- img_proc: true
  md: 'backup media such as tape. However, if resources such as time or capacity are
    limited, an option to consider is to identify parts of the system that exist on
    the vendor''s distribution media. This can include third-party applications, static
    sections of the operating system such as the man pages, or even the entire base
    operating system itself. In the event of a system problem requiring a full system
    restoration, it would be necessary to reload these subsystems from the manufacturer''s
    media. Obviously, this is a drastic measure requiring careful consideration. Perhaps
    a better strategy would be to make separate backups of these static subsystems
    outside of the backup schedule and archive these backups. This certainly is a
    more sound strategy for the base operating system as it avoids having to reload
    the base system from scratch.


    # ## 1.2.2 When Will the Backups Occur?


    There are three factors to consider when deciding the scheduling of system backups:
    how frequently to run the backups, what time of the day to start the backups,
    and will the system be single- or multiuser mode during the backup window. Each
    of these questions must be answered before an appropriate backup strategy can
    be defined. Also, all of these questions are usually best answered by the end
    users themselves. The actual owners of the data should have an idea of how to
    run backups and at what time the day would cause the least impact.


    How often to regularly scheduled backups is directly related to how dynamic the
    user''s data is. If the data to be backed up is fairly static (unchanging over
    time), it may make sense to back up only once a week. However, if a system is
    actively updated around the clock, perhaps a single backup is insufficient and
    several backups a day are necessary. The basic question to pose “What is the minimum
    amount of data that can be lost?” If the answer to this question is 24 hours of
    updates, then a single daily backup would suffice. If, however, no more than four
    hours of updates are lost, for example, then the backup strategy must take into
    account this requirement and ensure that changes are safeguarded. This may seem
    like a drastic example, but as systems become more mission critical, the requirement
    for no data whatsoever is becoming normal.


    If, or more likely when you are faced with such a requirement of no data loss,
    your backup strategy must be more than simply copying files off tape. Modern database
    systems, such as Oracle, provide a facility where database transactions are logged,
    thus providing the ability to restore the database to any point in time. Normal
    tape backups still must be of course, but the database itself effectively continues
    to back itself up between tape backups.'
  merge: -1
  pgno: 396
- img_proc: true
  md: 'The database facility does not protect your data from accidental or intentional
    deletions, of course, and this is the reason that regularly scheduled backups
    are still vital. In the event a critical table is dropped in error, the database
    will log the table as dropped. The tape backups from the previous evening will
    be required to restore data lost in this manner.


    Another type of system backup is to use clusters, thereby having completely completely
    redundant systems. Compaq'' TruCluster product supports a redundant environment
    that prevents system or component failures from taking an application or service
    down. Similarly, either mirroring or RAID can protect your data from individual
    disk failures. Just like databases, though neither TruCluster nor mirroring will
    protect your data from human error, such as the accidental deletion or modification
    of an important file. This point cannot be stressed enough: The use of redundant
    hardware, while duplicating entire systems using TruCluster, or redundant disks/controllers
    and mirroring, or RAID, does not preclude regularly scheduled backups. Do not
    rely on such system configurations as a backup method. When a user mistypes a
    command and deletes an important file, the fact that the file is mirrored does
    not in any way prevent the file from being deleted. Clusters and disk mirroring
    are primarily used to increase system availability, and as such, are important
    tools.


    The second aspect of when a backup will occur is deciding what time of the day
    the backup process itself should be executed. The answer to this question may
    at first glance be: the middle of the night; and, depending on your environment,
    it''s likely this may be the case. However, there are situations in which the
    middle of the night is the worst time to do backups. If your organization is global
    and international users use a system, the best time will be early morning. U.S.
    time: 4:00 A.M., for instance. Another possibility is that the system''s busiest
    time may be the middle of the night, and a backup starting at 1:00 A.M. would
    further load the system. One such system supported interactive users from 7:00
    A.M. to 4:00 P.M. and processed nightly downloads from 8:00 P.M. to 7:00 A.M.,
    leaving only four hours between 4:00 P.M. and 8:00 P.M. in which to do backups.
    Therefore, the backup process was started each day at 4:00 P.M. in the afternoon.
    This example points out the necessity of knowing a particular system''s workload
    when scheduling system backups.


    Finally, the question of whether the backup will be done while the system is running
    in multiuser mode or single-user mode must be considered. Given the opportunity,
    having the system in single-user mode would ensure the most reliable or consistent
    consistent backups, since no users will be actively using the'
