- img_proc: true
  md: 'The parent/child relationship also comes into play when discussing "zombie
    processes". A zombie process is a process that has exited, but whose parent process
    has not acknowledged the child''s exit. Zombie processes are identified in a ps
    listing by the string `<defunct>" in place of the process command. Zombies themselves
    are usually not a problem for system administrators, since the only impact is
    that the zombie continues to occupy a process table slot. The various conditions
    that can cause zombie processes, though may be of concern. These causes can include
    a hung or blocked process, which is unable to catch the exit signal of its child
    processes, poor programming practices, or system problems.


    Zombie processes are named because, like the zombies of horror movies, they appear
    alive (in the ps output), but actually are not. This explains why trying to kill
    a zombie process is futile; the only way to rid yourself of zombie processes,
    other than rebooting the system, is to cause the parent process to acknowledge
    that its children have exited. If the parent process is a user shell, as the Korn
    shell or C shell, sometimes just having the user press Return at the prompt is
    sufficient to clean up its defunct children. If that fails, or the parent process
    is not a shell or is hung, a more drastic measure is to kill the parent process
    itself. When a process exits, its remaining children are "adopted" by the init
    process, which will immediately acknowledge the exited children and remove the
    zombies from the process table.


    # Controlling Running Processes


    Tru64 UNIX processes are controlled by a mechanism known as signals. A signal
    is simply that: a message sent by one process to another process. A signal can
    also be thought of as the software equivalent of a hardware interrupt. A signal
    can originate from a user application program or from an interactive session via
    the kill(1) command. There is a defined set of signals for a variety of software
    and hardware conditions that may arise during the execution of a process; see
    Table 9.4 for a list of these signals.


    | Table 9.4 Tru64 UNIX Signal Definitions |

    | Signal Number | Signal Name | Meaning |

    |---|---|--|

    | 1 | SIGHUP | Hangup |

    | 2 | SIGINT | Interrupt |'
