    # 12.3.4 Default binlog.conf


    When the binlog daemon is started, it looks for the /etc/binlog.conf by default.
    An alternate configuration file may be specified on the command line when starting
    binlog. The default /etc/binlog.conf file delivered by Compaq (Figure 12.2) is
    usually sufficient for most systems—all event classes and severity levels are
    logged to /usr/adm/binary.erlog.


    # 12.3.5 Examining the Binary Error Log


    As mentioned previously, the log file generated by the binlog daemon is a binary
    file not directly human-readable. The format of the binary error log (binary.error)
    is that the binlog daemon can quickly process and append events it receives. An
    advantage of the binary error log not being ASCII is that events can be extracted
    and sorted quickly by the Compaq-supplied tools. Three utilities are available
    for examining and manipulating the messages contained in the binary error log:


    +   - uerf(8), the UNIX event report formatter

    - dia(8), the DeEvent management utility

    - ca(8), the Compaq fault analysis utility


    # 12.3.5.1 uerf


    The uerf is a legacy of the base Tru64 UNIX operating system and is a tool to
    translate the binary error log produced by the binlog daemon into human-readable
    output''. Run with no options, the uerf command reads the file specified as the
    destination for the * entry in the /etc/binlog.conf file, typically /var/adm/binary.erlog,
    and prints on standard output each entry in chronological order, oldest events
    first. This default ordering is not tremendously useful, for the most recent events
    are usually the ones of immediate interest, especially when investigating a problem.
    A commonly specified command line option, -R, outputs the records in reverse chronological
    order, showing the most recent events first.


    Although uer is no longer supported, discussing it first is useful to get a perspective
    of the tools and to understand the progress that has been made.'
  merge: -1
  pgno: 442
- img_proc: true
  md: 'Note that the binary.errlog log file is owned by root and belongs to the adm
    group, and the default permissions are 640. If you want to use the uerf command
    to translate the default binary.errlog, you must belong to the adm group or be
    root. Optionally, you can change the ownership and permissions to allow others
    to access this file via the uerf command. For instance, to allow all users to
    read the file:


    ```

    # ls -lL /var/adm/binary.errlog

    -rw-r--r-- root adm 323016 Apr 24 22:41

    /var/adm/binary.errlog

    # chmod 644 /var/adm/binary.errlog

    # ls -lL /var/adm/binary.errlog

    -rw-r--r-- root adm 323016 Apr 24 22:41

    /var/adm/binary.errlog

    ```


    Note: the "L" switch was used above since the file is a CDSL or Context Dependent
    Symbolic Link. These symbolic links are used in Tru64 UNIX V5 and later to keep
    the member-specific files, like log files and configuration files, separate across
    members in a cluster where the file system is shared. Using the "L" tells "ls"
    to follow the link instead of reporting on the link itself.


    This change will persist across reboots as long as the file is not removed or
    renamed, in which case the binlog will re-create the file with the original default
    permissions. There is probably not a good reason to allow world access to the
    binary.errlog, but it can be done.


    Obviously, since the binary.errlog contains all binlog events since the binary.errlog
    was started, one after another, sorting out useful information would seem at first
    glance difficult. However, by using several of uerf''s command line parameters,
    you can request to see only certain types of events, events related to particular
    disks, in a specified time range, or summaries of the events categorized by quantity.
    Additionally, uerf''s output can be many pages, piping this output to a favorite
    pager, such as more(1) or pg(1), is recommended. Some commonly used uerf commands
    are:


    +   - Display the most recent system startup events, including the system configuration
    information:


    +   * uerf -R -r 300 | more


    +   - Show a summary report of all events in the binary.ertlog:


    +   * uerf -S'
