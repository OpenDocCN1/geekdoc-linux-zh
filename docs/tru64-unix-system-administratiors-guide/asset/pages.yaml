    It has been stressed before it that it is important to understand what is considered
    "abnormal" behavior by you you can be compared with "normal" activity on the system.
    In these types of cases, a "baseline" of previous performance levels is invaluable
    in putting this new performance problem in perspective. The collect utility, if
    configured to run automatically, is a performance monitoring tool that collects
    system performance information. This information forms the baseline of normal
    activity.


    Furthermore, there is a graphical user interface (GUI), called collui, that you
    can run against the collection of data to get a quick picture of historical system
    performance. The collect utility itself is available on patched V4.x systems and
    is standard on V5.0A systems and later. the collui tool is in a separate kit and
    is officially not supported by Compaq; however, it is very useful in visually
    tracking performance trends. The collui kit can be found at:


    ```

    ftp://ftp.digital.com/pub/DEC/collect

