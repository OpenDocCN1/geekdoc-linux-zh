    # 4.6 License Management


    The Tru64 UNIX operating system and many of the Tru64 UNIX layered products are
    licensed to the end user rather than solace. This means that the vendor, Compaq
    Computer Corporation in this case, has sold only an authorization to use a particular
    product. The license agreement between the software vendor and the end user specifies
    the terms of the license. These license terms typically specify each party''s
    responsibilities regarding the use of the software product. A system administrator
    should be aware of the license to ensure that the organization honors the terms
    of the license. If that were all there was, a system administrator''s responsibility
    would be minimal and would consist mostly of administrative paperwork. However,
    certain software products produced by Compaq have special licensing characteristics
    and requirements.


    # 4.6.1 Types of Licensing


    Two types of software licenses are issued by Compaq, and a software product might
    be licensed only one or the other, or optionally both ways, depending on the product
    itself. A producer''s licensing type is indicated on the license information provided
    with the software media and documentation.


    # 4.6.1.1 Availability Licensing


    A software application might be licensed to allow unlimited use of the product,
    but only on certain models of processors. This type of license is called an availability
    license or, occasionally, a traditional license. An availability license is purchased
    based on the model and size of the Alpha system on which the software product
    will run. For example, an availability license sized for a small server such as
    AlphaServer DS10L could not be run on a large AlphaServer GS320. However, an availability
    license purchased for the AlphaServer GS320 would run fine on the AlphaServer
    DS10L. Since the'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# 4.6 License Management


    159


    price of the license is proportional to the price of the computer, a license for
    a GS320 is usually significantly more than the same license for a DS10L. While
    it would be foolish to purchase more licenses than necessary, the ability to move
    a “larger” license to a “smaller” system may be useful when planning for a “backup”
    system. In the event that a main server is unavailable, it is possible to move
    a software product and its license to a smaller (and less expensive) system so
    the product is still available to its users.


    # 4.6.1.2 Activity Licensing


    Other products may be licensed to allow only a certain number of users to run
    the product simultaneously. This type of license is called an activity license,
    or a per-user or concurrent use license. For example, consider a software product
    such as a compiler that is used by many, but not on a constant basis. Analyzing
    the usage of the compiler may indicate that no than five users are ever actively
    compiling at any time. An activity license providing unlimited use for such a
    product may be prohibitively expensive and unnecessary, but an activity license
    for five concurrent users would be very economical and likely be sufficient. If,
    in this example, the number of developers was increased and the new concurrent
    use average was eight users, all that would be necessary to purchase three per-user
    licenses to increase the size of the activity license.


    While all software products are licensed, only certain software licenses are enforced
    that is, the product will only run with proof of a license. Since software is
    a source of revenue for a company such as Compaq Computer Corporation, the vendor
    must take measures to protect that software investment and prevent illegal use
    of software licenses. For this purpose, Digital (now Compaq) created the License
    Management Facility for Tru64 UNIX.


    # 4.6.2 The License Management Facility (LMF)


    The License Management Facility (LMF) for Tru64 UNIX was developed as a way for
    software products to validate licensing information. The LMF maintains a list
    of licensed software products on a particular system in database. The system administrator
    is responsible for managing this license database to ensure that all LMF licensed
    products are registered. Tru64 UNIX system will have at least two, and probably
    more, LMF licenses as the operating system itself is a licensed product. Licensed
    software products will call license-checking functions to check that a valid license
    is registered with the LMF before making the product available for use. In addition
    to meeting


    Chapter 4'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'the legal responsibility of licensing, properly administering the license data-base
    ensures users are able to log in to the system and run the software products necessary
    to doing their job.


    In addition to the License Management Facility, there are other types of license
    managers available that run on Tru64 UNIX. Most of these license managers are
    third-party products that independent software developers used for license management
    with their applications. These other license managers, FLEXIm in GLOBetrotter
    Software is an example, typically ship with the particular software product and
    are not part of Tru64 UNIX. This section will only concern itself with Compaq''s
    LMF and the software products that support LMF. If it becomes necessary to install
    and manage a third-party license manager, consult the documentation that came
    with the product for assistance. Regardless, any such third-party license manager
    will run in conjunction with Compaq''s LMF and understanding the operation of
    LMF is still a requirement.


    If a software product''s licensing information is in the form of a Product Authorization
    Key (PAK), the software product supports the LMF, and the PAK must be registered
    with the LMF in order for the software to be used. A PAK is a special document
    incorporating security printing that makes it difficult to forge or copy, and
    as formal purchase of software license, should be retained indefinitely in a secure
    place. See Table 4.21 for description of the fields on a license PAK. In addition
    to these fields, a PAK usually provides the one or more of the following useful
    pieces of information, none of which are entered into LMF:


    +   Customer P.O.—This field may contain the purchase order used to purchase this
    license.


    +   License Issue Date—This is the date the PAK was actually produced by Compaq.


    +   Descriptive Product Name—Since the PAK PRODUCT NAME field is limited in length,
    this field usually contains a more readable description of the licensed software
    product.


    +   License Type—This field indicates whether the license is a Traditional (Availability)
    or Concurrent (Activity) license type.'
