    This second command invokes the editor specified by the EDITOR environment variable,
    or /usr/bin/ex by default, with the protected password entry for the specified
    account.


    Another useful command is authck(8), which checks the integrity and consistency
    of the authentication database. If you encounter difficulties with your Enhanced
    security configuration, one of the first actions you should take is run authck
    to see if there are any problems with the authentication data. If so, you can
    repair the problems using edauth.


    # 6.6.4 Account Management


    One of the primary responsibilities of a UNIX system administrator is user account
    management. This includes account creation, modification, and removal. Unlike
    earlier versions of UNIX, version 5 uses a common set of account management tools
    for both Base and Enhanced security. The primary tool is the CDE Account Manager
    GUI, dxaccounts.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'management can also be performed using the SysMan Accounts menu, or command-line
    utilities such as useradd, usdel, and usermod. The command-line utilities are
    sometimes necessary due to an inability to run X Window System applications, or
    in non-interactive situations such as script scripts to automate the addition
    of user accounts. See Chapter 5, “User Accounts,” for details on account and group
    creation, deletion, and modification in both Base and Enhanced security.


    The Account Manager is also used to edit the new user account template, which
    specifies the default account parameters used when a new account is created. These
    default parameters, which can be overriden on a per-account basis, include password
    length, account expiration date, time-of-day restriction, and so on. These parameters
    are stored in the authentication database and can be modified by the superuser
    using the methods discussed above.


    The Account Manager has several functions that are specific to Enhanced security:


    +   - Locking and unlocking accounts

    - Re-enabling disabled accounts

    - Retiring accounts


    Locking a user account is an administrative function. The superuser explicitly
    locks the account so that it cannot be used until it is unlocked by the superuser.
    This might be done if a user is on a leave of absence, suspected of improper activity,
    or for any other reason requiring the account to be temporarily unusable. The
    Account Manager displays a small lock symbol next to the name of a locked account.


    A disabled account is slightly different from a locked account. Locking is an
    explicit action on the part of the superuser, but disabling occurs automatically
    when a user violates one of the thresholds specified in the login controls (for
    example, too many unsuccessful login attempts). A locked account can''t be used
    until it is explicitly re-enabled by the superuser. Disabled accounts can be re-enabled
    by the superuser, but they will automatically unlock after a period of time determined
    by parameter u_unlock. For example, if a user account is disabled due to excessive
    login failures, and the account has a u_unlock value of 86400 (the number of seconds
    in one day), then the account is disabled for 24 hours; the user will not be able
    to log in during that interval, even with the correct password. After 24 hours,
    the user will have another chance to try and log in—but if he fails again, it
    will be the further 24 hours before he can try again.'
  merge: -1
