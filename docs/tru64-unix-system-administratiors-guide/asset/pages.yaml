  md: '# 9.9.3 batch


    The batch(1) command is simply an interface to the `at` command that submits a
    job for execution when the system load level permits; batch is intended to be
    run interactively, with the commands to be scheduled to be read from standard
    input. Depending on how busy the system is at the time of submission, batch jobs
    may be executed immediately or queued in the /var/spool/cron/atjobs directory
    for execution at a later date. The following is an example of batch submission
    of a short job:


