    # 9.9.2 at


    While the cron facility and its crontab scheduling files are for regularly scheduled
    jobs, the at(1) command submits a job to be executed only once at a user-specified
    future time. Jobs submitted via the at command are packaged into a script and
    placed in the /var/spool/cron/atjobs directory for future execution by the cron
    daemon. The at command provides a more complete environment by including all active
    environment variables in the resulting script file. The at command also allows
    specifying which shell is used to run the job, via the [-c |-s |kj] switches for
    C shell, Bourne shell, and Korn shell, respectively. The default shell is the
    Bourne shell, /usr/bin/sh.


    The at command''s job submission syntax is very flexible, allowing an English-like
    date/time argument in addition to a more conventional CCYMMDDhmm.SS format. For
    example, either of these commands will schedule a system reboot for the following
    Saturday at 2:00 A.M.:


    +   # at 2 am Saturday /sbin/reboot

    # at -t 200104280200.00 /sbin/reboot


    The at command writes the job number and the scheduled time to standard error
    upon job submission, for example:


    ```

    job root.869299200.a at Sat Apr 28 02:00:00 2001

    ```


    The format of the job name is user.xxxxxxxx.y, where the “user” identifies the
    user who submitted the job; xxxxxxxxxx is a 9-digit number based on the scheduled
    date; and y indicates the job type, as shown in Table 9.5.


    # Table 9.5 Job Type Indicators for at(1) Command


    | Character | Job Type |

    |---|---|

    | a | at job |

    | b | batch job |

    | e | ksh job |

    | f | csh job |'
