  md: '# 10.3 Performance Indexes


    The answers to some of these questions are learned by logging into the system
    and monitoring its behavior. Tru64 UNIX provides tools and utilities that allow
    the system administrator to view the usage of various system resources. The next
    section (10.4), “System Resources,” covers the usage of these tools and the interpretation
    of their output. Over time, a system administrator will come to understand what
    is “normal” for a given system. Normal, of course, is a relative term and assumes
    that the workload does not change. For example, a system that supports an organization''s
    financial activity may seem quite speedy during the first part of the month, but
    may become nearly unusable around the end of the month as the system is under
    stress to complete the month-end close-out. In this case, both situations are
    normal as long as it is understood what the system is being asked to do and when.
    If, however, the system’s response time were to increase dramatically in the middle
    of a month, this behavior would most likely be considered abnormal and worthy
    of investigation.


    Some of the other characterization questions listed above are answered by working
    closely with the user community and understanding their needs and perceptions.
    Users tend to accept an average response time as normal, and jobs are expected
    to complete in the same amount of time every time they run. These expectations
    are not always valid, but exist nevertheless. In a time-sharing system, as Tru64
    UNIX, an individual user’s response time can vary greatly depending on the other
    work going on at the same time. Users who come from a PC-only background, for
    example, may not understand this, and it is up to the system administrator to
    educate them rather than have an effect on the system’s behavior.


    In addition, you may discover that a user’s perception of reduced response times
    or increased execution times may be due to factors outside your control. For example,
    a user may be connected to the system via a slower connection than usual, resulting
    in a slower response just to that user’s terminal. The system may be running well
    within the range of acceptability but may seem slower to that. Keep in mind that
    the purpose of the system is for the completion of productive work for everyone,
    regardless of system irregularities, when you are called upon to evaluate the
    inevitable user complaints.


    A Tru64 UNIX system administrator needs to develop the skills to interpret user
    complaints. One of the most important of such skills is patience. When you will
    occasionally receive feedback that “the system seems slow.” When this happens,
    work with the user(s) to quantify their perceptions by enlisting their help in
    collecting the basic information you need:'
