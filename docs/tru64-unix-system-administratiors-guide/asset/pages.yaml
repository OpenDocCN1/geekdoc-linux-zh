  md: 'recovery from the failure of any single drive. The performance of a level 4
    array is very good for reads (the same as level 0). Writes, however, require that
    parity data be updated each time. This slows small writes, in particular, though
    large writes or sequential writes are fairly fast. Because only one drive in the
    array stores redundant data, the cost per megabyte of a level 4 array can be fairly
    low.


    +   RAID 5—RAID Level 5 is similar to level 4 but distributes parity among the
    drives. This can speed small writes in multiprocessing systems, since the parity
    disk does not become a bottleneck. Because parity data must be skipped on each
    drive during reads, however, the performance for reads tends to be considerably
    lower than a level 4 array. The cost per megabyte is the same as for level 4.


    # 3.2.3 Hardware vs. Software RAID


    With the changes in LSM implemented Tru64 UNIX 5.0, you''ll find there a considerable
    blurring of the lines in what can (and should) be done with RAID in hardware and/or
    software. As usual, there are trade-offs to consider when deciding whether implement
    RAID in software or hardware. When deciding whether to implement RAID in hardware
    or software, you must usually choose between the three main factors of performance,
    complexity, and flexibility. Any change in one of these factors could cause a
    detrimental impact in the others. Below are some tips (gained through extensive
    experience) designed to help you when deciding on a hardware or software RAID
    solution.


    First, as a general rule, the highest performing RAID be implemented in hardware
    (smart controller firmware), but greater flexibility is gained by implementing
    RAID using a volume manager like LSM. Therefore, when performance is the primary
    factor, try to implement RAID in hardware as much as possible. Not only will this
    provide the best performance, but it will reduce complexity of the solution. Any
    reduction of complexity in the system administration staff to deal with device
    failures. Complex systems can do fail in unpredictable ways, so simpler tends
    to be better. On the other hand, if flexibility is the primary objective, then
    software RAID is the clear choice.


    Second, don''t over-implement RAID. We have many options to choose from, including
    LSM, hardware RAID controllers, and AdvFS file striping. Therefore, it would be
    easy to implement RAID at the wrong level and unintentionally reduce performance,
    increase complexity, or reduce availability.'
