    ```


    One confusing aspect of the tar command is whether or not to specify a hyphen
    (-) at the beginning of a flag set. In some UNIX vendors'' implementations of
    tar, including very old versions of Tru64 UNIX, the minus sign is optional. Modern
    versions of Tru64 UNIX, on the other hand, do not allow this option. If a hyphen
    is specified in front of a flag that requires an argument, the argument must follow
    immediately after the flag. If no hyphen is specified in front of a flag set,
    the arguments, if any, must follow the entire flag set in the order of the specifying
    flags. For example, the following two commands are equivalent:


    ```

    $ tar -c -f /dev/tape/tape0_d0 -b 20 /data

    $ tar cfb /dev/tape/tape0_d0 20 /data

    ```


    Both commands create an archive on /dev/tape/tape0_d0 with a blocking factor of
    20, which contains the contents of the /data directory.


    The opposite of creating archives is, of course, extracting files from a tar archive.
    An example of this operation is:


    ```

    $ tar xf /dev/tape/tape0_d0

    ```


    This will extract the entire contents of the archive residing on a tape. Similarly,
    an archive can be a single tar(1) formatted file. For example:


    ```

    $ tar xf /tmp/data.tar

    ```


    Where files extracted from an archive are restored is determined by the manner
    in which the files were copied to the archive in the first place. If, when creating
    an archive, the files are specified with an absolute pathname, for example:


    ```

    $ tar cf /dev/tape/tape0_d0 /etc

    ```


    the files will be restored to their original location when the archive is extracted—in
    this case, the /etc directory. However, if a relative pathname is specified when
