    See Chapter 7, “Networking,” for details on configuring the network.


    # 8.5.2 Name Resolution


    Name resolution is a fancy way of saying, "Can one system determine the IP address
    of another system given only the host name of the remote system?" The most expedient
    way to ensure successful name resolution is to place an entry for every remote
    system in the /etc/hosts file. This is a requirement for both the print server
    and for any remote print clients. For example, in the following /etc/hosts file
    fragment, jupiter is the print server host name, and saturn and pluto are print
    client names:


    ```

    192.168.5.2  jupiter

    192.168.5.3  saturn

    192.168.5.4  pluto

    ```


    In addition to the local /etc/hosts file, there is also the Domain Name System
    (DNS) as a way of resolving IP addresses. DNS is also known as the Berkeley Internet
    Name Domain, or BIND. DNS is a distributed database that contains information
    used to translate host names into IP address and vice versa. To see if a host
    is known to DNS, use a command like this:


    ```

    $ nslookup jupiter

    Server: fathom.company.com

    Address: 192.168.24.6

    ```


    ```

    Name: jupiter.company.com

    Address: 192.168.5.2

    ```


    Here fathom is a DNS server and returns the IP address for jupiter. In this case
    there is no reason to include a manual entry for jupiter in your /etc/hosts file.


    # 8.5.3 Authorizing Remote Print Access


    Tru64 UNIX, by default, disallows remote print access. Allowing users on remote
    systems to submit print jobs to another system is a capability that, the system
    administrator, must explicitly enable. When the lpd print daemon on a client system
    contacts the lpd daemon on a remote system with a print'
