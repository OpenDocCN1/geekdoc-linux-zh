- img_proc: true
  md: '# User Accounts


    # 5.1 User Account Management


    User account account management is, if not the most important job of a system
    administrator, certainly one of the most visible. An individual''s login account
    defines the overall system to the user. When the system administrator configures
    the login environment appropriately by determining the command path, setting an
    informative shell prompt, defining helpful aliases and necessary environment variables,
    and assigning group memberships, the users can immediately become productive.


    Actually, creating user accounts and the eventual removal or retirement of user
    accounts is just the beginning, and end, of user account management. In between
    is the day-to-day support of your user community. This includes account modifications,
    such as resetting passwords and adjusting group memberships, ensuring that users
    are aware of upcoming system changes or outages, and managing security to allow
    users to get their work done while protecting the system from accidental or intentional
    harm. Behind the scenes, the administrator should define user and group IDs (UIDs
    and GIDs) to avoid collisions, create appropriate default account "dot" files,
    create and monitor home directory file systems, and perform a variety of other
    tasks necessary for the smooth operation of a Tru64 UNIX system.


    This chapter covers the details of adding and removing user accounts, plus other
    aspects of user account management. In addition, some administrative strategies
    to be aware of are presented.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Base Security vs. Enhanced Security


    Before moving on to the particulars of user account management in Tru64 UNIX,
    the two levels of security available in Tru64 UNIX must be explained, since the
    system''s security level impacts account management in a variety of ways. The
    two levels are:


    +   - Base security

    - Enhanced security (also called C2 security)


    Base security is the default security level when installing Tru64 UNIX, and is
    distinguished by traditional UNIX passwords. Base security is often sufficient
    for single-user workstations or less critical systems.


    Enhanced security provides a rich set of password and login controls. The password
    controls include shadow passwords, configurable password length (both minimum
    and maximum), and password usage history. The login controls include per-terminal
    settings for delays between successful or failed login attempts, the ability to
    retire or lock accounts, and logging of successful and unsuccessful login attempts.
    Enhanced security is the recommended security level for Tru64 UNIX systems deemed
    sensitive to the type of data they contain, and especially for any systems connected
    to the Internet.


    The command to determine the current system security level is:


    ```

    # /usr/sbin/rcmgr get SECURITY

    ```


    If the string "BASE" or no output is returned, you are running Base security.
    If, however, the string "ENHANCED" is returned, Enhanced security is enabled on
    your system. See Chapter 6, "Security," for instructions on enabling and configuring
    Enhanced security on your system.


    # Account Management Tools


    Tru64 UNIX provides several tools to add, remove, and modify user accounts. These
    are:


    +   - The Account Manager (dxaccounts)

    - The Accounts option in the SysMan menu (sysman accounts)

    - Command line utilities (useradd, usermod, userdel, groupadd, groupmod, and groupdel)'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# 5.3 Account Management Tools


    The following sections discuss the features and advantages of each of these tools.


    # 5.3.1 Account Manager


    The Tru64 UNIX Account Manager, dxaccounts(8X), is the recommended utility for
    managing user accounts. Account Manager is an X Window system graphical user interface
    (GUI) that can be used to add, modify, and delete user accounts and groups. For
    systems running Enhanced security, Account Manager is also used to modify individual
    and system-wide security parameters, such as password aging and length.


    Account Manager is invoked through the CDE Application Manager, which is opened
    by selecting the Application Manager icon from the CDE Front Panel, followed by
    selecting System_Admin, then DailyAdmin, and finally Account Manager. Once you
    double-click on the Account Manager icon, you will be prompted via a Get Password
    dialogue box for the root password, unless you''re already logged in as root.
    The initial Account Manager window is shown in Figure 5.1.


    Additionally, you can start Account Manager from the command line:


    ```

    # /usr/bin/X11/dxaccounts

    ```


    ![](img/3eed431236346b7d400c9572311a8aa8_188_0.png)'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'The buttons at the top of the screen in Figure 5.1 make it easy to perform
    account management functions. For example, you can lock an account by selecting
    the icon for that account and clicking on the Lock button. Locked accounts are
    indicated by a small lock symbol next to the account. To add a new user, click
    the Add button, and Account Manager will display an account template (Figure 5.2).
    Fill in the template with the appropriate information and click OK, or your account
    is added to the system.


    You can also use Account Manager to set the general account management options
    for your system. This screen (Figure 5.3) is accessible from the Options menu
    on the initial screen. You can optionally allow duplicate UIDs (in Base security
    only) and duplicate GIDs. In general, duplicate UIDs are a bad idea; file permissions
    and most system activities are tracked by UID, not user name, so it becomes nearly
    impossible to distinguish between multiple users with the same UID. The same argument
    is true for duplicate GIDs, although this is a less serious issue than duplicate
    UIDs.


    Figure 5.2  Adding a user in Account Manager.


    ![](img/3eed431236346b7d400c9572311a8aa8_189_0.png)'
  merge: -1
