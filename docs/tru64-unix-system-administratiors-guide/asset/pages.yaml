  md: '# 5.5 User Account Removal or Retirement


    +   - Ensures that the new user name and user ID do not already exist

    - Adds the user to specified secondary groups

    - Updates /etc/passwd and (if necessary) Enhanced security authentication databases

    - Creates the home directory (optional)

    - Copies default configuration files from a skeleton directory (optional)

    - Configures password aging and quality parameters (optional, if using Enhanced
    security)

    - Sets parameters to limit system resource usage (optional, if using Enhanced
    security)

    - Forces a password change at initial login (optional, if using Enhanced security)


    To add an account from the main Account Manager window (Figure 5.1), click the
    Add icon or use the Accounts pull-down menu to select Add New User. The Add/Modify
    User window (Figure 5.2) will be displayed with default values in certain fields.
    These defaults are acceptable for the user being added, all you need to do is
    enter a user name and password, and select either Apply or OK. Alternatively,
    you can create a new account by cloning an existing account. Click on an existing
    user, then use the Copy and Paste buttons to create a copy of the account, then
    double-click on the new account to add the required information (user name, UID,
    and password).


    You may optionally enter comments for a new account, such as the user''s full
    name, phone number, and location. This is helpful in identifying users via the
    finger command, especially on systems with more than a few accounts. In addition,
    this information can show up as the "From," information in outgoing mail.


    When the time comes to remove a user account—for example, when a user leaves the
    organization or simply no needs access to the system—you have two options: completely
    remove the account from the system, including the home directory and all files
    owned by that account, or retire the account. Retiring an account is an option
    if the system is using Enhanced security; retirement permanently locks the account,
    preventing reuse of that account''s user ID and name. Once an account is retired,
    it cannot be reenabled without manually editing the Enhanced security authentication
    database (see Chapter 6 for details).'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 5.5 User Account Removal or Retirement


    Whether to remove or retire an account depends on two factors:


    +   * The local security policy

    * The current security level (Base or Enhanced)


    Your locally defined security policy may specify the procedure to follow when
    an account is no longer needed. This may include disabling the account but not
    removing any of the account''s files for a specified time period; in addition,
    if your organization is using Enhanced security and is required to conform to
    the more stringent C2 account requirements, you may have to retire accounts rather
    than remove them.


    Generally speaking, you can use any of the account management tools to delete
    an account. However, if you''re running Enhanced security on a version of Tru64
    UNIX older than V5.1, Account Manager will only allow you to retire an account,
    not delete it. Deleting an account is a straightforward process. Select a user
    account to be deleted, and then choose Delete from the Edit menu or click the
    Delete (trash) icon. Retiring an account is similarly straightforward: select
    the account, and then click the Retire (“no”) symbol. A dialogue is presented,
    giving you the option to remove the user''s files.


    When an account is retired, the icon for that user remains in the account view
    of the Account Manager, but it is marked as retired with the international (“no”)
    symbol (a red circle crossed by a diagonal line). You can still select a retired
    account icon and view its account information, but you cannot modify any of the
    fields.


    # 5.5.1 Locking Accounts


    There may be times when you wish to temporarily disable or “lock” an account without
    going as far as removing or retiring the account. For example, this might be desirable
    if a user goes on an extended leave of absence or is suspected of improper activity.
    The account management tools provide all option to lock a user account. The capability
    to lock an account exists in both Base and Enhanced security, although the underlying
    method for locking an account is different for each level.


    Using either of the graphical interfaces (Account Manager or SysMan Accounts),
    select a user account by clicking on its icon, then choose the Lock option from
    the menu. Similarly, to unlock a locked account, select the account and then choose
    Unlock. You can also use the usmod utility to'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# User Account Modification


    accomplish this from the command line. For example, to lock the account user jsmith,
    the command would be:


    ```

    # usermod -x administrative_lock_applied=1 jsmith

    ```


    To unlock the account, change the value to 0:


    ```

    # usermod -x administrative_lock_applied=0 jsmith

    ```


    Modifying user accounts is an ongoing activity that includes actions such as changing
    a user''s default shell, adding a user to additional groups, and similar tasks.
    All of the account management utilities described above can be used to modify
    user accounts. For example, from the Account Manager display shown in Figure 5.1,
    simply click on the desired account icon and select Modify... from the Edit pull-down
    menu. This opens the familiar Add/Modify User window. Select and change the desired
    fields and click the OK or Apply to complete the edit.


    In some cases, users may be able to make their own modifications. For example,
    users can change their own passwords using the passwd(1) command, or in NIS environments,
    the yypasswd(1) command. If you are using Enhanced security, you can optionally
    restrict the ability of users to choose their own passwords; see the Tru64 UNIX
    Security Manual for details.


    Similarly, users can change the descriptive information in the comments or "gecos"
    field of their /etc/passwd entry by using the chfn(1) command. This information
    is displayed in the output of the finger(1) command. Users can also choose a new
    default shell from the list of available shells with the chsh(1) command. Interestingly,
    passwd(1), chfn(1), and chsh(1) are all hard links to a single executable program;
    the commands "passwd -f" and "passwd -s" may be substituted for chfn and chsh,
    respectively.


    # Managing User Account Resources


    There are several types of resources that a system administrator needs to consider
    when managing user accounts:


    +   - User Names

    - UID Numbers

    - User Groups

    - User Disk Space'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'These resources are finite and a system administrator must ensure that they
    are allocated properly. On a system with few accounts, these resources probably
    don''t need to be tended as closely as on a system with hundreds and thousands
    of users. Frequently, user accounts are created shortly after system installation,
    with little thought given to the long-term management of these resources. Some
    strategic planning prior to turning your users lose on the system will be worthwhile
    in the long run, either by reducing your day-to-day “fire fighting” or by eliminating
    massive and painful system reorganizations. Of course, you must know something
    about your users'' workload patterns and disk space requirements, both now and
    in the future, to make adequate plans. This is sometimes impossible or unrealistic,
    and sometimes you may just have to make your best estimate. Experience will have
    to guide you in these situations.


    # 5.7.1 User Names


    User account names have only a few format restrictions:


    +   - One to eight characters in length

    - Cannot begin with a hyphen (-)

    - Cannot contain a colon (:)


    The eight-character limit is partially relaxed in Tru64 UNIX version 5. The Tru64
    UNIX kernel supports longer user names (up to the value of parameter login_name_max
    in the generic subsystem), but most system utilities still observe the character
    limit. It appears likely that a future version of Tru64 UNIX will fully support
    longer names.


    In addition, it is recommended that user names be unique and not contain either
    capital letters or periods. Beyond this, there is no universal standard or convention.
    User account names are, by their very nature, often a personal choice; on systems
    with just a handful of users, this is probably fine. However, as the need for
    user accounts and/or the number of systems increases, the need for a local convention
    becomes obvious. For example, if the local convention is the user’s first initial,
    followed up to seven characters of the last name, the likelihood of more than
    one “smith” is proportional to the size of the organization. A less desirable
    solution is to select a naming convention based on semi-random strings. While
    this might guarantee uniqueness, many users and administrators prefer to have
    account names that bear some relationship to the user’s real name. For example:'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# 5.7 Managing User Account Resources


    ```

    $ who

    mcheek tty1 Jun 4 09:35

    p5mpc7 tty2 Jun 4 15:19

    ```


    The administrator should select a reasonable standard and expect to make exceptions
    for name conflicts (for instance, the second and subsequent jsmith''s might use
    their first and second initials plus last name) or individual user resistance,
    as longtime UNIX users occasionally become very possessive of their chosen account
    names. Name of the game with user account names is consistency, both on a single
    system and across multiple systems that users share.


    # 5.7.2 UID Names


    The User ID (UID) is a unique number between 0 and 4,294,967,293 (the largest
    number that can be represented with 32 bits) that the system uses to identify
    a user and determine file access permissions. (If you are running an older version
    of Tru64 UNIX, the maximum UID may be limited to 65,535 or 262,143.) The UID should
    be unique across a system (or group of systems) to avoid UID collisions. File
    access permissions are checked by UID, not user name, so two users with the same
    UID will automatically have access to each other''s files. For this reason, uniqueness
    across multiple systems becomes crucial if you are using the Network File System
    (NFS) to share files. If two different users on two different systems have the
    same UID, each user would have access via NFS to the other user''s files, depending
    on how the file systems are mounted. The Network Information Service (NIS) can
    be used to solve this problem; with NIS, you can share common user and group definitions
    among your systems, ensuring that a specific UID or GID represents the same user
    or group across your systems.


    The root or superuser account is UID zero (0). By convention, UIDs from 0 to 99
    are considered “system” UIDs, and you should avoid creating accounts with UIDs
    in this range. One important reason to not use these system UIDs is to avoid UID
    conflicts if future releases of Tru64 UNIX create new system-required accounts.
    Simply create your accounts with UIDs starting at 100 and you will have no problems.
    If you wish to be cautious, start at 1000 instead.


    One final recommendation regarding UIDs is to select ranges of UIDs for different
    types of users. For instance, you could place system administrators and operators
    in the range 100–999, developers in the range 1000–1999, application testers in
    the range 2000–2999, and so on. Categorizing you'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'users and placing them in appropriately sized UID ranges is a helpful way to
    organize your user community.


    # 5.7.3 User Groups


    Along with UIDs, you should plan your user groups and group IDs (GIDs). Groups
    provide a mechanism to allow users with similar needs or responsibilities to share
    resources based on group memberships. A user account must belong to at least one
    group, which is specified by the GID field of the /etc/passwd file. This group
    is called the account''s primary group. Additional group memberships, which are
    called secondary groups, are specified in the /etc/group file.


    A UNIX account may belong to up to 32 groups. This may cause a problem in environments
    using a mix of servers from different vendors, because some variants of UNIX support
    only 8 or 16 groups per user. For example, if you have an NFS server that supports
    only 16 groups per user, but you have a user on your Tru64 UNIX system who belongs
    to more than 16 groups, that user may not be able to access file systems mounted
    from that NFS server. If this is likely to be a problem in your environment, you
    can change the maximum number of groups per user on your system with the following
    command:


    ```

    # usermod -D x max_groups_per_user=16

    ```


    Group IDs (GIDs) are unique numbers between 0 and 4,294,967,293 (65,535 in older
    versions) that the system uses to identify a specific group. Like UIDs, GIDs should
    be unique across a system (or group of systems) to avoid collisions. If you are
    using NFS to share file systems over the network, GID uniqueness is doubly important
    to avoid security holes. For example, suppose that system A has a user group named
    payroll with a GID of 2001. The members of the payroll group can access the accounting
    system containing the company''s salary data. Now suppose that system B has a
    group named clerks, also with a GID of 2001. Because the GIDs are the same, the
    clerk accounts will have the same group access as the payroll group to any NFS-mounted
    file systems. If the salary data is on an NFS-mounted file system, a clerk could
    possibly read or (even worse) change or delete company salary information. This
    is an extreme example, but the potential for this type of exposure is significantly
    reduced by ensuring unique GIDs (with NIS,) across your systems.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# 5.7 Managing User Account Resources


    Only members of group 0 (the system group) are permitted to become the superuser
    (root) by using the su(1) command. It is especially important to add that individuals
    who need the ability to become the superuser to group 0 if remote root logins
    are disabled. If this is not done, the only way to become the superuser is to
    log in as root on the system console.


    Groups are used by the system administrator to provide shared access to files
    and directories to users with similar responsibilities or jobs. For instance,
    all developers need access to the source code for an ongoing development project
    would likely be placed in the same group, and the source files would be group-owned
    with the permissions to provide group-read and possibly group-write access. This
    would allow all members of the developer group to read or write the files, regardless
    of who created or currently owns the files. Determining the number and membership
    of groups on your system requires some level of knowledge about your user community
    and their work. Group management is frequently an ongoing task that, if planned
    and set intelligently, can be a minor responsibility.


    # 5.7.4 User Home Directories and Other Disk Space


    Management of disk space can involve considerable effort. Users have a seemingly
    unlimited appetite for disk space, and they always seem to have an urgent case
    for needing more, no matter how many gigabytes you have at your disposal. By having
    an idea of your users'' needs and requirements, you are a step closer to successfully
    managing the disk resources at your disposal.


    The first area to focus on is your users'' home directories. The file systems
    containing home directories are often the most active, and are where you will
    spend the most time and energy fighting disk space shortages. Small systems, or
    systems with small user communities, usually have only one file system for users''
    home directories. Some common names for the users'' file system are /home, /users,
    and /. The important thing to note about these common names is that they should
    be separate file systems, and not subdirectories of either the root file system
    (/) or /usr. The Tru64 UNIX account creation tools default to a home directory
    for new accounts of /usr/users/$HOME, either as a separate file system mounted
    on /usr, or worse, actually as a subdirectory of the /usr/ file system. There
    is nothing terribly wrong with mounting a separate file system on the /usr/users
    mount point, but it can be confusing to some users due to the similarity of "usr"
    and "users". Even worse is putting your users'' home directories in the /usr file
    system. The first time your system grinds to a halt because an active user has'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'filled up the /usr file system, you will quickly understand that the best strategy
    is to isolate the users on their own file systems to prevent this kind of impact
    on your system.


    This leads to the idea of segregating your users onto different file systems in
    order to isolate an active user group from a less active group of users. For example,
    if you have a team of developers actively compiling, linking, and debugging on
    a large development effort, and another group of users who simply run a canned
    accounting package, it would make sense to place the developers'' home directories
    on one large file system, and the accounting staff on a separate file system sized
    appropriately for their needs. If one or two busy developers fill up their home
    file system, neither the accounting staff nor the rest of the system will be impacted.


    A tip to help manage multiple user file systems is to create a directory, such
    as /, which contains symbolic links to the users'' true home directories, which
    could reside on different file systems. This allows you to specify your user''s
    home directory as /u/<user name>. Specify this symbolic link in the home directory
    field of /etc/passwd file, and you will be able to relocate user home directories
    by simply changing the link after physically moving the directory. By educating
    your users to use either the symbolic link or $HOME environment variable in their
    scripts and aliases, you will have the flexibility to reorganize your file systems
    when needed, with little or no impact on your users.


    # 5.7.4.1 Disk Quotas


    Another mechanism for managing user disk space is disk quotas. The Tru6 UNIX file
    systems, UFS and AdvFS, allow you to set quotas on a per-user and per-group basis
    to limit the amount of disk space that a specific user or group can use on a particular
    file system. Quotas can limit both the amount of disk space and the total number
    of files that a user or group can consume. By setting quotas, you can ensure that
    each user or group uses no more space than is reasonable, and prevent them from
    impacting others by filling up an entire file system.


    Disk quotas can have both “hard” and “soft” limits. A hard limit is an absolute
    limit; when it is reached, no more disk space can be consumed. A soft limit is
    a lower limit that a user is allowed to exceed for a specified time known as the
    grace period. During the grace period, the user receives warnings, but may still
    allocate space, up to the hard limit. If the grace period expires before the user
    frees enough space to get below the soft limit, the effect is the same as reaching
    the hard limit: no more disk space can be consumed.'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'The details of configuring and managing quotas vary slightly depending on the
    type of file system (UFS or AdvFS) and the operating system version. For more
    information, the Tru64 UNIX System Administration Manual and the quota(1) reference
    page are good starting points.


    # Managing the User Account Environment


    Configuring user accounts with appropriate environments is an important task for
    system administrators. Accounts should have certain environment variables set
    with default values, and there may be site-specific commands or programs that
    every user should run during the login process. Experienced users will tailor
    their personal login files and reset environment variables to suit their preferences,
    but you, as the system administrator, can ensure that every user starts out with
    the minimum necessary environment.


    There are two primary ways to ensure that your user accounts are properly “provisioned”
    before a user logs on for the first time:


    +   - A skeleton account

    - Global default shell login files


    # 5.8.1 Skeleton Account Setup


    A skeleton account is simply a directory that serves as a template for new home
    directories. In Tru64 UNIX, the default skeleton directory is /usr/skel, which
    contains files named .profile, .shrc, and .login, plus a bin subdirectory. During
    account creation, the contents of the skeleton directory are copied to the new
    account''s home directory. If you construct a default .profile or .shrc/.login
    pair containing site-specific environment variables and aliases, they will be
    placed in every new user account''s home directory.


    In addition to the typical shell initialization or “dot” files, as .profile and
    .shrc, the skeleton directory is also the place for any type of user default or
    configuration files, such as the vi editor initialization file (.xrc), e-mail
    auto-forwarding file (.forward), or .hlogin file to suppress the message of the
    day. Any file or directory that you normally have to copy to newly created home
    directories is a good candidate for the skeleton directory.


    If you are using the Account Manager to create user accounts, you can have several
    different skeleton directories for different types of users. Account Manager makes
    it easy to select which skeleton directory to use when creating a new user account.
    Click on the Options… button at the bottom of the'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'Add/Modify User window to open a dialogue box where you can specify, or even
    browse for, the desired skeleton directory.


    As your users'' needs evolve and your experience and knowledge increases, you
    will probably add or modify the files in your skeleton subdirectory. Changes to
    your skeleton directory will, of course, take effect for new user accounts, but
    will not automatically be applied to existing user accounts. If you wish to update
    your existing accounts to reflect any skeleton directory changes, you will have
    to manually perform the updates yourself. At first glance, this is a straightforward
    task, especially when you have a small user community. However, as both the size
    and proficiency of your users increases, you may run into resistance trying to
    standardize the user account environment. For this reason, it''s best to keep
    the skeleton initialization files (.bashrc, .login) stored in your skeleton directory
    reasonably generic, and use the global default shell login files for most of your
    user environment standardization.


    # 5.8.2 Global Default Shell Login Files


    As part of the login sequence, all shells read a global default initialization
    file containing environment variables and commands before they run the user''s
    local shell initialization file, which is usually located in the user''s home
    directory. For example, the Bourne shell (/bin/sh) and the Korn shell (/bin/ksh)
    read /etc/profile initialization file before running the user''s $HOME/.profile.
    In the case of the C shell (/bin/csh), the /etc/csh.login initialization file
    is read at login before running the user''s $HOME/.cshrc and $HOME/.login files.
    This shell behavior means that you, the system administrator, can force your users
    to have certain desired environment variables and aliases. Of course, you can
    override the definition of a variable or alias via their local initialization
    file, but the purpose of defining global defaults is to provide a default environment
    for the majority of users who never concern themselves with customizing their
    personal environments.


    By placing the desired default configuration into a global file that only root
    can change, you avoid having to edit each user''s local shell initialization files
    when you need to add a new environment variable or change an alias. Since these
    global default shell login files are read by several different shells (e.g., sh,
    ksh, and bash), ensure that any commands you add are generic enough for all the
    shells that may execute those commands. For example, to set an environment variable
    in /etc/profile, use the following:'
  merge: -1
