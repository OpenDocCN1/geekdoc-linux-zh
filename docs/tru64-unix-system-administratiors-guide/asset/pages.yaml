    # 4.2.3 SysMan Station


    SysMan Station (Figure 4.9) is a monitoring and management interface. The SysMan
    Station can be started on the command line by typing “usr/sbin/sysman-station”
    or /usr/sbin/sms, or from the CDE Front Panel, by clicking on the SysMan Station
    icon (Figure 4.7).


    SysMan Station provides a monitoring facility where you can visually see the status
    of file systems, storage devices, and the network. In a TruCluster Server environment
    SysMan Station also monitors the cluster as well as any application resources
    registered with the CAA subsystem. Figure 4.8 shows the possible status icons
    for SysMan Station.


    You can launch SysMan Menu and/or SysMan Services from SysMan Station as well.
    One of the coolest features of SysMan Station, though, is its ability to show
    you, graphically, the physical hierarchy (Figure 4.10) of the hardware on your
