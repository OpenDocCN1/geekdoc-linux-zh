  md: '# 8.5 Providing Remote Print Services


    In this example, there is a single printer with a print queue name of “laser.”
    In addition, there may be some configuration necessary on the remote print server
    host to allow remote clients to its print queue. These configurations are detailed
    in Section 8.5.3.


    When adding a remote printer, specify a printer type of “remote” in the Printer
    Configuration application. The remote printer type is special in that it assumes
    that the true printer type is managed by the remote print server. When configuring
    a remote printer, you are prompted for two additional pieces of information: the
    remote system name and the remote system printer name. This information is specified
    in the /etc/printcap file by the “rm” and “rp” options, respectively. For example:


    ```

    rm=jupiter.company.com

    rp=laser

    ```


    Given a printer with these /etc/printcap entries, print jobs submitted to this
    printer will be sent to the print queue “laser” on the remote system jupiter.company.com.


    # 8.5 Providing Remote Print Services


    Once one or more local printers are added to a Tru64 UNIX system, the system can
    be configured to support remote print services. Rather than installing printers
    on many systems, frequently a single system is selected to act as a print server.
    This print server system can then be configured with sufficient print spool space
    to support many systems’ activity. There are three requirements in order for a
    Tru64 UNIX system to act as a print server:


    +   - The print server and the print clients must be reachable via the network.

    - The print server and the print clients must each be able to resolve the host
    name of the other.

    - Authorized print clients’ host names must appear in the print server’s /etc/hosts.lpd
    or /etc/hosts.equiv file.


    # 8.5.1 Network Access


    The first requirement is fairly obvious. The remote print client systems must
    be able to reach the print server system across the network. The simplest way
    to validate this requirement is to telnet from the client to the print server.'
