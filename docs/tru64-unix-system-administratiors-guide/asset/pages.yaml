- img_proc: true
  md: '# Figure 5.3 Account Manager general options.


    ![](img/3eed431236346b7d400c9572311a8aa8_190_0.png)


    The “Use Hashed Password Database” box should be checked for any system with more
    than a handful of users. The hashed password database allows faster lookups of
    account information; without the hashed database, the system must perform a sequential
    search of the password file. This can cause a serious performance degradation
    on systems with large password files.


    If you find yourself changing the Account Manager defaults (such as default shell,
    primary group, or home directory) each time you create an account, it is easy
    to permanently change the defaults that Account Manager uses. To do so, select
    the Save Options choose from the Options drop-down menu in the initial Account
    Manager window. This saves a configuration file with the unusually straightforward
    name of Account_defaults ($HOME/sysman) in a subdirectory. Simply edit this file
    and change the defaults you wish to modify, and restart Account Manager to cause
    the new defaults to take effect.


    For example, this Account_defaults file specifies the default base directory (base_dir)
    for new users as /usr/users:'
