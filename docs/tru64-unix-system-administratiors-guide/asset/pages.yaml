  md: '# 4.6 License Management


    | Table 4.21 | License PAK Fields Explained |


    Issuer: The Issuer is the vendor licensing the software product. For Compaq Computer
    Corporation (formerly Digital Equipment Corporation) products, this is typically
    the string "DEC".


    Authorization Number: The Authorization Number is a unique string that the PAK
    issuer assigns to a specific PAK. The combination of the Issuer and the Authorization
    Number uniquely identifies a PAK.


    Product Name: The name used by the LMF to distinguish among different software
    products.


    Producer: The name of the company that produced the licensed software. This is
    typically DEC..


    Number of Units: The Number of Units indicates how many license units are supplied
    by the PAK. If this field is zero (0), the PAK provides unlimited use of the product
    on any type of hardware.


    Version: The Version is used if the PAK applies only to certain versions of the
    software product. If a version is specified, the PAK will work with that version
    and earlier of the software. If this field is on the PAK, the PAK is not restricted
    to a specific version of the software.


    Product Release Date: The Product Release Date is used if the PAK is restricted
    to only versions of the software product released before the specified date. If
    this field on the PAK is empty, the PAK is not restricted to a specific release
    date of the software.


    Key Termination Date: The Key Termination Date is the date when the PAK expires.
    Once this date passes, LMF no longer allows users to use the software product.
    If this field on the PAK is empty, the PAK will function indefinitely.


    Availability Table Code: The Availability Table Code represents the number of
    units required to give unlimited use of a product on a particular hardware system
    model.


    A letter represents a value from the License Unit Requirement Table (LURT) that
    specifies the number of units necessary for the product to run on a hardware model.
    The LUR is internal to LMF and cannot be displayed or modified.


    If the field specifies "CONSTANT=integer", the integer value indicates the number
    of units necessary to run the software product, regardless of the hardware model
    in


    Activity Table Code: The Activity Table Code represents the number of units required
    for each concurrent user of the product. This field may either be a single letter
    or the string "CONSTANT=integer".


    A letter represents a value from the License Unit Requirement Table (LURT) that
