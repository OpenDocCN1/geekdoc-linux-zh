  md: '# 6.2 Physical Security


    the belief UNIX is an inherently insecure operating system. UNIX can be configured
    to be completely insecure, of course, but so can any other computer system. Conversely,
    most modern implementations of UNIX, including Tru64 UNIX, provide facilities
    and tools to secure the system as tightly as necessary.


    The issue of physical security should be covered before moving on operating system.
    The reason for this is that, given physical access to a Tru64 UNIX system, it
    is possible to circumvent operating system security measures such as passwords
    and permissions. The physical security of a Tru64 UNIX system simply means restricting
    physical access to the system itself, usually by placing the computer in a secure,
    locked room or area. This is especially important for mission-critical systems
    containing important data and programs. The console or console port of a system
    should also be secured. This, of course, precludes connecting a modem to the console
    port and allowing unrestricted dial-in access to the console. A secure computer
    room or data center with secure power feeds and climate controls is ideal, a locked
    office or closet is usually adequate.


    The two vulnerabilities of a physically insecure Tru64 UNIX system are:


    +   - The ability to turn the system off, preventing use

    - The ability to “break in” to the system as the root user


    # 6.2.1 Unauthorized Power Removal


    The first vulnerability is a denial-of-service type of attack. If someone turns
    the system off, either accidentally or intentionally, the system obviously becomes
    unavailable for use. Some Tru64 UNIX systems also have buttons on the front panel
    that cause the operating system to halt, leaving the system at the console prompt.
    The Ctrl-P key sequence on some Tru64 UNIX systems consoles will also halt the
    system. Halting the system is as bad as removing power, for the system is no longer
    running Tru64 UNIX.


    # 6.2.2 Unauthenticated Root Access


    The second vulnerability of a physically insecure Tru64 UNIX system is the potential
    ability to halt and reboot the system in single-user mode. In the default security
    configuration, single-user mode provides a root login in the system console without
    prompting for a password. At this point, the system is'
  merge: -1
