  md: '# 4.1.1 Quick Setup


    Quick Setup is an option to step you through setting up the most common components.
    The Quick Setup option configures the following components:


    +   * Step 1: Registering the base operating system license

    * Step 2: Setting the system’s primary network interface card (NIC)

    * Step 3: Set up a static router.

    * Step 4: Set up the Domain Name Service (DNS/BIND).

    * Step 5: Set up a Network Time Provider (NTP).

    * Step 6: Set up the Network Information Service (NIS).

    * Step 7: Set up the Network File System (NFS).

    * Step 8: Set up a mail server.

    * Step 9: Set up a default printer and server.


    Some of the steps in the setup path can be skipped if you do not want or need
    to set a particular component.


    In the first step, you register that license PAK that we mentioned in the previous
    section. The quick setup program will prompt you to enter some of the information
    listed on the paper PAK. Steps 2–8 will require you to know your site’s network
    configuration. If you have a Network Administrator, now would be a good time to
    walk down the hall and have a conversation. If your boss informs you that you
    are going to be the Network Administrator, then you might want to turn to Chapter
    7, “Networking,” and then curl up in a comfortable chair with the Tru64 UNIX Network
    Administration guide. If you do not have a hard copy of the guide you can download
    it from the following-

    Web location:


    ```

    http://www.tru64unix.comq.com/docs/pub_page/doc_list.html

    ```


    Select the operating system version that you have installed, and then select the
