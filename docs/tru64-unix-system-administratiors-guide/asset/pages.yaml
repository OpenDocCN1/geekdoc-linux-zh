    configuration file and build a new kernel. The configuration file is located in
    /usr/sys/conf and is the name of your unqualified hostname in uppercase. The configuration
    file is in ASCII and therefore can be modified using your favorite text editor.
    Once the configuration file has been edited, build the kernel using the doconfig
    command. Once the kernel has been built, copy the old kernel as a precaution in
    case the new kernel does not boot, copy the new kernel to the root (/) directory,
    and optionally delete the kernel in the build directory.


