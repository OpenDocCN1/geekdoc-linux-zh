  md: "# 10.6 Resolving Performance Bottlenecks\n\nPerformance bottlenecks, once identified,\
    \ are nearly always due to a lack of one or more of the four performance resources\
    \ (CPU, memory, I/O, or network). A system administrator has three strategies\
    \ for compensating for such resource bottlenecks:\n\n+   - Increase the capacity\
