  md: '# Preface


    This book, Tru64™ UNIX System Administrator''s Guide, is the second edition of
    the popular book addressing Compaq Computer Corporation''s powerful 64-bit UNIX
    operating system from the viewpoint of a system administrator. Originally released
    in 1992, Tru64 UNIX system runs on high-performance Alpha microprocessor systems,
    has matured into the operating system for a wide variety of applications, ranging
    from Internet search engines to popular e-commerce sites used for mapping the
    human genome. Behind the scenes of these applications is the system administrator
    responsible for the care and feeding of these complex systems. With this book,
    it is our hope to meet the needs of the beginning Tru64 UNIX administrator, while
    providing useful tips and information to the experienced administrator. If you
    are responsible for the management of Tru64 UNIX systems, either directly as a
    system administrator or indirectly as a manager or team leader, this book may
    be for you.


    Matt Cheek was the sole author of the first edition. This revision is the work
    of five co-authors, and we shared the work of writing as: Matt had primary responsibility
    for Chapter 1 and Appendix B; Scott for Chapter 4; Steve for Chapters 3, 7, 10,
    and 11; Martin for Chapters 5, 6, and 9; and Greg for Chapters 2, 8, and 12 as
    well as Appendix A. We tried to give a consistent presentation of information,
    but each of us from a different background and naturally brings a slightly different
    perspective to our writing. However, we hope that this has allowed us to take
    the best approach to each topic.


    This volume is not intended as a replacement for the Tru64 UNIX product documentation;
    instead, it is offered as a complementary resource that addresses a broad range
    of system administration topics in what is hoped to be a more approachable style.
    In addition, we have tried to share useful, real'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'world system administration philosophies and techniques that the Compaq documentation
    cannot. As to our success, we respectfully leave that judgment to the reader.


    In February of 1999, Compaq Computer Corporation, having acquired Digital Equipment
    Corporation in 1998, changed the name of Digital UNIX to Tru64 UNIX. The name
    change certainly reflected how Compaq was phasing out the Digital brand name,
    but also emphasizes that this version of UNIX is a "true" 64-bit operating system,
    one that fully leverages the capabilities of Compaq''s 64-bit Alpha microprocessor.


    The first edition of this book was based upon version 4.0 of what was at that
    time known as Digital UNIX. Later, the name officially became "Tru64 UNIX V. 4.0."
    Digital UNIX V. 4.0 and Tru64 UNIX V. 4.0 are, indeed, the same product.


    This book is upon Tru64 UNIX version 5.1, which as of this writing is the currently
    released version of Compaq''s UNIX product. The 5.1A version was only a month
    or two from shipping at press time, and all effort have been made to make the
    content applicable to that version as well.'
  merge: -1
