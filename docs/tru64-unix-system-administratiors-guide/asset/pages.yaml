    the DISPLAY environment variable. If it is defined, the X Window System user interface
    starts up. If it is not defined, the character cell user interface starts up (as
    if you had used printconfig--ui menu). Since the lprsetup utility will be retired
    in a future release of Tru64 UNIX, Compaq recommends using printconfig to manage
    printers. Doing so will avoid any dependencies on the lprsetup utility.


    To see an example of the character-based command, see Section 8.6.5. The lprsetup
    and printconfig character cell utilities are identical in behavior.'
