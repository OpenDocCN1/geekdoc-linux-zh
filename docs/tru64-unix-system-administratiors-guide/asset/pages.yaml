    # 8.6.1 Lpr and lp


    The lpr and lp commands are the BSD UNIX and System V UNIX commands, respectively,
    used to submit print jobs to the Tru64 UNIX print system. The two commands do
    the same thing, but have different syntax. Deciding which flavor command to use
    is purely a personal preference. Both lpr and lp can be invoked with just a single
    argument specifying the file to be printed. For example, each of these commands
    will print the file “program.c” on the system default printer:


    ```

    # lpr progra.c

    # lp program.c

    ```


    The most common additional argument to these commands specifies the printer to
    use. For the lpr command, the flag to use is “-P” for Printer; for the lp command,
    use the flag “-d” for Destination:


    ```

    # lpr -P draft program.c

    # lp -d draft program.c

    ```


    # 8.6.2 Ipq and lpstat


    The lpq and lpstat commands are used to display the status of print queues. Issuing
    either of these commands with no arguments displays the status of the system default
    printer queue. For instance, the following example shows that there are three
    entries in the default printer queue, and one of them (job #91) is actively printing:


    ```

    # lpq

    Sat Feb 17 16:59:20 2001; Attempting to print dfA091saturn

    Rank Pri Owner Job Files Total Size

    active 0 root 91 /etc/hosts 1107 bytes

    1st 0 aey 93 /home/aey/main.c 21987 bytes

    2nd 0 cjy 94 /home/cyj/memo 2151 bytes

    ```'
