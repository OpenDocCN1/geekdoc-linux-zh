    the file specified as the “msgbuf.err” destination in the syslog.conf file. When
    syslog starts, it looks for this file and, if it exists, processes any messages
    contained within and deletes the file. The default syslog.conf entry to provide
    this functionality is:


    ```

    msgbuf.err    /var/adm/crash/msgbuf.savecore

    ```


    The second half of a syslog.conf entry specifies the destination where syslog
    will log the messages that match the “facility.severity” criteria defined by the
    first half of the syslog.conf entry. There are four possible destinations for
    messages:


    +   A file name that begins with a leading slash (/)—The syslog daemon will append
    messages to this file. Note that this can be an ordinary file or a device special
    such as /dev/console, which will cause all messages to appear on the system console.


    +   A host name preceded by an “at” sign (@)—Appropriate messages are forwarded
    to the syslog daemon on the named host (if the named host’s /etc/syslog.auth permits
    it). The named host must have a record in its /etc/syslog.auth file if it is to
    receive these messages.


    +   A comma-separated list of users—Appropriate messages are written to those
    users if they are logged in.


    Tru64 UNIX has the ability to create daily syslog log files. If you specify a
    path such as /var/adm/syslog.dated/mail.log for the “destination,” a new directory
    and associated log files will be created each day of the form /var/adm/syslog.dated/file
    where “date” is the day, month, and time; and “file” is the log file, such as
    mail.log. For example:


    ```

    mail.debug    /var/adm/syslog.dated/mail.log

    ```


    This is a nice feature because it produces a day-by-day count of the messages
    received. For example, an entry as the mail.debug entry above will cause syslog
    to log debug messages in the following file if the syslog was to be started or
    restarted on June 2nd at 6:54 P.M:


    ```

    /var/adm/syslog.dated/02-Jun-18:54/kern.log

    ```


    Furthermore there is a symbolic link, “current” in the /var/adm/syslog-dated directory
