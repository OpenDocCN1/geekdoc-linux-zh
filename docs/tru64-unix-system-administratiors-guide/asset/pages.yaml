    # 6.6.5  Security Logging


    One unique feature of Tru64 UNIX is a consolidated security authentication mechanism
    called the Security Integration Architecture (SIA). This SIA layer isolates the
    security-related commands such as login, su, and passwd from the specific security
    mechanisms, which include, in addition to Base and Enhanced, optional products
    such as the Distributed Computing Environment (DCE). You do not need to be concerned
    with this SIA layer unless you wish to take advantage of the centralized logging
    that it provides via the slog file. This log will record all security events,
    including the success and failure results of logins, password changes, and su(1)
    commands. To enable the create the file for


    ```

    # touch /var/adm/slog

    ```


    and the SIA will start writing to this log. The recommended permissions for the
    slog are 600. As a general rule, you should prevent non-privileged users from
    viewing the contents of security logs as the slog. An excerpt from the slog shows
    the types of events recorded:


    > SIA:ERROR Wed Feb 14 15:12:13 2001

    Failure on authentication for su from martin to root

    SIA:EVENT Wed Feb 14 15:12:17 2001

    Successful authentication for su from martin to root

    SIA:EVENT Wed Feb 14 15:12:17 2001

    Successful launching of session


    Because this log will continue to grow without bounds, it must be manually truncated
    periodically. To stop logging of SIA events, remove the slog file. Since the SIA
    is part of the Tru64 UNIX operating system, the slog can be used whether the security
    level is Base or Enhanced.


    # 6.6.6  Application Issues


    As the system administrator, you will usually be responsible for installation
    and configuration of Commercial Off The Shelf (COTS) software. Prior to enabling
    Enhanced security, you must ensure that any applications currently installed are
    compatible with Enhanced security. If an application that relied on the system
    for user authentication, such as a database or security tool, were'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'not aware of Enhanced security, user authentication into the application would
    most likely fail. In the event that the application vendor does not know if enabling
    Enhanced security will affect its product, proceed slowly with implementing Enhanced
    security, and test the application as much as possible prior to going into production.


    An additional responsibility you may have is to support software development efforts,
    both in-house and commercial applications. Coordinate the implementation of Enhanced
    security with any software developers you support your system(s). The Compaq Tru64
    UNIX Security manual includes a "Programmer''s Guide to Security" section that
    details programming techniques and provides coding examples that would be invaluable
    to your development staff.


    As you can see, successfully implementing Enhanced security requires a thorough
    knowledge of your environment and requirements, careful planning, and a significant
    amount of administrative responsibility, both in account management and general
    system maintenance. However, the benefits of Enhanced security, such as comprehensive
    auditing of security events and more robust identification and authentication
    features, far outweigh the possible disadvantages of the Enhanced security level.


    # 6.7 Auditing


    Tru64 UNIX provides the ability to audit all events that occur on the system.
    Every activity that occurs on the system can generate an "audit record" that describes
    what the activity was, when it occurred, who caused it, and other information.
    As system administrator, you decide which activities will generate audit records.
    This is a powerful tool to monitor activity on your system. Auditing can help
    you to:


    +   * Detect security violations, such as system break-ins or break-in attempts.

    * Assess the damage and restore system integrity if a break-in does occur.

    * Discourage attempts to violate security (for fear of being detected).

    * Evaluate and debug application software.

    * Troubleshoot, in some cases, system or application performance problems.


    Auditing may be used in both Base security and Enhanced security mode. You can
    audit individual system calls and trusted events (logins, logouts, and'
