  md: '# 6.8 Access Control Lists


    +   - A permission specification, similar to the permission bits displayed by
    ls(1)


    A user entry without a name or UID defines the access permissions of the user
    who owns the file. This is always identical to the user permission bits displayed
    by “ls -l”. Every ACL must contain (and only one) such entry. Similarly, a user
    entry containing a name or UID defines the access permissions of the specified
    user; an ACL may contain zero or more such entries.


    Group entries are similar to user entries. There must be exactly one group entry
    without a name or ID field; this defines the access permissions for members of
    the group that owns the file, and is identical to the group permission bits displayed
    by “ls -l”. An ACL may contain zero or more group entries that contain a group
    name or GID. These entries define the access permissions for members of those
    groups.


    Finally, each ACL must contain exactly one “other” entry, which always has a null
    second field. This entry defines the permissions for all users not included in
    any of the other entries in the ACL. It is identical to the “other” permission
    bits displayed by “ls -l”.


    A typical ACL looks like this:


    ```

    # file: test

    # owner: martin

    # group: system

    #\ouser::rw-

    user:steve:rw-

    user:joe::-

    group::r-

    group:staff:r-

    other::

    ```


    In this example, the file owner (martin) has read and write access; user steve
    also has read access, and user joe has no access to the file. The owning group
    (system) has read access only, the “staff” group also has read access, and all
    other users have no access to the file. The output of “ls -l” for this file would
    show the permission bits as “-rw-r-----”. This is reflected in the “user::”, “group::”,
    and “other::” entries.


    What happens if a user is defined in more than one access entry? In the above
    example, suppose that user joe is in the staff group. The staff group has read
    access, but the entry for user joe denies all access. In such a case, user entry
    takes precedence over a group entry, so user joe would be denied all'
