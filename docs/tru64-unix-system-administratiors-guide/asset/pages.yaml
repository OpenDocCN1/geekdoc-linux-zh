  md: '# Event Management (EVM)


    Figure 12.3

    Compag Analyze view of the binary.erlog.


    ![](img/3eed431236346b7d400c9572311a8aa8_448_0.png)


    +   - Event channel—facility used to post or retrieve event information

    - Event poster—component that posts an event to the EVM daemon

    - Event subscriber—an entity interested in particular indications


    The EVM works is that something interesting happens (an event), a component creates
    an EVM event package that describes what happened, the component posts the event
    to the EVM daemon, the daemon receives the event and enhances it based on its
    template event database, the daemon then sends the event, to any subscribing clients
    that have registered an interest in this type of event and the subscribing client
    receives the event and may-perform some action because of it. Additionally the
    system administrator may use the evmget(1) command to look at the event.'
