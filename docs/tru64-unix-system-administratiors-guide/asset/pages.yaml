    the Print Configuration application will also automatically create spool directories
    and/or error log files in addition to updating the /etc/printcap file. However,
    manually adding or updating entries in /etc/printcap is perfectly acceptable and
    can be quicker once you are familiar with the format of the file. Since /etc/printcap
    is a plaintext file, it can be edited using vi or any other editor.'
