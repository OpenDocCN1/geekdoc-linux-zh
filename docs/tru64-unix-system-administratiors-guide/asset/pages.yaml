    One helpful strategy for selecting which optional subsets should not be installed.
    Once you have decided which subsets should not be install to select the remaining
    subsets for installation. Keep in mind that the selection or rejection of any
    particular subset is not permanent. If you determine after the system has been
    installed that some subsets were not installed are required, simply install them
    from the installation media using the setId command. If it becomes apparent that
    some subsets were initially installed are not necessary, removing them is equally
    simple. Compaq''s recommendation, if you are unsure whether to install a particular
    subset, is to select it for installation. Most Tru64 UNIX subsets function satisfactorily
    well together, and selecting all optional subsets will result in a functioning,
    though perhaps not optimally configured, system.


    Some optional subsets are fairly easy to rule out based on the hardware configuration
    of your system. For example, there are X Windows system subsets for specific supported
    graphics cards. It is necessary to load only the subset for the graphics card
