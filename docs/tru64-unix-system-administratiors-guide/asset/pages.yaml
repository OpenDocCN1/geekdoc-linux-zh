    # 9.5 Process Parent/Child Relationships


    Every process on a UNIX system is created by another process calling the fork()
    term, and is then a child process of the creating process. A child process inherits
    the privileges of its parent in addition to the parent’s priority, state, environment,
    and all other parameters stored in the “proc” structure of the parent process.
    In fact, except for the PID and PPID, a child process is initially a clone of
    its parent until it changes, or a privileged user modifies the process parameters.


    The parent/child relationship is important to keep in mind when managing processes,
    especially if an instance begins forking processes uncontrollably, you must find
    and kill the runaway parent process to fix them. Killing processes in this case
    would only address the symptom, not the true cause of.'
