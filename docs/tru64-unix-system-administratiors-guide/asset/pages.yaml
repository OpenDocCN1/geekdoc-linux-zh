    SIGUSR1, do not terminate processes. By default, unless a particular signal is
    specified, kill sends the SIGTERM signal (signal number 15), which politely asks
    the process to terminate.


    Other common signals are SIGHUP (signal number 1), SIGKILL (signal number 9),
    and SIGSTOP (signal number 17). A SIGHUP tells the process to hang up, and the
    signal is sent to all processes assigned to a terminal when a user logs out. SIGKILL
    is the familiar signal for killing a process; it should be used as a last resort
    for ending a process, since it will terminate the process immediately without
    giving it chance to perform any "cleanup" actions. SIGSTOP is a signal that tells
    a process to temporarily stop execution; it is commonly sent to a process in response
    to the shell "stop" character, usually Control-Z. The SIGKILL and SIGSTOP signals
    are unique in that they cannot be caught or ignored by the received process. This
    ensures that there exists a method for stopping or killing unruly or runaway processes.


    Signals may be specified on the kill command line either by signal number or by
    signal name (minus the "SIG" prefix). When specifying the signal name, case is
    ignored. For example, the following three commands are equivalent:


    ```

    # kill -9 4321

    # kill -KILL 4321

    # kill -kill 4321

    ```


    In addition, multiple processes may be signaled by specifying their PIDs:


    ```

    # kill -HUP 4456 4458

    ```


    The hang-up (HUP) signal is a commonly used signal for the system administrator.
    Several system daemons, such as inetd(8), syslogd(8), and bootpd(8), will reread
    their configuration files upon receiving a HUP signal. This allows you to modify
    a daemon''s configuration file and cause the change'
