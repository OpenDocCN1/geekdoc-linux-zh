- img_proc: true
  md: 'removes any existing disk label from dsk1. This is necessary, as the dd command
    will not proceed if the target disk has a disk label. Note that both the input
    file (if) and the output file (of) are specified as the raw or character device.
    Finally, the two conversion options (noerr and sync) are specified to ensure that
    dd stays synchronized in the event that neither disk has bad sectors. Upon completion
    of this dd command, the contents of dsk0 and dsk1 will be identical. This type
    of disk-to-disk copy operation can take a tremendous amount of time (hours or
    days) to complete, depending on the size of the disks and the type of I/O channels.


    Another situation where the dd command is useful is as a method for copying a
    data stream off tape. You have already seen the dd command used in the following
    workaround:


    ```

    vdump -0 -u -b 64 -f - / rsh remotesystem dd of=/dev/tape/0 bs=64

    ```


    The vdump writes the save-to standard output, which is piped to a dd process on
    a remote system via the rsh command. This command reads from the standard input
    (since an "if" parameter is not specified to dd) and writes the data directly
    to the raw tape drive. In this example, the dd command is a simple method used
    to redirect the output to the tape drive properly.


    # 11.2.3 cpio(1)


    The cpio(1) utility is a tool for copying files to and from cpio archives. The
    cpio utility, which stands for Copy Input Output, can write either directly to
    tape or other magnetic media, or can create a single archive file on disk. As
    a general purpose backup tool, cpio is of limited use for primary reasons: cpio
    does not support backing up special files, such as device files located in the
    /dev directory, and cpio cannot back up files with filenames that exceed 128 bytes.
    However, some sites continue to use cpio despite its limitations; therefore, a
    system administrator may occasionally be called upon to restore a cpio archive.
    This often occurs when a software package is delivered in a cpio archive, which
    is sometimes seen as a "least common denominator" format. The cpio utility is
    a "legacy" UNIX command compared to relative newer utilities as vdump. In addition,
    cpio along with tar, is a standard UNIX file format that can be read from any
    vendor''s UNIX. For this reason, an understanding of cpio''s somewhat arcane syntax
    can be quite useful in certain situations.'
