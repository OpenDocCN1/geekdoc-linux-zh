    # 4.6.2.5 Registering Licenses


    One of the first tasks after installing the Tru64 UNIX operating system is to
    register the operating system PAKs (OSF-USR and possibly OSF-BASE). Registering
    a PAK is the process of copying the PAK data into the LMF for use by the product
    licensed by the PAK. Since the fields containing license data varies from PAK
    to PAK, the registration process prompts for all possible fields. When registering
    a PAK, enter data into a field only when the corresponding field on the PAK has
    data. Simply hit <Return> to skip unnecessary fields. Also, entry of data from
    a PAK is case-insensitive. Usually the characters on a PAK are all uppercase;
    however, it is not necessary to enter the characters in uppercase—lowercase or
    mixed case.


    The simplest way to register a PAK is to use the lmfsetup(8) command. This command
    is actually a shell script that prompts the user for each PAK field, then registers
    the PAK after all the fields have been entered. The following is an example lmfsetup
    session:'
