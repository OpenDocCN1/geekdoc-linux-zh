    # 8.3.3.4 Connection Type


    The connection type refers to how the printer will be connected to the system.
    There are three valid connection types: dev, LAT, and tcp. Local printers will
    be connected to the system either through a serial port or a parallel port, and
    since these physical ports are accessed by Tru64 UNIX through device special files
    in the /dev directory, a local printer’s connection type is “dev”. A networked
    printer’s connection type is “tcp”. Finally, for printers accessed via the Local
    Area Transport (LAT), the connection type is “LAT”. The connection itself is important
    only in indicating where further information is needed. For instance, when configuring
    a printer whose connection type is “dev,” you will need to know the device special
    file name for the particular port.


