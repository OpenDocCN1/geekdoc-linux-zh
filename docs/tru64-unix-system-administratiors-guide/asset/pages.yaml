    # 6.5.2 The /etc/hosts.equiv File


    The second configuration file that defines trusted relationships with remote systems
    is /etc/hosts.equiv. This file is similar to an individual user''s .rhosts file,
    except /etc/hosts.equiv specifies trusted relationships for the entire system.
    In addition, the /etc/hosts.equiv file is checked before the local .rhosts file,
    and if a match is found in the hosts.equiv file, the validation ends. The syntax
    of the hosts.equiv file is identical to the .rhosts file, with one notable addition.
    By specifying the keyword "NO_PLUS" in /etc/hosts.equiv, the use of the plus character
    (+) to match any host or user is disallowed on a system-wide basis. Because of
    the security implications of users specifying a plus sign in local .rhosts files,
    the NO_PLUS entry should be added to the /etc/hosts.equiv file to close the vulnerability
    made possible by the plus sign.


    In addition, when an r-command is run against a remote system, the local root
    account''s .rhosts file, if it exists, is checked for permission. The /etc/hosts.equiv
    file does not apply when validating remote access to the root account.


    Similar to the .rhosts file, the contents of the /etc/hosts.equiv file are critical
    for ensuring system security. An incorrectly placed plus sign could open up a
    system to unauthorized access. Carefully manage the individual entries in both
    the /etc/hosts.equiv file and any individual user''s .rhosts file.


    # 6.6 Enhanced Security


    There are two levels of security in Tru64 UNIX: Base security is the default security
    level when installing Tru64 UNIX and is distinguished by traditional UNIX passwords.
    Enhanced security provides “shadow" passwords and a rich set of password and login
    controls. Enhanced security is frequently called C2 security, which capabilities
    allow a system to be configured to the C2 security level defined by the U.S. Computer
    Security Center’s “Orange Book.\ When running'
