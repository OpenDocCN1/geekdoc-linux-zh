    # 5.3.2 The SysMan Accounts Option


    The Accounts option of the SysMan menu provides capabilities similar to the Account
    Manager. Although the Accounts option is somewhat more limited than dxaccounts,
    it has the advantage of running in either graphical or character-cell environment.
    You can invoke the Accounts option from the CDE Application Manager or with the
    following command line:


    ```

    # sysman accounts

    ```


    The Accounts Menu has the following options:


    +   - Manage local users

    - Manage local groups

    - Manage NIS users

    - Manage NIS groups


    Selecting one of these options brings up a list of users or groups, as shown in
    Figure 5.4. Selecting Add or Modify brings up a template similar to the one shown
    in Figure 5.2.


    # 5.3.3 Command Line Utilities


    Although the Account Manager is a useful interface for system management, there
    are times when a nonglobal tool is preferable. Some systems do not have graphics
    capability (either attached to the system or via the network), while other system
    administrators prefer to use command line tools whenever possible. In addition,
    command line utilities can be used in customized scripts tailored to your particular
    environment—something that graphical interfaces don’t allow.


    Tru64 UNIX provides a number of command line utilities to manage user accounts
    and groups. These are divided into two groups:


    +   - User account management utilities (useradd, userm, and userdel)

    - Group management utilities (groupadd, groupmod, and groupdel)


    The useradd, userm, and userdel utilities, as the names indicate, are used to
    add, modify, and delete user accounts. Similarly, groupadd,'
