    backup utilities, supporting multiple backup sets and schedules, e-mail notification
    of backup success and failure, indexing of backed up files allowing quick restoration,
    and flexible user interfaces for both backup and restore.


    # 11.2.3.1 tar(1)


    The tar utility is a simple tool that can be used to save multiple files and directories
    quickly and easily. The tar(1) tool, stands for Tape Archiver, can write either
    directly to tape, floppy disk, or other magnetic media, or create a single archive
    file on disk. A tar archive file, sometimes referred to as a “tar ball,” is usually
    identified by a filename with .tar suffix. The tar utility has become a de facto
    standard on the Internet for packaging and distribution of files. Understanding
    the use of tar, both for creating and unpacking archives, is a must-have skill
    for a UNIX system administrator.


    The syntax of the Tru64 UNIX tar utility may at first glance appear complex, but
    there are actually only five main command line switches that switch tar’s function
    (see Table 11.1).


    The remaining switches are modifiers that define how tar behave. See Table 11.2
    for a list of the most common modifiers.


    Typically, for instance, to copy a directory to the default tape device, the following
    minimal tar command will do the job:


    ```

    # tar -c /data

    ```


    Since a specific tape drive or archive file is not specified (the “-f” switch),
    this command copies the contents of the /data directory to /dev/tape/tape0_d0.
    If /dev/tape/tape0_d0 does not correspond to a tape drive on the system, tar will
    dutifully create a archive file named tape0_d0 in the /dev/tape directory. Since
    the /dev/tape directory is a subdirectory of the root'
