  md: 'security, the available password controls include configurable password length,
    both minimum and maximum; password usage history; and many other features. The
    login controls include per-terminal settings for delays between consecutive successful
    or failed login attempts, the ability to retire or lock accounts, and logging
    of successful logins and unsuccessful login attempts.


    Shadow passwords are encrypted passwords that are stored in a location inaccessible
    to unprivileged users. In a standard UNIX system, the encrypted passwords are
    stored in the default password file, /etc/passwd, which must be world-readable
    for certain system utilities to function properly. Although the encrypted passwords
    are one-way encrypted (it''s not possible to determine the original password by
    decrypting the encrypted password string), having them readable by any user makes
    them vulnerable to so-called "crack" attacks. Such attacks involve encrypting
    every word in the dictionary, with other plausible passwords, and comparing each
    string to a user''s encrypted password. If the encrypted strings match, the original
    password is revealed.


    Although this is somewhat of a brute-force approach, the speed of modern computers
    makes it eminently practical. One way to defend against crack attacks is to ensure
    that passwords do not include words from the dictionary or other plausible strings,
    such as variations on the user''s name, or to require that passwords include both
    letters and numbers, both upper and lower case, or similar restrictions. Enhanced
    security provides a different line of defense against crack attacks by the simple
    method of removing the encrypted passwords from /etc/passwd and placing them in
    an inaccessible location.


    Historically, Tru64 UNIX systems have typically been configured to use Base security.
    This is due, in part, to the perceived complexity of Enhanced security, particularly
    in older versions of the operating system, as well as the fact that Base security
    is the default level on a newly installed system. Running Enhanced security can
    be more complex than Base security from a system administration viewpoint, but
    Enhanced security provides so many useful capabilities that the additional effort
    is worthwhile. Managing Enhanced security has become progressively easier in successive
    versions of Tru64 UNIX. In particular, starting with version 5, it is possible
    to quickly and easily shadow passwords without having to configure any other Enhanced
    features.


