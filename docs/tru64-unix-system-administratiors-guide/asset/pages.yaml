  md: '# 10.4.2.2.1 Paging


    The paging operation consists of moving a single page or a small group of pages
    between disk and physical memory. It is conceivable (in fact common) that a process''s
    memory image would be too large to fit into available physical memory, and only
    part of the process can be resident at any one time. UNIX has the ability to execute
    a process through the mechanism of paging. If the process references a location
    in virtual memory that is not currently resident, the kernel generates a page
    fault on behalf of the process to bring the required page into physical memory.
    A page fault is a hardware interrupt that instructs the Tru64 UNIX memory manager
    to move the required page from disk to physical memory. In doing so, the memory
    manager may be required to move another page from physical memory to disk to make
    room. Some amount of paging results from normal activity on a UNIX system, and
    the amount of pages and pageouts are monitored via the vmstat(1) command. If pages
    or pageouts are constant or excessive, this could indicate a physical memory shortage.


    There are several different types of page faults. Page faults known as hard page
    faults, require a disk I/O to complete and are expensive in system resources.
    An "expensive" system operation is one that takes a long time to execute and will
    likely force the process to wait for its completion. Other types of page faults,
    known collectively as soft faults, are not expensive and can be handled by the
    system without a disk I/O. There are four types of soft page faults monitored
    by vmstat(1): fault, cow, zero, and react.


    +   - fault—An address translation fault has occurred.

    - cow—A copy on write fault (usually resulting from a fork() operation).

    - zero—A zero-filled page was requested.

    - react—A page is reactivated from the system-wide inactive page list.


    # 10.4.2.2.2 Swapping


    The process of swapping is similar to paging in that virtual memory pages are
    moved between disk and physical memory. The primary difference is that instead
    of moving a single page or small groups of pages, swapping moves all pages associated
    with a particular process between disk and memory. This operation on a process
    is known as a swapout and is initiated by the Tru64 UNIX memory manager for one
    of the following reasons:


    +   - A memory shortage so severe that the paging process cannot free memory fast
    enough'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# 10.4 System Resources


    +   - Processes have been inactive for more than 20 seconds


    Swapping is usually the result of insufficient physical memory on the system.
    Swapping is a very expensive system operation and should be avoided at all costs.
    On more recent versions of Tru64 UNIX, the occurrence of swapping has been all
    but eliminated. Paging is the preferred method for the system to reclaim memory
    due to the fact that it is a far less expensive operation than swapping.


    In extreme cases of memory shortages, a condition known as thrashing can occur.
    Thrashing occurs on a system when the requested resources exceed the available
    physical memory, and the system spends more time performing memory-related tasks
    such as paging and swapping than executing user application code. The name thrashing
    is derived from how the disks behave in this situation.


    # 10.4.2.3 Cache Memory


    Cache memory is a type of high-speed memory that typically acts as a buffer between
    a slow resource, such as disks or network, and a fast resource, such as our speedy
    Alpha processor. There are several types of caches that, though important and
    desirable, are not directly under the system administrator''s control; that is,
    the sizing of these caches is not configurable. Examples of these caches are provided
    by the CPU''s on-chip cache and disk controller hardware caches, such as those
    provided by the Compaq StoreWorks family of controllers (HSZ70, HSG80, etc). The
    two cache memories that are configurable in Tru64 UNIX are:


    +   - Traditional buffer cache (file system metadata cache)

    - Unified buffer cache (UBC)


    Each of these caches is defined as a percentage of physical memory; the percentages
    can be configured by the system administrator.


    # 10.4.2.3.1 Traditional Buffer Cache


    As users and processes access a Tru64 system''s UNIX File Systems (UFS), the file
    system metadata (directories, symbolic links, inodes, and blocks) is cached in
    the traditional buffer cache. If every disk transfer really had to occur, a UNIX
    system would spend a great deal of time waiting for the completion of I/O. However,
    the use of this traditional buffer cache, which contains recently used disk blocks,
    typically over 80% of all disk'
