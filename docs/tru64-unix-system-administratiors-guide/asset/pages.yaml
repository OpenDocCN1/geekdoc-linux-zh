- img_proc: true
  md: '# Networking


    # 7.1 Networking


    A network is a collection of computers connected by hardware and software to allow
    the sharing of data and resources. In order for the computers on a network to
    communicate, they must all speak the same language, or protocol. Today, it is
    a rare Tru64 UNIX system that is not a member of a network of some sort. Tru64
    UNIX, like all other flavors of UNIX, supports Transmission Control Protocol/Internet
    Protocol (TCP/IP) networking natively, which is the networking protocol of the
    Internet. In addition, Tru64 UNIX also supports Compaq''s DECNet, the native networking
    protocol of Compaq''s OpenV operating system, though only as an extra cost option.
    Due to the almost universal acceptance of TCP/IP, that is the only networking
    protocol that will be covered. This chapter is intended as a guide to configuring
    and managing basic TCP/IP networking on Tru64 UNIX systems. The first part of
    the chapter is an introduction to the requirements of TCP/IP networking on a Tru64
    UNIX system. This includes Internet Protocol (IP) addresses, subnets and subnet
    masks, and gateways and routing.


    We will cover the configuration process and provide examples of both the character-based
    setup sequence and the graphical SysMan utility available on Tru64 UNIX version
    5.0 and above. Following this, the different network interfaces available on a
    Tru64 UNIX system will be outlined, along with any special requirements or considerations.
    Next, some basic network troubleshooting tips will be demonstrated. Finally, several
    common network services for sharing resources across a network, such as the Domain
    Name Service (DNS) and File Transfer Protocol (FTP), will be covered.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Network Configuration


    There are several prerequisites to configuring TCP/IP networking on a Tru64 UNIX
    system. The first, of course, is that the system has a network interface and is
    connected to a network. Tru64 UNIX supports several different work interfaces,
    including Ethernet, Token Ring, Fiber Distributed Data Interface (FDDI), Asynchronous
    Transfer Mode (ATM), and both Serial Line Internet Protocol (SLIP) and Point-to-Point
    Protocol (PPP) for TCP/IP networking across serial lines, particularly dial-up
    modems. Since most, if not all, Tru64 UNIX systems have at least one Ethernet
    interface, we will use Ethernet as an example.


    There are two popular Ethernet network layouts, or topologies, and the determining
    factor in which topology is used by the computer is physically connected to the
    network. The first, and by far the most common, is a star topology (Figure 7.1),
    in which each host is connected to a central hub via a direct cable. A star network
    is so termed because of the use of a central hub with each host radiating out
    on an individual spoke. This type of network is commonly referred to as a 10BaseT,
    a UTP (Unshielded Twisted-Pair), or simply a Twisted-Pair network and is readily
    identified by the distinctive RJ-45 connector on the host network interface. This
    RJ-45 connector looks like a jumbo U.S.-style phone jack and snaps into the jack
    with an audible click. The identifier “10BaseT” is an IEEE designation that includes
    three pieces of information. The first part, “10,” indicates the media speed in
    megabytes per second—in this case, 10 megabits per second (Mbps). The word “Base”
    stands for “Baseband,” a type of network signaling where Ethernet signals are
    the sole signals carried across the wire. The last piece, “T,” stands for “Twisted-Pair”
    and simply designates the cable type. A Fast Ethernet network, which is the most
    popular type today, an interface using twisted-pair


    ![](img/3eed431236346b7d400c9572311a8aa8_249_0.png)'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# 7.2 Network Configuration


    cabling, would be termed "100BaseT" to indicate a media speed of 100-Mbps. A switchable
    regular and Fast Ethernet network interface is frequently referred to as a "10/100BaseT"
    card. One big advantage of a star topology network is that a cable break or cut
    affects only one host; the remaining hosts are not impacted. Troubleshooting a
    star network can be simpler since each segment, or spoke, supports only a single
    host. A disadvantage is the additional requirement for a hub. Ethernet hubs are
    available in sizes ranging from small five-port units to large rack-mounted units
    with hundreds of ports.


    The second type of network topology is a bus layout (Figure 7.2), in which each
    host is attached to a single cable, or via tee connectors. This type of network
    is commonly referred to as a10Base2, Thinnet, or Thin Coax network and is characterized
    by the coaxial connector on the host network interface. This connector is typically
    termed a BNC (Bayonet Nut Coupling) and requires a tee connector for insertion
    into the main bus. The "10Base2" indicates that the media speed is 10- Mbps and
    uses Baseline signaling. The "2" is an indicator of segment length and is rounded
    up from the 185 meter maximum length for individual coaxial segments. The main
    disadvantage to a bus topology network is that a single cut or break can disable
    the entire network if it occurs on the main bus. In addition, a bus network requires
    tee connectors for each host, and 50Ω terminators to be attached to each end of
    the coaxial segment. However, if the network is small, consisting of just a few
    hosts physically close to one another, a bus network may be the simplest type
    of network to configure. There is also a 10Base5 type of Ethernet bus topology,
    also known as Thick-wire Ethernet. This used to be very popular but has lost favor
    in recent years to the 10BaseT topology.


    Once a system is properly connected to a network, the next step is to configure
    and enable TCP/IP networking on the system. This requires at least two and possibly
    three pieces of Address information:


    +   - An IP address

    - Subnet Mask

    - Gateway Address or Default Route (optional)


    ![](img/3eed431236346b7d400c9572311a8aa8_250_0.png)'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# 7.3 Addressing


    Every host on a network file must have a unique address. This uniqueness is necessary
    to allow one host to contact and communicate with any other host on the network.
    There are actually three layers of addressing, each serving a specific purpose,
    and each referring to the layer below it and ultimately to a distinct network
    interface:


    +   * Host name

    * Internet Protocol (IP) Address

    * Hardware Address


    We discuss each of these in the sections that follow.


    # 7.3.1 Host Name


    A system''s host name is simply a convenient name for use by people and programs.
    It is much easier to remember and use a name such as "saturn" rather than referring
    to a system by its IP address. A system''s host name is configured at system installation
    time and is fairly arbitrary. Obviously, though, the networking software cannot
    directly use a host name when attempting to communicate with another host on the
    network and must translate a host name into the next type of address—an IP address.
    The mechanism that does this translation is called the Resolver, and in the simplest
    configuration, it consults the /etc/hosts file for the corresponding IP address
    for a given host name. More complex configurations can also use the Network Information
    Service (NIS) or the Network Domain Name Server (DNS), which are both network
    services that perform network translation. NIS uses a local networking model that
    distributes a number of different system administration data to client systems,
    whereas the DNS is an Internet-wide distributed database of host names and their
    associated IP addresses. The NIS was originally developed by Sun Micros along
    with its Network File System (NFS) to maintain a single security domain among
    a group of local UNIX systems for the purpose of sharing files among them. Later
    in this chapter, the DNS implementation supported by Tri64 UNIX is discussed (see
    Section 7.10).


    The host name is only one name that can be associated with a host on a network
    to which a network connection can be made. A Tri64 UNIX system can have a large
    number of different names and IP addresses associated with an individual network
    interface. These additional names associated are also known as "aliases." If an
    alias is properly associated to the interface on a host,'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# 7.3.2 IP Address


    then that host can accept connections from both the host name and those aliases.


    An IP address is a unique 32-bit number that is assigned to identify a particular
    network interface. The IP address notation is normally written as four numbers
    separated by periods: for example, 192.168.4.100. Each of the four period-delimited
    numbers, or octets, represents 8 bits of the IP address. An IP address is not
    arbitrary and must be selected carefully based on the network on which the computer
    will reside and in coordination with the other hosts on that network. An IP address
    is actually composed of two pieces: a Network number and a Host number. The Network
    number must be identical for all hosts on the same network. Consider that the
    Network number is like the area code of a telephone number. All phone numbers
    in the same geographic region have the same area code. The Host number must be
    unique within a network. Continuing the telephone number analogy, all telephone
    numbers must be unique within a given area code. As you can imagine, if this weren''t
    the case, it would be impossible for a call to be correctly dispatched to a single
    individual. The phone number is nothing more than the network-addressing scheme
    for the global telephone network, similar to the IP address for the global Internet.


    The designers of TCP/IP networking anticipated differing sized networks and partitioned
    the network space defined by an IP address into three main categories:


    +   Class A—For this type of network, the first octet of the IP address specifies
    the network number and the remaining three octets define the host number. There
    are 126 Class A networks, each able to have up to 16,777,214 hosts. Class A networks
    are in the range 1.0.0.0 through 126.0.0.0 (the 0.0.0.0 and 127.0.0.0 ranges are
    reserved). Only very large organizations or companies can justify a Class A network,
    and in fact, there are no longer any available Class A addresses. As an example,
    Compaq Computer Corporation has a Class B network.


    +   Class B—A Class B network uses the first two octets of the IP address to specify
    the network number and the remaining two octets to define the host number. There
    are 16,384 Class B networks, each able to have up to 65,534 hosts. Class B networks
    are in the range 128.1.0.0 through 191.254.0.0. Class B networks are frequently
    used in medium-sized companies and universities.'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'Class C—A Class C network uses the first three octets of the IP address to
    specify the network number and the remaining octet to define the host number.
    There are 2,097,151 Class C networks, each able to have up to 254 hosts. Class
    C networks are in the range 192.0.1.0 through 223.255.254.0. Class C networks
    are the most common, and in some ways, the most versatile networks because they
    are the smallest hosts available and there are many Class C addresses available.
    Organizations unable to justify the larger B networks will frequently obtain multiple
    Class C addresses in order to meet their needs.


    Table 7.1 shows some example IP addresses and their logical division based on
    Class they are. Note that these sample addresses assume no subnetting, a topic
    that is covered below (see Section 7.4).


    Additionally, there are also Class D and Class E networks. Class D networks are
    numbered starting at 224.0.0.0 and are used for multicasting. Class E networks
    start at 240.0.0.0 and are used only for experimental and research purposes.


    If a network is currently connected to the Internet or is anticipated to be connected
    to the Internet, contact The Internet Corporation for Assigned Names and Numbers
    (ICANN) Registration Service (or equivalent) to apply for a block of IP addresses
    for your network from the IP address space. Most organizations that connect their
    systems to the Internet will receive their IP network addresses from their upstream
    Internet Service Provider (ISP). If your company or organization is large enough,
    you may have to contact the ICANN directly using the contact information below.


    The Internet Corporation for Assigned Names and Numbers

    4676 Admiralty Way, Suite 330

    Marina del Rey, CA 90229

    USA


    # Table 7.1 Example IP Addresses


    | IP Address | Class | Network Number | Host Number |

    |---|---|---|--|

    | 18.131.55.75 | A | 18 | 131.55.75 |

    | 138.12.70.190 | B | 138.12 | 70.190 |

    | 216.196.23.17 | C | 216.196.23 | 17 |'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'Phone: +1.310.823.9358

    FAX: +1.310.823.8649

    General Email: icann@icann.org

    Web site: http://www.icann.org/


    This block of IP addresses could be one or more Class C addresses or simply a
    subset of a Class C block depending on the size of the network. For a private
    network, completely isolated from the Internet, it is not necessary to register
    addresses with the ICANN. However, it is still recommended that IP addresses be
    applied for to avoid having renumber the network in the event a connection to
    the Internet is added later. As an alternative, three blocks of IP addresses have
    been reserved for private networks:


    10.0.0.0–10.255.255

    172.16.0.0–172.31.255.255

    192.168.0.0–192.168.255.255


    The advantages of using IP addresses from these ranges are that no coordination
    with the ICANN is necessary to use these addresses; in the event that a network
    is numbered in this range is connected to the Internet, there will be no conflict
    with registered hosts.


    # 7.3.3 /etc/hosts File


    The /etc/hosts file is a network configuration file that can contain a list of
    host names, their IP addresses, and, optionally, one or more host name aliases
    for systems reachable via the network. At a minimum, an individual system''s /etc/hosts
    file should contain an entry (host name and IP address pair) for the system itself
    and the system''s loopback or localhost interface, which always has the IP address
    “127.0.0.1.” For small networks or systems that communicate with only a few remote
    hosts, it is reasonable to keep all host information in local /etc/hosts files
    on all the systems. However, as the number of systems increases, the process of
    managing this large list of host names and associated IP addresses and aliases
    quickly becomes impractical. For anything more than just a handful of hosts, a
    distributed host name database such as the Domain Name Service (DNS) is almost
    a necessity. When using DNS, the /etc/hosts file becomes a backup for when the
    name server is not running. In this case, it is suggested that when only a few
    hosts be included in this file. These should include addresses for the local interfaces
    that ifconfig at boot time.


    The format of the /etc/hosts file is one entry per host, each entry on a single
    line. Each host’s record should have the following information:'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'IP_Address Canonical_Host [Alias_1,...,Alias_n] [#

    Comments]


    The fields in the /etc/hosts file are separated by white space. Therefore,

    any number of spaces and/or tab characters separates items. A pound sign (#)

    indicates the beginning of a comment, and any characters between the pound

    sign and the end of the line are ignored. The following is a fragment of an

    /etc/hosts:


    ```

    # /etc/hosts

    127.0.0.1 localhost

    192.168.1.78 saturn prod # Production Server

    192.168.17.80 jupiter

    ```


    The localhost entry is essential and must always exist in the hosts file. This

    has historically been used by the resolver to respond to requests for the loop-back
    device, but is no longer used for that purpose.


    # 7.4 The Subnet Mask


    Frequently, a network is subdivided into smaller segments. For instance, while

    a Class A network can support more than 16 million hosts, it is simply not

    practical and definitely not recommended to have that many hosts on one segment.

    Dividing or subnetting a network into smaller sections is done for a

    variety of reasons, including network performance efficiency; ease of management,such
    as decentralization of network administration and overcoming

    physical cable distance limitations. The mechanism for subnetting is the Sub-net
    Mask, a modifier that is used to determine how the network is subdivided.

    Every network configuration requires a subnet mask in addition to the IP

    address. The subnet mask is a 32-bit number specified in the dotted

    decimal format as an IP address and, together with the IP address, is used to

    specify which part of the address is the network and which is the host. One\minor
    disadvantage of subnetting is that in each subnet, the first number and

    last subnet number is reserved. Additionally, the first and last host number of

    each subnet is also reserved and cannot be used as a host address.


    For networks that are not subnetted, the default subnet mask is specified:


    ```

    Class A-255.255.0.0

    Class B-255.255.0.0

    Class C-255.255.255.0

    ```'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# 7.4 The Subnet Mask


    For a subnetted network, the subnet mask specifies a further logical division
    of the host part of the IP address into a subnet number and a smaller host number.
    When the subnet mask is represented in binary, each bit that is a one indicates
    the corresponding bit in the IP address is the network number; each zero bit in
    the subnet mask indicates the host number in the in IP address. For instance,
    consider the following Class B IP address:


    ```

    172.30.12.75

    ```


    Converting each octet of this address to binary results in the following representation:


    ```

    10101100 00011110 00001100 01001011

    ```


    If this IP address were part of a network that is not subnetted, the subnet mask,
    and its binary representation, would be used as shown in Figure 7.3.


    This would result in the first two octets (172.30) representing the network number
    and the second two octets (12.75) representing the host number.


    If this IP address is part of a network that is subnetted with the subnet mask,
    the resulting division would be as you can see in Figure 7.4.


    This would result in the first two octets (172.30) representing the network number,
    the third octet (12) representing the subnet number, and the fourth octet (75)
    representing the host number. This subnets the Class B network into 254 (256-2
    reserved) subnets, each capable of supporting 254 hosts.


    Finally, if the Class B network needed to be logically divided into more subnets,
    with each few hosts, the following subnet mask might be used as shown in Figure
