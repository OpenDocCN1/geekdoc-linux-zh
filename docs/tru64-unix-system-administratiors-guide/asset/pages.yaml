- img_proc: true
  md: '# Process Attributes


    By default, a process starts with a nice value of zero, which neither increases
    nor decreases the process priority. The nice(1) command is used to start a process
    with a nonzero nice value:


    ```

    $ nice -n 15 sort bigfile.txt -o sorted.txt

    ```


    This syntax and runs the sort command with a nice value of 15, which lowers the
    process''s scheduling priority, thereby increasing its execution time. The nice
    value (-n) is an optional parameter, for example:


    ```

    $ nice cc *.c &

    ```


    This command compiles a group of C programs in the background with the default
    nice value of +10.


    Only the superuser can specify nice values less than zero. For example, the following
    command runs with a nice value of -10, which increases the scheduling priority
    and prevents regular user processes from delaying its execution:


    ```

    $ renice -n -10 du -ks /home/*

    ```


    The nice(1) command is used only to start processes with modified nice values.
    Once a process is already running, its nice value also can be modified via the
    renice(8) command. The renice command is very flexible for the system administrator;
    either a single process or groups of similar processes can be been. To change
    the nice value of a single process, simply specify the process identifier to be
    reniced:


    ```

    $ renice -n -12 -p 783

    ```


    This changes the nice value of process ID 783 to negative 12. Multiple PIDs may
    be specified on the command line.


    The renice command can also be used to change groups of similar processes, either
    by specifying process group identifiers (PGIDs) to change all processes in a process
    group, or by specifying usernames or user identifiers (UIDs) to change all processes
    owned by a particular user. Renice is flexible enough to allow all types of changes
    on a single command line. For example, the following command changes the nice
    value of process IDs 2001 and 2005, processes in process group 771, and processes
    owned by jsmith:


    ```

    $ renice -n -2 2001 2005 -g 771 -u jsmith

    ```'
