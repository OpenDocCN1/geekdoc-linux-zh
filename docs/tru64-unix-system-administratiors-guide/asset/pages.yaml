    # 12.2.4 The Syslog Configuration Files


    The Tru64 UNIX V5 syslog facility has three configuration files, /etc/syslog.conf,
    /etc/syslog_evm.log, and /etc/syslog.auth. These files are simply text files that
    the syslog daemon reads at startup or after receiving a hang-up signal.


    # 12.2.4.1 /etc/syslog.conf


    This configuration file contains entries that specify the facility (see Table
    12.1), which is the part of the system that produced the message; the message
    severity level (see Table 12.2), and the destination to which the syslog daemon
    should send the message.


    Table 12.1 Available syslog Facilities

    | Name(s) | Description |

    | --- | --- |

    | kern | Kernel messages |

    | user | User-level messages |

    | mail | Mail system messages |

    | daemon | System daemon messages |

    | auth | Security/authorization messages |

    | syslog | Messages generated by syslog itself |

    | lpr | Printer subsystem messages |

    | news | Network news subsystem messages |

    | uucp | UUCP subsystem messages |

    | cron | Clock daemon messages |

    | megasafe | Polycenter AdvFS |

    | local0 | Reserved for local use |

    | local1 | Reserved for local use |

    | local2 | Reserved for local use |'
