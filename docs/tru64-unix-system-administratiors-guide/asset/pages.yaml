    # 4.6.2.1 PAK Units


    The LMF concept of license units is the key to the operation of LMF. A license
    unit is the basic unit of measurement Compaq uses to specify how much product
    use a license provides. The producer of a software product determines the number
    of units that are required to run the application on a particular system. This
    value is tied to the License Unit Requirement Table (LURT), which is a part of
    the Tru64 UNIX operating system. The LURT specifies a series of license unit requirements,
    essentially performance ratings,'
