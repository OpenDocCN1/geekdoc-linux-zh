    | PS2 | Secondary shell prompt (> by default) |

    | SHELL | Pathname of the shell |

    | TERM | Terminal type |

    | TIMEOUT | Bourne shell idle timeout (in minutes) |

    | TMOUT | Korn shell idle timeout (in seconds) |

    | TZ | Time zone |

    | USER | User name |

    | VISUAL | Default visual (full-screen) editor, e.g., vi(1) |'
