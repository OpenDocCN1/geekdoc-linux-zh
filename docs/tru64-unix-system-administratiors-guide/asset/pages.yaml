    # Add a Disk Label to the Device


    The next step in adding a disk to Tru64 UNIX system is to add a disk label to
    the new disk. The function of adding a disk label is to put a default partition
    table and some other information about the device on the first block of the disk.
    Each disk on a system may contain a disk label, which provides detailed information
    about the geometry of the disk, and the partitions into which the disk is divided.
    It should be initialized when the disk is formatted, and may be changed later
    with the diskabel(8) command. This information is used by the system disk driver
    and by the bootstrap program to determine how to program the drive and where to
    find the file systems on the disk partitions. Additional information may be used
    by the file system in order to use the disk efficiently and locate important file
    system information. The description of each partition contains an identifier for
    the partition type (standard file system, swap area, etc.).


