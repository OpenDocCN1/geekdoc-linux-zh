    of options (See Table 8.1) in individual, contiguous entries.


    Each entry, which describes a single printer, can be broken into multiple lines
    with a backslash ("\"). Each option is preceded and followed by a colon (":\").
    If the entry is broken into multiple lines, a colon and a backslash are required
    at the end of each line; each continuation line must begin with a colon, and continuation
    lines are indented by a tab. Comments can be included on lines beginning with
    the pound sign (#). The following is an example /etc/printcap:


