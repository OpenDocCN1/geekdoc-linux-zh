  md: "There are a number of different ways to invoke the dop utility. From a shell\
    \ command line, type \"usr/sbin/dop\" followed by the desired command options.\
    \ You can also invoke dop via CDE Application Manager: select the Configuration\
    \ folder, then click on the DOP icon to invoke dop. Finally, dop can be invoked\
    \ via the SysMan menu. You can either type \"sysman-config\" at the command line,\
    \ or select Configure Division of Privileges (DOP) from the SysMan Menu security\
    \ option list.\n\n# 6.9.1 Defining a Custom Privilege\n\nTo define your own custom\
    \ privileges, you must use the command line interface (/usr/sbin/dop) to do the\
    \ following:\n\n+   * Define the new privilege\n* Define the users who have the\
    \ privilege\n* Define the actions allowed to the privilege\n\nWe'll describe this\
    \ process by means of an example. The following paragraphs show how to add a custom\
    \ privilege named \"cdusers\" with the authority to mount and unmount CD-ROM disks.\n\
    \nFirst of all, if you're running a version of Tru64 UNIX older than V5.1A, you\
    \ may have an error in one of dop's resource files. If so, attempting to add a\
    \ privilege group will fail with the following error message: \n\n```\ncouldn't\
    \ compile regular expression pattern: invalid character range\n```\n\nTo fix this\
    \ error:\n\n```\n# cd /usr/share/sysman/mcl\n# cp doprc.mcl doprc.mcl.orig\n#\
    \ vi doprc.mcl\n```\n\nSearch for the following:\n\n```\n[regexp -- [^]&&a-zA-Z0-9._$-\
    \ - {}] $newval\n```\n\nand replace it with:\n\n```\n[regexp -- [^]&&a-zA-Z0-9._$-\
    \ - {}] $newval\n```\n\nThat is, the sequence of three consecutive hyphens has\
    \ one too many; remove one of the hyphens."
  merge: -1
  pgno: 245
- img_proc: true
  md: 'Now add the new privilege. The following command is split into two

    lines due to its length; the backslash at the end of the first line indicates
    the

    command is continued on the next line.


    ```

    # sysman -cli -add row -comp doprc -group dopinfo -data \

    "{cdusers} {} {} {} {Users who can mount/umount the CD-ROM}"

    ```


    Now add a list of users to the privilege. The user name in the list should

    separated by white space.


    ```

    # sysman -cli set values -comp doprc -group doprc \

    -keyl cdusers -attr users=fred wilma barney

    ```


    Verify that the group and users have been added successfully:


    ```

    # sysman -cli -list values -comp doprc -group dopinfo \

    -keyl cdusers

    Component: doprc

    Group: dopinfo

    Key: ''cdusers'' Value: cdusers

    Attribute: resource

    Attribute: users Value: fred wilma

    barney

    Attribute: groups Value:

    Attribute: catalog Value:

    Attribute: description Value: Users who can

    mount/umount the CD-ROM

    ```


    Now define the "mounted" and "umountcd" commands belonging to the

    new privilege:


    ```

    # dop -a cdusers umountcd "/sbin/mount -r /dev/disk/cdrom0c *""


    # dop -a cdusers umountcd "/sbin/umount /dev/disk/cdrom0c"

    Verify that the addition of the commands succeeded:

    # sysman -cli -list values -comp doprc -group dopActions \

    -keyl mounted

    Component: dopActions

    Group: dopActions

    Key: ''mounted''

    Attribute: action Value: mountcd

    Attribute: privs Value: cdusers

    Attribute: paths Value: { /sbin/mount -r

    /dev/disk/cdrom0c * }



    # sysman -cli -list values -comp doprc -group dopActions \

    -keyl umountcd

    Component: doprc

    ```'
