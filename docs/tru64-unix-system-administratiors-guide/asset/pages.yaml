    2  125.Hss34-0.CR2.KCY1.Alter.Net (137.39.59.214) 30.8 ms\n    37.5 ms 31.8 ms\n\
    3  126.ATM10-0-0.CR2.EWR1.Alter.Net (137.39.59.289) 68.5 ms\n    168.3 ms 66.5\
    \ ms\n4  112.ATM10-0-0.XR2.EWR1.ALTER.NET (146.188.176.22) 70.9 ms\n    70.7 ms\
    \ 69.9 ms\n5  192.ATM11-0-0.XR2.BOS1.ALTER.NET (146.188.177.158) 109.5 ms\n  \
    \  111.3 ms 82.8 ms\n6  190.ATM5-0-0.SR1.BOS1.ALTER.NET (146.188.177.13) 73.0\
    \ ms\n    73.3 ms 74.6 ms\n7 * *\n8 * *\n.\n.\n30 * *\n```\n\nBy default, traceroute\
    \ shows a maximum of only 30 hops and so, unless interrupted by Ctrl-C, traceroute\
    \ will stop after 30 probes. The number of hops can be adjusted by specifying\
    \ a value with the \"-m\" command line flag. In the preceding example, the problem\
    \ appears to be actually between the source and destination hosts. If you have\
    \ control over the entire network path, the next step is to identify gateway is\
    \ not responding and why. If in this case, the nonresponsive gateway is somewhere\
    \ out on the Internet, the next course of action is to attempt to locate the responsible\
    \ party and notify that of an apparent issue.\n\nAs you may well understand, being\
    \ familiar with the \"normal\" output of these tools on a system properly connected\
    \ and configured can be helpful in identifying problems. Experiment and explore\
    \ these troubleshooting tools to become comfortable with their switches, options,\
    \ and output. Refer to their man pages for more information."
  merge: -1
