  md: '# Introduction to Tru64 UNIX System Administration


    For all the advances in computing architectures and operating systems, complex
    computers still require a great deal of care and feeding. No operating system
    typifies this statement more than UNIX. UNIX is a mature operating system that
    runs on a wide range of systems—from small single-user desktops to the world''s
    fastest supercomputers. The broad spectrum of applications that run on UNIX ranges
    from banking and financial applications to telecommunications, manufacturing,
    and health care processes. Simply put, UNIX is everywhere. However, for all its
    success in the marketplace and all the development work that various UNIX vendors
    lavish on fancy graphical interfaces and dynamic this and automatic that, a UNIX
    system still, more than 30 years after its creation, cannot manage itself. Enter
    the UNIX system administrator.


    # 1.1 What is UNIX System Administration?


    A UNIX system administrator is the individual responsible for managing the complex
    collection of hardware and software that is a UNIX system. The UNIX operating
    system comprises a wide variety of services and processes that must be kept running
    and available and distributed among the system''s users. A typical day for a UNIX
    system administrator may include installing systems, creating accounts, stringing
    cables, troubleshooting and replacing failed hardware, performing system and user
    backups, and any of a hundred other tasks. UNIX system administration is frequently
    a thankless task. If everything is running smoothly, users and management often
    forget about the hard work that goes on behind the scenes. However, when a problem
    occurs and'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# I.I What is UNIX System Administration?


    the system is down, it is frequently the system administrator who bears the brunt
    of user and management unhappiness.


    Having said, UNIX system administration is a booming career field frequently seen
    in lists of the most desirable or needed occupations. UNIX system administrators
    seem to fall into one of three categories. The first is the individual who was
    “volunteered” for the job. These folks typically already have a “real” job, for
    one reason or another, the system administration role was added to their job description.
    The second type is the professional system administrator who has chosen UNIX system
    administration as a primary career and has worked and studied to be the very best.
    This type of system administrator is becoming more common as colleges and universities
    continue to develop UNIX system administration curricula and the career field
    gains repeatability. Finally, the most common type of UNIX system administrator
    is the person who just accidentally became one. These folks stumbled into it after
    being programmers or engineers something completely unrelated to computers, such
    as musicians. After discovering the ever-changing variety, constant challenges,
    and deep satisfaction that comes from managing the complex entity that is a UNIX
    system, they were hooked.


    Tru64 UNIX is one of many implementations of the UNIX operating system, and while
    aspects of using a UNIX system are similar from one flavor to another, the details
    of UNIX administration are all too frequently vendor-specific. Because of this,
    vendor-specific UNIX administration books will continue to be necessary.


    Before outlining the topics covered by this text, it might be helpful to understand
    the history of Tru64 UNIX and what versions of the operating system will be addressed
    in these pages. Following this will be a brief discussion of the Alpha family
    of computer systems.


    Tru64 UNIX was originally a product of Digital Equipment Corporation called “DEC
    OSF/1” because it was based on the Open Software Foundation’s OSF/1 standard.
    Version 1.0, the first fully supported OSF/1 version, was released in March 1992.
    This primarily was an internal release and was not shipped to customers. A year
    later, Digital shipped OSF/1 version 1.2 to customers. This version, the first
    fully functional release, was also the first that supported the new Alpha-based
    systems. From that point forward, OSF/1, then Digital UNIX, and finally Tru64
    UNIX, would only run on systems with Alpha processors. In June of 2001, Compaq
    and Intel Corporation announced that Tru64 UNIX was to be ported to Intel’s 64-bit
    IA-64 processor; the IA-64-based Tru64 UNIX systems will be available by 2003
    or 2004. Throughout the rest of 1993, Digital continued'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'to release minor updates to OSF/1, each adding new functionality or support
    for new hardware. In March 1994, Digital released OSF/1 version 2.0. This was
    a major release that introduced many of the modern operating system features,
    such as the Advanced File System (AdvFS) and CD-ROM, RAID, and Token Ring support.
    The next release of OSF/1 was version 3.0 in August 1994. This release continued
    the tradition of enhancement by adding support for Symmetric Multiprocessing (SMP)
    and loadable drivers. Following in February 1995 was version 3.2 of OSF/1, which
    added support for Asynchronous Transfer Mode (ATM) and the Common Desktop Environment
    (CDE). With the release of version 3.2C in August 1995, the name of the operating
    system was changed from DEC OSF/ to Digital UNIX. This was primarily a marketing
    decision made to better differentiate the product in an increasingly crowded market.


    The next release (version 4.0) of Digital UNIX was released in March 1996. This
    version added a host of new features to improve system management, portability,
    and performance. A string of minor releases followed, each one adding new features
    and enhancements to the operating system.


    In 1998, Compaq Computer Corporation acquired Digital Equipment Corporation and
    phasing out the Digital brand name. With the release of version 4.0E in December
    1998, Compaq renamed “Digital UNIX” to “Tru64 UNIX” in order to capitalize on
    its 64-bit nature.


    Version 5.0 of Tru64 UNIX was released in August 1999. This major release introduced
    a host of new features and enhancements. The most significant of these was the
    close integration of Compaq’s TruClustering product. Although TruClusters were
    supported as early as Digital UNIX version 3.2E, they were now much more tightly
    coupled with the operating system. This allowed a cluster of up to eight Alpha
    systems to present a “single system image,” greatly increasing the power and flexibility
    available to end users, while simplifying the management of multiple systems.


    At the time of this writing, the most current release of Tru64 UNIX is version
    5.1. This book will primarily discuss system administration on Tru64 UNIX version
    4.0D and later. Where there are differences between version 4.0 and 5.X, they
    will be noted.


    The future of Tru64 UNIX looks very bright. The 64-bit operating system combined
    with the 64-bit architecture of the Alpha and IA64 processors, positions Tru64
    UNIX in the lead for high-performance UNIX platforms.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# The Alpha Architecture


    Digital Equipment Corporation was a trailblazer in the area of 64-bit micro-processors
    with its family of Alpha processors. Tru64 UNIX has historically been married
    to the Alpha processor, but this will change in the near future with the port
    to the IA-64 processor.


    The Alpha RISC processor was announced by Digital in February of 1992 and its
    top speed was 200MHz. This was an astonishing feat, since the Alpha''s contemporaries
    were running at speeds in the double digits. Digital followed up by announcing
    the first generation of Alpha-based systems in November of that year. The first
    lineup ranged from the DEC 3000 workclassstation and the DEC 4000 departmental
    server all to the mainframe class DEC 7000 and 10000 systems. In October 1993,
    the second-generation Alpha systems were delivered, strengthening Digital''s lead
    in high-performance systems. Six months later, Digital announced the AlphaServer™
    2100, which was one of the first of a new breed of Alpha-multiprocessing midrange
    servers. The 2100 quickly became a best seller for Digital. In August 1995, Digital
    announced the 300MHz Alpha, and eight months later it delivered the AlphaServer
    8400 supporting up to twelve 300MHz processors. The 8400 was a mainframe replacement
    system and broke every performance record in existence. Digital continued pushing
    the Alpha technology and announced 500MHz parts in July 1996.


    Digital—and Compaq, after it acquired Digital—continued to press the development
    of the Alpha, releasing new generations of the chip with more features, smaller
    footprints, and faster clock speeds. At the time of this writing, 1 GHz processors
    are available in the GS-series of AlphaServers. This series (the GS80, GS160,
    and GS320), was a major leap forward when it was announced in June of 2000. These
    new systems are the most powerful yet, and the first Alpha systems to support
    a Non-Uniform Memory Architecture (NUMA). The GS series has a modular, “building
    block” design that allows the systems to be partitioned into several independent
    “virtual systems,” each running its own copy of Tru64 UNIX—or even another operating
    system, such as Compaq''s OpenVMS.


    From the very Alpha to today''s fastest systems, compatibility has been maintained.
    Tru64 UNIX runs on the entire range of Alpha-based systems. Compaq has ceased
    supporting the Tru64 UNIX product on the very earliest Alpha systems, but there
    is a good possibility that the operating system will still run on them.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 1.3 The Organization of This Book


    This text is divided into 12 chapters, each covering a different topic or discipline.
    The book is not intended to replace the Tru64 UNIX documentation; rather, it is
    presented as a supplement. The authors hope that this volume meets the needs of
    the target audience, the Tru64 UNIX system administrator, and contributes to successful
    system management.


    # 1.3.1 Installation


    Before a Tru64 UNIX system can be administered, it must be installed. The steps
    necessary to prepare a system for installation and to successfully install Tru64
    UNIX are covered in Chapter 2. In addition, the steps to update a Tru64 UNIX system
    to a later version of the operating system are covered.


    # 1.3.2 Storage


    Chapter 3 reviews both physical disk configuration and operations, and the selection
    and management of the various file systems and volume management options available
    on the Tru64 UNIX system.


    # 1.3.3 System Configuration


    Once a Tru64 UNIX system is successfully installed, there are many configuration
    activities that must take place before the system is ready for use. These activities
    include managing software subsets, licenses, and other system definition and configuration
    data, all of which are discussed in Chapter 4.


    # 1.3.4 User Accounts and Security


    The most visible of system administration responsibilities is managing users.
    Chapter 5 covers user account management, and Chapter 6 covers the maintenance
    of system integrity and security.


    # 1.3.5 Networking


    Chapter 7 covers the configuration of the TCP/IP networking subsystem and associated
    services on a Tru64 UNIX system. This is an important responsibility as most systems
    are networked to share resources and distribute loads.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 1.3.6 Printing


    Being able to print is an important facility for most users, and configuring printers
    and the spooling system is frequently a frustrating task for system administrators.
    Chapter 8 reviews the steps necessary to tame the printing beast.


    # 1.3.7 Processes and Resources


    A great deal of a system administrator''s time and energy is spent managing the
    myriad UNIX processes and resources. Users learn to depend on the availability
    of their favorite subsystem, and the administrator''s job is to make sure that
    these many services are available and managed correctly. These topics are discussed
    in Chapter 9.


    # 1.3.8 Performance Monitoring and Tuning


    Chapter 10 looks at some of the tools and techniques that can be used to identify
    and resolve performance problems on a Tru64 UNIX system. UNIX performance tuning
    is not an exact science, but after reviewing this chapter, a system administrator
    should be able to understand many of the variables that affect system performance.


    # 1.3.9 Backups


    Safeguarding the user community''s data is a sacred trust for a system administrator.
    Chapter 11 explains the development of a backup strategy and covers the various
    backup and recovery tools provided on Tru64 UNIX.


    # 1.3.10 System Logging and Troubleshooting


    Finally, what happens when something breaks? Chapter 12 covers system monitoring
    and error recovery techniques, and introduces several Tru64 UNIX tools for troubleshooting
    hardware and software problems.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Installation


    # 2.1 Introduction


    The initial installation of a Tru64 UNIX system can be an exciting process. Whether
    you are installing it on a brand-new system or a doing complete reinstallation
    of an existing system, the opportunity exists to define many aspects of the final
    configuration. The key to achieving the desired results is thorough planning.
    Some of the configuration decisions to be made prior to starting a Tru64 UNIX
    installation are disk and file system layouts, the method of installation, and
    optional Tru64 UNIX software subsets to install. The first part of this chapter
    will consider these issues.


    Once you have decided how the system will be configured, it is necessary to ensure
    that the system is properly prepared for the installation. This means that all
    components of the system are at the proper firmware revision for the version of
    Tru64 UNIX you will be installing. In addition, depending on the method of installation
    selected, either a local CD-ROM drive must be installed or if installing from
    a Remote Installation Server (RIS), the system must be connected to a network.
    Next, you must have console access to the system. This console can be a serial
    terminal or a graphics display: Tru64 UNIX supports installations from either
    console type. Next, your system needs a suitable boot disk. This requirement may
    seem obvious, but this is worth mentioning Compaq hardware makes it very easy
    to have multiple versions of Tru64 UNIX installed on a system. This capability
    can allow you to evaluate a new version of Tru64 UNIX by installing the later
    version on a spare disk rather than upgrading your current version. Simply boot
    from that new installation and you can determine if the upgrade is right for you.
    Finally, the procedure for checking and updating system firmware is outlined.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'This chapter describes the installation process and provides examples of the
    graphical installation utility available on Tru64 UNIX V5.1 and above. Regardless
    of the installation interface used (graphical or character-cell), you will have
    the ability to select the boot disk; the root, swap, /usr /var partitions and
    file systems; and the Tru64 UNIX software subsets to install. After loading the
    selected subsets, the installation program prompts you to rebuild the kernel (depending
    on how you answered the kernel options questions, it may build it for you). Later
    in the chapter recommendations will be made regarding optional subsets to install
    and which kernel options to select.


    Once the installation is complete and the system configuration must be done before
    the system is ready for use. The bulk of the post-installation configuration will
    be covered in Chapter 4, "System Configuration," but some minor configuration
    details will be mentioned in this chapter. Other areas of system configuration,
    as user accounts and network management, are dealt with in Chapters 5 and 7, respectively.


    An alternative to a full installation is an update installation. An update installation
    updates an existing Tru64 UNIX system to a later version. For instance, you can
    do an update installation to a Tru64 UNIX V4.0G to Tru64 UNIX V5.1. An update
    installation preserves existing disk partitioning, LSM configuration, file systems,
    accounts and files, and the network printer configuration.. advantage of an update
    installation over a full installation is that all local customizations remain
    intact. The disadvantage is that you carry any bad habits and old baggage forward,
    and if the existing version is quite old, it could require more work to update
    than to perform a fresh install. Sometimes a fresh installation is worth the extra
    effort. In fact, Compaq recommends that you perform a fresh installation once
    you decide to move to a new major release. The details of an update installation
    are covered; some of the limitations of an update installation are also mentioned.


    Finally, Compaq''s Remote Installation Services (RIS) will be explained. RIS is
    a facility for installing a Tru64 UNIX system from a remote server that contains
    the Tru64 UNIX distribution. The main advantage of RIS is that multiple systems
    can be installed without having to have the Tru64 UNIX distribution CD-ROM in
    each system. All that is required is copying the Tru64 UNIX distribution into
