    # 7.11.3 Anonymous FTP Configuration


    A special FTP server configuration that is commonly used on the Internet as a
    means of allowing the public to download and upload files is called Anonymous.
    This configuration does not require an individual account but allows anyone to
    log in via FTP using a commonly known user account, typically “anonymous” or “ftp”.
    A password is prompted for, but the convention is for the user logging in to specify
    his or her e-mail address, though this convention is not enforced with the Tru64
    UNIX FTP server. Because Anonymous FTP allows FTP connections without any authentication,
    it is critical that FTP is configured properly to avoid compromising the security
    of your system, especially if the system is accessible via the Internet. Following
    are the minimal steps to securely configure Anonymous FTP on a Tru64 UNIX system.


    +   1. Create an “ftp” user account specifying an appropriate home directory,
    such as /var/ftp. Note the remaining steps assume /var/ftp. If another location
    is selected, substitute that home directory in the following commands.


    +   2. Create several subdirectories in the ftp home directory:


    ```

    # mkdir /var/ftp/bin

    # mkdir /var/ftp/etc

    # mkdir /var/ftp/pub

    ```


    +   3. Change the ownership and permissions of the ftp home and directories:


    ```

    # chown root:system /var/ftp

    # chown root:system /var/ftp/bin

    ```'
