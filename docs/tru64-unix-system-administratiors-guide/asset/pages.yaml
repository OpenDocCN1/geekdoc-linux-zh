    # 2.3.9 Updating Firmware Across the Network via BOOTP


    Compa provides the ability to update an Alpha system’s console firmware by booting
    a firmware update image located on another system across the network using BOOTP
    (Boot Protocol). This can be a useful alternative to either the Firmware Update
    CD-ROM or a bootable Firmware Update floppy disk, especially when there are many
    systems to be updated. Simply copy the appropriate firmware update image(s) to
    a suitable system and configure the BOOTP server for each client system to be
    updated. Once these steps are completed, each target system can be booted from
    the BOOTP server and the firmware update can proceed. Note that as of V5.0 of
    the Alpha Systems Firmware Update, there is no BOOTP support for updating the
    I/O options firmware—only the SRM and ARC firmware can be updated via BOOTP.


    When selecting a system to be a BOOTP server for firmware updates, there are several
    requirements to consider. To be a BOOTP server, a system must be on the same network
    segment as the systems to be updated, and the systems must be able to communicate
    with each other. Check connectivity with the ping(8) command. See Chapter 7, "Networking,"
    for details on Tru64 UNIX network configuration. In addition, the optional Additional
    Networking Services subset containing the BOOTP daemon must be loaded. This subset
    named OSFINET, where the xxx specifies the version of the subset. To determine
    if this subset is loaded, execute the following command,


    ```

    # /usr/sbin/setld -i | grep -i osfinet

    ```


    OSFINET510 installed Additional Networking Services (Network-Server/Communications)'
