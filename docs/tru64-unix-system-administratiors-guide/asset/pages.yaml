- img_proc: true
  md: '# 12.4.1.1 evmshow


    Perhaps the most used EVM command line utility is the evmshow command. You must
    use this command to view the stored events because they are in binary format.
    To display the contents of an old log file use a command such as:


    ```

    # evmshow /var/evm/evmlog/evmlog.20010606

    ```


    To insert a timestamp re-run the command specifying that the timestamp be included:


    ```

    # evmshow -t "@timestamp @@" /var/evm/evmlog/evmlog.20010606

    ```


    For details about the EVM command-line utilities, see the man page or the EVM
    documentation.


    # 12.4.1.2 evmget


    The evmget command is used to retrieve a stream of binary EVM events. The evmget
    command makes a connection to a child process of the EVM daemon, the get-server,
    and based on the authorization checks by the get-server, processes events for
    which the user is authorized. Normally this is passed to the evmshow command:


    ```

    # evmget -f "[priority > 300]" evmshow -t "@timestamp @@"

    ```


    This will retrieve all events for which the user is authorized that have a priority
    greater than 300 and displays them with a timestamp through the evmshow command.
    Notice the use of the -f switch (filter) to select only certain events.


    # 12.4.1.3 evmsort


    Since the events are likely to be in no particular order when evmget retrieves
    them, there needs to be some sorting done along the way. That is precisely what
    evmsort sorts. The evmsort command reads the binary events and can be used in
    a pipeline with evmget. Building on the previous example but adding sort:


    ```

    # evmget -f "[priority > 300]" evmsort \

    |evmshow -t "@timestamp @@"

    ```'
  merge: -1
  pgno: 450
- img_proc: true
  md: 'View the evmsort man page to see how you may “fine tune” your sort based on
    different fields.


    # 12.4.1.4 evmwatch


    The evmwatch utility is for viewing events in real-time. Again the output will
    be processed by evmshow and you may use a filter to select only certain events—for
    example, those with a priority greater than 300:


    ```

    # evmwatch -f "priority > 300" | evmshow -t "timestamp @@"

    ```


    There is no need for an evmsort in the pipeline since these events will be displayed
    as they occur. The timestamp will be displayed with any events.


    # 12.4.1.5 evmpost


    Finally the evmpost utility, as its name implies, posts events to the EVM daemon.
    It takes input as a file or stream of event sources, converts it into the binary
    EVM format, and posts it to the EVM daemon for distribution. One simple example
    of this is posting a system administrator event that a particular operation completed
    successfully:


    ```

    # evmpost -a "Disk dsk23 was successfully replaced"

    ```


    # 12.5 The Crash Dump Process


    When a Tru64 UNIX system encounters a problem so severe, whether a software issue
    is in the kernel or an unexpected hardware fault, further operation is impossible
    or just unwise, the operating system will halt operation typically in a panic,
    and if the auto_action console prompt is set to boot, a system reboot. In this
    manner, the operating system copies an image of the contents of all or part of
    the physical memory to swap. The partial_dump attribute from the “generic” subsystem
    of /etc/sysconfigtab tells the operating system whether to write a partial or
    full dump; partial dumps are the default and are normally sufficient to diagnose
    the problem. Furthermore, the default value of compressed_dump (also in “generic”)
    is “1,” which saves considerable disk space but might be a problem if you use
    tools that require an uncompressed dump file—you can always use expand_dump(8)
    to uncompress a vmcore file. As part of the reboot process, savecore(8) checks
    if a image from a system crash exists, and if so, moves that memory from disk
    to an operating system file and along with another program creates several other
    ancillary files,'
  merge: -1
  pgno: 451
- img_proc: true
  md: 'together, are called the Crash Dump Files. The system administrator and/or
    an experienced Compaq support engineer can then use these Crash Dump Files to
    determine the cause of the crash.


    In order to ensure that these Crash Dump Files are recovered, it is important
    to understand the sequence of events in a crash dump recovery so that system resources,
    primarily disk space, are preallocated. The following topics will be covered:


    +   - The Crash Dump sequence

    - Guidelines for deciding how much disk space to allocate

    - Forcing a hung system to generate a crash dump


    # 12.5.1 The Crash Dump Sequence


    When a Tru64 UNIX system crashes, an image of the memory is copied to disk, specifically
    to the swap area(s). Which swap areas are copied to determined by the size of
    the memory image to be saved, and the number and size of the available swap areas:


    +   - If the memory image fits in the primary swap area (identified as the first
    entry in the comma-separated list of swap devices in the swapdevice attribute—this
    attribute is found in the "vm" subsystem of the /etc/sysconfig file), the memory
    image is written into this primary swap area, starting at the end of the partition.
    The image is placed far from the front of the primary swap partition to avoid
    being overwritten when the system is next rebooted.

    - If the memory image does not fit into the primary swap area, the memory image
    is written into the secondary swap areas (also identified by swapdevice in the
    /etc/sysconfig file).

    - If the memory image is too large to fit into the secondary swap areas, the memory
    image is written to the secondary swap partitions until those are full. The remaining
    part is then written to the end of the primary swap partition.

    - If the memory image is too large to fit into all swap areas combined, no crash
    dump is created.


    After the memory image is copied to the swap area(s), the system reboots. During
    the reboot process at run level 2, the /sbin/init.d/savecore script runs the savecore
    program and determines if a crash dump has been created and if sufficient file
    system space exists in which to save the crash dump. If a crash has occurred and
    a crash dump was successfully saved there is'
  merge: -1
  pgno: 452
- img_proc: true
  md: 'enough file system space, savecore begins to copy the memory image from the
    swap area(s) into a file system, /var/adm/crash, by default.


    After savecore has successfully saved a crash dump, two files are produced:


    +   - vmzcore.N—The compressed physical memory image at the time of the crash

    - vmunix.N—The running kernel at the time of the crash


    As the system continues to boot, crashdc(8) runs at level 3 to produce:


    +   - crash-data.N—A human-readable crash summary file


    The value of N is maintained by savecore in the "bounds" file in the crash directory.
    This value is simpel sequence number that is incremented after each crash, the
    first crash being number 0. As crash dump files can be quite large, especially
    the vmzcore.N file, ensure that crash dump files that are no longer needed are
    removed to avoid running out of disk space.


    When diagnosing a system crash, an experienced crash dump analyst will need all
    three files in order to troubleshoot what caused the crash and how to prevent
    future instances. You may be required to transfer the crash dump files for a particular
    crash to a Compaq customer service center for analysis. While such crash dump
    troubleshooting is beyond the scope of this text (for more information on this
    topic, see the Tru6 UNIX Kernel Debugging Guide), is at least interesting to examine
    the crash-data.N file, for this file contains a summary of the system at the time
    of the crash. It is sometimes possible to determine from the contents of the crash-data.N
    file alone if a particular process, or possibly a hardware problem, may have caused
    the crash.


    # 12.5.2 Compaq Crash Analysis Tool


    The Compaq Crash Analysis Tool (CCAT) is a diagnostic tool for Compaq Services
    customers. It allows customers to automatically or manually diagnose system crashes.
    The CCAT analysis may include a solution, workaround, or troubleshooting technique
    for the crash. As mentioned earlier, CCAT is part of the Web-Based Enterprise
    Service (WEBES) suite of diagnosis tools:


    ```

    http://www.support.compaq.com/svtools/webes/

    ```


    During the reboot after a system crash, in fact at level 3, CCAT runs to see if
    the crash matches the footprint of a fixed problem or not. In either case, it
    generates a call (if DSNlink is also installed) to Compaq''s Customer'
  merge: -1
  pgno: 453
- img_proc: true
  md: 'Support Center for either the delivery of the solution (if it found a match)
    or to have a new crash analyzed. The key is that the system boots, some diagnosis
    is already being performed and may, in fact, provide a solution to the crash completely
    behind the scenes.


    You can find more information about DSNlink at the DSNlink Web page:


    http://www.support.compaq.com/dsnlink/


    # 12.5.3 Crash Dump Disk Space Guidelines


    There are two types of disk space to consider when planning for Crash dump space:
    swap and the crash file system. Both types must be sufficient to hold at least
    one crash dump. The crash dump is an image of physical memory, but since partial
    dump is usually all that is required plus the fact that the dump file is compressed
    (by default), the space requirement is cut down significantly and, as a rule,
    about 50% of the size of physical memory. This figure will vary widely based on
    how much memory is currently in use and how it is configured. For example, a lightly
    loaded system with 256 MB of physical memory with partial_dump and compressed_dump
    enabled may require a mere 4 MB for the vmcore.N file.


    The first place a crash dump is saved is the partition(s), and a very large swap
    space is not needed to capture a partial dump. Even though a large swap space
    is not a requirement for the crash dump process, Compaq recommends swap space
    of three times the size of physical memory. An exception to this rule of thumb
    is that Very Large Memory (VLM) systems with physical memory sizes over two gigabytes
    are normally tuned so they do not page or swap. allocate one times physical memory
    for swap. In this case Compaq recommends the ability to temporarily add additional
    swap space to capture a crash dump if such a system were to begin crashing. Once
    a crash dump is captured and the reason for the crashes is identified, reassign
    the extra swap space.


    The second place a crash dump is saved to the crash file system, which is /var/adm/crash
    by default. The file system where the crash dumps will be saved must be sufficiently
    sized to hold at least one crash—that is, approximately 50% of the size of physical
    memory. If /var/adm/crash is not appropriate, set the runtime configuration variable
    SAVECO_DIR to another location. For example, to set /usr/crash as the crash directory,
    issue this command:'
  merge: -1
  pgno: 454
- img_proc: true
  md: '```

    # rcmgr set SAVECORE_DIR /usr/crash

    ```


    Again, if it is unreasonable on a VLM system to keep a large amount of disk space
    in a file system on a permanent basis, simply be prepared to point the SAVECORE_DIR
    to a temporary location in the event of system crash problems, at until a crash
    dump is captured.


    # 12.5.4 Forcing a Crash Dump


    It is possible for Tru64 UNIX system to stop responding in any way as the result
    of a software or hardware problem. When this occurs, a crash dump is not generated,
    due to the system''s being in a hung state. In order to force a crash when a system
    is hung and generate a crash dump that may indicate the cause of the system hang,
    do the following:


    +   If the system has a HALT button on the operator control panel:

    1. Press the HALT button to bring the system to the “triple chevron” console prompt
    (>>>).

    (Note: If the system has a switch for enabling and disabling the HALT button,
    switch that to the ENABLE position.)

    2. At the console prompt, type “crash” and press <Return>.


    +   If the system does not have a HALT button:

    1. Press the Ctrl-P key sequence, type “crash” and press <Return>.

    2. At the console prompt, type “crash” and press <Return>.


    These steps will halt the system and initiate the generation of a crash dump,
    saving a memory image at the time of the halt, and, one hopes, containing information
    about the original system hang. After the crash dump is complete, boot the system
    to complete the generation of the crash dump files. If you were to look at the
    crash-data.N file, you would see a panic string of “hardware restart,” indicating
    a forced crash.


    There are times when a crash dump would be useful to troubleshoot a problem that
    is not considered a “hang” and it may be desired not to force a crash since that
    will result in system downtime. In this case, dumpsys(8) can be used to take a
    snapshot of memory and produce crash files the same way that a forced crash would.
    Keep in mind, however, that using dumpsys is not quite the same as a forced crash
    since memory will continue to change while dumpsys runs.'
  merge: -1
  pgno: 455
- img_proc: true
  md: '# 12.6 Summary


    As this chapter outlined, Tru64 UNIX provides several tools and facilities to
    assist in identifying, diagnosing, and preventing system problems. Between syslog,
    binlog and EVM, Tru64 UNIX''s logging is very complete, giving you, the system
    administrator, a great deal of useful information about software and hardware
    errors. Finally, once a problem is so severe that the system cannot continue,
    the crash dump facility is available to provide a dump of core memory for faster
    analysis.'
  merge: -1
