  md: '# Performance Monitoring and Tuning


    # 10.1 Overview


    The performance of a UNIX system is best defined as the ability of the system
    to accomplish a given task or set of tasks. Good performance is a moving target
    that depends on a great many variables, including user perception, performance
    indexes, and available system resources. A system administrator is frequently
    called upon to do so to the satisfaction of the user community can be a challenging
    task. In this chapter, we discuss the performance indexes available to you in
    quantifying system performance, define the four primary system resource categories
    that affect UNIX system performance and the tools to measure them, and provide
    strategies for translating user complaints into objective information useful for
    evaluating performance problems.


    Once the performance of a system has been quantified and performance problems
    have been identified, the next step is tuning. Tuning is the process of adjusting
    the system configuration to compensate for an identified performance bottleneck.
    Following the discussion of performance indexes and system monitoring, we outline
    a tuning methodology that aims for the best overall performance over time.


    # 10.2 Performance Management


    Performance management is an ongoing process of continued system monitoring and
    configuration adjustments to maintain an acceptable level of performance. In order
    to successfully manage performance, a system administrator must understand:'
  merge: -1
