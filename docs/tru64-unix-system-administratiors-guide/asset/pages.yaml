- img_proc: true
  md: '# 6.6.1.5 Test Your Applications


    At this point, your system is running Enhanced security, and you should conduct
    whatever testing of your applications is deemed appropriate before declaring success.
    In addition, there is an issue related to passwords on newly Enhanced security
    systems that bears mentioning. In Base security, the maximum password length is
    eight characters, but if a user attempts to use a longer password string, the
    system simply truncates it to eight characters without an error message. Such
    users may believe their passwords are longer than eight characters, but the system
    is actually encrypting only the first one. When Enhanced security is enabled and
    the user attempts to use the longer password, only the first eight characters
    will be accepted as the valid password. For example, if the user was entering
    “toogood2be” for a password, the user must enter only “toogood2” (the first eight
    characters) to successfully log in. This anomaly is an issue until the user changes
    the password under Enhanced security, at which point the global password defaults
    (or user defaults if different) dictate the password length. Ensure that your
    users are aware of this password issue prior to logging into the system at the
    Enhanced security level.


    # 6.6.2 Disabling Enhanced Security


    If you decide to disable Enhanced security and return to Base security, the steps
    are:


    +   1. Log in as root.

    2. Run the seccfig utility to select the BASE security level.

    3. Reboot the system.


    This will quickly revert the system back to Base security and copy the encrypted
    passwords from the authentication database into the /etc/passwd file. Rebooting
    the system completes the process. This will leave all of the Enhanced security
    files in place if you decide to re-enable Enhanced security at a future date.


    # 6.6.3 The Authentication Database


    Tru64 UNIX Enhanced security stores all security information in a set of five
    databases that are collectively known as the authentication database. The five
    component databases, and the types of information they contain, are shown in Table
    6.1.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Table 6.1 Components of the Enhanced Security Authentication Database


    | Database Name | File Name | Field prefix |

    |---|---|--|

    | Protected Password | /tcb/files/auth.db and /var/tcb/files/auth.db | u_ |

    | Terminal Control | /etc/auth/system/tts.db | t_ |

    | System Default | /etc/auth/system/default | d_ for system-wide defaults; t_,
    u_, and v_ may appear |

    | Device Assignment | /etc/auth/system/devassign | v_ |

    | File Control | /etc/auth/system/files | f |


    Each component database contains a set of entries; for example, the protected
    password database contains one entry for each user account on the system. Each
    entry consists of an entry name, followed by a set of one or more fields, followed
    by the field "chkent," which indicates the end of the entry. The fields are separated,
    and the chkent field is terminated, by a colon. Fields can be strings, integers,
    or Boolean values. A string field has the form "field_name=value". Integer fields
    have the form "field_name=value". Boolean fields have the form "field_name@" if
    they have a true value, and "field_name@" if they have a false value; in other
    words, the "@" at the end of the field acts as a negation operator. It is not
    mandatory for every possible field to be present in every entry. When a particular
    field is not specified in an individual entry, the corresponding field value from
    the system defaults database is used for that entry.


    Many of the authentication database fields indicate time values, either a duration
    (e.g., password lifetime) or an absolute time (e.g., time of last successful login).
    All time values are represented in seconds. For an absolute time, the value is
    the number of seconds since the standard UNIX epoch, which is the beginning of
    the year 1970. The value zero has a special meaning in many of the integer fields,
    generally indicating an infinite value or a check that will not be performed.
    For example, the field "u_exp#0" indicates that the password expiration time is
    infinite (i.e., the password will never expire).


    A typical protected password database entry for user "test1" looks like this:'
