    # Table 10.1 iostat(1) Arguments


    | Argument | Meaning |

    |---|---|

    | drive... | Forces iostat to display information on specific drives. If the drive
    is not specified iostat displays the first four drives (even if more than four
    disk drives are configured in the system). |

    | interval | Causes iostat to report each interval once. The first report is for
    all time since reboot, and each subsequent report is for the last interval only.
    |

    | count | Specifies the number of reports. For example, iostat 10 would produce
    10 reports at 1-second intervals. You cannot specify count without interval, because
    the first numeric argument to iostat is assumed to be default. |


    # Example:


    ```

    $ iostat dsk2 dsk3 dsk4 cpu

    tin 0 39 5 0 0 2 6 0 5 0 23 72

    $ iostat 5 dsk1 dsk2 dsk3 dsk4 cpu

    tin 0 39 5 0 0 2 6 0 5 0 23 72

    0 59 0 0 0 0 0 0 7 12 43 38

    0 59 0 0 0 0 0 0 7 12 45 36

    0 58 0 0 0 0 0 0 7 12 41 40

    0 58 0 0 0 0 0 0 7 12 48 36

    ```


    See Table 10.2 for a description of the output fields from the iostat command.
    The first invocation of iostat displays a summary of activity since the system
    was started. This summary line is always displayed as the first output line when
    running iostat. The CPU fields (us, ni, sy, and id) indicate that, on average,
    the CPU has been 72% of the time and busy running system and user instructions
    the remaining 28% of the time. The second iostat also displays the summary line
    first, followed by four “snapshots” of current system activity at five-second
    intervals. At this time, the CPU is busier than average, and each time the CPU
    utilization is approximately 63% (with the average sum of the us, ni, and sy field).
    Note that the CPU fields, in addition to the other fields, are displayed as rounded
    integers, so it is possible for the sum of the four CPU values to equal less than
    100%.


    The iostat output is useful in identifying CPU resource limitations. While the
    system is running a typical or representative workload, run iostat'
