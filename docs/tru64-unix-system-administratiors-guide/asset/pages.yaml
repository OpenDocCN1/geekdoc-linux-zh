- img_proc: true
  md: '# 4.6.2.6 Updating the Kernel License Cache


    Once a PAK is registered in the LMF database file, the next step is typically
    to enable that newly entered license. Until the PAK is copied to the system’s
    kernel license cache, the license is unavailable to users. To update the system’s
    license cache, simply issue the following command:


    ```

    # lmf reset

    ```


    This reset can be done at any time without disturbing active users or processes.
    Note that “lmf reset” is executed as part of the system startup to initially copy
    the license data from the LMF database file to the active license cache.


    # 4.6.2.7 Transferring Licenses


    Occasionally it may be desirable to move a software product from one to another.
    This may be because the original system is going to be taken down for maintenance,
    or perhaps an organization is upgrading or downgrading to a different system.
    Whatever the reason, a move would also require moving the license information
    in addition to the software product itself. Obviously, the system administrator
    could simply deregister the PAK(s), and produce a file containing the removed
    PAK data in one step. This process is called issuing a PAK and is done with the
    following syntax:


    ```

    lmf issue <file> <product> <producer> [<authorization number> ]

    ```


    Replace <file> with a filename to the reconstructed PAK data, and specify the
    product name in place of <product>. If there is more than one PAK with the same
    product name, it is necessary to specify the producer and authorization number
    to identify what specific PAK is to be issued. For example, the following command
    will issue a specific OSF-USRPAK PAK to the file /tmp/OSF-USRPAK.txt:


    ```

    # lmf issue /tmp/OSF-USRPAK.txt OSF-USRPAK DEC ARS-MT-1998JAN31-249

    ```


    To load this issued PAK on another system, transfer the PAK.txt file to that system
    and issue the following register command:


    ```

    # lmf register - OSF-USRPAK.txt

    ```'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# 4.6 License Management


    Note that using the "Imf issue" command to illegally copy license PAKs against
    the terms of the license agreement is forbidden. Refer to the license terms on
    the back of the license PAK for more information.


    # 4.6.2.8 Fixing a “Not enough units to load OSF-BASE DEC” Error


    The OSF-BASE license is an availability license. When an AlphaServer is purchased
    it ships with license of the appropriate capacity.


    If a CPU is added to the AlphaServer it is possible that the capacity of the license
    will be exceeded and the following error message will be displayed:


    > "Not enough units to load OSF-BASE DEC"


    The following actions can be taken to solve this problem:


    Check the OSF-BASE for MOD_UNITS in the “Key Options” field. If it exists you
    can increase the number of units.


    ```

    # lmf list full for OSF-BASE | grep MOD_UNITS

    Key Options: MOD_UNITS, ALPHA

    ```


    If MOD_UNITS exists, check the LUR table for appropriate number necessary for
    the AlphaServer/CPU combination. See section 4.2.6.1.


    +   - Increase the number of units to value specified in LURT table.


    ```

    # lmf modify OSF-BASE

    ```


    Note, you will be placed in the editor specified by your EDITOR environment variable
    or vi(1) if EDITOR is undefined.

    Edit the “Number of units” field to the appropriate number.


    ```

    # lmf reset

    ```


    If the MOD_UNITS attribute does not exist, call Compaq to request a temporary
    OSF-BASE PAK and purchase an additional PAK.

    Note any license with MOD_UNITS can have its units increased or decreased.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# 4.6.2.9 The OSF-USR “UNIX-SERVER-IMPLICIT-USER” License


    Tru64 UNIX includes a four-user OSF-USR PAK, known as the “implicit-user” license
    because the value of the “Authorization Number” field is “UNIX-SERVER-IMPLICIT-USER”.
    Remove this license when adding a larger capacity OSF-USR PAK to allow more than
    four users to log into the system.'
