- img_proc: true
  md: '# Processes and Resources


    # 9.1 Process Management


    Tru64 UNIX provides a rich computing environment due to its multiprocessing and
    multiuser nature. The ability for multiple users to run multiple jobs simultaneously
    provides great flexibility to end. Of course, this ability is not limited to Tru64
    UNIX, nor even to UNIX itself, but exists in a variety of computing environments,
    such as large mainframe environments, proprietary systems such as Compaq''s Oracle,
    and Microsoft''s Windows 2000. UNIX, however, and Tru64 UNIX in particular, has
    gained a reputation since the early 1970s as the operating system of choice for
    supporting software development efforts, especially large team projects, and multiuser
    database applications, such as those based on Oracle, Informix, or Sybase.


    A Tru64 UNIX system administrator comes to this environment needing the skills
    to understand and manage this multiprocessing capability. In UNIX, a single job,
    whether it is a system function, such as authenticating user logins or handling
    print requests, or a user activity, such as compiling a C++ program or querying
    a database, is called a process. Managing these processes, which can be as few
    as a couple of dozen on an individual workstation, or thousands of processes on
    a large database or Web server, is an important part of a system administrator''s
    responsibility.


    In this chapter, we discuss the various attributes of a process, how these attributes
    interrelate, and which attributes can be adjusted to change the behavior of a
    process. In addition, the parent/child process relationship is covered. This relationship
    is important in understanding how processes start and finish. Controlling processes
    includes the various ways to start a process, changing the state of a process
    by sending signals to the process, and the con'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Process Overview


    cept of foreground and background processes. Tru64 UNIX also provides several
    methods of scheduling processes to be run at a future date. This capability is
    used extensively by system administrators to schedule period-ic maintenance processes,
    such as system backups, to run without user intervention.


    A process is composed of executing code and its address space. A program and a
    process are not necessarily one and the same; a single program can be made up
    many processes. There are frequently performance benefits to breaking large or
    complex programs into multiple processes on a UNIX system. Each active process
    has an entry in the system process table, which is managed by the system scheduler.
    Processes are the mechanism by which all work, whether system task or user application,
    is performed on a Tru64 UNIX system.


    The maximum number of processes that can run simultaneously are derived from the
    “maxusers” system parameter. The Tru64 UNIX document-ation defines maxusers as
    the number of simultaneous users that a system can support without straining system
    resources. The formula for calculating the maximum number of processes changed
    in Tru64 UNIX version 5.0. Before V5.0, the formula was:


    ```

    (maxusers*8) + 20

    ```


    Beginning with V5.0, the formula is:


    ```

    (maxusers*32) rounded up to a power of 2

    ```


    For example, with maxusers set to 1000, a V4.0 system can run up to 8,020 simultaneous
    processes, while a V5.0 system can run up to 32768 processes.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# 9.2 Process Overview


    The default value of maxusers is 32 in older versions of Tru64 UNIX. This is a
    very conservative value, perhaps suitable for an individual workstation, but definitely
    too low for most systems. Beginning in V5.0, the kernel sets the value of maxusers
    at boot time, based on the amount of physical memory in the system. The relationship
    between maxusers and physical memory is shown in Table 9.1.


    The minimum possible value of maxusers is 8. The maximum is 16,384 (4,096 prior
    to V5.0).


    When the maximum number of processes is reached, the kernel writes a "pid table
    is full" message in the /var/adm/messages file and to the kernel-logging system,
    similar to the following:


    ```

    Apr 23 11:07:44 martin vmunix: pid table is full

    ```


    You may also see a more informative message, such as the following:

    The fork function failed. Too many processes already exist.


    To resolve this situation, increase maxusers to an appropriate value. Increasing
    maxusers has become progressively easier in successive versions of Tru64 UNIX.
    Prior to V4.0, it was necessary to modify the maxusers in the kernel configuration
    file (/sys/conf/<HOSTNAME>), rebuild the kernel, and reboot the system with the
    new kernel. In version 4, maxusers could be specified in the proc system stanza
    of /etc/sysconfigtab; this value was loaded at boot time and remained in effect
    while the system was up. In version 5, the initial value of maxusers is loaded
    from /etc/sysconfigtab, but it is now possible to raise (but not lower) the value
    while the system is running. As such, it is now possible to resolve a "out of
    processes" problem without rebooting the system.


    # Table 9.1 Default value of maxusers in Tru64 UNIX Version 5


    | Physical memory size | Value of maxusers |

    |---|---|n| Up to 32 MB | 16 |

    | More than 32 MB, less than 256 MB | 128 |

    | At least 256 MB, less than 512 MB | 256 |

    | At least 512 MB, less than 1 GB | 512 |

    | At least 1 GB, less than 2 GB | 1024 |

    | 2 GB or more | 2048 |


    ![](img/3eed431236346b7d400c9572311a8aa8_322_0.png)'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'The following example illustrates increasing maxusers from 32 to 200 on a running
    system:


    ```

    # sysconfig -q proc maxusers

    proc:

    maxusers = 32

    ```


    This shows that the current value is 32.


    ```

    # sysconfig -r proc maxusers=200

    maxusers: reconfigured

    ```


    The sysconfig -r command changes the value. To verify the change:


    ```

    # sysconfig -q proc maxusers

    proc:

    maxusers = 200

    ```


    This confirms that the value currently in use is now 200. But what happens on
    the next reboot? Check the contents of /etc/sysconfigtab:


    ```

    # sysconfigdb -l proc

    proc:

    maxusers = 32

    max_proc_per_user = 10000

    ```


    The sysconfig -r command did not change the value of maxusers in /etc/sysconfigtab,
    so on the next reboot, maxusers will revert to 32. To change the value in /etc/sysconfigtab,
    you can use either dxkerneltuner(8) (a graphical interface) or sysconfigdb(8)
    (a command line utility). To use the latter, it is necessary to create a stanza
    file containing the desired system parameter values. Then use sysconfigdb to merge
    the changes into /etc/sysconfigtab:


    ```

    # cat proc.stanza

    proc:

    maxusers = 200

    # sysconfigdb -m -f proc.stanza

    Warning: duplicate attribute in proc: was maxusers = 32, now

    maxusers = 200

    ```


    To verify that the value was changed successfully:


    ```

    # sysconfigdb -l proc

    proc:

    maxusers = 200

    max_proc_per_user = 10000

    ```'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 9.3 Process Attributes


    Tru64 UNIX stores a variety of attributes about each active process in a kernel
    memory data structure. This structure, proc, is defined in the /usr/include/sys/proc.h
    header file. The following sections describe some of the more interesting process
    attributes:


    +   - Process Identifier (PID)

    - Parent Process Identifier (PPID)

    - Process Group Identifier (PGID)

    - Process Owner''s Real and Effective User Identifier (UID/EUID)

    - Process Owner''s Real and Effective Group Identifier (GID/EGID)

    - Resource Priority

    - Controlling Terminal (if any)

    - Process State


    # 9.3.1 Displaying Process Attributes


    The attributes of active processes can be displayed using the ps (1) (process
    status) utility. Running ps with no command-line arguments prints information
    about processes associated with the controlling terminal:


    ```

    $ ps

    PID TTY S             TIME COMMAND

    21281 ttyp0 S         0:00.08 -ksh (ksh)

    ```


    This output format displays the process ID (PID), the controlling terminal (TTY),
    the state ($), the CPU time used by the process (TIME), and the command that is
    running (COMMAND). The Tru64 UNIX ps utility has a variety of command line switches
    that specify which attributes to display and how to display them. There are two
    distinct command line sets, based on the System V (SYSV) and BSD "flavors" of
    UNIX. The SYSV command-line set is used when the arguments are preceded by a dash
    "-"; otherwise, the arguments are considered to be BSD format. Some examples follow.


    An example of SYSV process display output:


    ```

    # ps -ef


    UID PID PPID C STIME TTY TIME CMD

    ```'
