    the system is slow. Thus, you will also be making them part of the process of
    identifying the problem and finding the solution.


    # 10.4 System Resources


    A Tru64 UNIX system can be a complex environment with many variables that impact
    performance. A system administrator may initially feel overwhelmed when first
    presented with a performance problem. In reality, though, there are only four
    categories of system resources, and all performance issues are related to the
    availability—or lack—of these resources:


    +   - CPU

    - Memory

    - Input/output (I/O)

    - Network


    Once an administrator understands these four resources and how to view their usage,
    it becomes easier to identify which resource is a bottleneck for the timely completion
    of work. After describing the particulars of each resource, we discuss the utilities
    available for characterizing the usage of the resource, and strategies for translating
    this usage information into conclusions on any performance issues.


    # 10.4.1 The CPU Resource


    The CPU capacity of a UNIX system is defined by the quantity, type, and speed
    of its processor. All Tru64 UNIX systems contain one or more Alpha processors.
    In the following discussion, “the CPU” refers to the total CPU'
