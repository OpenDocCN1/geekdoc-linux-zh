  md: '# 12.3.1 binlog


    errors and operational events, such as system startups and shutdowns. Obviously,
    these messages are of great interest to a system administrator, and understanding
    how to examine and interpret the binary log is the key to successfully troubleshooting
    system problems. The binlog facility has two components—the binlog daemon,/usr/sbin/binlog,
    and the binlog configuration files /etc/binlog.conf and /etc/binlog.auth. In addition,
    since the resulting binary error log is, as its name implies, in a binary format,
    there are three utilities provided by Compaq to view and manipulate this log.
    In order of their appearance on the scene they are uerf(8), DECent, and Compaq
    Analyze.


    The binlog daemon is an executable system utility normally started at system startup
    and always running while the system is in multiuser mode. The binlog utility reads
    messages sent to it from the system kernel. These messages can be informational
    only, warnings, or errors that need attention. The messages contain a priority
    value indicating the severity of the message. Messages received by binlog from
    two sources:


    +   - The device special file /dev/kbinlog

    - Other systems across the network, via a socket specified in /etc/services (/etc/binlog.auth
    allows it


    The system kernel itself submits messages to binlog via the device file /dev/kbinlog.
    Additionally, binlog may receive messages from other systems via the network using
    a socket specified in the /etc/services file. The only reason for mentioning these
    two sources for message is to identify places to check when troubleshooting binlog
    problems. For instance, if kernel messages are not being received into the binary
    error log, ensure that the /dev/kbinlog exists:


    ```

    # ls -l /dev/kbinlog

    crw---- - 1 root system 31, 0 Apr 24 22:11 /dev/kbinlog

    ```


    If the file is missing or not correct (for example, is it a character special
    file?), simply re-create the kbinlog file:


    ```

    # cd /dev

    # ./MAKEDEV kbinlog

    ```'
