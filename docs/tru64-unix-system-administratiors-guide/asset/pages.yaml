  md: '# 2.2.3.1 Full Installation


    The Tru64 UNIX full installation is a straightforward installation where you answer
    a few questions up front and then the installation process proceeds unattended
    until the operating system is ready for the post-installation activities.


    The questions that you have to answer in the full installation are categorized
    into four basic areas:


    +   - General (and mandatory) information

    - Software subsets

    - Kernel options

    - File system layout


    After a full installation has been completed, you can make further configuration
    changes; for example, you can add or remove software subsets using setld(8).


    Selecting a full installation provides the freedom to customize every aspect of
    the installation. This includes selecting the boot disk; specifying the location
    of the root, /usr, and, if desired, the /var file system; specifying the location
    of the primary and secondary swap areas. When creating the file systems, the option
    of selecting either the Advanced File System (AdvFS) or the UNIX File System (UFS)
    is presented. In addition, the full installation allows placing all file systems
    on different physical disks. Compaq recommends using the AdvFS file system.


    Equally important, the opportunity is provided to select or any optional Tru64
    UNIX subsets to be installed. The full installation option evaluates and resolves
    any subset dependencies, possibly selecting dependent subsets automatically. The
    ability to choose which kernel options will be built into the resulting Tru64
    UNIX kernel is also provided.


    A full installation provides the system administrator with nearly absolute control
    over the configuration of the resulting Tru64 UNIX system. Given adequate planning,
    the full installation is the recommended method of manually installing a Tru64
    UNIX system. Of course, without the proper knowledge, selecting a full installation
    could result in a system either poorly configured or completely inoperable. The
    most important prerequisite to a full installation is disk planning. This includes
    determining the software subsets you wish to install; calculating the space required
    for the root, /usr, and /var file systems in addition to swap space requirements;
    being prepared'
