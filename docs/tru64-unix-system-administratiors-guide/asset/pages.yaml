    This renames the current binary.errlog to /usr/var/adm/binlog.saved/binary.errlog.saved
    creates a new version of the binary.errlog file. There is a pre-written crontab(1)
    to routinely do this. If you choose to use it, log as "root," run "crontab -e,"
    and remove the comment character "#" from the entry:


    ```

    # 0 2 1 * * -USRL1 ''cat /var/run/binlog.d*''

    ```


    Note that the binary.errlog is a context dependent symbolic link (CDSC) and must
    not be deleted. For more information about CDSLs see the hier(5) page.


    Within the binlog.conf file event code and priority pair(s) must be separated
    from the destination by spaces or tabs. Blank lines and lines beginning with a
    pound sign (#) are considered comments and are ignored. Finally, the /etc/binlog.conf
    file should not be world-writable. The appropriate permissions on this file are
    755, or readable and executable by everyone and writable only by the owner, which
    is bin.


