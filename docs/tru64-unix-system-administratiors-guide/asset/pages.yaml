    # 6.4 Login Controls


    Tru64 UNIX provides a variety of mechanisms to control login access and restrict
    the abilities of user accounts once they are successfully logged in. These login
    and account controls include the following:


    +   - Restricting root logins to the system console

    - Restricting File Transfer Protocol (FTP) access

    - Specifying approved shells or command interpreters

    - Restricting the ability to su(1) to root

    - A restricted shell to provide an environment with limited capabilities


    # 6.4.1 Restricting Root Logins


    The root account on a Tru64 UNIX system is, by its very nature, a shared login
    account. In other words, the account may be used by multiple people. Because the
    root account is all-powerful, access and use of the root account should be restricted
    to only those individuals who are trained, knowledgeable, and, most importantly,
    authorized. The root account should normally be accessed by logging into the system
    using a user''s individual user account, then using the su(1) command to "switch"
    to the root account. If you have more than one person with access to the root
    account, this allows you to track the actions performed by each privileged user.
    By default, Tru64 UNIX restricts direct root logins to the console, or the primary
    display on a system with a graphics console.'
