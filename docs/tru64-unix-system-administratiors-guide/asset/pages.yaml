  md: '# 11.2 Backup Strategy


    system and all files will be closed. However, it is unlikely that many systems
    can afford to be unavailable to users to do regular off-line backups. Additionally,
    the risk of inconsistency in online, or hot backups, is fairly low. If AdvFS or
    LSM are being used, it may also be possible to perform online and consistent backups
    with little or no downtime at all. The AdvFS clone filet and the LSM snapshot
    are examples of facilities available with the operating system to make online
    backups not only possible, but easy. One recommendation is to do backups only
    when it makes sense and is unavailable to users anyway, for instance, after an
    initial system install or major upgrade, and to do online backups for the rest
    of the time to minimize system downtime.


    The primary exception to this may involve systems that run database systems such
    as Oracle and Informatix, since the database files themselves are typically large
    and are not static while the database engine is running and there are no interactive
    users. For this reason, the database vendors provide methods and utilities for
    either doing hot backups directly or check-pointing the database to allow traditional
    backup tools to safely up the data files. In these cases, the additional requirements
    of these applications must be taken into consideration when planning a backup
    strategy. Perhaps it may be that in order to accomplish backups on a system running
    a large database, it may be necessary to use both the database vendor''s backup
    tool and a traditional UNIX backup utility. In such a situation, it will be necessary
    for the system administrator to work closely with the database administrator (DBA)
    to coordinate system backups.


    # 11.2.3 How Will the Backups Be Done?


    The method of actually copying system files to backup media can be thought of
    as the meat of the backup process. Actually, the process of copying data off tape
    is fairly straightforward. There are several utilities provided with the Tru64
    UNIX operating system that provide sufficient functionality for most systems.
    These tools are all command line programs that are each suited for a different
    type of backup and generate backups that are fairly portable, thus allowing them
    to be read by equivalent tools on other vendors'' implementations. The four utilities
    are:


    +   * tar

    * vdump/vrestore

    * dd

    * cpio'
