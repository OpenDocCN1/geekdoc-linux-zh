    # 12.2.4.2 /etc/syslog_evm.conf


    The /etc/syslog_evm.conf file specifies which syslog messages to forward to the
    Event Manager (EVM). The entry format is facility.priority[]. These facilities
    and priorities are roughly the same as for syslog-conf. The optional plus sign
    (+) indicates that if the priority is higher than listed, it is also forwarded,
    otherwise, only the priority specified is forwarded.


    Consider this fragment of an /etc/syslog_evm.conf file:


    ```

    *.emerg

    kern.info+

    nuser.notice

    ```


    All emergency messages are forwarded, kernel messages of informational priority
    higher are forwarded, and only messages generated by users with the priority of
    notice are forwarded.


    # 12.2.4.3 /etc/syslog.auth


    Finally the local syslogd does not accept syslog messages from just any remote
    host. If the remote host is not listed in the /etc/syslog.auth configuration file,
    but the file exists, syslog messages from that host are not processed to the log.
    If the file does not exist, then syslogd will accept messages from any host. It
    should be noted that the /etc/syslog.auth file is not created at installation
    time, so the default behavior is to allow all remote hosts to forward syslog messages.
    The format of this file is simply the list of fully qualified remote host names,
    one line:


    ```

    justice.abc.com

    liberty.xyz.com

    ```


    A local host with these entries would accept syslog messages from both justice.abc.com
    and liberty.xyz.com.


    # 12.2.5 Default syslog.conf


    When the syslog daemon starts, it looks for /etc/syslog.conf by default. An alternate
    configuration file may be specified on the syslogd command line'
