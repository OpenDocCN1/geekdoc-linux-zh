    devices in LSM, then there would be almost no improvement in availability gained
    at the expense of disk space. Another foolish example is a stripe set on a hardware
    RAID controller that can be carved into pieces that can be striped again using
    LSM. This additional stripping would actually slow write performance, rather than
    improving it as was intended. This is like compressing a file twice because to
    get a smaller file the second around. The actual result is usually a larger file.
    The same thing can happen with RAID implementations. Too much of a good thing
