    and are not associated with a terminal or user. These processes are running in
    the “background” in a noninteractive fashion. In contrast, a user is logged into
    the system, interactively editing a file or listing the contents of a directory,
    tasks are running in the “foreground.” Foreground processes are for which a command
    interpreter, or shell, is currently waiting.


    A process is put into the background by running it with the “&” operator, either
    from the shell command line or from a script. Putting a process into the background
    returns the shell prompt immediately and allows the execution of additional commands.
    Long-running commands are good for background processing. For example, the following
    find(1) command lists information on every file on the system and places the output
    into a file for later review:


    ```

    # find / -ls > /tmp/find.out &

    #5051

    ```


    On a large system with thousands of files, this command clearly could take a considerable
    amount of time to finish. By appending the “&” character to the end of the command,
    the shell places the command into the background for processing by the system.
    The process ID of the find command (5051 in this case) is returned by the shell,
    and the prompt returns immediately for additional interactive commands.


    A background process inherits its controlling terminal, in addition to all other
    process parameters, from its parent process. If the table entry for the background
    process is examined, the controlling terminal field (TTY) displays a value:


    ```

