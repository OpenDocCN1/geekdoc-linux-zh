    # 10.4.4 Network Resource


    The network resource is technically an I/O-type resource, but since so many modern
    Tru64 UNIX applications depend on multiple networked systems (e.g., Web servers),
    it is worthwhile to discuss network performance issues separately. In any case,
    good network performance is, by its nature, a hard to pin down. The state of a
    network is dependent on a variety of factors, many of which may be out of a system
    administrator''s control. For example, network performance is affected by:


    +   Applications, both local and remote


    +   Network controllers, both type and capacity (Ethernet, SLIP/PPP, Token Ring,
    FDDI, ATM, etc.)—again, both local and remote


    +   The communications gear interconnecting the affected systems


    +   The capabilities of the local and remote hosts


    Just like the other three performance resources (CPU, memory, memory, and I/O),
    network performance is impacted when the demand for resources exceeds the supply
    of resources. This is usually manifested in network congestion caused by one of
    two issues:'
