    # 2.4.2.5 File System Layout


    Now that you know what you are installing you have to decide where to install
    it and what type of file system to use. The File System Layout dialogue (Figure
    2.8) offers two main options, Default File System Layout and Custom File System
    Layout. Since the default layout does not give much room for customization this
    chapter will only consider the customized layout (Figure 2.9).


    The custom file system layout allows many selections. For example you can place
    each file system on a separate disk, choose multiple file system types, include
    the Logical Storage Manager, and repartition of your disks. Also if you are not
    sure which disk is which, for example you do not know which physical disk is disk1,
    you can select the Identify Disk... button and it will turn the disk activity
    light for that disk.


    Assuming the preinstallation planning has been completed, it is a simple matter
    of selecting the disk and partition and possibly resizing the partition to the
    required size. Note that /var can be specified in /usr or it can have its own
    file system. This is entirely up to the installer.'
