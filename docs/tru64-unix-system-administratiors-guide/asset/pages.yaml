    kern.debug/var/adm/messages

    kern.debug/dev/console

    *.emerg *

    ```


    The first half of a syslog.conf entry specifies the source and severity of messages
    for which syslog should watch. The facility and its severity level must be separated
    by a period (.). For example:


    ```

    kern.debug /var/adm/syslog.dated/kern.log

    ```


    More than one facility can be specified on a line by separating the multiple facilities
    with commas (,):


    ```

    mail,lpr.info /var/adm/syslog.dated/misc_info.log

    ```


    Additionally, more than one facility and severity level can be specified on a
    line by separating them with semicolons (;):


    ```

    auth.info;syslog.debug /var/adm/syslog.dated/syslog.log

    ```


    Finally, an asterisk (*) may be specified in place of a facility, indicating that
    messages generated by all parts of the system are to be logged. All messages of
    the specified severity and greater will be logged:


    ```

    *.emerg  *

    ```


    A Tru64 UNIX–unique facility-severity pair is "msgbuf.err." This facility is crucial
    for recovering any messages that may be pending in the kernel syslog buffer in
    the event of a system crash. When a Tru64 UNIX system recovers from a system crash,
    any such messages are placed in'
