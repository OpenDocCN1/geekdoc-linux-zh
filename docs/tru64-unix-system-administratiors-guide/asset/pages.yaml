    # 8.3.3.6 Device Special File


    For a locally connected serial or parallel printer, there will be a device special
    file located in the /dev directory that the system uses to access the port and
    thus the printer. The parallel port''s device special file is /dev/lpn, and the
    serial ports are /dev/ttynn, where n and nn specify the number of the port. For
    instance, the first (or only) parallel port is /dev/lp0; the first serial port
    is /dev/tty00, and the second serial port is /dev/tty01. This device file is specified
    in the /etc/printcap file by the "lp" option.


    ```

    lp=/dev/lp0

    ```


    # 8.3.3.7 Spool Directory


    The spool directory is where the lpd print daemon temporarily places print jobs
    after submission by the user. In addition, the spool directory is used by the
    print daemon to store several important files used in managing the print queue.
    For instance, lpd keeps a file named .sq in the spool directory that contains
    the sequence number of the next print job. The print daemon also stores a file
    named status that contains the status of the print queue. Because lpd uses the
    spool directory for more than just submitting print jobs, each printer queue should
    have a unique spool directory. Typically, spool directories are located in /usr/spool
    (usually linked to /var/spool) and by default, the first printer added will have
    a spool directory of /usr/spool/lpd, the second printer''s spool directory will
    be /usr/spool/lpd1, and so on. A better name for a spool directory would be the
    printer''s name; for instance, for a printer named "draft", name the spool directory
    /usr/spool/draft. One point to be aware of is, by default, the /usr/spool is contained
    in the /usr file system. If a user submits a large print job, the job will be
    stored in the specified printer''s spool directory, and the potential exists to
    fill the /usr file system if there is limited free space. If your /usr file system
    has limited free space and users frequently print many or large files, you should
    consider either adding space to your file system or possibly locating printer
    spool directories on another file system with sufficient free space. The spool
    directory is specified in the /etc/printcap file by the "sd" option. For example:


    ```

    sd=/usr/spool/lpd

    ```'
