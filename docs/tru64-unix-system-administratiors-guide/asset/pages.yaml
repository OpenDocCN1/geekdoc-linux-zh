    When troubleshooting printing problems, especially local printers, is often difficult
    to isolate the source of a problem. The problem could be with the printer itself,
    the configuration of the device file for the port the printer is connected to,
    or the print service configuration. The first step is to ensure that the printer
    itself is powered on, has sufficient paper, is connected to the appropriate port
    (parallel or serial) of the Tru64 UNIX system with the correct cable, and is online.
    Once these items checked, send some output directly to the printer via the device
    file. For instance, to output a test pattern to a parallel printer, use the following
    command:


    ```

    # lptest > /dev/lp0

    ```


    If this test pattern is successfully printed, you can be reasonably sure that
    the printer is configured and c correctly. The next step is to check the error
    log file, which is specified by the “If” option in the /etc/printcap file entry
    for the printer. If this error file is nonexistent or empty, then it is possible
    the printer was not added correctly. Delete the printer and re-add it using the
    Printer Configuration application.


    # Adding a Remote Printer


