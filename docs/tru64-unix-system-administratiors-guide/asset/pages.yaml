  md: 'Each system has its own directory containing the appropriate firmware updates.
    The /pub/DEC/Alpha/firmware/vX.Y/doc/ directory (where X.Y is the version of the
    Firmware Update CD-ROM) contains the Release Notes for each system, as well as
    the necessary information for updating the firmware from the images. The /pub/DEC/Alpha/firmware/readme/
    directory contains HTML and text files for each system, which describe the methods
    for updating the firmware from files downloaded from this FTP area. This readme
    directory, in conjunction with the Release Notes for a given Alpha system, should
    provide the necessary information for updating a particular system’s firmware.
    Any individual Alpha system firmware releases that occur between Firmware CD-ROM
    releases will be located in the /pub/Digital/Alpha/firmware/interim directory.


    # 2.3.8.1 Creating a Bootable Firmware Update Diskette


    The process for updating the firmware by floppy disk can vary between different
    systems. This example is for the AlphaServer ES40 and will be similar but not
    exactly the same as for other platforms.


    The first step in updating an Alpha system’s firmware via floppy disk is to create
    a bootable floppy disk. Several prerequisites are necessary in order to create
    such a bootable diskette:


    +   - The appropriate firmware update image for the system to be updated

    - A 3.5-inch floppy diskette

    - An Alpha system running Tru64 UNIX with a 3.5-inch floppy diskette drive


    The third item is a requirement for both the system that will be used to actually
    create the bootable floppy disk and for the system whose firmware is to be updated
    via the resulting bootable floppy disk. Obviously, the system that creates the
    bootable floppy disk can be the same system being updated. Certain Compaq Alpha
    systems (e.g., the AlphaServer GS60 and GS140) do not have floppy drives and,
    as such, cannot be updated via the floppy disk. For the same reason, such Alpha
    systems cannot be used to create bootable disks either.


    # 2.3.8.2 Download the Firmware Image


    Compaq provides bootable firmware update images that fit on a single 3.5-inch
    floppy disk. Due to the limited capacity of a floppy disk, however, Compaq prepares
    an individual image for each type of Alpha system, and the appropriate image must
    be downloaded for transfer to a floppy disk.'
