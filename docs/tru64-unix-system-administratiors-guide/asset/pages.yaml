    # 3.5.9.2 AdvFS Filesets


    The second important component of the AdvFS file system is the fileset. A fileset
    is an object that contains files and directories that can be mounted for use,
    just like a UFS file system. A fileset differs from a regular file system in one
    important manner: while a UFS file system resides on a single disk partition,
    an AdvFS fileset is created inside a file domain, which can be one or more volumes.
    This means that a fileset can be larger than a single disk partition and is able
    to span multiple disks. In addition, there can be many filesets within a single
    file domain. The concept of filesets provides much of the flexibility of the AdvFS
    system.


    Tru64 UNIX permits an unlimited number of filesets per system; however, the total
    allowable number of actively mounted filesets is limited to 512 minus the number
    of active AdvFS file domains. When planning fileset layout, keep in mind the design
    philosophy of the Advanced File System encourages multiple filesets per file domain.
    Since filesets are managed independently, regardless of which file domain they
    reside in, there is no penalty for a large number of filesets. The most flexible
    configuration is fewer domains and more filesets. This allows the system administrator
    to worry less about disk space, since it is collected into pools larger than individual
    disks.


    # 3.5.9.3 Creating an AdvFS File Domain


    The first step in setting up an AdvFS file system is to create a file domain using
    the mkfdmn(8) command. The mkfdmn requires two arguments: the block special device
    file and the file name. A file name must be unique, may be up to 33 characters
    in length, and cannot contain white space characters (space, tab, etc.) or certain
    special characters (/ # : *?). An example of creating a new file domain follows:


    ```

    # mkfdmn /dev/disk/dsk3c tools

    ```


    This command creates a new AdvFS file domain named "tools." This file domain is
    composed of the entire dsk3 partition (partition c). As a result of this file
    domain creation, a subdirectory with the same name as the new file domain was
    created in the /etc/fdmnns directory:


    ```

    # ls -l /etc/fdmnns

    total 8

    ```'
