  md: '# 10.4 System Resources


    mode is a higher kernel mode than user mode, and certain events pre-empt the execution
    of user processes, forcing the CPU to stop executing code in favor of other work.
    One event of particular interest to a system administrator is a hardware interrupt.
    If there exists a hardware problem on the system, the CPU will be notified via
    such an interrupt and be required to deal with error. If repeated errors, such
    as disk or memory errors, the CPU will be constantly interrupted and work will
    suffer. If you suspect such a situation, examine the system logs; a perceived
    problem may actually be a hardware problem. It is almost always the case a busy
    CPU is a problem with another resource, rather than CPU. The vmstat(1) and ps(1)
    tools that use Tru64 UNIX, as well as some freeware tools like vmbsc, top, and
    monitor, can help you determine the processes or kernel subsystems using up the
    CPU cycles. It''s a good idea to familiarize yourself with these tools and how
    they work before you actually need them.


    # 10.4.1.1.3 CPU Idle


    Today''s high-speed processors, such as the Alpha processors in Tru64 UNIX systems,
    are faster than ever and continue to get faster still. Memory and disk performance,
    though also always improving, continue to lag behind. If the jobs being run on
    a system require large amounts of memory or disk I/O, you may find the CPU sitting
    around nothing waiting for the I/O subsystems to catch up. Since the CPU is so
    much faster than the I/O on any UNIX system, there will always be some amount
    of CPU wait time. If, however, the CPU is idle most of the time during busy periods,
    there may be a severe I/O bottleneck that needs to be examined. When investigating
    a high CPU idle percentage, always examine the disk load before assuming the entire
    system is simply idle.The vmstat(1) command has a little-known switch, -w, which
    displays the percentage of time the CPU is in an I/O wait condition.


    # 10.4.2 The Memory Resource


    There are several types of memory on a Tru64 UNIX system that differ in purpose,
    speed, capacity, and cost. A system administrator must understand the characteristics
    of each to identify and fix memory resource problems. The three types are:


    +   - Real memory (RAM)

    - Virtual memory

    - Cache memory'
