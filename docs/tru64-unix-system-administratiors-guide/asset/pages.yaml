- img_proc: true
  md: 'One final restriction of renice is that while the superuser may both increase
    and decrease the nice value of processes, a unprivileged user may only increase
    the nice value of processes owned by that user. A user may never decrease the
    nice value, even if the nice value was previously increased by that user. For
    instance, if user jsmith increases the nice value of a job from zero to +10, jsmith
    may not return the nice value to zero; only the system administrator can reduce
    a nice value.


    In addition to the nice value, there are a variety of other factors that influence
    the value of process priorities. These include the amount of CPU time that a process
    has used recently, the amount of memory the process is using, and the number of
    jobs already in the run queue waiting for CPU time.


    Both the process priority value and the nice value can be displayed with the ps
    command by specifying the -l switch. The process priority is displayed in the
    PRI column, while the nice value is displayed in the NI column of the ps output.


    # 9.3.6 Resource Utilization


    As a process executes, the kernel keeps track of the process''s utilization of
    a variety of system resources. These resources include:


    +   - CPU usage

    - Memory utilization

    - Elapsed time

    - Disk I/O and context switches

    - Number of signals received


    These resource utilization statistics are stored in the proc kernel structure
    for each process, are updated dynamically by the kernel for all processes, and
    are available to the system administrator (and regular users well) via the ps
    command. This information is useful, for example, in identifying runaway processes
    by examining CPU utilization, or in determining the memory usage, both physical
    and virtual, of a particular process.


    The most frequently useful process utilization information is the CPU and memory
    statistics. The CPU utilization of a process is monitored by examining two fields,
    %CPU and TIME, in the ps output. Memory utilization is tracked in the %MEM, RSS,
    and VSZ columns. These columns are'
