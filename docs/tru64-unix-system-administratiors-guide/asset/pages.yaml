  md: '# 3


    # Storage


    In this chapter, we explore Tru UNIX64 storage. The goal of this chapter will
    be to provide information to the reader in order to understand enough about devices
    to handle most system administration tasks. Naturally, a complete discussion of
    this topic could take many more pages than are available here. In this chapter,
    we will start with some theory and then move on to very practical concepts.


    # 3.1 Storage Systems Concepts


    To better understand how UNIX file systems are implemented in later discussions,
    it is important to know some of the terminology and concepts of storage. This
    section is an examination of generic concepts of storage and disk drive terminology
    these ideas will make sense in the discussion of file systems.


    # 3.1.1 Disk Drive Terminology


    A single disk is based on a single individual spindle that comprises a storage
    subsystem. Sometimes a RAID device, which can comprise many individuals, is referred
    to as a single disk since it presents itself to UNIX that way. For our purposes
    in this section, we are referring to concepts related to a single disk device;
    later sections will cover the RAID device concepts and terminology.


    A disk drive is a mechanical device. It consists of moving parts such as drives
    and motors that can wear out after a certain period of time. Despite this, these
    devices have become very reliable over time with very high mean time between failures
    (MTBF) associated with them. A MTBF of'
  merge: -1
  pgno: 78
- img_proc: true
  md: '500,000 hours is common these days, which means that in the absence of a

    manufacturing defect, the drive will likely outlive the useful life of the com-

    puter system to which it is attached. Historically, it has been important to

    understand the mechanics of disks since these were used in calculations for

    optimal UNIX file system structure. We will see later that these calculations

    still exist, but are far less relevant than they used to be, due to the advent
    of

    hardware and software RAID products that mask the underlying details. It is

    also important to understand that these devices still do fail. A single block
    or

    ent drive can go bad, but in either case it is possible, using RAID tech-

    niques, to mask the failures from the operating system''s point of view.


    A spindle is a single rotating axle to which the platters contain the data

    on the disk is attached. A single circumference of a disk under a single

    head located a fixed distance from the disk spindle is known as a track. This
    is

    am amount of data that can be read by a single drive head in one rotation of

    t platter. A disk sector is a fixed-sized piece of a track located on disk. A
    disk

    block is a fixed-sized, contiguous area on disk. This is the minimum amount of

    information transferred between the operating system and a disk, thus it is

    the smallest addressable entity on a disk device. For all Compaq-supported

    drives, sectors and blocks are both equal to 512 bytes of data.


    A head is a physical device that reads the data on one side of a platter.

    All heads for a single drive are connected to a device known as an actuator arm

    that moves all the heads together. Since all the heads must move at the same

    time and all the heads can read data in parallel, a logical construct known as
    a

    cylinder has been developed to describe all the tracks located on all the platter

    sides located the same fixed distance from the disk spindle. A seek is the\most
    time-consuming event needed to read and write data to or from a disk

    drive, it is important to reduce the number of seeks. One way this is accom-\ished
    to place related data in the same or adjacent cylinders; thus the

    concept of a cylinder group was developed. A cylinder group simply refers to

    a contiguous set of cylinders to store file system data. Cylinder groups have

    historically been used to improve the performance of UFS file systems.


    # 3.1.2 Controller Technology


    A controller is a term that can have many meanings depending on the context

    in which it is used. In the context of this chapter, we simply use the term as

    another name for an adapter. Thus, a SCSI controller is a simple device that

    verts signals from a computer system''s main I/O bus to the SCSI standard

    protocol. A RAID controller is a device that connects to a standard inter-

    face (e.g., SCSI) and translates the I/Os to a set of devices connected to the'
