- img_proc: true
  md: 'Only users with superuser privileges can remove print jobs submitted by other
    users. For example, to remove request ID 83, issue either of the following commands:


    ```

    # lprm 83

    # cancel 83

    ```


    Removing all print jobs spooled for a particular printer is easily done by specifying
    the printer name as an argument to lprm or cancel. The lprm command has a similar
    syntax to the lpr command, in that you specify the printer with the "-P" flag.
    The cancel command, on the other hand, has no special command line flag. As an
    example, to remove all pending print requests from the printer named "draft",
    use either of the following commands:


    ```

    # lprm -P draft

    # cancel draft

    ```


    Finally, the lprm command has the ability to remove all print requests submitted
    by a particular user. Specifying one or more users on the command line removes
    any requests belonging to those users. This works only for a user with superuser
    authority. For example, the following command removes all queued print jobs submitted
    by the aey:


    ```

    # lprm aey

    ```


    A variation on specifying user accounts to the lprm command is the "-u" flag.
    If a non-root user issues the following command, all requests from the user issuing
    the command are removed:


    ```

    # lprm -

    ```


    However, if the root user issues the same command, the entire print queue is emptied.


