    # 6.8 Access Control Lists


    The traditional UNIX file permission scheme allows the owner of a file to specify
    three types of access (read, write, and execute) for three classes of users: the
    file owner, members of the file''s group, and all other users. This scheme is
    somewhat limited in scope, and there is often need for more granularity in


