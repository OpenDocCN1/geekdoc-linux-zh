    If the system is on a network that requires a gateway to reach other networks,
    ensure that the proper gateway(s) are listed in the routing table. Also make sure
    that there is an entry for the loopback route and any specific static routes that
    should exist. If the system is using dynamic routing (routed or gated), check
    that the routes listed are correct. If the routing table is incomplete or has
    incorrect entries, check that the /etc/routes file contains the correct routes
    or, if using dynamic routing, verify the configuration of the routing daemon in
    use. The following describes the route flags displayed in the netstat output:


    +   - Up, or available.

    - This route is to a gateway

    - This route is to a host

    - This is a static route that was created by the route command


    # 7.9.3 ping


    The next step is to check some network connectivity. The tool for this purpose
    is ping(1). The ping command is used to send one or more ICMP (Internet Control
    Message Protocol) ECHO_REQUEST packets to a specific host, which should respond
    back to the pinging host with a matching ICMP ECHO_RESPONSE packet.


    To use the ping command, specify the host target name or IP address as a command
    line argument. Another common flag is "c" for "count" to specify the number of
    ICMP packets to send before terminating. If the "c" argument is omitted, the ping
    command continuously sends packets until interrupted with Ctrl-C. For example,
    the following sends five ICMP packets to the host jupiter and displays the results
    of each ping, followed by a summary of the entire sequence:


    ```

    # /usr/sbin/ping -c 5 jupiter

    PING jupiter (192.168.171.80): 56 data bytes

    64 bytes from 192.168.171.80: icmp_seq=0 ttl=128 time=2 ms

    ```'
