    # 3.2 Redundant Array of Independent Disks


    In the 1980''s, when disk drives began to come down in price and improve in reliability,
    a group of three University of California at Berkeley professors realized that
    if you took a bunch of off-the-shelf disks, you could make them perform as well
    as or better than a Single Large Expensive Disk (SLED)'
