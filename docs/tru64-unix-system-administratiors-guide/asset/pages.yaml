    # 4.4.2 Dynamic Kernel Configuration


    More than not, today''s Tru64 UNIX can be reconfigured dynamically (i.e., no kernel
    build required). But dynamic can mean different things depending on your point
    of view. A subsystem may be dynamically loadable may or not be dynamically unloadable,
    for example. Subsystem attributes may be dynamically configured when the system
    boots but not configurable when the system is running; other subsystem attributes
    can be reconfigured while the system is running, but in only one direction (e.g.,
    proc:maxusers can be raised, but not lowered). And finally, if you''re really
    lucky, a growing number of subsystem attributes are fully configurable when the
    system is running.


    # 4.4.2.1 Automatically Load and Configure a Dynamic Subsystem


    If you want to automatically load and configure a dynamic subsystem at boot time,
    use the autosysconfig command to add the subsystem to its list of subsystems to
    load. For more information see the autosysconfig(8) reference page.


    # 4.4.2.2 Manually Load and Configure a Dynamic Subsystem


    If you have a dynamic subsystem that you would rather load and configure on system
    startup, you can use the sysysconfig command to load and configure it on the fly.'
