    Account Manager, all allow for creating user account home directories in the /usr/users
    directory. Depending on the number of user accounts a system will support, this
    may be an unwise choice. A better alternative is to create a separate file system
    after the installation is complete to contain user account home directories. Placing
    user account home directories in a file system other'
