    # 6.6.1 Enabling Enhanced Security


    The first step in successfully implementing Enhanced security is deciding on the
    global defaults for the password and login controls. Some of these can be configured
    during the process of enabling Enhanced security (Section 6.6.1.3), while others
    can be customized later by editing the system authentication database (see Section
    6.6.3).


