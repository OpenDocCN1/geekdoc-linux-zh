  pgno: 79
- img_proc: true
  md: '# 3.1 Storage Systems Concepts


    back end of the device. Thus, a RAID controller is much more sophisticated and
    complex than a simple SCSI adapter. A RAID controller has a CPU and memory associated
    with it and runs a specialized program, called the firmware, which determines
    how the device can be configured and how it will react to various events.


    Today, a vast majority of storage attached to UNIX systems is connected using
    the Small Computer System Interface (SCSI) bus standard. Later we will be covering
    SCSI in greater depth, since the standard has evolved over time and there are
    many options to support the different speeds and signal types that the standards
    allow. Even with these changes, the SCSI standard has simplified disk interconnects
    considerably from the old days of proprietary disk protocols.


    One other rapidly evolving and popular storage mechanism is Fibrechannel or Storage
    Area Network (SAN) technology. Fibrechannel uses optical fiber interconnects between
    the systems and devices, rather than copper-based cables, in the same way that
    hosts are interconnected in a local area network. These fiber interconnects are
    simply a different transport used to ship the SCSI commands and data between the
    systems and storage. Thus, Fibrechannel does not represent a new protocol from
    SCSI, but rather is a way to transport the bits back and forth. There are several
    good books devoted to Fibrechannel and cannot hope to cover it fully here, so
    we refer the reader to one of those for further reading on this subject. As a
    systems administrator for a large Tru64 UNIX system, you will undoubtedly need
    to understand how this new technology works before implementing it at your site.
    At the time of this writing, the technology is still evolving; therefore great
    skill is still required to install and manage these SANs properly.


    # 3.1.3 SCSI Concepts


    SCSI (pronounced "scuzzy") is not just a single standard but is actually a suite
    of standards. In this section, we explain the different SCSI terminology and develop
    concepts needed to discuss the interaction between SCSI devices and the host.


    SCSI (or what is now often referred to as SCSI-1) was the original SCSI specification
    proposed by the American National Standards Institute (ANSI). The work on the
    specification began in 1982 and was originally designed for attaching storage
    devices to workstations (ANSI X3.131-1986). It supported a single-ended, narrow
    bus structure with maximum support for only eight'
