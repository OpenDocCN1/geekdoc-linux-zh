  md: 'request, the lpd daemon determines if remote access is permitted by searching
    the /etc/hosts.lpd and the /etc/hosts.equiv files for the name of the system making
    the print request. If the host name of the requesting system is contained in either
    of these system files, the remote print request is accepted. Otherwise, the request
    is rejected and the following message is dis-played querying the status of the
    queue:


    ```

    # lpq -P draft

    saturn:

    Warning: saturn.company.com does not have access to remote

    printer draft

    ```


    The /etc/hosts.lpd and /etc/hosts.equiv files have similar formats. Each line
    is a single entry of the form:


    +   [-] host name.


    To allow a user from another system to print on a local system, for-ign host name
    must be an entry in one of the files. Preceding a host name with a dash (-) explicitly
    denies print access from that system. The lpd daemon searches the first /etc/hosts.equiv
    file, then the /etc/hosts.lpd file when determining print access control, the
    definitions in /etc/hosts.equiv take precedence over /etc/hosts.lpd. However,
    since the /etc/hosts.equiv file is also used to specify trusted host relationships
    for remote command execution, /etc/hosts.equiv should not be used to define remote
    print access. Use /etc/hosts.lpd only to specify this print access. This will
    avoid confusion and inadvertent trusted host access.


    As an example, the following /etc/hosts.lpd file allows lpd print access to the
    systems saturn and pluto, and explicitly denies print access to the system neptune.
    The absence of an entry for neptune would also indicate denial of print access
    to the lpd daemon. Note that lines beginning with a pound sign character (#) and
    blank lines are ignored.


    ```

    #

    # /etc/hosts.lpd

    #

    saturn

    -neptune

    pluto

    ```


