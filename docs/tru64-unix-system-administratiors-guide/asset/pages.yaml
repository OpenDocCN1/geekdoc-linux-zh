  pgno: 81
- img_proc: true
  md: '# 3.2 Redundant Array of Independent Disks


    that time, for performance and reliability, you still needed to spend lots of
    money for proprietary drives to attach to your mainframes and minicomputers. The
    introduction of smaller, standard drives, combined on a large scale, began emulate
    the bigger drives in what became known as a Redundant Array of Independent Disks
    (RAID). These devices have all but replaced the big, proprietary drives for high-end
    systems. An entire industry has been built around RAID technology, accounting
    for billions of dollars in sales each year. All indications are that requirements
    for storage will continue to grow at a rapid rate and this industry will continue
    to prosper.


    # 3.2.1 RAID Terminology


    Before we move further into our discussion of RAID, let''s define a few terms
    that we will need later on. A RAID device is any highly intelligent controller
    that implements some or parts of the RAID specifications. One example of such
    a device connected to a Tru64 UNIX system is Compaq''s StorageWorks HSZ family
    of storage controllers. These controllers connect to your Alpha system via a SCSI
    interface and offer features such as dual-redundancy, spare device management,
    multi-pathing, write-back cache with battery backup, and intelligent manageability.
    There are other popular non-Compa brands that have been used successfully with
    Tru64 UNIX.


    Fundamental to our discussion of RAID is striping, which is a method of concatenating
    multiple drives into one logical storage unit. Striping involves partitioning
    each drive''s storage space into "stripes" that may be as small as one disk sector
    (512 bytes) or as large as several megabytes. These stripes are then interleaved
    in a round-robin fashion, so that the combined space is composed of alternating
    stripes from each drive. In effect, the storage space of the drives is shuffled
    like a deck of cards. The type of application environment you have will determine
    whether large or small stripes should be used. A typical stripe size is 128 or
    256 blocks (64 or 128 kilobytes). In HS terminology, a stripe is also known as
    a "chunk"; for example, the CHUNKSIZE keyword is used to alter the default stripe
    size.


    Parity is a mechanism by which data can be verified when written to a device.
    When the number of all of the "on" bits is counted, an additional bit is added
    to the existing bits to make the resulting sum of all bits even or odd. Thus,
    there are two types of parity: even and odd. Odd parity means the sum of the bits,
    including the parity bit, is an odd number, while even parity means the sum is
    an even number.'
  merge: -1
