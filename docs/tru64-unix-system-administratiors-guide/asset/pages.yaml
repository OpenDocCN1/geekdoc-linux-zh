  md: 'into three processor sets, dedicating one processor set to the database application,
    and one to the developers, and one to the e-mail users.


    Processes can be bound using either system calls within an application or command-line
    utilities; the latter method is of the most interest to system administrators.
    There are two command-line utilities for binding processes: runon(1) and pset_assign_pid(1).
    The runon command runs a new process on either a particular CPU or a processor
    set, while pset_assign_pid assigns an already running process to a specified processor
    set. Both utilities have an option to bind a process exclusively; that is, *only*
    the specified process is allowed to use that CPU or processor set.


    For example, consider the configuration created in Section 9.7.2:


    ```

    # pset_info

    number of processor sets on system = 2

    pset_id # cpus # pids # threads load_av created

