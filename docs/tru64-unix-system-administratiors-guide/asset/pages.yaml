    # 11.2.4 Selection of Backup Device and Media


    This section endeavors to assist the Tru64 UNIX administrator with choosing the
    type of backup device and media that suits his or her environment best. At many
    sites, there is simply choice given to the system administrator, and if that''s
    the case, this section can be skipped. For others, it is important to understand
    the advantages and disadvantages of each in order to make an informed backup decision.
    In general, there are two ways to go with selecting backup device: disk or tape.
    We discuss each option in the following two sections.


    # 11.2.4.1 Disk Backups


    Traditionally, choosing a backup device and media has meant choosing some sort
    of tape device, however more sites are choosing to perform on-line backups. This
    sort of disk-to-disk backup is supported by many intelligent disk controllers
    and software-based mechanisms today and their primary advantage is they can be
    performed very quickly. This section is devoted to providing a framework for the
    administrator to either select or rule-out this option. There are many choices
    that could be made with disk backups so it is important you need to answer are
    your requirements before you begin. The kinds of questions you need to answer
    are the following:


    +   * What level of data inconsistency can be tolerated?

    * Are you using file systems or raw?

    * Are your file systems AdvFS or UFS?

    * What hardware or software do you have available or can be purchased?

    * Can you do your backups while the data are off-line or do you need data to be
    on-line all the time?

    * Is speed more important than money?


    So, what do we mean when we say the word "consistency?" Well, as with other things,
    this term may have different meanings depending on whom we talk to. We define
    three types of "consistency" we will be referring to-through our discussion in
    this section and it is important for you to be aware of these when you are deciding
    which type of disk-to-disk backup is best for your site.'
  merge: -1
  pgno: 416
- img_proc: true
  md: '+   Data consistency—This type of consistency involves the complete “snapshot”
    of a file system at a specific moment in time. Since UNIX file systems maintain
    some of their metadata and buffers in memory, it is necessary to flush all of
    this out to storage before making the backup. This type of consistency maintains
    that the data and metadata are always completely in sync with one another for
    the entire time the backup progresses. The easiest way to do this would be to
    unmount the file system beforehand. However, this may not be desirable since the
    data and applications cannot be available while the file system in not mounted.
    This is the kind of backup you can get using on-line methods available as AdvVFS
    cloning.


    +   Metadata consistency—This type of consistency, also known as crash consistency,
    means the metadata for the file system can be recovered back to a state where
    the file system can be mounted and data can be accessed. This would be the same
    thing as if the system went unexpectedly due to a system crash or power off while
    it was doing active work. With file systems in Tru64 UNIX, metadata consistency
    can be maintained so that the file system can be mounted. If you are using UFS,
    the fsck(8) tool can be used for file system recovery. With the advantage of simplicity,
    it may also take a long period of time to recover. With AdvFS, on the other hand,
    recovery is much faster because of its transaction log-based nature. Be aware,
    however, that once the metadata is made consistent in either case, there is no
    assurance that the application files will also be data consistent. if file systems
    are not being used, then the metadata recovery is the responsibility of the application.


    +   Application consistency—This type is similar to data consistent, but in this
    case the application must also force its buffers to flush and be consistent while
    making the backup. With application consistency, the guarantee is that the application
    will see the data from the backup exactly as the point at which the backup was
    taken. The application must have the ability to flush its own buffers and place
    itself into a standby mode for the time that the backup will be in-progress. If
    this feature is not available in the application you intend to use, shutting it
    down gracefully may be the only alternative. Either way, there is no mechanism
    built into Tru64 UNIX to insure this level of application consistency. If your
    application is smart enough to deal with this level of inconsistency, you do not
    need to shut it down or place it in standby mode.'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# 11.2 Backup Strategy


    # 403


    One site may have a different understanding and requirement for data consistency
    than another one. For a growing number of critical systems, a backup option is
    really only relevant if it allows the administrator to perform the backups in
    a completely consistent manner. Unlike the other hand, another person may be able
    to get by with a metadata consistent backup. Which one choose depends on whether
    your application can recover from data inconsistency in the same way that UFS
    or AdvFS deal with the system-level equivalent. We suspect that most people will
    want complete consistency, but will probably settle for metadata consistency if
    they cannot take their application off-line. Therefore, for our purposes, a completely
    consistent backup is one that maintains all three types of consistency discussed
    above. An inconsistent backup is one that fails an application consistency test
    and therefore is unusable because the application cannot continue once the data
    has been restored from it.


    Another choice you must make when deciding upon the disk-to-disk option is what
    technology you wish to use and is available to you for making the data consistent
    prior to making the backup itself. One of the following is a necessary technology
    Tru64 UNIX to make the disk-to-disk backup in at least a metadata consistent manager:


    +   - LSM snapshot—This is a feature of the LSM subsystem and of course requires
    LSM to be in before you can take advantage of it. The LSM snapshot makes another
    mirrored copy of the data on an LSM plex and then allows the mirrored copy to
    “snap off” and make its own logical volume. The new logical volume is an exact
    copy of the original volume at the time of the “snap off.” This type of copying
    technology will create a metadata consistent backup if used the file system is
    on-line, or data consistent if taken the file system is off-line. The LSM utilities
    that allow this operation are an added-cost option to the base Tru64 UNIX license.


    +   - AdvFS clone fileset—This is a feature of the Advanced File System Advanced
    Utilities and will make at least a data consistent backup. A clone fileset of
    an existing fileset will be made at some moment in time. However there is no “snap
    off” capability like in the LSM snapshot case. Therefore, the disk-to-disk backup
    must be made manually by the system administrator’stror using vdump/vstore or
    similar tools. This could easily be automated using scripts. As with the LSM utilities,
    the AdvFS Utilities that allow this operation are also an added-cost option to
    the base Tru64 UNIX license.


    Chapter 11'
  merge: -1
  pgno: 418
- img_proc: true
  md: '+   Hardware-based snapshot. This is the most expensive, fastest method of
    making a metadata consistent backup. A hardware-based, intelligent controller
    (such as an HSG80) can “snap-off” another unit very quickly similar to the LSM
    snapshot capability. The difference is the hardware solution can do the job more
    quickly and with less overhead on the Tru64 UNIX operating system. The advantage
    of this approach is high speed, but it also costs money to invest in the controllers.
    If you already have this type of controller then it is possible you can get this
    functionality with no additional costs. However, check with the hardware vendor
    to find out if there are no additional licensing involved in using the snapshot
    tools.


    Even if someone had one or more of these technologies available, it would only
    make sense to use this under a certain set of circumstances. For example, if the
    cost of a completely duplicated disk array was a factor, this would not be a viable
    option and the lower cost of tape backups would be more appropriate. The following
    lists some of the necessary prerequisites to consider performing disk backups:


    +   Intelligent controller, LSM snapshots or AdvFS clone filesets.


    +   Double available disk space.


    +   Continuous availability of data.


    The disk backup has the following advantages over traditional tape-based backups:


    +   Very fast—The disk-to-disk copy operations of this option tends to be much
    faster than a traditional disk-to-tape backup strategy.


    +   Little or no loss of data availability—Generally a disk-to-disk backup can
    be performed while the data is on-line and active. Whether the file system can
    remain consistent during the snapshot operation depends on the type of on-line
    backup used and the configuration of the file systems (today). Clone fileset backups
    can be performed in all cases where LSM snapshot and hardware-based backups will
    only remain consistent if a single AdvFS volume is used. As of this writing, a
    data consistent on-line, multi-volume AdvFS domain backup is not supported other
    than with filesets. If a single AdvFS volume were used and either LSM or hardware-based
    snapshotting were employed, then a metadata consistency could be obtained.


    +   Simple recovery—The recovery in the case of a disk failure would be to simply
    make the system use the backup disks in place of the failed disks. No recovery
    from backup step is needed in the tape restore strategy.'
  merge: -1
  pgno: 419
- img_proc: true
  md: 'The primary disadvantage of the disk-to-disk backup option is the high cost
    associated with having duplicated storage. However, from a pure performance perspective,
    it is best to use an intelligent controller (such as an HSZ, HSG or HSV) and make
    your copies at the hardware level. In addition, this offloads the disk-to-disk
    copies from the operating system to the controller, thus freeing up system resources
    for other tasks. Performing the snapshots in hardware will greatly improve overall
    performance and avoid wasting resources of the computer systems but it will put
    a limit on the configuration of AdvFS file systems.


    More information on how to safely perform hardware-assisted disk-to-disk backups
    is available at the Compaq best practices web page:


    ```

    http://www.tru64unix.compaq.com/docs/best_practices/BP_SNAPSHOT/TITLE.HTM

    ```


    Also, there are references in Appendix B that discuss the AdvFS cloning and LSM
    snapshotting features and how best to apply those at your site.


    # 11.2.4.2 Tape Backups


    Selecting backup media to which to trust your regular system backups is often
    a decision already made for you. Whichever model tape drive shifts with your system
    is often your only choice. If, however, you are lucky enough to be involved in
    the selection of a backup device, there are several issues to consider:


    +   * The capacity of a tape drive

    * The speed of a tape drive

    * Media availability, cost, and size


    The first and foremost issue is the capacity of the tape drive as compared with
    the amount of data to be regularly backed up. It makes no sense to pursue a single,
    small 4-gigabyte tape drive when the system has hundreds of gigabytes of disk
    storage. Conversely, a 280-gigabyte multitape jukebox is probably overkill for
    a desktop workstation with two gigabytes of disk space. There is no quick and
    easy formula for determining what is a good ratio of tape capacity to disk capacity,
    but a rule of thumb we recommend is to have enough tape capacity to back up the
    entire system unattended. This requirement for an unattended backup can be accomplished
    either by a single tape with sufficient capacity or by a multitape changer with
    the backup spanning multiple tapes. Note that this does not mean having equal
    amounts of tape space and disk space, only being able to copy all the data to
    tape.'
  merge: -1
  pgno: 420
- img_proc: true
  md: 'Another consideration in selecting a tape is tape speed. You must be able to
    complete the backup procedure in the amount of time allotted. This is not as important
    an issue as paper it has been in the past, now that backup technology has progressed
    beyond paper tape and 9-track tapes. Most modern tape technology is fairly quick,
    supporting high-speed interfaces and cache buffers to increase tape throughput.
    If a system is constrained by either tape capacity or speed, an option to consider
    is multiple tape drives. If drive speed is the concern, connecting multiple tape
    drives to the system on individual interfaces (e.g., SCSI channels) is recommended.


    The final issue in selecting a backup device concerns the media. Choose a tape
    drive whose media is convenient. The convenience factors include cost, availability,
    and ease of storage. If all the existing systems in an organization are using
    4mm DAT, it may be wise to consider a 4-mm DAT for a new system, rather then selecting
    an 8mm tape drive. Choosing a common format could considerably reduce the administrative
    hassles presented by a "foreign" media format. This media factor is likely to
    have the least weight in your decision, but it should be considered.


    The most common tape drive on a Compaq system is the 4mm DAT drive (TLZ10), which
    has a capacity of 12 GB uncompressed (up to 24 GB compressed). This tape drive
    is usually shipped as the default drive on Compaq systems. The advantages of this
    drive are a good size capacity, backup speed, and widely available and inexpensive
    media. The next step in Compaq''s tape lineup is DLT, or Digital Linear Tape.
    Compaq''s SDLT 110/220 tape drive provides 110 GB uncompressed (up to 220-gigabytes
    compressed). DLT''s biggest advantages are high capacity and very high data transfer
    rate. Both the media and physical size for DLT are greater than for 4mm DAT. Though
    DLT and 4mm DAT are currently Compaq''s backup architectures, Compaq''s backup
    technology includes other tape formats as quarter-inch cartridge (QIC) and optical
    drives.


    # 11.2.5 Backup and Restore Documentation


    The final requirement of a sound backup strategy is sufficient documentation of
    the backup and restore process. Ideally this should include written procedures
    and examples of how the backups were done, where the backup media is stored, and
    how to recover from these backups in the event of a file or system loss. This
    documentation should be printed out and located in a place where any staff member
    who would be called upon to perform a restore has access to it. These procedures
    can certainly be online, but having hard copies of the'
  merge: -1
  pgno: 421
- img_proc: true
  md: 'instructions to restore a file or system may prove invaluable in a crisis.
    It might even be helpful to the plan’s author, because in a crisis anyone could
    miss a crucial step or two and waste time or inadvertently damage the file system
    or backup tapes. In a crisis, one simply cannot afford to leave any-thing to chance.


    At a minimum, this documentation should clearly state the schedule of the backups,
    the level of the backups if incremental dumps are being done, the location of
    the backup media (both the backup rotation tapes and blank media for any ad hoc
    backups) the exact commands that generated the backups, and the restoration procedures
    and commands. The restore instructions should provide procedures for restoring
    individual files or directories for recovering the entire system, both by the
    operating system and the user applications and data. It is in the system administrator’s
    best interest to create this backup and restore documentation so that even a user
    with limited system administration skills can learn to restore files.


    Another requirement of backup and restore documentation is that the information
    must be updated if and when the backup or restore process changes. For instance,
    if new disks are installed on a system and the backup process is amended to back
    up newly created file systems, it is imperative that the backup and restore documentation
    be updated to reflect this change. Other changes that should be incorporated into
    this documentation could include new backup hardware or software, changes in the
    backup strategy, and staffing reorganizations.


    # II.2.6 Restore Dress Rehearsal


    Developing and implementing a backup strategy is well, and However, if there is
    a flaw in the backup procedure or the recovery documentation is incorrect or there
    is a hardware issue preventing valid backups, the wrong time to find out is in
    a recovery situation. For this reason, it is imperative that the backup and restore
    procedure be tested as often as feasible. This rehearsal is simply to validate
    the backups themselves and to ensure that the restore instructions in the backup
    and restore documentation are accurate.


    The least that should be done is to restore several files or directories from
    a recent system backup using the documented recovery procedures. For instance,
    assuming a recent vdump of the root file system were inserted into the primary
    tape drive, the following commands would recover a fairly large file (/vmunix)
    and compare the restored file with the original file:'
  merge: -1
  pgno: 422
- img_proc: true
  md: '```

    # vrestore -x -v -f /dev/tape/tape0_d0 -D /tmp .vmunix


    vstore: Date of the vdump save-set: Wed Oct 1 02:45:44 2000

    r /tmp/.vmunix, 11323768

    # cksum /vmunix /tmp/vmunix

    1731969811 11323768 /vmunix

    1731969811 11323768 /tmp/vmunix

    ```


    The cksum(1)command displays the checksum and byte count for the files specified
    on the command line. If the checksum value and the byte count are the same for
    the two files, you can assume that the file was successfully backed up.


    The second phase of rehearsal is to shut down a system and recover it from a regular
    system backup. Ideally, a second test system would be the best place to test a
    full system recovery. However, it may not be practical to simulate a system failure
    and completely restore a system from tape. One possible reason for this restriction
    is that there is only one system and you cannot afford the system to be down.
    If this is the case, an alternative strategy could be to test restoring user file
    systems to a spare disk partition. If this is successful, the restore strategy
    may have to:


    +   1. Rebuild the system from the Tru64 UNIX Installation Media.

    2. Recreate the necessary user file systems.

    3. Restore the user applications and data from backups.


    Obviously such a strategy would be more time consuming as the system would have
    to be reinstalled from scratch, and some amount of system configuration would
    be necessary before the system could be considered successfully restored. This
    configuration activity would include recreating user accounts, reconfiguring the
    network, and possibly loading Compaq layered products. The best recovery solution
    would be to restore the entire system from the last backup.


    # 11.3 Optional Backup Strategy Components


    Once a backup strategy is developed and the necessary components detailed in the
    previous section are in place, several other items may be considered that will
    further enhance such a backup strategy. These optional components are typically
    not necessary for most organizations, but completing some or all will greatly
    enhance your ability to withstand even the most severe data or system loss.'
  merge: -1
  pgno: 423
- img_proc: true
  md: '# II.3.1 Off-site Storage of Backups


    The purpose of regular system backups is to be able to recover from a system or
    user error that causes a file loss. At a minimum, such a loss could be the accidental
    deletion of a file or directory by a user, or the failure of a single hardware
    component that causes the loss of many files, or even the entire operating system,
    such as a disk crash. Given adequate backups, these losses can be quickly recovered
    from tape. The next severe system problem is a catastrophic failure that causes
    the loss of some or all of the computer system in its entirety and being forced
    to restore the system from backups. A system failure of this scope would require
    a full system recovery; if the backup strategy is sound, such a recovery is straightforward
    in approach.


    One aspect of a backup strategy that has not been covered is the storage of the
    media for regular system backups. All too frequently, the rotation of nightly
    backup tapes are stored in the same room as the computer cabinet itself. Even
    if the tapes are not kept in the computer room, they are still stored in the same
    building as the computer, which is much safer, but still not ideal. Both of the
    previously described types of data loss are recoverable from backup tapes that
    are stored on-site. However, there is a final failure, a loss of facility or building,
    that would destroy the computer and the backup tapes. Such a loss could include
    a fire, flood, or other natural disaster, not to mention manmade catastrophes.
    An important piece of good backup strategy is the storage of backups at an off-site
    location. A practice is not to send every backup off-site, only a representative
    snapshot that would allow recovery to a known state, perhaps a monthly full backup.
    Ideally, an acceptable off-site location would be secure, geographically distant
    enough not to be vulnerable to natural disasters from the location of the computer,
    and close enough to facilitate a relatively quick (within 24 hours) recovery of
    the tapes. There are companies that provide such services, including pickup and
    delivery, secure and climate-controlled vaults, and even tape-labeling services.
    Of course, such services cost money and may not be feasible. If, however, a computer
    system supports mission-critical applications and the organization must ensure
    that the computer and data can be recovered from any failure, no off-site storage
    of backups is a must.


    # II.3.2 Disaster Recovery Plan


    In addition to off-site storage of backups, the development of a disaster recovery
    plan (DRP) can reduce the risk that a catastrophic failure could prevent'
  merge: -1
  pgno: 424
- img_proc: true
  md: 'the restoration of a system. A DRP complements the backup and recovery document
    discussed earlier in this chapter. Where the backup and recovery document details
    how a backup was done and how to recover from that backup, a DRP has a larger
    scope. A DRP should outline the process to follow in the event of the total loss
    of the computer system, the computer room, or the entire facility. Some of the
    issues to explore when developing what system functionality is critical to the
    continued operation of the organization, where replacement systems and facilities
    be obtained, even on a temporary basis, and which personnel will need to be involved
    in carrying out a DRP in the unlikely event of a disaster.


    Developing a DRP should be a joint effort between the operations staff such as
    the system administrator, the user community, and possibly facilities staff. In
    addition, a DRP, once created, must be revisited periodically to ensure that the
    information contained within is still accurate. Certain data tends to be volatile—for
    example, contact information for company personnel, such as telephone numbers,
    pager numbers, and responsibilities. Other fundamentals that may change over time
    are the assumptions made during development of the DRS, such as the minimum time
    to recovery, the order of system recovery, and the strategy for system facility
    restoration.


    # 11.4 Summary


    System backups are a critical responsibility for a UNIX system administrator.
    Developing and implementing a robust backup strategy is a requirement for being
    able to quickly and accurately restore data that will eventually be lost. The
    ability to restore an accidentally deleted file will demonstrate to your users
    that the system is in good hands.


    Compa provides several different utilities for backing up a Tru64 UNIX system.
    Of these, the vdump/vstore pair is the most versatile. Whichever backup tool you
    select, whether one provided with the base Tru64 UNIX product, the NetworkWare
    Save and Restore tool, or a third-party backup application, spend sufficient time
    to understand its abilities and options. Do not wait until a crisis to discover
    that the backups you have been dutifully making every night are invalid. Test
    your backup procedure frequently by doing test restores. Finally, the backups
    process should not require massive amounts of resources to manage if sufficient
    system administration time and energy have been devoted to developing the process
    up front.'
  merge: -1
  pgno: 425
- img_proc: true
  md: '# System Logging and Troubleshooting


    # 12.1 Introduction


    When something goes wrong and a Tru64 UNIX system crashes, the first person to
    be called is the system administrator. Unfortunately, these events seem to happen
    at the most inpportune time. Whether it is in the middle of an important demonstration,
    crunch time at month''s end, or simply in the middle of the night, it is up to
    you to quickly diagnose the problem, identify a solution, and get the system back
    up. This skill is probably best defined as problem management. Problem management
    is a broad topic that includes dealing with hardware and software errors, handling
    system crashes, and administering the system logging facility. Tru64 UNIX is a
    complex system, and often a system administrator''s only recourse when confronted
    with a system problem is to provide as much diagnostic information as possible
    to your support organization, whether that be Compaq''s Customer Support Center
    or another organization. This information can include system crash dumps and hardware,
    software, and system log entries. This chapter will provide some insight into
    how to interpret the output of these problem-reporting facilities as well as how
    to correlate system problems with their resulting crash output or error-log events.
    Then, as your knowledge and experience increase, these same Tru64 UNIX problem
    management facilities allow for a more proactive problem resolution.


    At your disposal in this effort are several Tru64 UNIX facilities to assist you
    in this problem management effort. These are:


    +   - The system logging facility


    +   - The binary error logging facility


    +   - The event management logging facility'
  merge: -1
  pgno: 426
- img_proc: true
  md: '412


    12.2 The System Log


    +   - The crash dump process


    These facilities are simply mechanisms used by the system to capture information.
    Sometimes these are errors, sometimes warnings, and sometimes times just informational.
    The following sections will cover the issues of administering these tools. This
    includes determining what information is to be collected by these facilities,
    ensuring there are adequate system resources to capture the desired information,
    configuring the tools appropriately, and naming strategies to follow when examining
    the collected information either before or after a system problem arises. In addition,
    the utilities provided by Compaq for examining this information will be detailed.
    Understanding the information these facilities can provide is an important factor
    in being able to quickly diagnose and recover from system problems.


    # 12.2 The System Log


    Modern UNIX implementations such as Tru64 UNIX provides a centralized facility
    for collecting and recording messages. This facility, commonly referred to as
    the "syslog," is the primary logging mechanism used by many system processes and
    utilities. In addition, due to syslog''s architecture, non-system applications,
    including user and administrative scripts, are able to send messages to syslog
    for disposition. Because syslog is typically the destination for error messages
    from system processes, understanding how syslog works and how to interpret and
    manage the entries in syslog''s configuration file is important to execute system
    administration. The syslog facility has two components: the syslog daemon, /usr/sbin/syslogd,
    and the syslog configuration files. The primary configuration file is /etc/syslog.conf,
    and the file that identifies remote hosts are allowed this one, /etc/syslog.auth.
    In Tru64 UNIX V5 and later, the /etc/syslog_evm.conf file is also read by syslog
    and identifies what to forward to the Event Manager.


    # 12.2.1 syslog


    The syslog daemon is an executable system utility normally started at run level
    3 during system startup and is always running while the system is in multiuser
    mode. The syslogd daemon reads messages sent to it from system processes, the
    kernel itself, and user applications. These messages can be informational only,
    warnings, or errors that need attention. The messages themselves are single lines,
    optionally containing a priority value indicating the severity of the message.
    These priorities are defined in the /usr/include/sys/syslog_pri.h header file.
    Messages are received by syslog from three sources:'
  merge: -1
  pgno: 427
- img_proc: true
  md: '# 2.2 The System Log


    +   - The device special file /dev/log, the domain socket

    - The device special file /dev/klog, which reads kernel messages

    - Other systems across the network, via a socket specified in /etc/services


    Most system processes and utilities, and optionally user applications, submit
    messages to syslog using the syslog(3) function call or the logger(1) command.
    These messages are relayed to syslog via the device file /dev/log. Kernel messages
    are similarly sent to syslog through the device special file /dev/klog. Finally,
    syslog may receive messages from other systems via the network socket specified
    in the /etc/services file, provided that the /etc/syslog.auth file allows it—see
    Section 12.2.4.3 for more information about /etc/syslog.auth. The point in mentioning
    these syslog message sources is to identify these files when troubleshooting syslog
    problems. For, if kernel messages are not being received and logged by syslog,
    ensure that the /dev/klog file exists:


    ```

    # ls -l /dev/klog

    crw---- 1 root system 3, 0 Apr 24 22:00 /dev/klog

    ```


    If the file is missing or not correct (e.g., is it a character special file?),
    simply re-create the klog file:


    ```

    # cd /dev

    # ./MAKEDEV klog

    ```


    Similarly, if syslog messages are not being received from other systems via the
    network, as part of your troubleshooting effort, ensure that the /etc/syslog file
    exists and contains the following entry:


    ```

    syslog 514/udp

    ```


    Note that the /dev/log file is a socket that is created and maintained by the
    syslog itself and exists only while syslog is running. If the /dev/log file is
    absent, it is likely that the syslog daemon is not running. Simply restart syslog
    and the /dev/log socket will be created:


    ```

    # /usr/sbin/syslogd

    ```


    # 12.2.2 Starting and Stopping syslog


    The syslog daemon, syslogd, is usually started when the system starts from the
    startup script, /sbin/rc3.d/S09syslog, which is actually a symbolic link'
  merge: -1
