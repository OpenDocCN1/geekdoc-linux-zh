- img_proc: true
  md: 'inetd process a hang-up signal to force the inetd to reread its configuration
    file. For example, to run ftppd with the -dl switch combination, follow these
    steps:


    +   1. Edit /etc/inetd.conf


    +   2. Locate the entry in /etc/inetd.conf for ftppd. By default, the line is
    similar to:


    wait stream tcp nowait root /usr/sbin/ftpd ftppd



    +   3. Add the desired command line argument(s) to the end of the line. For example:


    ftp stream tcp nowait /usr/sbin/ftpd ftppd -dl



    +   4. Save the file and exit the editor.


    +   5. Signal inetd(8) to reread the /etc/inetd.conf file to cause the updates
    to take effect:


    ```

    # kill -HUP ''cat /var/run/inetd.pid''

    ```


    All future FTP connections will then be logged as specified by the ftppd command
    line arguments in the /etc/inetd.conf file. To change the logging or stop FTP
    logging altogether, edit /etc/inetd.conf and modify or remove any ftppd command
    line arguments and signal inetd(8) to reread the configuration file.


    # 7.11.2 FTP Security Configuration


    The Tru64 UNIX FTP server, ftppd(8), has the ability to access particular user
    accounts based on the contents of two configuration files. The first, /etc/ftpsusers,
    is checked by the FTP server when a user attempts to log in via FTP. If the account
    name is not listed in /etc/ftpsusers, access is not permitted to log in. In addition,
    the FTP server verifies that the login shell specified in the seventh field of
    the /etc/passwd file is listed in the /etc/shells. When troubleshooting a problem
    where a user is unable to log in to a system via FTP, ensure that the user''s
    account name is not listed in /etc/ftpsusers and the user''s log-in shell is contained
    in /etc/shells. See Section 6.4., “Login Controls” in Chapter 6, “Security,” for
    details on the format of these two ftppd configuration files.'
