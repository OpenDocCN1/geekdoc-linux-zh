    # 4.1.3 Cloning Information


    This option does not do anything except give you information on how to clone the
    configuration information for your system (see Figure 4.4). This information is
    used when cloning systems. Installation Cloning was discussed in Chapter 2.


    ![](img/3eed431236346b7d400c9572311a8aa8_137_0.png)


    > SysMan supports "cloning" of setup information.

    This system''s setup can be saved for other systems, or this system''s setup can
    be cloned from another system''s information.

    Cloning is provided for common services like network connectivity: DNS (BIND),
    NFS, NIS, NTP, E-Mail, and printers.

    To save this system''s setup for use in cloning other systems, use the sysman(8)
    command''s "-clone -save" option:

    # sysman -clone -save <filename>

    To clone this system''s setup onto another system''s information, use the sysman(8)
    command''s "-clone -apply" option:

    # sysman -clone -apply <filename>

    You can also list cloning information and validate cloning information before
    applying it by using the sysman(8) command''s "-clone -list" and "-clone -validate
    <filename>" options.

    See the sysman_clone(8) man page for more information.'
