  md: '# 8.3.3.8 Error Log File


    The error log file is simply the location where the lpd print daemon logs errors.
    The type of errors that could be logged include printer errors, such as out-of-paper
    alerts and printer-offline messages. The error log file is appended to persists
    across reboots. For this reason, this error log file grows without bounds and
    must be manually examined and truncated. the default location for these error
    log files is in /usr/adm directory with the name lpr for the first printer, lp1
    for the second, and so on. If an error log file is not specified when a printer
    is configured, any error messages that would have been sent to a log file are
    instead displayed on the system console. The error log file is specified in the
    /etc/printcap file by the “If” option. For example:


    ```

    1f=/usr/adm/1lpr

    ```


    Additionally, printing error messages are written to the /var/adm/syslog.dated/<date>/lpr.log
    files. See Chapter 12, “System Logging and Troubleshooting,” for more information
    on these log files.


    # 8.3.3.9 Insert Escape Sequence


    Sometimes there is a requirement to send a special escape sequence to the printer
    to set up a special function such as changing the pitch or switching to landscape
    mode. One way to do this is to redefine the form feed and have it sent whenever
    the device is opened. For example, to send the escape sequence to change the pitch
    to 16.5 CPI on certain printers you send “ESC>[4w” to the printer each time it
    is opened for printing. To make it happen, insert these two lines in printer’s
    printcap entry:


    ```

    :ff=^[4w:\n:fo:

    ```


    Note that the “^[` is the escape character (single ASCII character) and can be
    inserted using vi(1) by quoting the escape character with this sequence: Ctrl/v
    followed by Ctrl/. Using this technique redefines the form feed to the desired
    escape sequence and enables the form feed character.


