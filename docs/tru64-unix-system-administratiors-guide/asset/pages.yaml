- img_proc: true
  md: '# Domain Name System (DNS)


    The main reason UNIX systems have host names is to provide a convenient name for
    use by people. An IP address is simply not an easily remembered identifier, and
    the future of IP promises ensures no longer IP addresses. However, the TCP/IP
    software cannot use a host name directly. As discussed earlier, the networking
    software must convert, or resolve, a host name to an IP address to initiate communication.
    The simplest mechanism for providing this host to IP address correlation is the
    /etc/hosts file, which is a text file listing IP addresses and their corresponding
    host name(s). The sole use of hosts files may be appropriate for small networks
    with a limited number of systems. However, as the size of a network grows, or
    more pertinent, if a network is connected to the Internet, it becomes unfeasible
    to include every possible host in the /etc/hosts file. Considering that the Internet
    is many millions of systems, the lack of scalability of the /etc/hosts file is
    apparent. The answer to this need is the Domain Name System or DNS.


    DNS is a distributed host-name-to-IP and versa database that is used as the primary
    host name resolution environment by most networked systems. The Tru64 UNIX stock
    DNS is an implementation of the Berkeley Internet Name Domain (BIND). Knowing
    this is probably not relevant, since most DNS implementations on the Internet
    are also based on BIND. A system running can be configured to be a primary server,
    a secondary server, a slave server, a caching server, or simply as a client.


    It is by the scope of this text to detail the configuration of different types
    of DNS servers. Refer to one of the recommended references on TCP/IP networking
    and DNS in Appendix B for further information on configuring this complex network
    facility.


    # File Transfer Protocol


    The File Transfer Protocol (FTP) is a mechanism for transferring files between
    computers across a network. FTP was designed to support straightforward file transfers
    between different computer system types. For instance, there are FTP clients available
    for MS-DOS, Microsoft Windows, Compaq''s OpenVMS, IBM mainframes, and just about
    any other type of computer in addition to every flavor of UNIX. When transferring
    files, FTP can also do translations between different types of systems. For example,
    FTP can convert a text file to the appropriate format while transferring it between
    a Tru64 UNIX system and an MS-DOS system.'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'In this section, we will cover the configuration of FTP on Tru64 UNIX, including
    the FTP client and server. By default, FTP is enabled on Tru64 UNIX system, but
    understanding what configuration options are available is important to managing
    this facility. In addition, a special variant of FTP, Anonymous FTP, will be discussed.
    Anonymous FTP, which allows FTP access to a system without user authentication,
    will be covered.


    The ftp(1) command is the Tru64 UNIX interface to the File Transfer Protocol.
    This command is a character-cell utility for connecting to remote systems and
    transferring files. For its simplest form, specify the remote system''s name on
    the FTP command line. An FTP login to the remote system will be attempted and,
    if successful, you will be prompted for a user name and password on the remote
    system. For example:


    ```

    # ftp saturn

    Connected to saturn.

    220 saturn server (Tru64 UNIX Version 5.60) ready.

    Name (saturn:root): jsmith

    331 Password required for jsmith.

    Password:

    230 User jsmith logged in.

    Remote system type is UNIX.

    Using binary mode to transfer files.

    ft>

    ```


    This example demonstrates a successful login to the remote system saturn. The
    ftp prompt is then displayed indicating that FTP commands may be entered. These
    commands allow moving around the remote and local directory hierarchy, listing
    the contents of subdirectories, and getting and putting files to and from the
    remote system. For example, the following example resumes where the previous example
    left off, and it demonstrates changing to a particular directory on the remote
    system and downloading a specific file:


    ```

    ftp> pwd

    257 "/" is current directory.

    ftp> cd /pub/data

    250 CWD command successful.

    ftp> ls -l

    150 Opening ASCII mode data connection for /bin/ls

    (10.0.0.1,1030).

    total 3

    -rw-r--r-- 1 root system 1019 Jan 6 12:08 file1

    -rw-r--r-- 1 root system 1201 Jan 6 13:54 file2

    -rw-r--r-- 1 root system 3772 Jan 6 13:58 file3

    226 Transfer complete.

    ftp> get file1

    200 PORT command successful.

    ```'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# 7.11 File Transfer Protocol


    150 Opening BINARY mode data connection for filel

    (10.0.0.1,1031) (1019 bytes).

    226 Transfer complete.

    1019 bytes received in 0.0029 seconds (3.4e+02 Kbytes/s)

    ftp> bye

    221 Goodbye.

    #


    Such an FTP dialog is actually carried out by two pieces, the client ftp(1) utility
    on the local system and an FTP server daemon on the remote system. This FTP server,
    ftppd(8), is invoked only when an incoming FTP connection is detected by inetd(8),
    the system''s network server. One fptpd process is started for every inbound FTP
    connection and exists only for the duration of that particular FTP session.


    The ftppd program has two types of configuration options available to the system
    administrator:


    +   - Debugging and logging switches

    - Security and authentication switches


    The default values of these options, which will be outlined, usually sufficient
    for most situations and configurations. However, when trouble-shooting problems
    or looking to increase security, the FTP server could provide this additional
    configurability. These options are specified and maintained in several configuration
    files.


    # 7.11.1 FTP Debugging and Logging


    By default, the Tru64 UNIX FTP server, ftppd(8), does not do any logging of FTP
    connections or file transfers. If additional information about incoming connections
    is needed, either for the purpose of debugging problems or as a historical record
    of connections and file transfers, there are two ftp command line switches that
    each instruct ftppd to log additional information via the system logger facility
    (syslog).


    The first of these switches is -d, which provides debugging and output detailing
    inbound FTP connections. The information logged by ftppd includes the date and
    time of the FTP connection, which user account was used to log in, whether the
    log-in was successful or not, and an indication of which commands were issued
    during the session. Here is an example log of a simple FTP log-in and file transfer
    session:


    ```

    14 12 12:33:47 saturn ftppd[824]: <-- 220 saturn FTP server

    (Digital UNIX Version 5.60) ready.

    ```'
