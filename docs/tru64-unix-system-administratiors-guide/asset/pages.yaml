    \ As this output shows, the packets do not reach the destination system, which\
    \ may be working perfectly fine. If the traceroute command does not receive a\
    \ response from the next gateway within a three-second time-interval, an asterisk\
    \ (*) is printed for probe.\n\n```\n$ /usr/sbin/traceroute jupiter.somedomain.com\n\
    troute to jupiter.somedomain.com (192.168.171.80), 30 hops\nmax 40 bytes packets\n\
