    structure, which is used by the various AdvFS utilities to ensure access to file
    domains. The /etc/fdmnis directory contains a subdirectory for each file domain
    in the system. Within each subdirectory is a symbolic link to a block special
    device file for each volume in the file domain. This directory is crucial to the
    healthy operation of the AdvFS file system. Do not remove the /etc/fdmnis directory
    or its subdirectories without fully understanding the implications of the action.


