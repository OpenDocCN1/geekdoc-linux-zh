  md: '# 3.7.2.2 Using a Floppy as an Archive


    One way in which a floppy can be used for exchanging files with other UNIX systems
    is simply use tar(1) or cpio(1) to copy data to or from it. Since tar(1) and cpio(1)
    formats are fairly standard among different UNIX flavors, this can be used as
    an interchange mechanism for small amounts of data. You only need a floppy with
    a low-level format, simply tar(1) to the raw ''c'' partition of the floppy disk.
    No disk label is required for this.


    # Example


    Let''s say you want to copy the hosts file from one of your Tru64 systems to a
    Linux system. This example shows how you could use tar to create an archive on
    a floppy to take over the Linux machine.


    ```

    # tar cvf /dev/rdisk/floppy0c /etc/hosts

    a /etc/hosts 4 Blocks

    # tar tvf /dev/rdisk/floppy0c

    blocksize = 256

    -rwxr-xr-x 3/4 1827 May 18 12:08:29 2001 /etc/hosts

    ```


    # 3.7.2.3 Creating a File System on the Floppy


    Creating a file system on a floppy is a simple matter. You only have one choice
    of file system type, because AdvFS will not create a file system on a space as
    small as a floppy. Therefore, you must use UFS for your file system on a floppy
    disk. Since you need to keep the floppy mounted for an extended period of time,
    and given the size, fsck(8) will not take very long. Therefore, the standard reasons
    for choosing AdvFS over UFS do not apply in this case. Keep in mind that since
    the floppy is a removable media, you don''t want to remove the floppy until you
    have unmounted the file system. Failing to do this could cause severe distress
    to the system.


    The sequence of steps to create a new file system on a new floppy disk is as follows:


    +   * Format the floppy.

    * Write a partition table using disklabel(8).

    * Create the UFS file system with newfs(8).

    * Mount the floppy-based UFS file system.'
  merge: -1
  pgno: 127
