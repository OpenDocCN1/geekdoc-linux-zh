    # 2.2.5.2 Crash Dump Space Requirements


    When a Tru64 UNIX system crashes, by default the resulting crash dump is copied
    into one of the swap partitions and upon subsequent reboot it is moved into /var/adm/crash
    by the savecore(8) utility. The default location can be changed; see the man page
    for savecore for details. The crash files are composed of a partial or full memory
    image at the time of the crash and a copy of the current kernel, usually /vunix.
    The file system that directs /var/adm/crash must be large enough or, more accurately,
    have sufficient free space to contain at least one crash dump. A system''s crash
    dump is determined by several factors—the amount of physical memory and whether
    partial or full dumps, compressed or not compressed, select to name a few. On
    systems configured for crash dumps, the /var/adm/crash area should be at least
    large as the size of the system''s memory, and on systems configured for partial
    dumps, it can be somewhat smaller. The vast majority of the time you will configure
    your system to produce crash dumps. The purpose of mentioning this is to make
    you aware that initially this destination is contained in the /var file system,
    or in the /usr file system if a /var file system is not selected. Ensure that
    enough space is allocated for at least one crash dump in the file system where
    the /var/adm/crash directory will be.


    One recommendation is to create a separate file system solely to contain crash
    dumps. Mount this file system either at /var/adm/crash, or select a different
    mount point and configure the system to save crash dumps to this new location.
    Following this strategy means that no space need be allocated in either the root,
    /usr, or /var file systems for crash dumps. See Chapter 12, "System Logging and
    Troubleshooting." for guidelines on configuring and managing crash dumps.


