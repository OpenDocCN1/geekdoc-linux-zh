  md: '# 4.4 Kernel Configuration


    Located in /etc, the rc.config file contains runtime configuration variables that
    the init scripts use to properly configure the system or application. To get,
    set, or delete a runtime configuration variable, always use the rcmgr command.
    There is nothing preventing you, as the system administrator, from editing this
    file with your favorite editor. However, this is not recommended due to the possibility
    for mistakes or multiple accesses to corrupt this critically important file. A
    simple mistake could render your system unstable. The rcmgr(8) reference page
    states:


    > > Caution

    > You should always use rcmgr to make changes to the files. This will preserve
    the correct syntax in the files. A lock file, /etc/rcmgr.lock prevents multiple
    access to the data files.


    In preparation for clustering, the rc.config file was split into two files in
    Tru64 UNIX version 5.0: rc.config and rc.common. In a standalone environment,
    this makes little difference, but in a cluster, rc.config contains the member-specific
    runtime configuration variables, whereas rc.config-common contains all cluster-common
    runtime configuration variables.


    The rc.config script executes the rc.config.common script before doing anything
    else, so any variables set in the rc.config are overridden by the same variables
    set in the rc.config file. There is an optional third file, rc.config.site, which
    if it exists should be executed by the rc.config.common file before it does anything
    else so that any variables set in rc.config.site will be overridden by the same
    variables set in the rc.config.common file.


    For additional information see the Tru64 UNIX System Administration or the rcmgr(8)
    reference page.


