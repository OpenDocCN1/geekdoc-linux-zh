  md: "# Managing the Local Printing System\n\nThe lpq command has the ability to\
    \ display the status of an individual print job, a particular printer (the “-P”\
    \ flag), or print requests from individual users. The lpq command is primarily\
    \ for displaying the status of print queues. See the lpq man page for more information\
    \ on its options.\n\nThe lpstat command is a more general status utility. In addition\
    \ to displaying the status of individual print queues, lpstat can display the\
    \ status of the lpd daemon, the name of the system destination, and which device\
    \ files correspond to which printers. A useful switch of the lpstat command is\
