  md: '64 bytes from 192.168.171.80: icmp_seq=1 ttl=128 time=ms

    64 bytes from 192.168.171.80: icmp_seq=2 ttl=128 time=ms

    64 bytes from 192.168.171.80: icmp_seq=3 ttl=128 time=ms

    64 bytes from 192.168.171.80: icmp_seq=4 ttl=128 time=ms


    -jupiter PING Statistics-

    5 packets transmitted, 0% packet loss

    round-trip (ms) min/avg/max = 0/0/2 ms


    In this example, connectivity between the ping host and juniper is fine. This
    can be determined by the low round-trip times of each ping (<=2ms) and the fact
    that there was 0% packet loss; that is, all packets successfully reached the destination
    (jupiter).


    To show the results of a ping where there is a connectivity problem, consider
    this example to a different host:


    ```

    # /usr/sbin/ping -c 5 192.168.171.81

    PING 192.168.171.81 (192.168.171.81): 56 data bytes

    --192.168.171.81 PING Statistics --

    5 packets transmitted, 0 packets received, 100% packet loss

    ```


    This ping demonstrates the outcome when the ping system does not receive the ECHO_RESPONSE
    packets from the remote host. One to be aware of that a ping resulting in 100%
    packet loss could mean several things. The ECHO_REQUEST packets may never have
    reached their destination, or possibly the ECHO_RESPONSE packets were not able
    to successfully return. Another possibility is that the network between the source
    and destination is fine, and the destination host is simply down or unavailable.


    Note that this example used an IP address rather than a host name in the ping
    command. One recommendation is to use specific IP addresses rather than host names
    when troubleshooting using the ping command, to ensure there is no ambiguity about
    which host is the target of the ping. However, even if a host name is specified,
    the ping output displays


    The best strategy to use when attempting to isolate a network problem is to ping
    first the local interface on the system to ensure that the system''s own interface
    is up and running. Next, to ping hosts and gateways further away to identify where
    the fault lies. The most complete picture of a network fault is best drawn through
    a combination of pings and the output of the next utility, traceroute.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# 7.9.4 traceroute


    While the ping command will indicate a loss of basic connectivity between two
    systems, its output cannot identify where the connectivity may be breaking down.
    For this, the traceroute(8) command is used. Except for very simple networks,
    the route between two systems may be through a variety of routers, gateways, or
    hosts. Any one of nodes along the path may be in the issue. The traceroute command
    displays the route that network packets travel to reach a remote system. If one
    of the intermediate stages along the way is down or not forwarding packets further
    downstream, it is immediately obvious from the traceroute output.


    The traceroute command is run specifying the target destination on the command
    line. For example, the following is a successful traceroute to the Compaq Web
    site:


    ```

    ### /usr/sbin/traceroute www.compaq.com

    tracoute to www.compaq.com (192.208.46.158) 30 hops max, 40 bytes

    1 Hssi19-0-GW.DEN1.ALTER.NET (157.130.162.57) 6.3 ms

    6.9 ms 7.4 ms

    2 Hssi14-0.CRKY1.Alter.Net (137.39.59.214) 30.8 ms

    37.5 ms 31.8 ms

    31 ATM10-0-CR2.EWR1.Alter.Net (137.39.59.89) 68.5 ms

    168.1 ms 65.1 ms

    4 ATM10-0-XR2.EWR1.ALTER.NET (146.188.176.22) 70.9 ms

    70.7 ms 66.9 ms

    5 ATM11-0-XR2.BOS1.ALTER.NET (146.188.176.158) 109.5 ms

    111.3 ms 82.8 ms

    6 ATM5-0-CR2.SRI1.ALTER.NET (146.188.177.13) 73.0 ms

    73.3 ms 74.6 ms

    7 boston1-br2.bbnplanet.net (4.0.2.73) 74.1 ms 77.7 ms 77.8 ms

    8 cambridge2-br1.bbnplanet.net (4.0.1.186) 82.1 ms 84.4 ms

    81.1 ms

    9 cambridge2-cr3.bbnplanet.net (192.233.33.10) 73.7 ms 76.2 ms

    73.8 ms

    10 dec.bbnplanet.net (131.192.95.2) 107.0 ms 79.0 ms 78.5 ms

    11 199.93.199.4 (199.233.199.4) 78.5 ms 77.0 ms 78.8 ms

    12 www.compaq.com (192.208.46.158) 87.1 ms 82.6 ms 88.9 ms

    ```


    This example indicates that the distance from the source to the destination is
    12 steps or hops. For each gateway, the traceroute command launches three small
    probe packets and listens for a specific response from the gateway. Each line
    in the traceroute output shows the gateway''s IP address (and host, if name can
    be resolved) and the round-trip time for each of the three packets'
  merge: -1
  pgno: 272
- img_proc: true
