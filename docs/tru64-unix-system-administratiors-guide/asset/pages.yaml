    than /usr, or for that matter the root or /var file system, prevents users from
    impacting system operation by filling any of these three important file systems.
    If, however, the decision is made to place user account directories in the root,
    /usr, or /var file system, a rule of thumb to follow is to allocate 100 MB for
    each user account. This will provide some amount of buffer space to reduce the
    possibility of a particular user filling the file system containing the home directories.
    Of course, decrease or increase this per-user disk preallocation if you have an
    accurate understanding of the amount of disk space any particular user may need.


    For backup purposes, if you have users with large directories, it is a good idea
    to break up the directory structure into manageable file sizes. How large is depends
    on your backup strategy and tape drive capacity. For example, you might create
    a structure with two file systems, /usr/staff/1 and /usr/staff/2, and equally
    distribute the users between the two. A couple of benefits of this strategy are
    that you can more easily and quickly back up and restore smaller file systems,
    and if you have a file system or storage problem it does not affect all of your
    users.


    # 2.2.5.4 File System Overhead


    After calculating the minimum size of the boot file systems based on the mandatory
    Tru64 UNIX subsets, plus any optional subsets, and taking into consideration the
    issues described above, the final variable in the boot partitioning equation is
    related to the file system overhead. A certain percentage of the total space allocated
    is unavailable for use. As a rule of thumb consider this to be 5%. This means
    that when you are planning the size for a particular file system, this percentage
    should be added to the final partition size. This percentage is used by the operating
    system for file system housekeeping. In addition, with an additional percentage
    of space marked as unavailable to non-root users. The root user or root-owned
    processes can make use of this reserved space. The percentage held default 10%,
    can be changed by specifying a different value for the minfree parameter of the
    newfs(8) and tunesfs(8) commands. See Chapter 3, “Storage,” for details on adjusting
    this minfree value.


