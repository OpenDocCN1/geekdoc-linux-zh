    # rdump -0 -u -f saturn:/dev/tape/tape0_d0 /

    ```


    This command does a level-0 dump of the root file system to the /dev/tape/tape0_d0
    tape drive on the remote system saturn. This command also updates the /etc/dumpdates,
    which is functionally identical to the /etc/vdumpdates for the vdump command.
    Additionally, the remote system-s/.hosts file must contain the name of the local,
    or client, machine. This requirement is necessary to provide a trusted host relationship
    between the two systems (remote and local).


    The main drawback to the rdump command is rdump''s inability to back up AdvFS
    fillets. This remote backup functionality is achievable using rdump or the vdump
    command by the use of a workaround. The workaround is to run the vdump command
    on the local system with the output of the vdump sent to standard output by specifying
    a hyphen (-) to the “-f” parameter. The standard output is piped to a remote shell
    on the remote system running a dd(1) command to its local tape drive. (See Section
    11.2.3, for information on the dd command.) The following example backs up the
    file system to the /dev/tape/tape0_d0 tape drive on the remote system saturn:


    ```

    # vdump -0 -u b 64 -f / rsh saturn dd

    of=/dev/tape/tape0_d0 bs=64

    ```


    This example command is equivalent to the previous rdump. Note that the block
    size must be specified to the rdump command (-b 64) and the dd command (bs = 64k).
    This workaround has the same requirement as the remote system-s/.hosts file, which
    must contain the name of the local, or client, machine. The vrestore utility can
    be used to perform a remote restoration from a backup created using vdump or rdump.
    See the vrestore section for information on the reverse of this workaround—restoring
    from a remote system''s tape drive with the vrestore command.


