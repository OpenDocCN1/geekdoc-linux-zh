  md: '# Network Troubleshooting Tools


    When a problem arises on a network of systems, it can initially be overwhelmed
    due to the range of possible sources of trouble. Trying to determine whether the
    problem is hardware (a computer, hub, or router, or cables or connectors, etc.)
    or software (an improperly configured network interface, incomplete or incorrect
    routing table information, or invalid or missing information) can be difficult.
    The best approach is to understand the symptoms of the issue and then methodically
    try to isolate the actual problem. Tru64 UNIX (and many other UNIX implementations)
    provide several troubleshooting utilities, each with a special purpose or focus.
    Knowing which tool''s specialty and what can be learned from its output is important
    in knowing where to start troubleshooting.


    A network problem will probably manifest itself in a connectivity loss between
    systems. Typically, an individual system or group of systems is unable to communicate
    with some other system or group of systems. The very first thing that should be
    done is to attempt to define the problem. Initially this may be something as vague
    as a user reporting that he or she cannot connect to the company Web site using
    the browser on his or her workstation. Using this example, the system administrator
    should be able to refine and bound the problem by asking questions or trying variations
    of the problem. For instance:


    +   * Are you able to connect to other Web sites?

    * Do any of your co-workers have the same problem?

    * Are any other network services (telnet, FTP, printing) also not working?

    * Have there been any recent hardware or software configuration changes?


    After collecting further information, the system administrator is able to determine
    the following:


    +   * The user who raised the issue appears to be the only one impacted.

    * The user is experiencing network time-outs regardless of which Web site is attempted.

    * All other network services are also failing.

    * The networking configuration of the user''s workstation was recently changed,
    but the user does not know what was changed.


    From this description, it appears that the user''s system is no longer a part
    of the network. More than likely, the recent network reconfiguration has'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'introduced a problem preventing the system from communicating with the rest
    of the network. The following is an example of a plan of attack and introduces
    the UNIX network troubleshooting utilities.


    The first thing that should be checked is the basic connectivity. Ensure that
    the system is physically still connected to the network. For a thinnet or coax
    cable Ethernet network, check that the tee connector is firmly attached to the
    coax connector of the system’s network interface card. For a 10BaseT Ethernet,
    token ring, or FDDI network, make sure that the connectors on each end of the
    system’s cable run are properly attached to the system and the network hub or
    concentrator. Some network interface cards provide a “link” light, frequently
    green in color, that glows when solid network connectivity.


    Assuming the physical connectivity is fine, the next place to investigate the
    network configuration on the affected system. The four utilities described in
    the following subsections are listed in a recommended order of use. Each has a
    specific purpose and is used in a troubleshooting situation to confirm or deny
    that a particular process or system is part of the problem.


    # 7.9.1 ifconfig


    Normally, the ifconfig(8) utility is used by the system at startup to configure
    and activate network interfaces (Table 7.3). However, ifconfig is handy for quickly
    displaying a system’s interface configuration. The three most pieces of information
    for each network interface are:


    Table 7.3 Network Interface Types and Device Names


    | Network Interface Type | Network Interface Device Name |

    |---|---|n| Loopback | lo |

    | Ethernet | tu, le, ln, xna |

    | Token Ring | tra |

    | FDDI | fta, faa, fza |

    | ATM | lta |

    | Serial Line Interface | sl |


    Note: The Network Interface Device Name will be followed with a number designating
    a particular device (for example, tu0, fta1).'
  merge: -1
  pgno: 268
- img_proc: true
  md: "# 7.9 Network Troubleshooting\n\n+   * Interface State (Up or Down)\n* IP Address\n\
    * Subnet Mask\n\nSimply run the following command to display the information about\
    \ all the network interfaces on a system:\n\n```\n /usr/sbin/ifconfig -a\ntu0:\n\
    flags=c63<UP,BROADCAST,TRAILERS,RUNNING,MULTICAST,SIMPLEX>\nnet 192.168.171.78\
    \ netmask fffffff broadcast\n192.168.171.255 ipmtu 1500\n```\n\n```\nlo0:\nflags=100<UP,LOOPBACK,NOARP,MULTICAST,SIMPLEX,NOCHECKSUM>\n\
    net 127.0.0.1 netmask 0xff000000 ipmtu 4096\n```\n\nIn this example, there are\
    \ two interfaces, an Ethernet interface (tu0) and the loopback interface (lo0).\
    \ Each interface's status is listed as the first field in the \"flags=\" string.\
    \ In both of these cases, the string \"UP\" indicates that the interface is down.\
    \ The absence of the string \"UP\" indicates otherwise the system does not transmit\
    \ messages through that interface. If the interface is not up, the following command\
    \ (using tu0 as an example) will activate the interface:\n\n```\n ifconfig tu0\
    \ up\n```\n\nThe second line of each interface's ifconfig output lists the IP\
    \ address (inet), the subnet mask (netmask) and the maximum transfer unit value\
    \ (ipmtu). While the IP address is displayed in a dotted decimal format, the subnet\
    \ mask is displayed as a hexadecimal value that must be converted to decimal.\
    \ Ensure that the IP address and subnet mask displayed reflect the correct address\
    \ information for each interface. If the incorrect IP address and/or subnet mask\
    \ are shown, reconfigure the interface via the netstat(8) or config(8X) command\
    \ and restart the networking services.\n\n# 7.9.2 netstat\n\nOnce the network\
    \ interface(s) have been confirmed as correctly configured, the next item to examine\
    \ is the routing table. The netstat command is primary to display network statistics;\
    \ however, it also can be used to display a system's routing table:"
