    MANPATH=/usr/man:/usr/local/man; export MANPATH

    rather than:

    export MANPATH=/usr/man:/usr/local/man

    ```


    In the Korn and BASH shells, both formats produce the same result. However, since
    the latter is not a valid command in the Bourne shell, setting and exporting environment
