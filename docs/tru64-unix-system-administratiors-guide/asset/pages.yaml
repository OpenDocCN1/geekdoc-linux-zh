  md: 'granting file access to particular users or groups. Access Control Lists (ACLs)
    allow the file owner to define access for the three classes of users described
    above, but also allow access to be individually granted or denied to specific
    users or groups.


    ACLs can be enabled or disabled dynamically on a Tru64 UNIX system, and are independent
    of other security options. It is not necessary to be at the Enhanced security
    level in order enable ACLs. In version 5 of Tru64 UNIX, ACLs are enabled by kernel
    parameter acl_mode, which is part of the sec (security) subsystem. Use the sysconfig
    command to determine whether ACLs are enabled:


    ```

    # sysconfig -q sec acl_mode

    acl_mode = enable

    ```


    There are three ways to enable or disable ACLs:


    +   1. Change the parameter value in /etc/sysconfigtab by using sysconfigdb utility.
    Then reboot the system.

    2. Run the seccfig utility and select or deselect the “Enable Access Control Lists
    (ACLs)” option (see Section 6.6.1.3).

    3. Because acl_mode is a dynamic kernel parameter, you can change it on a running
    system with the sysconfig utility. However, the change will last only until the
    next system reboot unless you use one of the other two methods as well. The command
    to enable ACLs in this manner is:


    ```

    # sysconfig -r sec acl_mode=enable

    ```


    The output of ls(1) provides no information about a file''s ACL, even such basic
    information as whether or not the file has one! To see whether a file has an ACL,
    you must use the getacl(1) command. To add, remove, or change an ACL, use the
    setacl(1) command. In addition, dxsetacl utility provides a GUI to view and change
    ACLs. dxsetacl can be invoked from the command line (/usr/bin/X11/dxsetacl) or
    from the CDE Application Manager Menu.


    An ACL consists of a number of access control entries, each of which consists
    of three colon-separated fields:


    +   * The entry type (user, group, or other)

    * A user or group name or numeric UID, or a null field'
