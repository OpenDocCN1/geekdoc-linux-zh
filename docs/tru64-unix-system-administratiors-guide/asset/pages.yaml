  md: '+   Stripe individual files across multiple physical disks (or volumes) to
    increase performance. The optional AdvFS Advanced Utilities contain a utility
    to allow distributing individual files across specific disks within a file domain.
    This can provide better file access throughput and some degree of load balancing
    across disks and/or controllers.


    +   Consider using the AdvFS Direct I/O feature with commercial database products,
