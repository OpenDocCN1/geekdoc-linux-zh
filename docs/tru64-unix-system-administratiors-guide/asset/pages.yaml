  md: '# 6.6.1.3 secconfig Utility


    The secconfig(8) utility, which replaces the secsetup utility used in earlier
    versions of Tru64 UNIX, is used to set the system security level and configuration.
    To run secconfig, enter "sys secconfig". The security configuration GUI will start
    up and ask you to either BASE or ENHANCED security. Select ENHANCED and click
    the Next button.


    After selecting ENHANCED security, you will be asked to select one of three options:


    +   - SHADOW

    - UPGRADE

    - CUSTOM


    SHADOW enables shadow passwords, but does not configure any of the login or password
    controls available in Enhanced security. This option is available for system administrators
    who desire to protect their users'' passwords from a password-cracking attack,
    but don''t want any of the extra features provided by Enhanced security.


    UPGRADE is used only during a rolling migration of a TruCluster from Base to Enhanced
    security. After all members have been rebooted, SHADOW or CUSTOM must be selected.


    CUSTOM sets standard default values for certain Enhanced security features and
    allows you to customize all of its features to your desired values. The standard
    defaults set by CUSTOM are as follows:


    +   - Logging of successful logins and unsuccessful login attempts is enabled.

    - Null passwords are not allowed.

    - Password expiration time is set to 6 months.

    - Password lifetime is set to 1 year.


    When CUSTOM is selected, secconfig brings up a screen (Figure 6.1) that allows
    you to customize some of the most commonly used Enhanced security features. Additional
    features may be customized by editing the authentication database; see Section
    6.6.3 for details.


    Password expiration is the maximum time that can occur between password changes.
    A user who fails to change his password in this amount of time is forced to change
    it on the next login. Password lifetime is slightly different; if a user fails
    to change his password in this amount of time, the account is'
