    in the vm subsystem. These attributes are set in the kernel subsystem database
    (/etc/sysconfig). By default, the maximum percentage of physical memory that the
    UBC can grow to is 100%. The ubc_maxpercent attribute can be set to specify a
    different maximum value. Similarly, the ubc_minpercent attribute, which defaults
    to 10%, specifies the minimum percentage of physical memory that the UBC will
    shrink to when reclamation occurs. Note that the ubc_minpercent value is not the
    minimum value that the UBC can be. Often, the UBC starts below the ubc_minpercent
    value, and it is possible for the UBC to never grow above this minimum value.


