  md: '# 10.4.2.1 Real Memory


    The primary and most familiar type of memory in a Tru64 UNIX system is composed
    of Random Access Memory chips, or RAM. This memory is what is meant when referring
    to the memory size of an individual system. For example, an Alphastation with
    64 MB of memory has 67,108,864 bytes of memory storage. The total, or physical,
    memory on a running Tru64 UNIX system includes the Compaq console code, the Tru64
    UNIX kernel, and the kernel''s associated data structures. The memory remaining
    after initialization loads these system resources is termed "available" and is
    the amount of memory available to user processes. Since Tru64 UNIX uses a shared
    memory model, the user processes will usually have part of their address space
    resident in real memory and part in swap space. The process''s pages must be loaded
    into RAM in order for the Alpha CPU to execute its instructions. Therefore, we
    will discuss the difference between real and virtual memory shortly, but for now
    be aware of this distinction.


    To determine the physical memory configuration of a Tru64 UNIX system, use vmstat
    -P. See Figure 10.1 for a representative output from the vmstat command.


    Note that a fairly significant amount of real memory is occupied by the Tru64
    UNIX kernel and associated data structures. The size of the kernel and its data
    structures is determined by which kernel options are selected when the kernel
    is built. To minimize the size of the kernel (and thus the amount of physical
    memory occupies), select only the kernel options that are necessary or appropriate
    for your system. See Chapter 4, "System Configuration," for guidelines in building
    a Tru64 UNIX kernel. Note that more recent versions of Tru64 UNIX allow many subsystems
    to be installed and removed dynamically from the system at run time. Thus, there
    are fewer "opportunities" to rebuild the kernel than there used to be.


    # 10.4.2 Virtual Memory


    Tru64 UNIX, similar to many other modern operating systems, supports a facility
    whereby the total addressable memory size is independent of the physical installed
    in the system. This ability, called virtual memory, allows a system to apparently
    have a much larger addressable range than the amount of real memory installed
    in the system. The basic unit of memory, virtual and physical, is the page, which
    is a fixed 8 KB in size in current versions of Tru64 UNIX. The virtual memory
    facility, which is managed by the Tru64 UNIX kernel, works by transparently moving
    pages between physical memory,'
