  md: '# Tru64 UNIX Installation


    After completing the necessary preinstallation planning and ensuring that the
    system is suitably prepared, you are ready to begin the actual installation of
    Tru64 UNIX on your system. This section will detail the actual installation process
    including a comparison of both the character and graphical installation utility
    interfaces. Note that the installation to be detailed here is a Full installation,
    where the Alpha system is booted from the installation media—either a local CD-ROM
    or across the network from a RIS server. Update installation, which is outlined
    in this chapter (see Section 2.5.1, "Update Installation Steps\ is performed with
    the Alpha system running the version of Tru64 UNIX to be updated from single-user
    mode.


    # 2.4.1 Full Installation Steps


    +   1. Complete preinstallation planning and preparation.


    +   2. Take the System to the Console Prompt (>>>). Power up the system. After
    the Power On Self-Test (POST) and other startup and diagnostic messages, the console
    prompt should be displayed. If the system begins to boot, halt the system by pressing
    the Halt button. If the system is already running a version of Tru64 UNIX or another
    operating system, shutdown and halt the system with a command similar to the following:


    ```

    # shutdown -h +1 "Shutting down for full installation"

    ```


    +   3. Set the Necessary Console Flags. Refer to the "Processor-Specific Boot
    Instructions for Full Installations" chapter in the Tru64 UNIX Installation Guide
    for system-specific console variable settings. The following flags are typically
    specified on all Alpha systems prior to beginning a full installation:


    +   - This command clears the boot_osflags variable to ensure the kernel takes
    the correct action upon bootup:


    ```

    >>> set boot_osflags ""

    ```


    +   - This command sets the auto_action variable to halt, which causes the system
    to return to the console prompt after the system is powered up or initialized:


    ```

    >>> set auto_action halt

    ```'
  merge: -1
  pgno: 55
- img_proc: true
  md: '+   - Typically, after the installation is complete, the auto_action variable
    is reset to boot or restart so the system will automatically boot upon power-up.


