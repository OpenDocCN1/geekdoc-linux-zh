    # 10.2.4.2 Traditional/Unified Buffer Cache Sizing


    Proper sizing of both the traditional buffer cache and the unified buffer cache
    is important in order to maximize the available memory for user processes, while
    retaining adequate buffer space to prevent I/O performance degradation. The traditional
    buffer cache''s default size of 3% of physical memory is sufficient unless the
    physical memory in the system is greater than two gigabytes, in which we recommend
    reducing the size to 2% of physical memory.


    The unified buffer cache (UBC), on the other hand, is dynamically sized and controlled
    by specifying a high-water value (ubc_maxpercent) of 100% (of physical memory)
    by default. If more real memory is needed to execute a system''s processes, and
    a low-water value (ubc_minpercent) of 10% by default. If the system is not doing
    a great deal of I/O, you can reduce the amount of memory available to the UBC
    by setting the ubc_maxpercent parameter to 50%. This prevents the UBC from growing
    beyond half of physical memory rather than taking the entire 100% if necessary.
    On systems doing a great deal of I/O, such as an NFS server or a development system,
    you may wish to increase the initial size of the UBC (presumably reducing actual
    I/O) by raising the ubc_minpercent parameter above the default of 10% of physical
    memory. To determine if the ubc_minpercent value is too high, causing a real memory
    shortage and resulting in higher paging activity, monitor the pageout rate using
    the vmstat(1) command.


    # 10.2.4.3 Swap Space Configuration


    There are several swap space configuration issues that impact virtual memory performance
    on a Tru64 UNIX system. The first of these is swap space size and layout. The
    amount of storage space set aside for the swap area should be at least one times
    the size of a system''s physical memory and two more'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'times physical memory if the system is running many large jobs simultaneously.
    Though there is no performance penalty for having more swap space than necessary,
    there will definitely be problems if there is not enough swap space. Large programs
    will either be prevented from running or killed midstream if insufficient swap
    space is available, depending on the swap allocation method.


    For best performance, spread your swap space across multiple disk devices and,
    if possible, multiple disk controllers as well. Use the fastest disks available
    in a system when configuring swap space. By having multiple swap partitions, each
    on its own disk, rather than one large swap partition on a single disk, the system
    is able to stripe swap activity across multiple disks, thereby increasing performance.
    In order to provide the best swap space interleaving, as this striping is termed,
    activate all swap partitions at system boot by placing them in the /etc/sysconfig
    file, as detailed in Chapter 4, "System Configuration." The swapon -s command
    displays the current swap space configuration and status. See Section 10.7.4 for
    a usage example of the swapcommand.


    The second swap space consideration is the swap space allocation method. The swap
    space on a Tru64 UNIX system is determined by two modes: immediate mode or deferred
    mode. These two modes differ when swap space is allocated and result in different
    swap space requirements.


    +   - Immediate mode, which is also called eager mode, causes a chunk of swap
    space to be allocated as soon as a process starts and is reserved for the life
    of that process.


    +   - Deferred mode, which is also referred to as lazy mode, delays the allocation
    of swap space until the system needs to write a memory page to swap space.


    Tru64 UNIX''s default swap allocation mode is immediate mode. This causes the
    operating system to reserve swap space for every process when the process starts,
    and again whenever it allocates memory. Immediate mode typically forces the system
    administrator to configure more swap space than is probably required.


    Deferred mode, or overcommitment, on the other hand, causes the reservation of
    swap space to be postponed until the swap space is actually required for a page.
    Deferred mode requires less configured swap space and may cause the system to
    perform better, since less swap space overhead is required. However, since the
    swap space is not reserved until needed, the swap space may be unavailable when
    it is required, and the operating system may'
