- img_proc: true
  md: 'Tru64 UNIX provides a number of useful privileges (see Table 6.4). These privileges
    enable specified users to perform one or more related tasks. For example, the
    Security privilege allows a user to change the system security level, configure
    the audit environment, and use the dop utility to grant privileges to other users.
    In addition to the predefined privileges, it is possible to define your own privileged
    actions.


    # Table 6.4 Division of Privileges


    | Privilege Group | Actions Allowed |

    | --- | --- |

    | SuperUsers | All privileges (root) |

    | AccountManagement | Add, modify, and delete user accounts and groups |

    | CDEConfiguration | Configure CDE (dsetup) |

    | ClusterConfiguration | Configure cluster-related services |

    | ClusterManagement | Administer cluster-related services |

    | EventConfiguration | Configure event-related services |

    | EventManagement | View and monitor event-related services |

    | FileManagement | Archive, restore, and copy files |

    | HostManagement | Perform host management tasks (dxhosts) |

    | KeyboardConfiguration | Customize keyboard settings and mapping |

    | MailConfiguration | Configure mail services (sendmail, IMAP, POP) |

    | MailManagement | Administer and monitor mail services |

    | NetworkConfiguration | Configure networks, interfaces, routes, etc. |

    | NetworkManagement | Monitor network status |

    | PowerManagement | Power management tasks (dxpower) |

    | PrinterConfiguration | Printer setup and configuration |

    | PrinterManagement | View print queues, add/remove print jobs, etc. |

    | ProcessManagement | Process management (e.g., allocate CPU resources) |

    | Security | Configure and manage security, auditing, DOP |

    | SoftwareManagement | Install/remove software subsets and licenses |

    | StorageConfiguration | Configure disks, add/remove filesystems |

    | StorageManagement | Monitor disks, mount/unmount filesystems |

    | SystemManagement | Build kernel, shutdown/reboot, etc. |'
