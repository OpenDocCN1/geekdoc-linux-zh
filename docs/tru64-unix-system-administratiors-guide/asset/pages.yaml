  md: 'The site password callout is a program or script that checks possible passwords
    for conformance to site-specific security policies. You can write your own program
    and specify its full pathname here, or modify the system-provided script, /tcb/bin/pwpolicy.
    See the acceptable_password(3) man page for more information on this topic.


    Next, config will offer you a menu to enable or disable the following system configuration
    options. These choices are available in both Base and Enhanced security, so this
    menu is presented regardless of the security level that you chose earlier.


    +   - Segment sharing

    - Execute bit set only by root

    - Enable Access Control Lists (ACLs)


    Segment sharing is enabled by default, and you should leave it enabled unless
    you have special requirements. See the Tru64 UNIX manual for information on this
    option. ACLs are also enabled by default; they are discussed in more detail in
    Section 6.8. The middle option is disabled by default. When this option is enabled,
    ordinary users may not execute any of the files they own. This minimizes the likelihood
    of a deceptive program such as a “Trojan horse” being introduced to the system.


    Next, you have an opportunity to set a new password. It’s a good idea to do this
    if you''re changing from Base to Enhanced or versa; this helps ensure that you
    will still be able to log in after rebooting at the security level. If you''re
    just using config to change some of the custom security parameters or options,
    without changing the security level, there is no need to change the root password.


    # 6.6.1.4 Reboot the System to Enable Enhanced Security


    The system must be rebooted to make the new security level take effect. The simplest
    way to accomplish this is:


    ```

    # /sbin/shutdown -r +2 "Enabling Enhanced Security."

    ```


    This shuts down and reboots the system with two minutes grace time and displays
    an informative message to all logged-in users.'
