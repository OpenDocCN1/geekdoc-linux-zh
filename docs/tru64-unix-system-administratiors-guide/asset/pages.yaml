    ```


    There are two processor sets: pset 0 contains CPUs 0 and 2, while pset 2 contains
    CPU 1. Now the runon command, in conjunction with the “-o ps” (show processor)
    option of the ps command, illustrates binding a process to a CPU:


    ```

    # runon 2 ps -o cmd,psr | grep ps

    grep ps

    2

    ps -o cmd,psr -2

    ```


    The output shows processes whose names contain the string “ps”, listing only the
    command name and the processor that is running the process. Both processes are
    running on CPU 2, but the tilde before the 2 on the last line indicates that the
    grep command is bound (by the “runon 2” command) to CPU 2. The grep command is
    also running on CPU 2, but it is not bound to do so; it could just as easily execute
    on a different CPU.'
