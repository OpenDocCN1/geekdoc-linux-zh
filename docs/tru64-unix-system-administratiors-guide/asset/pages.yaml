    1st 0 aey 93 /home/aey/main.c 21987 bytes\n2nd 0 cjy 94 /home/cjy/memo 2151 bytes\n\
    ```\n\nRefer to the lpq and lpstat man pages for more information on these commands.\n\
    \n# 8.3 lpr and cancel\n\nThe opposite of the lpr/lp pair, which submit print\
    \ jobs, is the lprm utility pair. These programs delete print requests that have\
    \ already been queued. While the lprm command is a BSD UNIX utility, it can either\
    \ be used on a Tru64 UNIX system to delete queued print jobs. Both utilities allow\
    \ deletion of individual print jobs and removal of all jobs from a particular\
    \ print queue; however, the lprm command also supports deleting all print jobs\
    \ submitted by a particular user.\n\nTo remove individual print jobs, simply issue\
    \ the print request ID on the command line. The request ID for a particular job\
    \ can be determined from the output of the lpq or lpstat command."
