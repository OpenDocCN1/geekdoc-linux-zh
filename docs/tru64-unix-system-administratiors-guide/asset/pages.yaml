    # 3.7 Managing Direct-Access Removable Media Devices


    Tru64 UNIX supports a number of direct-access removable media devices, which share
    some characteristics with the fixed disk and tape types we''ve been discussing
    until now. The removable media devices are generally used in a block-oriented
    fashion, have a media that is designed to be removed from the drive and taken
    to another system like a tape device. Tape devices are read and written in a character-oriented
    manner; thus, they are not random access in nature. The removable devices discussed
    in this section are designed to provide random access to their data.


    The most popular of these type devices on a Tru64 UNIX systems are CD-ROM, DVD-ROM,
    and floppies, and it is these to which we will confine our discussion. Even though
    these are the most popular, they are far from the only ones that can be used.
    There are other types of read-write and read-only'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'optical devices that can be used, as well as third-party devices like the ZipTM
    drive from Iomega.


    # 3.7.1 CD-ROM and DVD-ROM Devices


    Tru64 UNIX supports both CD-ROM and DVD-ROM (Digital Versatile Disk, Read-Only
    Memory) devices. CD-ROM drives come with most Tru64 systems these. The devices
    usually internal to the system and can be used to load new firmware or software,
    or even play music! As the name implies, they are read-only, which means you can
    only get data from them but not write data onto them. The average CD is around
    650 MB, while the DVD-ROM can hold up to 17 GB! The media is also quite inexpensive
    to mass produce, so they are very useful when produced in quantity for software
    distributions, video, or music.


    # 3.7.1.1 Mounting CD-ROMs


    Tru64 UNIX can read CD-ROMs formatted in number of industry-standard and proprietary
    formats. The most popular format today is ISO9660 level II "High-Sierra" standard
    format. This format can be read by PCs, UNIX, and many other operating systems.
    Tru64 UNIX sees this format as the CDFS, or CD-ROM File System. CDFS also supports
    an extension to the ISO9660 format, known as the Rock Ridge extensions. This gives
    additional "UNIX-like" file system qualities when the disk is mounted, with such
    extra file names and support for case-sensitive file names. Without these additions,
    the CD-ROM would only support 8.3 character upper-case file names. A command similar
    to the following would be used on a pre-5.0 system to mount this format:


    ```

    # mount -r t cdfs -o noversion,rrip <device> <mount-point>

    ```


    In Tru64 UNIX 5.0 and later, the -t and -o flags can be omitted.


    Tru64 can also read CDs created in native UFS format. These can be mounted directly
    or booted as if they were any UFS file system. UFS used to be the standard format
    for the Tru64 UNIX operating system, but has since been replaced by the ISO standard
    format. Mounting a CD is a simple matter of issuing a command similar to the following
    as at root:


    ```

    # mount -r <device> <mount-point>

    ```


    where the ‘-o’ flag indicates this is a read-only mount (synonymous with ‘-o ro").'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# 3.7.1.2 Playing Audio CDs


    Another format that can be read on a Tru64 system is the music CD format. This
    allows the operating system to play music through a set of speakers and sound
    card, if your system is so equipped. An application program as xcd is needed along
    with the necessary hardware to make this work properly. a utility that allows
    the playing of audio CDs, xmcd, is authored by Ti Tan. Xcd is a CD Player package
    that is composed of two utilities: xmcd, a CD player for the X Window System with
    a Motif graphical interface, and cda, a command-line-driver, text-mode CD player
    that also features a character-screen-oriented mode. Both utilities allow your
    CD-ROM drive to play music CDs. The xmcd package has a rich feature set including
    shuffle play and support for CD databases. See the xmcd web page for more information
    and a link to download a Tru64 UNIX binary distribution:


    ```

    http://sunisite.unc/~cddb/xmcd

    ```


    DVD-ROM is relatively new and is supported on Tru64 UNIX with the DVFS, or DVD-ROM
    File System. This file system supports the Universal Data Format (UDF). Naturally,
    newer systems will have drives capable of supporting the newer formats older CD-ROM
    drives do not support.


    # 3.7.2 Floppy Devices


    A floppy is a device that uses removable media, like a CD-ROM. However, the floppy
    media (known as a floppy disk) can also be written to. Also unlike the CD-ROM,
    the floppy has a very small number of blocks that you can use to store data. The
    standard 3.5 inch floppy will store only 1.44 MB of information. Not every Alpha
    system has a floppy drive, so you may have to purchase one if you wish to use
    it. In many ways, floppy disks are becoming less and less useful because of the
    limited amount of data they can hold, but they are still available and can still
    be used for functions such as the following:


    +   - Moving small files from one system to another when the network is not available


    +   - Updating firmware on some of your hardware controllers


    +   - Running programs from the Alpha system console, such as the SWXCR console


    +   - Transferring data from PCs to your Tru64 UNIX system


    You can use a floppy disk on your Tru64 UNIX system by putting a UFS file system
    on it, using it as a archive tool such as'
