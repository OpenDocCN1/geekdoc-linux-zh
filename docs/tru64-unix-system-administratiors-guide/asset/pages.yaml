  md: '# 8.4.1 Print Server Host Name


    When configuring a remote printer, it is necessary to know the host name of the
    print server that is hosting the printer. This host name is usually another computer
    accessible via the network. This may be another Tru64 UNIX system, a system running
    a different implementation of UNIX, or a non-UNIX system altogether. In the case
    of a standalone network printer, this host name may refer to the printer itself.
    You must be able to resolve the remote system, whether another computer or a network
    printer, by specifying the host name. This means that the host name and the IP
    address for the remote system must either be in the local /etc/hosts table or
    registered with the Domain Name Server (DNS). To test if this is the case, use
    the ping(1) command. For example, if the print server''s host name is jupiter,
    enter the following command:


    ```

    # /bin/ping -c 3 jupiter

    P jupiter.company.com (192.168.5.2): 56 data bytes

    64 bytes from 192.168.5.2: icmp_seq=0 ttl=62 time=2 ms

    64 bytes from 192.168.5.2: icmp_seq=1 ttl=62 time=1 ms

    64 bytes from 192.168.5.2: icmp_seq=2 ttl=62 time=1 ms

    jupiter.company.com PING Statistics-

    3 packets transmitted, 3 packets received, 0% packet loss

    round-trip (ms) min/avg/max = 1/1/2 ms

    ```


    In this example, the host name jupiter resolved to the IP address 192.168.5.2,
    and the system responded to pings, indicating that it is accessible via the network.


    # 8.4.2 Print Queue Name on the Print Server


    In addition to the host name of the print server, it is necessary to know the
    printer or queue name of the printer you wish to access. Contact the system administrator
    of the remote system for this information. If you have login access to the remote
    system, simply display the queues on that system with the following command:


    ```

    # lpc status

    printer is on device ''/dev/lp0\'' speed -1

    queuing is enabled

    printing is enabled

    no entries

    no daemon present

    ```'
