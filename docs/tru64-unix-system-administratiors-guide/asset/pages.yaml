    # 4.5.1 The setld(8) Utility


    Tru64 UNIX provides the setld command for managing software subsets on Tru64 UNIX
    system. The common pronunciation of the setld command is "set-ell-dee,\, although
    we have heard the term "set-load" used as well. The system administrator uses
    this tool to:


    +   * Display installed software subsets.

    * Load software subsets.

    * Delete installed software subsets.

    * Verify installed software subsets.

    * Configure an installed software subset.

    * Extract software subsets.


    Each of these functions is executed by running the setld command with the necessary
    argument(s). Invoking setld with no arguments displays a usage message showing
    the syntax of each of the functions. Each of the setld functions either requires,
    or can optionally accept, one or more software subset names as arguments. The
    software subset names are displayed with all letters in the name capitalized,
    the setld command is case insensitive and will accept subset names in all lower,
    all upper, or mixed case. But all the display function of setld requires root
    access to execute.


    # 4.5.2 Subset Inventory


    Probably the most use of the setld command is to display an inventory of all software
    subsets loaded on a Tru64 UNIX system. To perform this function, simply execute
    the following command:'
