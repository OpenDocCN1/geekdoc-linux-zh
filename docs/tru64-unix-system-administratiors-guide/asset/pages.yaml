  md: 'ment size is specified with the newfs command when the file system is created.


    +   Adjust the maximum number of blocks per cylinder group. This value, the maxbgpg
    parameter, is set when a UFS file system is created or an existing file system
    is modified by the tunesfs(8) command. The default value for maxbgpg is approximately
    one-fourth of the total blocks in a cylinder group, and this is designed to benefit
    file systems containing average file size. Access performance on large files is
