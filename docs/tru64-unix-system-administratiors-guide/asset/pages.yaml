    In addition, this initial system configuration is when the system''s personality
    (host name, date and time, root password) is configured. If any of these parameters
    were not specified at the time of installation, you will be prompted to enter
    them at this point.


    +   10. Kernel Build. Immediately after the initial system configuration, the
    custom system kernel is built for the first time. The kernel is built based on
    whether you chose Mandatory Only, All Options, or Customize earlier in the installation
    process. If you choose Customize, you will pick the appropriate kernel options
    from the list; otherwise the choice list is skipped.


    At this point, the system builds this initial kernel and then reboots. This completes
    the actual installation of Tru64 UNIX.


    +   11. Login as Root to Continue System Configuration. After the system reboots,
    login as root using the previously specified root password to continue the system
    configuration. Refer to Chapter 4, “System Configuration,” for details on post-installation
    tasks.


