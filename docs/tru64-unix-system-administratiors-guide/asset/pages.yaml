    # 8.3.4.1 Adding a Printer Entry to /etc/printcap


    There are several ways to add, delete, or modify entries in the /etc/printcap
    file:


    +   - Manually, with an editor such as vi

    - With the lprsetup utility

    - With the Print Configuration application


