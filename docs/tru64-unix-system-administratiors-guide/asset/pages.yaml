  md: '# 8.6 Managing the Local Printing System


    +   - Change the order of jobs in a print queue

    - Display the status of printers, print queues, and the printer daemon


    The lpc utility has two modes of operation, command driven and interactive. The
    mode is determined by how the utility is invoked. If lpc is run with no arguments,
    it assumes that the user desires the interactive mode and displays an "lpc>" prompt,
    waiting for input. When arguments are supplied from the command line, lpc executes
    the command provided as the argument and exits. See the reference page for lpc
    for a list of the lpc commands.


    The following is an example of an interactive lpc session:


    ```

    lpc

    lpc> status

    draft:

    printer is on device ''/dev/lp0'' speed -1

    queuing is enabled

    printing is enabled

    no entries

    no daemon present

    lpc>

    ```


    Part of a system administrator''s role is to manage printers and print queues.
    If, for instance, a particular printer needs repair and will be unavailable for
    a period of time, you can use the lpc command to mark the printer as "down," which
    disables printing. The lpc "down" command expects a message that should indicate
    the cause of the printer unavailability and perhaps an estimated outage duration.
    For example, the following command will accomplish this:


    ```

    lpc down draft "Draft printer down for repair until 3pm Monday."

    draft:

    printer and queuing disabled

    # lpcq -P draft

    Warning: draft is down:

    Warning: draft queue is turned off

    Draft printer down for repairs until 3pm Monday.

    no entries

    ```


    Notice that the lpc command reports that the printer is down and the queue is
    disabled, and the message entered with the "lpc down" command is also displayed.
    Once the printer is repaired, simply cancel the printer "down" operation with
    the following command:


    ```

    lpc up draft

    ```'
