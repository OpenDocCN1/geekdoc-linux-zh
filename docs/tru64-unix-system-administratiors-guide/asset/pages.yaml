    # 4.6.2.2 LMF Database Files


    The LMF database files are located, by default, in /var/adm/lmf and consist of
    two files:


    +   - ldb—The actual LMF database file

    - ldb_history—The license management history file, which is a record of all LMF
    maintenance commands that have been issued on the system


    The LMF database files are binary files and should not be edited or modified except
    via the utilities provided by the LMF. However, the database files can be safely
    copied using the cp command as long as no LMF activities are occurring. Once the
    LMF database is populated with a system’s licenses, the license information into
    the system’s cache. This cache, the database files are normally only accessed
    at the system startup to copy the license information, not the database on disk,
    is what is accessed by a software product when verifying a valid license is registered.
    To maintain database consistency, always copy both files (ldb and ldb_history)
    together when backing them up, whether to tape or to another directory.


    # 4.6.2.3 The Lmf(8) Utility


    The principal tool provided by Tru64 UNIX to manage and manipulate the license
    database is the Lmf(8) command. The Lmf command is used to register new licenses,
    delete existing registered licenses, update the system’s cache, and carry out
    other license maintenance tasks. The Lmf command is, by default, executable by
    all users. However, the LMF database files are normally only readable and writable
    by the root user. The effective result of this is that the Lmf command is only
    usable by root, as probably should be the case. Do not change the ownership of
    the LMF database files.


    The Lmf command has two modes: command line arguments and an interactive environment.
    Both modes provide identical functionality, and the'
