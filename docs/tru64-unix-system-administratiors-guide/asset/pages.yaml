  md: '# 2.3.7.1 Firmware Update CD-ROM


    The simplest method of loading the firmware update utility is via a Compaq Alpha
    Systems Firmware Update CD-ROM. This CD-ROM is usually included with the Tru64
    UNIX Distribution Kit but occasionally shipped from Compaq as the CD-ROM is updated
    on a quarterly basis. This CD-ROM is versioned and contains the latest version
    of the Console firmware for each Compaq Alpha system. The Firmware Update CD-ROM
    also contains one previous version of each system''s Console firmware so that
    the firmware can be downgraded in a problem arises after updating a system to
    the latest version. In addition, system-specific Release Notes on the CD-ROM provide
    information about the Console firmware version.


    # 2.3.7.2 Booting from the Firmware Update CD-ROM


    To boot from the Firmware Update CD-ROM, simply insert the CD into the CD-ROM
    drive and from the SRM Console prompt (>>>), issue the following-command:


    ```

    >>> boot <CD-ROM drive Device Name>

    ```


    Substitute the previously determined CD-ROM device name in the boot command. Using
    the previous example, the command would be:


    ```

    >>> boot DQAO

    ```


    The system will then proceed to boot from the Firmware Update CD-ROM, and after
    several minutes of boot activity, the first screen of system-specific README-First
    information announcements will be displayed. This README information may include
    details of firmware changes or enhancements, known problems, and the directory
    location on the CD of the firmware Release Notes. Simply press the <Return> key
    to scroll through the information or press <CTRL/C> to skip the remainder of the
    screen. It is a good idea to scan this information for issues that may impact
    your system at this time.


    After the final screen of README information, the default firmware update utility
    bootfilename will be displayed, followed by prompt Bootfile:. At this point, simply
    press <Return> to load the default (latest) version of the update utility, or
    type a specific firmware update utility bootfilename to load an alternate, usually
    older version. For example:'
