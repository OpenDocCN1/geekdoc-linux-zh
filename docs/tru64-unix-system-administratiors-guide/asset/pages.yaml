    to vdump/vstore, dump/restore, and rdump/rvestore, except where noted. The vdump
    and vstore utilities are designed to back up and restore entire filesets (or UFS
    file systems, in the case of dump/restore). However, the vdump utility provides
    the ability to back up directories, though not individual files, and the vstore
    utility allows recovery of individual directories or files. Incremental backups
    are supported, which makes rdump an acceptable method of doing regular system
    backups.


    # 11.2.3.3 vdump(8)


    Since the vdump utility only does backups, as opposed to the tar command that
    is used for both backup and restore operations, its syntax is fairly straightforward.
    The command-line switches of the vdump command are listed in Table 11.3.


    | Argument | Meaning |

    | --- | --- |

    | -0-9 | Specifies the dump level. A level 0 dump backs up the entire fileset
    to the backup device. The default dump level is 9. |

    | -C | Causes vdump to compress the data as it is backed up. This minimizes the
    size of the resulting dump file at the expense of the time needed to do the compression.
    |

    | -D | Dumps only the specified subdirectory of a fileset to the backup device.
    When the flag is used, the dump level specification is ignored, and a level-0
    backup is run regardless of the dump level. Without the -D flag, the vdump command
    backs up the entire fileset that contains the subdirectory. Only a single subdirectory
    may be backed up. |

    | F #_of_buffers | Specifies the number of in-memory buffers. The valid range
    is 1 through 64 buffers; the default is 8. Specifying more buffers may increase
    the performance of vdump. |

    | -N | Disables the rewinding of the tape and placing the tape offline after completing
    the vdump session. By default, when the command finishes backing up a file system,
    it rewinds the tape and takes it offline. The -N flag is the default when the
    -f parameter is a no-rewind tape device; e.g., /dev/nmt*. |

    | -V | Displays the version of vdump. |

    | -b #_of_blocks | Specifies the number of blocks (1024-bytes each) for writes.
    The valid range is 1 to 64 blocks; the default is 60 blocks. |'
