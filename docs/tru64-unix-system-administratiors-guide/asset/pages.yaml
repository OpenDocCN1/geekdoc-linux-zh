    shell /bin/sh

    ```


    To change the default base directory for new accounts to /home, replace the string
    "/usr/users" with "home" in $HOME/.sysman/ Account_defaults and restart Account
    Manager. You can also do this with the user-command (see Section 5.3.3) as follows:


    ```

    # usermod -D -d /home

    ```


    Account Manager, along with most of the other account management tools, ensures
    that only one privileged user can modify the password database at a time. It does
    this by creating a lock file /etc/.AM_is_running. If this file already exists
    when Account Manager starts, it exits with the message "The password and group
    files are currently locked by another user." If Account Manager doesn''t exit
    normally (e.g., if the system crashes while Account Manager is running), the file
    will not be deleted, and subsequent attempts to run Account Manager will fail
    with the "locked by another user" message. If this happens, make sure that there
    are no other users running Account Manager, then remove /etc/.AM_is_running. In
    addition, there are a few other files whose existence can lock out or all of the
    account management utilities:


    ```

    /etc/passwd.dir.new

    /etc/passwd.pag.new

    /etc/passwd.ptmp

    /etc/ptmp

    /etc/ptmp.dir

    /etc/ptmp.pag

    /var/yp/src/passwd.AM_orig

    /var/yp/src/passwd.ptmp

    ```'
