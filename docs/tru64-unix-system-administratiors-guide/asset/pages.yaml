    # 9.9.1 cron and crontabs


    The cron facility is the most common method of scheduling processes for future
    execution. The cron facility is composed of two main parts: the cron daemon itself,
    which is always running while the system is in multiuser mode, and the cron tables
    (crontabs), which contain the commands to be run and their execution schedules.
    In addition, there is a mechanism to restrict the ability to submit jobs for execution
    via cron; by default, all users can submit jobs to cron.


    The cron daemon is the primary component of the cron facility and is normally
    started when the system is booted. There should be only one instance of cron running,
    since cron exits only when explicitly killed or when the system shuts down. The
    cron daemon logs its startups in /var/adm/cron.log. When cron starts, or when
    it is signaled that a crontab has been modified, cron reads all existing crontab
    files, which are located in the /var/spool/cron/crontabs directory. This avoids
    the overhead of checking the crontab files for changes on a periodic basis.


    Each crontab file contains a list of commands for cron to execute on behalf of
    a particular user, along with the scheduling information that defines when to
    run the commands. Each line of a crontab contains the following six fields:


    +   1. The minute of the hour (0 to 59)

    2. The hour of the day (0 to 23)

    3. The day of the month (1 to 31)

    4. The month of the year (1 to 12)

    5. The day of the week (0 to 6 for Sunday to Saturday)

    6. The command to be executed


    The first five date fields may be a single integer to indicate a single value,
    a comma-separated list of integers for multiple values, two integers separated
    by a dash to indicate an inclusive range of values, or an asterisk (*) to indicate
    all possible values for a date field. For example, to redirect the output of a
    ps command into a file every 15 minutes on Monday through Friday, the following
    crontab entry will do the trick:


    ```

    0,15,30,45 * * 1-5 /usr/bin/ps -ef >> /tmp/ps.out

    ```'
