  md: '# 3.4 Managing Disks


    Disk is unlabeled or, /dev/rdisk/dsk8c is not in block 0 of the disk


    Note while the simple disk name (dsk8) is specified as the disklabel argument,
    the disklabel command actually translates into a full pathname to the character
    special device file (/dev/rdisk/dsk8c). It is perfectly legal to specify the fully
    qualified character special device file, but using just the simple disk name is
    a convenient shorthand. If a particular partition is not specified, the disklabel
    command uses the first partition that starts at block zero on the disk. Typically,
    this is the “a” or “c” partition.


    The disk label command cannot be used to label a partition that is open or in
    use. This includes the partition used as the “handle”, therefore, if you intend
    to alter the “a” partition’s parameters, for example, you must specify the “c”
    handle or an error will be returned


    Once any existing disk label is removed from a disk, the disklabel command to
    write a new default disk label. The syntax for writing a new disk label varies,
    depending on whether the disk to be labeled is a non-bootable disk or a bootable
    system disk. The most common will for non-bootable disks, but the ability to label
    a bootable disk is equally important, especially in a recovery situation when
    the system disk must be relabeled prior to restoring its contents from a backup.


    To label a normal (non-bootable) disk, use a command similar to the following:


    ```

    disklabel -rw dsk8 RK26N

    ```


    The “r” flag instructs the disklabel command to write the new label directly to
    the disk rather than to an in-memory cache. The “w” flag simply means to write
    a default label to the disk, in this case, dsk8. The final parameter is the disk
    type or model number. If known, specify the correct value. In the event that the
    disk being labeled is Compaq RK26N. If the disk type is unknown, using a value
    of “UNKNOWN” will cause the disklabel command to query the disk driver for the
    disk’s geometry. For example:


    ```

    disklabel -rw dsk8 UNKNOWN

    ```


    To label the disk and configure it as a bootable system disk, an additional command
    line argument must be specified. This argument, “t”, is used to indicate disklabel
    the type of root file system. The disklabel command will write the appropriate
    bootstrap programs to the boot block area on the disk.'
