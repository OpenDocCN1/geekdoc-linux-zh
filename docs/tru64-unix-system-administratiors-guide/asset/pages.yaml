  md: 'capacity of a system, whether that consists of one or more actual processors.
    The CPU is the resource that actually executes instructions, and is frequently
    perceived by users to be the primary factor in specifying overall system speed.
    The speed of a given machine is a function of that system''s CPU cycle time; the
    greater the clock speed of the process, the faster the CPU. However, doubling
    the clock speed of the Alpha chip in a system may not automatically double the
    overall speed of a system. The same notion holds true for the number of CPUs in
    the system. A system containing two CPUs is not likely to be exactly as fast as
    a system with only one CPU of the same type. There are a number of other factors
    that influence the speed with which individual instructions are executed on a
    given system, as:


    +   - Number of CPUs in the system

    - Complexity of the instructions being executed

    - Effectiveness of memory caches (See Section 10.4.2, “The Memory Resource")


    In addition, there is the issue of process scheduling and priority. A process
    with a higher priority will typically negatively impact a process with a lower
    priority. By default, Tru64 UNIX favors interactive processes over compute-intensive
    processes by maintaining or raising the priorities of the interactive processes.
    A system administrator must be able to monitor CPU utilization and process scheduling
    status in order to understand and perform-ances.


    The CPU is always running in one of two modes, kernel mode or user mode, at any
    time. Kernel mode is a privileged access mode that handles most operating system
    functions. For example, handling hardware and software interrupts and processing
    system calls are done in kernel mode. User application processes, on the other
    hand, run in user mode, which is less privileged than kernel mode. If a user process
    makes a system call, however, the CPU switches to kernel mode to process it.


    There is no rule of thumb regarding an acceptable ratio of CPU time spent in kernel
    mode versus user mode. The distribution depends on a variety of factors including
    the type of applications running (database, graphics, development, networking,
    etc.), the number of system calls the applications make, and the state of the
    system (system health, number of users, etc.). It is therefore crucial that a
    system administrator have the experience to know what is “normal” for a given
    system.'
