    To help users transform their existing UFS and AdvFS systems into LSM logical
    volumes, Compaq has developed a utility that will transform each partition in
    use by UFS or AdvFS into a nonstriped, nonmirrored volume. After the transformation
    is complete, the system administrator can mirror the volume if desired. This feature
    is known as encapsulation.


    In order to utilize a disk under LSM, it must be added to LSM. Devices can be
    added as one of three types: Sliced, Simple, or Nopriv (encapsulated). Each of
    these is described as follows:


    +   - **Sliced**: The entire disk is dedicated to LSM. The disk will have two
    regions shown in the disk label: the public and private regions. The public region
    contains those blocks that are usable for LSM volumes, and the private region
    is reserved for use by the LSM subsystem metadata. This is by far the best way
    to use a disk in LSM.


    +   - **Simple**: Only one partition is being used by LSM. In this case the public
    and private regions are combined into one partition on a disk.


    +   - **Nopriv**: This is an encapsulated file system. You can take an existing
    file system and encapsulate the blocks containing the file system''s data, making
    them part of LSM. No private data is used for this type of LSM disk.


    To add an entire disk to the LSM subsystem, you have many choices available including
    several command-line tools, the voiddisk(8) menu systems, or the dxlstm(8) or
    lsmsa(8) graphical interfaces. The voiddiskadd(8) command is the easiest method:


