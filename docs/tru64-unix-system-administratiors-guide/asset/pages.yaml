    debugger (see Figure 10.3). A good hit rate is 95% or better. If the hit rate
    is below 90%, you may want to consider increasing the ubc_minpercent attribute
    to increase the minimum size of the UBC, thereby increasing its effectiveness.


    # 10.4.2.4 Tuning Memory


    Memory performance issues are typically caused by either an insufficiency in one
    or more of the three types of memory resources, or an inefficient use of existing
    memory resources. The former situation is addressed by adding more of the required
    resource (RAM, cache, or swap space), or demanding less of the existing memory
    resource, e.g., by shifting usage to off-peak hours. The latter situation is when
    a system administrator can make adjustments. Suggestions to focus on are:


    +   - Kernel configuration

    - Traditional/unified buffer cache sizing

    - Swap space configuration'
