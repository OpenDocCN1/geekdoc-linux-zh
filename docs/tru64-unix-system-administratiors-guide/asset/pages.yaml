    | /dev/disk/floppy[x] | Floppy block special device |

    | /dev/rdisk/floppy[x] | Floppy character special device |

    | /dev/disk/cdrom[x] | CD-ROM block special device |

    | /dev/rdisk/cdrom[x] | CD-ROM character special device |


    As most UNIX administrators know, devices come in two flavors: character and block
    special. Character device special files are used for reading from and writing
    to devices that must be accessed character at a time. Some examples of this type
    of device are a terminal (tty) or a SCSI tape (tz) device. On the other hand,
    block devices must be accessed one disk block (512 bytes) at a time. The block
    devices seen every day on a typical Tru64 UNIX system are disk devices such as
    SCSI hard, CD-ROM disks and floppy. In this section, we will discuss some of these
    different devices (disks and tapes).


    # 3.3.2 SCSI Disks


    SCSI disks are the most common device for storing and retrieving files on a computer
    system. On a Tru64 UNIX system, the SCSI disks are normally contained in a shelf
    or are internally mounted in a system cabinet. Dis can be used in either a raw
    or block-oriented fashion, depending upon what the application requires. If raw
    disks are used, the application, such as a commercial database product, must keep
    track of the disk organization and manage the available space. Normally, disks
    will be used in a block-oriented fashion and will therefore have file systems
    on them. In that case, the operating system will keep track of the on-disk organization
    for you and provide tools for backing up and otherwise manipulating the files.
    See the discussion in Chapter 11 for more information on making system backups
    for both character and block devices.'
