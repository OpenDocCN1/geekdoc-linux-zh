- img_proc: true
  md: 'The cpio command is used both to create archives and to restore files from
    archives; not surprisingly, there are two main cpio command-line switches to accomplish
    these two functions:


    +   - cpio -o This command reads filenames from standard input and copies files
    to a specified archive (either tape or a operating system file).


    +   - cpio -i This command reads a cpio archive from standard input and copies
    it from the specified files.


    These descriptions identify one unique characteristic of cpio: cpio expects to
    get its input, whether this is a list of files to back up or an existing archive
    to restore, from standard input. For example, to back up all the files in the
    /home subdirectory to a tape drive with cpio, use the following command:


    ```

    find /home -print | cpio -o -0/dev/tape/tape0

    ```


    The find(1) command is used to generate a list of all the files and directories
    under /home. This list is then piped to cpio, which copies the files specified
    in the list to the tape device specified by the -O flag.


    The restoration of files from a cpio(1) archive is somewhat more straightforward:


    ```

    cpio -idm -I/dev/tape/tape0

    ```


    This command restores the files previously saved onto /dev/tape/tape0 by cpio.
    The "d" flag specifies that any directories saved in the archive should be recreated
    by cpio if necessary, and the "m" flag tells cpio to maintain the last modification
    time when the files were archived.


    Finally, it is often useful to be able to display the contents of a cpio archive.
    A variation of the "cpio -i" command displays the filenames contained in an archive.
    This command is:


    ```

    cpio -it -I/dev/tape/tape0

    ```


    The cpio command is not quite obsolete, for it continues to be used by some people
    to generate "portable" archives that can be read by many different flavors of
    UNIX. Therefore, knowing how to list and extract the contents of a cpio archive
    continues to be a useful and necessary skill. This section gives just a small
    taste of this tool''s capabilities. It is suggested that anyone looking'
