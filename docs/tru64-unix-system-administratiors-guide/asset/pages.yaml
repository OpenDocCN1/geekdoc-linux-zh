    The local binlog does not accept binlog messages from just any remote host. If
    the /etc/binlog.auth file does not exist or is empty or contains no valid remote
    host names, the binlog will not accept forwarded messages from any remote host.
    If the file does exist, then binlog will accept messages only from the listed
    hosts. The format of this file is simply the list of fully qualified remote host
    names, per line:


