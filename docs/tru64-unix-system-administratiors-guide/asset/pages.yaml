- img_proc: true
  md: '# 5.9 Communicating with Users


    A system administrator frequently needs to communicate important information to
    both the general user community and to individual users. Tru64 UNIX provides several
    mechanisms for you to communicate with your users:


    +   - The message of the day (/etc/motd)

    - The system identification file (/etc/issue)

    - System news

    - talk

    - write and wall ( All)


    # 5.9.1 Message of the Day


    When you have something that is not particularly urgent to tell your users, such
    as when the next scheduled reboot will occur, the message of the day (motd) is
    a useful mechanism. Simply edit (or create) the file /etc/motd with a text editor
    such as vi, and enter the text that you want to show your users. This file is
    displayed to each user, every time they log in to the system. The main drawback
    to using the motd as a communication channel is that a user can suppress the display
    of the motd by simply placing a .hushlogin file in the user''s home directory:


    ```

    $ touch $HOME/.hushlogin

    ```


    Because the motd does not change often, users become accustomed to its contents
    and will tend to ignore or miss important information. As such, it''s best to
    place only reasonably static information in the /etc/motd file: the Tru64 UNIX
    version, the system host name and IP address, and the standard legale disclaimer
    required by local policy. This way, experienced users can safely ignore the motd,
    but the information is there for new users.


    # 5.9.2 System Identification File


    While the contents of the message of the day file (/etc/motd) are displayed after
    a user successfully logs in, Tru64 UNIX provides a mechanism to identify the system
    before the login prompt is presented. Simply edit (or create) the /etc/issue file
    with a text editor, and insert the text you wish to be displayed. If /etc/issue
    exists, the getty(8) command writes its contents to the screen prior to starting
    the login dialogue. Typically, a system administrator'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'may want to display identification information such as host name, location,
    or contact instructions. Other sites may be required to present a standard disclaimer
    to warn against unauthorized system access.


    The /etc/issue file is primarily for serial terminal connections, including a
    remote console. Tru664 UNIX provides a second file, /etc/issue.net, which works
    identically to /etc/issue, except that the contents of the /etc/issue.net file
    are displayed by the telnet(8) daemon for a new connection prior to starting the
    login dialogue. If /etc/issue exists and /etc/issue does not, the telnetd daemon
    displays the contents of the /etc/issue file.


    # 5.9.3 System News


    System news, not to be confused with USENET News, is a little-used mechanism that
    is handy for presenting information to your users. News consists of two pieces:
    the news program itself (/usr/bin/news), and the news directory (/usr/news). To
    set up news on your system, add the following command to:


    ```

    /usr/bin/news

    ```


    This command will have no effect until you create one or more news items. A news
    item is a text file placed in the /usr/news directory. For example:


    > This system will be unavailable for two hours on Friday, June 29, starting at
    01:00 for the installation of a new disk array. A full system backup will be taken
    immediately prior to the shutdown. Your friendly system administrator.


    The next time a user logs in, the following will be displayed immediately after
    the message of the day:


    ```

    root (root) Mon Jun 25 18:39:36 2001

    This system will be unavailable for two hours on Friday, June 29, starting at
    01:00 for the installation of a new disk array. A full system backup will be taken
    immediately prior to the shutdown. Your friendly system administrator.

    ```


    One nice feature of news is that each particular news item will be displayed only
    once for each user. The news program keeps track of items which have been seen
    by placing a file in each user''s home directory ($HOME/.news_time) that is used
    as a time-stamp to determine whether a news item has been seen.'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'A user can see all news items at any time, regardless of whether they have
    already been seen, by issuing this command:


    ```

    $ news -a

    ```


    Finally, news is not just for the system administrator. To allow non-root users
    to place news items in the news directory, change the permissions of the news
    directory to allow world-writable access:


    ```

    # chmod 1777 /usr/news

    ```


    The “1” in the permission bits sets the sticky bit (1000 octal) on the /usr/news
    directory. Setting the sticky bit is recommended for any world-writable directory;
    it prevents users from deleting other users'' files in the directory—in this case,
    other users'' news items.


    # 5.9.4 talk, write, and wall


    The message of the day, the /etc/issue file, and system news create passive communication
    mechanisms, i.e., you as the superuser create messages to be seen at a later time
    as users log in. A more immediate method is required when you are logged in and
    need to communicate immediately with other logged-in users. There are three commands
    that provide this kind of immediate communication.


    The talk(1) program allows you to have a two-way conversation with another user.
    In its simplest form, the command is:


    ```

    # talk username

    ```


    where username is the account name of the user you wish to talk to. If the target-user
    is logged in, the screen of the user who initiates the talk session displays a
    split-screen talk talk interface with the following status line:


    ```

    [Waiting for your party to respond]

    ```


    and the target user will see the following invitation:


    ```

    Message from Talk_Daemon@pluto at 19:17 ...ntalk: connection requested by root@pluto.

    talk: respond with: talk root@pluto

    ```


    If the target user chooses to accept the invitation and join the talk session,
    all the user needs to do is respond with the suggested command:'
  merge: -1
  pgno: 209
- img_proc: true
  md: '```

    $ talk root@pluto

    ```


    At this point, the target user''s screen also displays the same split-screen talk
    interface, and the two users are now connected. Whatever each user types (including
    typos and backspaces) in the top half of this display is simultaneously displayed
    on the bottom half of the other user''s screen. If either user''s screen becomes
    disrupted, by by additional talk invitations, pressing Ctrl-L will refresh the
    screen. Finally, either user can end the session by pressing either the interrupt
    key sequence, which is usually Ctrl-C, or the end-of-file key sequence, typically
    Ctrl-D.


    If the target user is logged on more than once, there is an additional command
    line argument to talk, tty-name, to specify which the initiating user would like
    to send the talk invitation to. To determine which tty you need, issue the who(1)
    command, and the second column of the output specifies the tty for each login
    session. For example:


    ```

    # who console Jun 6 09:34

    root tty4 Jun 6 15:45 <- This session is the most

    mcheek tty3 Jun 3 09:35

    mcheek ttypl1 Jun 3 09:35

    # talk mcheek tty4

    ```


    write(1) is similar to talk in that it is directed to only one active user account.
    The difference is that write is only one-way rather than interactive. The syntax
    of write is similar to talk:


    ```

    # write username [tty-name]

    ```


    After issuing the write command, any text you type is immediately displayed on
    the target user''s screen, one line at a time, preceded with an identifying header,
    regardless of what they are doing or which application they are currently running.
    Since each line is not sent until a carriage return is entered, keep lines short
    if a multi-line message is being sent. This avoids frustrating the target user
    with long delays between lines of the message. Sending continues until the sender
    user enters the end-of-file key sequence, usually Ctrl-D.


    write should be used sparingly, as users will be annoyed by uninvited messages
    or talk invitations are constantly appearing on their screens, possibly disrupting
    their work. UNIX even provides a command that users can use to block incoming
    talks or writes: the mesg(1) command. By default, incoming'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'talk requests and writes are enabled. The mesg command acts as a toggle to
    enable or disable them. The “n” argument blocks incoming communications:


    ```

    $ mesg n

    ```


    When a user has blocked incoming messages in this manner, other users attempting
    to talk or write to that user receive the following error message:


    > [Your party is refusing messages]


    Similarly, “mesg y” enables incoming talks and writes, and issuing the mesg command
    with no arguments reports the current message permission setting (yes or no).
    The superuser account (root) can issue talk invitations and send write to any
    terminal regardless of the user’s mesg setting.


    wall(1) is nearly identical to write, with one important exception: the text is
    sent to all logged-in users. Running wall with no command line arguments behave
    like write in that any text you type, including carriage returns, is immediately
    displayed on all logged-in users’ screens, preceded with a broad-caster, regardless
    of what they are doing. wall also has the ability to read from a prepared file,
    which can be useful for broadcasting prepared statements concerning periodic events
    such as system reboots. For example, to broadcast the contents of a file, issue
    the following command:


    ```

    # wall /tmp/shutdown.txt

    ```


    All logged-in users will see the following on their screen:


    ```

    Broadcast Message from root@pluto (console) at 19:50 ...

    The system will be shut down in 10 minutes to perform a cold

    backup. Please save your work and log off. The system will be

    available in approx. 1 hour.

    ```'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Security


    # 6.1 Tru64 UNIX Security


    This chapter describes several important aspects of Tru64 UNIX system security.
    As a system administrator, you are responsible for the overall security of your
    system, which includes both physical system security and Tru64 UNIX user security.
    By default, Tru64 UNIX is installed with a minimal security configuration, which
    may be sufficient for a noncritical, single-user workstation. For a system that
    supports a mission-critical application or is connected to the Internet, however,
    the default minimal security configuration may be inadequate. The purpose of this
    chapter is to address ways to improve system security with the goal of a more
    secure Tru64 UNIX system. The following topics will be covered:


    +   - Physical security

    - Resetting passwords

    - Login controls

    - The trusted host facility

    - Enhanced security

    - Auditing

