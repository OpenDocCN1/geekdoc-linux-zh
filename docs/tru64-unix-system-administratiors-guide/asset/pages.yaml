  md: '# Routing


    Routing is the process whereby network packets are routed or directed to from
    different networks. The TCP/IP networking subsystem on a system is able to accomplish
    the routing of information by consulting a list that contains instructions on
    where to send any particular packet''s destination address. This list, the routing
    table, is basically a list of destination networks or hosts, the corresponding
    network interface, and the next stop on the way to the final destination. For
    instance, consider the following routing table:


    ```

    # /usr/bin/netstat -nr

    Routing tables

    Destination Flags Refs Use Interface

    default 192.168.171.254 UGS 0 44 tu0

    127.0.0.1 127.0.0.1 UH 3 4294 lo0

    192.168.171/24 192.168.171.78 U 4 1166 tu0

    ```


    Note that there are three records in this table, each providing routing instructions
    for a different destination. Every destination address, and the networking software
    takes that destination address and compares it with the destination value of each
    routing table entry, starting at the bottom, looking for a match. For example,
    a packet destined for IP address 172.31.12.75 does not match the third destination,
    which is for the range of 192.168.171.0 to 192.168.171.254. This route is for
    systems on the local network, and packets for this destination are sent out the
    local Ethernet interface (192.168.171.178). The second destination (127.0.0.1)
    matches packets destined for services on the local system, and this route is to
    keep internal packets from ever going out the network. The route is the loopback
    interface that “loops” the packets right back into the system. The first and final
    destination are labeled “default.” Since our imaginary packet destination (172.31.12.75)
    does not match any destination in the routing table, this default route is applied.
    This instructs the networking software to pass the packet onto the gateway at
    192.168.171.254, which will accept the packet and then repeat the process, comparing
    the packet''s destination address to its own routing table. Section 7.7 for information
    on Gateways. This simple example shows how network packets are routed from host
    to host until they arrive at their final destination. Each step, or hop, gets
    the packet a little closer to its destination.


    There are three ways of managing the routing table on a Tru64 UNIX system: minimal,
    static, and dynamic. Determining routing configuration'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'to use depends on the size and type of the network system is connected to.

    The three types of routing configuration are explained as follows.


    # 7.6.1 Minimal


    A minimal routing configuration is one contains only the routes created

    when the ifconfig(8) command activated the networking system. Typically,

    this means only a single route corresponds to each network interface in

    , plus the loopback route. This configuration is sufficient for small net-

    works that are not connected to any other networks or are subnetted. For this

    configuration, no additional steps are necessary to manage the routing table.

    Here is an example of a minimal routing table:


    | Destination Gateway Flags Refs Use Interface |

    | 127.0.0.1 | 127.0.0.1 | UH 3 | 4294 | lo0 |

    | 192.168.171/24 | 192.168.171.78 | U 4 | 1166 | tu0 |


    # 7.6.2 Static


    A static routing configuration is characterized by a routing table that contains,

    in addition to the routes present in a minimal configuration, one or more

    routes added manually by the system administrator. The simplest static rout-

    ing table has one additional route: a Default route that points to a gateway

    where all nonlocal network traffic should be directed. Additionally, there may

    be other, special static routes added in order to route certain packets to

    hosts or networks. These static routes are managed manually by the route(8)

    command. The following example demonstrates adding a static route to a net-

    work to the routing table:


    ```

    # /usr/sbin/netstat -nr

    Routing tables

    Destination Gateway Flags Refs Use Interface

    default 192.168.171.254 UGS 0 44 tu0

    127.0.0.1 127.0.0.1 UH 3 4294 lo0

    192.168.171/24 192.168.171.78 U 4 1166 tu0

    # /usr/sbin/route add -net 192.168.159 192.168.171.101

    # /usr/sbin/netstat -nr

    Routing tables

    Destination Gateway Flags Refs Use Interface

    default 192.168.171.254 UGS 0 44 tu0

    127.0.0.1 127.0.0.1 UH 3 4294 lo0

    192.168.159/24 192.168.171.101 UGS 0 0 tu0

    192.168.171/24 192.168.171.78 U 4 1166 tu0

    ```'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'The first netstat command displays the routing table showing a default route,
    a loopback route to the local host, and a route to network 192.168.171 through
    interface tu0. The route add command adds a static route to another network (192.168.159)
    through interface tu0, with the next destination being the host at IP address
    192.168.171.101. The second netstat command again displays the routing table,
    and the newly added static route is now displayed immediately after the loopback
    route.


    # 7.6.3 Dynamic


    In a dynamic routing configuration, the routing table is dynamically updated by
    a program using one or more routing protocols to determine the "best" route to
    a destination. The program is able to dynamically react and reroute around temporary
    or permanent network outages. Dynamic routing should be used on a network, which
    has more than one possible route to a destination. Tru64 UNIX provides two routing
    daemons (pronounced "route d") and gated ("gate d"). The routed daemon is the
    older of the two daemons and also the least flexible, for it understands only
    one routing protocol, RIP (Routing Information Protocol). RIP is well suited for
    local area networks and is therefore very commonly used. The gated daemon is a
    more modern program and understands RIP as well as several other routing protocols.
    The gated daemon is normally considered a replacement for routed. You can run
    either gated or routed on a system but not both. If the only routing protocol
    in use is or will be RIP, it is generally recommended to run routed, though gated
    will also do RIP. If, however, the network is running a routing protocol different
    from RIP, you must run gated. It is beyond the scope of this text to explore IP
    routing and routing protocols. Refer to one of the recommended references on TCP/IP
    networking in Appendix B for further information on configuring routing daemons
    and routing protocols.


    # 7.7 Gateway


    A system is able to communicate directly with other systems located on the same
    network or subnet. In order to reach a system on a different network, a system
    must go through a gateway. A gateway is typically a dedicated piece of hardware,
    either a repeater, a bridge, or a router, but a computer system may also function
    as a gateway if it has more than one network interface.'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'The simplest types of gateways are repeaters and bridges, which are used to
    connect distinct network cable sections to overcome network distance limitations.
    Repeaters and bridges extend a single network rather than connecting different
    networks together. A repeater simply passes all network traffic between the two
    network segments without any type of filtering or modification. A bridge is an
    intelligent repeater and has the ability to filter traffic based on various criteria.


    The most common type of gateway is known as a router, so named because it "routes"
    network traffic between different networks. A router has connections simultaneously
    on multiple networks. All network traffic originating on a specific network and
    destined for systems on remote networks must travel through this router, which
    is also called a default route. A router is usually a stand-alone device with
    sophisticated software that has the ability to examine individual network packets
    and make a determination, based on source, destination, or type, whether to forward
    the packet on another network.


    When configuration TCP/IP networking on a Tru64 UNIX system, it is usually not
    necessary to know what type your gateway is. Simply knowing the IP address of
    the gateway is sufficient. For example, Figure 7.6 shows two networks connected
    by a Gateway. Host 1 is able to communicate with Host 2 directly without traveling
    through the gateway, but in order to communicate with Host 3, the network traffic
    must be routed through the gateway between the two networks. Providing the gateway''s
    address instructs


    ![](img/3eed431236346b7d400c9572311a8aa8_262_0.png)'
  merge: -1
  pgno: 262
