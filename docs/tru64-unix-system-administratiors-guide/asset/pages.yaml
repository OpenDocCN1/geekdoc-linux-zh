    # 7.12 Summary


    In this chapter, we have discussed some of the details of the network services
    available to the average Tru64 UNIX system. Since most systems today must participate
    with other systems on an intranet or over the Internet this is a critical part
    of the average administrator’s job. You should understand enough how a Tru64 UNIX
    system is networked given the information presented here to set up basic services
