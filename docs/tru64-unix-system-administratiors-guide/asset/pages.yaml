    # 12.4 Event Management (EVM)


    New as of Tru64 UNIX V5.0 is the Event Manager or (EVM). EVM serves to unify events
    from a variety of channels into a single source. EVM works in cooperation with
    syslog and binlogd - This section will give a brief overview of what EVM is and
    how to use it.


    Consider the participants of the EVM system:


    +   - Events—indications that something interesting happened'
