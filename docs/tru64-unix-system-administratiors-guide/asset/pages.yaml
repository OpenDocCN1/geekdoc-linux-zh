    # Table 5.1 Common Shell Environment Variables


    | Environment Variable | Description |

    | --- | --- |

    | DISPLAY | Default display for X-Windows applications |

    | EDITOR | Default editor |

    | HOME | Home directory |

    | LOGNAME | Login name |

    | MAIL | Primary incoming mailbox (/usr/spool/mail/<username> by default) |

    | CHECK | How often (in seconds) the shell checks for new mail |

    | MAILPATH | List of colon-separated file names that the shell monitors for new
