    # 9.7.3 Binding Processes


    The ability to define processor sets is an interesting feature, but is not, by
    itself, particularly useful. In conjunction with the ability to bind processes
    to a particular CPU or processor set, it becomes a powerful tool for allocating
    your CPU resources. Binding a process simply means that the process can run only
    on the CPU or processor set to which it is bound. This allows you to divide your
    CPU resources so that different jobs all receive a fair share of the available
    resources but do not interfere with each other.


    Fair allocation of resources is increasingly important due to the trend of consolidating
    multiple functions into a single large server. For example, you might have a large
    database application, a software development group, and hundreds or thousands
    of e-mail users, all sharing the same server. Assuming this server has a reasonable
    number of CPUs, you could divide it'
  merge: -1
  pgno: 345
