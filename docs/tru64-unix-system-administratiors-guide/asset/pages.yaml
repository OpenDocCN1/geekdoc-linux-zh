  md: 'events that affect the audit subsystem itself). You can also define your own
    audit events.


    Managing the auditing capability consists of the following tasks:


    +   - Configuring the audit subsystem

    - Selecting activities to be audited

    - Producing audit reports

    - Managing disk space used by auditing

    - Archiving audit logs


    The audit subsystem is configured by the auditconfig utility (sysman auditconfig).
    Other audit management tasks are performed via the Audit Manager (dxaudit), which
