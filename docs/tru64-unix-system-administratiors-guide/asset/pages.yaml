  md: '# 8.3.5.1 Creating Spooling Directories


    The lpd daemon manages the printing of multiple jobs to the same printer by a
    process known as “spooling.” Spooling is saving each submitted print job in temporary
    area on disk, typically under the /usr/spool directory hierarchy, and sending
    each job to the printer in the order it was received. Saving, or spooling, of
    a print job to disk allows the user or application that submitted the print job
    to continue working without waiting for the printer to actually print the output.
    Each printer has a dedicated spool directory where print jobs destined for that
    particular are saved. This directory is specified in the /etc/printcap file by
    the “sd” option. For example:


    ```

    sd=/usr/spool/lpd

    ```


    This directory must be created in order for the print daemon to be able to save
    submitted print jobs.


    # 8.3.6 Starting the lpd Daemon


    By default, the OSFPRINTxxx subset enables automatic startup of the lpd printer
    daemon, even if no printers are configured. This subset configures it to start
    when the system is booted. You can determine if the lpd daemon is currently running
    by issuing the following command:


    ```

    # ps -ef | grep lpd

    root 637 1 0.0 15:35:39 ?? 0:00.01

    /usr/lbin/lpd

    ```


    If the lpd daemon is not running and the OSFPRINTxxx subset is installed, start
    lpd by issuing the following command:


    ```

    # /sbin/init.d/lpd start

    ```


    # 8.3.7 Testing the Printer


    Once a printer has been connected and configured, you should test that the printer
    was successfully added to the print system. Tru64 UNIX provides a utility, lptest(8),
    that writes a test pattern to standard output. This pattern contains all 96 printable
    ASCII characters, staggered to display each character in each column position
    of the line. To use this utility, simply pipe its output to the lpr command. For
    instance:


    ```

    # lptest | lpr -Plaser

    ```'
