  md: 'displayed by using either the SYSV "ps -eo VFMT" option, or the BSD "ps u"
    option.


    %CPU is a dynamically computed value that represents the percentage of a single
    CPU''s resources that a process is consuming. Thus, the maximum amount of CPU
    time for all processes totaled together is equal to the number of CPUs multiplied
    by 100%; for example, a system with four CPUs total up to 400%. It is possible
    a single multithreaded process could show a CPU time greater than 100%; although
    this may look a little strange, it is a normal consequence of a multiprocessor
    system. A process that is consistently at or near the maximum possible utilization
    may be a runaway process. It may also, however, be perfectly normal for a process''s
    %CPU to be high, depending on what the process is and what it is doing.


    TIME is the total time that a process has actually been executing on a CPU. This
    value is cumulative since the process was started, and can be hours or days on
    a long-running process. This value is not the total elapsed ("wall clock") time,
    just the total time that the process has actually been running on a processor.


    %MEM is the percentage of real (physical) memory used by a process. RSS is the
    current resident set size (i.e., the amount of physical memory the process is
    actually occupying), while VSZ is the total virtual memory size of a process.
    Both are displayed in kilobytes. A process''s VSZ will always have a value, while
    the RSS column can vary between the VSZ value and zero. The RSS value can be zero
    if a process is swapped out to disk and no longer resident in real memory, either
    due to a memory shortage or when lower priority processes are swapped out. When
    confronted with a low-memory or out-of-memory situation, these three memory utilization
    fields from the ps output should be examined to determine which processes are
    consuming real and virtual memory.


