- img_proc: true
  md: 'completely compromised and an intruder can view any file, change passwords,
    create new accounts, or simply destroy files or data. Tru64 UNIX provides this
    automatic root login to allow resetting of the root password in the event that
    this important password is forgotten or lost. However, for systems that require
    more security, an optional secure console mode is available (see Section 6.2.3.)


    Physically securing a Tru64 UNIX system should be the first step in developing
    a system security strategy. The environment, the criticality of the system, and
    the available physical resources are all important factors in where and how to
    physically secure a system. Obviously, an individual desktop workstation would
    not be very useful locked in a computer room, and probably belongs to a user''s
    desk. But a workstation may be impossible to secure in a cubicle environment.
    In this situation, the best strategy may be to ensure that critical or confidential
    data is stored on a physically secure remote server rather than the workstation''s
    local disks. This reduces the vulnerability of having an inductively secured workstation.
    On the other hand, it relies on the remote file server to provide proper security
    safeguards.


    Additional security at the Tru64 UNIX system can be obtained by selecting the
    secure console mode in Tru64 UNIX and/or by setting a password at the firmware
    level. This ensures that a person with access to the system console can''t perform
    certain actions, such as booting into single-user mode, without entering the root
    password or a special console password. However, even these methods do not provide
    complete security, since there is ultimately a way to reset the console password,
    just as there is a way to reset the root password.


    # 6.2.3 Secure Console Mode


    By default, a Tru64 UNIX system entering single-user mode provides a root login
    on the system without requiring a password. If the console is not physically secure,
    this obviously provides an opportunity for unauthorized root access. If you wish
    to prevent this possibility, Tru64 UNIX provides an optional secure console mode
    to help prevent such unauthorized access. When secure console mode is enabled,
    the system will print the message “Single user root login” and prompt for the
    root password whenever singleuser mode is entered. The user must enter the root
    password to continue.


    To enable secure console mode, set the environment variable SEC_CONSOLE in /etc/rc.config
    to YES. The command to do this is:'
