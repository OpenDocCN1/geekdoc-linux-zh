    # 10.7.3 vmstat


    The vmstat(1) command is used to display virtual memory statistics such as free
    memory, pageins and pageouts, and page faults. Additionally, vmstat shows the
    number of running processes categorized into running or runnable, waiting interruptibly,
    or waiting uninterruptly. The type and quantity of interrupts, system calls, and
