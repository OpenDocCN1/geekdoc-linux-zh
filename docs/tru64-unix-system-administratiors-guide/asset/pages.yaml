  md: '# 10.4.1.1 Tuning CPU


    CPU performance issues usually fall into one of the following three categories,
    each of which prevents user processes from being executed and completed in an
    acceptable time frame:


    +   - The CPU is at capacity.

    - The CPU is busy doing other than the desired task(s).

    - The CPU is idle, waiting for other resources.


    # 10.4.1.1.1 CPU at Capacity


    If the amount of work being demanded of the CPU in a given system exceeds the
    capacity of that CPU, the system''s response time will increase as jobs queue
    up waiting for the CPU, which is working at 100% trying to keep up. In this instance,
    there are only two things to be done: purchase more CPU capacity, or demand less
    of the existing resource. Assuming that buying more hardware is usually not feasible,
    a system administrator must look at either reducing the priority of jobs or shifting
    the execution of compute-intensive jobs to times when the CPU is not in demand,
    such as the middle of the day or over the weekend.


    A CPU at capacity is usually considered a bad situation. However, for certain
    classes of systems, it simply means the system resources are being effectively
    utilized. The way to tell if your system falls into this category is almost entirely
    based on user perception. If the CPU utilization is at very close to 100%, users
    are getting work done, and response time is reasonable, then the system has reached
    a special point known as “CPU nir”. Once you reach this point, if the system workload
    is well known and not expected to grow, then there is nothing for you to do. This
    is admittedly a rare event in computing. In practice, your system will not fail
    these criteria, and if you have a system that reaches this point, you should be
    planning to add more CPU capacity immediately. CPU utilization on most working
    systems will never remain constant, and a slight increase in workload could make
    the system unusable for everyone. Although unused CPU cycles are wasted and will
    never be returned, it is almost always a good idea to have some extra capacity
    to meet temporary or long-term increases in demand.


    # 10.4.1.1.2 CPU Busy


    The CPU may have high utilization but users may still see unacceptable response
    times. In this case, the CPU may be busy doing something else than the work the
    users are asking of. Remember that the CPU''s kernel'
