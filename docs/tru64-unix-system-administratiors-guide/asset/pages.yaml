  md: '# 3.5 Tru64 UNIX File Systems


    The Memory File System is a memory-based file system that appears to the users
    of the system as disk-based but is not built on disk partitions. The Process File
    System is a pseudo file system that is used by some system utilities to access
    memory of the system. The File-on-File Mounting File System and File Descriptor
    File System are specialized file systems that are not commonly used. The Network
    File System and Cluster File System used by systems that wish to share files on
    remote systems. Refer to the Tru64 UNIX Technical Manual for information on these
    file system types.


    # 3.5.1 The UNIX File System


    UFS is Compaq''s implementation of the Berkeley Software Distribution (BSD) version
    4.3 Fast File System, and is commonly used for both system and user file systems.
    The maximum file size for a UFS file system is 512 GB for Tru64 UNIX versions
    prior to 4.0D, and 1 terabyte for version 4.0D and above. UFS was the first file
    system type on Tru64 UNIX and, because of its heritage, does not have features
    such as disk spanning and fast recovery, which exists in more modern file systems
    as AdvFS. Nevertheless, UFS is a very robust and well understood file system,
    and it continues to enjoy great popularity.


    # 3.5.2 UFS File System Layout


    A UFS file system is made of 8-kilobyte blocks. Each disk block in a UFS file
    system is one of four possible types:


    +   * Boot Block: The first block (block 0) of every UFS file system is reserved
    for an initialization, or boot, program. Typically, only a root file system contains
    such a boot program, but any UFS file system may have one.

    * Superblocks: The second block (block 1) of every UFS file system contains information
    that describes the configuration of the file system. This information is called
    the superblock and is critical to the proper operation of the file system. A UFS
    superblock contains:


    +   The total size of the filesize

    Number of inodes

    List of free inodes

    The beginning of the free-block list

    Date of the last superblock update

    The superblock is so important that when the file system is created, redundant
    copies of the superblock are distributed across the disk in a'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'pattern that reduces the chances that a single track, cylinder, or platter
    failure would destroy all copies of it.


    +   - Inode Blocks: UFS uses a structure called an inode, or Index Node, to allow
    random access and multiple file allocations (links). Inodes are simply pointers
    to a file''s data blocks. Inodes are statically allocated when the file system
    is created, and every file has only one inode associated with it.


    # 3.5.3 Creating UFS File Systems


    The creation of a UFS file system is the process of formatting a disk partition
    and building the disk structures to support a hierarchy of directories and files.
    This task is accomplished with the newfs(8) command, specifying the disk partition
    as the only required command line argument. For instance, to create a UFS system
    on the first partition of the dsk8 disk, using the following


    ```

    # newfs dsk8a

    Warning: 1008 sector(s) in last cylinder unallocated

    /dev/rdsk/dsk8a: 131072 sectors in 26 cylinders of 20

    tracks, 254 sectors

    64.0MB in 2 cyl groups (16 c/g, 39.69MB/g, 9536 i/g)

    super-block backups (for fsck -b #) at:

    2, 8158

    ```


    This example demonstrates the default use of newfs. Unless additional file system
    option arguments are specified, the newfs command use default along with the geometry
    values specified in the disk''s label to construct the new file system. While
    newfs actually uses the character disk device file when creating the file system,
    a simple disk name and partition may be specified in place of either the full
    character or block disk device name. The newfs translates any of these disk specifications
    into the full character disk device.


    There are a group of newfs options that override the default method of creating
    UFS file systems. Most of the default newfs values are normally appropriate for
    most situations, however, these command options are frequently used. Refer to
    the newfs reference page for information on the UFS file system options.'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'One of the newfs optional flags specifies how many inodes are created in the
    new file system. This is a particularly important parameter, since the number
    of inodes determines the maximum number of files the new file system may contain,
    regardless of disk space. The default is to create one inode for each 4K (4096
    bytes) of disk space. This value makes the assumption that the average file size
    in a new file system will be approximately 4K. If, for instance, the average file
    size were actually 1K, it would be possible that the file system could run out
    of inodes before running out of disk. In this case, the file system should be
    created with more inodes than the default. The other hand, if a file system was
    going to contain fewer, larger files, the recommendation would be to create the
    file system with fewer inodes. Since each inode takes up a small amount of disk
    space (only 128 bytes), specifying fewer inodes leaves more disk space for user
    data. The newfs command provides a line option (-i) to specify "bytes per inode"
    value. Simply put, estimate the average file size if a file system will contain
    relatively large files, averaging approximately 500K, the following newfs command
    will create the file system specifying 512000 bytes (500 * 1024) per inode:


    ```

    # newfs -i 512000 /dev/rdsk/dsk2c

    ```


    Specifying a value larger than the default of 4096 bytes results in fewer inodes;
    to create more inodes in the file system, a smaller number should be given. To
    display the number of inodes configured in a file system, use the df(-i) command
    with the "-i" switch:


    ```

    # df -i /home

    ```


    | Filesystem 512-blocks Used Available Capacity Iused Free |

    |%Used Mounted on |

    | /dev/disk/dsk2c 126462 476 113338 1% 36 16637 0% /home |


    In this example, the file system has 16,637 free inodes, with 36 in use.


    Finally, newfs has a special parameter that permits the system administrator to
    execute a newfs command without actually creating the file system. This parameter,
    "-N", displays the file system creation parameters that would be used if the file
    system were actually created. This can be useful for debugging the default file
    system creation parameters or for trying different options with'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'out touching the disk. This is particularly useful for locating the alternate

    superblocks in case the primary superblock is damaged. For example:


    ```

    # newfs -N -i 12288 dsk8b

    Warning: 2016 sector(s) in last cylinder unallocated

    /dev/disk/dsk8b: 262144 sectors in 52 cylinders of 20

    tracks, 254 sectors

    128MB in 4 cyl groups (16 c/g, 39.69MB/g, 3200 i/g)

