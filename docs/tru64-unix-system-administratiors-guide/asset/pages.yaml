- img_proc: true
  md: '# 3.4.3.1 Writing a Default Disk Label


    As we discussed earlier, one of the first steps to follow when working with a
    disk, especially a new disk, is to write a default disk label to label it. Prior
    to doing this, a disk is unlabeled and, until a label is installed, Tru64 UNIX
    cannot make use of the disk. Writing a default disk label prepares the disk for
    use, either using the default partition layout or when planning to configure a
    custom partition layout. Writing a disk label is not reserved only for new disks.
    Occasionally, it becomes necessary to partition an existing disk; if the entire
    disk will be redone, it is recommended to rewrite a default disk label onto the
    disk and repartition it.


    Before writing a new default label to a disk, one recommended step is to remove
    any existing label. This is not entirely necessary, but it is a simple step that
    will avoid the possible situation where certain existing partitions may persist
    onto the new label. To clear any existing label, use the following command, specifying
    the appropriate disk:


    ```

    # disklabel -z dsk8

    ```


    If the following harmless message is returned, the disk was already unlabeled:


    ![](img/3eed431236346b7d400c9572311a8aa8_98_0.png)'
