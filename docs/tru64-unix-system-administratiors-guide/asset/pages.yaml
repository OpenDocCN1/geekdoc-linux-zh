  md: 'necessary for installation and basic functionality that is always selected.
    In addition, other mandatory software subsets are selected based on the hardware
    configuration of the system. For example, if the system has graphic capability,
    the minimal X Window System environment subsets are also mandatory. Beyond these
    mandatory subsets, there are roughly 100 optional subsets that can be selected
    for installation during the initial system installation. The optional subsets
    fall into a dozen different categories:


    +   * General applications

    * Mail applications

    * System administration tools

    * Network utilities

    * Printing environment

    * X Window System applications

    * X Window System environment subsets

    * Kernel build environment

    * Kernel development environment

    * General software development environment

    * Reference pages

    * Text processing utilities


    The Tru64 UNIX Installation Guide contains descriptions of each of the various
    optional software subsets. Additionally, the Release Notes contain an appendix
    detailing the disk space requirements for each of the mandatory and optional subsets.
    Before beginning a system installation, determining which optional subsets will
    be installed will assist you in disk planning (layout and sizing), which is the
    next step in installation planning.


    Determining which optional subsets to select is best accomplished by deciding
    how the system will be used. If, the system is a graphics workstation that will
    be used for software development, it is likely that many of the X Window System
    and software development environment optional subsets will be installed. Conversely,
    if a system will be a production server supporting remote clients, the installation
    of software development utilities or X Window System applications and fonts might
    not be appropriate. Finally, if the system will run third-party applications,
    examine the installation documentation for these products to determine if they
    require Tru64 UNIX software subsets to operate, and see what their disk requirements
    are.'
