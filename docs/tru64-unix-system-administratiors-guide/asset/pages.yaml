    # 3.5.9 The Advanced File System (AdvFS)


    The Advanced File System (AdvFS), another local file system supported on Tru64
    UNIX, is quickly replacing UFS as the file system of choice, particularly large
    for many modern file system features, such as write-ahead logging for file system
    recovery, on-line backups, spanning, and file striping. The AdvFS architecture
    allows management of file systems while they are mounted. This includes dynamically
    resizing file systems, defragmenting to make files more contiguous on disk, and
    cloning of file systems for backup purposes.


    The base AdvFS functionality is a licensed part of the operating system and can
    completely replace UFS on a Tru64 UNIX system, including the root, /usr, and /var.
    The Tru64 custom installation option allows the installer to select AdvFS as a
    file system for the system partitions. (See Chapter 2, “Installation,” for details
    on performing a custom installation.) In addition, an optional set of utilities
    provides additional capabilities to the AdvFS file system. This optional product,
    the Advanced File System Advanced Utilities (AdvFS Advanced), is available as
    a separately licensed set of commands from Compaq. The AdvFS Utilities provide
    such features as file undelete capability, on-line file migration, and a graphical
    user interface (GUI). These utilities are now included with a base installation.


