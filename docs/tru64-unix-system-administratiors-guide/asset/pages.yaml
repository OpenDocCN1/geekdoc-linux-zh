    use the console command show device.

    - filename is the full pathname of the bootable firmware update image.

    - ip_address is the corresponding Internet protocol address of the system

    ame in /etc/hosts.


    The following is an example of a bootstrap file:


    ```

    saturn:ht=1:ha=00-00-F8-01-42-5F:bf=/usr/firmware/

    es40_v6.0.exe:ip=10.0.0.5

    ```


    # 2.3.9.3 Invoke BOOTP and tftpd Daemons


    To activate the BOOTP process, two daemons must be enabled, the

    BOOTP Daemon (joint) and the Trivial File Transfer Protocol Daemon

    (tftpd). The tftpd daemon actually does the work of transferring the bootable

    firmware update image across the network to the client


    Both of these daemons are controlled by entries in the /etc/inetd.conf

    configuration file. Simply edit this file and modify or create the entries for
    the

    BOOTP and tftpd daemons. Ensure that the entries in /etc/inetd.conf for

    these daemons do not have a # character at the beginning of the line. The

    BOOTP daemon, modify or create the joint entry. In addition, modify the

    tftpd entry to reflect the directory where the bootable firmware update image

    is by appending the directory name to the end of the line. The entries should

    be similar to the following examples:


    ```

    tftp dgram udp wait root /usr/sbin/tftpd tftpd /tmp

    /usr/firmware

    bootps dgram udp wait root /usr/sbin/joind joind

    ```


    After modifying the /etc/inetd.conf file, you must force the inetd process

    to reread its configuration file by sending the process a hang-up signal. This

    enables the BOOTP process and causes future boot requests received by inetd

    to be forwarded to the BOOTP daemon. To force inetd to reread

    /etc/inetd.conf, issue the following command:


    ```

    # kill -HUP ''cat /var/run/inetd.pid''

    ```


    # 2.3.9.4 Boot the Client


    Once the appropriate bootable firmware update image is copied to the

    BOOTP server and the BOOTP and tftpd daemons are configured and'
