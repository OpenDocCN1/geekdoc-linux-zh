    # 2.2.2 Selecting Installation Media


    The first choice you should make when planning a Tru64 UNIX installation is whether
    to install a system from a locally mounted Tru64 UNIX CD-ROM or from a Remote
    Installation Services (RIS) server. Which method you choose depends mostly on
    whether an RIS server is available. The special requirements of an RIS server
    may rule out an RIS installation. If an RIS server is available, reachable via
    the network, and has the correct version of Tru64 UNIX installed in its repository,
    RIS can simplify a client system installation.


    Regardless of whether an RIS server is available, installing a system via a local
    CD-ROM is always an available option. The only requirements to do are the correct
    version of the Tru64 UNIX installation CD-ROM and a CD-ROM drive connected to
    the target system. At a minimum, you need two CD-ROMs: The Tru64 UNIX operating
    system CD-ROM that is labeled Tru64 UNIX Vx.yz Operating System Volume 1 (here,
    the x.yz stand-in for the major, minor, and maintenance release number and letter,
    and the firmware CD-ROM that is labeled Alpha Systems Firmware Vx.y.


    # 2.2.3 Selecting the Installation Method


    The next decision that should be made concerns the installation type. This choice
    assumes that you are conducting a new or overwrite installation; update installations
    are discussed later in this chapter. The choices are Full and (new in Tru64 UNIX
    version V4.0 and above) Cloned installations. The following sections describe
    these two types of installations.'
