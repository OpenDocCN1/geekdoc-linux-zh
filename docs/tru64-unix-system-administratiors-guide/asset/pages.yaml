- img_proc: true
  md: 'access. Another possibility is that a user is a multiple of multiple groups
    that have entries defining different access permissions. In this case, the user
    is granted the union of all of the applicable group permissions. For example,
    the entry for group staff was “--x”, a user who belongs to both the staff and
    system groups would read and execute permission on the file: read from the owning
    group (system) entry, and execute from the staff group entry.


    Regular files may have only one ACL, which defines access to the file. A directory
    may have up to three ACLs: an access ACL, a default ACL, and a default directory
    ACL. The access ACL defines access permissions to the directory, as we have already
    discussed. The default access ACL is inherited by newly created files in the directory;
    that is, new files receive an ACL that is identical to the default access ACL.
    Similarly, the default directory ACL is inherited by newly created subdirectories.
    For more details on ACL inheritance, see the acl(4) man page or the Tru64 UNIX
    Security manual.


    In order for ACLs to be effective on NFS filesystems, ACLs must be enabled on
    both the NFS server and clients. In addition, the NFS server must run the property
    list daemon, proplist, and clients must mount the system with the proplist option.
    The client''s /etc/stab entry for a filesystem would contain proplist in the options
    field, for example:


    ```

    students:/home /nfs_home rw,proplist 0 0

    ```


    # Division of Privileges


    By default, UNIX has an “all or nothing” view of privileged accounts. The root
    account is all-powerful, while other accounts have special privileges. This scheme
    fails to consider the usefulness of accounts that have a few privileges, but not
    the universal privileges of the root account. For example, it may be desirable
    to create an operator account to backup and restore files, shutdown the system
    for maintenance, or similar functions. The traditional UNIX privilege provides
    no easy way to accomplish this.


    Prior to version 5, Tru64 UNIX had no mechanism for division of privileges, although
    there were outside products that could perform such function, such as the open
    source program “sudo”. Version 5 introduced the Division of Privilege utility,
    dop(8). This utility allows the superuser to assign system administration tasks
    (or classes of tasks) to specific users or groups. These users are able to perform
    the specified task without knowing the root password, which would otherwise be
    required.'
