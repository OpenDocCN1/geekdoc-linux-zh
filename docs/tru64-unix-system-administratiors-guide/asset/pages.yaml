    require an entire book to cover them completely. Happily, excellent texts on both
    Tru64 UNIX-specific and standard UNIX subsystems already exist. Rather than attempting
    to adequately address these topics, the reader is encouraged to refer to one or
    more of the following titles when working with these topics, some of which are
    considered the “bibles” of their subjects.


    # B.1 AdvFS, LSM, TruCluster


    Hancock, Steven M. Tru64 UNIX File System Administration Handbook. Digital Press,
    2000.


    Fafrak, Scott, and Lota, Jim. TruCluster Server Handbook. Digital Press, 2001.


