    | CXXHTML620 | installed | Compaq C+ HTML documentation |

    | CXXOLD620 | installed | Compaq C+ V.5 (-oldcxx) compiler |


    Typical Tru64 UNIX installations have many software subsets installed, and this
    inventory output may run on hundreds of lines. Note that the setld command displays
    three pieces of information for each software subset: Subset Name, Status, and
    Description. The Subset Name has a length of seven or more characters, is normally
    a combination of capital letter and numbers, is usually an abbreviation of the
    subset name, and contains some version number information. The Status field displays
    the current status of the subset. The Status will always be one of four possible
    values:


    +   1. installed

    The "installed" status indicates the subset is correctly loaded and installed.

    2. incomplete

    The "incomplete" status indicates that at the time this subset was loaded, the
    subset kit was incorrect or incomplete.

    3. corrupt

    A "corrupt" subset most likely means that the installation of the subset failed.

    4. not installed

    The "not installed" status indicates that either the subset was installed in the
    past but has been deleted, the subset installation was canceled, or simply that
    the subset control files are in the /usr/.smdb directory.


    The Description field is normally the software product''s name as described in
    the Software Product Description (SPD) issued by the product.


    In addition to displaying the entire subset inventory, the setld command can display
    a listing of all the files in a particular software subset. Specify one or more
    software subsets after the "i" flag for the subset inventory:'
