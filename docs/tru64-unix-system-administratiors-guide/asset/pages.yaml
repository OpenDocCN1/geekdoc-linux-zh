    the existing record for that dump level, changing the backup dump date to reflect
    the most current backup session. This occurs after all files in the named file
    system are successfully backed up.


    # 11.2.3.4 Incremental vdumps


    Incremental backups are a way of reducing the amount of time and backup media
    by backing up only the files that have changed since the last backup. By consulting
    the /etc/vdumpdates file, the vdump utility is able to manage incremental backups
    and determine which files have changed. main drawback to incremental backup strategies
    is that the system administrator must manage the multiple tapes between level-0
    dumps in order to completely restore a system. Consider the following 28-day incremental
    backup schedule:'
  merge: -1
  pgno: 406
- img_proc: true
  md: '| S M T W T F S |

    | 0 5 4 7 6 9 8 |

    | 0 5 4 7 6 9 8 |

    | 0 5 4 7 6 9 8 |

    | 0 5 4 7 6 9 8 |


    AA full (level-0) dump is performed once a week, with increments the remaining
    days of the week. The number of dump files to perform a full restore can vary
    from 1 to 4, depending when during the week a restore becomes necessary. Following
    this schedule would mean a minimum of 7 tapes in the backup rotation; a better
    idea would be to have the full 28 tapes in a rotation, especially since tapes
    are relatively inexpensive compared to lost data. In any case, if this type of
    dump is adopted, it is important to safeguard all tapes between level-0 dumps
    to complete a full restore. For instance, if the system required a full recovery
    on Wednesday morning before that its backup, it would be necessary to first apply
    the level-0 dump from Sunday, then apply the level-5 dump from Monday, followed
    by the level-4 dump from Tuesday, to restore the system to the state it was immediately
    after Tuesday''s dump. In this example, any changes after the Tuesday backup would
    be lost.


    This 28-day incremental vdump(8) schedule can be run by inserting the following
    entries in root''s crontab. This example only backs the /home file system:


    ```

    0 2 * * * 0 /bin/vdump -u -f /dev/tape/tape0_d0 /home

    0 2 * * * 1 /bin/vdump -5 -f /dev/tape/tape0_d0 /home

    0 2 * * * 2 /bin/vdump -4 -f /dev/tape/tape0_d0 /home

    0 2 * * * 3 /bin/vdump -7 -f /dev/tape/tape0_d0 /home

    0 2 * * * 4 /bin/vdump -6 -f /dev/tape/tape0_d0 /home

    0 2 * * * 5 /bin/vdump -9 -f /dev/tape/tape0_d0 /home

    0 2 * * * 6 /bin/vdump -8 -f /dev/tape/tape0_d0 /home

    ```


    Obviously, if a system has many file systems, this method individual crontab entries
    would be very unmanageable. A better solution is a single script that runs every
    night, which backs up all desired file systems at the appropriate dump level that
    is determined by the current day of the week.


    One capability the vdump utility does not directly provide the ability to send
    the backup across the network to a tape drive on a remote system. The rdump utility
    does support this functionality by requiring the specification of a remote system
    name and a tape device on the system via the "-f" command line parameter. The
    format of the rdump’s "-f" option is "machine:device" as in the following example:'
