    processors could have been added to or removed from pset 2 while the process was
    running. In such a case, the process could have executed on any processor that
    was a current member of pset 2.


    # 9.7.4 Class Scheduling


    Class scheduling is another method of allocating CPU resources to specific users
    or applications. You can create any number of classes and define the maximum percentage
    of available CPU time that each class is allowed to consume. Users and groups
    may be assigned to these classes; any jobs started by these users are subject
    to the CPU time constraint for their class. In addition, you may run any job in
    a particular class by using the run(1) command.


    The class_admin(8) command is used to set up and manage class scheduling. The
    first time you run class_admin, it will ask several questions to define its default
    behavior:


    ```

    # class_admin

    ```


    Class Scheduler Administration


    configure:


    Shall processes that have not been explicitly assigned to a defined class be assigned
    to a ''default'' class? Enter (yes/no) [no]:


    Enforce class scheduling when the CPU is otherwise idle?

    (yes/no) [yes]:'
