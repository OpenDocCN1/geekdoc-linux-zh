    # 2.2 Tru64 UNIX Preinstallation Planning


    To guarantee a successful Tru64 UNIX installation, several areas require some
    consideration and planning:


    +   - Installation media (local CD-ROM or RIS server)

    - Installation method (default, custom, or cloned)

    - Selection of optional subsets

    - Boot disk partitioning (size and location)

    - File system type

    - Swap areas (size and quantity)


    # 2.2.1 Review Tru64 UNIX Installation Documentation


    The first step is to read the Tru64 UNIX Installation Guide and the Tru64 UNIX
    Release Notes for the version of Tru64 UNIX you are planning to install. Both
    of these documents contain information that will assist you while planning the
    installation. Some of these issues can wait until after the system installation
    is complete, but most must be decided before the installation can begin.


    The Tru64 UNIX Installation Guide is the authority for the installation process.
    This manual contains specific information for each computer system supported by
    the version of Tru64 UNIX covered by the document. This information includes the
    required console flag settings and instructions on booting the system to begin
    the installation, either from CD-ROM or over a network connection to a RIS server.
    In addition, the processor-specific section indicates any unique settings or requirements
    necessary to install Tru64 UNIX. Finally, the Installation Guide contains detailed
    listings of the mandatory and optional software subsets contained in the particular
    version of Tru64 UNIX. This information includes subset descriptions. You will
    find the disk space requirements for each software subset in the Release Notes.
    A separate section in the Installation Guide contains the default disk partitions
    for the supported Compaq-manufactured disks.


    The Tru64 UNIX Release Notes should also be read before beginning an installation.
    The Release Notes document any last-minute changes to either the particular version
    of the Tru64 UNIX software or to the installation-'
