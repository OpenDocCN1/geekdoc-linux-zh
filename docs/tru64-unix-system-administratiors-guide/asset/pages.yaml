    # 6.6.1.1 Log in as Root


    This process can be done from either the system console logged in directly as
    root, or logged in from a terminal or across the network as a regular, nonprivileged
    user who has become the root user via the su(1) command. Before proceeding, check
    the system’s current security level with the following command:


    ```

    /usr/sbin/rcmgr get SECURITY

    ```


    If the string "BASE" or no output is returned, you are running Base security and
    can proceed to enable Enhanced security. If, however, the string "ENHANCED" is
    returned, Enhanced security is already enabled. In this case, you can modify the
    current security configuration by running the config utility and making the appropriate
    choices.


    # 6.6.1.2 Install the Enhanced Security Subsets


    Before you can enable Enhanced security, two Enhanced security subsets must be
    loaded. These subsets are named OSFC2SECxxx and OSFC2SECxxx. (The "xxx" specifies
    a numeric subset version corresponding to your version of the operating system;
    for Tru64 UNIX V5.1, this value is 510.) To determine if these subsets are already
    installed, run the following command:


    ```

    # /usr/sbin/setld -i | grep -i c2

    OSFC2SEC510 installed C2-Security (System Administration)

    OSFC2SEC510 installed C2-Security GUI (System Administration)

    ```


    In this example, both subsets are installed. If you do not receive any output,
    or if the "installed" keyword in the second column is absent, you must install
    the subsets from the operating system installation media. For assistance in installing
    Tru64 UNIX subsets, see Chapter 4, "System Configuration."'
