    UNIX systems are intended to run continuously so as to be available at all times
    for user activity. This activity can be either of an interactive nature, where
    users are actually logged in doing work, or processes running in the background
    without any user interaction. There are a variety of reasons to run jobs in an
    unattended fashion; perhaps the job needs a large amount of system resources,
    and the system is relatively idle during the middle of the night or over a weekend.
    Another reason is to increase the utilization of the system by performing some
    processing during otherwise idle periods. A system administrator also needs the
    ability to run processes unattended. These include regularly scheduled jobs such
    as backing up the system, reporting error logs, and scanning file systems. In
    addition, a system administrator occasionally needs to schedule an ad hoc job
    for a future one-time execution. An example of this is scheduling an automatic
    system shutdown and reboot during the wee hours of the morning.


    Tru64 UNIX provides three tools for scheduling jobs:


    +   - cron

    - at

    - batch


    Each tool has a similar, but distinctly different purpose. cron(8) is used to
    schedule jobs to execute repeatedly, on a regular schedule. at(1) is used to schedule
    an ad-hoc job for execution once, at a user-specified date/time.'
