- img_proc: true
  md: '# 10.4.3.1 Disk-Bound System


    A system is disk-bound if there is a large amount of disk traffic on one or more
    disk drives and the CPU is spending a great deal of time idle, waiting for disk
    I/Os to complete. If a system is disk-bound, there are two things to focus your
    attention on: the physical disk layout, and the file system type and configuration
    on those disks. Both are important and go hand in hand; but, depending on a particular
    system, one may weigh more heavily than the other.


    Since most disk performance problems are related to the physical disk configuration,
    it makes sense to start with the disk subsystem. There are a variety of strategies
    to investigate in order to increase disk throughput, and most attempt to avoid
    saturation of an individual disk, which should be avoided if at possible. These
    strategies include:


    +   * Use the fastest disks possible.


    +   * Spread disks across many buses as possible.


    +   * Where possible, use many small disks rather than a few large disks.


    +   * Use disk controllers with hardware cache, such as Compaq''s HSX family of
    controllers.


    +   * Use disk mirroring, either software such as the Logical Storage Manager
    (LSM), or hardware such as an HSZ controller.


    +   * Balance disk load by distributing file systems across multiple disks or
    controllers.


    The iostat(1) command is invaluable in determining if one or more disks on a system
    are saturated, or “hot.” At a typical time during the workday, if one disk''s
    transfer rate is significantly higher than that of the others, or worse, if one
    disk is supporting all I/O while the remaining disks are idle, this is indicative
    of an unbalanced disk subsystem. In this situation, the only remedy is to distribute
    the disk usage evenly among all the disks and controllers. This may involve relocating
    disks between disk controllers, or moving file systems from disks to balance the
    usage.


    This type of physical layout is especially crucial for a database system that
    uses raw space, rather than file systems, for data storage. A database server
    using raw devices bypasses the entire operating system buffering and caching system
    and thus, depends more heavily on the efficient distribution of I/O across disks.
    The same principle holds true if the AdvFS Direct I/O feature is being used to
    bypass the buffer caches.'
  merge: -1
  pgno: 378
- img_proc: true
  md: 'Once the disk subsystem has been examined, the next area of focus is the file
    system configuration and layout. The two primary local, general-purpose types
    of file systems supported by Tru64 UNIX are UFS and AdvFS, and each has its own
    unique tuning tunes and strategies.


    # 10.4.3.2 UFS


    The UNIX File System (UFS) is the first of two local file system types supported
    on a Tru64 UNIX system, and this file system type is very common. There are number
    of options and techniques available to a system administrator to tune a UFS file
    system. One or more of the following tips may suit your environment:


    +   - Mirror file systems with Compaq''s Logical Storage Manager (LSM). Mirroring
    a file system can be used to improve disk reads and also increase availability.
    On the other hand, mirroring typically slows down write operations.


    +   - Defragment file systems if necessary. Using the dbx(8) debugger, examine
    the ufs_clusterstats, ufs_clusterstats_, and ufs_clusterstats_write structure,
    to determine whether a disk is fragmented. See Figure 10.3 for an example of examining
    a kernel data structure. If the values in this UFS clustering structures show
    that clustering is not effective, the disk may be fragmented.


    Tru64 UNIX does not currently provide an automated mechanism for defragmenting
    a UFS file system. However, it is possible to defragment a file system with this
    procedure:


    +   - Adjust the number of inodes to match the file system usage. If the file
    system has fewer, larger files, reduce the density of inodes with the newfs -i
    command when creating the file system.


    +   - Adjust the fragment size to match the file system usage. By default, the
    fragment size on UFS is 1KB. This is appropriate for a file system containing
    many small files of 1KB or less. However, a larger fragment size (8 KB) is less
    wasteful of disk space and provides better performance for a file system that
    contains larger (greater than 16 KB) files. The frag'
  merge: -1
