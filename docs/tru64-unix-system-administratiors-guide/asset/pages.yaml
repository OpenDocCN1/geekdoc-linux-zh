    To turn on the "autorun" feature of collect so that it reboots and keeps a historical
    record of the system''s performance, execute this command as root:


    ```

    rcmgr set COLLECT_AUTORUN 1

    ```


    You might be concerned that this tool itself will impact the system''s performance.
    Since collect is a very lightweight tool and and as far as its collecting interval
    and the specific statistics that it monitors, typically takes less than 1% of
    the system CPU. It can also be configured to suspend and resume operation based
    on the amount of free disk space, so you do not have to be overly concerned about
    storage space for the compressed data files.'
