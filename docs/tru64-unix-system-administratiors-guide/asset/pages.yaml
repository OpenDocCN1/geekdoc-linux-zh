    Provided that the installer has completed the system configuration planning, performing
    a Full Installation is a straightforward exercise in answering a few basic questions.


    # 2.4.2.1 Host Information


    The first window that you will see after the Installation Welcome window is the
    Host Information dialogue. The modifiable fields include the host name, area,
    location, date, and time (Figure 2.3). The host name is the name that you and
    others will use to refer to this system on the network. What you choose for the
    Area and Location establishes the time zone information. The date field order
    is Month/Day/Year and the time is in 24-hour format so 4PM is 16:00. If you do
    not specify a date and time, the installation will proceed but will ask for the
    current date and time before building the custom kernel.


