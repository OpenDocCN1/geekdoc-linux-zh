  md: '# 2.3 System Preparation


    It may be possible to successfully install Tru64 UNIX on a disk not listed, but
    Compaq may or not provide support in the event of problems. Since most Compaq
    systems are delivered with at least a single disk, it is strongly recommended
    that the system disk be one of the supported types.


    +   - The selected disk must have partition available. The Tru64 UNIX root file
    system must be located on partition a, and this partition must start at block
    0 and be, at a minimum, 128 MB in size.


    A complete Tru64 UNIX operating system installation can reside on a single, sufficiently
    large disk. As an installation would mean the root /usr file system plus a swap
    partition is contained on one disk. This is an acceptable configuration, especially
    for a small desktop or server system. However, only the root file system must
    reside on the system disk. Other file systems and partitions allows the custom
    installation and creation of a root file system, a /var file system, and two partitions.
    By placing each of these on distinct disks, a custom Tru64 UNIX installation could
    be placed on five disks.


    # 2.3.5 System Firmware


    Before beginning a Tru64 UNIX installation, you must check that the version(s)
    of firmware on the target system are at a minimum level for the version of Tru64
    UNIX to be installed. Firmware is software that is stored in programmable read-only
    memory (PROM) on a Compaq Alpha system that is responsible for certain hardware
    behavior. The most important firmware on an Alpha system running Tru64 UNIX is
    the Alpha System Reference Manual (SRM) Console firmware. This firmware is commonly
    referred to as simply the Console Firmware, and its main role is to load the Tru64
    UNIX operating system from disk or from a network and then pass control to it.
    The SRM is also where a Tru64 UNIX installation is begun.


    Other firmware to be aware of includes:


    +   - Advanced RISC computing (ARC) firmware


    +   - EISA configuration utility (ECU)


    +   - I/O adapter firmware


    The ECU is used on Compaq Alpha systems with an Extended Integrated System Architecture
    (EISA) bus. While most newer Compaq Alpha systems use the PCI bus for expansion
    cards, many Compaq Alpha systems also support the EISA bus. Before installing
    Tru64 UNIX on a system with EISA'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'bus, you must run the EISA Configuration Utility to identify any installed
    EISA boards. The ECU is included on a separate floppy disk. Refer to the system
    owner''s guide for information on running the ECU. Always update the firmware
    before running the ECU.


    Many Compaq I/O boards also have their own firmware that defines their functionality.
    Some examples of these boards include SCSI adapters, RAID controllers, and I/O
    modules. The firmware level on any such components in a system must be verified
    to be at a minimum level for the version of Tru64 UNIX being installed.


