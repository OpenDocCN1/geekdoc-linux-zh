    # 3.5.10 Logical Storage Manager (LSM)


    Tru64 UNIX supports the Logical Storage Manager (LSM), a robust logical storage
    manager based on the VERITAS Volume Manager from VERITAS Software. LSM supports
    all of the following:


    +   - Disk spanning: Disk spanning allows you to concatenate entire disks or parts
    (regions) of multiple disks to use as a single local volume. For example, you
    could combine two R28s and have them contention the /usr file system.


    +   - Mirroring: Mirroring allows you to write simultaneously to two or more disk
    drives to protect against data loss in the event of an individual disk failure.


    +   - Striping: Striping improves performance by breaking data into segments that
    are written to several different physical disks in a "stripe set."


    +   - RAID 5: As we discussed earlier, this is a mechanism for providing redundancy
    with a cost of adding one extra disk. LSM supports RAID 5 in software in Tru64
    UNIX 5.0 and later versions.


    +   - Disk management: LSM supports disk management utilities that, among others,
    change the disk configuration without disrupting users while the system is up
    and running.


    Mirroring, striping, RAID 5, and the graphical interface require a separate, optional
    license PAK (Product Authorization Key).


    For each logical volume defined in the system, the LSM volume driver maps maps
    logical volume I/O to physical disk I/O. In addition, LSM uses a user-level volume
    configuration daemon (vold) that controls changes to the'
