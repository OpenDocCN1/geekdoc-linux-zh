    # 3.3.1 Device Special Files in Tru64 UNIX


    As with any operating system, the Tru64 UNIX device files are located in the /dev
    or the /devices directory in the root file system. Device files represent the
    user-level process “handle” into the device drivers that control various hardware
    devices on the system. Each device driver is assigned a major number, which uniquely
    defines it to the kernel. The major number is offset into of two tables, known
    as the switch tables, which define the operations that are permissible on the
    devices. The reason we have two switch tables is that we have one for character
    devices and one for block device file it is possible to have a single device with
    both a character device file associated with it, but the operations that are supported
    will be different and thus the code to perform those operations will also be different.


    SCSI disk device naming on Tru64 UNIX has traditionally followed the BSD standard
    conventions. The older device-naming scheme was severely limited in some important
    ways. Primarily, the old scheme could not be adapted for use in a Single System
    Image (SSI) cluster environment. What this means is that for a cluster to behave
    as a single system, the devices must be cluster-wide, rather than local. The BSD-style
    SCSI disk devices were named based on a formula that includes the local bus and
    target numbers. There is simply no way to make this number for all nodes in the
    cluster. The second main reason for the device nomenclature change in Tru64 UNIX
    5.0 was to accommodate the SCSI-3 standard, which supports up to 6 LUNs per device.
    The BSD method of using letters could not be easily adapted for SCSI-3. Therefore,
    device naming in Tru64 UNIX 5.0 has changed significantly from the BSD-derived
    naming of prior versions. Table 3.1 lists the most commonly used device typing


    In addition to device naming, the major numbering scheme changed dramatically
    in Tru64 UNIX 5.0. The older scheme used a different major number for all device
    types. In the new method, only the major number 19 is used for all cluster devices.
    This greatly simplifies some of the kernel device management.'
