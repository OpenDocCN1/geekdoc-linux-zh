    # 3.5.7 Extending UFS File Systems


    A new feature of the UFS file system with Tru64 UNIX 5.1 is the ability to

    extend a file system should the underlying storage size change. Traditionally,

    if you had a UFS file system in Tru64 UNIX, the only way to increase the size

    of the file system was to back it up, remake the file system with newfs, and

    restore the data. This was a time-consuming process that many adminis-

    trators were not happy to do. Luckily, this process is no longer required to take

    advantage of growth in the underlying storage.


    The main command used to implement this feature is called extendfs(8).

    There are at least two ways in which the underlying storage might change.

    Here these are:


    +   - Change the partition size with disklabel.

    - Grow the LSM volume with volassist(8).

    nThe procedure for performing the UFS file system extend operation is

    as follows:

    - Unmount the file system.

    - Change the underlying storage size.

    - Extend the file system size.

    - Remount the file system.


