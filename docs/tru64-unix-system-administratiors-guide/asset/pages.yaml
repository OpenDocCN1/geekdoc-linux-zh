    # ## 8.3.2 Physically Connecting the Printer


    Once the required OSFPRINT software subset is installed, the next step to configuring
    a local printer is to physically connect the printer to the appropriate port.
    Tru64 UNIX supports both directly connected serial and parallel printers. Connect
    a printer to the system using the appropriate cable, turn the power on to the
    printer, and ensure that the printer is online and ready to print as described
    in the printer owner''s documentation.


