    The tar utility is most useful for ad hoc backups and for packaging files for
    transport. The tar format is considered to be an industry standard; archives are
    fairly portable among the different vendor implementations of UNIX. In addition,
    there are tar-like utilities for non-UNIX systems, such as Windows 2000. However,
    since the tar utility allows robust error checking and correction and the ability
    to do incremental backups, it is not an ideal choice for regular system backups.
    It is handy, though, for quickly backing up a file or directory or two, either
    to magnetic media, such as tape or floppy, or to a tar archive on disk.


    # 1.2.3.2 vdump/vrestore


    The vdump(8) utility (and corresponding vrestore(8) utility) is the most flexible
    and robust backup utility in the base True64 UNIX operating system. The vdump/vrestore
    pair supports backing up and restoring AdvFS filesets, UFS file systems, NFS file
    systems, and MFS or memory file systems. The similar dump/restore utility pair
    supports only backing up and restoring UFS file systems. For this reason, using
    vdump/vrestore is recommended for all dump/restore operations. Additionally, there
    is a third derivative of this command pair: rdump/restore, for Remote dump and
    Remote restore. The rdump/restore are for backing up UFS file systems to and from
    remote backup devices, such as a tape drive on another system. Beginning in version
    5.0, the rdump/vrestore utilities were introduced for remote backup and restores.
    Unfortunately, in versions prior to 5.0, vdump/vrestore did not directly support
    the remote facility. In Section 11.2.3.4, “Incremental'
