    the benefit.


    # 10.4.3 AdvFSFS


    The Advanced File System (AdvFS) is another local file system on Tru64 UNIX systems.
    AdvFS provides significant performance and tuning advantages over UFS. Where certain
    tuning operations, as defragmentation, on a UFS file system can only be done manually,
    AdvFS allows online defragmentation. Also, with an additional license, you can
    utilize Compaq''s AdvFS Advanced Utilities provides even more features such as
    multiple volume capacity, online reconfiguration, performance tuning, and online
    backups.


    Some strategies for improving AdvFS performance include:


    +   Dedicate an entire disk to a single AdvFS file domain, rather than multiple
    file domains on a single disk, to avoid disk contention.


    +   Defragment AdvFS filesets frequently. The defragmentation and control utilities,
    which allow online defragmenting without reducing file system availability. Without
    using these tools, you can, similarly to UFS, back up, recreate, and restore filesets
    to defragment them. This, however, forces defragment utility can also be used
    to monitor the fragmentation of your AdvFS domains, without actually doing anything.


    +   Use AdvFS fileset quotas to limit the amount of space an individual fileset
    may consume of the file domain. It frequently makes sense for an AdvFS file domain
    to contain multiple filesets, and quotas prevents a single fileset from using
    all available space.'
  merge: -1
