    # 3.4 Managing Disks


    The fixed disk is the most important component of the storage subsystem. In this
    section, we cover some of the more common tasks of managing the disk subsystem.


    # 3.4.1 Adding New Disks to the System


    In this section, we cover one of the most important aspects of storage management
    on a Tru64 UNIX system: adding new devices and making them available to the users
    andor applications that require them. It is very important to master this task,
    because you will likely be doing it frequently as storage requirements change.
    In this section, we give you the steps required to add new storage to a Tru64
    UNIX system. We start with a rough outline, then we give details for each step
    as we go along.


    To add a new disk to your Tru64 UNIX system, you must perform the following steps:'
