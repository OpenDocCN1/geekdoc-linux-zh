    supporting 62 hosts.


    See Table 7.2 for the results of different subnet masks on Class B and Class C
    networks. Note that two have already been subtracted from the result subnet and
    host quantities to take into account the reserved subnet and host numbers.


    # 7.5 Hardware Address


    Once a host name has been translated into an IP address, the next step for the
    networking subsystem to do is identify which physical computer on the network
    is assigned that IP address. The third and final address is the hardware or Media
    Access Control (MAC) address. Every network interface (Ethernet, Token Ring, FDDI,
    etc.) has a unique hardware address, and this address is typically burned into
    a read-only memory (ROM) chip and is unchangeable. A system’s MAC address is displayed
    from the SRM console prompt with the “show device” command:'
