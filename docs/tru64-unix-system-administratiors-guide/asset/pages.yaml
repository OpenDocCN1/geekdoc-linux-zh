    # 9.3.5 Process Priority


    Tr64 UNIX processes are scheduled for execution based on an attribute called the
    process priority. This parameter is a number between 0 and 63, with a lower number
    indicating a higher scheduling priority. The highest numbers (44 to 63), which
    represent the lowest scheduling priority, are assigned to user jobs. Priority
    numbers 32 to 43 are used by system groups, while 0 to 31 are reserved for real-time
    jobs. The process priority is maintained internally by the kernel, and process
    priorities are dynamically updated based on a number of variables, such as the
    "nice value" of a process.


    The concept of nice value is the primary way for a system administrator to start
    a process with a higher or lower scheduling priority, or change an already running
    process''s priority. A process''s nice value is a number between -19 and 19 that
    is added to the process''s priority number. Since a lower priority number indicates
    higher priority, a lower (negative) nice value further reduces the priority number,
    thereby increasing the process''s scheduling priority. A process with a positive
    nice value increases the process''s priority number, thereby reducing the process''s
    scheduling priority. This causes the process to be "nicer" to the system, hence
    the name.'
