    # Tru64 UNIX File Systems


    Once a disk has been partitioned, it is ready for the creation of file systems,
    which is the most common use of disk space on a Tru64 UNIX system. A file system
    is a structure built on a disk partition that allows the partition to contain
    files and directories in a hierarchical format. The file system is the primary
    environment of files and directories that most users see when logging onto the
    system. Tru64 UNIX supports the following types of disk-based file systems:


    +   - UNIX File System (UFS)

    - Advanced File System (AdvFS)

    - Compact Disk File System (CDFS)

    - Digital Versatile Disk File System File System (DVDFS)


    These four file system types make up the majority of all file systems in use on
    Tru64 UNIX systems, and system administrators should be familiar with their management.
    The UFS and AdvFS file systems will be discussed in this section; information
    on the CDFS and DVDFS file systems can be found later in this chapter, in the
    section on managing these devices.


    In addition, Tru64 UNIX also supports the following file system types:


    +   - Memory File System (MFS)

    - Process File System (PROCS),

    - File-on-File Mounting File System (FFM)

    - File Descriptor File System (FDFS)

    - Network File System (NFS)

    - Cluster File System (CFS)'
