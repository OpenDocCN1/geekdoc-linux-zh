  md: 'to the /sbin/init.d/syslog script. Due to its importance in the error-logging
    process syslog is started fairly early in the run level 3 process; however, any
    kernel messages logged before syslog starts are stored in the kernel''s preserved
    message buffer. The syslog daemon reads its configuration when it starts up and
    rereads the configuration file when it receives a hang-up signal (e.g., -HUP <pid>).
    The configuration file is simply a set of rules that instruct the syslog daemon
    what messages to log and where to log those messages.


    When syslog starts, it creates the file /var/run/syslog.pid if possible. This
    file contains a single line with the process ID (PID) of the syslog process. This
    file can then be consulted to obtain syslog''s PID when it is necessary to stop
    or restart syslog. For example, to terminate syslog, use either of these commands:


    ```

    # kill cat /var/run/syslog.pid

    ```


    or


    ```

    # /sbin/init.d/syslog stop

    ```


    Running the syslog script with a "stop" will kill syslogd by using the "kill"
    command above.


    # 12.2.3 Disabling and Enabling syslog Console Messages


    A common destination for syslog messages is the system console. Depending on the
    amount of activity or the health of the system, the volume of messages printed
    on the console may be very low. Occasionally, however the system administrator
    needs to diagnose one or more ongoing system problems from the console. If the
    syslog daemon is sending frequent messages to the console in this situation, it
    may be difficult to troubleshoot problems. Beginning with Tru64 UNIX 4.0, there
    is a new command, /usr/sbin/syslog, that allows enabling and disabling syslog-generated
    console messages. If you are working from the console and find syslog informational
    messages hampering your effectiveness, simply issue this command:


    ```

    # /usr/sbin/syslog console_off

    ```


    This will disable syslog messages. Remember to re-enable syslog messages when
    the console work is completed so that the messages will once again be sent to
    the console:'
