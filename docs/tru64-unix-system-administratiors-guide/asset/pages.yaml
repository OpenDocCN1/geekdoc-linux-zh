    # 4.5.3 Subset Installation


    The most important role of the setld command is as a software subset installer.
    Every Tru64 UNIX and third-party software product that is packaged as a software
    subset is installed via the setld utility. The process of installing a software
    subset is much more than just copying software onto a system. The setld utility
    does the following during a software load operation:


    +   - Validate dependencies and prerequisites

    - Execute preinstallation procedures, if any

    - Copy subset components into place

    - Register the product in the system software subset inventory

    - Execute post-installation procedures, if any


