  md: 'The setclr program uses the verify program when installing subsets to guarantee
    correctness. You can use the verify command if a file has become corrupt, deleted,
    or you suspect that someone has tampered with the file.


    Note: If a patch kit has been installed on the system, the verify command will
    report errors. You can call the Compaq Customer Support Center (CSC) for a copy
    of allverify2, which is a "patch friendly" verification script that uses the verify
    program. The allverify script is an unsupported tool, which is frequently used
    by CSC Specialists.


    # 4.5.7 Restoring a File from a Subset


    If a file or program is accidentally deleted from the system and a backup is not
    readily available, the file can be either copied from the installation CD or extracted
    from a subset on the installation CD.


    For example, the awk and convauth programs are inadvertently removed from the
    system. Here are the steps to replace the files:


    +   1. Locate the subset.


    ```

    # grep -E "/awk/convauth" /usr/.smdb.*.inv

    /usr/.smdb./OSBASE510.inv:0 16496 35436 3 100755 8/24/005

    10 f /usr/bin/awk none OSBASE510

    /usr/.smdb./OSBASE510.inv:0 16496 00000 3 4 100755 8/24/005

    10 1 /usr/bin/nawk /usr/bin/awk OSBASE510

    /usr/.smdb./OSFC2SEC510.inv:0 26 00000 0 0 120777 8/25/005

    510 s /usr/tcb/bin/convauth /usr/tcb/bin/convauth OSFC2SEC

    /usr/.smdb./OSFC2SEC510.inv:0 1983 34555 3 4 100664 8/24/005

    10 f /usr/lib/nls/msg/en_US.ISO8859-1/convauth.cat none 8/24/005

    /usr/.smdb./OSFC2SEC510.inv:0 26 00000 0 0 120777 8/25/005

    510 s /usr/sbin/convauth /usr/tcb/bin/convauth OSFC2SEC

    /usr/.smdb./OSFC2SEC510.inv:0 32944 50838 6 11 101110 8/24/005

    10 f /usr/tcb/bin/convauth none OSFC2SEC510

    ```


    The awk command is in the OSFCBASE subset. The convauth program is OSFC2SEC510.


    +   2. Mount the Tru64 Operating System CD.


    ```

    # mount /dev/disk/cdrom0c /mnt

    ```'
