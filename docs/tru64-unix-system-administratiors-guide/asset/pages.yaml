    zero (0) as a PID sends the signal to all processes having a process group (PGID)
    equal to the PGID of the sender, except PIDs 0 and 1. Specifying -1 as a PID behaves
    differently depending on the effective user ID (EUID) of the sender. If the EUID
    is not 0, or root, the signal is sent to all processes with a UID equal to the
    EUID of the sender, except PIDs 0 and 1. However, if the EUID of the sender is
    0, or root, the signal is sent to all processes on the system, again excluding
    PIDs 0 and 1.


    # 9.7 Allocating CPU Resources


    Tru64 UNIX systems, particularly large servers, frequently support a mix of different
    user and application types. A single server might support a production database,
    a development group creating new software, and users accessing their e-mail. In
    such cases, it''s important to ensure that the various applications receive enough
    resources to accomplish their tasks—without interfering with all the other applications
    trying to accomplish their own tasks. Tru64 UNIX provides several methods for
    allocating CPU resources to specific users, groups, processes, or applications.
    These include:


    +   - Partitioning the system (dependent on system hardware)

    - Defining processor sets

    - Binding processes to CPUs or processor sets

    - Using the class scheduler


    # 9.7.1 System Partitions


    System partitioning is the ability to organize a system''s physical resources
    (processors, memory, and I/O devices) into several smaller “virtual machines,”
    or partitions. Although this capability is a function of the underlying hardware,
    rather than the operating system, it is an important tool for Tru64 UNIX administrators.
    The larger members of the AlphaServer family provide this ability, allowing one
    large server to operate as, completely'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'independent partitions, running its own copy of Tru64 UNIX—or even another
    operating system, such as Compaq''s OpenVMS.


    Partitioning is useful in cases where complete system-level independence is desirable.
    For example, you might wish to run a production version of your application or
    database in one partition, and a test version in another partition. Or you might
    wish to run one partition at a newer version of Tru64 UNIX, in preparation for
    upgrading your entire system. The disadvantage of partitioning a system is that
    the allocation of resources is not dynamic; you can''t, for example, move processors
    from one partition to another while the systems are running. To reconfigure the
    partitions, you must shut down each partition, perform the reconfiguration, and
    then restart the partitions. There are also hardware-dependent restrictions on
    how many partitions can be configured.


    The details of creating and using partitions vary depending on the specific model
    of AlphaServer being used. For this reason, you should consult the hardware document
    for your system for more information.


    # 9.7.2 Processor Sets


    Tru64 UNIX gives you the capability to divide your system''s CPUs into "processor
    sets" (or "psets" for short). Processor sets are groups of one or more processors
    that are treated as "virtual" processors for scheduling purposes. By default,
    the system creates a default processor set that includes all processors. The pset_info(1)
    command lists the current processor sets on the system:


