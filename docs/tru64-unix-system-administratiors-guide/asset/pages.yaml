    Note that LSM volumes can be used in conjunction with AdvFS, as components of
    AdvFS file domains. We''ve barely scratched the surface of what LSM can do for
    your site; for more information on LSM, refer to the Tru64 UNIX Logical Storage
    Manager guide.


    # 3.5.1 Managing Free Space


    One of the important tasks of a system administrator is to manage the existing
    free space on the file systems. You can manage the free space in one of two ways:'
  merge: -1
  pgno: 119
- img_proc: true
  md: '+   - Voluntary policy


    +   - Quotas


    Which use at your site will depend upon the system requirements and how good the
    users are policing themselves. Most sites start out with the former and end putting
    quotas in place later. Other sites have no need to police users because they don''t
    have any interactive users. Such systems need to be dedicated to specific applications,
    such as commercial databases, which are only accessed by other client systems
    over the network. In such cases, no policy is required.


    # 3.5.1.1 Finding the Disk Hog


    Occasionally, it will become necessary to find out why a particular file system
    is becoming full and try to track down which user is hogging the space. With a
    voluntary policy, it is up to the system administrator to use the usage periodically
    for monitoring the current free space; the df(1) command is the most obvious tool
    for however, it is not the only tool available. Typically, a system administrator
    would use one or a combination of the following tools to determine where the blocks
    have been consumed on a given system.


    +   - df(1)—Displays free space on a mounted file system basis. The output can
    be given in 512-byte blocks or in kilobytes.


    +   - vdf(8)—A better df for use with the Advanced File System. This tool will
    give more accurate information based on output from showdfm(8), showsets(8), shfragbf(8),
    and df(1) to more accurately depict the usage patterns.


    +   - du(1)—Shows usage for all files in all subdirectories under a specified
    directory. The output can be given in either 512-byte blocks or kilobytes. A useful
    switch for narrowing a search to a specified file system is “x”, which does not
    allow the search to cross a mounted file system boundary.


    +   - find(1)—Can be used to display files of a given size or larger and/or that
    have been created within a specified time period. A useful switch is “mount” (or
    “xdev”), which does not allow the search to cross a mounted file system boundary.


    # 3.5.1.2 Quota Management


    Once you''ve spent many performing the method described in the previous section,
    you will understand the usefulness of quotas. The main benefit of setting quotas
    is for those cases where you cannot control your users behavior'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'using the standard methods of peer pressure and intimidation, and their productivity
    is affected. There will always be those people who will never take the time to
    clean up after themselves. The advent of ever larger and cheaper disk farms makes
    the task of policing more difficult.


    Quotas for both AdvFS and UFS are most frequently used to limit usage on a Tru64
    UNIX file system on a user-by-user basis. You can apply quotas to file systems
    to establish a limit on the number of blocks and inodes (or files) that a user
    or group of users can allocate. You can set a separate quota for each user or
    group of users on each file system. AdvFS also has the concept of fileset quota
    that does not exist and has no meaning in the context of a UFS file system. For
    more information, see our discussion of fileset quotas in Section 3.5.2.6.


    File systems can have both soft and hard file limits. When a hard limit is reached,
    no more disk space allocations or creations will exceed the limit. The soft limit
    may be exceeded for a period of time known as the grace period. If the soft limit
    is exceeded for an amount greater than the grace period, no more disk space allocations
    or creations are allowed until enough disk space is freed or enough files are
    deleted to bring the disk usage or number of files below the soft limit.


    # Managing Tape Devices


    The tape devices on a typical Tru64 UNIX system are used for backing up files
    and restoring from those backups. As such, the system administrator will either
    be using the tape drive to test and perform backups on a routine basis or restoring
    files on an emergency basis. It is important to understand how the tape drive
    works on your system before you use the tape drive for restoring backups. We cover
    backups in greater detail in Chapter 11, and we refer to that discussion for details
    on those procedures. In this section, we refer to the operations you may be called
    to perform on the tape drive itself. Since tape drives operate differently from
    one to another, we will necessarily be general in our discussion.


    # Adding a New Tape Device to the System


    The steps for adding a new tape drive to a Tru64 UNIX system are similar to those
    we followed for adding a disk device, so we refer you to that procedure for the
    particulars on each of the steps. The procedure is generally following:'
