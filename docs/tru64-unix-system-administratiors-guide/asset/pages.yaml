    RAID 5 when I/O performance is an important factor. In those cases, hardware RAID
    5 should be used to maximize performance and reduce complexity.


    Fourth, combining software and hardware RAID may be the best option in some cases.
    For example, some amount of redundancy is not available with hardware RAID (e.g.,
    mirroring across buses), so a software solution may be the only option.


    # Tru64 UNIX Device Management


    This section introduces the concepts required to understand devices in Tru64.
    For the most, Tru64 UNIX is similar to other UNIX flavors in some ways and very
    different in others. It is important to understand these similarities and differences
    so that a thorough coverage of the file systems is possible. We will begin rather
    generically with an overview of device management, but our end goal is to get
    into an in-depth discussion of the management of disk devices, since those are
    the devices used in the management of the file systems.


    We will be discussing only the Version 5.0 device naming and structure here. Beginning
    with 5.0, Tru64 UNIX device management was changed dramatically not only from
