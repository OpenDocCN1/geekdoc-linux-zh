    # 4.5.4 Subset Deletion


    The opposite of software installation is subset deletion, and the setld command
    can quickly remove individual subsets from a Tru64 UNIX system. In order to remove
    a subset, the subset must be installed and the user must know the subset''s name.
    Use setld''s inventory flag (-i) to determine a particular-subset''s name. Once
    it is run, the setld command can remove the subset:


    ```

    # setld -d OSLEARN425

    Deleting "Computer Aided System Tutor" (OSLEARN510).

    ```


    Be aware that no confirmation is requested and the subset is immediately-deleted
    from the system. If a subset is inadvertently removed, simply reinstall it from
    the distribution media.


    # 4.5.5 setld(8) Activity Logging


    The setld utility conveniently logs all operations (installs, deletes, inventories,
    etc.) along with a time/date stamp in a log file for future reference. This log
    file (setld.log) is located in the /var/adm/smlogs directory. Refer to this log
    file for information on a past setld transaction.


    # 4.5.6 The verify(8) Command


    The verify(8) command is useful for checking the state of the files installed
    on the system. It checks for inconsistencies in the file size, checksum, user
    ID, group ID, permissions, and file type. It also checks for missing files.


    The verify command appends all errors and informational messages to the /var/adm/smlogs/verify.log
    file.'
