    ```

    0,15,30,45 * * * /usr/bin/uptime >> /tmp/uptime.log

    ```


    Be sure to monitor the size of the uptime.log and truncate or remove as necessary,
    for the log will grow by approximately 70 bytes every 15 minutes. After running
    uptime in this manner for several days, review the log file and determine what
    the busiest times of the day are, both in login activity and load averages.


