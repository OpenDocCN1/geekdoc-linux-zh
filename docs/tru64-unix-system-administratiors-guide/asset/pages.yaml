    # 11.2.3.6 dd(1)


    The dd(1) command is a specialized utility for copying data from one place to
    another. The dd reference page for details of the command''s options. The three
    most common options are if, of, and conv, which refer to Input File, Output File,
    and CONVersion, respectively. As part of a dd copy operation, dd can also perform
    certain conversions to the data. For instance, dd can be used to convert an ASCII
    file to EBCDIC, or all alphabetic characters in the file can be converted to uppercase:


    ```

    # dd if=text.ascii of=text.ebcdic conv=ebcdic

    # dd if=text.lower of=text.upper conv=ucase

    ```


    As such, the dd command is not really a general-purpose backup utility. However,
    dd is a useful tool when applied in special situations. Since dd''s input and
    output is specified to be a file, dd can read from and write to device files just
    as handily as to normal operating system files. For example, suppose it became
    necessary to duplicate a disk drive—one possible motivation for doing this could
    be a close to a system for deployment. The dd command is perfect for this type
    of task. The following commands will copy the contents of disk dsk0 to disk dsk1:


    ```

    # disklabel -z dsk1

    # dd if=/dev/rdisk/dsk0 of=/dev/rdisk/dsk1 conv=noerrror,sync

    ```


    For this operation to succeed, the two disk drives should be identical in size
    and ideally should be the same model. The initial disklabel command'
