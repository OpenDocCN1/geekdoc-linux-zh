    # 8.7 Advanced Printing


    Advanced Printing is a distributed, client/server, standards-based print sub-

    system available from Compaq as an Associated Product. It provides a logical

    queue layer between the user and the physical printers themselves. The printers-

    in the previous sections are all considered physical queues, since they are

    associated with a specific physical printer. The Advanced Software

    allows a user to specify a printer type or a logical printer, rather than a particu-\lar
    printer, and provides a framework where the user can query types

    of printers. The print system is based on ISO/IEC 10175 and POSIX

    1387.4 standards. To understand how this new printing environment works,

    consider its components. Advanced Printing is composed of servers, clients,

    spoolers, supervisors, and logical and physical printers.


    Clients make requests of servers, by way of impress communication

    (IPC), and the servers perform an action, usually associating the job to a

    printer and printing it. The client programs include the command line-

    face (CLI), the graphical user interface (GUI), and the LPD inbound gateway.

    Primarily, the clients will request to print a job or get the status of a printer.

    The servers consist of the spoolers and supervisors: a system that is

    Advanced Printing Server will have at least one spooler and at least one super-


    Chapter 8'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'visor. The spooler directs print jobs to print queues and schedules them to
    be printed. The supervisor takes the spooler jobs from queues and matches up job
    requirements to printer capabilities, then prints the jobs and reports status
    to the spooler and clients.


    Logical and physical printers are connected by queues; users print to logical
    printers. By using this approach, the physical printers can be changed with little
    or no impact to users, and the users can specify their requirements based on printer
    capabilities rather than specifying a particular printer at a particular location.
    Also, the system administrator can set the logical-physical printer relationship
    to be fan-in or fan-out. Fan-in means several printers point to a single physical
    printer; fan-out is the opposite, with a small number of logical printers pointing
    to a number of physical printers. Consider this example: if you had four equally
    capable laser printers, you might consider creating one logical printer called
    “laser” that feeds all four printers. There are several benefits to this approach,
    not the least of which are load balancing and the ability to take one of the physical
    printers offline for maintenance. Taking a printer offline can be done with no
    impact to the user whatsoever, provided the remaining printers can keep up with
    the printing demand.


    # 8.7.1 Installing


    Before installing the Advanced Printing subsets, make sure the installation requirements
    are met. For a print server, the requirement is 64 MB of memory, while clients
    need at least 32 MB. Also, consideration should be given as how the print system
    will be configured. For example, how system(s) will be servers, which will be
    clients, will the LPD Gateways be required, how will the name space be managed,
    and so forth. You can find more details on these decisions in the Advanced Printing
    Software Installation Guide.


    When you are ready to perform the installation, locate the Associated Products
    CD, Volume 2, and mount it:


    ```

    # mount -r /dev/disk/cdrom0 /mnt

    ```


    Then use setld to install the Advanced Printing subsets:

    setld -1 /mnt/Advanced_Printing/kit


    Note: You can also install the Advanced Printing subsets via RIS. The RIS server
