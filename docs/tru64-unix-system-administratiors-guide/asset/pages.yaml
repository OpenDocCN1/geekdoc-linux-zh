    # 4.2.5 SysMan Clone


    Tru64 UNIX provides a method to clone a system''s configuration. This is particularly
    useful if you are attempting to set up a lot of systems with the same configuration.
    We discussed cloning briefly in Chapter 2, “Installation.” You may also want to
    check out the Tru64 UNIX Installation Guide—“Advanced Topics or the sysman_clone(8)
    reference page for more information regarding configuration cloning.


    # 4.3 Runtime Configuration


    When the Tru64 UNIX system boots, all the way from the console (SRM) prompt to
    the login screen, many things happen to prepare the system for use. While we will
    not endeavor to give you all of the gory details of the boot process, we will
    tell you that once the kernel is loaded, it starts a very important daemon known
    as init(8).


    # 4.3.1 The init(8) daemon


    The init daemon is responsible for the runtime configuration of your system. Tru64
    UNIX has four run levels by default (although more can be configured), and it
    is the job of the init daemon to configure the system to operate in these run
    levels.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Table 4.16 Tru64 UNIX Run Levels


    | Run Level | Script | Description |

    |---|---|---|n| 0 | /sbin/rc0 shutdown | Shut down and halts the system. |

    | s | /sbin/rc0 off | Single-user Mode |

    | 2 | /sbin/rc2 | Multi-user Mode sans Networking |

    | 3 | /sbin/rc3 | Multi-user Mode with Networking |


    When the init daemon is started it reads the /etc/initab file. The /etc/initab
    file tells the init daemon what to run. Each line in the file is colon delimited
    and has the following format:

    Identifier:Runlevel:Action:Command5

    Here is a typical example of the /etc/initab file.


    ```

    is:3:initdefault:

    ss:S:wait:/sbin/rc0 shutdown < /dev/console > /dev/console 2>&1

    s0:0:wait:/sbin/rc0 off < /dev/console > /dev/console 2>&1

    msmr:sysinit:/sbin/lsmbstartup -b < /dev/console >/dev/console 2>&1 ##LSM

    lsm23:wait:/sbin/lsmbstartup < /dev/console >/dev/console 2>&1 ##LSM

    vol23:wait:/sbin/vol-recon -n < /dev/console >/dev/console 2>&1 ##LSM

    fs23:wait:/sbin/bheckrc < /dev/console > /dev/console 2>&1

    klas:wait:/sbin/kloadsrv < /dev/console > /dev/console 2>&1

    hyd23:wait:/sbin/init.autoconfig start < /dev/console > /dev/console 2>&1

    update23:wait:/sbin/update > for a description of each field.

    msmsync23:wait:/sbin/sysconfig -v vfs smoothsync-age=30 > /dev/null 2>&1

    msmsync5:S:wait:/sbin/sysconfig -r vfs smoothsync-age=0 > /dev/null 2>&1

    it23:wait:/it < /dev/console > /dev/console 2>&1

    mk3:wait:/kkmod > /dev/console 2>&1

    s23:wait:/sbin/rc2 < /dev/console >/dev/console 2>&1

    s3:wait:/sbin/rc3 < /dev/console >/dev/console 2>&1

    cms1234:respawn:/usr/sbin/getty console vt100

    cms:sysinit:/sbin/sysconfig -o cms 100 > /dev/null 2>&1

    ```


    > * See the initab (4) for a description of each field.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# 4.3 Runtime Configuration


    | Table 4.17 Run Levels in the inittab File |

    | Identifier* | Runlevel | Action† | Command |

    | --- | --- | --- | --- |

    | ss | Ss | wait | /sbin/rc0 shutdown < /dev/console > /dev/console 2&1 |

    | s0 | 0 | wait | /sbin/rc0 shutdown < /dev/console > /dev/console 2&1 |

    | s2 | 23 | wait | /sbin/rc2 < /dev/console > /dev/console 2&1 |

    | s3 | 3 | wait | /sbin/rc3 < /dev/console > /dev/console 2&1 |

    * * Fourteen-character field used to uniquely identify the entry. This is optional.*

    † Valid actions are: respawn, wait, once, boot, bootfail, powerwait, off, initdefault,
    and sysinit. See the inittab(4) reference page for more information.


    Among the lines in /etc/inittab are informing init to execute scripts that turn
    run other scripts to ultimately start all the services you have configured.


    Here’s what happens when the system boots to multi-user mode without networking
    services configured (runlevel 2):


    +   - The kernel (typically, /vmunix) starts the init daemon.

    - The init daemon reads /etc/inittab.

    - The init daemon runs many programs including the /sbin/rc2 script.

    - The rc2 script executes all the scripts that start with an “S” in /sbin/rc2.d.


    If you look in the rc?.d directories, you will see files that either start with
    a “K” or an “S”. If you look a little closer, you will see that these are symbolic
    links to scripts in /sbin/init.d. For example:


    ```

    # file /sbin/rc2.d/S12evm

    /sbin/rc2.d/S12evm:           symbolic link to ..init.d/evm

    ```


    Exploring further still, you will see that there appears to be a method to this
    rc madness in the links start with a “K” or an “S” followed by a number, and then
    a name.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# # /sbin/rc.d


    | K00lpd | K16timed | K48route | K56niffd | S19security |

    | K03lat | K20cron | K49gateway | K57quota | S20sia |

    | K04dhcp | K30sendmail | K50syslog | K89denesta | S25login |

    | K05inet | K35nfs | K51uucp | S50oversecure | S35streams |

    | K08collect | K36presto | K52write | S05paging | S45atm |

    | K09snmpnd | K40nfsmount | K53binlog | S06mfsunlog | S10recpasswd |

    | K12envmon | K43nis | K54.50ip6host | S12evm |

    | K12insight | K45named | K55inet | |

    | K15xntpd | K47rwo | K56netrain | S15uucp |


    The links are named in the order that they are.


    So what’s with the “K” and “S”? Well, the “S” scripts are run when moving from
    a lower run level to higher run level (like during system startup), while the
    “K” scripts are run when moving from a higher run level to a lower run level.


    If you install an application that you would like to have started every time the
    system boots, you can place the application’s init script in /sbin/init directory
    and create a symbolic link to the rc.d directory that corresponds to the run level
    where you would like the application started/stopped. It should be noted that
    these scripts have a consistent standard:


    ```

    scriptName start|stop

    ```


    The scripts are not restricted to only start and stop options, but all will have
    at least these two. Therefore, it is important that any init scripts you create
    handle the start and stop arguments arguments appropriately. As an example, we
    suggest you take a look at the existing scripts in /sbin/init.d directory and
    note how they deal with the arguments. Once you are comfortable with them, you
    can become fancier according to your needs.


    For more information see the Tru64 UNIX System Administration guide and the init(8),
    inittab(4), rc0(8), rc2(8), and rc3(8) reference pages.


    # 4.3.2 rc.config, rc.common, and rcmgr tour


    If we continue digging into this configuration mystery, one of the next things
    that you notice is that out of the nearly 70 scripts in the /sbin/init.d directory,
    more than 40 of the scripts reference either the rcmgr(8) command [33], the rc.config(8)
