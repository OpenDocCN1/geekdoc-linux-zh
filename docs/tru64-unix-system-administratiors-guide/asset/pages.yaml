  md: 'These fields schedule the ps command to run at 0, 15, 30, and 45 minutes past
    the hour; every hour of the day; every day of the month; every month of the year;
    on days of the week 1 through 5 (Monday through Friday). Note that the full pathname
    of the ps command and the output file are used. Specifying full pathnames in a
    crontab is strongly recommended to avoid "command not found" or output files in
    odd places. If the cron executed command generates errors or output that is not
    redirected, cron emails this out to the crontab owner. To avoid these emails,
    always redirect output or errors to a log file or to the bit bucket (/dev/null).


    A crontab is named for its owning user. The default Tru64 UNIX root crontab is
    /var/spool/cron/crontab/root, and contains the following entries:


    ```

    # crontab file

    # * * * * find /var/preserve -mtime +7 -type f -exec rm -f {; \\

    20 * * * find /tmp -type f -atime +2 -exec rm -f {; \

    30 * * * find /var/tmp -type f -atime +7 -exec rm -f {; \

    40 * * * find /var/adm/syslog.dated -depth -type d -ctime +5 -exec rm -rf { }
    \

    # 0 3 * 4 /usr/sbin/acct/dodisk * /var/adm/diskdiag &

    ```


    A line beginning with a pound sign (#) is considered to be ignored by cron. Take
    advantage of this and insert literal comments in your crontabs for future reference.
    In addition, a crontab entry can be "comment out" to temporary disable of that
    job by inserting a pound sign at the beginning of the line.


    The cron daemon executes the command from the owner''s $HOME directory with a
    default environment, defining HOME, LOGNAME, SHELL (/usr/bin/sh), and PATH (/usr/bin).
    If additional environment variables are necessary, or if a different shell is
    desired, such as /usr/bin/ksh or /usr/bin/csh, you must explicitly specify them.
    Except for simple one-line commands, it is recommended that shell scripts be created
    that contain all necessary environment variables and the resulting script be specified
    in the crontab file.


    The proper way to create or edit a crontab is with the crontab(1) command. The
