  md: '# 6-14


    Applicability: All environments in which the organization deploying RFID systems
    determine the location of the RF equipment (which excludes many consumer and supply-chain
    applications).


    Benefits: There reduced risk of interference with the legitimate radios, eavesdropping,
    and unauthorized RF subsystem transactions. It also allows for mitigation of HERF/HERO/HERP.


    # Secure Disposal of Tags


    Control: Secure disposal involves physically or electronically destroying tags,
    as opposed to discarding them when they are no longer needed to perform their
    intended function. Physical destruction may involve tearing or shredding using
    a paper shredder. Electronic destruction can be accomplished by using a tag''s
    kill feature a strong electromagnetic field to render the tag''s circuitry inoperable.
    A tag supports an electronic disabling mechanism, which is the preferred way to
    disable a tag before it is disposed. Because it can be accomplished without touching
    the tag, the cost of effort is reduced.


    Applicability: RFID applications in the continued operating presence of a tag
    after it has performed its intended function pose business intelligence or privacy
    risk (e.g., an adversary can subsequently use the presence of the tag to track
    items or people).


    Benefits: Destroying or destroying tags eliminates the possibility that they could
    be used later for tracking or targeting. It also prevents access to sensitive
    data stored on tags. These cases affect business intelligence and privacy risks.


    # Operator and Administrator Training


    Control: Operator and administrator training provide personnel with the skills
    and knowledge necessary to comply with the RFID system''s, IT security, and privacy
    policies, as well as agreements with external organizations. In most RFID administrations
    will perform various roles that might require different training materials for
    each role. For example, an administrator of midlevel might need more information
    than an operator of a mobile reader. Appropriate security and training addresses
    at least three points:


    +   1. What constitutes unauthorized use

    2. How to detect unauthorized use might be occurring

    3. To whom report violations


    If HERF/HERO/HERP tags are present, appropriate training should cover how to perform
    these functions. For example, operators might be trained how to clear tag memory
    before reuse.


    Applicability: All RFID implementations.


    Benefits: Operator training ensures that the system is used and maintained properly.
    Training also helps operators identify security violations and take appropriate
    actions to prevent their recurrence.


    # Information Labels/Notice


    Control: A written message is affixed to or with each tag or is posted near readers.
    The notice may inform users of the purposes of the RFID system or may advise users
    to minimize privacy or other risks (e.g., place an RFID-enabled access card or
    tag in metal foil or a sleeve that shields RF radiation when the card or tag is
    not in use).


    Applicability: All applications in there is a risk that could be mitigated with
    simple informational messages. The cases are relevant to consumer applications
    in where privacy is a concern.


    Benefits: Information labels or notices can communicate basic information about
    risks that might otherwise be left unknown to users who are able to take simple
    steps to mitigate the risk (e.g., remove a tag or place it in a shielded).


    Weaknesses: Distributing a tag is no guarantee that it will be read or understood.
    Notice is not an appropriate communications medium for complex concepts or instructions
    that may require formal security training on the systems.


    # Technical Controls


    Many technical controls are specified in industrially recognized standards, while
    others are available in proprietary systems.'
