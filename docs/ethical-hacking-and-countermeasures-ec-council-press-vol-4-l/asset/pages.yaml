    # Files and Directories


    # Everything Is a File


    In Linux, everything is in form of a file, including devices. This means everything
    on a hard drive and a disk is a file. It is the basic unit for storing data; files
    may be stored on hard drives, CD-ROMs, and other media. Folders are used to organize
    files within the system. Root (/) is the lowest possible folder. Directories are
    collections of files and links. A directory within a directory is known as a subdirectory.'
