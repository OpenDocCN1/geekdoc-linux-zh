    # # Hacking Tools


    The following section explains the hacking tools that may be used via a USB attack.


    # ## USBDumper


    USBDumper is an application that, when installed on a system, runs a background
    process that copies files from any USB drive connected to. The application is
    very dangerous because it requires a user to double-click to execute, and once
    this occurs, the application runs in the background and automatically downloads
    the contents of any USB drive connected to the system. This can be a security
    risk when used alone, but the risk is increased when it is integrated with other
    tools. Hackers are integrating with other tools (USB Hacks) and script to send
    the downloaded contents to locations through encrypted e-mail or FTP.

    Figure 7 shows the interface for the USBDumper application.


    # ## USB Switchblade


    USB Switchblade is the result of a community project that merged various tools
    and techniques to take advantage of Microsoft Windows security vulnerabilities,
    the majority of which were related to USB ports. The tool is used to recover information
    from systems (such as password hashes, LSAs, IP information, and browser history),
    autofill information, and create a backdoor to the target system layer. The access
    exposes some very serious vulnerabilities in Windows.

    The tool takes advantage of a security hole in U3 drives that creates a virtual
    CD-ROM drive, which allows the Windows AutoRun to start (unless disabled). If
    AutoRun or a U3 drive is not used, the application can be started by executing
    a single script on the drive.

    The most damaging feature of this tool is the ability to steal hashes from the
    target system and load them onto the drive for cracking later through the use
    of rainbow tables. The weakness of LM hashes is well known. With this installed
    on a U3 drive, it only takes a few seconds for someone with malicious intent to
    plug the drive into an open USB port on a system and walk away with the passwords
    for that.

    The application also finds the browser history (for both IE and Firefox), autofill
    information (exposing Web sites and other information), as AIM and MSN Messenger
    passwords. It also reveals product keys for some applications (mostly Microsoft
    applications). The tool also creates a ghost administrator account, and if the
    system is not behind a firewall, this account can function as a backdoor to the
    system.'
