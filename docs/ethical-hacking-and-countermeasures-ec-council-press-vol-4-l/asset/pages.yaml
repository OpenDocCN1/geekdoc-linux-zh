    # Malware: SymOS/Htool-SMSMender.A.int


    Affects: Symbian OS

    SymOS/Htool-SMSMender.A.int is a prototype program that targets return of copied
    SMS messages to the owner. The source code is distributed in an archive file HackSMS.rar.
    The archive includes a SIS file named XSMS.SIS. The spyware is installed under
    the name XSMS.

    SymOS/Htool-SMSMender.A.int provides an example for intercepting and forwarding
    SMS in the manner of Mobyspia.A or SymOS/Acallano.A. This entails containing the
    text of the last SMS message received, placing it into a new SMS, and then forwarding
    the message to the owner. The spyware copies the text of the last received and
    never sends the drafts SMS messages. It starts automatically on rebot.

    The source code for SymOS/Htool-SMSMender.A.int does not include functions for
    sending SMS messages to the malware. It does unimplemented functions, unused arguments,
    and functions that are commented out. These unimplemented functions can cause
    harm to the affected system, but may someday prove useful to other authors of
    spyware.


