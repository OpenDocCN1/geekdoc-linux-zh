  md: '# The Experts: EC-Council


    EC-Council''s mission is to address the need for well educated and certified information
    security and e-business practitioners. EC-Council is a global, member based organization
    of hundreds of industry and market matter experts working together to set the
    standards and raise the bar in information Security education and education.


    EC-Council certifications are viewed as the essential certifications needed where
    standard configuration and policy courses fall short. Providing a true, hands-on,
    tactical approach to security, individuals armed with the knowledge disseminated
    by EC-Council programs are securing networks around the world and beating the
    hackers at their own game.


    ![](img/1c954f62c3cf4ac9f7443b0c3ac2c1bb_1_0.png)


    # The Solution: EC-Council Press


    EC-Council Press marks an innovation in academic text books and courses study
    in information security, computer forensics, disaster recovery, and end-user security.
    by repurposing the essential content of EC-Council''s world class professional
    certification programs to fit academic programs, the EC-Council Press was formed.


    With 8 Full Series, 27 different books, the EC-Council Press is set to revolutionize
    global information security programs and ultimately create a new breed of practitioners
    capable of battling the growing epidemic of cybersecurity and the threat of cyber
    war.


    # This Certification: CEH – Certified Ethical Hacker


    Certified Ethical Hacker is a certification designed to empower the learner in
    an interactive environment where they learn how to scan, test, hack and secure
    information systems. Ideal candidates for the CEH-program are security professionals,
    site administrators, security officers, auditors or anyone who is concerned with
    the integrity of a network infrastructure. The goal of the Ethical Hacker is to
    help the organization take preventive measures against malicious attacks by attacking
    the system itself, all while staying within limits.


    # Additional Certifications Covered By EC-Council Press:


    - **Security5**

    Security5 is an entry level certification for anyone interested in learning networking
    and security. Security5 is an entry level certification for anyone interested
    in learning networking and security. Security5 means 5 components of IT: firewalls,
    anti-virus, networking, and web.


    - **Wireless5**

    Wireless5 introduces to the basics of wireless technologies and their practical
    adaptation. Learners are exposed to use wireless technologies; current and emerging
    standards.


    - **Network5**

    Network5 covers the ''Alphabet Soup of Networking – the base core knowledge of
    how infrastructure enables a web environment, to help students and employees work
    in an integrated environment.


    - **CHFI – Computer Forensic Investigator**

    CHFI Computer Forensic Investigation is the process of detecting hacking attacks
    and extracting evidence to report the crime and conduct an appropriate prosecution.
    The CHFI material will help participants master the skills to identify an intruder''s
    footprints and properly gather the evidence necessary once.


    - **EJISA – EC Network Security Administrator**

    The EJISA program is designed to provide fundamental skills needed to analyze
    the internal and external measures against a network, developing security policies
    that will protect an organization''s information.


    - **ECSA – Certified Ethical Security Analyst**

    The objective of ECSA is to add value to experienced security professionals by
    helping them analyze the outcomes of their tests. It is the in-depth Ethical Hacker
    and penetration testing certification that covers testing in all modern infrastructures,
    operating systems, and application environments.'
