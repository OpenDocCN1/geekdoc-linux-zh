    # # RFID Security and Privacy Threats


    RFID uses the powerful capability of wireless identification to reveal the nature
    and location of physical objects. For this reason, RFID is a favorite target for
    attackers, who may use the following methods to carry out an attack:


    +   - Sniffing

    - Tracking

    - Spoofing

    - Replay attacks

    - Denial-of-service attacks


    # ## Sniffing


    RFID tags are designed to be readable by any compliant reader; therefore, they
    are indiscriminate. This leads to unauthorized readers reading the tags from a
    distance, which affects privacy. Attackers may collect RFID data by oversharing
    something on the wireless RFID channel or eavesdropping on a wireless network.
    Unauthorized access of tag data leads to severe privacy implications. Medical
    and personal details can be revealed by the data collected using tags, which can
    cause denial of insurance coverage or employment of a person. If the collected
    data reveal information about a product, it can cause loss of business.


    # ## Tracking


    Through the use of tracking, groups of people as well as individuals can be monitored
    by RFID technology. tags facilitate secret monitoring of an individual''s locations
    and actions. RFID readers can be strategically placed to catch the unique responses
    from RFID tags of individuals and to identify the person with a tag. However,
    if there is a recurring group of tags without associated unique identifiers, an
    individual can be monitored by LEO (Low Earth Orbit) constellations. A LEO constellation
    is a group of satellites that have the ability to monitor and track RFID signals.


    # ## Spoofing


    A spoof attack occurs when attackers mimic genuine RFID tags by writing suitably
    formatted data on blank RFID tags. Cloning is another type of spoof attack that
    produces similar tags that thieves can purchase the items at cheaper prices. Similarly,
    digital signature turnpointers can be cloned, allowing attackers to attack a DST-based
    immobilization system and purchase gasoline.


    # ## Replay Attacks


    Relay devices intercept and retransmit RFID queries, which the attackers use to
    attack RFID applications. RFID-enabled license plates and E-plates are examples
    of current RFID systems that are vulnerable to a replay attack. The encrypted
    code of active E-plates is stored in the local government''s vehicle database.
    When an attacker scans the license plates of another car, he she records the encrypted
    identifier and replays it.


    # ## Denial-Of-Service Attacks


    To work properly, RFID systems must have properly RFID tags and back-end databases;
    otherwise, attackers can carry out a denial-of-service attack. They can steal
    RFID-tagged items either by removing the tags or placing them in a foil-lined
    booster bag that blocks RFID queries and temporarily deactivates them. If the
    tags are removed from RFID items and placed in a foil-lined booster bag, the tags
    cannot be detected by readers. If attackers remove the RFID tags and place them
    on other items, the RFID system renders useless. Another denial-of-service attack
    can occur if the attacker floods the RFID system by providing more data than it
    can handle normally.'
