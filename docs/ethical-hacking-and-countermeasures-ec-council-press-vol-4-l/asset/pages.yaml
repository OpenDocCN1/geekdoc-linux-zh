  md: '# RFID Security Controls 6-13


    Memorandum of Agreement (MOA) or Memorandum of Understanding (MOU). The MOU or
    MOA may specify the network connections and authentication mechanisms to use,
    the data to be shared, and the manner in which data should be protected both in
    transit and at rest. It may also address constraints on vendors, subcontractors,
    and other parties to the extent which they access the system.


    If the interenterprise application requires passwords to be shared across organizations,
    then the MOU or MOA should specify how these passwords will be generated, stored,
    and shared. The memorandum may specify IT security controls as methods of authentication,
    access control, or encryption that participating organizations should implement
    to protect the passwords.


    Benefits: Having an MOA or MOU significantly reduces the potential for misunderstandings
    and security breaches. They enable signatories to communicate their respective
    security requirements while also reaping the benefits of a business partnership
    that led them to collaborate in the development and use of the RFID system.


    Weaknesses: Monitoring an external organization''s enforcement of an agreement
    is difficult and unlikely. As result, violations may occur without detection.
    Risk can be mitigated by using independent auditors if signatories agree to allow
    third parties to conduct audits.


    # Minimizing Sensitive Data Stored on Tags


    Control: To place sensitive data on tags, the data could be stored in a secure
    enterprise subsystem and retrieved via the tag''s identifier.


    Applications: Using tags with on-board memory and process data is possible but
    expensive.


    Benefits: Adversaries cannot obtain information from the tag through rogue scanning
    or eavesdropping. Data encryption and access control is often more cost-effective
    if performed in the subsystem rather than in the RF subsystem.


    Weaknesses: Adversaries can often obtain valuable information from the identifier
    alone. For example, knowledge of the EPC manager and object classes within certain
    EPC formats may reveal the nature and details of a tagged object contained in
    a container. An adversary could target containers based on the perceived worth
    of their contents.


    Additionally, placing data in the enterprise subsystem makes data contingent on
    the availability of the network. Retrieving data over a network also introduces
    a small delay, which could be unacceptable for some applications.


    # Operational Controls


    # Physical Access Control


    Control: Physical access controls include fences, gates, walls, locked doors,
    turnstiles, surveillance cameras, and security guards. The objective is to limit
    radio communication over a short distance, room walls or partitioned walls may
    provide adequate protection if they are opaque to the relevant radio frequencies
    that the RF subsystem uses.


    Applicability: All RFID implementations, except those in which RFID tags or other
    system components are in the public areas.


    Benefits: Physical access limits the ability of an adversary to get close enough
    to RFID system components to compromise RFID data security or modify, damage,
    or steal RFID systems. Physical security applies to all RFID subsystems. In the
    RF subsystem, the primary objective of control is to prevent unauthorized communications.
    In the enterprise and interenterprise subsystems, the primary objective is to
    prevent physical access to the system components.


    # Appropriate Placement of Tags and Readers


    Control: RFID system equipment can be placed to minimize unnecessary electromagnetic
    radiation. Tags and readers can be kept away from:


    +   - Fuel, originally, and other materials that could cause harm if exposed to
    the electromagnetic radiation

    - Humans and sensitive products (e.g., blood, medicine) that might be harmed by
    sustained exposure to the RF subsystem radiation

    - Metal and reflective objects that can modify and amplify signals in unintended
    and potentially harmful ways

    - Legitimate radios with which the RF subsystem communication will cause interference'
