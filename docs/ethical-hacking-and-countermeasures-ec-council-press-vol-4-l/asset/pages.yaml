    to target systems to check for known vulnerabilities. It can be configured to
    perform a number of attacks.


    Nessus comes with its own programming language called NASL (Ness Attack Script
    Language), allowing the user to create custom scripts with minimal coding effort.
    It works as a client-server model where the Nessus server acts as the engine that
    connects the clients. A GUI helps users select targets and attack methods. There
    is also a multiplatform client written in Java. All communication between client
    and server is encrypted. Nessus is able to detect vulnerabilities in UNIX, Windows,
