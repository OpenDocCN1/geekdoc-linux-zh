  md: '# 1-14 Chapter 1


    Some of the common vulnerabilities are as follows:


    +   - BIND (Berkeley Internet Name Domain) vulnerability: BIND is a popular DNS,
    and attackers target to trigger a denial-of-service (DoS) event. If system administrators
    fail to keep the version of BIND up to date, then they will be vulnerable to further
    attacks.


    +   - Linux Cross Referencer (LXR) vulnerability: Linux Cross Referencer (LXR)
    is a software toolset for indexing and presenting source code repositories. LXR
    is mainly used with Linux''s source code, but it can be useful for other software
    projects. It uses a Web navigator to navigate through kernel versions by the version
    number by passing a script, ''v''. To open a file without a filter, some content
    is placed in the ''. special directory. Here is an example of such code:


    ```

    http://source?v=../../../../j/test/password%00

    ```


    +   - Util-Linux vulnerability: Local users can exploit the Util-Linux vulnerability
    to perform actions with unauthorized privileges, allowing a user to circumvent
    the noresid out. The Util-Linux collection comes with systems and provides essential
    utilities. This vulnerability occurs when mount and programs incorrectly check
    the return value of setuid() and getgid(). This vulnerability can be used to exploit
    and perform actions with high privileges.


    +   - Linux kernel capability vulnerability: The Linux kernel capability vulnerability
    is found in a set that can try to break the root permissions into a series of
    capabilities. Capabilities of the program can be set and modified so that root
    privileges are not given to any normal user. Using this vulnerability, local users
    can gain root privileges.


    # Chroot


    If an attacker is able to successfully gain root privileges, then he or she will
    be able to do a lot of damage to the system. One way to limit the damage of an
    attack is chroot. Chroot is a security feature that allows a user to choose the
    directory that an application can access. This feature restricts access to the
    entire directory from unauthorized services and bases of an intruder. If the attacker
    is able to discover a vulnerability in a network service, he or she will be able
    to access the root system and the file system. However, if the attacker is able
    to discover a local vulnerability, he or she will have root access. Root has a
    lot of authority and many capabilities. Services running as root can gain additional
    capabilities. The most objective of attackers is gain root access on the compromised
    machine. Chroot prevents limiting the privileges of a root process. The directory
    is limited to known as the "jail". For example, assume that a program, testscript,
    is restricted to a portion of the directory tree under /local/testroot/. To create
    a jail for testscript, the testscript attempts to access files or directories
    outside the test. If the testscript actually accesses the file /input/test/testinput.txt.
    If the administrator wants to run the program testscript.exe, he or should chroot
    it before accessing it by using the command chroot /local/testroot /bin/testscript.
    This will first change the root to /local/testroot and then run the program /bin/testscript.


    # Tool: Addjails


    Addjails is a tool that automate the creation of chroot jails. It commonly used
    debugging programs in the jail. It also helps creating new users in the jail.
    Similar programs are Cell and Zorp''s Jail.


    # Why Is Linux Hacked?


    There are a number of reasons why Linux has become the target of so many attacks.
    Linux is an attractive target because it is used on a large number of servers,
    making it de facto backend. Vulnerabilities are easier to gain because the source
    code is freely available. Third, there are a large number of applications installed
    on Linux by default, making the system vulnerable. Unless system administrators
    are careful in setting policies and updating programs, vulnerabilities can proliferate.


    Some good countermeasures to anticipate problems like the following:


    +   - Turning off the sid and gid permissions in programs where they are not essential.
    This prevents an attacker from using a buffer overflow to escalate his or her
    privileges.


    +   - Software such as StackGuard, Libsafe, and Openwall''s nonexecutable stack
    patch.'
