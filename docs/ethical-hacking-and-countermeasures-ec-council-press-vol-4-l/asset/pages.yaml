    # Key Terms


    **Bluebugging** a Bluetooth security hole that allows an attacker to take control
    of a Bluetooth-enabled device


    **Bluedumping** an attack method used to cause a Bluetooth-enabled device to dump
    the stored link key, giving the attacker a chance to sniff the key-exchange process
    similar to e-mail spamming


    **Bluejacking** the use of Bluetooth to send messages to users without the recipients''
    consent—


    **Blueprinting** an attack method in which remotely access details about a target
    device


    **Bluesmacking** an attack in which an oversized packet of information is sent
    to a victim''s device


    **Bluesnarfing** a method of gaining access to sensitive data in a Bluetooth-enabled
    device


    **Bluetooth** a short-range wireless communication technology intended to replace
    the cables connecting or fixed devices while maintaining high levels of security


    **BTKeylogging** an attack method in which a PIN cracking technique is used to
    discover the PIN for a Bluetooth-enabled device, which is then used to turn the
    device into a keylogger


    **BTVoiceging** an attack method in which a PIN cracking technique is used to
    discover the PIN for a Bluetooth-enabled device, which is then used to record
    voice communications'
