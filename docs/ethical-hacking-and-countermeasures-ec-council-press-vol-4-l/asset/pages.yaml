  md: 'Linux Vulnerabilities


    +   * StackGuard is a compiler that hardens programs against stack-smashing attacks.
    Programs compiled with StackGuard do not require any source code changes. It works
    by placing a "canary" next to the return pointer. Alteration of the canary indicates
    an attack and terminates the program.


    +   * Libsafe is a dynamically loaded library that catches all calls to vulnerable
    libraries. by substituting the vulnerable function with a functional one. It has
    a high performance overhead and has been known to avert even buffer overflow attacks.


    +   * OpenProject''s nonexecutable stack kernel patch is a collection of security
    features for the Linux kernel that makes the stack nonexecutable. While it does
    not prevent buffer overflow attacks, it can alert the user to a simple attempt.


    Buffer overflows are a cause of vulnerabilities. Some safety measures must be
    taken to guard the Linux system from being exploited by known or unknown buffer
    overflows.


    # How to Apply Patches to Vulnerable Programs


    Users audit open-source programs for vulnerabilities and security flaws. Users
    can check the home page of their Linux distribution for updates. They can also
    check the Web sites of software vendors and look for patches. These include the
    following:


    +   * LCLint formats C in programs, such as memory management errors, inconsistent
    data sharing, improper liaison, dereferencing null pointers, and so on.


    +   * C allows a coder to define type qualifiers. It is a type checker that will
    perform qualifier inference to check annotations.


    +   * Rough Auditing Tool for Security (RATS) verifies and audits C, C++, Perl,
    Python, and PHP code. It serves as a preliminary check and can be used as a base
    for code checking.


    +   * Flawfinder audits code for security flaws in functions to be vulnerable
    to buffer overflows (strcpy()), buffer bugs (printf()), race conditions (chmod()),
    shell metacharacter problems (system()), random number generation (random()),
    and others.


    +   * Spike is used for protocol analysis and as a reproduction tool, and fuzz
    is is used to analyze programs for buffer overflows using LD_PRELOAD.


    Users can also make use of scripts that run on local system security and identify
    identify potential security vulnerabilities. These include sXid, COPS, TAMU''s
    Tiger, GNU Tiger, Nabou, and LSAT.


    # Scanning Networks


    Once the IP address of a system target is known, an attacker can begin the process
    of scanning, or looking for holes in the system. A typical system has 2^16 - l
    ports, with one TCP and one UDP port for each. Each one of these ports is a potential
    way into the system. The most popular scanning tool for Linux is Nmap. Other tools
    include netcat and.


    Netcat can be used to scan up port 2024. Netcat scans each port and waits 10 seconds
    for timeout. It displays the results. Netcat can be used with the following command:


    ```

    nc -vw -10 www.example.com

    ```


    Strobe scans ports in parallel, using maximum bandwidth while consuming minimal
    resources. Strobe is capable of scanning TCP ports alone. However, its developer
    no longer maintains strobe.


    # Nmap in Linux


    Nmap is undoubtedly the best port scanner available, having added functionality
    of OS detection, RPC identification, and port sweeping. Nmap also comes with a
    front end, Nmap, which gives it a GUI. Nmap can also be a valuable diagnostic
    tool for network administrators.'
