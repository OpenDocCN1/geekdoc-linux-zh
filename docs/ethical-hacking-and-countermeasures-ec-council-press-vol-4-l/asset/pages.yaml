  md: '# iChat UPnP Buffer Overflow Vulnerability


    How iChat handles specially crafted Universal Plug and Play (UPnP) packets could
    be exploited by an attacker on the local network. This buffer overflow vulnerability
    exists in the UPnPIG (Internet Gateway Device-standard Device Control Protocol)
    code used to create port mappings on NAT gateways in iChat. An unauthenticated
    attacker on the local network could execute arbitrary code or cause a denial of
    service.


    # ImageIO Memory Corruption Vulnerability


    ImageIO''s RAW image contains a memory corruption vulnerability that may allow
    an attacker to execute code on a vulnerable system. The RAW image file format
    is a popular format supported by many Mac OS applications. The ImageIO framework
    allows to read and write the RAW format, A memory corruption error occurs in the
    process of handling RAW. When a user opens a maliciously crafted image, an attacker
    can trigger this, which may lead to an unexpected application termination or arbitrary
    code execution. A remote unauthenticated attacker may be able to execute arbitrary
    code or cause a denial-of-service condition. The specially crafted RAW file supplied
    on a Web page, as an email attachment or e-mail, or by other means to convince
    the user to open the malicious file. This issue does not affect systems for Mac
    OS X 10.4 Mac OS X 10.4.9 for Mac OS X 10.4 (Tiger) This update addresses the
    issue by performing additional validation of RAW images.


    # Code Execution Vulnerability in Safari


    The Safari Web browser contains a vulnerability that may allow an attacker to
    execute arbitrary code. A memory corruption error occurs in Safari''s handling
    of feeds: When a user accesses a maliciously crafted URL, a remote unauthenticated
    attacker may cause an unexpected application termination or arbitrary code execution.
    This issue does not affect systems running Mac OS X 10.5 or later, but it does
    affect versions of Safari that shipped with Mac OS X 10.4 and 10.4. To solve this
    problem, install Mac OS X 10.5 or later, or update Safari. This update provides
    additional validation of feeds: URLs and provides an error message in case of
    an invalid URL.


    # UFS Integer Overflow Vulnerability


    There is an integer overflow in the fs_mount() function, used by Mac OS X to handle
    UFS disk images. Unix File System (UFS) is a file system used by UNIX and other
    operating systems. Mac OS supports UFS, partitions, and images. The integer overflow
    error may occur when a Mac OS system uses a UFS disk image. An attacker would
    need to convince a user to open a specially crafted DMG file to trigger the overflow.
    Safari''s default settings configure UFS images as a file type, and will automatically
    open them after downloading.


    A remote unauthenticated attacker able to supply a specially crafted DMG file
    may have an affected system to crash or execute arbitrary code using this vulnerability.


    This vulnerability is prevented via the following steps to Open the “safe” files
    after downloading option:


    +   - Select the Preferences; the window in 2-1 will open.

    - Click on the General tab.

    - Set up a default folder for downloading files.

    - Deselect the “safe” files after downloading option.


    # Kernel `fpathconf()` System Call Vulnerability


    A vulnerability in the Mac OS kernel could allow an authenticated local attacker
    to cause a denial of service. The fpathconf() system call provides a methods to
    determine the current value of a configuration limit or option variable with a
    file descriptor. The version of fpathconf with the Mac OS kernel (XNU) is programmed
    to panic when file descriptors are passed with the types it cannot handle otherwise,
    such as the sem_open() system call for semaphores. An authenticated local attacker
    could cause the affected system to crash to a kernel panic. This condition results
    in a denial of service. This issue is addressed in Mac OS X 10.4.9 for Mac OS
    X 10.4 (Tiger) systems and Security Update 2007-003 for Mac OS X 10.3 (Panther)
    systems.'
