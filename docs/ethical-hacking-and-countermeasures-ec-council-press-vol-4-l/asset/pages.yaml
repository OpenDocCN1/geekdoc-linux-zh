  md: 'During HotSync various viruses, Trojans, and other spyware can be transmitted
    to the mobile device, and then to another local desktop device and across a network.
    The Palm OS opens TCP ports 1427 and 14238 and also UDP port 1427 for HotSync
    synchronization. This means an attacker can open connections to these ports and
    access private information or unleash malicious code.


    # Trojans and Viruses


    As of November 2008, more than 400 viruses targeting handheld devices were in
    circulation. The year 2008 also saw a huge jump in malware creation and distribution
    for mobile devices. The of these Trojans and viruses include identity theft, data
    loss and transfer, and fraud.


    Some known Trojans and viruses are listed here. More and up-to-date lists can
    be found at commercial antivirus product Web sites or developers for specific
    mobile operating systems.


    # Mobile Phone: Trojans


    A skull is a malicious SIS Trojan. It modifies the system application and replaces
    it with a nonfunctional version. Once this Trojan is installed, it replaces all
    applications with pictures of skulls with crossbones. The icons are disabled and
    do not launch the applications they represent, even though the applications are
    still installed.


    Skulls disable all functions except calling and receiving. Functions that require
    a system application, such as SMS and MMS messaging, Web browsing, and cease to
    function.


    # Pda Virus: Brador


    Brador is a virus targeting against mobile digital assistant devices. Once it
    infects a device, it copies itself to the startup folder and sends its IP address
    of the PDA to the backdoor. The attacker listens to commands on the TCP port and
    can use the TCP port to control the PDA through the backdoor. It runs on ARM-based
    Pocket PC devices, which include Windows 2003 or later versions.


    # Pda Virus: WinCE4.Dust


    Dust is an infection virus, affecting all ARM-based devices. It is a handwritten,
    1,520-byte program for the ARM processor. As shown in Figure 4-11, when an infected
    file is executed, this virus will ask for permission to infect.


