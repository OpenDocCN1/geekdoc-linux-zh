  md: '# Bloooover


    Bloooover is a tool that runs on J2ME-enabled cell phones. It audits whether or
    not a particular Bluetooth device is vulnerable to a Bluesnarfing attack.


    # Hidattack


    Hidattack attacks the Bluetooth human interface device (HID) protocol. The HID
    protocol deals with two units: the device, which is the entity that interacts
    with a user, and the host that communicates with the device and receives input
    data from the device actions performed by the user. Hidattack enables an attacker
    who gets a target device''s PIN to decrypt its traffic and gain access to each
    of the connected devices. An attacker''s Bluetooth device scans for a PC that
    has an active Bluetooth HID driving runner. Once it is found, the attacker can
    use his or her keyboard to enter information and execute commands on the victim''s
    PC. The attacker then has full control of the device.


    In HID, there are two instances: the host (e.g., a PC, laptop, PDA, or cell phone)
    and the device used to input information into the host (e.g., a keyboard or mouse).
    The instances are connected through two channels: the control channel and the
    interrupt channel. The control channel is used for signaling, and the interrupt
    channel is used for data transfer.


    # Viruses and Worms


    # Cabir and Worms


    The Cabir worm infects Symbian mobile phones supporting the S60 platform. A file
    named caribe.sis is sent to the phone''s message inbox. When the user installs
    caribe.sis the worm is activated. The application is automatically executed after
    caribe.sis file is installed. The worm uses the infected phone to find other devices,
    which it infects in the same way. The worm will only send a new caribe.sis to
    the first device it finds and then will lock the phone from searching for more
    victims. Once a device is infected, the worm will continuously try to spread through
    the system. Disabling Bluetooth does not have any effect.


    The Mabir worm is similar to Cabir, infecting Symbian S60 devices and using a
    file named caribe.sis. How can it infect the target device using Bluetooth or
    MMS messages.


    # Worm.SymOS.Lasco.a


    Worm.SymOS.Lasco.a is a worm that can infect PDAs and mobile phones running the
    Symbian operating system. It works with Cabir, Lasco.a reproduces using Bluetooth
    connections. When executed, it scans the disk for SIS archives and attempts to
    infect those phones by inserting its own code.


    # Bluetooth Security Tools


    # BlueWatch


    BlueWatch is an application that identifies all Bluetooth-enabled devices, their
    communications and connectivity within an area. It provides important information
    about each device, such as its device class, manufacturer, and signal strength.
    BlueWatch identifies services available on each device, including network access,
    fax, and audio. It can detect devices that are misconfigured, unauthenticated,
    or encrypted. It monitors Bluetooth traffic and security threats. This tool can
    run on any Bluetooth-enabled computer or PDA running Windows 2000, XP, or CE.


    # Bluesweep


    Bluesweep is a Bluetooth finder and freedom utility that identifies any Bluetooth
    device, detecting the services it runs and connects to them. It provides a way
    to enter a Bluetooth device and identify security issues that might have otherwise
    gone unnoticed. Figure 5-4 shows a screenshot from Bluesweep.


    # Bluekey


    Bluekey is a security program that uses Bluetooth to secure a PDA. It uses Bluetooth
    to unlock the PDA. Bluekey automatically tries to authenticate a user when it
    is turned on: the user doesn''t have to remember any passwords or key combinations.
    Bluekey has multiple profiles and modes for full flexibility.'
