    # Other Types of Backdoors


    The following are other types of backdoors:


    +   * cron job backdoor: The attacker may add or modify the jobs of cron while
    his or her program is running so that he or she can gain root access.

    * .hosts file: Once "+" in a user''s .hosts file, anybody can log into account
    from anywhere without a password.

    * ssh authorized keys: The attacker can put his or public key into a user''s ssh
    configuration file, authorized_keys, so that he or she can log into that account
    without a password.

    * Bind shell: Attackers can bind the shell to a TCP port. If the attacker tunnel,
    they will be able to spawn an interactive shell. More sophisticated backdoors
    of this kind can be UDP-based, unconnected TCP, or ICMP-based.

    * Trojan service: Any open service can be Trojaned to provide access to a remote
    user. For example, a Trojaned injected program creates a bind shell at certain
    port, and a Trojaned ssh daemon can gain access to a certain password.


    After the intruder plants and runs the backdoor, he or her attention turns to
    hiding his or her files and pro-

    -cesses. An LKM rootkit can help the attacker. The attacker can use the LKM in
    /tmp or /var/tmp directories, which the system administrator cannot monitor. The
    attacker can effectively hide files, processes, and network connections. Since
    he or she cannot modify the kernel structures, he or she can replace the original
    system calls with his or her own.


    Common tools like ls use getdents() to obtain the information of a directory.
    The attacker can use LKM to filter out files so that they remain hidden


    In Linux, the process information is mapped to a directory in the /proc file system.
    The normal method is to set the task (signal num-

    getents()) and mask processes in the task structure.


    Similar to hiding processes, the attacker can have a stealth connection by hiding
    something inside /proc/

    net/ and /proc/net. He or she can replace the sys_read() so that the system reads
    these files and only the specific string, the system will not give access to the
    network connection.


    The attacker can redirect file execution and may replace the system binaries,
    like login, without changing the file. He or she can replace sys_execve() so that
    the system attempts to execute the login

    program, or will be redirected to execute the attacker''s version of the login
