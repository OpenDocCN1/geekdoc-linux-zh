    USBdevel allows to automatically run a file on USB flash memory devices based
    on the commands in the Autorun.inf file. Users can manually activate the AutoPlay
    feature by selecting the device and pressing F8. Alternatively, a user can check
    the AutoPlay When Device Is Connected, and then the AutoPlay feature automatically
    activates when a USB flash memory is inserted.

    Figure 7-3 shows the interface for the USBDevice utility. Figure-7-4 shows the
    detailed properties information for a selected USB device.


    # USB Blocker


    USB Blocker integrates with Active Directory and allows system administrators
    to control access to USB ports on remote computers. The tool uses built-in Group
    Policy mechanisms to enforce centralized access, so there is no need to install
    software on client computers. This control prevents unauthorized use of removable
    media that connects to USB ports and enables regulatory compliance, such as SOX,
    GLBA, and HIPAA.

    Figure 7-5 shows the interface for the USB Blocker tool.'
