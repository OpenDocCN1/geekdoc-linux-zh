    # Tool: Hping2


    Hping2 is an interactive packet constructor and analyzer. It can be used to perform
    many tasks such as testing of firewall and port scanning. It is a security tool
    that generates TCP/IP packets and analyzes network traffic with scripting capabilities.
    It is a tool for network experimentation, analysis, and testing it allows users
    to create and manipulate packets at a very low level. It handles fragmentation
    and arbitrary packet body size, and can be used to transfer files under supported
    protocols.

    The following are some of the uses of Hping2:


    +   - Packet size detection

    - Performing Traceroute-like actions under different protocols

    - Fingerprinting remote operating systems


    Figure 1-23 shows a screenshot of Hping2.


    # Tool: Sniffit


    Sniffit is one of the most commonly used attack tools in a variety of attacks.
    It is available for Linux, Solaris, OSFreeBSD, and IRIX. You can run it either
    on the command line, with optional plugins and filters, or in interactive mode,
    which is the preferred mode. Sniffit consists of a number of useful features.
    Its flexible filtering capabilities allow the attacker to target specific hosts,
    or even specific protocols, based on the port number. Sniffit is capable of handling
    theintensive de-fragmentation of packets in real time. Its interactive mode is
    useful for monitoring session-oriented applications such as Telnet, login, and
    FTP sessions. The attacker can monitor all the sessions in the network and capture
    the keystrokes of the victim in real time and gather passwords. Figure 1-24 shows
    a screenshot of Sniffit.


    # Tool: Nemesis


    Nemesis is a command-line network packet injection utility for UNIX-like and Windows
    systems. It is capable of ruling to a manually controlled IP stack. With Nemesis,
    it is possible to generate and transmit packets from the command line or within
    a shell script. Figure 1-25 shows the usage for Nemesis.


    # Tool: LSOF


    LSOF (List Open Files) is a UNIX-specific diagnostic tool. It lists information
    about any files that are open by processes currently running on the system. The
    following are some examples of LSOF command:


    +   - lsof -n: When LSOF is run without parameters, it will show all the files
    opened by any processes.

    - lsof -t apache2: It shows what process IDs are used by the Apache.

    - lsof -i -U: This lists all open Internet and UNIX domain files.


    Figure 1-26 shows a screenshot of LSOF.'
