    # TCP: TCP Wrappers


    TCP Wrappers use the monitor/filter incoming requests for SYSTAT, FINGER, FTP,
    TELNET, R-Commands, TFTP, LDAP, and other network services. It is called TCP Wrappers
    because the daemon tcpd is wrapped around the service, as described in /etc/inetd.conf.
    Tcpd handles the connection. Connection requests are compared against rules defined
    in two files: /etc/hosts.allow and /etc/hosts.deny. The rules are processed in
    order of, and when a rule meets, the connection terminates.


    Consider the following entry in /etc/inetd.conf on a system with tcpd: pop-3 tcp
    now root /usr/sbin/tcpd ip3d. In this, /usr/sbin/tcpd is wrapped around, and a
    connection request is checked against the tcpd.


    For example, suppose a remote machine from an untrusted domain attempts to connect
    to the mail server. When it requests a connection, tcpd first scans /etc/hosts.allow.
    In this scenario, there are no entries in the /etc/hosts.allow file; however,
    the connection request from the untrusted domain is denied access based on an
    entry in the /etc/hosts.deny file.


    TCP Wrappers has the following five components:


    +   * The actual wrapper program

    * tcpmatch and tcpdchk: ACL testing programs

    * try-from: Tests host lookup function

    * safe-niger: A better version of finger'
