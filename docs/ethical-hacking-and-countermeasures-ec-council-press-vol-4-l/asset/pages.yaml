    # Crack the Router Password


    Brute force attacks work by attempting every possible combination of letters and
    numbers until a match is found. These attacks are conducted with programs like
    Brutus or Hydra. A router''s login services can be subjected to brute force attacks
    that reveal passwords and usernames.


    An attacker tries to identify whether a router has authentication techniques such
    as TACACS or RADIUS. If these techniques are used, an attacker gets locked out
    after a certain number of login attempts, making brute force attacks difficult.
    A standard excel client can be used to connect a router to another system in a
    network to check whether authentication is connected to that system or not.


    If the client establishes authentication and the device uses prompt for a username,
    the device is said to be installed with additional authentication mechanisms.
    With the implementation of TACACS, an attacker has guess both the username and
    password instead of guessing the password. If additional authentication mechanisms
    are not used to protect the router, the password can be brute-forced using programs
    designed for that purpose.


    # Analyze the Router


    Check for Users After accessing the router, an attacker can check for the users
    who are currently logged in to see exactly what kind of a device the attacker
    has taken (Figure 3-3). The command also provides the output on IOS routers.


    On Cisco IOS, the administrative login is active. By discovering other users,
    an attacker will analyze the output to check whether the administrator is legitimate
    or a hacker (Figure 3-4). If the attacker suspects that another hacker is present,
    the connection is freely dropped.


    All the users will see the "connection closed by host message."


    Analyze the Configuration File Once a router has been brute-forced, the attacker
    can access the configuration file. Router configuration files can reveal important
    network information. Attackers can use the information gained from the configuration
    file to do the following:


    +   * Find new targets

