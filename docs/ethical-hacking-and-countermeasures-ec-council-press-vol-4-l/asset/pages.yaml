    \ as well as their mobile networks. Mobile devices can be sold or traded by disgruntled\
    \ employees. They can also be lost or stolen from employees, blameless employees.\
    \ Either way, sensitive and valuable data is compromised, and the organization\
    \ must take steps to recover the data or to repair the damage. Other costs in\
    \ IT loss of a mobile device include the following:\n\n+   * Employee and IT time\
    \ loss recovering data\n* Cost of the device itself\n* Potential for ongoing identity\
    \ theft\n* Access to the company's network"
