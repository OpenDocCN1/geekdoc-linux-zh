  md: 'Despite Nmap''s capabilities, there are a number of good countermeasures to
    Nmap. Firewalls can be configured to protect machines automatically. A firewall
    is software that is written to provide security between the system and the network.
    Loggers such as snylog, Courtney, and Port S can alert administrators of scans.
    A well-configured intrusion detection system like Snort can also pick up stealth
    scans such as FIN, Xmas, and null scans. Figure 1-6 shows a screenshot from Nmap.


