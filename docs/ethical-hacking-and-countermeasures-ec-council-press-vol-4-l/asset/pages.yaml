  md: 'Chapter 4


    # Examples of Vulnerabilities in Mobile Phones


    The following are examples of vulnerabilities in mobile phones:


    +   - Research In Motion Ltd.''s BlackBerry 7270 SIP (a protocol used to create,
    modify, and terminate sessions such as VoIP or video over an IP network) has a
    format string vulnerability that disables the calling feature in the mobile device.
    A hacker can use certain format tokens to write data in an IP stack or in working
    memory. This allows the hacker to overwrite data with malicious code.

    - Samsung''s SCH-i730 phone running SJPhone Client has a buffer overflow vulnerability.
    By exploiting this, a hacker can disable the mobile phone and slow the operating
    system.

    - HTC using AGPhone is vulnerable to malformed SIP messages sent over wireless
    LAN connections; it disconnects active calls.

    - Dell Axis running SJPhone soft phones are vulnerable to denial-of-service attacks,
    which can disable the mobile phone and drain the battery.

    - The DSP module of D-Link DPH-540 and DPH-541 Wi-Fi has a vulnerability that
    disables the phone''s calling.


    # Hacking Handheld Devices


    When a password-protected handheld device is stolen or intentionally made inoperable,
    a hacker can retrieve data from the bricked device using a number of tools to
    unlock and restore software. A brick is a device that cannot function in any capacity.
    With mobile devices, these are devices that can be locked, damaged, or destroyed.
    The hacker can restore access to network connections and other devices trusted
    by the original.

    Hackers can also attack mobile phones using spyware and other mobile devices.
    They can download and other information from the mobile device without the user''s
    knowledge. Some hackers not only extract information but may change or delete
    information on the mobile device. Hackers can access personal value messages from
    a mobile device if the device is destroyed. They can also access address books,
    read messages and e-mails using various mobile spyware, and listen to conversations.
    On some devices, hackers can insert viruses and spyware into mobile devices using
    Bluetooth or GPS. A virus can remove all information such as contacts, messages,
    and e-mails. This section will explore various malware and attacks hackers use
    on mobile devices.


    # Mobile Malware Propagation


    Mobile malware spreads via the Internet. It first infect PCs; the infected PCs
    can then infect smartphones via infrared and Bluetooth. Bluetooth can infect other
    smartphones over the wireless LAN. The mobile malware can infect phones through
    MMS, and the infected device can spread the malware to another mobile device using
    General Packet Radio (GPS).


    # Spyware


    Mobile spyware manipulates SMS and enables them to be read by others. Some is
    communication service standardized in the GSM mobile communication system that
    allows intercept of short text messages between mobile devices. Mobile spyware
    is invisible to the user, loads on startup, and forwards SMS messages from the
    mobile device to the hacker. First, the attacker sends an SMS to the target mobile
    device. The victim then opens them and unwittingly installs the spyware onto the
    device. The spyware takes the SMS messages and forw them back to the hacker without
    alerting the user.


    # Botnets


    Bots are software applications that run automated tasks over the Internet. A botnet
    of bots in a channel consists of a set of compromised systems that are monitored
    for a specific'
