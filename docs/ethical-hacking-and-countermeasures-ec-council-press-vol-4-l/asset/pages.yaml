  md: '# # USB Hacksaw


    ![](img/1c954f62c3cf4ac9f7443b0c3ac2c1bb_169_0.png)


    USB Hacksaw is an evolution of USB Switchblade that used versions of USDBumper,
    Blat, Stunnel, and Gmail to automatically infect Windows PCs with a payload that
    retrieves documents from USB drives plugged into the target machine and securely
    transmits them to an e-mail account. This tool automatically and silently installs
    on Windows 2000, XP, or 2003 machines with administrator or guest access. Once
    installed on a target machine, it stays resident and waits for a USB flash drive
    to be inserted. Once a USB flash drive is inserted, the application downloads
    the contents of the drive to a temporary location using the modified USDBumper.
    Then, it runs the send.bat file located in the same directory, which archives
    the contents, establishes an SSL SMTP connection to smtp.gmail.com, e-mails the
    downloaded data to an e-mail address, and removes the documents and archives.


    # # Security Tools


    This section explains the security tools that can be used to prevent a USB attack.


    # # MyUSBOnly


    MyUSBOnly prevents data theft by locking all USB storage devices except those
    that are trusted. This prevents files from being copied and transferred through
    thumb drives, MP3 players, flash memory cards, and portable USB hard drives. It
    secures log information regarding connections and disconnections to USB devices
    as well as files or folders that are copied, modified, and deleted. It generates
    an e-mail or syslog notification when an unauthorized USB storage device is connected
    to a PC.


    Figure 7-2 shows the interface for the MyUSBOnly application.


    # # USBReview


    USBView is a small utility that lists all USB devices currently connected to a
    computer, as well as previously used USB devices. For each USB device, USBView
    displays detailed information, including the following:


    +   * Device name and description

    * Device type'
