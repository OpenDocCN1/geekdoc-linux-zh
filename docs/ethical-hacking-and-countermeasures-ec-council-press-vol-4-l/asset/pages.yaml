  md: 'Hacking and electronic crimes sophistication has grown at an exponential rate
    in recent years. In fact, reports have indicated that cyber crime already surpasses
    the illegal drug trade! Unethical hackers, better known as black hats, are preying
    on information systems of government, corporate, public, and private networks
    and constantly testing the security mechanisms of these organizations to the limit
    with the sole aim of exploiting them and profiting from them. High-profile crimes
    prove that the traditional approach to computer security is not sufficient, even
    with the strongest perimeter, properly configured defenses such as firewalls,
    intrusion detection, and prevention, strong end-to-end encryption, and anti-virus
    software. Hackers have proven their dedication to systematically penetrate networks
    over the world. In some cases, black hats may execute attacks so flawlessly that
    they can compromise a system, stealing everything of value, and completely erase
    their tracks in less than 20 minutes!


    The EC-Council Press is dedicated to stopping hackers in their tracks.


    # About EC-Council


    The International Council of Electronic Commerce Consultants, better known as
    EC-Council, was founded in 2001 to address the need for well-educated and certified
    information security and e-business practitioners. EC-Council is a global, member-based
    organization of industry and subject matter experts all working together to secure
    and raise the bar in information security certification and education.


    EC-Council first developed the Ethical Hacker Certification (CEH) goal of this
    program is to teach the methodologies, tools, and techniques used by hackers.
    Leveraging the collective knowledge from hundreds of subject matter experts, the
    CEH has gained rapidly around the world and is now delivered in more than 70 countries
    by more than 450 training centers. More than 60,000 security practitioners have
    been trained.

    CEH is for many government entities and corporations around the world. Shortly
    after CEH was launched, EC-Council developed the Certified Security Analyst (ECSA).
    The goal of the ECSA is to teach proper incident analysis methods that must be
    applied while advancing digital forensics. The ECSA program led the Licensed Forensic
    Investigator (CHFI) formed with the same design methodologies and has become a
    global standard in certification for computer forensics. EC-Council, through its
    impervious network of professionals and high industry following, has developed
    other programs in information security and e-business. EC-Council certifications
    were viewed as the essential certifications needed when configuration and security
    policy courses fall short. Providing a true, hands-on, tactical approach to security,
    individuals with the knowledge demonstrated by EC-Council programs are securing
    networks around the world and at their own game.


    # About the EC-Council | Press


    The EC-Council Press was formed in 2008 as a result of a cutting-edge partnership
    between global information security certification leader, EC-Council and leading
    academic publisher, Cengage Learning. This partnership marks a revolution in academic
    textbooks and courses of study in information security, computer forensics, disaster
    recovery, and end-user security. By identifying the essential topics and content
    of EC-Council professional certifications, and repurposing this world-class content
    to fit academic programs, the EC-Council Press was formed. The community is now
    able to incorporate this cutting-edge content into new and existing information
    security programs. By closing the gap between academic study and professional
    certification, studies, and interests the EC-Council Press is set to revolutionize
    global information security programs and ultimately create a new breed of rigorous
    focus and high demand industry. ultimately create a new breed of practitioners
    capable of combating the growing epidemic of cybercrime and the rising threat
    of cyber-war.'
