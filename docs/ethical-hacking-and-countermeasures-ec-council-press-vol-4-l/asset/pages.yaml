    attacks when attempting to obtain unauthorized access to the information stored
    on RFID tags.


    +   Countermeasures used to avoid RFID attacks include RSA blocker tags, kill
    switches, cryptography, detection and evasion, and temporary deactivation.


    +   RFID Guardian is a portable, battery-powered device that mediates interactions
    between RFID readers and RFID tags and helps to detect unauthorized RFID activity.


    +   Malware is malicious software that breaks and disrupts computer systems. RFID
    malware transmits and executes the malware through an RFID tag and includes RFID
    worms, viruses, and RFID exploits.


    +   RFID-enabled credit cards are vulnerable to the following types of attacks:
    tracking, eavesdropping, skimming, replay, and cross-contamination.


    +   RFIDump is a hacking tool that can be used to exploit RFID tag information.


    +   RFID security controls include management, operational, and technical controls.


