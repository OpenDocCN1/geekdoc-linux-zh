    # ## Tool: Wireshark


    Wireshark is used for troubleshooting, analysis, software and protocol development,
    and education. Wireshark is open-source software allowed under the GNU General
    Public License. It runs on UNIX, Linux, and Windows. It uses GTK+, a graphical
    user interface library, and libcap, a packet capture and filtering library. The
    following are some of the features of Wireshark:


    +   * Live data can be read from Ethernet, FDDL, PPP, Token-Ring, IEEE 802.11,
    Classical IP over ATM, and loopback interfaces.

    * Captured network data can be browsed via a GUI or an include TTY-mode program.

    * Captured files can be programmatically edited or converted via command-line
    switches to the editcap program.

