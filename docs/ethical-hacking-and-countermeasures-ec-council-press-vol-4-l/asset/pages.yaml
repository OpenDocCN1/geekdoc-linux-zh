  md: '# Introduction to Mac OS


    Apple invites developers to create products for Mac OS X at the Apple Web site
    http://developer.apple.macosx/. Mac OS X includes Cocoa, a collection of frameworks,
    and accompanying runtimes, that allow for a host of open-source web, database-scripting,
    and development technologies. Built-in Xcode multifaceted development platform
    contains technologies such as Autom, Core Data, Core Animation, and Core Image
    make Mac OS X the most advanced operating system.


    Developers can access these features to create and share applications that share
    data and interact (Chat) though AppleScript. Mac OS X includes a 64-bit, open-source
    UNIX kernel. The FreeBSD 5 UNIX distribution with its microkernel is included
    in OS X. Other features include multiprocessing, symmetric multiprocessing (SMP),
    and protected memory. Symmetric multiprocessing is a type of computer architecture
    in which multiple processors share the same memory and are assigned different
    tasks to perform.


    Mac OS X has the flexibility of object-oriented application structure, procedural
    APIs, and tightly implemented of Java SE, BSD UNIX APIs and libraries. These provide
    access to a variety of tools to construct, develop, and deploy applications. The
    development platform includes Xcode 3D layer over a GPU Accelerator. This layer
    includes powerful graphics technologies, such as OpenGL, Core Animation, and Core
    Image. The graphics layers handle windowing, 2-D and 3-D drawing, animation, and
    multimedia. To support its international market, Apple provides conversion utilities
    to consistently manage locales, dates, currencies, and measurement systems. Mac
    OS X''s Unique tools handle diverse text systems, and both international and localized
    software versions launch from a single application icon.


    # Vulnerabilities in Mac OS X


    # Crafted URL Vulnerability


    A, unauthorized hacker may exploit the way Mac OS handles specially crafted URLs
    and execute arbitrary code. When a user visits a maliciously designed Web page,
    an application may automatically execute and causing damage. This is due to an
    input validation issue that exists in the Terminal app handles the processing
    of URL schemes. This vulnerability affects Apple OS X v10.4.11, Mac OS X Server
    v10.4.11, Mac OS X v10.5 and v10.5.1, and Mac OS X Server v10.5 and v10.5.1.


    # CoreText Uninitialized Pointer Vulnerability


    Apple OS X CoreText contains an uninitialized pointer vulnerability, which may
    allow remote, unauthorized attacker to execute arbitrary code on a vulnerable
    system. Apple OS X CoreText is a framework for handling text on Mac X Tiger (10.4)
    and later. If OS X CoreText does not properly initialize memory corruption can
    occur. Applications that use the CoreText framework for handling text may be vulnerable.
    By convincing a user to specially crafted text, a remote unauthorized attacker
    may be to execute arbitrary code or cause a denial of service on a vulnerable
    system. This vulnerability is repaired in Mac OS X 10.4.11 and Security Update
    2007-008.


    # ImageIO Overflow Vulnerability


    Apple''s ImageIO framework contains an integer overflow that may allow an attacker
    to execute code on a vulnerable system. The Graphics Interface Format (GIF) is
    a popular image format supported by Mac OS X applications. Image applications
    allow to read and write various image files, including GIF. The integer overflow
    vulnerability only exists in the handling of GIF files. When a user opens a maliciously
    crafted image, it can cause an application crash or arbitrary code execution.
    This issue does not affect systems to Mac OS X v10.4. A remote unauthorized attacker
    may execute arbitrary code or cause a denial-of-service. The maliciously crafted
    GIF file may be supplied on a Web page, as an e-mail attachment, or inside an
    e-mail. Apple has published Mac X 10.4.9 for Mac OS X 10.4 (Tiger) systems and
    Security Update 2007-003 for Mac OS X 10.3 (Panther) systems in response to this.
    This update addresses the issue by providing additional validation of GIF files.


    # DirectoryService Vulnerability


    Vulnerability in the Mac OS DirectoryService may allow unauthorized LDAP users
    to change the local root password. This is due to an implementation flaw in DirectoryService.
    This issue is repaired in Mac OS X 10.4.9 for Mac OS X 10.4 (Tiger) systems and
    Security Update 2007-003 for Mac OS X 10.3 (Panther).'
