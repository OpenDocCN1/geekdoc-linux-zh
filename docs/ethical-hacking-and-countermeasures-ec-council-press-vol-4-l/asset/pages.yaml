  md: '# General Notice


    The Ethical Hacking and Countermeasures course mission is to educate, introduce
    and demonstrate hacking tools for penetration testing purposes only. You will
    not use the newly acquired skills for illegal or malicious attacks and you will
    not use such tools in an attempt to compromise any system, and you shall indemnify
    EC-Council and its partners with all liability with respect to the use or misuse
    of these tools, regardless of intent.


    EC-Council provides the hacking skills and tools used in the CEH classroom for
    educational use. The hacking tools are not authored by EC-Council, and in many
    cases they are submitted by the security community, EC-Council will not be held
    accountable for any damages caused by the proper or improper use of these materials,
    and makes no guarantee in regards to their operation or suitability for any specific
    purpose.


    The hacking tools used in the CEH program are for research and educational purposes
    only. The primary intent of these tools is to provide the user with hard to find
    content for research or self education relevant to network security and various
    protection methods and their intrinsic flaws by demonstrating exploitation methods
    and techniques used to circumvent them. We hope that you become more aware of
    the dangers lurk in society today and learn how to protect yourself with the knowledge
    you are to learn. In order to continue you must accept that you are going to use
    this information only for educational and research purposes only.


    While possession of information or programs included in this training violates
    no laws, actually using or implementing some of the programs or content may violate
    U.S. Federal and other laws. For this reason, the user is instructed not to use
    any programs or content contained in this training which may violate any laws
    or infringe on the rights, including intellectual property rights, of others.
