    \ discusses techniques used in hacking: Linux, Macintosh, routers, cable modems,\
    \ mobile devices, Bluetooth devices, RFID and USB devices and how to determine\
    \ security policies for these devices.\n\n# Chapter Contents\n\nChapter 1, Linux\
    \ Hacking, looks into various aspects of security related to Linux rooting and\
    \ intrusion detection systems. Chapter 2, Mac OS X Hacking, introduces some of\
