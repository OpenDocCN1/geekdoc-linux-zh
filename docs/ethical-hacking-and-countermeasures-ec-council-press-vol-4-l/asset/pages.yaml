    # RFID Malware


    Malware is malicious software that breaks and disrupts computer systems. RFID
    malware is transmitted and executed through RFID tags when hackers use RFID tags
    for illegitimate purposes. If RFID software has vulnerabilities, an RFID tag can
    be infected with a virus. When a reader scans the infected tag, it may exploit
    a vulnerability. There are three classes of RFID malware:


    +   1. RFID worms: RFID worms use network connections to self-replicate. They
    spread by attacking online RFID services and tags. RFID worm code causes unwary
    RFID readers to download and execute files from a remote location. These files
    then proceed to cooperate with an RFID middleware server as Internet-based malware.

    2. RFID viruses: RFID viruses self-replicate the infected code to create new RFID
    tags independently, without a need for a network connection. These viruses do
    not have a payload, so the workings of back-end RFID systems are modified or interrupted.
    If the infected tag passes information through the reader it can infect other
    RFID readers, controls, and systems.

    3. RFID exploits: RFID exploits are harmful RFID data that attacks the part of
    the system that is vulnerable to hacker attacks. When the RFID reader scans a
    tag, it anticipates getting the information in a reliable format. An attacker
    can create data whose format is unanticipated, and uses it to corrupt the RFID
    reader''s software and database.


