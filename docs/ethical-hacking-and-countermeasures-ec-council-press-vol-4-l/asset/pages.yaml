  md: "# Chapter Summary\n\nMany technical controls related to a tag require the tag\
    \ to perform additional computations and have additional volatile memory. Accordingly,\
    \ a tag that uses technical controls requires a more sophisticated microchip than\
    \ that that do not use such controls. In case of passive tags, readers need to\
    \ be closer to the readers to obtain the required power to perform these computations.\
    \ Alternatively, readers may need to operate at greater power levels, although\
    \ this may not be feasible or permitted in many cases. These inherent characteristics\
    \ of passive tags can limit the use of certain controls in environments.\n\nTechnical\
    \ or logical controls exist for all components of RFID systems, including the\
    \ RF, enterprise, and interenterprise subsystems. This section focuses on technical\
    \ controls for the RF subsystem. Many controls also exist for the enterprise and\
    \ interenterprise subsystems, but these typically apply to IT systems in general\
    \ rather than to RFID systems.\n\nThe general types of controls include that:\n\
    \n+   * Provide authentication and integrity services for RFID components and\
    \ transactions\n* Protect RF communication between reader and tag\n* Protect the\
    \ data stored on tags\n\n# RFID Security\n\nRFID communication should be secured\
    \ to maintain communication privacy and avoid manipulation of the information\
    \ stored in tags. RFID tags contain a security bit on the reserved memory block\
    \ of the tag. The security bit should always be turned on. The following methods\
    \ of protection can be used to protect tags from read/write activities:\n\n+ \
    \  * Random transaction IDs on writable tags: To understand this, consider a library\
    \ as example. During each checkout for books, the reader selects 'r' as a random\
    \ number and 'D' as data. This data is stored in the RFID database as an (r, D)\
    \ pair. The reader then deletes the D from the tag and writes r. For every check-in,\
    \ the library reader checks the R D from the database and writes D back to the\
    \ tag.\n* Improved passwords via persistent state: Persistent passwords stored\
    \ in RFID tags are vulnerable to eavesdropping attacks. The communication from\
    \ tag to reader is more difficult to eavesdrop than communication from reader\
    \ to tag. To enhance the security of these passwords, RFID sends a notice (alert)\
    \ to readers. This is necessary to recover the passwords of the tag. An attacker\
    \ would need to pick up this notice to eavesdrop on passwords, which makes the\
    \ eavesdropping attack difficult.\n* Scheme for mutual authentication of tag and\
    \ reader with privacy for the tag:\n    * PRF (pulse frequency) private authentication:\
    \ This technique uses a shared secret and the PRF to protect the messages during\
    \ communication between the tag and the reader.\n    * Tree-based authentication:\
    \ A new tree-based protocol has been built to provide authentication. This scheme\
    \ employs a secret parameter k for all instances of reader and tag.\n    * Two-phase\
    \ scheme: This scheme employs two phases of tree-based authentication. In the\
    \ first phase, it runs the scheme with R1 and T1 (reader and tag instances) with\
    \ constant security parameters, and identifies the tag. In the second phase, as\
    \ the tag is detected, reader and tag can use E1 and T1 with k as a security parameter.\n\
    \n# Chapter Summary\n\n+   * RFID (radio frequency identification) is an automatic\
    \ identification method that uses radio waves, RFID tags, and RFID readers to\
    \ identify an object and transmit data associated with the object.\n* Tag collision\
    \ in RFID systems occurs when numerous tags are energized by the RFID reader and\
    \ the tags reflect their respective signals back to the reader simultaneously.\n\
    * RFID technology combines a different number of computing and communications\
    \ technologies. This complexity creates the following risks: business process,\
    \ business intelligence, privacy, and externality."
  merge: -1
