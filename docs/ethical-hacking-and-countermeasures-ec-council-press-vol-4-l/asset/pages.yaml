    # HTTP Configuration Arbitrary Administrative Access Vulnerability


    A vulnerability that affects most Cisco routers (when conditions are right) is
    the HTTP Configuration Arbitrary Administrative Access Vulnerability, arbitrary
    commands can be executed on a remote Cisco router by a request through HTTP in
    the following:

    /level/$NUMBER>/exec/show/config/cr


    In this string, $NUMBER is an integer between 16 and 99.

    an attacker can use this to disconnect network access and can lock users out of
    a router. Any Web browser can be used to exploit this vulnerability. If an attacker
    navigates to a particular router—the IP address 10.0.1.252 is used to exploit
    the vulnerability—the one shown in Figure 3-6.

    if the attacker clicks the Cancel button and adds /level99/exec/show/config to
    the router''s IP address, the startup configuration of the device will be printed
    (Figure 3-7).


    This exploit reveals the configuration of the router, interfaces, access control
    lists (ACLs), and SNMP community string. The Vigenere encryption scheme was used
    to encrypt the password. This encryption scheme can be easily cracked with the
    help of the GetPass! (Figure 3-8).


    If a password is stored in the form of an MD5 hash, a dictionary attack can be
    used to crack it with tools like John the Ripper and Cabel.


    After cracking the password, the attacker can log via telnet and gain complete
    administrative control of the router. This vulnerability can be eliminated by
    disabling all web interfaces.


