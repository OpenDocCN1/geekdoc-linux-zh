  md: '# Hacking USB Devices


    # Objectives


    After completing this chapter, you should be able to:


    +   - Understand USB devices

    - Understand USB attacks

    - Understand viruses and worms that affect USB devices

    - Understand USB hacking tools

    - Understand USB security tools

    - Understand countermeasures against USB hacking


    # Key Terms


    +   **Electrically Erasable Programmable Read-Only Memory (EEPROM)** the type
    of memory used in USB devices

    **Peripheral** a physical input-output device

    **USB (Universal Serial Bus) device** a type of peripheral that can be plugged
    into a USB port

    **USB port** a plug-and-play hardware interface used to attach USB peripherals
    (such as disks and printers, scanners, mice, keyboards, and joysticks) to a computer


    # Case Example


    In 2007, experts warned owners of a new worm that spread through USB drives. A
    worm named SillyFD-AA installed itself onto computer systems, put the message
    “Hacked by 1BYTE” in Internet Explorer, and installed an AutoRun.inf file on removable
    devices such as USB drives and floppy disks. This worm could act as a backdoor
    and insert malicious code into the computer. Once an infected USB device was connected
    to a computer, the worm automatically installed and spread.


    Users were reminded not to plug unknown devices into their computers because the
    devices might have contained malicious code. The users were also advised to turn
    off the AutoRun'
