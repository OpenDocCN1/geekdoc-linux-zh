  md: '![](img/8286bf901ba268fe114d66ada92d1dd6_41_0.png)


    Figure 6: The Reaper 5 theme included in the default configuration.


    *menu/toolbar* with drag and drop support (Figure 8). You can let your own Preferences
    and typical use scenarios define the structure.


    The free ReaMenus [6] add-on installs a fully structured menu into the DAW in
    the form of a configuration file. However, the independent ReaMenus tends to lag
    behind Reaper''s development status by several versions. Consequently, you might
    find some functions missing from the overview. However, the missing functions
    can still be accessed via the menu editor or action list.


    Reaper also lets you assign individual actions to buttons in the toolbar. You
    can use *right-click* plus *Customize Toolbar* on the Main toolbar in the top
    left corner to add new buttons and optionally define your own icon.


    Once you have customized Reaper, it is a good idea to export the configuration.


    You can do this via *Options | Preferences* (or use Ctrl + P) and selecting *General*.
    With this backup, you can restore all program details with just a few clicks.


    # Linux Specifics


    Since version 6, Reaper is now available for Linux as a standalone


    # Tips for Beginners


    After installing Reaper on a new system, you should disable vertical zooming via
    the mouse wheel. Almost all programs scroll when you rotate the mouse wheel, but
    Reaper does not. This is difficult to get used to, so you should assign vertical
    zooming to Ctrl plus the mouse wheel and vertical scrolling directly to the mouse
    wheel. Select Shift plus the mouse wheel for horizontal scrolling and Alt plus
    the mouse wheel for horizontal zooming. Actions can also be executed via a button
    in the toolbar. The free SWS Extension [5] not only adds some really useful tools
    to Reaper, but it also comes with some very useful actions – a must-install for
    Reaper pros.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_41_1.png)


    Figure 7: The Action List lets you define your own keyboard shortcuts for almost
    all actions.'
