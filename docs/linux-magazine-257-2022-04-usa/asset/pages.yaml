  md: '![](img/8286bf901ba268fe114d66ada92d1dd6_77_0.png)


    # Figure 3: Terminal output of the apt list command.


    As you can see here, there is more than one package available from NVIDIA along
    with the Nouveau open source driver. You can double check if your system has any
    NVIDIA packages installed by running:


    ```

    $ apt list \*nvidia\* --installed

    ```


    If you have installed any of these, they will be listed along with any dependencies
    that are required for them to run which are also present on your system, such
    as libraries and the settings dialog box package (Figure 3).


    It is here that things can sometimes get a bit difficult. While all of these packages
    are available for your card, not all of them will work well, properly, or for
    that matter, at all, with your specific card. With that in mind you should at
    this point back up everything that you need to save somewhere safe and on a different
    machine, external drive, cloud storage, or (better yet) all of the above. Personally,
    I know that my GT 710 the best functioning package is listed as nvidia-driver-390,
    though frankly, I only know that through trial and error. Documentation on these
    packages is good and you can find more information about them at the NVIDIA website
    [1]. Personally, I had to learn this the hard way, by trying a package, uninstalling
    it when it failed, trying a different package, rinse and repeat. For that reason
    I would like to give a bit of a disclaimer here: If you install one of these packages
    and reboot to a black screen or have some other problem with your display, then
    be patient and don''t fret just yet.


    # Device Driver Installation


    To install the package that you would like to try, simply run:


    ```

    $ sudo apt update

    $ sudo apt install nvidia-driver-390

    ```


    and replacing the nvidia-driver-390 to the package of your choice for your specific
    GPU. Using the terminal


    here has the advantage that you can easily see what is going on, as opposed to
    using the GUI, which often leaves one wondering. Once the installation is completed
    and all dependencies have been installed, you will want to reboot your machine
    so that the new software can be loaded at boot. If you are lucky, you will be
    greeted with the login screen or desktop as you normally would. You can then check
    that your installation worked by either using the lspci -vv command discussed
    earlier or by opening settings and looking at the About section to see what is
    listed for Graphics. Mine shows GeForce GT 770/ PCIe/SS2 while mine the nvidia-driver-390
    packages. As mentioned before, using lspci -vv will show nvidia under the Kernel
    driver in use section. You will also have the NVIDIA control panel installed for
    changing the particulars of your setup with a graphical interface.


    # Troubleshooting and Resolving Issues


    If you''re not greeted with something graphical but rather a blank screen, then
    it is likely that the package is not in fact suitable for your GPU and will need
    to be removed. Don''t panic just yet, however. This is a fairly easy and straightforward
    process as well. Reboot, and at the GRUB loading screen, instead of choosing a
    normal boot into Ubuntu, choose Advanced Options for Ubuntu and then choose the
    Ubuntu, with Linux… (recovery mode) option. The… will show the kernel that you
    are running and you can select the most recent kernel here. Make sure to select
    the recovery mode option (recovery).


    Once in recovery mode you will want to choose root, with the description of Drop
    to root shell prompt. This will boot into a command line and from here you can
    get rid of the offending packages. Run the following to find out which NVIDIA
    packages are installed:


    ```

    $ apt list \*nvidia\* --installed

    ```


    Once you have seen what packages are there, you can use the following two commands
    in the following order to rid yourself of the NVIDIA packages. First use:


    ```

    $ apt remove nvidia-driver-390 nvidia-settings nvidia-prime nvidia-dcmx… etc.

    ```


    You will have many NVIDIA packages here, and listing all of them from the driver
    package itself with a space between them will remove all. This'
