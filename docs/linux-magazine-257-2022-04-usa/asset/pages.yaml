    (see the “Tips for Beginners” box). It is also possible to search for the corresponding
    action based on the combination next to the search field. The biggest problem
    is finding out the function name. In addition, Reaper creates the lists for the
    Main, Media Explorer, and MIDI Editor sections separately, and they cannot be
    edited across groups. To switch between Action List sections, use the toggle menu
    in the top right corner of the window.


    # ### Menus


    Reaper leaves a lot to be desired when it comes to sensible menu structuring,
    making it confusing for digital audio newcomers. As the number of features increases,
    the developers have simply filled up the menus without ever re-structuring them
    with any kind of plan in mind. Fortunately, however, the menu structure can also
    be freely customized using Options | Customize


    ![](img/8286bf901ba268fe114d66ada92d1dd6_40_1.png)


    Figure 5: The House of White Tie Imperial theme is shown here with a feature-rich
    extended mixer.'
