    background.


    ZuluCrypt is extremely user-friendly. The tool is included with most of the popular
    Linux distributions and can otherwise easily be installed via the provider''s
    website. Immediately after that, the main window of ZuluCrypt reveals how powerful
    the tool actually is.


    In ZuluCrypt, you can either create or open LUKS devices with Cryptsetup, create
    Veracrypt volumes or use existing ones, and mount file systems via FUSE with GocryptFS.
    Un-mounting works in the same way. ZuluCrypt relieves the user of the need to
    deal with the details of the CLI or GUI applications of the individual solutions.
    Nevertheless, it does not hurt to at least be familiar with the basic features
    of the individual programs, in case something goes wrong in ZuluCrypt that the
    program itself cannot fix. In everyday operations, however, this kind of incident
    is likely to be an exception.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_19_0.png)


    All in all, ZuluCrypt is a powerful little helper that saves admins a part of
    the learning curve and efficiently reconciles different encryptors under Linux.
    ZuluCrypt is especially beneficial for people who use, or have to use, more than
    one encryption solution.


    # Conclusions


    Encryption on Linux, whether on servers or desktops, is no longer a problem. Linux
    comes with the required built-in tools in the form of Cryptsetup and LUKS. Distributions
    integrate these built-in tools so well that you can set up a system with an encrypted
    root partition and encrypted home directories without any worries.


    For mobile devices like laptops, these encryption tools put Linux on a par with
    other products like Windows (Bitlocker) or macOS (File Vault). The same applies
    to the encryption of portable media like USB sticks or external USB hard drives.
    Here, solutions are available in the form of Veracrypt, GocryptFS, and again Cryptsetup/LUKS,
    which can be set up quickly and work in an absolutely reliable way. If you travel
    between OS worlds from time to time, you will even find a solution in the form
    of Veracrypt that you can use on all common operating systems.


    One consideration is that an existing system without encryption cannot easily
    be switched to encryption. Against the background of fast external drives with
    USB-C and Thunderbolt interfaces, it seems to make more sense to migrate all data
    from the device, re-install with encryption, and copy the data back.


    # Info


    +   [1] LUKS: https://gitlab.com/cryptsetup/cryptsetup

    +   [2] Veracrypt: https://www.veracrypt.fr/en/Home.html

    +   [3] GocryptFS: https://github.com/rfjakob/gocryptfs

    +   [4] ZuluCrypt: http://mhgomchungu.github.io/zuluCrypt/


    # Author


    Freelance journalist **Martin Gerhard Loschwitz** focuses primarily on topics
    such as OpenStack, Kubernetes, and Ceph.'
