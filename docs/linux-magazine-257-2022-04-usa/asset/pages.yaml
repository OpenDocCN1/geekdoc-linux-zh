    \ Serious Flaw Found in All Major Linux Distributions\n\n# ## Zorin OS 16 Educational\
    \ Spin Now Available\n\nZorin OS 16 Education is a Linux distribution aimed at\
    \ preschools as well as primary and secondary schools. Building on their already\
    \ fantastic desktop experience, the developers have added a few tools to help\
    \ educational institutions prepare students with the skills they need to navigate\
    \ the waters of an ever-growing and complicated world.\n\nOne of the key pieces\
    \ of software added is Kolibri, which aims to bridge the educational divide by\
    \ providing access to an enormous library of educational content. Even better,\
    \ an Internet connection isn’t required to use the tool. With Kolibri, school\
    \ administrators can either create their own curriculum or download materials\
    \ from educational leaders such as Khan Academy, Open Stax, MIT, TED-Ed, and Sikan.\n\
    \nOnce downloaded, the content can be shared, peer-to-peer, over a local network.\
    \ Other educational apps include Minder (mind mapping), OpenBoard (whiteboard),\
    \ Minuet (music knowledge), KTouch (typing), KTur-tle (educational programming\
    \ environment), KBrunch (practice exercises with fractions), KWordQuiz (flashcards),\
    \ and Step (physics experiment simulation). Beyond educational apps, Zorin OS\
    \ Education includes the likes of Firefox, LibreOffice, and Gimp.\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_7_0.png)\n\
    \nDownload a copy of Zorin OS 16 Education at https:// zorin.com/os/education/,\
    \ and read about what’s new in the general Zorin OS 16 release at https://blog.zorin.com/2021/08/17/2021-08-17-zorin-os-16-is-released/.\n\
