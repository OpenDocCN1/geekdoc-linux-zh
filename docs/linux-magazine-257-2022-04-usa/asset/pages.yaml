    \ use to find all the points of each plot.\n\n# Sankey Diagrams\n\nA Sankey diagram\
    \ [7] represents the flow of certain variables in or out of a system by depicting\
    \ each flow’s width proportional to its quantity. While this type of diagram is\
    \ not useful for everyone, a Sankey diagram showcases Matplotlib’s flexibility\
    \ and might also be a lifesaver for those in the fields of energy management,\
    \ manufacturing, and science. Figure 8 and its code in Listing 10 are another\
    \ example provided, but not completely explained, by the official Matplotlib documentation\
    \ [8].\n\nTo draw a Sankey diagram, Matplotlib (or any other tool, for that matter)\
    \ needs two things: a function, or object, that **knows** how to draw a Sankey\
    \ diagram, and the parameters of each flow that enters or leaves the system. Listing\
    \ 10 does just that by importing the Sankey function (line 2) and then telling\
    \ Matplotlib to create and **finish** a Sankey object with the single long command\
    \ in line 4. To do that, of course, each flow must be described by three parameters,\
    \ namely the flow’s intensity, orientation (i.e., if it enters or leaves the system),\
    \ and an optional label. Lines 4 and 6 of Listing 10 pass this data passed to\
    \ the Sankey object. As an example, the arrow pointing downward in Figure 8 (with\
    \ a value of 0.1 and the label “Fifth”) is the direct result of writing **-0.18**,\
    \ **‘Fifth’**, and **-1** in the last elements of the flows, labels, and orientation\
    \ arrays (lines 4-6) passed to the Sankey object.\n\n# Polar Charts\n\nYou may\
    \ be familiar with (and potentially loathe) the final Matplotlib example in this\
    \ tutorial from performance evaluations: a polar diagram that resembles a radar\
    \ screen. Figure 9 shows a polar chart with the scores achieved by one or more\
