  md: '# NVIDIA DRIVER INSTALL


    tend to be bugs in my experience. Don’t let that deter you, though, from trying
    some of the different packages out there for your particular NVIDIA card and Intel
    iGPU combo. However, Optimus itself isn’t something that I intend to get into
    here. Everything that I will outline here was done on a SuperFormo X8ST (12) with
    an entry-level NVIDIA GeForce GT 710 in the single PCIe X16 slot. (I have done
    the same on my Dell E6430 (13) with an NVS 5200M and Intel iGPU and have actually
    gotten Optimus to work in the past; though again, that is not something that I
    intend to go over here for the reasons already mentioned.) If your machine has
    NVIDIA and Intel, my suggestion is to simply install the NVIDIA drivers and use
    the NVIDIA card. For me, there was no advantage to having Optimus working, because
    the battery was already shut and I was better off simply running NVIDIA full time
    on that machine for the performance, regardless of the electron abuse. Let’s go
    over how to find and install the correct drivers and deal with whatever aftermath
    may exist.


    # Determining System Component Information


    Once you have the machine up and running, you can check which drivers are being
    used by simply running the following:


    ```

    lspci -vv

    ```


    ![](img/8286bf901ba268fe114d66ada92d1dd6_76_0.png)


    This will show all of your PCI devices with details included (Figure 1). If you
    scroll down a bit, you will see one listed as VGA compatible controller: NVIDIA
    Corporation GK208B [GeForce GT 710], with the particular of your card listed here,
    instead of GT 710, obviously. When you look at the last two lines of that entry
    you will see Kernel driver in use and Kernel modules. Here you will see nouveau
    listed as the kernel driver in use, which, as mentioned, is the basic open source
    NVIDIA driver. If you are running Pop!_OS or a similar distribution which came
    with the proprietary NVIDIA drivers preinstalled, then you may see nvidia listed
    under Kernel driver in use, in which case this article isn’t for you, but most
    of you will likely see nouveau. As a side note, after Capabilities you will see
    access denied. To see this field, simply run the same command with sudo and you
    will have access to that information. This will give some additional information,
    such as power management, but isn’t needed for what we are doing.


    This will take a few seconds, depending on your system. For me, it normally returns
    a complete response in about 15 seconds (Figure 2), so be patient here. My setup
    returns the following:


    ![](img/8286bf901ba268fe114d66ada92d1dd6_76_1.png)


    # Finding Out What Driver Packages Are Available


    At this point you have confirmed that the card was recognized and is running with
    the open source driver. To view which proprietary NVIDIA driver packages are available,
    you will want to run the following command now.


    ```

    ubuntu-drivers devices

    ```'
