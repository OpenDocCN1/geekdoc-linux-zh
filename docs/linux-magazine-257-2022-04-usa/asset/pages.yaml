  md: '# PCB illustrator


    # Pinion


    One of the most recent revolutions in technology, alongside the likes of home
    3D printing, virtual reality, and the Raspberry Pi, is the ability for any of
    us to create a circuit and get it printed. There''s even a choice of software
    you can use to do this, and we''ve covered several in this magazine. Perhaps the
    most mature is KiCAD, a well-established schematic editor that lets you create
    a circuit, verify its design, simulate its execution, and test the electrical
    rules that govern its function. KiCAD will then automatically generate a PCB layout
    and export the results in a format that can be sent to a PCB manufacturer. It''s
    simple enough that even beginners can use it to produce their first circuits,
    but it''s also advanced enough that many engineers use it for their product design.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_82_0.png)


    Pinion is a tool that takes KiCAD files and turns them into beautiful illustrations
    that you can share or publish on a website. Not only do they look incredible,
    with a cell-shaded, pseudo-realistic style, they''re also interactive. Text can
    be added to parts of the circuit or the board, and tracks can be highlighted by
    selecting them. The virtual card can also be flipped over, all thanks to the magic
    of JavaScript. This functionality is added via a simple YAML file that links the
    KiCAD components together with your descriptions, grouping, and pin annotations.
    The text you add can be as long as needed and even include links and basic formatting.
    It uses a hand-drawn library called PpcbDraw-Lib to illustrate the components,
    and while the library is currently relatively small, it''s growing and easy to
    contribute to. The diagram is then built by executing the pinion command, together
    with arguments pointing to the YAML and the KiCAD file. The results are excellent!


    Pinion is a simple Python tool that can save you the trouble of drawing your own
    realistic circuit diagrams.


    **Project Website**

    https://yaqwxs.github.io/Pinion


    # Binary editor


    # GNU poke


    We often look at hexadecimal editors on these pages, and they can be useful for
    looking into binary files, but we don''t often find an actual binary editor like
    GNU poke. Its name refers to a couple of ancient commands that originated with
    the DECsystem-10 but became infamous on the Commo-dore 64. The PEEK command would
    be used to view the contents of a memory location, and the POKE command was used
    to change its value. Both commands were crude, but they also allowed anyone to
    hack whatever was running in system memory. They were easy system exploits, and
    if you had a good understanding of the assembler and the hardware, you could achieve
    almost anything with lots of PEEK and POKE commands, no Internet, and too much
    time over a long summer break.


    GNU poke is a binary editor that will appeal to those old-school (now middle-aged)
    hackers, but also to anyone with an interest in poking around binary files. It
    describes itself as ''sparitan'', which in this context means there''s not much
    to see when it''s running. Launching it with a file as an argument doesn''t open
    an editor you''d recognize but instead will offer you a prompt and some primitive
    help. Typing .dump will generate output that looks like a hex editor, allowing
    you to see the first 128 bytes of your selected file. But the key to using poke
    is understanding the structure of the data you''re looking at, because that allows
    you to use operators and even variables to procedurally edit and modify your data.
    Data can be copied to additional buffers, and there''s decent file input and output
    for your saved changes and discoveries. It''s deep and complex and difficult to
    learn despite the excellent internal documentation, but it''s easier than doing
    this stuff manually in 1986 with PEEK and POKE commands and a summer spent reading
    hardware reference manuals.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_82_1.png)


    Big and little endians, characters, strings, and even bitmaps can be inspected
    and modified with GNU poke.


    **Project Website**

    https://www.jemarch.net/poke'
