- pgno: 59
  md: "# IN-DEPTH\n\n# LibreOffice vs OpenOffice\n\nIn LibreOffice Writer, some of\
    \ the improvements included:\n\n+   - Support for shaped hyperlinks.\n+   - Start\
    \ of support for linked list, character, and paragraph styles.\n+   - Tracked\
    \ changes monitors moved text better.\n+   - Faster PDF conversion for complex\
    \ documents.\n\nIn LibreOffice Calc, highlights included:\n\n+   - Improved speed\
    \ for opening several formats.\n+   - Improved speed for charts and calculations.\n\
    \nBoth Draw and Impress had the following improvements:\n\n+   - PowerPoint compatible\
    \ screen sizes improved.\n+   - New surfaces added to 3D objects.\n\nFinally,\
    \ the following general improvements were made:\n\n+   - A dialog for barcodes\
    \ and QR codes.\n+   - Standardized line widths implemented throughout.\n+   -\
    \ Official binaries optimized for greater performance.\n+   - Enhanced and updated\
    \ help files.\n+   - Various improvements to MS Office filters.\n+   - Four new\
    \ languages added, including English (Israel) and Klingon.\n+   - New scripting\
    \ libraries.\n\nWhat more needs to be said? Even allowing for the differences\
    \ in point releases, the overall picture is clearly one of a faltering project\
    \ versus a thriving one. The idea that OpenOffice can compete with LibreOffice\
    \ simply does not hold up.\n\n# The Clear Choice\n\nOpenOffice remains an adequate\
    \ office suite. OpenOffice.org gave it, like LibreOffice, a firm foundation. In\
    \ particular, OpenOffice’s choice of styles gives it a decided advantage over\
    \ many alternatives. If you only write short or one-off documents, OpenOffice\
    \ may more than fit your needs. Yet the inescapable fact remains that with no\
    \ major changes for over a decade, OpenOffice is showing its age. The project\
    \ is barely keeping up with bug fixes and is not keeping up to date with modern\
    \ demands the way that LibreOffice is. The only argument I have heard in favor\
    \ of OpenOffice is that, like Debian’s Stable repository, it uses older, more\
    \ patched code, but given OpenOffice’s coding resources, even that argument does\
    \ not stand up. In fact, LibreOffice is probably better able to fix its bugs.\
    \ All that OpenOffice has in its favor is name recognition, which only lures users\
    \ into downloading a vastly stunted alternative to LibreOffice.\n\nThe sensible\
    \ response to the current situation would be for OpenOffice either to stop limping\
    \ along or merge with LibreOffice. In fact, LibreOffice proposed a collaboration\
    \ in 2020 [7], but stubbornness and perhaps old grievances ensured that it was\
    \ angrily rejected. Free software means that OpenOffice supporters are free to\
    \ develop anything they choose, but that does not mean that the rest of us are\
    \ obliged to support them. When asked to choose between LibreOffice and OpenOffice,\
    \ the only rational choice is LibreOffice.\n\n# Info\n\n+   [1] OpenOffice Contributors\
    \ 2014-2015:\n+   https://wn.net/Articles/637735/\n+   \n+   [2] OpenOffice Contributor\
    \ Count Graph:\n+   www.openoffice.org/stats/committers.html\n+   \n+   [3] LibreOffice\
    \ Contributors:\n+   https://www.libreoffice.org/about-us/credits/\n+   \n+  \
    \ [4] 2019 Code Commits:\n+   https://fosshbytes.com/libreoffice-sends-open-letter-appealing-to-apsche-openoffice/\n\
    +   \n+   [5] OpenOffice 4.1.11:\n+   https://cxwiki.apache.org/confluence/display/OOOUSERS/AOO+4.1.11+Release+Notes\n\
    +   \n+   [6] LibreOffice 7.3 Release Notes:\n+   https://wiki.documentfoundation.org/ReleaseNotes/7.3\n\
    +   \n+   [7] Collaboration Proposal:\n+   https://blog.documentfoundation.org/blog/2020/10/12/open-letter-to-apsche-openoffice/20"
