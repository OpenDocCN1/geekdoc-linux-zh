  md: '# Game creator


    # Bladecoder Adventure Engine


    ![](img/8286bf901ba268fe114d66ada92d1dd6_83_0.png)


    When video games first became popular and accessible, it seemed like each new
    month brought a new gaming genre. Arcade versions, text adventure games, vertical
    shoot-''em-ups, horizontal scrolling shoot-''em-ups, platform, strategy games,
    and point-and-click adventures all appeared over a few short years. As technology
    improved, it seemed these game types would be forgotten as progress outplanted
    them with more engaging and more immersive game types. But this hasn''t happened.
    Instead, many of those original game types have survived and are even flourishing
    in an age where GPUs perform real-time raytracing and smartphones are millions
    of times more powerful than the Apollo 11 guidance computer. In particular, 2D
    graphics are still relevant, remaining popular in platformers, RPGs, and point-and-click
    adventure games. Even the original Sierra developers returned in the adventure
    games category, with the successful crowdfunding and release of Thimbleweed Park
    in 2017 and many similar titles released in the proceeding years.


    There''s more to the old game ideas than retro gaming and nostalgia. Many of them
    can be the basis of a modern legitimate title, while hopefully also being easier
    to produce on modern hardware than the original titles back in the day. The Bladecoder
    Adventure Engine is a perfect example of this. It''s a set of modern tools that
    help you create interactive graphic adventures, much like Monkey Island or Thimbleweed
    Park, and it''s even being used to create an Android and iOS game called The Goddess
    Robbery. Using the editor, this and other games can be downloaded and inspected
    in order to help you learn how to build your own games.


    The engine itself consists of two parts: a graphical editor and the background
    engine for running the resulting game. The graphical editor (Adventure Editor)
    is where you''re likely to spend the most time because it''s where your project
    is created, assets are added, and functionality is implemented, all without requiring
    any programming. Projects consist of one or more chapters containing scenes. Scenes
    are analogous individual locations, such as the Scrumm Bar or Governor''s Mansion
    in the original Monkey Island, and they''re core to point-and-click gameplay.
    The editor enables you to easily import assets, including the graphics for a background,
    sprite actors for movement, and objects to show, hide, and collect. All of this
    is tied together by adding clickable areas in the background linked to verbs such
    as "look", "pickup", or "talk" to perform actions. This is game creation via point-and-click,
    using the panels around the principal scene window, and the application has more
    in common with a graphical editor such as Gimp or Krita than an IDE. The end result
    can be exported and published as a standalone game without any programming or
    compilation.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_83_1.png)


    There''s initially a lot to learn, but there are some excellent example projects,
    good documentation, and even a few video tutorials to help get you started. It''s
    easier than using Godot or the ancient Adventure Game Studio and could be a great
    way to get someone into game development who might be intimidated by programming
    or using something less graphical. It''s also perfect for collaboration because
    the work can so easily be split into artwork, sound design, script writing, and
    game design, with an end result that can be shared with anyone, even commercially.


    ### Project Website


    https://github.com/bladecoder/

    bladecoder-adventure-engine'
