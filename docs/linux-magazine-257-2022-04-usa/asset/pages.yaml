  md: '![](img/8286bf901ba268fe114d66ada92d1dd6_64_0.png)


    **Figure 6:** The command center lets you control the playback. Under Sources
    you can change the audio source. The interface automatically adjusts to the screen
    size.


    If you have a connected screen, keyboard, and mouse, you are taken directly to
    the user interface. Otherwise, call `http://HiFiBerry.local` in the browser. If
    the connection fails, determine the current IP address of the SBC. If in doubt,
    the user interface of the router should provide the details. You will find the
    Raspberry Pi listed there as *hiifiberry*. Enter the IP address you determined
    in this way in the browser. To access the interface with this IP address in the
    future, you might want to configure your router to always assign the same IP address
    to the Raspberry Pi.


    If you cannot access the user interface after about five minutes, disconnect the
    computer from the power and then reconnect it. A connected screen might give you
    clues as to the problem. If the restart attempt fails, make sure the HiFiBerryOS
    image was written to the medium without errors; the card could be faulty.


    # Setup


    Once the HiFiBerryOS web page (Figure 5) welcomes you, click **Next Step** and
    then **Finish Setup** until you see the interface (Figure 6).


    Unless you want to connect a network cable permanently, go to the **Network**
    menu item, select a WiFi network under the **Wireless** tab, and enter the access
    password. As soon as HiFiBerryOS establishes the connection, shut down the system
    in **General | Power | Shut Down**, wait 20 seconds, and then disconnect it from
    the power supply. You will not need the network cable from now on.


    After a reboot, navigate to the very bottom of the interface. The system should
    show the board it detected; the Amp2 will be listed as something like *DAC+ /
    Amp2*. However, a combination of the **Amp60** and **DAC+ ADC** might not be detected
    correctly; as a result, the audio input does not appear as an *Analog Input* under
    Sources.


    In this case, shut down HiFiBerryOS again as before. Open the smallest partition
    on the SD card on your PC. Under Windows you can access the required files directly.
    In a text editor, add the following line at the end of the `config.txt` file:


    ```

    dtparam=i2s_hifiberry-dacplusadc

    ```


    Restart the Raspberry Pi from the SD card and make sure in the web interface that
    the HiFiBerry has identified the system correctly.


    # Bluetooth


    Once the system is running, switch to **Sources** (i.e., audio sources). **AirPlay**
    is enabled by default, and smartphones with support for this and other media players
    should identify the computer as storage and be able to play back music through
    it.


    For Bluetooth access, select **Bluetooth** and then click the black **Bluetooth
    Pairing** button. After that, all devices in the vicinity with Bluetooth enabled
    will recognize the *HiFiBerry* as a speaker. Pair it with your smartphones, tablets,
    and other devices – the procedure will differ in each case (Figure 7) – then stop
    pairing on HiFiBerryOS.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_64_1.png)


    **Figure 7:** To introduce Android 11 to HiFiBerryOS, select **Connected devices**
    and **Pair new device** in the settings.'
