    center line. At the same time, x0 is as far from the left edge of the image as
    x1 is from the right.


    Listing 2 shows the algorithm that turns a JPEG photo upside down. The two nested
    for loops starting in line 13 work their way through the Y values from 0 to the
    bottom of the image and through the X values from 0 to the right edge. These coordinates
    correspond to the x0 and y0 positions of the original pixels. Inside the double
    loop, line 15 retrieves the original pixel value in jimg.At(x,y). To rotate the
    image, it stores the value at the mirrored position in the newly created, modifiable
    photo dim at position x1, y1. The position is calculated as the distance of x0
    from the right or y0 from the bottom edge of the image. The algorithm efficiently
    mirrors the image at both the horizontal and vertical center lines, turning it
    upside down as desired.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_52_1.png)


    A digital photograph is ultimately an m by n matrix of pixel values. To turn it
    upside down (i.e., to perform a 180-degree rotation), an algorithm simply swaps
    pixel values above and below the center line. The X values of the pixels in an
    image traditionally run from left to right, while the Y values increase from top
    to bottom. This means that the origin of the photo can be addressed as (0, 0)
    top left, while the bottom right corner is at the coordinates (w-1, h-1), where
    w specifies the image width and h the image height, each in pixels.


    # Double Flip


    But be careful: If you simply swap the Y values for the rotation, you will end
    up with a mirror image of the original photo. Instead, smaller X values (pixels
    in the upper left corner) need to be put in the lower right corner for a 180-degree
    rotation. This means that the rotation algorithm needs to mirror both the Y values
    and the X values. A pixel located in the upper half of the image with the coordinates
    (x0, y0) thus ends up in the lower half of the image at position x1, y1. The distance
    from y0 to the center line is equal to the distance from y1 to the


    # Wriefable Copy


    When Go reads a JPEG photo from disk, it usually ends up in a pixel array that
    can''t be modified. But since the algorithm wants to manipulate the photo, line
    11 in Listing 2 first creates a wrifelable photo with the same dimensions as the
    original using NewRGBAT() but leaves it empty. Then the rot 180 function keeps
    calling jimg.Atf() for all pixels of the original and transfers them to the target
    photo, mirrored one by one, with Set(x,y,Value). Line 19 returns the


    ![](img/8286bf901ba268fe114d66ada92d1dd6_52_2.png)


    ```

    Listing 2: rotate-180.go


    ```go

    01 package main

    02

    03 import (

    04 "image"

    05 )

    06

    07 func rot180(jimg image.Image) *image.RGBA {

    08 bounds := jimg.Bounds()

    09 width, height := bounds.Max.X, bounds.Max.Y

    10

    11 dim := image.NewRGBA(bounds)

    12

    13 for y := 0; y < height; y++ {

    14 for x := 0; x < width; x++ {

    15 dim.Set(width-1-x, height-1-y, jimg.At(x, y))

    16 }

    17 }

    18

    19 return dim

    20 }

    ```

    ```'
