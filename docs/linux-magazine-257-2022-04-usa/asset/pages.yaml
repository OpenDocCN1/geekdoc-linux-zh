    Of course, a combination of Cryptsetup and LUKS has one major disadvantage: It
    offers virtually no interoperability with other operating systems. You''ll need
    a way to deal with a kind of chicken-and-egg problem. When LUKS and Cryptsetup
    were just gathering speed, there were already solutions that worked equally well
    on all the major operating systems. These alternative solutions are not as deeply
    integrated into the system, but they work across operating system boundaries,
    and not just on Linux.


    various operating systems. On Linux, for example, Veracrypt directly relies on
    Dm crypt. However, it also ensures that the containers and data carriers created
    remain mutually compatible across operating system boundaries.


    An admin with the data medium and the corresponding key can mount existing devices
    with Veracrypt encryption on Windows, Linux, and macOS in the same way. Veracrypt
    is therefore particularly suitable for users who frequently switch from Linux
    to Windows and back, for example, because they use different systems on their
    home and work computers.


    # Remembering Truecrypt


    An article about disk encryption under Linux would be incomplete without mentioning
    Veracrypt [2] and its famous predecessor. Veracrypt emerged from Truecrypt in
    2013. At that time, Truecrypt was considered by many observers in the Linux world
    to be the only valid alternative to the combination of Cryptsetup and LUKS on
    Linux.


    # Plausible Deniability


    Another decidedly handy feature in Veracrypt is the ability, inherited from its
    predecessor, to nest encrypted drives and thus achieve what security researchers
    call *plausible deniability*. Plausible deniability offers a means for concealing
    data without it looking like you are concealing data. The idea is to completely
    hide the existence of encrypted data. The attacker doesn''t even know that data
    is being withheld and, according to the theory, doesn''t even think of asking.


    Truecrypt development came to an end as a result of an audit in 2014, and it was
    the "Truecrypt developers themselves who warned people not to use their own software.
    Shortly thereafter, the developers provided a new and final version of Truecrypt,
    which was massively limited in terms of its functionality. According to the developers,
    this final release was only intended to convert existing setups into Bitlocker
    setups with Microsoft''s standard encryption.


    Veracrypt supports plausible deniability by creating multiple nested containers
    on a drive. The first container and its signature on the disk are easily recognizable
    from the outside. However, because this container contains only


    The end of Truecrypt caused wild speculation in the community, which even considered
    the involvement of intelligence agencies. This speculation did not subside when
    additional audits completed retrospectively found no significant problems in the
    way Truecrypt worked. The actual reason for Truecrypt''s end will probably never
    be clarified.


    # Truecrypt''s Heir


    Veracrypt, which had spun off from Truecrypt a year earlier as an independent
    project, became ''Truecrypt''s de facto successor. All in all, Veracrypt is a
    highly functional data carrier encryptor from today''s point of view.


    One huge advantage that Veracrypt inherited from its ancestor is that it works
    on Windows, Linux, and macOS (Figure 2). It uses the existing infrastructure to
    the extent possible on the


    ![](img/8286bf901ba268fe114d66ada92d1dd6_16_1.png)


    Figure 2: Encrypted drives created in Veracrypt can be used on Windows, macOS,
    or Linux systems.'
