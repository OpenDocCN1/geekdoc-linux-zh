- pgno: 31
  md: 'ciphertexts are now combined by a computation $x$. By way of an example. I''ll
    first encrypt the number 2 with the public key pk: $C_1 := Enc(pk, 2)$. The resulting
    ciphertext is referred to as $C_1$. In the second step, I''ll follow the same
    steps with the number 3: $C_2 := Enc(pk, 3)$ to generate the ciphertext $C_2$.
    The third step now concatenates the two ciphertexts by applying the operation
    $x$: $C_3 := C_1 x C_2$. If the encryption method is an additive homomorphic method,
    then the ciphertext $C_3 = C_1 x C_2 := Enc(pk, 2) x Enc(pk, 3) = Enc(pk, 2 +
    3) = Enc(pk, 5)$ contains a value of 5. If the process is multiplicatively homomorphic,
    then $C_3 = C_1 x C_2 := Enc(pk, 2) x Enc(pk, 3) = Enc(pk, 2^*3) = Enc(pk, 6)$,
    contains a value of 6.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_31_0.png)


    In both cases, only the owner of the secret key sk has access to the result of
    the computation, since only they can decrypt the ciphertext $C_3$. An example
    of additive homomorphic encryption is provided by the ElGamal method [2], whereas
    the Paillier method [5] is multiplicatively homomorphic.


    In contrast to the previous methods, fully homomorphic encryption allows arbitrary
    calculations to be performed on the ciphertext. For a better understanding of
    how it works, Figure 6 shows the individual steps. First, a plaintext m is encrypted
    with the public key pk (a), resulting in the ciphertext C. Now the computation
    (b) is performed; the ciphertext C and the public key pk and the description of
    the program P flow into this. The computation results in a ciphertext $C_p$ and
    the result of the computation is $Eval(pk, C, P) = C_p = Enc(pk, P(m))$.


    Just as in the previous examples, anyone can perform the computation on the ciphertext
    $C_p$ since it does not require any secret information. However, only the owner
    of the associated secret key sk can compute the result. Fully homomorphic encryption
    is an incredibly powerful tool because there are no constraints on the P program.
    This means that arbitrary computations can be performed on the encrypted data.
    Performing computations on encrypted data dramatically reduces the need to trust
    the party storing the data. For instance, you could outsource the data to a cloud
    service that holds the data and performs computations without the need to decrypt.
    The service performing the computations would not need to see the plaintext data
    or even the result of the computation. The data owner remains in control over
    the data.


    # Conclusions


    This article has introduced you to provable security, one of the cornerstones
    of modern cryptography. You also learned about some recent research topics that
    are exciting cryptographers today.


    Cryptography has been around for thousands of years, but it still manages to excite,
    and state-of-art encryption techniques still sound like pure magic. For example,
    who would have thought that computations on encrypted (genetic) data would work?
    But cryptography is still in its infancy, and the crypto technologies of the future
    will no doubt continue to surprise us. ■■■


