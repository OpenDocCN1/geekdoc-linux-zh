- pgno: 30
  md: '# Cryptography and Provable Security


    In this example, assume that Alice wants to store a file m with encryption in
    the cloud. To do this, she uses the message and a public key. The cloud operator
    does not want to store duplicates of the same message for efficiency reasons.
    However, since the file has been encrypted, the operator cannot readily determine
    whether the message already exists in an encrypted form in the cloud.


    For this reason, the ciphertext is extended to include the hash value of the message:
    $c = (Enc(pk,m), H(m))$. A hash function is a deterministic function that usually
    compresses the input. The security of this function is based on collision resistance.
    This property means that it is (efficiently) impossible to find two different
    messages $m_1$ and $m_2$ that produce the same output $(H(m_1) = H(m_2))$.


    Intuitively, you might expect that the hash value does not reveal any information
    about the message m thanks to the compression properties. However, there is no
    security property that covers this assumption. In fact, analysis of the construction
    shows that it is completely insecure. In particular, the output of the hash function
    can be used to completely override the security properties of the encryption.


    This simple example illustrates that a combination of two secure cryptographic
    methods can lead to an insecure construction. Cryptographic methods should only
    be used together if you actually need the security properties of each method.
    It is precisely this relationship between the underlying properties and the properties
    you want to achieve that is demonstrated by formal proof.


    # Current Research Topics


    There are still countless unsolved problems in the cryptography research field.
    Thematically, it moves between basic theoretical research and applied practical
    research. This section presents two areas of current research.


    One is password-based cryptography. Passwords are the Achilles'' heel of many
    modern systems because they combine everything a cryptographer usually doesn''t
    want to have: They are short and have little entropy, which means that an attacker
    can break most passwords by simply trying them out. This type of attack is known
    as an offline brute force attack. After the invention of public-key cryptography,
    many speculated that passwords would die out and everyone would exclusively use
    a private key for authentication. That has not happened to date,


    and it appears that passwords will remain the most common technique for authentication
    on the Internet in the long term. In research, this leads to the following question:
    How can the security of a system be guaranteed even if it uses weak secrets like
    passwords?


    Password hardening and password-hardened encryption (PHE) was developed in this
    context (Figure 4). The idea is mainly based on the following considerations.
    First, the user''s interface must not change, so they continue to use their username
    and password for authentication. Second, the user''s data must be resistant to
    offline brute force attacks – even if the database has been stolen. And third,
    to achieve that, you need an external crypto service that does not have direct
    access to the data, but only provides operations to encrypt and decrypt the data.


    Password-hardened encryption achieves a level of security that was previously
    unattainable. For the first time, a user''s data can be stored secured against
    offline brute force attacks, and without the user having to use complicated public
    key techniques.


    A second research focus is on computations on encrypted data. To better understand
    how computations can be performed on encrypted data, consider how conventional
    encryption works.


    Regardless of the type of encryption method, each method essentially provides
    key generation, encryption, and decryption. Since key generation does not play
    a role in the following considerations, I will not go into the details of this
    procedure.


    In cryptography, an encryption operation is a procedure that converts a readable
    text – the plaintext – into a form that no longer reveals any information about
    the plaintext – ciphertext. Figure 5 visualizes the encryption and decryption
    operation. The encryption algorithm Enc receives a message m and a public key
    pk as input. The result of the computation is a ciphertext c. The decryption algorithm
    Dec is used to decrypt this again. As input, it needs the secret key sk and the
    ciphertext c.


    In order to describe a homomorphic encryption method, you first need to understand
    the concept of homomorphism. It comes from mathematics and means structure-preserving
    mapping. Put simply, this means that you can map the execution of a computation
    in a structure to a computation on another structure. The structure itself is
    preserved.


    The concept of homomorphism is now applied to encryption methods. This means performing
    a computation on the ciphertext without actually decrypting the ciphertext. The
    special thing about this operation is that the computation on the plaintext has
    an effect on the ciphertext, although the plaintext is not available during this
    computation. Depending on the type of encryption, the combination of the ciphertexts
    is applied to the plaintext as an addition or multiplication. The addition operation
    is known as additive homomorphic encryption, and the multiplication operation
    is called multiplicative homomorphic encryption.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_30_0.png)


    The right half of Figure 5 shows this process. You can see two ciphertexts $C_1$
    and $C_2$ on the left. They were computed in the conventional way: that is, $C_1$
    is the result of encrypting a message $m_1$ with the public key pk, while $C_2$
    is the result of encrypting a message $m_2$ with the public key pk. These two


    ![](img/8286bf901ba268fe114d66ada92d1dd6_30_1.png)'
