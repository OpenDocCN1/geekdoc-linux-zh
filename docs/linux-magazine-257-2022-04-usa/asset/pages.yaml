    \ by column from right to left in the target matrix – it’s as simple as that.\n\
    \nWith these two algorithms now cast in code, the main program in Listing 5 can\
    \ fetch a photo from disk, read the Exif headers, determine whether there is an\
    \ orientation tag in the headers, and initiate rotation to the corrected format.\
    \ If you have used Exiftool to read the JPEG photos’ Exif headers thus far, you\
    \ might be surprised to find that the true value of an Orientation tag in the\
    \ Exif headers is not a string with the degree information at all, but an integer\
    \ value. Common settings are the values 6\n\n(90 degrees clockwise), 3 (180 degrees),\
    \ or 8 (90 degrees counter-clockwise). Other values of the standard, which also\
    \ supports mirrored photos, are shown in Figure 6, but they occur less frequently\
    \ in practice.\n\nThe Exif tags hidden in a JPEG photo are not easy to read, but\
    \ fortunately the Go community on GitHub provides some libraries that simplify\
    \ the task to calling a `Decode()` function. Listing 5 shows the main autorot\
    \ program, which uses the `goexif` library provided by GitHub user `rwcarlsen`.\
    \ I used a similar open source product for image manipulation in an earlier column\
    \ [2].\n\nUsing `data.Get()`, Listing 5 in line 34 retrieves the value of the\
    \ Orientation tag from the mess of Exif tag data. If the tag is not found, there\
    \ is nothing to do, because the image already has the correct orientation. However,\
    \ if the program finds a tag, line 40 fetches the first integer value of the tag\
    \ (index 0), and the `switch` construct starting in line 45 determines what kind\
    \ of corrective rotation (90 or 180 degrees) the image needs and calls the modifier\
    \ function\n\n# **Listing 4:** rotate-90.go\n\n```\n```go\n01 package main\n02\n\
    03 import (\n04 \t\"image\"\n05 )\n06\n07 func rot90(jimg image.Image) *\n\timage.RGBA\
    \ {\n08 \tvar bounds = jimg.Bounds()\n09 \twidth, height := bounds.Max.X,\n\t\
    bounds.Max.Y\n10 \tvar dim = image.NewRGBA(&\n\timage.Rect{\n\tMax: image.Point{\n\
    \tX: width, Y: height}\n\tMin: image.Point{}})\n11\n12 \tdim := image.NewRGBA(bounds)\n\
    13\n14 \tfor y := 0; y < height; y++ {\n15 \t\tfor x := 0; x < width; x++ {\n\
    16 \t\t\torg := jimg.At(x, y)\n17 \t\t\tdim.Set(height-y, x, org)\n18 \t\t}\n\
    19 \t}\n20 \n21 \treturn dim\n22 }```\n```\n\n# Shop the Shop\n\nshop.linuxnewmedia.com\n\
