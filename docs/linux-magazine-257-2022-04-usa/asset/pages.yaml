  md: '![](img/8286bf901ba268fe114d66ada92d1dd6_18_0.png)


    normal operating mode, you enable a GocryptFS container, write something to it,
    disable the container again, and then the encrypted content appears as such on
    the underlying file system. Creating a GocryptFS overlay is quick and easy with
    the help of the documentation.

    GocryptFS offers a second option, known as reverse mode, for storage targets that
    are implicitly insecure. If you want to store your backups in the cloud, for example,
    you can activate reverse mode in GocryptFS. Reverse mode exposes the encrypted
    data directly so that you can copy it to another location.


    GocryptFS is about as simple as Veracrypt, however, GocryptFS offers a clear speed
    advantage. At least subjectively, there are considerable differences when encrypting,
    and these differences are despite the fact that Veracrypt and GocryptFS support
    acceleration for the various crypto algorithms in the same way. If you want to
    manage encrypted data, you will definitely want to take a look at GocryptFS.


    # Universal GUI: Zulucrypt


    The final candidate in this encryptors showcase is a program that does not actually
    do the encryption work itself. Zulucrypt [4], together with Zulumount, which is
    included with it, is more concerned with organizing the proliferation of encryption
    methods available under Linux.

    Zulucrypt (Figure 6) promises to unify classic crypt setups with LUKS, Veracrypt,
    and GocryptFS in a single interface. First


