  md: '# COVER STORY


    # Disk Encryption


    ostensibly relevant data when handled correctly, the owner of the drive can hand
    over the key (Figure 3). The second volume hides its header in the header of the
    first volume. You need to know that it exists if you are able to open it, because
    from the outside, it looks like random data. And its existence can be easily explained
    by the existence of the first encrypted volume.


    On Windows, Veracrypt now even goes one step further and can keep a hidden operating
    system in an encrypted drive. From the outside, this drive looks like a normal
    data medium, but under the hood, it hides a complete system partition.


    # Easy to Use


    If you are looking for a quick solution for encrypted data media, Veracrypt is
    the right choice. After the install, which you handle with the package manager
    on Linux and with the installer on Windows and macOS, a wizard opens in the form
    of a graphical interface. The wizard guides you through the entire creation process.
    Veracrypt offers the option of creating encrypted containers on the file system
    or encrypting entire block devices.


    No matter which approach you choose, any system administrator worth their salt
    should have no difficulty understanding and responding to Veracrypt’s questions.
    If you have never dealt with disk encryption previously, you might not find Veracrypt
    particularly user-friendly. However, if you have been in the saddle for a while
    longer, you will get along well with the program on all supported platforms.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_17_0.png)


    # GocryptFS


    Another state-of-art tool for encrypted disks on Linux is GocryptFS [3]. GocryptFS
    also owes its existence to an earlier system that lost its shine for the FOSS
    community: EncFS.


    EncFS came under fire when something happened to it during an audit that should
    never happen to an encryption solution. The testers detected a vulnerability in
    the source code that, in the worst case, allowed the key used for encryption to
    be computed. This danger existed with EncFS especially when attackers got their
    hands on several versions of the encrypted container. The actual key could then
    be found out by simple matching and an exclusion procedure. Basically, since this
    incident, EncFS has been under fire from everyone concerned with security and
    encryption (Figure 4).


    However, Austrian Jakob Unterwurzacher found the idea behind EncFS so convincing
    that he set about creating a new implementation. In doing so, he worked with the
    Go programming language, which not only explains the program’s name, but also
    translates to considerable speed advantages in practice compared to the previously
    used C + +. The use of FUSE remains unchanged, so GocryptFS (Figure 5) can be
    used on any Linux system with an activated FUSE environment.


    Because FUSE is also available for Windows, GocryptFS also works on Windows systems.
    With its own wrapper, however, the solution goes by the name of CpcryptFS, and,
    as the name suggests, the Windows version of GocryptFS is written in C + + instead
    of Go. macOS users are less fortunate: macFUSE does exist, but it is not available
    under a free license. The FOSS community therefore tends to avoid the tool. In
    the meantime, however, an alternative has been devised that takes GocryptFS to
    macOS, too, although some special functions have been dropped.


    If you don’t want to use GocryptFS on the command line, you can turn to StiriKali,
    which offers a graphical user interface for GocryptFS and its predecessor EncFS.


    # What GocryptFS Offers


    As described, GocryptFS always creates complete, encrypted containers in a file
    or on a disk. Basically, GocryptFS is designed as an overlay file system. In


