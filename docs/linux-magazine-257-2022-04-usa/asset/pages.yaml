    +   [1] DANE: https://datatracker.ietf.org/doc/html/rfc6698

    +   [2] TLSA generator: https://ssl-tools.net/tlsa-generator

    +   [3] WKS/WKD: https://www.gnupg.org/WKD

    +   [4] S/MIME: https://en.wikipedia.org/wiki/S/MIME

    +   [5] Volkverschlüsselung: https://volkverschluesselung.de/(in German)

    +   [6] Fraunhofer Institute: https://www.fraunhofer.de/en.html

    +   [7] Mailvelope: https://mailvelope.com/

    +   [8] Open-XChange: https://www.open-xchange.com/


    # Author


    **Peer Heinlein** is responsible for running business-critical Linux infrastructures
    with his company Heinlein Support. Specializing in mail services since 1992, he
    wrote the Postfix book and is responsible for the mail servers of many ISPs, data
    centers, and enterprises. His own mail provider, Mailbox.org, specializes in data
    security and privacy.'
