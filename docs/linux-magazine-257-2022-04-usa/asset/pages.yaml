  md: 'Listing 2, in fact, does exactly the same things as Listing 1 but by calling
    stateful functions such as `figure`, `plot`, or `legend` (instead of methods attached
    to an instance of some object). In this context, “stateful” means that each pyploy
    function call adds or changes something to the current state of a plot, without
    erasing what has been done by previous calls of other functions.


    In practice, pyploit function calls have equivalent Matplotlib object-oriented
    methods, and vice versa, to such an extent that your choice of coding style is
    a matter of personal preference. However, the official Matplotlib documentation
    suggests using the pyploy style for “quick interactive work” and using the object-oriented
    style, which is more flexible, for code that will be reused often in many different
    ways.


    # Matplotlib Terminology


    Before looking at any actual code, I need to explain some basic terminology, because
    Matplotlib gives a few words a slightly different meaning than they have in ordinary
    English.


    Aside from what you see on the screen, Matplotlib uses `Figure` as a keyword that
    creates a container of objects called “Artists.”


    Basically, everything visible inside a Matplotlib Figure is an Artist, from drawings
    to embedded images, text captions, and so on. Each Figure keeps track of, and
    connects, all its child Artists, including nested subfigures, non-graphic objects
    such as titles or legends, and, of course, `Axes`.”


    An Axes (plural) is maybe the most basic and most essential Matplotlib Artist:
    It is a region, directly attached to a specific Figure, where you can plot some
    data set. You can create Axes together with their parent Figure or add them later.


    Each Axes has at least a title and two labels, one per axis. Most other Artists
    cannot be moved to, or shared with, an Axes (that is, one specific plot or subplot)
    different from the one they were originally attached to.


    Another essential Matplotlib term, `Axis` (singular), has pretty much the same
    meaning it has in normal English. An Axis object sets all the components of one
    axis of a plot, from the scale (linear, logarithmic, or other) to the extreme
    points, marks (also called ticks), and their corresponding text labels. Each Axes
    includes at least two Axis objects, but it is possible to add more, as shown later
    in this tutorial.


    From figure borders to colors, there are a zillion ways to style each single detail
    of any Matplotlib plot and two high-level ways to set them. The quick and dirty
    option, which may be enough in some scenarios, is to manually set all the options
    you need when you generate a plot. The other option is to use full styles, which
    are


    predefined listings of all the default visual settings that your plots will need.
    You may load either one of the predefined styles shipped with Matplotlib using
    the `style.use` function:


    ```

    `plt.style.use(''somematplotlibStyle'')`

    ```


    You can also load a custom style sheet from a file that you have created. In both
    cases, changing styles will only require you to change the one line of code that
    contains the style name or the path to the file that stores it. In addition, because
    both methods will ignore any non-visual setting that may be inside a style, styles
    are portable across machines with very different installations of Matplotlib.


    # Data Structures


    As far as data structures are concerned, no matter how you define and fill a sequence
    of values, Matplotlib will internally convert it to the special arrays provided
    by NumPy, because those are the formats that its plotting functions can handle.
    In most cases, you should directly use the same arrays anyway, as shown in the
    examples that follow, because they are faster to process than normal Python arrays
    and consume less memory.


    # Matplotlib Gallery


    With the general concepts presented above in mind, I will use some simple, but
    very different, examples to create plots with Matplotlib. You can easily adapt
    the following examples to a variety of use cases.


