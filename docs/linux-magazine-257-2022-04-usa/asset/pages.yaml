  md: '# LINUX NEWSSTAND


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere else.
    Explore our full catalog of back issues for specific topics or to complete your
    collection.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_94_0.png)


    ![](img/8286bf901ba268fe114d66ada92d1dd6_94_1.png)


    # #256/March 2022


    # Facial Recognition


    Biometrics got a boost recently with the arrival of Microsoft''s Hello technology.
    Now the open source world is catching up, with an innovative tool appropriately
    called Howdy. Facial authentication might not be ready for the CIA yet, but we''ll
    help you get started with Howdy and explore the possibilities of authenticating
    with a glance.


    **On the DVD:** antiX 21 and Haiku R1/ Beta 3


    ![](img/8286bf901ba268fe114d66ada92d1dd6_94_2.png)


    # #255/February 2022


    # Break It to Make It


    Fuzz Testing: Ever wonder how attackers discover those "carefully crafted input
    strings" that crash programs and surrender control? Welcome to the world of fuzz
    testing. We introduce you to the art of fuzzing and explore some leading fuzz
    testing techniques.


    **On the DVD:** Parrot OS 4.11 and Fedora Workstation 35


    ![](img/8286bf901ba268fe114d66ada92d1dd6_94_3.png)


    # #254/January 2022


    # Phone Hacks


    Eventually phone manufactures just give up on supporting old hardware. If you''re
    not ready to abandon that hardware yourself, you might find a better alternative
    with LineageOS — a free Android-based system that supports more than 300 phones,
    including many legacy models that are no longer supported by the vendor. We also
    explore PostmarketOS, a community-based Linux distribution that runs on several
    Android devices.


    **On the DVD:** Ubuntu 21.10 and EndeavourOS 2021.08.27


    ![](img/8286bf901ba268fe114d66ada92d1dd6_94_4.png)


    # #253/December 2021


    # OpenBSD


    BSD Unix has been around longer than Linux, and it still has a loyal following
    within the Free Software community. This month we explore the benefits of a leading
    BSD variant from the viewpoint of a Linux user.


    **On the DVD:** Tails 4.22 and Q4OS 4.6


    ![](img/8286bf901ba268fe114d66ada92d1dd6_94_5.png)


    # #252/November 2021


    # Locked Down!


    The security landscape keeps changing, and experienced users know they need to
    keep their eyes open for tools and techniques that give an edge. This month we
    study smartcards, hard drive encryption, and a less-bloat alternative to Sudo.


    **On the DVD:** Debian 11 and ReCore Linux 2101


    ![](img/8286bf901ba268fe114d66ada92d1dd6_94_6.png)


    # #251/October 2021


    # Linux From Scratch


    Building an operating system is not like compiling a desktop app. You''ll need
    to create a complete development environment – and if you follow the steps carefully,
    you''ll emerge with a deeper understanding of Linux.


    **On the DVD:** Linux Mint 20.2 Cinnamon Edition and Garuda Linux KDE Dr460nized
    Edition'
