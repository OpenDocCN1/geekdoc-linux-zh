    from the DHCP server (e.g., from a router). Without a network cable, HiFiBerryOS
    sets up its own WiFi network, to which you connect your smartphone; its name will
    start with HiFiBerry_Setup_.


    # Cases


    Because of the height and the position of the connectors, the amplifiers do not
    fit into standard Raspberry Pi cases. However, at least for the Amp2, Modul 9
    offers a compact steel housing [7], as well as other models, but not all will
    fit every Raspberry Pi variant.


    # Software


