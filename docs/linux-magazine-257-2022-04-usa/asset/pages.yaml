- pgno: 23
  md: '# The State of Email


    Since manual checks are not a good way to handle large numbers of communication
    partners, PGP implements the concept of a web of trust. After careful personal
    verification of their identity, users sign the keys of other users (Figure 2),
    thereby increasing their trustworthiness. The signatures then become part of the
    user’s public key (Figure 3). If, at some point, keys have a sufficiently good
    reputation due to the many signatures of known trustworthy communication partners,
    you can do away with your own manual verification. Even today, PGP keysigning
    parties are held at conferences. You have to bring your own PGP keys and, by default,
    your ID card or passport as proof of identity, because careful verification is
    mandatory.


    But the concept of mutual PGP signing is complex, requires initiative, and requires
    a great deal of interaction – one of the main reasons why PGP has never gained
    widespread acceptance. Modern approaches therefore envisage publishing your own
    PGP key via special key servers run by your provider, from which communication
    partners can obtain it automatically. Although this approach does not rule out
    manipulation by the provider’s administrators, it does ensure that keys can no
    longer be generated and circulated arbitrarily by third parties. Using methods
    such as WKS/WKD [3], domain owners can therefore specify whose PGP key servers
    need to be queried for the keys for their own domain. However, only a few providers
    systematically offer PGP key servers and have set up corresponding WKD records
    for their mail domains. If they do, nothing stands in the way of an automatic
    key exchange. PGP implementations such as GnuPG can then automatically detect
    the correct key servers and download key material.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_23_0.png)


    Figure 2: Signing a third-party key increases its trustworthiness and requires
    appropriate care.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_23_1.png)


    Figure 3: The properties of a key show its fingerprint and the signatures of other
    users.


    # S/MIME: A Central Approach


    S/MIME [4], the second known mail encryption method, basically encrypts and signs
    in a way comparable to PGP but takes a more centralized approach to key generation
    and management. S/MIME certificates are issued, monitored, and declared invalid
    if necessary by a central certification authority. S/MIME is therefore suitable
    for structured use in a very controlled environment, for example, in public authorities
    or large companies. It is not surprising that classic business mail clients such
    as Outlook have always supported S/MIME natively.


    On the other hand, S/MIME is less practical for private use, because there is
    initially no sensible centrally organized certification authority. Many years
    ago, there was an attempt by savings banks to issue S/MIME certificates to the
    masses via the S-Trust project, but this initiative did not catch on. The most
    practicable approach to date appears to be the Volksschlüssel- solving (People
    Encryption) project [5], which is run by the Fraunhofer Institute [6], which is
    worthy of recommendation but has not achieved widespread acceptance.


    # Unencrypted Metadata


    If an email is encrypted using PGP or S/MIME, the encryption affects the entire
    body of the email, including the message text and any file attachments. The metadata
    of the mail header (i.e., information such as sender, recipient,'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'message ID, and date) remains readable. The subject of an email is also classically
    part of the non-encrypted header data of an email. If desired, modern PGP implementations
    can also hide the subject in the encrypted body of the message so that it only
    becomes readable after decryption.


    # Encrypting in the Mail Client


    If a mail program like Thunderbird encounters an encrypted message, it first identifies
    the key IDs used to encrypt the message and then checks whether there is a secret
    key for decrypting it in the internal keyring. If so, the program prompts the
    user to unlock their own key by entering a password. The mail can then be read
    normally and without any problems and, if required, displayed in the inbox together
    with the subject.


    It makes sense for the mail program to keep the decrypted key in memory for a
    longer period of time, so that it can be used for hours without entering a password.
    The user can thus conveniently and transparently read and edit countless encrypted
    messages without even noticing that the messages are currently being decrypted
    in the background. It is only after a longer period of inactivity or after restarting
    the mail program that the user has to enter the key password again. This approach
    ensures maximum usability but theoretically also harbors the risk that an attacker
    could read the unsecured key from RAM.


    To send an email, on the other hand, the generally known and password-free public
    key of the recipient is used if it exists. If a message is sent to several recipients,
    the emails can be encrypted simultaneously with the keys of all recipients and
    thus opened by all of them without any problems. The only minor disadvantage is
    that experts could identify hidden BCC recipients on the basis of the key they
    now use in the email. By the way, if the sender’s own address is included in the
    distribution list, the copy sent back to the sender is also encrypted by default.


    # Encrypting with Webmail


    Some webmail systems are behind the times in providing comprehensive encryption.
    The Mailvelope browser plugin [7], which is available for Chrome, Edge, and Firefox,
    adds secure OpenPGC communication to webmail. It runs locally in the user’s web
    browser and detects when the provider’s webmailer contains a PGP-encrypted email.
    It then decodes the contained email, exchanges the contents of the web page for
    the unencrypted message, and displays the message.


    Mailvelope can also send encrypted email. Before a message written in plaintext
    is sent on its way, Mailvelope encrypts it locally and only then transmits it
    to the provider’s webmail system. The process seems good at first glance, because


    decoding occurs locally on the user’s computer. However, security experts have
    complained about the implementation of Mailvelope as a browser plugin: it leads
    to the sensitive PGP key material being stored in the browser’s plugin area, which
    cannot be 100 percent protected. In addition, JavaScrip is not considered suitable
    for implementing secure cryptography.


    Implementations such as the Guard system of the Open-XChange groupware solution
    [8] take a somewhat different approach. These solutions store the key securely
    on the provider’s server, and a password entered by the user protects it against
    unauthorized access. The server takes care of encryption and decryption, removing
    the need for a browser plugin. This means that users can access their own mailboxes
    from other computers at any time, even when if they are on the road.


    # Conclusion


    Cyber snoopers are more sophisticated than ever, which means there has never been
    a better time to get familiar with email encryption. However, as this article
    has shown, you can’t just install SSL/TLS or PGP and expect a safety guarantee.
    It pays to consider the details and look closely at what you need to ensure your
    messages remain private.


    Whether trusting your email provider offers you more security, or whether you
    are better off keeping your own key on your private PC, is a matter for every
    user to determine. But either way, in view of the recent gamut of virus and ransomware
    attacks, it pays to be cautious. ###


