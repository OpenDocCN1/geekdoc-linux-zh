  md: '# Encrypt your disks on Linux


    # Unreadable


    Encrypted volumes have long since ceased to be an exception or luxury. Corporate
    policies and compliance rules often demand encryption for critical data. This
    article looks at tools for disk encryption on Linux.


    By Martin Loschwitz


    It’s no coincidence that portable computers have pushed desktop PCs into the background
    over the past 10 years. Today, users only need desktop systems for computationally
    intensive work such as video rendering or games. For everything else, even mid-range
    laptops are now perfectly adequate. But laptops also have one disadvantage: They
    are far easier to steal than a standalone PC. An appropriate insurance policy
    can cushion the cost of replacing the device in case of theft. However, it is
    not so easy to compensate for the loss of data.


    Corporations and users can only protect themselves effectively against this kind
    of horror scenario by completely encrypting the data carriers in the device, from
    USB sticks to external hard drives. How can a Linux user best secure disk data
    by means of encryption? This article describes some leading encryption methods
    and tools for Linux.


    # Cryptsetup with LUKS


    Just about everyone who has ever dealt with encryption on Linux will have come
    across the abbreviation LUKS [1], which stands for Linux Unified Key Setup. The
    LUKS standard describes what disk encryption should look like on Linux (Figure
    1). LUKS is based on the Cryptsetup tool, which in turn uses the Dmrypt kernel
    module of the Linux kernel to manage encrypted volumes.


    At first glance, this sounds considerably more chaotic than it actually is – at
    least if you keep in mind how the Linux kernel has handled block devices and their
    drivers for decades. The block device layer of the kernel resorts to a trick,
    allowing different drivers to be connected in series in order to combine their
    functions.


    Dmrypt forms part of the block device layer. If the administrator instructs the
    device mapper (which includes LVM, for example) to prepend the Dmrypt driver to
    a block device before accessing it, all Dmrypt functions are available for the
    block device. In fact, Dmrypt also implements its own basic encryption. However,
    these measures are not nearly enough to meet today’s requirements in the eyes
    of the kernel developers. Accordingly, they created the LUKS format, which standardizes
    all the functions needed for encryption and defines them as part of a header in
    the partition table. This also means that the definition of encrypted drives on
    Linux is independent of the distribution and vendor.


    # Integrated into the System


    Today, Cryptsetup with LUKS support is included with all distributions. Most manufacturers
    have also integrated the tool directly into their setup routines. You can start
    encrypting when installing the individual directories, such as /home, or you can
    encrypt the entire non-removable disk.


    Once you encrypt the disk, the operating system can no longer boot without the
    password. If you remove the data medium from the device and try to read it, you
    will only see a mess of data. It is unanimously understood that this way of using
    encrypted drives under Linux is by far the most secure approach today. It also
    uses hardware acceleration. If you don’t have an Atom or another low-cost processor
    in the device, the CPU will probably come with built-in hardware support for various
    encryption algorithms.


    Devices connected to the system via USB can also be encrypted with Cryptsetup
    and LUKS – just like a built-in NVMe disk. However, there are differences in the
    setup between the individual distributions, and different desktop environments
    also offer their own tools to operate Cryptsetup and LUKS. If you want to avoid
    an excursion to the command line, you will need to familiarize yourself with your
    system’s defaults.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_15_0.png)


    Figure 1: LUKS, the standard format for encrypted disks on Linux, works across
    distributions. © Suse'
