    the rightmost column in the result after rotating the matrix clockwise by 90 degrees.


    While the algorithm converts rows into columns, the target image''s dimension
    also changes. Cell phone photos are typically rectangular rather than square,
    and a photo rotated 90 degrees not only changes its pixel values but also swaps
    the width and height of the resulting overall image. Listing 4 accounts for this
