  md: "# Linux Voice | FossPicks\n\n# ### Terminal news\n\n# Broadsheet\n\nThe amount\
    \ of news that’s being generated has become overwhelming, regardless of how you\
    \ feel about current events. We’ve all become “doom scrollers,” incessantly skipping\
    \ from one story to the next like unrestrained information addicts. There aren’t\
    \ many good solutions to this problem. The curated content that you find in magazines\
    \ like this can help, especially if that means getting away from the screen. Subscribing\
    \ to an RSS feed is another possible solution because it lets you purposefully\
    \ follow updates from a specific source and filter those updates from your own\
    \ client. But RSS has been in decline for years, and many general news sources\
    \ have a vested interest in not supporting it – making you visit their sites,\
