  md: "![](img/8286bf901ba268fe114d66ada92d1dd6_58_0.png)\n\nshared a common codebase.\
    \ Even today, enough code remains the same that extensions that run with one often\
    \ run with the other's releases, although less often than a decade ago. No doubt\
    \ the mutual use of Open Document Format (ODF) for files contributes to continued\
    \ compatibility. However, the differences do seem to be growing — mostly due to\
    \ LibreOffice's innovations. The difference can be seen in the download sizes:\
    \ LibreOffice's DEB download file is 195MB, while OpenOffice's is 159MB. In other\
    \ words, LibreOffice is close to one quarter larger, despite the fact that it\
    \ has removed redundancies in the code and rewritten parts for greater efficiency;\
    \ operations that OpenOffice has yet to duplicate.\n\nAbout eight years ago, I\
    \ saw a copy of a LibreOffice internal document that listed all the OpenOffice\
    \ features that OpenOffice lacked. To my surprise, there were hundreds of line\
    \ items. Even though many were minor, the differences are far too numerous to\
    \ list, let alone to explain each one. However, among the more significant features,\
    \ LibreOffice included an extensive overhaul of the interface, rearranging menu\
    \ items, repositioning items in windows to make them more accessible, adding themes,\
    \ and in general creating a more user-friendly look. These changes are especially\
    \ noticeable in the Charts subsystem for spreadsheets, where the col-ors were\
    \ updated from OpenOffice.org's stuck-in-the-1990s look. In addition, LibreOffice\
    \ introduced themes and a choice of user interfaces that includes an MS Office-like\
    \ ribbon toolbar. None of these changes have any equivalent in OpenOffice.\n\n\
    LibreOffice's new features are visible in all the modules, especially Writer and\
    \ Calc. But in the interests of space, I will let Writer stand as an illustration\
    \ of the others. Outstanding features in LibreOffice Writer that have no counterpart\
    \ in OpenOffice are:\n\n+   - The folding of Table Design into the other styles,\
    \ where it is easy to find and can be copied over into other files.\n+   - Default\
    \ list styles with choices of bul-let and numbering systems, saving users the\
    \ need to set them up.\n+   - Export to EPUB format (this feature is still being\
    \ fully implemented, although it is often usable now).\n\n+   - Support for HarfBuzz,\
    \ a font-rendering app that allows the modification of OpenType and True Type\
    \ files through a series of codes added in character fields, making LibreOffice\
    \ a full-fledged desktop publisher.\n+   \n+   However, for many users, the most\
    \ im-portant improvements in LibreOffice Writer are the continued enhancements\
    \ for exporting to MS Word. This effort can be a moving target because Micro-soft\
    \ often alters its formats, but reliable import filters to MS Word are essential\
    \ to many companies' adoption of Libre-Office. Much of this work is due to Li-breOffice's\
    \ strategic alliance with Col-labora, which builds compatibility so-lutions for\
    \ its customers and donates its improvements to LibreOffice, con-tributing over\
    \ a third of LibreOffice's commits in 2019. In the recent 7.3 re-leases, the MS\
    \ Word import and export filters are at a stage where most routine business and\
    \ academic documents can be reliably exchanged with those not using LibreOffice.\
    \ By contrast, OpenOf-fice's MS Word compatibility is much more erratic.\n\n#\
    \ The Latest Releases\n\nFor still another perspective, you have only to look\
    \ at the latest release notes. On November 27, 2021, OpenOffice an-nounced the\
    \ release of OpenOffice 4.1.11 [5]. The complete list of improved or en-hanced\
    \ features for this release is:\n\n+   - Enabled persistent adjustment to help\
    \ text font size.\n+   - Added Fontwork to Insert menu.\n+   - Added missing PDF\
    \ export icon to File menu.\n\nIn addition, two bugs fixes were thought worthy\
    \ of mention:\n\n+   - New security warning introduced with Apache OpenOffice\
    \ 4.1.10 blocks use-ful functions.\n+   - The Windows installation file has missing\
    \ properties and lacks a code signature.\n+   - Windows installation: Lost adapted\
    \ texts after switch to NIS 3.x.\n+   - Chart lost when saving in ODS format.\
    \ Furthermore, no new or updated diction-aries or languages were added.\n\nIn\
    \ comparison, the release notes for Li-breOffice 7.3 [6], announced February 2,\
    \ 2022, included so many new features and improvements that a complete list would\
    \ be too long to include here."
