- pgno: 38
  md: '![](img/8286bf901ba268fe114d66ada92d1dd6_38_0.png)


    bus, VCA, or folder track – this takes some time getting used to. From my point
    of view, this artificial separation of track types in other DAWs only causes unnecessary
    worries anyway. Frequently assignable track and item colors, track icons, and
    names give users a clear overview. There are also no separate areas for audio,
    MIDI, or instrument plugins in the mixer’s respective plugin slots.


    An item can be an audio or MIDI event that can be provided with item effects (FX).
    This way, you don’t have to link effects to tracks as track FX, although you can
    if necessary. Once you get used to item FX, you won’t want to do without it. Also,
    each item has its own volume setting, in addition to automation (Figure 2).


    Reaper’s resource consumption is comparatively low. When installed, Reaper occupies
    hardly more than 100MB; you can also set up a portable installation on a USB stick
    as a mobile DAW if required. When running, Reaper also consumes less RAM and CPU
    power than its competitors – which is definitely due in part to the no-frills
    interface. Plugins can also optionally be run as separate processes. If you are
    experimenting or using alpha versions, a buggy plugin won’t take the entire DAW
    down with it.


    All of this makes Reaper an excellent DAW for less powerful hardware or older
    systems. Even a 15-year-old laptop can easily handle less challenging audio work.
    The Linux CPU architecture choices include x86-64, i686, AArch64 (ARM64), and
    Arm7l (ARM32). Reaper even runs on a


    Raspberry Pi 4, with some limitations due to the lack of compute power. Multitrack
    recording works better than overdubbing with real-time monitoring.


    # Operation


    You control Reaper in the usual way with single clicks. Alternatively, you can
    improve the workflow experience with the “new” methods like drag and drop. To
    do this, hold down the left mouse button and simply drag the mouse pointer over
    the corresponding controls. You can enable Solo, Mute, and Record Ready in the
    Editor or Mixer, while you can fade tracks in and out in the Track Manager (Ctrl
    + Shift + M). You can quickly set sends to the buses in the Routing Matrix (Alt
    + M). Tracks that are selected together can also be controlled simultaneously,
    for example, using the volume or pan controls. In the end, this leaves you with
    more time for the creative process.


    Reaper either launches directly into the last project, displays a selection box,
    or loads a new project. For a new project, the DAW records the tracks directly
    in a temporary directory. When you save, Reaper then dumps or copies the files
    into the desired directory. It is no problem to drag audio files with a 44.1 or
    48 kHz sample rate into a project that is defined for some other setting – Reaper
    resamples on the fly in the background.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_38_1.png)'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'You can use modifier keys to make operations even faster. Other DAWs also use
    Shift, Alt, or Ctrl. Reaper, however, is more consistent and assists at least
    one additional function to each control element, often even two or three. One
    of my favorites is Alt plus a left-click to delete markers, FX plugins, or automation
    points and enable the eraser in the MIDI Editor. Ctrl temporarily enables the
    pencil and draws empty MIDI items in the editor, manual curves in the automation
    tracks, or changes the velocity in one fell swoop in the MIDI Editor.


    Right-click also offers a context menu for virtually all functions that are otherwise
    hidden in the menubar. Controls such as the play button, solo button, or toolbar
    buttons you can choose from a number of additional functions. In this sense, the
    motto for getting started is: Just try everything out and be surprised at what
    happens.


    Reaper also has a very clever solution for tempo changes. An item’s playback rate
    can be set manually in the item preferences by double-clicking or by pressing
    F2. Alt plus a left-click at the edge of an item lets you smoothly stretch or
    compress the item. Depending on the ‘magnet function’ s setting in the standard
    toolbar in the upper left corner, the item is then glued to the visible grid,
    which can be temporarily deactivated via the


    Shift key if required. Once again, freedom of choice is paramount here.


    # Themes


    Reaper gives users the ability to develop entirely bespoke themes, providing a
    playground for people who enjoy designing their own desktops. The default interface
    is good and consistently usable, but unspectacular. Depending on your needs, you
    can either develop your own themes from scratch or use existing themes provided
    by Reaper users (Figure 4). Instructions for building your own themes can be found
    on Reaper Forums as a pinned post in the themes section. On the Reaper homepage,
    the Slash link takes you to a repository [3] where you can exchange other relevant
    goodies besides themes.


    Some developers also offer their themes for sale via the forum. Some take wholly
    individual approaches, but they are also replicas of Pro Tools, Logic Pro, or,
    in the case of the House of White Imperial [4] theme, a replica of an analog mixing
    desk (Figure 5). The Star Trek terminals look utterly wild. Ultimately, you have
    to decide for yourself if these themes are useful in everyday life.


    Three themes are pre-installed: Default, Reaper 1, and Reaper 5 (Figure 6). You
    can select one of these in the menubar below Options | Themes. New themes are


    delivered in the .Reaper ThemeZip format (a renamed ZIP file with a defined folder
    structure). To install, simply drag and drop the file into an active Reaper window
    or simply double-click on it in the file manager.


    In the menubar under Options | Layouts, you’ll also find alternative views for
    the mixer and editor, such as wider channel strips in the mixer, metering only,
    and fader only – whatever the theme developer wants is allowed here, too. The
    integrated screenshots tool lets you store your own presets for recording, mixing,
    mastering, or other applications and call them up again as needed using a keyboard
    shortcut.


    # Actions


    One the most important terms for Reaper newcomers is "actions." Everything in
    Reaper is an action: cutting audio, zooming, creating MIDI notes, copying elements,
    moving faders, switching tracks to record ready, and loading plugins. All actions
    can be assigned their own key combinations and combined as desired with custom
    actions or macros.


    The Action List (Figure 7) can be opened via Actions | Action List or by pressing
    the f key. A search box then helps you find actions and view, modify, and delete
    existing shortcuts, as well as create new ones using the Add button


    ![](img/8286bf901ba268fe114d66ada92d1dd6_39_0.png)'
