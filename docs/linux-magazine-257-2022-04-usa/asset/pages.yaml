    09  )

    10

    11  func main() {

    12    flag.Usage = func() {

    13      fmt.Printf("Usage: %s jpg-file\n", path.Base(os.Args[0]))

    14      os.Exit(1)

    15    }

    16

    17    flag.Parse()

    18    if len(flag.Args()) != 1 {

    19      flag.Usage()

    20    }

    21

    22    jpgFile := flag.Arg(0)

    23

    24    f, err := os.Open(jpgFile)

    25    if err != nil {

    26      panic(err)

