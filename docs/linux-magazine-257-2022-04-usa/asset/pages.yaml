    \ diagrams. Line 11 declares that there must be five labels (the length of the\
    \ **supherho_1 array**), located at equal intervals along the entire circumference\
    \ (which is long pi times two), and line 19 says that the labels to place in those\
    \ locations are in the **categories** array. Lines 15-17 add three distinct lines.\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_92_1.png)\n\n# Listing 10: Sankey Diagram\n\
