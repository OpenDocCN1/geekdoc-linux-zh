    \ntuxedocomputers.com\n\n# BEHIND THE NEAREST CLOUD\n\nDear Reader,\n\nWe in the\
    \ Linux community are steeped in the conventional wisdom that Linux is much more\
    \ secure than Windows. It is, of course, and it always has been, but then, that\
