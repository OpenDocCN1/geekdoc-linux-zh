    ## 公共资金


    ### 公共代码


    ![](img/8286bf901ba268fe114d66ada92d1dd6_73_0.png)


    用自由软件现代化公共基础设施


    fsfe 欧洲自由软件基金会

    了解更多：[https://publiccode.eu/](https://publiccode.eu/)


    ## MADD OG 的狗屋


    ![](img/8286bf901ba268fe114d66ada92d1dd6_74_0.png)


    乔恩 “Maddog” 霍尔（Jon "maddog" Hall）是一位作者、教育工作者、计算机科学家和自由软件先驱。自 1994 年他首次会见林纳斯·托瓦兹（Linus
    Torvalds）并促成 Linux 移植到 64 位系统以来，他一直是 Linux 的热情倡导者。他目前担任 Linux International® 的主席。


    ### 封闭式物联网设备可能使用意外的带宽进行“回家汇报”，这表明我们需要自由设备，以便用户能更多地控制其家用小工具和 WiFi 使用。


    作者：乔恩 “MADDOG” 霍尔


    ### 释放家庭物联网和 WiFi


    最近，我将家庭互联网升级到了光纤和 1Gbps 对称服务，因此理论上我可以从服务提供商那里获得 1Gbps 的上行和下行通信速度。


    对大多数人来说，这意味着一种思维模式：“我可以从我的笔记本电脑/台式机/手机上以 1Gbps 的速度移动数据”，但这可能与事实相去甚远。


    由于通信开销，即使在最理想的情况下，你的吞吐量也会有 5% 到 10% 的损失。因此，即使使用 4 英尺长的 Cat 6 网线硬连接到你的 WiFi 路由器的
    LAN 端口，你看到的实际数据吞吐量可能只有 995Mbps 到 990Mbps。


    考虑到 WiFi 通常会更慢，而且另一端服务器也会影响数据速度，我和我的伴侣使用了光纤提供商的速度测试。我们预计他们使用了服务器（或在他们那一端生成比特流）以获得尽可能快的测试速度。


    我和我的伴侣测得通过路由器的下载速度为 990Mbps，但上传速度明显较差，仅为 500Mbps，这造成了暂时的困惑。


    幸运的是，我的提供商提供了一个有趣的应用程序，它可以跟踪与每个设备相关的每个硬件地址的比特流量。因此，我可以看到每个设备每天、每周和每个月上传和下载了多少字节。


    通过这种方式，我们可以看到有些设备正在上传数据，进行安排在深夜的数据备份。我们还可以看到数据是如何分配给许多人们可能未曾考虑过的其他源的。在我们的情况下，是一个灯泡。


    我们使用许多 WiFi 设备来控制我们的家。WiFi 控制扬声器、用于视频广播的 ChromeCast 等，但当时我们在测试速度时这些设备都是“关闭”的。我们未曾预料到的是，一个
    WiFi 控制灯泡，在 24 小时周期内通常开关一次，可能每天会下载 14.41MB 的数据并上传 5.93MB 的数据。哇。我可能能理解这 14.41MB
    的下载是用于固件更新……但每天都这样（平均而言）？而且仅仅为了做什么就上传了近 6MB？向某个实体报告灯泡确实照亮了房间……或者没有？


    我们家中只有这样一个灯泡，但我们有一系列 WiFi 电动插座。每一个都有类似的上传和下载流量。


    我们的互联网提供商指出，“拥有许多这类设备的家庭（许多家庭拥有数十个这样的设备）可能会体验到低于最佳的下载和上传速度。” 废话。这一切都影响了互联网用户看到的速度。这还没有考虑到房屋内所有其他
    WiFi 使用被这些数据包共享 WiFi 的情况，这些数据包仅由路由器本身处理，但会占用其他 WiFi 使用的带宽。


    所有这些汇聚成了一些朋友之间关于对称互联网速度、物联网（IoT）讨论以及这些设备即使在“关闭”时如何使用电力和互联网的对话。


    这些设备中的许多都在将它们的通信全部发送回创建它们的公司。如果这些设备有一个集中的“服务器”单元来处理许多这类数据，即“边缘编程”，将原始数据压缩并将固件更新分发到使用相同互联网子网的所有设备，那会更好。


    如果这些设备还使用不同的频率（也许包括新兴的 60GHz WiFi）那就太好了，或者也许我需要花更多时间设置路由器和互联网的服务质量（QoS）。毕竟，如果开灯或关灯多花了一小部分秒钟，可能不会有太大区别。


    我的一位朋友说，他们将所有这些设备隔离在单独的网络上，阻止它们“回家汇报”。如果设备停止工作，他们就丢弃设备。当然，他们不仅损失了为设备支付的钱，还失去了设备的服务。


    尽管多年来我一直是一个自由和开源软件的倡导者，但我之前对这些物联网设备持较为放松的态度，但在接下来的年里，我将翻新我住了 40 年的房子，花上一大笔钱，其中一部分将只用于购买“自由”物联网设备。这可能还包括购买重要家电。


    遗憾的是，封闭式设备的制造商将无法收到我的钱，以及许多抱有相同想法的人的钱。 ■■


    ## 简化 Ubuntu 上的 NVIDIA 驱动安装


    ### 让 NVIDIA 驱动安装变得简单


    一种基于终端的解决方案有助于缓解安装 NVIDIA 驱动程序的挫败感。


    作者：亚当·迪克斯（ADAM DIX）


    Linux 上的专有 NVIDIA [1] 驱动是一种必要的恶。即使是坚定的开源倡导者也会不时发现它们的用例。无论是用于游戏、挖矿还是其他硬件加速任务，绿色巨头将在这里留下来，无论是好事还是坏事，并且似乎全心全意地反对全面转向开源。与
    AMD [2] 的驱动支持——在 Linux 上非常棒，我相信你们大多数人都已经知道了——不同，NVIDIA 似乎不愿意好好配合。人们不禁好奇，他们是否觉得自己根本不需要这样做，他们对市场的影响力使他们与众不同，并免除了他们对客户应有的责任感，而其他玩家则有这种责任感。谁知道呢。我知道的是，尽管社区中许多人努力工作，NVIDIA
    的 Linux 驱动支持仍然让人头疼。最糟糕的是，这对 Linux 初学者产生的影响：他们听说了关于 Linux 的所有美好事物并尝试它，结果系统要么被 Nouveau
    驱动拖累，要么必须经历我下面即将讨论的事情。这是一种令人遗憾的状态，有一个明显且显而易见的解决方案，我担心我们很快看不到它实现。


    虽然不一定一切都好，但也并不全坏。至少我们有一种（尽管是专有的）解决方案可以依赖。


    这里我将专注于 Ubuntu [3]，因为这是我通常使用的基于 Linux 的简单安装环境，无论我需要做什么，而且由于统计上这是初学者最可能首先尝试的。虽然我最初使用的是
    Red Hat [4]（Fedora [5] 之前），但现在大多数人倾向于使用 Ubuntu，它的衍生版，或者第一次尝试时可能是另一个 Debian 衍生版。


    虽然 Ubuntu 本身有一个驱动程序安装部分，但并非所有 Ubuntu 衍生版都有，并且在某些情况下，即使你的发行版有一个高级驱动安装部分，也可能很难找到，尤其是对初学者来说。此外，关于安装哪一组包以及你想使用的
    NVIDIA 专有驱动的版本，也可能存在混淆。我个人还发现，通常在选择一个驱动并点击应用后，窗口变得无响应，或者至少看起来是这样。虽然基本的开源 Nouveau
    [6] Linux 驱动对于大多数任务来说都足够好，但硬核用户通常会发现需要专有驱动。虽然我不能修复 NVIDIA 在专有驱动程序包安装中提供的极其过时的控制面板界面，但我可以帮助你安装它，并指导你如何处理安装不可避免地损坏时的情况。


    在这篇文章中，我将向你展示如何使用 Ubuntu Linux 及其衍生版中简单、内置的命令来确定使用哪个图形驱动程序，我发现这比打开等效的 GUI 更快更简单。我还会向你展示如何处理之后你几乎肯定会遇到的黑屏问题。你看，就像一个
    YouTuber 第一次尝试在 Pop_OS [8] 上安装 Steam [7] 一样，我也在使用 GUI 安装 NVIDIA 驱动程序时遇到了困难。然而，与典型的
    YouTuber [9] 不同，我在终端执行相同任务时没有任何问题。


    需要注意的是，NVIDIA 专有驱动可能存在不止一个包，你可能需要测试几个不同的驱动程序包，才能确定哪一个最适合你。此外，具有 Optimus [10] 功能的设备在
    Optimus 切换方面可能无法正常运作。对于不知道、不记得或在那个时代不在场的人来说，Optimus 是 NVIDIA 和 Intel [11] 的一种软件方案，旨在允许用户在操作系统内部自由选择
    NVIDIA 或 Intel 图形。虽然来自 system76 等公司的软件包确实使 Optimus 比其最初推出时更强大，并且在许多情况下完全功能正常，但仍有


    ![](img/8286bf901ba268fe114d66ada92d1dd6_75_0.png)


    > **作者简介**

    >

    > 亚当·迪克斯（Adam Dix）是一位机械工程师和 Linux 爱好者，在销售和市场营销领域玩弄一番后，伪装成英语教师。你可以在 EdUbudge Linux
    网站 https://www.edubudgie.com 上查看他的一些 Linux 作品。


