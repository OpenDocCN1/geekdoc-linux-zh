    # 密码学与可证明安全


    理想情况下，你希望防御所有类型的对手，并依赖尽可能好的安全保障。然而，安全并非免费，更强的安全保证往往意味着更低的效率。效率低的系统通常不会在实际中被采用。


    ### 步骤 3：使用通用过程实现功能


    此步骤涉及基本的密码学构建模块，例如私钥加密、消息认证码、哈希函数或签名方案。定义通用过程有助于你理解底层构建模块的哪些安全属性被用来实现新系统的特定安全属性。


    设计必须独立于特定过程，因为总是有可能某些具体过程会被攻破。例如，研究人员最近发现了针对 SHA-1 哈希函数的首批攻击。因为个别组件被攻破而开发一个全新的系统成本太高。此外，个别实例的不安全性并不改变该概念本身是安全这一事实。为了说明这一点，只需简要思考一下防火保护的例子。仅仅因为某扇门的材料证明不具备防火性，并不意味着在特定位置预设立防火门的整体策略是错误的。


    ### 步骤 4：安全性的正式数学证明


    在对安全属性和设计进行正式规范之后，第四步将进行安全性的正式数学证明。此步骤确认设计满足所需的安全属性。形式化证明在底层密码学构建模块的安全属性与系统旨在实现的安全属性之间建立了一对一映射。形式化验证安全性会发现设计缺陷。如果底层密码学构建模块的安全属性未被应用，则设计存在缺陷，且很可能存在更高效的解决方案。


    ### 步骤 5：实例化实现


    一旦系统的安全性得到正式确立，就需要用特定的密码学过程来实例化通用的密码学构建模块。例如，引入了使用私钥的通用加密模式，并且在实践中该构建模块使用 AES
    实现。由于通用构建模块处理的是抽象对象（例如“私钥”或“密文”），你需要将这些对象转换为具体实例。例如，对象“公钥加密方案”通过 ElGamal 加密方案进行实例化
    [2]。


    ### 步骤 6：实施的安全分析


    第六步也是最后一步要求对具体实例化进行安全评估。这是必需的，因为从抽象描述过渡到具体实现存在许多陷阱。例如，用于互联网协议安全（IPsec）的基本密码学元素，即所谓的“先加密后计算消息认证码”（encrypt-then-MAC）是一种弱安全性的认证加密方案
    [3]，它被认为对选定明文攻击（CPA）[4] 是安全的，并且在加密方案对 CPA 安全且消息认证码（MAC）不能被伪造的前提下，它也抵抗伪造。然而，例如在
    IPsec 中使用的那个具体实例化被发现是不安全的。实施的安全性也可以通过渗透测试来证明，这些测试揭示了安全概念实施中的弱点，这些弱点可能允许攻击者渗透系统。


    ### 示例：安全电子邮件


    为了说明可证明安全软件开发的原则，考虑加密电子邮件消息的例子（图 2）。在这种情况下，Alice 想要向 Bob 发送一条加密消息。Bob 需要能够解密邮件并验证签名。


    Alice 拥有 Bob 的公钥 $pk_B$。为了简化起见，我假设 Alice 已验证了该密钥并确保了它是 Bob 的。此外，Alice 拥有她自己的私钥
    $sk_A$。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_28_0.png)


    ![](img/8286bf901ba268fe114d66ada92d1dd6_28_1.png)


    类似地，Bob 知道 Alice 的公钥 $pk_A$ 并拥有他自己的私钥 $sk_B$。在这种情况下，我也假设 Bob 已验证了密钥 $pk_A$ 的真实性。


    第一步是规范功能。在这种情况下，我们处理的是认证电子邮件；因此，我有两个任务：首先，我需要计算一个加密且经过认证的密文。该接口被标记为 *Enc + Auth*。第二
    – 假设认证有效 – 加密的电子邮件必须被解密。遵循相同的模式，我将此接口称为 *Verify + Dec*。


    第二步是确定（相当简单的）安全属性。攻击者知道 Alice 和 Bob 的公钥以及上述所有所需信息。尽管如此，攻击者必须无法从电子邮件中获取信息。此外，攻击者必须无法代表
    Alice 向 Bob 发送电子邮件（即，使用 $pk_A$ 公钥验证的消息）。


    虽然这些功能在直觉层面上似乎合理，但它们仍留有太大的解释空间。攻击者能与 Bob 交互吗？是否存在一个学习阶段，在该阶段允许攻击者使用 Alice 作为接口将加密且经过认证的电子邮件从
    Alice 转发给 Bob？攻击者是否被允许冒充 Bob 并在一段时间内阅读加密电子邮件？发给 Bob 的消息是如何生成的？在安全属性的形式化描述中，消除这些歧义至关重要，以得出精确且无歧义的描述。


    在形式化接口和安全属性之后，第三步是使用密码学方法实例化各个组件。两个接口 *Enc + Auth* 和 *Verify + Dec* 需要用密码学过程构建，以提供确切所需的功能。对于安全电子邮件，这一步相对简单（图
    3）。


    为了实现 *Enc + Auth* 接口，你首先需要使用权公钥方法加密消息，然后使用数字签名方法对密文进行签名。我将使用 *c* 表示密文，用小写希腊字母
    sigma（$\sigma$）表示签名。据此，你使用以下操作实现 *Verify + Dec* 接口。首先，使用签名过程的验证算法检查密文 *c* 上的签名的有效性。如果该签名有效，则使用公钥过程的解密算法解密密文
    *c* 并输出得到的消息 *m*。


    在安全验证中，我可以在第四步假设加密方法和签名方法都是根据形式化定义是安全的。然后形式化验证，根据形式模型，任何破坏 *Enc + Auth* 以及 *Verify
    + Dec* 安全的攻击都可被用来破坏公钥过程和签名过程的安全性。然而，由于在第一步骤中假设了两个过程都是安全的，因此产生矛盾，由此推断出这样的攻击不可能存在。


    在最后两个步骤中，你现在使用具体的过程，例如基于 RSA 的加密，实现它们，并通过渗透测试证明实施的安全性。


    ## 优势与局限


    自从 El Gamal 被发现以来，诸如 El Gamal 加密 [4] 等可证明安全的密码学方法几乎不可破解。可证明安全性将加密方法的证明简化为一个简单的计算问题，例如众所周知的因子分解问题。


    在该问题中，攻击者被给定一个数 $N = p \times q$，它被计算为两个等长素数 *p* 和 *q* 的乘积。攻击者的任务现在是计算两个素因子 *p*
    和 *q*。迄今为止，尚未发现针对这个著名计算问题的有效求解算法。


    加密方法的安全性现在基于因子分解问题，而形式化证明显示了以下内容：如果存在一个高效的攻击者打破了加密方案，那么也存在一个高效的攻击者解决了因子分解问题。换句话说，破解加密的问题与因子分解问题同样难以解决。


    乍一看，“可证明安全”这一术语暗示不再存在任何可证明的攻击。然而，事实并非如此。针对*据称*可证明安全的系统的攻击反复发生。这种矛盾从何而来，又如何解决？首先，重要的是要注意，证明的安全性总是指形式化模型。然而，如果模型没有真实地反映实践，那么它就无法排除潜在的攻击，因为这些攻击根本不会出现在模型中。因此，准确建模现实是该领域最大的挑战之一，甚至建模中的最小错误也可能导致不安全的解决方案。


    安全套接字层（SSL）协议的安全性是不完整建模的一个绝佳例子。在实践中，可能出现一条消息未被解密的情况；取而代之的是一个 *Padding Error* 消息。乍一看，这看起来无害，因为它似乎不会泄露关于明文的任何直接信息。这就是为什么它没有被包含在形式化模型中。然而，细看之下，研究人员能够表明可以利用此错误消息来解密完整消息
    – 并且无需破坏加密方案的实际安全性即可做到。


    ## 典型错误


    信息安全领域有一句广为流传的箴言：你绝不应开发自己的密码学方法。但你在什么时候构建自己的过程呢？事实上，这句箴言在很多地方都显得不足，而应该改为：“除非你能证明你在做什么，否则绝不要使用密码学过程。”下面的例子表明，这一陈述绝不夸张，甚至简单地使用两种密码学过程都可能导致完全不安全的构建。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_29_0.png)


