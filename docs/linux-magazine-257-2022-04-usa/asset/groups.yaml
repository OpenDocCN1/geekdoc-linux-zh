    # NVIDIA 驱动安装


    根据我的经验，出现的问题往往是驱动程序本身的缺陷。不过，这不应妨碍您尝试针对您特定的 NVIDIA 显卡和 Intel 核显组合寻找市面上不同的软件包。然而，Optimus
    技术本身并不是本文打算深入探讨的内容。本文概述的所有操作均在一台搭载入门级 NVIDIA GeForce GT 710 显卡的 Supermicro X8STi
    主板上完成，该显卡插在单个 PCIe X16 插槽中。（我曾在配有 NVS 5200M 和 Intel 核显的戴尔 E6430 笔记本电脑上执行过相同的操作，并且过去确实成功启用过
    Optimus；但同样出于前述原因，本文并不打算对此进行详细讲解。）如果您的机器同时拥有 NVIDIA 和 Intel 显卡，我的建议是简单安装 NVIDIA
    驱动并直接使用 NVIDIA 显卡。对我来说，让 Optimus 正常工作并没有带来优势，因为电池已经关闭，而且为了性能，在那台机器上全天候运行 NVIDIA
    显卡更为划算，尽管这会加速电量消耗。接下来，我们将了解如何查找并安装正确的驱动，并处理可能出现的后续问题。


    ## 确定系统组件信息


    当机器启动并运行后，您可以通过运行以下命令来检查当前使用的驱动：


    ```

    lspci -vv

    ```


    ![](img/8286bf901ba268fe114d66ada92d1dd6_76_0.png)


    这将显示所有 PCI 设备的详细信息（图 1）。向下滚动一点，您会看到一个被列为“VGA 兼容控制器：NVIDIA Corporation GK208B [GeForce
    GT 710]”的条目，这里显示的是您显卡的具体型号，显然不是 GT 710。查看该条目的最后两行，您会看到“正在使用的内核驱动”和“内核模块”。在这里，您会看到
    nouveau 被列为正在使用的内核驱动，如前所述，它是基本的开源 NVIDIA 驱动。如果您运行的是 Pop!_OS 或预装了专有 NVIDIA 驱动程序的类似发行版，那么在“正在使用的内核驱动”下可能会看到
    nvidia，如果是这种情况，本文可能不适合您，但大多数人很可能会看到 nouveau。顺便提一下，在“Capabilities”之后您会看到“access
    denied”。要查看此字段，只需使用 sudo 运行相同的命令，您就能访问该信息。这将提供一些额外的信息，例如电源管理，但这对于我们当前的操作并非必需。


    这需要几秒钟，具体取决于您的系统。对我来说，通常大约 15 秒就能返回完整响应（图 2），所以请在此保持耐心。我的设置返回了以下内容：


    ![](img/8286bf901ba268fe114d66ada92d1dd6_76_1.png)


    ## 查找可用的驱动软件包


    此时，您已经确认显卡被识别并且正在使用开源驱动。若要查看可用的专有 NVIDIA 驱动软件包，您需要运行以下命令。


    ```

    ubuntu-drivers devices

    ```


    ![](img/8286bf901ba268fe114d66ada92d1dd6_77_0.png)


    ### 图 3：apt list 命令的终端输出。


    如您所见，除了 Nouveau 开源驱动外，NVIDIA 提供了多个可用软件包。您可以通过运行以下命令来二次检查您的系统是否安装了任何 NVIDIA 软件包：


    ```

    $ apt list \*nvidia\* --installed

    ```


    如果您已安装其中任何一个，它们将与运行所需且已存在于您系统中的依赖项一起列出，例如库和设置对话框软件包（图 3）。


    正是在这里，事情有时会变得稍微棘手。虽然所有这些软件包都适用于您的显卡，但并非所有软件包都能良好、正确或根本不能与您的特定显卡配合使用。鉴于此，您现在应该将所有需要保存的内容备份到安全的地方以及另一台机器、外部驱动器、云存储，或者（更好的是）以上所有方式。就我个人而言，我知道我的
    GT 710 运行最佳的是 nvidia-driver-390，但坦率地说，我只是通过反复试错才知道这一点的。关于这些软件包的文档很完善，您可以访问 NVIDIA
    网站获取更多信息 [1]。个人而言，我是通过艰难的方式学会的：尝试一个软件包，失败时卸载，再尝试另一个软件包，如此反复。因此，我想在此给出一点免责声明：如果您安装了其中一个软件包并重启后遇到黑屏或显示器的其他问题，请保持耐心，不要立即惊慌。


    ## 设备驱动安装


    要安装您想要尝试的软件包，只需运行：


    ```

    $ sudo apt update

    $ sudo apt install nvidia-driver-390

    ```


    并将 nvidia-driver-390 替换为您特定 GPU 所需的软件包。在此使用终端的优势在于您可以轻松看到正在发生的事情，而使用图形界面（GUI）往往让人困惑。安装完成且所有依赖项均已安装后，您需要重启机器，以便在启动时加载新软件。如果运气好，您将像往常一样看到登录屏幕或桌面。然后，您可以通过使用之前讨论过的
    lspci -vv 命令，或打开设置并查看“关于”部分来检查安装是否成功，以查看“图形”一栏列出的内容。在我的情况下，显示为 GeForce GT 710/
    PCIe/SS2，而对应的是 nvidia-driver-390 软件包。如前所述，使用 lspci -vv 将在“正在使用的内核驱动”部分显示 nvidia。您还将安装
    NVIDIA 控制面板，用于通过图形界面更改设置的细节。


    ## 故障排除和问题解决


    如果您看到的不是图形界面，而是空白屏幕，那么很可能该软件包实际上并不适合您的 GPU，需要将其移除。但请先不要恐慌。这也是一个相当简单且直接的过程。重启，并在
    GRUB 加载屏幕处，不要选择正常启动进入 Ubuntu，而是选择“Ubuntu Advanced Options”（Ubuntu 高级选项），然后选择“Ubuntu,
    with Linux… (recovery mode)”选项。其中的省略号（…）将显示您正在运行的内核，您可以在此选择最新的内核。请务必选择恢复模式选项（recovery）。


    进入恢复模式后，您需要选择 root，其描述为“Drop to root shell prompt”（转到 root shell 提示符）。这将启动到一个命令行界面，从这里您可以移除有问题的软件包。运行以下命令以查找安装了哪些
    NVIDIA 软件包：


    ```

    $ apt list \*nvidia\* --installed

    ```


    一旦您查看了存在的软件包，就可以按以下顺序使用这两个命令来移除 NVIDIA 软件包。首先使用：


    ```

    $ apt remove nvidia-driver-390 nvidia-settings nvidia-prime nvidia-dkms ... 等等

    ```


    您会有很多 NVIDIA 软件包，在驱动软件包本身后以空格分隔列出所有名称将移除所有这些。这将消除依赖项和库，以便在尝试下一个选项时，您是从一张白纸开始的。在上面的示例中，我列出了运行
    `ls` 命令时出现的一些软件包，但总共大约有 20 或 22 个。完成此操作后，您可以通过运行相同命令但用 `purge` 替换 `remove` 来最终完成卸载，例如：


    ```

    $ apt purge nvidia-driver-390 nvidia-settings nvidia-prime nvidia-dkms ... 等等

    ```


    这将清除在软件包移除后可能仍然残留的任何设置和配置。在所有操作完成后，您也可以使用以下命令进行快速清理。


    ```

    $ apt autoremove

    ```


    以确保尽可能移除所有可移除的内容。


    完成后，只需输入 **reboot** 并按 Enter 键重启系统。此时您应该看到 *nouveau* 驱动已加载并运行，取代了专有 NVIDIA 驱动。现在，您可以通过像之前那样列出并安装来尝试不同的驱动软件包，我建议尝试下一个可用的较低版本号。根据我的经验，我在安装
    NVIDIA 驱动时遇到的大多数问题源于我的旧显卡在新驱动中不受良好支持，尽管这些新驱动在查询时会显示出来。依次尝试较旧的可获得软件包可以确保我有适合我的显卡且能无问题运行的最新软件包集合。


    ## 结语


    我无法表达作为初学者在安装其中一个驱动仅结果重启后出现空白屏幕时感受到的沮丧程度。那时，我的解决方案是完全重新安装操作系统，在那时我会尝试使用带有缺陷的开源驱动软件包，或者转向不同的
    NVIDIA 驱动并祈祷获得更好的结果。是的，我仅为了找到一个可用的驱动软件包就重新安装了 Ubuntu 四次以上。这正是我认为不仅要熟悉终端和使用恢复模式，还要稍微了解底层发生的事情的原因。现在，我有一种恢复失败的方法，并且拥有


    ![](img/8286bf901ba268fe114d66ada92d1dd6_78_0.png)


    将系统恢复到正常工作桌面的信心，我可以说我发现使用终端完成整个过程更容易、更快。在我看来，这里额外的益处是，您实际上可以看到终端中正在发生的事情，而不是像使用等效的
    GUI 那样等待、猜测并希望（图 4）。


    希望有一天，我们将看到 NVIDIA 团队与我们心爱的开源社区合作，提供一种非专有的解决方案，具备现有闭源驱动所提供的性能和优势。在那之前，恐怕我们不得不忍受这些麻烦。不过，遵循上述建议，至少在将他们的解决方案安装到您的机器后，您不会在空白屏幕上停留太久。我想这确实如人们所说：有赢也有输。


    ## 参考信息


    - [1] NVIDIA: [https://www.nvidia.com/](https://www.nvidia.com/)

    - [2] AMD Radeon 显卡: [https://www.amd.com/en-us/graphics/radeon-rx-graphics](https://www.amd.com/en-us/graphics/radeon-rx-graphics)

