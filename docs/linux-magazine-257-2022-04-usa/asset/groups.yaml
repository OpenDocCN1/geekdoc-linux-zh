    # Secret Letters


    Email encryption is not that difficult – and it is more important now than ever
    before. We take a look at some important tools and trends in email encryption.


    By Peer Heinlein


    ![](img/8286bf901ba268fe114d66ada92d1dd6_21_0.png)


    **From** the point of view of a mail server, and therefore also its administrator,
    emails are simply ASCII text files that are transferred from server to server.
    They end up on the file system both in transit and at the destination as a text
    file that is freely readable for the administrator. Reading mail is no problem
    for administrators, even if the individual message is quickly lost due to the
    huge numbers. But if you know what you are looking for, you can read whatever
    you want. Cyber criminals often hack email inboxes and systematically analyze
    the messages they find.


    Email has existed for a generation, and the problem of email security is nearly
    as ancient. This article offers some thoughts on the state of email encryption
    today, including what works and some complications you might want to know about.


    # SSL/TLS and Beyond


    The first step in securing email is securing the communication channel. Most well-known
    and responsible providers now provide secure connections to and from their mail
    servers by means of SSL/TLS encryption, so that the data crosses the Internet
    in an encrypted format.


    It would be great to say *all* email providers offer secure communication with
    SSL/TLS, but that is not the case. Gaps remain, often with very old, unmaintained
    mail servers in settings where a commercial firewall or spam filter does not easily
    support SSL/TLS. Old Exchange servers that are directly accessible on the Internet
    for mail reception often stand out due to their lack of encryption capabilities.
    The good news is that whenever Linux-based mail servers such as Postfix are used,
    SSL/TLS is usually offered as a matter of course.


    The sender neither can see whether, or assume that, a message is encrypted using
    SSL/TLS. Mailbox.org was the first provider to introduce a procedure that shows
    the user whether and how the target system can be reached via SSL/TLS as soon
    as the email is written. Other providers have now copied and implemented this
    procedure.


    Simply enabling SSL/TLS is not enough today. Because encryption is optional with
    the Simple Mail Transport Protocol (SMTP), a man in the middle could prevent the
    SSL connection and force an unencrypted plaintext connection. Alternatively, an
    attacker could swap the SSL certificates of the mail servers for their own certificates.
    But there is a remedy for this, too. The DNS-based Authentication of Named Entities
