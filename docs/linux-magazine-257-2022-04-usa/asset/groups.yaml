    is at the desktop level, the audio interface is currently a poor choice for professional
    audio. Long often recordings lead to error messages and dropouts due to buffer
    overflow. Also, when mixing, there are repeated problems with oversampling of
    some plugins or crashes without an intelligible error message. However, this is
    probably not a specific Reaper problem because PipeWire also causes similar trouble
    with Ardour and all too often takes the DAW down with it into a proverbial black
    hole.


