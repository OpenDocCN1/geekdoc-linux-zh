  - '[PAGE 8]


    Type-A port, one Mini DisplayPort 1.4 port, and one HDMI port with HDCP, as well
    as a headphone/microphone combo jack and a dedicated microphone jack.


    Other features include a multitouch click pad, multi-color backlit US QWERTY keyboard,
    2.5Gb Ethernet, WiFi 6, Bluetooth 5, 1.0M 720p HD webcam, 48.96 Wh Li-ion battery,
    and 2 x M.2 SSD (PCIe NVMe only) for up to 4TB total storage.


    The Kudu is now available to the general public and has a base price of $1,799.


    # Ubuntu Budgie Sets Its Sights on Gamers


    Ubuntu Budgie is already a well-designed Linux desktop distribution with a pleasant
    UI that makes interacting with Linux incredibly simple. And with the upcoming
    release of 22.04, the developers are adding a new layer of goodness to the platform.


    First and foremost, the new release will include tools to vastly improve the gaming
    experience. Gamers will find tools such as MangoHud (a Vulkan and OpenGL overlay
    for monitoring FPS, temperatures, CPU/GPU load, and more), CoreCtrl (allows you
    to control computer hardware with application profiles), Polychromatic and OpenRGB
    (RGU lighting management).


    ![](img/8286bf901ba268fe114d66ada92d1dd6_8_0.png)


    Next up comes the easy installation of apps such as Steam, Lutris, RetroArch,
    Discord, and OBS Studio. The developers are also mulling over adding GreenWithEnvy,
    the GTK system utility that is designed to provide information, control fans,
    and overclock NVIDIA video cards and GPUs.


    Finally, the Budgie Welcome App will suggest the installation of gaming-specific
    libraries, based on any applicable hardware it detects.


    All of the gaming features are currently in alpha but hopefully will be ready
    for the masses once the final release of Ubuntu Budgie 22.04 is made available
    this April.


    For those interested in testing the early release, you can download an ISO of
    the daily build for now (*https://cidimage.ubuntu.com/ubuntu-budgie/daily-live/current/*).


    # Linux Mint Edge Is Ready for the Newest Hardware


    Linux Mint 20.3 is now widely available and ships with kernel 5.4. For anyone
    that uses the latest-gen hardware, that older kernel could be problematic. So,
    for those Mint users who have hardware unsupported by the 5.4 kernel, there’s
    now an option.


    Linux Mint 20.3 Edge is a version of the distribution that ships with kernel 5.13.0-25,
    which means you’ll find more new hardware supported. By employing this new kernel,
    Edge adds support for Apple M1 (initial support), preliminary Intel Alder Lake
    S graphics, AMD GPU Freesync/Adaptive-Sync HDMI, AMD Aideran accelerator, generic
    USB display, Loongson 2K1000, preparations for Intel discrete graphics, and Intel
    DG1 Platform Monitoring Technology.


    As far as the user-facing features for Linux Mint Edge, they’ll be the same as
    you’d find with the default release. You’ll find the improvements for the Hypnotix
    IPTV player (including a new channel search function), a new document manager
    tool (Thingy), a search feature added to Sticky Notes, improvements to the default
    theme, and plenty of Cinnamon updates.


    It’s important to note, however, that Edge doesn’t guarantee every piece of next-gen
    hardware will function properly. But if you are using a newer piece of technology,
    you’ll have more luck with Edge than the standard Mint release.


    Download an ISO of Linux Mint Edge at *https://www.linuxmint.com/edition.php?id=296*
    and read the official release notes for Linux Mint 20.3 at *https://www.linuxmint.com/rel_una_cinnamon.php*.


    # MORE ONLINE


    **Linux Magazine**

    *www.linux-magazine.com*


    +   - **ADMIN HPC**

    +     http://www.admin-magazine.com/HPC/

    +   - **Mounting Compressed Archives as a User**

    +     • Jeff Layton

    +     Why splat a compressed archive in your storage when you can just mount it
    like a storage device?


    **ADMIN Online**

    *http://www.admin-magazine.com/*


    +   - **Secure SSH Connections the Right Way**

    +     • Simon Böhm

    +     Admins use SSH, the proverbial Swiss Army knife of system management, for
    many of their daily tasks, but no matter how powerful the tool might be, it typically
    does not offer adequate protection. We look at ways to tighten SSH security.

    +   - **Getting Started with Prometheus**

    +     • Stefano Chittaro

    +     Prometheus is a centralized time series database with metrics, scraping,
    and alerting logic built in. We help you get started monitoring with Prometheus.

    +   - **Hunt Down Vulnerabilities with the Metasploit Pen-Testing Tool**

    +     • Markus Feinler

    +     The veteran Metasploit is by no means obsolete and is still used as a typical
    workflow to find and analyze security vulnerabilities in Windows 10 and Linux
    systems.'
  - '[PAGE 9]


    # Linux Kernel 5.17 Code Merge Window Is Closed


    Now that the holidays are in the rearview mirror, Linus Torvalds’ family-related
    travels are over and he can go back to doing what he does best … the Linux kernel.
    As expected, there are plenty of bug fixes, code cleanups, and new features. Although
    there aren’t any absolute game-changers coming, there are some interesting fixes
    and additions.


    ARM64 will receive the addition of a Kernel Concurrency Sanitizer (KCSAN), which
    is a race condition detector. Also introduced is the initial work for the Scalable
    Matrix Extensions that will provide better and faster support for Matrix operations
    on ARM64 architecture. ARM is also gaining support for Snapdragon 8 (Gen 1) and
    X65 platforms.


    AMD is bringing k10temp-based CPU temperature monitoring for its AMD Zen 19h line
    of CPUs. AMD also sees the inclusion of the AMD P-State driver, which will lead
    to better power efficiency on hardware such as the Steam Deck.


    Laptops and tablets will see a good number of improvements, such as custom fan
    curve support for ASUS ROG laptops, support for the Universal Stylus Initiative
    and Nvidia Tegra Tablets, as well as several performance improvements and bug
    fixes for sleep and sound issues on AMD laptops.


    Other improvements and fixes include: initial support for Raptor Lake S graphics;
    Intel Alder Lap P graphics is now stable in the mainline kernel; Intel’s Gen 1240
    Graphics receives support for Variable Refresh Rate/Adaptive-Sync; EXT4 now uses
    the new Linux Mount API; performance increases for F2FS, Btrfs, and XFS; FS-Cache
    and CacheFiles modules have been rewritten; and a floppy disk hang bug has been
    fixed.


    You can now download Linux kernel 5.17-rc2 for testing purposes (https://www.kernel.org/).


    ![](img/8286bf901ba268fe114d66ada92d1dd6_9_0.png)


    # Another Serious Flaw Found in All Major Linux Distributions


    CVE-2021-4034 has been identified (https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-4034).
    This new vulnerability, named PwnKit, was tracked to an initial commit for pkexec
    from over 12 years ago. Because of the age of the flaw, every Linux distribution
    that depends on Polkit is affected.


    The pkexec negotiates the interaction between privileged and unprivileged processes
    and allows authorized users to execute commands as other users. Researchers at
    Qualys discovered the pkexec command (https://blog.qualys.com/vulnerabilities-threat-research/2022/01/25/pwnkit-local-privilege-escalation-vulnerability-discovered-in-polkits-pkexec-cve-2021-4034)
    could be used by local attackers to increase privileges to root in Ubuntu, Debian,
    Fedora, and CentOS (and warn that it’s most likely exploitable in other distributions
    as well).


    It’s important to understand that with this vulnerability an attacker can gain
    full root privileges on your system using just the default polkit configuration.


    Of course, two of the major distributions, Ubuntu and Red Hat, have released patches
    for the vulnerability. Those patches are available for Ubuntu 14.04, 16.04 ESM,
    18.04, 20.04, and 21.04, and Red Hat for Workstation and Enterprise products.


    For those who use a distribution that has yet to patch this problem, a quick fix
    is to strip pkexec of the setuid bit with the command:


    ```

    ```

    sudo chmod 0755 /usr/bin/pkexec

    ```

    ```


    If you use one of the listed Ubuntu or Red Hat releases, make sure to update your
    systems immediately.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_9_1.png)


