    ## 在 Linux 上加密您的磁盘


    ### 不可读


    加密卷早已不再是一种例外或奢侈品。企业策略和合规规则通常要求对关键数据进行加密。本文探讨了 Linux 上的磁盘加密工具。


    文/ Martin Loschwitz


    过去 10 年间，便携式计算机使台式机退居幕后，这并非巧合。如今，用户仅在进行视频渲染或游戏等计算密集型工作时才需要桌面系统。对于其他所有事情，即使是中端笔记本电脑也完全足够。但笔记本电脑也有一个缺点：它们比独立
    PC 更容易被偷窃。适当的保险单可以减轻设备被盗后的替换成本。然而，补偿数据丢失就没那么容易了。


    企业和用户只能通过完全加密设备中的数据载体，从 USB 闪存盘到外置硬盘，来有效地保护自己免受此类可怕场景的影响。Linux 用户如何最好地通过加密来保护磁盘数据？本文描述了一些
    Linux 上领先的加密方法和工具。


    ## 使用 LUKS 的 Cryptsetup


    几乎所有接触过 Linux 加密的人都会遇到缩写 LUKS [1]，它代表 Linux Unified Key Setup（Linux 统一密钥设置）。LUKS
    标准描述了 Linux 上的磁盘加密应该是什么样的（图 1）。LUKS 基于 Cryptsetup 工具，该工具反过来使用 Linux 内核的 dm-crypt
    内核模块来管理加密卷。


    乍一看，这听起来比实际情况混乱得多——至少如果你记住 Linux 内核在过去几十年中是如何处理块设备及其驱动程序的话。内核的块设备层采用了一种技巧，允许将不同的驱动程序串联连接起来以组合它们的功能。


    dm-crypt 是块设备层的一部分。如果管理员指示设备映射器（例如包括 LVM）在访问块设备之前在其前面添加 dm-crypt 驱动程序，那么该块设备就可以使用所有的
    dm-crypt 功能。事实上，dm-crypt 也实现了自己的基本加密。然而，在内核开发人员眼中，这些措施远远不足以满足当今的需求。因此，他们创建了 LUKS
    格式，该格式标准化了加密所需的所有功能，并将其定义为分区表头的一部分。这也意味着 Linux 上加密驱动器的定义独立于发行版和供应商。


    ## 集成到系统中


    如今，带有 LUKS 支持的 Cryptsetup 包含在所有发行版中。大多数制造商还将该工具直接集成到了他们的设置例程中。你可以在安装各个目录（如 /home）时开始加密，或者你可以加密整个不可拆卸的磁盘。


    一旦加密磁盘，操作系统在没有密码的情况下就无法启动。如果你从设备中移除数据介质并尝试读取它，你只会看到一堆杂乱的数据。人们一致同意，这种在 Linux 下使用加密驱动器的方式是当今最安全的方法。它还使用硬件加速。如果设备中没有
    Atom 或其他低成本处理器，CPU 很可能内置了对各种加密算法的硬件支持。


    通过 USB 连接到系统的设备也可以使用 Cryptsetup 和 LUKS 进行加密——就像内置的 NVMe 磁盘一样。然而，不同发行版之间的设置存在差异，不同的桌面环境也提供了自己操作
    Cryptsetup 和 LUKS 的工具。如果你想避免转到命令行，你需要熟悉系统的默认设置。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_15_0.png)


    图 1：LUKS，Linux 上加密磁盘的标准格式，跨发行版工作。© Suse

