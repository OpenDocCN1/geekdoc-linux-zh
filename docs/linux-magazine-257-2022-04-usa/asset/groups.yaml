    # Cryptography and Provable Security


    Ideally, you would want to provide protection against all types of adversaries
    and rely on the best possible security guarantees. However, security is not free,
    and stronger security guarantees are often less efficient. Inefficient systems
    are not usually adopted in practice.


    # Step 3: Implement the Functions Using Generic Procedures


    This step refers to the basic cryptographic building blocks, such as private key
    encryption, message authentication codes, hash functions, or signature schemes.
    Defining generic procedures helps you understand which security property of the
    underlying building block is used to achieve a certain security property of the
    new system.


    The design has to work independently of specific procedures, since it is always
    possible for individual procedures to be broken. For example, researchers recently
    found the first attacks on the SHA-1 hash function. Developing a completely new
    system because individual components have been broken is simply too expensive.
    Moreover, the insecurity of individual instances does not alter the fact that
    the concept as such is secure. To illustrate this point, just briefly think about
    the example of fire protection. Just because the material of an individual door
    proved not to be fireproof does not mean that the entire strategy, which envisaged
    a fireproof door at a particular location, is wrong.


    # Step 4: Formal Mathematical Proof of Security


    After the formal specification of the security properties and the design, formal
    mathematical proof of security follows in the fourth step. This step confirms
    that the design satisfies the desired safety properties. Formal proof provides
    a one-to-one mapping between the security properties of the underlying cryptographic
    building blocks and the security properties that the system is intended to achieve.
    Formally verifying the security uncovers design flaws. If the security properties
    of the underlying cryptographic building are not applied, there is a flaw in the
    design, and there is most likely a more efficient solution.


    # Step 5: Instantiate the Implementation


    Once the formal security of the system has been established, it is necessary to
    instantiate the generic cryptographic building blocks with specific cryptographic
    procedures. For example, a generic encryption schema with a private key is introduced,
    and this building block is implemented in practice using AES. Since generic building
    blocks work with abstract objects (such as “a private key” or “a ciphertext”),
    you need to translate these objects into concrete instances. For example, the
    object “public key encryption scheme” is instantiated with an ElGamal encryption
    scheme [2].


    # Step 6: Security Analysis of the Implementation


    The sixth and last step calls for security evaluation of the concrete instantiation.
    This is required because transitioning from an abstract description to a concrete
    implementation has many pitfalls. For example, the basic cryptographic element
    used with Internet Protocol Security (IPsec), which is known as “encrypt-then-MAC”
    is an authenticated encryption scheme with weak security [3], and it is considered
    secure against a chosen-plaintext attack (CPA) [4], and it is also secure against
    spoofing given that the encryption scheme is CPA-secure and the message authentication
    code (MAC) cannot be spoofed. However, the concrete instantiation used in IPsec,
    for example, was found to be insecure. The security of the implementation can
    also be proven by penetration tests, which reveal weaknesses in the implementation
    of the security concept that could allow an attacker to penetrate the system.


    # Example: Secure Email


    To illustrate the principle of provably secure software development, consider
    the example of an encrypted email message (Figure 2). In this case, Alice wants
    to send an encrypted message to Bob. Bob needs to be able to decrypt the email
    and verify the signature.


    Alice has Bob’s public key $pk_B$. For simplicity’s sake, I will assume that Alice
    has verified the key and ensured that it is Bob’s. Furthermore, Alice has her
    own private key $sk_A$.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_28_0.png)


    ![](img/8286bf901ba268fe114d66ada92d1dd6_28_1.png)'
