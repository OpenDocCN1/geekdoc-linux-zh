    ## Veracrypt 跨平台兼容性


    当然，Cryptsetup 和 LUKS 的组合有一个主要缺点：它与其他操作系统几乎没有互操作性。你需要解决一种“先有鸡还是先有蛋”的问题。在 LUKS 和
    Cryptsetup 刚刚发展起来的时候，就已经存在了在主要操作系统上同样运行良好的解决方案。这些替代方案虽然未与系统深度集成，但它们能够跨越操作系统边界工作，而不仅仅局限于
    Linux。


    其中一种解决方案是 Veracrypt，它可在多种操作系统上运行。例如，在 Linux 上，Veracrypt 直接依赖于 Dm-crypt。然而，它同时也确保了创建的容器和数据介质在跨越操作系统边界时仍能保持相互兼容。拥有数据介质和相应密钥的管理员可以以相同的方式在
    Windows、Linux 和 macOS 上挂载使用 Veracrypt 加密的现有设备。因此，Veracrypt 特别适合那些经常在 Linux 和 Windows
    之间来回切换的用户，例如，因为他们在家用电脑和办公电脑上使用不同的系统。


    ### 回忆 Truecrypt


    如果不提及 Veracrypt [2] 及其著名的前身，关于 Linux 磁盘加密的文章将是不完整的。Veracrypt 诞生于 2013 年，源自 Truecrypt。当时，Linux
    界的许多观察者认为 Truecrypt 是 Cryptsetup 和 LUKS 组合在 Linux 上唯一有效的替代方案。


    ### 合理否认


    Veracrypt 中另一个绝对方便的功能是从其前身继承而来的，即嵌套加密驱动器的能力，从而实现安全研究人员所称的*合理否认*。合理否认提供了一种隐瞒数据的手段，而外表看起来并不像在隐藏数据。其核心思想是彻底隐藏加密数据的存在。攻击者甚至不知道数据被扣留了，理论上甚至不会想到去询问。


    由于 2014 年的一次审计，Truecrypt 的开发宣告结束，并且是“Truecrypt 开发者自己警告人们不要使用他们的软件”。不久之后，开发者提供了
    Truecrypt 的一个新的最终版本，该版本在功能上受到了极大的限制。据开发者称，这个最终版本仅用于将现有设置转换为使用微软标准加密的 Bitlocker
    设置。


    Veracrypt 通过在驱动器上创建多个嵌套容器来支持合理否认。第一个容器及其在磁盘上的签名从外部很容易被识别出来。然而，由于这个容器在处理正确时仅包含表面上相关的数据，驱动器所有者可以交出密钥（图
    3）。第二个卷将其头部隐藏在第一个卷的头部中。如果你能打开它，你就需要知道它的存在，因为从外部看，它就像随机数据一样。并且，它的存在可以通过第一个加密卷的存在来轻易解释。


    Truecrypt 的终结在社区中引发了激烈的猜测，甚至有人认为情报机构介入了此事。当额外完成的事后审计在 Truecrypt 的运作方式中未发现重大问题后，这些猜测并未平息。Truecrypt
    终结的实际原因可能永远不会被查明。


    ### Truecrypt 的继承者


    作为一年前从 Truecrypt 分离出来的独立项目，Veracrypt 成为 Truecrypt 事实上的继任者。总体而言，从今天的角度来看，Veracrypt
    是一个功能非常强大的数据介质加密器。


    Veracrypt 从其祖先进继承的一个巨大优势是它可以在 Windows、Linux 和 macOS 上运行（图 2）。它在可能的范围内使用现有的基础设施


    ![](img/8286bf901ba268fe114d66ada92d1dd6_16_0.png)


    图 2：在 Veracrypt 中创建的加密驱动器可以在 Windows、macOS 或 Linux 系统上使用。


    ### 易于使用


    如果您正在寻找一种快速加密数据介质的解决方案，Veracrypt 是正确的选择。安装完成后（在 Linux 上通过包管理器处理，在 Windows 和 macOS
    上通过安装程序处理），将以图形界面形式打开一个向导。该向导引导您完成整个创建过程。Veracrypt 提供在文件系统中创建加密容器或加密整个块设备的选项。


    无论您选择哪种方法，任何值得称道的系统管理员应该都不会难以理解并回应 Veracrypt 的问题。如果您以前从未接触过磁盘加密，您可能不会觉得 Veracrypt
    特别用户友好。但是，如果您已经骑在马鞍上更长时间（即更有经验），您将在所有受支持的平台上与该程序相处得很好。


    在 Windows 上，Veracrypt 甚至更进一步，可以在加密驱动器中保留一个隐藏操作系统。从外部看，这个驱动器就像一个正常的数据介质，但在底层，它隐藏了一个完整的系统分区。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_17_0.png)


    ## GocryptFS


    GocryptFS [3] 是 Linux 上加密磁盘的另一个先进工具。GocryptFS 的存在也要归功于一个早期系统，该系统对 FOSS 社区失去了光彩：EncFS。


    当审计期间发生了一些不应发生在加密解决方案上的事情时，EncFS 受到了攻击。测试人员发现源代码中存在一个漏洞，在最坏的情况下，允许计算用于加密的密钥。当攻击者获得加密容器的多个版本时，EncFS
    尤其存在这种危险。那时可以通过简单的匹配和排除程序找到实际密钥。基本上，自此事发生以来，EncFS 一直受到所有关注安全和加密的人的抨击（图 4）。


    然而，奥地利人 Jakob Unterwurzacher 认为 EncFS 背后的想法非常有说服力，于是他着手创建一个新的实现。在这个过程中，他使用了 Go
    编程语言，这不仅解释了程序的名称，而且与之前使用的 C++ 相比，在实践中也转化为相当大的速度优势。FUSE 的使用保持不变，因此 GocryptFS（图
    5）可以在任何激活了 FUSE 环境的 Linux 系统上使用。


    由于 FUSE 也可用于 Windows，因此 GocryptFS 也可以在 Windows 系统上运行。但是，使用其自己的包装器，该解决方案被称为 CpcryptFS，正如名称所示，GocryptFS
    的 Windows 版本是用 C++ 而不是 Go 编写的。macOS 用户则不太幸运：macFUSE 确实存在，但它不提供免费许可证。因此，FOSS 社区倾向于避免使用该工具。然而，一种替代方案已经制定出来，将
    GocryptFS 带到了 macOS，尽管删除了一些特殊功能。


    如果您不想在命令行上使用 GocryptFS，您可以转向 StiriKali，它为 GocryptFS 及其前身 EncFS 提供了图形用户界面。


    ### GocryptFS 提供的功能


    如前所述，GocryptFS 始终在文件或磁盘上创建完整的加密容器。基本上，GocryptFS 设计为一个覆盖文件系统。在


    ![](img/8286bf901ba268fe114d66ada92d1dd6_17_1.png)


    ![](img/8286bf901ba268fe114d66ada92d1dd6_18_0.png)


    正常操作模式下，您启用一个 GocryptFS 容器，向其写入一些内容，再次禁用该容器，然后加密内容就会以其原本的形式出现在底层文件系统中。借助文档的帮助，创建
    GocryptFS 覆盖层既快速又简单。


    GocryptFS 提供第二种选项，称为反向模式，适用于隐式不安全的存储目标。例如，如果您希望将备份存储在云中，您可以在 GocryptFS 中激活反向模式。反向模式直接公开加密数据，以便您可以将其复制到其他位置。


    GocryptFS 与 Veracrypt 一样简单，不过，GocryptFS 具有明显的速度优势。至少从主观上看，在加密方面存在相当大的差异，尽管 Veracrypt
    和 GocryptFS 以相同的方式支持各种加密算法的加速。如果您想管理加密数据，您肯定会想要看看 GocryptFS。


    ## 通用 GUI：Zulucrypt


    在这个加密器展示中的最后一个候选者是一个程序，它实际上并不自己执行加密工作。Zulucrypt [4]，连同其包含的 Zulumount，更关注于组织 Linux
    下可用的多种加密方法的泛滥。Zulucrypt（图 6）承诺在单一界面中统一经典的 crypt 设置、LUKS、Veracrypt 和 GocryptFS。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_18_1.png)


