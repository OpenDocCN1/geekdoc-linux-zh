    \ 年前的 2.6 时代，以应对自制文件系统令人担忧的泛滥。其理念是让安全模块使用相同的 SecurityFS 应用程序编程接口（API），并在后台随心所欲地实现任何疯狂的想法。SecurityFS\
    \ 仅仅提供了一个一致的网关，以便每个人都能轻松导航其他人各种概念。\n\nGreg Kroah-Hartman 回复 Dov：“**你为什么为这个使用 securityfs？securityfs\
    \ 是供 LSMS [Linux Security Modules，Linux 安全模块] 使用的。如果你想拥有自己的文件系统来玩弄这类东西，很好，写你自己的，现在只需要不到\
    \ 200 行代码。过去我们经常这样做，直到人们意识到对于驱动程序的东西应该直接使用现成的东西。**”\n\n“**但这不是一个驱动程序，所以当然可以，添加你自己的虚拟文件系统，在某个地方挂载它然后走人，不用去折腾\
    \ securityfs，对吧？**”\n\n但 James Bottomley（同样来自 IBM）对 Greg 的说法提出了异议。他回复道，“我们也将它用于非\
    \ LSM 的安全目的，例如 TPM BIOS 日志和 IMA。你为什么认为我们应该开始将 securityfs 限制为仅用于 LSM？这一直以来的政策并非如此。”他补充道，“我真的认为具有安全目的的东西应该使用\
    \ securityfs，以便人们知道去哪里查找它们。”\n\nGreg 回复说，将 SecurityFS 用于 LSM “是该文件系统创建时的初衷，但我想现在这真的取决于\
    \ LSM 维护者希望它用于什么用途。”但他建议道，“如果那些人想要一个文件系统接口，为什么不直接做一个 cocofs 呢？现在只需要大约 200 行代码，甚至更少，这样你只需要挂载系统实际需要的部分。如果这不是必须的，为什么要强行将其塞入\
    \ securityfs？”\n\nJames 指出，coco 仅仅是他们正在实现的特定功能的第一种潜在用途——将秘密数据传输到虚拟机中，而虚拟机本身无法读取它。他说，“这不是强行的。秘密传输在\
    \ BIOS 日志的方式下是一种安全功能。”\n\nGreg 非常怀疑，并对听说 BIOS 日志使用 SecurityFS 感到惊讶。James 确认道，“是的。它在\
    \ /sys/kernel/security/tpm0/ 下。所有的 IMA 策略控制及其日志都在 /sys/kernel/security/ima/ 下，这就是为什么我认为将\
    \ securityfs 声明为用于任何安全相关用途已经是我们的事实（即使不是法律）政策。”\n\nJames 还补充道，“我知道 Al [Viro] 喜欢这种大量独立文件系统业务，但我不支持。对于你做的每一个，你不仅要记录所有东西，还要找到一个发行版都能同意的首选挂载点，并让它们同意启用该挂载，这通常需要数月的谈判。通过共同的用途将较少的文件系统分组，并使用发行版实际同意的挂载点，似乎是一种更容易的启用方法。”\n\
    \nGreg 认为这些论点没有说服力。一方面，他说，无论你是创建新的文件系统还是使用现有的文件系统，你仍然需要记录存储在该文件系统中的数据。\n\n至于 Linux\
    \ 发行版在挂载点上进行谈判——或者决定首先采用给定的功能——Greg 认为这是正常的。他说，“启用它确实需要时间，这是好事，因为如果他们不认为它应该存在，因为他们不想使用它，那么它就不会存在，这意味着他们不需要你的新功能，或者你还没有让它足够有用。所以再次说，这不是问题。”\n\
    \nGreg 的根本问题是安全。SecurityFS 用户群越广泛，这些用户中的每一个就越有可能向 SecurityFS 添加更多功能，将各种功能暴露给用户空间，并且通常呈现给攻击者更多的表面去寻找安全漏洞。\n\
    \n讨论没有结论。无论如何，利益可能不多——如果 coco 使用 SecurityFS，它只是像其他使用 SecurityFS 的东西一样做同样的事情。如果它创建自己的文件系统，它也同样像其他东西一样做同样的事情。像这样的讨论有趣之处在于，可以见证开发策略的出现和转变。\n\
    \n不同的开发人员对内核的哪些部分应如何用于进一步开发有不同的解释。这些差异通常不会干扰他们提交补丁的能力，因此他们可以愉快地继续工作，每个人对如何为内核编码持有不同的信念。\n\
    \n然后，当像 IBM 的 coco 补丁这样的东西出现时，突然间每个人的不同想法都在实际层面上变得相关。有时随后会发生巨大的冲突，有时则不会。在当前情况下，我们可以看到这个问题：项目是否都应该创建自己的文件系统，还是类似的用户应该聚集在一起以最大限度地减少文件系统的泛滥？最终这个问题可能必须得到解决。但眼下，只是这些微弱的骚动。\n\
    \n### 维护 GitHub 内核分支\n\n来自 Paragon 的 Konstantin Komarov 提交了一个 NTFS 补丁——或者更准确地说，他请求\
    \ Linus Torvalds 从 Paragon 的 GitHub 树中拉取该补丁。Linus 回复道：\n\n> “对于 github 账户（或者真的，除了\
    \ kernel.org 我可以直接信任其账户管理之外的任何东西），我真的很希望拉取请求是一个签名的标签，而不仅仅是一个普通的分支。\n> \n> 在一个完美的世界里，这将是一个\
    \ PGP 签名，我可以通过信任链直接追溯到你，但我实际上从未要求过这样。\n> \n> “所以我虽然更喜欢看到完整的信任链，但我意识到设置它并不总是容易的，因此至少我希望看到一个保持不变的‘身份’，以便我可以看到拉取来自控制该密钥的同一一致来源。”\n\
    \n几分钟后，他回复了自己的邮件，说他这次会直接拉取该树以避免延误，但他要求 Paragon 设置 PGP 并在未来开始使用签名的标签。\n\n顺带一提，Linus\
    \ 补充道：\n\n> “我*注意到*你那里有一个 github 合并提交。\n> \n> *这就是*另一件我*真的*不想看到的东西——github 创建绝对无用的垃圾合并，你绝对不应该使用\
    \ github 接口来合并任何东西。\n> \n> *这是*那个合并的完整提交信息：\n\n```\nMerge branch 'torvals:master'\
    \ into master\n```\n\n> “是的，这不是一个可接受的信息。更不用说它有一个错误的‘github.com’提交者等等。\n> \n> *github*\
    \ 是一个很好的托管站点，它还擅长许多其他事情，但合并不是其中之一。\n> \n> “Linux 内核合并需要*正确地*完成。这意味着有适当的提交信息，关于正在合并什么以及*为什么*合并某事的信息。但这还意味着正确的作者和提交者信息等。所有这些都是\
    \ github 完全搞得一团糟的。\n> \n> *我们*在 ksmbd 拉取请求上遇到了同样的问题，我的回应是一样的：最初的拉取可能有一些怪癖，我现在会接受，但对于持续开发，你需要正确地做事。这意味着从命令行进行合并，而不是使用完全损坏的\
    \ github 网页接口。”\n\nLinus 的帖子之后没有讨论或争议。有趣的是，签名问题不是假设性的。几年前，Linus 不得不忍受围绕各种补丁许可问题的法律麻烦。因此，补丁签名成为追溯所有补丁以进行许可验证目的的原点标准方式。\n\
    \n"
