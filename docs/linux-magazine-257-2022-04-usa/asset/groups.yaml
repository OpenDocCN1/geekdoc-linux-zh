    The *pi test* program briefly tests the setup; it gives you read and write access
    to all of the RevPi Core''s interfaces. If you launch the tool without any parameters,
    it provides a listing of all your options. Listing 1 gives you the commands you
    need to make the first DMX light show red and the second one green.


    The first two commands fully fade up the master dimmers of the two lights; the
    following two commands do the same for the colors. Although values between 0 and
    255 can be written to the channels, the lighting intensity only changes every
    16 values, although this is not generally the case with DMX, just with these cheap
    lights.


