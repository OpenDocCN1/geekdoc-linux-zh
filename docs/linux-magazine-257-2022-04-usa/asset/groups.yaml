    # Linux Mint 20.3 Cinnamon and deepin 20.4


    Two Terrific Distros on a Double-Sided DVD!


    ![](img/8286bf901ba268fe114d66ada92d1dd6_5_0.png)


    ![](img/8286bf901ba268fe114d66ada92d1dd6_5_1.png)


    ![](img/8286bf901ba268fe114d66ada92d1dd6_5_2.png)


    # Linux Mint 20.3 Cinnamon 64-bit


    Codename “Una,” Linux Mint 20.3 Cinnamon is the latest long term support (LTS)
    release for Linux Mint, with support until 2025. It features Cinnamon, Mint’s
    popular desktop environment. Like most standard Mint releases, Una is based on
    Ubuntu, which in turn is based on Debian. The Debian edition of the same release
    is available as Linux Mint Debian Edition (LMDE) 5, codenamed “Elsie.”


    Cinnamon has a reputation for cautious innovation, with a few new features in
    every release, and Linux Mint 20.3 is no exception. Many tweaks have been made
    to the look and feel, with makeovers of existing themes and several new wallpapers,
    as well as the enlargement of titlebars and their buttons, with rounded corners
    adding a softer look. For those who prefer the old look, the Mint-Legacy theme
    is available. In addition, a number of apps have also added search fields, including
    Hypnotix IPTV and the Sticky Notes applets. New to Cinnamon is the Thingy e-reader
    and a calendar and scheduler applet. By contrast, previous users of Mint might
    notice the disabling of the Snap Store for universal packages, which was done
    on the grounds that, while snap packages are open source, the code for the Snap
    Store is not.


    Like previous Mint releases, Una is a distribution for all levels of users.


    # deepin 20.4 64-bit


    Deepin is one of the leading distributions from China. Based on Debian’s Stable
    repository, deepin is prized for its Deepin Desktop Environment (DDE), which is
    built with Qt. DDE contains over two dozen unique applications ranging from standard
    items such as an editor, font installer, and package store to more unusual items
    like a remote assistant, repair guide, and presentation assistant. DDE is also
    frequently praised for its easy-to-follow installer and for its clean and beautiful
    design.


    If you have used deepin previously, you will notice numerous small improvements
    in the 20.4 release, starting with a new default wallpaper. Also new in the release
    is an undo function (Ctrl+Z) for the trash icon and the display of an application
    window’s titlebar when hovering the mouse over the dock. The Control Center now
    supports biometric authentication, hibernation time settings, and more detailed
    settings for custom docks. Numerous bug fixes have also been made. As in previous
    releases, deepin 20.4 includes numerous tweaks not found in other desktops that
    extend functionality in small but useful ways.


    Deepin has been accused several times of passing user information to the Chinese
    government, but none of these allegations have ever been proven. You will, however,
    have to check a box that says you agree to the deepin EULA and privacy policy.
    (See the article on deepin on p. 34 of this issue.)'
