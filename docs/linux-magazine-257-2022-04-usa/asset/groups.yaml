    ## 自由开源软件精选


    来自自由和开源软件世界的璀璨宝石与最新发布


    ![](img/8286bf901ba268fe114d66ada92d1dd6_79_0.png)


    格雷厄姆本月面临了一个有趣的道德困境：是否要包含一个开源的 Wordle 克隆版。继续阅读以查看他的决定。


    BY GRAHAM MORRISON


    ### 图形工作室


    #### Blender 3.0


    我们以前看过 Blender 的更新，但从未有过像这次如此重要的。Blender 3.0 距离 Blender 2.0 已经过去了 22 年。这一时期涵盖了该项目从
    2000 年源代码作为免费软件发布后，到 2002 年 Blender 基金会成立，再到 2003 年真正开源的过程，以及在此之后定义了 2.x 发布周期的众多改变世界的功能更新。Blender
    极具影响力，作为一个轻量级项目，它展示了开源所能取得的成就。从建模、动画、电影和 3D 渲染，到建筑、3D 打印和游戏设计，Blender 获得了前所未有的行业认可，并被业余爱好者、学生和专业人士广泛使用。


    Blender 3.0 不仅仅是一次例行发布，它包含大量新功能和改进，尤其是如果你错过了几个更新的话。其中最好的是资源浏览器，这是一种新的视图类型，出现在菜单中，与
    3D 视口、合成器以及所有其他类型并列。启用后，选定的窗格将显示来自大量 Blender 资源类型的缩略图，包括对象、材质，甚至姿势。姿势是用于存储模型角色表情（如微笑或皱眉）的一种方式。Blender
    3.0 允许你调整这些姿势而不会丢失原始数据，并为角色和属性提供关键集。然后，你可以从资源视图中添加、混合、应用和翻转姿势，以查看它们如何适合你选择的角色。甚至可以通过在帧图上拖拽正方形来选择关键值。


    同样，资源可以被拖放进入你的场景，场景会根据你的硬件能力快速更新，即使添加高动态范围图像 (HDRI) 光照资源也是如此。这是将带有材质和光照的模型快速拖入场景的好方法。你可以通过将场景元素标记为资源来回馈库——这些资源还可以链接而非复制——以便在多个项目中使用单一实例。


    速度和质量的提升随处可见。刀工具可以切割多个对象，并最终包含在撤销历史中。绘制笔触可以并发修改，甚至虚拟 realidad 模式也添加了六自由度 (6DOF)
    控制器。当生成最终输出时，得益于新的 Cycles X 渲染器，渲染速度快了 2 到 8 倍。视口更新更快，用于设置相机的视点 (POV) 模式也更快，即使在复杂场景中，它仍然具有足够的交互性来对齐镜头，随着视图保持时间的增加，会添加更多细节。一切都看起来更好了，阴影得到改善，硬件光线追踪以及材质表面的光散射效果。甚至连
    UI 也有了很大的改进。如果你已经好几年没用过 Blender 了，你会发现现在几乎每个功能都有屏幕提示、滑块和控件。每个视图都配有主要功能的图标或字形，一切都比过去更加直观。仍然有很多选项和很多菜单，但你可以在不使用
    90% 的情况下开始使用。默认主题现在具有更多可配置的对比度和更圆润的角，这使得使用变得更容易。Blender 现在比以往任何时候都更容易使用，并且能够产生惊人的结果。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_79_1.png)


    - **视口渲染：** Blender 中的预览输出现在几乎与最终输出相同。

    - **UI 改进：** 将鼠标悬停在某个区域上以突出其边缘，并更轻松地将不同窗格合并。

    - **几何节点：** 此版本新增了与曲线、文本数据和实例进行交互的节点。

    - **属性显示：** 不需要猜测或记住组合键，属性可以通过视口中的 UI 进行更改。

    - **改进的图标：** Blender 中的字形和图标现在更容易理解和使用了。

    - **速度提升：** 不仅仅是预览——一切现在都更快了，从节点到渲染。

    - **资源管理器：** 将所有最好的创意集中存放在一个地方，跨项目共享，包括角色姿势。


    ### 项目网站


    https://www.blender.org


    ### 控制台网络服务访问


    #### woob


    **Wo**ob 是“浏览器外的网络”的缩写，其使命是提供对特定网站的访问，而无需使用网络浏览器。它通过成为一个模块驱动的后端来实现这一点，每个模块都针对特定类型的网络服务。例如，输入
    `woob` 后跟 `bank`，你会看到一个巨大的模块列表，旨在与在线银行合作。最让人惊讶的是，尽管该项目很年轻且相对小众，但已经有很多模块来支持其各项功能，并且一直在增加。例如，它支持从巴克莱银行到瑞士生命保险公司的
    88 家银行。选择其中一个将引导你使用自己的凭证配置模块，以便你可以访问模块支持的任何功能。对于银行模块，这些功能包括查看利率、转账功能和查询余额。当然，你可能明智地不会信任
    woob 在没有对其代码进行某种审计的情况下协商你的银行账户，但 woob 也支持许多不那么关键的服务。电影功能允许你与电影元数据抓取器和本地下载服务进行交互。图库模块对图片服务做同样的事情，而包裹模块则帮助你访问
    DHL 和 DPD 等公司的跟踪信息。还有更多功能，包括处理本地 Linux 命令行工具和传感器、远程网络服务（如天气和 Bug 跟踪），甚至烹饪食谱和音乐歌词。你甚至不需要使用命令行，因为许多服务都配有基于
    Qt 的图形前端，可以用它代替命令行。这些前端还有额外的优点，可以显示电影海报、专辑封面或食谱照片等图像。开始时可能需要一些努力，但在使用了几个模块后，你会意识到它提供了比它希望取代的许多网络服务更好的用户体验，这绝对是一件好事。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_80_0.png)


    使用 woob，无需网络浏览器，即可从命令行访问你喜爱的一些网络服务。


    ### 项目网站


    https://woob.tech


    ### Cat 克隆版


    #### bat


    **Unix** 哲学中拥有一个简单工具来完成一项简单任务的理念在命令行上依然生机勃勃，而 `cat` 命令就是其最佳例子之一。它是一个如此古老的命令，以至于它被包含在
    1971 年由 Ken Thompson 和 Dennis Ritchie 开发的“研究 Unix”最初版本中（尽管“研究 Unix”这个术语直到 1978
    年才首次使用）。众所周知，`cat` 会将文本文件的内容打印到标准命令行输出，让你可以轻松查看其内容。如果列出多个文件，它将依次连接每个文件的输出（这也是它名字由来的任务），让你整体查看其内容或将其管道传输到一个新的单一文件中。它可以可选地显示行号，或突出显示制表符或行尾，但除此之外它不能做太多。它是一个为简单任务设计的简单工具，而且运行得非常好。


    但有时你需要从朴素的 `cat` 中得到更多，特别是在翻找源代码或具有特定格式的文本文件时。这时，同样以动物命名的 bat 就能帮上忙。它在 `cat` 的简单前提基础上增加了几个额外的现代必需品，包括语法高亮、内置分页器，甚至
    `git` 集成，可以在与 Git 索引比较后仅显示文件中的修改。只需将你的 `cat` 调用替换为 `bat` 就可以实现所有这些，但还有进一步的选项来自定义输出，包括指定何时禁用分页器、何时仅显示差异以及一种文件类型映射到另一种文件类型的选项。它快速、美观且可以自定义主题，同时仍然与
    `cat` 的原始基本输出完全兼容，使其在预览 `fzf` 或查找结果时与预览 `main.cpp` 的内容同样有用。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_80_1.png)


    bat 是那些罕见的命令之一，一旦你开始使用它，你就会想知道自己以前是怎么在没有它的世界里度过的。


    ### 项目网站


    https://github.com/sharkdp/bat


