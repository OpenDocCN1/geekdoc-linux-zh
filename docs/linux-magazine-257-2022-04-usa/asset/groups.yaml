    ## 游戏创作者：Bladecoder 冒险引擎


    当电子游戏首次变得流行且易于获取时，似乎每个月都会带来一个新的游戏类型。街机版游戏、文字冒险游戏、纵向射击游戏、横向卷轴射击游戏、平台跳跃游戏、策略游戏以及点击式冒险游戏都在短短几年内相继出现。随着技术的进步，这些游戏类型似乎将被遗忘，被更具吸引力和沉浸感的游戏类型所取代。但这种情况并未发生。相反，许多原始游戏类型不仅幸存了下来，甚至在
    GPU 能够执行实时光线追踪、智能手机性能比阿波罗 11 号制导计算机强数百万倍的年代里依然蓬勃发展。特别是，2D 图形仍然具有相关性，在平台跳跃游戏、角色扮演游戏（RPG）和点击式冒险游戏中依然很受欢迎。甚至最初的
    Sierra 开发商也回归了冒险游戏领域，2017 年《Thimbleweed Park》的成功众筹发行以及随后几年发布的许多类似作品便是证明。


    旧游戏理念的意义不仅仅在于复古游戏和怀旧。其中许多可以作为现代正当作品的基石，同时希望能比当年的原始作品更容易在现代硬件上制作。Bladecoder 冒险引擎就是这样一个完美的例子。这是一套现代化的工具，帮助你创建互动图形冒险游戏，非常类似于《Monkey
    Island》或《Thimbleweed Park》，甚至正被用于开发一款名为《The Goddess Robbery》的 Android 和 iOS 游戏。使用编辑器，你可以下载并查看这款游戏及其他游戏，以帮助你学习如何制作自己的游戏。


    该引擎本身由两部分组成：一个图形编辑器和一个用于运行生成游戏的后台引擎。图形编辑器（Adventure Editor）是你可能花费最多时间的地方，因为项目创建、资源添加和功能实现都在此完成，且无需任何编程。项目由一个或多个包含场景的章节组成。场景类似于独立的地点，例如原始《Monkey
