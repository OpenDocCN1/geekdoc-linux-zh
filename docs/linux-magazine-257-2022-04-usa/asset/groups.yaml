    # 守望者


    通过命令行监控系统


    > 两个监控工具 **watch** 和 **fswatch** 让你能够从容命令行获取系统信息。*作者：布鲁斯·拜菲尔德（Bruce Byfield）*


    熟悉 Linux 的大多数用户可能都曾使用过 `cron` 或 `at` 来安排命令的执行。这两者在各自的场景中都非常有用：`cron` 用于事件的重复调度，而
    `at` 用于单次事件调度。然而，两者的共同缺陷在于，除非编写特定的脚本，否则它们无法收集系统信息并对此做出响应。通常，使用 `watch` [1] 和 `fswatch`
    [2] 来同时完成这两项工作要简单得多。


    虽然 `watch` 和 `fswatch` 仅用于收集信息或检查潜在的安全入侵，但只需少量努力和最少的脚本编写能力，就可以调整这两个工具，使其像调度器一样工作。


    **作者简介**


    布鲁斯·拜菲尔德是一位计算机记者，也是一位专注于免费和开源软件的自由撰稿人和编辑。除了写作项目外，他还教授现场课程和在线课程。在业余时间，布鲁斯撰写关于西北海岸艺术的文章（https://brucebyfield.wordpress.com）。他还是
    Prentice Pieces 的联合创始人，这是一个关于写作和幻想的博客，地址为 https://prenticepieces.com/。


    ## watch


    `watch` 的目的在于跟踪命令输出随时间的变化（见图 1）。这些信息可用于故障排查，也可以在安装或更新新软件包时，让 root 或普通用户了解系统变化。在有限的情况下，它也可以作为
    `at` 或 `cron` 的更简单的替代方案。表 1 展示了其他几种常见用途。默认情况下，`watch` 每两秒运行一次，直到关闭或中断。基本命令结构如下：


    ```

    watch OPTIONS COMMAND

    ```


    根据命令内容的不同，`watch` 可能需要在内部使用引号。例如，如果命令使用了管道来运行 `less` 或 `grep`，则需要加引号。或者，代替引号，你可以运行
    `--exec` (`-x`)，这样当命令包含多个命令时就不需要新的进程了。


    两个选项设定了 `watch` 的行为特征。最重要的是 `--interval SECONDS` (`-n SECONDS`)。`--interval` 选项会覆盖默认的每两次运行之间
    2 秒的间隔——这个间隔显然是为即时故障排查而选择的。然而，在始终运行的计算机上，将间隔设置为 86,400 会使 `watch` 每天运行一次，设置为 604,800
    则会使其每周运行一次，从而使 `watch` 承担与 `at` 或 `cron` 相同的功能。可以使用逗号或句点来表示较大的间隔；最小间隔为 0.1 秒。`watch`
    与其他调度器唯一的区别在于，如果计算机曾经关机，你需要记得重启 `watch`，这是 `at` 或 `cron` 所没有的问题。出于不明原因，间隔可以辅以
    `--precise` (`-p`) 来确保间隔的精确度——也许某些测试需要这种精确度。


    `watch` 还支持用于自定义输出和退出行为的选项。使用 `--color` (`-c`)，输出会进行颜色编码。使用 `--no-1inwrap` (`-u`)，长行会被截断，而
    `--differences` (`-d`) 会突出显示与先前输出不同的最新输出。你还可以使用 `--no-title` (`-t`) 移除显示间隔、命令、当前日期和时间的标题。


    ```

    Every 60.0s: ls -l ../watch


    hostname: Sat Jan 22 13:06:04 2022

    total 4

    -rw-r--r-- 1 bb bb 136 Jan 22 13:04 distros.txt

    -rw-r--r-- 1 bb bb 36 Jan 22 13:01 test.txt

    ```


    **图 1：** 使用 `watch` 每 60 秒跟踪目录中的变化。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_43_0.png)


    ### 表 1：Watch 的日常用途


    | 命令 | 描述 |

    | :--- | :--- |

    | `watch -n 5 date` | 每五秒显示一次日期 |

    | `watch -n 60 from` | 每 60 秒检查一次邮件 |

    | `watch -d ls -l` | 监视目录中的变化 |

    | `watch -d ''ls -l \| fgrep joe''` | 监视由 Joe 账户拥有的文件 |

    | `watch uname -r` | 监视新内核的安装 |

    | `watch -d free -m` | 监视内存变化 |


    退出选项同样多样化。使用 `--chexit` (`-g`)，当输出变化时 `watch` 会退出，这可以成为一个明显且便捷的指示器。此外，你可能还需要 `--beep`
    (`-b`)，在 `watch` 因错误刚刚退出时发出声音，或者使用 `--errexit` (`-e`)，在发生错误后停止输出，但等待按下任意键后才退出。


    ## fswatch


    `fswatch` 监视目录或文件的变化。最简单的使用方式是在一个终端中运行 `fswatch`，在另一个终端中编辑文件。


    当你开始使用 `fswatch` 时，需要了解有关该命令结构和操作方式的一些信息。`fswatch` 能够使用几种不同的实用工具。在 macOS 上，它报告由
    FSEvents 收集的信息。在 BSD 上，它依赖于队列监视器。在 Linux 上，它默认使用 inotify，这是一个 Linux 内核子系统，并带有轮询监视器选项，后者保存文件修改的时间。所有这些监视器都提供相似的信息，尽管
    `fswatch` 的手册和信息页面警告说，每个都有各自的优势和劣势，以及各自的错误，所有这些都在帮助页面中详细描述。你可以使用 `--list-monitor`
    (`-n`) 选项查看可用监视器的列表，并选择可以使用 `--monitor NAME` (`-M NAME`) 的那个。然而，在终端中显示的输出中，通常不同的监视器之间差异很小。


    如果不带任何选项，`fswatch` 仅记录发生变化的文件，但其他选项可以增加额外信息，例如检测到的事件，以及（可选地）检测到事件的时间。事件类型是自解释的。一个操作可能具有多种事件类型。`fswatch`
    的事件类型包括：


    - Created

    - Updated

    - Removed

    - Renamed

    - OwnerModified

    - AttriModified

    - MovedFrom

    - MovedTo

    - IsFile

    - IsSymlink

    - Link


    为了帮助组织输出，你可以使用 `--batch-marker CHARACTER` 来分隔命令的每次循环。此外，`--print0` (`-0`) 可用于确保行被分隔以便阅读。


    基本命令结构为


    ```

    fswatch OPTIONS PATHS

    ```


    除了特定路径外，你还可以使用 `--include REGEX`（或 `-R`）和 `--exclude REGEX`（或 `-e`）通过正则表达式选择路径。可以使用
    `--insensitive` (`-i`) 进行不区分大小写的搜索，并使用 `--recursive` (`-r`) 包含子目录。如果监视的文件包含符号链接，添加
    `--follow-links` (`-L`) 选项后，`fswatch` 将跟踪它们。你还可以使用 `--timestamp` (`-t`) 在输出中添加本地时间，或使用
    `--utc-time` (`-u`) 添加 UTC 格式的时间。使用任一时间选项，你可以使用 `--format-time FORMAT`（或 FORMAT）利用
    strftime 代码 [3] 来构建日期。其他有用的选项包括 `--one-event` (`-1`)，它在一组事件后退出 `fswatch`，以及 `--latency
    SECONDS` (`-l 1 SECONDS`)，其必须至少为 1.1 秒。与 `watch` 不同，`fswatch` 不给出任何输出，除了简要概述当前工作目录打开的另一个终端标签。


    通常，`fswatch` 生成的基本信息本身就有用。然而，就像 `watch` 一样，`fswatch` 也可以用于发出命令。它通过管道传递到 `xargs`
    来实现这一点，其目的是发出其他命令。表 2 展示了从 `fswatch` 在线帮助 [4] 中摘录的四个常见示例。


    ### 表 2：fswatch 和 xargs


    | 操作 | 命令 | 备注 |

    | :--- | :--- | :--- |

    | 运行 Bash 命令 | `fswatch FILE-PATH \| xargs -n 1 COMMAND` | 通常用于创建、更新或删除文件 |

    | 监视一个或多个文件和/或目录 | `fswatch PATHS **/*.js \| xargs -n 1 bash_command` | – |

    | 打印更改文件的绝对路径 | `fswatch PATH \| xargs -n 1 -I {} echo {}` | – |

    | 按事件类型过滤 | `fswatch --event DIRECTORY-PATH \| xargs -n 1 bash_command` | 通常用于创建、更新或删除目录
    |


    ## 工具箱中的另外两件工具


    如果你更喜欢在桌面环境中工作，Gnome 提供了 `command-runner-applet`，其功能与 `watch` 和 `fswatch` 大致相同
    [5]。但 `command-runner-applet` 并不是一个单一命令；根据其 GitHub 页面，它在运行时接管桌面，尽管鼠标和键盘操作将在其完成后运行。


    另一方面，`watch` 和 `fswatch` 都在单个命令中提供了广泛的功能，特别是 `fswatch` 提供了深入的报告选项。当然，主要区别在于，`watch`
    提供了一种使用命令进行监视的统一方式，而 `fswatch` 主要关注目录和文件的管理。然而，两者都是命令行比桌面提供更多功能的一个例证。尽管相对鲜为人知，但每一个都是管理工具箱中有用的补充。
    **▪▪▪**


    **信息**

    - [1] watch: https://linux.die.net/man/1/watch

    - [2] fswatch: https://www.mankier.com/1/fswatch

    - [3] strftime code: https://strftime.org/

    - [4] fswatch examples: https://www.mankier.com/1/fswatch#Examples_(TL;DR)

    - [5] command-runner-applet: https://github.com/prpider/command-runner-applet

    '
