    \ 获取当前像素值，并使用 `dimg.Set()` 将其从右到左逐列存储在目标矩阵中 – 就是这么简单。\n\n有了这两个用代码实现的算法，Listing\
    \ 5 中的主程序可以从磁盘获取照片，读取 Exif 头信息，确定头信息中是否存在方向标签，并发起旋转以纠正格式。如果你之前使用 Exiftool 读取 JPEG\
    \ 照片的 Exif 头信息，你可能会惊讶地发现 Exif 头中 Orientation 标签的真实值根本不是包含角度信息的字符串，而是一个整数值。常见的设置值是\
    \ 6（顺时针 90 度）、3（180 度）或 8（逆时针 90 度）。该标准支持的其他值（包括镜像照片）在图 6 中显示，但在实践中出现的频率较低。\n\n\
    隐藏在 JPEG 照片中的 Exif 标签不易读取，但幸运的是，GitHub 上的 Go 社区提供了一些简化此任务的库，只需调用 `Decode()` 函数即可。Listing\
