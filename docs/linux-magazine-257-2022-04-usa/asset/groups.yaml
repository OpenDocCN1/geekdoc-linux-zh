    TLSA 类型的 DNS 记录。但请注意：今后每次更换 SSL 证书时，您都必须记得更新您的 DANE 记录。具有先进配置的邮件服务器（例如 Postfix）会在通过
    DANE 发布的证书和指纹不匹配，或者尽管已发布 DANE/TLSA 记录但目标服务器未提供 SSL/TLS 的情况下，停止发送出站邮件。发送方邮件服务器的
    `main.cf` 文件需要包含一行 `smtpls_security_level = dane`，即使该服务器不为入站消息提供 DANE。


    ## 保护内容


    SSL 已就位。一切都好了吗？并非如此，因为 SSL 仅保护两个特定邮件服务器之间的 TCP/IP 连接。没有人知道消息在后续传输过程中是否可能通过未加密的连接进行传输。此外，电子邮件本身以明文形式存在于服务器中，既在收件人的收件箱中，也在发件人的已发送文件夹中。


    一个运行了数年甚至数十年的电子邮箱，可能包含许多高度私密的内容，您可能更希望这些内容远离公众视线。每个用户都需要思考，如果他们的整个收件箱变得公开会有什么影响，因为这种情况发生得太快了。选择不当的
    IMAP 密码很容易被黑客破解；甚至可能在不经意间泄露给钓鱼网站，或被本地病毒感染所截获。


    确保您的电子邮件保持私密的唯一方法是使用 PGP 或 S/MIME 对消息进行加密。这两种方法都基于相同的原理：每个用户都有一个非对称密钥对。它由一个公钥（用于加密和数字签名）和一个私钥（用于解密和验证数字签名）组成。用户选择的密码保护私钥免受未授权访问。在任何情况下都不应忘记此密码。如果密码丢失，密钥文件将不可用，所有使用该密钥加密的数据将无法再访问。


    ## 良好隐私保护（PGP）


    如今许多 Linux 用户习惯使用 PGP 工作。您将您自己的公钥与其他收件人的公钥一起存储在本地密钥数据库中，该数据库也被称为密钥环（keyring）。由于随时间推移可以为一个邮件地址生成多个密钥，因此每个密钥都有自己独立的
    ID。此外，可以使用数学上唯一的指纹来验证密钥的真实性。此指纹可以发布在名片或网页版权信息中，或通过电话进行验证，从而使通信伙伴能够确保他们确实拥有正确的密钥。


    如今生成公钥/私钥密钥对非常简单，通常在使用 PGP 软件工具时会自动发生。然后，公钥可以单独或自动传输给通信伙伴。像 Thunderbird 这样的邮件程序提供了一键将公钥附加到出站电子邮件的功能。您也可以将公钥上传到公共
    PGP 密钥服务器，感兴趣的各方会自动在那里找到它。


    一旦密钥投入流通，就无法再删除，但在密钥被盗或密码丢失的情况下可以将其声明为无效。要声明密钥无效，您应提前生成吊销证书（即，在生成密钥后立即生成）并将其存储在您文件系统中的安全位置。如果您自己的密码丢失，您就不再拥有创建吊销证书的选项。此外，密钥不应无限期签发，而应分配一个几年后未来的过期日期。


    这些选项通常都可以在邮件程序的密钥管理器中找到。按鼠标右键调出您自己的密钥的属性及潜在操作（图 1）。


    仍有一个问题存在：最初无法验证某个密钥是否确实来自邮件地址的所有者。攻击者可以轻松地为任何邮件地址生成自己的 PGP 密钥并投入流通。因此，其他用户的公共
    PGP 密钥在您的密钥环中最初被视为不可信的。然而，发件人和收件人可以在那里显示特定的 PGP 指纹，并通过另一种通信介质（如有必要，通过简短的电话）进行验证。


    以上是理论部分。在实践中，如今许多用户直接使用他们收到的密钥而不进行验证。在大多数流行邮件程序的设置中，您可以定义密钥可用于发送的最低信任级别。这肯定不理想，并可能带来虚假的安全感。另一方面，使用任何形式的加密总比完全不加密要好，因此，如果仍有疑虑，只要采取务实的态度即可。如果收到的密钥在接收时被第三方操纵，且该受损密钥被永久信任，则该密钥是不安全的。但如果您假设密钥交换（这可能发生在很久以前）在当时是安全的，那么该密钥可以成功保护免受未来不受欢迎的读者和可怕的中间人攻击的影响。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_22_0.png)


    ## 电子邮件的现状


    由于手动检查不是处理大量通信伙伴的好方法，PGP 实现了信任网的概念。在对身份进行仔细的个人验证后，用户签署其他用户的密钥（图 2），从而提高其可信度。这些签名随后成为用户公钥的一部分（图
    3）。如果在某个时刻，由于许多已知可信通信伙伴的签名，密钥拥有足够良好的声誉，您可以省去自己的手动验证。即使今天，PGP 密钥签名聚会仍在会议上举行。您必须携带您自己的
    PGP 密钥，默认情况下还需要您的身份证或护照作为身份证明，因为仔细验证是必须的。


    然而，PGP 相互签名的概念很复杂，需要主动性，并且需要大量的交互——这是 PGP 从未获得广泛接受的主要原因之一。因此，现代方法设想通过由您的服务提供商运行的特殊密钥服务器发布您自己的
    PGP 密钥，通信伙伴可以自动从中获取它。虽然这种方法不能排除服务提供商管理员的操纵，但它确保密钥不再能被第三方任意生成和流通。使用如 WKS/WKD [3]
    等方法，域名所有者可以指定需要查询哪些 PGP 密钥服务器以获取其自己域名的密钥。然而，只有少数服务提供商系统地提供 PGP 密钥服务器，并为其邮件域名设置了相应的
    WKD 记录。如果做到了，自动密钥交换就没有任何障碍。像 GnuPG 这样的 PGP 实现可以自动检测正确的密钥服务器并下载密钥材料。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_23_0.png)


    图 2：签署第三方密钥会增加其可信度，并需要适当的谨慎。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_23_1.png)


    图 3：密钥的属性显示其指纹以及其他用户的签名。


    ## S/MIME：一种集中式方法


    S/MIME [4]，第二种已知的邮件加密方法，基本上以与 PGP 类似的方式加密和签名，但在密钥生成和管理方面采用更加集中的方法。S/MIME 证书由中央证书颁发机构签发、监控，并在必要时声明无效。因此，S/MIME
    适用于在高度受控环境中进行结构化使用，例如在政府机构或大型企业中。传统的商务邮件客户端如 Outlook 一直原生支持 S/MIME 也就不足为奇了。


    另一方面，S/MIME 对个人使用来说不太实用，因为最初没有合理的集中组织的证书颁发机构。多年前，储蓄银行曾通过 S-Trust 项目试图向大众发行 S/MIME
    证书，但这一举措并未流行起来。迄今为止最可行的方法似乎是 Volksschlüssel- 解决方案（大众加密）项目 [5]，该项目由弗劳恩霍夫协会 [6]
    运营，值得推荐，但尚未获得广泛接受。


    ## 未加密的元数据


    如果使用 PGP 或 S/MIME 对电子邮件进行加密，加密将影响电子邮件的整个正文，包括消息文本和任何文件附件。邮件头的元数据（即发件人、收件人等信息，

