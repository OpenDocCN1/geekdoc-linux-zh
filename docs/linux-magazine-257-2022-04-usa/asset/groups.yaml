    起初需要学习的内容很多，但有一些优秀的示例项目、良好的文档，甚至还有几个视频教程来帮助你入门。它比使用 Godot 或古老的 Adventure Game
    Studio 更容易，并且可能是让那些对编程或图形化程度较低的工具感到畏惧的人进入游戏开发领域的绝佳方式。它也非常适合协作，因为工作可以轻易地分为美术、音效设计、脚本编写和游戏设计，最终成果可以与任何人分享，甚至进行商业化。


