    \ Furthermore, no new or updated diction-aries or languages were added.\n\nIn\
    \ comparison, the release notes for Li-breOffice 7.3 [6], announced February 2,\
    \ 2022, included so many new features and improvements that a complete list would\
    \ be too long to include here."
  md: "\n## IN-DEPTH\n\n### Programming Snapshot – Rotating Photos with Go\n\n####\
    \ Listing 5: autorot.go\n\n```go\npackage main\n\nimport (\n    \"flag\"\n   \
    \ \"fmt\"\n    \"github.com/twcarns1n/goexif/exif\"\n    \"os\"\n    \"path\"\n\
    )\n\nfunc main() {\n    flag.Usage = func() {\n        fmt.Printf(\"Usage: %s\
    \ jpg-file\\n\", path.Base(os.Args[0]))\n        os.Exit(1)\n    }\n\n    flag.Parse()\n\
    \    if len(flag.Args()) != 1 {\n        flag.Usage()\n    }\n\n    jpgFile :=\
    \ flag.Arg(0)\n\n    f, err := os.Open(jpgFile)\n    if err != nil {\n       \
    \ panic(err)\n    }\n\n    data, err := exif.Decode(f)\n    if err != nil {\n\
    \        panic(err)\n    }\n\n    orient, err := data.Get(exif.Orientation)\n\
    \    if err != nil {\n        fmt.Printf(\"No orientation header found.\\n\")\n\
    \        os.Exit(0)\n    }\n\n    val, err := orient.Int(0)\n    if err != nil\
    \ {\n        panic(err)\n    }\n\n    switch val {\n    case 3:\n        imgMod(jpgFile,\
    \ jpgFile, rot180)\n    case 6:\n        imgMod(jpgFile, jpgFile, rot90)\n   \
    \ default:\n        panic(\"Unknown orientation\")\n    }\n}\n```\n\nUse `imgMod`\
    \ with the appropriate algorithm function as a parameter. The calls to `imgMod()`\
    \ in Listing 5 use identical names for the source and target files so `autorot`\
    \ simply overwrites the original files. If that seems too dangerous, you can rename\
    \ the target file to `.bak`, and you’re guaranteed no accidents.\n\nWhen Go’s\
    \ image library writes the JPEG image back to disk, it completely omits the original\
    \ Exif data, so there’s no longer an `orient` entry in the header there, indicating\
    \ correct rotation.\n\n#### Compiling the Program\n\nYou can use the command sequence\
    \ from Listing 6 to create the `autorot` binary. The `go` compiler fetches the\
    \ required libraries from GitHub, compiles them, and links them. As always, this\
    \ creates an executable that already contains all the dependencies. It can be\
    \ copied to another computer without any problems and will run there without any\
    \ complaints, given a similar operating system and processor architecture.\n\n\
    #### Listing 6: Compiling autorot\n\n```bash\n$ go mod init autorot\n$ go mod\
    \ tidy\n$ go build autorot.go rotate-90.go rotate-180.go imgmod.go\n```\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_55_0.png)\n\
    \n#### Conclusions\n\nThe program is by no means perfect yet. It’ll work for most\
    \ cases, but still lacks counterclockwise rotation and algorithms for more exotic\
    \ Exif values. But with the described basics, these features can easily be added.\
    \ As always, Go imposes no limits on the hobbyist here.\n\n**Info**\n\n1. Listings\
    \ for this article: [http://ftp.linux-magazine.com/pub/listings/linux-magazine.com/257](http://ftp.linux-magazine.com/pub/listings/linux-magazine.com/257)\n\
    2. “Manipulating Stored Geocoordinates in Cellphone Photos” by Mike Schilli, Linux\
    \ Magazine, issue 240, December 2020, [https://linux-magazine.com/issues/2020/240/Obfuscation-Filter](https://linux-magazine.com/issues/2020/240/Obfuscation-Filter)\n\
    \n---\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_56_0.png)\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_56_1.png)\n\
