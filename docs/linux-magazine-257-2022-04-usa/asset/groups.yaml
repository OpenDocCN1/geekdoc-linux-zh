    \ Eventually the question will probably have to be resolved. But for now, there\
    \ are just these faint rumblings.\n\n### Maintaining GitHub Kernel Forks\n\nKonstantin\
    \ Komarov from Paragon submitted an NTFS patch – or rather, he requested that\
    \ Linus Torvalds pull the patch from Paragon’s GitHub tree. Linus replied, saying:\n\
    \n> “For github accounts (or really, anything but kernel.org where I can just\
    \ trust the account management), I really want the pull request to be a signed\
    \ tag, not just a plain branch.\n> \n> In a perfect world, it would be a PGP signature\
    \ that I can trace directly to you through the chain of trust, but I’ve never\
    \ actually required that.\n> \n> “So while I prefer to see a full chain of trust,\
    \ I realize that isn’t always easy to set up, and so at least I want to see an\
    \ ‘identity’ that stays constant so that I can see that pulls come from the same\
    \ consistent source that controls that key.”\n\nA few minutes later, he replied\
    \ to his own email, saying he would just pull the tree this time to avoid delay,\
    \ but he asked Paragon to set up PGP and start using signed tags moving forward.\n\
    \nOn a related note, Linus added:\n\n> “I *notice* that you have a github merge\
    \ commit in there.\n> \n> *That’s* another of those things that I *really* don’t\
    \ want to see – github creates absolutely useless garbage merges, and you should\
    \ never ever use the github interfaces to merge anything.\n> \n> *This* is the\
    \ complete commit message of that merge:\n\n```\nMerge branch 'torvals:master'\
    \ into master\n```\n\n> “Yeah, that’s not an acceptable message. Not to mention\
    \ that it has a bogus ‘github.com’ committer etc.\n> \n> *github* is a perfectly\
    \ fine hosting site, and it does a number of other things well too, but merges\
    \ is not one of those things.\n> \n> “Linux kernel merges need to be done *properly*.\
    \ That means proper commit messages with information about what is being merged\
    \ and *why* you merge something. But it also means proper authorship and committer\
    \ information etc. All of which github entirely screws up.\n> \n> *We* had this\
    \ same issue with the ksmbd pull request, and my response is the same: the initial\
    \ pull often has a few oddities and I’ll accept them now, but for continued development\
    \ you need to do things properly. That means doing merges from the command line,\
    \ not using the entirely broken github web interface.”\n\nThere was no discussion\
    \ or controversy following Linus’s posts. The interesting thing is that the signature\
    \ issue is not hypothetical. Linus had to endure some legal hassles a few years\
    \ back over licensing issues surrounding various patches. Consequently, patch\
    \ signing became the standard way to trace all patches back to an origin point\
    \ for licensing verification purposes.\n"
