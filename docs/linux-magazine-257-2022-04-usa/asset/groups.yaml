    ## 密码学与可证明安全性


    在这个例子中，假设 Alice 想要将一个文件 $m$ 加密后存储到云端。为此，她使用该消息和一把公钥。出于效率考虑，云运营商不希望存储相同消息的副本。然而，由于文件已经被加密，运营商无法轻易判断该消息是否已经以加密形式存在于云端。


    为此，密文被扩展以包含消息的哈希值：$c = (Enc(pk, m), H(m))$。哈希函数是一种确定性函数，通常会对输入进行压缩。该函数的安全性基于抗碰撞性。这一属性意味着，（高效地）找到两个不同的消息
    $m_1$ 和 $m_2$ 从而产生相同的输出 $(H(m_1) = H(m_2))$ 是不可能的。


    直观上，你可能会期望由于压缩特性，哈希值不会泄露关于消息 $m$ 的任何信息。然而，没有安全属性涵盖这一假设。事实上，对该构造的分析表明它是完全**不安全的**。特别是，哈希函数的输出可以被用来完全覆盖加密的安全属性。


    这个简单的例子说明，两种安全密码方法的组合可能导致不安全的构造。只有当你确实需要每种方法的安全属性时，才应将密码方法组合使用。正是底层属性与你希望达到的属性之间的这种关系，由形式化证明来展示。


    ## 当前研究课题


    在密码学研究领域，仍有无数未解决的问题。从主题上看，它在基础理论研究和应用实践研究之间不断演变。本节介绍两个当前的研究领域。


    一个是基于口令的密码学。口令是现代许多系统的阿喀琉斯之踵，因为它们结合了密码学家通常不希望具备的所有特征：它们很短且熵值很低，这意味着攻击者只需简单地尝试即可破解大多数口令。这种攻击被称为离线暴力破解攻击。公钥密码术发明之后，许多人推测口令将消亡，每个人都将
    exclusively 使用私钥进行身份认证。但迄今为止，这种情况并未发生，而且看来口令在长期内仍将是互联网上最常见的身份认证技术。在研究中，这引出了以下问题：即使系统使用像口令这样的弱秘密，如何保证系统的安全性？


    在此背景下，口令强化和口令强化加密（PHE）应运而生（图 4）。该想法主要基于以下考量：

    - 首先，用户界面必须保持不变，因此他们继续使用该用户名和口令进行身份认证。

    - 其次，用户的数据必须能够抵抗离线暴力破解攻击——即使数据库被窃取。

    - 第三，为了做到这一点，你需要一个外部的加密服务，该服务不能直接访问数据，但仅提供加密和解密数据的操作。


    口令强化加密实现了此前无法达到的安全级别。首次，用户的数据可以安全地存储以抵抗离线暴力破解攻击，而用户无需使用复杂的公钥技术。


    第二个研究重点是针对加密数据的计算。为了更好地理解如何对加密数据执行计算，请考虑常规加密是如何工作的。


    无论加密方法的类型如何，每种方法本质上都提供密钥生成、加密和解密。由于密钥生成在以下考量中不起作用，我不深入讨论此过程的细节。


    在密码学中，加密操作是将可读文本——即明文——转换为不再泄露有关明文任何信息的形式的过程——即密文。图 5 可视化了加密和解密操作。加密算法 Enc 接收消息
    $m$ 和公钥 $pk$ 作为输入。计算的结果是密文 $c$。解密算法 Dec 用于再次解密。作为输入，它需要私钥 $sk$ 和密文 $c$。


    为了描述同态加密方法，你首先需要理解同态的概念。它源自数学，意味着保持结构不变的映射。简而言之，这意味着你可以将一个结构中的计算执行映射到另一个结构中的计算。结构本身保持不变。


    现在，同态概念被应用于加密方法。这意味着在未实际解密密文的情况下对密文执行计算。此操作的特殊之处在于，尽管在此计算期间明文不可用，但明文的计算会影响密文。根据加密类型，密文的组合作为加法或乘法应用于明文。加法操作被称为加性同态加密，乘法操作被称为乘性同态加密。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_30_0.png)


    图 5 的右半部分展示了这一过程。你可以在左侧看到两个密文 $C_1$ 和 $C_2$。它们是以常规方式计算的：即 $C_1$ 是加密消息 $m_1$ 与公钥
    $pk$ 的结果，而 $C_2$ 是加密消息 $m_2$ 与公钥 $pk$ 的结果。这两个密文现在通过计算 $x$ 进行组合。举例来说，我首先使用公钥 $pk$
    加密数字 2：$C_1 := Enc(pk, 2)$。生成的密文称为 $C_1$。在第二步中，我对数字 3 执行相同的步骤：$C_2 := Enc(pk,
    3)$ 以生成密文 $C_2$。第三步现在通过应用操作 $x$ 将这两个密文连接起来：$C_3 := C_1 x C_2$。如果加密方法是加性同态方法，则密文
    $C_3 = C_1 x C_2 := Enc(pk, 2) x Enc(pk, 3) = Enc(pk, 2 + 3) = Enc(pk, 5)$ 包含值为
    5。如果过程是乘性同态，则 $C_3 = C_1 x C_2 := Enc(pk, 2) x Enc(pk, 3) = Enc(pk, 2 \cdot 3)
    = Enc(pk, 6)$ 包含值为 6。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_30_1.png)


    ![](img/8286bf901ba268fe114d66ada92d1dd6_31_0.png)


    在这两种情况下，只有私钥 $sk$ 的拥有者才能访问计算结果，因为只有他们才能解密密文 $C_3$。加性同态加密的一个例子由 ElGamal 方法 [2]
    提供，而 Paillier 方法 [5] 是乘性同态的。


    与之前的方法相比，全同态加密允许在密文上执行任意计算。为了更好地理解它是如何工作的，图 6 显示了各个步骤。首先，明文 $m$ 使用公钥 $pk$ 加密 (a)，生成密文
    $C$。现在执行计算 (b)；密文 $C$、公钥 $pk$ 和程序描述 $P$ 流入其中。计算结果是密文 $C_p$，计算结果为 $Eval(pk, C,
    P) = C_p = Enc(pk, P(m))$。


    与前面的例子一样，任何人都可以对密文 $C_p$ 执行计算，因为这不需要任何秘密信息。然而，只有相关私钥 $sk$ 的拥有者才能计算结果。全同态加密是一种极其强大的工具，因为对程序
    $P$ 没有限制。这意味着可以对加密数据执行任意计算。在加密数据上执行计算大大减少了对存储数据方的信任需求。例如，你可以将数据外包给云服务，该云服务持有数据并执行计算而无需解密。执行计算的服务无需查看明文数据甚至计算结果。数据所有者仍然掌控数据。


    ## 结论


    本文向你介绍了可证明安全性，这是现代密码学的基石之一。你还了解了一些令当今密码学家感到兴奋的近期研究课题。


    密码学已存在数千年，但它仍能令人兴奋，且最先进的加密技术听起来仍然像纯粹的魔法。例如，谁会想到在加密的（基因）数据上进行计算竟然可行？但密码学仍处于起步阶段，未来的密码技术无疑将继续让我们感到惊讶。


