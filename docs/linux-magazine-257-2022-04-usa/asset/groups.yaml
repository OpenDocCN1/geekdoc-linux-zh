    *pi test* 程序简要测试了该设置；它为您提供了对 RevPi Core 所有接口的读写访问权限。如果您不带任何参数启动该工具，它将列出所有选项。列表
    1 给出了使第一盏 DMX 灯显示红色、第二盏显示绿色所需的命令。


    前两个命令将两盏灯的主调光器完全调亮；随后的两个命令对颜色做同样的处理。虽然可以写入 0 到 255 之间的值到通道，但灯光强度每 16 个值才变化一次，尽管这在
    DMX 中并不普遍，仅适用于这些廉价灯具。


    *pi test* 程序每次都会输出 RevPi Core 过程映像中的偏移量。过程映像代表了设备的所有接口。您可以


