    \n一个名为可证明安全的概念将数学的严谨性带入了密码学的艺术中。\n\nBy Dominique Schröder\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_27_0.png)\n\
    \n密码学最初是一种神秘的艺术形式，旨在向未经授权的人隐藏信息。例如，盖尤斯·尤利乌斯·恺撒大约在公元前 100 年开发了一种加密消息的简单方法。该方法的基本思想是将消息中的每个字母在字母表中移动固定的数量。这个位置然后作为秘密密钥。例如，如果恺撒想用密钥\
    \ 3 加密 Veni, vidi, vici，结果将是密文 Yhgl, yhgl, yhfl。\n\n然而，该方法很快被识破，随后被改进，再次被破解，如此循环。就这样，随着时间的推移，加密方法的设计者和为获取秘密信息而破解这些方法的攻击者之间形成了一种猫鼠游戏。这种状态一直持续到\
    \ 1980 年代可证明安全的发现。\n\n可证明安全是一个通过数学证明来评估系统安全性的领域。人们常以为密码学是一片数字的海洋和巨大的数字，确实如此；然而，对于数学家来说，目标是扫除细节，以逻辑证明所适用的方式对系统进行符号化定义。可证明安全的发展为古老的密码学实践带来了严谨性，而密码学曾被认为更偏向艺术而非科学。\n\
    \n本文将向你介绍可证明安全的概念，并通过电子邮件通信的示例分析来应用这些原则。我还会描述密码学方法使用中的一些典型错误，以及可证明安全的优势和局限性。最后但同样重要的是，我将使用实际例子来说明现代密码学领域的当前研究课题。\n\
    \n### 可证明安全：六个步骤\n\n根据安全设计原则，可证明安全流程有六个步骤，如图 1 所示。\n\n#### 步骤 1：描述功能\n\n第一步是描述系统的功能\
    \ – 预期用途是什么？这种描述通常采取需求规格说明书的形式。\n\n#### 步骤 2：定义安全属性\n\n定义安全特性的任务通常有两部分。首先，你需要以一种每个人都能理解的方式描述安全目标。之后，你需要精确地形式化所有内容，以避免模糊的解释。\n\
    \n请注意，形式化安全案例仅适用于形式化描述。因此，这种形式化必须尽可能精确地分解实际保护目标。通常，这一步涵盖以下方面：系统需要提供什么安全属性？我们谈论的是具有什么配置的哪些系统？我们需要防范哪类攻击者？他们的能力是什么？何时认为攻击成功？\n\
    \n识别和形式化安全属性是一项具有挑战性的任务，许多密码学方案尚未找到合适的安全模型。例如，研究界尚未就认证加密的定义达成一致 [1]。此外，效率和安全性之间始终存在自然的竞争状态。\n\
    \n"
