    \ OpenOffice**\n  是克隆还是远房亲戚？\n- **68** **树莓派灯光秀**\n  使用 DMX 照明技术让派对开始吧。\n- **76**\
    \ **Linux 中的 NVIDIA 驱动程序**\n  绝望者的帮助。\n- **88** **Matplotlib**\n  使用这个 Python\
    \ 可视化库，一眼就能得到答案。\n\n# 新闻\n\n- **08** **新闻**\n  - Zorin OS 16 教育版现已推出\n  - System76\
    \ 发布 AMD 驱动 Kudu 笔记本电脑\n  - Ubuntu Budgie 瞄准游戏玩家\n  - Linux Mint Edge 已准备就绪，支持最新硬件\n\
    \  - Linux 内核 5.17 代码合并窗口已关闭\n  - 所有主要 Linux 发行版中发现另一个严重缺陷\n- **12** **内核新闻**\n\
    \  - “文件系统”系统\n  - 维护 GitHub 内核分支\n  - 是进入还是退出？\n\n# 封面特写\n\n- **16** **磁盘加密**\n\
    \  加密卷早已不再是例外或奢侈品。公司政策和合规规则通常要求对关键数据进行加密。本文介绍了 Linux 上用于磁盘加密的工具。\n- **22** **电子邮件现状**\n\
    \  电子邮件加密并不难——而且现在比以往任何时候都更重要。我们来看看电子邮件加密的一些重要工具和趋势。\n- **28** **密码学与可证明安全**\n\
    \  一种称为可证明安全的概念将数学的严谨性带入密码学的艺术中。\n\n# 评测\n\n- **34** **发行版漫步 – deepin**\n  Deepin\
    \ 提供了一款视觉效果震撼的操作系统，有一些独特的怪癖。\n\n# 深入探讨\n\n- **38** **Reaper**\n  寻找专业数字音频工作站的\
    \ Linux 用户现在可以利用 Reaper 丰富的功能集了。\n- **44** **命令行 – watch 和 fswatch**\n  两个监控工具，watch\
    \ 和 fswatch，让你可以从命令行收集系统信息。\n- **46** **Charly 的专栏 – FIGlet 的告别**\n  在担任系统管理员专栏作家二十年后，Charly\
    \ 用一个用 FIGlet 创建的登录横幅做出了恰当的告别。\n- **47** **Checkmk**\n  我们将向你展示如何使用 Checkmk 开源监控工具来监控你的家庭路由器。\n\
    - **52** **编程快照 – 使用 Go 旋转照片**\n  出于效率原因，手机通常将照片倒置或横向存储，并在 Exif 元数据中记录这一事实。然而，并非所有应用程序都能处理这种情况。Mike\
    \ Schilli 转向 Go 使该过程万无一失。\n\n"
