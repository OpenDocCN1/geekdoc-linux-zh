    \ `jimg.At(x,y)` 获取原始像素值。为了旋转图像，它将该值存储在为新创建的、可修改的照片 `dim` 中镜像位置 x1, y1 处。该位置是根据\
    \ x0 到图像右边缘或 y0 到下边缘的距离计算得出的。该算法有效地将图像在水平和垂直中心线处进行镜像，从而实现所需的倒置效果。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_52_1.png)\n\
    \n数字照片最终是一个 m 乘 n 的像素值矩阵。要将其倒置（即执行 180 度旋转），算法只需交换中心线上下的像素值。图像中像素的 X 值传统上是从左到右运行的，而\
    \ Y 值则从顶部到底部增加。这意味着照片的原点可以指定为左上角的 (0, 0)，而右下角位于坐标 (w-1, h-1) 处，其中 w 指定图像宽度，h 指定图像高度，单位均为像素。\n\
    \n## 双重翻转\n\n但请注意：如果你简单地交换 Y 值进行旋转，最终会得到原照片的镜像。相反，对于 180 度旋转，较小的 X 值（左上角的像素）需要放到右下角。这意味着旋转算法需要同时镜像\
    \ Y 值和 X 值。因此，位于图像上半部分坐标为 (x0, y0) 的像素最终会落在图像下半部分的 x1, y1 位置。y0 到中心线的距离等于 y1 到中心线的距离。\n\
    \n## 可写副本\n\n当 Go 从磁盘读取 JPEG 照片时，它通常会得到一个不可修改的像素数组。但由于算法想要操纵照片，Listing 2 中的第 11\
    \ 行首先使用 `NewRGBA()` 创建了一个与原始照片尺寸相同但内容为空的可写照片。然后 `rot180` 函数持续调用 `jimg.At()` 获取原始照片的所有像素，并通过\
    \ `Set(x,y,Value)` 将它们逐个镜像传输到目标照片中。第 19 行将完成的旋转图像作为指针返回给调用它的 main 程序。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_52_2.png)\n\
    \n**Listing 2: rotate-180.go**\n\n```go\n01 package main\n02\n03 import (\n04\
    \ \"image\"\n05 )\n06\n07 func rot180(jimg image.Image) *image.RGBA {\n08 bounds\
    \ := jimg.Bounds()\n09 width, height := bounds.Max.X, bounds.Max.Y\n10\n11 dim\
    \ := image.NewRGBA(bounds)\n12\n13 for y := 0; y < height; y++ {\n14 for x :=\
    \ 0; x < width; x++ {\n15 dim.Set(width-1-x, height-1-y, jimg.At(x, y))\n16 }\n\
    17 }\n18\n19 return dim\n20 }\n```\n\n这涵盖了在内存中旋转照片 180 度的算法。但是，磁盘上以 JPEG 格式压缩的图像最初是如何进入\
