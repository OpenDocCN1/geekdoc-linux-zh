    \n# ### Pomodoro widget\n\n# Fokus\n\nIf Broadsheet has got you thinking about\
    \ removing distractions from your work environment, another tried and tested method\
    \ is the Pomodoro technique. This is a time-management hack developed by Francesco\
    \ Cirillo in the 1980s, and it’s often accompanied by a timer in the shape of\
    \ a tomato (pomodoro is Italian for tomato). The process simply asks you to focus\
    \ on a single task for a set period of time, usually 25 minutes, without letting\
    \ yourself be distracted by other things. The contemporary distractions of the\
    \ ’80s would be benign by modern standards, being perhaps a Rubik’s cube, Newton’s\
