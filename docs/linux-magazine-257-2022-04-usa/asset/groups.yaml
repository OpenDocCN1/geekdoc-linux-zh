    \n### 作者简介\n\nMartin Mohr 自幼便对一切闪烁的事物充满热情，这种热情因他作为电子技术员学徒的经历而得到加强。在计算机科学专业毕业后，他主要开发\
    \ Java 应用程序，但树莓派重新点燃了他对电子学的热爱。\n\n## 说 Linux 和 NVIDIA 关系紧张未免言过其实。\n\n庞大的 NVIDIA\
    \ 公司以显卡和其他计算机硬件组件闻名，在 Linux 兼容性方面有着长期不善合作的历史。情况比过去好了一些——如今至少存在一些 Linux 驱动程序——但大多数驱动程序都是专有的，该公司并未投入太多精力向\
    \ Linux 用户展示如何使用其硬件。在本期的 Linux Voice 中，我们将帮助你使用通过 Ubuntu 提供的工具和资源在 NVIDIA 驱动程序“汤”中游泳。此外还有：你将迈出使用\
    \ Matplotlib 的第一步，这是一个用于制图和其他数据可视化任务的开源 Python 库。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_72_0.png)\n\
    \n# LINUXVOICE\n\n**Doghouse – 物联网对开放性的需求**  \nJon “maddog” Hall  \n75  \n封闭式物联网设备可能会使用未预期的带宽“上报数据”，这表明需要自由设备，以让用户对其家庭小工具和\
    \ WiFi 使用拥有更多控制权。\n\n**Linux 中的 NVIDIA 驱动程序**  \nAdam Dix  \n76  \n基于终端的解决方案有助于缓解安装\
    \ NVIDIA 驱动程序的挫败感。\n\n**FOSSPicks**  \nGraham Morrison  \n80  \n本月 Graham 介绍了\
    \ Blender 3.0、wobb、Fokus、bat、GNU poke、Bladecoder 冒险引擎、Crispy Doom 等更多内容！\n\n**教程\
    \ – Matplotlib**  \nMarco Fioretti  \n88  \n在你的 Python 程序中加入发光的图表。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_72_1.png)\n\
