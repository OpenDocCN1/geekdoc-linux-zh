    ## Veracrypt Cross-Platform Compatibility


    Of course, a combination of Cryptsetup and LUKS has one major disadvantage: It
    offers virtually no interoperability with other operating systems. You''ll need
    a way to deal with a kind of chicken-and-egg problem. When LUKS and Cryptsetup
    were just gathering speed, there were already solutions that worked equally well
    on all the major operating systems. These alternative solutions are not as deeply
    integrated into the system, but they work across operating system boundaries,
    and not just on Linux.


    One such solution is Veracrypt, which works on various operating systems. On Linux,
    for example, Veracrypt directly relies on Dm-crypt. However, it also ensures that
    the containers and data carriers created remain mutually compatible across operating
    system boundaries. An admin with the data medium and the corresponding key can
    mount existing devices with Veracrypt encryption on Windows, Linux, and macOS
    in the same way. Veracrypt is therefore particularly suitable for users who frequently
    switch from Linux to Windows and back, for example, because they use different
    systems on their home and work computers.


    ### Remembering Truecrypt


    An article about disk encryption under Linux would be incomplete without mentioning
    Veracrypt [2] and its famous predecessor. Veracrypt emerged from Truecrypt in
    2013. At that time, Truecrypt was considered by many observers in the Linux world
    to be the only valid alternative to the combination of Cryptsetup and LUKS on
    Linux.


    ### Plausible Deniability


    Another decidedly handy feature in Veracrypt is the ability, inherited from its
    predecessor, to nest encrypted drives and thus achieve what security researchers
    call *plausible deniability*. Plausible deniability offers a means for concealing
    data without it looking like you are concealing data. The idea is to completely
    hide the existence of encrypted data. The attacker doesn''t even know that data
    is being withheld and, according to the theory, doesn''t even think of asking.


    Truecrypt development came to an end as a result of an audit in 2014, and it was
    the "Truecrypt developers themselves who warned people not to use their own software.
    Shortly thereafter, the developers provided a new and final version of Truecrypt,
    which was massively limited in terms of its functionality. According to the developers,
    this final release was only intended to convert existing setups into Bitlocker
    setups with Microsoft''s standard encryption.


    Veracrypt supports plausible deniability by creating multiple nested containers
    on a drive. The first container and its signature on the disk are easily recognizable
    from the outside. However, because this container contains only ostensibly relevant
    data when handled correctly, the owner of the drive can hand over the key (Figure
    3). The second volume hides its header in the header of the first volume. You
    need to know that it exists if you are able to open it, because from the outside,
    it looks like random data. And its existence can be easily explained by the existence
    of the first encrypted volume.


    The end of Truecrypt caused wild speculation in the community, which even considered
    the involvement of intelligence agencies. This speculation did not subside when
    additional audits completed retrospectively found no significant problems in the
    way Truecrypt worked. The actual reason for Truecrypt''s end will probably never
    be clarified.


    ### Truecrypt''s Heir


    Veracrypt, which had spun off from Truecrypt a year earlier as an independent
    project, became Truecrypt''s de facto successor. All in all, Veracrypt is a highly
    functional data carrier encryptor from today''s point of view.


    One huge advantage that Veracrypt inherited from its ancestor is that it works
    on Windows, Linux, and macOS (Figure 2). It uses the existing infrastructure to
    the extent possible on the


    ![](img/8286bf901ba268fe114d66ada92d1dd6_16_0.png)


    Figure 2: Encrypted drives created in Veracrypt can be used on Windows, macOS,
    or Linux systems.


    ### Easy to Use


    If you are looking for a quick solution for encrypted data media, Veracrypt is
    the right choice. After the install, which you handle with the package manager
    on Linux and with the installer on Windows and macOS, a wizard opens in the form
    of a graphical interface. The wizard guides you through the entire creation process.
    Veracrypt offers the option of creating encrypted containers on the file system
    or encrypting entire block devices.


    No matter which approach you choose, any system administrator worth their salt
    should have no difficulty understanding and responding to Veracrypt’s questions.
    If you have never dealt with disk encryption previously, you might not find Veracrypt
    particularly user-friendly. However, if you have been in the saddle for a while
    longer, you will get along well with the program on all supported platforms.


    On Windows, Veracrypt now even goes one step further and can keep a hidden operating
    system in an encrypted drive. From the outside, this drive looks like a normal
    data medium, but under the hood, it hides a complete system partition.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_17_0.png)


    ## GocryptFS


    Another state-of-the-art tool for encrypted disks on Linux is GocryptFS [3]. GocryptFS
    also owes its existence to an earlier system that lost its shine for the FOSS
    community: EncFS.


    EncFS came under fire when something happened to it during an audit that should
    never happen to an encryption solution. The testers detected a vulnerability in
    the source code that, in the worst case, allowed the key used for encryption to
    be computed. This danger existed with EncFS especially when attackers got their
    hands on several versions of the encrypted container. The actual key could then
    be found out by simple matching and an exclusion procedure. Basically, since this
    incident, EncFS has been under fire from everyone concerned with security and
    encryption (Figure 4).


    However, Austrian Jakob Unterwurzacher found the idea behind EncFS so convincing
    that he set about creating a new implementation. In doing so, he worked with the
    Go programming language, which not only explains the program’s name, but also
    translates to considerable speed advantages in practice compared to the previously
    used C++. The use of FUSE remains unchanged, so GocryptFS (Figure 5) can be used
    on any Linux system with an activated FUSE environment.


    Because FUSE is also available for Windows, GocryptFS also works on Windows systems.
    With its own wrapper, however, the solution goes by the name of CpcryptFS, and,
    as the name suggests, the Windows version of GocryptFS is written in C++ instead
    of Go. macOS users are less fortunate: macFUSE does exist, but it is not available
    under a free license. The FOSS community therefore tends to avoid the tool. In
    the meantime, however, an alternative has been devised that takes GocryptFS to
    macOS, too, although some special functions have been dropped.


    If you don’t want to use GocryptFS on the command line, you can turn to StiriKali,
    which offers a graphical user interface for GocryptFS and its predecessor EncFS.


    ### What GocryptFS Offers


    As described, GocryptFS always creates complete, encrypted containers in a file
    or on a disk. Basically, GocryptFS is designed as an overlay file system. In


    ![](img/8286bf901ba268fe114d66ada92d1dd6_17_1.png)


    ![](img/8286bf901ba268fe114d66ada92d1dd6_18_0.png)


    normal operating mode, you enable a GocryptFS container, write something to it,
    disable the container again, and then the encrypted content appears as such on
    the underlying file system. Creating a GocryptFS overlay is quick and easy with
    the help of the documentation.


    GocryptFS offers a second option, known as reverse mode, for storage targets that
    are implicitly insecure. If you want to store your backups in the cloud, for example,
    you can activate reverse mode in GocryptFS. Reverse mode exposes the encrypted
    data directly so that you can copy it to another location.


    GocryptFS is about as simple as Veracrypt, however, GocryptFS offers a clear speed
    advantage. At least subjectively, there are considerable differences when encrypting,
    and these differences are despite the fact that Veracrypt and GocryptFS support
    acceleration for the various crypto algorithms in the same way. If you want to
    manage encrypted data, you will definitely want to take a look at GocryptFS.


    ## Universal GUI: Zulucrypt


    The final candidate in this encryptors showcase is a program that does not actually
    do the encryption work itself. Zulucrypt [4], together with Zulumount, which is
    included with it, is more concerned with organizing the proliferation of encryption
    methods available under Linux. Zulucrypt (Figure 6) promises to unify classic
    crypt setups with LUKS, Veracrypt, and GocryptFS in a single interface.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_18_1.png)


