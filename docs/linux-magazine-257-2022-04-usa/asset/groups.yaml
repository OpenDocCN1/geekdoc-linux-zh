    ## 灵活的 HiFiBerry 替代旧音频放大器


    ### 音乐派


    **HiFiBerry HAT**（扩展板）、配套系统以及 **Raspberry Pi**（树莓派）与两个旧扬声器结合，创造出一台当代风格的便携式收音机。作者：Tim
    Schürmann


    ![](img/8286bf901ba268fe114d66ada92d1dd6_61_0.png)


    当我那台可靠的音频放大器因杂音、嘶嘶声和声音中断而彻底损坏时，Hi-Fi 系统中的扬声器和 CD 播放器仍然完美工作。我的想法是用价格合理的 Raspberry
    Pi 来替换损坏的模块。如果它能够通过蓝牙接收音乐，那么我的所有家庭成员都可以从智能手机向其发送音乐，而无需离开沙发。


    HiFiBerry 系列的一个堆叠扩展板（piggyback board）与 Raspberry Pi 上的配套系统结合，取代了这个旧式的音频放大器。该系统可以播放通过蓝牙或其他方式发送的音乐，并且你可以在浏览器中方便地控制它。然而，构建和设置过程中存在一些陷阱，运行中也有几个小怪癖。


    这样的设置在企业会议室也很有用：演讲者可以将 Raspberry Pi 的音频输出流式传输到扬声器，无需布线，甚至无需离开座位。


    ### Hi-Fi 莓果


    当然，Raspberry Pi 只有一个模拟音频输出，且以出色的音质而闻名并非其特长。瑞士公司 Modul 9 在此伸出了援手，该公司在 HiFiBerry
    品牌下为小型板计算机（SBC）提供各种放大器。你只需将小板连接到 Raspberry Pi 的 GPIO 端口，并将扬声器线缆插入提供的插座——这就足够了。


    该公司还提供了自己的操作系统（OS）HiFiBerryOS，它承诺便捷的硬件启动，并在启动后立即作为一个小型音频中心发挥作用。除其他功能外，它接收通过蓝牙和
    AirPlay 或连接存储设备发送的信号，并可以在浏览器中控制。其底层是一个经过定制的 Linux 系统，预配置了服务。详情可参见“繁琐的手动步骤”专栏。


    ### 繁琐的手动步骤


    Raspberry Pi OS 自带所有 HiFiBerry 产品所需的驱动程序。因此，你可以不使用 HiFiBerryOS，而是使用 Raspberry
    Pi OS 并手动安装所有必需的服务。然而，即使是设置蓝牙也可能让你头疼并耗费半个周末。如果你仍想尝试，你可以在线找到说明 [1]。


    虽然妥善关闭 Raspberry Pi OS 是有意义的，但大多数人只是通过电源开关来开启或关闭收音机或 hi-fi 系统。为了让这成为可能，你需要让系统完全在主内存中运行。然而，设置此类配置既耗时又复杂。使用
    HiFiBerryOS 能让你更快地达成目标，并且更令人省心。


    中间的 DAC+ ADC 随后生成音频信号，并将其通过顶部的 AAMP60 放大器传递给扬声器。这对设备目前的成本为 €595（£110/EUR85）。AAMP60
    的性能与 Amp2 相同。然而，与 Amp2 不同，AAMP60 需要 DAC+ ADC 或其他兼容的 HifiBerry 声卡。


    ### 其他配件


    AAMP60、Amp2 和 Beocreate 均配有外部电源连接器。四欧姆扬声器需要额定功率为 12V-18V 的电源；对于八欧姆扬声器，开发人员建议你使用
    18V。


    根据数据手册，Amp2 最高可承受 24V，AAMP60 可承受 20V。如果你想确保万无一失，请在 HifiBerry 商店购买相应板卡时匹配相应的电源。Amp2
    和 Beocreate 为 Raspberry Pi 供电；AAMP60 此外还为 DAC+ ADC 供电。因此，Raspberry Pi 不需要自己的电源。


    要通过蓝牙播放音频材料，你还需要一个 USB 适配头。例外情况是 Raspberry Pi 3B+ 和 4。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_62_0.png)


    图 1：Amp2 板载包含一个小型 DAC+ 声音模块，因此所有信号处理都在板上进行，无需其他硬件。


    ### 硬件动物园


    Modul 9 提供多种适用于不同用途的音频放大器。售价 $22（£20/EUR15）的 MiniAmp [2] 专为小巧的 Pi Zero 设计，只有两个
    3W 输出，虽然足以应对小型 PC 扬声器，但对于客厅音响系统来说性能不够好。


    幸运的是，一款名为 Amp2（图 1）的多用途利器 [3] 售价为 $55（£54/EUR46）。该放大器具有两个额定功率为 30W 的输出，起初听起来可能不多，但这块小板确实让下一层的邻居听硬摇滚时感到“开心”（略带调侃）。


    MiniAmp 和 Amp2 一次只支持两个扬声器。如果你想连接更多扬声器，你可以购买售价 $190（£175/EUR160）的 Beocreate 4 通道放大器
    [4]。顾名思义，它总共提供四个通道，其中两个连接甚至可以提供 60W。此外，Beocreate 拥有一个数字信号处理器，如有需要，你可以在 HifiBerryOS
    中为音频信号应用各种效果。不幸的是，该公司不提供环绕声解决方案。


    所有这些板卡都不带音频输入，但为了继续使用旧的 CD 播放器，你需要在 HifiBerry 宇宙中拥有一块带有输入功能的模拟声卡。对于这个项目，我选择了 DAC+
    模数（ADC）转换器 [5]，直接配合 AAMP60 放大器 [6]。然而，与 Amp2 不同，它没有自己的声卡，因此你需要将两块 HifiBerry 板堆叠在
    Raspberry Pi 上（图 2）。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_62_1.png)


    图 2：AAMP60 需要一个兼容的 HifiBerry 声卡。这里，DAC+ ADC 直接插在下方的 GPIO 端口上，AAMP60 位于其上方。

