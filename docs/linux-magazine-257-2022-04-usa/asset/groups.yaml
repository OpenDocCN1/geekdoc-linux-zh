    你可以使用修饰键来加快操作速度。其他 DAW 也使用 Shift、Alt 或 Ctrl。然而，Reaper 更加一致，并为每个控制元素提供至少一项附加功能，通常甚至有两三项。我最喜欢的是通过
    Alt 加左击来删除标记、FX 插件或自动化点，并在 MIDI 编辑器中启用橡皮擦工具。Ctrl 键会暂时启用铅笔工具，在编辑器中绘制空 MIDI 事件、在自动化轨道中绘制手动曲线，或在
    MIDI 编辑器中一次性改变速度。


    右击也为几乎所有原本隐藏在菜单栏中的功能提供了上下文菜单。像播放按钮、独奏按钮或工具栏按钮这样的控件，你可以从众多附加功能中选择。在这个意义上，上手的座右铭是：尝试一切，并对发生的事情感到惊讶。


    Reaper 还为速度变化提供了一种非常巧妙的解决方案。可以通过双击或按 F2 在事件偏好设置中手动设置事件的播放速率。在事件边缘按 Alt 加左击可以平滑地拉伸或压缩事件。根据左上角标准工具栏中“磁吸功能”的设置，事件会粘附到可见的网格上，如果需要，可以通过
    Shift 键暂时禁用此功能。在这里，选择的自由度至关重要。


    ## 主题


    Reaper 允许用户开发完全定制的主题，为那些喜欢设计自己桌面的人提供了一个游乐场。默认界面良好且始终可用，但缺乏特色。根据你的需求，你可以从头开发自己的主题，或使用
    Reaper 用户提供的现有主题（图 4）。有关构建自定义主题的说明可以在 Reaper 论坛的主题板块中找到一个置顶帖子。在 Reaper 主页上，“Slash”链接会带你到一个仓库
    [3]，在那里你可以交换除主题之外的其他有用资源。


    一些开发者还通过论坛出售他们的主题。有些人采取完全个性化的方法，但它们也可能是 Pro Tools、Logic Pro 或 House of White Imperial
    [4] 主题（图 5）的复制品，后者模拟了模拟调音台。星际迷航终端看起来完全疯狂。最终，你必须自己决定这些主题在日常是否实用。


    预装了三个主题：默认、Reaper 1 和 Reaper 5（图 6）。你可以在菜单栏的“选项 | 主题”下选择其中之一。新主题以 .Reaper ThemeZip
    格式提供（这是一个重命名的 ZIP 文件，具有定义的文件夹结构）。安装时，只需将文件拖放到活动窗口中的 Reaper 窗口，或在文件管理器中双击它。


    在菜单栏的“选项 | 布局”下，你还会找到混音器和编辑器的替代视图，例如混音器中更宽的通道条、仅显示电平表和仅显示推子——主题开发者想要什么都是允许的。集成截图工具允许你为自己的录音、混音、母带处理或其他应用存储预设，并在需要时使用键盘快捷键调用它们。


    ## 操作


    对于 Reaper 的新手来说，最重要的术语之一是“操作”。Reaper 中的一切都是操作：剪切音频、缩放、创建 MIDI 音符、复制元素、移动推子、将轨道切换为待录制状态以及加载插件。所有操作都可以分配自己的按键组合，并可与自定义操作或宏结合使用。


    操作列表（图 7）可以通过“操作 | 操作列表”或按 F 键打开。搜索框有助于查找操作、查看、修改和删除现有快捷键，以及使用“添加”按钮创建新的快捷键。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_39_0.png)


    ![](img/8286bf901ba268fe114d66ada92d1dd6_40_0.png)


    图 4：带有可选 Echolot 主题的 Reaper。


    （参见“新手提示”框）。还可以根据搜索字段旁边的组合查找相应的操作。最大的问题是找出功能名称。此外，Reaper 为 Main、Media Explorer
    和 MIDI Editor 部分分别创建列表，并且不能跨组编辑。要在操作列表部分之间切换，请使用窗口右上角的切换菜单。


    ## 菜单


    在合理的菜单结构方面，Reaper 还有很多不足之处，这对数字音频新手来说令人困惑。随着功能数量的增加，开发者只是填满了菜单，而没有以某种计划进行重构。幸运的是，菜单结构也可以使用“选项
    | 自定义”自由定制。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_40_1.png)


    图 5：这里显示的是 House of White Tie Imperial 主题，具有功能丰富的扩展混音器。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_41_0.png)


    图 6：默认配置中包含的 Reaper 5 主题。


    菜单/工具栏，并支持拖放（图 8）。你可以让自己的偏好设置和典型使用场景来定义结构。


    免费的 ReaMenus [6] 附加插件以配置文件的形式在 DAW 中安装了一个完全结构化菜单。然而，独立的 ReaMenus 往往落后于 Reaper
    的开发状态几个版本。因此，你可能会发现总览中缺少一些功能。不过，缺少的功能仍可通过菜单编辑器或操作列表访问。


    Reaper 还允许你将单独的操作分配到工具栏中的按钮。你可以使用左上角主工具栏上的“右击 + 自定义工具栏”来添加新按钮并可选地定义自己的图标。


    自定义 Reaper 后，导出配置是个好主意。


    你可以通过“选项 | 偏好设置”（或使用 Ctrl + P）并选择“常规”来做到这一点。使用此备份，你可以只需单击几下恢复所有程序细节。


    ## Linux 特定事项


    从 6 版本开始，Reaper 现在可以作为独立程序用于 Linux。与 Ardour 一样，Reaper 安装程序是一个脚本，在终端窗口中运行并引导你完成安装。原则上，这意味着开发者为所有发行版提供兼容性。


    然而，根据你的系统配置，也可能存在兼容性问题。


    基本上，Reaper 是 Linux 日常音频工作以及生产环境的好伴侣，因为 Reaper 可以轻松与 Alsa、PulseAudio 和 Jack 交互。我积累了
    Reaper 经验，并始终在 5.4、5.10 LTS 和 5.13 内核上取得良好结果。我创建的测试录音有 20 个轨道，每个轨道五分钟长，混合和总线上有最多五个效果。


    然而，Reaper 在某些系统组合上存在问题。具体而言，Wayland 和 PipeWire 有问题。例如，使用 Gnome 41 和 Wayland 的
    Manjaro 不允许你从文件管理器将文件拖放到程序中。幸运的是，Reaper 内置的 Media Explorer 可以这样做（查看 | 媒体资源管理器或
    Ctrl + Alt + X）。媒体资源管理器甚至提供了一些


    ![](img/8286bf901ba268fe114d66ada92d1dd6_42_0.png)


    附加功能，例如预览、速度和音高调整以及样本的时间选择。如果你使用经典的 X 服务器，同一系统上不会出现此问题。


    Fedora 依赖于 PulseAudio 的继任者 PipeWire。尽管在桌面层面考虑得再周全，音频接口目前对专业音频来说是一个糟糕的选择。长时间录音会导致缓冲区溢出导致错误消息和缺失。此外，在混音时，一些插件的重采样或没有可理解错误消息的崩溃反复出现问题。然而，这可能不是
    Reaper 特有的问题，因为 PipeWire 也会让 Ardour 遇到类似的麻烦，并常常将 DAW 拖入著名的黑洞。


    Xfce 和各种其他桌面环境和窗口管理器使用 Alt 作为系统的修饰键（例如，用于移动或调整窗口大小）。这与 Reaper 的默认设置冲突。对于 Reaper，你希望在系统上用
    Super 键（Windows 键）替换此键，因为 Reaper 通常不使用它。或者，将所有操作按键组合从 Alt 重新路由到 Super。为你创建一个带有适当定制桌面配置的专用音频用户可能是值得的。


    Reaper 在高分辨率 4K 显示器上也有问题，并且不随相应的像素密度缩放。因此，如果你有 4K 分辨率，字体和控件将以不可读的小尺寸显示，而将显示大小缩放至
    200 或 300 百分比会损害概览。系统字体也会影响 Reaper 的显示。Reaper 利用了 Windows 和 macOS 不给予用户字体选择真正自由这一事实。然而，Linux
    用户更难处理。KDE 和 Gnome 通常开箱即用没有困难。另一方面，Openbox、i3 和 Xfce 上的显示至少可以说需要改进。如果没有正确的字体设置，


    ## 结论


    Reaper 已准备好在 Linux 上使用。与替代品相比，Reaper 提供了一个全面、可自定义、节省资源、稳定且同时低成本的 DAW，具有经典概念。


    对于生产环境，我推荐使用较新安装的 Manjaro 或 Ubuntu，内核版本为 5.4 或更新，并使用 Alsa/Jack 作为第二个服务器。根据你的典型工作区域和使用历史记录，你可能需要对自己的偏好设置进行一些调整。此外，不要忘记
    Reaper 不是免费软件。如果这不妨碍你，那么你在 Linux 专业音频市场上终于多了一个选择。


    ### 信息


    - [1] Reaper: https://www.reaper.fm

    - [2] Reaper 论坛: https://forum.cockos.com/forum/4-player.php?f=20

    - [3] Reaper 仓库: https://stash.reaper.fm

    - [4] Imperial 主题: https://www.houseofwhitetie.com/reaper/imperial/Imperial.html

    - [5] SWS 扩展: https://www.sws-extension.org

    - [6] ReaMenus: https://github.com/RCJaci/reamenus


    ### 新手提示


    在新系统上安装 Reaper 后，你应该禁用通过鼠标滚轮进行垂直缩放。几乎所有程序在旋转鼠标滚轮时都会滚动，但 Reaper 不会。这很难习惯，所以你应该将垂直缩放分配给
    Ctrl 加鼠标滚轮，并将垂直滚动直接分配给鼠标滚轮。选择 Shift 加鼠标滚轮用于水平滚动，Alt 加鼠标滚轮用于水平缩放。操作也可以通过工具栏中的按钮执行。免费的
    SWS 扩展 [5] 不仅为 Reaper 添加了一些真正有用的工具，还附带了一些非常实用的操作——这是 Reaper 专业人士必须安装的插件。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_41_1.png)


    图 7：操作列表允许你为几乎所有操作定义自己的键盘快捷键。

    '
