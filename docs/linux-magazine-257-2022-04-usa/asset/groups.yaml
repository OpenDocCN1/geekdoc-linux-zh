    \n# 独具逻辑与美感\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_33_0.png)\n\nDeepin 提供了一款视觉上令人惊艳的操作系统，并带有几个独特的怪癖。作者：Bruce\
    \ Byfield\n\nDeepin [1] 是由中国武汉的 Deepin Technology 公司开发的一个发行版。其主页宣称自己是“来自中国的顶级\
    \ Linux 发行版”，尽管 Ubuntu Kylin 有时也会做出类似的宣称。Deepin 长期以来因对视觉细节的关注而闻名，这种关注程度更像 macOS\
    \ 而非 Windows。就像 elementary OS 一样，Deepin 开箱即用就具备惊艳的视觉效果，无需任何自定义。然而，当你开始安装时，你很快会意识到这种美学是以某些代价换来的。\n\
    \n一方面，安装程序建议至少 64GB 的磁盘空间，并推荐 128GB 以启用所有效果，尽管这些要求直到你选择要分区的磁盘时才被提及。相比之下，Ubuntu\
    \ 只需 512MB 即可拥有一个完全可用的 Gnome 桌面，并且可以在 Deepin 无法运行的较旧计算机上运行。\n\n另一方面，Deepin 桌面环境（DDE）的组织方式拥有其独特的逻辑。这种逻辑并不难理解，但在使用它时需要一定的适应过程，这种适应程度在\
    \ Gnome 或 Plasma 中是不存在的。\n\n### 无尽的安装\n\n通常，我尽量最少地评论发行版的安装程序。毕竟，大多数用户只会接触它几次——甚至往往只有一次。然而，鉴于其独特的逻辑，应当详细描述\
    \ Deepin 的安装程序。\n\n首先，你应该阅读并同意 EULA（最终用户许可协议）和隐私政策——即使你通常会在不先阅读的情况下接受政策声明。Linux\
    \ 领域通常不常见如此详尽的 EULA，而隐私政策则详细说明了他们收集的信息类型——不仅是浏览器历史，还包括你使用计算机的时间以及系统中安装的应用程序的信息。如果你关心隐私和许可证限制，你可能会决定放弃安装；然而，如果你对这类事情不太在意，请勾选该选项并继续。\n\
    \n如果你决定安装，不要被安装程序所迷惑。起初，它看起来简单得有些欺骗性，仅包含三项内容：语言和分区的选择，然后是安装（图 1）。\n\n安装并重启后，你会再次看到首次启动时出现的相同页面。看起来安装似乎失败了，但最终安装会继续进行第二阶段，其中包括第一阶段省略的所有内容。如果你使用的是虚拟机，系统会询问你选择安装模式，要么是效果模式（用略显生硬的英语描述为提供“一种精致的模式”），要么是普通模式。安装将继续进行，包括从一张不显示时区的地图上选择时区，以及一些不寻常的限制，例如账户名称限制在\
    \ 3 到 32 个字符。然而即使那样，安装仍未完成。\n\n第三阶段涉及自定义，提供桌面模式的选择（时尚模式为大型 Dock，高效模式为小型 Dock）、运行模式（效果模式或普通模式）以及几个图标主题。这些选择通常很清晰，但安装期间并未提供每项内容具体包含什么的详细信息。幸运的是，运行模式可以从桌面的\
    \ Dock 稍后更改，图标模式可以从控制中心的个性化应用中更改。显然，桌面模式无法更改，可能是因为需要磁盘镜像，但应用商店也提供了鹰眼模式选项，在这种模式下，缩放变化会改变桌面上显示的信息。\n\
    \n然后，就在桌面可用时，探索它揭示了第四阶段。要访问许多默认应用，如应用商店、电子邮件客户端和云服务，你必须创建一个 Deepin 账户。\n\n###\
    \ 桌面逻辑\n\nDDE 是用 Qt 编写的，其窗口管理器 ddekwin 是 Plasma 的 KWin 的修改版。整个 DDE 在 Fedora 和\
    \ Arch Linux 中可用，而 UbuntuDDE 是非官方的 Ubuntu 变体。尽管需要大量的磁盘空间，DDE 的性能大致相当于 Gnome 或\
    \ Plasma，即使在虚拟机上运行时也是如此。Deepin 的外观广受赞誉，且受欢迎程度足以使 Deepin 在过去七年中一直位列 DistroWatch\
    \ 页面访问量前 100 名的发行版中，通常位于前 20 名左右，尽管在过去六个月中已下滑至第 48 位 [2]。\n\n对于其他桌面的用户来说，DDE 的许多部分都会很熟悉，例如菜单和结合了常用应用程序的\
    \ Dock，以及带有系统工具和通知的面板。这些小部件通过图标和鼠标悬停标签简洁地排列，并组织成各个部分。滑动系统工具会导致窗口从屏幕边缘滑入，例如通知窗口，这可能是我在任何桌面环境中见过的最有用的功能之一（图\
    \ 2）。然而，一旦你开始使用它，DDE 就会展现出一些自身的特点。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_34_0.png)\n\
    \n最显著的特点可能是 DDE 的默认简约性。例如，在登录时，DDE 默认采用类似平铺的结构，一次只显示一个应用（图 3），较大的应用占据整个屏幕。一些窗口——尽管不是所有——都可以通过拖动边缘来调整大小，就像大多数桌面环境一样，但无论你怎么做，始终只有一个窗口可见。要查看所有打开的窗口，你必须点击多任务视图图标，即\
    \ Dock 上从左数第三个。从多任务视图（图 4）中，你可以看到所有打开的窗口按照它们所在的虚拟桌面进行排列，尽管无法调整任何窗口的大小。按 ESC 键返回到桌面本身。同样，如果你右键单击桌面，只能添加文档和文件夹图标。要将应用程序图标添加到桌面，你需要在菜单中右键单击它。Dock\
    \ 应用的添加方式类似。毫无疑问，为了避免杂乱，包含的冗余很少，留给用户去寻找功能的逻辑位置。功能通常都在那里，并以逻辑方式组织，但你可能需要搜索一下。由于图标比鼠标悬停提示更直观，如果你具有视觉记忆而非基于文本的记忆，导航会更轻松。\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_34_1.png)\n\n另一个突出特点是，与许多现代发行版不同，Deepin\
    \ 开发了一个专为协同工作而设计的应用程序生态系统，很像 Gnome 或 Plasma。在最近的一系列版本中，DDE 已经用自己的等价物替换了标准的自由软件，如\
    \ Chrome 和 Thunderbird。在 2.4 版本中，这一过程即将完成，只有少数应用程序如 Simple Scan 是从其他发行版借用的。最明显的例外是\
    \ LibreOffice，它太普及且功能太完善，没有严肃的替代品。其他标准应用如 Gimp 或 digiKam 在其应用商店中可用，但 Deepin 默认使用自己的应用。其许多应用，如文件管理器、文本编辑器或音乐播放器，是大多数发行版中可用版本的最小化设计版本。其他，如\
    \ Boot Maker，是用于执行命令行操作的基本工具。然而，Deepin 还包含一些独特应用，特别是在工具类中。例如，Dock 默认安装虚拟键盘，菜单包含语音笔记记录器以及屏幕截图和桌面录制组合工具（图\
    \ 5）。此类应用很少有直接的等价物。近年来，Deepin 的许多应用已独立于完整桌面之外，被引入到诸如 Debian 等发行版中。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_34_2.png)\n\
    \n### 消除争议\n\n如果你是 Linux 的老用户，你可能一直远离 Deepin。2018 年，Deepin 的应用商店被发现正在将屏幕分辨率等一般用户信息发送给\
    \ CNZZ，一家中国的分析公司。收集此类信息在大多数网站上很常见，但一些用户担心个人信息被收集甚至提供给中国政府。然而，没有证据表明 Deepin 的开源代码做了这些事。此外，虽然确实存在未经用户同意收集信息的情况，但\
    \ 20.4 版本的安装程序现在以 EULA 和详细说明了具体收集哪些匿名信息的隐私政策开始。如前所述，阅读此政策是个好主意，这样你就知道你的数据会被如何使用。如果你能接受政策中概述的用途，就没有理由因为过去的争议而回避\
    \ Deepin。这样做就会错过一个前沿发行版。至于所需的磁盘空间和独特的逻辑，它们是否值得其美学或伴随的自定义程度，是每个用户必须自己决定的。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_35_0.png)\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_35_1.png)\n\n- **[1] Deepin：**\n  https://www.deepin.org/en/\n\
    - **[2] DistroWatch：**\n  https://distrowatch.com/\n\n"
