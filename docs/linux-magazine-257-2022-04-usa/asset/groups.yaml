    system’s modifier key (e.g., to move or resize windows). This clashes with Reaper’s
    defaults. For Reaper, you will want to replace this key on the system with the
    Super key (the Windows key), which Reaper does not otherwise use. Alternatively,
    re-route all key combinations for actions from Alt to Super. It may be worthwhile
    for you to create your own audio user with an appropriately customized desktop
    configuration.


    Reaper also has problems with high-resolution 4K displays and does not scale with
    the corresponding pixel density. Fonts and controls are


    therefore displayed at an illegibly small size if you have a 4K resolution, and
    scaling the display size to 200 or 300 percent compromises the overview. The system
    font also has an influence on Reaper’s display. Reaper takes advantage of the
    fact that Windows and macOS do not give users any real freedom in font selection.
    However, Linux users have a harder time. There are not typically any difficulties
    out the box with KDE and Gnome. On the other hand, the display on Openbox, i3,
    and Xfce could do with some improvement, to say the least. If you don’t have the
    right font settings,


    ## Conclusions


    Reaper is ready for use with Linux. Compared to the alternatives, Reaper offers
    a comprehensive, customizable, resource-saving, stable, and at the same time,
    inexpensive DAW with a classic concept.


    For a production environment, I recommend a recent installation of Manjaro or
    Ubuntu with kernel version 5.4 or newer and Alsa/Jack as the second server. Depending
    on your typical work area and your own usage history, you may need to make some
    adjustments to your own preferences. And, don’t forget that Reaper is not free
    software. If this doesn’t bother you, you finally have one more choice on the
    professional audio market for Linux.


