    # 一个绑图库


    ## 数据可视化


    Matplotlib 提供了如此多的选项，你可能会难以决定在图表中使用哪些。**作者：MARCO FIORETTI**


    Matplotlib [1] 是一个用于高质量数据可视化的开源 Python 库，你可以交互式地使用它，也可以在脚本中使用。虽然 Matplotlib 看起来可能只是老牌绑定工具
    Gnuplot [2] 的增强版，但这并不是全部故事。Matplotlib 的真正亮点在于将图表绑定与大量数值处理相结合。当与其他 Python 库（如 NumPy
    和 pandas，参见“Matplotlib 的伙伴：NumPy 和 pandas”专栏）结合使用时，Matplotlib 通常被视为 MATLAB [3]
    的有效且功能丰富的替代方案。


    有些工具的学习曲线比其他工具更陡峭。在我看来，Matplotlib 的学习曲线不是更陡峭，而是更广。例如，Matplotlib 甚至有一个专门讨论颜色规范的教程！换句话说，Matplotlib
    拥有如此多的功能和选项，以至于它看起来比实际复杂得多。因此，本教程的大部分使用了一些官方示例的简化版本来介绍主要的 Matplotlib 概念和功能，并理清它们之间的联系。


    ## NumPy 和 pandas


    NumPy [4] 是 Python 中科学计算的核心库。就 Matplotlib 而言，NumPy 最重要的组成部分是本教程某些示例中使用的高性能数据结构以及管理这些数据的函数。pandas
    [5] 是另一个专门用于操纵数值表格和时间序列的库。Matplotlib、NumPy 和 pandas 在数值处理上的结合非常强大，但这也是一个相对高级的主题，对于初学者教程来说，不可能在一次教程中完全涵盖。然而，即使单独使用，Matplotlib
    也非常有用。本教程所学的内容将使你更容易稍后添加 NumPy 和 pandas。


    ## 安装流程


    你可以找到几种安装最新稳定版 Matplotlib 的方法，它们都在其网站上得到了妥善文档化。不过，除非你*确实*需要最新的稳定版，否则我强烈建议你通过安装首选发行版官方仓库中可用的二进制包来节省时间和避免挫败感。例如，在
    Ubuntu 21.04 上，你只需在 Ubuntu 软件中心中搜索 Matplotlib，或者像我这样做，在提示符下输入以下命令即可安装最近的 Matplotlib
    及其所有依赖项：


    ```bash

    $ sudo apt-get install python3-matplotlib

    ```


    ## 编码风格


    编写和（重新）使用 Matplotlib 代码有两种不同的编码风格：面向对象风格和 pyplot 风格。


    - 第一种风格（清单 1）在任何语言中都使用经典的面向对象编程：首先你创建对象（`fig` 和 `ax`，我稍后会解释它们的含义），然后调用与之关联的“方法”（例如，`ax.plot()`）来执行实际的绑定操作。


    - 第二种风格（清单 2）使用 `pyplot` 函数（其中 `plt` 前缀意味着“使用由 `pyplot` 模块提供的此函数”）来创建和管理类似于 MATLAB
    的图表。


    ### 清单 1：面向对象风格


    ```python

    fig, ax = plt.subplots(figsize=(5, 2.7))

    ax.plot(x, x, label=''linear'') # 创建图表

    ax.legend() # 添加图例。

    ```


    ### 清单 2：Pyplot 风格


    ```python

    plt.figure(figsize=(5, 2.7))

    plt.plot(x, x, label=''linear'')

    plt.legend()

    ```


    实际上，清单 2 执行的操作与清单 1 完全相同，但它是通过调用有状态函数（如 `figure`、`plot` 或 `legend`，而不是附加到某个对象实例的方法）来实现的。在此上下文中，“有状态”意味着每次
    pyplot 函数调用都会添加或更改当前图表状态的某些内容，而不会擦除之前其他函数调用所做的操作。


    在实践中，pyplot 函数调用有等效的 Matplotlib 面向对象方法，反之亦然，以至于你的编码风格选择只是个人偏好的问题。然而，官方 Matplotlib
    文档建议使用 pyplot 风格进行“快速交互工作”，并建议使用更灵活的面向对象风格来编写经常以许多不同方式重用的代码。


    # Matplotlib 术语


    在查看任何实际代码之前，我需要解释一些基本术语，因为 Matplotlib 赋予某些单词的含义与普通英语中略有不同。


    除了你在屏幕上看到的内容外，Matplotlib 使用 `Figure` 作为关键字，创建一个称为“Artists”的对象容器。


    基本上，Matplotlib Figure 内部所有可见的东西都是 Artist，从图形到嵌入图像、文本标题等等。每个 Figure 都记录并连接其所有子
    Artist，包括嵌套的子图、非图形对象（如标题或图例），以及当然，`Axes`。


    Axes（复数形式）可能是最基本且最重要的 Matplotlib Artist：它是一个直接附加到特定 Figure 的区域，你可以在其中绑定某些数据集。你可以与父级
    Figure 一起创建 Axes，也可以稍后再添加。


    每个 Axes 至少有一个标题和两个标签，每个轴一个。大多数其他 Artist 不能移动或共享给与它们原始附加位置不同的 Axes（即，特定的图表或子图）。


    另一个重要的 Matplotlib 术语 `Axis`（单数形式），其含义与普通英语中基本相同。Axis 对象设置图表一个轴的所有组件，从刻度（线性、对数或其他）到端点、标记（也称为
    ticks）以及它们的相应文本标签。每个 Axes 至少包含两个 Axis 对象，但正如本教程后面所示，也可以添加更多。


    从图表边框到颜色，有数以百计的方式来美化任何 Matplotlib 图表的每个细节，并且有两种高级方式来设置它们。快速且粗略的选项在某些场景下可能已经足够，即手动设置生成图表时所需的所有选项。另一个选项是使用完整的样式，它们是预先定义的列表，包含你的图表所需的所有默认视觉设置。你可以使用
    `style.use` 函数加载 Matplotlib 随附的任意一个预定义样式：


    ```python

    plt.style.use(''somematplotlibStyle'')

    ```


    你还可以从你自己创建的文件中加载自定义样式表。在这两种情况下，更改样式只需要更改包含样式名称或存储该样式文件路径的那一行代码。此外，由于这两种方法都会忽略样式中可能存在的任何非视觉设置，因此样式可以在具有非常不同
    Matplotlib 安装环境的机器之间移植。


