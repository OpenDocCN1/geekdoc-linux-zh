    \ RAM 中图像所需旋转的回调函数。在 Go 中，函数是完整功能的数据类型，可以轻松地传递给其他函数，这基本上是在告诉 Go：“这是应用于原始图像数据的算法。”\
    \ Listing 3 在第 11 行打开原始文件进行读取，使用标准 `image/jpeg` 包中的 `Decode()` 解码 JPEG 数据，并在没有错误时将结果存储到由变量\
    \ `jimg` 指向的矩阵中。然后第 21 行调用之前作为参数传入的函数，通过变量 `cb` 执行，将 `jimg` 中的图像数据传递给它，并接收旋转后图像的修改数据到\
