    with `purge` instead of `remove`, à la:


    ```

    $ apt purge nvidia-driver-390 nvidia-settings nvidia-prime nvidia-dkms ... etc.

    ```


    This gets rid of any settings and configurations that may still be lingering after
    removal of the packages themselves. You can also do a quick cleaning with the
    following command after all of that.


    ```

    $ apt autoremove

    ```


    just to be sure that you have gotten everything out of there that can be removed.


    When this is complete, simply type **reboot** and hit Enter to reboot the system.
    At this point you should see that the *nouveau* drivers are loaded and running
    instead of the proprietary NVIDIA ones. You can now try a different driver package
    by listing and installing as you did before, and I would recommend going to the
    next available lower number. In my experience most of the problems that I have
    had with installing NVIDIA drivers stem from the fact that my old cards aren''t
    well supported on newer drivers, even though those newer drivers will show up
    when queried. Going to older available packages one at a time ensures that I have
    the most up-to-date set of packages available for my card which will run without
    problems.


    ## Concluding Remarks


    I cannot express the amount of frustration I felt as a beginner around installing
    one of these only to have a blank screen be the result upon reboot. At that time,
    my solution was a complete reinstall of the OS, at which point I would try to
    use the open source driver package with its faults or go to a different NVIDIA
    driver and cross my fingers and hope for better results. Yes, I have reinstalled
    Ubuntu more than four times simply trying to get a driver package that worked.
    That is exactly why I think it is important not only to be comfortable with the
    terminal and with using the recovery mode, but also simply to know a bit about
    what is happening under the hood. Now that I have a method for recovery upon failure
    and have some


    ![](img/8286bf901ba268fe114d66ada92d1dd6_78_0.png)


    confidence that I can get my system back to a working desktop, I can say that
    I simply find it easier and faster to use the terminal for the entire process.
    The added benefit here in my opinion is that you can actually see what is happening
    in the terminal rather than waiting, guessing, and hoping with the GUI equivalent
    (Figure 4).


    Hopefully one day we will see the NVIDIA gang team up with our beloved open source
    community to produce a non-proprietary solution with the performance and benefits
    of the closed driver offering that currently exists. Until then I am afraid we
    are stuck with some of this hassle. Following the advice given above, however,
    you at least won''t have to be stuck at a blank screen for too long after installing
    their solution onto your machine. I guess it really is as they say: You win some
    and you lose some.


    ## Info


