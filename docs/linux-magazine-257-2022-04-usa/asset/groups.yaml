  mdcn: "\n\n## 特色活动\n\n用户、开发人员和供应商在全球各地的 Linux 活动中相遇。作为《*Linux Magazine*》（Linux 杂志），我们很自豪能赞助此处展示的这些特色活动。如果您想了解您附近的其他活动，请查看我们在\
    \ [https://www.linux-magazine.com/events](https://www.linux-magazine.com/events)\
    \ 上丰富的在线活动日历。如果您知道另一个您希望我们添加到日历中的 Linux 活动，请将所有详细信息通过电子邮件发送至 [events@linux-magazine.com](mailto:events@linux-magazine.com)。\n\
