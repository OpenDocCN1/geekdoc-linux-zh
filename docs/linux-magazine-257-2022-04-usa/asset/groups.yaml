    ## MakerSpace 派对灯光


    # 使用 Kunbus Revolution Pi Core 3+ 实现 DMX 控制


    用于控制灯光技术的 DMX 协议源于舞台和活动技术，但它也可应用于家庭自动化。我们将向您展示如何使用 Revolution Pi 模块来控制 DMX 设备。作者：Martin
    Mohr


    原则上，数字复用（DMX）技术允许您通过一条简单且坚固的总线控制所有 DMX 设备。DMX 使用 RS-485 标准（即异步串行传输）进行数据传输。信号通过两条线路同时传输，电压电平相反（±5V）。


    这种数据传输方式对外部干扰信号具有很强的抗扰能力，理论上支持长达 1,200 米的线路长度。然而，数据传输速率会随着线路长度的增加而降低。在 10 米以内的距离，通过
    RS-485 最高可实现 10Mbps 的数据速率。


    DMX 默认以 250kbps 的数据速率工作；DMX 网络由字符串（strings）构成。一个字符串最多可包含 32 个 DMX 接收器。更多的接收器需要使用中继器（repeater）来扩展网络。网络分支通过特殊的分路器（splitters）实现。所有
    DMX 设备均使用极其坚固的三极 XLR（Canon）连接器进行连接，这非常适合舞台使用。


    DMX512 标准支持最多 512 个设备地址。根据组件所需的地址数量不同，一条总线上可操作的设备数量也有所差异。


    ## DMX 照明


    在本文中，我使用了两款简单的 DMX 灯，几年前我直接从中国订购 [1]，每盏仅 6.58 欧元。不过，现在直接从中国订购可能并不划算，而且价格已经上涨，因此建议您提前了解可能需要支付的其他费用。


    每盏灯有 8 个通道，这意味着它们在 DMX 总线上占用 8 个地址。如果您将地址 1 分配给第一盏灯，则第二盏灯将被分配地址 9。有些令人困惑的是，在 DMX
    领域中，地址和通道往往被当作不同的概念来讨论。经验法则是，灯中的每个通道都应该有一个地址。


    表 1 展示了我所用硬件的通道概览。


    DMX 灯提供的功能大多一目了然。只有少数项目需要特别注意。为了让聚光灯发光，通道 1 的值需要大于 0。如果通用调光器设置为 0，您无法仅调高红色调光器。


    值为 0 时禁用频闪效果（通道 6）。当值为 1 时，它以最大频率闪烁，随着值的增加，闪烁速度会变慢。在“自动运行”操作模式下，可以选择各种预定义的颜色场景；播放速度由通道
    8 控制。


    在此，制造商的文档略显模糊，不清楚具体应发生什么情况。但这并不是问题，因为我们将使用外部控制器。


    每盏灯各有一个 DMX 输入和输出，功耗为 36W，因此可以通过标准插座供电。灯的地址可以通过背面的四位七段显示器相当直观地设置。只需确保显示器第一位显示
    A 即可。


    将地址 1 分配给第一盏灯，地址 9 分配给第二盏灯。如果地址设置起初不起作用，请查看随附的制造商手册。图 1 展示了我用作控制器的两个灯、接线以及 Revolution
    Pi。


    ## Revolution Pi


    来自 Kunbus 的 Revolution Pi Core 3+（以下简称 RevPi Core）[2] 是一个小型工业控制器，其核心是 Raspberry
    Pi 计算模块。RevPi Core 可以通过不同的模块进行扩展并适应不同的需求。制造商丰富的模块库中包含一个模块，可使 RevPi Core 连接到 DMX
    总线。


    DMX 模块可以运行在主模式和从模式，并控制最多 512 个 DMX 地址。供电电压为 24V DC，工作电流消耗为 100mA。该模块通过三个 LED 指示灯显示当前运行状态。指示灯的确切含义见表
    2。


    模块正面的一个 8 针插头允许您建立与 DMX 总线的连接。连接器的引脚分配见表 3。您也可以在模块侧面找到它——以及三针 XLR 连接器的引脚分配。如果您需要更多关于
    RevPi DMX 模块的信息，最好查看用户手册 [3]。


    ## 配置与测试


    DMX 模块可以通过两种方式配置：通过模块正面的开关或通过在软件中设置相应的值。在这里，我将介绍如何在软件中配置该模块。首先，登录到 RevPi Core（图
    2）。用户名为 admin，密码可以在设备外壳的右侧找到。


    成功登录后，启动 PiCTory 应用程序（图 3），并将 RevPi Core 和 DMX 模块拖放到当前配置中。DMX 模块通过 2 个字节进行配置。受支持参数的概览见表
    4。地址和通道设置可能会因模式（发送/接收）不同而略有差异。如有必要，请查阅手册 [3]。


    在实验设置中，值编辑器（Value Editor）下的第一个配置字节（Config_1）设置为 0x10，第二个（Config_2）设置为 0x80（图 4）。要在程序中访问
    DMX 模块的各个字节，需要勾选 *Export*（导出）列以发布它们。对于测试设置，您需要设置前 16 个字节（*DMXOut_1* 到 *DMXOut_16*）。


    图 4 展示了 RevPi Core 的完整配置，包括 DMX 模块。为了在重启后保留设置，请选择 *File | Save as Start-Config*（文件
    | 另存为启动配置）来保存配置。现在重启 RevPi Core，以检查设置是否全部生效。


    重启后，通过 SSH 连接到 RevPi Core 控制台。在 Linux 上使用 ssh 命令行工具（Windows 用户可以安装 PuTTY [4]）。登录的用户名为
    *pi*，密码与通过浏览器登录时的密码相同。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_67_1.png)

    ![](img/8286bf901ba268fe114d66ada92d1dd6_68_0.png)

