    When Go’s image library writes the JPEG image back to disk, it completely omits
    the original Exif data, so there’s no longer an orient entry in header there,
    indicating correct rotation.


    # ### Compiling the Program


    You can use the command sequence from Listing 6 to create the autorot binary.
    The go compiler fetches the required libraries from GitHub, compiles them, and
    links them. As always, this creates an executable that already contains all the
    dependencies. It can be copied to another computer


    without any problems and will run there without any complaints, given a similar
    operating system and processor architecture.


    # ### Conclusions


    The program is by no means perfect yet. It’ll work for most cases, but still lacks
    counterclockwise rotation and algorithms for more exotic Exif values. But with
    the described basics, these features can easily be added. As always, Go imposes
    no limits on the hobbyist here.


