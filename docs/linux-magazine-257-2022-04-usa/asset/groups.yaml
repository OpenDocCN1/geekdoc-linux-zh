    # Concluding Remarks


    I cannot express the amount of frustration I felt as a beginner around installing
    one of these only to have a blank screen be the result upon reboot. At that time,
    my solution was a complete reinstall of the OS, at which point I would try to
    use the open source driver package with its faults or go to a different NVIDIA
    driver and cross my fingers and hope for better results. Yes, I have reinstalled
