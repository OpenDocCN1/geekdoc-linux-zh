    在浏览器中打开指向您的 Checkmk 站点的链接。您可以打开终端上显示的链接。使用 `ckadmin` 和从终端复制的密码登录。您将会看到一个空白仪表盘。转到左侧边栏中的“用户”，在“个人资料”下，点击
    *更改密码* 以更改您的密码（推荐）。


    之后，您可以开始向监控中添加主机（图 4）。在我的情况下，我将添加我的路由器。转到 *Setup | Hosts* 并点击 *Add host*。


    在我的示例中，我只需要添加主机名 *tplinkmodem.net*，因为 TP-Link 为其设备设置了 DNS，因此 Checkmk 可以自动解析您主机名的
    IP 地址。如果可用，我建议使用此选项。如果不是这种情况，您还需要通过激活 *IPv4 address* 旁边的复选框并输入 IP 地址来添加您设备的 IP
    地址。


    对于我的路由器，我想使用 SNMP，但默认情况下，Checkmk 假设您使用 Checkmk 代理来监控系统。Checkmk 代理非常适合监控服务器，但在大多数网络设备上，您无法安装额外的软件。因此，转到
    *Monitoring agents*，勾选 *Checkmk agent/API integrations*，并选择 *no agent*。


    接下来，勾选标记为 SNMP 的复选框（图 5）。选择您的 SNMP 版本——大多数情况下 *SNMP v2 or v3* 均可工作。因为我没有更改 SNMP
    社区字符串，所以可以留空 SNMP 凭据框——默认情况下，Checkmk 假设密码是 *public*。如果情况并非如此，您必须在 *SNMP credentials*
    下设置社区字符串。其他项目保持不变。


    接下来，点击 *Save & go to service configuration*。Checkmk 现在将自动发现该主机上相关的监控服务，然后您应该看到一个
    *Undecided services* 列表。点击 *Fix all* 以监控所有这些相关服务（图 6）。这将把所有检测到的服务添加到监控中，并移除已消失的服务。当然，您可以手动管理服务，但
    `Fix all` 功能使操作变得容易得多。


    在这种情况下，Checkmk 仅仅检测了我所有当前在线的路由器端口，加上正常运行时间和 SNMP 信息检查——对我来说总共是 10 个服务。如果您的设备有官方检查插件可用，Checkmk
    将自动检测相关信息。这 2,000 个官方检查插件覆盖了大多数常见专业网络设备制造商的设备。这个插件集合使 Checkmk 成为网络监控的绝佳工具，并为您节省大量时间。


    关于使用 SNMP 监控的更多信息，我推荐博文“Network Monitoring with Checkmk” [5]。但在开始外部阅读之前，请遵循最后一步以完成本教程。


    ## 激活更改


    最后，您需要通过点击右上角带有黄色 `↑` 且显示更改数量的突出显示字段来激活更改。之后，点击 `Activate on selected sites`，您就成功地将第一个主机添加到监控中。


    激活更改是一种安全机制。所有所做的更改将列在 `Pending changes` 下（图 7）。在更改影响您的监控之前，您可以审查任何列出的更改。Checkmk
    区分作为配置环境的 Setup 菜单（在此管理主机、服务和设置）和 Monitor 菜单（在此进行实际的操作监控）。新的主机和其他配置更改最初对监控没有影响。在它们进入生产环境之前，您需要激活这些更改。


    您现在可以在 `Monitor | Overview | All hosts` 下找到您的主机。点击一个主机，您将看到该主机所有监控服务的概览。图 8 显示了我的路由器概览。您可以点击每个服务以查看更多细节。


    您可以通过点击侧边栏中的 **Setup | Agents | Linux** 找到适用于各种操作系统（如 Windows 和许多 Linux 发行版）的代理。


    ### 深入检查 Checkmk


    Checkmk 文档 [7]，以及官方 Checkmk 论坛 [8]，将为您解答所有关于 Checkmk 的问题。■■■


    ### 结论


