    ## Adjusting Cell Phone Photo Orientation with Go

    **Sunny Side Up**


    ![](img/8286bf901ba268fe114d66ada92d1dd6_51_0.png)


    Cell phones often store photos upside down or sideways for efficiency reasons
    and record the fact in the Exif metadata. However, not all apps can handle this.
    **Mike Schilli** turns to Go to make the process foolproof. By *Mike Schilli*


    **S**omehow, I seem to hold my cell phone wrong when taking pictures. It often
    happens that a picture that looks right in the phone’s photo gallery is suddenly
    upside down or on its side when I want to send it to friends on WhatsApp. A quick
    look at the metadata of the photo in question reveals what’s going wrong (Listing
    1) [1].


    It appears that my phone is saving images with the wrong orientation, but it is
    also storing the correction value, which shows up in the JPEG format’s Exif header
    to tell you how the photo actually should be rotated. I don’t know who came up
    with this idea, but assuming that any app looks in the Exif header first and then
    aligns the image correctly seems like a fundamental flaw to me. There’s no doubt
    in my mind that the original camera app should perform the rotation when the picture
    is taken, rather than having the work done downstream time and time again by an
    unmanageable number of photo apps.


    **Listing 1: Photo Metadata**

    ```bash

    $ exiftool pic.jpg | grep Rotate

    Orientation: Rotate 180

    ```


    **Author**

    **Mike Schilli** works as a software engineer in the San Francisco Bay Area, California.
    Each month in his column, which has been running since 1997, he researches practical
    applications of various programming languages. If you email him at mschilli@permeister.com
    he will gladly answer any questions.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_51_1.png)


    ## Upside Down World


    Figure 1 illustrates that the cell phone still displays the image the right way
    around in its photo app, even though it was stored incorrectly. The desktop version
    of the WhatsApp client in the browser, however, obviously ignores the associated
    Exif header and sends the picture upside down (Figure 2). Imagine the recipient’s
    reaction to receiving a message about my surf trip to Ocean Beach in San Francisco
    with a photo on its head! High time to write a Go program that correctly orients
    a photo retrieved from a phone and then deletes the Exif header entirely, so that
    any downstream application will process the image as-is – very much like GIMP
    (Figure 3) does when it sees a rotated photo. While I’m at it, I’ll throw in some
    algorithms for rotating images 90 or 180 degrees: After all, someone might ask
    about them in your next job interview.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_51_2.png)


    **Figure 1: My smartphone shows the image the right way round …**

    Photo by Gurt with hat on: Unsplash

