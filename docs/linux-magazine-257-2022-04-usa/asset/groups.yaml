    # COVER STORY


    # Cryptography and Provable Security


    Similarly, Bob knows Alice''s public key $pk_A$ and has his own private key $sk_B$.
    In this case, I will also assume that Bob has verified the authenticity of the
    key $pk_A$.


    The first step is to specify the functionality. In this case we are dealing with
    authenticated email; consequently, I have two tasks: First, I need to compute
    an encrypted and authenticated cipher. This interface is designated *Enc + Auth*.
    Second – assuming that the authentication is valid – the encrypted email has to
    be decrypted. Keeping to the same pattern, I will refer to this interface as *Verify
    + Dec*.


    The second step is to determine the (fairly simple) security properties. The attacker
    knows Alice and Bob''s public keys and all the above needed. Nevertheless, the
    attacker must not be able to obtain information from the email. Furthermore, the
    attacker must not be able to send emails on behalf of Alice (i.e., messages verified
    with the $pk_A$ public key) to Bob.


    Although these features seem to make sense at an intuitive level, they still leave
    too much scope for interpretation. Can the attacker interact with Bob? Is there
    a learning phase where the attacker is allowed to use Alice as an interface to
    forward the encrypted and authenticated emails from Alice to Bob? Is the attacker
    allowed to impersonate Bob and read encrypted emails for a period of time? How
    are the messages to Bob generated? In a formal description of the security properties,
    it is important to eliminate these ambiguities so that a precise and unambiguous
    description results.


    After formalizing the interfaces and the security properties, the third step is
    to instantiate the individual components using cryptographic methods. The two
    interfaces *Enc + Auth* and *Verify + Dec* need to be constructed with cryptographic
    procedures such that they provide precisely the desired functions. In the case
    of secure email, this step is relatively simple (Figure 3).


    To implement the *Enc + Auth* interface, you first need to encrypt the message
    with a public key method and then sign the ciphertext with a digital signature
    method. I''ll use *c* to denote the ciphertext and the lowercase Greek letter
    sigma (σ) to denote the signature. In line with this, you would implement the
    *Verify + Dec* interface with the following operations. First, the signature procedure’s
    verification algorithm is used to check the validity of the signature on the ciphertext
    *c*. If this signature is valid, the public key procedure’s decryption algorithm
    decrypts the ciphertext *c* and outputs the resulting message *m*.


    In the security validation, I can now assume in the fourth step that both the
    encryption method and the signature method are secure according to formal definitions.
    You then formally verify that an attack that breaks the security of *Enc + Auth*
    as well as *Verify + Dec* (according to the formal model) can be used to break
    the security of both the public key and the signature


    procedure. However, since both procedures were assumed to be secure in the first
    step, a contradiction arises, from which it follows that such an attack cannot
    exist.


    In the last two steps, you now use concrete procedures, for example, RSA-based
    encryption, implement them, and prove the security of the implementation through
    penetration tests.


    # Strengths and Limitations


    Since the discovery of El Gamal, provably secure cryptographic methods such as
    El Gamal encryption [4] have been virtually unbreakable. Provable security reduces
    the proof for an encryption method to a simple computational problem, such as
    the very well-known factorization problem.


    In this problem, the attacker is given a number $N = p \times q$ calculated as
    the product of two primes of equal length *p* and *q*. The attacker’s task is
    now to compute the two prime factors *p* and *q*. To date, no efficient solution
    algorithm has been discovered for this well-known computational problem.


    The security of an encryption method is now based on the factorization problem,
    and the formal proof shows the following: If there is an efficient attacker who
    breaks the encryption scheme, then there is also an efficient attacker who solves
    the factorization problem. In other words, the problem of breaking the encryption
    is as difficult to solve as the factorization problem.


    At first glance, the term “provably secure” suggests that there are provably no
    longer any attacks. However, this is not true. Attacks on systems that are *supposedly*
    provably secure repeatedly occur. Where does this contradiction come from, and
    how can it be resolved? First of all, it is important to note that the security
    of the proof always refers to a formal model. However, if the model does not truly
    reflect practice, then it cannot rule out potential attacks because these attacks
    simply do not occur in the model. Consequently, accurately modeling reality is
    one of the biggest challenges in this area, and even the smallest errors in modeling
    can lead to an insecure solution.


    The security of the Secure Sockets Layer (SSL) protocol is a great example of
    incomplete modeling. In practice it was possible for a message not to be decrypted;
    instead, a *Padding Error* message appeared. At first glance, this appears harmless,
    as it does not seem to reveal any direct information about the plaintext. This
    is why it was not included in the formal model. At second glance, however, researchers
    were able to show that it was possible to exploit this error message to decrypt
    the full message – and to do so without breaking the actual security of the encryption
    scheme.


    # Typical Errors


    A widespread mantra from the IT security field is that you should never develop
    your own cryptographic method. But at what point


    do you construct your own procedure? In fact, this mantra falls short in many
    places and should instead read: “Never use cryptographic procedures unless you
    can prove what you are doing.” The following example demonstrates that this statement
    is by no means exaggerated and that even the simple use of two cryptographic procedures
    can lead to a completely insecure construction.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_29_0.png)'
