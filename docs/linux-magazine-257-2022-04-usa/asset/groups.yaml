  mdcn: "\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_4_0.png)\n\n## 加密\n\n本月，我们调研了\
    \ Linux 中加密技术的现状。我们将目光投向基础概念之外，探索支撑保密系统的工具和技术——并告诉你确保隐私万无一失所需了解的内容。\n\n## 深度解析\n\
    \n- 58 **LibreOffice 与 OpenOffice 对比**\n  - 尽管 LibreOffice 和 OpenOffice 有着共同的过去，但\
    \ LibreOffice 在贡献者数量、代码提交量和功能特性方面均超越了 OpenOffice。\n\n## 创客空间\n\n- 62 **DIY 收音机**\n\
    \  - 一个 HiFiBerry HAT、配套系统以及树莓派（Raspberry Pi）与两个旧音箱相结合，打造出一台现代风格的大功率收音机。\n- 68\
    \ **树莓派灯光秀**\n  - 用于控制照明技术的 DMX 协议最初为剧院和活动设计，但你也可以将其用于家庭自动化。我们将展示如何使用 Revolusion\
    \ Pi 模块控制 DMX 设备。\n\n## LINUXVOICE\n\n- 73 **欢迎辞**\n  - 本月的 Linux Voice 杂志内容。\n\
    - 75 **犬舍 – 物联网对开放性的需求**\n  - 封闭的物联网设备可能会使用意外的带宽“汇报家中情况”，这表明我们需要免费设备，让用户对家庭小工具和\
    \ Wi-Fi 使用拥有更多控制权。\n- 76 **Linux 中的 NVIDIA 驱动程序**\n  - 一种基于终端的解决方案有助于缓解安装 NVIDIA\
    \ 驱动程序的困扰。\n- 80 **开源精选（FOSSPicks）**\n  - 本月 Graham 将介绍 Blender 3.0、woob、Fokus、bat、GNU\
    \ poke、Bladecoder 冒险引擎、Crispy Doom 等等！\n- 88 **教程 – Matplotlib**\n  - 在你的 Python\
