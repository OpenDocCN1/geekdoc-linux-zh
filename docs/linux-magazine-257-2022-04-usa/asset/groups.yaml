    ## 使用 Go 调整手机照片方向

    **阳光普照**


    ![](img/8286bf901ba268fe114d66ada92d1dd6_51_0.png)


    为了效率，手机通常以颠倒或侧向的方式存储照片，并在 Exif 元数据中记录这一事实。然而，并非所有应用程序都能处理这种情况。**Mike Schilli**
    求助于 Go 使过程万无一失。 作者：*Mike Schilli*


    不知为何，我拍照时似乎总是拿错手机。经常发生这种情况，一张在照片图库中看起来正常的图片，当我想通过 WhatsApp 发送给朋友时，突然变成颠倒或侧向的。快速查看相关照片的元数据
    reveals 出了问题所在（列表 1） [1]。


    显然，我的手机以错误的方向保存图像，但也存储了校正值，该值显示在 JPEG 格式的 Exif 头中，告诉您照片实际上应该如何旋转。我不知道是谁想出了这个主意，但假设任何应用程序首先查看
    Exif 头，然后正确对齐图像，这在我看来似乎是一个根本缺陷。在我心中毫无疑问，原始相机应用程序应该在拍摄照片时执行旋转，而不是由数量无法管理的光照应用程序在下游反复完成这项工作。


    **列表 1：照片元数据**

    ```bash

    $ exiftool pic.jpg | grep Rotate

    Orientation: Rotate 180

    ```


    **作者**

    **Mike Schilli** 在加利福尼亚州旧金山湾区担任软件工程师。自 1997 年以来，他每月专栏都在研究各种编程语言的实用应用。如果您通过 mschilli@permeister.com
    给他发电子邮件，他会很高兴回答任何问题。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_51_1.png)


    ## 颠倒的世界


    图 1 说明，即使图像存储不正确，手机仍然在其照片应用程序中以正确方向显示图像。然而，浏览器中的 WhatsApp 桌面客户端版本显然忽略了相关的 Exif
    头，并将图片以颠倒的方向发送（图 2）。想象一下收件人收到一条关于我在旧金山海洋海滩冲浪之旅的消息，配上一张头朝下的照片时的反应！是时候编写一个 Go 程序，正确定向从手机获取的照片，然后完全删除
    Exif 头，这样任何下游应用程序都会按原样处理图像——非常像 GIMP（图 3）看到旋转照片时所做的那样。既然要这样做，我会加入一些旋转图像 90 或 180
    度的算法：毕竟，有人在你的下一个面试中可能会问到这些。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_51_2.png)


    **图 1：我的智能手机以正确方向显示图像……**

