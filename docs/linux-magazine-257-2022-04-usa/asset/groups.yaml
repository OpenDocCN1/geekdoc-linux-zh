    \ 发现适用于你所在国家的 LPI 新考试定价。更多信息和所有 LPI 认证请在 lpi.org 查看\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_6_0.png)\n\
    \n# 新闻\n\n来自世界各地的技术和文化更新\n\n- **本月新闻**\n  - 08 • Zorin OS 16 教育版现已推出 • System76\
    \ 发布搭载 AMD 处理器的 Kudu 笔记本电脑\n  - 09 • Ubuntu Budgie 瞄准游戏玩家 • Linux Mint Edge 已准备就绪以支持最新硬件\
    \ • 更多在线内容\n  - 10 • Linux 内核 5.17 代码合并窗口已关闭 • 在所有主要 Linux 发行版中发现另一个严重漏洞\n\n##\
    \ Zorin OS 16 教育版现已推出\n\nZorin OS 16 Education 是一个面向幼儿园以及中小学的 Linux 发行版。在已经出色的桌面体验基础上，开发人员增加了一些工具，帮助教育机构培养学生驾驭日益增长和复杂世界所需的技能。\n\
    \n添加的关键软件之一是 Kolibri，它旨在通过提供访问庞大教育内容库的途径来弥合教育鸿沟。更棒的是，使用该工具不需要互联网连接。借助 Kolibri，学校管理员可以创建自己的课程，或从\
    \ Khan Academy、Open Stax、MIT、TED-Ed 和 Sikan 等教育领导者处下载材料。\n\n一旦下载，内容可以通过本地网络进行点对点共享。其他教育应用程序包括\
    \ Minder（思维导图）、OpenBoard（白板）、Minuet（音乐知识）、KTouch（打字）、KTur-tle（教育编程环境）、KBrunch（分数练习题）、KWordQuiz（闪卡）和\
    \ Step（物理实验模拟）。除了教育应用程序，Zorin OS Education 还包括 Firefox、LibreOffice 和 Gimp 等软件。\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_7_0.png)\n\n在 https://zorin.com/os/education/\
    \ 下载 Zorin OS 16 Education，并在 https://blog.zorin.com/2021-08-17/2021-08-17-zorin-os-16-is-released/\
    \ 阅读 Zorin OS 16 一般版本中的新功能。\n\n## System76 发布搭载 AMD 处理器的 Kudu 笔记本电脑\n\nSystem76\
    \ 终于带回了热门的高性能 Kudu 笔记本电脑工作站。这一次，笔记本电脑配备了第 3 代 AMD（Zen 3）Ryzen 9 5900HX H 类处理器，拥有\
    \ 8 个核心和 16 个线程。CPU 运行频率为 3.3 GHz，但最高可加速至 4.6 GHz。\n\nKudu 搭配 Nvidia RTX 3060\
    \ 显卡，最高支持 64GB 双通道 DDR4 内存。\n\n根据 System76 产品经理 Ben Shpucker 的说法：“这种组合使其成为随时随地创作的完美机器。”\n\
    \nKudu 笔记本电脑采用 15 英寸 FHD 哑光显示屏和窄边框，但对于各类创作者而言，通过一个 HDMI 端口、一个 Mini DisplayPort\
    \ 和一个通过 USB-C 连接的 DisplayPort，笔记本电脑最多可管理三个外部显示器。\n\n观察端口，你会发现一个 USB 3.2 Gen 1\
    \ Type-A 端口，一个 USB 3.2 Gen 2 Type-A 端口，一个带有 DisplayPort 1.4 的 USB 3.2 Gen 2 Type-C\
    \ 端口，以及一个 USB 2.0 端口\n\n"
