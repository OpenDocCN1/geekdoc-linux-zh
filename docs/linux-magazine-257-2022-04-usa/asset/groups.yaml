    \n**LINUX 杂志**\n20 年存档 DVD\n\n立即购买！\n[https://bit.ly/Archive-DVD](https://bit.ly/Archive-DVD)\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_56_2.png)\n\n---\n\n## 深入解析\n\n###\
    \ LibreOffice 对比 OpenOffice\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_57_0.png)\n\
    \n#### 比较 LibreOffice 和 OpenOffice\n\n**明确的选择**\n\n尽管 LibreOffice 和 OpenOffice\
    \ 有着共同的过去，但 LibreOffice 在贡献者、代码提交和功能方面都超越了 OpenOffice。作者：Bruce Byfield\n\n搜索 LibreOffice\
    \ 和 Apache OpenOffice 的比较结果会返回超过 830 万条。鉴于 LibreOffice 和 OpenOffice 是最著名的开源办公套件且拥有共同的过去，这个数字并不令人惊讶。然而，令人惊讶的是许多比较肤浅的程度。许多比较只是从一个不成熟但挑剔的用户角度对任一办公套件进行表面上的审视。通常，这些比较已经过时。同样值得注意的是，许多比较努力营造一种虚假的客观感，宣称任何差异都是微不足道的。然而，按照任何标准，LibreOffice\
    \ 都胜过 OpenOffice，并显示出 OpenOffice 已过时。假装事实并非如此是对真相的歪曲。\n\n如您所知，这两个办公套件有着共同的历史（图\
    \ 1）。两者都源自 OpenOffice.org，这是一个由 Sun Microsystems 在 2000-2011 年间运营的项目。事实上，OpenOffice\
    \ 声称自己是 OpenOffice.org 的法律继承者，因为在 2011 年 Sun 将 OpenOffice.org 移交给 Oracle，Oracle\
    \ 又将其移交给 Apache 基金会——但在开源中，所有权的概念几乎无关紧要。与此同时，Go-o.o，一个自 2007 年以来低调运营的半官方分支，创建了\
    \ LibreOffice 及其管理机构，即文档基金会（The Document Foundation）。Go-o.o 在 OpenOffice.org 中颇具争议，因为它倡导更快的开发节奏，因此两个新项目的成立似乎正式化了已经存在的分裂。\n\
    \n当然，LibreOffice 和 OpenOffice 从一开始就互不喜爱。同样从一开始，OpenOffice 面临着 LibreOffice 所没有的挑战。首先，OpenOffice\
    \ 使用 Apache 许可证，而 LibreOffice 使用双 LGPLv3/摩纳哥公共许可证（MPL）。这种许可证差异的一个主要后果是，LibreOffice\
    \ 可以从 OpenOffice 借用代码，而 OpenOffice 不能从 LibreOffice 借用代码。同样重要的是，从 2014 年 3 月下旬到\
    \ 2015 年 3 月，OpenOffice 总共只有 16 名贡献者，其中 12 名在 IBM 停止支持 OpenOffice 时停止了贡献 [1]。自那以后，OpenOffice\
    \ 一直不愿公布贡献者数量，但考虑到 OpenOffice 在 2012 年声称有 120 名贡献者 [2]，今天这个数字不太可能超过 LibreOffice\
    \ 的 1,722 名贡献者 [3] 的一小部分。结果是可预测的：自 2014 年以来，OpenOffice 没有发布主要版本，只有 11 个次要版本。相比之下，LibreOffice\
    \ 发布了 13 个主要版本和 87 个次要版本。并且在 2019 年，LibreOffice 有超过 15,000 次代码提交，而 OpenOffice\
    \ 只有 595 次 [4]。\n\n同样不可避免的是，LibreOffice 吸引了 Red Hat 和 Collabora 等重要企业支持者，而 OpenOffice\
    \ 则无法填补 IBM 八年前留下的空白。OpenOffice 的持续存在虽然有点古色古香，甚至令人钦佩，但该项目在结构上根本无法竞争。\n\n**功能差异**\n\
    \n除了十年前 Go-o.o 的贡献外，这两个项目最初\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_58_0.png)\n\
    \n共享一个共同的代码库。即使在今天，仍有足够的代码保持相同，使得在一个版本上运行的扩展通常在另一个版本的发布中也能运行，尽管比十年前要少。毫无疑问，文件之间相互使用开放式文档格式（ODF）有助于保持兼容性。然而，差异似乎在增长——主要是由于\
    \ LibreOffice 的创新。这种差异可以在下载大小中看到：LibreOffice 的 DEB 下载文件为 195MB，而 OpenOffice 的为\
    \ 159MB。换句话说，尽管 LibreOffice 已经移除了代码中的冗余并重写了部分以提高效率（OpenOffice 尚未做到这一点），但它的体积接近大出四分之一。\n\
    \n大约八年前，我看到了一份 LibreOffice 内部文件的副本，其中列出了 OpenOffice 缺乏的所有功能。令我惊讶的是，有数百个条目。尽管许多都是次要的，但差异之多远非可以列举，更不用说逐一解释了。然而，在更重要的功能中，LibreOffice\
    \ 包含了对界面的全面改造，重新排列菜单项，重新定位窗口中的项目以提高可访问性，添加主题，并总体上创建了一个更用户友好的外观。这些变化在用于电子表格的图表子系统中尤为明显，其中的颜色更新自\
    \ OpenOffice.org 那种停留在 1990 年代的外观。此外，LibreOffice 引入了主题和多种用户界面选择，包括类似 MS Office\
    \ 的选项卡工具栏。OpenOffice 中没有任何这些更改的等效项。\n\nLibreOffice 的新功能在所有模块中可见，特别是在 Writer 和\
    \ Calc 中。但为了节省篇幅，我将以 Writer 作为其他模块的例证。LibreOffice Writer 中在 OpenOffice 中没有对应功能的突出特性包括：\n\
    \n- 将表格设计折叠到其他样式中，使其易于查找，并且可以复制到其他文件中。\n- 默认列表样式，提供项目符号和编号系统的选择，省去了用户设置的需要。\n\
    - 导出到 EPUB 格式（此功能仍在完全实现中，尽管现在通常已可用）。\n- 支持 HarfBuzz，这是一款字体渲染应用，允许通过添加在字符字段中的一系列代码来修改\
    \ OpenType 和 True Type 文件，使 LibreOffice 成为功能齐全的桌面出版软件。\n\n然而，对于许多用户来说，LibreOffice\
    \ Writer 中最重要的改进是继续增强对 MS Word 的导出。这项努力可能是一个移动的目标，因为 Microsoft 经常更改其格式，但可靠的 MS\
    \ Word 导入过滤器对于许多公司采用 LibreOffice 至关重要。这工作中的很大一部分归功于 LibreOffice 与 Collabora 的战略联盟，后者为其客户构建兼容性解决方案，并将其改进捐赠给\
    \ LibreOffice，在 2019 年贡献了超过三分之一的 LibreOffice 提交。在最近的 7.3 版本中，MS Word 导入和导出过滤器已达到这样一个阶段，大多数常规商务和学术文件可以可靠地与未使用\
    \ LibreOffice 的用户进行交换。相比之下，OpenOffice 的 MS Word 兼容性则波动得多。\n\n**最新发布**\n\n为了获得另一种视角，你只需查看最新的发行说明。2021\
    \ 年 11 月 27 日，OpenOffice 宣布发布 OpenOffice 4.1.11 [5]。该版本改进或增强功能的完整列表如下：\n\n- 启用了持久化调整以帮助调整文本字体大小。\n\
    - 在插入菜单中添加了 Fontwork。\n- 在文件菜单中添加了缺失的 PDF 导出图标。\n\n此外，两个 bug 修复被认为值得提及：\n\n- Apache\
    \ OpenOffice 4.1.10 引入的新安全警告阻止了有用的功能。\n- Windows 安装文件缺少属性且缺乏代码签名。\n- Windows 安装：切换到\
    \ NIS 3.x 后丢失了适配的文本。\n- 以 ODS 格式保存时图表丢失。\n\n此外，没有添加新的或更新的词典或语言。\n\n相比之下，LibreOffice\
    \ 7.3 的发行说明 [6] 于 2022 年 2 月 2 日宣布，包含了如此多的新功能和改进，完整的列表在此篇幅内无法全部列出。\n\n"
