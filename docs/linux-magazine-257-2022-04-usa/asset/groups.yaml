    # # NEWS


    # # KerneI News


    # # Zack’s Kernel News


    ![](img/8286bf901ba268fe114d66ada92d1dd6_11_0.png)


    Chronieler Zack Brown reports on the latest news, views, dilemmas, and developments
    within the Linux kernel community.


    By Zack Brown


    **Author**


    The Linux kernel mailing list comprises the core of Linux development activities.
    Traffic volumes are immense, often reaching 10,000 messages in a week, and keeping
    up to date with the entire scope of development is a virtually impossible task
    for one person. One of the few brave souls to take on this task is **Zack Brown**.


    # ## The “Filesystem” System


    Dov Murik from IBM posted some confidential computing (coco) patches. This is
    gussied-up marketing speak for “sandbox” (i.e., an isolated set of processes that
    implement security protections for whatever is going on inside). But, I’m not
    here to talk about coco. The interesting thing was that Dov’s patches used SecurityFS
    to provide the interface between the user and the secure area, which turned out
    to be controversial. SecurityFS came along about 15 years ago in the 2.6 timeframe
    in response to a frightening proliferation of homespun filesystems. The idea was
    for security modules to use the same SecurityFS application programming interface
    (API) and just do whatever insanity was boiling their brains in the back end.
    SecurityFS simply provided a consistent gateway so everyone’s various concepts
    could be straightforward navigated by everyone else.


    Greg Kroah-Hartman replied to Dov: “**Why are you using securityfs for this? securityfs
    is for LSMS [Linux Security Modules] to use. If you want your own filesystem to
    play around with stuff like this, great, write your own, it’s only 200 lines or
    less these days. We used to do it all the time until people realized they should
    just use stuff for driver stuff.**”


    “**But this isn’t a driver, so sure, add your own virtual filesystem, mount it
    somewhere and away you go, no messing around with securityfs, right?**”


    But James Bottomley (also from IBM) took exception to Greg’s statement. He replied,
    “we use it for non LSM security purposes as well, like for the TPM BIOS log and
    for IMA. What makes you think we should start restricting securityfs to LSMs only?
    That’s not been the policy up to now.” He added, “I really think things with a
    security purpose should use securityfs so people know where to look for them.”


    Greg replied that using SecurityFS for LSMs “was the original intent of the filesystem
    when it was created, but I guess it’s really up to the LSM maintainers now what
    they want it for.” But he suggested, “Why not just make a cocofs if those people
    want a filesystem interface? It’s 200 lines or so these days, if not less, and
    that way you only mount what you actually need for the system. Why force this
    into securityfs if it doesn’t have to be?”


    James pointed out that coco was only the first of potentially many uses of the
    particular feature they were implementing – transferring secret data into a virtual
    machine without the virtual machine itself being able to read it. And he said,
    “It’s not being forced. Secrets transfer is a security function in the same way
    the bios log is.”


    Greg was very dubious and was surprised to hear that the BIOS log used SecurityFS.
    James confirmed, “Yes. It’s under /sys/kernel/security/tpm0/ All the ima policy
    control and its log is under /sys/kernel/security/ima/ that’s why I think declaring
    securityfs as being for anything security related is already our de facto (if
    not de jure) policy.”


    And James also added, “I know Al [Viro] likes this business of loads of separate
    filesystems, but personally I’m not in favour. For every one you do, you not only
    have to document it all, you also have to find a preferred mount point that the
    distributions can agree on and also have them agree to enable the mount for, which
    often takes months of negotiation. Having fewer filesystems grouped up by common
    purpose which have agreed mount points that distros actually agree seems a far
    easier approach to enabledment.”


    Greg did not find these arguments convincing. For one thing, he said, regardless
    of whether you make a new filesystem or use an existing one, you still need to
    document the data you store in it.


    As for Linux distributions negotiating on mount point – or deciding to adopt the
    given feature in the first place – Greg felt this was normal. He said, “Enabling
    it does take time, which is good because if they do not think it should be present
    because they do not want to use it, then'
  - "[PAGE 12]\n\nit will not be, which means either they do not need your new feature,\
    \ or you have not made it useful enough. So again, not an issue.”\n\nGreg’s fundamental\
    \ issue was security. The wider the array of SecurityFS users, the more likely\
    \ each of those users would be to add more features to SecurityFS, exposing various\
    \ features to user space, and generally presenting a more tempting surface for\
    \ attackers to look for security holes.\n\nThe discussion ended inconclusively.\
    \ There is probably not much at stake either way – if coco uses SecurityFS it\
    \ will simply be doing the same as other things that use SecurityFS. And if it\
    \ makes its own filesystem, it will likewise be doing the same as other things.\
    \ What’s interesting about a discussion like this is that it’s possible to witness\
    \ development policies emerging and transforming.\n\nVarious developers have different\
    \ interpretations about how the parts of the kernel should be used for further\
    \ development. These differences don’t generally interfere with their ability\
    \ to get patches in, so they can happily continue working, each believing different\
    \ things about how to code for the kernel.\n\nThen when something like IBM’s coco\
    \ patches come along, suddenly everyone’s different ideas become relevant in a\
    \ practical way. Sometimes a giant clash follows and sometimes not. In the current\
    \ case, we can see this question: Should projects all create their own filesystems,\
    \ or should similar users group themselves together to minimize filesystem proliferation?\
    \ Eventually the question will probably have to be resolved. But for now, there\
    \ are just these faint rumblings.\n\n# ### Maintaining GitHub Kernel Forks\n\n\
    Konstantin Komarov from Paragon submitted an NTFS patch – or rather, he requested\
    \ that Linus Torvalds pull the patch from Paragon’s GitHub tree. Linus replied,\
    \ saying:\n\n> “For github accounts (or really, anything but kernel.org where\
    \ I can just trust the account management), I really want the pull request to\
    \ be a signed tag, not just a plain branch.\n> \n> In a perfect world, it would\
    \ be a PGP signature that I can trace directly to you through the chain of trust,\
    \ but I’ve never actually required that.\n\nthrough the chain of trust, but I’ve\
    \ never actually required that.\n\n> “So while I prefer to see a full chain of\
    \ trust, I realize that isn’t always easy to set up, and so at least I want to\
    \ see an ‘identity’ that stays constant so that I can see that pulls come from\
    \ the same consistent source that controls that key.”\n\nA few minutes later,\
    \ he replied to his own email, saying he would just pull the tree this time to\
    \ avoid delay, but he asked Paragon to set up PGP and start using signed tags\
    \ moving forward.\n\nOn a related note, Linus added:\n\n> “I *notice* that you\
    \ have a github merge commit in there.\n> \n> *That’s* another of those things\
    \ that I *really* don’t want to see – github creates absolutely useless garbage\
    \ merges, and you should never ever use the github interfaces to merge anything.\n\
    > \n> *This* is the complete commit message of that merge:\n\n```\n```\nMerge\
    \ branch 'torvals:master' into master\n```\n```\n\n> “Yeah, that’s not an acceptable\
    \ message. Not to mention that it has a bogus ‘github.com’ committer etc.\n> \n\
    > *github* is a perfectly fine hosting site, and it does a number of other things\
    \ well too, but merges is not one of those things.\n> \n> “Linux kernel merges\
    \ need to be done *properly*. That means proper commit messages with information\
    \ about what is being merged and *why* you merge something. But it also means\
    \ proper authorship and committer information etc. All of which github entirely\
    \ screws up.\n> \n> *We* had this same issue with the ksmbd pull request, and\
    \ my response is the same: the initial pull often has a few oddities and I’ll\
    \ accept them now, but for continued development you need to do things properly.\
    \ That means doing merges from the command line, not using the entirely broken\
    \ github web interface.”\n\nThere was no discussion or controversy following Linus’s\
    \ posts. The interesting thing is that the signature issue is not hypothetical.\
    \ Linus had to endure some legal hassles a few years back over licensing issues\
    \ surrounding various patches. Consequently, patch signing became the standard\
    \ way to trace all patches back to an origin point for licensing verification\
    \ purposes."
