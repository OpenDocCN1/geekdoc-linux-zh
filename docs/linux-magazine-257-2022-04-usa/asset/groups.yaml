  - "[PAGE 35]\n\n# # REVIEW\n\n# ## Distro Walk – deepin\n\nmust click the multitasking\
    \ view icon, the third from the left on the dock. From the multitasking view (Figure\
    \ 4), you can see all the open windows arranged by the virtual desktop they are\
    \ on, although none can be resized. Pressing the ESC key returns you to the desktop\
    \ proper. Similarly, if you right-click the desktop, you can only add document\
    \ and folder icons. To add an application’s icon to the desktop, you need to right-click\
    \ on it in the menu. Dock apps are added similarly. No doubt in the interest of\
    \ avoiding clutter, little redundancy is included, leaving users to hunt for the\
    \ logical place for a function. The function will usually be there and organized\
    \ in a logical way, but you may have to search for it. Because the icons are more\
    \ visible than the mouseover help, navigating is easier if you have a visual memory\
    \ rather than a text-based one.\n\nStill another outstanding feature is that,\
    \ unlike many modern distributions, deepin develops an entire eco-system of applications\
    \ designed specifically to work together, much like Gnome or Plasma. In the last\
    \ handful of releases, the DDE has replaced standard free software like Chrome\
    \ and Thunderbird with its own equivalents. With version 2.4, the process is nearing\
    \ completion, with only a few apps like Simple Scan borrowed from other distributions.\
    \ The most noticeable exception is LibreOffice, which is too ubiquitous and too\
    \ fully featured to have any serious substitute. Other standard apps like Gimp\
    \ or digiKam are available in its app store, but deepin defaults to its own apps.\
    \ Many of its apps, like the file manager, text editor, or music player, are minimally\
    \ designed versions of what are available in most distributions. Others, like\
    \ the Boot Maker are basic tools for operations done at the command line. However,\
    \ deepin also includes some unique apps, particularly in its utilities. For example,\
    \ the dock installs a virtual keyboard by default, and the menu includes a recorder\
    \ for voice notes as well as a combination screenshot and desktop recorder (Figure\
    \ 5). Such apps have few, if any direct equivalences. In recent years, many of\
    \ deepin’s apps have found their way into distributions such as Debian separately\
    \ from the complete desktop.\n\n# ## Debunking the Controversy\n\nIf you are a\
    \ long-time Linux user, you might have stayed away from deepin. In 2018, deepin’s\
    \ app store was discovered to be sending general user information such as screen\
    \ resolution to CNZZ, a Chinese analytics company. The collection of such information\
    \ is common to most websites, but some users were concerned that personal information\
    \ was harvested and even given to the Chinese government. However, no evidence\
    \ was given that the deepin open source code did either of these things. Moreover,\
    \ although it is true that information was gathered without user consent, the\
    \ 20.4 release’s installer now begins with a EULA and privacy policy that details\
    \ exactly what anonymous information is collected. As I mentioned earlier, it\
    \ is a good idea to read this policy so you know what will happen with your data.\
    \ If you’re comfortable with the uses outlined in the policy, there is no reason\
    \ to avoid deepin because of the past controversy. To do so would be to miss out\
    \ on one of the cutting edge distributions. As for the required disk space and\
    \ peculiar logic, whether they are worth the aesthetics or the accompanying degree\
    \ of customization is something that each user must decide for themselves.\n\n\
    ![](img/8286bf901ba268fe114d66ada92d1dd6_35_0.png)\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_35_1.png)\n\
