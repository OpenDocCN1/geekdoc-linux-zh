    \ by default.\n\n## Encrypting with Webmail\n\nSome webmail systems are behind\
    \ the times in providing comprehensive encryption. The Mailvelope browser plugin\
    \ [7], which is available for Chrome, Edge, and Firefox, adds secure OpenPGP communication\
    \ to webmail. It runs locally in the user’s web browser and detects when the provider’s\
    \ webmailer contains a PGP-encrypted email. It then decodes the contained email,\
    \ exchanges the contents of the web page for the unencrypted message, and displays\
    \ the message.\n\nMailvelope can also send encrypted email. Before a message written\
    \ in plaintext is sent on its way, Mailvelope encrypts it locally and only then\
    \ transmits it to the provider’s webmail system. The process seems good at first\
    \ glance, because decoding occurs locally on the user’s computer. However, security\
    \ experts have complained about the implementation of Mailvelope as a browser\
    \ plugin: it leads to the sensitive PGP key material being stored in the browser’s\
    \ plugin area, which cannot be 100 percent protected. In addition, JavaScript\
    \ is not considered suitable for implementing secure cryptography.\n\nImplementations\
    \ such as the Guard system of the Open-XChange groupware solution [8] take a somewhat\
    \ different approach. These solutions store the key securely on the provider’s\
    \ server, and a password entered by the user protects it against unauthorized\
    \ access. The server takes care of encryption and decryption, removing the need\
    \ for a browser plugin. This means that users can access their own mailboxes from\
    \ other computers at any time, even when they are on the road.\n\n## Conclusion\n\
    \nCyber snoopers are more sophisticated than ever, which means there has never\
    \ been a better time to get familiar with email encryption. However, as this article\
    \ has shown, you can’t just install SSL/TLS or PGP and expect a safety guarantee.\
    \ It pays to consider the details and look closely at what you need to ensure\
    \ your messages remain private.\n\nWhether trusting your email provider offers\
    \ you more security, or whether you are better off keeping your own key on your\
    \ private PC, is a matter for every user to determine. But either way, in view\
    \ of the recent gamut of virus and ransomware attacks, it pays to be cautious.\n\
