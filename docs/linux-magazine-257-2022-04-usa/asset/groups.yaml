    ## Terminal news

    ### Broadsheet


    The amount of news that’s being generated has become overwhelming, regardless
    of how you feel about current events. We’ve all become “doom scrollers,” incessantly
    skipping from one story to the next like unrestrained information addicts. There
    aren’t many good solutions to this problem. The curated content that you find
    in magazines like this can help, especially if that means getting away from the
    screen. Subscribing to an RSS feed is another possible solution because it lets
    you purposefully follow updates from a specific source and filter those updates
    from your own client. But RSS has been in decline for years, and many general
    news sources have a vested interest in not supporting it – making you visit their
    sites, create accounts, and even subscribe.


    Broadsheet, a new option in an early stage of development, could bridge the gap
    between too much news via your usual channels and the lack of support for less
    distracting methods. It’s a command-line tool that outputs a very RSS-like synopsis
    of news stories, along with links to read the full story in a browser. Command-line
    arguments can be used to limit stories to a specific domain, country, or search
    results, and it works brilliantly. Because you’re on the command line, clicking
    on a link is harder and less of a temptation than it might be in a browser. The
    only downside: Broadsheet requires a subscription to a news aggregation service,
    http://newsapi.org, which provides an API key to use within the configuration
    file. It’s currently reasonable to use the free developer tier, but this will
    change when Broadsheet becomes stable. Hopefully by then the developer will have
    added the proposed RSS support, resulting in the best of both worlds.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_81_0.png)


    *While Broadsheet only currently works with a subscription-based news API, the
    developer hopes to add RSS support in the future.*


    **Project Website**: <https://github.com/i-am-the-gabe/Broadsheet>


    ### Pomodoro widget

    ### Fokus


    If Broadsheet has got you thinking about removing distractions from your work
    environment, another tried and tested method is the Pomodoro technique. This is
    a time-management hack developed by Francesco Cirillo in the 1980s, and it’s often
    accompanied by a timer in the shape of a tomato (pomodoro is Italian for tomato).
    The process simply asks you to focus on a single task for a set period of time,
    usually 25 minutes, without letting yourself be distracted by other things. The
    contemporary distractions of the ’80s would be benign by modern standards, being
    perhaps a Rubik’s cube, Newton’s Cradle, or a fresh cup of coffee. Today there
    are more distractions than you have tabs open, and something like Pomodoro can
    make a huge difference in your productivity. The main problem is how to integrate
    it into your work environment without wasting a week re-searching the options.
    Not wanting to procrastinate any further your search for a solution, we’ve found
    one for you.


    The original tomato clock was designed to keep you away from the temptation of
    technology. Because it’s likely you’ll want to work on a computer, moving it to
    your desktop is an acceptable solution. There are many options for Linux, but
    one of the best we’ve come across is Fokus, which, as you might guess from the
    name, is a KDE Plasma application widget. It features both a small panel containing
    a timer and a panel widget that fits even small panels, and both will show you
    how much time you have left for each interval. Cleverly, it can also be configured
    to run a script at the beginning or end of a period, and it’s easy to write something
    that adds the work of a period into a personal journal or word log. Fokus is beautifully
    designed and better than the equivalent applications we’ve seen for macOS and
    Windows, many of which are commercial or advertising driven.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_81_1.png)


    > *Get on top of your work, and your self esteem, by being wholly productive for
    25 minutes without getting distracted. It really works!*


    **Project Website**: <https://gitlab.com/dioviae/fokus-plasmoid>


    ## PCB illustrator

    ### Pinion


    One of the most recent revolutions in technology, alongside the likes of home
    3D printing, virtual reality, and the Raspberry Pi, is the ability for any of
    us to create a circuit and get it printed. There''s even a choice of software
    you can use to do this, and we''ve covered several in this magazine. Perhaps the
    most mature is KiCAD, a well-established schematic editor that lets you create
    a circuit, verify its design, simulate its execution, and test the electrical
    rules that govern its function. KiCAD will then automatically generate a PCB layout
    and export the results in a format that can be sent to a PCB manufacturer. It''s
    simple enough that even beginners can use it to produce their first circuits,
    but it''s also advanced enough that many engineers use it for their product design.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_82_0.png)


    Pinion is a tool that takes KiCAD files and turns them into beautiful illustrations
    that you can share or publish on a website. Not only do they look incredible,
    with a cell-shaded, pseudo-realistic style, they''re also interactive. Text can
    be added to parts of the circuit or the board, and tracks can be highlighted by
    selecting them. The virtual card can also be flipped over, all thanks to the magic
    of JavaScript. This functionality is added via a simple YAML file that links the
    KiCAD components together with your descriptions, grouping, and pin annotations.
    The text you add can be as long as needed and even include links and basic formatting.
    It uses a hand-drawn library called PpcbDraw-Lib to illustrate the components,
    and while the library is currently relatively small, it''s growing and easy to
    contribute to. The diagram is then built by executing the pinion command, together
    with arguments pointing to the YAML and the KiCAD file. The results are excellent!


    *Pinion is a simple Python tool that can save you the trouble of drawing your
    own realistic circuit diagrams.*


    **Project Website**: <https://yaqwxs.github.io/Pinion>


    ## Binary editor

    ### GNU poke


    We often look at hexadecimal editors on these pages, and they can be useful for
    looking into binary files, but we don''t often find an actual binary editor like
    GNU poke. Its name refers to a couple of ancient commands that originated with
    the DECsystem-10 but became infamous on the Commodore 64. The PEEK command would
    be used to view the contents of a memory location, and the POKE command was used
    to change its value. Both commands were crude, but they also allowed anyone to
    hack whatever was running in system memory. They were easy system exploits, and
    if you had a good understanding of the assembler and the hardware, you could achieve
    almost anything with lots of PEEK and POKE commands, no Internet, and too much
    time over a long summer break.


    GNU poke is a binary editor that will appeal to those old-school (now middle-aged)
    hackers, but also to anyone with an interest in poking around binary files. It
    describes itself as ''spartan'', which in this context means there''s not much
    to see when it''s running. Launching it with a file as an argument doesn''t open
    an editor you''d recognize but instead will offer you a prompt and some primitive
    help. Typing .dump will generate output that looks like a hex editor, allowing
    you to see the first 128 bytes of your selected file. But the key to using poke
    is understanding the structure of the data you''re looking at, because that allows
    you to use operators and even variables to procedurally edit and modify your data.
    Data can be copied to additional buffers, and there''s decent file input and output
    for your saved changes and discoveries. It''s deep and complex and difficult to
    learn despite the excellent internal documentation, but it''s easier than doing
    this stuff manually in 1986 with PEEK and POKE commands and a summer spent reading
    hardware reference manuals.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_82_1.png)


    *Big and little endians, characters, strings, and even bitmaps can be inspected
    and modified with GNU poke.*


    **Project Website**: <https://www.jemarch.net/poke>

