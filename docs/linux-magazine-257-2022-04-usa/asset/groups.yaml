    # A logic and beauty of its own


    ![](img/8286bf901ba268fe114d66ada92d1dd6_33_0.png)


    Deepin offers a visually stunning OS with a few unique quirks. By Bruce Byfield


    Deepin [1] is a distribution developed in Wuhan, China by Deepin Technology. Its
    homepage proclaims it “the top Linux distribution from China,” although similar
    claims are sometimes made for Ubuntu Kylin. Deepin has a longstanding reputation
    for attention to visual detail that is more reminiscent of macOS than Windows.
    Like elementary OS, deepin is visually stunning right out of the box, without
    any customization. However, when you start to install, you soon realize that its
    aesthetics come at a cost.


    For one thing, the installer suggests a minimum of 64GB of disk drive and recommends
    128GB to enable all of the effects, although these requirements are not mentioned
    until you choose a disk to partition. By contrast, Ubuntu requires a minimum of
    512MB for a perfectly functional Gnome desktop and can function on older computers
    that deepin cannot.


    For another, the organization of the Deepin Desktop Environment (DDE) has a logic
    all its own. This logic is not difficult to figure out but does take some adjustment
    when working with it, to an extent that Gnome or Plasma do not.


    # The Endless Installation


    Ordinarily, I comment on a distribution’s installer as little as necessary. After
    all, most users will only deal with it a few times – often, only once. However,
    given the unique logic, deepin’s installer should be described in some detail.


    To start with, you should read and agree to the EULA and privacy policy – even
    if you typically accept policy statements without first reading them. The extensive
    EULA is uncommon for the Linux space, and the privacy policy goes into some detail
    about the types of information they collect – not just browser history, but information
    on when you use your computer and the applications installed on your system. If
    you are concerned about privacy and license restrictions, you might decide to
    forego the installation; however, if you are easy going about such things, check
