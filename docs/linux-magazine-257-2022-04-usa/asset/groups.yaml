    \n## Linux Mint 20.3 Cinnamon 与 deepin 20.4\n\n双面 DVD 上的两款绝棒发行版！\n\n### Linux\
    \ Mint 20.3 Cinnamon 64 位\n\n代号为“Una”的 Linux Mint 20.3 Cinnamon 是 Linux Mint 最新的长期支持（LTS）版本，支持将持续到\
    \ 2025 年。它配备了 Cinnamon，即 Mint 广受欢迎的桌面环境。与其他大多数标准 Mint 版本一样，Una 基于 Ubuntu，而 Ubuntu\
    \ 又基于 Debian。同一版本的 Debian 版本可以作为 Linux Mint Debian Edition (LMDE) 5 获取，代号为“Elsie”。\n\
    \nCinnamon 以谨慎的创新而闻名，每个版本都会带来一些新功能，Linux Mint 20.3 也不例外。外观和体验进行了许多微调，包括对现有主题的翻新和几套新壁纸，以及标题栏及其按钮的扩大，圆角设计增添了柔和感。对于偏好旧外观的用户，可以使用\
    \ Mint-Legacy 主题。此外，许多应用程序也增加了搜索字段，包括 Hypnotix IPTV 和便笺小组件。Cinnamon 的新增功能包括 Thingy\
    \ 电子书阅读器和日历及调度小组件。相比之下，前 Mint 用户可能会注意到通用软件包的 Snap 商店已被禁用，理由是虽然 snap 软件包是开源的，但\
    \ Snap 商店的代码并非如此。\n\n与以前的 Mint 版本一样，Una 适合各个层级的用户。\n\n### deepin 20.4 64 位\n\n\
    Deepin 是中国领先的发行版之一。基于 Debian 的 Stable 仓库，deepin 因其 Deepin 桌面环境（DDE）而备受推崇，该环境基于\
    \ Qt 构建。DDE 包含二十多个独特的应用程序，从标准的编辑器、字体安装程序和软件包存储，到更不寻常的远程助理、修复指南和演示助理。DDE 还因其简单易懂的安装程序和简洁美观的设计而经常受到称赞。\n\
    \n如果你之前使用过 deepin，你会注意到 20.4 版本中有许多小改进，从新的默认壁纸开始。该版本还新增了垃圾桶的撤销功能（Ctrl+Z），以及当鼠标悬停在坞上时显示应用程序窗口标题栏的功能。控制中心现在支持生物识别认证、休眠时间设置以及更详细的自定义坞设置。还进行了大量的错误修复。与以前的版本一样，deepin\
    \ 20.4 包含许多其他桌面系统中没有的调整，这些调整以小但有用的方式扩展了功能。\n\nDeepin 多次被指控将用户信息传递给中国政府，但这些指控从未得到证实。然而，你必须勾选一个框，表示你同意\
