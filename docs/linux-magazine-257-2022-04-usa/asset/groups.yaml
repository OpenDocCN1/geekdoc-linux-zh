  mdcn: "\n\nLinux 杂志\n\n## **创客空间** 使用树莓派 DMX 模块创建灯光秀\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_0_0.png)\n\
    \n# Linux 杂志\n\n第 257 期 – 2022 年 4 月\n\n# 加密\n保护你的秘密\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_0_1.png)\n\
    \n# Linux 之声\n\n- 安装 NVIDIA 驱动程序\n- Matplotlib：使用这个强大的 Python 库绘制更好的图表\n- **Reaper：**\
    \ 专业的 Linux 音频工作站\n- LibreOffice 与 OpenOffice 对决\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_0_2.png)\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_1_0.png)\n\n# 珍珠版\n\nTUXEDO InfinityBook\
    \ S 14\n\n- **Intel Core i5-1135G7**\n- Intel Iris Xe 显卡\n- **仅 1.1 公斤轻**\n- 16.8\
    \ 毫米薄\n- **金属玫瑰金特别配色**\n- 时尚且独家\n- **73 瓦时电池**\n- 以及低功耗显示屏\n\n- **100% Linux**\n\
    - **5 年保修**\n- **终身支持**\n- **德国制造**\n- **德国隐私保护**\n- **本地支持**\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_1_1.png)\n\
    \ntuxedocomputers.com\n\n# 云层背后的真相\n\n亲爱的读者：\n\n我们 Linux 社区深受一种传统观念的影响，认为 Linux\
    \ 比 Windows 安全得多。事实确实如此，而且一直以来都是如此，但这句话并没有说明多少问题。二十年前，当 Linux 开始起步时，早期的 Windows\
    \ 版本确实极其不安全。与此同时，微软一直吹嘘 Windows 有多棒，声称如果你不使用它，就会被抛在脑后。微软糟糕的工程能力加上恶意的营销（他们曾称 Linux\
    \ 为癌症！）赋予了 Linux 社区一种延续至今的态度。\n\n这种态度让 Linux 开发者在多年的竞争和创新中占据了优势，但态度的优势可能既锋利又陡峭。大多数\
    \ Linux 用户都知道采取标准安全预防措施的重要性，但部分忠实的 Linux 支持者中也存在一种否认倾向，认为那些安全建议并不真正适用于他们。勒索软件？权限提升？那肯定是\
    \ Windows 的问题……\n\n好吧，现在不再是 2002 年了。在许多方面，Linux 已经赢得了互联网之战。运行 Linux 的互联网服务器比任何其他系统都多——甚至\
    \ Microsoft Azure 云平台也运行 Linux 服务器。像 Windows 95 这样的系统所呈现的唾手可得的目标已经不复存在，这意味着网络犯罪分子必须更加努力才能找到入侵途径。而一旦他们开始更加努力，没错，他们确实找到了入侵\
    \ Linux 的方法。\n\nLinux 服务器无处不在的事实意味着，罪犯几乎不可能避开它们。事实上，情况已经发展到网络犯罪分子*必须*攻击 Linux\
    \ 才能继续繁荣的地步。（好吧，也许“繁荣”这个词太仁慈了，但你们明白我的意思。）\n\nVMware 威胁分析部门最近发布了一份关于基于 Linux 的多云环境中恶意软件的报告。该报告\
    \ [1] 只需输入姓名和电子邮件地址即可免费下载，重点针对基于云端的 Linux 实例的勒索软件和加密货币挖矿攻击。报告指出：“威胁行动者知道当前的恶意软件对策主要针对基于\
    \ Windows 的威胁，这使得许多公共和私有云部署容易受到基于 Linux 的攻击。”\n\n正如你预期的那样，过时且管理不善的 Linux 系统被认为是最脆弱的，但往往直到为时已晚，我们才真正知道哪些系统是“管理不善”的。报告声称，最常见的威胁是“利用容器基础架构中的弱认证、漏洞和错误配置，利用远程访问工具\
    \ (RATs) 渗透环境。”\n\nCobalt Strike 是一种商业渗透测试工具，也被网络犯罪分子使用。报告概述了攻击者如何实施 Cobalt Strike\
    \ 使用的 Beacon 植入物的 Linux 版本，以便将攻击移植到基于 Linux 的系统。随着犯罪分子适应以 Linux 为重点的互联网，类似的转换正在其他地方发生。\n\
    \n通常的建议在这里也适用：使用强密码并保持系统更新，以防止攻击者获得立足点。但仅凭这些久经考验的措施不足以保护你的 Linux 云环境。VMware 团队建议“……对所有工作负载进行完整监控，提供详细的系统上下文，以便更容易理解和优先处理缓解工作。”他们还说，你应该使用端点检测与响应\
    \ (EDR) 系统，该系统将监控、收集数据，并在发现异常时发送自动警报。\n\n重要的是，要保持警惕，不要仅仅因为 Linux 比 Windows 更安全就假设它是安全的。Linux\
    \ 可能是周围最安全的系统，但你仍然需要做足功课，因为危险潜伏在最近的云层背后。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_2_0.png)\n\
    \nJoe Casad,\n总编辑\n\n- 信息\n- [1] 威胁报告：揭露基于 Linux 的多云环境中的恶意软件：https://www.vmware.com/resources/security/exposing-malware-in-multi-cloud.html\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_3_0.png)\n\n2022 年 4 月\n\n# 封面故事\n\n\
