    不过，Frankel 多年来也一直在反对原生 Linux 版本，所以一切似乎都有可能。


    尽管拥有非自由许可证，Reaper 允许用户比市场上任何其他 DAW 进行更广泛的定制，且用户无需掌握编程语言。其他音频程序最多允许你更改颜色，而 Reaper
    允许你自己开发或交换*完整的*主题，包括混音器和编辑器的不同视图。你还可以为功能分配自己的键盘快捷键，并通过宏和脚本来适应个人偏好。Reaper 开发团队也会回应社区的要求。


    开发团队通常能快速实现功能请求和 bug 报告，前提是它们通过内部论坛 [2] 上报。一天发布几个小数点更新并不罕见，两次更新之间很少超过一个月。如果你在使用
    Reaper 时遇到困难，多语言论坛通常是首选的求助渠道。就像 Ubuntu 用户社区一样，Reaper 社区庞大、乐于助人、大多友好，并且由于 Reaper
    的国际发行，全天候可访问。


    ## 独特卖点


    Reaper 在保留经典工作流程方法和基本用户界面（可能熟悉于 Ardour、Pro Tools、SampleDance 或 Cubase）的同时，做了一些不同的事情。换句话说，轨道控制元素位于编辑器的左侧，混音器中通常的通道结构保持不变。工作流程和外观可以比任何其他知名
    DAW 更全面地进行定制。此外，Reaper 支持宏和几种脚本语言（原生的 ReaScript/EEL，以及 Lua 和 Python）。因此，Reaper
    在音频领域享有“DAW 界的 Linux”的声誉。


    与其他 DAW 不同，Reaper 仅使用一种轨道类型。音频和 MIDI 项目都可以存储在轨道上并进行录制。将类型分开仍然有意义，但你无需提前选择类型。每个轨道都可以变成音频、MIDI、乐器、特效、


    ![](img/8286bf901ba268fe114d66ada92d1dd6_38_0.png)


    母带（Bus）、VCA 或文件夹轨道——这需要一些时间来习惯。在我看来，其他 DAW 中这种人为的轨道类型分离只会造成不必要的麻烦。可频繁分配的轨道和项目颜色、轨道图标和名称让用户一目了然。在混音器的相应插件槽中，也没有音频、MIDI
    或乐器插件的单独区域。


    一个项目可以是音频或 MIDI 事件，可以配备项目特效（FX）。这样，你不必将特效作为轨道特效链接到轨道上，虽然必要时你可以这样做。一旦习惯了项目特效，你就再也无法离开关了。此外，除了自动化（图
    2）之外，每个项目还有自己的音量设置。


    Reaper 的资源占用相对较低。安装后，Reaper 占用的空间不到 100MB；如有需要，你还可以在 USB 闪存盘上设置便携式安装，作为移动 DAW。运行时，Reaper
    比竞争对手消耗更少的内存和 CPU 资源——这肯定部分归功于其简约的界面。插件也可以可选地作为单独进程运行。如果你在实验或使用 Alpha 版本，有 bug
    的插件不会让整个 DAW 崩溃。


    所有这些使得 Reaper 成为低性能硬件或旧系统的绝佳 DAW。即使是一台 15 年前的笔记本电脑也能轻松处理不太复杂的音频工作。Linux CPU 架构选择包括
    x86-64、i686、AArch64 (ARM64) 和 Arm7l (ARM32)。Reaper 甚至可以在 Raspberry Pi 4 上运行，但由于算力不足存在一些限制。多轨录音的效果优于带有实时监听的叠录（Overdubbing）。


    ## 操作


    你可以通过单击以通常的方式控制 Reaper。或者，你可以使用“新”方法如拖放来改进工作流程体验。为此，按住鼠标左键，只需将鼠标指针拖动到相应的控件上即可。你可以在编辑器或混音器中启用独奏（Solo）、静音（Mute）和准备录音（Record
    Ready），也可以在轨道管理器（Ctrl + Shift + M）中对轨道进行淡入淡出。你可以在路由矩阵（Alt + M）中快速将发送（Sends）设置到母带。同时选中的轨道也可以同时控制，例如使用音量或声像控制。最终，这为你留出了更多时间用于创作过程。


    Reaper 要么直接启动到最后一个项目，显示一个选择框，要么加载一个新项目。对于新项目，DAW 直接在临时目录中录制轨道。当你保存时，Reaper 随后会将文件转储或复制到目标目录。将采样率为
    44.1 或 48 kHz 的音频文件拖入定义为其他设置的项目并没有问题——Reaper 会在后台实时重新采样。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_38_1.png)


    '
