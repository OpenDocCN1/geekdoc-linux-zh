    Creating temporary filesystem /omd/sites/cmk_tutorial/tmp...OK\nUpdating core\
    \ configuration...OK\nGenerating configuration for core (type nagios)...Precompiling\
    \ host checks...OK\nOK\nExecuting post-create script \"01_create-sample-config.py\"\
    ...OK\nRestarting Apache...OK\n```\n```\n\nFigure 2: Creating a monitoring site.\n\
    \n```\n```\nCreated new site cmk_tutorial with version 2.0.0p13.cre.\n\nThe site\
    \ can be started with 'omd start cmk_tutorial'.\nThe default web UI is available\
    \ at 'http://FerndinandPC/cmk_tutorial/'.\n\nThe admin user for the web applications\
    \ is 'cmkadmin' with password: 'E34jQcAgL'.\nFor command line administration of\
    \ the site, log in with 'omd su cmk_tutorial'.\nAfter logging in you can change\
    \ the password for cmkadmin with 'htpasswd etc/htpasswd cmkadmin'.\n```\n```\n\
    \nFigure 3: The installation ends with instructions for how to access the site.\
    \ Be sure to change the password – either at the command line or through the Checkmk\
    \ user interface.\n\nAt the end of the output, you should now see the information\
    \ about how to start and access your Checkmk site (Figure 3). You can follow the\
    \ steps to change your admin password in the terminal, but I prefer to do that\
    \ in the Checkmk user interface.\n\nCopy the randomly generated password (you\
    \ will need it in the next step), and start your monitoring site with **omd start**:\n\
    \n```\n```\nomd start cmk_tutorial\n```\n```\n\nShould you want to drill deeper\
    \ into Checkmk later on, it is important to understand what has just taken place.\
    \ By creating a new Checkmk site, you have created a new user, which is known\
    \ as the site user, and a group with the name of the site on your server. A directory\
    \ for the site will have been created under /omd/sites (e.g., /omd/sites/cmk\\\
    _tutorial). Checkmk also copied its default configuration into the new directory,\
    \ and a user with the name **cmkadmin** has been created for the Checkmk web interface.\n\
    \n# Start Monitoring with Checkmk\n\nBefore you go to the Checkmk user interface,\
    \ think about the systems you want to monitor. For this tutorial, I will monitor\
    \ my TP-Link TD-W9960v router with the classic protocol Simple Network Monitoring\
    \ Protocol (SNMP). If you also want to monitor systems with SNMP, you should make\
    \ sure the SNMP agent is active on your device. In my case, I had to activate\
    \ it in my router's web interface, and I decided to keep the SNMP community set\
    \ to the default value **public**. (In a real-world setting, you will want to\
    \ change this community string rather than using the default value.)\n\nOnce you\
    \ are sure the host you want to monitor is ready to provide the monitoring data,\
    \ it is time to switch to the Checkmk user interface in your browser. Every Checkmk\
    \ site has its own URL, which consists of your monitoring server's IP address\
    \ or host name and the name of the Checkmk site. In my example, this is **127.0.0.1/cmk\\\
    _tutorial**."
  md: "\n# The sys admin's daily grind: Last words\n\n## Time to Say Goodbye\n\nAfter\
    \ two decades as a sys admin columnist, Charly bids a fitting farewell with a\
    \ login banner created with FIGlet. *By Charly Kühnast*\n\nWhen I log in to servers\
    \ or network components, I am often greeted by a large font banner with variable\
    \ information content. Sometimes it simply tells me the hostname, sometimes the\
    \ kernel version, and sometimes it reads **DO NOT REBOOT BETWEEN 8AM AND 8PM.**\n\
    \nOf course, it is debatable whether banners make sense or are just non-sense,\
    \ and I use them sparingly on my own systems. However, servers that I can't just\
    \ play around with warn me with a banner that reads *Abyssus abyssum invocat*\
    \ (one mistake leads to another).\n\nTest systems for evaluating new software,\
    \ on the other hand, cheerfully greet me with *Morturi te salutant* (those who\
    \ are about to die, salute you). I've fared quite well with that banner all these\
    \ years, but how do you create one?\n\nI use FIGlet [1] for this. All of the popular\
    \ distros include this tool, which supports several fonts and offers a variety\
    \ of design options. I don't use any of them – I just want to get an unambiguous\
    \ message across when logging in. That's why I only use the `-c` parameter to\
    \ center the banner, which would otherwise be left-justified. For my farewell\
    \ banner, I make an exception and also use the `-D` parameter, which lets you\
    \ display German umlauts. I can usually ignore these with my Latin calendar sayings.\
    \ FIGlet replaces special characters such as `[`, `\\`, and `]` with `Â`, `Ö`,\
    \ and `Û` while `Ĺ`, `l`, and `}` give you the corresponding lowercase letters.\
    \ The call\n\nFIGlet `-C -D` Vielen Dank für `20` Jahre\n\nproduces the banner\
    \ shown in Figure 1 (see Figure 2 for the English version).\n\nSo, that's all\
    \ folks. I'm saying goodbye to my work on this column, which I started with the\
    \ February 2002 issue of the *Linux Magazine* German edition and am now ending\
    \ with the February 2022 issue. I am taking this step because I would like to\
    \ write less frequently in the future, but in greater detail. I would like to\
    \ thank the entire editorial team for their support, especially Jan Klemert and\
    \ Jörg Lüther, the editors-in-chief for the *Linux Magazine* German edition. But\
    \ the biggest thanks go to you, dear Linux friends!\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_45_0.png)\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_45_1.png)\n\n## Info\n\n- [1] FIGlet:\
    \ http://www.figlet.org\n\n## Author\n\nCharly Kühnast manages Unix systems in\
    \ a data center in the Lower Rhine region of Germany. His responsibilities include\
    \ ensuring the security and availability of firewalls and the DMZ.\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_45_2.png)\n\
    \n# IN-DEPTH\n\n## Checkmk\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_46_0.png)\n\
    \n# Easy monitoring with Checkmk\n\n## Check It\n\nWe'll show you how to use the\
    \ Checkmk open source monitoring tool to monitor your home router.\n\nBy Martin\
    \ Hirschnvogel\n\nEvery organization needs monitoring to make sure that servers,\
    \ networks, applications, cloud assets, and other elements work as they should.\
    \ Monitoring also provides timely alerts, and it helps IT teams track down the\
    \ causes of (potential) problems. Having a suitable monitoring tool will help\
    \ you resolve problems faster, ideally before they have an impact on operational\
    \ systems. Checkmk [1] is an open source monitoring tool that is ideally suited\
    \ for modern hybrid environments, combining enterprise-grade scalability and security\
    \ with the extendibility of open source software.\n\nIn most cases, Checkmk runs\
    \ on a dedicated server or virtual machine (VM). As I am just running a small\
    \ monitoring setup for my home office environment, my host will be my computer\
    \ with Ubuntu 18.04. The computer has four CPU cores and 4GB of RAM, which is\
    \ more than enough to get started. Checkmk also runs on other Linux distributions,\
    \ such as Debian, Red Hat Enterprise Linux, CentOS, or SUSE Linux Enterprise Server,\
    \ and you can also run Checkmk on a Docker container or virtual appliance. If\
    \ you install Checkmk on a dedicated host, the only additional steps you need\
    \ are transferring the files to the server.\n\nCheckmk can monitor anything with\
    \ an IP address, including servers, cloud assets, and network devices, as well\
    \ as systems that belong to the Internet of Things (IoT). For this article, I\
    \ chose to monitor my TP-Link router. Checkmk also comes ready-equipped with reasonable\
    \ thresholds for alerts. These preconfigured thresholds will come in handy, because\
    \ your monitoring will be up and running within a few minutes without you having\
    \ to worry about setting up alerts.\n\n## Choose a Checkmk Edition\n\nYou can\
    \ use Checkmk for free. For this tutorial, I chose the Checkmk Raw Edition. You\
    \ could also start with the Checkmk Free Edition, the free version of the Checkmk\
    \ Enterprise Edition, which provides additional features. After 30 days, the Free\
    \ Edition is limited to 25 hosts. The Checkmk Raw Edition is completely open source\
    \ and permanently free.\n\nCheckmk started as a front-end for the Nagios [2] open\
    \ source monitoring tool several years ago, but it became a stand-alone monitoring\
    \ solution in 2012 and has replaced almost all Nagios components. The Checkmk\
    \ Raw Edition still uses the Nagios monitoring core as a utility. To get started\
    \ with Checkmk, go to the download section on the project website [3], where you\
    \ will find the latest versions. Select the Checkmk Raw Edition, choose the latest\
    \ stable version (this tutorial is based on version 2.0.0p13), and then choose\
    \ your platform and your OS version. Click the download button and download the\
    \ package.\n\nOnce the download has finished, you will need to install the package,\
    \ including all of dependencies. Installation steps vary depending on your distro.\
    \ In my case, I will switch to the terminal and go to my download folder, and\
    \ then run apt install as root (see Figure 1):\n\n```bash\napt install ../check-mk-raw-2.0.0p13_0.bionic_amd64.deb\n\
    ```\n\n```bash\nroot@FerndinandPC:/home/ferdinand/Downloads# apt install ./check-mk-raw-2.0.0p13_0.bionic_amd64.deb\n\
    Reading package lists... Done\nBuilding dependency tree\nReading state information...\
    \ Done\nNote, selecting 'check-mk-raw-2.0.0p13' instead of './check-mk-raw-2.0.0p13_0.bionic_amd64.deb'\n\
    The following NEW packages will be installed:\n check-mk-raw-2.0.0p13\n0 upgraded,\
    \ 1 newly installed, 0 to remove and 46 not upgraded.\n```\n\nFigure 1: Installing\
    \ Checkmk.\n\nOnce the installation is completed, you can perform a test. The\
    \ command **omd** should be accessible now. The following command:\n\n```bash\n\
    omd version\n```\n\nshould return the details of the Checkmk version you are currently\
    \ using.\n\nThe **omd** command stands for Open Monitoring Distribution (OMD),\
    \ an open source project created by Mathias Kettner, the founder of Checkmk [4].\
    \ The OMD project includes monitoring solutions assembled from various components.\n\
    \n## Create Your Checkmk Monitoring Site\n\nThe next step is to start an initial\
    \ monitoring site (a site is also known as an instance). Make sure you are still\
    \ root and use **omd create** to create a new Checkmk site and name it as you\
    \ wish (Figure 2). This tutorial uses **cmk\\_tutorial**:\n\n```bash\nomd create\
    \ cmk_tutorial\n```\n\n```bash\nroot@FerndinandPC:/home/ferdinand# omd create\
    \ cmk_tutorial\nAdding /opt/omd/sites/cmk_tutorial/tmp to /etc/fstab.\nCreating\
    \ temporary filesystem /omd/sites/cmk_tutorial/tmp...OK\nUpdating core configuration...OK\n\
    Generating configuration for core (type nagios)...Precompiling host checks...OK\n\
    OK\nExecuting post-create script \"01_create-sample-config.py\"...OK\nRestarting\
    \ Apache...OK\n```\n\nFigure 2: Creating a monitoring site.\n\n```text\nCreated\
    \ new site cmk_tutorial with version 2.0.0p13.cre.\n\nThe site can be started\
    \ with 'omd start cmk_tutorial'.\nThe default web UI is available at 'http://FerndinandPC/cmk_tutorial/'.\n\
    \nThe admin user for the web applications is 'cmkadmin' with password: 'E34jQcAgL'.\n\
    For command line administration of the site, log in with 'omd su cmk_tutorial'.\n\
    After logging in you can change the password for cmkadmin with 'htpasswd etc/htpasswd\
    \ cmkadmin'.\n```\n\nFigure 3: The installation ends with instructions for how\
    \ to access the site. Be sure to change the password – either at the command line\
    \ or through the Checkmk user interface.\n\nAt the end of the output, you should\
    \ now see the information about how to start and access your Checkmk site (Figure\
    \ 3). You can follow the steps to change your admin password in the terminal,\
    \ but I prefer to do that in the Checkmk user interface.\n\nCopy the randomly\
    \ generated password (you will need it in the next step), and start your monitoring\
    \ site with **omd start**:\n\n```bash\nomd start cmk_tutorial\n```\n\nShould you\
    \ want to drill deeper into Checkmk later on, it is important to understand what\
    \ has just taken place. By creating a new Checkmk site, you have created a new\
    \ user, which is known as the site user, and a group with the name of the site\
    \ on your server. A directory for the site will have been created under /omd/sites\
    \ (e.g., /omd/sites/cmk\\_tutorial). Checkmk also copied its default configuration\
    \ into the new directory, and a user with the name **cmkadmin** has been created\
    \ for the Checkmk web interface.\n\n## Start Monitoring with Checkmk\n\nBefore\
    \ you go to the Checkmk user interface, think about the systems you want to monitor.\
    \ For this tutorial, I will monitor my TP-Link TD-W9960v router with the classic\
    \ protocol Simple Network Monitoring Protocol (SNMP). If you also want to monitor\
    \ systems with SNMP, you should make sure the SNMP agent is active on your device.\
    \ In my case, I had to activate it in my router's web interface, and I decided\
    \ to keep the SNMP community set to the default value **public**. (In a real-world\
    \ setting, you will want to change this community string rather than using the\
    \ default value.)\n\nOnce you are sure the host you want to monitor is ready to\
    \ provide the monitoring data, it is time to switch to the Checkmk user interface\
    \ in your browser. Every Checkmk site has its own URL, which consists of your\
    \ monitoring server's IP address or host name and the name of the Checkmk site.\
    \ In my example, this is **127.0.0.1/cmk\\_tutorial**.\n"
  mdcn: "\n# 系统管理员的日常：最后的话\n\n## 该说再见了\n\n作为一名系统管理员专栏作家已有二十年，查利使用 FIGlet 创建的一个登录横幅，献上了一段恰到好处的告别。*作者：Charly\
    \ Kühnast*\n\n当我登录到服务器或网络组件时，通常会看到一个使用大号字体的横幅，里面的信息内容各不相同。有时它只是告诉我主机名，有时是内核版本，有时则会显示**请勿在上午8点至下午8点之间重启**。\n\
    \n当然，关于横幅是否有意义，还是仅仅是一堆废话，是可以辩证的。我在自己的系统上很少使用它们。然而，那些我不能随意乱动的服务器会用一个横幅来警告我，上面写着\
    \ *Abyssus abyssum invocat*（一个错误会导致另一个错误）。\n\n另一方面，用于评估新软件的测试系统则会愉快地向我打招呼，横幅上写着\
    \ *Morturi te salutant*（那些即将死去的人向你致敬）。这些年来，我对那个横幅的运气还不错，但你该如何创建一个呢？\n\n我使用 FIGlet\
    \ [1] 来做到这一点。所有流行的发行版都包含这个工具，它支持多种字体并提供各种设计选项。我没有任何使用——我只是想在登录时传递一个明确的信息。这就是我为什么只使用\
    \ `-c` 参数来居中对齐横幅，否则它将是左对齐的。对于我的告别横幅，我破例也使用了 `-D` 参数，它允许显示德语变音符号。在我使用拉丁语格言时，我通常可以忽略这些符号。FIGlet\
    \ 会将诸如 `[`、`\\` 和 `]` 这样的特殊字符替换为 `Â`、`Ö` 和 `Û`，而 `Ĺ`、`l` 和 `}` 则会给出对应的小写字母。该命令：\n\
    \nFIGlet `-C -D` Vielen Dank für `20` Jahre\n\n产生了如图 1 所示的横幅（英文版见图 2）。\n\n好了，就是这样。我要与我在这个专栏上的工作告别，该专栏始于\
    \ 2002 年 2 月的 *Linux Magazine* 德语版，现结束于 2022 年 2 月的这一期。我之所以采取这一步，是因为我未来希望减少写作频率，但写得更详细。我要感谢整个编辑团队的支持，特别是\
    \ *Linux Magazine* 德语版的主编 Jan Klemert 和 Jörg Lüther。但最大的感谢献给你们，亲爱的 Linux 朋友们！\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_45_0.png)\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_45_1.png)\n\
    \n## 信息\n\n- [1] FIGlet: http://www.figlet.org\n\n## 作者简介\n\nCharly Kühnast 在德国下莱茵地区的数据中心管理\
    \ Unix 系统。他的职责包括确保防火墙和 DMZ 的安全性和可用性。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_45_2.png)\n\
    \n# 深入解析\n\n## Checkmk\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_46_0.png)\n\
    \n# 使用 Checkmk 进行简单监控\n\n## 检查一下\n\n我们将向您展示如何使用 Checkmk 开源监控工具来监控您的家庭路由器。\n\n\
    作者：Martin Hirschnvogel\n\n每个组织都需要监控，以确保服务器、网络、应用程序、云资产和其他元素按预期运行。监控还提供了及时的警报，并帮助\
    \ IT 团队追踪（潜在）问题的原因。拥有一个合适的监控工具可以帮助你更快地解决问题，理想情况下，在问题对运营系统产生影响之前。Checkmk [1] 是一个开源监控工具，非常适合现代混合环境，它结合了企业级可扩展性和安全性，以及开源软件的可扩展性。\n\
    \n在大多数情况下，Checkmk 运行在专用的服务器或虚拟机（VM）上。由于我只是为了家庭办公环境运行一个小规模的监控设置，我的主机将是运行 Ubuntu\
    \ 18.04 的电脑。这台电脑有四个 CPU 核心和 4GB 内存，这对于入门来说绰绰有余。Checkmk 也运行在其他 Linux 发行版上，如 Debian、Red\
    \ Hat Enterprise Linux、CentOS 或 SUSE Linux Enterprise Server，你也可以在 Docker 容器或虚拟设备上运行\
    \ Checkmk。如果你在一台专用主机上安装 Checkmk，你唯一需要做的额外步骤是将文件传输到服务器。\n\nCheckmk 可以监控任何具有 IP\
    \ 地址的设备，包括服务器、云资产和网络设备，以及属于物联网（IoT）的系统。在这篇文章中，我选择监控我的 TP-Link 路由器。Checkmk 还预装了合理的警报阈值。这些预配置的阈值会很有用，因为你无需担心设置警报，即可在几分钟内启动监控。\n\
    \n## 选择 Checkmk 版本\n\n你可以免费使用 Checkmk。对于这个教程，我选择了 Checkmk Raw Edition。你也可以选择 Checkmk\
    \ Free Edition，它是 Checkmk Enterprise Edition 的免费版本，提供额外的功能。30 天后，Free Edition\
    \ 仅限于 25 台主机。Checkmk Raw Edition 是完全开源的，且永久免费。\n\nCheckmk 几年前作为 Nagios [2] 开源监控工具的前端起步，但在\
    \ 2012 年成为独立的监控解决方案，并取代了几乎所有 Nagios 组件。Checkmk Raw Edition 仍然使用 Nagios 监控核心作为实用工具。要开始使用\
    \ Checkmk，请访问项目网站 [3] 的下载部分，在那里你可以找到最新版本。选择 Checkmk Raw Edition，选择最新的稳定版本（本教程基于版本\
    \ 2.0.0p13），然后选择你的平台和操作系统版本。点击下载按钮下载软件包。\n\n下载完成后，你需要安装该软件包，包括所有依赖项。安装步骤因发行版而异。在我的情况下，我将切换到终端，进入下载文件夹，然后以\
    \ root 身份运行 apt install（见图 1）：\n\n```bash\napt install ../check-mk-raw-2.0.0p13_0.bionic_amd64.deb\n\
    ```\n\n```bash\nroot@FerndinandPC:/home/ferdinand/Downloads# apt install ./check-mk-raw-2.0.0p13_0.bionic_amd64.deb\n\
    Reading package lists... Done\nBuilding dependency tree\nReading state information...\
    \ Done\nNote, selecting 'check-mk-raw-2.0.0p13' instead of './check-mk-raw-2.0.0p13_0.bionic_amd64.deb'\n\
    The following NEW packages will be installed:\n check-mk-raw-2.0.0p13\n0 upgraded,\
    \ 1 newly installed, 0 to remove and 46 not upgraded.\n```\n\n图 1：安装 Checkmk。\n\
    \n安装完成后，你可以进行测试。**omd** 命令现在应该可以访问了。以下命令：\n\n```bash\nomd version\n```\n\n应该返回你当前使用的\
    \ Checkmk 版本的详细信息。\n\n**omd** 命令代表 Open Monitoring Distribution（OMD），这是一个由 Checkmk\
    \ [4] 创始人 Mathias Kettner 创建的开源项目。OMD 项目包括由各种组件组装而成的监控解决方案。\n\n## 创建你的 Checkmk\
    \ 监控站点\n\n下一步是启动一个初始监控站点（站点也被称为实例）。确保你仍然是 root，并使用 **omd create** 创建一个新的 Checkmk\
    \ 站点，并按你的意愿命名（图 2）。本教程使用 **cmk\\_tutorial**：\n\n```bash\nomd create cmk_tutorial\n\
    ```\n\n```bash\nroot@FerndinandPC:/home/ferdinand# omd create cmk_tutorial\nAdding\
    \ /opt/omd/sites/cmk_tutorial/tmp to /etc/fstab.\nCreating temporary filesystem\
    \ /omd/sites/cmk_tutorial/tmp...OK\nUpdating core configuration...OK\nGenerating\
    \ configuration for core (type nagios)...Precompiling host checks...OK\nOK\nExecuting\
    \ post-create script \"01_create-sample-config.py\"...OK\nRestarting Apache...OK\n\
    ```\n\n图 2：创建监控站点。\n\n```text\nCreated new site cmk_tutorial with version 2.0.0p13.cre.\n\
    \nThe site can be started with 'omd start cmk_tutorial'.\nThe default web UI is\
    \ available at 'http://FerndinandPC/cmk_tutorial/'.\n\nThe admin user for the\
    \ web applications is 'cmkadmin' with password: 'E34jQcAgL'.\nFor command line\
    \ administration of the site, log in with 'omd su cmk_tutorial'.\nAfter logging\
    \ in you can change the password for cmkadmin with 'htpasswd etc/htpasswd cmkadmin'.\n\
    ```\n\n图 3：安装结束时会显示有关如何访问站点的说明。请务必更改密码——可以在命令行或通过 Checkmk 用户界面进行更改。\n\n在输出的末尾，你现在应该可以看到关于如何启动和访问你的\
    \ Checkmk 站点的信息（图 3）。你可以按照步骤在终端中更改管理员密码，但我更喜欢在 Checkmk 用户界面中这样做。\n\n复制随机生成的密码（你在下一步需要用到它），并使用\
    \ **omd start** 启动你的监控站点：\n\n```bash\nomd start cmk_tutorial\n```\n\n如果你以后想更深入地了解\
    \ Checkmk，理解刚刚发生的事情非常重要。通过创建一个新的 Checkmk 站点，你创建了一个新用户，称为站点用户，以及服务器上以站点名称命名的组。将在\
