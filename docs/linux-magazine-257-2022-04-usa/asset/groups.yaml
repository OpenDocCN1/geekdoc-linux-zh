    \ 4 中，Gimp 判定旧金山不太知名的 Billy Goat Hill 公园的照片需要向右旋转四分之一圈，并建议立即完成任务。\n\n但是，像素的四分之一旋转在二维矩阵中是如何工作的？图\
    \ 5 示意地展示了具有值 (1,2,3,4) 的第一行像素在将矩阵顺时针旋转 90 度后如何变成结果中最右侧的列。\n\n虽然算法将行转换为列，但目标图像的尺寸也会改变。手机照片通常是矩形而非正方形，旋转\
    \ 90 度的照片不仅改变其像素值，还会交换结果整体图像的宽度和高度。Listing 4 通过在第 10 行交换 `bounds` 中 X 和 Y 方向的尺寸来考虑这一点，使得在第\
    \ 12 行由 `NewRGBA()` 生成的可修改目标图像已经具有旋转后矩形的尺寸，而不是原始尺寸。\n\n## 旋转 90 度\n\n并非所有保存错误的图像都是倒置的。有时图像也是侧向的，需要旋转\
    \ 90 度。在这种情况下，调用 `exiftool` 会显示类似 `Orientation: 90 CW` 的信息用于 JPEG 文件。这表明你需要将图像旋转\
