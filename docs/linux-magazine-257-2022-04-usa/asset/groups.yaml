    ### LibreOffice vs OpenOffice\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_57_0.png)\n\
    \n#### Comparing LibreOffice and OpenOffice\n\n**The Clear Choice**\n\nWhile LibreOffice\
    \ and OpenOffice have a shared past, LibreOffice outstrips OpenOffice in contributors,\
    \ code commits, and features. By Bruce Byfield\n\nA search for comparisons of\
    \ LibreOffice and Apache OpenOffice returns over 8.3 million results. That number\
    \ comes as no surprise, given that LibreOffice and OpenOffice are the best-known\
    \ open source office suites and share a common past. However, what is surprising\
    \ is how shallow many of the comparisons are. Many offer only a superficial glimpse\
    \ at either office suite from the viewpoint of an unsophisticated and demanding\
    \ user. Often, the comparisons are obsolete. Also important to note is that many\
    \ comparisons strive for a false sense of objectivity by declaring that any differences\
    \ are minor. However, by every possible standard, LibreOffice outshines OpenOffice\
    \ and shows OpenOffice to be outdated. To pretend otherwise is a distortion of\
    \ the truth.\n\nAs you might know, the two office suites share a common history\
    \ (Figure 1). Both originate in OpenOffice.org, a project run by Sun Microsystems\
    \ from 2000-2011. In fact, OpenOffice claims to be the legal descendent of OpenOffice.org\
    \ because in 2011 Sun passed OpenOffice.org to Oracle, which in turn passed it\
    \ on to the Apache Foundation – but the concept of ownership has little relevance\
    \ in open source. At the same time, Go-o.o, a semi-official fork that had operated\
    \ quietly since 2007, created LibreOffice and its governing body, The Document\
    \ Foundation. Go-o.o had been contentious in OpenOffice.org because it advocated\
    \ a faster pace of development, so the creation of the two new projects seemed\
    \ to formalize a division that already existed.\n\nCertainly LibreOffice and OpenOffice\
    \ showed little love for one another from the beginning. Also from the start,\
    \ OpenOffice faced challenges that LibreOffice did not. To start with, OpenOffice\
    \ uses the Apache License, while LibreOffice uses a dual LGPLv3/Mozilla Public\
    \ License (MPL). A major consequence of this difference in licenses is that LibreOffice\
    \ can borrow code from OpenOffice, while OpenOffice cannot borrow code from LibreOffice.\
    \ Just as importantly, from late March 2014 to March 2015, OpenOffice had a total\
    \ of 16 contributors, 12 of whom stopped contributing when IBM stopped supporting\
    \ OpenOffice [1]. Since then, OpenOffice has been reluctant to publish the number\
    \ of contributors, but, considering that OpenOffice claimed 120 contributors in\
    \ 2012 [2], it is doubtful that the number today is more than a small fraction\
    \ of LibreOffice’s 1,722 [3]. The result is predictable: OpenOffice has not had\
    \ a major release since 2014 and only 11 minor ones. In comparison, LibreOffice\
    \ has had 13 major releases and 87 minor releases. And in 2019, LibreOffice had\
    \ over 15,000 code commits and OpenOffice had 595 [4].\n\nEqually inevitably,\
    \ LibreOffice has attracted important corporate supporters such as Red Hat and\
    \ Collabora while OpenOffice has been unable to fill the void left by IBM eight\
    \ years ago. OpenOffice’s continued existence has been quaint, even admirable,\
    \ but the project is simply not structured to compete.\n\n**The Feature Disparity**\n\
    \nAside from Go-o.o’s contributions a decade ago, the two projects initially\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_58_0.png)\n\nshared a common codebase.\
    \ Even today, enough code remains the same that extensions that run with one often\
    \ run with the other's releases, although less often than a decade ago. No doubt\
    \ the mutual use of Open Document Format (ODF) for files contributes to continued\
    \ compatibility. However, the differences do seem to be growing — mostly due to\
    \ LibreOffice's innovations. The difference can be seen in the download sizes:\
    \ LibreOffice's DEB download file is 195MB, while OpenOffice's is 159MB. In other\
    \ words, LibreOffice is close to one quarter larger, despite the fact that it\
    \ has removed redundancies in the code and rewritten parts for greater efficiency;\
    \ operations that OpenOffice has yet to duplicate.\n\nAbout eight years ago, I\
    \ saw a copy of a LibreOffice internal document that listed all the OpenOffice\
    \ features that OpenOffice lacked. To my surprise, there were hundreds of line\
    \ items. Even though many were minor, the differences are far too numerous to\
    \ list, let alone to explain each one. However, among the more significant features,\
    \ LibreOffice included an extensive overhaul of the interface, rearranging menu\
    \ items, repositioning items in windows to make them more accessible, adding themes,\
    \ and in general creating a more user-friendly look. These changes are especially\
    \ noticeable in the Charts subsystem for spreadsheets, where the colors were updated\
    \ from OpenOffice.org's stuck-in-the-1990s look. In addition, LibreOffice introduced\
    \ themes and a choice of user interfaces that includes an MS Office-like ribbon\
    \ toolbar. None of these changes have any equivalent in OpenOffice.\n\nLibreOffice's\
    \ new features are visible in all the modules, especially Writer and Calc. But\
    \ in the interests of space, I will let Writer stand as an illustration of the\
    \ others. Outstanding features in LibreOffice Writer that have no counterpart\
    \ in OpenOffice are:\n\n- The folding of Table Design into the other styles, where\
    \ it is easy to find and can be copied over into other files.\n- Default list\
    \ styles with choices of bullet and numbering systems, saving users the need to\
    \ set them up.\n- Export to EPUB format (this feature is still being fully implemented,\
    \ although it is often usable now).\n- Support for HarfBuzz, a font-rendering\
    \ app that allows the modification of OpenType and True Type files through a series\
    \ of codes added in character fields, making LibreOffice a full-fledged desktop\
    \ publisher.\n\nHowever, for many users, the most important improvements in LibreOffice\
    \ Writer are the continued enhancements for exporting to MS Word. This effort\
    \ can be a moving target because Microsoft often alters its formats, but reliable\
    \ import filters to MS Word are essential to many companies' adoption of LibreOffice.\
    \ Much of this work is due to LibreOffice's strategic alliance with Collabora,\
    \ which builds compatibility solutions for its customers and donates its improvements\
    \ to LibreOffice, contributing over a third of LibreOffice's commits in 2019.\
    \ In the recent 7.3 releases, the MS Word import and export filters are at a stage\
    \ where most routine business and academic documents can be reliably exchanged\
    \ with those not using LibreOffice. By contrast, OpenOffice's MS Word compatibility\
    \ is much more erratic.\n\n**The Latest Releases**\n\nFor still another perspective,\
    \ you have only to look at the latest release notes. On November 27, 2021, OpenOffice\
    \ announced the release of OpenOffice 4.1.11 [5]. The complete list of improved\
    \ or enhanced features for this release is:\n\n- Enabled persistent adjustment\
    \ to help text font size.\n- Added Fontwork to Insert menu.\n- Added missing PDF\
    \ export icon to File menu.\n\nIn addition, two bugs fixes were thought worthy\
    \ of mention:\n\n- New security warning introduced with Apache OpenOffice 4.1.10\
    \ blocks useful functions.\n- The Windows installation file has missing properties\
    \ and lacks a code signature.\n- Windows installation: Lost adapted texts after\
    \ switch to NIS 3.x.\n- Chart lost when saving in ODS format.\n\nFurthermore,\
    \ no new or updated dictionaries or languages were added.\n\nIn comparison, the\
    \ release notes for LibreOffice 7.3 [6], announced February 2, 2022, included\
    \ so many new features and improvements that a complete list would be too long\
    \ to include here.\n"
  mdcn: "\n\n## 深入解析\n\n### 编程快照 – 使用 Go 旋转照片\n\n#### 清单 5: autorot.go\n\n```go\n\
    package main\n\nimport (\n    \"flag\"\n    \"fmt\"\n    \"github.com/twcarns1n/goexif/exif\"\
    \n    \"os\"\n    \"path\"\n)\n\nfunc main() {\n    flag.Usage = func() {\n  \
    \      fmt.Printf(\"Usage: %s jpg-file\\n\", path.Base(os.Args[0]))\n        os.Exit(1)\n\
    \    }\n\n    flag.Parse()\n    if len(flag.Args()) != 1 {\n        flag.Usage()\n\
    \    }\n\n    jpgFile := flag.Arg(0)\n\n    f, err := os.Open(jpgFile)\n    if\
    \ err != nil {\n        panic(err)\n    }\n\n    data, err := exif.Decode(f)\n\
    \    if err != nil {\n        panic(err)\n    }\n\n    orient, err := data.Get(exif.Orientation)\n\
    \    if err != nil {\n        fmt.Printf(\"No orientation header found.\\n\")\n\
    \        os.Exit(0)\n    }\n\n    val, err := orient.Int(0)\n    if err != nil\
    \ {\n        panic(err)\n    }\n\n    switch val {\n    case 3:\n        imgMod(jpgFile,\
    \ jpgFile, rot180)\n    case 6:\n        imgMod(jpgFile, jpgFile, rot90)\n   \
    \ default:\n        panic(\"Unknown orientation\")\n    }\n}\n```\n\n使用 `imgMod`\
    \ 并传入适当的算法函数作为参数。清单 5 中对 `imgMod()` 的调用对源文件和目标文件使用了相同的名称，因此 `autorot` 只是简单地覆盖原始文件。如果这显得太过危险，您可以将目标文件重命名为\
    \ `.bak`，这样可以确保不会发生事故。\n\n当 Go 的图像库将 JPEG 图像写回磁盘时，它完全省略了原始的 Exif 数据，因此头部中不再存在指示正确旋转的\
    \ `orient` 条目。\n\n#### 编译程序\n\n您可以使用清单 6 中的命令序列来创建 `autorot` 二进制文件。`go` 编译器从 GitHub\
    \ 获取所需的库，编译它们，并将它们链接在一起。与往常一样，这会生成一个已经包含所有依赖项的可执行文件。它可以毫无问题地复制到另一台计算机上，并在该计算机上运行而不发出任何抱怨，前提是操作系统和处理器架构相似。\n\
    \n#### 清单 6: 编译 autorot\n\n```bash\n$ go mod init autorot\n$ go mod tidy\n$ go\
    \ build autorot.go rotate-90.go rotate-180.go imgmod.go\n```\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_55_0.png)\n\
    \n#### 结论\n\n该程序远非完美。它对大多数情况都能起作用，但仍然缺少逆时针旋转以及针对更奇特 Exif 值的算法。但凭借所描述的基础知识，可以轻松添加这些功能。与往常一样，Go\
    \ 并未对爱好者设限。\n\n**信息**\n\n1. 本文的清单：[http://ftp.linux-magazine.com/pub/listings/linux-magazine.com/257](http://ftp.linux-magazine.com/pub/listings/linux-magazine.com/257)\n\
    2. Mike Schilli 的文章“在手机照片中操纵存储的地理坐标”，载于《Linux 杂志》240 期，2020 年 12 月，[https://linux-magazine.com/issues/2020/240/Obfuscation-Filter](https://linux-magazine.com/issues/2020/240/Obfuscation-Filter)\n\
