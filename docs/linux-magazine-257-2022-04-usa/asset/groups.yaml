    # The State of Email


    Since manual checks are not a good way to handle large numbers of communication
    partners, PGP implements the concept of a web of trust. After careful personal
    verification of their identity, users sign the keys of other users (Figure 2),
    thereby increasing their trustworthiness. The signatures then become part of the
    user’s public key (Figure 3). If, at some point, keys have a sufficiently good
    reputation due to the many signatures of known trustworthy communication partners,
    you can do away with your own manual verification. Even today, PGP keysigning
    parties are held at conferences. You have to bring your own PGP keys and, by default,
    your ID card or passport as proof of identity, because careful verification is
    mandatory.


    But the concept of mutual PGP signing is complex, requires initiative, and requires
    a great deal of interaction – one of the main reasons why PGP has never gained
    widespread acceptance. Modern approaches therefore envisage publishing your own
    PGP key via special key servers run by your provider, from which communication
    partners can obtain it automatically. Although this approach does not rule out
    manipulation by the provider’s administrators, it does ensure that keys can no
    longer be generated and circulated arbitrarily by third parties. Using methods
    such as WKS/WKD [3], domain owners can therefore specify whose PGP key servers
    need to be queried for the keys for their own domain. However, only a few providers
    systematically offer PGP key servers and have set up corresponding WKD records
    for their mail domains. If they do, nothing stands in the way of an automatic
    key exchange. PGP implementations such as GnuPG can then automatically detect
    the correct key servers and download key material.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_23_0.png)


    Figure 2: Signing a third-party key increases its trustworthiness and requires
    appropriate care.


    ![](img/8286bf901ba268fe114d66ada92d1dd6_23_1.png)


    Figure 3: The properties of a key show its fingerprint and the signatures of other
    users.


    # S/MIME: A Central Approach


    S/MIME [4], the second known mail encryption method, basically encrypts and signs
    in a way comparable to PGP but takes a more centralized approach to key generation
    and management. S/MIME certificates are issued, monitored, and declared invalid
    if necessary by a central certification authority. S/MIME is therefore suitable
    for structured use in a very controlled environment, for example, in public authorities
    or large companies. It is not surprising that classic business mail clients such
    as Outlook have always supported S/MIME natively.


    On the other hand, S/MIME is less practical for private use, because there is
    initially no sensible centrally organized certification authority. Many years
    ago, there was an attempt by savings banks to issue S/MIME certificates to the
    masses via the S-Trust project, but this initiative did not catch on. The most
    practicable approach to date appears to be the Volksschlüssel- solving (People
    Encryption) project [5], which is run by the Fraunhofer Institute [6], which is
    worthy of recommendation but has not achieved widespread acceptance.


