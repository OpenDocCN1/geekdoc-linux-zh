    ## Linux Specifics


    Since version 6, Reaper is now available for Linux as a standalone program. As
    with Ardour, the Reaper installer is a script, which is run in a terminal window
    and guides you through the installation. In principle, this means that the developers
    offer compatibility with all distributions.


    However, depending on your system constellation, there may also be compatibility
    issues.


    Basically, Reaper is a good companion for everyday audio work on Linux, as well
    as production environments, because Reaper can easily interact with Alsa, PulseAudio,
    and Jack. I gained Reaper experience and always achieved good results with kernels
    5.4, 5.10 LTS, and 5.13. The test recordings I created amounted to 20 tracks,
    each five minutes in length and up to five effects in the mix and busses.


    However, Reaper has issues with some system combinations. Specifically, Wayland
    and PipeWire are problematic. For example, Manjaro with Gnome 41 and Wayland doesn’t
    allow you to drag and drop files from the file manager into the program. Fortunately,
    Reaper’s built-in Media Explorer lets you do this (View | Media Explorer or Ctrl
    + Alt + X). The Media Explorer even offers some


