    Doom 是一个克隆版，它略微提升了原始《毁灭战士》的一些限制以探索其他可能性，而没有破坏让原始游戏如此成功的那些核心机制。这就是为什么它将自己描述为 Chocolate
    Doom 的友好分支，后者是一个试图准确重现 1993 年硬件上《毁灭战士》样子的克隆版。Crispy Doom 在与原始版本的几个区别使其在现代硬件上更加方便。它可以在我们的现代显示器上以宽屏宽高比运行，并达到超越
    1993 年的 640x400 显示分辨率。它有伽马校正功能，可用于调整对比度和黑暗度，还有选项可以启用自由垂直视角、抬头显示器（HUD）、彩色状态栏以及许多其他选项。所有这些都可以从游戏内菜单或首次运行游戏时安装的配置文件中进行设置，且没有任何选项会破坏游戏的基本可玩性。实际上，仅仅在现代屏幕上以每秒
    120 帧运行，就能让游戏感觉非常现代。例如，它非常适合在树莓派上运行，并且在树莓派的 ARMch64 系统架构上构建速度很快。将这一切与电池、控制器和屏幕结合起来，可以作为树莓派游戏手持机的基础，而《毁灭战士》依然会一样有趣。


