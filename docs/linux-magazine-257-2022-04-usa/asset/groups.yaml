    might not be worth the effort and prices have increased, so find out in advance
    what additional costs you will have to pay.


    The lamps have eight channels each, which means they occupy eight addresses on
    the DMX bus. If you assign address 1 to the first lamp, the second lamp is assigned
    address 9. Somewhat confusingly, addresses and channels are talked about in the
    DMX environment as if they were different things. The rule of thumb is that you
    should have an address for each channel in the light.


    Table 1 shows an overview of the channels for the hardware I used.


    Most of the functions the DMX lamps offer are self-explanatory. Only a few items
    require special attention. For the spot to illuminate, you need a value greater
    than 0 on channel 1. You can’t turn up just the red dimmer while the general dimmer
    is set to 0.


    A value of 0 disables the strobe (channel 6). At a value of 1, it flashes at maximum
    rate and slows with an increase in value. Various predefined color scenarios can
    be selected in Auto Run operational mode; the playback speed is controlled by
    channel 8.


    At this point, the manufacturer’s documentation is a bit vague; it is not clear
    what exactly is supposed to happen. However, this is not a problem because an
    external controller is being used.


    The lamps have one DMX input and output each and have a power consumption of 36W,
    so the power can be supplied by a standard socket. The addresses of the lights
    can be set quite intuitively with a four-digit, seven-segment display on the back.
    Just make sure the display shows an A in the first position.


    Assign address 1 to the first lamp and address 9 to the second. If the address
    settings do not work at first, take a look in the enclosed manufacturer’s manual.
    Figure 1 shows the two lamps with the wiring and the Revolution Pi I used as a
    controller.


    ## Revolution Pi


    The Revolution Pi Core 3+ from Kunbus (hereafter, RevPi Core) [2] is a small industrial
    controller with a Raspberry Pi Compute Module at its heart. The RevPi Core can
    be extended with different modules and adapted to different requirements. The
    manufacturer’s extensive treasure trove of modules also contains a module the
    RevPi Core can use to connect to the DMX bus.


    The DMX module can operate in both primary and worker mode and control up to 512
    DMX addresses. The supply voltage is 24V DC with a current consumption during
    use of 100mA. The module indicates the current operating status with three LEDs.
    The exact meaning of the displays is shown in Table 2.


    An eight-pin plug on the front side of the module lets you establish a connection
    to the DMX bus. The pin assignment of the connector is shown in Table 3. You will
    also find it – and the pin assignment for the three-pin XLR connector – on the
    side of the module. If you need more information about the RevPi DMX module, it
    is best to take a look at the user manual [3].


    ## Configuration and Test


    The DMX module can be configured in two ways: either from the switches on the
    front of the module or by setting the corresponding values in software. Here,
    I look at how to configure the module in software. To begin, log in to the RevPi
    Core (Figure 2). The user is admin, and the password can be found on the right
    side of the device’s housing.


    After successfully logging in, start the PiCTory app (Figure 3) and drag and drop
    the RevPi Core and DMX module to the current configuration. The DMX module is
    configured by 2 bytes. An overview of the supported parameters can be found in
    Table 4. The address and channel settings can differ slightly depending on the
    mode (transmit/receive). If necessary, consult the manual [3].


    In the experimental setup, the first configuration byte under Value Editor (Config_1)
    is set to 0x10 and the second (Config_2) to 0x80 (Figure 4). To access the individual
    bytes of the DMX module in programs, they need to be published by checking the
    *Export* column. For the test setup you need to set the first 16 bytes (*DMXOut_1*
    to *DMXOut_16*).


    Figure 4 shows the complete configuration of the RevPi Core, including the DMX
    module. To keep the settings after a restart, save the configuration by selecting
    *File | Save as Start-Config*. Now reboot the RevPi Core to check that the settings
    have all taken effect.


    After the reboot, connect to the RevPi Core console over SSH. On Linux use the
    ssh command-line tool (Windows users can install PuTTY [4]). The username for
    the login is *pi*, the password is the same as for logging in from a browser.


