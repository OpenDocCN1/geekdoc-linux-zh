  mdcn: '

    ## 深度分析


    ## LibreOffice 与 OpenOffice 的对比


    在 LibreOffice Writer 中，部分改进包括：


    - 支持形状超链接。

    - 开始支持链接列表、字符和段落样式。

    - 修订跟踪更好地监控了移动文本。

    - 复杂文档的 PDF 转换速度更快。


    在 LibreOffice Calc 中，亮点包括：


    - 打开多种格式的速度得到提升。

    - 图表和计算的速度得到提升。


    Draw 和 Impress 均实现了以下改进：


    - 改进了对 PowerPoint 兼容屏幕尺寸的支持。

    - 为 3D 对象增加了新的表面。


    最后，还进行了以下通用改进：


    - 增加了条形码和二维码对话框。

    - 在整个软件中实现了标准化线宽。

    - 针对更高性能优化了官方二进制文件。

    - 增强并更新了帮助文件。

    - 对 MS Office 过滤器进行了多项改进。

    - 新增了四种语言，包括以色列英语和克林贡语。

    - 新增了脚本库。


    还需要多说些什么吗？即使考虑到不同点发布的差异，整体局势显然是一个步履维艰的项目与一个蓬勃发展项目的对比。认为 OpenOffice 能与 LibreOffice
    竞争的观念根本无法站住脚。


    ## 明确的选择


    OpenOffice 仍是一套合格的办公套件。OpenOffice.org 为它奠定了坚实的基础，正如 LibreOffice 所做的那样。特别是，OpenOffice
    在样式选择上的优势使其在许多替代品中显得尤为突出。如果你只编写简短或一次性的文档，OpenOffice 可能完全能满足你的需求。然而，不可否认的事实是，由于十多年没有重大变革，OpenOffice
    正在显露出老化的迹象。该项目仅仅勉强跟上 bug 修复的脚步，并未像 LibreOffice 那样跟上现代需求的发展。我唯一听到的支持 OpenOffice
    的理由是，它像 Debian 的稳定版软件源一样，使用了较旧但经过更多补丁的代码，但考虑到 OpenOffice 的编码资源，甚至这个理由也站不住脚。事实上，LibreOffice
    可能更擅长修复 bug。OpenOffice 唯一的优势就是知名度，这只会诱使用户下载一个远不如 LibreOffice 发达的替代品。


    面对当前局势的理性反应应该是让 OpenOffice 要么停止苟延残喘，要么与 LibreOffice 合并。事实上，LibreOffice 在 2020
    年提出过合作提案 [7]，但固执以及可能存在的旧怨导致该提案被愤怒地拒绝。自由软件意味着 OpenOffice 的支持者可以自由开发他们选择的任何东西，但这并不意味着我们其他人有义务支持他们。当需要在
    LibreOffice 和 OpenOffice 之间做出选择时，唯一理性的选择是 LibreOffice。


    ## 参考信息


    - [1] OpenOffice 贡献者 2014-2015：https://en.wikipedia.org/wiki/OpenOffice

    - [2] OpenOffice 贡献者数量图表：www.openoffice.org/stats/committers.html

    - [3] LibreOffice 贡献者：https://www.libreoffice.org/about-us/credits/

    - [4] 2019 年代码提交：https://fosshbytes.com/libreoffice-sends-open-letter-appealing-to-apache-openoffice/

    - [5] OpenOffice 4.1.11：https://wiki.openoffice.org/ooo4111release-notes

    - [6] LibreOffice 7.3 发行说明：https://wiki.documentfoundation.org/ReleaseNotes/7.3

    - [7] 合作提案：https://blog.documentfoundation.org/blog/2020-10-12/open-letter-to-apache-openoffice/


    ### 针对真实网络的真实解决方案


    ![](img/8286bf901ba268fe114d66ada92d1dd6_60_0.png)


    ADMIN 是您获取现实世界问题技术解决方案的来源。


