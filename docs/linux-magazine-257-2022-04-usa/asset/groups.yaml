    # Setup


    Once the HiFiBerryOS web page (Figure 5) welcomes you, click **Next Step** and
    then **Finish Setup** until you see the interface (Figure 6).


    Unless you want to connect a network cable permanently, go to the **Network**
    menu item, select a WiFi network under the **Wireless** tab, and enter the access
    password. As soon as HiFiBerryOS establishes the connection, shut down the system
    in **General | Power | Shut Down**, wait 20 seconds, and then disconnect it from
    the power supply. You will not need the network cable from now on.


    After a reboot, navigate to the very bottom of the interface. The system should
    show the board it detected; the Amp2 will be listed as something like *DAC+ /
    Amp2*. However, a combination of the **Amp60** and **DAC+ ADC** might not be detected
    correctly; as a result, the audio input does not appear as an *Analog Input* under
    Sources.


