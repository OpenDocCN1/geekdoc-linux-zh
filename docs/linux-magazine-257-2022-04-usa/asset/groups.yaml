    ## 终端新闻

    ### Broadsheet


    无论你对当前时事持何种态度，新闻生成的数量都已变得令人不堪重负。我们都已变成了“末日刷屏者”，像不受控制的信息瘾君子一样，不停地在一条新闻和下一条之间来回切换。这个问题并没有太多好的解决方案。像本杂志这样经过精心筛选的内容会有所帮助，尤其是如果这意味着你可以暂时离开屏幕的话。订阅
    RSS 源是另一个可能的解决方案，因为它可以让你有目的地关注特定来源的更新，并通过你自己的客户端过滤这些更新。但 RSS 已经衰落多年，许多通用新闻来源都对其支持缺乏兴趣——他们希望你访问他们的网站、创建账户，甚至直接订阅。


    Broadsheet 是一个处于早期开发阶段的新选项，它可能弥合了通过常规渠道获取过多新闻与对低干扰方法缺乏支持之间的差距。这是一个命令行工具，它会输出非常类似
    RSS 的新闻摘要，并附带在浏览器中阅读全文的链接。可以使用命令行参数将故事限制在特定的域、国家或搜索结果中，而且它运行得非常好。由于你是在命令行上操作，点击链接比在浏览器中更困难，诱惑性也更小。唯一的缺点是：Broadsheet
    需要订阅新闻聚合服务 http://newsapi.org，该服务提供一个用于配置文件中的 API 密钥。目前使用免费开发者层级是合理的，但 Broadsheet
    变得稳定后，这种情况将会改变。希望到那时开发者会添加拟议中的 RSS 支持，从而兼得两者之长。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_81_0.png)


    *尽管 Broadsheet 目前仅适用于基于订阅的新闻 API，但开发者希望将来添加 RSS 支持。*


    **项目主页**: <https://github.com/i-am-the-gabe/Broadsheet>


    ### 番茄钟小组件

    ### Fokus


    如果 Broadsheet 引发了你对移除工作环境中干扰因素的思考，另一个久经考验的方法就是番茄工作法。这是一种由 Francesco Cirillo 在
    20 世纪 80 年代开发的时间管理技巧，通常伴随一个番茄形状的计时器（pomodoro 在意大利语中意为番茄）。该过程仅仅要求你在一段设定的时间内（通常为
    25 分钟）专注于一项任务，而不让自己被其他事物分心。以现代标准来看，80 年代的干扰因素（比如魔方、牛顿摆或一杯新鲜咖啡）都显得很无害。如今，干扰因素比你打开的标签页还要多，而像番茄工作法这样的方法可以极大提高你的生产力。主要问题是如何将其整合到你的工作环境中，而无需花费一周时间重新搜索各种选项。为了不再拖延寻找解决方案，我们已经为你找到了一个。


    最初的番茄钟旨在让你远离技术的诱惑。由于你很可能需要在计算机上工作，将其移至桌面是一个可接受的解决方案。Linux 上有许多选项，但我们遇到的最佳选择之一是
    Fokus，正如你可能从名字中猜到的那样，它是一个 KDE Plasma 应用程序小组件。它既包含一个带有计时器的小面板，也有一个适合即使是很小面板的面板小组件，两者都会显示你每个区间剩余的时间。巧妙的是，它还可以配置为在时间段开始或结束时运行脚本，编写一个将时间段的工作量添加到个人日志或字数日志中的程序非常容易。Fokus
    设计精美，比我们见过的 macOS 和 Windows 的同类应用更好，后者许多都是商业驱动的或受广告驱动的。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_81_1.png)


    > *通过完全专注于 25 分钟的分心时间，提升你的工作效率和自我认同感。真的有效！*


    **项目主页**: <https://gitlab.com/dioviae/fokus-plasmoid>


    ## PCB 插画工具

    ### Pinion


    在家庭 3D 打印、虚拟现实和树莓派等最近的技术革命中，让我们每个人都能创建电路并将其打印出来的能力也是其中之一。甚至还有用于此目的的软件可供选择，我们在本杂志中已经介绍过几种。其中最成熟的可能是
    KiCAD，一个久负盛名的原理图编辑器，它允许你创建电路、验证其设计、模拟其执行过程，并测试规范其功能的电气规则。KiCAD 随后会自动生成 PCB 布局，并以可发送给
    PCB 制造商的格式导出结果。它简单到即使是初学者也能使用它来制作他们的第一个电路，但它也足够先进，许多工程师都用它进行产品设计。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_82_0.png)


    Pinion 是一个工具，它可以将 KiCAD 文件转换为美丽的插画，你可以分享或发布在网站上。它们不仅外观令人惊叹，具有细胞着色和伪写实风格，而且是交互式的。可以为电路或电路板的部分添加文本，也可以通过选择来高亮显示走线。虚拟卡片还可以翻转过来，这一切都要归功于
    JavaScript 的魔力。通过一个简单的 YAML 文件添加此功能，该文件将 KiCAD 组件与你的描述、分组和引脚注释关联起来。你添加的文本长度不限，甚至还可以包含链接和基本格式化。它使用一个名为
    PpcbDraw-Lib 的手绘库来展示组件，虽然该库目前相对较小，但正在不断增长，且易于贡献。然后，通过执行 pinion 命令及其指向 YAML 和 KiCAD
    文件的参数来构建图表。效果极佳！


    *Pinion 是一个简单的 Python 工具，可以为你省去绘制自己真实电路图的麻烦。*


    **项目主页**: <https://yaqwxs.github.io/Pinion>


    ## 二进制编辑器

    ### GNU poke


    我们常在这些页面上看到十六进制编辑器，对于查看二进制文件它们很有用，但我们很少像 GNU poke 这样真正的二进制编辑器。其名称源于起源于 DECsystem-10
    但后来在 Commodore 64 上臭名昭著的两条古老命令。PEEK 命令用于查看内存位置的内容，而 POKE 命令用于更改其值。这两个命令都很原始，但它们也允许任何人篡改系统内存中正在运行的任何东西。它们是简单的系统利用方式，如果你对流汇编器和硬件有很好的理解，你可以利用大量的
    PEEK 和 POKE 命令、没有互联网以及一个漫长的暑假来阅读硬件参考手册来实现几乎任何事情。


    GNU poke 是一个二进制编辑器，它会吸引那些老派（现在中年）的黑客，但也会吸引任何对查看二进制文件感兴趣的人。它自称为“简朴”，在这个上下文中，这意味着运行时没有太多可见的东西。使用文件作为参数启动它不会打开你认得的编辑器，而是会给你一个提示符和一些基本的帮助。输入
    .dump 会生成看起来像十六进制编辑器的输出，让你可以看到选定文件的前 128 个字节。但是，使用 poke 的关键在于理解你要查看的数据结构，因为这允许你使用运算符甚至变量来以程序化方式编辑和修改你的数据。数据可以复制到额外的缓冲区，对于保存的更改和发现，它有不错的文件输入和输出。尽管拥有优秀的内部文档，它仍然深奥、复杂且难以学习，但这比
    1986 年手动使用 PEEK 和 POKE 命令以及花整个暑假阅读硬件参考手册要容易。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_82_1.png)


    *大端和小端、字符、字符串甚至位图都可以使用 GNU poke 进行检查和修改。*


    **项目主页**: <https://www.jemarch.net/poke>


