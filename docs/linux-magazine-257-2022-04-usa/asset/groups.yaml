    ## Airtight!\n\nA concept called provable security brings the rigor of mathematics\
    \ to the art of cryptography.\n\nBy Dominique Schröder\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_27_0.png)\n\
    \nCryptography was originally a mystical art form with the goal of concealing\
    \ information from unauthorized persons. For example, a simple method for encrypting\
    \ messages was developed by Gaius Julius Caesar around the year 100 BC. The basic\
    \ idea of the method was to shift each letter of a message by a fixed amount in\
    \ the alphabet. This position then served as a secret key. For example, if Caesar\
    \ wanted to encrypt Veni, vidi, vici with a secret key of 3, it would result in\
    \ a ciphertext of Yhgl, yhgl, yhfl.\n\nHowever, the method was soon seen through,\
    \ then improved, cracked again, and so on. In this way, over time, a kind of cat-and-mouse\
    \ game developed between the designers of encryption methods and the attackers\
    \ who cracked the methods in order to access the secret information. This dragged\
    \ on until the discovery of provable security in the 1980s.\n\nProvable security\
    \ is a field that seeks to assess the security of systems through mathematical\
    \ proofs. People often think of cryptography as a sea of digits and huge numbers,\
    \ which it often is; however, for a mathematician, the goal is to sweep away the\
    \ details and define the system symbolically in a way that lends itself to logical\
    \ proof. The development of provable security has brought rigor to the ancient\
    \ practice of cryptography, which was once considered more art than science.\n\
    \nThis article will introduce you to the concept of provable security and will\
    \ put the principles to work with an example analysis of email communication.\
    \ I’ll also describe some typical errors in the use of cryptographic methods,\
    \ as well as the strengths and limitations of provable security. And, last but\
    \ not least, I’ll use practical examples to illustrate current research topics\
    \ in the field of modern cryptography.\n\n### Provable Security: The 6 Steps\n\
    \nAccording to the principles of security-by-design, the provable security process\
    \ has six steps, as shown in Figure 1.\n\n#### Step 1: Describe the Functionality\n\
    \nThe first step is to describe the functionality of the system – What is the\
    \ intended purpose? This description often takes the form of a requirements specification.\n\
    \n#### Step 2: Define the Security Properties\n\nThe task of defining the security\
    \ characteristics usually has two parts. First, you need to describe the security\
    \ objectives in a way that everyone can understand. After that, you need to formalize\
    \ the whole thing precisely in order to avoid ambiguous interpretations.\n\nNote\
    \ that the formal security case applies only to the formal description. That is\
    \ why this formalization must break down the real protection goals as precisely\
    \ as possible. As a rule, this step covers the following aspects: What security\
    \ property does the system need to provide? What system(s) with what setup are\
    \ we talking about? What class of attackers do we need to fend off? What are their\
    \ capabilities? When is an attack deemed successful?\n\nIdentifying and formalizing\
    \ the security properties is a challenging task, and a suitable security model\
    \ has not yet been found for many cryptographic schemes. For example, the research\
    \ community has still not agreed on a definition for authenticated encryption\
    \ [1]. In addition, there is always a natural state of competition between efficiency\
    \ and security.\n"
