    \ 10 正是这样做的，它导入了 Sankey 函数（第 2 行），然后指示 Matplotlib 使用第 4 行中的单个长命令创建并**完成**一个 Sankey\
    \ 对象。当然，要做到这一点，每个流动必须由三个参数描述，即流动的强度、方向（即它是进入还是离开系统）以及一个可选的标签。列表 10 的第 4 行和第 6\
    \ 行将这些数据传递给 Sankey 对象。例如，图 8 中指向下方的箭头（值为 0.1，标签为“Fifth”）是直接在传递给 Sankey 对象的 flows、labels\
    \ 和 orientation 数组（第 4-6 行）的最后一个元素中写入 **-0.18**、**'Fifth'** 和 **-1** 的结果。\n\n\
    ## 极坐标图\n\n你可能熟悉（甚至可能讨厌）本教程中来自绩效评估的最终 Matplotlib 示例：一个类似于雷达屏幕的极坐标图。图 9 展示了一个极坐标图，显示了一个或多个受试者在一系列活动（也称为评估）中获得的分数。\n\
    \n与本教程中的其他一些示例一样，列表 11 中绘图部分（第 11 到 19 行）比提供数据的部分更容易解释。第 14 行将此图定义为**极坐标**，而不是像其他图那样使用笛卡尔坐标系。第\
    \ 11 行声明必须沿整个圆周（长度为 2pi，即 pi 的两倍）以等间隔放置五个标签（**supherho_1 数组**的长度），第 19 行说明要放在那些位置的标签位于\
    \ **categories** 数组中。第 15-17 行添加了三个不同的线。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_92_1.png)\n\
    \n## 列表 10：桑基图\n\n```python\n01 import matplotlib.pyplot as plt\n02 \n03 from\
    \ matplotlib.sankey import Sankey\n04 Sankey(flows=[0.25, 0.15, 0.60, -0.20, -0.15,\
    \ -0.05, -0.50, -0.10],\n       labels=['', '', '', 'First', 'Second', 'Third',\
    \ 'Fourth', 'Fifth'],\n       orientations=[-1, 1, 0, 1, 1, 1, 0, -1]).finish()\n\
    05 plt.title(\"Did you know how easy it is to create diagrams like this?\")\n\
    06 plt.savefig('sankey.png')\n```\n\n图周围，每个都有自己独特的标签，以及对应超级英雄数组（在第 7-9 行中定义）所取数值。结果是，图\
    \ 9 显示超人 Strength=5 但 Teamwork=2，神奇女侠 Leadership=5，等等。\n\n列表 11 中最有趣但更难察觉的部分位于第\
    \ 5 行和第 11 行：如果你只需显示四个参数（Strength、Speed、Leadership 和 Teamwork），为什么需要五个位置来放置它们的标签，以及相应的第五个空类别（'\
    \ '）？答案（通过修改这些参数可以轻松验证）是，它们是为了“回到原点”所必需的。如果没有那个额外的空类别，每个超级英雄的线将不会回到其初始点以闭合自身，导致结果图表更难看。\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_93_0.png)\n\n图 9：使用 Matplotlib 中的极坐标图进行的超级英雄绩效比较。\n\
    \n## 结论\n\n如果你阅读到这里，现在你已经掌握了足够的 Matplotlib 知识，可以开始创建许多截然不同的图表，并且最重要的是，能够在 Matplotlib\
    \ 庞大的文档中找到方向，而不必花费太多时间。祝你绘图愉快！\n\n## 信息\n\n- Matplotlib: https://matplotlib.org\n\
    - Gnuplot: www.gnuplot.info\n- MATLAB: www.mathworks.com/products/matlab.html\n\
    - NumPy: www.numpy.org\n- Pandas: https://pandas.pydata.org\n- Python 散点图语法: https://matplotlib.org/3.1.1/api/_as\
    \ gen/matplotlib.pyplot.scatter.html\n- 桑基图: www.ifu.com/e-sankey/sankey-diagram/\n\
    - Sankey Matplotlib 示例: https://Matplotlib.org/stable/gallery/specialty_plots/sankey_basics.html\n\
    \n## 作者\n\nMarco Fioretti (http://mfioretti.com) 是一位自由作家、培训师和研究员，常驻意大利罗马。自 1995\
    \ 年以来一直使用自由/开源软件，自 2005 年以来致力于开放数字标准。Marco 还在 https://stop.zone-m.net 撰写有关数字权利的博客。\n\
    \n## 列表 11：DC 超级英雄极坐标比较\n\n```python\n01 import NumPy as np\n02 import Matplotlib.pyplot\
    \ as plt\n03 \n04 categories = ['Strength', 'Speed', 'Leadership', 'Teamwork',\
    \ ' ']\n05 \n06 \n07 superhero_1 = [5, 5, 3, 2, 5]\n08 superhero_2 = [2, 1, 1,\
    \ 1, 2]\n09 superhero_3 = [4, 3, 5, 5, 4]\n10 \n11 label_loc = np.linspace(start=0,\
    \ stop=2 * np.pi, num=len(superhero_1))\n12 \n13 plt.figure(figsize=(8, 8))\n\
    14 plt.subplot(polar=True)\n15 \n16 plt.plot(label_loc, superhero_1, label='Superman')\n\
    17 plt.plot(label_loc, superhero_2, label='Batman')\n18 plt.plot(label_loc, superhero_3,\
    \ label='Wonder Woman')\n19 plt.title('DC Super Heroes comparison', size=20)\n\
    20 lines, labels = plt.thetagrids(np.degrees(label_loc), labels=categories)\n\
    21 \n22 plt.legend()\n23 plt.savefig('./figures/radar.png')\n```\n\n## LINUX NEWSSTAND\n\
    \nLinux Magazine 是你进入 Linux 世界的指南。每月发布的刊物都包含你在其他地方找不到的高级技术文章和教程。探索我们完整的旧刊目录，以了解特定主题或完善你的收藏。\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_94_0.png)\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_94_1.png)\n\
    \n### #256/2022年3月\n\n#### 面部识别\n\n随着微软 Hello 技术的到来，生物识别技术最近得到了提升。现在开源界正在迎头赶上，有一个名为\
    \ Howdy 的创新工具。面部认证可能尚未准备好供 CIA 使用，但我们将帮助你开始使用 Howdy 并探索用一瞥进行认证的可能性。\n\n**光盘内容：**\
    \ antiX 21 和 Haiku R1/ Beta 3\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_94_2.png)\n\
    \n### #255/2022年2月\n\n#### 破坏它以便更好地制造它\n\n模糊测试：你是否曾想过攻击者如何发现那些导致程序崩溃并交出控制的“精心构造的输入字符串”？欢迎来到模糊测试的世界。我们向你介绍模糊测试的艺术，并探讨一些领先的模糊测试技术。\n\
    \n**光盘内容：** Parrot OS 4.11 和 Fedora Workstation 35\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_94_3.png)\n\
    \n### #254/2022年1月\n\n#### 手机破解\n\n最终，手机制造商会放弃对旧硬件的支持。如果你尚未准备好自己放弃该硬件，你可能会在 LineageOS\
    \ 中找到更好的替代方案——这是一个免费的基于 Android 的系统，支持超过 300 款手机，包括许多不再受厂商支持的遗留型号。我们还探索了 PostmarketOS，这是一个基于社区的\
    \ Linux 发行版，可在多个 Android 设备上运行。\n\n**光盘内容：** Ubuntu 21.10 和 EndeavourOS 2021.08.27\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_94_4.png)\n\n### #253/2021年12月\n\n\
    #### OpenBSD\n\nBSD Unix 的历史比 Linux 更悠久，并且在自由软件社区中仍然拥有忠实的追随者。本月我们从 Linux 用户的角度探讨领先\
    \ BSD 变体带来的好处。\n\n**光盘内容：** Tails 4.22 和 Q4OS 4.6\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_94_5.png)\n\
    \n### #252/2021年11月\n\n#### 锁定！\n\n安全形势不断变化，经验丰富的用户知道他们需要时刻留意提供优势的工具和技术。本月我们研究智能卡、硬盘加密以及\
    \ Sudo 的一个更少膨胀的替代方案。\n\n**光盘内容：** Debian 11 和 ReCore Linux 2101\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_94_6.png)\n\
    \n### #251/2021年10月\n\n#### 从零开始构建 Linux\n\n构建操作系统与编译桌面应用程序不同。你需要创建一个完整的开发环境——如果你仔细遵循步骤，你将获得对\
    \ Linux 更深入的理解。\n\n**光盘内容：** Linux Mint 20.2 Cinnamon Edition 和 Garuda Linux KDE\
    \ Dr460nized Edition\n\n"
