    图 3：位于扬声器连接端子左侧的 Amp 2 上的两个插孔是另一种电源连接方式；由于电源和扬声器的螺丝设计相似，操作时请务必小心。


    图 4：将左侧扬声器的线缆插入 Amp60 左侧的两个接线端子；右侧扬声器的线缆则插入其右侧相邻的接线端子。


    以及 4 型（带夹具就位状态）。3B 型号（无加号标志）具备该功能，但 HiFiBerry 开发人员表示，它无法提供稳定的蓝牙连接，这就是为什么 HiFiBerryOS
    会忽略该适配器的原因。购买新适配器时，请确保其兼容树莓派和 Linux 系统。


    主板的重力会给 GPIO 引脚带来一定压力，因此您在拆包后应首先安装附带的塑料垫片（参见“外壳”框）。连接扬声器线缆时，请注意正确的插孔；不同 HiFiBerry
    型号之间的插孔分配各不相同（图 3 和图 4）。


    运行无需其他外围设备。但是，显示器、键盘和鼠标将有助于初始设置，而在浏览器中也可以以同样流畅的方式进行设置。如果您通过有线方式将树莓派连接到网络，设置过程将大部分自动化；否则，您可以通过
    WiFi 进行配置，这需要一部智能手机或其他能够连接 WiFi 网络并拥有浏览器的设备。


    您将其写入一张至少 4GB 的空白 microSD 卡。HiFiBerryOS 开发人员也推荐的 Etcher [9] 程序，是实现此任务的一个直观工具。完成后，将卡插入树莓派并开机。


    首次启动大约需要三分钟，单板机会重启一次。如果它连接到局域网，系统将自动从 DHCP 服务器（例如路由器）获取 IP 地址。如果没有网络电缆，HiFiBerryOS
    会建立自己的 WiFi 网络，您应将智能手机连接至此网络；其名称将以 HiFiBerry_Setup_ 开头。


    ## 外壳


    由于高度和连接器的位置，这些放大器无法装入标准的树莓派外壳。不过，至少对于 Amp2，Modul 9 提供了紧凑型钢制外壳 [7]，以及其他型号，但并非所有型号都适合每种树莓派变体。


    ## 软件


    ![](img/8286bf901ba268fe114d66ada92d1dd6_63_2.png)


    图 5：如果您看到此页面，说明 HiFiBerryOS 的初始设置已正确完成。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_64_0.png)


    **图 6：** 控制中心允许您控制播放。在“来源”下，您可以更改音频源。界面会根据屏幕大小自动调整。


    如果您已连接屏幕、键盘和鼠标，将直接跳转到用户界面。否则，请在浏览器中调用 `http://HiFiBerry.local`。如果连接失败，请确定单板机的当前
    IP 地址。如有疑问，路由器的用户界面应能提供详细信息。您会在那里看到树莓派被列示为 *hifiberry*。将您以此方式确定的 IP 地址输入浏览器。为了日后通过此
    IP 地址访问界面，您可能希望配置路由器始终将相同的 IP 地址分配给树莓派。


    如果在五分钟后仍无法访问用户界面，请将计算机从电源断开，然后重新连接。连接的屏幕可能会为您提供问题线索。如果重启尝试失败，请确保 HiFiBerryOS 镜像已无错误地写入介质；卡片可能存在故障。


    ## 设置


    一旦 HiFiBerryOS 网页（图 5）欢迎您，请单击 **Next Step**，然后单击 **Finish Setup**，直到您看到界面（图 6）。


    除非您打算永久连接网线，否则请转到 **Network** 菜单项，在 **Wireless** 选项卡下选择一个 WiFi 网络，并输入访问密码。一旦 HiFiBerryOS
    建立连接，请在 **General | Power | Shut Down** 中关闭系统，等待 20 秒，然后断开电源。从此您不再需要网络电缆。


    重新启动后，导航到界面的最底部。系统应显示其检测到的主板；Amp2 将显示为类似 *DAC+ / Amp2* 的名称。然而，**Amp60** 和 **DAC+
    ADC** 的组合可能无法被正确检测；因此，音频输入不会作为“来源”下的 *Analog Input* 出现。


    在这种情况下，请像之前一样再次关闭 HiFiBerryOS。在您的 PC 上打开 SD 卡上最小的分区。在 Windows 中，您可以直接访问所需文件。在文本编辑器中，在
    `config.txt` 文件的末尾添加以下行：


    ```

    dtparam=i2s_hifiberry-dacplusadc

    ```


    从 SD 卡重启树莓派，并在 Web 界面中确保 HiFiBerry 已正确识别系统。


    ## 蓝牙


    系统运行后，切换到 **Sources**（即音频源）。**AirPlay** 默认启用，支持此功能以及其他媒体播放器的智能手机应能将计算机识别为存储设备并能够通过其播放音乐。


    要访问蓝牙，请选择 **Bluetooth**，然后单击黑色的 **Bluetooth Pairing** 按钮。之后，附近所有启用蓝牙的设备都会将 *HiFiBerry*
    识别为扬声器。将其与您的智能手机、平板电脑和其他设备进行配对——每个设备的过程可能不同（图 7）——然后在 HiFiBerryOS 上停止配对。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_64_1.png)


    **图 7：** 要在 Android 11 上向 HiFiBerryOS 介绍，请在设置中选择 **Connected devices** 和 **Pair
    new device**。


    现在，您可以使用这些设备控制音量。为了避免打扰邻居，您可能希望在播放时将音量调低。HiFiBerryOS 在底部边缘显示标题，右侧则找到音量控制。


    要播放来自 CD 播放器的音乐，请切换到 Sources | Analog Input。此项可能隐藏在 Disabled Sources 下（图 8）。开启输入，这会同时关闭其他来源。如果稍后希望蓝牙播放器提供声音，请禁用音频输入，并启用
    Sources | Bluetooth 下的相应项。


    ## 棘手问题


    您的树莓派现在作为小型音频放大器运行。然而在实际操作中，您可能会不断遇到不足之处。例如，Amp2 在测试中的首次安装中存在严重的音量控制问题。一旦音量超过或低于某些阈值，播放中就会出现可闻的中断。在当前版本系统的新安装中，一切运行完美无缺。Amp60
    未表现出这些任何问题。


    ![](img/8286bf901ba268fe114d66ada92d1dd6_65_0.png)


    在实际操作中，新的蓝牙设备可能会不时进入您的家庭（例如，如果有访客）。要授予它们访问放大器的权限，您需要每次都启用配对功能。永久开启配对不是一个好主意 -
    您真的希望邻居在您的扬声器上播放他们最爱的歌剧吗？


    用户界面还缺少密码保护和其他安全措施。因此，网络上的用户可以不受限制地重新配置树莓派或播放音乐。


    要切换到 CD 播放器，您必须从用户界面启用相应的音频输入。截至本文撰写时，HiFiBerryOS 不会在存在信号时自动切换。与独立放大器不同，聆听乐趣需要预先点击几下，根据我的经验，这对许多用户来说太多了。


    ## 关机


    使用后关闭 HiFiBerryOS 的预期方式是选择 General | Power | Shut Down。然而，在实践中，人们往往只是拔掉电源线或关闭此类设备的插线板
    - 尤其是那些觉得用户界面过于复杂的用户。在测试中，切断电源并未造成任何永久性损坏，树莓派能够无问题地反复启动。


    HiFiBerryOS 的开发人员也在博客文章中指出，该系统向 SD 卡写入的数据量很少，且损坏非常罕见 [10]。以防万一，请在您的 DIY 便携音响旁保留一张备用的、包含系统副本的
    SD 卡。


    Modul 9 现在也提供了一款电源控制器，仍处于测试或 beta 阶段 [11]，它允许您通过按一下按钮以受控方式关闭树莓派。


    ## 结论


    HiFiBerry 放大器可以快速将树莓派变成一台超大号的便携音响，让您以低成本延长旧有 hi-fi 组件的使用寿命。HiFiBerryOS 也消除了手动设置蓝牙和其他复杂服务的需求。


    该系统还提供对众多服务的访问，包括 Spotify 和各种互联网广播电台。然而，小毛病使得控制多个输入来源变得困难。


    ### 信息


    - [1] Bruce Byfield 撰写的 "Configuring Bluetooth on Linux"，https://www.linux-magazine.com/Online/Features/Configuring-Bluetooth-on-Linux/

    - [2] MiniAmp: https://www.hifiberry.com/shop/boards/miniamp/

    - [3] Amp2: https://www.hifiberry.com/shop/boards/hifiberry-amp2/

    - [4] Beocreate 4 通道放大器: https://www.hifiberry.com/shop/boards/beocreate-4-channel-amplifier/

    - [5] DAC+ ADC: https://www.hifiberry.com/shop/boards/hifiberry-dac-adc/

    - [6] Amp60: https://www.hifiberry.com/shop/boards/hifiberry-amp60/

    - [7] Amp2 外壳: https://www.hifiberry.com/shop/cases/steel-case-for-hifiberry-dac-pi-4-2-2/

    - [8] HiFiBerryOS: https://www.hifiberry.com/hifiberryos/

    - [9] Etcher: https://www.balena.io/etcher/

    - [10] "Powering up/down your Pi with a button": https://www.hifiberry.com/blog/powering-up-down-your-pi-with-a-button/

    - [11] HiFiBerry 电源控制器: https://www.hifiberry.com/shop/boards/power-controller/


