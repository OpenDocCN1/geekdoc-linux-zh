  mdcn: "\n\n一个Type-A端口、一个Mini DisplayPort 1.4端口和一个带HDCP的HDMI端口，以及一个耳机/麦克风组合插孔和一个专用麦克风插孔。\n\
    \n其他功能包括多点触控点击板、多色背光美式QWERTY键盘、2.5Gb以太网、WiFi 6、蓝牙5、100万像素720p高清摄像头、48.96 Wh锂电池，以及2个M.2\
    \ SSD（仅限PCIe NVMe），总存储容量最高可达4TB。\n\nKudu现已面向大众发售，基础价格为1,799美元。\n\n## Ubuntu Budgie\
    \ 瞄准游戏玩家\n\nUbuntu Budgie 已经是一个设计精美的 Linux 桌面发行版，其令人愉悦的界面让与 Linux 的交互变得极其简单。随着\
    \ 22.04 版本的即将到来，开发者正在为这个平台增添一层新的亮点。\n\n首要的是，新发布版本将包含能够极大改善游戏体验的工具。游戏玩家将会找到诸如 MangoHud（一种用于监控\
    \ FPS、温度、CPU/GPU 负载等的 Vulkan 和 OpenGL 叠加层）、CoreCtrl（允许你通过配置文件控制计算机硬件）、Polychromatic\
    \ 和 OpenRGB（RGB 灯光管理）等工具。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_8_0.png)\n\
    \n接下来是轻松安装 Steam、Lutris、RetroArch、Discord 和 OBS Studio 等应用程序。开发者也在考虑添加 GreenWithEnvy，这是一款\
    \ GTK 系统实用工具，旨在提供信息、控制风扇并超频 NVIDIA 显卡和 GPU。\n\n最后，Budgie 欢迎应用程序将根据检测到的适用硬件，建议安装特定的游戏库。\n\
    \n目前所有游戏功能均处于 alpha 阶段，但希望在今年 4 月 Ubuntu Budgie 22.04 最终版发布时，这些功能能够准备好供大众使用。\n\
    \n对于希望测试早期版本的用户，你可以先下载每日构建的 ISO 镜像 (https://cidimage.ubuntu.com/ubuntu-budgie/daily-live/current/)。\n\
    \n## Linux Mint Edge 已准备好支持最新硬件\n\nLinux Mint 20.3 现已广泛可用，并搭载 5.4 内核。对于使用最新一代硬件的用户来说，这个较旧的内核可能会存在问题。因此，对于拥有\
    \ 5.4 内核不支持的硬件的 Mint 用户来说，现在有了一个新的选择。\n\nLinux Mint 20.3 Edge 是该发行版的一个版本，搭载 5.13.0-25\
    \ 内核，这意味着你会发现更多新硬件获得支持。通过采用这个新内核，Edge 添加了对 Apple M1（初始支持）、初步支持 Intel Alder Lake\
    \ S 显卡、AMD GPU Freesync/Adaptive-Sync HDMI、AMD Aideran 加速器、通用 USB 显示器、Loongson\
    \ 2K1000、为 Intel 独立显卡做的准备，以及 Intel DG1 平台监控技术的支持。\n\n就面向用户的 Linux Mint Edge 功能而言，它们与默认版本中发现的功能相同。你会发现\
    \ Hypnotix IPTV 播放器的改进（包括新的频道搜索功能）、一个新的文档管理工具（Thingy）、Sticky Notes 新增的搜索功能、默认主题的改进，以及大量\
    \ Cinnamon 更新。\n\n然而，需要注意的是，Edge 并不能保证每一块新一代硬件都能正常工作。但如果你使用的是较新的技术，与标准的 Mint 发行版相比，使用\
    \ Edge 会有更好的兼容性。\n\n在 https://www.linuxmint.com/edition.php?id=296 下载 Linux Mint\
    \ Edge 的 ISO 镜像，并在 https://www.linuxmint.com/rel_una_cinnamon.php 阅读 Linux Mint\
    \ 20.3 的官方发布说明。\n\n## 更多在线内容\n\n**Linux 杂志**\nwww.linux-magazine.com\n\n- **ADMIN\
    \ HPC**\n  http://www.admin-magazine.com/HPC/\n  - **以用户身份挂载压缩归档文件**\n    • Jeff\
    \ Layton\n    为什么要把压缩归档文件解压到你的存储中，而可以直接像存储设备一样挂载它？\n\n**ADMIN 在线**\nhttp://www.admin-magazine.com/\n\
    \n- **以正确的方式保护 SSH 连接**\n  • Simon Böhm\n  管理员使用 SSH 这一系统管理的“瑞士军刀”来执行许多日常任务，但无论工具多么强大，它通常都无法提供足够的保护。我们探讨了收紧\
    \ SSH 安全性的方法。\n\n- **入门 Prometheus**\n  • Stefano Chittaro\n  Prometheus 是一个集中式时间序列数据库，内置了指标、抓取和告警逻辑。我们帮助你开始使用\
    \ Prometheus 进行监控。\n\n- **使用 Metasploit 渗透测试工具挖掘漏洞**\n  • Markus Feinler\n  资深的\
    \ Metasploit 绝非过时，它仍然被用作在 Windows 10 和 Linux 系统中查找和分析安全漏洞的典型工作流。\n\n## Linux 内核\
    \ 5.17 代码合并窗口已关闭\n\n现在假期已远，Linus Torvalds 的探亲旅行结束了，他可以回去做他最擅长的事……维护 Linux 内核。不出所料，有大量\
    \ bug 修复、代码清理和新功能。虽然没有任何绝对的颠覆性改变，但有一些有趣的修复和添加。\n\nARM64 将新增 Kernel Concurrency\
    \ Sanitizer (KCSAN)，这是一种竞态条件检测器。还引入了关于可扩展矩阵扩展（Scalable Matrix Extensions）的初始工作，这将提供对\
    \ ARM64 架构上矩阵运算更好、更快的支持。ARM 还获得了对 Snapdragon 8 (Gen 1) 和 X65 平台的支持。\n\nAMD 为其\
    \ AMD Zen 19h 系列 CPU 带来了基于 k10temp 的 CPU 温度监控。AMD 还引入了 AMD P-State 驱动程序，这将使 Steam\
    \ Deck 等硬件具有更好的能效。\n\n笔记本电脑和平板电脑将迎来大量改进，例如 ASUS ROG 笔记本电脑的自定义风扇曲线支持、通用触控笔计划（Universal\
    \ Stylus Initiative）和 Nvidia Tegra 平板电脑的支持，以及 AMD 笔记本电脑上睡眠和声音问题的多项性能改进和 bug 修复。\n\
    \n其他改进和修复包括：对 Raptor Lake S 显卡的初始支持；Intel Alder Lake P 显卡现在在主支线内核中已稳定；Intel Gen\
    \ 1240 显卡获得可变刷新率/Adaptive-Sync 支持；EXT4 现在使用新的 Linux 挂载 API；F2FS、Btrfs 和 XFS 的性能提升；FS-Cache\
    \ 和 CacheFiles 模块已重写；以及修复了一个软盘挂起 bug。\n\n你现在可以下载 Linux 内核 5.17-rc2 用于测试 (https://www.kernel.org/)。\n\
    \n![](img/8286bf901ba268fe114d66ada92d1dd6_9_0.png)\n\n## 在所有主要 Linux 发行版中发现另一严重缺陷\n\
    \nCVE-2021-4034 已被识别 (https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-4034)。这个名为\
    \ PwnKit 的新漏洞被追溯到 pkexec 在 12 多年前的初始提交。由于这个缺陷存在已久，所有依赖 Polkit 的 Linux 发行版均受影响。\n\
    \npkexec 负责协调特权进程和非特权进程之间的交互，并允许授权用户以其他用户的身份执行命令。Qualys 的研究人员发现 pkexec 命令 (https://blog.qualys.com/vulnerabilities-threat-research/2022-01-25/pwnkit-local-privilege-escalation-vulnerability-discovered-in-polkits-pkexec-cve-2021-4034)\
    \ 可被本地攻击者利用，在 Ubuntu、Debian、Fedora 和 CentOS 上将权限提升至 root（并警告说它很可能也适用于其他发行版）。\n\
    \n重要的是要理解，凭借这个漏洞，攻击者仅使用默认的 polkit 配置就可以在你的系统上获得完整的 root 权限。\n\n当然，两个主要发行版 Ubuntu\
    \ 和 Red Hat 已经为该漏洞发布了补丁。这些补丁适用于 Ubuntu 14.04、16.04 ESM、18.04、20.04 和 21.04，以及\
    \ Red Hat 的 Workstation 和 Enterprise 产品。\n\n对于使用尚未修补此问题的发行版的用户，一个快速的修复方法是使用以下命令去除\
    \ pkexec 的 setuid 位：\n\n```\nsudo chmod 0755 /usr/bin/pkexec\n```\n\n如果你使用的是上述列出的\
    \ Ubuntu 或 Red Hat 版本，请确立即更新你的系统。\n\n![](img/8286bf901ba268fe114d66ada92d1dd6_9_1.png)\n\
    \n## 每两周获取最新新闻到你的收件箱\n\n**免费订阅 Linux Update**\nbit.ly/Linux-Update\n\n"
