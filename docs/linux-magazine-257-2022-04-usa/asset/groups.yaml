    the selection of the time zone from a map that does not indicate time zones, along
    with some unusual restrictions, such as a limit of 3-32 characters on account
    names. Yet even then, the installation is not finished.


    The third stage involves customization, with choices of a Fashion (large dock)
    or Efficient (small dock) desktop mode, an Effect or Normal running mode, and
    several icon themes. These choices are generally clear, but no details of exactly
    what each entails are offered during installation. Fortunately, the running mode
    can be changed later from the desktop’s dock and the icon mode from the Personalization
