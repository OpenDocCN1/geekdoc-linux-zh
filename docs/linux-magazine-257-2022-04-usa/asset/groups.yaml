    Reaper，但有一些特殊性。Reaper 的界面看起来相当朴素，文字较多，特效或无用元素较少，这也是该程序在资源使用上非常节约的另一个原因。安装仅占用硬盘约
    100MB 空间。或者，你可以将软件安装在 USB 闪存盘上，作为便携式 Live DAW。


    Reaper 并不像 Apple Logic Pro 那样附带全套插件和虚拟音源包。相反，Reaper 提供少量的 VST 插件（图 1）和 JS 效果（Reaper
    的自有插件格式，通常没有图形界面）。


