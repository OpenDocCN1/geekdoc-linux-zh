    ![](img/8286bf901ba268fe114d66ada92d1dd6_45_1.png)


    # Info


    +   [1] FIGlet: http://www.figlet.org


    # Author


    Charly Kühnast manages Unix systems in a data center in the Lower Rhine region
    of Germany. His responsibilities include ensuring the security and availability
    of firewalls and the DMZ.


