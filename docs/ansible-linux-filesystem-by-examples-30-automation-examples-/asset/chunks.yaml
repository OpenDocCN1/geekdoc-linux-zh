- fmt: "\n- `src` string - device or network volume\n- `fstype` string - `ext4`, `xfs`,\
    \ `iso9660`, `nfs`, `cifs`, etc.\n- `opts` string - mount options\n\nThis module\
    \ has many parameters to perform any task.\n\nThe only required are `path` and\
    \ `state`.\n\nThe parameter `path` specifies the path to the mount point (e.g.\
    \ `/mnt/`).\n\nThe parameter `state` allows us to verify a specific state of the\
    \ mount point. The options `mounted`, `unmounted` and `remounted` change the device\
    \ status. The `present` and `absent` options only change the `/etc/fstab` file.\n\
    \nThe `src` parameter specifies the device or network volume for NFS or SMB/CIFS.\n\
    \nThe `fstype` parameter specifies the filesystem type. For example: `ext4`, `xfs`,\
    \ `iso9660`, `nfs`, `cifs`, etc.\n\nThe `opts` parameter allows us to specify\
    \ some mount options, that vary for each filesystem type.\n\n## Demo\n\nLet’s\
    \ jump in a real-life Ansible Playbook to mount an SMB/CIFS filesystem.\n\n###\
    \ code\n\n```yaml\nmount_cifs.yml\n---\n- name: mount module demo\n  hosts: all\n\
    \  become: true\n  vars:\n    uri: \"//windows-pc/share\"\n    username: \"example@domain\"\
    \n    password: \"password\"\n    mountpoint: \"/share\"\n  tasks:\n    - name:\
    \ utility present\n      ansible.builtin.package:\n        name: cifs-utils\n\
    \        state: present\n    - name: check mountpoint exist\n      ansible.builtin.file:\n\
    \        path: \"{{ mountpoint }}\"\n        state: directory\n        mode: '0755'\n\
    \        owner: root\n        group: root\n    - name: Mount network share\n \
