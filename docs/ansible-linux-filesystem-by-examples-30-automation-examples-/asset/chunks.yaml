    \  hosts: all\n  tasks:\n    - name: Hello message\n      debug:\n        msg:\
    \ \"Hello World!\"\n        verbosity: 2\n...\n```\n\n1. 文件名：`helloworld_debug.yml`\n\
    2. Playbook 的名称\n3. 执行主机\n4. 任务列表\n5. 一个名为“Hello message”的任务\n6. `debug` 模块\n\
    7. `debug` 模块的参数 `msg`\n8. 参数 `varbosity`（此处原文误）为“2”\n\n此提示允许你将调试代码保留在 playbook\
    \ 中，并仅在需要时启用执行。例如，只有在调用 Ansible 且指定输出级别为二时，才会打印消息。\n\n## helloworld_debug.yml\
    \ - 执行 - 部分 1\n\n```bash\n1 ansible-playbook -i inventory helloworld_debug.yml\n\
    2 PLAY [Hello World sample] *******************************\\\n3 *********************************************************\\\
    \n4 ***********\n5\n6 TASK [Gathering Facts] **********************************\\\
    \n7 *********************************************************\\\n8 ********\n\
    9 ok: [host1.example.com]\n10\n11 TASK [Hello message] ************************************\\\
    \n12 *********************************************************\\\n13 ******\n\
    14 skipping: [host1.example.com]\n15\n16 PLAY RECAP **********************************************\n\
    17 *****************************************************\n18 host1.example.com\
    \      : ok=1    changed=0    unreachable\n19 e=0    failed=0    skipped=1   \
    \ rescued=0    ignored=0\n```\n\n这是 `helloworld_debug.yml` 在正常执行（即非调试模式）时的输出。如你所见，hello\
    \ 消息被跳过了。\n\n## helloworld_debug.yml - 执行 - 部分 2\n\n```bash\n1 $ ansible-playbook\
    \ -i inventory -vv helloworld_debug.yml\n2 PLAY [Hello World sample] *******************************\\\
    \n3 *********************************************************\\\n4 ***********\n\
    5 TASK [Gathering Facts] **********************************\\\n6 *********************************************************\\\
    \n7 ********\n8 ok: [host1.example.com]\n9 TASK [Hello message] ************************************\\\
    \n10 *********************************************************\\\n11 ******\n\
    12 ok: [host1.example.com] => {\n13     \"msg\": \"Hello World!\"\n14 }\n15 PLAY\
    \ RECAP **********************************************\n16 *****************************************************\n\
    17 host1.example.com      : ok=2    changed=0    unreachable\n18 e=0    failed=0\
    \    skipped=1    rescued=0    ignored=0\n```\n\n这是 `helloworld_debug.yml` 在调试级别二模式下执行时的输出，请注意命令行中的两个“V”。如你所见，hello\
    \ 消息被打印了。\n\n## 等幂性 (Idempotency)\n\n1 等幂性\n2 模块检查期望的最终状态是否已实现，否则执行\n\n大多数 Ansible\
    \ 模块的一个重要特性是“等幂性”的。这意味着在目标节点上执行任何操作之前，模块将检查实际状态。如果实际状态与预期状态匹配，则将不执行任何操作。如果当前状态偏离预期状态，则将发生操作。请注意，如果你再次执行该\
    \ playbook，将发现期望状态已存在，且不会执行进一步的操作。这一属性被称为“等幂性”，你应该充分利用它。\n\n## multipleplays.yml\n\
    \n```yaml\n1 ---\n2 - name: first play\n3   hosts: web.example.com\n4   tasks:\n\
    5     - name: first task\n6       ansible.builtin.yum:\n         name: httpd\n\
    \         status: present\n7     - name: second task\n8       ansible.builtin.service:\n\
    \         name: httpd\n         enabled: true\n9 - name: second play\n10  hosts:\
    \ database.example.com\n11  tasks:\n12    - name: first task\n13       ansible.builtin.service:\n\
    \         name: mariadb\n         enabled: true\n```\n\n文件名：`multipleplays.yml`\n\
    \n内部包含两个针对 `web.example.com` 和 `database.example.com` 执行的 play。\n\n`multipleplays.yml`\
    \ playbook 包含两个 play。第一个 play 在 `web.example.com` 主机上执行，安装 apache Web 服务器并设置开机自启。第二个\
    \ play 将在 `database.example.com` 上执行并设置开机自启。\n\n## privilegeescalation.yml\n\n\
    ```yaml\n1 ---\n2 - name: install httpd\n3   hosts: web.example.com\n4   become:\
    \ true\n5   become_method: sudo\n6   become_user: root\n7   tasks:\n8     - name:\
    \ first task\n9       ansible.builtin.yum:\n         name: httpd\n         status:\
    \ present\n```\n\n`privilegeescalation.yml`\n\n`become` 指定必要的权限\n`become_method`\
    \ 指定方法\n`become_user` 指定 root 用户\n\n## 最常用的 Ansible 模块\n\n文件模块 (Files modules)\n\
    `copy`: 将本地文件复制到托管主机\n`fetch`: 从远程节点复制文件到本地\n`file`: 设置权限和其他属性\n`lineinfile`:\
    \ 确保文件中存在某特定行\n`synchronize`: 使用 `rsync` 同步内容\n\n软件包模块 (Software package modules)\n\
    `package`: 管理操作系统原生软件包\n`yum`: 使用 YUM 管理软件包\n`apt`: 使用 APT 管理软件包\n`dnf`: 使用 DNF\
    \ 管理软件包\n`gem`: 管理 Ruby 包\n`pip`: 管理 Python 包\n\n系统模块 (System modules)\n`firewalld`:\
    \ 管理任意端口和服务\n`reboot`: 重启机器\n`service`: 管理服务\n`user`: 添加、删除和管理用户账户\n\n网络工具模块 (Net\
    \ tools modules)\n`get_url`: 通过 HTTP、HTTPS 和 FTP 下载文件\n`nmcli`: 管理网络\n`uri`: 与\
    \ Web 服务交互\n\n## 总结 (Recap)\n\n在本模块中为后续操作奠定了基础。继续努力，很快就能自动化所有的系统任务。\n\n## 变量 (Variables)\n\
    \n在本章中，我将为你解释什么是变量、为什么需要它们、不同类型以及如何使用它们。\n\n1 变量为给环境存储动态值。\n\n在你的 Playbook 中，使用变量存储所有需要的动态值是一个良好的实践。通过编辑变量，你可以在未来复用代码，只需对业务需求进行参数化。\n\
    \n"
- fmt: "\nThe `variableprint.yml` playbook is similar to `helloworlds.yml` playbook.\
    \ The syntax and the structure of the element is very similar except for the presence\
    \ of the variable `fruit`. Variables store information like strings, numbers and\
    \ more complex data structures like lists, dictionaries, etc. In this case the\
    \ variable has name `fruit` and value `apple`. The `debug` module in this case\
    \ will concatenate the text `Print the value of variable` with the value of the\
    \ variable `fruit`. Please note the double bracket that means the values of the\
    \ variable. It’s a best practice always to include the double brackets within\
    \ double quote in the code.\n\n## variableprint.yml - execution\n\n```\n1 $ ansible-playbook\
    \ -i inventory variableprint.yml 2 PLAY [Variable print sample] ****************************\\\
    \ 3 *********************** 4 5 TASK [Gathering Facts] **********************************\\\
    \ 6 *********************** 7 ok: [host1.example.com] 8 9 TASK [Print variable]\
    \ ***********************************\\ 10 *********************** 11 ok: [host1.example.com]\
    \ => { 12     \"msg\": \"Print the value of variable apple\" 13 } 14 15 PLAY RECAP\
    \ **********************************************\\ 16 ***********************\
    \ 17 host1.example.com  : ok=2    changed=0    unreachable=0  \\ 18 failed=0 \
    \   skipped=0    rescued=0    ignored=0\n```\n\nThis is the output of the execution\
    \ of the `variableprint.yml` is very similar to the one of `helloworld.yml` file.\
    \ Please note print of the message `Print the value of variable apple` obtained\
    \ combining the string with the value of the variable. Also this execution is\
    \ successful as you could see in the play recap area and the green color. Two\
    \ tasks are being executed.\n\n## variableprint.yml - extra variables\n\n```\n\
    1 $ ansible-playbook -i inventory  -e fruit=banana  variabl\\ 2 eprint.yml 3 PLAY\
    \ [Variable print sample] ****************************\\ 4 ***********************\
    \ 5 6 TASK [Gathering Facts] **********************************\\ 7 ***********************\
    \ 8 ok: [host1.example.com] 9 10 TASK [Print variable] ***********************************\\\
    \ 11 *********************** 12 ok: [host1.example.com] => { 13     \"msg\": \"\
    Print the value of variable banana\" 14 } 15 16 PLAY RECAP **********************************************\\\
    \ 17 *********************** 18 host1.example.com  : ok=2    changed=0    unreachable=0\
    \  \\ 19 failed=0    skipped=0    rescued=0    ignored=0\n```\n\nYou could override\
    \ the playbook variables specify the value from the command line. Variables set\
    \ on the command line are called extra variables.\n\nThis is the output of the\
    \ execution of the `variableprint.yml` is very similar to the previous one. Please\
    \ note print of the message `Print the value of variable banana` obtained combining\
    \ the string with the value of the variable. The value passed from the command\
    \ line override any playbook value.\n\n## Host Variables and Group Variables\n\
    \n### inventory_host_variables\n```\n1 [servers] 2 host1.example.com ansible_user=devops\n\
    ```\n\n### inventory_group_variables\n```\n1 [servers] 2 host1.example.com 3 host2.example.com\
    \ 4 5 [servers:vars] 6 user=alice\n```\n\nHost and group variables could be defined\
    \ in your inventory file. In the left column you could see an example of host\
    \ variable. The variable `ansible_user` is assigned the value `devops`. This host\
    \ variable is available for `host1.example.com`. On the right column you see an\
    \ example of group variable. The variable `user` is assigned the value `alice`.\
    \ This group variable will be available for `host1.example.com` and `host2.example.com`\
    \ with the same value.\n\n### inventory_host_dir\n```\n1 [servers] 2 host1.example.com\n\
    ```\n### host_vars/demo1.example.com\n```\n1 ansible_user=devops\n```\n\n### inventory_group_dir\n\
    ```\n1 [servers] 2 host1.example.com 3 host2.example.com\n```\n\n### group_vars/servers\n\
    ```\n1 user=alice\n```\n\nYou can achieve the same result also using using directories\
    \ to populate host and group variables. As you could see the result will be the\
    \ same of the previous slide but using more files. In the left column you could\
    \ see an example of host variable. The variable `ansible_user` is assigned the\
    \ value `devops`. This host variable is available for `host1.example.com`. On\
    \ the right column you see an example of group variable. The variable `user` is\
    \ assigned the value `alice`. This group variable will be available for `host1.example.com`\
    \ and `host2.example.com` with the same value.\n\n## Array variables\n\n### array.yml\n\
    ```\n1 --- 2 - name: Array sample 3   hosts: all 4   vars: 5     users: 6    \
    \   alice: 7         firstname: Alice 8         homedir: /users/alice 8      \
    \ bob: 10        firstname: Bob 10      homedir: /users/alice\n```\n`1 file name:\
    \ array.yml 2 Users are organized in a hierarchical structure. 3 4 Returns 'Alice'\
    \ 5 users.alice 6 Returns 'Alice' \n\nA very useful data structure is the Array.\
    \ You could organize the information in a hierarchical structure. In the example\
    \ it’s easy readable the list of users: alice and bob. Each element has some properties:\
    \ firstname and homedir.\n\n### array.yml - execution\n```\n1 $ ansible-playbook\
    \ -i inventory array.yml 2 PLAY [Array sample] *********************************\\\
    \ 3 *************************************************\\ 4 ***** 5 TASK [Gathering\
    \ Facts] **********************************\\ 6 *************************************************\\\
    \ 7 ********* 8 ok: [host1.example.com] 9 TASK [Print Alice's firstname] **************************\\\
    \ 10 *************************************************\\ 11 *ok: [host1.example.com]\
    \ => { 12     \"msg\": \"Print Alice's firstname: Alice\" 13 } 14 PLAY RECAP **********************************************\\\
    \ 15 *************************************host\\ 16 1.example.com  : ok=2    changed=0\
    \    unreachable\\ 17 able=0    failed=0    skipped=0    ignored=0\n```\n\nThis\
    \ is the output of the execution of the `array.yml` is very similar to the previous\
    \ one. You could notice the output of `Print Alice’s firstname: Alice`. Ansible\
    \ accessed the array variable value and show in the output message as expected.\n\
    \n## Registered Variables\n\n### registeredvariables.yml\n```\n1 --- 2 - name:\
    \ Installs a package and prints the result 3   hosts: all 4   become: true 5 \
    \  tasks: 6    - name: Install the package 7      ansible.builtin.yum: 8     \
    \   name: wget 9        state: installed 10     register: install_result 11 12\
    \    - name: debug 13      ansible.builtin.debug: 14        var: install_result\n\
    ```\n`1 file name: registeredvariables.yml 2 3 Store the standard output in variable\
    \ install_result 4 that could be printed as well`\n\nAnother very useful data\
    \ structure are registered variables. You could save inside registered variables\
    \ the output of any commands. In this example will be printed on screen.\n"
