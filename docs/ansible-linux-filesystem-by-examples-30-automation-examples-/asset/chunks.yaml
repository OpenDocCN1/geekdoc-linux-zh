    ok: [demo.example.com] => {\n    \"msg\": \"harmful task\"\n}\nPLAY RECAP *********************************************************************************************************************\n\
    demo.example.com          : ok=2    changed=0    unreachable=0    failed=0   \
    \ skipped=0    rescued=0    ignored=0\nansible-pilot $\n```\n\n## Ansible Playbook\
    \ hosts advanced\n`hosts: \"{{ HOSTS }}\"`\n\n`ansible-playbook -e \"HOSTS=demo.example.com\"\
    \ PLAYBOOK`\n\nUsing the `hosts` statement in the Ansible Playbook allows you\
    \ to specify also a variable that you could populate with a host or a group of\
