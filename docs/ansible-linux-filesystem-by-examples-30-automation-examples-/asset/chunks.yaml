  trans: "\n\n请注意，网站包含 `Ansible Roles` 和 `Ansible Collections`。今天我们关注的是 `Ansible Role`\
    \ 内容。\n\n## 链接\n\n- [Ansible Collections 列表](https://github.com/ansible-collections)\n\
    - [Ansible Collections 开发指南](https://docs.ansible.com/ansible/latest/dev_guide/developing_collections.html)\n\
    - [Ansible Collections 迁移角色](https://docs.ansible.com/ansible/latest/dev_guide/migrating_roles.html)\n\
    - [community.general collection](https://docs.ansible.com/ansible/latest/collections/community/general/)\n\
    \n## demo\n\n让我们在安装了 `ansible-core` 的系统中，进入一个真实的场景——“如何下载并使用 Ansible Galaxy Collection”\
    \ `community.general`。\n\n### code\n\n**collection.yml**\n```yaml\n---\n- name:\
    \ modprobe module demo\n  hosts: localhost\n  become: true\n  vars:\n    module_name:\
    \ \"dummy\"\n    ansible_connection: local\n  tasks:\n    - name: load the module\n\
    \      community.general.modprobe:\n        name: \"{{ module_name }}\"\n    \
    \    state: present\n```\n\n**requirements.yml**\n```yaml\n---\ncollections:\n\
    \  - name: community.general\n    source: https://galaxy.ansible.com\n```\n\n\
    ### 在未安装 collection 的执行\n\n```bash\n$ ansible-playbook collection/collection.yml\n\
    [WARNING]: provided hosts list is empty, only localhost is available. Note that\
    \ the implicit localhost does not match 'all'\nERROR! couldn't resolve module/action\
    \ 'community.general.modprobe'. This often indicates a misspelling, missing collection,\
    \ or incorrect module path.\n\n错误似乎出现在 '/home/devops/collection/collection.yml':\
    \ 第 10 行，第 7 列，但可能在文件的其他位置，取决于具体的语法问题。\n\n出现问题的行似乎是：\n\n  tasks:\n    - name:\
    \ load the module\n      ^ here\n$\n```\n\n### 下载并执行\n\n```bash\n$ ansible-galaxy\
    \ install -r collection/requirements.yml\nStarting galaxy collection install process\n\
    Process install dependency map\nStarting collection install process\nDownloading\
    \ https://galaxy.ansible.com/download/community-general-4.5.0.tar.gz to /home/devops/.ansible/tmp/ansible-local-24543cs6dck7/tmpaccd0umv/community-general-4.5.0-5msjuuoa\n\
    Installing 'community.general:4.5.0' to '/home/devops/.ansible/collections/ansible_collections/community/general'\n\
    community.general:4.5.0 was installed successfully\n```\n\n### 列出已安装的 collection\n\
    \n```bash\n$ ansible-galaxy collection list\n# /home/devops/.ansible/collections/ansible_collections\n\
    Collection        Version\n----------------- -------\ncommunity.general 4.5.0\n\
    $\n```\n\n### 安装 collection 后执行\n\n```bash\n$ ansible-playbook collection/collection.yml\n\
    [WARNING]: provided hosts list is empty, only localhost is available. Note that\
    \ the implicit localhost does not match 'all'\n\nPLAY [modprobe module demo] *****************************\n\
    ******************************************\n\nTASK [Gathering Facts] *************************************\n\
    ******************************************\nok: [localhost]\n\nTASK [load the\
    \ module] *************************************\n******************************************\n\
    changed: [localhost]\n\nPLAY RECAP **********************************************\n\
    ******************************************\nlocalhost                   : ok=2\
    \    changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n\
    \n$\n```\n\n## Ansible 用于 Linux 文件系统\n\n如何使用 Ansible 自动化与 Linux 文件系统的交互。例如：文件和目录的创建、权限和删除。\n\
    \n## 创建空文件 - Ansible 模块\n\n如何创建一个空的 `~/example.txt` 文件或更新已创建的时间。\n\n### Ansible\
    \ 创建空文件\n\n让我们来聊聊 Ansible 模块。它的全名是 `ansible.builtin.file`，这意味着它是 Ansible 内置 \"\
    builtin\" 模块集合的一部分，并随 Ansible 一起发布。\n\n这是一个非常稳定的模块，已经发布多年。它可以在多种操作系统上运行。它管理文件和文件属性。\n\
    \n对于 Windows 目标，请使用 `ansible.windows.win_file` 模块。\n\n### 主要参数\n\n- `path` string\
    \ (dest, name) - 文件路径\n- `state` string - 文件/不存在 (file/absent)\n\n它管理文件和文件属性。对于\
    \ Windows 目标，请使用 `ansible.windows.win_file` 模块。\n\n### demo\n\n**file.yml**\n\
    ```yaml\n---\n- name: modprobe module demo\n  hosts: localhost\n  become: true\n\
    \  vars:\n    module_name: \"dummy\"\n    ansible_connection: local\n  tasks:\n\
    \    - name: load the module\n      community.general.modprobe:\n        name:\
    \ \"{{ module_name }}\"\n        state: present\n```\n\n"
- fmt: "\nToday we’re talking about the Ansible module file.\n\nThe full name is `ansible.builtin.file`,\
    \ which means that it is part of the collection of modules `builtin` with `ansible`\
    \ and shipped with it.\n\nIt’s a module pretty stable and out for years. It works\
    \ in a different variety of operating systems. It manages files and file properties.\
    \ \n\nFor Windows targets, use the `ansible.windows.win_file` module instead.\n\
    \n## Parameters\n\n- `path` string (`dest`, `name`) - file path\n- `state` string\
    \ - `file/absent/directory/hard/link/touch`\n- `mode`/`owner`/`group` - permission\n\
    - `setype`/`seuser`/`selevel` - SELinux\n\nThis module has some parameters to\
    \ perform any tasks.\n\nThe only required is `path`, where you specify the filesystem\
    \ path of the file you’re going to edit.\n\nThe `state` defines the type of object\
    \ we are modifying, the default is `file` but for our use case, we need the `directory`\
    \ option.\n\n## Demo\n\nHow to create the `example` directory in the home of `devops`\
    \ user in Linux with Ansible using the `file` module.\n\n### code\n```yaml\ncreate_directory.yml\n\
    ---\n- name: file module demo\n  hosts: all\n  vars:\n    mydir: \"~/example\"\
    \n  tasks:\n    - name: Creating a directory\n      ansible.builtin.file:\n  \
    \      path: \"{{ mydir }}\"\n        state: directory\n        owner: devops\n\
    \        group: users\n        mode: '0644'\n```\n\n### execution\n```bash\n$\
    \ ansible-playbook -i demo/inventory create_directory/file.yml\nPLAY [file module\
    \ demo] *********************************\n************************************\n\
    TASK [Gathering Facts] ***********************************\n************************************\n\
    ok: [demo.example.com]\nTASK [Creating a directory] *****************************\n\
    ************************************\nchanged: [demo.example.com]\nPLAY RECAP\
    \ **********************************************\n************************************\n\
    demo.example.com          : ok=2    changed=1    unreachable=0    failed=0   \
    \ skipped=0    rescued=0    ignored=0\n```\n\n### before execution\n```bash\n\
    $ ssh devops@demo.example.com\n[devops@demo ~]$ ls -al\ntotal 16\ndrwx------.\
    \ 4 devops wheel  111 Nov 14 13:43 .\ndrwxr-xr-x. 5 root  root    50 Nov  8 17:07\
    \ ..\ndrwx------. 3 devops wheel  17 Sep  6 05:53 .ansible\n-rw-------. 1 devops\
    \ wheel 2849 Nov 14 13:43 .bash_history\n-rw-r--r--. 1 devops wheel  18 Dec  4\
    \  2020 .bash_logout\n-rw-r--r--. 1 devops wheel  141 Dec  4  2020 .bash_profile\n\
    -rw-r--r--. 1 devops wheel  376 Dec  4  2020 .bashrc\ndrwx------. 2 devops wheel\
    \  94 Sep 16 10:09 .ssh\n[devops@demo ~]$\n```\n\n### after execution\n```bash\n\
    $ ssh devops@demo.example.com\n[devops@demo ~]$ ls -al\ntotal 16\ndrwx------.\
    \ 5 devops wheel  126 Nov 14 13:45 .\ndrwxr-xr-x. 5 root  root    50 Nov  8 17:07\
    \ ..\ndrwx------. 3 devops wheel  17 Sep  6 05:53 .ansible\n-rw-------. 1 devops\
    \ wheel 2861 Nov 14 13:44 .bash_history\n-rw-r--r--. 1 devops wheel  18 Dec  4\
    \  2020 .bash_logout\n-rw-r--r--. 1 devops wheel  141 Dec  4  2020 .bash_profile\n\
    -rw-r--r--. 1 devops wheel  376 Dec  4  2020 .bashrc\ndrwx------. 2 devops wheel\
    \  94 Sep 16 10:09 .ssh\ndrw-r--r--. 2 devops users    6 Nov 14 13:45 example\n\
    ```\n\n## How to check if a directory exists in Ansible?\n\nTo verify if a directory\
    \ exists with the `stat` module. The full name is `ansible.builtin.stat`, which\
    \ means it is part of the collection of modules `builtin` with `ansible` and shipped\
    \ with it. It’s a module pretty stable and out for years. It works in a different\
    \ variety of operating systems. It retrieves a file system status. For Windows\
    \ target use `ansible.windows.win_stat` module instead.\n\n## Main parameters\
    \ and return values\n\n- `path`: The only mandatory parameter is `path` which\
    \ is the filesystem full path of object to check.\n- `stat`: The module returns\
    \ a complex object, the property interesting for us is `isdir`. This attribute\
    \ is `true` if the object is a directory.\n\n## Demo\n\nLet’s jump in a real-life\
    \ playbook to check if a directory exists.\n\n### code\n```yaml\ndirectory_check_exists.yml\n\
    ---\n- name: check if the directory exists\n  hosts: all\n  become: false\n  vars:\n\
    \    directory: \"/tmp\"\n  tasks:\n    - name: Check if the exists\n      ansible.builtin.stat:\n\
    \        path: \"{{ directory }}\"\n      register: dir_to_check\n    - name:\
    \ Directory found\n      ansible.builtin.debug:\n        msg: \"{{ directory }}\
    \ present\"\n      when: dir_to_check.stat.isdir\n```\n\n## How to rename a file\
    \ or directory using an Ansible task on a remote system?\n\nTo rename file/directory\
    \ with Ansible. First of all let me propose a solution using only Ansible native\
    \ modules, so no `shell` module to invoke the `mv` utility. Today we’re talking\
    \ about two modules `copy` and `file`. The full names are `ansible.builtin.copy`\
    \ and `ansible.builtin.file` which means they are part of the collection of modules\
    \ `builtin` with `ansible` and shipped with it. Both modules are pretty stable\
    \ and out for years. The purpose of the `copy` module is to copy files to remote\
    \ locations. Once the file is successfully copied we could use the `file` module\
    \ to delete the source file.\n\n## Parameters\n\n### `copy` module\n- `dest`:\
    \ path - destination\n- `src`: string - source\n- `remote_src`: boolean - no /\
    \ yes\n\nThe parameter list is wide but I’ll summarize the most useful. The only\
    \ required parameter is `dest` which specifies the destination path. The `src`\
    \ specifies the source file presumed in controller host. It could be a relative\
    \ or absolute path. From version 2.0, in the `copy` module, you can use the `remote_src`\
    \ parameter. If `True` it will search the file in the remote target machine for\
    \ `src`. From version 2.8 `copy` module `remote_src` supports recursive copying.\n\
    \n### `file` module\n- `path`: string (`dest`, `name`) - file path\n- `state`:\
    \ string - `file/absent/directory/hard/link/touch`\n\nThe only required is `path`,\
    \ where you specify the filesystem path of the file you’re going to edit. The\
    \ `state` defines the type of object we are modifying, the default is `file` but\
    \ we could also handle directories, `hardlink`, `symlink`, or only update the\
    \ access time with the `touch` option. For our use case, we are going to use the\
    \ `absent` option.\n\n## Demo\n\nLet’s jump in a real-life playbook to rename\
    \ files or directories with Ansible.\n\n### code\n```yaml\nrename/file.yml\n---\n\
    - name: rename file or directory\n  hosts: all\n  vars:\n    mysrc: \"~/foo\"\n\
    \    mydst: \"~/bar\"\n  tasks:\n    - name: Check if file exists\n      ansible.builtin.stat:\n\
    \        path: \"{{ mysrc }}\"\n      register: check_file_name\n    - name: print\
    \ debug\n      ansible.builtin.debug:\n        var: check_file_name\n    - name:\
    \ Copy file with new name\n      ansible.builtin.copy:\n        remote_src: true\n\
    \        src: \"{{ mysrc }}\"\n        dest: \"{{ mydst }}\"\n      when: check_file_name.stat.exists\n\
    \    - name: Remove old file\n      ansible.builtin.file:\n        path: \"{{\
    \ mysrc }}\"\n        state: absent\n      when: check_file_name.stat.exists\n\
    ```\n\n### execution\n- output file does not exist:\n"
