    root@debian:/home/devops# apt list ansible --installed\nListing... Done\nroot@debian:/home/devops#\n\
    ```\n\n## 执行后\n\n```\nroot@debian:/home/devops# apt list ansible --installed\n\
    Listing... Done\nansible/stable,now 2.10.7+merged+base+2.10.8+dfsg-1 all [installed]\n\
    root@debian:/home/devops# dpkg -l | grep ansible\nii  ansible                \
    \      2.10.7+merged+base+2.10.8+dfsg-1 all      Configuration management, deployment,\
    \ and task execution system\nroot@debian:/home/devops#\n```\n\n## Linux 版 Ansible\n\
    \n在本章中，你将发现最常用的 Ansible 模块，用于自动化 Linux 管理员任务。\n\n## Ansible 术语 - `ansible_hostname`\
    \ vs `inventory_hostname` vs `ansible_fqdn`\n\n在 Playbook 的实际示例中，`ansible_hostname`、`inventory_hostname`\
    \ 和 `ansible_fqdn` 之间的区别是什么？这两个内部变量有时会让人混淆，但它们从本质上是不同的。\n\n## `ansible_hostname`\
    \ vs `inventory_hostname` vs `ansible_fqdn`\n\n`ansible_hostname` 和 `ansible_fqdn`\
    \ 从目标机器的事实（facts）中读取：`ansible_hostname` 从 `gather_facts` 期间收集的事实读取主机名。类似于 `uname\
    \ -n` 命令。需要启用 `gather_facts`，否则 `ansible_facts` 变量将无法在 playbook 中使用。它等同于目标主机的主机名。\n\
    \n`inventory_hostname` 从 Ansible 清单（inventory）或文件读取：它从 `inventory` 配置或 hosts 文件读取主机名。它可能与远程系统的主机名不同。它可能只是控制机上的一个名称，始终可以在你的\
    \ playbook 中使用。对于 playbook 和即时命令（ad-hoc command），它都可能与目标主机的主机名不同。\n\n## 演示\n\n\
    让我通过一个简单的 Playbook 向你展示 `ansible_hostname`、`inventory_hostname` 和 `ansible_fqdn`\
    \ 内部变量之间的区别。\n\n```yaml\n---\n- name: hostnames\n  hosts: all\n  gather_facts:\
    \ true\n  tasks:\n    - name: print inventory_hostname\n      ansible.builtin.debug:\n\
    \        var: inventory_hostname\n    - name: print ansible_hostname\n      ansible.builtin.debug:\n\
    \        var: ansible_hostname\n    - name: print ansible_fqdn\n      ansible.builtin.debug:\n\
    \        var: ansible_fqdn\n```\n\n执行\n\n```\nansible-pilot $ ansible-playbook\
    \ -i statements/hostnames.yml\nPLAY [hostnames] *************************************************\n\
    TASK [Gathering Facts] *************************************************\nok:\
    \ [foo.example.com]\nTASK [print inventory_hostname] *************************************\n\
    ok: [foo.example.com] => {\n    \"inventory_hostname\": \"foo.example.com\"\n\
    }\nTASK [print ansible_hostname] *****************************************\nok:\
    \ [foo.example.com] => {\n    \"ansible_hostname\": \"demo\"\n}\nTASK [print ansible_fqdn]\
    \ ****************************************\nok: [foo.example.com] => {\n    \"\
    ansible_fqdn\": \"demo.example.com\"\n}\nPLAY RECAP *****************************************************************\n\
    foo.example.com: ok=4    changed=0  unreachable=0  failed=0  skipped=0  rescued=0\
    \  ignored=0\nansible-pilot $\n```\n\n#### 等等性（Idempotency）\n\n```\nansible-pilot\
    \ $ ansible-playbook -i statements/hostnames.yml\nPLAY [hostnames] *************************************************\n\
    TASK [Gathering Facts] *************************************************\nok:\
    \ [foo.example.com]\nTASK [print inventory_hostname] *************************************\n\
    ok: [foo.example.com] => {\n    \"inventory_hostname\": \"foo.example.com\"\n\
    }\nTASK [print ansible_hostname] *****************************************\nok:\
    \ [foo.example.com] => {\n    \"ansible_hostname\": \"demo\"\n}\nTASK [print ansible_fqdn]\
    \ ****************************************\nok: [foo.example.com] => {\n    \"\
    ansible_fqdn\": \"demo.example.com\"\n}\nPLAY RECAP *****************************************************************\n\
    foo.example.com: ok=4    changed=0  unreachable=0  failed=0  skipped=0  rescued=0\
    \  ignored=0\n```\n\n## 总结\n\n现在你对内部变量 `ansible_hostname`、`inventory_hostname`\
    \ 和 `ansible_fqdn` 有了更多了解。\n\n"
