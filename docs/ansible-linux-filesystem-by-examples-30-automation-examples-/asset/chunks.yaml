  trans: "\n\n并不是每个角色都包含所有这些目录。\n\n## 在 playbook 中使用 Ansible 角色\n\n`./role_simple.yml`\n\
    \n```yaml\n---\n- name: role example\n  hosts: all\n  roles:\n    - role1\n  \
    \  - role2\n```\n1 个文件：`role_simple.yml` 将 `role1` 和 `role2` 应用到所有 `all` 托管的主机。\n\
    \n`./role_vars.yml`\n\n```yaml\n---\n- name: role example\n  hosts: all\n  roles:\n\
    \    - role: role1\n    - role: role2\n      var1: value\n      var2: value\n\
    ```\n1 个文件：`role_vars.yml` 将 `role1` 和 `role2` 应用到所有 `all` 托管的主机。`Role2` 有两个变量参数。\n\
    \n## 执行顺序\n\n`./role_vars.yml`\n\n```yaml\n---\n- name: order of execution example\n\
    \  hosts: all\n  pre_tasks:\n    - debug:\n        msg: 'pre-task'\n        notify:\
    \ my handler\n  roles:\n    - role1\n  tasks:\n    - debug:\n        msg: 'first\
    \ task'\n        notify: my handler\n  post_tasks:\n    - debug:\n        msg:\
    \ 'post-task'\n        notify: my handler\n  handlers:\n    - name: my handler\n\
    \      debug:\n        msg: Running my handler\n```\n\n对于 playbook 中的每个 play，任务将按照\
    \ `tasks` 列表中的顺序执行。在所有任务执行后，任何被通知的处理器都将执行。\n\n当一个角色被添加到 play 中时，角色的任务会被添加到 `tasks`\
    \ 列表的开头。如果 play 中包含了第二个角色，则其任务列表将添加到第一个角色之后。\n\n角色处理器添加到 play 中的方式与角色的任务添加到 play\
    \ 中的方式相同。每个 play 均定义了一个 `handlers` 列表。角色处理器首先被添加到 `handlers` 列表，然后是任何在 play 的\
    \ `handlers` 章节中定义的句柄。在某些场景下，可能需要在执行角色之前执行某些 play 任务。为了支持此类场景，可以为 play 配置 `pre_tasks`\
    \ 部分。在该部分中列出的任何任务都会在角色执行之前执行。如果这些任务中的任何一个通知了处理器，则这些处理器任务将在角色或普通任务之前执行。\n\nplay\
    \ 还支持 `post_tasks` 关键字。这些任务在 play 的普通任务以及它们通知的任何处理器执行后运行。\n\n## Ansible Galaxy\n\
    \n[`galaxy.ansible.com/`](https://galaxy.ansible.com/)\n\n### 手动从 Ansible Galaxy\
    \ 安装角色\n\n```bash\n$ ansible-galaxy install geerlingguy.redis -p roles/\n```\n\
    \n### 从 Ansible Galaxy 的 requirements.yml 安装角色\n\n`./requirements.yml`\n\n```yaml\n\
    - src: geerlingguy.redis\n  version: \"1.5.0\"\n```\n\n```bash\n$ ansible-galaxy\
    \ install -r roles/requirements.yml -p roles\n```\n\n## Ansible 最佳实践\n\n遵循 Ansible\
    \ 最佳实践可以让你你的代码成功执行，简化故障排除，并对你的自动化之旅产生积极影响。\n\n### 使用空格\n\n在你的 YAML 代码中使用空格而不是制表符（tabs）。在每个块或任务之前添加新行可以让\
    \ playbook 变得易于读。\n\n例如：\n\n错误\n```yaml\n---\n- hosts: all\n  tasks:\n    - ansible.builtin.yum:\n\
    \        name: httpd\n        state: latest\n    - name: end message\n      ansible.builtin.debug:\n\
    \        msg: \"httpd succesfully installed\"\n```\n\n正确\n```yaml\n---\n- hosts:\
    \ all\n  tasks:\n    - ansible.builtin.yum:\n        name: httpd\n        state:\
    \ latest\n\n  - name: end message\n      ansible.builtin.debug:\n        msg:\
    \ \"httpd succesfully installed\"\n```\n\n### 为每一步分配一个“名称”（name）\n\n为你的代码中的每个\
    \ Ansible 语句（Ansible Plays、Tasks、Blocks）始终设置 `name` 参数。\n\n例如：\n\n错误\n```yaml\n\
    ---\n- hosts: all\n  tasks:\n    - ansible.builtin.yum:\n        name: httpd\n\
    \        state: latest\n```\n\n正确\n```yaml\n---\n- name: install apache\n  hosts:\
    \ all\n  tasks:\n    - name: install apache packages\n      ansible.builtin.yum:\n\
    \        name: httpd\n        state: latest\n```\n\n### 为变量使用人类可读且有意义的名称\n\n变量对于存储参数或保存之前任务的结果非常重要。使用人类可读且有意义的名称可以增加你团队之间的代码复用和可读性。使用\
    \ `ansible-playbook` 命令的 `extra-vars` 参数来覆盖变量也很容易。\n\n例如：\n\n错误\n```yaml\nkeepalive:\
    \ 25\npo: 80\naaaa: 8080\n```\n\n正确\n```yaml\napache_max_keepalive: 25\napache_port:\
    \ 80\n```\n\n### 使用原生 YAML\n\n原生 YAML 的使用提高了代码的可读性，并让你更快更快地发现错误。同时也允许使用某些 YAML\
    \ 校验器和解析器进行验证。\n\n例如：\n\n错误\n```yaml\n- name: install apache\n  ansible.builtin.yum:\
    \ name={{ apache_version }} state=present update_cache=yes disable_gpg_check=yes\
    \ enablepo=apache\n  notify: restart\n```\n\n正确\n```yaml\n- name: install apache\n\
    \  ansible.builtin.yum:\n    name: {{ apache_version }}\n    state: present\n\
    \    update_cache: yes\n    disable_gpg_check: yes\n    enablepo: apache\n  notify:\
    \ restart\n```\n\n### 使用原生模块\n\n始终优先使用原生模块而不是命令。`command`、`shell` 和 `script` 应该作为最后的手段。\n\
    \n例如：\n\n错误\n```yaml\n- name: Add repository into.d list\n  become: true\n  ansible.builtin.shell:\
    \ 'echo -e \"[google-chrome]\\nname=google-chrome\\nbaseurl=http://dl.google.com/linux/rpm/stable/x86_64\\\
    nenabled=1\\ngpgcheck=1\\ngpgkey=https://dl.google.com/linux/linux/key.pub\" >\
    \ /etc/yum.repos.d/google-chrome.repo'\n  when: ansible_os_family == 'RedHat'\n\
    ```\n\n正确\n```yaml\n- name: Add repository into.d list\n  ansible.builtin.yum_repository:\n\
    \    name: google-chrome\n    description: google-chrome repository\n    baseurl:\
    \ http://dl.google.com/linux/rpm/stable/x86_64\n    enabled: true\n    gpgcheck:\
    \ true\n    gpgkey: https://dl.google.com/linux/linux/key.pub\n```\n\n### 配置调试消息\n\
    \n在开发 Ansible 代码时，依靠 `debug` 任务来显示变量的内容非常有用。然而，在生产环境中这可能被认为信息量太大。将 `verbosity`\
    \ 参数设置为 `2` 可以让你只在需要时看到这些消息。\n\n例如：\n\n错误\n```yaml\n- name: message output\n \
    \ ansible.builtin.debug:\n    msg: \"This text always displays\"\n```\n\n正确\n\
    ```yaml\n- name: message output\n  ansible.builtin.debug:\n    msg: \"This text\
    \ displays with ansible-playbook -vv\"\n  verbosity: 2\n```\n\n### 以尽可能少的权限执行任务\n\
    \n这是对于以尽可能少的权限执行任务的安全实践通用建议。在 Ansible 中，你可以在任务级别指定 `become: true`，而不是针对整个 playbook，如果并不是所有任务都需要以\
    \ root/管理员用户身份执行。\n\n例如：\n\n```yaml\n---\n- name: install apache\n  hosts: all\n\
    \  become: true\n  tasks:\n    - name: message output\n      ansible.builtin.debug:\n\
    \        msg: \"This text always displays\"\n\n    - name: install apache packages\n\
    \      ansible.builtin.yum:\n        name: httpd\n        state: latest\n```\n\
    \n正确\n```yaml\n---\n- name: install apache\n  hosts: all\n  tasks:\n    - name:\
    \ message output\n      ansible.builtin.debug:\n        msg: \"This text always\
