    这是 `conditional_basic_true.yml` 执行的输出。在本次执行中，play 针对 `host1.example.com` 节点运行。输出以绿色高亮。如你所见，任务
    `reload ngnx` 任务被 Ansible 读取并在我们的条件语句中成功执行。


    ## 基于 ansible_facts 的条件判断


    `conditional_facts.yml`


    ```yaml

    1 ---

    2 - name: conditional_facts

    3   hosts: all

    4   tasks:

    5   - name: Shut down Debian-like systems

    6     ansible.builtin.command: /sbin/shutdown -t now

    7     when: ansible_facts[''os_family''] == "Debian"

    ```


    将条件判断与事实（facts）结合起来非常有用。这样你就可以根据单个主机的条件、IP 地址、操作系统、文件系统状态等来调整代码的执行。在这个示例中，如果目标系统是
    Debian 类系统（即 Debian 和 Ubuntu 管理的主机），我们将执行关机。


    ### 执行：


    ```bash

    1 $ ansible-playbook -i inventory conditional_facts.yml

    2 PLAY [conditional_facts] ********************************

    3 *********************************************************

    4 **********

    5 TASK [Gathering Facts] *********************************

    6 *********************************************************

    7 ********

    8 ok: [host1.example.com]

    9 TASK [Shut down Debian-like systems] ********************

    10 *********************************************************

    11 **********************

    12 skipping: [host1.example.com]

    13 PLAY RECAP **********************************************

    14 *****************************************************

    15 host1.example.com                  : ok=1    changed=0

    16 unreachable=0    failed=0    skipped=1    rescued=0    i\

    17 gnored=0

    ```


    这是 `conditional_facts.yml` 执行的输出。在本次执行中，play 针对 `host1.example.com` 节点运行。目标主机不是
    Debian 类系统，因为你可以注意到名为 `Shut down Debian-like systems` 的任务处于 `skipped` 跳过状态。


    ## 总结


    条件判断非常重要，因为它们允许我们创建响应某些事件、条件或 Ansible Facts 的 Ansible Playbook。这些语句是智能 Ansible
    Playbook 的基础。


    ## 循环


    在本章中，我向你解释什么是 Ansible 循环操作，以及你如何在日常的 Ansible Playbook 中使用它们。


    ### 1 循环自动化重复任务


    计算机在自动化重复任务方面非常出色。在不产生错误的情况下重复相同或相似的任务是计算机擅长而人类不擅长的。。


    一组语句的重复执行被称为迭代。Ansible 有几个用于迭代的语句——`loop` 语句和 `with_items` 语句。`with` 语句依赖插件。


    `loop_simple.yml`


    ```yaml

    1 ---

    2 - name: Check services

    3   hosts: all

    4   tasks:

    5   - name: httpd and mariadb are running

    6     ansible.builtin.service:

    7       name: "{{ item }}"

    8       state: started

    9     loop:

    10      - httpd

    11      - mariadb

    ```


    简单的循环会对列表中的项对任务进行迭代。`loop` 语句被添加到任务中，并以任务应迭代的项列表作为值。循环变量 `item` 在每次迭代期间遍历当前值。


    `loop_hash_or_dict.yml`


    ```yaml

    1 ---

    2 - name: Users exist and are in the correct groups

    3   hosts: all

    4   tasks:

    5   - name: Users exist and are in the correct groups

    6     ansible.builtin.user:

    7       name: "{{ item.name }}"

    8       state: present

    9       groups: "{{ item.group }}"

    10     loop:

    11      - name: alice

    12        group: wheel

    13      - name: bob

    14        group: root

    ```


    循环列表不需要是简单值的列表。在接下来的示例中，列表中的每个项实际上是一个哈希（hash）或字典（dictionary）。示例中的每个哈希或字典都有两个键：`name`
    和 `groups`，当前项循环变量中每个键的值可以分别通过 `item.name` 和 `item.group` 变量获取。


    ## with_* 语句


    ### `with_items`


    类似于用于简单列表的 `loop`、字符串列表或哈希/字典列表。


    ### 如果提供了列表列表，则将其扁平为列表


    ### `with_file`


    此关键字需要一个控制节点文件名列表。循环变量 `item` 持有文件内容。


    ### `with_sequence`


    需要参数根据数值序列生成值列表。


    ## `loop_with_items.yml`


    ```yaml

    1 ---

    2 - name: Example with_items

    3   hosts: all

    4   vars:

    5     data:

    6       - alice

    7       - bob

    8   tasks:

    9   - name: Print values of

    10    ansible.builtin.debug:

    11      msg: "{{ item }}"

    12    with_items: data

    ```


    在 `loop_with_items.yml` playbook 中，`data` 是一个字符串列表。


    ## 总结


    条件判断非常重要，因为它们允许我们创建响应某些事件、条件或 Ansible Facts 的 Ansible Playbook。


    ## Handler


    在本章中，我向你解释什么是 Ansible 循环操作以及你如何在日常的 Ansible Playbook 中使用它们。


    ### 在变化时运行 Handler


    Handler 非常重要，因为它们允许在必要时执行某些步骤。


    ## `rollingupdate.yml`


    ```yaml

    1 ---

    2 - name: Rolling update

    3   hosts: all

    4   become: true

    5   tasks:

    6   - name: latest httpd package is installed

    7     ansible.builtin.yum:

    8       name: httpd

    9       state: latest

    10 handlers:

    11  - name: restart apache

    12    ansible.builtin.service:

    13      name: httpd

    14      state: restarted

    ```


    `rollingupdate.yml` 由一个任务和一个 handler 组成。handler 代码在必要时执行。请注意 `notify` 语句提到的 handler
    名称。


    ## Role


    Role 实现 Ansible 代码复用


    Role 类似于传统编程中的函数。使用 Ansible role 可以快速开发 playbook 并复用代码。


    ## Role 树目录目录


    ```text

    1 $ tree user.example

    2 user.example/

    3 ├── defaults

    4 │   └── main.yml

    5 ├── files

    6 ├── handlers

    7 │   └── main.yml

    8 ├── meta

    9 │   └── main.yml

    10 ├── README.md

    11 ├── tasks

    12 │   └── main.yml

    13 ├── templates

    14 ├── tests

    15 │   ├── inventory

    16 │   └── test.yml

    17 └── vars

    18     └── main.yml

    ```


    目录描述：


    `defaults` 目录下的 `main.yml` 文件包含角色变量的默认值，可以在使用 role 时进行覆盖。这些变量的优先级较低，旨在在 play 中更改和自定义。


    `files` 此目录包含 role 任务引用的静态文件。


    `handlers` 目录下的 `main.yml` 文件包含 role 的 handler 定义。


    `meta` 目录下的 `main.yml` 文件包含关于 role 信息，包括作者、许可、平台和可选的 role 依赖。


    `tasks` 目录下的 `main.yml` 文件包含 role 的任务定义。


    `templates` 此目录包含 role 任务引用的 Jinja2 模板。


    `tests` 此目录可以包含一个用于测试 role 的 inventory 和 `test.yml` playbook。


    `vars` 的 `main.yml` 文件定义了 role 的变量值。通常这些变量用于 role 内部。这些变量的优先级较高，在 playbook 中中使用时不打算更改。


