    \ $\n```\n\n## Ansible Playbook hosts\n`hosts: HOSTNAME`\n\n`ansible-playbook\
    \ PLAYBOOK`\n\nUsing the `hosts` statement in the Ansible Playbook allows you\
    \ to specify a host or a group of hosts for the execution.\n\nThe advantage is\
