    ```\n\n## 如何使用 PIP 安装 Ansible\n\n如何使用 Python 包管理器 `PIP` 安装 Ansible？\n\n`PIP` 是\
    \ Python 的包管理器，它将处理所有安装过程并管理必要的依赖关系。它直接负责从 `PyPI` 下载和安装包的过程。`PIP` 的设计与操作系统无关。\n\
    \n对于始终想要获取最新发布版本的开发者来说，这可能是一个解决方案。\n\n另一种方法是使用特定操作系统的包管理器。例如，Linux 下使用 `yum`、`DNF`\
    \ 和 `apt`，macOS 下使用 `Homebrew`。\n\n第二种方法更强调稳定性，因此可能无法获得最新版本。\n\n所以，如果你确实需要 Ansible\
    \ 的最新版本，我建议你使用 `PIP`。\n\n## 使用 PIP 演示安装 Ansible\n\n如何使用 Python 包管理器 `PIP` 安装最新版本的\
    \ Ansible。\n\n### PIP 用户模式\n`install-pip-user.sh`\n\n```bash\n#!/bin/bash\npython3\
    \ -m pip install --upgrade -user pip\npython3 -m pip install --user ansible\n\
    ```\n\n### PIP 全局模式\n`install-pip-global.sh`\n\n```bash\n#!/bin/bash\npython3\
    \ -m pip install --upgrade pip\npython3 -m pip install ansible\n```\n\n## 如何在\
    \ RedHat Enterprise Linux 9 Beta 中安装 Ansible\n\n### 如何在 RedHat Enterprise Linux\
    \ 9 Beta 中安装包含在 RHEL 9 AppStream 仓库中的 Ansible Core (`ansible-core`)\n\n### 如何在\
    \ RHEL 9 Beta 中安装 Ansible\n\n### RHEL 9 AppStream 仓库包含的 Ansible Core 包 (`ansible-core`)\n\
    \n好消息是，RHEL 9 AppStream 仓库已经开箱自带了 Ansible Core 包 (`ansible-core`)。\n\n对于基础自动化，不再像以前的版本那样需要额外的仓库（如\
    \ `Ansible Engine` 或 `EPEL`）。\n\n然而，如果需要对底层平台和 Core 维护模块提供额外支持，则需要 Ansible Automation\
    \ Platform 订阅。\n\n## 链接\n\n- [RHEL 9 AppStream 中包含的 Ansible Core 包的支持范围](https://access.redhat.com/articles/6325611)\n\
    - [在 RHEL 9 中使用 Ansible](https://access.redhat.com/articles/6393321)\n\n"
