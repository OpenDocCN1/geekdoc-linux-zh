    \ 和 `remounted` 选项更改设备状态。`present` 和 `absent` 选项仅更改 `/etc/fstab` 文件。\n\n`src`\
    \ 参数指定 NFS 或 SMB/CIFS 的设备或网络卷。\n\n`fstype` 参数指定文件系统类型。例如：`ext4`, `xfs`, `iso9660`,\
    \ `nfs`, `cifs` 等。\n\n`opts` 参数允许我们指定某些挂载选项，这些选项因随每个文件系统类型而异。\n\n## 演示\n\n让我们通过一个真实的\
