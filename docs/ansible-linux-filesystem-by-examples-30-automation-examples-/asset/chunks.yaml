    5 rpm/stable/x86_64\nenabled=1\ngpgcheck=1\ngpgkey=https://\ 6 dl.google.com/linux/linux_signing_key.pub"
    > /etc/yum.rep\ 7 os.d/google-chrome.repo'' 8   args: 9     creates: /etc/yum.repos.d/google-chrome.repo
    10   when: ansible_os_family == ''RedHat''


    CORRECT


    1 - name: Add repository into repo.d list 2   ansible.builtin.yum_repository:
    3     name: google-chrome 4     description: google-chrome repository 5     baseurl:
    http://dl.google.com/linux/chrome/rpm/stable\ 6 /x86_64 7     enabled: true 8
        gpgcheck: true 9     gpgkey: https://dl.google.com/linux/linux_signing_key\
