    type as “local”, otherwise Ansible presume to use the default SSH connection.


    ## Recap


    Now you know more about Ansible INI and YAML inventory files, host and group variable.


    ## Playbook


    In this chapter, I’ll explain to you what is an Ansible Playbook and why do you
    need. We’ll cover how to start with a simple playbook, from the basic syntax and
    how to add more tasks.


    1 A playbook is a set of play to be executed against an inv\ 2 entory.


    ## YAML syntax


    1 # This is a YAML comment 2 some data # This is also a YAML comment 3 4 this
    is a string 5 ''this is another string'' 6 "this is yet another a string" 7 8
    with_newlines: | 9 Example Company 10 123 Main Street 11 New York, NY 10001 12
    13 without_newlines: > 14 This is an example 15 of a long string, 16 that will
    become 17 a single sentence. 18 19 yaml_dictionary: {name1: value1, name2: value2}
    20 21 yaml_list1: 22 - value1 23 - value2 24 yaml_list2: [value1, value2]


    Every playbook is based on YAML syntax so the file is easy and human readable.
    YAML is a text format and you could easy recognize by the presence of the three
    dash symbols at the beginning and three dots in the end. The three dots are not
    mandatory so a lot of people simply omit them. This file type is very sensitive
    to spacing between elements. It’s strictly important that elements of the same
    level are in the same indentation, despite some programming languages. You could
    use the symbol “#” for comments, even on the lines with some previous code. String
    are very important and you could specify directly or with single or double quote.
    I recommend you to use a double quote as a general rule. Using the pipe and major
    statement you could define multi-line strings. The first statement will keep the
    newlines, the second not. Others useful data structures are dictionaries and lists
    that you could see in action in the grayboard.


