    ## Introduction


    This book provides an introduction to the Ansible language.


    Ansible is a popular open source IT automation technology for scripting applications
    in a wide variety of domains.


    It is free, portable, powerful, and remarkably easy and fun to use.


    This book is a tool to learn the Ansible automation technology with some real-life
    examples.


    Whenever you are new to automation or a profession automation engineer, this book’s
    goal is to bring you quickly up to speed on the fundamentals of the core Ansible
    language.


    Every successful IT department needs automation nowadays for bare metal servers,
    virtual machines, cloud providers, containers, and edge computing. Automate your
    IT journey with Ansible automation technology.


    I’m going to teach you example by example how to accomplish the most common System
    Administrator tasks.


    You are going to start with the installation of Ansible in Red Hat Enterprise
    Linux, Ubuntu, and macOS using the most command package manager and archives.


    Each of the 100+ lessons summarizes a module: from the most important parameter
    to some live demo of code and real-life usage. Each code is battle proved in the
    real life. Console interaction and verification are included in every video. A
    mundane activity like creating a text file, extracting and archiving, fetching
    a repository using HTTPS or SSH connections could be automated with some lines
    of code and these are only some of the long lists included in the course.


    There are some Ansible codes usable in all the Linux systems, some specific for
    RedHat-like, Debian-like, and Windows systems.


    The 20+ Ansible troubleshooting lesson teaches you how to read the error message,
    how to reproduce, and the process of troubleshooting and resolution.


    Are you ready to automate your day with Ansible?


