    ## Concatenate multiple files in a specific order - Ansible module template and
    YAML


    How to automate the concatenation of multiple files using a list in the YAML and
    Ansible module template with Jinja2.


    ## Concatenate multiple files in a specific order


    ansible.builtin.template


    Template a file out to a target host


    ansible_managed, template_host, template_uid, template_path, template_fullpath,
    template_destpath, and template_run_date


    Let’s talk about the template module. The full name is `ansible.builtin.template`,
    it’s part of `ansible-core` and is included in all Ansible installations. It templates
    a file out to a target host. Templates are processed by the Jinja2 templating
    language.


    It supports a large variety of Operating Systems. For basic text formatting, use
    the `ansible.builtin.copy` module or for empty file `ansible.builtin.file` module.
    For Windows, use the `ansible.windows.win_template` module instead.


    ## Parameters


    src path - template (`templates/`)


    dest path - target location


    validate string - validation command before (`%s`)


    backup boolean - no/yes


    mode/owner/group - permission


    setype/seuser/selevel - SELinux


    Let me highlight the most useful parameters for the template module. The only
    required parameters are `src` and `dest`. The `src` parameter specifies the template
    file name. Templates usually are stored under `templates` directories with the
    `.j2` file extension. The `dest` parameter specifies the path where to render
    the template on the remote machine.

