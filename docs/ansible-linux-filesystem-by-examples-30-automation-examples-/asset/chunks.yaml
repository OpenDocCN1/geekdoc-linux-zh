- fmt: "\nIf the `backup` parameter is enabled, Ansible creates a backup file including\
    \ the timestamp information before copying it to the destination.\n\nLet me also\
    \ highlight that we could also specify the permissions and SELinux properties.\n\
    \n## demo\n\nHow to concatenate multiple files in a specific order with the Ansible\
    \ module template and YAML.\n\ncode\n\n```\na.txt\n1 A content\n\nb.txt\n1 B content\n\
    ```\n\nincludes.yaml\n```yaml\ninput-files: \n  - concatenate/b.txt\n  - concatenate/a.txt\n\
    ```\n\nconcatenate.yml\n```yaml\n---\n- name: concatenate demo\n  hosts: \"{{\
    \ HOSTS }}\"\n  become: false\n  gather_facts: true\n  vars:\n    myinput: \"\
    concatenate/includes.yaml\"\n    myoutput: \"concatenate/output.txt\"\n  tasks:\n\
    \    - name: include file list\n      include_vars:\n        file: \"{{ myinput\
    \ }}\"\n        name: files\n\n    - name: concatenate\n      ansible.builtin.template:\n\
    \        src: templates/concatenate.j2\n        dest: \"{{ myoutput }}\"\n```\n\
    \nconcatenate.j2\n```jinja2\n{% for i in files[\"input-files\"] %}\n{{ lookup('file',\
    \ i) }}\n{% endfor %}\n```\n\nexecution\n\n```bash\nansible-pilot $ ansible-playbook\
    \ -e \"HOSTS=localhost\" concatenate.yml\n[WARNING]: No inventory was parsed,\
    \ only implicit localhost is available\n[WARNING]: provided hosts list is empty,\
    \ only localhost is available. Note that the implicit localhost does not match\
    \ 'all'\nPLAY [concatenate demo] ************************************************\n\
    ******************************************\nTASK [Gathering Facts] *********************************\n\
    ******************************************\nok: [localhost]\nTASK [include file\
    \ list] ********************************\n******************************************\n\
    ok: [localhost]\nTASK [concatenate] *************************************\n******************************************\n\
    changed: [localhost]\nPLAY RECAP **********************************************\n\
    ******************************************\nlocalhost                  ok=3  \
    \  changed=1    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n\
