    \ Feb  1 15:40 .\ndrwxr-xr-x  9 lberton staff  288 Feb  1 15:08 ..\n-rw-r--r--\
    \  1 lberton staff    9 Feb  1 15:18 a.txt\n-rw-r--r--  1 lberton staff    9 Feb\
    \  1 15:18 b.txt\n-rw-r--r--  1 lberton staff   56 Feb  1 15:48 includes.yaml\n\
    ansible-pilot $ cat concatenate/a.txt\nA content%\nansible-pilot $ cat concatenate/b.txt\n\
    B content%\nansible-pilot $ cat concatenate/includes.yaml\ninput-files: \n  -\
    \ concatenate/b.txt\n  - concatenate/a.txt\n```\n\nafter execution\n```bash\n\
    ansible-pilot $ ls -al concatenate\ntotal 24\ndrwxr-xr-x  5 lberton staff  160\
    \ Feb  1 15:40 .\ndrwxr-xr-x  9 lberton staff  288 Feb  1 15:08 ..\n-rw-r--r--\
    \  1 lberton staff    9 Feb  1 15:18 a.txt\n-rw-r--r--  1 lberton staff    9 Feb\
    \  1 15:18 b.txt\n-rw-r--r--  1 lberton staff   56 Feb  1 15:48 includes.yaml\n\
    ansible-pilot $ cat concatenate/a.txt\nA content%\nansible-pilot $ cat concatenate/b.txt\n\
    B content%\nansible-pilot $ cat concatenate/includes.yaml\ninput-files: \n  -\
    \ concatenate/b.txt\n  - concatenate/a.txt\n```\n\n## 使用 Rsync  - 本地到远程\n\n如何使用\
    \ synchronize 模块通过 rsync 工具在 Linux 上同步某些目录树。\n\n```yaml\n---\n- name: synchronize\
    \ module demo\n  hosts: all\n  become: false\n  vars:\n    source: '~/prj/github/ansible-pilot/copy\
    \ files to remote hosts/examples'\n    destination: 'example-backup'\n  tasks:\n\
    \    - name: rsync installed\n      ansible.builtin.package:\n        name: rsync\n\
    \        state: present\n      become: true\n    - name: data synchronization\n\
    \      ansible.posix.synchronize:\n        src: '{{ source }}'\n        dest:\
    \ '{{ destination }}'\n```\n\n## Ansible 使用 rsync\n\n`ansible.posix.synchronize`\
    \ 是 `rsync` 的一个封装，用于简化 playbook 中的常用任务。它是 POSIX 集合的一部分。\n\n## 主要参数\n\n- `src`:\
    \ string - 源路径或相对路径\n- `dest`: string - 目标路径或相对路径\n- `archive`: boolean - 镜像 Rsync\
    \ 标志，启用递归、链接、权限、时间、所有者、组以及 `-D`\n- `rsync_opts`: string - 无\n\n参数列表很长，但这些是 synchronize\
    \ 的重要选项。`src` 和 `dest` 是强制性的。`src` 参数是必需的，指定了要同步到目标主机的源。路径可以是绝对路径或相对路径。`dest`\
    \ 参数也是，指定了从源主机同步到目标主机的路径。根据需求可以是本地或远程。最有用的参数是 `archive`，它默认启用，因此在大多数情况下不需要指定任何内容。请参阅手册以启用/禁用某些特定设置。\n\
    \n可以通过 `rsync_opts` 参数指定更多 Rsync 参数。\n\n"
