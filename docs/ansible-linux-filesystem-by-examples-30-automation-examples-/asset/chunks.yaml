    ## Recap


    Now you know more about the Ansible internal variables ansible_hostname, inventory_hostname
    and ansible_fqdn.


    You know how to use it based on your use case in your Ansible Playbook or Ansible
    Templates.


    ## Three options to Safely Limit Ansible Playbooks Execution to a Single Machine


    Three options to limit the execution of a potentially harmful Ansible Playbook
    to only one host.


    ## Limit Ansible Playbook to only one HOSTNAME


    use --limit at runtime


    hosts: HOSTNAME Ansible Playbook


    hosts: "{{ HOSTS }}" Ansible Playbook


    Let’s deep dive into our use case to Limit Ansible Playbook to only one HOSTNAME.


    I’m going to show three different ways to achieve this result:


    using the --limit parameter at runtime, limit the HOSTNAME in the Playbook code
    and the most advanced way is to define a variable in the Ansible Playbook that
    you could populate on-demand.


    Let’s discuss the pros and cons of each option.


    ## demo


    In the following demo scenarios, I’d like to execute my harmful Ansible Playbook
    ONLY against demo.example.com host.


    This is my demo inventory file:


    1 [linux] 2 demo.example.com 3 demo2.example.com 4 5 [all:vars] 6 ansible_connection=ssh
    7 ansible_user=devops 8 ansible_ssh_private_key_file=~/.ssh/id_rsa


    ## Ansible command limit option


    --limit


    ansible-playbook - limit HOSTNAME PLAYBOOK


    Using the --limit parameter of the ansible-playbook command is the easiest option
    to limit the execution of the code to only one host.


    The advantage is that you don’t need to edit the Ansible Playbook code before
    executing to only one host.


    The drawback is that you should remember every time you execute the command and
    sometimes humans are not so reliable.


    code


