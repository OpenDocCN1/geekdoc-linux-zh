- fmt: "\nNot every role will have all of these directories.\n\n## Using Ansible roles\
    \ in a playbook\n\n`./role_simple.yml`\n\n```yaml\n---\n- name: role example\n\
    \  hosts: all\n  roles:\n    - role1\n    - role2\n```\n1 file name: `role_simple.yml`\
    \ Apply the `role1` and `role2` to the `all` managed hosts.\n\n`./role_vars.yml`\n\
    \n```yaml\n---\n- name: role example\n  hosts: all\n  roles:\n    - role: role1\n\
    \    - role: role2\n      var1: value\n      var2: value\n```\n1 file name: `role_vars.yml`\
    \ Apply the `role1` and `role2` to the `all` managed hosts. `Role2` has two variables\
    \ parameters.\n\n## Order of execution\n\n`./role_vars.yml`\n\n```yaml\n---\n\
    - name: order of execution example\n  hosts: all\n  pre_tasks:\n    - debug:\n\
    \        msg: 'pre-task'\n        notify: my handler\n  roles:\n    - role1\n\
    \  tasks:\n    - debug:\n        msg: 'first task'\n        notify: my handler\n\
    \  post_tasks:\n    - debug:\n        msg: 'post-task'\n        notify: my handler\n\
    \  handlers:\n    - name: my handler\n      debug:\n        msg: Running my handler\n\
    ```\n\nFor each play in a playbook, tasks execute as ordered in the `tasks` list.\
    \ After all tasks execute, any notified handlers are executed.\n\nWhen a role\
    \ is added to a play, role tasks are added to the beginning of the `tasks` list.\
    \ If a second role is included in a play, its tasks list is added after the first\
    \ role.\n\nRole handlers are added to plays in the same manner that role tasks\
    \ are added to plays. Each play defines a `handlers` list. Role handlers are added\
    \ to the `handlers` list first, followed by any handlers defined in the `handlers`\
    \ section of the play. In certain scenarios, it may be necessary to execute some\
