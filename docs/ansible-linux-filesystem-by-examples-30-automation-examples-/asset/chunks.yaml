    can be configured with a pre_tasks section. Any task listed in this section executes
    before any roles are executed. If any of these tasks notify a handler, those handler
    tasks execute before the roles or normal tasks.


    Plays also support a post_tasks keyword. These tasks execute after the play’s
    normal tasks, and any handlers they notify, are run.


