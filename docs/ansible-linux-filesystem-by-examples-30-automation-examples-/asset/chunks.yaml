    \ keyword. These tasks execute after the play’s normal tasks, and any handlers\
    \ they notify, are run.\n\n## Ansible Galaxy\n\n[https://galaxy.ansible.com/](https://galaxy.ansible.com/)\n\
    \n### Installing Roles from Ansible Galaxy manually\n\n```bash\n$ ansible-galaxy\
    \ install geerlingguy.redis -p roles/\n```\n\n### Installing Roles from Ansible\
    \ Galaxy requirements.yml\n\n`./requirements.yml`\n\n```yaml\n- src: geerlingguy.redis\n\
    \  version: \"1.5.0\"\n```\n\n```bash\n$ ansible-galaxy install -r roles/requirements.yml\
    \ -p roles\n```\n\n## Ansible Best Practices\n\nFollow the Ansible Best Practices\
    \ allows you to have a successful execution of your code, simplify the troubleshooting,\
    \ and impact positively on your automation journey.\n\n### Use whitespaces\n\n\
    Use spaces and not tabs for your YAML code. Adding a new line before each block\
    \ or task makes a playbook easy to read.\n\nFor example:\n\nWRONG\n```yaml\n---\n\
    - hosts: all\n  tasks:\n    - ansible.builtin.yum:\n        name: httpd\n    \
    \    state: latest\n    - name: end message\n      ansible.builtin.debug:\n  \
    \      msg: \"httpd succesfully installed\"\n```\n\nCORRECT\n```yaml\n---\n- hosts:\
    \ all\n  tasks:\n    - ansible.builtin.yum:\n        name: httpd\n        state:\
    \ latest\n\n  - name: end message\n      ansible.builtin.debug:\n        msg:\
    \ \"httpd succesfully installed\"\n```\n\n### Assign a “name” to every step\n\n\
    Always set the `name` parameter for every Ansible statements of your code: Ansible\
    \ Plays, Tasks, Blocks.\n\nFor example:\n\nWRONG\n```yaml\n---\n- hosts: all\n\
    \  tasks:\n    - ansible.builtin.yum:\n        name: httpd\n        state: latest\n\
    ```\n\nCORRECT\n```yaml\n---\n- name: install apache\n  hosts: all\n  tasks:\n\
    \    - name: install apache packages\n      ansible.builtin.yum:\n        name:\
    \ httpd\n        state: latest\n```\n\n### Use human-readable and meaningful names\
    \ for variables\n\nVariables are important to store parameters or save the result\
    \ of previous task. Using human-readable and meaningful names increases your code\
    \ reuse and readability between your team. It’s also easy to use the `ansible-playbook`\
    \ command `extra-vars` parameter to override a variable.\n\nFor example:\n\nWRONG\n\
    ```yaml\nkeepalive: 25\npo: 80\naaaa: 8080\n```\n\nCORRECT\n```yaml\napache_max_keepalive:\
    \ 25\napache_port: 80\n```\n\n### Use native YAML\n\nThe usage of native YAML\
    \ improves code readability and allows you to find faster easier mistakes. also\
    \ allows using some YAML linter and parser to validate.\n\nFor example:\n\nWRONG\n\
    ```yaml\n- name: install apache\n  ansible.builtin.yum: name={{ apache_version\
    \ }} state=present update_cache=yes disable_gpg_check=yes enablepo=apache\n  notify:\
    \ restart\n```\n\nCORRECT\n```yaml\n- name: install apache\n  ansible.builtin.yum:\n\
    \    name: {{ apache_version }}\n    state: present\n    update_cache: yes\n \
    \   disable_gpg_check: yes\n    enabled: apache\n  notify: restart\n```\n\n###\
    \ Use native modules against commands\n\nAlways prefer to use native modules to\
    \ command modules. Native modules are built for idempotency and have business\
    \ logic inside to validate parameters before execution. Commands (`command`, `shell`,\
    \ `raw`, and `script`) should be used as a last resort.\n\nFor example:\n\nWRONG\n\
    ```yaml\n- name: Add repository into repo.d list\n  become: true\n  ansible.builtin.shell:\
    \ 'echo -e \"[google-chrome]\\nname=google-chrome\\nbaseurl=http://dl.google.com/linux/chrome/rpm/stable/x86_64\\\
    nenabled=1\\ngpgcheck=1\\ngpgkey=https://dl.google.com/linux/linux_signing_key.pub\"\
    \ > /etc/yum.repos.d/google-chrome.repo'\n  args:\n    creates: /etc/yum.repos.d/google-chrome.repo\n\
    \  when: ansible_os_family == 'RedHat'\n```\n\nCORRECT\n```yaml\n- name: Add repository\
    \ into repo.d list\n  ansible.builtin.yum_repository:\n    name: google-chrome\n\
    \    description: google-chrome repository\n    baseurl: http://dl.google.com/linux/chrome/rpm/stable/x86_64\n\
    \    enabled: true\n    gpgcheck: true\n    gpgkey: https://dl.google.com/linux/linux_signing_key.pub\n\
    ```\n\n### Configure debug messages\n\nWhen developing Ansible code is very useful\
    \ to rely on `debug` tasks to display the content of a variable while your playbook\
    \ runs. However, could be considered annoying to read too much at the production\
    \ level. Set the `verbosity` parameter set to `2` allows you to see the messages\
    \ only when you want.\n\nFor example:\n\nWRONG\n```yaml\n- name: message output\n\
    \  ansible.builtin.debug:\n    msg: \"This text always displays\"\n```\n\nCORRECT\n\
    ```yaml\n- name: message output\n  ansible.builtin.debug:\n    msg: \"This text\
    \ displays with ansible-playbook -vv\"\n  verbosity: 2\n```\n\n### Execute your\
    \ task with less possible privilege\n\nThis is a piece of general advice for any\
    \ security best practice to execute a task with less possible privilege. In Ansible\
    \ you could implement specifying `become: true` at the task level and not for\
    \ all the playbook if not all the tasks need to execute as root/administrator\
    \ user.\n\nFor example:\n\nWRONG\n```yaml\n---\n- name: install apache\n  hosts:\
    \ all\n  become: true\n  tasks:\n    - name: message output\n      ansible.builtin.debug:\n\
