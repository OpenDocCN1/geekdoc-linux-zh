    1 --- 2 - hosts: all 3   tasks: 4   - ansible.builtin.yum: 5       name: httpd
    6       state: latest 7 8   - name: end message 9     ansible.builtin.debug: 10
          msg: "httpd succesfully installed"


    ## Assign a “name” to every step


    Always set the “name” parameter for every Ansible statements of your code: Ansible
    Plays, Tasks, Blocks.


    For example:


    WRONG


    1 --- 2 - hosts: all 3   tasks: 4   - ansible.builtin.yum: 5       name: httpd
    6       state: latest


