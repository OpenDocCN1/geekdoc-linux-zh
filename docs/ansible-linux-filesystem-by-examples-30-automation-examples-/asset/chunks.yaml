    ## Test host availability - Ansible module ping


    Let’s talk about Ansible module ping.


    The full name is ansible.builtin.ping, which means that is part of the collection
    of modules “builtin” with ansible and shipped with it.


    It’s a module pretty stable and out for years.


    It verify the ability of Ansible to login to the managed host and that there is
    a Python interpreter that is able to execute our code.


    So it’s pretty different for the ping in the network context.


    It’s the Linux corresponding to the Windows Ansible win_ping module.


    ## Main parameters and return values


    data string


    People usually don’t specify any parameters or use the return value.


    For the parameter, it’s possible to change the behavior from the default “pong”
    to the “crash” that raises an exception in case of failure.


    ping string


    The return value default is the “pong” string, but you could customize it with
    the data parameter.


