    your code, simplify the troubleshooting, and impact positively on your automation
    journey.


    ## Use whitespaces


    Use spaces and not tabs for your YAML code. Adding a new line before each block
    or task makes a playbook easy to read.


    For example:


    WRONG


    1 --- 2 - hosts: all 3   tasks: 4   - ansible.builtin.yum: 5       name: httpd
    6       state: latest 7   - name: end message 8     ansible.builtin.debug: 9  
        msg: "httpd succesfully installed"


