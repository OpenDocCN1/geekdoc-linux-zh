    ## Add Execute Permission 755 Linux file - Ansible module file


    How to automate the setting of execute permission 755 for `example.sh` Linux file
    with Ansible module `file`.


    Assigning executive permission 755 in Linux is a very frequent need of a System
    Administrator that you could automate with Ansible.


    ## Ansible Add Execute Permission


    `ansible.builtin.file`


    Manage files and file properties


    Today we’re talking about the Ansible module `file`.


    The full name is `ansible.builtin.file`, which means that is part of the collection
    of modules `builtin` with ansible and shipped with it.


    It’s a module pretty stable and out for years.


    It works in a different variety of operating systems.


    It manages files and file properties.


    For Windows targets, use the `ansible.windows.win_file` module instead.


    ## Main Parameters


    `path` string (dest, name) - file path


    `owner` string - user


    `group` string - group


    `mode` raw - Ex: ‘0644’ or ‘u=rw,g=r,o=r’


    `state` string - file/absent/directory/hard/link/touch


    `setype/seuser/selevel` - SELinux


    This module has some parameters to perform any tasks.


    The only required is `path`, where you specify the filesystem path of the file
    you’re going to edit.


    The parameter `owner` set the user that should own the file/directory.


    The parameter `group` set the group that should own the file/directory.


    The parameter `mode` set the permissions in the UNIX way of the file/directory.


    The `state` defines the type of object we are modifying, the default is `file`
    but we could handle also directories, hard links, symlinks, or only update the
    access time with the `touch` option.


    Let me also highlight that we could also specify the SELinux properties.


    ## Links


    [ansible.builtin.file](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/file_module.html)


    ## demo


    How to Add Execute Permission 755 file on Linux with Ansible Playbook.


    I’m going to show you how to set the `chmod +x` of an `example.sh` Linux file
    with Ansible.


    ```yaml

    file_permission.yml

    1 --- 2 - name: file module demo 3   hosts: all 4   vars: 5     myscript: "~/example.sh"
    6   tasks: 7     - name: set execution permission 8       ansible.builtin.file:
    9         dest: "{{ myscript }}" 10         mode: ''a+x''

    ```


    ```bash

    example.sh

    1 #!/bin/bash 2 echo "Hello World"

    ```


    ### execution


    ```bash

    ansible-pilot $ ansible-playbook -i virtualmachines/demo/\ 2 inventory file_management/file_permission.yml
    3 PLAY [file module demo] *********************************\ 4 ******************************************
    5 TASK [Gathering Facts] **********************************\ 6 ******************************************
    7 ok: [demo.example.com] 8 TASK [set execution permission] *************************\
    9 ****************************************** 10 changed: [demo.example.com] 11
    PLAY RECAP **********************************************\ 12 ******************************************
    13 demo.example.com          : ok=2    changed=1    unreach\ 14 able=0    failed=0    skipped=0    rescued=0    ignored=0
    15 ansible-pilot $

    ```


