  trans: "\n\n在接下来的示例中，我们将超越打印“Hello world!”文本的范畴，通过打印文本、变量、文本与变量，并向你演示如何使用详细程度级别（verbosity\
    \ level）。\n\n```yaml\n---\n- name: debug module demo 3\n  hosts: all\n  vars:\n\
    \    fruit: \"apple\"\n  tasks:\n    - name: debug message\n      ansible.builtin.debug:\n\
    \        msg: \"our fruit is {{ fruit }}\"\n        verbosity: 2\n```\n\n# Ansible\
    \ 代码复用：使用 Ansible Galaxy 中的 Roles 和 Collections\n\n在本章中，你将发现如何从 Ansible Galaxy\
    \ 远程目录下载并使用 Ansible Roles 和 Collection（（集合）。\n\n## 下载并使用 Ansible Galaxy Role -\
    \ ansible-galaxy 和 requirements.yml\n\n如何下载并使用 Ansible Role `lucab85.ansible_role_log4shell`\
    \ 来扫描我们的 Linux 机器，以检查 Log4Shell 远程代码执行 Log4j (CVE-2021–44228)，并复用在 Ansible Galaxy\
    \ 目录中发布的 Ansible 制品（任务、变量、默认值、处理器、模块和插件）。\n\n## 什么是 Ansible Role？\n\n-   可复用的\
    \ Ansible 制件\n-   一个角色包含任务、变量、默认值、处理器、模块或其他其它插件\n-   可以通过 Ansible Galaxy 轻松下载和共享\n\
    \nAnsible Role 是一组可复用的 Ansible 制件。它解决一个问题并包含所有相关的任务、变量、默认值、处理器、模块或其他插件。\n\n对于用户来说，Ansible\
    \ Role 容易通过 Ansible Galaxy 下载和共享。对于开发者来说，Ansible Role 容易通过 Ansible Galaxy 上传和共享。此外，Ansible\
    \ role 具有定义的标准目录结构和格式。\n\n## 什么是 Ansible Galaxy？\n\n[Ansible Galaxy](https://galaxy.ansible.com/)\n\
    \n[lucab85/ansible_role_log4shell](https://galaxy.ansible.com/lucab85/ansible_role_log4shell)\n\
    \n该网站可以通过 URL `https://galaxy.ansible.com/` 访问。搜索引擎、标签和平台让你轻松找到其中的任何内容。\n\n我建议你在将其用于系统之前，仔细评估其内容的质量。\n\
    \n质量指标通常包括代码质量保证、支持的操作系统和平台、文档、发布版本、是否存在变更日志（Changelog）、下载次数以及作者或创建。\n\n请注意，该网站包含了\
    \ Ansible Roles 和 Ansible Collections。今天我们关注的是 Ansible Role 内容。\n\n## 链接\n\n-\
    \   `https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse.html`\n\
    -   `https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse_roles.html#using-roles`\n\
    -   `https://galaxy.ansible.com/`\n-   `https://galaxy.ansible.com/lucab85/ansible_role_log4shell`\n\
    \n## demo\n\n让我们进入真实场景：如何下载并使用 Ansible Galaxy Role `lucab85.ansible_role_log4shell`。\n\
    \n### role.yml\n```yaml\n---\n- name: role demo\n  hosts: all\n  become: true\n\
    \  roles:\n    - role: lucab85.ansible_role_log4shell\n      detector_path: \"\
    /var/www\"\n```\n\n### requirements.yml\n```yaml\n---\nroles:\n  - name: lucab85.ansible_role_log4shell\n\
    ```\n\n### 下载前的执行\n```bash\n$ ansible-playbook -i virtualmachines/demo/inventory\
    \ galaxy/role.yml\nERROR! the role 'lucab85.ansible_role_log4shell' was not found\
    \ in /Users/lberton/prj/github/ansible-pilot/galaxy/roles:/Users/lberton/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:/Users/lberton/prj/github/ansible-pilot/galaxy\n\
    \n错误似乎出现在 '/Users/lberton/prj/github/ansible-pilot/galaxy/role.yml'：第 5 行，第 8\
    \ 列，但根据具体的语法问题，也可能在文件的其他位置。\n\n错误的行似乎是：\n\n  roles:\n    - role: lucab85.ansible_role_log4shell\n\
    \      ^ 这里\n```\n\n### 下载后的执行\n```bash\n$ ansible-galaxy install -r galaxy/requirements.yml\n\
    Starting galaxy role install process\n- downloading role 'ansible_role_log4shell',\
    \ owned by lucab85\n- downloading role from https://github.com/lucab85/ansible-role-log4shell/archive/v0.4.1.tar.gz\n\
    - extracting lucab85.ansible_role_log4shell to /Users/lberton/.ansible/roles/lucab85.ansible_role_log4shell\n\
