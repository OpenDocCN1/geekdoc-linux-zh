    \ or relative\n- `dest`: string - destination path or relative\n- `archive`: boolean\
    \ - mirrors the Rsync flag, enables recursive, links, perms, times, owner, group\
    \ flags, and `-D`\n- `rsync_opts`: string - no\n\nThe parameter list is wide but\
    \ these are the most important options of synchronize. The only mandatory parameters\
    \ are `src` and `dest`. The `src` parameter is mandatory and specifies the path\
    \ on the source host that will be synchronized to the destination. Path can be\
    \ absolute or relative. Same story for `dest` parameter that specifies the path\
    \ on the destination host that will be synchronized from the source. Paths could\
    \ be Local or Remote according to your needs. The most useful parameter is `archive`,\
    \ which is enabled by default so in the majority of use-cases you don’t need to\
    \ specify anything. Please refer to the manual to enable/disable some specific\
    \ settings.\n\nIt’s possible to specify more Rsync parameters via the `rsync_opts`\
    \ parameter.\n\n## Links\n\n- [rsync](https://en.wikipedia.org/wiki/Rsync)\n-\
    \ [ansible.posix.synchronize](https://docs.ansible.com/ansible/latest/collections/ansible/posix/synchronize_module.html)\n"
