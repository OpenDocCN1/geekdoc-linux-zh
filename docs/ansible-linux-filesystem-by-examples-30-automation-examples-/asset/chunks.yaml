    ## How to check if a directory exists in Ansible?


    How to verify if a directory exists with the Ansible module stat.


    The full name is ansible.builtin.stat, which means that is part of the collection
    of modules “builtin” with ansible and shipped with it.


    It’s a module pretty stable and out for years.


    It works in a different variety of operating systems.


    It retrieves a file entry or a file system status.


    For Windows target use the ansible.windows.win_stat module instead.


    ## Main parameters and return values


    path string


    The only mandatory parameter is “path” which is the filesystem full path of the
    object to check.


    stat complex


    The module returns a complex object, the property that is interesting for us is
    “isdir”. This attribute is “true” if the object is a directory.


    ## Demo


    Let’s jump in a real-life playbook to check if a directory exists with Ansible.


    code


    directory_check_exists.yml


    1 --- 2 - name: check if the directory exists 3   hosts: all 4   become: false
    5   vars: 6     directory: "/tmp" 7   tasks: 8     - name: Check if the directory
    exists 9       ansible.builtin.stat: 10         path: "{{ directory }}" 11    
      register: dir_to_check 12 13     - name: Directory found 14       ansible.builtin.debug:
    15         msg: "Directory {{ directory }} present" 16       when: dir_to_check.stat.isdir
    is defined and dir_to\ 17 _check.stat.isdir


    ## How to rename a file or directory using an Ansible task on a remote system?


    How to rename file/directory with Ansible.


    First of all let me demystify that I’d like to propose a solution using only Ansible
    native modules, so no shell module to invoke the Unix utility mv.


    Today we’re talking about Ansible two modules copy and file


    The full names are ansible.builtin.copy and ansible.builtin.file which means are
    part of the collection of modules “builtin” with ansible and shipped with it.


    Both are these modules are pretty stable and out for years.


    The purpose of the copy module is to copy files to remote locations.


    Once the file is successfully copied we could use the module file to delete the
    source file.


    ## Parameters


    Module copy


    dest path - destination


    src string - source


    remote_src boolean - no / yes


    Module file


    path string (dest, name) - file path


    state string - file/absent/directory/hard/link/touch


    The parameter list is pretty wide but I’ll summarize the most useful.


    The only required parameter is “dest” which specifies the destination path.


    The “src” specifies the source file presumed in the controller host. It could
    be a relative or absolute path.


    From version 2.0, in the copy module, you can use the “remote_src” parameter.


    If True it will search the file in the remote/target machine for the src.


    From version 2.8 copy module remote_src supports recursive copying.


    The only required is “path”, where you specify the filesystem path of the file
    you’re going to edit.


    The state defines the type of object we are modifying, the default is “file” but
    we could also handle directories, hardlink, symlink, or only update the access
    time with the “touch” option.


    For our use case, we are going to use the “absent” option.


    ## Demo


    Let’s jump in a real-life playbook to rename files or directories with Ansible


    code


    rename/file.yml


    1 --- 2 - name: rename file or directory 3   hosts: all 4   vars: 5     mysrc:
    "~/foo" 6     mydst: "~/bar" 7   tasks: 8     - name: Check if file exists 9  
        ansible.builtin.stat: 10         path: "{{ mysrc }}" 11       register: check_file_name
    12 - name: print debug 13       ansible.builtin.debug: 14         var: check_file_name
    15 - name: Copy file with new name 16       ansible.builtin.copy: 17         remote_src:
    true 18         src: "{{ mysrc }}" 19         dest: "{{ mydst }}" 20       when:
    check_file_name.stat.exists 21 - name: Remove old file 22       ansible.builtin.file:
    23         path: "{{ mysrc }}" 24         state: absent 25       when: check_file_name.stat.exists


