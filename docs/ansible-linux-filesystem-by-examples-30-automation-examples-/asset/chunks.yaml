    4\",\n            \"year\": \"2018\"\n        },\n        \"default_ipv4\": {\n\
    \            \"address\": \"REDACTED\",\n            \"alias\": \"eth0\"\n   \
    \     }\n    }\n}\n```\n\n这是 `facts_printall.yml` 执行后的输出。在执行中，play 是针对 `host1.example.com`\
    \ 运行的。输出包含了 Ansible 在 `Gathering Facts` 任务中自动获取的所有 facts。我鼓励你运行这段代码并熟悉 Ansible\
    \ Facts。\n\n### 引用一个 fact\n\nfacts_printone.yml\n```yaml\n---\n- name: facts_printone\n\
    \  hosts: all\n  tasks:\n    - name: Print a fact\n      ansible.builtin.debug:\n\
    \        var: \"{{ ansible_facts['ansible_architecture'] }}\"\n```\n\n你可以通过指定\
    \ fact 名称来方便地交互。在这个示例中，我们正在列出所有主机的架构。请根据需要自定义代码以匹配 ansible facts。\n\n## 魔法变量\n\
    \n1 魔法变量是与 Ansible 相关的变量。\n\n与系统相关的变量被称为 facts。通过 facts，你可以将一个系统的行为或状态作为其他系统的配置。\n\
    \n常见的魔法变量\n\nhostvars\n\ngroups\n\ngroup_names\n\ninventory_hostname\n\nansible_version\n\
    \n常见的魔法变量有 `hostvars`、`groups`、`group_names`、`inventory_hostname` 和 `ansible_version`。通过\
    \ `hostvars` 魔法变量，你可以访问为 play 中任何主机定义的变量。当你需要从一个主机访问另一个主机的属性时，这非常有用。`groups` 魔法变量列出了清单中所有的组。你可以结合使用\
    \ `groups` 和 `hostvars` 魔法变量来列出组内所有主机的 IP 地址。`group_names` 是主机所属组的列表。`inventory_hostname`\
    \ 魔法变量包含清单中配置的主机名称。`ansible_version` 魔法变量包含关于 Ansible 的版本信息。\n\n"
- fmt: "\nIn this module, we are going to talk about how to store in a secure way\
    \ encrypted any sensitive data such as passwords or API keys using `Ansible Vault`.\n\
    \n`Ansible Vault` encrypts variables and files to protect sensitive content and\
    \ let you use in playbooks or roles. Ansible Vault stores variables and files\
    \ in an encrypted way and let you use in playbooks or roles. The cipher used to\
    \ protect files is `AES 256` in recent versions of Ansible.\n\n## Creating an\
    \ encrypted file\n\nTo create a new encrypted file, use the `ansible-vault create\
    \ filename` command. The command prompts for the new vault password and then opens\
    \ a file using the default editor. In this example the password used is `password`\
    \ but I strongly encourage you to use one more secure as possible.\n\n```\n$ ansible-vault\
    \ create secret.yml\nNew Vault password: password\nConfirm New Vault password:\
    \ password\n$ ansible-vault create --vault-password-file=vault-password.txt secret1.yml\n\
    ```\n\n## Viewing an encrypted file\n\nYou can use the `ansible-vault view filename`\
    \ command to view an Ansible Vault-encrypted file without opening it for editing.\n\
    \n```\n$ ansible-vault view secret1.yml\nVault password: password\nINFERNO. I.\n\
    Nel mezzo del cammin di nostra vita\nmi ritrovai per una selva oscura\nché la\
    \ diritta via era smarrita.\nAhi quanto a dir qual era è cosa dura\nesta selva\
    \ selvaggia e aspra e forte\nche nel pensier rinova la paura!\nTant'è amara che\
    \ poco è più morte;\nma per trattar del ben ch'i' vi trovai,\ndirò de l'altre\
    \ cose ch'i' v'ho scorte.\n```\n\n## Editing an existing encrypted file\n\nTo\
    \ edit an existing encrypted file, Ansible Vault provides the `ansible-vault edit\
    \ filename` command. This command decrypts the file to a temporary file and allows\
    \ you to edit it. When saved, it copies the content and removes the temporary\
    \ file.\n\n```\n$ ansible-vault edit secret.yml\nVault password: password\n```\n\
    \n## Encrypting an existing file\n\nTo encrypt a file that already exists, use\
    \ the `ansible-vault encrypt filename` command. The `--output` option save the\
    \ encrypted file with a new name. If you omit this option the original file will\
    \ be overwritten with the encrypted one.\n\n```\n$ ansible-vault encrypt cleartext1.yml\
    \ --output=vault1.yml\nNew Vault password: password\nConfirm New Vault password:\
    \ password\nEncryption successful\n```\n\n## Decrypting an existing file\n\nAn\
    \ existing encrypted file can be permanently decrypted by using the `ansible-vault\
    \ decrypt filename` command. When decrypting a single file, you can use the `--output`\
    \ option to save the decrypted file under a different name.\n\n```\n$ ansible-vault\
    \ decrypt vault1.yml --output=decrypted.yml\nVault password: password\nDecryption\
    \ successful\n```\n\n## Changing password of an encrypted file\n\nYou can use\
    \ the `ansible-vault rekey filename` command to change the password of an encrypted\
    \ file. This command can rekey multiple data files at once. It prompts for the\
    \ original password and then the new password.\n\n```\n$ ansible-vault rekey secret.yml\n\
    Vault password: password1\nNew Vault password: password\nConfirm New Vault password:\
    \ password\nRekey successful\n```\n\n## Playbooks and Ansible Vault\n\nTo run\
    \ a playbook that accesses files encrypted with Ansible Vault, you need to provide\
    \ the encryption password to the `ansible-playbook` command. If you do not provide\
    \ the password, the playbook returns an error. To provide the vault password to\
    \ the playbook, use the `--vault-id` option. For example, to provide the vault\
    \ password interactively, use `--vault-id @prompt` as illustrated. Alternatively\
    \ you could use a password file.\n\n```\n$ ansible-playbook playbook.yml\nTASK\
    \ [include_vars] *************************************\n********************************fatal:\
    \ [localhost]: FAIL\nED! => {\"ansible_facts\": {}, \"ansible_included_var_files\"\
    : [], \"changed\": false, \"message\": \"Attempting to decrypt but no vault secrets\
    \ found\"}\n\n$ ansible-playbook --vault-id @prompt playbook.yml\nVault password\
    \ (default): password\n\n$ ansible-playbook --vault-password-file=vault-password.txt\
    \ playbook.yml\n```\n\n## Recap\n\nIn this module we explored the Ansible Vault\
    \ security storage to save secrets and confidential information inside Ansible.\
    \ As we saw this tools are robust and completely integrated inside Ansible Technology.\n\
    \n## Conditional\n\nIn this module, I’ll explain to you what are Ansible conditionals\
    \ operations and how you could use every day in your Ansible Playbook.\n\nConditional\
    \ statement check a condition and change the behavior of the program accordingly.\n\
    \nLet’s start! In order to write useful code, we almost always need the ability\
    \ to check conditions and change the behavior of the program accordingly. Conditional\
    \ statements give us this ability. The Ansible form is the `when` statement. Ansible\
    \ uses `Jinja2` tests and filters in conditionals. Ansible supports all the standard\
    \ tests and filters, and adds some unique ones as well.\n\n### Basic conditionals\
    \ with “when”\n\n`conditional_basic_false.yml`\n\n```yaml\n---\n- name: conditional_basic\n\
    \  hosts: all\n  vars:\n    configure_nginx: false\n  tasks:\n    - name: reload\
    \ nginx\n      ansible.builtin.service:\n        name: nginx\n      when: configure_nginx\n\
    ```\n\nThis is the basic usage of `when` statement in your Ansible playbook. The\
    \ task `reload nginx` is going to be executed only when the `configure_nginx`\
    \ variable is set to `true`. In this example we expect this task to be skipped.\
    \ Let’s see the output.\n\nExecution:\n```\n$ ansible-playbook -i inventory conditional_basic_false.yml\n\
    PLAY [conditional_basic] *************************************\nTASK [Gathering\
    \ Facts] *************************************\nok: [host1.example.com]\n\nTASK\
    \ [reload nginx] *************************************\nskipping: [host1.example.com]\n\
    \nPLAY RECAP *************************************************\nhost1.example.com\
    \    : ok=1  changed=0  unreachable=0  failed=0  skipped=1  ignored=0\n```\n\n\
    This is the output of `conditional_basic_false.yml`. In this execution the play\
    \ is executed against the `host1.example.com` node. The output is highlighted\
    \ with green and blue colors. As you could see the task `reload nginx` is read\
    \ by Ansible but skipped based on our conditional.\n\n`conditional_basic_true.yml`\n\
    \n```yaml\n---\n- name: conditional_basic\n  hosts: all\n  vars:\n    configure_nginx:\
    \ true\n  tasks:\n    - name: reload nginx\n      ansible.builtin.service:\n \
    \       name: nginx\n      when: configure_nginx\n```\n\nThis is the same basic\
    \ example of `when` statement in your Ansible playbook but we changed the variable\
    \ value from `false` to `true`. The task `reload nginx` is now going to be executed\
    \ because the `configure_nginx` boolean variable is set to `true`. Let’s see the\
    \ output of this code execution.\n\nExecution:\n```\n$ ansible-playbook -i inventory\
    \ conditional_basic_true.yml\nPLAY [conditional_basic] *************************************\n\
    TASK [Gathering Facts] *************************************\nok: [host1.example.com]\n\
    \nTASK [reload nginx] *************************************\nok: [host1.example.com]\n\
    \nPLAY RECAP *************************************************\nhost1.example.com\
    \    : ok=2  changed=0  unreachable=0  failed=0  skipped=0  ignored=0\n```\n"
