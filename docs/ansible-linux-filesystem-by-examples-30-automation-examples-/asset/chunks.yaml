- fmt: "\nOn the 16th of October 2015 Red Hat acquired Ansible Inc., and evaluate\
    \ Ansible as a “powerful IT automation solutions” designed to help enterprises\
    \ move toward friction less IT.\n\nAnsibleFest is an annual conference of the\
    \ Ansible community of users, contributors since 2016 in London and the USA.\n\
    \n# Ansible & Ansible Tower & Ansible Automation Platform\n\n### Ansible\nCommunity\
    \ driven project fast-moving innovations Open Source but only command line tools.\n\
    \n### Red Hat Ansible Tower / Ansible Automation Platform\nIt is a framework designed\
    \ by RedHat. It provides a web UI to manage your infrastructure.\n\nAnsible is\
    \ a community-driven project with fast-moving innovations Open Source but only\
    \ command-line tools.\n\nEnterprise needs more services and some stable releases.\
    \ For example, they need an SLA for support. Red Hat offers this service to companies\
    \ namely under the Ansible Tower umbrella, now re branded as Ansible Automation\
    \ Platform.\n\nAnsible Tower is a REST API, web service, and web-based console\
    \ designed to make Ansible more usable for IT teams with members of different\
    \ technical proficiency and skill-sets. It is a hub for automation tasks. The\
    \ tower is a commercial product supported by Red Hat Inc. but derived from AWX\
    \ upstream project, which is open source since September 2017.\n\nRed Hat maintains\
    \ also Ansible Engine. With Ansible Engine, organizations can access the tools\
    \ and innovations available from the underlying Ansible technology in a hardened,\
    \ enterprise-grade manner. Ansible Engine is developed by Red Hat with the explicit\
    \ intent of being used as an enterprise IT platform.\n\n# Getting Started\nIn\
    \ this chapter, I’ll explain you how to move the firsts steps with Ansible technology.\
    \ How to connect to the managed hosts and how to execute some simple tasks using\
    \ the command line.\n\n# Ansible architecture\nLet’s Begin a talking about Ansible\
    \ architecture. The node where Ansible is actually installed is called “control\
    \ node” and it manages all your fleet of nodes. The controlled node on the other\
    \ hand is called “managed node”. The target nodes could be Linux, Mac, Windows\
    \ and several network equipment. Each target has some specificity like different\
    \ Linux distribution and module usage. We will discuss of the specificity the\
    \ in the next sections.\n\n# Connection with managed nodes\nThe connection between\
    \ “control node” and “managed nodes” is managed by SSH protocol without any requirement\
    \ of specific client on the target machine. Other competitor require a client\
    \ software often called “agent”. With SSH connection the only requirements are\
    \ a username and a certificate to access the target machine. There are some way\
    \ to automate also this first script step. After completing SSH connection another\
    \ requirement is `python` interpreter, witch come out-of-the-box for modern operating\
    \ systems. By default Ansible uses SFTP to transfer files but you could switch\
    \ to SCP in configuration. The Windows target could be connected using WinRM technology\
    \ and uses PowerShell as interpreter.\n\n# Create a basic inventory\n`/etc/ansible/hosts`\n\
    \n```\nhost1.example.com\n```\ndefault inventory file `/etc/ansible/hosts`\n\n\
    `host1.example.com` is a managed host.\n\nThe list of managed hosts is stored\
    \ in `/etc/ansible/hosts`. In this example it contain only one host named `host1.example.com`.\n\
    \n# Run your first Ansible command\n```\n$ ansible all -m ping 2 host1.example.org\
    \ | SUCCESS => { 3     \"ansible_facts\": { 4         \"discovered_interpreter_python\"\
    : \"/usr/bin/python\" 5     }, 6     \"changed\": false, 7     \"ping\": \"pong\"\
    \ 8 }\n```\n`ping` module executed on `all` hosts.\n\n`host1.example.com` replied\
    \ with a success code.\n\nNow we’re ready to run your first Ansible command. The\
    \ Ansible command is called module in Ansible slang. The first line executed Ansible\
    \ `ping` module on all hosts. The response is a pong. Please note that this means\
    \ that Ansible is able to connect with SSH username, identify using public key\
    \ and execute the local python executer. So it’s completely different from any\
    \ ping in networking.\n\n# Run ad-hoc command on Ansible\n```\n$ ansible all -a\
    \ “/bin/echo hello” 2 host1.example.org | CHANGED | rc=0 >> 3 hello\n```\n`/bin/echo\
    \ hello` command executed on `all` hosts.\n\n`host1.example.com` replied with\
    \ a changed code and print `hello` on standard output.\n\nAnsible could also execute\
    \ some command on the target host and report the status on the console of “control\
    \ node”. In this example `/bin/echo hello` command was executed on `all` hosts.\
    \ `host1.example.com` replied with a changed code and print `hello` on standard\
    \ output. Please note that you would receive a “changed” state every time you\
    \ run a command on the remote machine.\n\n# Run ad-hoc command with privilege\
    \ escalation on Ansible\n```\n$ ansible all -m ping -u devops --become 2 host1.example.org\
    \ | SUCCESS => { 3     \"ansible_facts\": { 4         \"discovered_interpreter_python\"\
    : \"/usr/bin/python\" 5     }, 6     \"changed\": false, 7     \"ping\": \"pong\"\
    \ 8 }\n```\n`ping` module executed on `all` host as user `root` after login with\
    \ user `devops`.\n\n`host1.example.com` replied with a changed code and print\
    \ `hello` on standard output.\n\nIn this example I run the `ping` module against\
    \ `all` host as user `root` after login with user `devops`. `host1.example.com`\
    \ replied with a changed code and print `hello` on standard output.\n\n# Recap\n\
    In this module we learned the basic concept of Ansible architecture, how to write\
    \ the list of managed hosts and how to execute some commands against it.\n\n#\
    \ Inventory\nIn this chapter, I’ll explain to you what is an inventory, why do\
    \ you need, the different types how to use it.\n\nAn list of multiple hosts managed\
    \ by Ansible is called `inventory`. It is fundamentally the set of nodes or hosts\
    \ at the same time, using `groups` or `patterns` to select.\n\n`all` keyword\n\
    The special keyword `all` includes all hosts of the inventory. It will be very\
    \ useful in the following lessons. The only exception is `localhost` that you\
    \ need to specify.\n\n# Simple INI inventory\n`./ini_simple_inventory`\n\n```\n\
    host1.example.com\n\n[webservers]\ntwo.example.com\nthree.example.com\n```\nfile\
    \ name: `ini_simple_inventory`\n\n`host1.example.com` is ungrouped.\n\nThe simplest\
    \ inventory type is the INI inventory, by the type of the file. The default location\
    \ is `/etc/ansible/hosts` but you could use your customized with `-i` parameter.\
    \ In this example host `host1.example.com` is ungrouped and `two.example.com`\
    \ and `three.example.com` are grouped as `webserver`.\n\n# Simple YAML inventory\n\
    `simple_yaml_inventory.yml`\n\n```yaml\n---\nall:\n  hosts:\n    one.example.com:\n\
    \  children:\n    webservers:\n      hosts:\n        two.example.com:\n      \
    \  three.example.com\n```\nfile name: `inventory.yml`\n\n`one.example.com` is\
    \ ungrouped.\n\n`two.example.com` and `three.example.com` are grouped as `webserver`.\n\
    \nYou could express the same inventory using YAML syntax. In this example is the\
    \ same as the INI example.\n\n# Add ranges of hosts\n`./ini_range_inventory`\n\
    \n```\n[webservers]\nwww[01:99].example.com\n\n[databases]\ndb-[a-f].example.com\n\
    ```\n`webservers` group contains all hosts from `www01.example.com` to `www99.example.com`.\n\
    \n`Databases` group contains all hosts from `db-a.example.com` to `db-f.example.com`,\n"
