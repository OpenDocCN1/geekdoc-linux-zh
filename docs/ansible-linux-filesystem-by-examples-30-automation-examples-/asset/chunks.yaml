    1 --- 2 - name: install apache 3   hosts: all 4   tasks: 5     - name: install
    apache packages 6       ansible.builtin.yum: 7         name: httpd 8         state:
    latest


    ## Use human-readable and meaningful names for variables


    Variables are very important to store parameters or save the result of a previous
    task.


    Using human-readable and meaningful names increases your code reuse and readability
    between your team.


    It’s also easy to use the “ansible-playbook” command “–extra-vars” extra variable
    parameter to override a variable at execution.


    For example:


    WRONG


    1 httpkeepalive: 25 2 webpo: 80 3 aaaa: 8080


    CORRECT


    1 apache_max_keepalive: 25 2 apache_port: 80 3 tomcat_port: 8080


    ## Use native YAML


    The usage of native YAML improves code readability and allows you to find faster
    and easier the mistakes. It also allows using some YAML linter and parser to validate.


    For example:


    WRONG


    1 - name: install apache 2   ansible.builtin.yum: 3     name: apache-{{ apache_version
    }} state=present updat\ 4 e_cache=yes disable_gpg_check=yes enablerepo=apache
    5   notify: restart apache


    CORRECT


    1 - name: install apache 2   ansible.builtin.yum: apache-{{ apache_version }}
    3     state: present 4     update_cache: yes 5     disable_gpg_check: yes 6  
      enablerepo: apache 7   notify: restart apache


    ## Use native modules against run commands


    Always prefer to use native modules to command modules.


    Native modules are built for idempotency and have business logic inside to validate
    parameters before execution.


    Commands module (“command”, “shell”, “raw”, and “script”) are great should be
