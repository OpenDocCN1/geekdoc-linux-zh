- fmt: "\nPlease notice that the website contains `Ansible Roles` and `Ansible Collections`.\
    \ Today we’re focusing on `Ansible Role` content.\n\n## Links\n\n- [Ansible Collections\
    \ list](https://github.com/ansible-collections)\n- [Ansible Collections Developer\
    \ Guide](https://docs.ansible.com/ansible/latest/dev_guide/developing_collections.html)\n\
    - [Ansible Collections migrating roles](https://docs.ansible.com/ansible/latest/dev_guide/migrating_roles.html)\n\
    - [community.general collection](https://docs.ansible.com/ansible/latest/collections/community/general/)\n\
    \n## demo\n\nLet’s jump into a real-life \"How to Download and Use the Ansible\
    \ Galaxy Collection\" `community.general` in a system with `ansible-core` installed.\n\
    \n### code\n\n**collection.yml**\n```yaml\n---\n- name: modprobe module demo\n\
    \  hosts: localhost\n  become: true\n  vars:\n    module_name: \"dummy\"\n   \
    \ ansible_connection: local\n  tasks:\n    - name: load the module\n      community.general.modprobe:\n\
    \        name: \"{{ module_name }}\"\n        state: present\n```\n\n**requirements.yml**\n\
    ```yaml\n---\ncollections:\n  - name: community.general\n    source: https://galaxy.ansible.com\n\
    ```\n\n### execution without collection installed\n\n```bash\n$ ansible-playbook\
    \ collection/collection.yml\n[WARNING]: provided hosts list is empty, only localhost\
    \ is available. Note that the implicit localhost does not match 'all'\nERROR!\
    \ couldn't resolve module/action 'community.general.modprobe'. This often indicates\
    \ a misspelling, missing collection, or incorrect module path.\n\nThe error appears\
    \ to be in '/home/devops/collection/collection.yml': line 10, column 7, but may\
    \ be elsewhere in the file depending on the exact syntax problem.\n\nThe offending\
    \ line appears to be:\n\n  tasks:\n    - name: load the module\n      ^ here\n\
    $\n```\n\n### download execution\n\n```bash\n$ ansible-galaxy install -r collection/requirements.yml\n\
    Starting galaxy collection install process\nProcess install dependency map\nStarting\
    \ collection install process\nDownloading https://galaxy.ansible.com/download/community-general-4.5.0.tar.gz\
    \ to /home/devops/.ansible/tmp/ansible-local-24543cs6dck7/tmpaccd0umv/community-general-4.5.0-5msjuuoa\n\
    Installing 'community.general:4.5.0' to '/home/devops/.ansible/collections/ansible_collections/community/general'\n\
    community.general:4.5.0 was installed successfully\n```\n\n### list installed\
    \ collection\n\n```bash\n$ ansible-galaxy collection list\n# /home/devops/.ansible/collections/ansible_collections\n\
    Collection        Version\n----------------- -------\ncommunity.general 4.5.0\n\
    $\n```\n\n### execution with collection installed\n\n```bash\n$ ansible-playbook\
    \ collection/collection.yml\n[WARNING]: provided hosts list is empty, only localhost\
    \ is available. Note that the implicit localhost does not match 'all'\n\nPLAY\
    \ [modprobe module demo] *****************************\n******************************************\n\
    \nTASK [Gathering Facts] *************************************\n******************************************\n\
    ok: [localhost]\n\nTASK [load the module] *************************************\n\
    ******************************************\nchanged: [localhost]\n\nPLAY RECAP\
    \ **********************************************\n******************************************\n\
    localhost                   : ok=2    changed=1    unreachable=0    failed=0 \
    \   skipped=0    rescued=0    ignored=0\n\n$\n```\n\n## Ansible for Linux Filesystem\n\
    \nHow to automate the interaction with Linux filesystem with Ansible. For example:\
    \ file and directory creation, permission and delete.\n\n## Create an empty file\
    \ - Ansible module file\n\nHow to create an empty `~/example.txt` file or update\
    \ the time of an already create file.\n\n### Ansible create an empty file\n\n\
    Let’s talk about the Ansible module file. The full name is `ansible.builtin.file`,\
    \ which means that is part of the collection of modules “builtin” with ansible\
    \ and shipped with it.\n\nIt’s a module pretty stable and out for years. It works\
    \ in a different variety of operating systems. It manages files and file properties.\n\
    \nFor Windows targets, use the `ansible.windows.win_file` module instead.\n\n\
    ### Main Parameters\n\n- `path` string (dest, name) - file path\n- `state` string\
    \ - file/absent\n\nIt manages files and file properties. For Windows targets,\
    \ use the `ansible.windows.win_file` module instead.\n\n### demo\n\n**file.yml**\n\
    ```yaml\n---\n- name: modprobe module demo\n  hosts: localhost\n  become: true\n\
    \  vars:\n    module_name: \"dummy\"\n    ansible_connection: local\n  tasks:\n\
    \    - name: load the module\n      community.general.modprobe:\n        name:\
    \ \"{{ module_name }}\"\n        state: present\n```\n\n## Ansible create an empty\
    \ file\n\nHow to create an empty `~/example.txt` file or update the time of an\
