    ## Recap


    Conditionals are very important because they enable us to create Ansible Playbook
    that respond to some events, conditions or Ansible Facts. These statements are
    the foundation of the smart Ansible Playbook.


    ## Loop


    In this chapter, I’ll explain to you what are Ansible loop operations and how
    you could use every day in your Ansible Playbook.


    ### 1 Loop automate repetitive tasks


    Computers are great in automation of repetitive tasks. Repeating identical or
    similar tasks without making errors is something that computers do well and people
    do poorly.


    Repeated execution of a set of statements is called iteration. Ansible has several
    statements for iteration – the `loop` statement, and the `with_items` statements.
    The `with` statement relies on plugins.


    `loop_simple.yml`


    ```yaml

    1 ---

    2 - name: Check services

    3   hosts: all

    4   tasks:

    5   - name: httpd and mariadb are running

    6     ansible.builtin.service:

    7       name: "{{ item }}"

    8       state: started

    9     loop:

    10      - httpd

    11      - mariadb

    ```


    A simple loop iterates a task over a list of items. The `loop` statement is added
    to the task, and takes as a value the list of items over which the task should
    be iterated. The loop variable `item` iterates the current value during each iteration.


    `loop_hash_or_dict.yml`


    ```yaml

    1 ---

    2 - name: Users exist and are in the correct groups

    3   hosts: all

    4   tasks:

    5   - name: Users exist and are in the correct groups

    6     ansible.builtin.user:

    7       name: "{{ item.name }}"

    8       state: present

    9       groups: "{{ item.group }}"

    10     loop:

    11      - name: alice

    12        group: wheel

    13      - name: bob

    14        group: root

    ```


    The loop list does not need to be a list of simple values. In the following example,
    each item in the list is actually a hash or a dictionary. Each hash or dictionary
    in the example has two keys, `name` and `groups`, and the value of each key in
    the current item loop variable can be retrieved with the `item.name` and `item.group`
    variables, respectively.


    ## with_* statement


    ### `with_items`


    Like `loop` for simple lists, list of strings or a list of hashes/dictionaries.


    ### Flatter to list if lists of lists are provided


    ### `with_file`


    This keyword requires a list of control node file names. The loop variable `item`
    holds the content of the file.


    ### `with_sequence`


    requires parameters to generate a list of values based on a numeric sequence.


    ## `loop_with_items.yml`


    ```yaml

    1 ---

    2 - name: Example with_items

    3   hosts: all

    4   vars:

    5     data:

    6       - alice

    7       - bob

    8   tasks:

    9   - name: Print values of

    10    ansible.builtin.debug:

    11      msg: "{{ item }}"

    12    with_items: data

    ```


    In the `loop_with_items.yml` playbook the `data` is a list of strings.


    ## Recap


    Conditionals are very important because they enable us to create Ansible Playbook
    that respond to some events, conditions or Ansible Facts.


    ## Handler


    In this chapter, I’ll explain to you what are Ansible loop operations and how
    you could use every day in your Ansible Playbook.


    ### Handler run operations on change


    Handlers are very important because they allow you to execute some steps only
    if necessary.


    ## `rollingupdate.yml`


    ```yaml

    1 ---

    2 - name: Rolling update

    3   hosts: all

    4   become: true

    5   tasks:

    6   - name: latest httpd package is installed

    7     ansible.builtin.yum:

    8       name: httpd

    9       state: latest

    10 handlers:

    11  - name: restart apache

    12    ansible.builtin.service:

    13      name: httpd

    14      state: restarted

    ```


    The `rollingupdate.yml` is composed of one task and one handler. The handler code
    is executed if necessary. Please note the `notify` statement mention the name
    of the handler.


    ## Role


    Role enable code reuse to Ansible


    Roles are like functions in traditional programming world. Use Ansible roles to
    develop playbooks more quickly and to reuse code.


    ## Role tree directories


    ```text

    1 $ tree user.example

    2 user.example/

    3 ├── defaults

    4 │   └── main.yml

    5 ├── files

    6 ├── handlers

    7 │   └── main.yml

    8 ├── meta

    9 │   └── main.yml

    10 ├── README.md

    11 ├── tasks

    12 │   └── main.yml

    13 ├── templates

    14 ├── tests

    15 │   ├── inventory

    16 │   └── test.yml

    17 └── vars

    18     └── main.yml

    ```


    Directory description:


    `defaults` the `main.yml` file in this directory contains the default values of
    role variables that can be overwritten when the role is used. These variables
    have low precedence and are intended to be changed and customized in plays.


    `files` This directory contains static files that are referenced by role tasks.


    `handlers` the `main.yml` file in this directory contains the role’s handler definitions.


    `meta` the `main.yml` file in this directory contains information about the role,
    including author, license, platforms, and optional role dependencies.


    `tasks` the `main.yml` file in this directory contains the role’s task definitions.


    `templates` This directory contains Jinja2 templates that are referenced by role
    tasks.


    `tests` This directory can contain an inventory and `test.yml` playbook that can
    be used to test the role.


    `vars` the `main.yml` file in this directory defines the role’s variable values.
    Often these variables are used for internal purposes within the role. These variables
    have high precedence, and are not intended to be changed when used in a playbook.

