    \      ansible.builtin.yum:\n        name: httpd\n        state: latest\n```\n\
    \nCORRECT\n```yaml\n---\n- name: install apache\n  hosts: all\n  tasks:\n    -\
    \ name: message output\n      ansible.builtin.debug:\n        msg: \"This text\
    \ always displays\"\n\n    - name: install apache packages\n      ansible.builtin.yum:\n\
    \        name: httpd\n        state: latest\n      become: true\n```\n\n### Always\
    \ mention the “state” parameter\n\nMany modules have optional `state` parameters\
    \ with some implicit value.\n"
