    with the explicit intent of being used as an enterprise IT platform.


    ## Getting Started


    In this chapter, I’ll explain you how to move the firsts steps with Ansible technology.
    How to connect to the managed hosts and how to execute some simple tasks using
    the command line.


    ## Ansible architecture


    Let’s Begin a talking about Ansible architecture. The node where Ansible is actually
    installed is called “control node” and it manages all your fleet of nodes. The
    controlled node on the other hand is called “managed node”. The target nodes could
    be Linux, Mac, Windows and several network equipment. Each target has some specificity
    like different Linux distribution and module usage. We will discuss of the specificity
    the in the next sections.


    ## Connection with managed nodes


    The connection between “control node” and “managed nodes” is managed by SSH protocol
    without any requirement of specific client on the target machine. Other competitor
    require a client software often called “agent”. With SSH connection the only requirements
    are a username and a certificate to access the target machine. There are some
    way to automate also this first script step. After completing SSH connection another
    requirement is “python” interpreter, witch come out-of-the-box for modern operating
    systems. By default Ansible uses SFTP to transfer files but you could switch to
    SCP in configuration. The Windows target could be connected using WinRM technology
    and uses PowerShell as interpreter.


    ## Create a basic inventory


    /etc/ansible/hosts


    1 host1.example.com


    default inventory file /etc/ansible/hosts


    “host1.example.com” is a managed host


    The list of managed hosts is stored in /etc/ansible/hosts. In this example it
    contain only one host named host1.example.com.


    ## Run your first Ansible command


    1 $ ansible all -m ping 2 host1.example.org | SUCCESS => { 3     "ansible_facts":
    { 4         "discovered_interpreter_python": "/usr/bin/python" 5     }, 6    
    "changed": false, 7     "ping": "pong" 8 }


    “ping” module executed on “all” hosts


    “host1.example.com” replied with a success code


    Now we’re ready to run your first Ansible command. The Ansible command is called
    module in Ansible slang. The first line executed Ansible ping module on all hosts.
    The response is a pong. Please note that this means that Ansible is able to connect
    with SSH username, identify using public key and execute the local python executer.
    So it’s completely different from any ping in networking.


    ## Run ad-hoc command on Ansible


    1 $ ansible all -a “/bin/echo hello” 2 host1.example.org | CHANGED | rc=0 >> 3
    hello


    “/bin/echo hello” command executed on “all” hosts


    “host1.example.com” replied with a changed code and print “hello” on standard
    output


    Ansible could also execute some command on the target host and report the status
    on the console of “control node”. In this example “/bin/echo hello” command was
    executed on “all” hosts. “host1.example.com” replied with a changed code and print
    “hello” on standard output. Please note that you would receive a “changed” state
    every time you run a command on the remote machine.


    ## Run ad-hoc command with privilege escalation on Ansible


    1 $ ansible all -m ping -u devops --become 2 host1.example.org | SUCCESS => {
    3     "ansible_facts": { 4         "discovered_interpreter_python": "/usr/bin/python"
    5     }, 6     "changed": false, 7     "ping": "pong" 8 }


    “ping” module executed on “all” host as user “root” after login with user “devops”


    “host1.example.com” replied with a changed code and print “hello” on standard
    output


    In this example I run the “ping” module against “all” host as user “root” after
    login with user “devops”. “host1.example.com” replied with a changed code and
    print “hello” on standard output.


    ## Recap


    In this module we learned the basic concept of Ansible architecture, how to write
    the list of managed hosts and how to execute some simple commands against it.


    ## Inventory


    In this chapter, I’ll explain to you what is an Ansible inventory, why do you
    need, the different types how to edit and use it in your day to day journey.


    1 An inventory is the set of hosts Ansible could work again\ 2 st. 3 They could
    be categorized as groups/patterns.


    The list of multiple hosts managed by Ansible is called “inventory”. It is fundamentally
    the list of nodes or hosts in your infrastructure at the same time, using a list
    or group of lists known as inventory. You could organize your inventory with “groups”
    or “patterns” to select the hosts or group you want Ansible to run against.


    “all” keyword


    1 the keyword all includes all hosts of the inventory, exce\ 2 pt localhost


    The special keyword “all” include all the hosts of the inventory used. It will
    be very useful in the following lessons. The only exception is localhost that
    you need to specify.


    ## Simple INI inventory


    ./ini_simple_inventory


    1 one.example.com 2 3 [webservers] 4 two.example.com 5 three.example.com


    file name: ini_simple_inventory


    “one.example.com” is ungrouped


    “two.example.com” and “three.example.com” are grouped as “webserver”


    The simplest inventory type is the INI inventory, by the type of the file. The
    default location is “/etc/ansible/hosts” but you could use your customized with
    “-i” parameter. In this example host “one.example.com” is ungrouped and “two.example.com”
    and “three.example.com” are grouped as “webserver”.


    ## Simple YAML inventory


    ./simple_yaml_inventory.yml


    1 --- 2 all: 3   hosts: 4     one.example.com: 5   children: 6     webservers:
    7       hosts: 8         two.example.com: 9         three.example.com:


    file name: inventory.yml


    “one.example.com” is ungrouped


    “two.example.com” and “three.example.com” are grouped as “webserver”


    You could express the same inventory using YAML syntax In this example In this
    example host “one.example.com” is ungrouped and “two.example.com” and “three.example.com”
    are grouped as “webserver”.


    ## Add ranges of hosts


    ./ini_range_inventory


    1 [webservers] 2 www[01:99].example.com 3 4 [databases] 5 db-[a-f].example.com


    “webservers” group contains all hosts from www01.example.com to www99.example.com


    “Databases” group contains all hosts from db-a.example.com to db-f.example.com,'
