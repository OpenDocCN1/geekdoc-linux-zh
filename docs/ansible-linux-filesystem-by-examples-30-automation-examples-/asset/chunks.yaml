    \ GSSAPI-Kerberos 场景。\n\n让我也强调一下，我们还可以指定权限和 SELinux 属性。\n\n## Demo\n\n如何使用 Ansible\
    \ 从互联网下载 tar.gz 文件并验证 SHA256 校验和。\n\n`get_url.yml`\n\n```yaml\n---\n- name: get_url\
