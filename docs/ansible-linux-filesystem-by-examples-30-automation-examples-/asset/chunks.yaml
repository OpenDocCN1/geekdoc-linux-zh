    ```

    1 #!/bin/bash

    2 SUSEConnect --status

    3 SUSEConnect --list-extensions

    4 SUSEConnect -p PackageHub/15.3/x86_64

    5 zypper install ansible

    6 zypper info ansible

    7 ansible --version

    ```


