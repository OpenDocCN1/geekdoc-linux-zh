    I’m Luca Berton and we’re going to have a lot of fun together.


    First of all, let me introduce myself.


    I’ve been Ansible Technical Support Engineer of Red Hat, based in the Czech Republic,
    even if I’m Italian.


    I’ve been more than 15 years System Administration, working with infrastructure,
    either on-premise or on the major cloud providers.


    I’m an enthusiast of the Open Source support the community by sharing my knowledge
    in different events of public access.


    I’m also a co-founder of my hometown Linux Users Group, visited by Richard Stallman,
    the founder of the Free Software Movement.


    I consider myself a lazy person so I always try new ways to automate the repetitive
    task of my work.


    After years of Perl, Bash, and python scripting I landed in Ansible technology.
    I took the certification and worked for more than a year with the Ansible Engineer
    Team.


    I consider Ansible the best infrastructure automation technology nowadays, it’s
    human-readable, the learning curve is accessible, and very requested by the recruiters
