    ## Magic variables


    1 Magic variables are variables related to Ansible.


    Variables related to remote systems are called facts. With facts, you can use
    the behavior or state of one system as configuration on other systems.


    Most common magic variables


    hostvars


    groups


    group_names


    inventory_hostname


    ansible_version


    The most common magic variables are “hostvars”, “groups”, “group_names”, “inventory_hostname”
    and “ansible_version”. With “hostvars” magic variable you could access variables
    defined for any host in the play. It is very useful when you would like to access
    the property of one host from another one. You could combine “hostvars” with ansible
    facts to access property of another hosts. “groups” magic variable list all the
    groups in the inventory. You could use “groups” and “hostvars” magic variables
    together to list all the IP addresses of the hosts in a group. “group_names” is
    a list of which groups is the current host part of. “Inventory_hostname” magic
    variable contains the name of the host configured in the inventory. “ansible_version”
    magic variable contains the version information about Ansible.


    ## Recap


    Ansible Facts and Magic Variables are very useful in your Ansible Playbook especially
    when you need to execute some operations that impacts all hosts in the inventory.
    For example to generate a custom /etc/hosts file for all hosts involved in the
    inventory. You could apply loop or other statements that you’re going to explore
    in the next lessons.


