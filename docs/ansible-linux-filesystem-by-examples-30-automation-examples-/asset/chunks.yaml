  trans: "\n\n在本模块中，我们将讨论如何使用 `Ansible Vault` 以安全的方式存储任何敏感数据，例如密码或 API 密钥。\n\n`Ansible\
    \ Vault` 对变量和文件进行加密以保护敏感内容，并在剧本（playbooks）或角色（roles）中使用。Ansible Vault 以加密方式存储变量和文件，供你在剧本或角色中使用。在\
    \ Ansible 的最新版本中，用于保护文件的算法是 `AES 256`。\n\n## 创建加密文件\n\n要创建一个新的加密文件，请使用 `ansible-vault\
    \ create filename` 命令。该命令会提示输入新的 vault 密码，然后使用默认编辑器打开文件。在示例中使用的密码是 `password`，但我强烈建议你使用尽可能安全的密码。\n\
    \n```\n$ ansible-vault create secret.yml\nNew Vault password: password\nConfirm\
    \ New Vault password: password\n$ ansible-vault create --vault-password-file=vault-password.txt\
    \ secret1.yml\n```\n\n## 查看加密文件\n\n你可以使用 `ansible-vault view filename` 命令来查看 Ansible\
    \ Vault 加密的文件，而无需将其打开进行编辑。\n\n```\n$ ansible-vault view secret1.yml\nVault password:\
    \ password\nINFERNO. I.\nNel mezzo del cammin di nostra vita\nmi ritrovai per\
    \ una selva oscura\nché la diritta via era smarrita.\nAhi quanto a dir qual era\
    \ è cosa dura\nesta selva selvaggia e aspra e forte\nche nel pensier rinova la\
    \ paura!\nTant'è amara che poco è più morte;\nma per trattar del ben ch'i' vi\
    \ trovai,\ndirò de l'altre cose ch'i' v'ho scorte.\n```\n\n## 编辑现有加密文件\n\n要编辑现有加密文件，Ansible\
    \ Vault 提供了 `ansible-vault edit filename` 命令。该命令将文件解密到临时文件并允许你进行编辑。保存时，它会复制内容并删除临时文件。\n\
    \n```\n$ ansible-vault edit secret.yml\nVault password: password\n```\n\n## 加密现有文件\n\
    \n要对已存在的文件加密，请使用 `ansible-vault encrypt filename` 命令。`--output` 选项可以将加密文件保存为新名称。如果省略此选项，原始文件将被加密后的文件覆盖。\n\
    \n```\n$ ansible-vault encrypt cleartext1.yml --output=vault1.yml\nNew Vault password:\
    \ password\nConfirm New Vault password: password\nEncryption successful\n```\n\
    \n## 解密现有文件\n\n可以使用 `ansible-vault decrypt filename` 命令对现有加密文件进行永久解密。解密单个文件时，可以使用\
    \ `--output` 选项将解密后的文件保存为不同的名称。\n\n```\n$ ansible-vault decrypt vault1.yml --output=decrypted.yml\n\
    Vault password: password\nDecryption successful\n```\n\n## 修改加密文件的密码\n\n你可以使用\
    \ `ansible-vault rekey filename` 命令更改加密文件的密码。该命令可以一次更改多个数据文件的密钥。它会提示原始密码，然后是新密码。\n\
    \n```\n$ ansible-vault rekey secret.yml\nVault password: password1\nNew Vault\
    \ password: password\nConfirm New Vault password: password\nRekey successful\n\
    ```\n\n## Playbooks 与 Ansible Vault\n\n要运行访问了 Ansible Vault 加密文件的剧本，你需要为 `ansible-playbook`\
    \ 命令提供加密密码。如果你不提供密码，剧本将返回错误。要为剧本提供 vault 密码，请使用 `--vault-id` 选项。例如，如插图所示，交互式提供\
    \ vault 密码请使用 `--vault-id @prompt`。或者，你也可以使用密码文件。\n\n```\n$ ansible-playbook playbook.yml\n\
    TASK [include_vars] *************************************\n********************************fatal:\
    \ [localhost]: FAIL\nED! => {\"ansible_facts\": {}, \"ansible_included_var_files\"\
    : [], \"changed\": false, \"message\": \"Attempting to decrypt but no vault secrets\
    \ found\"}\n\n$ ansible-playbook --vault-id @prompt playbook.yml\nVault password\
    \ (default): password\n\n$ ansible-playbook --vault-password-file=vault-password.txt\
    \ playbook.yml\n```\n\n## 总结\n\n在本模块中，我们探索了 Ansible Vault 安全存储，用于在 Ansible 内部保存秘密和机密。正如我们看到的，这些工具是强大的，并且完全集成在\
    \ Ansible 技术中。\n\n## 条件\n\n在本模块中，我将向你解释什么是 Ansible 条件操作，以及你如何在日常 Ansible Playbook\
    \ 中使用它们。\n\n条件语句检查条件并相应地更改程序的行为。\n\n让我们开始吧！为了编写实用的代码，我们几乎总是需要检查条件并相应更改程序行为的能力。条件语句赋予了我们这种能力。Ansible\
    \ 的形式是 `when` 语句。Ansible 在条件中使用 `Jinja2` 测试和过滤器。Ansible 支持所有标准测试和过滤器，并添加了一些独特的。\n\
    \n### 使用“when” 的基础条件\n\n`conditional_basic_false.yml`\n\n```yaml\n---\n- name:\
    \ conditional_basic\n  hosts: all\n  vars:\n    configure_nginx: false\n  tasks:\n\
    \    - name: reload nginx\n      ansible.builtin.service:\n        name: nginx\n\
    \      when: configure_nginx\n```\n\n这是你在 Ansible playbook 中 `when` 语句的用法用法。任务\
    \ `reload nginx` 只有在 `configure_nginx` 变量被设置为 `true` 时才会执行。在这个示例中，我们预计该任务将被跳过。让我们看看输出。\n\
    \n执行：\n```\n$ ansible-playbook -i inventory conditional_basic_false.yml\nPLAY\
    \ [conditional_basic] *************************************\nTASK [Gathering Facts]\
    \ *************************************\nok: [host1.example.com]\n\nTASK [reload\
    \ nginx] *************************************\nskipping: [host1.example.com]\n\
    \nPLAY RECAP *************************************************\nhost1.example.com\
    \    : ok=1  changed=0  unreachable=0  failed=0  skipped=1  ignored=0\n```\n\n\
    这是 `conditional_basic_false.yml` 的输出。在这次执行中，play 针对 `host1.example.com` 节点。输出以绿色和蓝色显示。你可以看到任务\
    \ `reload nginx` 被 Ansible 读取但根据我们的条件被跳过了。\n\n`conditional_basic_true.yml`\n\n\
    ```yaml\n---\n- name: conditional_basic\n  hosts: all\n  vars:\n    configure_nginx:\
    \ true\n  tasks:\n    - name: reload nginx\n      ansible.builtin.service:\n \
    \       name: nginx\n      when: configure_nginx\n```\n\n这是你 Ansible playbook\
    \ 中 `when` 语句的相同的示例，但我们将变量值从 `false` 改为了 `true`。现在任务 `reload nginx` 将会被执行，因为 `configure_nginx`\
    \ 布尔变量被设置为 `true`。让我们看看这段代码执行的输出。\n\n执行：\n```\n$ ansible-playbook -i inventory\
    \ conditional_basic_true.yml\nPLAY [conditional_basic] *************************************\n\
    TASK [Gathering Facts] *************************************\nok: [host1.example.com]\n\
