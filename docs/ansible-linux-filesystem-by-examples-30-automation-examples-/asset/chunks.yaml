    ## Ansible For Linux


    In this chapter you’re going to discover the most common Ansible Modules to automate
    Linux System Administrator tasks.


    ## Ansible terminology - ansible_hostname vs inventory_hostname vs ansible_fqdn


    What is the difference between ansible_hostname vs inventory_hostname vs ansible_fqdn
    in a practical example with Ansible Playbook?


    These two ansible internal variables sometimes confuse one for another but they’re
    fundamentally different.


    ## ansible_hostname vs inventory_hostname vs ansible_fqdn


    ansible_hostname and ansible_fqdn


    Read from the target machine hostname from the facts:


    ansible_hostname read the hostname from the facts collected during the gather_facts


    Same as the uname -n or hostname command-line


    Need gather_facts enabled, otherwise the ansible_facts variable would be unavailable
    to use in your playbook


    Same as hostname of the target host


    As this is based on the gather_facts step. ansible_hostname not available in ad-hoc
    command


    inventory_hostname


    Read from Ansible inventory or hosts files:


    inventory_hostname read the hostname from the inventory configuration or the hosts
    file. Could be different from the hostname configuration of the remote system.
    It could be only a name on the controller machine


    inventory_hostname is always available to use in your playbook.


    Could be different from the hostname of the target host


    Available for both playbook and ad-hoc command


    ## demo


    Let me show you the difference between ansible_hostname vs inventory_hostname
    vs ansible_fqdn internal variables in a simple Ansible Playbook.


    code


    hostnames.yml


    1 --- 2 - name: hostnames demo 3   hosts: all 4   gather_facts: true 5   tasks:
    6     - name: print inventory_hostname 7       ansible.builtin.debug: 8      
      var: inventory_hostname 9     - name: print ansible_hostname 10       ansible.builtin.debug:
    11         var: ansible_hostname 12     - name: print ansible_fqdn 13       ansible.builtin.debug:
    14         var: ansible_fqdn


    inventory


    1 foo.example.com ansible_host=192.168.0.190 2 [all:vars] 3 ansible_connection=ssh
    4 ansible_user=devops 5 ansible_ssh_private_key_file=~/.ssh/id_rsa


    execution


    1 ansible-pilot $ ansible-playbook -i ansible\ statements/i\ 2 nventory ansible\
    statements/hostnames.yml 3 PLAY [hostnames demo] ***********************************\
    4 ****************************************** 5 TASK [Gathering Facts] **********************************\
    6 ****************************************** 7 ok: [foo.example.com] 8 TASK [print
    inventory_hostname] *************************\ 9 ******************************************
    10 ok: [foo.example.com] => { 11     "inventory_hostname": "foo.example.com" 12
