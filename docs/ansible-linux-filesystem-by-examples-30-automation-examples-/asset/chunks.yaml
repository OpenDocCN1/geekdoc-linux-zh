    in the RHEL 9 AppStream repository.


    ## No more additional repository (Ansible Engine or EPEL) like previous versions
    for basic automation.


    ## However, for additional support for the underlying platform and Core-maintained
    modules is required the Ansible Automation Platform subscription.


