  trans: "\n\n# SLES 15 SP3 环境配置记录\n\n## 登录与基础信息\n\n```bash\nssh devops@sles.example.com\n\
    devops@sles:~> sudo su\nsles:/home/devops # cat /etc/os-release\n```\n\n系统版本输出：\n\
    ```text\nNAME=\"SLES\"\nVERSION=\"15-SP3\"\nVERSION_ID=\"15.3\"\nPRETTY_NAME=\"\
    SUSE Linux Enterprise Server 15 SP3\"\nID=\"sles\"\nID_LIKE=\"suse\"\nANSI_COLOR=\"\
    0;32\"\nCPE_NAME=\"cpe:/o:suse:sles:15:sp3\"\nDOCUMENTATION_URL=\"https://documentation.suse.com/\"\
    \n```\n\n查看主机信息：\n```bash\nsles:/home/devops # hostnamectl\nStatic hostname: sles.example.com\n\
    Transient hostname: sles\nIcon name: computer-vm\nChassis: vm\nMachine ID: 4a241aac39fa4e75b13748c714c05c47\n\
    Boot ID: 150e32975f4d4fdd801eb605f7e35393\nVirtualization: oracle\nOperating System:\
    \ SUSE Linux Enterprise Server 15 SP3\nCPE OS Name: cpe:/o:suse:sles:15:sp3\n\
    Kernel: Linux 5.3.18-57-default\nArchitecture: x86-64\n```\n\n查看内核信息：\n```bash\n\
    sles:/home/devops # uname -a\nLinux sles 5.3.18-57-default #1 SMP Wed Apr 28 10:54:41\
    \ UTC 2021 (ba3c2e9) x86_64 x86_64 x86_64 GNU/Linux\n```\n\n## 软件包仓库与订阅管理\n\n\
    检查订阅状态：\n```bash\nsles:/home/devops # SUSEConnect --status\n```\n```json\n[\n\
    \  {\"identifier\":\"sle-module-basesystem\",\"version\":\"15.3\",\"arch\":\"\
    x86_64\",\"status\":\"Registered\"},\n  {\"identifier\":\"SLES \",\"version\"\
    :\"15.3\",\"arch\":\"x86_64\",\"status\":\"Registered\",\"regcode\":\"****************\"\
    ,\"starts_at\":\"2021-12-07 00:00:00 UTC\",\"expires_at\":\"2022-02-07 00:00:00\
    \ UTC\",\"subscription_status\":\"ACTIVE\",\"type\":\"evaluation\"},\n  {\"identifier\"\
    :\"sle-module-server-applications\",\"version\":\"15.3\",\"arch\":\"x86_64\",\"\
    status\":\"Registered\"}\n]\n```\n\n刷新仓库：\n```bash\nsles:/home/devops # zypper\
    \ refresh\n```\nRepository 'SLE-Module-Basesystem15-SP3-Pool' is up to date.\n\
    Repository 'SLE-Module-Basesystem15-SP3-Updates' is up to date.\nRepository 'SLE-Product-SLES15-SP3-Pool'\
    \ is up to date.\nRepository 'SLE-Product-SLES15-SP3-Updates' is up to date.\n\
    Repository 'SLE-Module-Server-Applications15-SP3-Pool' is up to date.\nRepository\
    \ 'SLE-Module-Server-Applications15-SP3-Updates' is up to date.\nAll repositories\
    \ have been refreshed.\n\n## Ansible 安装尝试\n\n搜索 `ansible`：\n```bash\nsles:/home/devops\
    \ # zypper search ansible\n```\n结果：没有匹配的项。\n\n尝试安装 `ansible`：\n```bash\nsles:/home/devops\
    \ # zypper install ansible\n```\n结果：未找到 `ansible` 的提供者。\n\n## 模块列表检查\n\n查看可用模块：\n\
    ```bash\nsles:/home/devops # SUSEConnect --list-extensions\n```\n可用模块包括：\n- Basesystem\
    \ Module 15 SP3 x86_64 (已激活)\n- Containers Module 15 SP3 x86_64\n- Desktop Applications\
    \ Module 15 SP3 x86_64\n- Development Tools Module 15 SP3 x86_64\n- NVIDIA Compute\
    \ Module 15 x86_64\n- SUSE Linux Enterprise Workstation Extension 15 SP3 x86_64\n\
    - Python 2 Module 15 SP3 x86_64\n- SUSE Cloud Platform Tools Module 15 SP3 x86_64\n\
    - SUSE Linux Enterprise Live Patching 15 SP3 x86_64\n- SUSE Package Hub 15 SP3\
    \ x86_64\n- Server Applications Module 15 SP3 x86_64 (已激活)\n- Legacy Module 15\
    \ SP3 x86_64\n- Public Cloud Module 15 SP3 x86_64\n- SUSE Linux Enterprise High\
    \ Availability Extension 15 SP3 x86_64\n- Web and Scripting Module 15 SP3 x86_64\n\
    - Transactional Server Module 15 SP3 x86_64\n\n## 验证\n\n检查 Ansible 版本：\n```bash\n\
    sles:/home/devops # ansible --version\n```\n```text\nansible 2.9.6\nconfig file\
    \ = /etc/ansible/ansible.cfg\nconfigured module path = ['/root/.ansible/plugins',\
    \ '/usr/share/ansible/plugins']\nmodule location = /usr/lib/python3.6/site-packages/ansible\n\
    executable location = /usr/bin/ansible\nversion = 3.6.13 (default, Mar 10 2021)\n\
    ```\n\n查看详细信息：\n```bash\nsles:/home/devops # zypper info ansible\n```\n```text\n\
    Information for package ansible:\nRepository    : SUSE-PackageHub-15-SP3-Backports-Pool\n\
    Name          : ansible\nVersion       : 2.9.6-bp153.1.20\nArch          : noarch\n\
    Vendor        : openSUSE\nSupport Level : unknown\nInstalled Size : 96.0 MiB\n\
    Installed      : No\nStatus        : up-to-date (注：此处显示为未安装)\nSummary       :\
    \ SSH-based configuration management, deployment, and task execution system\n\
    Description   : Ansible is a radically simple model-driven configuration management,\
    \ multi-node deployment, and remote task execution system. Ansible works over\
    \ SSH and does not require any software or daemons to be installed on remote nodes.\
    \ Extension modules can be written in any language and are transferred to managed\
    \ machines automatically.\n```\n"
