  trans: "\n\n2015 年 10 月 16 日，红帽（Red Hat）收购了 Ansible Inc，并将 Ansible 评估为一种“强大的 IT\
    \ 自动化解决方案”，旨在帮助企业实现无缝 IT 化。\n\nAnsibleFest 是自 2016 年以来在伦敦和美国举办的 Ansible 用户及贡献者社区年度会议。\n\
    \n# Ansible & Ansible Tower & Ansible Automation Platform\n\n### Ansible\n一个社区驱动的项目，创新迭代快，开源的，但仅提供命令行工具。\n\
    \n### Red Hat Ansible Tower / Ansible Automation Platform\n这是一个由红帽设计的框架。它提供了一个\
    \ Web UI，用于管理您的基础架构。\n\nAnsible 是一个社区驱动的项目，创新迭代快，开源，但仅提供命令行工具。\n\n企业级需要更多的服务和一些稳定版本。例如，它们需要支持方面的\
    \ SLA（服务水平协议）。红帽在 Ansible Tower 伞下为公司提供此类服务，该服务现已重命名为 Ansible Automation Platform。\n\
    \nAnsible Tower 是一个 REST API、Web 服务和基于 Web 的控制台，旨在让不同技术水平和技能的 IT 团队成员更方便地使用 Ansible。它是自动化任务的枢纽。该\
    \ Tower 是红帽公司支持的商业产品，但源自 AWX 上游项目，该项目自 2017 年 9 月起开源。\n\n红帽还维护着 Ansible Engine。通过\
    \ Ansible Engine，组织可以以加固的企业级方式访问底层 Ansible 技术提供的工具和创新。Ansible Engine 由红帽开发，明确意图作为企业\
    \ IT 平台使用。\n\n# 入门\n在本章节中，我将向你解释如何开启 Ansible 技术之旅。如何连接到受管主机以及如何使用命令行执行一些简单任务。\n\
    \n# Ansible 架构\n让我们开始谈论 Ansible 架构。实际安装 Ansible 的节点被称为“控制节点”（control node），它管理你所有的节点集群。另一方面，被管理的节点被称为“受管节点”（managed\
    \ node）。目标节点可以是 Linux、Mac、Windows 以及多种网络设备。每个目标都有某些特性，例如不同的 Linux 发行版和模块用法。我们将在接下来的章节中讨论这些特性。\n\
    \n# 与受管节点的连接\n“控制节点”与“受管节点”之间的连接通过 SSH 协议管理，不需要在目标机器上安装特定的客户端。竞争对手需要通常被称为“代理”（agent）的客户端软件。通过\
    \ SSH 连接，唯一的要求是访问目标机器的用户名和证书。还有一些方法可以自动化这第一个脚本步骤。在完成 SSH 连接后，另一个要求是 `python` 解释器，它是现代操作系统中自带的。默认情况下，Ansible\
    \ 使用 SFTP 传输文件，但你可以在配置中切换到 SCP。Windows 目标可以使用 WinRM 技术连接，并使用 PowerShell 作为解释器。\n\
    \n# 创建基础清单\n`/etc/ansible/hosts`\n\n```\nhost1.example.com\n```\n默认清单文件 `/etc/ansible/hosts`\n\
    \n`host1.example.com` 是一个受管主机。\n\n受管主机列表存储在 `/etc/ansible/hosts` 中。在本示例中，它只包含一个名为\
    \ `host1.example.com` 的主机。\n\n# 运行你的第一个 Ansible 命令\n```\n$ ansible all -m ping\
    \ 2 host1.example.org | SUCCESS => { 3     \"ansible_facts\": { 4         \"discovered_interpreter_python\"\
    : \"/usr/bin/python\" 5     }, 6     \"changed\": false, 7     \"ping\": \"pong\"\
    \ 8 }\n```\n`ping` 模块在 `all` 主机上执行。\n\n`host1.example.com` 回了成功代码。\n\n现在我们准备好运行你的第一个\
    \ Ansible 命令了。Ansible 命令在 Ansible 术语中被称为“模块”（module）。第一行在所有主机上执行了 Ansible `ping`\
    \ 模块。响应是 pong。请注意，这意味着 Ansible 能够通过 SSH 用户名连接，使用公钥识别身份并执行本地 python 执行器。因此，它与网络中的任何\
    \ ping 完全不同。\n\n# 在 Ansible 上运行即时命令\n```\n$ ansible all -a “/bin/echo hello” 2\
    \ host1.example.org | CHANGED | rc=0 >> 3 hello\n```\n`/bin/echo hello` 命令在 `all`\
    \ 主机上执行。\n\n`host1.example.com` 回了变更代码并在标准输出上打印了 `hello`。\n\nAnsible 还可以在目标主机上执行某些命令并在“控制节点”的控制台上报告状态。在本示例中，`/bin/echo\
    \ hello` 命令在 `all` 主机上执行。`host1.example.com` 回了变更代码并在标准输出上打印了 `hello`。请注意，每当你在远程机器上运行命令时，你都会收到“changed”（变更）状态。\n\
    \n# 在 Ansible 上运行带权限提升的即时命令\n```\n$ ansible all -m ping -u devops --become 2 host1.example.org\
    \ | SUCCESS => { 3     \"ansible_facts\": { 4         \"discovered_interpreter_python\"\
    : \"/usr/bin/python\" 5     }, 6     \"changed\": false, 7     \"ping\": \"pong\"\
    \ 8 }\n```\n在以 `devops` 用户登录后，以 `root` 用户身份在 `all` 主机上执行 `ping` 模块。\n\n`host1.example.com`\
    \ 回了变更代码并在标准输出上打印了 `hello`。\n\n在本示例中，我在以 `devops` 用户登录后，以 `root` 用户身份对 `all` 主机运行\
    \ `ping` 模块。`host1.example.com` 回了变更代码并在标准输出上打印了 `hello`。\n\n# 总结\n在本模块中我们学习了\
    \ Ansible 架构的基础概念、如何编写受管主机列表以及如何对其执行某些命令。\n\n# 清单\n在本章节中，我将向你解释什么是清单、为什么需要它以及不同类型的使用方法。\n\
    \n由 Ansible 管理的多主机列表被称为清单（inventory）。它从根本上是节点或主机的集合，使用组或模式进行选择。\n\n`all` 关键字\n\
    特殊关键字 `all` 清单中的所有主机。它在后续课程中将非常有用。例外是你需要指定的 `localhost`。\n\n# 简单的 INI 清单\n`./ini_simple_inventory`\n\
    \n```\nhost1.example.com\n\n[webservers]\ntwo.example.com\nthree.example.com\n\
    ```\n文件名 `ini_simple_inventory`\n\n`host1.example.com` 未分组。\n\n最简单的清单类型是 INI 清单，取决于文件类型。默认位置是\
    \ `/etc/ansible/hosts`，但你可以通过 `-i` 参数自定义。在本示例中，主机 `host1.example.com` 未分组，`two.example.com`\
    \ 和 `three.example.com` 被组为 `webserver`。\n\n# 简单的 YAML 清单\n`simple_yaml_inventory.yml`\n\
    \n```yaml\n---\nall:\n  hosts:\n    one.example.com:\n  children:\n    webservers:\n\
    \      hosts:\n        two.example.com:\n        three.example.com\n```\n文件名 `inventory.yml`\n\
    \n`one.example.com` 未分组。\n\n`two.example.com` 和 `three.example.com` 被组为 `webserver`。\n\
    \n你可以使用 YAML 语法表达相同的清单。在本示例中，与 INI 示例相同。\n\n# 添加主机范围\n`./ini_range_inventory`\n\
    \n```\n[webservers]\nwww[01:99].example.com\n\n[databases]\ndb-[a-f].example.com\n\
    ```\n`webservers` 组包含从 `www01.example.com` 到 `www99.example.com` 的所有主机。\n\n`databases`\
    \ 组包含从 `db-a.example.com` 到 `db-f.example.com` 的所有主机，\n\n"
- fmt: "\nGroup members could be defined also using ranges by numbers or letters.\
    \ In the range by numbers you could also specify a stride the increment between\
    \ a sequence of number. In this INI example “webservers” group contains all hosts\
    \ from `www01.example.com` to `www99.example.com`. “databases” group contains\
    \ all hosts from `db-a.example.com` to `db-f.example.com`.\n\n## Host in multiple\
    \ groups\n\n`./ini_groupsmultiple_inventory`\n\n```ini\n1 one.example.com 2 3\
    \ [webservers] 4 two.example.com 5 three.example.com 6 7 [prod] 8 two.example.com\
    \ 9 10 [dev] 11 three.example.com\n```\n\nhosts `two.example.com` and `three.example.com`\
    \ are present in multiple groups.\n\nHosts could be present in multiple groups.\
    \ In this INI example hosts `two.example.com` and `three.example.com` are grouped\
    \ as `webserver`. `two.example.com` is present in `webserver` as well as `prod`\
    \ group.\n\n`three.example.com` is present in `webserver` and `dev` group.\n\n\
    ## Host variables\n\n`./ini_host_inventory`\n\n```ini\n1 [webservers] 2 localhost\
    \ ansible_connection=local 3 one.example.com ansible_connection=ssh ansible_user=devops\
    \ 4 two.example.com ansible_connection=ssh ansible_user=ansible\\ 5 le\n```\n\n\
    Customization of `ansible_connection` and `ansible_user` variables.\n\nIn inventory\
    \ you might would like to store variable values that relate to a specific host\
    \ or group. This example scenario is common because it defines different connection\
    \ with different hosts. For example to use `local` connection for the localhost\
    \ and `ssh`, default, for all the other hosts. For each hosts you could customize\
    \ also the login user `devops` for `one.example.com` and `ansible` for `two.example.com`.\n\
    \n## Group variables\n\n`./ini_groupsvariables_inventory`\n\n```ini\n1 [webservers]\
    \ 2 one.example.com 3 two.example.com 4 5 [webservers:vars] 6 ntp_server=europe.pool.ntp.org\n\
    ```\n\n`./inventory.yml`\n\n```yaml\n1 --- 2 webservers: 3   hosts: 4     two.example.com:\
    \ 5     three.example.com: 6   vars: 7     ntp_server: europe.pool.ntp.org\n```\n\
    \nAs well as per single host is possible to define group variables. This two inventory\
    \ files in the example (INI and YAML format) the variables `ntp_server` has assigned\
    \ the value `europe.pool.ntp.org` for all the hosts of the group.\n\n## Inheriting\
    \ variable values\n\n`./ini_variableinheriting_inventory`\n\n```ini\n1 [asia]\
    \ 2 host1.example.com 3 4 [europe] 5 host2.example.com 6 7 [webserver:children]\
    \ 8 asia 9 europe 10 11 [webservers:vars] 12 ntp_server=europe.pool.ntp.org\n\
    ```\n\n`./variableinheriting_inventory.yml`\n\n```yaml\n1 --- 2 children: 3  \
    \ webservers: 4     children: 5       asia: 6         hosts: 7           host1.example.com:\
    \ 8       europe: 9         hosts: 10           host2.example.com: 11     vars:\
    \ 12       ntp_server: europe.pool.ntp.org\n```\n\nHosts and group could be combined\
    \ together. In this example the group `webserver` has two members `asia` and `europe`.\
    \ This two elements are defined as a single host `host1.example.com` and `host2.example.com`,\
    \ respectively, but could contains more hosts as well. `ntp_server` variables\
    \ is defined at `webservers` level. So in the end `ntp_server` variable is available\
    \ for `webserver`, `asia` and `europe` group. `ntp_server` variable is available\
    \ as well in `host1.example.com` and `host2.example.com` hosts.\n\n## Use multiple\
    \ inventory sources\n\n```bash\n$ ansible-playbook playbook.yml -i production\
    \ -i development\n```\n\nExecute ansible playbook named `playbook.yml` against\
    \ `production` and `development`.\n\nIs possible to use multiple inventory files\
    \ for each execution. In this example is going to be executed ansible playbook\
    \ named `playbook.yml` against `production` and `development` inventories.\n\n\
    ## localhost inventory\n\n`./ini_local_inventory`\n\n```ini\n1 localhost ansible_connection=\"\
    local\"\n```\n\nfile name: `inventory`\n\n`/etc/ansible/hosts` default\n\nOne\
    \ special case in inventory is with `localhost`. You need to specify the connection\
    \ type as `local`, otherwise Ansible presume to use the default SSH connection.\n\
    \n## Recap\n\nNow you know more about Ansible INI and YAML inventory files, host\
    \ and group variable.\n\n## Playbook\n\nIn this chapter, I’ll explain to you what\
    \ is an Ansible Playbook and why do you need. We’ll cover how to start with a\
    \ simple playbook, from the basic syntax and how to.\n\n## YAML syntax\n\nIn this\
    \ chapter, I’ll explain to you what is an Ansible Playbook and why do you need.\
    \ We’ll cover how to start with a simple playbook, from the basic syntax and how\
    \ to.\n\nYAML is a data serialization language that is easy to read and write.\
    \ It is used for Ansible playbooks and inventory files.\n\nYAML uses several data\
    \ types:\n- Key-value pairs\n- Lists\n- Scalars\n- Dictionaries\n\nExample of\
    \ a YAML file:\n\n```yaml\n- name: My first playbook\n  hosts: all\n  tasks:\n\
    \    - name: Print message\n      debug:\n        msg: \"Hello World\"\n```\n\n\
    YAML is sensitive to indentation, which means it's important to use consistent\
    \ number of spaces.\n\n## helloworld.yml\n\n```yaml\n---\n- name: My first playbook\n\
    \  hosts: all\n  tasks:\n    - name: Print message\n      debug:\n        msg:\
    \ \"Hello World!\"\n```\n\nThis is the output of the execution of `helloworld.yml`.\
    \ I’d like you to note the command used is `ansible-playbook`. The first parameter\
    \ is the inventory file and the second is the playbook.\n"
