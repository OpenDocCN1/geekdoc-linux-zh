    ## Concatenate multiple files in a specific order - Ansible module template and
    YAML


    How to automate the concatenation of multiple files and format using a list in
    the YAML and Ansible module template with Jinja2 language. Included example with
    “a.txt”, “b.txt” and “includes.yaml” files for Pandoc.


    ## Ansible Concatenate multiple files in a specific order


    ansible.builtin.template


    Template a file out to a target host


    ansible_managed, template_host, template_uid, template_path, template_fullpath,
    template_destpath, and template_run_date


    Let’s talk about the Ansible module template.


    The full name is ansible.builtin.template, it’s part of ansible-core and is included
    in all Ansible installations.


    It templates a file out to a target host. Templates are processed by the Jinja2
    templating language.


    Also you could use also some special variables in your templates: ansible_managed,
    template_host, template_uid, template_path, template_fullpath, template_destpath,
    and template_run_date.


    It supports a large variety of Operating Systems.


    For basic text formatting, use the Ansible ansible.builtin.copy module or for
    empty file Ansible ansible.builtin.file module.


    For Windows, use the ansible.windows.win_template module instead.


    ## Parameters


    src path - template (“templates/” dir)


    dest path - target location


    validate string - validation command before (“%s”)


    backup boolean - no/yes


    mode/owner/group - permission


    setype/seuser/selevel - SELinux


    Let me highlight the most useful parameters for the template module.


    The only required parameters are “src” and “dest”.


    The “src” parameter specifies the template file name. Templates usually are stored
    under “templates” directories with the “.j2” file extension.


    The “dest” parameter specifies the path where to render the template on the remote
    machine.


    The “validate” parameters allow you to specify the validation command to run before
    copying it into place. It’s very useful with configuration files for services.


    Please note that the special escape sequence “%s” is going to be expanded by Ansible
    with the destination path.'
