    ## Recap


    Now you know how to install the latest version of Ansible in Amazon Linux using
    the Amazon Extras Library and EPEL repositories.


    ## How to install Ansible in Debian 11


    The easier way to install the latest version of Ansible and maintain up-to-date
    in Debian 11 using `APT` and the “main” default repository.


    ## How to install Ansible in Debian


    Included in the “main” default repository


    The good news is that Ansible is included in the default repository so you could
    install it simply with your usual package manager `apt`.


    You could expect the latest version of Ansible in the “main” repository.


    ## demo


    How to install Ansible in Debian using the `apt` package manager and the “main”
    default repository.


    ## code


    install-ansible-debian.sh


    ```

    1 #!/bin/bash

    2 $ sudo apt-get update

    3 $ sudo apt-get install ansible

    4 $ sudo apt list –installed ansible

    ```


    ## execution

