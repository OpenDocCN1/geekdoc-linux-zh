    - `extra_opts` string - 命令行选项\n- `keep_newer` boolean - 否/是\n- `mode/owner/group`\
    \ - 权限\n- `setype/seuser/selevel` - SELinux\n\n唯一的强制性参数是 `src` 和 `dst`，它们是源路径和目标路径。`src`\
