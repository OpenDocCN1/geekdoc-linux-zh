    \ 'Basesystem_Module_15_SP3_x86_64'.\nRefreshing service 'SUSE_Linux_Enterprise_Server_15_SP3_x86_64'.\n\
    Refreshing service 'Server_Applications_Module_15_SP3_x86_64'.\nLoading repository\
    \ data...\nReading installed packages...\nNo matching items found.\nsles:/home/devops\
    \ # zypper install ansible\nRefreshing service 'Basesystem_Module_15_SP3_x86_64'.\n\
    Refreshing service 'SUSE_Linux_Enterprise_Server_15_SP3_x86_64'.\nRefreshing service\
    \ 'Server_Applications_Module_15_SP3_x86_64'.\nLoading repository data...\nReading\
    \ installed packages...\n'ansible' not found in package names. Trying capabilities.\n\
    No provider of 'ansible' found.\nResolving package dependencies...\nNothing to\
    \ do.\nsles:/home/devops #\n```\n\n## After Execution\n\n```bash\n# zypper info\
    \ ansible\nRefreshing service 'Basesystem_Module_15_SP3_x86_64'.\nRefreshing service\
    \ 'SUSE_Linux_Enterprise_Server_15_SP3_x86_64'.\nRefreshing service 'SUSE_Package_Hub_15_SP3_x86_64'.\n\
    Refreshing service 'Server_Applications_Module_15_SP3_x86_64'.\nLoading repository\
    \ data...\nReading installed packages...\nInformation for package ansible:\n--------------------------------\n\
    Repository      : SUSE-PackageHub-15-SP3-Backports-Pool\nName            : ansible\n\
    Version         : 2.9.6-bp153.1.20\nArch            : noarch\nVendor         \
    \ : openSUSE\nSupport Level  : unknown\nInstalled Size  : 96.0 MiB\nInstalled\
    \       : Yes\nStatus          : up-to-date\nSource package  : ansible-2.9.6-bp153.1.20.src\n\
    Summary         : SSH-based configuration management, deployment, and task execution\
    \ system\nDescription     :\n    Ansible is a radically simple model-driven configuration\
    \ management, multi-node deployment, and remote task execution system. Ansible\
    \ works over SSH and does not require any software or daemons to be installed\
    \ on remote nodes. Extension modules can be written in any language and are transferred\
    \ to managed machines automatically.\nsles:/home/devops #\n```\n\n## How to install\
    \ Ansible with PIP\n\nHow to install Ansible with `PIP`, the Python package manager?\n\
    \n`PIP` is the Python package manager and is going to take care of all the processes\
    \ and manage the necessary dependency. It takes care of the download and installs\
    \ process of packages directly from `PyPI`. `PIP` is designed to be OS-independent.\n\
    \nIt could be a solution for developers that always want the latest up-to-date\
    \ release.\n\nThe alternative approach is to use the Operating System specific\
    \ Package Manager. For example for Linux `yum`, `DNF`, and `apt` and for macOS\
    \ `Homebrew`.\n\nThis second approach put more emphasis on stability so the latest\
    \ release could be not available.\n\nSo if you really need the latest release\
    \ of Ansible I’d suggest you use `PIP`.\n\n## Demo install Ansible with PIP\n\n\
    How to install the latest of Ansible with `PIP`, the Python package manager.\n\
    \n### PIP user\n`install-pip-user.sh`\n\n```bash\n#!/bin/bash\npython3 -m pip\
    \ install --upgrade -user pip\npython3 -m pip install --user ansible\n```\n\n\
    ### PIP global\n`install-pip-global.sh`\n\n```bash\n#!/bin/bash\npython3 -m pip\
    \ install --upgrade pip\npython3 -m pip install ansible\n```\n\n## How to install\
    \ Ansible in RedHat Enterprise Linux 9 Beta\n\n### How to install Ansible Core\
    \ (`ansible-core`) in RedHat Enterprise Linux 9 Beta included in the RHEL 9 AppStream\
    \ repository.\n\n### How to install Ansible in RHEL 9 Beta\n\n### The Ansible\
    \ Core package (`ansible-core`) included in the RHEL 9 AppStream repository\n\n\
    The good news is that the Ansible Core package (`ansible-core`) is included out-of-the-box\
    \ in the RHEL 9 AppStream repository.\n\nNo more additional repository (`Ansible\
    \ Engine` or `EPEL`) like previous versions for basic automation.\n\nHowever,\
    \ for additional support for the underlying platform and Core-maintained modules\
    \ is required the Ansible Automation Platform subscription.\n\n## Link\n\n- [Scope\
    \ of support for the Ansible Core package included in the RHEL 9 AppStream](https://access.redhat.com/articles/6325611)\n\
    - [Using Ansible in RHEL 9](https://access.redhat.com/articles/6393321)\n"
