    ## How to print a text or a variable during the execution with Ansible


    Let’s talk about Ansible module debug.


    It’s part of the ansible.builtin collection so it’s part of the collection of
    modules “builtin” with ansible and shipped with it.


    It’s a stable module and works with a variety of operating systems.


    The purpose is to print statements during execution. This means not only text
    but also all the possible Ansible variables and facts.


    ## Parameters


    msg string


    var string


    verbosity integer


    This module has three parameters. If you launch without any parameter the default
    “Hello world!” (with exclamation mark) is printed.


    If we prefer to customize the message we need to specify the msg parameter.


    In the same way, the var parameter allows us to print a variable.


    We could combine text and variables in the msg field. Please note that you need
    to use always the double brackets when we want the variable value.


    The verbosity is for advanced users if you would like to hide our debug code in
    normal execution but keep it in the playbook if we need it in debug mode. The
    value could vary from 0 normal execution to 3.


