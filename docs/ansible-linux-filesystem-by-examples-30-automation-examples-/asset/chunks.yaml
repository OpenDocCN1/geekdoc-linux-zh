    * * *


    Are you ready to have fun?


    Ansible For Beginners With Examples


    In this chapter you’re going to discover the Ansible Basics, Architecture and
    Terminology.


    ## What is Ansible


    In this chapter, I’ll explain to you what is Ansible and why it is so powerful
    for your IT department.


    ## Ansible


    Infrastructure Automation tool


    Open Source infrastructure as code


    First of all, let’s begin our adventure with the fabulous Open Source technology
    named Ansible. It is classified as an Infrastructure Automation tool, so you could
    automate your System Administrator tasks very easily. Infrastructure as code is
    the process of managing and provisioning computer data centers through machine-readable
    definition files, rather than physical hardware configuration or interactive configuration
    tools. Ansible follows the DevOps principles. With Ansible you could deploy your
    infrastructure as code on-premise and on the most well-known public cloud provider.


    ## Ansible three Use Cases


    Provision


    Config management


    Application deployment


    The three main use cases of Ansible are provision, configuration management, and
    app deployment. But after touching the technology I’m sure you could invent some
    more ways to use it!


    Provisioning


    The process of setting up the IT infrastructure


    Let’s start talking about provisioning: all the System Administrator know how
    important is to manage a uniform fleet of machines. Some people still rely on
    software to create workstation images. But there is a drawback, with imaging technology
    you’re only taking a snapshot in time of the machine. So every time you need to
    reinstall software because of the modern key activation systems or update manually
    to the latest security patches. Ansible is very powerful to automate this process
    being able to create a more smooth process.


    Configuration management


    The process for maintaining systems and software in a desired and consistent state


    The second key use case is “configuration management”: maintain up-to-date and
    in a consistent way all your fleet, coordinating rolling updates and scheduling
    downtime. With Ansible you could verify the status of your managed hosts and take
    action in a small group of them. A huge variety of modules is available for the
    most common use cases. Not to mention the common use case to check the compliance
    of your fleet to some international standard and apply resolution plans.


    Application deployment


    The process to publish your software between testing, staging and production environment


    The third key use case where Ansible is useful is Application deployment. It could
    automate the continuous integration / continuous delivery workflow pipeline of
    your web application for example. Your DevOps team will be delighted!.


    ## Ansible in DevOps


    Ansible is used to apply the DevOps principles in worldwide organizations. Let
    me quickly summarize.


    DevOps is a set of practices that combines software development (Dev) and IT operations
    (Ops). As DevOps is intended to be a cross-functional mode of working, those who
    practice the methodology use different sets of tools referred to as “toolchains”
    rather than a single one. These toolchains are expected to fit into one or more
    of the following categories, reflective of key aspects of the development and
    delivery process. The seven categories:


    Code: code development and review, source code management tools, code merging.


    Build: continuous integration tools, build status.


    Test: continuous testing tools that provide quick and timely feedback on business
    risks.


    Release: artifact repository, application pre-deployment staging.


    Deploy: change management, release approvals, release automation.


    Operate: infrastructure configuration and management, infrastructure as code tools.


    Monitor: applications performance monitoring, end-user experience.


    ## Four key tenets of Ansible


    1\. Declarative


    You declare what you want rather than how to get to.


    2\. Agentless


    You don’t need to install an agent. It takes advantage of OpenSSH.


    3\. Idempotent


    An operation could be run multiple times without changing beyond the initial operation.


    4\. Community driven


    Published in Ansible Galaxy as collections and roles.


    The four key tenets of ansible are: declarative, agentless, idempotent, and community-driven.
    With “declarative” it means that you could use in a way very similar to a programming
    language apply sequencing, selection, and iteration to the code flow. With “agentless”
    it means that you don’t need to install and update any agents on the target machine,
    it uses the SSH connection and python interpreter. The language itself is “idempotent”,
    which means that the code will check a precise status on the managed machine.
    It means that for example the first time your code will change something, the
    following runs it only verify that nothing changed and move forward. The last
    tenet is “community-driven”, which means that exists a public archive called “Ansible
    Galaxy” where you could download the code made by other open source contributors.
    This code is organized in roles and collections, but we’ll see it in the future.


    ## Ansible six values


    Simple


    YAML human readable automation.


    Powerful


    Configuration management, workflow orchestration, application deployment.


    Cross-platform


    Agentless support for all major OS, physical, virtual, cloud and network.


    Work with existing tools


    Homogenize existing environment.


    “batteries included”


    Come bundled with 750+ modules.


    Community powered


    Download \250k/months People \3500 contributors, 1200 users on IRC.


    Now let’s talk about the six values of Ansible. The first is that is “simple:
    the code is written in YAML language, that is a human-readable data serialization
    language. It is well known and easy to learn, it is commonly used for configuration
    files and in applications where data is being stored or transmitted. Ansible is
    Powerful, it is battle-tested as Configuration management, workflow orchestration,
    application deployment. The third value is “cross-platform” by nature, the Agentless
    support for all major Operating Systems, physical, virtual, cloud, and network
    provider. Another value of Ansible is that it works with existing tools, it easy
    to homogenize the existing environment. The “batteries included” means that Ansible
    included bundled more than 750 modules to automate the most common tasks. The
    last value is that Ansible is “community-powered”, every month has more than 250000
    downloads, an average of 3500 contributors, and more than 1200 users on IRC.


    ## Ansible history


    2012


    Developed by Michael DeHaan


    2015


    Acquired by Red Hat


    2016


    AnsibleFest events


    2020


    Red Hat Ansible Automation Platform 1.0


    2021


    Red Hat Ansible Automation Platform 2.1


    The main events in Ansible history are the following.


    The first release of Ansible was public on the 20th of February 2012. The Ansible
    tool was developed by Michael DeHaan. Ansible Inc., originally AnsibleWorks Inc.,
    was the company set up to commercially support and sponsor the project.'
