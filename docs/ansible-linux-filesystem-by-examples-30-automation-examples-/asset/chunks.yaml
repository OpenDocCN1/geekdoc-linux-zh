    \ `yes`。\n\n`checksum` 参数非常有用，用于验证下载文件的一致性。\n\n你可以指定算法（通常为 `sha1` 或 `sha256`），并直接提供校验和值或校验和的\
    \ URL。\n\n你可能需要第三方库 `hashlib` 来访问额外的算法。\n\n另一个有意思的参数是 `headers`，它允许你指定一些自定义的 HTTP\
