- fmt: "\n# Overview\n\nThe `dest` parameter specifies the filesystem path where the\
    \ resource is going to be saved on the target node.\n\nLet’s deep dive in the\
    \ `force` parameter.\n\nIf `dest` is a file, Ansible is going to download every\
    \ time the file. If `dest` is a directory the default behavior is not to replace\
    \ a file, until you toggle to `yes` the `force` parameter.\n\nThe parameter `checksum`\
    \ is very useful to validate the consistency of the downloaded file.\n\nYou could\
    \ specify the algorithm, usually `sha1` or `sha256`, and directly the checksum\
    \ or a URL for checksum.\n\nYou might need the third-party `hashlib` library for\
    \ access to additional algorithms.\n\nAnother interesting parameter is `headers`\
    \ which allow you to specify some custom HTTP headers.\n\nAnsible presents himself\
    \ as `ansible-httpget` in the web server logs, but you cust customize it in the\
    \ `http_agent` parameter.\n\nThere are some additional parameters for authentication\
    \ for example to handle HTTP basic authentication with username and password or\
    \ for more complex GSSAPI-Kerberos scenarios using `httplib2` Python library.\n\
    \nLet me also highlight that we could also specify the permission and SELinux\
    \ properties.\n\n## Demo\n\nHow to download a tar.gz file from Internet and verify\
    \ the SHA256 checksum with Ansible.\n\n`get_url.yml`\n\n```yaml\n---\n- name:\
    \ get_url module demo\n  hosts: all\n  become: false\n  vars:\n    myurl: \"https://releases.ansible.com/ansible/ansible-2.9.25.tar.gz\"\
    \n    mycrc: \"sha256:https://releases.ansible.com/ansible/ansible-2.9.25.tar.gz.sha\"\
    \n    mydest: \"/home/devops\"\n  tasks:\n    - name: download file\n      ansible.builtin.get_url:\n\
    \        url: \"{{ myurl }}\"\n        dest: \"{{ mydest }}\"\n        checksum:\
    \ \"{{ mycrc }}\"\n        mode: '0644'\n        owner: devops\n        group:\
    \ wheel\n```\n\n# Extract an archive - Ansible module unarchive\n\nHow to download\
    \ a zip file and extract it in a user home directory. The playbook is also taking\
    \ care of the necessary softwre dependencies.\n\nLet’s talk about the Ansible\
    \ module `unarchive`.\n\nThe full name is `ansible.builtin.unarchive`, which means\
    \ that is part of the collection of modules `builtin` with ansible and shipped\
    \ with it.\n\nIt’s a module pretty stable and out for years.\n\nIt works in a\
    \ different variety of operating systems.\n\nIt unpacks one archive after (optionally)\
    \ copying it from the local machine. \n\nIt can handle `.zip` files using `unzip`\
    \ as well as `.tar`, `.tar.gz`, `.tar.bz2`, `.tar.xz`, and `.tar.zst` files using\
    \ `gtar`. It requires `zipinfo`, `gtar` and `unzip` command on target host.\n\n\
    Please note that it requires a tarball (`.tar` archive) for the Unix file format.\n\
    \nFor Windows targets, use the `ansible.windows.win_unzip` module.\n\n## Parameters\n\
    \n- `src` string - path\n- `dest` string - path\n- `remote_src` boolean - no/yes\n\
    - `validate_certs` boolean - no/yes (https only)\n- `include/exclude` list - directory\
    \ and file entries\n- `extra_opts` string - command-line options\n- `keep_newer`\
    \ boolean - no/yes\n- `mode/owner/group` - permission\n- `setype/seuser/selevel`\
    \ - SELinux\n\nThe only mandatory parameters are `src` and `dst` which are the\
    \ source and destination paths. The `src` is quite special because is supposed\
    \ to be a local path on the Ansible controller.\n\nWe could switch to a remote\
    \ path enabling the `remote_src` properties.\n\nIn the `src` parameter we could\
    \ also enter a URL, so the archive is going to be downloaded before being expanded.\n\
    \nOther useful parameters are `include` and `exclude` that allows us to specify\
    \ a subset of the archive to extract, specifically a list of inclusion or exclusion\
    \ files or directories.\n\nJust in case we need some extra command-line options\
    \ we could specify in the `extra_opts` parameter.\n\nIf the files are already\
    \ present on the target machine the default behavior is not to replace existing\
    \ files that are newer than files from the archive, you could override enabling\
    \ the `keep_newer` parameter.\n\nLet me also highlight that we could also specify\
    \ some permissions or SELinux properties.\n\n## Demo\n\nHow to extract an archive\
    \ in Ansible Playbook with Ansible.\n\n`unarchive.yml`\n\n```yaml\n---\n- name:\
    \ unarchive module demo\n  hosts: all\n  become: false\n  vars:\n    myurl: \"\
    https://github.com/lucab85/ansible-pilot/archive/refs/heads/master.zip\"\n  tasks:\n\
    \    - name: extractor presents\n      ansible.builtin.yum:\n        name:\n \
    \         - unzip\n    - name: extract archive\n      ansible.builtin.unarchive:\n\
    \        src: \"{{ myurl }}\"\n        dest: \"/home/devops/\"\n        remote_src:\
    \ true\n```\n\n# Create a link - Ansible module\n\nHow to create a symbolic link\
    \ in Ansible.\n\n`link` module creates a hard link.\n\nLet me also highlight that\
    \ we could also specify some permissions or SELinux properties.\n\n# Create a\
    \ link (soft link) - Ansible module\n\nHow to create an `example` soft link to\
    \ `/proc/cpuinfo` on Linux.\n\n`create_symlink.yml`\n\n```yaml\n---\n- name: file\
    \ demo\n  hosts: all\n  vars:\n    mydlink: \"~/example\"\n    mysrc: \"/proc/cpuinfo\"\
    \n  tasks:\n    - name: Creating a symlink\n      ansible.builtin.file:\n    \
    \    src: \"{{ mysrc }}\"\n        dest: \"{{ mylink }}\"\n        state: link\n\
    ```\n\nexecution\n\n```bash\n$ ansible-playbook -i demo/inventory create_symlink.yml\n\
    PLAY [file demo] *********************************\nTASK [Gathering Facts] *********************************\n\
    ok: [demo.example.com]\nTASK [Creating a symlink] *******************************\n\
    changed: [demo.example.com]\n\nPLAY RECAP **********************************************\n\
    demo.example.com: ok=2    changed=1    unreachable=0    failed=0    skipped=0\
    \    rescued=0    ignored=0\n```\n\nbefore execution\n\n```bash\n$ ssh devops@demo.com\n\
    [devops@demo ~]$ ls -al\ntotal 16\ndrwx------. 4 devops wheel  111 Nov 14 14:26\
    \ .\ndrwxr-xr-x. 5 root root     50 Nov  8 17:07 ..\ndrwx------. 3 devops wheel\
    \  17 Sep  6 05:53 .ansible\n-rw-------. 1 devops wheel 3055 Nov 14 14:26 .bash_history\n\
    -rw-r--r--. 1 devops wheel  18 Dec  4  2020 .bash_logout\n-rw-r--r--. 1 devops\
    \ wheel  141 Dec  4  2020 .bash_profile\n-rw-r--r--. 1 devops wheel  376 Dec \
    \ 4  2020 .bashrc\ndrwx------. 2 devops wheel  94 Sep 16 10:09 .ssh\n```\n\nafter\
    \ execution\n"
  raw: 'The dest parameter specifies the filesystem path where the resource is going
    to be saved on the target node.


    Let’s deep dive in the “force” parameter.


    If “dest” is a file, Ansible is going to download every time the file. If “dest”
    is a directory the default behavior is not to replace a file, until you toggle
    to yes the force parameter.


    The parameter “checksum” is very useful to validate the consistency of the downloaded
    file.


    You could specify the algorithm, usually sha1 or sha256, and directly the checksum
    or a URL for checksum.


    You might need the third-party hashlib library for access to additional algorithms.


    Another interesting parameter is “headers” which allow you to specify some custom
    HTTP headers.


    Ansible presents himself as “ansible-httpget” in the web server logs, but you
    cust customize it in the “http_agent” parameter.


    There are some additional parameters for authentication for example to handle
    HTTP basic authentication with username and password or for more complex GSSAPI-Kerberos
    scenarios using httplib2 Python library.


    Let me also highlight that we could also specify the permission and SELinux properties.


    ## demo


    How to download a tar.gz file from Internet and verify the SHA256 checksum with
    Ansible.


    get_url.yml


    1 --- 2 - name: get_url module demo 3   hosts: all 4   become: false 5   vars:
    6     myurl: "https://releases.ansible.com/ansible/ansible-\ 7 2.9.25.tar.gz"
    8     mycrc: "sha256:https://releases.ansible.com/ansible/a\ 9 nsible-2.9.25.tar.gz.sha"
    10     mydest: "/home/devops" 11   tasks: 12     - name: download file 13    
      ansible.builtin.get_url: 14         url: "{{ myurl }}" 15         dest: "{{
    mydest }}" 16         checksum: "{{ mycrc }}" 17         mode: ''0644'' 18    
        owner: devops 19         group: wheel


    ## Extract an archive - Ansible module unarchive


    How to download a zip file and extract it in a user home directory. The playbook
    is also taking care of the necessary softwre dependencies.


    Let’s talk about the Ansible module unarchive.


    The full name is ansible.builtin.unarchive, which means that is part of the collection
    of modules “builtin” with ansible and shipped with it.


    It’s a module pretty stable and out for years.


    It works in a different variety of operating systems.


    It unpacks one archive after (optionally) copying it from the local machine


    It can handle .zip files using unzip as well as .tar, .tar.gz, .tar.bz2, .tar.xz,
    and .tar.zst files using gtar. It requires zipinfo,gtar and unzip command on target
    host.


    Please note that it requires a tarball (.tar archive) for the Unix file format.


    For Windows targets, use the Ansible community.windows.win_unzip module.


    ## Parameters


    src string - path


    dest string - path


    remote_src boolean - no/yes


    validate_certs boolean - no/yes (https only)


    include/exclude list - directory and file entries


    extra_opts string - command-line options


    keep_newer boolean - no/yes


    mode/owner/group - permission


    setype/seuser/selevel - SELinux


    The only mandatory parameters are src and dst which are the source and destination
    paths. The src is quite special because is supposed to be a local path on the
    Ansible controller.


    We could switch to a remote path enabling the “remote_src” properties.


    In the src parameter we could also enter a URL, so the archive is going to be
    downloaded before being expanded.


    Other useful parameters are include and exclude that allows us to specify a subset
    of the archive to extract, specifically a list of inclusion or exclusion files
    or directories.


    Just in case we need some extra command-line options we could specify in the extra_opts
    parameter.


    If the files are already present on the target machine the default behavior is
    to not replace existing files that are newer than files from the archive, you
    could override enabling the keep_newer parameter.


    Let me also highlight that we could also specify some permissions or SELinux properties.


    ## demo


    How to extract an archive in Ansible Playbook with Ansible.


    unarchive.yml


    1 --- 2 - name: unarchive module demo 3   hosts: all 4   become: false 5   vars:
    6     myurl: "https://github.com/lucab85/ansible-pilot/arch\ 7 ive/refs/heads/master.zip"
    8   tasks: 9     - name: extractor presents 10       ansible.builtin.yum: 11  
          name: 12           - unzip 13           - tar 14         state: present
    15       become: true 16 - name: extract archive 17       ansible.builtin.unarchive:
    18         src: "{{ myurl }}" 19         dest: "/home/devops/" 20         remote_src:
    true 21         validate_certs: true


    ## Create a symbolic link (also symlink or soft link) in Linux - Ansible module
    file


    How to create an “example” symbolic/soft link to “/proc/cpuinfo” on Linux filesystem
    using Ansible.


    ## Ansible create a symbolic link


    ansible.builtin.file


    Manage files and file properties


    Let’s talk about the Ansible module file.


    The full name is ansible.builtin.file, which means that is part of the collection
    of modules “builtin” with ansible and shipped with it.


    It’s a module pretty stable and out for years.


    It works in a different variety of operating systems.


    It manages files and file properties.


    For Windows targets, use the ansible.windows.win_file module instead.


    See also Create a hard link in Linux - Ansible module file


    ## Parameters


    src string - symlink path


    dest string - destination file path


    state string - file/absent/symbolic link/hard/link/touch


    mode/owner/group - permission


    setype/seuser/selevel - SELinux


    This module has some parameters to perform any tasks.


    The two required fields are “src” and “dest” which specify the filesystem paths
    of the link and the target file.


    The state defines the type of object we are modifying, the default is “file” but
    for our use case, we need the “link” option.


    Let me highlight also the permission and SELinux parameters.


    ## demo


    How to create an “example” symbolic/soft link to “/proc/cpuinfo” on Linux filesystem
    using Ansible.


    code


    create_symlink.yml


    1 --- 2 - name: file module demo 3   hosts: all 4   vars: 5     mylink: "~/example"
    6     mysrc: "/proc/cpuinfo" 7   tasks: 8     - name: Creating a symlink 9    
      ansible.builtin.file: 10         src: "{{ mysrc }}" 11         dest: "{{ mylink
    }}" 12         state: link


    execution


    1 $ ansible-playbook -i demo/inventory create\ symlink/file\ 2 .yml 3 PLAY [file
    module demo] *********************************\ 4 ************************************
    5 TASK [Gathering Facts] **********************************\ 6 ************************************
    7 ok: [demo.example.com] 8 TASK [Creating a symlink] *******************************\
    9 ************************************ 10 changed: [demo.example.com] 11 PLAY
    RECAP **********************************************\ 12 ************************************
    13 demo.example.com          : ok=2    changed=1    unreach\ 14 able=0    failed=0 
      skipped=0    rescued=0    ignored=0


    before execution


    1 $ ssh devops@demo.example.com 2 [devops@demo ~]$ ls -al 3 total 16 4 drwx------.
    4 devops wheel  111 Nov 14 14:26 . 5 drwxr-xr-x. 5 root  root    50 Nov  8 17:07
    .. 6 drwx------. 3 devops wheel  17 Sep  6 05:53 .ansible 7 -rw-------. 1 devops
    wheel 3055 Nov 14 14:26 .bash_history 8 -rw-r--r--. 1 devops wheel  18 Dec  4 
    2020 .bash_logout 9 -rw-r--r--. 1 devops wheel  141 Dec  4  2020 .bash_profile
    10 -rw-r--r--. 1 devops wheel  376 Dec  4  2020 .bashrc 11 drwx------. 2 devops
    wheel  94 Sep 16 10:09 .ssh 12 [devops@demo ~]$


