    \n    mydest: \"/home/devops\"\n  tasks:\n    - name: download file\n      ansible.builtin.get_url:\n\
    \        url: \"{{ myurl }}\"\n        dest: \"{{ mydest }}\"\n        checksum:\
    \ \"{{ mycrc }}\"\n        mode: '0644'\n        owner: devops\n        group:\
    \ wheel\n```\n\n# 解压存档 - Ansible unarchive 模块\n\n如何下载 zip 文件并将其解压到用户主目录下。该 Playbook\
    \ 还会处理必要的软件依赖项。\n\n让我们 true Ansible 模块 `unarchive`。\n\n全名是 `ansible.builtin.unarchive`，这意味着它是\
    \ ansible `builtin` 模块集合的一部分，并随 ansible 一起发布。\n\n这是一个非常稳定且已发布多年的模块。\n\n它可以在不同的操作系统中工作。\n\
    \n它会在（可选地）从本地机器复制存档后解压它。\n\n它可以使用 `unzip` 处理 `.zip` 文件，可以使用 `gtar` 处理 `.tar`、`.tar.gz`、`.tar.bz2`、`.tar.xz`\
    \ 和 `.tar.zst` 文件。它要求目标主机上有 `zipinfo`、`gtar` 和 `unzip` 命令。\n\n请注意，对于 Unix 文件格式，它需要一个\
