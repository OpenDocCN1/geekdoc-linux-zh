    Ansible for Linux Filesystem


    How to automate the interraction with Linux filesystem with Ansible. For example:
    file and directory creation, permission and delete.


    ## Create an empty file - Ansible module file


    How to create an empty ~/example.txt file or update the time of an already create
    file.


    ## Ansible create an empty file


    Let’s talk about the Ansible module file.


    The full name is ansible.builtin.file, which means that is part of the collection
    of modules “builtin” with ansible and shipped with it.


    It’s a module pretty stable and out for years.


    It works in a different variety of operating systems.


    It manages files and file properties.


    For Windows targets, use the ansible.windows.win_file module instead.


    ## Main Parameters


    path string (dest, name) - file path


    state string - file/absent/directory/hard/link/touch


    This module has some parameters to perform any tasks.


    The only required is “path”, where you specify the file system path of the file
    you’re going to edit.


    The state defines the type of object we are modifying, the default is “file” but
    for our use case, we need the “touch” option.


    ## demo


    How to create an empty ~/example.txt file or update the time of an already create
    file with Ansible.


    file.yml


    1 --- 2 - name: file module demo 3   hosts: all 4   vars: 5     myfile: "~/example.txt"
    6   tasks: 7     - name: Creating an empty file 8       ansible.builtin.file:
    9         path: "{{ myfile }}" 10         state: touch


    ## Create a text file - Ansible module copy


    How to automate the creation of a text file with Ansible.


    Let’s talk about Ansible module copy.


    The full name is ansible.builtin.copy which means is part of the collection of
    modules “builtin” with ansible and shipped with it.


    This module is pretty stable and out for years.


    The purpose is to copy files to remote locations but it’s also capable to create
    some simple text files.


    If you need a more complex configuration it’s better to rely on the template module.


    ## Parameters


    dest path - destination file


    content string - text


    mode/owner/group - permission


    setype/seuser/selevel - SELinux


    The only required parameter is dest which specifies the remote absolute path destination.


    The content parameter sets the contents of a file directly to the specified value.
    It works only when dest is a file/


    Please note that if you use a variable in the content parameter will result in
    unpredictable output.


    For advanced formatting or if the content contains a variable, use the ansible.builtin.template
    module.


    Let me also highlight that we could also specify the permissions and SELinux properties.


    ## demo


    How to create an empty file ~/example.txt in Linux with Ansible.


    code


    copy.yml


    1 --- 2 - name: copy module demo 3   hosts: all 4   vars: 5     myfile: "{{ ~/example.txt
    }}" 6   tasks: 7   - name: create a text file 8     ansible.builtin.copy: 9  
        dest: "{{ myfile }}" 10       content: | 11         line 1 12         line
    2


    ## Check if a file exists - Ansible module stat


    How to check if a file exists in Ansible?


    Let’s talk about the Ansible module stat.


    The full name is ansible.builtin.stat, which means that is part of the collection
    of modules “builtin” with ansible and shipped with it.


    It’s a module pretty stable and out for years.


    It works in a different variety of operating systems.


    It retrieves a file entry or a file system status.


    For Windows target use the ansible.windows.win_stat module instead.


    ## Mandatory Parameters


    path string


    ## Main Return Values


    stat complex - exists


    The only mandatory parameter is “path” which is the filesystem full path of the
    object to check.


    The module returns a complex object, the property that is interesting for us is
    “exists”. This attribute is “true” if the object exists.


    ## demo


    Let’s jump in a real-life playbook to check if a file exists with Ansible.


    code


    file_exist.yml


    1 --- 2 - name: check if a file exist 3   hosts: all 4   become: false 5   vars:
    6     myfile: /home/devops/test.txt 7   tasks: 8     - name: check if a file exists
    9       ansible.builtin.stat: 10         path: "{{ myfile }}" 11       register:
    file_data 12 - name: report file exists 13       ansible.builtin.debug: 14    
        msg: "The file {{ myfile }} exist" 15       when: file_data.stat.exists 16
    - name: report file not exists 17       ansible.builtin.debug: 18         msg:
    "The file {{ myfile }} doesn''t exist" 19       when: not file_data.stat.exists


    ## How to create a directory with Ansible?


    How to automate the creation of “example” directory with Ansible.


    ansible.builtin.file


    Manage files and file properties'
