    ## How to install Ansible in Amazon Linux 2 (EC2)


    How to install Ansible in Amazon Linux 2 using the Amazon Extras Library and `EPEL`
    (Extra Packages for Enterprise Linux) repositories.


    The easier way to install and maintain Ansible inside Amazon Linux 2 are using
    the Amazon Extras Library and `EPEL`.


    ## How to install Ansible in Amazon Linux 2


    `ansible2` topic in Extras Library


    `ansible` in Extra Packages for Enterprise Linux


    `radically simple model-driven configuration management, multi-node deployment,
    and remote task execution system. Ansible works over SSH and does not require
    any software or daemons to be installed on remote nodes. Extension modules can
    be written in any language and are transferred to managed machines automatically.


    The good news is that `ansible2` is included in the Extras Library included in
    Amazon Linux 2 repository using the `amazon-linux-extras` command.


    Another option is to install and maintain Ansible inside Amazon Linux 2 is using
    the Extra Packages for Enterprise Linux (`EPEL`) additional repository.


    This repository is maintained by the Fedora Special Interest Group and manages
    a high-quality set of additional packages for Enterprise Linux: Red Hat Enterprise
    Linux (`RHEL`), Rocky Linux and Scientific Linux (`SL`), Oracle Linux (`OL`),
    and Amazon Linux.


    ## Links


    - [Amazon Linux 2](https://aws.amazon.com/it/amazon-linux-2/)

    - [How do I enable the EPEL repository for my Amazon EC2 instance running CentOS,
    RHEL, or Amazon Linux?](https://aws.amazon.com/it/premiumsupport/knowledge-center/ec2-enable-epel/)

    - [Extras library (Amazon Linux 2)](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/amazon-linux-ami-basics.html#extras-library)

    - [Extra Packages for Enterprise Linux (EPEL)](https://docs.fedoraproject.org/en-US/epel/)


    ## Demo


    How to install Ansible in Amazon Linux (EC2) 2 using the Amazon Extras Library
    and `EPEL` repositories.


    ## Amazon Extras Library code


    `Install-Ansible-Amazon Linux2-Amazon Extras Library.sh`


    ```bash

    #!/bin/bash

    sudo yum update -y

    sudo amazon-linux-extras install ansible2 -y

    ansible --version

    ```


