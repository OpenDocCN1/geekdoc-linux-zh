    ## Mount an NFS share in Linux - Ansible module mount


    ## How to mount an NFS share in Linux. The Ansible Playbook code is going to check
    the required packages, create the mount-point, and set up the NFS network shared
    folder using NFS4 protocol on the Linux target machine. Code for RedHat-like and
    Debian-like systems.


    ## Ansible mounts an NFS Share in Linux


    ## ansible.posix.mount


    ## Control active and configured mount points


    ## Today we’re talking about the Ansible module mount.


    ## The full name is ansible.posix.mount, which means that is part of the collection
    of modules “ansible.posix” to interact with POSIX platforms.


    ## The purpose of the module is to control active and configured mount points.


    ## For Windows, use the community.windows.win_mapped_drive module instead.


    ## Parameters


    ## path string - mount point (e.g. /mnt)


    ## state string - mounted / unmounted / present / absent / remounted


    ## src string - device or network volume


    ## fstype string - ext4, xfs, iso9660, nfs, cifs, etc.


    ## opts string- mount options


    ## This module has many parameters to perform any task.


    ## The only required are “path” and “state”.


    ## The parameter “path” specifies the path to the mount point (e.g. /mnt/).


    ## The parameter “state” allows us to verify a specific state of the mount point.
    The options “mounted”, “unmounted” and “remounted” change the device status. The
    “present” and “absent” options only change the /etc/fstab file.


    ## The src parameter specifies the device or network volume for NFS or SMB/CIFS.


    ## The fstype parameter specifies the filesystem type. For example ext4, XFS,
    iso9660, NFS, CIFS, etc.


    ## The opts parameter allows us to specify some mount options, that vary for each
    filesystem type.


    ## demo


    ## Let’s jump in a real-life Ansible Playbook to mount an NFS share in Linux RedHat-like
    and Debian-like.


    ## code


    ## mount_nfs.yml


    1 --- 2 - name: mount module demo 3   hosts: all 4   become: true 5   vars: 6
        mynfs: "192.168.0.200:/nfs/share" 7     mountpoint: "/share" 8     permission:
    ''0777'' 9     myopts: ''rw,sync'' 10   tasks: 11     - name: utility present
    redhat-like 12       ansible.builtin.yum: 13         name: 14           - nfs-utils
    15           - nfs4-acl-tools 16         state: present 17       when: ansible_os_family
    == ''RedHat'' 18 19     - name: utility present debian-like 20       ansible.builtin.apt:
    21         name: 22           - nfs-common 23           - nfs4-acl-tools 24  
          state: present 25       when: ansible_os_family == ''Debian'' 26 27    
    - name: check mountpoint exist 28       ansible.builtin.file: 29         path:
    "{{ mountpoint }}" 30         state: directory 31         mode: "{{ permission
    }}" 32         owner: root 33         group: root 34 35     - name: mount network
    share 36       ansible.posix.mount: 37         src: "{{ mynfs }}" 38         path:
    "{{ mountpoint }}" 39         fstype: nfs 40         opts: "{{ myopts }}" 41  
          state: mounted


