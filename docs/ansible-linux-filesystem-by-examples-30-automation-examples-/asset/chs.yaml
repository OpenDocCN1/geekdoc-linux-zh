  ```\n\n## Linux 版 Ansible\n\n在本章中，你将发现最常用的 Ansible 模块，用于自动化 Linux 管理员任务。\n\n## Ansible\
  \ 术语 - `ansible_hostname` vs `inventory_hostname` vs `ansible_fqdn`\n\n在 Playbook\
  \ 的实际示例中，`ansible_hostname`、`inventory_hostname` 和 `ansible_fqdn` 之间的区别是什么？这两个内部变量有时会让人混淆，但它们从本质上是不同的。\n\
  \n## `ansible_hostname` vs `inventory_hostname` vs `ansible_fqdn`\n\n`ansible_hostname`\
  \ 和 `ansible_fqdn` 从目标机器的事实（facts）中读取：`ansible_hostname` 从 `gather_facts` 期间收集的事实读取主机名。类似于\
  \ `uname -n` 命令。需要启用 `gather_facts`，否则 `ansible_facts` 变量将无法在 playbook 中使用。它等同于目标主机的主机名。\n\
  \n`inventory_hostname` 从 Ansible 清单（inventory）或文件读取：它从 `inventory` 配置或 hosts 文件读取主机名。它可能与远程系统的主机名不同。它可能只是控制机上的一个名称，始终可以在你的\
  \ playbook 中使用。对于 playbook 和即时命令（ad-hoc command），它都可能与目标主机的主机名不同。\n\n## 演示\n\n让我通过一个简单的\
  \ Playbook 向你展示 `ansible_hostname`、`inventory_hostname` 和 `ansible_fqdn` 内部变量之间的区别。\n\
  \n```yaml\n---\n- name: hostnames\n  hosts: all\n  gather_facts: true\n  tasks:\n\
  \    - name: print inventory_hostname\n      ansible.builtin.debug:\n        var:\
  \ inventory_hostname\n    - name: print ansible_hostname\n      ansible.builtin.debug:\n\
  \        var: ansible_hostname\n    - name: print ansible_fqdn\n      ansible.builtin.debug:\n\
  \        var: ansible_fqdn\n```\n\n执行\n\n```\nansible-pilot $ ansible-playbook -i\
  \ statements/hostnames.yml\nPLAY [hostnames] *************************************************\n\
  TASK [Gathering Facts] *************************************************\nok: [foo.example.com]\n\
  TASK [print inventory_hostname] *************************************\nok: [foo.example.com]\
  \ => {\n    \"inventory_hostname\": \"foo.example.com\"\n}\nTASK [print ansible_hostname]\
  \ *****************************************\nok: [foo.example.com] => {\n    \"\
  ansible_hostname\": \"demo\"\n}\nTASK [print ansible_fqdn] ****************************************\n\
  ok: [foo.example.com] => {\n    \"ansible_fqdn\": \"demo.example.com\"\n}\nPLAY\
  \ RECAP *****************************************************************\nfoo.example.com:\
  \ ok=4    changed=0  unreachable=0  failed=0  skipped=0  rescued=0  ignored=0\n\
  ansible-pilot $\n```\n\n#### 等等性（Idempotency）\n\n```\nansible-pilot $ ansible-playbook\
  \ -i statements/hostnames.yml\nPLAY [hostnames] *************************************************\n\
  TASK [Gathering Facts] *************************************************\nok: [foo.example.com]\n\
  TASK [print inventory_hostname] *************************************\nok: [foo.example.com]\
  \ => {\n    \"inventory_hostname\": \"foo.example.com\"\n}\nTASK [print ansible_hostname]\
  \ *****************************************\nok: [foo.example.com] => {\n    \"\
  ansible_hostname\": \"demo\"\n}\nTASK [print ansible_fqdn] ****************************************\n\
  ok: [foo.example.com] => {\n    \"ansible_fqdn\": \"demo.example.com\"\n}\nPLAY\
  \ RECAP *****************************************************************\nfoo.example.com:\
  \ ok=4    changed=0  unreachable=0  failed=0  skipped=0  rescued=0  ignored=0\n\
  ```\n\n## 总结\n\n现在你对内部变量 `ansible_hostname`、`inventory_hostname` 和 `ansible_fqdn`\
  \ 有了更多了解。\n\n\n\n\n\n```yaml\n---\n- name: harmful playbook\n  hosts: all\n  tasks:\n\
  \    - name: harmful task\n      ansible.builtin.debug:\n        msg: \"harmful\
  \ task\"\n```\n\n### 执行结果\n```bash\nansible-pilot $ ansible-playbook --limit demo.example.com\
  \ -i limit/inventory limit/playbook.yml\nPLAY [harmful playbook] *****************************************************************************************************\n\
  TASK [Gathering Facts] *****************************************************************************************************\n\
  ok: [demo.example.com]\nTASK [harmful task] *****************************************************************************************************\n\
  ok: [demo.example.com] => {\n    \"msg\": \"harmful task\"\n}\nPLAY RECAP *********************************************************************************************************************\n\
  demo.example.com          : ok=2    changed=0    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\nansible-pilot $\n```\n\n### 错误的执行\n如果我们忘记了 `--limit`\
  \ 选项，结果可能会非常有害。\n\n```bash\nansible-pilot $ ansible-playbook -i limit/inventory\
  \ limit /playbook.yml\nPLAY [harmful playbook] *****************************************************************************************************\n\
  TASK [Gathering Facts] *****************************************************************************************************\n\
  ok: [demo.example.com]\nok: [demo2.example.com]\nTASK [harmful task] *****************************************************************************************************\n\
  ok: [demo.example.com] => {\n    \"msg\": \"harmful task\"\n}\nok: [demo2.example.com]\
  \ => {\n    \"msg\": \"harmful task\"\n}\nPLAY RECAP *********************************************************************************************************************\n\
  demo.example.com          : ok=2    changed=0    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\ndemo2.example.com         : ok=2    changed=0    unreachable=0\
  \    failed=0    skipped=0    rescued=0    ignored=0\nansible-pilot $\n```\n\n##\
  \ Ansible Playbook 主机\n`hosts: HOSTNAME`\n\n`ansible-playbook PLAYBOOK`\n\n在 Ansible\
  \ Playbook 中使用 `hosts` 语句允许你为执行指定特定的主机或主机组。\n\n其优点是，这比在命令行上使用 `--limit` 参数手动指定主机名更可靠。\n\
  \n缺点是，你每次都必须记得编辑 Ansible Playbook 代码。如果你忘记这样做，你将在指定的主机上执行代码，这仍然是一个潜在的人工操作问题。\n\n\
  ### 代码示例\n`playbook2.yml`\n```yaml\n---\n- name: harmful playbook\n  hosts: demo.example.com\n\
  \  tasks:\n    - name: harmful task\n      ansible.builtin.debug:\n        msg:\
  \ \"harmful task\"\n```\n\n### 执行结果\n```bash\nansible-pilot $ ansible-playbook -i\
  \ limit/inventory limit /playbook2.yml\nPLAY [harmful playbook] *****************************************************************************************************\n\
  TASK [Gathering Facts] *****************************************************************************************************\n\
  ok: [demo.example.com]\nTASK [harmful task] *****************************************************************************************************\n\
  ok: [demo.example.com] => {\n    \"msg\": \"harmful task\"\n}\nPLAY RECAP *********************************************************************************************************************\n\
  demo.example.com          : ok=2    changed=0    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\nansible-pilot $\n```\n\n## Ansible Playbook 主机高级用法\n\
  `hosts: \"{{ HOSTS }}\"`\n\n`ansible-playbook -e \"HOSTS=demo.example.com\" PLAYBOOK`\n\
  \n在 Ansible Playbook 中使用 `hosts` 语句允许你指定一个变量，你可以通过该变量为执行填充一个主机或主机组。\n\n基本上，如果你在命令行上盲目执行\
  \ Ansible Playbook 代码，它将无所作为。唯一的处理方法是通过命令行通过额外变量来填充主机变量。\n\n其优点是，这比使用 `--limit`\
  \ 参数手动指定主机名更可靠。\n\n### 代码示例\n`playbook3.yml`\n```yaml\n---\n- name: harmful playbook\n\
  \  hosts: \"{{ HOSTS }}\"\n  tasks:\n    - name: harmful task\n      ansible.builtin.debug:\n\
  \        msg: \"harmful task\"\n```\n\n### 执行结果\n```bash\nansible-pilot $ ansible-playbook\
  \ -i limit/inventory -e \"HOSTS=demo.example.com\" /playbook3.yml\nPLAY [harmful\
  \ playbook] *********************************************************************************************************************\n\
  TASK [Gathering Facts] *****************************************************************************************************\n\
  ok: [demo.example.com]\nTASK [harmful task] *****************************************************************************************************\n\
  ok: [demo.example.com] => {\n    \"msg\": \"harmful task\"\n}\nPLAY RECAP ********************************************************************************************************************\n\
  demo.example.com          : ok=2    changed=0    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\nansible-pilot $\n```\n\n## 链接\n[模式：目标主机和组](https://docs.ansible.com/ansible/latest/user_guide/intro_patterns.html)\n\
  \n## 测试主机可用性 - Ansible ping\n让我们谈谈 Ansible `ping` 模块。它的全名是 `ansible.builtin.ping`，这意味着它是\
  \ `builtin` 模块集合的一部分并随 Ansible 一起发布。这是一个非常稳定且存在多年的模块。它验证 Ansible 能够登录到被管理主机，并且存在可以执行我们代码的\
  \ Python 解释器。因此，在网络上下文中它非常不同。它是 Windows 对应的 `win_ping` 模块。\n\n### 主要参数和返回值\n`data`\
  \ 字符串：人们通常不指定任何参数或使用返回值。对于参数，可以将行为从默认的 `pong` 更改为在失败时抛出异常的 `crash`。\n`ping` 字符串：默认默认值为\
  \ `pong` 字符串，但你可以通过 `data` 参数进行自定义。\n\n### 示例\n如何使用 ping 模块测试主机可用性。\n```yaml\n---\n\
  - name: ping demo\n  hosts: all\n  become: false\n  tasks:\n    - name: test connection\n\
  \      ansible.builtin.ping:\n```\n\n\n\n\n\n在接下来的示例中，我们将超越打印“Hello world!”文本的范畴，通过打印文本、变量、文本与变量，并向你演示如何使用详细程度级别（verbosity\
  \ level）。\n\n```yaml\n---\n- name: debug module demo 3\n  hosts: all\n  vars:\n\
  \    fruit: \"apple\"\n  tasks:\n    - name: debug message\n      ansible.builtin.debug:\n\
  \        msg: \"our fruit is {{ fruit }}\"\n        verbosity: 2\n```\n\n# Ansible\
  \ 代码复用：使用 Ansible Galaxy 中的 Roles 和 Collections\n\n在本章中，你将发现如何从 Ansible Galaxy 远程目录下载并使用\
  \ Ansible Roles 和 Collection（（集合）。\n\n## 下载并使用 Ansible Galaxy Role - ansible-galaxy\
  \ 和 requirements.yml\n\n如何下载并使用 Ansible Role `lucab85.ansible_role_log4shell` 来扫描我们的\
  \ Linux 机器，以检查 Log4Shell 远程代码执行 Log4j (CVE-2021–44228)，并复用在 Ansible Galaxy 目录中发布的\
  \ Ansible 制品（任务、变量、默认值、处理器、模块和插件）。\n\n## 什么是 Ansible Role？\n\n-   可复用的 Ansible 制件\n\
  -   一个角色包含任务、变量、默认值、处理器、模块或其他其它插件\n-   可以通过 Ansible Galaxy 轻松下载和共享\n\nAnsible Role\
  \ 是一组可复用的 Ansible 制件。它解决一个问题并包含所有相关的任务、变量、默认值、处理器、模块或其他插件。\n\n对于用户来说，Ansible Role\
  \ 容易通过 Ansible Galaxy 下载和共享。对于开发者来说，Ansible Role 容易通过 Ansible Galaxy 上传和共享。此外，Ansible\
  \ role 具有定义的标准目录结构和格式。\n\n## 什么是 Ansible Galaxy？\n\n[Ansible Galaxy](https://galaxy.ansible.com/)\n\
  \n[lucab85/ansible_role_log4shell](https://galaxy.ansible.com/lucab85/ansible_role_log4shell)\n\
  \n该网站可以通过 URL `https://galaxy.ansible.com/` 访问。搜索引擎、标签和平台让你轻松找到其中的任何内容。\n\n我建议你在将其用于系统之前，仔细评估其内容的质量。\n\
  \n质量指标通常包括代码质量保证、支持的操作系统和平台、文档、发布版本、是否存在变更日志（Changelog）、下载次数以及作者或创建。\n\n请注意，该网站包含了\
  \ Ansible Roles 和 Ansible Collections。今天我们关注的是 Ansible Role 内容。\n\n## 链接\n\n-  \
