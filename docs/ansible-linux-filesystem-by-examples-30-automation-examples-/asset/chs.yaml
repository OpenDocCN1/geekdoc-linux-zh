  \ 模块来验证目录是否存在。其全名为 `ansible.builtin.stat`，这意味着它是 `ansible` 内置 `builtin` 模块集合的一部分，并随其一同发布。这是一个非常稳定且已发布多年的模块。它适用于多种操作系统。它获取文件系统的状态。对于\
  \ Windows 目标，请使用 `ansible.windows.win_stat` 模块。\n\n## 主要参数和返回值\n\n- `path`: 强制参数是\
  \ `path`，是要检查的对象的文件系统完整路径。\n- `stat`: 模块返回一个复杂对象，我们感兴趣的属性是 `isdir`。如果对象是目录，则该属性为\
  \ `true`。\n\n## 演示\n\n让我们进入一个真实的 playbook 来检查目录是否存在。\n\n## 代码\n```yaml\ndirectory_check_exists.yml\n\
  ---\n- name: check if the directory exists\n  hosts: all\n  become: false\n  vars:\n\
  \    directory: \"/tmp\"\n  tasks:\n    - name: Check if exists\n      ansible.builtin.stat:\n\
  \        path: \"{{ directory }}\"\n      register: check_file_name\n    - name:\
  \ Directory found\n      ansible.builtin.debug:\n        msg: \"{{ directory }}\
  \ present\"\n      when: check_file_name.stat.isdir\n```\n\n\n\n\n# Ansible 执行输出\n\
