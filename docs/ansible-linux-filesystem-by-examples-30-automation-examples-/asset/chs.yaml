  \ `nfs`, `cifs` 等。\n- `opts` 字符串 - 挂载选项\n\n此模块有许多参数用于执行任何任务。\n\n仅必需参数是 `path` 和\
  \ `state`。\n\n参数 `path` 指定挂载点的路径（例如 `/mnt/`）。\n\n参数 `state` 允许我们验证挂载点的特定状态。`mounted`、`unmounted`\
  \ 和 `remounted` 选项更改设备状态。`present` 和 `absent` 选项仅更改 `/etc/fstab` 文件。\n\n`src` 参数指定\
  \ NFS 或 SMB/CIFS 的设备或网络卷。\n\n`fstype` 参数指定文件系统类型。例如：`ext4`, `xfs`, `iso9660`, `nfs`,\
  \ `cifs` 等。\n\n`opts` 参数允许我们指定某些挂载选项，这些选项因随每个文件系统类型而异。\n\n## 演示\n\n让我们通过一个真实的 Ansible\
  \ Playbook 来挂载 SMB/CIFS 文件系统。\n\n### code\n\n```yaml\nmount_cifs.yml\n---\n- name:\
  \ mount module demo\n  hosts: all\n  become: true\n  vars:\n    uri: \"//windows-pc/share\"\
  \n    username: \"example@domain\"\n    password: \"password\"\n    mountpoint:\
  \ \"/share\"\n  tasks:\n    - name: utility present\n      ansible.builtin.package:\n\
  \        name: cifs-utils\n        state: present\n    - name: check mountpoint\
  \ exist\n      ansible.builtin.file:\n        path: \"{{ mountpoint }}\"\n     \
  \   state: directory\n        mode: '0755'\n        owner: root\n        group:\
  \ root\n    - name: Mount network share\n      ansible.posix.mount:\n        src:\
  \ \"{{ uri }}\"\n        path: \"{{ mountpoint }}\"\n        fstype: cifs\n    \
  \    opts: 'username={{ username }},password={{ password }}'\n        state: mounted\n\
  ```\n\n### execution\n\n```bash\n$ ansible-playbook -i demo/inventory mount drive/cifs.yml\n\
  PLAY [mount module demo] ********************************\nTASK [Gathering Facts]\
  \ *********************************\nok: [demo.example.com]\nTASK [utility present]\
  \ *********************************\nchanged: [demo.example.com]\nTASK [check mountpoint\
  \ exist] ***************************\nchanged: [demo.example.com]\nTASK [Mount network\
  \ share] ******************************\nchanged: [demo.example.com]\nPLAY RECAP\
  \ **********************************************\ndemo.example.com          : ok=4\
  \    changed=3    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n\
