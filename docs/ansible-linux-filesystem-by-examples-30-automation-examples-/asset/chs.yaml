  \ Ansible\n\n### 如何使用 Windows Subsystem for Linux 和 Ubuntu 20.04 LTS 在 Windows 11\
  \ 中安装和维护 Ansible。\n\n### 使用 Windows Subsystem for Linux 在 Windows 11 中安装和维护 Ansible\
  \ 的简单方法。\n\n### 如何在 Windows 11 中安装 Ansible\n\n#### 官方支持\n目前 Windows **并不是**控制节点支持的操作系统，尽管\
  \ RedHat 正在非常努力消除原生 Windows 控制器的障碍。\n\n背后的原因是 Ansible 的大部分功能都深植了许多 UNIX 特性，这导致它无法在原生\
  \ Windows 上运行。从根本上说，Windows 没有 `fork()` 系统调用的实现。从 2.11 版本开始，Ansible 控制器工作模型大量使用了\
  \ POSIX `fork()` 系统调用。\n\n#### Cygwin\n有些人使用了 Cygwin POSIX 兼容性项目，但有时它们会崩溃，因此这并不是一个可靠的解决方案。\n\
  \n#### Windows Subsystem for Linux\n最佳替代方案是使用 Windows Subsystem for Linux，也称为 `WSL`。如果\
  \ Windows 10 版本高于 2004 或使用 Windows 11，请运行 `WSL` 版本 2。Ansible 在 `WSL` 和 `WSL2` 上运行得良好。\n\
  \n## 链接\n\n更多技术信息：\n- [Windows Subsystem for Linux](https://docs.microsoft.com/en-us/windows/wsl/compare-versions)\n\
  - [Ansible on Windows FAQ](https://docs.ansible.com/ansible/latest/user_guide/windows_faq.html)\n\
  - [Windows Subsystem for Linux on Windows 11](https://arstechnica.com/gadgets/2021/10/the-best-part-of-windows-11-is-a-revamped-windows-subsystem-for-linux/)\n\
  \n## 演示\n\n如何使用 Windows Subsystem for Linux 在 Windows 中安装最新或特定版本的 Ansible。\n\n##\
  \ 代码\n\n```bash\ninstall_wsl.ps1\nwsl --help\nwsl --list -o\nwsl --install\n```\n\
  \n## 执行\n\n#### 安装 WSL\n\n```bash\nWindows PowerShell\n2 Copyright (C) Microsoft\
  \ Corporation. All rights reserved.\n\nInstall the latest PowerShell for new features\
  \ and improvements! https://aka.ms/PSWindows\n\nPS C:\\Users\\user> wsl --install\n\
  Installing: Virtual Machine Platform\nVirtual Machine Platform has been installed.\n\
  Installing: Windows Subsystem for Linux\nWindows Subsystem for Linux has been installed.\n\
