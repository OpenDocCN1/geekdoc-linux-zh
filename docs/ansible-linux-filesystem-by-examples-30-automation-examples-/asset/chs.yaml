- "# Ansible Linux文件系统示例\n\n\n\n\n\n\n\n\n\n![publisher's logo](img/image-6UFLYC34.png)\n\
  \n\n\n\n\n\n## 介绍\n\n本书提供了 Ansible 语言的介绍。Ansible 是一种流行的开源自动化工具。它是免费、可移植且极其易用的。无论你是一个自动化领域的新手，本书的目标都是带你快速进入状态。我们将从一个一个示例开始。\n\
  \n## 关于 Luca Berton\n\n我是 Luca Berton，我们将一起度过很多有趣的时光。首先，让我介绍一下自己。\n\n曾在红帽担任 Ansible\
  \ 技术支持工程师，常驻捷克，尽管我是意大利人。我担任系统管理员已超过 15 年，处理了本地部署以及主流云提供商的基础。我是开源的热热者，通过在不同的公开活动中分享知识来支持社区。我还是家乡\
  \ Linux 用户小组的联合创始人，该小组曾接待自由软件运动创始人理查德·斯托曼。\n\n我认为自己是一个懒人，所以我总是尝试新方法来自动化工作中重复性的任务。在经历了多年的\
  \ Perl、Bash 和 Python 脚本编写后，我接触了 Ansible 技术。我通过了认证，并与 Ansible 工程师团队工作了一多年。我认为 Ansible\
  \ 是目前最好的基础设施自动化技术，它是人类可读的，学习曲线容易，且非常受市场招聘人员青睐。\n\n## 奖项与认可\n\n2022\n\n[Ansible Anwendertffen\
  \ - 从零到英雄：如何构建 Ansible Pilot 社区 - 作者 Luca Berton (Red Hat CZ) 15:15 - 16:00 2022\
  \ 年 2 月 15 日](https://www.ansible-anwender.de/post/2022/01/register/)\n\n\n\n\n\n\
  [Red Hat Ansible Playbook 包含在 RHSB-2021-009 Log4Shell 远程代码执行 - log4j (CVE-2021-44228)\
  \ 2022 年 1 月 12 日](https://access.redhat.com/security/vulnerabilities/RHSB-2021-009#diagnose)\n\
  \n[AWS 设置 sysctl 内核参数 — Ansible 模块 sysctl 2022 年 1 月 12 日](https://awstip.com/set-sysctl-kernel-parameters-ansible-module-sysctl-83fc2b3f77f)\n\
  \n[Ansible Bullhorn #41 - Ansible 开发者社区通讯报 2022 年 1 月 7 日](https://mailchi.mp/redhat/the-bullhorn-41)\n\
  \n# 2021\n\n[Ansible Bullhorn #34 - Ansible 开发者社区通讯报 2021 年 9 月 17 日](https://us19.campaign-archive.com/?u=56d874e027110e35dea0e03c1&id=5f02018283)\n\
  \n本课程将持续跟踪 `Ansible` 演进，并在需要时添加更多内容。\n\n你准备好享受其中了吗？\n\n带示例的 Ansible 入门教程\n\n在本章中，你将发现\
  \ Ansible 的基础、架构和术语。\n\n## 什么是 Ansible\n\n在本章中，我将向你解释什么是 Ansible，以及为什么它对你的 IT 部门如此强大。\n\
  \n### Ansible\n\n- 基础设施自动化工具\n- 开源基础设施即代码 (Infrastructure as code)\n\n首先，让我们从名为\
  \ `Ansible` 的卓越开源技术开始我们的冒险吧。它被归类为基础设施自动化工具，因此你可以轻松地自动化你的系统管理员任务。基础设施即代码是通过机器可读的定义文件来管理和配置计算机数据中心的过程，而不是物理硬件配置或交互式配置工具。`Ansible`\
  \ 遵循 DevOps 原则。通过 `Ansible`，你可以在本地以及最知名的公共云提供商上部署你的基础设施即代码。\n\n## Ansible 的三个用例\n\
  \n- 部署 (Provision)\n- 配置管理 (Config management)\n- 应用部署 (Application deployment)\n\
  \n`Ansible` 的三个主要用例是部署、配置管理和应用部署。但在接触这项技术后，我确定你还能发明出更多使用它的方法！\n\n### 部署 (Provisioning)\n\
  \n设置 IT 基础设施的过程\n\n让我们开始谈论部署：所有的系统管理员都知道管理一组统一的机器集群有多重要。某些人仍然依赖软件来创建工作站镜像。但这样做有一个缺点，使用镜像技术你只是获取了机器在某一个时间点的快照。因此，每当你因为现代密钥激活系统需要重新安装软件，或者需要手动更新到最新的安全补丁时，`Ansible`\
  \ 在自动化这一过程非常强大，能够创建一个更顺畅的过程。\n\n### 配置管理 (Configuration management)\n\n将系统和软件维护在预期且一致状态的过程\n\
  \n第二个关键用例是“配置管理”：以更新且一致的方式维护你的整个机器集群，协调滚动更新并调度停机时间。通过 `Ansible`，你可以验证受托管主机的状态，并对其中一小部分主机采取操作。对于最常用的用例，提供了大量的模块。更不用说检查你的集群是否符合某些国际标准并应用解决方案的常见用例了。\n\
  \n### 应用部署 (Application deployment)\n\n在测试、暂存和生产环境之间发布软件的过程\n\n`Ansible` 有用的第三个关键用例是应用部署。例如，它可以自动化\
  \ Web 程序的持续集成/持续交付（CI/CD）工作流流水。你的 DevOps 团队会非常高兴！\n\n## DevOps 中的 Ansible\n\n`Ansible`\
  \ 用于在全球范围内应用 DevOps 原则。让我快速总结一下。\n\nDevOps 是一系列结合软件开发 (Dev) 和 IT 操作 (Ops) 的实践。由于\
  \ DevOps 旨在成为一种跨功能的工作模式，实践该方法的人使用不同的工具集称为“工具链”，而不是单一的工具。这些工具链预计符合以下一个或多个类别，反映了开发和交付过程的关键方面。这七类分别是：\n\
  \n1. **代码 (Code)**：代码开发和评审、源码管理工具、代码合并。\n2. **构建 (Build)**：持续集成工具、构建状态。\n3. **测试\
  \ (Test)**：能够对业务风险提供快速、及时反馈的持续测试工具。\n4. **发布 (Release)**：制品仓库、应用部署前的暂存阶段。\n5. **部署\
  \ (Deploy)**：变更管理、发布审批、发布自动化。\n6. **运维 (Operate)**：基础设施配置和管理、基础设施即代码工具。\n7. **监控\
  \ (Monitor)**：应用性能监控、终端用户体验。\n\n## Ansible 的四个核心原则\n\n1. **声明式 (Declarative)**：你声明你想要什么，而不是如何实现。\n\
  2. **无代理性 (Agentless)**：你不需要安装代理。它利用了 `OpenSSH`。\n3. **幂等性 (Idempotent)**：一个操作可以运行多次而不会产生初始操作之外的变化。\n\
  4. **社区驱动 (Community driven)**：以集合和角色的形式发布在 `Ansible Galaxy` 中。\n\n`ansible` 的四个核心原则是声明式的、无代理的、幂等的和社区驱动的。“声明式”意味着你可以以非常类似于编程语言的方式使用它，在代码流中应用序列、选择和迭代。“无代理”意味着你不需要在目标机器上安装和更新任何代理，它使用\
  \ `SSH` 连接和 `python` 解释器。语言本身是“幂等”的，这意味着代码将检查受托管主机的精确状态。社区驱动意味着以集合和角色的形式发布在 `Ansible\
  \ Galaxy` 中。通过“声明式”意味着你可以以非常类似于编程语言的方式使用它，在代码流中应用序列、选择和迭代。“无代理”意味着你不需要在目标机器上安装和更新任何代理，它使用\
  \ `SSH` 连接和 `python` 解释器。语言本身是“幂等”的，这意味着代码将检查受托管主机的精确状态。社区驱动意味着以集合和角色的形式发布在 `Ansible\
  \ Galaxy` 中。\n\n## Ansible 的六个价值\n\n- **简单**：YAML 可读。\n- **强大**：配置管理、工作流编排、应用部署。\n\
  - **跨平台**：无代理支持所有操作系统、物理、虚拟、云。\n- **与现有工具协作**：统一现有环境。\n- **内置组件**：内置了 750 多个模块。\n\
  - **社区驱动**：每月下载 25 万，3500 名贡献者，1200 名 IRC 用户。\n\n现在让我们来谈谈 `Ansible` 的六个价值。第一个是简单：代码使用\
  \ `YAML` 语言编写，这是一种人类可读的数据序列化语言。它广为人知且易于学习，通常用于存储或传输数据的应用程序。`Ansible` 是强大的：它在配置管理、工作流编排、应用部署方面经过了测试。第三个价值是天然跨平台：无代理支持所有主流操作系统、物理、虚拟、云和网络`Ansible`\
  \ 的另一个价值是它可以与现有工具协作，轻松地统一现有环境。“内置组件”意味着 `Ansible` 内置了 750 多个模块来自动化最常见的任务。最后一个价值是\
  \ `Ansible` 是社区驱动的：每月有 25 万次下载，平均 3500 名贡献者，IRC 上有 1200 名用户。\n\n## Ansible 历史\n\n\
  - **2012**：由 Michael DeHaan 开发\n- **2015**：被 Red Hat 收购\n- **2016**：AnsibleFest\
  \ 活动\n- **2020**：Red Hat Ansible 自动化平台 1.0\n- **2021**：Red Hat Ansible 自动化平台 2.1\n\
  \nAnsible 历史的主要事件如下。\n\n`Ansible` 的第一个版本发布于 2012 年 2 月 20 日。`Ansible` 工具由 Michael\
  \ DeHaan 开发。`Ansible Inc.`（原名为 `AnsibleWorks Inc.`）是为了商业化支持和赞助该项目而成立的公司。\n\n\n\n\
  \n\n2015 年 10 月 16 日，红帽（Red Hat）收购了 Ansible Inc，并将 Ansible 评估为一种“强大的 IT 自动化解决方案”，旨在帮助企业实现无缝\
  \ IT 化。\n\nAnsibleFest 是自 2016 年以来在伦敦和美国举办的 Ansible 用户及贡献者社区年度会议。\n\n# Ansible &\
  \ Ansible Tower & Ansible Automation Platform\n\n### Ansible\n一个社区驱动的项目，创新迭代快，开源的，但仅提供命令行工具。\n\
  \n### Red Hat Ansible Tower / Ansible Automation Platform\n这是一个由红帽设计的框架。它提供了一个 Web\
  \ UI，用于管理您的基础架构。\n\nAnsible 是一个社区驱动的项目，创新迭代快，开源，但仅提供命令行工具。\n\n企业级需要更多的服务和一些稳定版本。例如，它们需要支持方面的\
  \ SLA（服务水平协议）。红帽在 Ansible Tower 伞下为公司提供此类服务，该服务现已重命名为 Ansible Automation Platform。\n\
  \nAnsible Tower 是一个 REST API、Web 服务和基于 Web 的控制台，旨在让不同技术水平和技能的 IT 团队成员更方便地使用 Ansible。它是自动化任务的枢纽。该\
  \ Tower 是红帽公司支持的商业产品，但源自 AWX 上游项目，该项目自 2017 年 9 月起开源。\n\n红帽还维护着 Ansible Engine。通过\
  \ Ansible Engine，组织可以以加固的企业级方式访问底层 Ansible 技术提供的工具和创新。Ansible Engine 由红帽开发，明确意图作为企业\
  \ IT 平台使用。\n\n# 入门\n在本章节中，我将向你解释如何开启 Ansible 技术之旅。如何连接到受管主机以及如何使用命令行执行一些简单任务。\n\n\
  # Ansible 架构\n让我们开始谈论 Ansible 架构。实际安装 Ansible 的节点被称为“控制节点”（control node），它管理你所有的节点集群。另一方面，被管理的节点被称为“受管节点”（managed\
  \ node）。目标节点可以是 Linux、Mac、Windows 以及多种网络设备。每个目标都有某些特性，例如不同的 Linux 发行版和模块用法。我们将在接下来的章节中讨论这些特性。\n\
  \n# 与受管节点的连接\n“控制节点”与“受管节点”之间的连接通过 SSH 协议管理，不需要在目标机器上安装特定的客户端。竞争对手需要通常被称为“代理”（agent）的客户端软件。通过\
  \ SSH 连接，唯一的要求是访问目标机器的用户名和证书。还有一些方法可以自动化这第一个脚本步骤。在完成 SSH 连接后，另一个要求是 `python` 解释器，它是现代操作系统中自带的。默认情况下，Ansible\
  \ 使用 SFTP 传输文件，但你可以在配置中切换到 SCP。Windows 目标可以使用 WinRM 技术连接，并使用 PowerShell 作为解释器。\n\
  \n# 创建基础清单\n`/etc/ansible/hosts`\n\n```\nhost1.example.com\n```\n默认清单文件 `/etc/ansible/hosts`\n\
  \n`host1.example.com` 是一个受管主机。\n\n受管主机列表存储在 `/etc/ansible/hosts` 中。在本示例中，它只包含一个名为\
  \ `host1.example.com` 的主机。\n\n# 运行你的第一个 Ansible 命令\n```\n$ ansible all -m ping 2\
  \ host1.example.org | SUCCESS => { 3     \"ansible_facts\": { 4         \"discovered_interpreter_python\"\
  : \"/usr/bin/python\" 5     }, 6     \"changed\": false, 7     \"ping\": \"pong\"\
  \ 8 }\n```\n`ping` 模块在 `all` 主机上执行。\n\n`host1.example.com` 回了成功代码。\n\n现在我们准备好运行你的第一个\
  \ Ansible 命令了。Ansible 命令在 Ansible 术语中被称为“模块”（module）。第一行在所有主机上执行了 Ansible `ping`\
  \ 模块。响应是 pong。请注意，这意味着 Ansible 能够通过 SSH 用户名连接，使用公钥识别身份并执行本地 python 执行器。因此，它与网络中的任何\
  \ ping 完全不同。\n\n# 在 Ansible 上运行即时命令\n```\n$ ansible all -a “/bin/echo hello” 2 host1.example.org\
  \ | CHANGED | rc=0 >> 3 hello\n```\n`/bin/echo hello` 命令在 `all` 主机上执行。\n\n`host1.example.com`\
  \ 回了变更代码并在标准输出上打印了 `hello`。\n\nAnsible 还可以在目标主机上执行某些命令并在“控制节点”的控制台上报告状态。在本示例中，`/bin/echo\
  \ hello` 命令在 `all` 主机上执行。`host1.example.com` 回了变更代码并在标准输出上打印了 `hello`。请注意，每当你在远程机器上运行命令时，你都会收到“changed”（变更）状态。\n\
  \n# 在 Ansible 上运行带权限提升的即时命令\n```\n$ ansible all -m ping -u devops --become 2 host1.example.org\
  \ | SUCCESS => { 3     \"ansible_facts\": { 4         \"discovered_interpreter_python\"\
  : \"/usr/bin/python\" 5     }, 6     \"changed\": false, 7     \"ping\": \"pong\"\
  \ 8 }\n```\n在以 `devops` 用户登录后，以 `root` 用户身份在 `all` 主机上执行 `ping` 模块。\n\n`host1.example.com`\
  \ 回了变更代码并在标准输出上打印了 `hello`。\n\n在本示例中，我在以 `devops` 用户登录后，以 `root` 用户身份对 `all` 主机运行\
  \ `ping` 模块。`host1.example.com` 回了变更代码并在标准输出上打印了 `hello`。\n\n## 总结\n在本模块中我们学习了 Ansible\
  \ 架构的基础概念、如何编写受管主机列表以及如何对其执行某些命令。\n\n# 清单\n在本章节中，我将向你解释什么是清单、为什么需要它以及不同类型的使用方法。\n\
  \n由 Ansible 管理的多主机列表被称为清单（inventory）。它从根本上是节点或主机的集合，使用组或模式进行选择。\n\n`all` 关键字\n特殊关键字\
  \ `all` 清单中的所有主机。它在后续课程中将非常有用。例外是你需要指定的 `localhost`。\n\n## 简单的 INI 清单\n`./ini_simple_inventory`\n\
  \n```\nhost1.example.com\n\n[webservers]\ntwo.example.com\nthree.example.com\n```\n\
  文件名 `ini_simple_inventory`\n\n`host1.example.com` 未分组。\n\n最简单的清单类型是 INI 清单，取决于文件类型。默认位置是\
  \ `/etc/ansible/hosts`，但你可以通过 `-i` 参数自定义。在本示例中，主机 `host1.example.com` 未分组，`two.example.com`\
  \ 和 `three.example.com` 被组为 `webserver`。\n\n## 简单的 YAML 清单\n`simple_yaml_inventory.yml`\n\
  \n```yaml\n---\nall:\n  hosts:\n    one.example.com:\n  children:\n    webservers:\n\
  \      hosts:\n        two.example.com:\n        three.example.com\n```\n文件名 `inventory.yml`\n\
  \n`one.example.com` 未分组。\n\n`two.example.com` 和 `three.example.com` 被组为 `webserver`。\n\
  \n你可以使用 YAML 语法表达相同的清单。在本示例中，与 INI 示例相同。\n\n## 添加主机范围\n`./ini_range_inventory`\n\
  \n```\n[webservers]\nwww[01:99].example.com\n\n[databases]\ndb-[a-f].example.com\n\
  ```\n`webservers` 组包含从 `www01.example.com` 到 `www99.example.com` 的所有主机。\n\n`databases`\
  \ 组包含从 `db-a.example.com` 到 `db-f.example.com` 的所有主机，\n\n\n\n\n\n组成员也可以使用数字或字母范围来定义。在数字范围内，你还可以指定一个步长（stride），即数字序列之间的增量。在这个\
  \ INI 示例中，“webservers”组包含了从 `www01.example.com` 到 `www99.example.com` 的所有主机。“databases”组包含了从\
  \ `db-a.example.com` 到 `db-f.example.com` 的所有主机。\n\n## 多个组中的主机\n\n`./ini_groupsmultiple_inventory`\n\
  \n```ini\n1 one.example.com 2 3 [webservers] 4 two.example.com 5 three.example.com\
  \ 6 7 [prod] 8 two.example.com 9 10 [dev] 11 three.example.com\n```\n\n主机 `two.example.com`\
  \ 和 `three.example.com` 存在于多个组中。\n\n主机可以存在于多个组。在这个 INI 示例中，主机 `two.example.com`\
  \ 和 `three.example.com` 被分在 `webserver` 中。`two.example.com` 于 `webserver` 组同时也于\
  \ `prod` 组。\n\n`three.example.com` 存在于 `webserver` 和 `dev` 组。\n\n## 主机变量\n\n`./ini_host_inventory`\n\
  \n```ini\n1 [webservers] 2 localhost ansible_connection=local 3 one.example.com\
  \ ansible_connection=ssh ansible_user=devops 4 two.example.com ansible_connection=ssh\
  \ ansible_user=ansible\\ 5 le\n```\n\n对 `ansible_connection` 和 `ansible_user` 变量进行自定义。\n\
  \n在清单，你可能想要存储与特定主机或组相关的变量值。这种场景很常见，因为它定义了与不同主机不同的连接。例如，对 localhost 使用 `local` 连接，对所有其他主机使用默认的\
  \ `ssh` 连接。对于每个主机，你还可以自定义登录用户：`one.example.com` 使用 `devops`，`two.example.com` 使用\
  \ `ansible`。\n\n## 组变量\n\n`./ini_groupsvariables_inventory`\n\n```ini\n1 [webservers]\
  \ 2 one.example.com 3 two.example.com 4 5 [webservers:vars] 6 ntp_server=europe.pool.ntp.org\n\
  ```\n\n`./inventory.yml`\n\n```yaml\n1 --- 2 webservers: 3   hosts: 4     two.example.com:\
  \ 5     three.example.com: 6   vars: 7     ntp_server: europe.pool.ntp.org\n```\n\
  \n正如单主机一样，也可以定义组变量。在示例的这两个清单文件（INI 和 YAML 格式）中，变量 `ntp_server` 为该组的所有主机被分配了值 `europe.pool.ntp.org`。\n\
  \n## 变量变量值的继承\n\n`./ini_variableinheriting_inventory`\n\n```ini\n1 [asia] 2 host1.example.com\
  \ 3 4 [europe] 5 host2.example.com 6 7 [webserver:children] 8 asia 9 europe 10 11\
  \ [webservers:vars] 12 ntp_server=europe.pool.ntp.org\n```\n\n`./variableinheriting_inventory.yml`\n\
  \n```yaml\n1 --- 2 children: 3   webservers: 4     children: 5       asia: 6   \
  \      hosts: 7           host1.example.com: 8       europe: 9         hosts: 10\
  \           host2.example.com: 11     vars: 12       ntp_server: europe.pool.ntp.org\n\
  ```\n\n主机和组可以组合在一起。在这个示例中，`webserver` 组有两个成员 `asia` 和 `europe`。这两个元素分别被定义为单个主机 `host1.example.com`\
  \ 和 `host2.example.com`，但也可以包含更多主机。`ntp_server` 变量定义在 `webservers` 级别。因此最后 `ntp_server`\
  \ 变量对 `webserver`、`asia` 和 `europe` 组可用。`ntp_server` 变量在 `host1.example.com` 和 `host2.example.com`\
  \ 主机同样可用。\n\n## 使用多个清单源\n\n```bash\n$ ansible-playbook playbook.yml -i production\
  \ -i development\n```\n\n针对 `production` 和 `development` 执行名为 `playbook.yml` 的 ansible\
  \ playbook。\n\n在每次执行时可以使用多个清单文件。在这个示例中，将针对 `production` 和 `development` 清单执行名为 `playbook.yml`\
  \ 的 ansible playbook。\n\n## localhost 清单\n\n`./ini_local_inventory`\n\n```ini\n\
  1 localhost ansible_connection=\"local\"\n```\n\n文件名：`inventory`\n\n默认路径：`/etc/ansible/hosts`\n\
  \n清单中的一个特殊情况是 `localhost`。你需要指定连接类型为 `local`，否则 Ansible 将假定使用默认的 SSH 连接。\n\n## 总结\n\
  \n现在你对 Ansible INI 和 YAML 清单文件、主机和组变量有了更多的了解。\n\n## Playbook\n\n在本章中，我将向你解释什么是 Ansible\
  \ Playbook 以及你为什么需要它。我们将涵盖如何从一个简单的 playbook 开始，从基础语法到操作。\n\n## YAML 语法\n\n在本章中，我将向你解释什么是\
  \ Ansible Playbook 以及你为什么需要它。我们将涵盖如何从一个简单的 playbook 开始，从基础语法到操作。\n\nYAML 是一种易读易写的数据序列化语言。它用于\
  \ Ansible playbook 和清单文件。\n\nYAML 使用了几种数据类型：\n- 键值对 (Key-value pairs)\n- 列表 (Lists)\n\
  - 标量 (Scalars)\n- 字典 (Dictionaries)\n\nYAML 文件的示例：\n\n```yaml\n- name: My first\
  \ playbook\n  hosts: all\n  tasks:\n    - name: Print message\n      debug:\n  \
  \      msg: \"Hello World\"\n```\n\nYAML 对缩进敏感，这意味着使用一致的空格数很重要。\n\n## helloworld.yml\n\
  \n```yaml\n---\n- name: My first playbook\n  hosts: all\n  tasks:\n    - name: Print\
  \ message\n      debug:\n        msg: \"Hello World!\"\n```\n\n这是执行 `helloworld.yml`\
  \ 的输出。我想让你注意，使用的命令是 `ansible-playbook`。第一个参数是清单文件，第二个是 playbook。\n\n\n\n\n\n`helloworld_debug.yml`\n\
  \n```yaml\n---\n- name: Hello World sample\n  hosts: all\n  tasks:\n    - name:\
  \ Hello message\n      debug:\n        msg: \"Hello World!\"\n        verbosity:\
  \ 2\n...\n```\n\n1. 文件名：`helloworld_debug.yml`\n2. Playbook 的名称\n3. 执行主机\n4. 任务列表\n\
  5. 一个名为“Hello message”的任务\n6. `debug` 模块\n7. `debug` 模块的参数 `msg`\n8. 参数 `varbosity`（此处原文误）为“2”\n\
  \n此提示允许你将调试代码保留在 playbook 中，并仅在需要时启用执行。例如，只有在调用 Ansible 且指定输出级别为二时，才会打印消息。\n\n##\
  \ helloworld_debug.yml - 执行 - 部分 1\n\n```bash\n1 ansible-playbook -i inventory helloworld_debug.yml\n\
  2 PLAY [Hello World sample] *******************************\\\n3 *********************************************************\\\
  \n4 ***********\n5\n6 TASK [Gathering Facts] **********************************\\\
  \n7 *********************************************************\\\n8 ********\n9 ok:\
  \ [host1.example.com]\n10\n11 TASK [Hello message] ************************************\\\
  \n12 *********************************************************\\\n13 ******\n14\
  \ skipping: [host1.example.com]\n15\n16 PLAY RECAP **********************************************\n\
  17 *****************************************************\n18 host1.example.com \
  \     : ok=1    changed=0    unreachable\n19 e=0    failed=0    skipped=1    rescued=0\
  \    ignored=0\n```\n\n这是 `helloworld_debug.yml` 在正常执行（即非调试模式）时的输出。如你所见，hello 消息被跳过了。\n\
  \n## helloworld_debug.yml - 执行 - 部分 2\n\n```bash\n1 $ ansible-playbook -i inventory\
  \ -vv helloworld_debug.yml\n2 PLAY [Hello World sample] *******************************\\\
  \n3 *********************************************************\\\n4 ***********\n\
  5 TASK [Gathering Facts] **********************************\\\n6 *********************************************************\\\
  \n7 ********\n8 ok: [host1.example.com]\n9 TASK [Hello message] ************************************\\\
  \n10 *********************************************************\\\n11 ******\n12\
  \ ok: [host1.example.com] => {\n13     \"msg\": \"Hello World!\"\n14 }\n15 PLAY\
  \ RECAP **********************************************\n16 *****************************************************\n\
  17 host1.example.com      : ok=2    changed=0    unreachable\n18 e=0    failed=0\
  \    skipped=1    rescued=0    ignored=0\n```\n\n这是 `helloworld_debug.yml` 在调试级别二模式下执行时的输出，请注意命令行中的两个“V”。如你所见，hello\
  \ 消息被打印了。\n\n## 等幂性 (Idempotency)\n\n1 等幂性\n2 模块检查期望的最终状态是否已实现，否则执行\n\n大多数 Ansible\
  \ 模块的一个重要特性是“等幂性”的。这意味着在目标节点上执行任何操作之前，模块将检查实际状态。如果实际状态与预期状态匹配，则将不执行任何操作。如果当前状态偏离预期状态，则将发生操作。请注意，如果你再次执行该\
  \ playbook，将发现期望状态已存在，且不会执行进一步的操作。这一属性被称为“等幂性”，你应该充分利用它。\n\n## multipleplays.yml\n\
  \n```yaml\n1 ---\n2 - name: first play\n3   hosts: web.example.com\n4   tasks:\n\
  5     - name: first task\n6       ansible.builtin.yum:\n         name: httpd\n \
  \        status: present\n7     - name: second task\n8       ansible.builtin.service:\n\
  \         name: httpd\n         enabled: true\n9 - name: second play\n10  hosts:\
  \ database.example.com\n11  tasks:\n12    - name: first task\n13       ansible.builtin.service:\n\
  \         name: mariadb\n         enabled: true\n```\n\n文件名：`multipleplays.yml`\n\
  \n内部包含两个针对 `web.example.com` 和 `database.example.com` 执行的 play。\n\n`multipleplays.yml`\
  \ playbook 包含两个 play。第一个 play 在 `web.example.com` 主机上执行，安装 apache Web 服务器并设置开机自启。第二个\
  \ play 将在 `database.example.com` 上执行并设置开机自启。\n\n## privilegeescalation.yml\n\n```yaml\n\
  1 ---\n2 - name: install httpd\n3   hosts: web.example.com\n4   become: true\n5\
  \   become_method: sudo\n6   become_user: root\n7   tasks:\n8     - name: first\
  \ task\n9       ansible.builtin.yum:\n         name: httpd\n         status: present\n\
  ```\n\n`privilegeescalation.yml`\n\n`become` 指定必要的权限\n`become_method` 指定方法\n`become_user`\
  \ 指定 root 用户\n\n## 最常用的 Ansible 模块\n\n文件模块 (Files modules)\n`copy`: 将本地文件复制到托管主机\n\
  `fetch`: 从远程节点复制文件到本地\n`file`: 设置权限和其他属性\n`lineinfile`: 确保文件中存在某特定行\n`synchronize`:\
  \ 使用 `rsync` 同步内容\n\n软件包模块 (Software package modules)\n`package`: 管理操作系统原生软件包\n\
  `yum`: 使用 YUM 管理软件包\n`apt`: 使用 APT 管理软件包\n`dnf`: 使用 DNF 管理软件包\n`gem`: 管理 Ruby 包\n\
  `pip`: 管理 Python 包\n\n系统模块 (System modules)\n`firewalld`: 管理任意端口和服务\n`reboot`: 重启机器\n\
  `service`: 管理服务\n`user`: 添加、删除和管理用户账户\n\n网络工具模块 (Net tools modules)\n`get_url`:\
  \ 通过 HTTP、HTTPS 和 FTP 下载文件\n`nmcli`: 管理网络\n`uri`: 与 Web 服务交互\n\n## 总结 (Recap)\n\n\
  在本模块中为后续操作奠定了基础。继续努力，很快就能自动化所有的系统任务。\n\n## 变量 (Variables)\n\n在本章中，我将为你解释什么是变量、为什么需要它们、不同类型以及如何使用它们。\n\
  \n1 变量为给环境存储动态值。\n\n在你的 Playbook 中，使用变量存储所有需要的动态值是一个良好的实践。通过编辑变量，你可以在未来复用代码，只需对业务需求进行参数化。\n\
  \n\n\n\n\n`variableprint.yml` playbook 与 `helloworlds.yml` playbook 类似。它们的语法和元素结构非常相似，区别在于存在变量\
  \ `fruit`。变量存储信息，如字符串、数字以及更复杂的数据结构（如列表、字典等）。在这种情况下，变量名为 `fruit`，值为 `apple`。在此案例中，`debug`\
  \ 模块将文本 `Print the value of variable` 与变量 `fruit` 的值进行拼接。请注意双括号，它表示变量的值。一种最佳实践是始终在代码中的双引号内包含双括号。\n\
  \n## variableprint.yml - 执行\n\n```\n1 $ ansible-playbook -i inventory variableprint.yml\
  \ 2 PLAY [Variable print sample] ****************************\\ 3 ***********************\
  \ 4 5 TASK [Gathering Facts] **********************************\\ 6 ***********************\
  \ 7 ok: [host1.example.com] 8 9 TASK [Print variable] ***********************************\\\
  \ 10 *********************** 11 ok: [host1.example.com] => { 12     \"msg\": \"\
  Print the value of variable apple\" 13 } 14 15 PLAY RECAP **********************************************\\\
  \ 16 *********************** 17 host1.example.com  : ok=2    changed=0    unreachable=0\
  \  \\ 18 failed=0    skipped=0    rescued=0    ignored=0\n```\n\n`variableprint.yml`\
  \ 的执行输出与 `helloworld.yml` 文件的输出非常相似。请注意通过组合字符串与变量值而得到的消息 `Print the value of variable\
  \ apple`。此外，正如执行摘要（play recap）区域和绿色所示，此执行是成功的。有两个任务正在执行。\n\n## variableprint.yml\
  \ - 额外变量\n\n```\n1 $ ansible-playbook -i inventory  -e fruit=banana  variabl\\ 2\
  \ eprint.yml 3 PLAY [Variable print sample] ****************************\\ 4 ***********************\
  \ 5 6 TASK [Gathering Facts] **********************************\\ 7 ***********************\
  \ 8 ok: [host1.example.com] 9 10 TASK [Print variable] ***********************************\\\
  \ 11 *********************** 12 ok: [host1.example.com] => { 13     \"msg\": \"\
  Print the value of variable banana\" 14 } 15 16 PLAY RECAP **********************************************\\\
  \ 17 *********************** 18 host1.example.com  : ok=2    changed=0    unreachable=0\
  \  \\ 19 failed=0    skipped=0    rescued=0    ignored=0\n```\n\n你可以通过从命令行指定值来覆盖\
  \ playbook 变量。在命令行上设置的变量被称为额外变量（extra variables）。\n\n`variableprint.yml` 的执行输出与之前的相似。请注意通过组合字符串与变量值而得到的消息\
  \ `Print the value of variable banana`。从命令行传递的值会覆盖任何 playbook 的值。\n\n## 主机变量与组变量\n\
  \n### inventory_host_variables\n```\n1 [servers] 2 host1.example.com ansible_user=devops\n\
  ```\n\n### inventory_group_variables\n```\n1 [servers] 2 host1.example.com 3 host2.example.com\
  \ 4 5 [servers:vars] 6 user=alice\n```\n\n主机变量和组变量可以定义在清单文件中。在左列中，你可以看到主机变量的示例。变量\
  \ `ansible_user` 被赋值为 `devops`。该主机变量适用于 `host1.example.com`。在右列中，你看到组变量的示例。变量 `user`\
  \ 被赋值为 `alice`。该组变量将适用于 `host1.example.com` 和 `host2.example.com`，且值相同。\n\n### inventory_host_dir\n\
  ```\n1 [servers] 2 host1.example.com\n```\n### host_vars/demo1.example.com\n```\n\
  1 ansible_user=devops\n```\n\n### inventory_group_dir\n```\n1 [servers] 2 host1.example.com\
  \ 3 host2.example.com\n```\n\n### group_vars/servers\n```\n1 user=alice\n```\n\n\
  你也可以使用目录来填充主机和组变量以达到相同的结果。如你所见，结果将与之前的幻灯片相同，但使用了更多的文件。在左列中，你可以看到主机变量的示例。变量 `ansible_user`\
  \ 被赋值为 `devops`。该主机变量适用于 `host1.example.com`。在右列中，你看到组变量的示例。变量 `user` 被赋值为 `alice`。该组变量将适用于\
  \ `host1.example.com` 和 `host2.example.com`，且值相同。\n\n## 数组变量\n\n### array.yml\n\
  ```\n1 --- 2 - name: Array sample 3   hosts: all 4   vars: 5     users: 6      \
  \ alice: 7         firstname: Alice 8         homedir: /users/alice 8       bob:\
  \ 10        firstname: Bob 10      homedir: /users/alice\n```\n`1 file name: array.yml\
  \ 2 用户按层级结构组织。 3 4 返回 'Alice' 5 users.alice 6 返回 'Alice' \n\n数组（Array）是一种非常有用的数据结构。你可以按层级结构组织信息。在示例中，用户\
  \ alice 和 bob 的列表易易读。每个元素都有一些属性：firstname 和 homedir。\n\n### array.yml - 执行\n```\n\
  1 $ ansible-playbook -i inventory array.yml 2 PLAY [Array sample] *********************************\\\
  \ 3 *************************************************\\ 4 ***** 5 TASK [Gathering\
  \ Facts] **********************************\\ 6 *************************************************\\\
  \ 7 ********* 8 ok: [host1.example.com] 9 TASK [Print Alice's firstname] **************************\\\
  \ 10 *************************************************\\ 11 *ok: [host1.example.com]\
  \ => { 12     \"msg\": \"Print Alice's firstname: Alice\" 13 } 14 PLAY RECAP **********************************************\\\
  \ 15 *************************************\\ 16 1.example.com  : ok=2    changed=0\
  \    unreachable\\ 17 able=0    failed=0    skipped=0    ignored=0\n```\n\n`array.yml`\
  \ 的执行输出与之前的相似。你可以注意到输出 `Print Alice’s firstname: Alice`。Ansible 访问了数组变量的值并如预期显示在输出中。\n\
  \n## 注册变量\n\n### registeredvariables.yml\n```\n1 --- 2 - name: Installs a package\
  \ and prints the result 3   hosts: all 4   become: true 5   tasks: 6    - name:\
  \ Install the package 7      ansible.builtin.yum: 8        name: wget 9        state:\
  \ installed 10     register: install_result 11 12    - name: debug 13      ansible.builtin.debug:\
  \ 14        var: install_result\n```\n`1 file name: registeredvariables.yml 2 将标准输出存储在变量\
  \ install_result 中 4 也可以被打印`\n\n另一种非常有用的数据结构是注册变量。你可以将任何命令的输出保存到注册变量中。在本示例中，它将打印在屏幕上。\n\
  \n\n\n\n\n```bash\n$ ansible-playbook -i inventory registeredvariables.yml\nPLAY\
  \ [Installs a package and prints the result] *********\nTASK [Gathering Facts] *********************************\n\
  ok: [host1.example.com]\nTASK [Install the package] *****************************\n\
  ok: [host1.example.com]\nTASK [debug] ************************************\nok:\
  \ [host1.example.com] => {\n    \"install_result\": {\n        \"changed\": false,\n\
  \        \"failed\": false,\n        \"msg\": \"Nothing to do\",\n        \"rc\"\
  : 0,\n        \"results\": []\n    }\n}\nPLAY RECAP *********************************************\n\
  host1.example.com          : ok=3    changed=0    unreachable=0    failed=0    skipped=0\
  \    rescued=0    ignored=0\n```\n\n这是 `registeredvariables.yml` 执行后的输出，符合预期。首先，`yum`\
  \ 模块会检查软件包是否存在，如果缺失则进行安装。设置过程的输出存储在一个注册变量中，并打印在屏幕上。\n\n## 总结\n\n在本模块中，我们探索了 Ansible\
  \ Playbook 内部变量的使用。你现在已经了解了用户定义变量、主机变量、组变量和注册变量等工具。\n\n## Facts 和魔法变量\n\n在本章中，我将为你解释什么是\
  \ Ansible facts（事实）和魔法变量（magic variables），你为什么需要它们，它们的不同类型，以及如何在日常工作中编辑和使用它们。\n\n\
  ## Ansible Facts\n\nfacts 是与远程主机相关的变量。\n\n与远程系统相关的变量被称为 facts。通过 facts，你可以将一个系统的行为或状态作为其他系统的配置。它们非常强大，因为你可以获取关于当前主机、操作系统、所使用的发行版、IP\
  \ 地址、网络配置、存储配置等的非常全面的视图。\n\n### 使用临时命令（ad-hoc）列出机器的所有 facts\n\n```bash\n$ ansible\
  \ -m setup hostname\n{\n    \"ansible_all_ipv4_addresses\": [\n        \"REDACTED\
  \ IP ADDRESS\"\n    ],\n    \"ansible_all_ipv6_addresses\": [\n        \"REDACTED\
  \ IPV6 ADDRESS\"\n    ],\n    \"ansible_apparmor\": {\n        \"status\": \"disabled\"\
  \n    },\n    \"ansible_architecture\": \"x86_64\",\n    \"ansible_bios_date\":\
  \ \"11/28/2013\",\n    \"ansible_bios_version\": \"4.1.5\",\n    \"ansible_cmdline\"\
  : {\n        \"BOOT_IMAGE\": \"/boot/vmlinuz-3.10.0-862.14.4.el7.x86_64\",\n   \
  \     \"console\": \"ttyS0,115200\",\n        \"no_timer_check\": true,\n      \
  \  \"nofb\": true,\n        \"nomodeset\": true,\n        \"ro\": true,\n      \
  \  \"root\": \"LABEL=cloudimg-rootfs\",\n        \"vga\": \"normal\"\n    },\n \
  \   \"ansible_date_time\": {\n        \"date\": \"2018-10-25\",\n        \"day\"\
  : \"25\",\n        \"epoch\": \"1540469324\",\n        \"hour\": \"12\",\n     \
  \   \"iso8601\": \"2018-10-25T12:08:44Z\",\n        \"iso8601_basic\": \"20181025T12084419754\"\
  ,\n        \"iso8601_basic_short\": \"20181025T120844\",\n        \"iso8601_micro\"\
  : \"2018-10-25T12:08:44.10968Z\",\n        \"minute\": \"08\",\n        \"month\"\
  : \"10\",\n        \"second\": \"44\",\n        \"time\": \"12:08:44\",\n      \
  \  \"tz\": \"UTC\",\n        \"tz_offset\": \"+000\",\n        \"weekday\": \"Thursday\"\
  ,\n        \"weekday_number\": \"4\",\n        \"year\": \"2018\"\n    },\n    \"\
  ansible_default_ipv4\": {\n        \"address\": \"REDACTED\",\n        \"alias\"\
  : \"eth0\",\n    }\n}\n```\n\n理解 Ansible facts 的最佳方法是使用此临时临时自行列出它们。你将对从主机获取的信息量感到惊讶。例如当前的硬件配置：架构、处理器、内存（ram）、可用内存、存储配置等。还有关于软件配置的更多信息：操作系统、所使用的发行版、IP\
  \ 地址、网络配置、存储配置等。\n\n### 使用 playbook 列出机器的所有 facts\n\nfacts_printall.yml\n```yaml\n\
  ---\n- name: facts_printall\n  hosts: all\n  tasks:\n    - name: Print all facts\n\
  \      ansible.builtin.debug:\n        var: ansible_facts\n```\n\n你也可以从 Ansible\
  \ playbook 中访问相同数量的数据。在这个简单的示例中，你将列出清单中所有主机的 ansible facts。预期结果与之前的临时命令执行结果相同。\n\
  \nfacts_printall.yml - 执行\n\n```bash\nansible-playbook -i inventory facts_printall.yml\n\
  PLAY [facts_printall] *****************\nTASK [Gathering Facts] *********************************\n\
  ok: [host1.example.com]\nTASK [Print all facts] *********************************\n\
  ok: [host1.example.com] => {\n    \"ansible_facts\": {\n        \"architecture\"\
  : \"x86_64\",\n        \"bios_date\": \"11/28/2013\",\n        \"bios_version\"\
  : \"4.1.5\",\n        \"cmdline\": {\n            \"BOOT_IMAGE\": \"/boot/vmlinuz-3.10.0-862.14.4.el7.x86_64\"\
  ,\n            \"console\": \"ttyS0,115200\",\n            \"no_timer_check\": true,\n\
  \            \"nofb\": true,\n            \"nomodeset\": true,\n            \"ro\"\
  : true,\n            \"root\": \"LABEL=cloudimg-rootfs\",\n            \"vga\":\
  \ \"normal\"\n        },\n        \"date_time\": {\n            \"date\": \"2018-10-25\"\
  ,\n            \"day\": \"25\",\n            \"epoch\": \"1540469324\",\n      \
  \      \"hour\": \"12\",\n            \"iso8601\": \"2018-10-25T12:08:44Z\",\n \
  \           \"iso8601_basic\": \"20181025T12084419754\",\n            \"iso8601_basic_short\"\
  : \"20181025T120844\",\n            \"iso8601_micro\": \"2018-10-25T12:08:44.10968Z\"\
  ,\n            \"minute\": \"08\",\n            \"month\": \"10\",\n           \
  \ \"second\": \"44\",\n            \"time\": \"12:08:44\",\n            \"tz\":\
  \ \"UTC\",\n            \"tz_offset\": \"+000\",\n            \"weekday\": \"Thursday\"\
  ,\n            \"weekday_number\": \"4\",\n            \"year\": \"2018\"\n    \
  \    },\n        \"default_ipv4\": {\n            \"address\": \"REDACTED\",\n \
  \           \"alias\": \"eth0\"\n        }\n    }\n}\n```\n\n这是 `facts_printall.yml`\
  \ 执行后的输出。在执行中，play 是针对 `host1.example.com` 运行的。输出包含了 Ansible 在 `Gathering Facts`\
  \ 任务中自动获取的所有 facts。我鼓励你运行这段代码并熟悉 Ansible Facts。\n\n### 引用一个 fact\n\nfacts_printone.yml\n\
  ```yaml\n---\n- name: facts_printone\n  hosts: all\n  tasks:\n    - name: Print\
  \ a fact\n      ansible.builtin.debug:\n        var: \"{{ ansible_facts['ansible_architecture']\
  \ }}\"\n```\n\n你可以通过指定 fact 名称来方便地交互。在这个示例中，我们正在列出所有主机的架构。请根据需要自定义代码以匹配 ansible\
  \ facts。\n\n## 魔法变量\n\n1 魔法变量是与 Ansible 相关的变量。\n\n与系统相关的变量被称为 facts。通过 facts，你可以将一个系统的行为或状态作为其他系统的配置。\n\
  \n常见的魔法变量\n\nhostvars\n\ngroups\n\ngroup_names\n\ninventory_hostname\n\nansible_version\n\
  \n常见的魔法变量有 `hostvars`、`groups`、`group_names`、`inventory_hostname` 和 `ansible_version`。通过\
  \ `hostvars` 魔法变量，你可以访问为 play 中任何主机定义的变量。当你需要从一个主机访问另一个主机的属性时，这非常有用。`groups` 魔法变量列出了清单中所有的组。你可以结合使用\
  \ `groups` 和 `hostvars` 魔法变量来列出组内所有主机的 IP 地址。`group_names` 是主机所属组的列表。`inventory_hostname`\
  \ 魔法变量包含清单中配置的主机名称。`ansible_version` 魔法变量包含关于 Ansible 的版本信息。\n\n\n\n\n\n在本模块中，我们将讨论如何使用\
  \ `Ansible Vault` 以安全的方式存储任何敏感数据，例如密码或 API 密钥。\n\n`Ansible Vault` 对变量和文件进行加密以保护敏感内容，并在剧本（playbooks）或角色（roles）中使用。Ansible\
  \ Vault 以加密方式存储变量和文件，供你在剧本或角色中使用。在 Ansible 的最新版本中，用于保护文件的算法是 `AES 256`。\n\n## 创建加密文件\n\
  \n要创建一个新的加密文件，请使用 `ansible-vault create filename` 命令。该命令会提示输入新的 vault 密码，然后使用默认编辑器打开文件。在示例中使用的密码是\
  \ `password`，但我强烈建议你使用尽可能安全的密码。\n\n```\n$ ansible-vault create secret.yml\nNew Vault\
  \ password: password\nConfirm New Vault password: password\n$ ansible-vault create\
  \ --vault-password-file=vault-password.txt secret1.yml\n```\n\n## 查看加密文件\n\n你可以使用\
  \ `ansible-vault view filename` 命令来查看 Ansible Vault 加密的文件，而无需将其打开进行编辑。\n\n```\n\
  $ ansible-vault view secret1.yml\nVault password: password\nINFERNO. I.\nNel mezzo\
  \ del cammin di nostra vita\nmi ritrovai per una selva oscura\nché la diritta via\
  \ era smarrita.\nAhi quanto a dir qual era è cosa dura\nesta selva selvaggia e aspra\
  \ e forte\nche nel pensier rinova la paura!\nTant'è amara che poco è più morte;\n\
  ma per trattar del ben ch'i' vi trovai,\ndirò de l'altre cose ch'i' v'ho scorte.\n\
  ```\n\n## 编辑现有加密文件\n\n要编辑现有加密文件，Ansible Vault 提供了 `ansible-vault edit filename`\
  \ 命令。该命令将文件解密到临时文件并允许你进行编辑。保存时，它会复制内容并删除临时文件。\n\n```\n$ ansible-vault edit secret.yml\n\
  Vault password: password\n```\n\n## 加密现有文件\n\n要对已存在的文件加密，请使用 `ansible-vault encrypt\
  \ filename` 命令。`--output` 选项可以将加密文件保存为新名称。如果省略此选项，原始文件将被加密后的文件覆盖。\n\n```\n$ ansible-vault\
  \ encrypt cleartext1.yml --output=vault1.yml\nNew Vault password: password\nConfirm\
  \ New Vault password: password\nEncryption successful\n```\n\n## 解密现有文件\n\n可以使用\
  \ `ansible-vault decrypt filename` 命令对现有加密文件进行永久解密。解密单个文件时，可以使用 `--output` 选项将解密后的文件保存为不同的名称。\n\
  \n```\n$ ansible-vault decrypt vault1.yml --output=decrypted.yml\nVault password:\
  \ password\nDecryption successful\n```\n\n## 修改加密文件的密码\n\n你可以使用 `ansible-vault rekey\
  \ filename` 命令更改加密文件的密码。该命令可以一次更改多个数据文件的密钥。它会提示原始密码，然后是新密码。\n\n```\n$ ansible-vault\
  \ rekey secret.yml\nVault password: password1\nNew Vault password: password\nConfirm\
  \ New Vault password: password\nRekey successful\n```\n\n## Playbooks 与 Ansible\
  \ Vault\n\n要运行访问了 Ansible Vault 加密文件的剧本，你需要为 `ansible-playbook` 命令提供加密密码。如果你不提供密码，剧本将返回错误。要为剧本提供\
  \ vault 密码，请使用 `--vault-id` 选项。例如，如插图所示，交互式提供 vault 密码请使用 `--vault-id @prompt`。或者，你也可以使用密码文件。\n\
  \n```\n$ ansible-playbook playbook.yml\nTASK [include_vars] *************************************\n\
  ********************************fatal: [localhost]: FAIL\nED! => {\"ansible_facts\"\
  : {}, \"ansible_included_var_files\": [], \"changed\": false, \"message\": \"Attempting\
  \ to decrypt but no vault secrets found\"}\n\n$ ansible-playbook --vault-id @prompt\
  \ playbook.yml\nVault password (default): password\n\n$ ansible-playbook --vault-password-file=vault-password.txt\
  \ playbook.yml\n```\n\n## 总结\n\n在本模块中，我们探索了 Ansible Vault 安全存储，用于在 Ansible 内部保存秘密和机密。正如我们看到的，这些工具是强大的，并且完全集成在\
  \ Ansible 技术中。\n\n## 条件\n\n在本模块中，我将向你解释什么是 Ansible 条件操作，以及你如何在日常 Ansible Playbook\
  \ 中使用它们。\n\n条件语句检查条件并相应地更改程序的行为。\n\n让我们开始吧！为了编写实用的代码，我们几乎总是需要检查条件并相应更改程序行为的能力。条件语句赋予了我们这种能力。Ansible\
  \ 的形式是 `when` 语句。Ansible 在条件中使用 `Jinja2` 测试和过滤器。Ansible 支持所有标准测试和过滤器，并添加了一些独特的。\n\
  \n### 使用“when” 的基础条件\n\n`conditional_basic_false.yml`\n\n```yaml\n---\n- name: conditional_basic\n\
  \  hosts: all\n  vars:\n    configure_nginx: false\n  tasks:\n    - name: reload\
  \ nginx\n      ansible.builtin.service:\n        name: nginx\n      when: configure_nginx\n\
  ```\n\n这是你在 Ansible playbook 中 `when` 语句的用法用法。任务 `reload nginx` 只有在 `configure_nginx`\
  \ 变量被设置为 `true` 时才会执行。在这个示例中，我们预计该任务将被跳过。让我们看看输出。\n\n执行：\n```\n$ ansible-playbook\
  \ -i inventory conditional_basic_false.yml\nPLAY [conditional_basic] *************************************\n\
  TASK [Gathering Facts] *************************************\nok: [host1.example.com]\n\
  \nTASK [reload nginx] *************************************\nskipping: [host1.example.com]\n\
  \nPLAY RECAP *************************************************\nhost1.example.com\
  \    : ok=1  changed=0  unreachable=0  failed=0  skipped=1  ignored=0\n```\n\n这是\
  \ `conditional_basic_false.yml` 的输出。在这次执行中，play 针对 `host1.example.com` 节点。输出以绿色和蓝色显示。你可以看到任务\
  \ `reload nginx` 被 Ansible 读取但根据我们的条件被跳过了。\n\n`conditional_basic_true.yml`\n\n```yaml\n\
  ---\n- name: conditional_basic\n  hosts: all\n  vars:\n    configure_nginx: true\n\
  \  tasks:\n    - name: reload nginx\n      ansible.builtin.service:\n        name:\
  \ nginx\n      when: configure_nginx\n```\n\n这是你 Ansible playbook 中 `when` 语句的相同的示例，但我们将变量值从\
  \ `false` 改为了 `true`。现在任务 `reload nginx` 将会被执行，因为 `configure_nginx` 布尔变量被设置为 `true`。让我们看看这段代码执行的输出。\n\
  \n执行：\n```\n$ ansible-playbook -i inventory conditional_basic_true.yml\nPLAY [conditional_basic]\
  \ *************************************\nTASK [Gathering Facts] *************************************\n\
  ok: [host1.example.com]\n\nTASK [reload nginx] *************************************\n\
  ok: [host1.example.com]\n\nPLAY RECAP *************************************************\n\
  host1.example.com    : ok=2  changed=0  unreachable=0  failed=0  skipped=0  ignored=0\n\
  ```\n\n\n\n\n\n这是 `conditional_basic_true.yml` 执行的输出。在本次执行中，play 针对 `host1.example.com`\
  \ 节点运行。输出以绿色高亮。如你所见，任务 `reload ngnx` 任务被 Ansible 读取并在我们的条件语句中成功执行。\n\n## 基于 ansible_facts\
  \ 的条件判断\n\n`conditional_facts.yml`\n\n```yaml\n1 ---\n2 - name: conditional_facts\n\
  3   hosts: all\n4   tasks:\n5   - name: Shut down Debian-like systems\n6     ansible.builtin.command:\
  \ /sbin/shutdown -t now\n7     when: ansible_facts['os_family'] == \"Debian\"\n\
  ```\n\n将条件判断与事实（facts）结合起来非常有用。这样你就可以根据单个主机的条件、IP 地址、操作系统、文件系统状态等来调整代码的执行。在这个示例中，如果目标系统是\
  \ Debian 类系统（即 Debian 和 Ubuntu 管理的主机），我们将执行关机。\n\n### 执行：\n\n```bash\n1 $ ansible-playbook\
  \ -i inventory conditional_facts.yml\n2 PLAY [conditional_facts] ********************************\n\
  3 *********************************************************\n4 **********\n5 TASK\
  \ [Gathering Facts] *********************************\n6 *********************************************************\n\
  7 ********\n8 ok: [host1.example.com]\n9 TASK [Shut down Debian-like systems] ********************\n\
  10 *********************************************************\n11 **********************\n\
  12 skipping: [host1.example.com]\n13 PLAY RECAP **********************************************\n\
  14 *****************************************************\n15 host1.example.com \
  \                 : ok=1    changed=0\n16 unreachable=0    failed=0    skipped=1\
  \    rescued=0    i\\\n17 gnored=0\n```\n\n这是 `conditional_facts.yml` 执行的输出。在本次执行中，play\
  \ 针对 `host1.example.com` 节点运行。目标主机不是 Debian 类系统，因为你可以注意到名为 `Shut down Debian-like\
  \ systems` 的任务处于 `skipped` 跳过状态。\n\n## 总结\n\n条件判断非常重要，因为它们允许我们创建响应某些事件、条件或 Ansible\
  \ Facts 的 Ansible Playbook。这些语句是智能 Ansible Playbook 的基础。\n\n## 循环\n\n在本章中，我向你解释什么是\
  \ Ansible 循环操作，以及你如何在日常的 Ansible Playbook 中使用它们。\n\n### 1 循环自动化重复任务\n\n计算机在自动化重复任务方面非常出色。在不产生错误的情况下重复相同或相似的任务是计算机擅长而人类不擅长的。。\n\
  \n一组语句的重复执行被称为迭代。Ansible 有几个用于迭代的语句——`loop` 语句和 `with_items` 语句。`with` 语句依赖插件。\n\
  \n`loop_simple.yml`\n\n```yaml\n1 ---\n2 - name: Check services\n3   hosts: all\n\
  4   tasks:\n5   - name: httpd and mariadb are running\n6     ansible.builtin.service:\n\
  7       name: \"{{ item }}\"\n8       state: started\n9     loop:\n10      - httpd\n\
  11      - mariadb\n```\n\n简单的循环会对列表中的项对任务进行迭代。`loop` 语句被添加到任务中，并以任务应迭代的项列表作为值。循环变量\
  \ `item` 在每次迭代期间遍历当前值。\n\n`loop_hash_or_dict.yml`\n\n```yaml\n1 ---\n2 - name: Users\
  \ exist and are in the correct groups\n3   hosts: all\n4   tasks:\n5   - name: Users\
  \ exist and are in the correct groups\n6     ansible.builtin.user:\n7       name:\
  \ \"{{ item.name }}\"\n8       state: present\n9       groups: \"{{ item.group }}\"\
  \n10     loop:\n11      - name: alice\n12        group: wheel\n13      - name: bob\n\
  14        group: root\n```\n\n循环列表不需要是简单值的列表。在接下来的示例中，列表中的每个项实际上是一个哈希（hash）或字典（dictionary）。示例中的每个哈希或字典都有两个键：`name`\
  \ 和 `groups`，当前项循环变量中每个键的值可以分别通过 `item.name` 和 `item.group` 变量获取。\n\n## with_* 语句\n\
  \n### `with_items`\n\n类似于用于简单列表的 `loop`、字符串列表或哈希/字典列表。\n\n### 如果提供了列表列表，则将其扁平为列表\n\
  \n### `with_file`\n\n此关键字需要一个控制节点文件名列表。循环变量 `item` 持有文件内容。\n\n### `with_sequence`\n\
  \n需要参数根据数值序列生成值列表。\n\n## `loop_with_items.yml`\n\n```yaml\n1 ---\n2 - name: Example\
  \ with_items\n3   hosts: all\n4   vars:\n5     data:\n6       - alice\n7       -\
  \ bob\n8   tasks:\n9   - name: Print values of\n10    ansible.builtin.debug:\n11\
  \      msg: \"{{ item }}\"\n12    with_items: data\n```\n\n在 `loop_with_items.yml`\
  \ playbook 中，`data` 是一个字符串列表。\n\n## 总结\n\n条件判断非常重要，因为它们允许我们创建响应某些事件、条件或 Ansible\
  \ Facts 的 Ansible Playbook。\n\n## Handler\n\n在本章中，我向你解释什么是 Ansible 循环操作以及你如何在日常的\
  \ Ansible Playbook 中使用它们。\n\n### 在变化时运行 Handler\n\nHandler 非常重要，因为它们允许在必要时执行某些步骤。\n\
  \n## `rollingupdate.yml`\n\n```yaml\n1 ---\n2 - name: Rolling update\n3   hosts:\
  \ all\n4   become: true\n5   tasks:\n6   - name: latest httpd package is installed\n\
  7     ansible.builtin.yum:\n8       name: httpd\n9       state: latest\n10 handlers:\n\
  11  - name: restart apache\n12    ansible.builtin.service:\n13      name: httpd\n\
  14      state: restarted\n```\n\n`rollingupdate.yml` 由一个任务和一个 handler 组成。handler\
  \ 代码在必要时执行。请注意 `notify` 语句提到的 handler 名称。\n\n## Role\n\nRole 实现 Ansible 代码复用\n\n\
  Role 类似于传统编程中的函数。使用 Ansible role 可以快速开发 playbook 并复用代码。\n\n## Role 树目录目录\n\n```text\n\
  1 $ tree user.example\n2 user.example/\n3 ├── defaults\n4 │   └── main.yml\n5 ├──\
  \ files\n6 ├── handlers\n7 │   └── main.yml\n8 ├── meta\n9 │   └── main.yml\n10\
  \ ├── README.md\n11 ├── tasks\n12 │   └── main.yml\n13 ├── templates\n14 ├── tests\n\
  15 │   ├── inventory\n16 │   └── test.yml\n17 └── vars\n18     └── main.yml\n```\n\
  \n目录描述：\n\n`defaults` 目录下的 `main.yml` 文件包含角色变量的默认值，可以在使用 role 时进行覆盖。这些变量的优先级较低，旨在在\
  \ play 中更改和自定义。\n\n`files` 此目录包含 role 任务引用的静态文件。\n\n`handlers` 目录下的 `main.yml` 文件包含\
  \ role 的 handler 定义。\n\n`meta` 目录下的 `main.yml` 文件包含关于 role 信息，包括作者、许可、平台和可选的 role\
  \ 依赖。\n\n`tasks` 目录下的 `main.yml` 文件包含 role 的任务定义。\n\n`templates` 此目录包含 role 任务引用的\
  \ Jinja2 模板。\n\n`tests` 此目录可以包含一个用于测试 role 的 inventory 和 `test.yml` playbook。\n\n\
  `vars` 的 `main.yml` 文件定义了 role 的变量值。通常这些变量用于 role 内部。这些变量的优先级较高，在 playbook 中中使用时不打算更改。\n\
  \n\n\n\n\n并不是每个角色都包含所有这些目录。\n\n## 在 playbook 中使用 Ansible 角色\n\n`./role_simple.yml`\n\
  \n```yaml\n---\n- name: role example\n  hosts: all\n  roles:\n    - role1\n    -\
  \ role2\n```\n1 个文件：`role_simple.yml` 将 `role1` 和 `role2` 应用到所有 `all` 托管的主机。\n\n\
  `./role_vars.yml`\n\n```yaml\n---\n- name: role example\n  hosts: all\n  roles:\n\
  \    - role: role1\n    - role: role2\n      var1: value\n      var2: value\n```\n\
  1 个文件：`role_vars.yml` 将 `role1` 和 `role2` 应用到所有 `all` 托管的主机。`Role2` 有两个变量参数。\n\n\
  ## 执行顺序\n\n`./role_vars.yml`\n\n```yaml\n---\n- name: order of execution example\n\
  \  hosts: all\n  pre_tasks:\n    - debug:\n        msg: 'pre-task'\n        notify:\
  \ my handler\n  roles:\n    - role1\n  tasks:\n    - debug:\n        msg: 'first\
  \ task'\n        notify: my handler\n  post_tasks:\n    - debug:\n        msg: 'post-task'\n\
  \        notify: my handler\n  handlers:\n    - name: my handler\n      debug:\n\
  \        msg: Running my handler\n```\n\n对于 playbook 中的每个 play，任务将按照 `tasks` 列表中的顺序执行。在所有任务执行后，任何被通知的处理器都将执行。\n\
  \n当一个角色被添加到 play 中时，角色的任务会被添加到 `tasks` 列表的开头。如果 play 中包含了第二个角色，则其任务列表将添加到第一个角色之后。\n\
  \n角色处理器添加到 play 中的方式与角色的任务添加到 play 中的方式相同。每个 play 均定义了一个 `handlers` 列表。角色处理器首先被添加到\
  \ `handlers` 列表，然后是任何在 play 的 `handlers` 章节中定义的句柄。在某些场景下，可能需要在执行角色之前执行某些 play 任务。为了支持此类场景，可以为\
  \ play 配置 `pre_tasks` 部分。在该部分中列出的任何任务都会在角色执行之前执行。如果这些任务中的任何一个通知了处理器，则这些处理器任务将在角色或普通任务之前执行。\n\
  \nplay 还支持 `post_tasks` 关键字。这些任务在 play 的普通任务以及它们通知的任何处理器执行后运行。\n\n## Ansible Galaxy\n\
  \n[`galaxy.ansible.com/`](https://galaxy.ansible.com/)\n\n### 手动从 Ansible Galaxy\
  \ 安装角色\n\n```bash\n$ ansible-galaxy install geerlingguy.redis -p roles/\n```\n\n\
  ### 从 Ansible Galaxy 的 requirements.yml 安装角色\n\n`./requirements.yml`\n\n```yaml\n\
  - src: geerlingguy.redis\n  version: \"1.5.0\"\n```\n\n```bash\n$ ansible-galaxy\
  \ install -r roles/requirements.yml -p roles\n```\n\n## Ansible 最佳实践\n\n遵循 Ansible\
  \ 最佳实践可以让你你的代码成功执行，简化故障排除，并对你的自动化之旅产生积极影响。\n\n### 使用空格\n\n在你的 YAML 代码中使用空格而不是制表符（tabs）。在每个块或任务之前添加新行可以让\
  \ playbook 变得易于读。\n\n例如：\n\n错误\n```yaml\n---\n- hosts: all\n  tasks:\n    - ansible.builtin.yum:\n\
  \        name: httpd\n        state: latest\n    - name: end message\n      ansible.builtin.debug:\n\
  \        msg: \"httpd succesfully installed\"\n```\n\n正确\n```yaml\n---\n- hosts:\
  \ all\n  tasks:\n    - ansible.builtin.yum:\n        name: httpd\n        state:\
  \ latest\n\n  - name: end message\n      ansible.builtin.debug:\n        msg: \"\
  httpd succesfully installed\"\n```\n\n### 为每一步分配一个“名称”（name）\n\n为你的代码中的每个 Ansible\
  \ 语句（Ansible Plays、Tasks、Blocks）始终设置 `name` 参数。\n\n例如：\n\n错误\n```yaml\n---\n- hosts:\
  \ all\n  tasks:\n    - ansible.builtin.yum:\n        name: httpd\n        state:\
  \ latest\n```\n\n正确\n```yaml\n---\n- name: install apache\n  hosts: all\n  tasks:\n\
  \    - name: install apache packages\n      ansible.builtin.yum:\n        name:\
  \ httpd\n        state: latest\n```\n\n### 为变量使用人类可读且有意义的名称\n\n变量对于存储参数或保存之前任务的结果非常重要。使用人类可读且有意义的名称可以增加你团队之间的代码复用和可读性。使用\
  \ `ansible-playbook` 命令的 `extra-vars` 参数来覆盖变量也很容易。\n\n例如：\n\n错误\n```yaml\nkeepalive:\
  \ 25\npo: 80\naaaa: 8080\n```\n\n正确\n```yaml\napache_max_keepalive: 25\napache_port:\
  \ 80\n```\n\n### 使用原生 YAML\n\n原生 YAML 的使用提高了代码的可读性，并让你更快更快地发现错误。同时也允许使用某些 YAML 校验器和解析器进行验证。\n\
  \n例如：\n\n错误\n```yaml\n- name: install apache\n  ansible.builtin.yum: name={{ apache_version\
  \ }} state=present update_cache=yes disable_gpg_check=yes enablepo=apache\n  notify:\
  \ restart\n```\n\n正确\n```yaml\n- name: install apache\n  ansible.builtin.yum:\n\
  \    name: {{ apache_version }}\n    state: present\n    update_cache: yes\n   \
  \ disable_gpg_check: yes\n    enablepo: apache\n  notify: restart\n```\n\n### 使用原生模块\n\
  \n始终优先使用原生模块而不是命令。`command`、`shell` 和 `script` 应该作为最后的手段。\n\n例如：\n\n错误\n```yaml\n\
  - name: Add repository into.d list\n  become: true\n  ansible.builtin.shell: 'echo\
  \ -e \"[google-chrome]\\nname=google-chrome\\nbaseurl=http://dl.google.com/linux/rpm/stable/x86_64\\\
  nenabled=1\\ngpgcheck=1\\ngpgkey=https://dl.google.com/linux/linux/key.pub\" > /etc/yum.repos.d/google-chrome.repo'\n\
  \  when: ansible_os_family == 'RedHat'\n```\n\n正确\n```yaml\n- name: Add repository\
  \ into.d list\n  ansible.builtin.yum_repository:\n    name: google-chrome\n    description:\
  \ google-chrome repository\n    baseurl: http://dl.google.com/linux/rpm/stable/x86_64\n\
  \    enabled: true\n    gpgcheck: true\n    gpgkey: https://dl.google.com/linux/linux/key.pub\n\
  ```\n\n### 配置调试消息\n\n在开发 Ansible 代码时，依靠 `debug` 任务来显示变量的内容非常有用。然而，在生产环境中这可能被认为信息量太大。将\
  \ `verbosity` 参数设置为 `2` 可以让你只在需要时看到这些消息。\n\n例如：\n\n错误\n```yaml\n- name: message\
  \ output\n  ansible.builtin.debug:\n    msg: \"This text always displays\"\n```\n\
  \n正确\n```yaml\n- name: message output\n  ansible.builtin.debug:\n    msg: \"This\
  \ text displays with ansible-playbook -vv\"\n  verbosity: 2\n```\n\n### 以尽可能少的权限执行任务\n\
  \n这是对于以尽可能少的权限执行任务的安全实践通用建议。在 Ansible 中，你可以在任务级别指定 `become: true`，而不是针对整个 playbook，如果并不是所有任务都需要以\
  \ root/管理员用户身份执行。\n\n例如：\n\n```yaml\n---\n- name: install apache\n  hosts: all\n\
  \  become: true\n  tasks:\n    - name: message output\n      ansible.builtin.debug:\n\
  \        msg: \"This text always displays\"\n\n    - name: install apache packages\n\
  \      ansible.builtin.yum:\n        name: httpd\n        state: latest\n```\n\n\
  正确\n```yaml\n---\n- name: install apache\n  hosts: all\n  tasks:\n    - name: message\
  \ output\n      ansible.builtin.debug:\n        msg: \"This text always displays\"\
  \n\n    - name: install apache packages\n      ansible.builtin.yum:\n        name:\
  \ httpd\n        state: latest\n      become: true\n```\n\n### 始终提及“state”参数\n\n\
  许多模块具有带有默认值的可选 `state` 参数。\n\n\n\n\n\n对于“state”（状态），默认值在不同模块之间可能会有所不同，某些模块支持多个“state”设置。显式地设置\
  \ `state: present` 或 `state: absent` 可以让情节（playbooks）和角色（roles）更加清晰。\n\n## 使用注释\n\
  \n添加注释（以“#”开头的行），帮助他人（可能也未来的你自己）理解一个语句、 playbook 或任务（或变量设置）的作用、如何实现以及为什么要这么做。\n\n\
  ## 安装 Ansible\n\n在本章中，你将发现如何在现在最常用的操作系统中安装 Ansible。\n\n## Ansible 术语 - ansible 与\
  \ ansible-core 包\n\n什么是 `ansible-core`？什么是 ansible 社区包？Ansible 项目在 2.9 版本之后发生了什么变化？现今\
  \ Ansible 社区和 `ansible-core` 包的概述及使用场景。\n\n## 什么是 ansible-core? 什么是 ansible 社区包？\n\
  \nAnsible 项目在 2.9 版本之后发生了什么变化？\n\n今天，我们将讨论 2021 年以来发布的 `ansible community`（Ansible\
  \ 社区）和 `ansible-core` 包。\n\n## ansible vs ansible-core\n\nAnsible 在 2.9 版本之后发生了什么变化？\n\
  \n从 2.10 版本开始，Ansible 分发两个交付物：一个名为 `ansible` 的社区包，以及一个极简的语言和运行时 `ansible-core`（在\
  \ 2.10 版本中称为 `ansible-base`）。请选择符合你特定需求的 Ansible 风格和版本。\n\n`ansible` 包包含了 Ansible\
  \ 语言和运行时，以及一系列由社区精选的集合（Collections）。它重现并扩展了 Ansible 2.9 中包含的功能。\n\n你可以选择以下任何方式来安装\
  \ Ansible 社区包：\n\n- 使用你操作系统的包管理器安装最新版本（适用于 Red Hat Enterprise Linux、CentOS、Fedora、Debian\
  \ 或 Ubuntu）。\n- 使用 `pip`（Python 包管理器）安装。\n\n### Ansible 社区包发布周期\n\nAnsible 社区团队通常每年发布两个社区包大版本，并采用灵活的发布周期，该周期滞后于\
  \ `ansible-core` 的发布。该周期可以延长，以便在发布新版本之前妥善地实现并测试更大的更改。请查看 Ansible 路线图（Ansible Road\
  \ map）获取即将发布的发布详情。在大版本之间，Ansible 团队每三周会发布一个 Ansible 社区包的新小版本。小版本包含新的向后兼容的特性、模块和插件，以及错误修复。\n\
  \n从 2.10 版本开始，Ansible 社区团队保证一次仅维护一个社区包大版本。例如，当 Ansible 5.0.0 发布时，团队将停止发布新的 4.x 版本。社区成员可以根据需要维护旧版本。\n\
  \n| 特性 | ansible community | ansible-core (曾为 ansible-base 2.10) |\n| :--- | :---\
  \ | :--- |\n| 版本控制 | 使用新版本（2.10，然后是 3.0.0） | 继续“经典 Ansible”版本命名（2.11，然后是 2.12） |\n\
  | 语义版本化 | 遵循语义版本化规则 | 不使用语义版本化 |\n| 维护 | 一次仅维护一个版本 | 维护最新版本加上两个旧版本 |\n| 内容 | 包含语言、运行时和选定的\
  \ Collections | 包含语言、运行时和内置插件 |\n| 开发 | 在 Collection 仓库中开发和维护 | 在 `ansible/ansible`\
  \ 仓库中开发和维护 |\n\n## ansible-core\n\n`ansible-core` 包主要面向只想安装他们所需的 collections 的开发者和用户。\n\
  \n### 什么是 ansible-core 包？\n\nAnsible Core 是一个命令行工具，主要面向只想安装他们所需的 collections 的开发者和用户。\n\
  \n它包含极少模块和插件，并允许安装其他 Collections。它类似于 Ansible 2.9，但不包含任何自那以后移动到 Collection 中的内容。\n\
  \nAnsible core 或 `ansible-core` 是 Ansible 的核心构建模块和架构，包括：\n\n- CLI 工具，如 `ansible-playbook`、`ansible-doc.`\
  \ 等，用于驱动和与自动化交互。\n- Ansible 语言使用 YAML 创建一套开发 Ansible Playbooks 的规则，并包含了条件、块（blocks）、包含（includes）、循环和其他\
  \ Ansible 指令函数。\n- 一个允许通过 Ansible collections 进行扩展的架构框架。\n\n`ansible-core` 大约每年发布一次新的大版本。\n\
  \n## ansible community\n\nAnsible 社区包提供了 Ansible 2.9 的功能，包含 85 多个 collections，其中含有数千个模块和插件。\n\
  \n### 什么是 ansible 社区包？\n\nAnsible 社区包的每个大版本都会采用每个包含的 Collection 的最新版本以及 `ansible-core`\
  \ 的最新版本。\n\nAnsible 社区包的大版本可能包含包含的 Collections 中模块和其他插件以及/或核心功能中的破坏性更改（breaking\
  \ changes）。\n\nAnsible 包依赖于 `ansible-base`（很快变为 `ansible-core`）。因此当你执行 `pip install\
  \ ansible` 时，`pip` 会自动安装 `ansible-core`。\n\nAnsible 3.0.0 及后续版本包含了更多的 Collections，益于更广泛的\
  \ Ansible 社区根据社区清单审核 Collections。\n\nAnsible 社区团队通常每年发布两个社区包大版本，并采用灵活的发布周期，该周期滞后于\
  \ `ansible-core` 的发布。\n\n## 链接\n\n- [Ansible 3.0.0 问答](https://www.ansible.com/blog/ansible-3.0.0-qa)\n\
