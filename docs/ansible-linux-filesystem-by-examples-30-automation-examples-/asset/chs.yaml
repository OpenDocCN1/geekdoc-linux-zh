  \n如果启用了 `backup` 参数，Ansible 会在文件复制到目标位置之前创建一个包含时间信息的备份文件。\n\n让我同时也强调一下，我们还可以指定权限和\
  \ SELinux 属性。\n\n## demo\n\n如何使用 Ansible template 模块和 YAML 按特定顺序合并多个文件。\n\ncode\n\
  \n```\na.txt\n1 A content\n\nb.txt\n1 B content\n```\n\nincludes.yaml\n```yaml\n\
  input-files: \n  - concatenate/b.txt\n  - concatenate/a.txt\n```\n\nconcatenate.yml\n\
  ```yaml\n---\n- name: concatenate demo\n  hosts: \"{{ HOSTS }}\"\n  become: false\n\
  \  gather_facts: true\n  vars:\n    myinput: \"concatenate/includes.yaml\"\n   \
  \ myoutput: \"concatenate/output.txt\"\n  tasks:\n    - name: include file list\n\
  \      include_vars:\n        file: \"{{ myinput }}\"\n        name: files\n\n \
  \   - name: concatenate\n      ansible.builtin.template:\n        src: templates/concatenate.j2\n\
  \        dest: \"{{ myoutput }}\"\n```\n\nconcatenate.j2\n```jinja2\n{% for i in\
  \ files[\"input-files\"] %}\n{{ lookup('file', i) }}\n{% endfor %}\n```\n\nexecution\n\
  \n```bash\nansible-pilot $ ansible-playbook -e \"HOSTS=localhost\" concatenate.yml\n\
