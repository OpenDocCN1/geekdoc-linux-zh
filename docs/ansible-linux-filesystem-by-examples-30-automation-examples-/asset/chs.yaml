  \n$\n```\n\n## Ansible 用于 Linux 文件系统\n\n如何使用 Ansible 自动化与 Linux 文件系统的交互。例如：文件和目录的创建、权限和删除。\n\
  \n## 创建空文件 - Ansible 模块\n\n如何创建一个空的 `~/example.txt` 文件或更新已创建的时间。\n\n### Ansible\
  \ 创建空文件\n\n让我们来聊聊 Ansible 模块。它的全名是 `ansible.builtin.file`，这意味着它是 Ansible 内置 \"builtin\"\
  \ 模块集合的一部分，并随 Ansible 一起发布。\n\n这是一个非常稳定的模块，已经发布多年。它可以在多种操作系统上运行。它管理文件和文件属性。\n\n\
  对于 Windows 目标，请使用 `ansible.windows.win_file` 模块。\n\n### 主要参数\n\n- `path` string\
  \ (dest, name) - 文件路径\n- `state` string - 文件/不存在 (file/absent)\n\n它管理文件和文件属性。对于\
  \ Windows 目标，请使用 `ansible.windows.win_file` 模块。\n\n### demo\n\n**file.yml**\n```yaml\n\
  ---\n- name: modprobe module demo\n  hosts: localhost\n  become: true\n  vars:\n\
  \    module_name: \"dummy\"\n    ansible_connection: local\n  tasks:\n    - name:\
  \ load the module\n      community.general.modprobe:\n        name: \"{{ module_name\
  \ }}\"\n        state: present\n```\n\n\n\n\n今天我们来讨论 Ansible 模块文件。\n\n它的全名为 `ansible.builtin.file`，这意味着它是\
  \ `ansible` 内置 `builtin` 模块集合的一部分，并随其一同发布。\n\n这是一个非常稳定且已发布多年的模块。它适用于多种操作系统。它用于管理文件和文件属性。\n\
  \n对于 Windows 目标，请使用 `ansible.windows.win_file` 模块。\n\n## 参数\n\n- `path` 字符串 (`dest`,\
  \ `name`) - 文件路径\n- `state` 字符串 - `file/absent/directory/hard/link/touch`\n- `mode`/`owner`/`group`\
  \ - 权限\n- `setype`/`seuser`/`selevel` - SELinux\n\n该模块拥有一些参数来执行任务。\n\n必需的参数是 `path`，你可以在此处指定要编辑的文件的文件系统路径。\n\
  \n`state` 定义了我们要修改的对象类型，默认值为 `file`，但对于我们的使用场景，我们需要 `directory` 选项。\n\n## 演示\n\n\
  如何使用 Ansible 的 `file` 模块在 Linux 的 `devops` 用户家目录下创建 `example` 目录。\n\n## 代码\n```yaml\n\
  create_directory.yml\n---\n- name: file module demo\n  hosts: all\n  vars:\n   \
  \ mydir: \"~/example\"\n  tasks:\n    - name: Creating a directory\n      ansible.builtin.file:\n\
  \        path: \"{{ mydir }}\"\n        state: directory\n        owner: devops\n\
  \        group: users\n        mode: '0644'\n```\n\n## 执行\n```bash\n$ ansible-playbook\
  \ -i demo/inventory create_directory/file.yml\nPLAY [file module demo] *********************************\n\
  ************************************\nTASK [Gathering Facts] ***********************************\n\
  ************************************\nok: [demo.example.com]\nTASK [Creating a directory]\
  \ *****************************\n************************************\nchanged:\
  \ [demo.example.com]\nPLAY RECAP **********************************************\n\
  ************************************\ndemo.example.com          : ok=2    changed=1\
  \    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\n```\n\n##\
