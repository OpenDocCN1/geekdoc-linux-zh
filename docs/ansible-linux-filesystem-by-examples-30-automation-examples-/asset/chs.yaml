  \ Amazon Extras Library 和 `EPEL`（企业级 Linux 额外包）仓库在 Amazon Linux 2 中安装 Ansible。\n\
  \n在 Amazon Linux 2 中安装和维护 Ansible 更简单的方法是使用 Amazon Extras Library 和 `EPEL`。\n\n\
  ## 如何在 Amazon Linux 2 中安装 Ansible\n\nExtras Library 中的 `ansible2` 主题\n\nExtra Packages\
  \ for Enterprise Linux 中的 `ansible`\n\n一种极其简单的模型驱动型配置管理、多节点部署和远程任务执行系统。Ansible 通过\
  \ SSH 运行，且不需要在远程节点上安装任何软件或守护进程。扩展模块可以使用任何语言编写，并自动传输到托管机器。\n\n好消息是，通过 `amazon-linux-extras`\
  \ 命令，在 Amazon Linux 2 仓库的 Extras Library 中已经包含了 `ansible2`。\n\n另一种在 Amazon Linux\
  \ 2 内部安装和维护 Ansible 的方法是使用企业级 Linux 额外包（`EPEL`）附加仓库。\n\n该仓库由 Fedora 特别兴趣小组维护，为企业级\
  \ Linux：Red Hat Enterprise Linux (`RHEL`)、Rocky Linux 和 Scientific Linux (`SL`)、Oracle\
  \ Linux (`OL`) 以及 Amazon Linux 管理了一组高质量的额外包。\n\n## 链接\n\n- [Amazon Linux 2](https://aws.amazon.com/it/amazon-linux-2/)\n\
  - [我如何为运行 CentOS、RHEL 或 Amazon Linux 的 Amazon EC2 实例启用 EPEL 仓库？](https://aws.amazon.com/it/premiumsupport/knowledge-center/ec2-enable-epel/)\n\
  - [Extras library (Amazon Linux 2)](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/amazon-linux-ami-basics.html#extras-library)\n\
  - [Extra Packages for Enterprise Linux (EPEL)](https://docs.fedoraproject.org/en-US/epel/)\n\
