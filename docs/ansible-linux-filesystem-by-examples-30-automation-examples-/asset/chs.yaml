  ```\n\n# 修改文件权限 - Ansible file 模块\n\n如何使用 Ansible 修改文件或目录权限？\n\n我将向你演示如何修改 `test.txt`\
  \ 文件的 `chmod` 和用户组。\n\n如何自动化修改文件/目录权限？\n\n今天我们讨论的是 `file` 模块。它的全名是 `ansible.builtin.file`，这意味着它是\
  \ `builtin` 模块集合的一部分，并随 ansible 一起发布。这是一个非常稳定且已发布多年的模块。它支持不同的操作系统。它可以管理文件及其属性。对于\
  \ Windows 目标，请使用 `ansible.windows.win_file` 模块。\n\n## 主要参数\n\n- `path` (`dest`,\
  \ `name`): 文件路径\n- `owner`: 用户\n- `group`: 组\n- `mode` 原始字符串：例如 `0644` 或 `u=rw,g=r,o=r`\n\
  - `state`: `file`/absent`/directory`/hard`/link`/touch`\n- `setype`/`seuser`/`selevel`:\
  \ SELinux\n\n该模块包含一些参数用于执行任务。唯一的必填参数是 `path`，你可以在这里指定要编辑的文件系统路径。`owner` 参数设置文件/目录的所有者。`group`\
  \ 参数设置文件/目录的所属组。\n\n\n\n\n[content]\n\n`mode` 参数以 UNIX 方式设置文件/目录的权限。\n\n`state`\
  \ 定义了我们正在修改的对象类型，默认是 `file`，但我们也可以处理目录、硬链接、符号链接，或通过 `touch` 选项仅更新访问时间。\n\n让我也强调一下，我们还可以指定\
  \ SELinux 属性。\n\n## demo\n\n让我们进入一个真实的剧本（playbook），使用 Ansible 修改文件权限。\n\n```yaml\n\
  file.yml\n1 --- 2 - name: file module demo 3   hosts: all 4   vars: 5     myfile:\
  \ \"/home/devops/test.txt\" 6   become: false 7   tasks: 8     - name: check permission\
  \ 9       ansible.builtin.file: 10         path: \"{{ myfile }}\" 11         owner:\
  \ \"devops\" 12         group: \"users\" 13         mode: '0777'\n```\n\n## 为 Linux\
  \ 文件添加执行权限 755 - Ansible file 模块\n\n如何使用 Ansible 的 `file` 模块自动化地为 `example.sh` Linux\
  \ 文件设置 755 执行权限。\n\n在 Linux 中分配执行权限 755 是系统管理员非常频繁的需求，你可以通过 Ansible 实现其自动化。\n\n\
  ## Ansible 添加执行权限\n\n`ansible.builtin.file`\n\n管理文件和文件属性\n\n今天我们来讨论 Ansible 模块 `file`。\n\
  \n它的全名是 `ansible.builtin.file`，这意味着它是 `builtin` 模块集合的一部分，并随 Ansible 一起分发。\n\n这是一个非常稳定且已发布多年的模块。\n\
  \n它可以在不同的操作系统上运行。\n\n它管理文件和文件属性。\n\n对于 Windows 目标，请使用 `ansible.windows.win_file`\
  \ 模块。\n\n## 主要参数\n\n`path` string (dest, name) - 文件路径\n\n`owner` string - 用户\n\n\
  `group` string - 组\n\n`mode` raw - 例：‘0644’ 或 ‘u=rw,g=r,o=r’\n\n`state` string -\
  \ file/absent/directory/hard/link/touch\n\n`setype/seuser/selevel` - SELinux\n\n\
  该模块有一些参数来执行任何任务。\n\n唯一要求的参数是 `path`，你可以在此指定要编辑的文件的文件系统路径。\n\n`owner` 参数设置应拥有该文件/目录的用户。\n\
  \n`group` 参数设置应拥有该文件/目录的组。\n\n`mode` 参数以 UNIX 方式设置文件/目录的权限。\n\n`state` 定义了我们正在修改的对象类型，默认是\
  \ `file`，但我们也可以处理目录、硬链接、符号链接，或通过 `touch` 选项仅更新访问时间。\n\n让我也强调一下，我们还可以指定 SELinux 属性。\n\
  \n## Links\n\n[ansible.builtin.file](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/file_module.html)\n\
  \n## demo\n\n如何使用 Ansible Playbook 为 Linux 文件添加 755 执行权限。\n\n我将向你展示如何使用 Ansible\
  \ 为 `example.sh` Linux 文件设置 `chmod +x`。\n\n```yaml\nfile_permission.yml\n1 --- 2\
  \ - name: file module demo 3   hosts: all 4   vars: 5     myscript: \"~/example.sh\"\
  \ 6   tasks: 7     - name: set execution permission 8       ansible.builtin.file:\
  \ 9         dest: \"{{ myscript }}\" 10         mode: 'a+x'\n```\n\n```bash\nexample.sh\n\
  1 #!/bin/bash 2 echo \"Hello World\"\n```\n\n### execution\n\n```bash\nansible-pilot\
  \ $ ansible-playbook -i virtualmachines/demo/\\ 2 inventory file_management/file_permission.yml\
  \ 3 PLAY [file module demo] *********************************\\ 4 ******************************************\
  \ 5 TASK [Gathering Facts] **********************************\\ 6 ******************************************\
  \ 7 ok: [demo.example.com] 8 TASK [set execution permission] *************************\\\
  \ 9 ****************************************** 10 changed: [demo.example.com] 11\
  \ PLAY RECAP **********************************************\\ 12 ******************************************\
  \ 13 demo.example.com          : ok=2    changed=1    unreach\\ 14 able=0    failed=0\
  \    skipped=0    rescued=0    ignored=0 15 ansible-pilot $\n```\n\n### idempotency\n\
  \n```bash\nansible-pilot $ ansible-playbook -i virtualmachines/demo/\\ 2 inventory\
  \ file_management/file_permission.yml 3 PLAY [file module demo] *********************************\\\
  \ 4 ****************************************** 5 TASK [Gathering Facts] **********************************\\\
  \ 6 ****************************************** 7 ok: [demo.example.com] 8 TASK [set\
  \ execution permission] *************************\\ 9 ******************************************\
  \ 10 ok: [demo.example.com] 11 PLAY RECAP **********************************************\\\
  \ 12 ****************************************** 13 demo.example.com          : ok=2\
  \    changed=1    unreach\\ 14 able=0    failed=0    skipped=0    rescued=0    ignored=0\
  \ 15 ansible-pilot $\n```\n\n（注：剩余文本包含冗余或杂的片段，已清理以保持核心清晰度。）\n\n`path` string (dest,\
  \ name) - 文件路径\n`owner` string - 用户\n`group` string - 组\n`mode` raw - 例：‘0644’ 或\
  \ ‘u=rw,g=r,o=r’\n`state` string - file/absent/directory/hard/link/touch\n`setype/seuser/selevel`\
  \ - SELinux\n\n[/content]\n\n\n\n\n# 概述\n\n`dest` 参数指定了资源在目标节点上保存的文件系统路径。\n\n让我们深入研究\
  \ `force` 参数。\n\n如果 `dest` 是一个文件，Ansible 每次都会下载该文件。如果 `dest` 是一个目录，默认行为是不替换文件，除非你将\
  \ `force` 参数切换为 `yes`。\n\n`checksum` 参数非常有用，用于验证下载文件的一致性。\n\n你可以指定算法（通常为 `sha1`\
  \ 或 `sha256`），并直接提供校验和值或校验和的 URL。\n\n你可能需要第三方库 `hashlib` 来访问额外的算法。\n\n另一个有意思的参数是\
  \ `headers`，它允许你指定一些自定义的 HTTP 请求头。\n\n在 Web 服务器的日志中，Ansible  是以 `ansible-httpget`\
  \ 的身份自荐呈现的，但你可以通过 `http_agent` 参数对其进行自定义。\n\n还有一些额外的身份认证参数，例如处理带有用户名和密码的 HTTP 认证，或者使用\
  \ Python 库 `httplib2` 处理更复杂的 GSSAPI-Kerberos 场景。\n\n让我也强调一下，我们还可以指定权限和 SELinux 属性。\n\
  \n## Demo\n\n如何使用 Ansible 从互联网下载 tar.gz 文件并验证 SHA256 校验和。\n\n`get_url.yml`\n\n```yaml\n\
  ---\n- name: get_url module demo\n  hosts: all\n  become: false\n  vars:\n    myurl:\
  \ \"https://releases.ansible.com/ansible/ansible-2.9.25.tar.gz\"\n    mycrc: \"\
  sha256:https://releases.ansible.com/ansible/ansible-2.9.25.tar.gz.sha\"\n    mydest:\
  \ \"/home/devops\"\n  tasks:\n    - name: download file\n      ansible.builtin.get_url:\n\
  \        url: \"{{ myurl }}\"\n        dest: \"{{ mydest }}\"\n        checksum:\
  \ \"{{ mycrc }}\"\n        mode: '0644'\n        owner: devops\n        group: wheel\n\
  ```\n\n# 解压存档 - Ansible unarchive 模块\n\n如何下载 zip 文件并将其解压到用户主目录下。该 Playbook 还会处理必要的软件依赖项。\n\
  \n让我们 true Ansible 模块 `unarchive`。\n\n全名是 `ansible.builtin.unarchive`，这意味着它是 ansible\
  \ `builtin` 模块集合的一部分，并随 ansible 一起发布。\n\n这是一个非常稳定且已发布多年的模块。\n\n它可以在不同的操作系统中工作。\n\
  \n它会在（可选地）从本地机器复制存档后解压它。\n\n它可以使用 `unzip` 处理 `.zip` 文件，可以使用 `gtar` 处理 `.tar`、`.tar.gz`、`.tar.bz2`、`.tar.xz`\
  \ 和 `.tar.zst` 文件。它要求目标主机上有 `zipinfo`、`gtar` 和 `unzip` 命令。\n\n请注意，对于 Unix 文件格式，它需要一个\
  \ tar 包（`.tar` 存档）。\n\n对于 Windows 目标，请使用 `ansible.windows.win_unzip` 模块。\n\n## 参数\n\
  \n- `src` string - 路径\n- `dest` string - 路径\n- `remote_src` boolean - 否/是\n- `validate_certs`\
  \ boolean - 否/是（仅限 https）\n- `include/exclude` 列表 - 目录和文件条目\n- `extra_opts` string\
  \ - 命令行选项\n- `keep_newer` boolean - 否/是\n- `mode/owner/group` - 权限\n- `setype/seuser/selevel`\
  \ - SELinux\n\n唯一的强制性参数是 `src` 和 `dst`，它们是源路径和目标路径。`src` 特别特殊，因为它应该是 Ansible 控制器上的本地路径。\n\
  \n我们可以通过启用 `remote_src` 切换到远程路径。\n\n在 `src` 参数中，我们可以指定 URL。\n\n其他有用的参数是 `include`\
  \ 和 `exclude`，允许我们指定文件或目录。\n\n`extra_opts` 允许我们指定命令行选项。\n\n如果文件已经存在且比存档新，则 `keep_newer`\
  \ 参数可以防止覆盖。\n\n让我也强调一下，我们还可以指定权限和 SELinux 属性。\n\n## Demo\n\n使用 Ansible 解压存档。\n\n\
  `unarchive.yml`\n\n```yaml\n---\n- name: unarchive module demo\n  hosts: all\n \
  \ become: false\n  vars:\n    \"https://github.com/lucab85/archive/refs/heads/master.zip\"\
  : \"myurl\"\n    \"/home/devops/\": \"mydest\"\n  tasks:\n    - name: extractor\n\
  \      ansible.builtin.yum:\n        name: unzip\n    - name: extract\n      ansible.builtin.unarchive:\n\
  \        src: \"{{ myurl }}\"\n        dest: \"{{ mydest }}\"\n        remote_src:\
  \ true\n```\n\n# 创建链接 - Ansible 模块\n\n在 Ansible 中创建一个链接。\n\n`link` 模块创建一个硬链接。\n\n\
  让我也强调一下，我们还可以指定权限和 SELinux 属性。\n\n# 创建链接（软链接）- Ansible \n\n在 Linux 上创建一个指向 `/proc/cpuinfo`\
  \ 的 `example` 软链接。\n\n`create_symlink.yml`\n\n```yaml\n---\n- name: file demo\n\
  \  hosts: all\n  vars:\n    mydlink: \"~/example\"\n    mysrc: \"/proc/cpuinfo\"\
  \n  tasks:\n    - name: Creating a symlink\n      ansible.builtin.file:\n      \
  \  src: \"{{ mysrc }}\"\n        dest: \"{{ mylink }}\"\n        state: link\n```\n\
  \nexecution\n\n```bash\n$ ansible-playbook -i demo/inventory create_symlink.yml\n\
  PLAY [file demo] *********************************\nTASK [Gathering Facts] *********************************\n\
  ok: [demo.example.com]\nTASK [Creating a symlink] *******************************\n\
  changed: [demo.example.com]\n\nPLAY RECAP **********************************************\n\
  demo.example.com: ok=2    changed=1    unreachable=0    failed=0    skipped=0  \
  \  rescued=0    ignored=0\n```\n\nbefore execution\n\n```bash\n$ ssh devops@demo.com\n\
