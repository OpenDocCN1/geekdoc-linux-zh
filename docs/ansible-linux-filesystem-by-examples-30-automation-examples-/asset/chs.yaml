  \ UNIX 用户账户。用户名 `demo` 不需要与您的 Windows 用户名匹配。\n3. 欲了解更多信息请访问：https://aka.ms/wslusers\n\
  4. 输入新的 UNIX 用户名：`demo`\n5. 新密码：\n6. 重新输入新密码：\n7. `passwd`: 密码更新成功\n8. 安装成功！\n9.\
