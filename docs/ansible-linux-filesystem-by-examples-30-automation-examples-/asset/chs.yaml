  \ Linux 中创建硬链接 - Ansible 模块文件\n\n如何使用 Ansible 在 Linux 文件系统中创建一个引用 `example.txt`\
  \ 文本文件的“硬链接”。\n\n## Ansible 创建硬链接\n\n`ansible.builtin.file`\n\n管理文件和文件属性\n\n今天我们来讨论\
  \ Ansible 模块文件。\n\n它的全名是 `ansible.builtin.file`，这意味着它是 Ansible 内置 `builtin` 模块集合的一部分，并随\
  \ Ansible 一起分发。\n\n这是一个非常稳定的模块，已经发布了多年。\n\n它可以在多种操作系统上运行。\n\n它可以管理文件和文件属性。\n\n如需创建符号链接（或软链接），请参阅\
  \ Ansible `file` 模块的后续参数。\n\n对于 Windows 目标，请改用 `ansible.windows.win_file` 模块。\n\n\
  另参见在 Linux 中创建符号链接（也称为 symlink 或 soft link） - Ansible 模块文件\n\n## 参数\n\n- `src` 字符串\
  \ - 符号链接路径\n- `dest` 字符串 - 目标文件路径\n- `state` 字符串 - 文件/不存在/目录/链接/硬/touch\n- `mode`/`owner`/`group`\
  \ - 权限\n- `setype`/`seuser`/`selevel` - SELinux\n\n该模块包含一些参数以执行任何任务。\n\n两个必需字段是\
  \ `src` 和 `dest`，它们指定了硬链接和目标文件的文件系统路径。\n\n`state` 定义了我们要修改的对象类型，默认是 `file`，但对于我们的用例，我们需要\
  \ `link` 选项。\n\n让我也强调一下权限和 SELinux 参数。\n\n## demo\n\n如何使用 Ansible 创建引用 `example.txt`\
  \ 文件的硬链接。\n\n### 代码 create_hardlink.yml\n\n```yaml\n---\n- name: file module demo\n\
  \  hosts: all\n  vars:\n    mylink: \"~/link\"\n    myfile: \"~/example.txt\"\n\
  \  tasks:\n    - name: Creating hardlink\n      ansible.builtin.file:\n        src:\
  \ \"{{ myfile }}\"\n        dest: \"{{ mylink }}\"\n        state: hard\n```\n\n\
  ## 执行\n\n```bash\n$ ansible-playbook -i virtualmachines/demo/inventory link/hardlink.yml\n\
  PLAY [file module demo] *********************************\nTASK [Gathering Facts]\
  \ ***********************************\nTASK [Creating hardlink] ********************************\n\
  PLAY RECAP *********************************************\ndemo.example.com : ok=2\
  \    changed=1    unreachable=0    failed=0    skipped=0    ignored=0\n```\n\n##\
  \ 执行前\n\n```bash\n$ ssh devops@demo.example.com\n[devops@demo ~]$ ls -al\ntotal\
