  ******************************************\nlocalhost                  ok=3    changed=1\
  \    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0\nansible-pilot\
  \ $\n```\n\nidempotency\n```bash\nansible-pilot $ ansible-playbook -e \"HOSTS=localhost\"\
