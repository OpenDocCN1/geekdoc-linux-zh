  md: '# 4.2.1.2 Global printing settings


    In the smb.conf file you will see something similar to this:


    ```

    load printers = yes

    printcap name = /etc/printcap

    printing = lprng

    ```


    The parameters are described in Table 13.


    Table 13. Printing parameters


    | Parameter | Description |

    | --- | --- |

    | load printers | This parameter controls Samba loads all printers in the printcap
    file for browsing. |

    | printcap name | With this parameter you tell Samba the location of the printcap
    file. The default value is /etc/printcap |

    | printing | This parameter tells Samba what printing style to use on your server.
    Caldera OpenLinux by default uses the LPRNG printing style |


    # 4.2.1.3 Global security settings


    In your smb.conf file you will see something similar to this:


    ```

    security = user

    ; password server = <NT-Server-Name>

    encrypt passwords = yes

    smb passwd file = /etc/samba.d/smbpasswdd

    ```


    The parameters are described in Table 14.


    Table 14. Security parameters


    | Parameter | Description |

    | --- | --- |

    | security | This parameter has four possible values: share, user, server, domain
    |

    | password server | In the case of server or domain security level this server
    is used for authorization. For the parameter value you use the server NetBIOS
    name. |

    | encrypt passwords | By setting this parameter to yes, you enable Samba to use
    the Encrypted Password Protocol, which is used in Windows NT Service Pack 3 and
    in Windows 98. This is needed to communicate with those clients.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '| Parameter | Description |

    |---|---|

    | smbpasswd file | This parameter tells Samba where encrypted passwords are saved.
    |


    The security modes are as follows:


    +   - Share - for this security mode, clients only need to supply the password
    for the resource. This mode of security is the default for Windows 95 file/print
    server. It is not recommended for use in UNIX environments, because it violates
    the UNIX security scheme.

    - User - the user/password validation is done on the server that is offering the
    resource. This mode is most widely used.

    - Server - the user/password validation is done on the specified authentication
    server. This server can be a Windows NT server or another Samba server.

    - Domain - this security level is basically the same as the server security level,
    with the exception that the Samba server becomes a member of a Windows NT domain.
    In this case the Samba server can also participate in such things as trust relationships.


    Because Windows NT 4.0 Service Pack 3 or later, with the latest patches, and Windows
    98 use the encrypted passwords for accessing NetBIOS resources, you need to enable
    your Samba server to use the encrypted passwords. Before you start the Samba server
    for the first time, you need to create a Samba encrypted passwords file. This
    can be done with the mksmmbpasswd utility. The recommended way is to first create
    the user accounts in Linux and then create the Samba password file with the command:


    ```

    cat /etc/passwd | /usr/sbin/mksmmbpasswd > /etc/samba.d/smbpasswd

    ```


    This creates the Samba password file from the Linux password file.


    > Note

    Use the same filename you specified for creating the Samba password file in the
    smb.conf configuration to tell the Samba server where the password file is.


    By default the passwords for the Samba users are undefined. Before any connection
    is made to the Samba server, users need to create their passwords.


    ![](img/2d69b129b41635ef36a3e6707d34b788_145_0.png)'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'Now you need to specify the password for all users. If you are changing or
    specifying a password for a user, you can do this by executing the command:

    > /usr/bin/smbpasswd -U username


    You will see a window similar to Figure 133.


    ```

    root@nf5000 /# /usr/bin/smbpasswd -U user

    New SMB password:

    Retype new SMB password:

    Password changed for user user.

    root@nf5000 /# _

    ```


    Figure 133. Specifying the password for Samba


    > Note

    Anyone with access to /usr/bin/smbpasswd can change passwords for the Samba users.


    Another way is to have each Samba user change the password for himself, by remotely
    connecting to the Samba server and executing the command:

    > /usr/bin/smbpasswd


    The output will be similar to Figure 133. If a Samba user already has defined
    a password he will need to type the old password before he can change to a new
    password.


    If you want to add a Samba server user later, this can be done with the following
    command:

    > /usr/sbin/smbpasswd -a username password


    This will add a new user to the Samba password file.


    > Note

    You have to be logged on as root if you want to manage other users. If you are
    logged on as a user, you can only change your own password. The smbpasswd utility
    uses the location of the password file from the smb.conf configuration file.


    # 4.2.1.4 Global name resolution settings


    In your smb.conf file you will see something similar to this:'
  merge: -1
