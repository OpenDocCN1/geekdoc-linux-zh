    #  2.20.1 Loading a new module


    When you install a new piece of hardware you need to load the appropriate module
    if you want the hardware to be useful. In Linux, drivers can be loaded or unloaded
    without restarting the system. It may take some time to get used to this if you
    are used to another popular operating system. To load a new module select the
    module from the left side and click Load. You will see a window similar to Figure
    125.


    ![](img/2d69b129b41635ef36a3e6707d34b788_124_0.png)


    Figure 125. Module configuration


