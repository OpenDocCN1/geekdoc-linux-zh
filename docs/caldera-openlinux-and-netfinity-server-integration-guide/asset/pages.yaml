- img_proc: true
  md: '3. Second.itso - this is the second subdomain of the .itso domain. The main
    server in this domain is running the DNS for this domain and is mail (Sendmail)
    server for the users of the domain.


    All users of the mail server have user name/password definition on their domain
    server even if they are using other physical servers or workstations. They need
    this user name/password for accessing the mail. Each defined user has a mailbox
    on the mail server. He can reach mail over the network with his client connecting
    to the mail server. When the connection is established, the user can download
    his messages to his workstation and delete them from the server. Or he can remotely
    connect to the server and read his mail on the server, but in this case the mail
    stays in the mailbox on the server.


    When the users are using the server for mail only and they have their own workstations,
    the mail servers are setup with limited space for each mail box. That means users
    have to download their mail regularly from the server to make room for the new
    messages. In the environment where users use the server for their operations the
    mailboxes are usually bigger. Users can reach their mail remotely with the client,
    in that case they do not download the messages.


    The most commonly used protocols for sending and delivering mail are SMTP/POP3.
    The Simple Mail Transfer Protocol (SMTP) is used for sending mail from the mail
    client and the Post Office Protocol (POP3) is for getting the mail from the mail
    server. Sendmail supports along with all other protocols also the SMTP and POP3
    protocols. In our setup we used SMTP/POP3 protocols for the mail exchange.


    Before we start describing to set up a mail server, we will describe how to set
    up DNS for our lab network. That is because the correct DNS setup is important
    for successful operating of the mail server.


    # 8.4 Network configuration


    Each subdomain is on its own network. The "first.itso" domain is on the network
    172.168.0.0 and "second.itso" domain is on the network 192.168.0.0. The server
    running the "itso" domain is acting as gateway for both subdomains.


    We have the following network definitions:


    +   1. The gateway server with two Network Interface Cards (NIC). The first NIC
    has an IP 172.168.0.1, the second IP has the IP 192.168.0.1. The server'
