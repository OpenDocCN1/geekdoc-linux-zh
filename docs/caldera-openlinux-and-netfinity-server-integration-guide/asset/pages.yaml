  md: '# Note


    When using the IBM Turbo 16/4 ISA adapter you must set it to auto 16/4 compatibility
    mode. This is done by using the LANAID C diskette and running this command:


    ```

    LANAIDC /fast=auto16

    ```


    If you are not sure, run LANAIDC /view.


    +   4. Click OK to load the module. If the module is loaded successfully the window
    will close and you will see a green light on the back of the network card.


    +   5. You need to create a network script for the token-ring network card. In
    our example we are assuming that this is the first token-ring network card in
    your server. With your favorite editor create the file:


    ```

    /etc/sysconfig/network-scripts/ifcfg-tr0

    ```


    The file should look like this:


    ```

    DEVICE=tr0

    IPADDR=9.24.104.202

    REMIP=0.0.0.0

    NETMASK=255.255.255.0

    BROADCAST=9.24.104.255

    MTU=1500

    GATEWAY=9.24.104.1

    BOOT=yes

    ```


    You need to adapt all addresses to your configuration.


    # Note


    Caldera OpenLinux does not support DHCP for the token-ring cards. If you want
    to have DHCP running on your token-ring card you need to download the DHCP client
    that supports the token-ring cards from http://www.isc.org/ and configure the
    /etc/sysconfig/network-scripts/ifup-dhcp script to use the new client.


    If you want to use DHCP with your network card then you have to add an additional
    line to the /etc/sysconfig/network-scripts/ifcfg-tr0 file:


    ```

    DYNAMIC=dhcp

    ```'
