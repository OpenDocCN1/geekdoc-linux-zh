  md: '# Preface


    Caldera OpenLinux 2.3 and OpenLinux eServer are the latest editions of the popular
    Caldera Linux distribution. OpenLinux 2.3 and eServer are the fully tested, proven,
    stable and supported Linux distributions for corporate and home use. OpenLinux
    delivers reliability, ease of installation and administration, high performance,
    security, and robust applications. This version of OpenLinux includes the latest
    version of LIZARD (Linux Wizard), the powerful but simple-to-use graphical installation
    program. LIZARD automatically detects all supported hardware and helps you to
    get OpenLinux up and running quickly.


    # Assumptions about you


    This redbook will help you install and configure OpenLinux on IBM Netinity servers;
    furthermore it will help you understand, install and configure a wide range of
    different services, such as Samba, Apache and LDAP among others.


    Do I need to be a Linux expert to use this guide? The answer to question is "No".
    This redbook is aimed at beginners and intermediate Linux users and for all Windows
    NT users who are used to the safe and convenient graphical user interface.


    # The team that wrote this redbook


    This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Raleigh Center.


    ![](img/2d69b129b41635ef36a3e6707d34b788_14_0.png)


    Jakob Carstensen is an Advisory Specialist for Netinity Servers at the International
    Technical Support Organization, Raleigh Center. He manages residencies and produces
    redbooks. His most recent publication was Linux for WebSphere and DB2 Servers.
    Before joining the ITSO, he worked in Denmark for the IBM PC Institute teaching
    TechConnect and Service Training courses, and for IBM PSS performing level-2 support
    of Netinity products. He has a Bachelor of Electronic Engineering degree and has
    worked for IBM for the past nine years.


    ![](img/2d69b129b41635ef36a3e6707d34b788_14_1.png)


    Ivo Gomilsek is a Product Specialist for PC Hardware in IBM Slovenia. He is IBM
    Certified Professional Server Specialist, Red Hat Certified Engineer, OS/2 Warp
    Certified Engineer and Vinta Co-StandbyServer for Windows NT Engineer. Ivo was
    a member of the team who wrote the redbook Implementing Vinta Solutions on IBM
    Netinity Servers. His areas of expertise'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'include IBM Netfinity servers, network operating systems (OS/2, Linux, Windows
    NT) and Lotus Domino Servers. During his career he has worked as a Systems Engineer
    PSG and is now working in Product Support Services (PSS) as level-2 for IBM Netfinity
    servers, and has availability solutions for IBM Netfinity servers and Linux. Ivo
    has been employed at IBM for three years.


    ![](img/2d69b129b41635ef36a3e6707d34b788_15_0.png)


    **Lenz Grimmer** is a Software Engineer at SuSE GmbH in Nuremberg, Germany. He
    belongs to the distribution team development and is responsible for a number of
    packages on the distribution. He has five years of experience with Linux (since
    Kernel 0.99.xx) and holds a degree in Computer Science from the Berulsakademie
    in Mannheim, Germany. Before he started for SuSE in April 1998, he worked as a
    system administrator for a local Internet service provider that used Linux exclusively
    for its servers. His areas of expertise include setting different Linux services
    such as Apache, Samba and Squid. In addition to being helpful on several SuSE
    mailing lists, he is available online at http://www.suse.com/Support/Doku/FAQ/


    ![](img/2d69b129b41635ef36a3e6707d34b788_15_1.png)


    **Jay Haskins** is a Systems Architect for IBM Global Services Enterprise Architecture
    and Design in Seattle, Washington. He has been a Linux and Open Source advocate
    for more than five years and currently spends most of his time developing monitoring
    tools using Perl and the Apache Web server. Before joining IBM, Jay worked in
    several areas of the information technology field including UNIX system administration,
    database design and development, Windows application development, and network
    administration.


    ![](img/2d69b129b41635ef36a3e6707d34b788_15_2.png)


    **Joe Kaplenk** is a Senior Systems Management Integration Professional for IBM
    Global Services/DAAS in Lisle, Illinois. He has 20 years of experience in the
    computer field. He holds a degree in Physics from the University of Utah. His
    areas of expertise include UNIX system administration and computer science education.
    He has written several books on UNIX and Linux system administration, including
    the *UNIX System Administrator''s Interactive Workbook* and the *Linux Network
    Administrator''s Interactive Workbook*, both published by Prentice-Hall, as well
    as contributing articles to Linux journals. He has worked with IBM for three years.
    He has also been teaching Computer Science part-time at the College of DuPage
    in Glen Ellyn, Illinois for 16 years and UNIX administration for seven years.


    Thanks to the following people for their invaluable contributions to this project:
    Erik Ratcliffe, Caldera Systems'
