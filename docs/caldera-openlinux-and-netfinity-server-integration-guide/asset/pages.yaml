    ln -s ../init.d/ibmhttpd /K01ibmhttpd

    ```


    ```

    cd /etc/rc.d/rc5.d


    ln -s ../init.d/ibmhttpd /S67ibmhttpd

    ln -s ../init.d/ibmhttpd /K01ibmhttpd

    ```


    This will start the IBM HTTP server in runlevel 2 and runlevel 3 and make sure,
