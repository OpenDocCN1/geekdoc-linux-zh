    # 1.6.3 Replacing a defunct drive


    When a physical drive in a RAID array becomes defunct you will see a light signal
    on the drive. You can simulate a defunct drive by executing the following command:


    ```

    ipssend setstate 1 1 4 ddd

    ```


    In this case we are simulating that the drive with SCSI ID 4 on channel 1 on the
    first ServeRAID controller is defunct. The following steps should be taken to
    replace the defunct drive:


    +   1. Physically replace the defunct drive with a good drive.

    2. The IBM ServeRAID controller will start rebuilding the drive automatically.


    > Note

    Automatically rebuilding will work only on ServeRAID II and III. And Hot Spare
    Rebuild must be set to Enabled!


    You can check the progress of rebuilding the logical drives on the first IBM ServeRAID
    controller with this command:


    ```

    ipssend status 1

    ```


    You will see output similar to Figure 43 on page 41.


    If the rebuild is not completed successfully, you will see output similar to Figure
    51.'
