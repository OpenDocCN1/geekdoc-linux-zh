  md: '# 4.4.1 Downloading and installing OpenLDAP


    Although Calder OpenLinux includes a source package of OpenLDAP, a patch needs
    to be applied to the source before compilation. The recommended way is to download
    the latest stable version and the patch from the official OpenLDAP ftp site: ftp://ftp.openldap.org.
    The patch addresses inconsistencies between OpenLDAP and Netscape''s LDAP implementations.
    The patch will not be incorporated into later releases of OpenLDAP. OpenLDAP''s
    position is that their current implementation is consistent with the OpenLDAP
    precedent.


    Download the latest stable version of OpenLDAP from:


    ```

    ftp.openldap.org/pub/openldap

    ```


    Download the Netscape patch (Albert-FitzPatrick-9905019.gz) from:


    ```

    ftp.openldap.org/pub/openldap/incoming/

    ```


    Unpack OpenLDAP by typing:


    ```

    tar -xvzf openldap-stable.tgz

    ```


    Apply the patch before compilation and installation.


    ```

    gunzip < Albert-FitzPatrick-9905019.tar.gz > roaming.patch

    cd ld/servers/slapd

    patch ../../../roaming.patch

    cd ../../../(ldap)

    ```


    Begin the Installation procedures:


    ```

    ./configure

    make depend

    make

    cd tests

    ```


    The following step will test OpenLDAP. Pay attention to any errors.


    ```

    make

    cd ..

    make install

    ```


    OpenLDAP is now installed.'
  merge: -1
  pgno: 220
