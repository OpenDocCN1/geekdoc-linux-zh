    # 1.6.2.4 The hsrebuild command


    This command is used for setting the state of the Hot Swap Rebuild option.

    The hsrebuild command has the following syntax:


    ```

    ipssend hsrebuild <Controller> <Options>

    ```


    The parameters are explained in Table 4.

    Table 4. hsrebuild command parameters


    | Parameter | Description |

    |---|---|

    | Controller | Number of controller (1 to 12) |

    | Options | ON: enable Hot Swap Rebuild |

    | ?: Display status of Hot Swap Rebuild feature |


    With this command you can retrieve or set the Hot Swap Rebuild feature. The Hot
    Swap Rebuild feature is ON, it means that if one drive in the RAID array fails,
    rebuilding of this drive will start automatically when you replace the failed
    drive with new one. This can improve the safety of your data.


    > Note

    The Hot Swap Rebuild feature should not be confused with a hot spare drive. A
    hot spare drive means that a drive is in a waiting state as long as the RAID array
    is in an Okay state. Once the RAID array becomes a Critical state, the hot spare
    drive is enabled and the data from the defunct drive automatically gets rebuilt
    onto the hot spare drive, disregarding the Hot Swap Rebuild setting.'
