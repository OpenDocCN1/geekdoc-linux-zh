  md: '# Chapter 12. Packet filtering with IP Chains


    Whenever you connect your computer to today''s Internet world you are exposed
    to intruders from the outside. There are thousands of hackers just waiting to
    get into your computer to do damage or maybe to steal information. Therefore you
    need protection against them!


    # 12.1 What is packet filtering?


    As you can tell from the name, packet filtering is a kind of filter, filtering
    the data coming to your computer. Packet filtering is one method commonly used
    in firewall implementations. With packet filtering you can implement a firewall
    that will protect your computer from the outside world.


    Because everybody wants to communicate sooner or later you need to connect your
    private network to the Internet. At that point it is time to think about security.
    You can also use a firewall on a single computer which is for example connected
    to the Internet through a dial-up line. When you install a firewall to protect
    your internal network every computer that wants to talk to a computer on the internal
    network, ask the firewall for permission. If the permission is not granted, access
    is denied.


    # 12.2 What can you do with Linux packet filtering?


    With Linux packet filtering you can do many things. Let us describe a few of them
    here:


    +   * You can protect your internal network connected to the Internet from outside
    intruders.

    * You can perform Network Address Translation (NAT), which allows internally connected
    computers without a registered Internet address to reach the Internet resources.

    * You can filter the information going in or out of your internal network or just
    one computer.

    * You can use your Linux server as a gateway between two different types of network,
    for example connecting token-ring and Ethernet worlds. This can be a cheap solution
    in comparison to buying an expensive router to this job.

    * You can share your dial-up Internet connection with others.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# 12.3 What do you need to run packet filtering?


    To set up a packet filter server with IP Chains, your Linux installation needs
    to meet requirements:


    +   1. You need kernel Version 2.2.x or higher. It is recommended that you use
    the latest available stable version. The kernel has to be compiled with appropriate
    modules for IP Forwarding, IP Masquerading, and IP Firewalling. We recommend that
    you compile all your networking options and available modules. If you want to
    use your Linux server as a router, enable IP - optimize as router not host. This
    will also increase the routing performance.

    2. Loadable kernel modules Version 2.1.121 or newer

    3. IP Chains 1.3.8 or newer


    ![](img/2d69b129b41635ef36a3e6707d34b788_247_0.png)


    The default installation of Caldera OpenLinux meets all these requirements except
    that the kernel is not optimized to be used as a router. So if you want to increase
    the performance of the routing process, you should recompile the kernel and choose
    the IP - optimize as router not host option.


    # 12.4 Network configuration for a packet filtering implementation


    In this section we will describe our lab network setup for implementing a packet
    filtering solution.'
