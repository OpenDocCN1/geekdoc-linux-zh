    In short, experiment with the following options:


    +   - Set FollowLinks option unless you really do not want it.

    - Set AllowOverride to None unless you really need it.

    - Explicitly list every Directory files from most to least commonly used.

    - Tune KeepAliveTimeout starting with 3 ranging to 30 per content and connection
    types.

    - Apache (and the IBM HTTP Server as well) uses multiple processes to handle individual
    requests. Tune StartServers starting with 64 increasing in steps of 32 until performance
    drops. Tune MaxClients starting with the value of StartServers. **Note:** Scaling
    performance can fall off dramatically if Max Clients is too large!

    - For SMP systems listening on a single socket, try recompiling after SINGLE_LISTEN_UNSERIALIZED_ACCEPT.


