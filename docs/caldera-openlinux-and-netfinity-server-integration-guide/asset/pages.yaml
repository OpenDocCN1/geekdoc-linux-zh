    By default, the IBM HTTP Server has to be started manually after a system reboot.
    If you want to start it automatically, you have to add the startup script to the
    bootup procedure.


    If you want this server to be started on bootup, you have to create the correct
    symbolic links in the directory /etc/rc.d/rc3.d (if you start the system in runlevel
    3, the default runlevel), or /etc/rc.d/rc5.d (If you start the system in runlevel
