- img_proc: true
  md: 'name resolve order = wins lmhosts bcast

    wins support = yes

    ; wins server = w.x.y.z


    The parameters are described in Table 15.


    | Parameter | Description |

    | --- | --- |

    | name resolve order | With this parameter you specify how the Samba server resolves
    NetBIOS names into IP addresses. The preferred value is wins lmhosts bcast. Refer
    to the manual page of the smb.conf file for more information. |

    | wins support | If this option is enabled the Samba server will also act as a
    WINS server. |

    | wins server | With this parameter you tell Samba which WINS server to use. |


    ![](img/2d69b129b41635ef36a3e6707d34b788_147_0.png)


    Samba can act as a WINS server or a WINS client, but not both. So only one of
    the parameters (wins support or wins server) can be set at the same time. If you
    specify the IP address of WINS server, then wins support must be set to no.


    # 4.2.1.5 Creating shares


    In the previous section we explained how to prepare general configuration parameters.
    But a Samba server can be useful when you offer resources to the users. In this
    section we will explain how to create a share. The simple share section in the
    smb.conf file looks similar to this:


    ```

    [redbook]

    comment = Redbook files

    path = /redbook

    browseable = yes

    printable = no

    writable = yes

    write list = @users

    ```'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'Table 16 describes the most important parameters for creating a share.


    Table 16. Share parameters


    | Parameter | Description |

    | --- | --- |

    | comment | This describes the function of the share. |

    | admin users | This parameter is used to specify the users who have administrative
    privileges for the share. When they access the share they perform all operations
    as root. |

    | path | Defines the full path to the directory you are sharing. |

    | browseable | If this parameter is set to yes, you can see the share when you
    are browsing the resources on the Samba server. The value can be yes or no. |

    | printable | This parameter specifies if the share is a print share. The value
    can be yes or no. |

    | write list | Users specified in this list have write access to the share. If
    the name begins with @ it means a group name. |

    | writable | This parameter specifies if the share is writable. The value can
    be yes or no. |

    | read list | Users specified in this list have read access to the share. If the
    name begins with @ it means a group name. |

    | read only | If this is set to yes, share is read only. The value can be yes
    or no. |

    | valid users | This parameter specifies which users can access the share. |


    By using these parameters you can easily set up a new share. Each share definition
    starts with the share name in brackets "[]." Below this name you can specify the
    values for the share parameters.


    # 4.2.1.6 Share permissions


    Although you can control the share permissions with share parameters, UNIX permissions
    are applied before the user can access files on the share. So you need to take
    care of UNIX permissions, so the user also has access to the shared directory
    under UNIX.


    When a user creates a new file on the shared directory, the default create mask
    used is 0744. For directory creation, the default create mask is 0755.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'you want, you can force a different creation mask. The parameters for this
    are explained in Table 17.


    Table 17. Create mask parameters


    | Parameter | Description |

    | --- | --- |

    | create mask | This is used for file creation to mask against UNIX mask calculated
    from the DOS mode requested. |

    | directory mask | This is used for directory creation to mask against UNIX mask
    calculated from the DOS mode requested. |


    # 4.2.1.7 Creating shares for home directories


    For handling home directories Samba has a special share section called [homes].
    This share definition is used for all home directories, so you do not need to
    create separate shares for each user.


    When a client requests a connection to a file share, existing file shares are
    scanned. If a match is found, that share is used. If no match is found, the requested
    share is treated as a username and validated by security. If the name exists and
    the password is correct, a share with that name is created by cloning the [homes]
    section. The home share definition uses the same parameters as a normal share
    definition. The following is an example of a home share definition in the smb.conf
    configuration file:


    ```

    [homes]

    comment = Home Directories

    path = %H

    valid users = %S

    browseable = no

    writable = yes

    create mode = 0700

    directory mode = 0700

    ```


    As you can see, we used some variables in this definition, which are explained
    in Table 18.


    Table 18. Variable description


    | Parameter | Description |

    | --- | --- |

    | %H | This variable represents the home directory of the user. |

    | %S | The name of the current service, which is, in the case of home share, equal
    to username. |'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'As you can see in the example, we used creation masks for the files and the
    directories in such a way that we forced new files or directories to be accessible
    only by the owner of the home directory.


    # 4.2.1.8 Creating a printer share


    A Samba server uses the same procedure for printer shares as the home shares.
    If all share definitions and usernames are tested against the requested share
    name and the matched definition is still not found, Samba searches for a printer
    with name (if the [printers] section exists). If the match is found in the printer
    definitions that [printers] share section is cloned by the requested service,
    which is really a printer name. The printers definition in the smb.conf configuration
    file:


    ```

    [printers]

    comment = All Printers

    path = /var/spool/samba

    browseable = no

    # Set public = yes to allow user ''guest account'' to print

    guest ok = no

    writable = no

    printable = yes

    create mask = 0700

    ```


    As you can see the [printers] section is just another share definition, when a
    user prints they basically copy the data into a spool directory, after that the
    data is handled by the local printing system. The only difference between a printer
    share and other share definitions is that the printable parameter is set to "yes".
    This means that a user can write a spool file to the directory specified under
    the share definition. If the share is printable, then it is also writable by default.


    # 4.2.2 Starting and stopping the Samba server


    You can start the Samba server by executing the command:


    ```

    /etc/rc.d/init.d/samba start

    ```


    You will see output similar to the following:


    ```

    [root@nf5000 /root]#etc/rc.d/init.d/samba start

    Starting samba: smbd nmbd.

    ```


    As you can see, two daemons are started: smbd and nmbd. Smbd is the actual Samba
    server and nmbd is the WINS server.'
  merge: -1
