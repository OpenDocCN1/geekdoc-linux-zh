  md: '# Chapter 8. Sendmail


    Communicating with other people is one of the most desirable experiences in the
    human history. Sending electronic mail is a way to communicate with people all
    over the globe. Electronic mail can be more reliable, cheaper and faster than
    ordinary mail.


    # 8.1 What is Sendmail?


    As you can tell from the name, Sendmail is used to send mail. However, Sendmail
    is not sending old fashioned mail, but electronic mail, which becomes more important
    every day. But in spite of that, Sendmail is basically acting as a post office.
    It receives mail from a sender and passes the mail to the recipient post office.
    At the recipient post office a local postman delivers the mail to the recipient
    mailbox. Sendmail is a powerful Mail Transport Agent (MTA) and is used to pass
    the mail to another MTA, which can be Sendmail or some other application capable
    of handling electronic mail.


    # 8.2 What you can do with Sendmail


    With Sendmail your Linux server can become a server for electronic mail. You can
    handle mail for users of a Linux server locally and users do not have to ask for
    mail accounts. The users on your Linux server will have their mailboxes locally
    and they will still be able to send mail to people anywhere. When you set up Sendmail,
    you can also offer mail service to the users who have accounts on the other network
    servers, which do not provide Internet mail service.


    # 8.3 Before you begin


    In the following sections we explain how to set up a mail server on your Linux
    server. In this explanation we will use our lab network setup, and all setup is
    related to this lab setup. You can easily adopt this to your existing installation.
    You can see our lab network need in Figure 159. Before you proceed with the implementation
    you need to verify if these packages are installed:


    +   * bind-8.1.2-1

    * bind-utils-8.1.2-1

    * sendmail-8.9.3-1

    * sendmail-cf-8.9.3-1'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'You can do this by starting package tool from COAS tools as we explained in
    2.5, "Adding and removing software packages using kpackage" on page 72. These
    packages are in the Network and Mail subsections under the Server section. If
    the packages are not installed refer to the same package on how to install them.


    ![](img/2d69b129b41635ef36a3e6707d34b788_199_0.png)


    Figure 159. Lab network installation for Sendmail setup


    > Note

    For successful operation of Sendmail you need the correct settings for the Domain
    Name System server (DNS). This means that you have to set up your own DNS correctly
    or have access to another DNS.


    As you can see in Figure 159 our network consists of three domains:


    +   1. Itso - this is the master (root) domain. All computers in this domain has
    a .itso extension. In this domain we have a server running the master (root) DNS.

    2. First.itso - this is the first subdomain of the .itso domain. The main server
    in this domain is running the DNS for this domain and is also mail (Sendmail)
    server for the users of the domain.


    182 Caldera OpenLinux and Netfinity Server Integration Guide'
  merge: -1
