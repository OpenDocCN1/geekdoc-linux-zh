  md: '# Appendix D. Hardware issues for IBM Netfinity servers


    In this appendix we explain what you need to consider when you install Calder
    OpenLinux on IBM Netfinity servers. This is because Calder OpenLinux 2.3 and eServer
    have some limitations when installing on IBM Netfinity servers. Below you can
    find some hints for installing Calder OpenLinux on IBM Netfinity servers:


    +   1. Netfinity 3000

    - Although S3 Trio3D graphics chip is supported in XFree86 3.3.4 included in Calder
    OpenLinux 2.3 and XFree 3.3.5 included in eServer, only some modes are working.


    +   2. Netfinity 3500M10

    - S Savage4 graphics chip is not supported in XFree86 3.3.4 included in Calder
    OpenLinux 2.3, so you can only use VGA gear.

    - S Savage4 graphics chip is supported in XFree86 3.3.5 included in Calder OpenLinux
    eServer, but only some modes are working.


    +   3. Netfinity 5000

    - Calder OpenLinux 2.3 install does not recognize the CD-ROM, so it is impossible
    to install from CD-ROM.

    - S Trio64V2 GX chip is supported in XFree86 included in Calder OpenLinux eServer,
    but only some modes are working.


    +   4. Netfinity 5600

    - S Trio64 3D graphics chip is supported in XFree86 3.3.4 included in Calder OpenLinux
    2.3 and in XFree86 3.3.5 included in Calder OpenLinux eServer, but only some modes
    are working.

    - AMD Am79C973 onboard Ethernet adapter is not supported in kernels up to 2.2.12.


    +   5. Netfinity 5500 M10

    - S Trio64V2 GX graphics chip is supported in XFree 3.3.4 included in Calder OpenLinux
    2.3 and in XFree 3.3.5 included in Calder OpenLinux eServer, but only some modes
    are working.


    +   6. Netfinity 5500 M20

    - S Trio64V2 GX graphics chip is supported in XFree 3.3.4 included in Calder OpenLinux
    2.3 and in XFree 3.3.5 included in Calder OpenLinux eServer, but because of the
    implementation on planar board only VGA server is working'
