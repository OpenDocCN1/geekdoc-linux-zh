    3. The server for the "second.itso" domain has one NIC with IP address 192.168.0.10.


    4. The client in "second.itso" domain has one NIC with IP address 192.168.0.20


    5. The client in "first.itso" domain has one NIC with IP address 172.168.0.20.


    # 8.5 Setting up the DNS configuration


    As mentioned before our lab network setup was created with a master (root) domain
    called ".itso" with two subdomains called "first.itso" and "second.itso". You
    can see this setup in Figure 160.


