    # 1.6.6 Using the Ipsmon utility


    The ipsmon utility is part of the ipsutils.rpm package. It can be used to monitor
    the current status of the IBM ServeRAID controller. The ipsmon command has the
    following syntax:


    ```

    ipsmon <-f:filename>-s

    ```


    The parameters are explained in Table 9.


    | Parameter | Description |

    | -f:filename | Specifies a filename to report messages; default filename is ipsmon.log
    |

    | -s | Specifies if messages should only be logged to the standard output device
    |


