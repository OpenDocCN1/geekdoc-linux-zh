- img_proc: true
  md: "# You need to be sure that the exporting server can recognize the server name.\n\
    \nTable 19. Access options\n\n| Access options |\n| --- | --- |\n| ro read only\
    \ | Only permits reading |\n| rw read write | Permits reading and writing. If\
    \ both ro and rw are specified, rw takes priority. |\n| root_squash client | Anonymous\
    \ user (nobody) access from client. |\n| no_root_squash client | Access request\
    \ privileges per the privileges of the client root. Useful for diskless clients.\
    \ |\n| squash_uids and squash_gids | Specify a list of UIDs or GIDs that should\
    \ be subject to anonymous mapping. A valid list of IDs looks like this: squash_uids=0-15,20,25-50\
    \ |\n| all_squash all access | Processes all requests for access as anonymous\
    \ user. |\n| anonuid=uid | root_squash or all_squash when options are set assign\
    \ a group ID to an anonymous user request. |\n| anonuid=gid | root_squash or all_squash\
    \ when options are set assign a group ID to an anonymous user request. |\n\nA\
    \ sample /etc/exports file is shown in the man pages for exports and in Figure\
    \ 182.\n\n```\n# sample /etc/exports file\nmaster(ro,rw).trusty(rw,no_root_squash)\n\
    /projects      proj*.local.domain(ro) @trusted(rw)\n/usr           *.local.domain(ro)\
    \ \n/home/joe      pc001(ro,all_squash,anonuid=150,anogid=100)\n/pub         \
    \  (ro,insecure,all_squash)\n/pub/private (noaccess)\n```\n\nFigure 182. A sample\
    \ /etc/exports file"
