  md: '# Caldera OpenLinux and Netfinity Server Integration Guide


    Jakob Carstensen, Ivo Gomilsek, Lenz Grimmer, Jay Haskins, and Jo Kaplenk


    The complete, expert guide to running Caldera OpenLinux on IBM Netfinity® Servers


    +   - Comprehensive, Netfinity server-specific coverage of installation, configuration,
    management, and troubleshooting

    - Specific, proven recommendations for disk partitioning, hardware management,
    SAMBA configuration, and more

    - Caldera OpenLinux performance optimization and system monitoring


    Extensive networking, Internet, and security coverage: Apache, DNSmail, Samba,
    DNS/DHCP, ipchains, and more


    Here''s all the information you need to maximize Caldera OpenLinux performance
    and reliability on IBM''s state-of-the-art Netfinity server platforms. In this
    book, IBM''s top Linux experts present specific coverage of OpenLinux 2.3/e server
    deployment and system administration throughout the entire lifecycle


    You''ll get running fast with IBM''s expert step-by-step preparation and installation
    techniques: reviewing your BIOS and firmware; preparing SCSI devices, partitioning,
    configuration, Windows setup, deploying IBM CD-ROM bootable IBM ServerRAID in
    OpenLinux environments, and much more.


    All content fully tested by IBM technicians for reliability, clarity, performance,
    and security


    Next, you''ll master all the key techniques of day-to-day OpenLinux administration,
    including backup and recovery, Internet and email connectivity, DNS/DHCP name
    services, and using OpenLinux with Samba as a world-class file/print server for
    Windows workstations, IBM-tested, proven, and crystal clear, this is the essential
    book for everyone running OpenLinux on Netfinity servers.


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    SHARING TECHNICAL EXPERTISE FROM AROUND THE WORLD


    Prentice Hall PTR has selected this IBM Redbook for its worldwide publishing program
    IBM Redbooks are produced by the International Technical Support Organization
    where experts from around the world work together to build effective technical


    based on their work experience.


    For information: www.com/redbooks


