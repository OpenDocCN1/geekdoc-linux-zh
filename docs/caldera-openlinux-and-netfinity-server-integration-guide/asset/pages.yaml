    the dialog shown in Figure 117 on page 101. Then click OK to close the configuration
    window. On the next window, click Save to save the changes you made.


    If you have more than one Ethernet NIC adapter and you want to remove the adapter
    eth1 for example, follow these steps:


    +   1. Stop the interface by executing the command:


    ```

    /sbin/ifdown eth1

    ```


    +   2. Delete the file /etc/sysconfig/network-scripts/ifcfg-eth1 by executing
    the command:


    ```

    rm /etc/sysconfig/network-scripts/ipcfg-eth1

    ```


    This procedure can be used for all adapters when you have multiple adapters defined.


