    Figure 132. Checking for the Samba package


    As you can see in Figure 132, the Samba package is installed.


    # 3.2.1 Configuring the Samba server


    In this section we will explain how to configure Samba so it can participate as
    a file/print server in Windows network or be just a stand-alone file/print server
    for Windows and Linux clients.


    Before you start using Samba you need to configure the smb.conf file. This file
    is the heart of the Samba server. When the Samba package is installed in Calder
    OpenLinux the sample configuration file is installed at /etc/samba.d/smb.conf
    file.


    In Calder OpenLinux, Samba by default uses the smb.conf file in the directory
    /etc/samba.d. To begin with, it is enough just to make a copy of the sample file
    by executing the command:


    ```

    cp /etc/samba.d/smb.conf.sample /etc/samba.d/smb.conf

    ```


    The SAMBA configuration file smb.conf is divided into two main sections:


    +   1. Global Settings - here you set up parameters that affect the connection
    parameters.'
  merge: -1
  pgno: 142
- img_proc: true
  md: "2. Share Definitions - here you define shares. A share is a directory server\
    \ that is accessible over the network and shared among users. This section has\
    \ three subsections:\n\n+   a. Homes - in this subsection you define the user's\
    \ home directories.\n\n+   b. Printers - in this subsection you define the available\
    \ printers.\n\n+   c. Shares - this subsection can have more entries, one for\
    \ each share you want to define.\n\nIn the following sections we will describe\
    \ how to modify the smb.conf file to efficiently and simply use Samba as a file/print\
    \ server. We explain only the most necessary parameters. If you need more information,\
    \ see the manual entry for the smb.conf file or the Samba project Web site at:\n\
    \n```\nhttp://www.samba.org\n```\n\nYou can find our smb.conf configuration file\
    \ in Appendix E, “Sample smb.conf configuration file” on page 305.\n\n# 4.2.1.1\
    \ Setting the NetBIOS parameters\n\nThe NetBIOS parameters are part of the Global\
    \ Section. When you open your smb.conf file you will see something similar to\
    \ this:\n\n```\n================ Global Settings ====================\n[global]\n\
    netbios name = NF5000\nworkgroup = LINUX\nserver string = Samba Server on Caldera\
    \ OpenLinux\n```\n\nThe parameters are described in Table 12.\n\n| Table 12. NetBIOS\
    \ parameters |\n| Parameter | Description |\n| netbios name | The Samba server\
    \ is known by this name on the network. This parameter has the same meaning as\
    \ the Windows NT computer name. If you do not specify it defaults to the server's\
    \ host name. |\n workgroup | This parameter specifies in which Windows NT domain\
    \ or workgroup the Samba server will participate. It is equivalent to Windows\
    \ NT domain or workgroup name. |\n server string | This is the description string\
    \ of the Samba server. It has the same role as the Windows NT description field.\
    \ |"
