    # 6 Installation with ServeRAID


    In this section we will describe how to install Caldera OpenLinux products on
    the IBM Netfinity servers with the IBM ServeRAID controller and how to use the
    features of the IBM ServeRAID controller. The IBM ServeRAID controller is a high-performance
    RAID controller. In the current version of the Linux driver all ServeRAID adapter
    versions are supported. Before you start the installation, you need to define
    the RAID arrays and the logical drives. The logical drives are represented to
    the operating system as if they were physical disk drives. For more information
    on RAID levels and performance issues, see Appendix A, "RAID levels" on page 283.'
