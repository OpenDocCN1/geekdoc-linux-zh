  md: 'You need to execute all the previous instructions on the servers in both domains
    (first.itso and second.itso) if you want to send mail from one domain to another.


    # 8.5.4.1 Configure Sendmail


    By default Sendmail can deliver mail to a defined user if it can reach the mail
    server for the user''s domain. So, for example, if you are on an internal network
    and your Sendmail server does not have direct connection to the Internet you can
    configure Sendmail to route mail through another reachable mail server, which
    is connected to the Internet. To do this you need to enter the appropriate values
    into the /etc/sendmail/mailertable file. For example, if you want to route the
    mail for otherdomain.com through reachableserver, then your /etc/sendmail/mailertable
    file will look similar to this:


    ```

    #

    # /etc/mailertable

    # This file can be used to fine-tune sendmail''s email routing.

    # After you change this file, you must rebuild the DB file using

    # /usr/sbin/makemap hash /etc/sendmail/mailertable < /etc/sendmail/mailertable

    # otherdomain. smtp:reachableserver

    ```


    This means that all mail for otherdomain will be routed to the reachableserver
    mail server with the SMTP protocol. The domain name must always have a ".dot at
    the end. With this setup you can route mail from server to server until it reaches
    its destination.


    Whenever you modify the /etc/sendmail/mailertable.db file, which is really the
    used by Sendmail to perform routing tasks. You can do this by executing the command:


    ```

    /usr/sbin/makemap hash /etc/sendmail/mailertable

    /etc/sendmail/mailertable

    ```


    If you want all your mail to be routed to another server, you may do this by appending
    the following line to the /etc/sendmail/mailertable file:


    ```

    smtp:smartserver

    ```


    Where smartserver is the mail server that will handle all mail from your Sendmail
    server.'
  merge: -1
  pgno: 212
