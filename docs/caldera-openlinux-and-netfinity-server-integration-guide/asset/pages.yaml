    # 12.7 How packets travel through a gateway


    In this section we will explain how IP Chains work. You can see the path of a
    packet coming into your server in Figure 186.


    ![](img/2d69b129b41635ef36a3e6707d34b788_251_0.png)


    Figure 186. How the packet is traveling


    Here are short descriptions of each stage:


    +   * Checksum - this is to test if the packet is corrupted or not.

    * Sanity - Malformed packets are denied here.

    * Input chain - This is the first real packet checking point. Packets can be rejected,
    denied or accepted.

    * Demasquerade - If the packet is a reply to a previously masqueraded packet,
    it is demasqueraded and goes directly from here to output chain.

    * Routing decision - Routing code decides if this packet is for a local process
    or should be forwarded to a remote machine.

    * Local process - a process running on the server can receive packets after a
    routing decision step, and can then send the packets, which go through a routing
    decision step and then to the output chain.


    234 Caldera OpenLinux and Netinity Server Integration Guide'
  merge: -1
  pgno: 251
- img_proc: true
  md: '• lo interface - packets from local process are destined for local process,
    they will go through the output chain with interface set to "lo", then they will
    return to the input chain with interface "lo". The "lo" interface is usually called
    the loopback interface.


    • Local - if the packet is not created by the local process, then forward the
    chain is checked.


    • Forward chain - this is the checkpoint for all packets passing through this
    server to another.


    • Output chain - this a a checkpoint for all packets just before they are sent
    out.


    As you can see from Figure 186, you have three places where you can check the
    packets in your server:


    +   a. Input chain

    b. Forward chain

    c. Output chain


    With the /sbin/ipchains command you can set up your rules for packet checking.


    > Note

    By default, all checking policies are set to Accept. This means that all packets
    can come in, go through or go out from your server without any restrictions.


    You can see the current checking policies by executing:

    /sbin/ipchains -L


    You will see a window similar to Figure 187.


    ```

    [root@client /root]# ipchains -L

    Chain input (policy ACCEPT)

    Chain forward (policy ACCEPT)

    Chain output (policy ACCEPT):

    [root@client /root]#

    ```


    Figure 187. Listing the default IP Chains policies


    # 2.8 Using IP Chains


    With the /sbin/ipchains command, you can create, change or delete your own policies
    for checking packets or you can modify built-in policies. You'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'cannot delete the built-in chains, but you can append your rules to the existing
    chains or even create your own chains.


    To manage whole chains you can use the parameters described in Table 20.


    Table 20. *Parameters for managing whole chains*


    | Parameter | Description |

    | --- | --- |

    | -N | Create a new chain |

    | -X | Delete an empty chain |

    | -P | Change policy for a built-in chain |

    | -L | List the rules out of a chain |

    | -F | Flush the rules out of a chain |

    | -Z | Zero the packets and byte counters on all rules in a chain |


    For manipulating rules inside the chain you can use the parameters explained in
    Table 21.


    Table 21. *Parameters for managing rules in the chain*


    | Parameter | Description |

    | --- | --- |

    | -A | Append new rule to a chain |

    | -I | Insert a new rule in a chain at some position |

    | -R | Replace a rule at some position in a chain |

    | -D | Delete a rule at some position in a chain |


    And there are more operations for managing masquerading. They are described in
    Table 22.


    Table 22. *Parameters for managing masquerading*


    | Parameter | Description |

    | --- | --- |

    | -M -L | List the currently masqueraded connections |

    | -M -S | Set masquerading timeout values |


    # 12.8.1 How to create a rule


    The most common syntax for the creating a new rule is:


    ```

    /sbin/ipchains -A input -s source -p protocol -j action

    ```'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'The parameters are described in Table 23.


    # Table 23. IPChains parameters


    | Parameter | Description |

    | -A | Append a new rule to the chain |

    | source | IP address or hostname of the source |

    | protocol | Type of the protocol to which one rule is applied |

    | action | What will happen with the packet:

    1) ACCEPT - packet will be accepted

    2) REJECT - packet will be rejected

    3) DENY - packet is dropped since it was not received

    4) MASQ - packet will be masqueraded

    5) REDIRECT - packet is redirected to local port

    6) RETURN - fall off the chain immediately |


    > > Note: Redirecting packets to a local port using the REDIRECT action makes
    sense only in combination with masquerading for a transparant proxy.


    For example, if you want to create a rule for denying the ICMP packets, which
    are used when you execute the ping command, for a specific IP address you will
    do this by executing the command:


    ```

    /sbin/ipchains -A input -s IP_address -p icmp -j DENY

    ```


    If you omit the protocol definition, all the packets will be denied. So for example
    if you want to block the access to your machine from the network 172.168.0.0 with
    subnet mask 255.255.255.0 you can do this by executing the command:


    ```

    /sbin/ipchains -A inout -s 172.168.0.0/255.255.255.0 -j DENY

    ```


    or with:


    ```

    /sbin/ipchains -A input -s 172.168.0.0/24 -j DENY

    ```


    As you can see, the subnet mask can be specified with the number of used bits
    for that mask.


    The command for not allowing any traffic from your server to the network 172.168.0.0
    with subnet mask 255.255.255.0 will look like this:


    ```

    /sbin/ipchains -A output -d 172.168.0.0/24 -j DENY

    ```


    ![](img/2d69b129b41635ef36a3e6707d34b788_254_0.png)'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'Here we used the "d" parameter for specifying the destination address.


    # 12.8.1.1 Using the inversion flag


    With some of the parameters, you can use the inversion option "!". This means
    that the rule will be applied to everything except to the parameters specified
    after "I". For example, if you want to deny packets that come from all IP addresses
    except from network 192.168.0.0 with subnet mask 255.255.255.0 you can do this
    by executing the command:


    ```

    /sbin/ipchains -A input -s ! 192.168.0.0/24 -j DENY

    ```


    > Note

    The rules you made are not permanent, so next time you restart the server they
    are gone.


    # 12.8.2 Making the rules permanent


    For making the rules permanent you have two scripts available that can make your
    life easier. To save all the rules you created, you can execute the command:


    ```

    /sbin/ipchains-save > filename

    ```


    If you execute this command without file name, the rules will be sent to the standard
    output.


    You can restore the saved rules by executing the command:


    ```

    cat filename /sbin/ipchains-restore

    ```


    So if you want your saved rules to be enabled whenever you start your system,
    add the following line to the /etc/rc.d/rc.local file:


    ```

    cat filename /sbin/ipchains-restore

    ```


    # 12.9 Sources of additional information


    You can find more information on the official Linux IP Firewall Chains page at:


    ```

    http://www.rustcorp.com/linux/ipchains

    ```


    And there are always good how-to documents on the Linux Documentation Project
    page:


    ```

    http://www.linuxdoc.org/

    ```'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Chapter 13. Backup and Recovery


    Even though the hardware are becoming more and more reliable, we still need to
    protect our data. To protect your data you need a backup solution. The most popular
    media for the backup are tapes, but in these days you can also create backup on
    other media, such as CDRW or CD-ROM.


    It may seem obvious that backing up and restoring data quickly is critical, but
    many administrators leave this task at the end of the "to do" list until it is
    too late. With the ease of use of the commercially available backup utilities
    available from Microlite and BRU utility, there is no need to wait.


    # 3.1 Microlite BackupEDGE


    BackupEDGE is a complete backup solution for the Linux platform. It is easy to
    use and still very robust. With BackupEDGE you can safely archive every file,
    directory, device node and special file on your file systems. Unlike standard
    UNIX tar files ignore many important files, BackupEDGE also verifies every byte
    of the data written to the tape to ensure the tape is an accurate reflection of
    your data. Below are the features provided by Microlite BackupEDGE software:


    +   * Data Compression - automatic data compression is supported.

    * Menu Interface - almost all functions can be accessed through an intuitive menu
    system.

    * Remote Tape Drive Support - you can back up computers across the network.

    * High Performance - advanced double buffering and variable block factors.

    * Virtual File Support - you can back up virtual (sparse) files.

    * Multi-Volume / Multi-Device Archives - automatic spanning across volumes or
    devices.

    * Wildcard Support - when selecting files you can use a wildcard.

    * Raw Device Backups - you can archive an entire device/partition to tape.

    * Master / Incremental Backups

    * Unattended Operation - you can perform a master backup or back up only the changed
    files.


    239'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'BackupEDGE is designed to operate on Linux kernels 2.x and there are available
    versions for several types of libraries.


    In the following sections we will describe how to install, configure and use the
    Microlite BackupEDGE backup software.


    > Note

    We recommend that you do not connect tape devices to the IBM ServeRAID controller.
    Use a separate SCSI controller for the tape devices.


    # 13.1.1 Installing Microlite BackupEDGE


    Before you install BackupEDGE you must identify the device entry for your backup
    device. Usually tape devices under Linux are assigned in device nodes /dev/st0,
    /dev/sti... a no rewind device is created for each tape device, which is /dev/nst0,
    /dev/nst1... In our example we used /dev/st0 as the tape device and /dev/nst1
    as the no-rewind device.


    In our example we used a diskette as the installation medium. To install the product
    follow these steps:


    +   1. Log in as root.

    2. Change the directory to root “/”.

    3. Insert the diskette with the product in the floppy drive and execute the command:

    tar xvf /dev/fd0

    Where /dev/fd0 is your floppy device.

    4. Execute the following command to finish the installation:

    /tmp/init.edge

    You will see a window that.'
