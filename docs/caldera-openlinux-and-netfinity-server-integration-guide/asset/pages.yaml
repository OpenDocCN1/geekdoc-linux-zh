- img_proc: true
  md: 'process of making the mount point is to use the Linux mkdir command. To make
    the /usr/local/share mount point, enter:


    ```

    mkdir /usr/local/share

    ```


    Typically you do not need to worry about file attributes and ownership when making
    an NFS mount point. The NFS access rights will usually supersede any rights established
    for the directory.


    Once you have created the mount point, then you can use the mount command as follows:


    ```

    mount -t nfs nfs_host:share_dir local_mount_dir

    ```


    where:


    +   - t nfs Says to do the mount as an NFS mount. This is now optional because
    if you explicitly specify the directory to be mounted as host:directory the mount
    command knows that it is an NFS mount.

    - nfs_host:share_dir The nfs_host is the host that is exporting the filesystem
    to be shared and share_dir is the actual directory that is to be shared.

    - local_mount_dir Is the directory on the local host where the remote directory
    is going to be mounted. As mentioned earlier, this mount point must exist.


    # 11.4 Allowing NFS access to data with GUI


    Caldera OpenLinux you can also mount the NFS resources using a graphical user
    interface. We explained this in 2.10.1, "Mounting an NFS volume" on page 90.'
