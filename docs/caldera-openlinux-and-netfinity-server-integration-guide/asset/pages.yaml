  pgno: 242
- img_proc: true
  md: 'The lines in the sample /etc/exports file are explained as follows:


    +   # sample /etc/exports file

    This Any line or character string can be converted to a comment and disabled by
    entering a # symbol. Everything from that point to the end of the line is considered
    to be a comment.


    +   / nmaster(rw) trusty(rw,no_root_squash)

    This says that the root directory (/) is exported to the servers:


    +   master - whose rights are read-write.

    trusty - whose rights are read-write and the access rights of the client can be
    the server''s root.


    +   /projects proj*.local.domain(rw)

    The directory /projects is accessible read-write to all servers whose names match
    the pattern proj.local.domain. This includes proj.local.domain, proj1.local.domain,
    projprojprojproj.local.domain and so forth.


    +   /usr *.local.domain(ro) @trusted(rw)

    Any systems whose hostname ends in .local.domain is allowed read-only access.
    The @trusted netgroup is allowed read-write access.


    +   /home/joe pc001(rw,all_squash,anonuid=150,anongid=100)

    The directory /home/joe is accessible to pc001 for read-write access; all requests
    for access are processed as an anonymous user. The anonymous UID number is set
    to 150 and the anonymous group ID is set to 100. This is useful when using a client
    is running PCGNFS or an equivalent NFS process on the PC. Since the PC IDs do
    not necessarily map to the UNIX IDs, this allow proper file attributes to be set.


    +   /pub (ro,insecure,all_squash)

    The directory /pub is accessible as read-only. It says that option in this entry
    allows clients with NFS implementations that do not use a reserved port for NFS
    and process all requests as an anonymous user.


    +   /pub/private (noaccess)

    The directory /pub/private does not allow any NFS access.


    # 11.3 Accessing data remotely with NFS


    To mount a remote filesystem on your local system the mount point must exist.
    The mount process does not create the mount point automatically.


    226 Caldera OpenLinux and Netinity Server Integration Guide'
