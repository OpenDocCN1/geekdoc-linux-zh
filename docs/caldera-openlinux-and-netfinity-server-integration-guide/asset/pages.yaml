  md: '# Chapter 1. Linux installation


    This chapter describes in detail the basic installation necessary to install and
    run Caldera OpenLinux 2.3 and Caldera OpenLinux eServer beta release on IBM Netfinity
    servers. We also show what steps you need to carry out before the installation,
    to avoid problems during the installation.


    # 1.1 Knowing your hardware


    Before you install Caldera OpenLinux, you should be familiar with the hardware
    in the computer. You at least need information about the following components
    in your computer:


    +   * Hard drives - interface type (SCSI or IDE) and size

    * CD-ROM - interface type (SCSI or IDE) and the manufacturer

    * SCSI adapter - manufacturer and model number

    * Display Adapter - manufacturer and model number

    * Mouse - mouse type and connector type

    * Network card - manufacturer and model number

    * RAM - the amount of RAM in your system

    * Monitor - manufacturer and model number


    For the monitor in particular, it is good to know all technical specifications.


    For IBM Netfinity servers and other IBM products, including monitors and SCSI
    adapters, the ultimate source for all information is:


    ```

    ftp://ftp.ibm.com/pcircse/psref

    ```


    Here you will find the PSREF (Personal Systems Reference) sheets for all IBM PC
    products, both current and withdrawn. You can also find a lot of useful information
    at the following internet resources:


    ```

    http://www.pc.ibm.com/support

    http://www.pc.ibm.com/us/netfinity/tech_library.html

    ```


    # 1.2 Hardware considerations


    In this section we describe how to handle hardware found in IBM Netfinity servers,
    when installing Caldera OpenLinux.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 1.2.1 Adaptec SCSI controller


    All versions of the Adaptec SCSI controllers used in IBM Netinity servers supported
    in kernels 2.2.10 and above, which are used in Caldera OpenLinux 2.3 and Caldera
    OpenLinux eServer.


    # 1.2.2 IBM ServeRAID controller


    All versions of the IBM ServeRAID controller used in IBM Netinity servers are
    supported in Caldera OpenLinux 2.3 and Caldera OpenLinux eServer.


    # 1.2.3 IBM token-ring network adapters


    IBM ISA, PCMCIA and PCI token-ring network adapters are supported in kernels 2.2.10
    and above, which are used in Caldera OpenLinux 2.3 and Caldera OpenLinux eServer.


    # 1.3 Updating the BIOS and ServeRAID controller firmware


    Before starting the installation it is important to have the latest level of microcode
    for all your hardware components. You can download the latest BIOS, diagnostic
    updates and ServeRAID controller firmware for your IBM Netinity server from:


    ```

