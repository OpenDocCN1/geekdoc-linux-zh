  md: '# 2.6 Your first IP Chains success


    Now when your router is working, let us make use of it. It does not make sense
    to have a router without deploying it. We would like to access the external network
    9.0.0.0 from the internal network 172.168.0.0. How can we do this? By using the
    IP Masquerading function of IP Chains. Follow these steps on the gateway network
    to set up the File Transport Protocol (FTP) access from internal network 172.168.0.0
    to external network 9.0.0.0:


    +   1. Create module dependency information for all modules by executing the command:


    ```

    /sbin/depmod -a

    ```


    +   2. Load the module for proper FTP masquerading:


    ```

    /sbin/modprobe ip_masq_ftp

    ```


    If you want to use another protocol, such as Real Audio and Internet Relay Chat
    (IRC), you can load the modules for them also.


    +   3. Set up the timeout for IP Masquerading:


    ```

    /sbin/ipchains -M -S 8000 20 200

    ```


    The parameters we have the following meaning:


    +   a. 8000 - timeout value for TCP sessions in sessions


    +   b. 20 - timeout value for TCP sessions after a FIN packet in seconds


    +   c. 200 - timeout value for UDP packets in seconds


    You can adjust these settings to meet your needs.


    +   4. Change built-in policy for forwarding by disabling it for all IP addresses:


    ```

    /sbin/ipchains -P forward DENY

    ```


    +   5. Add the policy for enabling the forwarding with masquerading for your internal
    networks:


    ```

    /sbin/ipchains -A forward -s 192.168.0.0/24 -j MASQ

    ```


    ```

    /sbin/ipchains -A forward -s 172.168.0.0/24 -j MASQ

    ```


    You are ready to try your setup. From the computer on the network 172.168.0.0,
    execute the command:


    ```

    /usr/bin/ftp server

    ```


    Where ftp server is the FTP server on the external network (in our example 9.0.0.0).
    You will see a window similar to Figure 185.'
  merge: -1
