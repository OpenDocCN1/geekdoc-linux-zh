  md: '# Stop


    Before installing Caldera OpenLinux on the IBM Netfinity server with IBM ServeRAID
    controller, you need to define RAID arrays and logical drives. You can do this
    with ServerGuide, which comes with all IBM Netfinity servers, or with the ServeRAID
    DOS Configuration diskette which is available at http://www.pc.ibm.com/support.


    We strongly recommend that you use spare hard disks in your system to secure your
    data best possible way.


    Caldera OpenLinux distributions from Version 2.3 support the ServeRAID SCSI controller.
    To install the operating system, follow the procedure in 1.5, "Basic Linux installation"
    on page 3. Your Logical disk drives defined in the RAID array will appear as SCSI
    drives in the installation program.


    After you have installed the system the utilities for RAID administration from:


    ```

    http://www.developer.ibm.com/welcome/netfinity/serveraid.html

