    # 13.2 Microlite RecoverEDGE


    By using RecoverEDGE tools you can create emergency recovery diskettes to rebuild
    your system in the case of disaster. RecoverEDGE handles the details of reconstructing
    your FDisk, divvy, and slice tables, rebuilding your filesystems and restoring
    your data, even if your hard drive size and/or geometry have changed. RecoverEDGE
    uses your live system backups, so there is no need to shut down your system in
    order to protect it. You can even restore your system over the network.


    With RecoverEDGE restoring the system is very easy. To recover the system you
    should follow these tasks:


    +   1. Identify and correct the cause of the failure.

    2. Boot from the RecoverEDGE disks.

    3. Reconfigure your filesystems.

    4. Restore your backups.

    5. Shut down and reboot.

    6. System is ready to use.


    # Note


    RecoverEDGE uses your master and incremental backups for recovery, so the accuracy
    of the data depends on these backups.'
  merge: -1
