  md: '009n012.exe. By executing this file on any WIN32-based workstation, create
    the installation diskette for the IBM ServeRAID Administration and Monitoring
    Program. After you have created the diskette, run setup.exe from the diskette.
    This will install the IBM ServeRAID Administration and Monitoring Program on your
    WIN32-based workstation. You start the program by running IBM ServeRAID administration.
    You will see a window similar to Figure 61.


    ![](img/2d69b129b41635ef36a3e6707d34b788_73_0.png)


    Figure 61. IBM ServeRAID Administration and Monitor window


    To be able to remotely access the IBM ServeRAID controller in the IBM Netfinity
    server running Linux, you need to run the ipsadm utility on that server. The ipsadm
    utility is basically a background server listening for TCP/IP connections on port
    1087 on one side and interacting with the IBM ServeRAID controller on the other
    side. So basically it accepts the commands from the IBM ServeRAID Administration
    and Monitoring Program and passes them to the IBM ServeRAID controller. The ipsadm
    command has the following syntax:


    ```

    ipsadm [-p:port#] [-f:filename] [-s:security file] [-d] [-er]

    ```


