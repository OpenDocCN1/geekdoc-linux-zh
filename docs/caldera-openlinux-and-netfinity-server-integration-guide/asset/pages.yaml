    \ like the following example:\n\n```\noptions {\n  directory \"/var/named\";\n\
    \  listen-on ( any );\n  forward only;\n  forwarders (9.24.106.15);\n  sortlist\
    \ (\n    ( localhost, localnets);\n    ( localnets );\n  );\n}\n\nlogging {\n\
