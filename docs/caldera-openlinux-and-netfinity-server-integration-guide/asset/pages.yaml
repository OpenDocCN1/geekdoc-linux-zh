    Server should obtain read/write access through a unique user ID and group, which
    must be created. The User and Group directives of the Administration Server''s
    configuration file should be changed to the unique user ID and group. The Administration
    Server''s configuration file''s "group access permissions" should be changed to
    allow read/write "group access". In addition there is a utility program that should
