    // query-source * port 53;

    //

    // a caching only nameserver config

    // we don''t need root entry, because this DNS

    // is root server for .itso domain

    //

    //zone "." {

    //type hint;

    //file "named.ca";

    //}

    zone "0.0.127.in-addr.arpa" {

    type master;

    file "named.local";

    }

    zone "itso" {

    notify no;

    type master;

    file "itso";

    }

    zone "0.168.172.in-addr.arpa" {

    notify no;

    type master;

    file "172.168.0";

    }

    zone "0.168.192.in-addr.arpa" {

    notify no;

    type master;

    file "192.168.0";

    }

    ```


    As you can see we define the zone file for the "itso" domain and the zone files
    for reverse address resolution for local, network 172.168.0.0 and network 192.168.0.0.


