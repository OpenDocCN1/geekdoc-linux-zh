  md: '# 11.1.7 Master and incremental backups


    Usually system perform so-called master and incremental backups. The master backup
    is a backup of all files on the system. Incremental backup is a backup of only
    those files that have changed from the last master backup. When you need to restore
    your data, restore the master backup and the last incremental backup. BackupEDGE
    can perform different types of incremental backups. Refer to the BackupEDGE manual
    for more information. Master and incremental backups can be performed from the
    edgenenu utility.


    To perform a master backup follow these steps:


    +   1. Start the edgenenu program by executing command:

    /usr/bin/edgenenu


    You will see a window similar to Figure 203 on page 253.


