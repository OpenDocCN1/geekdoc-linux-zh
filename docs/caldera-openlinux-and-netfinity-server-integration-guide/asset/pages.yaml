  md: '# Chapter 6. DHCP - Dynamic Host Configuration Protocol


    With the ever-decreasing number of IP addresses available, along with the headache
    of maintaining static IPs, DHCP has become a necessity in most TCP/IP computing
    environments.


    # 6.1 What is DHCP?


    DHCP stands for Dynamic Host Configuration Protocol. When using TCP/IP, a computer
    system needs a unique IP address to communicate with other computer systems. Without
    DHCP, the IP address must be entered manually at each computer system. DHCP lets
    network administrators distribute IP addresses from a central location without
    having to actively manage each individual address.


    With DHCP, IP addresses are distributed pools usually broken up by subnets. Leases
    are given out for a specific time period for each address. The process of managing
    leases is all done by the DHCP server. Once a lease has expired the DHCP server
    will try to contact the client or the client will contact the server to renew
    the lease. If the server cannot contact the client, the IP address is returned
    to the pool and available for the next client in need of an address.


    # 6.2 Why should I use DHCP?


    In the past, for every device on a network you had to have a static IP address.
    With the increasing number of computers accessing the Internet, the pool of available
    addresses is quickly diminishing. Network administrators can significantly reduce
    the number of IP addresses they need by using DHCP.


    Even with smaller networks, keeping track of individual IP addresses can be maintenance
    intensive. With DHCP, the server does all of the maintenance, mapping IP addresses
    to MAC addresses and tracking lease times. Administrators can adjust lease times,
    expand or reduce pools, and change gateways or DNS addresses, all from a central
    location.


    # 6.3 Implementation on Linux


    In this section we will discuss how to implement a DHCP server on Linux.


    First we will install the DHCP server binaries. The package is available on the
    Caldera OpenLinux CD and is usually installed by default. You can verify this'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'by executing packageage as we described in 4.2, "Setting up the Samba server"
    on page 123. The dhcpd package is under the Boot session in the Server section.
    After you start packageage you will see a window similar to Figure 155.


    ![](img/2d69b129b41635ef36a3e6707d34b788_181_0.png)


    Figure 155. Verifying the dhcpd package is installed


    Using your editor of choice, change the /etc/dhcpd.conf file to meet your requirements.


    The following sample of the dhcpd.conf file is rather. We designate a default
    lease time of 600 seconds (10 min.) but we will let clients request to a 7200-second
    (2-hour) lease time. We include a recommended subnet mask of 255.255.255.0 and
    a broadcast address of 192.168.1.255. Other options we specify include a default
    gateway (router), two nameservers, and the domain.


    For our subnet prefixes we are using the private 192.168.1.0 c Class subnet. For
    our DHCP pool we will be giving out addresses numbered 15 to 100 for a total of
    85 addresses. The rest can be used by static devices.


    164 Caldera OpenLinux and Netfinity Server Integration Guide'
  merge: -1
  pgno: 181
- img_proc: true
  md: "```\n# Configuration file for DHCP server.\n# Please see /usr/doc/dhcpd-1.0pl2\
    \ for examples,\n# and view the man page dhcpd(conf).\n#\ndefault-lease-time 600;\n\
    max-lease-time 7200;\noption subnet-mask 255.255.255.0;\noption broadcast-address\
    \ 192.168.1.255;\noption routers 192.168.1.254;\noption domain-name-servers 192.168.1.1,\
    \ 192.168.1.2;\noption domain-name \"ibm.com\";\nnsubnet 192.168.1.0 netmask 255.255.255.0\
    \ (\n  range 192.168.1.100;\n)\n```\n\nYou are not limited to a single subnet.\
    \ You are allowed to shared network-specific parameters, multiple subnet-specific\
    \ parameters, group parameters, and host-specific parameters.\n\nYou can define\
    \ multiple ranges, assign specific IP addresses based on the hardware address\
    \ of the client, and specify a WINS server if needed.\n\nMore information is available\
    \ from the dhcpd.conf man page.\n\nThe DHCP server needs a place to keep track\
    \ of leases. This is done in the file /var/state/dhcpd.leases.\n\nTo start the\
    \ DHCP server, type:\n\n```\n/etc/rc.d/init/dhcpd start\n```\n\nFor debugging\
    \ information, use the -d -f flags.\n\nIf you want the DHCP server to start automatically\
    \ when the server is started follow the instructions in 4.2.3, “Starting Samba\
    \ as startup service” on page 134, but instead of selecting SMB server process\
    \ (samba) you select DHCP and BOOTP boot server."
  merge: -1
  pgno: 182
