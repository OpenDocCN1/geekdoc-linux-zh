  md: '# Chapter 3. General performance tools in Linux


    Linux offers a great variety of ways to optimize your system for maximum performance.
    Apart from the fact that it is always good to have as much RAM and the fastest
    CPU as possible, there are some additional parameters to tune a Linux system.
    This section is intended to be a collection of useful hints and tools, without
    getting into too much detail about them. Please refer to the respective documentation
    and references. You should also note that using some of these hints may render
    your system unstable; use them at your own risk and only if you know what you
    are doing.


    # 3.1 General configuration hints


    These are some general tips for tweaking your system to maximize performance.


    Recompile your programs and the Linux kernel with all available compiler optimization
    flags (for example, -froll-loops, -fomit-frame-pointer, -O6) and all architecture-specific
    compiler options for your hardware architecture. This may increase the size of
    binaries or make them unable to run on some processors, but then you can gain
    a lot of speed in comparison with the binaries shipped in the distribution. Alternatively
    you could use special compilers for your architecture (for example, pgcc), which
    offer even more sophisticated optimization options.


    Create swap partitions of equal priority but different hard disk drives to allow
    load balancing. Please note that it need to be different devices! Using two different
    partitions on one hard disk will have the reverse effect. Even better, try to
    avoid swapping at all by adding more memory. A busy server should never need to
    swap, as this would severely degrade the overall performance.


    If you are running a heavily loaded server with a lot of parallel processes, you
    might run into the Linux kernel''s limit of running processes (512 by default).
    This maximum number of tasks is configurable in the kernel sources, so you have
    to recompile the kernel after changing this value. This value is defined in the
    file /usr/src/linux/include/linux/tasks.h:


    ```

    #define NR_TASKS 512

    ```


    You can increase this value up to 4090 processes, if necessary.


    Linux offers a filesystem mount option that is called noatime. at a timestamp
    of the last access time (reading and writing) for a certain file. This option
    can be added to the mount options in /etc/fstab. When a filesystem is'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'mounted with this option, read accesses to files will no longer result in an
    update of the inode access time information. This information is usually not very
    interesting on a file or Web server, the lack of updates to this field is not
    relevant. The performance advantage of the noatime flag is that it suppresses
    write operations to the filesystem for files that are simply being read. Since
    these write accesses add additional overhead, this can result in measurable performance
    gains. Instead of specifying this as a mount option that would apply to the whole
    filesystem, you can use the command chattr to set this flag on single files or
    directories. For example:


    ```

    chattr -R +A /var/spool/news

    ```


    This command would set the noatime flag recursively on all files below the news
    spool directory (a very common practice on busy servers). You can see the manual
    page chattr(1) for more information.


    You can use the hdparm tool to tune some hard drive parameters. Unfortunately
    most of them only work on IDE systems (which should be avoided in server systems,
    anyway), but the option -a works for SCSI, too. This option is used to get/set
    the sector count for filesystem readahead. This is used to improve performance
    in sequential reads of large files, by prefetching blocks in anticipation of them
    being needed by the running task. The default setting is 8 sectors (4KB). This
    value seems good for most purposes, but in a system where most file accesses are
    random seeks, a smaller setting might provide better performance. Also, many drives
    have a separate built-in read-ahead function, which alleviates the need for a
    filesystem read-ahead in many situations." For example, to set the sector count
    read-ahead of your first SCSI disk to 4 sectors (2 KB), you would use the following
    command:


    ```

    hdparm -a 4 /dev/sda

    ```


    See the hdparm manual page for a complete list of available options.


    The freely available tool Powertweak is a nice utility for tuning PCI chipset
    optimizations. It is expected to be extended to a general performance tweaking
    tool similar to MS Windows. See http://linux.powertweak.com for more info about
    it:


    You should also disable all unused services and devices, especially network-related
    services. This has several advantages: fewer system resources (file descriptors,
    memory), and the system is less vulnerable to external attacks against known security
    holes. A good starting point is the /etc/inetd.conf. Comment out all services
    you don''t need, or disable inetd completely.'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'The Linux /proc filesystem offers a lot of entry points for run-time optimization
    without recompiling the kernel. This directory does not physically exist on your
    hard drive; it is mapped as a virtual directory. Most of the files contained herein
    are readable and contain various system information. Other files can be edited
    with a regular text editor to set a certain kernel parameter. See /usr/src/Linux/Documentation/sysctcl/README
    in the Linux kernel sources for a detailed description of the tunable parameters
    (including filesystem, virtual memory, etc.).


    There are some special TCP options that can be disabled in a local network with
    high signal quality and bandwidth, since they are mostly intended for lossy connections
    (see /usr/src/linux/net/TUNABLE in the Linux kernel sources for a detailed list):


    To disable TCP timestamps:


    ```

    echo 0 > /proc/sys/net/ipv4/tcp_timestamps

    ```


    To disable window scaling, enter:


    ```

    echo 0 > /proc/sys/net/ipv4/tcp_window_scaling

    ```


    To disable selective acknowledgments, enter:


    ```

    echo 0 > /proc/sys/net/ipv4/tcp_sack

    ```


    To tune the default and maximum window size (only if you know what you are doing),
    enter:


    ```

    /proc/sys/net/core/rmem_default - default receive window/proc/sys/net/core/rmem_max
    - maximum receive window

    /proc/sys/net/core/wmem_default - default send window

    /proc/sys/net/core/wmem_max - maximum send window

    ```


    The following Web sites offer a lot of additional helpful hints about tuning and
    performance issues on Linux:


    ```

    http://tune.linux.com

    http://www.tunelinux.com

    ```


    # 3.2 System monitoring / performance test tools


    This section introduces a small collection of useful tools, among the many, available,
    to monitor your Linux system or to gather system information.'
  merge: -1
