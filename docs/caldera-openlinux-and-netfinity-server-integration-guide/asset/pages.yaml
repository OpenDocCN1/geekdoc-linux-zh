  md: '# Chapter 7. Apache Web IBM HTTP Server


    The Apache Web server is the most popular Web server software on today''s Internet.
    According to the NetCraft Web server survey at http://www.netcraft.com/survey/,
    more than 55% of all surveyed Web servers (more than 7.3 million) were running
    a version of Apache (as of the time of this writing). Apache is a very successful
    collaborative Open Source project. The Web site for Apache is http://www.apache.org.
    Because of the free availability of the full source code, it is a flexible and
    powerful Web server solution. There are also a lot of additional modules, which
    can be used in combination with the Apache main program. Some popular examples
    are PHP (PHP: Hypertext Preprocessor, an embedded HTML scripting language), mod_perl
    (an embedded perl interpreter) and mod_ssl for secure transactions. More Apache
    modules can be downloaded from the Apache Module Registry at:

    http://modules.apache.org.


    Some key features of Apache are:


    +   * Implements the latest protocols, including HTTP/1.1 (RFC2068).

    * Is highly configurable and extensible with third-party modules.

    * Can be customized by writing "modules" using the Apache module API.

    * Provides full source code and comes with an unrestricted license.

    * Runs on most versions of UNIX (including Linux) without modification.

    * DBM databases for authentication, which allow you to set up password-protected
    pages with enormous numbers of authorized user, without bogging down the server.
    A wide variety of SQL databases can be used for authentication too (using additional
    modules).

    * Customized responses to errors and problems, which allow you to set up files,
    or even CGI scripts, which are returned by the server in response to errors and
    problems. For example, you can set up a script to intercept 500 server errors
    and perform on-the-fly diagnostics for both users and yourself.

    * Multiple DirectoryIndex directives, which allow you to say DirectoryIndex index.html
    index.cgi, which instructs the server to either send back index.html or run index.cgi
    when a directory URL is requested, whichever it finds in the directory.

    * Unlimited numbers of alias and redirect directives that may be declared in the
    config files.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# The IBM HTTP server


    The IBM HTTP Server powered by Apache is based on the Apache HTTP Server. In addition
    to Linux, this HTTP Server also runs on AIX, Solaris and Windows NT. See the home
    page at:


    ```

    http://www-4.ibm.com/software/websservers/httpsservers/

    ```


    IBM HTTP Server for Linux offers the following additional features:


    +   - Remote Configuration: a browser-based configuration tool to allow manipulation
    of the server via a GUI.


    +   - SNMP Support: Simple Network Management Protocol (SNMP) is a well-established
    protocol for managing and gathering information about servers remotely. This new
    support allows IBM HTTP Server to be managed by the SNMP protocol.


    +   - LDAP: The IBM HTTP Server Lightweight Directory Access Protocol (LDAP) plug-in
    allows authentication and authorization (which is required when accessing a protected
    resource) to be performed by an LDAP server, thereby greatly decreasing the administrative
    overhead for maintaining user and group information locally for each Web server.


    +   - Machine Translation Support: This new function, when used with an available
    IBM Machine Translation Engine, enables the IBM HTTP Server to translate English
    Pages into other languages without human intervention. This permits a Web site
    visitor to read the page in his native language, effectively broadening the reach
    of your site. IBM Machine Translation Engines are included in the WebSphere Application
    Server 3.0 and include German, Simplified Chinese and Traditional Chinese. Additional
    languages will be available in the future.


    +   - Support for SSL secure connections: The IBM HTTP Server powered by Apache
    supports both the SSL Version 2 and SSL Version 3 protocols. This protocol, implemented
    using IBM security libraries, ensures that data transferred between a client and
    a server remains private. Once your server has a digital certificate, SSL-enabled
    browsers such as Netscape Navigator and Microsoft Internet Explorer can communicate
    securely with your server using the SSL protocol. The IBM HTTP Server powered
    by'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'Apache supports client authentication, configurable cipher specifications,
    and session ID caching for improving SSL performance on the UNIX platforms.


    +   * Fast Response Cache Accelerator: The Cache Accelerator can dramatically
    improve the performance of the IBM HTTP Server powered by Apache when serving
    static pages, for example, text and image files. Because the Cache accelerator
    is automatically loaded during server operation, you are not required to list
    the files to be cached in your server configuration file. In addition, the server
    will automatically recache changed pages and remove outdated pages from the cache.
    The Cache Accelerator provides support for caching on Web servers with single
    and multiple TCP/IP adapters.


    # 7.2 Apache HTTP Server installation


    Usually the Apache HTTP server is installed and started by default in the Caldera
    Linux. You can verify that the Apache package is installed by running kpackage
    as we explained in 2.5, "Adding and removing software packages using kpackage"
    on page 72. The Apache server package is found by clicking Server -> WWW.


    The Apache HTTP is usually automatically started on bootup. You can check by examining
    the services that will start at server startup, as described in 2.9, "Daemons
    (services)" on page 88. If you Apache HTTP server to start at the server startup,
    enable the Web server service. To start, stop or reload Apache HTTP server (after
    a configuration change), run the script:


    ```

    /usr/rc.d/init/httpd (start|stop).

    ```


    In Caldera OpenLinux, Apache will serve HTML documents from the directory /home/httpd
    and CGI scripts from /home/httpd/cgi-bin. If you installed the PHP module (mod_php),
    it will also execute PHP code, if the file ends .php. The access log file is in
    /var/log/httpd/access_log, the error log file is in /var/log/httpd/error_log.
    The Apache configuration files resides in the subdirector /etc/httpd/conf.


    If you now point your browser to the server''s IP address, you would see the following
    start page (/home/httpd/html/index.html), when the Apache HTTP server is running:'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Test Page for Apache Installation on Web Site Netscape


    File Edit View Go Communicator Help


    Back Forward Reload Home Search Netscape Print Security


    Bookmarks Location: http://98.24.104.202/


    Instant Message WebMail Contact People Yellow Pages Find Sites Channel


    # # It Worked! The Apache Web Server is Installed on this Web Site!


    If you can see this page, the people who own this domain have just installed the
    Apache Web server software successfully. They now have to add content to this
    directory and replace this placeholder page, or else point the server at their
    real content.


    > If you are seeing this page instead of the site you expected, please contact
    the administrator of the site involved. (Try sending mail to webmaster@domain.com)
    Although this site is running the Apache software it certainly has no connection
    to the Apache Group, please do not send mail about this site or its contents to
