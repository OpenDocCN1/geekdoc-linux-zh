    +   - ips-100.tgz: this file contains the kernel patch for the 2.2.x kernel, which
    enables the support for IBM ServeRAID adapter in those kernels,

    - ipsutsil.rpm: this file contains the Linux utilities for IBM ServeRAID SCSI
    adapter,

    - 009n012.exe; this file contains the WIN32 Administration Client, which can be
    used to remotely configure and monitor the ServeRAID controller used in Linux
