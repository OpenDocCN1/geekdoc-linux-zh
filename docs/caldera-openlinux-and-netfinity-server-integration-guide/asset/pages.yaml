  md: '# Chapter 5. DNS - Domain Name Service


    If you connect two or more computers to a network, they can share information
    and resources. However, these computers need to "talk in the same language" to
    be able to establish a connection. This "language" is called a network protocol.
    Today the most popular communication protocol is TCP/IP. This is the protocol
    that is being used on the Internet and in many local area networks as well.


    Hosts in a TCP/IP network communicate with each other using unique IP addresses.
    These addresses consist of four 8-bit numbers (octets) that are divided by dots.
    For example, host A has the address 192.168.99.1, while host B uses 122.68.29.5.


    However, this addressing scheme is not very comprehensible to human beings and
    it is almost impossible to memorize a number of hosts by their IP addresses. Therefore
    a naming scheme has been invented.


    Each host has a host name (for example fred) and belongs to a certain domain (for
    example snake-oil.com). Domains can be organized in a hierarchical fashion and
    can consist of different subdomains (for example marketing.snake-oil.com). The
    combination of a host name and its domain name is called a fully qualified domain
    name (FQDN) (for example fred.marketing.snake-oil.com). Since domains are hierarchical,
    it is possible to have more hosts with the same host name in different subdomains.
    Therefore, fred.marketing.snake-oil.com can be a different host from fred.management.snake-oil.com,
    you need to register your domain name with a central registry. There are several
    top-level domains, such as .com, .org or .net. In addition to these generic top-level
    domains, each country has its own country code as the top-level domain. For example,
    Germany has .de, Denmark has .dk, and Finland has .fi.


    Since the hosts internally still use their IP addresses to communicate, there
    needs to be a mapping between host names and the corresponding IP address. There
    are two ways this can be implemented.


    All hosts of a network, including their IP addresses, are put into a static text
    file. This file has to be copied on each host that wants to communicate with the
    others by name. As soon as a host has been added or removed from the network,
    or an IP address or host name has changed, the host files on all computers have
    to be adjusted accordingly. This can get very tedious, if the number of hosts
    reaches a certain amount.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'This is where the Domain Name System (DNS) steps in. The following description
    of DNS is very simplified, but it should give you a rough picture of what DNS
    is all about.


    Instead of maintaining a separate host file on each machine, there is a central
    server that carries a list of all hosts and IP addresses of its domain. All clients
    now send their host name resolution request to this central server instead of
    looking in a local table. The name server will look up the requested host name
    and return the respective IP address. also possible: the client can also ask for
    a host name that belongs to a certain IP address. If a client asks for an IP address
    of another domain, the local domain name server will forward the request to the
    next name server above in its hierarchy, if it cannot answer the request by itself.
    Therefore changes to the table of host names have to be made at one central point
    only rather than all participants of the network.


    ![](img/2d69b129b41635ef36a3e6707d34b788_173_0.png)


    Figure 154. Internet domain hierarchy


    This chapter will describe how to set up a name server for a local domain and
    how to maintain a host list for this domain.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# 5.1 Installation of software


    The server that is supposed to be the DNS server needs to have a working TCP/IP
    network connection to the other hosts in its network first. The program that is
    responsible for this service is called named and belongs to the software package
    bind, which is coordinated by Paul Viexie for The Internet Software Consortium.
    There are two major versions of bind: bind4 and bind8. Caldera Linux comes with
    the bind8 version. Before we continue, make sure that the following packages are
    installed:


    +   - bind-8.1.2-1

    - bind-utils-8.1.2-1


    You can do this by starting package from COAS tools as we explained in 2.5, "Adding
    and removing software packages using kpackage" on page 72. These packages are
    in the Network subsection under the Server section.


    # 5.2 DNS sample configuration


    Configuring DNS can be very complex, depending on the intended functionality.
    Covering this in depth is beyond the scope of this chapter. We will therefore
    focus on very simplified example and recommend that you take a look at the very
    informative DNS how-to:


    or at /usr/doc/howto/DNS-HOWTO.gz on your local filesystem for further information
    on DNS and bind.


    We will construct a simple example. The company Snake Oil Ltd. wants to set up
    a DNS server for their internal network (the internal IP address range is 192.168.99.xxx/24,
    a Class C network). They chose snake-oil.com as their local domain name. The network
    server will be configured to answer all requests about the local (internal) snake-oil.com
    domain and forward all other requests to the ISP''s name server (ns.bigisp, fictional
    IP address 155.3.12.1) as a caching name server.


    We begin with a simple example. At first the local DNS will be configured as a
    caching-only name server. This means that it forwards all requests to the Internet
    Service Provider''s (ISP) name server(s) (forwarders) and caches all answers for
    further requests from its clients. This reduces the network traffic on the outside
    line.


    Add the following lines in the /etc/resolv.conf file:'
  merge: -1
  pgno: 174
- img_proc: true
  md: "search snake-oil.com\n\nnameserver 127.0.0.1\n\nThis will make sure that the\
    \ server itself will use its local name server for host name resolution.\n\nYou\
    \ can also do this using the Resolver tool from the COAS tools as we explained\
    \ in 2.19, \"Name resolution settings\" on page 103 and the host name tool as\
    \ explained in 2.11, \"Hostname\" on page 90.\n\nThe name server's main configuration\
    \ file is /etc/named.conf. Since most distributions ship with a very detailed\
    \ sample configuration file, you might want to save this for further reference.\
    \ We will create a new file from scratch. Start a text editor and create a new\
    \ /etc/named.conf file according to the following example:\n\n```\noptions {\n\
    \  directory \"/var/named\";\n  listen-on { any };\n  forward\n    only;\n  forwarders\
    \ { 155.3.12.1; };\n  sortlist {\n    { localhost; localnets };\n    { localnets\
    \ };\n  };\n}\nlogging {\n  category lame-servers { null };\n  category cname\
    \ { null };\n}\nzone \"localhost\" IN {\n  type master;\n  file \"localhost.zone\"\
    ;\n  check-names fail;\n  allow-update { none };\n}\nzone \"0.0.0.127.in-addr.arpa\"\
    \ IN {\n  type master;\n  file \"127.0.0.zone\";\n  check-names fail;\n  allow-update\
    \ { none };\n}\n```\n\nReplace the IP address in the forwarders field with your\
    \ ISP's name server IP address."
  merge: -1
  pgno: 175
- img_proc: true
  md: 'You also need to create a /var/named/localhost.zone file as follows:


    ```

    @ORIGIN localhost.\      1D IN SOA      @ root (

    @42                     ; serial (d. adams)

    3H                     ; refresh

    15M                    ; retry

    1W                     ; expiry

    1D )                   ; minimum


    1D IN NS               @

    1D IN A                127.0.0.1

    ```


    Furthermore, create a /var/named/127.0.0.0 zone with the following content:


    ```

    @ORIGIN 0.0.127.in-addr.arpa.

    @                     localhost.root.localhost. (

    42                     ; serial (d. adams)

    3H                     ; refresh

    15M                    ; retry

    1W                     ; expiry

    1D )                   ; minimum


    1D IN NS               localhost.

    1D IN PTR              localhost.

    1

    ```


    Your network clients should all be configured to query the local DNS server''s
    IP address instead of your ISP''s name server.


    You can now start the server with the command:


    ```

    /etc/rc.d/init/named start

    ```


    Check the /var/log/messages file for the startup messages. The name server should
    resolve DNS queries from its clients by forwarding them to the ISP''s name server.
    You can verify this with the `host <hostname>` and nslookup commands.


    If you want DNS to start automatically when the Linux server is started, follow
    the instructions in 4.2.3,"Starting Samba as startup service" on page 134, but
    instead of selecting SMB server process (samba) you use Internet domain nameservers
    (named). After you enabled DNS to run as a service it will start automatically
    when the Linux server boots up.


    In the following step, this server should now also act as a primary name server
    for the localdomain snake-oil.com. Stop the name server with this command:'
  merge: -1
  pgno: 176
- img_proc: true
