    # 5.3 Configuration tips


    Use the listen-on directive in the options section of the named.conf file. For
    each interface a name server listens on, a pair of filehandles are opened. On
    a busy name server, saving every filehandle is a big win.


    Check the /var/log/messages file from time to time for errors. Named is pretty
    verbose in its error messages.


    If you are constantly adding, removing or making your zone records, you might
    want to have a look at the nsupdate tool, which also belongs to the bind8 package.


    Your name server should correctly resolve host names for the snake-oil domain
    as well.'
