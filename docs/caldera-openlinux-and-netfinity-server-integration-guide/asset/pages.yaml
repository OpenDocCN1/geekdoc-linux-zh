  md: '# Chapter 10. NIS - Network Information System


    In a distributed computing environment, maintenance of password files, groups,
    and host files can be a major task. Consistency is possibly the biggest difficulty.
    For example, when a user changes their password on one machine, ideally it would
    be propagated to any other machine they accounts on. When a network is composed
    of hundreds or thousands of machines, this convenience becomes a necessity. NIS
    is one way of addressing some of these problems.


    # 10.1 What is NIS?


    Network Information System (NIS) is a service designed to provide a distributed
    database system for common configuration files. NIS servers manage copies of the
    database files. NIS clients request the information from the NIS server instead
    of using their own configuration files.


    NIS is built on the client/server model. A NIS server contains data files called
    maps. These maps are owned by the NIS and can only be updated by the master. There
    are NIS slave servers that replicate from the master. When there is a change to
    a master server''s map, this change is then distributed to all the slave servers.
    Clients are hosts that request information from these maps but are not allowed
    to modify them.


    # 10.2 How can I use NIS?


    NIS is typically used to centrally manage commonly replicated configuration files.
    Examples of common configuration files are:


    +   * /etc/hosts

    * /etc/passwd

    * /etc/group


    # 10.3 Implementation on Linux


    To introduce the concepts behind NIS, we will create a map of our password file
    kept on the NIS master server. This will allow users to log in to NIS clients
    without having to maintain an account on each box. Centralized administration
    is a key benefit of using NIS.


    A note on security: Before deciding to put NIS in a production environment, please
    consider the security implications of passing sensitive data across'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'network. You may wish to take a NIS+, which has strong encryption as well as
    additional maintenance implications.


    Packages that need to be installed for a NIS client and the NIS server:


    ```

    # nis-client-2.0-8

    # nis-server-2.0-8

    ```


    The /etc/nsswitch.conf file determines the order of lookups performed.


    Sample /etc/nsswitch.conf file:


    ```

    # /etc/nsswitch.conf

    #

    # Name Service Switch configuration file.

    #

    passwd : compat

    shadow : compat

    group : compat

    #

    hosts : files dns nis

    networks : nis files dns

    #

    ethers : nis files

    protocols : nis files

    rpc : nis files

    services : nis files

    ```


    ![](img/2d69b129b41635ef36a3e6707d34b788_229_0.png)


    > Note

    You should remove NIS reference from all the options where you do not use the
    NIS server for coordination.


    # 10.3.1 NIS Server


    The configuration files for the NIS server in Caldera OpenLinux are located in
    the directory /etc/nis. To set up a NIS server on your Caldera OpenLinux server,
    follow these steps:


    +   1. Decide on a NIS domain name. This name does not need to be equal to the
    domain name of the server because it only has to be among adjacent domains, not
    worldwide.


    +   2. Create a directory /etc/nis/nisdomainname. In our example we used domain
    name "nis.com". We created a directory by executing this command:

    mkdir /etc/nis/nis.com'
