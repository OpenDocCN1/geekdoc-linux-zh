  md: '# 8.5.4 Setting up Sendmail


    All documentation on Sendmail will tell you that the Sendmail configuration file
    /etc/sendmail.cf is a nightmare for network administrator. This is not entirely
    true; when you do not need any special features offered by Sendmail, the setup
    is fairly easy. You just need to modify the generic mail files slightly and recreate
    the new sendmail.cf with the "m4" macro processor. In this we explain how to set
    up Sendmail for handling mail in its own domain. Caldera Linux uses generic macro
    file for Sendmail. The file is located in the /usr/share/sendmail/cf/cf and is
    called generic-col2.mc. This file just needs a little modification to become a
    working file on your server. Follow these steps to set up your mail servers:


    +   1. Make a copy of Caldera OpenLinux generic macro file with the command:

    `cp /usr/share/sendmail/cf/cf/generic-col2.mc

    /usr/share/sendmail/cf/cf/mydomain.mc`


    +   2. Add the following lines to mydomain.mc file:


    +   a. For the server in "first.itso" domain:


    ```

    dnl ####################################################################

    dnl # Definitions for sample domain

    dnl # we define PSEUDONYMS, DEFAULT_HOST

    define(`PSEUDONYMS`, ''nf5500.first.itso'' ''first.itso'')

    define(`DEFAULT_HOST`, ''nf5500.first.itso'')

    dnl ####################################################################

    ```


    +   b. For the server in "second.itso" domain:


    IN SOA nf7000m10.second.itso. root.second.itso. (

    1997022700 : Serial

    28800 : Refresh

    14400 : Retry

    3600000 : Expire

    86400 ) : Minimum

    IN NS PTR nf7000m10.second.itso.localhost.


    7. Start the server with the command:

    /etc/rc.d/init/named start


    You now have three DNS servers running. The network is ready for the setup of
    the mail server.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '```

    dnl ############################################################

    dnl # Definitions for sample domain

    dnl # we define PSEUDONYMS, DEFAULT_HOST

    define(`PSEUDONYMS`, ''n700m10.second.itso'' ''second.itso'')

    define(`DEFAULT_HOST`, ''n700m10.second.itso'')

    dnl ############################################################

    ```


    3. Create a new sendmail.cf file with your domain file by executing the command:


    ```

    /usr/bin/m4 /usr/share/sendmail/cf/cf/m4/m4

    /usr/share/sendmail/cf/cf/mydomain.cf

    /usr/share/sendmail/cf/feature/relay_entire_domain.m4 >

    /etc/sendmail.cf

    ```


    This can be a lot easier if your current directory is /usr/share/sendmail/cf:


    ```

    /usr/bin/m4 cf.cf.m4 mydomain.cf feature/relay_entire_domain.m4 >

    /etc/sendmail.cf

    ```


    As you can see we used two more files in order to create the configuration


    +   a. cf.m4 must be used, otherwise files will not be parsed correctly.

    b. relay_entire_domain.m4 is used to enable clients, which are accessing

    the mail server with remote clients, to send mail through this server.


    4. Modify the /etc/sendmail.cw file:


    +   a. For the server in "first.itso" domain add the line:

    first.itso


    +   a. For the server in "second.itso" domain add the line:

    second.itso


    The /etc/sendmail.cw includes all aliases for your mail server. You need to

    include the domain name; otherwise, mail will be undeliverable.


    5. Start the server with the command:


    ```

    /etc/rc.d/init.d/mta start

    ```


    If you want sendmail to start automatically when the server is started follow

    the instructions in 4.2.3, "Starting Samba as startup service" on page 134,

    but instead of selecting SMB server process (samba) you select Mail

    Transfer Agent.'
