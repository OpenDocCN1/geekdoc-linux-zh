    # 12.5 How to permanently enable IP Forwarding


    In Caldera OpenLinux the network process is started by executing this script during
    the server startup:


    ```

    /etc/rc.d/init/network

    ```


    The IP Forwarding is not enabled by default. To enable it, open the file /etc/rc.d/init/network
    and find the line:


    ```

    : ${IPFORWARDING=no}

    ```


    and change it to:


    ```

    : ${IPFORWARDING=yes}

    ```


    You need to restart network to activate the change. You can do this by executing
    the commands:

    /etc/rc.d/init/network stop

    /etc/rc.d/init/network start


    Now your server is ready to act as a router. You can try this by pinging to the
    tr0 interface 9.24.104.202 from the machine on 172.168.0.0 if the ping is successful
    your router is working correctly. You will see a window similar to Figure 184.


