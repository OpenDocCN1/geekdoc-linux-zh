  md: '# Chapter 11. NFS - Network File System


    Network File System (NFS) is a product developed by Sun Microsystems that allows
    you to share directories across the network. The directory mounts become transparent
    to you. You access the mounted directories just like you do any any directory
    or filesystem on your computer. The mounting process is the same as any filesystem
    or partition that you want to mount on your system. The basic foundation of this
    is the `mount` command.


    In order to share directories across the network you will need two basic things:


    +   - The system sharing the data must allow you to have access.

    - The system that is using the data must originate the request and allow the mount
    to happen.


    Both concepts will be discussed in this chapter.


    # 1.1 The NFS process


    First you need to verify that the NFS RPM package has been loaded. RPM is short
    for Red Hat Package Manager and is a common way of installing packages in Linux.
    You can do this with the command:


    ```

    rpm -ql nfs-server

    ```


    You will see the results as in Figure 178. This gives a listing of the contents
    of the RPMs that are installed when NFS is installed. NFS may have been installed
    by default when you first set up the system by choosing a package that included
    it. You can also verify if the package is installed with the kpackageage utility
    from the COAS tools as we described in 2.5, "Adding and removing software packages
    using kpackage" on page 72. The nfs-server package is found by clicking `Server
    -> Network`.


    You can install NFS manually by either using the kpackage utility or by using
    the following commands:


    ```

    mount /mnt/cdrom

    rpm -i /mnt/cdrom/Packages/RPMS/nfs-server-2.2beta44-3

    ```


    The NFS package should now be installed. Now you can repeat the earlier rpm command
    to verify that the package is installed.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '```

    (root@nf5000 user]## rpm -ql nfs-server

    /etc/rc.d/init.nfs

    /etc/sysconfig/daemons.2beta4

    /usr/doc/nfs-server-2.2beta4

    /usr/doc/nfs-server-2.2beta4/README

    /usr/man/man8/exports.5.gz

    /usr/man/man8/mount.8.gz

    /usr/man/man8/nfsd.8.gz

    /usr/man/man8/rpc.mountd.8.gz

    /usr/sbin/rpc.mount

    /usr/sbin/rpc.nfs

    [root@nf5000 user]#

    ```


    Figure 178. Checking NFS rpms


    NFS makes use of several daemons (services). These daemons are:


    +   - portmap - is the process that converts Remote Procedure Call (RPC) program
    numbers into Defense Advanced Research Projects Agency (DARPA) protocol port numbers.
    When a client wishes to make an RPC call to a given program number (for example,
    the NFS server), it will first contact portmap on the server machine to determine
    the port number where RPC packets should be sent.

    - rpc.mountd - This handles the exporting of NFS filesystems. It looks in the
    /etc/exports file to figure out what to do with mount requests from various hosts.

    - rpc.nfsd - this provides the user level part of the NFS process.


    You can verify that the rpc.nfsd, rpc.mountd and portmap daemons are running as
    shown in Figure 179.'
