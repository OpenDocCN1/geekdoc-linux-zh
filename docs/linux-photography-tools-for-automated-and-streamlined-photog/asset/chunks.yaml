    offers a compiled app for several mainstream NAS models, including ASUSTOR, Synology,
    and QNAP. If you happen to use the latter, grab the appropriate *.qpkg* package
    from the [Install on QNAP NAS](https://github.com/Entware/Entware/wiki/Install-on-QNAP-NAS)
    page. On the NAS open **App Center**, click the **Install Manually** button in
    the upper-right corner of the main window, select the downloaded *.qpkg* package,
