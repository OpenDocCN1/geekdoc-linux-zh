    # 使用 Simple Photo Planner 规划摄影之旅


    [Simple Photo Planner](https://gitlab.com/dmpop/sphp) (SPHP) 正如其名：一个简单、高效的 PHP
    工具，用于跟踪你计划访问和拍摄的地点。它从文本文件中读取以逗号分隔格式存储的数据，并将其渲染为带有表格的 HTML 页面。


    ![](img/file38.png)


    SPHP 无需安装。使用 `git clone https://gitlab.com/dmpop/sphp.git` 命令克隆项目的 GitLab 仓库，或直接从项目页面下载源代码，即可开始使用。要在本地机器上运行
    SPHP，你需要安装 PHP。在 openSUSE 上，运行 `sudo zypper in php7` 命令。在 Ubuntu 上，使用 `sudo apt-get
    install php7.2` 命令安装 PHP。在终端中，切换到 `sphp` 目录并运行 `php -S localhost:8000` 命令，然后在浏览器访问
    `localhost:8000` 地址访问 SPHP。


    你可以通过任何文本编辑器或电子表格应用程序编辑相应的 `data.csv` 文件来添加新条目或修改现有条目。你可以为每个条目指定三个值：地点（名称）、链接（OpenStreetMap
    或 Google Maps 上的）和备注。


    在 OpenStreetMap 中创建链接需要几个简单的步骤：


    1. 将浏览器指向 [`www.openstreetmap.org/`](https://www.openstreetmap.org/)。

    2. 使用搜索框找到地点，或者在地图上找到目标地点。

    3. 点击右侧工具栏中的 **Share**，启用 **Include marker** 选项，切换到 **Short Link** 部分。

    4. 如必要，将标记到地图上的精确位置。

    5. 复制生成的链接。


    在 Google Maps 中生成链接同样简单。使用搜索功能找到地点，然后使用 **Share** 选项生成链接。


    虽然 SPHP 可能不是最复杂的 PHP 工具，但它确实有一些实用的功能。你可以点击它查看特定地点的当前天气预报。点击 **Location** 和 **Note**
    列标题，可以使用 **Edit** 按钮编辑数据。


    由于 SPHP 只是一个 PHP 脚本，你可以在任何安装 PHP 的服务器上运行它。将 `sphp` 文件夹移动到服务器的文档根目录并将浏览器指向 `http://127.0.0.1/sphp`（将
    `127.0.0.1` 替换为服务器的实际域名或 IP 地址）。


    ## 使用密码保护 Simple Photo Planner


    如果你在公共服务器上运行 SPHP，任何人都可以查看和编辑你的数据，这可能不是你想要的。解决方案是用用户名和密码保护 SPHP 实例。在 Apache 服务器上，可以使用
    `.htpasswd` 和 `.htaccess` 文件来实现。


    `.htpasswd` 文件是一个包含用户名和密码列表的文本文件。生成该文件有多种方法。如果你系统中安装了 PHP，可以使用简单的 PHP 脚本：


    ```php

    <?php

    $password = crypt($argv[2], base64_encode($argv[2]));

    echo $argv[1].":".$password;

    ?>

    ```


    将上述代码粘贴到新文件中并保存为 `htpasswd.php`。运行 `php htpasswd.php user password >> htpasswd`
    命令，将 `user` 和 `password` 替换为实际用户名和密码。将生成的 `htpasswd` 文件移动到服务器，并重命名为 `.htpasswd`
    以隐藏文件。


    创建一个文本文件并将以下代码粘贴其中（将 `/path/to/` 替换为 `.htpasswd` 文件的绝对路径）：


    ```

    AuthType Basic

    AuthName "Simple Photo Planner"

    AuthUserFile /path/to/.htpasswd

    require valid-user

    ```


    将文件保存为 `htaccess`，移动到服务器上的 `sphp` 目录，并重命名为 `.htaccess` 以隐藏文件。


    # 无需账号关注 Instagram 摄影师


    无论喜欢还是讨厌，许多摄影师都使用 Instagram 分享照片。但与其他许多服务一样，Instagram 自称为社交平台，而实际上它只是另一个强制你创建账户并使用其
    App 的围花园。得益于 [RSS-Bridge](https://github.com/RSS-Bridge/rss-bridge)，你完全可以在不加入服务的情况下关注喜欢的摄影师。正如名称所示，这个巧妙的基于
    PHP 的 Web 应用可以为缺乏此功能的服务和平台生成 RSS 源。使用 RSS-Bridge，你可以为关注的每个 Instagram 账户创建 RSS
    源，然后使用任何 RSS 阅读器订阅生成的源。更好的是，RSS-Bridge 安装和使用非常简单，因此不会引入任何复杂性或不便。事实上，在 Instagram
    之外关注你喜欢的摄影师有其优势：没有分心的广告，也没有算法来决定给你看什么。


    由于 RSS-Bridge 用 PHP 编写的，它可以轻松运行在任何带有 PHP 的服务器上。部署该应用并不复杂。使用 `git clone https://github.com/RSS-Bridge/rss-bridge.git`
    命令克隆仓库。或者，使用 **Download ZIP** 按钮获取源代码并在必要解压生成的目录（例如 `rss-bridge`）。将浏览器指向安装的实例（`http://127.0.0.1/rss-bridge`，其中
    `127.0.0.1` 是服务器的域名或 IP 地址）。滚动到 **Instagram** 部分并点击 **Show more**。在相应字段中输入目标用户名并按下
    **Atom** 按钮。将生成的 Atom Feed 添加到你喜欢的阅读器中。


    ![](img/file39.png)


    除了生成 Atom 和 MRSS 格式的 RSS 源外，RSS-Bridge 还可以将获取到的数据渲染为 HTML 页面。如果你需要在不使用专用阅读器的情况下快速检查
    Instagram 账户，这将非常有用。


    RSS-Bridge 支持其他照片共享服务，如 Flickr、NASA 每日天文图片和 Unsplash。然而，它们默认是禁用的。要启用所需的插件，打开 `rss-bridge`
    目录下的 `whitelist.txt` 文件，添加插件名称（例如 `FlickrBridge`）并保存更改。


