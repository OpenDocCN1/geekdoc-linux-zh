  trans: "\n当你需要快速将 RAW 文件转换为 JPEG 格式时，没有必要启动重量级的 RAW 处理应用程序。相反，你可以使用 `dcraw` 和 `cjpeg`\
    \ 工具的组合来处理 RAW 文件并将其保存为 JPEG 图像。在 Debian 和 Ubuntu 上使用 `sudo apt install dcraw\
    \ libjpeg-turbo-progs` 命令安装所需的包，或者在 openSUSE 上使用 `sudo zypper in dcraw libjpeg-turbo`。然后运行\
    \ `dcraw -c foo.raw | cjpeg > foo.JPG` 命令来转换单个 RAW 文件，或者使用带有 `for...do` 循环的高级命令来转换当前目录下所有的\
    \ RAW 文件：\n\n```\nfor file in *.RAW; do dcraw -c -g 2.4 12.92 $file | cjpeg >\
    \ \"${file%%.*}\".jpeg; done\n```\n\n当然，你可以在 `~/.bashrc` 文件中添加一个专用函数：\n\n```\n\
    if [ -x \"$(command -v dcraw)\" ] && [ -x \"$(command -v cjpeg)\" ] ; then\n \
    \ function rawtojpeg() {\n    ext=${1:-RAW}\n    for file in *.$ext; do echo \"\
    Processing $file\"; \\\n    dcraw -v -c -g 2.4 12.92 $file | cjpeg > \"${file%%.*}\"\
    .jpeg; done\n  }\nfi\n```\n\n默认情况下，此函数处理当前目录下所有 `*.RAW` 扩展的文件，但你可以指定不同的文件扩展，例如：`rawtojpeg\
    \ NEF`。\n\n## 使用 jhead 重命名照片并编辑 EXIF 元数据\n\n[ExifTool](http://www.sno.phy.queensu.ca/~phil/exiftool/)\
    \ 是目前处理照片元数据最强大、功能最全工具，但它并不是唯一允许执行此操作的工具。虽然 [jhead](http://www.sentex.net/~mwandel/jhead/)\
    \ 仅提供了 ExifTool 的部分功能，但这个轻级工具易于掌握，并且可以处理许多常见的 EXIF 相关任务。要安装 jhead，请运行 `sudo apt\
    \ install jhead` 命令。\n\n与 ExifTool 类似，jhead 可以使用 EXIF 头中的日期和时间数据重命名照片，因此你可以将具有此功能的函数添加到\
    \ `~/.bashrc` 文件中。\n\n```\nif [ -x \"$(command -v jhead)\" ] ; then\n  function\
    \ jrename() {\n    ext=${1:-jpeg}\n    jhead -n%Y%m%d-%H%M%S *.$ext\n  }\nfi\n\
    ```\n\n默认情况下，该函数重命名当前目录下所有的 `*.jpeg` 文件，但你也可以作为命令参数显式指定所需的扩展名：\n\n```\njrename\
    \ JPG\n```\n\n该函数使用 `YYYYMMDD-HHMMSS` 格式重命名照片，但你可以轻松修改 `%Y%m%d-%H%M%S` 格式字符串。以下是一些你可以用于构建自定义字符串的有用参数。\n\
    \n```\n%d  几号，十进制数 (01 – 31)\n%H  24 小时制的小时 (00 – 23)\n%j  一年中的第几天，十进制数 (001 –\
    \ 366)\n%m  月份，十进制数 (01 – 12)\n%M  分钟，十进制数 (00 – 59)\n%S  秒，十进制数 (00 – 59)\n%U\
    \  一年中的第几周，十进制数，星期日为周的第一天 (00 – 53)\n%w  星期几，十进制数 (0 – 6；星期日为 0)\n%y  不带世纪的年份，十进制数\
    \ (00 – 99)\n%Y  带世纪的年份，十进制数\n```\n\n需要为照片添加描述吗？下面的函数允许你执行此操作。\n\n```\nif [ -x\
    \ \"$(command -v jhead)\" ] ; then\n  function jcomment() {\n    jhead -ce $1\n\
    \  }\nfi\n```\n\n运行 `jcomment` 命令并加上目标照片的文件（例如 `jcomment foo.jpg`），它会打开默认文本编辑器，你可以在其中输入文本。当你保存更改时，jhead\
    \ 会将文本写入 EXIF 头中的 Comment 字段。\n\n## 使用参考快照对照片进行地理标记\n\n如果你的相机缺乏地理标记功能，你可以使用智能手机和\
    \ Bash 单行命令为照片添加地理信息。\n\n当你在特定地点拍照时，请记住使用移动设备拍摄一张快照（确保设备上相机应用中的地理标记功能已开启）。该快照可以作为使用\
    \ [ExifTool](http://www.sno.phy.queensu.ca/~phil/exiftool/) 进行照片地理标记的参考文件。要安装它，请运行\
    \ `sudo apt-install libimage-exiftool-perl` 命令。下面的简单命令从参考快照读取地理标记并将其写入当前目录下所有的照片：\n\
    \n```\nexiftool -overwrite_original -r -tagsFromFile path/to/reference.jpg -gps:all.\n\
    ```\n\n将 `path/to/reference.jpg` 替换为参考快照的实际路径。为了让照片地理标记更加简单，将以下函数添加到 `~/.bashrc`\
    \ 文件中：\n\n```\nif [ -x \"$(command -v exiftool)\" ] ; then\n  function geotag()\
    \ {\n    geotag() path/to/reference.jpg\n  }\nfi\n```\n"
- fmt: "\n```\nif [ -x \"$(command -v mogrify)\" ] ; then\n  function makegif() {\n\
    \    ext=${1:-JPG}\n    dimension=${2:-800}\n    quality=${3:-95}\n    output=${4:-\"\
    foo.gif\"}\n    delay=${5:-120}\n    mogrify -resize \"$dimension\"x *.\"$ext\"\
    \n    convert -delay \"$delay\" -loop 0 *\"$ext\" \"$output\"\n  }\nfi\n```\n\n\
    Next time you want to transform a set of photos into an animated GIF, switch to\
    \ the directory with the photos, and run the `makegif` command. To override the\
    \ default settings, specify the required parameters, for example:\n\n```\nmakegif\
    \ jpeg 1600 90 foo-big.gif 180\n```\n\n## Add captions with basic EXIF data to\
    \ photos\n\nAdding a caption containing basic EXIF info such as aperture, shutter\
    \ speed, and ISO to a photo can come in useful in many situations. And a simple\
    \ Bash shell function automates this action. The function uses the `ExifTool`\
    \ and `ImageMagick` tools to extract EXIF data from a specified image. It then\
    \ adds a caption containing the extracted aperture, shutter speed, and ISO values\
    \ to the image.\n\n```\nif [ -x \"$(command -v exiftool)\" ] && [ -x \"$(command\
    \ -v convert)\" ]; then\n  function annotate(){\n  fnumber=$(exiftool -aperture\
    \ $1 | cut -d':' -f2)\n  exposure=$(exiftool -shutterspeed $1 | cut -d':' -f2)\n\
    \  iso=$(exiftool -iso $1 | cut -d':' -f2)\n  convert $1 -gravity South -background\
    \ Black \\\n  -font mononoki-Regular -pointsize 50 -fill White \\\n  -splice 0x54\
    \ -annotate 0x0 \"Aperture:$fnumber Shutter speed:$exposure ISO:$iso\"  exif_$1\n\
    \  xdg-open exif_$1\n  }\nfi\n```\n\nIn this case, the function uses the [Mononoki](https://madmalik.github.io/mononoki/)\
    \ font for the caption, but you can replace it with any other font installed on\
    \ your system. To list all fonts that you can use, run the `convert -list fonts`\
    \ command. To add a caption to a photo, run the `annotate /path/to/foo.JPG` command\
    \ (replace `/path/to/foo.JPG` with the actual path and filename of the photo).\n\
    \nOf course, you can tweak the script to fit your specific needs. For example,\
    \ you can replace the EXIF info with a copyright notice, or modify the function\
    \ to add an arbitrary text on-the-fly.\n\n## Show geotagged photos on OpenStreetMap\n\
    \nWant to show on the map the place where you took a specific photo? Provided\
    \ that the photo is geotagged, the simple function below will do the job:\n\n\
    ```\nif [ -x \"$(command -v exiftool)\" ] ; then\n  function show-on-osm(){\n\
    \    lat=`exiftool -n -p '$GPSlatitude' $1`\n    lon=`exiftool -n -p '$GPSlongitude'\
    \ $1`\n    osm=\"http://www.openstreetmap.org/?mlat=$lat&mlon=$lon&zoom=18\"\n\
    \    xdg-open $osm\n  }\nfi\n```\n\nThe function extracts latitude and longitude\
    \ values from the photo’s EXIF metadata, creates an OpenStreetMap URL, and opens\
    \ it in the default browser.\n\nFor the function to work, you need to install\
    \ `ExifTool` on your system. Add the function to the `~/.bashrc` file, and use\
    \ the `show-on-osm foo.JPG` command to show the photo you want on OpenStreetMap\
    \ (replace `foo.JPG` with the actual name of the desired photo).\n\n## Faster\
    \ access to image processing actions via context menus\n\nUsing the service menus\
    \ feature in KDE, you can add useful commands to the `Actions` entry context menu\
    \ in Dolphin. For example, you might want to resize photos before sharing them.\
    \ But instead of switching to the terminal and running a command like `convert\
    \ photo.jpg -resize 1600x1600> resized-photo.jpg` every time you need to optimize\
    \ a photo, you can create a service menu that allows you to quickly resize images\
    \ from the convenience of the Dolphin file manager. Create a text file and paste\
    \ the following service menu definition in it:\n\n```\n[Desktop Entry]\nType=Service\n\
    ServiceTypes=KonqPopupMenu/Plugin\nMimeType=image/png;image/jpeg;image/png;image/JPG;image/png;image/jpg;\n\
    Actions=ResizeLarge\n[Desktop Action ResizeLarge]\nName= Resize to 1600px\nExec=mogrify\
    \ -resize \"1600x1600>\" %f\nIcon=image-x-applix-graphics\n```\n\nTo limit the\
    \ menu to certain image formats, you can specify them in the `MimeType` part.\
    \ In the example above, the action will work only with JPEG and PNG images.\n\n\
    Save the file under the `resize.desktop` name and move it to `/usr/share/kservices5/ServiceMenus`\
    \ (create `ServiceMenus` directory manually if it doesn’t exist):\n\n```\nsudo\
    \ cp resize.desktop /usr/share/kservices5/ServiceMenus/\n```\n\nOpen Dolphin,\
    \ right-click on a JPG or PNG image file, and select the `Actions → Resize to\
    \ 1600px` action to resize the image.\n"
