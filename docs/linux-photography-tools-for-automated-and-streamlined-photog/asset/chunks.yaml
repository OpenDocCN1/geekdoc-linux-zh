  trans: "\n\n精确且一致的色彩管理需要工作流中的所有设备（例如数字相机和 LCD 显示器）都具有符合 ICC 标准的配置文件。色彩配置文件是“一组描述色彩输入或输出设备的数据集”（[维基百科：色彩配置文件定义](http://en.wikipedia.org/wiki/ICC_profile)）。再次由\
    \ Thom Hogan 解释了这一点：“色彩配置文件指定了设备如何偏离色彩空间。当我们对显示器、打印机或有时对相机进行色彩校准时，我们本质上是在创建一张它与色彩空间定义差异的地图。聪明的软件随后可以使用该地图，在设备上进行渲染或由该设备进行渲染时‘修复’颜色，使其符合色彩空间定义。”（[Thom\
    \ 的色彩管理快速简易指南](http://www.bythom.com/qadcolor.htm)）\n\n## 使用 Darktable 设置色彩管理工作流\n\
    \n为了说明色彩管理理论在实践中如何运作，这里有一个真实场景：你使用数字相机拍摄 RAW 格式的照片，然后在 Linux 机器上使用 Darktable 对其进行处理，并在连接到机器的\
    \ LCD 显示器上查看。\n\n第一步是为相机和显示器创建色彩配置文件。要在 Linux 上校准显示器并为其生成色彩配置文件，你需要两样东西：色准仪和色彩校准软件。高质量的专业色准仪通常相当贵，但你可以使用优秀的低成本\
    \ [ColorHug](http://www.hughski.com) 开源色准仪作为替代。\n\n在校准和色彩建模方面，[DisplayCAL](http://displaycal.net/)\
    \ 是这项工作的完美工具。它为 ArgyllCMS 开源色彩管理系统的显示器校准和建模工具提供了图形用户界面。后者在大多数主流 Linux 发行版的软件仓库中可用，因此你可以使用你发行版的包管理器进行安装。在\
    \ Debian 和基于 Ubuntu 的发行版中，可以通过运行 `sudo apt install argyll` 命令完成。接下来，你需要安装 ColorHug\
    \ 库和客户端软件。该软件也可用 Debian 和 Ubuntu 仓库中，因此可以使用 `sudo apt libcolorhug2 colorhug-client`\
    \ 命令进行安装。然后从项目网站下载 DisplayCAL 的封装版本并安装到你的系统上。连接 ColorHug，它应该会闪烁一下，表示已被系统检测到。在开始\
    \ ColorHug 之前，确保它拥有最新版本的固件。运行 `colorhug-flash` 命令启动固件更新实用程序，并使用它检查并升级 ColorHug\
    \ 的固件。\n\n![](img/file3.jpg)\n\n现在已经准备好校准和对显示器建模了。启动 DisplayCAL 并点击 **Detect**\
    \ 按钮让 DisplayCAL 检测连接的色准仪（它应该出现在 **Instrument/Port** 部分）。如果你正在使用多显示器设置，请确保在 **Display\
    \ device** 部分中选择了正确的显示器。然后从 **Settings** 下拉列表中选择 `Photo (D50, Gamma 2.2)`。点击 **Calibrate\
    \ & Profile** 按钮并按照指示校准显示器并生成其色彩配置文件。一旦生成色彩配置文件，DisplayCAL 会提示你安装该配置文件并在启动时启用它。顺便说一下，你也可以使用\
    \ DisplayCAL 安装现有的 ICC 显示器配置文件。要执行此操作，点击 **Settings** 下拉列表旁的 **Load Settings**\
    \ 按钮，并选择现有的 `*.icc` 文件。然后使用 **Install Profile** 按钮将所选配置文件全局安装或仅为当前用户安装。\n\n校准数字相机包括几个步骤：\n\
    \n1. 拍摄色彩校准靶的 RAW 照片\n2. 在 digiKam 中处理 RAW 文件且不进行任何色彩调整，并将结果保存为 16 位 TIFF \n3.\
    \ 使用 ArgyllCMS 生成色彩矩阵并用它创建 ICC 配置文件\n\n首先，你需要获取色彩校准靶。与色准仪一样，专业的色彩靶相当贵。幸运的是，Wolfgang\
    \ Faust 提供了低成本的 [IT8 标准色彩靶](http://www.targets.coloraid.de) 用于校准各种设备，包括数字相机（你需要\
    \ C1 靶）。每个色彩靶的生产次都是唯一的，因此每批色彩靶都通过其序列号进行标识（例如 `R131007`），每个校准靶都配有自己的自己的参考文件（例如\
    \ `R131007.txt`）。\n\n第一步是使用想要校准的相机拍摄色彩靶的 RAW 照片。这实际上比听起来要复杂得多，[如何制作相机输入配置文件靶拍摄](http://ninedegreesbelow.com/photography/camera-profile-make-target-shot.html)\
    \ 文章为此主题提供了非常有价值的信息。一旦拿到照片，启动 Darktable 并导入 RAW 文件。禁用 **base curve** 模块，裁剪照片以移除背景，并将结果保存为\
    \ 16 位 TIFF 文件。\n\n![](img/file4.jpg)\n\n要读取生成的 TIFF 文件的色彩块值，请使用以下命令（将 `DSC00001.tif`\
    \ 替换为 TIFF 文件的实际名称，并将 `131007.txt` 替换为参考文件）：\n\n```\nscanin -v -p -a -dipn DSC00001.tif\
    \ /usr/share/color/argyll/ref/it8.cht R131007.txt\n```\n\n打开生成的 `diag.tif` 文件并确保所有色彩块都被索引。最后，使用实际值而非默认值生成色彩配置文件：\n\
    \n```\ncolprof -v -A \"SONY\" -M \"Sony NEX-3N\" -D \"sony nex-3n\" -C \"Copyright\
    \ (c) 2016 Dmitri Popov. Some rights reserved.\" -q l -a m\n```\n\n最后一步是将生成的相机色彩配置文件添加到\
    \ Darktable。要执行此操作，将生成的 `*.icc` 文件移动到 `~/.config/darktable/color/in/` 文件夹（如果这些目录不存在，请创建）。启动应用程序并打开一个\
    \ RAW 文件进行编辑。启用 **input color profile** 模块，然后在模块的 **profile** 下拉列表中选择创建的相机配置文件。\n\
    \n## 使用 gThumb 管理照片\n\n管理和编辑照片以及 RAW 文件是摄影工作流中的关键步骤。虽然有很多优秀且强大的工具供你选择，但 [gThumb](https://live.gnome.org/gthumb)\
    \ 可以以很小的开销处理大多数管理任务。它看起来像是一个普通的图像查看器，但在简单的外表下隐藏着一个相当强大的照片修饰程序。由于 gThumb 在官方软件仓库可用，你可以使用\
    \ `sudo apt install gthumb` 进行安装。\n\n![](img/file5.jpg)\n\ngThumb 具有轻量级的界面，所有基本工具触手可及。左侧面板中的目录树让你能够轻松遍历文件系统并打开包含照片的文件夹。应用程序还了一些让导航更高效的功能。当你启动\
    \ gThumb 时，它会自动切换到上一次使用的目录。应用程序还会跟踪过的目录，你可以通过 **History** 按钮跳转到以前打开的目录。你还可以使用\
    \ **Bookmarks** 按钮下的 **Add Bookmark** 命令为特定目录添加书签。\n\ngThumb 提供了基本的导入功能，可以从外部存储设备卸载文件并从\
    \ Flickr 和 Facebook 等流行服务获取照片。要执行后者，点击 gThumb 窗口右上角的汉堡菜单，从 **Import From** 菜单中选择所需的服务。对\
    \ gThumb 进行服务验证，选择你想要的照片，应用程序会将它们导入当前打开的目录。你可以使用 **Import From** 菜单中的 **Removable\
    \ Device** 和 **Folder** 命令从外部存储设备（SD 卡、USB 盘等）和本地目录导入照片。\n\n"
- fmt: '

    The application supports most popular graphics formats, including JPEG, PNG, TIFF,
    and many others. Better still, gThumb features a dedicated command for converting
    photos between different formats. To convert a photo to a different format, press
    the `Tools` button in the upper-right corner of gThumb’s window and choose the
    `Convert Format` command. Other commands under the `Tools` button can be used
    to rotate and resize images as well as change their dates.


    When you select a directory in the left panel, gThumb displays photos from it
    as thumbnails in the main area. Select a photo, and you should see information
    about it in the `File properties` section of the left panel. The `Details` button
    below this section lets you view the photo’s metadata, while the `Histogram` button
    displays the photo’s histogram.


    ![](media/file6.jpg)


    Clicking on a thumbnail switches gThumb into the full-view mode, with a main pane
    displaying a large version of the photo and a thumbnail bar at the bottom. The
    button group on the left side of the main toolbar can be used to switch between
    different views (`Set to actual size`, `Fit to window`, `Fit to width`, and `Fit
    to height`), while the buttons in the group on the right side toggle the `Properties`
    and `Edit file` panels as well as evoke `Comment` and `Tags` dialog windows.


    gThumb’s filtering functionality can be useful for narrowing the displayed photos
    to items that match certain criteria. For example, you can define a filter that
    shows photos taken on a specific date or having a matching text in their descriptions.
    To configure and enable a filter, select `Personalize` from the `Show` drop-down
    list in the bottom bar, and select the desired items from the list of default
    filters. Alternatively, you can define custom filters by pressing the `New` button
    and defining one or multiple filtering rules.


    ## Organize photos in gThumb


    If you use tags to keep tabs on your photos, you’ll appreciate gThumb’s tagging
    functionality. To quickly assign one of the existing tags to a specific photo,
    right-click on it and choose the desired tag from the `Tags` menu (or use the
    `C` keyboard shortcut). You can then select the tags you want. To create a new
    tag, enter its name into the `Tags` field, and select the `Create tag` command
    from the appeared drop-down list. To add a description to the photo, choose the
    `Comment` command from the right-click context menu (or press the `C` keyboard
    shortcut). This opens the `Metadata` dialog window, where you can enter a description
    and specify other metadata properties, such as title, place the photo was taken,
    tags, and rating.


    ![](media/file7.jpg)


    Flags, or selections in gThumb’s terminology, is another useful feature for organizing
    photos. Using the `Alt+1…3` keyboard shortcuts, you can assign green, red, and
    blue flags to the currently selected photos. This feature can be put to a variety
    of uses. For example, you can flag your best photos you want to share immediately
    using the green flag, and add the red flag to photos that need further retouching.
    The `Selections` entry at the bottom of the directory tree in the left panel lets
    you view photos grouped by flag (e.g., the `Selection 1` section shows photos
    with the red flag). To quickly view the selection you need, use the `Ctrl+1…3`
    keyboard shortcuts.


    To make it easier to keep tabs on photos, gThumb allows you to group photos into
    catalogs and libraries. Catalogs are basically virtual folders: adding a photo
    to a catalog simply creates a reference to the original file, without physically
    moving the photo. Multiple catalogs can be grouped into libraries. This relatively
    simple functionality offers a flexible mechanism for organizing photos. For example,
    you can create separate catalogs for different countries (e.g., `Japan`, `Germany`,
    `France`, etc.), and then group the catalogs into the `Travel` library.


    The `Organize` button in the upper-right corner can be used to automatically generate
    catalogs based on several criteria, such as dates and tags. It’s also possible
    to create custom catalogs and libraries and populate them with photos manually.
    To create a new catalog or library, right-click on the `Catalogs` entry at the
    bottom of the directory tree in the left panel, choose the `Create Catalog` or
    `Create Library` command, give the new item a descriptive name and press `Create`.
    To add a photo to the catalog or library, right-click on the photo and choose
    the `Add to Catalog` command. Pick then the target catalog or library and press
    `Add`. You can also use the appropriate buttons in the `Add to Catalog` dialog
    window to create catalogs and libraries on the fly.


    ## Edit photos in gThumb


    When in the full-view mode, pressing the `Edit file` button opens the right panel
    that gives you access to editing tools. While gThumb won’t replace a dedicated
    image editing application, the available tools can come in handy for quickly tweaking
    basic settings like brightness, saturation, and contrast as well as sharpening
    photos and converting images to black-and-white. The dedicated `Special Effects`
    button in the `Color` group gives you access to several ready-made filters you
    can apply to your photos.


    ![](media/file8.jpg)


    In addition to these simple features, gThumb offers a curves tool that in skillful
    hands can work magic on your photos. gThumb allows you to save curve adjustments
    as presets, so you can maintain your own library of effects. To save the current
    curve adjustments, press the `Add to presets` button in the main toolbar, give
    the preset a name, and hit `Save`. You can access the saved presets using the
    `Presets` button.


    ### Understanding curves tool


    The key element in the Curves tool is the histogram that shows the input distribution
    of tones (X axis), and the output tones (Y axis). The left part of the X axis
    represents the darker tones, while the right part represents the highlights. The
    diagonal line (the tonal curve) indicates the ratio between input and output.
    Initially, the line is straight which means that the output is exactly the same
    as the input. Adjusting the tone curve alters the original ratio, thus changing
    the tonality of the image. And this is exactly what the Curve tool is designed
    to do. Click on the diagonal line to add a control point, then adjust the shape
    of the tonal curve by dragging the control point with the mouse. For more fine
    curve adjustment, create additional control points.


    To better understand how curves work, start with a few basic curve adjustments.
    To boost highlights, adjust the top-right part of the tonal curve upwards. As
    noted above, the right part of the histogram represents the highlights, so pushing
    the curve in the Luminosity channel upwards increases the brightness of the image.
    Among other things, this technique can be used to produce a high-key lighting
    effect. Another common adjustment is giving the tonal curve the S shape by raising
    the upper half of the curve and lowering the lower half of it. This effectively
    brightens the lighter areas of the image and darkens the darker areas. This, in
    turn, increases the overall contrast of the image without affecting exposure.


    While the Luminosity channel allows you to adjust the tonal curve, the Red, Green,
    and Blue channels can be used to control the contribution of each color in specific
    tonal regions of the image. For example, pushing the lower part of the curve in
    the Red channel downwards decreases the contribution of red in the dark tones,
    thus making shadows cooler.


    ![](media/file9.jpg)

    '
