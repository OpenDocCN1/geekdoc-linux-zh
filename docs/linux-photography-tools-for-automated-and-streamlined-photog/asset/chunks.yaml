    # Build static photo essays with Expose


    There are plenty of reasons to use a static web site generator for web publishing
    instead of a traditional content management system. Serving static pages requires
    only a web server, which dramatically simplifies the required setup. This, in
    turn, improves security and reduces maintenance overhead, as the minimal stack
    has fewer potential vulnerabilities and is easier to troubleshoot and keep up
    to date. Moreover, since publishing static content can be done using a lightweight
    web server, you can host your site on modest hardware or an inexpensive virtual
    private server.


    That’s all fine and dandy, but most static generators are designed to work with
    text-centric content like blog posts and long-form articles. But what if you want
    to publish a photo essay or a photo gallery? Enter [Expose](https://github.com/Jack000/Expose),
    a Bash shell script for generating static photo and video galleries. The script
    is less than a thousand lines long, but it’s capable of generating rather impressive
    galleries and photo essays, and offers a wide range of configurable options to
    boot.


    ![](media/file28.jpg)


    ## Get started with Expose


    Expose has only two dependencies: ImageMagick and FFmpeg. The latter is required
    only if you plan to publish videos. Better still, being just a regular Bash shell
    script, Expose requires no installation. Start with installing the required packages.
    To do this on Debian or Ubuntu, run the `sudo apt install imagemagick ffmpeg`
    command. Installing the packages on openSUSE is also a matter of running the `sudo
    zypper in ImageMagick ffmeg` command. To deploy the script on your machine, clone
    the project’s Git repository using the following command (make sure that Git is
    installed on your system first):


    ```

    git clone https://github.com/Jack000/Expose.git

    ```


    Open then the *~/bashrc* file in a text editor and specify an alias that points
    to the *expose.sh* script:


    ```

    alias expose=/script/location/expose.sh

    ```


    Before you start using the script, you might want to edit some basic settings.
    You can do this either by modifying the defaults directly in the *expose.sh* script
    or creating a separate *_config.sh* file in the directory containing the photos
    you want to publish. In the latter case, configuration may look something like
    this:


    ```

    site_title="Title Goes Here"

    theme_dir="theme1"

    social_button=false

    backgroundcolor="#ffffff"

    ```


    Expose comes with two themes: the default theme presents photos as a gallery,
    while the second theme is more suitable for photo essays featuring a mixture of
    text and images. Choosing the theme you want is a matter of specifying its name
    using the **theme_dir** configuration option. The **social_button** option lets
    you enable or disable sharing buttons, while the **backgroundcolor** option specifies
    the background color of the gallery.


    The tool supports plenty of other options, too. If you want to allow visitors
    to download the published photos, use the **download_button=true** option. In
    this case, you also need to install the zip package using the `sudo apt install
    zip` command on Debian and Ubuntu or `sudo zypper in zip` on openSUSE. With the
    download option enabled, Expose conveniently bundles a readme file with the default
    copyright notice, but you can change it using the **download_readme** option,
    for example: `download_readme="CC BY-SA-NC 4.0"`. By default, Expose reduces image
    quality to 92%, but you can override this using the **jpeg_quality** option as
    follows: `jpeg_quality=99`. Want to give your visitor the option to add comments?
    Expose also provides a range of video-related options, and you can find them along
    with their brief descriptions in the *expose.sh* script.


    :Before you run the script, you need to do some preparatory work. Expose sorts
    images in alphabetical order, so to arrange photos, you might want to rename them.
    One way to do this is to use numeric prefixes (e.g., *001_foo.jpeg*, *002_bar.jpeg*>,
    etc.). You can group photos in folders, and Expose generates a navigation menu
    based on the folder structure. To organize the folders, add numeric prefixes to
    them. The script strips these prefixes when generating a gallery, so they don’t
    appear in the navigation menu. If you want to skip a certain folder, prefix it
    with *_* (e.g., *_private-photos*), and Expose will ignore the folder when generating
    a gallery.'
