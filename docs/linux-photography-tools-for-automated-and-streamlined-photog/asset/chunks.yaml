    该应用程序支持大多数流行的图形格式，包括 JPEG、PNG、TIFF 等许多格式。更好的是，gThumb 具有一个专门的命令用于在不同格式之间转换照片。要将照片转换为不同的格式，点击
    gThumb 窗口右上角的 `Tools` 按钮，并选择 `Convert Format` 命令。`Tools` 按钮下的其他命令可用于旋转和调整图像大小以及更改它们的日期。


    当你在左侧面板中选择目录时，gThumb 将该目录中的照片以缩略图的形式显示在主区域。选择一张照片，你就可以在左侧面板的 `File properties`
    部分看到关于它的信息。该部分下方的 `Details` 按钮允许你查看照片的元数据，而 `Histogram` 按钮则显示照片的直方图。


    ![](img/file6.jpg)


    点击缩略图会将 gThumb 切换到全屏模式，主面板显示照片的大版本，底部有一个缩略图栏。主工具栏左侧的按钮组可用于在不同的视图之间切换（`Set to actual
    size`、`Fit to window`、`Fit to width` 和 `Fit to height`），而右侧组中的按钮可以切换 `Properties`
    和 `Edit file` 面板，并调出 `Comment` 和 `Tags` 对话窗口。


    gThumb 的过滤功能对于将显示的照片缩小到符合某些标准的项目非常有用。例如，你可以定义一个过滤器，显示在特定日期拍摄或描述中具有匹配文本的照片。要配置并启用过滤器，从底部栏的
    `Show` 下拉列表中选择 `Personalize`，并从默认过滤器列表中选择所需的项目。或者，你也可以通过按下 `New` 按钮定义一个或多个过滤规则来定义自定义过滤器。


    ## 在 gThumb 中组织照片


    如果你使用标签来跟踪照片，你将非常喜欢 gThumb 的标记功能。要快速将现有标签之一分配给特定照片，请右键点击该照片并从 `Tags` 菜单中选择所需的标签（或使用键盘快捷键
    `C`）。然后你可以选择你想要的标签。要创建一个新标签，请在 `Tags` 字段中输入其名称，并从弹出的下拉列表中选择 `Create tag` 命令。要为照片添加描述，从右键右文菜单中选择
    `Comment` 命令（或按 `C` 键盘快捷键）。这将打开 `Metadata` 对话窗口，你可以在其中输入描述并指定其他元数据属性，如标题、拍摄地、标签和评分。


    ![](img/file7.jpg)


    标记（在 gThumb 术语中称为 selections）是组织照片的另一个有用功能。使用键盘快捷键 `Alt+1…3`，你可以为当前选中的照片分配绿色、红色和蓝色标记。此功能可以有多种用途。例如，你可以使用绿色标记标记你想要立即分享的最佳照片，并对需要进一步修改的照片添加红色标记。左侧面板目录树底部的
    `Selections` 条目允许你按标记分组查看照片（例如，`Selection 1` 部分显示带有红色标记的照片）。要快速查看所需的选择内容，请使用键盘快捷键
    `Ctrl+1…3`。


    为了更方便跟踪照片，gThumb 允许你将照片分组到目录（catalogs）和库（libraries）。目录本质上是虚拟文件夹：将照片添加到目录只是创建了指向原始文件的引用，而不会在物理上移动照片。多个目录可以被组为一个库。这种相对简单的功能为组织照片提供了一种灵活的机制。例如，你可以为不同的国家（例如
    `Japan`、`Germany`、`France` 等）创建单独的目录，然后将目录分组到 `Travel` 库中。


    右上角的 `Organize` 按钮可以根据日期和标签等标准自动生成目录。还可以创建自定义目录和库并手动填充照片。要创建新目录或库，右键点击左侧目录树底部的
    `Catalogs` 条目，选择 `Create Catalog` 或 `Create Library` 命令，为新项目取一个描述性名称并按 `Create`。要将照片添加到目录或库中，右键点击照片并选择
    `Add to Catalog` 命令。然后选择目标目录或库并按 `Add`。你还可以使用 `Add to Catalog` 对话窗口中的相应按钮动态创建目录和库。


    ## 在 gThumb 中编辑照片


    在全屏模式下，按下 `Edit file` 按钮将打开右侧面板，让你访问编辑工具。虽然 gThumb 不会取代专门的图像编辑应用程序，但可用工具对于快速调整亮度、饱和度和对比度等基本设置，以及锐化照片和将图像转换为黑白会非常方便。`Color`
    组中专门的 `Special Effects` 按钮允许你访问几种可以应用于照片的预设过滤器。


    ![](img/file8.jpg)


    除了这些简单功能外，gThumb 还提供了曲线工具，熟练的操作可以为你的照片施展魔法。gThumb 允许将曲线调整保存为预设，这样你就可以维护自己的效果库。要保存当前的曲线调整，按下主工具栏上的
    `Add to presets` 按钮，为预设命名并点击 `Save`。你可以使用 `Presets` 按钮访问保存的预设。


    ### 理解曲线工具


    曲线工具的关键元素是直方图，它显示了色调的输入分布（X 轴）和输出色调（Y 轴）。X 轴的左部分代表较深色调，而右部分代表高光。对角线（色调曲线）指示了输入和输出之间的比例。初始线条是直的，这意味着输出与输入完全相同。调整色调曲线改变原始比例，从而改变图像的色调。这正是曲线工具的设计初衷。点击对角线添加控制点，然后通过鼠标拖动控制点来调整色调曲线的形状。为了更精细的曲线调整，可以创建额外的控制点。


    为了更好地理解曲线的工作原理，从基础的曲线调整开始。要增强高光，向上调整色调曲线的右上部分。如前所述，直方图的右部分代表高光，因此向上推 Luminosity
    通道中的曲线会增加图像的亮度。其他情况下，这种技术可以用于产生高调照明效果。另一种常见的调整是通过提高曲线上半部分并降低下半部分使其呈 S 形。这有效地亮化了图像的光亮区域并调暗了黑暗区域。这在不影响曝光的情况下增加了图像的整体对比度。


    虽然亮度通道允许你调整色调曲线，但红色、绿色和蓝色通道可用于控制颜色在图像特定色调区域的贡献。例如，向下推红色通道曲线的下半部分会减少暗色调中红色的贡献，从而使阴影看起来偏冷色调。


    ![](img/file9.jpg)


