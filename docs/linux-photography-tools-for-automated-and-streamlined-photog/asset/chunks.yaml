    从威盛（Transcend）、闪迪（SanDisk）和英睿达等正直制造商选择存储卡，是确保你不会丢失 RAW 文件和照片的最佳方法。但如果灾难发生，[Photorec](http://www.cgsecurity.org/wiki/PhotoRec)
    可以派上用。这个简单的工具可以从损坏的存储卡中恢复文件，并找回意外删除的文件。PhotoRec 是 TestDisk 软件包的一部分，你可以使用 `sudo
    apt install testdisk` 命令来安装它。虽然 PhotoRec 是一个命令行工具，但它非常易用，并会温和地引导你完成整个数据恢复过程，全程提供易于遵循的指令。


    要开始恢复操作，将存储卡插入你的电脑并运行 `sudo photorec` 命令。从检测到的卷列表中选择存储卡并按 `Proceed`（继续）。然后选择你想要恢复的分区并选择其格式。指定你是想从整个分区恢复数据，还是从其未分配空间恢复数据（这是默认选项，也是一个明智的首选）。选择一个存储恢复文件的路径，按
    `C` 键并等待恢复过程完成。随后，你将在指定路径下的 `recup_dir.x`（其中 `x` 是数字）目录中找到恢复的数据。这就是你使用 PhotoRec
    成功恢复数据所需的所有知识，但你可以在 [PhotoRec 逐步教程](http://www.cgsecurity.org/wiki/PhotoRec_Step_By_Step)
    页面上找到关于该工具选项的其他信息。


    尽管看起来简单，PhotoRec 在恢复数据方面通常表现出色，因此它是你摄影工具箱中不可或缺的补充。


    # 使用 Mejiro 发布和分享照片


    如果你正在寻找一个简单且轻量级的应用程序在自己的服务器上托管照片，那么 [Mejiro](http://dmpop.github.io/mejiro/) 非常适合你的需求。Mejiro
    由单个 PHP 文件组成，它可以很轻松地运行在任何带有 Web 服务器（例如 Apache 或 lighttpd）和 PHP 的机器上，且该应用程序的部署和使用极其简单。


    ![](img/file26.jpg)


    虽然 Mejiro 是一个相当极简的应用，但它确实提供了实用的功能和人性化的体验。应用程序采用响应式设计，因此在移动设备上运行良好。Mejiro 会自动提取并显示每张照片的基本
    EXIF 信息，包括光圈、快门速度和 ISO。此外，应用程序还会解析 IPTC 元数据并显示分配给照片的关键词。对于地理标记的照片，Mejiro 会在 OpenStreetMap
    或 Google 地图上显示它们的精确位置。你可以在随附文本文件中为每张照片添加描述，应用程序还可以读取并显示照片 `UserComment` EXIF 字段中的描述。更好的是，Mejiro
    会自动检测浏览器语言，并选择带有相应语言前缀的描述文本文件。Mejiro 使用 [is.gd](http://is.gd/) 服务生成短链接以便分享。对于每个
    JPEG 格式的照片，你可以上传配套的 RAW 文件，Mejiro 会自动为其添加一个链接。


    # 安装 Mejiro


    要托管 Mejiro，你需要一台运行 Apache 服务、PHP 和 GD 库的 Linux 类的机器。你还需要安装 cURL 工具和 Git。Mejiro
    应该可以与 [nginx](http://nginx.org/) 等其他服务器配合，但它只在 Apache 和 lightttpd 上进行过测试。


    ## 使用 Apache 服务器安装


    1. 使用 `sudo apt install apache2 php5 php5-gd git curl` 命令安装所需的软件包。

    2. 在终端中，切换到服务器的根目录（例如 `/var/www/`），并使用 `sudo git clone https://github.com/dmpop/mejiro.git`
    命令获取最新源代码。或者，你可以下载 ZIP 存档并将其解压到服务器的文档根目录。

    3. 用文本编辑器打开 `index.php` 文件并编辑设置。这一步是可选的。

    4. 使用 `sudo chown www-data -R mejiro` 命令让服务器对 `mejiro` 目录可写。

    5. 将照片放入 `photos` 目录。

    6. 将浏览器指向 `http://127.0.0.1/mejiro/`，你应该就能看到 Mejiro 了。


    ## 在树莓派上安装 Mejiro


    在树莓派上安装 Mejiro 只需要在终端中执行以下命令：


    ```

    wget https://raw.githubusercontent.com/dmpop/mejiro/master/install.sh

    chmod +x install.sh

    sudo ./install.sh

    ```


    这些命令获取 `install.sh` 脚本，使脚本具有可执行权限，然后运行该脚本。


    # 更新 Mejiro


    要更新现有的 Mejiro 安装，将当前的 `index.php` 文件替换为最新版本。


    如果你是通过 Git 直接从项目的 GitHub 仓库安装的 Mejiro，切换到 Mejiro 目录并运行以下命令：


    ```

    git pull origin master

    ```


    此命令从项目的 GitHub 仓库拉取最新源代码。


    # 向 Mejiro 添加照片


    要向 Mejiro 填充照片，你需要将它们上传到 `photos` 目录。你可以通过 SSH 或 FTP 从本地机器推送到照片，或者通过专用应用从 Android
    设备上传照片。


    ## 通过 SSH 上传照片


    从 Linux 机器上传照片最直接的方法是使用 `scp` 工具。不过，为了使用它，托管 Mejiro 的服务器必须运行 SSH 服务。从本地机器复制照片到服务器，请使用以下命令：


    ```

    scp /path/to/foo.jpg user@127.0.0.1:/var/www/mejiro/photos

    ```


    将 `user` 和 `127.0.0.1` 替换为服务器的实际用户名和 IP 地址。


    ## 使用 rsync 上传照片


    与其使用 `scp` 工具，你可以使用旧的 `rsync` 工具将目录内容上传到 Mejiro。这允许你以最小的精力推送多张照片。要使此方案生效，你需要在服务器和你的机器上安装
    rsync。然后使用以下命令（将 `/path/to/dir` 替换为源文件夹）：


    ```

    rsync -avhe ssh --progress /path/to/dir user@127.0.0.1:/var/www/mejiro/photos/

    ```


    ## 使用 Ghost Commander 从 Android 上传


    Android 用户可以使用优秀的 [Ghost Commander](https://play.google.com/store/apps/details?id=com.ghostsq.commander)
    文件管理器从设备上传照片。该应用原生支持 FTP 协议。这意味着如果托管 Mejiro 的机器运行 FTP 服务器，你可以直接使用。要进行操作，启动 Ghost
    Commander 并点击底部工具栏上的 **Home** 按钮。然后点击 **FTP site**，提供所需的连接信息并按 **OK**。


    如果你通过 SSH 或 SFTP 上传文件，需要安装 [Ghost Commander SFTP 插件](https://play.google.com/store/apps/details?id=com.ghostsq.commander.sftp)。安装完成后，你可以在
    **Home** 部分的 **SFTP site** 建立 SSH 连接。


    # 使用 uMap 和 PHP 映射照片


    如果你恰好使用像 Mejiro](http://dmpop.github.io/mejiro/) 这样将照片及其缩略图存储在常规目录中的发布应用程序，你可以结合
    [uMap](http://umap.openstreetmap.fr/) 和少量 PHP 脚本自动为你的照片绘制地图。更好的是，你不需要从头编写 PHP
    代码：你可以使用下面的脚本作为起点。


