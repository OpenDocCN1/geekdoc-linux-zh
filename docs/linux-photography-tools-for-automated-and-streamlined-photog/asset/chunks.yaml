  trans: "\n然后等待脚本执行完毕。你会发现传输到目标目录的照片和 RAW 文件已打上地理标记、重命名，并按日期整齐地组织在文件夹中。\n\n要更新 Otto，请切换到\
    \ `otto` 目录并运行 `git pull` 命令。\n\n由于 Otto 只是一个普通的 Bash 脚本，它可以轻松地运行在任何支持 Entware\
    \ 的 NAS 设备以及任何基于 Linux 的机器上。例如，在 openSUSE 上安装 Otto 只需运行以下命令：\n\n```\nsudo zypper\
    \ in bc jq curl ImageMagick gpsbabel\ngit clone https://gitlab.com/dmpop/otto.git\n\
    cd otto\nsudo cp otto.sh /usr/local/bin/otto\nsudo chown root:root /usr/local/bin/otto\n\
    sudo chmod 755 /usr/local/bin/otto\n```\n\n## 使用 Otto 为照片进行地理标记和地理位置关联\n\n如果照片已经打过地理标记，Otto\
    \ 会将相机型号和镜头等有用信息写入 EXIF 元数据的 `Comment` 字段中。更棒的是，如果你的相机不支持地理标记，该脚本还提供了两种方法可以实时为照片和\
    \ RAW 文件添加地理标记。添加 `-g` 选项并跟上拍摄照片的城市，脚本会自动获取该城市的坐标并将其用于地理标记：\n\n```\notto.sh -d\
    \ /path/to/photo/dir -g Tokyo\n```\n\nOtto 还允许你使用 GPX 文件对照片和 RAW 文件进行地理位置关联。当你使用像\
    \ [GPS Logger for Android](https://github.com/mendhak/gpslogger) 这样的应用跟踪轨迹并将其保存为\
    \ GPX 文件时，这非常有用。\n\n要在传输照片和 RAW 文件时进行地理关联，请将一个或多个 GPX 文件放入目录，并使用 `-c` 选项加上该目录的路径：\n\
    \n```\notto.sh -d /path/to/photo/dir -c /path/to/gpx/dir\n```\n\n# 使用 Geophotobash\
    \ 为照片地理标记\n\n一旦导入照片和 RAW 文件，你可能想对它们进行地理标记。[Geophotobash](https://gitlab.com/dmpop/geophotobash)\
    \ Bash 脚本可以为此提供帮助。\n\n## 部署 Geophotobash\n\n在 Debian 和 Ubuntu 上安装 Geophotobash，请运行以下命令：\n\
    \n```\nsudo apt install git-core curl bc jq libimage-exiftool-perl\ngit clone\
    \ https://gitlab.com/dmpop/geophotobash.git\ncd geophotobash\nsudo cp geophotobash.sh\
    \ /usr/local/bin/geophotobash\nsudo chown root:root /usr/local/bin/geophotobash\n\
    sudo chmod 755 /usr/local/bin/geophotobash\n```\n\n在 openSUSE 上执行相同操作，请将 `sudo\
    \ apt install git-core curl bc jq libimage-exiftool-perl` 命令替换为 `sudo zypper in\
    \ git-core curl bc jq exiftool`。\n\n为了确保脚本已安装，请运行 `geophotobash -h` 命令，你应该能看到简洁的使用信息。\n\
    \n## Geophotobash 的工作原理\n\n`geophotobash.sh` 脚本执行以下操作：\n\n* 使用 [Photon](http://photon.komoot.de/)\
    \ 服务获取指定城市的经纬度\n* 使用获取的地理坐标为当前目录下的照片地理标记\n* 使用 EXIF 元中的日期和时间重命名照片\n* 按城市和日期将照片组织到文件夹中\n\
    * 将指定的城市作为每张照片的关键词\n\n以下是工作原理：假设你有一个文件夹包含在柏林拍摄的照片，文件名类似于 `DSC00895.ARW`、`DSC00895.JPG`、`DSC00896.ARW`、`DSC00896.JPG`、`DSC00897.ARW`、`DSC00897.JPG`\
    \ 等。运行 `geophotobash -g Berlin` 命令。结果将是如下目录树，其中重命名并打上地理标记的照片已按日期组织在文件夹中：\n\n```\n\
    Berlin\n  2016-05-01\n    20160501-135557.ARW\n    20160501-135557.JPG\n  2016-05-02\n\
    \    20160502-190510.ARW\n    20160502-190510.JPG\n  2016-05-03\n    20160503-151535.ARW\n\
    \    20160503-151535.JPG\n```\n\n# 使用 ExifTool 组织和管理照片\n\n如果你需要定期处理数百甚至数千张照片，使用\
    \ ExifTool 完成这项工作将为你节省大量精力和时间。即使只需要修改几张照片，使用 ExifTool 也比诉诸你偏好的照片管理应用程序更高效。\n\n\
    ## 安装 ExifTool\n\n在 Debian 和 Ubuntu 上，安装 ExifTool 只需运行 `sudo apt install libimage-exiftool-perl`\
    \ 命令，或在 openSUSE 上运行 `sudo zypper in exiftool`。\n\n## 简单的 ExifTool 命令\n\n尽管顾名其实并不局限于\
    \ EXIF，但 ExifTool 可以处理存储在这些格式中的元数据。当你需要读取或修改元数据中的特定标签时，有时需要知道标签的实际名称（而不是默认的易读格式）以及它所属的组。获取这些信息最简单的方法是使用带有\
    \ `-s` 和 `-G` 选项的 `exiftool` 命令。前者显示实际标签名称，后者按组列出标签。运行 `exiftool -s -G /path/to/foo.jpg`\
    \ 命令，你应该看到按组组织的标签列表。\n\n## 使用元数据重命名和组织照片\n\n除了读取元数据，ExifTool 还可以执行其他有用操作。例如，该工具可以读取照片的创建日期和时间，然后使用获得的值重命名文件。以下命令会将当前目录下的\
    \ `foo.NEF` RAW 文件重命名为 `YYYYMMDD-HHMMSS.NEF` 格式（例如 `19730915-153500.NEF`）：\n\n\
    ```\nexiftool -d %Y%m%d-%H%M%S.%%e '-FileName<DateTimeOriginal' /path/to/foo.NEF\n\
    ```\n\n该命令由三部分组成。`-d` 选项设置时间的格式，紧随其后的规则定义了格式本身（`%%e` 保留原始扩展名）。`'-FileName<DateTimeOriginal'`\
    \ 部分指示 ExifTool 获取创建日期时间并将这些值作为文件名。命令的最后部分指定了文件路径。\n\n你可以使用文件夹路径而非单个文件，以便对目标目录中的所有文件运行命令（将\
    \ *DIR* 替换为目标目录的实际路径）。\n\n"
- fmt: "\n```\nexiftool -d %Y%m%d-%H%M%S.%%e '-FileName<DateTimeOriginal' DIR\n```\n\
    \nExifTool supports a wide range of parameters and switches. The `-ext` parameter,\
    \ for example, can be useful when you need to process photos in a specific format.\
    \ For example, if the target directory contains both JPG and NEF RAW files, and\
    \ you want to rename RAW files only, use the `-ext NEF` parameter as follows (`.`\
    \ denotes the current working directory):\n\n```\nexiftool -ext NEF -d %Y%m%d-%H%M%S.%%e\
    \ '-FileName<DateTimeOriginal' .\n```\n\nThe `-r` switch can be used to run ExifTool\
    \ commands on a directory and all its subdirectories:\n\n```\nexiftool -ext NEF\
    \ -r -d %Y%m%d-%H%M%S.%%e '-FileName<DateTimeOriginal' .\n```\n\nRenaming photos\
    \ is only one of ExifTool’s many capabilities. Need to organize photos into folders\
    \ by year? The command below provides a solution to the problem:\n\n```\nexiftool\
    \ -r -d %Y '-directory<$DateTimeOriginal/%d' .\n```\n\nThis command pulls the\
    \ year from each photo’s creation date and moves the photo into the appropriate\
    \ folder (the folder is automatically created if it doesn’t already exist).\n\n\
    Photographers who shoot in both RAW and JPEG will also appreciate the following\
    \ command that sorts photos into directories named by the original file extensions:\n\
    \n```\nexiftool -directory=%e DIR\n```\n\nSo if the current working directory\
    \ contains both `*.nef` and `*.jpg` files, the command above moves them into the\
    \ `nef` and `jpg` directories respectively.\n\nSpeaking of RAW files, ExifTool\
    \ also makes it possible to extract JPEG images embedded into RAW files using\
    \ the `-JpgFromRaw` switch:\n\n```\nexiftool -b -r -JpgFromRaw -ext NEF -w foo/%f.jpg\
    \ .\n```\n\nThe command above extracts JPEG images from NEF RAW files in the current\
    \ working directory and saves the extracted files in the `foo` folder. The `-b`\
    \ switch outputs data in the binary format, while the `-w` switch writes the binary\
    \ data as files.\n\n## ExifTool-based multi-purpose shell script\n\n[ExifTool](http://www.sno.phy.queensu.ca/~phil/exiftool/)\
    \ is an immensely powerful and flexible tool for working with photographic metadata.\
    \ But you don’t need to learn all its intricacies in order to put it to some practical\
    \ uses. The following Bash shell script makes use of ExitTool to automate several\
    \ tasks:\n\n```\n#!/usr/bin/env bash\nwhile getopts \"h?sdyar\" opt; do\ncase\
    \ $opt in\n  s) exiftool -directory=%e .\n  ;;\n  d) exiftool -d %Y%m%d-%H%M%S.%%e\
    \ '-FileName<DateTimeOriginal' -r .\n  ;;\n  y) exiftool '-Directory<CreateDate'\
    \ -d %Y-%m-%d -r .\n  ;;\n  a) exiftool -T -r -filename -make -model -fnumber\
    \ -exposuretime -iso -r . > results.txt\n  ;;\n  r) exiftool -overwrite_original\
    \ -all= -r .\n  ;;\n  h|\\?)\n  cat <<EOF\nUSAGE:\n  $0 [OPTIONS]\n  $0 -s sort\
    \ photos into folders by file extension\n  $0 -d rename photos by date\n  $0 -y\
    \ sort photos into folders by year, month, and date\n  $0 -a save key EXIF data\
    \ in the results.txt file\n  $0 -r remove all EXIF metadata from photos\nEOF\n\
    \  exit 2\n;;\nesac\ndone\n```\n\nPaste the script into a new text file and save\
    \ it under the `exiftool-helper.sh` name. Use then the following commands to install\
    \ the script globally:\n\n```\nsudo cp exiftool-helper /usr/local/bin/\nsudo chown\
    \ root:root /usr/local/bin/exiftool-helper\nsudo chmod 755 /usr/local/bin/exiftool-helper\n\
    ```\n\nSince the script relies on the ExifTool, you need to install this tool\
    \ using the `sudo apt install libimage-exiftool-perl` command.\n\nThe script uses\
    \ various switches to run the available commands. Used with the `-s` switch, the\
    \ script sorts photos in the current directory by file extension. This can be\
    \ useful when you have RAW and JPEG files in the same directory and you want to\
    \ move them into separate folders. The `-r` switch runs the command that removes\
    \ metadata from all photos in the current directory, while the `-a` switch can\
    \ be useful for exporting key EXIF data (aperture, shutter speed, ISO, etc.) to\
    \ a tab-separated text file. You can then use a spreadsheet application to analyze\
    \ these data.\n\nNaturally, you can customize the existing commands in the script\
    \ as well as add new ones. For example, if you want to add focal length data to\
    \ the list of exported values, modify the command launched by the `-a` script\
    \ as follows:\n\n```\nexiftool -T -r -filename -make -model -fnumber -exposuretime\
    \ -iso -focallength -r . > results.txt\n```\n\nTo add a new command to the script\
    \ you need to specify a switch for it first. For example, if you want to use the\
    \ `-w` switch, add it to the `\"h?sdyar\"` string: `\"h?sdyarw\"`. Add then the\
    \ desired command at the end of the `case ... in` block above the `h|\\?)` line\
    \ using the following format:\n\n```\nw) command goes here\n  ;;\n```\n\n## Add\
    \ useful functions to the Bash shell\n\nAdd a few relatively simple functions\
    \ to the `~/.bashrc` configuration file, and you can perform a wide range of photo-related\
    \ tasks directly from the command line.\n\n## Find and remove duplicates\n\nTo\
    \ keep your photo library in good shape, you should regularly check it for duplicates.\
    \ And [fdupes](https://github.com/adrianlopezroche/fdupes) is just the tool for\
    \ the job. Install it using the `sudo apt install fdupes` command, open the `~/.bashrc`\
    \ file in a text editor, add the code below, and save the changes:\n\n```\nif\
    \ [ -x \"$(command -v fdupes)\" ] ; then\n  function prune() {\n  dir=$(pwd)\n\
    \  fdupes -rd $dir\n  }\nfi\n```\n\nThe `if...then` statement checks whether the\
    \ `fdupes` tool is installed, while the `prune()` function obtains the path of\
    \ the current directory and runs the `fdupes -rd` command that finds duplicate\
    \ files.\n\n## Resize photos\n\nBefore you share photos on social media or publish\
    \ them on your blog, you might want to reduce their size and quality to save space\
    \ and cut down upload time. And the `mogrify* tool, which is part of ImageMagick,\
    \ can help you with that. To install ImageMagick on Debian and Ubuntu, run the\
    \ `sudo apt install imagemagick` command. On openSUSE, run the `sudo zypper in\
    \ ImageMagick` command. To process all images in a directory, you can use the\
    \ following command:\n\n```\nmogrify -resize '1600x1600>' -quality 95% *.JPG\n\
    ```\n\nThis command finds all `*.JPG` files and runs the `mogrify -resize '1600x1600>'\
    \ -quality 95%` action on them. The latter reduces the size to 1600px on the longest\
    \ side and reduces quality to 95%. Of course, you can modify the defaults, if\
    \ needed.\n\nInstead of typing the command every time you need to resize, you\
    \ can add a dedicated function to the `~/.bashrc` file. Open the file in a text\
    \ editor and add the following code:\n\n```\nif [ -x \"$(command -v mogrify)\"\
    \ ] ; then\n  function resize() {\n    ext=${1:-JPG}\n    dimension=${2:-1600}\n\
    \    quality=${3:-95}\n    mogrify -resize \"$dimension\"x\"$dimension\"\\> -quality\
    \ \"$quality\"% *.\"$ext\"\n  }\nfi\n```\n\nSwitch then to the directory containing\
    \ the photos you want to process, and run the `resize` command. Keep in mind that\
    \ this overwrites the original files in the directory. If that’s not what you\
    \ want, use the `convert` tool instead of `mogrify`:\n\n```\nif [ -x \"$(command\
    \ -v convert)\" ] ; then\n  function resize() {\n    ext=${1:-JPG}\n    dimension=${2:-1600}\n\
    \    quality=${3:-95}\n    for file in *\".$ext\"; do echo \"$file\"; convert\
    \ \"$file\" \\\n    -resize \"$dimension\"x\"$dimension\"\\> \\\n    -quality\
    \ \"$quality%\" \"resized_$dimension_$file\"; done\n  }\nfi\n```\n\nWhen you run\
    \ the `resize` command without any parameters, the function uses the default values\
    \ of the `ext`, `dimension`, and `quality` variables. In this case, the defaults\
    \ are `jpg`, `1600`, and `95` respectively. You can override the default values\
    \ by specifying the desired values as follows:\n\n```\nresize png 800 75\n```\n\
    \n## Convert RAW files\n"
  raw: "```\nexiftool -d %Y%m%d-%H%M%S.%%e '-FileName<DateTimeOriginal' DIR\n```\n\
    \nExifTool supports a wide range of parameters and switches. The `-ext` parameter,\
    \ for example, can be useful when you need to process photos in a specific format.\
    \ For example, if the target directory contains both JPG and NEF RAW files, and\
    \ you want to rename RAW files only, use the `-ext NEF` parameter as follows (`.`\
    \ denotes the current working directory):\n\n```\nexiftool -ext NEF -d %Y%m%d-%H%M%S.%%e\
    \ '-FileName<DateTimeOriginal' .\n```\n\nThe `-r` switch can be used to run ExifTool\
    \ commands on a directory and all its subdirectories:\n\n```\nexiftool -ext NEF\
    \ -r -d %Y%m%d-%H%M%S.%%e '-FileName<DateTimeOriginal' .\n```\n\nRenaming photos\
    \ is only one of ExifTool’s many capabilities. Need to organize photos into folders\
    \ by year? The command below provides a solution to the problem:\n\n```\nexiftool\
    \ -r -d %Y '-directory<$DateTimeOriginal/%d' .\n```\n\nThis command pulls the\
    \ year from each photo’s creation date and moves the photo into the appropriate\
    \ folder (the folder is automatically created if it doesn’t already exist).\n\n\
    Photographers who shoot in both RAW and JPEG will also appreciate the following\
    \ command that sorts photos into directories named by the original file extensions:\n\
    \n```\nexiftool -directory=%e DIR\n```\n\nSo if the current working directory\
    \ contains both *.nef* and *.jpg* files, the command above moves them into the\
    \ *nef* and *jpg* directories respectively.\n\nSpeaking of RAW files, ExifTool\
    \ also makes it possible to extract JPEG images embedded into RAW files using\
    \ the `-JpgFromRaw` switch:\n\n```\nexiftool -b -r -JpgFromRaw -ext NEF -w foo/%f.jpg\
    \ .\n```\n\nThe command above extracts JPEG images from NEF RAW files in the current\
    \ working directory and saves the extracted files in the *foo* folder. The `-b`\
    \ switch outputs data in the binary format, while the `-w` switch writes the binary\
    \ data as files.\n\n## ExifTool-based multi-purpose shell script\n\n[ExifTool](http://www.sno.phy.queensu.ca/~phil/exiftool/)\
    \ is an immensely powerful and flexible tool for working with photographic metadata.\
    \ But you don’t need to learn all its intricacies in order to put it to some practical\
    \ uses. The following Bash shell script makes use of ExitTool to automate several\
    \ tasks:\n\n```\n#!/usr/bin/env bash\nwhile getopts \"h?sdyar\" opt; do\ncase\
    \ $opt in\n  s) exiftool -directory=%e .\n  ;;\n  d) exiftool -d %Y%m%d-%H%M%S.%%e\
    \ '-FileName<DateTimeOriginal' -r .\n  ;;\n  y) exiftool '-Directory<CreateDate'\
    \ -d %Y-%m-%d -r .\n  ;;\n  a) exiftool -T -r -filename -make -model -fnumber\
    \ -exposuretime -iso -r . > results.txt\n  ;;\n  r) exiftool -overwrite_original\
    \ -all= -r .\n  ;;\n  h|\\?)\n  cat <<EOF\nUSAGE:\n  $0 [OPTIONS]\n  $0 -s sort\
    \ photos into folders by file extension\n  $0 -d rename photos by date\n  $0 -y\
    \ sort photos into folders by year, month, and date\n  $0 -a save key EXIF data\
    \ in the results.txt file\n  $0 -r remove all EXIF metadata from photos\nEOF\n\
    \  exit 2\n;;\nesac\ndone\n```\n\nPaste the script into a new text file and save\
    \ it under the *exiftool-helper.sh* name. Use then the following commands to install\
    \ the script globally:\n\n```\nsudo cp exiftool-helper /usr/local/bin/\nsudo chown\
    \ root:root /usr/local/bin/exiftool-helper\nsudo chmod 755 /usr/local/bin/exiftool-helper\n\
    ```\n\nSince the script relies on the ExifTool, you need to install this tool\
    \ using the `sudo apt install libimage-exiftool-perl` command.\n\nThe script uses\
    \ various switches to run the available commands. Used with the `-s` switch, the\
    \ script sorts photos in the current directory by file extension. This can be\
    \ useful when you have RAW and JPEG files in the same directory and you want to\
    \ move them into separate folders. The `-r` switch runs the command that removes\
    \ metadata from all photos in the current directory, while the `-a` switch can\
    \ be useful for exporting key EXIF data (aperture, shutter speed, ISO, etc.) to\
    \ a tab-separated text file. You can then use a spreadsheet application to analyze\
    \ these data.\n\nNaturally, you can customize the existing commands in the script\
    \ as well as add new ones. For example, if you want to add focal length data to\
    \ the list of exported values, modify the command launched by the `-a` script\
    \ as follows:\n\n```\nexiftool -T -r -filename -make -model -fnumber -exposuretime\
    \ -iso -focallength -r . > results.txt\n```\n\nTo add a new command to the script\
    \ you need to specify a switch for it first. For example, if you want to use the\
    \ `-w` switch, add it to the `\"h?sdyar\"` string: `\"h?sdyarw\"`. Add then the\
    \ desired command at the end of the `case ... in` block above the `h|\\?)` line\
    \ using the following format:\n\n```\nw) command goes here\n  ;;\n```\n\n# Add\
    \ useful functions to the Bash shell\n\nAdd a few relatively simple functions\
    \ to the *~/.bashrc* configuration file, and you can perform a wide range of photo-related\
    \ tasks directly from the command line.\n\n## Find and remove duplicates\n\nTo\
    \ keep your photo library in good shape, you should regularly check it for duplicates.\
    \ And [fdupes](https://github.com/adrianlopezroche/fdupes) is just the tool for\
    \ the job. Install it using the `sudo apt install fdupes` command, open the *~/.bashrc*\
    \ file in a text editor, add the code below, and save the changes:\n\n```\nif\
    \ [ -x \"$(command -v fdupes)\" ] ; then\n  function prune() {\n  dir=$(pwd)\n\
    \  fdupes -rd $dir\n  }\nfi\n```\n\nThe `if...then` statement checks whether the\
    \ *fdupes* tool is installed, while the *prune()* function obtains the path of\
    \ the current directory and runs the `fdupes -rd` command that finds duplicate\
    \ files and lets you remove them interactively.\n\n## Resize photos\n\nBefore\
    \ you share photos on social media or publish them on your blog, you might want\
    \ to reduce their size and quality to save storage space and cut down upload time.\
    \ And the *mogrify* tool, which is part of the ImageMagick package, can help you\
    \ with that. To install ImageMagick on Debian and Ubuntu, run the `sudo apt install\
    \ imagemagick` command. On openSUSE, run the `sudo zypper in ImageMagick` command.\
    \ To process all JPEG images in a directory, you can use the following command:\n\
    \n```\nmogrify -resize '1600x1600>' -quality 95% *.JPG\n```\n\nThis command finds\
    \ all *.JPG* files and runs the `mogrify -resize '1600x1600>' -quality 95%` action\
    \ on them. The latter reduces the size to 1600px on the longest side and reduces\
    \ quality to 95%. Of course, you can modify the defaults, if needed.\n\nInstead\
    \ of typing the command every time you need to resize photos, you can add a dedicated\
    \ function to the *~/.bashrc* file. Open the file in a text editor and add the\
    \ following code:\n\n```\nif [ -x \"$(command -v mogrify)\" ] ; then\n  function\
    \ resize() {\n    ext=${1:-JPG}\n    dimension=${2:-1600}\n    quality=${2:-95}\n\
    \    mogrify -resize \"$dimension\"x\"$dimension\"\\> -quality \"$quality\"% *.\"\
    $ext\"\n  }\nfi\n```\n\nSwitch then to the directory containing the photos you\
    \ want to process, and run the `resize` command. Keep in mind that this overwrites\
    \ the original files in the directory. If that’s not what you want, use the *convert*\
    \ tool instead of *mogrify*:\n\n```\nif [ -x \"$(command -v convert)\" ] ; then\n\
    \  function resize() {\n    ext=${1:-JPG}\n    dimension=${2:-1600}\n    quality=${3:-95}\n\
    \    for file in *\".$ext\"; do echo \"$file\"; convert \"$file\" \\\n    -resize\
    \ \"$dimension\"x\"$dimension\"\\> \\\n    -quality \"$quality\"% \"resized_$dimension_$file\"\
    ; done\n  }\nfi\n```\n\nWhen you run the `resize` command without any parameters,\
    \ the function uses the default values of the *ext*, *dimension*, and *quality*\
    \ variables. In this case, the defaults are *jpg*, *1600*, and *95* respectively.\
    \ You can override the default values by specifying the desired values as follows:\n\
    \n```\nresize png 800 75\n```\n\n## Convert RAW files"
