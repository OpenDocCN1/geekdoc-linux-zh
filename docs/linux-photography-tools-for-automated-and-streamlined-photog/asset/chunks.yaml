    # Command-line photographic workflow on Android with Termux


    There are plenty of Android apps for organizing, processing, and sharing photos.
    But if you want to implement a photographic workflow based on popular Linux tools,
    then [Termux](http://termux.com) is all you need.


    Termux is available on Google Play Store and [F-Droid](http://f-droid.org), so
    you can install it from your preferred source. The app’s default functionality
    can be extended by installing add-ons. The `Termux:API` add-on, for example, adds
    support for Android API, while the `Termux:Styling` package lets you pick an alternative
    color scheme and font. The `Termux:Widget` add-on gives you a homescreen widget
    containing shortcuts to shell scripts, so you can run scripts in Termux with a
    single tap. You can install these add-ons for free from F-Droid. If you choose
    to install the add-ons from Google Play Store, you have to purchase them. Think
    of it as a way to donate to the project and support its developer.


    Working in the terminal using the on-screen keyboard can quickly become tedious.
    Fortunately, Termux provides shortcuts to many common keyboard actions. Most of
    these shortcuts are identical to those in the `Bash` shell. For example, the `Ctrl+A`
    and `Ctrl+E` shortcuts move the cursor to the beginning and the end of the line
    respectively, while the `Ctrl+C` and `Ctrl+D` shortcuts abort the current process
    and log out of the terminal session. The only difference is that Termux uses the
    `Volume Down` hardware button instead of the `Ctrl` key. The `Volume Up` button
    in combination with various letters is used to emulate keyboard keys. The `Volume
    Up+T` shortcut emulates the `Tab` key, while `Volume Up+W`, `Volume Up+A`, `Volume
    Up+S`, and `Volume Up+D` act as arrow keys.


    There are three things you need to do when running Termux for the first time:
    update the app’s software repository, install the desired packages, and configure
    storage access. Termux uses the `pkg` tool for package management, so if you are
    coming from Debian or Ubuntu, you should feel at home in Termux. To update the
    repository, run the `pkg update` command. Want to see all packages in the repository?
    Run the `pkg list` command. To find a specific package, use the `pkg search [PACKAGE]`
    command, and to install the package, issue the `pkg install [PACKAGE]` command.
    Upgrading the installed packages is a matter of running the `pkg upgrade` command,
    while the `pkg remove [PACKAGE]` command can be used to remove an installed package.


    What packages to install depends entirely on what you want to use Termux for,
    but at the very least you might want to install the `nano` text editor, the `rsync`
    file copying tool, and the `OpenSSH` SSH connection tool. These three tools allow
    you to edit text and configuration files and perform backups as well as access
    and control remote machines. To install these packages in one go, use the following
    command:


    ```

    pkg install nano rsync openssh git curl wget

    ```


    To configure storage access, run the `termux-setup-storage` command. Doing this
    grants Termux permission to access shared storage on Android 6.0 and higher as
    well as creates the `storage` folder containing symbolic links to various storage
    locations. This includes `~/storage/shared` (the root folder shared by all apps),
    `~/storage/dcim` (the standard folder for photos and videos), and `~/storage/downloads`
    (the default folder for downloaded files).


    Having a tooled-up Linux environment on your Android device lets you perform tasks
    that usually require third-party commercial apps. For example, using `rsync`,
    you can easily set up a robust solution for backing up photos and RAW files on
    your Android device to a remote machine. To do this, it’s a good idea to enable
    password-less SSH login, so you don’t have to type the password every time you
    perform backup. Start with running the `ssh-keygen` command. Skip password creation
    when prompted by pressing `Enter`. Once a key pair has been created, run the `ssh-copy-id
    -i .ssh/id_rsa.pub user@host` command (replace `user` and `host` with the user
    name and the remote machine’s IP address or domain name). This copies the public
    key to the remote machine, thus enabling passwordless login. Backing up data on
    your Android device to the remote server is a matter of using an appropriate `rsync`
    command. If you want to back up photos and videos, the following command will
    be the trick:


    ```

    rsync -avz -e ssh ~/storage/dcim user@host:/path/to/backup/dir

    ```


    Instead of running this command manually every time you need to perform a backup,
    you can write a simple `Bash` shell script, save it in the `~/.shortcuts` directory,
    and add a Termux widget that links to the script. This way, you can trigger a
    backup operation directly from the homescreen.


    Staying on the subject of photos, the `jhead` utility makes it possible to process
    photos stored on your Android device. Run the `pkg install jhead` command to install
    the utility in Termux. Using `jhead`, you can replace generic file names with
    something more meaningful, like timestamps. The following command renames all
    `.jpg` files using the `YYYYMMDD-hhmmss` rule (e.g., `DC_0001.jpg`):


    ```

    for file in *.jpg; do jhead -n%Y%m%d-%H%M%S $file; done

    ```


    `jhead` can come in useful for basic EX metadata operations, but for more advanced
    metadata manipulations, you need ExifTool. Since it’s not available in Termux’
    software repository, you have to compile and install ExifTool manually. Start
    with installing the required packages using the `apt install perl make` command.
    Use then the `wget` tool to fetch the latest version of ExifTool source code (replace
    `Image-ExifTool-xx.xx.tar.gz` with the actual current version):


    ```

    wget http://www.sno.queensu.ca/~phil/exiftool/Image-ExifTool-xx.xx.tar.gz

    ```


    Unpack the downloaded archive and switch to the resulting directory:


    ```

    tar xzvf Image-ExifTool-xx.xx.tar.gz

    cd Image-ExifTool-xx.xx

    ```


    Run then the following commands to compile and install ExifTool:


    ```

    perl Makefile.PL

    make test

    make install

    ```


    Once the compilation and installation process is completed, you can check whether
    ExifTool has been properly installed by running the `which exiftool` command.


    If you happen to shoot in RAW, you can convert RAW files into JPEG photos on your
    Android device using a combination of DCRaw, Netpbm and ImageMagick. Start with
    installing these tools by running the `pkg install dcraw netpbm imagemagick` command.
    Use then the following command to convert a single RAW file to the PNG format:


    ```

    dcraw -c -g 2.4 12.92 foo.RAW | pnmtopng > foo.png

    ```


    In this command, the `dcraw` tool decodes the RAW file and pipes the output to
    the `pnmtopng` tool that saves it in the PNG format. You can then use the `convert`
    tool to convert the resulting PNG file into JPEG:


    ```

    convert foo.png foo.jpg

    ```


    To process all RAW files and save them in the JPEG format, use these two commands:


    ```

    for file in *.RAW ; do dcraw -c -g 2.4 12.92 "$file" | pnmtopng > "${file%%.*}".png
    ; done

    for file in *.png ; do convert "$file" "${file%.*}.jpg" ; done

    ```


    Instead of `convert`, you can use the `mogrify` tool as follows:


    ```

    mogrify -format jpg *.png

    ```


    Keep in mind, though, that `mogrify` overwrites originals, so use it with care.

