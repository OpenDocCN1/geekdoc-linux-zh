  trans: "\n脚本和所有需要的组件都可以在 [Boketto](https://gitlab.com/dmpop/boketto) GitLab 仓库获取。你可以使用\
    \ `git clone https://gitlab.com/dmpop/hanabi.git` 命令进行克隆，或者直接下载 ZIP 压缩包作为源码。替换\
    \ `favicon.png` 文件，根据需要添加 `*.md` 文件，并修改 `index.php` 文件中的默认值。然后，将 `index.php`、`parsedown.php`、`favicon.png`\
    \ 以及 `*.md` 文件上传到你 Web 服务器根目录下的指定位置。\n\n接下来，在服务器上创建一个用于存储照片的目录。在将照片添加到此目录之前，最好先减小它们的大小。这会让你的应用程序运行得更快，并减少需要传输的数据量。你可以使用\
    \ [jpeg-recompress](https://github.com/danielgtaylor/jpeg-archive) 和 `mogrify`\
    \ 工具来完成操作。在系统中安装这两个工具后，使用以下命令重新压缩或调整当前目录下所有 `*.jpg` 文件的大小：\n\n```\nfor file in\
    \ *.jpg; do jpeg-recompress --quality high $file $file; done\nmogrify -resize\
    \ \"1600>\" *.jpg\n```\n\n虽然这个简单的方案无法取代专业的画廊或作品集，但当你想要建立一个展示照片的简易页面时，它会大派用场。更好的是，你可以轻松将此脚本用于其他用途。例如，如果你已经有一个网站，可以将脚本嵌入到页面中显示随机照片。\n\
    \n```php\n<?php\n$dir = \"path/to/dir\";\n$ext = \"jpg\";\n\n$files = glob($dir.'.''.$ext);\n\
    $file = array_rand($files);\n$img = $files[$file];\n\n$exif = exif_read_data($img,\
    \ 0, true);\n$caption = $exif['COMMENT']['0'];\n\necho <<< EOT\n            <img\
    \ src=\"$img\" />\n            <p>$caption</p>\nEOT;\n?>\n```\n\n将上述代码插入到你想显示图片的页面中，并确保该页面本身具有\
    \ `*.php` 文件扩展名。就是这样了。\n\n# 在新浏览器标签页中显示你的照片\n\n浏览器中的新标签页区域有多种实际用途：从显示时区到记笔记以及管理日常任务。你也可以配置新标签页来展示你的照片。要做到这一点，你需要三个东西：1)\
    \ Web 服务器上一个存放照片的文件夹，2) 一个简单的 PHP 脚本，3) Firefox 的 New Tab Override 扩展或 Chrome\
    \ 和 Chromium 的 Change New Tab 扩展。\n\n在将所需的照片上传到 Web 服务器上的文件夹之前，最好先调整它们的大小以便快速加载。如果你的系统中安装了\
    \ ImageMagick，请切换到包含照片的本地目录并运行下面的命令（如有需要，调整文件扩展名、尺寸和质量值）：\n\n```\nfor file in\
    \ *.jpg; do mogrify -resize \"1200>\" -quality 95% $file; done\n```\n\n记住，此命令会将原始图像替换为处理后的图像。如果你不想这样做，请使用以下命令，它将以\
    \ `*.JPG` 扩展保存调整大小后的图像：\n\n```\nfor file in *.jpg; do convert -resize \"1200>\"\
    \ -quality 95% $file \"`basename $file .jpg`.JPG\"; done\n```\n\n将调整大小后的图像上传到\
    \ Web 服务器上的文件夹。然后使用 `wget -O newtab.php https://gitlab.com/snippets/1832587/raw`\
    \ 命令获取 PHP 脚本。打开下载的 `netab.php` 文件进行编辑，并确保变量 `$ext` 的值与照片的文件扩展匹配。将脚本移动到包含调整大小后照片的服务器文件夹中。\n\
    \n安装 [New Tab Override](https://addons.mozilla.org/firefox/addon/new-tab-override/)\
    \ 扩展，打开扩展设置并在相应字段中指定 PHP 脚本的 URL。如果你恰好使用 Chrome 或 Chromium，安装 [Change New Tab](https://chrome.google.com/webstore/detail/change-new-tab/mocklpfdimiadpbgamlgehpgpodggahe/)\
    \ 扩展，并在提示时指定 URL。\n\n完成后，打开一个新标签页，你应该就能看到一张随机照片。\n\n# WIRC：用于 Sony Alpha 相机的 Wi-Fi\
    \ 红外遥控器\n\nIR 口可能不是 Sony Alpha 相机最令人兴奋的功能。事实上，你纳闷索尼为什么保留这项看似过时的技术也是完全可以理解的。因为它廉价、简单且可靠。它的功能性也惊讶地强大，因为它允许你控制相机上几乎每一个物理按钮。遗憾的是，你在网上找到的廉价红外遥控器并没有充分发挥\
    \ IR 口的作用。它们大多数只允许你触发快门、触发定时器或锁定在泡灯模式（bulb mode）。一些高级型号还带有间隔计时器，但仅此而已了。\n\n![](img/file31.jpg)\n\
    \n所以，如果你想释放 IR 口的真正潜力，你应该走 DIY 路线。这既有意义又有趣，而且可能更便宜。更不用说结果优于任何市售的红外遥控器。下面描述的 DIY\
    \ 红外遥控器拥有自己的 Web 界面，可以通过无线连接进行控制。这种 DIY 红外遥控器具有基于 Web 的界面，并可以通过无线连接进行控制。这听起来可能有些过度设计，但该方案有其优点：\n\
    \n*   它不需要在相机上安装任何应用程序\n*   可以使用任何带有浏览器的设备来控制相机\n*   它可以适配其他相机型号\n\n制作此红外遥控器需要以下组件：\n\
    \n*   ESP266 NodeMCU 或 D1 mini\n*   面包板\n*   150 欧姆电阻\n*   红外 LED (940nm)\n* \
    \  连接线\n\n虽然你可以使用任何基于 ESP866 的开发板，但 D1 mini 模块因其尺寸使其是该项目的理想选择。你还需要一台 Linux 机器来编写编译代码并将其上传到板。\n\
    \n首要任务是在 Linux 机器上安装所需的工具并连接开发板。[Arduino CLI](https://github.com/arduino/arduino-cli)\
    \ 是一个完全足够的命令行工具。从 GitHub 页面获取最新版本并解压下载的包。在终端中切换到结果目录，使用以下命令安装可执行文件：\n\n```\nsudo\
    \ cp arduino-cli /usr/local/bin/\nsudo chown root:root /usr/local/bin/\nsudo chmod\
    \ 755 /usr/local/bin/\n```\n\n接下来，连接板并运行 `sudo chmod 666 /dev/tty0` 命令以启用访问。要使访问持久化，使用以下命令：\n\
    \n```\nsudo usermod -a -G dialout $USER\n```\n\n要检测连接的板，运行 `arduino-cli board\
    \ list` 命令。如果检测到了板，你应该看到如下输出：\n\n```\nFQBN    Port            ID             \
    \ Board Name \n        /dev/ttyUSB0    1a86:7523       unknown \n```\n\n断开板连接并按照图所示连接所有组件。\n\
    \n![](img/file32.png)\n\n现在，使用 `git clone git@gitlab.com:dmpop/wirc.git` 命令克隆包含代码的\
    \ [WIRC](https://gitlab.com/dmpop/wirc) 项目。或者从项目的 GitLab 页面下载最新存档。在终端中切换到结果目录并运行以下命令编译代码：\n\
    \n```\narduino-cli compile --fqbn esp8266:esp8266:d1\n```\n\n这会在目录下创建两个文件：`wirc.esp8266.esp8266.d1.elf`\
    \ 和 `wirc.esp8266.esp8266.d1.bin`。要将编译后的代码上传到板，请连接板并运行以下命令：\n\n```\narduino-cli\
    \ upload -p /dev/ttyUSB0 --fqbn esp8266:esp8266:d1\n```\n"
- fmt: "\nAs soon as the code has been uploaded to the board, the device becomes operational.\
    \ The final step is to connect the created Wi-Fi IR remote control to an existing\
    \ Wi-Fi network. To do this, connect either your Linux machine or a mobile device\
    \ to the access point created by the board. This automatically redirects to the\
    \ captive portal that allows you to connect the board to an existing wireless\
    \ network. Once you’ve done this, make sure that the device you want to use to\
    \ operate the remote control is connected to the same wireless network as the\
    \ board. Point then the browser on your device to the IP address of the remote\
    \ control, and you should see its web interface.\n\nOn your Sony Alpha camera,\
    \ enable the remote control feature. To do this on Sony α6300 (ILCE-6300), press\
    \ the `MENU` button, go to `Settings → 3 → Remote Ctrl`, and choose `On`. Make\
    \ sure that there is a line of sight between the remote control and the camera’s\
    \ IR port, and press the `SHUTTER` button in the web interface. If everything\
    \ works, this should trigger the camera’s shutter.\n\n# Control Sony Alpha camera\
    \ from Linux with Sony Camera Remote API\n\nControlling a digital camera from\
    \ a Linux machine via a USB connection is nothing new, and applications like `gPhoto`,\
    \ `Entangle`, and `Darktable` allow you to do this with consummate ease. But tethered\
    \ shooting is both old-fashioned and somewhat impractical, as it requires a physical\
    \ connection between the machine and the camera. Conveniently, the latest camera\
    \ models support remote control via Wi-Fi, which offers a more flexible way of\
    \ remote shooting. In most cases, though, you use a dedicated app on an Android\
    \ or iOS device to take advantage of this functionality. Fortunately, some manufacturers\
    \ like Sony support a camera remote API that can be used to build third-party\
    \ applications and tools for remote control via Wi-Fi on practically any platform.\n\
    \nIn the case of Sony Alpha models, the Smart Remote Control app transforms the\
    \ camera into an ad-hoc wireless hotspot and a server that accepts and parses\
    \ incoming HTTP calls with payloads in the JSON format. These payloads contain\
    \ instructions for controlling the camera and its settings. In practical terms\
    \ this means that you can control the Sony camera from any device via a direct\
    \ wireless connection by sending HTTP calls containing JSON-formatted data. The\
    \ technical term for this technology is [JSON-RPC over HTTP](https://en.wikipedia.org/wiki/JSON-RPC),\
    \ and it’s supported by many popular scripting and programming languages.\n\n\
    On Linux, you only need the `Bash` shell script and the [cURL](https://curl.haxx.se/)\
    \ tool to build simple and more advanced scripts for controlling your Sony Alpha\
    \ camera remotely. But before you proceed, make sure that your specific camera\
    \ model is supported by consulting the [camera compatibility](https://developer.sony.com/develop/cameras/)\
    \ page.\n\n## Preparatory work\n\nThe first step is to establish a direct wireless\
    \ connection between your Linux machine and the camera. On the camera, press the\
    \ `Menu` button, switch to the `Application List` section, and start the Smart\
    \ Remote Control app. Switch to the `Connect with password` page, and use the\
    \ provided connection info to connect the Linux machine to the camera’s hotspot.\
    \ To communicate and control the camera, you need to know its endpoint URL, or\
    \ URL to send JSON-RPC HTTP requests to. Usually, the endpoint URL of Sony cameras\
    \ is `http://192.168.122.1:8080/sony/camera`. However, it may happen that your\
    \ particular camera model uses a different endpoint URL. To find it, you can use\
    \ a quick-and-dirty Python script:\n\n```python\n#!/usr/bin/env python\nimport\
    \ sys\nimport socket\nimport re\nimport urllib2\nSSDP_ADDR = \"239.255.255.250\"\
    ;\nSSDP_PORT = 1900;\nSSDP_MX = 1;\nSSDP_ST = \"urn:schemas-sony-com:service:ScalarWebAPI:1\"\
    ;\nssdpRequest = \"M-SEARCH * HTTP/1.1\\r\\n\" + \\\n                \"HOST: %s:%d\\\
    r\\n\" % (SSDP_ADDR, SSDP_PORT) + \\\n                \"MAN: \\\"ssdp:discover\\\
    \"\\r\\n\" + \\\n                \"MX: %d\\r\\n\" % (SSDP_MX, ) + \\\n       \
    \         \"ST: %s\\r\\n\" % (SSDP_ST, ) + \"\\r\\n\";\nsock = socket.socket(socket.AF_INET,\
    \ socket.SOCK_DGRAM)\nsock.sendto(ssdpRequest, (SSDP_ADDR, SSDP_PORT))\nRESULT\
    \ = sock.recv(1000)\nURL=re.search(\"(?P<url>http?://[^\\s]+)\", RESULT).group(\"\
    url\")\nRESPONSE = urllib2.urlopen(URL)\n```\n"
  raw: "As soon as the code has been uploaded to the board, the device becomes operational.\
    \ The final step is to connect the created Wi-Fi IR remote control to an existing\
    \ Wi-Fi network. To do this, connect either your Linux machine or a mobile device\
    \ to the access point created by the board. This automatically redirects to the\
    \ captive portal that allows you to connect the board to an existing wireless\
    \ network. Once you’ve done this, make sure that the device you want to use to\
    \ operate the remote control is connected to the same wireless network as the\
    \ board. Point then the browser on your device to the IP address of the remote\
    \ control, and you should see its web interface.\n\nOn your Sony Alpha camera,\
    \ enable the remote control feature. To do this on Sony α6300 (ILCE-6300), press\
    \ the **MENU** button, go to **Settings → 3 → Remote Ctrl**, and choose *On*.\
    \ Make sure that there is a line of sight between the remote control and the camera’s\
    \ IR port, and press the **SHUTTER** button in the web interface. If everything\
    \ works, this should trigger the camera’s shutter.\n\n# Control Sony Alpha camera\
    \ from Linux with Sony Camera Remote API\n\nControlling a digital camera from\
    \ a Linux machine via a USB connection is nothing new, and applications like gPhoto,\
    \ Entangle, and Darktable allow you to do this with consummate ease. But tethered\
    \ shooting is both old-fashioned and somewhat impractical, as it requires a physical\
    \ connection between the machine and the camera. Conveniently, the latest camera\
    \ models support remote control via Wi-Fi, which offers a more flexible way of\
    \ remote shooting. In most cases, though, you use a dedicated app on an Android\
    \ or iOS device to take advantage of this functionality. Fortunately, some manufacturers\
    \ like Sony support a camera remote API that can be used to build third-party\
    \ applications and tools for remote control via Wi-Fi on practically any platform.\n\
    \nIn the case of Sony Alpha models, the Smart Remote Control app transforms the\
    \ camera into an ad-hoc wireless hotspot and a server that accepts and parses\
    \ incoming HTTP calls with payloads in the JSON format. These payloads contain\
    \ instructions for controlling the camera and its settings. In practical terms\
    \ this means that you can control the Sony camera from any device via a direct\
    \ wireless connection by sending HTTP calls containing JSON-formatted data. The\
    \ technical term for this technology is [JSON-RPC over HTTP](https://en.wikipedia.org/wiki/JSON-RPC),\
    \ and it’s supported by many popular scripting and programming languages.\n\n\
    On Linux, you only need the Bash shell script and the [cURL](https://curl.haxx.se/)\
    \ tool to build simple and more advanced scripts for controlling your Sony Alpha\
    \ camera remotely. But before you proceed, make sure that your specific camera\
    \ model is supported by consulting the [camera compatibility](https://developer.sony.com/develop/cameras/)\
    \ page.\n\n## Preparatory work\n\nThe first step is to establish a direct wireless\
    \ connection between your Linux machine and the camera. On the camera, press the\
    \ **Menu** button, switch to the **Application List** section, and start the Smart\
    \ Remote Control app. Switch to the **Connect with password** page, and use the\
    \ provided connection info to connect the Linux machine to the camera’s hotspot.\
    \ To communicate and control the camera, you need to know its endpoint URL, or\
    \ URL to send JSON-RPC HTTP requests to. Usually, the endpoint URL of Sony cameras\
    \ is *http://192.168.122.1:8080/sony/camera*. However, it may happen that your\
    \ particular camera model uses a different endpoint URL. To find it, you can use\
    \ a quick-and-dirty Python script:\n\n```\n[](#cb110-1)#!/usr/bin/env python\n\
    [](#cb110-2)import sys\n[](#cb110-3)import socket\n[](#cb110-4)import re\n[](#cb110-5)import\
    \ urllib2\n[](#cb110-6)SSDP_ADDR = \"239.255.255.250\";\n[](#cb110-7)SSDP_PORT\
    \ = 1900;\n[](#cb110-8)SSDP_MX = 1;\n[](#cb110-9)SSDP_ST = \"urn:schemas-sony-com:service:ScalarWebAPI:1\"\
    ;\n[](#cb110-10)ssdpRequest = \"M-SEARCH * HTTP/1.1\\r\\n\" + \\\n[](#cb110-11)\
    \                \"HOST: %s:%d\\r\\n\" % (SSDP_ADDR, SSDP_PORT) + \\\n[](#cb110-12)\
    \                \"MAN: \\\"ssdp:discover\\\"\\r\\n\" + \\\n[](#cb110-13)    \
    \            \"MX: %d\\r\\n\" % (SSDP_MX, ) + \\\n[](#cb110-14)              \
    \  \"ST: %s\\r\\n\" % (SSDP_ST, ) + \"\\r\\n\";\n[](#cb110-15)sock = socket.socket(socket.AF_INET,\
    \ socket.SOCK_DGRAM)\n[](#cb110-16)sock.sendto(ssdpRequest, (SSDP_ADDR, SSDP_PORT))\n\
    [](#cb110-17)RESULT = sock.recv(1000)\n[](#cb110-18)URL=re.search(\"(?P<url>https?://[^\\\
    s]+)\", RESULT).group(\"url\")\n[](#cb110-19)RESPONSE = urllib2.urlopen(URL)\n\
    [](#cb110-20)CONTENT = response.read()\n[](#cb110-21)RESULT=str(re.findall(\"\
    ScalarWebAPI_ActionList_URL.*$\",CONTENT,re.MULTILINE))\n[](#cb110-22)print (Endpoint\
    \ URL:\" + re.search(\"(?P<url>https?://[^\\s]+)\", RESULT).group(\"url\").split(\"\
    <\", 1)[0] + \"/camera\")\n```\n\nSave the script under the *ssdp.py* name, make\
    \ it executable using the `chmod +x ssdp.py` command, and run the script in the\
    \ terminal to obtain the correct endpoint URL.\n\nGrab the latest version of the\
    \ [Sony Camera Remote API SDK](https://developer.sony.com/downloads/all/sony-camera-remote-api-beta-sdk/),\
    \ and you are ready to get started.\n\n## First Shell Script\n\nA simple shell\
    \ script that takes a single photo is a good starting point for mastering the\
    \ Camera Remote API. Taking a photo remotely is a three-step action: put the camera\
    \ into the recording mode, take photo, end the recording mode. Each step is accomplished\
    \ by sending a JSON-PRC HTTP call. To enable the recording mode, you need to send\
    \ an HTTP call with the following JSON-PRC payload:\n\n```\n{\n  \"method\":\"\
    startRecMode\",\n  \"params\":[],\n  \"id\":1,\n  \"version\": \"1.0\"\n}\n```\n\
    \nWhen it comes to transferring data to and from a server via the HTTP protocol,\
    \ cURL is the perfect tool for the job, and the command that puts the camera into\
    \ the recording mode is as follows:\n\n```\ncurl -s -X POST -d '{\"method\":\"\
    startRecMode\",\"params\":[],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\n```\n\nThe `-s`flag mutes cURL, while the `-X POST -d` flags specify\
    \ a custom request method that sends specified data via the HTTP POST request\
    \ to the endpoint URL. Normally, the HTTP request triggers a response from the\
    \ server, but since there is no need for it, the output is sent to */dev/null*\
    \ and discarded. To switch to the recording mode, the camera needs a little bit\
    \ of time, so you should add the `sleep 2` command right after the JSON-PRC request.\n\
    \nThe commands that take a photo and stop the recording mode look very similar:\n\
    \n```\ncurl -s -X POST -d '{\"method\":\"actTakePicture\",\"params\":[],\"id\"\
    :1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"stopRecMode\",\"params\":[],\"id\":1,\"version\"\
    : \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n```\n\nThe only\
    \ difference here is the actual *method* values. To turn individual commands into\
    \ a script, create a text file and paste the following code into it:\n\n```\n\
    #!/usr/bin/env bash\ncurl -s -X POST -d '{\"method\":\"startRecMode\",\"params\"\
    :[],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    sleep 2\ncurl -s -X POST -d '{\"method\":\"actTakePicture\",\"params\":[],\"id\"\
    :1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"stopRecMode\",\"params\":[],\"id\":1,\"version\"\
    : \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n```\n\nSave the\
    \ file under the *take-photo.sh* name and make the script executable using the\
    \ `chmod +x take-photo.sh` command. Make sure that your Linux machine is connected\
    \ to the camera, then run the script with the `./take-photo.sh` command. If everything\
    \ works properly, the camera should take a single photo."
