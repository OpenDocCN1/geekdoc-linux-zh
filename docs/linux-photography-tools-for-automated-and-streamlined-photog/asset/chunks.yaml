  trans: "\n使用 Expose 没有任何这更简单了。在终端中，切换到包含你想发布的照片和视频的目录，然后运行 `expose` 命令。这将在 `_site`\
    \ 目录中生成一个完整的静态画廊。如果你想生成预览，请运行 `expose -d` 命令来创建一个包含低分辨率图像的画廊。但请记住，当你再次运行脚本时，Expose\
    \ 不会覆盖现有的图像，因此你需要删除 `_site` 目录以重新生成包含高分辨率照片的画廊。\n\n## 添加描述和设置\n\n为照片添加文本描述只需创建一个与照片同名的\
    \ `.txt` 文件，非常简单。例如，要为 `001_foo.jpeg` 照片添加描述，只需在同级目录下创建一个包含所需文本的 `001_foo.txt`\
    \ 文件。\n\n![](img/file29.jpg)\n\n在默认主题中，指定的描述将作为文本覆盖层出现在照片的底部。但这可能总是最优的文本放置位置。幸运的是，Expose\
    \ 允许通过在描述文件中指定 YAML 配置设置来定义文本位置和流向。你可以通过在描述文件的开头添加以下配置（所有值均以百分比表示），指定精确的文本位置以及文本框的宽高：\n\
    \n```\n---\ntop: 15\nleft: 5\nwidth: 25\nheight: 20\n---\n```\n\n在此示例中，`top: 15`\
    \ 和 `left: 5` 选项指示脚本将文本放在照片顶部边缘 15%、左边缘 5% 的位置。除了位置之外，你还可以使用 `textcolor` 设置指定文本颜色：\n\
    \n```\n---\ntop: 15\nleft: 5\nwidth: 25\nheight: 20\ntextcolor: #ffffff\n---\n\
    ```\n\n默认情况下，文本被放置在指定宽度和高度的矩形文本框中，但也可以使用 `polygon` 选项使文本绕形状流动。使用它，你可以通过 X 和 Y\
    \ 值指定多个点，从而将矩形框转换为多边形。以下是其实际工作原理。使用 `width` 选项指定文本框的宽度，例如：\n\n```\n---\nwidth:\
    \ 50\n---\n```\n\n框的每个角点的 X 和 Y 坐标如下：\n\n```\nx:0,y:0-------x100,y:0\n   |   \
    \          |\n   |             |\n   |             |\nx:100,y:100-----x:0,y:100\n\
    ```\n\n可以使用 JSON 格式的坐标列表通过 `polygon` 选项定义矩形：\n\n```\npolygon:[{\"x\":0, \"y\"\
    :0},{\"x\":100, \"y\":0},{\"x\":100, \"y\":100},{\"x\":0, \"y\":100}]\n```\n\n\
    了解此后，你可以调整每个角的坐标并引入带有特定坐标的额外点。例如，要为文本框右侧添加从左到右的斜坡，请如下所示调整右上角的 X 值：\n\n```\npolygon:[{\"\
    x\":0, \"y\":0},{\"x\":25, \"y\":0},{\"x\":100, \"y\":100},{\"x\":0, \"y\":100}]\n\
    ```\n\nExpose 使用 ImageMagick 处理所有的图像任务，你可以在描述文件中添加处理指令以进行即时图像调整。例如，如果你想为特定图像添加水印，请向其描述文件添加以下处理指令：\n\
    \n```\n---\nimage-options: /path/to/watermark.png -gravity SouthWest -geometry\
    \ +10+10 -composite\n---\n```\n\n这将使用 `watermark.png` 图像文件在图像右下角应用水印，距离边缘 10 像素边距。需要锐化照片吗？以下选项可以解决问题：\n\
    \n```\n---\nimage-options: -sharpen 0x1.5\n---\n```\n\n你可以使用 ImageMagick 支持的几乎任何选项，如果你想充分利用此功能，可能想要浏览[命令行选项页面](http://www.imagemagick.org/script/command-line-options.php)。\n\
    \n与其为单张照片指定选项，不如将其全局地应用于所有发布的图像。要做到这一点，请创建 `metadata.txt` 文件并在其中指定所需的选项。\n\n如果你拍摄延时摄影，你会高兴地发现\
    \ Expose 可以自动将它们编码为视频，无需手动操作。在包含延时图像的文件夹中添加 `imagesequence` 关键字（例如 `001 tokyo\
    \ nightscape imagesequence`），并将其放入你想发布的照片所在目录。然后运行 `expose` 命令，脚本就会将图像序列转换为视频。\n\
    \n## 结论\n\n尽管简单，Expose 还是一个生成静态照片和视频画廊的相当强大且灵活的工具。它让你对发布过程有完全控制，并允许你配置广泛的选项。更重要的是，Expose\
    \ 生成的画廊和文章看起来非常出色且于导航。\n\n# 展示照片的简单 PHP 脚本\n\n一个简单的 PHP 脚本、[Parsedown](https://github.com/erusev/parsedown)\
    \ PHP 库和 [Sakura](https://github.com/oxalorg/sakura) 极简 CSS 框架，就是你创建一个展示照片的简单样式页面所需的所有内容。脚本会从指定目录随机选择一张照片，提取其\
    \ EXIF 元数据，并生成一个包含介绍文本、照片以及刷新按钮的 HTML 页面。\n"
- fmt: "\nThe script and all the required components are available in the [Boketto](https://gitlab.com/dmpop/boketto)\
    \ GitLab repository. You can either clone it using the `git clone https://gitlab.com/dmpop/hanabi.git`\
    \ command or downloading the source code as a ZIP package. Replace the `favicon.png`\
    \ file, add an `*.md` file if desired, and change the default values in the `index.php`\
    \ file. Upload then the `index.php`, `parsedown.php`, `favicon.png`, and the `*.md`\
    \ files to the desired location in the document root of your web server.\n\nNext,\
    \ create a directory on the server for storing photos. Before you add photos to\
    \ this directory, it’s a good idea to reduce their size. This will make your app\
    \ run faster and reduce the amount of data that needs to be transferred. You can\
    \ use the [jpeg-recompress](https://github.com/danielgtaylor/jpeg-archive) and\
    \ `mogrify` tools to do this. With these two tools installed on your system, use\
    \ the following command to recompress or resize all `*.jpg` files in the current\
    \ directory:\n\n```\nfor file in *.jpg; do jpeg-recompress --quality high $file\
    \ $file; done\nmogrify -resize \"1600>\" *.jpg\n```\n\nWhile this simple solution\
    \ won’t replace a proper gallery or portfolio, it can come in handy when you want\
    \ to set up a no-frills page featuring your photos. Better still, you can easily\
    \ put the script to other uses. For example, if you already have a website, you\
    \ can embed the script into pages to display random photos.\n\n```php\n<?php\n\
    $dir = \"path/to/dir\";\n$ext = \"jpg\";\n\n$files = glob($dir.'.''.$ext);\n$file\
    \ = array_rand($files);\n$img = $files[$file];\n\n$exif = exif_read_data($img,\
    \ 0, true);\n$caption = $exif['COMMENT']['0'];\n\necho <<< EOT\n            <img\
    \ src=\"$img\" />\n            <p>$caption</p>\nEOT;\n?>\n```\n\nInsert the code\
    \ above in a page where you want the image to appear, and make sure that the page\
    \ itself has the `*.php` file extension. That’s all there is to it.\n\n# Show\
    \ your photos in a new browser tab\n\nThe new tab area in your browser can be\
    \ put to a variety of practical uses: from displaying time zone to taking notes\
    \ and managing daily tasks. It’s also possible to configure the new tab to showcase\
    \ your photos. To do this, you need three things: 1) a folder with photos on a\
    \ web server, 2) a simple PHP script, 3) the New Tab Override extension for Firefox\
    \ or the Change New Tab extension for Chrome and Chromium.\n\nBefore you upload\
    \ the desired photos to a folder on your web server, it’s a good idea to resize\
    \ them to make them load quickly. If you have ImageMagick installed on your system,\
    \ switch to the local directory containing the photos and run the command below\
    \ (if needed, adjust the file extension, resize, and quality values):\n\n```\n\
    for file in *.jpg; do mogrify -resize \"1200>\" -quality 95% $file; done\n```\n\
    \nKeep in mind that this command replaces the original images with the processed\
    \ ones. If you don’t want that, use the following command which saves the resized\
    \ images with the `*.JPG` file extension:\n\n```\nfor file in *.jpg; do convert\
    \ -resize \"1200>\" -quality 95% $file \"`basename $file .jpg`.JPG\"; done\n```\n\
    \nUpload the resized images to a folder on the web server. Fetch then the PHP\
    \ script using the `wget -O newtab.php https://gitlab.com/snippets/1832587/raw`\
    \ command. Open the downloaded `netab.php` file for editing, and make sure that\
    \ the value of the `$ext` variable matches the file extension of the photos. Move\
    \ the script to the folder on the web server containing the resized photos.\n\n\
    Install the [New Tab Override](https://addons.mozilla.org/firefox/addon/new-tab-override/)\
    \ extension, open the extension’s preferences page and specify the URL of the\
    \ PHP script in the corresponding field. If you happen to use Chrome or Chromium,\
    \ install the [Change New Tab](https://chrome.google.com/webstore/detail/change-new-tab/mocklpfdimiadpbgamlgehpgpodggahe/)\
    \ extension, and specify the URL when prompted.\n\nWhen you’re done, open a new\
    \ tab, and you should see a random photo.\n\n# WIRC: Wi-Fi infrared remote control\
    \ for Sony Alpha cameras\n\nThe IR port is probably not the most exciting feature\
    \ of a Sony Alpha camera. In fact, you’ll be forgiven for wondering why Sony keeps\
    \ this seemingly obsolete piece of technology around. Because it’s cheap, simple\
    \ and reliable. It’s also surprisingly versatile, as it allows you to control\
    \ practically every physical button of your camera. Unfortunately, the inexpensive\
    \ IR remote controls you find on the web don’t do the IR port any justice. Most\
    \ of them allow you to trigger the camera’s shutter, trigger a timer, lock it\
    \ in the bulb mode. Some advanced models also feature intervalometers, but that’s\
    \ about it.\n\n![](media/file31.jpg)\n\nSo if you want to unleash the true potential\
    \ of the IR port, you should go the DIY route. It’s both educational and fun.\
    \ And it’s probably cheaper too. Not to mention that the final result beats any\
    \ commercially available IR remote control. The DIY IR remote control described\
    \ below features its own web-based interface and it can be controlled via a wireless\
    \ connection using any device with a web browser. This may seem like a bad case\
    \ of over-engineering, but this solution does have some redeeming qualities:\n\
    \n*   It doesn’t require any proprietary apps installed on your camera or mobile\
    \ device\n*   You can use any device with a browser to control the camera\n* \
    \  It is possible to adapt the IR remote control for use with camera models from\
    \ other manufacturers\n\nTo build the IR remote control, you need the following\
    \ components:\n\n*   ESP8266 NodeMCU board or Wemos D1 mini\n*   Breadboard\n\
    *   1x 150Ohm resistor\n*   IR LED (940nm)\n*   Wires\n\nWhile you can use practically\
    \ any ESP8266-based board, a Wemos D1 mini module makes an ideal candidate for\
    \ the project thanks to its diminutive size. You also need a regular Linux machine\
    \ to write and compile code and upload it to the board.\n\nThe first order of\
    \ business is to install the required tools on your Linux machine and connect\
    \ the board to it. While you can use the popular Arduino IDE to work with code\
    \ and push it to the board, [Arduino CLI](https://github.com/arduino/arduino-cli)\
    \ is a perfectly adequate command-line tool for this project. Grab the latest\
    \ release for your platform from the GitHub page, and extract the downloaded archive.\
    \ In the terminal, switch to the resulting directory and install the executable\
    \ binary using the following commands:\n\n```\nsudo cp arduino-cli /usr/local/bin/arduino-cli\n\
    sudo chown root:root /usr/local/bin/arduino-cli\nsudo chmod 755 /usr/local/bin/arduino-cli\n\
    ```\n\nNext, connect the board to the machine, and run the `sudo chmod 666 /dev/ttyUSB0`\
    \ command to enable access to it. To make the access permanent, use the following\
    \ command:\n\n```\nsudo usermod -a -G dialout $USER\n```\n\nTo detect the connected\
    \ board, run the `arduino-cli board list` command. If the board has been detected,\
    \ you should see the following output.\n\n```\nFQBN    Port            ID    \
    \          Board Name \n        /dev/ttyUSB0    1a86:7523       unknown \n```\n\
    \nDisconnect the board and wire all the components as shown on the diagram below.\n\
    \n![](media/file32.png)\n\nNow clone the [WIRC](https://gitlab.com/dmpop/wirc)\
    \ project that contains the code using the `git clone git@gitlab.com:dmpop/wirc.git`\
    \ command. Alternatively, download the latest archive from the project’s GitLab\
    \ page. In the terminal, switch to the resulting directory and run the following\
    \ command to compile the code:\n\n```\narduino-cli compile --fqbn esp8266:esp8266:d1\n\
    ```\n\nThis creates two files in the directory: `wirc.esp8266.esp8266.d1.elf`\
    \ and `wirc.esp8266.esp8266.d1.bin`. To install and upload the compiled code to\
    \ the board, connect the board to the machine and run the following command:\n\
    \n```\narduino-cli upload -p /dev/ttyUSB0 --fqbn esp8266:esp8266:d1\n```\n"
