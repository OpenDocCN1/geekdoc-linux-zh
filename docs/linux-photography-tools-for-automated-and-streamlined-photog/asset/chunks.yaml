    # Plan photo travels with Simple Photo Planner


    [Simple Photo Planner](https://gitlab.com/dmpop/sphp) (SPHP) is exactly that:
    a no-frills PHP tool that can be used to keep track of locations you plan to visit
    and photograph. It pulls data stored in the comma-separated format from a text
    file and renders it as an HTML page with a table.


    ![](media/file38.png)


    SPHP requires no installation. Clone the project’s GitLab repository using the
    `git clone https://gitlab.com/dmpop/sphp.git` command, or download the source
    code directly from the project’s page, and you are good to go. To run SPHP on
    your local machine, you need to install PHP. To do this on openSUSE, run the `sudo
    zypper in php7` command. Use the `sudo apt-get install php7.2` command to install
    PHP on Ubuntu. In the Terminal, switch to the `sphp` directory, and run the `php
    -S localhost:8000` command. Point then the browser to the `localhost:8000` address
    to access SPHP.


    You can add new entries to the list and modify the existing ones by editing the
    accompanying `data.csv` file in any text editor or spreadsheet application. You
    can specify three values for each entry: location (the name of the place), map
    link (shows the location on OpenStreetMap or Google Maps), and note.


    Creating a map link in OpenStreetMap requires a few simple steps.


    1. Point your browser to [https://www.openstreetmap.org/](www.openstreetmap.org).

    2. Use the search box to find the desired place. Alternatively, use the mouse
    to find the place on the map.

    3. Click **Share** in the right-side toolbar to expand the **Share** palette.
    Enable the **Include marker** option, and switch to the **Short Link** section.

    4. If necessary, use the mouse to drag the marker to the exact location on the
    map.

    5. Copy the generated short link.


    Generating a map link in Google Maps is equally simple. Use the search functionality
    to locate the desired place on the map, then use the **Share** option to generate
    a short link.


    While SPHP may not be the most sophisticated PHP tool out there, it does have
    a few useful features. You can view the current weather conditions and forecast
    for the specific place by clicking on it. It’s possible to order by clicking the
    **Location** and **Note** column headers, and you can edit the data using the
    **Edit** button.


    Since SPHP is just a PHP script, you can run it on a web server with PHP, so you
    can use the application from anywhere. Move the `sphp` folder into the document
    root of your server and point your browser to `http://127.0.0.1/sphp` (replace
    `127.0.0.1` with the actual domain name or IP address of the server).


    ## Protect Simple Photo Planner with a password


    If you choose to run SPHP on a public web server, anyone can see and edit your
    data, which is probably not what you want. The solution is to protect your SPHP
    instance with a user name and password. On the Apache web server, this can be
    done using the `.htpasswd` and `.htaccess` files.


    The `.htpasswd` file is a plain text file containing a list of user names and
    passwords. There are several ways to generate the file. If you have PHP installed
    on your system, you can use a simple PHP script for that:


    ```php

    <?php

    $password = crypt($argv[2], base64_encode($argv[2]));

    echo $argv[1].":".$password;

    ?>

    ```


    Paste the code above into a new text file and save it under the `htpasswd.php`
    name. Run the `php htpasswd.php user password >> htpasswd` command, replacing
    `user` and `password` with the actual user name and password. Move the generated
    `htpasswd` file to the server, and make the file invisible by renaming it to `.htpasswd`.


    Create a new text file, and paste the following code into it (replace `/path/to/`
    with the actual absolute path to the `.htpasswd` file):


    ```

    AuthType Basic

    AuthName "Simple Photo Planner"

    AuthUserFile /path/to/.htpasswd

    require valid-user

    ```


    Save the file under the `htaccess` name, move it into the `sphp` directory on
    the server, and make the file invisible by renaming it to `.htaccess`.


    # Follow photographers on Instagram without an account


    Love it or hate it, plenty of great photographers use Instagram to share their
    photos. But like many other services, Instagram calls itself a sharing social
    platform, when in reality it’s just another walled garden that forces you to create
    an account and use their app. But it is entirely possible to follow your favorite
    photographers on Instagram without joining the service, courtesy of [RSS-Bridge](https://github.com/RSS-Bridge/rss-bridge).
    As the name suggests, this nifty PHP-based web application can generate RSS feeds
    for services and platforms that lack this functionality. Using RSS-Bridge, you
    can create RSS feeds for each Instagram account you want to follow, and then use
    any RSS reader to subscribe to the generated RSS feed. Better still, RSS-Bridge
    is supremely easy to install and use, so it doesn’t introduce any complexity or
    inconvenience. In fact, following your favorite photographers outside Instagram
    has its advantages. There are no distracting ads, no algorithms deciding what
    to show you.


    Since RSS-Bridge is written in PHP, it will happily run on any server that has
    PHP. Deploying the application is not particularly complicated. Use `git clone
    https://github.com/RSS-Bridge/rss-bridge.git` command to clone the repository.
    Alternatively, use the **Download ZIP** button to grab the source code and unpack
    the resulting directory (e.g., `rss-bridge`) if necessary. Point your browser
    to the installed instance (`http://127.0.0.1/rss-bridge`, where `127.0.0.1` is
    the domain name or IP address of the server). Scroll down to the **Instagram**
    section and click **Show more**. Enter the desired user name into the appropriate
    field and press the **Atom** button. Add the generated Atom feed to your favorite
    reader.


    ![](media/file39.png)


    In addition to generating RSS feeds in the Atom and MRSS formats, RSS-Bridge can
    render the fetched data as an HTML page. This can come in useful if you need to
    quickly check an Instagram account without using a dedicated reader.


    RSS-Bridge supports other photo sharing services, such as Flickr, NASA Astronomy
    Picture of the Day, and Unsplash. However, they are disabled by default. To enable
    the desired bridge, open the `whitelist.txt` file in the `rss-bridge` directory,
    add the name of the bridge (e.g., `FlickrBridge`), and save the changes.


