- fmt: "\n```php\n<?php\n$url = \"http://127.0.0.1/mejiro\";\n$photos = \"photos\"\
    ;\n$thumbnails = \"thumbnails\";\nfunction gps($coordinate, $hemisphere) {\n \
    \   for ($i = 0; $i < 3; $i++) {\n        $part = explode('/', $coordinate[$i]);\n\
    \        if (count($part) == 1) {\n            $coordinate[$i] = $part[0];\n \
    \       } else if (count($part) == 2) {\n            $coordinate[$i] = floatval($part[0])/floatval($part[1]);\n\
    \        } else {\n            $coordinate[$i] = 0;\n        }\n    }\n    list($degrees,\
    \ $minutes, $seconds) = $coordinate;\n    $sign = ($hemisphere == 'W' || $hemisphere\
    \ == 'S') ? -1 : 1;\n    return $sign * ($degrees + $minutes/60 + $seconds/3600);\n\
    }\n$files = glob($photos.DIRECTORY_SEPARATOR.'*.{jpg,jpeg,JPG,JPEG}', GLOB_BRACE);\n\
    $fileCount = count($files);\necho \"lat,lon,thumbnail,photo\\n\";\nfor ($i=($fileCount-1);\
    \ $i>=0; $i--) {\n    $file = $files[$i];\n    $photo_url = $url.DIRECTORY_SEPARATOR.$photos.DIRECTORY_SEPARATOR.basename($file);\n\
    \    $photo_url = preg_replace('/\\s+/', '%20', $photo_url);\n    $thumbnail_url\
    \ = $url.DIRECTORY_SEPARATOR.$photos.DIRECTORY_SEPARATOR.$thumbnails.DIRECTORY_SEPARATOR.basename($file);\n\
    \    $filepath = pathinfo($file);\n    $exif = exif_read_data($file);\n    $lat\
    \ = gps($exif[\"GPSLatitude\"], $exif['GPSLatitudeRef']);\n    $lon = gps($exif[\"\
    GPSLongitude\"], $exif['GPSLongitudeRef']);\n    $exif = exif_read_data($file,\
    \ 0, true);\n    echo $lat.\",\".$lon.\",\".$thumbnail_url.\",\".$photo_url.\"\
    \\n\";\n}\n?>\n```\n\nThe script goes through each photo in the specified directory\
    \ and pulls the photo’s geographical coordinates, its full path, and the path\
    \ to the related thumbnail. The script then outputs the obtained data in the comma-separated\
    \ format.\n\n![](media/file27.jpg)\n\nCopy the code, and paste it into a new text\
    \ file. Specify the correct values for the `url`, `photos` and `$thumbnails` variables,\
    \ and save the script under the `csv.php` name. Move the resulting file to the\
    \ root of your photo sharing app installation. To see whether the script works\
    \ properly, point your browser to `http://127.0.0.1/photos/csv.php` (replace `127.0.0.1`\
    \ and `photos` with the actual server IP address or domain name and directory\
    \ containing photos). You should see output that looks something like this:\n\n\
    ```\nlat,lon,thumbnail,photo 49.477116899982,10.988667,http://dmpop.dhcp.io/mejiro/photos/tims/20170506-155800.jpeg,http://dmpop.dhcp.io/mejiro/photos/20170506-155800.jpeg\n\
    ```\n\nNext, sign in to uMap and click the **Create a map** button to create a\
    \ new map. In the right panel, click **Manage layers**. Click the **Edit** button\
    \ next to the default layer, and give it a descriptive name. Expand the **Remote\
    \ data** section, enter the URL to the PHP script in the **Url** field, and choose\
    \ `csv` from the **Format** drop-down list. Enable the **Dynamic** and **Proxy\
    \ request** options. Expand then the **Interaction options** section, and enter\
    \ the following into the **Popup content template** field:\n\n```\n{{{thumbnail}}}\n\
    Source: {photo}\n```\n\nSave and reload the map, and.\n"
