    gThumb offers basic import functionality that makes it possible to offload files
    from external storage devices and pull photos from popular services like Flickr
    and Facebook. To do the latter, press on the hamburger menu in the upper-right
    corner of gThumb’s window and select the desired service from the **Import From**
    menu. Authenticate gThumb with the service, pick the photos you want, and the
    application imports them into the currently opened directory. You can use the
    **Removable Device** and **Folder** commands in the **Import From** menu to import
    photos from external storage devices (SD cards, USB keys, etc.) and local directories.'
