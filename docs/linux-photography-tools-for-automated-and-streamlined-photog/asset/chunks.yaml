- fmt: "\nWait then for the script to finish. You’ll find the transferred photos and\
    \ RAW files geotagged, renamed, and neatly organized in folders by date in the\
    \ target directory.\n\nTo update Otto, switch to the `otto` directory, and run\
    \ the `git pull` command.\n\nSince Otto is just a regular Bash shell script, it\
    \ will happily run on any NAS device that supports Entware as well as any Linux-based\
    \ machine. For example, installing Otto on openSUSE is a matter of running the\
    \ following commands:\n\n```\nsudo zypper in bc jq curl ImageMagick gpsbabel\n\
    git clone https://gitlab.com/dmpop/otto.git\ncd otto\nsudo cp otto.sh /usr/local/bin/otto\n\
    sudo chown root:root /usr/local/bin/otto\nsudo chmod 755 /usr/local/bin/otto\n\
    ```\n\n## Geotag and geocorrelate photos with Otto\n\nIf the photos are geotagged,\
    \ Otto writes useful information, such as camera model and lens into the `Comment`\
    \ field of the EXIF metadata. Better still, if your camera doesn’t support geotagging,\
    \ the script offers two ways to geotag photos and RAW files on the fly. Add the\
    \ `-g` switch followed by the city where the photos were taken, and the script\
    \ automatically obtains the city’s coordinates and uses them for geotagging:\n\
    \n```\notto.sh -d /path/to/photo/dir -g Tokyo\n```\n\nOtto also makes it possible\
    \ to geocorrelate photos and RAW files using a GPX file. This can come in handy\
    \ when you use an app like [GPS Logger for Android](https://github.com/mendhak/gpslogger)\
    \ to track your movements and save them as GPX files.\n\nTo geocorrelate photos\
    \ and RAW files when transferring them, put one or several GPX files into a directory\
    \ and use the `-c` switch followed by the path to the directory:\n\n```\notto.sh\
    \ -d /path/to/photo/dir -c /path/to/gpx/dir\n```\n\n# Geotag photos with Geophotobash\n\
    \nOnce photos and RAW files have been imported, you might want to geotag them.\
    \ And the [Geophotobash](https://gitlab.com/dmpop/geophotobash) Bash shell script\
    \ can help you with that.\n\n## Deploy Geophotobash\n\nTo install Geophotobash\
    \ on Debian and Ubuntu, run the following commands:\n\n```\nsudo apt install git-core\
    \ curl bc jq libimage-exiftool-perl\ngit clone https://gitlab.com/dmpop/geophotobash.git\n\
    cd geophotobash\nsudo cp geophotobash.sh /usr/local/bin/geophotobash\nsudo chown\
    \ root:root /usr/local/bin/geophotobash\nsudo chmod 755 /usr/local/bin/geophotobash\n\
    ```\n\nTo do the same on openSUSE, replace the `sudo apt install git-core curl\
    \ bc jq libimage-exiftool-perl` command with `sudo zypper in git-core curl bc\
    \ jq exiftool`.\n\nTo make sure that the script has been installed, run the `geophotobash\
    \ -h` command, and you should see brief usage info.\n\n## How Geophotobash works\n\
    \nThe `geophotobash.sh` script performs the following actions:\n\n* Obtains the\
    \ latitude and longitude for the specified city using the [Photon](http://photon.komoot.de/)\
    \ service\n* Geotags photos in the current directory using the retrieved geographical\
    \ coordinates\n* Renames photos using their date and time from EXIF metadata\n\
    * Organizes the photos in folders by city, and date\n* Assigns the specified city\
    \ as a keyword to each photo\n\nHere is how this works. Say, you have a folder\
    \ with photos taken in Berlin with file names like `DSC00895.ARW`, `DSC00895.JPG`,\
    \ `DSC00896.ARW`, `DSC00896.JPG`, `DSC00897.ARW`, `DSC00897.JPG`, etc. Run the\
    \ `geophotobash -g Berlin` command. The result will be the following directory\
    \ tree containing renamed and geotagged photos organized into folders by date:\n\
    \n```\nBerlin\n  2016-05-01\n    20160501-135557.ARW\n    20160501-135557.JPG\n\
    \  2016-05-02\n    20160502-190510.ARW\n    20160502-190510.JPG\n  2016-05-03\n\
    \    20160503-151535.ARW\n    20160503-151535.JPG\n```\n\n# Organize and manage\
    \ photos with ExifTool\n\nIf you need to process hundreds, or even thousands,\
    \ of photos on a regular basis, using ExifTool for the job can save you a lot\
    \ of time and effort. Even if you need to modify a handful of photos, doing this\
    \ with ExifTool can be more efficient than resorting to your preferred photo management\
    \ application.\n\n## Install ExifTool\n\nInstalling ExifTool is a matter of running\
    \ the `sudo apt install libimage-exiftool-perl` command on Debian and Ubuntu or\
    \ `sudo zypper in exiftool` on openSUSE.\n\n## Simple ExifTool commands\n\nDespite\
    \ its name, ExifTool can handle metadata stored in these formats. When you need\
    \ to read or modify a specific tag in metadata, you occasionally need to know\
    \ the actual name of the tag (as opposed to the human-friendly format used by\
    \ default) and the group it belongs to. The easiest way to find that out is to\
    \ use the `exiftool` command with the `-s` and `-G` switches. The former shows\
    \ the actual tag names, while the latter lists all tags by groups. Run the `exiftool\
    \ -s -G /path/to/foo.jpg` command, and you should see a list of tags organized\
    \ into groups.\n\n## Rename and organize photos using metadata\n\nBesides merely\
    \ reading metadata, ExifTool can perform other useful actions. For example, the\
    \ tool can read the photo’s creation date and time and then use the obtained values\
    \ to rename the file. The following command renames the `foo.NEF` RAW file in\
    \ the current directory using the `YYYYMMDD-HHMMSS.NEF` format (e.g., `19730915-153500.NEF`):\n\
    \n```\nexiftool -d %Y%m%d-%H%M%S.%%e '-FileName<DateTimeOriginal' /path/to/foo.NEF\n\
    ```\n\nThe command consists of three parts. The `-d` switch sets the format for\
    \ date and time values, and the rule right after the switch defines the format\
    \ itself (`%%e` keeps the original file extension). The `'-FileName<DateTimeOriginal'`\
    \ part instructs ExifTool to obtain the creation date and time and use these values\
    \ as file name. The last part of the command specifies the path to the file.\n\
    \nYou can use the path to a folder instead of a single file to run the command\
    \ on all files in the target directory (replace *DIR* with the actual path to\
    \ the target directory).\n"
  raw: "Wait then for the script to finish. You’ll find the transferred photos and\
    \ RAW files geotagged, renamed, and neatly organized in folders by date in the\
    \ target directory.\n\nTo update Otto, switch to the *otto* directory, and run\
    \ the `git pull` command.\n\nSince Otto is just a regular Bash shell script, it\
    \ will happily run on any NAS device that supports Entware as well as any Linux-based\
    \ machine. For example, installing Otto on openSUSE is a matter of running the\
    \ following commands:\n\n```\nsudo zypper in bc jq curl ImageMagick gpsbabel\n\
    git clone https://gitlab.com/dmpop/otto.git\ncd otto\nsudo cp otto.sh /usr/local/bin/otto\n\
    sudo chown root:root /usr/local/bin/otto\nsudo chmod 755 /usr/local/bin/otto\n\
    ```\n\n## Geotag and geocorrelate photos with Otto\n\nIf the photos are geotagged,\
    \ Otto writes useful information, such as camera model and lens into the **Comment**\
    \ field of the EXIF metadata. Better still, if your camera doesn’t support geotagging,\
    \ the script offers two ways to geotag photos and RAW files on the fly. Add the\
    \ `-g` switch followed by the city where the photos were taken, and the script\
    \ automatically obtains the city’s coordinates and uses them for geotagging:\n\
    \n```\notto.sh -d /path/to/photo/dir -g Tokyo\n```\n\nOtto also makes it possible\
    \ to geocorrelate photos and RAW files using a GPX file. This can come in handy\
    \ when you use an app like [GPS Logger for Android](https://github.com/mendhak/gpslogger)\
    \ to track your movements and save them as GPX files.\n\nTo geocorrelate photos\
    \ and RAW files when transferring them, put one or several GPX files into a directory\
    \ and use the `-c` switch followed by the path to the directory:\n\n```\notto.sh\
    \ -d /path/to/photo/dir -c /path/to/gpx/dir\n```\n\n# Geotag photos with Geophotobash\n\
    \nOnce photos and RAW files have been imported, you might want to geotag them.\
    \ And the [Geophotobash](https://gitlab.com/dmpop/geophotobash) Bash shell script\
    \ can help you with that.\n\n## Deploy Geophotobash\n\nTo install Geophotobash\
    \ on Debian and Ubuntu, run the following commands:\n\n```\nsudo apt install git-core\
    \ curl bc jq libimage-exiftool-perl\ngit clone https://gitlab.com/dmpop/geophotobash.git\n\
    cd geophotobash\nsudo cp geophotobash.sh /usr/local/bin/geophotobash\nsudo chown\
    \ root:root /usr/local/bin/geophotobash\nsudo chmod 755 /usr/local/bin/geophotobash\n\
    ```\n\nTo do the same on openSUSE, replace the `sudo apt install git-core curl\
    \ bc jq libimage-exiftool-perl` command with `sudo zypper in git-core curl bc\
    \ jq exiftool`.\n\nTo make sure that the script has been installed, run the `geophotobash\
    \ -h` command, and you should see brief usage info.\n\n## How Geophotobash works\n\
    \nThe *geophotobash.sh* script performs the following actions:\n\n*   Obtains\
    \ the latitude and longitude for the specified city using the [Photon](http://photon.komoot.de/)\
    \ service\n\n*   Geotags photos in the current directory using the retrieved geographical\
    \ coordinates\n\n*   Renames photos using their date and time from EXIF metadata\n\
    \n*   Organizes the photos in folders by city, and date\n\n*   Assigns the specified\
    \ city as a keyword to each photo\n\nHere is how this works. Say, you have a folder\
    \ with photos taken in Berlin with file names like *DSC00895.ARW*, *DSC00895.JPG*,\
    \ *DSC00896.ARW*, *DSC00896.JPG*, *DSC00897.ARW*, *DSC00897.JPG*, etc. Run the\
    \ `geophotobash -g Berlin` command. The result will be the following directory\
    \ tree containing renamed and geotagged photos organized into folders by date:\n\
    \n```\nBerlin\n  2016-05-01\n    20160501-135557.ARW\n    20160501-135557.JPG\n\
    \  2016-05-02\n    20160502-190510.ARW\n    20160502-190510\\. JPG\n  2016-05-03\n\
    \    20160503-151535.ARW\n    20160503-151535\\. JPG\n```\n\n# Organize and manage\
    \ photos with ExifTool\n\nIf you need to process hundreds, or even thousands,\
    \ of photos on a regular basis, using ExifTool for the job can save you a lot\
    \ of time and effort. Even if you need to modify a handful of photos, doing this\
    \ with ExifTool can be more efficient than resorting to your preferred photo management\
    \ application.\n\n## Install ExifTool\n\nInstalling ExifTool is a matter of running\
    \ the `sudo apt install libimage-exiftool-perl` command on Debian and Ubuntu or\
    \ `sudo zypper in exiftool` on openSUSE. ExifTool in the official software repositories\
    \ is often several versions behind the current release. And if you want to use\
    \ the most recent version of ExifTool, you have to compile it from the source\
    \ code. Fortunately, this is a rather straightforward thing to do. Grab the latest\
    \ ExifTool source code from the project’s website, and use the `tar xzvf Image-ExifTool-#.##.tar.gz`\
    \ command to extract the downloaded archive. Switch to the resulting directory,\
    \ and run the `perl Makefile.PL` command. To test whether ExifTool can work properly\
    \ on your system, issue the `make test` command. If everything works as it is\
    \ supposed to, you should see the *PASS* message at the end of the test output.\
    \ Run then the `make install` command as root to perform the installation.\n\n\
    By default, ExifTool is installed in the */usr/local/bin/* directory. If this\
    \ path is not in the PATH environment variable, you need to add it manually. To\
    \ do this, open the terminal and run the `echo \"PATH=\\$PATH:/usr/local/bin\"\
    \ >> ~/.bashrc` command.\n\nOnce ExifTool has been compiled and installed, run\
    \ the `exiftool -ver` command to verify that the you have the latest version of\
    \ the tool on your system.\n\n## Simple ExifTool commands\n\nTo get started with\
    \ ExifTool, run the `exiftool /path/to/foo.jpg` command which generates a long\
    \ list of metadata tags and their values pulled from the source photo. Besides\
    \ JPEG, ExifTool can handle a wide range of other formats as well as RAW and video\
    \ files (the full list of supported formats is available on the project’s website).\n\
    \nMetadata included in a digital photo actually comes from several different groups,\
    \ including EXIF (Exchangeable image file format maintained by the Japanese Electronics\
    \ and Information Technology Industries Association), IPTC (standard developed\
    \ by the International Press Telecommunications Council for the purpose of data\
    \ exchange between newspapers and news agencies), MakerNote data (tags that allow\
    \ camera manufacturers to add custom metadata), XMP (metadata stored in the XMP\
    \ format originally created by Adobe Systems Inc.), and Composite (composite tags\
    \ derived from the values of other tags).\n\nDespite its name, ExifTool can handle\
    \ metadata stored in all these formats. When you need to read or modify a specific\
    \ tag in metadata, you occasionally need to know the actual name of the tag (as\
    \ opposed to the human-friendly format used by default) and the group it belongs\
    \ to. The easiest way to find that out is to use the `exiftool` command with the\
    \ `-s` and `-G` switches. The former shows the actual tag names, while the latter\
    \ lists all tags organized by groups. Run the `exiftool -s -G /path/to/foo.jpg`\
    \ command, and you should see a list of tags neatly organized into groups.\n\n\
    ## Rename and organize photos using metadata\n\nBesides merely reading metadata,\
    \ ExifTool can perform other useful actions. For example, the tool can read the\
    \ photo’s creation date and time and then use the obtained values to rename the\
    \ file. The following command renames the *foo.NEF* RAW file in the current directory\
    \ using the *YYYYMMDD-HHMMSS.NEF* format (e.g., *19730915-153500.NEF*):\n\n```\n\
    exiftool -d %Y%m%d-%H%M%S.%%e '-FileName<DateTimeOriginal' /path/to/foo.NEF\n\
    ```\n\nThe command consists of three parts. The *-d* switch sets the format for\
    \ date and time values, and the rule right after the switch defines the format\
    \ itself (`%%e` keeps the original file extension). The `'-FileName<DateTimeOriginal'`\
    \ part instructs ExifTool to obtain the creation date and time and use these values\
    \ as file name. The last part of the command specifies the path to the file.\n\
    \nYou can use the path to a folder instead of a single file to run the command\
    \ on all files in the target directory (replace *DIR* with the actual path to\
    \ the target directory):"
