  trans: "\n压缩 JPEG 图像是大多数摄影师都会尽量避免的。毕竟，JPEG 是一种有损格式，减小 JPEG 文件的大小不可避免地会导致质量损失。但在某些情况下，压缩图像是唯一的选择。例如，某些照片共享和打印服务不接受超过特定文件大小的。在将照片嵌入博客文章时，你可能想压缩它们以节省存储空间。\n\
    \n每当你需要优化 JPEG 文件时，[jpeg-recompress](https://github.com/danielgtaylor/jpeg-archive)\
    \ 都是完成任务的理想工具。`jpeg-recompress` 可以在保持感知视觉质量的同时将目标文件的大小缩小 30-70%。要安装 `jpeg-recompress`，请从\
    \ [github.com/danielgtaylor/jpeg-archive/releases](https://github.com/danielgtaylor/jpeg-archive/releases)\
    \ 下载最新发布。解压下载的包并使用 `chmod +x jpeg-recompress` 命令将 `jpeg-recompress` 二进制文件设置为可执行。然后将二进制文件移动到\
    \ `~/bin` 目录。\n\n`jpeg-recompress` 的用法非常简单。要使用默认设置（SSIM 比较法和中等质量）重新压缩 JPEG 文件，运行\
    \ `jpeg-recompress photo.jpg recompressed.jpg` 命令。也可以指定各种参数，你可以使用 `jpeg-recompress\
    \ -h` 命令列出这些参数及其简要描述。\n\n如果你经常使用 `jpeg-recompress` 工具，请将以下函数添加到 `~/.bashrc` 文件中：\n\
    \n```bash\nif [ -x \"$(command -v jpeg-recompress)\" ] ; then\n  function recompress()\
    \ {\n  jpeg-recompress --quality very high $1 re-$1\n  }\nfi\n```\n\n然后你就可以使用\
    \ `recompress photo.jpg` 命令重新压缩 JPEG 文件了。\n\n想要在图像添加到特定目录时自动重新压缩它们吗？下面的简单 Bash\
    \ 脚本可以帮你实现这一点：\n\n```bash\n#!/usr/bin/env bash\n\nhelp(){\ncat <<EOF\n$0 [OPTIONS]\n\
    \n$0 当 JPEG 文件移动到监控目录时，立即对其进行重压缩\n\nUsage:\n  $0 [IN] [OUT]\n\nOptions:\n IN \
    \   要监控的目录\nOUT    保存重压缩文件的目录\nEOF\n  exit 1\n}\n\nif [ -z \"$1\" ] || [ -z \"\
    $2\" ]; then\n  echo help\n  exit 1\nfi\n\nwhile true\ndo\ninotifywait -m --format\
    \ '%f' -e MOVED_TO $1 |\nwhile read FILE\n  do\n    jpeg-recompress $1/$FILE $2/$FILE\n\
    \    notify-send \"$FILE has been recompressed\"\n  done\ndone\n```\n\n该脚本使用 `inotify-tools`\
    \ 监控目录，并在图像进入该目录时立即触发 `jpeg-recompress` 命令处理图像。要在 openSUSE 上安装 `inotify-tools`，请运行\
    \ `sudo zypper in inotify-tools` 命令。脚本需要两个参数：监控目录的路径和目标目录的路径。注意，后者不能位于监控目录之内。\n\
    \n将上述代码粘贴到新文本文件中并保存为 `monitor-recompress`。然后使用以下命令安装脚本：\n\n```bash\nsudo cp monitor-recompress\
    \ /usr/local/bin/\nsudo chown root:root /usr/local/bin/monitor-recompress\nsudo\
    \ chmod 755 /usr/local/bin/monitor-recompress\n```\n\n然后使用 `monitor-recompress\
    \ /path/to/source/dir /path/to/target/dir` 命令运行脚本。\n\n# 使用 jpegoptim 压缩 JPEG 文件\n\
    \n需要用最少的努力减小 JPEG 文件的大小吗？使用 [jpegoptim](https://github.com/tjko/jpegoptim)。给 `jpegoptim`\
    \ 馈一个 JPEG 文件，这个不起眼的工具就会减小它的大小，无需多言。\n\n要安装最新版本的 `jpegoptim`，你需要从源码编译它。在在此之前，你需要在你的系统中安装\
    \ `libjpeg` 库。在 openSUSE 上，可以使用 `sudo zypper in libjpeg8-devel` 命令完成。完成后，运行以下命令克隆项目的\
    \ Git 仓库并安装 `jpegoptim`：\n\n```bash\ngit clone https://github.com/tjko/jpegoptim.git\n\
    cd jpegoptim\n./configure\nmake\nmake strip\nsudo make install\n```\n\n就这些了。要压缩\
    \ JPEG 文件，请运行 `jpegoptim foo.jpg` 命令（将 `foo.jp` 替换为 JPEG 文件的实际路径和名称）。\n\n默认情况下，`jpegoptim`\
    \ 使用无损压缩算法，但你可以通过使用 `--max` 参数指定最大图像质量来覆盖此设置。除了压缩文件外，`jpegoptim` 还可以移除元数据。例如，`--strip-exif`\
    \ 参数移除所有 EXIF 数据，而 `--strip-iptc` 参数移除 IPTC 数据。\n\n`jpegoptim` 还提供了其他选项，你可以使用\
    \ `man jpegoptim` 命令查看所有选项及其说明。\n\n# Linux 上的色彩管理\n\n色彩管理的目的是在不同设备上产生一致的色彩输出。这个定义听起来可能简单，但理解色彩管理的机制并实施色彩管理工作流可能是一个相当复杂且有时令人困惑的事务。以下描述可以帮助你理解色彩管理的基础知识，并使用开源工具建立色彩管理环境。\n\
    \n## 色彩管理概述\n\n色彩管理的需要源于色彩再现的基础问题：给定色彩的正式表示（例如特定色彩模型中的颜色值）由于各种因素，在不同设备上并不产生相同的颜色。因此，色彩管理的主要目标是实现跨设备的一致色彩还原。例如，色彩管理相机拍摄的照片在色彩管理的屏幕上看起来应该是相同的。\n\
    \n在色彩管理工作流中，每个设备（如数码相机和 LCD 显示器）都有自己的色彩配置文件，用于描述该特定设备的色彩响应。每个配置文件相对于一组标准色彩来描述这些颜色。色彩管理软件随后利用这些标准配置文件将色彩从一个设备转换为另一个。这通常由色彩管理模块完成([Cambridge\
    \ Colour 色彩管理概述](http://www.cambridgecolour.com/tutorials/color-management1.htm))\n\
    \n色彩配置文件与色彩空间的概念密切相关。色彩空间是一个定义的色彩范围，正如 Thom Hogan 所，“色彩空间定义了可能性。”([色彩管理快速指南](http://www.bythom.com/qadcolor.htm))另一种说法是色彩空间决定了设备或应用程序的色彩能力。色彩空间包含色彩定义，而色彩配置文件描述的是色彩输入或输出。\n\
    \n由于存在多种色彩空间，问题在于你应该选择哪一个。这个问题值得专门讨论，但简单的事实是 sRGB 色彩空间适用于通用场景。sRGB 专为互联网开发，相对于\
    \ Adobe RGB 较小，但它得到了制造商和开发者的广泛支持，并且是任何支持色彩管理的设备和应用程序的默认色彩空间。例如，digiKam 使用 sRGB\
    \ 作为其默认工作色彩空间（即用于处理色彩数据的色彩空间）。在选择色彩空间时，请考虑以下因素：1）sRGB 无法转换为像 Adobe RGB 更大的色彩空间（但反之可以），2）RAW\
    \ 文件没有分配色彩空间，因此如果你预计在工作流中使用不同的色彩空间，可以使用 RAW 原文件在所需的色彩空间中进行处理。\n"
- fmt: '

    Precise and consistent color management requires ICC-compliant profiles for all
    devices in your workflow (e.g., digital camera and LCD display). A color profile
    is “a set of data that characterizes a color input or output device” ([Wikipedia
    color profile definition](http://en.wikipedia.org/wiki/ICC_profile)). Again, Thom
    Hogan explains this best: “A Color Profile specifies how a device deviates from
    a Color Space. When we profile a monitor, printer, or sometimes a camera, we are
    essentially creating a map of how it differs from a Color Space definition. Savvy
    software can then use that map to "fix" the color when rendered on or by that
    device so that it matches the Color Space definitions." ([Thom’s Quick & Dirty
    Guide to Color Management](http://www.bythom.com/qadcolor.htm))


    ## Setting up a color-managed workflow with Darktable


    To illustrate how the color management theory works in practice, here is a real-world
    scenario: You use a digital camera to take photos as RAW files which you then
    process on a Linux machine using Darktable and view on an LCD display connected
    to the machine.


    The first step is to create color profiles for the camera and the display. To
    calibrate a monitor and generate a color profile for it on Linux, you need two
    things: a colorimeter and color profiling software. High-quality professional
    colorimeters tend to be rather expensive, but you can use the excellent low-cost
    [ColorHug](http://www.hughski.com) open source colorimeter instead.


    When it comes to calibration and profiling, [DisplayCAL](http://displaycal.net/)
    is the perfect tool for the job. It provides a graphical user interface to the
    display calibration and profiling tools of the ArgyllCMS open source color management
    system. The latter is available in the software repositories of most mainstream
    Linux distributions, so you can install it using your distro’s package manager.
    On Debian and Ubuntu-based distributions, this can be done by running the `sudo
    apt install argyll` command. Next, you need to install the ColorHug library and
    client software. This software is also available in Debian and Ubuntu repositories,
    so it can be installed using the `sudo apt libcolorhug2 colorhug-client` command.
    Download then the packaged version of DisplayCAL from the project’s website and
    install it on your system. Connect ColorHug, and it should blink briefly, indicating
    that it has been detected by the system. Before you start using ColorHug, make
    sure it has the latest version of firmware. Run the `colorhug-flash` command to
    launch the Firmware Updater utility and use it to check and upgrade ColorHug’s
    firmware.


    ![](media/file3.jpg)


    Now everything is ready to calibrate and profile the display. Launch DisplayCAL
    and press the **Detect** button to make DisplayCAL detect the connected colorimeter
    (it should appear in the **Instrument/Port** section). If you are using a multi-display
    setup, make sure that the correct monitor is selected in the **Display device**
    section. Select then `Photo (D50, Gamma 2.2)` from the **Settings** drop-down
    list. Press the **Calibrate & Profile** button and follow the instructions to
    calibrate the monitor and generate its color profile. Once the color profile has
    been generated, DisplayCAL prompts you to install the profile and enable it during
    boot. By the way, you can use DisplayCAL to install an existing ICC display profile,
    too. To do this, press the **Load Settings** button next to the **Settings** drop-down
    list, and select the existing `*.icc` file. Use then the **Install Profile** button
    to install the selected profile either globally or for the current user only.


    The process of calibrating a digital camera consists of several steps:


    1. Take a RAW shot of a color calibration target

    2. Process the RAW file in digiKam without any color adjustments and save the
    result as a 16-bit TIFF image

    3. Generate a color matrix with ArgyllCMS and use it to create an ICC profile


    First, you need to obtain a color calibration target. Like colorimeters, professional
    color targets are rather expensive. Fortunately, Wolfgang Faust offers low-cost
    [IT8-compliant color targets](http://www.targets.coloraid.de) for calibrating
    various devices, including digital cameras (you need the C1 target). Each target
    production run is unique, so each batch of color targets is identified by its
    charge number (e.g., `R131007`), and every calibration target is supplied with
    its own reference file (e.g., `R131007.txt`).


    The first step is to take a RAW shot of the color target using the camera you
    want to profile. This is actually trickier than it sounds, and the [How to Make
    a Camera Input Profile Target Shot](http://ninedegreesbelow.com/photography/camera-profile-make-target-shot.html)
    article offers valuable information on the subject. Once you have the shot, launch
    Darktable and import the RAW file. Disable the **base curve** module, crop the
    photo to remove the background, and save the result as a 16-bit TIFF file.


    ![](media/file4.jpg)


    To read the color patch values of the created TIFF file, use the following command
    (replace `DSC00001.tif` with the actual name of the TIFF file and `131007.txt`
    with the reference file):


    ```

    scanin -v -p -a -dipn DSC00001.tif /usr/share/color/argyll/ref/it8.cht R131007.txt

    ```


    Open the generated `diag.tif` file and make sure that all color patches have been
    indexed. Finally, generate a color profile, using the actual values instead of
    the default ones:


    ```

    colprof -v -A "SONY" -M "SONY NEX-3N" -D "sony nex-3n" -C "Copyright (c) 2016
    Dmitri Popov. Some rights reserved." -q l -a m -u DSC00001

    ```


    The final step is to add the created camera color profile to Darktable. To do
    this, move the generated `*.icc` file to the `~/.config/darktable/color/in/` folder
    (create the missing directories if they don’t exist). Launch the application and
    open a RAW file for editing. Enable then the **input color profile** module, and
    select the created camera profile in the **profile** drop-down list in the module’s
    pane.


    ## Manage and edit photos with gThumb


    Managing and editing photos and RAW files is a key step in a photographic workflow.
    While there are plenty of excellent and powerful tools available at your disposal,
    [gThumb](https://live.gnome.org/gthumb) can handle most management and editing
    tasks with a minimal overhead. It may look like a regular image viewer, but behind
    its unassuming appearance hides a rather capable application for retouching photos
    and keeping tabs on them. Since gThumb is available in the official software repository,
    you can install using the `sudo apt install gthumb` command.


    ![](media/file5.jpg)


    gThumb features a lightweight interface that puts all essential tools right at
    your fingertips. The directory tree in the left panel lets you easily traverse
    the file system and open folders containing photos. And the application features
    a couple of creature comforts that make directory navigation more efficient. When
    you launch gThumb, it automatically switches to the last-used directory. The application
    also keeps track of visited directories, and you can jump to any previously opened
    directory using the **History** button. You can also bookmark a specific directory
    using the **Add Bookmark** command under the **Bookmarks** button.


    gThumb offers basic import functionality that makes it possible to offload files
    from external storage devices and pull photos from popular services like Flickr
    and Facebook. To do the latter, press on the hamburger menu in the upper-right
    corner of gThumb’s window and select the desired service from the **Import From**
    menu. Authenticate gThumb with the service, pick the photos you want, and the
    application imports them into the currently opened directory. You can use the
    **Removable Device** and **Folder** commands in the **Import From** menu to import
    photos from external storage devices (SD cards, USB keys, etc.) and local directories.

