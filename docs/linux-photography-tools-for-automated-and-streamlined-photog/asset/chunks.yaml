  trans: "\n\n想在不使用专用 App 的情况下给照片添加特效吗？Termux 和 ImageMagick 也可以。后者支持 `Hald CLUT` 技术，这使得可以使用特殊的颜色查找表来执行色彩变换。要使用\
    \ `Hald CLUT`，你不需要理解其所有的细节，但需要做一些准备工作。在你的常规 Linux 机器上安装 ImageMagick，并运行 `convert\
    \ hald:9 hald-9.png` 命令来生成一个 `Hald CLUT` 表。然后，在 digiKam 等照片编辑应用中打开生成的 `hald-9.png`\
    \ 文件，应用所需的色彩校正（曲线、电平、饱和度、亮度等），并以描述性名称保存更改（例如 `hald-9-vintage.png`）。现在，你已经拥有了一个可以作为预设的参考\
    \ `Hald CLUT` 表。使用这种技术，你可以创建任意数量的预设。然后将它们移动到 Android 设备上 Termux 可以访问的文件夹中。要将所需的预设应用到照片，请使用以下命令：\n\
    \n```\nconvert foo.JPG hald-9-vintage.png -hald-clut foo-modified.jpeg\n```\n\n\
    # 在加密的外部存储设备上存储照片和 RAW 文件\n\n在 USB 硬盘等外部存储设备上备份你的照片和 RAW 文件是一个好主意。而对硬盘进行加密则是更好的主意。这样，除了你之外，没有人可以访问磁盘上的数据。\n\
    \n第一步是使用 `sudo lsblk` 命令识别连接的外部存储设备。查看输出，并记录外部存储设备的名称：\n\n```\nNAME   MAJ:MIN\
    \ RM   SIZE RO TYPE MOUNTPOINT\nsda      8:16   0 111.8G  0 disk \n├─sda1   8:17\
    \   0     2G  0 part [SWAP]\n└─sda2   8:18   0 109.8G  0 part /\nsdb      8:32\
    \   0 931.5G  0 disk\n```\n\n在这种情况下，它是 `/dev/sdb`。如果存储设备已经分区，输出将像如下所示：\n\n```\n\
    sdb      8:32   0 931.5G  0 disk \n└─sdb1   8:33   0 931.5G  0 part \n```\n\n\
    如有必要，你可以使用 `fdisk` 工具删除现有分区。运行 `sudo fdisk /dev/sdb1` 命令，选择 `d` 选项，输入 `1` 选择分区并按\
