    run the app, and note the unique token.


    Deploying Otto on the NAS is a matter of switching to the desired directory (e.g.,
    */share/homes/admin*) and cloning the project’s Git repository:


    ```

    git clone https://gitlab.com/dmpop/otto.git

    ```


