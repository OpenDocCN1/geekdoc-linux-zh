    digiKam 拥有一个相当强大的导入模块，使你可以将照片和 RAW 文件从相机传输到应用程序，并对其进行实时处理和组织。事实上，`Import`（导入）界面提供了一些巧妙的功能，允许你配置导入操作。在右侧栏
    `Settings`（设置）中的 `File Renaming Options`（文件重命名选项）部分，你可以定义自定义规则来重命名所有导入的照片。例如，你想使用从
    EXIF 元数据中提取的日期时间信息来重命名导入的照片。启用 `Customize`（自定义）选项并在 `Options` 下拉列表中选择 `Date &
    Time`（日期与时间）项。从 `Format` 字段旁的下拉列表中选择所需的日期时间格式。可用选项包括 Standard（标准）、`ISO`、`Text`（文本）、`UnixTimeStamp`
    和 `Custom`（自定义）。后者允许你指定自己的日期时间格式。例如，在 `Format` 字段中输入 `yyyyMMdd-hhmmss` 规则，按如下格式重命名照片：`19730917-175735`。


    ![](img/file14.jpg)


    `Auto-creation of Albums`（自动创建专辑）部分提供的选项在几种情况下会非常有用。如果你正在下载不同日期拍摄的照片，启用 `Date-based
    sub-albums`（基于日期的子专辑）选项并选择所需的日期格式。这将按日期将导入的照片组织到专辑中。`Extension-based sub-albums`（基于扩展名的子专辑）选项对于将不同格式的照片导入到单独的专辑很有。例如，如果你同时使用
    RAW 和 JPG 拍摄，可以启用 `Extension-based sub-albums` 选项，这样照片将根据文件扩展名导入到相应的文件夹中。最后，On
    the Fly Operations`（实时操作）部分允许你配置在导入过程中对照片执行的若干操作。除了其他，你还可以让 digiKam 自动旋转照片并转换为
    PNG 或 TIFF 等其他格式。


    ## 使用图像质量排序器排序照片


    这是一个听起来可能很熟悉的问题：你从一次旅行回来，带着数百甚至上千张照片，其中一些照片曝光不足、脱焦或噪点太多。手动剔除这些照片就像用勺子捞鱼。这就是 digiKam
    中的 `Image Quality Sorter`（图像质量排序器）工具大显身手的地方。要启用它，选择 `Settings → Configure digiKam`，切换到
    `Image Quality Sorter` 部分，并勾选 `Enable Image Quality Sorting`（启用图像质量排序）复选框。虽然你可以修改可用设置，但可能想先尝试默认值。创建一个包含高质量和低质量照片的独立专辑，然后使用默认值对它运行图像质量排序器。如有必要，再调整特定参数。图像质量排序器功能是
    `Maintenance`（维护）工具的一部分。要处理所有或所选专辑中的现有照片，选择 `Tools → Maintenance`，启用 `Image Quality
    Sorter` 选项并运行维护操作。随后，图像质量排序器将遍历照片并根据质量对其进行标记。


    ![](img/file15.jpg)


    ## 颜色标签和选取


    与任何其他良好的照片管理应用一样，digiKam 允许你为照片和 RAW 文件分配标签。除了标签之外，digiKam 还提供了 `Color Labels`（颜色标签）和
    `Picks`（选取）功能，这对于跟踪你的照片很有帮助。为单张照片添加颜色标签，右键点击它，选择 `Assign Labels → Color`（分配标签
    → 颜色），并选择所需的颜色。每个颜色标签都有自己的快捷键，因此你可以使用键盘快速标记照片。例如，要分配洋红色标签，按下 `Ctrl+Alt+6`。要快速从照片中快速移除颜色标签，按下
    `Ctrl+Alt+0`。`Picks` 功能的工作方式类似：你可以通过 `Assign Labels → Pick`（分配标签 → 选取）上下文菜单或使用默认快捷键，为
    digiKam 中的任何照片分配三种选取之一（`Pending` 等待、`Accepted` 已接受或 `Rejected` 已拒绝）。请记住，图像质量排序器工具使用选取来标记照片，因此为了避免混乱，在使用此工具时可能想避免使用选取。


    digiKam 提供了两种方法查找带有特定颜色标签或选取的照片。`Filters` 侧栏中的 `Labels Filter`（标签筛选）部分允许你通过颜色标签和选取过滤当前查看专辑中的照片。当你需要指定多个过滤标准时（例如，显示所有带有绿色和橙色颜色标签以及
    `Pending` 选取的照片），使用过滤功能会非常有用，但你一次只能查看一个专辑。


    ![](img/file16.jpg)


    如果你需要根据一或两个标准快速过滤照片，`Labels` 左侧边栏是更好的选择。侧边栏包含 digiKam 支持的所有标签列表，并按类型分组：评分、选取和颜色。选择所需的标签以查看所有匹配的照片。你可以通过按住
    `Ctrl` 键并用鼠标点击它们来选择多个标签。值得注意的是，`Labels` 左侧边栏中的快速过滤器应用于整个 digiKam 照片集合（这与 `Filters`
    右侧边栏中定义的过滤器不同，后者应用于当前选的专辑）。


    ## 在 digiKam 中为照片添加地理标记


    如果你的相机不支持地理标记，你可以使用 digiKam 轻松为照片添加地理坐标。在 digiKam 中，选择你想要添加地理标记的照片并选择 `Item →
    Edit Geolocation`（项目 → 编辑地理位置）。这会打开 `Geolocation Editor`（地理位置编辑器）界面，由三部分组成：地图窗格包含地图和一个带有多个导航工具的工具栏；地图窗格下方是所选照片列表；右侧侧边栏显示当前活动的部分。


    要为照片添加地理标记，你需要获取拍摄地点的地理坐标，地理位置编辑器提供了几种实现此方法。你可以使用鼠标在地图上移动。要为照片添加地理标记，如果你知道地点的完整或部分地址，可以使用内置搜索功能在地图上找到它。切换到
    `Search` 部分并在搜索字段中输入地址。点击 `Search` 按钮，你应该会看到带有标记的结果。


    ![](img/file17.jpg)


    为照片添加地理坐标的最简单方法是将它们拖到地图上的所需位置。或者，你可以将特定搜索结果的地理坐标分配给照片。选择列表中的照片，右键点击所需的搜索结果，并在上下文菜单中选择
    `Move selected images to this position`（将选移动移动到此位置）。一旦为照片分配了地理坐标，按下 `Apply`（应用）按钮写入地理标记。


    digiKam 还轻松查找地理标记照片。需要在日本拍摄的所有照片吗？你可以使用 `Map` 侧边栏，只要你的照片已添加地理标记。展开 `Map` 侧边栏，你应该看到地图上代表地理标记照片组的缩略图。每个缩略图都包含一个指示特定区域照片数量的计数器。点击地图工具栏上的
    `Pan Mode`（平模式）按钮使用鼠标控制地图。


    ![](img/file18.jpg)


    要查看缩略图代表的所有照片，按下从缩略图创建区域的按钮（`Search by area` 部分中的中间按钮）。使用 `Search by area` 部分中的区域选择按钮，你可以查看地图上手动选择区域的所有照片。要这样做，按下该按钮，然后在地图上的某处点击并在所需区域画一个矩形。


    digiKam 还允许你保存地图搜索。这样，每次需要查找特定区域的照片时，就不必执行相同的地图搜索。在地图下方的字段中为搜索输入名称并点击 `Save`（保存）按钮。这将搜索添加到
    `Map Searches` 部分，你可以随时点击它来激活保存的搜索。


