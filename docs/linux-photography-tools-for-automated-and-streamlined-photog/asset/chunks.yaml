    command:


    ```

    pkg install nano rsync openssh git curl wget

    ```


    To configure storage access, run the `termux-setup-storage` command. Doing this
    grants Termux permission to access shared storage on Android 6.0 and higher as
    well as creates the dedicated *storage* folder containing symbolic links to various
    storage locations. This includes *~/storage/shared* (the root folder shared by
    all apps), *~/storage/dcim* (the standard folder for photos and videos), and *~/storage/downloads*
    (the default folder for downloaded files).


    Having a tooled-up Linux environment on your Android device lets you perform tasks
    that usually require third-party commercial apps. For example, using rsync, you
    can easily set up a robust solution for backing up photos and RAW files on your
    Android device to a remote machine. To do this, it’s a good idea to enable password-less
    SSH login, so you don’t have to type the password every time you perform backup.
    Start with running the `ssh-keygen` command. Skip password creation when prompted
    by pressing **Enter**. Once a key pair has been created, run the `ssh-copy-id
    -i .ssh/id_rsa.pub user@host` command (replace *user* and *host* with the user
    name and the remote machine’s IP address or domain name). This copies the public
    key to the remote machine, thus enabling passwordless login. Backing up data on
    your Android device to the remote server is a matter of using an appropriate rsync
    command. If you want to back up photos and videos, the following command will
    do the trick:


    ```

    rsync -avz -e ssh ~/storage/dcim user@host:/path/to/backup/dir

    ```


    Instead of running this command manually every time you need to perform a backup,
    you can write a simple Bash shell script, save it in the *~/.shortcuts* directory,
    and add a Termux widget that links to the script. This way, you can trigger a
    backup operation directly from the homescreen.


    Staying on the subject of photos, the jhead utility makes it possible to process
    photos stored on your Android device. Run the `pkg install jhead` command to install
    the utility in Termux. Using jhead, you can replace generic file names with something
    more meaningful, like timestamps. The following command renames all *.jpg* files
    using the *YYYYMMDD-hhmmss* rule (e.g., *DC_0001.jpg* becomes *20161010-152557.jpg*):


    ```

    for file in *.jpg; do jhead -n%Y%m%d-%H%M%S $file; done

    ```


    jhead can come in useful for basic EXIF metadata operations, but for more advanced
    metadata manipulations, you need ExifTool. Since it’s not available in Termux’
    software repository, you have to compile and installed ExifTool manually. Start
    with installing the required packages using the `apt install perl make` command.
    Use then the wget tool to fetch the latest version of ExifTool source code (replace
    *Image-ExifTool-xx.xx.tar.gz* with the actual current version):


    ```

    wget http://www.sno.phy.queensu.ca/~phil/exiftool/Image-ExifTool-xx.xx.tar.gz

    ```


    Unpack the downloaded archive and switch to the resulting directory:


    ```

    tar xzvf Image-ExifTool-xx.xx.tar.gz

    cd Image-ExifTool-xx.xx

    ```


    Run then the following commands to compile and install ExifTool:


    ```

    perl Makefile.PL

    make test

    make install

    ```


    Once the compilation and installation process is completed, you can check whether
    ExifTool has been properly installed by running the `which exiftool` command.


    If you happen to shoot in RAW, you can convert RAW files into JPEG photos on your
    Android device using a combination of DCRaw, Netpbm and ImageMagick. Start with
    installing these tools by running the `pkg install dcaw, netpbm imagemagick` command.
    Use then the following command to convert a single RAW file to the PNG format:


    ```

    dcraw -c foo.RAW | pnmtopng > foo.png

    ```


    In this command, the dcraw tool decodes the RAW file and pipes the output to the
    pnmtopng tool that saves it in the PNG format. You can then use the convert tool
    to convert the resulting PNG file into JPEG:


    ```

    convert foo.png foo.jpg

    ```


    To process all RAW files and save them in the JPEG format, use these two commands:


    ```

    for file in *.RAW ; do dcraw -c -g 2.4 12.92 "$file" | pnmtopng > "${file%%.*}".png
    ; done

    for file in *.png ; do convert "$file" "${file%.*}.jpg" ; done

    ```


    Instead of convert, you can use the mogrify tool as follows:


    ```

    mogrify -format jpg *.png

    ```


    Keep in mind, though, that mogrify overwrites originals, so use it with care.'
