    \ 49.477116899982,10.988667,http://dmpop.dhcp.io/mejiro/photos/tims/20170506-155800.jpeg,http://dmpop.dhcp.io/mejiro/photos/20170506-155800.jpeg\n\
    ```\n\n接下来，登录 uMap 并点击**创建地图**(Create a map）按钮创建一个新地图。在右侧面板中，点击**管理图层**(Manage\
    \ layers）。点击默认图层旁边的**编辑**(Edit）按钮，并为其赋予一个描述性名称。展开**远程数据**(Remote data）部分，在**Url**字段中输入\
    \ PHP 脚本的 URL，并从**格式**(Format）下拉列表中选择 `csv`。启用**动态**(Dynamic）和**代理请求**(Proxy request）选项。展开**交互选项**（Interaction\
    \ options）部分，并在**弹出窗口内容模板**（Popup content template）字段中输入以下内容：\n\n```\n{{{thumbnail}}}\n\
    Source: {photo}\n```\n\n保存并刷新地图。\n\n"
- fmt: "\nUsing Expose couldn’t be easier. In the terminal, switch to the directory\
    \ containing the photos and videos you want to publish, and run the `expose` command.\
    \ This generates a complete static gallery in the `_site` directory. If you want\
    \ to generate a preview, run the `expose -d` command to create a gallery with\
    \ low-resolution images. Keep in mind, though, that Expose doesn’t overwrite existing\
    \ images when you run the script again, so you need to delete the `_site` directory\
    \ to re-generate the gallery with high-resolution photos.\n\n## Add descriptions\
    \ and settings\n\nAdding a text description to a photo is as easy as creating\
    \ a `.txt` file with the same file name as the photo. For example, to add a description\
    \ to the `001_foo.jpeg` photo, create the `001_foo.txt` file with the desired\
    \ text in it.\n\n![](media/file29.jpg)\n\nIn the default theme, the specified\
    \ description appears as a text overlay in the lower part of the photo. But this\
    \ might not always be the most optimal text placement. Fortunately, Expose makes\
    \ it possible to define text position and flow by specifying YAML configuration\
    \ settings in the description file. You can specify the exact text position as\
    \ well as the width and height of the text box by adding the following configuration\
    \ at the beginning of the description file (all values are expressed in percent):\n\
    \n```\n---\ntop: 15\nleft: 5\nwidth: 25\nheight: 20\n---\n```\n\nIn this example,\
    \ the `top: 15` and `left: 5` options instruct the script to place the text 15%\
    \ from the top edge and 5% from the left edge of the photo. In addition to position,\
    \ you can also specify text color using the `textcolor` settings:\n\n```\n---\n\
    top: 15\nleft: 5\nwidth: 25\nheight: 20\ntextcolor: #ffffff\n---\n```\n\nBy default,\
    \ the text is placed in a rectangular text box of specified width and height,\
    \ but it’s also possible to make the text flow around shapes using the `polygon`\
    \ option. Using it, you can specify multiple points using the X and Y values,\
    \ thus turning the rectangular box into a polygon. Here is how this work in practice.\
    \ Use the `width` option to specify the width of the text box, for example:\n\n\
    ```\n---\nwidth: 50\n---\n```\n\nThe X and Y coordinates of each corner of the\
    \ box are as follows:\n\n```\nx:0,y:0-------x100,y:0\n   |             |\n   |\
    \             |\n   |             |\nx:100,y:100-----x:0,y:100\n```\n\nThe rectangular\
    \ can be defined using the `polygon` option with a JSON-formatted list of coordinates:\n\
    \n```\npolygon:[{\"x\":0, \"y\":0},{\"x\":100, \"y\":0},{\"x\":100, \"y\":100},{\"\
    x\":0, \"y\":100}]\n```\n\nKnowing this, you can adjust the coordinates of each\
    \ corner as well as introduce additional points with specific coordinates. For\
    \ example, to add a left-to-right slope to the right side of the text box, adjust\
    \ the X value of the top-right corner as follows:\n\n```\npolygon:[{\"x\":0, \"\
    y\":0},{\"x\":25, \"y\":0},{\"x\":100, \"y\":100},{\"x\":0, \"y\":100}]\n```\n\
    \nExpose uses ImageMagick for all image manipulation tasks, and you can add processing\
    \ instructions to the description file for on-the-fly image adjustments. For example,\
    \ if you want to watermark a specific image add the following processing instruction\
    \ to its description file:\n\n```\n---\nimage-options: /path/to/watermark.png\
    \ -gravity SouthWest -geometry +10+10 -composite\n---\n```\n\nThis uses the `watermark.png`\
    \ image file to apply a watermark at the lower-right corner of the image, with\
    \ a 10-pixel margin from the edge. Need to sharpen a photo? The following option\
    \ does the trick:\n\n```\n---\nimage-options: -sharpen 0x1.5\n---\n```\n\nYou\
    \ can use practically any option supported by ImageMagick, so you might want to\
    \ peruse the [Command-Line Options page](http://www.imagemagick.org/script/command-line-options.php)\
    \ if you want to make the most out of this functionality.\n\nInstead of specifying\
    \ options for individual photos, you can apply them globally to all published\
    \ images. To do this, create the `metadata.txt` file and specify the desired options\
    \ in it.\n\nIf you shoot time-lapses, you’ll be pleased to learn that Exposure\
    \ can automatically encode them as videos, no manual work required. Add the `imagesequence`\
    \ keyword to the folder containing time-lapse images (e.g., `001 tokyo nightscape\
    \ imagesequence`) and put in the directory with the photos you want to publish.\
    \ Run then the `expose` command, and the script transforms the image sequence\
    \ into a video.\n\n## In conclusion\n\nDespite its simplicity, Exposure is a rather\
    \ capable and flexible tool for generating static photo and video galleries. It\
    \ gives you full control of the publishing process and allows you to configure\
    \ a wide range of options. More importantly, Exposure produces galleries and essays\
    \ that look exceptionally good and are easy to navigate.\n\n# Simple PHP script\
    \ for showcasing photos\n\nA simple PHP script, the [Parsedown](https://github.com/erusev/parsedown)\
    \ PHP library, and the [Sakura](https://github.com/oxalorg/sakura) minimal CSS\
    \ framework are all you need to create a simple stylish page for showcasing your\
    \ photos on the web. The script randomly picks a photo from a specified directory\
    \ and extracts the content of the `Comment` field in the photo’s EXIF metadata.\
    \ It then generates a regular HTML page containing an introductory text, the photo,\
    \ and the extracted text along with a reload button, while Google Fonts and Sakura\
    \ CSS framework make the resulting page look presentable.\n\n![](media/file30.jpg)\n\
    \n```\n<?php\n$title = \"Title Goes Here\";\n$dir = \"path/to/dir\";\n$md = \"\
    foo.md\";\n$ext = \"jpg\";\n$font = \"Lato\";\n\ninclude('parsedown.php');\n\n\
    echo <<< EOT\n    <!doctype html>\n    <html lang=\"en\">\n        <head>\n  \
    \          <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\"\
    >\n            <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n            <title>$title</title>\n            <link href=\"https://unpkg.com/sakura.css/css/sakura.css\"\
    \ rel=\"stylesheet\" type=\"text/css\" />\n            <link href=\"https://fonts.googleapis.com/css?family=$font\"\
    \ rel=\"stylesheet\">\n            <link rel=\"shortcut icon\" href=\"favicon.png\"\
    \ />\n            <style>\n                h1 { font-family:$font;font-size:2em;letter-spacing:5px;\
    \ }\n                p { font-family:$font;font-size:0.9em;letter-spacing:2px;\
    \ }\n            </style>\n        </head>\n        <body style=\"text-align:\
    \ center\";>\n            <h1>$title</h1\nEOT;\n\n$html = file_get_contents($md);\n\
    $Parsedown = new Parsedown();\necho $Parsedown->text($html);\n\n$files = glob($dir.'.'$ext);\n\
    $file = array_rand($files);\n$img = $files[$file];\n\n$exif = exif_read_data($img,\
    \ 0, true);\n$caption = $exif['COMMENT']['0'];\n\necho <<< EOT\n            <img\
    \ style=\"border-radius: 9px;\"; src=\"$img\" />\n            <p style=\"\">$caption</p>\n\
    \            <input type=\"button\" value=\"Reload\" onClick=\"window.location.reload()\"\
    >\nEOT;\n?>\n```\n\nDespite its simplicity, the script has several configurable\
    \ parameters that give you some degree of control. You can specify the desired\
    \ title by editing the `$title` variable, while the `$dir` variable lets you point\
    \ the script to the source directory containing photos. If you don’t like the\
    \ default Lato font, you can use the `$font` variable to specify any other font\
    \ available through [Google Fonts]. The `$md` variable points to a Markdown-formatted\
    \ file that is included in the resulting page as an introductory text, while the\
    \ `$ext` variable lets you specify the file extension of the photos. The latter\
    \ can come in handy when the source directory contains other files besides photos.\n"
