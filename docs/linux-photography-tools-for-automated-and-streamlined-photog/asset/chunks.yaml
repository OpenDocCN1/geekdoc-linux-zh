    # 出版信息


    Copyright © Dmitri Popov 2020


    本作品采用知识产权 [署名-非商业-相同共享 4.0 国际许可](http://creativecommons.org/licenses/by-nc-sa/4.0/)
    协议发布。


    封面照片：日本东京池袋，2016 年 5 月。使用 SONY NEX-3N, SONY E 18-55mm f/3.5-5.6 OSS SEL1855 镜头拍摄。经
    digiKam 处理。


    # 关于作者


    ![](img/file0.png)


    Dmitri Popov 多年来一直致力于 Linux 和开源软件领域的专业写作，他的文章曾发表在丹麦、英国、美国、德国和俄罗斯的杂志及网站上。他定期为 [PIXLS.US](https://pixls.us/)
    贡献内容，你可以在他的 [Coffee, Code, Camera](https://coffeecode.camera/) 网站上找到更多关于他的作品。


    # 关于本书


    本书提供了实用的示例，介绍如何使用极简且专业的工具自动化基于 Linux 的摄影工作流的关键阶段，涵盖管理、处理、发布和备份照片。书中演示了如何利用 Bash
    Shell 脚本的力量来自动化照片的传输、重命名和组织过程。你还将学习如何使用 gThumb 管理和编辑图像，在 Darktable 中处理 RAW 文件，实现自动云备份系统，构建移动备份设备以及托管自己的照片画廊。理解书中的内容需要
    Bash 和 Linux 的基础知识。本书假设你正在使用 Debian 或 openSUSE Linux 发行版，并已启用配置了 `sudo`。


    # 使用 Photo Funnel 导入照片和 RAW 文件


    将照片和 RAW 文件从相机传输到普通的 Linux 机器时，你有许多工具可以选择：从 [digiKam](https://www.digikam.org/)
    到 [Rapid Photo Dowloader](https://www.damonlynch.net/rapid/index.html)。但如果你正在寻找更简单、更直观的方法，[Photo
    Funnel](https://github.com/dmpop/photo-funnel) 可能是你的理想选择。


    ![](img/file1.png)


    Photo Funnel 是一个简单的图形化工具，允许你导入、标记地理位置并组织照片及 RAW 文件。运行时，Photo Funnel 会显示一个拖放面板。将想要导入的照片和
    RAW 文件拖到该面板上，按下 `Import`，该实用程序就会处理其余的工作。


    在导入操作期间，Photo Funnel 会将有用信息（版权、相机型号和镜头）写入适当的 EXIF 字段中。


    安装 Photo Funnel 仅需运行 `curl -sSL https://is.gd/photofunnel | bash` 命令。在第一次运行时，它会提示你指定版权声明和用于存储传输文件的目标目录。


    配置过程只需执行一次，提供的值存储在 `~/.pf` 文件中。如果你以后需要更改保存的值，请用文本编辑器编辑 `.pf` 文件。


    使用 Photo Funnel 再简单不过了。首先，在你的机器上插入并挂载存储卡。然后通过使用桌面启动器或运行 `pf` 命令来启动 Photo Funnel。选择存储卡上的照片和
    RAW 文件，将它们拖到 Photo Funnel 面板的指定区域，然后按下 `Continue`。输入拍摄照片的城市，按下 `OK` 并等待传输操作完成。随后你将在指定的存储目录中找到传输的照片，它们已被重命名、标记了地理位置并按日期整齐地组织在文件夹中。


    # 使用 Otto 导入并组织照片


    将文件从存储卡或外部存储设备移动到 NAS 通常是一件简单的事情。但如果你想让你的 NAS 学会一些小技巧，[Otto](https://gitlab.com/dmpop/otto)
    正是为此任务设计的工具。在你的 NAS 上安装它，你就可以使用该设备传输照片和 RAW 文件，并重命名和组织传输的文件，甚至将有用信息写入 EXIF 元数据中。


    在部署 Otto 之前，你需要在基于 Linux 的 NAS 上安装几个工具。大多数 NAS 模型都不允许开箱安装第三方软件包。幸运的是，[Entware](https://github.com/Entware/Entware)
    项目为该问题提供了解决方案。在你的 NAS 上安装 Entware 应用，你将立即获得广泛流行的 Linux 工具和实用程序的访问。Entware 项目为几种主流
    NAS 模型提供了编译好的应用程序，包括 ASUSTOR、Synology 和 QNAP。如果你恰好使用后者，请从 [在 QNAP NAS 上安装](https://github.com/Entware/Entware/wiki/Install-on-QNAP-NAS)
    页面获取相应的 `.qpkg` 包。在 NAS 上打开 **App Center**（应用中心），点击主窗口右上角的 **Install Manually**（手动安装）按钮，选择下载的
    `.qpkg` 包并按下 `Install`。


    接下来，从你的普通机器到 NAS  SSH 连接。运行 `opkg update` 命令更新可用软件包列表。使用以下命令安装所需的包：


    ```bash

    opkg install getopt bc jq curl perl-image-exiftool git git-http

    ```


    如果你希望在 Otto 完成照片导入和组织后收到通知，请在 Android 设备上安装 [Simple Push](https://www.simplepush.io/)
    应用。


