  trans: "\n\n```\nexiftool -d %Y%m%d-%H%M%S.%%e '-FileName<DateTimeOriginal' DIR\n\
    ```\n\nExifTool 支持广泛的参数和开关。例如，`-ext` 参数在您需要处理特定格式的照片时非常有用。例如，如果目标目录中同时包含 JPG 和\
    \ NEF RAW 文件，而您只想重命名 RAW 文件，可以使用如下命令中的 `-ext NEF` 参数（`.` 表示当前工作目录）：\n\n```\nexiftool\
    \ -ext NEF -d %Y%m%d-%H%M%S.%%e '-FileName<DateTimeOriginal' .\n```\n\n`-r` 开关可用于对目录及其所有子目录运行\
    \ ExifTool 命令：\n\n```\nexiftool -ext NEF -r -d %Y%m%d-%H%M%S.%%e '-FileName<DateTimeOriginal'\
    \ .\n```\n\n重命名照片只是 ExifTool 许多功能之一。需要按年份将照片整理到文件夹中吗？下下面的命令为该问题提供了解决方案：\n\n```\n\
    exiftool -r -d %Y '-directory<$DateTimeOriginal/%d' .\n```\n\n此命令从每张照片的创建日期中提取年份，并将照片移动到相应的文件夹（如果文件夹不存在，则会自动创建）。\n\
    \n同时使用 RAW 和 JPEG 拍摄的摄影师也会喜欢以下命令，它可以根据原始文件扩展名将照片分类到目录：\n\n```\nexiftool -directory=%e\
    \ DIR\n```\n\n因此，如果当前工作目录中同时包含 `*.nef` 和 `*.jpg` 文件，上述命令会将它们分别移动到 `nef` 和 `jpg`\
    \ 目录。\n\n提到 RAW 文件，ExifTool 还允许通过 `-JpgFromRaw` 开关从 RAW 文件提取嵌入的 JPEG 图像：\n\n```\n\
    exiftool -b -r -JpgFromRaw -ext NEF -w foo/%f.jpg .\n```\n\n上述命令从当前工作目录下的 NEF\
    \ RAW 文件中提取 JPEG 图像，并将提取出的文件保存在 `foo` 文件夹中。`-b` 开关以二进制格式输出数据，而 `-w` 开关将二进制数据写入文件。\n\
    \n## 基于 ExifTool 的多功能 Shell 脚本\n\n[ExifTool](http://www.sno.phy.queensu.ca/~phil/exiftool/)\
    \ 是一个处理摄影元数据的极其强大且灵活的工具。但您不需要为了将其用于某些用途而学习它所有的细节。以下 Bash Shell 脚本利用 ExifTool 自动化多项任务：\n\
    \n```\n#!/usr/bin/env bash\nwhile getopts \"h?sdyar\" opt; do\ncase $opt in\n\
    \  s) exiftool -directory=%e .\n  ;;\n  d) exiftool -d %Y%m%d-%H%M%S.%%e '-FileName<DateTimeOriginal'\
    \ -r .\n  ;;\n  y) exiftool '-Directory<CreateDate' -d %Y-%m-%d -r .\n  ;;\n \
    \ a) exiftool -T -r -filename -make -model -fnumber -exposuretime -iso -r . >\
    \ results.txt\n  ;;\n  r) exiftool -overwrite_original -all= -r .\n  ;;\n  h|\\\
    ?)\n  cat <<EOF\nUSAGE:\n  $0 [OPTIONS]\n  $0 -s 按文件扩展名将照片分类到文件夹\n  $0 -d 按日期重命名照片\n\
    \  $0 -y 按年、月、日将照片分类到文件夹\n  $0 -a 将关键 EXIF 数据保存在 results.txt 文件中\n  $0 -r 从照片中删除所有\
    \ EXIF 元数据\nEOF\n  exit 2\n;;\nesac\ndone\n```\n\n将脚本粘贴到新文本文件中保存为 `exiftool-helper.sh`。然后使用以下命令全局安装脚本：\n\
    \n```\nsudo cp exiftool-helper /usr/local/bin/\nsudo chown root:root /usr/local/bin/exiftool-helper\n\
    sudo chmod 755 /usr/local/bin/exiftool-helper\n```\n\n由于该脚本依赖于 ExifTool，您需要使用\
    \ `sudo apt install libimage-exiftool-perl` 命令安装此工具。\n\n该脚本使用各种开关来运行可用命令。与 `-s`\
    \ 开关配合使用时，脚本按文件扩展名对当前目录中的照片进行排序。当您在同一目录中既有 RAW 和 JPEG 文件并想将它们移动到单独文件夹时，这非常有用。`-r`\
    \ 开关运行删除当前目录中所有照片元数据的命令，而 `-a` 开关可用于将关键 EXIF 数据（光圈、快门速度、ISO 等）导出到制表符分隔的文本文件中。然后您可以使用表格应用程序分析这些数据。\n\
    \n自然，您也可以自定义脚本中的现有命令并添加新命令。例如，如果您想在导出的值列表中添加焦距数据，请如下修改由 `-a` 启动的命令：\n\n```\nexiftool\
    \ -T -r -filename -make -model -fnumber -exposuretime -iso -focallength -r . >\
    \ results.txt\n```\n\n要向脚本中添加新命令，需要先为其指定一个开关。例如，如果您想使用 `-w` 开关，请将其添加到 `\"h?sdyar\"\
    ` 字符串中：`\"h?sdyarw\"`。然后在上述 `case ... in` 块中、`h|\\?)` 行上方添加所需的命令，格式如下：\n\n```\n\
    w) command goes here\n  ;;\n```\n\n"
- fmt: "\nThere is no need to fire up a heavyweight RAW processing application when\
    \ you need to quickly convert RAW files to the JPEG format. Instead you can use\
    \ the combination of `dcraw` and `cjpeg` tools to process RAW files and save them\
    \ as JPEG images. Start with installing the required packages using the `sudo\
    \ apt install dcraw libjpeg-turbo-progs` command on Debian and Ubuntu, or `sudo\
    \ zypper in dcraw libjpeg-turbo` on openSUSE. Run then the `dcraw -c foo.raw |\
    \ cjpeg > foo.JPG` command to convert a single RAW file, or use a more advanced\
    \ command with the `for...do` loop to convert all RAW files in the current directory:\n\
    \n```\nfor file in *.RAW; do dcraw -c -g 2.4 12.92 $file | cjpeg > \"${file%%.*}\"\
    .jpeg; done\n```\n\nAnd of course, you can add a dedicated function to the `~/.bashrc`\
    \ file:\n\n```\nif [ -x \"$(command -v dcraw)\" ] && [ -x \"$(command -v cjpeg)\"\
    \ ] ; then\n  function rawtojpeg() {\n    ext=${1:-RAW}\n    for file in *.$ext;\
    \ do echo \"Processing $file\"; \\\n    dcraw -v -c -g 2.4 12.92 $file | cjpeg\
    \ > \"${file%%.*}\".jpeg; done\n  }\nfi\n```\n\nBy default, this function processes\
    \ all files with the `*.RAW` extension in the current directory, but you can specify\
    \ a different file extension, for example: `rawtojpeg NEF`.\n\n## Rename photos\
    \ and edit EXIF metadata with jhead\n\n[ExifTool](http://www.sno.phy.queensu.ca/~phil/exiftool/)\
    \ is by far the most powerful and versatile tool for working with photographic\
    \ metadata, but it’s not the only tool that allows you to do that. Although [jhead](http://www.sentex.net/~mwandel/jhead/)\
    \ offers only a fraction of ExifTool’s functionality, this lightweight utility\
    \ is easy to master and it can handle many common EXIF-related tasks. To install\
    \ jhead, run the `sudo apt install jhead` command.\n\nSimilar to ExifTool, jhead\
    \ can rename photos using date and time data from EXIF headers, so you can add\
    \ the following function that does this to the `~/.bashrc` file.\n\n```\nif [\
    \ -x \"$(command -v jhead)\" ] ; then\n  function jrename() {\n    ext=${1:-jpeg}\n\
    \    jhead -n%Y%m%d-%H%M%S *.$ext\n  }\nfi\n```\n\nBy default, the function renames\
    \ all `*.jpeg` files in the current directory, but you can also explicitly specify\
    \ the desired extension as a command parameter:\n\n```\njrename JPG\n```\n\nThe\
    \ function renames photos using the `YYYYMMDD-HHMMSS` format, but you can easily\
    \ modify the `%Y%m%d-%H%M%S` formatting string. Here are a few useful arguments\
    \ you can use to construct a custom string.\n\n```\n%d  Day of month as decimal\
    \ number (01 – 31)\n%H  Hour in 24-hour format (00 – 23)\n%j  Day of year as decimal\
    \ number (001 – 366)\n%m  Month as decimal number (01 – 12)\n%M  Minute as decimal\
    \ number (00 – 59)\n%S  Second as decimal number (00 – 59)\n%U  Week of year as\
    \ decimal number, with Sunday as first day of week (00 – 53)\n%w  Weekday as decimal\
    \ number (0 – 6; Sunday is 0)\n%y  Year without century, as decimal number (00\
    \ – 99)\n%Y  Year with century, as decimal number\n```\n\nNeed to add a description\
    \ to a photo? The function below allows you to do just that.\n\n```\nif [ -x \"\
    $(command -v jhead)\" ] ; then\n  function jcomment() {\n    jhead -ce $1\n  }\n\
    fi\n```\n\nRun the `jcomment` command followed by the filename of the desired\
    \ photo (e.g., `jcomment foo.jpg`), and it opens the default text editor, where\
    \ you can enter the text. When you save the changes, jhead writes the text into\
    \ the Comment field in the EXIF header.\n\n## Geotag photos with reference snapshots\n\
    \nIf your camera lacks geotagging capabilities, you can add geographical information\
    \ to photos using a smartphone and a Bash one-liner.\n\nWhen you take photos at\
    \ a specific spot, remember to take a snapshot using your mobile device (make\
    \ sure that the geotagging feature in the camera app on the device is enabled).\
    \ This snapshot can be used as a reference file for geotagging the photos with\
    \ the [ExifTool](http://www.sno.phy.queensu.ca/~phil/exiftool/). To install it,\
    \ run the `sudo apt-install libimage-exiftool-perl` command. The simple command\
    \ below reads geographical tags from the reference snapshot and writes them to\
    \ all photos in the current directory:\n\n```\nexiftool -overwrite_original -r\
    \ -tagsFromFile path/to/reference.jpg -gps:all.\n```\n\nReplace `path/to/reference.jpg`\
    \ with the actual path to the reference snapshot. To make geotagging photos more\
    \ straightforward, add the following function to the `~/.bashrc` file:\n\n```\n\
    if [ -x \"$(command -v exiftool)\" ] ; then\n  function geotag() {\n    geotag()\
    \ path/to/reference.jpg -gps:all.\n    geotag() path/to/reference.jpg -gps:all.\n\
    \  }\nfi\n```\n*(Wait, correcting the function body based on provided text logic)*:\n\
    ```\nif [ -x \"$(command -v exiftool)\" ] ; then\n  function geotag() {\n    geotag()\
