    \ clone https://github.com/tjko/jpegoptim.git\n[](#cb53-2)cd jpegoptim\n[](#cb53-3)./configure\n\
    [](#cb53-4)make\n[](#cb53-5)make strip\n[](#cb53-6)sudo make install\n```\n\n\
    That’s all there is to it. To compress a JPEG file, run the `jpegoptim foo.jpg`\
    \ command (replace *foo.jp* with the actual path and name of the JPEG file).\n\
    \nBy default, jpegoptim uses the lossless compression algorithm, but you can override\
    \ this by specifying the maximum image quality using the `--max` parameter. In\
    \ addition to compressing the file, jpegoptim can also remove metadata. The `--strip-exif`\
    \ parameter, for example, removes all EXIF data, while the `--strip-iptc` parameter\
    \ removes IPTC data.\n\njpegoptim offers several other useful options, and you\
    \ can view them all, along with their explanations, using the `man jpegoptim`\
    \ command.\n\n# Color management on Linux\n\nThe purpose of color management is\
    \ to produce consistent color output across different devices. This definition\
    \ might sound simple enough, but understanding the mechanics of color management\
    \ and implementing a color-managed workflow can be a rather complex and at times\
    \ confusing affair. The following description can help you to get an understanding\
    \ of color management fundamentals and set up a color-managed environment using\
    \ open source Linux tools.\n\n## Color management in a nutshell\n\nThe need for\
    \ color management arises from the fundamental problem of color reproduction:\
    \ a formal representation of a given color (e.g., numeric value of the color in\
    \ a specific color model) doesn’t necessarily produce the same color on different\
    \ devices due to a wide variety of factors. Thus the primary goal of color management\
    \ is to achieve a consistent color reproduction across devices. So, for example,\
    \ a photo taken by a color-managed camera should look the same on a color-managed\
    \ computer screen.\n\nIn a color-managed workflow, each device such as a digital\
    \ camera and LCD display has its own color profile which characterizes the color\
    \ response of that particular device. Each color profile describes these colors\
    \ relative to a standardized set of reference colors. Color-managed software then\
    \ uses these standardized profiles to translate color from one device to another.\
    \ This is usually performed by a color management module ([Overview of color management\
    \ by Cambridge in Colour](http://www.cambridgeincolour.com/tutorials/color-management1.htm))\n\
    \nColor profiles are closely related to the concept of color space. A color space\
    \ is a defined range of colors, or as Thom Hogan puts it, “a Color Space defines\
    \ what is possible.” ([Thom’s Quick & Dirty Guide to Color Management](http://www.bythom.com/qadcolor.htm)).\
    \ Put it in another way, a color space determines the color capabilities of a\
    \ specific device or application. While a color space contains color definitions,\
    \ a color profile describes the color input or output of a device.\n\nSince there\
    \ are several established color spaces, the question is which one you should choose.\
    \ A detailed answer to that question deserves a separate discussion, but the simple\
    \ truth is that the sRGB color space is adequate for general use. Developed specifically\
    \ for the Internet, sRGB is smaller compared to other color spaces (most notably\
    \ Adobe RGB), but it’s widely supported by manufacturers and developers, and it’s\
    \ a default color space on virtually any device and application that supports\
    \ color management. digiKam, for example, uses sRGB as its default working color\
    \ space (i.e., the color space in which color data is meant to be manipulated).\
    \ When choosing a color space, consider the following: 1) sRGB can’t be converted\
    \ to a larger color space like Adobe RGB (although the opposite is true: Adobe\
    \ RGB can be downsampled to sRGB), 2) there is no color space assigned to RAW\
    \ files, so if you expect to use different color spaces in your workflow, you\
    \ can use RAW originals to process photos in the desired color space."
