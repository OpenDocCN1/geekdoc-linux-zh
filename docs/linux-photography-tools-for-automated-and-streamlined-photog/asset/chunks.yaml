    sudo chmod +x ./vhusbdpin\nsudo mv vhusbdpin /etc/init.d\nsudo update-rc.d vhusbdpin\
    \ defaults\nsudo reboot\n```\n\n从 [virtualhere.com/usb_client_software](https://www.virtualhere.com/usb_client_software)\
    \ 下载 VirtualHere 客户端二进制文件到你的 Linux 机器，并使用 `chmod +x vhuitXX` 命令（将 `vhuitXX` 替换为下载的文件实际名称）使文件具有可执行权限。要操作相机，请安装\
    \ gPhoto 工具。在 openSUSE 上，运行 `sudo zypper in gphoto` 命令。在 Debian 和 Ubuntu 上，使用\
    \ `sudo apt install gphoto2` 命令。\n\n将相机连接到树莓派并为相机通电。在你的 Linux 机器上，运行 `sudo ./vhuitXX`\
    \ 命令启动 VirtualHere 客户端。如果一切运行正常，你应该能在 **Raspberry Pi Hub** 下看到相机。双击相机项目以启用它。\n\
    \n![](img/file36.png)\n\n然后运行 `gphoto2 --auto-detect` 命令，查看列出的相机输出，例如：\n\n```\n\
    Model                          Port\n----------------------------------------------------------\n\
    Sony Alpha-A6000 (Control)     usb:002,008\n```\n\n此时，你可以像相机直接连接到你的 Linux 机器上一样控制它。\n\
    \n# 使用 Unbash 脚本从 Unsplash 汲取灵感\n\n[Unsplash](https://unsplash.com/) 拥有大量根据 CC0\
    \ 许可发布的高质量照片，是为你任何想象得到的主题获取每日灵感的绝佳场所。但你不需要漫无目的地在成千上万张照片中翻找，可以让 Unbash 脚本获取符合你特定兴趣的照片，并将它们汇成一个简单的幻灯片演示：\n\
    \n```bash\n#!/usr/bin/env bash\n\n# 用户定义参数\nundir=\"$HOME/unbash\"\ndefault_keyword=\"\
    monkey\"\nkeyword_list=\"$HOME/keywords.txt\"\ndefault_count=\"9\"\n\n# 检查所需的包是否已安装\n\
    if [ ! -x \"$(command -v wget)\" ] || [ ! -x \"$(command -v convert)\" ] || [\
    \ ! -x \"$(command -v xdpyinfo)\" ]; then\n    echo \"安装 xdpyinfo, wget 和 ImageMagick。\"\
    \n    exit 1\nfi\n\n# 使用提示\nusage(){\ncat <<EOF\n$0 [OPTIONS]\n\n$0 从 Unsplash\
    \ 下载指定数量的匹配给定关键词的随机照片，并生成动画 GIF\n\n用法:\n  $0 -c <number> -k <keyword>\n\n选项:\n\
    \  -c --count       指定下载的照片数量\n  -k --keyword     指定所需的关键词\nEOF\n  exit 1\n}\n\
    \n# 指定选项\nOPTS=`getopt -o c:k: -l count:keyword: -- \"$@\"`\n[[ $# -eq 0 ]] &&\
    \ usage\neval set -- \"$OPTS\"\n\n# 获取值\nwhile true; do\n  case \"$1\" in\n  \
    \  -c | --count ) count=\"$2\"; shift 2;;\n    -k | --keyword ) keyword=\"$2\"\
    ; shift 2;;\n    -- ) shift; break ;;\n    * ) break ;;\n  esac\ndone\n\n# 检查互联网连接\n\
    wget -q --spider http://source.unsplash.com/\nif [ $? -ne 0 ]; then\n    echo\
    \ \"无法访问 Unsplash。请检查你的网络连接。\"\n    exit 1\nfi\n\n# 如果没有指定关键词，检查 keyword_list\
    \ 文件是否存在\n# 并从文件中随机选择一个单词。\n# 如果 keyword_list 文件不存在，则使用默认关键词\nif [ -z \"$keyword\"\
    \ ]; then\n    if [ ! -f \"$keyword_list\" ]; then\n    keyword=$default_keyword\n\
    \    else\n    keyword=$(shuf -n 1 \"$keyword_list\")\n    fi\nfi\n\n# 如果 count\
    \ 值为空，使用默认数量\nif [ -z \"$count\" ]; then\n    count=$default_count\nfi\n\n# 检查\
    \ unspiration 目录是否存在\n# 如果目录已存在，则删除并重建\n# 如果目录不存在，则创建\n# 切换到创建的目录\nif [ -d \"\
    $undir\" ]; then\n    rm -rf \"$undir\"\n    mkdir \"$undir\"\n    cd \"$undir\"\
    \nelse\n    mkdir \"$undir\"\n    cd \"$undir\"\nfi\n\n# 确定屏幕分辨率以获取正确尺寸的照片\nsize=$(xdpyinfo\
    \ | grep dimensions | awk '{print $2}')\n\n# 从 Unsplash 获取指定数量的匹配给定关键词的随机照片\n\
    # Unsplash 随机生成器需要休眠间隔\ni=1\nwhile [ $i -le \"$count\" ]\ndo\n    wget https://source.unsplash.com/$size/?\"\
    $keyword\" -O $i-\"$keyword\".jpg\n    i=$((i + 1))\n    sleep 3\ndone\n\n# 使用获取的照片生成\
    \ GIF\nconvert -delay 300 -loop 0 *.jpg \"$keyword\"-inspiration.gif\n\n# 在默认图像查看器中打开动画\
    \ GIF\nxdg-open \"$keyword\"-inspiration.gif\n```\n\n此脚本执行多项任务并提供了一程度的自定义。首先，它会检查所需的包是否已安装。脚本需要两个参数：下载的照片数量（`-c`\
    \ 或 `--count`）和关键词（`-k` 或 `--keyword`）。要部署此脚本，请将其粘贴到文本文件中并保存为 `unbash` 名称。使用以下命令移动脚本并使其具有可执行权限：\n\
    \n```bash\nsudo mv unbash /local/bin/unbash\nsudo chown root:root /local/bin/unbash\n\
    sudo chmod 755 /local/bin/unbash\n```\n\n现在你可以通过运行 `unbash -c COUNT -k KEYWORD`\
    \ 来启动脚本（将 `COUNT` 和 `KEYWORD` 替换为所需的数量和关键词）。或者，在主目录下创建一个包含所需关键词列表的 `keywords.txt`\
    \ 文件，然后运行 `unbash -c COUNT` 命令。\n\n"
- fmt: '

    This produces an image with twice the resolution of the original. Super-resolution
    with a standard camera is a bit more complex, as when you have uncontrolled camera
    or subject motion, you don’t get anywhere near an exact half pixel shift. But
    unless you are extremely unlucky, your shifted image will be offset by some amount
    from the original. By combining enough images you will get a very irregularly
    sampled image (with pixel samples that don’t fall onto a grid), but one which
    can be interpolated into a regular image by tracing the lines between samples
    to guess a result that does fall on an exact gridline. This is precisely what
    the Highrise script tries to achieve.


    The script relies on ImageMagick and Hugin tools for upscaling, aligning, and
    assembling a stack of lower-resolution photos into a super-resolution image. This
    means that you need to install the required dependencies for the script to work.
    To do this on openSUSE, use the `sudo zypper in ImageMagick hugin exiftool` command.


    You can then install Highrise by running the following commands:


    ```

    git clone https://gitlab.com/dmpop/highrise.git

    cd highrise

    sudo cp highrise.sh /usr/local/bin/highrise

    sudo chown root:root /usr/local/bin/highrise

    sudo chmod 755 /usr/local/bin/highrise

    ```


    To generate a super-resolution image, you need to take a series of photos first.
    Set your camera to the continuous shooting mode, and disable image stabilization.
    Take between 9 and 15 photos of the desired scene. It’s important that you don’t
    use a tripod, but shoot hand-held. For an even better result, enable manual focusing
    and shoot in the Manual mode. Also, keep in mind that the script works best with
    photos of static scenes.


    Transfer the photos to your machine, then run the Highrise script using the following
    command:


    ```

    highrise -e JPG -d /path/to/source/dir

    ```


    Replace `JPG` with the actual file extension of the source photos, and `/path/to/source/dir`
    with the absolute path to the directory containing the source photos. Generating
    super-resolution images is a computationally-intensive task, so depending on the
    size and number of source photos, it could take a while. Once the script is finished,
    you’ll find the resulting super-resolution images in the source directory. These
    files are recognizable by the `mean` and `median` postfixes in their names.


    If the script failed to properly align the source photos, you can adjust several
    parameters to fix that. Open the script in a text editor and modify the available
    align parameters. Save the changes, and run the script again.


    ¹Source: [How does Super Resolution work?](https://photo.stackexchange.com/questions/24726/how-does-super-resolution-work)


    # Konbini: KDE’s little photo helper


    If you happen to use KDE as your preferred graphical desktop, [Konbini](https://gitlab.com/dmpop/konbini)
    might be right up your alley. It adds several useful image manipulation actions
    to the Dolphin file manager as well as installs and configures a handful of photography-related
    tools.


    The supplied installer does the donkey job of fetching and installing the required
    pieces. It also adds the dedicated `Konbini` item to the right-click context menu
    in Dolphin. This menu gives you quick access to several useful commands that let
    you recompress and resize the currently selected image file, rename the file using
    date and time values extracted from its EXIF metadata, quickly geotag the selected
    photo, show the selected geotagged photo on OpenStreetMap, and more.


    Installing Konbini is supremely easy. In the Terminal, run the `curl -sSL https://is.gd/konbini
    | bash` command for the installer to finish. The installer script is designed
    for use with openSUSE, Ubuntu, and Debian. But it can be easily modified to work
    with other Linux distributions.


    In the `template` folder in the `konbini` directory you’ll find example files
    that you can use to create your own actions. Let’s say you want to create an action
    that uploads the currently selected photo to an FTP server. First, rename the
    `example` file in the `template/script` folder to something more descriptive like
    `upload-ftp`. Open the file for editing, remove the existing commands, and add
    the following code (replace the example values with the actual FTP server address
    or domain name, user name, and password):


    ```

    curl -T "$file" ftp://ftp.example.com/path/to/dir/ --user user:password

    notify-send "It works!"

    ```


    Save the changes, then move the file to the `/usr/local/bin/` directory, and make
    the script executable:


    ```

    sudo mv upload-ftp /usr/local/bin/

    sudo chown root:root /usr/local/bin/upload-ftp

    sudo chmod 755 /usr/local/bin/upload-ftp

    ```


    Next, rename the `example.png` icon in the `template/icon` folder to `upload-ftp.png`
    and move it to the `/usr/share/icons/konbini-icons/` directory:


    ```

    mv upload-ftp.png /usr/share/icons/konbini-icons/

    ```


    Instead of the supplied generic example icon, you can use a more appropriate icon
    from the [Feather Icons](https://feathericons.com/) set.


    Finally, rename the `example.desktop` file in the `template` folder to `upload-ftp`,
    open it for editing and replace the example:


    ```

    [Desktop Entry]

    Type=Service

    X-KDE-Priority=TopLevel

    X-KDE-Submenu=Konbini

    MimeType=image/jpeg;image/JPG;image/jpg;

    Actions=UploadFTP


    [Desktop Action UploadFTP]

    Name=Upload via FTP

    Exec=/usr/local/bin/upload-ftp %f

    Icon=/usr/share/icons/konbini-icons/upload-ftp.png

    ```


    Save the changes, and move the file to `/usr/share/services`:


    ```

    mv upload-ftp.desktop /usr/share/services/

    ```


    Launch Dolphin, right-click on a JPEG, and you should see the newly-added `Konbini`
    menu.


    # Keep tabs on what’s in your bag with Everyday Carry


    Need to keep tabs on the photographic equipment you carry in your bag? There are
    several apps and tools that can help you with that. But if you prefer to keep
    things simple and not share your data with third parties, then [Everyday Carry](https://gitlab.com/dmpop/epc)
    (EPC) is what you need. It’s a simple PHP script that pulls data stored in the
    comma-separated format from a text file and renders it as an HTML page.


    EPC requires no installation. Clone the project’s GitLab repository using `git
    clone https://gitlab.com/dmpop/epc.git`, or download the source code directly
    from the project’s page. Open the `login.php` file, replace the example password
    with the desired one, and save the changes. Do the same with the `protect.php`
    file.


    Since EPC is just a PHP script, you can run it on a web server with PHP, so you
    can access your data from anywhere. Move the `epc` folder into the document root
    of your server and point the browser to `http://127.0.0.1/epc` (replace `127.0.0.1`
    with the actual domain name or IP address of the server).


    To run EPC on your local machine, you need to install PHP. To do this on openSUSE,
    run the `sudo zypper in php` command. Use the `sudo apt-get install php7.2` command
    to install PHP on Ubuntu. In the terminal, switch to the `epc` directory, and
    run the `php -S localhost:8000` command. Point then the browser to the `localhost:8000`
    address to access EPC.


    During the first run, EPC creates a data file and insert an example entry. To
    add and manage entries, press the **Edit** button. All data in EPC is stored in
    the comma-separated format, so each entry should look as follows:


    ```

    ilce-6500.jpeg; Sony α6500 (ILCE-6500); 3157099; 1973-10-31

    ```


    The first item in each entry should be a file name of the product. If you don’t
    want to add a product photo, enter `na` (as in *not available*).


    To add product photos either copy them manually to the `epc/img` folder, or press
    the **Upload** link next to the **Edit** button and use the upload form to upload
    a photo.

