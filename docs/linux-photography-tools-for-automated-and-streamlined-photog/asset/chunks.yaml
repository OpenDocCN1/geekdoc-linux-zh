    \ directory to the *foo.JPG* file. In the terminal, switch to the directory, and\
    \ run the `hald-clut path/to/foo.JPG` command (replace *path/to/foo.JPG* with\
    \ the actual path to the desired file). This apply all presets to the *foo.JPG*\
    \ image and saves the resulting files in the *hald-clut-files/hald-clut* directory.\n\
    \n## Use Hald CLUT presets with Lilut\n\nIf you happen to use digiKam, RAWTherapee,\
    \ or any other photo editing application that supports Hald CLUT, you might already\
    \ have a handful of favorite presets. But what if you want to use these presets\
    \ even when you don’t have access to your photo editing application? [Lilut](https://gitlab.com/dmpop/lilut)\
    \ to the rescue. This simple PHP-based tool makes it possible to upload a photo\
    \ from any device and apply any of the available Hald CLUT presets.\n\n![](media/file25.jpg)\n\
    \nLilut can run on any web server with PHP. The only additional requirement is\
    \ the *php-imagick* package that must be installed on the server. If your server\
    \ runs a Debian-based Linux distribution, you can install the package using the\
    \ `sudo apt-get install php-imagick` command. On openSUSE, the command is `sudo\
    \ zypper in php7-imagick`. The default PHP configuration limits the size of uploaded\
    \ files to a mere 2MB. To change that, open the *php.ini* file for editing (e.g.,\
    \ `sudo nano /etc/php7/cli/php.ini`) and adjust the value of the `upload_max_filesize`\
    \ parameter.\n\nTo deploy Lilut, clone the project’s Git repository using the\
    \ following command:\n\n```\ngit clone https://gitlab.com/dmpop/lilut.git\n```\n\
    \nAlternatively, grab the last source code as a ZIP file and extract the downloaded\
    \ archive. Put your Hald CLUT files into the *luts* folder, and move the entire\
    \ *lilut* directory to the document root of the web server. Point then the browser\
    \ to *127.0.0.1/lilut* (replace *127.0.0.1* with the actual IP address or domain\
    \ name of the server), and you should see Lilut’s main page.\n\n# Backup and recovery\n\
    \nThere is more to backup than having a copy of your photo library on an external\
    \ hard disk. You should also consider implementing a cloud backup system and a\
    \ solution for keeping your photos safe when you are on the move.\n\n## Cloud\
    \ backup with rclone\n\nCloud storage is cheap nowadays, and there are plenty\
    \ of storage providers to choose from. So there is no excuse for not having an\
    \ off-site backup system for keeping your files safe. There is a fly in the ointment,\
    \ though. Many cloud storage services want you to use their own proprietary graphical\
    \ client applications. Worse still, some services don’t provide Linux clients\
    \ at all. Fortunately, there is [rclone](http://rclone.org/), a small open source\
    \ utility that can talk to many popular cloud storage services. rclone can also\
    \ handle local file systems, so you can use it for local backup, too. The utility\
    \ is straightforward in use, so there is no learning curve to speak of.\n\n###\
    \ Install rclone\n\nWritten in Go, rclone is distributed as a self-contained binary\
    \ file with no dependencies, and it will happily run on the x86, AMD64, and ARM\
    \ platforms. Installing rclone is not difficult, but it does require a bit of\
    \ manual work. Grab the latest release of the tool for the appropriate Linux platform\
    \ from the project’s website. Unpack then the downloaded archive, and switch to\
    \ the resulting directory in the terminal. Copy then the binary executable to\
    \ the */usr/local/bin/* directory and change the file’s permissions:\n\n```\n\
    sudo cp rclone /usr/local/bin/\nsudo chown root:root /usr/local/bin/rclone\nsudo\
    \ chmod 755 /usr/local/bin/rclone\n```\n\nTo install rclone’s man pages, run the\
    \ following commands:\n\n```\nsudo mkdir -p /usr/local/share/man/man1\nsudo cp\
    \ rclone.1 /usr/local/share/man/man1/\nsudo mandb\n```\n\n### Install rclone on\
    \ Android\n\nIt’s also possible to install and run rclone on an Android device.\
    \ This can be useful if you want to back up photos stored on your device, or use\
    \ the device to transfer photos from a camera and then back them up. Deploying\
    \ rclone on Android requires the [Termux](https://termux.com/) app, so the first\
    \ order of business is to install it on your device either via Google Play Store\
    \ or F-Droid. Launch then Termux an run the following commands to install rclone:\n\
    \n```\npkg update\npkg install golang git\nexport GOPATH=`pwd`/go\nmkdir go\n\
    go get -u -v github.com/ncw/rclone\n```\n\nUse the `./go/bin/rclone version` command\
    \ to confirm that the rclone has been installed. Enable then access to Android’s\
    \ storage:\n\n```\npkg install termux-api\npkg termux-storage-setup\n```\n\nYou\
    \ can then use rclone as described below, but remember to replace `rclone` command\
    \ with `./go/bin/rclone`.\n\n### Configure rclone\n\nTo make rclone work with\
    \ your preferred cloud storage service, you need to create a configuration file.\
    \ And the utility has the special `config` subcommand that allows you to do just\
    \ that. Say, you want to use rclone with the [Amazon Drive](https://www.amazon.com/clouddrive/)\
    \ service. Run the `rclone config` command, press **n** when prompted to set a\
    \ configuration password, and name the configuration profile *remote*. Enter then\
    \ the number corresponding to the Amazon Drive option in the list of supported\
    \ services. Leave the *Amazon Application Client Id* and *Amazon Application Client\
    \ Secret* options empty, and select the auto configuration option. This will open\
    \ the default browser and obtain an access token. Check and confirm the generated\
    \ settings, and you are done.\n\nOnce rclone has been configured, run the `rclone\
    \ lsd remote:` command that returns all containers.\n\n### Use rclone"
