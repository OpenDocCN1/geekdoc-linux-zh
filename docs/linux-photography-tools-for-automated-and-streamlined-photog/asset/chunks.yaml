    `rclone` 支持一些简单的子命令和选项，允许你访问、管理和使用远程存储。其中，`copy` 和 `sync` 子命令可能是最重要的。顾如名，`copy`
    子命令将源目录的内容复制到远程目标地。该子命令不会传输未更改的文件（它通过文件大小、修改时间和以及 `md5sum` 哈希值来对它们进行检查），并且不会从目标目录中删除文件。如果目标目录不存在，`rclone`
    会自动创建它。大多数 `rclone` 命令都遵循简单的 `rclone [OPTION] [SUBCOMMAND] <source> <destination>`
    语法，以下是将指定目录的内容复制到远程目标地的命令示例：


    ```

    rclone copy /path/to/source remote:destination

    ```


    ```


    与 `copy` 类似，`sync` 子命令将文件从源目录传输到目标目录，跳过未更改的文件。但当 `sync` 遇到源目录中不存在的文件时，该子命令会将它们从目标目录中删除。换句话说，`sync`
    通过修改目标目录来保持源目录和目标目录的同步。由于此操作（以及其他 rclone 操作）是不可逆的，因此先进行测试是合理的，`rclone` 提供了实用的
    `--dry-run` 选项供使用。将此选项添加到 `rclone sync` 命令中可以检查哪些文件将被复制和删除：


    ```

    rclone --dry-run sync /path/to/source remote:destination

    ```


    当你需要确保源目录和目标目录中的文件匹配时，`check` 子命令非常有用：


    ```

    rclone check /path/to/source remote:destination

    ```


    此命令通过文件大小和 `md5sum` 哈希值比较文件，然后显示不匹配的文件列表。


    除了 `copy` 和 `sync`，`rclone` 还支持多个让你查看和管理远程存储的子命令。例如，`lsd` 子命令可以列出远程目标所有的目录（也称为容器和桶），而
    `ls` 子命令显示指定远程目录中的所有文件：


    ```

    rclone lsd remote:

    rclone ls remote:dir

    ```


    需要创建或删除远程目录吗？使用 `mkdir` 和 `rmdir` 子命令：


    ```

    rclone mkdir remote:new_dir

    rclone rmdir remote:old_dir

    ```


    最后一个命令只有在目录为空时才能删除目录。如果你想删除目录及其内容，请使用 `purge` 子命令：


    ```

    rclone purge remote:old_dir

    ```


    作为一种命令行工具，`rclone` 支持许多控制其行为的选项。例如，`--bwlimit` 选项允许你限制 `rclone` 可用的带宽。当运行 `rclone`
    的机器与其他客户端共享互联网连接时，这非常有用。限制带宽可以确保其他机器在复制或同步操作期间能够以合理的速度访问互联网。可以使用 `k`、`M` 和 `G`
    后缀以千字节、兆字节或吉字节指定带宽限制：


    ```

    rclone --bwlimit=15M sync /path/to/source remote:destination

    ```


    上面的命令将带宽限制为 15MBytes/s。


    之前提到过 `--dry-run` 选项，它允许你在不不应用任何更改的情况下测试 `rclone` 操作。最后，如果你无人值运行 `rclone`，你可能想使用
    `--log-file` 选项将 `rclone` 的输出保存到文件中以便稍后参考：


    ```

    rclone --log-file=rclone.log sync /path/to/source remote:destination

    ```


    ### 在 rclone 中使用过滤器


    `rclone` 中的过滤选项和模式可用于配置 `rclone` 跳过某些文件和目录。`rclone` 中的过滤规则适用于大多数命令，包括 `copy` 和
    `sync`。`rclone` 中的过滤规则由两部分组成：排除（exclude）或包含（include）子命令和一个过滤模式。`rclone` 有四种过滤子命令：`--exclude`、`--exclude-from`、`--include`
    和 `--include-from`。前两个命令用于排除文件，而另外两个允许将当前操作限制为指定文件。`--exclude` 子命令允许内联指定过滤模式，例如：


    ```

    rclone --exclude *.NEF sync /path/to/source remote:destination

    ```


    该命令同步扩展名为 `*.NEF` 的 RAW 文件以外的所有内容。与其临时指定过滤规则，可以将过滤模式列表保存在文本文件中并配合 `--exclude-from`
    子命令使用它：


    ```

    rclone --exclude-from=filters.txt copy /path/to/source remote:destination

    ```


    当你需要将 `rclone` 限制为特定的文件集时，`--include` 命令非常有用。例如，如果你想同步目录中的 TIFF 和 JPEG 文件并跳过其他文件，以下过滤规则可以实现：


    ```

    rclone --include *.{tif,jpg} copy /path/to/source remote:destination

    ```


    与 `--exclude-from` 类似，`--include-from` 命令可以从文本文件中读取过滤模式。


    使用排除和包含子命令，你可以创建跳过或包含匹配文件的过滤规则。但如果你需要创建一个结合了这两者的过滤器集怎么办？那么 `--filter-from` 子命令就是你需要的。该子命令读取包含包含和排除过滤规则的文本文件，并将它们应用于当前操作：


    ```

    rclone --filter-from=filters.txt sync /path/to/source remote:destination

    ```


    指定文件中的每行都包含一个以 `+`（包含）或 `-`（排除）前缀开头的过滤规则，例如：


    ```

    +.jpeg

    +.tiff

    -.MP4

    -.xmp

    ```


    正如你可能所注意到的，`rclone` 中的过滤模式基于通配符。虽然它们没有正则表达式那么强大，但通配符更容易掌握。如果你在命令行中使用了通配符，那么编写
    `rclone` 过滤规则时就不会出现问题。


