    \ gphoto2` command.\n\nConnect the camera to the Raspberry Pi, and power the camera.\
    \ On your Linux machine, launch the VirtualHere client by running the `sudo ./vhuitXX`\
    \ command. If everything work properly, you should see the camera listed under\
    \ **Raspberry Pi Hub**. Double-click on the camera item, to enable it.\n\n![](media/file36.png)\n\
    \nRun then the `gphoto2 --auto-detect` command, and see the output listing your\
    \ camera, for example:\n\n```\nModel                          Port\n----------------------------------------------------------\n\
    Sony Alpha-A6000 (Control)     usb:002,008\n```\n\nAt this point, you can control\
    \ the camera as if it was connected directly to your Linux machine.\n\n# Draw\
    \ inspiration from Unsplash with the Unbash script\n\n[Unsplash](https://unsplash.com/),\
    \ with its vast collection of high-quality photos released under the CC0 license,\
    \ is the perfect place for getting your daily dose of inspiration for any topic\
    \ imaginable. But instead of wading aimlessly through thousands of photos, you\
    \ can let the Unbash script fetch photos matching your specific interest and compile\
    \ them into a simple slideshow:\n\n```bash\n#!/usr/bin/env bash\n\n# User-defined\
    \ parameters\nundir=\"$HOME/unbash\"\ndefault_keyword=\"monkey\"\nkeyword_list=\"\
    $HOME/keywords.txt\"\ndefault_count=\"9\"\n\n# Check whether the required packages\
    \ are installed\nif [ ! -x \"$(command -v wget)\" ] || [ ! -x \"$(command -v convert)\"\
    \ ] || [ ! -x \"$(command -v xdpyinfo)\" ]; then\n    echo \"Install xdpyinfo,\
    \ wget, and ImageMagick.\"\n    exit 1\nfi\n\n# Usage prompt\nusage(){\ncat <<EOF\n\
    $0 [OPTIONS]\n\n$0 downloads a specified number of random photos matching a given\
    \ keyword from Unsplash and generates an animated GIF\n\nUsage:\n  $0 -c <number>\
    \ -k <keyword>\n\nOptions:\n  -c --count       Specifies a number of photos to\
    \ download\n  -k --keyword     Specifies the desired keyword\nEOF\n  exit 1\n\
    }\n\n# Specify options\nOPTS=`getopt -o c:k: -l count:keyword: -- \"$@\"`\n[[\
    \ $# -eq 0 ]] && usage\neval set -- \"$OPTS\"\n\n# Obtain values\nwhile true;\
    \ do\n  case \"$1\" in\n    -c | --count ) count=\"$2\"; shift 2;;\n    -k | --keyword\
    \ ) keyword=\"$2\"; shift 2;;\n    -- ) shift; break ;;\n    * ) break ;;\n  esac\n\
    done\n\n# Check internet connection\nwget -q --spider http://source.unsplash.com/\n\
    if [ $? -ne 0 ]; then\n    echo \"Unsplash is not reachable. Check your Internet\
    \ connection.\"\n    exit 1\nfi\n\n# If no keyword specified, check whether the\
    \ keyword_list file exists\n# and pick a random word from the file.\n# If the\
    \ keyword_list file doesn't exist, use the default keyword\nif [ -z \"$keyword\"\
    \ ]; then\n    if [ ! -f \"$keyword_list\" ]; then\n    keyword=$default_keyword\n\
    \    else\n    keyword=$(shuf -n 1 \"$keyword_list\")\n    fi\nfi\n\n# If the\
    \ count value is empty, use the default count\nif [ -z \"$count\" ]; then\n  \
    \  count=$default_count\nfi\n\n# Check whether the unspiration directory exists\n\
    # Remove and create if the directory already exists\n# Create it if the directory\
    \ doesn't exist\n# Switch to the created directory\nif [ -d \"$undir\" ]; then\n\
    \    rm -rf \"$undir\"\n    mkdir \"$undir\"\n    cd \"$undir\"\nelse\n    mkdir\
    \ \"$undir\"\n    cd \"$undir\"\nfi\n\n# Determine screen resolution to fetch\
    \ photos in the correct size\nsize=$(xdpyinfo | grep dimensions | awk '{print\
    \ $2}')\n\n# Fetch the specified number of random photos matching the given keyword\
    \ from Unsplash\n# Sleep interval is necessary for Unsplash randomizer\ni=1\n\
    while [ $i -le \"$count\" ]\ndo\n    wget https://source.unsplash.com/$size/?\"\
    $keyword\" -O $i-\"$keyword\".jpg\n    i=$((i + 1))\n    sleep 3\ndone\n\n# Generate\
    \ an animated GIF using the fetched photos\nconvert -delay 300 -loop 0 *.jpg \"\
    $keyword\"-inspiration.gif\n\n# Open the animated GIF in the default image viewer\n\
    xdg-open \"$keyword\"-inspiration.gif\n```\n\nThis script performs a number of\
    \ tasks and offers a degree of customization. First, it checks whether the required\
    \ packages are installed. The script requires two parameters: the number of photos\
    \ to download (`-c` or `--count`) and the keyword (`-k` or `--keyword`). To deploy\
    \ the script, paste it into a text file and save it under the `unbash` name. Use\
    \ the following commands to move the script and make it executable:\n\n```bash\n\
    sudo mv unbash /local/bin/unbash\nsudo chown root:root /local/bin/unbash\nsudo\
    \ chmod 755 /local/bin/unbash\n```\n\nYou can then launch the script by running\
    \ `unbash -c COUNT -k KEYWORD` (replace `COUNT` and `KEYWORD` with the desired\
    \ number and keyword). Alternatively, create the `keywords.txt` file containing\
    \ a list of desired keywords in your home directory, and run `unbash -c COUNT`\
    \ command.\n"
