  trans: "\n一旦代码上传到开发板，设备即可开始工作。最后一步是将创建的 Wi-Fi 红外遥控器连接到现有的 Wi-Fi 网络。为此，请将你的 Linux\
    \ 机器或移动设备连接到开发板创建的热点。这会自动重定向到强制性门户（captive portal），允许你将开发板连接到现有的无线网络。完成此后，确保你用于操作遥控器的设备与开发板连接到同一个无线网络。然后将你设备上的浏览器指向遥控器的\
    \ IP 地址，你就能看到它的 Web 界面。\n\n在你的 Sony Alpha 相机上，启用遥控功能。在 Sony α6300 (ILCE-6300)\
    \ 上，请按下 `MENU` 按钮，进入 `Settings → 3 → Remote Ctrl`，并选择 `On`。确保遥控器与相机的红外端口之间没有遮挡，并在\
    \ Web 界面中按下 `SHUTTER` 按钮。如果一切正常，这将触发相机的快门。\n\n# 使用 Sony Camera Remote API 从 Linux\
    \ 控制 Sony Alpha 相机\n\n通过 USB 连接从 Linux 机器控制数码相机并不是新鲜事，像 `gPhoto`、`Entangle` 和\
    \ `Darktable` 这样的应用程序让你能够轻松实现这一点。但快门同步（tethered shooting）既过时又有些不切实际，因为它要求机器和相机之间建立物理连接。幸运的是，最新的相机型号支持通过\
    \ Wi-Fi 进行远程控制，提供了一种更灵活的远程拍摄方式。不过在大多数情况下，你会使用 Android 或 iOS 设备上的专用应用程序来利用这一功能。幸运的是，像\
    \ Sony 等制造商支持相机遥控 API，该 API 可用于在几乎任何平台上构建通过 Wi-Fi 远程控制的第三方应用程序和工具。\n\n对于 Sony\
    \ Alpha 型号，Smart Remote Control 应用会将相机转换为一个自有的无线热点和一个服务器，用于接收并解析带有 JSON 格式负载的入站\
    \ HTTP 调用。这些负载包含了控制相机及其设置的指令。从实际角度来说，你可以通过发送包含 JSON 格式数据的 HTTP 调用，通过直接无线连接从任何设备控制\
    \ Sony 相机。这种技术的术，并被许多流行的脚本和编程语言支持。\n\n在 Linux 上，你只需要 `Bash` 壳脚本和 [cURL](https://curl.haxx.se/)\
    \ 工具即可构建简单或更高级的脚本来远程控制你的 Sony Alpha 相机。但在继续之前，请务必查阅[相机兼容性](https://developer.sony.com/develop/cameras/)页面以确保你的特定相机型号受支持。\n\
    \n## 准备工作\n\n第一步是在 Linux 机器和相机之间建立直接无线连接。在相机上，按下 `Menu` 按钮，切换到 `Application List`\
    \ 部分并启动 Smart Remote Control 应用。切换到 `Connect with password` 页面，使用提供的连接信息将 Linux\
    \ 机器连接到相机的热点。为了与通信并控制相机，你需要知道它的端点 URL，即发送 JSON-RPC HTTP 请求的 URL。通常，Sony 相机的端点\
    \ URL 为 `http://192.168.122.1:8080/sony/camera`。但你特定的相机型号可能会使用不同的端点 URL。要找到它，你可以使用一个简单的\
    \ Python 脚本：\n\n```python\n#!/usr/bin/env python\nimport sys\nimport socket\n\
    import re\nimport urllib2\nSSDP_ADDR = \"239.255.255.250\";\nSSDP_PORT = 1900;\n\
    SSDP_MX = 1;\nSSDP_ST = \"urn:schemas-sony-com:service:ScalarWebAPI:1\";\nssdpRequest\
    \ = \"M-SEARCH * HTTP/1.1\\r\\n\" + \\\n                \"HOST: %s:%d\\r\\n\"\
    \ % (SSDP_ADDR, SSDP_PORT) + \\\n                \"MAN: \\\"ssdp:discover\\\"\\\
    r\\n\" + \\\n                \"MX: %d\\r\\n\" % (SSDP_MX, ) + \\\n           \
    \     \"ST: %s\\r\\n\" % (SSDP_ST, ) + \"\\r\\n\";\nsock = socket.socket(socket.AF_INET,\
    \ socket.SOCK_DGRAM)\nsock.sendto(ssdpRequest, (SSDP_ADDR, SSDP_PORT))\nRESULT\
    \ = sock.recv(1000)\nURL=re.search(\"(?P<url>http?://[^\\s]+)\", RESULT).group(\"\
    url\")\nRESPONSE = urllib2.urlopen(URL)\n```\n"
- fmt: "\nThe Camera Remote API also makes it possible to control practically all\
    \ camera settings: from aperture and shutter speed, to white balance and shooting\
    \ mode. All you need to do is to send a JSON-PRC HTTP request with `method` and\
    \ `params` containing the appropriate values. For example, the command below sets\
    \ the aperture value to 11:\n\n```\ncurl -s -X POST -d '{\"method\":\"setFNumber\"\
    ,\"params\":[\"11\"],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\n```\n\nTo specify the desired aperture value on the fly, use the\
    \ `read -p` command:\n\n```bash\nread -p \"Specify F number: \" fnumber\ncurl\
    \ -s -X POST -d '{\"method\":\"setFNumber\",\"params\":[\"'\"$fnumber\"'\"],\"\
    id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    ```\n\n## Add GUI with YAD\n\nTo make the remote camera control script more comfortable\
    \ in use, you might want to wrap it up into a graphical interface. While you can\
    \ use [Zenity](https://help.gnome.org/users/zenity/stable/) or [Kdialog](https://techbase.kde.org/Development/Tutorials/Shell_Scripting_with_KDE_Dialogs)\
    \ to create simple dialogs, [YAD](https://sourceforge.net/projects/yad-dialog/)\
    \ is a much better tool for the job, as it allows you to build complex dialogs\
    \ containing multiple fields and widgets. The following command, for example,\
    \ generates a dialog window with three text input fields for specifying the aperture,\
    \ shutter speed, and ISO values:\n\n```bash\nyad --width=400 --title=\"Sony Camera\
    \ Remote\" --form --separator=\",\" --field=\"Shutter Speed\" --field=\"ISO\"\n\
    ```\n\nHere is the complete listing of the Bash shell script that checks the connection\
    \ to the camera, displays a dialog window, processes the collected input, changes\
    \ camera settings, and takes a photo:\n\n```bash\n#!/usr/bin/env bash\nif [ -z\
    \ \"$(which yad)\" ]; then\n  echo \"Please install YAD. To do this on Ubuntu,\
    \ run the following command:\"\n  echo \"sudo apt install yad\"\n  exit 1\nfi\n\
    ping -W 1 -c 2 192.168.122.1 > /dev/null\nif test $? -eq 1\nthen\n    echo \"\
    Camera is not connected!\" | yad --text-info\n    exit 1\nfi\nresult=$(yad --width=400\
    \ --title=\"Sony Camera Remote\" --form --separator=\",\" --field=\"Aperture\"\
    \ --field=\"Shutter Speed\" --field=\"ISO\")\nexposuremode=$(echo \"$result\"\
    \ | cut -d',' -f1)\nfnumber=$(echo \"$result\" | cut -d',' -f2)\nshutterspeed=$(echo\
    \ \"$result\" | cut -d',' -f3)\niso=$(echo \"$result\" | cut -d',' -f4)\nif [\
    \ -z $result ]; then\n  exit 1\nfi\ncurl -s -X POST -d '{\"method\":\"startRecMode\"\
    ,\"params\":[],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\nsleep 5\ncurl -s -X POST -d '{\"method\":\"setExposureMode\",\"\
    params\":[\"$exposuremode\"],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\ncurl -s -X POST -d '{\"method\":\"setFNumber\",\"params\":[\"$fnumber\"\
    ],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"setShutterSpeed\",\"params\":[\"$shutterspeed\"\
    ],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"setIsoSpeedRate\",\"params\":[\"$iso\"],\"id\"\
    :1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"actTakePicture\",\"params\":[],\"id\":1,\"version\"\
    : \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\ncurl -s -X POST\
    \ -d '{\"method\":\"stopRecMode\",\"params\":[],\"id\":1,\"version\": \"1.0\"\
    }' http://192.168.122.1:8080/sony/camera > /dev/null\necho \"All done!\" | yad\
    \ --text-info\n```\n\nThe ability to control the camera and trigger the shutter\
    \ remotely as well as program the camera operations opens a whole new world of\
    \ possibilities. For example, you can create a relatively simple Bash shell script\
    \ for time-lapse photography:\n\n```bash\n#!/usr/bin/env bash\nif [ $# -eq 0 ]\n\
    then\n    echo \"Error: missing arguments\"\n    echo \"Syntax: [interval] [number\
    \ of Photos]\"\n    exit 1\nfi\ninterval=$1\nn=$2\nping -W 1 -c 2 192.168.122.1\
    \ > /dev/null\nif test $? -eq 1\nthen\n    echo \"Error: camera is not connected!\"\
    \n    exit\nfi\nbegin(){\n    curl -s -X POST -d '{\"method\":\"startRecMode\"\
    ,\"params\":[],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\n    resposta=$?\n    if test $resposta -ne 0\n    then\n      \
    \  echo \"Connection failed.\"\n        curl -X POST -d '{\"method\":\"stopRecMode\"\
    ,\"params\":[],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\n    else\n        echo -e \"\\nConnection established.\"\n    fi\n\
    }\nend(){\n    curl -s -X POST -d '{\"method\":\"stopRecMode\",\"params\":[],\"\
    id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    }\ntakePhoto(){\n    echo -e \"Taking photo...\"\n    curl -s -X POST -d '{\"\
    method\":\"actTakePicture\",\"params\":[],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\n    echo \"Done.\"\n}\nbegin\nsleep 3;\ntime=`date +%s`\ntime=`expr\
    \ $time + $interval * $n`\necho \"The timelapse will end at ``date +%H:%M:%S\\\
    `\"\nfor (( i = 0; i < $n; i++ ))\ndo\n    takePhoto\n    sleep $interval\ndone\n\
    end\n```\n\n## Brief note on using Python\n\nIf you prefer to use Python instead\
    \ of the Bash shell to control the camera, you’ll be pleased to learn that the\
    \ `requests` Python module makes it supremely easy to send JSON-RPC calls. The\
    \ easiest way to install the module is through the PIP package manager. On Ubuntu,\
    \ this can be done using the following commands:\n\n```bash\nsudo apt install\
    \ python-pip\nsudo pip install requests\n```\n\nAnd here is an example Python\
    \ script that takes a single photo:\n\n```python\n#!/usr/bin/env python\nimport\
    \ requests\nimport time\nrequests.post('http://192.168.122.1:8080/sony/camera',\
    \ json={\"method\":\"startRecMode\",\"params\":[],\"id\":1,\"version\": \"1.0\"\
    })\ntime.sleep(2)\nrequests.post('http://192.168.122.1:8080/sony/camera', json={\"\
    method\":\"actTakePicture\",\"params\":[],\"id\":1,\"version\": \"1.0\"})\nrequests.post('http://192.168.122.1:8080/sony/camera',\
    \ json={\"method\":\"stopRecMode\",\"params\":[],\"id\":1,\"version\": \"1.0\"\
    })\n```\n\n# Extend Sony Alpha camera functionality with Sony-PMCA-RE\n\nUpdating\
    \ firmware and installing additional apps on a Sony Alpha camera usually requires\
    \ going through the Sony PlayMemories desktop software. In addition to being rather\
    \ cumbersome in use, it only runs on Windows and macOS X. [Sony-PMCA-RE](https://github.com/ma1co/Sony-PMCA-RE)\
    \ provides a nimble alternative that runs on Linux (as well as on Windows and\
    \ mac OS X) and allows you to sideload apps, bypassing the official [PlayMemories](https://www.playmemoriescameraapps.com/)\
    \ service. Although, the project doesn’t provide ready-to-use binaries for Linux,\
    \ deploying Sony-PMCA-RE on a Linux system is not particularly difficult. You\
    \ need to install the required packages, clone the project’s Git repository, create\
    \ a Python virtual environment, and install the required Python packages. To do\
    \ this on openSUSE, run the following commands:\n\n```bash\nsudo zypper in python3\
    \ python3-virtualenv python3-pip\ngit clone https://github.com/ma1co/Sony-PMCA-RE.git\n\
    cd Sony-PMCA-RE\npython3 -m venv .env\nsource .env/bin/activate\npip install -r\
    \ requirements.txt\n```\n\nConnect then your camera and turn it on. Run the `./pmca-gui.py`\
    \ command to launch a graphical version of the tool. In the **Camera Info** section,\
    \ press **Get camera info**. If the camera has been recognized, you should see\
    \ basic info about the camera, including model, serial number, and firmware version.\n\
    \n![](media/file33.jpg)\n\nInstalling apps on the camera using the graphical tool\
    \ is rather straightforward. Switch to the **Install app** section, select the\
    \ desired app from the drop-down list of all available apps, and press **Install\
    \ selected app**. Once the app has been installed, you’ll find it under the **Application\
    \ List** section of your camera. You can uninstall any sideloaded app in a regular\
    \ manner in the **App Management** section.\n"
  raw: "The Camera Remote API also makes it possible to control practically all camera\
    \ settings: from aperture and shutter speed, to white balance and shooting mode.\
    \ All you need to do is to send a JSON-PRC HTTP request with `method` and `params`\
    \ containing the appropriate values. For example, the command below sets the aperture\
    \ value to 11:\n\n```\ncurl -s -X POST -d '{\"method\":\"setFNumber\",\"params\"\
    :[\"11\"],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\n```\n\nTo specify the desired aperture value on the fly, use the\
    \ `read -p` command:\n\n```\nread -p \"Specify F number: \" fnumber\ncurl -s -X\
    \ POST -d '{\"method\":\"setFNumber\",\"params\":[\"'\"$fnumber\"'\"],\"id\":1,\"\
    version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n```\n\n\
    ## Add GUI with YAD\n\nTo make the remote camera control script more comfortable\
    \ in use, you might want to wrap it up into a graphical interface. While you can\
    \ use [Zenity](https://help.gnome.org/users/zenity/stable/) or [Kdialog](https://techbase.kde.org/Development/Tutorials/Shell_Scripting_with_KDE_Dialogs)\
    \ to create simple dialogs, [YAD](https://sourceforge.net/projects/yad-dialog/)\
    \ is a much better tool for the job, as it allows you to build complex dialogs\
    \ containing multiple fields and widgets. The following command, for example,\
    \ generates a dialog window with three text input fields for specifying the aperture,\
    \ shutter speed, and ISO values:\n\n```\nyad --width=400 --title=\"Sony Camera\
    \ Remote\" --form --separator=\",\" --field=\"Shutter Speed\" --field=\"ISO\"\n\
    ```\n\nHere is the complete listing of the Bash shell script that checks the connection\
    \ to the camera, displays a dialog window, processes the collected input, changes\
    \ camera settings, and takes a photo:\n\n```\n#!/usr/bin/env bash\nif [ -z \"\
    $(which yad)\" ]; then\n  echo \"Please install YAD. To do this on Ubuntu, run\
    \ the following command:\"\n  echo \"sudo apt install yad\"\n  exit 1\nfi\nping\
    \ -W 1 -c 2 192.168.122.1 > /dev/null\nif test $? -eq 1\nthen\n    echo \"Camera\
    \ is not connected!\" | yad --text-info\n    exit 1\nfi\nresult=$(yad --width=400\
    \ --title=\"Sony Camera Remote\" --form --separator=\",\" --field=\"Aperture\"\
    \ --field=\"Shutter Speed\" --field=\"ISO\")\nexposuremode=$(echo \"$result\"\
    \ | cut -d',' -f1)\nfnumber=$(echo \"$result\" | cut -d',' -f2)\nshutterspeed=$(echo\
    \ \"$result\" | cut -d',' -f3)\niso=$(echo \"$result\" | cut -d',' -f4)\nif [\
    \ -z $result ]; then\n  exit 1\nfi\ncurl -s -X POST -d '{\"method\":\"startRecMode\"\
    ,\"params\":[],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\nsleep 5\ncurl -s -X POST -d '{\"method\":\"setExposureMode\",\"\
    params\":[\"$exposuremode\"],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\ncurl -s -X POST -d '{\"method\":\"setFNumber\",\"params\":[\"$fnumber\"\
    ],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"setShutterSpeed\",\"params\":[\"$shutterspeed\"\
    ],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"setIsoSpeedRate\",\"params\":[\"$iso\"],\"id\"\
    :1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"actTakePicture\",\"params\":[],\"id\":1,\"version\"\
    : \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\ncurl -s -X POST\
    \ -d '{\"method\":\"stopRecMode\",\"params\":[],\"id\":1,\"version\": \"1.0\"\
    }' http://192.168.122.1:8080/sony/camera > /dev/null\necho \"All done!\" | yad\
    \ --text-info\n```\n\nThe ability to control the camera and trigger the shutter\
    \ remotely as well as program the camera operations opens a whole new world of\
    \ possibilities. For example, you can create a relatively simple Bash shell script\
    \ for time-lapse photography:\n\n```\n#!/usr/bin/env bash\nif [ $# -eq 0 ]\nthen\n\
    \    echo \"Error: missing arguments\"\n    echo \"Syntax: [interval(seconds)]\
    \ [number of Photos]\"\n    exit 1\nfi\ninterval=$1\nn=$2\nping -W 1 -c 2 192.168.122.1\
    \ > /dev/null\nif test $? -eq 1\nthen\n    echo \"Error: camera is not connected!\"\
    \n    exit\nfi\nbegin(){\n    curl -s -X POST -d '{\"method\":\"startRecMode\"\
    ,\"params\":[],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\n    resposta=$?\n    if test $resposta -ne 0\n    then\n      \
    \  echo \"Connection failed.\"\n        curl -X POST -d '{\"method\":\"stopRecMode\"\
    ,\"params\":[],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\n    else\n        echo -e \"\\nConnection stablished.\"\n    fi\n\
    }\nend(){\n    curl -s -X POST -d '{\"method\":\"stopRecMode\",\"params\":[],\"\
    id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    }\ntakePhoto(){\n    echo -e \"Taking photo... \\c\"\n    curl -s -X POST -d '{\"\
    method\":\"actTakePicture\",\"params\":[],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera\
    \ > /dev/null\n    echo \"Done.\"\n}\nbegin\nsleep 3;\ntime=`date +%s`\ntime=`expr\
    \ $time + $interval \\* $n + 10`\necho \"\"\necho \"The timelapse will end at\
    \ \"`date --date=@$time +%H:%M:%S`\"\"\necho \"\"\nfor (( i = 0; i < $n; i++ ))\n\
    do\n    takePhoto\n    sleep $interval\ndone\nend\n```\n\n## Brief note on using\
    \ Python\n\nIf you prefer to use Python instead of the Bash shell to control the\
    \ camera, you’ll be pleased to learn that the *requests* Python module makes it\
    \ supremely easy to send JSON-RPC HTTP calls. The easiest way to install the module\
    \ is through the PIP package manager. On Ubuntu, this can be done using the following\
    \ commands:\n\n```\nsudo apt install python-pip\nsudo pip install requests\n```\n\
    \nAnd here is an example Python script that takes a single photo:\n\n```\n[](#cb121-1)#!/usr/bin/env\
    \ python\n[](#cb121-2)import requests\n[](#cb121-3)import time\n[](#cb121-4)requests.post('http://192.168.122.1:8080/sony/camera',\
    \ json={\"method\":\"startRecMode\",\"params\":[],\"id\":1,\"version\": \"1.0\"\
    })\n[](#cb121-5)time.sleep(2)\n[](#cb121-6)requests.post('http://192.168.122.1:8080/sony/camera',\
    \ json={\"method\":\"actTakePicture\",\"params\":[],\"id\":1,\"version\": \"1.0\"\
    })\n[](#cb121-7)requests.post('http://192.168.122.1:8080/sony/camera', json={\"\
    method\":\"stopRecMode\",\"params\":[],\"id\":1,\"version\": \"1.0\"})\n```\n\n\
    # Extend Sony Alpha camera functionality with Sony-PMCA-RE\n\nUpdating firmware\
    \ and installing additional apps on a Sony Alpha camera usually requires going\
    \ through the Sony PlayMemories desktop software. In addition to being rather\
    \ cumbersome in use, it only runs on Windows and macOS X. [Sony-PMCA-RE](https://github.com/ma1co/Sony-PMCA-RE)\
    \ provides a nimble alternative that runs on Linux (as well as on Windows and\
    \ mac OS X) and allows you to sideload apps, bypassing the official [PlayMemories](https://www.playmemoriescameraapps.com/)\
    \ service. Although, the project doesn’t provide ready-to-use binaries for Linux,\
    \ deploying Sony-PMCA-RE on a Linux system is not particularly difficult. You\
    \ need to install the required packages, clone the project’s Git repository, create\
    \ a Python virtual environment, and install the required Python packages. To do\
    \ this on openSUSE, run the following commands:\n\n```\nsudo zypper in python3\
    \ python3-virtualenv python3-pip\ngit clone https://github.com/ma1co/Sony-PMCA-RE.git\n\
    cd Sony-PMCA-RE\npython3 -m venv .env\nsource .env/bin/activate\npip install -r\
    \ requirements.txt\n```\n\nConnect then your camera and turn it on. Run the `./pmca-gui.py`\
    \ command to launch a graphical version of the tool. In the **Camera Info** section,\
    \ press **Get camera info**. If the camera has been recognized, you should see\
    \ basic info about the camera, including model, serial number, and firmware version.\n\
    \n![](media/file33.jpg)\n\nInstalling apps on the camera using the graphical tool\
    \ is rather straightforward. Switch to the **Install app** section, select the\
    \ desired app from the drop-down list of all available apps, and press **Install\
    \ selected app**. Once the app has been installed, you’ll find it under the **Application\
    \ List** section of your camera. You can uninstall any sideloaded app in a regular\
    \ manner in the **App Management** section.\n\n# Using FTP feature in Sony α7\
    \ Mark III"
