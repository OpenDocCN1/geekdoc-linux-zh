  trans: "\n创建一个 Hald CLUT 表，在 digiKam 中打开它并应用所需的曲线、色调和饱和度调整。将修改后的表保存为 PNG 格式，大功告成。下次你想将创建的摄影效果应用到照片时，使用\
    \ `convert` 工具根据创建的 Hald CLUT 表进行图像转换。更好的是，这种技术允许将相同的效果应用到多张照片。以下命令使用 Hald CLUT\
    \ 表转换多个 JPEG 格式的照片：\n\n```\nfor file in *.jpg; do echo \"$file\"; convert \"$file\"\
    \ hald-9.png -hald-clut \"$file\"; done\n```\n\n## 应用多个 Hald CLUT 预设的 Shell 脚本\n\
    \nHald CLUT 文件提供了一种简单的方法，可以通过单个命令对图像进行颜色校正：\n\n```\nconvert foo.JPG hald-9.png\
    \ -hald-clut foo-modified.jpeg\n```\n\n但如果你有一组 Hald CLUT 文件并想将它们全部应用到特定的照片上呢？一个简单的\
    \ Bash Shell 脚本可以自动化这个原本繁琐的任务：\n\n```bash\n#!/usr/bin/env bash\nif [ -z \"$1\"\
    \ ]; then\n  echo \"Specify the required parameter.\"\n  exit 1\nfi\ndir=\"hald-clut\"\
    \nif [ ! -d \"$dir\" ]; then\n  mkdir -p \"$dir\"\nfi\nfor file in *.png; do\n\
    \  prefix=\"${file%.*}\"\n  bname=$(basename \"$1\")\n  echo \"Applying $file\
    \ Hald-CLUT ...\"\n  convert \"$1\" \"$file\" -hald-clut \"$dir/$prefix-$bname\"\
    \ndone\n```\n\n该脚本逐一选取当前工作目录下的 `*.png` Hald CLUT 文件并将其应用到指定的图像文件。修改后的文件保存在独立的\
    \ `hald-clut` 目录中，每个文件都以所应用的 Hald CLUT 文件的命名前缀。\n\n以下是其在实践中的操作方法。首先，将上述代码粘贴到文本文件中并保存为\
    \ `hald-clut`。然后使用以下命令将创建的文件复制到 `/usr/local/bin/` 目录并使脚本具有可执行权限：\n\n```\nsudo\
    \ cp hald-clut /usr/local/bin/\nsudo chown root:root /usr/local/bin/hald-clut\n\
    sudo chmod 755 /usr/local/bin/hald-clut\n```\n\n现在，假设你想将 `hald-clut-files` 中所有的\
    \ Hald-CLUT 预设应用到 `foo.JPG` 文件。在终端中，切换到该目录并运行 `hald-clut path/to/foo.JPG` 命令（将\
    \ `path/to/foo.JPG` 替换为文件的实际路径）。这将所有预设应用到 `foo.JPG` 图像并将结果保存在 `hald-clut-files/hald-clut`\
    \ 目录下。\n\n## 使用 Lilut 使用 Hald CLUT 预设\n\n如果你刚好在使用 digiKam、RAWTherapee 或任何支持 Hald\
    \ CLUT 的照片编辑应用程序，你可能已经有很多喜欢的预设。但如果你在无法访问照片编辑程序的情况下也想使用这些预设怎么办？[Lilut](https://gitlab.com/dmpop/lilut)\
    \ 来来救场。这个基于 PHP 的简单工具允许从任何设备上传照片并应用任何可用的 Hald CLUT 预设。\n\n![](img/file25.jpg)\n\
    \nLilut 可以在任何带有 PHP 的 Web 服务器上运行。唯一的额外要求是在服务器上安装 `php-imagick` 软件包。如果你的服务器运行基于\
    \ Debian 的 Linux 发行版，可以使用 `sudo apt-get install php-imagick` 命令安装该包。在 openSUSE\
    \ 上，命令是 `sudo zypper in php7-imagick`。默认 PHP 配置将上传文件的大小限制为 2MB。要更改设置，请打开 `php.ini`\
    \ 文件进行编辑（例如 `sudo nano /etc/php7/cli/php.ini`）并调整 `upload_max_filesize` 参数的值。\n\
    \n要部署 Lilut，使用以下命令克隆 Git 仓库：\n\n```\ngit clone https://gitlab.com/dmpop/lilut.git\n\
    ```\n\n或者，获取最后的源码作为 ZIP 文件并解压下载的压缩包。将你的 Hald CLUT 文件放入 `luts` 文件夹，并将整个 `lilut`\
    \ 目录移动到 Web 服务器的文档根。然后将浏览器指向 `127.0.0.1/lilut`（将 `127.0.0.1` 替换为服务器的实际 IP 地址或域名），你就能看到\
    \ Lilut 的主页。\n\n# 备份与恢复\n\n备份不仅仅是在外部硬盘上保留一份照片库的副本。你还应该考虑实现云备份系统，以及在外出时保持照片安全的解决方案。\n\
    \n## 使用 rclone 进行云备份\n\n如今云存储非常廉价了，而且有很多存储供应商可以选择。因此，没有理由不建立异地备份系统来确保文件安全。不过，有一个遗憾：许多云存储服务希望你使用它们专有的图形客户端应用程序。更糟糕的是有些服务根本不提供\
    \ Linux 客户端。幸运的是有 [rclone](http://rclone.org/)，这是一个可以与许多云交互的小型开源工具。\n\n### 安装\
    \ rclone\n\nrclone 用 Go 编写，以自包含二进制文件的形式发行，没有依赖项，并可以在 x86、AMD64 和 ARM 平台上运行。安装\
    \ rclone 并不困难，但需要一些手动操作。从项目网站获取最新版本，解压缩包后进入该目录。将执行文件复制到 `/usr/local/bin/` 并更改文件权限：\n\
    \n```\nsudo cp rclone /usr/local/bin/\nsudo chown root:root /usr/local/bin/rclone\n\
    sudo chmod 755 /usr/local/bin/rclone\n```\n\n要安装 rclone 的帮助文档，运行以下命令：\n\n```\n\
    sudo mkdir -p /usr/local/share/man/man1\nsudo cp rclone.1 /usr/local/share/man/man1/\n\
    sudo mandb\n```\n\n### 在 Android 上安装 rclone\n\nAndroid 设备也可以安装并运行 rclone。在 Android\
    \ 上部署 rclone 需要 [Termux](https://termux.com/) 应用，因此首要任务是从 Google Play 或 F-Droid\
    \ 安装它。启动 Termux 并运行以下命令安装 rclone：\n\n```\npkg update\npkg install golang git\n\
    export GOPATH=`pwd``/go\nmkdir go\ngo get -u -v github.com/ncw/rclone\n```\n\n\
    使用 `./go/bin/rclone version` 命令确认 rclone 已安装。开启 Android 存储访问：\n\n```\npkg install\
    \ termux-api\npkg termux-storage-setup\n```\n\n### 配置 rclone\n\n为了让 rclone 与你的云存储服务配合，你需要创建一个配置文件。该工具拥有特殊的\
    \ `config` 子命令允许你完成此操作。假设你想让 rclone 使用 [Amazon Drive](https://www.amazon.com/clouddrive/)\
    \ 服务。运行 `rclone config` 命令，在提示设置配置密码时按 **n**，并为配置文件命名为 `remote`。在支持的服务列表中输入 Amazon\
    \ Drive 对应的数字。保持 `Amazon Application Client Id` 和 `Amazon Application Client Secret`\
    \ 为空，选择自动配置选项。这将打开默认浏览器并获取访问令牌。检查并确认生成的设置，大功完成。\n\nrclone 配置完成后，运行 `rclone lsd\
    \ remote:` 命令即可返回所有容器。\n"
- fmt: "\n`rclone` supports a few simple subcommands and options that allow you to\
    \ access, manage, and use the remote storage. And the `copy` and `sync` subcommands\
    \ are probably the most important among them. As the name suggests, the `copy`\
    \ subcommand copies the contents of the source directory to the remote destination.\
    \ This subcommand doesn’t transfer unchanged files (it checks them by size, modification\
    \ time, and `md5sum` hashes), and it doesn’t delete files from the destination\
    \ directory. If the destination directory doesn’t exist, `rclone` automatically\
    \ creates it. Most `rclone` commands have the simple `rclone [OPTION] [SUBCOMMAND]\
    \ <source> <destination>` syntax, and here is what the command that copies the\
    \ contents of a specified directory to the remote destination looks like:\n\n\
    ```\nrclone copy /path/to/source remote:destination\n```\n\nSimilar to `copy`,\
    \ the `sync` subcommand transfers files from the source directory to the destination,\
    \ skipping unchanged files. But when `sync` encounters files that don’t exist\
    \ in the source directory, the subcommand deletes them from the destination. In\
    \ other words, `sync` keeps both source and destination directories in sync by\
    \ modifying the destination. Since this operation (and other rclone actions for\
    \ that matter) is irreversible, it makes sense to test it first, and `rclone`\
    \ provides the handy `--dry-run` option for that. Add this option to the `rclone\
    \ sync` command to check what files will be copied and deleted:\n\n```\nrclone\
    \ --dry-run sync /path/to/source remote:destination\n```\n\nThe `check` subcommand\
    \ can come in handy when you need to ensure that the files in the source and destination\
    \ directories match:\n\n```\nrclone check /path/to/source remote:destination\n\
    ```\n\nThis command compares files by their sizes and `md5sum` hashes, and then\
    \ shows a list of files that don’t match.\n\nBesides `copy` and `sync`, `rclone`\
    \ supports several subcommands that let you view and manage remote storage. The\
    \ `lsd` subcommand, for example, can be used to list all directories (also called\
    \ containers and buckets) in the remote destination, while the `ls` subcommand\
    \ shows all files in a specified remote directory:\n\n```\nrclone lsd remote:\n\
    rclone ls remote:dir\n```\n\nNeed to create or delete a remote directory? Use\
    \ the `mkdir` and `rmdir` subcommands for that:\n\n```\nrclone mkdir remote:new_dir\n\
    rclone rmdir remote:old_dir\n```\n\nThe last command can remove a directory only\
    \ if it’s empty. If you want to delete a directory and its contents, use the `purge`\
    \ subcommand:\n\n```\nrclone purge remote:old_dir\n```\n\nBeing a command-line\
    \ tool, `rclone` supports a number of options that control its behavior. The `--bwlimit`\
    \ option, for example, lets you limit the bandwidth available to `rclone`. This\
    \ can be useful when the machine running `rclone` shares the Internet connections\
    \ with other clients. Limiting the bandwidth ensures that other machines can access\
    \ the Internet at a reasonable speed during the copy or sync operations. The bandwidth\
    \ limit can be specified in kilobytes, megabytes, or gigabytes using the `k`,\
    \ `M`, and `G` suffixes:\n\n```\nrclone --bwlimit=15M sync /path/to/source remote:destination\n\
    ```\n\nThe command above limits the bandwidth to 15MBytes/s.\n\nThe `--dry-run`\
    \ option has been mentioned earlier, and it allows you to test `rclone` operations\
    \ without applying any changes. Finally, if you run `rclone` unattended, you might\
    \ want to use the `--log-file` option to save `rclone`’s output to a file for\
    \ later reference:\n\n```\nrclone --log-file=rclone.log sync /path/to/source remote:destination\n\
    ```\n\n### Use filters in rclone\n\nFiltering options and patterns in `rclone`\
    \ can be used to configure `rclone` to skip certain files and directories. Filtering\
    \ rules in `rclone` work with most commands, including `copy` and `sync`. A filtering\
    \ rule in `rclone` consists of two parts: an exclude or include subcommand and\
    \ a filtering pattern. `rclone` features four filtering subcommands: `--exclude`,\
    \ `--exclude-from`, `--include`, and `--include-from`. The first two commands\
    \ can be used to exclude files, while the other two let you limit the current\
    \ operation only to the specified files. The `--exclude` subcommand allows you\
    \ to specify the filtering pattern in-line, for example:\n\n```\nrclone --exclude\
    \ *.NEF sync /path/to/source remote:destination\n```\n\nThis command syncs everything\
    \ except the RAW files with the `*.NEF` extension. Instead of specifying a filtering\
    \ rule on the fly, you can save a list of filtering patterns in a text file and\
    \ use the `--exclude-from` subcommand with it:\n\n```\nrclone --exclude-from=filters.txt\
    \ copy /path/to/source remote:destination\n```\n\nThe `--include` command can\
    \ come in useful when you need to limit `rclone` to a specific subset of files.\
    \ For example, if you want to sync TIFF and JPEG files in a directory and skip\
    \ the rest, the following filtering rule does the job:\n\n```\nrclone --include\
    \ *.{tif,jpg} copy /path/to/source remote:destination\n```\n\nSimilar to `--exclude-from`,\
    \ the `--include-from` command can read filtering patterns from a text file.\n\
    \nUsing the exclude and include subcommands, you can create filtering rules that\
    \ either skip or include matching files. But what if you need to create a set\
    \ of filters that combines both? Then the `--filter-from` subcommand is what you\
    \ need. This subcommand reads a text file containing include and exclude filtering\
    \ rules and applies them to the current `rclone` operation:\n\n```\nrclone --filter-from=filters.txt\
    \ sync /path/to/source remote:destination\n```\n\nEach line in the specified files\
    \ contains a filtering rule that starts with either `+` (include) or `-` (exclude)\
    \ prefix, for example:\n\n```\n+ *.jpeg\n+ *.tiff\n- *.MP4\n- *.xmp\n```\n\nAs\
    \ you may have noticed, filtering patterns in `rclone` are based on wild cards.\
    \ While they are not as powerful as regular expressions, wild cards are significantly\
    \ easier to master. And if you used wild cards when working from the line, you\
    \ won’t have problems composing filtering rules for `rclone`.\n\n## Detect rot\
    \ in photos and RAW files\n\nBackup will help you to keep your photos safe, but\
    \ it won’t solve another issue — data rot (also known as data decay and [data\
    \ degradation](https://www.wikiwand.com/en/Data_degradation)). Data rot can occur\
    \ for a number of reasons, but the result is always the same: data corruption\
    \ due to one or changed bits in the file. Usually data decay happens silently,\
    \ so you probably won’t realize it happened before it’s too late. One way to combat\
    \ data rot is to make sure that your have healthy backup which you can use to\
    \ restore the corrupted files and ensure that the damaged file doesn’t propagates\
    \ to all your up copies. This means that you need to check your photos and RAW\
    \ files for data rot and detect corrupted files before you perform backup, and\
    \ a simple Bash shell script can help you with that.\n\n```bash\n#!/usr/bin/env\
    \ bash\nshopt -s nullglob\nfor file in *.JPG *.jpeg *.ARW; do\n    if [ ! -f \"\
    $file.sha1\" ]; then\n       sha1sum \"$file\" > \"$file.sha1\"\n    fi\n    sha1sum\
    \ -c \"$file.sha1\" | grep \"FAILED\"\ndone\n```\n\nDuring the initial run, the\
    \ script generates hash files using the SHA1 hash algorithm for each photo and\
    \ RAW file in the current directory. The example above handles files with the\
    \ *.JPG*, *.jpeg*, and *.ARW extensions, but you can add any other file extension\
    \ you need. When you run the script again, it compares the current checksum with\
    \ the saved one. If they don’t match, then the file in question is either modified\
    \ or damaged. If the former case (e.g., you’ve edited a photo or RAW file), just\
    \ delete the related *.sha1* file. But if you haven’t modified the photo or RAW\
    \ file in any way, the checksum mismatch indicates that the file might be corrupted.\
    \ In this case, replace it with a healthy copy from a backup.\n\n## Recover photos\
    \ with PhotoRec\n"
