    # Geotag JPEG files using reference photo


    Sometime the easiest way to geotag JPEG files is to use geographical coordinates
    from an already geotagged photo. One way to do this is to use digiKam. While it’s
    not particularly difficult, this procedure requires a few separate steps. A can
    streamline the entire process.


    ```

    [](#cb129-1)#!/usr/bin/env bash

    [](#cb129-2)ref="$1"

    [](#cb129-3)lat=$(exiftool -gpslatitude -n "$ref" | cut -d":" -f2 | tr -d " ")

    [](#cb129-4)lon=$(exiftool -gpslongitude -n "$ref" | cut -d":" -f2 | tr -d " ")

    [](#cb129-5)if [ -z "$lat" ] || [ -z "$lon" ]; then

    [](#cb129-6)    notify-send "Geographical coordinates are missing."

    [](#cb129-7)    exit 1

    [](#cb129-8)else

    [](#cb129-9)    notify-send $lat $lon

    [](#cb129-10)fi

    [](#cb129-11)if (( $(echo "$lat > 0" |bc -l) )); then

    [](#cb129-12)    latref="N"

    [](#cb129-13)else

    [](#cb129-14)    latref="S"

    [](#cb129-15)fi

    [](#cb129-16)if (( $(echo "$lon > 0" |bc -l) )); then

    [](#cb129-17)    lonref="E"

    [](#cb129-18)else

    [](#cb129-19)    lonref="W"

    [](#cb129-20)fi

    [](#cb129-21)f=$(yad --center --text-align=center --title="Photos to geotag" --button=gtk-cancel:0
    \

    [](#cb129-22)    --button="Geotag":0 --borders=15 --width=250 --height=150 \

    [](#cb129-23)    --text=''<big>\nDrop photos you want to geotag  here.\nPress
    the <b>Geotag</b> button.</big>'' \

    [](#cb129-24)    --dnd | sed ''s/^.......//'')

    [](#cb129-25)array=("$f")

    [](#cb129-26)for file in ${array[*]}

    [](#cb129-27)do

    [](#cb129-28)    exiftool -overwrite_original -GPSLatitude=$lat -GPSLatitudeRef=$latref
    -GPSLongitude=$lon -GPSLongitudeRef=$lonref "$file"

    [](#cb129-29)done

    [](#cb129-30)notify-send "All done. Bye!"

    ```


    Here is how the script works. Using *ExifTool*, it obtains latitude and longitude
    values from the photo which file name was provided as a command parameter. If
    it fails to get geographical coordinates (i.e., the `$lat` and `$lon` values are
    empty), it show a notification and stops. If obtaining geographical coordinates
    was successful, the script uses the *bc* tool to calculate correct latitude and
    longitude references required for geotagging. The script then displays a drag-and-drop
    panel, when you drop photos you want to geotag. When you press the **Geotag**
    button, the script geotags the selected photos.


    To make the described script work, you need to install the *ExifTool*, *bc*, *notify-send*,
    and *yad* tools on your system. To do this on Ubuntu, run the `sudo apt install
    libimage-exiftool-perl bc libnotify-bin yad`. On openSUSE, use the `sudo zypper
    in exiftool bc libnotify-bin yad` command.


    Copy the script and paste it in a new text file. Save the file under the *geotagref.sh*
    name and make it executable using the `chmod +x geotagref.sh` command. Move then
    the script to the *~/bin* directory. To geotag photos run the script followed
    by the path and file name of the reference photo: `geotagref.sh /path/to/foo.jpg`


    # Take a stroll down memory lane with Natsukashii


    Services like Amazon Photos, Facebook, and Google Photos can help you rediscover
    your photos and relive your memories by showing photos taken on a specific day
    in the past. But there is no need to upload your photos to third-party services
    to enjoy this clever feature. [Natsukashii](https://gitlab.com/dmpop/natsukashii),
    a Bash shell script, can search photos on your machine and generate a simple HTML
    page with the found photos for your viewing pleasure. It can also send a notification
    to your Android device through the [Notify](https://github.com/mashlol/notify)
    app.


    Deploying Natsukashii on the Linux machine that has all your photos is easy. First,
    make sure that you have the ExifTool, Git, sed, and seq tools installed on your
    system. Next, use the following command to clone the project’s repository, and
    create an alias, so you can run Natsukashii using the `natsukashii` command:


    ```

    git clone https://gitlab.com/dmpop/natsukashii.git

    echo -e "\nalias natsukashii=/share/homes/admin/natsukashii/natsukashii.sh" >>
    .bashrc

    ```


    If the machine running Natsukashii also acts a web server, you can use Natsukashii
    to publish the photos it finds. To do this, move the *www* folder to the document
    root of your web server. You might want to give the *www* folder a different name,
    for example *natsukashii*.


    If you want to receive notifications from Natsukashii on your Android device,
    install the [Notify](https://github.com/mashlol/notify) app, and note the generated
    unique token.


    Now run the `natsukashii` command, and specify the required settings. After that,
    Natsukashii goes through the specified directory, and if it finds matching photos,
    it puts them into a separate directory. If you’ve specified the path to the web
    directory, Natsukashii moves the found photos there, and you can view them by
    pointing a browser to the correct URL.


    ![](media/file34.jpg)


    When using Natsukashii, keep in mind that the script is not particularly fast.
    This is because the script needs to find all photos that match the specified file
    extension. It then goes through each photo, extracting its date and comparing
    the date with the given one. And this may take a while, depending on the number
    of photos you have.


    While you can run Natsukashii manually, it makes sense to set up a cron job that
    executes the script daily. To do this, run the `crontab -e` command and add the
    following cron job:


    ```

    @daily /absolute/path/to/natsukashii.sh

    ```


    Save the changes, and you are done.


    ## Install Natsukashii on a QNAP NAS


    Since Natsukashii is just a regular shell script that relies on standard Linux
    tools, it can be deployed on practically any machine running Linux. This includes
    network-attached storage (NAS) appliances like QNAP. To deploy Natsukashii on
    a QNAP appliance, install [Entware](https://github.com/Entware/Entware) (see [Install
    on QNAP NAS](https://github.com/Entware/Entware/wiki/Install-on-QNAP-NAS). Run
    then the commands below to install the required packages:


    ```

    opkg update

    opkg install git git-http screen perl-image-exiftool sed coreutils-seq imagemagick
    imagemagick-tools imagemagick-jpeg

    ```


    Switch then to the folder in your home directory, and clone the project’s Git
    repository using the following command:


    ```

    git clone https://gitlab.com/dmpop/natsukashii.git

    ```


    Switch then to the *natsukashii* directory and run the `./natsukashii.sh` command.


    Creating a cron job on QNAP is slightly different from the standard procedure.
    Open the */etc/config/crontab* file in a text editor, and add the following cron
    job:


    ```

    @daily /bin/sh /absolute/path/to/natsukashii.sh

    ```


    Save the changes and restart the cron service using the `/etc/init.d/crond.sh
    restart` command.


    ## Add password protection to Natsukashii


    Natsukashii is designed to publish all photos that match the current date, even
    private ones. If you don’t feel like letting the entire world see all your photos,
    you might want to protect access to the page generated by Natsukashii with a user
    name and password. If you are using the Apache web server with the htaccess functionality
    enabled, you can add password protection using *.htpasswd* and *.htaccess* files.


    To generate the *.htpasswd* file, run the following command on your server (replace
    */path/to/server/doc/root* with the actual path to the document root of the web
    server, e.g., */var/www* or */var/www/html*. Replace *user* with the desired user
    name):


    ```

    htpasswd -c /path/to/server/doc/root .htpasswd user

    ```


    When prompted, specify the desired password.


    Create a new text file and paste the following code into it:


    ```

    AuthType Basic

    AuthName "Natsukashii"

    AuthUserFile /path/to/server/doc/root/.htpasswd

    require valid-user

    ```'
