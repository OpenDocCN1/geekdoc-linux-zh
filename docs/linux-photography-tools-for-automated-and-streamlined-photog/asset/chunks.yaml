    transfer photos and RAW files from your camera into the application as well as
    process and organize them on the fly. In fact, the **Import** interface box offers
    a few clever features that allow you to configure the import operation. In the
    **File Renaming Options** section in the **Settings** right sidebar, you can define
    a custom rule which renames all incoming photos. Say, you want to rename imported
    photos using their date and time info pulled from EXIF metadata. Enable the **Customize**
    option and select the *Date & Time* item from the **Options** drop-down list.
    From the drop-down list next to the **Format** field, select the desired date
    and time format. The available options include Standard, ISO, Text, UnixTimeStamp,
    and Custom. The latter allows you to specify your own data and time format. For
    example, enter the *yyyyMMdd-hhmmss* rule in the **Format** field to rename photos
    as follows: *19730917-175735*.


    ![](media/file14.jpg)


    The options available in the **Auto-creation of Albums** section can come in handy
    in several situations. If you are downloading photos taken on different dates,
    enable the **Date-based sub-albums** option and choose the desired date format.
