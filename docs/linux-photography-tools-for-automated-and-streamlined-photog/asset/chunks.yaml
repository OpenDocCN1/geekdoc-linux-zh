  trans: '

    Darktable 采用非破坏性编辑，这意味着没有任何编辑操作会直接应用于照片。相反，所有的编辑信息都保存在一个 `*.xmp` 文件中，原始照片保持不变。编辑操作会以列表的形式显示在
    `history`（历史）面板中，你可以通过选择列表中的任何一个步骤来恢复到之前的状态。其巧妙之处在于，你可以将历史堆栈转换为一种样式（style），这样你就可以一步到位对其他照片应用完全相同的操作。要将当前的历史堆栈转换为样式，请点击位于
    `compress history stack`（压缩历史堆栈）旁边的 `create a style`（创建样式）按钮。为新样式命名并添加描述。保存样式后，你就可以在
    `lighttable`（工作台）界面中将其应用到任何照片。Darktable 还允许你将编辑后照片的当前状态保存为快照。但请记住，这些快照不是持久性的，因此当你关闭应用程序时它们就会消失。


    中间的查看区域提供了当前处理照片的大型预览。面板底部的缩略图条让你快速从当前胶卷中选择照片并打开它进行编辑。你还可以使用缩略图条为照片分配星级评分，主面板顶部的工具栏允许对照片应用颜色标签并根据不同的标准过滤照片。


    右侧边栏充当工具箱，存放了各种工具面板。Darktable 中的面板被视为模块（modules），你可以根据意愿随时启用或禁用它们。这允许你自定义工作空间以适应你特定的摄影需求。Darktable
    默认仅启用了几个关键模块，但你可以通过在 `more modules`（更多模块）面板中选择你喜欢的来轻松启用其他模块。为了方便跟踪 Darktable 提供的众多工具，所有面板都被组织成几组，如
    `basic`（基础）、`color`（颜色）、`correction`（校正）和 `effect`（效果）。


    每个模块都包含若干可以调整的参数。例如，`sharpen`（锐化）模块允许你调整三个关键参数：radius（半径）、amount（强度）和 threshold（阈值）。如果你对结果不满意，可以点击面板右上角的
    `reset parameters`（重置参数）按钮重置所有参数。你还可以将当前的参数值保存为预设（preset），然后轻松地将其应用到其他照片。要保存预设，请点击
    `presets`（预设）按钮，选择 `store new preset`（存储新预设）命令，并为新预设命名。Darktable 可以将创建的预应用于符合特定标准的照片。例如，你可以配置锐化预设，应用于所有具有特定
    ISO（例如 ISO `1600` 及以上）的照片。要此操作，勾选 `auto apply this preset to matching images`（自动将此预设应用于匹配的图像）复选框，并在
    `ISO` 部分指定所需的值。


    ## Darktable 模块


    Darktable 自带了大量的模块，让你能够执行各种处理操作：从简单的裁剪和旋转到色调映射（tone mapping）和色彩区域调整等高级操作。大多数模块的使用非常直观，你可以通过尝试可用的参数来熟悉它们。更棒的是，像
    `equalizer`（均衡器）和 `graduated density`（渐变密度）等模块带有几个默认预设，因此你无需反复调整不同的参数即可使用这些工具。


    除了 `base curve`（基础曲线）、`exposure`（曝光）、`white balance`（白平衡）和 `crop and rotate`（裁剪与旋转）等基本模块外，Darktable
    还提供了一些实用的工具，可以帮助你以最小的改进照片。例如，`velvia` 模块通过增加照片中低饱和区域的饱和度来增强色彩，而 `bloom`（光晕）工具则在亮区域添加或强调光晕（这种效果对于具有锐利高光的照片，如夜晚的路灯，效果最佳）。正如其名所示，`zone
    system`（区域系统）模块基于安塞尔·亚当斯和弗雷德·阿彻开发的区域系统技术。使用该模块，你可以调整照片特定部分的对比度。`monochrome`（单色）模块在你需要将彩色照片转换为黑白照片时非常有用，而
    `graduated density` 模块允许你模拟不同的 GND 滤镜。


    ![](img/file12.jpg)


    `Color zones`（色彩区域）是另一个智能模块，可以帮助你调整特定颜色的饱和度和亮度，而不影响照片中的其他颜色。尽管背后有复杂的处理，但该模块的使用非常简单。首先，你必须选择想要调整的颜色。要为此，切换到
    `hue`（色相）部分，点击 `eye dropper`（吸管）按钮，并使用鼠标在照片上选择所需的颜色区域。你应该能在 `color zones` 面板的颜色表中看到一条黑色垂直线。这条线标记了颜色表中的选定颜色。要增加饱和度，点击
    `saturation`（饱和度）标签，并使用鼠标向上拖动水平线直到它与黑线交叉。同样地，你可以在 `lightness`（亮度）部分调整所选颜色的亮度。


    ![](img/file13.jpg)


    ## 导出处理过的照片


    一旦 RAW 文件处理完成，切换回 `lighttable` 界面以导出结果照片。`export selected`（导出选中）面板允许你配置导出设置，包括目标、文件格式、大小和色彩配置。除了能够将照片导出到硬盘外，Darktable
    还可以将选定的照片上传到你的 Flickr 或 Picasa Web Albums 账户，并通过电子邮件发送。该应用程序支持多种图形格式，包括 8-bit
    JPG、8/16-bit PNG 和 8/16-bit TIFF。在 `target storage`（目标存储）部分，你还可以定义规则来自动生成目标路径，使用如
    `$(FILE_NAME)`、`$(PICTURES_FOLDER)`、`$(HOUR)`、`$(DAY)`、`$(MONTH)` 等变量（将鼠标悬停在目标路径上可以查看变量列表）。例如，`$(HOME_FOLDER)/$(FILE_NAME)`
    规则将以原始名称将照片保存到用户目录下。


    # 使用 digiKam 管理照片


    在某种程度上，digiKam 是一个被低估的应用。许多 Linux 用户可能听说它是管理照片集的不错工具，但他们可能不知道 digiKam 有更先进的功能，以及它涵盖了整个摄影流程。这篇文章介绍了
    digiKam 的一些关键功能，并展示了如何使用它们建立完整的工作流，包括导入、组织和编辑照片及 RAW 文件。


    ## digiKam AppImage 包


    如果你想尝试最新版本的 digiKam，你需要从第三方仓库安装或从源码编译应用程序。还有第三种选择：使用 digiKam AppImage 包。这是一个包含所需文件和库的单一文件。这意味着你无需安装任何：从项目网站获取最新的
    AppImage 包，使用 `chmod +x digikam-x.x.x.appimage` 使下载的文件变为可执行，然后双击该文件启动 digiKam。

