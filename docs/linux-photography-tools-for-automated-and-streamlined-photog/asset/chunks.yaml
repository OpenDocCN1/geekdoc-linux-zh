    \ -v convert)\" ]; then\n  function annotate(){\n  fnumber=$(exiftool -aperture\
    \ $1 | cut -d':' -f2)\n  exposure=$(exiftool -shutterspeed $1 | cut -d':' -f2)\n\
    \  iso=$(exiftool -iso $1 | cut -d':' -f2)\n  convert $1 -gravity South -background\
    \ Black \\\n  -font mononoki-Regular -pointsize 50 -fill White \\\n  -splice 0x54\
    \ -annotate 0x0 \"Aperture:$fnumber Shutter speed:$exposure ISO:$iso\"  exif_$1\n\
    \  xdg-open exif_$1\n  }\nfi\n```\n\nIn this case, the function uses the [Mononoki](https://madmalik.github.io/mononoki/)\
    \ font for the caption, but you can replace it with any other font installed on\
    \ your system. To list all fonts that you can use, run the `convert -list fonts`\
    \ command. To add a caption to a photo, run the `annotate /path/to/foo.JPG` command\
    \ (replace */path/to/foo.JPG* with the actual path and filename of the photo).\n\
    \nOf course, you can tweak the script to fit your specific needs. For example,\
    \ you can replace the EXIF info with a copyright notice, or modify the function\
    \ to add an arbitrary text on-the-fly.\n\n## Show geotagged photos on OpenStreetMap\n\
    \nWant to show on the map the place where you took a specific photo? Provided\
    \ that the photo is geotagged, the simple function below will do the job:\n\n\
    ```\nif [ -x \"$(command -v exiftool)\" ] ; then\n  function show-on-osm(){\n\
    \    lat=`exiftool -n -p '$GPSlatitude' $1`\n    lon=`exiftool -n -p '$GPSlongitude'\
    \ $1`\n    osm=\"http://www.openstreetmap.org/?mlat=$lat&mlon=$lon&zoom=18\"\n\
    \    xdg-open $osm\n  }\nfi\n```\n\nThe function extracts latitude and longitude\
    \ values from the photo’s EXIF metadata, creates an OpenStreetMap URL, and opens\
    \ it in the default browser.\n\nFor the function to work, you need to install\
    \ the *ExifTool* on your system. Add the function to the *~/.bashrc* file, and\
    \ use the `show-on-osm foo.JPG` command to show the photo you want on OpenStreetMap\
    \ (replace *foo.JPG* with the actual name of the desired photo).\n\n# Faster access\
    \ to image processing actions via context menus\n\nUsing the service menus feature\
    \ in KDE, you can add useful commands to the **Actions** entry context menu in\
    \ Dolphin. For example, you might want to resize photos before sharing them. But\
    \ instead of switching to the terminal and running a command like `convert photo.jpg\
    \ -resize 1600x1600> resized-photo.jpg` every time you need to optimize a photo,\
    \ you can create a service menu that allows you to quickly resize images from\
    \ the convenience of the Dolphin file manager. Create a text file and paste the\
    \ following service menu definition in it:\n\n```\n[Desktop Entry]\nType=Service\n\
    ServiceTypes=KonqPopupMenu/Plugin\nMimeType=image/png;image/jpeg;image/png;image/JPG;image/png;image/jpg;\n\
    Actions=ResizeLarge\n[Desktop Action ResizeLarge]\nName= Resize to 1600px\nExec=mogrify\
    \ -resize \"1600x1600>\" %f\nIcon=image-x-applix-graphics\n```\n\nTo limit the\
    \ menu to certain image formats, you can specify them in the *MimeType* part.\
    \ In the example above, the action will work only with JPEG and PNG images.\n\n\
    Save the file under the *resize.desktop* name and move it to */usr/share/kservices5/ServiceMenus*\
    \ (create *ServiceMenus* directory manually if it doesn’t exist):\n\n```\nsudo\
    \ cp resize.desktop /usr/share/kservices5/ServiceMenus/\n```\n\nOpen Dolphin,\
    \ right-click on a JPG or PNG image file, and select the **Actions → Resize to\
    \ 1600px** action to resize the image.\n\nUsing this simple technique, you can\
    \ add all sorts of context commands. For example, you can define an action that\
    \ recompresses JPEG photos using the [jpeg-recompress](https://github.com/danielgtaylor/jpeg-archive)\
    \ tool:\n\n```\n[Desktop Entry]\nType=Service\nServiceTypes=KonqPopupMenu/Plugin\n\
    MimeType=image/jpeg;image/JPG;image/jpg;\nActions=JPEGRecompress\n[Desktop Action\
    \ JPEGRecompress]\nName= Recompress\nExec=jpeg-recompress %f %f\nIcon=image-x-applix-graphics\n\
    ```\n\n![](media/file2.jpg)\n\nDolphin is not the only file browser that supports\
    \ user-defined actions. If you happen to use Nautilus as your preferred file browser,\
    \ you can add commands by placing executable scripts in the *~/.local/share/nautilus/scripts*\
    \ directory. In addition to popular languages like Python and Perl, you can use\
    \ good old Bash to write scripts. When a script is called, Nautilus automatically\
    \ sets a handful of variables that can be used in the script. Here is a simple\
    \ Bash script that uses the *mogrify* tool to resize the currently selected image\
    \ files:\n\n```\n#!/bin/bash\nFILE=`echo $NAUTILUS_SCRIPT_SELECTED_URIS | sed\
    \ 's@file://@@g'`\nmogrify -resize \"1600x1600>\" $FILE\n```\n\nThe script obtains\
    \ full file paths via the `$NAUTILUS_SCRIPT_SELECTED_URIS` variable and uses the\
    \ sed tool to remove the leading *file://* string from them. Save the script under\
    \ a descriptive name like *Resize*, make it executable using the `chmod +x Resize`\
    \ command, and place the script into the *~/.local/share/nautilus/scripts* directory.\
    \ You can then run the script by right-clicking on selected files in Nautilus\
    \ and choosing the **Scripts → Resize** item in the context menu.\n\n## Compare\
    \ photos with ImageMagick and a KDE service menu action\n\nNeed to compare two\
    \ photos side-by-side? Using the convert tool, you can quickly stitch two or more\
    \ photos together and compare the result in any image viewer:\n\n```\nconvert\
    \ photo1.jpg photo2.jpg +append compare.jpg\n```\n\nThe command above stitches\
    \ *photo1.jpg* and *photo2.jpg* from left to right (i.e. *photo1.jpg* + *photo2.jpg*),\
    \ but you can use `-append` instead of `+append` to reverse the order (i.e. *photo2.jpg*\
    \ + *photo1.jpg*). In both cases, the stitched image is saved as the *compare.jpg*\
    \ file in the JPEG format.\n\nIf you use KDE as your preferred graphical desktop\
    \ environment, you can create a context action to stitch file pairs in the Dolphin\
    \ file manager. Create a text file and paste the following code into it:\n\n```\n\
    [Desktop Entry]\nType=Service\nServiceTypes=KonqPopupMenu/Plugin\nMimeType=image/JPG;image/JPEG;image/jpeg;image/JPG;image/jpg;\n\
    Actions=Compare\n[Desktop Action Compare]\nName=Compare Photos\nExec=convert %F\
    \ +append compare.jpg\nIcon=image-x-applix-graphics\n```\n\nSave the file under\
    \ the *compare.desktop* name and move it to */usr/share/kservices5/ServiceMenus*:\n\
    \n```\nsudo cp compare.desktop /usr/share/kservices5/ServiceMenu/\n```\n\nOpen\
    \ Dolphin, select a pair of JPEG files you want to compare, right-click on the\
    \ selection, and choose the **Actions → Compare Photos** action to resize the\
    \ image. You can then use your preferred image viewer to open the resulting *compare.jpg*\
    \ file and examine the photos.\n\n# Efficient JPEG compression with jpeg-recompress"
