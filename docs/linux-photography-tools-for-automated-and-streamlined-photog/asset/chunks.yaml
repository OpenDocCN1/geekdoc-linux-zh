  trans: "\n```\nif [ -x \"$(command -v mogrify)\" ] ; then\n  function makegif()\
    \ {\n    ext=${1:-JPG}\n    dimension=${2:-800}\n    quality=${3:-95}\n    output=${4:-\"\
    foo.gif\"}\n    delay=${5:-120}\n    mogrify -resize \"$dimension\"x *.\"$ext\"\
    \n    convert -delay \"$delay\" -loop 0 *\"$ext\" \"$output\"\n  }\nfi\n```\n\n\
    下次当你想将一组照片转换为动画 GIF 时，切换到包含照片的目录，并运行 `makegif` 命令。若要覆盖默认设置，可以指定所需的参数，例如：\n\n```\n\
    makegif jpeg 1600 90 foo-big.gif 180\n```\n\n## 为照片添加带有基础 EXIF 数据的说明\n\n在照片中添加包含光圈、快门速度和\
    \ ISO 等基础 EXIF 信息的说明，在很多情况下都非常有用。一个简单的 Bash 壳函数可以实现这一操作的自动化。该函数使用 `ExifTool` 和\
    \ `ImageMagick` 工具从指定的图像中提取 EXIF 数据，然后向图像添加包含提取的光圈、快门速度和 ISO 值的说明。\n\n```\nif\
    \ [ -x \"$(command -v exiftool)\" ] && [ -x \"$(command -v convert)\" ]; then\n\
    \  function annotate(){\n  fnumber=$(exiftool -aperture $1 | cut -d':' -f2)\n\
    \  exposure=$(exiftool -shutterspeed $1 | cut -d':' -f2)\n  iso=$(exiftool -iso\
    \ $1 | cut -d':' -f2)\n  convert $1 -gravity South -background Black \\\n  -font\
    \ mononoki-Regular -pointsize 50 -fill White \\\n  -splice 0x54 -annotate 0x0\
    \ \"Aperture:$fnumber Shutter speed:$exposure ISO:$iso\"  exif_$1\n  xdg-open\
    \ exif_$1\n  }\nfi\n```\n\n在这种情况下，该函数使用了 [Mononoki](https://madmalik.github.io/mononoki/)\
    \ 字体作为说明，但你可以将其替换为系统中安装的任何其他字体。要列出所有你可以使用的字体，请运行 `convert -list fonts` 命令。要为照片添加说明，请运行\
    \ `annotate /path/to/foo.JPG` 命令（将 `/path/to/foo.JPG` 替换为照片的实际路径和）。\n\n当然，你可以根据自己的特定需求调整脚本。例如，你可以将\
    \ EXIF 信息替换为版权声明，或者修改函数以动态添加任意文本。\n\n## 在 OpenStreetMap 上显示地理标记照片\n\n想在地图上显示你拍摄某张照片的地方吗？只要照片带有地理标记，下面这个简单的函数即可完成任务：\n\
    \n```\nif [ -x \"$(command -v exiftool)\" ] ; then\n  function show-on-osm(){\n\
    \    lat=`exiftool -n -p '$GPSlatitude' $1`\n    lon=`exiftool -n -p '$GPSlongitude'\
    \ $1`\n    osm=\"http://www.openstreetmap.org/?mlat=$lat&mlon=$lon&zoom=18\"\n\
    \    xdg-open $osm\n  }\nfi\n```\n\n该函数从照片的 EXIF 元数据中提取经纬度值，创建一个 OpenStreetMap\
    \ URL 并在默认浏览器中打开它。\n\n为了让该函数生效，你需要在系统上安装 `ExifTool`。将该函数添加到 `~/.bashrc` 文件中，并使用\
    \ `show-on-osm foo.JPG` 命令在 OpenStreetMap 上显示你想展示的照片（将 `foo.JPG` 替换为目标照片的实际名称）。\n\
    \n## 通过上下文菜单快速访问图像处理操作\n\n使用 KDE 的服务菜单（service menus）功能，你可以为 Dolphin 中的 `Actions`\
    \ 右键菜单添加实用的命令。例如，你可能想在共享照片之前调整其大小。但不必每次需要优化照片都切换到终端并运行类似 `convert photo.jpg -resize\
    \ 1600x1600> resized-photo.jpg` 的命令，你可以创建一个服务菜单，允许你在 Dolphin 文件管理器中方便地调整图像大小。创建一个文本文件并在其中粘贴以下服务菜单定义：\n\
    \n```\n[Desktop Entry]\nType=Service\nServiceTypes=KonqPopupMenu/Plugin\nMimeType=image/png;image/jpeg;image/png;image/JPG;image/png;image/jpg;\n\
    Actions=ResizeLarge\n[Desktop Action ResizeLarge]\nName= Resize to 1600px\nExec=mogrify\
    \ -resize \"1600x1600>\" %f\nIcon=image-x-applix-graphics\n```\n\n若要将菜单限制为某些图像格式，可以在\
    \ `MimeType` 部分指定它们。在上面的示例中，该操作仅适用于 JPEG 和 PNG 图像。\n\n将文件保存为 `resize.desktop`\
    \ 并将其移动到 `/usr/share/kservices5/ServiceMenus`（如果 `ServiceMenus` 目录不存在请手动创建）：\n\
    \n```\nsudo cp resize.desktop /usr/share/kservices5/ServiceMenus/\n```\n\n打开 Dolphin，右键点击\
    \ JPG 或 PNG 图像文件，并选择 `Actions → Resize to 1600px` 操作来调整图像大小。\n"
- fmt: "\nCompressing JPEG images is something most photographers try to avoid. After\
    \ all, JPEG is a lossy format, and reducing the size of a JPEG file inevitably\
    \ leads to loss of quality. But there are situations where compressing images\
    \ is the only option. For example, some photo sharing and printing services don’t\
    \ accept images that exceed a specific file size. And when embedding photos into\
    \ a blog article, you might want to compress them to save storage space.\n\nWhenever\
    \ you need to optimize JPEG files, [jpeg-recompress](https://github.com/danielgtaylor/jpeg-archive)\
    \ is just the tool for the job. `jpeg-recompress` can reduce the size of the target\
    \ file by 30-70% while keeping the perceived visual quality. To install `jpeg-recompress`,\
    \ download the latest release from [github.com/danielgtaylor/jpeg-archive/releases](https://github.com/danielgtaylor/jpeg-archive/releases).\
    \ Unpack the downloaded archive and make the `jpeg-recompress` binary executable\
    \ using the `chmod +x jpeg-recompress` command. Move then the binary file to the\
    \ `~/bin` directory.\n\n`jpeg-recompress` is rather straightforward in use. To\
    \ recompress a JPEG file using the default settings (the SSIM comparison method\
    \ and medium quality), run the `jpeg-recompress photo.jpg recompressed.jpg` command.\
    \ It’s also possible to specify various parameters, and you can list them along\
    \ with their brief descriptions using the `jpeg-recompress -h` command.\n\nIf\
    \ you plan to use the `jpeg-recompress` tool on a regular basis, add the following\
    \ function to the `~/.bashrc` file:\n\n```bash\nif [ -x \"$(command -v jpeg-recompress)\"\
    \ ] ; then\n  function recompress() {\n  jpeg-recompress --quality very high $1\
    \ re-$1\n  }\nfi\n```\n\nYou can then recompress a JPEG file using the `recompress\
    \ photo.jpg` command.\n\nWant to automatically recompress images as soon as they\
    \ are added to a specific directory? A simple Bash script below can help you with\
    \ that:\n\n```bash\n#!/usr/bin/env bash\n\nhelp(){\ncat <<EOF\n$0 [OPTIONS]\n\n\
    $0 recompresses JPEG files as soon as they are moved into the monitored directory\n\
    \nUsage:\n  $0 [IN] [OUT]\n\nOptions:\n IN    Directory to monitor\nOUT    Directory\
    \ to save the recompressed files\nEOF\n  exit 1\n}\n\nif [ -z \"$1\" ] || [ -z\
    \ \"$2\" ]; then\n  echo help\n  exit 1\nfi\n\nwhile true\ndo\ninotifywait -m\
    \ --format '%f' -e MOVED_TO $1 |\nwhile read FILE\n  do\n    jpeg-recompress $1/$FILE\
    \ $2/$FILE\n    notify-send \"$FILE has been recompressed\"\n  done\ndone\n```\n\
    \nThe script uses `inotify-tools` to monitor a directory and trigger the `jpeg-recompress`\
    \ command to process images as soon as they appear in the directory. To install\
    \ `inotify-tools` on openSUSE, run the `sudo zypper in inotify-tools` command.\
    \ The script requires two parameters: the path to the monitored directory and\
    \ the path the target directory. Note that the latter must not reside in the monitored\
    \ directory.\n\nPaste the code above into a new text file and save it under the\
    \ `monitor-recompress` name. Install then the script using the following commands:\n\
    \n```bash\nsudo cp monitor-recompress /usr/local/bin/\nsudo chown root:root /usr/local/bin/monitor-recompress\n\
    sudo chmod 755 /usr/local/bin/monitor-recompress\n```\n\nRun then the script using\
    \ the `monitor-recompress /path/to/source/dir /path/to/target/dir` command.\n\n\
    # Squeeze JPEG files with jpegoptim\n\nNeed to reduce the size of a JPEG file\
    \ with a minimum of effort? Use [jpegoptim](https://github.com/tjko/jpegoptim).\
    \ Feed `jpegoptim` a JPEG file, and this unassuming tool will reduce its size,\
    \ no questions asked.\n\nTo install the latest version of `jpegoptim`, you need\
    \ to compile it from source. Before you can do that, you need to install the `libjpeg`\
    \ library on your system. On openSUSE, this can be done using the `sudo zypper\
    \ in libjpeg8-devel` command. Once you’ve done that, run the following commands\
    \ to clone the project’s Git repository and install `jpegoptim`:\n\n```bash\n\
    git clone https://github.com/tjko/jpegoptim.git\ncd jpegoptim\n./configure\nmake\n\
    make strip\nsudo make install\n```\n\nThat’s all there is to it. To compress a\
    \ JPEG file, run the `jpegoptim foo.jpg` command (replace `foo.jp` with the actual\
    \ path and name of the JPEG file).\n\nBy default, `jpegoptim` uses the lossless\
    \ compression algorithm, but you can override this by specifying the maximum image\
    \ quality using the `--max` parameter. In addition to compressing the file, `jpegoptim`\
    \ can also remove metadata. The `--strip-exif` parameter, for example, removes\
    \ all EXIF data, while the `--strip-iptc` parameter removes IPTC data.\n\n`jpegoptim`\
    \ offers several other useful options, and you can view them all, along with their\
    \ explanations, using the `man jpegoptim` command.\n\n# Color management on Linux\n\
    \nThe purpose of color management is to produce consistent color output across\
    \ different devices. This definition might sound simple enough, but understanding\
    \ the mechanics of color management and implementing a color-managed workflow\
    \ can be a rather complex and at times confusing affair. The following description\
    \ can help you to get an understanding of color management fundamentals and set\
    \ up a color-managed environment using open source Linux tools.\n\n## Color management\
    \ in a nutshell\n\nThe need for color management arises from the fundamental problem\
    \ of color reproduction: a formal representation of a given color (e.g., numeric\
    \ value of the color in a specific color model) doesn’t necessarily produce the\
    \ same color on different devices due to a wide variety of factors. Thus the primary\
    \ goal of color management is to achieve a consistent color reproduction across\
    \ devices. So, for example, a photo taken by a color-managed camera should look\
    \ the same on a color-managed computer screen.\n\nIn a color-managed workflow,\
    \ each device such as a digital camera and LCD display has its own color profile\
    \ which characterizes the color response of that particular device. Each color\
    \ profile describes these colors relative to a standardized set of reference colors.\
    \ Color-managed software then uses these standardized profiles to translate color\
    \ from one device to another. This is usually performed by a color management\
    \ module ([Overview of color management by Cambridge in Colour](http://www.cambridgeincolour.com/tutorials/color-management1.htm))\n\
    \nColor profiles are closely related to the concept of color space. A color space\
    \ is a defined range of colors, or as Thom Hogan puts it, “a Color Space defines\
    \ what is possible.” ([Thom’s Quick & Dirty Guide to Color Management](http://www.bythom.com/qadcolor.htm)).\
    \ Put it in another way, a color space determines the color capabilities of a\
    \ device or application. While a color space contains color definitions, a color\
    \ profile describes the color input or output of a device.\n\nSince there are\
    \ several established color spaces, the question is which one you should choose.\
    \ A detailed answer to that question deserves a separate discussion, but the simple\
    \ truth is that the sRGB color space is adequate for general use. Developed specifically\
    \ for the Internet, sRGB is smaller compared to other color spaces (most notably\
    \ Adobe RGB), but it’s widely supported by manufacturers and developers, and it’s\
    \ a default color space on virtually any device and application that supports\
    \ color management. digiKam, for example, uses sRGB as its default working color\
    \ space (i.e., the color space in which color data is meant to be manipulated).\
    \ When choosing a color space, consider the following: 1) sRGB can’t be converted\
    \ to a larger color space like Adobe RGB (although the opposite is true: Adobe\
    \ RGB can be downsampled to sRGB), 2) there is no color space assigned to RAW\
    \ files, so if you expect to use different color spaces in your workflow, you\
    \ can use RAW originals to process photos in the desired color space.\n"
