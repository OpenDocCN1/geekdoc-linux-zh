    But what if you want to make highlights look warmer by increasing the amount of
    yellow? There is no `Yellow` channel in the `Curves` tool, so instead you need
    to consult the `HSV` color circle to determine which color you have to subtract
    to get yellow. To do this, look at the color opposite to yellow, which is blue.
    So to warm the highlights, you need to decrease the amount of blue by pushing
    the upper part of the curve in the `Blue` channel downwards.


    ## gThumb and RAW files


    Although gThumb is not designed to replace a dedicated RAW processing tool, the
    application does make it possible to preview RAW files, perform basic editing,
    and save the resulting photo in one of the supported formats. And in many cases,
    that’s all what many users will ever need. Working with RAW files in gThumb is
    no different from dealing with regular photos. The only thing you need to keep
    in mind is that after you’ve applied adjustments to a RAW file, you need to use
    the `Save as` command to save the edited photo in a supported format.


    ## Share photos with gThumb


    Want to share your photographic masterpieces with the world? The `Export` button
    on the main toolbar lets you upload photos to several popular photo sharing services
    like Flickr and Facebook. In addition to that, the application can also generate
    a static web album you can publish on your own website. And if you want to create
    collages to amuse your friends and family, the `Imagewall` export tool is just
    what you need.


    # Process RAW files with Darktable


    Photo management software like gThumb and digiKam can help you to process, organize,
    and manage your photos, but if your photographic workflow is built around RAW
    files, then you might consider a more specialized application like [Darktable](http://darktable.sourceforge.net/).
    This software darkroom offers a wide range of powerful tools for sorting and processing
    your digital negatives.


    Although Darktable is designed for serious amateurs and professional photographers
    alike, the application features an elegant and user-friendly interface that puts
    all the essential tools at your fingertips and makes it easy to get to grips with
    this powerful application. More importantly, Darktable relies on the `RawSpeed`
    decoder library which supports virtually any RAW variant out there, including
    CRW/CR2, NEF, RAF, DNG, and many others. Moreover, Darktable comes with custom-enhanced
    color matrices that provide better color rendition. And to reproduce the behavior
    of some camera sensors, the Darktable developers have reverse-engineered base
    curves (visit the [Camera Support](http://www.darktable.org/resources/camera-support/)
    page for a list of supported cameras).


    ## Install Darktable


    The first order of business is, of course, to install Darktable on your machine.
    Binary packages of Darktable are available for popular LInux distributions like
    Ubuntu, openSUSE, and Fedora, so installing the application on these distros is
    not particularly complicated. For Ubuntu users, the project provides two PPAs:
    the [Darktable Release PPA](https://launchpad.net/~pmjdebruijn/+archive/ubuntu/darktable-release)
    contains the current stable version of Darktable and the [Darktable Unstable PPA](https://launchpad.net/~pmjdebruijn/+archive/ubuntu/darktable-unstable)
    offers development versions of Darktable. Adding the desired PPA and installing
    Darktable from it is a matter of executing three simple commands in the terminal:


    ```

    sudo add-apt-repository ppa:pmjdebruijn/darktable-release-plus

    sudo apt update

    sudo apt install darktable

    ```


    ## Manage RAW files in the Light Table mode


    When you launch Darktable for the first time, you are automatically dropped into
    the `lighttable` interface designed for importing, sorting, and organizing RAW
    files. The `lighttable` interface offers several ways to import RAW files into
    the application. Use the `image` button in the `import` palette to grab a single
    photo, or press the `folder` button to import a directory containing RAW files
    as a film roll.


    ![](media/file10.jpg)


    The `collect images` palette provides tools for keeping tabs on the imported RAW
    files. By default, all RAW files are displayed as film rolls, but there are other
    options for you to choose from. For example, you can display RAW files by camera
    model. To do this, select the `camera` item from the drop-down list in the `collect
    images` palette. This can come in handy when you use several digital cameras with
    Darktable. Want to display photos taken on a given date? Select the `date` item
    from the drop-down list, and pick the desired item from a list of dates.


    Although the `lighttable` interface is geared towards sorting and filtering RAW
    files, it hides a rather nifty feature in the `selected images` palette. Press
    the `create hdr` button, and Darktable combines multiple images of the same subject
    with different exposures into a single file with an improved dynamic range.


    Darktable offers two handy features for triaging and sorting the imported RAW
    files: color labels and stars. Used in combination, they provides a flexible mechanism
    for organizing RAW files. How you use both features is completely up to you. For
    example, you can use stars to assign ratings to photos, and then use color labels
    to specify processing priority.


    No photo management application is complete without metadata editing and tagging
    capabilities, and Darktable is no exception. The `metadata editor` palette in
    the `lighttable` interface allows you to add and modify key information about
    the currently selected photo or a set of photos, including title, description,
    author, and rights. The `tagging` palette makes it possible to create, manage,
    and assign tags to the currently selected photos. This palette has two sections:
    the lower section is used to create and delete tags, while the upper section lets
    you attach or detach existing tags to the currently selected photos. The `collect
    images` palette mentioned earlier can also filter photos by metadata. Select,
    for example, the `tag` item from the drop-down list in the palette, and you should
    see a list of all available tags. Pick then the desired tag from the list to view
    the matching photos. In a similar manner, you can filter photos by title (the
    `title` item) and description (the `description` item).


    ![](media/file11.jpg)


    ## Process RAW files in the Darkroom mode


    Once you’ve added and organized RAW files, it’s time to process them. To open
    a RAW file for processing, double-click on it. This opens the file in the `darkroom`
    interface where you process your digital negatives. Similar to `lighttable`, all
    tools in the `darkroom` interface are grouped into palettes. The interface itself
    consists of two sidebars and a viewing area. The left sidebar holds palettes like
    `thumbnail` (displays the thumbnail of the currently processed photo), `snapshots`
    (lets you save the current version of the processed photo), `history` (contains
    a list of editing steps), and `image information` (displays key info about the
    photo).

