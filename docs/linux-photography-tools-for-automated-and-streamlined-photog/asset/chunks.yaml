    Choosing storage cards from respectable manufacturers like Transcend, SanDisk,
    and Lexar is the best way to ensure that you don’t lose RAW files and photos.
    But if disaster strikes, [Photorec](http://www.cgsecurity.org/wiki/PhotoRec) can
    save the day. This simple tool can recover files from damaged storage cards and
    bring back accidentally deleted files. PhotoRec is a part of the TestDisk package,
    and you can install it using the `sudo apt install testdisk` command. Although
    PhotoRec is a command-line tool, it’s supremely easy to use, and it gently guides
    you through the entire process of recovering data, providing easy-to-follow instructions
    along the way.


    To start a recovery operation, plug the storage card into your machine and run
    the `sudo photorec` command. Choose the storage card from the list of detected
    volumes and press `Proceed`. Select then the partition you want to recover and
    choose its format. Specify whether you want to recover data from the entire partition
    or from the unallocated space on it (this is the default option, and it’s a sensible
    first choice). Choose a path for storing recovered files, press `C`, and wait
    till the recovery process is finished. You will then find the recovered data in
    the `recup_dir.x` (where `x` is a number) directory in the specified path. This
    is pretty much all you need to know to successfully recover data with PhotoRec,
    but you’ll find additional info about the tool’s options on the [PhotoRec Step
    By Step](http://www.cgsecurity.org/wiki/PhotoRec_Step_By_Step) page.


    Despite its apparent simplicity, PhotoRec usually does a great job recovering
    data, so it makes an indispensable addition to your photographic toolbox.


    # Publish and share photos with Mejiro


    If you are looking for an uncomplicated and lightweight application for hosting
    photos on your own server, [Mejiro](http://dmpop.github.io/mejiro/) is right up
    your alley. Consisting of a single PHP file, Mejiro will happily run on any machine
    with a web server (e.g., Apache or lighttpd) and PHP, and the application is supremely
    easy to deploy and use.


    ![](media/file26.jpg)


    Although Mejiro is a rather minimalist application, it does offer useful functionality
    and creature comforts. The application features a responsive design, so it works
    well on mobile devices. Mejiro automatically extracts and displays basic EXIF
    info for each photo, including aperture, shutter speed, and ISO. In addition to
    that, the application parses IPTC metadata and displays keywords assigned to photos.
    For geotagged photos, Mejiro shows their exact locations on OpenStreetMap or Google
    Maps. You can add a description to each photo in an accompanying text file, and
    the application can also read and show descriptions from the photo’s `UserComment`
    EXIF field. Better still, Mejiro automatically detects the browser language and
    picks the description text file with the appropriate language prefix. Mejiro uses
    the [is.gd](http://is.gd/) service to generate short URLs for easy sharing. For
    each photo in the JPEG format, you can upload the accompanying RAW file, and Mejiro
    automatically adds a link to it.


    # Install Mejiro


    To host Mejiro, you need a Linux-based machine with the Apache service, PHP, and
    the GD library. You also need to install the cURL tool and Git. Mejiro should
    work with other servers like [nginx](http://nginx.org/), but it has only been
    tested with Apache and lighthttpd.


    ## Installation with the Apache server


    1. Install the required packages using the `sudo apt install apache2 php5 php5-gd
    git curl` command.

    2. In the terminal, switch to the root directory of the server (e.g., `/var/www/`)
    and use the `sudo git clone https://github.com/dmpop/mejiro.git` command to fetch
    the latest source code. Alternatively, you can download the ZIP archive and extract
    it into the document root of the server.

    3. Open the `index.php` file in a text editor and edit the settings. This step
    is optional.

    4. Make the `mejiro` directory writable by the server using the `sudo chown www-data
    -R mejiro` command.

    5. Put photos into the `photos` directory.

    6. Point the browser to `http://127.0.0.1/mejiro/`, and you should see the Mejiro
    page.


    ## Install Mejiro on Raspberry Pi


    Installing Mejiro on Raspberry Pi is a matter of executing the following commands
    in the terminal:


    ```

    wget https://raw.githubusercontent.com/dmpop/mejiro/master/install.sh

    chmod +x install.sh

    sudo ./install.sh

    ```


    These commands fetch the `install.sh` script, make the script executable, and
    then run the script.


    # Update Mejiro


    To update an existing Mejiro installation, replace the current `index.php` file
    with the latest one.


    If you installed Mejiro directly from the project’s GitHub repository using Git,
    switch to the Mejiro directory and run the following command:


    ```

    git pull origin master

    ```


    This command pulls the latest source code from the project’s GitHub repository.


    # Add photos to Mejiro


    To populate Mejiro with photos, you need to upload them into the `photos` directory.
    You can do this by pushing photos from a local machine via SSH or FTP, or by uploading
    photos from an Android device via a dedicated app.


    ## Upload photos via SSH


    The most straightforward way to upload photos from a Linux machine is to use the
    `scp` tool. To be able to use it, though, the server hosting Mejiro must run an
    SSH server. To copy a photo from a local machine to the server use the following
    command:


    ```

    scp /path/to/foo.jpg user@127.0.0.1:/var/www/mejiro/photos

    ```


    Replace `user` and `127.0.0.1` with the actual user name and IP address of the
    server.


    ## Use rsync to upload photos


    Instead of the `scp` tool, you can use the good old `rsync` utility to upload
    the contents of a directory to Mejiro. This allows you to push multiple photos
    with minimum of effort. For this solution to work, you need to install rsync on
    both the server and your machine. Use then the following command (replace `/path/to/dir`
    with the source folder):


    ```

    rsync -avhe ssh --progress /path/to/dir user@127.0.0.1:/var/www/mejiro/photos/

    ```


    ## Upload from Android with Ghost Commander


    Android-toting users can upload photos from their devices using the excellent
    [Ghost Commander](https://play.google.com/store/apps/details?id=com.ghostsq.commander)
    file manager. The app supports the FTP protocol out of the box. This means that
    if the machine that hosts Mejiro runs an FTP server, you can use the app straight
    away. To do this, launch Ghost Commander and tap the **Home** button at the bottom
    toolbar. Tap then the **FTP site** entry, provide the required connection info,
    and press **OK**.


    In case you want to upload files via SSH or SFTP, you need to install the [SFTP
    plugin to Ghost Commander](https://play.google.com/store/apps/details?id=com.ghostsq.commander.sftp).
    After you’ve done that, you can establish an SSH connection to the server using
    the **SFTP site** entry in the **Home** section.


    # Map photos with uMap and PHP


    If you happen to use a photo publishing application like [Mejiro](http://dmpop.github.io/mejiro/)
    that stores photos and their thumbnails in regular directories, you can automatically
    map your photos with [uMap](http://umap.openstreetmap.fr/) and a dash of PHP scripting.
    Better still, there is no need to write PHP code from scratch: you can use the
    script below as a starting point.

