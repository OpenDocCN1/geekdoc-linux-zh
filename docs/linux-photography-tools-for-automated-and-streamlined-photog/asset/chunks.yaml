  trans: "\n\nCamera Remote API 还允许你控制几乎所有的相机设置：从光圈、快门速度到白平衡和拍摄模式。你只需要发送一个包含适当值且带有\
    \ `method` 和 `params` 的 JSON-PRC HTTP 请求即可。例如，下面的命令将光圈值设置为 11：\n\n```\ncurl -s\
    \ -X POST -d '{\"method\":\"setFNumber\",\"params\":[\"11\"],\"id\":1,\"version\"\
    : \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n```\n\n若要即时指定所需的光圈值，请使用\
    \ `read -p` 命令：\n\n```bash\nread -p \"Specify F number: \" fnumber\ncurl -s -X\
    \ POST -d '{\"method\":\"setFNumber\",\"params\":[\"'\"$fnumber\"'\"],\"id\":1,\"\
    version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n```\n\n\
    ## 使用 YAD 添加 GUI\n\n为了让远程相机控制脚本用起来更方便，你可能想将其封装成图形界面。虽然你可以使用 [Zenity](https://help.gnome.org/users/zenity/stable/)\
    \ 或 [Kdialog](https://techbase.kde.org/Development/Tutorials/Shell_Scripting_with_KDE_Dialogs)\
    \ 创建简单的对话框，但 [YAD](https://sourceforge.net/projects/yad-dialog/) 是处理此任务的更好的工具，因为它允许你构建包含多个字段和控件的复杂对话框。例如，下面的命令生成了一个带有三个文本输入字段的对话窗口，用于指定光圈、快门速度和\
    \ ISO 值：\n\n```bash\nyad --width=400 --title=\"Sony Camera Remote\" --form --separator=\"\
    ,\" --field=\"Shutter Speed\" --field=\"ISO\"\n```\n\n以下是完整的 Bash Shell 脚本列表，它可以检查与相机的连接、显示对话窗口、处理收集到的输入、更改相机设置并拍照：\n\
    \n```bash\n#!/usr/bin/env bash\nif [ -z \"$(which yad)\" ]; then\n  echo \"Please\
    \ install YAD. To do this on Ubuntu, run the following command:\"\n  echo \"sudo\
    \ apt install yad\"\n  exit 1\nfi\nping -W 1 -c 2 192.168.122.1 > /dev/null\n\
    if test $? -eq 1\nthen\n    echo \"Camera is not connected!\" | yad --text-info\n\
    \    exit 1\nfi\nresult=$(yad --width=400 --title=\"Sony Camera Remote\" --form\
    \ --separator=\",\" --field=\"Aperture\" --field=\"Shutter Speed\" --field=\"\
    ISO\")\nexposuremode=$(echo \"$result\" | cut -d',' -f1)\nfnumber=$(echo \"$result\"\
    \ | cut -d',' -f2)\nshutterspeed=$(echo \"$result\" | cut -d',' -f3)\niso=$(echo\
    \ \"$result\" | cut -d',' -f4)\nif [ -z $result ]; then\n  exit 1\nfi\ncurl -s\
    \ -X POST -d '{\"method\":\"startRecMode\",\"params\":[],\"id\":1,\"version\"\
    : \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\nsleep 5\ncurl -s\
    \ -X POST -d '{\"method\":\"setExposureMode\",\"params\":[\"$exposuremode\"],\"\
    id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"setFNumber\",\"params\":[\"$fnumber\"],\"id\"\
    :1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"setShutterSpeed\",\"params\":[\"$shutterspeed\"\
    ],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"setIsoSpeedRate\",\"params\":[\"$iso\"],\"id\"\
    :1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    curl -s -X POST -d '{\"method\":\"actTakePicture\",\"params\":[],\"id\":1,\"version\"\
    : \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\ncurl -s -X POST\
    \ -d '{\"method\":\"stopRecMode\",\"params\":[],\"id\":1,\"version\": \"1.0\"\
    }' http://192.168.122.1:8080/sony/camera > /dev/null\necho \"All done!\" | yad\
    \ --text-info\n```\n\n远程控制相机并触发快门以及对相机操作进行编程开启了全新的可能性世界。例如，你可以为延时摄影创建一个相对简单的 Bash\
    \ Shell 脚本：\n\n```bash\n#!/usr/bin/env bash\nif [ $# -eq 0 ]\nthen\n    echo \"\
    Error: missing arguments\"\n    echo \"Syntax: [interval] [number of Photos]\"\
    \n    exit 1\nfi\ninterval=$1\nn=$2\nping -W 1 -c 2 192.168.122.1 > /dev/null\n\
    if test $? -eq 1\nthen\n    echo \"Error: camera is not connected!\"\n    exit\n\
    fi\nbegin(){\n    curl -s -X POST -d '{\"method\":\"startRecMode\",\"params\"\
    :[],\"id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    \    resposta=$?\n    if test $resposta -ne 0\n    then\n        echo \"Connection\
    \ failed.\"\n        curl -X POST -d '{\"method\":\"stopRecMode\",\"params\":[],\"\
    id\":1,\"version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n\
    \    else\n        echo -e \"\\nConnection established.\"\n    fi\n}\nend(){\n\
    \    curl -s -X POST -d '{\"method\":\"stopRecMode\",\"params\":[],\"id\":1,\"\
    version\": \"1.0\"}' http://192.168.122.1:8080/sony/camera > /dev/null\n}\n```"
- fmt: "\nThe FTP transfer feature in Sony α7 Mark III (and other newer Alpha models)\
    \ doesn’t usually get a lot of attention. Sure, with all the modern technologies\
    \ and apps, it’s easy to overlook this humble feature. But when it comes to transferring\
    \ RAW and JPEG files, FTP can really hold its own. In fact, it has several important\
    \ advantages.\n\n- FTP is a mature, reliable, and well-supported technology.\n\
    - You can use FTP to transfer photos to a local machine as well as a remote server.\
    \ And since Sony α7 Mark III supports multiple FTP profiles, you can transfer\
    \ photos to multiple destinations.\n- FTP servers are available for practically\
    \ any platform, including macOS, Linux, and Windows. There are also plenty of\
    \ open-source FTP servers available free of charge.\n- The FTP transfer feature\
    \ in Sony α7 Mark III supports transfer of both RAW and JPEG files.\n\n## Installing\
    \ FTP on Raspberry Pi\n\nIf you have a Raspberry Pi lying around, you can easily\
    \ transform it into a dedicated FTP server for use with your camera. First, install\
    \ the `vsftpd` server using the `sudo apt install vsftpd` command.\n\nRun then\
    \ the `sudo nano /etc/vsftpd.conf` command to open the `vsftpd.conf` file in the\
    \ `nano` editor. Edit the configuration, so it includes the following parameters:\n\
    \n```\nanonymous_enable=NO\nlocal_enable=YES\nwrite_enable=YES\n```\n\nThis configuration\
    \ disables anonymous access to the server, and gives the existing user access\
    \ and upload rights. Save the changes, and restart the server using the `sudo\
    \ service vsftpd restart` command.\n\n## Configure FTP settings\n\nBefore you\
    \ proceed, have the following connection info ready:\n\n- IP address or domain\
    \ name of the FTP server\n- User name and password\n\nIn case the FTP server runs\
    \ on the Raspberry Pi, use the `hostname -I | cut -d' ' -f1` command to obtain\
    \ its IP address. The user name and the password required for logging into the\
    \ FTP server are the same as the user account on the Raspberry Pi.\n\nIn your\
    \ camera, press the `Menu` button and go to `Network → Network1 → [FTP Transfer\
    \ Func.] → FTP Server 1`. Choose `Display Name` and give the profile a short descriptive\
    \ name. Go one step back, and switch to the `Destination Settings` section. Configure\
    \ the following settings:\n- `Host Name`: The host name or IP address of the FTP\
    \ server.\n- `Secure Protocol`: Enable secure FTP transfers. Leave it disabled.\n\
    - `Port`: The port number of the FTP server. If the FTP server runs on the default\
    \ port 21, skip this field.\n- `Directory`: Set the destination folder on the\
    \ FTP server. If you leave this field empty, RAW and JPEG files will be uploaded\
    \ to a separate folder in the user home directory. The current date is used as\
    \ the name of the upload folder.\n\nPress `OK` to save the connection settings,\
    \ switch to the `User Settings Info` screen, and enter the user name and the password\
    \ in the appropriate fields. Press `OK`, and quit the menu mode.\n\nTo upload\
    \ photos from the camera to the configured FTP server, switch to the viewing mode,\
    \ press the `Menu` button and go to `Network → Network1 → FTP Transfer`. Once\
    \ the camera has established a connection to the FTP server, select the photos\
    \ you want to upload, press the `Menu` button, and choose `OK`.\n\n## Add useful\
    \ info to EXIF metadata\n\nUnlike other fields in EXIF metadata, the `Comment`\
    \ field is not reserved for any type of data, and it’s usually left for the user\
    \ to decide what to put there. A `Bash` shell script can automatically populate\
    \ the `Comment` field with several pieces of useful information, including camera\
    \ model, lens, and weather conditions of the current date. And using a dedicated\
    \ `Dolphin` action, you can view this info with a single click.\n\nBefore you\
    \ proceed, you need to sign up for OpenWeather API and create a unique API key.\
    \ You’ll need it to fetch weather data. Also, install the required packages on\
    \ your system. To do this on openSUSE, use `sudo zypper in exiftool jq`. On Debian\
    \ and Ubuntu, run `sudo apt install libimage-exiftool-perl`. Next, open a text\
    \ editor and paste the following code into a new file:\n\n```bash\n#!/usr/bin/env\
    \ bash\n\nif [ -z \"$1\" ]; then\n    echo \"ERROR: Required parameter missing.\"\
    \n    echo \"Please specify file extension, e.g., jpeg\"\n    exit 1\nfi\n\nCONFIG=\"\
    $HOME/addinfo.cfg\"\n\nif [ ! -f \"$CONFIG\" ]; then\n    api_key=$(kdialog --title\
    \ \"API\" --inputbox \"Enter your API key:\")\n    echo \"api_key='$api_key'\"\
    \ >> \"$CONFIG\"\n    echo \"json='$HOME/weather.json'\" >> \"$CONFIG\"\nfi\n\n\
    source \"$CONFIG\"\ncheck=$(wget -q --spider https://api.openweathermap.org)\n\
    if [ -z \"$check\" ]; then\n    for photo in \"$1\";\n    do\n        lat=$(exiftool\
    \ \"$photo\" -gpslatitude -n | cut -d':' -f2)\n        lon=$(exiftool \"$photo\"\
    \ -gpslongitude -n | cut -d':' -f2)\n        if [ -n \"$lat\" ] && [ -n \"$lon\"\
    \ ]; then\n            camera=$(exiftool -Model \"$photo\" | cut -d':' -f2)\n\
    \            lens=$(exiftool -Lens \"$photo\" | cut -d':' -f2)\n            curl\
    \ \"https://api.openweathermap.org/data/2.5/weather?lat=$lat&lon=$lon&appid=$api_key&units=metric&lang=en\"\
    \ > \"$json\"\n            w_sum=$(jq '.weather[0].main' \"$json\")\n        \
    \    w_temp=$(jq '.main.temp' \"$json\")\n            w_wind=$(jq '.wind.speed'\
    \ \"$json\")\n            exiftool -overwrite_original -Copyright=\"$camera\"\
    \ -Comment=\"$lens $w_temp°C $w_windm/s $w_sum\" \"$1\"\n        else\n      \
    \      echo \"$photo is not geotged\"\n        fi\n    done\n    if [ -d \"$json\"\
    \ ]; then\n        rm \"$json\"\n    fi\n    kdialog --title \"All done\" --passivepopup\
    \ \"All done. Bye!\" 10\nelse\n    kdialog --title \"Error\" --passivepopup \"\
    API is not reachable.\" 10\n    exit 1\nfi\n```\n\nSave the script under the `add-exif-comment`\
    \ name and move it to the `/usr/local/bin/` directory. Set the correct owner and\
    \ permissions for the script:\n\n```bash\nsudo chown root:root /usr/local/bin/add-exif-comment\n\
    sudo chmod 755 /usr/local/bin/add-exif-comment\n```\n\nHere’s how the script works.\
    \ When you run the `add-exif-comment [EXTENSION]` command (e.g., `add-exif-comment\
    \ JPG`) for the first time, it prompts you to specify your OpenWeatherMap API\
    \ token and save it in a configuration file. The script then finds all JPG files\
    \ in the current directory. To obtain the weather data, the script extracts the\
    \ geographical coordinates from the photo’s EXIF metadata. This means that the\
    \ script can only work with geotagged photos. If no latitude and longitude values\
    \ were found in the currently processed file, the script displays an error message\
    \ and skips the photo. `ExifTool` also pulls the camera model and lens values\
    \ from the appropriate fields of EXIF metadata. The `curl` tool then fetches the\
    \ weather data in the JSON format, and the `jq` utility extracts the temperature\
    \ and weather summary information.\n\nAn image viewer like `Gwenview` allows you\
    \ to view EXIF metadata, including the `Comment` field. And if you happen to use\
    \ `Dolphin` as your default file manager, you can create a dedicated action for\
    \ displaying the contents of the `Comment` field in a pop-up box. First, paste\
    \ the following code into a new text file:\n\n```bash\n#!/usr/bin/env bash\ncomment=$(exiftool\
    \ -Comment \"@\" | cut -d\":\" -f2 | sed -e 's/^[[:space:]]*//')\nkdialog --msgbox\
    \ \"$comment\"\n```\n\nSave the file under the `show-comment` name, and move it\
    \ to the `/usr/local/bin/` directory. Set the correct owner and permissions for\
    \ the script:\n\n```bash\nsudo chown root:root /usr/local/bin/show-comment\nsudo\
    \ chmod 755 /usr/local/bin/show-comment\n```\n\nPaste the code below into a new\
    \ text file:\n\n```ini\n[Desktop Entry]\nType=Service\nX-KDE-Priority=TopLevel\n\
    ServiceTypes=KonqPopupMenu/Plugin\nMimeType=image/JPEG;image/jpeg;image/JPG;image/jpg;\n\
    Actions=Comment\n[Desktop Action Comment]\nName=Show EXIF Comment\nExec=/usr/local/bin/show-comment\
    \ %F \n```\n"
  raw: "The FTP transfer feature in Sony α7 Mark III (and other newer Alpha models)\
    \ doesn’t usually get a lot of attention. Sure, with all the modern technologies\
    \ and apps, it’s easy to overlook this humble feature. But when it comes to transferring\
    \ RAW and JPEG files, FTP can really hold its own. In fact, it has several important\
    \ advantages.\n\n*   FTP is a mature, reliable, and well-supported technology.\n\
    \n*   You can use FTP to transfer photos to a local machine as well as a remote\
    \ server. And since Sony α7 Mark III supports multiple FTP profiles, you can transfer\
    \ photos to multiple destinations.\n\n*   FTP servers are available for practically\
    \ any platform, including macOS, Linux, and Windows. There are also plenty of\
    \ open-source FTP servers available free of charge.\n\n*   The FTP transfer feature\
    \ in Sony α7 Mark III supports transfer of both RAW and JPEG files.\n\n## Installing\
    \ FTP on Raspberry Pi\n\nIf you have a Raspberry Pi lying around, you can easily\
    \ transform it into a dedicated FTP server for use with your camera. First, install\
    \ the *vsftpd* server using the `sudo apt install vsftpd` command.\n\nRun then\
    \ the `sudo nano /etc/vsftpd.conf` command to open the *vsftpd.conf* file in the\
    \ *nano* editor. Edit the configuration, so it includes the following parameters:\n\
    \n```\nanonymous_enable=NO\nlocal_enable=YES\nwrite_enable=YES\n```\n\nThis configuration\
    \ disables anonymous access to the server, and gives the existing user access\
    \ and upload rights. Save the changes, and restart the server using the `sudo\
    \ service vsftpd restart` command.\n\n## Configure FTP settings\n\nBefore you\
    \ proceed, have the following connection info ready:\n\n*   IP address or domain\
    \ name of the FTP server\n\n*   User name and password\n\nIn case the FTP server\
    \ runs on the Raspberry Pi, use the `hostname -I | cut -d' ' -f1` command to obtain\
    \ its IP address. The user name and the password required for logging into the\
    \ FTP server are the same as the user account on the Raspberry Pi.\n\nIn your\
    \ camera, press the **Menu** button and go to **Network → Network1 → [FTP Transfer\
    \ Func.] → FTP Server 1**. Choose **Display Name** and give the profile a short\
    \ descriptive name. Go one step back, and switch to the **Destination Settings**\
    \ section. Configure the following settings: - **Host Name** The host name or\
    \ IP address of the FTP server. - **Secure Protocol** Enable secure FTP transfers.\
    \ Leave it disabled. - **Port** The port number of the FTP server. If the FTP\
    \ server runs on the default port 21, skip this field. - **Directory** Set the\
    \ destination folder on the FTP server. If you leave this field empty, RAW and\
    \ JPEG files will be uploaded to a separate folder in the user home directory.\
    \ The current date is used as the name of the upload folder.\n\nPress **OK** to\
    \ save the connection settings, switch to the **User Settings Info** screen, and\
    \ enter the user name and the password in the appropriate fields. Press **OK**,\
    \ and quit the menu mode.\n\nTo upload photos from the camera to the configured\
    \ FTP server, switch to the viewing mode, press the **Menu** button and go to\
    \ **Network → Network1 → FTP Transfer**. Once the camera has established a connection\
    \ to the FTP server, select the photos you want to upload, press the **Menu**\
    \ button, and choose **OK**.\n\n# Add useful info to EXIF metadata\n\nUnlike other\
    \ fields in EXIF metadata, the *Comment* field is not reserved for any specific\
    \ type of data, and it’s usually left for the user to decide what to put in there.\
    \ A Bash shell script can automatically populate the *Comment* field with several\
    \ pieces of useful and interesting information, including camera model, and lens,\
    \ and weather conditions of the current date. And using a dedicated Dolphin action,\
    \ you can view this info with a single mouse click.\n\nBefore you proceed, you\
    \ need to sign up for [OpenWeatheMap API](https://openweathermap.org/api) and\
    \ create a unique API key. You’ll need it to fetch weather data. Also, install\
    \ the required packages on your system. To do this on openSUSE, use the `sudo\
    \ zypper in exiftool jq kdialog` command. On Debian and Ubuntu, run the `sudo\
    \ apt install libimage-exiftool-perl jq kdialog` command.\n\nNext, open a text\
    \ editor and paste the following code into a new text file:\n\n```\n#!/usr/bin/env\
    \ bash\n\nif [ -z \"$1\" ]; then\n    echo \"ERROR: Required parameter is missing.\"\
    \n    echo \"Please specify file extension, e.g., $0 jpeg\"\n    exit 1\nfi\n\n\
    CONFIG=\"$HOME/addinfo.cfg\"\n\nif [ ! -f \"$CONFIG\" ]; then\n    api_key=$(kdialog\
    \ --title \"API\" --inputbox \"Enter your API key:\")\n    echo 'api_key=\"'$api_key'\"\
    ' >> \"$CONFIG\"\n    echo 'json=\"$HOME/weather.json\"' >> \"$CONFIG\"\nfi\n\
    source \"$CONFIG\"\ncheck=$(wget -q --spider https://api.openweathermap.org)\n\
    if [ -z $check ]; then\n    for photo in *.\"$1\";\n    do\n    lat=$(exiftool\
    \ \"$photo\" -gpslatitude -n | cut -d\":\" -f2 | tr -d \" \")\n    lon=$(exiftool\
    \ \"$photo\" -gpslongitude -n | cut -d\":\" -f2 | tr -d \" \")\n    if [ ! -z\
    \ \"$lat\" ] && [ ! -z \"$lon\" ]; then\n            camera=$(exiftool -Model\
    \ \"$photo\" | cut -d\":\" -f2 | tr -d \" \")\n            lens=$(exiftool -LensID\
    \ \"$photo\" | cut -d\":\" -f2)\n            curl \"https://api.openweathermap.org/data/2.5/weather?lat=\"\
    $lat\"&lon=\"$lon\"&appid=\"$api_key\"&units=metric&cnt=7&lang=en&units=metric&cnt=7&lang=en\"\
    \ > $json\n            w_sum=$(jq '.weather | .[0] | .main' $json | tr -d '\"\
    ')\n            w_temp=$(jq '.main | .temp' $json | tr -d '\"')\n            w_wind=$(jq\
    \ '.wind | .speed' $json | tr -d '\"')\n            exiftool -overwrite_original\
    \ -copyright=\"$copyright\" -comment=\"$camera $lens \"$w_temp\"°C \"$w_wind\"\
    m/s \"$w_sum\" \"$1\"\n    else\n        echo \"$photo is not geotagged\"\n  \
    \  fi\n    done\n    if [ -d \"$json\" ]; then\n        rm \"$json\"\n    fi\n\
    \    kdialog --title \"All done\" --passivepopup \"All done. Bye!\" 10\nelse\n\
    \    kdialog --title \"Error\" --passivepopup \"API is not reachable.\" 10\n \
    \   exit 1\nfi\n```\n\nSave the script under the *add-exif-comment* name and move\
    \ it to the */usr/local/bin/* directory. Set the correct owner and permissions\
    \ for the script:\n\n```\nsudo chown root:root /usr/local/bin/add-exif-comment\n\
    sudo chmod 755 /usr/local/bin/add-exif-comment\n```\n\nHere’s how the script works.\
    \ When you run the `add-exif-comment [EXTENSION]` command (e.g., `add-exif-comment\
    \ JPG`) for the first time, it prompts you to specify your OpenWeatherMap API\
    \ token and save it in a configuration file. The script then finds all JPG files\
    \ in the current directory. To obtain the weather data, the script extracts the\
    \ geographical coordinates from the photo’s EXIF metadata. This means that the\
    \ script can only work with geotagged photos. If no latitude and longitude values\
    \ were found in the currently processed file, the script displays an error message\
    \ and skips the photo. ExifTool also pulls the camera model and lens values from\
    \ the appropriate fields of EXIF metadata. The *curl* tool then fetches the weather\
    \ data in the JSON format, and the *jq* utility extracts the temperature and weather\
    \ summary information.\n\nAn image viewer like Gwenview allows you to view EXIF\
    \ metadata, including the *Comment* field. And if you happen to use Dolphin as\
    \ your default file manager, you can create a dedicated action for displaying\
    \ the contents of the *Comment* field in a pop-up box. First, paste the following\
    \ code into a new text file:\n\n```\n#!/usr/bin/env bash\ncomment=$(exiftool -Comment\
    \ \"@\" | cut -d\":\" -f2 | sed -e 's/^[[:space:]]*//')\nkdialog --msgbox \"$comment\"\
    \n```\n\nSave the file under the *show-comment* name, and move it to the */usr/local/bin/*\
    \ directory. Set the correct owner and permissions for the script:\n\n```\nsudo\
    \ chown root:root /usr/local/bin/show-comment\nsudo chmod 755 /usr/local/bin/show-comment\n\
    ```\n\nPaste the code below into a new text file:\n\n```\n[Desktop Entry]\nType=Service\n\
    X-KDE-Priority=TopLevel\nServiceTypes=KonqPopupMenu/Plugin\nMimeType=image/JPEG;image/jpeg;image/JPG;image/jpg;\n\
    Actions=Comment\n[Desktop Action Comment]\nName=Show EXIF Comment\nExec=/usr/local/bin/show-comment\
    \ %F \n```"
