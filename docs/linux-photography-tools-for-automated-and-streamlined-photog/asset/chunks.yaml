    将文件以 `.htaccess` 命名保存到包含 Natsukashii 网页的目录中。现在，将浏览器指向 Natsukasii 页面。如果一切运行正常，你应该会看到一个提示输入凭据的对话框。输入指定的用户名和密码即可让你获得访问该页面的权限。


    # 在 Android 上使用 Termux 进行命令行摄影工作流


    有许多 Android 应用可以用于整理、处理和分享照片。但如果你想基于流行的 Linux 工具实现摄影工作流，那么 [Termux](http://termux.com)
    就是你需要的全部工具。


    Termux 可以在 Google Play 商店和 [F-Droid](http://f-droid.org) 上获取，因此你可以从偏好的来源进行安装。该应用程序的默认功能可以通过安装插件进行扩展。例如，`Termux:API`
    插件增加了对 Android API 的支持，而 `Termux:Styling` 软件包则让你能够选择备配色方案和字体。`Termux:Widget` 插件为你提供一个包含
    shell 脚本快捷方式的桌面小组件，这样你只需点击一下即可在 Termux 中运行脚本。你可以从 F-Droid 免费安装这些插件。如果你选择从 Google
    Play 商店安装插件，则需要购买。将其视为向该项目捐赠并支持其开发者的方式吧。


    使用屏幕键盘在终端中工作可能会很快变得乏味。幸运的是，Termux 提供了许多常用键盘操作的快捷键。这些快捷键大部分与 `Bash` shell 中的完全相同。例如，`Ctrl+A`
    和 `Ctrl+E` 快捷键分别将光标移动到行的开头和末尾，而 `Ctrl+C` 和 `Ctrl+D` 快捷键则终止当前进程并退出终端会话。唯一的区别是 Termux
    使用 `Volume Down` 硬件音量键键代替 `Ctrl` 键。`Volume Up` 键结合不同的字母用于模拟键盘键。`Volume Up+T` 快捷键模拟
    `Tab` 键，而 `Volume Up+W`、`Volume Up+A`、`Volume Up+S` 和 `Volume Up+D` 作为方向键。


    首次运行 Termux 时，你需要做三件事：更新应用的软件存储库、安装所需的包以及配置存储访问。Termux 使用 `pkg` 工具进行包管理，因此如果你来自
    Debian 或 Ubuntu，你会觉得 Termux 非常亲切。要更新存储库，运行 `pkg update` 命令。想查看存储库中的所有包？运行 `pkg
    list` 命令。要查找特定包，使用 `pkg search [PACKAGE]` 命令，要安装该包，执行 `pkg install [PACKAGE]`
    命令。升级已安装的包只需运行 `pkg upgrade` 命令，而 `pkg remove [PACKAGE]` 命令可用于删除已安装的包。


    安装哪些包完全取决于你想用 Termux 做什么，但起码你可能可能想安装 `nano` 文本编辑器、`rsync` 文件复制工具以及 `OpenSSH` SSH
    连接工具。这三个工具允许你编辑文本和配置文件并执行备份，以及访问和控制远程机器。要一次性安装这些包，请使用以下命令：


    ```

    pkg install nano rsync openssh git curl wget

    ```


    要配置存储访问，运行 `termux-setup-storage` 命令。这样做将授予 Termux 访问 Android 6.0 及更高版本共享存储的权限，并创建一个
    `storage` 文件夹，其中包含指向各种存储位置的符号链接。这包括 `~/storage/shared`（所有应用共享的根文件夹）、`~/storage/dcim`（照片和视频的标准文件夹）以及
    `~/storage/downloads`（下载文件的默认文件夹）。


    在你的 Android 设备上拥有一个工具齐全的 Linux 环境让你能够执行通常需要第三方商业应用的任务。例如，使用 `rsync`，你可以轻松设置一个健壮的解决方案，将
    Android 设备上的照片和 RAW 文件备份到远程机器。为了实现这一点，启用免密 SSH 登录是一个好主意，这样你就不需要每次执行备份都输入密码。从运行
    `ssh-keygen` 命令开始。在提示创建密码时，按 `Enter` 跳过。一旦创建了密钥对，运行 `ssh-copy-id -i .ssh/id_rsa.pub
    user@host` 命令（将 `user` 和 `host` 替换为用户名和远程机器的 IP 地址或域名）。这会将公钥复制到远程机器，从而实现免密登录。将
    Android 设备上的数据备份到远程服务器只需使用适当的 `rsync` 命令。如果你想备份照片和视频，以下命令将是关键：


    ```

    rsync -avz -e ssh ~/storage/dcim user@host:/path/to/backup/dir

    ```


    与其在每次执行备份时都手动运行此命令，不如编写一个简单的 `Bash` shell 脚本，将其保存在 `~/.shortcuts` 目录中，并添加一个链接到该脚本的
    Termux Widget。这样你就可以直接从桌面触发备份操作。


    回到照片主题，`jhead` 实用使得处理存储在 Android 设备上的照片成为可能。运行 `pkg install jhead` 命令在 Termux
    中安装该工具。使用 `jhead`，你可以将通用的文件名替换为更有意义的内容，例如时间戳。以下命令使用 `YYYYMMDD-hhmmss` 规则重命名所有
    `.jpg` 文件（例如 `DC_0001.jpg`）：


    ```bash

    for file in *.jpg; do jhead -n%Y%m%d-%H%M%S $file; done

    ```

