- fmt: "\nWant to apply effects to photos without resorting to a dedicated app? Termux\
    \ and ImageMagick can handle that too. The latter supports the `Hald CLUT` technology\
    \ that makes it possible to use special color lookup tables to perform color transformations.\
    \ To make use of `Hald CLUT`, you don’t need to understand all its intricacies,\
    \ but you need to do some preparatory work. Install ImageMagick on your regular\
    \ Linux machine, and run the `convert hald:9 hald-9.png` command to generate a\
    \ `Hald CLUT` table. Open then the generated `hald-9.png` file in a photo editing\
    \ application like digiKam, apply the desired color corrections (curves, levels,\
    \ saturation, brightness, etc.), and save the changes under a descriptive name\
    \ (e.g., `hald-9-vintage.png`). Now you have a reference `Hald CLUT` table that\
    \ can be used as a preset. Using this technique, you can create as many presets\
    \ as needed. Move them then on your Android device into the folder accessible\
    \ by Termux. To apply the desired preset to a photo, use the following command:\n\
    \n```\nconvert foo.JPG hald-9-vintage.png -hald-clut foo-modified.jpeg\n```\n\n\
    # Store photos and RAW files on an encrypted external storage device\n\nIt’s a\
    \ good idea to have a backup of your photos and RAW file on an external storage\
    \ device like a USB hard disk. It’s an even better idea to encrypt the hard disk.\
    \ This way, no one except you can access the data on the disk.\n\nThe first step\
    \ is to identify the connected external storage device using the `sudo lsblk`\
    \ command. Take the look at the output, and note the name of the external storage\
    \ device:\n\n```\nNAME   MAJ:MIN RM   SIZE RO TYPE MOUNTPOINT\nsda      8:16 \
    \  0 111.8G  0 disk \n├─sda1   8:17   0     2G  0 part [SWAP]\n└─sda2   8:18 \
    \  0 109.8G  0 part /\nsdb      8:32   0 931.5G  0 disk\n```\n\nIn this case,\
    \ it’s `/dev/sdb`. If the storage device is already partitioned, the output would\
    \ look something like this:\n\n```\nsdb      8:32   0 931.5G  0 disk \n└─sdb1\
    \   8:33   0 931.5G  0 part \n```\n\nIf necessary, you can remove the existing\
    \ partition using the `fdisk` tool. Run the `sudo fdisk /dev/sdb1` command, choose\
    \ the `d` option, type `1` to select the partition, and press `Enter`. To create\
    \ a new partition, run the `sudo fdisk /dev/sdb` command, use the `n` option,\
    \ and press `p` for a primary partition. Press `1` to edit the first partition,\
    \ then use the defaults for first and last sectors. Finally, press `w` to apply\
    \ the changes.\n\nNext, install the `cryptsetup` tool. To do this on openSUSE,\
    \ use the `sudo zypper in cryptsetup` command. To encrypt the partition on the\
    \ hard disk, run the following command:\n\n```\nsudo cryptsetup luksFormat /dev/sdb1\
    \ my_encrypted_disk\nsudo cryptsetup open /dev/sdb1 my_encrypted_disk\nmkfs.ext4\
    \ /dev/mapper/my_encrypted_disk\nmount /dev/mapper/my_encrypted_disk /mnt/backup\n\
    ```\n"
  raw: "Want to apply effects to photos without resorting to a dedicated app? Termux\
    \ and ImageMagick can handle that too. The latter supports the Hald CLUT technology\
    \ that makes it possible to use special color lookup tables to perform color transformations.\
    \ To make use of Hald CLUT, you don’t need to understand all its intricacies,\
    \ but you need to do some preparatory work. Install ImageMagick on your regular\
    \ Linux machine, and run the `convert hald:9 hald-9.png` command to generate a\
    \ Hald CLUT table. Open then the generated `hald-9.png` file in a photo editing\
    \ application like digiKam, apply the desired color corrections (curves, levels,\
    \ saturation, brightness, etc.), and save the changes under a descriptive name\
    \ (e.g., `hald-9-vintage.png`). Now you have a reference Hald CLUT table that\
    \ can be used as a preset. Using this technique, you can create as many presets\
    \ as needed. Move them then on your Android device into the folder accessible\
    \ by Termux. To apply the desired preset to a photo, use the following command:\n\
    \n```\nconvert foo.JPG hald-9-vintage.png -hald-clut foo-modified.jpeg\n```\n\n\
    # Store photos and RAW files on an encrypted external storage device\n\nIt’s a\
    \ good idea to have a backup of your photos and RAW file on an external storage\
    \ device like a USB hard disk. It’s an even better idea to encrypt the hard disk.\
    \ This way, no one except you can access the data on the disk.\n\nThe first step\
    \ is to identify the connected external storage device using the `sudo lsblk`\
    \ command. Take the look at the output, and note the name of the external storage\
    \ device:\n\n```\nNAME   MAJ:MIN RM   SIZE RO TYPE MOUNTPOINT\nsda      8:16 \
    \  0 111.8G  0 disk \n├─sda1   8:17   0     2G  0 part [SWAP]\n└─sda2   8:18 \
    \  0 109.8G  0 part /\nsdb      8:32   0 931.5G  0 disk\n```\n\nIn this case,\
    \ it’s */dev/sdb*. If the storage device is already partitioned, the output would\
    \ look something like this:\n\n```\nsdb      8:32   0 931.5G  0 disk \n└─sdb1\
    \   8:33   0 931.5G  0 part \n```\n\nIf necessary, you can remove the existing\
    \ partition using the fdisk tool. Run the `sudo fdisk /dev/sdb1` command, choose\
    \ the *d* option, type *1* to select the partition, and press **Enter**. To create\
    \ a new partition, run the `sudo fdisk /dev/sdb` command, use the *n* option,\
    \ and press *p* for a primary partition. Press *1* to edit the first partition,\
    \ then use the defaults for first and last sectors. Finally, press *w* to apply\
    \ the changes.\n\nNext, install the *cryptsetup* tool. To do this on openSUSE,\
    \ use the `sudo zypper in cryptsetup` command. To encrypt the partition on the\
    \ hard disk, run the following command:\n\n```\nsudo cryptsetup -v -y -c aes-xts-plain64\
    \ -s 512 -h sha512 -i 5000 --use-random luksFormat /dev/sdc1\n```\n\nBefore you\
    \ proceed, create a backup of the LUKS header that holds metadata required for\
    \ the encrypted partition to function:\n\n```\nsudo cryptsetup luksHeaderBackup\
    \ --header-backup-file /path/to/luks-header.img /dev/sdc1\n```\n\nCreate then\
    \ a directory in your home for mounting the external hard disk:\n\n```\nmkdir\
    \ ~/external-storage\n```\n\nUnlock the encrypted device and create a file system\
    \ on it:\n\n```\nsudo cryptsetup luksOpen /dev/sdc1 ext-hdd\nsudo mkfs.ext4 /dev/mapper/ext-hdd\n\
    ```\n\nFrom now on, you can mount the device using the following command (replace\
    \ *user* with your actual user name):\n\n```\nsudo mount /dev/mapper/ext-hdd /home/user/external-storage\n\
    ```\n\nNow, move your photos and RAW files to the mount directory (i.e., *~/external-storage*).\
    \ When you are done working with the external storage, unmount and lock the device:\n\
    \n```\nsudo umount /home/user/external-storage\nsudo cryptsetup luksClose /dev/mapper/ext-hdd\n\
    ```\n\nTo speed up the process of unlocking/mounting and locking/unmounting, you\
    \ can add the following aliases to your *.bashrc* file\n\n```\nalias mountext='sudo\
    \ cryptsetup luksOpen /dev/sdc1 ext-hdd && sudo mount /dev/mapper/ext-hdd /home/user/external-storage'\n\
    alias umountext='sudo umount /home/user/external-storage && sudo cryptsetup luksClose\
    \ /dev/mapper/ext-hdd' \n```\n\n# olympus-photosync: wireless bridge between Olympus\
    \ cameras and Linux\n\nAlthough modern Olympus cameras are not particularly hacker-friendly,\
    \ enterprising and determined coders still manage to extend the existing functionality\
    \ beyond its intended use. Case in point: [olympus-photosync](https://github.com/mauriciojost/olympus-photosync),\
    \ a handy little tool that makes it possible to wirelessly transfer JPEG and RAW\
    \ files from a supported Olympus camera to a Linux machine (or Windows and macOS\
    \ X for that matter). The tool makes use of the camera’s Wi-Fi capabilities, and\
    \ you don’t have to hack or tweak the camera for it to work with olympus-photosync.\
    \ The list of Olympus cameras that are known to work with the tool is rather short,\
    \ but if you have a recent Wi-Fi-enabled Olympus camera model, chances are it\
    \ will work just fine with olympus-photosync.\n\nThere is no need to compile anything\
    \ in order to deploy olympus-photosync on a Linux machine. Just download the latest\
    \ DEB or RPM package from the project’s repository and install it using your system’s\
    \ package manager. To install olympus-photosync on openSUSE, grab the latest *.noarch.rpm*\
    \ package, then run the `sudo zypper in photosync-x.x-x.noarch.rpm` command. Alternatively,\
    \ you can download the *.tgz* or *.zip* archive and unpack it in the desired location.\n\
    \nNext, turn your camera on, press the **Menu** button, and switch to the **Setup\
    \ Menu → Wi-Fi Settings** section. Make sure that **Wi-Fi Connect Settings** is\
    \ set to *Private*, and enable Wi-Fi.\n\n![](media/file35.jpg)\n\nOn your Linux\
    \ machine, connect to the camera’s wireless network, open the terminal, and run\
    \ the `olympus-photosync` command. This should automatically detect the camera\
    \ and transfer all JPEG and RAW files to the default *~/output* directory. Despite\
    \ being a one-trick pony, olympus-photosync supports several options that allow\
    \ you to control its behavior. The `--output-directory` (`-o`) parameter can be\
    \ used to specify an alternative directory for saving the transferred file. The\
    \ `--until <DD-MM-YYYY>` option lets you transfer files that are created before\
    \ the specified date, while the `--from <DD-MM-YYYY>` option limits the transfer\
    \ to files created after the given date.\n\nAlthough olympus-photosync is straightforward\
    \ in use, transferring files wirelessly is not exactly fast. So you would probably\
    \ want to use the tool to offload the occasional file or two, and not as a replacement\
    \ for a dedicated (or built-in) card reader.\n\n# Turn Raspberry Pi into a wireless\
    \ camera server\n\nControlling your camera from a regular Linux machine over a\
    \ USB connection can be useful in many situations. But having your camera physically\
    \ attached to the machine limits the practicality of this otherwise clever solution.\
    \ Raspberry Pi to the rescue. Deploy a USB server on the tiny machine, plug your\
    \ camera into it, and you can access and control the latter from any Linux machine\
    \ via a wireless network.\n\nWhile it’s possible to use the USB/IP open source\
    \ software for this project, [VirtualHere](https://www.virtualhere.com/) USB server\
    \ and client tools provide a less cumbersome and more flexible solution. VirtualHere\
    \ software is easy to deploy, it requires no configuration, and the client tool\
    \ is available for all mainstream platforms. The latter means that you can access\
    \ and control your camera not only from Linux but also Windows and macOS.\n\n\
    Although VirtualHere USB server and client are commercial closed-source products,\
    \ you can download and use them for free. The only limitation is that you cannot\
    \ share more than one USB device at a time. Since you are not going to share anything\
    \ besides your camera, this is not an issue.\n\nThe first order of business is\
    \ to install the VirtualHere USB server on the Raspberry Pi. Open the terminal\
    \ on the Raspberry Pi, or connect to it via SSH, and run the following commands:"
