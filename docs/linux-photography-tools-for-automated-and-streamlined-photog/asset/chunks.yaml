  raw: 'This produces an image with twice the resolution of the original. Super-resolution
    with a standard camera is a bit more complex, as when you have uncontrolled camera
    or subject motion, you don’t get anywhere near an exact half pixel shift. But
    unless you are extremely unlucky, your shifted image will be offset by some amount
    from the original. By combining enough images you will get a very irregularly
    sampled image (with pixel samples that don’t fall onto a grid), but one which
    can be interpolated into a regular image by tracing the lines between samples
    to guess a result that does fall on an exact gridline. This is precisely what
    the Highrise script tries to achieve.


    The script relies on ImageMagick and Hugin tools for upscaling, aligning, and
    assembling a stack of lower-resolution photos into a super-resolution image. This
    means that you need to install the required dependencies for the script to work.
    To do this on openSUSE, use the `sudo zypper in ImageMagick hugin exiftool` command.


    You can then install Highrise by running the following commands:


    ```

    git clone https://gitlab.com/dmpop/highrise.git

    cd highrise

    sudo cp highrise.sh /usr/local/bin/highrise

    sudo chown root:root /usr/local/bin/highrise

    sudo chmod 755 /usr/local/bin/highrise

    ```


    To generate a super-resolution image, you need to take a series of photos first.
    Set your camera to the continuous shooting mode, and disable image stabilization.
    Take between 9 and 15 photos of the desired scene. It’s important that you don’t
    use a tripod, but shoot hand-held. For an even better result, enable manual focusing
    and shoot in the Manual mode. Also, keep in mind that the script works best with
    photos of static scenes.


    Transfer the photos to your machine, then run the Highrise script using the following
    command:


    ```

    highrise -e JPG -d /path/to/source/dir

    ```


    Replace *JPG* with the actual file extension of the source photos, and */path/to/source/dir*
    with the absolute path to the directory containing the source photos. Generating
    super-resolution images is a computationally-intensive task, so depending on the
    size and number of source photos, it could take a while. Once the script is finished,
    you’ll find the resulting super-resolution images in the source directory. These
    files are recognizable by the *mean* and *median* postfixes in their names.


    If the script failed to properly align the source photos, you can adjust several
    parameters to fix that. Open the script in a text editor and modify the available
    align parameters. Save the changes, and run the script again.


    ¹Source: [How does Super Resolution work?](https://photo.stackexchange.com/questions/24726/how-does-super-resolution-work)


