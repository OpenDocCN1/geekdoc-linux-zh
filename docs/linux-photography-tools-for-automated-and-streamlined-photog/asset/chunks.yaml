  raw: 'Designed to manage hundreds and even thousands of photos, digiKam provides
    powerful searching capabilities that can help you to find the photos you want
    in several different ways.


    If you need to quickly locate or filter photos, your first stop should be the
    **Filters** right sidebar. Here, you can use a list of all available tags in the
    **Tags Filter** section to quickly locate photos containing specific tags. Select
    one or several tags, and digiKam returns all matching photos in the current album.
    To use the rating filter, specify the desired number of stars, and digiKam narrows
    the view to the matching photos. By default, the rating filter uses the Greater
    Than or Equals condition, but you can choose between two other options by selecting
    them from the **Rating Filter Options** drop-down list.


    ![](media/file19.jpg)


    While the quick search and filtering features can help you to find the photos
    you want with a minimum of fuss, keep in mind that the results they return largely
    depend on the quality and completeness of the metadata of each photo. This is
    also true for digiKam’s more advanced search features, so to be able to use them
    to their full potential, you should tag and rate your photos and add as much information
    as possible.


    Besides the quick search and filtering tools in the **Filters** right sidebar,
    digiKam offers more advanced search features accessible via the left sidebar.
    Here, you’ll find a variety of search options, including the Calendar, Tags, Timeline,
    Searches, Fuzzy Searches, Map Searches and People.


    The **Dates** section lets you quickly find photos for a specific year, month,
    and date. Using the tree in the main pane you can easily locate the year and month
    you want. Select the desired month and digiKam promptly displays related photos.
    Want to view photos taken on a specific date? You can do this using the calendar
    at the bottom, where dates containing photos are marked in bold. Click on the
    date you want to view the related photos.


    ![](media/file20.jpg)


    The **Timeline** section offers another way to locate and view photos for a specific
    period of time. All photos here are presented as a bar chart, and you can view
    photos for a specific period by clicking on the related bar. The **Time Unit**
    drop-down list lets you specify the desired time scale for the chart: Year, Month,
    Week, and Day. The **Timeline** section has another clever trick up its sleeve:
    you can save searches as virtual albums. To save the current search, give it a
    name in the field right below the timeline and press the **Save** button. This
    adds the virtual album to the **My Date Searches** list.


    ![](media/file21.jpg)


    The **Search** section lets you perform searches in a more traditional way. Type
    the search term in the **Search** field and digiKam automatically displays the
    matching photos in the main pane. To make your search more precise, press the
    **Advanced Search** button. This opens the **Advanced Search** interface that
    allows you to search photos using a wide range of criteria: from tags and image
    properties, to specific text and metadata values. When configuring an advanced
    search query, you can at any time press the **Try** button to see whether it returns
    the photos you are looking for. Once you’re satisfied with the result, you can
    save the search for later use. Give the search a name in the **Save Current Search**
    section and press the **Save** button. You can then run the search by selecting
    it in the **My Searches** list.


    ## Process RAW files in digiKam


    digiKam usually does a decent job of decoding RAW files using the default settings.
    But if you prefer to have complete control of how the application processes RAW
    files, choose **Settings → Configure digiKam**, switch to the **Image Editor →
    RAW Behavior** section, and enable the **Always open the Raw Import Tool to customize
    settings** option. Next time you open a ra file for editing, digiKam drops you
    into the **RAW Import** module, where you can tweak the RAW import and post-processing
    settings.


    The **RAW Import** sidebar contains three tabs: **RAW Decoding**, **Post Processing**,
    and **Info**. The **RAW Decoding** section gives you access to settings that let
    you tweak demosaicing, white balance, noise reduction and chromatic aberration
    correction, and color management settings.


    ![](media/file22.jpg)


    Demosaicing is a process of reconstructing a full color image from the RAW output
    of an image sensor. The LibRaw library that digiKam uses for processing RAW files
    supports several demosaicing algorithms, including Bilinear, VNG, AHD, LMMSE,
    and others. You can use the **Shift+F1** keyboard shortcut to view a brief, and
    rather technical, description of each algorithm. But the best way to see the differences
    between various algorithms is to try to apply them to the currently opened RAW
    file. Select the algorithm you want, and press the **Update** button to preview
    the result. The preview pane displays an image that will be imported in the editor,
    and you can use the zoom slider at the bottom of the window to zoom in on the
    image for closer examination.


    By default, digiKam converts RAW files into 8-bit color images, but you can choose
    the 16-bit mode instead by enabling the **16 bits color depth** option. The 8-bit
    mode is faster, but the 16-bit conversion is by far the best way to go, as it
    provides better tonal range. If you choose to work in the 16-bit mode, it’s recommended
    that you enable and configure color management options in the **Color Management**
    section to prevent dark rendering of the image in the editor. Due to the way certain
    algorithms process green pixels, the resulting image can contain undesirable patterns
    and artifacts. Enabling the **Interpolate RGB as four colors** option can fix
    that. The **Do not stretch or rotate pixels** option is there specifically for
    Fujifilm’s cameras with the Super CCD sensors and cameras using sensors with non-square
    pixels. When this option is enabled, the image is titled 45 degrees, so that each
    output pixel corresponds to one RAW pixel. This option also prevents the image
    from stretching to its correct aspect ratio.


    In the **White Balance** section, you can adjust white balance settings and specify
    how the system should handle highlight clippings (overexposed areas in the photo).
    LibRaw offers several algorithms for restoring highlight clippings (Solid White,
    Unclip, Bend, and Rebuild) and you can view their brief description by using the
    **Shift+F1** keyboard shortcut. To process highlights more accurately, enable
    the **Correct false colors in highlights** option. And if you want LibRaw to automatically
    adjust brightness, tick the **Auto Brightness** check box. Besides white balance,
    you can also enable and adjust the **Exposure Correction** option and manually
    tweak exposure compensation settings. The under- and overexposure buttons at the
    bottom can identify under- and overexposed areas of the photo in the preview pane,
    which can help you to adjust exposure settings.


    Using the options in the **Corrections** section, you can choose to apply one
    of the supported noise reduction algorithms to the image as well as enable the
    chromatic aberration correction option and adjust its settings. And in the **Color
    Management** section, you can specify a color profile and a color space.


    Under the **Post Processing** tab, you can adjust several exposure settings (e.g.,
    brightness, contrast, gamma, and exposure) as well as adjust the luminosity curve.
    While these adjustments can be performed later when editing the converted image,
    you can do this during the RAW import to streamline the editing process. digiKam
    applies all adjustments to the preview image, so you can immediately see the result
    of your tweaking without performing the actual conversion.'
