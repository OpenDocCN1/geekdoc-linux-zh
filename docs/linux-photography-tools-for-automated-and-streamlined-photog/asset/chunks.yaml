- fmt: '

    digiKam features a rather capable import module that makes it possible to transfer
    photos and RAW files from your camera into the application as well as process
    and organize them on the fly. In fact, the `Import` interface box offers a few
    clever features that allow you to configure the import operation. In the `File
    Renaming Options` section in the `Settings` right sidebar, you can define a custom
    rule which renames all incoming photos. Say, you want to rename imported photos
    using their date and time info pulled from EXIF metadata. Enable the `Customize`
    option and select the `Date & Time` item from the `Options` drop-down list. From
    the drop-down list next to the `Format` field, select the desired date and time
    format. The available options include Standard, `ISO`, `Text`, `UnixTimeStamp`,
    and `Custom`. The latter allows you to specify your own data and time format.
    For example, enter the `yyyyMMdd-hhmmss` rule in the `Format` field to rename
    photos as follows: `19730917-175735`.


    ![](media/file14.jpg)


    The options available in the `Auto-creation of Albums` section can come in handy
    in several situations. If you are downloading photos taken on different dates,
    enable the `Date-based sub-albums` option and choose the desired date format.
    This will organize imported photos in albums by date. The `Extension-based sub-albums`
    option can be useful for importing photos in different formats into separate albums.
    For example, if you shoot in both RAW and JPG, you can enable the `Extension-based
    sub-albums` option, so photos will be imported into appropriate folders based
    on their file extensions. Finally, the `On the Fly Operations` section allows
    you to configure several actions to be performed on the photos during the import
    process. Among other things, you can let digiKam auto-rotate photos and convert
    them to another format like PNG or TIFF.


    ## Sort photos with Image Quality Sorter


    Here’s a problem that may sound familiar. You return from a trip with hundreds
    and even thousands of photos, and some of them are underexposed, out of focus,
    or too noisy. Weeding them out manually is like catching fish with a spoon. This
    is where the Image Quality Sorter tool in digiKam can prove its worth. To enable
    it, choose `Settings → Configure digiKam`, switch to the `Image Quality Sorter`
    section, and tick the `Enable Image Quality Sorting` check box. While you can
    modify the available settings, you might want to try the default values first.
    Create a separate album containing both good and low-quality photos, then run
    the image quality sorter with the default values on it. Adjust then specific parameters,
    if necessary. The Image Quality Sorter feature is part of the Maintenance tool.
    To process existing photos in all or selected albums, choose `Tools → Maintenance`,
    enable the `Image Quality Sorter` option and run the maintenance operation. The
    Image Quality Sorter then goes through the photos and flags them according to
    their quality.


    ![](media/file15.jpg)


    ## Color labels and picks


    Like any other decent photo management application, digiKam allows you to assign
    tags to photos and RAW files. But in addition to tags, digiKam also offers the
    Color Labels and Picks features that can be useful for keeping tabs on your photos.
    To add a color label to an individual photo, right-click on it, choose `Assign
    Labels → Color`, and pick the desired color. Each color label has its own shortcut,
    so you can quickly label photos using the keyboard. For example, to assign the
    Magenta label, press `Ctrl+Alt+6`. To quickly remove a color label from a photo,
    press `Ctrl+Alt+0`. The Picks feature works in a similar manner: you can assign
    one of three picks (`Pending`, `Accepted`, or `Rejected`) to any photo in digiKam
    via the `Assign Labels → Pick` context menu, or using the default shortcuts. Keep
    in mind that the Image Quality Sorter tool uses the picks to flag photos, so to
    avoid confusion, you might want to avoid using picks when this tool is enabled.


    digiKam provides two ways to find photos with specific color labels or picks.
    The `Labels Filter` section in the `Filters` sidebar lets you filter photos in
    the currently viewed album by color labels and picks. Using filtering capabilities
    can be useful when you need to specify multiple filtering criteria (e.g., show
    all photos with green and orange color labels as well as the `Pending` pick),
    but you can only view one album at a time.


    ![](media/file16.jpg)


    If you need to quickly filter photos by one or two criteria, the `Labels` left
    sidebar is the way to go. The sidebar contains a list of all labels supported
    by digiKam grouped by their type: rating, pick, and color. Select the desired
    label to view all matching photos. You can select several labels by clicking on
    them with the mouse while holding down the `Ctrl` key. It’s worth noting that
    quick filters in the `Labels` left sidebar are applied to the entire digiKam photo
    collection (as opposed to filters defined in the `Filters` right sidebar that
    are applied to the currently selected album).


    ## Geotag photos in digiKam


    If your camera doesn’t support geotagging, you can easily add geographical coordinates
    to your photos using digiKam. In digiKam, select the photos you want to geotag
    and choose `Item → Edit Geolocation`. This opens the `Geolocation Editor` interface
    consisting of three parts: the map pane contains a map and a toolbar with several
    navigation tools; below the map pane, there is a list of selected photos; the
    sidebar on the right displays the currently active section.


    To geotag photos, you need to obtain the geographical coordinates of the place,
    where the photos were taken, and the geolocation editor offers several ways to
    do this. You can use the mouse to move around the map to locate the desired spot.
    If you know the full or partial address of the location, you can use the built-in
    search feature to find it on the map. Switch to the `Search` section and enter
    the address in the search field. Hit the `Search` button, and you should see a
    list of matching results with corresponding markers on the map.


    ![](media/file17.jpg)


    The easiest way to add geographical coordinates to the photos is to drag them
    from the list onto the desired spot on the map. Alternatively, you can assign
    the geographical coordinates of a specific search result to the photos. To do
    this, select the photos in the list, right-click on the desired search result,
    and select `Move selected images to this position` from the context menu. Once
    you’ve assigned the geographical coordinates to the photos, press the `Apply`
    button to write geotags to the photos.


    digiKam also makes it easy to find geotagged photos. Need to find all the photos
    you took in Japan? You can use the `Map` sidebar to do just that, provided your
    photos have been geotagged. Expand the `Map` sidebar, and you should see thumbnails
    representing groups of geotagged photos on the map. Each thumbnail contains a
    counter indicating the number of photos found in the specific area. Click on the
    `Pan Mode` button in the map toolbar to control the map using the mouse.


    ![](media/file18.jpg)


    To view all photos represented by a thumbnail, press the button which creates
    a region selection from a thumbnail (middle button in the `Search by area` section).
    Using the area selection button in the `Search by area` section, you can view
    all photos in the manually selected area on the map. To do this, press the button,
    then click somewhere on the map and draw a rectangle around the desired area.


    digiKam also lets you save map searches. This way, you don’t have to perform the
    same map search every time you need to find photos in a specific region. Enter
    a name for your search in the field below the map and hit the `Save` button. This
    adds the search to the `Map Searches` section, and you can activate the saved
    search at any time by clicking on it.

