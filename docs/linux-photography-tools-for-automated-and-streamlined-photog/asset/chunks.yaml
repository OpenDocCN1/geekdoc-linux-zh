- fmt: '

    Darktable uses non-destructive editing, meaning that no editing actions are applied
    directly to the photo. Instead all editing information is saved in an `*.xmp`
    file, leaving the original photo untouched. The editing operations are displayed
    as a list in the `history` palette, and you can revert to any previous step by
    selecting it in the list. The clever part is that you can turn a history stack
    into a style, so you can apply the exact same actions to other photos in just
    one step. To convert the current history stack to a style, press the `create a
    style` button which sits next to the `compress history stack` button. Give the
    new style a name and description. Save the style, and you can then apply it to
    any photo when you are in the `lighttable` interface. Darktable also lets you
    save the current state of the edited photo as a snapshot. But keep in mind that
    these snapshots are not persistent, so they disappear when you close the application.


    The viewing area in the middle provides a large preview of the currently processed
    photo. The thumbnail strip at the bottom of the pane lets you quickly select a
    photo from the current film roll and open the photo for editing. You can also
    use the thumbnail strip to assign star ratings to the photos, and the toolbar
    at the top of the main pane lets you apply color labels to the photos and filter
    the photos by different criteria.


    The right sidebar acts as a toolbox that holds tool palettes. Palettes in Darktable
    are treated as modules, and you can enable and disable them at will. This allows
    you to customize your workspace to fit your specific photographic needs. Darktable
    comes with only a few key modules enabled by default, but you can easily enable
    other modules by picking the ones you like in the `more modules` palette. To make
    it easier to keep tabs on the multitude of tools Darktable has to offer, all palettes
    are organized into several groups like `basic`, `color`, `correction`, and `effect`.


    Each module contains a number of parameters you can tweak. The `sharpen` module,
    for example, lets you adjust three key parameters: radius, amount, and threshold.
    If you are not happy with the result, you can reset all the parameters by pressing
    the `reset parameters` button in the top-right corner of the palette. You can
    also save the current parameter values as a preset which you can then easily apply
    to other photos. To save a preset, press the `presets` button, choose the `store
    new preset` command, and give the new preset a name. Darktable can apply the created
    preset to photos that match specific criteria. For example, you can configure
    the sharpen preset to be applied to all photos with a specific ISO (e.g., ISO
    `1600` and higher). To do this, tick the `auto apply this preset to matching images`
    check box and specify the desired value in the `ISO` section.


    ## Darktable modules


    Darktable comes with a large collection modules that let you perform a wide range
    of processing operations: from simple crop and rotate to more advanced actions
    like tone mapping and color zone adjustments. Most modules are pretty straightforward
    in use, and you can get to grips with them by experimenting with the available
    parameters. Better yet, some modules like `equalizer` and `graduated density`
    come with several default presets, so you can use these tools without fiddling
    with different parameters.


    In addition to essential modules like `base curve`, `exposure`, `white balance`,
    and `crop and rotate`, Darktable offers a few nifty tools that can help you to
    improve photos with a minimum of effort. The `velvia` module, for example, boosts
    colors by increasing saturation in low-saturated areas of the photo, while the
    `bloom` tool adds or emphasizes halos in bright areas (this effect works best
    on photos with sharp highlights like a street light at night). As the name suggests,
    the `zone system` module is based on the zone system technique developed by Ansel
    Adams and Fred Archer. Using this module, you can adjust the contrast of specific
    parts of the photo. The `monochrome` module can come in handy when you need to
    convert color photos to black and white, and the `graduated density` module lets
    you emulate different GND filters.


    ![](media/file12.jpg)


    `Color zones` is another clever module which can help you to adjust the saturation
    and brightness of a specific color without affecting other colors in the photo.
    Despite the advanced behind-the-scenes processing, the module is rather straightforward
    in use. First, you have to pick the color you want to adjust. To do this, switch
    to the `hue` section, press the `eye dropper` button, and use the mouse to select
    the desired color area on the photo. You should see a black vertical line in the
    color table in the `color zones` palette. This line marks the selected color in
    the color table. To increase saturation, click on the `saturation` tab, and use
    the mouse to drag the horizontal line up to the point where it crosses the black
    line. In a similar manner, you can adjust the brightness of the selected color
    in the `lightness` section.


    ![](media/file13.jpg)


    ## Export processed photos


    Once the RAW files have been processed, switch back to the `lighttable` interface
    to export the resulting photos. The `export selected` palette lets you configure
    export settings, including destination, file format, size, and color profile.
    Besides the ability to export photos to the hard disk, Darktable can upload the
    selected photos to your Flickr or Picasa Web Albums account as well as send them
    via email. The application supports a wide range of graphic formats, including
    8-bit JPG, 8/16-bit PNG, and 8/16-bit TIFF. In the `target storage` section you
    can also define a rule for automatically generating a destination path using variables
    like `$(FILE_NAME)`, `$(PICTURES_FOLDER)`, `$(HOUR)`, `$(DAY)`, `$(MONTH)`, and
    others (hover the mouse over the destination path to view a list of all variables).
    The `$(HOME_FOLDER)/$(FILE_NAME)` rule, for example, saves the exported photos
    under their original names in the user home directory.


    # Manage and process photos with digiKam


    In a way, digiKam is an underappreciated application. Many Linux users may have
    heard that it’s a decent tool for managing photo collections, but they might not
    be aware of digiKam’s more advanced features and the fact that this application
    covers the entire photographic workflow. This article introduces some of digiKam’s
    key features and shows how they can be used to set up a complete workflow, including
    importing, organizing, and editing photos and RAW files.


    ## digiKam AppImage package


    If you want to try the very latest version of digiKam, you either need to install
    it from a third-party repository or compile the application from source. There
    is also a third option: using the digiKam AppImage package. It is a single file
    that contains all the required files and libraries. This means that you don’t
    need to install anything: grab the latest AppImage package from the project’s
    website, make the downloaded file executable using the `chmod +x digikam-x.x.x.appimage`,
    then double-click on the file to launch digiKam. This convenient option does have
    a couple of drawbacks, though. It’s slower to launch and offers no system integration.
    Also, it’s not possible to modify the application’s files, so you can’t replace
    the default splash screen and add custom presets.


    ## Importing photos and RAW files

