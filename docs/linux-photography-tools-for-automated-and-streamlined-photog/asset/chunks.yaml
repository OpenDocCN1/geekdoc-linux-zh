    \ machine running rclone shares the Internet connections with other clients. Limiting\
    \ the bandwidth ensures that other machines can access the Internet at a reasonable\
    \ speed during the copy or sync operations. The bandwidth limit can be specified\
    \ in kilobytes, megabytes, or gigabytes using the k, M, and G suffixes:\n\n```\n\
    rclone --bwlimit=15M sync /path/to/source remote:destination\n```\n\nThe command\
    \ above limits the bandwidth to 15MBytes/s.\n\nThe `--dry-run` option has been\
    \ mentioned earlier, and it allows you to test rclone operations without applying\
    \ any changes. Finally, if you run rclone unattended, you might want to use the\
    \ `--log-file` option to save rclone’s output to a file for later reference:\n\
    \n```\nrclone --log-file=rclone.log sync /path/to/source remote:destination\n\
    ```\n\n### Use filters in rclone\n\nFiltering options and patterns in rclone can\
    \ be used to configure rclone to skip certain files and directories. Filtering\
    \ rules in rclone work with most commands, including `copy` and `sync`. A filtering\
    \ rule in rclone consists of two parts: an exclude or include subcommand and a\
    \ filtering pattern. rclone features four filtering subcommands: `--exclude`,\
    \ `--exclude-from`, `--include`, and `--include-from`. The first two commands\
    \ can be used to exclude files, while the other two let you limit the current\
    \ operation only to the specified files. The `--exclude` subcommand allows you\
    \ to specify the filtering pattern in-line, for example:\n\n```\nrclone --exclude\
    \ *.NEF sync /path/to/source remote:destination\n```\n\nThis command syncs everything\
    \ except the RAW files with the *.NEF* extension. Instead of specifying a filtering\
    \ rule on the fly, you can save a list of filtering patterns in a text file and\
    \ use the `--exclude-from` subcommand with it:\n\n```\nrclone --exclude-from=filters.txt\
    \ copy /path/to/source remote:destination\n```\n\nThe `--include` command can\
    \ come in useful when you need to limit rclone to a specific subset of files.\
    \ For example, if you want to sync TIFF and JPEG files in a directory and skip\
    \ the rest, the following filtering rule does the job:\n\n```\nrclone --include\
    \ *.{tif,jpg} copy /path/to/source remote:destination\n```\n\nSimilar to `--exclude-from`,\
    \ the `--include-from` command can read filtering patterns from a text file.\n\
    \nUsing the exclude and include subcommands, you can create filtering rules that\
    \ either skip or include matching files. But what if you need to create a set\
    \ of filters that combines both? Then the `--filter-from` subcommand is what you\
    \ need. This subcommand reads a text file containing include and exclude filtering\
    \ rules and applies them to the current rclone operation:\n\n```\nrclone --filter-from=filters.txt\
    \ sync /path/to/source remote:destination\n```\n\nEach line in the specified text\
    \ files contains a filtering rule that starts with either the + (include) or -\
    \ (exclude) prefix, for example:\n\n```\n+ *.jpeg\n+ *.tiff\n- *.MP4\n- *.xmp\n\
    ```\n\nAs you may have noticed, filtering patterns in rclone are based on wild\
    \ cards. While they are not as powerful as regular expressions, wild cards are\
    \ significantly easier to master. And if you used wild cards when working from\
    \ the command line, you won’t have problems composing filtering rules for rclone.\n\
    \n## Detect data rot in photos and RAW files\n\nBackup will help you to keep your\
    \ photos safe, but it won’t solve another issue — data rot (also known as data\
    \ decay and [data degradation](https://www.wikiwand.com/en/Data_degradation)).\
    \ Data rot can occur for a number of reasons, but the result is always the same:\
    \ data corruption due to one or more changed bits in the file. Usually data decay\
    \ happens silently, so you probably won’t realize it happened before it’s too\
    \ late. One way to combat data rot is to make sure that your have a healthy backup\
    \ which you can use to restore the corrupted files and ensure that the damaged\
    \ file doesn’t propagates to all your back up copies. This means that you need\
    \ to check your photos and RAW files for data rot and detect corrupted files before\
    \ you perform backup, and a simple Bash shell script can help you with that.\n\
    \n```\n#!/usr/bin/env bash\nshopt -s nullglob\nfor file in *.JPG *.jpeg *.ARW;\
    \ do\n    if [ ! -f \"$file.sha1\" ]; then\n       sha1sum \"$file\" > \"$file.sha1\"\
    \n    fi\n    sha1sum -c \"$file.sha1\" | grep \"FAILED\"\ndone\n```\n\nDuring\
    \ the initial run, the script generates hash files using the SHA1 hash algorithm\
    \ for each photo and RAW file in the current directory. The example above handles\
    \ files with the *.JPG*, *.jpeg*, and *.ARW* extensions, but you can add any other\
    \ file extension you need. When you run the script again, it compares the current\
    \ checksum with the saved one. If they don’t match, then the file in question\
    \ is either modified or damaged. If the former case (e.g., you’ve edited a photo\
    \ or RAW file), just delete the related *.sha1* file. But if you haven’t modified\
    \ the photo or RAW file in any way, the checksum mismatch indicates that the file\
    \ might be corrupted. In this case, replace it with a healthy copy from a backup.\n\
    \n## Recover photos with PhotoRec"
