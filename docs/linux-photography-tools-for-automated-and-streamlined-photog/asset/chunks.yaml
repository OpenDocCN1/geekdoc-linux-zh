    digiKam 专为管理数百甚至数千张照片而设计，提供了强大的搜索功能，可以帮助你通过多种不同的方式找到你想要的照片。


    ### 快速搜索与过滤


    如果你需要快速定位或过滤照片，首选应该是右侧的 `Filters`（过滤器）边栏。在这里，你可以使用 `Tags Filter`（标签过滤器）部分中所有可用标签列表，快速定位包含特定标签的照片。选择一个或多个标签，digiKam
    将返回当前专辑中所有匹配的照片。要使用评分过滤器，请指定所需的星级数，digiKam 将将视图缩小到匹配的照片。默认情况下，评分过滤器使用 `Greater
    Than or Equals`（大于等于）条件，但你可以通过 `Rating Filter Options`（评分过滤器选项）下拉列表在其他选项之间进行选择。


    ![](img/file19.jpg)


    虽然快速搜索和过滤功能可以帮助你以最少的麻烦找到所需的照片，但请记住，它们返回的结果很大程度上取决于每张照片元数据的质量和完整性。digiKam 更高级的搜索功能也是如此，因此为了充分发挥这些功能的潜力，你应该对照片进行标记和评分，并尽可能添加尽可能信息。


    ### 高级搜索功能


    除了 `Filters` 右侧边栏中的快速搜索和过滤工具外，digiKam 还提供了通过侧边栏访问的高级搜索功能。在这里，你会找到各种搜索选项，包括 `Calendar`（日历）、`Tags`（标签）、`Timeline`（时间轴）、`Searches`（搜索）、`Fuzzy
    Searches`（模糊搜索）、`Map Searches`（地图搜索）和 `People`（人物）。


    #### 日期

    `Dates` 部分让你快速找到特定年份、月份的照片。使用主面板中的树形结构，你可以轻松找到所需的年份月份。选择所需的月份，digiKam 会立即显示相关照片。想查看特定日期拍摄的照片吗？你可以使用底部的日历，其中包含照片的日期会加粗显示。点击你想查看相关照片的日期。


    ![](img/file20.jpg)


    #### 时间轴

    `Timeline` 部分提供了另一种定位和查看特定时期照片的方法。这里的所有照片都以条形图的形式呈现，你可以点击相关的条来查看特定期间的照片。`Time
    Unit`（时间单位）下拉列表让你指定图表所需的时间尺度：`Year`（年）、`Month`（月）、`Week`（周）和 `Day`（天）。`Timeline`
    部分还有一个小技巧：你可以将搜索保存为虚拟专辑。要保存当前搜索，请在时间轴下方的字段中为它命名，并按下 `Save`（保存）按钮。这将虚拟专辑添加到 `My
    Date Searches`（我的日期搜索）列表中。


    ![](img/file21.jpg)


    #### 搜索

    `Search` 部分让你以更传统的方式进行搜索。在 `Search` 字段中输入搜索词，digiKam 会自动在主面板显示匹配的照片。为了让搜索更精确，按下
    `Advanced Search`（高级搜索）按钮。这将打开 `Advanced Search` 界面，允许你使用广泛的准则搜索照片：从标签和图像属性到特定的文本和元数据值。在配置高级搜索查询时，你可以随时按下
    `Try` 按钮查看它是否返回了你正在寻找的照片。一旦你对结果满意，就可以保存搜索以备后用。在 `Save Current Search`（保存当前搜索）部分为搜索命名，并按下
    `Save` 按钮。然后你就可以在 `My Searches`（我的搜索）列表中选择它来运行搜索。


    ### 在 digiKam 中处理 RAW 文件


    digiKam 通常使用默认设置就能很好地解码 RAW 文件。但如果你喜欢完全控制应用程序处理 RAW 文件的方式，请选择 `Settings → Configure
    digiKam`，切换到 `Image Editor → RAW Behavior`（RAW 行为）部分，并启用 `Always open the Raw
    Import Tool to customize settings`（始终打开 RAW 导入工具以自定义设置）选项。下次你打开 RAW 文件进行编辑时，digiKam
    会带你进入 `RAW Import` 模块，你可以在那里调整 RAW 导入和后期设置。


    `RAW Import` 边栏包含三个标签：`RAW Decoding`（RAW 解码）、`Post Processing`（后处理）和 `Info`（信息）。`RAW
    Decoding` 部分让你访问某些设置，可以调整去马赛（demosaicing）、白平衡、降噪和色差校正，以及色彩管理设置。


    ![](img/file22.jpg)


    去马赛是从图像传感器的 RAW 输出中重构完整彩色图像的过程。digiKam 用于处理 RAW 文件的 `LibRaw` 库支持多种去马赛算法，包括 `Bilinear`、`VNG`、`AHD`、`LMMSE`
    等。你可以使用快捷键 `Shift+F1` 查看每种算法的简短且较具技术性的描述。但查看不同算法之间差异的最佳方法是尝试将它们应用于当前打开的 RAW 文件。选择你想要的算法，并按下
    `Update`（更新）按钮预览结果。预览面板显示将将到编辑器中的图像，你可以使用窗口底部的缩放滑块放大图像以进行仔细检查。


    默认情况下，digiKam 将 RAW 文件转换为 8 位彩色图像，但你可以通过启用 `16 bits color depth`（16 位色深）选项来选择
    16 位模式。8 位模式速度更快，但 16 位转换是目前最佳的方法，因为它提供了更好的色调范围。如果你选择在 16 位模式下工作，建议在 `Color Management`（色彩管理）部分中启用并配置色彩管理选项，以防止图像在编辑器中渲染过暗。由于某些算法处理绿色像素的方式，生成的图像可能会包含不良模式。启用
    `Interpolate RGB as four colors`（作为四色进行插值）选项可以解决这个问题。`Do not stretch or rotate`（不拉伸或旋转）选项专门为带有
    CCD 传感器的相机设计。当启用此选项时，图像会旋转 45 度，使输出像素对应一个 RAW 像素。此选项还可以防止图像拉伸到错误的宽高比。


    在 `White Balance`（白平衡）部分，你可以调整白平衡设置并指定系统如何处理高光（照片中的过度区域）。LibRaw 提供了几种恢复高光的算法（`Solid
    White`、`Unclip`、`Bend` 和 `Rebuild`），你可以使用快捷键 `Shift+F1` 查看它们的简短描述。为了更准确地处理高光，请启用
    `Correct false colors in highlights`（修正高光伪色）选项。如果你想让 LibRaw 自动调整亮度，请勾选 `Auto Brightness`。除了白平衡，你还可以启用并调整
    `Exposure Correction`（曝光修正）选项并手动调整曝光补偿。底部的欠曝和过度按钮可以在预览面板中识别照片的欠曝过度区域，帮助你调整曝光设置。


    使用 `Corrections`（校正）部分的选项，你可以选择对图像应用支持的降噪算法，还可以启用色差校正选项并调整其设置。在 `Color Management`（色彩管理）部分，你可以指定色彩配置文件和色彩空间。


    在 `Post Processing`（后处理）标签页下，你可以调整多个曝光设置（例如亮度、对比度、伽马和曝光）以及调整光度曲线。虽然这些调整可以在编辑转换图像时进行，但你可以在
    RAW 导入期间执行这些操作以简化编辑流程。digiKam 将所有调整应用于预览图像，因此你可以在执行实际转换之前立即看到调整结果。


