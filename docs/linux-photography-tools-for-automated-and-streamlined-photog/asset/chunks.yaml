- fmt: '

    Once you’re satisfied with the settings and adjustments you made, press the `Import`
    button to import and process the RAW file. And remember: when in doubt, use the
    `Use Default` button to let digiKam import the RAW file using the default settings.


    ## Edit photos with the Levels and Curves Adjustment tools


    When it comes to improving photos, Levels is an important weapon in digiKam’s
    arsenal. This tool lets you adjust brightness and contrast by specifying the location
    of complete black, complete white, and midtones in a histogram, which makes it
    a perfect tool for fixing under- and overexposed photos as well as improving the
    overall tonal range of a photo.


    ![](media/file23.jpg)


    You can access the Levels tool in the image editor by choosing `Color → Levels
    Adjust`. Select `Luminosity` from the `Channel` drop-down list, and press the
    `Linear` button. The key element in the `Levels Adjust` pane is the histogram
    with the black point and white point sliders. Simply put, the black point slider
    controls shadows, while the white point slider controls highlights. So to darken
    shadow areas in the photo, move the black point slider to the right. Need to boost
    highlights? Move the white point slider to the left. Instead of using sliders,
    you can let digiKam adjust levels automatically by pressing the `Auto` button.
    Using this feature is often hit and miss, but you can easily revert all changes
    using the `Defaults` button.


    Three color pickers next to the `Auto` button provide yet another way to tweak
    levels. To adjust shadows, press the shadow tone color picker button and click
    on an area in the photos that should be black. In a similar manner, you can adjust
    midtones and highlights using the appropriate color pickers. Adjusting levels
    in the `Luminosity` channel can help to increase contrast without affecting color
    saturation. To change the color balance, you can adjust levels in the Red, Green,
    and Blue channels (select the appropriate channel in the `Channel` drop-down list).
    This can be useful for boosting colors and fixing photos which suffer from unnatural
    color casts.


    ![](media/file24.jpg)


    Similar to Levels, the Curves tool (`Color → Curves Adjust`) can selectively remap
    input tones. But unlike Levels, which has only black and white point sliders,
    the Curves tool can be used to control a tonal curve using any number of points.


    The key element in the Curves tool is the histogram that shows the input distribution
    of tones (X axis), and the output tones (Y axis). The left part of the X axis
    represents the darker tones, while the right part represents the highlights. The
    diagonal line (the tonal curve) indicates the ratio between input and output.
    Initially, the line is straight which means that the output is exactly the same
    as the input. Adjusting the tone curve alters the original ratio, thus changing
    the tonality of the image. And this is exactly what the Curve tool is designed
    to do. Click on the diagonal line to add a control point, then adjust the shape
    of the tonal curve by dragging the control point with the mouse. For more fine
    curve adjustment, create additional control points.


    To better understand how curves work, start with a few basic curve adjustments.
    To boost highlights, adjust the top-right part of the tonal curve upwards. As
    noted above, the right part of the histogram represents the highlights, so pushing
    the curve in the `Luminosity` channel upwards increases the brightness of the
    image. Among other things, this technique can be used to produce a high-key lighting
    effect. Another common adjustment is giving the tonal curve the S shape by raising
    the upper half of the curve and lowering the lower half of it. This effectively
    brightens the lighter areas of the image and darkens the darker areas. This, in
    turn, increases the overall contrast of the image without affecting exposure.


    While the `Luminosity` channel allows you to adjust the tonal curve, the Red,
    Green, and Blue channels can be used to control the contribution of each color
    in specific tonal regions of the image. For example, pushing the lower part of
    the curve in the Red channel downwards decreases the contribution of red in the
    dark tones, thus making shadows cooler.


    digiKam provides the ability to save the current curve profile as a preset as
    well as load existing curve presets using the `Save as` and `Load` buttons in
    the right sidebar. The curves are stored in the GIMP-compatible format, so you
    can use curves created with GIMP in digiKam and vice versa.


    ## Color transformations with Hald CLUT


    The ability to save color adjustments as a preset provides a convenient way to
    create presets that can be easily applied to one of several photos. But this functionality
    has its limitations. Firstly, presets are usually application-specific, so presets
    created with one photo editing tool don’t work with other applications. Secondly,
    some applications provide only limited support for presets. digiKam, for example,
    lets you create curve presets only. And lastly, presets can normally be used from
    within the application itself, which makes it impossible to automate actions involving
    presets using scripts.


    The [Hald CLUT](http://www.quelsolaar.com/technology/clut.html) technology overcomes
    these and other shortcomings. The author of Hald CLUT explains it best:


    > Any color correction can be expressed as a Color LookUp Table or CLUT (some
    times written as “Color LUT”). This is a 3D dimensional table where all colors
    are represented in color space. For each color in the color lookup table there
    is a destination color value that corresponds to what the particular color becomes
    when it is corrected using the CLUT. These tables are by nature 3-dimensional
    (Red Green and Blue) and therefore special file formats are used to store them.
    Hald CLUTs however have been converted to a 2D space and since tables store colors
    the CLUT can be be saved as an image, in any non destructive image format.


    Simply put, Hald CLUT is a two-dimensional color table that is used as a reference
    for applying color corrections to an image. Thanks to the fact that the [ImageMagick](http://www.imagemagick.org/script/index.php)
    image manipulation tool supports Hald CLUT, using the technology to create color
    adjustment presets and photo filters is not all that complicated. To install ImageMagick,
    run the `sudo apt install imagemagick` command (on openSUSE use the `sudo zypper
    in imagemagick` command). The first thing you need to do is to create a CLUT table
    using the following command:


    ```

    convert hald:9 hald-9.png

    ```


    Open then the generated *hald-9.png* file in your preferred photo editing application,
    apply the desired color corrections (curves, levels, saturation, brightness, etc.),
    and save the changes. Now you have a reference CLUT table that can be used as
    a preset. To apply color adjustments in the table to a photo, use the command
    below:


    ```

    convert foo.JPG hald-9.png -hald-clut foo-modified.jpeg

    ```


    This applies color adjustments from the *hald-9.png* table to the *foo.JPG* image
    and saves the modified file as *foo-modified.jpeg*.


    You’ll find more info about ImageMagick and Hald CLUT at [www.imagemagick.org/Usage/color_mods/#hald-clut](http://www.imagemagick.org/Usage/color_mods/#hald-clut)


    ## Practical example


    digiKam makes it possible to create photographic effects using a combination of
    curves, hue, and saturation adjustments. But here is the problem: digiKam can’t
    save all these adjustments as a single preset (you can save curve presets only).
    Normally, this would mean that you have to make the same adjustments manually
    every time you want to apply a certain photographic effect to a photo, which is
    not very practical. This is where the Hald CLUT technology can help.

    '
