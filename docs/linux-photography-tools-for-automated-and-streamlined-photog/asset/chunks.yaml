  trans: "\n\nSony α7 Mark III（以及其他新款 Alpha 型号）中的 FTP 传输功能通常不会引起太大关注。当然，在拥有这么多现代技术和应用程序的情况下，很容易忽视这个朴实的功能。但在传输\
    \ RAW 和 JPEG 文件时，FTP 确实能够大显身手。事实上，它有几个重要优势。\n\n- FTP 是一项成熟、可靠且支持良好的技术。\n- 你可以使用\
    \ FTP 将照片传输到本地机器也可以传输到远程服务器。由于 Sony α7 Mark III 支持多个 FTP 配置文件，你可以将照片传输到多个目的地。\n\
    - FTP 服务器几乎适用于任何平台，包括 macOS、Linux 和 Windows。市面上还有许多开源 FTP 服务器可以免费使用。\n- Sony α7\
    \ Mark III 中的 FTP 传输功能支持 RAW 和 JPEG 文件的传输。\n\n## 在树莓派上安装上安装 FTP\n\n如果你手头有一个树莓派，可以轻松地将其转换为供相机使用的专用\
    \ FTP 服务器。首先，使用 `sudo apt install vsftpd` 命令安装 `vsftpd` 服务。\n\n然后运行 `sudo nano\
    \ /etc/vsftpd.conf` 命令，用 `nano` 编辑器打开 `vsftpd.conf` 文件。编辑配置，使其包含以下参数：\n\n```\n\
    anonymous_enable=NO\nlocal_enable=YES\nwrite_enable=YES\n```\n\n此配置禁用了对服务器的匿名访问，并赋予现有用户访问和上传权限。保存更改，并使用\
    \ `sudo service vsftpd restart` 命令重启服务器。\n\n## 配置 FTP 设置\n\n在继续之前，请准备好以下连接信息：\n\
    \n- FTP 服务器的 IP 地址或域名\n- 用户名和密码\n\n如果 FTP 服务器运行在树莓派上，请使用 ``hostname -I | cut -d'\
    \ ' -f1` 命令获取其 IP 地址。登录 FTP 服务器所需的用户名和密码与在树莓派上的用户账户相同。\n\n在你的相机上，按下 `Menu` 按钮并进入\
    \ `Network → Network1 → [FTP Transfer Func.] → FTP Server 1`。选择 `Display Name`\
    \ 并为配置文件取一个简短的描述性名称。返回上一步，切换到 `Destination Settings` 部分。配置以下设置：\n- `Host Name`:\
    \ FTP 服务器的主机名或 IP 地址。\n- `Secure Protocol`:启用安全的 FTP 传输。请保持禁用状态。\n- `Port`: FTP\
    \ 服务器的端口号。如果 FTP 服务器运行在默认端口 21 上，则跳过此字段。\n- `Directory`: 设置 FTP 服务器上的目标文件夹。如果你留空此字段，RAW\
    \ 和 JPEG 文件将上传到用户主目录下的单独文件夹。将使用当前日期作为上传文件夹名称。\n\n按下 `OK` 保存连接设置，切换到 `User Settings\
    \ Info` 屏幕，在相应字段中输入用户名和密码。按下 `OK` 并退出菜单模式。\n\n要将照片从相机上传到配置好的 FTP 服务器，切换到查看模式，按下\
    \ `Menu` 按钮并进入 `Network → Network1 → FTP Transfer`。一旦相机与 FTP 服务器建立连接，选择你想要上传的照片，按下\
    \ `Menu` 按钮并选择 `OK`。\n\n##向 EXIF 元数据中添加有用信息\n\n与 EXIF 元数据中的其他字段不同，`Comment` 字段未为任何类型的数据预留，它通常留给用户决定在里面填写什么。一个\
    \ `Bash` Shell 脚本可以自动在 `Comment` 字段中填充几条有用信息，包括相机型号、镜头和当前日期的天气状况。通过专门的 `Dolphin`\
    \ 动作，你可以点击一下查看这些信息。\n\n在继续之前，你需要注册 OpenWeather API 并创建一个唯一的 API 密钥。你需要用它来获取天气数据。此外，在你的系统上安装所需的包。在\
    \ openSUSE 上，使用 `sudo zypper in exiftool jq`。在 Debian 和 Ubuntu 上，运行 `sudo apt\
    \ install libimage-exiftool-perl`。接下来，打开文本编辑器并将以下代码粘贴到新文件中：\n\n```bash\n#!/usr/bin/env\
    \ bash\n\nif [ -z \"$1\" ]; then\n    echo \"ERROR: Required parameter missing.\"\
    \n    echo \"Please specify file extension, e.g., jpeg\"\n    exit 1\nfi\n\nCONFIG=\"\
    $HOME/addinfo.cfg\"\n\nif [ ! -f \"$CONFIG\" ]; then\n    api_key=$(kdialog --title\
    \ \"API\" --inputbox \"Enter your API key:\")\n    echo \"api_key='$api_key'\"\
    \ >> \"$CONFIG\"\n    echo \"json='$HOME/weather.json'\" >> \"$CONFIG\"\nfi\n\n\
    source \"$CONFIG\"\ncheck=$(wget -q --spider https://api.openweathermap.org)\n\
    if [ -z \"$check\" ]; then\n    for photo in \"$1\";\n    do\n        lat=$(exiftool\
    \ \"$photo\" -gpslatitude -n | cut -d':' -f2)\n        lon=$(exiftool \"$photo\"\
    \ -gpslongitude -n | cut -d':' -f2)\n        if [ -n \"$lat\" ] && [ -n \"$lon\"\
    \ ]; then\n            camera=$(exiftool -Model \"$photo\" | cut -d':' -f2)\n\
    \            lens=$(exiftool -Lens \"$photo\" | cut -d':' -f2)\n            curl\
    \ \"https://api.openweathermap.org/data/2.5/weather?lat=$lat&lon=$lon&appid=$api_key&units=metric&lang=en\"\
    \ > \"$json\"\n            w_sum=$(jq '.weather[0].description' \"$json\")\n \
    \           w_temp=$(jq '.main.temp' \"$json\")\n            w_wind=$(jq '.wind.speed'\
    \ \"$json\")\n            exiftool -Comment=\"Camera: $camera, Lens: $lens, Weather:\
    \ $w_sum, Temp: $w_temp°C, Wind: $w_wind m/s\" \"$photo\"\n        else\n    \
    \        echo \"No GPS data for $photo\"\n        fi\n    done\nelse\n    echo\
    \ \"Could not reach OpenWeatherMap API\"\nfi\n```\n\n"
- fmt: "\nSave the file under the `show-comment.desktop` name, and move it to the\
    \ `/usr/share/kservices5/ServiceMenus/` directory. Launch Dolphin, right-click\
    \ on a JPEG file, choose the `Show EXIF Comment` item, and you should see the\
    \ contents in the `Comment` field in a pop-up box.\n\n# Geotag JPEG files using\
    \ reference photo\n\nSometime the easiest way to geotag JPEG files is to use geographical\
    \ coordinates from an already geotagged photo. One way to do this is to use digiKam.\
    \ While it’s not particularly difficult, this procedure requires a few separate\
    \ steps. A can streamline the entire process.\n\n```bash\n#!/usr/bin/env bash\n\
    ref=\"$1\"\nlat=$(exiftool -gpslatitude -n \"$ref\" | cut -d\":\" -f2 | tr -d\
    \ \" \")\nlon=$(exiftool -gpslongitude -n \"$ref\" | cut -d\":\" -f2 | tr -d \"\
    \ \")\nif [ -z \"$lat\" ] || [ -z \"$lon\" ]; then\n    notify-send \"Geographical\
    \ coordinates are missing.\"\n    exit 1\nelse\n    notify-send $lat $lon\nfi\n\
    if (( $(echo \"$lat > 0\" |bc -l) )); then\n    latref=\"N\"\nelse\n    latref=\"\
    S\"\nfi\nif (( $(echo \"$lon > 0\" |bc -l) )); then\n    lonref=\"E\"\nelse\n\
    \    lonref=\"W\"\nfi\nf=$(yad --center --text-align=center --title=\"Photos to\
    \ geotag\" --button=gtk-cancel:0 \\\n    --button=\"Geotag\":0 --borders=15 --width=250\
    \ --height=150 \\\n    --text='<big>\\nDrop photos you want to geotag  here.\\\
    nPress the <b>Geotag</b> button.</big>' \\\n    --dnd | sed 's/^.......//')\n\
    array=(\"$f\")\nfor file in ${array[*]}\ndo\n    exiftool -overwrite_original\
    \ -GPSLatitude=$lat -GPSLatitudeRef=$latref -GPSLongitude=$lon -GPSLongitudeRef=$lonref\
    \ \"$file\"\ndone\nnotify-send \"All done. Bye!\"\n```\n\nHere is how the script\
    \ works. Using `ExifTool`, it obtains latitude and longitude values from the photo\
    \ which file name was provided as parameter. If it fails to get geographical coordinates\
    \ (i.e., `$lat` and `$lon` values are empty), it show notification and stops.\
    \ If obtaining geographical coordinates was successful, the script uses the `bc`\
    \ tool to calculate correct latitude and longitude references for geotagging.\
    \ The script then displays a drag-and-drop panel, when you drop photos you want\
    \ geotag. When you press the `Geotag` button, the script geotags the selected\
    \ photos.\n\nTo make the described script work, you need to install the `ExifTool`,\
    \ `bc`, `notify-send`, and `yad` tools. To do this on Ubuntu, run `sudo apt install\
    \ libimage-exiftool-perl bc notify yad`. On openSUSE, use the `zypper in exiftool\
    \ bc notify yad`. Copy the script and paste it in a new file. Save the file under\
    \ `geotagref.sh` name and make it executable using the `chmod +x geotagref.sh`.\
    \ Move then the script to the `~/bin` directory. To geotag photos run the script\
    \ followed by the path and file name of reference photo: `geotagref.sh /path/to/foo.jpg`.\n\
    \n# Take a stroll down memory lane with Natsukashii\n\nServices like Amazon Photos,\
    \ Facebook, and Google Photos can help you rediscover your photos and relive your\
    \ memories by showing photos taken on a specific day in the past. But there is\
    \ no need to upload your photos to third-party services to enjoy this feature.\
    \ [natsukashii](https://gitlab.com/dmpop/natsukashii), a Bash shell script, can\
    \ search photos on your machine and generate a simple HTML page with the found\
    \ photos for your viewing. It can also send a notification to your Android device\
    \ through the [Notify](https://github.com/mashlol/notify) app.\n\nDeploying natsukashii\
    \ on the Linux machine that has all photos is easy. First, make sure that you\
    \ have the ExifTool, `Git`, `sed`, and `seq` tools installed on your system. Next,\
    \ use the following command to clone the project’s repository, and create alias,\
    \ so you can run natsukashii using the `natsukashii` command:\n\n```bash\ngit\
    \ clone https://gitlab.com/dmpop/natsukashii.git\necho -e \"\\nalias natsukashii=/share/homes/admin/natsukashii/natsukashii.sh\"\
    \ >> .bashrc\n```\n\nIf the machine running natsukashii also acts a web server,\
    \ you can use natsukashii to publish the photos it finds. To do this, move the\
    \ `www` folder to the document root of your web server. You might want to give\
    \ the `www` folder a different name, example `natsukashii`.\n\nIf you want to\
    \ receive notifications from natsukashii on your Android device, install the [Notify](https://github.com/mashlol/notify)\
    \ app, and note the generated unique token.\n\nNow run the `natsukashii` command,\
    \ and specify the required settings. After that, natsukashii goes through the\
    \ specified directory, and if it finds matching photos, it puts them into a separate\
    \ directory. If you’ve specified the path to the web directory, natsukashii moves\
    \ the found photos there, and you can view them by pointing a browser to the correct\
    \ URL.\n\n![](media/file34.jpg)\n\nWhen using natsukashii, keep in mind that the\
    \ script is not particularly fast. This is because the script needs to find all\
    \ photos that match the specified file extension. It then goes through each photo,\
    \ extracting its date and comparing the date with the given one. And this may\
    \ take a while, depending on the number of photos you have.\n\nWhile you can run\
    \ natsukashii manually, it makes sense to set up a cron job that executes the\
    \ script daily. To do this, run the `crontab -e` command and add the following\
    \ cron job:\n\n```\n@daily /absolute_path/to/natsukashii.sh\n```\n\nSave the changes,\
    \ and you are done.\n\n## Install Natsukashii on a QNAP NAS\n\nSince natsukashii\
    \ is just a regular shell script that relies on standard Linux tools, it can be\
    \ deployed on practically any machine running Linux. This includes network-attached\
    \ storage (NAS) appliances like QNAP. To deploy natsukashii on a QNAP appliance,\
    \ install [Entware](https://github.com/Entware/Entware) (see [Install on QNAP\
    \ NAS](https://github.com/Entware/Entware/wiki/Install-on-QNAP-NAS)). Run then\
    \ the commands below to install the required packages:\n\n```bash\nopkg update\n\
    opkg install git git-http screen perl-image-exiftool sed coreutils-seq imagemagick\
    \ imagemagick-tools imagemagick-jpeg\n```\n\nSwitch then to the folder in your\
    \ home directory, and clone the project’s Git repository using the following command:\n\
    \n```bash\ngit clone https://gitlab.com/dmpop/natsukashii.git\n```\n\nSwitch then\
    \ to the `natsukashii` directory and run the `./natsukashii.sh` command.\n\nCreating\
    \ a cron job on QNAP is slightly different from the standard procedure. Open the\
    \ `/etc/config/crontab` file in a text editor, and add the following cron job:\n\
    \n```\n@daily /bin/sh /absolute_path/to/natsukashii.sh\n```\n\nSave the changes\
    \ and restart the cron service using the `/etc/init.d/crond.sh restart` command.\n\
    \n## Add password protection to Natsukashii\n\nNatsukashii is designed to publish\
    \ all photos that match the current date, even private ones. If you don’t feel\
    \ like letting the entire world see all your photos, you might want to protect\
