    sudo chmod +x ./vhusbdpin\nsudo mv vhusbdpin /etc/init.d\nsudo update-rc.d vhusbdpin\
    \ defaults\nsudo reboot\n```\n\nDownload a VirtualHere client binary from [virtualhere.com/usb_client_software](https://www.virtualhere.com/usb_client_software)\
    \ to your Linux machine and use the `chmod +x vhuitXX` command (replace `vhuitXX`\
