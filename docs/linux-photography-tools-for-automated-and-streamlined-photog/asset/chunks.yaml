    \ }\n            </style>\n        </head>\n        <body style=\"text-align:\
    \ center\";>\n            <h1>$title</h1>\nEOT;\n\n$html = file_get_contents($md);\n\
    $Parsedown = new Parsedown();\necho $Parsedown->text($html);\n\n$files = glob($dir.'/*.'.$ext);\n\
    $file = array_rand($files);\n$img = $files[$file];\n\n$exif = exif_read_data($img,\
    \ 0, true);\n$caption = $exif['COMMENT']['0'];\n\necho <<< EOT\n            <img\
    \ style=\"border-radius: 9px;\"; src=\"$img\" />\n            <p style=\"\">$caption</p>\n\
