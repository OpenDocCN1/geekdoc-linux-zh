  md: '# id Idle time.


    Example 4-2 is a sample script that runs the vmstat command to gather usage information
    and save it in a file. In this way, administrators can utilize the statistics
    about memory usage and CPU usage to guard the server if heavily utilized. To use
    this script, create and save the script, then set it to run periodically using
    crontab. (Find more details about how to do this in 3.2.4, ''Crontab'' on page
    156, and ''Scripts'' on page 154.)


    Example 4-2 vmstat.sh


    #/bin/bash


    FILE_NAME=/var/log/vmstat.log

    NR_OF_SEC=2 # Time between reading

    WAIT_TIME=10 # The number is in sec.


    ```

    echo "######################################" >> $FILE_NAME

    echo "######################################" >> $FILE_NAME

    echo "" >> $FILE_NAME

    date >> $FILE_NAME

    echo "--------------------------------" >> $FILE_NAME

    vmstat $NR_OF_SEC >> $FILE_NAME

    echo "" >> $FILE_NAME

    sleep $WAIT_TIME

    for i in $(ps ax|grep vmstat | awk ''{print $1}'')

    do

    kill -9 $i > /dev/null

    done

    ```


    # KDE System Guard


    KDE System Guard is equivalent to Windows Task Manager and Windows Performance
    Monitor in one tool. The Windows Task Manager Performance and Networking tabs
    are similar to the System Guard System Load and Process Tables. (see Figure 4-5
    on page 204 and Figure 4-6 on page 205). The Windows Performance Monitor is similar
    to System Sensors (see Figure 4-11 on page 208).


    To start KDE System Guard, click Start -> System -> Info -> KDE System Guard on
    SuSE, or Start -> System -> KDE System Guard on Red Hat; see Figure 4-4 on page
    203.'
