    # 4.2 Domino performance and scalability


    This section describes some of the general features and functions related to Domino
    server performance, scalability, and reliability.


    # 4.2.1 Domino performance


    Domino Enterprise Server offers clustering, which provides superior performance
    by increasing the availability of your databases and answering client requests
    in the best fashion determined by dynamic analysis of the cluster members performance.
    Transaction logging is available with every installation of Domino; it improves
    long-term reliability by keeping data from being deleted during consistency checks
    caused by the failure of a server. In addition, multiple mailboxes are a simple
    change that will help with mail delivery performance.


    # Clustering


    As the Beowulf Project amply demonstrates (http://www.beowulf.org), Linux is well-suited
    to clustering, and this is true of Linux Domino 6 clustering as well. The benefits
    of Domino clusters are primarily due to two factors:


    +   * Availability

    * Workload balancing


    In essence, Domino clusters appear to Notes clients as a single server. When a
    server fails, the other server or servers in the cluster handle client requests'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'seamlessly. When a server in a cluster is overwhelmed, load balancing shunts
    the request to another cluster member, providing better service.


    There are secondary benefits as well, though these indirect benefits were not
    specifically designed as part of clustering. Should one database become corrupt,
    it is possible to delete replica and create a new one from a replica located on
    another cluster member. This would be a risky proposition with a replica on a
    standard replication schedule since it could be out-of-date and result in data
    loss. Domino clusters, on the other hand, are kept up-to-date event-driven replication
    provided by the Cluster Replicator task. Differences are measured in seconds,
    instead of hours or days.


    > Note: Domino 6 provided clustering for Web clients (Internet Cluster Manager)
    ICM For more information see Applying the Patterns for e-business in Domino and
    WebSphere Scenarios, SG24-6255. For business-critical applications you should
    investigate the use of specialized load balancing equipment like IBM WebSphere
    Edge or Cisco LocalDirector.


    Once you have the Enterprise edition Domino installed, you can add servers to
    a cluster by clicking the Add to Cluster button in the Domino Directory. Some
    points to keep in mind when you set up a Domino cluster:


    +   - Use all servers in the cluster instead of designating a standby server.
    This will provide better service to your customers and utilize your resources
    more effectively. Keep in mind, however, that you should not allow the average
    usage (number of client requests, databases, and so forth) to exceed the capabilities
    of the cluster minus one server.


    +   - You should use two cluster replicators to prevent backlogs. In your notes.ini,
    add the line cluster_replicators=2. When an agent begins updating a large number
    of documents in a database, this will require the cluster replicator to work almost
    exclusively on that database. A second replicator will allow quick updates in
    other databases to be replicated immediately. Do not enable more than two cluster
    replicators until statistical analysis indicates that you would benefit from additional
    replicators. You can measure the load on your cluster replicators by issuing show
    stat combined with one of these four statistics at the Domino console:


    +   - Replica.Cluster.SecondsOnQueue.Avg shows the average amount of time a database
    spent replicating.


    +   - Replica.Cluster.SecondsOnQueue.Max shows the maximum amount of time a database
    spent replicating.


    +   - Replica.Cluster.WorkQueueDepth.Avg shows the average number of databases
    waiting to be replicated.'
