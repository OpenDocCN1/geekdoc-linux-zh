    Linux usually has six runlevels. Runlevel 0 is used to shut down the server; runlevel
    6 is used to restart the server. Runlevel 1 (Single user mode) is used like the
    Windows recovery mode. Most systems normally run at runlevel 3 (command line)
    or runlevel 5 (X-Windows).


