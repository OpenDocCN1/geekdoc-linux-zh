  md: '# Options for NSD


    There are a number of options that can be used with the NSD tool depending on
    the level of detail required. Following is a summary of the options.


    The NSD tool is constantly evolving and changing, and new options may be added
    in the future. The -help option will show a complete list for the version of NSD
    you have installed.


    +   -batch

    Run in batch mode - don''t write to tty

    -info

    Just report system info

    -noinfo

    Don''t report system info

    -nolog

    Don''t log output to log file

    -nodbx

    Don''t collect process debug info

    -version

    Just show version header

    -ps

    Show process tree

    -kill

