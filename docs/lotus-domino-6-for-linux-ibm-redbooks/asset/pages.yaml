    itsdom6, is a member of that group. Those familiar with Lotus will understand
    the use of users and groups. The main difference is that in Linux you cannot nest
    a group within another group.


    To check for the, we launch KATE by navigating to Start Application -> Office
    -> Editors -> KATE (suSE) or Start Application -> Editors -> KATE (RedHat). KATE
    is a simple GUI text editor suitable for viewing the /etc/group file. You can
    see that the group, notes, is listed at the bottom and that our itsdom6 account
    is a member.


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_99_0.png)


    Figure 2-3 The contents of the /etc/group file.


    If you look at the file, you will find the number 500 in the itsdom6 line and
    again on the notes group line. Just as DNS is a human-friendly version of numerical
    IPs, Linux associates the names of users and groups with unique numbers we can
    refer to them by name instead of number.'
