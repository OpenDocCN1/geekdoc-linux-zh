    process would call other processes, such as event or update. These processes were
    called the child processes of the server.


    When one process exits, the child process for that process becomes "orphaned,"
    which means that the parent process has exited and the operating system reverts
    to init, which is the first process started in a UNIX operating system. Init is
    responsible for loading all other processes and always has the process ID of 1.


    This information can sometimes lead us to which process has crashed when a crash
    does occur and sufficient crash information is not captured (such when the core
    file is truncated).


