  md: '# 3.2.8 Remote administration


    Linux servers can be administered remotely and there are many software programs
    available for this. Several of the most commonly used are described here.


    # Webmin


    Webmin is a powerful tool for remotely administering a Linux server. It can be
    downloaded for free from:


    http://www.webmin.com


    It can be downloaded either as a .rpm package or as a source file. Download the
    .rpm file, log in as root, and use the Package Manager to install the Webmin software.
    You can also use root from the shell command line.


    Once installed, access from a Web browser to the server:


    http://server IP address>:10000


    You will be prompted for your username (root) and a password (root''s password).
    After login, the Web browser will look like the example shown in Figure 3-23 on
    page 172.


    Through the Webmin software, the system administrator can configure the server
    and its applications from virtual anywhere. The Webmin server configuration page
    is easy to use but has numerous capabilities, as shown in Figure 3-23.


    > **Attention:** We recommend that you use the Webmin software only from an internal
    network if you do not use SSL authentication.


