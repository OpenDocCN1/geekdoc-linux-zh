    carry out these steps. Unlike Domino R5 for Linux, Domino 6 takes advantage of
    the variable stack size provided by glibc, and so you do not need to alter the
    stack size of glibc. Though there are quite a few steps, we have detailed them
    carefully so that even those relatively new to Linux should be able to make this
    alteration.'
