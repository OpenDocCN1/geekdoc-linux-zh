    Linux operating system was released later in May 2002. The redbook team did some
    limited testing with version 7.3, and all the installation instructions deemed
    to also apply to this version.


    > Note: We recommend using Red Hat Advanced server version 2.1 or newer instead
    of the RH Personal or RH Professional version. The RH Advanced Server has an extended
    release cycle. The RH Advanced Server has also been certified by the top ISVs,
    as IBM. The installation of the RH Advanced Server is similar to the installation
    of the RH Professional version, which we detail here.


    To capture the screens shown in this book, we have installed and configured Linux
    in a VMware window. VMware is a product by VMware, Inc. (http://www.vmware.com).
    It allows to run one operating system as a guest of another. This means that some
    of the screens might look slightly different from what you would see on your system.
    These differences are hardware-related, as VMware emulates different hardware
    devices for the guest operating system.'
