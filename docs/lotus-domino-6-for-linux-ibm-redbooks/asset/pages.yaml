  md: '# 3.3 Domino security


    In general, the principles of Domino security are the same from platform to platform.
    This section provides an overview of initial options available for securing a
    Domino server.


    # 3.3.1 Domino 6 server document


    Once you have the server set up, open the Domino Directory (names.nsf) and review
    the server document. This document controls myriad server functions, including
    security.


    The Security tab contains settings for the following:


    +   Access server - The default is blank. At the very least, the organization
    name used during setup, which in our case was */ITSO. This helps to ensure that
    only those to whom you have issued an ID access the server.


    > Tip: You can add other domains to the Access Server field after you have added
    the appropriate cross-certification. Remember that a Domino server will not be
    able to authenticate users or servers from a different organization unless it
    has a cross-certificate.


    +   Check passwords on Notes IDs - The advantage of enabling this feature is that
    when users listed in the Domino Directory lose their Notes IDs, they will be able
    to change the password on the backup Notes ID and prevent the lost ID from accessing
    the Domino server. The disadvantage is that, like many security options, it slightly
    increases the overall administrative burden.


    +   Create new databases - Enter individual names, or preferably, create an administration
    group and enter the name of the group. If you leave this field blank, anyone who
    can access the server can create new databases.


    +   Create replica databases - Enter individual names, or preferably, create an
    administration group and enter the name of the group. If you leave this field
    blank, no one can create new replicas.


    > Important: If the Create new database field is empty, it means that anyone can
    create new databases; but if the Create new replica field is blank, it means that
    no one can create a replica.


    The Ports - Internet Ports tab contains settings for the following:


    +   On the Web tab, you can redirect HTTP to SSL once you have the SSL certificates
    in place. The same is true for the Directory tab and LDAP, as well'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'as the other listed services. All of these services can be redirected to SSL
    once you have the SSL certificates in place.


    The Internet Protocols tab contains numerous options for Web access; consult the
    appropriate Lotus documentation for details.


    > Tip: If you are using the Lotus Notes 6 client via CrossOver Office or a Windows
    machine, you can click and hold the mouse to view pop-up help on many items in
    the server document.


    # 3.3.2 Database ACLs


    You should read the ACLs of at least the following databases: names.nsf, admin4.nsf,
    and certlog.nsf.


    +   Set the Default to No Access. By Default set to No Access, you do not need
    to add an Anonymous entry.


    Attention: For databases where Default is not set to No Access, you should make
    certain that there is an Anonymous entry set to ACL unless you specifically wish
    to allow anonymous access, such as with a Web home page or a registration database.


    +   Assign an appropriate User Type to each entry. Make certain to differentiate
    Person and Server, as well as single (Person or Server) and group entries (Person
    Group or Server Group). A wildcard entry should be treated as a group.


    +   Consider using "Enforce a consistent ACL" for the Domino Directory (names.nsf)
    and Administration Requests database (admin4.nsf). This will help ensure that
    only the appropriate administrators make changes to these databases. Enforce a
    consistent ACL across all replicas also applies to databases which users replicate
    to their local machines. Therefore users cannot access locally data that they
    could not access on the server.


    You must be careful with this option if you accidentally omit the rights to access
    the database, it cannot be bypassed by accessing the database locally.


    See the Lotus Domino Administration 6 help database for more about this option
    and its limitations.


    +   Further Domino system control over databases can be managed through the Security
    tab of the Server document. From there one can assign additional administrative
    privileges over those databases. The added database access these'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'settings can have should taken into account when configuring database security.
    Special attention should be given to the "Full Access administrator" if Full Access
    Administration is being used because it can bypass all ACL settings, including
    Enforce ACL.


    +   - In order to delegate administrative access to a database based on pubnames.ntf,
    an administrator will want to look at implementing the Extended ACL (also known
    as the xACL). This allows you to further restrict access to a database to the
    field level. See the Lotus Domino Administration 6 help for more information about
    xACL.


    You should also consider the ACL of log.nsf quite a bit of information can be
    gathered from the logs. However, you should balance the need to secure the log.nsf
    database with the need for Domino administrators and developers to view it. One
    solution is to set the Default entry to No Access, add a group with Manager access
    for administrators, and add your administrative unit, for example /ITO, with Reader
    access or else add a second group for developers and others. Whether the additional
    overhead of maintaining a second group for developers is worth the hassle depends
    on the location of the server (Internet, Intranet, or internal) and the level
    of logging. Any server not located behind one or more firewalls blocking internet
    traffic should be held to more stringent ACL settings than internal servers.


    There are a number of notes.ini variables that help with security as well as administration.
    While setting these will generate useful information in the log.nsf database,
    remember that all logging comes with a performance price. Only use the level of
    logging required for the server.


    +   - log_replication - As with all notes.ini settings, you can add this directly
    to the notes.ini by adding the line:

    log_replication=1


    or by issuing the following command from the Domino console:

    set config log_replication=1

    A value of 1 provides a summary of the replication once it finishes. A log level
    of 2 is useful when you prefer to know the specific types of changes that were
    replicated (data, ACL, view design, and so forth).


    +   - log_console - This is set to either 0 or 1. A value of 1 will record commands
    entered at the console.


    +   - log_sessions - This is set to either 0 or 1. A value of 1 will record each
    user session and so will generate a lot of log entries.


    +   - log_agentmanager - This is set to either 0 or 1. A value of 1 will record
    the start of agents in the log, which is quite useful for troubleshooting.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '+   log_mailrouting - A value of 20 is normal, though 10 can be used to record
    minimal information. A value of 30 or 40 should only be used temporarily when
    troubleshooting a specific mail routing problem.


    > **Important:** The notes.ini file must have a blank line at the bottom.


    > **Note:** More details about Domino security are in Lotus Notes and Domino R5.0
    Security Infrastructure Revealed, SG24-5341.


    # 3.4 Domino 6 administration


    In this section, we highlight the use of the Domino 6 Web Administrator Client.
    The Domino 6 Web Administrator closely parallels the Domino 6 Administrator available
    for the Windows 32 client. This new feature provides Domino administrators using
    a Web browser with much, if not all, of the functionality available with the Windows
    Administrator client.


    We discuss the new Domino 6 Java Console, which is a separate console-controller
    pair that allows an administrator to work with a server even when the Domino Server
    is not responding.


    # 3.4.1 Domino 6 Web Administrator


    The Domino 6 Web Administrator is managed by the HTTP task. The first time this
    task starts it will automatically create the webadmin.nsf database if it does
    not already exist. Default access to this database is permitted to all Server
    Administrators and Full Server Administrators as defined in the Domino 6 server
    document under the Security tab. In Pre-release 1, any administrators added to
    the server document are updated to the webadmin.nsf Access Control List by the
    HTTP task.


    > **Note:** Refer to the Domino 6 Administration Help for detailed instructions
    on administering the Domino server.


    # Domino 6 Web Administrator requirements


    The requirements for using the Domino 6 Web Administrator are listed below.


    # Software requirements


    In order to access the features of the Domino 6 Web Administrator, you need to
    have the following:'
  merge: -1
  pgno: 190
- img_proc: true
  md: '+   - Web browser

    - MS Internet Explorer 5.5 or 6.0 on Windows 98/NT4/W2K/XP

    - Netscape 4.7x on Windows 98/NT4/W2K/XP or Linux (RedHat 7.2 or SuSE 7.2)

    - Domino 6 Server


    # Domino tasks


    The Domino 6 Server must be running the following tasks to support the Domino
    6 Web Administrator:


    +   - The Administration Process (AdminP) on the same server

    - The Certificate Authority (CA) on the same server or another Domino 6 server
    in order to register users

    - Web server (HTTP)


    > Note: The process of registering users also requires the migration of the Notes
    certifier to the Certificate Authority process. This migration and other aspects
    of Domino 6 user registration are covered in detail in “Domino user registration”
    on page 248.


