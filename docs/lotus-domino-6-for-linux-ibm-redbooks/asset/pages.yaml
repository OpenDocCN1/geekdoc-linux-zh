    # Norton AntiVirus for Lotus Notes/Domino


    In addition to OS-level antivirus software, Symantec has a specific antivirus
    product for Domino server. At the time of writing, the current version of Norton
    AntiVirus for Lotus/Notes Domino (NAV) is 2.5.


    Among the features of Norton AntiVirus are:


    +   * It eliminates viruses automatically.

    * It quarantines infected documents and sends an e-mail to the administrator for
    review and actions.

    * It runs as an add-in to Domino task and its name is NINTASK. You can find it
    in the ServerTasks= line of the notes.ini file.

    * LiveUpdate software lets administrators automatically download the latest virus
    definitions and deploy them throughout the Domino environment from one location.'
  merge: -1
  pgno: 424
- img_proc: true
  md: "# Installing Norton AntiVirus for Lotus Notes/Domino\n\nIn this section we\
    \ describe how to install Norton AntiVirus for Lotus Notes/Domino.\n\n> Attention:\
    \ We recommend that you read the Readme file on the Norton AntiVirus CD prior\
    \ to installation.\n\n# System requirements\n\nFollowing are the system requirements\
    \ necessary to install Norton AntiVirus for Lotus Notes/Domino.\n\n+   - Operating\
    \ systems:\n  - Red versions 6.2 or higher\n  - SuSE 7.3 or higher\n- Lotus Notes:\
    \ Domino Server R5 versions 5.0.9 or higher\n- Available disk space of 200 MB\
    \ on the partition on which Norton AntiVirus for Lotus Notes/Domino is installed\n\
    \n# Pre-installation tasks\n\nFirst, you have to create a group, which must be\
    \ called avdevs, and your OS Users must be a member of this group so it can read\
    \ and write the NAV files. Do this with the following steps:\n\n+   1. Log in\
    \ as root.\n2. Add a group called avdevs with:\ngroupadd avdevs\n3. Add a user\
    \ to the group with:\nusermod -G avdevs < notes user>\n\n# Installation\n\nShut\
    \ down the Domino server.\n\nFor a SuSE distribution, log in as root and run the\
    \ commands shown in Example 7-1.\n\n# Example 7-1\n\n```\n# mount /dev/cdrom\n\
    # cd /media/cdrom\n# ./install\n```"
  merge: -1
