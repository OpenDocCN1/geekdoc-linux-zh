  md: 'configuration and finalize yourself with the default settings, and change them
    as needed to match your security requirements.


    ScanMail provides several ways to do administration. In addition to supporting
    the Notes interface for administration, you can also opt to configure and control
    the ScanMail tasks from a Web browser or the Admin Console. To use the ScanMail
    interface, just access:


    ```

    http://<your_server>/smconf.nsf

    ```


    If you want to make Web access safer, see the discussion about setting Database
    Flags on page 410. To enable the Admin Console, you have to open the database
    smadmr5.nsf and run the agent provided.


    ScanMail also supports replication of the configuration database, for easy control
    of a large number of servers or a distributed environment.


    When you open up the ScanMail configuration database, smconf.nsf, you will see
    the following screen.


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_415_0.png)


    Figure 7-6 Main configuration screen'
