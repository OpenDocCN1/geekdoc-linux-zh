    The next section contains the stack traces obtained from the debugger. This will
    probably not make sense to anyone other than support and development specialists.


    The one thing you can check for is that one of the threads contains the word "fatal"
    or "panic."


    If the problem is a server crash and there is not a thread listed with either
    of those keywords, then it is likely that there was a problem during data collection
    and the crash information was not collected in time.


    > Note: There are exceptions to that rule, so always forward all available data
    to support, even if it appears to be of limited value.


    For example, the following stack (Example 4-7) shows a fatal error on HTTP.


    # Example 4-7 HTTP fatal error


    ```

    #############################

    # thread 19/100 : http pid=12634, k-id= 2395 , pthr-id=537117116

