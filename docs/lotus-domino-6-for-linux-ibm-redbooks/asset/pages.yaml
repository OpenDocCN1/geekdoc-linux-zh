  md: '# 7.2.5 Backup software from third party vendors


    This section introduces some of the backup software products provided by third
    party vendors. Many vendors offer backup software for the Linux operating system,
    as well as for the Domino Server. However, at the duration of writing, there was
    only one product available for Domino Server for Linux.


    # Backup software for Linux OS


    Although performing a backup with backup software on a Domino Server is possible,
    the major drawback is that you have to shut down the Domino for the duration of
    the backup. If you do not require non-stop operation, you could consider using
    one of the third-party backup products.


    Among the third-party backup solutions available for the Linux operating system
    are:


    +   - IBM Tivoli Storage Manager

    IBM Tivoli Storage Manager is a scalable client/server software for backing any
    data. Both the server software and the client software are available for Linux
    platform. With the administration client you can easily retrieve and access the
    backed data.

    To learn more about the software and availability, check the IBM Tivoli site at:

    http://www.ibm.com/tivoli


    +   - VERITAS NetBackup BusinessServer

    NetBackup 4.5 is also client/server software. Both the client and the server are
    available for Red Hat; only the client is available for SuSE.

    Check the VERITAS Web site to learn more about the software at:

    http://www.veritas.com


    +   - BrightStor ARCserve for Linux

    CA has created backup software specifically for Linux. It has a Web-based user
    interface, there is a built-in virus scanner, and it provides disaster recovery
    services. The current version of the product, BrightStor ARCserve Backup for Linux
    7 Advanced Edition, supports Red Hat Linux 6.x, 7.0, 7.1 and SuSE 7.2 and 7.3
    according to CA''s web site:

    http://www.ca.com


    +   - Galaxy ImageDataAgent for RedHat Linux

    This is backup software for RedHat Linux from Commvault. See more information
    at:

    http://www.commvault.com'
  merge: -1
