    # 5.1.2 The Web Administrator


    The Web Administrator uses the Web Administrator database (WEBADMIN.NSF). This
    database is automatically generated the first time the HTTP task is started, and
    is placed in the data directory of the Domino server. For the Linux platform this
    is the /local/notesdata directory.


    > Note: Web Administrator browser support is limited to Netscape 4.7x and Microsoft
    Internet Explorer 5.5+. Other Java-compliant browsers such as Opera and Mozilla
    may work, but they were not supported at the time of writing.'
  merge: -1
