  md: "# Memcheck\n\nNext we have the memcheck portion of the NSD. Memcheck is a tool\
    \ that is installed by default in Domino 6 and is called by the NSD script, but\
    \ it can also be run manually. For details about the memcheck options run `memcheck\
    \ -h`. This will yield information about usage of the command and available options.\n\
    \n# Open databases in memcheck\n\nOne of the best features of the memcheck output\
    \ is to show, for each Domino process/thread, which Domino databases are being\
    \ used.\n\nYou have to search for the string \"Open Databases\" in the NSD output\
    \ file; you can see some lines in Example 4-17.\n\n```\nExample 4-17 Open databases\n\
    ------ Open Databases -------\n/home/nadmb2/notesdata/busytime.nsf\nVersion =\
    \ 43.0\nSizeLimit = 0, WarningThreshold = 0\nReplicaID = 85256c30:071e6f8\bContQueue\
    \ = NSFPool [2: 153641]\nFDGHandle = 0xf01c019, RefCnt = 1, Dirty = N\nDB Sem\
    \ = (FRWSEM:0x0244) state=0, waiters=0, refcnt=0, nldrdrs=0 Writer=\nSemContQueue\
    \ (RWSM: 0x029d) rdcnt=-1, refcnt=[] n=0, wcnt=-1, Users=-1, Owner=\nBy: [ sched:2150:\
    \ 2] DBH=59, User=CNbark/O=tree\n```\n\nThe example shows that the busytime.nsf\
    \ database is opened by sched process 2150 thread 2.\n\nThis information can be\
    \ matched with an eventual stack trace of the faulting thread to produce a preliminary\
    \ diagnosis on an eventual corrupted database that generated the server crash.\n\
    \n> Note: This is a starting point to troubleshoot the problem; a confirmation\
