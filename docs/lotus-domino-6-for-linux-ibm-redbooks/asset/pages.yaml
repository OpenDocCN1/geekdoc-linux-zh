  md: '# 7.2.3 Hardware configuration


    Since there is no Linux-specific installation, if you want to add a tape drive
    on computer, follow the hardware manufacturer''s instructions. All the distributions
    of Linux include a SCSI driver, and Linux will detect all new SCSI hardware automatically.


    For each hardware device, a file in the /dev directory will be created. This file
    is used by the system to send or receive data from the hardware device. The following
    table shows you some sample names.


    Table 7-1 Sample hardware names


    | Hardware peripheral | Device under Linux |

    |---|---|n| SCSI, disk 1, whole disk | /dev/sda |

    | SCSI, disk 3, partition 2 | /dev/sdc2 |

    | SCSI, tape | /dev/st0 |

    | IDE, disk 1, whole disk | /dev/hda |

    | IDE, disk 2, partition 3 | /dev/hdb3 |

    | Generic SCSI device (some worm for ex.) | /dev/sg0 |

    | ATAPI CD-ROM, Secondary Master | /dev/hdc or /dev/cdrom |


    For the disk, Linux uses the following convention:


    +   - The first character is s for a SCSI drive


    The tape device begins with st, for a rewindable device, or nst for a non-rewindable
    device. The following number represents the tape number. It goes from 0, for the
    first tape drive found, and 7 for the last one.


    When Linux boots, it creates a file you can read later that there is a lot of
    information about the machine''s hardware. To see this file, connect to your server
    as root and type the following command:


    ```

    dmesg | more

    ```'
  merge: -1
