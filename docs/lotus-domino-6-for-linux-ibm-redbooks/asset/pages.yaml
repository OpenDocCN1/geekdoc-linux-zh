  md: '# Migrating from Domino for Windows to Domino for Linux


    This appendix describes how to migrate from a Domino Server on a Windows Intel
    platform to a Domino Server on a Linux Intel platform.'
  merge: -1
  pgno: 452
- img_proc: true
  md: '# Moving from Windows to Linux


    In this scenario we assume that you are working with two physical machines, one
    with the current Domino server and one for the new Domino for Linux server.


    # Upgrade the current server


    The current Windows server should be first upgraded to the version of Domino that
    you will be running on the Domino for Linux server.


    # Build the Linux for Domino


    Build the Domino for Linux server as described in this redbook. Add the server
    to the existing Domino Domain and replicate all the data from the current server.


    # Move your applications from Windows NT or Windows 2000


    If your applications function today on Domino server running Windows NT or Windows
    2000, they will also work on a Domino for Linux server.


    Domino databases are platform independent, meaning that you can copy files from
    NT to UNIX and open the database without any kind of change to the file format.
    However, there are a few considerations to bear in mind due to the differences
    in the environment.


    To ensure that your application will be compatible, consider the following questions
    before moving an application from Windows NT or Windows 2000 Linux.


    +   - Is your Domino application "self-contained?"

    - Did you use CASE (Computer Aided Software Engineering) tools?

    - Does it use OS platform exploitation?


    # Is your Domino application "self-contained?"


    A self-contained application runs entirely inside the Domino server, without any
    explicit references to files, without external calls, and without importing or
    exporting data. An explicit reference to a file, such as c:\domino/data/NAMES.NSF,
    will not work on Linux and needs to be replaced with /domino/data/names.nsf. Linux
    does not support the ''\'' character for specifying paths and uses the ''/'' character.
    Linux is case-sensitive while NT is not. Case sensitivity can also be a problem
    when an external script call, link, or hotspot is used; be sure to check that
    the correct case is used.'
  merge: -1
  pgno: 453
- img_proc: true
  md: '# Did you use CASE tools?


    CASE tools may be helpful, many of these tools were created with non-UNIX operating
    systems in mind and their output code may not be compatible with Linux. Be sure
    to check with the manufacturer for compatibility before using these tools.


    # Does your application use OS platform exploitation?


    Anything in the application that might be platform-specific could fail in the
    Linux environment. NT-specific services, NT Registry Sync for user registrations,
    Active-X controls, or compilers that rely on platform-specific libraries to compile
    the application will cause problems when the application is moved to Linux.


    # Moving the application to the Linux server


    Transferring the files from Windows NT or Windows 2000 to UNIX can be done using
    many methods. FTP, transfer via CDRW, Iomega Jazz drives, or other media and PCNFS
    are all good ways of getting the data over. For this example we used FTP, since
    it is the most common tool in the field.


    Since FTP servers are installed by default on the UNIX side and not on the NT
    side, it is usually easier to open an FTP session from the NT box and connect
    to the UNIX box. Here we are using NT 4.0.


    +   1. From the NT box, use an MSDOS command prompt by selecting Start -> Programs
    -> MSDOS.

    a. Change directory to the server''s data directory with the command:

    cd \Lotus\notes\data

    b. Start an FTP session with the command:

    ftp servername

    2. Change directory on the UNIX box to the data directory with the command:

    cd /local/notes/data

    3. Switch to binary transfer mode by issuing the command:

    in

    4. Transfer the databases by issuing the command:

    put names.nsf

    or, transfer multiple files at once using wildcards with the mput command:

    mput *.nsf'
  merge: -1
  pgno: 454
- img_proc: true
  md: '**Important:** Never add or remove databases from the OS level while the Domino
    server is up and running. Domino caches the data directory listing and unpredictable
    behavior can occur if you modify the data directory while the server is running.
    This could result in a server crash or hang.


    # Ensuring permissions are correct


    After the transfer is complete, make certain that permissions are correct on the
    UNIX machine. Log in to the UNIX machine and change to the data directory (cd/local/nodesata)
    and check the permissions on the transferred file with:


    ```

    ls -l *.nsf

    ```


    An example of the permissions line is:


    ```

    -rw-rwx 1 nadmsup notes 1589248 Feb 22 09:34 log.nsf

    ```


    Interpret this record as follows:


    The first column shows the permissions. The leftmost letter indicates whether
    this is a directory or a file. A dash (-) in the left position indicates it is
    a file; a directory is designated by the letter d. The next nine letters identify
    the access rights to the file for the owner, group, and world, given in 3 character
    segments. From left to right the permissions in each segment are read, write access,
    and execute access. Therefore an rwx means that read, write, and execute access
    is granted. If any of the letters have a - in their place, then permission is
    not allowed. For example, r-x means that read and execute access is given, but
    write access is not.


    The owner is the user ID that owns the file, which is indicated by the third column
    in an ls -l. In this case it is "nadmsup". The owner''s permissions are read from
    the first three permission characters in column 1 (following the file or directory
    indicator).


    The group is identified in the fourth column. In this case it is the "notes" group.
    The group''s permissions are identified in the next three characters in column
    1.


    The world is anyone else who has login access to this system. Their permissions
    are specified in the last three characters of column 1.


    Since the Domino server is the only one that should be changing or directly reading
    the databases, and databases are not executable programs, the permissions for
    databases should be:


    ```

    -rw---- 1 nadmsup notes 1589248 Feb 22 09:34 log.nsf

    ```


    Lotus Domino 6 for Linux'
  merge: -1
  pgno: 455
- img_proc: true
  md: 'If the permissions are not correct you can issue the command:

    chmod 600 filename


    where filename is the name of the file on which you wish to change the permissions.
    This will give read and write access to the Notes user, will not allow anyone
    else to view it. Since the Domino server runs under the Notes user account and
    makes all of the read and write calls on behalf of the clients, most organizations
    will want to keep the access to the files restricted to the Notes user account.


    # Checking for case sensitivity


    In NT, filenames are not case sensitive, but in UNIX they are. If your scripts
    call for the file log.nsf and the file listed is LOG.NSF at the OS, the file will
    not be found when the script runs. After the FTP completes, check to ensure that
    the filenames are in lowercase unless your application is specifying others.


    ```

    ls -1

    -rw---- 1 ndmadsum notes 1589248 Feb 22 09:34 LOG.NSF

    mv log.NSF log.nsf

    ls -1

    -rw---- 1 ndmadsum notes 1589248 Feb 22 09:34 log.nsf

    ```


    > There are two modes of file transfer in FTP: binary and ASCII. Binary transfers
    are an exact copy and no reformatting of the file is done by FTP. ASCII transfer
    assumes the file you are transferring is a text file, and when transferring between
    platforms, will attempt to format the file to the native text format of the destination
    machine. If you are in ASCII mode when transferring a database, the database will
    be unreachable by Domino on the destination machine. Some versions of FTP start
    in ASCII mode. Therefore you should always type bin on the FTP command line to
    ensure that you are in binary mode before transferring any databases or templates.'
