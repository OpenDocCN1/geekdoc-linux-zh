  md: '# 6.3.5 Domino file protection


    In Domino 6, File Protection documents stored in the Domino Directory database
    are the basis for configuring browser access control to files.


    You can enforce file system security for files that browser users can access.
    For example, for HTML, JPEG, and GIF, you can specify the level of access for
    these types of files and the names of the users who can access them.


    You can apply file system protection on CGI scripts, servlets, and agents. However,
    the file protection does not extend to other files accessed by the CGI scripts,
    servlets, or agents. For example, you can apply file protection on a CGI script
    that restricts access to a group named “Web Admins.\ However if the CGI script
    executes and opens other files (or causes other scripts to be executed), the File
    Protection document is not checked to determine whether “Web Admins” has access
    to these files.


    File protection does not extend to the following directories, which contain default
    image files and Java applets are used by the HTTP Web server and other applications
    (for example, mail databases):


    +   * local/notesdata/domino/java, accessed via Web browser using the path http://itsoredhat/domjava


    +   * local/notesdata/domino/icons, accessed via Web browser using the path http://itsoredhat/icons


    File system protection does apply, however, to files that access other files,
    for example, HTML files that open image files. If a user has access to the HTML
    file that the HTML file uses, Domino does not display the JPEG file when the user
    opens the HTML file.


    You have to consider setting up File Protection documents for each directory Web
    users are able to access. There is no file protection for an upgraded or new Domino
    6 server until you create File Protection documents.


    You do do this by choosing Actions -> Create Web R5-> File Protection. The resulting
    screen is shown in Figure 6-5.'
  merge: -1
  pgno: 387
- img_proc: true
  md: '![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_388_0.png)


    The ability to set file protection might be needed in mixed environments, where
    you have some data in the Notes databases and other data in text files. These
    protection settings apply to all Web servers on a Lotus Domino 6 server.


    Chapter 6. Domino as a Web server 375'
