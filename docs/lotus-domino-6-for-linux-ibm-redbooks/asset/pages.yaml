  md: '# Installing Linux


    In this chapter we describe how to install Red Hat and SuSE Linux on your server.
    The chapter is divided into two parts, with each part giving detailed instructions
    for the particular distribution of Linux.'
  merge: -1
  pgno: 14
- img_proc: true
  md: "# 1.1 Before begin\n\nRead the following section before performing the installation\
    \ of Linux. There are several things you need to do or should be aware of to make\
    \ the installation process easier. In addition, make note of the following information\
    \ about your system, which will be useful when you perform the installation:\n\
    \n+   - Network card type\n- Network information\n  - IP address\n  - Gateway\
    \ information\n  - DNS servers\n- Video card type\n- Number and types of hard\
    \ drives\n- Monitor information\n\n# 1.1 Making the CD-ROM/DVD drive bootable\n\
    \nThe recommended way of installing Linux is to boot from the CD-ROM. If you plan\
    \ to boot your system directly from the CD-ROM, ensure that the CD-ROM is the\
    \ initial boot device. Do this by following these steps:\n\n+   1. Power on your\
    \ server.\n2. Enter the BIOS setup utility.\n3. Make sure that your CD-ROM is\
    \ the initial boot device.\n4. Save the settings.\n5. Enter the setup utility.\n\
    \nThe alternative is to make boot diskettes from the Distribution CDs and use\
    \ those to boot the system. Do this by following these steps for Red Hat:\n- Insert\
    \ Red Hat Installation CD 1 into a Windows machine.\n- Use RAWWRITE from the DOSUTILS\
    \ directory to write the disk image to a Floppy disk. The disk images are stored\
    \ in the IMAGES directory on the Red Hat Install CD. The files in this directory\
    \ are raw disk images. Some boot disks for booting the Red Linux installation\
    \ program. Others are driver disks supporting less common hardware. Follow the\
    \ instructions in the Red Hat Linux Installation Guide to create the disks.\n\n\
    For an example of this command, see \"RAWWRITE utility\" on page 3."
  merge: -1
  pgno: 15
- img_proc: true
  md: "Follow these steps to create the boot disks for SuSE:\n\n+   1. Insert SuSE\
    \ Installation CD 1 into a Windows machine.\n2. Use RAWWRITE in the DOSUTILS\\\
    RAWWRITE directory to write the disk image to a Floppy disk. The disk images are\
    \ stored in the SuSE Install CD. The files in this directory are raw disk images.\
    \ The following files are boot images: bootdisk, i86, and rescue. Only a few modules\
    \ fit on the boot disk. Therefore, three modules floppy disks exist. You will\
    \ need these diskettes if you cannot find the driver for your hardware on the\
    \ normal disk. The modules contain the following files:\n    - Modules1: USB and\
    \ file system modules\n    - Modules2: SCSI/RAID/IDE modules and old (non-ATAPI)\
    \ CD-ROM drives\n    - Modules3: Network, PCMCIA and FireWire (IEEE1394) modules\n\
    \n# RAWWRITE utility\n\nRAWWRITE is a utility usually shipped with the Linux distribution;\
    \ it is used to write the prepared disk images to diskettes, enabling them to\
    \ be used in the installation process.\n\nTo create a diskette from one of these\
    \ prepared images use the following steps:\n\n+   1. Load the Linux CD on a Windows\
    \ machine.\n2. Open an MS-DOS prompt.\n3. Change the default directory to the\
    \ directory where the diskette images are stored (this varies according to the\
    \ distribution of Linux used).\n4. Run the following command by pre-pending the\
    \ directory where the RAWWRITE program is stored.\n\n```\n\\path\\rawwrite image\
    \ a:\n```\n\nFor Red Hat, replace x with your CD-ROM driver letter and run:\n\n\
    ```\nx:\ncd \\images\ndosutils\\rawwrite -f boot.img -d\n```\n\nFor SuSE, replace\
    \ x with your CD-ROM driver letter and run:\n\n```\nx:\ncd \\disks\ndosutils\\\
    rawwrite\\rawwrite\nbootdisk a\n```\n\nThere is a version of RawWrite for Windows.\
    \ This is available from:\nhttp://uranus.it.swin.edu.au/~\"jn/linux"
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 1.1.2 RAID configuration


    If you have a machine with a RAID controller, you need to configure the disks
    before you install Linux. Use the same procedure to configure your RAID sets as
    you would for a Windows NT or Windows 2000 machine. Once your RAID is configured,
    the logical disk is online, you can proceed with the installation of Linux. You
    may need a driver disk for the Linux installation.


    # 1.1.3 Partitions


    We have simplified the typical UNIX partitioning scheme. A conventional UNIX-style
    install would include partitions for /home, /usr, and more. However, a Domino
    server does not require or use a number of these partitions, so they are simply
    a waste of disk space. Therefore, we have concentrated on the ones important for
    Domino.


    > Attention: One reason for a conventional UNIX-style install is to prevent users
    of your system from filling your hard drive. Therefore, if you are installing
    Linux on an external system that will have exposed volumes, such as an FTP area,
    you should create a partition specifically to hold the FTP data. While will limit
    the total amount of available disk space, it will keep your system from crashing
    should someone intentionally or unintentionally use all remaining disk space.


    Table 1-1 An example of partitioning on a Domino Server


    | Partition | Description | Minimum Size | Recommended Size |

    |---|---|---|---|n| / | Root partition | 2 GB | 3 - 9 GB |

    | /local | Partition for data | | See Note 1 |

    | /translogs | For Transaction logs | | See Note 2 |

    | /var | For system files, as log files | 256 MB | 512 MB |

