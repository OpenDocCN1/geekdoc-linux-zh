  md: '# Security and administration


    In this chapter, we describe the basics of Linux and Domino security and what
    you can do to achieve an appropriate level of security. We touch on physical,
    system, and network security for Linux, then discuss partitions, scripts, and
    scheduling jobs. For Domino, we review steps you should take to secure your new
    server, then discuss the enhanced Web administration client and the new Domino
    Controller available with Domino 6.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# 3.1 Linux security


    In this section, we focus on security at the OS level. After you install the OS,
    the first step is to secure your server so you will not install subsequent applications
    on an already compromised server.


    Because of expanding global communications and internet connectivity, more and
    more people have access to your servers, and not all of these people have good
    intentions. Therefore, you need to protect your servers from attacks and at the
    same time grant access to those who need it. Keep in mind that no server, regardless
    of the OS, is completely secure; all you can do is make it increasingly difficult
    for someone to compromise your servers.


    The levels of security that we discus in this chapter are:


    +   * Physical security

    * System security

    * Network security

    * Backup security


    # 3.1.1 Physical security


    The first step in securing your server is limiting physical access to the machine.
    Consider all of the following:


    +   * Lock the server in a special room to which only administrators have access.

    * Lock the server console with a password.

    * Lock your case. This way no one has easy access to the inside of your computer.
    Otherwise, someone could insert another hard drive, boot from it, and potentially
    gain access to the other drives in the system.

    * Secure the floppy and CD-ROM. After you install all the software, consider removing
    the floppy and CD-ROM from the BIOS boot list.

    * Lock the BIOS setup utility with a password.


    > Attention: If you enable a power-on password in BIOS, then your system will
    no longer reboot automatically in the event of a power failure.


    # 3.1.2 System security


    Not every user on the system needs root access. Though it is easier to work as
    root, you should grant root access only to those administering the server. If
    a user does not need access to a resource, you are better off not granting.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# File permissions


    In Linux almost every resource (files, directories, symbolic links, disks, modems,
    and so forth) is considered a file, and file permissions give access to the resource.
    From a shell, you can view the permissions of a file if you issue the command
    -l at the command line, as shown in Example 3-1.


    Example 3-1 Example file permissions for /etc/passwd


    ```

    # ls -l /etc/passwd

    -rw-r--r-- 1 root root 873 Apr 4 15:27 /etc/passwd

    ```


    This command gives the listing format of the file /etc/passwd. In addition to
    the name of each file, it prints the file type, permissions, number of hard links,
    owner name, group name, size in bytes, and time stamp (by default this is the
    modification time). The type and the permission is the cryptic string of letters
    and dashes at the beginning of the line. The first character of the 10 character
    long code is the type of the file; in this case it is a dash which means this
    is a plain file. The possible file types are:


    +   - Plain file

    d Directory

    1 Symbolic link (like a Windows shortcut)

    b Block device (drives)

    d Character device (terminals, modems)


    The next nine characters describe the permissions on the file. They are organized
    in groups of three. The first group gives the permissions of the file (in this
    case the user root), the second gives the permissions of the group (in this case
    the group root), and the last three characters give the permissions for any other
    user on the system.


    A group of three characters is built as follows:


    +   - First character is an r which means permission to read the file.

    - Second is a w which stands for write permission.

    - The last character is x for execute rights on a program or list rights if the
    file is actually a directory. Also, s, t, and T are values for this character,
    but these permission are less frequent and beyond the scope of this book.


    In our example, the permissions -rw-r--r-- root root mean read and write access
    for the user root, read rights for anyone who is a member of the group root, and
    read rights for any other user on the system.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'On a Linux system, ordinary users only have write access to their $HOME directory
    (also known as ~) and the /tmp directory. This is different than on Windows NT
    systems, where every user has access to all the disks except where access has
    been specifically denied. Since the Domino server runs as an ordinary user under
    Linux, you have to be sure that ownership of files and directories is correctly
    set.


    For example, if you want to enable transaction logging, you have to make sure
    that the directory where the logs are stored is owned by the user who runs the
    Domino server. Let''s say the disk that will contain the transaction log files
    is mounted under the directory /translogs. The ownership of this file, if created
    during installation, is root.root, so we have to change it. Log in as root, go
    to the top level directory ( / directory), and change the ownership as follows
    with the command:


    ```

    # clown itsoddom6.notes translogs

    ```


    The user itsdom6, which is the user who runs the Domino server in our example,
    is now the owner of the directory /translogs. This makes it is possible to enable
    transaction logging for Domino.


    # Passwords


    Passwords are an ubiquitous means of security, and every company should determine
    and set password rules based on their security requirements.


    Each password has to be chosen with care. There are two components of password
    strength:


    +   - Quantity - This is simply a minimum number of characters required before
    a password is acceptable.


    +   - Quality - This is a more complex requirement that dictates the password
    must contain a combination of lower and uppercase letters, numbers or other symbols.


    In Linux, the default password length is five, but there is also a maximum length
    of eight. However, this can and should be changed. Linux offers a range of options
    to guard against weak passwords and we detail a number of them in this section.
    There are also many printed references, as well as Linux websites.


    # Password settings in SuSE 8.0


    SuSE 8.0 has a tool for system administration that is like the Control Panel in
    Windows: Yet another Setup Tool (YaST2). This tool can be used either in text
    mode or in graphical mode.


    > You have to be logged in as root to have access to all areas of YaST2.'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'To quickly change the password settings, you can use the graphical YaST2. Click
    Start Application -> System -> YAST2, click Security and Users, then Security
    Settings as shown in Figure 3-1.


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_150_0.png)


    Figure 3-1 Security settings in SuSE 8.0


    Check Custom Settings and click Next to display the Password settings window.
    You have a number of options regarding passwords. Here are our recommendations,
    shown in Figure 3-2 on page 138.


    +   - Enable "Checking new passwords."

    - Enable "Plausibility test for password."

    - Enable "Activate MD5 encryption for passwords."'
