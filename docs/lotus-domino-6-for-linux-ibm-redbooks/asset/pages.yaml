  md: '# Domino in action


    In this chapter, we describe some of the capabilities of the Domino server and
    the strengths of Domino 6. We selected several features to demonstrate from among
    the many that are part of Domino 6. The features presented in detail are:


    +   - Domino user registration

    - The Domino Administration client within Linux

    - The Web Administration interface

    - Active Directory synchronization with the Lotus ADSync tool

    - Accessing external data from a Domino application

    - Using a sample application to connect to DB2

    - Using a sample application to connect to MySQL'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# 5.1 Domino user server is installed and configured, you must register users


    Once your Domino server is installed and configured, you must register users before
    they can set up their Notes client. User registration creates the following for
    each user:


    +   - A Person document in the Domino Directory

    - A User ID containing the appropriate certificates

    - A mail file


    The process of registering users can be performed using any of the following methods:


    +   - Domino Administration client

    - Java-compliant browser with the Web Administrator interface

    - Active Directory Users and Groups Console utilizing a new Domino 6 feature for
    Active Directory Synchronization.


    We do not discuss here various planning and management aspects of user registration
    (for example, policy creation, roaming users, and so forth). Instead we are addressing
    only the methods for performing user registration.


    # 5.1.1 Domino Administration client


    We chose to use the Domino Administration client within the Linux server running
    Domino to demonstrate user registration without using a Windows workstation. You
    can accomplish the same thing using the Domino Administration client on a Windows
    machine.


    The Domino Administrator client does not run natively on the Linux platform; therefore,
    we must emulate a Windows environment. There are numerous products on the market
    to accomplish this. We chose CrossOver Office (the commercial version of Wine,
    www.winehq.org) from CodeWeavers, Inc. which does not require a Windows workstation.
    The CrossOver Office package can be obtained directly from the CodeWeavers Web
    site at:


    ```

    http://codeweavers.com

    ```


    > Attention: CrossOver office only runs under X-Windows on an IA32-based system.
    We installed Pre-Release 1 of Domino Administration client since that was the
    most current version available at the time of writing. Furthermore, minimal testing
    with the Release Candidate version was done, but it did not seem to work with
    CrossOver office or Wine. This is probably due to a change in installer program.
    Hopefully CodeWeavers will address this issue in future releases of CrossOver
    office.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Installing CrossOver Office


    Installing the CrossOver product is a simple process that only takes a few minutes.
    It can be installed either as a normal user, or as root to create a multi-user
    environment. We chose to install the product as a root user. You can see this
    in the setup dialog box, shown in Figure 5-1. Your decision should be strictly
    based on your license for the product.


    CrossOver Office is installed by invoking the script which we purchased and downloaded
    from the CodeWeavers Web site. The version represents the version you downloaded.
    We worked with version 1.0.0 of the product. The command you need to start the
    installation is:


    ```

    sh install-crossover-office-version.sh

    ```


    Once the installation script starts, the following window is displayed.


