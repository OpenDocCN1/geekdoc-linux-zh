    # # 6.7 Domino and Java


    At the time of this writing Lotus Domino 6 includes a Java Virtual Machine (JVM)
    based on Sun Microsystems'' JDK. The JVM is automatically installed in the Domino
    program directory.


    If you have configured the HTTP server task to support Java servlets, the task
    will load the JVM when the HTTP task is started. This configuration is available
    in the Server document under the Internet Protocols tab, Domino Web Engine sub-tab.'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# 6.7.1 Java servlets


    A servlet is a Java program that runs on a Web server in response to a browser
    request. Servlets for Domino must conform to the Java Servlet API Specification,
    an open standard published by Sun Microsystems, inc.


    # Configuring


    On a Domino 6 server, Java servlet support is disabled by default. In order to
    enable Java servlets, edit the server document and go to the Domino Web Engine
    tab, then find the section labeled "Java Servlets." Set the appropriate value
    for the field "Java servlet support." There are 3 options:


    +   - None.


    +   - Domino Servlet Manager (which initializes the Domino JVM and starts the
    servlet manager).


    +   - Third party Servlet manager (which initializes the Domino JVM only). In
    order to use a third party servlet manager, one must install the appropriate software
    (such as IBM WebSphere) which will in turn place lines in the HTTPD.CNF file to
    allow the servlet manager to plug in to the Domino HTTP server.


    # Running


    The basic steps to run a servlet in Domino 6 are as follows:


    +   1. In the "Servlet URL Path" field, enter the URL path you wish to use to
    indicate that the resource is a servlet (the string /servlet is the default).


    +   2. Create a directory under the /local/notesdata/domino/servlets (for instance
    domino/servlets) where you wish to store your servlets.


    +   3. Edit the "Class Path" field to include the location of your specific servlet.
    You can specify .jar and .zip files in this field.


    +   4. Copy the class files to the data/domino/servlets directory.


    +   5. Issue the server console command tell http restart to reload the HTTP server.
    In your Browser, enter a URL that contains the servlet name (without the file
    extension), such as:


    ```

    http://hostname/servlet/HelloWorldServlet

    ```


    > Note: The addition of any servlets to the servlet directory will require a restart
    of HTTP before the servlet manager recognizes the new servlet.'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# 6.8 Domino log and analysis tools


    Domino 6 makes logging even easier for Internet service providers (ISPs), as well
    as the rest of us. Domino 6 can now create text files that include the IP address
    or host name of the server that the user requests. This way, you can easily use
    the logs to create statistics for virtual servers. To use this feature, you must
    enable the “Extended log format” for the access log file in the server document.


    To separate statistics for virtual servers, analysis tools still need to sort
    the entries in the log file according to the different virtual servers'' IP addresses
    or host names.


    # 6.8.1 Domino Web log


    To set up logging on your Domino server, you simply enable one of the logging
    methods in the HTTP section of the server document in the Domino Directory. (Because
    logging is very server-intensive, it is disabled by default.)


    If you enable logging to domog.nsf, the database is automatically created the
    next time you start the server. If you enable logging to text files and specify
    a directory for the files, Domino automatically creates the access log and error
    files.


    Notice that you can select the format for the access log files (Common or Extended
    Common) and the time format (LocalTime or GMT). Remember that the Common format
    records only access information, and the Extended format tracks access, agent,
    and referred information in the access log file. You can then specify different
    names for the log files.


    Figure 6-11 on page 388 shows the logging fields in the server document.'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# Logging fields


    With Domino 6, you can specify whether you want Domino to create new log files
    daily, weekly, monthly, or never. The log file duration applies to all log files
    on the server. In addition, only one log file is maintained per Web server, including
    servers set up as virtual servers. The name Domino gives to the log file depends
    on the duration settings and the file names you specify in the server document.


    In the “Exclude from Logging” section, you can prevent logging for specific types
    of requests. For example, let''s consider that you don''t want to log image requests
    on your server. So, you can enter *.gif in the URLs field and image/gif, image/jpeg,
    and image/bmp in the MIME types field.


    +   You can also prevent logging for:

    * Specific HTTP methods

    * User agents

    * Status return codes

    * Hosts and domains


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_401_0.png)


    Figure-11 Domino Web logs


    388 Lotus Domino 6 for Lotus'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# 6.8.2 Domino Log database analysis


    When you enable logging to the Domino Log database, Domino automatically creates
    the database using the template domlog.ntf. The basic design of the database includes
    one form for log entries and one view for displaying them, called Requests. The
    Requests view shows all records in the order that they were created. To analyze
    the entries in your Domino Log database, you can either use a Notes tool or one
    of several solutions from Lotus Business Partners. You can customize the database
    with additional views, create agents to notify you when specific events occur
    (such as, when a certain number of unsuccessful login attempts occur), or modify
    the database to generate reports.'
  merge: -1
  pgno: 402
