    # 7.2 Backup


    Today, data is becoming increasingly important for all companies. Domino manages
    more and more of these needs, and is not simply used for messaging. Workflow software
    uses Domino databases to generate enterprise activity, and the loss of one database
    could mean disaster. Even Linux is a reliable platform, backing up your data is
    mandatory to prevent possible trouble.


    This section describes general principles of backup management and strategy, and
    provides details about the backup tools provided by the Linux operating system.
    We discuss some of the considerations for backing up a Domino server and databases,
    and introduce some of the commercially available third-party products for backing
    up Domino Server for Linux.'
  merge: -1
  pgno: 438
- img_proc: true
  md: '# 7.2.1 Backup strategy


    To implement a complete backup strategy, you have to follow a strict process which
    allows you to define backup rules. These rules can be very different from one
    company to another. Creating a backup strategy is not within the scope of this
    book, so we do not go into exhaustive detail about it here. Instead, we have made
    choices which may or may not be used in a real environment. We will use these
    choices to show you how to install and configure some backup software on a Linux
    platform.


    We recommend that you create a company backup policy, if you do not have one already,
    and follow that policy, a good backup policy will save you a lot of trouble.


    A typical backup is performed by using a backup server to back up all your Domino
    servers through your LAN or a dedicated backup network. Figure 7-30 on page 427
    shows an example of backing up the Domino servers using an existing TCP/IP network.


    For a smaller installation, you could attach a backup device directly into a Domino
    server; this would reduce the number servers needed. However, this is not necessarily
    an adequate solution because if you lose the server for some reason, you will
    lose both the server and the current backup.'
  merge: -1
  pgno: 439
- img_proc: true
  md: '![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_440_0.png)


    Figure 7-30 Domino backup scenario


    There are two basic methods of backing up Domino: offline backup and online backup.


    # Offline backup


    This method is the most reliable and inexpensive type of backup procedure. The
    downside to this is that it cannot be done on critical systems that require non-stop
    operation.


    To perform an offline backup, first shut down the server, back up your files,
    and restart the server.


    # Online backup


    Online backup provides a way to back up your data and still have your system in
    production. This option becomes more and more important with the requirement of
    non-stop operation. There are different options to perform an online backup. We
    recommend that you use a backup software product that utilizes the features provided
    by the backup/recovery APIs in Domino.'
  merge: -1
  pgno: 440
- img_proc: true
  md: '# 7.2.2 Backup management


    In this section we discuss the management issues related to backing up files,
    such as why you still need backups even if you are replicating your databases,
    how to establish backup cycles, and how to implement incremental backups with
    the transaction logging enabled in Domino 6.


    # Backup versus replication


    Your Domino implementation may include clustering of your Domino servers so that
    you can replicate your databases to another system or disk. What we want to point
    out in this section is that replication does not replace the need to have reliable
    backups of your databases.


    It is true that in the event of disk failure or disaster recovery, a replica of
    a database is a quick way to recover the information that was lost, but in some
    cases you need to recover from a previous day or week. Listed below are some cases
    when you would need to restore from a backup.


    +   - Information in a database was changed, and this was discovered at a later
    date. Replication has already overwritten the changed information on the cluster
    pair.

    - A database has been corrupted on the server; this was not discovered prior to
    replicating to the cluster or other replicas.

    - An Admin request was issued and approved to perform deletion of databases through
    your servers. This was discovered but could not be stopped prior to user databases
    being deleted.

    - A user has inadvertently deleted all mail in their database and did not inform
    the administrator in time to stop replication.


    These are just a few examples of why a reliable backup to your databases is an
    important part of your Domino implementation planning.


    # Backup cycles


    When planning for your backup, it is a good idea to develop a backup cycle that
    will work for your organization. You should consider the following issues when
    determining a good backup cycle for your office:


    +   - Budget allocation for tapes and life cycle of tape usage

    - Company policy on mail retention and archiving

    - Amount of data to be backed up per server

    - Time available for backup'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# Domino 6 transaction logs and backups


    In this section, we discuss the ways in which transaction log backups enabled
    and full backups can be used to back up your Domino databases. You should review
    the documentation on transaction logging found in the Administration Guide to
    get a full understanding of the operation of transaction logs. Also see “Transaction
    logging” on page 229.


    Domino 6, like its predecessor, provides database logging. With transaction logging
    enabled, Domino captures database changes and writes them to a transaction log.
    A single transaction is a series of changes made to a database on a server. An
    example of a transaction might include opening a new document, adding text, and
    saving the document. This transaction is recorded in a log file. Then, if a system
    or media failure occurs, you can use the transaction log and Domino aware backup
    systems to recover your databases.


    How are the transaction logs used with backups? Let’s say that in fact you made
    a full backup of your Domino databases once a week and then performed incremental
    backups throughout the week. With transaction logging enabled, you back up only
    the transaction logs during the week, instead of every Domino database. When you
    need to recover a database, you restore the database from the last backup and
    then restore the transaction logs to the restored database. The Domino-aware backup
    system then replays every transaction that took place and brings the database
    up-to-date. The backup utility you choose must use the backup and recovery methods
    of the Domino C API toolkit (Release 5 or later).


    > **Important:** You can lose data if the backup procedure is not monitored appropriately
    – for example, you run out of disk space or do not back up the logs before deleting
    them. The backup process should be monitored, especially in heavily loaded environments.


    The next issue to be aware of when setting up transaction logging is the way in
    which the database instance IDs are created and maintained.


    When you enable transaction logging, Domino assigns a database instance ID (DBIID)
    to each Domino database. When Domino records a transaction in the log, it includes
    the DBIID. During recovery, Domino uses the DBIID to match transactions to databases.
    Some database maintenance activities, such as compaction, cause Domino to assign
    a new DBIID to a database. From that point forward, all new transactions recorded
    in the log use the new DBIID. Since the previous transactions have a different
    DBIID, you would not be able to restore any data from the old logs. When these
    situations occur, you will need to perform a full backup of the affected databases.


    Chapter 7. Backup and virus protection 429'
  merge: -1
  pgno: 442
- img_proc: true
  md: '**Important:** When the Domino server is installed, compaction of databases
    is performed daily by default. Change the compact task to a weekly housekeeping
    procedure and create a full backup of your databases after the compaction is complete.


    Following are some of the cases when Domino assigns a new DBII D to the transaction
    logs, requiring a new full backup:


    +   - Transaction logging is enabled for the first time or the logging style is
    changed.


    +   - The compact server task is run with options.


    +   - A fixup server task is run with the -J option.


    +   - A Domino database is moved from one logged server to another logged server,
    or from an unlogged server to a logged server.


    # Considerations for backup software


    When you select third-party software, there are some features that relate to your
    Domino server that should be considered. Your evaluation of the software should
    determine whether it provides the following capabilities:


    +   - Utilization of the native Domino backup/restore APIs.


    +   - On-line full and incremental backup of Notes databases.


    +   - Off-line full and incremental backup of Notes databases.


    +   - On-line full and incremental restores of Notes databases.


    +   - Off-line full and incremental restores of Notes databases.


    +   - Selective network port addressing for backup across a LAN. This is valuable
    if you have installed a private network for your clustering. You can back up your
    servers without using bandwidth necessary for the Domino server functions.


    +   - Automatic discovery of new Notes databases.


    +   - Software determines which transaction logs are aged (obsolete) and informs
    you or deletes them.


    +   - On-line recovery of entire Notes databases.


    +   - Off-line recovery of single or multiple Notes databases.


    +   - Automated backup scheduling for Domino server.


    +   - Automated backup scheduling by Domino databases.


    +   - Centralized administration of distributed Notes environment.'
  merge: -1
