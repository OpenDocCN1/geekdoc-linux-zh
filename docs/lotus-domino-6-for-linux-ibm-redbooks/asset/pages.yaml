    # 5.2 Active Directory synchronization


    Domino administrators working in a Windows 2000 environment with Active Directory
    can now administer users and groups from a single administrative interface of
    their choice: the Domino Administration client or Windows 2000 Active Directory
    Users and Computers. This new feature of the Domino 6 server, ADSync lets you
    keep both the Domino Directory and Active Directory current without having to
    manually update both with changes. This synchronization feature allows a Domino
    administrator to securely and precisely delegate the responsibility for Domino
    user and group management to the network administrators who manage these details
    in Active Directory.


    You can create new users and groups in Active Directory and have those changes
    reflected in the Domino Directory, including the creation of person or group documents,
    Notes IDs, passwords, and mail files for the users, and well as


    266 Lotus Domino 6 for Linux'
