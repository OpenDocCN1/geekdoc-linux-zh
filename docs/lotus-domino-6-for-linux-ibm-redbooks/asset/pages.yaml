    > **Important:** The information in this section requires some TCP/IP protocol
    knowledge. Explaining all details in the screen captures is beyond the scope of
    this book, but enough information is provided to explain the common use of these
    network status tools. To learn more about TCP/IP, see the IBM Redbook TCP/IP Tutorial
    and Technical Overview, GG24-3376.


    # Netstat command


    Log in as root and type netstat and you will see a screen similar to the one shown
    in Figure 3-9 on page 159.


    From left to right, the columns have the following meanings:


    +   - Proto

    The protocol used by sockets (TCP, UDP, raw)


    +   - Recv-Q

    The count of bytes not copied by the user program connected to this socket'
  merge: -1
