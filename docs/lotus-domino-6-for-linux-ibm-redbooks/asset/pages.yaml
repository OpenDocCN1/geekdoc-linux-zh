  md: '# 4.1.2 Linux scalability


    This section outlines changes you can make to your Linux OS to customize it for
    maximum Domino 6 server performance. First, we cover the easily tunable kernel
    limits, then we discuss a slightly more complex undertaking-recompiling glibc
    in order to alter the hard-coded thread limit. We have detailed the steps for
    both Red Hat 7.2 and SuSE 8.0.


    > Attention: Modifications to the Linux kernel, or compiling any Linux libraries
    such as glibc, are not supported by Lotus software.


    > Note: With Domino R5 the supported Linux kernel versions are 2.2 and 2.4. At
    present, Domino 6 only supports the 2.4 kernel.


    Refer to the Release Notes of your Domino version for details about the required
    kernel and patch levels.


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_221_0.png)


    Figure-11 Sensor types'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Enhancing Domino server performance


    This section describes some changes you can make to enhance the performance of
    Domino 6 on Linux.


    First, the sysctl.conf file is used with the 2.4 kernel to set tunable parameters.
    This file can be edited with any text editor; in this example we describe the
    procedure using the versatile KATE. You will need to be logged in to KDE as root
    to save the file into /etc.


    +   1. Start the text editor program in Red Hat 7.2 by clicking Start Application
    -> Editors -> Kate; in SuSE 8.0 click Start Application -> Office -> Editors ->
    Kate.


    We need to see if there is an existing /etc/sysctl.conf file.


    +   a. Click File -> Open.


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_222_0.png)


    Figure 4-12 Select root directory'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'b. Click Root Directory from the drop-down box shown in Figure 4-12.


    c. Click etc.


    d. If you see the sysctl.conf file listed, click it, then click OK to open it.
    Otherwise, use the new file that KATE opens by default.


    2. Determine the current file-max, found in /proc/sys/fs/file-max; it is typically
    set to a value of 49152 or higher. You can open the file with KATE or from a shell
    prompt with /proc/sys/fs/file-max. We used this value to set an upper file limit
    in Steps 3 and 5, and then allowed Domino to use up to the maximum value.


    Note: The warnings message "File has changed on disk" appears. Just click to cancel
    it.


    3. Here are the lines that need to be included in the sysctl.conf:


    ```

    fs.file-max=49152

    kernel.shmmax=8192

    ```


    For the fs.file-max line, use the value from Step 2 or 49152, whichever is greater.


    For Red Hat 7.2, you need to add an additional line:


    ```

    kernel.sem=250 18432 32 1024

    ```


    As with the file-max parameter, you can view the existing value with more /proc/sys/fs/kernel.sem.
    If any of the existing values are greater than the one specified here, use the
    higher value.


    4. Verify if the file /proc/sys/kernel/threads-max exists, it is set to a value
    of 8192 or higher. You can open the file using KATE or from a shell prompt with
    /proc/sys/kernel/threads-max. If the number is not greater than 8192, your system
    will be limited by the given value. This number is determined dynamically by the
    OS and is typically 8192 or higher. You can override it by setting a new value
    (kernel.threads-max=8192 in the sysctl.conf), but doing so could have an adverse
    affect on your system''s stability.


    5. Next, edit /etc/security/limits.conf and add the following four lines for the
    nodes used to run Domino, which in our case is itsdom6.


    ```

    itsdom6 soft nofile 49152

    itsdom6 hard nofile 49152

    itsdom6 soft nproc 8192

    itsdom6 hard nproc 8192

    ```


    Again, you should use the value from Step 2 or 49152, whichever is greater,

    for the hard node limit.'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'Repeat these four lines for each Domino partition you have. For example, if
    you have 2 partitions - the first partition run by npar1 and the second by npar2
    - your limits.conf file would look like this:


    ```

    npar1 soft nofile 49152

    npar1 hard nofile 49152

    npar1 soft nproc 8192

    npar1 hard nproc 8192

    npar2 soft nofile 49152

    npar2 hard nofile 49152

    npar2 soft nproc 8192

    npar2 hard nproc 8192

    ```


    These limits are applied only to the Linux account used to run Domino and do not
    apply to any other account on the system. These flags increase the maximum number
    of open files (nofile) and the maximum number of processes/threads (nproc) allowed
    for the user(s).


    +   6. Check that /etc/pam.d/login has the following line:


    +   7. Edit the /etc/fstab and add the noatime parameter to the options of the
