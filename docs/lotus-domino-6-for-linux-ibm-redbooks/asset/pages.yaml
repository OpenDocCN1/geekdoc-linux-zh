    Figure 3-20 Syslog configuration file


    By default, all system messages go in the /var/log/messages file unless otherwise
    specified. In the syslog configuration file, there are specifications for other
    log files for mail, news, and so forth.


    The log files can be redirected to other paths by editing the syslog.conf or by
    moving the file and creating a link to the new location.


    There are situations when the system administrator wants to see the log information
    in real time. To do so, log in as root and type at the shell command prompt tail
    -f /var/log/messages. The tail command will watch the log file and any information
    that is written to the log file is displayed in the console window as show in
    Figure 3-21 on page 170.


    > For more information about the tail command, type man tail.'
