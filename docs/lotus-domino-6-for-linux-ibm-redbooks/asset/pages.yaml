  md: '# Domino as a Web server


    In this chapter we describe how to configure a Domino 6 server to work as a Web
    server.


    We discuss in detail several aspects of implementing the HTTP task for Domino
    6, which improves the performance and scalability over previous releases. The
    most beneficial enhancement to the Domino 6 HTTP task is the addition of several
    security options specific to the HTTP protocol.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# 6.1 Linux Operating System configuration


    Considering the temporary nature of connections under the HTTP protocol (each
    requests a connection, sends the message, returns the response, and closes the
    connection), particular care must be taken in configuring the TCPIP part of the
    Linux Operating System.


    # 6.1.1 Basic recommendation


    It is possible that some other HTTP server could be running on your system, like
    Netscape or Apache. The only precaution is to check if other HTTP daemons are
    running on the Linux system using the default port 80.


    Use the ps `-ef` command and pipe the output to the **grep** command to check
    this:


    ```

    # ps -ef | grep http

    ```


    > Note: The UNIX **grep** command searches a file for a pattern. It also reads
    from the standard input so it can be used in a pipeline command.


    You should not see any HTTP-related task running on your system.


    Use the **netstat** command to see if any daemons are using port 80:


    ```

    # netstat -an | grep ":80"

    ```


    In this case the command should not have any output. If there are some daemons
    listening on port 80 you may have output like this:


    ```

    tcp 0.0.0.0:80 0.0.0.0:* LISTEN

    ```


    Generally you can have other HTTP processes running on your system, listening
    on different ports. Running other HTTP systems on the same Linux server is not
    recommended if you want to have a high performance Domino Web server.


    # 6.2 Domino Web server configuration


    The configuration of the HTTP server in Domino 6 is a very easy task. Most of
    the work is done at Domino installation time if you check the options to install
    the HTTP task.


    > Note: Refer to Chapter 2, “Installing Domino 6 for Linux” on page 83 for information
    about installing Domino.'
  merge: -1
  pgno: 379
- img_proc: true
  md: 'If you choose to install the HTTP task, you will find the HTTP name in the
    Notes.ini file for the ServerTasks entry:

    ServerTasks=replica,update,amgr,admin,HTTP


    > > Tip: The content of Notes.ini file is not case sensitive, so there is no problem
    if the name of the task is written with capitals and the effective name of the
    binary file is http. Remember that UNIX is case sensitive.


    # ## 6.2.1 Settings on a Domino Web server


    To change the settings of the Domino Web server, use the following steps:


    +   1. Start the Domino Administrator.

    2. Choose the server you want to reconfigure.

    3. Choose the Configuration tab.

    4. Choose the Server -> All Server Documents.

    5. Double-click the Domino server you want to change or select the server and
    click **Edit Server.


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_380_0.png)


    Figure 6-1 Web server configuration


    Chapter 6. Domino as a Web server 367'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'To change the Domino Web server port, click Ports -> Internet Ports in the
    server document. The Web tab should be selected by default.


    It is best to use the default port 80 for a non-secure Web server and 443 for
    a secure Web server.


    > Note: The secure server will not run until you create a server certificate.
    See "Setting up SSL on a Domino server" in the Domino 6 Administration online
    help.


    Here you can also choose if you want to allow name and password authentication
    for clients connecting over TCP/IP; the default is Yes. Also specify whether you
    will allow anonymous connection over TCP/IP; again, the default is Yes. The same
    is true for the SSL protocol.


    Next, select Internet Protocols -> HTTP (see Figure 6-2). In this section, you
    should make at least the following changes:


    +   In the Basic section enter a hostname and enable the "Bind to host name" option
    if you use a Domino partitioned environment. The parameters "Maximum request over
    a single connection" and "Number of active threads," which are discussed later
    in this chapter, should be set.


    +   In the Enable Logging section, enable either log files or Domlog.nsf if you
    want to create statistics about access to your Web server (for example, by whom,
    how much, and which pages were accessed). Enabling either type of logging will
    affect server performance.


    +   In the Mapping section, customize the Home URL. It should be either a Notes
    database or an HTML file.'
  merge: -1
