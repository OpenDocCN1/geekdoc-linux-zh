- img_proc: true
  md: '> Note: Refer to the Lotus Domino Administrator 6 Help for additional information
    on setting up the Web Administrator database. The Web Administration client is
    discussed in 3.4.1, "Domino 6 Web Administrator" on page 177.


    The Web Administrator, most of the tasks available through the Domino Administration
    client can now be performed from your browser with no extra setup tasks. However,
    in order to register users from the Web Administrator you must have access to
    a Notes Certifier. You have this access from the Domino Administration client,
    but not from the Web Administrator. The Certificate Authority process in Domino
    is designed to let register users without direct access to the Notes Certifier
    ID by securely delegating this permission to selected users. To use the Certificate
    Authority process, you must migrate the Notes Certifier.


    # Migrate the certifier


    When you installed the first Domino server you created a Notes certifier for issuing
    Notes certificates. This certifier is capable of using either a keyring file or
    of the Certificate Authority process. We chose the Certificate Authority process
    in lieu of creating a keyring.


    > Note: The Certificate Authority is the link that allows a client and server
    to communicate using SSL and to exchange mail with S/MIME. The server and the
    client authenticate with each other by identifying the digital signature on their
    trusted certificate. Refer to the Lotus Domino Administrator 6 Help for information
    on the Certificate Authority and public key encryption.


    The migration requires the Domino Administration client. Since we have already
    installed the client within CrossOver Office, we can perform the migration locally
    without working from a Windows workstation.'
  merge: -1
