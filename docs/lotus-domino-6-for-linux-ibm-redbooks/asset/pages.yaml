    for Scheduled or Manual Database Scan.


    If you have purchased ScanMail, you should register and set up an update schedule
    for Pattern Files, so automatic updates will be enabled. (The automatic update
    is disabled for the 30-day evaluation.)


    For more help, you can access the help database (smhelp.nsf) directly (Figure
    7-7), or select it under Support in the main configuration screen.


