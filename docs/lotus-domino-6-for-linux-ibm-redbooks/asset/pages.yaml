  md: '# 2.2.4 Setup


    Now that you have successfully installed Domino 6, it is time to configure and
    set up the server. Log out as root and back in under the notes user account so
    that it, and not root, ows the X-Windows session.


    # Setting the Linux PATH environment variable


    Before you begin, you are going to make a quick change to your shell environment
    to make it more user friendly. If you installed Domino 6 to a different directory
    than the default, you will need to replace /opt/lotus/bin with the path you chose.


    Normally, commands are given with the full path, for example

    /opt/lotus/bin/server for the server executable. Linux searches your PATH environment
    variable for executables, so you are going to add /opt/lotus/bin, as well as the
    Domino user account and not as PATH. Make certain you are logged in with the current
    directory, to not as root. You can check this by issuing the command `whoami`
    or `id`.


    Start the KATE editor. The program automatically begins with a new file (file
    needs to be called. `.bash_profile`, as shown later) so all you need to do is
    enter the following line:


    ```

    export PATH=$PATH:/opt/lotus/bin/:

    ```


