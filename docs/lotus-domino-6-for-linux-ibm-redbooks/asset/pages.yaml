- img_proc: true
  md: 'I/O resources. Unlike NT, however Linux does not rely heavily on Swap. As long
    as your server has enough memory, this should be a suitable configuration. Be
    certain to test this scenario, however, in order to make certain that you are
    content with the resulting performance.


    How about using RAID5 configuration for the entire server? While RAID5 is an appealing
    option for getting the most out of your RAID hard drives, it is not suitable for
    the entire server, especially with transaction logging enabled. Remember that
    when writing to data, RAIDS will need to read data from the disk in order to recalculate
    the parity, except when performing a full-stripe-write where the data is already
    in the cache. The additional I/O overhead over partial-stripe-write and read-modify-write
    operations results in RAID5 exhibiting slower performance than RAID1. Read performance
    is typically slower as well since RAID1 offers two drives from which data may
    be read. Though RAIDS offers more drives for simultaneous reads, the requests
    would have to be broken up so that no two requests needed information on the same
    drive. This is because in AIDS the data is not mirrored - redundancy is provided
    by the parity stripe - so there is only one location where data can be read. RAID5,
    preferably through hardware not software, should be utilized only for the Domino
    data directory. If you have to use RAID5 for the entire server, you should not
    enable transaction logging.


    > Note: Transaction logging is set up via the Task tab on the server document;
    see the Lotus Administrator Guide for more information.


    # Multiple mailboxes


    Since server processes require exclusive access to mail.box, it is possible for
    several servers to contend for the mail.box, especially while the router task
    is working on a large message. Therefore, you should set the number of mailboxes
    equal to two in the default configuration document for your domain.


    +   1. Open the Domino Directory.


    +   2. Go to Server -> Configuration.


    +   3. Open the appropriate configuration document: * - [All Servers]


    +   4. Go to the Router/SMTP -> Basics tab.


    +   5. Edit the document and set the number of mailboxes to 2.


    You can set the number higher than two, but you should only do so after you determine
    that there is still contention with two mail.boxes. Refer to the Lotus Domino
    Administrator 6 Help for more information.'
