  md: '# 7.2.4 Operating system backup tools


    There are a number of utilities provided by the Linux operating system that can
    be used to back up a Linux server machine. This section gives you an overview
    of these utilities. Many of these utilities are common among the different versions
    of UNIX operating systems.


    +   - CPIO - This utility is a UNIX system backup procedure that has been in existence
    since the early implementation of the UNIX operating system. Files can be backed
    up and restored from disk or tape.


    +   - TAR - This utility is a UNIX system file archive procedure that has gained
    popularity on all UNIX platforms because:


    +   - It has built-in compression algorithms.

    - It has the possibility to create incremental backups.


    +   - DD - This is very powerful tool that is used on a UNIX system to write files
    to disk or tape.


    Tar is the most simple command to use for a backup. If you are familiar with PKZIP
    file compression, tar is very similar. Although it can be used to back up a networked
    machine, tar is most commonly used to back up a standalone server.


    This command can be found on all UNIX platforms; this gives you the ability to
    read your backup files on servers that are running different versions of UNIX
    (SCO, AIX, HP-UX, and so for forth).


    The tar command has a lot of parameters. Obtain more information about all of
    these parameters by typing the following:


    ```

    man tar

    ```


    Table 7-2 shows the most commonly used tar options.


    | Parameter | Action | Samples |

    |---|---||

    | -c | Create a new tar file | tar -c myfile1 myfile2 |

    | -f | Specify a filename for the tar file | tar -cf tarfile.tar myfile1 myfile2
    |

    | -v | List the files processed | tar -cvf tarfile.tar myfile1 myfile2 |

    | -r | Append file to an existing archive | tar -rvf tarfile.tar myfile3 |

    | -X | Restore files | tar -xf tarfile.tar |

    | -u | Update an archive file | tar -uv tarfile.tar myfile1 myfile2 |

    | -t | Show the content of an archive file | tar -tf tarfile.tar |'
  merge: -1
  pgno: 446
- img_proc: true
  md: '**Important:** The -c command creates a tar archive on the default output,
    which is probably your screen (you can change that). If you want to do a backup
    to a file, add the -f parameter and specify a directory and a file name.


    +   The following command backs up all the files included in the /local directory
    onto a tape drive (/dev/st0):

    ```bash

    t -cvf /dev/st0 /local```


    +   If you want to back up your data into a file on a disk, type the following
    command:

    ```bash

    t -cvf /backup/file.tar /local```

    This command will back up everything in the directory /local and put the archive
    file (file.tar) into the backup directory.


    +   You can also add new files at the end of a backup file. To do this, type the
    following:

    ```bash

    t -rvf /dev/st0 /newdirectory```

    This command will append to the tape the directory /newdirectory.


    +   If you want to update an archive file, type the following command:

    ```bash

    t -uvf /dev/st0 /local```

    This command will add all the new or modified files included in the /local directory
    at the end of your tape.


    +   It could be interesting to look at the content of an archive file. To do this,
    type the following command:

    ```bash

    t -tf /dev/st0```

    This shows you the tape content.


    # Tar backup


    The last sample shows you how to back up the data we chose in our backup strategy.
    There is nothing included in tar to manage your cartridge, you will have to do
    that yourself.


    Type the following command, and change your cartridge each day:

    ```bash

    t -cvf /dev/st0 /root /etc /home /local /opt /var```


    **Note:** The entire command must be typed on the same line.'
  merge: -1
  pgno: 447
- img_proc: true
  md: '> **Important:** To back up and restore Domino data with the tar command need
    to shut down the Domino server.


    # Tar restore


    To restore your data from an archive, log in on your system as root (you need
    to be able to write in the directory you want to restore) and type one of the
    following commands.


    +   * If you want to restore the entire backup:

    ```bash

    cd /

    t -xvf /dev/st0

    ```

    This command will restore all the files you have on your tape in the / directory.


    +   * If you want to restore your data in another directory to be sure that your
    backup is good, type the following:

    ```bash

    cd /tmp

    t -xvf /dev/st0

    ```

    All the data in this sample is restored in the /tmp directory.


    +   * If you need to restore only one file from the archive, just type the following:

    ```bash

    t -xvf /dev/st0 etc/fstab etc/ftpaccess

    ```

    In this sample, we restore two files (fstab and ftpaccess in the /etc directory).


    +   * Remember that you can view the archive content by typing the following:

    ```bash

    t -tf /dev/st0 > listfile.txt

    ```

    This command will create a file called listfile.txt in the current directory that
    contains a description of all the files, with their full path, included on the
    tape.


    **Important:** If you want to add some data to an archive tape, use the append
    command (-r), which will not erase the tape content. If the `create` parameter
    is used, the tape content will be erased by the new data.


    The command can be used in scripts, in association with the cron table, to automate
    your backups.


    > **Note:** For the tape drive and the cartridge, the MT command allows you to
    do some basic operations, like `rewind` or `erase` a cartridge. Type `mt -h` (or
    `man mt`) to obtain this list.'
  merge: -1
  pgno: 448
