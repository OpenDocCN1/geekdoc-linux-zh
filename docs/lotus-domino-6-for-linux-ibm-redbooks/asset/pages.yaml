  md: "If you want to rename the table, use:\nRENAME TABLE TO new_tablename;\n\nIf\
    \ you want to change the format of a column or remove a column, refer to the\\\
    MySQL Reference Manual regarding ALTER\n\n# Configuring ODBC\n\nODBC stands for\
    \ Open Database Connectivity. It is an open standard for an\napplication program\
    \ interface (otherwise known as API) used to access a\ndatabase. Each database\
    \ vendor will need to have an ODBC driver that will allow\ncommunication from\
    \ the API to the database. This allows for the abstraction of\nt specific database\
    \ programming language so that you now have flexibility in\nt number of databases\
    \ that can be supported. More concisely, you only need\nknow the language of the\
    \ ODBC API in order to communicate to any\ndatabase product that has an ODBC driver.\n\
    \n# MyODBC\n\nThe driver we will use is MyODBC, which is the ODBC driver from\n\
    MySQL. All that is required is to install the driver. The essence of this package\n\
    comes in the form of a shared library named libmyodbc.so. This library will act\
    \ as\nt translation key when it is called by an ODBC manager.\n\nSince it is a\
    \ static library, there isn't anything in the way of configuration\nnecessary\
    \ for MyODBC.\n\n# unixODBC\n\nAn ODBC manager is the actual interface between\
    \ us and the database. This\nprogram provides the point of communication that\
    \ we can interact with using the\nlanguage defined by the ODBC API. The ODBC manager\
    \ then figures out the\ntype of database that is being targeted and handles communication\
    \ with the\ndatabase using the driver we specify in configuration. The ODBC manager\
    \ we\nare is using unixODBC and as we mentioned earlier, it is provided with\n\
    most distributions of Linux.\n\nThe ODBC driver for MySQL needs to be defined\
    \ in the odbcinst.ini as you can\nsee in our installation, the PostgreSQL section\
    \ is defined as well. Here you will\nto:\n\n+   1. Comment out the PostgreSQL\
    \ section as it is not being used (any line that\begins with a # is commented\
    \ out and will be ignored).\n\n+   2. Make sure the section that defines the MySQL\
    \ driver is defined and not\ncommented out.\n\n+   3. Make sure the file libmyodbc.so\
    \ exists and is located where the Driver\nparameter indicates."
