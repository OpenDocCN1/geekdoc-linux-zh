  md: 'In 2002, four companies, Caldera, Conectiva, SuSE, and Turbolinux, announced
    that they had formed a consortium to develop a single distribution of the Linux
    operating system. This distribution is called UnitedLinux. Previously, each of
    these companies had their own Linux distributions.


    By developing a unified distribution, UnitedLinux is attempting to help Linux
    users, ISVs, and OEMs to support a single Linux offering, instead of many different
    versions. By combining their skills and resources, the four companies are trying
    to make a better, standards-based business version of the Linux operating system.


    The consortium has announced that a public beta of UnitedLinux will be in Q3''2002
    and the first release version will still be available in Q4''2002.


    IBM plans to add support for UnitedLinux to Domino 6 for Linux, once UnitedLinux
    version 1 has been released.


