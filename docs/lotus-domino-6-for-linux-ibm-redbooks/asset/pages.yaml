    same time ensure that client traffic will not interfere with the high-speed cluster
    replication necessary for transparent failover.


    > Important: Cluster replication is the single most important aspect of a Domino
    cluster. You should monitor cluster replication closely to ensure the health of
    your Domino 6 cluster.


