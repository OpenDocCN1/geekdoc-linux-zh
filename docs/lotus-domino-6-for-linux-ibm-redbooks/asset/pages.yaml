  md: '# Lotus ADSync Options


    | Synchronization Options | Notes Settings | Field Mappings | Container Mappings
    |

    |---|---|---|---|

    | Container to Notes certifier mapping for domain: | itsolinx.lotus.com | | Help
    |

    | AD Container | Notes Certifier | Notes Policy |

    | itsolinx.lotus.com/ | /itsa | |

