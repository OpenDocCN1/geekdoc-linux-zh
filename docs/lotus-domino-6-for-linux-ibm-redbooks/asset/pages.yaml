    # 6.2.2 Starting, stopping, and refreshing the Domino web server


    There are two ways to start the Domino 6 web server:


    +   - Manually, by entering http at the server console

    - Automatically at Lotus Domino 6 start-up, adding it to the ServerTasks in Notes.ini.


    You can start only one HTTP task per Domino server; you have to use the Domino
    partitions feature to have more than one HTTP task running on the Linux server.


    To stop the Web server, use the command tell http quit at the server console,
    or remove HTTP from the ServerTasks in Notes.ini to stop it starting at the restart
    of the Domino server.


    Chapter 6. Domino as a Web server 369'
  merge: -1
  pgno: 382
- img_proc: true
  md: 'Type the command tell http restart at the server console to refresh the Web
    server, and if you made changes in the Domino Directory related to the HTTP configuration.


    **Tip:** You can use the server -c Domino command to send a Domino console command
    from a UNIX prompt. Type server -c "tell http quit" to stop the HTTP task from
    a UNIX prompt.


    #  6.3 Security on the Web server


    In this section we describe the Web security features in Domino 6. Some new security
    features were added to Domino 6, including HTTP protocol security options.


    #  6.3.1 Internet certificates


    Domino certificate authorities can also issue Internet certificates to Notes users,
    Internet clients, and Internet servers. The Domino certificate authority issues
    signed X.509 format certificates that uniquely identify the requesting client
    or server. Internet certificates are required when sending encrypted or electronically
    signed S/MIME messages and when using SSL to authenticate a client or server.


    S/MIME is a protocol used by clients to sign mail messages and send encrypted
    mail messages over the Internet to users of mail applications that also support
    the S/MIME protocol.


    Domino 6 provides native X.509 V3 support along with the Notes certificate.


    #  6.3.2 Browsing Domino databases via the Internet


    A common security issue is accessing the log.nsf database via a Web browser, for
    example:


    ```

    http://itsoredhat.com/log.nsf

    ```


    Although the log.nsf database does not contain critical information, a Domino
    system that allows access to the system log is not secure.


    To avoid this you have to change the ACL of the database to either:


    +   - Default No Access


    +   - Anonymous No Access'
  merge: -1
  pgno: 383
- img_proc: true
  md: 'You have to do one or the other in each Domino database in your data directory
    that must be kept inaccessible to Internet users.


    # 6.3.3 Session authentication


    A session is the time during which a Web client is actively logged on to a server.
    Session-based name-and-password security includes additional functionality that
    is not available with basic name-and-password security.


    Session-based authentication creates a temporary cookie that stores the user name
    and password on the browser client. As the user traverses the site, responses
    for name and password are provided by the cookie.


    This cookie passes the user credentials for every database within the Domino site,
    alleviating concerns of realm-based authentication.


    > Tip: If you wish to retain realm-specific logins, session-based authentication
    cannot be used.


    Once a user logs in to the Web site, the credentials are passed to every database
    hosted by the server. The user login information, however, is not shared across
    virtual hosts or virtual servers; it is based on the host name of the URL request.


    You can configure session authentication on the Domino Web Engine tab of the server
    document, in the HTTP Sessions section. This section is shown in Figure 6-3.'
  merge: -1
  pgno: 384
- img_proc: true
  md: '![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_385_0.png)


    With the Session Authentication feature enabled, you can use the following command
    to find out who is using a Web browser to access your Domino 6 server:


    +   > tell http show users

    > 04/24/2002 11:00:07 AM There are 2 current HTTP user sessions

    > 04/24/2002 11:00:07 AM User Name IP Address Expires

    > 04/24/2002 11:00:07 AM AM red book 9.95.35.56 11:29:52 52 AM

    > 04/24/2002 11:00:07 AM AM red book 9.95.35.56 11:29:28 AM


    The session authentication feature is based on the cookie mechanism; it allows
    a Web server to store pieces of information on the client computer through the
    Web browser. These pieces of information, known as cookies, are stored on the
    client machine.


    Tip: To return the value of a cookie, add a computed field `HTTP_COOKIE` to your
    form using an empty string as a formula. This field will be populated with the
    cookie information. You can then use the field `HTTP_COOKIE` in other formulas
    on the page.'
  merge: -1
