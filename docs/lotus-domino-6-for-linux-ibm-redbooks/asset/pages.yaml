- img_proc: true
  md: 'There are three access levels you can assign to a user:


    +   - Read/Execute access (GET method)

    - Write/Read/Execute access (POST and GET method)

    - No Access


    In the Name field, specify the user name by typing or by using the Domino Lookup
    order. After assigning the appropriate access permission, click OK to apply this
    user to the Access Control List. To remove a user, click the name and click Clear.


    # 6.3.6 HTTP protocol security


    Domino 6 is better equipped to fend off cyber attacks as Domino R5. Several new
    protocol-related security settings have been added to the Server document under
    the Internet Protocols -> HTTP tab. These new settings are designed to discourage
    attacks that probe buffer overflows or request parsing errors.


    The new settings for HTTP protocol security are:


    +   - Maximum URL Length

    - Maximum Number of URL Path Segments

    - Maximum Number of Request Headers

    - Maximum Size of Request Headers

    - Maximum Size of Request Content


    Maximum URL length is the URL length allowed to be received from HTTP clients
    as Internet browsers. This length includes the query string which defaults to
    4 kilobytes. We do not recommend increasing this limit unless your applications
    require extremely long query strings.


    Maximum number of URL path segments limits the number of segments allowed. For
    example:


    http://www.itsoredhat.com/a/b/c/d/e/f/g/h/i/j/k/l/m/n/o/.......etc.


    The default value for this setting is 64.


    Maximum number of request headers helps to protect against buffer overflow probes.
    By default, the Domino 6 HTTP task allows only 48 headers.


    Maximum size of headers limits the actual size or total length of the header in
    the request. The default setting is 16 kilobytes.'
  merge: -1
  pgno: 390
- img_proc: true
  md: 'Maximum size of request content restricts the amount of data that can be contained
    in a request such as a form. The default value is 10 megabytes. "Maximum Post
    data" setting from Domino R5 is supported in Pre-release 1.


    > Note: Refer to the Domino Administration 6 Help for additional configuration
    information about these new HTTP security settings.


    # # 6.4 Troubleshooting


    The HTTP process usually operates without incident. However, there are a few issues
    that are specific to HTTP process troubleshooting described in this section.


    # # 6.4.1 HTTP does not respond


    To check if the HTTP process has hung or simply is overloaded by a lot of client
    requests, a good basic test you can do is telnet to the process in the right port,
    by default port 80.


    For example, if your Domino server is running on a host named itsoredhat and listening
    on the default port 80, you have to run the command:


    ```

    # telnet itsoredhat 80

    ```


    The command output is as below:


    ```

    # telnet itsoredhat 80

    Trying 9.95.35.56...

    Connected to itsoredhat.

    Escape character is ''^]''.

    ```


    Now you can issue an HTTP command, for example get:


    ```

    Trying 9.95.35.56...

    Connected to lena.

    Escape character is ''^]''.

    get

    ```


    > Note: The get command should return the HTML header information of your default
    homepage. This header should include references to Domino and your operating system.


    In this case the get command receives an answer from the HTTP process; if HTTP
    was hanging, the get command would not receive any responses.'
  merge: -1
  pgno: 391
- img_proc: true
  md: '> Note: This technique can be implemented also for the other Internet processes,
    like IMAP, LDAP, and POP3, by choosing the appropriate port number (for example,
    143 for IMAP) and the appropriate protocol command (for example, hello for IMAP).


    # 6.4.2 Using the command


    Domino 6 utilizes a console command that helps in troubleshooting if HTTP hangs.
    This command is tell http Show Thread State.


    When entered at the Domino console, this command displays the current status of
    each active thread, and which URL, if any, the thread is processing.


    Following is a sample output for three threads. The first two threads are idle;
    the third thread (0xf9) is processing the URLnGET /reference.nsf/?OpenAgent HTTP/1.0


    +   > tell http show thread state

    06:37 PM HTTP Thread State: Thread: [fb] State: [Worker waiting for work]

    Other Info:

    06:37 PM HTTP Thread State: Thread: [fc] State: [Worker waiting for work]

    Other Info:

    06:37 PM HTTP Thread State: Thread: [f9] State: [Worker processing request]

    Other Info: GET /reference.nsf/?OpenAgent HTTP/1.0


    If the HTTP process is in a hung or partially hung state, this command can be
    used to determine if a particular thread has been processing the same URL for
    too long. If the thread is still processing the same request or URL for more than
    a few minutes, the thread is likely hung. You can check this by repeating the
    command after a few minutes.


    In many cases, if the task is hung, the Domino administrator can attempt to shut
    the HTTP server down, but the task does not always shut down gracefully. In Domino
    6, when an administrator issues the command tell http quit, if HTTP is waiting
    for a hung to complete outputs this thread ID and the URL it is working on to
    the console. For example:


    +   > tell http quit

    04/28/2002 06:37:51 PM HTTP Waiting For Thread: Thread: [F9] State: [Worker processing
    request] Other Info: GET /reference.nsf/?OpenAgent HTTP/1.0


    This information can be used to determine the hung thread, and which URL the thread
    is processing. This is similar to the use of req*.log files (described in the
    following section). The thread ID can be correlated against the req*.log file
    that pertains to that thread.


    Chapter 6. Domino as a web server 379'
  merge: -1
  pgno: 392
- img_proc: true
  md: '# 6.4.3 HTTP thread diagnostics


    Additional diagnostics for the Domino HTTP process are available, and can be enabled
    when troubleshooting HTTP problems.


    A log file can be created for each worker thread by placing the parameter "debugthreadlogging
    on" in the httpd.cnf configuration file. When this is enabled, a file is created
    for each active thread, with information about each request processed appended
    to the file as requests are made to the server (roughly 10-15 lines per request).
    These files can be extremely useful to pinpoint causes of HTTP crashes or hangs.


    An alternative to placing "debugthreadlogging on" in the httpd.cnf, administrators
    can enter the following command at the server console:


    ```

    >tell http debug on

    ```


    This dynamically sets the thread logging debug flag, and the server begins to
    create thread logs immediately. However, this debug flag remains in effect until
    the HTTP server is restarted. This method of turning on does not place the parameter
    in the httpd.cnf file.


    The created files are named req###.log , where ### is the thread ID for the active
    thread, and they are written to the Domino data directory. For example, req111.log
    corresponds to the lw-id 111 from the nsd.


    These req*.log files do not contain a date/time stamp, so they must be used in
    conjunction with Domino logging (DOMLOG.NSF or Access logs). However, each line
    of the logged request displays the number of milliseconds since the HTTP process
    last started (the bold number in "Start Request" line). This allows you to determine
    the amount of time that each phase of the request process takes.


    > Note: Use these variables for debugging only. They have a significant impact
    on Domino server performance when they are enabled.


    # 6.5 Domino 6 console tell commands


    Lotus Domino 6 has tell commands that can be used for the HTTP process. These
    commands are issued on the server console. Some of the commands are:


    +   - tell http show users

    - tell http show thread state

    - tell http restart

    - tell http show security'
  merge: -1
  pgno: 393
- img_proc: true
  md: '+   - tell http show virtual servers

    - tell http quit


    tell http show users

    This command can only be used if the server is configured to use session-based
    tracking for the Web. Session tracking is a feature of session-based authentication.
    In the Domino Directory. To enable it, edit the server document in the Internet
    Protocols section, select Domino Web Engine. By default, the entry for "Session
    authentication" is disabled. Select Enabled to allow the HTTP task to report on
    authenticated users. This command will show the User Name, IP address and the
    time of expiration (which is 30 minutes by default). This will only reflect users
    who are authenticated, and cannot be used to track anonymous users.


    tell http show thread state

    This command will list the current state of each active thread (as well as the
    accept thread and logger thread). If the thread is processing a request, the output
    of this command will indicate the URL being processed.


    tell http restart

    This will cause the HTTP task to shut down and reload. This is the equivalent
    of tell http followed by load http. This command is valid for the other Domino
    processes, too.


    tell http show security

    This outputs current status on the use of SSL for the server and each virtual
    server.


    tell http show virtual servers

    This outputs the current configuration for virtual servers.


    tell http quit

    This will cause the HTTP task to shut down.


    # 6.6 Virtual servers and host


    If you are a corporate intranet administrator who provides services to multiple
    customers, you can set up virtual servers on a single Domino Web server. A single
    Domino Web server can then host several Web sites. Using virtual servers allows
    you to maintain separate sites without incurring the expense of additional hardware
    and software.


    You can configure each site in Domino with its own IP address, default home page,
    customized Web server messages, HTML, CGI, and icons directories.'
  merge: -1
  pgno: 394
- img_proc: true
  md: 'The Domino data directory, however, is not individually configured for each
    virtual server; it is shared by all virtual servers.


    The difference between a virtual server and a virtual host is that virtual servers
    have different IP addresses and different hostnames, while virtual hosts use the
    same IP address but different hostnames.


    > Note: Refer to system administration documentation for your operating system
    environment for installing and configuring additional network interface cards
    and IP addresses. This document only addresses Domino-specific configuration settings.


    # 6.6.1 Create virtual server or host


    If you want to create a virtual server or host, in the Domino Directory select
    the Domino server and choose Actions -> Create Web R5-> Virtual servers from the
    menu bar.


    Now you will be asked whether you want to create a virtual host or a virtual server.


    Choose Virtual Host. Creating a virtual server is pretty much the same, except
    you will be asked for the IP address instead of the hostname.


    On the Basics tab, enter the hostname of your added virtual host.


    On the Mapping tab, specify the path names mapping to the HTML directory, the
    Icon directory, the CGI directory, and the home URL, like a Domino Web server
    configuration. This tab is the same for both server types.


    The Security tab lets you make some security settings for your virtual servers.
    You can decide if Name and password or/ anonymous authentication can be used.


    You can also customize the SSL settings to comply with your company''s security
    policies. For more information on SSL, refer to the Domino Administrator 6 Help.


    # 6.6.2 Create URL mapping and redirection


    There are three different types of URL mappings. Depending on the type you choose,
    you will get three or four tabs to configure the mapping.


    URL-to-URL mapping enables you to define an alias name for URL paths. For example,
    you could map /MyPictures to /images. Figure 6-8 shows URL-to-URL mapping.'
  merge: -1
  pgno: 395
- img_proc: true
  md: 'URL-to-Directory mapping enables you to specify which URL path should be mapped
    to which real directory on your server. For example, if you have the images you
    are using in your Web pages in a directory /web/images, you have to create a directory
    mapping /web/images to /YourDirectory to be able to access these pictures through
    the Internet. If you have defined a URL-to-directory mapping, you will also have
    to specify if your data can only be read or if it should be executable.


    Redirection URL-to-URL Using this, you can move pages to a different server without
    making the old URL invalid.


    Figure 6-8 shows the options for the Basics tab.


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_396_0.png)


    Figure 6-8 URL mapping/redirection document: Basics


    Chapter 6. Domino as a Web server 383'
  merge: -1
