  md: '# 5.3 Accessing external data from Domino: DB2 example


    This section describes how to use Domino Enterprise Connection Services (DECS)
    to enable a Domino application to access data from the DB2 sample database. It
    includes the following topics:


    +   - Installing DB2 for Linux

    - Domino Enterprise Connection Services

    - Virtual field activities

    - Creating the Domino application

    - Testing the Domino application


    # 5.3.1 Installing DB2 for Linux


    This section provides detailed instructions for installing, configuring, and verifying
    IBM DB2 Universal Database V7.2.1, Enterprise Edition for Linux.


    # Prerequisite Linux packages for DB2


    The DB2 product documentation should be consulted for the official list of prerequisite
    software. After installing Red Hat Linux V7.2 we found that the only missing package
    needed was ncurses4. Depending on the Linux options chosen, the latest version
    of this package may be installed when initially installing Linux. You may also
    install ncursesX using one of the RPM package tools. Our search for this package
    resulted in a later version of ncurses, v5, which we installed. Version 4 is a
    minimum requirement for the release of DB2 we used.


    To see if you have ncurses5 on your system, you can do the following:


    +   1. Verify whether the package is installed on the system using:

    rpm --verify ncurses5.2-12

    2. If no output is generated, the package is installed correctly; otherwise, the
    rpm package manager will return an error similar to the following:

    Package ncurses5.2-12 is not installed


    If the package is not installed, you must locate and install it before proceeding
    with the DB2 installation. There are a number of ways to do this. The easiest
    way to install the package is from the original Red Hat Linux V7.2 CD; otherwise,
    you can locate and download it from the Web.


    Insert the second Red Hat Linux 7.2 CD into the CD-ROM drive (the ncurses4 package
    exists on that CD).'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'If the CD doesn''t automatically mount (it may if you''re running X Windows
    with either the KDE or Gnome desktops) it can manually be mounted by issuing the
    following command as root:


    ```

    mount /mnt/CD-ROM

    ```


    This should work for a default installation. If it fails, verify the device that
    represents your CD-ROM drive and issue the following command instead:


    ```

    mount -r /dev/<device>/mnt/cdrom

    ```


    For instance, on our system, the CD-ROM drive is the first device on the second
    IDE channel. This is it (in Linux) referred to as *hdc* and can be mounted by
    the following command:


    ```

    mount -r /dev/hdc /mnt/cdrom

    ```


    If you do not have the CD, then the find requires RPM4 RPM on the Web. Go to http://rpmfind.net/
    and enter ncurses4 into the search box. Click Search, and download the RPM.


    Alternatively, you can find it in the directories of the Red Hat Linux FTP site
    at: ftp://ftp.redhat.com


    Once you have the RPM file either mounted or saved somewhere on your system, use
    the following command to install or upgrade the package:


    ```

    rpm -U --nodeps <path to file>/ncurses5.2-12.i386.rpm

    ```


    For example, from the product CD:


    ```

    rpm -U --nodeps /mnt/cdrom/RedHat/RPMS/ncurses5.2-12.i386.rpm

    ```


    DB2 for Linux also requires the pdksh 5.2.14-12 package. When installing Red Hat
    7.2 Linux this will likely be installed by default, depending on the options selected
    during the installation. Enter the following command to determine if pdksh was
    installed:


    ```

    rpm -qa | grep pdksh-5.2.14-12.i386.rpm

    ```


    If the package is not installed the Linux command prompt will return with no information.'
