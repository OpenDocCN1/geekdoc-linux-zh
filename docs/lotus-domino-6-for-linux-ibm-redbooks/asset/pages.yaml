  md: 'This will start the server in the foreground, and Domino will create the initial
    databases required for operation and for the enabled services. As with Linux program
    running in the foreground, you will need to leave the shell window open until
    the program is complete. Normally, we append & to the command line to run the
    server in the background so that we can exit the shell and log off. The idea of
    a service in NT is a mirror of the UNIX concept of running a task in the background.


    Once the initial tasks are finished and you have verified that there are no errors,
    type quit to exit the server so you can take a look at the new Java console.


    # Java Domino console


    To start the server with the new Java console, issue the following command:


    ```

    server -jc &

    ```


    This command will launch all three components: the Domino Server itself, the Domino
    Controller, and the Domino Console. For those of you familiar with the Win32 Domino
    Administration client, you will recognize the interface.


    > Note: Java Domino Console is new to Domino 6 and it replaces the cconsole that
    was the built in console program in Domino R5. The cconsole command is still available
    if you don''t have access to a GUI system. See the Lotus R5 for Sun Solaris 8
    redbook for more information on the cconsole command.'
