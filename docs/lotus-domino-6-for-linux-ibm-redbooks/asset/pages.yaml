  md: 'Note: You should always see a fatal_error() call on the stack trace of the
    failing thread. This is the function that prints out the "Freezing all server
    threads..." message.


    The next section contains Inter Process Communication Facilities Status (IPCS)
    information. IPCS details the shared memory, message queues and semaphore information
    for the machine.


    Shared memory has one control segment and several data segments. The data segments
    will be of uniform size, while the control segment is usually smaller than the
    data segments.


    There is no need to manually remove these files on a successful shutdown of the
    server. If the server crashes, nsd -kill will clean these files up.


    You can also manually check for the existence of these files by issuing the command
    at the OS:


    ```

    ipcs

    ```


    Note: Each partitioned server will have its own set of shared memory. The owner
    of these files will be the user starting the different partitioned servers.


    Example 4-8 shows a sample view of shared memory.


