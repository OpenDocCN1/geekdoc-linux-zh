    # Features


    Among the features provided by IPTraf are the following:


    +   - An IP traffic monitor that shows information on the IP traffic passing over
    your network. Includes TCP flag information, packet and byte counts, ICMP details,
    OSPF packet types.

    - General and detailed interface statistics showing IP, TCP, UDP, ICMP, non-IP
    and other IP packet counts, IP checksum errors, interface activity, packet size
    counts.

    - A TCP and UDP service monitor showing counts of incoming and outgoing packets
    for common TCP and UDP application ports.

    - A LAN statistics module that discovers active hosts and displays statistics
    showing the data activity on them.

    - TCP, UDP, and other protocol display filters, allowing you to view only traffic
    you''re interested in.

    - Logging.

    - Support for Ethernet, FDDI, ISDN, SLIP, PPP, and loopback interface types.

    - Utilizes the built-in raw socket interface of the Linux kernel, allowing it
    to be used over a wide range of supported network cards.

    - Full-screen, menu-driven operation.


    # Protocols recognized


    +   - IP

    - TCP

    - UDP

    - ICMP

    - IGMP

    - IGP

    - IGRP

    - OSPF

    - ARP

    - RARP


    Non-IP packets will simply be indicated as "Non-IP" and, on Ethernet LANs, will
    be supplied with the appropriate Ethernet addresses.


    # Supported Interfaces


    +   - Local loopback

    - All Linux-supported Ethernet interfaces'
