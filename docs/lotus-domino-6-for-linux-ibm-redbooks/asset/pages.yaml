    +   - Use GRUB as the boot loader

    - Use LILO as the boot loader

    - Do not install a boot loader


    Install Boot Loader record on:


    +   - /dev/sda Master Boot Record (MBR)

    - /dev/sda1 First sector of boot partition


    Kernel Parameters:


    +   - Force use of LBA32 (not normally required)


    Partition: /dev/sda1 Type: ext3


    +   - Default boot image


    Boot label: Red Linux


    | Default | Device | Partition type | Boot label |

    |---|---|---|---|

    | | /dev/sda1 | ext3 | Red Linux |


    New to Red Linux 7.2, GRUB is a software boot loader that is used to start Red
    Linux on your computer. It can also install other operating systems, such as Windows
    Xs. Here, you will be asked how (or whether) you want to configure a boot loader
    and which one (GRUB or LILO).


    Choose boot loader you want to install. If you would rather use the legacy boot
    loader, LILO, make sure it is selected


    Figure 1-17 Red Hat 7.2: Boot Loader installation


    > Attention: The boot partition of the system you are installing on an IDE hard
    drive and it is stored on a section of the hard drive that is located beyond 1024
    cylinders, select Force use of LBA32. The boot loader has to do special processing
    to address more than 1024 cylinders when booting the system from such a partition.


    Figure 1-17 shows the first software program that runs when a computer starts.
    It is responsible for loading and transferring control to the operating system
    kernel software, which loads the operating system. A boot loader can be used to
    start Red Linux and other operating systems, such as Windows or OS/2. Examples
    of boot loaders are GRUB and LILO for Linux and NTTLDR for Windows/2000.


    We used GRUB (Grand Unified Boot Loader) for our installation because it is the
    default boot loader for Red Hat. Be sure to specify that the boot code should
    be installed in the MBR (Master Boot Record). All other default options can be
    accepted.


