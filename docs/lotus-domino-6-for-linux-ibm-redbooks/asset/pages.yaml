    # 3.2.3 Scripts


    In this section we describe how to create a shell script. Shell scripts are a
    powerful method by which to customize your Linux server. As an example, we will
    create a simple script. This script will erase the log files that are more than
    2 months old. Example 3-13 gives the actual code.'
  merge: -1
  pgno: 167
- img_proc: true
  md: "**Note:** Each shell has its own syntax for scripts. The scripts we created\
    \ are made for the BASH shell.\n\nExample 3-13 Log eraser\n\n```\n!/bin/bash\n\
    ## Log eraser\nLPATH=/var/log\nNR_OF_DAYS=60\n\nfor i in $(find $LPATH -atime\
    \ +$NR_OF_DAYS)\n\n  rm -f $i\ndone\n```\n\n+   The first line #1/bin/bash tells\
    \ the environment that the script will run. This line is to be treated as is and\
    \ should not be modified.\n\n+   The sixth line sets the variable LPATH to equal\
    \ /var/log and the seventh line sets the variable NR_OF_DAYS to 60. We recommend\
    \ that use variables because it makes it easier to debug your script.\n\n+   $LPATH\
    \ and $NR_OF_DAYS indicate that you wish to use the value of the specified variable.\n\
    \n+   find $LPATH -atime +$NR_OF_DAYS will search in the /var/log directory for\
    \ files older than 60 days.\n\n+   Next is a for loop. For every value of i, we\
    \ will run the command rm -f i which will remove every file specified by the value\
    \ of i.\n\n+   Lines that start with a # are comments but there are special cases,\
    \ such as the first line or the comments utilized by the chkconfig command.\n\n\
    Save the file as log_eraser.sh. We recommend that you create a directory, as /scripts,\
    \ in order to keep your scripts in a single location. To be able to execute the\
    \ script, you have to modify the rights of the file. Run the command chmod 700\
    \ /scripts/log_eraser.sh. You will be the only one who can read, write, and execute\
    \ the file. In case you were wondering, the 7 in chmod command comes from adding\
    \ the numerical values of the read(4), write(2), and execute(1) permissions together:\
    \ 4+2+1 = 7. The two zeros in the chmod command indicate that the group and the\
    \ world (all other users) have no rights to the file."
