  md: 'Even when the Domino server is shut down, you can start it again, as long as
    the Domino controller is still running. All the data between the jconsole and
    the controller is encrypted from SSL.


    # Starting Domino from a script


    We recommend that you start Domino from a script. This will ensure that the server
    is always started when the system is rebooted. Starting Domino via a script is
    akin to the service feature available in Windows NT. The advantage of a script
    over a pre-defined GUI is that you can configure the script to carry out specialized
    tasks, as well as start Domino in the manner best suited to your operating environment.


    The startup script included here can be downloaded from the redbook website. See
    more information on how to acquire the script in Appendix B, "Additional material"
    on page 445.


    To install this script on your Linux system:


    +   1. Log in to the system as root.

    2. From a shell command line, navigate to /etc/init.d (issue the command cd /etc/init.d)

    3. Copy the Domino file from the website into this directory via ssh, or create
    a new file with your favorite editor and paste the text of the script into it.

    4. Once you have copied or saved the file—it should be named domino—you need to
    set the permissions and the owner. These should be the same as the other files
    in the /etc/init.d directory. This is usually root:root for the owner and group
    and -rw-xr-x for file permissions.


    You can learn more about file permissions and ownership in "File permissions"
    on page 135.


    +   5. Issue the command chconfig --add domino to register the script with the
    Linux startup process.


    Here is the startup script for Domino 6. Remember that the script assumes you
    will be using the performance enhancements described in 4.1.2, "Linux scalability"
    on page 208.


    The Domino startup script is meant to be run automatically during system startup.
    If you need to restart Domino without rebooting the entire system, use the startserver
    instructions how to obtain the script included in the Appendix B, "Additional
    material" on page 445. The startserver script should be placed in the Domino data
    directory and grant execute permissions as outlined in Step 4. However, the owner
    should be the Linux account used to run Domino and the script should be started
    by that account as well.'
  merge: -1
  pgno: 143
- img_proc: true
  md: "# Example 2-1\n\n```\n#!/bin/sh\n# A startup script for the Lotus Domino 6\
    \ server\n#\n# chconfig: 345 95 5\n# description: This script is used to start\
