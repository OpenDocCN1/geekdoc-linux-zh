  md: '# 5.3.2 Accessing external data from a Domino 6 application


    The release of DECS that ships with Domino 6 Enterprise Server replaces RealTime
    Activities with Virtual Fields Activities: Virtual Fields include all the functionality
    available in the earlier DECS RealTime activity, along with a number of new features,
    including:


    +   - Support for computed subforms

    - Options for new line delimiters

    - An additional logging option

    - Support for procedure return parameters following insert and update operations


    Output from write operations allows results to be returned to fields in the Notes
    document being monitored following insert and update operations.


    > Note: Refer to the Domino Enterprise Connection Services User Guide for additional
    information about DECS and Virtual Fields.


    # 5.3.3 Virtual Fields Activity


    Virtual Fields Activities (previously known as DECS RealTime Activities) enhance
    Notes applications by enabling them to retrieve external data, such as data from
    DB2, and to integrate this external data with native Notes data on a single Notes
    document form. DECS, running on the Domino Server that is hosting the Domino application,
    intercepts and handles the Domino database events. For example, when Notes or
    Web clients open, create, update, or save Notes documents, these events are acted
    upon, obtaining immediate access from the Notes form to external data sources
    supported by DECS. You get the data immediately (dependent, of course, on network
    bandwidth and other factors that affect system resources).


    Once a system administrator has created a Virtual Fields Activity, Domino users
    can open, create, update or delete external system data directly and transparently
    through their Notes client. By extension, Web clients may open the same Notes
    form that the activity monitors by accessing a Domino 6 server and obtaining access
    to supported external source data.


    For example, if the external database to be queried or updated from the Notes
    form is a DB2 database, Notes end-users may work with DB2 data as if it were in
    Notes. DB2 connectivity software is not required on the client system; however,
    it must be installed on the Domino server machine. Network access to the external
    data source is handled by the Domino server machine, which contains DECS connectivity
    software for the external data source, such as DB2.'
  merge: -1
  pgno: 323
