  md: '# 3.4.2 Domino Java Console


    The Domino Java Console provides real-time interaction with the Domino Server
    and is often the fastest way to see what is happening with a server. In Domino
    6, the Domino Console is available through a new, powerful Java application. We
    covered the basics of enabling this tool in “Java Domino console” on page 126.


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_204_0.png)


    One of the views available through the Configuration tab is the Current Server
    Document, which is shown in Figure 3-38. It provides access to your Domino server
    document, which contains many of the settings that define how your server operates.
    These settings include:


    +   - Basic information, such as the server and the host name of your server


    +   - Security settings


    +   - Internet protocols, such as settings for the HTTP task and Domino Web Engine


    +   - Mail routing


    +   - Transaction logging


    Chapter 3. Security and administration 191'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'The advantage of the new Java Domino Console feature is that, unlike the Win32
    Administration client, you can connect to the server Domino is installed on, even
    when the Domino server is not responding.


    To launch the Domino console, do the following:


    +   - On a Linux system running X-Windows, issue jconsole from a shell command
    prompt. If you have not added the Domino executable path to your PATH environment
    variable, you will need to specify the full location, which is /opt/lotus/bin
    by default.

    - On a Windows machine with the Administration client installed, launch jconsole.exe.
    This executable is located in the Lotus Notes Client directory.


    Once the Domino Console launches, you can connect to a new server with File Connect
    Controller (Ctrl-O). If you have previously connected to the server with this
    console, you can click the multiple server icon and select it from the list. In
    the prompt box, enter your Notes name (or shortname) as your username and your
    Domino HTTP password in the password field. For a new server, type the name in
    the server; otherwise, select the server from the drop-down list.


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_205_0.png)


    Figure 3-39 Domino Console: Connecting to a server'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'Table 3-3 identifies some of the common commands you can use from the console;
    these commands will also work from the Web admin quick console.


    # Table 3-3 Common Domino Console commands


    | Domino Console command (abbreviation) | Description of the command results |

    |---|---|

    | show users (sh us) | Shows the users connected to the Domino server |

    | show tasks (sh ta) | Shows the tasks currently running |

    | show cluster (sh cl) | Shows how the cluster is performing and current connectivity
    to cluster members |

    | show config servertasks | Shows the current value of the servertasks notes.ini
    entry. You can use config to display any notes.ini entry |

    | set config servertasks= | Replaces the existing server notes.ini entry with
    the values you specify after the equals sign. The values you specify replace the
    existing ones (they are not appended). |

    | load replica | Loads an instance of the replicator remains until you reboot
    the server. Any command without options loads another permanent instance of the
    task while a command with options (see the next example) runs, then quits. |

    | replicate itsoredhat/ITSO names.nsf (rep itsoredhat/ITSO names) | This causes
    the current server, Itsosuse/ITSO in our case, to replicate the specified database,
    names.nsf, with the specified server, itsoredhat/ITSO. You must use the full hierarchical
    name of the server. Once replication finishes, the replicator will quit |

    | show stat server.users | Show stat displays the specified Domino statistic.
    There are hundreds of statistics; consult the event14 nsf database for a description
    of each statistic. |

    | restart server (res s) | This will restart the Domino server. If issued from
    the Web admin quick console, you won''t be able to view the restart. If issued
    from a client connected via the new controller, you can monitor the restart process.
    |


    Chapter 3. Security and administration 193'
