    # Securing daemons


    If you need a daemon to run and want to control who can connect to your machine
    and who can''t, use the files /etc/hosts.allow and /etc/hosts.deny.


    In the file /etc/hosts.allow, you can set who can connect to your machine on different
    ports, as shown in Example 3-3.


    Example 3-3 The /etc/hosts.allow file


    ```

    # /etc/hosts.allow

    shhd: 192.168.1.0/255.255.255.0

    shhd: 192.168.234.0/255.255.255.0

    inftpd: 192.168.0.0/255.255.255.0

    ```


    This means only clients with an IP address between 192.168.1.1 and 192.168.1.254
    or 192.168.234.1 and 192.168.234.254 can connect to the ssh server, while only
    those with an IP address between 192.168.0.1 and 192.168.255.254 can connect to
    your ftp server.


    In the file /etc/hosts.deny, you can set who is not allowed to connect to your
    machine on different ports, as shown in Example 3-4.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Example 3-4 The hosts.deny


    ```

    # cat /etc/hosts.deny

    shd: 10.10.10.0/255.255.255.0

    inftpd: 10.10.99.0/255.255.255.0

    ```


    This means clients between 10.10.10.1 and 10.10.10.254 cannot connect to the ssh
    server, while clients between 10.10.99.1 and 10.10.99.254 cannot connect to the
    ftp server.


    > Tip: For best security practices the /etc/hosts.deny should contain all: any
    deny. This means that nobody can connect to the daemons protected by tcpd (man
    tcpd) unless they are in the /etc/hosts.allow.


    > Tip: Use the ssh daemon instead of the telnet because SSH encrypts all the data
    between your client and server. You will need an SSH client if working from a
    Windows machine; you can find one free, such as the versatile PuTTY and its companion
    product PSCP (PuTTY Secure Copy), on the Internet. A good use of PSCP is to copy
    the cert.id file from the Domino server to a workstation. For more information,
    see:

    http://www.chiark.greenend.uk/~sgtatham/putty


    # Advanced network security


    If you want to remotely administer servers in a very secure manner, use a different
    physical network if possible. In other words, use different network adapters and
    different switches.


    > Note: The administrative network does not have to be a high speed network. You
    can use older hubs or switches.


    If you create a separate network for administration, you will have the following
    advantages:


    +   - You don''t have to worry about someone stealing your password.

    - You can update your software through the administration network so your client
    will not notice a performance decrease.

    - In case your high speed network fails, you can use the administrator network
    for a short period of time.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Firewalls


    To increase the security of the internal network and protect servers from anyone
    who tries to steal or destroy your data, we recommend that the network and the
    servers be connected to the Internet through a firewall system. Firewall software
    is a network filter between your network and the Internet. All traffic to and
    from the Internet should pass through at least one firewall. For example, the
    firewall software is responsible for stopping all the requests coming in to your
    servers that are not addressed to the servers, and to stop some of the requests
    the server cannot handle all the requests (also called flooding).


    We recommend that you implement a firewall system in your network to protect your
    data. Figure 3-8 is a simple illustration, where the network is separated in two.
    One segment, typically referred to as a DMZ, has servers that need special access
    to the Internet. The second network is the internal LAN, where the most important
    data resides.


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_162_0.png)


    Figure 3-8 Firewall system'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'There are commercial firewall solutions and open source firewall solutions.
    Linux has a firewall solution that is very secure and very fast: iptables/netfilter.
    Some of its features are the following:


    +   * Packet filtering

    * Content filtering

    * MAC address filtering

    * NAT (Network Address Translation)

    * Anti-flooding procedures

    * Many, many other features


    > Note: For more information about netfilter, refer to the following website:

    http://netfilter.samba.org


    # Backup security


    Another method to gain access to your information is by stealing your backup tapes.
    In that, it is possible for someone to read your information, but not to to modify
    it.


    There are two ways to back up your server:


    +   * A tape or a library directly attached to your server

    * A backup server with a tape or library attached to it


    Make certain to lock your tapes in a safe place, and if you are using a backup
    server, be sure to use a username and a password to back up or restore your files.
    See "Backup" on page 425 for more information about backing up your data and about
    different backup solutions.


    # Operating system patches


    Both SuSE and RedHat provide easy ways to keep you system up-to-date with the
    latest security patches. See YaST2 for SuSE and RHN (RedHat Network) RedHat for
    more information.


    # 3.2 Linux administration


    It is not difficult to administer a Linux server. In this section, we discuss
    basic administrative tasks, such as creating a partition, creating a file system,
    creating scripts, and modifying crontab.'
