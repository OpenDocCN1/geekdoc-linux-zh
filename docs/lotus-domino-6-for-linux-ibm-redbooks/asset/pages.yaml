    Remember, you may run into issues where connectivity is denied based on the host
    or user combination. It is important to remember, when creating a user record,
    that each host/user combination needs to be explicitly listed in the user table
    of the MySQL database, even if its the difference between the hostname and the
    fully qualified name. Following is a sample entry for adding a user named user
    on samplehost.domain.com which would give connectivity to the whole RDBMS.


    ```

    GRANT USAGE ON .* TO user@samplehost.domain.com identified by ''password'';

    FLUSH PRIVILEGES;

