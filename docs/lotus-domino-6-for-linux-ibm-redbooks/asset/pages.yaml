    # # Network security


    In this section, we cover both basic and advanced network security. For information,
    visit the following Web site:


    http://www.linuxsecurity.com


    # ## Basic network security


    In the UNIX world, software that is able to connect to (exchange information with)
    other software on the same system or another system is called a daemon. Usually,
    the daemon listens on a specified IP and port; the Domino server listens on port
    1352. A server normally has many daemons running at the same time, as the the
    ftp daemon, telnet daemon, and so forth. Through these daemons, another system
    can connect to the server and exchange information.


    Daemons are divided into two categories: those started by root user; and the rest,
    started by other users. The daemons started by root listen on ports below 1024.


    If a daemon has a programming "bug" or there is an unusual circumstance, such
    as information coming too fast for the daemon to handle or reception of'
