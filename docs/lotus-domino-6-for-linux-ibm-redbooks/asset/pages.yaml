    To choose certifier or policy for AD container, click on the relevant column next
    to it.

    To choose the same certifier or policy for several AD containers, select those
    containers in the first

    column before choosing certifier or policy.


    Figure 5-3 Lotus ADSync: Container mappings with Notes Certifier


    The Container Mappings tab is where you can map Active Directory containers to
    Notes Certifiers and Policies. Active Directory containers are a special class
    that has both a namespace and attributes. The container does not represent anything
    real or concrete, but rather holds one more objects. Objects, on the other hand,
    are the underlying principle of everything in the Active Directory. Servers, workstations,
    printers, users, documents, and devices all represent objects. Each object has
    its own access control list (ACL) and attributes.


    By design, the synchronization tool allows you to preserve the hierarchies in
    Active Directory and Domino using mapping. You can select a specific container
    to map to a certifier and/or policy. You may restrict access to a directory structure
    (container, object, and so forth) with group policies in Active Directory, just
    as you can use the extended access control list in Domino to issue restrictions.
    An extended ACL is an optional directory access control feature available for
    the Domino Directory, an Extended Directory Catalog, and the Administration Requests
    database.


    Lotus Domino 6 for Linux'
