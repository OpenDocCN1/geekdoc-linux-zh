    # Load the new thread library


    +   1. Change to your Domino data directory. The default is cd /local/userdata.

    2. Issue the command mkdir lib1b to create a directory for the new files and ncd
    lib1b to change to the newly created directory.

    3. Copy the new libthread.so and librt.so from the BUILD directory.


    ```

    cp /usr/src/redhat/glibc-2.2.4/build-1386-linux/libthreads

    libthread.so/.Domino


    cp /usr/src/redhat/glibc-2.2.4/build-1386-linux/rt librt.so

    /librt.so/.Domino

    ```


    > Important: After building glibc-2.2.4, you now have two versions of libthread.so
    and librt.so. Make certain you copy the files from the /usr/src/redhat/BUILD directory
    and not from the standard directory.


    +   4. Create symbolic links in order to correctly load the files.


    ln -s libthread.so.Domino libthread.so.0

    ln -s librt.so.Domino librt.so.1


    5. Return to the Domino data directory with cd .. or using the full path.

    6. Grant the notes user and group ownership. Our user account for Domino is itsodom6
    and our group is notes, so we issue:


    chown -R itsodom6:notes lib


    in order to change the ownership of the lib directory and the files within it.

    7. If you are not using the startup script described in "Starting Domino from
    a ''script", then you will need to create a Domino 6 Server script to be launched
    by the Linux user account for Domino. Before the Domino 6 Server is started, we
    need preload the new libraries and then load the Domino server. Make certain that
    your script includes the following lines emphasized in this sample script.


    ```

    PRELOAD_SAVE=$LD_PRELOAD

    PRELOAD=$HOME/lib/libthread.so.0:$HOME/lib/librt.so.1:$LD_PRELOAD

    export LD_PRELOAD

    ```'
