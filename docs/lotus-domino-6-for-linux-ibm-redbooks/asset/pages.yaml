    # Transaction logging


    The main benefit of transaction logging is reliability. Any administrator who
    has waited a long time for a system that crashed to restart will immediately appreciate
    transaction logging. Just journaling improves the integrity of the Linux ext3
    file system, Domino transaction logging improves the integrity of Domino databases.


    Transaction logging comes in three flavors: archive, circular, and linear. Archive
    is intended for coupling your transaction logs with a Domino-aware backup system,
    while circular and linear are for non-Domino-aware backup system use. (See "Domino
    6 transaction logs and backups" on page 429).


    If you are not going to use your transaction logs in conjunction with a Domino-aware
    backup system, all you need is a pair of 4 Gb hard disk drives configured for
    RAID1. You need to dedicate these drives to the Domino Transaction Log to avoid
    a performance degradation.


    > Note: The maximum size for transaction logging is 4Gb. It can be set to less.
    The linear option has been added to Domino 6 in case you would like to utilize
    more for your transaction logs. Otherwise, it is comparable to the circular option.


    Ideally, from the OS to Swap to Domino, would would have its own hard drives utilizing
    multiple RAID controllers, but this is an unlikely scenario for all very high-end
    servers. When possible, use hardware-based RAID1 for the OS and Swap, another
    RAID1 for the transaction logs, and RAID5 for the data directory.


    Given the advantages of transaction logs in achieving data integrity and the substantially
    faster restarts of your server, we recommend enabling transaction logging if you
    only have a single, hardware-based RAID1 for OS, Swap, and the transaction logs,
    and a RAID5 for the data directory. This is admissedly not an ideal scenario since
    the Swap and transaction logs will be competing for'
