  md: '# Verify the DB2 Server installation


    To verify the DB2 Server installation, complete the following tasks:


    +   - Verify home directory permissions


    +   - Verify the DB2 instance owner profile


    +   - Verify the DB2 instance symbolic links


    +   - Verify the DB2 release level


    +   - Verify the DB2 service name


    +   - Verify the database manager configuration


    +   - Create the DB2 sample database


    # Verify home directory permissions


    Check that the home directory ownership has been correctly set up by the DB2 installation
    program. Using Table 5-2 for reference, log in as root, start a terminal session
    and navigate to /home directory. Use the following command to confirm directory
    ownership and permissions.


    ```

    ls -la

    ```


    Table 5-2 Home directory permissions


    | Home path | Owner | Group | Permissions |

    |---|---|---|--|

    | /home/db2inst1 | db2inst1 | db2adm | drwx-xr-x |

    | /home/db2fenc1 | db2fenc1 | db2fam | drwx-xr-x |

    | /home/db2as | db2as | db2asgrp | drwx-xr-r |


    Permissions needed so that the DB2 instance owner can read, write, and execute
    files and directories within the path. Group members'' and other users'' access
    rights are determined by your company''s security policies and business requirements.


    If one of the DB2 home directories is not configured properly, issue the command
    in the appropriate directory. You should be logged in as root. Substitute values
    from Table 5-2 as appropriate.


    ```

    chown -FR owner:group home-directory-path

    ```


    # Verify the DB2 instance owner profile


    The DB2 server installation should modify the .bashrc environment file of the
    instance owner so that environment will be set up when the DB2 instance user logs
    in. The .bashrc file is located in the home directory. If you accepted the default
    field values during the installation, that directory will be /home/db2inst1'
  merge: -1
  pgno: 318
