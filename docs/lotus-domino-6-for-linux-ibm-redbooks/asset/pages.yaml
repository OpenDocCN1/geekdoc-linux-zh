  md: 'nohup /opt/lotus/bin/server -jc c > /dev/null 2>&1 &

    sleep 3

    LD_PRELOAD=LD_PRELOAD_SAV

    export LD_PRELOAD


    This script takes the current system variable LD_PRELOAD and saves it in a new
    variable LD_PRELOAD_SAV. It sets the system variable LD_PRELOAD to $HOME/lib/libthread.so.0$HOME/lib/rt.so.1:
    plus the value of the original LD_PRELOAD; the export command makes the LD_PRELOAD
    available to the whole system. The nohup command starts the Lotus Domino server
    and sends all the output to null (null is used to stop messages from being displayed
    to the screen); the sleep command ends the system to wait for 3 seconds before
    handling back to the system. The last two commands set the LD_PRELOAD back to
    its original setting.


    8. Change to the Domino server account and execute then verify that the files
    are in use by checking the libraries used by the server process.


