    # 1.1.4 Time configuration


    During the Linux installation process, you will be asked if your system clock
    is setnto UTC (Coordinated Universal Time) or to local time. We recommend that
    you\yset the system clock (the BIOS clock) to UTC/GMT. This Linux can keep the

    clock on the correct time when the change for Daylight Saving Time occurs.

    s safest way is to set your clock to UTC before beginning the installation process.

    Should you have missed this, you can still set the system clock immediately after

    You have completed the installation and before the first time your machine

    reboots.


    Coordinated Universal Time is the international time standard. It is the current

    term for what was commonly referred to as Greenwich Meridian Time (GMT).

    Zero hours UTC is midnight in Greenwich, England, which lies on the zero

    longitudinal meridian. Universal time is based on a 24 hour clock; therefore;

    after hours after 4 pm UTC are expressed as 16:00 UTC.


    # 1.1.5 Video card and monitor


    It is not as easy to configure your monitor and video card in Linux as it is in

    Windows. If you currently have Windows installed on the machine that you are

    going to use for Linux, check the video card and monitor and their respective

    settings before starting the Linux Installation. This will help you later in the
    install

    process to select the right settings. You could also open the machine and check

    which video card is installed.


    # 1.1.6 File systems in Linux


    Linux supports multiple file system types. Examples of file systems in Windows

    are FAT, FAT32, and NTFS. As new or better file systems are developed, they are'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'incorporated into the kernel. In Linux, as in other UNIX derivatives, the separate
    file systems that are available for use by the system are combined into a single
    hierarchical tree structure rather than being addressed by drive names. Each new
    file system is added into this single tree structure by mounting the file system
    onto a specified directory. This directory is known as the mount point. The files
    and directories in the mounted directory are then accessible through this directory.
    If a file system is mounted onto a directory which already contains files, these
    files are masked by the new file system and are unavailable. Once the file system
    covering them is unmounted, the files become visible again.


    Initially, Linux used the unix file system. This had restrictions and performance
    problems, which were solved in April 1992 by the introduction of the Extended
    File System (ext). The ext file system was developed as an expandable and powerful
    file system for Linux. In January 1993, the Second Extended File System (ext2)
    was released. It has become the most successful file system for Linux distributions.
    While being a very solid, stable file system with good performance, it is quite
    slow to run a file system check (similar to CHDSK). This occurs when the system
    fails and is being brought back up, or every twentieth time the file system is
    mounted. On a system with big partitions, this check can take a while, and the
    system is inaccessible during the check.


    To solve these problems, journaled file systems were introduced with the 2.4 Linux
    kernel; we briefly discuss them in the following paragraphs.


    Journaling ensures consistency of the file system. This means that you do not
    have to run the file system check if the system should go down unexpectedly. In
    order to minimize file system inconsistencies and restart time, journaling file
    systems keep track of changes that they are about to make to the file system.
    These records are stored in a separate area of the file system, which is known
    as the journal or log. Once the journal records have been successfully written,
    the changes to the file system will be applied and the journal entries purged.
    If the system should go down unexpectedly, this process ensures that the file
    system is consistent without needing a length check.


    +   1. ext3 extends the ext2 file system by adding journaling. This means that
    it shares ext2''s robustness and performance. One major advantage of ext3 compared
    to other journaled file systems is that it is forward and backward compatible
    with ext2. You may freely switch between ext2 and ext3 as long as the file system
    has been cleanly unmounted or a file system check has run.

    2. ReiserFS- ReiserFS stores not just the file names, but also the files in a
    balanced tree. Balanced trees have a sophisticated algorithmic foundation and
    are more robust in their performance. Storing small files in large partitions
    is very efficient. Being more efficient at small files, however, does not mean
    it'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'is inefficient at storing larger files. ReiserFS is considered a truly multipurpose
    file system.


    We have opted to the ext3 file system for the Linux servers used in writing this
    book.


    > Note: The ext2 is a faster filesystem due to the fact it is not journalling
    everything, but it takes a lot longer to recover from a system failure or a journalling
    filesystem.


    An excellent source of information about file systems is the File Systems HOW-TO.
    You can find this HOW-TO document, as well as numerous others, on The Linux Documentation
    Project Web site at:


    ```

    http://tldp.org/docs

    ```


    Additional information about the ext3 file system can be found on:


    ```

    http://www.redhat.com/support/wpapers/redhat/ext3

    http://www.linuxplanet.com/linuxplanet/reports/4136/1/

    ```


    The home page for ReiserFS is located at:


    ```

    http://www.reiserfs.org

    ```


