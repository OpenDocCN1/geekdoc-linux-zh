    -memcheck

    Run the Notes memory checker only

    -nomemcheck

    Don''t run the Notes memory checker by default

    -dumpmem

    Generate shared memory dump

    -lsof

    Run Isof only - list Notes open files

    -nolsof

    Don''t run lsof by default

    -user <user_id>

