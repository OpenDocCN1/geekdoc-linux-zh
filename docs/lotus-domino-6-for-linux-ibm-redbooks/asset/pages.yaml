- img_proc: true
  md: '# NSF Buffer Pool size


    Domino normally manages the NSF Buffer Pool and sets the value to approximately
    1/4 to 1/3 of the available physical memory. On servers with more than 2 GB of
    memory, this can squeeze the mmap region where the memory is allocated. Therefore,
    a Domino 6 server running on Linux should not have an NSF_Buffer_Pool_Size_MB
    setting of greater than 256. This setting has a noticeable effect on opening large
    views, however, so you should not set it too low. Add the line NSF_Buffer_Pool_Size_MB=
    to your notes.ini with a value of 256 MB or 1/4 of your physical memory, whichever
    is lower.


    # 4.3 Troubleshooting


    This section covers basic network troubleshooting and the Notes Diagnostic tool,
    NSD.


    # 4.3.1 Basic network troubleshooting


    Linux network troubleshooting is very similar to Windows troubleshooting. The
    main differences are the name of the trace route tool - in Linux it is `traceroute`
    and the Windows version is `tracer` – and the syntax of the `route` command.


    The first things to check if you are unable to access the server are:


    +   - Can you ping the server/client by name?


    +   - Can you ping the server/client by IP address?


    +   - Can you ping the default gateway from both client and the server?


    If you can ping the server/client by IP address but not by name there is a problem
    with your name resolution. Linux does not support WINS so you have to use DNS
    or host files.


    If you can''t ping the server/client, they can ping any other network devices
    like the default gateway. If they are unable to ping anything the network administrator
    to check the network devices.


    If some clients can ping the server but others can''t, check the mask of the clients/server
    with the `ifconfig` command on Linux or with `ipconfig` or `winipcfg` on Windows
    machines. To make sure that all the machines have the correct default gateway
    use `route -v` on Linux or `route print` on Windows machines (see Figure 4-26).


    > Note: If there is a firewall between your server and client, the ping and traceroute
    commands may be blocked, which makes troubleshooting harder.'
