  md: '# Create the DB2 sample database


    The DB2 installation can be tested by creating and connecting to the sample database
    supplied with the product specifically for this purpose. This can be done with
    following commands:


    ```

    su - db2inst1

    db2sample

    db2 list db directory

    ```


    The results of the list db command should resemble Figure 5-66.


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_322_0.png)


    Figure 5-66 DB2 v7.2 - DB2 db directory


    To ensure access to the database, issue the following commands to test connectivity.
    If you do not receive error messages, you have successfully created the sample
    database.


    ```

    db2 connect to sample

    db2 disconnect current

    ```


    # Starting and stopping the DB2 server


    After DB2 server installation, the DB2 server should be running and configured
    to restart at boot time. You can use the following commands to manually stop and
    start the DB2 server. If the server is already running when you enter a start
    command, the system will display a message indicating the DB2 server is running.


    ```

    su - db2inst1 "-c db2stop"

    su -db2as "-c db2stop"

    su -db2as "-c db2start"

    su -db2inst1 "-c db2start"

    ```'
