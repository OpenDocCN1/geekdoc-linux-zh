- img_proc: true
  md: '# Performance, scalability, and troubleshooting


    This chapter discusses the performance and scalability of the Linux operating
    system and Domino 6. We describe how to measure CPU and memory with standard monitoring
    tools for Linux, such as top, vmstat, and ksysguard, as well as monitoring disk
    arrays. Next, we discuss altering the maximum number of threads available in Linux
    in order to provide high-end scalability. Finally, we present options for increasing
    the performance of your Domino 6 server.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# 4.1 Linux performance and scalability


    Linux is a powerful operating system that can be molded to fit your needs. In
    this section we discuss hard disk drive arrays, CPU and memory monitoring, then
    we give detailed instructions for significantly increasing the scalability of
    Linux supporting Domino.


    # 4.1.1 Linux performance


    There are a number of ways to tweak your server to gain more scalability and more
    flexibility.


    # IDE versus SCSI


    The IDE bus is designed for normal PCs because it is simple to use, easy to implement
    in the PC, SCSI bus is designed for professional use because it is faster than
    IDE, and you can attach more devices on the bus, such as hard disks, CD-ROMs,
    and so forth.


    > Note: We recommend you use SCSI hard disks for your servers.


    # Buses


    Generally, your server will have two buses. You should split your heavily utilized
    cards, such as a primary network card and a RAID controller, so that they are
    installed in slots on different buses. In a typical server, for example, you will
    see the buses designated as:


    +   * Bus A, Bus B, and Bus C

    * PCI and PCI/ISA

    * Bus 0 and Bus 1


    If you have a server with a 66 MHz (64 bit) bus and a 33 MHz (32 bit) bus, you
    will have better performance splitting your cards, even though one bus is slower.
    With significant I/O, the cards will benefit from working separately. If you put
    all on the 66 MHz (64 bit) bus, they will compete and so necessarily diminish
    the overall throughput of that bus.


    # Distributing I/O


    If you are running a program that is disk I/O intensive, such as a Domino server,
    we recommend that you use separate, physical disks for the OS, Domino data directory,
    and the Domino 6 transaction logs. If possible, use separate buses for disks as
    well. Example 4-1 shows a possible configuration for distributing I/O using three
    separate disks (sda, sdb, and sdc). The numbers on the end of the'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'disks (sda1, sda2) represent the partitions of disk. For example, sda2 is the
    second partition of the first SCSI disk.


    Example 4-1 Distributing I/O


    / -> /dev/sda1

    swap -> /dev/sda2

    translogs -> /dev/sdb1

    local/notes -> /dev/sdc1


    # RAID configurations


    The main advantage of RAID is the redundancy. If one disk fails (for any reason),
    you will not lose your data. Another advantage is that you can stripe your data
    over multiple disks and gain speed for your applications. Striping will also balance
    the data across the disks. There are multiple RAID configurations:


    +   RAID 0 stripes your data over multiple disks; you gain speed, but you do not
    have redundancy.


    +   RAID 1 is mirrored because it writes the same data on two disks or more (Enhanced
    RAID1 or RAID+1). You have redundancy and the best reading speed because the system
    reads the data from the less busy disk.


    +   RAID 5 stripes the disks and writes the parity at the same time. This is the
    most used RAID configuration because it is a suitable compromise between speed
    and redundancy, with only a small cost in performance.


    There are two types of RAID: software and hardware.


    # Software RAID


    Software RAID is done on the OS level. It is a layer between the physical disks
    and applications. Since software RAID uses the main processor and the main memory
    for calculation of the parity, these resources are not available to Domino.


    > Note: For more information about how to build a software RAID in Linux, read
    the "Software RAID" HOW-TO document. You can find this HOW-TO document, as well
    as numerous others, on the Linux Documentation Project Web site:


    ```

    http://tldp.org/docs.html

    ```


    # Hardware RAID


    Hardware RAID is provided by a SCSI or IDE controller. The disks are connected
    directly to the RAID controller. This is transparent even to the OS. The OS "sees"
    only one drive. Before you install the OS, you need to create the RAID array.'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'hardware RAID controller has its own processor and RAM for parity calculation,

    thus providing much better performance.


    # Hardware RAID versus software RAID


    Table 4-1 identifies some differences between hardware and software RAID.


    Table 4-1 Hardware versus Software RAID


    | Description | RAID SW | RAID HW |

    | Use system CPU and memory? | yes | no |

    | Transparent to the OS? | no | yes |

    | Transparent to an application? | yes | yes |

    | Can use IDE and SCSI hard disks within the same area? | yes | no |

    | Is it OS independent? | no | yes* |

    | Can use disk on different buses? | yes | no |

    | Can use fraction of the disks? | yes | yes |


    > * Only if you have the drivers for the OS


    See more discussion about RAID and recommendations for your Domino Linux server
    in "Transaction logging" on page 229.


    # Logical Volume Manager


    The Logical Volume Manager (LVM) is a new feature in Linux. It is a layer between
    the physical hard disk, or RAID controller, and the application. By using the
    LVM you gain:


    +   - Flexibility - you can modify the partition on the fly without unmounting
    the partition

    - Speed - by striping the logical volume

    - Redundancy - by mirroring the logical volume


    The structure of LVM is shown in Figure 4-1.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_212_0.png)


    **Figure 4-1** LVM structure


    **Note:** For more information about LVM and how to install it on Linux, read
    the LVM HOW-TO. You can find this HOW-TO document, as well as numerous others,
    on The Linux Documentation Project Web site at:

    http://tldp.org/docs.html


    # CPU utilization


    You can monitor the CPU utilization with the **top** tool from the command line;
    if you prefer a graphical tool use KDE System Guard described on page 202. It
    is very useful if you have more than one processor. The results of the **top**
    command are shown in Figure 4-2 on page 200.


