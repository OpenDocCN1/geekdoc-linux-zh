  md: 'That''s it! You have successfully used a Domino application to access employee
    data in a DB2 database. This process can easily be modified to work with production
    data in a production application.


    # # 5.4 Accessing external data from Domino: MySQL example


    You can gain a number of benefits when a relational database management system
    (RDBMS) and Domino are combined. This effectively allows you to bypass the constraints
    of the flat database architecture that Domino uses natively. A Domino database
    can now be mostly used for configuration, design, and security issues, while leaving
    storage issues to the RDBMS. Also, an RDBMS housed on a Linux server takes advantage
    of the performance and scalability that these technologies are well known for.
    Organizations utilizing a separate database now have more control over their architecture
    and system performance of Domino mail and applications as well. For example, you
    can house the RDBMS on a separate server that can focus on managing data while
    another machine can work on security, management, and presentation.


    MySQL represents a solid backend when combined with Domino and Linux, leverages
    the inherent and complementary strengths of UNIX and RDBMS systems. And since
    MySQL is available under the GNU General Public License, it is available for anybody
    to use and download.


    Noted for its speed and reliability, MySQL has been accepted as a viable solution
    for a broad range of needs. MySQL is billed as "the world''s most popular source
    database." All these factors add up to MySQL being a low cost, powerful, and effective
    counterpart to the Notes/Domino system.


    This section provides instructions for setting up MySQL to work as the Domino
    backend. It demonstrates the simplicity of integrating an RDBMS. A high-level
    view of the steps involved includes:


    +   1. Determining the environment in which you want to work. This requires some
    choices about what products and versions to use.


    +   2. Installing MySQL.


    +   3. Basic tuning.


    +   4. Setup and configuration of MySQL.


    +   5. Setup and configuration of the Notes/Domino Application.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 5.4.1 Description of the environment


    The recommended Domino server configuration is to use a dedicated server machine
    for the Domino server. However, in our lab environment, we implemented a system
    with Domino and MySQL on the same machine.


    # Linux


    In our example, we used RedHat 7.2 with kernel 2.4-7-6. It is highly recommended
    by MySQL to use the 2.4 kernel at the minimum, as stability and performance are
    much better than with the 2.2 kernel.


    # Domino


    As with the DB2 example, we assume that you have installed Domino 6 and chosen
    DECS to be installed as an additional service during setup.


    # MySQL


    For the latest information about MySQL and to download the latest version, check
    the MySQL Web site at:


    ```

    http://www.mysql.com

    ```


    There are several choices that you will need to make when getting started with
    MySQL:


    +   1. Which MySQL version do you want to use? The MySQL AB Company recommends
    going with the latest stable release since it incorporates the best balance between
    features and stability. As of this writing 3.23 is the current recommended version
    and 4.0 is released in a beta version. This discussion is based on 3.23, which
    is the version we installed in the lab.

    2. The second choice you need to address is which MySQL product is best suited
    to your needs. MySQL 3.23 offers 2 different "flavors":

    na. MySQL, the basic release

    b. MySQL-Max, which adds high-end features to MySQL, notably transaction support

    We chose the basic MySQL release to keep our example simple.

    MySQL currently has a beta version of release 4 available. If we had chosen to
    use the release 4 version, there would have been 4 options:

    a. MySQL 4, the basic release

    b. MySQL Classic, optimized for raw speed without transactions

    c. MySQL Pro, essentially MySQL Classic with transaction support

    nd. MySQL-Max, which offers two table handlers (InnoDB & BDB) that provide transaction
    support to MySQL'
  merge: -1
  pgno: 341
- img_proc: true
  md: '3. Next, choose the architecture of your Domino system. In some cases, it prove
    useful to house the MySQL server on a different machine. For the sake of simplicity
    both the Domino server and the MySQL server were housed on the same machine in
    our lab, so this is what our discussion is based on.


    4. The last choice to make is how you wish to install MySQL. For Linux there are
    three options:


    +   a. A source installation, which will necessitate compiling the code on your
    machine. This offers the most flexibility but carries the highest level of complexity.


    +   b. A binary installation in which all the necessary files are compiled and
    organized in a tar file.


    +   c. An rpm file, which is the simplest installation and even starts the daemon
    for you. It also happens to be the method recommended by MySQL for Linux installations.


    Because we are aiming for simplicity in this demonstration, we chose the rpm method
    of installation. This method of installation has an rpm package for each logical
    bundle of files. Here is the listing from the MySQL manual:


    +   - MySQL-VERSION.i386.rpm

    The MySQL server.


    +   - MySQL-client-VERSION.i386.rpm

    The standard MySQL client programs.


    +   - MySQL-bench-VERSION.i386.rpm

    Tests and benchmarks. Requires Perl and msql-mysql-module rpms.


    +   - MySQL-devel-VERSION.i386.rpm

    Libraries and include files needed if you want to compile other MySQL clients,
    such as the Perl modules.


    +   - MySQL-VERSION.src.rpm

    The source code for all of the previous packages.


    We want to install the server and the client.


    # MyODBC/unixODBC


    Domino doesn''t support MySQL directly, but it does support ODBC. You can use
    MyODBC to provide you with a driver. The current stable version of MyODBC is 2.50;
    it can be downloaded from:


    ```

    http://www.mysql.com

    ```


    MyODBC requires the client shared libraries, so you need to install this as a
    prerequisite to MyODBC. This comes as the package MySQL-shared-VERSION.i386.rpm
    or MySQL-devel-VERSION.i386.rpm.'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'Finally, you need an ODBC manager to manage access to the data sources on Linux.
    The unixODBC package follows the unixODBC-VERSION.i386.rpm naming scheme. with
    most Linux distributions, or it can be downloaded from:


    ```

    http://www.unixodbc.org

    ```


    To recap, this for this section are:


    +   - MySQL-VERSION.i386.rpmAvailable from http://www.MySQL.com

    - MySQL-client-VERSION.i386.rpmAvailable from http://www.MySQL.com

    - MySQL-shared-VERSION.i386.rpmAvailable from http://www.MySQL.com

    - MyMySQL-VERSION.i386.rpmAvailable from http://www.MySQL.com with your distribution
    of Linux or from unixODBC-VERSION.i386Available http://www.unixodbc.org


    # 5.4.2 Installing MySQL


    Just as we did with the Domino install, all installations must be as the root
    user. Linux does not allow the root user to login from another machine. To install
    properly, you have to login as another user and switch to the root user using
    the command su -


    # Server and client


    Installation is as running rpm -i on the server and client packages.


    ```

    [root@dnyp-243-89-153 notes]# rpm -iv mysql-client-2.23.52-1.i386.rpm

    MySQL-2.23.52-1.i386.rpm MySQL-Max-2.23.52-1.i386.rpm

    [root@dnyp-243-89-153 notes]# rpm -i MySQL-2.23.52-1.i386.rpm MySQL-client-3.23

    -1.i386

    Installing all packages prepared

    020910 00:11:03 /usr/bin/mysqld Shutdown Complete

    ```


    REMEMBER TO SET THE PASSWORD FOR THE MYSQL ROOT USER !

    This is done:

    /usr/bin/mysqld -u root password ''new-password''

    /usr/bin/mysqld -u root -h dnyp-243-89-153 ''new-password''

    See the manual for instructions.


    NOTE: If you are upgrading from MySQL < 3.22.10 you should run the mysql_upgrade_tables.
    Otherwise you will not be able to use the NEW GRANT command.


    Please report any problems with the /usr/bin/mysqld script!

    The latest information about MySQL is available on the web at

    http://www.mysql.com

    Support MySQL by buying support/licenses at https://order.mysql.com


    Starting mysql daemon with databases from /var/lib/mysql

    [root@dnyp-243-89-153 notes]# service


    Figure 5-87 Telnet session: Installing MySQL server and client'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# MyODBC/unixODBC


    Installation of the MySQL shared libraries, MyODBC, and unixODBC is much the same.
    In this example, we demonstrate using the form rpm -ivh. The difference is that
    the packages are installed as before, but now we receive verbose output in case
    a problem occurs. Hashing will also occur so we can see the progress of the install.


    Notice that the MySQL shared libraries must be installed before MyODBC.


    ```

    [root@unixlab03 notes]# rpm -ivh MySQL-shared-3.23.52-1.1386.rpm

    Preparing:

    ################################################ [100%]

    [root@unixlab03 notes]# rpm -ivh MySQL-shared

    ################################################ [100%]

    Preparing:

    ################################################ [100%]

    MyODBC

    ################ [100%]

    [root@unixlab03 notes]# rpm -ivh unixODBC

    ################################################ [100%]

    Preparing:

    ################################################ [100%]

    unixODBC

    ################ [100%]

    [root@unixlab03 notes]#

    ```


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_344_0.png)


    Finally, to connect to work, you need to make sure the ODBC shared library (libodbc.so.1.x)
    is available to Domino. Domino will actually look for this library under the name
    libodbc.so. Therefore, you need to make a symbolic link named libodbc.so in the
    Domino binaries directory that has /usr/lib/libodbc.so.1.x file as the target.
    The command for this is:


    ```

    ln -s /usr/lib/libodbc.so.1.x /opt/lotus/notes/latest/linux/libodbc.so

    ```


    # 5.4 Basic tuning


    Basic performance considerations require that we do some basic tuning.


    In /etc/sysctl.conf, we make sure the following values are either added or already
    set to at least the amounts:


    ```

    fs.file-max=65536

    fs.super-max=1024

    ```


    In Chapter 4, "Performance, scalability, and troubleshooting" on page 195 we recommended
    setting the fs.file-max parameter in the /etc/sysctl.conf to at least 49152. Here
    we are just increasing that parameter to fall in line with MySQL recommendations.


    Make sure the following lines are included in /etc/my.conf. Each entry in brackets
    represents a section and the parameter setting afterwards belongs to that section.
    It may be necessary to create this file yourself.'
  merge: -1
  pgno: 344
- img_proc: true
