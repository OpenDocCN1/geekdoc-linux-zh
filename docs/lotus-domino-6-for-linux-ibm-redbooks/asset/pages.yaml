    # 3.2.7 System logs


    The Linux log system is both flexible and powerful, and in many situations, the
    log information will be very useful.


    Logs can be generated by the system or by applications. Linux keeps logs in /var/log
    unless the administrator changes the path. The program (daemon) responsible for
    generating the logs is **syslog**: log entries are caused by events.


    Almost every application can send information (events) to the syslogd. syslog
    daemon can be set to start at system boot or not, but we recommend you set syslog
    to start when the system boots (this is the default), as shown in Figure 3-19
    on page 168.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_181_0.png)


    Press <F1> for more information on a service.


    Figure 3-19 Red Hat system services


    Figure 3-20 shows the syslogd configuration file /etc/syslog.conf.'
  merge: -1
