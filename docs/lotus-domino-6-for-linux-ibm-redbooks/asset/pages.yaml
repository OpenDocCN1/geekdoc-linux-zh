  md: "# Verify the DB2 service name\n\nLog as root and view the /etc/services file.\
    \ This can be accomplished by either navigating to the /etc directory and issuing\
    \ more services or from the root login prompt issuing the following command:\n\
    \n```\n /etc/services\n```\n\nLocate the service name in the first column that\
    \ corresponds to the port numbers used by DB2. Specifically, the lower port (50000)\
    \ represents the service name. These recent additions to the services file should\
    \ be located near the bottom and look like this:\n\n```\ndb2cd2inst 50000/tcp\
    \ #Connection port for DB2 instance db2inst1\ndb2db2inst 50001/tcp #Connection\
    \ port for DB2 instance db2inst1\n```\n\nRecord this service name (db2cd2inst)\
    \ for use later.\n\n# Verify the database manager configuration\n\nCheck the service\
    \ name recorded in the database manager configuration by performing the following\
    \ commands:\n\n```\nsu - db2inst1\ndb2 get dbm cfg | grep SVENCAME\n```\n\nThe\
    \ service name value should match the service name recorded in the /etc/services\
    \ file noted previously. The results of the grep command should resemble Figure\
    \ 5-65.\n\n![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_321_0.png)\n\nFigure 5-65\
    \ DB2 v7.2 - DB2 Service Name\n\nIf the service name values do not match, issue\
    \ the following commands to update the database manager configuration where svencame\
    \ represent the value found in the /etc/services file.\n\n```\ndb2 update dbm\
    \ cfg using svencame db2cd\ndb2 stop\ndb2start\n```"
  merge: -1
  pgno: 321
