    System information contains the hard and soft limits for the Notes user and the
    machine.


    Hard limits are absolute limits set server-side, which users cannot override,
    while soft limits pertain only to users in whose environment limits are set.


    For instance, if the hard limit is set to 2 MB and the soft limit is set to 10
    MB for the Domino user, the Domino user will not be able to generate a core beyond
    2 MB in size.


    Limits can be set in the file /etc/security/limits.conf.


