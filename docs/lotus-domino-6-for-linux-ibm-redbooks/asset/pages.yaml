  md: '# Password settings


    In this dialog, change various password settings. These are mainly stored in the
    "etc/login.defs" file.


    Checking new passwords

    It is wise to choose a password that cannot be found in a dictionary or is not
    a name or other simple, common word. By checking the box, enforce password checking
    in regard to these rules.


    Plausibility test for passwords

    Sometimes it is required that passwords constructed using a mixture of characters.
    This makes thelist of passwords very difficult. Check this box to enable additional
    checks.


    Password length

    Set the minimum and maximum password length.


    Days before password warning

    Set the minimum and maximum


    ![](img/f4a88d4bf9ae965be31d8ef5c6d98f93_151_0.png)


    Figure-3-2 Password settings


    There are a lot of opinions regarding minimum password length; the consensus seems
    to be that the password length should be at least six characters but seven and
    eight are also recommended. The root password should certainly be eight or more
    characters in length. Table 3-1 on page 139 shows different password lengths and
    the respective possibilities if no restrictions are in place. As we can see, the
    use of just lowercase letters in a password seriously reduces the number of possible
    combinations.


    In addition to minimum length, you should also change the maximum length to a
    much higher number than 8; as shown for 64 in Figure 3-2.'
  merge: -1
