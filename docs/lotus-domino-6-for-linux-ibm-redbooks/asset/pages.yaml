    \ = 8192\n```\n\nIf you want to use a default configuration, you can go to the\
    \ /usr/share/mysql directory and choose one of the configurations there.\nThe\
    \ naming scheme of these samples is my-SIZE.cnf (that is, my-small.cnf).\nSimply\
    \ copy them to the /etc directory using the command:\n\n```\ncp /usr/share/mysql/my-SIZE.cnf\
    \ /etc/my.cnf\n```\n\nAdd the following line to if you want all tables to be automatically\
