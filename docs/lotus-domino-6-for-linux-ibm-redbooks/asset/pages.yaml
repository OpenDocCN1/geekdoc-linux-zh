    #  4.2.2 Domino scalability


    Domino 6 has been designed, like its predecessors, to run on a variety of platforms
    and to take full advantage of any platform''s capabilities. The Domino 6 Linux
    code has been specifically written to run well on Linux.


    So what can you do to increase Domino 6 scalability?


    Simple. Domino 6 is capable of providing a large number of services, everything
    from mail routing to applications to Web sites. In order to allow your server
    to scale, identify all unnecessary tasks and remove them.


    The first place to start is the servertasks= line in the notes.ini. You can access
    the file directly at the OS level or by the NOTES.INI file option on the Configuration
    tab under Server in the webadmin.ns database.


    The basic tasks are Replica, Router, Update, Stats, AMgr, and Admin. Other tasks,
    such as HTTP, should only be enabled if you intend to use them. For example, if
    your server does not provide Calendaring and Scheduling, you can remove Calcconn
    and Sched from the servertasks= line.


    # Network encryption and compression


    Network encryption is another area to consider. Domino offers port encryption
    to ensure that all data is securely transferred over the network, and it is enabled
    necessarily by checking the encryption option for the port. However, encryption
    necessarily causes overhead and so results in slower performance. Typically, the
    security of port encryption results in a performance trade-off of roughly 5 to
    10 percent, as long as overall CPU utilization is not excessively high.


    Network compression compresses the data before it is transmitted across the network.
    Network compression results in an average of 50 percent less volume of data being
    transmitted across the network, but it puts extra load on the client and server
    to uncompress/compress the data. The best time to use compression is when data
    is being transmitted across a Wide Area Network (WAN).


    Important: Encryption and compression can be used together: first the data is
    compressed and then it is encrypted. Using both options puts even more load on
    the CPUs at both ends of the connection.'
