    cron.*                               /var/log/cron

    # Everybody gets emergency messages:

    * every*

    # Save news errors of level crit and hide in a special file:

    hnucp.news*crit                               /var/log/spooler

    # Save boot messages also to boot log

    local*                               /var/log/boot.log


