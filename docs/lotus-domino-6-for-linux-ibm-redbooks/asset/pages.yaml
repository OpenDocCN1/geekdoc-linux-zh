  md: 'Issuing nsd -kill will kill all Notes processes and clean up IPC resources

    related to those processes.


    Any time the server is not able to shut down with a graceful quit from the

    console or a server -q from the command line, nsd -kill should be run to

    ensure that the environment is clean for a server restart.


    The command nsd -info will skip attaching to the processes with a debugger

    and obtaining a trace. This is useful when you are only gathering system

    information and do not need any process-level information for diagnostics.


    Lotus Support will often ask for the results from running nsd -info so they can
    do

    an initial assessment of the server environment.


    Issuing nsd -nomemcheck will skip running memcheck against the application.

    Memcheck is a utility, developed by Iris, which obtains information on the current

    state of the Domino memory pools. Memcheck information may not be needed,

    and by using the -nomemcheck option you you can reduce the total running time
