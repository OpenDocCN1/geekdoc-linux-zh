- img_proc: true
  md: '# Backup and virus protection


    In this chapter we discuss different ways of protecting your Domino server in
    case of hardware failure, or if your server is attacked by a virus.


    You''ll get an overview of:


    +   - Antivirus software for the Linux operating system level and for the Domino
    server.

    - Operating system backup tools. Linux has its own backup tools that are easy
    to use and work like those on most other UNIX systems.

    - Operating system backup tools from third-party vendors, which are more complex,
    have a client-server architecture, and are compatible with other platforms.

    - Domino backup tools from different vendors. While Domino server does not have
    a built-in backup tool, there are some backup tools available from third-party
    vendors.'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# 7.1 Antivirus software


    Why do you need antivirus software? Because it protects your data from viruses,
    scans e-mail for viruses, tells you you have a virus, and rids your system of
    viruses.


    Antivirus software works on Linux like it does on any other OS. It is uploaded
    into memory and it scans open files, incoming data, and e-mail for different types
    of viruses.


    There are two types of antivirus software:


    +   * Operating system level antivirus software, which scans the files on the
    computer for known viruses.

    * Application level antivirus software, which is written for a specific application,
    such as the Domino server.


    An operating system level antivirus product can be scheduled to run daily or weekly
    at certain times (such as at midnight, at night, at the end of the work hours,
    or the end of the week). We recommend that you schedule the antivirus software
    to run outside work hours because it is a "heavy" task, demanding a lot of CPU
    power, memory, and disk access.


    # 7.1.1 Operating system level antivirus software


    Antivirus software for Linux is a program that scans the files in the computer
    for known viruses. It may also scan the memory or incoming data. When it finds
    a virus, it shows a message and acts on the virus (for example, it can erase the
    virus or put the virus in quarantine).


    Following is a list of some of the companies that offer operating system level
    antivirus software for Linux. For more information, visit their Web pages:


    +   * Norton Antivirus, by Symantec http://www.symantec.com

    * ServerProtect for Linux, by Trend Micro http://www.trendmicro.com

    * eTrust InoculateIT for Linux and eTrust Antivirus, by CA http://www.ca.com.au

    * RAV AntiVirus Desktop, by GeCAD http://www.rav.ro

    * Kaspersky Anti-Virus for Linux Servers http://www.kaspersky.com'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# ## 7.1.2 Application level antivirus solutions for Domino Server


    Antivirus software for the Domino server works at the application level, in this
    case at the Domino level. It can scan for viruses in Domino databases and in files
    attached to e-mail messages.


    At the time of writing there are a few companies that offer antivirus products
    for Domino for Linux. Following is a list of some of the companies that offer
    this type of product. For more information, visit their Web sites:


    +   - Kaspersky Anti-Virus Business Optimal for Lotus Notes/Domino, by Kaspersky.
    This was the first product of its kind released.

    http://www.kaspersky.com


    +   - ScanMail for Lotus Notes, from Trend Micro, now includes Linux support.
    This complements the offering Trend Micro already has for Windows, AIX, Solaris,
    OS400, and z/OS. http://www.trendmicro.com


    +   - Norton Antivirus for Lotus Notes/Domino, by Symantec.

    http://www.symantec.com


    In the following sections, we describe these solutions in more detail.


    # ### Kaspersky Anti-Virus Business Optimal for Lotus Notes/Domino


    This product is a centralized anti-virus system for Lotus Notes/Domino for Linux.
    The program integrates itself into the mail server as a scalable module and centrally
    checks for viruses in the incoming and outgoing e-mail traffic in real-time.


    Software requirements are as follows:


    +   - Linux Red Hat 6.0 (or higher)


    +   - Domino R52.02 (or higher) for Linux


    # ### ScanMail for Lotus Notes/Domino


    Trend Micro ScanMail for Lotus Notes Linux is designed to provide a single, comprehensive
    antivirus strategy for all current Lotus Domino messaging and collaboration environments,
    with limited performance impact and management cost. In addition, it offers Domino
    administrators one of the easiest antivirus products on the market to use. ScanMail
    for Lotus Notes Linux provides an intelligent antivirus and content security strategy
    to meet the increasing market demand for a protected corporate messaging environment.'
  merge: -1
  pgno: 406
- img_proc: true
  md: 'Some of the features of ScanMail for Lotus Notes 2.52 Linux are:


    +   - Virus Reduction


    Uses multithreaded scan engine architecture to provide scanning with minimal server
    overhead across a wide range of Lotus Notes platforms.


    Provides the capability to scan e-mail, databases, and replication activity in
    real time without sacrificing server performance.


    Sends a customized alert message to the administrator upon detection of a virus,
    sender, and receiver. Infected files can be automatically cleaned and sent to
    recipients, with no disruption in message delivery.


    +   - Database and Replication Scanning


    Monitors new or modified documents within Lotus Notes databases, and scans files
    prior to closing.


    Administrators can specify the databases to be scanned from either the Lotus Notes
    console or the ScanMail for Lotus Notes interface. All modified data can be scanned
    during replication.


    Cleans existing database infections using on-demand and scheduled scanning. Separate
    settings are available for scanning options and notifications.


    +   - High-performance Scanning


    Provides diskless scanning to maximize scanning efficiency and minimize overhead
    impact on Lotus Notes servers.


    Cleans existing database infections using on-demand scanning.


    Provides broad platform support and scalability to meet the virus protection needs
    of growing enterprises.


    Using Trend Micro SmartScan™ technology, administrators can define trusted servers
    within their Notes environment, allowing servers to skip redundant scanning and
    improve overall scanning efficiency.


    Incremental scanning allows administrators to scan only documents that have been
    modified since the previous scan.


    Assists secure message delivery with policy-based e-mail filtering.


    +   - Flexible, Native Configuration and Management


    Provides access to the ScanMail intuitive Lotus Notes interface from any Lotus
    Notes workstation (including full integration in the Lotus Domino administration
    Client) or Web browser.'
  merge: -1
  pgno: 407
- img_proc: true
  md: '+   Support of Lotus Domino Enhancements


    ScanMail for Lotus Notes supports the Lotus Domino cluster and partition technology
    on all platforms, including the supported Linux distributions.

    ScanMail for Lotus Notes supports the Lotus Domino-based unified messaging solutions,
    such as Lotus Quickplace and Lotus Sametime (if available from Lotus on the required
    OS).


    # Installing Trend Micro ScanMail for Lotus Notes/Domino


    In this section we describe how to install Trend Micro ScanMail for Lotus Domino.


    The system requirements are:


    +   Operating systems:

    - RedHat versions 6.2 or higher

    - SuSE versions 6.4 or higher

    Lotus Domino:

    - Domino Server versions 5.0.3 or higher


    +   40 MB available free disk space for program files, and 100 MB free disk space
    for swap files


    > Note: We recommend that you consult the readme file for the latest information
    before you install. This file is included in the package with the program.


    # Pre-installation tasks


    No special setup is required for the Domino installation or OS before you install
    Trend Micro ScanMail for Lotus Domino. However, during the installation you may
    be asked for information about your existing installation, so, for your convenience,
    ensure you have this available before you start.


    You should know the following:


    +   - What UNIX account you use to run the Domino server

    - What data directory you want to install on (or data directories in the case
    of a partitioned server)

    - If you are not installing an evaluation license, you should have the ScanMail
    serial number available.

    - Decide where you want your temporary files to reside


    # Installation


    +   1. Stop the Domino server before installing ScanMail.'
  merge: -1
  pgno: 408
- img_proc: true
  md: '+   2. You must be logged in to the Linux server as root to install ScanMail.
    (For partitioned servers, install a copy of ScanMail on each partition.)


    +   3. Depending on whether you get the program package from a CD or download
