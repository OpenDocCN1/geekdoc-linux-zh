    # ## 4.3.2 Domino NSD tool


    Notes System Diagnostic (NSD) is a diagnostic script, developed by Iris, that
    gathers diagnostic information which can be used to troubleshoot problems and
    verify that the server is correctly configured.


    # Running NSD


    You must be in the Domino data directory to run NSD. You can run the NSD tools
    as either the notes account or as root. For most problems you should run NSD as
    the notes account.


