  md: '# Use Novell iFolder 3.x Web Access


    Novell iFolder 3.x Web Access provides an interface that gives users remote access
    through a web browser to iFolders on the enterprise server.


    To use Novell iFolder 3.x Web Access from a supported browser, you need to know
    how to do the following:


    +   - Log In and Log Out

    - Browse iFolders

    - Manage Folders and Files in an iFolder


    For complete details on using Web Access, see “Using Novell iFolder 3.x Web Access”
    on page 59 in the Novell iFolder User Guide for Novell iFolder 3.x (user.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on 3077 Course CD.


    # Log In and Log Out


    You can log in to Novell iFolder 3.x Web Access to gain access to folders and
    files in any of the iFolders available to you in your Novell iFolder enterprise
    server account.


    This includes iFolders that you participate in but have not set up a local computer.
    (You cannot access 2.1x iFolders with Web Access.)


    The enterprise server specified in the URL authenticates the username against
    the server’s LDAP directory services.


    You can also specify which of the supported localized interfaces to use. This
    is typically the Language Code of the iFolder enterprise server. Make sure to
    configure your browser’s Languages setting to support the desired language.'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'To log in to Web Access, do the following:


    +   1. From a supported Web browser, enter the URL of the iFolder server where
    your iFolders are stored:


    **http://servername.example.com**


    Replace *servername.example.com* with the DNS name or IP address (such as da1.com
    or 10.200.200.1).


    +   2. From the left navigator panel of the OES Welcome page, open the iFolder
    3.x Welcome page by selecting **iFolder 3.x**.


    +   3. In the iFolder Links on the right, open the login dialog by selecting the
    **Web Access** link.


    +   4. From the iFolder 3.x Web Access Login dialog, enter your account **username**
    and **password**.


    +   5. From the Languages drop-down list, select the **language** you want to
    use to access your files.


    +   6. Select **OK**.


    This gives you access only to those iFolders in the same domain as the server
    you specified in the URL.


    To log in to a different server, enter its server''s URL in your web browser,
    and then log in.


    7. When you finish with Web Access, log out by selecting **Logout** (upper right
    header area); then close your browser.


    If you do not log out, your session remains open until your session times out,
    which can be a security risk.


    If the system connection times out when you are working in your iFolders, Web
    Access returns you to the Login dialog. You can log in again to resume working
    without closing your browser.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Browse iFolders


    The iFolders page lists all iFolders available to you in the current domain. Available
    iFolders include those you own and those others have made available to you.


    You can access iFolders through Web Access even if you have not set up the iFolder
    on a local computer. The Owner column identifies the name of the person who owns
    the iFolder to help you locate the iFolder you seek.


    Select the iFolder''s name to view a list of its folders and files, upload and
    download files, create folders, and delete folders and files.


    # Manage Folders and Files in an iFolder


    Within an iFolder, you can do the following:


    +   **View a list of folders and files.** The iFolder page lists folders and files
    alphabetically. Scroll to the directory or file of interest.


    +   **Navigate directories.** Select the name of the folder to open the folder
    and view a list of its contents. To return to a higher-level directory, select
    the Up iFolder icon in the task bar.


    +   **Download a file.** Select the name of the file you want to download; then
    select one of the following:


    +   **Open.** View the file''s contents by selecting Open.


    You must have a compatible application on your computer to open the file.


    The file is downloaded to a temporary folder, such as Temporary Internet Files
    in Windows, where Internet files are saved and then opened with your application.


    If you plan to work in the file, it is best to save the file locally, modify the
    file, and then upload it.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'Save. Save the file locally or to a mapped drive by selecting Save.


    Navigate to the location where you want to place the file, and then select Save.
    The file is downloaded to your computer.


    Options on the page might differ slightly, depending on the web browser you use.


    iFolder 3.x Web Access does not support the uploading and downloading of 10 MB
    or larger files.


    +   Create a new folder. In the New Folder field, specify the name of the new
    folder, and then select Create.


    Folder names are case sensitive. When the page refreshes, the folder appears alphabetically
    in the list.


    +   Delete folders or files. Select the check box next to one more folders or
    files you want to delete; then select Delete and confirm the deletion.


    +   Upload a file. In the Upload File field, select Browse, locate a local folder
    you want to upload, and then select Open > Upload.


    When the page refreshes, the file appears alphabetically in the list.


    The maximum file size for the upload limit is configured by the administrator.
    By default, the limit is set to 10 MB; the limit for your server might differ.


    > iFolder 3.x Web Access does not support the uploading and downloading of 10
    MB or larger files.'
  merge: -1
