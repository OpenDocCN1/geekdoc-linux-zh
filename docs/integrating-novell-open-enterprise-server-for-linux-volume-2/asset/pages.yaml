    # Security Considerations


    For information about planning security for your iFolder 3.x system, see the Novell
    iFolder 3.x Security Administrator Guide.


    > You can access the guide from http://www.novell.com/documentation/oes/from the
    OES_Docs directory on the 3077 Course CD.


    # Server Workload Considerations


    The iFolder 3.x enterprise server supports a complex usage model in which each
    user can own multiple iFolders and participate in iFolders owned by other users.


    Instead of a single user working from different workstations at different times,
    multiple users can be concurrently modifying files and synchronizing them.'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'Whenever a user adds a new member to an iFolder, the workload the server can
    increase almost as much as if you added another user to the system.


    We recommend a maximum of 1,000 users per iFolder server, depending on the performance
    characteristics of your hardware.


    You can set user account quotas to control the maximum storage space consumed
    by a user''s iFolders on the server.


    The actual bandwidth usage for each iFolder depends on the following:


    +   * The number of members subscribed to the iFolder

    * The number of computers actively sharing the iFolder

    * How much data is stored in the iFolder

    * The actual and average size of files in the iFolder

    * The number of files in the iFolder

    * How frequently files change in the file

    * How much data actually changes

    * How frequently files are synchronized

    * The available bandwidth and throughput of network connections


    We recommend that you set up a pilot program to assess operational needs and performance
    based on your equipment and collaboration environment, and then design your system
    accordingly.


    The following is a suggested baseline configuration for an iFolder 3.x server
    with a workload similar to a typical iFolder 2.1 server.'
  merge: -1
  pgno: 94
