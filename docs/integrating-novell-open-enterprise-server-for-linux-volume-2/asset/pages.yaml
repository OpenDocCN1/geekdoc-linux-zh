  md: '# How to View or Modify Directory and File Attributes and Rights


    NetStorage gives you the ability to view or change NSS, NCP directory and file
    attributes and rights from the NetStorage home page.


    If you have created a Storage Location object using NCP, the ability to change
    file and directory attributes is limited unless you are logged in as user admin
    or equivalent. This limitation does not apply if you have created a Storage Location
    object using SSH.


    To view or modify directory or file rights from the NetStorage page:


    +   Start a supported web browser (such as Internet Explorer or Mozilla Firefox);
    then enter the URL for iManager:


    **https://server_ip_address/nps/iManager**


    where server_ip_address is the IP address or DNS name of the server running NetStorage,
    or the IP address for Apache-based services.


    Apache-based services use a port other than 80, you must also specify that port
    number with the URL.


    For example, if the IP address for NetStorage is 10.200.200.1 and the port number
    is 51080, then you would enter

    **https://10.200.200.1:51080/oneNet/NetStorage**.


    A login dialog appears.


    +   Enter an eDirectory **username** and **password**.


    NetStorage uses your Novell eDirectory username and password, so you don''t need
    to remember or use a separate username or password.


    A NetStorage home page appears.


    +   From the right pane, right-click the **directory** or **file** you want to
    view or modify attributes or rights for; then select **Properties**.'
