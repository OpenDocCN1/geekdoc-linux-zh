    associated with those objects.


    You can configure eGuide so that users can see information stored in eDirectory
    (such as telephone numbers, office locations, and job titles) for other eDirectory
    users in your organization.


    You can also configure eGuide so that users can maintain their own information
    in eDirectory. You can even let them choose the information they want others to
