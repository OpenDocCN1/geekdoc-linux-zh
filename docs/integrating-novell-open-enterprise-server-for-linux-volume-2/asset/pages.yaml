  md: '# Objective 3


    # Plan for eDirectory


    eDirectory is the heart of OES’s powerful network services and security.


    If you are installing an OES server into an existing tree, be sure you understand
    the information in “eDirectory Coexistence and Migration” on page 81 of the Novell
    OES Planning and Implementation Guide (implgde.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    If you are creating a new eDirectory tree on your network, you do some additional
    planning before you install the first server into the tree. The first server is
    important for two reasons:


    +   - You create the basic eDirectory tree structure during the first installation.

    - The first server permanently hosts the Certificate Authority (CA) for your organization.


    To ensure that your eDirectory tree meets your needs, take time to plan the following:


    +   - Structure of the eDirectory tree. A well-designed tree provides containers
    for items such as servers, users, and printers. It is also optimized for efficient
    data transfer between geographically dispersed locations.


    For more information, see “Designing Your Novell eDirectory Network” on page 67
    in the Novell eDirectory 8.7.3 Administration Guide (edit8873.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '+   **Time synchronization.** eDirectory requires that all OES servers, both
    NetWare and Linux, be time synchronized.


    +   **Partitions and replicas.** eDirectory allows the tree to be partitioned
    for scalability. Replicas (copies) of the partitions provide fault tolerance within
    the tree.


    The first three servers installed into eDirectory tree automatically receive replicas
    of the tree''s root partition. You might want to create additional partitions
    and replicas.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_307_0.png)


    For more information, see “Managing Partitions and Replas” on page 113 in the
    Novell eDirectory 8.7.3 Administration Guide (edir873.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your `3077 Course` CD.


    If you are installing OES into an existing tree (installed before NetWare 6.5),
    you must be sure to prepare the network using Deployment Manager (located on Novell
    OES NetWare Installation CD1).


    If you want to create a new eDirectory tree that will contain both NetWare and
    Linux servers, you must start the tree creation using a NetWare server first.


    If you use a Linux server to create a new tree and subsequently add a NetWare
    server to the newly created tree, you will not be able to install any client or
    server licenses.


    Any features that require either a NetWare server license or NetWare Client access
    license will be inaccessible.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_307_1.png)


    This issue will be addressed in a future release of Novell OES.'
  merge: -1
  pgno: 307
- img_proc: true
