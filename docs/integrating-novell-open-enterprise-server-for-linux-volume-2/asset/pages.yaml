  md: 'If you are using Internet Explorer, you can copy and move files and folders
    by dragging and dropping them. This functionality is not available with browsers
    other than Internet Explorer.


    Selecting the Folder View button in the browser window displays folders in another
    column and lets you expand and contract folders.


    The Text View displays only the files and folders in the current directory and
    does not let you expand or contract folders. Selecting the Name, Size, or Modified
    headings lets you sort directory and file listings in ascending or descending
    order by name, size, or date.


    You can use NetStorage to access local files and folders in a shared directory
    on the Linux server where NetStorage is installed.


    This is useful for uploading files to the Linux server. The path to the shared
    folder is /var/opt/novell/netstorage/shared.


    You cannot map drives or change login scripts from NetStorage.


    +   3. When you finish, from the top of the page, select the Logout icon; then
    close the web browser window.


    # How to Administer NetStorage from Novell iManager


    You can change your NetStorage configuration after NetStorage has been installed
    on a Linux or NetWare server (known as the Middle Tier or XTier server) by Novell
    iManager.


    NetStorage configuration information is stored in an XML file on the Linux server.
    iManager provides an easy method for changing the NetStorage configuration in
    the XML file.


    After changing any settings, you must restart the Apache Web server. To do this
    on a Linux server, from a command prompt enter rchtpd stop. Wait for a minute;
    then enter rchtpd start to restart the web server. You must also restart XTier
    by entering novell-xxsvrd restart.'
  merge: -1
