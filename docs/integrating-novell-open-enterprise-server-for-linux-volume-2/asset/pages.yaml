  md: '# Introduction


    NovellGuide lets you use the information in eDirectory to create “white pages”
    directory for your organization that users can access from their web browser.


    eGuide offers many options. To provide these options, you configure the components
    that eGuide needs, such as LDAP, search categories, languages, and the eGuide
    display.


    In this section, you learn how to access and use eGuide and perform some basic
    eGuide configuration tasks on an OES Linux server.


    For complete information about configuring Novell eGuide, see the Novell eGuide
    2.1.2 Administration Guide (eguide.pdf).


    You can access the eGuide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course D.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_229_0.png)'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Objective 1


    # Describe the Purpose and Architecture of eGuide


    To describe the purpose and architecture of eGuide, you need to know the following:


    +   - What eGuide Provides

    - eGuide System Requirements

    - How eGuide Works

    - How to Access the eGuide Client


    # What eGuide Provides


    eGuide is a browser-based solution that lets your employees search for people
    and places regardless of your LDAP data source location.


    eGuide looks like an address book. But unlike an ordinary address book, eGuide
    is platform- and application-independent. It can be accessed through a standard
    web browser by any user with rights to your web server.


    You can use eGuide to search Novell eDirectory as well as multiple LDAP data sources
    at the same time.


    For example, if your company purchases another company, you can provide a combined
    white pages view of both companies using eGuide pointing at two separate directories.


    eGuide runs on the most widely used platforms and is compatible with email, instant
    messaging, and real-time collaboration tools, such as AOL Instant Messenger or
    Microsoft NetMeeting.


    When users find the people they are looking for, eGuide lets launch the type of
    communication that fits their current needs—email, instant messaging, and even
    video conferencing.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'The following is a list of eGuide features:


    +   - Standards-based display and administration using HTML, XML, and XSL, which
    provides simple, convenient, and customizable configuration


    +   - Advanced searching on any attribute


    +   - Data handler controls that let you display information the way you prefer


    +   - Organizational charts that are automatically generated based on eDirectory
    attributes


    +   - Anonymous and User Authentication modes, including contextless login, cookies,
    and support for eDirectory password restrictions


    +   - Authenticated searching that uses access control lists in eDirectory to
    determine if a user can access particular attribute information, such as home
    phone numbers


    +   - Seamless integration with Novell iChain and Novell extNd Director


    +   - Compatibility with eDirectory or any other LDAP-enabled directory service'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# eGuide System Requirements


    The following are the minimum system requirements for setting up and using eGuide
    2.1.2:


    | Table 9-1 | System Component | Minimum Requirement |

    |---|---|--|

    | Operating System | One of the following:

    >- NetWare 6 with Support Pack 3 or later

    >- Red Hat Linux 7.3

    >- Solaris 8

    >- Windows 2000/XP (recommended) or Windows NT

    >- AIX 5L |

    | Web Server | One of the following:

    >- Internet Information Server (IIS) 4.0 or later on Windows platforms

    >- Apache HTTP server 1.3.26 or later

    For help installing Apache, visit the Apache Documentation (http://httpd.apache.org/docs-2.0/)
    web site.

    | Web Application Server | One of the following:

    >- Tomcat servlet container version 3.3a, 3.3.1, or 3.3.1a

    NOTE: Tomcat does not perform optimally on Windows NT.

    For help installing Tomcat, visit the Jakarta web site (http://jakarta.apache.org/tomcat/tomcat-4.1-doc/index.html).

    >- Sun Java 2 Standard Edition (J2SE) 1.3.1 or later

    >- IBM Java 1.3.1 for AIX |'
  merge: -1
