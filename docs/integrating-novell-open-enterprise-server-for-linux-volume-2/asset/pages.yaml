  md: '# Objective 5


    # Manage iFolder 3.x as a User


    Once you have installed iFolder 3.x and provisioned users, users can perform some
    iFolder management tasks from the iFolder client.


    The following are some of the basic tasks users can perform:


    +   - Manage iFolder Accounts and Preferences

    - Manage iFolders

    - Use Novell iFolder 3.x Web Access


    > For additional information on managing iFolder 3.x as a user, see the Novell
    iFolder User Guide for Novell iFolder 3.x (user.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # Manage iFolder Accounts and Preferences


    To manage iFolder accounts and preferences with the iFolder client, you need to
    know how to perform the following basic tasks:


    +   - Start the iFolder Client

    - Configure an iFolder Account

    - Log In to an iFolder Account

    - View and Modify iFolder Account Settings

    - Configure iFolder Preferences for the Client


    # Start the iFolder Client


    To start iFolder for Novell Linux Desktop 9, do the following:


    +   1. Log in to your computer with the user identity you want to use when you
    create iFolders.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# 2. Use one of the following methods to start iFolder:


    +   - Open a terminal window; then enter one of the following:

    /opt/novell/ifolder3/bin/ifolder

    or

    ifolder


    If you want iFolder start automatically when you log in, make sure iFolder is
    running when you log out of your GNOME session; then save the session.

    You can also open a terminal window, log in as the root user, and run /opt/gnome/bin/gnomesession-properties
    to add iFolder as a program to start up when you log in your computer.


    # 3. (Conditional) If you disabled Remember Password for your iFolder account,
    you must log in to the account to synchronize the User list, synchronize iFolders,
    and manage your iFolders.


    You do not need to start iFolder on SUSE Linux Enterprise Desktop 10; it automatically
    starts for when you log in to the desktop.


    To start iFolder for Windows 2000/XP/2003, do the following:


    +   1. Log in to the computer with the Windows user identity you want to use when
    you create iFolders.


    +   2. (Conditional) If iFolder does not start automatically on successful login,
    start iFolder by selecting Start > Programs > iFolder; then select the iFolder
    application.


    iFolder does not start automatically if you disable the “Start iFolder When Logging
    In to the Desktop” setting in iFolder Preferences.


    +   3. (Conditional) If you disabled Remember Password for your iFolder account,
    you must log in to the account to synchronize the User list, synchronize iFolders,
    and manage your iFolders.'
