- img_proc: true
  md: '# Introduction


    NetStorage makes network files available anywhere, any time, from an Internet
    web browser.


    While iFolder provides personal file storage, synchronization, and access to a
    specific Simias data collection on the iFolder server, NetStorage provides secure,
    web-based access to directories and files on OES servers across the network.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_255_0.png)


    For complete details on configuring and implementing NetStorage, see the Novell
    OES NetStorage Administration Guide for Linux (netstor_ix.pdf) and the Novell
    OES NetStorage Administration Guide for NetWare (netstor.pdf).


    You can access these guides from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Objective 1


    # Describe the Purpose and Architecture of NetStorage


    To describe the purpose and architecture of NetStorage, you need to know the following:


    +   - What NetStorage Provides

    - NetStorage System Requirements

    - Novell NetStorage on OES Linux

    - Novell NetStorage on OES NetWare

    - How NetStorage Works

    - What Users See When They Access NetStorage'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# What NetStorage Provides


    Network file access is often confusing and frustrating to users as illustrated
    in the following:


    # Figure 10-1


    ![](img/5c6ed3be01bd022754f15cfb45760d71_257_0.png)


    The following describes Figure 10-1:


    +   - **Access Methods.** Browser or PDA access is business-critical to those
    who must travel. However, access method support varies widely among file service
    providers.


    +   - **Authentication.** Authentication helps protect information assets, but
    having diverse authentication methods leads to frustration and low productivity.


    +   - **Target File Systems.** Having diverse file storage services only adds
    to the complexity and confusion.'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'Novell NetStorage ties all of these issues together with an easy-to-administer,
    easy-to-use solution.


    NetStorage provides secure Internet-based access to files and folders on Linux
    and NetWare servers on your network using either a browser or Microsoft Web Folders
    (Microsoft''s implementation of WebDAV).


    NetStorage authentication relies on Novell eDirectory to provide secure access,
    so Internet-based access is as secure as accessing files from within the network.


    Novell NetStorage includes the following benefits:


    +   - Lets users securely copy, move, rename, delete, read, and write files between
    any Internet-enabled machine and Linux or NetWare servers on your network.


    +   - Eliminates the need to use a virtual private network (VPN) client to access
    files.


    +   - Eliminates the need to email or copy data from one machine to another.


    +   - Supports Internet standards such as HTTP, HTTPS, HTML, XML, and WebDAV.


    +   - Supports the use of drive mappings that users are accustomed to when they
    log in using the Novell Client.


    +   - Supports access to users'' Novell iFolder 2.x accounts.


    +   - Provides access to network files and folders via Novell Virtual Office,
    Novell iFolder 2.x., and Novell extNed Director 4.1 Standard Edition.


    +   - Supports Storage Location objects used to display a specified name for a
    network directory in the NetStorage directory access list, displayed through Microsoft
    Web Folders or a web browser.


    With NetStorage installed on OES Linux server, users can potentially have access
    to any Linux or NetWare 5 or later server anywhere on your geographically dispersed
    network.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# NetStorage System Requirements


    In addition to meeting the requirements for Novell OES, NetStorage requires the
    following:


    +   - Server requirements. At least one Linux server with OES or one NetWare 6.5
    server in the Novell eDirectory tree where NetStorage will be installed.


    An eDirectory replica is not required to be on the same server where NetStorage
    is installed.


    > To avoid time issues, this server must have time set correctly according to
    your network specifications. If time is not set, workstations might not be able
    to access files.


    +   - Workstation requirements. Netscape Navigator 4.7 or later, Internet Explorer
    5.5 or later, Mozilla, Mozilla Firefox, other Linux browsers, or Microsoft Web
    Folders.'
  merge: -1
  pgno: 259
- img_proc: true
  md: "# Novell NetStorage on OES Linux\n\nNetStorage on Linux provides local and\
    \ Web access to files on many systems without requiring the Novell client, as\
    \ illustrated in the following:\n\n# Figure 10-2\n\n![](img/5c6ed3be01bd022754f15cfb45760d71_260_0.png)\n\
    \nThe following describes Figure 10-2:\n\n+   **Access methods.** Users have read\
    \ and write access to files from\n    * **Windows Explorer.** This is enabled\
    \ by the HTTP protocol with WebDAV extensions.\n    * **Browsers.** Users can\
    \ access files directly by connecting to the NetStorage server.\n    * **PDAs.**\
    \ PDA users with network connections can access their files as well.\n\nAccess\
    \ is granted through login script drive mapping (NCP server required) or through\
    \ Storage Location objects."
  merge: -1
  pgno: 260
- img_proc: true
  md: '+   * **Authentication.** File service access is controlled by LDAP-based authentication
    through the eDirectory server.


    Although shown separately, eDirectory could be running on the OES Linux server.


    +   * **NetStorage server.** The NetStorage server receives and processes connection
    requests and provides access to storage on various servers on the network.


    A Novell iFolder 2.x server running on the same server as NetStorage is automatically
    available through NetStorage to iFolder 2.x users.


    +   * **Target servers.** NetStorage on Linux can connect eDirectory users to
    their files and folders stored in the following locations:


    +     * The targets as NetWare (see Figure 10-3) if the NCP server is running


    +     * Windows workgroup shares (CIFS or Samba shares)


    +     * Linux traditional volumes through an SSH connection


    Linux volumes can also be made available as NCP volumes.'
  merge: -1
  pgno: 261
