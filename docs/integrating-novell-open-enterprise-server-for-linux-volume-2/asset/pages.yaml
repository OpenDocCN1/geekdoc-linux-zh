  md: '# File System


    iFolder 3.x installs the iFolder files on the system volume. OES Linux requires
    the Reiser (default) or EXT3 file system for the system device.


    We recommend that you store the users’ iFolder data on a separate volume.


    The following are supported file systems based on iFolder version:


    | Table 8-4 | Version | Data File System Support |

    |---|---|--|

    | iFolder 3.1 and later | EXT3, ReiserFS, or NSS |

    | iFolder 3.0 | EXT3 or ReiserFS |


    # Enterprise Server


    We recommend that you install iFolder 3.x Enterprise Server and Web Access server
    after your OES Linux system is configured and running properly.


    You must post-install iFolder if you plan to use NSS volumes for your iFolder
    data because you cannot set up NSS volumes during OES Linux installation.


    However, if you plan to use a Linux traditional volume such as EXT3 or ReiserFS
    for your iFolder data, you can optionally install and configure iFolder when you
    install OES Linux.


    The following are additional prerequisites and guidelines for iFolder Enterprise
    Server:


    +   - Prerequisites for the Operating System

    - Install Guidelines When Using an NSS Volume to Store iFolder Data

