  md: '# Install the iFolder Client on Windows 2000/XP/2003


    In this course, you install the iFolder client on a Windows workstation (XP Professional)
    and run the iFolder client from a SUSE Linux Enterprise Desktop 10 (SLED 10) workstation.


    The iFolder client is already installed on SLED 10.


    For details on installing the iFolder 3.x client on Novell Linux Desktop 9 and
    Macintosh, see "Installing the iFolder Client" on page 33 of the Novell iFolder
    User Guide for Novell iFolder 3.x (user.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES Docs directory on your 3077 Course ID.


    To install the iFolder client on Windows, do the following:


    +   1. Log on to the computer as an Administrator user (or equivalent user).


    +   2. Save the iFolder.exe file to a local directory.


    +   3. Install iFolder by double-clicking the file; then follow the on-screen
    instructions.


    iFolder for Windows requires the Microsoft .NET framework. .NET is not detected,
    the installation automatically downloads and installs .NET.


    +   4. When prompted to reboot the computer, do one of the following:

    - Select OK and allow the reboot to continue; then continue with Step 5.

    - Select Cancel and log off as the Administrator user (or equivalent identity);
    then continue with Step 5.

    - If you want to create an iFolder account from your current login, select Cancel
    and start iFolder by selecting Start > Programs > iFolder 3 > iFolder Client;
    then continue with Step 6.


    +   5. To run iFolder, log on to the computer with the user identity you want
    to use when you create iFolders.'
  merge: -1
  pgno: 149
