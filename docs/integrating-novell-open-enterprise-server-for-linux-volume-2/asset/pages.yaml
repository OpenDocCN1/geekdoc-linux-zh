  md: '# Novell iFolder 3 Plug-In for Novell iManager 2.5


    The Novell iFolder 3 plug-in for Novell iManager 2.5 is an administrative tool
    you use to manage the iFolder system, user accounts, and user iFolders and data.


    # iFolder Web Access


    The iFolder 3.x Web Access server provides an interface to allow users remote
    access to iFolders on the enterprise server.


    # The iFolder Client


    The iFolder client integrates with the user’s operating system to provide iFolder
    services in a native desktop environment. It supports the following client operating
    systems:


    +   - Novell Linux Desktop 9

    - SUSE Linux Enterprise Desktop 10 (SLED 10)

    - Windows 2000/XP

    - Macintosh OS X v10.3 or later


    An iFolder session begins when the user logs in to an iFolder services account
    and ends when the user logs out of the account or exits the iFolder client.


    The iFolders synchronize files with the enterprise server only when a session
    is active and the computer has an active connection to the network or Internet.


    Users can access data in their local iFolders at any time; it does not matter
    if they are logged in to their server accounts or if they are connected to the
    network or Internet.


    The iFolder client allows users to create and manage their iFolders.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Shared iFolders


    An iFolder is a local directory that the user selectively shares with other users
    in a collaboration environment.


    The iFolder files are accessible to all members of the iFolder and can be changed
    by those with the rights to do so. Users can share iFolders across multiple workstations
    and with others.


    Because the iFolder client is integrated into the operating environment, users
    can work with iFolders directly in a file manager or in the My iFolder window.


    Within the iFolder, users can set up any subdirectory structure that suits their
    personal or corporate work habits. The subdirectory structure is constant across
    all member iFolders.


    Each workstation can specify a different parent directory for the shared iFolder.


    # iFolder Access Rights


    The iFolder client provides four levels of access for members of an iFolder:


    +   * Owner. Only one user serves as the owner. This is typically the user who
    created the iFolder.


    The owner or an iFolder administrator can transfer ownership status from the owner
    to another user.


    The owner of an iFolder has the Full Control right. This user has read/write access
    to the iFolder, manages membership and access rights for member users, and can
    remove the Full Control right for any member.


    With an enterprise server, the disk space used by the owner''s iFolders count
    against the owner''s user disk quotas on the enterprise server.'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'If a user is deleted as a user for the iFolder system, the iFolders owned by
    the user are orphaned. Orphaned iFolders are assigned temporarily to the iFolder
    Admin user, who becomes the owner of the ifolder.


    Membership and synchronization continues while the iFolder admin user determines
    whether an orphaned iFolder should be deleted or assigned to a new owner.


    +   **Full Control.** A member of the shared iFolder, with the Full Control access
    right. The user with the Full Control right has read/write access to the iFolder
    and manages membership and access rights for all users except the owner.


    +   **Read/Write.** A member of the shared iFolder, with the Read/Write access
    right to directories and files in the iFolder.


    +   **Read Only.** A member of the shared iFolder, with the Read Only access right
    to directories and files in the iFolder. This member can copy an iFolder file
    to another location and modify it outside the iFolder.


    When used with an enterprise server, the enterprise server hosts every iFolder
    created for that account.


    Users can create an iFolder and the enterprise server makes it available to the
    specified list of users. A user can have a separate account on each enterprise
    server. A user’s level of membership in each shared iFolder can differ.


    # Account Setup for Enterprise Servers


    The iFolder client lets you set up multiple accounts, with one allowed per enterprise
    server. Users specify the server address, username, and password to uniquely identify
    an account.


    On his or her computer, a user sets up accounts while logged in as the local identity
    or she plans to use to access that account and its iFolders.'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'Under the local login, the user can set up multiple iFolder accounts, but each
    account must belong to a different iFolder enterprise server.


    # Access Authentication


    Whenever iFolder connects to an enterprise server to synchronize files, it connects
    to the server using HTTP BASIC and SSL, and the server authenticates the user
    against the LDAP directory service.


    # File Synchronization and Data Management


    When you set up an iFolder account, you can enable Remember Password so that iFolder
    can synchronize iFolder invitations and files in the background as you work.


    The iFolder client runs automatically each time you log in to your computer''s
    desktop environment. The session runs in the background as you work with files
    in your local iFolders, tracking and logging any changes you make.


    With an enterprise server, you can synchronize the files at specified intervals
    or on demand.


    # Synchronization Log


    The log displays a log file of your iFolder background activity.


    # iFolder Client APIs


    For iFolder Client developer documentation, see the iFolder Software Developers
    Kit at http://forge.novell.com/modules/xfmod/docman/?group_id=1372.'
  merge: -1
