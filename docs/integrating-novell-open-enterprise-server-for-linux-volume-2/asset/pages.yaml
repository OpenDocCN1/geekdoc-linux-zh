  md: '# Manage Print Jobs


    The following provides information about the print job management features of
    iPrint:


    +   - View Print Job Information

    - Delete Print Jobs

    - Change the Order of Print Jobs


    Users designated as managers or operators for a printer can perform these tasks
    for all jobs routed to that printer; individual job owners can perform these tasks
    only for their own jobs.


    # View Print Job Information


    You can view information about individual print jobs waiting to be processed by
    a specific printer by doing the following:


    +   1. From Novell iManager, select iPrint > Manage Printer.

    2. Browse to and select the printer the job was sent to.

    3. Select Printer Control > Jobs.


    Information about print jobs is displayed.


    # Delete Print Jobs


    Administrators can delete any print job after it has been submitted if the job
    has not yet started printing. Users can delete only their own print jobs.


    Do the following:


    +   1. From Novell iManager, select iPrint > Manage Printer.

    2. Browse to and select the printer the job was sent to.

    3. Select Printer Control > Jobs.

    4. Select the check box next to the job you want to delete.

    5. Select Delete.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Change the Order of Print Jobs


    Occasionally, you might need to print a job ahead of other jobs that have already
    been submitted to a printer but have not yet started printing.


    Administrators, managers, and operators can move any job up or down the list.
    Users can move only their own jobs and can only move them down the list.


    Do the following:


    +   1. From Novell iManager, select iPrint > Manage Printer.

    2. Browse to and select the printer the job was sent to.

    3. Select Printer Control > Jobs.

    4. Select the check box next to the job you want to modify.

    5. Move a print job up the list by selecting Promote.


    # Manage the Driver Store


    When you create a Driver Store, a configuration file is created in /etc/opt/novell/iprint.
    The file name is idsd.conf.


    Each time you create a Driver Store object using iManager and assign it to the
    same server, a separate entry is added to idsd.conf.


    Although you can have several Driver Stores assigned to a server, all printer
    driver files are stored in one file structure on the server.


    For information about the entries in the configuration file, see /etc/opt/novell/iprint/idsd.conf.


    If you need to change the eDirectory server assignment for the Printer Manager
    or Driver Store, edit the DSSServer1=entry in the corresponding configuration
    file (/print_manager_name_ipsmd.conf or idsd.conf) located in /etc/opt/novell/
    iprint.


    You can start and stop the Driver Store in one of the ways:'
