    you will probably have a number of questions.


    The following objectives will help answer your questions and alert you to steps
    you should follow for a successful Novell OES implementation:


    +   1. Review the Services Included in Novell OES

    2. Decide Which OES Platform Is Best Suited to Provide These Services

    3. Plan for eDirectory

    4. Plan for File Services

    5. Plan for Print Services

    6. Plan for NetWork Server Usage

    7. Review Server Requirements

