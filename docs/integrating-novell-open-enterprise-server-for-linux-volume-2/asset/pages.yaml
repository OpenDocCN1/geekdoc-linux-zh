  md: '# Objective 1 Review the Services Included in Novell OES


    After working through the exercises in this course, you learned about Novell OES
    services that you might not have known about.


    For example, you learned that the Novell client allows users to map drives to
    locations on an OES Linux server running the NCP server for Linux.


    Beginning with the release of Novell Nterprise Linux Services and expanding with
    the release of Novell OES, Novell has included Linux versions of many Novell services
    that have traditionally been available only on NetWare.


    In addition, Novell has ported the most well-known, network-critical open source
    products to NetWare—products as OpenSSH and the Apache Web server.


    The following summarizes the services and technology support available on each
    platform and the differences in the way these services are provided:


    | Table 11-1 Service | OES Linux | OES NetWare |

    |---|---|---|n| Apache Web Server | Yes (standard Linux) | Yes (NetWare port of
    open source product) |

    | Archive and Version Services | No | Yes |

    | Backup (SMS) | Yes | Yes |

    | Clustering | Yes | Yes |

    | DFS (Distributed File Services) | Yes | Yes |

    | DHCP | Yes | Yes |

    | DNS | Yes | Yes |

    | eDirectory 8.7.3 | Yes | Yes |'
  merge: -1
