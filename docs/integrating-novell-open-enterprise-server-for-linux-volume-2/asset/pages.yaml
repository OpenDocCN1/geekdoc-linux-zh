  md: '# Introduction


    The previous sections have introduced you to testing Novell OES in a lab environment
    before introducing it into your network production environment.


    Although you were probably familiar with many of the Novell OES services running
    on NetWare, implementing them in a mixed NetWare and Linux environment creates
    new challenges that include network communication, configuration, and coexistence
    issues.


    In this section, you review many of these issues in the context of planning for
    your own implementation of Novell OES.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_293_0.png)


    For additional information about planning a Novell OES implementation, see the
    Novell OES Planning and Implementation Guide (implpgde.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.'
