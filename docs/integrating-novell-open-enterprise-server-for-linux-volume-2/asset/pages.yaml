  md: '# Integrating Novell Enterprise Server for Linux


    +   * A network connection

    * When working with a Novell iFolder 3.x enterprise server, workstations can use
    static or dynamic IP addresses


    # Client Computers


    The iFolder client supports the following workstation operating systems:


    +   * Novell Linux Desktop 9 and SUSE Linux Enterprise Desktop 10 (requires the
    Mono framework)

    * The Mono modules you need for this release are included in the iFolder install
    file.

    * Windows 2000/XP/2003 with the latest Microsoft .NET 1.1 support patches

    * Make sure you have installed the latest critical updates for your operating
    system and for .NET 1.1. See the Windows Update site (http://windowsupdate.microsoft.com).

    * Macintosh OS X v10.3 and later (requires the Mono framework)

    * The Mono modules you need for this release are included in the iFolder install
    file.


    # Mono


    For a Linux or Macintosh workstation, the iFolder client requires the Mono framework.


    Mono is a development platform for running and developing modern applications.
    Based on the ECMA/ISO standards, Mono can run existing programs that target the
    .NET or Java frameworks.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_143_0.png)


    The Mono Project is an open source effort led by Novell and is the foundation
    for many new applications. For information about Mono, see the Mono Project web
    site at http://www.mono-project.com.'
  merge: -1
