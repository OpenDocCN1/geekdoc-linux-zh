    # Manage the Simias Log and Simias Access Log


    On the iFolder enterprise server, the following two logs track events:


    +   * Simias Log. The /simias/Simias.log file contains status messages about the
    health of the Simias Service.

    * Simias Access Log. The /simias/Simias.access.log contains file access events
    for data and metadata about iFolders, users, membership in shared iFolders, and
    so on.


    It reports the success of the event and identifies who did what and when they
    did it.


    For example, if a file was deleted on the server, it identifies the user who initiated
    the deletion.


    Review the logs whenever you need to troubleshoot problems with your iFolder system.
    The Simias Log4net file (/simias/Simias.log4net) allows you specify output location
    of the log files and when events are recorded at run time.


    Its parameters are based on, but not compliant with, the Apache Logging Services
    (http://logging.apache.org/log4net).


    For a list of modifiable parameters, see “Managing the Simias Log and Simias Access
    Log” on page 68 of the Novell iFolder Administration Guide for Novell iFolder
    3.x (admin.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_151_0.png)'
