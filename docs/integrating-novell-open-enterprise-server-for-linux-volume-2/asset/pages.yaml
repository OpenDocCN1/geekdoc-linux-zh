  md: 'When you install the iFolder client for Linux and Macintosh, you must also
    install Mono as a dependent application for iFolder. The required version of Mono
    is packaged in the iFolder client installation file that you download from the
    iFolder server.


    The following table lists the versions of Mono used in the different iFolder releases
    on Linux and Macintosh:


    | Table 8-6 | iFolder Client Version | Mono Version |

    |---|---||

    | | iFolder client for Novell iFolder 3.0 (released for OES Linux) | - For Linux:
    1.1.7.1.44342<br>- For Macintosh: 1.1.7.2 |

    | | iFolder client for Novell iFolder 3.1 (released for OES SP1 Linux) and 3.2
    (released for OES SP2 Linux) | - For Linux: 1.1.7.7<br>- For Macintosh: 1.1.7.7x
    |


    Make sure to use the required version of Mono. If you have a different version
    of Mono on your Linux or Macintosh computer, uninstall it before you install iFolder
    and the required version of Mono.


    The iFolder client for Linux or Macintosh supports only the version of Mono included
    in the installation software.


    If you need to upgrade Mono for another reason, please check the iFolder 3.x online
    documentation to see if Novell explicitly supports Mono version and learn any
    necessary steps to make the upgrade work correctly.


    For information, the latest version of the iFolder 3.x Readme on the Novell iFolder
    3.x Documentation web site at http://www.novell.com/documentation/ifolder3.'
