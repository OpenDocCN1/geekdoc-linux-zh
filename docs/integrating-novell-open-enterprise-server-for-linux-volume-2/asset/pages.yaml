  md: '# Objective 5


    # Plan for Print Services


    Use the following to help you plan your iPrint installation:


    +   - We recommend you record your planning decisions on a planning worksheet
    for future reference.


    +   - iPrint has no additional RAM requirements.


    +   - Most iPrint installations (even in large enterprises) do not require additional
    disk space for associated print job spooling.


    However, if you anticipate very heavy print usage and want to plan for additional
    disk space, the iPrint spooler area is located in the /var partition or directory
    structure on OES Linux servers.


    On NetWare servers you designate the location when creating the Print Manager
    object.


    +   - To finishing your iPrint installation, refer to the information for your
    server platform:


    +   - For NetWare, see “Novell iPrint Server” on page 46 in the Novell OS Installation
    Guide for NetWare (install-nw.pdf).


    +   - For Linux, see “Novell iPrint” on page 43 in the Novell OES Installation
    Guide for Linux (install-linux.pdf).


    ![](img/5c6ed3be01bd022754f15cfb45760d71_312_0.png)


    You can access these guides from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Objective 6


    # Plan for NetWork Server Usage


    To effectively use your network servers for a Novell OES deployment, you need
    to do the following:


    +   - Identify a Purpose for Each Server

    - Review Server Requirements

    - Consider Coexistence and Migration Issues


    # Identify a Purpose for Each Server


    Large networks usually have one or more servers dedicated to providing a single
    network service.


    For example, one or more servers might be designated to provide iFolder file services
    to network users while other servers provide iPrint printing services for the
    same users.


    For smaller organizations, it is often not practical or cost-effective to dedicate
    servers to providing a single service. For example, the same server might provide
    both file and print services to network users.


    Prior to installing a new server on your network, you should identify the service
    or services that it will provide.


    # Review Server Requirements


    OES Linux and OES NetWare both have specific hardware and software requirements.


    Before installing OES, make sure your server machine and network environment meet
    the requirements outlined in the following manuals:


    +   - OES Linux. See “Preparing to Install OES Linux” on page 13 in the Novell
    OES Installation Guide for Linux (install-linux.pdf).'
  merge: -1
  pgno: 313
- img_proc: true
  md: '+   - OES NetWare, See “Meet Hardware and Software Requirements” on page 13
    in the Novell OES Installation Guide for NetWare (install-nw.pdf).


    You can access these guides from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # Consider Coexistence and Migration Issues


    You probably already have a network that provides services to network users. In
    many cases the services you are currently running will influence your approach
    to implementing Novell OES.


    In some cases, there are specific paths to follow that the Novell OES integration
    process is as smooth as possible.


    Novell has invested considerable effort in identifying service coexistence and
    migration issues you might face. However, we can’t anticipate every combination
    of services that you might have.


    Therefore, we intend to continue developing the initial coexistence and migration
    information even after the Novell OES product releases, and we plan to update
    the web-based documentation regularly with the newly developed information.


    For information about coexistence of Novell OES servers with existing NetWare
    and Linux networks, and for migration instructions, see the Novell OES Coexistence
    and Migration Guide (coexist-mig.pdf).


    You can access this guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.'
  merge: -1
  pgno: 314
