    # Manage iFolders


    An iFolder is a local directory used to selectively share and synchronizes files
    with user-specified members.


    The iFolder files are accessible to all members and can be modified and read by
    those with privileges to do.


    The following are basic tasks for managing iFolders from the iFolder client:


    +   - Create an iFolder


