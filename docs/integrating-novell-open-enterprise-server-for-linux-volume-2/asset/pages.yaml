    iFolder 3 plug-in to Novell iManager 2.5. Novell iFolder allows management from
    any location, using a standard Web browser.


    iFolder also frees IT departments from routine maintenance tasks by providing
    secure, automatic synchronization of local files to the server.


    # No Training Requirements


    IT personnel no longer need to condition or train users to perform special tasks
    to ensure the consistency of data stored locally and on the network.


    With Novell iFolder, users simply store their files in the local iFolder directory.
    Their files are automatically updated to the iFolder server and any other workstations
    that share the iFolder.


    iFolder works seamlessly behind the scenes to ensure that data is protected and
    synchronized.


    # Benefits of iFolder for Users


    Typically, when users work in multiple locations or in collaboration with others,
    they must conscientiously manage file versions.


