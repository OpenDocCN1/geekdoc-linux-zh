    \ only one account for any given host computer or server, but you can have multiple\
    \ accounts.\n\nA user with a different local login and user account can log in\
    \ to the same computer at a different time and use iFolder to create his or her\
    \ own set of iFolders under that identity.\n\niFolder synchronizes only iFolders\
    \ belonging to the active user.\n\nConfigure an iFolder account by doing the following:\n\
    \n+   1. Use one of these methods to access account setup:\n    * The first time\
    \ you start iFolder after the installation, iFolder prompts you to set up an iFolder\
    \ account.\n      Select Yes to go directly to the iFolder Preferences > Accounts\
