    Selected Users list by selecting *Add*.

    5. When you finish, select **OK**.

    It can take several seconds for the invitations to synchronize to the server.

    6. Select one or more *users*; then select **Access**.

    7. Select the **Full Control, Read/Write**, or **Read Only** access right.

    8. When you finish, select **OK**.

    9. Select **Apply**; then close the iFolder Properties dialog by selecting **OK**.'
