    # NetStorage Implementation Guidelines


    The following are some guidelines to help you when implementing NetStorage:


    +   * User and Group Access Rights Assignments

    * Access Other Target Systems

    * NetStorage Authentication Persistence

    * NetStorage Maintenance

    * Invalid NetStorage Authentication Domains

    * iManager NetStorage Plug-In Options


    # User and Group Access Rights Assignments


    Because NetStorage provides access to other file storage systems, the users and
    groups that access the other systems through NetStorage must be created and granted
    file and directory access on those systems.


    For example:


    +   * NetWare users exist in the eDirectory tree where the NetWare server resides
    and have access rights to the files and directories on the NetWare server.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '+   - Windows users must exist on the Windows systems and have the required
    access rights to the files and directories on those systems.


    +   - If your users access Samba files on an OES Linux server, they must be enabled
    for LUM and Samba access on the OES Linux server.


    The usernames and passwords used to authenticate to the NetStorage (OES) server
    through eDirectory must match the usernames and passwords defined on the target
    systems.


    # Access Other Target Systems


    When you install NetStorage (during or after OES installation), you indicate a
    primary authentication domain (such as slc.da) for NetStorage.


    To log in to NetStorage and access storage locations, users must exist somewhere
    in the context of this primary domain.


    When receiving an authentication request, NetStorage searches for the username
    in the context you specified and in all its subcontexts.


    Authentication to other file systems is often controlled by other authentication
    domains.


    For example, you might create a storage location on an OES Linux server that points
    to a NetWare server that resides in a different eDirectory tree. To access this
    storage location, users must authenticate to the other.


    This means that you must specify an additional context in the NetStorage configuration
    as a nonprimary authentication domain.


    When defining a nonprimary authentication domain, you must must


    +   - Make sure that the username and password in the nonprimary domain matches
    the username and password in the primary domain.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '+   Specify the exact context of user objects. NetStorage doesn''t search the
    subcontexts of nonproprietary domains.


    For details on Authentication Domains, see "Authentication Domains" on page 24
    of the NetStorage Administration Guide for Linux (netstor_lx.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # NetStorage Authentication Persistence


    By default, users must reauthenticate each time they access NetStorage in a browser.
    This is true even if another browser window is open and authenticated on the same
    workstation.


    The reason for this is that persistent cookies are not enabled by default. This
    setting can be changed.


    For details on persistent cookies, see "Persistent Cookies" on page 28 of the
    NetStorage Administration Guide for Linux (netstor_lx.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # NetStorage Maintenance


    Your NetStorage installation can change as your network changes and evolves by
    providing access to new or consolidated storage locations.


    For information about the kinds of tasks you can perform to keep your NetStorage
    implementation current, see the following:


    +   For Linux, OES NetStorage Administration Guide for Linux (netstor_lx.pdf).'
  merge: -1
  pgno: 284
- img_proc: true
  md: '+   - For NetWare, OES NetStorage Administration Guide for NetWare (netstor.pdf).


    # Invalid NetStorage Authentication Domains


    If you change the default NetStorage Authentication Domain to an invalid domain,
    either during the OES installation (NetStorage installation) or afterwards with
    iManager, users may get a blank screen or Service Not Available errors when trying
    to access NetStorage.


    Also, you will not be able to change the Authentication Domains setting to a valid
    domain using iManager.


    If this happens, you can change the Authentication Domains value using the /opt/novell/xtier/bin/xsrvcfg
    command on the Linux server console. To change the authentication domain value,
    enter the following command:


    ```

    LD_LIBRARY_PATH=/opt/novell/xtier/lib /opt/novell/xtier/bin/xsrvcfg -d authentication_domain
    -c authentication_context

    ```


    Replace authentication_domain with a valid authentication domain. Replace authentication_context
    with a valid authentication context.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_285_0.png)


    For details on authentication domains, see “Authentication Domains” on page 24
    of the NetStorage Administration Guide for Linux (netstor_lx.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 CD.'
  merge: -1
