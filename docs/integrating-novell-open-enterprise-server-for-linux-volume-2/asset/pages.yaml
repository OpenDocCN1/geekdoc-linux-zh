  md: '# Add a User to an iFolder


    You can add a user to an iFolder by doing one of the following:


    +   - **Add a user with a file manager.** To add a user with a file manager, do
    the following:

    1. From the file manager, navigate to and select the iFolder.

    2. Right-click the iFolder: then select iFolder > Share with.

    3. From the list of users, select one or more users.

    4. Select the access right: **Full Control, Read/Write, or Read Only.**n5. Select
    **Apply.**


    +   - **Add a user with the iForders browser.** To add a user with the iForders
    browser, do the following:

    1. In the Notification area, right-click the iFolder icon, then select iForders
    to open the iForders browser.

    2. From the list of iForders, select the iFolder; then select **Share**.

    The iFolder Properties dialog opens with the Sharing tab selected.

    3. Select **Add.**'
  merge: -1
