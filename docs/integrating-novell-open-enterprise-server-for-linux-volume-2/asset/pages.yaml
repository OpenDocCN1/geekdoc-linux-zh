    # Create Location-Based Printing Web Pages


    Location-based printing lets users select printers based on locations by using
    a list view or a map.


    Using a list view, printer locations can be displayed using HTML pages organized
    by building, office location, eDirectory context, etc. You configure the lists
    in a way that best suits the user''s needs.


    For an example of a list view, see /var/opt/novell/iprint/htdocs/examples/example2/innerweb.htm.


    Using the iPrint Map Designer, you can create maps of printer locations using
    drag-and-drop technology. After the maps are created, they can be posted on a
    Web server for users to access.


    When users view the maps, they can find a printer close to their location and
    then click its icon. The client software (if not installed) and the printer are
    installed on their workstations.'
