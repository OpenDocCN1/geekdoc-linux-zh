  md: '# Objective 4 Migrate iPrint on NetWare to OES Linux


    This objective explains how to copy existing iPrint Printer Agents (PSMs) running
    on NetWare 6.5 to iPrint Print Managers running on an OES Linux server.


    To perform this task, you need to know the following:


    +   - Migration Guidelines

    - Migration Requirements

    - How to Migrate iPrint Print Managers and Printer Agents Using the Server Consolidation
    Utility

    - Post Migration Tasks


    # Migration Guidelines


    When migrating an iPrint print system from NetWare to OES Linux, be aware of the
    following:


    +   - The Server Consolidation Utility lets you copy existing iPrint printers
    running on NetWare to iPrint Managers running on OES Linux.

    - NDPS printers can also be copied to a Print Manager on an OES Linux server,
    provided they are iPrint enabled.

    - Using the Server Consolidation Utility interface, you can merge the Print Agents
    associated with an existing Print Manager on NetWare with the printers associated
    with an existing Print Manager on Linux.

    You can also create new Print Managers on Linux. With careful planning, you can
    easily migrate printers without any interruption to your users.

    - The utility does not move nonreferenced objects such as driver profiles and
    custom banners.

    - Print Managers and Printer Agents are not removed from the source server when
    you copy them. The print configuration is copied to the destination, not moved.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'When you are finished migrating your print system, you must manually delete
    the source Print Managers and Printer Agents (if you want them removed).


    +   - When you move the Print Manager or Printer Agents to an OES Linux server,
    the printer objects are copied to the same eDirectory container as the Print Manager,
    even if the printer objects are distributed throughout the tree.


    This helps the Print run more efficiently and avoids unnecessary calls to eDirectory
    for printer information.


    +   - If you made changes to the iprint.ini file (located in sys:\apache\htdocs\ppdocs\),
    you should copy the file to /var/opt/novell/iprint/htdocs/ on the destination
    server.


    +   - iPrint maps and custom images are not migrated. If you are hosting these
    on your iPrint server, you will need to copy them to the destination server.


    # Migration Requirements


    During the migration, printer drivers are copied from the Resource Management
    Service (RMS) to the iPrint Driver Store (IDS).


    For the migration to be successful, the following is required:


    +   - The Resource Management Service (RMS) used by the Print Manager on a NetWare
    server must be up and running.


    +   - The iPrint Driver Store (IDS) on an OES Linux server must be up and running.


    +   - You must use an eDirectory user with sufficient rights to access the source
    and destination print system and eDirectory access permissions.


    +   - DNS must be properly configured for the existing print system.'
  merge: -1
  pgno: 62
