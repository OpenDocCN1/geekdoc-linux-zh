  md: 'To use printer driver profiles, you need to know how to do the following:


    +   - Create, Modify, and Delete a Printer Driver Profile

    - Associate a Printer Driver Profile with a Printer


    # Create, Modify, and Delete a Printer Driver Profile


    When creating a printer profile, you work directly with a platform-specific printer
    driver. For this reason, you need to create and modify profiles from the same
    operating system platform as the printer driver.


    For example, to create or modify a Windows 2000 printer driver profile, you must
    access iManager and complete the task from a Windows 2000 workstation.


    Do the following:


    +   1. From Novell iManager, select iPrint > Printer Driver Profile.

    2. Browse to and select the Print Manager where you want the driver profile stored
    and made available to the printers on that manager.

    3. Select one of the following:


    +   - Create Printer Driver Profile. Creates a new printer driver profile.

    - Delete Printer Driver Profile. Deletes an existing driver profile.

    - Modify Printer Driver Profile. Changes the settings of an existing printer driver
    profile.


    +   4. Select OK.


    # Associate a Printer Driver Profile with a Printer


    After creating a printer driver profile, you need to associate it with a printer.
    Do the following:


    +   1. From Novell iManager, select iPrint > Manage Printer.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '+   2. Browse to and select the printer you want to modify.


    +   3. Select Drivers > printer_driver_operating_system.


    +   4. From the list of Available Drivers, select the printer driver.


    +   5. From the list of Available Driver Profiles for Selected Driver, select
    the profile you want associated with this printer.


    If you do not want a profile associated, select None.


    +   6. Save the changes by selecting OK.


    # Enable iPrint Direct


    Users of an iPrint Direct-enabled printer send print jobs directly to the printer
    instead of sending jobs to the Print Manager first.


    The job is sent to the printer in LPR or raw 9100 format, depending on the setting
    gateway autoload command for the printer.


    Although this greatly reduces server communication, the ability to audit print
    jobs is lost. iPrint Direct still supports driver updates, and printer information
    is gathered directly from the printer using SNMP.


    Do the following:


    +   1. From Novell iManager, select iPrint > Manage Printer.


    +   2. Browse to and select the printer you want to enable iPrint Direct printing
    for.


    +   3. Select Client Support > iPrint Direct.


    +   4. Select the Enable iPrint Direct Printing option.'
