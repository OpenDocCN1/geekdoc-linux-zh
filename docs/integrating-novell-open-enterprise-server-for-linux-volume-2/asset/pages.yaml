  md: '# Integrating Novell Enterprise Server for Linux


    +   - Installing a Plug-In When RBS Is Not Configured

    - Installing a Plug-In When RBS Is Configured


    # Prerequisites


    The following are prerequisites you need to meet before managing iFolder 3.x from
    iManager:


    +   - **iManager 2.5.** If you have not already done so, install Novell iManager
    2.5 on the same or different server as your iFolder server.


    +   - **Role-Based Services.** The iFolder 3 plug-in supports the optional use
    of Role Based Services (RBS) in Novell iManager.


    RBS gives you the ability to assign specific tasks to iManager admin users and
    to present the admin user with the tools necessary to perform a specified set
    of tasks or manage only specified objects as determined by their roles.


    What admin users see when they access iManager is based on their role assignments
    in Novell eDirectory. Only the roles and tasks assigned to that user are displayed.


    # Installing a Plug-In When RBS Is Not Configured


    If you do not have Role-Based Services (RBS) configured for Novell eDirectory,
    do the following to install the iFolder Module:


    +   1. From a supported web browser, log in as admin to iManager the iFolder server
    where you installed iManager using the following URL:


    ```

    https://ifolder.example.com/nps/iManager.html

    ```


    Replace ifolder.example.com with the IP address (such as 10.200.2.2) or the DNS
    name of the iFolder server.


    If you installed iManager on a different server in the same tree as your iFolder
    server, log in to iManager on that server.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '+   2. From the toolbar at the top of iManager home page, select the Configure
    icon (person seated behind a desk).


    +   3. From the left (under Roles and Tasks), expand Module Installation; then
    select Available Novell Plug-In Modules.


    +   4. Locate the iFolder 3 iManager Module, select its plug-in check box; then
    select Install.


    The installation can take a few minutes. You should receive a message confirming
