    # Use Printer Driver Profiles


    Printer driver profiles let you set the driver defaults for a Windows printer
    driver. Then you associate the printer driver profile to a printer so that when
    the printer is installed, it is configured with the settings you want.


    For example, in a law office you might want the default paper size to be legal
    size. This means every time the printer and corresponding driver are installed
    on a workstation, the paper size is set to legal size.'
