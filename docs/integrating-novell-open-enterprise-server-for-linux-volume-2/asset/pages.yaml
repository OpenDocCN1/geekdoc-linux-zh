- img_proc: true
  md: '# How NetStorage Works


    NetStorage is installed on one Linux server (or NetWare server) that acts as a
    Middle Tier (also known as XTier) server:


    Figure 10-4


    ![](img/5c6ed3be01bd022754f15cfb45760d71_264_0.png)


    XTier is Novell''s Web services framework and is used by various Novell products.


    Middle Tier server configuration information is stored in an XML file on the Linux
    server. Novell iManager provides an easy method for changing Middle Tier configuration.


    > Previous versions of NetStorage were administered using the NSAdmin utility.
    Configuration should now be done through Novell iManager.


    After the Middle Tier server is set up, it appears as an Internet web server to
    users and can be accessed either with a web browser or with Microsoft Web Folders.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Integrating Open Novell Enterprise Server for Linux


    NetStorage also includes a gadget that provides access through Novell exeNd Director
    4.1 Standard Edition.


    All transactions can also be encrypted using SSL to increase the security. Novell
    iFolder 2.x transactions are secured using the iFolder encryption mechanism.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_265_0.png)


    It is not currently possible to access iFolder 2.x using NetStorage. Because this
    course does not cover iFolder 2.x (only iFolder 3.x on Linux), you do not see
    any iFolder accounts when logging in to NetStorage during the NetStorage exercise.


    For details on configuring and implementing iFolder 2.x folders to display in
    a user''s NetStorage home page, see the note on page 10 of the Novell OES NetStorage
    Administration Guide for Linux (netstor_itx.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # What Users See When They Access NetStorage


    The NetStorage web page displays the network files and folders currently accessible
    for the logged-in user. The following summarizes NetStorage access:


    | Table 10-10 | OES Platform | Automatic Access |

    |---|---|---|

    | Linux | - Novell iFolder 2.x folders on the same server

    >- NSS volumes on the same server that use the default mount point (/media/nss)

    >- Drive mapping locations in login scripts of the logging in (if the NCP Server
    for Linux is running on the server) |

    | NetWare | - User Home directories

    >- iFolder 2.x folders on the same server

    >- Drive mapping locations in login scripts of the logging in |


    Copying all or part of this manual, or distributing such copies, is strictly prohibited.
    To report suspected copying, please call 1-800-PIRATES.'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'To provide access to file systems not listed, you must create Storage Location
    objects in eDirectory.


    For NetWare servers, NetStorage reads the following, and then displays a list
    of files and folders based on the collected information:


    +   - The user''s login script to determine drive mappings

    - The eDirectory user object properties to determine the path to the user''s home
    directory

    - The user''s Novell iFolder 2.x account


    If Storage Location objects have been created and the user has rights to view
    these objects, the directories associated with these objects are also displayed.


    For example, a default Storage Location object is created when you install NetStorage
    for the primary authentication domain (such as slc.da).


    However, only users in the container (not any subcontainers) are associated with
    the Storage Location object. You need to create other Storage Location objects
    (or modify the default object) for users in other containers (or subcontainers)
    to view directories in the NetStorage web page.


    NetStorage reads container, profile, and user login scripts only from the primary
    eDirectory server specified during the installation. For NetWare servers, NetStorage
    displays the user''s drive mappings based only on those login scripts.


    However, because login scripts were designed to be processed by the Novell client
    on the user''s workstation, NetStorage processes only a subset of the login script
    functions.'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'If you specified alternate IP addresses or DNS names of servers in other eDirectory
    trees during the NetStorage installation, NetStorage reads the user object properties
    in the other eDirectory trees and also displays those home directories.


    This is useful if a user normally logs in more than one eDirectory tree and you
    want that user to have access to additional home directories in different eDirectory
    trees using NetStorage. The user object name must be the same for each eDirectory
    tree.


    NetStorage processes login scripts to find MAP statements. Each MAP statement
    defines a NetWare file system storage resource that the user will be able to access
    using NetStorage.


    IF, ELSE, END, INCLUDE, and EXIT commands are also recognized by NetStorage. All
    other login script statements are treated as comments and ignored.


    Login script variables are also recognized. Variables are preceded by a percent
    sign (%).


    Because mapped drives do not exist in Linux, you must create and use Storage Location
    objects to access storage on Linux servers.


    If you want to provide users with NetStorage access to a specific folder, you
    might have to add a drive mapping command to that folder in a login script (container,
    profile, or user) or create a Storage Location object.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Objective 2


    # Implement and Manage NetStorage


    To perform basic implementation and maintenance tasks on NetStorage, you need
    to know the following:


    +   - How to Access the NetStorage Home Page

    - How to Administer NetStorage from Novell iManager

    - How to Create Storage Location Objects and Lists

    - How to View or Modify Directory and File Attributes and Rights

    - How to Set Directory Quotas on NSS Volumes and Directories

    - How to Purge and Salvage Deleted NSS Files

    - NetStorage Implementation Guidelines


    ![](img/5c6ed3be01bd022754f15cfb45760d71_268_0.png)


    If your NetStorage installation has an iFolder link, you must complete all the
    instructions in “Novell iFolder 2.1x Implementation and Maintenance” on page 222
    in the Novell OES SP2 Planning and Maintenance Guide (implpgde.pdf) before attempting
    to let users access the service.


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # How to Access the NetStorage Home Page


    To access and log in to the NetStorage home page from a browser window on a workstation,
    do the following:


    +   1. Start a supported web browser (such as Internet Explorer or Mozilla Firefox);
    then enter the URL for NetStorage: **server_ip_address/oneNet/NetStorage***


    Replace **server_ip_address** with the IP address or DNS name of the server running
    NetStorage, or the IP address for Apache-based services.


    If Apache-based services use a port other than 80, you must specify that port
    number with the URL.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Integrating Novell Open Enterprise Server for Linux


    For example, if the IP address for NetStorage is 10.200.200.201 and the port number
    is 51080, then you would enter https://10.200.200.1:51080/oneNet/NetStorage.


    If you have the Persistent Cookies feature enabled, the date and time on the workstation
    being used to access NetStorage should be within 24 hours of the date and time
    on the server running NetStorage in order to avoid conflicts.


    A login dialog appears.


    +   2. Enter an eDirectory username and password.

    NetStorage uses your Novell eDirectory username and password, so you don''t need
    to remember or use a separate username or password.


    A NetStorage home page similar to the following appears:


