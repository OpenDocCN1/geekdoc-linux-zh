  md: '# Integrating Open Novell Enterprise Server for Linux


    Refer to the following points for help:


    +   - **iFolder.** For suggestions for calculating the additional disk space you
    will need see “Preparing to Install iFolder 2.1” on page 25 in the Novell iFolder
    2.1 Installation and Administration Guide (admin.pdf).


    ![](img/5c6ed3be01bd022754f15cfb45760d71_311_0.png)


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    +   - **Native File Access Protocols.** You should allocate enough disk space
    to meet your users'' file storage needs Because all platforms can access the same
    storage space, you only need to consider the total space needed, not the platform-specific
    requirements.


    +   - **NCP.** You should allocate enough disk space to meet your users'' file
    storage needs. On Linux, this space must exist on partitions you have designated
    as NCP volumes. On NetWare, all volumes are accessible through NCP.


    +   - **NetStorage.** There are no disk space requirements because NetStorage
    provides access to other file storage services; it doesn''t provide storage services.


    +   - **Samba.** You should allocate enough disk space for the partition containing
    the /home directory to meet your users'' file storage needs.


    +   4. Record the additional disk space requirements in your planning notes.


    +   5. For the file services you plan to install, refer to this section and the
    OES installation guides (at http://www.novell.com/documentation/oes) and note
    your planning choices on your planning sheet.'
