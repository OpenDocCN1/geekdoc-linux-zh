    # Admin User Considerations


    During iFolder installation, iFolder creates two administrator users—the iFolder
    Admin user and the iFolder Proxy user.


    After installation, you can also configure other users with the iFolder Admin
    right to make them equivalent to the iFolder Admin user.


    To make decisions about how to set up admin users, you need to know the following:


    +   - iFolder Admin User and Equivalent Users

    - iFolder Proxy User'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# iFolder Admin User and Equivalent Users


    The iFolder Admin user is the primary administrator of the iFolder enterprise
    server. Whenever iFolders are orphaned, ownership is transferred to the iFolder
    Admin user for reassignment to another user or for deletion.


    You initially specify the iFolder Admin user during the iFolder enterprise server
    configuration in YaST.


    The iFolder Admin user object must be created to enable the iFolder Admin to perform
    management tasks. iFolder tracks this user by the LDAP object GUID, allowing it
    to belong to any LDAP container or group in the tree, even those that are not
    identified as Search DNs.


    The user''s movement can be tracked anywhere in the tree because it is known by
    the GUID, not the user DN.


    The iFolder Admin right can be assigned to other users so that they can also manage
    iFolder services for the selected server. Use the Administrators page in the Novell
    iFolder iFolder 3 plug-in to add or remove the iFolder Admin right for users.


    Only users who are in one of the DNs specified in the LDAP DN are eligible to
    be equivalent to the iFolder Admin user.


    If you assign the iFolder Admin right to other users, those users are governed
    by the roster and Search DN relationship.


    The user is removed from the roster and stripped of the iFolder Admin right if
    you delete the user, remove the user''s DN from the list of Search DNs, or move
    the user to a DN that is not in the Search DNs.


    # iFolder Proxy User


    The iFolder Proxy user is the identity used to access the LDAP server to retrieve
    lists of users in the specified containers, groups, or users that are defined
    in the iFolder LDAP settings.'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'This identity must have the Read right to the LDAP directory. The iFolder Proxy
    user is created during the iFolder installation. You probably never need to modify
    this value.


    If you do modify the iFolder Proxy user, make sure that the identity you specify
    is different than the iFolder Admin user or other system users because the iFolder
    Proxy user password is stored in reversible encrypted form in the Simias database
    on the iFolder server.


    When you initially configure the iFolder enterprise server in YaST, iFolder autogenerates
    a password for the iFolder proxy user.


    The following is the encryption method for the iFolder proxy user:


    # Table 8-2


    | iFolder Version | Encryption Method | Proxy User Password |

    | - | - | - |

    | iFolder 3.2 | YaST encryption method | Generates an alphanumeric, 13-digit,
    mixed-case password. |

    | iFolder 3.0 and 3.1 | BASH random number generator | Generates a number between
    0 and 10000 and appends it to iFolderProxy. For example, iFolderProxy1234. |


    Initially, the password for the iFolder Proxy user is stored in clear text in
    the /opt/novell/ifolder3/etc/simias-server-bootstrap.config file.


    At the end of the configuration process, the system reboots Apache 2 and starts
    iFolder. When iFolder runs this first time after configuration, the iFolder process
    copies the simias-server-bootstrap.config file to the Simias config file.


    The default location of the Simias.config file is either the /var/lib/wwwrun/local/share/simias
    directory or the /home/wwwrun/local/share/simias directory.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'The proxy user password is stored in a reversible encrypted form in the Simias
    database, and then the value is removed from both configuration files.


    The password stored on the system for the iFolder Proxy user must match the password
    stored in the iFolder Proxy user''s eDirectory object.


    If you ever modify the iFolder Proxy user password in eDirectory, you must also
    change the password stored on the system.


    For example, if you change the iFolder Proxy user assignment, or if you want to
    set a longer password for the iFolder Proxy user, you must modify the values afterwards
    in iFolder''s LDAP settings or iFolder cannot access the LDAP server to update
    the user list.


    To secure access to the Simias.config file, administrators of the iFolder 3_x
    server computer must use every precaution to not inadvertently assign unauthorized
    file system rights to the /var/lib/wwwrun/.local/share/simias directory or the
    /home/wwwrun/.local/share/simias directory.


    # iFolder User Account Considerations


    The following are guidelines you should consider when planning for iFolder user
    accounts:


    +   * Preventing the Propagation of Viruses


    +   * Setting Account Quotas


    # Preventing the Propagation of Viruses


    Because iFolder is a cross-platform, distributed solution, virus infection could
    occur on Windows machines migrating across the iFolder server to other platforms,
    and vice versa.'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'You should enforce server-based virus scanning to prevent viruses from entering
    the corporate network.


    You should also enforce client-based virus scanning.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_101_0.png)


    For details, see “Configuring Local Virus Scanner Settings for iFolder Traffic”
    on page 46 in the iFolder User Guide for Novell iFolder 3.x (user.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on your 3077 Course CD.


    # Provisioning User Accounts


    You can specify any existing containers and groups in the Search DNs field of
    the iFolder LDAP settings to govern which users are automatically provisioned
    with accounts for iFolder services.


    The LDAP synchronization tracks a user object’s eDirectory GUID to identify the
    user in multiple contexts as you add, move, or relocate user objects, or as you
    add and remove contexts as DNs.


    The following guidelines apply:


    +   - If the user is added to an LDAP container, group, or user that is in the
    Search DN, the user is added automatically to the iFolder list.


    +   - If a user is moved to a different container and the new container is also
    in the Search DN, the user remains in the iFolder user list.


    +   - If you intend to keep the user as an iFolder user without interruption of
    service and loss of memberships and data, the new container must be added as a
    Search DN before the user is moved.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'If the user is moved to a different container that is not specified as a Search
    DN before the user is moved, the user is removed from the iFolder user list. The
    user''s iFolders are orphaned and the user is removed as a member of iFolders
    owned by others.


    If the new container is later added as a Search DN, the user is treated as a new
    user, with no association with previous iFolders and memberships.


    +   - If the user appears in multiple defined Search DNs, and one or more DNs
    are removed from the LDAP settings, the user remains in the iFolder user list
    if at least one DN containing the user remains.


    +   - If the user is deleted from LDAP or moved from all defined Search DNs, the
    user is removed as an iFolder user. The user''s iFolders are orphaned and the
    user is removed as a member of iFolders owned by others.


    +   - The iFolder Admin user and iFolder Proxy user are tracked by their GUIDs,
    whether their user objects are in a context of the Search DN or not.


    # Setting Account Quotas


    You can restrict the amount of space each user account is allowed to store on
    the server by setting an account quota.


    The account quota applies to the total space consumed by the iFolders the user
    owns. If the user participates in other iFolders, the space consumed on the server
    is billed to the owner of that iFolder.


    You can set quotas at the system or user level. Within a given account quota,
    you can also set a quota for any iFolder.'
