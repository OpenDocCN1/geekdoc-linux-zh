  md: '# Modify User Access Rights


    As the working relationships and status of members of an iFolder change, you might
    need to change a user''s access right setting for the iFolder.


    For example, you might want to give a trusted user the File Control right for
    the iFolder.


    To set user rights for an iFolder, you can do one of the following:


    +   Set user rights with a file manager. To set user rights with a file manager,
    do the following:

    1. From the file manager, navigate to the iFolder, then select it.

    2. Right-click the iFolder, then click iFolder > Share with.

    3. From the list of users, select one or more users.

    4. Select Access; then select the Full Control, Read/Write, or Read Only right.

    5. Select Apply; then close the iFolder Properties dialog by selecting OK.


    +   Set user rights with the iFolders browser. To set user rights with the iFolders
    browser, do the following:

    1. From the Notification area, right-click the iFolder icon; then open the iFolders
    browser by selecting iFolders.

    2. From the list of iFolders, select the iFolder, then select Share.

    3. From the list of users, select one or more users.

    4. Select Access; then select the Full Control, Read/Write, or Read Only right.

    5. Select Apply; then close the iFolder Properties dialog by selecting OK.'
