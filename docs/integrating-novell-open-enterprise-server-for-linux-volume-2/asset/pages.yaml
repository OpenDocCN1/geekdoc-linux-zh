  md: '# Introduction


    Novell iFolder 3.x is the next generation of iFolder, supporting multiple iFolders
    per user, user-controlled sharing, and a centralized network server for file storage
    and secure distribution.


    With iFolder, users'' local files automatically follow them everywhere—online,
    offline, all the time—across computers. Users can share files in multiple iFolders,
    and they can share each iFolder with a different group of users.


    Users control who can participate in an iFolder and their access rights to the
    files in it. Users can also participate in iFolders that others share with them.


    In this section, you learn the fundamentals of how to install, configure, and
    use the iFolder 3.x server, client, and iFolder Web access.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_79_0.png)


    Although the current version of iFolder in Novell OES SP2 is iFolder 3.2, iFolder
    is referred to as iFolder 3.x throughout the course documentation and workbook
    because many of the features and administration tasks refer to all versions of
    iFolder 3, and product documentation refers to the service as iFolder 3.x.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Objective 1


    # Describe the Purpose and Architecture of iFolder 3.x


    To describe the purpose and architecture of iFolder 3.x, you need to know the
    following:


    +   - Benefits of iFolder for the Enterprise

    - Benefits of iFolder for Users

    - Enterprise Server Sharing

    - How iFolder 3.x Works

    - Key Components of iFolder


    # Benefits of iFolder for the Enterprise


    Benefits of iFolder to the enterprise include the following:


    +   - Seamless Data Access

    - Data Safeguards and Data Recovery

    - Reliable Data Security

    - Productive Mobile Users

    - Cross-Platform Client Support

    - Scalable Deployment

    - Simple Data and Account Management

    - No Training Requirements


    # Seamless Data Access


    Novell iFolder greatly simplifies your IT department''s ability to keep users
    productive. It empowers users by enabling their data to follow them wherever they
    go.'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'The days of users emailing themselves project files so they can work on them
    from home are gone, as is the frustration associated sorting through different
    versions of the same file on different machines.


    iFolder stores and synchronizes users’ work in a way that no matter what client
    or what location they log in, their files are available and in the condition that
    they expect them to be.


    Users can access the most up-to-date version of their documents from any computer
    using the iFolder client or Web access.


    # Data Safeguards and Data Recovery


    With Novell iFolder, data stored on the server can be easily safeguarded from
    system crashes and disasters that could result in data loss.


    When a user saves a file locally, the iFolder client can automatically update
    the data on the iFolder server, where it immediately becomes available for an
    organization’s regular backup operations.


    iFolder makes it easier for IT managers to ensure that all of an organization’s
    critical data is protected.


    # Reliable Data Security


    With Novell iFolder, LDAP-based authentication for access to stored data helps
    prevent unauthorized network access.


    # Productive Mobile Users


    A Novell iFolder solution makes it significantly easier to support mobile users.


    VPN connections are no longer needed to deliver secure access to mobile users.
    Authentication and data transfer use Secure Sockets Layer (SSL) technology to
    protect data on wire.'
  merge: -1
  pgno: 81
- img_proc: true
