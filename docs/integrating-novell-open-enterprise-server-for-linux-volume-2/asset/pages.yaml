  md: '# Novell iManager 2.5


    Novell iManager 2.5 is a Web-based administration console that provides secure,
    customized access to network administration utilities and content.


    Before you configure the Novell iFolder 3 plug-in for iManager, iManager must
    be installed and configured.


    # Mono


    Novell iFolder 3.x requires the Mono framework for Linux.


    Mono is a development platform for running and developing modern applications.
    Based on the ECMA/ISO Standards, Mono can run existing programs that target the
    .NET or Java frameworks.


    The Mono Project is an open source effort led by Novell and is the foundation
    for many new applications.


    For details about Mono, see the Mono Project Web site at http://www.mono-project.com/Main_Page.


    The required version of Mono is included on the .iso files. Mono is installed
    automatically as a dependency of iFolder during installation of the iFolder enterprise
    server or the Web Access server.


    The iFolder clients for Linux and Macintosh also require Mono 1.1.7. The required
    version of Mono is packaged in the iFolder client installation files that you
    distribute to your users.


    Linux and Macintosh users must install both iFolder and Mono packages.


    Be sure to use the required version of Mono. If you have a different version of
    Mono on your OES Linux server, uninstall it before you install iFolder.'
