  md: '# # SECTION 7 Migrate the iPrint Service to an OES Linux Server


    In this section, you learn how to migrate iPrint from a NetWare 6.5 server to
    an OES Linux server.


    # ## Objectives


    +   1. Describe the Purpose and Architecture of iPrint

    2. Set Up and Manage the iPrint Server on OES Linux

    3. Install and Configure the iPrint Client

    4. Migrate iPrint on NetWare to OES Linux'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    Novell OES provides several end user services that have proven invaluable to enterprises
    and education.


    In this section, you learn some basic administrative information about the iPrint
    service, and you learn how to migrate an existing iPrint service on a NetWare
    6.5 server to an OES Linux server.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Objective 1


    # Describe the Purpose and Architecture of iPrint


    To describe the purpose and architecture of iPrint, you need to know the following:


    +   - What iPrint Is

    - iPrint Components on Linux

    - iPrint Components on NetWare

    - iPrint Port Usage


    # What iPrint Is


    iPrint lets mobile employees, business partners, and customers access printers
    from a variety of remote locations using existing Internet connections.


    Whether users are working in an office building, telecommuting from home, or attending
    a sales meeting in another country, iPrint ensures that they can print documents
    quickly, easily, and reliably.


    Using a web browser, users point to a web page that displays the printers available
    for installation.


    When the user selects a printer, the iPrint client is installed (if not installed
    previously), the printer''s driver is downloaded, and a printer is created on
    the user''s workstation, enabling the user to send documents to the printer from
    any application on the desktop'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# The following illustrates this process:


    # Figure 7-1


    ![](img/5c6ed3be01bd022754f15cfb45760d71_19_0.png)


    Using iPrint, mobile users no longer need to contact a busy network administrator
    to find out a printer''s name and context, and the required printer driver.


    Instead, mobile users work within a familiar web browser to locate nearby printers
    using iPrint''s Printer List web page or maps created by the administrator.


    Companies can also lower communication costs by reducing the need to fax documents
    between offices; instead, companies can use their existing Internet connections
    to print documents to remote printers.


    iPrint uses the Internet Printing Protocol (IPP), an industry standard, to eliminate
    the complexities of printing over the Internet and to make location-based printing
    a reality.


    The benefits of IPP include the following:


    +   - Uses the IP protocol

    - Provides broad vendor support

    - Works over local networks and the Internet

    - Provides for print data encryption (SSL, TLS)

    - Provides a standard print protocol for all platforms (such as Linux, Macintosh,
    and Windows)'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'For more information about IPP, see the documents available on the Printer
    Working Group web site at http://www.pwg.org/ipp/index.html.


    In addition to the benefits of IPP, Novell''s implementation of iPrint adds the
    following value:


    +   * Printer driver download and installation

    * Location-based printing

    * Browser-enabled printer installation interface

    * Customizable user interface

    * Secure information transfer


    For secure printing needs, iPrint integrates with Novell eDirectory to ensure
    that only authorized users can access the printer.


    Users are required to authenticate with their eDirectory username and password.
    Print data is also encrypted to ensure that sensitive print data is kept secure
    and unaltered.


    # iPrint Components on Linux


    iPrint on an OES Linux server consists of three main components: the Print Manager,
    the Driver Store, and the iPrint Client.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    Other supporting components include Apache Web Server, Novell iManager, and eDirectory


    # Figure 7-2


    ![](img/5c6ed3be01bd022754f15cfb45760d71_21_0.png)


    The following describes each iPrint component:


    +   * Print Manager

    * Driver Store

    * iPrint Client

    * Apache Web Server

    * Novell iManager


    # Print Manager


    The Print Manager is an object in the eDirectory tree as well as software that
    runs on an OES server. The Print Manager provides a platform for Printer Agents
    to reside on the server. Printer


    7-6 Copying all or part of this manual, or distributing such copies, is strictly
    prohibited. To report suspected copying, please call 1-800-PIRATES. Version 1'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Agents are representations of actual printers. Print jobs are submitted to
    the Print Manager; the print job is forwarded to a printer when the printer is
    ready:


    # Figure 7-3


    ![](img/5c6ed3be01bd022754f15cfb45760d71_22_0.png)


    A single Print Manager can handle print jobs for multiple printers.


    Depending on your network configuration (for example, remote locations), you can
    create additional Print Managers on other servers, but only one Print Manager
    can exist on any server.


    The Print Manager uses the following access control components to authorize users
    to print:


    +   ** Printer Agent.** The Printer Agent is an entry in the Print Manager database
    that represents the physical printer.


    When you create a printer, a Printer Agent is created in the Print Manager’s database
    and a Printer object is added to eDirectory.


    The Print Manager manages the processing of print jobs, answers queries from network
    clients about a print job or attributes of a printer, and provides SNMP (Simple
    Network Management Protocol) information that is displayed in the Print Management
    Health Monitor.


    +   **IPP server.** The IPP server’s main function is to handle IPP requests from
    the web server and deliver the requests to the Print Manager (Linux) or to the
    Broker (NetWare).


    +   **iPrint gateway.** The gateway maintains communication with the printers.
    When a printer is ready, the gateway requests print jobs from the Print Manager
    for the printer.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    The print jobs are sent to the printer using LPR over the TCP/IP protocol. Using
    SNMP, the gateway also queries printers to get their status and other printer
    information.


    # Driver Store


    The Driver Store is an eDirectory object. Only one Driver Store is required on
    a network but, depending on your network configuration, you can create additional
    Driver Stores.


    The fewer Driver Stores running, the better because you do not need to track which
    Driver Store has which drivers.


    The Driver Store is a repository of printer drivers for your print system.


    When the first user of a printer installs that printer, the Print Manager requests
    the associated printer driver from the Driver Store, and the Print Manager saves
    the printer driver to disk for future use.


    Periodically, Print Managers refresh their saved copies of printer drivers for
    the printers they are hosting with updated printer drivers from their associated
    Driver Store.


    # iPrint Client


    The following iPrint clients are available:


    +   - Linux iPrint Client

    - Macintosh iPrint Client

    - Windows iPrint Client


    # iPrint Client


    The iPrint client lets Linux workstations install iPrint clients and includes
    the following components:'
  merge: -1
  pgno: 23
- img_proc: true
  md: '+   Browser plug-in. The iPrint client contains a browser plug-in for Mozilla-based
    browsers.


    This plug-in lets you install printers through your web browser.


    +   Console utility. The Linux iPrint client includes the ipncmcd utility, which
    lets you install printers, print test pages, and upload drivers to a Driver Store
    from a console prompt.


    +   CUPS Integrator. The client integrates with the CUPS back end and uses the
    CUPS local spooler to send print jobs to the Print Manager.


    # Macintosh iPrint Client


    The Macintosh iPrint client contains a browser plug-in for the Safari web browser,
    which lets you install printers through your web browser.


    The client integrates with the CUPS back end and uses the CUPS local spooler to
    send print jobs to the Print Manager.


    # Windows iPrint Client


    The Windows iPrint client lets you install iPrint printers and configure iPrint
    on your workstation, and it includes the following components:


    +   Print Provider. The iPrint Print Provider communicates directly with the Windows
    Spooler, which takes print jobs from applications and delivers them to a print
    provider.


    Upon startup, the iPrint client ensures that the iPrint Print Provider is first
    in the list of providers.


    When a print job is destined for an iPrint printer, the iPrint Provider delivers
    the print job to the Print Manager.


    +   Browser plug-in. The iPrint client contains a browser plug-in for Mozilla-based
    browsers and Internet Explorer plug-in is an OCX plug-in that lets you install
    printers through your Web browser.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '+   * Client configuration. Through the iPrint client configuration screen,
    you can take advantage of several advanced client features.


    +   * Command line utilities. The iPrint MS-DOS commands let you install iPrint
    printers without a web browser and capture LPT ports to iPrint printers.


    These commands are useful when you have legacy applications that require output
    to an LPT port, or when you want to add printers through a login script.


    # Apache Web Server


    Apache 2.0 is the Web server for iPrint. The Web server serves HTML pages, handles
    secure (SSL/TLS) and insecure requests, and utilizes LDAP for authentication.


    # Novell iManager


    You use Novell iManager to create, configure, and manage your iPrint system.


    For complete management, including uploading printer drivers and PPD files, you
    need to access iManager from a workstation with the iPrint client installed.


    # iPrint Components on NetWare


    Novell iPrint on NetWare uses the NDPS (Novell Distributed Print Services) infrastructure.


    In addition to NDPS, iPrint uses the following components on NetWare:'
  merge: -1
  pgno: 25
- img_proc: true
  md: '+   Print broker (NetWare). This repository stores the drivers on an OES NetWare
    server for your network printers. It is the first component you configure and
    is represented by an object that you create in eDirectory.


    +   Printer drivers. These platform-specific printer drivers and PostScript Printer
    Description (PPD) files are stored in the Broker and are installed on workstations
    when users select a target printer.


    Printer drivers and PPD files exist as file structures with the Driver Store and
    broker and are not represented by objects in eDirectory.


    +   Printer objects. These eDirectory objects, which you create, store information
    about the printers available through iPrint.


    The information stored in a Printer object is used each time the associated printer
    is added to a workstation''s list of available printers.


    +   Print manager. This is an eDirectory object. On an OES NetWare server, it
    is an NLM (ippsvr.nm).


    Print manager receives print jobs from users and forwards them to the target printer
    when it is ready. It is represented by and controlled through an eDirectory object
    that you configure.


    When an eDirectory Printer object is configured as an iPrint printer, the Print
    Manager automatically loads the NLM on the server, which generates a URL for the
    printer.


    +   iPrint client. This set of browser plug-ins is installed the first time it
    interacts with iPrint. The iPrint client can be used on both Macintosh and Windows
    workstations; the Novell client is not required.


    +   HTML pages. These are used to install the iPrint software and printers as
    well to view and manage print jobs. These pages are customizable.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# iPrint Port Usage


    iPrint can use any port specified on Apache; however, iPrint defaults to two primary
    ports:


    +   - **Port 443.** All secure printing occurs over port 443 using SSL.


    +   - **Port 631.** All non-secure printing occurs over port 631.


    The iPrint client also supports TLS. If your system, including the client, is
    configured to use TLS, all secure and non-secure printing occurs over port 631.


    During OES installation of the iPrint software, the CUPS back-end components are
    disabled on the server to avoid port 631 conflicts.


    Because iPrint uses CUPS to render print jobs before sending the print job to
    the Print Manager, printing from the server itself using CUPS or iPrint is not
    available.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Objective 2


    # Set Up and Manage the iPrint Server on OES Linux


    To set up and manage iPrint on an OES Linux server, you need to know how to do
    the following:


    +   - Set Up the iPrint Server on OES Linux

    - Manage the Print Manager

    - Manage Printers

    - Manage the Driver Store


    # Set Up the iPrint Server on OES Linux


    If you select iPrint during a Novell OES server installation (the default setting),
    the iPrint software components are automatically installed on your OES Linux server.


    To set up the iPrint server, you need to do the following:


    +   - Create a Driver Store

    - Add Printer Drivers

    - Create a DNS Name for the Print Manager

    - Create a Print Manager

    - Create a Printer


    # Create a Driver Store


    You need only one Driver Store for your print system; however, depending on your
    network setup, you can add additional Driver Stores. You need to create a Driver
    Store to create a Print Manager.


    The following are general steps for creating a Driver Store:


    +   1. From iManager (on the left), select iPrint > Create Driver Store.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '+   2. Fill in the appropriate fields.


    For explanations about the fields, select **Help.**


    +   3. When you finish filling in the fields, select **OK.**


    After the Driver Store is created, and the daemon is loaded on the server, you
    can start uploading printer drivers.


    # Add Printer Drivers


    A printer driver or PostScript Printer Description (PPD) file is a software entity
    that directly supports a physical printer, enabling it to carry out its functions.


    Hardware vendors develop printer drivers and PPD files, that are specific to each
    printer. Most printers require different printer drivers for each operating system
    they interact with.


    You can view a list of the printer drivers and PPD files that you have uploaded
    to the Driver Store using iManager. You can add printer drivers and PPD files
    from diskettes, CDs, and the workstation system.


    The Driver Store daemon must be running to add resources, and the iPrint client
    must be installed on a Linux or Windows workstation.


    To add printer resources to the Driver Store, do the following:


    +   1. From Novell iManager (on the left), select **iManager : Driver Store**;
    then browse to and select the **Driver Store** you want.


    +   2. Select **Drivers**; then select the *client platform* you want to work
    with.


    +   3. Do one of the following:


    +   Add printer resources from a printer driver .inf file or PPD file by selecting
    **Add from File.**


    +   or'
  merge: -1
  pgno: 29
- img_proc: true
  md: "Add drivers from the workstation you are running iManager from selecting **Add\
    \ from System**.\n\nThe drivers installed on your workstation are made available\
    \ for upload to the Driver Store.\n\nYou can upload only drivers for the same\
    \ platform as the workstation.\n\n+   4. Select the **driver** you want; then\
    \ select **OK**.\n5. Save your changes by selecting **OK**.\n\nYou can also install\
    \ driver files from a Linux console prompt using the ipntcmd command.\n\nFor details,\
    \ see “Using ipntcmd on Linux and Macintosh,” on page 37 in the Novell OES iPrint\
    \ Administration Guide for Linux.\n\nYou can access the guide from http://www.novell.com/documentation/oes\
    \ or from the OES_Docs directory on your 3077 Course CD.\n\n# Create a DNS Name\
    \ for the Print Manager\n\nThe Print Manager creates a URL for each printer based\
    \ on the Print Manager configuration.\n\nWhen you create the Print Manager, you\
    \ can specify an IP address or DNS name for the iPrint Service.\n\nYou should\
    \ always use a DNS name because using an IP address forces users to delete and\
    \ reinstall printers if the IP address changes.\n\nTo create a DNS name (record)\
    \ for the Print Manager from OES Linux, do the following:\n\n+   1. From the OES\
    \ Linux KDE desktop, select the YaST icon.\n   A Run as root - KDE su dialog appears.\n\
    2. Enter the root **password**; then select **OK**.\n   The YaST Control Center\
    \ appears."
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Integrating Novell Enterprise Server for Linux


    +   3. From the left, select **Network Services**; from the right, select **DNS
    Server.**


    A DNS Server - Start-Up configuration page appears.


    +   4. From the left, select **DNS Zones.**


    A DNS Server - DNS Zones page appears.


    +   5. From the list, make sure that the *zone* you want associated with the Print
    Manager is selected; then select **Edit Zone.**


    The Zone Editor page appears.


    +   6. Select the **Records** tab.


    +   7. Create a record for the IP address associated with the Print Manager (normally
    the OES Linux server IP address) by entering the following:


    +   * **Record Key.** The DNS name you want associated with the Printer Manager.


    +   * **Type.** The record type (normally A record).


    +   * **Value.** The IP address associated with the Print Manager.


    +   8. When you finish, select **Add**; then continue by selecting **OK.**


    You are returned to the DNS Server - Zones page.


    +   9. From the list, reverse the lookup zone (in-addr.arpa) for the Print Manager;
    then select **Edit Zone.**


    The Zone Editor page appears.


    +   10. Select the **Records** tab.


    +   11. Create a reverse-lookup record for the Print Manager DNS name by entering
    the following:


    +   **Record Key.** The reverse of the IP address associated with the Print Manager.


    For example, if you have associated 10.200.200.2 with the Print Manager, you need
    to enter **2.200.200.**


    +   * **Type.** The record type (normally a PTR record).


    +   * **Value.** The full DNS name (including zone) of the Print Manager.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '+   12. When you finish, select Add; then continue by selecting OK.

    nYou are returned to the DNS Server - DNS Zones page.


    +   13. Select Finish.

    After the configuration is complete, you are returned to the

    YaST Control Center.


    If you are currently running the Print Manager on a NetWare server, you also need
    to configure the Print Manager on the NetWare server to use the DNS name.


    Do the following:


    +   1. From the NetWare server, press Ctrl+Esc; then display the system console
    by entering I.


    +   2. From the system command prompt, unload the Print Manager by entering the
    following:


    ```

    unload ndpsm

    ```


    A message appears indicating that the Print Manager has been unloaded.


    +   3. Load the Printer Manager by entering the following (all on one line):


    **ndpsm .printmgr.example.novell/ dnsname=printmanager.example.com**


    where .printmgr.example.novell represents the full DNS (distinguished name) of
    the Print Manager object in the eDirectory tree, and printmanager.example.com
    represents the full DNS name of the Print Manager.


    The /dnsname switch allows you configure the Print Manager to use a DNS name instead
    of an IP address.


