    | | Java Virtual Machine (JVM) | Version 1.4.1 or later |

    | | LDAP Directory | - Supports LDAP v3<br>- Supports Novell eDirectory<br>- If
    you plan to use eGuide with Novell eDirectory (formerly called NDP) as your LDAP
    directory, Novell eDirectory version 8 or later is the minimum requirement; version
    8.5 or later is required to support password security; version 8.6.2 or later
    is required to support Role-Based Services (version 8.7.1 recommended),<br>- Uses
