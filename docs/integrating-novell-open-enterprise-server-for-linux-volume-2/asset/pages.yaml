    OK.


    A User page opens displaying the user''s information.


    +   3. From the User page, select the iFolders tab; then select New.


    A Create an iFolder dialog box appears.


    The user appears in the Owner field.


    +   4. Enter a name for the iFolder.


    +   5. Create the iFolder by selecting OK.


    When the iFolder is successfully created, a subscription notification is sent
    to the iFolder Owner.


    The new iFolder is listed alone in the Search Results area.


    +   6. Select the iFolder''s name link to view its details, change the owner,
    configure its policies, share the iFolder, or modify members'' access rights.


