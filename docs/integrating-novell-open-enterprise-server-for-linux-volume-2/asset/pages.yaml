    # Create iFolders on a FAT32 Mount Point (Linux)


    On Linux, iFolder supports creating and using iFolders on a mount point for a
    FAT32 file system.


    Before you can create new iFolders or set up shared iFolders on a FAT32 volume
    on your Linux computer, the iFolder user must own the FAT32 mount point where
    you want to store the iFolders, and the /etc/fstab file must explicitly identify
    the iFolder''s local user ID for the mount point.


    This is required because FAT32 does not support file permissions. Any other file
    system that does not support permissions would have the same issue.


    For dual boot systems, you can access the data in iFolders just as you would data
    in a normal folder.


    If you set up the folder as an iFolder on both platforms, the data set is stored
    in two different iFolders on the server, which consumes twice as much of your
    allocated server disk resources.


    Because the FAT32 file system does not support POSIX file system permissions,
    make sure the iFolder user is the local owner of the mount point.


    Modify the /etc/fstab file to set the user ID (UID) of the user''s local identity
    to the iFolder user who creates iFolders on that mount point by doing the following:


    +   1. Log in to your computer as the **root user**.


    +   2. From a command prompt, create the directory where you want to mount the
    FAT32 file system by entering the following:


    ```

    mkdir /home/usernamefsmount

    ```'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'Replace username with the username of the user who plans to use the FAT32 drive
    for iFolders. Replace fsmount with the directory name you want to use as the mount
    point.


    For example, if the username is jsmith and the directory name is fat32mntnpt for
    a FAT32 drive or partition, you would enter the following:


    ```

    mkdir /home/jsmith/fat32mntnpt

    ```


    +   3. Mount the FAT32 drive at the desired mount point by entering the following:


    ```

    mount -t vfat /dev/hda1 /home/usernamefsmount

    ```


    Replace /dev/hda1 with the device or partition name of the non-Linux device. Replace
    username with the username of the iFolder user. Replace fsmount with the directory
    name you want to use as the mount point.


    For example, if the FAT32 file system (vfat) is on the hda4 device (/dev/hda4),
    the username is jsmith, and the mount point directory is /home/jsmith/fat32mntnpt,
    you would enter


    ```

    mount -t vfat /dev/hda4 /home/jsmith/fat32mntnpt

    ```


    +   4. Edit /etc/fstab by adding the uid=username parameter of the iFolder user
    on the line that defines the FAT32 mount point, such as the following:


    ```

    /dev/hda1 /home/usernamefsmount vfat uid=username

    ```


    In the jsmith example, you would modify /etc/fstab by adding uid=jsmith to the
    mount point, as in the following:


    ```

    /dev/hda4 /home/jsmith/fat32mntnpt uid=jsmith

    ```


