- img_proc: true
  md: '# Mandatory


    Some properties contain information, such as a printer''s name, network address,
    and configuration information, that is vital to the network.


    An object cannot be created without these mandatory values, and the mandatory
    values cannot be deleted. For example, the name of an object is a required property.
    (In the user object, the Last Name property is also mandatory.)


    # Optional


    Other properties contain nonvital information, such as a user''s title, telephone
    number, and street address. Objects can be created without this information, and
    this information can be added or deleted at any time without harming the object.


    Many optional properties are multivalued; that is, they can hold more than one
    value. For example, the user object property Telephone Number can contain several
    telephone numbers.


    # eDirectory Object Classes


    A class is a type of object that serves as a template for a directory object.
    A directory object is defined by a class. This definition is known as an object
    class. For instance, user and organization are object classes.


    Each class of objects has certain properties. A user object, for example, has
    Login Name, Password, Last Name, and many other properties.


    The schema defines the object classes and properties, along with the rules of
    containment (which containers can contain which objects).'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'eDirectory object classes can be divided into three categories, as shown in
    the following figure:


    # Figure A-6


    ![](img/5c6ed3be01bd022754f15cfb45760d71_344_0.png)


    The three object class categories are


    +   - Tree Object

    - Container Objects

    - Leaf Objects


    # Tree Object


    The *tree object*, also called *tree root*, is created when you install the first
    eDirectory server in your network. As the top-most container, it usually holds
    organization objects, country objects, or alias objects.


    The alias object is discussed later in this appendix.


    As a network administrator, you can make trustee assignments and grant rights
    to the entire eDirectory tree from the tree object.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Characteristics of the tree object:


    +   - There is only one per Directory and it forms the top of the eDirectory tree.


    +   - The name of the object is the tree name.


    +   - It can contain only country, organization, security, and alias objects.
    (The alias object can refer only to objects that exist in the container the alias
    object is in; in this instance, the alias object can refer to country and organization
    objects.)


    +   - It cannot be moved or deleted.


    The tree object is sometimes defined as a special type of container because its
    major function is to contain other objects (it contains the entire Directory).


    ![](img/5c6ed3be01bd022754f15cfb45760d71_345_0.png)


    > For more on the eDirectory tree, see the online documentation at www.novell.com/documentation.


    # Container Objects


    Container objects contain leaf or other container objects. They are used to logically
    group and organize the objects of your Directory.


    They can represent countries, locations within countries, companies, departments,
    responsibility centers, workgroups, and shared resources.'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'The following figure shows the most common classes of container objects:


