    # Start, Stop, and Restart the iFolder Services


    iFolder starts whenever you reboot the system or whenever you start Apache services.
    As a root user, you can start the Apache services by entering the following command:


    ```

    /etc/init.d/apache2 start

    ```


    or


    ```

    rcapache2 start

    ```


    iFolder stops whenever you stop the system or whenever you stop Apache services.
    As a root user, you can stop the Apache services by entering the following command:


    ```

    /etc/init.d/apache2 stop

    ```


    or


    ```

    rcapache2 stop

    ```


    If you need to restart iFolder services, you must stop and start Apache services.
    Avoiding the Apache restart command (such as rcapache2 restart).'
