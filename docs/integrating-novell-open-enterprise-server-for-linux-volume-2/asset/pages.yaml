  md: '# APPENDIX A eDirectory Fundamentals


    In this appendix, you are introduced to some fundamental eDirectory concepts you
    might need to know to help you understand what you are doing when completing the
    exercises in the Integrating Novell Open Enterprise Server for Linux course.


    These fundamentals include the following topics:


    +   - Purpose and Function of a Directory

    - The Role and Benefits of eDirectory

    - eDirectory Components

    - eDirectory Object Classes

    - eDirectory Object Context and Naming Conventions

    - Components of a Solid eDirectory Foundation


    If you are already familiar with eDirectory, you can use these topics as a reference
    when completing the exercises. If you are new to eDirectory, we suggest you take
    the time to read through the topics before starting the course.


    These topics are from the Fundamentals of Novell eDirectory course (Course 3017).
    If you feel you need additional training in eDirectory fundamentals, you might
    want to attend a 3017 course or purchase the self-study kit.


    For details on the self-study kit, see http://www.novell.com/training/selfstudy.html.
    For information on available classes, see http://www.novell.com/training/train_product.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_324_0.png)'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Purpose and Function of a Directory


    In this part of the appendix, you learn the following about a

    Directory:


    +   - What Is a Directory?

    - Describe the Purpose of a Directory

    - Identify Common Directory Service Users

    - Identify Key Components of a Basic Directory


    Most people are familiar with directory services such as the

    telephone directory. Telephone companies provide a directory of

    ttheir subscribers'' names, addresses, and phone numbers that allows

    telephone service users to easily contact each other.


    All the contact information is in one place—the phone

    book—which organizes the information in alphabetical order.


    Similarly, a network Directory service provides the location of

    network resources, such as file servers, printers, and applications.

    This allows network service users and administrators to easily

    connect to use or manage these network resources.


    All the network resource information is in one place—the Directory

    tree—which organizes the physical network into a logical network

    representation.


    # ## What Is a Directory?


    A Directory is a compilation of services that provide discovery,

    security, storage, and relationship management.


    A Directory should do the following:


    +   - Enable access to resources on the entire network and not just

    specific servers

    - Provide secure access to network resources'
  merge: -1
  pgno: 325
- img_proc: true
  md: '+   - Provide a scalable, indexed, and cacheable database (for performance)


    +   - Manage relationships between directory entities, such as users and the resources
    they access


    # Describe the Purpose of a Directory


    Networking provides the ability to share resources. A Directory service gives
    users a way to locate those shared resources.


    A Directory is implemented on a network operating system (NOS). In most cases,
    users don''t need to know the operating system behind the resources they access.


    System administrators, however, need to know how to communicate with the various
    operating systems, maintain current information accurately, and make all operations
    transparent to the user.


    Figure A-1


    ![](img/5c6ed3be01bd022754f15cfb45760d71_326_0.png)


    In an organization, you might find one or more NOS''s being used. As business
    organizations interact and share information, additional NOS''s may need to interact.
    Communication across these systems becomes the key to success.


    To accomplish this task, you need to look beyond networking infrastructure and
    identify the tools needed to connect a network with other resources.


    A Directory should be able to provide an enterprise-wide solution for this problem.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# Identify Common Directory Service Uses


    A full-service Directory is typically used in the following ways:


    +   - **To organize data.** A Directory service is an organized listing of data
    or information. eDirectory stores information about users


    This helps network administrators perform their jobs better.


    +   - **To provide easy access to information.** A Directory service makes information
    about network resources available to users


    Directory services give users global access to network resources. Directory services
    also help organizations manage large numbers of mobile users.


    Some network applications that need access to user information use a Directory
    to store this information. These applications are called *Directory-enabled.*


    A Directory service is useful because it provides a comprehensive and logical
    list of all network resources, such as users, applications, services, system resources,
    and devices.


    +   - **To provide security.** Organizations also use Directory services to provide
    user authentication to network resources


    +   - **To provide services to customers.** Hospitals


    The power of the Directory service helps businesses lay the foundation for e-business
    by


    +   - Putting their multiple databases in order


    +   - Simplifying disparate networks


    +   - Allowing better management of processes between customers, employees, and
    supply-chain partners'
  merge: -1
  pgno: 327
- img_proc: true
  md: 'Other services provided by Directory-enabled products include automated provisioning,
    enhanced security, customer profiling, electronic wallets, automated notification
    systems, customized web interfaces, and virtual private networks (VPNs).


    # Identify Key Components of a Basic Directory


    With the global direction of today''s economy and business practices, it is logical
    and necessary that Directories, at least in their basic structural form, follow
    certain standards.


    X.500 is an International Organization for Standardization (ISO) and International
    Telecommunication Union (ITU) standard that globally defines how Directory services
    ought to be structured at the basic level.


    Novell eDirectory, as a leading eBusiness solution, conforms to several key defining
    components of the X.500 standard.


    To effectively understand and manage eDirectory in your network, you need to understand
    the components of the X.500 Directory.'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# The following illustrates the components of the X.500 Directory:


    # Figure A-2


    ![](img/5c6ed3be01bd022754f15cfb45760d71_329_0.png)


    The X.500 Directory standard has seven essential components:


    +   - Directory Information Database (DIB)

    - Directory Information Tree (DIT)

    - Directory User Agent (DUA)

    - Directory System Agent (DSA)

    - Directory Access Protocol (DAP)

    - Directory System Protocol (DSP)

    - Directory Information Shadowing Protocol (DISP)


    # Directory Information Database (DIB)


    A Directory is made up of objects that represent physical resources in the real
    world. For example, people, servers, and printers are represented by objects in
    the Directory tree.'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'Collectively, these objects are known as the Directory Information Database
    (DIB).


    Each object, or entry, in the DIB has a distinguished name that uniquely identifies
    it. Each entry consists of one or more attributes and each attribute has a value.


    In eDirectory, the DIB is designed to be distributed on DSAs across the network.
    Unless the network is very small, the entire DIB does not exist on any one DSA
    in the network. The DIB should be logically partitioned, with different partitions
    residing on different DSAs.


    # Directory Information Tree (DIT)


    The Directory Information Tree (DIT) is a tree structure that logically represents
    and describes the collection of objects and the relationship of information in
    the DIB.


    The objects are contained in a hierarchical arrangement in this tree structure.


    For example, a person (object/entry) works for a company (object/entry) that is
    located within a country (object/entry).


    To keep the Directory organized, a set of rules is enforced to ensure that the
    DIB remains stable and intact as modifications are made to it over time.


    These rules are known as the Directory schema. They prevent entries from having
    the wrong attribute type or objects from being members of the wrong object classes.


    # Directory User Agent (DUA)


    The X.500 specification uses a client/server approach in communicating information.
    The client interacts with a server to perform specific Directory operations.'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'The Directory User Agent (DUA), acting as the client, is an application process
    that represents each user accessing the Directory. Users are people or programs
    that can read, modify, or search the Directory.


    The DUA requests information from the Directory and then relays that information
    to the user or program.


    # Directory System Agent (DSA)


    The Directory System Agent (DSA) is the server side of the client/server relationship.


    The DSA takes a request from a DUA, services the request, and sends replies to
    the DUA. If it doesn''t have the requested information, it will pass the request
    on to another DSA.


    The DSA consists of many different pieces, including components that communicate
    with other DSAs on behalf of a DUA and components that are responsible for replication
    of data between DSAs.


    In eDirectory, each DSA holds a master copy or replicated copy of one or more
    of the DIB partitions.


    # Directory Access Protocol (DAP)


    Directory Access Protocol (DAP) is the protocol that a DSA uses when it communicates
    with a DSA to make a request of the DSA.


    The APIs used to access eDirectory and the Lightweight Directory Access Protocol
    (LDAP) are examples of a DAP.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Directory System Protocol (DSP)


    If a DSA cannot fulfill the request of a DUA, the DSA passes the request to another
    DSA. The Directory System Protocol (DSP) provides the communication between the
    two DSAs.


    # Directory Information Shadowing Protocol (DISP)


    The DIB (or partition of the DIB) should be replicated to other DSAs. This improves
    the performance of requests made to the Directory and provides fault tolerance
    with a secondary (or backup) copy of the DIB.


    In eDirectory, the process of distributing the DIB is called *replication*; in
    the X.500 specification, it is called *shadowing*. The Directory Information Shadowing
    Protocol (DISP) performs the actual exchange of replicated information between
    DSAs.


    In eDirectory, replication of DIB partitions is one of the administrator’s most
    important tasks.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# The Role and Benefits of eDirectory


    Novell eDirectory is the foundation for the world''s largest identity management
    deployments—a high-end Directory service that allows businesses to manage identities
    and security access for employees, customers, and partners.


    With eDirectory, businesses lay the groundwork for secure identity management
    solutions and multiplatform network services.


    As companies increase their presence in the global market and incorporate more
    networks with multiple platforms, a scalable and diversity-friendly Directory
    is needed.


    You should become familiar with the following:


    +   * The Role of eDirectory

    * The History of eDirectory

    * eDirectory Features

    * eDirectory Platform Support

    * The eDirectory Database

    * eDirectory Application Support


    # The Role of eDirectory


    Novell eDirectory is a secure identity management solution that runs across multiple
    NOS platforms. It is Internet-scalable and extensible.


    eDirectory is a hierarchical, distributed database that provides the basic foundation
    for the Directory service, along with replication and partitioning capabilities.


    Companies use eDirectory as a means of managing users and all their network hardware
    and applications.'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'The role of eDirectory is to provide the basic foundation for the Directory
    service. This foundation provides replication and partitioning capabilities, along
    with other utilities. It also provides the following benefits:


    +   - Central management of network information, resources, and services

    - A standard method of managing, viewing, and accessing network information, resources,
    and services

    - A logical organization of network resources that is independent of the physical
    characteristics or layout of the network

    - Dynamic mapping between an object and the physical resource it refers to


    # The History of eDirectory


    NetWare Directory Services® (NDS®) was introduced with the release of NetWare®
    4.


    As Directory services expanded from the local area network to the enterprise-wide
    area network, and finally to the Internet, it became necessary for the Directory
    to be scalable and to be faster.


    When NDS 8 was introduced, a new fast and highly scalable database was implemented.


    The new Directory was renamed eDirectory because of its scalability and business-to-business
    enhancements. As the Directory has matured, it has moved to additional platforms.
    The eDirectory version is now the same across all platforms.


    eDirectory is the most powerful cross-platform Directory in the industry.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# eDirectory Features


    eDirectory does the following:


    +   - Provides centralized identity management infrastructure

    - Supports open and emerging standards

    - Enforces network-wide security dynamically

    - Incorporates a flexible security framework

    - Provides failover and disaster recovery

    - Scales to more than one billion identities

    - Manages all identities, resources, devices, and policies

    - Offers complete Web-based administration


    Some of the latest eDirectory features include


    +   - Updated administration utilities

    - New backup and restore tool

    - Additional platform support


    # eDirectory Platform Support


    eDirectory can be implemented on the following platforms:


    +   - Linux

    - NetWare

    - Solaris

    - Tru64 UNIX

    - Windows NT/2000/2003


    For complete system requirements, see http://www.novell.com/products/edirectory/sysreqs.html.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# The eDirectory Database


    eDirectory uses a highly scalable indexed database, called the Flexible Adaptable
    Information Manager (FLAIM) database, instead of a fixed-length record data store.
    It uses logs to back out and roll forward transactions in the event of a system
    failure.


    The FLAIM database also provides scalability by limiting the size of database
    files and automatically creating additional database files when necessary (see
    Figure A-3).


    Even though a Directory is a collection of information, it does not replace traditional
    Relational Database Management Systems (RDBMS). These are two different entities
    with different functions.


    Directories and databases complement one another. Directories and databases serve
    different purposes and each is optimized for their respective tasks.


    Some of the files that comprise the eDirectory database are shown in the following:


    Figure A-3


    | FLAIM |

    |(Highly Scalable Indexed Database)|


    ![](img/5c6ed3be01bd022754f15cfb45760d71_336_0.png)'
  merge: -1
  pgno: 336
- img_proc: true
  md: "# Integrating Novell Enterprise Server for Linux\n\nThe eDirectory database\
    \ files are described below:\n\n+   - **NDS.DB** is the control file for the database.\
    \ This file contains the roll-back log, which is used to abort incomplete transactions.\n\
    - **00000001.LOG** tracks transactions that have not been completed. eDirectory\
    \ uses this file as a roll-forward log to reapply completed transactions that\
    \ might not have been fully written to disk because of a system interruption.\n\
    - The roll-forward log-naming convention starts with 00000001.LOG and, as needed,\
    \ increments to FFFFFFFF.LOG.\n These files are used with the eDirectory Backup\
    \ and Restore tool, covered in this course.\n- **NDS.01** is the main eDirectory\
    \ database file. It contains all records and indexes found on the server.\n- When\
    \ this file reaches 4 GB, NDS.02 is created for the remaining data. NDS.03, NDS.04,\
    \ etc., are created as necessary.\n- NDS.xx files to 4 GB allows the database\
    \ to remain scalable yet quickly accessible.\n- A number of indexes are maintained\
    \ in the NDS.01 file, greatly enhancing performance.\n- The total database size\
    \ can grow into terabytes.\n- **Stream files** are named with hexadecimal characters\
    \ (0–9, A–F) and hold information as print job configurations and login scripts.\
    \ Stream files have an .nds extension.\n\n# eDirectory Application Support\n\n\
    Additional products that build on this basic Directory structure from Novell and\
    \ Novell partners are also available. These products fall into the following categories:\n\
    \n+   - Licensed Novell Products\n- Partner eDirectory Products"
  merge: -1
  pgno: 337
- img_proc: true
  md: "# Licensed Novell Products\n\nLicensed Novell products that leverage eDirectory\
    \ to provide collaboration, network resource management, network security, and\
    \ identity management include\n\n+   - GroupWise®\n- ZENWorks®\n- BorderManager®\n\
    - Novell Account Management\n- Novell Identity Manager (formerly DirXML™)\n\n\
    # Partner eDirectory Products\n\nPartners have developed many different products\
    \ to leverage the power of eDirectory.\n\nTo see what products work with eDirectory,\
    \ visit http://www.novell.com/partnerguide/workswith.html and select the eDirectory\
    \ link from the list on the right. \n\nA searchable product database is available\
    \ to help you locate the product you are looking for."
  merge: -1
  pgno: 338
- img_proc: true
  md: '# eDirectory Components


    eDirectory consists of a hierarchical tree structure that stores and organizes
    objects. The schema defines the objects, properties, and values that can be placed
    in the tree. The following are explained in more detail:


    +   - Tree

    - Schema

    - Objects

    - Properties

    - Values

    - Object Example


    # Tree


    The eDirectory tree is a hierarchical structure (as shown in Figure A-4) that
    stores and organizes objects. It includes the tree object and container objects.


    The eDirectory tree lets you view the logical organization of network resources
    in the Directory database.


    # Schema


    The schema defines the types of objects that can be created in your tree (such
    as users, printers, and groups) and what information is required or optional at
    the time the object is created.


    The schema that originally shipped with the product is called the base schema.
    If you modify the base schema in any way, it is considered an extended schema.'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'Many Novell products, such as iFolder, ZENWorks, and GroupWise, extend the
    schema during installation, by adding object classes and attributes that make
    it possible to manage the products through eDirectory.


    For example, iFolder adds the iFolder server object.


    # Objects


    An *object*, also referred to as an *entry*, is a unit of information about a
    resource, comparable to a record in a conventional database. eDirectory represents
    each network resource as an object in the Directory.


    Different types or categories of objects exist.


    An object can be a physical resource (workstation), an eDirectory resource (group),
    or an organizational resource (container).


    The following shows common eDirectory objects:


    Figure A-4


    ![](img/5c6ed3be01bd022754f15cfb45760d71_340_0.png)'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Properties


    A *property*, also referred to as an *attribute*, is a category of information
    you can store about an object. Each eDirectory object consists of properties that
    can be used to store information about the resource.


    A particular collection of properties defines or makes up the class of an object.
    For example, a workstation object differs from a user object in the properties
    it contains, and, therefore, how the object can be used.


    Workstation objects do not have a username like a user object. Workstation objects
    cannot belong to group objects or role objects like a user object.


    Object classes and properties are defined and controlled by the eDirectory schema.


    > The terms *object* and *property* are used when referring to the hierarchical
    structure of eDirectory. The term *entry* and *attribute* are sometimes used interchangeably
    with object and property and typically refer to the underlying database.


    # Values


    A *value* is the data within a property.


    For example, a user object has an attribute, or property, called Last Name, which
    in turn has a value, such as Johnson.


    # Object Example


    In the following figure, a printer is represented by a printer object. The properties
    associated with the printer object include Name, Description, and Location. The
    values for these properties are Payroll_Printer, PostScript Laser, and Room 305,
    respectively.'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'A user is represented as a user object. Like the printer object, the user object
    has properties associated with it. These properties include Login Name, Title,
    and Telephone.


    All eDirectory objects, like the printer object and user shown in the following,
    have properties and values:


