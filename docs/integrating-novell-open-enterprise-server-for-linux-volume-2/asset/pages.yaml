  md: '# Post Migration Tasks


    When you are finished migrating your iPrint system, you might need to perform
    several tasks to complete the migration. This is especially true when migrating
    an iPrint system from a NetWare server to a Linux server.


    These tasks include the following:


    +   - Edit the DNS records for the Print Manager. You should have DNS records
    (an A record and a PTR record) configured on your DNS server for the Print Manager.


    These records are associated with an IP address that you need to change to reflect
    the IP address of the OES Linux server hosting the Print Manager.


    +   - Shut down the iPrint Broker and Print Manager on the NetWare server. To
    make sure that future iPrint activity is directed to the iPrint service on the
    OES Linux server, you should shut down the iPrint Broker and Print Manager on
    the NetWare server.


    You can do this by entering the following commands:


    ```

    unload ndpsm

    ```


    ```

    unload broker

    ```


    +   - Modify the autoeec.ncf file on the NetWare server. Besides unloading the
    iPrint Broker and Print Manager, you will probably want to comment out or delete
    the command lines in the autoeec.ncf file to prevent these services from loading
    the next time you shut down or restart your NetWare server.


    +   - Delete the printer objects for the DA2 NetWare server. Although this is
    not necessary, we recommend removing all objects from an eDirectory tree that
    are no longer useful to prevent any confusion when performing eDirectory configuration
    and maintenance tasks.'
  merge: -1
