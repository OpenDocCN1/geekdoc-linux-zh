  md: '# Decide Which OES Platform Is Best Suited to Provide These Services


    To help you better assess Novell OES platform can best meet your network service
    needs, you should consider inherent platforms strengths of Linux and NetWare and
    the differences in the service offerings on each platform.


    The following topics help you make this assessment:


    +   - Platform Strengths

    - Service Differences on the OES Platforms


    # Platform Strengths


    Although Novell OES Linux and OES NetWare provide a full set of Novell network
    services, there are differences the platforms that you need to consider when implementing
    Novell OES:


    | Table 11-2 | OES NetWare | OES Linux |

    |---|---|--|

    | Brief description | Novell''s award-winning network-optimized operating system.
    | Novell''s award-winning Linux operating system. |

    | Recognized strengths | - Reliability -n Scalability -n Security | - Open application
    environment -n Flexibility -n Versatility |'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# OES NetWare


    # OES Linux


    (continued) Table 11-2


    | Business value propositions (continued) | NetWare excels when the user population
    and management burden is highly distributed: | SLES 9 is well suited as an application
    server Linux-based solutions: |

    |---|---|--|

    | | Increases network availability | Runs thousands of programs available from
    the open source community |

    | | Optimizes manageability | Delivers OES file and print services |

    | | Enhances user productivity | Hosts open source Web servers, proxy servers,
    and mail servers |

    | | Runs Apache, Tomcat, MySQL, and other OpenSource applications | |


    # Service Differences on the OES Platforms


    In addition considering platform strength, you should understand the following
    differences in the features available when services are running on OES Linux or
    OES NetWare:


    +   **DHS/DHCP.** NetWare DNS/DHCP services are far richer than the basic DNS/DHCP
    functionality available in the standard DNS implementation.


    Many organizations find Linux DNS/DHCP services to be completely adequate.


    On the other hand, some organizations, especially those who currently leverage
    the advanced services available on NetWare, might be frustrated by the Linux implementation
    of DNS/DHCP and find it inadequate for their needs.


    +   **Novell Storage Services (NSS).** When deploying NSS, you might want support
    for volume encryption or Novell Distributed File Services (DFS) so you move or
    split NSS volumes.'
  merge: -1
