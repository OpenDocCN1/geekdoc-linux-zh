    # Prerequisites and Installation Guidelines


    The following are prerequisites and guidelines for this release of Novell iFolder
    3.x and the iFolder client included in Novell OES SP2.

    Before installing and configuring iFolder, make sure that your system meets the
    requirements in each of the following categories:


