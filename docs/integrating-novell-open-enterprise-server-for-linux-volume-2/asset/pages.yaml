  md: '5. When you finish, select OK.


    After the Driver Store is created and the daemon is loaded on the server, you
    can start adding printer drivers.


    # Create a Printer


    After you have created a Print Manager, you can create a printer by doing the
    following:


    +   1. From iManager (on the left), select iPrint > Create Printer.


    +   2. Follow the prompts and fill in the fields.


    You can view explanations about the fields by selecting Help.


    +   3. When you finish, select Next; then select the drivers for this printer.


    If the printer drivers for this printer are not listed, you can still create the
    printer.


    After the printer is created, add the printer drivers to the Driver Store, and
    then associate the drivers to the printer by selecting Manage Printer > Drivers.


    +   4. When you finish, create the printer by selecting Next.


    # Manage the Print Manager


    The Print Manager uses a database to store information about the printers it controls.
    The database creates a backup every night at midnight and when you create or delete
    a printer.


    The last four backups are saved. When a new backup file is created, the oldest
    of the four stored files is deleted. If the oldest backup file is older than four
    days, then the Print Manager creates a new backup.'
