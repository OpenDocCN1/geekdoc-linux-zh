    # Delete an iFolder


    If you delete an iFolder from your collection, it deletes the local copy of the
    iFolder and its contents. It can also affect the share relationship for the iFolder,
    depending on the Access right you hold for it.


    Deleting an iFolder does not uninstall the iFolder client from your workstation.


    To delete an iFolder, do the following:


    +   1. From a file manager or iFolders browser, locate the iFolder you want to
    delete.


    +   2. Right-click the iFolder; then select Delete.


    The following outlines the effect on the share relationship and the member iFolders
    based on the Access right of the user who deletes the iFolder:'
  merge: -1
