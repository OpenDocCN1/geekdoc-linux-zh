  md: '# Table 8-13


    | Parameter | Description |

    | --- | --- |

    | Space Limit | Specifies the maximum total space (in MB) that a user''s iFolder
    data is allowed to use, across all iFolders the user owns.


    A user quota supersedes system-wide quota, regardless of whether the user quota
    is larger or smaller than the system-wide quota.


    The user quota can then be limited, but not increased by a policy on an iFolder.


    IMPORTANT: Users cannot successfully synchronize files of a size that would cause
    a quota to be exceeded. If they try to do so, only part of the file is synchronized,
    resulting in data corruption.


    If the total space consumed by iFolder data is nearing an effective quota (system,
    user, or iFolder), the user should stop synchronizing files until one or more
    of the following tasks results in enough space to safely synchronize the user''s
    files in the iFolder where the file resides:

    - The system-wide quota, user quota for the iFolder owner, and the iFolder quota
    are modified as needed.

    - Files are moved from any of the iFolders owned by the user to another location
    where they no longer affect the effective quota, or files are deleted to clear
    space.'
  merge: -1
