  md: '# Recover Individual Files or Directories


    To recover individual files or directories for a user from the Simias data collections,
    do the following:


    +   1. Collect information that uniquely identifies the file or directory to be
    recovered, such as a combination of the following:


    +   - iFolder name, such as MyiFolder

    - iFolder owner

    - iFolder member list

    - Relative path of the file or directory, such as /MyDir1/MyDir2/myfile.txt

    - Time stamp or approximate time of the version deired

    - Other files or directories in the iFolder


    +   2. Log in to iManager with the Admin **username** and **password**.


    +   3. Under Roles and Tasks, expand Novell iFolder 3; then select **iFolders.**


    +   4. If prompted, connect to the iFolder server where the store is entering
    by the name of the iFolder server and iFolder Admin **username** and **password**.


    +   5. From the Search for iFolders page, search for the target **iFolder** (such
    as MyFolder).


    +   6. Under Search Results, select the **Name** link of the target iFolder; then
    note the path to its root directory.


    For example:


    ```

    /var/opt/novell/ifolder3/simias/SimiasFiles/62ba1844-6987-47fc-83ab-84bbd5d6130b/MyiFolder

    ```


    +   7. From the iFolder server, use your normal file system restore procedures
    to restore the target file or directory from backup to a temporary.


    For example, restore


    ```

    /var/opt/novell/ifolder3/simias/SimiasFiles/62ba1844-6987-47fc-83ab-84bbd5d6130b/MyiFolder/MyDir1/MyDir2/MyFile

    ```'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'Integrating Novell Enterprise Server for Linux


    to


    /tmp/MyFile


    Do not restore the file to its original location, or to any location under the
    Simias store directory.


    +   8. Use one of the following methods to restore the recovered file to the target
    iFolder:


    +   Via email. Send the restored files or directory to the iFolder owner or to
    any member who has the Write right to the iFolder.


    For example, email the recovered file, such as /tmp/MyFile, to the user.


    A user with the Write right can restore the file to an iFolder simply by copying
    it back to the appropriate location on an iFolder client.


    For example, copy MyFile to /home/username/MyiFolder/MyDir1/MyDir2/MyFile.


    +   Via web access. Do the following:


    +   a. In iManager, expand the Novell iFolder 3 role and select Folders.


    +   b. Search for the iFolder you want to manage; then select the Name link for
    the iFolder.


    +   c. On the iFolder page, select Members; then add yourself as a member of the
    iFolder.


    +   d. From a web browser, log in to iFolder 3.x Web Access.


    +   e. Browse to locate and open the iFolder; the directory where the files were
    originally located, and upload the file to the iFolder.


    For example, upload MyFile to MyiFolder/MyDir1/MyDir2/MyFile.


    If necessary, create the directory you want to restore to, and then upload the
    files in it.


