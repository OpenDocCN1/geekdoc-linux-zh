  md: '| Table 8-23 Access Right of the User Who Deletes the iFolder |

    | Owner | Effects |

    | --- | --- |

    | | Ends the share relationship for the iFolder:<br>- Server copy of the iFolder:
    Deletes the iFolder metadata and contents from the server.<br>- Member copies
    of the iFolder: Reverts the iFolder to a normal folder for all users. |

    | Full Control User | Unsubscribes the user from the share:<br>- Server copy of
    the iFolder: No effect.<br>- Member copies of the iFolder: Reverts the local copy
    of the iFolder to a normal folder. |

    | Read/Write User | Unsubscribes the user from the share:<br>- Server copy of
    the iFolder: No effect.<br>- Member copies of the iFolder: Reverts the local copy
