    # How to Create SSH Storage Location Objects


    A new file access method has been added to NetStorage that allows access to files
    on Linux systems that do not support either NCP or CIFS protocols.


    This method uses the Secure Shell (SSH) protocol to access files on Linux systems.
    SSH is accessed by creating an Directory Location object with a URL prefix of
    ssh://, such as the following:


    ```

    ssh://yourserver.yourcompany.com/home/youruser

    ```


    The username and password that you use to access files on your Linux system must
    be the same as those used to log in to NetStorage.


    You can use the SSH file access method with NetStorage to access files locally
    on your Linux system if NetStorage is running on that system.


    To do this, create a Storage Location object that uses the IP address of the local
    Linux machine with the ssh:// prefix.'
  merge: -1
