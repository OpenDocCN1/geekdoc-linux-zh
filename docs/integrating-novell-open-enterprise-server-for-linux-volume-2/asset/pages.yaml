- img_proc: true
  md: '# How to Create Storage Location Objects and Lists


    After installing NetStorage, you might be able to see only your iFolder 2.x directory
    and a local shared directory on the Linux server using NetStorage.


    Storage Location objects are required for accessing files and directories on Linux
    servers unless the NCP server component of OES installed. They can also be used
    on NetWare servers.


    Without an NCP server, users might have specific eDirectory rights to certain
    files and folders on your network but they will not be able to access those files
    and folders using NetStorage unless storage location objects have been created.


    To create Storage Location objects and lists, you need to know the following:


    +   - How to Create a Storage Location Object

    - How to Create a Storage Location List

    - How to Create SSH Storage Location Objects


    # How to Create a Storage Location Object


    To create a Storage Location object, do the following:


    +   1. Start a supported web browser (such as Internet Explorer or Mozilla Firefox);
    then enter the URL for iManager:

    **https://server_ip_address/nps/iManager**

    Replace server_ip_address with the IP address or DNS name of the server running
    NetStorage, or the IP address for Apache-based services.

    2. Log in to iManager with an administrator username and password.

    3. From the left, expand File Access (NetStorage); then select Storage Location.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# A Storage Locations : Create Object page appears on the right:


    Figure 10-6


    Storage Locations: Create Object


    Create a Storage Location object to display a specified name for a network directory
    in the NetStorage access list displayed through Microsoft Web Folders or a Web
    browser.


    | Object Name: | |

    | DisplayName: | |

    | Directory Location: | |

    | Context: | |

    | Comment: | |


    4. Enter the following:


    +   * Object Name. The name of the object in the eDirectory tree.


    +   * DisplayName. The name displayed in the NetStorage directory access list.
    This is the shortcut name and is seen by users.


    +   * If you use the same display name for two different Storage Location objects,
    a digit is added to the names to make each name unique.


    +   * Directory Location. The location of the directory on the file system. The
    location is a URL that includes the file system type, server name, volume, and
    directory path.


    If the storage being accessed is on a NetWare server, the URL must be in the following
    format:


    ```

    ncp/server_name/volume/path_to_directory

    ```


    For example


    ```

    ncp/da2.da.com/data/reports

    ```


    or


    ```

    ncp/10.200.200.2/data/reports

    ```'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'If the storage being accessed is on a Linux server, the URL must be in one
    of the following formats:


    +   - ncp://server_name/volume/path_to_directory


    This method requires that the NCP server component of OES be installed on your
    Linux server. A storage location using this format can only access files on NCP
    or NSS volume.


    +   - cifs://server_name/cifs_share_name


    You can only use this method if you have configured CIFS or Samba share (cifs
    can be interchanged with smb in the format).


    +   - ssh://yourserver.yourcompany.com/home/youruser


    This method allows access to files on Linux systems that don''t support either
    NCP or CIFS (SMB) protocols.


    If the file system is omitted, it is assumed that it is NCP.


    +   - **Context.** The directory context that the Storage Location resides in.
    Use the Object Selector icon (to the right of the field) to select and enter the
    context.


    +   - **Comment.** You can enter a comment that is not displayed to users.


    5. When you finish, select **Create**; then select **OK**.


    # How to Create a Storage Location List


    After you create a Storage Location object, you must create a list of Storage
    Location objects that can be used with a specified User, Group, Profile, or Container
    object.


    Users will see the directory associated with the object the next time they log
    in to NetStorage.'
