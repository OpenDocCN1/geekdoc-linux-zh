  md: "# Install and Configure iFolder on OES Linux Server\n\nThe Execution Time-Out\
    \ and Maximum Request Length parameters must be configured with compatible settings\
    \ in the /opt/novell/ifolder3/web/web.config file for the iFolder enterprise server\
    \ and in the /opt/novell/ifolder3/webaccess/Web.config file for the Web Access\
    \ server.\n\nThe settings in Web.config for the enterprise server must be the\
    \ same size or larger than the settings in ../webaccess/Web.config for the Web\
    \ Access server.\n\nFor example, the following code is the httpRuntime element\
    \ with the default settings in the ../webaccess/Web.config file for Web Access:\n\
    \n```\n<httpRuntime\n    executionTimeout=\"180\"\n    maxRequestLength=\"10240\"\
