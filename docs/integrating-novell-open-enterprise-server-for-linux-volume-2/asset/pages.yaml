    +   - Configure the HTTP runtime parameters. Two HTTP runtime parameters—Execution
    Time-Out (ExecutionTimeout) and Maximum Request Length (maxRequestLength)—can
    affect the successful upload of a file to the Web Access server.


    The following describes the run time parameters and their default values:


    # Table 8-12


    | Parameter | Description |

    | --- | --- |

    | executionTimeout | The interval of time in seconds to wait between the command
    and the successful execution where the file is stored on the iFolder enterprise
    server. The default time out is 3 minutes.

    Default Value: 180 (seconds) |

    | maxRequestLength | The maximum file size in bytes that a user is allowed to
    upload to the server via the Web Access server.

    The default maximum size is 10 MB for Web access. This maximum is a hard limit.
    You can modify the maximum length for any value up to 10 MB.

    Default Value: 10240 (KB) |


    Using Web Access, a user can upload a local file to the user’s iFolder on the
    enterprise server.


    If the file does not upload successfully before the interval times out or if the
    file size exceeds the allowed maximum, the upload is stopped and reported as a
    failure.


    Because the web browser is controlling the errors, a problem of timing out or
    exceeding the maximum size might result in a Bad Request or other generic error.'
