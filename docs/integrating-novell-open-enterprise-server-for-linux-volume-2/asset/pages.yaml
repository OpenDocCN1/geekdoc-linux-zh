    by default in eDirectory 8.7.1 |

    | | Browser for eGuide Administration Utility | - Netscape* 7 or later<br>- Internet
    Explorer 5.5 SP2 or later |

    | | Browser for eGuide Client | - Netscape 4.8 or later (version 7 recommended)<br>-
    Internet Explorer 5.0 or later (version 6 recommended) |


    # ## How eGuide Works


    You can configure eGuide to publish any information that you store in eDirectory.


    For example, the default eGuide installation in OES lets users search for the
    names of all eDirectory user objects on your system. It lets users see the details
    for their own user objects that are stored in eDirectory, but it doesn''t let
    them modify the eDirectory information.'
