    Server resource management (eDirectory)


    eDirectory on NetWare manages resources. For example, you can view and modify
    file system information, manage files and folders on NetWare volumes, salvage
    and purge deleted files, allocate volume space, and create objects to facilitate
    file management.


    See "Managing Objects" on page 87 in the Novell eDirectory 8.7.3 Administration
    Guide (edir83.pdf).


    You can access the guide from http://www.novell.com/documentation/oes or from
    the OES_Docs directory on 3077 Course CD.


    The current version of eDirectory for Linux does not support management of server
    resources.


    SLP


    Available on both platforms with some functional differences.


    OES Linux uses OpenSL.


    OES NetWare uses Novell SLP by default, which provides synchronization between
    DAs that are in the same eDirectory context.


    Alternatively, you can implement OpenSL for eDirectory. Be aware, however, that
    DA synchronization is not supported in OpenSL.


    OpenSL on Linux is not customized to provide DA synchronization.


