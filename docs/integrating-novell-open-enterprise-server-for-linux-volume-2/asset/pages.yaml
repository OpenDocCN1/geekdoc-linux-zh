    # Novell eDirectory 8.7.3


    Novell eDirectory 8.7.3 is a secure identity management solution that provides
    centralized identity management, infrastructure, Net-wide security, and scalability
    to all types of applications running behind and beyond the firewall.


    It natively supports the directory-standard Lightweight Access Protocol (LDAP)
    3 and provides support for TLS/SSL services based on the OpenSSL source code.


    eDirectory is available as a component of Novell OES.


    Before you configure iFolder, eDirectory must be configured and running. In iFolder,
    you specify LDAP containers and groups that contain user objects of users that
    you want to be iFolder users. you must create contexts and define users in eDirectory.


