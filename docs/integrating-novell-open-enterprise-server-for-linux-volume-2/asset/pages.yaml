  md: '# Integrating Novell Open Enterprise Server for Linux


    For information on using the iPrint Map designer, see "Creating Location-Based
    Maps with iPrint Map Designer" on page 49 in the Novell OES iPrint Administration
    Guide for Linux.


    You can access the guide from http://www.novell.com/documentation/oes or the OES_Docs
    directory on your 3077 Course CD.


    # Configure the iPrint Client Settings


    To configure iPrint client settings, you need to know how to do the following:


    +   - Use a Proxy Server

    - Manage Passwords for Remote iPrint Servers

    - Manage iPrint’s System Tray Icon

    - Manage Print Job Notifications


    # Use a Proxy Server


    A proxy server sits between a client and another server that the client is trying
    to communicate with.


    Often proxy servers are used in conjunction with a firewall to keep internal addresses
    private while only exposing the proxy server’s address to external users.


    If you are using a proxy server and have users who need to submit print jobs through
    a proxy server, you can use the iPrint client’s Proxy setting.


    The client sends all print-related requests, such as a print job, to the proxy
    server. The proxy server then redirects the print job to the correct iPrint server.


    For example, Juan is a laptop user and has installed and printed to a variety
    of iPrint printers at the company’s headquarters.'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'While on the road, Juan wants to submit a report to his boss. Rather sending
    the report by e-mail or fax, Juan decides to send it to the printer near his boss.


    When he tries to send the report to the printer, he receives an error that the
    printer cannot be found. He knows that the company uses a firewall and a proxy
    server.


    He types the proxy server address in the iPrint Proxy settings, and then tries
    to print the report again. This time the print job is accepted.


    The print job travels from his laptop to the proxy server. The proxy server redirects
    the print job to the printer''s Print Manager, where the print job is spooled
    and forwarded to the printer.


    To set the proxy server address in iPrint, do the following:


    +   1. Select Start > Programs > Novell iPrint > iPrint Settings > Proxy.

    2. Select the check box; then enter the URL for the proxy server.

    3. Select OK.


    To disable using a proxy server, deselect the check box.


    # Manage Passwords for Remote iPrint Servers


    You can manage passwords for print services that you indicate should be remembered
    by your workstation. The ability to delete passwords is useful if you are connected
    to a print service that no longer use.


    To manage passwords for print services, do the following:


    +   1. Select Start > Programs > Novell iPrint > iPrint Settings > Passwords.

    2. Select the password you want to remove; then select Clear Password.'
  merge: -1
