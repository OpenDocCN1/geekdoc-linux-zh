    | Allow Save Credentials | Select this setting if you want users to see a Remember
    Login Information checkbox on the Login page. If a user selects this option, the
    user''s validated credentials are encrypted and stored in a cookie on the workstation.
    The user can then load eGuide multiple times without logging in each time. The
    cookie is removed when the user selects the Logout icon after the cookie expiration
    time passes. |

