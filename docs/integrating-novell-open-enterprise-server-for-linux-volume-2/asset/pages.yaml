  md: '# Integrating Novell Open Server for Linux


    You have finished configuring the Print Manager.


    # Create a Print Manager


    You need to create at least one Print Manager for your print system, however,
    depending on your network setup, you can create additional Print Managers (for
    example, across a WAN link).


    The Print Manager must be running in order to create printers.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_33_0.png)


    The Print Manager creates a URL for each printer based on the Print Manager configuration.


    When you create the Print Manager, you can specify an IP address or DNS name for
    the iPrint service.


    You should always use a DNS name because using an IP address forces users to delete
    and reinstall printers if the IP address changes.


    A Driver Store must exist before you create a Print Manager.


    To create a Print Manager, do the following:


    +   1. Make sure you have configured a DNS name for the Print Manager

    2. From iManager (on the left), select iPrint > Create Print Manager.

    3. Fill in the appropriate fields.

    To view explanations about the fields, select Help.

    4. Make sure the Start Print Manager after Creation checkbox is selected.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_33_1.png)


    If you do not select this option, you have to start the Print Manager by using
    Manage Print Manager > Manager Control in iManager or by entering /etc/init.d/novell-ipsmd
    start at a shell prompt.


    7-18

