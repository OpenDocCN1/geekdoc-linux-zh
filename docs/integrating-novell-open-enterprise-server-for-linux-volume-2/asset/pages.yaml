  md: '# eDirectory Object Context and Naming Conventions


    To understand the flow and design of an eDirectory tree, you need to know the
    following:


    +   - What Context Is

    - Object Naming Conventions


    # What Context Is


    Context can be defined as


    +   - An Object’s Position in the eDirectory Tree

    or

    - A Position You Navigate to in the eDirectory Tree After Logging In


    # An Object’s Position in the eDirectory Tree


    When used to define an object''s position in the eDirectory tree, the context
    is a list of container objects leading from the object to the tree object. (Locating
    an object through the context is similar to locating a file using the directory
    path.)'
  merge: -1
  pgno: 357
- img_proc: true
  md: 'For example, in the following figure, the difference between the two BJohnson
    objects is their context. The user object on the left is in SLC container; the
    user object on the right is in DA container.


    # Figure A-10


    ![](img/5c6ed3be01bd022754f15cfb45760d71_358_0.png)


    An eDirectory tree cannot have two leaf objects with the same name in the same
    container. However, an eDirectory tree can have two leaf objects with the same
    name in different containers because their context is different.


    The context for the BJohnson object on the left is BJohnson.SLC.DA; the context
    for the BJohnson object on the right is BJohnson.DA.


    # A Position You Navigate to in the eDirectory Tree After Logging In


    When you navigate to another location in the eDirectory tree, your context is
    your current position, or current context, in the tree. It is not where your user
    object resides in the eDirectory tree.


    Current context


    +   - Affects how much of an object’s distinguished name (explained later in this
    section) you must provide with a command to access the resource.


    +   - Identifies the default eDirectory container for your workstation in the
    Novell client (if you didn’t change your context after logging in).'
  merge: -1
  pgno: 358
- img_proc: true
  md: '+   - Allows you to refer to an object in your current context by its common
    name because your current context and the object’s context are the same.


    Current context is sometimes referred to as name context.


    # # Object Naming Conventions


    Naming conventions allow you to precisely identify and locate objects in your
    tree.


    For example, in the following figure, two user objects named BJohnson exist in
    separate containers in the Directory. If you log in as BJohnson, which user object
    would eDirectory use?


    Figure A-11


    ![](img/5c6ed3be01bd022754f15cfb45760d71_359_0.png)


    You, or your workstation, must provide eDirectory with enough information to locate
    the object in the eDirectory tree. You specify this information in the object
    name.


    Each object name exactly identifies an object in the eDirectory. So, in the figure
    above, the exact names are different because their object names contain information
    that identifies their locations in the eDirectory tree.


    To understand object names, you must understand


    +   - Object Name Attributes


    +   - Object Naming Rules'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Object Name Attributes


    The name of each object you create in the eDirectory tree consists of the following:


    +   - Name Attribute type

    - Name Value


    The attribute type of the object name determines if the object will be accessed
    as a container or leaf object in the eDirectory tree.


    The value of the object is the name you enter for the object you create it.


    The following name attribute types are assigned to the most common eDirectory
    objects:


    | Table A-4 | Attribute Types | Description | Example |

    |---|---|---||

    | C | Country | C=IR (IRELAND) |

    | O | Organization Name | O=DA |

    | OU | Organizational Unit Name | OU=SLC |

    | CN | Common Name | CN=BJohnson (includes all leaf objects) |


    Name attribute types


    +   - Distinguish between the different container types and leaf objects.

    - Appear before the object they identify.

    - Have an equal sign (=) placed between the attribute type abbreviation and the
    object.

    - Are optional (see “Typeless Naming” on A-43, but help to avoid problems that
    can occur with typeless naming.'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'A leaf object''s common name (CN) is the name shown next to the leaf object
    in the eDirectory tree.


    For example, the common name for both user objects in the following is BJsonObject:


    # Figure A-12


    ![](img/5c6ed3be01bd022754f15cfb45760d71_361_0.png)


    The CN attribute applies to all leaf objects. Any server, group, or other leaf
    object is named CN=value.


    When users need to access a resource such as a server in the eDirectory tree,
    the common name for the server object must be included in the request.


    To use a resource outside the user''s parent container, the user must change his
    or her location, or context, in the eDirectory tree.


    # Object Naming Rules


    Before you specify an object by its name, you must understand object naming rules.
    You can specify the object by using the following:


    +   - Distinguished Name

    - Relative Distinguished Name

    - Typeful Naming'
  merge: -1
  pgno: 361
- img_proc: true
  md: '+   - Typeless Naming


    # Distinguished Name


    An object''s *distinguished name* is a combination of its common name and its
    context. This identifies the object all the way to the top, or root, of tree.
    Using Figure A-13 as an example, the distinguished name must include the path
    up to O=DA.


    An object is exactly identified with a distinguished name. Two objects cannot
    have the same distinguished name.


    Figure A-13


    ![](img/5c6ed3be01bd022754f15cfb45760d71_362_0.png)


    In the figure above, the distinguished name for the user object BJohnson in the
    organizational unit SLC in the organization DA as follows:


    .CN=BJohnson.OU=SLC.O=DA


    The distinguished name for the user object BJohnson in the organization DA is
    as follows:


    .CN=BJohnson.O=DA'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'A distinguished name starts with a leading period. The objects in the name
    are separated by periods, similar to the way names are separated by backslashes
    in DOS paths.


    The names of all objects, from the tree object to the object being named, included
    in the distinguished name.


    # Relative Distinguished Name


    A relative distinguished name


    +   Lists the path of objects leading from the object being named to the container
    representing the object’s current context, or current location, in the eDirectory
    tree.


    +   Does not start with a leading period.


    +   Uses periods to separate objects in the name.


    +   Can use a trailing period.


    > See Novell eDirectory online documentation at http://www.novell.com/documentation/edir873/index.html
    for more information on trailing periods.


    ![](img/5c6ed3be01bd022754f15cfb45760d71_363_0.png)'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'For example, if your current context is O=DA, you can refer to BJJohnson user
    object as shown in the following:


    # Figure A-14


    ![](img/5c6ed3be01bd022754f15cfb45760d71_364_0.png)


    When you use a relative distinguished name, eDirectory must build a distinguished
    name from it. This is accomplished by appending the relative distinguished name
    to the current context:


    Relative Distinguished Name + Current Context = Distinguished Name


    In the following examples, a different current context creates a different distinguished
    name when the same relative distinguished name is submitted:


    | Name Submitted | Current Context | Resulting Distinguished Name |

    |---|---|--|

    | CN=BJJohnson | O=DA | .CN=BJJohnson.O=DA |

    | CN=BJJohnson | OU=SLC.O=DA | .CN=BJJohnson.OU=SLC.O=DA |'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# Integrating Novell Open Server for Linux


    A common name (CN) is a relative distinguished name.


    A trailing period serves as a shorthand way of changing the current context. Simply
    put, a trailing period removes the leftmost container from the current context.


    For example, the user CN=BJJohnson.O=DA is in a situation where the current context
    on the client machine he is using is OU=SLC.O=DA.


    If he simply logs in CN=BJJohnson, the current context will be appended to his
    name and eDirectory will see him as CN=BJJohnson.OU=SLC.O=DA. This is not how
    he wants to authenticate.


    The simplest way to log in as the correct user is to put a trailing period at
    the end of his relative distinguished name, like this:


    CN=BJJohnson.


    The trailing period removes the leftmost container from the current context, which
    changes the current context from OU=SLC,O=DA to O=DA. He then gets logged in as
    CN=BJJohnson.O=DA.


    # Typeful Naming


    A typeful name uses attribute abbreviations (such as CN or OU) to distinguish
    between the different container types and leaf objects in an object''s distinguished
    or relative distinguished name.


    Although not mandatory, attribute types help avoid the confusion that can occur
    with typeless naming (explained next).


    For example, the following is a typeful name:


    .CN=BJJohnson.O=DA'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Typeless Naming


    A typeless name (the most popularly used naming convention) does not include the
    object attribute type. For example, the typeless distinguished name for .CN=BJohnson.OU=SLC.O=DA
    is


    .BJohnson.SLC.DA


    If you do not provide a typeful object name, eDirectory calculates attribute types
    for each object. The objects cannot be located if the utility places the wrong
    attribute on the object.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# Components of a Solid eDirectory Foundation


    To learn about the components of a solid eDirectory foundation, you need to know
    the following:


    +   - The eDirectory Foundation Model

    - eDirectory Network Configuration Recommendations


    # The eDirectory Foundation Model


    Good design principles are the foundation for a smoothly-running eDirectory system.
    eDirectory can only perform at its best when the infrastructure where it resides
    is operating efficiently.


    eDirectory relies on a foundation of error-free communications, accurate time
    synchronization, and efficient replica synchronization.


    When the underlying services are designed to operate smoothly, eDirectory operates
    at its best. When the underlying services are not designed to operate smoothly,
    the poor performance of these services results in poor eDirectory performance.


    The following diagram illustrates the foundation services on which eDirectory
    relies for smooth operation:


    ![](img/5c6ed3be01bd022754f15cfb45760d71_367_0.png)


    Time synchronization and replica synchronization depend upon a foundation of solid
    network communication. Without solid communication, these services cannot function
    well.'
  merge: -1
  pgno: 367
- img_proc: true
  md: 'Replica synchronization operates independently of time synchronization, but
    it relies on accurate time stamps to make sure that replicas are synchronized
    properly.


    With these foundation services in place and functioning properly, eDirectory is
    able to function smoothly and efficiently. Without them, eDirectory will not be
    able to function at its best, and might not function at all.


    Once network communications are established on your Linux servers, you can configure
    your time synchronization, and then eDirectory can be installed.


    The eDirectory foundation model might imply that you must establish replica synchronization
    before you install eDirectory. As you proceed through the course, you will learn
    that replica synchronization cannot be configured or monitored until after eDirectory
    is installed.


    # eDirectory Network Configuration Recommendations


    Linux servers, like Windows servers and workstations, subnet mask, gateway address,
    and be configured to receive an IP address, and a host and domain name dynamically
    through DHCP.


    However, Novell strongly recommends that eDirectory servers by statically configured.
    The eDirectory service itself does not require it, but the services that use eDirectory
    are much easier to maintain if the IP address is static.


    Also, it is easier to configure time synchronization if all the servers in the
    network have static IP addresses.


    Network services that use eDirectory also benefit if the host name is statically
    assigned and mapped to the IP address in the hosts file.'
  merge: -1
  pgno: 368
