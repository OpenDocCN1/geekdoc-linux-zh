  md: '# Objective 3


    # Install and Configure the iPrint Client


    To install and configure the iPrint client, you need to know how to do the the
    following:


    +   - Install the iPrint Client on Linux

    - Install the iPrint Client on Windows

    - Configure the iPrint Client Settings


    # Install the iPrint Client on Linux


    For iPrint to work properly, a workstation must have the iPrint client installed.


    You can distribute the client to workstations in a variety of ways, such as using
    the iPrint Printer List web page, using distribution software like ZENworks, or
    creating login scripts.


    To install the iPrint client on Linux, you need to know the following:


    +   - iPrint Client Requirements

    - Access Control to the Workstation Print System

    - How to Install the iPrint Client and Your First Printer on Linux


    # iPrint Client Requirements


    For iPrint to work properly, Linux workstations need the following:


    +   - Novell Linux Desktop or SUSE 9.2 (or later) Professional installed

    - Konqueror or a Mozilla-based browser such as Epiphany, Firefox, or Galeon'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'In addition to these requirements, you need to know the following:


    +   - To install the client, you must have the root password or rights as root.


    +   - This release of the iPrint Linux client does not support printing to a secure
    printer that requires a user name and password.


    +   - If the iPrint server is busy when your installed printer attempts to communicate,
    CUPS moves the printer into an error state and holds all print jobs.


    To release print jobs, use the printer management utility to restart the printer.


    # Access Control to the Workstation Print System


    The Linux iPrint client is packaged in two different, specialized installations
    that control access to the workstation''s print system.


    The following explains the differences between the two clients:


    | Table 7-1 | iPrint Client Filename | Description |

    |--- | --- | --- |

    | | novell-iprint-xclient-sh-0.5.20050201-4.i586.rpm | Security high. Limited
    access to the print system. This client requires workstation users to be defined
    with Ipassword to install, delete, or administer printers on the workstation.
    When performing one of these print operations, the user is asked for a password.
    By default, the iPrint Printer List web page installs this RPM. |'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Table 7-1 iPrint Client Filename


    | iPrint Client Filename | Description |

    |---|---|

    | novell-iprint-xclient-sl-0.5. 20050201- 4.i586.rpm | Security low. Unlimited
    access to the print system. This client allows all users of the workstation to
    install, delete, or administer printers and print jobs on the workstation, including
    printers and print jobs of other users. |


    These clients do not affect installation of the iPrint client or printing capabilities—just
    access to the workstation print system. To install the iPrint client, you still
    need root permissions.


    To upload drivers from the system, you need to be defined with lppasswd; otherwise,
    when you try to add drivers from the system, the driver list will be blank.


    To define a user to be part of lppasswd, you can use the following command:


    ```

    lppasswd -a linux_user_account -g sys

    ```


    # How to Install the iPrint Client and Your First Printer on Linux


    You can use one of the following methods to install the iPrint client on user
    workstations:


    +   - Install the Client from the iPrint Printer List Web Page

    - Deliver the Client Using Distribution Software


    # Install the Client from the iPrint Printer List Web Page


    You can download and install the iPrint client from the iPrint Printer List web
    page that is stored on the server where the Print Manager is loaded.


    By default, the link is set to install the high security novell-iprint-xclient-sh-0.5.20050201-4.i586.rpm.'
  merge: -1
  pgno: 48
