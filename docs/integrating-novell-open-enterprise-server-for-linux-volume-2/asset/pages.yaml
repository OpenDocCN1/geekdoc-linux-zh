  md: 'If the database fails to load through normal mechanisms, you can use the backup
    database by doing the following:


    +   1. Rename /var/opt/novell/iprint/psmbdb.* to psmbdb..*


    +   2. Rename /var/opt/novell/iprint/psmdbsav.* to psmbdb.*


    +   3. Start the Print Manager.


    When you create a Print Manager, a configuration file is created in /etc/opt/novell/iprint.
    The file name is print_manager_name.ipsmd.conf.


    A separate file is created for each Print Manager that is created and assigned
    to run on the same server. Only one Print Manager can run on the server at a time.


    For information about the entries in the configuration file, /etc/opt/novell/iprint/ipsmd-template.conf.


    The ipsmd.conf file links to the configuration file of the currently loaded Print
    Manager. To load a different Print Manager on the server, use iManager.


    If you attempt to load a Print Manager when one is already running, you will receive
    an error message instructing you to unload the current Play Manager before loading
    the new one.


    If you need to change the eDirectory server assignment for the Print Manager or
    Driver Store, edit the DSServer1=entry in the corresponding configuration file
    (print_manager_name_ipsmd.conf or idsd.conf) located in /etc/opt/novell/ iprint/


    You can start and stop the Print Manager in one of the ways:


    +   From the command line. The Print Manager uses init scripts for starting and
    stopping the daemon.


    To load the Print Manager from the command line, enter the following:


    ```

    /etc/init.d/novell-ipsmd start

    ```'
