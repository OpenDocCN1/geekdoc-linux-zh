  md: '# How to Modify Search Categories


    A search category is an entity that eGuide uses to represent a combination of
    LDAP classes.


    For example, when you add the first directory to eGuide, the User search category
    is created. By default, it includes the following classes: InetOrgPerson, OrganizationalPerson,
    and Person.


    The attributes within these user classes appear in the page where you configure
    eGuide uses them in the eGuide client. Also, the user category label Find People
    appears in the first search filter-down list in the eGuide client.


    The InetOrgPerson, OrganizationalPerson, and Person classes are used only if they
    existed in the first directory you added.


    To manage search categories, you need to know how to do the following:


    +   - Add a Search Category

    - Remove a Search Category

    - Add or Remove Schema Classes from a Search Category


    # Add a Search Category


    To add a search category, do the following:


    +   - From the eGuide Administration utility, select LDAP Data Sources; then select
    the Edit link (for the desired directory).

    - Select Advanced; then select New.

    - Enter the name of the new category.

    - Add at least one schema class and configure its attributes.

    - When you finish, select Save.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Remove a Search Category


    To remove a search category, do the following:


    +   1. From the eGuide Administration utility, select LDAP Data Sources; then
    select the Edit link (for the desired directory).


    +   2. Select Advanced.


    +   3. Select the category you want to remove.


    User is a mandatory category; eGuide will not let you remove it.


    +   4. Select Remove category_name.


    # Add or Remove Schema Classes from a Search Category


    To add or remove schema classes from a search category, do the following:


    +   1. From the eGuide Administration utility, select LDAP Data Sources; then
    select the Edit link (for the desired directory).


    +   2. Select Advanced.


    +   3. Select the category you want to modify.'
  merge: -1
