    \ as illustrated in the following:\n\n# Figure 10-3\n\n![](img/5c6ed3be01bd022754f15cfb45760d71_262_0.png)\n\
    \nThe following describes Figure 10-3:\n\n+   **Access methods.** Users have read\
    \ and write access to files from\n    * **Windows Explorer.** This is enabled\
