  md: "# Decide on an Installation Option Before You Start\n\nBefore installing Novell\
    \ OES, you might want to be aware of the following information:\n\n+   - Installation\
    \ from CDs or from the Network\n\n+   - Pattern Deployments\n\n+   - Installing\
    \ NSS on a Single-Server\n\n# Installation from CDs or from the Network\n\nBoth\
    \ OES Linux and OES NetWare can be installed from CDs or from files on the network:\n\
    \n+   - OES Linux options, OES Linux includes two installation options, both of\
    \ which are documented in the Novell OES Installation Guide for Linux (install-linux.pdf):\n\
    \  - CD installation. You can install using CDs obtained from a Novell Authorized\
    \ Reseller, or you can create CDs from downloaded ISO image files.\n  See “Preparing\
    \ for a CD Install” on page 26 in the Novell OES Installation Guide for Linux\n\
    \n+   - Network installation. You can install only the first CD if the remaining\
    \ ISO files are available on the network.\n  This option can save you from swapping\
    \ CDs on the server during the installation.\n  See “Preparing for a Network Install”\
    \ on page 24 in the Novell OES Installation Guide for Linux.\n\n+   - OES NetWare\
