    # # Interface and Basic Commands


    # ## Starting Radare2


    To start Radare2 with a binary, use the command:


    ```

    r2 <binary_path>

    ```


    # ## Basic Navigation


    Once inside Radare2, you can use several commands to navigate and analyze the
    binary. Some basic commands include:


    +   - aaa: Parse the binary completely.

    - afl: List all functions in the binary.

    - pdf @main: Display function disassembly main.


    # ## Binary Analysis


    # ## Automatic Analysis


    Radare2 offers several commands for automatic binary analysis. The command aaa
    performs a complete analysis, including the identification of functions, basic
    blocks and strings.


    # ## Example of use:'
  - '[PAGE 182]


    ```

    bash

    r2 -A <binary_path>

    ```


    Explanation:


    +   - -A: Runs automatic analysis when opening the binary.


    # # Disassembly


    You can use Radare2 to disassemble binary code, converting machine instructions
    into readable assembly code.


    # # Example of use:


    ```

    bash

    pdf @main

    ```


    Explanation:


    +   - pdf @main: Displays the disassembly of the function main.


    # # Debugging


    Radare2 includes a powerful debugger that allows you to directly run and debug
    binaries.


    # # Starting the Debugger


    To start the debugger with a binary, use the command:


    ```

    bash

    r2 -d <binary_path>

    ```'
