    ## Report Automation\n\nAutomate the generation and sending of reports using scripts.\n\
    \n## Bash Script Example for Automation:\n\n```bash\n#!/bin/bash\n# Variable configuration\n\
    TASK_ID=\"id_da_tarefa\"\nREPORT_FORMAT=\".pdf\"\nOUTPUT_DIR=\"/path/to/reports\"\
