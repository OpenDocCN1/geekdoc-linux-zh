    ```\nsudo apt update\nsudo apt install hydra\n```\n\nTo verify the installation,\
    \ run:\n\n```bash\nhydra -h\n```\n\n## Main Features\n\n### Dictionary Attacks\n\
    \nHydra can perform dictionary attacks, where a list of possible passwords is\
    \ tested against a service.\n\n### Example of use:\n\n```bash\nhydra -l user -P\
    \ /path/to/passwordlist.txt ftp://192.168.1.1\n```\n\nExplanation:\n\n- -l user:\
    \ Specifies the username.\n- -P /path/to/passwordlist.txt: Specifies the path\
    \ to the password dictionary file.\n- ftp://192.168.1.1: Specifies the protocol\
    \ and IP address of the target.\n\n### Brute Force Attacks\n\nHydra can also perform\
    \ brute force attacks, testing every possible combination of characters until\
    \ it finds the correct password.\n\n### Example of use:\n\n```bash\nhydra -l user\
    \ -x 8:8:a ftp://192.168.1.1\n```\n\nExplanation:\n\n- -l user: Specifies the\
    \ username.\n- -x 8:8:a: Specifies the password length (8 characters) and character\
    \ set (lowercase letters).\n- ftp://192.168.1.1: Specifies the protocol and IP\
    \ address of the target.\n\n## Advanced Usage\n\n### Attacks on Multiple Services\
    \ Simultaneously\n\nHydra can be configured to carry out attacks on multiple services\
    \ simultaneously.\n\n### Example of use:\n\n```bash\nhydra -l usuario -P /path/to/passwordlist.txt\
    \ -M targets.txt ftp\nssh telnet\n```\n\nExplanation:\n\n- - M targets.txt: Specifies\
    \ a file containing a list of targets.\n- ftp ssh telnet: Specifies the services\
    \ to be tested.\n\n### Use of Proxy\n\nHydra can use proxies to hide the attacker's\
    \ IP address and avoid blocking.\n\n### Example of use:\n\n```bash\nhydra -l usuario\
    \ -P /path/to/passwordlist.txt -s 8080 -u\nychains http-get://192.168.1.1\n```\n\
    \nExplanation:\n\n- -s 8080: Specifies the service port.\n- -in: Uses proxchains\
    \ to make connections.\n- http-get://192.168.1.1: Specifies the protocol, HTTP\
    \ method, and IP address of the target.\n\n### Distributed Attacks\n\nHydra can\
    \ carry out distributed attacks using multiple machines to speed up the password\
    \ cracking process.\n\n### Configuration Example:\n\n1. Configure Hydra on multiple\
    \ machines.\n2. Divide the password list between machines.\n3. Run Hydra on each\
    \ machine with the corresponding part of the dictionary:\n\n```bash\nhydra -l\
    \ user -P /path/to/passwordlist_part1.txt\nftp://192.168.1.1\n```\n\n### Practical\
    \ examples\n\n### Example 1: Dictionary Attack on SSH Service\n\n1. Create a dictionary\
    \ file with possible passwords (passwordlist.txt).\n2. Run Hydra to test passwords\
    \ against the SSH service:\n\n```bash\nhydra -l usuario -P passwordlist.txt ssh://192.168.1.1\n\
    ```\n3. Analyze the results to identify the correct password.\n\n### Example 2:\
    \ Brute Force Attack on FTP Service\n\n1. Run Hydra to perform a brute force attack\
