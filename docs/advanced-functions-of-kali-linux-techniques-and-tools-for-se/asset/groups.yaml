    to using Wireshark, ranging from basic concepts to advanced techniques.


    # Wireshark Installation


    Wireshark comes pre-installed on Kali Linux. However, if for some reason you need
    to install or update it, use the following commands:


    ```bash

    sudo apt update

    sudo apt install wireshark

    ```


    To allow normal users to capture packets, configure Wireshark:


    ```bash

    sudo dpkg-reconfigure wireshark-common

    ```


    Choose "Yes" to allow non-root to use Wireshark. Add user to group:


    ```bash

    sudo usermod -aG wireshark $USER

    ```


    # Interface Wireshark


    Wireshark''s interface is intuitive. When start Wireshark, you will see available
    interfaces.


    # Starting Capture


    To start capture, follow the steps:


    1. Open Wireshark.

    2. Select the desired interface.

    3. Click "Start".


    # Packet Capture


    To stop capture:


    1. Click the "Stop" button (red square).


    # Saving Captures


    To save captures:


    1. Go to "File" > "Save As".

    2. Choose the desired format and name.


    # Packet Analysis


    Wireshark provides detailed analysis of captured packets. Each packet is listed
    with information such as time, destination, protocol.


    # Capture Filters


    Capture filters are used to limit captured packets. For example, to capture only
    HTTP:


    ```bash

    tcp port 80

    ```


    # Display Filters


    Display filters are used to isolate packets. For example, to view only ICMP:


    ```bash

    icmp

    ```


    # Security Analysis with Wireshark


    Wireshark is a powerful tool for security analysis. You can use it to detect intrusion
    attempts, analyze suspicious traffic, and identify vulnerabilities.


    # Detecting Network Attacks


    To detect network attacks, use display filters. For example, to detect port scans:


    ```bash

    tcp.flags.syn == 1 and tcp.flags.ack == 0 and tcp.window_size == 1024

    ```


    # Analyzing Malware


    Capturing and analyzing packets can help identify traffic generated by malware.
    Use filters to isolate malicious communications and correlate with other activity.


    # Use of Plugins and Extensions


    Wireshark supports plugins and extensions that add specific functionality. For
    example, plugins for analyzing proprietary protocols or for integration with other
    security tools.


    # Installing Plugins


    To install plugins, download them from the official Wireshark website and place
    them in the Wireshark plugin directory.


    # Practical examples


    ### Example 1: HTTP Traffic Analysis


    - **Capture HTTP Packets**: Start a capture on the network interface that is monitoring
    HTTP traffic.

    - **Apply Display Filter**: Use the filter `http` to isolate HTTP packets.

    - **Follow TCP Flow**: Right-click an HTTP packet and select "Follow" > "TCP Stream"
    to view the complete communication.


    ### Example 2: DDoS Attack Detection


    - **Capture Packets on the Network Interface**: Initiate a capture on the interface
    that is under attack.

    - **Apply Display Filter**: Use the filter `icmp` to isolate ICMP packets.

    - **Analyze Traffic Volume**: Check ICMP packet volume for spikes that could indicate
    a DDoS attack.


    # Advanced Wireshark Techniques


    # Decoding Encrypted Traffic


    Wireshark can decode encrypted traffic if you have access to the encryption keys.

