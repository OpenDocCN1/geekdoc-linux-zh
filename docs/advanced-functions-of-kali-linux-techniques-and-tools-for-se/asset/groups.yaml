    network traffic. Wireshark enables packet capture and analysis, helping to diagnose
    network problems and identify suspicious activity.


    - 4. **Aircrack-ng**: A set of tools for auditing Wi-Fi networks. Aircrack-ng
    is used to test the security of wireless networks, including capturing and decrypting
    WEP and WPA packets.


    - 5. **John the Ripper**: A powerful tool for password cracking. John the Ripper
    is used to test the robustness of password policies, allowing the identification
