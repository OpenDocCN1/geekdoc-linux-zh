    # CHAPTER 6: JOHN THE RIPPER


    ## Introduction to John the Ripper


    John the Ripper, often abbreviated as "John", is a highly efficient open source
    password cracking tool. Initially developed for Unix, it now supports a variety
    of platforms including Windows, Linux, and macOS. John the Ripper is widely used
    by system administrators and security professionals to test password strength
    and identify weak passwords that could compromise system security.


    ## Installing John the Ripper


    John the Ripper is already pre-installed on Kali Linux. However, if you need to
    install or update it, use the following commands:


    ```bash

    sudo apt update

    sudo apt install john

    ```


    To verify the installation, run:


    ```bash

    john --version

    ```


    ## Types of Attacks


    John the Ripper supports several types of brute force and dictionary attacks,
    including:


    - Dictionary Attack: Uses a list of known words.

    - Brute Force Attack: Tests all possible combinations of characters.

    - Incremental Attack: An optimized brute force type.

    - Hybrid Attack: Combines dictionary and brute force.


    ## Preparing for Password Cracking


    ### Hash Collection


    To crack passwords, you first need the password hashes. Hashes can be extracted
    from various files depending on the system. On Linux systems, hashes are usually
    found in the file /etc/shadow.


    ### Example of Extracting Hashes in Linux:


    1. Copy the file /etc/shadow to a safe location where you are allowed to review
    it.


    ```bash

    sudo cp /etc/shadow /path/to/directory/

    ```


    2. Combine the file /etc/passwd with the file /etc/shadow using the tool unshadow
    for John the Ripper:


    ```bash

    unshadow /etc/passwd /path/to/directory/shadow > /path/to/directory/unshadowed.txt

    ```


    ## Dictionary Preparation


    Prepare a dictionary file with words that will be used for the dictionary attack.
    You can download lists of common dictionaries or create your own text file.


    ## Basic Usage


    ### Dictionary Attack


    To perform a dictionary attack:


    ```bash

    john --wordlist=/path/to/wordlist.txt /path/to/unshadowed.txt

    ```


    Explanation:


    - wordlist: Specifies the dictionary file.

    - /path/to/wordlist.txt: Path to the dictionary file.

    - /path/to/unshadowed.txt: Path to the file with the password hashes.


    ### Brute Force Attack


    To perform a brute force attack:


    ```bash

    john /path/to/unshadowed.txt

    ```


    This command performs a standard brute force attack using John the Ripper''s predefined
    settings.


    ## Advanced Usage


    ### Custom Rules Configuration


    John the Ripper allows you to configure custom rules to improve the efficiency
    of attacks. The rules are defined in the file john.conf.


    ### Custom Rule Example:


    Open the file john.conf and add your custom rules in the section [List.Rules:Wordlist].


    ```plaintext

    [List.Rules:Wordlist]

    Az"[A-Za-z0-9]{6}"

    ```


    This rule will try all letter and number combinations that are six characters
    long.


    ### Hybrid Attacks


    A hybrid attack combines a dictionary attack with variations of brute force. For
    example, adding numbers to the end of dictionary words:


    ```bash

    john --wordlist=/path/to/wordlist.txt --rules /path/to/unshadowed.txt

    ```


    Predefined rules are applied to dictionary words to create variations.


    ### ZIP Password Cracking


    John the Ripper can crack ZIP file passwords using the module zip2john.


    Extract the hash from the ZIP file:


    ```bash

    zip2john protected.zip > ziphash.txt

    ```


    Crack the password using the extracted hash:


    ```bash

    john ziphash.txt

    ```


    ### Using GPU with John the Ripper


    To speed up password cracking, you can use the GPU (Graphics Processing Unit)
    with John the Ripper. The module john with support for OpenCL or CUDA allows you
    to use the GPU to process hashes faster.


    Check if your John the Ripper supports GPU:


    ```bash

    john --list=formats | grep -i "gpu"

    ```


    2. Execute John the Ripper utilizing a GPU:


    ```bash

    john --format=opencl /path/to/unshadowed.txt

    ```


    ## Practical examples


    ### Example 1: Linux User Password Crack


    1. Extract password hashes from Linux system:


    ```bash

    sudo cp /etc/shadow /path/to/directory/ unshadow /etc/passwd /path/to/directory/shadow
    > /path/to/directory/unshadowed.txt

    ```


    2. Perform a dictionary attack:


    ```bash

    john --wordlist=/path/to/wordlist.txt /path/to/unshadowed.txt

    ```


    3. Check the results:


    ```bash

    john --show /path/to/unshadowed.txt

    ```


    ### Example 2: ZIP Archive Password Crack


    1. Extract the hash from the ZIP file:


    ```bash

    zip2john protected.zip > ziphash.txt

    ```


    2. Perform a brute force attack:


    ```bash

    john ziphash.txt

    ```


    3. Check the results:


    ```bash

    john --show ziphash.txt

    ```


    ## John the Ripper''s Advanced Techniques


    ### Attack Parallelization


    To increase efficiency, you can divide the task between multiple instances of
    John the Ripper, using different parts of a dictionary or different rules.


    ### Example of Dictionary Division:


    1. Divide the dictionary into several parts:


    ```bash

    split -l 10000 /path/to/wordlist.txt wordlist_part_

    ```


    2. Run John the Ripper on each part of the dictionary:


    ```bash

    john --wordlist=wordlist_part_aa /path/to/unshadowed.txt

    john --wordlist=wordlist_part_ab /path/to/unshadowed.txt

    ```


    ### Results Analysis and Reports


    After password cracking, it is essential to analyze the results and generate reports
    to improve system security.


    1. Check cracked passwords:


    ```bash

    john --show /path/to/unshadowed.txt

    ```


    2. Generate a detailed report:


    ```bash

    john --show /path/to/unshadowed.txt > password_report.txt

    ```


    ## Best Practices


    1. **Legality**: Always get explicit permission before testing.

    2. **Security**: Store hashes and dictionaries securely.

    3. **Documentation**: Document all steps and results.

    4. **Responsible Use**: Use John the Ripper ethically and responsibly.


    ## Conclusion


    John the Ripper is a powerful and versatile tool for testing password strength
    and identifying vulnerabilities. By mastering its features, from dictionary and
