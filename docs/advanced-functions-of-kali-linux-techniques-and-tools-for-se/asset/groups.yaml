    - 2. 启动 Kismet 并观察数据包。


    ## 多接口监控


    Kismet 可以配置为监控多个接口，扩大数据包捕获的范围。


    ## 使用示例：


    - 1. 配置配置文件包含多个接口：


    ```

    nsource=wlan0

    nsource=wlan1

    ```


    - 2. 启动 Kismet 监控两个接口：


    ```

    sudo kismet

    ```


    ## GPS 集成


    Kismet 可以与 GPS 设备集成，以记录发现网络的地理位置。


    ## 使用示例：


