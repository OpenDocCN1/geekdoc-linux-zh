    # CHAPTER 18: YERSINIA


    ## Introduction to Yersinia


    Yersinia is a layer 2 network security testing tool designed to explore vulnerabilities
    in various network protocols such as STP (Spanning Tree Protocol), CDP (Cisco
    Discovery Protocol), DTP (Dynamic Trunking Protocol), DHCP (Dynamic Host Configuration
    Protocol), among others. This tool is extremely useful for security professionals
    who want to assess and strengthen the security of their network infrastructures..


    ## Yersinia installation


    Yersinia comes pre-installed on Kali Linux. However, if you need to install or
    update it, use the following commands:


    ```bash

    sudo apt update

    sudo apt install yersinia

    ```


    To start Yersinia in graphical mode, use:


    ```bash

    sudo yersinia -G

    ```


    To start Yersinia in text mode, use:


    ```bash

    sudo yersinia -l

    ```


    ## Initial setting


    ### Graphic Interface


    - 1. Start Yersinia in graphical mode using sudo yersinia -G.

    2. You will see a graphical interface where you can select the network interface
    and the specific attacks to be carried out.


    ## Command Line Interface


    - 1. Start Yersinia in text mode using sudo yersinia -l.

    2. In interactive mode, you can select the network interface and execute specific
    commands to perform attacks and analysis.


    ## Main Features


    ### Ataques ao STP (Spanning Tree Protocol)


    Yersinia allows you to carry out attacks on the STP protocol, which is used to
    avoid loops in the network topology.


    ### Example of use:


    - 1. Launch Yersinia and select the network interface.

    2. Select the STP attack and configure the desired parameters.

    3. Execute the attack and observe the effects on the network topology.


    ### Attacks on CDP (Cisco Discovery Protocol)


    Yersinia can exploit vulnerabilities in CDP, a Cisco proprietary protocol used
    to discover Cisco devices on the network.


    ### Example of use:


    - 1. Launch Yersinia and select the network interface.

    2. Select the CDP attack and configure the desired parameters.

    3. Execute the attack to exploit information from Cisco devices on the network.


    ### Ataques ao DTP (Dynamic Trunking Protocol)


    Yersinia allows you to exploit vulnerabilities in DTP, a protocol used to negotiate
    the creation of trunks between switches.


    ### Example of use:


    - 1. Launch Yersinia and select the network interface.

    2. Select the DTP attack and configure the desired parameters.

    3. Execute the attack to manipulate the creation of trunks on the network.


    ## Advanced Usage


    ### Denial of Service (DoS) Attacks


    Yersinia can be used to carry out denial of service attacks on layer 2 protocols,
    interrupting communication on the network.


    ### Example of use:


    - 1. Select the network interface on Yersinia.

    2. Choose a specific protocol, such as STP or DHCP.

    3. Configure and execute a DoS attack to overload the protocol and cause network
    outages.


    ### Traffic Capture and Analysis


    Yersinia can capture and analyze network traffic to identify vulnerabilities and
    weaknesses in infrastructure.


    ### Example of use:


    - 1. Launch Yersinia and select the network interface.

    2. Use Yersinia to capture protocol-specific packets.

    3. Analyze captured packets to identify vulnerabilities.


    ## Practical examples


    ### Example 1: STP Attack


    - 1. Start Yersinia in graphical mode with sudo yersinia -G.

    2. Select the network interface and STP protocol.

    3. Configure the attack to become the root switch in the STP topology.

    4. Execute the attack and observe the change in the network topology.


    ### Example 2: DHCP Attack


    - 1. Start Yersinia in graphical or text mode.

    2. Select the network interface and DHCP protocol.

    3. Configure the attack to flood the network with DHCP requests.

    4. Execute the attack and observe how devices on the network are unable to obtain
    valid IP addresses.


    ## Advanced Techniques


    ### Attack Automation


    You can automate attacks using scripts and the Yersinia command-line interface.


    ### Bash Script Example:


    ```bash

    #!/bin/bash

    # Variable configuration

    INTERFACE="eth0"


    # Start Yersinia in STP attack mode

    yersinia stp -i $INTERFACE -attack 1

    ```


    ### Integration with Monitoring Tools


    Yersinia can be integrated with other monitoring tools to detect and mitigate
    attacks in real time.


    ### Example of Integration with Snort:


    - 1. Configure Snort to monitor network traffic.

    2. Use Yersinia to generate malicious traffic.

    3. Configure rules in Snort to detect and alert on malicious traffic generated
    by Yersinia.


    ## Best Practices


    - 1. **Legality**: Always obtain explicit permission before performing penetration
    testing on networks you do not own.

    2. **Test environment**: Perform testing in a controlled and secure environment
    to avoid disruptions to production networks.

    3. **Documentation**: Document all activities and results for future reference
    and to assist in remediating vulnerabilities.

    4. **Updates**: Keep Yersinia updated to ensure effective testing and vulnerability
    fixes.


    Yersinia is an essential tool for any security professional who wants to test
    and strengthen the security of Layer 2 networks. Its ability to perform attacks
    on multiple protocols, capture and analyze traffic, and integrate with other monitoring
    tools makes it an powerful choice for identifying and mitigating vulnerabilities
    in network infrastructures. By mastering the use of Yersinia, you can ensure that
    your networks are well protected against threats, contributing to a more robust
    security environment.


    ## Additional Examples and Advanced Techniques


    ### Example 3: CDP Attack


    - 1. Start Yersinia in graphical mode with sudo yersinia -G.

    2. Select the network interface and CDP protocol.

    3. Configure the attack to exploit information from Cisco devices on the network.

    4. Execute the attack and analyze the collected information.


    ### Example 4: ARP Attack


    - 1. Start Yersinia in graphical or text mode.

    2. Select the network interface and ARP protocol.

    3. Configure the attack to send false ARP responses.

    4. Execute the attack and observe how devices on the network are redirected to
