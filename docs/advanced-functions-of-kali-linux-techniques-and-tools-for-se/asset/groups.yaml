    4. 执行攻击并观察网络上的设备如何被重定向到攻击者。


    ## 其他工具使用 Yersinia


    ### Wireshark 集成


    - 1. 使用 Yersinia 生成恶意流量。

    2. 使用 Wireshark 捕获流量以分析攻击的影响。

