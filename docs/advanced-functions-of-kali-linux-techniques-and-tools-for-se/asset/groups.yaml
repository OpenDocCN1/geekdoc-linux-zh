    ### 使用示例：


    - 1. 启动 Yersinia 并选择网络接口。

    2. 选择 CDP 攻击并配置所需的参数。

    3. 执行攻击以利用网络上 Cisco 设备的信息。


    ### 对 DTP（动态链路协议）的攻击


    Yersinia 允许您利用 DTP 中的漏洞，该协议用于协商交换机之间创建链路（trunks）。


    ### 使用示例：


    - 1. 启动 Yersinia 并选择网络接口。

    2. 选择 DTP 攻击并配置所需的参数。

    3. 执行攻击以操纵网络上链路的创建。


    ## 高级用法


    ### 拒绝服务 (DoS) 攻击


    可以使用 Yersinia 对二层层协议执行拒绝服务攻击，中断网络上的通信。


    ### 使用示例：


    - 1. 在 Yersinia 上选择网络接口。

    2. 选择特定协议，例如 STP 或 DHCP。

    3. 配置并执行 DoS 攻击，使协议过载并导致网络中断。


    ### 流量捕获与分析


    Yersinia 可以捕获并分析网络流量，以识别基础设施中的漏洞和弱点。


    ### 使用示例：


    - 1. 启动 Yersinia 并选择网络接口。

    2. 使用 Yersinia 捕获特定协议的数据包。

    3. 分析捕获的数据包以识别漏洞。


    ## 实际示例


    ### 示例 1：STP 攻击


    - 1. 使用 `sudo yersinia -G` 以图形模式启动 Yersinia。

    2. 选择网络接口和 STP 协议。

    3. 配置攻击成为 STP 拓扑中的根交换机。

    4. 执行攻击并观察网络拓扑的变化。


    ### 示例 2：DHCP 攻击


    - 1. 以图形或文本模式启动 Yersinia。

    2. 选择网络接口和 DHCP 协议。

    3. 配置攻击以用 DHCP 请求淹没网络。

    4. 执行攻击并观察网络上的设备如何无法获取有效的 IP 地址。


    ## 高级技术


    ### 攻击自动化


    您可以使用脚本和 Yersinia 命令行界面来实现攻击自动化。


    ### Bash 脚本示例：


    ```bash

    #!/bin/bash

    # 变量配置

    INTERFACE="eth0"


    # 以 STP 攻击模式启动 Yersinia

    yersinia stp -i $INTERFACE -attack 1

    ```


    ### 与监控工具的集成


    Yersinia 可以与其他监控工具集成，以实时检测并缓解攻击。


    ### 与 Snort 集成的示例：


    - 1. 配置 Snort 监控网络流量。

    2. 使用 Yersinia 生成恶意流量。

    3. 在 Snort 中配置规则，以检测并警告由 Yersinia 生成的恶意流量。


    ## 最佳实践


    - 1. **合法性**：在对您不拥有的网络进行渗透测试之前，务必获得明确许可。

    2. **测试环境**：在受控且安全的环境中进行测试，以避免对生产网络产生干扰。

    3. **文档记录**：记录所有活动和结果，以供以后参考并协助修复漏洞。

    4. **更新**：保持 Yersinia 更新，以确保有效的测试和漏洞修复。


    Yersinia 是任何想要测试和加强二层网络安全的安全专业人员的必备工具。它能够对多种协议执行攻击、捕获并分析流量以及与其他监控工具集成，使其成为识别和缓解网络基础设施漏洞的强大选择。通过掌握
    Yersinia 的使用，您可以确保您的网络免受威胁，为构建更稳健的环境做出贡献。


    ## 其他示例与高级技术


