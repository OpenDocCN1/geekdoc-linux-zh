    ## Initial setting


    ### Browser Configuration


    To capture and modify HTTP/S traffic, you must configure your browser to use the
    Burp Suite proxy.


    1. Open Burp Suite and go to the "Proxy" tab.

    2. Click "Intercept" and then "Intercept is on" to disable interception for now.

    3. Go to the "Options" tab and note the proxy IP address and port (by default,
    127.0.0.1:8080).

    4. Configure your browser to use this proxy. In Firefox, go to "Preferences" >
    "General" > "Network Settings" > "Settings" and configure the proxy manually.


    ### CA Certificate Installation


    To analyze HTTPS traffic, you need to install the Burp Suite CA certificate in
    your browser.


    1. In Burp Suite, go to "Proxy" > "Options" > "Import / export CA certificate".

    2. Choose "Download CA certificate" and save the file.

    3. In the browser, go to "Preferences" > "Privacy & Security" > "Certificates"
    > "View Certificates" > "Import" and import the CA certificate.


    ## Main Features


    ### Proxy


    Burp Suite proxy allows you to capture and modify HTTP/S traffic between the browser
    and the web server.

