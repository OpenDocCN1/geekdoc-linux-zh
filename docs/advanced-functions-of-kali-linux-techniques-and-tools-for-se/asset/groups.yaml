    \ Use**: Use OpenVAS ethically and responsibly, respecting security standards\
    \ and policies.\n\n## Conclusion\n\nOpenVAS is a powerful tool for vulnerability\
    \ management and analysis, offering a wide range of functionality to identify\
    \ and fix vulnerabilities in systems and networks. Its ability to perform detailed\
    \ scans, analyze vulnerabilities, and generate reports makes it an essential choice\
    \ for security professionals. By mastering the use of OpenVAS, you can ensure\
    \ that your systems are protected against threats and vulnerabilities, contributing\
    \ to a stronger security environment.\n\n## CHAPTER 12: ETTERCAP\n\n## Introduction\
    \ to Ettercap\n\nEttercap is an open source tool used to perform Man-in-the-Middle\
    \ (MitM) attacks on local networks. Developed to facilitate the interception,\
    \ modification and inspection of network traffic, Ettercap is widely used by security\
    \ professionals to test the security of networks and devices. It supports several\
    \ attack techniques, including ARP poisoning, DNS spoofing, and password capture.\n\
    \n## Ettercap installation\n\nEttercap comes pre-installed on Kali Linux. However,\
    \ if you need to install or update it, use the following commands:\n\n```bash\n\
    sudo apt update\nsudo apt install ettercap-graphical\n```\n\nTo start Ettercap,\
    \ use:\n\n```bash\nettercap -G\n```\n\n## Initial setting\n\n## Network Interface\
    \ Selection\n\n+ 1. Open Ettercap with the graphical interface (ettercap -G).\n\
    2. Vá to \"Sniff\" > \"Unified Sniffing\".\n3. Select the network interface to\
    \ be used for packet capture and click \"OK\".\n\n## Main Features\n\n## ARP Poisoning\n\
    \nARP Poisoning is a technique used to intercept network traffic by redirecting\
    \ packets to the attacker.\n\n+ 1. Go to \"Mitm\" > \"ARP poisoning\".\n2. Select\
    \ \"Sniff remote connections\" and click \"OK\".\n3. Ettercap will begin poisoning\
    \ the ARP tables of devices on the network, redirecting traffic through the attacker.\n\
    \n## DNS Spoofing\n\nDNS Spoofing is a technique used to redirect DNS traffic\
    \ to a server controlled by the attacker.\n\n+ 1. Open the Ettercap configuration\
    \ file:\n\n```bash\nsudo nano /etc/ettercap/etter.dns\n```\n\n+ 2. Add a DNS Mitm\
    \ spoofing entry, for example:\n\n```plaintext\nwww.target.com A 192.168.1.100\n\
    ```\n\n+ 3. Save the file and close the editor.\n4. In Ettercap, go to \"Plugins\"\
    \ > \"Manage the plugins\".\n5. Select \"dns_spoof\" and click \"Start\".\n\n\
    ## Password Capture\n\nEttercap can capture passwords transmitted in clear text\
    \ over the network.\n\n+ 1. Go to \"View\" > \"Profiles\" > \"Passwords\".\n2.\
    \ Observe captured passwords in real time as Ettercap performs packet sniffing.\n\
    \n## Advanced Usage\n\n## Packet Filtering\n\nEttercap allows you to create custom\
    \ filters to modify packages in transit.\n\n+ 1. Create a filter file, e.g. filter.ef:\n\
    \n```plaintext\nif (ip.proto == TCP && tcp.dst == 80) {\n  if (search(DATA.data,\
    \ \"GET\")) {\n    replace(\"GET\", \"POST\");\n    msg(\"Replaced GET with POST\\\
    n\");\n  }\n}\n```\n\n+ 2. Compile or filter:\n\n```bash\nafter filter filter.ef\
    \ -o filter.ef\n```\n\n+ 3. In Ettercap, go to \"Filters\" > \"Load a filter\"\
    \ and select the compiled filter.\n4. Enable the filter to modify packets in transit.\n\
    \n## SSL Stripping Attack\n\nEttercap can perform SSL stripping attacks to convert\
    \ HTTPS connections to HTTP, allowing data interception.\n\n+ 1. In Ettercap,\
    \ go to \"Plugins\" > \"Manage the plugins\".\n2. Select \"sslsplit\" and click\
    \ \"Start\".\n\n## Traffic Analysis with Wireshark\n\nEttercap can be used in\
    \ conjunction with Wireshark to perform detailed traffic analysis.\n\n+ 1. Start\
    \ Ettercap and configure packet capture.\n2. Start Wireshark and select the same\
    \ network interface.\n3. Capture and analyze packets simultaneously in both tools.\n\
    \n## Practical examples\n\n## Example 1: Intercepting HTTP Traffic\n\n+ 1. Start\
    \ Ettercap and select the network interface.\n2. Active the ARP poisoning.\n3.\
    \ Open a browser on a target device and navigate to an HTTP website.\n4. In Ettercap,\
    \ go to \"View\" > \"Profiles\" > \"Passwords\" to capture and view credentials\
    \ transmitted in clear text.\n\n## Example 2: Traffic Redirection with DNS Spoofing\n\
    \n+ 1. Configure the file after.dns to redirect a specific domain.\n2. Active\
    \ the plugin de DNS spoofing no Ettercap.\n3. On the target device, try to access\
    \ the redirected domain.\n4. Verify that traffic is redirected to the IP specified\
    \ in the file after.dns.\n\n## Advanced Techniques\n\n## Creating Advanced Filters\n\
    \nDevelop advanced filters to perform specific modifications to packages.\n\n\
    ## Advanced Filter Example:\n\n+ 1. Create a filter file, e.g. advanced_filter.ef:\n\
    \n```plaintext\nif (ip.proto == TCP && tcp.dst == 80) {\n  if (search(DATA.data,\
    \ \"User-Agent\")) {\n    replace(\"User-Agent: \", \"User-Agent: Ettercap-Modified\"\
    );\n    msg(\"Modified User-Agent header\\n\");\n  }\n}\n```\n\n+ 2. Compile and\
    \ activate the filter in Ettercap.\n"
  mdcn: "\n\n4. 将计划与现有的扫描任务关联。\n\n## 自定义扫描配置\n\nOpenVAS 允许你创建自定义扫描配置以满足特定需求。\n\n+\
    \ 1. 转到“Configuration”（配置） > “Scan Configs”（扫描配置）。\n2. 点击“New Scan Config”（新建扫描配置）创建一个新的扫描配置。\n\
    3. 根据需要添加或删除扫描插件。\n4. 保存自定义配置并将其与扫描任务关联。\n\n## 与与其他系统的集成\n\nOpenVAS 可以与其它安全工具集成，以改进漏洞管理。\n\
    \n## 与 SIEM（安全信息和事件管理）集成的示例：\n\n+ 1. 配置 OpenVAS 将日志和报告发送到 SIEM 系统。\n2. 使用 SIEM\
    \ 专用的 API 或连接器导入漏洞数据。\n3. 将漏洞数据与 SIEM 中的其他安全事件进行关联分析。\n\n## 实际示例\n\n## 示例 1：内部网络扫描\n\
    \n+ 1. 在“Configuration”（配置） > “Targets”（目标）中创建一个新目标。\n2. 指定内部网络的 IP（例如 192.168.1.0/24）。\n\
    3. 创建一个新的扫描任务并关联内部网络目标。\n4. 运行扫描并在“Scans”（扫描） > “Results”（结果）下查看结果。\n\n## 示例 2：Web\
    \ 服务器漏洞分析\n\n+ 1. 使用 Web 服务器的 IP 或域名创建一个新目标。\n2. 选择一个专注于 Web 漏洞的扫描配置。\n3. 运行扫描并分析结果，以识别如\
    \ SQL 注入、跨站脚本 (XSS) 等漏洞。\n4. 生成有关发现的漏洞及其建议的详细报告。\n\n## 高级技术\n\n## 插件自定义\n\nOpenVAS\
    \ 允许你自定义扫描插件以包含特定的安全检查。\n\n+ 1. 转到“Configuration”（配置） > “Plugins”（插件）。\n2. 根据需要编辑现有插件或创建新插件。\n\
    3. 将自定义插件添加到扫描配置中。\n\n## 报告自动化\n\n使用脚本自动化报告的生成和发送。\n\n## 自动化 Bash 脚本示例：\n\n```bash\n\
    #!/bin/bash\n# 变量配置\nTASK_ID=\"id_da_tarefa\"\nREPORT_FORMAT=\".pdf\"\nOUTPUT_DIR=\"\
    /path/to/reports\"\nAPI_URL=\"https://localhost:9392\"\nUSERNAME=\"user\"\nPASSWORD=\"\
    password\"\n\n# 身份验证并获取令牌\nTOKEN=$(curl -s -k -X POST -d \\\n\"username=${USERNAME}&password=${PASSWORD}\"\
    \ \\\n${API_URL}/login | jq -r '.token')\n\n# 运行扫描\ncurl -s -k -X POST \"X-Auth-Token:\
    \ ${TOKEN}\" \\\n${API_URL}/tasks/${TASK_ID}/start\n\n# 等待扫描完成（例如：1小时）\nsleep\
    \ 3600\n\n# 获取报告 ID\nREPORT_ID=$(curl -s -k H \"X-Auth-Token: ${TOKEN}\" \\\n\
    ${API_URL}/tasks/${TASK_ID}/reports | jq -r '.[0].id')\n\n# 下载报告\ncurl -s -k H\
    \ \"X-Auth-Token: ${TOKEN}\" \\\n${API_URL}/reports/${REPORT_ID}/download -o \\\
    \n${OUTPUT_DIR}/relatorio.${REPORT_FORMAT}\n```\n\n## 最佳实践\n\n+ 1. **合法性**：在对你不拥有的系统和网络进行漏洞扫描之前，务必获得明确许可。\n\
    2. **更新**：保持 OpenVAS 及其扫描插件更新，以确保检测到最新的漏洞。\n3. **文档**：记录所有扫描活动和结果，以供未来参考和报告。\n\
    4. **负责任的使用**：以道德和负责任使用 OpenVAS，尊重安全标准和政策。\n\n## 结论\n\nOpenVAS 是一个用于漏洞管理和分析的强大工具，提供了广泛的功能来识别和修复系统及网络中的漏洞。它执行详细扫描、分析漏洞和生成报告的能力使其成为安全人员的重要选择。通过掌握\
    \ OpenVAS 的使用，你可以确保你的系统受到威胁和漏洞的保护，为更安全的环境做出力量。\n\n## 第 12 章：ETTERCAP\n\n## Ettercap\
    \ 简介\n\nEttercap 是一种用于在本地网络执行中间人（MitM）攻击的开源工具。开发目的是便于拦截、修改和检查网络流量，被安全人员广泛用于测试网络和设备的安全性。它支持多种攻击技术，包括\
    \ ARP 投毒、DNS 欺骗和密码捕获。\n\n## Ettercap 安装\n\nKali Linux 预装了 Ettercap。但是，如果你需要安装或更新它，请使用以下命令：\n\
    \n```bash\nsudo apt update\nsudo apt install ettercap-graphical\n```\n\n启动 Ettercap，请使用：\n\
    \n```bash\nettercap -G\n```\n\n## 初始设置\n\n## 网络接口选择\n\n+ 1. 使用图形化界面打开 Ettercap\
    \ (ettercap -G)。\n2. 转到“Sniff”（嗅探） > “Unified Sniffing”（统一嗅探）。\n3. 选择用于数据包采集的网络接口并点击“OK”。\n\
    \n## 主要功能\n\n## ARP 投毒\n\nARP 投毒是一种通过将数据包重定向到攻击者来拦截网络流量的技术。\n\n+ 1. 转到“Mitm” >\
    \ “ARP poisoning”。\n2. 选择“Sniff remote connections”（监听远程连接）并点击“OK”。\n3. Ettercap\
    \ 开始对网络上设备的 ARP 表进行投毒，将流量重指向攻击者。\n\n## DNS 欺骗\n\nDNS 欺骗是一种将 DNS 流量重定向到攻击者控制的服务器的技术。\n\
    \n+ 1. 打开 Ettercap 配置文件：\n\n```bash\nsudo nano /etc/ettercap/etter.dns\n```\n\n\
    + 2. 添加一个 DNS Mitm 欺骗条目，例如：\n\n```plaintext\nwww.target.com A 192.168.1.100\n\
    ```\n\n+ 3. 保存文件并关闭编辑器。\n4. 在 Ettercap 中，转到“Plugins”（插件） > “Manage the plugins”（管理插件）。\n\
    5. 选择“dns_spoof”并点击“Start”（启动）。\n\n## 密码捕获\n\nEttercap 可以捕获通过网络以明文传输的密码。\n\n+\
    \ 1. 转到“View”（视图） > “Profiles”（配置文件） > “Passwords”（密码）。\n2. 在 Ettercap 执行嗅探时，实时观察捕获到的密码。\n\
    \n## 高级用法\n\n## 包过滤\n\nEttercap 允许你创建自定义过滤器来修改传输中的数据包。\n\n+ 1. 创建过滤器文件，例如 filter.ef：\n\
    \n```plaintext\nif (ip.proto == TCP && tcp.dst == 80) {\n  if (search(DATA.data,\
    \ \"GET\")) {\n    replace(\"GET\", \"POST\");\n    msg(\"Replaced GET with POST\\\
    n\");\n  }\n}\n```\n\n+ 2. 编译或过滤：\n\n```bash\nafter filter filter.ef -o filter.ef\n\
    ```\n\n+ 3. 在 Ettercap 中，转到“Filters”（过滤器） > “Load a filter”（加载过滤器）并选择编译后的过滤器。\n\
    4. 启用过滤器以修改传输中的包。\n\n## SSL 剥离攻击\n\nEttercap 可以执行 SSL 剥离攻击将 HTTPS 连接转换为 HTTP，允许拦截数据。\n\
    \n+ 1. 在 Ettercap 中，转到“Plugins”（插件） > “Manage the plugins”（管理插件）。\n2. 选择“sslsplit”并点击“Start”。\n\
    \n## 使用 Wireshark 进行流量分析\n\nEttercap 可以结合 Wireshark 执行详细的流量分析。\n\n+ 1. 启动 Ettercap\
    \ 并配置包采集。\n2. 启动 Wireshark 并选择相同的网络接口。\n3. 在两个工具中同时捕获并分析数据包。\n\n## 实际示例\n\n##\
