    \ pre-installed on Kali Linux. However, if you need to install or update it, use\
    \ the following commands:\n\n```bash\nsudo apt update\nsudo apt install tcpdump\n\
    ```\n\nTo verify the installation, run:\n\n```bash\ntcpdump --version\n```\n\n\
    ## Main Features\n\n### Packet Capture\n\nTcpdump allows real-time network packet\
    \ capture.\n\n# Basic Capture Example:\n\n```bash\nsudo tcpdump -i eth0\n```\n\
    \nExplanation:\n- -i eth0: Specifies the network interface to capture (in this\
    \ case, eth0).\n\n### Saving Captures to Files\n\nYou can save captures to files\
    \ for later analysis.\n\n# Example of use:\n\n```bash\nsudo tcpdump -i eth0 -w\
    \ capture.pcap\n```\n\nExplanation:\n- -w capture.pcap: Specifies the file where\
    \ packages will be saved.\n\n### Reading Capture Files\n\nTcpdump can read capture\
    \ files for analysis.\n\n# Example of use:\n\n```bash\ntcpdump -r capture.pcap\n\
    ```\n\nExplanation:\n- -r capture.pcap: Specifies the capture file to read.\n\n\
    ## Advanced Usage\n\n### Capture Filters\n\nTcpdump allows the use of filters\
    \ to capture only relevant traffic.\n\n# Example of Basic Filters:\n\n- 1. HTTP\
    \ traffic capture:\n\n```bash\nsudo tcpdump -i eth0 'tcp port 80'\n```\n\n- 2.\
    \ Capturing traffic from a specific host:\n\n```bash\nsudo tcpdump -i eth0 'host\
    \ 192.168.1.1'\n```\n\n- 3. UDP traffic capture:\n\n```bash\nsudo tcpdump -i eth0\
    \ 'udp'\n```\n\n### Detailed Package Analysis\n\nTcpdump can provide detailed\
