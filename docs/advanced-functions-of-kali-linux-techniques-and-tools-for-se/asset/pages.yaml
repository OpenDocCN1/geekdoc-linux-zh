  md: '# CHAPTER 2: NMAP


    # Introduction to Nmap


    Nmap, short for Network Mapper, is an open source tool used for network exploration
    and security auditing. Created by Gordon Lyon (Fyodor), it is widely used by network
    administrators and security professionals to discover hosts and services on a
    network. Nmap can be used to perform network scans, identify active devices, detect
    operating systems and running services, among other functionalities. In this chapter,
    we will explore from the basic concepts to advanced techniques using Nmap.


    # Nmap Installation


    Kali Linux comes with Nmap pre-installed. However, if for some reason you need
    to install or update, use the following commands:


    ```

    bash

    sudo apt update

    sudo apt install nmap

    ```


    To verify that Nmap is installed correctly, run:


    ```

    nmap -v

    ```'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# # Nmap Main Features


    # ## 1. Host Discovery


    Host discovery is one of the most basic and useful features of Nmap. Allows you
    to identify which devices are active on a network.


    # ### Example of use:


    ```

    bash

    nmap -sn 192.168.1.0/24

    ```


    Explanation:


    +   - -sn: Performs a "ping" scan, listing active devices without performing a
    port scan.

    - 192.168.1.0/24: Range of IP addresses to be scanned.


    # ## 2. Port Scan


    Port scanning is essential to identify which services are running on a device.
    This helps determine vulnerabilities and entry points.


    # ### Example of use:


    bash


    ```

    nmap -p 1-65535 192.168.1.1

    ```


    Explanation:'
  merge: -1
  pgno: 21
- img_proc: true
  md: '+   - -p 1-65535: Specifies to scan all ports from 1 to 65535.

    - 192.168.1.1: IP address of the target.


    # 3. Service Identification


    Nmap can identify services and their versions running on open ports.


    # Example of use:


    ```

    bash

    nmap -sV 192.168.1.1

    ```


    Explanation:


    +   - sV: Attempts to determine the version of services running on open ports.


    # 4. Operating System Detection


    Operating system detection helps identify the system running on the target device.


    # Example of use:


    ```

    bash

    nmap -O 192.168.1.1

    ```


    Explanation:'
  merge: -1
  pgno: 22
- img_proc: true
  md: '+   - -O: Attempts to determine the target''s operating system.


    # Advanced Nmap Usage


    # 1. Full Network Scan


    To perform a full scan that includes host discovery, port detection, services,
    and operating system:


    # Example of use:


    ```

    bash

    map -A 192.168.1.0/24

    ```


    Explanation:


    +   - -A: Enables detection of operating system, version, scan script and traceroute.


    # 2. Stealth Scan


    Stealth scanning is used to avoid detection by monitoring systems. It uses the
    SYN scan method, which sends only SYN packets and waits for the SYN-ACK response.


    # Example of use:


    ```

    bash

    map -sS 192.168.1.1

    ```


    Explanation:'
  merge: -1
  pgno: 23
- img_proc: true
  md: '- -sS: Performs a stealth SYN scan.


    # # 3. Uso de Scripts Nmap (NSE)


    Nmap has a powerful scripting engine, which allows you to perform additional security
    and vulnerability checks.


    # ## List Available Scripts:


    ```

    bash

    ls /usr/share/nmap/scripts/

    ```


    # ## Run a Specific Script:


    ```

    bash

    nmap --script http-enum 192.168.1.1

    ```


    Explanation:


    +   - script http-enum: Execute a script http-enum to enumerate directories and
    files on an HTTP server.


    # ## Practical examples


    # ### 1. Local Network Scan


    To discover all devices on your local network, run:


    ```

    bash

    ```'
  merge: -1
  pgno: 24
- img_proc: true
  md: '```

    nmap -sn 192.168.0.0/24

    ```


    This command provides a list of all active devices on the network.


    # 2. Web Security Scan


    To scan a web server for common vulnerabilities:


    bash


    ```

    nmap -p 80,443 --script http-vuln* 192.168.1.1

    ```


    This command scans ports 80 and 443 of the target device, running HTTP vulnerability
    detection scripts.


    # 3. FTP Services Scan


    To check an FTP server for vulnerabilities:


    bash


    ```

    nmap -p 21 --script ftp* 192.168.1.1

    ```


    This command scans port 21 and runs FTP-related scripts to identify possible vulnerabilities.


    # Advanced Nmap Techniques


    # 1. Avoid Firewalls and IDS


    Firewalls and Intrusion Detection Systems (IDS) can block Nmap scans. To get around
    this, use advanced techniques'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'such as packet fragmentation, changing the scan interval, and using proxies.


    # Packet Fragmentation:


    bash


    ```

    nmap -f 192.168.1.1

    ```


    Explanation:


    +   - f: Fragments scan packets into small fragments to avoid detection.


    # Changing Scan Interval:


    bash


    ```

    nmap -T2 192.168.1.1

    ```


    Explanation:


    +   - T2: Sets a slower scan interval, reducing the chance of detection.


    # 2. IPv6 Network Scanning


    With the growth of IPv6 adoption, Nmap supports scanning over IPv6 networks.


    # Example of use:


    bash


    ```

    nmap -6 2001:db8::/32

    ```'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'Explanation:


    +   - -6: Enables scanning on IPv6 networks.


    # 3. IoT Device Scanning


    IoT devices are often targets of attacks due to their weak security configurations.
    Use Nmap to identify and analyze these devices.


    # Example of use:


    bash


    ```

    nmap -p 80 --script http-iot* 192.168.1.0/24

    ```


    Explanation:


    +   - --script http-iot*: Runs scripts related to IoT device security.


    # Advanced Tips


    # 1. Scan Automation with Nmap


    Automating Nmap scans can save time and ensure regular scans are performed. Use
    bash scripts or tools like cron to schedule scans.


    # Bash Script Example:


    bash'
  merge: -1
  pgno: 27
- img_proc: true
  md: '```

    #!/bin/bash

    map -A 192.168.1.0/24 -oN /path/to/output/scan_results.txt

    ```


    Explanation:


    +   -oN: Saves the scan results to a text file.


    # Scheduling with Cron:


    bash


    ```

    crontab -e

    ```


    Add the line:


    bash


    ```

    0 2 * * /path/to/script.sh

    ```


    Explanation:


    +   - This command schedules the script to run daily at 2 am.


    # 2. Use of Output and Reports


    Nmap offers several output options that can be used to create detailed reports.


    # XML Output:


    bash


    ```

    nmap -oX scan_results.xml 192.168.1.0/24

    ```'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Explanation:


    +   - -OX: Saves scan results in XML format.


    # # HTML Report:


    Combine Nmap with tools like xsltproc to generate HTML reports.


    bash


    ```

    xsltproc scan_results.xml -o scan_results.html

