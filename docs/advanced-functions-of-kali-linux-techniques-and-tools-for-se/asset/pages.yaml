  md: '# CHAPTER 1: KALI LINUX INSTALLATION


    Installing Kali Linux is the first step to exploring the advanced tools and features
    of this powerful distribution. Kali Linux is a Debian-based distribution designed
    for penetration testing and security auditing. This chapter will provide a detailed
    approach to installing Kali Linux, covering everything from preparing the environment
    to initial system configuration.


    # System Requirements


    Before beginning installation, it is essential to ensure that your system meets
    the minimum requirements:


    +   **Processor**: 64-bit or 32-bit processor (x86)

    **RAM memory**: Minimum 2 GB (4 GB or more recommended)

    **Disk Space**: At least 20 GB of disk space (50 GB or more recommended)

    **Internet Connection**: Required to download updates and additional packages


    # Environment Preparation


    # Download ISO Image'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'The first step is to download the Kali Linux ISO image from the official website:


    +   1. Go to the Kali Linux downloads page.

    2. Select the appropriate version (32-bit or 64-bit) and click "Download".


    # Integrity Check


    It is crucial to verify the integrity of the downloaded ISO image to ensure that
    it has not been corrupted or tampered with. Use the SHA256 checksum provided on
    the website:


    In the terminal, navigate to the directory where the ISO image was downloaded.


    Run the command to calculate the SHA256 checksum:


    ```

    sha256sum kali-linux-2024.1-amd64.iso

    ```


    Compare the output with the checksum provided on the website. If it matches, the
    image is intact.


    # Creating Installation Media


    # Bootable USB


    The most common way to install Kali Linux is to create a bootable USB. For this,
    you can use tools like Rufus (Windows) or dd (Linux/macOS).'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Using Rufus on Windows


    +   1. Download and install Rufus.

    2. Connect a USB stick to your computer.

    3. Open Rufus and select the USB stick in the "Device" section.

    4. Click "Select" and choose the Kali Linux ISO image.

    5. Click "Start" and wait for the bootable USB to be created.


    # Using dd no Linux/macOS


    Connect a USB stick to your computer.

    On the terminal, identify the USB device (e.g. /dev/sdX):


    ```

    bash

    sudo fdisk -l

    ```


    Run the command dd to copy the ISO image to USB (replace /dev/sdX by the correct
    device):


    ```

    bash

    sudo dd if=kali-linux-2024.1-amd64.iso of=/dev/sdX bs=4M status=progress

    ```


    Wait for it to complete, then eject the USB:


    ```

    bash

    sudo eject /dev/sdX

    ```'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Kali Linux Installation


    # Boot from USB


    +   1. Insert the USB stick into the computer where you want to install Kali Linux.

    2. Restart the computer and access the boot menu (usually by pressing F2, F12,
    DEL, or ESC during boot).

    3. Select the USB stick as the boot device and press Enter.


    # Installation Process


    +   1. From the Kali Linux boot menu, select "Graphical Install" and press Enter.

    2. Choose the installation language and click "Continue".

    3. Select your country and click "Continue".

    4. Choose your keyboard configuration and click "Continue".


    # Network Configuration


    +   1. The installer will attempt to automatically configure the network using
    DHCP. If it fails, you can configure it manually.

    2. Enter the hostname for the system (for example, time).

    3. Enter the domain name if applicable (can be left blank).'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# User Configuration


    +   1. Set the root user password. It is recommended to use a strong and secure
    password.

    2. Reconfirm the root password and click "Continue".


    # Disk Partitioning


    +   1. Choose the partitioning method. For most users, "Guided - use entire disk"
    is the best option.

    2. Select the disk where you want to install Kali Linux and click "Continue"

    3. Choose the partitioning scheme. "All files in one partition" is the simplest
    for beginners.

    4. Confirm the changes to the disk and click "Continue". This will erase all data
    on the selected disk.


    # System Installation


    +   1. The installer will start copying files and installing the system. This
    process may take a few minutes.

    2. During installation, you will be asked to configure the package manager. Select
    "Yes" to use a network mirror and click "Continue".

    3. Choose a network mirror close to your location to get updates faster.


    # Bootloader Installation


    When prompted, choose to install the GRUB bootloader. Select "Yes" and choose
    the disk where GRUB will be installed (usually /dev/sda).'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Confirm the GRUB installation and click "Continue".


    # # First Boot and Post-Installation Configuration


    After the installation is complete, the system will restart. Remove the USB stick
    and allow the system to boot from the hard drive.


    In the login page, enter root as the username and password configured during installation.


    Update the system to ensure you have the latest patches and packages:


    bash


    ```

    apt update

    apt upgrade -y

    ```


    # # Additional Settings


    # # Repository Configuration


    Open the apt font file:


    bash


    ```

    nano /etc/apt/sources.list

    ```'
