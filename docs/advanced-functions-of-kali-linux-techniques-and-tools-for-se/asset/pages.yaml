  md: '# CHAPTER 5: AIRCRACK-NG


    # # Introduction to Aircrack-ng


    Aircrack-ng is a complete set of tools for auditing Wi-Fi networks. It allows
    users to capture packets, crack WEP and WPA/WPA2-PSK passwords, analyze and exploit
    security vulnerabilities in wireless networks. Aircrack-ng is widely used by security
    professionals to test the robustness of Wi-Fi networks and identify weaknesses
    that can be exploited by attackers.


    # # Aircrack-ng installation


    Aircrack-ng comes pre-installed on Kali Linux. However, you need to install or
    update it, use the following commands:


    ```

    bash

    sudo apt update

    sudo apt install aircrack-ng

    ```


    # # Aircrack-ng Structure


    Aircrack-ng is made up of several tools that perform specific functions:'
  merge: -1
  pgno: 51
- img_proc: true
  md: '+   - Airmon-ng: Enables and disables monitor mode on network interfaces.

    - Airodump-ng: Captures packets and displays detailed information about Wi-Fi
    networks.

    - Aireplay-ng: Injects packets to test wireless networks.

    - Aircrack-ng: Cracks WEP and WPA-PSK keys using dictionary attacks or other methods.

    - Airbase-ng: Creates fake access points for social engineering attacks.


    # # Basic Usage


    #  Configuring Monitor Mode with Airmon-ng


    The first step to using Aircrack-ng is to configure the wireless network interface
    in monitor mode.


    List the available wireless network interfaces:


    ```

    bash

    airmon-ng

    ```


    Enable monitor mode on the desired interface (replace wlan0 through its interface):


    ```

    bash

    airmon-ng start wlan0

    ```'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'Check whether monitor mode has been successfully enabled:


    ```

    bash

    airmon-ng

    ```


    The interface should be displayed as wlan0mon or something similar.


    # Packet Capture with Airodump-ng


    To capture packets from Wi-Fi networks, use Airodump-ng: Start packet capture
    on the interface in monitor mode:


    ```

    bash

    airodump-ng wlan0mon

    ```


    Identify the target network from the displayed list. Note the BSSID (MAC address)
    and channel (CH) of the network. Capture specific packets from the target network:


    ```

    bash

    airodump-ng --bssid <BSSID> -c <channel> -w capture wlan0mon

    ```


    Replace <BSSID> by the network BSSID and <canal> via the corresponding channel.
    O -in captur indicates that the packages will be saved in the file capture.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# # Packet Injection with Aireplay-ng


