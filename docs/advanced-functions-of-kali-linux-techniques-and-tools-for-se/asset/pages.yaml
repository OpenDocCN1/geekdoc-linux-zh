  md: '# CHAPTER 24: NETCAT


    # # Introduction to Netcat


    Netcat, often referred to as the "Swiss Army knife of networking", is a versatile
    networking tool that can read and write data across network connections, using
    the TCP and UDP protocols. Developed to be a simple yet powerful tool, Netcat
    is widely used by system administrators and security professionals for tasks such
    as network debugging, file transfer, vulnerability exploitation, and more.


    # # Netcat Installation


    Netcat comes pre-installed on Kali Linux. However, if you need to install or update
    it, use the following commands: bash


    ```

    sudo apt update

    sudo apt install netcat

    ```


    To verify the installation, run: bash


    ```

    nc -h

    ```


    # # Main Features'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# # File transference


    Netcat can be used to transfer files between two machines quickly and efficiently.


    # ## Example of use:


    +   1. On the source system, run:


    ```

    bash

    nc -l 1234 < /path/to/file

    ```


    +   2. On the target system, run:


    ```

    bash

    nc <source_system_IP> 1234 > /path/to/save/file

    ```


    # ## Port Scanning


    Netcat can perform port scans to check the availability of services on a remote
    machine.


    # ## Example of use:


    ```

    bash

    nc -zv <destination_IP> 20-80

    ```


    Explanation:


    +   - -With: Uses scan mode without sending data.

    - -in: Verbose mood.

    - 20-80: Range of ports to be scanned.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Simple Chat


    Netcat can be used to create a simple chat between two machines.


