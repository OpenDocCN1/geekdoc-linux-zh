  md: '# CHAPTER 6: JOHN THE RIPPER


    # Introduction to John the Ripper


    John the Ripper, often abbreviated as "John", is a highly efficient open source
    password cracking tool. Initially developed for Unix, it now supports a variety
    of platforms including Windows, Linux, and macOS. John the Ripper is widely used
    by system administrators and security professionals to test password strength
    and identify weak passwords that could compromise system security.


    # Installing John the Ripper


    John the Ripper is already pre-installed on Kali Linux. However, if you need to
    install or update it, use the following commands:


    ```

    sudo apt update

    sudo apt install john

    ```


    To verify the installation, run:


    ```

    john --version

    ```'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# Types of Attacks

    Supported


    John the Ripper supports several types of brute force and ndictionary attacks,
    including:


    +   - Dictionary Attack: Uses a list of known words.

    - Brute Force Attack: Tests all possible combinations of characters.

    - Incremental Attack: An optimized brute force type.

    - Hybrid Attack: Combines dictionary and brute force.


    # Preparing for Password

    Cracking


    # Hash Collection


    To crack passwords, you first need the password hashes. Hashes can be extracted
    from various files depending on the system. On Linux systems, hashes are usually
    found in the file /etc/shadow.


    # Example of Extracting

    Hashes in Linux:


    +   1. Copy the file /etc/shadow to a safe location where you are allowed to review
    it.


    ```

    bash

    sudo cp /etc/shadow /path/to/directory/

    ```'
  merge: -1
  pgno: 63
- img_proc: true
  md: '2. Combine the file /etc/passwd with the file /etc/shadow using the tool unshadow
    do John the Ripper:


    ```

    unshadow /etc/passwd /path/to/directory/shadow > /path/to/directory/unshadowed.txt

    ```


    # # Dictionary Preparation


    Prepare a dictionary file with words that will be used for the dictionary attack.
    You can download lists of common dictionaries or create your own text file.


    # # Basic Usage


    # # Dictionary Attack


    To perform a dictionary attack:


    ```

    john --wordlist=/path/to/wordlist.txt /path/to/unshadowed.txt

    ```


    Explanation:


    +   - wordlist: Specifies the dictionary file.

    - /path/to/wordlist.txt: Path to the dictionary file.

    - /path/to/unshadowed.txt: Path to the file with the password hashes.


    # # Brute Force Attack


    To perform a brute force attack:'
  merge: -1
