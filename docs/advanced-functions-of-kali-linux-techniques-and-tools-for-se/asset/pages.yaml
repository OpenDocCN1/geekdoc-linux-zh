  md: 'Add the following lines to ensure you are using the official Kali Linux repositories:


    ```

    bash

    deb http://http.kali.org/kali-rolling main non-free contrib

    ```


    Save and close the file (Ctrl+O, Enter, Ctrl+X).


    # # Installing Additional Tools


    Kali Linux offers a metapackage that includes all available security tools. To
    install all tools, run:


    ```

    bash

    apt install kali-linux-all

    ```


    To save space and install only specific tools, you can choose smaller metapackages
    such as kali-linux-top10 (the 10 most popular tools) or kali-linux-wireless (wireless
