  md: '# CHAPTER 27: VOLATILITY


    # Introduction to Volatility


    Volatility is an advanced volatile memory forensics framework used to examine
    memory (RAM) captures from compromised systems. Initially developed by the Volatile
    Systems project, Volatility is an essential tool for forensic investigators and
    security analysts, enabling the extraction of detailed information about running
    processes, network connections, open files, and more. The ability to analyze volatile
    memory provides deep insight into the state of a system at the time of capture,
    making it a crucial tool for security incident investigations.


    # Volatility Installation


    Volatility can be installed on Kali Linux using the following commands:


    ```

    bash

    sudo apt update

    sudo apt install volatility

    ```


    To verify the installation, run:


    ```

    bash

    volatility --version

    ```'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Main Features


    # Process analysis


    Volatility allows you to list and examine processes running at the time of memory
    capture.


    # Example of use:


    ```

    volatility -f /caminho/para/captura.mem --profile=Win10x64_19041 pslist

    ```


    Explanation:


    +   - -f /caminho/para/captura.mem: Specifies the memory capture file.

    - --profile=Win10x64_19041: Specifies the operating system profile.

    - pslist: Lists running processes.


    # Network connections


    Volatility can identify active network connections at the time of capture.


    # Example of use:


    ```

    volatility -f /caminho/para/captura.mem --profile=Win10x64_19041 netscan

    ```'
