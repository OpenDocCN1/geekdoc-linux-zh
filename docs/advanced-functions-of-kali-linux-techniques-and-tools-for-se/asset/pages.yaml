    # # Writing Custom Rules


    Snort allows you to create custom rules to detect specific activities.


    # # Structure of a Snort Rule:


    plaintext


    ```

    alert tcp any any -> 192.168.1.0/24 80 (msg:"Possible web attack"; sid:1000001;
    rev:1;);

    ```


    Explanation:


    +   - alert: Action to be taken (alert, log, pass, activate, dynamic).

    - tcp: Protocolo (tcp, udp, icmp).

    - any: Address and port of origin.

    ->: Traffic direction.

    - 192.168.1.0/24 80: Destination address and port.

    - (msg:"Possible web attack"; sid:1000001; rev:1;): Optional - alert message,
    rule ID and revision.


