  md: '# CHAPTER 4: WIRESHARK


    # Introduction to Wireshark


    Wireshark is one of the most popular and powerful tools for analyzing network
    packets. With Wireshark, you can capture and interact with network traffic in
    real time, which is essential for detecting network issues, analyzing attacks,
    and performing security audits. This chapter will provide a detailed approach
    to using Wireshark, ranging from basic concepts to advanced techniques.


    # Wireshark Installation


    Wireshark comes pre-installed on Kali Linux. However, if for some reason you need
    to install or update it, use the following commands:


    ```

    bash

    sudo apt update

    sudo apt install wireshark

    ```


    To allow normal users to capture packets, configure Wireshark:


    ```

    bash

    sudo dpkg-reconfigure wireshark-common

    ```


    Choose "Yes" to allow non-root to use Wireshark. Add the user to the group wireshark:'
  merge: -1
  pgno: 43
- img_proc: true
  md: '```

    bash sudo usermod -aG wireshark $USER

    ```


    Restart your session for the changes to take effect.


    # Interface do Wireshark


    Wireshark''s graphical interface is intuitive and feature-rich. When you start
    Wireshark, you will see a list of available network interfaces. Select the interface
    you want to monitor and click "Start" to begin packet capture.


    # Packet Capture


    # Starting Capture


    To start packet capture, follow the steps below:


    +   1. Abra o Wireshark.

    2. Select the desired network interface.

    3. Click "Start" to begin packet capture.


    # Stopping the Capture


    To stop packet capture:


    +   1. Click the "Stop" button (red square) on the toolbar.


    # Saving Captures


    To save packet capture:


    +   1. Go to "File" > "Save As".'
