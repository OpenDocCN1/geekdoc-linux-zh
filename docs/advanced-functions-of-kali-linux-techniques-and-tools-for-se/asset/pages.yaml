    Wireshark provides detailed analysis of captured packets. Each packet is listed
    with information such as capture time, origin, destination, protocol and more.
    When selecting a package, you can see its detailed protocol layers, from the physical
    layer to the application layer.


    # Capture and Display Filters


    # Capture Filters


    Capture filters are used to limit the packets captured by the interface. An example
    of a capture filter to capture only HTTP packets is:


    ```

