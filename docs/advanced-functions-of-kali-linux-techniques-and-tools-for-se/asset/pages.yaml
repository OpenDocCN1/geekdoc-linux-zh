    hydra -l usuario -P /path/to/passwordlist.txt -M targets.txt ftp

    ssh telnet

    ```


    Explanation:


    +   - M targets.txt: Specifies a file containing a list of targets.

    - ftp ssh telnet: Specifies the services to be tested.


    # ## Use of Proxy


