    3 When you see the Starting Windows 95/98 screen, press F4.


    4 Click Safe Mode, Command Prompt Only, and press ENTER.


    5 At the command line prompt, go to the folder where you installed Corel LINUX.
    Typically, Corel LINUX is installed to the C:\CDL folder where C:\ corresponds
    to the drive letter. To navigate to this folder, type C:\ and press ENTER, and
    then type cd CDL and press ENTER.


    6 Type StartCDL.BAT.


    # Installing Corel LINUX to coexist with another operating system


    Corel LINUX can coexist with multiple operating systems on the same computer.
    For Corel LINUX to coexist with other systems, the computer hard disk(s) must
    be partitioned, and at least one partition must be used by Corel LINUX. "Understanding
    Install Express and disk partitions" on page 21.


    The following procedure is based on having Corel LINUX coexist with Microsoft
    Windows and is for experienced users.


    # To install Corel LINUX to coexist with another operating system


    +   I Follow steps 1 to 6 from the procedure "To replace Microsoft Windows with
    Corel LINUX" on page 25.


    +   2 Enable one of the following buttons:


    +   * Use Free Disk Space — this option requires free unallocated disk space on
    a partitioned hard disk. Before installing Corel LINUX, Install Express formats
    this space as a Linux partition and a swap file partition. The file system format
    for a Linux partition is ext2.


    +   * Edit Partition Table — this option lets you delete and create partitions
    on a hard disk. Before using this option you should backup important data to other
    media. This option does not let you edit partition size.


    +   3 Click Next, and follow the installation instructions in Install Express.


    +   * For information about starting Corel LINUX on a multi-operating system computer,
    see "Starting Corel LINUX and other operating systems" on page 31.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_37_0.png)'
