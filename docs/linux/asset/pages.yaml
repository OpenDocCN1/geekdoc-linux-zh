- pgno: 288
  md: '![](img/86803f2a30e88fe6e62989f0fe100a53_288_0.png)


    # Managing printing and fonts in Corel LINUX 14


    You must install a printer before you can print. You can add and remove printers,
    and customize printer properties using the Printing Manager. The Printing Manager
    receives and stores print jobs, then prints each job in the background, so that
    users can continue working while the file prints. If you are using a network or
    shared printer, you can view print jobs that are waiting to be printed in the
    print queue. The print queue also lets you cancel print jobs.


    Users can only view the information located in the Printing Manager. You must
    be logged in the root user to make changes to printer properties or to add or
    remove printers.


    Use the Font Manager to specify which fonts are available to use with the desktop
    and in desktop applications. For information on changing desktop fonts, see “Changing
    desktop fonts” on page 62.


    # Setting up printers


    Before you can print in Corel LINUX, you must set up a printer. When you print
    a file from an application, you can only choose a printer that has been added
    to the Printing Manager. Use the Printing Wizard to add local or network printers
    to your desktop. A local printer is attached to your'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'computer, whereas a network printer resides on a network computer and can be
    shared so other users can print to it. You can also remove printers.

    You must be the root user to add or remove printers. If you are not logged in
    as the root user, you can switch users in the Printing Manager. For information
    about working as the root user, see “Using the root account” on page 103.


    # ### Adding printers


    The Printing wizard lets you add printers. To add a local printer you must specify
    a printer name and the device or port on your computer to which the printer is
    connected. Printers can connect through either a serial or parallel port. Ensure
    that you know the make and model of the printer before you add it.


    When you add a network printer, you must specify the printer name and hostname.
    The hostname is the name of the server that controls the printer. You must also
    specify if the printer resides on a Windows or UNIX/Linux-based network.


    # ### To add a printer


    +   1 Click Application Starter, Control Center.

    2 Click Printers.

    3 In the Print dialog box, click Add.

    4 Follow the steps in the Printing wizard.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_289_0.png)


    +   * The Add button appears dimmed if you are not the root user.

    * When you add a Windows network printer, the wizard prompts you to provide your
    network user name and network password before you can choose a hostname.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_289_1.png)


    # ### Removing printers


    You can remove printers using the Printing Manager. You must be logged in as the
    root user to remove printers.


    # ### To remove a printer


    +   1 Click Application Starter, Control Center.

    2 Click Printers.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_289_2.png)


    Corel LINUX User Guide: Chapter 14'
  merge: -1
  img_proc: true
- pgno: 290
  md: '+   3 Choose a printer from the Installed Printers list box.

    4 Click Remove.


    +   * You must be logged in as the root user to add or remove a printer. You can
    switch to the root user by clicking Modify and entering your root user password.


    # # Managing print jobs


    You can print documents after you set up a printer. For information about setting
    up a printer, see “Setting up printers” on page 279.


    When you print to a network printer, the print queue stores the job until the
    printer can process it. Each network printer has a print queue. You can manage
    the print jobs you send to a network computer using the print queue. You can view
    print jobs scheduled to or cancel jobs.


    # # Printing documents


    The Printing Manager handles the printing process when you print a document. Unless
    otherwise specified, print jobs print on the default printer using the default
    settings. For information about changing the default printer, see “Setting a default
    printer” on page 286. For information about customizing printer properties for
    the printer, see “Customizing properties” on page 283.


    Most applications let you print using the File menu. You must open the document
    in an application before you can print.


    # ## To print a document


    +   * Click File, Print.


    # # Accessing the print queue


    Print jobs that are sent by users to a network printer are put in a print queue.
    Print jobs are listed in the order in which they are sent to the printer. The
    print queue lists the following information about each print job: owner, job,
    filename, and the time the document was sent to the printer. You can access the
    print queue to check the status of a print job.


    You must be logged in as the root user to access the print queue.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# To access the print queue


    +   1 Click Application Starter, Control Center.

    2 Click Printers.

    3 In the Print dialog box, choose the network printer from the Installed Printers
