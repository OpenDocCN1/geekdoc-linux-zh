    3 Click Format.


    # Naming floppy disks


    You can name a floppy disk using Format Floppy. You can name a floppy disk according
    to the data that is saved on it. For example, a disk that you use to save bitmap
    graphics could be named “Bitmaps.” The name can only be ten characters long and
    you can name only disks that are formatted for a DOS file system.


    # To name a disk


    +   1 Insert a disk in the disk drive.

    2 Enable the Create Label check box.

    3 Type a name in the Create Label box.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Using Note


    The Note utility lets you create multipurpose desktop notes. You can create reminders
    or messages that you can print or email. Note has basic editing functions such
    as cut, copy, and paste and lets you customize fonts and colors.


    A Note icon automatically appears in the Docking Station when you start the utility.
    The Note icon remains in the Docking Station even if you do not have any notes
    active on the desktop. You can create or edit notes by clicking this icon. When
    you log off Corel LINUX without exiting the Note, the icon appears in the Docking
    Station the next time you start Corel LINUX.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_262_0.png)


    # Starting Note


    You can start Note from the desktop. Starting Note for the first time automatically
    displays a note on the desktop. You can have several notes opened on your desktop.


    # Starting Note


    When you start Note, an icon displays in the Docking Station. The application
    icon remains in the Docking Station even when no notes are active on the screen.
    You can remove the Note icon from the Docking Station.


    To start Note


    +   - Click Application Starter, Applications, Utilities, Note.


    To start a new note


    +   - Click the Note icon in the Docking Station, New Note.


    To add or remove the Note icon from the Docking Station


    +   1. Right-click the note.

    2. Choose Options and click Dock In Panel.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Editing notes


    You can open, edit, save, and delete notes on the desktop. Note provides basic
    editing functions, such as cut and paste. You can paste text from the buffer to
    the active text file, another text file, or another application.


    # Opening and renaming notes


    You can open a saved note and change the name of a note. Each note has a default
    name. For example, the first note that you create is named “note 1.” You can rename
    a note to suit its purpose, such as naming a note, “Things to do.


    # To open a note


    +   - Click the Note icon in the Docking Station.

    - Choose a note.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_263_0.png)


    +   - You can also open a note by right-clicking an active note, and clicking
    the note you want to open.


    # To rename a note


    +   - Right-click an active note, Operations, Rename Note.

    - Type the name in the Rename This Note To box.

    - Click Rename.


    # Closing, saving, and deleting notes


    When you close a note it is automatically saved. Closing a note does not exit
    the Note utility. You can save notes without closing them. When you are finished
    with a note, you can delete it.


    # To close a note


    ![](img/86803f2a30e88fe6e62989f0fe100a53_263_1.png)


    +   - In the upper-right corner of the active note, click the Close button.


    # To save a note


    +   - Right-click the active note, Operations.

    - Click Save Notes.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# To delete a note


    +   1 Right-click the active note, Operations.


    +   2 Click Delete Note.


    # Cutting, copying, or pasting, and indenting text in notes


    You can cut or copy the text in a note and paste it to another note. When you
    cut or copy text, it is stored in the buffer. You can paste the text from the
    buffer to the active text file, another text file, or another application. The
    contents of the buffer are available until you cut or copy other text.


    You can enable Auto Indent to automatically indent lines after you make the first
    indent. For example, if you begin typing in the fifth space, Auto Indent indents
    consecutive lines of text to the fifth space.


    # To cut text


    +   1 Select the text you want to cut.


    +   2 Press CTRL + X.


    # To copy text


    +   1 Select the text you want to copy.


    +   2 Press CTRL + C.


    # To paste text


    +   1 Position the cursor where you want to insert the text.


    +   2 Press CTRL + V.


    # To indent text


    +   1 Right-click a note.


    +   2 Click Options, Auto Indent.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_264_0.png)


    +   * You can also enable Auto Indent by clicking Options, Change Defaults.


    # Customizing notes


    You can customize the appearance of a note. You can apply a three-dimensional
    (3D) frame to a note and you can change the size of a note.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'You can set font properties, for example you can set the font type, weight,
    size, and style. You can also choose the color of the font, and the background
    color of your notes. You can choose from preset colors or customize colors.


    You can insert the current date or calendar in a note. You can also set an alarm
    in a note. Alarms can remind you of important dates or times.


    # Formatting the note frame and size


    You can apply a three-dimensional (3D) frame to a note to stand out on your desktop.
    You can also change the size of a note by adjusting the number of pixels. The
    note size is bigger when you increase the number of pixels. Changing the size
    settings changes the size of subsequent notes, but not the size of an active note.


    # To apply a 3D frame


    +   1 Right-click an active note, Options.

    2 Click 3D Frame.


    > You can also apply the 3D frame by clicking Options, Change Defaults.


    # To size a note


    +   1 Right-click a note.

    2 Click Options, Change Defaults

    3 Type a size in the Width and Height boxes.


    # Setting font properties


    You can choose a font and a font color for a note. You can choose a System Color
    or a custom color. To choose a custom color, you can change the settings of the
    Colors Palette. You can type values to specify the hue, saturation, and value.


    # To choose a font for a note


    +   1 Right-click an active note, Options.

    2 Click Font.

    3 Choose a font from the Family list box.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# To choose a font weight, size, or style for a note


    1 Follow steps 1 and 2 from the previous procedure.


    2 Choose any of the following:


    +   * a weight from the Weight list box

    * a font size from the Size list box

    * a font style from the Style list box


    # To choose a color for note text


    1 Right-click the active note, Options.


    2 Click Colors, Text Color.


    3 In the System Colors section, choose a color.


    # To choose a custom color for note text


    1 Follow steps 1 and 2 from the previous procedure.


    2 In the Custom Colors section, click a gray box.


    3 Do one of the following:


    +   * drag the color picker over the palette

    * type values to change the hue, saturation, value, red quality, green quality,
    or blue quality in the color


    4 Click the Add To Custom Colors button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_266_0.png)


    +   * You can also change the font properties by clicking Options, Change Defaults.


    # Choosing background colors for notes


    Note lets you choose the background color of a note. You can choose a preset background
    color or a custom background color. Choosing background colors is helpful if you
    want to color your notes according to your purpose. For example, you can make
    reminders green and notes containing urgent information red.


    # To choose a background color for a note


    1 Right-click the active note, Options.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '2 Click Colors, Background Color.

    3 Choose a color from the System Colors section.


    To choose a custom background color for a note

    1 Follow steps 1 and 2 from the previous procedure.

    2 In the Custom Colors section, click a gray box.

    3 Do one of the following:


    +   - drag the color picker over the palette

    - type values to change the hue, saturation, value, red quality, green quality,
    or blue quality in the color


    4 Click the Add To Custom Colors button.


    You can change background color by clicking Options, Change Defaults.


    # Inserting the date or a calendar to notes


    You can insert the date in your note. You can also insert a calendar that displays
    the current month.


    To insert the date


    +   - Right-click the active note, Insert Date.


    To insert a calendar


    +   1 Right-click the active note, Operations.

    2 Click Calendar.


    # Setting an alarm note


    You can set an alarm in a note. Use the alarm to remind you of a task or event.
    For example, you can set an alarm in a note to remind you of a meeting.


    To set an alarm note


    +   1 Right-click the active note, Operations.

    2 Click Alarm.

    3 Specify the day in the Day box.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '4 Specify the month in the Month box.


    5 Specify the year in the Year box.


    6 Specify the time in the Time box.


    7 In the Time section, enable one of the following buttons:


    +   - AM


    +   - PM


    # Sending notes


    You can send notes to other virtual desktops. You can also make a note visible
    on all desktops. You can print your notes to keep track of them.


    # Changing the desktop location of notes


    You can send a note to a different virtual desktop. You can also display a note
    on all virtual desktops by activating the sticky feature.


    # To send a note to a different virtual desktop


    +   1 Right-click the active note, To Desktop.


    +   2 Choose a desktop.


    # To display a note on all virtual desktops


    +   - Right-click the active note, and click Sticky.


    # To display a note on one virtual desktop


    +   - Right-click the active note, and click UnSticky.


    # Printing a note


    You can print a note.


    # To print a note


    +   1 Right-click the active note, Operations.


    +   2 Click Print Note.


    # Exiting Note


    You can exit Note. When you log off Corel LINUX without exiting Note, the Note
    icon appears in the Docking Station the next time you start Core LINUX.'
  merge: -1
  img_proc: true
- pgno: 269
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Using multimedia applications

    13


    Corel LINUX multimedia applications include CD Player, MIDI/Karaoke Player, and
    Sound Mixer. CD Player lets you play CDs and edit play lists. Editing play lists
    lets you change the order of the songs on a CD.

    MIDI/Karaoke Player lets you play background music and display song lyrics on
    the computer screen. You can also choose the tempo and listen to a song that is
    played using different instruments in Channel View. MIDI/Karaoke Player lets you
    play .MID and .KAR files. You can also increase or decrease the volume and change
    the balance between the left and right speaker using the Sound Mixer.


    # Using CD Player


    CD Player is a multimedia application that lets you play audio compact discs (CDs).
    You can play CDs by inserting them in the CD-ROM drive. You can use CD Player
    to play, pause, and resume playing CDs. You can fast forward and rewind in the
    same track or play different tracks on a CD.


    You can use CD Database (CDDB) to display track and artist information of the
    CD you are playing. CDDBs are online databases of popular music. They contain
    information such as a CD title, artist name, the song title, and number of a track.
    This information is displayed in the CD Window.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'edit the information in the CD Database and upload it to the CDDB online site.

    You can also customize CD Player. You can choose the foreground and background
    color, specify the CD-ROM drive to play CDs, specify the email address to send
    new entries to a CDDB, and specify the Web browser you want to use to get more
    information on a specific artist. You can also dock CD Player, stop playing on
    exit, eject when a CD is finished, and display ToolTips.


    # Starting and exiting CD Player


    You can start and exit CD Player.


    # To start CD Player


    +   * Click Application Starter, Multimedia, CD Player.


    # To quit CD Player


    +   * In the CD Player window, click the Quit button.


    # Playing, stopping, and ejecting CDs


    CD Player lets you play, stop, and eject CDs. Before starting CD Player, ensure
    that the CD you want to play is in the CD-ROM drive.


    # To play a CD


    +   1 Click Application Starter, Multimedia, CD Player.


    +   2 Click the Play button.


    # To stop a CD


    +   * In the CD Player window, click the Stop button.


    # To eject a CD


    +   * In the CD Player window, click the Eject button.


    # Pausing and resuming playing CD tracks


    CD Player lets you pause and resume playing a CD track.


    # To pause and resume a CD track


    +   * In the CD Player window, click the Pause/Play button.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Moving CD tracks forward and backward


    You can move forward and backward in the same track, or move to the previous track
    or next track. Moving forward or backward lets you go back or forward 30 seconds
    in the same track. This is useful when you want to listen to only part of a track.
    Moving to a previous or next track is useful when you are interested in only particular
    tracks on a CD.


    # To move backward in the same track


    +   • In the CD Player window, click the Backwards button.


    # To move forward in the same track


    +   • In the CD Player window, click the Forwards button.


    # To move to the previous track


    +   • In the CD Player window, click the Previous Track button.


    # To move to the next track


    +   • In the CD Player window, click the Next Track button.


    # Shuffling and looping CDs


    You can shuffle and loop CDs using CD Player. When you shuffle a CD, CD Player
    plays the tracks in random order. When you loop a CD, CD Player plays the CD from
    beginning to end continuously. Before starting CD Player, ensure that the CD you
    want to play is in the CD-ROM drive.


    # To shuffle a CD


    +   • In the CD Player window, click the Shuffle button.


    # To loop a CD


    +   • In the CD Player window, click the Loop button.


    # Increasing and decreasing volume on CDs


    You can increase and decrease the volume on a CD using the Sound Mixer. You can
    also change the volume distribution between the left and right speaker.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# To increase and decrease the volume of a CD


    +   1 Click Application Starter, Multimedia, Sound Mixer.

    2 Move the CD slider to increase the volume and down to decrease the volume.


    # To change volume distribution between speakers


    +   1 Click Application Starter, Multimedia, Sound Mixer.

    2 Move the Balance slider to the left and right to distribute volume between the
    left and right speaker.


    +   You can control the sound in the CD Player window by moving the slider left
    to decrease volume and right to increase volume.


    # Using CDDB and SMTP settings


    You can configure Compact Disc Database (CDDB) settings and Simple Mail Transfer
    Protocol (SMTP) settings using CD Player. CDDBs are distributed online databases
    that contain information about most audio CDs in circulation. SMTP lets you send
    email to CDDB sites. You can set CDDB to search for the CD identification code
    on the Internet, use a proxy server to access CDDB, add and remove CDDB sites,
    and specify the CDDB directory in Corel File Manager. You can also view and edit
    CDDB track lists.


    CDs contain a unique identification code from the manufacturer. When a CD is recognized
    by a CDDB site you can view the following in the CD Player window: CD title, artist
    name, CD track list, and number of tracks. If you play a CD that is not recognized
    by any of the CDDBs you can manually type the information using the Play List
    Editor and use SMTP to send the information to a CDDB site.


    +   You must be connected to the Internet to use CDDB and SMTP settings.


    # Enabling CDDB searches


    You can enable CDDB to search for the CD identification code on the Internet.
    When a CD is recognized by a CDDB site you can view the following information
    in the CD Player window: CD title, artist name, CD track list, and number of tracks.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# To enable CDDB lookups


    +   1 In the CD Player window, click the *Configure CD Player button*.

    2 Enable the Enable Remote CDDB check box.


    > > You must be connected to the Internet to use CDDB and SMTP settings.


    # Configuring HTTP proxy and SMTP settings


    You can use a proxy server to access a CDDB site and set up your SMTP connection.
    Proxy is an application that you can use to access the Internet. You should use
    a proxy server if you are on a private network and require a gateway to the Internet.
    To properly configure the proxy server you require a port number for the proxy
    server. You should contact the system administrator of the network for information
    on your proxy port number. You can also configure SMTP to send submissions to
    different CDDB servers.


    # To configure the HTTP proxy


    +   1 In the CD Player window, click the *Configure CD Player button*.

    2 Enable the Use HTTP Proxy To Access CDDB check box.

    3 Type the hostname of the proxy server, in the HTTP:// box.

    4 Type the port number in the box to the right of the HTTP:// box.


    # To configure SMTP settings


    +   1 In the CD Player window, click the *Configure CD Player button*.

    2 Click the SMTP Setup tab.

    3 Enable the Enable Submission Via SMTP check box.

    4 Type the hostname of your mail server in the SMTP Address:Port box.

    5 Type your email address in the Your Email Address box.


    > > You must be connected to the Internet to use CDDB and SMTP settings.


    # Adding and removing CDDB servers


    You can add and remove CDDB servers. If you have your CDDB settings configured,
    adding a CDDB server increases the chances of finding your CD'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'identification code. If the CDDB servers that you are connected to do not find
    the CD identification code of the CD that you are playing then you do not receive
    any information on the CD, artist, or track. You can also remove a CDDB server.


    # To add and remove a CDDB server


    +   1 In the CD Player window, click the Configure CD Player button.

    2 Type the address of the server in the CDDB Server Box, and click the Plus button.


    # To remove a CDDB server


    +   1 In the CD Player window, click the Configure CD Player button.

    2 Choose a CDDB server from the CDDB Server list box, and click the Minus button.


    +   * You must be connected to the Internet to use CDDB and SMTP settings.


    # Accessing online information on CD artists


    Once you have CDDB settings configured you can get online information about performances,
    purchase CDs, and search for information about an artist. You can also customize
    the browser you want to use to open the documents. For example, you can use Corel
    File Manager to open the documents or you can use Netscape Communicator, the browser
    that comes with Corel LINUX. For more information about customizing your browser
    see "Connecting to the Internet" on page 165.


    # To access information on artist performances


    +   1 In the CD Player window, click the Information button.

    2 Click Performances, Tourdates.com.


    # To purchase CDs by the artist


    +   1 In the CD Player window, click the Information button.

    2 Click Purchases, and choose one of the following:

    * CD Now

    * CD Universe'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# To access information on a CD artist


    In the CD Player window, click the Information button.


    +   Click Information, and choose one of the following:

    * Ultimate Bandlist

    * Deja News

    * Excite

    * HotBot

    * Info Seek

    * Lycos

    * Magellan

    * Yahoo!


    +   You must be connected to the Internet to use CDDB SMTP settings.

    * Not all editions of Corel LINUX include Netscape Communicator.


    # Viewing and editing CD play lists


    You can view a CD play list in CD Player. When you view a CD play list, the track
    number and title of each track are displayed in the CD Player window. The Digital
    Bar also lets you view the name of the CD, the name of the track, and the name
    of the artist, and the track titles. You can also view extended information about
    the CD title, and the track titles. For example, some tracks have the track title
    but extra information in parentheses.


    You can edit a CD play list using the CD Database Editor. You can edit the name
    of the track title and the name of the artist and upload the new information to
    a CD Database. Before starting CD Player, ensure that the CD you want to play
    is in the CD-ROM drive.


    # To view a CD play list


    +   In the CD Player window, click the CDDB button.


    # To view extended information on the CD title and artist


    +   In the CD Player window, click the CDDB button.


    +   Click the Ext Info button to the right of the Disc Artist/Title box.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# To view extended information on the track


    +   1 In the CD Player window, click the CDDB button.

    2 Click on the track.

    3 Click the Ext Info Button to the right of the Track/Time/Title list box.


    # To edit a CD title track


    +   1 Follow all the steps from the previous procedure.

    2 Click on a track in the Track/Time/Title list box.

    3 Type the new track title information.

    4 Click the Upload button.


    +   * You must be connected to the Internet to use CDDB and SMTP settings.

    * To upload an edited CD title, you must have your Simple Mail Transfer Protocol
    (SMTP) address configured. For more information on configuring your SMTP address
    see “Configuring HTTP proxy and SMTP settings” on page 265.


    # Customizing CD Player


    CD Player lets you customize the appearance of the CD Player status display, specify
    the CD-ROM device that should play CDs, and customize the Web browser for getting
    information on CD artists. For more information about customizing your browser
    see “Connecting to the Internet” on page 165.


    You can also customize CD Player to display ToolTips, enabling docking, start
    playing as soon as the CD tray is closed, stop playing on exit, and eject the
    CD on finish.


    # Customizing the CD Player status display


    You can customize the appearance of the CD Player status display. The status display
    lets you view the time display, the current volume setting, and the current maximum
    track numbers. You can choose the foreground and background colors of the CD Player
    window. You can also change the main time display. You can change the status to
    show the elapsed time of the current track, the remaining track time, and the
    total time remaining.


    # To change the foreground status display color


    +   1 In the CD Player window, click the Configure CD Player button.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '2 Click the CD Options tab.


    3 Click the Change button in the LED Color section.


    4 Do one of the following:


    +   - add a color from the System Colors section

    - type values to change the hue, saturation, value, red quality,

    quality or blue quality in the color


    # To change the background status display color


    1 Follow steps 1 and 2 from the previous procedure.


    2 Click the Change button in the Background Color section.


    3 Do one of the following:


    +   - add a color from the System Colors section

    - type values to change the hue, saturation, value, red quality,

    quality or blue quality in the color


    # To change the main time display


    +   - In the CD Player window, click the Cycle Time Display button.

    - Tra Rem — displays the remaining track time

    - Tot Rem — displays the total elapsed time

    - Tot Sec — displays the total remaining time


    ![](img/86803f2a30e88fe6e62989f0fe100a53_278_0.png)


    By default, the time display displays the time elapsed for the current

    track.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_278_1.png)


    # Changing the CD-ROM device


    You can customize the CD-ROM device used to play audio CDs. By default

    t CD-ROM device value is /dev/cdrom. You can change the value if you

    have more than one CD-ROM device installed.


    # To change the CD-ROM device


    1 In the CD Player window, click the Configure CD Player button.


    2 Click the CD Options tab.


    3 Type a new value in the CDROM Device box.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_278_2.png)'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Customizing CD Player options


    You can also customize CD Player to display ToolTips in the CD Player window,
    enable docking in the Panel, start playing as soon as the CD tray is closed, and
    eject the CD once it is finished playing. Displaying ToolTips is useful when you
    are unsure of the different button functions in the CD Player window. Docking
    CD Player in the Panel is useful if you want to always access to the CD Player
    window.


    # To display ToolTips


    +   1. In the CD Player window, click the Configure CD Player button.


    +   2. Click the CD Player Options tab.


    +   3. Enable the Show Tool Tips check box.


    # To dock CD Player in the Panel


    +   1. Follow steps 1 and 2 from the following procedure.


    +   2. Enable the Enable Panel Docking check box.


    # To play a CD when the tray is closed


    +   1. Follow steps 1 and 2 from the “To display ToolTips” procedure.


    +   2. Enable the Pay On Tray Close check box.


    # To eject CD on finish


    +   1. Follow steps 1 and 2 from the “To display ToolTips” procedure.


    +   2. Enable the Eject On Finish check box.


    # Using MIDI/Karaoke Player


    MIDI/Karaoke Player is a multimedia application that lets you play songs through
    a Musical Instrument Digital Interface (MIDI) Player as song lyrics are displayed
    on the computer screen. MIDI Players control musical devices such as synthesizers
    and sound cards. MIDI/Karaoke Player lets you change a song''s tempo and play
    a song using different instruments. When you open a song in MIDI/Karaoke Player,
    the song is saved in a temporary collection. The temporary collection is deleted
    at the end of a MIDI/Karaoke session. You can also view and save lyrics, organize
    collections of songs, configure keyboard keys, and customize font settings. MIDI/Karaoke
    Player plays .MID and .KAR files.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_279_0.png)'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'To play songs using MIDI/Karaoke Player, you must have a sound card installed.


    # Starting and exiting MIDI/Karaoke Player


    You can start and exit MIDI/Karaoke Player.


    # To start MIDI/Karaoke Player


    +   * Click Application Starter, Multimedia, MIDI/Karaoke Player.


    # To quit MIDI/Karaoke Player


    +   * Click File, Quit.


    To play songs using MIDI/Karaoke Player, you must have a sound card installed.


    # Playing, pausing, and stopping songs


    MIDI/Karaoke Player lets you play, pause, and stop a song.


    # To play a MIDI/Karaoke song


    +   1 Click Application Starter, Multimedia, MIDI/Karaoke Player.

    2 Click File, Open.

    3 Choose a song from the Open list box.

    4 Click Song, Play.


    # To pause a MIDI/Karaoke song


    +   * Click Song, Pause.


    # To stop a MIDI/Karaoke song


    +   * Click Song, Stop.


    To play songs using MIDI/Karaoke Player, you must have a sound card installed.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '+   • You can also play a song by dragging it to the MIDI/Karaoke Player.

    • You can also pause a song by clicking the Pause button on the toolbar.

    • You can also stop a song by clicking the Stop button on the toolbar.


    # Moving forward and backward in MIDI/Karaoke songs


    MIDI/Karaoke Player lets you move forward and backward in a song, skip to the
    previous song or next song. Moving forward and backward in a song is useful when
    you want to play only part of a song. Moving to the previous or next song is useful
    when you are interested in particular songs in a collection. You can also play
    a song continuously by looping it.


    # To move backward in a song


    +   • On the MIDI/Karaoke Player toolbar, click the Rewind button.


    # To move forwards within the same song


    +   • On the MIDI/Karaoke Player toolbar, click the Forward button.


    # To move to the previous song


    +   • On the MIDI/Karaoke Player toolbar, click the Previous button.


    # To skip to a subsequent track


    +   • On the MIDI/Karaoke Player toolbar, click the Next button.


    # To play a song continuously


    +   1 Click Application Starter, Multimedia, MIDI/Karaoke Player.

    2 Click File, Open.

    3 From the Open list box, choose a song to play.

    4 Click Song, Play.

    5 Click Song, Loop.


    +   • To play songs using MIDI/Karaoke Player, you must have a sound card installed.'
  merge: -1
  img_proc: true
- pgno: 282
  md: "# Viewing and saving lyrics in MIDI/Karaoke Player\n\nYou can view and save\
    \ lyrics in two formats: Text Events and Lyrics Events. Some song lyrics are stored\
    \ as Text Events and others as Lyrics Events. You can choose the lyric format\
    \ or set MIDI/Karaoke Player to automatically choose the lyric format.\n\nWhen\
    \ you play a song, MIDI/Karaoke Player highlights the words that should be sung\
    \ and displays the length of the song on the toolbar.\nMIDI/Karaoke Player also\
    \ lets you save song lyrics.\n\n# To choose the song lyric format\n\n+   1 Click\
    \ File, Open.\n2 From the Open list box, choose the song you want to play.\n3\
    \ Click Options, and choose one of the following:\n  See Text Event — lets you\
    \ view lyrics stored as ASCII text\n  See Lyrics Events — lets you view lyrics\
    \ stored using specific fonts and characters\n\n# To automatically choose the\
    \ text event song lyric format\n\n+   1 Click File, Open.\n2 From the Open list\
    \ box, choose the song you want to play.\n3 Click Options, Automatic Text Cho.\n\
    \n# To save song lyrics\n\n+   1 Click File, Save Lyrics.\n2 From the Save As\
    \ list box, choose the location where you want to save the file.\n\n+   * To play\
    \ songs using MIDI/Karaoke Player, you must have a sound card installed.\n\n#\
    \ Changing the font attributes of lyrics\n\nYou can change the appearance of lyrics\
    \ by changing the font attributes. You can change the family, size, and style\
    \ of a font. The changes you make to a font are added to the default font."
