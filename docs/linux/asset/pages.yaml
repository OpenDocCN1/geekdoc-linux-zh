    # Setting permissions and ownerships


    The system administrator or root user is responsible for managing the system.
    You can assign permissions and ownerships to each user account, directory, and
    file on the system. Assigning user access permission and ownership is a security
    measure to ensure that, although many users can access the system, certain users
    are not allowed to look at or change specified files or directories.


    # Permissions


    As the root user, you can assign permissions to files and directories for users
    and groups. For files, you can assign read, write, and execute permission. For
    directories, you can show entries, write entries, and search permissions. The
    root user can create user groups that have specific file permissions. Users assigned
    to a group are automatically assigned the permissions associated with that group.
    For example, a group named “Mail” can be assigned file access permission to read
    and write to the files associated with mail utilities and administration. The
    user who belongs to the “Mail” group has read and write permission for mail-related
    directories and files.


    # Ownerships


    Every file and directory has an assigned owner. In general, the owner is the user
    who creates the file or directory. File and directory owners can set permissions.
    However, as the root user, you can change the ownerships of files and directories
    to prevent the original owners from further accessing them or changing the permissions.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Setting file permissions


    The user who creates a file has permission to read and write changes to the file
    (and run it as a command if it is an executable file). However, as the root user,
    can change whether a user or group has permission to read, write changes to, or
    execute a file. You can also give file permissions to users who are neither the
    owner nor a member of a group that has been given file permission.


    # To set file permissions for owners


    +   1. Locate the file for which you want to set permissions.

    2. Right-click the file, and click Properties.

    3. Click the Permissions tab.


    +   4 In the User section, enable any of the following check boxes:

    * Read — lets the owner examine the file contents

    * Write — lets the owner change the file

    * Exec — lets the owner run the file as a command


    # To set file permissions for groups


    +   1. Follow steps 1 to 3 from the previous procedure.


    +   2 In the Group section, enable any of the following check boxes:

    * Read — lets group members examine the file contents

    * Write — lets group members change the file

    * Exec — lets group members run the file as a command


    # To set file permissions for others


    +   1. Follow steps 1 to 3 from the “To set file permissions for owners” procedure.


    +   2 In the Others section, enable any of the following check boxes:

    * Read — lets others examine the file contents

    * Write — lets others change the file

    * Exec — lets others run the file as a command


    # Setting directory permissions


    The user who creates a directory has permission to read, write changes to, and
    search the directory. As the root user, you can change whether a user or'
