- pgno: 327
  md: '# Menu Bar


    The Menu Bar lets you change the appearance of the left and right directory panels,
    perform operations on selected files, and perform general operations within the
    application, such as searching for a file.


    # Directory panels


    The double directory panels let you view two directories simultaneously. Midnight
    Commander also supports single panel mode. The panel that contains the selection
    bar is the current directory panel. You must perform operations on files in the
    current directory panel, however some operations also use the inactive directory
    panel. For example, when you copy a file to a new folder, you choose the file
    to copy in the directory panel, then you choose the destination folder from the
    inactive directory panel.


    # Hint line


    The Hint line displays suggestions about commands and functions in Midnight Commander.
    You can turn this feature off.


    # Command line


    The Command line lets you execute system commands from Midnight Commander. For
    more information about system commands, see “Performing file operations using
    the command line” on page 308, and “Working with a shell” on page 293.


    # Function key labels


    The Function key labels located at the bottom of the Midnight Commander interface
    let you perform functions such as displaying Help or viewing a file. You can activate
    these functions using the function keys (F1, F2, F3, etc.) or by clicking the
    function using the mouse.


    # Navigating in the directory panels


    The panel that contains the selection bar is the current directory panel. You
    can change the current directory panel. You can also swap the two panels without
    changing which panel is the current directory panel.


    You can use the mouse or keyboard to view the directory contents of Midnight Commander.
    You can navigate directories using different keystrokes.


    # To change the current directory panel


    +   - Press TAB.'
  merge: -1
  img_proc: true
