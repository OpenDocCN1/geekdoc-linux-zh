    # # Opening and saving files in Hex Editor


    You can open files in Hex Editor and save the files. When you open a file in Hex
    Editor, the file is displayed in hexadecimal numbers. The hexadecimal number system
    uses the numbers zero to nine and the letters A to F. Using this number system,
    the decimal number 12 has a hexadecimal value of C. Working with a file in hexadecimal
    numbers lets you customize your files at the code level. The hexadecimal system
    converts every byte into two hexadecimal digits, which makes the file easier to
    interpret. You should be comfortable with the hexadecimal number system before
    you make changes to files using Hex Editor.


    You can view more than one file at a time by opening a new window. You can save
    an edited file with the same name and location, or rename the file and save it
    in a different location.


    # ## To start Hex Editor


    +   - Click Application Starter, Applications, Utilities, Hex Editor.


    # ## To open a file


    +   - Click File, Open.'
