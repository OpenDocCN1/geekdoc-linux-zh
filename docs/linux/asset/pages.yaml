    # Connecting to Microsoft Windows computers


    Your Core LINUX system can share files and printer services on a network with
    other Linux computers, and with Windows computers. Samba Client software lets
    Windows and Linux systems recognize and communicate with each other. When your
    computer is connected to a network, Samba Client lets you share individual files,
    or mount directories of other Linux and Windows computers through Core File Manager.
    For information about accessing network computers and mounting shared directories,
    see “Sharing directories with remote users” on page 156. Samba software is installed
    automatically with Core LINUX. You can configure Samba Client so you can communicate
    with Windows computers that are part of the Windows workgroup. A workgroup is
    a group of computers connected to a network. A workgroup consists of both Windows
    and Linux systems.


    You can specify a WINS server (if your network has one) to facilitate name resolution
    during file sharing. When you attempt to share to a computer, your computer asks
    the WINS server for the IP address of the computer it is trying to contact. If
    you do not have a WINS server configured on your system or network, your computer
    asks each computer in the workgroup for its address until it finds the right one,
    creating excess traffic on'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'network. You can also set the file and print sharing security level and the
    password authentication server.


    For more information about using Samba server to set up your computer as a file
    server, see “Setting up file and print servers for Windows clients” in the Corel
    LINUX Server Administrator Guide or the Corel LINUX Server Administrator online
    Help.


    You can obtain IP address and password information from your Internet Service
    Provider (ISP) or system administrator.


    # Enabling the Samba Client


    You can enable the Samba Client so that you can share file and print services
    with Windows computers on your network.


    To enable the Samba server on your Corel LINUX computer


    +   1 Click Application Starter, Control Center.

    2 Double-click Network, Windows Workgroups.

    3 Enable the Enable Samba check box.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_359_0.png)


    # Setting workgroup identification


    When you install Corel LINUX, you specified a user name. When you enable the Samba
    server, this user name is used to describe your computer when it appears to other
    users on the system. For example, if a Windows user is looking at a list of network
    computers available for file sharing in Windows Explorer, John Doe’s Corel LINUX
    computer appears as “johnd_linux” if he has not changed his description. You can
    change your computer description in the Windows Workgroups window.


    The workgroup that you are assigned to your network is also set by default when
    you enable Samba Client. When you enable Samba Client, your computer becomes available
    on the network for file sharing with other computers, but it is located on the
    network in a workgroup named WORKGROUP. You can change the workgroup if you want
    your computer to appear in a different location on the Windows Network.


    You can specify a WINS server if your network uses a WINS server for name resolution.
    You can also use the DNS server for name resolution if your network does not use
    a WINS server. For information about setting a DNS server for name resolution,
    see “Adding a DNS server” on page 354.


    # To change your computer description on the network


    +   1 Click Application Starter, Control Center.'
  merge: -1
  img_proc: true
