    # Customizing desktop and keyboard language


    You can change the language that appears on the windows and menus of desktop,
    and customize the international keyboard language maps. You can customize the
    language in which text on desktop icons and windows appears. Changing the desktop
    language displays text on the Application Starter menu, the Panel, and in the
    menus of most Corel LINUX utilities, the language you have set. You can set up
    to three languages. The desktop cannot present information in the first language,
    it tries to present information in the second, and then third language.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_105_0.png)


    An international keyboard language map has characters associated with each keys
    that are different from the characters assigned to the keys of an English keyboard.
    For example, when you apply the French keyboard map to your English keyboard,
    pressing the A keys types the letter Q. Language maps that use non-Latin characters,
    such as Russian or Finnish assign these special characters to the keys. You can
    define keys that let switch between keyboard maps. Each language map can have
    up to four characters associated with each key. You can access the first two characters
    for a key by pressing only the key, and SHIFT + character key, like on a keyboard
    map. The other two characters are alternative characters, which you access using
    a defined alternative switch key.'
