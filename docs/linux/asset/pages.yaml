    4. Click the Login Script tab.

    5. Choose a command from the list box.

    6. Type a character string or numeric parameter in the box beside the list box.

    7. Click Add.

    8. Repeat all the procedures to add another command to the script.


    # To insert a command


    +   1. Follow steps 1 to 4 from the previous procedure.

    2. Click the command in the login script that you want to appear after the new
