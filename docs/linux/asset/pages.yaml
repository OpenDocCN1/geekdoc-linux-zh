    # The tree view and the flat view


    The directories and files in Core LINUX are organized hierarchically in a tree
    structure. The top level of the directory tree is the root directory and is denoted
    by the slash (/) key. All other files and directories branch out from the root.
    A directory that contains subdirectories is called a parent directory. You can
    view the directories and files in Core File Manager using a double-paned tree
    view or a single-pane flat view.


    The tree view lets you navigate the file system using a double-pane window that
    displays multiple levels of the file structure at the same time. When you open
    a directory in the left pane, you see its subdirectories indented below it, and
    its subdirectories in the right pane of the Core File Manager.


    +   The illustration displays the view 1

    1) Title and Menu Bar

    2) Toolbar

    3) Address box (right pane)

    4) Directory list (left pane)

    5) Contents list (right pane)

    6) information headers

    7) Status bar.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_146_0.png)


    The flat view lets you “drill down” into the file system and shows only one level
    of the file structure at a time. Drilling down is the process of navigating through
    the file system hierarchy by opening subdirectories within directories. For example,
    to drill down to file /usr/info/file.txt, you open the root directory, then open
    the usr, then select file.txt. The base level of this view shows the main parent
    directories in the Core LINUX file system. When you open one of them, these changes
    allow to display the subdirectories and files in that. You can open a subdirectory
    to view its contents.'
  merge: -1
