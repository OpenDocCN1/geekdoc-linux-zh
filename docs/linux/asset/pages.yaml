    to your workgroup. You can access the subdirectories and files on the Linux systems
    that you see in the NFS directory, if you have access permission or passwords
    to the system. You must also have Samba configured on your computer, "Connecting
    to Microsoft Windows computers" or the Core LINUX System Administrator online
    Help.


    +   V-Drive — contains files you have stored on your Core V-drive account. You
    can access these files if you are connected to the Internet. For more information
    about setting up a V-Drive account, go to http://corecity.com/services/vdrive/default.asp.
    For more information about connecting to the Internet, "Connecting to the" on
    page 165.


    For more information about using the Windows Network, NFS Network, and V-Drive
    see "Sharing with remote users" on page 156.


    # Viewing directories and directory contents


    Directories display in Core File Manager as folder icons which are accompanied
    by the name of the directory. Directories appear in both the right and left panes
    of the Core File Manager window. You can view a directory''s subdirectories and
    files by selecting the directory using a single mouse click. You can view directories
    and their contents in a tree view that displays multiple levels of the file system
    at once, or in a flat view, that shows one level of the file system. The tree
    view displays as the default view. In both the tree and flat view, you can also
    view the contents of directories in either of the following views:


    +   detailed view — displays a small folder or file icon, size, permissions attributes
    and date of the directory or file in a vertical list


    +   large icon view — displays a large folder or file icon and the name of the
    directory or file


    # To view directories and files in the tree view


    +   On the Panel, click the Core File Manager button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_148_0.png)'
  merge: -1
  img_proc: true
- pgno: 149
  md: '2 Click View, Tree.


    3 Click the directory whose contents you want to view.


    # To view directories and files in the flat view


    +   - In the Tree view of Corel File Manager, click the Close button at the top
    of the All Folders list.


    # To switch between the detailed file view and the large icon view


    +   - In Corel File Manager, click View, Large Icons.


    +   - A check mark beside the Large Icons menu indicates that the large icon view
    is displayed in Corel File Manager. If the check mark does not display in the
    menu, the detailed view is displayed in Corel File Manager.


    # Selecting directories and files


    You can select multiple files and subdirectories within a directory in the tree
    view and the flat view of Corel File Manager. Selecting multiple files and subdirectories
    enables you to move, copy, cut or delete the selected files at the same time.
    You can select a group of files and subdirectories that display consecutively
    in the file list, or you can select all the contents that display discontinuously
    in the file list. the same time or invert your selection, so that all the files
    and subdirectories you have selected are de-selected, and those were not selected
    are selected. Inverting the selection de-selects the files and subdirectories
    if all the contents of a directory are


    # To select consecutive multiple files and subdirectories


    +   1 On the Panel, click the Corel File Manager button.


    +   2 Click a directory in the tree view or flat view to display its contents.


    +   3 Hold down the SHIFT key, and click the first file in the list of directory
    contents that you want to select, then click the last file that you want to select.


    All the files and subdirectories between and including the files you clicked appear
    selected.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# To select multiple discontinuous files and subdirectories


    +   Follow steps 1 and 2 from the previous procedure.


    +   Hold down the CTRL key, and click each file and subdirectory you want to select.


    # To select all the files and subdirectories in a directory


    +   Follow steps 1 and 2 from the “To select consecutive multiple files and subdirectories”
    procedure.


    +   Click Edit, Select All.


    # To invert the selection of files and subdirectories


    +   Follow all the steps from any of the previous procedures to select multiple
    files.


    +   Click Edit, Invert Selection.


    # Navigating the file system in Corel File Manager


    You can view the subdirectories and files contained within a directory. The contents
    of the directories that are selected in the All folders list (the left pane of
    the window) display in the right pane. The right pane of the window is divided
    into four columns, which display the filename, size, permission attributes, and
    date modified for each subdirectory and file of the directory selected.


    You can navigate to a directory or file by clicking directories and subdirectories
    to open them in the tree view or flat view. You can use the Forward, Back and
    Up browse buttons to navigate directories. These buttons are most useful when
    you are using the flat view. The browse buttons perform the following actions:


    +   Back — moves you back to directories you have already opened


    +   Forward — moves you forward to directories you have already opened


    +   Up — moves you up to the parent directory of the directory you are currently
    viewing


    You can also navigate to a file by typing the path to the file in the Address
    box. The address box maintains a list of recently opened directories and subdirectories.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# To view directories and files in the tree view


    I On the Panel, click the Corel File Manager button.


    2 Click View, Tree.


    # To view directories and files in the flat view


    +   - In the tree view of Corel File Manager, click the Close button at the top
    of the All Folders list.


    # To open a directory by clicking through the file list


    I On the Panel, click the Corel File Manager button.


    2 Choose the directory you want to open from the All Folders list in the left
    pane of Corel File Manager and do the following:


    +   - click the plus sign beside the directory to show the contents in the All
    Folders list (left pane of Corel File Manager)


    +   - click the icon or name of the directory to show the contents in the Name
    list (right pane of Corel File Manager)


    +   - double-click the icon or name of the directory to show the contents in both
    the All Folders and Name lists


    # To open a directory using the file path


    I On the Panel, click the Corel File Manager button.


    2 Type the path to the file or directory in the Address box and press ENTER.


    # To open a recently visited directory or subdirectory


    I On the Panel, click the Corel File Manager button.


    2 In the Address list box, select a directory or subdirectory.


    +   - File path names in Corel LINUX are case sensitive.


    +   - Only directories and subdirectories that you have visited in the current
    Corel File Manager session (since you last opened Corel File Manager) appear in
    the Address list box.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_151_0.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Sorting and refreshing the directory view


    Subdirectories and files are displayed in the right pane of Corel File Manager
    when you use the tree view. For information about using the tree view, see “Working
    with files in Corel File Manager” on page 136. They are also displayed in the
    single-paned flat view. The file list displays the following information about
    each directory or file:


    +   - Name — displays the name of the directory or file

    - Size — displays the size of files, in bytes

    - Attributes — displays the file access permission associated with the directory
    or file. For more information about permissions, see “Setting permissions and
    ownerships” on page 113.

    - Modified — shows the date the file was most recently modified


    You can sort the list of subdirectories and files alphabetically by name or attribute,
    from smallest to largest (reverse) by size, or chronologically by date modified
    change the order of the name, size, attributes, and date columns in the tree view
    and the flat view. You can refresh the Corel Manager view if you have made changes
    that do not appear immediately. Refreshing the view re-sorts the subdirectories
    and files according to the default sort order, which is alphabetically by name.


    # To sort subdirectories and files by name


    +   1 On the Panel, click the Corel File Manager button.

    2 Click View, Tree View.

    3 Choose a directory from the All Folders list, and click Name in the right pane
    of the Corel File Manager window.

    4 Click Name again to sort the files by name in the opposite order.


    # To sort subdirectories and files by size


    +   - In the tree view, choose a directory from the All Folders list, and click
    Size in the right pane of the Corel File Manager window.


    # To sort subdirectories and files by attribute


    +   - In the tree view, choose a directory from the All Folders list, and click
    Attribute in the right pane of the Corel File Manager window.


    # To sort subdirectories and files by date modified


    +   - In the tree view, choose a directory from the All Folders list, and click
    Modified in the right pane of the Corel File Manager window.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_152_0.png)'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# To change the order of the information columns


    +   - In the Corel File Manager flat view or the right pane of the tree view,
    an information column header and drag it to another position on the header bar.


    # To refresh the view


    +   1 On the Panel, click the Corel File Manager button.

    2 Click the Refresh button.


    # Starting applications in Corel File Manager


    You can start an application in Corel File Manager. When you open a file in Corel
    File Manager, the file displays in the application with which it is associated.
    For example, if you open a text file, it opens in the Advanced text editor. If
    you opened archived file (with the extension .gz), it opens in the Archive Administrator.
    MIME type definitions associate a file extension with an application. For more
    information about associating files with applications, see “Editing MIME types”
    on page 120.


    # To start an application from Corel File Manager


    +   1 On the Panel, click the Corel File Manager button.

    2 Open the directory that contains the application you want to start.

    3 Double-click the application.


    +   - For information about opening directories, see “Viewing directories and
    directory contents” on page 139.


    # Deleting directories and files in Corel File Manager


    You can delete a directory or file. When you are logged in as a regular user,
    you can delete files from your home directory. When you are logged in as the root
    user, you can delete any directory or file. Deleting a file or subdirectory removes
    it from your file system entirely.


    # To delete a directory or file


    +   1 On the Panel, click the Corel File Manager button.

    2 Choose the directory or file you want to delete, and click File, Delete.

    3 Click Yes to confirm.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '+   • You can delete a directory or file by right-clicking it and clicking
    the Delete button.


    +   • You can also delete a directory or file by dragging it to the Trash icon
    on the desktop. For information about using Trash, see “Moving files to the Trash”
    on page 145.


    # Moving files to the Trash


    You can move files that you eventually want to delete to the Trash directory.
    The Trash directory is available on the desktop as an icon. It is also located
    in Corel File Manager at /home/Desktop/Trash. A file is not deleted automatically
    when you move it to Trash; you can retrieve it, or choose to delete it. You must
    empty Trash to remove the file completely from your system.


    # To move a file to Trash


    +   1 On the Panel, click the Corel File Manager button.


    +   2 Right-click the file or directory you want to move to Trash and click Move
    To Trash.


    +   • You can also drag a file or directory from Corel File Manager or the desktop
    to the Trash icon on the desktop.


    # To retrieve a file from Trash


    +   1 Click the Trash icon on the desktop.


    +   2 In the Trash directory choose the file that you want to retrieve, and drag
    it to the location where you want to restore it.


    # To delete a file from Trash


    +   1 Click the Trash icon on the desktop.


    +   2 Right-click a file, and click Delete.


    +   3 Click Yes to confirm.


    # To empty Trash


    +   1 Right-click the desktop and click Empty Trash.


    +   2 Click Yes to confirm.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Creating directories


    You can create directories in Core File Manager or on the desktop. When you create
    a directory on the desktop, it appears in the /home/Desktop subdirectory in Core
    File Manager.


    # To create a directory in Corel File Manager


    +   1 On the Panel, click the Corel File Manager button.

    2 Choose the directory where you want to place the new subdirectory.

    3 Click File, New Folder.

    4 Type a name for the new directory and press ENTER.


    # To create a new directory on the desktop


    +   1 Right-click the desktop, and click New, Folder.

    2 Type a name for the directory in the dialog box.


    # Changing the name of directories and files


    You can rename directories and files.


    # To change the name of a directory or file


    +   1 On the Panel, click the Corel File Manager button.

    2 Choose the directory or file you want to rename, and click File, Rename.

    3 Type the new name, and press ENTER.


    > > You can rename a directory or file by clicking the name of the directory file
    twice, typing the new name.

    > You can also rename a directory or file by right-clicking the directory or file,
    then clicking Rename, and typing the new name.


    # Moving and copying directories and file


    You can move a directory or file to another location on the file system. You can
    move a directory or file by dragging it to the new location or cutting and pasting
    it. Dragging and dropping a directory or file to another directory or the desktop
    copies the file to the new location, by default. When you drag a directory or
    file to the desktop, you can choose to copy or move it.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# To move a directory or file by dragging and dropping it


    +   1. On the Panel, click the Corel File Manager button.

    2. Drag the directory or file you want to move to a new location.


    # To move a directory or file by cutting and pasting


    +   1. On the Panel, click the Corel File Manager button.

    2. Click the directory or file you want to copy.

    3. Click the *Cut* button.

    4. Choose the directory where you want to paste the directory or file.

    5. Click the *Paste* button.


    # To copy or move a file or folder to the desktop


    +   1. On the Panel, click the Corel File Manager button.

    2. Drag the directory or file from Corel File Manager to the Desktop.

    3. In the menu that appears, click Copy or Move.


    > * You can also right-click the directory or file you want to cut or copy, or
    the destination directory where you want to paste, and choose a command from the
    menu.


    # Viewing directory and file properties


    You can view information about a directory or file located on your home or root
    directory. Viewing directories and file properties displays the following information:


    * the associated icon and name of the file (including file path)

    * the number of file and folders, (for a directory)

    * the size in bytes (for a file)

    * time and date that it was created, modified, and most recently accessed

    * the owner, owner group, and designated permissions


    # To view the properties of a directory or file in Corel File Manager


    +   1. On the Panel, click the Corel File Manager button.

    2. Click a directory or file, click the *Properties* button.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'You can also view file properties by right-clicking a directory or file, clicking
    Properties.


    # Viewing hidden files


    You can view hidden files if you are logged in as the root user. Hidden files
    are files that are critical for running system processes and daemons. You can
    view and edit hidden files if you are logged in as the root user. For information
    about logging in as a root user, use “Using the root account” on page 103. The
    System directory may not display if you are logged in as a regular user. You can
    view The System directory and its contents.


    # To view hidden files in Corel File Manager


    +   - On the Panel, click the Corel File Manager button.

    - Click View, Show Hidden Files.


    Files that were not displayed in the directories in Corel File Manager now appear.


    # To view The System


    +   - On the Panel, click the Corel File Manager button.

    - Click View, The System.


    The System directory displays in the All Folders list in the tree view, and in
    the top directory level of the flat view.


    # Finding files, directories, and computers


    Corel LINUX lets you search for files, directories, and networked computers. When
    you search for a file or directory, the Find Files or Folders utility lists the
    file''s name, location, size, and file type. You can define the search parameters
    to conduct a simple search, a search by date of last file modification, or an
    advanced search.


    You can search for the location of specific computers on your network with the
    Find Computer utility. The search is conducted using the name of the computer.


    You can use wildcard characters to help you find files and directories. Wildcard
    characters take the place of one or more characters in your search string (the
    file or folder name you search for); Find Files substitutes any character for
    the wildcard. The question mark (?) substitutes any single character in your search
    string. The asterisk (*) substitutes any number of'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'characters in the search string. For example, you can search for a directory
    using the search string "Pic*". This search string returns all directories that
    have a name beginning with the letters "Pic." Searching for a directory using
    the search string "Pic?" returns only directories that have one character following
    "Pic", as "Pic" or "Pico". You can use a wildcard character anywhere in the search
    string. The Find utility is case sensitive, so using a lower case letter in the
    search string does not have the same search results as using the equivalent upper
    letter.


    # Finding files and directories


    You can find a file or directory from the Find Files or Folders utility located
    in the Start menu. You can use wildcard characters in your search string. Wildcard
    characters take the place of one or more characters in your search string (the
    file or folder name you search for). You can search for a file using the following
    parameters:


    +   * name and location of the file or directory

    * the date modified

    * advanced features, such as the type of the file, the text it contains, or the
    size of the file in kilobytes


    # To start Find Files Or Folders


    +   * In Core File Manager, click Tools, Find Files Or Folders.


    # To find a file using the name and location of the file


    +   1 In the Find Files Application Window, click the Names & Location tab.

    2 In the Named box, type the name (or part of the name and a wildcard character)
    of the file or folder you are searching for.

    3 In the Look In box, type the name of the directory you want to search.

    4 Click the *Start Search* button.


    +   * If you do not type a directory, the computer searches the /root directory
    and all its subdirectories.


    # To find a file using the date it was last modified


    +   1 In the Find Files Application Window, click the Date Modified tab.

    2 Enable the Find All Files Created Or Modified button.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '3 Choose one of the following options:


    +   * Between — lets you specify the date interval

    * During The Previous Month — lets you specify the number of previous months

    * During The Previous Days — lets you specify the number of previous days


    # To find a file using advanced features


    +   1 Follow steps 1 to 3 from the “To find a file using the name and location
    of the file” procedure.

    2 Click the Advanced tab.

    3 Choose a file type from the Of Type box.

    4 In the Containing Text box, type a word or phrase contained in the file.

    5 Type the approximate size of the file in the Size Is box.

    6 Click the Start button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_159_0.png)


    +   * You must have the “*” typed in the Named box and a “/” in the Location box
    on the Name & Location tab.

    * If you do not want to approximate the size, do not type in a value in the Size
    Is box.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_159_1.png)


    +   * You can complete the information on all three tabs in the Find Files dialog
    box for a search. The more information you provide the narrower the search.


    # To start a new search


    +   * Click the New Search button.


    # Adding files to archives


    When you find a file using the Find Files or Folders utility, you can archive
    the file (compress) the file. For information about archiving files, see “Using
    Archive Administrator” on page 240. You must know the pathname of the archive
    where you want to add your found file.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# To add file to an archive


    +   In Corel File Manager, click Tools, Find Files Or Folders.


    +   In the Named box, type the name (or part of the name and a wildcard

    (character)) of the file or folder you are searching for.


    +   Click the Start Search button.


    +   From the list of files resulting from your search, click the file you want
    to

    add to an archive.


    +   Click the File, Add To Archive.


    +   In the Look In list box, choose the directory in which the archive is

    stored.


    +   Click an archive.


    +   You can also add a file to an archive by clicking the Add button on the

    toolbar.


    # Saving searches and exiting Find Files or Folders


    You can save the results of your search in a default file location or you can
    set

    default file location. The default file location is a directory that you can set

    to store your search results. You can also exit Find Files or Folders.


    # To save the results of a search in the default file location


    +   Click File, Save Search.


    # To specify a default file location


    +   Click Options, Preferences.


    +   Click the Saving tab.


    +   Enable the Save Results To File button, and do one of the following:


    +   type filename in the Save Results To File box


    +   click Browse to view your system''s file structure, and double-click a

    file


    +   Choose a file type from the File Format list box.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# To exit Find Files or Folders


    +   * Click File, Quit.


    * You can also exit Find Files or Folders by clicking the Close button.


    # Finding computers


    You can find the location of computers on your network. When you locate a computer''s
    location, you can view its files or create a desktop link. A link creates a shortcut
    icon on the desktop. For information about shortcuts, see “Creating a shortcut
    on the desktop” on page 85. You can also start a new search or exit Find Computer.


    # To start Find Computer


    +   * In Corel Manager, click Tools, Computer.


    # To find a computer on a network


    In the Find Computer application window, type the name of the computer in the
    Computer Name box.


    +   2 Click on the Start Search button.


    # To view the files of a computer


    +   * Click File, Explore.


    # To create a desktop link to a computer


    +   * Click File, Create Desktop Link.


    # To start a new search


    +   * Click the New Search button.


    # To exit Find Computer


    +   * Click File, Quit.


    * You can also exit Find Computer by clicking the Close button.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Working with directories and files on the desktop


    You can access the directories and files in Corel File Manager from the desktop.
    You can start applications from the desktop, and place links to directories, files,
    and applications on the desktop for quick access. You can also create a shortcut
    to an application and create a link to a file or directory.


    Shortcuts to the printer, floppy disk drive, and CD-ROM drive devices are placed
    on the desktop during installation. You can access these directories from the
    desktop. For information about using the Printer utility, see “Setting up printers”
    on page 279.


    The Trash icon is also located on the desktop. For information about using the
    Trash utility, see “Moving files to the Trash” on page 145.


    # Opening Corel File Manager from the desktop


    You can access the directories and files in Corel File Manager from the desktop.


    # To open Corel File Manager from the desktop


    +   - On the desktop, click the My Home icon.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_162_0.png)


    +   - You can also open Corel File Manager by clicking the Corel File Manager
    button on the Panel, or by clicking Application Starter, then File Manager.


    # Creating a desktop link to a directory or file


    You can create a link on the desktop to a directory or file that is located in
    your home directory. Clicking a link to a directory opens that directory in Corel
    File Manager. Clicking a link to a file opens the application it is associated
    with. If it is an application file, the application starts.


    # Creating a desktop link to a directory or file


    +   1 On the Panel, click the Corel File Manager button.

    2 Drag a directory or file from Corel File Manager to the Desktop.

    3 From the menu, choose Link.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_162_1.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Creating a shortcut to an application


    You can place a shortcut on the desktop that links to an application file in your
    root or home file system. A shortcut on the desktop lets you start an application
    directly from the desktop.


    # To create a shortcut


    +   1 Right-click the desktop and click New, Nickname.

    2 Type the name of the file, in the Nickname box.

    3 Choose the file you want to create a shortcut to by doing one of the following:

    * Type the path to the file in the Target box.

    * Click Browse, navigate to the application file you want to create a shortcut
    to, and click Open.

    4 Click the Icon button, if you want to choose a new icon to appear with the nickname
    on the desktop.


    # To start an application using a desktop shortcut


    +   1 Follow all the steps from the previous procedure to create the nickname.

    2 Double-click the nickname icon on the desktop to start the application.


    # Accessing files from a floppy disk or CD-ROM


    You can access directories and files on a floppy disk or CD into the drive using
    Corel File Manager. When you load a floppy disk or CD into the drive, Corel LINUX
    automatically recognizes and mounts the device (the floppy disk or CD-ROM drive).
    Mounting a device makes it available for the user to access. On most Linux systems,
    local file systems, networked file systems, and input devices such as the terminal,
    keyboard and mouse are mounted when the operating system boots up. Devices like
    the floppy disk and CD-ROM drive must be mounted manually. Corel LINUX provides
    an automount feature that automatically mounts file systems from devices when
    you put a floppy disk or CD in a drive. The floppy disk or CD then appears in
    Corel File Manager as a directory with a folder icon, and the files on the device
    appear in the right pane of the Corel File Manager window.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '![](img/86803f2a30e88fe6e62989f0fe100a53_164_0.png)


    You can perform the same actions on the files on a floppy disk or CD as you do
    on files on your computer or elsewhere on the network, such as opening files,
    starting applications, copying, pasting, moving and renaming files. For information
    about opening, copying, pasting, moving and renaming files, see "Working with
    files in Corel File Manager" on page 136.


    Corel LINUX can read information on floppy disks formatted for Microsoft Windows.
    You can also format a disk for Linux using the Format Floppy utility. For information
    about formatting a floppy disk for Linux, see "Formatting floppy disks" on page
    251.


    # # Accessing files from a floppy disk or CD-ROM


    You can access the directories and files on a floppy disk or CD that are loaded
    into your computer''s floppy disk or CD-ROM drive.


    # ## To access files on a floppy disk


    +   1. Place a floppy disk in the disk drive.


    +   2. On the Panel, click the Corel File Manager button.


    +   3. Navigate to the /cdl_mount/floppy/floppy directory in the All Folders list,
    or type the file path in the Address box.


    The files on the disk appear in the Name list.


    # ## To access files on a CD-ROM


    +   1. Place a CD in the CD-ROM drive.


    +   2. On the Panel, click the Corel File Manager button.'
  merge: -1
  img_proc: true
- pgno: 165
  md: "3 Navigate to the /cdl_mount/cdrom/cdrom directory in the All Folders list,\
