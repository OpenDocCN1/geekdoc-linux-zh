- pgno: 28
  md: '# Installing Corel LINUX


    A graphical, easy-to-follow installation process


    Install Express makes it easy to install Corel LINUX. Previously, installing Linux
    had been a time consuming and difficult task for inexperienced computer and Linux
    users. Install Express is a wizard that uses graphical dialog boxes to guide you
    through installation and configuration of Corel LINUX. Each dialog box provides
    information about the procedure and available options, and gives you instructions
    that guide you to the next step of the installation.


    Installation options


    Install Express lets you control the Corel LINUX installation process. You let
    Install Express choose default options for you and install the most commonly used
    applications, utilities, and files. This is the recommended installation type
    for most users. You can also control your Corel LINUX installation by specifying
    the components to install and where to install them. This installation type lets
    you install specialized components that are not included in the default installation
    or save space on your hard disk. After Corel LINUX is installed, you can add and
    remove components.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Installation scenarios


    There are 4 typical installation scenarios for Corel LINUX:


    +   - Corel LINUX replaces another operating system — for example, you can replace
    another Linux operating system or a Microsoft Windows operating system with Corel
    LINUX.

    - Corel LINUX installs on a computer without an operating system — for example,
    you might have a new computer or have replaced the hard disk on your computer
    and don''t yet have an operating system installed.

    - Corel LINUX coexists with another operating system — for example, you can use
    Corel LINUX and Microsoft Windows on the same computer.

    - Corel LINUX resides in the same disk space as MS-DOS or Windows — this installation
    lets you start Corel LINUX from MS-DOS mode on a computer that is running MS-DOS,
    Microsoft Windows 3.1x, Windows 95, or Windows 98.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_29_0.png)


    +   - Please review all the information in this section of the documentation before
    installing Corel LINUX. By reviewing this section, you can be more prepared to
    respond to installation decisions and questions.


    # Understanding Corel LINUX computer requirements


    Please ensure your computer meets the following requirements for installing Corel
    LINUX:


    +   - Pentium processor or higher

    - 16 MB of RAM (32 MB of RAM or higher is recommended)

    - Adequate unallocated space available on your hard disk. The amount of space
    required depends on the installation option and packaging that you choose. For
    example, the Standard Desktop installation requires at least 200 MB of free space
    or space not allocated to an existing partition.

    - CD-ROM drive (preferably bootable)

    - 3.5" floppy disk drive (required if your CD-ROM drive is not bootable)

    - PCI-trace VGA or Super VGA video card (2 MB)

    - VGA or higher-resolution monitor

    - Mouse or other pointing device

    - Keyboard


    Some features have additional hardware requirements:'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   • If your CD-ROM is not bootable, a 3.5" high-density floppy disk (1.44
    MB) may be required


    +   • For network access, a network card


    +   • For dial-up Internet access, a 14.4 bps modem or higher, and an Internet
    Service Provider


    +   • For sound, a sound card and speakers or headphones


    # Understanding Install Express and disk partitions


    You should review this section if you plan to have Corel LINUX coexist with another
    operating system on the same computer.


    If Corel LINUX is to coexist with another operating system on the same computer,
    it must be installed on hard disk space that is completely separate from the hard
    disk space used by the other operating system. Hard disks that have been divided
    into isolated sections are partitioned. Partitioned hard disks behave like separate
    hard disks, and operating systems on one partition do not usually recognize the
    other partition. Most computers, by default, use one partition.


    If you are installing Corel LINUX on a computer without existing operating systems,
    you may not want to partition your hard disk unless you plan to install an additional
    operating system in the future.


    Install Express provides you with two disk-partitioning options if you plan to
    have Corel LINUX coexist with another operating system. The first option lets
    Corel LINUX take over an existing hard disk space and a swap file partition. The
    file system for a Linux partition is ext2. The second option lets you delete and
    create partitions on a hard disk. Before using this option you should backup important
    data to other media. This option does not let you edit partition size.


    There are several third-party and Open Source applications that enable you to
    partition existing hard disk space. These types of tools are not included in Corel
    LINUX.


    # Understanding Corel LINUX hardware detection


    Corel LINUX detects the hardware you have on your computer as it is being installed.
    As the hardware component is detected, Corel LINUX automatically installs the
    component''s Linux driver. If a specific component does not have a Linux driver,
    for example, a new video graphics card or a sound card, Corel LINUX installs the
    most appropriate driver.


    If you install new hardware, Corel LINUX recognizes it the next time you start
    the computer.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - In some cases, Corel LINUX may not recognize non-PCI compliant hardware.

    - For an up-to-date list of hardware supported by Corel LINUX, http://linux.corel.com.


    # # Understanding the Corel LINUX installation steps


    Install Express sets up Corel LINUX on your computer through the installation
    steps. You can navigate the installation steps if you want to change the settings
    that you specify.


    | When you click... | Install Express... |

    |--- |--- |

    | Next | Guides you to the next installation step |

    | Back | Guides you to the previous installation step |

    | OK | Accepts the installation settings that you have specified |

    | Cancel | Cancels the installation settings that you have specified |


    # # Installing Corel LINUX to your computer


    Install Express lets you control the Corel LINUX installation process. You can
    let Express choose default options for you and install the most commonly used
    applications, utilities, and files. This is the recommended installation type
    for most users. You can also control your Corel LINUX installation by specifying
    the components to install and where to install them. This installation type lets
    you install specialized components that are not included in the default installation,
    or save space on your hard disk.


    Install Express also lets you control the Corel LINUX installation for different
    computer settings. This section describes the following scenarios:


    +   - Installing Corel LINUX on a computer without an operating system or another
    LINUX operating system

    - Replacing a Microsoft Windows operating system with Corel LINUX

    - Installing Corel LINUX to a DOS/Windows partition

    - Installing Corel LINUX to coexist with another operating system


    # # Floppy boot disk


    Some editions of Corel LINUX include the Corel LINUX Installation (bootable) floppy
    disk. This floppy disk is used if your CD-ROM drive is not bootable. If you require
    this floppy disk, you can create it using 3.5"'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'high-density floppy disk. This bootable disk can be created using Microsoft
    Windows or a Linux operating system.


    # Updating Core LINUX installations


    After installation, Core LINUX and its components can be updated if newer versions
    are available. You can receive information about updates at Corel''s Web site
    at http://linux.corel.com. Core LINUX includes Corel Update, a utility that informs
    you when-Core LINUX and other application updates are available and installs them
    for you. For information about Core Update, see “Installing, updating, and removing
    applications” on page 129.


    # Uninstalling Core LINUX


    If you want to remove the operating system and all its components from your computer,
    you need to reformat your hard disk.


    +   Before installing Core LINUX, remove all removable media from drives including
    floppy disks, optical disks, and tapes.


    # Installing Corel LINUX as your operating system


    Corel LINUX installs to a computer without an operating system. For your computer
    might not have an operating system for various reasons. For example, you might
    have a new computer without an operating system, you might have replaced the hard
    disk on your computer, or your computer might have had a serious crash.


    Install Express can also replace your current Linux operating system with Corel
    LINUX. Because this procedure reformats the computer''s hard disk, you should
    back up any files you want to keep to floppy disks, portable disk drives, a network,
    or other storage mediums before performing this procedure. Reformatting your hard
    disk erases all files from the hard disk.


    # To install Core LINUX to your computer


    +   1 Insert the Corel LINUX Installation CD-ROM into the CD-ROM drive.


    +   2 Shut down and restart your computer.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'If your computer restarts without displaying the Install dialog box, your computer
    does not have a bootable CD-ROM. This means that you have to use a 3.5" high-density
    floppy disk (1.44 MB) as the bootable disk in the installation process. Some elements
    of Corel LINUX Installation (bootable) floppy disk. If you have this floppy disk,
    insert it and reboot your computer. If you don''t have this floppy disk, you need
    to create a bootable disk. After you have created it, leave it in your disk and
    reboot your computer. After you complete these steps, continue with the procedure.
    For more information about creating a bootable disk for Linux, see “Creating a
    bootable disk for Corel LINUX” on page 28.


    # 3 In the Install Express dialog box, type a user name.


    A common version for choosing a user name is using your first name, followed by
    the initial of your last name. For example, John Doe''s user name could be johnd.
    The user name is case sensitive, should begin with a lowercase character, can
    include numbers, and cannot contain more than 16 characters. Certain words are
    reserved and cannot be used as user names. You are warned if you choose a reserved
    word, such as a Linux command, for a user name.


    # 4 Enable one of the following buttons:


    +   Install Standard Desktop — installs the most used applications, utilities,
    and files. Use this option if you''re not sure which Corel LINUX components to
    install. You can add and remove components afterwards. It is the recommended option
    for most users.


    +   Show Advanced Install Options — lets you choose which Corel LINUX components
    to install. This option gives you the control over the installation process. Choose
    this option if you need to install specialized components that are not included
    in the Standard installation. For more information, see the table that follows
    this procedure. If you select this option, select the installation options that
    follow and then continue to Step 5 of this procedure.


    # 5 Enable the Take Over Disk button to erase all files from the hard disk.


    # 6 If your computer has multiple hard disks, you are prompted to choose which
    hard disk to install. In this case, the hard disk you choose is erased. All other
    hard disks retain their current files and are available in Corel LINUX.


    # 7 Click the Install button when you''re ready to begin the installation. It
    is not recommended that you disable the Scan Bad Block During Format option before
    clicking the Install button. This option scans the hard disk for errors before
    installation and extends the amount of time needed to install Corel LINUX.'
  merge: -1
  img_proc: true
