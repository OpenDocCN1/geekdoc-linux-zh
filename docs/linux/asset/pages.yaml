    # Changing background, foreground and link colors in articles


    You can change the display colors of articles. You can change the background color
    of an article; you can change the foreground color, which changes the color of
    the text of the article. You can change the color of visited and unvisited hypertext.
    You can also change the color of a hyperlink that you have already followed. You
    can choose preset system colors or custom colors.


    # To change background and foreground color


    1 In the Newsgroup window, click Options, Appearance.


    2 In the Message Display Settings window, click one of the following buttons:


    +   * Background Color

    * Foreground Color


    3 Click a color from the System Colors palette.


    # To change the color of unvisited hypertext


    1 In the Newsgroup window, click Options, Appearance.


    2 In the Message Display Settings window, click the Link Color button.


    3 Click a color from the System Colors palette.'
