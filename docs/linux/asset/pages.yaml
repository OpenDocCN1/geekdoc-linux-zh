    # Viewing system information


    You can view operating system information. The Event Viewer displays a list of
    log files, which are the activities of the system facilities, such as daemon,
    printer, kernel, or printer facilities.


    You can set up filters to specify which log files you want to view. The Event
    Viewer generates the list of log files based on your filter specifications. You
    can view log files for the following facilities: Authorization, Crontab, Daemon,
    Kernel, Printer, Mail, News, Syslog, UUCP, and PPP. You can refresh the list to
    access the most current log files. You can specify log dates to allow the Event
    Viewer to overwrite events if the event has occurred after the specified date.
    For example, if you set log dates to 20 days, a warning message for the Kernel
    facility that is 20 or more days old is overwritten by a new warning message,
    if the same warning message is logged. Turning overwrite log dates prevents log
    files from being overwritten.


    You can access read-only information about available system devices; the information
    is stored in the /proc/devices directory.


    # Creating log view filters


    You can create filters to specify which log files you want to view. You can also
    set the priority of log files you want to view. You can create customized filters
    or enable default filters. The default log filter displays messages for all facilities
    with a priority of warning, error, critical, alert, and emergency.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# To create log view filters


    +   1 Click Application Starter, Applications, System, Event Viewer.

    2 Click the Filter Select button.

    3 Click one of the following buttons:

    * Select All — enables all the check boxes

    * Clear — disables all the check boxes

    * Defaults — enables the default filters


    +   * Both regular and root users can create log view filters.

    * You can click a Facility row header to enable all the message buttons for that
    facility.

    * You can click a Priority column header to enable all the message buttons for
    that priority.

    * You can manually enable each check box in the Filter Manager dialog for which
    you want to view log information.


    # Changing log file viewing options


    As either the root user or a regular user, you can change the order of the columns
    in the log file list.


    # To change the order of columns in the log view list


    +   1 Click Application Starter, Applications, System, Event Viewer.

    2 Drag the list header to its new position.


    # Sorting log file lists


    As the root user, you can sort the log file list messages according to priority,
    date, source, message, or facility. You can sort the messages in either descending
    or ascending order. By default, messages are sorted in ascending order.


    # To sort log file messages in descending order


    +   1 Click Application Starter, Applications, System, Event Viewer.

    2 Click one of the following list headers:

    * Priority — sorts the files in order of urgency

    * Date — sorts the files chronologically'
  merge: -1
  img_proc: true
