    +   - You can also read a document by clicking the Read Down button on the toolbar.


    # Moving within a document


    Use the navigation commands to navigate pages of a document. You can move forward
    to the next page or backward to the previous page in a document. You can also
    move to the beginning or end of a document. You can also navigate using toolbar
    buttons.


    # To move to the next page


    +   - Click Go, Next Page.


    # To move to the previous page


    +   - Click Go, Previous Page.


    Working with graphics 231'
