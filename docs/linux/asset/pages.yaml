    # Adding a DNS server


    You can add a DNS server to your Ethernet configuration to translate your computer
    domain name into its IP address when you are connected to the local network. You
    can add multiple DNS servers and remove DNS servers from the Ethernet configuration.


    # To add a DNS server


    +   1 Click Application Starter, Control Center.

