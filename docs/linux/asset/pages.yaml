    in the current directory.


    # To deselect a group of files


    1 Click File, Unselect Group.

    2 Type the asterisk sign (*) in the Unselect Dialog box and click OK.


    # Performing file operations using Midnight Commander


    Midnight Commander helps you perform file operations, such as viewing, copying,
    moving, and deleting directories and files, using menu commands. You can also
    use the function keys located below the panels to perform commands. The function
    keys are shortcut keys for menu options.


    By default, Midnight Commander prompts you to confirm commands, such as deleting
    files and directories, before it completes an operation.


    # Locating directories and files in Midnight Commander


    You can use Midnight Commander''s search capability to locate directories and
    files on your Linux system. You can navigate in the Find File dialog box by pressing
    ENTER, or using the mouse.


    # To locate a directory or file in Midnight Commander


    1 Click Command, Find File.

    2 In the Start At box, type the directory path that you want to search.

    3 In the Filename text box, type the directory name or filename that you want
    Midnight Commander to search for.

    4 Click OK.


    +   * The search results display in the Find File dialog box. If the search does
    not find the correct results, click Again, to perform another search.

    * You can stop a search by clicking Suspend in the Find File dialog box.


    322 Corel LINUX User Guide: Chapter 15'
