  md: '+   - Source — sorts the files alphabetically

    - Message — sorts the files alphabetically

    - Facility — sorts the file alphabetically


    # To sort log file list messages in ascending order


    +   1 Click Application Starter, Applications, System, Event Viewer.

    2 Click the list header to sort.


    # Refreshing the log file list


    As the root user, you can refresh the log file list to update the list of log
    files.


    # To refresh the log file list


    +   1 Click Application Starter, Applications, System, Event Viewer.

    2 Click the Refresh button.


    # Clearing log files


    As the root user, you can clear the log file list to delete all the log files
    from the system. Clearing a log file using the Event Viewer clears the file from
    the system and from the view list.


    # To clear log files


    +   1 Click Application Starter, Applications, System, Event Viewer.

    2 Click the Clear All Log Files button.

    3 In the Clear All Log Files dialog box, click Yes.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_127_0.png)


    +   - Regular users who log in as the root user can also clear log files.

    - To prevent a log file from being permanently cleared from the system, you can
    save it. For information on saving log files, see “Saving log files” on page 118.


    # Saving log files


    As the root user, you can save log files in a local or system directory. Saving
    a log file ensures that the file is not cleared if the root user clears the log
    files. For information about clearing log files, see “Clearing log files” on page
    118.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# To save a log file


    +   1 Click Application Starter, Applications, System, Event Viewer.


    +   2 Choose a log file from the Log File list.


    +   3 Click the Save Filtered Log File button.


    +   4 Choose a directory location from the Look In list box.


