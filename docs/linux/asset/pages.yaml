    # Letting Windows users print from Corel LINUX printers


    With Samba Client enabled, you can let Windows users who have access to the Corel
    LINUX network to use printers that run from your Corel LINUX computer. For information
    about setting up a print server, see "Setting up file and print servers for Windows
    clients" in the Corel LINUX Server Administrator Guide or the Corel LINUX Server
    Administrator online. For information about printers, see "Setting up printers"
    on page 279.


    # To let Windows users print from Corel LINUX printers


    +   1. Click Application Starter, Control Center.

    2. Double-click Network, Windows Workgroups.

    3. Enable the Make Printers Available To Windows Users check box.


    +   - You must click Apply or OK to save any changes you make in this window.


    # Setting Ethernet connections


    Corel LINUX lets you set Ethernet connections to communicate with other computers
    and file servers on a local network, or with remote printers. To configure an
    Ethernet connection for your computer, you must identify your computer and the
    local network to which you want to connect, the DHCP (Dynamic Host Control Protocol)
    server or static IP address for your computer, and at least one DNS server address.
    You must provide the following information:


    +   - your computer''s hostname and domain name

    - whether your connection uses the DHCP server or a static IP address'
  merge: -1
  img_proc: true
- pgno: 362
  md: '+   - the static IP address (if applicable), the subnet mask, default gateway

    for your local network


    +   - the IP address of the Domain Name Service (DNS) server your local

    network uses to resolve domain names and IP addresses


    The hostname is the name you gave your computer during the Corel LINUX

    installation process. The hostname is part of the root user command prompt.

    For information about the root user command prompt, see "Using the

    Console" on page 290. The domain name is the name of the local network or

    Ethernet to which you are connecting, for example, yournetwork.com.


    If the local network to which you are connected DHCP, the network

    server assigns a different IP address to your computer each time you connect

    to the Ethernet. If your network uses static IP addresses, an IP address is

    permanently assigned to your computer. If your network contains

    subnetworks, you must provide the IP address of the subnet mask and

    default gateway so your computer can access the entire network.


    DNS servers translate character-based domain names into numeric IP

    addresses so that computers can recognize them. You should specify at least

    one DNS server IP address when you configure a dial-up account. You can

    obtain this information from your system administrator or Internet Service

    Provider (ISP).


    You can specify your computer''s identification using the hostname and

    domain name. You can also set the IP address and DNS server addresses so

    that other computers on the local network can communicate with your

    computer.


    +   - You must have access to a local network and have an Ethernet card

    installed in order to configure and complete an Ethernet connection.


