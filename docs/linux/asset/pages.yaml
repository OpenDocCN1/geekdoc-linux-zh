- pgno: 114
  md: '# Managing users


    The User Manager lets the root user add user accounts to the system, and customize
    each user''s account information and personal information. You can delete users
    from the system. You can specify an expiry date for accounts, so that users have
    access to the system on a temporary basis. You can also specify an expiry date
    for passwords as a security measure, so that users are required to change their
    passwords after a certain date. You can set the User Manager to warn users of
    password and account expiration.


    # Managing groups


    As the root user, you can also create user groups. A group is a user classification
    used to assign file access permissions. Each group has specific file access permissions
    associated with it, so that users assigned to group are automatically assigned
    the permissions associated with that group. For more information about setting
    file permissions, see “Setting permissions and ownerships” on page 113.


    You can assign users to multiple groups. For example, a user who belongs to the
    “Mail” group can also belong to the “Games” group. This user has access to the
    Mail and Games files.


    # Managing system users


    As the root user, you can create user accounts. You can change a user''s password,
    and set a password expiration date. After creating a user account, you can specify
    whether it is immediately active, or you can delay user account activity until
    a specified date. You can make accounts active for a limited period, so that users
    only have temporary access to the system. You can add personal information about
    each user account on the system, including name, address, and telephone number.
    You can also delete users from the system.


    +   - Although the root user can change a user''s password, regular users can
    change their account password if the root user gives them permission.


    # Adding user accounts


    As the root user, you can add user accounts to the system. You can set the account''s
    user login name, login shell, and home directory location. The User ID is generated
    by the system and by default, Corel LINUX creates a primary group for all user
    accounts that you create. For information about user groups, see “Managing user
    groups” on page 111.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# To add a user account


    +   1 Click Application Starter, Applications, System, User Manager.


    +   2 Click the Add User button.


    +   3 Click the User Info tab.


    +   4 Type a user login name in the User Login box.


    +   5 Choose a login shell from the Login Shell list box.


    +   6 Type a home directory path in the Home Directory box.


    +   7 Click the Set Password button.


    +   8 In the Enter Password dialog box, do the following:

    * type a password in the Password box

    * retype the password in the Retype Password box


    As the root user, you can add personal information, including name, telephone
    numbers, and mailing address, to the user account. For information about adding
    personal information, see “Adding personal information to user accounts” on page
    110.


    The root user is the only user who can add user accounts. For information about
    using the root account, see “Using the root account” on page 103.


    # Configuring user account passwords


    As the root user, you can change a user’s password. You can specify whether the
    user can change the account password. You can also specify if a password change
    is required, and warn the user that the account’s password will expire for security
    purposes.


