- pgno: 81
  md: '# Customizing the Application Starter menu


    The Application Starter menu lists applications, files, and directories. You can
    customize the Application Starter menu by adding and deleting applications, files,
    directories, and ToolTips. ToolTips provide information about icons and buttons
    on the Panel and desktop. ToolTips display in a pop up box when you position the
    mouse pointer over a button or icon.


    The Quick Start menu and the Disk Navigator are two submenus that you can add
    to the Application Starter menu. The Quick Start menu gives you quick access to
    your most recently, or frequently used applications.


    The Disk Navigator menu, located below the Application Starter menu, provides
    a hierarchical view of your file system. The Disk Navigator menu has three sections.
    The Shared section displays files that are common to all users, the root directory
    and CD-ROM. The Personal section displays files and folders that are user specific,
    for example the home directory and desktop. The Recent section displays files
    and folders that you have accessed, for example, text documents and applications.
    The Shared, Personal and Recent sections of the Disk Navigator allow you to customize
    these sections by adding or removing applications or directories to or from them.
    When customizing the Shared and Personal sections, the corresponding directory
    opens automatically in Core File Manager so that you can add or remove directories
    and files to those sections. For information about moving directories and files
    in Core File Manager, see “Moving and copying directories and files” on page 146.
    For information about using Core File Manager, see “Working with files in Core
    File Manager” on page 136.


    +   This illustration displays the following areas of the Application Starter
    menu:

    1) Quick Start menu

    2) Application Starter menu

    3) Disk Navigator


    ![](img/86803f2a30e88fe6e62989f0fe100a53_81_0.png)'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Customizing the Application Starter menu


    The Application Starter menu provides a list of files, directories, and applications.
    You can customize the Application Starter menu to show the Disk Navigator, which
    displays your choice of shared, personal, and recently used directories and applications.
    You can customize the Application Starter menu to list directories before application
    files. You can also show or remove ToolTips from the Application Starter menu.


    # To display Disk Navigator on the Application Starter menu


    +   1. Right-click the Panel, and click Configure.


    +   2. Click the Menu tab.


    +   3. Enable the Show Disk Navigator check box.


    # To list directories and directory menus before application files


    +   1. Follow steps 1 and 2 from the previous procedure.


    +   2. Enable the Menu Folders First check box.


    # To show Application Starter menu ToolTips


    +   1. Right-click the Panel, and click Configure.


    +   2. Click the Options tab.


    +   3. In the Menu Tooltips section, enable the Show Menu ToolTips check box.


    +   4. Move the Delay slider to set the delay for the ToolTips. Moving the Delay
    Slider to the left decreases the delay time, and to the right increases the delay
    time.


    # To remove Application Starter menu ToolTips


    +   1. Follow steps 1 and 2 from the “To show Application Starter menu ToolTips”
    procedure.


    +   2. Disable the Show Menu ToolTips check box in the Menu Tooltips section.


    # Customizing the Quick Start menu


    The Quick Start menu is on the top portion of the Application Starter menu. You
    can customize the Quick Start menu to display your most recently or most frequently
    used applications. You can also set the maximum number of Quick Start applications
    that appear in the Application Starter menu.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# To show the most recently used applications


    +   1 Right-click the Panel, and click Configure.


    +   2 Click the Menu tab.


    +   3 In the Quick Start Contains section, enable the Most Recently Used Items
    button.


    # To show the most frequently used applications in Quick Start


    +   1 Follow steps 1 and 2 from the previous procedure.


    +   2 In the Quick Start Contains section, enable the Most Frequently Used Items
    button.


    # To set the maximum number of Quick Start applications


    +   1 Follow steps 1 and 2 from the “To show the most recently used applications”
    procedure.


    +   2 Type a number in the Maximum Number Of Quick Start Entries box.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_83_0.png)


    +   * The Quick Start menu disappears if you put 0 in the Maximum Number Of Quick
    Start Entries box.


    +   * The most number of entries you can have in the Quick Start menu are 20 entries.


    # Customizing the Disk Navigator menu


    You can customize the Shared, Personal, and Recent sections of the Disk Navigator
    menu by adding or removing applications or directories in the Shared, Personal,
    and Recent directories. When customizing the Shared and Personal sections, the
    corresponding directory opens automatically in Corel File Manager so that you
    can add or remove directories and files to those sections. For information about
    moving directories and files in Corel File Manager, see “Moving and copying directories
    and files” on page 146. You can also set the maximum number of files and folders
    in the Recent section of the Disk Navigator menu. You can set the Disk Navigator
    menu so that it recognizes the case of characters when it sorts the files in each
    section.


    # To customize the Personal section


    +   1 Right-click the Panel, and click Configure.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '2 Click the Disk Navigator tab, and click the Edit Personal button in the

    History section.


    3 In the directory that opens in Corel File Manager, add or remove files or

    directories by copying, pasting or dragging.


    # To customize the Shared section


    +   1 Right-click the Panel, and click Configure.


    +   2 Click the Disk Navigator tab.


    +   3 In the History section, click the Edit Shared button.


    +   4 In the directory that opens in Corel File Manager, add or remove files or

    directories by copying, pasting or dragging.


    # To set the maximum number of folder entries in the Recent

    section


    +   1 Right-click the Panel, and click Configure.


    +   2 Click the Disk Navigator tab.


    +   3 In the History section, type a number in the Max Recent Folder Entries

    box.


    # To set the maximum number of file entries in the Recent section


    +   1 Follow steps 1 and 2 from the “To set the maximum number of folder

    entries in the Recent section” procedure.


    +   2 In the History section, type a number in the Max Recent Folder Entries

    box.


    # To set the maximum number of files in a single folder


    +   1 Follow steps 1 and 2 from the “To set the maximum number of file

    entries in the Recent section” procedure.


    +   2 In the History section, type a number in the Max Files In A Single Folder

    box.


    # To set case sensitivity during file sorting


    +   1 Follow steps 1 and 2 from the “To set the maximum number of file

    entries in the Recent section” procedure.


    +   2 Enable or disable the Ignore Case When Sorting box.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Showing and hiding sections in the Disk Navigator menu


    You can show or hide the Shared, Personal and Recent sections of the Disk Navigator
    menu. You can also show or hide dot files in the Disk Navigator menu. Dot files
    are files with names that are preceded by a dot. Dot files are also known as hidden
    files. Commonly, users are unaware of these files because they are not displayed
    on the menus. Some examples of dot files are .profile, .emacs, and .login. You
    can show or hide the Options selection on the Disk Navigator menu. The Options
    command lets you customize the Disk Navigator menu.


    # To show the Disk Navigator menu


    +   Right-click the Panel, and click Configure.

    Click the Menu tab.

    Enable the Show The Disk Navigator Menu check box.


    # To show or hide the Shared section in the Disk Navigator menu


    +   Right-click the Panel, and click Configure.

    Click the Disk Navigator Menu tab.

    Do one of the following:

    * enable the Show Shared section check box — shows the Shared section

    * disable the Show Shared section check box — hides the Shared section


    # To show or hide the Personal section in the Disk Navigator menu


    +   Right-click the Panel, and click Configure.

    Click the Disk Navigator Menu tab.

    Do one of the following:

    * enable the Show Personal Section check box — shows the Personal section

    * disable the Show Personal Section check box — hides the Personal section


    # To show or hide the Recent section in the Disk Navigator menu


    +   Right-click the Panel, and click Configure.

    Click the Disk Navigator Menu tab.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '3 Do one of the following:


    +   - enable the Show Recent Section check box — shows the Recent section

    - disable the Show Recent Section check box — hides the Recent section


    # To show or hide dot files in the Disk Navigator menu


    +   1 Right-click the Panel, and click Configure.

    2 Click the Disk Navigator Menu tab.

    3 Do one of the following:

    - enable the Show Dot Files check box — shows dot files

    - disable the Show Dot Files check box — hides dot files


    # To show or hide the Options selection


    +   1 Right-click the Panel, and click Configure.

    2 Click the Disk Navigator tab.

    3 Enable or disable the Show Option Entry check box.


    # Customizing the Panel


    You can customize the location of the Panel by moving or resizing it. You can
    move the Panel to the top, left, bottom, or right of the screen. The Panel can
    be resized to tiny, normal or large.


    You can hide the Panel and animate the Panel so that it slides as you hide it.
    You can automatically hide the Panel using the Auto Hide feature. Auto Hide hides
    the Panel until you point at the edge of the screen where the Panel was last located.


    Corel Linux lets you customize application buttons on the Panel. Application buttons
    are icons that appear on the Panel. When you click an application button, it starts
    the application. You can move or remove application buttons, and change the icons
    and ToolTips that accompany application buttons.


    The taskbar displays the applications that are running on the desktop. Clicking
    a file icon on the taskbar displays the window on the desktop; minimizing a window
    makes the window disappear from the desktop, but it is still open and available
    from the taskbar. The taskbar is docked in the Panel by default, but you can move
    it so that it displays on the top, bottom, or top left area of the screen. You
    can also hide the taskbar, or resize it.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'The time displays in the Docking Station, located on the right side of the
    Panel. You can show the time in three formats: AM/PM format, which calculates
    time based on a 12-hour cycle; Internet beats which is a standard Internet time,
    or 24-hour format which calculates time based on a 24 hour cycle. You can also
    change the date, time, and time zone.


    # Customizing the Panel


    You can move the Panel on the desktop, and you can resize the Panel.


    # To move the Panel on the desktop


    +   1 Right-click the Panel, and click Configure.


    +   2 Click the Panel tab.


    +   3 In the Location section, enable one of the following buttons:

    * Top

    * Left

    * Bottom

    * Right


    You can also drag the Panel to a side of the desktop.


    # To resize the Panel


    +   1 Right-click the Panel, and click Configure.


    +   2 Click the Panel tab.


    +   3 In the Style section, enable one of the following buttons:

    * Tiny

    * Normal

    * Large


    # Showing and hiding the Panel


    You can hide the Panel to make more space on your desktop for applications and
    other windows. If you enable the Auto Hide feature, the Panel hides automatically.
    You can animate the Panel so that it slides as you hide it.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# To hide or show the Panel


    +   - Click the Panel flyout, located beside the Application Starter button.


    # To hide the Panel using Auto Hide


    +   1 Right-click the Panel, and click Configure.


    +   2 Click the Options tab.


    +   3 Enable the Auto Hide Panel check box.


    +   4 Move the Delay slider to set the speed of the showing/hiding time delay.


    +   5 Move the Speed slider to set the showing/hiding speed.


    # To show the Panel when Auto Hide is enabled


    +   - Position the cursor at the top, bottom or side of the screen, where the
    Panel is positioned when visible.


    # To hide the Panel when Auto Hide is enabled


    +   - Move the cursor away from the Panel.


    # To animate the showing and hiding of the Panel


    +   1 Right-click the Panel, and click Configure.


    +   2 Click the Options tab.


    +   3 Enable the Animate Show/Hide button.


    +   4 Move the Speed slider to set the animation speed. Moving the slider to left
    decreases the speed, and to the right increases the speed.


    # Customizing application buttons on the Panel


    You can customize the application buttons on the Panel. You can move an application
    button on the Panel or remove it from the Panel. You can also change the ToolTips
    and icons that appear on the application buttons. Only the root user can make
    changes to the application buttons on the taskbar.


    # To move an application button


    +   1 Right-click an application button, and click Move.


    +   2 Move the application button to the new location on the Panel, and click
    the Panel.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# To remove an application button


    +   - Right-click an application button, and click Remove.


    # To change the icon on an application button


    +   1 Right-click an application button, and click Properties.


    +   2 Click the Execute tab, and click the Icon button.


    +   3 Choose the folder from the Select Icon list box, and click the new icon.


    +   - You can specify a file type in the Filter box when you choose a new icon.


    # To change the ToolTip of an application button


    +   1 Right-click an application button, and click Properties.


    +   2 Click the Application tab.


    +   3 Type text for the ToolTip in the Comment box.


    # Customizing the taskbar


    Corel LINUX lets you customize the taskbar. You can change the location of the
    taskbar on the desktop and hide the taskbar. When you hide the taskbar, it appears
    only when you move your cursor to the edge of the screen. You can also change
    the size of the taskbar when it is docked to the Panel.


    # To change the location of the taskbar


    +   1 Right-click the taskbar, and click Configure.


    +   2 Click the Panel tab.


    +   3 Enable one of the following buttons:


    +   - Hidden


    +   - Top


    +   - Bottom


    +   - Top/Left


    # To hide the taskbar using Auto Hide


    +   1 Right-click the taskbar, and click Configure.


    +   2 Click the Options tab.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '3 Enable the Auto Hide Taskbar check box.

    4 Move the Delay slider to set showing/hiding time delay.

    5 Move the Speed slider to set the showing/hiding speed.


    +   - Auto Hide taskbar is disabled when the taskbar is docked to the Panel.


    # To resize the taskbar when it is docked to the Panel

    1 Position the cursor over the taskbar border.

    2 Drag the taskbar border to the left to widen the taskbar, or to the right to
    shorten the taskbar.


    +   - You cannot resize the taskbar when it is undocked from the Panel.


    # Showing the time on the Panel


    The Panel shows the time in three formats:


    +   - AM/PM format

    - Internet beats

    - 24-hour format


    # To show the time in AM/PM format

    1 Right-click the Panel, and click Configure.

    2 Click the Options tab.

    3 Enable the Clock Shows Time In AM/PM Format button.


    # To show the time in Internet beats

    1 Right-click the Panel, and click on Configure

    2 Click the Options tab.

    3 Enable the Clock Shows Time In Internet Beats button.


    # To show the time in 24-hour format

    1 Right-click the Panel, and click the Options tab.

    2 Enable the Show Time in 24-hour Format button.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Changing date and time settings


    You can change the date, time, and time zone.


    # To change the time


    +   1 Click Application Starter, Control Center.

    2 Click Date & Time, and click the Date/Time tab.

    3 Position the cursor below the clock in the hours, minutes, or seconds spin box.

    4 Click the plus button (+) or minus button (-) to change the hours, minutes,
    or seconds.


    > > You can reset the time to the most recent settings by clicking the Now button
    only if you did not press the OK or Apply button after you made your changes.


    # To change the date


    +   1 Follow steps 1 and 2 from the previous procedure.

    2 Choose a month from the list box above the calendar.

    3 Choose a year from the spin box above the calendar.

    4 Click a date in the calendar.


    > > You can reset the date to the most recent settings by clicking the Today button
    only if you did not press the OK or Apply button after you made your changes.


    # To change the time zone


    +   1 Follow steps 1 and 2 from the “To change the time” procedure.

    2 Click the Time Zone tab.

    3 Choose a time zone from the List box.


    > > You must be logged in as the root user to change the time and date settings.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Customizing virtual desktops and borders


    You can change the number of virtual desktops. You can use up to eight virtual
    desktops; the virtual desktops that you have set are displayed as numbered icons
    on the Panel. You can rename the virtual desktops and apply the same background
    or wallpaper to all of them.


    You can customize the behavior of desktop borders and window borders. Active Borders
    let you switch virtual desktops by moving the cursor to the screen''s edge. Magic
    Borders let you control how windows snap to the other windows and the edge of
    the screen. Customizing Active Borders and Magic Borders applies the settings
    to the windows and borders of all the virtual desktops.


    # Customizing virtual desktops


    You can customize virtual desktops using the Panel. Corel LINUX lets you change
    the number of virtual desktops to a maximum of eight. You can also name each virtual
    desktop. You can apply the same background to all the virtual desktops.


    # To change the number of virtual desktops


    +   1. Right-click the Panel, and click Configure.


    +   2. Click the Desktops tab.


    +   3. Choose a number from the Visible List box.


    # To name a virtual desktop


    +   1. Follow steps 1 and 2 from the previous procedure.


    +   2. Type the name of the virtual desktop in the corresponding numbered box.


    # To set the same background on all the virtual desktops


    +   1. Click Application Starter, Control Panel.


    +   2. Double-click Desktop, then click Background.


    +   3. Enable the Common Background check box, located below the Desktop box.


    # Customizing active desktop borders


    The Active Desktop Borders feature lets you switch to another virtual desktop
    by moving the cursor to the edge of the screen. You can customize this feature
    so that the cursor returns to the center of the screen after each'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'switch. You can also set the amount of time the cursor must be at the border
    of the screen before the virtual desktop switches.


    # To enable active desktop borders


    +   1 Click Application Starter, Control Center.

    2 Double-click Desktop, and click Borders.

    3 Enable the Enable Active Desktop Borders check box.


    # To center the cursor after a virtual desktop switch


    +   1 Follow steps 1 to 3 from the previous procedure.

    2 Enable the Move Pointer Towards Center After Switch check box.


    # To set the switch delay for the desktop


    +   1 Follow steps 1 to 3 from the “To enable active desktop borders” procedure.

    2 Move the Desktop Switch Delay slider to the left to decrease the delay time,
    and to the right to increase the delay time.


    # Setting Magic Borders


    The Magic Borders feature lets you set a snap zone on the edges of windows or
    around the edge of the screen. A border snap zone consists of a specified number
    of pixels around the edge of the screen. Snap zones are measured in pixels. A
    window snap zone consists of a specified number of pixels around the edge of a
    window. Windows automatically snap together and line up side by side when you
    move one window into the snap zone of another window. Moving a window into a border
    snap zone automatically lines up the edge of the window with the edge of the screen.


    # To set the Border Snap Zone


    +   1 Click Application Starter, Control Center.

    2 Double-click Desktop, and click Borders.

    3 Move the Border Snap Zone slider to the left to decrease width of the snap zone,
    and to the right to increase the snap zone.'
