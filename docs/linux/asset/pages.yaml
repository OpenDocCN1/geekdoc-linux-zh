- pgno: 336
  md: '# # Configuring network connections


    Corel LINUX provides utilities that let you communicate with other computers and
    people across a local network and across the Internet.


    +   * Dial-Up — lets you connect to the Internet using your modem and a telephone
    line

    * Samba Client — lets you share files and printer services with Microsoft Windows
    computers

    * Ethernet Configuration — lets you set up an Ethernet connection if your computer
    is part of a local network of computers


    Dial-Up performs the process of dialing the number to your Internet Service Provider
    (ISP) and completing the connection with the ISP server. It lets you set up dial-up
    accounts if you connect to different networks or ISP''s and configure modem options.
    Samba Client is installed with Corel LINUX. Samba lets Corel LINUX and Microsoft
    Windows computers work together on a network, sharing file and printer services.
    An Ethernet connection lets you communicate with other computers on a local network,
    for example, in an office setting.


    You can also configure your computer to perform as a network server. Corel LINUX
    comes with server software to let you set up your Corel LINUX'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'computer to act as any of the following servers: Apache Web server, ProFTPD
    FTP server, qmail mail server, Samba server, NFS server, DHCP server. For information
    maximizing your Corel LINUX capabilities, see the Corel LINUX Server Administrator
    Guide.


    # Connecting to a network using a modem


    Corel LINUX provides a utility, Dial-Up, that lets you connect to the Internet
    or a remote network using a modem and your telephone line. Connecting to a network
    which is called dialing up to a network. Point-to-Point Protocol (PPP) is a protocol
    used for establishing and maintaining internet work connections over a link made
    modems and telephone lines. Dial-Up uses PPP to communicate with network and Internet
    servers.


    You can use Dial-Up to establish a PPP connection between a Corel LINUX computer
    and a server, and access the resources of the network to which the server is connected.
    When you access the Internet, you dial up a server provided by an Internet Service
    Provider (ISP) and access the Internet from the ISP server. You can also use a
    PPP connection to link two Linux computers on different networks (or a local network
    to the Internet), creating a Wide Area Network (WAN).


    To establish a connection between the client Linux computer (your computer) and
    the server (the computer through which you connect to a network), the client must
    dial up the server. Corel LINUX Dial-Up acts as a dial, automating the operating
    system''s connection process between the server and the client. Once a connection
    is established, the Corel LINUX PPP daemon, pppd, starts and begins to direct
    the PPP session.


    Dial-Up performs the dial-up process and network connection. It lets you set dial-up
    accounts and configure serial device options and modem options. You can also configure
    dial-up account preferences, such as setting the ppp timeout, window docking,
    and the colors of the throughput graph that displays the speed and amount of input
    and output information during a dial-up session. Dial-Up also keeps a viewable
    log of connections you have made by dialing up to a remote server.


    # Setting up a dial-up account


    A dial-up account contains information that lets Dial-Up connect the client to
    the server. To set up a dial-up account, you must provide specific information
    about the server, such as the name and phone number of the server. You must also
    provide information about the client, such as the IP address, domain name and
    DNS IP address, and the gateway. During the account setup, you can create login
    scripts, to automate the login process. The accounting option lets you keep track
    of the cost of your dial-up connection.'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'To set up a dial-up account using Dial-Up, you need to know the following information
    about your Corel LINUX computer and the server you want to connect to:


    +   - the connection name (usually the name of the ISP; it must be unique if you
    have more than one dial-up account

    - the telephone number of the server

    - whether the server uses dynamic or static IP addresses

    - the static IP address, if applicable

    - the IP number of the server’s Domain Name Service (DNS)

    - the PPP authentication method the server uses: Password Authentication Protocol
    (PAP) or Challenge Handshake Authentication Protocol (CHAP)

    - whether the server automatically starts PPP, or whether you must issue a start
    command once you are logged on


    Your system administrator or Internet Service Provider (ISP) can provide this
    dial-up information.


    # IP and DNS


    A network identifies your computer by a unique domain name and an Internet Protocol
    (IP) address. The domain name is like a proper name. The IP address is a numeric
    address. During a dial-up connection, the domain name of the computer must be
    translated into the IP address. Domain Name Service (DNS) servers translate IP
    addresses into proper names. You must supply at least one DNS server IP address
    when you set up a dial-up account.


    To create a dial-up account, you must specify the IP address and domain name of
    your computer, and the IP address and domain name of the DNS server that you use
    to resolve IP addresses and domain names. If the DNS servers you have specified
    are outside of your local network, you can disable them when you connect to computers
    within the local network that might not need domain name translation.


    # Dynamic and static IP addresses


    Your computer can use either a dynamic or static IP address. When you use a dynamic
    IP address, each time you connect to a network, the server you contact assigns
    an IP address during the current dial-up session. The number is different each
    time you connect to your ISP. When you use a static IP address, your computer
    is assigned an IP address to use every time you connect.


    To create a dial-up account, you must specify whether your ISP assigns a dynamic
    or static IP address. If you have a static IP address and your'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'computer is part of a larger network, your ISP also provides you with a subnet
    mask IP address.


    # PPP Authentication Methods


    Password Authentication Protocol (PAP) and Challenge Handshake Authentication
    Protocol (CHAP) are authentication methods that prevent unauthorized users from
    using your PPP line and accessing your system. PAP is a login procedure. During
    the dial-up process, the client sends a login and password to the server, which
    verifies the information using a login and password database. CHAP requires that
    the client send its hostname and a random string to the server, which must return
    a particular response. The client verifies the server''s response, completing
    the authentication. CHAP authentication repeats for the duration of the connection.


    To create a dial-up account, you must specify whether the ISP uses the PAP or
    CHAP authentication method.


    # Gateway


    A gateway is the computer that acts as a physical connection port to the Internet
    or to other networks. If your computer is part of a larger network that has a
    gateway, you need to specify the IP address of the gateway. If your computer is
    part of a network that does not have a dedicated Internet connection, or is a
    standalone workstation, enable the default gateway. Both the default gateway and
    the static gateway have a default route, which is a hardware path from your computer
    to the gateway computer. You can disable the default route and configure an alternative
    route; however it is highly recommended that you maintain the default route.


    # Login Script


    A login script is a set of commands that control the login part of the dial-up
    process. You can edit the default login script to customize your dial-up login.
    Each command you use in the script must set a string (a sequence of characters)
    or other parameters to specify how the command functions. For example, the Expect
    command Dial-Up waits to receive a specified string before logging in to a server.
    If you set this string as “ID”, the Dial-Up waits to receive a user ID before
    logging in. You can use the following commands to create a custom login script:


    +   * Expect — Dial-Up waits for a specific string before completing login


    +   * Send — Dial-Up sends the specified string


    +   * Scan — Dial-Up scans the input data for a specified string (for example,
    a response returned during CHAP authentication)'
  merge: -1
  img_proc: true
- pgno: 340
  md: '+   - Save — Dial-Up stores the scanned string; Dial-Up stores only a password
    string

    - Pause — Dial-Up pauses for the specified number of seconds

    - Hangup — Dial-Up sends a hang-up command to the modem

    - Answer — Dial-Up prepares to answer an incoming connection

    - Timeout — Dial-Up overrides the default or previously set modem timeout with
    the specified number of seconds; the default is reset when the login script is
    complete

    - Prompt — Dial-Up prompts you to enter the specified string

    - PWPrompt — Dial-Up prompts you to enter a password

    - ID — Dial-Up sends your user name if you have typed it in the user dialog box;
    if not, Dial-Up prompts you to type it

    - Password — Dial-Up sends your password if you have typed it in the password
    dialog box; if not, Dial-Up prompts you to type it

    - Loopstart — Dial-Up waits to receive a specified string; it saves the string
    for use by Loopend

    - Loopend — Dial-Up exits the loop when it receives the specified string


    # PPP daemon (pppd)


    The PPP daemon is a program that starts when Dial-Up establishes a connection
    with a server. It directs the flow of information between the client and server.
    You can customize the pppd options; however, it is recommended that you maintain
    the preset pppd options.


    # Setting dial options


    You can set the dial options for a dial-up account. You can specify the connection
    name and phone number. The connection name is arbitrary, but choose a name you
    can remember, like the name of your ISP. You can also set the password authentication
    method, or have Dial-Up store your password if you do not want to retype each
    time you make a dial-up connection.


    To set the connection name and phone number


    +   1 Click Application Starter, Applications, Network, Dial-Up.

    2 Click the Setup button.

    3 On the Accounts tab, click the New button.

    4 Click the Dial tab.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_340_0.png)'
  merge: -1
  img_proc: true
- pgno: 341
  md: '5 Type the connection name.


    6 Type the phone number of the server that you want to dial up to.


    # To set the password authentication method


    +   1 Follow steps 1 to 4 from the previous procedure.


    +   2 Choose an authentication method from the Authentication list box.


    # To store the password


    +   1 Follow steps 1 to 4 from the “To set the connection name and phone number”
    procedure.


    +   2 Enable the Store Password check box.


    # Setting an IP address in Dial-up


    You can specify whether the dial-up connection uses a dynamic or static IP address.
    You can set the IP address and subnet mask for a static IP connection, and set
    Dial-Up to automatically configure a hostname from the specified IP address.


    # To set a dynamic IP address


    +   1 Click Application Starter, Applications, Network, Dial-Up.


    +   2 Click the Setup button.


    +   3 Click the Accounts tab.


    +   4 Choose a dial-up account from the Account Setup list, and click the Edit
    button.


    +   5 Click the IP tab.


    +   6 Enable the Dynamic IP Address button.


    # To set a static IP address and subnet mask address


    +   1 Follow steps 1 to 4 from the previous procedure.


    +   2 Enable the Static IP Address button.


    +   3 Enter the IP address and subnet mask address.


    # To auto-configure a hostname from an IP address


    +   1 Click Application Starter, Applications, Network, Dial-Up.


    +   2 Click the Setup button.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '3 Click the Accounts tab.

    4 Choose a dial-up account from the Account Setup list, and click the Edit button.

    5 Click the IP tab.

    6 Enable the Auto-Configure Hostname From The IP Address check box.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_342_0.png)


    +   - Set the Auto-Configure Hostname From The IP Address option only if you are
    using a protocol such as a Talk utility that requires your hostname to match your
    computer''s domain name. This option overrides the Domain Name option in the DNS
    configuration section. Dial-Up restores defaults when you disconnect from the
    PPP server.


    # Setting DNS servers


    You can add a DNS server to the dial-up account. To add a DNS server, specify
    a domain name for your computer and the DNS IP address of the DNS server assigned
    to you by your ISP or system administrator. You can add multiple DNS servers;
    you must have at least one DNS server in the DNS address list. You can also remove
    DNS servers from the dial-up account list. You can disable existing DNS servers
    when you connect to computers within the local network that might not need domain
    name translation.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_342_1.png)


    # To add a DNS server


    +   1 Click Application Starter, Applications, Network, Dial-Up.

    2 Click the Setup button.

    3 Click the Accounts tab.

    4 Choose a dial-up account from the Account Setup list and click the Edit button.

    5 Click the DNS tab.

    6 Type a domain name in the Domain Name box.

    7 Type the DNS IP address in the DNS IP Address box.

    8 Click Add.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_342_2.png)


    +   - If you not have a dial-up account set up (the Account Setup list appears
    empty), you must set up a dial-up account. For information about setting a dial-up
    account, see “Setting up a dial-up account” on page 328.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# To remove a DNS server


