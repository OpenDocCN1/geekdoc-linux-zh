    you open Screen Grab. If the area you want to capture is displayed on your desktop,
    you save the screen capture when you open Screen Grab. You can take multiple screen
    captures. Screen Grab provides options that let you customize how and when to
    create the screen capture.


    # Starting Screen Grab


    Screen Grab automatically takes a screen capture of the desktop and all the open
    windows when you start the application. You can save this screen capture or you
    can create one. For information about creating a screen'
