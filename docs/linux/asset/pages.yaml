    # Setting Archive Administrator options


    The Add File options let you store the full path of a compressed file. Archive
    Administrator saves the path of the compressed file so that when you extract the
    file, Archive Administrator replicates the original path of that file.


    You can choose to add only newer files to an archive. This option is useful when
    you frequently add files to a directory that you archive, so when you update this
    directory, Archive Administrator adds only the newer files. You can enable, or
    disable both add file options or you choose one of the options. Archive Administrator
    also lets you set a default archive directory in which you can store the archives
    you create.


    Archive Administrator uses a tar application to compress files and decompress
    archives. You can change the default tar application. If you do not have a tar
    application set, the Archive Administrator cannot compress or decompress your
    files. If you decide to change the default tar application, you must install a
    new tar application.


    You can save your setting changes so that you do not have to reset them when you
    start Archive Administrator.


    # To add archive files from their full paths


    +   • Click Options, Options.


    +   • Enable the Store Full Path check box.


    # To add only newer files


    +   • Click Options, Options.


    +   • Enable the Only Add Newer Files check box.


    # To set the default archive directory


    +   • Click Options, Options.


    +   • In the Location list box, type the path to a directory.


    # To set the default tar application


    +   • Click Options, Options.


    +   • In the Application Name box, type the application name.'
