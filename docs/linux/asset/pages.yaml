- pgno: 138
  md: '# # Installing, updating, and removing applications 7


    Corel LINUX provides a utility that lets you install, update, and remove the Corel
    LINUX operating system and its third-party components, Corel applications, such
    as WordPerfect, and third-party applications, such as Lynx or Netscape Communicator.
    You need a network or Internet connection or a CD-ROM that contains applications
    before you can use Corel® Update to install new or updated versions of applications.


    Corel Update identifies applications and components of the Linux operating system
    for which an update is available, so that you can install a more recent version.
    Because the Corel LINUX applications and operating system are Open Source, updates
    can occur frequently; newer versions are available when features are added, bugs
    are fixed, or more reliable code is implemented. You can also use Corel Update
    to remove applications that you no longer want to use. You can reinstall deleted
    applications at any time.


    You can use Corel Update to install newer versions of the kernel. The kernel is
    the core of the Linux operating system. It contains the code to run the computer
    and provide the basic services necessary. New versions of the kernel are available
    from the Corel FTP site.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'You must have root privileges if you want to install, update, or remove applications
    from the system. For information about using the root account, see "Using the
    root account" on page 103.


    +   - Corel Update is a graphical user interface for the Application Get (apt-get)
    and Dselect (dpkg) commands.

    - For information about network connections, contact your system administrator.
    For information about Internet connections, contact your Internet Service Provider.

    - By default, Corel Update is configured to access the Corel FTP site.


    # # Installing applications


    Corel LINUX lets you install applications to your system. Before installing, you
    must select a file source. A file source is the location from which the application
    is retrieved. You can install applications using any of the following file sources:


    | File Source | Description |

    | CD-ROM | A disc containing Debian applications or application upgrades |

    | Distribution site | A path to the Corel/Debian FTP site. |

    | Custom path | A path that is linked to an FTP or HTTP site that contains Debian
    applications or application upgrades. You can edit the custom path or add new
    paths.


    +   - You must have a network or Internet connection before you can use the Distribution
    site and Custom path file sources to install or update applications.

    - You must have root privileges to install applications to the system. For information
    about using the root account, see "Using the root account" on page 103.

    - By default, Corel Update is configured to access the Corel FTP site.


    # # Selecting and editing file sources


    Before you can install applications, you must specify a file source. A file source
    is the location from which the application is retrieved. You can choose from three
    file sources: a CD-ROM, a distribution site, or a custom path to a'
