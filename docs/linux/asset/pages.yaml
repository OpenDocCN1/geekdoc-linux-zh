    Before you install applications, you need to select a file source. A file source
    tells Corel Update where it can find the files that are necessary to install the
    new application. For information about selecting a file source, see “Selecting
    and editing file sources” on page 130.


    # To install an application


    +   - Click Application Starter, Applications, System, Corel Update.

    - Click the Available Software tab.

