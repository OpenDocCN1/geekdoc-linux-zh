    # Exploring the Midnight Commander interface


    The Midnight Commander interface displays five sections; the menu bar, directory
    panels, hint line, command line, and function key labels.


    +   This illustration displays the areas of the Midnight Commander interface:

    1) Menu Bar

    2) directory panels

