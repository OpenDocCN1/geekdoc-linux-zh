    # Changing attachment style


    You can change the appearance of attachments in newsgroup articles by choosing
    a different attachment styles.


    # To change the attachment style


    1 In the Newsgroup window, click Options, Appearance.


    2 From the Attachment Style list box in the Message Display Settings window, choose
    one of the following attachment styles:


    +   - Iconic — displays an icon you can click to view the attachment


    +   - Smart — displays an icon you can click to view the attachment


    +   - Inline — displays the attachment in the body of the article, immediately
    after the article text


    +   - For information about opening newsgroups, see “Opening newsgroups” on page
    178.


    # Changing article fonts


    You can change the font size and style of text in newsgroup articles.


    # To change the font size


    1 In the Newsgroup window, click Options, Appearance.


    2 From the Font Size list box in the Display Message Settings Window, choose one
    of the following font sizes:'
  merge: -1
  img_proc: true
