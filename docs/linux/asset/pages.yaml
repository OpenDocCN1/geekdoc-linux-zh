    # Deleting directories and files


    You can delete directories and files using the Remove Directory (rmdir) and Remove
    File (rm) commands. Unless you specify a path name, bash locks in your working
    directory for the files to delete. Use a relative path name if the file exists
    in a subdirectory of your working directory. Use an absolute path name if the
    file is located above your working directory in the directory tree structure.
    For information about relative and absolute path names, see “Navigating the file
    system” on page 303.


    To delete directories or files you need write permission for the directory that
    contains the item. If you try to delete a file for which you do not have write'
