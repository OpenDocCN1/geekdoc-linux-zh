    You can also view files using the Concatenate command (cat). For information about
    using this command, see the Manual page for the cat command.


    You can combine the More, Less, and Cat commands with other commands using pipes
    or redirection. For information about pipes and redirection, see “Combining pipes
    with pipes” on page 302 and “Redirecting input and output” on page 301.


    You can view long documents page by page using the SPACEBAR. You can also view
