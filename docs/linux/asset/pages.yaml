  img_proc: true
- pgno: 38
  md: '# Creating a bootable disk for Corel LINUX


    Some editions of Corel LINUX include the Corel LINUX Installation (bootable) floppy
    disk. If you require this floppy disk, you can create it using a 3.5" high-density
    floppy disk. This bootable disk can be created using Windows 95, Windows 98, Windows
    NT, or a Linux operating system.


    In Windows NT, you may be able to reconfigure your computer to make your CD-ROM
    bootable.


    # To create a bootable disk using Windows 95/98/NT


    +   Label a floppy disk "Corel LINUX boot," and insert it into your floppy disk
    drive.


    +   The contents of this disk will be erased.


    +   Insert the Corel LINUX Installation CD-ROM into the CD-ROM drive.

    Make sure that Windows is already started.


    +   Double-click the My Computer icon.


    +   Right-click the CD-ROM drive, and click Open.


    +   Double-click the Tools folder.


    +   Double-click the file BOOTFLOPBAT and follow the instructions.


    # To set a CD-ROM as bootable in Windows NT


    +   In Windows NT, click Start, Settings, Control Panel.


    +   Double-click Devices.


    +   Choose Cdrom from the Device list box.


    +   Click the Startup button.


    +   Enable the Boot button, and click OK.


    +   The procedure noted above may not apply to all CD-ROM hardware.


    +   In addition to changing the CD-ROM setting in Windows NT, you may also have
    to change the settings within your computer''s BIOS settings. For more information,
    see the user manual for your computer.


    # To create a bootable disk using a Linux operating system


    +   Label a floppy disk "Corel LINUX boot," and insert it into your floppy disk
    drive.'
  merge: -1
  img_proc: true
