- pgno: 169
  md: 'computers, folders, files, and printers associated with the Microsoft Windows
    servers display in the Corel File Manager window.


    # To open the shared network directory


    +   1 On the Panel, click the Corel File Manager button.

    2 Double-click Windows Network in the All Folders list.

    3 Type the Windows domain name, a backslash (\), then your Windows user name in
    the Connect As box.

    4 Type your Windows network password in the Password box.


    # To open Microsoft Windows files and folders


    +   1 Follow all the steps from the previous procedure.

    2 Display directory contents of any computer listed by doing one of the following:

    * click the plus sign beside the directory

    * click the icon or name of the directory (shows the contents in the Name list)

    * double-click the icon or name of the directory (shows the contents in the All
    Folders and Name lists)


    +   * You must have Samba configured on your computer to access Microsoft Windows
    computer on the network. For more information about configuring Samba, see “Connecting
    to Microsoft Windows computers” on page 349.

    * Some Windows computers and files require you to provide a password in order
    to access them. The system administrator can provide you with passwords.


    # Mounting a network share


    You can mount a directory that is located on a remote Microsoft Windows or Linux
    file system on your home directory. A mounted network share lets you access the
    shared directory and its contents without navigating the Windows or NFS network.
    You can also perform the same file operations on the mounted shared directory
    as you would on your home directories.


    You can choose the directory on your file system where you want to mount the shared
    directory. When you mount a shared directory, the directory and its files are
    displayed in the location you specify as the mount point.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'mount point is the location in the local file system where you place the shared
    network directory. You must have permission to access the directory you want to
    mount, or you will be prompted to enter a password to access the directory. The
    system administrator can provide you with the passwords you need.


    You can also disconnect a mounted network share. When you disconnect from a mounted
    directory, the directory disappears from the directory in which it was mounted,
    and you can no longer access it from your home directory.


    # To mount a network share


    +   1 On the Panel, click the *Corel File Manager* button.


    +   2 Click Tools, Mount Network Share.


    +   3 Type the file path to the directory where you want to mount the shared directory.


    +   4 Double-click a directory in the Shared Directories boxes.


    +   5 Type your workgroup name, a backslash (\), then your user name, in the Connect
    As box, if it does not appear automatically.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_170_0.png)


    +   * If you have already logged into the network, for example, when you started
    the Corel LINUX session, you will not be prompted for a user name and password.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_170_1.png)


    +   * You can also choose a mount point by browsing your home directory. Click
    the Browse button in the Mount Network Share dialog box. Navigate to the directory
    where you want to mount the shared directory.


    # To disconnect a network share


    +   1 On the Panel, click the *Corel File Manager* button.


    +   2 Click Tools, Disconnect Network Share.


    +   3 Choose a mounted network share in the Disconnect Network Share dialog box,
    and click OK.


    +   4 In the dialog box that appears, click Yes if you want to remount the network
    share the next time you log on; Click No if you do not want to remount the network
    share.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_170_2.png)'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Sharing directories on a Linux network file system (NFS)


    A Corel system can be shared on the Linux network. When a Linux system is designated
    as shared on the network file system (NFS), you can access the directories and
    files of other Linux computers. When you open the NFS Network in Corel File Manager,
    the servers (identified by IP address) and their associated directories and files
    display in the Corel File Manager window. For more information about the NFS network
    see the Corel Linux Server Administrator Guide.


    # Opening a shared Linux network file system (NFS)


    +   On the Panel, click the Corel File Manager button.


    +   Double-click NFS Network in the All Folders list.


    # Viewing the contents of a shared directory


    +   Follow all the steps from the previous procedure.


    +   Display the directory contents of any computer listed by doing one of the
    following:

    * click the plus sign beside the directory

    * click the icon or name of the directory (shows the contents in the Name list)

    * double-click the icon or name of the directory (shows the contents in the All
    Folders and Name lists)


    ![](img/86803f2a30e88fe6e62989f0fe100a53_171_0.png)


    +   Some NFS directories require you to use a password to access them. The system
    administrator or owner of the directory you want to access can provide you with
    access permission or a password. For more information about file access permission
    and passwords, see “Setting permissions and ownership” on page 113.


    # Accessing files from V-Drive


    You can access the Corel V-Drive Website from your desktop to open a V-Drive account
    or activate the V-Drive client driver. You can open your Corel V-drive account
    directly from Corel File Manager. You can open, copy, paste, post, move, rename,
    and delete directories and files located in your V-Drive Web space. You can upload
    directories and files to your V-Drive space. You must visit the Corel V-Drive
    Website to set up a V-Drive account before you can access V-Drive Web space.


    162 Corel LINUX User Guide: Chapter 8'
  merge: -1
  img_proc: true
