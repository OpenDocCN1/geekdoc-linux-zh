- pgno: 347
  md: '# Connecting to a network using Dial-Up


    You can connect to your ISP server or another PPP server on a remote network using
    Dial-Up. To connect to a server, you must configure a dial-up account. For more
    information on creating a dial-up account, see “Setting up a dial-up account”
    on page 328. You must provide a login ID and password. Dial-Up displays a Connection
    window when it completes the dial-up process and connects to the server. The title
    of the Connection window is the same as the name of the dial-up account.


    The throughput graph displays the amount and speed of data that flows from your
    connection. It also displays the IP address of the connection. You can view the
    throughput graph at any time during a dial-up connection.


    You can view a log of the connections you have made. The Dial-Up log displays
    the name and date, duration, and cost of the connection. You can view the current,
    previous or following month.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_347_0.png)


    +   If you have preset the dial-up account to store your password, you do not
    have to type it in. For information about storing a password, see “Setting dial
    options” on page 331.


    # Dialing up to a network


    You can dial up to a network server for which you have configured a dial-up account.
    Dialing up to a network server creates a network connection to that server. You
    can also disconnect from the server.


    # To dial up to a network server


    ![](img/86803f2a30e88fe6e62989f0fe100a53_347_1.png)


    +   1 Click Application Starter, Applications, Network, Dial-Up.

    2 From the Connect To list box, choose the network to which you want to connect.

    3 Type your login ID in the Login ID box.

    4 Type your password in the Password box, if required.

    5 Click the Connect button.


    # To disconnect from a network server


    +   1 Follow all the steps from the previous procedure.

    2 In the Connection window, click the Disconnect button.'
  merge: -1
  img_proc: true
