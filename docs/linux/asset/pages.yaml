- pgno: 24
  md: '# Telephone technical support options


    Corel LINUX users can use complimentary and fee-based telephone technical support
    options. Complete information about the three levels of support that are available
    to you and your organization, including phone numbers, is available in the Corel
    LINUX online Help.


    # General Service


    General Service is designed to address the technical support needs of Corel LINUX
    users. This service helps users with basic installation and configuration issues.


    # Developer Service


    Developer Service is a fee-based service for users who require advanced help.
    Developer Service may be purchased by the minute or by the incident.


    # Premium Service


    Premium Service is Corel''s highest level of support. This fee-based service is
    designed for organizations that want to establish a direct relationship with Corel
    and for organizations that employ dedicated support professionals or have centralized
    technical management.


    # Before calling Corel Technical Support


    Before you call Corel Technical Support, please have the following information
    available to assist the Technical Support representative in helping you:


    +   - a brief description of the problem, including the exact text of any error
    messages received and the steps required to recreate the problem

    - the type of computer, monitor, pointing device (for example, mouse or tablet),
    and video card (display adapter) you are using

    - the version number of Corel LINUX you are using


    You must provide your Personal Identification Number (PIN) or serial number (found
    on the Corel LINUX Product Authenticity Card) each time you call Corel Technical
    Support. If you register Corel LINUX after installing it, you will receive a PIN
    upon calling Corel Client Services. For more information about registering, see
    "Registering Corel LINUX" on page 30.


