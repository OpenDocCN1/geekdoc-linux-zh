- pgno: 174
  md: '# Connecting to the Internet


    Using Corel LINUX, you can connect to the Internet and access the World Wide Web.


    # Browsing Web pages


    You can use either Corel File Manager or Netscape Communicator to browse Web pages
    that are stored on the World Wide Web or an intranet. Both Corel File Manager
    and Netscape Communicator are graphical Web browsers. Corel File Manager is also
    a file management system. For information about using Corel File Manager as a
    file management system, see “Managing files in Corel LINUX” on page 135. Corel
    File Manager uses two Internet protocols: File Transfer Protocol (FTP) and Hypertext
    Transfer Protocol (HTTP). You can use Corel File Manager to browse Web pages and
    transfer files between remote computers using FTP. You also use Netscape Communicator
    to browse Web pages, transfer files using FTP, and send and receive email.


    # Joining chat channels


    Corel LINUX provides a chat client called Chat that lets you connect to chat servers
    on the Internet and join chat channels. A chat channel is a virtual bulletin board
    where users exchange online messages. Joining a chat channel lets you join the
    online discussion on that chat'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'channel can can be connected to different chat servers in different parts of
    the world.


    # Using newsgroups


    Corel LINUX provides a newsgroup client called Newsgroups. Using Newsgroups, you
    can browse and read newsgroup articles. Newsgroups lets you specify a news server,
    connect to it, and access the newsgroup on that server. You can download articles
    from the newsgroups that are on the news server to which you are connected. Connecting
    to a news server lets you see a list of all the newsgroups on that server. Opening
    a newsgroup lets you view a list of the articles posted to that newsgroup. You
    can read the articles in a newsgroup or open another newsgroup. You can post articles
    to a newsgroup or respond to articles. You can post an article to the newsgroup,
    simultaneously respond to the author with a private email, or with only a private
    email. You can also forward an article using email. You can search for a newsgroup
    on a server using the newsgroup name. You can also search for an article in a
    newsgroup using keywords.


    +   - You must have an Internet Service Provider or a network that supports Internet
    access before you can perform any of the above features.

    - network that supports Internet access before you can perform any of the above
    features.

    - For information about connecting to an Internet Service Provider or network,
    see "Configuring Network Connections" on page 327.

    - Not all editions of Corel LINUX include Netscape Communicator.


    # Using Corel File Manager as a Web browser


    Corel File Manager is a file management system that also lets you browse Web pages
    located on the World Wide Web or HTML pages on your computer or intranet. A Web
    browser is an application that lets you locate and view Web documents. You can
    visit pages by typing a Web address or by following hyperlinked text or objects.
    You can revisit Web pages that you have already downloaded during your current
    session using the navigation buttons, or by searching the history list. You can
    refresh the Corel File Manager window if there is a display problem after an interruption.
    You can interrupt a Web page transmission if it is slow to download because the
    document is large or because your Internet connection is slow.


    You can also use Corel File Manager to transfer files between remote computers
    using FTP. FTP lets you upload files from your computer to a remote computer,
    or download files from a remote computer to your computer.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Before you can use Corel File Manager as a Web browser, you must have an Internet
    Service Provider or a network that supports Internet access.


    +   - For information about using Corel File Manager as a file management system,
    see "Managing files in Corel LINUX" on page 135.

    - If you double-click a file that is stored as an HTML file, it opens automatically
    in Corel File Manager. For information about opening files, see "Starting applications
    in Corel File Manager" on page 144.


    # Viewing Web pages using Corel File Manager


    Corel File Manager is a Web browser that lets you locate and display Web pages
    using HTTP. Because Corel File Manager is also a file management system, it has
    a file tree on the left side of the application window. You can disable the file
    tree so that the Web page is displayed in the entire application window.


    # To view a Web page using Corel File Manager


    +   1 Click *Application Starter*, File Manager.

    2 In the Address box, type the URL of the Web page to view.

    3 Press ENTER.


    Corel File Manager precedes the URL with **http://** if you do not include it.


    # To disable the file tree


    +   - Click View, and disable the Tree check box.


    # To enable the file tree


    +   - Click View, and enable the Tree check box.


    # Exploring Corel''s Online Services


    Using Corel File Manager, you can learn more about Corel''s Online Services. The
    Web pages are preinstalled with Corel LINUX. The Web pages provide information
    on Corel LINUX and other Corel services and products that are available. For example,
    Corel hosts Web sites that let you apply effects to images and text, read email,
    and search for information on running a small business.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# To explore Corel''s Online Services, and click any of the following:


    +   * Click Application Starter, Online Services — takes you to a Web site that
    contains articles, discussion groups, and links to other Web sites on business
    topics

    * Business Community — takes you to a Web site

    * Clipart and Photos — takes you to a Web site that lets you download clipart,
    photos, Web graphics, and animated objects

    * Current Events — takes you to a Web site that lets you search for information
    on a variety of topics, including news and entertainment headlines, updates and
    the Internet

    * DesignerFX — takes you to a Web site that lets you upload an image to our site
    and then crop it, flip it or add a variety of special effects from within your
    Web browser. You can download the new image in a variety of file formats.

    * Email — takes you to a Web site that lets you read and send email online

    * Graphic Community — takes you to a Web site that lets you read about graphic
    and design issues and take advantage of free offers including clipart, bitmap
    frames, and spray lists

    * Linux Community — takes you to a Web site that lets you find more information
    on Corel LINUX, including updates, and press releases

    * TextFX — takes you to a Web site that lets you create text in a variety of fonts,
    colors, and sizes

    * What''s New — takes you to a Web site that lets you search an an index of Corel''s
    Online Services


    # Navigating Web pages using Corel File Manager


    You can return to Web pages that you have already visited during a session without
    typing the Web page''s URL in the Address box.


    # To return to a previously viewed Web page


    +   * Click one of the following buttons:

    * Back — moves you back to Web pages that you have already viewed

    * Forward — moves you forward to Web pages that you have already viewed'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Viewing the history list


    Corel File Manager keeps track of all the Web pages that you visit during each
    session. You can revisit Web pages without retyping their URL. The history list
    for the session is deleted when you exit Corel File Manager.


    # To view the history


    +   - Click the icon in the Address box.

    - Corel File Manager displays the list of all Web pages you visited during the
    current session.


    # To revisit a Web page using the history list


    +   1 Click the icon in the Address box.

    2 Click the Web page to revisit.


    # Refreshing the Corel File Manager window


    You can refresh the Corel File Manager window to resume exploring the Web after
    a display interruption.


    # To refresh the Corel File Manager window


    +   - Click the Refresh button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_178_0.png)


    # Interrupting Web page transmissions


    If a Web page is slow to download, you can stop the transmission so that the remote
    computer stops downloading data to your local computer.


    # To interrupt a Web page transmission


    +   - Click the Stop button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_178_1.png)


    # Transferring files using FTP


    You can use Corel File Manager to download files using FTP. FTP lets you transfer
    public files and folders across the Internet. There are two levels of FTP access.
    You can often gain access to files and folders without having permission from
    the network administrator, however in some cases you do need to have a password
    or an account before you can transfer information.


    # To download a file using FTP


    +   1 Click Application Starter, File Manager.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_178_2.png)'
  merge: -1
  img_proc: true
