    # Customizing the directory panel display


    You can customize Midnight Commander displays files in the directory panel by
    sorting the files according to criteria such as file size, filename and file format.
    You can also filter the directory file list to only view specified files. When
    you filter the directory file list, you must indicate a filter expression to specify
