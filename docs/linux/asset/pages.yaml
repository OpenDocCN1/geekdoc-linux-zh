    # Toggling page marks


    Toggling page marks lets you mark and unmark pages. The Toggle Page Marks command
    lets you invert all marked and unmarked pages. For example, you can print 97 pages
    of a 100-page document without marking all 97 pages. You can mark only the three
    pages you don''t want to print, and then toggle the page marks; the three marked
    pages are now unmarked, and the unmarked pages are now marked. Similarly, if you
    previously marked all even pages, you can use the Toggle Page Marks command to
    invert the pagemarks and mark all odd pages instead.


    For information about marking pages, see "Adding and removing page marks" on page
    232.


    # To toggle page marks


    1 Select the pages you want to mark.


    2 Click Pagemarks, Toggle Page Marks.


    +   - You can also mark and unmark individual page marks by selecting a page and
    clicking the Toggle Page Mark button on the toolbar.


    # Printing a document


    When you print file in PS Viewer, you can print to a printer or a file. When you
    print a file, you can set printing options to specify which pages you want to
    print. You can also reverse the order in which your document prints so the last
    page prints first.


    When you print a document to a file, the document and all the printing instructions
    are included in the file. The instructions included are based on the settings
    selected in the Print dialog box when you print to the file.'
