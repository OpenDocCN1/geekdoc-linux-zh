    \ a file or directory, and a destination or location where you want to move or\
    \ copy the source.\n\nYou can specify command options for all of the procedures\
    \ in the following sections. For information about command options, see “Understanding\
    \ Linux commands” on page 294.\n\n+   - You should perform most file operations\
    \ as a user. Use the root account only to perform system administration functions,\
