    # Setting and preventing log overwrites


    As the root user, you can set log dates in the Event Viewer to display only the
    most recent occurrence of an event in the log file list. You can set log dates
    that are never overwritten; when an event recurs, all instances of the event are
    displayed in the log files list.


    # To set a log overwrite date


    +   1 Click Application Starter, Applications, System, Event Viewer.


    +   2 Click Options, Log Dates.


    +   3 Enable the Overwrite Events Older Than button.


    +   4 In the Number box, type a number to specify the number of days after which
    a log event is overwritten by the most recent event.


    # To prevent a log overwrite


    +   1 Follow steps 1 and 2 from the previous procedure.


    +   2 Enable the Do Not Overwrite Events button.


    +   * Regular users who can log in as the root user can also set overwrite dates.'
