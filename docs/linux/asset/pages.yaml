    # Core LINUX user interface consistency


    As Core LINUX is customizable, you may notice differences between pictures or
    illustrations in the Core LINUX User Guide or online Help and your Core LINUX
    implementation.


    # We want your documentation feedback


    If you have comments or suggestions about Core LINUX documentation, you can email
    them to corelinuxdocs@corelin.com or mail them to the address below. Unfortunately,
    we may not be able to respond to your messages individually. To contact Core Client
