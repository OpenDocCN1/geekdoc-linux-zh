- pgno: 190
  md: '- Replying by email and forwarding an article posts nothing to the newsgroup.


    - For information about opening newsgroups, see “Opening newsgroups” on page 178.


    # Finding newsgroups


    You can search by name for a newsgroup on the server. Finding a newsgroup displays
    it in the Group List Window.


    # To find a newsgroup


    +   1 Click Application Starter, Applications, Network, Newsgroups.

    2 Click Newsgroup, Find.

    3 In the Find A Newsgroup dialog box, type the name of the newsgroup you want
    to find.


    # Finding articles


    You can search for an article in a newsgroup. You can search using keywords. You
    can search for keywords in the sender, subject, cached header, cached message,
    header, body, or message area of the articles. You can refine your search by searching
    for case-sensitive keywords. You can also set a wildcard option that lets you
    use wildcard characters.


    # To find an article


    +   1 In the Newsgroup window, click File, Find.

    2 In the Article Searcher dialog box, type a keyword.

    3 From the In Field list box choose the section of the article (for example, sender,
    header or message area) in which to search for the keyword.


    # To enable a case-sensitive keyword search


    +   1 Follow all the steps from the previous procedure.

    2 Enable the Case-sensitive check box.


    # To use wildcard characters


    +   1 Follow all the steps from the “To find an article” procedure.

    2 Enable the Wildcard Mode check box.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 3 Combine any of the following characters with your keyword search:


    +   - ? matches any character

    - * matches any sequence of characters

    - [] matches the characters within the brackets


    ![](img/86803f2a30e88fe6e62989f0fe100a53_191_0.png)


    For information about opening newsgroups, see "Opening newsgroups" on page 178.


    When you find an article, it is highlighted in red in the Newsgroup window.


    The Article Searcher finds the first instance of the keyword. Click the Find button
    again to find the next instance of the keyword.


    # Managing newsgroups and newsgroup articles


    Newsgroups lets you manage newsgroups. You can sort articles, tag them for future
    reference, or mark them as read orunread. You can set the amount of time that
    an article is saved before it expires. You can lock articles to prevent them from
    expiring. You can print articles in HTML, PostScript, or text. You can view setting
    options in a newsgroup, so that when you open a newsgroup, you view only unreal
    articles, cached articles, or locked articles. You can also customize the appearance
    of the articles in newsgroups by changing header styles, attachment styles, font,
    and display colors.


    # Sorting


    Sorting articles arranges the articles in the newsgroup according to a specified
    category. You can also use subcategory sorting. For example, you can set the first
    sort level to sort articles chronologically. You can set the second sort level
    to sort by sender. If there is more than one article posted on the same date,
    these are sorted alphabetically by sender. If you set the third sort level to
    sort by subject, then if there are several articles posted by the same date, these
    are further sorted alphabetically by. Sorting using threading displays the original
    article followed by each response article. Each response article following the
    original is indented.


    # Tagging and marking


    You can tag newsgroups and articles with a check mark if you want to refer to
    them later. When scanning through lists of newsgroups on the server or articles
    in the newsgroup, you can tag the articles that interest you. You can apply Newsgroups
    commands to all the tagged news groups or articles.


    182 Corel LINUX User Guide: Chapter 9'
  merge: -1
  img_proc: true
- pgno: 192
  md: "You can mark articles that you have read, or not read. By default, articles\
    \ in the Newsgroup window that you have not read appear with a green dot. When\
    \ you read an article, the dot becomes red. You can manually place a red (read)\
    \ or green (unread) dot beside articles.\n\n# Expiry options\n\nYou can set the\
    \ number of days an article remains in a newsgroup once you have downloaded it\
    \ from the server. Newsgroups deletes the article when the specified number of\
    \ days passes. You can set different expiry dates for the header of articles.\
    \ For example, you can set article body to expire after five days, and article\
    \ headers to expire after 10 days. The body, or main text is deleted after five\
    \ days, but the header still appears. Articles in newsgroups that you access using\
    \ Newsgroups are archived. If an article expires, you can retrieve it as long\
    \ as the header of the article remains in the list.\n\n# Locking\n\nLocking an\
    \ article prevents it from expiring. A locked article is cached. You can retrieve\
    \ it until you unlock it; once you unlock it, it is no longer cached and will\
    \ expire according to the expiry dates you have set.\n\n# Sorting articles in\
    \ a newsgroup\n\nYou can sort the list of articles in a newsgroup. You can sort\
    \ articles by subject, score, sender, date, lines, or choose no sorting. You can\
    \ choose subcategories of sorting, so that the main category is sorted according\
    \ to the category below it, and that category is sorted according to its subcategory.\
    \ You can sort using threading so that articles are displayed with the original\
    \ article followed by each response article. Each response following the original\
    \ is indented.\n\n# To sort articles by category\n\n+   1 In the Newsgroup window,\
    \ click Options, Sorting.\n\n+   2 From the first list box, choose one of the\
    \ following sort categories: \n\n+   * Subject\n* Score\n* Sender\n* Date\n* Lines\n\
    * None"
  merge: -1
  img_proc: true
- pgno: 193
  md: '# To choose subcategories for sorting


    +   1. In the Newsgroup window, click Options, Sorting.


    +   2. In each list box after the first list box, choose a sort category.


    # To sort using threading


    +   1. In the Newsgroup window, click Options, Sorting.


    +   2. Enable the Use Threading check box.


    For information about opening newsgroups, see “Opening newsgroups” on page 178.


    # Tagging and untagging newsgroups


    Tagging newsgroups lets you to refer to them later. A check mark icon appears
    beside a tagged newsgroup. You can also untag a newsgroup or untag all the tagged
    newsgroups.


    # To tag a newsgroup


    +   1. Click Application Starter, Applications, Network, Newsgroups.


    +   2. Click the plus sign (+) to expand the Subscribed Newsgroups or All Newsgroups
    list.


    +   3. Choose a newsgroup you want to tag.


    +   4. Click Newsgroup, (Un)Tag.


    # To untag a newsgroup


    +   1. Follow steps 1 and 2 from the previous procedure.


    +   2. Choose a tagged newsgroup from the Subscribed Newsgroups or All Newsgroups
    list.


    +   3. Click Newsgroup, (Un)Tag.


    # To untag all newsgroups


    +   1. Follow steps 1 and 2 from the “To tag a newsgroup procedure.”


    +   2. Click Newsgroup, Tagged, (Un)Tag.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Tagging articles


    Tagging an article lets you refer to it later. A check mark icon appears beside
    a tagged article. You can also untag an article using the same button.


    # To tag or untag an article


    +   1. Choose an article from the article list in the Newsgroup window.

    2. Click the Tag Article button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_194_0.png)


    For information about opening newsgroups, see “Opening newsgroups” on page 178.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_194_1.png)


    You can also tag an article by clicking it. Untag the article by clicking it again.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_194_2.png)


    # Marking articles as read or unread


    By default, an article that you have read is displayed with a red dot beside it,
    and an article that you have not read has a green dot beside it. You can mark
    articles and tagged articles as read or unread.


    # To mark an article as read


    +   1. Choose an article from the article list in the Newsgroup window.

    2. Click the Mark Read button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_194_3.png)


    # To mark an article as unread


    +   1. Choose an article from the article list in the Newsgroup window.

    2. Click the Mark Unread button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_194_4.png)


    # To mark tagged articles as read


    In the Newsgroup window, click File, Tagged, Mark Read.


    # To mark tagged articles as unread


    In the Newsgroup window, click File, Tagged, Mark Unread.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '+   - For information about opening newsgroups, see "Opening newsgroups" on
    page 178.


    # Setting the article expiry


    You can specify how many days to keep an article in a newsgroup list after you
    have downloaded it from the server. You can set the article bodies (the full text
    of an article) to expire before the article header. You can retrieve the article
    body as long as the article header remains on the newsgroup.


    # To set the article expiry


    +   In the Group List window, click Options, Expire Options.


    +   Type the number of days to wait before expiry beside any of the following:

    - Article Bodies Read

    - Article Bodies Unread

    - Article Headers Read

    - Article Headers Unread


    The default expiry for each type of article is five days.


    For information about accessing the Group List window, see "Using news servers"
    on page 176.


    # Locking articles


    You can lock an article to prevent it from expiring. A newsgroup article that
    is locked is displayed in the newsgroup article list with a lock icon beside it.
    You can lock all the tagged articles. You can also unlock articles.


    # To lock an article


    +   Choose an article from the article list in the Newsgroup window.


    +   Click the Lock button.


    # To lock tagged articles


    +   - In the Newsgroup window, click File, Tagged, Don''t Expire.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# To unlock an article

    1 Choose a locked article from the article list in the Newsgroup window.

    2 Click the Lock button.


    +   - For information about opening newsgroups, see “Opening newsgroups” on page
    178.


    # Setting printing options


    You can set options for printing articles from a newsgroup. You can print using
    HTML printing or direct (standard) printing. If you choose direct printing, you
    can specify the printer, and you can print in text, HTML, or PostScript format.


    # To set printing options options


    +   1 In the Group List window, click Options, Printing Options.

    2 Enable one of the following buttons:

    - Use HTML Printing

    - Use Direct Printing

    3 In the Print Using box, type the name of your printer.

    4 In the Feed it With box, choose one of the following printing formats:

    - PostScript

    - HTML

    - Text


    +   - The default printing system is direct printing, and the default direct printing
    setting uses the default printer in text format.


    +   - For information about printing, see “Managing printing and fonts in Core
    LINUX” on page 279.


    +   - For information about accessing the Group List window, see “Using news servers”
    on page 176.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Setting viewing options


    You can customize the article list in the Newsgroup window to display only the
    articles you have not read, articles that are cached, or articles that are only
    locked. An article is cached after you read it, when you lock it, or when you
    tag it.


    # To display only unread messages


    +   - In the Newsgroup window, click Options, Show Only Unread Messages.


    # To display only cached messages


    +   - In the Newsgroup window, click Options, Show Only Cached Messages.


    # To display only locked messages


    +   - In the Newsgroup window, click Options, Show Locked Messages.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_197_0.png)


    +   - For information about opening newsgroups, see “Opening newsgroups” on page
    178.


    # Saving articles


    You can save an article in a directory on your computer or in the Core LINUX system.
    You can also save all tagged articles at the same time.


    # To save an article


    +   1 Choose an article from the article list in the Newsgroup window.


    +   2 Click File, Save.


    +   3 Double-click the directory or folder in which you want to save the text
    file.


    +   4 Type the name of the text file in the Location box.


    +   5 Click Save.


    # To save all the tagged articles


    +   1 Choose an article from the article list in the Newsgroup window.


    +   2 Click File, Tagged, Save.


    +   3 Double-click the directory or folder in which you want to save the text
    file.'
  merge: -1
  img_proc: true
