- pgno: 110
  md: '![](img/86803f2a30e88fe6e62989f0fe100a53_110_0.png)


    # # Managing Corel LINUX systems 6


    **Corel LINUX and the role of the system administrator**


    The system administrator, called the root user in Linux, is responsible for maintaining
    the system and managing the users. The root account is created automatically during
    the installation of Corel LINUX. By logging in to your computer as the root user,
    or system administrator, you have unlimited privileges; you can add and delete
    user accounts, change user privileges, access all files, and configure Corel LINUX.
    As the root user, there are no restrictions on the functions you can perform to
    the operating system. You can also inadvertently damage the system when you are
    logged in the root user. For more information about using the root account, see
    “Using the root account” on page 103.


    Corel LINUX provides system administration utilities that let the root user create,
    configure, and delete user and group accounts, change permissions and ownerships
    for files and directories, view system log files and device information.


    The User Manager lets you add and remove user accounts or groups, add and remove
    users from groups, change user passwords, and edit account profile information.
    The Event Viewer views you log files that describe the activities of system facilities,
    such as daemon, printer, kernel, or printer'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'facilities. You can customize viewing filters to display facilities and message
    priorities. You can also save and clear log files. The Control Center lets you
    view system device information. This function is read-only, but provides status
    information on devices such as DMA channels, interrupts, IO ports, memory, partitions,
    and Samba status.


    Core LINUX is a versatile operating system that can be used with network, multiuser,
    and stand-alone systems. Although these systems have different purposes and capabilities,
    they all need a user who acts as the system administrator. This system administrator
    is a user who oversees and manages the system to ensure that it operates properly
    and efficiently.


    # Stand-alone systems


    You can use Core LINUX as the operating system for a stand-alone computer. A stand-alone
    computer is not connected to a network and is accessed by only one user, who must
    also act as the system administrator. There are some system management tasks that
    you can perform when logged in as the root user, such as installing, updating,
    and removing applications from the system. Because you can inadvertently damage
    the system when logged as the root user, it is important that you set up a regular
    user account that you can access when you are finished doing system administration
    functions.


    # Multiuser systems


    A multiuser system is one in which more than one user has access to the same stand-alone
    computer. Each user has a separate user account, so that certain files or directories
    are off-limits to certain users. For example, a family computer can be set up
    as a multiuser system. The adults can have unlimited access to the computer, including
    access to work- business-related files and applications. The children, on the
    other hand, might have limitations placed on their access to the family computer.
    The children might be given access to only certain applications, or access to
    a limited number of files or directories.


    # Network systems


    You can use Core LINUX as a network operating system. A network is a group of
    two or more computers that are linked together. The system administrator has the
    task of maintaining and watching over all aspects of the system, including its
    hardware, connections, applications, and users. The network system administrator
    is also responsible for adding and deleting users, removing files and directories,
    controlling the permissions for files and directories, ensuring that the system
    operates as efficiently as possible. Because networks can have many users, system
    security is very important.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'The system administrator is responsible for system security of files, directories,
    applications, and user accounts.


    # Using the root account


    In general, the root account belongs to the system administrator. The root account
    is sometimes also called the super user. As the root user, you can read, modify,
    or delete any files on the system, and change permissions and ownerships of any
    file or directory.


    Logging in the system using the root account lets you have system privileges that
    other users do not have. There are no security restrictions on the root account,
    so therefore you might inadvertently make changes that have serious ramifications
    for the operating system and its users. You can decrease the risk of damaging
    the system by logging out of the root account as soon as you complete a task.


    Using the root account, you can


    +   - manage system users and groups

    - set permissions and ownerships for files and directories

    - view system information

    - install, update, and remove applications from the system

    - abort all system processes


    Even if you are the only user on the system, you should set up a different account
    that you can use when not performing administration functions. Log in to the root
    account only when it is necessary to perform system administration duties.


    # Accessing the root account


    As a regular user, you can log in to the root account if you need to perform system
    administration functions. You must know the root user account password. Access
    the root account only to perform system administration functions, and log out
    as soon as you complete the task.


    # To log in to the root account


    +   - Start Corel LINUX.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '2 Choose root (Administrator) from the User Name list box, and click the Login
