    # Replying to and forwarding newsgroup articles


    You can reply to an article to a newsgroup by sending a private email to the author
    of the article. You can also forward an article by email.


    # To reply by email to an article


    +   1 Choose an article from the article list in the Newsgroup window.


    +   2 Click the Reply By Mail button.


    +   3 Type a reply message in the Newsgroup Mail Window.


    +   4 Click the Send Message button.


    # To forward an article


    +   1 Choose an article from the article list in the Newsgroup window.


    +   2 Click the Forward button.


    +   3 In the Newsgroup Mail Window, type an email address in the To box.


    +   4 Click the Send Message button.'
