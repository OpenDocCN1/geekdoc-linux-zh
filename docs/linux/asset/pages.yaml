    # Customizing shortcut icons on the desktop


    The icons displayed on your desktop are shortcuts to applications and directories.
    Shortcuts let you open directories, open files, and start applications from the
    desktop. When you install Corel LINUX, the installer places icons on your desktop
    that link to the following directories and applications (some editions of Corel
    LINUX may include other icons):


    +   * Trash (directory)


    +   * My Home (directory)


    +   * Printer (application)


    +   * CD-ROM (directory)


    +   * Floppy (directory)


    You can add shortcut icons to the desktop, or remove them. You can change the
    icon that represents the shortcut. You can move shortcut icons around on the desktop,
    or set the spacing between the icons. You can customize the background color and
    text color of shortcut icons.


    You can add shortcut icons to the desktop using Corel File Manager by copying,
    moving, or linking the file, directory or application to the desktop. For information
    about creating desktop shortcuts from Corel File Manager, see “Creating a desktop
    link to a directory or file” on page 153, or “Creating a shortcut to an application”
    on page 154.


    # Creating a shortcut on the desktop


    You can place shortcuts to applications on the desktop. You can create a shortcut
    from the desktop or from an application.


    # To create a shortcut from the desktop


    +   1 Right-click the desktop.


    +   2 Choose New, and click Nickname.


    +   3 Type a nickname for the application in the Nickname box.


    +   4 Type the path and filename that you are creating the nickname for the Target
    box.'
