- pgno: 202
  md: '# Working with text 10


    Text Editor lets you create and edit ASCII text files. You can use Text Editor
    as a basic word processor to create plain text documents, or as a programmer''s
    editor when working with code.


    Text Editor lets you perform basic editing tasks. You can cut, copy, and paste
    text. You can undo one action or a series of actions. You can also redo a command
    that you have undone. Text Editor provides a Find and Replace feature that lets
    you find and replace characters, words, or phrases. Text Editor also lets you
    open your Windows text files.


    You can use Text Editor with Corel File Manager to browse text files or as a programmer''s
    editor to edit source files. Text Editor displays programming syntax for several
    programming languages. The programming languages include shell scripts, C, C++,
    Java, HTML, Modula 2, Ada, Python, and Perl. Text Editor displays programming
    syntax in color. Colored syntax lets you distinguish different languages and different
    programming syntax items from one another. Color coded programming syntax makes
    it easier to write and edit code by helping you identify different types of instructions
    in programming languages.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# # Starting Text Editor


    You can use Text Editor for your basic word processing needs or to edit programming
    code.


    # ## Starting Text Editor


    You can start Text Editor at any time.


    # ### To start Text Editor


    +   - Click Application Starter, Applications, Utilities, Text Editor.


    # ## Creating and opening text files


    Text Editor lets you create text files or open text files that are saved on your
    system or the network. You can create a text file in the active Text Editor window,
    or open a a new window for your text file. A new view lets you open a new window
    of your active text file.


    # ## Creating text files


    Text Editor lets you create a text file. You can also open a new window or a new
    view. A new window opens a new Text Editor. A new view opens a copy of the text
    file that you are working in.


    # ### To create a text file


    +   - Click File, New.


    You can also create a text file by clicking the New button on the toolbar.


    # ### To open a new window


    +   - Click File, New Window.


    You can also open a new window by clicking the Text Editor icon on the Panel.


    # ### To open a new view of the same file


    +   - Click File, New View.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Opening text files


    Text Editor lets you open a text file that is saved on your system or on a network,
    or a recently edited file. You can also open a text file from another application,
    for example a Microsoft Windows text file.


    # To open a text file


    +   1. Click File, Open.

    2. From the Look In list box, choose the directory where the text file is stored.

    3. Double-click the folder in which the text file is stored.

    4. Choose a file format from the File Type list box.

    5. Double-click the text filename.


    +   * You can also open a recently edited file by clicking the Open button on
    the toolbar.


    # To open a recently edited file


    +   1. Click File, Open Recent.

    2. Choose a file from the list of files.


    # Editing text files


    Text Editor lets you perform basic editing tasks. You can type or delete text,
    and cut, or copy selected text to store it in the buffer. You can paste text from
    the buffer to the active text file, another text file, or another application.
    The contents of the buffer are available until you cut or copy other text.


    You can undo one action or a series of actions. You can also redo a command that
    you have undone.


    You can search for phrases, words, or characters in a text file. You can edit,
    replace, or delete the text you find.


    # Typing and deleting text


    Text Editor lets you type and delete text.


    # To type text


    +   1. Click the Text Editor window.

    2. Type text.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# To delete text


    +   1 Position the cursor in front of the text you want to delete.

    2 Hold down DELETE until the text is deleted.


    +   * You can also delete text by positioning the cursor after the text you want
    to delete and holding down BACKSPACE until the text is deleted.


    # Selecting and deselecting text


    You can select and deselect characters and words. Selecting lets you edit the
    text.

    For text editing, you can invert a text selection. Inverting a text selection
    lets you deselect the selected text, and select the unselected text.


    # To select text


    +   * Click and drag across the text you want to select.


    # To select all text


    +   * Click Edit, Select All.


    # To deselect all selected text


    +   * Click Edit, Deselect All.


    # To invert the text selection


    +   * Click Edit, Invert Selection.


    # Cutting, copying, and pasting text


    You can cut text from a text file. You can also move text by cutting and pasting
    it to another location, or by copying pasting it. Cut or copied information is
    stored in the buffer. You can paste the text from the buffer to the active file,
    another text file, or another application. The contents of the buffer are available
    until you cut or copy other text.


    # To cut text


    +   1 Select the text you want to cut.


    +   2 Click Edit, Cut.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '+   - You can also cut text by selecting text and clicking the Cut button on
    the toolbar.


    # To copy text


    +   1 Select the text you want to copy.

    2 Click Edit, Copy.


    +   - You can also copy text by selecting text and clicking the Copy button on
    the toolbar.


    # To paste text


    +   1 Position the cursor where you want to insert text.

    2 Click Edit, Paste.


    +   - You can also paste text by positioning the cursor where you want to insert
    text and clicking the Paste button on the toolbar.


    # Undoing and redoing actions


    You can undo one action or a series of actions. You can also redo commands that
    you have undone.


    # To undo actions


    +   - Click Edit, Undo.


    +   - You can also undo actions by clicking the Undo button on the toolbar.


    # To redo actions


    +   - Click Edit, Redo.


    +   - You can also redo an action by clicking the Redo button on the toolbar.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Finding and replacing text


    You can find characters, words, or phrases in a text file. The Find and Replace
    feature is useful when you want to edit or delete specific words and phrases from
    your text. You can also find and replace all occurrences of specified text in
    a text file.


    # To find text


    +   - Click Edit, Find.

    - In the Text To Find box, type the text you want to find.


    # To find the next occurrence of the text


    +   - Click Edit, Find Again.


    # To find and replace text


    +   - Click Edit, Replace.

    - In the Text To Find box, type the text you want to find.

    - Type the replacement text in the Replace With box.

    - Click Yes in the Replace This Occurrence dialog box.


    # To find and replace all occurrences of the specified text


    +   - Follow steps 1 to 3 from the previous procedure.

    - Click All in the Replace This Occurrence dialog box.


    # Navigating in text files


    Text Editor allows you to navigate to a specific location in a text file using
    the Goto Line. You can also bookmark a specific location on a line, and return
    to that location using the bookmark.


    # Navigating the Goto Line


    Goto Line lets you navigate to a specific line in a text file.


    # To navigate to a line using the Goto Line


    +   - Click Edit, Goto Line.

    - Type a line number in the Goto Line box.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'You can set, add, and clear bookmarks in Text Editor. Setting a bookmark lets
    you choose a number between 1 and 9 for that bookmark location. Adding a bookmark
    takes the next number between 1 and 9 that is available. When you set and add
    bookmarks they appear in the bottom section of the Bookmarks menu. Clearing bookmarks
    removes all bookmarks from the text files.


    # To set a bookmark


    +   1 Click Bookmarks, Set Bookmark.

    2 Choose a number for your bookmark from the Numbers list.


    # To add a bookmark


    +   1 Click in the text where you want to add a bookmark.

    2 Click Bookmarks, Add Bookmark.


    # To access a bookmark


    +   1 Click Bookmarks.

    2 Choose a bookmarked line.


    # To clear all bookmarks


    +   * Click Bookmarks, Clear Bookmarks.


    # Saving and closing text files


    When you are finished working with a text file, you can save and close it. Text
    Editor lets you name the text file and choose a location where you want to save
    the file. You can change the filename and location when you save the text file
    again by using the Save As command.


    # Saving text files


    The first time you save a text file, Text Editor lets you name the text file and
    choose a location where you want to save the file. You can change the filename
    and file location when you save the text file again using the Save As Command.


    # To save a text file for the first time


    +   1 Click File, Save.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '2 Choose a directory from the Look In list.

    3 Double-click the folder in which you want to save your text file.

    4 Type a filename in the File Name box.

    5 Click Save.


    # To save an active text file


    +   * Click File, Save.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_209_0.png)


    +   * You can also save a text file by clicking the Save button on the toolbar.


    # To save a text file to a new location or with a different filename


    +   1 Click File, Save As.

    2 Follow steps 2 to 5 from the “To save a text file for the first time"

    procedure.


    # Closing text files


    When you are finished working with a text file, you can close it. If you have

    not saved the text file a message appears asking if you would like to save

    your file.


    # To close a text file


    +   * Click File, Close.


    # Formatting text files


    Text Editor lets you format text files. You can set and change margins, set

    and replace tabs, indent text, unindent text, auto indent, and backspace

    indent text. You can also automatically insert brackets into a text file.


    Text Editor also has select options that let you keep specific areas

    while you continue working in a text file, select several pieces of text at

    once, select text vertically, and delete selected text.


    # Setting and changing margins


    Text Editor lets you set margins by specifying the number of characters and

    spaces that a line contains. For example, you can specify that a line can

    contain 50 characters. When you have more than 50 characters or spaces

    in a line, Text Editor wraps the next character or word to the line below. This'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'is helpful when you do not want to keep track of the length of a line. It also
    does not require you to press ENTER to go to a new line. You can change the margin
    size by changing the number of characters that a line contains.


    # To set or change a margin


    +   - Click Options, Preferences.

    - Type a number in the Wrap Wards At box.


    # Setting and replacing tabs


    Tabs let you indent a specified number of spaces in text. You can also use tabs
    to format lists by indenting items to improve readability. Text Editor lets you
    set and replace tabs for your text files.


    # To set a tab


    +   - Click Options, Preferences.

    - Type a number in the Tab Width box.


    # To replace a tab


    +   - Click Options, Preferences.

    - Type a new number in the Tab Width box.

    - Enable the Replace Tabs check box.


    # Indenting and unindenting text


    You can indent one line or multiple lines of text, and unindent the indented text.
    You can also have Text Editor automatically indent text in the beginning of a
    line and go back to previous indents on a line. This is particularly helpful for
    when you are programming code or creating a list. The width of the indent is dependent
    on the Tab Width you have chosen. When you indent text, the indents are character
    spaces.


    # To indent a line of text


    +   - Position the cursor at the beginning of a line of text.

    - Click Edit, Indent.


    # To indent multiple lines of text


    +   - Select the text you want to indent.

    - Click Edit, Indent.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# To unindent a line of text


    +   1 Position the cursor in an indented line of text.

    2 Click Edit, Unindent.


    # To unindent multiple lines of text


    +   1 Select the indented text.

    2 Click Edit, Unindent.


    # To automatically indent text at the beginning of a line


    +   1 Click Options, Preferences.

    2 Enable the Auto Indent check box.

    3 Press TAB to indent a line.


    # To automatically backspace to previous indents on a line


    +   1 Click Options, Preferences.

    2 Enable the Backspace Indent check box.

    3 Indent the text that you want.

    4 Press ENTER, and Press BACKSPACE.


    # Selecting text


    Editor includes selecting text options to maintain specific text selected in a
    text file, select multiple pieces of text at once, select text vertically, and
    delete selected text. If you are working with code or editing a piece of text,
    you might want the selected area to remain selected or have multiple pieces of
    text selected at once. If you are working with columns, you can select text vertically.


    # To maintain text selection


    +   1 Click Options, Preferences.

    2 Enable the Persistent Selections check box.


    # To select multiple portions of text


    +   1 Click Options, Preferences.

    2 Click Persistent Selections.

    3 Enable the Multiple Selections check box.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'To select text vertically

    1 Click Options, Preferences.

    2 Enable the Vertical Selections check box.


    To delete selected text

    1 Click Options, Preferences.

    2 Enable the Delete On Input checkbox.

    3 Press DELETE.


    # Inserting brackets in a text file


    You can automatically insert a set of brackets in a text file. This is useful
    if you are writing programming code.


    # To insert brackets automatically


    +   1 Click Options, Preferences.

    2 Enable the Auto Brackets check box.

    3 Press one of the following keys:

    * {

    * [

    * (


    # Customizing fonts and text


    Text Editor lets you customize font appearance. You can change the font type and
    size. You can also change the color of normal text and selected text.


    When working with programming code, you can choose different colors for different
    syntax items. For example, if you are working with C++ code, you can specify different
    colors for C++ normal text, keywords, comments, Hex numbers, string text, and
    other C++ syntax items. You can choose different colors for selected and unselected
    items.


    You can choose a preset color or a custom color from the palette.


    # Changing font settings


    You can change the font type and size.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# To change the font


    +   1 Click Options, Default Style.

    2 Choose a font from the Family list.


    # To change the size of the font


    +   1 Click Options, Default Style.

    2 Choose a font size from the Size list box.


    # Choosing the color of text and selected text


    Text Editor lets you choose different colors for selected and unselected text.
    You can choose a preset color from the System Colors section, or a custom color.
    You can choose a custom color by using the color picker or you can type numeric
    quantities to specify the color''s hue, saturation, and value. You can also type
    numbers to control the amount of red, green, and blue in the custom color.


    # To choose the color of text


    +   1 Click Options, Default Style.

    2 In the Item section, click the Normal button.

    3 In the System Colors section, click a color.


    # To choose a custom color for text


    +   1 Follow steps 1 and 2 from the previous procedure.

    2 In the Custom Colors section, click a gray box.

    3 Do one of the following:

    - drag the color picker over the palette

    - type values to change the hue, saturation, value, red quality, green quality,
    or blue quality in the color


    +   4 Click the Add To Custom Colors button.


    # To choose the color of selected text


    +   1 Click Options, Default Style.

    2 In the Item section, click Selected.

    3 In the System Colors section, click a color.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# To choose a custom color for selected text


    +   1 Follow steps 1 and 2 from the previous procedure.


    +   2 In the Custom Colors section, click a gray box.


    +   3 Do one of the following:

    * drag the color picker over the palette

    * type values to change the hue, saturation, value, red quality, green quality,
    or blue quality in the color


    +   4 Click the Add To Custom Colors button.


    # Choosing colors for programming code


    Editor lets you choose colors for syntax items in programming code. For example,
    if you are working with C++ code, you can set different colors for C++ normal
    text, keywords, Hex numbers, and string text. You can also choose different colors
    for selected and unselected items.


    You can choose a color from the System Colors section, or you can choose a custom
    color. You can choose a custom color by using the color picker, or you can type
    values to specify the color''s hue, saturation, and value. You can also type values
    to specify the amount of red, green, and blue in a custom color.


    # To choose a color for a syntax item


    +   1 Click Options, Highlight Style.


    +   2 Choose a programming language from the Highlight list box.


    +   3 Choose a syntax item type from the Item list box.


    +   4 In the Item Style section, click the Normal button.


    +   5 In the System Colors section, click a color.


    # To choose a custom color for a syntax item


    +   1 Follow steps 1 to 4 from the previous procedure.


    +   2 In the Custom Colors section, click a gray box.


    +   3 Do one of the following:

    * drag the color picker over the palette

    * type values to change the hue, saturation, value, red quality, green quality,
    or blue quality in the color


    +   4 Click the Add To Custom Colors button.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# To choose a color for a selected syntax item


    1 Follow steps 1 to 3 from the “To choose a color for a syntax item” procedure.


    2 In the Item Style section, click the Selected button.


    3 In the System Colors section, click a color.


    # To choose a custom color for a selected item


    1 Follow steps 1 to 3 from the “To choose a color for a syntax item” procedure.


    2 In the Item Style section, click the Selected button.


    3 Click a gray box in the Custom Colors section.


    4 Do one of the following:


    +   - drag the color picker over the palette


    +   - type values to change the hue, saturation, value, red quality, green quality,
    blue quality in the color


    5 Click the Add To Custom Colors button.


    # Printing text files


    Text Editor provides printing options for your text file. You can print to a printer
    or a file. To print to a printer, you must select and properly configure the printing
    device driver before you print. For information about setting up a printing device
    see “Setting up printers” on page 279. You can also choose the size and orientation
    of a text file before printing. Text Editor lets you choose from several preset
    sizes. Orientation lets you choose between Portrait and Landscape. Portrait orientation
    prints with the long side of the paper at the top, and the information appears
    sideways on the paper.


    Text Editor printing options also include choosing a print range, the number of
    copies, and whether to print the first page or the last page. If you have a color
    printer configured for your system, you can also print a text file in color.


    # Printing text files


    If your printer is properly configured, you can print a text file without changing
    the default settings. For information about setting up a printing device see “Setting
    up printers” on page 279.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# To print a text file


    +   - Click File, Print.


    # Choosing a printing method


    You can print a text file on any printer that is configured on your system or
    the network. You can also print to a file. Printing to a file is useful when you
    want to access the file from another system, let different users access the file,
    or preview the file before printing it. The file is saved as a PostScript file.


    # To print to a printer


    +   1 Click File, Print.

    2 Enable the Print To Printer button.

    3 Choose a printer from the Print To Printer list box.


    # To print to a file


    +   1 Click File, Print.

    2 Enable the Print To File button.

    3 Click the Browse button.

    4 Choose a folder where you want to save the text file.

    5 Type a filename in the File Name box.

    6 Click the Save button.


    # Specifying the pages to print


    You can set up the print job so that only some or all the pages in a text file.
    You can also choose to print the first page first or the last page first. When
    you print the last page first the text file is printed in reverse order.


    # To print all pages


    +   1 Click File, Print.

    2 In the Options section, enable the Print All button.


    # To print specific pages


    +   1 Click File, Print.

    2 In the Options section, click the Print Range button.

    3 Specify the pages you want to print.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# To choose the printing order


    1 Click File, Print.


    2 Choose one of the following:


    +   * Print First Page First — lets you print the first page of a text file

    * Print Last Page First — lets you print the last page of a text file


    # Printing multiple copies


    You can print multiple copies of the same text file.


    # To print multiple copies


    1 Click File, Print.


    2 Type the number of copies in the Number Of Copies box.


    # Specifying page size and paper orientation


    Text Editor includes preset page sizes to print your text file. You can choose
    from the North American standards of Letter, Legal, and Executive; or the European
    standards of A4 and B5. You can also set the paper orientation of a text file
    as portrait or landscape.


    # To specify a page size


    1 Click File, Print.


    2 From the Paper Format section, enable one of the following buttons:


    +   * A4 (210 x 297 mm)

    * B5

    * Letter (81/2 x 11in)

    * Legal

    * Executive


    # To specify a paper orientation


    1 Click File, Print.


    2 From the Paper Format section, enable one of the following buttons:


    +   * Portrait — lets you print a page whose height is greater than its width

    * Landscape — lets you print a page rotated 90 degrees from the Portrait orientation,
    where the long edge of the page is horizontal.'
  merge: -1
  img_proc: true
- pgno: 218
  md: "# Printing text files in color or grayscale\n\nText Editor lets you print a\
    \ text file in color or grayscale. Printing a text file in color can be helpful\
    \ when you are trying to differentiate specific text in a file. However, printing\
    \ in color slows down printing speed.\n\n# To print in color or grayscale\n\n\
    +   1 Click File, Print.\n2 From the Options section, enable one of the following:\n\
    \   * Print In Color If Available — lets you print text files in color, if a color\
    \ printer is configured on your system\n   * Print In Grayscale — lets you print\
    \ text files in grayscale"
  merge: -1
  img_proc: true
- pgno: 219
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 220
  md: '![](img/86803f2a30e88fe6e62989f0fe100a53_220_0.png)


    # # Working with graphics 11


    You can use the graphic applications available with Corel LINUX to view image
    files, view PostScript and Adobe Acrobat Portable Document Format (PDF) files,
    and create screen captures. The following table outlines the graphic applications
    available with Corel LINUX and the functionality that each application provides.


    | Application... | Function... |

    |---|---|

    | Image Viewer | lets you view and edit image files. Image Viewer lets you send
    images to the desktop as backgrounds. You can also create a slide show of images.
    |

    | PS Viewer | lets you view and print PostScript and PDF documents |

    | Screen Grab | lets you create screen captures of an application or window open
    on your desktop or the entire desktop. You can save the captured images in different
    file formats |


    # # Working with image files


    Image Viewer lets you open and view image files. You can customize functions within
    the application, such as, keyboard shortcuts. You can also transform, crop, or
    filter images. Use the Image Viewer to display images on the desktop or create
    an image slide show. When you finish working with the image, you can save and
    print the file. Use the Close command to close the


    Working with graphics 211'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'current image window and use the Exit command to close the Image Viewer application.


    # Opening and saving image files in Image Viewer


    You can use Image Viewer to open images from an FTP or Web server, from an archive
    remote server. For more information about servers, see the Corel LINUX Server
    Administrator Guide or the online Help. Image Viewer supports many different file
    formats including GIF, JPEG, PNG, BMP, TIFF, XBM and XPM, PBM (P1), PPM (P2),
    PPM (P3), PBMRAW (P4), PGMRAW (P5), and PPMRAW (P6).


    When you finish working with an image file, make sure that you save the changes.


    # Opening image files


    You must start Image Viewer before you can access image files. You can open an
    image file on your Corel LINUX system or from an FTP or Web server. For more information
    about servers, see the Corel LINUX Server Administrator Guide. Image Viewer also
    lets you open archived image files.


    You can open multiple image files or you can open multiple Image Viewer windows
    to work on several images simultaneously.


    # To start Image Viewer


    +   - Click Application, Applications, Graphics, Image Viewer.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_221_0.png)


    # To open an image file


    I Click File, Open.


    +   2 From the Look In list box, choose the directory where the image file is
    stored.


    +   3 Double-click the folder in which the image file is stored.


    +   4 Double-click the image filename.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_221_1.png)


    +   - Repeat the “To open an image file” procedure to open multiple image files.
    The Title Bar displays the name of the active image file.


    +   - If you open an image from the Web, ensure that you include the entire URL
    path and filename.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '+   - If you have multiple image files open, you can switch between them by
    clicking Images, Next, to switch to the next open image. Click Images, Previous,
    to navigate back through the list of open images.


    # To open multiple image windows


    +   1 Click File, New Window.

    2 Repeat step 1 to open as many new image windows as you require.


    # Saving image files


    When you edit image files, you must save the changes before you close the window
    or exit Image Viewer. Image Viewer does not prompt you to save changes before
    closing or exiting the application. You must save changes to an image file before
    using the file in a slide show, otherwise the changes do not display.


    You can save an image file with a new filename, however if a file already exists
    in your working directory with that filename, it will be overwritten with the
    new image file if you have write permission on the original file.


    You can save files in directories only for which you have write permissions. For
    information about file and directory permissions, see "Setting permissions and
    ownerships" on page 113.


    # To save an image file


    +   1 Click File, Save As.

    2 From the Look In list box, choose the directory where you want to store the
    image file.

    3 Double-click the folder where you want to store the image file.

    4 Type the filename in the File Name box.

    5 Type the file type, for example, .GIF, in the File Type box.


    # Printing image files in Image Viewer


    You can print an image file to a printer or a file. When you print an image file,
    you can specify printing options such as color, number of copies, and paper format.


    When you print a document to a file, the document and all the printing instructions
    are included in the file. The instructions included are based on the settings
    you choose from in the Print dialog box when you print to the file.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Printing to a printer


    You can print an image file to a printer. You must choose which printer to use
    if you have more than one printer installed on your system.


    # To print an image file


    +   1 Click File, Print.

    2 In the Print Destination section, enable the Print To Printer button.

    3 Choose a printer from the list.

    4 In the Options section, enable one of the following buttons:

    - Print First Page First

    - Print Last Page First

    5 Type the number of copies to print in the Number Of Copies box.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_223_0.png)


    +   - For information about other print options, see "Setting print options in
    Image Viewer" on page 215.


    # Printing to a file


    You can print an image to a file. This is useful if you do not have a printer
    attached to your computer, or if you want to print the document on a printer other
    than the one attached to your computer. For example, if your document will be
    printed by a service bureau, you can print it to a file, then deliver the file
    to the service bureau on a disk or as an email attachment. The file can then be
    printed from another computer.


    To prevent overwriting the original document when you print a document to a file,
    be sure the new file has a different name.


    # To print to a file


    +   1 Click File, Print.

    2 In the Print Destination section, enable the Print To File button.

    3 In the box, type the path and filename of the file that you want to print.

    You can click Browse to locate the directory where you want to save your print
    file.

    4 Specify print options.


    214 Corel LINUX User Guide: Chapter 11'
  merge: -1
  img_proc: true
- pgno: 224
  md: '* For information about print options, see “Setting print options in Image
    Viewer” on page 215.


    # Setting print options in Image Viewer


    Print options let you specify which pages, and the number of copies to print.
    You can also print in color or grayscale. You can print in color only if your
    printer supports color. Use the Paper Format settings to specify orientation and
    paper size.


    If you print to a file, the print options are saved with the file.


    # To print a range of pages


    +   1 Click File, Print.


    +   2 In the Options section, enable the Print Range button.


    +   3 Type the number of the first page in the print range in the From Page box.


    +   4 Type the number of the last page in the print range in the To Page box.


    +   5 Enable one of the following buttons:


    +   * Print First Page First


    +   * Print Last Page First


    # To set the number of copies to print


    +   1 Click File, Print.


    +   2 In the Options section, type the number of copies to print in the Number
    Of Copies box.


    # To set print color


    +   1 Click File, Print.


    +   2 In the Options section, enable one of the following buttons:


    +   * Print In Color If Available


    +   * Print In Grayscale


    # To set the page orientation


    +   1 Click File, Print.


    +   2 In the Paper Format section, enable one of the following page orientations:'
  merge: -1
  img_proc: true
- pgno: 225
  md: '+   * Portrait — prints the image file across the width of the paper

    * Landscape — prints the image file sideways across the length of the paper


    # To set the paper size


    I Click File, Print.


    +   2 In the Paper Format section, enable one of the following paper sizes:

    * A4 (210 x 297 mm)

    * B5

    * Letter (8 ½ x 11 in)

    * Legal

    * Executive


    # Closing images and exiting Image Viewer


    When you finish viewing or editing an image file, you can exit Image Viewer. If
    you have more than one Image Viewer Application Window open, you can close a window
    without exiting the application. Image Viewer does not prompt you to save changes
    before you exit. Make sure you save any changes before you close a window or exit
    Image Viewer. For more information about saving a file, see “Saving image files”
    on page 213.


    # Closing image files


    Use the Close Window command to close all image files in the active Application
    Window without exiting Image Viewer. If you have only one Application Window open,
    the Close Window command also closes Image Viewer. Save the changes before you
    close the Application Window.


    # To close an image file


    +   * Click File, Close Window.


    Make sure the image file you want to close is located in the Application Window.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_225_0.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Exiting


    The Exit command closes all open Application Windows and ends the Image Viewer
    application. Make sure you save changes made to image files in all the Application
    Windows before exiting.


    # To exit Image Viewer


    +   - Click File, Exit.


    # Customizing Image Viewer


    Image Viewer lets you customize settings within the application. For example,
    you can configure key bindings for functions, such as rotating images, or you
    can set options that automatically adjust the size of the Application Window when
    you open an image. You can also use zoom to enlarge or reduce the viewing size
    of an image.


    You can customize the look of the Application Window by moving the Menu Bar. For
    information about moving the Menu Bar, see "Moving a menu bar and toolbar in a
    window" on page 70.


    # Configuring key bindings


    Image Viewer provides preset keyboard shortcuts, or key bindings, that let you
    perform actions, such as menu commands, using keystrokes. For example, you can
    zoom in on an image by pressing Z. You can customize key bindings by changing
    the keystrokes associated with an action. You can reset key bindings to restore
    the default keystrokes associated with the action. You can also disable key bindings
    associated with actions.


    When you configure key bindings, you can bind actions to one keystroke or a combination
    of keystrokes using the SHIFT, CONTROL, and ALT keys. Using combination keystrokes
    increases the number of keyboard shortcuts available.


    # To configure a key binding


    +   1 Click Edit, Preferences.

    2 Click the Keys tab, and choose the action to which you want to bind a keystroke.

    3 Enable the Custom Key button in the Choose A Key For The Selected Action section.

    4 Click the key button, and type the key you want to use as the shortcut.

    5 Click Apply.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_226_0.png)'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Key bindings that appear dimmed when selected cannot be changed.


    To bind actions to multiple keystrokes, enable one or more of the following check
    boxes: SHIFT, CTRL, ALT from the Choose A Key For The Selected Action section.


    # To reset key bindings


    +   1 Follow steps 1 and 2 from the above procedure.

    2 Enable the Default Key button.

    3 Click Apply.


    # To disable key bindings


    +   1 Follow steps 1 and 2 from the “To configure a key binding” procedure.

    2 Enable the No Key button.

    3 Click Apply.


    # Setting image display options


    You can set window and image sizing options to specify how an image is displayed
    in the Application Window when you open it or when you display it in a slide show.
    You must set image display options before you open an image or run a slide show.
    For information about running slide shows, see “Starting and stopping a slide
    show” on page 223.


    You can resize the Application Window to fit the size of the image, or use the
    resize Image option to resize the image to fit the size of the Application Window,
    while still maintaining the aspect ratio of the image. Disable image display options
    to view the image in the Application Window without resizing the image or window.


    # To set image display options


    +   1 Click Edit, Preferences.

    2 From the On Load section, enable one of the following buttons.

    * Resize Window

    * Resize Image

    * No Resize

    3 Click Apply.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'The zoom feature to enlarge or reduce the viewing size of images. For example,
    if you want to crop part of the image, you can zoom in to enlarge the image viewing
    area. You can zoom out when you finish cropping the image. Image Viewer lets you
    choose from several zoom options. You can set the magnification level of the zoom
    or you can use preset magnification levels. When you set the magnification level,
    you must enter a zoom factor. A zoom factor of 100 is the actual size of the image.


    # To set the zoom magnification level


    +   1 Click Zoom, Zoom.

    2 Type the magnification value in the Enter Zoom Factor box.


    # To zoom using preset magnification levels


    +   * Click Zoom, and click one of the following preset zoom levels:

    * Zoom In 10% — increases the magnification by increments of 10 percent

    * Zoom Out 10% — decreases the magnification by increments of 10 percent

    * Double Size — doubles the current magnification level

    * Half Size — reduces the current magnification level by 50 percent

    * Max Size — magnifies the image to the maximum screen size

    * Max/Aspect — magnifies the image to the maximum screen size and maintains the
    aspect ratio


    # Transforming, cropping, and filtering images in Image Viewer


    Image Viewer lets you transform images by rotating or flipping them. You can also
    crop an image to remove areas of the image, or you can apply various filters to
    adjust the color and smoothness of an image.


    # Transforming images


    You can transform images by rotating or flipping them. You can rotate images clockwise
    or counterclockwise at 90-degree intervals. Image Viewer lets you flip images
    vertically and horizontally.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# To rotate an image


    +   - Click Transform, and click one of the following rotation directions:

    - Rotate Clockwise

    - Rotate Anticlockwise


    # To flip an image


    +   - Click Transform, and click one of the following flip directions:

    - Flip Vertical

    - Flip Horizontal


    You can reset the image to its original orientation by clicking Edit, Reset.


    # Cropping images


    Using Image Viewer, you can crop images to remove areas of the image without affecting
    the resolution of the information that remains. Use Zoom to enlarge or reduce
    the viewing size of the image. Zoom helps you increase precision when you crop
    the image. For information about zooming, see “Zooming images” on page 219.


    # To crop an image


    +   - Drag to select the area of the image that you want to keep.


    The part of the image that displays outside the selected area is removed when
    cropped.

    2 Click Edit, Crop.


    # Filtering images


    You can adjust the brightness of an image to lighten or darken the colors. The
    gamma correct feature lets you identify details in a low-contrast image without
    significantly affecting the shadows or highlights of the image. Changing the gamma
    setting affects the light intensity of the image, however, because the effect
    is nonlinear, changes affect the midtones but still maintain the overall contrast.
    You can also change a color image to grayscale.

    nUse the smooth feature to soften the overall look of an image by rounding sharp
    edges.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# To set an image to grayscale


    +   - Click Filter, Greyscale.


    # To change image brightness


    1 Click Filter, Intensity, Brightness.


    2 Type the brightness factor in the Enter Brightness Factor (%) box.


    # To gamma correct an image


    1 Click Filter, Intensity, Gamma Correct.


    2 Type the gamma value in the Enter Gamma Value (>0) box.


    # To smooth an image


    +   - Click Filter, Smooth.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_230_0.png)


    +   - You can reset an image to its original color or smoothness setting by clicking
    Edit, Reset.


    # Setting images as the desktop background in Image Viewer


    You can set an image as the desktop background by sending the image to the desktop.
    Setting an image as the desktop background does not overwrite the current background.
    The current background reappears the next time you log in your Corel LINUX desktop.


    For information about setting an image as the default desktop background, see
    “Choosing desktop wallpaper” on page 52.


    # Sending images to the desktop


    Image Viewer lets you customize how an image displays when it is sent to the desktop.
    You can tile an image, or enlarge the image to fit the desktop. Enlarging an image
    changes its aspect ratio, unless you use the Desktop Maxsect option.


    # To send an image to the desktop


    +   - Click To Desktop, and click one of the following image display options:

    - Desktop Tile — tiles the image across the desktop'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Desktop Max — maximizes the image to fit the desktop


    Desktop Maxpect — enlarges the image to the maximum size and maintains its aspect
    ratio


    Sending an image to the desktop does not permanently replace the current desktop
    background. For information about replacing the desktop background with an image,
    see “Choosing desktop wallpaper” on page 52.


    # Creating an image slide show in Image Viewer


    Image Viewer lets you create a slide show of images. When you create a slide show,
    you must open each image file that you want to include in the slide show. You
    can shuffle the order of slide show images. You can also set the display time
    for the slide show. When you finish creating the slide show, you can run it.


    When you run the slide show, Image Viewer loads and sizes each slide according
    to the image display options you set. For example, you can display each image
    in its original size, you can have each image resized to fit the screen, or you
    can resize the Application Window to fit each image. For information about setting
    image display options, see “Setting image display options” on page 218.


    To view changes you make to images in the slide show, save changes before you
    run the slide show. For information about saving an image, see “Saving image files”
    on page 213.


    # Choosing and viewing slide show images


    You choose images by opening each image file in the order that you want the images
    to run in the slide show. Image Viewer maintains a list of all open images. You
    can view the list to make sure you selected all the images required for the slide
    show. You can also preview each image in the list.


    To choose slide show images


    +   1 Click File, Open.


    +   2 Choose the image file from the Open dialog box.


    +   3 Repeat steps 1 and 2 until all image files are open.


    To view the slide show image list


    +   - Click Images, List.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'To preview an image in the slide show list

    1 Click Images, List.

    2 Double-click the image you want to preview from the Image list.


    +   * Click Next to preview the next image in the slide show list. Click Prev
    to preview the previous image.


    # Shuffling slide show images


    You can change the order of slide show images by shuffling. Each time you shuffle
    the slide show list, Image Viewer randomly provides a new slide show order.


    # To shuffle slide show images


    +   1 Click Images, List.

    2 Click Shuffle.


    +   * Click Shuffle multiple times to continue changing the slide show order.


    # Setting the slide show display time


    You can set the length of time Image Viewer displays each image when you run the
    slide show. The slide interval time is set in seconds, for example, if you set
    the interval time to 10, each slide displays onscreen for 10 seconds.


    # To set the display time for slides


    +   1 Click Edit, Preferences.

    2 Click the Options tab.

    3 In the Slideshow section, type the number of seconds in the Slide Interval (sec)
    box.


    # Starting and stopping a slide show


    You can start and stop a slide show at any time. The slide show starts with the
    image that is displayed and continues through the image list. To start at the
    beginning, make sure the first image in the slide show list is displayed before
    you run the slide show. For information viewing the slide show image list, see
    “Choosing and viewing slide show images” on page 222.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'By default, the slide show runs in the Application Window. If you do not maximize
    the Application Window, the desktop displays in the background. This can be distracting
    to viewers watching the slide show. Running the slide show in Full Screen mode
    to hide the desktop and the Title, Menu, and Status Bar of the Application Window.


    You can display the slide show sequence once, or you can set the Loop option to
    automatically replay the slide show. You can also stop the slide show at any time.


    # To start a slide show


    +   - Click Images, Slideshow.


    +   - You can also start the slide show by right-clicking the image and clicking
    Slideshow On/Off.


    # To run a slide show in Full Screen mode


    +   1 Click Edit, Full Screen.


    +   2 Right-click the image and click Slideshow On/Off to start the slide show.


    +   - Full Screen mode overrides the Resize Window image display option. For more
    information about image display options, see “Setting image display options” on
    page 218.


    +   - Press F to exit Full Screen mode.


    # To loop a slide show


    +   1 Click Edit, Preferences.


    +   2 Click the Options tab.


    +   3 In the Slideshow section, enable the Loop check box .


    # To stop a slide show


    +   - Click Images, Slideshow.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Working with PS Viewer


    PS Viewer lets you preview documents prepared using the PostScript page description
    language. You can also use PS Viewer to read documents online. Linux and UNIX
    systems use the PostScript page description language for printing.


    PS Viewer also lets you view documents that conform to the Adobe document structuring
    conventions, such as Portable Document Format (PDF) files.


    You can change the way documents are displayed in PS Viewer. You can customize
    the Application Window and configure key bindings and options for the interpreter.


    PS Viewer provides tools to help you navigate your document. You can mark pages
    you want to print or use for future reference. When you finishing a document,
    you can print the file.


    # Opening and viewing files


    You can open and view PostScript or Adobe Acrobat PDF files. PS Viewer lets you
    access previously viewed files by storing the names of the last four files opened.
    When you view a document, you can change the page setup to suit your needs. You
    can also use the Zoom tools to enlarge or reduce the viewing size of the document.
    PS Viewer maintains summary information about each file, such as the path and
    filename, title, and creation date of the document.


    # Opening a file


    You must start PS Viewer before you can open PostScript or Adobe Acrobat PDF files.
    PS Viewer also tracks the last four files you opened so that you can reopen previously
    viewed files.


    By default, PS Viewer looks for files with .ps, .eps, or .pdf file extensions.


    # To start PS Viewer


    +   - Click Application Starter, Applications, Graphics, and click PS Viewer.


    # To open a file


    +   - Click File, Open.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '2 Type the path and filename of the document.


    Use the navigation buttons to locate files outside your working directory.


    +   - You can open a file by clicking the Open button on the toolbar.


    # To open a previously viewed file


    +   - Click File, and select the name of the file from the entries available at
    the bottom of the File menu.


    # Changing the page setup


    PS Viewer lets you override page size and orientation settings determined by the
    document structuring conventions of the file. Use the page setup options to customize
    your document displays and prints. For example, you can change the page orientation
    from portrait to landscape.


    # To change paper size


    +   1 Click File, Page Setup.


    +   2 Choose a page size from the Media list box.


    # To change page orientation


    +   1 Click Files, Page Setup.


    +   2 Choose one of the following page orientation settings:


    +   - Portrait — prints content across the width of the paper

    - Landscape — prints content sideways across the length of the paper

    - Seascape — rotates the landscape orientation in the opposite direction

    - Upside Down — flips the portrait orientation upside down


    # Zooming a file


    You can change the view of your document using zoom. Changing the zoom level lets
    you enlarge or reduce the viewing size on your document.


    # To increase the zoom level


    +   - Click View, Zoom In.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '• You can also zoom in by clicking the Zoom In button on the toolbar.


    # To decrease the zoom level


    +   • Click View, Zoom Out.


    • You can also zoom out by clicking the Zoom Out button on the toolbar.


    # Viewing information about a file


    PS Viewer maintains file information, such as path and filename, title of document,
    and document creation date. You can view this information for any open file.


    # To view file information


    +   • Click View, Info.


    # Customizing PS Viewer


    You can customize the Application Window. For example, you can change the location
    of the toolbar, Menu Bar, or Page List. You can also hide the toolbar, Status
    Bar, and Page List. For information about changing the location of the toolbar
    or Menu Bar, see "Moving a menu bar and graphics in a window" on page 70.


    This illustration displays the following areas of the PS Viewer Window:

    1) Menu Bar

    2) Toolbar

    3) Page List

    4) Viewing window

    5) Status Bar


    ![](img/86803f2a30e88fe6e62989f0fe100a53_236_0.png)


    Key bindings are keyboard shortcuts that let you perform actions, such as menu
    commands, using keystrokes. PS Viewer lets you to configure, or change key bindings
    for functions.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'PS Viewer uses an interpreter to translate the page description language or
    document structuring conventions used with PostScript or PDF files. You can configure
    interpreter settings for items such as the color palette.


    # Displaying toolbars and page lists


    You can hide or display the toolbar, Status Bar, and Page List. You can also move
    the toolbar and Menu Bar to different areas of the Application Window. For information
    about moving the toolbar and Menu Bar, see “Moving a menu bar and toolbar in a
    window” on page 70. When you finish customizing the Application Window, you can
    save your new options. For information about saving customization options, see
    “Saving customization settings” on page 230.


    # To display toolbars


    +   - Click Options, and click one of the following options:

    - Show Status Bar

    - Show Status Bar


    You can hide toolbars by clicking Options, and clicking Show Toolbar or Show Status
    Bar again.


    # To display the page list


    +   - Click Options, Show Page List.


    A check mark beside the menu item indicates that the item is activated.


    # Configuring key bindings in PS Viewer


    PS Viewer provides preset keyboard shortcuts, or key bindings, that let you perform
    actions, such as menu commands, using keystrokes. For example, you can change
    the zoom of a document by pressing CTRL + L. You can customize key bindings by
    changing the keystrokes associated with an action. You can reset key bindings
    to restore the default keystrokes associated with the action. You can also disable
    key bindings that are currently associated


    When you configure key bindings, you can bind actions to one keystroke or a combination
    of keystrokes using the SHIFT, CTRL, and ALT keys. Using'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'combination keystrokes increases the number of keyboard shortcuts available.


    # To configure a key binding


    +   1 Click Options, Configure Key Bindings.


    +   2 Enable the Custom Key button from the Choose A Key For The Selected Action
    section.


    +   3 Click the key button, and type the key you want to use as the shortcut.


    +   4 Click Apply.


    +   * Key bindings that appear dimmed when selected cannot be changed.


    +   * To bind actions to multiple keystrokes, enable one or more of the following
    check boxes: SHIFT, CTRL, ALT from the Choose A Key For The Selected Action section.


    # To reset key bindings


    +   1 Click Options, Configure Key Bindings.


    +   2 Enable the Default Key button.


    +   3 Click Apply.


    # To disable key bindings


    +   1 Click Options, Configure Key Bindings.


    +   2 Enable the No Key button.


    +   3 Click Apply.


    # Configuring the interpreter


    You can configure the interpreter settings that PS Viewer uses. For example, you
    can change the rendering options from color to grayscale. You can also restore
    the default interpreter settings.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# To change the interpreter name


    +   1 Click Options, Configure Interpreter.


    +   2 In the General section, type the name of the interpreter in the Interpreter
    Name box.


    # To change the palette settings


    +   1 Click Options, Configure Interpreter.


    +   2 Enable one of the following buttons:

    * Color

    * Grayscale

    * Monochrome


    # To restore default interpreter settings


    +   1 Click Options, Configure Interpreter.


    +   2 Click Defaults.


    # Saving customization settings


    You can save customization settings so that PS Viewer always displays the Application
    Window with your settings.


    # To save customization settings


    +   * Click Options, Save Options.


    # Navigating a document


    PS Viewer provides tools to let you navigate a document. Use the Go To command
    to choose the exact page and section number that you want to navigate. When finish
    reading or viewing a page, you can use the Page Down command to see the next page
    in the document. PS Viewer lets you navigate quickly to the beginning or end of
    your document.


    Instead of scrolling through a long document, use the Read Down command to read
    pages in sections starting with the top section of the page.


    # Locating a specific page


    You can locate specific pages in PS Viewer using the Go To command. Go To lets
    you specify the section and page number that you want to view.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# To locate a specific page


    +   - Click Go, Go To Page.


    +   - In the Section box, type the section or chapter number where the page is
    located.


    +   - Type the page number in the Page box.


