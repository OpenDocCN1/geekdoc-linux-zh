    # Managing system users and groups


    The system administrator or root user is responsible for managing the system users
    and groups. Corel LINUX is a multiuser operating system. Multiple users can log
    in to one computer at the same time from remote terminals. To keep track of multiple
    users, you can create a user account with a unique identification and password
    for each user.'
