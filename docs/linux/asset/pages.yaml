    # Installing Corel LINUX to a DOS/Windows partition


    You can install Corel LINUX to an existing DOS/Windows partition. This

    installation option lets you start Corel LINUX from MS-DOS mode on a

    computer that is running MS-DOS 6, Microsoft Windows 3.1x, Windows 95,

    or Windows 98. Windows NT does not support MS-DOS.


    Installing Corel LINUX to a DOS/Windows partition requires a block of space

    for installation on one of the drives on your computer. This is a good

    installation choice if you are unsure about using a Linux operating system

    because it lets try Corel LINUX before committing to reformatting your

    hard disk to create partitions or removing an existing operating system. For

    more information about disk partitions, see “Understanding Install Express

    and disk partitions” on page 21.


    The Windows file system must be FAT 16, FAT 32, or VFAT to use this

    installation process. For more information, consult your Windows

    documentation.


    # To install Corel LINUX to a DOS/Windows partition


    +   I Follow steps 1 to 6 from the procedure “To replace Microsoft Windows

    with Corel LINUX” on page 25.


    +   2 Enable the Install In DOS/Windows Partition button, and click the Next

    button.


    +   3 Choose the drive to install Corel LINUX from the Device list box, and

    type the partition size in the Partition size box.


    +   4 Click the Install button when you''re ready to begin the installation. It
    is

    not recommended that you disable the Enable The Scan Bad Block During

    Format option before clicking the Install button. This option scans the

    hard disk for errors before installation and extends the amount of time

    needed to install Corel LINUX.


    # To start Corel LINUX from Microsoft Windows


    +   I Click the Start button, and click Shut Down.


    Installing Corel LINUX


    27'
