- pgno: 147
  md: 'The flat view shows one level of the system at a time.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_147_0.png)


    Directories and subdirectories contain all types of files, including scripts,
    system executables, device files, mail files, and application files. For more
    information about file types and directories type, see "Navigating the file system"
    on page 303. Files appear with the icons corresponding to the application that
    opens or executes the file. For more information about associating files with
    applications, see "Editing MIME types" on page 120.


    Some Linux system files are hidden by default. Hidden files are files that are
    critical for running operating system processes and daemons. You can view and
    edit hidden files if you are logged in as the root user. For information about
    logging in as a root user, see "Using the root account" on page 103.


    # Parent Directories


    The main tree in Core File Manager displays the following parent directories:


    +   * My Home — the home directory for the current user. It contains all the subdirectories
    and files located on the desktop, and the personal files created or copied to
    the file system by the user. If you are logged in as the root user, your home
    directory is /root. If you are logged in your home directory is /home/username.
    In each case, the home directory is located under "My Home" in Core File Manager.

    The — contains the root directory, which contains all directories and files for
    the Core LINUX, including the operating system kernel. The kernel consists of
    the core files of the Linux operating system, which contain the code and basic
    services necessary to run the computer. The root directory is divided into subdirectories
    that contain system users, user files, program files, and temporary files. Your
    home directory and personal files can also be accessed from the root directory.
    The System directory is hidden if you are logged in as a regular user. The files
    in this directory affect the core functions of the operating system, and should
    be managed only by the root user. You can turn on The System to view its contents.


    138 Core LINUX User Guide: Chapter 8'
  merge: -1
  img_proc: true
