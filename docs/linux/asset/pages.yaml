- pgno: 129
  md: '# Viewing device information


    As the root user, you can view current information about the system''s internal
    devices. For example, you can view information about interrupts, ports, partitions,
    and memory. Device information is read-only.


    To view device information


    +   1 Click Application Starter, Control Center.

    2 Click Information.

    3 Click any of the following to view the information:

    * Devices

    * DMA Channels

    * Interrupts

    * IO Ports

    * Memory

    * Partitions

    * PCI

    * Processor

    * SCSI

    * Samba Status

    * Sound

    * X-Server


    # Editing MIME types


    A MIME type associates a file extension with an application so that Corel

    LINUX starts the correct application for a specific file. For example, the

    MMIME type Gzip associates the Archive Administrator application with files that
    have the extension .gz or .tgz. When you click a *.gz or *.tgz file to open it,
    Corel LINUX automatically starts the Archive Administrator and opens the file.


    In the MIME Editor, you can view the existing MIME types in two different

    trees. The tree organizes and displays the MIME types in groups according to file
    types. For example, .gif, .jpeg, and .tiff files are displayed in

    Image category. The summary view gives you a list of MIME types according to their
    descriptions and extensions.'
  merge: -1
  img_proc: true
- pgno: 130
  md: "You can edit MIME type to add or remove file types so that an application is\
    \ associated with variations of the same type of file extension. For example,\
    \ if you want to open GIF images with the Image Viewer, you can include .gif and\
    \ \n.GIF in the MIME type definition. You can also delete MIME types. When you\
    \ are editing or adding MIME types, you must provide the following information:\n\
    \n+   - MIME type description. — the name of the MIME type. This is descriptive,\
    \ for example, a MIME type associating text documents with an application called\
