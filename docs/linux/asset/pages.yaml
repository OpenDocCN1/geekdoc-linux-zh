    +   - Place the mouse pointer in the Description window, to view the description
    of an application component for an extended period of time.

    - If you want to install applications, you must have root privileges. For information
    about using the root account, see “Using the root account” on page 103.


    # Updating applications


    You can update the current applications and the kernel on the system. Corel Update
    informs you about application updates so that you can choose the applications
    to update. Because the Corel LINUX applications and operating system are Open
