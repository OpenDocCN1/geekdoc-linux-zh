  md: '2 Click the icon that appears beneath the URL box.


    3 In the Select Icon dialog box, choose a path from the Icon list.


    4 Click the icon that you want to use.


    5 Click OK.


    # Deleting hyperlinked icons


    You can remove a hyperlinked icon from the desktop if you no longer want to use
    it.


    To delete a hyperlinked icon


    +   - Right-click the hyperlinked icon, and click Delete.


    # Connecting to chat servers and channels


    Corel LINUX provides an Internet Relay Chat (IRC) client called Chat. Chat lets
    you connect to chat servers on an IRC network and join the chat channels listed
    on the server. A chat channel is a group of clients that interactively exchange
    messages over an IRC network. An IRC network is a network of servers that connect
    clients over the Internet. IRC networks span many continents.


    A chat server contains multiple chat channels. Joining a chat channel lets you
    join the online discussion on that channel. Each channel has a chat window. In
    the chat window, you can view the messages written by other chat users. You can
    type messages, and place them in the chat window for other users to view and respond.
    You can also join multiple chat channels.


    To connect to an IRC server using Chat, you must set up a user profile and choose
    the IRC network and server that you want to connect. After you have connected
    to an IRC server, you can view a list of chat channels that are available from
    the chat server to which you are connected. The channel names are preceded by
    a number sign (#). From the channel list you can double-click on Chat to join
    the discussion on the channel.


    When you start Chat for the first time, the Chat auto-setup wizard runs.


    This is an introduction to the Chat program. There are many additional Chat features
    that are not documented here. For more information about Chat, see the Chat online
    help.


    # Creating a user profile


    You must create a user profile before you connect to an IRC network. Your user
    profile consists of the nicknames you want to be identified as, your username,
    and your real name.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'You can also set the following connection modes for your user profile in the
    On Connect Set box:


    +   - Mode +w

    - Mode +i

    - Mode +s


    When you enable the Mode +w check box, your connection receives broadcast messages
    that are sent from one user to all users on a server. When you enable the Mode
    + i check box, your user becomes invisible to users outside of your channel. When
    you enable the Mode +s check box, your connection receives server messages. Server
    messages can flood your connection, so you should not enable Mode +s unless you
    need to see messages.


    # To create a user profile


    +   1. Click Application Starter, Network, Chat.

    2. Click Settings, User.

    3. Enter your User information.


    # Connecting to a chat server and joining a channel


    To connect to a chat server using Chat, you specify the IRC network that you want
    to use and the servers on the network that you want to connect. You should configure
    Chat to try to connect first to servers that are close to your location. When
    you connect to a server, the server displays administration messages in the Status
    console.


    After you are connected to a server, you can join a channel that is listed on
    the server. Chat lets you query the server for a list of the channels on the server.
    You can request a new list of channels or the channel list from the last time
    you queried the server. If it is the first time you are querying the server for
    a channel list, you must query the server for a new channel list. When you have
    the list of channels on the server, you can join a channel from the list and participate
    in the discussion on that channel.


    You communicate with other chat users using the chat window. Typing messages in
    the message box at the bottom of the chat screen and pressing ENTER places your
    text in the chat window. Other chat users connected to that channel can read your
    message and respond to it. Each chat user''s message begins with the user''s nickname.


    # To connect to a chat server


    +   1. Click Application Starter, Applications, Network, Chat.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_182_0.png)'
  merge: -1
  img_proc: true
- pgno: 183
  md: '2 Click Settings, Server and proxy.


    3 Choose an IRC network in the IRC Network text box.


    4 Using the Move buttons, place the servers that you want Chat to try to connect
    to, first at the top of the server window.


    5 Click OK.


    6 Click Main, Connect.


    # To query the server for a list of channels


    +   1 Click the Query Channel List button on the toolbar.


    +   2 Click on one of the following query buttons:


    +   * Request new list


    +   * Use latest list


    # To join a channel


    +   * In the Channel list window, double click the channel you want to join.


    # To chat in the chat window


    +   * In the chat window, type your message in the message box and press ENTER.


    # To disconnect from a channel


    +   * Click the Close button at the top of the chat window.


    # To disconnect from a chat server


    +   * Click Main, Disconnect.


    # Accessing newsgroups


    Core LINUX provides a news client called Newsgroups. Using Newsgroups, you can
    read articles posted on the newsgroups. Newsgroups lets you a news server, connect
    to it, and access the newsgroups on that server. You can download articles from
    the newsgroups that are on the news server to which you are connected. You must
    know the address of a news server to connect to it.


    Connecting to a news server lets you see a list of all the newsgroups on that
    server. The newsgroups are titled according to subject. Opening a newsgroup'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'lets you view a list of the articles posted to that newsgroup. You can read
    the articles in a newsgroup or open another newsgroup.

    You can post articles to a newsgroup or respond to articles. You can post an article
    to the newsgroup, simultaneously respond to the author with a private email, or
    respond with only a private email. You can also forward an article using email.
    You must set your SMTP server (mail server) so that you can post, send, forward,
    and receive articles using email.

    You can search for a newsgroup on a server using the newsgroup name. You can also
    search for an article in a newsgroup using keywords.


    # Newsgroups and connecting to a news server


    When you start Newsgroups, you can connect to a news server. You can set Newsgroups
    to automatically connect to a news server when you start the application. You
    can also disconnect from a news server.


    # To start Newsgroups


    +   - Click Application Starter, Applications, Network, Newsgroups.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_184_0.png)


    # To connect to a news server


    +   1 Follow the step from the previous procedure.


    +   2 Click the Connect To Server button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_184_1.png)


    # To set the news server to connect on startup


    +   1 Follow the step from the “To start Newsgroups” procedure.


    +   2 Click Options, NNTP Options.


    +   3 Enable the Connect On Startup check box.


    # To disconnect from a news server


    +   - Click the Disconnect From Server button in the Newsgroups Group List Window.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_184_2.png)'
  merge: -1
  img_proc: true
- pgno: 185
  md: '+   * Typing a news server in the NNTP Server box adds it to a list of news
    servers. You can connect to a different server by adding a different server address
    to this list, or by choosing a server from the list.


    +   * You must specify a news server in the NNTP Configuration window. For information
    about specifying a new server, see “Setting connection preferences” on page 176.


    # Using news servers


    You can specify a news server to connect to so that you can access that server’s
    newsgroup and articles. You can specify a mail server which lets you reply to
    articles using email.


    # To specify a news server


    +   1 Click the Application Starter, Applications, Network, Newsgroups.


    +   2 Click Options, NNTP Options.


    +   3 Type the domain name address of a news server in the NNTP Server box.


    # To specify a mail server


    +   1 Click the Application Starter, Applications, Network, Newsgroups.


    +   2 Click Options, NNTP Options.


    +   3 Type the domain name address of your mail server in the SMTP Server box.


    # Setting connection preferences


    You can set connection preferences so that you connect to a preset news server
    when you start Newgroups. For information about starting Newgroups, see “Starting
    Newgroups and connecting to a news server” on page 175. Newgroups automatically
    connects to the preset news server when you start Newgroups. The connection authentication
    limits access to the Newgroups if other users are logged in to your computer.
    You can set a user name and password to use for connection authentication. (Newgroups
    will prompt you for a user name and password when you try to connect to a news
    server.) You can specify the number of articles to download from the news server
    when Newgroups connects to the server. This is useful when there is a large number
    of articles on the server and you want to avoid scrolling through them.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# To set the news server to connect on startup


