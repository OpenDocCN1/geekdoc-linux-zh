- pgno: 121
  md: '# Adding and removing users from groups


    As the root user, you can add and remove users from groups. Removing a user from
    a group does not delete the user from the system.


    # To add a user to a group


    +   - Click Application Starter, Applications, System, User Manager.

    - Click the Groups tab.

    - Choose a group from the Group Name list.

    - Click the Edit Group button

    - From the Available Users list box, choose a user to add to the group.

    - Click the Right Arrow (>>) button.

    - Click OK.

    - Click the Save button.


    # To remove a user from a group


    +   - Follow steps 1 to 4 from the previous procedure.

    - From the Members Of The Group list box, choose a user to remove the group.

    - Click the Left Arrow (<) button.

    - Click OK.

    - Click the Save button.


    > The root user is the only user who can add and remove users from groups. For
    information about using the root account, see “Using the root account” on page
    103.


    # Deleting groups


    As the root user, you can delete a group from the system. When you delete a group,
    the users in that group remain on the system unless you delete the individual
    user accounts. You cannot remove the primary group of existing user. You must
    remove the user before you remove the group. For information about removing users
    from groups, see “Adding and removing users from groups” on page 112.'
