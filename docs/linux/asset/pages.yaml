    administrator.


    # Setting file sharing security


    You can set your security level for accessing other computers on the network.
    For example if you want to get a file from the Windows computer "johnd_windows"
    and the user johnd has set permissions on his system so that a user who wants
    to access his file must supply a user name and password, you must set your security
    level to "user". You can choose from the following security levels:


    +   - server — authenticates your workgroup name through a remote (network) server


    +   - user — the computer you access over the network asks you for a user name
    and password


    +   - share — there are no access permissions restrictions on files or computers
    you want to access


    If your network has a server that authenticates passwords (used for server level
    security), you must specify the password authentication server''s IP address.


    # To set the Samba Client security on your computer


    +   1 Click Application Starter, Control Center.


    +   2 Double-click Network, Windows Workgroups.


    +   3 Choose a security level from the Security Level list box.'
