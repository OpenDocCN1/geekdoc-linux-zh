    # Registering Core LINUX


    If you purchased and installed Core LINUX, you can register your copy of Core
    LINUX with Corel. By registering you can receive the latest information about
    updates, service patches, and upgrades. You can also receive access to Corel''s
    quality technical support after you register.


    To register, you will need the serial number on the Core LINUX Product Authenticity
    Card. You can register by visiting Corel on the Web and completing the registration
    form at

    http://www.corel.com/support/onlineregistration.htm.


    # Starting and logging in to Core LINUX


    After installing Core LINUX, you can log in to your computer and start using your
    new operating system. By logging in, you identify yourself as Core LINUX. Based
    on your user name, Core LINUX grants you options and privileges to the computer,
    remembers your personal settings, and protects your information and data.


    You can log in using the user name you created during the installation, or can
    log in using the *root* account. The root account in Linux is used for system
    administration and is created automatically during installation. By logging in
    to your computer as the root user (system administrator), you have unlimited privileges;
    you can add and delete user accounts, change user privileges, and configure Core
    LINUX. For security, you should set a password for the root account the first
    time you log in as root user. For more information about using the root account,
    see “Managing Core LINUX systems” on page 101.


    Core LINUX is a multi-user operating system. This means multiple users can log
    in to one computer at the same time from remote terminals. With a multi-user system,
    you can also set personalized settings for each user who logs in to the computer.
    For example, in a family situation, a parent can use a different set of settings
    than for a child''s account. The child can have a different set of applications,
    a different screen background,'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'and be restricted from accessing certain files. For more information about
    creating other user accounts, “Managing Core LINUX systems” on page 101.


    Core LINUX also includes different operational modes to help you troubleshoot
    system problems you may encounter.


    # Starting Core LINUX and other operating systems


    Install Express adds a menu to your computer’s startup process. This menu application,
    resides outside of Core LINUX, lets you choose the operating system you want to
    start if you have more than one installed. The menu also displays other options
    for starting Core LINUX. For more information about these options, see “Logging
    in to Core LINUX and using specialized settings” on page 34.


    # To start Core LINUX


    +   1 Start your computer.


    +   2 Once the Core LINUX splash screen and the menu are displayed, one of the
    following:

    - Press 1

    - Press ENTER


    # To start other operating systems


    +   1 Start your computer.


    +   2 Once the Core LINUX splash screen and the menu are displayed, one of the
    following:

    - Press the number key that corresponds to the number of the operating system
    you want to use in the menu.

    - Press the UP ARROW or DOWN ARROW to choose the operating system you want to
    use in the menu, and press ENTER.


    # Logging in to Core LINUX


    You can log in to Core LINUX using the user name that you specified during installation
    or using the root account. The first time that you log in installation, you do
    not need to type a password in the Password box. For security reasons, you should
    set a password for the user account that you created during installation when
    you log in for the first time.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# To log in to Corel LINUX for the first time


    +   Start your computer.


    +   Choose Corel LINUX as the operating system you want to use.


    +   Choose the user name you specified during installation in the User Name list
    box, and click Login.


    +   From the Control Center window, type a password in the New Password box.


    +   Retype the password in the Re-type Password box.


    +   Once you create a password, you are required to use it to log in to Corel
    LINUX.


    # To log in to Corel LINUX


    +   Start your computer.


    +   Choose Corel LINUX as the operating system you want to use.


    +   Choose a user name from the User Name list box.


    +   Type the password for the user name account, if one exists, in the Password
    box, and click Login.


    If your computer is part of a network, select a network from the Domain name list
    box. For more information about networks, see “Configuring network connections”
    on page 327.


    # Logging in to Corel LINUX as the system administrator


    In Linux, the account used for system administration is called root. By logging
    in to your computer as the root user, you have unlimited privileges; you can add
    and delete user accounts, change user privileges, access all files, and configure
    Corel LINUX. For security reasons, you should set a password for the root account
    the first time you log in as the system administrator. For more information about
    using the root account, see “Managing Corel LINUX system users” on page 105.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# To log in to Corel LINUX as the system administrator for the first time


    +   1 Start your computer.


    +   2 Choose Corel LINUX as the operating system you want to use.


    +   3 Choose root (Administrator) in the User Name list box, and click Login.


    +   4 From the Control Center window, type a password in the New Password box.


    +   5 Retype the password in the Re-type Password box.


    +   - The root user has unlimited privileges. For security reasons, guard the
    root account password with care. The root account for the system administrator
    is created automatically during installation.


    +   - Passwords must contain at least five characters but no more than eight.
    They can contain letters, numbers, and punctuation marks. A secure password should
    contain a combination of these characters. Passwords are case sensitive.


    # To log in to Corel LINUX as the system administrator


    +   1 Start your computer.


    +   2 Choose Corel LINUX as the operating system you want to use.


    +   3 Choose root (Administrator) from the User Name list box.


    +   4 Type the password for the root account in the Password box, and click Login.


    # Logging out and shutting down Corel LINUX


    During a session of Corel LINUX, you can log in and out as a different user. For
    example, you can log in as root (or administrator) during a session to configure
    a setting and then log back into your user account. When you have completed your
    Corel LINUX session, you can shutdown Corel LINUX.


    # To log out Corel LINUX


    +   1 Save any open files.


    +   2 Click Application Starter, Logout.


    If you don''t save your open files, you will be prompted to do so.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_42_0.png)'
