  md: '![](img/86803f2a30e88fe6e62989f0fe100a53_144_0.png)


    # # Managing files in Corel LINUX


    Corel LINUX files are organized using directories and subdirectories. The directories,
    subdirectories and files in Corel LINUX form a tree structure, with the root directory
    at the top of the system. All other directories and files are located within the
    root directory. For more information about the Core LINUX file structure, see
    “Navigating the file system” on page 303.


    There are three main types of files in a Linux system: system files, program files,
    and user files. System files contain information about user accounts, passwords,
    and file permissions. System files are usually text files that can be edited using
    the Console utility. Corel LINUX provides utilities for configuring the system
    files, see “Using the root account” on page 103. Program files, or executable
    files, contain information that tells the system to perform an action, such as
    boot up, or run a daemon. Program files are written in programming code. User
    files are files that are created by the user, for example, text and graphics files.


    Corel File Manager provides a graphical method of managing directories and files.
    Corel File Manager lets you display and navigate the contents of the file system,
    and performs operations on the directories and files on both local and remote
    file systems on your network.


    Corel File Manager lets you view directories and files in a tree view or a flat
    view. You can browse directories and files using browser buttons that you'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'move forward, backward, and up in the file system hierarchy, or you can type
    file path names to navigate to a file. You can also browse the Web and access
    FTP sites. For information about using Corel File Manager as a Web browser and
    working with files using FTP, see “Corel File Manager as a Web browser” on page
    166. You can cut, copy, paste, move, rename, sort, view properties and create
    directories and files. You can create shortcuts to directories and files and place
    them on the desktop. You can access directories from floppy disk and CD-ROM. You
    can share files on your file system with remote Microsoft Windows and Linux users,
    or share directories that are located on remote Microsoft Windows and Linux systems.
    You can also access your V-Drive account directory seamlessly.


    Corel LINUX offers a file sharing service called V-Drive. V-Drive is located on
    the Corel Corporation server that lets users place on a secure, encrypted site.
    Users access the V-Drive server via the Web, from any terminal with a Web browser
    and Internet access. Corel LINUX makes accessing your V-Drive account seamless,
    because you can mount your V-Drive directory to your local file system. For information
    about setting up a V-Drive account, go to http://corel.com/services/vdrive/defaultasp.


    When you install Corel LINUX, the desktop and Corel File Manager are automatically
    configured so that most of the utilities, directories and applications you need
    to get started are available on the desktop or from the Panel. For more information
    about using the Desktop and the Panel, see “Using the Corel LINUX desktop” on
    page 37.


    Corel File Manager is an important tool for managing your Corel LINUX file system.
    You can work with files outside of the Corel File Manager interface by creating
    links and shortcuts on your desktop, and by configuring file and directory sharing.
    The browser capabilities of Corel File Manager also let you integrate Web and
    FTP sites into your file exploration. For more information about using Corel File
    Manager as a Web browser and working with files using FTP, see “Using Corel File
    Manager as a Web browser” on page 166.


    # Working with files in Corel File Manager


    Corel File Manager lets you view and navigate the directories and files on your
    local file system and network file systems to your computer is connected. You
    can access directories and files located on floppy disk or CD. You can open directories
    and files, and start applications from Corel File Manager, sort and refresh the
    file views, and move, delete, cut, copy, and paste directories and files. You
    can also place links and shortcuts to directories and files on the desktop for
    quick access. You can view the properties of directories and files, and search
    for directories, files, or network computers.


    Corel File Manager also has browser and FTP capabilities. For more information
    about using Corel File Manager as a browser, see “Using Corel'
