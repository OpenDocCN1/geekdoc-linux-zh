    # Setting up servers with Corel LINUX


    Servers are the foundation of a network. When you visit a Web site, for example,
    you are accessing information which is stored on a Web server. When you download
    a file over an office intranet, download the file from a file server. Servers
    typically work on a client/server model.


    In the client/server model, clients are network computers that get services, such
    as printing to a network printer, or accessing email, provided by another network
    computer, a server. Servers are installed and configured with server software
    to process client requests.


    Core LINUX comes with server software to let you up your Corel LINUX computer
    as different types of servers. You can set up Corel LINUX to be the following
    servers:


    +   - Apache web server — lets you host a Web site on your Corel LINUX computer


    +   - ProFTPD FTP server — lets you set up a File Transfer Protocol (FTP) site
    on Corel LINUX computer


    +   - qmail server — lets you set up an email server for your network on your
    Corel LINUX computer


    +   - Samba server — lets you set up a file and print server for a Windows network
    on your Corel LINUX computer. Samba also lets you set up a Windows Internet Naming
    Service (WINS) server for the identification of Windows computers on a network,
    and a Primary Domain Controller (PDC) server for authenticating users on your
    network.


    +   - NFS server — lets you set up a Network File System (NFS) file server for
    non-Windows computers on your Corel LINUX computer


    +   - DHCP server — lets you set up a Dynamic Host Configuration Protocol (DHCP)
    to dynamically allocate IP addresses to network clients on your Corel LINUX computer


    The Core LINUX Server Administrator Guide and Corel Linux Server Administrator
    online Help provides an overview of servers supported by Corel LINUX. It also
    describes installing and configuring servers on Corel LINUX, and general networking
    concepts.'
  merge: -1
  img_proc: true
