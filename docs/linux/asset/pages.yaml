- pgno: 298
  md: '# Working with the Console utility

    15


    The Console utility lets you work directly at the shell command line in the Console
    window. The shell is an integral part of the Linux operating system, or kernel
    interprets and communicates commands to the operating system, or kernel. At the
    shell command line, the user can provide instructions, or commands, to the shell
    that tells the kernel which programs to run. For more information about shells
    and how to use them, see “Working with a shell” on page 293. For information about
    commands, see the Manual pages. Manual pages contain detailed information about
    specific Linux commands and topics. You can access the Manual window by typing
    man [command] at the command line. For example, typing man cd opens the Manual
    page for the Change command.


    You can customize the Console window by changing the font size, window size, or
    window color. Console also lets you multitask by running multiple shell sessions
    simultaneously.


    Using the Console utility, you can also access the visual shell, Midnight Commander.
    Midnight Commander lets you access the command line, browse directories, and manipulate
    files. For more information about Midnight Commander, see “Working with Midnight
    Commander” on page 316.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Using the Console


    Console lets you the command line in three modes: Linux Console, Shell, and Midnight
    Commander. Linux Console mode displays the default shell in a Console window.
    Shell mode displays the Bourne shell in a Console Window. Midnight Commander mode
    displays the visual shell, Midnight Commander, in the Console window. For more
    information about working in Midnight Commander mode, see "Working with Midnight
    Commander" on page 316. For information about shell commands, see "Working with
    a shell" on page 293.


    You can open more than one shell session simultaneously. For example, to write
    a computer program, you can open one shell session to write and edit code, a second
    session to compile the code, and a third session to view reference material such
    as Manual pages.


    You can also open multiple shell sessions in different command line modes. For
    example, you can open a shell session in Midnight Commander mode to organize your
    file system, and another shell session in Linux Console mode to write or compile
    a computer program using your default shell. You can switch between shell sessions.


    You can customize the appearance of the Console window. For example, you can change
    the font size, window size, or window color. You can also save custom appearance
    settings.


    # Accessing the shell command line


    You can access the shell command line using the Console utility. Console automatically
    opens a shell session in Linux Console using your default shell. Corel LINUX uses
    the Bourne-Again Shell (bash) as the default. For more information about bash,
    see "Working with a shell" on page 293. You can switch to the visual shell, Midnight
    Commander, by opening a new shell session in Midnight Commander mode. For more
    information about Midnight Commander, see "Working with Midnight Commander" on
    page 316.


    Login shells are non-windowed terminal screens that provide the user with access
    to a command line prompt. Users who are used to working at the shell command line
    in this non-windowed environment can use the Login shell. Corel LINUX reflects
    changes to your system from a Login shell. For example, if you add a new user
    to a Login shell, the user name is displayed when you open the User Manager in
    Corel LINUX. You can open up to six Login shells. Each Login shell is identified
    with a number, ranging from tty1 to tty6.


    You can also use the Run command to execute shell commands. You can view the command
    results, or standard output, in the Console window when you run the command.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# To start the Console utility


    +   - Click Application Starter, Applications, Utilities, and click Console.


    +   - To open the Midnight Commander shell, click File, Midnight Commander in
    the Console window.


    +   - You can also start the Console utility by clicking the Terminal Emulation
    button on the Panel.


    # To start a Login shell


    +   - Press CTRL + ALT + F + F1.


    +   - You can open multiple Login shells by pressing CTRL + ALT + F + F2....F6.

    - You can return to Corel LINUX by pressing CTRL + ALT + F + F7.


    # To start the Run command


    1 Click Application Starter, Run.

    2 In the Command list box, type the command you want to run.


    +   - Enable the Run In Terminal Window check box to display the standard output
    in a Console window.

    - You can also start the Run command by pressing ALT + F2.


    # Working with multiple shell sessions


    The Console utility lets you multitask by opening multiple shell sessions simultaneously.
    You can switch between sessions.


    # To open multiple shell sessions


    +   - Click File, and choose one of the following modes:

    - Linux Console — displays a Console window using the default shell

    - Shell — displays a Console window using the Bourne shell

    - Midnight Commander — displays a Console window using Midnight Commander


    Working with the Console utility'
  merge: -1
  img_proc: true
