    # To lock the screen


    +   - Right-click the desktop, and click Lock Screen.


    # To unlock the screen


    +   - Type your login password in the Password box, and press ENTER.


    If the screen is black, press a key or move the mouse to display the Corel LINUX
    Login dialog box.


    # Changing your user password


    You can change the password that you use to log on to your Corel LINUX system.


    # To change your user password


    +   1 Click Application Starter, Control Center, Password.

    2 From the Domain list box, choose the domain for which you want to change your
    password.

    3 Type your old password in the Old Password box.

    4 Type a new password in the New Password box.

    5 Type the new password again in the Re-type Password box.


    +   - Enable the Synchronization check box to change the password for all domains.'
  merge: -1
  img_proc: true
- pgno: 57
  md: <!-- no content -->
  merge: -1
