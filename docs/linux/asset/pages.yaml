- pgno: 14
  md: '# What are Linux and Corel LINUX?


    This section provides a brief history of the evolution of Linux and Corel LINUX.


    Linux (pronounced LIH-nucks) is a UNIX-like operating system. Linux is publicly
    available for download on the Internet at no cost and the source code is open
    to developers. Technically, the term “Linux” refers to the kernel or core operating
    system, but it has come to describe the complete operating system and use of applications.
    Linux strives for POSIX compliance (a set of standards defining UNIX) to stay
    compatible with other UNIX-like systems.


    # The Development of Linux


    In the 1980s, Andrew Tanenbaum, a Dutch professor of computer science and a specialist
    in designing operating systems, wrote MINIX to help his students learn the complexities
    of UNIX. In the spring of 1991, a student at the University of Helsinki, Linux
    Torvalds, began experimenting with ways to increase the functionality of MINIX.
    Torvalds'' experimentation became the Linux kernel. He placed the source code
    in the public domain so developers around the world could look at, modify, and
    add to his initial developments. Torvalds became a contact to whom developers
    could make changes, enhancements, and additional drivers. At the same time, Torvalds
    was adding core functionality.


    The worldwide collaboration resulted in version 1.0 of the Linux kernel, which
    was released in 1994. Since the initial release, version 2.0, and version 2.2,
    have also been released. The Linux kernel is unique because it is Open Source
    Software, which means that the source code is available to anyone, so developers
    can locate and submit patches to Torvalds. As a result, the Linux kernel has become
    extremely robust since its initial development and is often considered more robust
    than many commercial operating systems. Developers use the utilities and libraries
    that surround the Linux kernel to write applications. Many Linux users and software
    developers have Linux distributions, which'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'include a number of utilities required for software development, as well as
    user and server applications. Linux distributions are relatively inexpensive or
    free, and are normally available on the World Wide Web or CD-ROM. Since Linux
    is licensed under the terms of the GNU General Public License (GPL), full source
    code is usually provided or made available in some manner.


    # Corel LUX contributors


    Corel LINUX is powered by the Debian distribution and a set of complimentary tools
    and utilities from GNU. Debian is a leader in Linux distributions and is produced
    by more than 500 volunteer developers worldwide. Most of these developers have
    not met in person but communicate electronically through the Internet. Debian
    is a major supporter of Software In The Public Interest, Inc., a non-profit organization
    dedicated to the spread of free software (or Open Source Software).


    GNU tools and utilities, from the Free Software Foundation (FSF), provide some
    of the core functionality of Corel LINUX. The FSF is dedicated to eliminating
    restrictions on copying, redistribution, understanding, and modification of computer
    programs by promoting the development and use of free software in all areas of
    computing.


    The graphical user-interface (or desktop) of Corel LINUX is based on the K Desktop
    Environment (or KDE). KDE is also free software, and provides one of the most
    advanced, stable, and complete desktop environments for Linux. Development of
    KDE also takes place through the Internet. In addition to Linux, KDE can run on
    Solaris, FreeBSD, IRIX, and HP-UX systems.


    For more information about the organizations that have been integral to the development
    of Corel LINUX, see the Web pages


    +   - http://www.debian.org/

    - http://www.gnu.org/

    - http://www.fsf.org/

    - http://www.kde.org/


    # What is the Corel LINUX operating system?


    The Corel LINUX operating system is based on the work of software developers around
    the world. Corel has pulled together their work and modified the Linux distribution,
    applications, and graphical user-interface to meet the needs of our users. Modifications,
    improvements, and updates have been contributed to the Open Source Software community.
    Corel LINUX also includes proprietary applications and utilities such as the Corel®
    File'
  merge: -1
  img_proc: true
- pgno: 16
  md: '+   Corel LINUX is a subset of the Debian distribution. Debian includes many
    applications that are not typical Corel LINUX users would use. Applications that
    are not included in Corel LINUX are still available on the World Wide Web but
    are not supported by Corel. You can install applications using Corel® Update.


    # # What’s included in Corel LINUX


    The following section describes some of the applications and utilities included
    in Corel LINUX. Not all Corel LINUX editions include the applications described
    in this section. You can find more information about each of these applications
    in other sections of this user guide.


    # ## Install Express


    Historically, installing Linux has been a time consuming and difficult task for
    inexperienced computer and Linux users. The Install Express uses dialog boxes
    to guide you through the installation, configuration, and partition phases of
    setting up your operating system. Each dialog box contains information about the
    procedure and options available, and gives you instructions that guide you to
    the next step of the installation.


    # ## Corel Update


    Corel® Update lets you install, update, and remove the Corel LINUX operating system
    and its components, Corel applications, such as WordPerfect®, and third-party
    applications, such as Lynx or Netscape Communicator. You need a network or Internet
    connection or a CD-ROM that contains applications before you can use Corel Update
    to install new or updated versions of applications.


    # ## Corel File Manager


    Corel® File Manager provides a graphical method of managing directories and files.
    Corel File Manager lets you display and navigate the contents of the file system,
    and perform operations on the directories and files on both local and remote file
    systems on your network. You can browse directories and files using browser buttons
    that let you move forward, backward, and up in the file system hierarchy, or you
    can type in file path names to navigate to a file. You can also browse the World
    Wide Web and access FTP sites.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Corel® WordPerfect® 8 for Linux


    Core WordPerfect 8 for Linux is a word-processing application that lets you produce
    professional-looking documents, such as newsletters, articles, reports, books,
    proposals, legal pleadings, and brochures. Adding graphics, charts, and tables
    to any document is easy with Core WordPerfect 8 for Linux. Core WordPerfect 8
    for Linux continues to support reveal codes, which lets you control every element
    of a document. Core WordPerfect 8 for Linux also has enhanced Internet features,
    which let you create a document and publish it to paper, electronic media, and
    the World Wide Web.


    # Linux source files


    Open source software used in the development of Core LINUX is included in packaged
    editions. Using the open source software, you can make your own modifications
    to the underlying Corel LINUX programming code.


    # Third-party applications


    The following section lists some of the third-party applications that may be included
    in your package of Corel LINUX:


    +   **Adobe Acrobat Reader** — Acrobat Reader lets you view, navigate, and print
    PDF (Portable Document Format) files across multiple platforms. Adobe Acrobat
    is often used as a document format on the World Wide Web.


    +   **Netscape Communicator** — You can use Netscape Communicator to locate and
    view Web pages, download files from remote computers, and send and receive email.
    Refer to the Netscape Communicator online Help for more information about these
    features.


    +   Netscape Communicator users can receive support and documentation for a fee.
    For more information, contact Netscape at http://www.netscape.com.


    # Learning how to use Corel LINUX


    Corel LINUX includes online and paper documentation to help you learn and use
    the applications efficiently.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Corel LINUX documentation set


    Online Help


    The online Help enables you to retrieve quickly all the information need, and
    then return to your work. Help displays in an HTML (or Web browser) window. You
    can browse through the Help using the table of contents, index, or full-text search
    options. You can also print specific topics from the online Help.


    Corel LINUX User Guide


    This book explains the features of Corel LINUX and the associated applications,
    and provides step-by-step instructions for installing and using Corel LINUX.


    Corel LINUX Server Administrator Guide


    This book introduces Corel LINUX server capabilities. Corel LINUX can be used
    as a file, print, and database server on a network, or as Web, FTP, and email
    server in an Internet environment. Not all editions of Corel LINUX include this
    guide. If your version of Corel LINUX does not include this guide, you can purchase
    it from Corel Customer Service, see “Customer Service” on page 16.


    # To access online Help topics for Corel LINUX


    +   * Click Application Starter, Help, Corel LINUX Help.


    # To access online Help topics for a Corel LINUX application


    +   * From a Corel LINUX application, click Help, and choose the appropriate item.


    # To access online Help topics for Corel LINUX server tools


    +   * Click Application Starter, Help, Corel LINUX Server Administrator Helper.


    # Other sources for learning Corel LINUX


    Other sources for learning about using Corel LINUX applications include the following:


    # World Wide Web


    For in-depth information about getting the most out of Corel LINUX, visit the
    community site for Corel LINUX users at http://linux.corel.com on the World Wide
    Web. Designed for both new and expert users, this Web site is a comprehensive,
