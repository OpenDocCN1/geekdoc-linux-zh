    # Customizing keyboard and mouse buttons


    You can turn the keyboard repeat option off, so that when you press and hold a
    key on the keyboard, the character or action of the key occurs only once. If you
    turn keyboard repeat on, when you press and hold a key, the character or action
    (for example, ENTER) occurs repeatedly. You can adjust key click volume, which
    is the volume of feedback when you press a key.


    Some third-party applications require complete control of the right mouse button
    when they are running. When a third-party application takes control of the right
    mouse button, right-clicking performs actions which are different from those you
    have set in the Corel LINUX Control Center. You can set an option so a third-party
    application controls the right mouse button when it runs. You can also let Corel
    LINUX maintain control of the right mouse button.'
