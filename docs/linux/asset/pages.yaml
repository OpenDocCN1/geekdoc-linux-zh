    2 Choose a font property from any of the following list boxes:

    * Family changes the font typeface

    * Weight changes the font weight, for example, bold

    * Size changes the size of the font

    * Style changes the font style attributes, for example, italic


    # Adding and removing fonts


    Font Manager lets you specify which fonts are available to use with the desktop
    and desktop applications. Font Manager maintains a list of the desktop fonts.
    You can add or remove fonts from this list. Removing a font does not delete it
    from your system, but only makes it unavailable to use on the desktop or in applications.


