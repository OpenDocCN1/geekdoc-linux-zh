- pgno: 292
  md: '# Customizing printer properties


    The Printing Manager lets you customize printer properties, such as printer type,
    print resolution, and page setup. If your printer has minimal memory resources,
    you can limit the file size that users can print. You can also set a default printer
    using the Printing Manager.


    # Changing printer name and type


    You can change the printer name that was assigned when the printer was installed.
    You can also change the device or port name for local printers and the hostname
    for network printers.


    Printer type refers to the make and model of a printer, for example, Lexmark Optra
    EP. You can change the printer type for a local or network printer without having
    to reinstall the printer.


    # To change the printer name for a local printer


    +   1 Click Application Starter, Control Center.

    2 Click Printers.

    3 Choose the printer from the Installed Printers list, and click Properties.

    4 Click the General tab, and type the printer name in the Name box.

    5 Type the device or port name in the Device box.


    # To change the printer name for a network printer


    +   1 Follow steps 1 to 4 from the previous procedure.

    2 Type the hostname in the Hostname box.


    # To change the printer type


    +   1 Follow steps 1 to 3 from the “To change the printer name for a local printer”
    procedure.

    2 Click the Output tab.

    3 Choose a printer type from the Printer Type list box.


    +   * You must be the root user to change printer settings. You can switch to
    the root user by clicking Modify and entering your root user password.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Customizing color settings and print resolution


    Color and print resolution settings vary according to the printer type. Print
    resolution is measured in dots per inch (dpi). For example, a print resolution
    of 600 dpi translates to 600 x 600, or 360,000 dots per square inch.


    You can change printer color and resolution settings.


    # To change color settings


    +   * Click Application Starter, Control Center.

    * Click Printers.

    * Choose the printer from the Installed Printers list, and click Properties.

    * Click the Output tab, and choose a color setting from the Color Depth list box.


    # To change print resolution


    +   * Follow steps 1 to 3 from the previous procedure.

    * Click the Output tab, and choose a print resolution from the Resolution list
    box.


    > You must be the root user to change printer settings. You can switch to the
    root user by clicking Modify and entering your root user password.


    # Customizing the page setup


    You can customize the page setup of a printer by changing the paper size, formatting
    pages, and adjusting page margins. When you format a page, you specify how many
    pages to print per sheet of paper. For example, 1-up prints one page of a document
    on one sheet of paper; 2-up fits two pages of a document on one sheet of paper.


    You can adjust page margins only for formatted pages that allocate two or more
    pages per sheet of paper. You can adjust the horizontal and vertical margins.


    # To change paper size


    +   * Click Application Starter, Control Center.

    * Click Printers.

    * Choose the printer from the Installed Printers list, and click Properties.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_293_0.png)'
