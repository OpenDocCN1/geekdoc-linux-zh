  md: '+   - Repeat this procedure to open as many shell sessions as you require.


    # To switch between shell sessions


    +   - Click Sessions in the Console window, and choose the session in which you
    want to work.


    # Customizing Console window settings


    You can customize the appearance of the Console window. You can display or hide
    the Menu Bar and window frame, and scroll bar. You can also change the font size,
    window size, and color scheme of the Console window. For example, the Green On
    Black color scheme displays a black shell session background with green text.


    # To display the Menu Bar


    +   - Click Options, Menubar.


    +   - A check mark beside Menubar indicates that the Menu Bar is displayed.

    - Click Options, Menubar to hide the Menu Bar.


    # To display the window frame


    +   - Click Options, Frame.


    +   - A check mark beside Frame indicates the window frame is displayed.

    - Click Options, Frame to hide the window frame.


