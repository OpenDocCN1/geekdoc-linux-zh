  md: '![](img/86803f2a30e88fe6e62989f0fe100a53_10_0.png)


    # # Welcome to Corel LINUX


    Thank you for choosing Corel LINUX® from Corel Corporation as your operating system.
    Corel LINUX is a powerful yet easy-to-use windowed environment that takes advantage
    of the latest enhancements in Linux. Whether for your desktop or laptop, Corel
    LINUX is easy to install, learn, and use.


    If you''re familiar with windowed graphical user environments, you won''t lose
    time relearning how to do your work. If you''re working with other users on a
    Microsoft Windows or Macintosh platform, in fact, Corel LINUX lets you exchange
    files and data with them. Corel LINUX can co-exist on the same computer with Microsoft
    Windows and other operating systems.


    With Corel LINUX, you can be productive, use the Internet, and configure your
    installation to meet your specific needs while knowing that you are one of the
    most secure, flexible, powerful, and stable operating systems available.


    Please take a few minutes to review the rest of this section — it provides information
    about how you can learn to maximize Corel LINUX capabilities.


    # ## What’s the purpose of the Corel LINUX User Guide?


    Corel LINUX User Guide can help you get up and running quickly with Corel LINUX.
    It explains the features of Corel LINUX and the associated'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'applications, provides step-by-step instructions for installing Corel LINUX
    and performing the most common tasks, describes Corel LINUX tools and functions,
    and outlines Corel''s support and service policies. Because a single book cannot
    be an exhaustive reference for every application in Corel LINUX, this user guide
    is designed to be a companion to the Corel LINUX online Help.


    **Corel LINUX User Guide** is designed for both new and experienced computer users.
    If you''re new to computers and operating systems, you can use this user guide
    as a foundation for your learning. If you''re familiar with other operating systems,
    such as Microsoft Windows or Macintosh, you can use this guide to learn about
    the tools available to you, and how to use them. If you are an experienced Linux
    user, you can use this user guide to learn about Corel LINUX offers you.


    # **What''s in this user guide?**


    This user guide is divided into 16 chapters. The first chapter, which you are
    currently reading, introduces Corel LINUX and includes information about Linux,
    documentation conventions, and learning using Corel LINUX.


    Here''s what you can expect to find in the next 15 chapters:


    +   - Chapter 2 — Corel LINUX support and services

    - Chapter 3 — Installing Corel LINUX

    - Chapter 4 — Using the Corel LINUX desktop

    - Chapter 5 — Customizing Corel LINUX settings

    - Chapter 6 — Managing Corel LINUX systems

    - Chapter 7 — Installing, updating, and removing applications

    - Chapter 8 — Managing files in Corel LINUX

    - Chapter 9 — Connecting to the Internet

    - Chapter 10 — Working with text

    - Chapter 11 — Working with graphics

    - Chapter 12 — Using Corel LINUX utilities

    - Chapter 13 — Using multimedia applications

    - Chapter 14 — Managing printing and fonts in Corel LINUX

    - Chapter 15 — Working with the Console utility

    - Chapter 16 — Configuring network connections'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# What''s not in this user guide?


    Traditionally, Linux operating systems have been used as file, print, and database
    servers on networks, or as Web, FTP, and email servers in an Internet environment.
    Linux servers offer easy implementation, security, and performance. This user
    guide does not cover Core LINUX server capabilities. You can review the Core LINUX
    Server Administrator Guide or the Core LINUX Server Administrator online Help
    for more information about using Core LINUX server capabilities.


    The Core LINUX User Guide and Core LINUX online Help do not provide a reference
    for Linux commands. Linux commands are used in the Console utility or the Login
    shell; that is, a non-windowed environment or terminal mode. For more information
    about Linux commands, see the chapter titled "Working with the Console utility"
    on page 289.


    # What you need to know


    This user guide assumes you know the basics about your computer. It also assumes
    you know how to point, click, and drag with a mouse (or another pointing device)
    and use a keyboard.


    # Documentation conventions


    Before you start using the Core LINUX User Guide and the online Help, it''s important
    to understand the documentation conventions. By reviewing these conventions, you
    will be able to use the documentation more effectively.


    The following are conventions related to using the mouse.


    | When you see this... | Do this... |

    |---|---|n| Click | Press the primary mouse button (usually the left mouse button).
    |

    | Double-click | Quickly press the primary mouse button twice. |

    | Right-click | Press the secondary mouse button (usually the right mouse button).
    |

    | Click File, New | Click the File menu, and click the word New in the menu. |

    | Click Application Starter, Find, Computer | Click Application Starter, click
    Find, and click Computer in the submenu that appears. |

    | Enable the [Y] check box | Click the [Y] check box to place a check mark or
    “X” inside the box. |

    | Disable the [Y] check box | Click the [Y] check box to remove the check mark
    or "X." |'
  merge: -1
  img_proc: true
