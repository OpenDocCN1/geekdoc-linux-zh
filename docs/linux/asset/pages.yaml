    # Managing fonts


    Fonts are character sets that contain a typeface and size. A typeface refers to
    the style of a character set, such as Helvetica, Courier, and Times Roman. Most
    typefaces can be modified using bold, italics, bold italic, or normal weight.


    You can manage fonts for the Corel LINUX desktop using the Font Manager. The Font
    Manager lets you specify which fonts are accessible to desktop applications by
    adding or removing fonts. It also lets you preview fonts. When you preview a font,
    ensure that the font is added to the Current KDE Fonts list. For information about
    adding a font to the font list, see "Adding and removing fonts" on page 287.


    The Font Manager works in conjunction with the Fonts desktop settings located
    in the Control Center. The Fonts desktop settings let you change font settings
    for different areas of the desktop. For more information about changing desktop
    fonts, see "Changing desktop fonts" on page 62. When you'
