  img_proc: true
- pgno: 98
  md: 'The mouse buttons can perform different actions depending on where in a window
    the cursor is pointing. You can choose what the window performs when clicked using
    each of the mouse buttons. For example, you can set the mouse actions so that
    when you right-click the Title Bar or frame of a window, the window goes to the
    back, behind other windows; or, when you left-click the inner part of an inactive
    window, the window is activated and raised to the top. Actions available include
    raise, lower, operations menu, toggle raise and lower, pass click, move, resize,
    and nothing. You can apply any action to the right mouse button or the left mouse
    button, and to different parts of the window.


    Mouse acceleration refers to the speed that the cursor moves when you move the
    mouse. A mouse acceleration value makes the cursor move slowly. The mouse acceleration
    threshold is the distance in pixels that the cursor must move before accelerated
    movement occurs. The lower the threshold, the quicker the cursor responds to mouse
    movement. For example, a high acceleration value combined with a low threshold
    value that means a small mouse movement makes the cursor move a great distance
    quickly. A high threshold value combined with a low acceleration value requires
    a large mouse movement to move the cursor.


    You can change the button mapping of the mouse so that the left mouse button performs
    the right-click action, and the right mouse button performs the left-click action.


    # Customizing keyboard settings


    You can set keyboard repeat to on or off. You can also adjust the volume of feedback
    created when a key is pressed.


    # To set keyboard repeat


    +   - Click Application Starter, Control Center.


    +   - Click Input Devices, Keyboard.


    +   In the Keyboard Repeat box, enable one of the following buttons:

    - On — lets you type a character repeatedly when you hold down a key

    - Off — lets you type a character only once when you hold down a key


    # To set the volume of key click feedback


    +   - Follow steps 1 and 2 from the previous procedure.


    +   - Move the Key Click Volume slider to the left to decrease key click volume,
    or to the right to increase key click volume.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Setting right mouse button control for non-Corel LINUX applications


    Some non-Corel LINUX applications need to apply customized settings to the right
    mouse button. You can let non-Corel LINUX applications use their own right mouse
    button settings when necessary. You can also set mouse settings so that the right
    mouse button maintains its Corel LINUX settings.


    # To let non-Corel LINUX applications use the right mouse button


    +   1 Click Application Starter, Control Center.

    2 Double-click Windows, then click Advanced.

    3 Click the Grab The Right Mouse Button to deselect it.


    # To let Corel LINUX use the right mouse button


    +   1 Follow steps 1 and 2 from the previous procedure.

    2 Click the Grab The Right Mouse Button to select it.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_99_0.png)


    +   * The Grab The Right Mouse Button is selected by default.


    # Configuring mouse action settings


    You can specify the action that each mouse button performs when you click part
    of a window. You can set the left, middle, or right mouse button to perform an
    action when you click one of the following areas:


    +   * The Title Bar and frame of the active window

    * The Title Bar or frame of an inactive window

    * The inner area of an inactive window


    You can apply the following actions to any of the mouse buttons for the window
    areas:


    +   * raise — lets you click the window to position it in front of any other windows
    open on the desktop

    * lower — lets you click the window to position it behind any other windows open
    on the desktop

    * activate — lets you click the window to activate it, if it is inactive'
