    # To change the icon that represents a shortcut


    You can change the icon that represents a shortcut. You can choose from icons
    available from several preset directories.


    # To change an icon


    +   1 On the desktop, right-click the shortcut icon.

    2 Click Properties.

    3 Click the Execute Tab.

    4 Click the application icon.

    5 Choose an folders from the list box on the top left of the Select Icon dialog
