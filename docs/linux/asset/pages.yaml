    # Specifying your personal identification


    You can specify your identity so that when you post articles or reply to articles,
    your personal information is automatically included in the “From” area of the
    email or posting. You can specify your name, email address, and organization or
    company.


    # To specify personal identification


    +   1 In the Group List Window, click Options, Identity.

    2 Type a name in the Real Name box.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '3 Type your email address in the Email Address box.

    4 Type the name of your organization or company in the Organization box.


    # Opening newsgroups


    You can open a newsgroup to view its articles. Opening a newsgroup opens the Newsgroup
    window, which contains the article list.


    # To open a newsgroup


    +   1 Click Application Starter, Applications, Network, Newsgroups.

    2 Click the Connect To Server button.

    3 Click the plus sign (+) to expand the All Newsgroups menu.

    4 Choose a newsgroup from the Subscribed Newsgroups or All Newsgroups list.

    5 Click Newsgroup, Open.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_187_0.png)


    > > You do not have to be connected to a news server to open a newsgroup; however,
    the Newsgroup window is empty if you are not connected. For information about
    viewing the articles in the Newsgroup window, see “Working with articles in a
    newsgroup” page 178.


    # Working with articles in a newsgroup


    You can view the articles in a newsgroup by opening a newsgroup window. A list
    of articles available in the open newsgroup is displayed in a list in the top
    part of the newsgroup window. You can move from an article to the next and previous
    article. You can also delete an article.


    # To read an article


    +   1 Click Application Starter, Applications, Network, Newsgroups.

    2 Click the Connect To Server button.

    3 Click the plus sign (+) to expand the All Newsgroups menu.

    4 Choose a newsgroup from the Subscribed Newsgroups or All Newsgroups list.

    5 Click Newsgroup, Open.

    6 Click the Get Article List button.

    7 Choose an article from the list in the Newsgroup window.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_187_1.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   * When you open a newsgroup, Newsgroups prompts you to specify the number
    of articles to download from the server.

    * If you connect to the server before opening the newsgroup, the articles appear
    automatically in the Newsgroup window; you do not have to click the Get Article
    List button.


    # ### To move to the next article


    +   1 Follow the steps from the previous procedure.

    2 Click the *Next Message* button.


    # ### To move to the previous article


    +   1 Follow all the steps from the “To read an article” procedure.

    2 Click the *Previous Message* button.


    # ### To delete an article


    +   1 Follow all the steps from the “To read an article” procedure.

    2 Click Options, Expunge.


    # ## Posting articles to a newsgroup


    You can post an article to a newsgroup. You can respond to an article by posting
    a follow-up article. You can also simultaneously send the follow-up article privately
    to the author of the article when you post a follow-up article to the newsgroup.
    For information about responding to articles only by private email, see “Replying
    to and forwarding newsgroup articles” on page 180.


    # ### To post a new article


    +   1 Choose an article from the article list in the Newsgroup window.

    2 Click the *Post New* Article button.

    3 Type a subject and a message in the Newsgroup Mail Window.

    4 Click the *Send Message* button.


    # ### To post a follow-up article


    +   1 Choose an article from the article list in the Newsgroup window.

    2 Click the *Post Followup* button.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '3 Type reply message in the Newsgroup Mail Window.


    4 Click the Send Message button.


    # To reply and post a follow-up article


    +   1 Choose an article from the article list in the Newsgroup window.


    +   2 Click the Post&Mail button.


    +   3 Type a reply message in the Newsgroup Mail Window.


    +   4 Click the Send Message button.


    > For information about opening newsgroups, see “Opening newsgroups” on page 178.


    > You can also access the post commands by clicking the File menu in the Newsgroup
