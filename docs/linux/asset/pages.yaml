    To create custom colors for article display


    +   1 Follow steps 1 and 2 from any of the previous procedures.


    +   2 In the Custom Colors section, choose a gray box.


    +   3 Click a color region on the Color Palette.


    +   4 Click the Add To Custom Colors button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_201_0.png)


    +   * For information about opening newsgroups, see “Opening newsgroups” on page
    178.'
