- pgno: 44
  md: '# # Accessing the emergency shell


    If other troubleshooting options for Corel LINUX have failed, you can use the
    Emergency shell. The Emergency shell provides diagnostic tools for configuring
    Corel LINUX. Only experienced users should use the Emergency shell.


    # ## Access the Emergency shell


    +   1. Insert the Corel LINUX Installation CD-ROM into the CD-ROM drive.

    2. Shut down and restart your computer.

    3. As the Install Express dialog box appears, hold down SHIFT until the menu appears.


    If your computer restarts without displaying a bootable CD-ROM This means that
    you have to use a 3.5" high-density floppy disk (1.44 MB) as the bootable disk
    in the install process. Some editions of Corel LINUX include the Corel LINUX Installation
    (bootable) floppy disk. If you have this floppy disk, insert it and reboot your
    computer. If you do not have this floppy disk, you need to create a bootable disk.
    After you have created the disk, leave it in your disk drive and reboot your computer.
    After you complete the steps, continue with the procedure. For more information
    about creating a bootable disk for Linux, see "Creating a bootable disk for Corel
    LINUX" on page 29.


    +   4. Press UP ARROW or DOWN ARROW and choose one of the following:

    * Corel LINUX — starts Corel LINUX

    * Rescue Console — runs Level 1 in a Console window

    * Emergency Shell — invokes the KISS Shell for expert users


    +   5. Press ENTER.'
