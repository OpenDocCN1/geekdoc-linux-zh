  md: 'File Manager as a Web browser on page 166. For more information using Core
    File Manager to work with files using FTP, see “Transferring files using FTP”
    on page 169. You can use the browser capabilities of Core File Manager to navigate
    the directories and files on your local file system by typing the file path or
