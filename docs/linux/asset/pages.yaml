    # Previewing fonts


    The Font Manager lets you preview fonts using Font Explorer. When you preview
    a font, Font Explorer lists the properties applied to that font, and displays
    the font in a preview box.


    Font Explorer also lets you change font properties and preview the results. For
    example, you can preview the Helvetica font and modify its properties such as,
    font size and font style. Font Explorer displays the font and the new properties
    in the preview box.


    Font Explorer is a previewing tool only and does not let you save or apply changes
    that you make to font properties.


    # To preview a font


