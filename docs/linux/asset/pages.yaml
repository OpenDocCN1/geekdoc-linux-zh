- pgno: 46
  md: '# Using the Corel LINUX desktop


    When you log on to Corel LINUX, the desktop automatically displays on your screen.
    The desktop provides your workspace. You can expand your workspace using multiple
    desktops. For example, instead of cluttering one desktop using many applications
    simultaneously, you can use one desktop for writing or programming, another for
    reading and composing email, and another for reading Help files. Desktops are
    virtual in that they let you extend the desktop workspace beyond the area immediately
    visible on your computer screen.


    A desktop contains two main components: the Panel and the Desktop Window. The
    Panel helps you organize and manage your workspace. Use the Panel to


    +   * start applications

    * access open applications

    * access virtual desktops


    You can customize the Panel by changing its location on the desktop. For information
    about customizing the Panel, see “Customizing the Panel” on page 78.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'The Desktop Window lets you display and use applications. When you start an
    application, the Desktop Window displays the application in an Application Window.


    You can also place desktop shortcuts on the Desktop Window. Desktop shortcuts
    are icons that let you quickly open folders and applications on your computer.
    By default, the Corel LINUX provides shortcut icons to folders, such as the Trash,
    your home directory, and printing. For information about creating desktop shortcuts,
    see “Creating a shortcut on the desktop” on page 85.


    The following illustration displays the Corel LINUX desktop including:

    1) desktop shortcuts

    2) the Panel, and

    3) the Desktop Window.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_47_0.png)


    Corel LINUX is a multiuser system. This means another user can log out of your
    desktop session or access your work when you are away from your computer. There
    are features that let you protect your work when you are not at your computer.


    # Starting applications


    You can start applications in two ways: using the Application Starter menu, or
    Autostart.


    The Application Starter button on the Panel opens the Application Starter menu.
    This menu lets you start applications located in the Applications submenu or the
    Quick Start menu.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'This illustration displays the Application Starter menu, the Applications submenu,
    and the Quick Start menu.


    Autostart lets you open applications automatically each time you log on to the
    desktop. For example, if you always read email when you first log on to the desktop,
    you can set Autostart to automatically start your email application on startup.


    # # Starting applications using the Application Starter menu


    The Application Starter menu lets you start applications in two ways: using the
    Applications submenu or the Quick Start menu. Most applications available in Core
    LINUX are located in the Applications submenu. The Applications submenu is organized
    into groups of submenus according to the type of application. For example, graphics
    applications are located in the Graphics group.


    The Quick Start menu is located at the top of the Application Starter menu. Quick
    Start tracks which applications you use on the desktop and lists them according
    to how frequently or recently you use them. For example, you can set Quick Start
    to list the five most frequently used applications. For information about customizing
    the Quick Start menu, see “Customizing the Quick Start menu” on page 73.


    # ## To start an application using the Applications submenu


    +   1 Click Application Starter, Applications.

    2 Click a submenu, and choose an application.


    # ## To start an application using Quick Start


    +   * Click Application Starter, and choose the application you want to start.


    * You can start some applications, such as Text Editor, or online Help by clicking
    the appropriate application button on the Panel. By default, Core LINUX provides
    four application buttons. For information about


    Using the Core LINUX desktop 39'
