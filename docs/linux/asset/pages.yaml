    # Creating and moving directories


    You can create one or more directories simultaneously in your working directory,
    using the Make Directory command (mkdir). To create a directory, you must have
    write permission in the parent directory. You can use command options to set the
    directory access mode (-m) or create parent directories (-p) when you make a new
    directory. New directories use a default access mode. For information on the command
    options for the Make Directory command, see the Manual page for the mkdir command.
    For information about setting permissions, see “Setting permissions and ownerships”
    on page 113.


    Use the Move command (mv) to move a directory to a new location. You must specify
    the directory you want to move and the location of the destination directory.
    The shell renames the directory, including all its files and subdirectories, to
    the destination directory. If the destination directory you specify does not exist,
    bash renames the source directory with the name of the destination directory.


    You can use command options with the mv command. For a list of possible command
    options, see the Manual page for the Move command.


