    # Monitoring system processes and performance


    You can access information about all processes that are running on the operating
    system. Task Viewer displays a list of processes with information about each process,
    including its unique ID number, the user who invoked it, the time that it has
    been running, and the amount of memory that it is using. You can sort the processes
    by information field, or filter the processes so that only the processes you are
    interested in seeing are displayed.


    Task Viewer lets you abort system processes, but unless you are logged in as the
    root user, you can abort only the processes that you own. The root user can abort
    any system process.


    Task Viewer also displays information about the operating system''s overall performance.
    The CPU Load meter displays the overall processor load. The Memory Usage Performance
    meter displays the total memory used by the operating system and gives a breakdown
    of the memory used by programs, buffer, cache, and swap memory.


    You can also use the Process Manager to monitor and manage all processes on your
    Core LINUX computer. For more information about the Process Manager, see the Core
    LINUX Server Administrator Guide or the Core LINUX Server Administrator online
    Help.


    # Displaying system processes


    You can view a list of all processes that are running on your operating system.
    Task Viewer gives you information about each process, including the ID number,
    the time that the process has been computed, and the amount of memory that the
    process is using. You can display the system processes in a list or in tree format.
    The tree format displays the relationship between processes.


    # To display system processes


    +   1 Click Application Starter, Applications, System, Task Viewer.


    +   2 Click the Processes List tab.


    +   3 Click any of the following columns'
