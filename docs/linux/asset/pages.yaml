    # Creating user groups


    As the root user, you can create user groups that have specified file access permissions
    assigned to them. You can specify names for the groups you create, and the Group
    ID is system-generated.


    # To create a user group


    +   1 Click Corel Application Starter, Applications, System, User Manager.

    2 Click the Groups tab.

    3 Click the Add Group button.

    4 Type the name of the group in Group Name box.

    5 Click OK.

    6 Click the Save button.


    +   - Group IDs must be unique.

    - The root user is the only user who can create user groups. For information about
    using the root account, see “Using the root account” on page 103.'
