- pgno: 318
  md: "# Finding files and directories using the command line\n\nUse the Find command\
    \ (find) to locate files or directories on your hard drive. The shell searches\
    \ your working directory by default. You can specify a different path name from\
    \ which to begin searching. If the path name you want to search is outside your\
    \ working directory in the directory tree structure, use the directory's absolute\
    \ path name. For information about absolute path name, see “Navigating the file\
    \ system” on page 303.\n\nYou can also set conditions to narrow the search. For\
    \ a list of possible conditions, see the Manual page for the Find command. Using\
    \ the Name condition (-name), you can search your home directory to find the file\
    \ named file.\n\n```\nMabel~\\$ find /home -name file\n```\n\nYou can use wildcards\
    \ in conjunction with conditions. You can also redirect output from the search\
    \ to a file, or pipe the output as input to another command. For information about\
    \ using wildcards, see “Understanding wildcards” on page 299. For information\
    \ about redirecting output and piping, see “Redirecting input and output” on page\
    \ 301, “Combining commands with pipes” on page 302.\n\nThe following example uses\
    \ the asterisk wildcard (*) to search the home directory for files with a .txt\
    \ extension.\n\n```\nMabel~\\$ find /home -name \"*.txt\"\n```\n\nYou can add\
    \ to the above command and redirect the output (files with a .txt extension) to\
    \ a file named textfiles.\n\n```\nMabel~\\$ find /home -name \"*.txt\" > textfiles\n\
    ```\n\n# To find a file or directory\n\n+   At the command line type,\n  find\
    \ [<path name>] [<conditions>]\nPress ENTER.\n\n+   Do not include the brackets\
    \ in the command line text. For information about notation conventions for commands,\
    \ see “Using notation conventions for Linux commands” on page 295.\n\n![](img/86803f2a30e88fe6e62989f0fe100a53_318_0.png)"
  merge: -1
  img_proc: true
