- pgno: 95
  md: '• If you do not know the filename, you can click the Browse button.


    # To create a shortcut from an application


    +   1 Open the application you want to create a shortcut.

    2 Right-click the Title Bar.

    3 Click Create A Nickname.

    4 Type a nickname for the application in the Nickname box.


    • The Properties dialog box is for advanced users. It is not recommended that
