- pgno: 166
  md: 'You can mount a network file system that lets you access a directory on a remote
    file system (someone else''s computer) from your home directory. This is called
    a network share. A mounted network share appears as a directory on your local
    file system. For example, you can mount a directory located on a Microsoft Windows
    computer over your desktop, so that you can access the Microsoft Windows directory
    without navigating the Microsoft Windows network. You can perform the same actions
    on your home directory as your Linux folders and files that are mounted


    You must configure the Samba on your Corel LINUX computer so you can share directories
    with Microsoft Windows systems. For information about configuring Samba on your
    computer, see “Connecting to Microsoft Windows computers” on page 349 and “Setting
    up and print servers for Windows clients” in the Corel LINUX Server Administrator
    Guide.


    You can share files from your home directory and set access permissions for users
    accessing your shared files whether you are logged in as a regular user or root
    user. For information about setting access permissions, see “Setting permissions
    and ownerships” on page 113. For information about logging in as a root user,
    use “Using the root account” on page 103.


    # V-Drive


    You can access files located on the Corel V-Drive server using the V-Drive directory
    in Corel File Manager. V-Drive is a server located at http://Corecity.com allows
    users to place files on a secure, encrypted Website, accessible from any terminal
    with Internet access. For example you can use V-Drive for the following purposes:


    +   * You can upload files to V-Drive Web space from your office computer terminal,
    then download them to your home computer.

    * You can upload files while you are traveling to V-Drive Web space, then access
    them from any system with a Web browser and Internet access.

    * You can use V-Drive Web as swap space for data if your system has limited partition
    space.

    * You can save files on V-Drive Web space that are too large to store on floppy
    disk, or if larger storage peripherals such as disk drives are not available.


    When you install Corel LINUX, an icon is placed on the desktop that takes you
    to the V-Drive Website. There you can set up a V-Drive account. Corel LINUX comes
    with the drivers needed to mount your V-Drive space onto your local file system.
    When you activate the driver, a V-Drive directory appears in the directory list
    of Corel File Manager, giving you direct access to'
  merge: -1
  img_proc: true
- pgno: 167
  md: "your V-Drive space from Corel File Manager. You can easily manage files between\
    \ your V-Drive space and your local directories. For information about getting\
    \ a V-Drive account, visit http://corecity.com/services/vdrive/default.asp.\n\n\
    # Sharing files from your home directory\n\nYou can make a directory or subdirectory\
    \ on your local file system available to other users in your workgroup. You can\
    \ create the name that identifies the file on the shared network directory and\
    \ set the maximum number of users allowed to share the directory.\n\n# To share\
    \ a directory or file\n\n+   1 On the Panel, click the Corel File Manager button.\n\
    2 Right-click the directory or file you want to share.\n3 Choose Windows Sharing\
    \ from the menu.\n4 Enable the Shared As button.\n\n# To set the user limit for\
    \ a shared file\n\n+   1 Follow all the steps from the previous procedure.\n2\
    \ Enable one of the following buttons:\n    * Maximum Allowed — lets you set an\
    \ unlimited number of users\n    * Allow — lets you specify a number of users\n\
    3 Click the arrow buttons to change the number of users in the Allow box.\n\n\
    # Setting access permissions for a shared file\n\nYou can set access permissions\
    \ for the shared directory. For more information about file access permissions,\
    \ see “Setting permissions and ownership” on page 113. The default permissions\
    \ for a file allow all users (“Everyone”) read-write access. You can change the\
    \ default so that the user “Everyone” has no access or only read access. You can\
    \ also add and remove access permission settings.\n\n# To change the default access\
    \ permissions\n\n+   1 On the Panel, click the Corel File Manager button.\n2 Right-click\
    \ the directory or file you want to share.\n3 Choose Windows Sharing from the\
    \ menu.\n4 Enable the Shared As button."
