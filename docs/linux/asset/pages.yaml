- pgno: 50
  md: '# Accessing open applications


    You can open multiple applications on the desktop simultaneously. You can access
    open applications and switch between them using the taskbar. By default, the taskbar
    is located on the Panel, however, you can move the taskbar to a different location
    on the desktop. For information about moving the taskbar, see “Customizing the
    taskbar” on page 80.


    The taskbar lists applications that are open on the current desktop. When you
    open an application, a button containing the name of the open application appears
    on the taskbar. When the application is the active Application Window on the desktop,
    the button appears pressed and shaded. For information about Application Windows,
    see “Displaying applications on the desktop” on page 44.


    The following illustration displays the taskbar on the Panel and indicates which
    applications are open. The Core File Manager button appears pressed and shaded
    because it is the active Application Window on the desktop.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_50_0.png)


    The taskbar lets you access open applications.


    You can also access open applications on other virtual desktops from your current
    desktop.


    # Accessing and switching between open applications


    An open application displays in an Application Window on the desktop. You can
    have multiple Application Windows displayed on the desktop. Use the buttons on
    the taskbar to access and switch between open applications on your current desktop.
    When you click an application button, the application becomes the active Application
    Window. For information about Application Windows, see “Displaying applications
    on the desktop” on page 44.


    By default, the taskbar displays open applications for the current desktop only.
    You can also access open applications on another virtual desktop.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# To access an open application on the current desktop


    +   Right-click the taskbar, and click Show Task, In Current Desktop.


    +   Click the button on the taskbar of the application you want to access.


    # To access an open application on another virtual desktop


    +   Right-click the taskbar, and click Show Task, All Tasks.


    +   Click the button for the application you want to access.


    Corel LINUX automatically switches to the virtual desktop where the open application
    is displayed.


    # To switch between open applications


    +   Click the button on the taskbar for the application to which you want to switch.


    +   You can also switch between open applications on the current desktop by pressing
    ALT + TAB.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_51_0.png)


    # Accessing virtual desktops


    Corel LINUX lets you use multiple desktops. Desktops are virtual in that they
    extend the desktop workspace beyond the area immediately visible on your computer
    screen. Virtual desktops help you organize your work and multitask by letting
    you use different desktops for different tasks. For example, you can use one virtual
    desktop for writing or programming, another for reading and composing email, and
    another for reading Help files.


    The desktop that displays on your screen is the current desktop. From the current
    desktop, you can access to seven other virtual desktops. By default, Corel LINUX
    lets you access four virtual desktops, however, you can change this number by
    customizing your desktop settings. For information about customizing virtual desktops,
    see “Customizing virtual desktops and borders” on page 83.


    The Virtual Desktop Manager, located on the Panel, lets you organize your virtual
    desktops. Use the Virtual Desktop Manager to view all active virtual desktops,
    switch between virtual desktops, and move applications between virtual desktops.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'This illustration displays the Virtual Desktop Manager on the Panel, as well
    as the virtual desktop buttons for each desktop.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_52_0.png)


    You can refresh a desktop to display changes made to the desktop settings.


    # Viewing and switching between virtual desktops


    The Virtual Desktop Manager window lets you view all active virtual desktops.
    You can also switch between virtual desktops.


    To view all virtual desktops


    +   - Click the Virtual Desktop Manager flyout on the Panel.


    To switch between virtual desktops


    +   - On the Panel, click the Virtual Desktop button of the desktop to which you
    want to switch.


    You can switch between virtual desktops by pressing CTRL + TAB.


    # Moving applications between virtual desktops


    You can move an application between virtual desktops using the Virtual Desktop
    Manager. Ensure that the application you want to move is open in the Virtual Desktop
    Window. You can also move an application to a different virtual desktop using
    the taskbar buttons.


    You can make an application available to all virtual desktops using the Application
    Window. This is useful if you need to access a specific application at all times.
    The Application Window contains a Thumb Tack icon called the Sticky button, located
    on the Title Bar, which lets you place the application on all virtual desktops.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# To move an application using the Virtual Desktop Manager


    +   1 Click the Virtual Desktop Manager flyout.


    +   2 Drag the Application Window from the appropriate virtual desktop to another
    desktop.


    # To move an application using the taskbar


    +   1 Right-click the taskbar button for the application that you want to move.


    +   2 Click To Desktop, and choose the virtual desktop to which you want to move
    the application.


    # To place an application on all virtual desktops


    +   * Click the Sticky button in the Title Bar of the Application Window.


    +   * Click the Sticky button again to remove the application from all virtual
    desktops, except the current desktop.


    # Refreshing the Corel LINUX desktop


    You can refresh the desktop if you have made changes that do not appear immediately.
    For example, if you make changes to application properties, refreshing the desktop
    lets you view the changes.


    # To refresh the desktop


    +   * Right-click the desktop, and click Refresh Desktop.


    # Displaying applications on the desktop


    When you start an application, the Desktop Window displays the application in
    an Application Window. You can display multiple Application Windows on your desktop
    simultaneously. The Application Window in which you are currently working is the
    active window. Each Application Window contains a Title Bar at the top of the
    window. The Title Bar appears highlighted when the window is active.


    Core LINUX helps you organize how your Application Windows display on your desktop
    using the Uncl and Cascade commands.


    You can resize and move Application Windows. When you are not using specific applications,
    you can minimize Application Windows to increase your workspace. You can customize
    window settings so that all windows are the'
  merge: -1
  img_proc: true
