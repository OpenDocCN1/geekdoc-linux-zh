  img_proc: true
- pgno: 79
  md: '- Sticky — displays the window on all virtual desktops


    - Close — closes the window


    - Menu — displays a menu of control options for the window, including

    Move, Resize, Iconify, Sticky, Maximize, Create Nickname, and Close


    # Working with Title Bar pixmaps


    You can have a pixmap image appear in your Title Bar background. You can

    set an image to appear in active window Title Bars, and another to appear in

    inactive window Title Bars. You can prevent the pixmap from appearing

    under the Title text.


    # To set a pixmap for active Title Bars


    +   - Click Application Starter, Control Center.

    - Double-click Windows, and click Title Bar.

    - In the Appearance section, enable the Pixmap button.

    - In the Pixmap section, click the Active Pixmap button.

    - Choose a file from the list box in the Select Icon dialog box.

    - Choose an icon from the list that appears when you choose a file in the

    Select Icon dialog box.


    # To set a pixmap for inactive Title Bars


    +   - Follow steps 1 to 3 from the previous procedure.

    - In the Pixmap section, click the Inactive Pixmap button.

    - Follow steps 5 and 6 from the previous procedure.


    # To prevent pixmaps from appearing under Title Bar text


    +   - Follow steps 1 to 3 from the “To set a pixmap for active Title Bars"

    procedure.

    - Enable the No Pixmap Under Text check box.


    # Moving a menu bar and toolbar in a window


    A menu bar is found at the top of application windows under the Title Bar. A

    toolbar is generally located under the menu bar, although some windows do

    ot have a tool bar. The menu bar provides access to all the commands

    available within the application window using drop down menus. The toolbar

    provides shortcut icons to the most frequently used menu options. You can

    ove a menu bar in a window to the top or bottom, and the toolbar to the top,'
  merge: -1
  img_proc: true
