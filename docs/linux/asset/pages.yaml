- pgno: 248
  md: '![](img/86803f2a30e88fe6e62989f0fe100a53_248_0.png)


    # Using Corel LINUX utilities


    Corel LINUX provides utilities that help you do your work faster. The utilities
    include Archive Administrator, Calculator, Hex Editor, Format Floppy, and Note.


    You can group, compress or decompress files using Archive Administrator. An archive
    is created when you compress one large file, or group several files together.
    You can look at the files in an archive, add files to an archive, and delete or
    extract files from an archive. You can also customize Archive Administrator.


    You can do simple, trigonometric, and statistical calculations using Calculator.
    You can also customize Calculator by enabling features and changing its appearance.


    You can view and edit files using Hex Editor. Hex Editor converts files into hexadecimal
    digits. If you understand the hexadecimal number system, you can edit your files
    using Hex Editor. A window opens for every file you open in Hex Editor.


    Format Floppy lets you format and erase floppy disks. You can also name your disks
    so that you can keep track of them without having to label them.


    You can post notes on your desktop using the Note utility. You can create and
    edit your notes, copy and paste text in a note. You can also customize the'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'colors and appearance of your notes. The Note utility features that let you
    change the location of a note or send your note to another desktop.


    # Using Archive Administrator


    You can use Archive Administrator to group and compress files. Grouping or compressing
    files creates an archive, that is the same as the original files, but compressing
    files creates an archive that is smaller than the original files. It is easier
    to transfer and copy an archive of compressed files several individual files.
    For example, it is faster to email a compressed file than to email the individual
    files. You can also view, create, and uncompress gzip files. Gzip files are single
    files that are compressed with GNU Zip. When you add a zip file, Archive Administrator
    asks you if you want to create an archive to create the files. You can edit the
    files by adding, deleting, storing, viewing, and extracting. You can also use
    Archive Administrator to decompress an archive.


    You can change the settings in Archive Administrator. You can change the Add File
    options, default archive directory, default tar application, and save these settings
    when you exit Archive Administrator. Archive Administrator recognizes file types,
    such as .tar, .tar.lzo, .lzh, .rar, .zoo and The utilities for these file types
    are available on the Web.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_249_0.png)


    # Starting and Exiting Archive Administrator


    You can start and exit Archive Administrator from the Desktop.


    To start Archive Administrator


    +   - Click Application Starter, Applications, Utilities, Archive Administrator.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# To exit Archive Administrator


    +   - Click File, Exit.


    You can also exit Archive Administrator by clicking the Close button.


    # Compressing and grouping files and decompressing archives


    When you group files in an archive you can preserve the file directory paths.
    For example, if you lose files on your computer but have them archived, you can
    open the files using the original path. When you compress, Archive Administrator
    creates an archive that is smaller than the original files. Compressed files take
    up less memory, which lets the computer manage them better. For example, it takes
    less time to copy or move these types of archives. You can compress one large
    file or a group of files, but compressing one file does not significantly reduce
    its size. An archive with grouped files has a .tar file extension and an archive
    with compressed files has a .tar.gz file extension.


    When you open an archive, Archive Administrator decompresses it and you can see
    all the files in an archive in the Archive Administrator window. Decompressing
    an archive lets you make changes to an archive, such as adding or deleting files.


    # To compress or group files into an archive


    +   1 Click File, New Archive.

    2 From the Look In list box, choose a directory for the archive.

    3 Double-click the folder in which you want to store the archive.

    4 Type the filename and file extension (.tar or .tar.gz) of the archive in the
    File Name box.

    5 Click Save.


    You can also click the New button on the toolbar to compress or group files into
    an archive.


    # To decompress an archive


    +   1 Click File, Open Archive.

    2 From the Look In list box, choose the location where the archive is stored.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '3 Double-click the folder in which the archive is stored.

    4 Select the archive name.


    +   - You can also click the Open button on the toolbar to access the Open dialog
    box.

    - You can click File, New Window to open another archive.


    # Editing files in an archive


    You can add or delete files in an archive. Deleting a file is permanent however,
    Archive Administrator prompts before completing the deletion. You can sort the
    files in the archive by Name, Permissions, Owners/Groups, Size, or Date. You can
    also arrange sorted files in ascending or descending order, regardless of the
    sort option you choose.


    Archived files are read-only. You can view an archive, however, if you change
    the contents of the file, you must save the file under a different filename.


    To make changes to a compressed file, for example to edit a text file, you must
    extract the file from the archive and open it in an application. Extracting a
    file makes a copy of that file so if you want to save the changes to its archive,
    you have add it back into the archive.


    # Add to files to an archive


    +   1 Click Application Starter, File Manager.

    2 From the Look In list box, choose the location where the archive is stored.

    3 Double-click the folder in which the archive is stored.

    4 Drag the file from the Corel File Manager window to the Archive Administrator
    window.


    +   - You can add multiple files to an archive by clicking the Add button on the
    toolbar.


    # To delete a file from an archive


    +   1 Select a file.

    2 Click Edit, Delete.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# To sort files in an archive


    +   * Click one of the following headers:

    * Name — sorts the files alphabetically by name

    * Permissions — sorts the files by most or least permissions

    * Owner/Group — sorts the files alphabetically by owner/group

    * Size — sorts the files by smallest or largest size in bytes

    * Date — sorts the files by the most recent or latest date they were created


    # To view a file in an archive


    +   1. Select a file.

    2. Click Edit, View.


    +   * If the file you want to view does not have a MIME type that the computer
    recognizes, you must specify the application that should be used to open it. For
    information about MIME types, see “Adding file associations” on page 122.


    +   * You can also view an archive by clicking the View button on the toolbar.


    # To extract a file from an archive


    +   1. Select a file.

    2. Click Edit, Extract.

    3. In the Destination box, type a file path for the extracted file.

    4. In the Files section, enable the Selected File button.'
  merge: -1
