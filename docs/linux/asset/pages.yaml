    4 Click the Job Queue tab.


    +   * If you are not logged on as the root user, you can switch users by clicking
    Modify and entering your root user password.


    +   * You can also access the print queue by double-clicking the network printer
    from the Installed Printers list, and clicking the Job Queue tab.


    # Canceling print jobs


    You can cancel your own print jobs using the print queue. You must be the root
    user to cancel a print job belonging to another user.


    # To cancel a print job


    +   1 Click Application Starter, Control Center.

    2 Click Printers.

    3 In the Print dialog box, choose the network printer from the Installed Printers
    list, and click Properties.

    4 Click the Job Queue tab.

    5 Choose the print job to cancel from the list, and click Remove.


    +   * If you are not logged on as the root user, you can switch users by clicking
    Modify and entering your root user password.


    +   * You can also access the print queue by double-clicking the network printer
    from the Installed Printers list, and clicking the Job Queue tab.'
