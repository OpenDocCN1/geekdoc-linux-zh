  md: '# To change one of the panel mode


    +   Click one of the following menu items:

    - Left — to change the panel mode of the left directory panel

    - Right — to change the panel mode of the right directory panel


    +   Choose one of the following panel modes:

    - Listing Mode — lets you specify file list options to display, such as Long File
    List, which displays file size, permissions, owner, etc.

    - Quick View — displays the inactive panel the file selected in the current directory
    panel

    - Info — displays complete file or directory information

    - Tree — displays a directory tree structure in one panel. You can view the contents
    of a directory using the tree. The other panel displays the contents of the selected
    directory.


    If you choose Listing Mode, choose a list mode from the Listing mode dialog box.


    # Selecting and tagging files


    You must select a file to perform an action on it. You can select a group of files
    by tagging them. Selected files are highlighted in yellow


    You can also select a group of files using patterns. Patterns can include wildcards.
    For example, typing "*.txt" selects all files with a .txt extension. For information
    about using wildcards, see "Understanding wildcards" on page 299.


    You can also deselect a group of files.


    # To select a file


    +   Click a file in the current directory panel.


    # To select multiple files by tagging


    +   Click a file in the current directory panel, and press CTRL + T.


    +   Click the next file to tag, and press CTRL + T.


    +   Repeat step 2 until all files are tagged.'
