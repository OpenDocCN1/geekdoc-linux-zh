    You can email your technical support service questions and issues to Corel Technical
    Services. This support is available to users in the United States and Canada who
    use English language versions of our products. Corel is committed to responding
    to email support incidents within one business day. However, there may be delays
    associated with the World Wide Web that will prevent an immediate response. Please
