    # To choose a serial device file


    +   1 Click Application Starter, Applications, Network, Dial-Up.

    2 Click the Setup button.

    3 Click the Device tab.

    4 Choose a device from the Modem Device list box.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_352_0.png)


    # Setting modem configuration options


    You can set modem flow control to prevent an overflow of excess data in the modem
    buffer. You can set the line termination method and connection speed (data flow
    rate). Connection speed can be faster than your modem speed, if you enable flow
    control. You can enable Dial-Up to create a lock file when it makes a dial-up
    connection. You can also specify the number of seconds for Dial-Up to wait for
    the “connect” response after dialing to another modem.


    # To set flow control


    +   1 Click Application Starter, Applications, Network, Dial-Up.

    2 Click the Setup button.

    3 Click the Device tab.

    4 From the Flow Control list box, choose one of the following flow options:

    • hardware flow control (CRTSCTS) — uses two dedicated modem control wires to
    send the “stop” and “start” signals

    • software flow control (XON/OFF) — uses the main receive and transmit wires to
    send the start and stop signals

    • no flow control'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# To set line termination


    1 Follow steps 1 to 3 from the previous procedure.


    2 From the Line Termination list box, choose one of the following line termination
    sequences:


    +   - CR (Carriage Return) — recognizes a carriage, or hard return character as
    the end of a line of input data

    - LF (Line Feed) — recognizes the line feed character sequence as the end of a
    line of input data

    - CR/LF (Carriage Return/ Line Feed) — recognizes either carriage return or line
    feed characters as the end of a line of input data


    # To set connection speed


    1 Follow steps 1 to 3 from the “To set flow control” procedure.


    2 Choose a connection speed from the Connection Speed list box.


    # To create a lock file


    1 Follow steps 1 to 3 from the “To set flow control” procedure.


    2 Enable the Use Lock File check box.


    # To set modem timeout


    1 Follow steps 1 to 3 from the “To set flow control” procedure.


    2 In the Modem Timeout box, type the number of seconds for Dial-Up to wait for
    the “connect” response after dialing to another modem.


    # Setting busy signal timer and modem volume


    You can specify how long the modem waits to disconnect when it receives a busy
    signal during dial-up. You can adjust the volume of the sound the modem makes
    when it dials.


    # To set the busy signal timer


    1 Click Application Starter, Applications, Network, Dial-Up.


    2 Click the Setup button.


    3 Click the Modem tab.


    4 In the Busy Wait box, type the number of seconds for the modem to wait before
    timing out.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_353_0.png)'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# To set the modem volume


    I Follow steps 1 to 3 from the previous procedure.

    2 Drag the Modem volume slider to the right to increase modem volume and to the
    left to decrease modem volume.


    # Editing modem commands


    You can edit the preset modem commands that Dial-Up runs during the dial-up process.
    You can set modem commands to execute a script or program when you connect to
    the server, before you disconnect, or when you disconnect.


    # To edit modem commands


    +   I Click Application Starter, Applications, Network, Dial-Up.

    2 Click the Setup button.

    3 Click the Modem tab.

    4 Click the Modem Commands button.

    5 Edit the default modem commands in the Edit Modem Commands dialog box.


    # To execute modem commands during the connection process


    +   I Follow steps 1 and 2 from the previous procedure.

    2 Click the Accounts tab.

    3 Choose a dial-up account from the list and click the Edit button.

    4 Click the Dial tab.

    5 Type a command in any of the following boxes:


    +   * Execute Program Upon Connect

    * Execute Program Before Disconnect

    * Execute Program Upon Disconnect


    > The commands you use to execute programs during the dial-up process are usually
    modem commands. For more information on basic modem commands, see “Configuring
    modems” on page 340.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Querying the modem


    You can query the modem to make sure that the operating system recognizes the
    modem. Querying the modem also displays the modem''s hardware information.


    # To query the modem


    +   - Click Application Starter, Applications, Network, Dial-Up.

    - Click the Setup button.

    - Click the Modem tab.

    - Click the Query Modem button.


    +   - An error message appears if the query cannot detect the modem. The modem
    cannot be detected if there is no modem installed, or if the serial device is
    not set properly. For more information on setting the serial device, see "Choosing
    a serial device" on page 343.


    # Using the Dial-Up Mini-Terminal


    You can open the Dial-Up Mini-Terminal to control the modem manually. You can
    edit any of Dial-Up''s preset initialization commands. For example, you can type
    commands in the Dial-Up Mini-Terminal window to modify modem dial tone or hang-up
    responses, initialize a dial-up connection, or terminate a connection. You can
    also reset the modem.


    # To open the Dial-Up Mini-Terminal


    +   - Click Application Starter, Applications, Network, Dial-Up.

    - Click the Setup button.

    - Click the Modem tab.

    - Click the Terminal button.


    # To manually control the modem in the Dial-Up Mini-Terminal


    +   - Follow steps 1 to 4 from the previous procedure.

    - Type a modem command in the Mini-Terminal window.

    - Press ENTER.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# To reset the modem


    1 Follow steps 1 to 4 from the “To open the Dial-Up Mini-Terminal procedure.


    2 Click Modem, Reset.


    +   - If Dial-Up cannot open your modem, it will not let you type in the Dial-Up
    Mini-Terminal window. For more information about setting up your modem, see “Configuring
    modems” on page 340.


    +   - To reset the modem in the Dial-Up Mini-Terminal window, you can also click
    the Reset Modem button.


    # Configuring Dial-Up preferences


    Dial-Up preferences describe how Dial-Up appears and behaves on your desktop.
    The PPP daemon (pppd) stops trying to make a connection after a specified amount
    of time, if it encounters a busy signal. You can set the amount of time pppd waits
    for information to be transmitted before timing out and becoming idle. You can
    set Dial-Up to redial if the connection is interrupted, or to terminate the connection
    and disconnect the modem when the server shuts down. Displaying a clock in the
    Connection Window lets you track the amount of time you have been connected. Setting
    Dial-Up to minimize or dock to the Panel when it makes a connection places the
    clock on the Panel.


    You can also customize the colors that appear in the throughput graph. The throughput
    graph displays the amount and speed of data flowing from your connection.


    # Setting Dial-Up preferences


    You can customize Dial-Up by setting connection preferences. You can set Dial-Up
    to do the following:


    +   - time out and become idle after a specified amount of time

    - minimize or dock to the Panel when it makes a connection

    - automatically redial the connection upon disconnect

    - display a clock showing the length of time you are connected

    - disconnect if the server shuts down

    - quit when it disconnects from the server'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# To set pppd timeout


    +   1 Click Application Starter, Applications, Network, Dial-Up.

    2 Click the Setup button.

    3 Click the PPP tab.

    4 In the Pppd Timeout box, type the number of seconds for pppd to wait before
    timing out.


    # To set Dial-Up options


    +   1 Follow steps 1 to 3 from the previous procedure.

    2 Enable the check box for any of the following preferences:

    * Dock Into Panel On Connect — the Dial-Up window docks to the Panel when it makes
    a server connection

    * Automatic Redial On Disconnect — Dial-Up automatically redials the connection
    if the connection is disconnected

    * Show Clock On Caption — the connection window displays a clock; it tracks the
    amount of time you are

    * Disconnect On X-server Shutdown — Dial-Up disconnects from the server when your
    computer''s X-server (the Desktop) shuts down

    * Quit On Disconnect — Dial-Up quits automatically when it disconnects from a
    server

    * Minimize Window On Connect — the Dial-Up window minimizes and becomes an icon
    on the taskbar when it connects to a server


    # Customizing throughput graph colors


    You can change the color of the data displayed on the throughput graph. You can
    change the background and text color, and the color of the input bytes and output
    bytes information. You can choose colors from the preset System Colors palette,
    or choose a custom color.


    # To set a background color for the throughput graph


    +   1 Click Application Starter, Applications, Network, Dial-Up.

    2 Click the Setup button.

    3 Click the Graph tab.

    4 Click the Background button.

    5 Choose a color from the System Colors palette.'
  merge: -1
  img_proc: true
