    (cat) to create files by taking the input you provide to the shell and redirecting
    it as output, see “Redirecting input and output”... The cat command can also combine
    several files into one file.


    You can use command options with the touch and cat commands. For a list of command
    options, see the Manual pages for each command.


    # To create a file using the touch command


    +   1 At the command line, type,


    ```

