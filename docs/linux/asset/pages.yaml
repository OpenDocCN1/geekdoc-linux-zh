- pgno: 58
  md: '# 5 Customizing Corel LINUX settings


    Corel LINUX lets you personalize the look and feel of your desktop environment.
    The background color, wallpaper, hyperlink and window color scheme, font types,
    and screen savers are all customizable. The Theme Manager lets you apply a common
    design theme to your desktop. You can choose sounds for Corel LINUX to play when
    you perform an action on the desktop. Changing the buttons, colors and text fonts
    on window Title Bars gives the windows a personalized look. You can change the
    appearance of the fonts on other areas of the desktop, too. Customizing the sizing
    and placement options for windows helps you to maximize the working space on your
    desktop.


    The Application Starter menu, Quick Start menu and Panel are parts of the desktop
    that you use to access most utilities and applications. Customizing the items
    that appear on these menus makes it easy to quickly access the directories and
    applications you use most frequently. The date and time appear on the Panel; you
    can reset the time and date, and change the time setting zone.


    The Virtual Desktop Manager also appears on the Panel. You can change the number
    of virtual desktops to use, and rename each of the virtual desktops. You can customize
    border behavior or set magic borders for the desktops. Placing shortcut icons
    on the desktop lets you quickly access directories and'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'files. You can create or delete shortcut icons, and change their size, font,
    color and spacing on the desktop.


    Keyboard and mouse setting that you can customize include button behavior, shortcut
    keys, and international keyboard language maps. You can change the actions of
    the right and left mouse buttons, change the default shortcut keys or create new
    ones, and choose from a variety of language settings for the keyboard and desktop.
    Corel LINUX has several different languages available that you can apply to the
    desktop so the menu items display in the chosen language. It also has different
    international keyboard language maps you can choose from. International keyboard
    language maps are useful if you want to type in a language other than English.
    Setting a keyboard language map assigns special characters to the keys of the
    keyboard that correspond to letters of the alphabet in the language you have set.


    # Customizing desktop settings


    Corel LINUX lets you customize the desktop''s display and behavior. The Control
    Center lets you create up to eight virtual desktops. You can customize desktops
    by changing colors, typefaces, fonts, and the shortcut icons for each desktop.


    You can set a background color or wallpaper for your desktop, or you can choose
    preset or rotating colors and wallpaper patterns for backgrounds. The Common Backgrounds
    feature lets you set one color or two blended colors, or a wallpaper background
    for all virtual desktops. You can specify the amount of partition space (memory)
    that Corel LINUX uses to maintain the backgrounds. Background color schemes apply
    matching colors to all the parts of the window, like the active Title Bar, the
    text and the title text. Corel LINUX has preset color schemes you can choose from,
    or you can customize color schemes by choosing specific colors from the System
    or Custom Color menus.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'You can customize the colors of different parts of the desktop using the Display
    dialog in the Center.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_60_0.png)


    You can choose from a number of pre-installed screen savers to apply to your desktop.
    You can customize the colors that appear in the screen saver, and change the speed
    at which the screen saver image moves over the screen. Testing a screen saver
    lets you see how it looks, before you apply it. Corner hotspots are on your computer
    screen that you use to quickly start the screen saver or the password protect
    feature, which increases your system security. When hot spots are enabled, moving
    the cursor to the specified "hot" corner starts the screen saver or password protect.


    The Theme Manager lets you apply a theme to your desktop that coordinates colors
    and fonts on the desktop areas according to a common design style. A theme customs
    the background or wallpaper, sounds, icons, window borders, and Title Bars according
    to the design style. You can choose from preset desktop themes, or apply a theme
    from another file source.


    # Setting background colors


    You can customize the background colors of the virtual desktops. You can choose
    one background color, or two colors that you can blend or arrange in patterns.
    You can choose from the System Colors fixed palette, or a custom color.


    # To set background color to one color


    +   1 Application Starter, Control Center.

    2 Double-click Desktop, and click Background.

    3 Enable the One Color button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_60_1.png)


    Customizing Corel LINUX settings 51'
  merge: -1
  img_proc: true
- pgno: 61
  md: '+   4 Click the colored button below the One button.


    +   5 From System Colors, choose a color by clicking a colored square.


    # To set background to two colors


    +   1 Follow steps 1 and 2 from the previous procedure.


    +   2 Enable the Two Color button.


    +   3 Click the colored button below the Two Color button.


    +   4 From System Colors, choose a color by clicking a colored square.


    +   5 Click Setup, and enable one of the following buttons:


    +   - Blend Colors From Top To Bottom — blends the selected colors from the top
    of the screen to the bottom


    +   - Blend Colors From Right To Left — blends the selected colors from the right
    side of the screen to the left


    +   - Use Pattern — lets you choose a pattern style from the Pattern Name list
    box


    ![](img/86803f2a30e88fe6e62989f0fe100a53_61_0.png)


    +   - To set the background to one or two colors, Wallpaper must be set to No
    Wallpaper.


    # To choose a custom color for the background


    +   1 Follow steps 1 to 4 from the “To set one background color” procedure.


    +   2 Choose an empty box from Custom Colors.


    +   3 Click a color region on the Color Palette.


    +   4 Click the Add To Custom Colors


    ![](img/86803f2a30e88fe6e62989f0fe100a53_61_1.png)


    +   - You can set background colors by right-clicking the Display Settings button
    on the Panel, then clicking Display Settings or Background Settings.


    # Choosing desktop wallpaper


    You can choose wallpaper for your desktop. Wallpaper is placed over the background
    color; it can cover the entire background, or you can place it in the middle,
    with the background color showing around the edge of the wallpaper. You can choose
    pre-installed wallpaper or a wallpaper from another'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'file source, such as a graphic file (.gif, .bmp for example) located on your
    computer or file system. You can set the wallpaper to appear in one of the following
    arrangement styles:


    +   - tiled — the wallpaper graphic covers the desktop in repeating rows


    +   - mirrored — the wallpaper graphic covers the desktop in repeating mirrored
    pairs


    +   - center tiled — the wallpaper graphic appears centered on the desktop, with
    that repeat more frequently then the mirrored style setting


    +   - centered — the wallpaper graphic appears centered on the desktop, with the
    background color visible around the perimeter of the desktop


    +   - center warped — the wallpaper graphic appears centered on the desktop, with
    patterns of color spreading outward from the graphic


    +   - symmetrical tiled — similar to tiled


    +   - symmetrical mirrored — similar to mirrored


    +   - scaled — the wallpaper graphic is stretched to fit across the whole desktop


    When you choose any of these styles, a preview of the wallpaper and style appears
    in a preview window in the Background window.


    You can make the desktop cycle through a random sequence of wallpaper backgrounds
    at preset time intervals. You can edit the list of wallpaper backgrounds, and
    you can set the timer delay for the intervals. Corel LINUX also lets you set the
    order of the wallpaper sequence.


    # To choose pre-installed wallpaper


    +   1 Click Application Starter, Control Center.


    +   2 Double-click Desktop, and click Background.


    +   3 Choose a wallpaper file from the Wallpaper list box.


    # To choose wallpaper from another file source


    +   1 Follow steps 1 and 2 from the previous procedure.


    +   2 Click the Browse button under the Wallpaper list box.


    +   3 Navigate to the graphic file located on your file system that you want to
    install as wallpaper.


    +   4 Click OK.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# To choose a wallpaper arrangement style


    +   1 Follow steps 1 and 2 the steps from the “To choose pre-installed wallpaper”
    procedure.


    +   2 Choose a style from the Arrangement list box.


    # To enable a random wallpaper sequence


    +   1 Follow steps 1 and 2 from the previous procedure.


    +   2 Enable the Random check box.


    # To add files to the random wallpaper sequence


    +   1 Follow steps 1 and 2 from the “To choose wallpaper” procedure.


    +   2 Click the Setup button.


    +   3 Click the Add button.


    +   4 Choose a wallpaper file to add to the random wallpaper sequence.


    +   5 Click OK, then click OK again.


    +   6 Enable the Random check box.


    # To set the timer delay in a random wallpaper sequence


    +   1 Follow steps 1 and 2 from the “To enable a random wallpaper sequence” procedure.


    +   2 Click the Setup button.


    +   3 Type a number in the Timer Delay In Seconds box.


    # To cycle through the wallpaper sequence in a set order


    +   1 Follow steps 1 and 2 the steps from the “To choose pre-installed wallpaper”
    procedure.


    +   2 Choose a style from the Arrangement list box.


    +   3 Enable the Random check box.


    +   4 Click the Setup button.


    +   5 Enable the In Order check box.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'You can choose wallpaper files from other sources by enabling the Pick Files
    From Directory check box, and then clicking the Browse button to open a file navigator.


    You can set background colors by right-clicking the Display Settings button on
    the Panel, then clicking Display Settings or Background Settings.


    # Choosing color schemes for the desktop


    You can choose a color scheme for the desktop. You can choose a preset color scheme,
    or create a color scheme by choosing colors for individual window items (widgets),
    like the inactive Title Bar, the active title text, or window background. You
    can choose colors from System Colors or Custom Colors menus. You can adjust the
    color contrast for the scheme.


    # To choose a color scheme


    +   - Click Application Starter, Control Center.

    - Double-click Desktop, and click Display.

    - Choose a color scheme from the Color Scheme list box.


    # To customize a color scheme


    +   - Follow all the steps from the previous procedure.

    - Click the Add button, and type a name for the new color scheme in the box.

    - Choose a window item from the Widget Color list box.

    - Click on the colored button below the Widget Color list box.

    - Choose a color by clicking on a colored square from System Colors.

    - Click the Save Changes button.


    # To choose a custom color


    +   - Follow steps 1 to 3 from the "To choose a color scheme" procedure.

    - Choose an empty box from Custom Colors.

    - Click a color region on the Color Palette.

    - Click the Add To Custom Colors button.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# To change the color contrast


    +   1 Follow all the steps from the “To choose a color scheme” procedure.

    2 Move the Contrast slider to the left to decrease contrast, and to the right
    to increase contrast.


    +   * You can set background colors by right-clicking the Display Settings button
    on the Panel, clicking Display Settings, then the Colors tab.


    # Choosing a screen saver


    You can choose a screen saver for your desktop. The screen saver displays in a
    preview screen. Each screen saver has different setup options. For example, some
    screen savers let you customize the colors that appear in the screen saver; others
    let you change the speed at which the screen saver image moves on the screen.
    You can test a screen saver to see how it will appear.


    # To choose a screen saver


    +   1 Click Application Starter, Control Center.

    2 Double-click Desktop, and click Screen Saver.

    3 Choose a screen saver from the Screen Saver list box.


    # To change the setup for a screen saver


    +   1 Follow steps 1 to 3 from the previous procedure.

    2 Click the Setup button.

    3 Change either of the following settings:


    +   * Color

    * Speed


    # To test a screen saver


    +   1 Follow steps 1 to 3 from the “To choose a screen saver” procedure.

    2 Click the Test button.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '• You can set background colors by right-clicking the Display Settings button
    on the Panel, clicking Display Settings, then the Screensaver tab.


    # Customizing screen saver settings


    You can customize the settings for your screen saver. You can change the screen
    saver delay time and password. If you have set a password for your screen saver,
    Corel LINUX prompts you to type your login password to stop the screen saver and
    return to the desktop. You can also set the priority of screen savers in relation
    to other processes running on the system. For example, setting a high priority
    for a screen saver causes the screen saver to become active instead of a lower
    priority process if there is only enough memory on your computer to run one or
    the other. For more information on running processes, see “Monitoring system processes
    and performance” on page 124.


    # To set the screen saver delay time


    +   1 Click Application Starter, Control Center.

    2 Double-click Desktop, and click Screen Saver.

    3 Type the delay time before the screen saver starts, in the Wait For spin box.


    # To set a screen saver saver password


    +   1 Follow steps 1 and 2 from the previous procedure.

    2 Enable the Require Password check box.


    # To set the screen saver priority level


    +   1 Follow steps 1 and 2 from the “To to set the screen saver delay time” procedure.

    2 Move the Priority slider to the left to set a higher priority, or right to set
    a lower priority.


    • You can set background colors by right-clicking the Display Settings button
    on the Panel, clicking Display Settings, then the Screensaver tab.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Setting corner hot spots


    You can enable hot spot shortcuts in the corners of the screen to easily activate
    your screen saver or lock the screen. Positioning the cursor in one of the hot
    spots starts the screen saver. You can also set hot spots to lock the screen and
    set each of the four hot spots individually. You can also disable corner hot spots.


    # To enable a screen saver corner hot spot


    +   1 Click the Application Starter, Control Center.

    2 Double-click Desktop, and click Screen Saver.

    3 Right-click a corner in the Preview Monitor display.

    4 Click Save Screen.


    # To enable a lock screen corner hot spot


    +   1 Follow steps 1 to 3 from the previous procedure.

    2 Click Lock Screen.


    # To disable the corner hot spots


    +   1 Follow steps 1 to 3 from the “To enable a screen saver corner hot spot”
    procedure.

    2 Click Ignore.


    > You can set background colors by right-clicking the Display Settings button
    on the Panel, clicking Display Settings, then the Screensaver tab.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_67_0.png)


    # Choosing a desktop theme


    Applying a theme to your desktop customizes the appearance of multiple parts of
    your desktop according to a common design theme. Setting a theme changes the color,
    wallpaper, sounds, window borders, Title Bars and window button layouts of the
    desktop. Corel LINUX has several preset desktop themes in the Theme Manager that
    you can use. You can preview a theme to see how it looks, and apply it to your
    desktop. When you apply a desktop theme, you can choose which elements of the
    scheme to customize. You can add themes to the Theme Manager from other file sources
    such as a desktop theme that you have downloaded to your file system from the
    Internet. You can also remove desktop themes.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# To preview pre-installed desktop themes


    +   1 Click Application Starter, Control Center.


    +   2 Double-click Desktop, then click Theme Manager.


    +   3 On the Installer tab, click the name of a theme from the list on the left
    side of the window.


    A preview of the desktop theme appears to the right of the themes list, showing
    how your desktop will look.


    # To customize a pre-installed desktop theme


    +   1 Follow steps 1 to 3 from the previous procedure.


    +   2 Click the Contents tab.


    +   3 Disable the checkbox beside any desktop element in the list that you do
    not want to be changed on your desktop.


    +   * When you apply a desktop theme, all the elements of the desktop, like the
    colors, wallpaper, panels, icons, window border, are changed according to the
    theme you choose. When you disable an element on the Contents tab, that element
    retains its default desktop settings.


    # To apply a desktop theme


    +   1 Follow steps 1 to 3 from the “To preview pre-installed desktop themes” procedure.


    +   2 Click Apply.


    # To remove a desktop theme


    +   1 Follow steps 1 to 3 from the “To preview pre-installed desktop themes” procedure.


    +   2 Click Remove.


    # To add a desktop theme to the Themes Manager


    +   1 Click Application Starter, Control Center.


    +   2 Double-click Desktop, then click Theme Manager.


    +   3 Click Add.


    +   4 Navigate to the location of the desktop theme file in your file system,
    click OK.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '+   - A theme must have the extension .tar.gz or .gz. The extensions indicate
    that the file is compressed, or zipped. For more information about compressed
    files, see “Using Archive Administrator” on page 240.


    # Setting desktop styles


    You can set Windows 95 and Macintosh OS styles on your desktop. You can have your
    widgets drawn in the style of Windows 95. You can also place the menu bar on top
    of the screen in Macintosh OS style. Your font and color settings can be applied
    to the windows of third party applications.


    # To draw widgets in the style of Windows 95


    +   1 Click Application Starter, Control Center.

    2 Double-click Desktop, and click Style.

    3 Enable the Draw Widgets In The Style Of Windows 95 button.


    # To place the menu bar on top of the screen in the style of Macintosh OS


    +   1 Follow steps 1 and 2 from the previous procedure.

    2 Enable the Menu bar On Top Of The Screen In The Style Of MacOS button.


    # To apply fonts and colors to Non-Core LINUX applications


    +   1 Follow steps 1 and 2 from the “To draw widgets in the style of Windows 95”
    procedure.

    2 Enable the Apply Fonts And Colors To Non-KDE Apps button.


    # Setting desktop sounds


    You can set a sound to play when you perform an example on the desktop. For example,
    you can set a beep to sound when you change to desktop four, when you open a window,
    or unstick a window. There are several different system sounds you can choose
    to apply to the desktop actions. You can test the sounds before you apply them
    to your desktop settings. You can set the volume, pitch and duration of the sound
    that plays. Changing the volume makes the sound louder or quieter. Changing the
    pitch makes the sound higher or lower. Changing the duration makes the sound play
    for a longer or shorter amount of time.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# To enable system sounds


    +   1. Click Application Starter, Control Panel.

    2. Double-click Sound, and click System Sounds.

    3. Enable the Enable System Sounds check box.


    # To apply a system sound to a desktop action


    +   1. Click Application Starter, Control Panel.

    2. Double-click Sound, and click System Sounds.

    3. From the Events list, choose the desktop action where you want to apply a sound.

    4. From the Sounds list, choose the sound you want to play when the desktop action
    is is performed.


    # To test a system sound


    +   1. Follow steps 1 to 4 from the previous procedure.

    2. Click the Test button.


    # To set the volume, pitch, and duration of the system sound


    +   1. Click Application Starter, Control Panel.

    2. Double-click Sound, and click Bell.

    3. Drag the Volume slider, Pitch slider, and Duration slider to increase or decrease
    the volume, pitch and duration of the sound.


    > You must have a sound card installed on your system to be able to hear the desktop
    sounds.


    # Working with fonts


    Fonts are character sets that contain a typeface and size. A typeface refers to
    the style of a character set, such as Helvetica, Courier, and Times Roman. Most
    typefaces can be modified using bold, italics, bold italic, or normal weight.


    Corel LINUX desktop applies different fonts to different areas of the desktop.
    For example, the standard font text for the Title Bar of an Application Window
    is Helvetica. You can choose which fonts display in different areas of the desktop.'
  merge: -1
  img_proc: true
- pgno: 71
  md: "The fonts available to use with Corel LINUX applications are listed in the\
    \ Font Manager. The Font Manager works in combination with the Font dialog box\
    \ in the Control Center. All fonts available in the Font Manager are available\
    \ in the Font dialog box and can be used on the desktop or desktop applications.\
    \ You can customize the font list in the Font Manager so that only the fonts you\
    \ choose are available in the Font dialog box and other desktop applications.\
    \ For more information about the Font Manager, see “Managing fonts” on page 286.\n\
    \n# Changing desktop fonts\n\nCorel LINUX applies different fonts to different\
    \ areas of the desktop. For example\n\nWhen you choose a font, you can choose\
    \ the typeface, font size, and style attributes, such as bold and italics.\n\n\
    # To change the font typeface\n\n+   1 Click Application Starter, Control Center.\n\
    2 Double-click Desktop, and click Fonts.\n3 From the list, choose one of the following\
    \ desktop text areas:\n   * General Font\n   * Fixed Font\n   * Window Title Font\n\
    \   * Panel Clock Font\n4 Choose a typeface from the Typeface list box.\n\n# To\
    \ change the font size\n\n+   1 Follow steps 1 to 3 from the previous procedure.\n\
    2 In the Size box, click the plus button (+) to increase the font size, or the\
    \ minus (-) button to decrease the font size."
  merge: -1
  img_proc: true
- pgno: 72
  md: '# To change font style attributes


    Follow steps 1 to 3 from the “To choose desktop fonts” procedure.


    Enable any of the following buttons:


    +   - Bold


    +   - Italics


    You can set background colors by right-clicking the desktop, the Display Settings
    button on the Panel, clicking Display Settings, then the Fonts tab.


    # Customizing Corel LINUX


    Corel LINUX lets you customize the appearance and performance properties of windows.
    You can specify a shortcut key that lets you switch to a different virtual desktop
    and cycle through the desktops. You can set a control key that switches active
    windows on a desktop.


    Filter settings let you configure windows separately from the default window.
    A window has the following default properties: it is active when you open it;
    its decorations are visible; it is not sticky (only appears on the desktop on
    which you open it); and it is included in session management. When Core LINUX
    remembers the window was open when you shut down the desktop, and reopens it when
    you start a new desktop session. You can create a filter and apply it to a window
    based on your window''s title or class, so that a window with the matching title
    or class automatically has that filter''s display properties. For example, you
    can apply a filter that opens a window title CD Player as a sticky window, so
    that it remains on the desktop when you switch virtual desktops. Or, you can apply
    a filter so that when you open a Text Editor window, it displays no decorations
    and is not included in session management.


    You can specify the size of windows on the desktop, where they are placed when
    you open them, and how they are arranged on the desktop. Options include smart,
    cascade, interactive, random, and manual. You can customize how you activate (focus)
    windows. The active window is the window on the desktop that receives keyboard
    input and has an active Title Bar.


    You can customize the arrangement of window Title Bar buttons, and you can customize
    which Title Bar buttons appear on an open window. You can show, hide or change
    the placement of the Iconify, Maximize, Sticky, Close, and Menu buttons.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'You can specify the appearance of the Title Bar. You can choose the font that
    appears in the Title Bar and can use pixmaps and shading to customize the background
    color of window Title Bars. A pixmap contains graphics or color that you can use
    to decorate the Title Bar of a window.


    You can customize the look of application windows by moving the menu bars and
    toolbars. A menu bar toolbar is found at top of application windows under the
    Title Bar. A toolbar is generally located under the menu bar, although some windows
    do not have a toolbar. The menu bar provides access to all the commands available
    within that application window using drop down menus. The toolbar provides shortcut
    icons to the most frequently used menu options. The handle on the menu bar and
    toolbar lets you drag the bars to different areas of the application window or
    desktop.


    # Switching windows and virtual desktops


    You can set a control key that lets you cycle through the virtual desktops. With
    the control key enabled, pressing CTRL + TAB switches virtual desktops. You can
    set a control key to switch between active windows on the current desktop. With
    this control key set, pressing ATL + TAB switches between active windows.


    # To set a control key to cycle through virtual desktops


    +   1 Click Application Starter, Control Center.

    2 Click Windows, Advanced.

    3 Enable or disable the Ctrl-Tab Walks Through Desktops button.


    # To set a control key to switch active windows


    +   1 Follow steps 1 and 2 from the previous procedure.

    2 Enable or disable the Alt-Tab Is Limited To Current Desktop button.


    # Setting window filters


    You can change the default settings of filters and apply them to windows according
    to title or class. A window with the defined title or class displays the specified
    filter properties. Removing a window filter from a specific window title or class
    removes that display property from all the windows that have title or class.


    # To set window filters according to the window title


    +   1 Click Application Starter, Control Center.

    2 Double-click Windows, and click Advanced.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_73_0.png)'
  merge: -1
  img_proc: true
- pgno: 74
  md: '3 Choose any of the following window filter properties from the Windows Will
    list box:


    +   * Have Tiny Decorations

    * Have No Decorations

    * Never Gain Focus

    * Start As Sticky

    * Be Excluded From The Session Management


    4 Type a window title in the Titles box.


    5 Click the plus button (+).


    # To set window filters according to window class


    +   1 Follow steps 1 and 2 from the previous procedure.


    +   2 Choose the window filter properties you want from the Windows Will list
    box.


    +   3 Type the name of a window class in the Classes box.


    +   4 Click the plus button (+).


    # To remove window filter properties


    +   1 Follow steps 1 and 2 from the “To set window filters according to the window
    title” procedure.


    +   2 Choose a window filter property from the Windows Will list.


    +   3 From the Titles or Classes list, double-click the window title or class
    which you want to remove the filter property.


    +   4 Click the minus button (-) to remove the title or class from the filter
    list.


    # Setting window size properties


    You can set the resize and display properties for windows. You can set the speed
    at which a window resizes when you maximize or minimize it.


    # To set window sizing properties


    +   1 Click Application Starter, Windows.


    +   2 Click Properties.


    +   3 Enable any of the following Windows options:'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   - Vertical Maximization Only By Default — the maximize button expands vertically
    only, to the full height of the screen, when you click it


    +   - Display Content In Moving Windows — content in a window you drag across
    the desktop appears to move with the window. If this option is not selected, the
    frame of the window moves, but the content remains stationary until you drag the
    window on the desktop.


    +   - Display Content In Resizing Windows — content in a window that you resize
    by dragging its corner appears to resize with the window. If this option is not
    selected, the window appears to resize, but the content does not change until
    you have completed resizing the window.


    # To set the window resize speed


    +   1 Follow steps 1 and 2 from the previous procedure.


    Move the Resize Animation slider to set the resize speed. Move it to the left
    for slower or no animation, or to the right for faster animation.


    # Setting window placement options


    You can customize the placement of windows on the desktop. You can choose the
    amount of overlap that the interactive placement setting allows for switching
    to manual mode. The amount of overlap is shown in percent of desktop space.


    # To set window placement


    +   1 Click Application Starter, Windows.


    +   2 Click Properties.


    +   3 Choose one of the following window placement styles from the Placement Policy
    list box:


    +   - Smart — places a new window on the largest empty desktop area


    +   - Cascade — places a new window on top of the previously opened window, so
    the Title Bar of each window is visible


    +   - Random — places windows randomly on the desktop


    +   - Manual — opens a new window at the same location as the cursor. The window
    moves with the cursor until you click


    +   - Interactive — places a window in an empty area of the desktop; if no areas
    are available, you must place the window manually'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# To set allowed overlap of windows for the Interactive window placement option


    1 Follow steps 1 and 2 from the previous procedure.

    2 Click the plus (+) or minus (-) button beside the Allowed Overlap box to increase
    or decrease the percent of desktop space allowed for window overlap.


    +   - You can set the allowed amount of overlap only for the Interactive placement
    option.


    # Setting window focus options


    You can customize the window focus options. A focused window is the window that
    is active.

    The auto raise option automatically places an active window in the front of other
    windows. You can set an auto raise delay for the focus options, except Click To
    Focus. When you position the cursor inside an active window, the window becomes
    active after the specified delay time.

    You can set the click raise option to let you activate a window even if the Click
    To Focus option is not selected. Right-clicking the mouse inside a window activates
    the window.


    # To set the window focus


    1 Click Application Starter, Windows.

    2 Click Properties.

    3 Choose one of the following focus styles from the Focus Policy list box.


    +   - Click To Focus — lets you click the mouse inside a window to activate the
    window

    - Focus Follows Mouse — lets you position the cursor inside a window without clicking
    to activate it

    - Classic Focus Follows Mouse — lets you position the cursor in a window to activate
    the window. The active window becomes inactive when cursor leaves the window.

    - Classic Sloppy Focus — lets you position the cursor in a window to activate
    the window. The active window remains active until the cursor enters another window.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# To set the auto raise option


    +   1 Follow all the steps from the previous procedure.

    2 Enable the Auto Raise button.


    # To set focus delay


    +   1 Follow all the steps from the “To set the window focus” procedure.

    2 Move the Delay slider to the right to increase the focus delay time, or to the
    left to decrease the delay time.


    # To set click raise options


    +   1 Follow all the steps from the “To set the window focus” procedure.

    2 Enable the Click To Raise button.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_77_0.png)


    +   * The Click To Raise and Auto Raise options are not available when you choose
    the Click To Focus option.

    * You must enable the Auto Raise option to set the focus delay time.


    # Setting Title Bar preferences


    You can center the title in the Title Bar, or align it to the right or left. You
    can change the direction of Title Bar shading. A title that is too long to fit
    in a window''s Title Bar becomes animated and scrolls across the Title Bar. You
    can define the speed of the Title Bar animation. You can define the action of
    the window when you click it.


    # To set the title alignment


    +   1 Click Application Starter, Control Center.

    2 Click Windows, Title Bar.

    3 Enable the Left, Middle, or Right button in the Title Alignment box.


    # To set the window shading


    +   1 Follow steps 1 and 2 from the previous procedure.

    2 Enable one of the following buttons in the Appearance box:

    * Shaded Vertically

    * Shaded Horizontally'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   • Plain


    +   • Pixmap


    Enable or disable the Active Title Has Shaded Frame check box.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_78_0.png)


    When you enable Pixmap, the Pixmap box becomes active. For information about setting
    pixmaps, see “Working with Title Bar pixmaps” on page 70.


    # To set title animation


    +   Follow steps 1 and 2 from the “To set title alignment” procedure.


    +   Move the Title Animation slider to the left to increase title animation speed,
    or to the right to decrease title animation speed.


    # To set the action in a Title Bar


    +   Follow step 1 and 2 from the “To set the title alignment” procedure.


    +   Choose one of the following actions from the Left Button Double Click Does
    list box:


    +   • (Un)Maximize


    +   • (Un)Shade


    +   • Iconify


    +   • (Un)Sticky


    +   • Close


    # Customizing window Title Bar buttons


    You can customize the location of the control buttons that are displayed on the
    Title Bar.


    # To customize window Title Bar buttons


    +   Click Application Starter, Control Center.


    +   Click Windows, Buttons.


    +   Enable the Right, Left, or Off button for each of the following Title Bar
    buttons:


    +   • Minimize — displays the window as a taskbar button on the taskbar


    +   • Maximize — expands the window to the full size of the screen


    Customizing Corel LINUX settings


    69'
