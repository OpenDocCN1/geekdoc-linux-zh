- pgno: 49
  md: 'application buttons, see "Customizing application buttons on the Panel" on
    page 79.


    +   - You can also start applications from the Desktop Window using application
    shortcuts. For information about creating application shortcuts, see "Creating
    a shortcut on the desktop" on page 85.


    # # Starting applications using Autostart


    You can use Autostart to start specific applications automatically each time you
    log on. Autostarts that start automatically are located in the Autostart folder
    in your home directory.


    Using the Core File Manager, you must copy the application that you want to start
    automatically to the Autostart folder. Copying the application creates a link
    to the Autostart folder to the application. The applications in the Autostart
    folder start automatically the next time you log on to the Core LINUX desktop.
    For information about copying files using the Core File Manager, see "Moving and
    copying directories and files" on page 146.


    You can stop an application from starting automatically by removing the application
    from the Autostart folder.


    # To start applications using Autostart


    +   - 1 Click Application Starter, Autostart.


    +   - 2 Click View, Tree to see the directories in the file system.


    +   - 3 In the Core File Manager, locate the application that you want to start
    automatically.


    +   - 4 Drag the application to the Autostart folder.


    # To stop applications from starting automatically


    +   - 1 Click Application Starter, Autostart.


    +   - 2 Right-click the application that you want to remove, and click Move To
    Trash.


    > Moving the application to the Trash removes the link to the application, but
    does not delete the application from your computer.


    ![](img/86803f2a30e88fe6e62989f0fe100a53_49_0.png)'
