- pgno: 288
  md: '# ## Is your Ethernet hub or switch working?


    Your Ethernet hub or switch should also be turned on. Ensure that the network
    cables are also connected securely.


    ![](img/8c094d1b36276212c03d10d898508a6e_288_0.png)


    If you''re stuck in the Middle Ages (with us) and are using that coaxial network
    cable named Thinnet \u2014 or 10Base-2, for geeks \u2014 you don''t have to check
    an Ethernet switch or hub because you don''t have one. Thinnet connects each NIC
    (computer and printer, for example) to every other NIC on the subnet. In other
    words, each computer that is on a Thinnet cable is connected electrically to all
    other computers in the network. Each computer sees all the network traffic on
    that cable. If any part of that bus is compromised, all traffic ceases. For example,
    if you disconnect the terminator at either end of the cable, all communication
    ends. The best way to troubleshoot that type of problem is to start at one end
    and work your way down the line. Try to get just two computers working together,
    and then three, and so on. Eventually, you find the problem.


    Determining whether your network cable has been compromised requires you to address
    these issues:


    +   - If you''re using Thinnet, make sure that the BNCs (Bayonet Nut Connectors)
    are securely attached.


    +   - Look at the interface between the cable and Ethernet switch or hub \u2014
    or the BNC connector, if you''re using Thinnet \u2014 to make sure that they''re
    in good physical contact. Sometimes, the cable can pull out a little and break
    the connection.


    +   - Look at the cable itself and make sure that it hasn''t been cut or crushed.


    +   - If you''re using Thinnet, make sure that each end of the cable has a 50
    ohm terminator attached to it. Thinnet must be terminated; otherwise, it doesn''t
    work right, just as it doesn''t work right if the cable is broken. The reason
    is that the radio frequency (RF) signal reflects from the unterminated end and
    interferes with the incoming signals. If you have a spare cable that you know
    is good, try substituting it. The idea is to eliminate as many segments that you''re
    unsure about as possible. If you have just two computers in close proximity and
    you suspect a problem with the cable you''re using, all you can do is try another
    cable. If the computers are far apart and rely on several segments or a long cable,
    try moving them closer together and using one short segment. If you have three
    or more computers, try getting just two of them working together. Then try adding
    another one. Proceed until you find the faulty segment.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'You have to have an Ethernet adapter to be connected to an Ethernet network.
    Make sure that your Ethernet adapter is plugged in to your computer’s motherboard
    — snugly. Sometimes, you have to pull out the adapter and then reinsert it. The
    process of pulling out an adapter and then plugging it back in is called reseating.


    # Is your network adapter configured correctly?


    Sometimes a startup script is misconfigured, which causes the startup screen to
    go by without your seeing an error message. If that happens, log in as root and
    from the shell prompt and type this command:


    ```

    ifconfig

    ```


    You see a listing of two different interfaces, as shown in the following code,
    or three interfaces if you have PPP configured. The `ifconfig` command tells the
    Linux kernel that you have a network adapter and gives it an IP address and network
    mask. This step is the first in connecting your Linux computer to your network:


    ```

    eth0 Link encap:10Mbps Ethernet HWaddr 00:A0:24:2F:30:69

    inet addr:192.168.1.1 Bcast:192.168.1.255 Mask:255.255.255.0

    UP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1

    RX packets:16010 errors:18 dropped:18 overruns:23 TX packets:7075 errors:0 dropped:0
    overruns:0

    Interrupt:10 Base address:0x300


    lo Link encap:Local Loopback

    inet addr:127.0.0.1 Bcast:127.255.255.255 Mask:255.0.0.0

    UP BROADCAST LOOPBACK RUNNING MTU:3584 Metric:1

    RX packets:115 errors:0 dropped:0 overruns:0

    TX packets:115 errors:0 dropped:0 overruns:0

    ```


    # Checking your wireless NIC


    Linux provides several tools to work with Wi-Fi network interfaces. Red Hat installs
    the wireless-tools RPM package by default. The tools include `ifconfig`, `iwspy`,
    and other utilities. We describe how to use `iwconfig` to examine your Wi-Fi interface
    configuration.'
  merge: -1
  img_proc: true
- pgno: 290
  md: "# # \"I is an engagere\"\n\nAn experienced electrical engineer and Linux author\
    \ once got really angry with a cable TV company. His cable service went dead in\
    \ the middle of a Philadelphia Eagles game. It didn't matter that the Eagles were\
    \ losing — he wanted to see the game because the Eagles don't appear on TV often\
    \ in Albuquerque. The engineer called the cable company immediately. Blah! Blah!\
    \ Blah! My connection — Blah!\n\nBlah! The nice support person guided the poor\
    \ engineer step-by-step through his own fault tree. Step 1: Is your VCR or TV\
    \ turned on? \"Yes, of course.\" Step 2: Is the VCR button on your VCR toggled\
    \ on? \"Of course — ah, whoops, no, it isn't. Ah, yes, it works now, thank you\
    \ very much. Goodbye.\" D'oh! What was five years of electrical engineering school\
    \ good for?\n\nLog in as root, open a GNOME Terminal window (refer to Chapter\
    \ 4 for more information), and run the iwconfig command. If your NIC is configured\
    \ correctly, you see output similar to this example:\n\n```\nlo            no\
    \ wireless extensions.\n\neth0      IEEE 802.11-DS  ESSID:\"linky\"  Nickname:\"\
    ...\"\n          Mode:Ad-Hoc  Frequency:2.437GHz  Cell: \"...\"\n          Bit\
    \ Rate:11Mb/s   Tx-Power=15 dBm  Sensitivity:1/3\n          Retry limit:4    \
    \ RTS thr:off   Fragment thr:off\n          Encryption key:A654-6277-43D6-ACC3-6E6D-1C12-98\n\
    \          Power Management:off\n          Link Quality:0  Signal level:0  Noise\
    \ level:0\n          Rx invalid nwid:0  Rx invalid crypt:0  Rx invalid ...\n \
    \         Tx excessive retries:0  Invalid misc:0  Missed ...\n```\n\nThese options\
    \ are the important ones to examine:\n\n+   * **Mode:** You have to set this value\
    \ to Ad-Hoc when you're connecting to an ad hoc network. (Refer to Chapter 7 for\
    \ more information about this method.) You can use the value Any when you're connecting\
    \ to an infrastructure network. The Any value can work for an ad hoc network in\
    \ some cases; however, a description of those cases is beyond the scope of this\
    \ book, so use ad-hoc mode whenever necessary.\n\n+   * **ESSID:** You have to\
    \ use the same value on every machine connected to an ad hoc LAN. For example,\
    \ every machine on the network is given the ESSID linky.\n\n+   * **Encryption\
    \ key:** You have to use the same encryption key on every machine connected to\
    \ your wireless network. The key comes in two flavors: 40 bit and 128 bit. The\
    \ 40-bit key is nearly useless because it can be readily cracked by hackers using\
    \ widely available software."
