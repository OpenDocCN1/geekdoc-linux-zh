- pgno: 345
  md: '# ## Discovering Your Windows NT, Windows 2000, or Windows XP Hardware


    Discovering information about Windows NT, Windows 2000, and Windows XP is similar
    to discovering it about Windows 9x and Windows Me. The process is the same, although
    getting there is a little different:


    *On Windows NT and Windows 2000 computers*


    +   1. Click the **Start** button and choose **Settings**➤**Control Panel**. Then,
    double-click the **System** icon in the Control Panel window.

    2. Click the **Hardware** tab when the **Systems Properties** window opens. Then,
    click the **Device Manager** button to open the **Device Manager** window.

    3. Click the plus sign of any hardware subsystem you want to examine.

    A submenu opens, showing all devices of a particular type.

    4. Right-click any hardware subsystem and choose **Properties**.

    The Properties option shows information about that particular device.


    *On Windows XP computers*


    +   1. Click the **Start** button and choose the **My Computer** option.

    2. Double-click the **Control Panel** icon.

    3. Double-click the **System** icon, select the **Hardware** tab, and then double-click
    the **Device Manager** button. The **Device Manager** window opens.

    4. Click the plus (+) sign to display the devices within a subsystem.

    5. Right-click a device to open a menu from which you can choose the **Properties**
    option. The Properties window opens and shows information about the device.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# # Appendix C


    ## Filing Your Life Away


    +   *In This Appendix*


    \- Finding out all about Linux files and directories

    \- Finding your way through the Linux file system

    \- Creating, moving, copying, and destroying directories and files

    \- Changing file ownership and permissions


    In this appendix, you take your first steps through the Linux file and directory
    structure. Don''t worry: Linux may live a structured life, but it''s flexible.
    With a little bit of introduction, you begin to understand the Linux way of life.


    We also introduce you to file types, subdirectories, and the root (which is not
    evil at all) directory. You''re also shown the way home — to your home directory.
    After you''re oriented to the Linux files-and-directories structure, we show you
    how to make some changes, such as how to copy and move files and directories and
    how to — eek! — destroy them.


    # ### Getting Linux File Facts Straight


    Linux files are similar to Unix, DOS, Windows, and Macintosh files. All operating
    systems use files to store information. Files allow you to organize your stuff
    and keep them separate. For example, the text that comprises this appendix is
    stored in a file; all other book elements are stored in their own files. Follow
    the bouncing prompt as we make short work of long files.


    # #### Storing files


    We assume that you know that a file is a collection of information identified
    by a filename and that Linux can store multiple files in directories as long as
    the files have different names. Linux stores files with the same name in different
    directories.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'Wonderful or not, Linux filenames can be as long as 256 characters. The filenames
    can contain uppercase and lowercase letters (also known as *mixed case*), numbers,
    and special characters, such as underscores (_), dots (.), and hyphens (-). Because
    filenames can be composed of mixed-case names, and because each name is distinct,
    these names are *case sensitive*. For example, the names FILENAME, filename, and
    FileNaMe are unique filenames of different files, but they''re the same filename.


    ![](img/8c094d1b36276212c03d10d898508a6e_347_0.png)


    Although filenames technically can contain wildcard characters, such as asterisks
    (*) and question marks (?), using them isn''t a good idea. Various command interpreters,
    or *shells*, use wildcards to match several filenames at one time. If your filenames
    contain wildcard characters, you have trouble specifying only those files. We
    recommend that you create filenames that don''t contain spaces or other characters
    that have meaning to shells. In this way, Linux filenames are different from DOS
    and Windows filenames.


    # # Sorting through file types


    Linux files can contain all sorts of information. In fact, Linux sees as a file
    every device (disks, display, or keyboard, for example) except for a network interface.
    These five categories of files eventually become the most familiar to you:


    +   User data files: Contain information you create. User data files, sometimes
    known as flat files, usually contain the simplest data, consisting of plain text
    and numbers. More complex user data files, such as graphics or spreadsheet files,
    must be interpreted and used by special programs. These files are mostly illegible
    if you look at them with a text editor because the contents of these files aren''t
    always ASCII text. Changing these files generally affects only the user who owns
    the files.


    +   System data files: Are used by the system to keep track of users on the system,
    logins, and passwords, for example. As system administrator, you may be required
    to view or edit these files. As a regular user, you don''t need to be concerned
    with system data files except, perhaps, the ones you use as examples for your
    own, private startup files.


    +   Directory files: Hold the names of files — and other directories — that belong
    to them. These files and directories are called children. Directories in Linux
    (and Unix) are just another type of file. If you''re in a directory, the directory
    above you is the *parent*. Isn''t that homey?


    When you list files with the ls -l command, it displays a list of files and directories.
    Directory files begin with the letter *d*; for example:


    ```

    [lidia@cancun lidia]$ ls -l

    drwxr-xr-x 5 lidia lidia 1024 Jul 3 2002 Desktop

    drwx----- 2 lidia lidia 1024 Jul 10 2002 nsmail

    ```'
  merge: -1
  img_proc: true
- pgno: 348
  md: '**Special files:** Represent either hardware devices (such as disk drives,
    tape drives, or keyboards) or some type of placeholder that the operating system
    uses. The `/dev` directory holds many of these special files. You can see this
    directory by running this command at a command prompt:


    ```

    ls -l /dev

    ```


    **Executable files:** Contain instructions (usually called *programs* or *shell
    scripts*) for your computer. When you type the name of one of these files, you''re
    telling the operating system to execute the instructions. Some executable files
    look like gibberish, and others look like long lists of computer commands. Many
    of these executable files are located in `/bin`, `/usr/bin`, `/sbin`, and `/usr/sbin`.


    # ## Understanding files and directories


    If you live in the Windows world, you can think of a Linux file system as one
    huge file folder that contains files and other file folders, which in turn contain
    files and other file folders, which in turn contain files and — well, you get
    the point. In fact, the Linux file system is generally organized in this way.
    One big directory contains files and other directories, and all the other directories
    in turn contain files and directories.


    # **Directories and subdirectories**


    A directory contained, or *nested*, in another directory is a *subdirectory*.
    For example, the directory named `/mother` may contain a subdirectory named `/child`.
    The relationship between the two is referred to as parent and child. The full
    name of the subdirectory is `/mother/child`, which would make a good place to
    keep a file named `/mother/child/reunion` that contains information about a family
    reunion.


    # **The root directory**


    In the tree directory structure of Linux, DOS, and Unix, the big directory at
    the bottom of the tree is the *root* directory. The root directory is the parent
    of all other directories (the poor guy must be exhausted) and is represented by
    a single `/` symbol (pronounced “slash”). From the root directory, the whole directory
    structure grows like a tree, with directories and subdirectories branching off
    like limbs.


    ![](img/8c094d1b36276212c03d10d898508a6e_348_0.png)


    If you could turn the tree over so that the trunk is in the air and the branches
    are toward the ground, you would have an *inverted tree* — which is how the Linux
    file system is normally drawn and represented (with the root at the top). If we
    were talking about Mother Nature, you would soon have a dead tree. Because the
    subject is computer technology, however, you have something that looks like an
    ever-growing, upside-down tree.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# What''s in a name?


    You name directories in the same way as you name files, following the same rules.
    Almost the only way you can tell whether a name is a filename or a directory name
    is the way the slash character (\/) is used to show directories nested in other
    directories. For example, `usr/local` means that `local` is in the `usr` directory.
    You know that `usr` is a directory because the trailing slash character tells
    you so; however, you don''t know whether `local` is a file or a directory.


    ![](img/8c094d1b36276212c03d10d898508a6e_349_0.png)


    If you issue the `ls` command with the `-f` option, Linux lists directories with
    a slash character at the end, as in `local/`, so you know that `local` is a directory.


    The simplest way to tell whether the slash character indicates the root directory
    or separate directories, or directories and files, is to see whether anything
    appears before the slash character in the directory path specification. If nothing
    appears before the slash, you have the root directory. For example, you know that
    `/usr` is a subdirectory or a file in the root directory because it has only a
    single slash character in front of it.


    # Home again


    Linux systems have a directory named `/home`, which contains the user''s home
    directory, where she can


    +   - Store files

    - Create more subdirectories

    - Move, delete, and modify subdirectories and files


    Linux system files and files belonging to other users are never in a user''s `/home`
    directory. Linux decides where the `/home` directory is placed, and that location
    can be changed only by a superuser (root), and not by general users. Linux is
    dictatorial because it has to maintain order and keep a handle on security.


    # Moving Around the File System with pwd and cd


    You can navigate the Linux file system without a map or the Global Positioning
    System (GPS). All you need to know are two commands: `pwd` and `cd`. (You run
    these commands from the command line.) However, you also need to know where to
    start; hence, the usefulness of the next section.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Figuring out where you are


    Log in to your Red Hat Linux computer and open a GNOME Terminal session. In this
    case, you log in as the example user `lida`. To find out where you are in the
    Linux file system, simply type **pwd** at the command prompt:


    ```

    [lida@cancun lida]$pwd

    ```


    You receive this response:


    ```

    /home/lida

    [lida@cancun lida]$

    ```


    This response indicates that you''re logged in as `lida` and are in the `/home/lida`
    directory. Unless your alter ego is out there, you should be logged in as *yourself*
    and be in the `/home/yourself` directory, where *yourself* is your login name.


    The `pwd` command stands for *print working directory*. Your *working directory*
    is the default directory where Linux commands perform their actions; the working
    directory is where you are in the file system when you type a command. When you
    type the `ls(1)` command, for example, Linux shows you the files in your working
    directory. Any file actions on your part occur in your working directory unless
    you are root. For security reasons that we don''t go into here, the root user
    isn''t configured by default to be able to work on the current working directory.
    You can change this setting, but the root user generally must explicitly specify
    the working directory. For example, if you are root and are in the `/etc` directory
    and you want to indicate the `hosts` file, you must type `cat /hosts` rather than
    just `cat hosts`.


    Type this command:


    ```

    ls -la

    ```


    You see only the files in your working directory. If you want to specify a file
    that isn''t in your working directory, you have to specify the name of the directory
    that contains the file in addition to the name of the file. For example, this
    command lists the `passwd` file in the `/etc` directory:


    ```

    ls -la /etc/passwd

    ```'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# ## Specifying the directory path


    If the file you want to read is in a subdirectory of the directory you''re in,
    you can reach the file by typing a relative filename. *Relative filenames* specify
    the location of files relative to where you are.


    In addition to what we discuss earlier in this appendix about specifying directory
    paths, you need to know these three rules:


    +   - One dot (.) always stands for your current directory.

    - Two dots (..) specify the parent directory of the directory you''re in.

    - All directory paths that include (.) or (..) are relative directory paths.


    You can see these files by using the -a option of the `ls(1)` command. Without
    the -a option, the `ls(1)` command doesn''t bother to list the . or .. files,
    or any filename beginning with a period. This statement may seem strange, but
    the creators of Unix thought that having some files that are normally hidden keeps
    the directory structure cleaner. Therefore, filenames that are always present
    (. and ..) and special-purpose files are hidden. The types of files that should
    be hidden are those a user normally doesn''t need to see in every listing of the
    directory structure (files used to tailor applications to the user''s preferences,
    for example).


    Specify a pathname relative to where you are; for example:


    ```

    ```text

    [llidia@cancun llidia]$ pwd

    /home/llidia

    [llidia@cancun llidia]$ ls -la ../../etc/passwd

    ```

    ```


    The last line indicates that in order to find the passwd file, you move up two
    directory levels (../../) and then down to /etc.


    If you want to see the login accounts on your system, you can issue this command
    from your home directory:


    ```

    ```text

    [llidia@cancun llidia]$ ls -la ..

    ```

    ```


    This command lists the parent directory. Because the parent directory (//home/)
    has all the login directories of the people on your system, this command shows
    the names of their login directories.


    You have been looking at relative pathnames, which are relative to where you are
    in the file system. Filenames that are valid from anywhere in the file system
    are *absolute filenames*. These filenames always begin with the slash character
    (/), which signifies the root:


    ```

    ```text

    ls -la /etc/passwd

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 352
  md: "# ## Changing your working directory\n\nYou occasionally (often?) want to change\
    \ your working directory. Why? We’re glad you asked — because changing it enables\
    \ you to work with shorter relative pathnames. To do so, you simply use the cd\
    \ (for change directory) command.\n\nTo change from your working directory to\
    \ the /usr directory, for example, type this command:\n\n```\n```\ncd /usr\n```\n\
    ```\n\n# ## Going home\n\nIf you type **cd** by itself, without any directory\
    \ name, you return to your home directory. Just knowing that you can easily get\
    \ back to familiar territory is comforting. There’s no place like home.\n\nYou\
    \ can also use **cd** with a *relative specification*; for example:\n\n```\n```\n\
    cd ..\n```\n```\n\nIf you’re in the directory /usr/bin and type the preceding\
    \ command, Linux takes you to the parent directory named /usr:\n\n```\n```\n[lidia@cancun\
    \ lidia]$ cd /usr/bin\n[lidia@cancun bin]$ cd ..\n[lidia@cancun usr]$ \n```\n\
    ```\n\n![](img/8c094d1b36276212c03d10d898508a6e_352_0.png)\n\nHere are a couple\
    \ of tricks: If you type **cd ~**, you go to your home directory (the tilde symbol\
    \ (~) is synonymous with /home/username). If you type **cd ~<username>**, you\
    \ can go to that user’s home directory. On very large systems, this command is\
    \ useful because it eliminates the need for you to remember — and type — large\
    \ directory specifications.\n\nThis list describes the shell redirection symbols:\n\
    \n+   - `> -` is known as *redirect standard output*. When you use it, you tell\
    \ the computer “Capture the information that normally goes to the screen, create\
    \ a file, and put the information in it.”\n- `>> -` is known as *append standard\
    \ output*. When you use this symbol, you tell the computer “Capture the information\
    \ that would normally go to the screen and append the information to an existing\
    \ file. If the file doesn’t exist, create it.”\n- `<> -` tells the computer, “Feed\
    \ the information from the specified file to *standard in* (also known as *standard\
    \ input), acting as though the information is coming from the keyboard.”"
  merge: -1
  img_proc: true
- pgno: 353
  md: '# ## Manipulating Files and Directories


    Linux has many ways to create, move, copy, and delete files and directories. Some
    features are so easy to use that you need to be careful: Unlike other operating
    systems, Linux doesn''t tell you that you''re about to overwrite a file — it just
    follows your orders and overwrites!


    ![](img/8c094d1b36276212c03d10d898508a6e_353_0.png)


    We have said it elsewhere in this book, and we''ll say it again: Make sure that
    you''re *not* logged in as root when you read through these sections. You can
    unintentionally harm your computer when you''re logged in as root. As root, or
    the superuser, you can erase any file or directory — regardless of which permissions
    are set. Be careful!


    # ## Creating directories


    To create a new directory in Linux, you use the `mkdir` command (just like in
    MS-DOS). The command looks like this:


    ```

    ```console

    [lidia@cancun lidia]$ mkdir newdirectory

    ```

    ```


    This command creates a subdirectory under your current or working directory. If
    you want the subdirectory under another directory, change to that directory first
    and then create the new subdirectory.


    Create a new directory named `cancun`. Go ahead — do it:


    ```

    ```bash

    mkdir cancun

    ```

    ```


    (Can you tell where we would rather be right now?)


    Create another directory named `vacation`:


    ```

    ```bash

    mkdir veracruz

    ```

    ```


    Then, change the directory to put yourself in the `cancun` directory:


    ```

    ```bash

    cd cancun

    ```

    ```


    Now verify that you''re in the directory `cancun`:


    ```

    ```bash

    pwd

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# ## Moving and copying files and directories


    The commands for moving and copying directories and files are *mv* for move and
    *cp* for copy. If you want to rename a file, you can use the *mv* command. No,
    you’re not really moving the file, but in Linux (and Unix), the developers realized
    that renaming something was much like moving it. The format of the move command
    is


    ```

    ```text

    mv source destination

    ```

    ```


    Create a file that you can practice moving. The *touch* command updates the time
    stamp on an existing file or creates an empty file if it doesn’t exist. In this
    case, the file *test* doesn’t exist and will be created by *touch*:


    ```

    ```text

    touch go

    ```

    ```


    Move the new file:


    ```

    ```text

    mv go to

    ```

    ```


    This command leaves the file in the same directory and changes its name to *to*.
    The file wasn’t really moved — just renamed.


    Now try moving the *to* file to the *veracruz* directory. To do that, you have
    to first move the file up and then move it into the *veracruz* directory. You
    can do it with one command:


    ```

    ```text

    mv to ../veracruz

    ```

    ```


    ![](img/8c094d1b36276212c03d10d898508a6e_354_0.png)


    The destination file uses the double-dot (..) designation; every directory contains
    a double-dot directory that points to the parent directory. This command tells
    Linux to go up one directory level and look for a directory named *veracruz* and
    then put the file into that directory with the name *newgoto* because you didn’t
    specify any other name. If you do this instead:


    ```

    ```text

    mv go ../veracruz/now

    ```

    ```


    the *go* file moves to the *veracruz* directory named *now*. Note that in both
    cases (with the file maintaining its name of *go* or taking the new name *now*),
    your current directory is still *cancun* and all your filenames are relative to
    that directory.


    ![](img/8c094d1b36276212c03d10d898508a6e_354_1.png)


    Strictly speaking, the file still hasn’t really moved. The data bits are still
    on the same part of the disk where they were originally. The *file specification*
    (the directory path plus the filename) you use to talk about the file is different,
    so it appears to have moved.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# ## Removing files and directories


    The command for removing, or deleting, a file is `rm`. Using `rm` is straightforward.
    Create a dummy file to erase:


    ```

    ```

    touch junk

    ```

    ```


    You can delete the file with this command:


    ```

    ```

    rm junk

    ```

    ```


    You have removed the dummy file from the current directory. To remove a file from
    another directory, you need to provide a relative filename or an absolute filename.
    For example, if you want to expunge `now` from the `veracruz` directory, you type
    this line:


    ```

    ```

    rm ../veracruz/now

    ```

    ```


    ![](img/8c094d1b36276212c03d10d898508a6e_355_0.png)


    You can use metacharacters (similar in many ways to Windows wildcards) with `rm`,
    but *be very careful* if you do! When files are removed in Linux, they are gone
    forever — kaput, vanished — and can’t be recovered.


    This command removes *everything* in the current directory and all the directories
    under it that you have permission to remove:


    ```

    ```

    [lidia@cancun lidia]$ rm -r *

    ```

    ```


    ![](img/8c094d1b36276212c03d10d898508a6e_355_1.png)


    Do *not* give this command as root (the superuser)! You should always be careful
    when running any command as root, but be especially careful with commands that
    can erase entire directories and file systems.


    ![](img/8c094d1b36276212c03d10d898508a6e_355_2.png)


    To decrease the danger of removing lots of files inadvertently when you use metacharacters,
    be sure to use the `-i` option with `rm`, `cp`, `mv`, and various other commands.
    The `-i` option, which means *interactive*, lists each filename to be removed
    (with the `rm` command) or overwritten (with the `mv` or `cp` command). If you
    answer either `y` or `Y` to the question, the file is removed or overwritten,
    respectively. If you answer anything else, Linux leaves the file alone.


    You can remove not only files but also directories. Suppose that you have an old
    directory, `/tmp/junk`, that you don’t need any more. You can remove it and all
    its contents:


    ```

    ```

    [lidia@cancun lidia]$ rm -rf /tmp/junk

    ```

    ```


    Giving the `rm` command these options (`r` and `f`) removes the `/tmp/junk` directory
    and all files and directories under it. The `r` option means to remove *recursively*,
    in recursion, the command works through every subdirectory in the parent directory.
    The `f` option issues the command *forcefully*. No prompts are given.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Changing File Ownership and Granting Permissions


    All Linux files and directories have owners and are assigned a list of permissions.
    This system of *ownership* and *permissions* forms the basis for restricting and
    allowing users'' access to files. File permissions can also be used to specify
    whether a file is executable as a command and to determine who can use the file
    or command.


    Files and directories are owned by user accounts. User accounts are defined in
    the */etc/passwd* file. For example, you created the root (superuser) user account
    when you installed Red Hat Linux in Chapter 3, and the installation system created
    the superuser home directory, */root*, plus several configuration files (for example,
    *.bashrc*). The root user owns all those files and directories. If you created
    a regular user account — for example, *lidia* — that user''s home directory and
    configuration files are all owned by *lidia*. Users can access and modify any
    files or directories they own.


    Files and directories all have group ownership in addition to user ownership.
    Groups are defined by the */etc/group* file and provide a secondary level of access.
    For example, you can assign group ownership to files you own and allow other users
    who belong to the group to access those files.


    Files and directories are assigned permissions that permit or deny read, write,
    and execute access. Permissions are assigned to the owner, group, or non-owner
    of the file or directory. Non-owners are referred to as “other.” The owner, group,
    or other permissions are independent of each other.


    Using the *ls* command with the *-l* option allows you to see the file''s permissions
    along with other relevant information, such as who owns the file, which group
    of people have permission to access or modify the file, the size of the file or
    directory, the last time the file was modified, and its name.


    First, create a file and then list it:


    ```

    ```

    [lidia@cancun lidia]$ touch gotowork

    [lidia@cancun lidia]$ ls -l gotowork

    -rw-rw-r-- owner group 0 Feb 3 16:00 gotowork

    ```

    ```


    The *rw-rw-r--* characters are the permissions for the *gotowork* file: The owner
    is you, and the group is probably you, but may be someone or something else, depending
    on how your system is set up and administered.


    You may be wondering how you can become an owner of a file. You''re automatically
    the owner of any file you create, which makes sense. As the owner, you can change
    the default file permissions — and even the ownership. If you change the file
    ownership, however, *you* lose ownership privileges.'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'To change the ownership of a file or a directory, use the `chown` command.
    (Get it? *chown* — *change ownership*.) You generally have to be root to do this.


    Suppose that you have decided to settle down and lead a more contemplative life,
    one more in line with a new profession of haiku writing. Someone else will have
    to plan the weekend spreads and all-night bashes. So you give up ownership of
    the `gotowork` file:


    ```

    ```bash

    [lidia@cancun lidia]$chown root gotowork

    ```

    ```


    This command changes the ownership of `gotowork` to root. To change it back, you
    can use the `chown` command, but you have to do it as root.


    Files and users all belong to *groups*. In the `gotowork` example, the group consists
    of users. Having groups enables you to give large numbers of users — but not all
    users — access to files. Group permissions and ownership are handy for making
    sure that the members of a special project or workgroup have access to files needed
    by the entire group.


    To see which groups are available to you on your system, take a look at the `/etc/group`
    file. To do so, use the `more` command. You see a file that looks somewhat like
    this:


    ```

    ```

    root::0:root

    bin::1:root,bin,daemon

    ...

    nobody::99:

    users::100:

    floppy:x:19:

    ....

    your_user_name::500:your_user_name

    ```

    ```


    where *your_user_name* is the login name you use for your account. Remember that
    the file doesn’t look exactly like this — just similar. The names at the beginning
    of the line are the group names. The names at the end of the line (such as *root*,
    *bin*, and *daemon*) are *user-group* names that can belong to the *user*-*group*
    list.


    To change the group the file belongs to, log in as root and use the `chgrp` command.
    Its syntax is the same as that of the `chown` command. For example, to change
    the group that `gotowork` belongs to, you issue this command:


    ```

    ```bash

    [lidia@cancun lidia]$chgrp newgroupname gotowork

    ```

    ```


    ![](img/8c094d1b36276212c03d10d898508a6e_357_0.png)


    Red Hat assigns a unique group to each user. For example, when you add the first
    user to your system, that user gets the user ID and group ID of 500. The next
    user receives the user ID and group ID of 501, and so on. This system gives you
    lots of control over who gets what access to your files.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# Making Your Own Rules


    You, as the owner of a file, can specify permissions for reading, writing to,
    or executing a file. You can also determine who (yourself, a group of people,
    or everyone in general) can do these actions on a file. What do these permissions
    mean? Read on (you have our permission):


    +   ✏ Read permission: You can read the file. For a directory, read permission
    allows the `ls` command to list the names of the files in the directory. You must
    also have execute permission for the directory name to use the `-l` option of
    the `ls` command or to change to that directory.


    +   ✏ Write permission: You can modify the file. For a directory, you can create
    or delete files inside that directory.


    +   ✏ Execute permission: You can type the name of the file and execute it. You
    can’t view or copy the file unless you also have read permission. Files containing
    executable Linux commands, called *shell scripts*, must therefore be both executable
    and readable by the person executing them. Programs written in a compiled language,
    such as C, however, must have only executable permissions, to protect them from
    being copied where they shouldn’t be copied.


    For a directory, execute permission means that you can change to that directory
    (with `cd`). Unless you also have read permission for the directory, `ls -l` doesn’t
    work. You can list directories and files in that directory, but you can’t see
    additional information about the files or directories by using just an `ls -l`
    command. This arrangement may seem strange, but it’s useful for security.


    The first character of a file permission is a hyphen (-) if it’s a file; the first
    character of a directory is d. The nine other characters are read, write, and
    execute positions for each of the three categories of file permissions:


    +   ✏ Owner (also known as the user)


    ✏ Group


    ✏ Others


    Your gotowork file, for example, may show these permissions when listed with the
    `ls -l gotowork` command:


    ```

    -rw-rw-r--

    ```


    The hyphen (-) in the first position indicates that it’s a regular file (not a
    directory or other special file). The next characters (*rw-*) are the owner’s
    permissions. The owner can read and write to the file, but can’t execute it.'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'The next three characters (rw-) are the group''s permissions. The group also
    has read-write access to the file. The last three characters (r--) are the others''
    permissions, which are read-only.


    [-][rw-][rw-][r--] illustrates the four parts of the permissions: the file type
    followed by three sets of triplets, indicating the read, write, and execute permissions
    for the owner, group, and *other* users of the file (meaning *everyone else*).


    You can specify most file permissions by using only six letters:


    +   * **ugo** stands for — no, not a car — user (or *owner*), group, and other.

    * **rwx** stands for read, *write*, and execute.


    These six letters, and some symbols, such as the equal sign (=) and commas, are
    put together into a specification of how you want to set the file''s permissions.


    The command for changing permissions is `chmod`. Here''s its syntax:


    ```

    chmod specification filename

    ```


    Change the mode of `gotowork` to give users the ability to read, write, and execute
    a file:


    ```

    chmod u=rwx gotowork

    ```


    That was easy enough. What if you want to give the group permission to only read
    and execute the file? You execute this command:


    ```

    chmod g=rx gotowork

    ```


    This command doesn''t affect the permissions for owner or other — just the group''s
    permissions. You can set the permission bits in other ways. But because this way
    is so simple, why use any other?'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# Appendix D


    # Becoming a Suit: Managing the Red Hat Linux File System


    # In This Appendix


    +   - Mounting and unmounting a file system

    - Increasing disk space with a new drive or memory stick


    Managing the Linux file system isn’t a complex job, but it’s an important one.
    You have the responsibility of managing the Linux file system and ensuring that
    users (even if you’re the only user) have access to secure, uncorrupted data.
    You’re the manager (yes, — gag — a *suit*) of your file system.


    This chapter introduces you to managing your Linux file system. Consider yourself
    a management trainee. When you’re done reading this chapter, feel free to take
    a nice, long, expensive lunch.


    # Mounting and Unmounting a File System


    Red Hat Linux and other Unix-like operating systems use files in different ways
    from MS-DOS, Windows, and Macintosh operating systems. In Linux, *everything*
    is stored as files in predictable locations in the directory structure; Linux
    even stores commands as files. Like other modern operating systems, it has a tree-structured,
    hierarchical directory organization: the *file system*.


    All user-available disk space is combined in a single directory tree. The base
    of this system is the *root directory* (not to be confused with the root user),
    designated with a slash ( / ). A file system’s contents are made available to
    Linux by using the mounting process. *Mounting* a file system makes Linux aware
    of the files and directories it contains. This process is just like mounting a
    horse — except that no horse is involved.


    Unlike in the Windows world, Linux file systems, except for / root, must be explicitly
    *mounted* or *unmounted*, which means that file systems can be connected to or
    disconnected from the directory tree.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '# Mounting Windows files from a floppy disk


    File system mounting and unmounting provide a good example of the difference between
    Linux and Windows. If you use a floppy disk or CD with Windows, you just insert
    it into the drive and you have immediate access to it. With Linux, you must insert
    the floppy disk into the drive and then explicitly mount it. Sound complicated?
    Not really.


    You can mount a Windows hard drive partition or floppy on your Linux computer.
    You can read and write to FAT or FAT32 but can only read from NTFS file systems.
    These steps show you how to mount a Windows floppy:


    +   1.  Insert a Windows MS-DOS-formatted floppy disk into the drive, click the
    GNOME Menu button, and choose System Tools->Disk Management. Enter the root password
    if requested.


    ![](img/8c094d1b36276212c03d10d898508a6e_361_0.png)


    +   2.  Select the floppy disk and click the Mount button.


    You know that the floppy disk has mounted successfully when a floppy disk icon
    is displayed on the left side of the screen.


    You can now read and write to the floppy disk (unless the read-only tab on the
    disk is set).


    +   3.  Click the Exit button to close the utility.


    Red Hat Linux and GNOME are configured to automatically start the process that
    mounts your floppy disk or CD when you insert it into the drive. We use the manual
    method here to show you how the process works. To manually mount the floppy in
    the command-line interface, log in as root, open the terminal window, and run
    this command:


    ```

    mount -t msdos /dev/fd0 /mnt/floppy

    ```


    # Unmounting file systems


    Unmounting a Linux file system is a little simpler than mounting one. Because
    the file system is already mounted, you don’t have to specify any options or other
    information. You just have to tell the Red Hat disk management druid to unmount
    the file system. Follow these steps:


    +   1.  Click the Main Menu button and choose System Tools->Disk Manage-ment.
    Enter the root password if prompted.


    +   2.  When the User Mount Tool window appears, click the button to the right
    of the file system in which you’re interested.'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'The button indicates whether the file system is mounted or unmounted. After
    a few seconds, the button changes from Unmount to Mount to show that it has been
    unmounted.


    +   3. **Click the Exit button to close the utility.**


    The file system is unmounted. If the file system is a removable type, such as
    a floppy disk or CD, you can remove it. Otherwise, the file system is simply not
    available for use until you remount it.


    ![](img/8c094d1b36276212c03d10d898508a6e_362_0.png)


    You can run the `eject` command from a bash shell to eject a CD. You have to unmount
    the CD first and then enter the `eject` command. Otherwise, to eject a CD, you
    must unmount it and then press the eject button on the CD-ROM drive. In either
    case, you can’t eject the CD until you have unmounted it.


    # # Adding a Disk Drive


    Sooner or later, life catches up with us and you’re likely to need or want a bigger
    house or car or diamond in your tooth, or whatever. The same goes for disk space,
    in which case you want to add another disk drive.


    The first step to increasing your drive space is to add a new storage device.
    It can be a hard drive (IDE or SCSI), but also a USB or FireWire memory stick.
    These steps describe the general process of adding a storage device and then formatting
    and mounting it:


    +   1. **Install the hard drive or insert the USB or FireWire device.**


    If the device is an IDE or SCSI hard drive, turn off the power to your computer
    and monitor. Unplug the power cable and open the computer case. (Don’t cut yourself
    on the sometimes sharp metal edges when reaching into the computer.) Use the antistatic
    strap that comes with the hard drive; follow the instructions included with the
    strap.


    Most PCs use IDE controllers. SCSI-based PCs are more expensive and aren’t commonly
    found in consumer PCs; these types are more common in the commercial realm. IDE-based
    PCs have two IDE controllers. Each device can control as many as two IDE devices.
    Ribbon cables connect the controller to the devices.


    You have to configure your new disk to function as a slave device if it’s connected
    to a ribbon cable or IDE controller that already has another device (hard drive
    or CD-ROM) attached.


    If the device is a USB or FireWire memory stick, skip to Step 3.


    ![](img/8c094d1b36276212c03d10d898508a6e_362_1.png)


    +   2. **Reboot your computer and run the `dmesg` command from a GNOME Terminal
    window.**'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'If you added an IDE drive, look for the mention of an hdx device, where x is
    replaced with the letter b, c, d or e. This information tells you that your kernel
    “saw” the new hard drive as it booted:


    ```

    hdb: HITACHI_DK227A-50, 4789MB w/512KB

    Cache, CHS=610/255/63

    ```


    If you added a SCSI drive, the general device type is sdx.


    +   3. Partition the new drive.


    Run this command for an IDE drive:


    ```

    fdisk /dev/hdb

    ```


    Use the command fdisk /dev/sda for a USB or FireWire memory stick. The memory
    stick appears as a SCSI device, such as /dev/sda, /dev/sdb, or /dev/sdc, depending
    on your computer’s configuration.


    ![](img/8c094d1b36276212c03d10d898508a6e_363_0.png)


    +   4. Create a file system on the new partition (change the devices as appropriate).


    When using an IDE or SCSI drive, for example, enter this command:


    ```

    mkfs /dev/hdb

    ```


    For a USB memory stick, enter this command:


    ```

    mkfs /dev/sdc

    ```


    +   5. Create a new directory in which to mount the new device:


    ```

    mkdir /space

    ```


    +   6. Mount the newly formatted drive by using the appropriate command:


    ```

    mount /dev/hdb /space

    or

    mount /dev/sdc /space

    ```


    Your drive has been physically added to your system and partitioned, and you have
    added file systems. The drive is ready to join the rest of the file system.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# Appendix E


    ## Revving Up RPM


    In This Appendix

    * RPM explained

    * What RPM does

    * The Red Hat Package Manager

    * Manually using RPM


    This appendix introduces you to the Red Hat Package Manager (RPM). Red Hat, Inc.,
    developed RPM in conjunction with another Linux distributor, Caldera Systems.
    RPM makes a grand effort to reduce the amount of work you have to do when you
    install software. In other words, RPM makes installing, updating, and removing
    software an automatic process. Woo-hoo!


    Although other package managers are available, RPM has become the most popular
    system for installing, modifying, and transporting Linux software. This handy-dandy
    tool is a big reason that Red Hat is the de facto Linux distribution leader. Motor
    through this chapter to find out everything you need to know about RPM.


    # ## Introducing RPM


    One of the primary reasons that the Red Hat Linux distribution became popular
    was that it added value for its customers with technologies such as Red Hat Package
    Manager (RPM).


    All the software that was installed during the Red Hat installation process is
    stored in RPM''s giving format, called packages. Packages are a collection of
    individual software (applications, libraries, and documentation, for example)
    contained in one file.


    The package-management concept has been around for quite a while, with all the
    major Unix vendors supplying their own systems. The idea is to distribute software
    in a single file and have a package manager do the work of installing,'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'or uninstalling, and managing the individual files. The Linux world has benefited
    greatly from this system, which simplifies the distribution and use of software.


    ![](img/8c094d1b36276212c03d10d898508a6e_365_0.png)


    You *can* install software without RPM, but we’re not sure why you would want
    to — the RPM package contains everything you need to install and run an application.
    For example, if you didn’t have the RPM package, installing Mozilla would work
    a little something like this: You would have to install the individual pieces
    that make up the Mozilla system, which can require dozens or more steps. You can
    also install, update, or uninstall RPM software (see the following section for
    details).


    ![](img/8c094d1b36276212c03d10d898508a6e_365_1.png)


    We remember, back in the day, when we used the Linux operating system for the
    first time. We had to install all the software using the dreaded tape archive
    system (tar). Trust us: Installing, maintaining, and upgrading Linux with tar
    was a difficult task. RPM has made life easy.


    ![](img/8c094d1b36276212c03d10d898508a6e_365_2.png)


    The `/mnt/cdrom/RedHat/RPMS` directory contains all the RPM packages.


    # Taking a Look at What RPM Does


    RPM performs three basic functions: It installs, upgrades, and removes packages.
    In addition to these functions, it can find out all sorts of information about
    installed and yet-to-be-installed packages. (All this, and it washes windows too.)
    Here’s a brief rundown of each function:


    ![](img/8c094d1b36276212c03d10d898508a6e_365_3.png)


    +   * **Installing packages:** RPM installs software. Software systems, such as
    Mozilla, have files of all types that must be put into certain locations in order
    to work properly. For example, under Red Hat, some (but not all) of the Mozilla
    files need to go into the `/usr/bin` directory. RPM performs this organizational
    stuff automatically, without any fuss or muss.


    RPM not only installs files in their proper directories but also performs tasks
    such as creating the directories and running scripts to do the things that need
    to be done. (It’s such a tidy and organized little scamp.)


    * **Upgrading packages:** Gone are the days when updating a system was worse than
    going to the dentist. RPM acts like the personal Linux assistant you wish you
    had by updating existing software packages for you. RPM also keeps track of, in
    a database of its own, the packages you have installed. When you upgrade a package,
    RPM does all the bookkeeping chores and replaces only the files that need to be
    replaced. It also saves the configuration files it replaces.


    * **Removing packages:** The package database the RPM keeps is also useful in
    removing packages. To put it simply, RPM takes out the trash. (Housekeeping was
    never so easy) RPM goes to each file and uninstalls it. Directories belonging
    to the package are also removed when no files from other packages occupy them.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '**Querying packages and files:** RPM can also give you a great deal of information
    about a package and its files. You can use the query function to find out the
    function of a package and which files belong to it. RPM can also work on the RPM
    packages themselves, regardless of whether they have been installed.


    **Verifying packages:** RPM can validate an installed package against a `checksum`
    (a computer fingerprint) to see whether and how it has been changed. This feature
    is useful for security reasons. If you suspect that a file or system has been
    hacked, you can use RPM to find out how it has changed.


    ![](img/8c094d1b36276212c03d10d898508a6e_366_0.png)


    RPM packages often include configuration files as part of their installation.
    If you erase an RPM package, those configuration files are not deleted but instead
    are renamed by appending the suffix `.rpm`save to the end of the original filename.
    For example, removing the Kerberos package, krb5fs, saves the configuration file
    by renaming `/etc/krb.conf` to `/etc/krb.conf.rpm`save.


    ![](img/8c094d1b36276212c03d10d898508a6e_366_1.png)


    When you remove a package, RPM removes the associated files and directories. RPM
    cleans up after itself — what Martha Stewart would definitely call “a good thing.”


    # ## Using the Red Hat Package Manager


    Red Hat Linux provides a tool named Red Hat Package Manager for working with RPM
    packages. The package manager graphical tool provides all the functions for managing
    RPMs. It’s like putting an automatic transmission on a car: The Package Manager
    does the shifting for you.


    Okay, the package manager does the shifting for you, but you still have to drive
    it. The package manager provides easy access to RPM functions, such as install,
    upgrade, uninstall, query, and verify. This section describes how to use the package
    manager to rev up your RPM.


    To start the package manager, click the GNOME Menu button and choose System Settings⇒Add/Remove
    Applications. If you aren’t logged in as root, type the root password in the Input
    window when you’re prompted. A progress window appears briefly while the package
    manager determines which packages you have installed. After “thinking,” the Package
    Management window appears.


    The package manager displays all the Red Hat package groups installed by default
    on your system. Individual packages are organized into groups, such as the X Window
    System and GNOME. When the check box to the left of a group is active, designated
    by a plus sign (+), one or more packages from that group is installed. The number
    to the right of the package group shows how many packages of the total number
    in that group are installed.'
  merge: -1
  img_proc: true
- pgno: 367
  md: "Clicking the Details option opens the GNOME Desktop Environment Package Details\
    \ window, which shows all the base and optional packages in the group; short,\
    \ one-line descriptions of each package are also displayed next to each package.\
    \ Base packages are always installed with a package group. Optional packages are,\
    \ well, optionally installed.\n\nThis may be a For Dummies book, but you, of course,\
    \ are no dummy. It's obvious what the GNOME RPM buttons, displayed along the top\
    \ of the GNOME RPM window, are used for. This section describes how to use them\
    \ for their intended functions.\n\n# # Installing an RPM package from a CD-ROM\n\
    \nWhen you install your Red Hat Linux system, all the software that is copied\
    \ to your hard drive from the CD-ROM comes from RPM packages. When you want to\
    \ add software from the companion DVD or an RPM repository, such as www.freshmeat.net,\
