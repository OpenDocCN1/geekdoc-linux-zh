- pgno: 326
  md: '# Chapter 21


    # Ten Security Vulnerabilities


    In This Chapter


    +   - Simplifying your system

    - Encrypting your communications

    - Using firewalls

    - Updating your software

    - Backing up your data

    - Introducing buffer overflows

    - Getting social

    - Using good passwords

    - Scanning the horizon

    - Keeping track of your logs


    They’re here! The monster is under the bed. That big wooden horse is full of Greeks.
    Here’s Johnny! Come into the light. And so on, and so on. However you say it,
    one thing’s for sure: The bad guys are out to get you.


    Do you want the good news or the bad news first? The good news is, the Internet
    has changed the world for the better and continues to do so in more and unforeseen
    ways. And the speed of change will only accelerate. The bad news is, because the
    Internet is constantly changing, the number of ways that someone can use the Internet
    to hurt you is always growing. This chapter outlines some of the more dangerous
    spooks that lurk out on that poorly lit electronic street.


    Our purpose in this chapter is to point you in the right direction so that you
    can gain a general awareness of computer security. Computer security is, unfortunately,
    a complex subject. Because of the complexity of the topic of security, we cannot
    hope to do any more here than touch on some important aspects. We just try to
    give you the most bang for your buck by adding a few simple but effective security
    measures to your new Red Hat Linux computer.


    This chapter introduces ten important security topics. You can use them as a starting
    point to increase your computer security.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# # How Many Daemons Can Dance on the Head of the Linux Process Table?


    Every commercial operating system company wants to make its operating systems
    easy to install and use. Operating systems are inherently complex animals, and
    Linux is no exception. (Of course, we''re not biased when we say that Linux is,
    overall, a simpler system than Windows, whether you measure simplicity by the
    number of lines of code or the transparency — the open source concept — of its
    design.) Companies walk the tightrope of making systems easy to use and also making
    them reasonably secure — they sell more copies when they make it simple but buy
    your wrath when you get hacked.


    Ease of use and security often don''t get along. Your operating system is much
    easier to use, for example, if you install and activate every software package
    and option. On the other hand, running every software package means that you have
    more potential vulnerabilities. Entering your house is a breeze if you install
    10 doors and 20 windows, but that number of entrances also provides burglars with
    more opportunities to break in. The same logic applies to your computer''s operating
    system: The more software you install, the more chances someone has of getting
    inside your computer.


    We can''t think of a cure-all for this dilemma. The best answer from a security
    viewpoint is to not provide intruders with any openings: Place your computer in
    a locked room with no network or external connections and turn it off. You then
    have a truly safe system whose only job is to hold the floor down.


    As with most things in life, the best answer is to use your best judgment and
    balance security with ease of use. Run only the services you need. For example,
    don''t run the Samba file system service if you don''t want to use your Red Hat
    Linux computer as a (Windows) file system server. Don''t run the text-based gpm
    mouse program if you use the graphical X Window mode on your computer. The list
    is endless and is beyond the scope of this book to discuss in detail. You can
    find more info from these sources:


    +   - **Web sites**: Both www.sans.org and www.usenix.org deal with security issues.

    - **HOWTOs**: Go to the site www.redhat.com/docs/manuals/linux/RHL-10.0-Manual
    and open the *Customization Guide and Reference* documents to access security
    advice.

    - **Books covering security**: Browse through your local bookstore to find Linux
    books that discuss how to reduce services. Some good books are *Red Hat Linux
    Security and Optimization*, by Mohammed J. Kabir, and *Linux Security Toolkit*,
    by David A. Bandel, both published by Wiley Publishing, Inc.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Hide Your Communications with OpenSSH


    You may find it difficult to trust communication media that you don''t completely
    control — such as university LANs, wireless home networks, and the Internet. Our
    point: Trust no one!


    ![](img/8c094d1b36276212c03d10d898508a6e_328_0.png)


    Any public network is potentially dangerous, especially the Internet. One way
    to protect yourself is to use encryption for all communication. You use encryption
    when you conduct credit card transactions or read remote e-mail. Secure Socket
    Layer (SSL) communication is the standard encryption mechanism for secure Internet
    browsing and e-commerce transactions.


    The Secure Shell (SSH) protocol is used to conduct encrypted CLI (command-line
    interface) terminal sessions and file transfers. Red Hat bundles the open source
    version of SSH called OpenSSH with its distributions. When you install Red Hat
    Linux, you automatically get the OpenSSH client. You can use OpenSSH from a terminal
    session by entering the command `ssh destination`. The destination is the computer
    you want to communicate with. You can get information about OpenSSH from www.openssh.org.


    ![](img/8c094d1b36276212c03d10d898508a6e_328_1.png)


    Using encryption is essential when you use wireless networking. Wi-Fi (also known
    as 802.11b) wireless networks can use built-in encryption based on the WEP protocol.
    WEP does have some significant security vulnerabilities, though. The only long-term
    answer is either to wait until the next standard comes along to fix the problem
    or to use OpenSSH to provide you with your own encryption. You''re much safer
    if you use OpenSSH and SSL for as much of your communication as possible.


    # Aha! No Firewall — Very, Very Good


    Broadband connections give you a quantum leap in speed and convenience when you''re
    connecting to the Internet. The two most popular choices for a broadband connection
    are DSL and cable modems. After you start using them, you may never go back to
    slow, Stone Age telephone-based modems.


    But every silver lining implies a dark cloud. Broadband connections give you not
    only fast Internet connections but also continuous ones. With a telephone-based
    modem, a hacker can attack only your home computer and private network while you''re
    connected to the Internet. Using a 24/7 broadband connection means that every
    hacker on the Internet — that means every hacker in the world — can constantly
    bang on your computer and private network. That''s lots of vulnerability.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'Firewalls provide your number-one protection from Internet-based attacks. The
    modern Netfilter/Iptables packet-filtering firewall system gives you excellent
    protection when it’s properly configured. The Red Hat installation process installs
    a good Iptables-based firewall by default, and Chapter 8 describes how to configure
    an even better one. You should never, ever connect to the Internet without first
    configuring your personal firewall.


    ![](img/8c094d1b36276212c03d10d898508a6e_329_0.png)


    We don’t mean to imply that you’re invulnerable to attack if you use a telephone-based
    modem to connect to the Internet. Traditional modem connections are just as vulnerable
    as continuous broadband connections *when they’re active*. What we mean is that
    an unconnected modem is a safe modem.


    # ## Keeping Up with the Software Joneuses


    Nobody’s perfect, and that goes for operating system vendors. Even open source
    Linux developers and excellent companies like Red Hat make mistakes. Vulnerabilities
    are found in software systems all the time and have to be fixed.


    Red Hat provides a way to keep up-to-date with current problem and security fixes
    through its Web site. Go to `ftp.redhat.com/pub/redhat` to find the newest and
    safest versions of all your system’s RPM packages. You can also find out how to
    use the Red Hat Linux Network, at `rhn.redhat.com`, so that it updates itself
    automatically — see Chapter 17 for details.


    # ## “Backups? I Don’t Need No Stinking Backups!”


    If you don’t regularly make backups of your computer’s contents, you face a security
    vulnerability, plain and simple. You may lose some or all of your valuable information
    if your computer is compromised. You should back up your data as frequently as
    possible.


    You can use one of many techniques and software for making backups, but that’s
    stuff we couldn’t possibly begin to cover in this book. We wouldn’t be able to
    cover Red Hat Linux if we even began to go into detail.


    ![](img/8c094d1b36276212c03d10d898508a6e_329_1.png)


    So keep it simple: Archiving your home directory and copying it to another location
    is a simple and effective backup mechanism.


    For example, the following commands use the ubiquitous Linux tape archive (tar)
    command to create an archive of your home directory. You can then use'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'the OpenSSH $scp$ command to securely copy the archive to another location,
    such as your ISP account or another computer you have access to. Follow these
    steps to create an archive of your home directory:


    +   1. Log in to your user account.

    2. Run this $tar$ command:


    ```

    tar czf mybackup.tgz .

    ```


    In this case, the $c$ option means to use $tar$ to copy the specified files and
    directories. The $z$ option tells $tar$ to compress the data. The $f$ option defines
    the text that follows it—$mybackup.tgz$—as the file to copy the files to. The
    single dot (.) says to copy to the archive all files in the current working directory.


    +   3. Use OpenSSH to copy the $tar$ archive to another location:


    ```

    scp mybackup.tgz myloginaccount@myisp.com

    ```


    This command securely copies the $tar$ archive to the account $mylogin$ $account$
    at the ISP $myisp.com$.


    # # My Buffer Overflow-eth


    One of the most popular methods that hackers use to break in to computers is via
    buffer overflows. The buffer overflow technique attempts to feed crazy streams
    of data to programs in order to make them behave in ways their designers never
    intended. (A detailed description of what a queue does is beyond the scope of
    this book. Suffice it to say that Linux uses a queue to store instructions and
    addresses for later use.) The result of the buffer overflow is that sometimes
    the program provides the hacker with a shell or other open door when it fails.


    The shell created by a buffer overflow is an open door to your computer. Sometimes,
    the shell has root (superuser) privileges, and then the hacker owns your system.


    Here are some simple techniques you can use to minimize buffer overflows:


    > **The first line of defense is simply to minimize the number of services you
    run.** You run zero risk of compromise from a buffer overflow vulnerability in
    Service A if you don’t run that service.


    For example, the Lion worm wreaked havoc in spring 2001. Lion exercised vulnerability
    in the Linux sendmail and lpd printer services. Computers that didn’t run those
    services weren’t vulnerable to the Lion worm.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '▸ The second line of defense is to update your Red Hat Linux computer as often
    as possible. Red Hat posts package updates, as they become available, that fix
    vulnerabilities. Buffer overflow fixes comprise many of the package updates. Updating
    your system fixes many buffer overflow vulnerabilities.


    # ## Social Engineering 1010101010


    Hackers don''t have to discover supertechnical tricks to break into your computer.
    Many smart hackers aren''t deterred when they encounter a well-protected computer
    or network. What does a poor hacker in these security-aware times have to do to
    break into your system?


    Some hacker techniques don''t rely on technological means. One such technique
    is *social engineering*, which is a fancy way of saying “I plan to trick you or
    your associates into giving me information to use against you.”


    Social engineering can be as simple as a hacker calling you to see whether you''re
    at home or in the office. If you''re not physically present, the hacker or burglar
    can drop by, break in and steal the computer or its disks. After someone gains
    physical possession of your computer, most security precautions you take can be
    easily defeated.


    Another social engineering technique hackers employ is to call a corporation''s
    help desk and pretend to be a VIP. The poor minimum-wage employee can often be
    bullied or cajoled into giving out a password or other important information.


    ![](img/8c094d1b36276212c03d10d898508a6e_331_0.png)


    The moral of the story is to exercise good security hygiene and be careful of
    strangers. Don''t give out information unless it''s essential and you can verify
    the authenticity of the request.


    # ## Bad Passwords


    Probably the easiest to avoid, and most often abused, vulnerability is poor or
    non-existent passwords. Passwords are your first line of defense. If your password
    is easily guessed or — even worse — blank, someone will break in.


    Bad passwords are easy to fix. Start by assigning a password to every account
    you create — *especially* root. Then make it a habit to use “good” passwords.
    Passwords can be cracked by brute force because computers have become very fast.
    Because you connect to the Internet, hackers can steal your `/etc/passwd` file,
    which contains the encrypted version of your text-based passwords and then use
    a computer to crack them.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '**REMEMBER** Use passwords that don’t use any word found in a dictionary. Simple
    words of any language are extremely easy to crack. For example, don’t use the
    password *redhat80*. Instead, you can change the *e* in *red* to 3 and the *a*
    in *hat* to @. Your password becomes *r3dh@t80*, which means that the cracking
    software has to use brute force, rather than a mere dictionary search, to discover
    it.


    # # Scan Me


    Information is king when it comes to people hacking into systems and keeping them
    out. Hackers use knowledge about your computer and network to break into your
    systems. One common and powerful tool for gaining information about which type
    of operating system you have and the services it runs is nmap. This port-scanning
    tool can discover a wealth of information about individual computers and networks.


    Nmap is included in the Red Hat Linux distribution. Install it by logging in as
    root, mounting the DVD (insert the DVD into the DVD/CD-ROM drive), and entering
    this command:


    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/nmap*

    ```


    You can then scan yourself, or any computer on your private network (if you have
    one). If you’re logged into cancun, for example, you can run this command:


    ```

    nmap localhost

    ```


    The nmap command probes your internal loop-back network interface — lo, for example
    — and returns a list of services you’re running. This list shows a sample result:


    ```

    Starting nmap 3.27 ( www.insecure.org/nmap/ ) at 2003-07-05


    Interesting ports on localhost.localdomain (127.0.0.1):

    (The 1616 ports scanned but not shown below are in state:

    closed)

    Port        State       Service

    22/tcp      open        ssh

    25/tcp      open        smtp

    80/tcp      open        http

    111/tcp     open        sunrpc

    443/tcp     open        https

    631/tcp     open        ipp

    6000/tcp    open        X11


    Nmap run completed -- 1 IP address (1 host up) scanned in

    0.385 seconds

    ```'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'If you’re a hacker, this information is good stuff. By knowing that the machine
    is running certain services, you can try to find vulnerabilities to exploit.


    Another good test to run is to log in to your ISP account and scan the Internet
    connection your computer or private network is attached to. If your firewall is
    running correctly, the scan shows little or nothing. That’s good. If the scan
    displays information about your computer and network, either your firewall isn’t
    running correctly or it’s not running at all.


    You can use that information to your advantage. Seeing what the hackers see gives
    you the ability to plug your security holes.


    # ### I Know Where You Logged In Last Summer


    Linux is good at keeping a diary. Red Hat is configured at installation to keep
    logs of every user login and other technical information. Examining logs is more
    of an art than a science, however. We don’t have any explicit techniques for determining
    whether your system is being attacked or has been broken into. Sorry.


    Experience counts for a great deal when you’re examining logs for discrepancies.
    The more you keep track of your system, the more you recognize its idiosyncrasies
    and general behavior. Red Hat checks its general-purpose logs in the `/var/log`
    directory. Check your logs frequently.'
  merge: -1
  img_proc: true
