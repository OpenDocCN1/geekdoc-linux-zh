- pgno: 81
  md: "Most of these items are self explanatory, but here's some additional information:\n\
    \n+   - Your user name (also known as a *login name*) is the name you use to log\
    \ in to your computer. Make your login name easy to remember and use all lowercase\
    \ letters. Cute names may not seem appropriate later. Avoid choosing a name that\
    \ is too long because you may have to type it several times a day. You may also\
    \ end up using your login name as your e-mail address and have to give it over\
    \ the telephone, so a login name such as `phool` results in missent messages,\
    \ leaving you feeling phoolish.\n- You can enter your full name, if you want.\
    \ That information is saved in the `/etc/passwd` file, which anyone with an account\
    \ on your system can read. This information is generally useful to system administrators\
    \ because it allows them to connect a person with each account. It's probably\
    \ superfluous if you're configuring your personal system.\n- The new password\
    \ should be different from the one you use for root.\n  As you type the password,\
    \ little asterisks, rather than the actual password, appear onscreen in case someone\
    \ is looking over your shoulder as you type. (Red Hat Linux is showing its paranoid\
    \ side here.) In text mode, you don't get any feedback (asterisks or other characters).\n\
    - Among your many choices for a default shell, `/bin/bash` is a good choice (*bash*\
    \ is a popular shell that is the default for Red Hat Linux).\n\n+   4. Click **OK**.\n\
    \n    Your account is created.\n\n![](img/8c094d1b36276212c03d10d898508a6e_81_0.png)\n\
    \nRed Hat Linux uses the Pluggable Authentication Module (PAM) that prevents you\
    \ from entering trivial or otherwise dangerous passwords; don't use that as assurance,\
    \ however, that your new password is a good one. A good password can't be found\
    \ in any dictionary because password crackers have programs that automatically\
    \ try all dictionary words to crack your password. Avoid birthdays and anniversaries\
    \ — or anything someone could associate with you. For ideas about good passwords,\
    \ check out Chapter 3. Just don't forget it, and don't write it on a sticky note\
    \ and put it on your monitor!\n\n![](img/8c094d1b36276212c03d10d898508a6e_81_1.png)\n\
    \nYou can also use the Red Hat User Manager to delete an existing user account.\
    \ Click the user name and then the Delete button, and the account is immediately\
    \ removed. Be careful because you're not asked to confirm the account deletion.\
    \ However, because the account home directory is left intact (not deleted) you\
    \ can go back and re-create the account if necessary."
