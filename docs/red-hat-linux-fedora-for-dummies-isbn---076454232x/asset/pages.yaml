- pgno: 368
  md: 'The package manager determines which additional packages are needed by the
    package you’re installing. After the dependencies are determined, the Completed
    System Preparation window displays the number of packages to be installed and
    how much disk space they require.


    +   7. Click the Continue button.


    The Information window opens and you’re prompted to insert the DVD.


    +   8. Insert the CD and click OK.


    The System Update Progress Installing window shows a progress meter.


    +   9. Insert additional CDs, if prompted, and click the OK button in the Information
    window.


    +   10. After the installation process is finished, the System Update Process
    window shows the Update Complete message.


    +   11. Click the OK button to return to the Add and Remove Software window.


    # Using Nautilus to install a package


    You can use the Nautilus file manager to install packages too. Nautilus acts as
    a front end to Red Hat Package Manager. You use Nautilus to select the packages
    you want to manipulate and the rest is taken care of for you.


    These instructions describe how to use Nautilus to install an RPM package or packages
    from a CD-ROM:


    +   1. Insert a CD containing the RPM packages you want to install.


    You can install a package from your hard disk too. If you have a package stored,
    for example, in your home directory, skip to Step 3.


    +   2. Insert the CD-ROM and a Nautilus window showing the CD opens.


    +   3. Find the package you want to install and double-click the package you want
    to install.


    If you’re not logged in as root, you’re prompted to enter the root password. Enter
    the password if and when you’re prompted.


    +   4. Click the Continue button when the Completed System Preparation window
    opens.


    If the package to be installed requires other packages, they’re displayed in the
    Completed System Preparation window; they get installed too. You can also see
    more information about the packages to be installed by clicking the Details button.


    +   5. The Updating system window opens and shows the progress of the package-installation
    process.


    Red Hat installs the package for you, and the Updating System window closes. You’re
    prompted to insert other CD-ROMS if necessary.'
  merge: -1
  img_proc: true
- pgno: 369
  md: "Until the advent of the RPM (and the Debian package manager on Debian Linux\
    \ systems), Linux software was distributed only by tar archives, which are sometimes\
    \ referred to as *tarballs*, or more descriptively, *hairballs*. The tar file\
    \ storage mechanism stores one or more files in a single file in a tar format.\
    \ A tar file has the `.tar` file suffix; if the tar file is compressed, it has\
    \ a suffix like `.tgz` or `.tar.gz`. Using the tar-based distribution system is\
    \ sufficient if your software doesn't change often and you're young. But when\
    \ you need to upgrade or change software or work with complex software systems,\
    \ tar becomes quite difficult to work with. Rather than spend your life spitting\
    \ up hairballs, use systems such as RPM to greatly simplify your life.\n\n# ##\
    \ Removing an RPM package\n\nYou can remove Red Hat packages as easily as you\
    \ install them. Use the RPM `erase (-e)` function, which is the opposite of the\
    \ `install (-i)` function. The package manager removes a package when you unselect\
    \ an installed package. These steps describe how to remove a package:\n\n+   1.\
    \  **Click the GNOME Menu button and choose System Settings\\> Add/Remove Packages.**\n\
    2.  **Enter the root password in the Information window, if you're prompted.**\n\
    \    The Package Management window opens.\n3.  **Click the Remove Software button\
    \ to open the Remove Package Groups menu.**\n4.  **Click the Remove button to\
    \ select the package group that contains the package you want to remove.**\n \
    \   For example, to remove a package in the Mail Server group, select the option\
    \ to the left of the Mail Server group, if it's blank. (Leave the radio button\
    \ alone if it's already selected.)\n5.  **Select the radio button to the left\
    \ of the package you want to remove.**\n    The check mark disappears.\n6.  **Click\
    \ the Remove Packages button.**\n    The Preparing System Update dialog box opens\
    \ briefly, and you return to the Completed System Preparation window.\n7.  **Click\
    \ the Continue button.**\n    The package (or packages) is removed.\n8.  **Click\
    \ the Continue button in the Completed System Preparation window.**\n    The package\
    \ (or packages) is removed.\n9.  **After the package-removal process is finished,\
    \ click the OK button.**\n    You return to the Add or Remove Software window."
  merge: -1
  img_proc: true
- pgno: 370
  md: '![](img/8c094d1b36276212c03d10d898508a6e_370_0.png)


    Be sure that you really want to get rid of the package because when you remove
    a package, it’s gone — as in *gone*. Okay, okay, maybe we’re being a little dramatic.
    You can always go online to a site like www.freshmeat.net or www.redhat.com. From
    there, you can download more packages to install. We recommend that you do so.
    Some new tool is always coming out that can help optimize your Red Hat Linux computing
    experience.


    # # Manual Shifting with RPM


    The first part of this chapter concentrates on using Red Hat Package Manager to
    install and remove packages. But you also have the option using the *rpm* command.
    It provides additional features for installation and removal functions. You can
    use *rpm* to install, update, remove, and query packages. This section provides
    examples of how to use the manual *rpm* command.


    # ## Manually installing and upgrading packages


    The *rpm -i* parameter indicates that an installation will take place. You can
    add Verbose mode (which provides additional information) by using the *-v* option.
    (You can combine options into a single group; for example, *-i -v* can become
    *-iv*.) Follow these instructions to install and upgrade packages:


    +   1. **Log in as root.**


    +   2. **Open a terminal emulator window by clicking the terminal icon in the
    GNOME Panel (refer to Chapter 4 for instructions).**


    The GNOME Terminal emulator window opens.


    +   3. **To add the package, type this command from a terminal window:**


    ```

    ```bash

    rpm -iv /mnt/cdrom/RedHat/RPMS/mozilla-mail*

    ```

    ```


    Alternatively, you can upgrade a package that has already been installed on your
    system. Substitute the RPM upgrade option, *-U*, in place of the install option,
    *-i*. For example, this command updates the Mozilla e-mail client package:


    ```

    ```bash

    rpm -Uv /mnt/cdrom/RedHat/RPMS/mozilla-mail*

    ```

    ```


    The files that constitute the newer Mozilla-mail package overwrite the older version.
    Existing configurations, however, are saved by adding the *.rpm.save* suffix to
    the configuration file.'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# # Manually removing packages


    RPM packages are good residents on your computer because they lend themselves
    to easy removal. The rpm command permits you to remove packages via the erase
    (-e) function.


    Suppose that you''re not so fond of the Mozilla e-mail client because you like
    the Evolution client better. No problem: Go ahead and remove the Mozilla mail
    package. To remove an RPM package, follow these steps:


    +   1. **Log in as root and open a terminal emulator window.**


    The GNOME Terminal window opens.


    +   2. **Enter this command to find the name of the package to remove:**


    ```

    ```bash

    rpm -qa | grep mozilla

    ```

    ```


    You should see these results:


    ```

    ```bash

    mozilla-nss-1.0.1-10

    mozilla-1.0.1-10

    mozilla-nspr-1.0.1-10

    mozilla-psm-1.0.1-10

    mozilla-mail-1.0.1-10

    ```

    ```


    You need to know the name of the package before you can remove it. We use this
    step to display all installed Mozilla packages to find the name of the package.


    +   3. **You can also find out about the package by using this command:**


    ```

    ```bash

    rpm -qi mozilla-mail

    ```

    ```


    Alternatively, you can display a list of all installed packages by using the rpm
    -qa command. Run the man rpm command to find query options.


    +   4. **Enter this command to remove the Mozilla e-mail client:**


    ```

    ```bash

    rpm -e mozilla-mail

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# Appendix F


    # About the DVD


    The DVD-ROM that comes with this book contains the full Red Hat Linux 10 (now
    named Fedora Core) distribution. This appendix describes the minimum computer
    configuration you need in order to install Red Hat Linux and also some of what
    you get on the companion DVD-ROM.


    > If your computer isn''t capable of reading DVD-ROMs, you can get the Red Hat
    Linux 10 (Fedora Core) distribution on CD-ROMs by sending in the coupon in the
    back of this book.


    Although the DVD-ROM contains the Linux kernel and supporting GNU programs and
    applications, it doesn''t carry some applications described in this book. You
    must download from the Internet applications such as Wine and Icecast2. We describe
    where and how to download all the applications we discuss in this book that aren''t
    on the companion DVD-ROM.


    # System Requirements


    Make sure that your computer meets the minimum system requirements listed here
    and in Chapter 3. More resources are needed for a graphical workstation. If your
    computer doesn''t match up to most of these requirements, you may have problems
    installing and running Red Hat Linux:


    +   - A Pentium-class PC with a 133MHz or faster processor is recommended.

    - For reasonable graphics performance using the X Window System, we recommend
    at least 64MB, and preferably 256MB, of main memory. You can never have too much
    memory, and these numbers are the least amount you should have.

    - You can run Linux on less than 128MB of memory if you don''t want graphics.
    Nongraphical Linux systems are typically used as servers.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '+   * Red Hat provides several installation classes that install different
    bundles of software. The various classes take up different amounts of space, of
    course. The basic installation, Personal Desktop, takes 2.1GB of disk space. The
    Workstation installation that we use in Chapter 3 consumes roughly 2.6GB. We recommend
    that your computer have a minimum of 3GB so that you have some room to play with
    after you install Linux.

    * A DVD-ROM drive, (and, optionally, a 3$\frac{1}{4}$-inch floppy disk drive plus
    a blank 3$\frac{1}{4}$-inch disk), a multisync monitor, an internal IDE or SCSI
    hard drive, a keyboard, and a mouse.


    The instructions for installing the Red Hat Linux operating system from the DVD-ROM
    are detailed in Part I. After you install the software, return the DVD-ROM to
    its plastic jacket, or another appropriate place, for safekeeping.


    # What You Find


    You can download the installation manual from the Red Hat Web site (`www.redhat.com/support`).


    You can view much of the documentation on this DVD-ROM through an HTML viewer,
    such as Mozilla, which is also included on the DVD-ROM; or you can print it. You
    can also view most of the documentation from other operating systems, such as
    DOS, Windows, or Unix.


    The DVD-ROM has a full implementation of Linux, and to list all the accompanying
    tools and utilities would take too much room. The DVD-ROM includes, briefly, most
    of the software so that you can


    +   * Access the Internet

    * Write programs in several computer languages

    * Create and manipulate images

    * Create, manipulate, and play back sounds (if you have a sound card)

    * Play certain games

    * Work with electrical design


    ![](img/8c094d1b36276212c03d10d898508a6e_373_0.png)


    For more information about Red Hat Linux agreements and installation, see the
    pages at the end of this book following the index.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# If You Have Problems

    (Of the DVD Kind)


    We tried our best to test various computers with the minimum system requirements.
    Alas, your computer may differ, and Linux may not install or work as stated.


    The two likeliest problems are that you don''t have enough RAM for the programs
    you want to use or you have some hardware that Linux doesn''t support. Luckily,
    the latter problem occurs less frequently each day as more hardware is supported
    by Linux.


    You may also have one or more FireWire, USB, or SCSI hard drives that use a driver
    (called a kernel module in Linux parlance) not supported by Linux or a controller
    that is simply too new for the Linux development team to have given it the proper
    support at the time the DVD-ROM was pressed.


    If you still have trouble with the DVD-ROM, call the Wiley Product Technical Support
    phone number: 800-762-2974. Outside the United States, call 1-317-572-3994. You
    can also contact Wiley Product Technical Support on the Internet, at www.wiley.com/techsupport.
    Wiley Publishing, Inc., provides technical support for only installation and other
    general quality-control items; for technical support for the applications themselves,
    consult the program''s vendor or author.


    To place additional orders or to request information about other Wiley products,
    call 800-225-5945.'
  merge: -1
  img_proc: true
