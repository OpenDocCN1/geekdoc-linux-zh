  md: 'of you use the same DSL modems, and we hope that our instructions match your
    equipment.)


    This section shows you how to use one of the more common DSL modems. Qwest, which
    is a “baby Bell” and one of the larger DSL providers, uses this equipment. Our
    **Cisco 675** or **678** DSL modem-router is the Qwest-recommended equipment.
    Cisco is one the largest network equipment suppliers in the world, and many people
    use its DSL modems.


    ![](img/8c094d1b36276212c03d10d898508a6e_107_0.png)


    Even if you’re using different equipment, our instructions should still be useful
    in outlining the general process of configuring a DSL connection. The process
    goes like this:


    +   1.  Connect your Red Hat Linux computer to the modem so you can configure
    it.

    2.  Start Mozilla and open the modem’s IP address. DSL modems typically use public
    addresses by default, such as `192.168.1.1`.

    3.  Set the modem’s passwords.

    4.  Tell the modem how to connect to your DSL provider.

    5.  Set up the modem’s firewall and NAT configuration, if it’s available.

    6.  Save the configuration.


    The details of how to accomplish each step vary between manufacturers, but the
    idea is still the same. Consult your modem’s user guide for detailed configuration
    information.'
