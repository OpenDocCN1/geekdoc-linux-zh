  md: '# ## Where to Go from Here


    You''re about to join the legions of people who have been using and developing
    Linux. We have been using Unix for more than 20 years, Linux for more than 10
    years, and Red Hat Linux for 10 years. We have found Red Hat Linux to be a flexible,
    powerful operating system, capable of solving most problems even without a large
    set of commercial software. The future of the Linux — and Red Hat Linux, in particular
    — operating system is bright. The time and energy you expend in becoming familiar
    with it will be worthwhile. *Carpe Linuxum*.'
