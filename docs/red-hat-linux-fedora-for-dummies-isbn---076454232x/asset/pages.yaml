- pgno: 115
  md: '![](img/8c094d1b36276212c03d10d898508a6e_115_0.png)


    IP addresses are analogous to street addresses: They provide a number that uniquely
    distinguishes your machine from all others. Private IP addresses don’t require
    any registration with the powers that be — the InterNIC organization that distributes
    IP addresses. Public IP addresses aren’t routed on the Internet and can be used
    on LANs for your own use.


    If you’re on a network with registered IP addresses, be sure to get an IP address
    from your system administrator. Otherwise, go ahead and use a private IP address.
    (Use any Class C address between 192.168.1.1 and 192.168.254.254; for example,
    192.168.1.20 or 192.168.32.5.) Private IP addresses in this range are designated
    for use by private networks. By design, private IP addresses don’t get *routed*
    (sent from one machine to another) through the Internet, and anyone can use them.
    Private IP addresses would wreak havoc on the Internet if they were routed.


    +   6. **Type 255.255.255.0 or the netmask for your IP address in the Subnet Mask
    text box.**


    ![](img/8c094d1b36276212c03d10d898508a6e_115_1.png)


    The Internet Protocol (IP) defines only three network address classes: A, B, and
    C. Only Class C addresses are assigned by InterNIC. Use the 255.255.255.0 netmask
    for Class C networks, 255.255.0.0 for Class B, and 255.0.0.0 for Class A.


    ![](img/8c094d1b36276212c03d10d898508a6e_115_2.png)


    Class C netmasks are used almost universally now, and we use only Class C addresses
    here. If you’re not using a Class C address, you’re probably experienced in the
    ways of TCP/IP and know which netmask to use. Godspeed. Otherwise, don’t fool
    with Mother Nature: Use a Class C address.


    +   7. **In the Default Gateway Address text box, type the IP address of the Internet
    gateway for your LAN.**


    The Internet gateway is the device (router or computer) that connects your network
    to your ISP and the Internet. Obtain the address from your system administrator
    if you’re at work and have one. If you’re a home user, a typical convention is
    to assign the highest address — 254 — of a Class C subnetwork as the gateway.
    For example, type 192.168.1.254.


    Your TCP/IP Settings should look similar to the dialog box shown in Figure 7-2.


    +   8. **Click the Forward button.**


    The Create Ethernet Device dialog box opens, indicating that you have finished
    the configuration process. The dialog box shows a summary of the information you
    entered in the preceding steps.


    +   9. **Review the summary and click the Apply button.**


    You return to the Network Configuration window that now displays the newly configured
    Ethernet NIC.'
  merge: -1
  img_proc: true
