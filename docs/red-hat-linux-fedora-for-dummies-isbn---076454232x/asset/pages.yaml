- pgno: 133
  md: '# In this part...


    One thing you can do with your computer is put up your feet and wait for the screen
    saver to kick in. You can confide to all your friends at the next party you attend
    that you have a “Red Hat Linux box.” (That will make you popular as they clamor
    to know when your stock options will mature.) Or, you can use your new Red Hat
    Linux workstation to get things done.


    To that end, Chapter 9 introduces the friendly world of the GNOME windows environment.
    GNOME, a friendly lil’ guy who likes to put a friendly face on Linux, can help
    you set up the “look and feel” of Linux so that you feel comfortable and at home.
    Chapter 10 goes further and introduces cool things you can do with GNOME applications.


    In Chapter 11, the fun starts. Can you say “Par-tay”? (Sorry.) Find out how to
    use the Mozilla browser and how to use multimedia players to listen to audio CDs
    and Ogg or MP3 files. We show you how to record music from CDs and how to become
    your own recording studio by recording audio (and data, if you’re a nerd) to CD.


    Chapter 12 takes the audio thing one step further. It describes how to use the
    open source multimedia players XMMS and MPlayer to listen to flowing streams —
    no, not water streams, but, rather, audio and video streams flowing from the Internet.
    You can listen to radio and audio clips and watch video too. With this knowledge,
    you never have to leave your couch again.


    Lucky Chapter 13 describes how to get work done with OpenOffice. Sorry — reality
    bites and personal productivity suites (word processors and spreadsheets, for
    example) are a necessary evil. Gotta make the doughnuts.


    Chapter 14 describes how to use WINE and VMware. The WINE system lets you run
    Windows applications, like Word 2000, directly from your Linux workstation! VMware
    creates virtual computers that run both Windows and Linux.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# # Chapter 9


    # ## Gnowing GNOME


    # **In This Chapter**


    +   - Introducing the X Window System

    - Introducing and exploring the GNOME desktop environment

    - Exploring the GNOME desktop

    - Using GNOME windows

    - Making GNOME icons

    - Exploring the GNOME Panel

    - Adding GNOME Panels

    - Exiting from GNOME and X

    - Modifying the look of your desktop

    - Introducing GNOME applications

    - Configuring MIME types


    The Red Hat Linux operating system provides two interactive interfaces for you
    to work from: the text-based command-line interface (CLI), as we describe in Chapter
    4, and the graphical X Window System. The command-line interface is similar to
    the old Microsoft Disk Operating System (MS-DOS) environment, which requires you
    to feed individual commands to the operating system; you can use the GNOME Terminal
    (emulator) as your CLI. The X Window System, also known simply as $X$, provides
    a graphical “point-and-click” environment from which most people prefer to work.


    Red Hat Linux provides two desktop environments for you to use: GNOME and KDE,
    or the K Desktop Environment. Both GNOME and KDE run on top of X, and both environments
    include a menu system to access utilities, applications, and shortcuts in the
    form of icons and other numerous other enhancements. Using either of these desktop
    environments makes using Red Hat Linux as your workstation easy and pleasurable.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'GNOME is the default desktop environment for Red Hat Linux. Red Hat also gives
    you the option of installing KDE, an excellent system that many people prefer.
    However, because of limited space in this book, we discuss only GNOME.


    ![](img/8c094d1b36276212c03d10d898508a6e_135_0.png)


    The excellent Red Hat Linux “minibook” describes KDE in more detail.


    In this chapter, you find out a little about X and the basics for working with
    GNOME. You also get to mess around with the GNOME Panel and desktop (the GNOME
    Panel is similar to the taskbar in Windows computers). We show you some simple
    but effective maneuvers to manage your desktop and describe some applications.


    # ## Introducing the X Window System


    Red Hat gives you the option of using the GNOME and KDE desktop environments.
    GNOME and KDE, however, run on top of X, and X runs on Linux. *X* is the software
    that provides the low-level graphical tools that systems like GNOME use. X is
    the middleware that makes building complex systems like GNOME possible.


    ![](img/8c094d1b36276212c03d10d898508a6e_135_1.png)


    The version of X that comes with Red Hat Linux is both sophisticated and simple
    to use. That wasn''t always the case, though; in fact, it took lots of natural
    — dare we say Darwinian? — selection to arrive at the current arrangement of X,
    and the result works well.


    X is composed of three main parts:


    +   - The X server

    - Numerous graphics libraries

    - A set of X client graphics applications


    The *X server* is a program that talks to the human-interactive hardware on your
    computer — such as the video card, keyboard, and mouse — and runs interference
    between this hardware and other graphics software. It uses the graphics libraries
    to work properly with the graphics hardware.


    *X clients* are graphical programs, such as Mozilla and xclock. X clients display
    their graphical output through the X server; they also get their keyboard and
    mouse input through the X server. X clients can be run on the same computer that
    the X server runs on or across a network to any computer running an X server.
    For example, by using X, you can run an X client on a computer on the'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'other side of the world and view it on the X server running on your home computer.


    Suppose that you''re logged in to a computer in Australia and you want to see
    what time it is there. You could run the *date* command (from a command line)
    to see the date and time, but that would be boring. Instead, you could run the
    *xclock* program on the remote machine and see a graphical clock displayed on
    your local computer. You can then verify that the Aussies use clocks that run
    clockwise and have 24-hour days.


    ![](img/8c094d1b36276212c03d10d898508a6e_136_0.png)


    The X server program, often called simply *X*, isn''t part of the operating system,
    as it is in some other operating systems. Instead, the X server is a *user-level*
    program — although it''s special and complex.


    The X Window System provides the foundation for these graphical-based systems:


    +   - **Desktop environment:** GNOME and KDE provide a desktop environment that
    makes using your computer easy. Desktop environments provide high-level functions
    like menu systems, icons, and backgrounds. A desktop environment is equivalent
    to a house where X is the foundation.


    +   - **Graphical applications:** Red Hat installs numerous applications, such
    as games, system administration utilities, Mozilla, and Ximian Evolution to provide
    the functionality that helps you use your computer and the Internet. Graphical
    applications are equivalent to the appliances in a house.


    # ## Introducing the GNOME Desktop Environment


    GNOME stands for GNU Network Object Model Environment. (GNU itself stands for
    GNU''s Not UNIX, a recursive acronym designed by guys who probably never went
    to their prom but did change the world.) If you have trouble remembering acronyms,
    just think of GNOME as *great graphics for nada money.* However you remember it,
    GNOME is an open source graphical desktop environment. It provides a platform
    for completing your everyday tasks, such as word processing and Internet browsing,
    on your Red Hat Linux computer.


    Log in to your Red Hat Linux computer and check out the GNOME interface. It should
    look something like Figure 9-1 and consists of these three major elements:'
  merge: -1
  img_proc: true
- pgno: 137
  md: '![](img/8c094d1b36276212c03d10d898508a6e_137_0.png)


    +   - **The desktop**: Quite simply, the desktop is what you see on your computer
    screen. It’s the space where you do your work and is equivalent — ta-da! — to
    the top of a desk. The desktop comes preconfigured with a background and several
    icons that include links to such places as your home directory and the trash bin.
    Icons are equivalent to the junk you pile on your desk: Some is useful and some
    isn’t.


    When you double-click the home directory (or right-click and choose Open), a Nautilus
    window opens and displays the contents of those directories. *Nautilus* is a graphical
    system for working with not only files and directories but also administration
    utilities and Web pages. See Chapter 10 for more information about Nautilus.


    +   - **The Panel**: The menu bar that runs across the bottom edge of your GNOME
    screen is the Panel. You can access every GNOME function and Red Hat or third-party
    application from the GNOME Panel. It represents the drawers in a desk.


    +   - **Applications**: These elements include user system and GNOME-level applications.
    User programs include applications such as Mozilla, Evolution, XIMS, and Xine.
    System applications include the Red Hat Linux system administration utilities,
    such as network configuration and user management utilities, and GNOME utilities,
    such as the Help browser. Applications are equivalent to the toys and work to
    be done on and in your desk.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Exploring the GNOME Desktop


    GNOME performs all the basic graphical functions you expect from a desktop environment.
    You can set the background and create icons, for example. This section shows how
    to perform some basic GNOME desktop maneuvers and configurations. After you master
    the basics, you can continue to explore on your own.


    The default GNOME desktop — as installed by the Red Hat Linux installation — comes
    with several elements preinstalled. Let''s take a quick trip around the desktop.


    # Introducing the default desktop icons


    In the upper-left corner of the desktop are three icons: your home directory,
    Start Here, and Trash (refer to Figure 9-1). They perform these tasks:


    ![](img/8c094d1b36276212c03d10d898508a6e_138_0.png)


    **Home directory:** This icon, which looks like a folder, represents your home
    directory. For example, if you create a user account named `lidia`, a directory
    named `/home/lidia` is created; the icon is labeled `lidia’s Home`. When you log
    in as `lidia`, the home directory icon is linked to that directory. Double-click
    the home directory (or right-click and choose Open) and a Nautilus window opens,
    displaying the contents of the home directory.


    Double-clicking an icon opens the window associated with the icon. For example,
    double-clicking your home directory opens a Nautilus file manager window linked
    to your home directory. You can also open an icon by right-clicking it and choosing
    the Open option.


    **Start Here:** GNOME provides a Preferences window that includes links to the
    major GNOME and Red Hat configuration utilities and applications. Double-click
    the Start Here icon and the Start Here window opens. Opening any of the icons
    — Applications, Preferences, Server Settings, or System Settings, for example
    — opens another Nautilus window that provides access to utilities and applications:


    +   * **Applications icon:** Clicking the Applications icon is equivalent to clicking
    the GNOME Menu. You see a window of icons that mirrors the GNOME Menu. Any item
    you can reach from the GNOME Menu, you can access from the Applications icon.

    * **Preferences:** Clicking the Desktop Properties icon is equivalent to choosing
    GNOME Menu>Preferences. You get to choose from a number of GNOME configuration
    options. The GNOME Preferences window is described later in this chapter, in the
    “Making GNOME Recognize MIME Types” section.


    ![](img/8c094d1b36276212c03d10d898508a6e_138_1.png)'
  merge: -1
  img_proc: true
- pgno: 139
  md: '• **System Settings**: Double-clicking the System Settings icon opens the System
    Settings window, which allows you to start various administrative utilities. You
    find icons, such as Red Hat Network Configuration, and the Printing utilities
    here.


    ✓ **Trash icon**: GNOME provides a method to dispose of files and directories
    in the form of the Trash directory. Click any icon, file, or directory and drag
    it to the Trash icon. Although Jesse James'' Monster Garage automated trash minivan
    doesn’t come for your file, it’s placed in the Trash directory; the Trash directory
    is in your home directory.


    Trashed items aren’t really deleted until you right-click the Trash icon and choose
    Empty trash. You can undelete items by opening the Trash (double-clicking the
    icon) and then clicking the item and dragging it out onto the desktop or an open
    Preferences window.


    # Changing themes and backgrounds


    GNOME provides the ability to change the look and feel of its elements. The look
    and feel of an element — typically, a window opened on the desktop — is referred
    to as its *theme*. *Themes* determine the size, shape, texture, and color of the
    buttons, slides, menus, borders, and other pieces of an open window.


    You can change your theme more easily and quickly than a politician during an
    election by choosing GNOME Menu*?*Preferences*?*Theme; alternatively, you can
    open the *Start Here* icon and select *Preferences* in the window that opens.
    Double-click the *Theme* icon when the *Preferences* window opens.


    When the *Theme Preferences* window opens, the *Application* tab is activated
    by default. You can select any theme and all your open windows immediately adopt
    it. The application theme changes the tint and texture applied to each window.
    For example, clicking the *Metal* theme gives your windows a brushed surface appearance.


    Click the *Window Border* tab. Click any of the themes and your window borders
    change. Window borders consist of the tint and texture of the strip that surrounds
    each window and the buttons on the strip.


    Keep selecting different themes until you find one you like. Click the *Close*
    button when you’re finished.


    You can also select the image that’s displayed on your desktop. The image can
    be a picture, a pattern, or solid colors. Change the desktop to find one you like
    by right-clicking any blank (uncluttered) section of the desktop.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Choose Change Desktop Background from the menu and the Background Preferences
    window opens. Select an image by clicking the Picture section or one of its variations.
    The Please Select an Image window opens. You can select any listed image or search
    for another image on your disk. Alternatively, you can select a solid color by
    clicking the No Picture button.


    Open the Background Style menu and select either a solid color or colors that
    change on the vertical or horizontal axis. You can then change the color (solid
    or gradient) by clicking the Color button. Select your color from the Pick a Color
    window. Repeat the process for the other color, and you get a screen full of colors.


    Right-clicking anywhere on a blank section of the desktop and then choosing Use
    Default Background resets the background. The default background gets reactivated.


    # ## Toiling in your workplace


    After using GNOME for a while, you find that as you start more and more applications,
    you create lots and lots of windows on the screen. You may even lose windows behind
    other windows. Perhaps you want to strap together several monitors so that you
    can display all the windows at one time.


    Monitors are expensive and bulky, so you''re probably stuck using a single monitor.
    But you don''t have to stick with one *screen*. GNOME lets you spread your work
    across multiple *virtual monitors*.


    Imagine that you have a large GNOME desktop spread equally across four monitors.
    Life would be good if you could open windows on any of the monitors. You would
    have lots of real estate to spread out on.


    However, because you probably don''t have four monitors, GNOME simulates four
    *virtual monitors*, called *workspaces*. Each workspace is equivalent to a real
    monitor, and you can spread out your work across it. The only limitation is that
    you can view only one workspace at a time.


    # ## Trading places on your workspace switcher


    Switching between workspaces is easy. GNOME provides a utility, the Workspace
    Switcher, to select any workspace. The Workspace Switcher is on the GNOME Panel.'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'You use the GNOME Workspace Switcher to access each workspace. The Workspace
    Switcher is divided into four quadrants. Clicking any of the quadrants places
    you in the corresponding desktop. Click the lower-right one and you enter that
    workspace.


    You can force a window into any or all workspaces. Click the downward-facing arrow
    in the upper-left corner of a window. The menu that opens provides all the expected
    functions that close, minimize, maximize, and resize the window. However, toward
    the bottom of the menu are options for placing the window in any of the remaining
    three workspaces; or, you can put the window in all the workspaces. You may want,
    for example, to put an application like Mozilla in all workspaces in order to
    use it no matter what you''re doing.


    # ## Messing Around with Windows


    Before you can do anything to a window, you have to get its attention. When you
    have a window''s attention, it has *focus*. Depending on how you have set up GNOME,
    you can give a window focus with GNOME in several ways:


    +   * Click the window''s name on the GNOME Panel.

    * Click the window''s title bar, at the top of the window.

    * Click a part of the window itself, which typically also makes the window the
    topmost one. This method is the default.

    * If you''re working in an office with lots of people, you can shout, "Hey, you
    — wake up!" Although this tactic isn''t likely to wake up your window, it sure
    is fun.


    ![](img/8c094d1b36276212c03d10d898508a6e_141_0.png)


    In this book, we stick with the Red Hat and GNOME default of clicking a window
    to give it focus.


    # ## Moving windows


    To move a window, click anywhere on the window''s title bar and hold down the
    left mouse button. As long as you continue to hold down that button, the window
    moves anywhere you move your mouse. Release the button and the window stays there.


    # ## Resizing windows


    Sometimes, a window is a little too big or a little too small, and you know that
    life would be much easier if you could just nudge that window into shape. To'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'do just that, position the mouse cursor on any border of the window. Click
    and drag the window''s outline to the size you want. Release the mouse button
    and the window takes the new size.


    # Minimizing windows


    Now that you have put lots of windows on the screen, how can you get rid of a
    few or all of them? You can *minimize* (or *iconify*) a window by clicking the
    bold, underscored button toward the upper-right corner, which removes the window
    from the desktop and places it in a storage area of the GNOME Panel. If you''re
    in a particularly devilish mood, you can be more drastic and *close* a window.
    Figure 9-2 shows an open Mozilla window minimized — you can see its icon on the
    GNOME Panel along the lower, central edge of the screen.


    **Figure 9-2:**

    Mozilla minimized inside GNOME.


    ![](img/8c094d1b36276212c03d10d898508a6e_142_0.png)


    Here are a few ways to get rid of a window, starting with the least drastic and
    escalating to outright window death:


    +   - Take advantage of any exit buttons or menu options that the window or application
    in the window gives you. For example, many applications allow you to choose File→Exit
    to close the application.

    - Click the X button in the upper-right corner of the window''s title bar to close
    the window.

    - Click the upper-left corner of the window (or right-click the title bar) and
    choose the Close option from the menu that opens.


    You can return a minimized window to the desktop by clicking the icon that corresponds
    to the window on the GNOME Panel.


    # Maximizing windows


    To make a window fill the entire screen, click the Maximize button, in the upper-right
    corner of the window. Check out the buttons to the right of the title bar in a
    typical window. The Maximize button is the one in the middle; it looks like a
    square and is similar in action to the Cascade button in Windows.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# The Making of a Desktop Icon


    You can create an icon on your desktop for any application on the GNOME Menu.
    Just click the GNOME Menu button, find the menu item for the application you want
    an icon for, and then left-click the application’s icon and hold down the mouse
    button. While continuing to hold down the button, drag the mouse cursor to any
    open area on the GNOME desktop (or the GNOME Panel). Release the mouse button
    and an icon for that application is placed on the desktop. You can then start
    the application by double-clicking the icon on the desktop (or just clicking an
    icon that lives on the GNOME Panel).


    With GNOME, you can enhance icons with emblems. *Emblems* provide additional information
    about what an icon is meant to do. You can assign an Emblem by right-clicking
    an icon and choosing *Properties*. The Properties window opens. Click the *Emblems*
    tab and select one of the emblems. For example, if you select the Cool emblem,
    a pair of Wayfarer sunglasses is displayed with the icon on the desktop — cool.
    You can see the cool icon due in the margin of this paragraph.


    ![](img/8c094d1b36276212c03d10d898508a6e_143_0.png)


    Another cool GNOME icon feature is the ability to stretch an icon’s boundaries.
    Right-click an icon and choose *Stretch*. A dashed line and four square buttons
    bracket the icon. Click any of the buttons and you can stretch the icon image
    as much as you want.


    # Playing with the GNOME Panel


    The GNOME *Panel* is the menu bar along the bottom of the desktop. The GNOME Panel,
    similar to the taskbar in Windows, provides a location to place common menus and
    applets for easy starting or viewing. The GNOME Panel also gives you a view of
    the virtual desktop and enables you to keep track of minimized windows.


    By default, Red Hat Linux places icons on the GNOME Panel for accessing the GNOME
    Menu, Mozilla, Evolution, OpenOffice (Writer, Impress, and Calc), and the GNOME
    Workspace Switcher. You can start any of these programs or use the switcher by
    clicking its icon.


    The most important element on the GNOME Panel is the GNOME Menu button, on the
    far left side, which you use to access all the standard GNOME applications and
    configuration tools. The GNOME Menu button, which looks amazingly similar to a
    red hat, is in the lower-left corner of the screen. You can choose from any of
    the menus that are displayed when you click the GNOME Menu button. For example,
    the System Settings and System Tools menus contain many of the Red Hat utilities
    you can use to administer your'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Red Hat Linux computer. The Sound & Video menu provides access to a CD player,
    and the Graphics menu provides access to graphical applications. You get the idea.


    You can use the Add to Panel submenu to modify the configuration and behavior
    of the GNOME Panel. For example, if you right-click any unused portion of the
    GNOME Panel and choose Add to Panel->Amusements->Eyes, you get a nifty pair-of-eyes
    applet added to the GNOME Panel. The eyes follow your mouse around the screen
    — ooh, scary. Eyes demonstrates the tremendous extra dimension of functionality
    that enters your life when you use Red Hat Linux. (You can remove the eyes by
    right-clicking its icon and choosing the Remove from Panel option.)


    One other interesting function of the GNOME Panel menu is the Add New Launcher
    function. Click any unused section of the GNOME Panel and choose Add to Panel->Launcher.
    The Create Launcher Applet window opens. By entering the pathname of an application,
    you can add a new applet to the GNOME Panel that *launches*, or opens, that application.


    GNOME provides a file searching utility, named Search Tool. Click the GNOME Menu
    button and choose Search for Files, and the Search Tool opens. Enter the name
    of a file you want to find and click the Find button. Click the Advanced tab and
    you can conduct a more finely tuned file search.


    Give it a try. For example, if you frequently use MPlayer to listen to Internet
    audio streams (described in Chapter 12), you can add an applet for it to your
    Panel so that you can easily launch MPlayer on a whim. Open the Create Launcher
    Applet window again and add the name, the generic name, any comments, and the
    command (gmp\*layer*) to launch the program. If you click the No Icon button,
    you see a few pages of standard icons you can use to distinguish your new applet
    from others on the GNOME Panel; in this case, we chose a generic apple as our
    icon mascot. Figure 9-3 shows the finished applet launcher window.


    ![](img/8c094d1b36276212c03d10d898508a6e_144_0.png)'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'After you finish editing the Create Launcher Applet window, click **Ok**. The
    icon is added to your Panel, as shown in Figure 9-4. You can create a launcher
    for any application on your Red Hat Linux computer in the same way.


    ![](img/8c094d1b36276212c03d10d898508a6e_145_0.png)


    # Adding and Deleting Panels


    You''re not limited to the default GNOME Panel. You can create additional panels
    at will. Click anywhere on an unused portion of the GNOME Panel and choose New
    Panel. For example, choosing Edge Panel places a blank panel along the top of
    the screen.


    The new panel is blank and doesn''t contain any icons, like the default GNOME
    Panel does. The new panel does have a basic menu you can use to populate it with
    icons and other menus. Right-click the new panel and the Add to Panel submenu
    opens. You can use the Add to Panel menu to build up the new panel. For example,
    choose Accessories Clock and a digital clock is added to the panel, as shown in
    Figure 9-5. Or, choose Amusements Geyes. Keep adding icons until you''re satisfied
    with the new system.


    ![](img/8c094d1b36276212c03d10d898508a6e_145_1.png)


    You can, of course, remove any panel you create, but you can''t remove the default
    GNOME Panel. The process is simple: Right-click any unused section of the panel
    and choose Delete This Panel. Click the Delete button in the Delete Panel window
    that opens, and the panel is delpaneled.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'Any panel can be made to hide when it’s not in use. Right-click any unused
    section of the panel and choose Properties from the pop-up menu, and the Panel
    Properties window then opens. Select the Autohide option and click the Close button.
    The panel disappears off the edge of the screen until you move the mouse cursor
    back to that edge. The panel then reappears.


    ![](img/8c094d1b36276212c03d10d898508a6e_146_0.png)


    Every new panel contains arrows at each end, called Hide buttons; the original
    default Panel does not. Clicking either of the arrows forces the panel to slide
    off to one side or the other. The panel is hidden except for those same arrows.
    Clicking the arrow uncovers the hidden panel.


    # ## Leaving GNOME and X


    If you want to leave your computer on but don’t want to leave it open to anyone
    just walking along, you can save yourself the time spent logging out of your GNOME
    desktop by using the screen lock. To do so, click the GNOME Menu button and choose
    Lock Screen; the screensaver is displayed. To return to productive life and your
    desktop, press any key or wiggle your mouse and enter your password in the X Screensaver
    window that opens.


    # ## Securing your computer while you step out for a moment


    Locking your screen is one of the best security features you can use. To lock
    your screen, click the GNOME Menu button and choose Lock Screen. Your screen locks
    up and you must enter your password to get back in. Locking your screen is a good
    idea when you’re going to be away from it for even a minute or two.


    # ## Going home for the night


    After you have finished for the day and want to go home (or just upstairs), you
    need to log out. Click the GNOME Menu button and choose Log Out. The Are You Sure
    You Want to Log Out? window opens. Click Log Out to — you guessed it — log out.
    You also have the options to shut down or reboot your computer.


    ![](img/8c094d1b36276212c03d10d898508a6e_146_1.png)


    GNOME configures a random screensaver by default. You can select a single screensaver
    by clicking the GNOME Menu button and choosing Preferences→Screensaver. The Screensaver
    Preferences window opens. For example, you can switch from the default random
    screensaver to the X Jack (we all know'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'that all work and no play makes Jack a dull boy) screensaver. It’s not a bad
    selection for those long winters spent at peaceful resorts with plenty of time
    to write Linux books!


    # eXterminating X


    When you can’t get your applications to respond to you, you can simply stop X,
    which kills all programs running under it. To do so, press the Ctrl+Alt+Backspace
    keys all at one time. If you started X manually, you can then log out of the account.
    If X is started automatically at boot time (as we assume in this book), you see
    the X login screen and you can log back in.


    # Making GNOME Recognize MIME Types


    You can modify the look and feel of your desktop by using an assortment of GNOME
    configuration utilities. Double-click the Start Here icon on the desktop. When
    the window opens, double-click the Preferences icon. (You can access the same
    functions by clicking the GNOME Menu button and then opening the Preferences menu.
    A submenu opens, showing the same options as in the Preferences window.)


    Figure 9-6 shows the Preferences window, where you can modify GNOME properties.
    For example, double-click the File Types and programs option and you can associate
    applications with MIME types.


    ![](img/8c094d1b36276212c03d10d898508a6e_147_0.png)'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Double-click the **Files Types and programs** icon and the File Types and Programs
    dialog box is displayed. GNOME recognizes MIME types by the information stored
    by this utility. For example, choose **Audio**::**OGG** and then **Edit**. The
    File Types and Programs window opens (see Figure 9-7).


    ![](img/8c094d1b36276212c03d10d898508a6e_148_0.png)


    The Edit File Type window shows that Ogg audio files belong to the MIME type `application/x-ogg`.
    The window also shows that Ogg audio files use `.ogg` file suffixes. No default
    action is specified. You can open the Default action pull-down menu and then choose
    **X Multimedia System** if you want XMMS to play your Ogg files or enter the name
    of a program manually in the Program to run subwindow. Whatever program you select
    is used to play Ogg files whenever you click them in any Nautilus or other file
    manager window. XMMS is a standard audio player bundled with Red Hat Linux.


    The Preferences window also lets you configure items other than screen savers
    with maniacal ratings. We leave it to you to explore the wonderful world of setting
    your keyboard bell and other items.


    # ## Accessing GNOME Applications


    The last GNOME element consists of the applications that come packaged with GNOME.
    GNOME provides numerous applications intended for work and fun. Red Hat also provides
    a wide range of applications, some of which are accessible via GNOME. (You can
    also add your own applications from the open source community and third parties.)'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Nautilus provides another way of accessing many applications on your Red Hat
    Linux computer. Applications that don''t have links to GNOME aren''t accessible
    via the GNOME Menu system; you can generally correct that situation by manually
    adding links with the GNOME Add to Panel option.


    This list describes the methods used to access applications:


    +   - **Start Here:** Open the GNOME Start Here window and double-click the Applications
    icon. You can then start most of the applications Red Hat Linux installed on your
    computer.

    - **Nautilus:** Clicking your Home directory icon opens a Nautilus window. You
    can then start any executable application stored in your home directory by double-clicking
    its icon. You can also change to any other directory — that you have access permission
    to — to run an application.

    - **GNOME Menu:** Opening the GNOME Menu provides access to every application
    GNOME “knows” about (every application that GNOME has been configured to access).
    Using the GNOME Menu provides access to the same set of programs as the Start
    Here Applications windows.

    - **Old School:** GNOME provides two methods for running programs from a CLI (a
    command-line interface). You can start a GNOME Terminal emulator window or use
    the GNOME Run Program function. The former opens a bash shell in a Terminal emulator
    window from which you can launch applications. The latter opens a window in which
    you can enter the name of a program to execute. The primary difference between
    the two systems is that you can interact with an application more when using the
    terminal emulator. The Run Program system allows you to interact with an application
    only if it creates a GUI.


    The following list illustrates the rich application landscape you get with Red
    Hat and GNOME. The list corresponds to the menu selection you see when you click
    the GNOME Menu button:


    +   - **Accessories:** Applications that don''t belong to any groups on this list
    are labeled as accessories. Applications such as the GNOME calculator, gedit,
    and a dictionary are placed in this category; the dictionary is quite useful —
    enter a word and its definition is displayed.

    - **Games:** Because Linux was initially oriented toward running services, you
    may not see it as being oriented toward game players. But it has lots of games.
    Open the Games icon and you see many of them. You can waste your life with Linux
    just as easily as with Windows! Ha!

    - **Graphics:** You can view and manipulate images with these graphical utilities;
    ImageMagick and The Gimp are excellent tools for working with pixels. You can
    use the Scanning tool to scan images on a scanner. DVI,'
  merge: -1
