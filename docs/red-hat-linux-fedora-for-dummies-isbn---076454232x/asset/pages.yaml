    When you''re shopping for a new modem, avoid WinModems like dot.com stock because
    these modems are designed for only Windows computers. They''re cheaper than regular
    modems because they''re lazy (or smart, depending on how you look at it) and depend
    on the Windows operating system to do much of their work for them. Linux drivers
    are only now beginning to appear for these types of modems. See the preceding
    sidebar, “If you''re buying a modem,” for more information about purchasing a
    modem for your Red Hat Linux computer.


    # Configuring Your Internet Connection


    You need to configure your modem so that Red Hat Linux can use it to connect to
    your ISP. The Red Hat Dialup Configuration utility does a good job of detecting,
    and then configuring, your modem. It also sets up a dial-up account to connect
    your computer to your ISP and thus to the Internet.


    Get started by following these steps:


    ![](img/8c094d1b36276212c03d10d898508a6e_89_2.png)


    +   1. Click the GNOME Menu button and choose System Tools::Internet Configuration
    Wizard.


    The GNOME Menu button is the icon that looks like a red fedora in the lower-left
    corner of your screen.


    If you''re not logged in as root, you''re prompted to enter the root password
    in the Input dialog box. Enter the root password.


    2. The Select Device Type window opens. You use this window to configure any type
    of communications device, such as a modem or network interface. Click the Modem
    connection option from the menu and then click the Forward button.


