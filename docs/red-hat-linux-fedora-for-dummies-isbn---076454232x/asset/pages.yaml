- pgno: 262
  md: '![](img/8c094d1b36276212c03d10d898508a6e_262_0.png)


    You can skip having to manually click the up2date icon every time an update is
    available (oh, life is so hard). You can configure up2date to automatically update
    your system whenever it detects a new package.


    Your Red Hat Linux computer can now receive updates. The up2date icon is displayed
    on the right side of the GNOME Panel. When the icon is green, life is good. When
    the icon turns red, however, updates are available. (A yellow icon indicates that
    up2date doesn''t know whether an update exists for your machine.) You want to
    click the icon so that it downloads and installs the updates.


    You can automate the update process using the Linux cron facility. Run the `crontab
    -e` command and create a cron entry like this: `0 1 * * * up2date -u`. This example
    launches the up2date utility every day at 1 a.m. The `-u` option forces up2date
    to update any available Red Hat packages.


    Red Hat provides summary and other information about your account at `rhn.redhat.com`.
    Go to that page and enter your username and password in the Sign In to RHN subwindow.
    You can view the status of your registered machine (or machines), modify your
    account, and read other important information.


    Regularly updating your computer is an essential security measure. Many, many
    break-ins occur because of out-of-date software. With the help of RHN, you eliminate
    most vulnerabilities as they occur.'
  merge: -1
  img_proc: true
- pgno: 263
  md: "![](img/8c094d1b36276212c03d10d898508a6e_263_0.png)\n\nRed Hat permits you\
    \ to register, for free, one computer for basic update service. Basic service\
    \ allows you to download and install updated RPM packages. To update more machines,\
    \ you have to purchase additional subscriptions at $60 per year. Note that you\
    \ can register more machines under the Red Hat Network service, but they aren't\
    \ eligible for updates.\n\n# ## Reducing your exposure: Removing and reducing\
    \ services\n\nHackers look for computer vulnerabilities by probing for vulnerable\
    \ network services. Network services — such as Apache, Samba, and DHCP — are,\
    \ of course, designed to respond to network queries. Therefore, hackers can readily\
    \ find out what services you run and then find which, if any, attacks to use.\n\
    \nWe describe elsewhere how keeping software updated minimizes your vulnerability.\
    \ However, you can go one step better and make a service invulnerable by turning\
    \ it off. One simple security rule is “Keep it simple.” The simple fact is that\
    \ if you don't need to run a service, you shouldn't.\n\nWe describe in this section\
    \ how to eliminate or reduce both network and non-network services. This section\
    \ describes how to use the `chkconfig` utility to change the startup scripts that\
    \ control when, how, and whether a network services starts at boot time:\n\n+\
    \   1.  Click the **GNOME Menu** and choose **System Settings**:Server Settings:Services.\
    \ Enter the root password if you're prompted.\n    The Service Configuration window\
    \ opens.\n2.  Select an unnecessary service and shut it off by clicking the **Stop**\
    \ button.\n3.  Click the **OK** button when the confirmation window appears.\n\
    4.  Click the check mark to the left of the service to remove the check mark.\n\
    \    Removing the check mark prevents the service from starting automatically\
    \ at boot time.\n5.  Repeat Steps 2–4 for each unnecessary service.\n6.  When\
    \ you have turned off each unnecessary service, click the **Save** button.\n7.\
    \  Choose **Quit** from the **File** menu.\n\nWhich services you turn off depends\
    \ on your needs, of course. For example, if you're unintentionally running a web\
    \ server, turn off the `httpd` service. You generally should be able to turn off\
    \ these services:"
  merge: -1
  img_proc: true
- pgno: 264
  md: '+   The Advanced Power Management Daemon (APMD): APMD is useful if you — like
    most people — regularly power-off your personal workstation or laptop. However,
    APMD is generally unnecessary on servers that run continuously. You want to keep
    APMD in the former case (workstation or laptop) and remove it in the latter (server).

    GPM: This service allows you to use a mouse when running in nongraphical mode.
    You''re running in graphical mode, so turn it off.

    The job queue daemon: The atd daemon is used to schedule one-time cron-like jobs.
    If you need atd, you know it. Otherwise, turn it off.

    Network File Sharing (NFS): You need only services such as nfs, nfslock, portmap,
    and autofs when you''re running an NFS server or client. The last thing you want
    to do is share files to the Internet, for example.

    Print services: Many people don''t run the printer daemon on servers. Turn off
    cups or lpd whenever you don''t need to print.

    Samba: Just like with NFS, you should turn off Samba if you don''t need it.


    The rest is up to you. Terminate services with a vengeance.


    You can''t modify a service when it isn''t running. You can toggle off the check
    mark on a nonrunning service, but it doesn''t have any effect if it''s not running.


    You can use the CLI-based chkconfig utility. Open a GNOME Terminal session and
    log in as root (**su -**):


    +   List the services by running the chkconfig --list command.

    List an individual service by specifying the service after the --list option:
    chkconfig -- list apmd.

    Stop a service with the --add option: chkconfig -- add apmd.

    Delete a service with the --del option: chkconfig -- del apmd.


    # Using a Secure Shell client


    You may be most familiar with graphical network communication applications, like
    the Mozilla web browser and Evolution e-mail clients. However, a world of text-based
    tools is available, such as Secure Shell, Telnet, and FTP. Those applications
    provide an interactive method for connecting to other computers across networks
    and the Internet using a command-line interface (CLI); refer to Chapter 4 for
    more information about CLIs.'
  merge: -1
  img_proc: true
- pgno: 265
  md: "Interactive communication is effective for performing tasks on remote machines.\
    \ For example, the primary way to work on Linux machines originally was via the\
    \ CLI. The CLI is often the best way to perform remote tasks.\n\nCLI-based communication\
    \ used to be primarily carried out over the insecure Telnet, FTP, and rsh connections.\
    \ All services use unencrypted connections, and passwords were readily detected.\
    \ The rsh service also used a system of intermachine trust. That trust allowed\
    \ hackers, like the infamous Kevin Mitnik, to \"own\" a network by breaking into\
    \ one machine and then logging in to additional ones without authentication.\n\
    \nOpen Secure Shell (OpenSSH) provides an encrypted channel to perform all those\
    \ tasks. Red Hat Linux bundles OpenSSH by default. We describe how first to use\
    \ the OpenSSH client to communicate with other machines and, second, create an\
    \ OpenSSH server.\n\nYou should (dare we say *must*?) use encrypted channels when\
    \ you're communicating over the Internet and wireless networks. Both the Internet\
    \ and Wi-Fi connections are inherently insecure, and you have to protect your\
    \ communications.\n\n# Connecting to a Secure Shell server\n\nStart by using OpenSSH\
    \ as a client. Suppose that you want to log in to your ISP server, `ssh.mysp.com`,\
    \ with OpenSSH:\n\n+   1.  **Open a GNOME Terminal session.**\n\n+   2.  **Enter\
    \ this command:**\n    ```\n    ssh ssh.mysp.com\n    ```\n    Your mileage may\
    \ vary, of course. You may have to use the `-1` option if, for example, your ISP\
    \ user account name is different from your local computer. If your username on\
    \ your local machine is `lidia`, but it's `lmaura` at your ISP, enter this line:\n\
    \    ```\n    ssh -1 lmaura ssh.mysp.com\n    ```\n    The first time you connect\
    \ to a remote server, you're prompted to accept the remote server's fingerprint.\n\
    \n+   3.  **Enter yes when you're prompted.**\n\n+   4.  **Enter your password\
    \ when you're prompted, and you're logged in.**\n    For example, you can now\
    \ use a text-based e-mail client, like pine, to read your messages. This program\
    \ is useful if you want to read your e-mail securely but can't connect to your\
    \ ISP with an SSL-enabled Mozilla or Evolution e-mail client."
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Tunneling X across a network


    That was a simple and useful way to use OpenSSH, but you can do more. The Red
    Hat OpenSSH client is automatically configured to forward 1X across its secure
    connection. While logged on to your ISP, you can run X Window client software
    and view it on your local machine:


    +   1. Log in to your ISP (or any machine running a Secure Shell server) as just
    described.


    +   2. Run an X Window application, such as xclock.


    The simple xclock window is displayed on your desktop.


    OpenSSH also bundles the file-transfer applications Secure Copy (scp) and Secure
    FTP (sftp). Secure Copy is non-interactive and copies files to and from a remote
    machine. Secure FTP is a secure version of FTP and is also interactive. This list
    describes how to copy files between two machines:


    +   • **Copy from a local machine to a remote one:** To transfer files from your
    local computer to a remote one, use Secure Copy (scp):


    ```

    scp abc myacct@remote.myisp.com

    ```


    This command copies the filename abc from the directory you''re working in to
    the myacct.myisp.com home directory on the remote machine. You can specify either
    or both of the local and remote directories. For example, this command copies
    the file abc from the /tmp directory on the local machine to the /var/tmp directory
    on the remote machine and renames it to xyz:


    ```

    scp myaccount@remote.myisp.com:/tmp/abc /var/tmp/xyz

    ```


    The scp syntax is important. If you leave out the colon (:), your file isn''t
    copied to the remote machine but rather is simply copied to a file named myacct@remote.myisp.com
    in your local directory.


    +   • **Copy from a remote to local machine:** Reverse the order of the parameters
    to copy from a remote machine. The following example copies the file abc from
    your home directory on the remote machine to your current working directory on
    the local machine:


    ```

    scp myacct@remote:abc

    ```


    The sftp program works like the old standby FTP, but uses encryption, of course.
    Follow these steps to perform simple file transfers with sftp:


    +   1. Open a GNOME Terminal session.


    +   2. Enter this command:


    ```

    sftp ssh.myisp.com

    ```'
  merge: -1
  img_proc: true
- pgno: 267
  md: '3. Enter your username and password.


    4. Enter the help command at the sftp prompt.


    You see a list of sftp commands. The ones you use most are cd, lcd, dir, ls, get,
    and put. These commands work in similar fashion to their Linux equivalents.


    Using sftp is self-explanatory. Use get to transfer a file, files, or directory
    from the remote to local machine; put transfers from local to remote.


    ![](img/8c094d1b36276212c03d10d898508a6e_267_0.png)


    TIP


    Another cool feature of OpenSSH is its ability to tunnel any protocol. You can
    potentially display an entire X Window from a remote machine via X, for example.
    Consult the OpenSSH documentation for more information.


    # # Configuring an OpenSSH server


    Configuring an OpenSSH server is straightforward. You only have to modify the
    /etc/ssh/sshd_config file and run the /etc/init.d/sshd script. Let''s look at
    the configuration file, the important parts of which are listed in these bullets:


    +   ✓ **Remove the older and faulty protocol version 1:** Version 1 is broken
    and should not be used (change the parameter Protocol 2,1 to Protocol 2, as shown
    in this example):


    ```

    ```

    Port 22

    Protocol 2

    # HostKeys for protocol version 2

    HostKey /etc/ssh/ssh_host_rsa_key

    HostKey /etc/ssh/ssh_host_dsa_key

    ```

    ```


    +   ✓ **Remove the comment from in front of the login grace-time parameter:**
    This action sets a limit on the length of time from when you start a login and
    the time you complete it:


    ```

    ```

    LoginGraceTime 600

    ```

    ```


    +   ✓ **Disallow root logins:** You should prevent users, including yourself,
    from logging in directly as root. Forcing users to first log in as a regular user
    and then “su-ing” to root provides an audit trail that can be used to see who
    did what as the root user; it also forces everyone to jump through two hoops before
    becoming the all-powerful root user:


    ```

    ```

    PermitRootLogin yes

    StrictModes yes

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 268
  md: "**Uncomment these parameters to allow the various authentication modes:**\n\
    \n```\n# rhosts authentication should not be used\nRhostsAuthentication no\n#\
    \ Don't read the user's ~/.rhosts and ~/.shosts files\nIgnoreRhosts yes\n# For\
    \ this to work you will also need host keys in\n/etc/ssh/ssh_known_hosts\nRhostsRSAAuthentication\
    \ no\n# similar for protocol version 2\nHostbasedAuthentication no\n# Change to\
    \ yes if you don't trust ~/.ssh/known_hosts for\nRhostsRSAAuthentication and HostbasedAuthentication\n\
    IgnoreUserKnownHosts no\n```\n\n**Allow people to use password authentication,\
    \ but don't allow unauthen-ticated access:**\n\n```\n# To disable tunneled clear\
    \ text passwords, change to no\nhere!\nPasswordAuthentication yes\nPermitEmptyPasswords\
    \ no\n```\n\nTo start the OpenSSH daemon, follow these steps:\n\n+   1. **Make\
    \ the changes and restart the Secure Shell daemon:**\n    ```bash\n    /etc/init.d/sshd\
    \ restart\n    ```\n2. **If you're running a firewall, add this rule to your iptables-based\
    \ firewall:**\n    ```bash\n    iptables -A INPUT -p tcp --dport 22 -m state --state\n\
    NEW,ESTABLISHED -j ACCEPT\n    ```\n3. **Save your new firewall:**\n    ```bash\n\
    \    iptables-save > /etc/sysconfig/iptables\n    ```\n4. **Restart the firewall:**\n\
    \    ```bash\n    /etc/init.d/iptables restart\n    ```\n\nNow you can use OpenSSH\
    \ client and server to communicate to and from your Linux computer. Using the\
    \ OpenSSH client, you can interactively log in to other computers, copy data between\
    \ computers, and piggyback an arbitrary communication stream — such as X Window\
    \ — with this puppy. You can reverse that process and communicate with your host\
    \ Red Hat Linux computer. OpenSSH encrypts all your communication and prevents\
    \ the exposure of your passwords and data to prying eyes."
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Exchanging keys makes your life easier


    You use OpenSSH by default to log in to a remote user account by using traditional
    passwords. However, OpenSSH can use a second authentication method that takes
    a little work to get started but saves work in the long run.


    OpenSSH provides an authentication method called public-key cryptography. This
    system uses one public and one private key. You install the public key on the
    remote system and keep the private key on your computer. The public key can be
    shared with anyone — hey, it’s public. The private key must be kept secret at
    all costs. In fact, OpenSSH encrypts the private key by default. You must use
    a pass phrase — essentially a password with spaces — to decrypt the private key
    before using it.


    When you want to log in or communicate with the remote computer, the keys are
    used to negotiate the process. The public-private key system guarantees that your
    user account is authenticated and is also the initiating host; passwords only
    authenticate your login account, not the computer you’re connecting from.


    # Setting up for a public-key cryptographic key exchange


    To set up the key exchange, follow these steps:


    +   1.  Log in to your user account on the local computer.

    For example, log in as the user rod on cancun.


    +   2.  Open a GNOME Terminal session.


    +   3.  Run this command:


    ```

    ssh-keygen -t dsa

    ```


