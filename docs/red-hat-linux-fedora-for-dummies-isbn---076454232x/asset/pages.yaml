    \ and you're finished configuring your NIC.) If you're connecting to a network\
    \ that provides DHCP service, type your computer name in the Hostname (optional)\
    \ field (for example, Cancun), click the Forward button, and go to Step 9.\n\n\
    \   If your network doesn't use DHCP, you need to manually configure your IP address.\
    \ Proceed to Step 4.\n\n+   4. **Click the Statically Set IP Addresses radio button.**\n\
    \n   You should ask your friendly local system administrator (unless you're the\
