    # **“When I boot into Windows,\nI get the recovery process”**


    *Problem:* You have a dual-boot computer with Microsoft Windows as the alternative
    operating system. When you boot into Windows, you get the Windows recovery screen.
    “Help, I’m scared!”


    *Solution:* Relax — you almost certainly haven’t lost your mind or your Windows
    partition. What happened is that the Red Hat Linux installation process mistakenly
    selected the recovery partition from which to boot Windows. Most computers now
    come with a preinstalled Windows recovery partition (rather than a recovery CD-ROM),
    so Red Hat Linux sees at least two Windows partitions when configuring GRUB, and
    it made the wrong choice. For example, you have `hda1` and `hda2`, and GRUB thinks
    that `hda1` is the Windows partition; `hda1` is the recovery partition, however,
    and `hda2` is the Windows C: drive.


    You have to reconfigure GRUB to point to the correct Windows partition to make
    it work correctly. You may have this `/etc/grub/grub.conf` file for example:


    ```

    default=0\ntimeout=10\nsplashimage=(hd0,0)/grub/splash.xpm.gz\ntitle Red Hat Linux
    (2.4.20-20.1)\n\troot (hd0,1)\n\tkernel /vmlinuz-2.4.20-20.1 ro root=LABEL=/1
    hdb=ide-\nscsi\n\tinitrd /initrd-2.4.20-20.1.img\ntitle DOS\n\trootnoverify (hd0,0)\n\tchainloader
    +1

    ```


    Change the `rootnoverify (hd0,0)` parameter to `rootnoverify (hd0,1)` and reboot
    your computer. This technique should fix your problem.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# "My network is working, yet not working"


    *Problem:* You have configured and checked your network connection, and it appears
    to be okay. But you can''t connect to some or all of the machines or network services
    you want. You''re perplexed.


    *Solution:* Check your iptables-based firewall. Red Hat configures two different
    levels of firewalls during the installation. This book describes several different
    iptables firewall configurations too. If your firewall isn''t configured correctly,
    it prevents some or all network communications. Even if your firewall is configured
    correctly, it may be designed, in many cases, to block the type of communications
    you want.


    Turn off your firewall with this command:


    ```

    /etc/init.d/iptables stop

    ```


    If your network connection instantaneously works, your firewall was most likely
    the culprit. In that case, you have to go modify your firewall to make it work
    for your needs. Don''t forget to turn your firewall back on as soon as you fix
    the problem:


    ```

    /etc/init.d/iptables start

    ```


    A description of how to customize an iptables firewall is beyond the scope of
    this book. However, the firewalls we show you how to construct in this book may
    work for you and also be easier to understand and modify. Refer to Chapter 8 for
    more information about iptables-based firewalls.


    # "I want to make an emergency boot floppy disk"


    *Problem:* You skipped making an emergency boot disk when you installed Red Hat
    Linux and want one now.


    *Solution:* All is not lost if you read Chapter 3 and skipped making a boot disk.
    Nothing is lost because it''s easy, in fact, to make one. Log in to your computer
    as root and insert a floppy disk that you don''t mind erasing (losing everything
    on that disk). Run this command:


    ```

    uname -r

    ```'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'This command returns information about the version of Linux you’re running.
    The output looks similar to this:


    ```

    2.4.21-20.1

    ```


    Use that number to run this command:


    ```

    mkbootdisk 2.4.21-20.1

    ```


    You have a Red Hat Linux boot floppy when the process finishes writing to the
    disk. Restart your computer and press the Enter key at the `boot:` prompt. Your
    computer then starts Red Hat Linux.


    # “I can’t boot from my DVD”


    *Problem:* Sometimes, you get a DVD (or CD-ROM) disc that you can’t boot from.
    The disc may otherwise be perfectly good, but for some reason it just doesn’t
    work for booting.


    *Solution:* You can get around this problem by using the boot image supplied with
    the companion DVD in the back of this book to create a bootable floppy disk. (This
    disc is different from the emergency boot floppy disk you have the option of creating
    in Chapter 3.)


    Log in to your Red Hat Linux computer as root and mount the first companion CD:


    ```

    mount /mnt/cdrom

    ```


    Change to the images directory on the CD-ROM:


    ```

    cd /mnt/cdrom/images

    ```


    Insert a disk into the floppy drive and run this command:


    ```

    dd if=bootdisk.img of=/dev/fd0

    ```


    A boot image is written to the disk, from which you can boot your computer.


    You can also create a bootable CD-ROM if you have a CD-R drive. Insert a writable
    CD-ROM (CD-R or CD-R/W) and run this command:


    ```

    cdrecord -isosize boot.iso

    ```'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'Problem: You type a command name, but Linux can’t find the command, even if
    it’s in the current directory.


    Solution: When you type a shell or binary command name, Linux looks for the name
    in specific places and in a specific order. To find out which directories Linux
    looks in, and in which order, type this command:


    ```

    echo $PATH

    ```


    You see a stream similar to this one:


    ```

    /bin:/usr/bin:/usr/local/bin

    ```


    Linux looks at these directories to find the command, program, or shell you want
    to execute. You may see more directories depending on your distribution or how
    your system administrator (if you have one) set up your system.


    Suppose that you create a shell or a program named bark and want to execute it
    (and assuming that you have set the permission bits to make bark executable by
    you). You have a couple of choices (although you have more than two choices, we
    list the safest ones). One choice is to type this line on the command line:


    ```

    ./bark

    ```


    This line tells Linux to look in this directory (./) and execute bark.


    Your second choice is to move bark to one of the directories shown in the PATH
    variable, such as /usr/local/bin, and then enter bark at the prompt again.


    Problem: You don’t want to log in to a command-line mode (such as DOS) and then
    type startx. Instead, you want to log in through the X Window System.'
  merge: -1
  img_proc: true
- pgno: 324
  md: "Solution: If you like to see a graphical interface from the beginning, change\
