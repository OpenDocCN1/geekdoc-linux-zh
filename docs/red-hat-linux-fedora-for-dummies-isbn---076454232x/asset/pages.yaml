    by using its tools and programs. We hope that our tips show you how.


    ![](img/8c094d1b36276212c03d10d898508a6e_26_1.png)


    Don''t let this happen to you! We hope that our experiences with Red Hat Linux
    can help you avoid the mistakes we have made.


    ![](img/8c094d1b36276212c03d10d898508a6e_26_2.png)


    This information helps you to recall information presented elsewhere in the book.


    ![](img/8c094d1b36276212c03d10d898508a6e_26_3.png)


    This information is particularly nerdy and technical. You can skip it, but you
    may find it interesting if you''re of a geekier bent.'
