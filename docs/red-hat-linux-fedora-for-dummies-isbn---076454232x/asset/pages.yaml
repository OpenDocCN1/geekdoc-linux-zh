- pgno: 108
  md: '# ## Chapter 7


    # # Connect Locally, Communicate Globally: Connecting to a LAN


    ### In This Chapter


    +   Networking with an Ethernet or wireless NIC

    Using the Red Hat Network Utility

    Starting and stopping your local network connection


    This chapter shows how to connect your Red Hat Linux computer to an existing Local
    Area Network (LAN), also referred to as a *private network*. It’s different from
    connecting directly to the Internet with a dial-up modem or broadband connection,
    as we describe in Chapters 5 and 6; those chapters show how to connect a single,
    stand-alone Red Hat Linux computer directly to the Internet. In this case, you
    connect your Red Hat Linux computer to a LAN.


    You may be building your Red Hat Linux computer to use at home, work, or school.
    It doesn’t matter what the venue is — you can use the information in this chapter
    to connect your computer to any existing LAN. Note that your computer has access
    to the Internet if that LAN is connected to it.


    ![](img/8c094d1b36276212c03d10d898508a6e_108_0.png)


    Don’t get discouraged if you don’t have access to a LAN. You can make your own!
    Chapter 15 describes how to put one together.


    In this book, the terms LAN and private network are used interchangeably.


    ![](img/8c094d1b36276212c03d10d898508a6e_108_1.png)


    If you configured your Ethernet card to connect to your LAN during the installation
    process we describe in Chapter 3, that’s great! You can skip this chapter or just
    browse through it for fun. Otherwise, you can use this chapter to connect your
    computer to a LAN.


    Although forming a private network isn’t exactly rocket science, a detailed description
    of how to network two or more computers is beyond the scope of this book because
    so many network configurations are possible. Many good books are available that
    explain how to do that, and the best place to start is at the Wiley Web site:
    www.wiley.com.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# ## Introducing Local Area Networks


    The invention of Linux revolutionized computer networking. Creating a LAN before
    Linux existed was complicated and expensive. LANs were the nearly exclusive domain
    of big corporations, universities, and other monstrous organizations.


    But the TCP/IP networking protocols were built into Linux from the beginning.
    In the mid-1990s, if you could afford a couple of PCs, a cheap piece of coaxial
    cable, and a few 10 Mbps (megabits per second) or faster Ethernet adapters, a
    LAN was born. Ethernet adapters, also commonly known as *network interface cards*
    (NICs), cost about $150 at the time. Prices, fortunately, have crashed since then,
    falling to earth like Ziggy Stardust: A 100 Mbps NIC now costs as little as $15,
    and you can buy an 11 Mbps wireless NIC for less than $100.


    To get your Red Hat computer on a network, you have to configure only a handful
    of networking subsystems. Here are the tasks that need to be performed in order
    for your networking to work:


    +   - Load your wireless or Ethernet NIC kernel module. Red Hat Linux generally
    detects your hardware and loads the correct kernel modules.

    - Configure your network interface card (NIC).

    - Configure your domain name service (DNS), which converts Internet names into
    Internet Protocol (IP) addresses.


    Wireless networking suffers from some security vulnerabilities. Consult the "Wireless
    network warning" sidebar, later in this chapter.


    Performing these steps is pretty heavy lifting. The load is eased considerably
    by using the graphical Network Configuration Utility system administration tool
    provided by Red Hat. Have fun!


    # ## Configuring Your NIC with the Red Hat Network Utility


    To use your Red Hat Linux computer with an existing Local Area Network (LAN),
    you need a wireless or Ethernet NIC installed on your computer and a network hub,
    or switch, to which to connect the NIC. After you set up the hardware, you need
    to configure your Red Hat Linux network settings.


    If your LAN also has an Internet connection, you can set up that connection too.
    Although a high-speed Internet connection is best, in terms of the network configuration
    the type of connection doesn''t matter.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/8c094d1b36276212c03d10d898508a6e_110_0.png)


    # IEEE and wireless networks


    The dominant wireless standard is based on the IEEE 802-11b (and the older 802-11a
    and the about-to-be-released 802-11g) standard; 802-11b is also referred to as
    Wi-Fi (which is short for the wireless industry''s trade term wireless fidelity).
    If you hear people talking about a Wi-Fi NIC, they''re just talking about wireless
    NICs.


    IEEE (pronounced "eye-triple-e"), or Institute of Electrical and Electronic Engineers,
    is a worldwide professional society of nerds. (Is it necessary to use words like
    nerds or geeks to convey some technical meaning?) The IEEE, the "triclops" of
    wireless networking, concerns itself with issues such as which frequency wireless
    networking devices should use. Fortunately, this group has devised this wonderful
    standard that now enables everyone who''s interested to communicate without stringing
    wires between machines.


    # Preparing to configure your wireless NIC


    Before you can configure your wireless NIC, you need to figure out two things:


    +   Which type of wireless NIC you have (or need)

    How your wireless NIC should connect to your network


    Two main types of wireless electronics (or chip sets) are now in use: Wavelan,
    built by Lucent Technologies, and Prism2, designed by Intersil. Both types are
    supported by Red Hat. The following list shows the manufacturers of each type.
    You can use the list to help figure out what kind of chip set your device uses:


    +   **Wavelan:** Orinoco, Apple Airport Enterasys RoamAbout 802, Elsa AirLancer
    11, and Melco/Buffalo 802.11b.

    **Prism2:** D-Link DWL-650, LinkSys, Netgear, WPC11, and Compaq WL110. Other,
    less popular models include Addtron AWP-100, Bromax Freeport, GemTek WL-211, Intalk/Nokia,
    SMC 2632W, YDI, Z-COM X1300, and Zoom Telephonics Zoom Air 4100.


    You need to figure out how your wireless NIC (or network adapter) should connect
    to your network. Wireless NICs can connect to a LAN in two ways:


    +   **Adapter-to-adapter:** This type, referred to as an ad hoc connection, is
    useful if you have two or more computers that you want to talk and form their
    own, exclusive private network.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '**Adapter-to-wireless hub:** This type, called *infrastructure*, provides a
    single entrance (an access point) into a LAN. An **access point** allows one or
    more computers to be connected to a network. However, unlike an ad hoc network,
    the individual computers can connect to any access point that allows them to.


    The wireless-configuration instructions we provide work with either the infrastructure
    or ad hoc connection methods. Your wireless NIC can connect to either the access
    point or other computers (Linux and Windows) as long as you correctly configure
    your Network ID (ESSID) and encryption key.


    # ### Choosing between ad hoc and infrastructure


    Using ad-hoc mode provides three advantages:


    +   - **Lower costs:** You don’t have to purchase an access point; an access point
    starts at around $50. Computers using wireless NICs running in ad-hoc mode communicate
    directly with each other, eliminating the need for a common access point.

    - **Simpler configuration for Linux users:** Older access point devices could
    be configured using only Windows-based software — the simple network management
    protocol (SNMP), to be exact. You had to physically connect a Windows computer
    to the access point via a wired Ethernet network and then use the software supplied
    with the device. That was difficult if you didn’t have any Windows-based computers.
    Newer access points tend to use HTML-based configuration systems, so you can use
    Mozilla to configure these newer devices.

    - **No need to configure any access point:** You need to configure only the wireless
    NIC in each computer on your network. You can use the Red Hat Network Configuration
    Utility to configure a wireless NIC, which simplifies the process. Each NIC must
    have the same Network ID and encryption key.


    Ad hoc networks can also provide a bit more security because they connect to other
    networks — and the Internet — through a network router. Access points work as
    network bridges. Routers examine IP addresses and then decide where to direct
    network traffic from one network to another. Bridges automatically pass on all
    traffic. Ad hoc networks can be configured to more tightly — but not completely
    — control network traffic among access-point-based networks. You can configure
    ad hoc networks with a firewall more easily than a network using an access point.
    (Many of the current crop of access points now provide NAT and firewall support,
    however; using NAT effectively creates a firewall.)'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/8c094d1b36276212c03d10d898508a6e_112_0.png)


    # # Wireless network warning


    Wi-Fi, the standard for wireless technology, uses an encryption system named wireless
    equivalent privacy (WEP) to provide security. WEP encrypts communication between
    wireless devices to prevent someone with the right equipment from listening to
    and using your wireless network. But WEP is flawed and can be broken using tools
    available on the Internet (that''s a big surprise). If a hacker breaks in to your
    Wi-Fi network, he can read your communications. But your problems don''t end there.
    Hackers can use your wireless network to connect to both your private network
    and the Internet; you give the bad guys a free lunch and a launch pad to the Internet.


    On the other hand, wireless networking is so useful that many people make accommodations
    for the risk. The logic? If you assume that your wireless network has already
    been hacked, you don''t have to worry when it might be hacked in the future.


    You should use OpenSSH, Secure Sockets Layer (SSL), and virtual private networks
    (VPN) — all bundled with Red Hat Linux — to conduct all your internal and external
    communication. Keep in mind that using SSH, SSL, and VPN protects your information,
    but doesn''t prevent someone from connecting to your network. The next generation
    of Wi-Fi, 802.11g, is supposed to fix the WEP weakness. Until the WEP problems
    are solved, be aware of the risks.


    # ## Configuring your Ethernet or wireless NIC


    To get your Red Hat Linux computer working on a LAN, you must first configure
    its network interface card, or NIC. The NIC is the device that electronically
    connects your computer to your LAN. To work with the other computers on your network,
    your Ethernet or wireless adapter must be given a network address and a few other
    pieces of information.


    ![](img/8c094d1b36276212c03d10d898508a6e_112_1.png)


    We have divided the configuration instructions between Ethernet and wireless (or
    Wi-Fi) NICs. The instructions start by explaining how to start the Red Hat Network
    Configuration Utility. We then devote a subsection apiece to describing the particulars
    of configuring Ethernet and wireless devices. After we cover the device specifics,
    we discuss general configuration issues. The overall configuration process is
    outlined in these steps:


    +   1.  Start the Network Configuration Utility.

    2.  Configure your Ethernet or wireless device.

    3.  Configure your computer''s host name.

    4.  Configure your computer''s domain name service.

    5.  Restart your network.'
  merge: -1
  img_proc: true
