- pgno: 299
  md: '![](img/8c094d1b36276212c03d10d898508a6e_299_0.png)


    The original Icecast worked with MP3 streams. Icecast is still available, but
    is no longer being developed or supported. Because of possible copyright problems,
    Icecast has essentially been abandoned in favor of Icecast2, which works with
    the open source Ogg Vorbis format.


    This list provides more detail on each component in the system:


    +   - **Multimedia client:** The client connects to the multimedia server and
    plays the feed. For example, XMMS connects to Icecast2.

    - **Multimedia server:** The server is responsible for accepting requests from
    a client and then streaming multimedia information to the client. The server also
    converts the original multimedia content into Internet Protocol (IP) packets in
    order to route it across a private network or the Internet.

    - **Multimedia content:** Your multimedia server isn’t very useful without a content
    source. Your source may be a music CD or a DJ — you, for example. Sources are
    either fixed or dynamic. For example, a music CD is a fixed source. If you decide
    to switch careers and become a DJ, you’re a dynamic source. The Ice2 application
    reads from a fixed source and feeds it to Icecast2.


    # Creating a Music Source


    Before you create your server, you have to create something to play. This section
    describes how to create an Ogg Vorbis file to play. We assume that you want to
    create a file from a commercial music CD. This practice is legal, and does not
    violate copyright law because you don’t create a server that is broadcast on the
    Internet. Instead, you’re creating a server that is broadcast to a private network
    (yours). As far as we know, you’re still allowed to listen to your own CDs.


    ![](img/8c094d1b36276212c03d10d898508a6e_299_1.png)


    The Ogg Vorbis audio formatting system is similar in function to MP3. However,
    Ogg Vorbis — or Ogg, for short — is an open source format (also known as a codec)
    and, unlike MP3, doesn’t have any proprietary algorithms or protocols. Ogg also
    provides higher fidelity than other formats. Ogg Vorbis is really two separate
    entities: Ogg is an audio compression format, and Vorbis is an encoding system.


    Follow these steps to create an Ogg-Vorbis-formatted music file:


    +   1. Log in to your computer as any user and insert an audio CD.

    2. Click the GNOME Menu button and choose Sound & Video → More Sound & Video Applications
    → Grip.


    The Grip window opens and the CD’s tracks are displayed in the initial Grip window.'
