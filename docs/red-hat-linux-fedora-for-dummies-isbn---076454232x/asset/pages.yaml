- pgno: 85
  md: '# ### *In this part . . .*


    **A**fter you have created your Red Hat Linux workstation, it’s time to get to
    work. The chapters in this part show three different ways to connect to the Internet:
    the traditional, slow dial-up (analog) modem; a fast broadband DSL or cable modem;
    or an existing Local Area Network (LAN) that’s connected to the Internet.


    Chapter 5 concentrates on telephone-based modems. Modems are much like old, reliable
    pick-up trucks: They may not be the fastest way of getting somewhere, but they
    still get you there. In fact, modems provide the simplest, most economical and
    effective Internet connection available.


    Chapter 6 introduces broadband Internet connections. Telephone, cable, and other
    types of companies now provide broadband service to many communities. For not
    altogether unreasonable prices, you can get high-speed, always-on service.


    Many people have access to existing computer Local Area Networks (called LANs)
    at work, school, and home. Chapter 7 shows how to connect your computer to a LAN,
    and, if your LAN has an Internet connection, you can find out how to configure
    your workstation to use it.


    Your computer becomes vulnerable after you connect to the Internet. This statement
    is especially true if you use a service, such as DSL, that is constantly connected.
    The difference is similar to living on a quiet street versus a busy one. You’re
    more vulnerable on the busy street. That’s why we show you in Chapter 8 how to
    build a firewall.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Chapter 5


    # Dial-Up Modems Still

    Get the Job Done


    # In This Chapter


    +   * Finding an Internet Service Provider (ISP)

    * Configuring your Internet connection

    * Configuring your modem

    * Connecting to your ISP


    Surfing the Internet is lots of fun and sometimes a useful activity. Come on,
    admit it: You know you want to tie up your phone line for hours in order to annoy
    your family or roommates, browse sites with ridiculous addresses such as www.theonion.com,
    and chat chummily with people you would never dream of speaking to in person.
    The catch is that before you join the fray of the new online universe, you have
    to get access to the Internet.


    This chapter describes how to use a modem to connect to an Internet Service Provider
    (or ISP) and create your bridge to the Internet. After you’re hooked up to the
    Internet, you too can go to a party and drop this casual phrase: “I found this
    while surfing the Net this afternoon — on my Red Hat Linux system.” People then
    know that you’re really cool. And, if you’ve never been the life of the party,
    this statement certainly makes you more popular.


    This chapter assumes that you’re connecting to the Internet using a standard dial-up
    modem. We describe how to configure your Red Hat Linux computer to use faster
    connection technologies, referred to as broadband connections, in Chapter 6.


    ![](img/8c094d1b36276212c03d10d898508a6e_86_0.png)


    Many people have access to Internet-connected networks at work and school. (Or,
    maybe your 5-year-old has constructed an Internet-connected home network.) Chapter
    7 describes how to connect your Red Hat Linux computer to an existing private
    network and gain access to the Internet through its connection. You can then surf
    at light speed until the cows come home.


    ![](img/8c094d1b36276212c03d10d898508a6e_86_1.png)'
