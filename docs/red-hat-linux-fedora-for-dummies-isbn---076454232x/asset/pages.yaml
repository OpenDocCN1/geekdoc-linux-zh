    +   > “When I boot into Windows, I get the recovery process”


    +   > “My network is working, yet not working”


    +   > “I want to make an emergency boot disk”


    +   > “I can’t boot from my DVD”


    +   > “Linux can’t find a shell script (or a program)”


    +   > “I don’t know how to make the X Window System start at boot-time”


    +   > “I never seem to have the correct time”


    In any technical situation, people end up having problems and issues they need
    help with. This chapter is designed to help answer the most common problems people
    encounter when they’re using Red Hat Linux.


    # ### “Help! I Need Some Help!”


    Before this chapter gets into solving specific problems, it first describes several
    sources of information. Because we cannot cover more than a few of the most common
    problems, we first point you in the direction where you can find more information
    and help.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# *Books and more books*


    When we were working with computers many years ago, the number of books about
    computers could fill little more than one bookshelf, and they were mostly about
    the electronics of the hardware itself. Networking books concentrated on such
    subjects as the probability of two Ethernet packets colliding and not on how to
    build simple networks. Hardly any books about computers were ever in the popular
    bookstores. Thousands of books about computers are available now; most describe
    the software and its interactions, with the hardware taking a back seat. Books
    such as the ones in the *For Dummies* series aren’t just for bookstores any more.
    You can also find them in mass-market venues, such as your local superstore.


    ![](img/8c094d1b36276212c03d10d898508a6e_315_0.png)


    One great source for information about *For Dummies* books is the television series
    *The Simpsons*. That show loves *For Dummies* authors in particular and provides
    an amazingly accurate portrait of us. D’oh!


    Perhaps you looked at other books before you bought this one and were intimidated
    by their use of technical terms. Or, you thought that the other books were too
    general for what you want to do and you want something more task oriented. You
    may want to look over those books again because your knowledge level should be
    higher after reading this book. TCP/IP networking, compiler design, operating
    system theory, formal language theory, computer graphics, and systems administration
    training are all topics you can study in greater depth when you have a Linux computer
    at your disposal.


    Many books specifically about the Unix operating system are partially or completely
    applicable to Linux, such as books about Perl, a comprehensive interpreter. By
    getting one (or more) books about Perl and sitting down with your Linux system,
    you have both a new tool for doing your work and a new appreciation for a complete
    programming language. If you want to find out how to write Perl, you can just
    view the source code.


    # *Linux HOWTOs and Red Hat manuals*


    Don’t forget about the Linux HOWTOs, which come in the commercial version of Red
    Hat Linux. These excellent guides to Linux are covered under the Linux Documentation
    Project (LDP) *copyleft*, which means that you can print them.


    Red Hat also provides online versions of the manuals you get when you purchase
    their full distribution. Look at `www.redhat.com/docs/manuals/linux/RHL-10-Manual`
    for information about nearly every aspect of Red Hat Linux.'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'Chapter 20: Ten Problem Areas and Solutions 297


    # # School days


    Another way to find out more information about Unix and Linux is to take a course,
    perhaps at a local community college. Many colleges offer courses in Unix, and
    some have started using Linux to teach their Unix courses. You can do your homework
    on your system at home, or, if you have a notebook (laptop computer), you can
    work anywhere. (Jon typed text for the first edition of this book in a hotel in
    Auckland, New Zealand, and updated text for the second edition in the United Airlines
    lounge in Chicago.) What we would have given during college for the chance to
    do computer projects while sitting in the comfort of our own pub — er, dorm rooms.
    Instead, we had to sit in a room with a bunch of punch-card machines — well, never
    mind. We would have been much more comfortable and productive with a Linux system.


    # # In the news


    You can obtain additional information about the Linux operating system from mailing
    lists and newsgroups on the Internet. In fact, one of the first popular uses of
    the Internet was the Usenet information-sharing system. Usenet is similar to the
    World Wide Web in that it uses a set of protocols to perform a special type of
    communication over the general-purpose Internet. Usenet provides the capability
    to let people participate in discussions via e-mail. People post messages to a
    specific interest group that anyone can view and respond to.


    Newsgroups and mailing lists are dedicated to specific topics: technological and
    any topic that two or more people (or one person with multiple personalities)
    are interested in. Dozens of newsgroups and mailing lists are devoted to Linux
    topics. Searching these groups often provides laser-like answers to your questions.
    That’s because someone else is quite likely to have encountered your problem and
    found a solution to it. You can also post your questions to newsgroups when necessary.


    You can search for newsgroups at, for example, www.dejanews.com and www.mailgate.org.
    Google also provides an excellent mechanism to search groups, named Google Groups,
    at www.google.com/advanced\_group\_search.


    Don’t neglect to check out the Red Hat mailing lists directly, at https://listman.redhat.com/mailman/listinfo.
    This Web page provides a summary of all Red Hat groups.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# # User groups


    User groups are springing up all over the country. Some are more active than others,
    but most hold meetings at least once a month. Some groups are Linux only; others
    are connected to a larger computer group — either Unix or a more general computer
    users’ association. User groups offer a great opportunity to ask questions. User
    groups also tend to stimulate new ideas and ways of doing tasks.


    You can find out whether a Linux user group is in your area by checking with GLUE
    (Groups of Linux Users Everywhere), a service run by Specialized Systems Consultants,
    Inc. (SSC), which publishes *Linux Journal*. You can find GLUE, an automated map
    of user groups, at www.SSC.com.


    When you arrive at the site, click the Resources link, which takes you to the
    *Linux Journal* site. Then check out the Resources area there, to find out where
    the user group closest to you meets.


    ![](img/8c094d1b36276212c03d10d898508a6e_317_0.png)


    No user group in your area? Post a message at your local university or community
    college saying that you want to start one; other people in your area may decide
    to join you. Terrified at the thought of trying to start a user group? User group
    leaders often aren’t the most technically knowledgeable members but are simply
    good planners. They organize the meeting space, find (or hound) speakers, send
    out meeting notices, locate sponsors, arrange refreshments (usually beer), and
    perform other organizational tasks. Sometimes, being the leader seems like a thankless
    job, but when a meeting goes really well, it makes all the work worthwhile. So,
    as a newbie to Linux, you may not know a grep from an awk, but you still may make
    a good chairperson.


    # # Fixing Common Problems


    This section describes how to fix several common problems. Each of the following
    sections outlines the problem and then describes the solution.


    # ## “I forgot my password”


    **Problem:** You have to remember a zillion passwords at work and home. Unfortunately,
    you can’t remember your Linux password.


    **Solution:** The solution is simple if you have forgotten a user account password
    but still remember the root password. In that case, simply log in as root and'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'reset the user password. For example, if your user name is **rod**, run the
    command **passwd rod** and enter the new password (for example) *likes coffee*.


    The solution is more difficult when you forget the root password. You have to
    become a hacker and break in to your computer to fix the problem. Fortunately,
    Red Hat provides two possible solutions: Either boot into single-user mode via
    GRUB or boot from the first Red Hat installation disc.


    # ## *"I forgot my root password!"*


    You can''t reset a regular user''s password if you can''t log in as the root (super-user).
    However, you can easily circumvent having to log in as the root user by booting
    your Red Hat Linux computer into Single User mode.


    Turn on or restart your computer and use the cursor keys to select the Linux operation
    system when the GRUB boot screen appears; Linux is selected automatically if you''re
    not using a dual-boot system (you installed only Linux). Next, press the **e**
    key to edit the GRUB configuration. You see three lines, the middle of which starts
    with the word *kernel*. Select the *kernel* line with the cursor keys when the
    3-line menu appears. Press the **e** key again, press the spacebar, and then enter
    the number **1** at the end of the line. Press the **Enter** key and you return
    to the original GRUB window. Finally, press the **b** key to boot your system
    into single-user mode.


    ![](img/8c094d1b36276212c03d10d898508a6e_318_0.png)


    You can tell Linux to boot into nongraphical — rather than single-user — mode
    by substituting **3** for **1** when you''re editing the GRUB boot mechanism.


    # ## *"I need to break into my own computer!"*


    Power on or reset your computer. Change your BIOS to boot from CD-ROM, if necessary.
    Before your computer starts the GRUB boot system, insert the companion DVD in
    the DVD/CD-ROM drive. When the Red Hat installation process starts, type **linux
    rescue** at the **boot : ** prompt.


    Red Hat boots into single-user mode and mounts your Linux partitions. You can
    access and use your computer''s root file system by entering this command:


    ```

    chroot /mnt/sysimage

    ```


    You now have complete control over your computer. For example, you can reset the
    root password:


    ```

    passwd

    ```'
  merge: -1
  img_proc: true
