- pgno: 162
  md: '# ## Chapter 11


    # # Surfin'' the Net and Groovin'' to Tunes


    # In This Chapter


    +   - A brief history of the Web

    - Using Mozilla to surf the Web

    - Plugging in plug-ins

    - Playing your CDs

    - Building your sound system

    - Working with CDs


    In this chapter, we introduce the open source Mozilla web browser. Mozilla provides
    all the capabilities of other popular browsers. We show you how to set up Mozilla
    for your Red Hat Linux computer so that you can surf the Net. You can use your
    computer as a multimedia device. After working with Mozilla, we describe how to
    configure your Linux box to listen to music and create CDs.


    > **REMEMBER**

    Our goal in this chapter is to describe how to use the basic Mozilla features.
    However, we want you to know that Mozilla can do far more than we describe here.
    For more information about Mozilla, check out the features available on the Help
    menu, such as the Reference Library or Help contents.


    # *Making the World Wide Web Possible*


    Once upon a time, a company named Netscape created a browser to surf the Internet.
    The browser was originally named Navigator, and later, Communicator. Millions
    of people downloaded it from the Internet for free. Netscape put in the hands
    of millions of people (including us, your authors) the power to access the exploding
    number of web servers. Netscape made history and changed the world because it
    changed the Internet from a medium that served scientists into a tool that anyone
    can use.'
  merge: -1
  img_proc: true
- pgno: 163
  md: "Even though Netscape Communicator is freely distributed to anyone who wants\
    \ it, it isn't open source software in the same way that Linux is. Quite simply,\
    \ Netscape Communicator is a moneymaking venture, and Netscape considers the way\
    \ the software works to be proprietary.\n\nOn the other hand, Netscape recognizes\
    \ the importance of the open source dynamic, which is why it released an open\
    \ source version of Netscape, named Mozilla. Now, countless numbers of people\
    \ are developing and enhancing Mozilla, the default browser for Red Hat Linux\
    \ computers.\n\nThe DVD that comes with this book includes Mozilla, the open source\
    \ brother to Netscape Communicator. Netscape and Mozilla are quite similar, although\
    \ they have a slightly different look and feel.\n\n# Surfin' the Net with Mozilla\n\
    \nIf you have ever browsed the Internet (and who hasn't, these days?), the first\
    \ thing you want to do is to tailor Mozilla to your preferences. You can complete\
    \ this task without connecting to the Internet. Follow the steps in this section\
    \ to customize Mozilla to your liking and set up Mozilla to be your e-mail client.\n\
    \nWhen you connect to the Internet, the first page you see is your home page.\
    \ You have the option to set your home page to a Web page you want to see rather\
    \ than look at a page that someone else wants you to see. You may also want to\
    \ tweak your history settings for whatever reason (but certainly not a paranoid\
    \ one). These steps explain what you need to do:\n\n+   1.  **Start Mozilla by\
    \ clicking the blue globe icon on the GNOME Panel.**\n    The Welcome to Red Hat\
    \ Linux screen appears in Mozilla. You can use this page to find out more information\
    \ about Red Hat and its products.\n\n    Concentrate on configuring Mozilla and\
    \ skip over all the Red Hat information; lots of good information is there, however,\
    \ so explore its world at your leisure.\n2.  **Choose Edit::Preferences.**\n \
    \   On the left side of the Preferences window is a list of categories, which\
    \ you can think of as a map of where you are in the Preferences window.\n3.  **Click\
    \ the arrow plus sign next to the Navigator category to expand it.**\n    Here,\
    \ you determine which Web page appears when you start Mozilla and which Web page\
    \ loads when you click the Home button on the Navigation toolbar.\n\n![](img/8c094d1b36276212c03d10d898508a6e_163_0.png)"
  merge: -1
  img_proc: true
- pgno: 164
  md: '4. In the Home Page area of the Preferences window, fill in the Location field
    with the URL of the Web page you want to be your home page.


    You can also surf to the site of your choice, click Preferences, and then click
    the Use Current Page button.


    For example, type www.linuxworld.com and you see interesting information about
    Linux whenever you start up your browser or click the Home button, in the upper-left
    corner of the Mozilla window.


    ![](img/8c094d1b36276212c03d10d898508a6e_164_0.png)


    Mozilla remembers where you have been and lets you select (and go to) a previous
    location. How long Mozilla remembers (and then how big the list becomes) depends
    on how many days of history you choose. The History configuration option determines
    the number of days that the locations you visit are saved. If you''re short on
    disk space, choose a lower History number, such as one or two days. Otherwise,
    leave the default setting alone.


    ![](img/8c094d1b36276212c03d10d898508a6e_164_1.png)


    If your Linux computer is connected to a network with a proxy firewall, you have
    to configure Mozilla to work with it. To do so, from the Preferences window choose
    Advanced→Proxies. Click the Manual Proxy configuration radio button and enter
    the name of your firewall. For example, enter proxy.mynetwork.com in the HTTP
    Proxy text box (if that''s the name of your firewall) and enter 80 in the Port
    text box. You don''t have to perform this configuration if you''re using the Red
    Hat default firewall or the packet-filtering firewalls we describe in this book.


    # ## Plugging In Plug-Ins


    Mozilla performs the tasks you expect from a browser, like displaying graphics
    along with text. Without help, Mozilla doesn''t go the extra mile and display
    things like animation and JavaScript. When it comes to special functions, Mozilla
    is a blank slate.


    However, with a little help from friends such as you, Mozilla can go that extra
    mile. That help comes in the form of plug-ins. A plug-in is software Mozilla uses
    when needed to perform extra functions. To make use of plug-ins, all you need
    to do is — sorry — plug it in.


    The plug-in process is straightforward:


    +   1. Obtain the plug-in and place it in the Mozilla plug-in directory.

    2. Optionally, configure the Mozilla preferences to use the plug-in.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'We describe how to download and install several popular — and necessary — plug-ins.
    Let''s start with the popular Macromedia Shockwave Flash plug-in. Mozilla can
    show animation and other cool stuff. Follow these steps:


    +   1. **Start up Mozilla and your Internet connection (if necessary) and then
    check to see which plug-ins Mozilla already has access to by clicking the Help▸About
    Plug-ins menu.**

    Mozilla shows that only the default plug-in, libnullplugin.so, is installed. You
    need to download and install some useful plug-ins.

    Clicking the Netscape.com link at the top of the Installed Plug-ins page sends
    you to the Netscape plug-in Web page. That page describes what plug-ins do and
    which popular ones are available.

    2. **Enter the address www.macromedia.com/downloads in the text box and press
    Enter.**

    The Macromedia download page opens.

    3. **Click the Get Macromedia Flash Player button in the Download Free Players
    section (in the middle of the page).**

    4. **Click the Download Now button and the Opening install_flash_player_6_linux.tar.gz
    window opens.**

    You need to save the file that contains the Flash software, so click OK.

    A second window opens, labeled Enter name of file to save to. Mozilla saves by
    default to the directory you''re working from — generally, your home directory.

    5. **Click the Save button and the software is saved to your computer. (The Download
    Manager window shows the progress of the download.)**

    6. **Now you need to unpack and install the Flash plug-in. Open a Gnome Terminal
    window.**

