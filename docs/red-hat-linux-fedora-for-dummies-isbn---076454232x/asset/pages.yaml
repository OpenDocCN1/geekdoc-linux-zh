- pgno: 306
  md: "```\n<security>\n    <chroot>0</chroot>\n\n    <changeowner>\n        <user>nobody</user>\n\
    \        <group>nobody</group>\n    </changeowner>\n</security>\n```\n\nRemoving\
    \ the comments allows the `<user>` and `<group>` directives to become active and\
    \ force Icecast2 to run as user and group nobody. If you don't remove the comments,\
    \ Icecast2 runs as the user and group of the process that starts it. Because you're\
    \ logged in as root, Icecast2 runs as the root user when you start it in Step\
    \ 10. Running a service as root can compromise your computer's security.\n\n+\
    \   10. **Save your changes by clicking the Save button.**\n    Choose File→Quit\
    \ and the Gedit window closes.\n\n+   11. **Open a terminal emulator window by\
    \ clicking the GNOME Menu and choosing System Tools:: Terminal.**\n\n+   12. **Create\
    \ an Icecast2 log file directory by entering this command:**\n`mkdir /var/log/icecast`\n\
    \n+   13. **Make the user nobody own the new directory:**\n`chown nobody.nobody\
    \ /var/log/icecast`\n\n+   14. **Enter this command to start the Icecast2 server:**\n\
    `icecast -c /usr/local/etc/icecast.xml &`\n\nYou just started your multimedia\
    \ server, but aren't transmitting anything. You have dead air now. Because you\
    \ don't want to run afoul of the FCC, the next section describes how to configure\
    \ and start the Ices2 server so that you can feed content to the Icecast2 server.\n\
    \n# ## Configuring Ices2\n\nConfiguring Ices2 is similar to configuring Icecast2.\
    \ Follow these steps to configure Ices2 and then feed an audio stream to Icecast2:\n\
    \n+   1. **Open a GNOME Terminal window.**"
