- pgno: 88
  md: '# Chapter 5: Dial-Up Modems Still Get the Job Done


    # If you''re buying a modem


    Dial-up modems are an old technology, but still the most common method for making
    personal or small-business Internet connections. This statement may not be true
    much longer because the number of users with broadband connections is rising fast,
    and most large businesses also use broadband services.


    An *internal modem* plugs into a PCI or ISA slot on your computer''s motherboard
    and receives power from the computer. An *external modem* comes in its own enclosure,
    requires its own power supply (those clunky, boxy plugs), and connects to the
    computer via a serial (RS232) connection. Both types of modems use your phone
    jack to connect to the Internet.


    Internal modems are generally less expensive than external ones, but external
    modems have several advantages. You can easily turn them on and off, you can connect
    them to a computer without opening the computer case, and if your telephone line
    is struck by lightning, the charge passing through the modem doesn''t damage your
    computer. On the other hand, internal modems need only a telephone line cable,
    whereas external modems require a telephone line, a serial connection, and power-supply
    cables.


    A third type of serial line modem is a *PCMCIA card* (sometimes called a PC card).
    These cards are used most often with laptop computers. Most modern laptops come
    with internal modems already installed.


    ![](img/8c094d1b36276212c03d10d898508a6e_88_0.png)


    Now is a good time to verify that your own telephone service is billed at a flat
    rate and not metered; you should make sure that the dial-up number you use isn''t
    a long-distance call either. If you have metered service or end up making a long-distance
    toll call, you run up huge phone bills while you''re spending hours chatting about
    lone gunmen and reading about interdimensional space travelers.


    After you choose your Internet Service Provider and arrange payment, the ISP provides
    certain pieces of information, including


    +   - Telephone access numbers

    - A username (usually the one you want)

    - A password (usually the one you supply)

    - An e-mail address typically, your username added to the ISP''s domain name

    - A primary *Domain Name Server* (*DNS*) number, which is a large number separated
    by periods into four groups of digits

    - A secondary Domain Name Server (DNS) number, which is another large number separated
    by periods into four groups of digits

    - An SMTP (mail) server name'
  merge: -1
  img_proc: true
