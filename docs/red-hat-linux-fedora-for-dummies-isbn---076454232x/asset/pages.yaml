- pgno: 234
  md: '# Chapter 16


    # # Creating Basic Linux Network Services


    # In This Chapter


    +   - Preparing a network server

    - Building a Linux web server

    - Building a Linux file server with Samba

    - Building a Linux print server

    - Building a DNS server


    Linux was built from scratch with networking in mind. Therefore, networking is
    fully integrated into Linux and is not merely an afterthought. Linux also comes
    bundled with software that provides file sharing, printer sharing, and other functions.
    Thus, Linux gained initial popularity by inexpensively and reliably providing
    network services. (Linux moved to the desktop only when applications such as word
    processing were written for it.)


    In earlier chapters, we show you how to use a Red Hat Linux computer with an existing
    network. We also show you how to build a private network using Red Hat Linux computers
    as both clients and the Internet gateway, or firewall. In this chapter, we describe
    how to configure a Linux box to provide some popular services to the private network.


    # ## Preparing a Network Server


    All examples shown in this chapter can be run from any Red Hat Linux computer,
    such as the one you construct in Chapter 3. Linux doesn''t care what your intentions
    were when you built your computer. Linux calmly does what it is told and works
    gracefully as either a workstation or a server.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Linux works equally well whether it''s running a word processor or a web server;
    the difference between them is just the software that''s used and how it''s configured.
    For example, you start the Open Office program when using your computer as a word
    processor, or you use the Apache program for Web services. In fact, you can run
    both programs at one time and do word processing while running a web server. (The
    basic web server uses fewer resources than OpenOffice, for example.)


    Regarding performance, maintenance, and security, workstations and servers should
    be run on dedicated machines, if possible. Workstations require a wider range
    of software than do servers. Your workstation is a jack-of-all-trades by nature.
    Servers work better when they''re configured to do just a small — preferably one
    or two — jobs.


    When you get to the point where your business and livelihood depend on providing
    network services, you want to build and dedicate machines for this purpose. However,
    until that time comes, you can use the simple workstation we describe in Chapter
    3, which is what we assume you''re doing for this book.


    You can configure the Red Hat Linux computer from Chapter 3 to provide services
    to a private network, like the one we describe in Chapters 7 and 16. This chapter
    describes how to make the Apache web server visible to the Internet. Services
    such as Samba and printing, however, definitely should be kept private and not
    be shown to the Internet.


    We also assume in this chapter that you''re connecting to the Internet through
    a private network as described in Chapters 7 and 15. (Chapter 15 tells you how
    to use a Red Hat Linux computer as an Internet gateway and firewall.) This chapter
    assumes that you want to use this same computer to provide services to your private
    network. This assumption is reasonable for small-office and home-office (SOHO)
    networks because the demands put on a modern PC by a small network aren''t excessive.
    Using a single computer for multiple purposes greatly simplifies the work you
    must do and is an efficient way to use your resources.


    ![](img/8c094d1b36276212c03d10d898508a6e_235_0.png)


    > TIP  Using a single Linux computer to act as an Internet gateway and provide
    network services is a cost-effective way of using your limited resources. However,
    this type of configuration is more difficult to secure. Each function you place
    on a single machine increases the potential number of vulnerabilities. Think of
    adding functions like adding doors and windows to a house: A house with a single
    door and no windows is more secure than a house with 5 doors and 15 windows. However,
    who wants to live in a dark house? Security, like everything else in life, is
    a matter of compromise. Consult Part II and Chapters 17 and 21 in this book for
    discussions on how you can increase security.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# # Building an Apache Web Server


    The Web is the Internet, and the Internet is the Web. Well, that’s not completely
    true because the Internet provides the foundation for widely used functions, such
    as e-mail. However, the Internet became immensely popular because of the World
    Wide Web (WWW).


    The Web isn’t as mysterious as it may seem at first. It’s essentially all the
    world’s web servers that are connected to the Internet. The Internet serves the
    same function as the world’s telephone system: It interconnects everyone. You
    can think of web servers as the telephones that allow people to contact each other,
    businesses, and other organizations. Just as you can start a business or organization
    and let people contact you via your phone, you can also allow people to contact
    you via your web server. This section describes how to construct a simple web
    server.


    > **TIP** Describing how to set up anything more than a simple web server is beyond
    the scope of this book. Needless to say, you can configure Apache to provide a
    whole world of Web services. If you want to utilize the powers of Apache, consult
    such books as the excellent *Apache Server 2 Bible*, by Mohammed J. Kabir, published
    by Wiley Publishing, Inc.


    # ## Installing and starting the web server


    Linux provides the ideal platform for providing Web services. The Apache web server
    system is bundled with Red Hat Linux. Apache is easy to set up and use.


    Because you’re entering the world of creating and administering Linux services,
    you switch your orientation from performing work in GUIs to the command-line interface
    (CLI). Linux system administrators should become comfortable with using the CLI
    because many functions are best performed with the command line. You enter commands
    in the GNOME Terminal (terminal emulator) window in this chapter rather than use
    graphical utilities.


    Follow these steps to install and configure a basic web server:


    +   1. **Log in as root and mount the companion DVD-ROM.**

    Now you need to install the Apache RPM packages.

    2. **You manually install the packages by first starting a GNOME Terminal window
    by clicking the GNOME Menu and choosing System Tools→Terminal. Enter these commands:**


    ```

    ```

    rpm -ivh /mnt/cdrom/RedHat/RPMS/apr*

    rpm -ivh /mnt/cdrom/RedHat/RPMS/httpd*

    ```

    ```'
  merge: -1
  img_proc: true
