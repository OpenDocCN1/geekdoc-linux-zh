- pgno: 117
  md: '+   2. Select the appropriate wireless device.


    +   3. Click the Forward button.


    The Configure Wireless Connection window opens, as shown in Figure 7-3.


    ![](img/8c094d1b36276212c03d10d898508a6e_117_0.png)


    +   4. Select either Managed or Ad-Hoc from the Mode drop-down list.


    You use Managed mode when you’re using an access point. Use ad-hoc mode if you
    configured a wireless network without an access point.


    +   5. Type ANY in the ESSID (Network ID) text box if you use an access point.
    Type the specific ESSID name for an ad hoc network.


