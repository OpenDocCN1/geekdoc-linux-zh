    to start VMware. This action makes starting VMware a breeze. Follow these steps:


    +   1.  Right-click the Gnome Panel and choose Panel⇢ Add to Panel⇢ Launcher.

    2.  Enter, on the Name submenu, the name you want to call your icon; for example,
    VMware.'
