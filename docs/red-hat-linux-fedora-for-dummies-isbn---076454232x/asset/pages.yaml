    # Configuring VMware networking


    This set of steps describes how to configure VMware networking:


    +   **1. We assume that you want to use virtual networking, so press Enter. The
    script automatically configures both bridged and NAT networking.**


    Bridged networking doesn''t work if the host computer uses a wireless NIC. NAT
    works on wireless NICs, however. This limitation should be fixed eventually.


    +   **2. Answer Yes to allow the script to probe for unused subnetworks.**


    +   **3. You need to accept the DHCP license, so type yes and press Enter.**


    The DHCP license is stored in `/usr/share/doc/vmware/DHCP-COPYRIGHT`. The license
    makes for good reading.


    +   **4. Optionally, type yes and press Enter to use host-only networking.**


    Host-only networking consists of a virtual network interface that communicates
    with only the VMware host computer (the one you''re configuring now). Host-only
    networking is used primarily to share the host''s file system with the virtual
    computer.


    +   **5. Type yes and press Enter when prompted to probe for an unused subnetwork
    (for the host-only networking).**


    We''re assuming that you will, or may want to, share files from your host computer
    (Linux) to your virtual computer (Linux or Windows). You can answer No here if
    you don''t want to share — but then your mom may get mad.


    +   **6. Answer No when prompted to configure another (second) host-only network.**


    +   **7. Answer Yes to allow the system to automatically access the host file
    system.**


    The installation script wants you to accept the Samba license. (Samba is used,
    in this case, to share Linux files with virtual Windows and Linux computers.


    +   **8. Press Enter to accept the license.**


    The Samba license is stored in the `/usr/share/doc/vmware/SAMBA-LICENSE` file
    — more interesting reading).'
