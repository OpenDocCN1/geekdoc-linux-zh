- pgno: 225
  md: 'services. You find out how to share files and printers, dole out IP addresses
    to your LAN devices, configure a Domain Name Server (DNS), and—ta-dal— build a
    Web server.)


    One essential network function is to be connected to the Internet. Chapters 5
    and 6 show you how to connect a single, stand-alone Linux computer to the Internet.
    We expand that process a step further and show you how to turn the Internet connection
    into one that can be used by the entire private network. Any computer connected
    to your LAN subsequently has Internet access. Sharing is good, and your mom should
    be pleased.


    The remainder of this chapter deals with building an Internet gateway. We assume
    that you have a working Internet connection, as we describe in Chapters 5 and
    6. This connection is the conduit from your LAN to the Internet. You only have
    to configure a Linux computer to redirect Internet-bound traffic from your LAN
    to the Internet (routing) and modify the firewall we describe in Chapter 8 to
    work with the gateway.


    # # Understanding IP forwarding and network address translation (NAT)


    An Internet gateway requires a Linux computer that has two network connections.
    You need one Ethernet or wireless NIC to connect to your LAN. The other network
    connection is used to make the Internet connection; this connection may be a traditional
    telephone-based modem, a DSL modem, or a cable modem. You use an Ethernet NIC
    to make the second connection.


    Suppose that you open Mozilla on the sample Red Hat Linux computer Cancun (with
    the IP address 192.168.1.1) and enter the URL www.redhat.com. Network packets
    bound about your LAN and then fly out to the Internet (and back again), and Mozilla
    ends up displaying the Red Hat Web page.


    Lots of things have to happen to make all these things happen. Here’s a simplified
    version of how it all works:


    +   Mozilla asks Linux to look up the address — via the Domain Name Service (DNS)
    — which translates www.redhat.com to the numeric IP address 66.187.232.56.


    Linux compares the IP address to its internal routing table. The operating system
    directs network traffic to the default route if the address doesn’t match its
    local networks. (In other words, if the IP address belongs to a machine on the
    private network, Linux directs its communication to the Ethernet device connected
    to the LAN. However, if the IP address is external to the LAN, Linux forwards
    the packets to the appropriate router.)'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'In this case, 66.187.232.56 doesn''t exist on the LAN, so all traffic for the
    browsing session is directed to the default route.


    +   3. On your private network, the default route of each host is directed toward
    the sample Internet gateway, the Red Hat Linux computer Veracruz. All the network
    packets that Cancun produces that are destined for the Internet, for example,
    are sent to Veracruz.


    +   4. The Internet gateway Veracruz receives the outbound packets from Cancun
    on its internal connection and forwards them to its external connection. Packets
    going through its external connection are directed to the Internet.


    +   5. Veracruz (192.168.1.254) also converts the source address of packets from
    Cancun (192.168.1.1) to the source address of its external connection. For example,
    if Veracruz has a DSL Internet connection with the address 192.168.32.254, the
    source address of Cancun packets is changed to 192.168.32.254. (This supposedly
    external Internet address has been changed to protect the innocent.)


    +   6. The packets go to their intended destination. The www.redhat.com server
    responds to the query and sends back the requested information.


    +   7. Veracruz receives the return packets, converts their destination address
    back to that of Cancun, and forwards them to the private network.


    +   8. Cancun receives the packets, and the browser displays the information.


    # # Forwarding network traffic through your gateway


    This section describes how to configure a Linux computer to work as an Internet
    gateway. The process requires you to configure the Linux kernel to forward packets
    from one network interface to another — between the LAN port and the Internet
    port. Because Red Hat Linux turns off forwarding by default, the steps in this
    section describe how to turn on forwarding (you also need a Linux computer with
    two network connections in order to construct a gateway):


    +   One network connection should be either an Ethernet or wireless NIC that connects
    the gateway to the LAN. We refer to it as the internal network connection.


    +   The other connection is either the telephone-based modem or an Ethernet NIC
    connected to a DSL or cable modem. We refer to it as the external network connection.'
  merge: -1
