    Paul''s colleague Ken Hatfield once said, “One of the side benefits from lots
    of troubleshooting comes from what I call ''the value of blind alleys.'' Most
    often in troubleshooting, you go down blind alleys or, in your tree example, the
    wrong branches of the solution tree. But in doing so, you learn something. In
    the future, when you encounter a different problem, that previous blind alley
    may be the road to the solution.” Well said.


