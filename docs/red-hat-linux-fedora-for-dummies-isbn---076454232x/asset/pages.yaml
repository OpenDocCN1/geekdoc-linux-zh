  img_proc: true
- pgno: 187
  md: '**Spell check:** OpenOffice provides a spell checker, of course. You can tell
    the spell checker to check an entire document by choosing Tools➪Spell Check➪Check.
    You’re prompted to act on each possible spelling error the checker detects.


    Alternatively, you can set the spell checker to operate continuously. Choose Tools➪Spellchecker➪AutoSpellCheck
    to toggle on the real-time spell checker; when it’s activated, a check mark appears
    next to the menu option. The Continuos option tells OpenOffice Writer to check
    each word you enter and underlines possible misspellings with a squiggly red line.
    The red line disappears when you successfully correct the mistake.


    **View:** This menu displays or hides the various menu bars. You can display a
    document’s formatting characters and also increase or decrease the size (zoom
    in or out) of the text displayed on the screen. The zoom function enables you
    to make smaller fonts more readable without changing the document.


    **Insert:** This menu enables you to insert special characters, objects, files,
    and macros into your documents. Special characters include various symbols (accents
    and umlauts, for example) that aren’t part of the everyday character set (unless
    you happen to use words like *café* frequently). Objects include graphics, symbols,
    and figures. (You can create your own figures with Draw.) You can also insert
    macros and hyperlinks into your documents.


    You can insert tables into documents with any number of rows and columns. OpenOffice
    can automatically adjust the row height, or you can do it manually. Choose Insert➪Table
    and play around with this feature.


    **Tools:** From this menu, you can access the spell checker, thesaurus, various
    OpenOffice configuration settings, and other functions. Tools such as the spell
    checker are self explanatory.


    **Window:** This menu enables you to control the look of your desktop. In addition
    to enabling you to modify and move windows, the menu provides other manipulation
    capabilities.


    **Help:** OpenOffice provides pretty good online help services. Many are context
    sensitive. If you’re editing a text document, click the Help menu to get access
    to information related to the Writer module.


    For example, choose Help➪Help Agent and the Help Agent window appears. The Help
    Agent provides assistance in several areas of interest to new users, including


    +   - **Introduction to Writer:** Provides an introduction to the word processor


    +   - **Basic tips text documents:** Tells you all you ever wanted to know (and
    then some) about reading, writing, and printing text documents


