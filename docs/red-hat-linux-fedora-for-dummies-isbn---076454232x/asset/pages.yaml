- pgno: 87
  md: '# # Desperately Seeking an ISP


    To get connected using a dial-up modem, you have to successfully hook up a modem
    to your computer and then find a good Internet Service Provider (ISP) to dial
    up to. Odds are that you have an internal modem that came installed with your
    computer. If you don''t, you may want to consider upgrading. Check out Upgrading
    & Fixing PCs For Dummies, 6th Edition, by Andy Rathbone (Wiley Publishing, Inc.).


    ![](img/8c094d1b36276212c03d10d898508a6e_87_0.png)


    The best way to find a good ISP is by word of mouth. Getting personal recommendations
    is a good way to find out both the good and bad points of an ISP that you can''t
    find from reading advertisements. Before you sign on with an ISP, make sure that
    the company supports Linux.


    If you don''t have any friends and your acquaintances don''t speak to you, try
    finding a local Linux user group (LUG) to ask. You can look up LUGs at the Red
    Hat community Web page at www.redhat.com/apps/community.


    Table 5-1 shows a sample of ISPs that support Linux.


    | Table 5-1 | ISPs That Support Linux |  |  |

    | --- | --- | --- | --- |

    | ISP | Toll-Free Phone Number (U.S. Only) | Web Address |  |

    | Access4Free | 866-MyFree/ 770-349-3430 | www.access4free.com |  |

    | AT&T WorldNet | 800-967-5363 | www.att.net |  |

    | Comp uServe | 800-336-6823 | www.compuserve.com |  |

    | Earthlink | 800-EARTHINK | www.earthlink.net |  |

    | Prism Access | 888-930-1030 | www.pris m.net |  |

