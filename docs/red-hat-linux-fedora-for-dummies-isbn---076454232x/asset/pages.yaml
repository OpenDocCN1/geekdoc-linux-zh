- pgno: 23
  md: 'That line means to enter the command `man chown` and press the Enter (or Return)
    key. The command is then executed. (Throughout this book, we say “press the Enter
    key” whenever we want you to execute a command; the Enter key is synonymous with
    the Return key.)


    Commands not shown in the text, but set off on lines by themselves, look like
    this:


    ```

    pwd

    ```


    Here’s a rundown of the command syntax in Linux:


    +   - Text *not* surrounded by [ ] or ( ) brackets must be typed exactly as shown.

    - Text inside brackets [ ] is optional.

    - Text in *italics* indicates the part of a command that must be replaced with
    appropriate text. You should not type verbatim the italicized part of a command.
    If we say “Enter the command **more** *somefile*,” we mean for you to replace
    *somefile* with the name of the file you’re interested in. For example, you may
    end up entering the command **more** */etc/passwd*, where you substitute */etc/passwd*
    for *somefile*.

    - Text inside braces { } indicates that you must choose one of the values inside
    the braces and separated by the | sign. For example, you should enter either **echo
    “one”** or **echo “two”** or **echo “three”** if you see the command **echo “[one|two|three]”**.

    - An ellipsis (...) means *and so on* or to repeat the preceding command line
    as needed.


    Don’t concern yourself much with these conventions for now. In most chapters in
    this book, you don’t need to know these particulars. When you do need to know
    something about a particular syntax, come back to this introduction for a refresher
    course.


    # Keystrokes and such


    Keystrokes are shown with a plus sign between the keys. For example, Ctrl+Alt+Delete
    means that you should press the Ctrl key, Alt key, and Delete key all at the same
    time. (No, we don’t make you press any more than three keys at the same time.)'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Most applications and utilities we describe in this book use a graphical user
    interface (GUI), such as GNOME, which allows you to control your computer by pointing
    and clicking with your mouse. Occasionally, however, we give nongraphical instructions
    that require you to press keys on your keyboard. In those situations, we often
    simplify the instructions by saying “click OK.” That instruction generally means
    that you press the Tab key, which moves the cursor to the OK button, and then
    press the Enter key. That two-step process is equivalent to clicking an OK button
    in a GUI.


    # ## How This Book Is Organized


    Like all proper For Dummies books, this book is organized into independent parts.
    You can read the parts in any order. Heck, try reading them backward for a real
    challenge. This book is not meant to be read from front cover to back; rather,
    it’s meant to be a reference book that helps you find what you’re looking for
    when you’re looking for it. Between the Contents at a Glance page, the table of
    contents, and the index, you should have no problem finding what you need.


    If you do read the chapters in this book in order, you encounter the useful and
    interesting things first and the more technical items last. For example, after
    installing Red Hat Linux in Part I, you may want to proceed immediately to Part
    II to see how to connect Linux to the Internet or your local network. From there,
    you can use your new workstation to surf the Internet and use e-mail.


    The following sections describe each part.


    # ### Part I: Installing Red Hat Linux


    In Part I, you find out what Linux is and how to prepare your computer to install
    Red Hat Linux. We then walk you through the installation and show you the basics
    of working with Red Hat Linux.


    # ### Part II: Got Net?


    In Part II, you find out about connecting to the Internet and local networks.
    You see how to jump on the Internet with your everyday modem or high-speed'
  merge: -1
  img_proc: true
- pgno: 25
  md: '(broadband) DSL or cable modem. We also show you how to connect to an existing
    network. If that local network has a high-speed Internet connection, you can use
    it as your portal to the wonderful world of surfing. The Internet can be dangerous,
    so we include instructions for creating your own firewall.


    # ## Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    Part III guides you through the glorious particulars of *doing* something with
    Red Hat Linux. You’re introduced to the GNOME desktop window environment. You’re
    taken through its paces by finding out how to move, resize, hide, and close windows
    and how to use the file manager and much more. Two chapters are devoted to using
    the Red Hat Linux multimedia capabilities, such as listening to CDs and MP3s,
    in addition to how to rip and record them. The world’s radio stations are now
    available to you with streaming media technology. We introduce you to the Mozilla
    browser so that you can surf the Net and use the Evolution organizer to read your
    e-mail, do calendaring, and other tasks. We also describe in detail the full-featured
    OpenOffice desktop productivity suite. You can use OpenOffice with your Red Hat
    Linux machine to do all your writing and other work-related functions. You can
    even write a book with it! Finally, you see how to get organized with Red Hat
    Linux.


    # ## Part IV: Revenge of the Nerds


    In Part IV, we guide you through the use of your Red Hat Linux computer’s network
    capabilities. It’s Nerd City, but it’s also fun and useful. We start by showing
    you how to build a simple network. After your network is up and running, we describe
    how to build network services, such as the Apache Web server, Samba, and printer
    servers. The last two chapters are devoted to exploring the art of network computer
    security and troubleshooting network problems. Insert your pocket protector, strap
    the old HP calculator to your hip, retape your glasses, and get ready for Saturday
    night!


    # ## Part V: The Part of Tens


    A *For Dummies* book just isn’t complete without The Part of Tens, where you can
    find ten all-important resources and answers to the ten most bothersome questions
    people have after installing Red Hat Linux. (The folks at Red Hat Software provided
    these questions.) We introduce the ten most important security concerns too.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Part VI: Appendixes


    Ah, the appendixes. Appendix A outlines the Red Hat Linux systems administration
    utilities. Appendix B describes how to find out about the details of your computer''s
    individual pieces of hardware; this information is sometimes helpful when you''re
    installing Red Hat Linux. Appendixes C and D introduce you to using and managing
    the Linux file system. Appendix E shows how to use the Red Hat Package manager
    (RPM). Appendix F completes this book by describing what you can find on the companion
    DVD-ROM.


    # What You''re Not to Read


    Heck, you don''t have to read any of this book if you don''t want to, but why
    did you buy it? (Not that we''re complaining.) Part I has background information.
    If you don''t want it, we''ll read it. Also, the text in sidebars is optional,
    although often helpful. If you''re on the fast track to using Linux, you can skip
    the sidebars and the text next to the \`Technical Stuff'' icon, as described in
    the following section. But we suggest instead that you slow down a bit and enjoy
    the experience.


    # Icons in This Book


    This section describes the icons you see in this book. Icons amplify the discussion
    by injecting interesting or important information.


    ![](img/8c094d1b36276212c03d10d898508a6e_26_0.png)


    Nifty little shortcuts and timesavers are under this icon. Red Hat Linux is a
