  md: "to, you're ready to safely conduct business. Huh? What good does that do if\
    \ you're connecting to the hacker's web server? The certificate just ensures that\
    \ you connect securely to the bad-boy site.\n\nThe problem is solved by using\
    \ a go-between called a *certificate authority (CA)*. When you connect to a secure\
    \ web server, it sends you its certificate. The web server also subscribes to\
    \ a CA. The CA has investigated the subscribing web server and, if satisfied with\
    \ its authenticity, vouches for its identity. If the CA is on your list of known\
    \ CAs, you accept the certificate and use the public key to verify the server's\
    \ identity and set up the encrypted connection.\n\n# ## Protecting your web server\
    \ with SSL\n\nA secure web server requires a certificate. The certificate is used\
    \ to verify the web server to its clients. The instructions in this section describe\
    \ how to create the certificate.\n\nYou can view the list of CAs your browser\
    \ knows about. Follow these steps to view the CA list:\n\n+   1. **Choose Mozilla\
    \ Edit:Preferences.**\n   The Preferences window opens.\n2. **Expand the Privacy\
    \ & Security menu by clicking the plus (+) sign immediately to the left of the\
    \ menu option.**\n3. **Click the Certificates menu.**\n   The Certificates subwindow\
    \ opens.\n4. **Click the Manage Certificates button.**\n   The Certificate Manager\
    \ window opens behind the Preferences window.\n5. **Click the upper margin of\
    \ the Preferences window and move it so that you can see the Certificate Manager\
    \ window.**\n6. **Click the Authorities tab and you see a list of all CAs your\
    \ browser knows about.**\n\nYour browser automatically accepts the certificate\
    \ from any secure web page you visit that subscribes to one of these CAs.\n\n\
    It costs time and money to subscribe to a CA, of course. However, you don't necessarily\
    \ need to spend the money if you intend to use your secure web server for personal\
    \ use or just to experiment. We show you how to construct a certificate and then\
    \ use it without registering with a CA."
