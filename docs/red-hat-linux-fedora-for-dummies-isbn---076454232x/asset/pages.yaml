    # ## Printing with OpenOffice


    Printing from OpenOffice is a simple process after you have configured Red Hat
    Linux to use a printer. OpenOffice uses the default Linux printer, so all you
    have to do is configure it. This section first describes how to configure a Red
    Hat Linux printer and then shows you how to set up OpenOffice to use that printer.


    Configuring a printer attached to your Red Hat Linux computer is a simple process.
    All you have to do is run the `printconf-gui` printer configuration utility and
    enter the information about your printer. These steps describe how to do it:


    +   1. Log in to your Red Hat Linux computer as root.

    2. Attach a printer to your Linux computer''s parallel (printer) port.

    The parallel port is a 25-pin female connector on the back of your computer case.
    New computers usually label the parallel port with some kind of printer icon (although
    sometimes it''s hard to imagine how they came up with the symbol). If yours isn''t
    marked, there''s no harm in finding the appropriate port through trial and error.

    3. Start the printer configuration tool by clicking the GNOME Menu button and
    choosing System Settings→Printing.

    Enter the root password if prompted. The Printer configuration window opens.

    4. To add a printer, click the New button. When the introductory Add a New Print
    Queue window opens, click the Forward button.

    The Add a new print queue dialog box opens.


    ![](img/8c094d1b36276212c03d10d898508a6e_188_0.png)'
  merge: -1
  img_proc: true
