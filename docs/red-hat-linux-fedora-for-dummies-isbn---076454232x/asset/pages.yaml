- pgno: 214
  md: '![](img/8c094d1b36276212c03d10d898508a6e_214_0.png)


    +   3. **Install Red Hat Linux.** The installation process is the same as we describe
    in Chapter 3.


    VMware uses simple Linux files on the host machine to simulate the virtual computer''s
    disk partitions. (You have the option to use a separate partition for the virtual
    computer, but the most common method is to use the host file.) Installing an operating
    system (OS) on a VMware virtual computer places the operating system''s virtual
    disk on a file. Therefore, you don''t have to worry about harming your host computer
    whenever you''re installing a virtual OS. Any problems you encounter during the
    installation or use of the virtual OS are limited to the host computer files.
    The files used for the virtual OS are labeled with the .vmdk suffix.


    +   4. **When you''re prompted for the network configuration, select DHCP.**


    Using DHCP shortens the network configuration process because you don''t have
    to select a static IP address, netmask, and other parameters.


    +   5. **When you finish installing the operating system, click Reset.**


    Your virtual PC reboots and you have a fully functional virtual computer running
    Red Hat Linux. Cool.


    Experiment with your newfound tool. Virtual machines provide you with a new killer
    application that can be used to do almost anything you want it to do. You have
    an exciting, fun, and powerful device.


    ![](img/8c094d1b36276212c03d10d898508a6e_214_1.png)


    VMware creates not only virtual computers, but also virtual networks. Each virtual
    computer you configure to use bridged networking connects to a virtual switch.
    If you create two virtual machines on a single host, therefore, each machine can
    communicate with the other — and the host itself — as though they were connected
    to an Ethernet hub. This capability allows you to create experimental and production
    virtual networks. For example, you can use a single powerful PC to create several
    virtual servers rather than purchase and maintain individual ones. Cool.


    ![](img/8c094d1b36276212c03d10d898508a6e_214_2.png)


    Plex86 is the open source world''s answer to VMware. The Plex86 system provides
    a virtual computing platform similar to VMware in function. Plex86 works, but
    at the time this book was written was still in alpha development — it cannot run
    production systems. We encourage you to experiment with the system, which you
    can find at http://plex86.sourceforge.net.'
