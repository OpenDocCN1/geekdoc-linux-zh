  md: '# # 166 Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    ![](img/8c094d1b36276212c03d10d898508a6e_185_0.png)


    **Figure 13-4:** The OpenOffice graphics program, Draw.


    > Okay, so OpenOffice has lots of great features. How good are they? Can they
    get the job done? Well, we wrote this edition of the book using OpenOffice, and
    we wrote the preceding edition using StarOffice. That’s not a bad testimonial
    to the capabilities of OpenOffice.


    # ## Getting to Know OpenOffice


    If you’re familiar with Microsoft Office, you should be able to find your way
    around OpenOffice. The look and feel are a little different, but the idea is the
    same. OpenOffice is also morally superior to Office because it’s *free and* a
    part of open source. This section briefly describes some of the most common functions
    of OpenOffice.


    The next few sections provide only a basic introduction to the things you can
    do with OpenOffice. No, we’re not lazy; it’s just that it would take too much
    space to describe it all in detail. Please experiment with your own test documents
    and consult the online help system for more information.


    # ## Firing up and using OpenOffice


    Red Hat Linux provides OpenOffice and installs it by default. OpenOffice is easy
    to access. Click the GNOME Menu button and then choose **Office>OpenOffice**'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Writer. You can choose some of, but not all, the other OpenOffice functions
    from this menu too. (However, you can start the spreadsheet program, Calc, only
    from an OpenOffice window. From any window — Writer or Impress, for example —
    choose File→New→Spreadsheet to open Calc.) After thinking about life for a few
    seconds, the OpenOffice window appears.


    The first time you start OpenOffice, it asks whether you want to use the workstation
    or personal model. The former installs the OpenOffice programs in a central location
    accessible to all users; the latter option installs a copy of OpenOffice in your
    home directory. Use the workstation configuration in this section, but you can
    select the personal model.


    When you use OpenOffice for the first time, you’re also asked a few questions
    about importing an address book. We cancel the operation because we prefer to
    use the Ximian Evolution address book.


    You can access all OpenOffice functions by clicking the File button, in the upper-left
    corner of the window, and then the option you want.


    The following list introduces the functions. You’re probably familiar with the
    layout and operation of the menu if you have used Microsoft Office:


    +   - **File:** As you may expect, you can open, close, save, and otherwise manipulate
    OpenOffice documents by using the File menu. Writer files have the .sxw extension.
    Other file formats, such as Microsoft Word and HTML, must be imported and exported.


    +   - **New:** You can create a new document for any OpenOffice function. When
    you choose File→New, you’re given the option to create a new text document, spreadsheet,
    presentation, or other function.


    +   - **Edit:** This menu provides all the functions you need to modify documents.
    Functions such as cut, copy, paste, and delete are all provided. The functions
    that are active at any time depend on whether you’re editing a document, spreadsheet,
    or presentation. For example, the cut, copy, and paste options aren’t active if
    you’re not editing a document (like just when you first start up OpenOffice and
    have not opened any files).


    You can also track changes, just as you can in Microsoft Word. Choose Edit→Changes
    and you can track changes on a character-by-character basis. You can display the
    changes or keep them hidden from view. When you’re satisfied with your edits,
    you can make the changes permanent and save only the finished document to disk.
    It’s pretty cool.


    OpenOffice also provides the Find and Replace function from the Edit menu. The
    Find and Replace feature enables you to find text strings and either replace them
    with another string or delete them. You can search forward or backward through
    a document. You can replace one instance or all instances.'
