    # # Installing an operating system on a virtual computer


    VMware is great at providing a platform on which to run other operating systems
    under Linux. You can install either Windows or Linux on your virtual PC. After
    you install and configure VMware, you can run and use your virtual PC.


    This section describes how to install Linux on your new VMware Workstation. We
    use Linux because we can''t include Windows on the companion DVD or expect you
    to go out and purchase that expensive puppy. (We asked Microsoft whether we could
    bundle its operating system, but we never heard back about it. Not until recently
    did we realize that it uses a different license from Linux. Just kidding!) Because
    we can, and already do, bundle Red Hat Linux, we can easily show you how to install
    it. However, if you have a legal copy of Windows, go ahead and install it.


    # *Creating a VMware icon on the GNOME Panel*


