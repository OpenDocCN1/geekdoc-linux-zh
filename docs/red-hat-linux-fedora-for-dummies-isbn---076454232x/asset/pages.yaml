  md: "**A system administration book:** Again, we don't have enough space to do the\
    \ subject justice. We provide instructions on how to perform certain essential\
    \ administrative tasks, like adding users, packages, and network connections.\
    \ This book selects certain topics to focus on and leaves the rest for other books.\n\
    \n# # Conventions Used in This Book\n\nAt computer conventions, thousands of computer\
    \ people get together and talk about deep technical issues, such as\n\n+   - What\
    \ is the best hardware for running Red Hat Linux?\n- Is Coke better than Pepsi?\n\
    - Could Superman beat Batman?\n- Could Superman, Batman, and Spiderman together\
    \ beat The Punisher?\n    - (No way!)\n\nBut these conventions aren't the types\
    \ we mean. Our conventions are short-hand ways of designating specific information,\
    \ such as what is and isn't a command or the meaning of certain funny-looking\
    \ symbols.\n\n# ## Typing code\n\nWe show you how to use graphical interfaces\
    \ to run most of the programs, utilities, and applications we describe in this\
    \ book. Sometimes, however, running commands from a text-based interface is better\
    \ or necessary. In Chapter 4, for example, we describe how to start a terminal\
    \ emulator window in which to run the command. In anticipation of running text-based\
    \ commands, we describe the conventions we use.\n\nWhen you see filenames, directories,\
    \ commands, and parameters in the text, they're formatted in `monospace type`.\
    \ That helps differentiate those items from the general text.\n\nWhen you see\
    \ words in boldface, they indicate something you should type; for example:\n\n\
    Type **man chown** at the command prompt and press Enter."
