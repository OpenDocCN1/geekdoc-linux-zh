- pgno: 92
  md: '# ## Locating Your Modem with Linux


    Linux uses device files to communicate with peripherals. Device files occupy the
    `/dev` directory and are somewhat equivalent to Windows drivers: You need them
    so that your hardware works.


    Your modem can connect to one of four serial ports available on your PC. *A serial
    port* is the mechanism your computer uses to communicate with a device, such as
    a modem. An external modem is generally connected to port `/dev/ttyS0` or `/dev/ttyS1`,
    although configuring it as `/dev/ttyS2` or `/dev/ttyS3` is possible. If you have
    an internal modem, it can be any one of the *tty* devices.


    During the boot process, Red Hat Linux provides the *kudzu* utility, which automatically
    tries to locate new devices on your system. The *kudzu* utility is good at detecting
    equipment like modems (both internal and external). When *kudzu* detects a new
    device, it prompts you to configure the device, and you should let it do so.


    If the Linux hardware detection system *kudzu* cannot find your modem during the
    boot process, you have to do so manually. One manual method is the process of
    elimination; it''s crude, but effective. The following two numbered lists describe
    how to find your modem. The first method, for an external modem, involves sending
    a string of characters to the modem and watching for the light-emitting diodes
    (LEDs) to light up. The second method is for internal modems, which don''t have
    LEDs, so you have to use the hideous screeching sound of your modem to track it
    down.


    To use *kudzu* to find an external modem, follow these steps:


    +   1. Open a terminal emulator window by the clicking GNOME Menu button and choosing
    System Tools>Terminal.

    2. Run this command from a command prompt in the terminal:


    ```text

    echo "anything" > /dev/ttyS0

    ```


    Honestly, it doesn''t matter what you put between the quotation marks in the preceding
    commands. It just has to be some text — *any* text.


    If your modem is connected to the target serial port, you see the send-receive
    LEDs (sometimes marked as RX/TX) light up in a short burst.

    3. In the unlikely situation that your modem isn''t found, try sending the string
    to `/dev/ttyS1`, `/dev/ttyS2` and, finally, to `/dev/ttyS3` by altering the number
    at the end of the command in Step 1 to match the port you''re targeting.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Life is a bit harder if you have an internal modem because you don''t have
    a visual response. You can, however, listen to the modem''s speaker to find out
    what''s going on. Follow these steps:


    +   1.  **Open a terminal emulator window by clicking the GNOME Menu button and
    choosing System Tools→Terminal.**


    +   2.  **Enter this command at a command prompt:**


    ```

    echo "atdt5555309" > /dev/ttyS0

    ```


    If you hear the modem pick up and dial, you have won the game of hide-and-seek
    and know which device the modem is connected to. You can then skip to Step 4.


    +   3.  **If you don''t hear anything, make sure that you have the speaker turned
    on by entering the following command and then retry Step 1:**


    ```

    echo "atv" > /dev/ttyS0

    ```


    If you hear the modem pick up and dial, skip to Step 4.


    +   4.  **If you still can''t hear anything, try using the other serial ports
    by trying again, substituting ttyS1, ttyS2, and ttyS3 in the command.**


    +   5.  **After your modem is found, send this command to the modem to kill the
    connection:**


    ```

    echo "atz" > /dev/ttyS0

    ```


    # ## Locating Your Modem with Windows


    If you''re running a Windows 9x, Windows Me, Windows NT, or Windows 2000 computer,
    you can see which port your modem is connected to by following these steps:


    +   1.  **Send e-mail to Bill Gates and ask him for your configuration.**


    If he''s tied up in court or is otherwise too busy to respond, see Step 2.


    +   2.  **Choose Start→Settings→Control Panel.**


    The Control Panel window appears.


    +   3.  **Double-click the Modem icon or the Phone and Modem Control icon in Windows
    NT or the Phone and Modem Options icon in Windows 2000 systems.**


    +   4.  **When the Phone and Modems Options window opens, click the Modem tab.
    Select your modem from the list that appears.**


    ![](img/8c094d1b36276212c03d10d898508a6e_93_0.png)'
  merge: -1
