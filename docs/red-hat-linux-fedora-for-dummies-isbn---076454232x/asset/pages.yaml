- pgno: 245
  md: 'You must complete these steps before your Linux computer acts as a print server
    to your entire network:


    +   1. **Connect a printer to the Linux computer.**

    2. **Configure the Linux print server to use the printer.**

    3. **Configure a Linux client to print through the server.**


    The following sections describe how to complete each of these steps so that every
    computer on your private network can print through your Linux print server.


    # Connecting a printer to your Linux computer


    Choose from two types of printers when you''re creating a print server:


    +   ✓ **Networked printers:** Printers that can be connected directly to a LAN
    are networked printers. They have their own Ethernet (and, in the future, wireless)
    NIC. Networked printers are divided between those that can act as their own print
    server (also called a *print spooler*) and the ones that need to be connected
    to a print server.


    +   ✓ **Non-networked printers:** Traditional printers have to be connected to
    a computer through a printer (parallel) or Universal Serial Bus (USB) port.


    Non-networked printers outnumber networked printers because they cost less. Traditional
    printers are less flexible than networked printers because they must be connected
    to a computer; networked printers can be located anywhere that a network connection
    exists.


    This section describes how to use non-networked computers because they''re so
    common. The process is simple: You connect your printer to the Linux print server
    via the USB or parallel port. After you''re connected, the Linux computer can
    be configured to send print jobs to the printer.


    Using a parallel port requires no configuration of the Linux operating system.
    The USB connection, however, requires that Linux load a USB kernel module (essentially
    a driver, in Windows terminology). Loading the kernel module should be automatic.
    However, if you encounter problems, you can load the module manually:'
  merge: -1
  img_proc: true
- pgno: 246
  md: '+   1. Log in as root.

    2. Open a terminal emulator window (refer to Chapter 4).

    3. Enter this command:


    ```

    modprobe printer

    ```


    Linux loads the printer kernel module.


    # Configuring the Linux print server


    After you connect a printer, you have to configure Linux to act as a print server.
    Red Hat provides an excellent print configuration utility. (Red Hat refers to
    its configuration systems as utilities.) Building a Linux print server requires
    you to configure the printer as a local device. However, every print server client
    — the computers on the LAN that send their print jobs to the print server — configure
    their print queues to use the Windows Printer type. The print server sees the
    printer directly through its USB or parallel port, but the print clients see the
    printer as a Samba (Windows) share on the server.


    Red Hat Linux can handle five printer types. The printer configuration druid allows
    you to configure each type. This list describes the printer types:


    +   • **Local Printer**: Use this type if your printer is connected directly to
    your computer. The print server is configured using this type because the printer
    is connected directly to it.

    • **Unix Printer**: Use this type if you’re creating a print server that only
    other Linux and Unix computers use. Windows computers can’t use Unix printers.
    Unix printer queues don’t require Samba in order to work.

    • **Windows Printer**: Use this type if you’re printing to a Windows print server.
    Samba makes the print server look like a Windows print server, and the clients
    on the private network use this setting.

    • **Novell Printer**: Use this type if you’re printing to a Novell print server.

    • **JetDirect Printer**: Use this type if you’re printing to a Hewlett-Packard
    (HP) JetDirect printer. The HP JetDirect interface is built into many HP and other
    printers. You can also purchase JetDirect print server devices that connect to
    non-networked, traditional printers. JetDirect print servers convert traditional
    printers into networked printers.'
  merge: -1
  img_proc: true
- pgno: 247
  md: "These steps describe how to configure an Epson Stylus printer because it's\
