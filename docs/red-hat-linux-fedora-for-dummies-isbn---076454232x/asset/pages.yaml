  md: "executable code. Source code is readable by human beings — well, at least the\
    \ class of humans known as nerds. Compiling source code changes it into a form\
    \ that computers can understand. All applications are compiled from source code.\n\
    \n+   **3. Install.** After the result is compiled, it must be installed. Linux\
    \ uses default directories such as `/usr/bin`, `/usr/sbin`, `/usr/local/bin`,\
