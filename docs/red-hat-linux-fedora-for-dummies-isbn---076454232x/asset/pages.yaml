    \ The short description next to the package group says \"This group includes graphical\
    \ e-mail, Web, and chat clients,\" which indicates that you're on the right path.\n\
    3.  **Click the Details button to find out the details of the package you're installing.**\n\
    \    For example, select the Graphical Internet group and the Graphical Internet\
    \ Package Details window opens. You see that the Mozilla mail client is included.\n\
    4.  **Select the radio button next to the menu option.**\n5.  **Click the Close\
    \ button to return to the Package Management window.**\n6.  **Click the Install\
    \ button and the Preparing Systems Update window opens.**"
