    # ## Resizing Windows 9x and Windows Me FAT partitions with FIPS\n\nFIPS resizes\
    \ your FAT-based Windows partitions. Newer versions of Windows (some versions\
    \ of Windows 95, Windows 98, and Windows Me) use a 32-bit file allocation table\
