    | Comp uGlobalMega HyperNet Network | 867-555-5309 | www.compu globalmegahyper.net
    |  |


    Whichever one you want to use, make sure to ask your potential new ISP whether
    it offers a dial-up PPP service. PPP (which stands for point-to-point protocol)
    is what Linux uses to connect to the Internet. If the person you talk to gives
    you the verbal equivalent of a blank stare, you may have troubles. If you encounter
    some kind of a hitch, be forewarned. The ISP''s tech staff probably can''t walk
    you through the procedures. You''re on your own.'
