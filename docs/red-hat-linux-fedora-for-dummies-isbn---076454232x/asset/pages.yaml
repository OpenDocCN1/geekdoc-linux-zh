  md: '# Audio by proxy: Getting XMMS to work through your firewall


    Firewalls are necessary to fight the evil guys who lurk on the Internet, but they
    can put a kink in your listening pleasure. A *firewall* is used to prevent unauthorized
    access from the outside — in most cases, the Internet — from reaching your computer
    or network.


    any mechanism specifically designed to work with proxies.}


    To configure XMMS to work with proxy firewalls, follow these steps:


    The firewall we show you how to build in Chapter 8 and the default Red Hat firewall
    don''t affect either of the players described in this chapter. However, many LANs
    are connected through *proxy* firewalls, which intercept packets sent to the Internet
    and rewrite them according to certain rules; our firewalls are filter packets
    based on their source and destination addresses and ports.


    +   1.  **Start XMMS, right-click the XMMS window, and choose Options\ Preferences.**

    2.  **Click the Ogg Vorbis plug-in in the Input Plug-ins subwindow and click Configure.**


    The Ogg Vorbis Configuration window opens. You need to enter the address of your
    proxy server. You may need to contact your friendly neighborhood systems administrator
    to get that information.


    +   3.  **Click the Use Proxy button and enter the proxy server address in the
    Host sub-window.**


    If your Red Hat Linux workstation sits on a net-work with a packet-filtering firewall,
    such as the one you may have installed in Chapter 8, you don''t need to modify
    XMMS. The key is that the filtering firewall allows all outgoing TCP and UDP connections
    (or ports). However, if your network uses a proxy-based firewall, you may have
    to modify XMMS. (gmpayler doesn''t have


    +   4.  **Click the Use Authentication radio button and enter your username and
    password in their respective subwindows if your proxy server requires them.**


