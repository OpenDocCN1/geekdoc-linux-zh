- pgno: 60
  md: '# Confidential for Windows users


    If you''re installing Red Hat Linux in a dual boot configuration with Windows
    NT, Windows 2000, or Windows XP, your NT boot record is temporarily overwritten,
    which means that you can''t boot Windows NT. Don''t panic: Your NT partition isn''t
    erased — it has just been rendered unbootable. (An NT *boot record* is what enables
    a Windows NT system to start automatically when you start your computer.)


    You can install Red Hat Linux without overwriting the NT boot partition if you
    click the *Change Boot Loader* button and select the *Do Not Install a Boot Loader*
    radio button. When you click the *Next* button, the *Advanced Boot Loader Configuration*
    window opens. Select the *First Sector of Boot Partition* option and then click
    the *Next* button. Your Windows boot configuration continues to operate as before.


    ![](img/8c094d1b36276212c03d10d898508a6e_60_0.png)


    In the following section, we show you how to configure your network for Red Hat
    Linux use. If you don''t have a network or just don''t want to haggle with it
    right now, you may want to read the following section anyway because it makes
    your life easier if you decide to create a network sometime in the future. If
    you''re still not interested, click *Next* and skip to the section after that,
    “Installation Stage 4: Configuring Your System.”


    # Installation Stage 3: Configuring Your Network


    If you''re ready to configure your network and your computer has an Ethernet or
    Wi-Fi (a wireless network interface using the 802-11b standard) adapter, enter
    the appropriate information, as described in the following steps. If you have
    a network adapter but don''t have a network to connect to, you should still enter
    a host name in Step 3. Entering a host name makes life easier down the line if
    and when you eventually connect to a network.


    ![](img/8c094d1b36276212c03d10d898508a6e_60_1.png)


    Sometimes, the installation process doesn''t detect a network device and skips
    the steps described in this section. If that happens, continue with the installation
    as described in the following section, “Installation Stage 4: Configuring your
    System.” You can configure your network after you finish installing Red Hat Linux.
    See Chapter 7 for network configuration instructions.


    If you pick up from the end of the preceding section, the Network Configuration
    window appears. Follow these steps to configure your system for a network:


    +   1. If you''re *connecting to a network that uses the Dynamic Host Configuration
    Protocol* (DHCP), you don''t have to do *anything more* to configure your network
    connection. Click the *Next* button and skip to *Step 7*.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/8c094d1b36276212c03d10d898508a6e_61_0.png)


    You may need to consult with your LAN’s administrator to find out whether the
    LAN (Local Area Network) uses DHCP. If you constructed your own LAN and don’t
    know whether you’re running DHCP, you’re not. Go to Chapter 15 to find out how
    to install and configure a DHCP server.


    +   2. Click the **Edit** button and then enter your IP address and netmask in
    the Edit Interface subwindow.


    The following list briefly explains IP addresses and netmasks:


    +   * **IP address:** This address is the numeric network address of your Red
    Hat Linux computer and is the address by which your computer is known on your
    local network and — in many cases — the Internet. If you haven’t registered your
    private network’s address space with InterNIC (the organization in charge of distributing
    IP addresses), you can use the public address space that goes from `192.168.1.1`
    to `192.168.254.254`.


    If you’re connecting to an existing LAN, consult its administrator to get an IP
    address that isn’t already being used. You have to keep track of unused IP addresses
    if you’re running your own LAN.


    +   * **Netmask:** Private networks based on the Internet Protocol (IP) are divided
    into subnetworks. The netmask determines how the network is divided. For IP addresses,
    such as the example in the preceding bullet (`192.168.1.1`), the most common netmask
    is `255.255.255.0`.


    +   3. Click the button labeled **Manually** under the **Set the Hostname section
