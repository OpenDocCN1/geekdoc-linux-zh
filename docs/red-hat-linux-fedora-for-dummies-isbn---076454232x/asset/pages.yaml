    ![](img/8c094d1b36276212c03d10d898508a6e_336_0.png)


    Not all utilities listed in this appendix are installed by default. Many are installed
    only if you install their respective services. For example, you can use the Apache
    configuration utility only if you install the Apache web server package. We tell
    you when a utility isn''t installed as part of the Workstation installation type
    (refer to Chapter 3).'
