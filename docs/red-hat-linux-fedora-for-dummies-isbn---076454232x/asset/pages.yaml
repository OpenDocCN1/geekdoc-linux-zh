- pgno: 152
  md: "# ## Chapter 10\n\n# # Gnowing More Applications\n\n+   In This Chapter  \n\
    \\- Nautilus, the GNOME file and integration manager  \n\\- The Ximian Evolution\
    \ e-mail and personal organizer\n\nMany applications help make your Red Hat Linux\
    \ computer useful. In this chapter, you find out how to use several of the most\
    \ useful applications that come packaged with Red Hat Linux. The first one is\
    \ the Nautilus File Manager, an integral part of the GNOME desktop system. The\
    \ second application is the new e-mail and organizer application named Evolution.\
    \ We also introduce several other useful applications.\n\nTIP  \nChapter 11 describes\
    \ how to use the Mozilla web browser. Chapter 13 introduces the OpenOffice desktop\
    \ productivity suite, which gives you Microsoft Word-compatible word processing,\
    \ a spreadsheet program, a PowerPoint-compatible presentation program, and other\
    \ functions. These programs, combined with Evolution, give you all the functions\
    \ you need to make your Red Hat Linux computer a fully functioning workstation.\n\
    \n# ## Navigating with the Nautilus File and Internet Integration Manager\n\n\
    Being the boss doesn't make you a bad person. It's just a job. Right? Well, that\
    \ little GNOME guy is a good worker and doesn't get paid much. Just press a key\
    \ here, click a button there, and you can boss him around like any worthy pointy-headed\
    \ Dilbert manager. GNOME even comes with its own file and integration manager\
    \ that saves work and makes time for those long lunches."
  merge: -1
  img_proc: true
- pgno: 153
  md: '*Nautilus* is the GNOME file and Internet navigator system. Nautilus follows
    in the tradition of all good file managers by graphically displaying the files
    and directories on your computer. You can copy, move, delete, and execute files
    by pointing and clicking; creating directories and viewing file details are a
    snap too. Nautilus even goes a step further: You can use it to configure your
    GNOME desktop. And, that''s not all! Nautilus can also navigate the Internet,
    access multimedia applications, and slice and dice! It''s not a bad deal, considering
    that it works for free.


    # ### Waking up Nautilus


    Red Hat Linux configures Nautilus to start automatically when you log in. Nautilus
    appears toward the end of the login process and works as a file manager (see Figure
    10-1, which shows the contents of your home directory). If you want to start it
    manually — after you have closed it, for example — right-click anywhere on the
    desktop background and choose New Window.


    ![](img/8c094d1b36276212c03d10d898508a6e_153_0.png)


    **Figure 10-1:** The Nautilus File Manager.


    The main menu follows familiar menu formats (File and Edit, for example) and does
    all the things you would expect those menus to do. The toolbar immediately below
    the main menu enables you to quickly move up one directory (Up) and skip back
    to previous moves (Back and Forward). It also lets you rescan a directory, go
    to your home directory, and change the way icons are displayed.


    **TIP** The Reload function is useful if you create a new file — for example,
    via a terminal emulator. The file doesn''t show up in the File Manager until you
    move to another directory and return, or else reload.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# ## Moving files and directories


    Moving a file or directory is as simple as clicking and dragging the item you
    want to move to the directory you want to move it to. Release the button and you
    have moved your file or directory.


    You can move multiple files by clicking and dragging the mouse cursor over the
    files you want. The mouse cursor creates a rectangular outline and highlights
    all files within that box. Next, click anywhere within the highlighted box and
    drag the mouse cursor to the directory you want. Release the mouse button and
    the files move to the specified directory.


    # ## Copying files and directories


    Copying a file or directory is a bit more complicated than moving one. Rather
    than simply click and drag an icon someplace, you have to right-click the file
    or directory icon and choose Copy from the menu that opens. Next, enter the directory
    you want to copy to by double-clicking its icon. When the directory opens, right-click
    anywhere on the background and choose the Paste option. The file or directory
    is copied to the new location.


    You can copy multiple files and directories in the same manner as you copied individual
    ones. Trace a box around the files or directories you want to copy by clicking
    and dragging the mouse cursor. Next, right-click any of the blue highlighted icon
    names (but not the white space around the icon and names themselves) and choose
    the Copy option. Double-click the directory to copy to, right-click the background,
    and choose Paste. Release the mouse button and the files are copied to the specified
    directory.


    # ## Deleting files and directories


    Deleting files and directories is much the same process as copying them. You right-click
    the file or directory icon you want and choose Move to Trash from the menu that
    opens. The file or directory is moved to the Trash directory.


    ![](img/8c094d1b36276212c03d10d898508a6e_154_0.png)


    “Trashed” files and directories aren’t immediately deleted. When you use the Move
    to Trash option to delete a file, for example, the file is moved to the Trash
    folder. Open the Trash directory by double-clicking its icon and then right- clicking
    the file or directory to delete. Choose the Delete from Trash option. The Delete
    from Trash warning window opens and prompts you to confirm the deletion. Click
    the Delete key and the file is erased.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'You can delete multiple files and directories. Again, you trace a box by clicking
    and dragging the mouse cursor. Right-click the blue highlighted icons or icon
    names (but not the white space around the icon and name). The files or directories
    are moved to the Trash directory.


    # ## Creating directories


    Right-click anywhere in a Nautilus window and choose New Folder to create a new
    directory. A new folder is displayed with the name Untitled folder. Enter any
    name for the directory as you please.


    # ## Viewing files and directories


    Files and directories are displayed onscreen as icons by default. The only information
    on an icon shows is the name and whether an item is a file or directory (directory
    icons also show the number of files and directories they contain). You can display
    additional information by clicking View View As List or View View As Catalog.


    This list describes the differences between views:


    +   - **Icons view:** The default display option; shows the icon and indicates
    whether an item is a file or directory. Regular file icons take several forms,
    but text and configuration files look like pieces of paper with a corner folded.
    Files containing specific types of data have small subicons overlaid on the file
    icon. For example, PDF files have a PDF subicon. Links, devices, and other objects
    take other forms. Directories take the form of a partially open manila folder.
    Icons are evenly placed across the entire File Manager screen. Icons tend to make
    distinguishing files and directories easier but take up more space onscreen.

    - **List view:** Displays the size and time stamp of each file and directory in
    addition to their names.

    - **View as:** Enables you to select icons or lists as your default folder view
    for all or specific directories. You can also associate MIME types with specific
    applications.


    ![](img/8c094d1b36276212c03d10d898508a6e_155_0.png)


    You can use Nautilus to create on your desktop some shortcut icons that point
    to files or applications. In Nautilus, just click and drag any file or application
    to any blank part of the desktop and then release the mouse button. An icon is
    placed on the desktop. You can then start the application by double-clicking its
    icon. If the icon points to a data file (a text file, for example) and Nautilus
    knows how to handle its MIME type, Nautilus launches the appropriate application
    to open the file. Otherwise, Nautilus prompts you to tell it which application
    to use to open it.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '![](img/8c094d1b36276212c03d10d898508a6e_156_0.png)


    Nautilus is programmed to recognize numerous Multipurpose Internet Mail Extensions
    (MIME) types, and they define what type of information a file stores — in other
    words, MIME keeps its own Rolodex, of sorts. Each MIME type is associated with
    certain file extensions. For example, when you double-click a .doc file, Nautilus
    recognizes that the .doc file suffix corresponds to a Word document MIME type
    and opens the OpenOffice word processor (as described in Chapter 13), which loads
    the .doc file.


    ![](img/8c094d1b36276212c03d10d898508a6e_156_1.png)


    Nautilus provides the ability to bookmark your favorite locations. The Nautilus
    bookmark function works just like Mozilla''s or any other web browser''s. Go to
    any directory and click Bookmarks➔Add Bookmark. You only have to click Bookmarks
    and select the particular bookmark to go to that location. You can modify existing
    bookmarks by choosing Bookmarks➔Edit Bookmarks.


    # Running programs


    Nautilus is such a hard worker that it happily launches commands for you. Right-click
    the icon you want to run in order to open a submenu and then choose Open. For
    example, if you click the xclock icon in the /usr/bin/X11 directory, xclock appears
    on your desktop. (Double-clicking the icon also works.)


    Managers are generally not very smart. But Nautilus is smarter than the average
    manager, and it knows what to do when it encounters various file types. If you
    open a non-executable file, such as a PDF file, File Manager knows which program
    to use in order to view it.


    # Come the Ximian Evolution Revolution


    The Ximian Evolution system is the new workhorse of the GNOME and Linux world.
    Evolution provides the next significant step in the evolution of the Linux desktop
    by combining excellent e-mail and calendar clients with other functions to create
    a single, integrated package. Evolution provides these capabilities:


    +   - Calendar

    - Contact manager

    - E-mail client

    - Personal Digital Assistant (PDA) manager

    - Task master (to-do list)


    The following two sections describe how to configure the Evolution e-mail and
    PDA functions.'
  merge: -1
  img_proc: true
- pgno: 157
  md: "Red Hat uses Evolution as its default e-mail client. Evolution makes it easy\
    \ for you to configure one or more e-mail accounts. These steps describe how to\
    \ configure Evolution to send messages to and receive messages from your ISP e-mail\
    \ account:\n\n+   1. Log in to your Red Hat Linux computer as a regular user (not\
    \ root) and click the Evolution Email icon on the left side of the GNOME panel.\
    \  \nThe first time you start Evolution, the Setup Assistant (wizard) opens. \
    \ \n2. Click the Forward button. Then enter your name and e-mail address in the\
    \ appropriate text boxes in the Identity window and click the Forward button.\
    \  \nYou can optionally enter your organization and signature file (a file where\
    \ you keep personal or business information to be appended to the end of every\
    \ message you send).  \nFigure 10-2 shows some sample entries in the Identity\
    \ window.  \nThe Receiving Mail window opens.  \n3. Click the Server Type drop-down\
    \ menu and choose the option that matches your ISP's e-mail system. Most ISPs\
    \ use the Internet Message Access Protocol (IMAP) server type.  \nThe Receiving\
    \ Mail window expands so that you can enter more information about your ISP's\
    \ e-mail system.  \n4. Enter the host name of your ISP's e-mail server and your\
    \ ISP username. Figure 10-3 shows a sample screen in this window.  \nYour ISP\
    \ provides you with the name of its incoming and outgoing e-mail servers when\
    \ you first subscribe. You need to enter the incoming server name in the Host\
    \ text box. For example, your ISP incoming server may be mail.myisp.com or imap.myisp.com.\
    \  \nYour ISP username may be different from your username on your Linux computer.\
    \ For example, your ISP username may be based on your first initial and last name—\
    \ garagon — but your home Linux computer username may be just your first name—\
    \ gabe .  \n5. Click the Forward button.  \nThe second Receiving Email window\
    \ opens.  \nYou can change options, such as having Evolution automatically look\
    \ for incoming messages, by selecting the Automatically check for new mail option.\
    \  \n6. Make any necessary changes and click the Forward button. The Sending Mail\
    \ window opens."
