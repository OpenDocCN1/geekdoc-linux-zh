    \ To install an RPM package from a CD-ROM, follow these steps:\n\n+   1.  **Start\
    \ the package manager:** Choose System Tools Add/Remove Packages.\n    Enter the\
    \ root password in the Information window if you're prompted.\n2.  **When the\
    \ Add and Remove Software window opens, select the package group you want to install.**\n\
    \    For example, if you want to install the Mozilla e-mail client, you have to\
