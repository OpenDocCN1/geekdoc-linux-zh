- pgno: 122
  md: '# Chapter 8


    # Only You Can Prevent Network Break-Ins


    # In This Chapter


    +   ▶ Introducing firewalls


    +   ▶ Using the Iptables firewall system


    +   ▶ Designing and viewing your filtering rules


    +   ▶ Automatically starting your firewall


    A fer connecting to the Internet, you run the very real risk that bad guys will
    try to break into or otherwise harm your computer. The bad guys wear black hats,
    just like in the movies (as opposed to red hats, which are a bit odd but still
    good). You may also have heard them called hackers, crackers, the Joker, and whatever.
    Whatever their names and whatever their intentions, the Internet is getting more
    dangerous every day, so ya gotta protect yourself.


    A firewall is a device that enables you to use the Internet while minimizing the
    possibility that the Internet will use you. Firewalls basically allow your network
    communications to go out but minimize the possibility of anyone making unwanted
    connections to your computer or private network.


    This chapter describes, not surprisingly, how to build a firewall to help protect
    your Red Hat Linux computer from the bad guys. First, in case you doubt that you
    truly need a firewall, we explain why firewalls are important. Then we introduce
    you to Iptables, the Linux firewall system, and describe how to set up your firewall-filtering
    rules. After you set up your firewall filters, you need to know how to run the
    firewall automatically. You do that by setting up a script — something else we
    explain in this chapter. And, of course, what good would your firewall be if it
    didn''t work? So, we show you how to do a simple test to make sure that your firewall
    is burning brightly.


    WARNING! The firewall described in this chapter is designed to protect a single
    Red Hat Linux computer that''s connected to the Internet. The firewall isn''t
    designed to protect an entire network. Chapter 15 describes how to modify this
    firewall to protect your private network.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# # Understanding Why You Need a Firewall in the First Place


    You may think that there’s safety in numbers. After all, literally millions of
    people, businesses, and organizations are connected to each other at any given
    time through networks and the Internet. What do you, an individual with a simple
    computer and possibly a small network connected to the Internet have to be concerned
    about? The bad guys are usually interested in big money or big publicity, right?


    Well, that’s mostly true, and chances are that you may never get hacked. If you
    subscribe to that world view, you’re — in technical jargon — relying on security
    by obscurity.


    Many hackers use tools that automatically scan and attack entire networks. The
    happy hacker doesn’t have to work hard to search large numbers of networks to
    find and exploit unprotected computers. Don’t risk needlessly getting *owned*
    — when your computer gets broken into and controlled — by a hacker, especially
    when Linux provides effective tools for protecting yourself.


    Using a firewall is one simple but quite effective method for protecting yourself
    when you connect to the Internet. A firewall allows you to connect to the Internet
    while blocking unnecessary and unwanted connections from coming in.


    ![](img/8c094d1b36276212c03d10d898508a6e_123_0.png)


    Firewalls provide good bang-for-the-buck protection. However, they’re not the
    only security measure you should take. For example, locking your doors certainly
    helps to protect against burglars but is not 100 percent effective — they can
    still break through a window. You best bet comes from using layers of security,
    such as locking your windows, using alarms, and keeping tabs on neighborhood activities.
    The idea is to have each layer reinforce the others. Chapter 17 describes how
    to add security layers to your computer.


    # # Building an Effective Firewall


    ![](img/8c094d1b36276212c03d10d898508a6e_123_1.png)


    Linux comes bundled with a simple but extremely effective firewall system named
    Netfilter/Iptables. The Netfilter part refers to the firewall system that’s built
    into the Linux operating system — the kernel, to be exact — and Iptables is the
    interface that controls it. We refer to the overall system as Iptables because
    that is the part that you work with.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Designing filtering rules: Permissive and restrictive methods


    Firewall-filtering rules are like the bricks (or asbestos, if you prefer) that
    build your firewall. Basically, filtering rules determine what network communication
    can go out of and come into your computer.


    When designing firewall-filtering rules, you can choose between two philosophies:


    +   ❧ Allow all connections by default and then deny specific access.

    ❧ Deny all connections by default and then allow specific access.


    Allowing all connections takes the view that you should start by allowing all
    communication with your computer and then denying connections one by one. (This
    method is used by the Red Hat firewall, which you create during the installation
    process.) The danger with this method is that you unintentionally allow dangerous
    traffic to reach your machine. The alternative method is to start by denying all
    communication and then selectively allowing certain traffic. This more


    restrictive method is, from a security standpoint, the best way to create a firewall
    because you know exactly what access you''re allowing. However, the restrictive
    method can also create problems because you may unintentionally prevent needed
    or wanted network traffic from reaching your computer.


    We explain in this chapter how to use the restrictive method, for several reasons:


    +   ❧ It''s the safest method. The restrictive method is safer because it minimizes
    all external contact with your Internet-connected computer. For example, it minimizes
    the information about your firewall that port scanning and other tricks can provide
    to hackers.

    ❧ It''s easier to configure. Because Iptables provides stateful filtering, you
    have to configure only two rules to create a safe firewall. However, you have
    to configure numerous individual rules when using the permissive model. Extra,
    unnecessary complexity reduces security.


    The Iptables system filters IP packets, which are the backbone of the Internet
    (IP stands for Internet Protocol, in fact). When you''re connected to the Internet,
    all the information (graphics and text) that you send and receive is sent in the
    form of IP packets. All the information that enters and leaves your computer via
    the Internet is packaged in the form of IP packets. You can use Iptables to accept
    or deny IP packets based on their destinations, source addresses, and ports.


    The Iptables system is effective because it uses *stateful filtering*, which means
    that the firewall can keep track of the state of each network connection. It''s
    a technical way of saying that Iptables knows which IP packages are valid and
    which are not. For example, if you''re browsing www.dummies.com, Iptables keeps
    track of all packets that belong to that connection. The Iptables utility can
    deny packets that are trying to reach your computer but don''t belong to your
    connection, thus preventing any hackers from sneaking packets through your firewall.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/8c094d1b36276212c03d10d898508a6e_125_0.png)


    Red Hat Linux installs an Iptables-based firewall by default. The installation
    system configures a medium level of protection during the installation process.
    You may recall from Chapter 3 that we advise you to use the default firewall configuration.
    However, the default firewall isn’t as secure as we would prefer for connecting
    to the Internet. Therefore, we describe in this chapter how to construct a more
    comprehensive and secure firewall.


    ![](img/8c094d1b36276212c03d10d898508a6e_125_1.png)


    The concept of ports is an essential part of the Internet Protocol. Ports are
    used to organize the communication between clients and servers. For example, when
    you click a Web page, your browser communicates with the web server by using a
    port. That’s a gross simplification, of course, but it describes the basic idea.
    Suffice it to say that ports are used to control the internal workings of the
    Internet for such tasks as Web browsing.


    # # Setting Up a Firewall


    So you know that you need a firewall and want to create one. What’s next? The
    following sections explain how to set up an Iptables-based firewall by using the
    restrictive model. This section describes how to manually create the firewall-filtering
    rules. When you’re done setting up your rules, see the section “Saving your filtering
    rules to a script,” later in this chapter, so that you don’t have to enter these
    rules every time you turn on your computer.


    In this section, you design an Iptables-based firewall that turns off all incoming
    connections on your modem and still enables you to establish an outgoing connection
    to the Internet. You then back off the total restriction of incoming communication
    to allow incoming Secure Shell connection. (Secure Shell provides encrypted communications.)


    ![](img/8c094d1b36276212c03d10d898508a6e_125_2.png)


    Don’t execute these instructions from a remote connection! You must run these
    commands from your computer’s console. That is, you must be sitting at your computer
    and not be working on it over a network connection. The reason is that these firewall
    rules shut off external network connections before restoring them.


    These instructions describe how to build your firewall, brick by brick:


    +   1. Log in to your computer as root and then open a GNOME Terminal window,
    by right-clicking any empty portion of the desktop and choosing New Terminal from
    the menu.


    +   2. Make sure that you’re not already running a firewall, by entering these
    rules at the command prompt in the terminal window:


    ```

    iptables --flush

    iptables --flush -t nat

    ```'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'The iptables entries remove any existing filtering or Network Address Translation
    (NAT) rules. *NAT rules* masquerade your network address as another address, making
    your computer appear to be used by someone else. NAT is frequently used to make
    your computer appear to be coming from your ISP so that you don''t have to register
    your computer for an official Internet Protocol (IP) address.


    +   3. **Filter out all network communication to, from, and through your computer
    by entering these rules:**


    ```

    iptables --policy INPUT  DROP

    iptables --policy OUTPUT DROP

    iptables --policy FORWARD DROP

    ```


    These commands set the default policy of your firewall to not allow any network
    traffic into (the INPUT rule) or out of (the OUTPUT rule) any network interface;
    nor is any traffic allowed to pass between multiple network interfaces (the FORWARD
    rule) if you have them. At this point, you have an extremely safe network. However,
    your computer is useless in terms of using it for any network-related tasks. The
    next step opens the firewall a little bit so that you can access the Internet
    (or any network you''re attached to) in a safe way.


    +   4. **Enter these rules to allow network traffic to pass through the loopback
    device:**


    ```

    iptables -A OUTPUT -j ACCEPT -o lo

    iptables -A INPUT  -j ACCEPT -i lo

    ```


    Linux computers use an internal network, called a *loopback interface* (lo). The
    loopback isn''t a physical device, but rather is a virtual one. Linux uses lo
    for internal communications. (A great deal goes on behind the scenes on a Linux
    computer.)


    +   5. **Turn on all outgoing communication from your computer:**


    ```

    iptables -A OUTPUT -m state --state NEW,RELATED,ESTABLISHED -j ACCEPT

    iptables -A INPUT  -m state --state RELATED,ESTABLISHED -j ACCEPT

    ```


    These rules don''t specify any particular network interface. However, because
    the filter is stateful, these rules effectively work on your Ethernet, wireless,
    or a dial-up Point-to-Point (PPP) interface.


    The first filter rule permits all outgoing communication. The --state NEW, RELATED,
    ESTABLISHED option tells the firewall to allow packets of both new and already
    established connections to pass. (Packets are the basic part of all network communication.)
    Packets that are related to existing connections but use a different port, such
    as FTP data transfers, are also permitted.'
  merge: -1
  img_proc: true
- pgno: 127
  md: "The second filter rule controls the packets coming back from outgoing connections.\
    \ When you connect to a Web site, for example, your browser sends out packets\
    \ and the web server responds to them. You may click a button on the Web site,\
    \ and a new display pops up. Clicking a button sends a packet out, and the web\
    \ server sends packets back. You have previously blocked packets from the Internet.\
    \ This rule creates an exception that allows packets which belong to an existing\
    \ connection — such as the connection that represents you clicking a button —\
    \ to return to your computer through the firewall. Note that we don’t allow new\
    \ incoming connections (--state NEW) to be established because that would defeat\
    \ the purpose of this firewall.\n\n6. **(Optional) Use the following rule to allow\
    \ SSH connections to your Linux computer:**\n\n```\n```bash\niptables -A INPUT\
    \ -p tcp -m state --state NEW,ESTABLISHED\n        -j ACCEPT -dport 22\n```\n\
    ```\n\nThis rule permits SSH connections on Port 22 to enter into your computer.\
    \ You can install an OpenSSH server by logging in as root, mounting your companion\
    \ DVD, and running this command:\n\n```\n```bash\nrpm -ivh /mnt/cdrom/RedHat/RPMS/openssh-server*\n\
    ```\n```\n\nStart the OpenSSH server by running this command:\n\n```\n```bash\n\
    /etc/init.d/sshd start\n```\n```\n\nYou can modify this rule to allow other types\
    \ of incoming connections to your computer. For example, add a new rule using\
    \ -dport 80, and the firewall allows incoming HTTP packets. All you need to do\
    \ is install the Apache web server (included on this book’s companion DVD-ROM\
    \ and described in Chapter 16), and your workstation morphs into a web server.\n\
    \nYou have just created a simple, effective firewall that protects your computer\
    \ from the werewolves of Netdom. (“They’ll rip your heart out, Jim!”) Your firewall\
    \ remains active until you turn the rules off or reboot your computer. The following\
    \ section shows how to display your new firewall rules.\n\n# ## Displaying Your\
    \ Firewall Rules\n\nAfter you configure your firewall, you naturally want to verify\
    \ that the filtering rules are set up correctly. To display the firewall rules,\
    \ follow these steps:\n\n+   1. Open a GNOME Terminal emulator window, by right-clicking\
    \ any empty portion of the desktop and selecting the **New Terminal** menu."
  merge: -1
  img_proc: true
- pgno: 128
  md: '+   2.  If you''re not already the root user, enter the su - command in the
    GNOME Terminal window.


    +   3.  Enter the root password and type this command to display the firewall
    rules:


    ```

    iptables -L

    ```


    After you complete these steps, you see the firewall-filtering rules displayed
    in the terminal window as follows (use the verbose -v option in the preceding
    command to display extra information, including the network interfaces — for the
    sake of brevity, we don''t use the option in this example):


    ```

    Chain INPUT (policy DROP)

    target     prot opt source       destination

    ACCEPT     all  --  anywhere       anywhere

    ACCEPT     all  --  anywhere       anywhere       state RELATED,ESTABLISHED

    ACCEPT     tcp  --  anywhere       anywhere       tcp dpt:ssh

    stateNEW,ESTABLISHED


    Chain FORWARD (policy DROP)

    target     prot opt source       destination


    Chain OUTPUT (policy DROP)

    target     prot opt source       destination

    ACCEPT     all  --  anywhere       anywhere

    ACCEPT     all  --  anywhere       anywhere       state NEW,RELATED,ESTABLISHED

    ```


    The first chain, INPUT, is for incoming packets. You can see that the default
    policy is to deny all packets. The first rules in the INPUT chain direct iptables
    to allow all internal packets on the logical loopback (lo); many programs use
    the internal (lo) network to communicate with each other. The second rule allows
    the return packets, RELATED and ESTABLISHED, from outgoing connections to come
    back in. The last rule, which is optional, allows the incoming Secure Shell connections
    to your computer.


    The next chain, FORWARD, denies all packets from being forwarded through your
    Linux computer. Forwarding is necessary only if you use your computer for routing
    or other advanced networking functions.


    The last chain, OUTPUT, defines which IP packets are allowed out of your computer.
    Again, the first rule allows unlimited traffic through the loopback (lo) interface.
    The second and last rule allows any and all packets to leave your firewall.


    The following section describes how to save the rules you just created and displayed
    so that they can be started automatically.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# # Firing Up Your Firewall (And Dousing the Flames)


    The preceding section describes how to display your firewall-filtering rules.
    However, you certainly don’t want to manually enter these rules every time you
    reboot your computer. This section shows you how to automate your firewall. We
    show you how to make use of the Red Hat utilities that save the rules you just
    created and start up the firewall whenever you boot your computer.


    These instructions assume that you have configured the firewall as described in
    the preceding section and that the configuration is still in effect.


    # ## Saving your filtering rules to a script


    You need to save your rule set after you have created your firewall. Red Hat provides
    a utility for doing just that. The `iptables-save` utility reads your current
    firewall rules and converts them into script-compatible form. Red Hat also provides
    a script to start up your firewall whenever you start your computer. The `/etc/init.d/iptables`
    script is run whenever you start your computer and, thus, your firewall is started
    too. Follow these steps:


    +   1. Log in as root, if necessary, and open a GNOME Terminal window (refer to
    Chapter 4), if necessary.


    +   2. Run this command and if your firewall rules are saved to a script:


    ```

    `iptables-save > /etc/sysconfig/iptables`

    ```


    # ## Turning your firewall off and on


    Red Hat uses the `/etc/sysconfig/iptables` script to start *Netfilter/iptables*
    firewalls. The `/etc/init.d/iptables` script uses the filtering rules stored in
    the `/etc/sysconfig/iptables` file to implement the filtering rules.


    You can start the *Netfilter/iptables* firewall by running this `iptables` script:


    ```

    `/etc/init.d/iptables start`

    ```'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'You must be logged in as root, of course. Note that you can turn off your firewall
    by replacing start with stop:


    ```

    ```

    /etc/init.d/iptables stop

    ```

    ```


    You can also use the graphical Red Hat Service Configuration utility. These instructions
    show you how to use the utility to start or stop your firewall:


    +   1. **Click the GNOME Menu button and choose System Settings**:: Server Settings**::
    Services.**


    If you''re not logged in as root, the Input window pops up and you''re asked to
    enter the root password.


    +   2. **Enter the root password you set during the Red Hat installation process.**


    The Service Configuration window appears. This window controls all the Linux daemons
    (processes that provide services).


    +   3. **Scroll down the Service Configuration window until you find the Iptables
    service.**


    The check mark should be set in the check box.


    +   4. **Click the Restart button in the upper-left corner of the window.**


    You could click the Start button, but we advise you to use the Restart function.
    The Start and Restart buttons give you the same result, but restarting works if
    the service is already running. Using the Start function doesn''t work if the
    service is already running.


    Click the Stop button to turn off your firewall.


    After the service restarts, you see a confirmation message.


    +   5. **Click OK.**


    Your firewall is restarted, and you can exit from the Service Configuration window.


    You can also prevent the Iptables script from being automatically started when
    you boot the system. Click in the box immediately to the left of the service name
    to remove the check mark. Click the Save button, and the pointer ( /etc/rc.d/rc5.d/S08iptables
    ) to the startup script ( /etc/init.d/iptables ) is removed. You can restore the
    pointer by clicking in the box so that the check mark reappears.'
  merge: -1
  img_proc: true
