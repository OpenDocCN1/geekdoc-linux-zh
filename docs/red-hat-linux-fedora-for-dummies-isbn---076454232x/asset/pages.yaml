  md: '# # Wine utilities


    Wine provides several useful utilities that help you to configure and test it.
    This sidebar describes some of them.


    +   * **wineboot:** Simulates the rebooting of a Windows computer. Rebooting is
    necessary when you’re installing numerous Windows applications (for example, Microsoft
    Word), and this utility provides that function.


    +   * **winpdb:** Debugs Wine applications. This utility shows what’s going on
    under the surface, so to speak. You need to use this utility only if you’re developing
    a Wine application.


    +   * **winecfg:** Helps set many Wine configuration options.


    +   * **clock:** Duplicates the simple Windows clock.


    +   * **regedit:** Duplicates the Registry editor.


    +   * **progman:** Functions as a program manager.


    You can try running one of the Wine utilities. For example, test the winfile utility,
    which acts as a file manager.


    Dull, old guys like us still like dull, old games like PacMan (wow! — even our
    misspent youth was dull), so we show you how to download a PacMan-like arcade
    game. These steps describe where to download and how to install the software (figuring
    out the heuristics of PacMan is up to you):


    +   1. **Log in as a regular user and open your Mozilla Web browser by clicking
    the blue globe (with a mouse wrapped around it) on the GNOME Panel.**


    +   2. **Enter the address www.tucows.com in the text box at the top of the browser
    and press Enter.**


    +   3. **Under the Computer Games heading, near the center of the Web page, click
    the Windows link.**


    Your browser displays a page with many classes of games.


    +   4. **Under the Arcade heading, click the PacMan link.**


    +   5. **Click the WinPac2 link in the next window.**


    The WinPac 2 1.03b page opens.


    +   6. **Click the Win98 option and the Downloading WinPac2_ 103b.exe dialog box
    opens.**


    ![](img/8c094d1b36276212c03d10d898508a6e_195_0.png)


    The Choose a Region window opens.


    The Win95 program runs, but frequently has problems.


    +   7. **Click the appropriate geographical pull-down menu, select your state
    or country, and click the Go button.**


    The Choose a Mirror window opens.'
