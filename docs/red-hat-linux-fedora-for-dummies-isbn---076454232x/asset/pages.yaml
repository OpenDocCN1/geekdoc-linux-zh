  img_proc: true
- pgno: 168
  md: "You can configure and test your sound card at the same time by following these\
    \ steps:\n\n+   1. **Log in to your Linux computer, click the GNOME Menu button,\
    \ and choose System Settings Soundcard Detection.**\n   Enter the root password,\
    \ if prompted.\n   The Audio Devices window opens, as shown in Figure 11-2.\n\n\
    +   2. **Click the Play test sound button.**\n   If you hear some mellow music,\
    \ your computer is ready to rock.\n\n+   3. **Click OK and you're ready to go.**\n\
    \n![](img/8c094d1b36276212c03d10d898508a6e_168_0.png)\n\nIf you're plugged in\
    \ correctly and you repeated the steps, but *still* didn't hear any sound, one\
    \ of these reasons may explain why:\n\n+   * Your computer has an old, unrecognizable\
    \ sound card.\n* You don't have a sound card.\n* Someone else's stereo is way\
    \ too loud.\n\nYou definitely have to purchase a sound card if you don't have\
    \ one. Using old sound cards is generally difficult, so we also recommend purchasing\
    \ a replacement. We can't help you much with the third possibility.\n\n![](img/8c094d1b36276212c03d10d898508a6e_168_1.png)\n\
    \nThe Red Hat Esound daemon (referred to as *ESD*) is designed to allow multiple\
    \ applications to use your computer's sound system at the same time. Sometimes,\
    \ however, an application may not be able to take advantage of this elegant system.\
    \ For example, when you start XMMS, you may have to turn off the ESD daemon. You\
    \ can turn off ESD by starting a GNOME Terminal window and entering this command:\n\
    \n```\nHUP esd\n```"
  merge: -1
  img_proc: true
- pgno: 169
  md: "# ## *Playing CDs*\n\nEveryone wants a little music in their life. But you\
    \ went ahead and bought a computer rather than a stereo system. D’oh! No problem:\
    \ It happens that you indeed spent your money wisely because your Red Hat Linux\
    \ computer functions well as a stereo system. This section describes how to set\
    \ up your computer to play music CDs.\n\nRed Hat bundles two open source CD players\
    \ for Linux users: CD Player and XMMS. We describe CD Player in this chapter because\
    \ it automatically starts when you insert a CD in your computer. (We don’t ignore\
    \ XMMS, however, because we show you in Chapter 12 how to use it to play Internet\
    \ audio streams.)\n\nAnyway, these steps show how to start playing music:\n\n\
    +   1. **Log in as any user and pop a CD into the CD drive.**\n\n    The GNOME\
    \ CD Player application appears.\n\n2. **Listen as your CD starts playing.**\n\
    \nThose are the easiest steps in this book. However, if you exit from CD Player,\
    \ you have to restart it manually (unless you insert another CD, in which case\
    \ CD Player starts automatically again). You can start CD Player by clicking the\
    \ GNOME Menu button and choosing Sound & Video▸CD Player. Nothing to it!\n\nThe\
    \ CD Player controls should be familiar territory for anyone born in the 20th\
    \ century. Here’s a quick refresher for those cavepeople out there:\n\n+   - To\
    \ change the volume, click the vertical slide bar on the right side of the CD\
    \ Player window. Hold the mouse button while you adjust the volume.\n\n- Click\
    \ the crossed tools (a screwdriver and wrench) button, toward the middle-left\
    \ area of the window, to open the Preferences window. You can then select how\
    \ CD Player reacts when you start and stop it. You can also control the default\
    \ CD device (the default is `/dev/cdrom`, but you may want to change it to `/dev/cdrom1`,\
    \ or other devices, depending on your computer hardware). You can also select\
    \ the theme of the CD Player skin. A simple help system is available too.\n\n\
    - The remaining controls are self explanatory: start, stop, forward, yada-yada.\n\
    \nAs you can see, playing CDs is pretty simple. Note that in Chapter 12 we show\
    \ you how to use simple XMMS and the general-purpose MPlayer players to play Internet\
    \ music streams and files."
  merge: -1
  img_proc: true
- pgno: 170
  md: "# # Ripping CDs\n\nAre you paranoid? If not, do you want to be? Well, cdparanoia\
    \ can help fulfill all your fears. Just kidding. Really, cdparanoia is used for\
    \ ripping the audio information — music files — from CDs to your hard drive or\
    \ to other CDs. *Ripping* refers to the process of copying audio from a CD to\
    \ your computer.\n\nThe following steps show how to use the GNOME RIP (Grip) interface\
    \ to simplify using cdparanoia to copy music from a CD to your hard drive:\n\n\
    +   1. **Insert your favorite CD in the drive, click the GNOME Menu button, and\
    \ choose *Sound & Video*→ More Sound & Video Applications.**\n   The Grip window\
    \ opens, as shown in Figure 11-3.\n2. **Click the *Rip* column (on the right side\
    \ of screen) of each track you want to use.**\n   A check mark appears next to\
    \ each track you select.\n3. **Select the *Rip* tab at the top of the window (next\
    \ to the *Tracks* tab).**\n4. **Click the *Rip Only* button.**\n\n![](img/8c094d1b36276212c03d10d898508a6e_170_0.png)\n\
    \nGrip opens the cdparanoia program and feeds it the options you just chose. The\
    \ music is stored in Ogg, the up-and-coming open source protocol. Grip creates\
    \ by default the *ogg* directory in your home directory (assuming that you haven't\
    \ changed the defaults). Grip creates a subdirectory (in *ogg*) named after each"
  merge: -1
  img_proc: true
- pgno: 171
  md: 'CD you record. Individual tracks are stored in files named after each song;
    those files live in the directory named after the CD.


    After you create the music file, you can listen to it with XMMS or GNOME-CD.


    # ## Entering the Ring of Fire: Burning CDs


    Back in the 1980s, when vinyl melted away under the invasion of CDs, building
    the factories to create the CDs cost megabucks; back then, it took a huge effort
    to make a CD. Now, for roughly the $100 it costs to purchase a CD burner (to *burn*
    means to record to CD), you can build your own, personal factory. Amazing!


    ![](img/8c094d1b36276212c03d10d898508a6e_171_0.png)


    If you don''t have a CD burner (or writer), this section doesn''t do you a bit
    of good. Sorry.


    A one-time recordable CD is referred to as a *CD-R*; a rewritable CD is a *CD-RW*.
    CD burners look like regular read-only drives and are connected with either an
    IDE or SCSI interface.


    # ### Using the Nautilus Burn:// Utility


    Nautilus provides an alternative CD-burning utility. Just insert a CD-R or CD-RW
    into a CDR drive and Nautilus does the rest. These steps describe how to use the
    system:


    +   1. **Log in** as any user and insert a CD-R or CD-RW disc into your CD writer
    drive.


    A Nautilus window opens, showing the contents of your home directory.


    +   2. **Double-click** your home directory icon, in the upper-left corner of
    your desktop.


    +   3. **Click and hold** any file or directory and drag it to the *burn://* window.


    All the files and directories are displayed in the *burn://* window; those files
    and directories aren''t really copied, but instead are linked to the *burn://*
    window.


    +   4. **Click any and all of the files and directories in order to highlight
    them.**


    Selecting a file or directory enables it to be written to CD.


    +   5. **Click the Write to CD button** and you''re off to the races.


    After a little thought, the Writing CD dialog box opens. When the CD write is
    finished, the disc is ejected by default.


    +   6. **Click the Close button** when you''re finished.


    +   7. **Close the CD tray by pushing it back into the drive.**


    A Nautilus window opens, showing the contents of the disc you just finished writing.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# **Burn, Baby, Burn: Burning CDs**


    The steps in this section describe how to create, or *burn*, a CD-ROM. You can
    copy any kind of file to your CD-R or CD-RW:


    +   1. **Log in as any user and insert a CD-R or CD-RW disc into your CD writer
    drive. (Close the Burn:/// window when it opens.)**


    What can you burn? The world’s your oyster, and you can make a CD of anything
    you want: data, software, or music. A good place to start is by backing up your
    `/home` directory on CD.


    +   2. **Click the GNOME Menu button and choose System Tools-> More System Tools->CD
    Writer.**


    The GNOME Toaster window opens, as shown in Figure 11-4; an Information dialog
    box that you can read and close by clicking the OK button opens too.


    +   3. **Click the Folder icon, near the lower-left side of the window.**


    Gtoaster contains its own file manager.


    +   4. **Find the file or directory you want to record by clicking the directory
    where it’s stored.**


    For example, double-click `/home` and then the `paul/ogg/Pat Metheny` directory.


    +   5. **Click and drag the files or directory (the `rh18fd` directory, in this
    example) to the Folder subwindow you opened in Step 3.**


    You don’t have to use the GNOME Toaster file manager to select the file or files
    to record. You can open a Nautilus window and drag the file over to the Track
    subwindow.


    +   6. **Click the CD icon, immediately below the Track button in the lower-left
    corner of the window.**


    The Record subwindow opens and replaces the Track subwindow. You’re presented
    with several options that control the CD-R/RW drive. The default settings should
    work for your ISO image. ISO (International Organization for Standards) is in
    this context a type of file system that can be read by many different types of
    computer operating systems.


    +   7. **Click the Record button and the CD recording process counts down.**


    You have nine seconds to abort your mission.


    +   8. **You can stop the process by pressing the Stop button.**


    Your home directory is burned to the CD, creating a simple, reliable, and effective
    backup system. It’s easy to use.'
  merge: -1
  img_proc: true
