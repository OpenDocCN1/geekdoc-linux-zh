- pgno: 82
  md: '# # Creating an Account without X


    If X isn’t working or you want to work from a terminal emulator, you can still
    add user accounts. To do so, follow these steps:


    +   1. Open a GNOME Terminal window by clicking the GNOME Menu button and choosing
    System Tools→Terminal.

    2. Log in as root by entering this command:


    ```

    `su -`

    ```


    +   3. Enter the root password when prompted.

    4. Type useradd *name* at the command prompt, where *name* is the login name for
    the new login account.

    5. Type passwd *name* at the command prompt and press **Enter**.


    This step changes the password of the new account, which had a default password
    assigned to it by the *useradd* command in Step 1. What good is a password if
    you use the default one?


    +   6. Type your **password again**.


    Red Hat Linux asks you to retype your new password to ensure that the password
    you typed is the one you thought you typed. If you don’t retype the password exactly
    as you did the first time (which is easy to do because it doesn’t appear onscreen),
    you have to repeat the process. Red Hat Linux updates the password for the new
    login.


    # # Ending Your First Session


    Logging off the system and restarting the login process is simplicity itself.
    To do so, click the GNOME Menu button and choose **Log Out**. The Are You Sure
    You Want to Log Out? window appears, and you’re asked to confirm that you want
    to log out. If you do (do you really?), click the **OK** button and you’re outta
    there. Click **No** if you change your mind and want to play around with your
    new operating system a little while longer.


    ![](img/8c094d1b36276212c03d10d898508a6e_82_0.png)


    You can also choose to reboot or halt your computer from this window by clicking
    either the **Shutdown** or **Reboot** button and then clicking **OK** to confirm
    your decision. Depending on which you choose, your system stops completely or
    reboots. You can also press the **Ctrl+Alt+Backspace** keys to shut down your
    current session. This method is less graceful but still effective, especially
    in case some renegade process freezes your X session.'
  merge: -1
  img_proc: true
