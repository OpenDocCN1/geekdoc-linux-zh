- pgno: 304
  md: "Ices2 and Icecast2 use the loopback (`127.0.0.1`) interface to communicate.\
    \ *(The loopback interface is an internal network interface that doesn't use any\
    \ physical device.)* Using the loopback interface provides a simple method for\
    \ testing your configuration.\n\n![](img/8c094d1b36276212c03d10d898508a6e_304_0.png)\n\
    \nIcecast2 uses Port 8000 to communicate with its stream source and Port 8001\
    \ for administration.\n\nYou begin by configuring Icecast2:\n\n+   1.  **Log in\
    \ to your Red Hat Linux computer as the root user.**\n    The Icecast2 configuration\
    \ file was installed in the `/usr/local/etc` directory when you ran the `make\
    \ install` command. Now, you have to make only some minor modifications to that\
    \ file to set up your simple streaming server.\n\n+   2.  **Open the Gedit text\
    \ editor by clicking the GNOME Menu and choosing Accessories➔ Text Editor.**\n\
    \    In the Gedit window, choose File➔Open.\n\n+   3.  **Enter /usr/local/etc/icecast.xml\
    \ in the Selection text box and click OK.**\n    The contents of `icecast.xml`\
    \ are displayed in the text editor, as shown in Figure 19-1.\n\n![](img/8c094d1b36276212c03d10d898508a6e_304_1.png)"
  merge: -1
  img_proc: true
- pgno: 305
  md: "+   4. Find the part of the configuration file that defines the port number\
    \ and bind address. Remove the comments from those parameters.\n\nComments encapsulate\
    \ the configuration parameters with these character strings: `<!--` and `-->`.\n\
    \n+   5. Remove the comments and the code should look like this:\n\n```\n<!--\
    \ You can use these two if you only want a single listener -->\n<port>8000</port>\n\
    <bind-address>127.0.0.1</bind-address>\n```\n\nThese parameters tell the Icecast2\
    \ server which port number and IP address to listen to. They also define the master\
    \ server as the same machine.\n\n+   6. Find the Master Server section of the\
    \ configuration and remove the comments. The configuration should look like this:\n\
    \n```\n<master-server>127.0.0.1</master-server>\n<master-server-port>8001</master-server-port>\n\
    <master-update-interval>120</master-update-interval>\n<master-password>hackme</master-password>\n\
    ```\n\n+   7. Find the <logdir> parameter and change it to\n\n```\n<logdir>/var/log/icecast</logdir>\n\
    ```\n\nThis location is where all the information about the running Icecast2 server\
    \ is kept (in logs). Information about Icecast2 problems is placed there too.\n\
    \n+   8. Find the <security> section. You should set the Icecast2 server to use\
    \ the user and group identification number nobody:\n\n```\n<security>\n  <chroot>0</chroot>\n\
    \  <!--\n    <changeowner>\n      <user>nobody</user>\n      <group>nobody</group>\n\
    \    </changeowner>\n  -->\n</security>\n```\n\nRunning the server as nobody reduces\
    \ the security risk — breaking into your Icecast2 server doesn’t provide a hacker\
    \ with superuser privileges.\n\n+   9. Remove the comments from before the <changeowner>\
    \ parameter and after the </changeowner> parameter:"
  merge: -1
