- pgno: 340
  md: '# Appendix B


    # Discovering Your Hardware


    # In This Appendix


    +   - PC hardware subsystems

    - Hard drive controllers

    - Computer memory

    - Hardware identification on Windows NT, Windows 2000, and Windows XP computers

    - Hardware identification on Windows 9x and Windows Me computers


    You should know as much about your computer as possible before installing Red
    Hat Linux. This appendix introduces the basic systems that make up a computer.
    We also show you how to discover information about those parts.


    Knowing your hardware can be useful at parties: “My processor is faster than your
    processor!” In addition to letting you brag at parties, this knowledge can be
    helpful if you have problems installing Red Hat Linux in Chapter 3. Understanding
    the bits and pieces that comprise your computer can help you install Red Hat Linux.
    That information also lets you know better what your new Linux computer is capable
    of. This appendix helps you get started on your path to self discovery.


    ![](img/8c094d1b36276212c03d10d898508a6e_340_0.png)


    Linux runs on Intel processors from the venerable 386 on up to the Digital Equipment
    Corporation (DEC) Alpha, Sun SPARC, and other systems. However, the version of
    Red Hat Linux included with this book works on only Intel 386-, 486-, and Pentium-based
    computers. That shouldn’t be a problem because it seems that 99.9 percent (well,
    maybe not quite that many) of the world’s computers use Intel.


    # Breaking Down Your Computer


    No, we don’t want you to break your computer. But we do want to describe the computer
    subsystems. Computers may seem mysterious when you first use'
  merge: -1
  img_proc: true
- pgno: 341
  md: "them, but the truth is that they're not terribly complex. When you break down\
    \ the parts that make up a PC, you see that each part performs a specific task.\
    \ The sum of the parts equals a computer. This list outlines the subsystems that\
    \ comprise a computer:\n\n+     * **Central processing unit (CPU):** The CPU,\
    \ or microprocessor, is often referred to as the brains of a computer because\
    \ the CPU controls, in minute detail, everything the computer does. CPUs are controlled\
    \ by software that is essentially a recipe for doing tasks as simple as detecting\
    \ keyboard input or as complex as communicating across networks to display pictures\
    \ in a web browser.\n\n    The most common CPUs are now Intel Pentiums, which\
    \ you're using to run your PC. Generally, the faster the CPU, the faster your\
    \ computer. CPU speed is measured in *megahertz* (MHz), which means millions of\
    \ cycles per second. To perform complex tasks such as sending e-mail, a CPU has\
    \ to perform many simple tasks, or instructions, in order to complete the larger\
    \ one. Although the simplest instructions require a single CPU cycle, most require\
    \ several cycles. However, the MHz measurement is a reasonably good measure of\
    \ how fast a microprocessor runs.\n  * **Hard disks:** Hard disks — also referred\
    \ to as hard drives — store all the permanent information on a computer. Hard\
    \ disks are metal platters that store bits and bytes in tiny magnetic domains\
    \ (spots). The disk spins, and a magnetic head that floats on a cushion of air\
    \ reads and writes from the disk. The spinning disk allows the head to quickly\
    \ access any location on the disk and also creates the air cushion.\n  * **Disk\
    \ controllers:** The disk controller connects the drive to the computer's microprocessor.\
    \ Several types of controllers are commonly used: IDE, USB, FireWire, and SCSI.\
    \ Most PCs come with IDE internal hard drives. However, high-performance computers\
    \ tend to use SCSI-based drives because they're faster (and more expensive). IDE\
    \ controllers can connect as many as four drives.\n  * **CD-ROM:** CD-ROMs store\
    \ information like hard drives do, but in optical rather than magnetic form. Most\
    \ PCs use IDE-based CD-ROMs. SCSI CD-ROMs are faster, just like SCSI hard disks.\
    \ Because the prices of USB and FireWire CD-ROMs are dropping fast, they're becoming\
    \ more common.\n  * **RAM, or Random Access Memory:** RAM is much faster than\
    \ hard disks and CD-ROMs. Because RAM is used to store temporary information,\
    \ programs, data, and other types of information are stored in RAM — it “forgets”\
    \ everything when power to the computer is turned off. RAM is measured in megabytes\
    \ (MB). A megabyte is roughly one million bytes.\n  * **Mouse:** Which type of\
    \ mouse do you have — bus, PS/2, or serial? How many buttons does it have? If\
    \ you have a serial mouse, which COM port is it attached to, and which protocol\
    \ (Microsoft or Logitech) does it use?"
  merge: -1
  img_proc: true
- pgno: 342
  md: '**Monitor/flat panel display:** What are the make and model of the monitor
    or flat panel display? What are its vertical and horizontal refresh rates? You
    need this information only if you plan to use the X Window System, the graphical
    portion of Linux. Monitors and flat panel displays perform exactly the same function,
    but with different technologies. Monitors are the ubiquitous television-like,
    glass vacuum tube devices that are heavy and quickly being replaced by flat panel
    displays. Flat panels use liquid crystal display (LCD) technology, which uses
    less power and space.


    **Video card:** What are the make and model number of the video card or video
    chip set, and what is the amount of video RAM?


    **Network interface card (NIC):** If you have a network connection, what are the
    make and model number of the network interface card?


    That’s the rundown of computer subsystems. Each one performs a specific function;
    buttoned up inside a computer chassis (desktop style or laptop), they work together
    to create the computer you’re familiar with. The next two sections describe hard
    drives and memory in more detail.


    # ## Understanding Hard Drive Controllers


    The two main types of hard drives are IDE and SCSI, and each type has its own
    controller. IDE is more common in PCs, and newer PCs usually have two IDE controllers
    rather than one. For each IDE controller, your system can have only two hard drives:
    a master and a slave. Therefore, a PC with two IDE controllers can have as many
    as four hard drives. You should know which hard drive is which. Also, if you have
    a Windows system you want to preserve, you should know on which hard drive it
    resides. The following list shows a normal configuration on a Windows system:


    +   - The first controller’s master drive is named C.

    - The next hard drive, named D, is the slave drive on the first controller.

    - The next hard drive, E, is the master drive on the second controller.

    - The last hard drive, F, is the slave drive on the second controller.


    Windows is normally located on your C drive, and data is on your other drives.
    This lettering scheme is one possibility; your hard drives may be set up differently
    and may include CD-ROMs as drives on your IDE controllers.


    Some high-end PCs have SCSI controllers on their motherboards or on separate SCSI
    controller boards, either in addition to or instead of the IDE controllers. Older
    SCSI controllers can have as many as 8 devices on them, numbered'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'from 0 to 7, including the controller. Newer SCSI controllers (known as wide
    controllers) can have as many as 16 devices, including the controller itself.


    If all you have is a SCSI hard drive, Drive 0 or Drive 1 is usually your C drive,
    and others follow in order.


    If you have a mixture of IDE and SCSI controllers, your C drive could be on any
    of them. The sections “Discovering Your Windows 9x or Windows Me Hardware” and
    “Discovering Your Windows NT, Windows 2000, or Windows XP Hardware,” later in
    this appendix, show how to identify how many hard drives you have, what type they
    are, and which controllers they’re attached to.


    ![](img/8c094d1b36276212c03d10d898508a6e_343_0.png)


    Consider putting Red Hat Linux on a separate hard drive, for a couple of reasons.
    First, you can now find 80GB hard drives for much less than $100 (U.S.). Second,
    the task of shrinking MS-DOS and Windows to be small enough to allow Red Hat Linux
    to reside in its full glory on an existing hard drive is difficult at best and
    impossible at worst. Also, although splitting the Red Hat Linux distribution across
    hard drives is possible, doing so makes updating the distribution difficult later.


    # ## A Bit about Memory Bytes


    Memory is the most important factor in determining how fast your computer runs.
    Computers use Random Access Memory (RAM) to store and access the operating system,
    programs, and data. The Intel processor usually has the following amounts of RAM
    (main memory):


    +   • Linux can run on a surprisingly small amount of memory. With some work and
    no graphics, you can squeeze Linux on an old PC with only 16MB of memory; 32MB
    makes life much easier and your computer significantly faster. Many people use
    old PCs with small amounts of memory as simple network servers.

    • If you want to run Linux with graphics, however, you need 64MB.

    • With 128MB, Red Hat Linux runs multiple graphical programs, like OpenOffice,
    with ease.

    • You need 256MB or more (many PCs now come standard with 512MB) for hard-core
    computing. Using big applications, such as VMware, make having enough memory essential.


    ![](img/8c094d1b36276212c03d10d898508a6e_343_1.png)


    VMware virtual computers need their own RAM to operate at a reasonable speed;
    for example, you should allocate a minimum of 128MB of memory to run a Windows
    2000 virtual computer. Plan to use 512MB if you want to run multiple instances
    of VMware virtual computers.'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'You can install Red Hat Linux on most laptop computers by using the note- book''s
    built-in CD-ROM drive, or a PCMCIA, USB, or proprietary CD-ROM drive. If you don''t
    have any of these items, you can try to get a PCMCIA Ethernet controller and do
    a network installation, as long as another Linux system on the network has a CD-ROM
    drive installed. If that is the course you take, consult the Red Hat installation
    documentation at www.redhat.com/support. You also need a video card that Red Hat
    understands. Red Hat Linux supports most video cards, and usually the only problems
    result from bleeding-edge note- book computers that use the latest and greatest
    video hardware. You can use the generic VGA, XGA, or SVGA drivers that Red Hat
    supplies if you can''t find the specific driver.


    # # Discovering Your Windows 9x or Windows Me Hardware


    You don''t have to go to Hollywood to be discovered if you''re a piece of computer
    hardware. Windows provides the tools to use to discover your bits and pieces right
    at home. This section describes how to use Windows 9x or Windows Me for the discovery
    process.


    If you have a Windows 9x or Windows Me computer, use this section to discover
    and display information about your computer. We use the ubiquitous Control Panel.
    Start your Windows computer and follow these instructions:


    +   1. Click the **Start** button and choose **Settings**:: **Control Panel**.
    Double-click the **System** icon and select the **Device Manager** tab.


    +   2. At the **top** of the screen, select **View Devices by Connection**. This
    step shows all components and how they relate to each other.


    +   3. On the **Device Manager** tab (from the **Control Panel**) in the **System
    Properties** dialog box, select the **View Devices by Type** option.


    On the list, notice how a plus ($\oplus$) or minus ($\otimes$) sign precedes some
    icons. A plus sign indicates that the entry is collapsed. A minus sign indicates
    that the entry is expanded to show all subtrees.


    +   4. Click the plus ($\oplus$) sign to expand the list.


    Expanding the list shows each computer subsystem. Every device that makes up your
    computer is shown. Right-click a device and choose the **Properties** option to
    display information about a particular device.


    You can use the Web to find out about your computer. Computer companies provide
    detailed information about their products on their Web sites. Go to the manufacturer''s
    Web page and look up your computer''s model number. When you get to your page,
    look for the **Specification** (or **Specs**) link.


    ![](img/8c094d1b36276212c03d10d898508a6e_344_0.png)'
  merge: -1
