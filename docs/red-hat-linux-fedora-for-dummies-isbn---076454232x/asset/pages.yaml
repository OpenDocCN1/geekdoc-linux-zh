    # Installing Linux kernel headers


    VMware makes use of Linux kernel modules, which are similar to Windows device
    drivers, to interact with the host Linux computer. VMware ships kernel modules
    that automatically work with some versions of Red Hat Linux. However, we can''t
    be certain that those modules match your Linux kernel \u2014 the one that ships
    with this book. Therefore, the following steps help you build your own VMware
    kernel modules.


    Building VMware modules requires the presence of Linux kernel headers, which may
