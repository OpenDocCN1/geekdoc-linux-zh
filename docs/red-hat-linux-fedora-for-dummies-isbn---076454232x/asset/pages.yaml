  md: '# Danger, Will Robinson! Detecting intruders


    Everybody needs a loyal, vigilant robot to sound the alert when aliens, monsters,
    Dr. Smith, and hackers come at you. You can’t have literal robots (or can you?),
    but you can have an intrusion-detection system (IDS).


    Intrusion detection is the flip side of intrusion prevention. You can’t depend
    on not getting hacked unless you turn off your computer and lock it in your panic
    room. Remember that no silver bullet exists in the world of computer security.
    You have to take measures to detect whether and when you get compromised.


    Intrusion detection requires more on-going work than any of the security systems
    we discuss in this book. The other systems, such as firewalls and password protection,
    require some up-front work, but then run without much additional work. An IDS,
    however, requires some initial installation and configuration and then continual
    review. You have to monitor an IDS daily if you want it to be of any use to you.
    *Many* IDSs — far too many to describe here — can give you extra security. We
    suggest two


    mature and relatively easy-to-use systems that provide good bang for your buck:
    Snort and Tripwire.


    *Snort* is a network-based IDS. It looks for patterns in your network traffic
    that indicate hacker probes and break-in attempts. Snort isn’t perfect and does
    report false positive alerts. You’re going to have to spend time identifying and
    eliminating false-positives if you want to use Snort. However, that will be time
    well spent because Snort is considered to be an excellent IDS by system administrators
    and security professionals. Go to www.snort.org to find more information.


    *Tripwire* works by securely recording the fingerprints of files and directories
    and then comparing them to subsequent ones. Any differences between the current
    and original fingerprint indicates the file has changed and might have been compromised.
    The fingerprints are called checksums, which are unique mathematical values calculated
    from the contents of a file or directory. You can find Tripwire at www.tripwire.com.


    Enter the pass phrase when you’re prompted and your secure web server starts.


    # Connecting to your secure web server


    After you have created the private key and certificate, you can connect to your
    secure web server.


    These steps describe how the process of obtaining the server’s certificate works:


    +   1. Log in to your Red Hat Linux computer and open Mozilla.

    2. Click the GNOME Main Menu and choose Internet→Mozilla Web Browser.'
