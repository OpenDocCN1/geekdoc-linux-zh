  img_proc: true
- pgno: 300
  md: '+   3. Click the **Rip column** (on the right side of the screen) of each track
    you want to use.


    A check mark appears next to each track you select.

    4. Click the **Config tab.**


    A subwindow opens, showing several additional tabs.

    5. Click the **Encode tab in the subwindow.**


    Another subwindow opens that shows several configuration options.

    6. Click the **Encoder pull-down menu** (showing the default **bladenc**) and
    select **oggenc.**


    Selecting oggenc tells Grip to create Ogg-encoded music files.

    7. Click the **Rip tab at the top of the window** (next to the **Tracks tab**).

    8. Click the **Rip+Encode button.**


    Grip rips the music from the CD to files on your computer. The files are stored
    in a subdirectory named ogg in your current working directory.


    Grip doesn’t do the CD ripping work. Grip does its thing by starting the cdparanoia
    program and feeding it the parameters you just selected. The tracks are ripped
    and initially saved in Wave format. After cdparanoia finishes, Grip starts the
    oggenc utility and converts the Wave files to Ogg format.


    You can convert from Wave to Ogg format by running this command in a terminal
    emulator: `oggenc *.wav.` You can play Ogg-encoded files: `ogg123 xyz.wav.`


    You now have one or more Ogg-Vorbis-formatted audio files. You have to install
    and configure Ices2 and Icecast2 to broadcast music to yourself.


    # # Installing Ices2 and Icecast2


    In this section, we tell you how to install other applications and services. Neither
    Ices2 or Icecast2 comes in RPM packages, so you have to build them from scratch.


    Building from scratch in the Linux world requires that you follow these general
    steps:


    +   1. **Configure.** The first step requires configuring the software. The configuration
    process builds dependency files. Several Linux systems are available that do this.
    The system used by Icecast2 and Ices2 is `autogen.sh`.

    2. **Compile.** After the software is configured, you have to compile it. *Compiling*
    is a universal computer process that changes source code into'
