    # “I never seem to have the correct time”\n\nProblem: When you boot Linux, the\
    \ time is wrong, so you set it with the date command. Then you boot Windows and\
    \ its time is wrong, so you reset it. When you reboot Linux, its time is wrong\
    \ again.\n\nSolution: Most Unix systems keep their time by using Universal Time\
    \ (also known as Greenwich Mean Time, or GMT), but Microsoft systems keep their\
    \ time as local time. When you set the time in either system, you set the CPU\
    \ clock to that version of the time. Then, when you boot the other system, it\
    \ interprets differently what is in the CPU clock and reports a different time.\n\
    \nLinux enables you to use either GMT or your local time. You make this choice\
    \ when you install the system. To change your choice, follow these steps:\n\n\
    +   1. **Log in as root and type** `timeconfig`.  \n    The Configure Timezone\
    \ dialog box appears.\n2. **Select the GMT option.**  \n    Highlight the option\
    \ by pressing the Tab key, if necessary. (You should already be there when you\
    \ activate the `timeconfig` command.)\n3. **Press the spacebar to deselect the\
    \ option. Press the Tab key until you reach the OK button and then press Enter.**"
