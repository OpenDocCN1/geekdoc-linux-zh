    For example, you may choose the string mynetwork as your ESSID. In that case,
    you must enter mynetwork as the ESSID for all machines connected to your ad hoc
    network.


    +   6. Enter the encryption key in the Key text box and then click the Forward
    button.


    You should obtain the encryption key from your network administrator. If you have
    set up your own wireless home network, you can generate the key yourself. An encryption
    key, similar to a password, protects your wireless network from casual eavesdropping.
    Enter in the text box a key that’s 13 characters or fewer — for example, this_is_a_password;
    using all 13 characters maximizes the encryption key’s effectiveness.'
  merge: -1
