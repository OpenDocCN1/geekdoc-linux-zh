- pgno: 298
  md: '# ## Chapter 19

    # Building a Streaming

    Audio Server


    # **In This Chapter**


    +   - Introducing Ices2 and Icecast2 streaming audio servers

    - Creating a music source

    - Installing and configuring Ices2 and Icecast2

    - Streaming audio to your private network


    All work and no play makes Linux a dull boy. So let''s play a little bit. This
    chapter describes how to play audio streams on your private network.


    We show you in Chapter 12 how to use Linux applications like MPlayer and XMMS
    to listen to audio streams. In this chapter, we switch sides and show you how
    to serve up such streams. Again, the open source movement fills the bill with
    Ices2 and Icecast2.


    # ## Introducing Ices2 and Icecast2


    You''re most likely familiar with how audio streaming works from the desktop perspective.
    Chapter 12, for example, shows how to use XMMS and MPlayer to listen to Internet
    audio streams. (You can also use MPlayer to see video content.) However, many
    people consider it a mystery about how multimedia (audio, video and slide show)
    streams are created.


    Feeding audio or visual data to a multimedia server, such as Icecast2, creates
    audio streams. (Shoutcast and RealServer, which are commercial servers, operate
    in a similar manner to Icecast2.) You can use Ices2 to feed audio information
    to Icecast2. A multimedia client then connects to the server. The server streams
    out the audio information to the client, and you can sit back and enjoy.'
