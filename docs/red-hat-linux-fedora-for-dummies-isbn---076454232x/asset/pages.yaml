    computers (to use more than one monitor at a time). A description of multiple-head
    systems is beyond the scope of this book.


    ![](img/8c094d1b36276212c03d10d898508a6e_77_2.png)


    Figure 4-3: The monitor Advanced Settings dialog box.'
