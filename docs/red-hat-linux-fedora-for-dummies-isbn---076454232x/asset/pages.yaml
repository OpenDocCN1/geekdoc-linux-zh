- pgno: 229
  md: "# Connecting your Internet gateway\n\nAfter you configure your Internet gateway\
    \ to forward network traffic from your private network to your Internet connection\
    \ (see preceding section), you need to make that connection. In this section,\
    \ we describe how to use the Internet connections introduced in Chapters 5 and\
    \ 6. You build on those instructions to connect your entire network to the Internet\
    \ through these connections.\n\nFrom a functional viewpoint, the type of Internet\
    \ connection you use—telephone, DSL, or cable—doesn’t matter because all these\
    \ Internet connections send and receive the same network traffic. (Practically\
    \ speaking, of course, the higher throughput and lower latency of broadband make\
    \ it more desirable than old telephone modems.) For this reason, you can treat\
    \ as interchangeable the Internet connections you may have read about in Chapters\
    \ 5 and 6.\n\nThe forwarding we describe in the preceding section takes care of\
    \ routing the packets to and from the Internet via your Internet gateway. Follow\
    \ these steps to configure the Internet gateway:\n\n+   1. Install the Ethernet\
    \ or Wi-Fi NIC on your Red Hat Linux Internet gateway to connect it to your private\
    \ network.\n\n+   2. Install the Ethernet NIC on your Red Hat Linux Internet gateway\
    \ to connect it to your DSL or cable gateway.\n\n+   3. Connect the gateway to\
    \ its Internet connection device.\n\nYou either connect the second Ethernet NIC\
    \ to the DSL or cable modem or connect your computer’s serial cable to the telephone\
    \ modem (or simply to the internal telephone modem).\n\n+   4. Configure your\
    \ Internet gateway to allow packet forwarding.  \n\n(Refer to the preceding section.)\n\
    \n+   5. Assign an IP address to each NIC. For example, assign the address 192.168.1.254\
    \ to your internal connection (eth0) and 192.168.32.254 to the external connection\
    \ (eth1).  \n\nNote that when you’re using a telephone or cable modem, this action\
    \ is done automatically for you—modems connect directly to your gateway and not\
    \ through an Ethernet NIC; some DSL modems can also plug directly into your computer\
    \ and don’t require an Ethernet connection. For this book, we assume that you’re\
    \ connecting via an Ethernet NIC."
