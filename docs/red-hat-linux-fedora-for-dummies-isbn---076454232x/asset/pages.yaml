- pgno: 249
  md: "# Building a DNS Server\n\nEvery device connected to the Internet, including\
    \ your Red Hat Linux computer, requires an Internet Protocol (IP) address in order\
    \ to communicate properly. IP addresses are unique numbers and are therefore difficult\
    \ for us carbon-based humans to remember and use. The Domain Name System (DNS)\
    \ solves that problem by converting numbers to names, making it possible to use\
    \ names like www.redhat.com rather than 66.187.232.56. In many ways, DNS makes\
    \ the Internet usable and therefore popular.\n\nDNS is an interdependent information-sharing\
    \ system — a distributed database. No centralized servers contain actual addresses,\
    \ such as www.redhat.com. Instead, DNS is structured so that local servers store\
    \ local addresses, and a few centralized servers store information about where\
    \ to go to find local addresses.\n\n# Introducing DNS components\n\nThe overall\
    \ DNS system is a complex system that contains many components. But because we\
    \ show you how to build a DNS server for your private network, you can use a more\
    \ simple system. Building your DNS server requires understanding only a relative\
    \ handful of DNS components.\n\nThis list outlines the basic DNS components:\n\
    \n+   - **Domains:** You're probably familiar with domains whether you realize\
    \ it or not. Domains are the networks you access all the time on the Internet.\
    \ For example, redhat.com is a domain (and www.redhat.com is the name of a server\
    \ within the redhat.com domain).  \n  Domains can optionally be divided into subdomains.\
    \ For example, Red Hat has a subdomain, beta.redhat.com, used for its beta software\
    \ development.  \n  Domains themselves are divided into domains. The ubiquitous\
    \ .com, .edu, and .org are all top-level domains. They organize the Internet into\
    \ business, educational, and not-for-profit arenas, respectively.\n- **Zones:**\
    \ Domains are divided into zones. DNS servers service zones. A zone can map directly\
    \ to a domain; multiple zones can service a domain too. The DNS server you're\
    \ building in this section consists of a single domain that services the fictitious\
    \ paunchy.net domain.\n- **Authoritative name servers:** Every zone must have\
    \ an authoritative name server. It holds the information for every host within\
    \ the zone. You can"
  merge: -1
  img_proc: true
- pgno: 250
  md: 'create primary and secondary authoritative name servers. The secondaries back
    up the primaries.


    +   Non-authoritative name servers: You can create name servers that don''t necessarily
    provide the most up-to-date information.


    +   Caching name server: Name servers can be configured to look up addresses from
    other name servers and temporarily save, or cache, the information. Caching name
    servers helps spread out the load of servicing large domains.


    +   Root name servers: The authorities who control domain name registrations provide
    root name servers that hold the addresses of name servers for each domain. DNS
    queries go to root name servers to find out where to find authoritative name servers.


    This list describes the parameters found in DNS configuration and zone files.
    The parameters are called resource records (RR):


    +   A records: Address (A) records map IP names to numeric addresses.


    +   C records: Canonical (C) records define aliases for A records.


    +   MX records: Mail exchange (MX) records specify the mail servers that service
    a domain.


    +   NS records: Name server (NS) records specify the name server for a zone.


    +   SOA: The start of authority (SOA) parameter creates a section that describes
    the generic properties of a zone file. The SOA configures parameters that set
    the serial number and various timeouts, plus the domain name of a zone.


    # ## Understanding how a DNS address request works


    This section gives you a look at how your browser finds the Red Hat Linux Web
    page:


    +   1.  You open your browser and enter the URL www.redhat.com.

    2.  The browser asks Linux for the Web page’s numeric address.

    3.  Linux looks in its /etc/resolv.conf configuration file and finds the address
    of a name server.'
  merge: -1
  img_proc: true
- pgno: 251
  md: "![](img/8c094d1b36276212c03d10d898508a6e_251_0.png)\n\nYou can use any available\
    \ DNS server on the Internet. For example, you can use Albuquerque's finest ISP\
    \ Southwest Cyberport DNS server, 198.59.115.2, from anywhere on the Internet.\
    \ You should use your own ISP's servers because it has fewer routers, or hops,\
    \ to go through, which results in better reliability and speed.\n\n+   4. Linux\
    \ requests the IP address for www.redhat.com from the name server.  \n5. If the\
    \ name server doesn't know the IP address of www.redhat.com, it asks a root server\
    \ for the address of an authoritative name server for the redhat.com domain. \
    \ \n6. The root server returns the address of the Red Hat authoritative name server,\
    \ the first of which is ns1.redhat.com (66.187.233.210).  \n7. The name server\
    \ asks ns1.redhat.com for the address of www.redhat.com.  \n8. The name server\
    \ ns1.redhat.com returns the www.redhat.com address.  \n9. Using the numeric www.redhat.com\
    \ IP address, your browser starts communicating with the web server.\n\n# Building\
    \ a DNS server\n\nIt's time to build a server. The steps in this section describe\
    \ how to build an authoritative name server for your private network. The server\
    \ provides the addresses for the private, nonroutable private network we describe\
    \ in Chapter 15. Therefore, you don't have to register the addresses with any\
    \ authority. The DNS server is authoritative for your private domain, but that\
    \ information isn't available outside your network.\n\nThe steps in this section\
    \ show you how to install the DNS server software. You create the /etc/named.conf,\
    \ /var/named/local.zone, /var/named/paunchy.zone, and /var/named/1.168.192.zone\
    \ files.\n\n# Installing the DNS software\n\nStart by installing the bind RPM\
    \ that contains the named server software:\n\n+   1. Log in to your computer as\
    \ root and insert this book's companion DVD-ROM.  \n2. Start a GNOME Terminal\
    \ session.  \n3. Enter this command in the terminal emulator window:\n\n```\n\
    rpm -ivh /mnt/cdrom/Redhat/RPMS/bind-9*\n```\n\nNow you have to create the DNS\
    \ configuration file, /etc/named.conf:"
  merge: -1
  img_proc: true
- pgno: 252
  md: "# Creating the DNS configuration file\n\nThese steps describe how to create\
    \ a basic named.conf file:\n\n+   1. **Start the text editor by clicking the GNOME\
    \ Menu button and choosing Accessories Text Editor.**\n\n+   2. **Enter this configuration\
    \ in the Gedit window:**\n\n```\n```\noptions { directory \"/var/named\"; };\n\
    zone \".\" {\n    type hint;\n    file \"named.ca\";\n};\nzone \"localhost\" {\n\
    \    type master;\n    file \"localhost.zone\";\n};\nzone \"paunchy.net\" {\n\
    \    type master;\n    file \"paunchy.zone\";\n};\nzone \"1.168.192.in-addr.arpa\"\
    \ {\n    type master;\n    file \"1.168.192.zone\";\n};\n```\n```\n\nThis list\
    \ describes the various parts of the /var/named file:\n\n+   - The **options**\
    \ section defines the `/var/named` directory as the location of the database files.\
    \ You can configure many more options. Enter the command `man named.conf` for\
    \ more information.\n\n+   - The `named.ca` section defines the master name servers\
    \ that serve the entire Internet.\n\n+   - The first zone section, `localhost`,\
    \ defines the master server for the internal loopback interface.\n\n+   - The\
    \ second zone section sets the master server for the `paunchy.net` domain or zone\
    \ to be found in the file `/var/named/paunchy.zone`.\n\n+   - The third zone section\
    \ defines the reverse lookup master server to be found in the `/var/named/1.168.192.in-addr.arpa`\
    \ file.\n\n+   3. **Save the configuration to /etc/named.conf by choosing File\
    \ Save As.**\n\n+   4. **Enter /etc/named.conf in the Selection box and click\
    \ OK.** Gedit saves your DNS configuration file."
  merge: -1
  img_proc: true
- pgno: 253
  md: "# ### Creating a localhost zone file\n\nTo create the `localhost.zone` file,\
    \ follow these steps:\n\n+   1. From the Gedit text editor, choose **File**▸**New\
    \ from the menu**.\n2. Enter the following configuration. (Of course, you can\
    \ select the machine names you want. The names are arbitrary. In fact, the IP\
    \ addresses are arbitrary too. You can select any nonroutable address space you\
    \ want.)\n\n```\n$TTL  86400\n@       IN      SOA     @ root.localhost (\n   \
    \                         1 ; serial\n                            28800 ; refresh\n\
    \                            7200 ; retry\n                            604800\
    \ ; expire\n                            86400 ; ttl\n)\n\n@       IN      NS \
    \     localhost.\n\n@       IN      A       127.0.0.1\n```\n\nSemicolons (;) indicate\
    \ comments. All characters following a semicolon are treated as a comment and\
    \ don't affect the operation of the DNS configuration files.\n\n+   3. Save the\
    \ configuration by choosing **File**▸**Save As**.\n4. Enter `/var/named/local.zone`\
    \ in the **Selection** box and click **OK**.\n\n# ### Creating the private network\
    \ zone file\n\nNext, you create the `paunchy.zone` file, which serves the private\
    \ network. This file contains the A and C records for all machines in your zone\
    \ (in this case, the zone maps directly to the `paunchy.net` domain.)\n\n+   1.\
    \ From the Gedit text editor, choose **File**▸**New from the menu**.\n2. Enter\
    \ the following configuration. (Of course, you can select your own machine names.\
    \ The names are arbitrary. In fact, the IP addresses are arbitrary too. You can\
    \ select any nonroutable address space you want.)\n\n```\n$TTL  86400\n@     \
    \  IN      SOA     paunchy.net.\n                        root.paunchy.net. (\n\
    \                            200112211\n                            10800\n  \
    \                          3600\n```"
  merge: -1
  img_proc: true
- pgno: 254
  md: '```

    IN NS ns.paunchy.net.

    IN A 192.168.1.254

    ; servers

    veracruz IN A 192.168.1.254

    www CNAME veracruz

    ns CNAME veracruz

    ; workstations

    chivas IN A 192.168.1.1 ; Linux

    pumas IN A 192.168.1.2 ; Linux

    tigres IN A 192.168.1.100 ; Windows

    ```


    +   3. **Save the configuration** by choosing **File::Save As**.

    4. Enter **`/var/named/paunchy.zone`** in the **Selection box** and click **OK**.


    # Creating the reverse zone file


    The last step is to create a reverse DNS lookup file for your zone. This file
    is optional but quite useful. By providing reverse lookup capability to your network,
    you can specify a numeric IP address and get a name back:


    +   1. Back in the **Gedit** text editor, choose **File::New** from the menu.

