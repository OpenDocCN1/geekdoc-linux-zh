  md: '![](img/8c094d1b36276212c03d10d898508a6e_77_0.png)


    The X Window System (X, for short) was invented at the Massachusetts Institute
    of Technology (MIT). MIT designed X to display graphical applications across a
    wide range of machines. It was originally built to run on Unix platforms, but
    has been adapted to Linux, Windows, and other platforms.


    ![](img/8c094d1b36276212c03d10d898508a6e_77_1.png)


    Old monitors that aren’t multicanning can be damaged if you try to use them at
    a higher resolution than VGA, which is 640 x 480 and 60Hz (a multicanning monitor
    can switch to the same signal frequency that a video card is generating). Most
    newer monitors have built-in protection mechanisms to keep them from burning up
    in what is known as overdriving, but older monitors don’t have this type of protection.
    Older monitors can literally catch on fire. If you hear weird noises from your
    monitor or smell burning components, turn off your computer immediately!


