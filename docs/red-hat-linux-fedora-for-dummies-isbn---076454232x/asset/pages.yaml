    # ## VMware: A Virtual Reality Machine


    Sometimes, you need to use an application that just doesn''t run under Linux —
    even with the help of Wine. For example, one of us has to use a trouble-ticket
    system to fix customers'' problems. The problem is that the trouble-ticket application
    doesn''t run under Linux, with or without Wine. That author must then install
    both Windows and Linux on his computer (**a dual-boot system**) or else maintain
    a separate one for the sole purpose of running the single application.


    Nothing is wrong with using a dual-boot computer, of course. But it''s sort of
    a waste of time if all you need to do is run one or two applications. Dual-boot
    computers also have to be rebooted when you need to use the other operating system.
    An alternative to dual booting is VMware, a commercial product from VMware, Inc.
    This program creates a virtual computer within a physical computer. The virtual
    computer runs as an application, just like OpenOffice or Mozilla.


    VMware looks and works just like a real PC. The virtual VMware PC can run an operating
    system, such as Linux or Windows, just like any real computer can. The operating
    system running on the virtual machine behaves just like the real operating system.
    Any applications it hosts, therefore, look and work just like the real applications!


    ![](img/8c094d1b36276212c03d10d898508a6e_206_1.png)


    VMware is also good for writing Linux books. Writing techy books like this one
    requires you to use early beta versions of new releases during the initial draft
    phase. The old method required installing the beta on your computer and using
    it for both testing and writing; alternatively, you can use two computers side-by-side.
    Both methods are clunky and cause numerous headaches when the beta does some funky
    thing. VMware solves the problem by allowing you to run the current production
    version of Red Hat Linux on your host computer and install the beta on the virtual
    computer. You can test the beta to your heart''s content while writing at the
    same time in OpenOffice — all on the same virtual computer. Updating from one
    beta version to another is a snap too.


    You can download the VMware Workstation product for free. It requires a license
    that costs approximately $300 for commercial use and $100 for educational use.
    It''s money well spent.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'The VMware virtual computers can use your host computer''s network connection.
    VMware provides two methods for accessing a private LAN and one method for accessing
    the host computer''s local file system:


    **Bridged network:** “Bridges” the virtual machine to the host machine’s private
    network through the host’s network interface card (NIC). The virtual machine appears
    to be an independent network device to the LAN. The virtual computer has its own
    virtual NIC with a real IP address.

    The bridged configuration provides the most flexible network configuration possible
    to the virtual machine. However, the virtual machine must be configured and maintained
    like any other device.


    **Network Address Translation (NAT) network:** A process that makes one networked
    computer appear as another computer. NAT translates the source network address
    (and port) to that of another address (and port). This method is widely used by
    private networks to funnel all their hosts through a single gateway to the Internet.


    VMware uses NAT to make the virtual machine appear to be the host machine on the
    host machine’s LAN. NAT is easy to configure because you have to configure only
    the virtual machine’s network configuration protocol (DHCP). You have to select
    only DHCP, therefore, and nothing else. (We describe NAT in Chapter 16.)


    **Host-only network:** Configures the virtual machine to use the host machine’s
    file system. VMware sets up Samba on the host machine, and then the virtual machine
    can mount the host’s file system. (*Samba* is a Linux/Unix system that speaks
    the same protocol, or language, as the Microsoft file sharing system. Samba allows
    Linux computers to access file systems on Windows computers and vice versa.)


    VMware also offers a 30-day evaluation license for no charge. The temporary license,
    which isn’t limited in any way other than the time limit, is ideal for testing
    this powerful tool. The steps in the following section describe how to download
    the product and its temporary license to find out about its power.


    # Downloading VMware


    VMware, Inc., allows you to easily download and use its software. These steps
    describe the process — virtual computing for everyone!


    +   1.  **Log in to your Red Hat Linux computer, open the Mozilla browser, and
    enter www.vmware.com/download in the text box.**

