    # Modifying your firewall to allow SSL


    You have to modify your Internet gateway or firewall to allow secure connections.
    You have to allow external web browsers to connect to Port 80 on your Apache server.
    The following rule allows SSL connections:


    ```

    iptables -A INPUT -p tcp -m state --state NEW,ESTABLISHED -j -dport 443

    ```


    If you''re using a DSL modem like the one we describe in Chapter 6, you must modify
    the modem''s network address translation (NAT) configuration. Many DSL modems
    are now on the market; describing how to configure them individually is beyond
    the scope of this book. Consult your modem''s manual for configuration instructions.
    You have to allow external connections to Port 443.


    # Reading your logs


    You are ultimately your best intrusion-detection system (IDS). Log files store
    information about nearly every one of your Red Hat Linux systems. Reading your
    logs lets you discover what has been happening on your computer and is one way
    to detect intrusions.


    Unfortunately, exploring log files is somewhat akin to reading tea leaves. No
    mechanical method exists for sifting through log-file tea leaves. You have to
    look for unusual and suspicious occurrences. As you read more, you learn about
    what is usual and, of course, unusual. Experience counts for a great deal when
    you''re an IDS.


    Red Hat provides two good systems for viewing log files:


    +   - **Logwatch**: The e-mail-based Logwatch log-alert system sifts through the
    log files in /var/log and e-mails the root user any alerts or errors. You can
    configure the Logwatch operational parameters to better fit your operation. However,
    the default works well at alerting you to the happenings on your computer.


    +   - **Red Hat Logviewer**: The Logviewer graphical utility provides one-stop
    shopping for all standard log files. This manual tool helps you to remember which
    log files to look at.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Using Logwatch


    Logwatch, installed by default during the Red Hat installation process, is a Perl
    script that''s run nightly by *cron*. It reads through every log file in the `/var/log`
    directory and picks out items that it thinks are interesting.


    The Logwatch Perl script is in `/etc/log.d/scripts/logwatch.pl`. The soft link,
    `00-logwatch`, in the `/etc/cron.daily` directory directs the *cron* system to
    run the script nightly.


    Logwatch is controlled by the `/etc/log.d/conf/logwatch.conf` file. This file
    controls options like who is e-mailed the results. The *logwatch* configuration
    file is self documented and simple to configure.


    # Using Logviewer


    Logviewer is a simple utility designed to display any of the standard Red Hat
    Linux log files in the `/var/log` directory. It displays by default the raw log
    information and leaves sifting out suspicious entries to your eyes. Logwatch can
    also perform simple filtering based on simple text strings.


    Nothing is special about Logviewer other than helping you to access common log
    files and look at their data. Don''t underestimate the value of that simple assistance,
    however. Although our busy lives makes reading log files a difficult task, it''s
    one of those mind-numbing-but-necessary jobs. It''s boring but essential!


    # Fending off modular root kits

    with a monolithic kernel


    ![](img/8c094d1b36276212c03d10d898508a6e_281_0.png)


    The Internet provides an ideal medium for finding and taking advantage of vulnerable
    computers. A hacker doesn''t have to leave the comfort of home to attack your
    machine. However, you shouldn''t consider the Internet as the only danger. You
    should also consider the physical vulnerability of your computer. If you work
    with other people, someone can potentially try to break in.


    # Understanding the Security Process


    The best way to look at security is as a process. The more you think about it
    and the more you study it, the safer you are. You should use the security systems
    described in this chapter as the foundation for your security process. However,
    you should continue to build your security process to meet the needs of your own
    computer system and network.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'This section outlines some additional building blocks you may consider adding
    to your process:


    +   Making backups: Backups are part of the security process? Yes! Backups are
    an essential security tool in the sense that you can never eliminate the possibility
    of getting hacked. If and when your security is breached, you may lose all sorts
    of information and configurations. For example, your computer may be completely
    erased or, worse, you may not know which files are good or bad. You must ensure
    your ability to recover from these types of catastrophes.


    One good backup method is to use the GNOME Toaster application, as we describe
    in Chapter 11. You can store your user account and configuration files on a CD-R/RW.
    It’s reliable and should last forever. The only limitation is its ability to store
    only 700MB to 800MB; you can store more data with compression, however.


    +   Security education: Keeping up with security trends and topics helps you avoid
    getting bitten by new hacks. Knowing your adversaries and their techniques is
    essential.


    These URLs provide good security-based information; see Chapter 21 for some current
    top security holes:


    +   * www.red.com/docs/manuals/linux/RHL-10-Manual/security-guide/

    * www.linuxsecurity.com

    * www.sans.org

    * www.nmap.org

    * www.securitytracker.com

    * www.infosyssc.com

    * www.cert.org


    +   Physical security: We focus on network-based security in this book. We assume
    that your Red Hat Linux computer is running on your home network, in which case
    you have to worry most about Internet bad guys. However, in an office environment,
    you have to worry about physical security.


    Physical security involves preventing people from walking up and gaining unauthorized
    access to your computer. You should set a BIOS password to prevent anyone from
    booting your computer into single-user mode, totally avoiding your Linux passwords.
    You should lock your computer in your office, if possible, to prevent anyone from
    stealing your hard drive. Don’t, under any circumstances, write your passwords
    in any accessible place (like on your desk or computer.)'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'You should also set the GNOME (or KDE) screen lock unless you want to log out
