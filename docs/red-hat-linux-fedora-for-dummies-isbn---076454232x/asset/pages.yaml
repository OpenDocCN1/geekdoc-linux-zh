  md: '# Chapter 14


    # Days of Wine and Applications


    # In This Chapter


    +   ► Introducing and using Wine

    ► Using CodeWeavers CrossOver Office

    ► Using VMware to run virtual Windows and Linux computers


    As you know if you have been reading other chapters of this book, Linux provides
    for many, if not most, of your desktop needs. The applications described in the
    preceding chapters satisfy most of your daily work requirements. All the essential
    applications, such as OpenOffice and Evolution, are at your disposal.


    Sometimes, however, you need to perform some function that isn''t provided for
    in the Linux world. For example, most games are written for the Microsoft world
    and aren''t available for Linux. At times, such as when you''re editing documents
    with complex macros, you must use Microsoft Word. That''s when Wine and VMware
    come to the rescue.


    Still, there''s always room for improvement, and the open source world works hard
    to provide new and useful applications.


    # Introducing Wine


    Wine doesn''t come from the Sonoma Valley or even from the south of France. You
    can''t get tipsy or spend much money on it either. Wine isn''t a beverage, but
    rather a software system that allows you to run Windows applications on a Linux
    computer. Wine helps to fill the Linux application gap.


    Modern Windows applications, at their core, are written to run on Intel, or Intel-
    compatible (AMD, for example) Pentium processors. (Some Windows applications are
    run on Apple Macs; for purposes of this discussion, however, we''re talking about
    only Intel-based PCs.) However, you can''t just load a program like Microsoft
    Word on your Linux computer and expect it to work.'
  merge: -1
  img_proc: true
- pgno: 191
  md: "The Microsoft Windows operating system provides a platform for running Microsoft\
    \ applications, such as Word. That platform is a little like an electrical plug\
    \ that provides the power to run various appliances; the appliances are analogous\
    \ to applications. What the Windows plug provides is a library of commonly used\
    \ low-level functions that are referred to as an Application Program Interface\
    \ (API). Those functions perform tasks common to every application, such as opening\
    \ a file or talking over a network. Using a common library prevents every single\
    \ application from having to reinvent the wheel. Instead, the applications just\
    \ plug into the common \"outlet\" and concentrate on performing their particular\
    \ function.\n\nThe problem is that the Windows platform, or \"plug,\" has square\
    \ holes and Linux has round ones. You can't plug Word directly into the Linux\
    \ operating system, for example. That's where Wine comes in and provides the adapter\
    \ so that you can plug the round peg into the square hole.\n\n![](img/8c094d1b36276212c03d10d898508a6e_191_0.png)\n\
    \nWine stands for Wine Is Not an Emulator. This typical acronym is the type that\
    \ Linux and Unix programmers love. The Wine acronym means not only that some people\
    \ just need to get out more, but also that it doesn't simulate (emulate) the entire\
    \ Windows environment. Rather, it duplicates the interface between the application\
    \ and the operating system. Using the electrical plug analogy, Wine doesn't emulate\
    \ the entire electrical grid (as in Windows) but, rather, simply provides the\
    \ adapter.\n\n# ## Downloading Wine\n\nUnfortunately, because Red Hat doesn't\
    \ include Wine in its distribution, you have to download it from the Internet.\
    \ These steps describe how to do so:\n\n+   1. **Log in to your Red Hat Linux\
    \ computer as any user.**\n   You can log in as the superuser (root) if you want,\
    \ but that's not necessary. By not logging in as the superuser, you don't run\
    \ the risk of unintentionally damaging your computer (for example, deleting all\
    \ your files).\n2. **Open your Mozilla browser by clicking the blue globe on the\
    \ GNOME Menu.**\n   Using Mozilla is described in Chapter 11.\n3. **Enter the\
    \ address www.winehq.com in the text box at the top of the browser and press Enter.**\n\
    \   You go to the Wine project's home page.\n4. **Under the Download heading on\
    \ the center-left side of the Web page, click the Binaries link.**\n   Your browser\
    \ displays the Wine Binary Downloads page. This page contains links to various\
    \ noncommercial and commercial repositories."
  merge: -1
  img_proc: true
- pgno: 192
