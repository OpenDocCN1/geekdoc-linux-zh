    # Putting It All Together: Streaming Music to Your Private Network


    You can use a multimedia player like XMMS to connect to and listen to an audio
    stream. The steps in this section describe how to do that:


    +   1. **Start XMMS and select the Play Location option by right-clicking anywhere
