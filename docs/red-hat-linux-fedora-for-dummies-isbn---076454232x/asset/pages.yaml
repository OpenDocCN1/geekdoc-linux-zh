    # Introducing encryption and security


    Running a simple web server like the one introduced in Chapter 16 shouldn''t require
    you to make heroic security measures. Serving up static text and graphics doesn''t
    pique the interest of many hackers. However, when you start using the Web to do
    business or process sensitive information, you want to bump up your security.
    You build on the basic web server and create a secure web server.


    Use the Secure Sockets Layer (SSL) protocol to construct a secure web server.
    SSL provides a mechanism that allows your web server to provide protected and
    authenticated connections. Using SSL with Apache allows the web server'
