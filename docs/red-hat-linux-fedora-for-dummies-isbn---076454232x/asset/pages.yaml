- pgno: 20
  md: '# # Introduction


    *Red Hat Linux Fedora For Dummies* is designed to help you install and use Red
    Hat Linux. This book shows you how to do fun and interesting — to say nothing
    of useful — tasks with Red Hat Linux. This book is also designed to be an effective
    doorstep or coffee cup coaster. Whatever you use it for, we hope that you have
    fun.


    # ## About This Book


    This book is designed to be a helping-hands tutorial. It provides a place to turn
    for help and solace in those moments when, after two hours of trying to get your
    network connection working, your dog bumps into the cable and it magically starts
    working.


    **Note:** At press time, Red Hat renamed its Linux product to the Fedora Project.
    Throughout this book, we usually refer to the product as Red Hat Linux. You’ll
    probably see the product referred to as the Fedora Project in the news, on the
    Web, and elsewhere, but you can rest assured that the different terms, as used
    in this book, are referring to the same product.


    We tried our hardest to fill up this book with the things you need to know about,
    such as how to


    +   Install Red Hat Linux

    Get connected to the Internet by using broadband DSL and cable modems or old-fashioned
    dial-up modems

    Get connected to your Local Area Network (LAN)

    Build a simple but effective firewall

    Build Internet and LAN services, such as Web pages and print servers

    Use Red Hat Linux to play CDs and listen to Internet radio stations

    Use the GNOME desktop environment

    Take advantage of useful and usable applications, such as the OpenOffice desktop
    productivity suite, Evolution desktop organizer and e-mail client, and streaming
    multimedia MPlayer'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 2

    Red Hat Linux Fedora For Dummies


    +   *   Work with the OpenOffice desktop productivity suite to satisfy your word
    processing, spreadsheet, and presentation needs

    *   Upgrade your computer and network security

    *   Know where to go for help

    *   Manage your Red Hat Linux workstation


    You see troubleshooting tips throughout this book, and Chapter 18 is devoted to
    the subject. It’s not that Red Hat Linux is all that much trouble, but we want
    you to be prepared in case you run into bad luck.


    The instructions in this book are designed to work with the version of Red Hat
    Linux you find on the companion DVD; we also describe how to download several
    software packages not found on the DVD-ROMs. Feel free to use other versions of
    Red Hat Linux or even other Linux distributions, but be aware that our instructions
    may not work exactly or even at all. Good luck!


    ![](img/8c094d1b36276212c03d10d898508a6e_21_0.png)


    # Foolish Assumptions


    You know what they say about people who make assumptions, but this book would
    never have been written if we didn’t make a few. This book is for you if you


    +   *   **Want to build a Red Hat Linux workstation:** You want to use the Linux
    operating system to build your personal workstation. Surprise! The DVD-ROM in
    the back of this book contains the Red Hat Linux distribution.

    *   **Have a computer:** It’s just a technicality, but you need a computer because
    this book describes how to install Red Hat Linux on a computer.

    *   **Have no duct tape:** You want to put the Red Hat Linux operating system
    and the computer together, and using duct tape hasn’t worked.

    *   **Don’t want to be a guru:** You don’t want to become a Red Hat Linux guru
    — at least not yet.


    However, this book is *not* for you if you’re looking for


    +   *   **An all-encompassing reference-style book:** We simply don’t have enough
    space, or permission from the publisher, to provide a comprehensive range of topics.
    We concentrate on providing help with getting popular and useful stuff up and
    running. We devote more space, for example, to getting your DSL or cable modem
    working than to describing the theory that makes them work.'
  merge: -1
  img_proc: true
