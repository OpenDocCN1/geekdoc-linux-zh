    8. **Enter this command to unpack the Flash Media software:**

    $ \texttt{tar\ xzf\ install\_flash\_player\_6\_linux.tar.gz} $


    The directory install_flash_player_6_linux directory is created, in which the
    Flash plug-in is placed.

    9. **Copy the Flash plug-in to the Mozilla plug-in directory:**

    $ \texttt{cp\ install\_flash\_player\_6\_linux/libflashplayer.so} $

    $ \texttt{/usr/lib/mozilla-*/plug-ins} $


