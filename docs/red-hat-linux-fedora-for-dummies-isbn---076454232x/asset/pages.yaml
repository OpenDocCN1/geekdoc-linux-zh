- pgno: 50
  md: '# ## Chapter 3

    # Ready, Set, Install!


    # ### In This Chapter


    +   - Deciding which Red Hat Linux installation type to use

    - Starting the Red Hat Linux installation process

    - Automatically selecting Linux partitions

    - Configuring your network

    - Configuring your system options

    - Going beyond the point of no return

    - Configuring your graphics system

    - Finishing the installation


    Installing Red Hat Linux 10 isn’t rocket science — it’s more like astrophysics.
    No, no — just kidding. Don’t run — just relax, sit down, grab your favorite drink,
    and contemplate the fun you will have installing Red Hat Linux. After you’re done,
    you will have a powerful computer that’s capable of performing most, if not all,
    of your daily computing chores — all for the cost of this book! That’s pretty
    amazing when you think about it: For a few dollars, you get the same amount of
    operating power that cost megabucks just a few years ago.


    This chapter walks you through the process of installing Red Hat Linux. The process
    involves inserting the companion Red Hat Linux DVD-ROM disc, powering on your
    computer, and answering some questions.


    This book comes with a companion DVD-ROM disc that contains the entire Red Hat
    Linux distribution. The single DVD-ROM replaces several CD-ROMs and reduces the
    need to continually swap CD-ROMs during the installation process; it also makes
    installing the software easier by eliminating the need to find the particular
    CD-ROM that contains the needed package. If your computer can’t handle DVD-ROMs,
    however, you can obtain the Red Hat Linux distribution on CD-ROMs by mailing in
    the coupon in the back of this book.


    The Red Hat Linux installation process has a point of no return. That time comes
    toward the end of the configuration process, after which the disks are partitioned
    and the software is written to your hard drive (see the later section “Installation
    Stage 5: The Point of No Return”). If you stop at or before that point, you save
    whatever operating system (or systems) exists on your computer.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/8c094d1b36276212c03d10d898508a6e_51_0.png)


    # For installation purists only


    You can run the Red Hat Linux installation system from either a graphical or text-based
    interface. If the installation process successfully detects your graphics hardware,
    the graphical method is selected automatically, and that''s what we discuss in
    this chapter. In addition to the ease of using a mouse to point and click, the
    graphical method groups similar configuration choices. For example, the keyboard
    and mouse selections are presented within one window, not two, as in the text-based
    installation.


    The Red Hat Linux installation system can''t use your graphics adapter. You figure
    out this situation when the graphical installation window doesn''t appear; but
    a text-based window does appear; with the text-based system, you use the keyboard
    to enter information and the cursor (arrow) keys to move from step to step. It
    doesn''t happen often any more because the folks at Red Hat have done their homework
    and refined the installation process. However, manufacturers occasionally introduce
    new graphics systems that the installation system can''t use.


    You may have to use the text-based installation, for these reasons:


    +   - Your mother told you never to point and click.


    You can select the text-based installation method by typing **text** at the **boot:**
    prompt.


    # Choosing an Installation Type


    Red Hat provides several installation types to choose from. Although we think
    that you can probably get away with having less space on your system, we decided
    to give you the minimum disk space requirements Red Hat suggests for each installation
    option:


    +   - **Server:** Creates an operating system environment for computers that provide
    services such as hosting Web pages. This installation requires 850MB of free space
    if you want only minimal bells and whistles, at least 1.4GB of free space if you
    want to install all the bells and whistles but not the graphical X Window System,
    and at least 2.1GB to install all the bells and all the whistles and throw in
    the Acme Bell and Whistle Factory (which includes both GNOME and KDE).


    +   - **Custom:** Installs the minimum base of software and requires you to select
    additional services, utilities, and applications. A second option installs everything
    on the companion discs. The former requires at least 475 MB, and the latter, 5.0GB.


    +   - **Upgrade:** Updates the Red Hat Linux software that''s already installed
    on a computer but leaves all existing settings, users, and data alone. You can
    optionally choose to install additional packages.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   - **Personal Desktop:** Installs the software necessary to use your computer
    as a workstation. Applications such as OpenOffice, Mozilla, and Evolution plus
    the GNOME graphical environment give you all the tools you need to enjoy the Internet
    and get your work done. This installation type requires at least 1.7GB of free
    space.


    +   - **Workstation:** Adds software development tools to the Personal Desktop
    installation type. You need at least 2.1GB to use this option.


    ![](img/8c094d1b36276212c03d10d898508a6e_52_0.png)


    The primary difference between the Workstation and Personal Desktop installation
    types is that Workstation installs software development tools and Personal Desktop
    doesn''t. We use the Workstation installation option in this book not because
    we don''t discuss software programming but, rather, because the tools often come
    in handy when installing applications. We encourage you to use the Workstation
    installation type for your Red Hat Linux installations.


    Both the Workstation and Personal Desktop installation types automate otherwise
    horribly complicated decisions that no sane person would want to haggle with,
    such as how to partition your hard drive and select software. The installation
    includes the GNOME graphical user interface (GUI) and all the tools that an average
    computer user (that''s you) needs to survive. If you want software that the installation
    doesn''t provide, you can always add packages later.


    # ## Installation Stage 1: Starting the Journey


    Before you install Red Hat Linux, you need to insert the companion DVD-ROM into
    the DVD/CD-ROM drive and boot or reboot your computer. The instructions in this
    section describe how to start installing Red Hat Linux on your computer.


    This section gets you started with the Red Hat Linux installation process. Use
    these initial steps to start the installation and perform some basic configuration:


    +   1. Insert the DVD-ROM that came with this book and boot (or reboot) your computer.
    Note that if your computer can''t boot from a DVD-ROM (or CD-ROM), you have to
    create a boot floppy and boot from it (refer to Chapter 2 for instructions for
    creating a boot floppy).


    After your computer thinks for a while, the first installation screen appears,
    displaying a welcome message, some options, and the *boot:* prompt.


    +   2. Press **Enter**.


    A series of messages scrolls by, indicating the hardware that the Red Hat Linux
    kernel detects on your computer. Most of the time, particularly with newer systems,
    Red Hat Linux detects all the basic hardware.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 34  Part I: Installing Red Hat Linux


    +   3. **When Red Hat Linux has detected your hardware, the Red Hat installation
    process starts and the Welcome message is displayed onscreen. Click the Next button
    to proceed to the next step.**


    You can view information about Red Hat Linux by clicking the Release Notes button,
    in the lower-left corner of the screen. Additional information about where to
    find more information is displayed on the sidebar on the left side of the window.


    After the Welcome message screen disappears, the Language Selection window appears.


    +   4. **Select a language and click Next.**


    Choose the language you speak or, if you’re feeling adventurous, one that you
    don’t (not recommended).


    The Keyboard Configuration window appears.


    +   5. **Select your keyboard configuration and then click Next.**


    The Mouse Configuration window appears.


    +   6. **Select your mouse (squeak) and click Next.**


    Red Hat generally automatically detects your mouse. However, in case Red Hat fails
    to find your mouse, you can select your mouse manually from the slew of mice you
    see. If you have a PS/2 mouse, all you have to do is select the manufacturer and
    number of buttons. If you have the older style of mouse that connects via a serial
    port, you have to select the manufacturer, number of buttons, and the serial port
    to which it’s connected; you have only four serial ports to select from, and in
    many cases it’s either `ttyS0` or `ttyS1`.


    If you have a 2-button mouse (either serial or PS/2), you can choose to have it
    emulate three buttons by selecting the Emulate 3 Buttons option. You emulate the
    third (middle) button by pressing both mouse buttons at one time.


    +   7. **Click Next.**


    The Red Hat installation system tries to detect and identify your monitor. In
    most cases, Red Hat can make the identification and doesn’t need any input from
    you, so you can skip to Step 11.


    +   8. **If the installation system cannot automatically identify your monitor,
    the Monitor Configuration window appears.**


    The Red Hat installation process detects your video driver hardware and automatically
    selects the best resolution. You can manually configure the video card after the
    installation process finishes. See Chapter 4 for configuration instructions.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# # Chapter 3: Ready, Set, Install!


    We use the word *monitor* generically to refer to both the traditional Cathode
    Ray Tube (CRT) and the modern Liquid Crystal Display (LCD) devices. CRT monitors
    use heavy glass tubes, of course, and LCDs use lighter, thin-plastic panels.


    If your monitor isn’t detected, the screen defaults to the Unprobed Monitor option.
    You can manually select your monitor by choosing from the list of manufacturers
    and their models. If you can’t find your model, your best bet is to select one
    of the generic monitors. For example, select the Generic Laptop Top Display Panel
    1024x768 if you have an LCD display. Alternatively, you can simply select the
    default Unprobed Monitor type; the worst that can happen is that you either have
    to reconfigure the monitor later or live with slightly less than optimal performance.


    +   9. Click the Next button.


    If you selected the unprobed monitor, the Monitor Unspecified dialog box opens.
    Click the Choose Monitor Type button and control returns to the Monitor Configuration
    window, as described in Step 8. Otherwise, you don’t see the dialog box and should
    proceed to Step 10.


    +   10. Click the Proceed button and continue to Step 11.


    Older CRT monitors (not LCD displays) can’t handle resolution rates and scan frequencies
    higher than what they were designed for. A monitor designed for a 640 x 480 resolution
    (and a low scan frequency), for example, can’t display a 2,048 x 1,024 resolution
    (and a high scan frequency). If you try to make the monitor display a higher frequency
    than it’s capable of displaying, the monitor may burst into flames. (We didn’t
    believe this either until we saw a monitor smoking. Hey, at least you get a new
    monitor out of it. Welcome to the 21st century.)


    Modern CRT monitors (not LCD displays), called *multiscanning* monitors, can automatically
    match themselves to a series of scan frequencies and resolutions. Some of these
    monitors are even smart enough to turn themselves off rather than burst into flames
    if the frequencies become too high. Finding the documentation and matching your
    vertical and horizontal frequencies properly is the best way to go (particularly
    with older monitors). If you don’t have this information, try a lower resolution
    first, just to get X Window System running. (LCDs cannot catch on fire in this
    way.)


    +   11. The Installation Type window appears. If you have already installed Linux
    on your computer, however, you’re asked whether you want to upgrade or make a
    fresh installation. Upgrade, if you want; your current software is updated to
    newer versions. This book is oriented toward installing Red Hat Linux for the
    first time.


    See the following section to select your Red Hat Linux installation type, and
    then continue to partition your disk.


    ![](img/8c094d1b36276212c03d10d898508a6e_54_0.png)


    ![](img/8c094d1b36276212c03d10d898508a6e_54_1.png)


    ![](img/8c094d1b36276212c03d10d898508a6e_54_2.png)


    35'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# ## Checking your discs


    Red Hat provides a validation mechanism for checking its DVD-ROM or CD-ROMs. Red
    Hat inserts numeric keys into its discs to help verify that they aren’t corrupted.
    If you enter **linux mediacheck** at the **boot :** prompt, the installation process
    starts up and displays a dialog box. Follow these steps to verify that your DVD-
    ROM (or CD-ROMs) are in working order.


    +   1. Select the **OK** option by pressing the **Enter** key if you want to verify
    that your **DVD** (or **CD**) is okay.


    If you have already verified your media, perhaps you have already checked them
    during an earlier installation — you can select the **Skip** option to return
    to the Red Hat installation process without checking the media.


    The Media Check window opens.


    +   2. If you’re installing Red Hat Linux from a **DVD-ROM** (or set of **CD-ROMs**)
    you have never tested, select the **Test** option and the test starts.


    The media check system displays a progress meter and then shows the result in
    the Media Check Result window when it’s finished. The possible results are **PASS**
    and **FAIL**.


    +   3. Click the **OK** button (the only option) in the Media Check Result window.


    +   4. The **DVD-ROM** (or **CD-ROM**) is ejected after the check is finished.


    If you’re using CD-ROMs, proceed to Step 5. Otherwise, you’re finished.


    +   5. Insert the **second** or **third CD-ROM** and click the **Continue** button
    in the **Media Check** dialog box. **Repeat Steps 2–4** for each CD-ROM. **You’re
    finished after you finish checking the third CD-ROM**.


    Obviously, if the DVD-ROM (or any of the CD-ROMs) fails the test, you shouldn’t
    use it. You should buy another copy of this book. No, no — just kidding. Contact
    the Wiley Media Development department, at MediaDev@wiley.com, to find out how
    to get a replacement DVD-ROM (or CD-ROM).


    # # Installation Stage 2: Slicing and Dicing the Pie


    You must decide where on your hard disk to install Red Hat Linux, a process called
    disk partitioning. Disk partitioning divides a disk into multiple sections, or
    slices. Red Hat Linux is then installed on the partitions. You typically use three
    to seven partitions.


    Red Hat provides automatic and manual methods for creating disk partitions. We
    use the Red Hat automatic method because it’s easy to use. The automatic method
    erases any existing Red Hat Linux partitions, but leaves alone any existing Windows
    partitions. If you don’t have any existing Red Hat partitions or unused space
    on your disk, you have to make some free space. Refer to Chapter 2 for instructions
    on shrinking Windows partitions to make space for Linux.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/8c094d1b36276212c03d10d898508a6e_56_0.png)


    Linux disk partitions are analogous to Windows disk partitions. The well-known
    C: drive is placed on a disk partition. The Linux equivalent is the root ( / )
    partition. The two operating systems use different terminology, and the analogy
    isn’t perfect, although the concept is the same.


    Follow these steps to continue the installation:


    +   1. **Select the Workstation option in the Installation Type window and then
    click the Next button.**

    The Disk Partitioning Setup window appears. The Red Hat Linux installation system
    must partition your hard drive in order to install its software. Partitions divide
    a hard drive into one or more parts. The divisions are used to organize the software
    and data (user files, for example) that comprise the operating system.

    Red Hat provides two partitioning methods: automatic and manual. The manual method
    uses the Red Hat Disk Druid utility. Using the Disk Druid requires you to make
    several decisions to select your disk partitions, so we use the automatic method,
    which is simpler to use. The automatic method is easier to use, and we recommend
    it unless you’re feeling lucky (or want to experiment or have the experience of
    manually partitioning your hard drive).


    +   2. **Select the Automatically Partition option and click the Next button.**

    If you’re using a new disk that has never been partitioned or your existing disk’s
    partition table has become corrupted in some way, a Warning dialog box appears.


    +   3. **Click the Yes button and a new partition table is created. (Selecting
    No stops the installation process and reboots your computer.)**

    The Automatic Partitioning window appears. You have three options:

    *   **Remove all Linux partitions on this system:** This option leaves any Windows
    partitions (FAT, VFAT, and NTFS) unmodified while erasing any existing Linux partitions.
    Use this option if you’re reinstalling Red Hat Linux (in either a dual boot or
    solo configuration).

    *   **Remove all partitions on this system:** This option is the most dangerous
    one because it erases everything on your hard disk. Use this option only if you’re
    absolutely sure that you don’t have, or don’t want to save, anything on your disk.
    Your new Red Hat Linux installation is the only operating system on the hard disk
    if you use this option.

    *   **Keep all partitions and use existing free space:** Use this option if you
    used the nondestructive repartitioning (using FIPFS, Norton Ghost, or PartitionMagic,
    for example) described in Chapter 2 to shrink your Windows partition.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'You can use commercial products, like Norton Ghost 2002, to shrink NTFS partitions.
    Shrinking a Windows partition frees up disk space that you can use to install
    Red Hat Linux. Using this option creates a dual boot configuration if Windows
    already exists on your computer.


    ![](img/8c094d1b36276212c03d10d898508a6e_57_0.png)


    Never select the Remove All Partitions on This System option unless you want to
    erase everything on your disk! Use extreme caution because this action destroys
    all installed operating systems (Windows and Red Hat Linux) and data. You may
    use this option, for example, if your computer came with Windows preinstalled
    and you want to convert it to a Red Hat Linux-only workstation.


    Select the option labeled Keep All Partitions and Use Existing Free Space if you
    want to install Red Hat Linux on extra, unused space on your hard drive (for example,
    if you have shrunk an existing Windows FAT or NTFS partition, as described in
    Chapter 2).


    4. **Select the automatic partitioning option most appropriate for you.**


    If you repartitioned your Windows disk in Chapter 2 to make room for Linux, click
    the button labeled Keep All Partitions and Use Existing Free Space. The Red Hat
    Linux installation system uses the extra space on the disk to install.


    Optionally, click the Remove All Linux partitions on This System button if you’re
    installing Linux over an old Linux installation.


    Optionally, if you want to erase any existing operating system and start fresh
    with Red Hat Linux, click the Remove All Partitions on This System button along
    with all programs and data on the disk.


    5. **(Optional) Select the option labeled Review (and Modify If Needed) the Partitions
    Created, at the bottom of the screen.**


    Selecting this option lets you review your partitions.


    The Warning dialog box opens, informing you about which, if any, partitions will
    be erased.


    6. **Click the Yes button to continue with the installation. Click the No button
    to return to the Automatic Partitioning window in Step 3.**


    7. **If you selected in Step 5 the option labeled Review (and Modify If Needed)
    the Partitions Created, the Partitioning dialog box appears, as shown in Figure
    3-1.**


    If you didn’t select the Review option, proceed to Step 10.


    8. **Review the partitions and modify them, if necessary.**


    The Partitioning window shows you how the Red Hat installation process plans to
    divide the available space on your hard drive into three partitions. (The available
    space is determined by the option you selected in Step 2.) The partitions created
    are *root* (/), *boot* (//boot), and *swap*. (swap is used internally by Red Hat
    Linux and, unlike the other partitions, isn’t accessible by you.)'
  merge: -1
  img_proc: true
- pgno: 58
  md: '![](img/8c094d1b36276212c03d10d898508a6e_58_0.png)


    At this point, you can click the New, Edit, and Delete buttons if you want to
    modify the default disk partitions. You should modify the default partitions only
    if you''re an experienced Unix or Linux user and understand the concept of using
    multiple partitions. We recommend that unless you feel really lucky or are very
    experienced, you let Red Hat do the work here.


    **9. Click the Next button.**


    **10. The Boot Loader Configuration window appears, as shown in Figure 3-2. The
    defaults should work just fine for you, so click Next.**


    The boot loader helps start your operating system when you start your computer;
    if you create a dual boot computer, the boot loader allows you to select one operating
    system or another. The standard Red Hat Linux boot loader is GRUB, a powerful
    system that can do more than just load an operating system. However, the GRUB
    default options should be all you need (and a description of its advanced features
    are beyond the scope of this book).


    If your computer has an NIC (network interface card), Red Hat detects it and the
    Network Configuration window appears, as shown in Figure 3-3. You should proceed
    to Step 1 in the next section and configure your network. However, if you don''t
    have an Ethernet NIC or are using a wireless device that Red Hat doesn''t detect,
    the installation process skips the network configuration and continues at Step
    7 in the following section.


    ![](img/8c094d1b36276212c03d10d898508a6e_58_1.png)


    **Figure 3-1:** The Disk Setup window displays the partitions to be created.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Part I: Installing Red Hat Linux


    ![](img/8c094d1b36276212c03d10d898508a6e_59_0.png)


