- pgno: 285
  md: '# # The Fix Is In: Troubleshooting Your Network


    Your Red Hat Linux machine is the foundation of your network and must be set up
    correctly for anything to run. If it isn’t working, or if you have an unusual
    setup (or if Murphy is in a bad mood), you can check for several different causes.


    We use the Red Hat Linux network as the troubleshooting example in this chapter.
    The Red Hat Linux network is one of the more difficult things to set up correctly
    because it depends on not only your Linux computer but also other computers. Suppose
    that your Red Hat Linux network isn’t working. Use the following sections of this
    chapter as a simple fault tree that you can follow to troubleshoot your network.


    ![](img/8c094d1b36276212c03d10d898508a6e_285_0.png)


    See Part V for insights into other problems. Chapter 17 describes how to find
    information about your Red Hat Linux computer. Chapter 20 also points out where
    you can get help and solve some simple, frequently encountered problems. Chapter
    21 describes several security fixes.


    # ## Introducing Fault Trees


    Troubleshooting is more of an art than a science. Sometimes, you can easily see
    what the problem is and how to fix it. At other times, that’s not so easy. The
    degree of difficulty you have in fixing a problem depends on how complex the problem
    is and how well you know your stuff. Obviously, the better acquainted you are
    with computers and Linux, the better you are at troubleshooting.


    Every problem has a solution. Computers are cause-and-effect-based machines. When
    something breaks or doesn’t work, there’s always a reason. The reason may not
    be easy to find, but it exists.


    How do you find the cause? That’s a million-dollar question. Getting a million
    bucks isn’t easy unless you’re willing to grind your teeth, plot against your
    fellow contestants for weeks on a remote island, purchase 10 million PowerBall
    tickets, or — believe it or not — work hard and work smart. Some people are willing
    to eat rats for the chance or are lucky enough to win the lottery, but most just
    have to work hard. Oh, well.


    Working hard is conceptually easy, but how do you work smart? This concept is
    where the idea of the fault tree comes into play. The *fault tree* is a conceptual'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'aid that helps you to eliminate all but the real cause of your problem. The
    fault tree looks like an upside-down tree, where the trunk of the tree represents
    the fault, or problem. The ends, or leaves, of the branches represent all the
    possible causes. After that''s done, solving the problem is virtually guaranteed.


    For example, Figure 18-1 shows part of a fault tree that points out which major
    subsystems you should examine. To find the solution to a problem, you have to
    systematically identify what''s working. You work your way to what''s not working
    and then when you find it, you usually solve your problem. The fault tree simply
    helps to formalize the process of problem solving.


    ![](img/8c094d1b36276212c03d10d898508a6e_286_0.png)


    Here are some possible faults:


    +   1. The first branch on the left involves problems with the physical connection.
    Do you have a network adapter? Is the cable connected properly to the adapter?
    Do you have a break in the cable? If so, you have to fix or replace the cable.

    2. The second branch deals with the network interface configuration. Have you
    configured the IP address for your Ethernet adapter correctly? If so, is the netmask
    correct?

    3. The third branch helps you to decide whether the problem exist with the network
    routing. Can your network packets be directed toward the correct network?


    The fault tree helps you to break down any big problem into several simpler ones.
    By eliminating each simple problem one by one, you should eventually locate the
    root cause.'
  merge: -1
  img_proc: true
- pgno: 287
