- pgno: 336
  md: '# Appendix A


    # Red Hat Linux Administration Utilities


    +   *In This Appendix*


    ▶ The Red Hat system settings

    ▶ The Red Hat server settings

    ▶ The Red Hat system tools


    Red Hat, Inc., does what many other Linux distributions do: It packages the Linux
    kernel with GNU utilities and other applications to make using Linux easy and
    convenient. Some distributions, like SELinux, customize Linux to perform specific
    tasks, such as provide a secure platform. Most distributions, however (like Red
    Hat) provide general-purpose Linux configurations you can use to create servers
    or desktop workstations.


    Red Hat tries to set itself apart from the pack by creating utilities to make
    your job easier. For example, it has created numerous systems administration utilities
    that are integrated, easy to use, and quite powerful. These utilities are one
    reason that Red Hat wins the market share competition. This appendix outlines
    the Red Hat Linux configuration utilities.


    The lists throughout this section describe each of the utilities available on
    a Red Hat Linux computer. The lists are organized according to the menu on which
