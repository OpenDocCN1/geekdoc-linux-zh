    your PC. Using the CD player described in Chapter 11 is much easier. However,
    listening to your multimedia streaming server is useful and interesting when it’s
    done across a network.


    # Streaming on Your Private Network


    The preceding section describes how to broadcast music on and to the computer
    you’re sitting at. We extend that process in this section to encompass your private
    network. You create a jukebox of sorts that you can listen to from any computer
    on your LAN.'
