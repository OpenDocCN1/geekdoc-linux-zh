- img_proc: true
  md: 'Bump map also has a number of additional options. There are X Offset and Y
    Offset, which are useful for positioning the embossed one. There is also the Waterlevel
    option, which is only useful if the embossing image has an Alpha channel. In this
    case, the embossing is applied as a function of the alpha and WaterLevel values.
    Low values of alpha diminish the embossing effect, and high values increase it.
    This is modulated by the value of WaterLevel. High values of WaterLevel accentuate
    the Alpha channel, and low values diminish it.


    The Ambient option in the Bump map dialog controls the relative strength of the
    directional light source (refer back to Figure 8.10). An ambient light source
    is one that shines equally from all directions. This is the kind of illumination
    that is useful in a photography studio, where all shadows on a subject must be
    eliminated. A strong ambient light source cancels the effect of a directional
    one. A directional light source creates shadows because it illuminates a scene
    from a single direction, but the more ambient light there is, the weaker the shadowmaking
    effect of the directional light becomes. Thus, you can use the Ambient option
    in the Bump map dialog to control the relative amount of directional light, and
    in so, control the strength of the shadows.


    Multiplying an embossing map with a darker image produces a result that is darker
    than either of the first two. This is a natural result of image multiplication
    (the description of the Multiply blending mode in Section 5.6). The Compensate
    for Darkening checkbox reduces this effect. The Invert Bumpmap checkbox simply
    inverts the relationship of shadow and light in the embossing map.


    Finally, there are three radio buttons that control the multiplication process.
    These are labeled Linear Map, Spherical Map, and Sinusoidal Map. The Linear Map
    option does draw a straight multiplicity of the embossing map with the image.
    The Sinusoidal and Spherical Map options, however, act somewhat like the Curves
    tool (see Section 6.2.1). That is, the effect of the embossing map is warped around
    a curve. The sinusoidal curve provides more contrast to the midtone embossing
    values and the spherical curve to the shadow and highlight values. This may sound
    a little complicated, but it isn''t. Just play around them, and you''ll see right
    away what they do.


    # 8.4 SHADOWS


    A shadow is just a dark silhouette of an object, but with a somewhat fuzzy edge
    to account for the diffraction of the illuminating light source. Furthermore,
    depending on the location of the source, a shadow'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'is somewhat displaced with respect to the object. You can construct very convincing
    rendering tools in GIMP, and this section explains how to make them.


    To make a shadow for an image object you must have a selection of it. The following
    describes the steps needed to create the selected region''s shadow:


    +   1. Cut the selected region by typing c-v in the image window. It places the
    selection into the default buffer.


    +   2. Create a new transparent layer by clicking on the New Layer button in the
    Layers dialog and choosing the Transparent option.


    +   3. Paste the contents of the default buffer by typing C-v in the image window.
    This places the paste into a floating selection. Anchor the float to the new layer
    by clicking on the Anchor button in the Layers dialog.


    +   4. Duplicate the new layer by clicking on the Duplicate Layer button in the
    Layers dialog. The duplicated layer is placed above the original layer in the
    layer stack.


    +   5. Name the duplicated layer Object and the original layer Shadow.


    +   6. Make the Shadow layer active by clicking on its thumbnail in the Layers
    dialog, toggle on the Keep Trans checkbox and use the Bucket Fill with its Threshold
    to 255 to fill the image object with black or some other appropriate, dark color.


    +   7. Toggle off the Keep Trans. checkbox in the Layers dialog, use Gaussian
    Blur (IIH) found in the Image:Filters/Blur menu to blur the Shadow layer, and
    use Offset from the Image:Transforms menu to shift it.


    +   8. Use the Opacity slider in the Layers dialog to give the shadow an appropriate
    degree of transparency.


    This procedure is often referred to as making a drop shadow.


    An example of creating a drop shadow is now presented using the preceding recipe.
    Figure 8.16(a) illustrates a photo of a daisy. Using techniques from Chapters
    3 and 4 a selection of the daisy is made and, as shown in Figure 8.16(b), this
    is used to cut away the daisy''s background. (Note: the cut produces a transparent
    background only if the original image layer has an Alpha channel. For more on
    Alpha channels see Section 4.2.1.) The Layers dialog in Figure 8.16(c) shows that
    the Daisy layer has been duplicated and that the lower layer has been labeled
    Daisy Silhouette.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_289_0.png)


    The remaining steps in the creation of the shadow are now easy. The Daisy Silhouette
    layer is filled with black using the Bucket Fill tool (don''t forget to set Threshold
    to 255 in the Bucket Fill dialog). The blurring is performed with any of the blur
    functions from the Image:Filters/Blur menu (but make sure that the Keep Trans.
    button in the Layers dialog is toggled off before applying one). Here, Gaussian
    Blur (IIR) is used with a radius of 20. This is followed by using Offset, which
    can be applied by typing C-s-o in the image window. The offset parameters are
    set to 15 for both the X and Y components, and the Wrap-Around radio button is
    toggled off. The result is shown in Figure 8.17(a). Figure 8.17(b) and (c) show
    the dialogs for the Gaussian Blur (IIR) and Offset filters used in this example.


    +   - Gaussian Blur (IIR) and Gaussian Blur (RLE) produce exactly the same results.
    Gaussian Blur (RLE) runs faster on images that have broad, constant-valued pixel
    regions because it exploits a compression technique known as run length encoding.
    For photographs Gaussian Blur (RLE) provides no advantage and might even run slower
    than Gaussian Blur (IIR).


