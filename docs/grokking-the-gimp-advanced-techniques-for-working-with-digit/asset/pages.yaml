    # 1.5 UNDOING AND REDO


    An extremely useful feature of the GIMP is its ability to perform multiple undos
    and redos. The Undo function is found in the Image:Edit menu, as is the Redo function.
    These two functions are so useful and are often employed that you will want to
    immediately memorize their keyboard shortcuts. These are C-z for undo and C-r
    for redo.


    The number of undos that can be performed in the GIMP is controlled by the Interface
    branch of the Toolbox:Preferences dialog, and the Preferences dialog is found
    in the Interface branch highlighted. Figure 1.12 illustrates. The default value
    for the number of undos is 5, but for the size of image I work with and on my
    computer, I have 25 levels of undo. If I were working with large images with many
    layers, this would not be possible, and I would change the number of undos to
    a lower value. See page 8 in README for more on how to budget your RAM.


    An amazing feature of the GIMP is the Undo history found in the Image:View menu.
    When invoked, this function displays a palette of thumbnails in the state of operations
    performed on your image. Figure 1.13 illustrates such a sequence. Figure 1.13(a),
    (b), and (c) show the successive application of a selection, followed by a color
    fill. Figure 1.13(d), (e), and (f) show the respective entries in the Undo history
