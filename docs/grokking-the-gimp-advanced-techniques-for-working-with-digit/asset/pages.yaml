    arrow icon raises the active layer, and Shift-clicking raises the layer to the
    top of the stack. Note that if the lowest layer of the raised does not have an
    alpha channel, it cannot be raised.


    # 2.3.3 LOWERING LAYERS


    The Lower Layer entry in the Layers menu shifts the active layer down in the layer
    stack, and Layer to Bottom moves it to the bottom of the stack. The same functions
    are provided by the downward-pointing arrow icon in the button bar. Clicking on
    the icon lowers the active layer once, and Shift-clicking puts it to the bottom
    of the stack. Note that if the lowest layer of the stack does not have an alpha
    channel, another layer cannot be made lower than it.


    # 2.3.4 DUPLICATING LAYERS


    The active layer can be duplicated by clicking on the Duplicate Layer entry in
    the Layers menu. The duplicated layer is positioned just above the active layer.
    This function is also provided by the button depicting the two sheets of paper
    in the button bar.


    # 2.3.5 DELETING LAYERS


    The active layer can be deleted by selecting the Delete Layer entry from the Layers
    menu. This function is also provided by the button depicting a Trash Can.


