    # 2.3.2 RAISING LAYERS


    The order of layers in the Layers Palette controls how the layers are perceived
    in the image. The Raise Layer entry, shown in Figure 2.5(c), shifts the active
    layer by one, if possible, in the layer stack. The Layer to Top puts the active
