- img_proc: true
  md: '# Untitled-7.0 (RGB) 100%


    ![](img/32c07c3b65137f501f1232a822a70623_280_0.png)


    Figure 8.6: Creating Text to be Used in Gradient Rendering Example


    Before anchoring, however, the text is centered.  This is accomplished by typing
    c-x and c-v in the image window.  This trick cuts and repastes the floating selection,
