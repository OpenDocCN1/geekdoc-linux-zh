  md: '# 7


    # COMPOSITING


    Compositing means many things to many people. Whole books have been written on
    this one topic. Broadly speaking, compositing is the technique and the art of
    piecing together image parts collected from multiple sources to make a new single
    whole. If the image is intended to be photo-realistic, a scene that could have
    really existed, the result is called photo-montage. On the other hand, if the
    objective is to combine images whose juxtaposition communicates a new idea, the
    result is called collage.


    The main differences between the two are that, for photo-montage, lighting and
    color matching are very important to the success of the composition. Differences
    of saturation and value between image elements can ruin the illusion of a montage,
    as can obvious inconsistencies in lighting. It is also important to pay attention
    to other visual cues; however, the objective of this chapter is not to provide
    a complete discussion of these topics. Rather, the goal is to demonstrate the
    use of the GIMP in several projects and show how the GIMP''s tools can be used
    to solve collage and photo-montage problems.


    Regardless of whether a project is photo-montage or collage, the main elements
    of compositing consist of selections, copy and paste operations, and positioning
    of image elements. The finer aspects require blending, color matching, and general
    attention to detail. Most of the GIMP skills needed for compositing have already
    been discussed in previous chapters. Indeed, this chapter presumes the reader
    is familiar with concepts presented in earlier chapters. The projects presented
    here are not described in minute detail. Rather when techniques that have been
    described in earlier chapters'
  merge: -1
  pgno: 235
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_236_0.png)


    are required, the reader is referred to the appropriate section of the book. Although
    this chapter is mostly project-oriented, some new GIMP tools are each of them
    pasted from their images. Also introduced.


    # 7.1 PROJECT 1: FISH ON HOLIDAY!


    A primary component of compositing is the assembling of different image elements
    and the subsequent positioning and scaling required to achieve the final desired
    composition. Assembling the image components consists of selecting them from their
    respective images. The selections are made using combinations of techniques from
    Chapters 3 and 4.


    Because I''m often not sure exactly how I''ll use selected image components in
    a project, first like to assemble all of them into a kind of clip book. A clip
    book is just a single image consisting of a layer for each image component. This
    makes an image palette from which the various components can be copied and then
    pasted into the target composition.


    Figure 7.1(a) shows the image clip book used in this project. Each sea creature
    was obtained from a separate image source using a combination of selection and
    masking techniques. The Layers dialog in Figure 7.2(b) shows that each of the
    six separate images is contained in a separate layer. The project goal is to use
    these reef inhabitants to populate an ecosystem not normally their own. The composition
    places our denizens of the deep among the palms of a tropical island beach scene.
    Sometimes even fish need a holiday...'
