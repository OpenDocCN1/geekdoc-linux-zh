- img_proc: true
  md: 'This example shows how using Threshold can produce a selection much more quickly
    than a Bezier Path tool. Making a Bezier path would have required placing and
    refining a large number of control points. In contrast, the procedure employed
    with the Threshold tool required some experimentation with values in the tool
    dialog, followed by some rough selections with the Lasso and some painting with
    the Paintbrush.


    A key element to making the Threshold tool work efficiently is finding a reasonable
    range of values in the tool dialog''s histogram. The example used in this section
    shows that it is not necessary to find a perfect mask. Rather, the goal is to
    find a mask that separates the subject from the background enough so that tools
    like Lasso and Paintbrush can be used easily clean up the defects.


    The range of values used to create the mask in this example is shown in Figure
    4.44(b). It is important to understand that this result was obtained by using
    a trial-and-error, experimental approach. Several contiguous regions of the histogram
    were swept out by the mouse, and each time parts of the image that mapped to white
    and black were observed. A tip for finding regions is to examine the ranges of
    values supporting the main bumps in the histogram. These are usually associated
    with major image features, and it is often the case that one of these bumps is
    the solution to our search. When a reasonable range has been discovered, the data
    entry boxes can be used to refine the end points of the range.


    Although the Threshold tool is not a panacea and isn''t guaranteed to work, it
    is often successful. It is worth trying to apply the Threshold tool before launching
    into a long selection process with the Bezier Path tool. Some good examples of
    using Threshold to make selection masks are illustrated in Sections 7.3 and 7.4.


    # THRESHOLD TOOL VERSUS THE MAGIC WAND


    The Magic Wand, presented in Section 3.1.1, is very similar in principle to Threshold
    but not nearly as effective. As already described, the Magic Wand works by choosing
    a seed pixel in the image and interactively selecting a threshold that controls
    how many pixels around the seed are included in the selection. Thus, if the value
    of the pixel at the seed is S and the value of the threshold is T, then the range
    of pixel values that are included in the selection is [S-T, S+T].


    Now suppose that the range of pixel values that separates the subject from the
    background is [R1, R2]. To make the Magic Wand work on this image, the threshold
    must have T=(R2-R1)/2 and the seed must have the value S=(R1+R2)/2. The problem
    then is finding a pixel in the subject having the correct seed value, when experimenting
    with threshold values, will produce an acceptable result. This is impractical
    for'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'several, the main difficulty being that there is no way to use the visual feedback
    from several trials of the Magic Wand to discover a more refined solution. On
    the other hand, Threshold requires only the end points of the range be specified,
    so it''s much better adapted to experimentation. It is easy to try several contiguous
    value-regions, and the visual feedback from this is useful for improving the search.
    In addition, the histogram in the Threshold dialog provides important clues as
    to which regions be most useful.


    Finally, the algorithm using the Magic Wand is slow; for each change in the threshold
    value, it must recursively grow the selected region around the seed. In comparison,
    the algorithm for Threshold is very fast, but it must only compare each pixel
    in the image with a threshold.


    # THRESHOLD AND DECOMPOSE


    In the previous sections, Threshold was applied directly to the image. However,
    this tool can be more effective when applied to an image color component. The
    function Decomposition, found in the Image:Image/Mode menu, can be used to separate
    an image into its RGB and HSV components. When the decomposition is RGB, Decomposition
    creates three grayscale images containing the red, green, and blue channels of
    the image. For HSV, three grayscale are also created, but now they represent the
    hue, saturation, and value components of the image (See Chapter 5 for an in-depth
    decomposition of the relationship between an image and its RGB and HSV components).


    ![](img/32c07c3b65137f501f1232a822a70623_153_0.png)


    Figure 4.49(a) illustrates an image of a flower, 4.49(b) shows the Decomposition
    dialog. Either RGB or HSV decomposition of the image can be performed by clicking
    on the appropriate radio button. The CMY decomposition is not useful because it
    produces results that are identical to RGB when used with the Threshold tool.
    CMYK may produce interesting results, but only RGB and HSV are discussed here.


    Figure 4.50(a), (b), and (c) show the red, green, and blue components of the flower
    shown in Figure 4.49(a). Figures 4.50(d), (e), and (f) show the hue, saturation,
    and value components,


    Note. Note for each of the components, the relationship between the flower and
    its background is different. For example, the flower in both the red component
    and the saturation component seems to be separated from'
