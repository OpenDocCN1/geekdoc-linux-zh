    to accentuate the effect.


    ![](img/32c07c3b65137f501f1232a822a70623_226_0.png)


    **Figure 6.33: Illustrating the Effect of Applying Unsharp Mask**


    Note that a light in the sharpened result (see Figure 6.33(b)), there is a light
    halo on the right side of the edge and a deep shadow on the dark side of the edge.
    This corresponds to the discussion of the red curve in the lower graph of'
