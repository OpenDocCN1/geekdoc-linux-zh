    be seen, the mask has an unpleasant, hard, and aliased edge. This can be softened
    by blurring the mask. Figure 4.31(c) shows the result of applying the Gaussian
    Blur (IR) filter to the mask. The filter dialog is displayed in Figure 4.31(b),
    which shows the choice of blur radius. In general, a small radius produces an
    aliasing effect, and a large blur radius creates a feathering effect. A blur radius
    of 1 was used for this example.


