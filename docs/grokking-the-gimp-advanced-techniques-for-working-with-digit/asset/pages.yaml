  md: '# COLORSPACES AND BLENDING MODES


    It is amazing that almost every color we see can be decomposed into a mixture
    of just three primary colors. Most children learn this at school and know that
    the primary colors are blue, yellow, and red. Using finger paints, kids can experiment
    making the so-called secondary colors green, orange, and purple. If hearing worked
    this way, every musical note could be decomposed into a sum of just three tones.
    Three tones might make a nice guitar chord, but it''s not enough to rock-and-roll.


    The interesting fact that three colors suffice is due to the way human vision
    functions. There are three different types of colors in the eye (red, green, and
    blue); this accounts for only three colors being needed. The fact that all the
    colors can be reproduced by mixing only three is extremely useful. It is like
    an alphabet. With a small collection of letters, any word can be made and any
    meaning can be conveyed. The lesson is the same for color. With only three color
    phosphors a computer monitor can, in principle, express any color; with only three
    color inks, in principle, a printer can print any color.


    There are some practical limitations to the concept of reproducing all colors
    with only three primaries. However, without going into more detail, it suffices
    to know that the set of colors that can be made by adding different amounts of
    three primaries is called a colorspace. The shape of the space defined in this
    is a cube.


    In principle, the three primaries used to produce a colorspace are not unique.
    In theory, any triple of independent colors can be used to decompose a colorspace.
    However, in practice, colorspaces created by two different sets of primaries are
    not identical. Typically, there is a part of the color range of one space that
    cannot be reproduced by the other.'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'The best choice of primaries usually depends on the type of physical device
    used to create the color. Monitors use red, green, and blue phosphors to create
    a colorspace called RGB. Printers use cyan, magenta, and yellow inks and work
    in a colorspace called CMY. It is the physical way colors are combined that explains
    the two spaces. Monitors emit light, whereas inks only reflect light. When we
    shine a white light on ink, what we see is the color component of white that is
    reflected and not absorbed by the ink.


    Knowing about colorspaces is important in the GIMP for several reasons. To effectively
    correct color in an image requires some notions about how colors interact. Furthermore,
    looking at different color components of an image can often be useful for making
    selections and masks.


    This chapter is composed of two main parts. The first part begins with a tutorial
    on two colorspaces: RGB, HSV, and CMYK. The RGB space is discussed in detail,
    and this is followed by a description of the relationship between the RGB and
    HSV spaces. HSV is a more perceptually useful space than RGB and finds many uses
    in the GIMP. Although the GIMP is not CMYK-capable, this pre-press colorspace
    is also discussed. Its benefits and drawbacks are described and its importance
    to pre-press is explained.


    The second part of the chapter presents transparency and the GIMP''s 16 blending
    modes from a colorspace perspective. Blending modes are powerful tools for combining
    colors between layers. You can also use them to control how the painting tools
    apply color. The colorspace presentation in the first part of this chapter will
    be very useful in understanding how these modes work. The final section of this
    chapter presents some practical uses of the blending modes.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# 5.1 THE RGB COLORSPACE


    The RGB colorspace is important to us because it is what we see when we look at
    a color monitor. The monitor mixes different amounts of red, green, and blue primaries.
    Because of this, the colors that can be seen on a computer monitor can be represented
    as triples of numbers or as vectors in a three-dimensional cube. The amount of
    each primary contained in a color can be represented by a number in a fixed range.
    The GIMP uses 8 bits per primary channel, the range per primary is 0 to 255 (2⁸=256).
    Here, 0 means no primary is used and 255 means there is as much primary as the
    monitor can produce. Although there are issues with white balance, calibration,
    and human visual perception, it is presumed that the three primaries combined
    at full strength produce white and the three combined at zero strength produce
    black. No deeper than that of the monitor when turned off.


    When it is useful to talk about colors in numeric terms, as is in Chapter 6, which
    discusses color correction, we will use a special notation to designate colors.
    For example, the purple of a red at 172, a green at 83, and a blue at 232 will
    be denoted 172⁸83³232². This color is illustrated in Figure 5.1, which shows how
    the color is composed using the Active Color Selection tool. This tool is opened
    by clicking on the Active Foreground Color or Active Background Color patches
    in the toolbox. The tool dialog can be used to display RGB colors. These are dialed
    using the sliders or can be entered numerically. The selected color appears in
    a patch at the upper right of the dialog. What we have here is digital finger
    paint!


    ![](img/32c07c3b65137f501f1232a822a70623_159_0.png)


    As you will see later in this chapter, it is useful to think of the triples formed
    by the primaries as a color cube where each of the primaries forms one of the
    principle axes. The RGB color cube is illustrated in Figure 5.2. Each axis of'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'the cube represents values of red, green, or blue in the range [0,255]. The
    red axis, labeled R, shows the associated color scale neith it. The green and
    blue axes are illustrated similarly. As mentioned earlier, 0 means that the monitor
    does not emit the primary color and 255 means that it emits the maximum. Values
    between 0 and 255 yield gradations in the color''s intensity.


    ![](img/32c07c3b65137f501f1232a822a70623_160_0.png)


    R: red

    G: green

    : blue

    : cyan

    M: magenta

    Y: yellow

    W: white


    Figure 5.2: The RGB Color Cube


    As the word colorspace implies, colors act like vectors. They can be combined
    by addition and subtraction to obtain other colors in the cube. Thus, the origin
    of the cube, or 0° 0° 0°, represents the total absence of color, which is black.
    The far corner from the origin is the sum of the highest intensities of red, green,
    and blue, or 255° 255° 255°. This produces the white color, which is why this
    color of the cube is labeled W in Figure 5.2. The other corners of the cube represent
    the primary and secondary colors. We''ve already encountered red, green, and blue.
    The remaining three are cyan, magenta, and yellow. From the labels in Figure 5.2,
    it can be seen that adding 255 to 255 makes 255° 255° 0°, adding 255 to 255 makes
    255° 0° 255° or magenta, and adding 255 to 255 makes 0° 255° 255° or cyan.


    Note that the main diagonal of the RGB cube is illustrated in Figure 5.2 as a
    line drawn between the black origin at 0 and white at W. This line represents
    the colors in the RGB cube that consist of equal amounts of red, green, and blue.
    All the points on this line are gray. The closer to the origin, the darker the
    gray; the closer to W, the lighter. It is for this reason that the main diagonal
    of the RGB cube is referred to as the neutral axis. Grays are neutral because
    they prefer no hue; they contain equal quantities of red, green, and blue.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 5.2 The HSV Colorspace


    The perception of color and our way of talking about it in everyday life is not
    well served by the RGB colorspace. If we''re thinking of repainting the walls
    of the living room, for example, we usually think about what shade of color it
    should be, how bright we want it, and whether it should be pastel or vivid.


    Typically, the first thing we usually notice about a color is its hue. Hue describes
    the shade of color and where that color is found in the color spectrum. Red, yellow,
    and purple are words that describe hue. Figure 5.3 illustrates the range of hues,
    H, as a circle represented by values from 0 to 360. The reasons for this will
    become clear shortly.


    ![](img/32c07c3b65137f501f1232a822a70623_161_0.png)


    The next most significant aspect of color is typically the saturation, S. The
    saturation describes how pure the hue is with respect to a white reference. For
    example, a color that is all red and no white is fully saturated. If we add some
    white to the red, the result becomes more pastel, and the color shifts from red
    to pink. The hue is still red but it becomes less saturated. This is illustrated
    in the vertical bar of Figure 5.3. Saturation is a percentage that ranges from
    0 to 100. A pure red that has no white is 100% saturated.


    Finally, a color also has a brightness. This is a relative description of how
    much light is coming from the color. If the color reflects a lot of light, we
    would say that it is bright. Imagine seeing a red supercar during the day. Its
    colors look bright. Compare this with the perception of the car as night is falling.
    We can see that the car is red but it looks duller because ambient illumination
    is'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'reflecting light less into the eye. Light less means the color looks darker.
    In the most important measure of brightness is measured by a quantity called value.
    However, there are also other measures of brightness that will be introduced shortly.
    For the moment, the horizontal bar in Figure 5.3 illustrates a range of red values.
    Value, like saturation, is a percentage that goes from 0 to (100). This can be
    thought of as the amount of light illuminating a color. For example, when the
    hue is red and the value is high the color looks bright. When the value is low
    it looks dark.


    Thus, saturation, and value are like an alternative colorspace. Any color can
    be decomposed into these three components, and similar to RGB, it is possible
    to represent this space as a cube. Figure 5.4 illustrates the result of using
    Image:Image/ode/Decompose on the color image in Figure 5.4(a). Choosing the HSV
    option in the Decomposition dialog produces the hue, saturation, and value decomposition
    shown in Figure 5.4(b), (c), and (d). It is interesting to note that hue rarely
    changes much. It is almost constant over broad regions of the image. For example,
    although there is significant detail in the saturation and value components of
    the key, the hue is uniform there. Of the three, it is the value component that
    is the most detailed.


    ![](img/32c07c3b65137f501f1232a822a70623_162_0.png)


    ![](img/32c07c3b65137f501f1232a822a70623_162_1.png)


    ![](img/32c07c3b65137f501f1232a822a70623_162_2.png)


    ![](img/32c07c3b65137f501f1232a822a70623_162_3.png)


    Figure 5.4: Decomposing a Color Image into its HSV Components'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'Because colors are created on the monitor using mixes of red, green, blue,
    it is useful and instructive to see how the HSV colorspaces live inside of the
    RGB cube.


    # 5.3 RELATING HSV TO RGB


    To understand the HSV and RGB colorspaces, it helps to understand their relationship.
    A very useful exercise is to identify the parts of the RGB cube that correspond
    to surfaces of constant hue, saturation, and value.


    We begin by better defining brightness. This term was introduced in the previous
    section, and it is a measure of the visual perception of how much light an area
    is emitting. A lamp with a variable control switch allows the level of brightness
    to be changed. Turning the lamp increases our perception of brightness. Note that
    the notion of brightness does not depend on the color of the light. It makes much
    sense to talk about brightness of a red lamp as it does a white one.


    A color monitor is just a collection of thousands of lamps (that is, pixels) that
    emit red, green, and blue light. Because each of the lamps can be independently
    controlled, the total brightness of an area on the monitor is the sum of brightness
    from each color. Colors of equal brightness in the RGB cube, for those whose three
    color components sum to the same value. For a particular level of brightness,
    this represents a plane perpendicular to the neutral axis (that is, R+G+B=constant).
    Figure 5.5 shows three examples of planes perpendicular to the neutral axis in
    the RGB cube. The cube in Figure 5.5(a) shows the darkest plane, the cube in Figure
    5.5(c) shows the brightest, and the cube in Figure 5.5(b) a plane of intermediate
    brightness. Note how the colors in each plane seem about equally bright. The three
    cubes in the figure show planes at 25, 50, and 75% brightness. Pure white and
    pure black have a brightness of 0% and 100%, respectively, and consist of single
    points in the cube.


    There are many concepts closely related to brightness and that have various useful
    properties. Brightness is formally defined to be (R+G+B)/3 ; it is a physical
    property of color and does not respond well to human color perception. For this
    reason, brightness is not used in the GIMP. However, the GIMP does use


    +   - brightness, L=[max(R,G,B)+min(R,G,B)] / 2


    +   - value, V=max(R,G,B)


    +   - luminance, Y=0.30 R + 0.59 G + 0.11 B'
  merge: -1
  pgno: 163
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_164_0.png)


    ![](img/32c07c3b65137f501f1232a822a70623_164_1.png)


    (a)


    (b)


    ![](img/32c07c3b65137f501f1232a822a70623_164_2.png)


    Figure 5.5: Planes of Constant Brightness in the RGB Cube


    Luminance is the representation of brightness that corresponds best to human perception
    because the weightings 0.30, 0.59, and 0.11 most closely match the sensitivity
    of the eye to red, green, and blue.


    Figure 5.6 shows how the different definitions for brightness project onto the
    neutral axis. The figure shows the position in the RGB cube of a representative
    color, 220°60°120°, and the locations on the neutral axis corresponding to the
    value, L'', the lightness, L, and the luminance, Y. As can be seen from Figure
    5.6, the value is the brightest. The luminance and the lightness are variable
    and either one can be the darkest depending on the choice of the RGB triple.


    Relating HSV to RGB 153'
  merge: -1
  pgno: 164
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_165_0.png)


    Figure 5.6: Different Projections onto the Neutral Axis


    Next, define saturation. The definition of saturation is related to that of brightness.
    Saturation is the relative colorfulness of an area with respect to its brightness.
    What is colorfulness? An answer can be given in the context of the RGB cube and
    the neutral axis. As already noted, the neutral axis is the diagonal in the cube
    going from 0°0°0° to 255°255°255°, and consists of black, white, and the grayscale
    between them. Thus, in the usual sense, this axis has no color (that is, hue).
    The colorfulness of any point in the RGB cube, then, is proportional to its perpendicular
    distance to the neutral axis. Points closer to the axis are less colorful (that
    is, closer to gray) and those that are further away are more colorful. The saturation,
    then, of a point in the RGB cube is the ratio of its colorfulness to its brightness.


    This means that surfaces of constant saturation in the RGB cube are centered around
    the neutral axis. Figure 5.7 shows two instances of the RGB cube. The cube in
    Figure 5.7(a) shows the cone corresponding to 20% saturation and that in Figure
    5.7(b) to 70% saturation. Note that the colors on the rightmost cone seem more
    vivid because they are more saturated. The colors of the leftmost cone are much
    paler because their colors are more neutral. When a color is more neutral we call
    it pastel.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_166_0.png)


    Figure 5.7: Cones of Saturation in the RGB Cube


    Finally, the definition of hue is related to what we colloquially think of color.
    The hue of a point in the RGB cube is defined to be its angular position around
    the neutral axis. Looking at the corners of the RGB cube shown in Figure 5.2,
    we can see that red, yellow, green, cyan, blue, and magenta are distributed equally
    in angles around the neutral axis. Thus, the wedge defined by the neutral axis
    and any point on the surface of the cube is a plane of constant hue.


    Figure 5.8 illustrates three instances of the RGB cube with different wedges of
    constant hue. Because hue is a function of angle, its range is from 0 to 360 degrees.
    The red corner of the cube is defined to be the hue at 0, which, forcibly, is
    the hue at 360. This hue is shown in Figure 5.8(b). The cube in Figure 5.8(a)
    shows a hue of 330, which is purple, and that in Figure 5.8(c) a hue of 30, which
    is orange. Note that although the hue of each edge is constant, the brightness
    and saturation vary over the range of possible values.


    Figure 5.9 summarizes the relationship between RGB and HSV. Although, the neutral
    axis represents brightness and not value, I will often abuse this notion and refer
    to it as the value axis. The model shown in Figure 5.9 will be useful for understanding
    the explanations of the color blending modes described later in this chapter.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_167_0.png)


    Figure 5.8: Wedges of Constant Hue in the RGB Cube


    ![](img/32c07c3b65137f501f1232a822a70623_167_1.png)


    Figure 5.9: The HSV Coordinates in the RGB Cube


    With the HSV coordinate system in mind, several observations can be made about
    regions of color in the RGB cube. The first is that the cyan, magenta, and yellow
    vertices of the cube represent brighter colors than red, green, and blue because
    these later vertices project down onto the neutral axis. Similarly, all colors
    in the pyramid defined by the C, Y, M, and W vertices to lighter colors, and the
    pyramid defined by the origin and the R, G, and B vertices will have a more pastel
    or washed out look because they are less saturated, and colors further away from
    this axis will appear more vivid.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# 5.4 THE SUBTRACTIVE COLOR SYSTEMS

    CMY AND CMYK


    A color monitor emits light and consequently relies on the RGB colorspace, which
    is an additive color system. On paper, however, is a totally different story.
    Ink absorbs light and the color we see from it is the light that was reflected
    and not absorbed. If we shine a white light on an area and the color is seen,
    it is because the red component of the white light was absorbed leaving only to
    be reflected. Similarly, magenta absorbs green, and yellow absorbs blue. Thus,
    the cyan, magenta, and yellow colors make a subtractive color space, which is
    the anti-space of RGB. This colorspace is called CMY for cyan, magenta, and yellow.
    For a pixel that has R, G, and B components in the RGB colorspace, the corresponding
    C, M, and Y components are just (255-R), (255-G), and (255-B).


    Due to the physical nature of colored inks, the CMY colorspace is perfect for
    working with printed images. In principle, the addition of equal amounts of cyan,
    magenta, and yellow is like subtracting amounts of red, green, and blue. We know
    that equal amounts of R, G, and B make a neutral color, so equal amounts of C,
    M, and Y do too. Thus, adding large and equal amounts of cyan, magenta, and yellow
    makes black, and adding very small amounts makes a color that is close to white.
    At least this is true when CMY is used to print on white paper.


    In practice, due to imperfections in inks, equal amounts of cyan, magenta, and
    yellow does not make a deep dark black. Rather, it produces a muddy brown. To
    remedy this problem, printers subtract out some of the cyan, magenta, and yellow
    from an image and replace it with black. This new colorspace is called CMYK, and
    it significantly improves the depth and tonal range of printed images. Here, the
    K in CMYK stands for black.


    How much cyan, magenta, and yellow can be subtracted and replaced by black? Because
    neutral colors require equal amounts of cyan, magenta, and yellow, the most that
    can be subtracted for a pixel is the minimum of its C, M, and Y components. Thus,
    $K=min(C, M, Y)$ is the maximum black that can be extracted, and the resulting
    values of C, M, and Y are just the old values less this value of K. Although choosing
    K to be the minimum of C, M, and Y is reasonable, it is not necessary; it can
    also be chosen to be less than this'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'In addition to CMYK''s natural relationship to printing because its subtractive
    mirrors that of inks, it also has another important, pragmatic advantage. Replacing
    equal amounts of three colored inks with a single black can significantly reduce
    the amount of ink printed on the paper. This means that the ink will dry faster
    and the printing presses can produce more copy in the same amount of time.


    There are also significant advantages to CMYK when doing color correction on an
    image that will end up in a printed format. The most significant is that the range
    of colors, known as the gamut, is significantly smaller than what can be created
    on a color monitor. Thus, it''s sensible to invest a lot of time working on an
    RGB image only to convert it to CMYK for printing at the end. This will more likely
    produce many out of gamut colors. When the final result is a printed image it
    is more sensible to convert to CMYK before performing any transformations.


    Unfortunately, the GIMP provides very little support for working in CMYK. There
    is the Decomposition function, found in the Image:Image/Mode menu, which offers
    a CMYK option in its dialog. This is not terribly useful, though. To make the
    GIMP truly pre-press capable, the following is needed:


    +   - The ability to set K in the range 0 to min(C,M,Y).

    - The ability to convert RGB to CMYK while applying color gamut limitations.

    - The ability to work in CMYK space just like in RGB space. This means a channel
    with C, M.Y, and K components and color editing functions and tools like Curves,
    Levels, Color Picker, and so on, which work in CMYK.


    There is also the perception that spot colors are needed to make an effective
    pre-press image manipulation tool. Although there is much pageant about the colorimetry,
    device calibration, and Pantone ink systems for Adobe''s Photoshop, these are
    somewhat of a red herring. Making these systems work is difficult and unreliable.
    Physical printing devices like presses tend to produce different results from
    day to day and even from run to run. In the printing process, there are many problems
    that can change the color balance so carefully calibrated on the monitor. The
    amounts of ink the printer uses, the capability of the press to apply the specified
    percentages uniformly across the printing surface, and many other environmental
    and press health factors make for significant variability in the final result.
    No amount of calibration and proprietary ink systems can fix.


    Thus, the main hurdle to cross before the GIMP can become a viable pre-press tool
    is the functionality given in the preceding bulleted list.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# 5.5 CONVERSION TO GRAYSCALE


    From the previous discussions, it is clear that every color image has a grayscale
    component that can be separated out from the hue and saturation components there
    are three different functions in the GIMP for converting an image to grayscale.
    These are the *Grayscale* function, the *Desaturate* function, and the value component
    of the *Decompose* function. To illustrate these functions, each is applied to
    the color image shown in Figure 5.10(a).


    ![](img/32c07c3b65137f501f1232a822a70623_170_0.png)


    To, the most obvious choice for converting a color image to grayscale is to use
    the *Grayscale* function found in the *Image/Mode* menu. This function transforms
    a 24-bit, three-channel, color image to an 8-bit, single-channel grayscale image
    by forming a weighted sum of the red, green, and blue components. The formula
    used in the GIMP is $Y = 0.3R + 0.59G + 0.11B$, this result is known as luminance.
    The weights used to compute luminance are related to the monitor''s phosphors.
    The explanation for these weights is due to the fact that for equal amounts of
    color the eye is most sensitive to green, then red, and then blue. This means
    that for equal amounts'
