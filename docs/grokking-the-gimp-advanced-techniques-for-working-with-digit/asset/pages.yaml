  md: 'By the way, the shadow produced this technique can be made to look more diffuse
    by making it more transparent. Simply make the shadow active in the Layers dialog
    and set the desired value of transparency using the Opacity slider.


    A technique very similar to making drop shadows is that of punchouts. A drop shadow
    creates the illusion of an image object floating above a background. The punchout
    is also a shadow technique but gives the illusion that part of the background
    has been cut away, casting a shadow on yet another background behind. This is
    the effect you get by holding a stencil slightly in front of a wall. The light
    shining through the stencil casts a shadow that can be seen through the stencil''s
    hole against the wall.


    Just like drop shadows, to make a punchout for an image object you must have a
    selection of it. The procedure for making a punchout is similar to that for making
    a drop shadow, but with a couple of twists. To make a punchout in the shape of
    a selected image region follow these steps:


    +   1. Create the default colors by typing g in the image window.

    2. Create a new layer by clicking on the New button in the Layers dialog, and
    select Foreground as the Fill Type in the New Layer Options dialog. This fills
    the new layer with black.

    3. Make that the new layer is active in the Layers dialog, and fill the selected
    region with white using the Bucket tool. Label this layer Shadow.

    4. Cancel the selection by typing C-s in the image window, and create a layer
    mask for the Shadow layer by choosing Add Layer Mask from the Layers menu.

    5. Make the Shadow layer active by clicking on its thumbnail in the Layers dialog,
    and copy it to the default buffer by typing C-c in the image window.

    6. Make the layer mask of the Shadow layer active by clicking on the layer mask''s
    thumbnail in the Layers dialog, paste the default buffer''s contents by typing
    C-v in the image window, and anchor the resulting float to the layer mask by typing
    C-h in the image window.

    7. Make the Shadow layer active, blur it with Gaussian Blur (IIB), and shift it
    with Offset.


    This creates the punchout effect.


    An example of making a punchout is now presented. The example deviates slightly
    from the steps described in the preceding list. Figure 8.19 shows an


    ![](img/32c07c3b65137f501f1232a822a70623_291_0.png)'
  merge: -1
  pgno: 291
- img_proc: true
  md: 'impressive flash of lightning across a deep purple sky. You can just imagine
    the powerful clap of thunder that''s coming. But in case you can''t, we''re going
    to drive the message home by punching it out of the photo.


    ![](img/32c07c3b65137f501f1232a822a70623_292_0.png)


    We begin by setting the default colors by typing d and then switching the background
    and foreground colors by typing x in the image window. A new layer is created
    by opening the Layers dialog and clicking on the New Layer button. The Background
    radio button is selected from the New Layer Options dialog. This sets the new
    layer to black. For this example the new layer is labeled Inverse Text.


    The Text tool is now invoked by clicking on its icon in the Toolbox and then clicking
    in the image window. This brings up the Text tool dialog shown in Figure 8.20(c).
    The Brushstroke font has been chosen with a height of 100 pixels, and because
    the goal of choosing this font is to get a rough punchout effect, the Antialiasing
    option has been turned off, as shown in the Text tool dialog (Figure 8.20(d)).
    Clicking on the OK button in the Text tool dialog places the text in a floating
    selection. Because the Active Foreground Color is white, so is the newly created
    text.


    Cutting the floating selection with c-x and then pasting back with c-v enters
    the text before it is anchored into the layer below by clicking on the Anchor
    button in the Layers dialog. This makes a layer with white text on a black background.
    Figure 8.20(a) shows the image window, and Figure 8.20(b) shows the corresponding
    Layers dialog at this stage in the example.'
  merge: -1
  pgno: 292
- img_proc: true
