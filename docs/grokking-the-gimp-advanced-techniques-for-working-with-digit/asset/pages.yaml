    A practical question is where should the control points be placed? Another is
    how many control points are necessary to adequately select a shape? For the placement
    of control points here are some rules of thumb:


    +   - A control point must always be placed at a corner (like the one found at
    the rear-most point of the sea turtle''s shell in Figures 3.7 through 3.9).

    - A straight-edge region can only be created by placing a control point at each
    end of the edge, as shown in Figure 3.10(a).

    - An inflection point on a curve can be created between a pair of control points,
    as shown in the bottom path segment of Figure 3.10(b). It can also be created
