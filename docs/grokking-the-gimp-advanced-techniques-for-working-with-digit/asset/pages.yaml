    Thus, brightening or darkening an image using the Brightness slider has the effect
    of diminishing tonal range because the result maps domain to a smaller output
    range. From the discussion in Section 6.1, this is clearly a disadvantage. The
    curves tool, on the other hand, can be used to increase or decrease brightness
    without losing tonal range. To brighten an image, place a control point on the
    Value curve and displace the point upwards. This brightens the image without losing
    tonal range. To darken the image, drag the point downwards.


