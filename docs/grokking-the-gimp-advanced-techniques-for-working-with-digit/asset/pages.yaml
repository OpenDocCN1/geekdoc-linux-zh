    Scaling a larger layer should be avoided if possible, because this operation requires
    the interpolation of pixel values. Interpolation is an approximation process that
    creates pixels where there were none before and, consequently, partially degrades
    the layer''s image quality. Thus, when adjusting the relative sizes of several
    image components on different layers, it is preferable to scale the larger components
    to match the size of the smaller ones or vice versa.


    In the event that it is necessary to scale a larger layer, it is important to
    know that a layer cannot be scaled to dimensions larger than those of the existing
    image boundaries. To scale a layer to dimensions greater than these limits, the
    image window must first be resized larger using the function Canvas Size, previously
    discussed.


    # LAYER RESIZING


    As with scaling, a layer can be resized smaller or larger. This is done with Layer
    Boundary Size, found in the Layers menu. Typically you resize a layer to a smaller
    dimension to eliminate undesirable parts. However, resizing a layer smaller has
    the same problem as resizing an image. That is, the subject matter of the layer
    must be properly positioned within the resulting layer boundaries. For images,
    the positioning problem was solved using the Crop tool, but this will not work
