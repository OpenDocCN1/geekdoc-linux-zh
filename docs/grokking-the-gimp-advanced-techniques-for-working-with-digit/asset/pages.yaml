  md: '# PREFACE


    The title of this book, Goeking the GIMP, is drawn from Robert A. Heinlein''s
    classic science-fiction novel Stranger in a Land. His story is about Valentine
    Michael Smith, the first human to ever reach Mars, saved by Martians.


    The rescue mission returns twenty years later to a young man knowing nothing of
    his own kind back to earth. The story recounts his repatriation and as he comes
    to know the human he finds his place in it. grot, the Martian word meaning ''to
    drink,'' which also serves as a quasi-religious metaphor in the Martian culture
    for having profound appreciation and understanding for something.


    Heinlein''s book, published in 1961, drew immediate acclaim in the science-fiction
    world, and became a part of the iconic cultural settlement of the 60s in the United
    States. Today, the word ''grot'' is part of the U.S. computer vocabulary, and
    its definition can be found in *The New Hacker''s Dictionary*.


    So, do you want to know the GIMP? When I first came across it in 1996, I was writing
    an article and had some photos of poor quality I wanted to touch and enhance before
    including. I had heard about the GIMP, so I downloaded it from the Internet and
    compiled it. When I ran the program, it popped up a small toolbox. Without too
    much trouble, I discovered how to open images and access the image menu containing
    all the GIMP functions and filters. Wow! It looked cool and powerful! But, I didn''t
    have a clue how to use it to solve my problems.


    I didn''t know how to use it and didn''t even know what was wrong with my photos.
    I just knew they looked flat and washed out. I wanted them to look better, and
    what got me interested in the GIMP felt like to learn about it!


    I started to look for it. I searched the Web, checked out books from libraries,
    and by little discovered useful things about the digital touchup and enhancement
    of photos. It was like a slow and frustrating process, and it seemed like there
    was no unified, conceptual treatment of what I wanted to learn.


    The most annoying thing was that almost every book I picked up was full of tips
    and tricks. Tips and tricks? It felt like betting on pennies. I didn''t want tricks;
    I wanted the ideas. What photo touchup and enhancement? Where''s the beef? How
    could I work on my photos if I didn''t understand the


    basic concepts? Moreover, I wanted to learn the practical techniques used by the
    master artisans of digital image manipulation. Out of the hundreds of functions
    and filters in the GIMP, which were the ones to use, and why?


    After a lot of detective work and filling in the blanks myself, I felt it was
    beginning to grow what touchup and enhancement of digital images was. What''s
    more, I was getting to know the GIMP tools intimately. To show what I had learned,
    I wrote a tutorial Photo Touchup and Enhancement with the GIMP and put it out
    on the Internet (http://www.geocities.com/SiliconValley/Haven/5179).


    That''s the story of this beginnings and what explains the rationale for my approach
    and philosophy with digital images requires some understanding of what needs to
    be done. It''s to ''choose the right tool, one click, and you''re done''. Most
    on digital image manipulation would make you believe the crafty..., and they''re
    right. However, that is not what this book is about. It is about tips and tricks,
    and it''s not a collection of recipes for solving some''s favorite image manipulation
    problems. It is first about understanding image manipulation concepts, second
    about knowing how GIMP tools are most effective, and third about the use of these
    tools.


    Many factors have contributed to the style and content of the material presented
    in this book: my educational training in signal processing, my professional work
    in various areas of imaging and image processing, the research I''ve done on colors
    and manipulation, and lots of experimentation with the GIMP. The result is a book
    that covers many areas of digital images, touchup and enhancement, composing 3D,
    and the presentation of graphics on the World Wide Web. This book also gives a
    unified and in-depth introduction to layers, masks, colorspaces, and the use of
    blending modes.


    Now, let''s learn the GIMP, and as Valentine Michael Smith might have said, ''May
    you go it in full!''


    Casey Burns

    Senior Scientist

    BBN Technologies

    Cambridge, Massachusetts

    October 26, 1999'
