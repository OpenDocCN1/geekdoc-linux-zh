  md: 'In this book clicking, double-clicking, and clicking and dragging refer to
    operations with the left mouse button. The terms Shift-clicking, Control-clicking,
    and Alt-clicking refer to the operations of the left mouse button while also pressing
    the Shift, Control, or Alt key. When the right mouse button is used, the operation
    is referred to as right-clicking, and with the middle mouse button it is referred
    to as middle-clicking.


    # FUNCTION NAMES, MENUS, AND KEYBOARD SHORTCUTS


    This book uses several conventions for describing keystrokes and indicating the
    locations of menu items in the GIMP. This section describes these.


    Figure 1(a) illustrates an image of a friendly looking fellow who is going to
    introduce us to the GIMP''s Image menu. As described in the figure, the image
    menu is obtained by either right-clicking in the image or by clicking on the arrow
    icon in the window''s upper-left corner. Either will display the Image menu, as
    shown in Figure 1(b).


    Click the arrow icon with the left mouse button to display the image menu


    ![](img/32c07c3b65137f501f1232a822a70623_16_0.png)


    Click in the image window with the right mouse button to display the image menu


    Figure 1: Convention for Describing Paths to Functions in the Image Menu'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'A menu highlights when the mouse cursor is moved over it. When an entry in
    the Image menu has an arrow pointing to the right, this indicates that it is the
    title of a submenu. For example, moving the mouse cursor to the entry labeled
    Image, brings up the associated submenu, as shown in Figure 1(c). Moving the mouse
    cursor over the submenu labeled Transforms transforms the submenu, as shown in
    Figure 1(d). Finally, entries that have right-pointing arrows are functions that
    can be run by clicking on them.

    The Offset function is highlighted in Figure-1(d).


    In order to compactly and efficiently describe where a function is located in
    a system of menus and submenus, the following notation is adopted for this book.
    For the example shown in Figure 1, the menu path to the function is denoted: Image/Transforms/Offset.
    This indicates that the Offset function is found in the Colors menu, which is
    in the Image window, obtained by right-clicking. The use of the typewriter typeface
    indicates that the text represents a GIMP function or tool.


    Note for certain entries in Figures 1(c) and (d), a keyboard shortcut is indicated.
    Learning these significantly accelerates access to GIMP functions. In the GIMP
    menu, the keyboard shortcuts are denoted by capital letters, with one or more
    keys. The modifiers are indicated by Ctrl, Shift, or Alt, which refer to the Control,
    Shift, and Alt keys on your keyboard. Thus, the keyboard shortcut for the Offset
    function, as shown in Figure 1(d), is Shift+C+O. This is applied by moving the
    cursor into the Image window; simultaneously pressing the Shift and Control keys,
    and typing o. Note that although the key sequence is indicated with an uppercase
    C, the actual key required is lowercase, unless, course, the Shift modifier is
    specifically indicated. Keyboard shortcut notation in this book is slightly different
    from that seen in the GIMP menus. The Control, Shift, and Alt keys are denoted
    by uppercase C, S, and A. These modifiers are followed by a dash and the keystroke
    in lowercase. Thus, the notation used in this book for applying the Offset function
    is C-S-O. For example, the notation C-S-I indicates that the Control and Shift
    keys are pressed simultaneously, followed by typing the letter i. This corresponds
    to the Float function in the Image:Select menu (but not shown in Figure 1).


    Appendix B lists all the default keyboard shortcuts. It also describes how to
    customize the shortcuts to your personal tastes.'
