    # 1.10 COMMON PROBLEMS AND FREQUENTLY ASKED QUESTIONS


    Sometimes the GIMP displays what seems like inexplicable behavior. This is not
    usually a bug but a misunderstanding of how to use the GIMP. For this reason,
    Chapters 1 through 5 each have a final section that addresses common problems.
    These are presented in the format of an FAQ (frequently asked questions); here
    are for this chapter:


    +   - I''ve opened an image in the GIMP and want to run some plug-ins on it, but
    hardly any are available. They all seem to be gray out. What''s wrong with my
    GIMP?


    Nothing is wrong. You''ve probably loaded an indexed image (for example, a GIMP
    format file), and most GIMP plug-ins don''t work with indexed images. The solution
    is to convert your image to RGB format found in the Image: Image/Mode menu.


    +   - After hours of exhausting work during which I built an image with multiple
    layers, masks, and paths, I saved my image to a file. However, the next time I
    opened my image, much of what I did on the image was missing. What happened?


    The GIMP XCF format should be used to save images with layers, masks, and paths
    (see Section 1.2). This is the only format that can save the state of your GIMP
    image projects. Once a project has been completed you may want to save it in another
    format such as JPEG, GIF, PNG, and so on. For this you will need to convert the
    image after merging it (see Section 2.7.1) or flattening it (see Section 2.7.2).'
