  md: 'Netscape, and Emacs, about 50% of the RAM is being used. The remaining 50%
    equals 64MB of RAM. Thus, for my machine, it might be reasonable to set the GIMP
    cache to 50MB. Of course, your mileage will vary.


    # LOADING FONTS


    The text tool in the GIMP requires fonts served up by the X Window System. Unfortunately,
    not every X Window System is delivered with all the cool fonts you''ll want to
    have. It is possible, though, to download a nice set of fonts from the Internet
    and install them on your system. This section describes how to do that. Although
    the advice given here will work on all Linux and UNIX systems, it is not guaranteed
    to work on all of them. The goal of this section is to be helpful, but due to
    the variability of different systems, it would be impossible to cover all cases.


    There are two widely used font collections for computers running the X Window
    System. These collections are called freefonts and sharefonts. They can be found
    at many places around the Web, but two places you might try at


    ```

    ftp://gimp.org/pub/gimp/fonts/

    ftp://metalab.unc.edu/pub/linux/X11/fonts/

    ```


    The files to download will be named something freefonts-0.10.tar.gz and sharefonts-0.10.tar.gz.
    The names may change to reflect updated version numbers.


    Once downloaded, they must be installed in a font directory. For RedHat Linux
    systems, fonts are typically installed in /usr/X11R/lib/X11/fonts/. However, this
    may be different for other systems running the X Window System. It is not necessary
    to install the fonts in the system directory. They can be installed anywhere that
    is convenient—even in the user''s home directory. This last option may be necessary
    for a user who wants to use great fonts but doesn''t have root privilege.


    The following instructions assume that the installation is being made to the user''s
    directory called ~/FONTS. After downloading the two font packages and moving them
    to this directory, the instructions for installing the freefonts package are as
    follows:


    ```

    cd ~/FONTS

    gzip -dc freefonts-0.10.tar.gz | tar xvf -

    ```


    This uncompresses and unpacks the font collection archive. This is followed by
    the commands that tell the X Window System where the new fonts live:


    ```

    xset fp +~/FONTS/freefont

    xset fp refresh

    ```'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Follow the same instructions to install the sharefonts package and that''s
    all there is! The freefonts package contains 79 fonts and the sharefonts package
    22. The next time the GIMP runs, these new fonts will be available to the Text
    tool.


    If these fonts were not pre-installed in the usual system directory, you''ll need
    to tell the X Window System where to find them time you start up a new X session.
    This can be automated by putting the last two commands above in .xinitrc file.


    # Setting the X Window System to Run More Than 8 BPP


    Using the GIMP is greatly enhanced by having a display with sufficient color depth
    to display subtle variations. A display with only 8 bits per pixel (bpp) can represent
    only 256 colors simultaneously, which is insufficient for many photographs. The
    result, as explained in Section 9.5.1, is a type of color distortion called dithering.


    If your video adapter has sufficient RAM, it is possible to display at 16 or 24
    bits per pixel, which will greatly enhance your viewing pleasure and your ability
    to work effectively with color. For example, to run at 16 bits per pixel at a
    1024 × 768 screen resolution, you''ll need about 1.6MB of video RAM. However,
    at a resolution of 800 × 600, you''ll need less than 1MB. Whether it is reasonable
    to use the lower resolution to get better color depth is up to the individual
    user to decide.


    The X Window System on Linux machines typically defaults to 8 bpp. If you are
    using XFree86, the following command can be used to run a higher color depth (for
    other X Window Systems, consult your man pages):


    ```

    % starts --bpp 16

    ```


    This command will run X at 16 bpp only if there is an appropriate section in the
    XF86Config file. For Redhat Linux systems, this file is typically found in the
    directory /etc or /etc/x11. More details on how to configure the X Window System
    using XF86Config can be found in the XF86Config man page.


    # Sources of Raw Image Materials


    Part of the GIMP is digital image creation, but much more is about digital image
    manipulation. One of the primary problems in any project, then, is finding the
    necessary raw materials; the digital images to be manipulated.


    There are many sources for digital images. A scanner is one possibility. However,
    some care must be exercised, because fair use rules can be a little tricky concerning
    copyrights. It is particularly recommended that be'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'used when using an image of a recognizable person or any trademarks or company
    logos. These sorts of images are often aggressively protected, even for non-commercial
    use.


    Of course, scanning one''s photographs is an excellent source of material. If
    you don''t have access to a scanner, photo-CDs are a relatively inexpensive way
    of having your photographs professionally scanned and saved in a convenient storage
    medium. Digital cameras are also excellent tools for getting the pictures you
    need. Many good-quality, low-priced digital cameras are now available. A major
    advantage of a digital camera is that photos can be taken and immediately evaluated.
    Thus, if the photo doesn''t quite have the desired qualities, it can be taken
    again, until the right subject matter is captured. Several of the images used
    in this book were obtained this way.


    Nevertheless, it is often inconvenient or just impossible to take photos of some
    subjects—pictures of frosty icebergs at the South Pole, a Bengal tiger in its
    natural habitat, the space shuttle in orbit. Most of us can''t go there to get
    the shot. Let''s not despair, though there is a treasure of free photographic
    material on the Internet, and all of the above and much more can be found with
    a little effort. The secret is that many United States websites have no-copyright-assertion
    policies. This means that most of the photos on these sites can be freely used
    both commercially and non-commercially.


    Examples of excellent sources of large, free image archives can be found at Web
    sites for the National Aeronautics and Space Administration (NASA), the National
    Oceanic and Atmospheric Administration (NOAA), and the U.S. Fish and Wildlife
    Service (FWS). These all have terrific image libraries containing tens of thousands
    of images of animals, plants, underwater life, space, planes, ships, and on. The
    following is a list of websites that are starting points for exploring some of
    these image collections. Just remember that there are some restrictions, and the
    responsibility of ascertaining the copyright of each image remains with you. Make
    sure you read the copyright claims on each site before using images found there.


    Much of the raw image material used in this book comes from three main sources.
    NASA has several excellent sites housing image collections. Here are the three
    most used of:


    ```

    http://www.nasa.gov/gallery/photo

    http://images.jsc.nasa.gov

    http://nix.nasa.gov

    ```


    We also made heavy use of the NOAA''s main photo site, which can be found at

    http://www.photolib.nasa.gov'
