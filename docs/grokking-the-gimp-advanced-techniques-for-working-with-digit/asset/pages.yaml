  md: '# B

    KEYBOARD SHORTCUTS


    GIMP has a set of default keyboard shortcuts that are documented here. All the
    defaults are contained in a file in the directory ~/.gimp found in the user''s
    home directory. The first time the GIMP is run file is created and named menus.
    You can modify the keyboard shortcuts by adding new ones or changing default entries
    to suit personal tastes. There are two ways to change the defaults. The first
    is by editing the file menus is a good method when you want a major reorganization
    of the default shortcuts. The second method is interactive and produces a single
    addition or change while working in the GIMP. You do this by placing the mouse
    cursor over the menu item and typing the desired keystrokes. As you type the keystrokes
    they appear to the right of the menu entry. The next time the function is to used,
    it can be invoked by the new shortcut.


    In the following tables, all the keyboard shortcuts are executed by typing them
    in the image window. A shortcut consists of a keystroke, perhaps in conjunction
    with the Shift, Control, or Alt modifier keys. The modifier keys are designated
    by s for Shift, c for Control and a for Alt. Thus, the shortcut c-s-1, which produces
    the Info window, is composed of simultaneously holding down the Control and Shift
    keys and then typing the letter.


