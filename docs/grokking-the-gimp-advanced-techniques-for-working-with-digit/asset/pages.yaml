  md: '# # Grokking the GIMP


    # ## Advanced Techniques for Working with Digital Images


    Written by Carey Bunks, a specialist in image processing, Grokking the GIMP is
    an insightful and unified guide to getting the most from your digital images.
    Whether your passion is creative graphics or practical image enhancement; whether
    you’re a UNIX system administrator, a Web site designer, or a Linux’ user interested
    in state-of-the-art image manipulation, you will appreciate the depth and clarity
    of this unique and indispensable guide.


    ''Grokking'' the GIMP means understanding its core tools, the fundamental ideas
    behind them, and how to use them effectively. Because the GIMP has nearly 300
    built-in functions and filters, it’s important to know which are the most powerful
    and which are the most pertinent to your image projects. This book teaches you
    that, and more.


    Photo touch, image enhancement, compositing, and 3D rendering—Grokking the GIMP
    covers and explains the principal subjects of digital image manipulation. In addition,
    the in-depth instruction will help you master layers, masks, colorspaces, and
    blending modes. Develop your GIMP savvy!

    Refine your GIMP know-how! With this book, you’ll find it to grok the GIMP.


    With Grokking the GIMP, you’ll learn how to:


    +   - Exploit layers and channels to maximize the efficiency of your projects


    +   - Find an image’s natural mask using Threshold, Decompose, and the selection
    tools


    +   - Relate the features of RGB and HSV colorspaces and understand how they apply
    by blending modes


    +   -Unleash the power of Levels, Threshold, and Curves to achieve precise control
    of color, depth, and contrast in your image


    +   - Touch up and enhance scanned or digital photos


    +   - Composite striking digital collages and photo-montages


    +   - Render 3D effects using shadows, knockouts, and bumpmapping


    +   - Create animated GIFs, clickable image maps, clickable backgrounds, type
    effects, and other important Web page elements


    ![](img/32c07c3b65137f501f1232a822a70623_355_0.png)


    A Scientist at BBN Technologies, Carey Bunks received his Ph.D. in electrical
    engineering from MIT with a specialization in image processing. He is the author
    of numerous scientific journal articles, an online tutorial on using the GIMP
    for photo touchup and enhancement, and is co-author of a book on Scilab, an open-source
    scientific and engineering computation package.


    ![](img/32c07c3b65137f501f1232a822a70623_355_1.png)


    Linux / Graphics


    $45.00 USA / €67.95 / £34.99 Not UK


    ISBN 0-7357-0924-6

