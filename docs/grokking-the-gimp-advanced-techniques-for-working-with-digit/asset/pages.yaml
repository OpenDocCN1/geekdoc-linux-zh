  md: '![](img/32c07c3b65137f501f1232a822a70623_237_0.png)


    The background image is shown in Figure 7.2(a). This scene will receive all the
    other image elements. The first element is the angel fish, which has been copied
    from Figure 7.1 and pasted into this one. The following procedure is used to accomplish
    this:


    +   1. Make the Angel Fish layer active by clicking on its thumbnail in the Layers
    dialog shown in Figure 7.1 (see Section 2.1.1 for more on active layers).

    2. Copy the Angel Fish layer to the default buffer by typing c-e in the image
    window shown in Figure 7.1.

    3. Paste the Angel Fish layer into the target image by typing c-v in the image
    window shown in Figure 7.2. This loads the Angel Fish layer into a floating selection.

    4. Make the float into a new layer by clicking on the New Layer button in the
    Layers dialog.'
