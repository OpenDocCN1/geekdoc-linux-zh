    # ### 3.3.11 The By Color Function


    The By Color selection tool, found in the Image:Select menu, is similar to the
    Magic Wand in that it automatically selects pixels in the active layer that are
    in color to a seed pixel value. The difference, however, is that the selected
    pixels are not obtained by growing a contiguous region around the seed. The By
    color selection tool selects all pixels in the layer that are within a specified
    threshold of the seed pixels'' color. This is a subtle but important difference.
    It means that if two regions of similar color are separated by one of very different
    values, the By color selection tool will get both regions, and the Magic Wand
    will not.


    Choosing By color brings up the dialog pictured in Figure 3.18(b). This dialog
    box allows a Fuzziness Threshold to be chosen. The default is normally 15, but
    here it has been set to 30. This number determines how far a pixel can vary color
