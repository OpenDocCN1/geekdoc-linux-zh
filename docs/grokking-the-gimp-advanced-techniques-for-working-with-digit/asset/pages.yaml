    # # 7.3 PROJECT 3: DESTINATION SATURN


    The third project creates a collage that blends together a terrific photo of the
    planet Saturn with a launch of the space shuttle. This project illustrates a more
    sophisticated use of layer masks and blend modes.


    The raw images for the project are shown in Figures 7.17 and 7.18. The objective
    is to depict the shuttle lifting off with Saturn sitting majestically in the background...perhaps
    as a final destination? Although the shuttle was never conceived for travel to
    Saturn, the GIMP allows us to imagine, suggest, ever portraying the inconceivable.


    The rough layout of the desired scene is to position the image of Saturn what
    above and behind the shuttle lift-off. The first step is to get the two images
    into the same window. For this, a little planning is necessary. The image of Saturn
    is wider than that of the shuttle. However, the Saturn image has a large black
    margin that, when cropped, will make the result narrower than the shuttle. Cropping
    the Saturn image to remove the black margin produces an image that has a width
    of 527 pixels and a height of 489 pixels. The raw space shuttle launch image has
    a width of 640 pixels and a height of 636 pixels.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_252_0.png)


    Figure 7.17: Original Image of Saturn


    ![](img/32c07c3b65137f501f1232a822a70623_252_1.png)


