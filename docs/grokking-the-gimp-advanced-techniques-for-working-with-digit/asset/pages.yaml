  md: '# # 1 GIMP BASICS


    This chapter reviews the features of the GIMP Toolbox and image windows, introduces
    the major dialogs, and presents important functions not covered elsewhere in this
    book.


    # ## 1.1 INTRODUCING THE GIMP WINDOWS AND DIALOGS


    This section gives an overview of the main features of the GIMP windows and dialogs.
    The GIMP windows fall into four main categories. They are the Toolbox window;
    the image window; the Layers, Channels, and Paths dialogs; and the dialogs for
    selecting colors, brushes, patterns, gradients, and palettes. Each of these is
    briefly introduced in the following sections.


    # ### 1.1.1 THE TOOLBOX


    Figure 1.1(a) illustrates the Toolbox window. This window is the first to appear
    when the GIMP is run. It consists of 27 Toolbox function icons; the File and Xns
    pull-down menus; and the Active Foreground Color, Active Background Color, Default
    Colors, Switch Colors, Active Brush, Active Pattern, and Active Gradient icons.
    The function icons are each named in the figure shown on page 7, and their uses
    are discussed in various places in this book.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Toolbox menus


    ![](img/32c07c3b65137f501f1232a822a70623_28_0.png)


    Figure 1.1: The Toolbox Window


    Almost all the tools in the Toolbox have options. Double-clicking on a tool brings
    up its Tool Options dialog. Once opened, the dialog remains open until it is explicitly
    closed, supplying the interface for the tool options in use at the moment. Changing
    tools automatically changes the Tool Options dialog, if its window is open. This
    dialog can also be invoked with Toolbox: File/Dialogs/Tool Options or by typing
    C-S-t in the Toolbox window. Figure 1.1(b) shows the Tool Options dialog for the
    Gradient tool.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 1.1.2 THE IMAGE WINDOW


    The window is the most important window in the GIMP. It is also the most feature-rich.
    Figure 1.2(a) illustrates a typical image window. Note that the title bar marked
    *


    *image-window.xcf -16.0 (RGB) 200*


    which gives a bit of information about this image. The string image-window.xcf
    is the name of the file on disk which contains the original version of this image,
    and * indicates that the image in the window has been modified with respect to
    the version on the disk. Thus, to avoid losing changes made to it it must be saved
    (see Section 1.2). The string 16 gives the window number, 16, and the view number,
    0. Every time a new image is opened, the window number is incremented, except
    when the window is created using New View and the view number is incremented (see
    Section 1.8.2 for more on view numbers). The string in parentheses, (RGB), gives
    the image type (see Section 1.4), which can be RGB, Grayscale, or Indexed. Finally,
    the string 200% indicates that the image is zoomed and displayed in its window
    twice its true size.


    ![](img/32c07c3b65137f501f1232a822a70623_29_0.png)


    Figure 1.2: The Image Window'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Additional information about the image can be had from the Window Info dialog,
    which is shown in Figure 1.2(b), and is found in the Image:View menu, or is displayed
    by typing C-s-1 in the image window. This dialog gives the image dimensions in
    pixels, and its resolution in dots per inch. The units of the rulers at the left
    and upper sides of the image window correspond to the dimensions shown in the
    Window Info dialog. Moving the mouse cursor into the image window makes an arrow
    appear on each ruler, indicating the cursor’s position. The cursor position is
    also precisely shown in the status bar. In Figure 1.2(a), the status bar indicates
    that the mouse cursor is located at the position (99,150). Both the rulers and
    the status bar can be toggled off with Toggle Rulers and Toggle Statusbar, both
    found in the Image:View menu.


    The most important feature of the image window is the image window, shown in Figure
    1.2(c). This menu is displayed by right-clicking in the image window and can be
    displayed by clicking the arrow icon found in the upper-left corner of the window
    (see Figure 1.2(a)). The image menu and its submenus stay open until one of its
    items has been selected by the mouse. However, these menus can be opened as windows
    and, in doing so, can be made to remain on the screen. This is done by clicking
    on the dashed line at the top of the menu. This is illustrated in Figure 1.2(d).
    The image window can be eliminated from the screen by again clicking on the dashed
    line at the top of.


    When an image is larger than can be displayed by the image window, the scrollbars
    seen in Figure 1.2(a) allow the image to be panned inside the window. However,
    there is a special panner window that can be displayed by clicking and holding
    the left mouse button on the four-way arrow icon found at the lower-right corner
    of the image window. The panner is shown in Figure 1.2(e). Dragging the mouse
    in this window pans the image in the image window. Alternatively, the image can
    be panned by middle-button-clicking and dragging with the mouse in the image window.


    Finally, there is a pair of buttons found at the lower-left corner of the image
    window that are used for the Quick Mask function. This function is covered in
    Section 4.5.2.


    # 1.1.3 THE LAYERS, CHANNELS, AND PATHS DIALOGS


    The Layers, Channels, and Paths dialogs are very important tools in the GIMP.
    These dialogs can be displayed by selecting Layers & Channels from the Image:Dialog
    menu or by typing c-1 in the image window and selecting the appropriate tab. The
    three dialogs are shown in Figure 1.3(a), (b), and (c). The Layers dialog is discussed
    in detail in Section 2.1.1, the Paths dialog in Section 3.4, and the Channels
    dialog in Section 4.1.1.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_31_0.png)


    # 1.1.4 THE DIALOGS FOR COLOR, BRUSHES, PATTERNS, GRADIENTS, AND PALETTES


    Clicking on the Active Foreground Color or Active Background patches in the Toolbox
    window shown in Figure 1.1(a)), brings the Color Selection dialog shown in Figure
    1.4(a). The rainbow-colored vertical bar is for choosing hue, and the large colored
    square is for choosing saturation and value. A color choice is made by clicking
    and dragging with the mouse to select the desired hue, saturation, and value.
    Numerical values can also be entered for R (red), G (green), B (blue), H (hue),
    S (saturation), and V (value) in the data entry boxes. More on these color space
    components is discussed in Chapter 5. Several other color-choosing dialogs can
    be used by clicking on the tabs located in the upper part of the window.


    ![](img/32c07c3b65137f501f1232a822a70623_31_1.png)'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Choosing a color in the Color Selection dialog that makes color appear in the
    Active Foreground Color or Active Background patch (see Figure 1.1(a)), depending
    on which patch was clicked to invoke the Color Selection tool. Clicking the Swap
    Colors icon (the two-headed arrow next to the active color patches) switches the
