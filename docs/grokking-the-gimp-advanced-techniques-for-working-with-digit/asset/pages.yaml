  md: '![](img/32c07c3b65137f501f1232a822a70623_89_0.png)


    Figure 3.10: The Required Number of Bezier Control Points


    The number of control points needed to adequately adjust a Bezier path to a shape
    is a different question. Figure 3.10(c) shows that a pair of control points are
    all that is needed to create a circle. Thus, a single control point can cover
    up to 180 degrees of curve. However, this doesn''t account for all curve characteristics.
    I personally like to place control points as the shape of my selection passes
    through 90 degrees of curve. This personal rule is borne out in the sea turtle
    selection shown in Figure 3.7.


    In any case, the issue of the number of points required for a shape is not critical
    because it can be resolved using the Add Point and Delete functions available
    in the Paths dialog. These are discussed in detail in Section 3.4.


    # THE INTELLIGENT SCISSORS


    In principle the Intelligent Scissors is supposed to work by following, as closely
    as possible, constant-valued color contours in the image between subsequent points
    clicked by the mouse. However, at the time of this writing, the Intelligent Scissors
    is a GIMP tool that seems to be broken. Much multiplexed discussion has passed
    through the GIMP developers'' mailing list on this tool and, unfortunately, it
    seems for the present time this tool has little or no value. Even if the tool
    did work, I would still rank it as a tool of little utility.


    # 3.1.2 SELECTION TOOL OPTIONS


    Double-clicking on any of the Toolbox icons brings up the Tool Options dialog
    for that tool. For selection tools the important options are Antialiasing, Feather,
    Sample Merged, and Threshold. Each of these is discussed in this section.


    # ANTIALIASING


    Antialasing is an important edge treatment for selections. Figure 3.11 illustrates
    the antialasing concept. Figure 3.11(a) shows an array of pixels that has'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'been partitioned into two regions by a selection edge. However, due to the
    slope of the selection and the finite area of the pixels, some pixels are on both
    sides of the selection edge. That is, these pixels are partially selected. What
    happens to this set of partially selected pixels is important for the aesthetic
    presentation of the selection''s edge.


    ![](img/32c07c3b65137f501f1232a822a70623_90_0.png)


    Figure 3.11: How Antialiasing Works


    For example, let''s assume that white represents a pixel and black an unselected
    one. Figure 3.11(b) shows what happens if pixels are included in the selection
    when more than 50% of the pixel is above the selection edge and otherwise otherwise.
    This seems like a reasonable criterion; however, notice the selection obtained
    by applying this rule produces a staircase effect on the edge. This staircase
    effect, known as *aliasing*, makes the edge look harsh. We''ll see this in a more
    realistic example in a moment.


    Alternatively, Figure 3.11(c) illustrates the concept of antialiasing. Here white
    represents a pixel which is fully selected, black one that is fully unselected,
    and gray represents partially selected pixels, where the level of gray indicates
    the percentage of the pixel that falls into the selection. Thus, a lighter value
    of gray indicates a more fully selected pixel and a darker value less selected
    one. Assigning gray values to partially selected pixels has the effect of visually
    smoothing the staircase effect illustrated in Figure 3.11(b), which is why this
    is called antialiasing.'
