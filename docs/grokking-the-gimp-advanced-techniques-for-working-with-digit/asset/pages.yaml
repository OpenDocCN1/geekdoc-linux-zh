  md: 'as R, G, B, and A. These are the red, green, and alpha components of a layer,
    respectively. The R, G, and B channels contain the color information about the
    layer, and the A channel describes how opaque the layer is to be behind it. An
    exception to this rule is that the default background layer of a newly created
    or freshly opened RGB image contains no alpha channel.


    A complete diagram of the image component hierarchy is illustrated in Figure 2.6.
    In the standard distribution of the GIMP, channels are 8 bits deep, meaning that
    each pixel in a layer is represented by up to 32 bits. However, there is a special
    development version of the GIMP that uses channels that are 16 bits deep, making
    for layers with pixels represented by up to 64 bits. This is known as the Hollywood
    branch of the GIMP because it is useful for film and quality studio production
    imagery. More on Hollywood can be found at http://gimp.org.


