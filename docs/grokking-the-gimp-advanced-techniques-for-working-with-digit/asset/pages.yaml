  md: '# 5.6.2 THE ADDITION, SUBTRACT, AND DIFFERENCE BLENDING MODES


    Addition, Subtract, and Difference are blending modes that add and subtract foreground
    and background pixel values in RGB colorspace. Figure 5.14 illustrates the effect
    of addition and subtraction for two pixels in the RGB cube.


    ![](img/32c07c3b65137f501f1232a822a70623_175_0.png)


    The addition blending mode works as follows: Given a foreground and background
    pixel, by the RGB vectors F=[r1, g1, b1] and B=[r2, g2, b2], the pixel obtained
    from the Addition blending mode is R=F+B=[r1+r2, g1+g2, b1+b2]. Thus, in Figure
    5.14(a), the two colors represent a foreground and background pixel, and the red
    is the sum of the two. Addition always produces a result color that is as light
    or lighter than


    either the foreground or background colors. This is because the vector sum must
    have a projection onto the neutral axis that is closer to white than the projection
    for either the background or foreground colors.


    In the event that the vector sum produces a result out of the color cube (that
    is, by producing any component greater than 255), its value is clipped to the
    surface of the cube. The equation describing the Addition blending mode is


    ```

    R=min{F+B,W}

    ```


    where W'' is the vector [255,255,255] and the min function performs component-wise
    minimization of the two vectors.


    Cyan, magenta, and yellow are the sums of green and blue, and red and green, respectively.
    Thus, cyan, magenta, and yellow appear lighter than red, green, or blue because
    they project higher up onto the neutral axis. Furthermore, any of these secondary
    colors (cyan, magenta, yellow) summed with the complementary primary color (red,
    green, blue) produces white, the lightest color of all.


    Figure 5.15 illustrates an application of the Addition blending mode. Figure 5.15(a)
    displays the image of a flower, and Figure 5.15(b), showing the associated Layers
    dialog, indicates that this image consists of two-layers. The upper layer is the
    flower image, and the lower layer is filled with a medium gray whose pixel values
    are uniformly 127~127~.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_176_0.png)


    Figure 5.15: Using the Blending Mode


    Figure 5.15(a) shows the flower image for the Normal blending mode. Figure 5.15(c)
    shows the same image when the blending mode of the upper layer is changed to Addition.
    This has the effect of adding $127^F 127^G 127^B$ to every pixel in the flower
    layer, which lightens the entire image considerably. In fact, some parts of the
    image are completely blown out to white.


    The effect of the Subtract blending is illustrated in Figure 5.14(b). This blending
    mode works as follows: Given a foreground and background pixel, we will represent
    each as an RGB vector $F=[r_1, g_1, b_1]$ and $B=[r_2, g_2, b_2]$. The pixel obtained
    from the Subtract blending mode is $R=B-F=[r_2-r_1, g_2-g_1, b_2-b_1]$. Thus,
    for the two blue arrows labeled $F$ and $B$ in Figure 5.14(b), the resulting of
    subtracting the foreground from the background is given by the red arrow labeled
    $R$.


    Unlike the Addition blending mode, Subtract is not symmetrical (that is, subtracting
    $F$ from $B$ is not the same as subtracting $B$ from $F$). The result of subtracting
    the foreground from the background can produce negative values. If a component
    of the resulting RGB vector is less than zero, it is clipped to the surface of
    the cube. The equation representing the Subtract blending mode is


    ```

    $R = \max(B - F, 0)$

    ```'
