    # 4.1.3 MAKING CHANNEL MASKS VISIBLE


    A channel mask''s visibility can be toggled on or off by clicking its Eye icon.
    Looking again at Figure 4.2(b), the Eye icon is not visible. Toggling it on, as
    shown in Figure 4.3(b), and toggling off the image layer''s visibility produces
    the result in Figure 4.3(a). This figure shows that the channel mask is now visible
    in the image window.


    ![](img/32c07c3b65137f501f1232a822a70623_117_0.png)


    If the Eye icon of the image layer is toggled back on, as shown in Figure 4.4(b),
    the resulting view in the image window is Figure 4.4(a). The image layer can now
    be seen through the channel mask. The parts of the image corresponding to the
    white region of the mask appear clearly, but the parts in the black region appear
    covered by a dark, semi-transparent film. This demonstrates why these channels
    are called masks;they allow the selected parts of the image to be clearly seen
    while “masking out” the unselected parts.'
