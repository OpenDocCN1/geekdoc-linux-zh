    5.15(a) is shown in Figure 5.20(a). This image is the foreground hue mode, and
    the background is the blue layer shown in Figure 5.20(b). This blue layer varies
    horizontally in mode and vertically in saturation. The result of applying the
    Hue mode is is shown in Figure 5.20(c). Here, it can be clearly seen that the
    saturation and value variations of the blue layer are combining with the hue of
    the flower layer.


