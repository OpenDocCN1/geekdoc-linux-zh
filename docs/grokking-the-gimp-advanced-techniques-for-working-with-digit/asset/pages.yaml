    pixels that are in the range of the selected values are mapped to white, and the
    rest are mapped to black. Threshold is a powerful tool for automatically creating
    masks. This is illustrated in the following example:


    Figure 4.43 illustrates the first step of using Threshold to create a natural
    mask. In the example, we want to make a selection of the partially blooming flower.
    We begin by copying the image in Figure 4.43(a) into a channel mask.'
