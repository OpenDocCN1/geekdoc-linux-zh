    creates negative values that are clipped to zero. Difference, shown in Figure
    5.16(b), however, has no clipped which employs the absolute value of the difference.
    Note that for both Subtract and Difference modes, the results are darker than
    the original flower image.


    ![](img/32c07c3b65137f501f1232a822a70623_177_0.png)


    Figure 5.16: Using the Subtract and Difference Blending Modes


    # 5.6.3 THE MULTIPLY (BURN), DIVIDE (DODGE), SCREEN, AND OVERLAY BLENDING MODES


    Multiply, Divide, Screen, and Overlay are all multiplicative blending modes. The
    resulting pixel values are the product, or a function of the product, of the foreground
    and background pixels.'
