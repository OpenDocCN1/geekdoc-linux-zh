- img_proc: true
  md: 'Now, subtract the unsharp version from the original and the result is the lower
    black line in the top graph of Figure 6.32. You could say that this result is
    just the original curve with its unsharp component masked.


    This is the interpretation of what Unsharp Mask does, how does this sharpen the
    image? The answer is given by the lower graph of Figure 6.32, which shows the
    original black line representing the row of pixel values. The graph also shows
    a red curve, which is the original curve and the associated unsharp masked version
    added to it. As you can see, just before the edge, there is now a dip in pixel
    value at the low side of the transition and a peak on the high side. Thus, the
    result is that the edge has been sharpened.


    # 6.4.2 A SIMPLIFIED ILLUSTRATIVE EXAMPLE


    So much for the theory of the Unsharp Mask. A simple example brings out the practical
