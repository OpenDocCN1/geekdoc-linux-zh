    is defined as the maximum of the R, G, and B components (see Figure 5.6).


    So, which conversion to grayscale is best? I''m tempted to say that Grayscale
    is best because it produces the whose brightness is the most perceptually similar
    to the brightness of the original color image. However, the answer must depend
    on what you want to do with the image. Furthermore, the two other methods for
    converting to grayscale are useful, and in particular, the value component of
