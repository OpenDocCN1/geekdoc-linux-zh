  md: '# BEZIER PATHS


    The Bezier Path selection tool is very powerful. It is the only selection tool
    that allows the interactive adjustment of the selections it makes. The Bezier
    path works by placing control points on an image. They are initially connected
    by straight-line path segments; however, using the control handles hidden each
    control point, the path segments can be curved in practically arbitrary manner.
    By using a Bezier path, an initial selection can be interactively corrected until
    the final result fits the desired selection like a glove.


    Figure 3.6 illustrates the basic operations of a Bezier path. The initial Bezier
    path shown in 3.6(a) was created by clicking in the image window five times. The
    upper-left corner was the first, and the lower-left, lower-right corners were
    the second, third, and fourth points added to the path. The final click of the
    mouse was made on the initial point, closing the path. As each point was added,
    the straight-line segments seen in between the control points.


    ![](img/32c07c3b65137f501f1232a822a70623_85_0.png)


    Figure 3.6: Using the Bezier Control Points and Handles:(a) A Bezier path, (b)
    Simultaneously manipulating two control handles of a control point, (c) Manipulating
    an individual control handle, and (d) Moving a control point.


    While constructing a Bezier path, the mouse cursor appears as an arrow, with a
    filled circle just below and slightly to the arrow''s right. This circle indicates
    that the path is not closed and that the next mouse click will create a new control
    point. Note that Bezier paths need not to be closed. This is discussed in detail
    in Section 3.4, which describes the Paths dialog.


    The path segments between control points can be made by manipulating points''
    control handles. For a closed Bezier path, the control handles are made visible
    by clicking on a control point and dragging. 3.6(b) shows how the control handles
    for the upper-left corner of the Bezier path have been pulled out of that control
    point. The dragging action of the mouse positions one of the control handles while
    the other moves in tandem'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'with, diametrically opposite, the first. As can be seen in Figure 3.6(b), the
    two path segments attached to the control point are made to curve by the action
    of the control handles.


    Note that the control handles do not disappear once the mouse button is released
    and they can be readjusted at any time by clicking the mouse on either handle
    and dragging. However, only one set of handles may be visible at once. Clicking
    on another control point displays its handles while toggling the visibility of
    the handles for any other point. Also note that when the mouse cursor is close
    enough to a control point or control handle to manipulate it, the cursor changes
    from an arrow with a filled circle below it to an outline with a white square.
    Because control handles resemble squares, this special cursor is a useful way
    to indicate that the mouse cursor is close enough to the control point for the
    handles to be active.


    The two control handles for a point can be moved independently of each other by
    using the Shift key. Pressing the Shift key while dragging a handle with the mouse
    makes that handle move while the other remains stationary. Moving a single control
    handle in this way allows the curvature of a single path segment to be manipulated.
    Figure 3.6(c) shows the result of using the Shift key to move one of the control
    handles independently of the other. Note how this changes the curve of the upper
    segment of the square while leaving the curve of the left segment as it.


    It is also possible to reposition a control point. This is done by pressing the
    Control key before clicking on a control point. Dragging the mouse button and
    Control key pressed moves the control point. The result of repositioning a control
    point is shown in Figure 3.6(d).


    After creating a Bezier path with all the control points properly positioned it
    may then be converted to a closed path. Note that when the mouse cursor is inside
    the closed path, the cursor changes to an arrow with the outline of a dashed rectangle
    below it. The dashed rectangle resembles the Marching Ants, which will appear
    when the Bezier path is converted to a selection.


    Figures 3.7 through 3.9 show the application of the Bezier Path tool in a practical
    example. Figure 3.7 shows that a closed Bezier path has been created by placing
    seven control points around the perimeter of a sea turtle''s shell. Although the
    points are all positioned on the edge of the shell, the straight-line segments
    between points do not marry well to the shell''s shape.'
