    Figure 5.23: An Example of Color Mode


    #  5.7 OPACITY AND TRANSPARENCY


    Transparency is usually not considered to be a blending mode, however, it works
    just like one! Transparency is just a combination of the Multiply and Addition
    blending modes; it takes a percentage of the foreground and adds it to the complementary
    percentage of the background. Thus, if you want the foreground to be 75% opaque
    (opacity is just the opposite of transparency), you multiply the foreground by
    0.75, the background by (1–0.75), and add the two. This relationship can be expressed
    as


    $R=\alpha F+(1-\alpha)B$$


    where $\alpha$ represents the opacity. The percentages used in scaling the foreground
    and background pixels are called complementary because $\alpha+(1-\alpha)=1$.'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'By way, can you guess the percentage of opacity is represented by the Greek
    letter alpha in the preceding equation? It is because the opacity of a layer is
    controlled by its alpha channel. The alpha channel takes values in the range [0,
    255] where a value of 255 represents 100% opacity, and 0 represents 100% transparency.


