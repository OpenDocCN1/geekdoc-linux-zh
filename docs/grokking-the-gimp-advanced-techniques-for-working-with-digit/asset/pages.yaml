    ![](img/32c07c3b65137f501f1232a822a70623_278_0.png)


    Figure 8.3: Filling with Image Patterns


    # 8.2 GRADIENT RENDERING TECHNIQUES


    In Section 4.3, gradients were discussed as tools for making masks. However, they
    are also very useful for rendering.


    Figure 8.4 shows the Tool Options dialog for the Gradient tool. As shown in the
    Blend menu, there are a a total of 11 different gradient types. The Conical (symmetric),
    Shapeburst, and Bi-Linear options are of particular interest for rendering effects.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_279_0.png)


    Figure 8.5 illustrates examples of conical, linear, and shapeburst gradients.
    In Figure 8.5(a), conical gradients produce a dimmed effect. As illustrated in
    Figure 8.5(b), bi-linear gradients create the illusion of the specular that would
    be created from a metallic or glassy cylindrical surface. As displayed in Figure
    8.5(c), shapeburst gradients produce a beveled effect. Thus, each of these gradients
    produces an illusion of a 3D surface.


    Figure 8.4: The Different Gradient Types


    ![](img/32c07c3b65137f501f1232a822a70623_279_1.png)


    Figure 8.5: Examples of Conical, Bi-Linear, and Shapeburst Gradients


    An example of using a gradient to render a 3D effect, a beveled look is created
    for some text using a shapeburst gradient. Figure 8.6(a) displays the text, created
    using the Baltar font at a height of 175 pixels. This is a thick blocky type that
    is perfect for a bevel effect. The layers dialog, displayed in Figure 8.6(b),
    shows that the image consists of three layers. There is the white background and
    a transparent layer, both created before invoking the text tool, and a floating
    selection containing the text. The floating selection is created automatically
    by the text tool and must be anchored before being able to work on other layers
    in the image.'
  merge: -1
