- img_proc: true
  md: '# 2.7.1 MERGING


    It is possible to merge a subset of layers from an image into a single layer.
    It is accomplished by choosing Merge Visible Layers from the Layers menu or by
    simply typing C-m in the image window. Alternatively, it is convenient to merge
    just two adjacent layers in the layer stack. This can be done with Merge Down,
    found in the Layers menu. The use of function merges the active layer with the
    next visible layer down in the stack. Merge Down can be conveniently invoked by
    typing C-S in the Layers dialog. A use of Merge Down is illustrated in Section
    9.1.4.


    # 2.7.2 FLATTENING


    The function Flatten Image, found in the Layers menu, is an alternative to Merge
    Visible. This function merges all layers regardless of their visibility in the
    image window. In addition, Flatten applies all the masks to their respective layers
    (for more layer masks, see Section 4.2) and deletes any remaining alpha values
    in the image. In fact, Flatten Image is the only function in GIMP that can remove
    the alpha channel from an image. Channel masks, however, are neither applied nor
    deleted (see Section 4.1 for more on channel masks). Typically an image is flattened
    in order to save it in format that does not support layers or transparency. The
    JPEG is an example of this.


    # 2.8 COMMON PROBLEMS AND FREQUENTLY ASKED QUESTIONS


    Layers can be tricky, and it is sometimes possible to run into what seem likehensible
    difficulties while using them. The following list of problems addresses some common
    difficulties with layers. In a nutshell, the information in the Layers dialog
    almost always contains the solutions to these.


    +   - I am trying to draw, paint, select, or some other operation on the image
    window, and repeated efforts don''t seem to produce any results. What''s going
    on?


    GIMP operations are applied to the active layer. A common problem with layers
    is the active layer is not visible. It is possible that the active layer is blocked
    by layers above it or that the visibility of the active layer is not turned on.
    To solve the problem, make sure that the Keep Eye icon of the active layer is
    on, and turn off the Keep Eye of the layers above.


    +   - I am trying to paint in a transparent part of a layer and getting no results.
    Why?


    If you are trying to draw or paint on a transparent part of a layer and nothing
    seems to leave a mark, the problem is that the Keep Transparency button is not
    in the Layers dialog. Toggle this button off and your problem will disappear.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# I want to add a layer mask to my image, but it is grayed out in the Layers
    menu. Why isn''t this option available?


    Background layers and flattened images (see Section 2.7.2) have no alpha channels
    and thus cannot have a layer mask. This problem is easily solved, though by applying
    the Add Alpha Channel function from the Layers menu.


    +   - The top layer of my image is labeled Floating Selection, all my other layers
    are grayed out, and I can''t make any of my layers active except the top one.
    What''s wrong?


    A floating selection disables all the other layers until it is anchored to a new
    layer or to the last layer. To anchor to a new layer, choose New Layer from the
    Layers menu or click on the New Layer button in the Layers dialog. To anchor to
    the previous active layer, choose Anchor Layer from the Layers menu, or type G-H
    in the image window, or click on the Anchor button in the Layers dialog.


    +   - I saved a finished project''s image to disk, but when I try to view the
    saved image in another image display program, it''s missing elements and it doesn''t
    look like the one I saved. Why is this?


    Not all image formats support layers or transparency (JPEG is one example). For
    finished projects that are saved to formats supporting alpha channels, use the
    Merge visible Layers function from the Layers menu before saving. If alpha is
    not supported, use Flatten Image from the Layers menu instead. Also, read the
    next item.


    +   - I spent hours working on an image with multiple layers, channel masks, layer
    masks, and paths and then saved it. But when I tried to reload my image back into
    the GIMP, everything but a single layer was gone! What happened?


    Work in progress and finished projects should be saved in the GIMP''s native XCF
    format. This saves all the information about layers, masks, and paths.'
  merge: -1
