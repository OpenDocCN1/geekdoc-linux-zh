    # Figure 4.38: Illustrating the Three Basic Selection Problems


    Figure 4.38(b) shows the same image as in Figure 4.38(a), but with the colors
    of the mask inverted. The color inversion is done by making the channel mask active
    and then using the Invert function found in the Image. Inverting the colors inverts
