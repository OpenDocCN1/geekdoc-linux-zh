    mouse is in the image window has the effect of changing the mouse cursor to

    an arrow with $\cap$ sign below it. This indicates that the next selection will
    be

    intersected with any selection already existing in the image window.


    # 3.2.4 USING ADD, SUBRACT, AND INTERSECT WITH THE RECTANGLE AND

    ELLIPSE TOOL FEATURES


    As described in Section 3.1.1, the Shift key can be used to create perfectly

    square or circular selections, and the Control key can be used to perform

    selections centered at the position of the mouse click. In addition, Section 3.2

    describes how the Shift key can be used for adding selections, the Control key

    for subtracting them, and the Shift and Control keys together for intersecting

    them.


    The question you may be asking, then, is how can these features be used

    togogether? How can a perfect square be subtracted from a prior selection or a

    center-initiated ellipse added to one? The answer is quite simple. The trick is

    to remember that adding, subtracting, and intersecting selections is signaled
    by


