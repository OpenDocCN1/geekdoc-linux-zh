- img_proc: true
  md: 'The image shown in Figure 7.25(a) has separated a large part of the work from
    the background to achieve the desired result. First, there are elements of the
    background that must be removed, and second, there are holes in the subject that
    must be filled. Both tasks are relatively easy to accomplish. The background is
    removed by following these steps:


    +   1. Draw a rough selection around the woman''s silhouette using the Lasso tool.
    Make sure the path of the Lasso separates the background from the woman.


    +   2. Invert the selection by typing c-i in the image window. This phase is shown
    in Figure 7.25(c).


    +   3. Choose white as the Active Background Color by typing d and then x in the
    image window.


    +   4. Cut the selection by typing c-x in the image window.


    Figure 7.26(a) shows the result of having cut away the unwanted background. The
    remaining work is to fill in the holes seen in Figure 7.26(a) using the Paintbrush
    tool. As shown in Figure 7.26(b), a medium hard brush is chosen for this. Figure
    7.26(c) shows the *final* mask. Although the lower portion of the woman''s legs
    are not cleanly separated from the background, this is remedied shortly.


    ![](img/32c07c3b65137f501f1232a822a70623_260_0.png)


    Figure 7.26: Using the Paintbrush to Finish the Mask of the Woman'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'The next task is to create a layer mask for the image in Figure 7.24(a) and
    to paste into the grayscale image shown in Figure 7.26(b). This is done in the
    following steps:


    +   1. Invert the black and white regions of the image in Figure 7.26(b) using
    Invert from the Image:Image/Colors menu.

    2. Copy the resulting grayscale image to the default buffer by typing C-c in the
    image window.

    3. Create a layer mask for the image in 7.24(a) by opening the Layers dialog and
    choosing Add Layer Mask from the Layers menu.

    4. Paste the default buffer''s contents into Figure 7.24(a) by typing C-v in the
    image window.

    5. Drop the resulting float into the layer mask by clicking on the Anchor button
    in the Layers dialog.


    The effect of the layer mask on the image is shown in Figure 7.27(a), and the
    thumbnail of the mask can be seen in the Layers dialog shown in Figure 7.27(b).


    ![](img/32c07c3b65137f501f1232a822a70623_261_0.png)


    Now that the layer mask is in place, the remaining parts of the background around
    the woman''s lower legs are removed by painting away the offending parts of the
    layer mask with black paint using the Paintbrush tool.


    The Decomposition and Threshold technique is the easiest method for selecting
    the woman. She presents a relatively difficult selection using any other tool.
    In'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'particular, the outline of her hair would have been an specially thorny problem.
    In comparison, the parts of the fish that are needed for the project present a
    simple outline that can easily be selected using the Bezier Path tool. This step
    is not illustrated, but the Bezier Path tool is described in detail in Section
    3.1.1.


    The selection of the woman and the fish are now united into a single image, as
    shown in Figure 7.28(a). Figure 7.28(b), which shows the Layers dialog, indicates
    that the woman and the fish reside in separate layers. Note that both images have
    been rotated 90° with respect to their original orientations. This properly orients
    our mermaid in preparation for inserting her into her final underwater setting.


    ![](img/32c07c3b65137f501f1232a822a70623_262_0.png)


    At this stage, we are ready to be melding the two image components together. The
    strategy is to take pieces of the fish''s tail and appropriately fuse them onto
    the woman''s body. The fish''s tail is too large to superimpose in one piece;
    thus, it is cut into two parts using the Lasso tool. Using the Move tool, the
