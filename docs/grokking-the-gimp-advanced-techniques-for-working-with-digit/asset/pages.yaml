- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_208_0.png)


    ![](img/32c07c3b65137f501f1232a822a70623_208_1.png)


    Figure 6.14: Using the Measured Pixel Values to Modify the Red Curve


    ![](img/32c07c3b65137f501f1232a822a70623_208_2.png)


    ![](img/32c07c3b65137f501f1232a822a70623_208_3.png)


    Figure 6.15: Using the Measured Pixel Values to Modify the Blue Curve


    The goal in displacing the control points is to make each of the measured pixel
    values neutral neutral. This means making their red, green., and blue components
    equal. In this example, this is accomplished by moving the red and blue control
    points so that their values are made equal to the measured green values. The accurate
    repositioning of the points is made possible by the position Information Field
    displayed in the upper-left corner of the graph area. Note that the numbers positioned
    near the control points in Figures 6.14 and 6.15 are not a feature of the curves
    tool; they are placed there to clarify the procedure.'
