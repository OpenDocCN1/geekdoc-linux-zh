  md: '# 9


    # WEB-CENTRIC GIMP


    The GIMP has many powerful tools for creating interesting and useful graphic components
    for Web pages. In this chapter, you will learn how the GIMP can be used to create
    animated GIFs, clickable image maps, fancy type type styles, and tileable backgrounds,
    all of which are important features for dynamic, exciting Web pages. The chapter
    finishes with a discussion on how to best prepare color images to be viewed on
    the Web using a standard Web browser.


    # 9.1 WEB ANIMATIONS


    A graphic tool often seen on Web pages is the ubiquitous, animated GIF. This is
    an image file format that can contain a sequence of frames combining text, images,
    and timing information to create a flip-book-like movie. As you will see in this
    chapter animated GIFs are easy to create, edit, and view in the GIMP.


    # 9.1.1 USING GIF FILES FOR ANIMATION


    The GIMP can save animations to several different file formats, but when making
    animations for the Web, the choice is limited to GIFs. GIF stands for Graphics
    Interchange Format, and GIF format files support a number of features that are
    particularly useful for Web graphics.


    First, GIF is an 8-bit-per-pixel format, which means that with careful planning
    a GIF can be almost always properly displayed on systems providing only 8 bits
    of color (see Section 9.5). Second, GIFs allow for transparency, a feature not
    supported by JPEG (Joint Photographic Experts Group), the other principle file
    format for images on the Web. Third, GIFs support'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'interlacing which may be of interest for the transmission of images over low
    bandwidth networks. Finally, the GIF format supports layers and attached layer
    timing information. This last feature is the one exploited for GIF animations.


    # 9.1.2 GIMP LAYERS CAN BEHAVE LIKE ANIMATION FRAMES


    Animations are sequences of images that can be played according to timing information
    attached to each layer. The GIMP has built-in support for animations because each
    layer in an image can be treated as an animation frame by the GIMP. The GIMP supports
    this equivalence by allowing timing information to be attached to layers, by providing
    a tool for playing layered images as animations, and by supporting the conversion
    of layered images to format and output as GIF files.


    Figure 9.1 illustrates some of the GIMP''s built animation features. Figure 9.1(a)
    shows an image that consists of five layers. The organization of the layers is
    seen in the dialog shown in Figure 9.1(b). This image is constructed by creating
    an image with a white background, and then adding new layers, each containing,
    in sequence, one of the four letters G, I, and P. The letters were colored using
    the Bucket fill tool.


    Notice that each layer is named and the names contain timing information used
    for the frame animation. The timing information is indicated by the text in the
    format (XXXXms), where XXXX is a 1 to 4 digit number, and ms indicates the units
    of the number are in milliseconds. The parentheses are a required part of the
    format. Thus, for example, the Background layer appears empty for 1 second (1000ms)
    followed by the four letters appearing at intervals of 100ms, 400ms, 600ms, 800ms.
    Name and timing information is added to each layer by double-clicking the layer
    title area to the right of the thumbnail as described in Section 2.1.1.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_311_0.png)


    The animation in Figure 9.1(a) can be viewed in the GIMP using the Animation Playback
    tool found in the Image:Filters/Animation menu. As you can see in Figure 9.1(c),
    the tool consists of a Play/Stop button, a Step button, which allows the animation
    to be stepped along a frame at a time, and a Rewind button, which can be used
    to set the animation back to the first frame. This last button is particularly
    useful if there a very large number of frames. The Animation Playback tool plays
    the animation associated to the image using the timing information as specified
    in the name of each layer. Note that there is also a progress bar that shows the
    animation''s current frame number.


    By default, GIMP weaves present frames sequentially using the Combine mode. This
    means that as each new frame is displayed, it is stacked on the previous one.
    Thus, if a new frame is partially transparent the previous frame can be seen through
    its transparent parts. This is not the traditional movie paradigm for animation,
    instead of combining frames, replaces each frame with a new one. Consequently,
    although the frames in Figure 9.1 all consist of single letters on a transparent
    field, the animation spells out the word GIMP a letter at a time on the white
    background of the first layer.


    Figure 9.2 illustrates the same example as in Figure 9.1, except now each layer
    uses Replace instead of Combine mode in the animation sequence. The Layers dialog
    in Figure 9.2(b) shows that the Replace mode is specified by typing the text (replace)
    in the title field of each layer. The Animation Playback'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'tool shown in Figure 9.2(c) shows the animation at the same point in the sequence
    as before. However, now, due to Replace mode used, the white background and the
    red letter G are not visible. There is only the green letter I on a transparent
    background. This is the traditional movie paradigm for animation.


    ![](img/32c07c3b65137f501f1232a822a70623_312_0.png)


    Figure 9.2: Example of Replace Mode


    The explicit use of Combine mode can be made by typing the text (combine instead
    of (replace) in a layer title. The two modes can be used together in an animation
    with some frames replacing and others combining.


    # 9.1.3 SAVING ANIMATIONS TO GIF


    The GIMP allows to be made in RGB and Grayscale formats, but an animation must
    be converted to Indexed format before it can be saved as a GIF. Trying to save
    to GIF without being in Indexed format generates an Export File dialog that provides
    the user with information and options to correctly save the image.


    Properly converting to Indexed format is accomplished with the function Indexed
    found in the Image:Image/Mode menu. This brings up the Indexed Color Conversion
    dialog shown in Figure 9.3(b). This dialog has two main options. The first covers
    the Palette options and the second covers the Dither options. The default options
    usually work, but if a particular conversion to Indexed format has problems, refer
    to Section 9.5, which discusses Web-safe color palettes and covers this dialog
    options in detail.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_313_0.png)


    Figure 9.3: Converting to Indexed


    After an image has been converted to Indexed, it can be saved in GIF format. This
    is accomplished by choosing image:File/Save As which brings the Save Image dialog
    shown in Figure 9.4(a). The GIMP automatically saves the file in GIF format if
    the name entered into the entry box at the bottom of the dialog ends with the
    .gif extension. Alternatively, GIF can be selected from the Save Options menu.
    This automatically attaches the .gif extension to whatever name has been typed
    into the entry box.


    ![](img/32c07c3b65137f501f1232a822a70623_313_1.png)


    Figure 9.4: Saving an Animation as a GIF File'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'Clicking the OK button in the Save Image dialog brings up the Save as GIF options
    dialog shown in Figure 9.4(b). Because the image to be saved is multilayer, the
    Animated GIF Options are available. These are not enabled for single layer images.
    The first option specifies whether the animation will loop continuously or not.
    Looping is the default. The next option is an entry box that specifies the time
    per frame for frames that have not been explicitly specified. The default is 100ms.
    For the examples in Figures 9.1 and 9.2, the timing information is given for each
    layer, so this option is irrelevant for these layers. Finally, the animation mode,
    either Replace or Combine, is selected for all frames that have not been explicitly
    specified. The I Don''t Care option defaults to Combine mode.


