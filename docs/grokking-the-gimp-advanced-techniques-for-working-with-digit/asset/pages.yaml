    mouse indicators are particularly useful.


    # 3.2.3 INTERSECTING


    Intersecting two selections means that the resulting selection is, guessed

    it, the selection of the two. Thus, if A is the set of pixels defined by the first

    selection and B the set for the second, A\cap B is the result of intersecting
    the

    two. The intersection is made by pressing the Shift and Control keys together

    before the left mouse button to begin the new selection. The Control

    Shift keys should be released before releasing the mouse button. The

    result of intersecting an ellipse with a rectangular selection in Figure 3.15(a)

