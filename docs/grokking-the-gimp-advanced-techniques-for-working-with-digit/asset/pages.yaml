    For a foreground pixel whose position in the RGB cube is $[r_1, g_1, b_1]$ and
    a background pixel whose position is $[r_2, g_2, b_2]$, you might imagine that
    the resultant pixel for the Divide blending mode would be analogous to that for
    the Multiply mode. This would suggest like $[255r1/r2, 255g1/g2, 255b1/b2]$. However,
    this expression presents two problems. The first problem is that when the foreground
    pixel has a zero component, the result is not defined; the second problem is that
    when the foreground pixel value is small, the result can be so large that it is
    no longer inside the RGB cube. The first problem is solved by adding one to each
    component of the foreground pixel. This prevents a division by zero. The second
    problem is solved by clipping values that are too large to the surface of the
    cube.


    A succinct expression for the Divide mode is


    ```

    $R=\min\{W,B\cdot\frac{F+1}{256}\}$

    ```


    where $W$ is $255r''255g''255b''$, represents component-wise division of two vectors,
    and min represents component-wise minimization. Figure 5.18(b) illustrates the
    application of Divide to the flower image from Figure 5.15(a).'
