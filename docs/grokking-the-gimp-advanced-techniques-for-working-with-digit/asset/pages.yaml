  md: '# A GIMP RESOURCES


    There are many online resources that can be used to get additional information
    about the GIMP The best place is the GIMP''s home page, which can be found at
    http://www.gimp.org


    This Web Site is full of information and resources for the GIMP. It contains FAQs,
    information about GIMP internals, installation help, and developer information.
    It is also a source for downloading both the current stable and developer''s versions
    of the GIMP, as well as the archive of patterns, palettes, brushes, gradients,
    fonts, and scripts. Finally, this site also points to other sites displaying GIMP
    art, and to other important links.


    There are two other sites related to www.gimp.org: http://registry.gimp.org http://manual.gimp.org


    The first site is the repository for GIMP plug-in filters. This is where the latest
    versions of new and old filters can be found. The second site is the online reference
    manual written by Olof and Karin Kylander. This manual is also available as a
    printed book.


    A great place to ask questions about the GIMP is on the newsgroup: Comp.graphics.apps.gimp


    This is the place to look for answers to questions about the GIMP. As usual with
    newsgroups, it is considered polite to look through older postings for an answer
    before blindly posting your question, which might have already come up three times
    this week.'
  merge: -1
