  md: 'pressing the Shift key, the Control key, or both before clicking to initiate
    the selection. The sequence for creating a perfectly square or circular selection
    or center-initiated selections is by pressing the Shift key, Control key, or both
    after clicking to initiate the selection. These features can be combined by applying
    the following steps:


    +   1. Begin by pressing the appropriate combination of Shift and Control to specify
    whether the selection is to be added to, subtracted from, or intersected with
    an already existing selection.


    +   2. While the keys are pressed, click and drag in the image window to initiate
    the new selection.


    +   3. While the left mouse button is pressed, release the Shift and/or Control
    keys.


    +   4. Apply the appropriate combination of Shift and Control keys to specify
    a perfectly square, circular, and/or center-initiated selection.


    +   5. While keeping the last combination of Shift and Control keys pressed, release
    the mouse button, completing the selection.


    # 3.2.5 MOVING A SELECTION BOUNDARY


    Occasionally it is useful to be able to move a selection after it has been made.
    That is, it is useful moving the selection itself, not the selection contents.
    This can be done by Alt-clicking and dragging the selection boundary.


    # 3.3 THE SELECT MENU AND FRIENDS


    Complementary to the selection tools are the 12 functions in the Image:Select
    menu. In addition to these functions, there are five other important functions
    related to selections. These are Toggle Selection, found in the Image:View menu,
    and Copy, Cut, Paste, and Stroke, found in the Image:Edit menu. Each of these
    functions is described in this section.


    # 3.3.1 THE INVERT FUNCTION


    A selection partitions an image into two sets—the selected pixels and the unselected
    ones. It is often useful to invert a selection, which is just the swapping of
    these two sets. When inverting, the unselected pixels become selected and vice
    versa. The command that does is Invert from the Image:Select menu. The Invert
    function is used so often you''ll want to remember the keyboard shortcut for it,
    which is C-1.


    # 3.3.2 THE ALL FUNCTION


    The function All in the Image:Select menu selects everything in an image. If the
    active layer in the image is smaller than the largest layer, the selection is
    clipped to the boundaries of the active layer. I personally don''t find this to
    be a very useful command.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# ### 3.3.3 THE NONE FUNCTION


    The function None in the Image:Select menu deselects everything in an image. This
    is very useful, as will be seen in the ensuing chapters. The keyboard shortcut
    for this command is C-S-a.


    # ### 3.3.4 THE FLOAT FUNCTION


    A selection can be made into a floating selection by choosing Float from the Image:Select
    menu. Floating selections were discussed in Section 2.5. A useful application
    of Float is described in Section 2.6.2.


    # ### 3.3.5 THE FEATHER FUNCTION


    Feathering was explained in Section 3.1.2. Normally a feather is applied by toggling
    the Feather checkbox in the selection tool''s Tool options dialog before making
    the selection. However, it is possible to apply a feather after the selection
    has been made by choosing Feather from the Image:Select menu.


    # ### 3.3.6 THE SHARPEN FUNCTION


    The concept of a partially selected pixel was introduced in Section 3.1.2, in
    the discussion on antialasing, and was extended in the discussion. The function
    Sharpen, from the Image:Select menu, removes partially selected pixels in an image
    by transforming them into fully selected pixels, and by fully deselecting all
    the remaining pixels. Thus, this sharpens the active selection (not the image)


    # ### 3.3.7 THE SHRINK FUNCTION


    It is sometimes useful to be able to shrink a selection a little. If a selection
    has been made with a tool like the Magic Wand or with the By Color selection,
    it is possible that the resulting selection is a little too large. The Shrink
    function, found in the Image:Select menu, shrinks the boundary of the current
    selection by the amount specified in the dialog. The default unit is 1 pixel,
    but other values can be chosen.


    # ### 3.3.8 THE GROW FUNCTION


    In contrast to Shrink, the function Grow, from the Image:Select menu, grows the
    boundary of the current selection by the amount specified in the dialog. The default
    unit is 1 pixel.


    # ### 3.3.9 THE BORDER FUNCTION


    The Border command, found in the Image:Select menu, replaces a selection with
    just those pixels within a specified radius of the selection edge. Thus, this
    function creates a selection of the border around the previous selection''s edge.'
