  md: '# 5.6.4 The Darken Only Lighten Only Blending Modes


    Darken creates a resultant pixel that retains the smallest components of the foreground
    and background pixels. Thus, if the foreground pixel has the components [r1, g1,
    b1] and the background [r2, g2, b2], the resultant pixel is [min(r1,r2), min(g1,g2),
    min(b1,b2)]. This is expressed compactly as


    R=min(F,B)


    where min means component-wise minimization. Not surprisingly, Darken Only mode
    makes an image darker.


    ![](img/32c07c3b65137f501f1232a822a70623_181_0.png)


    Lighten Only mode has the opposite action of Darken Only. It selects the maximum
    of each component from the foreground and background pixels. The mathematical
    expression for Lighten Only is


    R=max(F,B)


    where max means component-wise maximization. Lighten Only mode makes an image
    lighter.


    Figure 5.19(b) illustrates the use of Lighten Only mode on the flower image from
    Figure 5.15(a). Now, everything in the flower that has an RGB component lighter
    than 127 retains its character in the image. The parts of the flower image that
    are darker are replaced by the flat gray.'
  merge: -1
