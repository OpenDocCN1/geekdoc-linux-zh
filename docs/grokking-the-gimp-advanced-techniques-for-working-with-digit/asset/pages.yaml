- img_proc: true
  md: 'A perfectly square selection can be made with the Rectangle Select tool, and
    a perfectly circular selection can be made with the Ellipse Select tool. The trick
    is to use the Shift key, but read on carefully. Two other selection tricks are
    also performed with the Shift key (see Section 3.2 for the other). To avoid confusion,
    it is important to pay close attention to how this works.


    To obtain a perfectly square or circular selection, begin the selection by clicking
    and dragging in the image window. While the mouse button is down, press the Shift
    key. In the image window, the resulting selection shape becomes a perfectly square
    or circular, depending on the tool you are using. The Shift key must remain pressed
    until the selection is finished and the mouse button has been released. Only then
    may the Shift key be released. If the Shift key is released before the left mouse
    button, the selection will revert to a normal rectangle or ellipse selection.
    The results of using the Shift key with the Rectangle Select and Ellipse Select
    tools are illustrated in Figure 3.3.


    ![](img/32c07c3b65137f501f1232a822a70623_82_0.png)


    Figure 3.3: Making Perfectly Square and Circular Selections with the Rectangle
    Select and Ellipse Select Tools


    Instead of initiating a rectangular or elliptical selection at one corner and
    terminating at the one, it is also possible to initiate from the selection''s
    center, terminating at a corner. The trick for this is similar to the technique
    just described for creating a perfectly square or circular selection. It is done
    by pressing the Control key after initiating the selection with the left mouse
    button. The Control key must remain pressed until the mouse button is released.
    To combine perfectly square or circular selections in conjunction with center
    initiated ones, the Shift and Control keys must both be pressed after the left
    mouse button is clicked and remain so until the mouse button is released.'
  merge: -1
