  md: '# 4.3.5 BLURRING OF MASKS AND OTHER EFFECTS


    Section 3.1.2 discussed an edge-softening technique called antialasing and an
    edge-blending technique called feathered. Effects similar to antialasing and feathered
    can be had by applying blur filters to masks.


    White pixels in a mask correspond to selected pixels in an image layer, and black
    pixels in the mask correspond to unselected image pixels. If there are no gray
    pixels between the black and white zones, this gives the selection edges represented
    by the mask the harsh edge already seen in the discussion on antialasing. Blurring
    a mask softens the sharp edges in the mask by creating a graded zone of gray between
    the regions of black and white pixels. The width of the gray zone is controlled
    by the blur radius. The gray zones correspond to partially selected pixels in
    the image layer, and this is what creates the antialasing/feathering effect for
    masks.


    Figure 4.30 is used to illustrate the use of blur filters on masks. Figure 4.30(a)
    shows an image of a wood duck, and Figure 4.30(b) shows a channel mask representing
    a selection of it. Figure 4.30(c) shows the associated Channels dialog.


    ![](img/32c07c3b65137f501f1232a822a70623_138_0.png)'
  merge: -1
  pgno: 138
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_139_0.png)


