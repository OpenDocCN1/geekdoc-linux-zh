- img_proc: true
  md: 'Figure 7.20 is a blend of the two layers, in many ways it misses the mark.
    The blend of the two images shows the shuttle against the background of Saturn,
    however, the lower part of the ringed planet is covered by the blue sky background
    of the shuttle launch image. This doesn''t look natural, and it would be nice
    to keep the shuttle and launch vehicle well defined while simultaneously blending
    the background into the Saturn image in a more delicate manner. Fortunately, this
    can be accomplished using a very clever masking technique.


    The idea is to combine two masks into one using a blending mode. The first mask
    is made from the shuttle and launch equipment, and the second mask is made from
    a gradient. The two masks are combined using the Darken Only blending mode. Read
    on!


    The implementation of the idea requires a mask of the shuttle equipment. The mask
    is made using the Compose and Threshold technique described in Section 4.5.3.
    The Compose function with the HSV option is used to create a hue, saturation,
    and value decomposition of the Space Shuttle layer. On inspection of the result,
    the Hue channel seems to have the most potential for a simple separation of the
    subject from its background. The Threshold tool is used on the Hue channel, and
    when the best threshold range has been determined and some cleanup has been performed
    using the Lasso tool, the result is as shown in Figure 7.21. This black and white
    image is not a perfect mask, but some of the defects will be removed in a moment,
    and the rest will not matter.


    ![](img/32c07c3b65137f501f1232a822a70623_255_0.png)


    Figure 7.21: Creating a Mask of the Space Shuttle Layer'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'The next step is to copy and paste the grayscale image from Figure 7.21 into
    the layer mask of the Saturn layer in Figure 7.20. This is done as follows:


    +   1. The layer mask of the Saturn layer is made active by clicking on its thumbnail
    in the Layers dialog.


    +   2. The grayscale image in Figure 7.21 is copied into the default buffer by
    typing G-c in its image window.


    +   3. The contents of the buffer are then pasted into the image of Figure 7.20
    by typing G-v in its image window.


    +   4. This creates a floating selection that is dropped into the layer mask by
    clicking on the Anchor button in the Layers dialog.


    At this point, the layer mask is cleaned up using the Airbrush tool. The technique
    is described in detail in Section 4.5.1 for a channel mask. Here, the method is
    applied to a layer mask. To facilitate the cleanup, the opacity of the Saturn
    layer is adjusted by the Opacity slider in the Layers dialog.


    The resulting layer mask allows the shuttle and launch equipment to be seen through
    the Saturn layer. The state of the project is shown in Figure 7.22(a), and Figure
    7.22(b) shows the thumbnail of the resulting layer mask in the Layers dialog.


    ![](img/32c07c3b65137f501f1232a822a70623_256_0.png)


    Figure 7.22: Application of the Space Shuttle and Launch Equipment Layer Mask


    Project 3: Destination Saturn 245'
  merge: -1
