- img_proc: true
  md: 'To summarize, this project illustrates how layer masks, in conjunction with
    many other tools, can be used to literally fuse together image elements. This
    project also shows that the Border tool can be used to finesse the edges of composited
    images.


    # 7.5 PROJECT 5: PANORAMAS


    By piecing together a series of normal photographs, panoramic and wide angle views
    can be created in the GIMP! The approach of piecing together a group of images
    to create a panorama instead of using special purpose camera lenses gives rise
    to a number of photo inconsistencies among the individual pieces of the image.
    Nevertheless, the GIMP is perfectly capable of correcting these problems and creating
    a well integrated whole. This chapter describes the problems involved in creating
    panoramas from collections of individual images and how to overcome them in the
    GIMP.


    To create a panorama from a collection of photos, the steps are well defined.
    First, the photos have to be grouped together into a single image, each placed
    into a separate layer. The procedure for this has been explained many times already
    in this book. In particular, Section 2.4 describes the copying and pasting of
    images into layers, and Section 2.6.1 explains how to position layers within an
    image.


    Figure 7.35(a) illustrates a set of images, each taken with about 50% overlap,
    using a digital camera. They were stored in JPEG file format and individually
    loaded into the GIMP. Each was then copied and pasted into a separate layer in
    a single image. Each layer was then positioned using the Move tool. The Opacity
    slider in the Layers dialog was used to facilitate the positioning of each layer.


    Figure 7.35(a) shows the result after positioning the layers as well as possible,
    and Figure 7.35(b) shows the organization of the layers in the Layers dialog.
    The layers are named with the letters of the alphabet, A through E, where A corresponds
    to the rightmost layer and E to the leftmost.


    Figure 7.35 illustrates the primary problems that must be overcome to achieve
    a consistent looking panorama. As shown, these problems are geometric distortion,
    color matching, and brightness matching. Each of these is addressed in the following
    sections.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# 7.5.1 Correcting GEOMETRIC Distortions


    The first step after the initial positioning of the individual layers is to remove,
    as much as possible, the geometric distortions. Figure 7.35(a) has distortions
    that can be seen in several places. The two most flagrant problems are the molding
    around the ceiling of the room and the alignment of the grain in the hardwood
    floor, especially on the left side of the image. However, there are also many
    other details in the image that are slightly off kilter. Also, there are several
    places where elements of the images do not line up properly.


    The first step is to correct for the misalignment problems. Using the Scale option
    of the Transform tool, some of the layers are squeezed in an effect to make them
    more consistent with the others. A very important guideline, however, is that
    there are limits to what can be done without introducing other serious mismatches.
    The goal is to adjust, but with a light hand.


    ![](img/32c07c3b65137f501f1232a822a70623_268_0.png)


    Referring again to Figure 7.35(a), perhaps the biggest inconsistency is that the
    vertical scale of the image in layer C seems to be larger than the others. This
    explains the lack of registration of the ceiling molding and the fireplace mantle
    for the layer. The remaining details might be acceptable defects. This will be
    reevaluated after the most important corrections are made.


    Before you begin, it is worthwhile to point out that all of the Transform tool
    options, Scaling introduces few artifacts. This is especially true when care is
    taken to maintain the aspect ratio between the horizontal and vertical dimensions.
    The Scaling option of the Transform tool can be constrained to preserve aspect
    ratio by pressing the Control and Alt keys together while scaling.'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'Figure 7.36(a) illustrates the result of using the Transform tool to adjust
    layer C. As shown in Figure 7.36(b), the tool is used with the Scaling option.
    The upper-right corner of layer C was adjusted both the X and Y Scale Ratios shown
    in the Scaling Information dialog became 0.95.


    ![](img/32c07c3b65137f501f1232a822a70623_269_0.png)


    Figure 7.36: Initial Geometric Distortion Corrections


    How was the value 0.95 determined? The answer depends on whether you are challenged
    by ratios. If not, the swiftest way is to use the Measure tool to determine that
    the height of the molding at the left edge of layer C is 271 pixels from layer
    C''s bottom edge, and that the height of the molding in layer D at layer C''s
    left edge is 258 pixels. This makes the ratio 258/271=0.95. If you do not like
    ratios, a simple trial-and-error approach does not take much more time. Just choose
    a scaling factor and use-z to perform an undo if the scale isn''t correct. The
    result of the scaling operation aligns the molding on the ceiling between layers
    C and D.


    As noted, the upper-right corner of layer C was used to perform the scale. Thus,
    layer C has shrunk horizontally by 5%, shifting its right edge to the left. This
    means that properly register with layer C, layers A and B must now be repositioned
    to the left.


    # 7.5.2 COLOR AND BRIGHTNESS MATCHING


    You can see that there is significant brightness variation from layer to layer
    in Figure 7.35. This is normal for photos taken with most consumer digital and
    regular film cameras. These cameras typically auto-expose scenes according to
    average lighting conditions and do not offer user controls for exposure. For the
    image in layer A of Figure 7.35, the light coming from the windows is very


    258 Compositing'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'bright, which due to the average light metering of the camera, causes the features
    of the room to be underexposed. Thus, the room features in this layer are a bit
    darker than in the other layers. Otherwise, the brightness of the other layers
    are more or less consistent with each other.


    In addition to the brightness mismatch between layers, you can also see from Figure
    7.35 that there is a color mismatch from layer to layer. The combination of color
    and brightness variations means that the layer boundaries are plainly visible
    instead of presenting a smooth and imperceptible transition across the panorama.


    The strategy for correcting the differences in brightness and color is to use
    the curves tool to match color at boundaries between layers using a method similar
    to that described in Section 6.2.2. The method measures pixel values on both sides
    of a layer boundary using the Color Picker tool. The curves tool is then used
    to match the values. This procedure corrects for both color and brightness mismatch
    simultaneously.


    Matching the color and brightness of two layers has a chain reaction in a panorama
    project. Matching layer B to its neighbor A means layer C must be matched to B,
    and so on. Thus, some care must be taken to blowing blowing the available tonal
    range. Typically, the wisest decision is to choose the layer of average brightness
    and to match the other layers working away from this one. However, for this panorama,
    it is layer E that is chosen as the reference because its lighting for the room
    seems the most natural. The work flow, then, from the leftmost layer to the rightmost,
    from layer E to layer A.


    Starting with the boundary between layers E and D, a pixel value was measured
    on the white wall just above the waistscoting.The measured values are 177-183-194ᵇ
    to the left of the boundary and 153-156-171ᵇ to the right. Using this information,
    the curves tool is used on layer D to match the pixel values in D to those of
    layer E. Representative pixels are then measured across the boundary between layer
    D and layer C. Here, the measured pixel values are located at the midpoint between
    the mantle and the molding. The values are found to be 179-175-185ᵇ to the left
    of the boundary and 118-119-130 to the right. The curves tool is employed again,
    this time layer C, matching C pixel values to those of D''s.


    Continuing with the boundary between layers C and B, the measured pixel values
    at a midpoint between the mantle and the molding are 201-197-211ᵇ to the left
    and 101-99-112ᵇ to the right. The final boundary is between layers B and A. Here
    the pixels are measured at the midpoint between the plant and the molding. The
    values are found at 199-198-208ᵇ and 86-75-81ᵇ. The curves tool is applied for
    each of these boundaries, as it was for the first two.


    ![](img/32c07c3b65137f501f1232a822a70623_270_0.png)'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'The results of the color and brightness matching operations are shown in Figure
    7.37. The overall color and brightness of the images are now much more consistent.
    However, there continues to be a sufficient mismatch between the layers to perceive
    the layer boundaries. Fortunately, this visual defect can be corrected using a
    layer mask blending technique described in the next section.


    ![](img/32c07c3b65137f501f1232a822a70623_271_0.png)


    Figure 7.37: Initial Color and Brightness Matching


    # 7.5.3 BLENDING


    The remaining color mismatches at layer edges can be corrected using layer masks.
    The idea is to blend the edges using a gradient in a layer mask. The technique
    of layer blending using a gradient in a layer mask is discussed in Section 4.3.3.


    Figure 7.38(a) shows the remaining color mismatch at the edge between layers A
    and B. Figure 7.38(b) shows a layer mask created for layer A. This mask is a black-white
    gradient where the black point is placed at the left edge of the mask and the
    white point slightly to the right of this. This layer mask has the effect of making
    the left side of layer A''s boundary semi-transparent, letting layer B show through.
    The end result is the two layers are blended in this small band removing the visibility
    of the boundary. Figure 7.38(c) illustrates the Layers dialog showing that four
    of the five layers have layer masks added. This makes one layer mask for each
    boundary.


    Figure 7.39(a) shows again, the boundary between layers A and B before blending.
    Figure 7.39(b) shows the result after blending. As you can see, the technique
    is very effective. However, some experimentation was necessary to find the correct
    width for the gradient blend.


    * Compositing'
