  md: '# ## 5.9 COMMON PROBLEMS AND FREQUENTLY ASKED QUESTIONS


    The following are a few common problems that arise working with colorspaces and
    blending modes:


    +   - I want to apply a blending mode with the Paintbrush (Pencil, Bucket Fill
    F1, and so on) tool. Although I''ve set the blending mode in the Layers dialog,
    it doesn''t seem to work.


    The problem is that the blending modes for the painting tools are controlled from
    the Brush Selection dialog, not from the Layers dialog. Type C-s-b in the image
    window or click on the Active Brush in the Toolbox window to bring up this dialog.


    +   - I''m using the Paintbrush (Pencil, Bucket Fill, and so on) tool, and I''m
    getting strange color results. What''s going on?


    Check that the Brush Selection dialog''s blending mode is set to Normal.


    +   - I want to color a black-and-white image, but no matter what color I apply
    it comes out as a shade of gray in my image. Why?


    You are working on a grayscale format image. Convert the image to RGB by selecting
    the function RGB from the Image:Image/Mode menu.'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# 6

    TOUCHUP AND ENHANCEMENT


    Photos that are scanned or come from a PhotoCD or digital camera suffer from both
    aesthetic and processing defects. These defects can be due to problems of contrast,
    color casts, color saturation, tonal range, blur, scratches, and so on. Furthermore,
    most photos, no matter how carefully composed, typically need some enhancement
    to achieve their full potential. Ansel Adams, one of America''s most renowned
    photographers, spent as much time in the darkroom enhancing his negatives and
    prints as he did in composing and taking his shots. Adams'' books on working with
    the negatives and the print are classics in photography⁷


    Photo touchup and enhancement are part science and part art, the GIMP is an excellent
    tool for these on both counts. This chapter describes the main ideas for aesthetically
    improving photos and explains how to use the GIMP to achieve terrific results.
    Following are the topics addressed in this chapter:


    +   * Improving tonal range

    * Removing color casts

    * Repairing blemishes

    * Sharpening


    Each of these subjects is described in detail in the following sections, and a
    case study is presented at the end of the chapter.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# 6.1 IMPROVING TONAL RANGE


    The tonal range of an image is the first step that should be taken in almost every
    effort to touch up and enhance a photo. To do this, it is necessary to understand
    the basic elements of tonal range and the tools the GIMP provides to measure and
    affect it.


    # 6.1.1 HIGHLIGHTS AND SHADOWS


    What is tonal range? To answer this question, let''s look at the grayscale photo
    shown in Figure 6.1(a). The figure shows a tiger image consisting of a complete
    range of grayscale values from 0, or completely black, to 255, fully white. Furthermore,
    from the histogram in Figure 6.1(b), you can see that the distribution of pixel
    values in the image smoothly covers the entire range. The histogram shown in Figure
    6.1(b) is part of the Levels tool, which is discussed in the next section.


    ![](img/32c07c3b65137f501f1232a822a70623_196_0.png)'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'The lightest part of an image is called the *highlight*, and the darkest is
    the *shadow*. It is important to note that not all images will have the maximum
    highlight of 255 and/or the minimum shadow of 0. The tonal range of an image is
    just the numeric difference between its highlight and its minimum shadow. You
    will see shortly that measuring highlight and shadow values is useful for performing
    image enhancement, but before developing this idea, let''s examine why tonal range
    is so important.


    Having a full tonal range is generally a good thing. A full tonal range has, in
    a general sense, the fullest possible contrast. To illustrate this idea, the tonal
    range of the image in Figure 6.2(a) can be synthetically diminished by setting
    the output sliders of the *Levels* tool to well within the range of 0 to 255.
    This adjustment is shown in Figure 6.2(b), and the result is shown in Figure 6.2(c).
    Here, you can see the effect of compressing the tonal range. Figure 6.2(b) shows
    the settings of the *Levels* tool used to limit the tonal. Notice that the resulting
    contrast of the image in Figure 6.2(c) is much poorer than the contrast in Figure
    6.2(a) with the smaller tonal range looks muddy and washed out in comparison to
    the original.


    ![](img/32c07c3b65137f501f1232a822a70623_197_0.png)


    ![](img/32c07c3b65137f501f1232a822a70623_197_1.png)


    ![](img/32c07c3b65137f501f1232a822a70623_197_2.png)


    Figure 6.2: Limited Tonal Range'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'This example is based on a grayscale image whose tonal range has been synthetically
    impoverished. Nevertheless, the conclusions that can be drawn from it are general.
    However, sometimes maximizing tonal range is usually a great way to enhance an
    image. It is better not to maximize the tonal range. An image of white lace gloves
    on a white linen tablecloth background is such an image. Under these circumstances,
    there is a subtle interplay of whites and off-whites in the image, and a deep
    black shadow is most undesirable. In most cases, however, getting the most tonal
    range out of an image improves contrast, which in turn significantly enhances
    the image.


    # 6.1.2 Using the Levels Tool


    The Levels tool used in the Image:Colors menu, and it was used in the previous
    section to examine the tonal range of a grayscale image. The features of this
    tool and how it can be applied to color images is discussed in detail here.


    Figure 6.3 illustrates the Levels diagram. Note that the Channels menu is open
    in the figure, showing five different channels that can be displayed and modified.
    Because we are interested in color correction, only the Red, Green, and Blue channels
    apply in this section.


    ![](img/32c07c3b65137f501f1232a822a70623_198_0.png)


    Figure 6.3: The Levels Tool


    The histogram is a very important feature of the Levels tool because it immediately
    shows whether a channel occupies its entire tonal range or not. Just below the
    histogram is a grayscale called the input value domain. In this grayscale, black
    represents pixel values of 0 and white values of 255. Thus, for'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'the Green channel shown in Figure 6.3, the black of the input value domain
    represents dark values of green and the white brightness values of green.


    Having no histogram over a part of the input value range means that there are
    no pixels in the image having these values. Thus, in Figure 6.3, you can see that
    there is a lack of tonal range because there are significant parts of the upper
    and lower input value range that have no histogram values over.


    The remaining features of the Levels dialog are for adjusting the distribution
    of the histogram. The leftmost and rightmost arrows of the input control slider
    are used for stretching the tonal range of the image; the middle arrow can be
    used to warp the range. The leftmost arrow is the shadow control arrow, the rightmost
    is the highlight control arrow, and the middle is the midtone control arrow. The
    arrows of the output control slider are used for shrinking the tonal range. Adjustments
    to the control arrows can be made interactively by clicking and dragging them.
    The arrows can also be controlled numerically by entering values for the min,
    gamma, and max input levels or for the max output levels.


    The following example shows how the adjustment features of the Levels tool function.
    Figure 6.4 shows an image that has a severely compressed tonal range. This can
    be seen by looking at the distribution of pixel values in the Red, Green, and
    Blue channels shown in Figures 6.5(a), (b), and (c), respectively. The figure
    shows that the Red channel has the poorest tonal range. The Green and Blue channels,
    which are similar to each other, have tonal ranges that are hardly much better.


    ![](img/32c07c3b65137f501f1232a822a70623_199_0.png)


    Figure 6.4: Image of Deep Sea Turtle Having Compressed Tonal Range'
  merge: -1
  pgno: 199
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_200_0.png)


    Figure 6.5: Levels for R, G, and B Channels


    Figure 6.6 shows how the input shadows and highlights have been set for each of
    the channels, and the resulting image is in Figure 6.7 which shows that this simple
    readjustment of levels, producing a maximum tonal range, has greatly improved
    the image. The turtle now seems to pop off the page, and the depth of field seems
    almost three dimensional. In comparison, the turtle in Figure 6.4 seems flat,
    the colors are muddy, and the image lacks life.


    ![](img/32c07c3b65137f501f1232a822a70623_200_1.png)


    Figure 6.6: Levels for R, G, and B Channels with Adjusted Input Control Arrows


    Improving Tonal Range 189'
  merge: -1
  pgno: 200
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_201_0.png)


    The maximization of an image''s tonal range using the Levels tool can introduce
    color casts (see Section 6.2 for a definition of color casts). In fact, the turtle
    in Figure 6.7 appears to have a slight magenta cast. But don''t worry! Color casts
    introduced using the Levels tool can be corrected using the Curves tool, which
    is treated in the next section.


    A final note before leaving this section is appropriate. The Levels dialog shown
    in Figure 6.3 shows a button labeled Auto Levels. This pretty much automates what
    has been described in this section. That is, it maximizes the tonal range in the
    Red, Green, and Blue channels. In fact, it moves the shadow and highlight control
    sliders for each channel to about the 5% and 95% points of the histogram. After
    applying Auto Levels, any of the Red, Green, or Blue channels can be reviewed
    and modified.


    # # 6.2 Removing Color Casts


    A color cast occurs when the Red, Green, and Blue channels of an image are not
    properly balanced. The cast can be across the entire range of pixel values or
    limit itself to the highlight, shadow, or midtones of the image. Color casts are
    common in photographs. They occur because, under certain circumstances, the sensitivity
    of film to color is different from the sensitivity of the human eye. The film
    doesn''t record the scene as you see.


    Removing color casts requires being able to identify where the color in an image
    has gone wrong. I often have a hard time telling, by looking at an image, if it
    is suffering from a color cast. This is due to many reasons. First, color is a
    perceptual issue that is strongly affected by surrounding light'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'conditions. Second, the representation of color value varies from one computer
    monitor because another settings such as brightness, contrast, gamma, and color
    temperature can be quite different. Furthermore, the ability of a monitor’s phosphates
    to create levels of red, green, and blue light will differ from monitor to monitor
    and change over time as the monitor agents.


    All this makes the perceptual evaluation of color casts difficult for the average
    person. Fortunately the GIMP provides some analytical and interactive tools for
    determining whether color casts exist and for correcting them. There are several
    techniques for identifying, measuring, and correcting color casts. Each approach
    uses the powerful curves tool, which is reviewed in the first part of this section.


    # 6.2.1 THE CURVES TOOL


    The Curves tool is found in the Image:Image/Colors menu. Figure 6.8 illustrates
    the basic components of this tool. As with the levels tool, the Curves tool can
    be applied to any of five different channels; however, for removing color casts,
    we are mainly concerned with the Red, Green, and Blue channels.


    ![](img/32c07c3b65137f501f1232a822a70623_202_0.png)


    Figure 6.8: The Curves Tool


    The main elements of the tool consist of an input value domain, an output value
    range, and a control curve drawn on a graph. The graph has a grid divided into
    quarters, and the range of values is from 0 to 255. Thus, the value of each grid
    line moving horizontally from left to right, is 0, 64, 128, 192, and 255. The
    values moving vertically from bottom to top are the same.'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'The control curve represents a map of the input value domain to the output
    value range. That sounds pretty abstract! What good mapping is mapping to output
    values? The executive, top-level answer is that curve mapping of input values
    is the most powerful color correcting tool in the GIMP, and learning how to use
    it is definitely worth your time. More mapping input to output values and what
    it''s good for in a moment...


    Figure 6.9 illustrates the main operation we can perform with the curves—that
    is, adding a control point to the control curve as in Figure 6.9(a), and moving
    it to a new position as in Figure 6.9(b). Control points can be added to the curve
    simply by clicking on the curve at the desired location. The point can be moved
    by clicking and dragging it. If the cursor is not on the curve when the mouse
    button is clicked, a control point is added to the curve at the position directly
    above (or below) the cursor. This new point is then automatically positioned to
    the cursor location.


    ![](img/32c07c3b65137f501f1232a822a70623_203_0.png)


    Figure 6.9: Adding and Moving a Control Point


    Every curve has two default control points located at the upper and lower left.
    These can be moved just like user-created control points. All control points except
    the defaults can be removed by clicking on the Reset button in the dialog. If
    many control points have been positioned and a one needs to be removed you can
    remove it by dragging it with the mouse to the left or right edge of the dialog.
    This pulls the control point right off the curve.


    The Curves tool also has an Information Field that actively indicates the X and
    Y positions of the mouse cursor whenever it is in the graph area of the dialog.
    This field is located in the upper-left corner of the graph area, and,'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'as you will see, this information is essential for performing precise color
    correction. But first, it is important to get an intuitive feel for how the curves
    tool works.


    Figure 6.10 illustrates a special test case that will help you understand how
    the curves tool affects an image.The figure shows two gradients each using up
    half the tonal range of a grayscale.The upper gradient has values from 0 to 127,
    and the lower gradient has values from 128 to 255.


    ![](img/32c07c3b65137f501f1232a822a70623_204_0.png)


    Figure 6.10: Image with Shadow to Midtone and Midtone to Highlight Gr


    The following illustrates how the curves tool is used to change the tonal range
    of these two gradients. Figure 6.11(a) shows the Value channel of the curves tool.
    A control point has been placed at the midpoint of the midtone and pulled downward
    to a position one quarter of its original height. Initially, when it is a straight
    line, the curve of the curves tool maps each input value to the identical output
    value. However, the curve shown in Figure 6.11 changes that map. Now the input
    values from 0 to 128 are mapped to one quarter of the scale they were Before.
    That is, these values are now compressed into the range of 0 to 32. At the same
    time, the input values in the domain 128 to 255 are stretched to the range of
    32 to 255. This is emphasized by the red dashed lines superposed on the curves
    dialog.


    ![](img/32c07c3b65137f501f1232a822a70623_204_1.png)


    Figure 6.11: Improving the Contrast of the Midtone to Highlight Gradient'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'This means that all the pixels that had values 0 to 128 in Figure 6.10 are
    compressed to a new range of 0 to 32. Thus, much of the detail and contrast between
    neighboring pixel values in this range is lost. This effect can clearly be seen
    in the upper gradient of Figure 6.11(b), which is the result of applying the curve
    in Figure 6.11(a) to the image in Figure 6.10. Simultaneously, the pixel values
    in the domain 128 to 255 are stretched to a new range of 32 to 255. Consequently,
    the contrast of the detail of these pixels is increased, as you can see in the
    lower gradient of Figure 6.11(b).


    A similar analysis can be made for Figure 6.12, which illustrates the opposite
    effect. Here, as shown in Figure 6.12(a), the input value domain from 0 to 128
    is stretched and the input domain from 128 to 255 is compressed. The effect on
    the gradients is shown in Figure 6.12(b). Although these two examples are illustrated
    using the Value channel, the same conclusions hold for the Red, Green, and Blue
    channels.


    ![](img/32c07c3b65137f501f1232a822a70623_205_0.png)


    Figure 6.12: Improving the Contrast of the Shadow to Midtone Gradient


    The conclusion that can be drawn from these two examples is that the curves tool
    can be used for two things. First, ranges of pixel values can be remapped. This
    is particularly valuable when a color channel is out of balance with the others.
    When color imbalances occur, we try to measure which range is out of balance,
    determine what range should be, and use the curves to remap one range to the other.
    This approach is developed in detail in Section 6.2.2.


    The second use is to improve contrast where it is most needed. Often an image
    has a subject that is much more important than the rest of the image. When this
    is the case, it is desirable to give the subject the most detail and contrast
    possible. From the examples, you can see that the curves tool can be used to improve
    contrast. Note, however, that in improving the contrast in one'
  merge: -1
