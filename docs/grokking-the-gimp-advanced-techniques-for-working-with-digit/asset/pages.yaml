- img_proc: true
  md: 'Figure 7.22(a) is almost what we''re looking for. To finish, the boundary between
    the two layers are blended with a gradient similar to the one in Figure 7.20(a),
    but without disturbing any part of the masked shuttle and launch equipment.


    This final touch is achieved by applying a gradient to the layer mask using the
    *Darken Only* blending mode. As described in Section 5.6.4, this method combines
    foreground and background pixels by retaining the darker of the two. Thus, a gradient
    applied using the *Darken Only* mode only changes the layer mask where the gradient
    is darker than the mask. This is just what we are looking for. The shuttle and
    launch equipment will not be affected by the gradient because these parts of the
    mask are already black...can''t get any darker than that!


    Let''s see how it works. To apply the gradient to the layer mask, the following
    steps are used:


    +   1. The layer mask of the Saturn layer is made active by clicking on its thumbnail
    in the Layers dialog.

    2. A linear FG to BG (RGB) gradient is chosen from the *Gradient* tool options
    dialog.

    3. The *Foreground Color* is set to black, and the *Active Background Color* is
    set to white by typing *d* *Only* in the image window.

    4. The blending mode is set to *Darken Only* in the *Brush Selection* dialog.

    5. A gradient is applied to the layer mask by clicking in the image window just
    above the lower edge of the Saturn layer and dragging vertically to a point just
    a little higher up than the shuttle''s wings, before releasing the mouse button.


    The result of this new mask is shown in Figure 7.23(a). Figure 7.23(b) shows the
    corresponding Layers dialog, Figure 7.23(c) shows the *Gradient* tool''s *Tool*
    dialog, and Figure 7.23(d) shows the *Brush Selection* dialog (notice the choice
    of the *Darken Only* blending mode). This produces a lovely collage of the two
    original images.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_258_0.png)


    Figure 7.23: The Final Blended Image


    # # 7.4 PROJECT 4: THE CALL OF THE MERMAID


    The fourth project is a bit more complicated than the third. It uses many of the
    techniques of the first three projects and adds several more. The objective is
    to actually combine image elements from two disparate sources, a young woman and
    a fish, to create a realistic and alluring mythological creature—the mermaid.


    The raw image materials used to create the mermaid are shown in Figure 7.24. The
    first step of this project is to fuse together parts of the young woman and fish
    in a realistic way to create the mermaid. The second step is to place the mermaid
    composite into an appropriate underwater background scene.


    To create the mermaid, the woman and the fish must be selected and united into
    a single image on separate layers. The woman is selected using the Decompose and
    Threshold technique described in Section 4.5.3. The HSV option of the Decompose
    function is chosen, and Threshold is applied to the resulting value component.
    The result is shown in Figure 7.25(a). The range of values used with the Threshold
    dialog is shown in Figure 7.25(b).'
  merge: -1
  pgno: 258
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_259_0.png)


    ![](img/32c07c3b65137f501f1232a822a70623_259_1.png)


    Figure 7.24: Original Images of the Young Woman and the Fish


    ![](img/32c07c3b65137f501f1232a822a70623_259_2.png)


    ![](img/32c07c3b65137f501f1232a822a70623_259_3.png)


    ![](img/32c07c3b65137f501f1232a822a70623_259_4.png)


    Figure 7.25: Using Threshold and the Lasso to Create a Mask for the Woman'
  merge: -1
