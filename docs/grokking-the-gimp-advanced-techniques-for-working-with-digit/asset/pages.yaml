  md: '# SETTING UP YOUR COMPUTER TO GET THE MOST FROM THE GIMP


    This section describes how to optimize the hardware and software configuration
    of your computer to optimize the performance of the GIMP.


    # NOTES ON RAM


    The GIMP executable is about 7MB; however, depending on the size of the GIMP data
    directories (patterns, palettes, brushes, and so on), the memory footprint can
    grow another 2-10MB. In addition, the script-program runs concurrently with the
    GIMP occupies about 2.5MB. Thus, the GIMP requires a minimum of 11.3–19.5MB of
    RAM.


    This is not all, though; because every image loaded into the GIMP requires memory.
    For example, loading an RGB format image will require at least three times the
    number of pixels in the image (one byte per RGB channel and perhaps a byte for
    the alpha channel) per layer. Thus, an image with dimensions 640 × 480 pixels
    containing three equal-sized layers requires from 2.8 to 3.7MB of memory.


    In addition to the memory required to display the image, there is also the memory
    required for the undo cache. This is what allows the GIMP to undo operations to
    an image being worked on.


    The conclusion is to work comfortably in the GIMP—to be able to open images, composite,
    touch, and apply filters—32MB of memory should be considered a minimum. Of course,
    the RAM required will be proportionally for larger images containing multiple
    layers.


    # NOTES ON VIDEO RAM


    The ability to display large images on a video monitor depends on the amount of
    video RAM available on the video card. For example, if the display resolution
    is 1024 × 768 with 8 bits (1 byte) per pixel, the minimum required amount of video
    RAM is 0.79MB. However, working with 8 bits per pixel is paltry, because it only
    allows for 256 simultaneous colors on the screen at one time.


    Increasing the color depth to 16 bits (2 bytes) at a resolution of 1024 × 768
    doubles the required RAM to 1.57MB. This is really the minimum RAM required to
    get reasonable performance from the GIMP, and a higher-performance system might
    have a resolution of 1600 × 1200 with 24 bits (3-bytes) of color per pixel, requiring
    at least 5.76MB of video RAM.


    # NOTES ON SWAP AND GIMP MEMORY MANAGEMENT


    The GIMP uses memory as specified by the Toolbox:File/Preferences dialog. Figure
    4 shows the Environment Settings branch of the Preferences dialog.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'As seen in the figure, the associated entry box for the cache size has the
    default value of 10MB. The cache is a portion of RAM that GIMP reserves for caching
    the images you are working on. If you are working with large images or with many
    medium-sized ones, you can easily exceed this cache size. Under these circumstances,
    the additional required memory is obtained by creating a GIMP swap file in the
    .gimp directory. Since this memory is not necessarily located in RAM, this can
    significantly diminish the performance of GIMP. Thus, if the user has RAM resources
    and is working with large images, it makes sense to increase the 10MB value of
    the cache.


    For example, with 128MB of RAM and the GIMP running as the primary application,
    perhaps a reasonable size for the cache is 50 to 75MB. This number can be tuned
    to the user''s needs. A useful tool for determining how much memory is required
    by your applications is the Linux/Unix command top. This command dynamically shows
    many of the characteristics of running processes on your machine. In particular,
    the column MEM gives the memory used by each process. Using S-m (i, an uppercase)
    makes top display the processes sorted by memory use. The following is a truncated
