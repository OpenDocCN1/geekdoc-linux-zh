    # 2.2 CHANNELS AND THEIR RELATIONSHIP TO LAYERS


    Recall that images are constructed from layers, and from pixels. However, there
    is another important component in the image structure hierarchy. Layers can be
    decomposed into sublayers called channels. Layers are constructed of one to four
    channels. In this book almost all work is performed on RGB images. For these types
    of images each layer consists of four channels known'
