    # 6.3 REPAIRING BLEMISES WITH THE CLONE TOOL


    Sometimes an image has elements you''d prefer weren''t there. A telephone pole
    and wires might ruin an otherwise lovely composition of a New England cottage
    on Cape Cod. Fortunately, these sorts of annoyances can be easily removed using
    the clone tool. The clone tool is found in the GIMP Toolbox, and its icon resembles
    a rubber stamp. The following illustrates how this powerful tool is:


    Figure 6.29(a) illustrates an idyllic scene we''ve seen already. It shows a long,
    deserted stretch of beach, blue waters, a sky dotted with fluffy clouds on the
    horizon. Well, the beach is not quite deserted. There is a person promenading
    along the water''s edge. This might not be a problem for some uses of this picture.
    On the other hand, it might be desirable to have an image without a single soul
    on the beach. If that''s the case, you can still use this image by simply removing
    the person from the scene using the Clone tool. To do this, begin by choosing
    a brush from the Brush Selection dialog, as shown in Figure 6.29(b). For this
    example, the choice to smallest hard brush has been selected. As usual, the choice
    is dictated by need.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# clone.xcf--22.0 (RGB) 100%


    ![](img/32c07c3b65137f501f1232a822a70623_222_0.png)


    **Figure 6.29:** Image with Unwanted Content


    The idea for working with the Clone tool is to cover over the offending part of
    the image using colors from the background. Where do the background colors come
    from? From the background itself. The Clone tool covers up one part of an image
    using another part of the same image. When this is done carefully, it can be used
    to completely and convincingly remove offending elements.


    Figure 6.30(a) shows a zoom of the image from Figure 6.29(a). Notice the small
    + cursor on it. The cursor shows the center of the image source reference patch
    that will be used to cover undesirable parts of the image. The size and character
