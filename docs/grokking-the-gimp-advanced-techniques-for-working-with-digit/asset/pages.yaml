  md: '# 5.6.5 THE HUE, SATURATION, VALUE, AND COLOR BLENDING MODES


    The Hue, Saturation, value, and blending modes all work similarly. For each mode,
    HSV component is taken from the foreground pixel and the other two components
    from the background pixel. For example, if the hue mode is chosen, the result
    is the hue of the foreground pixels combined with the saturation and value of
    the background pixels. The same process is used for the Saturation and Value blending
    modes. The color blending, however, is slightly different. For this mode, the
    hue and saturation of the foreground pixels are used in conjunction with the lightness
    of the background pixels. Lightness, defined in Section 5.3, is less bright than
    value, and is simultaneously more true to the human perception of brightness.


    Thus, the action of the Hue blending mode can be expressed


    ```

    R=[h(F),s(B),v(B)]

    ```


    where h(F) means the hue of the foreground, s(B) represents the saturation of
    the background, and v(B) is the value of the background. An example of applying
