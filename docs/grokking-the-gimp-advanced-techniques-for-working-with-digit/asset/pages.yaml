    we want to do. This draws the viewer''s eye to the part of the image we most want
    to convey. The idea of improving subject contrast is developed more in Section
    6.2.6.


    # 6.2.2 Color Correcting by Balancing the Neutrals


    A powerful method for identifying color casts is to measure the color of pixels
    that, in principle, should be neutral gray. Neutrals must have equal components
    of red, green, and blue. If they don''t, that indicates the presence of a color
    cast, and you know that a color correction must be made.


    Figure 6.13 illustrates a case where the identification of neutral pixels allows
    us to color correct the image. In the image, the arcade of palm trees casts shadows
    over a white sand path and, in principle these shadows should be neutral in color.


    ![](img/32c07c3b65137f501f1232a822a70623_206_0.png)


    Figure 6.13: Image with a Color Cast? The Measured Pixels Say Yes!


    There are a wide range of values for the shadow along the path, and it is possible
    to measure dark, mid-range, and light shadow values. In Figure 6.13, these are
    referred to as shadow, midtone, and highlight neutrals, and their values, measured
    with the Color Picker, are shown at three different points.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '(The Color Picker is located in the Toolbox and is represented by the eye-dropper
    icon.) Measuring color in an image with the Color Picker displays the color in
    a rectangular patch in the Color Picker dialog and gives its R, G, and B values.
    Measuring color with the Color Picker also has the effect of setting the Active
    Foreground Color patch, in the Toolbox window, to the measured color.


    For the three measured pixels shown in Figure 6.13, you can see that there is
    a distinct tinge for each one. Not only do the color patches shown in the Color
    Picker dialog look blue, the measured R, G, and B values show that there is a
    significant deviation of the blue values from the red and green ones—too much
    for each of these pixels to be neutral. Using the notation introduced in Section
    5.1, the color patches shown in the Color Picker dialogs have values 33° 35° 52°
    for the shadow, 111° 132° 179° for the midtone, and 173° 172° 206° for the highlight.
    The measured R, G, and B values for each point clearly indicate that there is
    too much blue.


    It is true that sometimes appear blue. However, this is usually true in winter
    away from the equator and due to the natural filtering of the sun''s rays by the
    earth''s atmosphere. The blue color cast shown in Figure 6.13 is more likely due
    to the tendency of film, especially slide film, to produce blue casts when photographing
    under natural light. In any case, at equatorial location on the earth, we would
    expect the fuller spectrum of the sun''s light to create neutral shadows when
    these are seen on a neutral background.


    In addition to the blue cast, there may also be a slight red deficiency in the
    midtone range. In the following discussion, the blue color cast and the red deficiency
    are corrected using the Curves tool.


    Figures 6.14 and 6.15 illustrate how the Curves tool is used to correct these
    color problems. Figure 6.14 shows a modification to the red curve and Figure 6.15
    to the blue. For each, the procedure is identical. The red and blue components
    of the measured pixel values are used to place control points on the respective
    curves. This is shown in part (a) of each figure. The accurate placement of the
    points is facilitated by the Information Field found in the upper-left corner
    of the graph area. The control points are then moved vertically or down to new
    positions, which remaps the range of pixel values between them and makes the measured
    pixels neutral in value. The displaced control points are shown in part (b) of
    the figures.'
