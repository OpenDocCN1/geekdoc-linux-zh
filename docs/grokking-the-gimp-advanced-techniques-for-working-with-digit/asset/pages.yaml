  md: 'As you can see, each of the areas defined in the ImageMap dialog is specified
    by an AREA hypertext markup tag. This tag contains the coordinates of the polygon
    and the text of the associated hyperlink.


    HTML files created with ImageMap can be reloaded and edited by the plug-in. Normally,
    this is done by reloading the original image into the GIMP, running the ImageMap
    plug-in on the image, and then loading the saved image file using the Open command
    from the plug-in File menu. Figure 9.7 shows the result of doing this with the
    HTML file for Figure 9.6. However, instead of running the ImageMap plug-in on
    the original image, it is done on a blank image having the same dimensions as
    the map. This allows you to clearly see the loaded imagenemap regions against
    the white background. This has no practical application, but it is a nice way
    of illustrating the results of the example. Note that the Region List area shows
    that each of the 10 states has an entry. Clicking on an entry in this list highlights
    the region in the Drawing Canvas, as is illustrated for the state of Alabama in
    Figure 9.7.


    ![](img/32c07c3b65137f501f1232a822a70623_325_0.png)


    Figure 9.7: The Image Map Reloaded onto a White Background'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'As a final note, with a Web browser, you can open the HTML file created by
    ImageMap to verify that it is working correctly. If necessary, you can edit the
    HTML file directly with a text editor. 9.18 shows the clickable image map for
    the preceding example displays in the Netscape Navigator Web browser. Notice the
    mouse cursor, represented by the small left-pointing hand, is located at the lower
    tip of the state of Florida. The fact that the mouse cursor appears as a hand
    means that it is over an active HTML link, and at the bottom of the browser window
    you can see the associated hyperblink in the link information field.


    ![](img/32c07c3b65137f501f1232a822a70623_326_0.png)


    9.18: Map of the Southeast United States Seen in Netscape


    The ImageMap plug-in has many other features. This book is not the appropriate
    place to cover this plug-in in detail. However, most of the features are not difficult
    to discover, and you should be able to determine their use with a little experimentation.


    # 9.3 Type Effects


    Type effects can give a Web page character. They are a great way to make Web page
    logos and titles, and they introduce stylistic elements that say something about
    the content of your page. The GIMP can produce great type effects, and the best
    news is that many effects have been automated with scripts, using a scripting
    language called Script-Fu.


    9.19 shows the scripts for creating type effects are contained in the Toolbox:xtns/Script-Fu/Logos
    menu. There are 27 different effects by the Logos menu. This section presents
    one of them.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_327_0.png)


    9.20(a) shows the dialog for the 3D outline script. In this dialog, you can specify
    the text to be rendered, the font and size (in pixels) of the text, and an image
    pattern that is used to create the 3D outline. The dialog contains defaults for
    each of these. For this example, the text string default is The Gimp.


    ![](img/32c07c3b65137f501f1232a822a70623_327_1.png)'
  merge: -1
