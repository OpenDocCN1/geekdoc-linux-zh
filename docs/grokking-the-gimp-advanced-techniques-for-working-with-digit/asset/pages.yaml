    A layer mask can be converted to the image layer''s alpha channel by choosing
    the Apply Layer Mask function from the Layers menu. It is not normally necessary,
    though, because the action of the mask is the same whether it remains a mask or
    is converted to the alpha channel. However, the Apply Layer Mask dialog permits
    the layer mask to be discarded. This is the only way to remove a layer mask. Applying
    a layer mask by converting it to an alpha channel destroys the mask and removes
    it from the Layers dialog. It can be recovered, though, by choosing Add Layer
    Mask from the Layers menu and choosing Layer''s Alpha Channel as the mask option.


    Finally, a layer mask can be converted directly to a selection. This is done by
    choosing Mask To Selection from the Layers menu. This operation creates a selection
    by mapping the white pixels in the layer mask to selected pixels in the image
    window, black pixels to unselected pixels, and gray pixels in the layer mask to
    partially selected pixels. Note that applying the mask as a selection does not
    destroy the mask.


    # 4.3 BASIC TOOLS FOR WORKING WITH CHANNEL AND LAYER MASKS


    This section discusses techniques for editing channel and layer masks. Although
    layer masks are used to edit a layer''s alpha channel, and channel masks are used
    to store and select edits, these two mask types behave similarly. Thus, the techniques
    for editing and filtering them can be treated in a somewhat unified manner.'
