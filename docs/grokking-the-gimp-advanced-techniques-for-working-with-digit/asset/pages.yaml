    # # 1.8 ZOOM AND NEW VIEW


    The functions Zoom and New View are for doing precision, pixel-scale work on an
    image. This section describes these particularly useful functions.


    # ## 1.8.1 Zoom


    Figure 1.16 illustrates the use of Zoom. The Zoom function, enabled by clicking
    on the magnifying glass icon in the Toolbox, has two modes of operation. first
    mode is used by clicking and dragging in the image window to frame a part of the
    image. When the mouse button is released, the delineated region is zoomed. Figure
    1.16(a) shows a zoom selection area created with the mouse, and Figure 1.16(b)
    shows how this region is zoomed to fill the entire image window. This is a convenient
    way to zoom into a specific region of your image.


    ![](img/32c07c3b65137f501f1232a822a70623_41_1.png)


    GIMP Basics'
