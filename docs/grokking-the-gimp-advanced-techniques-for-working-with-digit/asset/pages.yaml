  md: '![](img/32c07c3b65137f501f1232a822a70623_84_0.png)


    So, how much lower and higher can adjoining pixel colors be and still be included
    in the selection? This is specified by the Magic Wand''s selection threshold,
    which, as shown in Figure 3.5(b), can be set with the Threshold slider in the
    Tool Options dialog (see Section 3.1.2 for more on this). It can also be set interactively
    with the mouse, keeping the left mouse button pressed when selecting the seed
    pixel. When the outline of the selection appears, and with the left mouse button
    continuously pressed, the mouse can be moved to the right (or downward) to increase
    the threshold or to the left (upward) to diminish it. Increasing the threshold
    results in a larger selection, and decreasing it, a smaller one. Changing the
    threshold should be done by moving the mouse in small increments so that the changes
    in the selected region can be carefully controlled.


    The Magic Wand is a conceptually attractive tool. In principle, it automatically
    makes the selection by grouping pixels that are similar in color and are spatially
    connected, being grown from a seed pixel. In practice, however, it is often difficult
    to get good results with the Magic Wand. This is because it is hard to find the
    seed pixel and threshold pair that will produce the selection we want. For example,
    imagine a subject you want to select using the Magic Wand that has pixel color
    values ranging from X to Y. To make the selection with the Magic Wand, a pixel
    whose value is exactly midway between X and Y must be selected as the seed. But
    how do we determine what X and Y are for our subject, and how do we find the pixel
    in the subject that has the midway value? These practical problems are not easily
    solved!


    Fortunately there is another tool in the GIMP that allows you to more easily exploit
    the color-grouping selection concept. This tool is called Threshold and is found
    in the Image:Image/Colors menu. Its use is presented in Section 4.5.3.'
