  md: 'The GIMP can load and save in many file formats. The set of all formats can
    be seen in the Save Options menu, shown in Figure 1.10(b). There are three file
    formats that are unique to the GIMP. The first is XCF, which is the native GIMP
    format. This is the only format that can save all the GIMP features and states
    when working on a project. If your image contains multiple layers, channels, selections,
    or paths, you must save using the XCF format to avoid loss of your work. Because
    the GIMP is the only program that can load XCF file formats, you will also want
    to eventually save to other formats. See Sections 2.7.1 and 2.7.2 for precautions
    that should be used before saving to a different format.


    The two file formats native to the GIMP are PAT and GBR. PAT is for saving image
    patterns such as those available in the Pattern Selection dialog. Placing a file
    with the PAT extension in ~/.gimp/patterns directory will make it available in
    the Pattern Selection dialog the next time you run GIMP. The GBR file format is
    used for creating GIMP brushes. This works for pattern files, except GBR files
    must be placed in the ~/.gimp/brushes directory to be available in the Brush Selection
    dialog.


    # 1.3 Creating NEW IMAGES


    Figure 1.11 shows the New image dialog. This is invoked with the New function,
