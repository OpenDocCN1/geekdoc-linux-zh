    # 6.2.6 Getting More Detail Into the Subject


    Sometimes one part of an image is more important than the rest. We often refer
    to this part of the image as the image subject. It is typical to want the subject
    to have much contrast as possible. This makes the subject stand out and look much
    more interesting. As was discussed in Section 6.2.1, the curves tool can be used
    to improve the contrast of certain parts of the tonal range in an image. This
    can be applied to the subject of the image by determining its lightest highlight
    and deepest shadow, and then steepening the part of the control curves covering
    this range.


    However, if a lot of work has already gone into maximizing tonal range and correcting
    color, you might be reluctant to play with the curves to get additional contrast
    into the subject. Clearly, manipulating part of the curves in an attempt to improve
    contrast can damage the color balance obtained with much hard work.


    Fortunately, there is a way to have your cake and eat it too. Up to this point,
    the red, green, and blue control curves have monopolized our attention. You have
    already seen, modifying any of these changes alters the overall balance of color
    in the image. However, the curves tool can also be used to modify the image''s
    Value channel. As discussed in Section 5.3, the Value channel has no effect on
    color: it only affects brightness. This, then, is the perfect channel for improving
    contrast while preserving the image''s color balance.


    To illustrate the use of the Value channel to improve contrast, Figure 6.22(a)
    shows an original image that lacks tonal range and has a terrible color contrast.
    Figure 6.22(b) shows the corrected image, which was obtained simply by applying
    the Auto Levels button of the Levels tool (see Section 6.1.2). Although the image
    is much improved, it lacks detail in the eagle''s white feathers. It would be
    nice to improve this part of the eagle to give it more visual depth. This can
    be done by modifying the Value channel of the Curves


    To improve the contrast of the head feathers, it is necessary to determine the
    value range that this part of the image is contained in. The Threshold tool is
    perfect for this (see Section 6.2.3). Figure 6.23 illustrates the use of Threshold
    Figure 6.23(a) shows the Threshold dialog applied to the color corrected image
    in Figure 6.22(b), and Figure 6.23(b) shows the result of having swept out the
    range [174, 255] in the Threshold dialog. This range, which was determined by
    experimentation, pretty much covers the part of the eagle image where we want
    to improve the contrast.'
