  md: '# 3.2.1 ADDING


    Adding a selection to an existing one means that the resulting selection is the
    union of the pixels from the two. Thus, if A is the set of pixels defined by the
    first selection and B for the second, then A ∪ B is the result of adding the second
    to the first, where �∪ is the set union operator.


    If a selection already exists in the image window, the addition is made by pressing
    the Shift key before clicking to begin the new selection. Once the mouse button
    has been pressed, the Shift key should be released. Figure 3.15(a) shows an initial
    rectangular selection, and Figure 3.15(b) shows the result of adding an ellipse
    to.


    ![](img/32c07c3b65137f501f1232a822a70623_94_0.png)


    It is useful to note that pressing the Shift key while the mouse is in the image
    window has the effect of changing the mouse cursor to an arrow with a plus sign
    below it. This indicates that the next selection will be added to any selection
    already existing in the image window.


    # 3.2.2 SUBRACTING


    Subtracting a new selection from an existing one means that the result is the
    first selection less the pixels contained in the intersection of the two. Thus,'
