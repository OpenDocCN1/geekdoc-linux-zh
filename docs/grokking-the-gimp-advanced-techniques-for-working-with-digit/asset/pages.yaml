- img_proc: true
  md: 'The ImageMap selection tools are used to define the clickable regions. The
    selection tool choices are rectangular, circular, and polygonal. Of the three,
    the polygon tool is the most general because it allows for the most complex shapes
    to be selected. Figure 9.14(a) illustrates an irregular shape made with the polygon
    selection tool and then by clicking on points in the Drawing Canvas. Each point
    becomes a new vertex of the polygon. The selection is terminated, and the polygon
