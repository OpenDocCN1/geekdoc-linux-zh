    the functions available in the Paths menu can be accessed from the button bar.
    However, the functions Copy Path, Paste Path, Import Path, and Export Path are
    unique to the paths menu.


    ![](img/32c07c3b65137f501f1232a822a70623_106_0.png)


    The Copy Path function copies the path in the active path strip to a buffer. This
    path can then be pasted into another path strip, either in the same image or another,
    using the Paste Path function. The Export Path function brings up a dialog allowing
