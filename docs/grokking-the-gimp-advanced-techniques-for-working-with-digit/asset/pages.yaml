- img_proc: true
  md: 'Figure 6.32. The effect of the Unsharp Mask is very pronounced, but was chosen
    to clearly illustrate the effect. In general, the dialog parameters are chosen
    to produce more subtle results.


    The Unsharp Mask dialog has three parameters. Looking at the dialog in Figure
    6.33(c), there is Radius, which specifies the relative width of the halo/shadow
    created by the mask. The parameter named Amount controls the relative magnitude
    of the dip and the peak created on each side of the edge. Finally, Threshold specifs
    the difference in pixel values that must exist across the edge for the Unsharp
    Mask to be applied. If Threshold is set to 25, adjacent pixels whose difference
    in value is less than 25 are not sharpened. An important fact is that the Unsharp
    Mask is applied individually to each color channel, R, G, and B; the results are
    then combined.


    # 6.4.3 A REPRESENTATIVE EXAMPLE OF APPLYING THE UNSHARP MASK


    Figure 6.34 illustrates the application of the Unsharp Mask to a more representative
    image. Figure 6.34(a) shows the original and Figure 6.34(b) the result of applying
    the mask. The parameters chosen to perform the sharpening are shown in the Unsharp
    Mask dialog illustrated in Figure 6.34(c).


    ![](img/32c07c3b65137f501f1232a822a70623_227_0.png)


    Figure 6.34: An Example of Applying Unsharp Mask


    The choice of parameters used to obtain the results in Figure 6.34 was obtained
    by trial and error. Using Undo (G-c) in conjunction with the keyboard shortcut
    that recalls the last applied filter (A-s-f), it was possible to apply the Unsharp
    Mask repeatedly, experimenting with values. In this way, it was possible to obtain
    the desired effect.'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'What parameter values should be used with the Unsharp Mask? The answer depends
    on the image, of course, one rule of thumb is the Radius of the mask should be
    small—2 to 4 pixels. This is because the halo and shadow created by the Unsharp
    Mask should be subtle. On the other hand, the amount should be as much as you
    can get away without overly accentating noise. This is typically in the range
    of 75% to 150% depending on the pixel values in the image.


    # 6.4.4 Unsharp Mask PITFALLS


    Applying Unsharp Mask can have its problems. For example, this method of sharpening
    an image can sometimes introduce undesirable color shifts. Figure 6.35 illustrates
    just a case. Figure 6.35(a) shows an image with a single edge, with a gray region
    to the left of the edge and a red region to the right. Figure 6.35(b) shows the
    result of applying the Unsharp Mask to this image. You can clearly see a colored
    halo just to the left of the edge even though there is no apparent cyan in the
    original.


    ![](img/32c07c3b65137f501f1232a822a70623_228_0.png)


    The explanation for this is as follows. Remember that each image is composed of
    three color channels. Thus, the Unsharp Mask is actually applied to each of the
    three channels individually and the results are then combined. Imagine, then that
    the color on the left side of an edge consists of a low value of red and green
    but a high value of blue. Furthermore, suppose that the region on the right side
    of the edge has a high value of red and green but a low value of blue. This situation
    presents you with an edge that goes from dark to light in the Red and Green channels
    but from light to dark in the Blue. According to the preceding description, the
    Unsharp Mask makes a dip for the Red and Green channels on the left side of the
    edge but a peak for the Blue. Clearly, when adding the Red, Green, and Blue channels,
    the two dips plus the one peak create a color whose relative mix has been maintained.
    In plain language, this means the hue has been changed.'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'This is just what has happened in Figure 6.35. The color region to the left
    side of the edge is a medium gray. Thus, it consists of medium values of red,
    green, and blue. The right side of the edge is composed uniquely of a high value
    of red and low (zero) values of green and blue. The application of the Unsharp
    Mask creates peaks in the Green and Blue channels of the gray region dip in the
    Red. This explains where the cyan halo comes from, removing red from an image
    makes it look more cyan.


    In most images, the creation of an off-color halo does not occur or is not evident.
    When it does happen, don''t worry; there is a technique to correct the problem.
    Figure 6.36 illustrates the procedure. Figure 6.36(a) is identical to Figure 6.35(a).
    The procedure first decomposes the image into its, saturation, and value components.
    This is done with the HSV option of the Decompose function (found in the Image:/Mode
    menu). The value component of the result is shown in Figure 6.36(b). The Unsharp
    Mask is then applied uniquely to this value component, the result shown in Figure
    6.36(c). Finally, the hue, saturation, and sharpened value components are recomposed
    using the HSV option of the Compose function (also found in the Image:Image/Mode
    menu). Figure 6.36(d) shows the result of the processing sequence. As you can
    see, the edge has been sharpened without creating a shift in hue at the edge.


    ![](img/32c07c3b65137f501f1232a822a70623_229_0.png)


    Figure 6.36: Circumventing the Unsharp Mask Color Shift Problem by Sharpening
    only the Value Channel'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'Because the value component of the image only contains light and dark information
    about the image, the sharpening is performed just where it should be and no color
    shift occurs. Why isn''t an HSV decomposition built into the Unsharp Mask? Apparently,
    a few mysteries of the Unsharp Mask persist...


    The other important problem that the Unsharp Mask can create is the amplification
    of noise. Noise is sharpened like the other elements of the image, and if the
    sharpened noise becomes apparent, it can become a significant detract. An approach
    that can be used to avoid the problem is to set a non-zero value of Threshold
    in the Unsharp Mask dialog. Setting the threshold diminishes the effect of noise
    by applying the mask only to edges that have jumps greater than the Threshold
    value.


    # 6.5 A Case Study


    This chapter has covered many elements of photo touchup and enhancement. To put
    all the elements into perspective, this section presents a case study to illustrate
    the work flow of a typical sequence of corrections. The photo in Figure 6.37 is
    the subject of the study; it is a difficult case because it has many defects.


    Before we begin, several observations can be made concerning this photo:


    +   - It is dark and clearly underexposed.

    - The colors are muddy and there is an overall lack of sharpness.

    - The photo has a green tinge or orange cost to it.

    - There is an unsightly bright green spot on the lefthand side of the photo that
    will blemish the final product if removed.

    - The subject matter, the cowboy roper with the children, is poorly separated
    from the background.


    ![](img/32c07c3b65137f501f1232a822a70623_230_0.png)


    In nutshell, this photo needs a lot of help. It will be significantly enhanced
    by the steps described in the rest of this section.


    The first step, as described in Section 6.1, is to maximize the tonal range of
    the image. This is done by opening the Levels tool and choosing Auto Levels. Figure
    6.38(b) shows the result. Figure 6.38(a) shows the original image for comparison
    purposes. In addition to selecting Auto Levels, the midtone slider control in
    the Value channel has been adjusted to lighten the result bit. Notice that the
    green color cast has been greatly diminished by the Levels tool adjustment, and
    the colors seem much clearer.'
