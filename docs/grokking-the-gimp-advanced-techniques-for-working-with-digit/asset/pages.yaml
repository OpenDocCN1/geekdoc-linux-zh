    # 9.2 Clickable Image Maps


    A common graphical device on the Web is the clickable image map.A clickable image
    map is a graphic that has multiple hyperlinks, and perhaps, Java scripts, associated
    to a single image. Such an image allows the Web designer to associate links and
    dynamic actions to graphical cues.


    As an example, one use of a clickable image map might be for a travel agency offering
    vacation packages to different exotic locations around the world. A clickable
    image map of the world could be constructed to contain hyperlinks cued to the
    location of a mouse click on the map. For example, clicking on France might send
    the user to another Web page details of vacation packages, see places, and restaurants
    to try when visiting Paris. Clicking on Venezuela would send the user to pages
    on Caracas, and so on.


    Clickable image maps are very useful devices for the Web because they represent
    an alternate, graphical means of navigating to other pages. One problem, however,
    is that they can be difficult to construct. For each hyperlink, a region of the
    image must be defined that activates the link when the mouse is clicked in it.
    This region is defined by a polygon, which in turn is specified by a set of pairs
    of coordinates giving the locations of the polygon''s vertices. The difficulty
    comes from trying to determine the coordinate values. For another map containing
    many hyperlinks associated with complicated regions, the task of assembling these
    points can be quite arduous.'
  merge: -1
