  md: '# #### 4.1.7 Partially Selected Pixels


    Partially selected pixels are especially important at selection edges because
    they allow the selection to blend smoothly with other image layers. The subject
    of partially selected pixels has already been discussed to some extent in Section
    3.1.2, which presented the concepts of antialiasing and feathering.


    A powerful feature of masks is that they provide an easy way to create and work
    with partially selected pixels. As has already been discussed, a white pixel in
    a channel mask represents a fully selected pixel in the image window, a black
    pixel fully partially selected, and a gray pixel partially selected. Thus, channel
    masks allow for partially selected pixels, and, moreover, provide a framework
    for which any of GIMP''s filters and functions can be applied. This channel mask
    represents a particularly flexible and versatile medium for working with partial
    selections. Some examples of using GIMP filters on masks are illustrated in Section
    4.3.5.


    # ## 4.2 Layer Masks


    Layer masks are special layers that are only 8 bits deep and represent the alpha
    channel of an image layer. The main difference between channel and layer masks
    is that the layer mask represents the alpha channel of the layer it is linked
    to, whereas channel masks represent selections and exist independently of any
    particular layer. Nevertheless, as will be seen later in this chapter, there is
    an intimate relationship between alpha channels and selections, and by extension,
    between layer masks and channel masks.


    The interpretation of white, black, and gray pixels in a layer mask is slightly
    different than for a channel mask. A layer mask represents an alpha channel, which,
    in turn, controls the transparency of a layer. In this context, the layer mask,
    white represents 100% opacity, black 100% transparency and gray an intermediate
    level of opacity/transparency. This section describes the basic operations that
    can be performed on layer masks.


    # #### 4.2.1 Creating a Layer Mask


    To create a layer mask, make the desired layer active in the Layers dialog and
    choose Add Layer Mask from the Layers menu. This creates the layer mask, but only
    if the active layer already has an alpha channel. If it does not have an alpha
    channel, create one using Add Alpha Channel from the Layers menu.'
  merge: -1
  pgno: 123
- img_proc: true
