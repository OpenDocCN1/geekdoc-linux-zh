- img_proc: true
  md: 'The actions of the Multiply and Screen modes on pixels represented in the RGB
    cube are illustrated in Figure 5.17. For a foreground pixel whose position in
    the RGB cube is {r1,g1,b1} and a background pixel whose position is {r2,g2,b2},
    the resultant pixel for Multiply mode is the component-wise product of the two
    [r1r2/255, g1g2/255, b1b2/255], where the division by 255 is necessary to normalize
    the result back into the RGB cube. This can be succinctly expressed by the equation


    ```

    R = \frac{1}{255}(F \times B)

    ```


    the × symbol means component-wise multiplication.


    ![](img/32c07c3b65137f501f1232a822a70623_178_0.png)


    Figure 5.17: The Multiply and Screen Modes in the RGB Cube


    For the scale factor of 255, the component values of one RGB vector are normalized
    to the range [0,1]. Thus, R is component-wise smaller than either F or B. From
    previous discussions, you know that smaller means darker because the projection
    onto the neutral axis is closer to the origin. This is illustrated in Figure 5.17(a)
    which shows two arrows representing the foreground and background pixel positions
    and a red arrow representing the component-wise product.


    Figure 5.18(a) illustrates an example of applying Multiply mode to the flower
    image from Figure 5.15(a). As before, the lower layer of this image is a uniform
    gray equal to 127^−-127^-. The result, shown in Figure 5.18(a), is the image has
    been made uniformly darker. In fact, because the lower layer is a medium gray,
    the pixels values in the flower layer have been scaled by 127/255 = 1/2 everywhere.'
