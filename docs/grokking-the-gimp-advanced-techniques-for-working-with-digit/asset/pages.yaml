  md: 'Because the remaining functions are available in the button bar, they are described
    in the next section.


    # 3.4.4 THE PATHS BUTTON BAR


    The Paths dialog button provides access to six functions: New Path, Duplicate
    Path, Path to Selection, Selection to Path, Stroke Path, and Delete Path.


    New Path and Duplicate Path are self-evident. The New path button creates a new
    path, and the Duplicate Path button duplicates the current active path.


    The Path to Selection button converts the active path to a selection. The path
    can also be converted to a selection by simply clicking inside in the image window.
    In either case, this causes the selection''s Marching Ants to appear in the image
    window but does not necessarily cause the visibility of the path to toggle off.
    To toggle the path''s visibility, click on tool icon, other than the one for Bezier
    Path, in the Toolbox.


    The Selection to Path button is the same as the Path function described in Section
    3.3.12. Using this button converts a selection in the image window to a new path
    in the Paths dialog. This becomes the active path and can be seen in the image
    window.


    The Stroke Path button is the same as the Stroke function described in Section
    3.3.15. It is applied to the active path using the active brush and the active
    foreground color. In addition, the Stroke function in the Paths dialog will stroke
    the path using any painting tool selected from the Toolbox. To select it in the
    Toolbox prior to clicking the Stroke Path button in the Paths dialog. Using this
    technique the Airbrush tool can be used, for example, to stroke the path.


    Finally, the Delete Path button removes the active path from the Paths Palette.


    # 3.5 USING SELECTIONS EFFECTIVELY


    This section begins the discussion of how to effectively use the selection tools
    presented in this chapter. The full story, however, will not be completed until
    we cover masks in Chapter 4.


    # 3.5.1 GENERAL SELECTION TOOL GUIDELINES


    This chapter has presented the six selection tools from the Toolbox as well as
    the By color selection tool. This leaves you with quite a few choices. So, the
    question naturally arises, “Which is the best tool to use?” This section summarizes
    the tools discussed so far and describes their strengths and weaknesses.'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'The order of the summary is: this from the most useful selection tool to the
    least:


    +   ** Bezier Path: Of the seven choices, this is the most useful selection tool
    because it is the most flexible and the most versatile. Combined with the associated
    tools available in the Paths dialog, this is the selection tool that will usually
    get the job done in the least amount of time.


    The Bezier Path selection tool is not, however, a panacea. When the selection
    subject''s boundary is not smooth, it is impractical to use the Bezier Path tool.
    Examples of difficult selections with this tool would be the image of a leafy
    tree or one of a woman''s hair blowing in the breeze. For these types of selections,
    other approaches are necessary (see Chapter 4).


    +   ** Lasso: Although this tool is not useful for precision selection work, it
    is probably still the next most useful selection tool. The Lasso is the best selection
    tool when only a rough selection is needed. Good examples of using the Lasso to
    separate images are illustrated in Sections 4.5.3 and 7.4.


    +   ** Rectangle Select: This selection tool is as useful as the Lasso. However,
    it is used for very different reasons. This tool is valuable for framing (see
    Section 2.6.2) and for the selective application of filters and gradients to layer
    edges (see, for example, Section 7.5.3).


    +   ** By Color: This selection tool is most useful for making selections in images
    that have several regions that consist of an almost uniform color. Examples of
    this would be trying to select a large-font, solid-color text on a photographic
    image background or a complicated bitmapped image. See Section 8.6 for a practical
    example.


    +   ** Ellipse Select: This tool, like Rectangle Select, is also used for framing.
    An example of using Ellipse Select in this way is shown in Section 3.1.2. It is
    also occasionally useful for selecting shapes that are known to be elliptical
    or circular, such as the clock illustrated in Section 3.5.4. This tool, however,
    is used less often than Rectangle Select.


    +   ** Magic Wand: This tool is based on a great concept but is difficult to use
    in practice. Furthermore, there is another technique based on almost the same
    idea but producing results with much greater control and flexibility. This technique
    is based on the Threshold tool, which is described in more detail in Section 4.5.3.


    +   ** Intelligent Scissors: In principle this tool should be good at selecting
    shapes that do not have smooth outlines, the shapes that are difficult for the
    Bezier Path tool. Unfortunately, the performance of this tool is poor and I, personally,
    never use it. I rank this task as the least useful for making selections.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# 3.5.2 Tool Conjugation


    Often a selection is most efficiently made using a combination of tools. For example,
    beginning a selection with the Magic Wand or by Color can produce a result that
    is almost right but may be missing a component or may have included an unwanted
    element. When this happens, the Lasso can often be used to correct the problem.


    Figure 3.25(a) shows the selection of a flower made with the Magic Wand. However,
    the flower has been almost completely selected. It was impossible to include the
    central region of the flower by interactively adjusting the threshold without
    also including more of the background. The value of the threshold used in Figure
    3.25(a) is seen in the Tool Options dialog for the Magic Wand, shown in Figure
    3.25(b). The value of 59.9 is seen in the dialog is at the point where parts of
    the background started to be included in the selection.


    ![](img/32c07c3b65137f501f1232a822a70623_109_0.png)


    Figure 3.25: Selection Tool Teamwork


    Although the Magic Wand could not select all the desired parts of the flower,
    the remainder can be added to the selection using the Lasso. Figure 3.25(c) shows
    the process of making a selection with the Lasso. Press the Shift key before clicking
    and dragging in the image window causes the new selection to be added to the one
    created by the Magic Wand. The Shift key needs to be released before the selection
    is finished. Adding selections was described in Section 3.2. Notice that under
    these circumstances the selection made with the Lasso need not be precise, which
    corresponds to the guidelines given for Lasso in Section 3.5.1.'
  merge: -1
