    # 2.6.2 RESIZING AND SCALING


    As seen in Figures 2.2 and 2.10(a), the layers in an image need not all be the
    same size. Furthermore, changing a layer''s dimensions can be quite useful. In
    the parlance of the GIMP, a layer can be resized, which means that its boundaries
    are shrunk or enlarged without changing the dimensions of the image''s contents.
    Alternatively, a layer can be scaled, which means that the dimensions of the layer
    are changed and the image contents are stretched or squeezed to exactly fit within
    the new layer boundaries. Six functions in the GIMP resize or scale layers and:


    +   - Layer Boundary Size, found in the Layers menu

    - Scale Layer, found in the Layers menu

    - Canvas Size, found in the Image:Image menu

    - Scale Image, found in the Image:Image menu

    - The Crop tool from the Toolbox

    - The Transform tool from the Toolbox


    Each of these are discussed and compared in the following sections.


    # IMAGE SCALING


    Scaling an image results in changing the dimensions of all the layers at once,
    while simultaneously stretching or squeezing the image contents to fit. The function
    Scale Image, found in the Image:Image menu, is the tool that accomplishes this.
    Figure 2.15(a) shows an example image, and Figure 2.15(b) shows the Scale image
    dialog. The new width and height of the image can be specified in pixels or as
    a percentage of the current dimensions. The default is to scale the two dimensions
