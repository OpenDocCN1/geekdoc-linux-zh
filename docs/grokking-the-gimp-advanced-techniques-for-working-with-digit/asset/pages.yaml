  md: '# ACKNOWLEDGMENTS


    The GIMP began in the summer of 1995 as an enormously ambitious project of two
    undergraduates at the University of California, Berkeley. They began, they probably
    didn''t realize just how impossible it was, and yet they made it. We created a
    beta version that captured the imagination of the open-source movement. Spencer
    Kimball and Peter Mathis were those students, and I would like to thank them as
    much for the creative inspiration I received for that they created in others.
    This book, of course, would have never existed without them.


    ![](img/32c07c3b65137f501f1232a822a70623_9_0.png)


    Spencer Kimball


    Peter Mathis


    The seed of inspiration planted by Peter and Spencer attracted a talented group
    of core developers who have grown the GIMP into the powerful digital image manipulation
    that it is today. They are a loose-knit collection of men and women from around
    the globe, connected only by the thins of cyberspace. Most of them have never
    met face to face, and nevertheless, they have collaborated and cooperated on a
    project of significant complexity and great value. What an amazing phenomenon
    the GIMP is! I would like to thank each one of them. Their names, as of version
