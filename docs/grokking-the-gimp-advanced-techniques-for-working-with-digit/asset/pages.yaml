    and dragging with the mouse in the image window, beginning at the tail of the
    red arrow and releasing at its tip (Note that the red arrow is just for illustrative
    purposes and is not part of the image or the gradient).


    ![](img/32c07c3b65137f501f1232a822a70623_134_0.png)


    Figure 4.24: Using Blending Modes to Combine Gradients


    Choosing the Multiply mode from the Brush Selection mode menu and applying a second
    gradient to the first is shown in Figure 4.24(b). The direction of the applied
    gradient is indicated by the red arrow. If the normal combining mode had been
    used, the second gradient would have replaced the first. However, using the blending
    mode to Multiply has produced a completely different effect. The two gradients
    have been multiplied together. What does it mean to multiply two gradients? Assigning
    a value of 0 to black, a value of 1 to white, and proportional values for grays
    provides us with a definition. This numerical correspondence is used to create
    a gradient that is the product of the first two. More precise definitions for
    the blending modes are given in Chapter 5.


    Figure 4.24(c) shows the result of using the Screen mode, as shown by the red
    arrow in the figure. This works in a manner similar to Multiply mode. It performs
    a multiplication, except that it is white and is assigned the value of 0 and black
    the value of 1. As can be seen in Figure 4.24, the Multiply and Screen blending
    modes can be used to create custom gradient interfaces.'
