- img_proc: true
  md: 'Considering the rough layout discussed earlier, the width of the shuttle image
    must be cropped to that of the Saturn image, 527 pixels. Furthermore, I decided
    that the lower 130 pixels of the shuttle image won''t be used, meaning that the
    height of the shuttle image after cropping will be only 506 pixels. There needs
    to be some vertical overlap between the two layers in the composed image, so I
    chose a total vertical height of 750 pixels. The Crop tool is used to nicely center
    the shuttle launch image while producing the desired dimensions.


    The two raw images are now ready to be united into a single image. A new window
    is created by typing C-n in the Saturn window. When the New Image appears, the
    default values for the width and height are of the Saturn image, 527 by 489. The
    value of 750 pixels is entered into the height field, and when the new window
    is created, it has the desired dimensions of 527 by 750.


    The shuttle launch is now copied and pasted into the new image window. This is
    done by typing C-c in the shuttle window followed by C-v in the new window. The
    result places the shuttle image into a floating selection that can be seen by
    opening the Layers dialog (that is, by typing C-1 in the image window). The Move
    tool is used to position the shuttle to the bottom of the window; it is then anchored
    to the background by clicking on the Anchor button in the Layers dialog.


    Creating a new layer by clicking on the New Layer button in the Layers dialog,
    the image of Saturn is now copied to the new window, slid to the top of the window
    using the Move tool, and finally anchored into the newly created layer. Double-clicking
    on each layer in the Layers dialog allows us to name each one. The top layer is
    named Saturn, and the lower layer is named Shuttle Launch. The result is shown
    in Figure 7.19(a), which shows the Saturn layer half blocking the Shuttle Launch
    layer. The Layers dialog is shown in Figure 7.19(b).


    Now that the two images are positioned, one approach for blending is to use the
    layer mask and gradient technique described in Section 4.3.3. The idea is to create
    a layer mask for the Saturn layer and to blend the two layers together by applying
    a gradient in the layer mask. This produces the image shown in Figure 7.20(a).
    Figure 7.20(b) shows how a layer mask with a gradient has been added to the Saturn
    layer.'
