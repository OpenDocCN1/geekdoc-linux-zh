  md: 'Thus, on the red control curve, the shadow, midtone, and highlight values are
    moved from 33, 111, and 173 to the measured green values of 35, 12, and 172. On
    the blue control curve, the shadow, midtone, and highlight values are moved from
    52, 179, and 206, again, to the green values of 35, 132, and 172. After the operation,
    the color values for the three measured pixels are $35^\circ$-$35^\circ$ for the
    shadow, $132^\circ$-$132^\circ$ for the midtone, and $172^\circ$-$172^\circ$ for
    the highlight—all three neutral grays.


    The result of color correcting the neutral pixel values is shown in Figure 6.16(b).
    For comparison, the original image is clear that the original image had a blue
    cast and that this has been eliminated in the corrected image. Measuring the pixel
    values along the tree-lined path shows that, overall, the balance is better and
    more of the tree shadow values are now neutral. Furthermore, the rest of the image
    has taken on a much warmer look. The trees are now bathed in a light yellow, corresponding
    better to what we might expect from a tropical sunset.


    ![](img/32c07c3b65137f501f1232a822a70623_209_0.png)


    Figure 6.16: Comparison of the Original and Color Corrected Images


    There are some practical questions about the color correcting procedure described.
    The first is, why were the blue and red channels matched to the green? For the
    three measured pixels there are a total of nine ways to make the three neutral.
    However, in practice, it is typical that two of the channels are almost the same
    and one is quite different. When this is the case, as it is for the measured shadow
    and highlight values in the preceding example, the choice is clear. When it is
    not the case, some experimentation may be necessary.'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'The second question about the procedure is, why measure three points? The method
    doesn''t require three points, and amazingly, often a single point can suffice
    to correct the entire image. However, matching a shadow, midtone, and highlight
    image provides additional insurance that the color in each range is properly balanced.


    The curves tool has several features that facilitate the positioning of points
    on the control curves. Clicking the mouse button in the window produces a vertical
    bar in the area of the curves tool. The bar position corresponds to the pixel
    value the mouse cursor is over in the image window. Clicking and dragging the
    mouse interactively updates the position of the bar. In this, it is possible to
    see where different pixel values in the image are located on the control curve
    and helps to discover the locations of shadow, midtone, and highlight pixels.
    In addition to input position information, Shift-clicking in the image window
    automatically creates a control point on the active curves of the Curves dialog.
    Control-clicking on a point in the image window produces control points on each
    of the Red, Green, Blue, and Value controls.


    In addition to the Curves tool features, a very useful tool for exploring and
    discovering color problems in an image is the Info window: View menu and can be
    invoked by typing C-s-i in the image window. The Extended tab of this dialog interact
    reports the R, G, and B pixel-color components when the mouse is in the image
    window. The advantage of the Info window over the Color Picker for measuring pixel
    values in the image window is it remains open while using the Curves tool.


    There are two lessons to be learned from this. First, color correction can be
    very easy. Measuring only a few pixel values across the shadow to highlight can
    correct an entire image in a few minutes time. Second, the color correction obtained
    in this way not only fixes the individual pixels, but usually corrects the entire
    image. Third, the curves tool is the only one that can be used to correct the
    image based on measured pixel values. For these reasons, curves tool is the most
    precise and the most powerful tool for color correction in the GIMP.


    # 6.2.3 Finding the Shadow, Midtone, and Highlight


    To do color correction using the techniques of the previous session, it is important
    to be able to identify shadow, midtone, and highlight colors. To be frank, I sometimes
    have difficulties finding them for some images. When this happens, the Threshold
    tool is useful because it can show where any range of values is hidden in an image.
    The Threshold tool is found in the Image: Image/Colors menu. Figure 6.17 shows
    how this tool can be used to locate critical shadow and highlight values.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_211_0.png)


    Figure 6.17: Using Threshold to Find Shadows and Highlights: (a) Original Photo
    (b) Darkest Shadows (c) Lightest Highlights


    Figure 6.17(a) illustrates an image and Figures 6.17(b) and (c) show how to use
    the Threshold tool to identify its darkest shadows and lightest highlights. The
    Threshold tool, which was introduced in Section 4.5.3, consists of a dialog that
    displays the histogram of the image''s pixel values. Clicking and dragging the
    mouse through a range of histogram values has the effect of mapping all the pixel
    values in the image to either black or white. The image pixel values corresponding
    to the selected histogram range become white, and the rest remain black.


    In this way, it is easy to localize the pixel values we are searching for. Starting
    with an image like the one in Figure 6.17(a), a duplicate of the image is made
    by typing Ctrl-d in the image window. Then the Threshold tool is applied to the
    duplicate, and a range of shadow values is swept out with the mouse, as shown
    in Figure 6.17(b). The resulting white pixel values in the duplicated window show
    the locations of the darkest shadows. Using the duplicated image as a guide, the
    Color Picker can now be used in the original image window to measure pixel values
    at the appropriate locations. A similar procedure is used to accurately find and
    measure the lightest highlights of the image shown in the duplicated image 6.17(c).


    Note that this procedure, using the Threshold tool to find value ranges in the
    image, can also be used on the image''s individual RGB components.'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'The decomposition is made using the Decompose function, found in the Image/Image
    Mode menu (see Section 4.5.3).


    # 6.2.4 OTHER COLORS WE KNOW


    If are identifiable colors other than neutrals in an image, these, too, can be
    used to perform color correction. Examples are the colors of flags, logos, or
    certain animals. A Canadian flag whose famous maple leaf emblem were not red would
    be a good point of reference for color correction.


    Another important class of colors that can be found in many images are tones.
    A medium Caucasian fleshone has a green around 192, a red that is about 20% more
    (234), and a blue about 10% less (176). Dark-skinned people have skin colors with
    more blue and less red, and Asians have less blue. Because of the variability
    of skin tones, relying on them as guides is more uncertain than using neutrals.
    Nevertheless, for some images this may be the only point of reference available
    for color correction.


    # 6.2.5 THE PERTURBATION TECHNIQUE


    Sometimes it is impossible to identify a color in an image but it seems clear
    that a color cast is present. This means there are no color references that can
    be used to do color correction. Under these conditions, an alternate approach
    is needed. The method proposed here is what I call the perturbation technique.
    It relies on the visual feedback that the preview checkbox in the Curves dialog
    provides. In nutshell, the method makes incremental perturbations to the shadow,
    midtone, and highlight regions for each of the red, green, and blue curves. The
    perturbations that improve the image are kept and those that are not discarded.


    Figure 6.18 illustrates the idea. In Figure 6.18(a), the Red channel of the Curves
    tool is displayed, and three control points have been added to the curve at the
    quarter, half, and three-quarter positions. The regions of the curve around these
    points roughly control the shadow, midtone, and highlight regions of the Red channel.
    The perturbation technique works by moving the control points up or down and seeing
    whether the change improves the image. Figure 6.18(b) shows a perturbation of
    the midtone control point.


    Note that, in moving the midtone control point, the only parts of the curve that
    move are those between the shadow and highlight control points. The rest of the
    curve is constrained by the two other control points. This is very useful because
    it allows the Curves to act on a select part of the image''s tonal range.


    The perturbation technique is not scientific and relies on the perceptual abilities
    of the user to see changes that improve or deteriorate an image. Nevertheless,
    cycling among the nine control points, making only gradual changes to each, can
    often produce marvelous results. The following example illustrates this approach.'
