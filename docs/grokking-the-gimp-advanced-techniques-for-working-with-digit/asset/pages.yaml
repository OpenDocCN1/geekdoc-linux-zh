  md: '# 4.4 CONVERSIONS OF SELECTIONS, CHANNEL MASKS, LAYER MASKS, AND ALPHA CHANNELS


    As has been discussed many times already, selections, channel masks, layer masks,
    and alpha channels are all different implementations of the same thing. They partition
    a layer into selected pixels, partially selected pixels, and unselected pixels.
    Although they all do the same, they do it in slightly different ways...ways that
    are remarkably complementary.


    Being able to convert a selection to a layer mask or an alpha channel to a channel
    mask is often useful, however, it may not always be obvious how to go about it.
    As an aid to the reader, the table shown in Figure 4.35 describes the steps required
    to convert from any of the four types to any other. You may want to bookmark this
    page.


    | To | Selection | Channel Mask | Layer Mask | Alpha Channel |

    |---|---|---|---|--|

    | From | | | Image: Select/Save To Channel | (1) Layers Menu: Add Layer Mask |
    Image: Edit/Cut (C-x) |

    | Channel Mask | Channels Menu: Channel To Selection | (2) Image: Edit/Cut (C-x)
    | (1) Channels Menu: Channel To Selection | (2) Layers Menu: Add Layer Mask |
    (3) Image: Edit/Cut (C-x) | (2) Image: Edit/Cut (C-x) |

    | Layer Mask | Layers Menu: Mask To Selection | (1) Layers Menu: Mask To Selection
    (2) Image: Select/Save To Channel | | Layers Menu: Apply Layer Mask |

    | Alpha Channel | Layers Menu: Alpha To Selection | (1) Layers Menu: Alpha To
    Selection (2) Image: Select/Save To Channel | Layers Menu: Add Layer Mask (Layer''s
    Alpha Channel) |


    Figure 4.35: Selections, Channel Masks, Alpha Channels, and Layer Masks: Table
    of Conversions


    # 4.5 MASKS AND SELECTIONS


    Chapter 3 described in detail the use of the GIMP''s selection tools; however,
    discussion is incomplete. A full understanding of how to effectively work with
    selections requires a discussion on how to integrate masks. This section shows
    how masks are complementary to the selection tools and illustrates why the combination
    of selections and masks is so powerful.'
  merge: -1
  pgno: 142
