    # 6.2.7 Other Color Correcting Tools


    The GIMP has several other color correcting tools. These all live in the Image:Colors
    menu and their names are Color Balance, Brightness-Contrast, and Hue-Saturation.
    In this book, these tools are not covered in detail, and for good reason. Although
    they can be used for touchup and enhancement, these tools are like working with
    a dull knife, especially when compared to the Curves tool, which has the precision
    of a surgeon''s scalp. Let''s see why.


    # The Color Balance Tool


    Figure 6.25(a) shows the dialog for the Color Balance tool. This allows an image
    to be adjusted in the shadow, midtone, or highlight regions for the red-cyan,
    green-magenta, or blue-yellow balance. Curves does exactly the same thing except
    with much greater precision. Raising a curve at a point adds more of the color
    it represents at the expense of the complementary color around that point. Lowering
    the curve has the opposite effect, of shifting the balance towards the complementary
    color.


    The Curves tool can do anything the Balance tool can, only better. The reason
    Curves is more powerful is that the Color Picker is used to identify exactly which
    input values need balancing. The Color Picker is shown in Figure 6.25(b), and
    it is displaying a value for a measured pixel in an image. This value can be precisely
    placed and manipulated in the Curves tool. Figure 6.25(c) shows how a control
    point, corresponding to the green component of the measured pixel, has been placed
    on the Green channel'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'curve. This placement of a control point, corresponding to a measured pixel
    value, permits the subsequent, precise correction of color balance at this point.
    By comparison, the Color Balance tool only allows for the gross selection of input
    regions (shadow, mildew, and highlight) and is incapable of performing the precision
    color corrections described in detail in Section 6.2.2.


    ![](img/32c07c3b65137f501f1232a822a70623_218_0.png)


    the conclusion is that the Curves tool is much more precise and versatile than
    the Color Balance tool.


    THE BRIGHTNESS-CONTRAST TOOL

    Figure 6.26(a) displays the dialog for the Brightness-Contrast tool. The way this
    tool functions can be fully simulated using the Curves tool. Figure 6.26(b) illustrates
    the Value channel of the Curves tool, showing that the curve has been displaced
    upward. Moving the value curve maps the input value domain to an output range
    that is much brighter. This modification to the value curve exactly simulates
    the action of the Brightness-Contrast tool when the Brightness slider in the dialog
    is moved to the right. Moving the Brightness slider to the left corresponds to
    displacing the value curve downward.


