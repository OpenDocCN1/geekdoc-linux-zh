    ![](img/32c07c3b65137f501f1232a822a70623_322_0.png)


    Figure 9.14(a): Selecting a Polygon Region


    As soon as an area like the polygon in Figure 9.14(a) has been defined, the Settings
    dialog appears as shown in Figure 9.14(b). This is used to specify the hyperlink
    associated with the selected area. As you can see from the dialog, any valid link
    can be specified. In this example, the text http://www.gimp.org has been entered
    as the link. In addition, information text has been added to the Comment field
    at the bottom of the dialog. The Settings dialog allows the polygon to be edited
    and Java scripts to be associated with the selected area. These functionalities
    are activated by clicking on the relevant tabs in the dialog.


    Figure 9.15(a) shows the ImageMap dialog after several areas have been selected.
    The three areas are each shown in the Region List, and the active one is highlighted
    in blue. The editing tools can be used to modify any of the areas in the Region
    List. You can make a particular area active by clicking on it you'
