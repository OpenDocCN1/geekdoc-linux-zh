    this in Chapters 4 and 7 where the Threshold tool takes the place of the Magic
    Wand.


    # 3.5.3 USING ZOOM


    One of the useful tools that can be used in conjunction with the Bezier Path selection
    tool is the Zoom tool, found in the Toolbox and in the Image:View menu. This tool
    was covered in some detail in Section 1.8.1; however, its value for aiding selections
    is emphasized here.


    When attempting to perform a precise selection of a subject, it is essential to
    get in close to the pixels. 3.26(a) shows a Bezier path of an airplane that is
    to be converted to a selection. However, prior to the conversion it is desirable
    to examine the path to verify its accuracy.


    ![](img/32c07c3b65137f501f1232a822a70623_110_0.png)


    Figure 3.26: Using Zoom to Aid with Selections


    Figure 3.26(b) is a 400% zoom of Figure 3.26(a). As can be seen, the control point
    of the Bezier path located at the junction of the right wing and the fuselage
    is not quite positioned. It is only through the use of Zoom such that a careful
    examination of the selection can be made. It is quite easy to improve the positioning
    of the control point using the Edit Point button in the Paths dialog.'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'Although the Zoom tool was used in Figure 3.26(b) to verify Bezier path, it
    is often a good strategy to draw the path from the start in a zoomed window. A
    useful tool for helping with this is the Navigation Window, found in the Image:View
    menu. Figure 3.2g(c) illustrates this, which consists of a thumbnail of the image
    with a panning rectangle superimposed on it. The panning rectangle shows the part
    of the image that can be viewed in the zoomed window. The panning rectangle can
    be dragged with the left mouse button, and makes the image in the zoomed window
    move in tandem with it. In addition to the panning function of the Navigation
    Window it also contains +/- buttons, which can control the amount of zoom applied
    to the image window.


    # 3.5. SELECTIONS AND GUIDES


    The image window guides (see Section 2.6.1) can be used to accurately position
    a selection made with the Ellipse Select or Rectangle Select tools. An example
    of the former is illustrated in Figure 3.27. The figure shows a clock and also
    shows horizontal and vertical guides that have been positioned to the perimeter
    of the clock''s upper and left edges.


    ![](img/32c07c3b65137f501f1232a822a70623_111_0.png)


    Choosing the Ellipse Select tool from the Toolbox, the selection is begun by clicking
    and dragging from the intersection of the two guides. If the Snap to Guides checkbox
    in the Image:View menu is toggled on, the initial point for the selection snaps
    to the guides'' inter-section. Because the guides are tangent to the clock''s
