    around the mask edges. This means that they are mistakenly not included in the
    set of selected pixels.


    Finally, in both Figures 4.38(a) and (b), a rough-edge, aliasing effect can be
    seen.


    Each of these three problems can be solved by refining the mask. This can be accomplished
    using several different methods, but for this type of fine work near a mask edge,
    the best choice is the Airbrush tool from the Toolbox. The Airbrush can apply
    a very light coat of paint, so it is a great touch-up tool. Working near the edge
    requires blending of the background with the subject. When used with a light pressure
    the Airbrush is perfect for this.


    Figure 4.39(a) shows the Tool Options dialog for the Airbrush. It is the Pressure
    option that interests us. The Pressure slider is in units of percent, and the
    default value of 10% is shown in Figure 4.39(a). The effect of 10% pressure in
    conjunction with the soft brush chosen in Figure 4.39(b) produces the top line
    painted in Figure 4.39(c). Each of the other lines is painted with the Pressure
    value labeled to the right of the line. This figure shows that for low pressures,
    the Airbrush produces a very light layer of paint, great for touching up imperfect
