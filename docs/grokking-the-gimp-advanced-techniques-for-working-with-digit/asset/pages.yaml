  md: 'The second mode of operation for the Zoom tool is accessed by simply clicking
    or Shift-click in the image window. Each click zooms in a step and Shift-click
    zooms out a step. The image window can also be zoomed in or out with keyboard
    shortcuts. Zooming is performed by typing = in the image window, and zooming out
    is performed by typing - (that is, the minus key). Notice that the = on the same
    as the key +, which should remind you that it adds or increases zoom. By contrast,
    the key subtracts or decreases zoom. An advantage of the keyboard shortcuts is
    that they function without having to first click on the Zoom icon in the Toolbox.


    The function Shrink Wrap, found in the:View menu, can be used to resize the window
    to encompass the entire image, but only within the limits of your monitor’s screen.
    Shrink Wrap can also be invoked by typing C-e in the image window.


    Whenever a part of a zoomed image cannot be seen in the image window, the image
    panier can be used to pan to a desired image area. There are also three other
    possibilities for panning in a zoomed image. There are the window’s scroll bars,
    however, these probably aren’t the most convenient method. The second choice is
    middle-click and drag in the image window. This can work reasonably well if the
    image needs to be adjusted only incrementally. If it is necessary to pan back
    and forth between many different regions of a zoomed image, the Navigation Window
    is probably


    The use of the Navigation Window, found in the Image:View menu, is shown in Figure
