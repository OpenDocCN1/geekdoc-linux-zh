    # 3.3.13 The Toggle Selection Function


    Unlike the other selection functions discussed in this section, Toggle Selection
    is found in the Image:View menu. This command is very useful when trying to carefully
    position layers or selections (for example, any project in Chapter 7), or when
    trying to color-match a layer or selection edge (for example, see Section 7.5)


    The Toggle Selection command toggles on and off the visibility of the selection''s
    Marching Ants. However, this function does not eliminate the selection. The selection
    is still there, it is just not visible in the image window. The Toggle Selection
    feature also toggles on and off the visibility of the black-and-yellow layer boundaries
    in an image. This feature is also used extensively in Chapter 7.


    There is a pitfall when using Toggle Selection. If boundaries have been toggled
    off. This can lead to confusion, especially when a subsequent selection is made.
    Because selection has been toggled off, the Marching Ants do not appear. I scratched
    my head many times trying to figure out why all of a sudden GIMP no longer seemed
    to be working! GIMP, of course, was working just fine. The selection is there;
    it can''t be seen until its visibility is toggled back.


    The Toggle Selection function is so useful that you might want to memorize its
    keyboard shortcut, which is C-t.'
