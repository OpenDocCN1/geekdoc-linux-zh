    of these is what we want.


    To produce an animation that runs correctly, it is necessary to give each layer
    frame a copy of the Earth layer. This is done by duplicating the Earth layer seven
    times and merging each copy with a shuttle frame. Section 2.7.1 describes how
    to do this using the Merge Down function. The result of merging the seven background
    layers with the seven shuttle frames is shown in the Layers dialog illustrated
    in Figure 9.10(b). Also shown, the layer with the SuperNova effect has been moved
    to the top of the layer stack (the final animation frame), and the timing information
    of the layer at the bottom of the stack (the first animation frame) has been set
    to 2000ms. Thus, the final animation sequence remains in the ''bottom layer for
    2 seconds, followed by a sequence of 8 frames showing the shuttle''s trajectory
    into the atmosphere, and, finally, showing the top frame, which displays the burst
    of light from the SuperNova animation.


    # 9.1.5 ANIMATION OPTIMIZATION


    Saving an animation to GIF format can create large files, especially if the animation
    has many frames. For example, the space shuttle animation discussed in the previous
    section consists of an image whose dimensions are × 182 pixels and 9 frames. This
    is an image consisting of 780 thousand pixels. Due to compression built into the
    GIF image format, this saves to a 389 kilobyte file. However, the file size can
    be significantly reduced by taking advantage of the high degree of redundancy
    in the image.


    The redundancy is due to animation changing very little from frame to frame. In
    fact, the background is always the same, and only the position and shape of the
    shuttle is changing. The function Animation Optimize in the Image:Filters/Animation
    menu takes advantage of this and can greatly reduce the size of the resulting
    file. This is done by differing frames and only saving the non-zero values. The
    original animation is reconstructed by adding the differed frames back into the
    background.


    For the space shuttle animation, the file is reduced from 389 to 163 kilobytes
    if the Animation Optimize option is applied after conversion to Indexed format.
    If it is applied to the image in RGB mode, before conversion to Indexed'
