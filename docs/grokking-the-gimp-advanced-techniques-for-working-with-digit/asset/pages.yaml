    # 1.4 RGB, GRAYSCALE, AND INDEXED IMAGES


    The GIMP uses three formats for displaying and working with images. These are
    the RGB, Grayscale, and Indexed formats. Although Grayscale is discussed briefly
    in Chapter 5 and Indexed format in Chapter 9, the primary format used in this
    book is RGB.'
