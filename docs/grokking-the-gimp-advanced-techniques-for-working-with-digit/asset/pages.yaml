    Being able to see the image through the filmy parts of the channel mask, as illustrated
    in Figure 4.4(a), makes it possible to edit the mask according to the features
    of the image behind it. In this way, the channel mask is like a piece of digital
    layer tracing paper placed over the image.


    # 4.1.4 SETTING A CHANNEL MASK''S COLOR, TRANSPARENCY, AND TITLE


    Double-clicking in the channel mask title area brings up the Channel Options dialog,
    shown in Figure 4.5(b). This dialog allows three mask attributes to set the Channel
    name, the Fill Opacity, and the mask color. Setting the name is self-explanatory,
    but the other two merit some discussion.


    The Fill Opacity slider sets the degree to which the image layer is visible through
    the filmy parts of the mask. The slider''s units are in percent so if the opacity
    is set to 10, only the parts of the image that are visible are those that correspond
    to the white part of the mask, and the parts of the image corresponding to the
    black parts of the mask cannot be seen. Alternatively, if the opacity is set to
    0, the image is completely visible, and the mask cannot be seen. An intermediate
    opacity setting allows the masked-out regions of the image to be seen through
    the black part of the mask. Adjusting the Fill Opacity slider allows an optimum
    working level to be set for the mask.'
