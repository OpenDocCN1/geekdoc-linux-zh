    In Figure 1.13, note how the highlighted thumbnail in the Undo History dialog
    indicates the current status of the image displayed in the image window. Performing
    an undo by typing C-z in the image window moves the highlighted thumbnail to a
    layer higher in the thumbnail stack, and performing redo with C-r moves the thumbnail
    a layer lower. Furthermore, you can select any layer in the Undo History dialog
    at any time by clicking on it.


    In this way, you have access to any previous version of the image available in
    the Undo History by one of two separate methods: by repeatedly pressing C-z in
    the image window until arriving at the desired state. The second is by directly
    clicking on the corresponding thumbnail in the Undo History dialog.'
