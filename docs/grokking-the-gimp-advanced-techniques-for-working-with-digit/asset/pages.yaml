    Finally, the Path Transform Lock can be toggled on and off by clicking to the
    left of the Path Thumbnail. When the icon is toggled on, the shape’s locked to
    the active layer with respect to the transform tool. This means that any transform
    applied to the active layer is also applied to the path.'
