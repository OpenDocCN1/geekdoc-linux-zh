  md: '# 1.6 RECALLING THE LAST FILTER DIALOG


    Most GIMP filters are dotted with a variety of parameters which control the filter
    effect. Because it is often difficult to know in advance how much of a certain
    filter parameter you want to apply to an image, a little experimentation is necessary.
    Unfortunately, the GIMP filters are three menus deep in the Image menu. experimenting
    with a filter means finding it in the appropriate submenu, evaluating its effect
    on the image, undoing if it is unsatisfactory, and reapplying the filter with
    new settings. Repeatedly searching for the same filter in the system of image
    submenu can be annoying.


    One way to limit the annoyance is by reoff the filter submenu. A more direct method,
    however, is by using the keyboard shortcut for the Reshape function. The shortcut
    is A-f. This function calls the dialog of the last filter applied to the image,
    along with the previously used values. With just two keystrokes, C-z followed
    by A-f, a filter effect can be undone and redone with new parameter values.


    # 1.7 COPY, CUT, AND PASTE BUFFERS


    Copying, cutting and pasting of layers and selections are among the most common
    operations in the GIMP. In this book, these operations are used extensively in
    Chapter 4, where they are needed for building masks; in Chapter 8, where they
    are used for image rendering; and in Chapter 7, where they are essential for compositing.


    The commands for copying, cutting, pasting are found in the Image:Edit menu, but
    they are so useful that memorizing their keyboard shortcuts is indispensable.
    The Copy command can be performed by typing C-c in the image window, cutting by
    typing C-x, and pasting by typing C-v. As is seen in Chapters 2, 3, and 4, copying,
    cutting and pasting are the most tedious methods of moving layers between image
    windows and layer masks.


    The GIMP manages copying, cutting, and pasting using buffers. Whenever a generic
    copy or cut is performed, it is placed into the default buffer, replacing whatever
    is there. A generic paste uses the contents of the default buffer without clearing
    it, so the contents can be reused until they are replaced by another copy or cut
    operation. A copy or cut places the active layer, or layer mask into the buffer.
    If a selection is active in the image window, only the part of the active layer
    contained in the selection is placed in the buffer.


    General special paste functions are available in the Image:Edit menu. If an image
    has an active selection, the Paste function places the contents of the'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'default buffer into the selection, clipping the pasted image to the selection''s
    boundaries. The pasted image can be repositioned using the Move tool.


    Paste As New places the contents of the default buffer into a new image window
    that has dimensions large enough to accommodate the pasted image.


    There is also a special copy function called Copy. Instead of copying the active
    layer to the default buffer, this function copies all the visible layers or, if
    a selection is active, the parts of the visible layers within the selection boundaries.
    If the image consists of more than one layer, the copied contents are flattened,
    removing the layered structure before being placed into the default buffer.


    In addition to the generic, default buffer, the GIMP also has named buffers. If
    a large number of copy, cut, or paste operations are required, the named buffers
    can be useful for organizing and distributing the pieces. Figure 1.14(a) illustrates
    a circular selection that is placed into a named buffer using Copy Named, found
    in the Image:Edit menu. Using this function displays the dialog in Figure 1.14(b),
    where the name of the buffer is entered. Figure 1.14(c) and (d) illustrate using
    Copy Named, repeated for a square selection.


    ![](img/32c07c3b65137f501f1232a822a70623_40_0.png)


    ![](img/32c07c3b65137f501f1232a822a70623_40_1.png)


    Figure 1.14: Using the Named Buffer


    Pasting from a named buffer is performed using the Paste Named command, found
    in the Image:edit menu. Figure 1.15 illustrates the dialog that appears when using
    this command. The contents of any named buffer can be pasted by clicking on the
    name in the dialog, followed by clicking on the Paste button. Buffers can be removed
    from the list by highlighting them and clicking on the Delete button.'
