    # 2.7 COMBINING LAYERS


    It is often necessary to combine several layers into one. This is particularly
    useful prior to saving an image to a non-GIMP format such as JPEG or GIF. There
    are two ways of combining layers in the GIMP. The method to use depends on the
    final use of the resulting image.'
