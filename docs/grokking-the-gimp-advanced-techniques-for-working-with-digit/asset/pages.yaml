    Figure 3.27: Positioning an Elliptical Selection Using the Guides'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# 3.6 COMMON PROBLEMS AND FREQUENTLY ASKED QUESTIONS


    There are some problems with selection tools that everyone is tripped up sooner
    or later. Here is a common list:


    +   - I choose a selection tool from the Toolbox and try to make a selection,
    but the Marching Ants don''t appear, and the selection doesn''t seem to have been
    made. What''s wrong?

    This is such a common problem! It is due to the Marching Ants having toggled off
    in some prior operation. Toggle the Marching Ants back on by typing c- in the
    image window or by clicking on the Toggle:Selection checkbox in the Image:View
    menu.


    +   - I try to cut, paste, or filter a selection, but nothing happens. Why not?

    Your image contains multiple layers, and the active layer is not visible. Operations
    in the GIMP are applied to the active layer (for more information, see Chapter
    2). Thus, the selection in your image may be visible, but the active layer may
    not be. Open the Layers dialog and verify that the layer you are working on is
    active and is visible in the image window.


    +   - I''ve selected the Bezier Path tool from the Toolbox, but clicking in the
    image window with the mouse button doesn''t produce any control points. What''s
    going on?

    Open the Paths dialog and verify that there is an active path in the Paths Palette.
    If there isn''t, create a new one by clicking on the New Path button. Also, verify
    that the New Point mode button is toggled on.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# 4


    # MASKS


    asks are powerful GIMP tools, and it would be quite difficult to do many things
    without them. What are masks? They are selections! Actually, they are grayscale
    images that represent selections. In masks, the white regions represent selected
    pixels, the black regions unselected pixels, and the gray regions partially selected
    pixels.


    You may be asking, “Why do we need another way of representing a selection? Wasn''t
    the selection tools presented in Chapter 3 good enough?” The selection tools are
    good, but masks provide a whole new set of options for creating and editing selections.
    This chapter demonstrates how the GIMP''s painting tools, gradients, and filters
    can be used with masks to get selection results that would be impossible with
    the selection tools alone. Masks are complementary to the selection tools, and
    this chapter shows how the two can be used together to produce the most effective
    results.


    In addition to the new capabilities for editing and creating selections masks
    provide, they also have another very useful feature. A mask can be stored and
    used more than once. Selections created with the selection tools are more ephemeral.
    When created, they exist only until another selection is made or until they are
    canceled. Moreover, while a selection is present in the image window, it only
    allows operations to be applied to the pixels in the selected region. This means
    that active selections can impede the work flow because pixels outside the selected
    region cannot be processed. Thus, there is a need for selections that can be stored
    and reused. Masks provide this capability, and, as will be seen shortly, it is
    easy to convert selections to masks and vice versa.'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'There are two types of masks in the GIMP: channel masks and layer masks. A
    channel mask is an independent entity and can be applied to any image layer. Alternatively,
    a layer mask is associated with a single layer, on which it is totally dependent.
    Every layer in an image can have a layer mask, but each layer mask is specific
    to its own layer. In addition, the layer mask is directly linked to its alpha
    channel. As was discussed in Section 2.2, the alpha channel controls the opacity
    of the layer. As will be developed more in in this chapter, the alpha channel
    is just a special mask and, as a mask, it is just a special type of selection.


    Selections, channel masks, layer masks, and alpha channels. They are the same,
    they are different, and it is all explained in this chapter. Read on!


    # 4.1 Channel Masks


    A channel mask is a special grayscale layer only 8 bits deep and is used to store
    and edit selections. This section describes the Channels dialog, how to save selections
    to channel masks, how to convert channel masks to selections, and the other GIMP
    functions used for organizing masks and operating on them.


    # 4.1.1 The Channels Dialog


    As an image can have any number of layers, it can also have any number of channel
    masks. Thus, analogous to the Layers dialog, the Channels dialog is the tool for
    organizing and working with channels. The Channels dialog is obtained by typing
    c-1 in the image window and clicking on the Channels tab in the resulting Layers
    & Channels window. Figure 4.1 illustrates the various elements of the Channels
    dialog.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Layer - Channels


    The most important feature of the Channels dialog is the Channels Palette. This
    region of the dialog consists of horizontal strips where the top entries are always
    the Red, Green, and Blue channels of the image, already described in Section 2.2.1.
    The rest of the strips are channel masks. Figure 4.1 shows a single channel mask.
    The channel mask strip displays a thumbnail image of the mask''s contents, and
    the


    ![](img/32c07c3b65137f501f1232a822a70623_115_0.png)


    area to the left of the thumbnail contains an Eye icon. Analogous to layer strips
    in the Layers dialog, the visibility of the Eye icon for channel strips can be
    toggled on and off, making the channel mask either visible or invisible in the
    image window.


    To the right of the thumbnail is the Channel Title Area. In Figure 4.1 the channel
    is named A Channel Mask. The title can be changed by double-clicking in the Channel
    Title Area. This brings up a dialog where the new title can be entered.


    The channel strip in Figure 4.1 is highlighted in blue, indicating that it is
    the active channel. A channel mask is made active by clicking on its thumbnail
    or Title Area. Only a single channel mask can be active at a time, and when a
    channel mask is active, none of the image layers can be active. Because GIMP tools
    applied to the image window are applied to the active layer or channel, which
    can sometimes be a source of confusion. After working on a channel mask, to work
    on a layer it is necessary to explicitly switch to the Layers dialog and make
    the layer active.


    The remaining elements of the Channels dialog are the Channels menu and the button
    bar. These are described in more detail shortly.


    # 4.1.2 SAVING SELECTIONS TO CHANNELS MASKS


    One of the primary uses you will make of channel masks is to save selections.
    Why would you save a selection to a channel? There are many reasons. The first
    is that saving the selection protects your work, which is particularly important
    if you are making an involved and difficult selection. Second, it allows you to
    make your selections in parts. This helps divide and simplify the work. Third,
    it allows you to reuse a selection for several purposes. This'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'for all sorts of rendering operations, such as making drop shadows, high-lights,
    and special textures (for example, Section 8.5). Fourth, it allows you to refine
    your selections in ways that would otherwise be impossible. Finally, many special
    effects can be had using filter plug-ins on. As you can see, saving a selection
    to a channel mask has a very broad range of benefits.


    After making a selection with any of the tools described in Chapter 3, we can
