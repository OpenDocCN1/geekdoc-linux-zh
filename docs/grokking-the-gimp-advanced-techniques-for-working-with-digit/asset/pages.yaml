- img_proc: true
  md: '# THE LASSO (THE FREE-HAND SELECTION TOOL)


    The Lasso is used to draw free-hand selections. Although its official name is
    the Free-Hand Selection tool, the Lasso will be preferred in this book because
    the tool''s icon in the Toolbox resembles a lasso (and it''s also a lot shorter
    to type).


    The Lasso is used by clicking and dragging in the image window, tracing out the
    shape to be selected. Releasing the mouse button completes the selection. While
    tracing the Lasso, the outline of the selection can be seen, and when completed,
    the selection is shown by the Marching Ants. Figure 3.4 shows an example of a
    Lasso selection.


    ![](img/32c07c3b65137f501f1232a822a70623_83_0.png)


    Figure 3.4: A Lasso Selection


    The advantage of the Lasso is that it can be used to select arbitrarily complex
    objects. The disadvantage is that the work can be painstakingly slow, requiring
    extremely fine control of the mouse. Even the small selection shown in Figure
    3.4 was difficult, because the tree''s outline is jagged and rough. Another aspect
    of the Lasso is that the mouse button cannot be released while the selection is
    being made. This precludes using this tool for making large, complicated selections.
    For these reasons, the Lasso will not be the selection of choice for fine-grain
    work. Rather, it will mainly be used to rough-out complicated shapes or for completing
    work over masks. A good example of the use of the Lasso is demonstrated in Sections
    4.5.3 and 7.4.


    # THE MAGIC WAND (THE FUZZY SELECT TOOL)


    Although its name is officially the Fuzzy Select tool, the Magic Wand will be
    preferred in this book because the tool''s icon, as shown in the Toolbox, resembles
    a Magic wand. The Magic Wand makes selections by specifying a pixel in the image.
    The seed is the first selected pixel, and the pixels adjoining the seed are included
    in the selection if their colors are sufficiently close to the color of the seed.
    This creates a new set of selected pixels. This process is repeated with the neighboring
    pixels of the selected set, and so on, until no more pixels can be added.


    Figure 3.5 illustrates how the Magic Wand works. Figure 3.5(a) shows a smoothly-varying,
    radial gradient of pixel values going from black at the center to white at the
    edges. The location where the seed was chosen with the mouse is indicated. The
    resulting ring-like region selected by the Magic Wand is shown by the Marching
    Ants. The ring includes both sides of the seed because the Magic Wand includes
    pixels that have both higher and lower color values than the seed.


    Selections'
