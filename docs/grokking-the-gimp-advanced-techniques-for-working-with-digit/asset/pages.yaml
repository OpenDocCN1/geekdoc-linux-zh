  md: '![](img/32c07c3b65137f501f1232a822a70623_238_0.png)


    # Figure 7.2: Pasting an Image Component into the Holiday Scene Background


    There are two features worth noting in Figure 7.2. First, the Layers dialog shows
    that the new layer has been named Angel Fish to more easily identify it later.
    Second, the Angel Fish layer''s boundaries (the yellow and black dashed line)
    are visible in the image window because it is the active layer in the image. The
    layer''s boundaries can be toggled by typing c-t in the image window.


    With respect to our composition, the first thing you might notice is that the
    angel fish seems too large for the background. This can be fixed by shrinking
    the angel fish or enlarging the background. As already noted in Section 2.6.2,
    it is almost preferable to shrink an image element that is too large than to enlarge
    the element that is too small. This is because enlarging an image requires interpolating
    pixel values, which introduces unpleasant image artifacts. Always avoid this—unless,
    of course, the artifacts are desirable as an artistic device.


    Thus, our first task is to scale the Angel Fish layer to a more fitting size for
    our scene. This can be done in two ways, either with the Transform tool from the
    Toolbox, or the Scale command found in the Layers menu. Section 2.6.2 describes
    both. The Transform tool is used here because it is interactive and gives some
    visual feedback to the scaling process. The Scaling option of the Transform tool
    is invoked by double-clicking on the Transform tool icon in the Toolbox, which
    brings up the Tool Options dialog. The Scaling option can then be selected from
    the dialog, as shown in Figure 7.3(b). Figure 7.3(a) shows the result of using
    the Transform tool to scale the Angel fish layer.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_239_0.png)


    Figure 7.3: Scaling the Angel Fish


    In scaling the fish layer, the aspect ratio has been preserved. This prevents
    the scaled layer from looking distorted. The aspect ratio can be maintained manually
    by watching the Scaling information dialog and keeping it manually adjusted during
    the scaling process. The Scaling information dialog provides interactive feedback
    about the X and Y Scale Ratios while the transform is being performed. The aspect
    ratio is preserved by keeping the X Scale Ratio equal to the Y Scale Ratio. Alternatively,
    the Scaling option of the Transform tool can be constrained to preserve aspect
    ratio by pressing the Control and Alt keys while scaling. In this example, the
    angel fish has been scaled to 60% of her original dimensions. In the compositing
    process, however, this might be undone and redone several times to achieve the
    desired effect in the final result.


    When the scaling of the angel fish is complete, she can be positioned using the
    move tool. Her final location for this project is seen in Figure 7-4. Also seen
    in this figure is the result of repeating the preceding operations for each of
    the angel fish''s friends. Notice that it is not necessary for the repositioned
    image to be inside the boundaries of the background image window. In fact, having
    layers that extend partially outside the boundaries can create more interest in
    their subject elements.'
