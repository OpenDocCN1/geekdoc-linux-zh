    Gradient Rendering Techniques 269'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'Normally, gradients are applied to images by clicking and dragging in the image
    window. The two points defined by where the mouse was clicked and where it was
    released specify the orientation and the extent of the applied gradient. The curious
    thing about Shapeburst gradients, however, is that the result does not depend
    on where the mouse is clicked, not on where it is released. It just fills the
    active region with a shapeburst, regardless of how the mouse is used.


    The way in which a shapeburst gradient transitions from the foreground to background
    color can be controlled by the type of shapeburst. As shown in Figure 8.4, there
    are three different shapeburst types: angular, spherical, and dimpled. Shapeburst
    (spherical) produces the roundest level and Shapeburst (dimpled) the sharpest.
    Shapeburst (angular) is a compromise between the two.


    The result in Figure 8.7 can be made to look a lot jazzier by applying another
    shapeburst gradient to the Background layer. The result of applying the Shapeburst
    (spherical) gradient to the Background layer is shown in Figure 8.8(a). The gradient''s
    foreground color is red and the background color is black. Figure 8.8(b) shows
    the corresponding Layers dialog.


    ![](img/32c07c3b65137f501f1232a822a70623_281_0.png)


    # 8.3 THE EMBOSS AND BUMP MAP FILTERS


    There are two filters that are particularly useful for rendering. These are Emboss
    and Bump map.'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'The Emboss filter, found in Image:Filters/Distorts, creates the effect that
    an image is embossed into a thin metal plate. Figure 8.9 illustrates the use of
    the filter for a very simple case. Figure 8.9(a) shows an image that was created
    using a radial gradient, and Figure 8.9(b) shows the corresponding dialog for
    the Emboss filter. The dialog consists of a preview, two radio buttons labeled
    Emboss and Bumpmap, and three sliders called Azimuth, Elevation, and Depth.


    ![](img/32c07c3b65137f501f1232a822a70623_282_0.png)


    Figure 8.9: The Emboss Filter Dialog


    The three sliders in the filter dialog control the embossing effect, and Figure
    8.10 shows a 3D scene that defines the effect of each one. In the scene there
    is a pyramid object illuminated by a light source. Two angles, the Azimuth and
    Elevation, define the position of the light with respect to the pyramid. The Azimuth
    describes the light source''s angular position in the horizontal plane, similar
    to a compass bearing. The Elevation is the angular measure of the source above
    the plane.


    ![](img/32c07c3b65137f501f1232a822a70623_282_1.png)


    Figure 8.10: Geometric View of the Emboss Filter Options'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'When the light source is on one side of the object, the other side must be
    in shadow, as shown in Figure 8.10. When the Elevation is 90°, the light source
    is positioned vertically over the object, and all faces are equally illuminated,
    which eliminates the shadow. There is, however, more light coming from surfaces
    that are perpendicular to the rays of light than those are oblique. Thus, Azimuth
    and Elevation control the direction of light and shadow.


    Wait a minute! That''s fine for a 3D object,” you might say. “But we are working
    with flat images...how does EMBOSS determine the relative angles for something
    that, in reality, is completely flat?” I was hoping you would ask. Figure 8.11
    shows the radial gradient from Figure 8.9(a) in a 3D context. That is, the image
    is 2D, but an imaginary light source is positioned over it at some azimuth and
    elevation. The little red arrows shown in the image plane explain how the filter
    embosses the image.


    ![](img/32c07c3b65137f501f1232a822a70623_283_0.png)


    Figure 8.11: How Emboss is Applied to a 2D Image: Magnitudes of the Gradient Vectors


    The red arrows, called gradient vectors, are computed for each pixel in the image
    (only three are shown in Figure 8.11). For each pixel, the gradient is drawn in
    the direction that pixel values decrease the fastest, and the length of the arrow
    is determined by the amplitude of that change. Thus, in Figure 8.11, there are
    two arrows each pointing from their pixels in the direction of greatest change,
    and one is longer than the other because its slope of change is greater. The third
    arrow is just a dot because it is located in a region where there is no change
    in pixel value value. Its length is zero.


    The Emboss filter works by computing the amount each pixel''s gradient vector
    projects along the vector from the pixel to the light source. You can see that
    the gradient vector labeled *a* in Figure 8.12 has a positive projection onto
    the vector pointing towards the light source. Alternatively, the gradient vector
    labeled *b* has a negative projection because it points away from the light source.
    Finally, the gradient vector labeled *c* has no component along the direction
    to the light source. Its projection is zero.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_284_0.png)


    **Figure 8.12:** How Emboss is Applied to a 2D Image: Directions of the Gradient
    Vectors


    Gradient arrows that have a large positive projection in the light source direction
    are mapped to lighter grays up to the maximum projection, which is mapped to white.
    Gradient arrows that have negative projections are mapped to darker grays up to
    the maximum negative projection, which is mapped to black. Pixels whose gradient
    dialog has no component in the light source direction are mapped to the midtone
    gray, $127^{c}-127^{r}$. Exactly how much light or dark is used in the map depends
    on the third slider control, labeled Depth in the Emboss dialog (see Figures 8.9(b)
    and 8.10). A Depth value of zero produces no shadow, and a large value produces
    a deep, well-defined one.


    Referring back to Figure 8.9(a), the Azimuth slider is set to zero. This means
    that the light source is positioned to the right of the image. Furthermore, the
    Elevation slider is set to $45^{\circ}$, meaning that the left side of the image
    is in the shadow zone. This agrees with the vector analysis given earlier. The
    pixels on the left side of Figure 8.9(a) have gradient vectors that point away
    from the light source, and these pixels are mapped to darker values. The pixel
    values on the right side have gradient vectors pointing towards the light source,
    so their pixels are mapped to lighter values. The result is the embossed image
    looks like a cone, which can be seen in the image preview area in Figure 8.9(b).


    So much for the theory. How about an example? Figure 8.13(a) illustrates the photo
    of a daisy, and Figure 8.13(c) shows the result of applying the Emboss filter
    to it. The filter options are shown in Figure 8.13(b). The result is impressive.
    Figure 8.13(c) shows a version of the daisy that appears to be embossed into a
    thin sheet of metal.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_285_0.png)


    You should note that, although the result of the Emboss filter is a grayscale,
    it is still an RGB image. Furthermore, it is important to know that Emboss does
    not work on images with an Alpha channel. The Alpha channel must be removed by
    choosing *Flatten Image* from the Layers menu before the image can be embossed.
    Flatten Image is described in more detail in Section 2.7.2.


    A filter that works in a manner similar to Emboss is Bump map, which is located
    in the image:Filters/Map menu. The Bump map filter is more versatile than Emboss,
    and it is very useful for rendering (see Sections 8.6 and 8.7 for two interesting
    applications of bumpmapping).


    The Bump map filter works by embossing one image and multiplying the result with
    another image. This creates the effect of embedding the texture of the first image
    into the second. The filter''s dialog has many options that can control the effect.


    Figures 8.14 and 8.15 illustrate an example of using Bump map. Figure 8.14(a)
    shows a photo from space of Cape Cod in the great state of Massachusetts, and
    Figure 8.14(b) shows a small image created by filling with a pattern selected
    from the *Pattern Selection* dialog. These two images are the raw materials used
    by Bump map in what follows.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_286_0.png)


    Figure 8.14: Cape Cod from Space and a Pattern Texture


    ![](img/32c07c3b65137f501f1232a822a70623_286_1.png)


    Figure 8.15: Applying the Bump map Filter to Cape Cod


    Figure 8.15(a) shows the Bump map dialog, and Figure 8.15(b) shows the result
    of applying the filter to Figure 8.14(a) using the image in Figure 8.14(b) as
    the embossing map. As you can see in Figure 8.15(a), the Bump map filter dialog
    has a few more options than the Emboss filter. The most important is the menu
    labeled Bump map (not to be confused with the filter name). Checking on this menu
    provides a list of all the layers in open images, and the image layer chosen in
    this menu is the one that is used as the embossing map. However, unlike the restriction
    of the Emboss filter, Bump map allows any layer, with or without an Alpha channel,
    to be used. The Bump map dialog also has all the usual options for embossing:
    Azimuth, Elevation, and Depth.


    The Emboss and Bump map Filters 275'
