  md: '# 3


    # SELECTIONS


    Selections are extremely important tools for working with digital images. They
    are a means for partitioning an image into two groups of pixels: those we want
    to work on and those we do not. Selections allow the selective application of
    enhancements, functions, filters, and plug-ins to specific regions of an image.
    Furthermore, selections are essential tools for compositing image material from
    several sources into a single image. This is core to collage and photo montage,
    two subjects developed in detail in Chapter 7.


    This chapter covers the selection tools in the GIMP. However, the material presented
    here is really only half the story on about of selections. The other half is presented
    in Chapter 4, which covers masks. As described, selections and masks are really
    just two implementations of the same principle. They both result in a separation
    of subject from background. arrive at this result, however, using different and
    complementary methods. You really need both to get the best selection results.


    Selections are the scalpel of the image manipulator, and you will use them a lot.
    Because selections can be the most time-consuming and frustrating part of a project,
    it is important to know how to use the selection tools artfully and effectively.
    This chapter explains how each selection tool works, and it presents the array
    of GIMP functions that are directly related to those selections. Furthermore,
    the conditions for which each selection tool is most effective are described,
    and each tool is rated against the others for its usefulness.


    Before launching into the descriptions of the various selection tools, it is worthwhile
    to mention where selections fit into the structure of images. The relationship
    of pixels, channels, layers, and images was described in Section 2.2. Where, then,
    do selections fit in? A selection can be seen in the image'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'window—does that mean it is part of the image? The answer to these questions
    won''t be fully given until Chapter 4, which covers masks. However, for now it
    suffices to know that selections are special channels, independent of the image
    layers, and whose selective effects apply only to the active layer.


    # 3.1 The Basic Selection Tools


    There are two types of selection tools. The first type works by drawing lines
    that separate the selection subject from its background. The second type makes
    a selection by specifying a representative seed pixel from the subject. The selection
    is then made automatically by including other pixels in the image that are sufficiently
    similar to the seed in color.


    A goal of this chapter is to explain which type of selection tool should be applied.
    It is some combination that is the most effective. The decision is partially based
    on evaluating the characteristics of the subject that best differentiate from
    the background. These could be a combination of color, shape, value, or saturation
    (for more the characteristics of color, value, and saturation, see Chapter 5).
    For difficult selections it is often necessary to experiment in order to discover
    the most effective approach.


    # 3.1.1 The Six Selection Tools from the Toolbox


    In this section, we start to develop our skills by reviewing the GIMP''s basic
    selection tools and by exploring their underlying strengths and weaknesses. In
    begin, we discuss the six selection tools found in the GIMP Toolbox, shown in
    Figure 3.1. They consist of the Rectangle Select , the Ellipse Select , the Free-Hand
    Select (also known as the Lasso ), the Fuzzy Select (known as the Magic Wand ),
    the Bezier Path tool, and the Intelligent Scissors. Of of these,'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'Bezier Path and the Lasso are the most useful. Rectangle Select is also of
    some use. Of less use the Magic Wand and Ellipse Select tools. Finally, although
    the Intelligent Scissors has an intriguing name, there is nothing this tool can
    do that cannot be done and more efficiently using other tools.


    ![](img/32c07c3b65137f501f1232a822a70623_81_0.png)


    Figure 3.1: Toolbox Selection Tools


    The Rectangle Select and Ellipse Select tools are used for selecting rectangular
    and elliptical regions in an image. A selection is initiated by clicking and dragging
    in the image window, and the selection is completed by releasing the mouse button.
    The selection process is interactively facilitated by outline of the selection
