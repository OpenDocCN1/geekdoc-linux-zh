    # 4.6 COMMON PROBLEMS AND FREQUENTLY ASKED QUESTIONS


    Masks can be tricky, and, with layers, it is sometimes possible to run into seemingly
    incomprehensible difficulties. The reason is almost always because the active
    layer is not what you think it is. The following lists some common problems you
    might run into masks.


    +   - I saved a selection to a channel mask, and I can''t modify certain parts
    of the mask. Why not?


    The problem is that the selection is still active. This means modifications to
    the mask are allowed only in the selected region. Cancel the selection using Image:Select/None
    or by typing G-S-a in the image window.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '+   I just saved a selection to a channel mask and I can no longer paint or
    filter my image. What’s wrong?


    Saving a selection to a channel automatically makes the new channel mask the active
    layer; however, if you check the Channels dialog, you''ll see that the active
    channel is not visible. The paint and filtering operations you are trying to use
    have applied to the channel mask, which can''t be seen. Either toggle on the channel
    visibility by clicking on its Eye icon in the Channels dialog, or make the desired
    layer active in the Layers dialog.


    +   I try cutting a selection in a mask or channel and nothing happens. What’s
    going on?


    Cutting a selection in a mask has the effect of making the selected pixels the
    background color (as shown by the Active Background Color patch in the Toolbox).
    If the selection is made in a black part of the mask, make the background color
    white. If it is made in a white part of the mask, change the background color
    to black. Typing in the window window sets the default colors, which are black
    for the Active Foreground Color and white for the Active Background Color. Typing
    x switches the foreground and background colors.


    +   I try painting in a layer mask, but the associated image doesn''t become transparent/opaque
    where I painted. I only get paint marks on the image. Why?


    The layer mask is not active. Make sure you select it by clicking on its thumbnail
    in the Layers dialog.


    +   I am trying to use the paint tools, but the results are strange. Sometimes
    I don''t get the color indicated by the Active Foreground Color patch, and other
    times I don''t get anything at all. Is my GIMP broken?


    No, the GIMP is not broken. Check the Mode menu in the Brush Selection dialog.
    If the blend mode is not set to Normal, this explains your problem.'
  merge: -1
