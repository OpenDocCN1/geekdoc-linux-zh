    is always darker than the background (unless either the foreground or background
    are black, and then the result is no change).


    The Difference blending mode is like *Subtract*, but the result is symmetrical
    between the foreground and the background. Difference is symmetrical because it
    applies an absolute value to the difference of the foreground and background values.
    Thus, if one of the RGB components is negative after subtraction, its sign is
    reversed to make it. The resulting mathematical expression for the Difference
    blending mode is


    ```

    R = |F - B|

    ```


    where the vertical bars in the equation represent the absolute value function.


    Figure 5.16 illustrates the application of the Subtract and Difference blending
