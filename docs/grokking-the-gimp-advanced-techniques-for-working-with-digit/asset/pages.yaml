    ![](img/32c07c3b65137f501f1232a822a70623_328_0.png)


    Figure 9.21: Result of Running the 3D Outline Script-Fu Script


    # 9.4 TILEABLE BACKGROUNDS


    Most Web browsers use a small image to construct a tiled background for Web pages.
    Normally the background image should be subtle enough to avoid interfering with
    text and other graphics, and this usually means that the image should be seamlessly
    tiled. Seamless means that you should not be able to see the edges between adjacent
    copies of the image.


    Any image can be made to tile seamlessly in the GIMP. The Make Seamless plug-in
    in the Image:Filters/Map menu does the trick. Figure 9.22(a) shows a small image
    of a fish, and Figure 9.22(b) shows the result of using the Make Seamless plug-in
    on it. The effect of tiling with the modified image can be tested by running the
    tile plug-in (the Tile plug-in is also found in the Image:Filters/Map menu). The
    Tile plug-in tiles an image horizontally and vertically a specified numbers of'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'times. The result of using tile on the image in Figure 9.22(b) is shown in

    9.22(c). The image is displayed as a 2 × 2 tiled array with some

    text placed over it. The text was made using the Beta Dance font at a size of

    150 pixels.


    ![](img/32c07c3b65137f501f1232a822a70623_329_0.png)


    # 9.5 WEB-SAFE COLOR


    A problem with the exchange of images on the Internet is not that all

    computers have the capability of displaying a large number of colors simulta-

    eously. For example, a computer using a display resolution of 1024 × 768

    and using 1 byte (8 bits) of color per pixel requires at least 0.786MB of RAM

    on the video adapter card. Such a system is capable of displaying only 2⁸=256

    colors simultaneously.


    Alternatively, a system that uses 2 bytes (16 bits) per pixel can display

    2⁶=65536 colors, and 3 bytes (24 bits) per pixel can display 2⁴=16,777,216

    colors. Thus, the available color palette grows significantly on a 16 bits-

    per-pixel (bpp) system. known as a true or high color color

    system. However, the demands on the video adapter for these systems also

    grows. A 16 bpp system on a 1024 × 768 pixel display requires about 1.6MB

    of video RAM and a 24 bpp system requires 2.4MB.'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'Many video adapter cards have only 1MB or less of RAM. Although this is less
    and less with common computers being up to 32MB of video RAM, there are still
    many legacy machines that have smaller quantities. The consequence is that an
    image containing more than 256 colors cannot be faithfully displayed on machines
    with only an 8 bpp color depth. Some of the original colors in the image will
    have to be replaced because the lack of a sufficient number of available colors
    on the displaying system. This replacement creates color distortion in the displayed
    image.


    The GIMP uses 24 bits per pixel to represent color, 8 bits for each of the R,
    G, and B channels. Then, the GIMP can easily generate images that have color distortion
    when displayed on low color systems. This is a concern for the Web designer who
    wants to ensure an accurate representation of color for his or her graphics. This
    section discusses the issues of preparing Web-safe color graphics and how to achieve
    this in the GIMP.


    # 9.5.1 Types of Color Distortion


    Color distortion occurs when the monitor is already displaying all the colors
    it can, and a request for a new color is made. The most sophisticated way of handling
    this is by color clipping. This approach displays new colors using the closest
    color from the palette already being displayed. For images with subtle shading,
    this can give rise to banding, which is also called posterization. An example
    of this type of color distortion is shown in Figure 9.23. 9.23(a) shows the original
    image and 9.23(b) the image on a system with insufficient colors. You can plainly
    see the banding of colors in this image.


    ![](img/32c07c3b65137f501f1232a822a70623_330_0.png)


    Figure 9.23: Clipping and Dithering Color Distortions'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'The other type of color distortion is dithering. Although dithering is a color
    distortion, it''s not a bug, it''s a technique used to simulate unavailable colors
    by spatially mixing the available ones as a mesh of small dots. The idea is that
    dithering is more visually acceptable than color banding. Figure 9.23(c) illustrates
    the effect of dithering. Figure 9.23(f) shows a zoomed version of 9.23(c) so that
    you can see the mix of small dots used to simulate unavailable colors. Compare
    this zoomed image with the zooms of the original and color clipped images shown
    in Figure 9.23(d) and, respectively.


    Figure 9.23 shows that dithering is a much more sophisticated approach to the
    problem of color distortion than banding. For continuous gradients of color, the
    rule seems to be that the dithering approach is superior. However, there are caveats
    to it. To see why, you need to understand how dithering works. A simple illustration
    is shown in Figure 9.24, where a color dither scheme is employed using the Checkerboard
    plug-in (in Image:Filters/Render/Pattern menu). The Checkerboard dialog is shown
    in Figure 9.24(b). This plug-in creates a checkerboard pattern in the active layer
    using the colors specified by the Active Foreground Color. Figure 9.24(a) shows
    that these colors have been set to red and green.


    ![](img/32c07c3b65137f501f1232a822a70623_331_0.png)


    ![](img/32c07c3b65137f501f1232a822a70623_331_1.png)


    ![](img/32c07c3b65137f501f1232a822a70623_331_2.png)


    ![](img/32c07c3b65137f501f1232a822a70623_331_3.png)


    ![](img/32c07c3b65137f501f1232a822a70623_331_4.png)


    Figure 9.24: Illustration of Using Dithering to Simulate a Color


    Figure 9.24(b) shows that a 1-pixel check size is being used by the Checkerboard
    plug-in. The result is a simulated dither of the color yellow; as you can see
    in Figure 9.24(c). That resulting dithered color is follows'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'from the discussions of the RGB colorspace in Section 5.1. The vector sum of
    red and green in the RGB cube yields yellow.


    A zoomed version of Figure 9.24(c) is shown in Figure 9.24(d). This plainly shows
    the red and green colors. For comparison purposes, a pure yellow is shown in Figure
    9.24(c). The example shown in Figure 9.24 is exaggerated because it is never necessary
    to dither two colors as distant from each other in the color cube as are red and
    green. However, it nicely illustrates how dithering works.


    The dithering algorithms used in the GIMP are far more sophisticated than that
    illustrated in our checkerboard example. In the GIMP, several dithering algorithms
    are available including the Floyd-Steinberg algorithm. The main feature of Floyd-Steinberg
    dithering is that it uses a pseudo-random spatial distribution of up to three
    colors to simulate an unavailable color. Figure 9.23(f) clearly shows the pseudo-random
    nature of Floyd-Steinberg dithering. In many cases, it is the pseudo-random nature
    of Floyd-Steinberg dithering that improves the overall perception of a dithered
    color image...not always. See Section 9.5.4 for more on this subject.


    # 9.5.2 LOW-COLOR SYSTEMS AND WEB BROWSER COLOR PALETTES


    A low color system provides only 8 bits of color per pixel, which allows only
    256 colors to be simultaneously displayed. When used on low-color systems, Web
    browsers must choose how to represent unavailable colors. Browsers such as Netscape
    Navigator and Internet Explorer use color palettes that are similar but not identical.
    The colors that these two browsers have in common are known as the Web-safe color
    palette.¹ Any designer that is concerned with avoiding color distortion must be
    aware of this special palette and how to use it.


    The Web-safe color palette consists of combinations of the six values 0, 51, 102,
    153, 204, 255 in each of the three colors red, green, and blue. Thus, using notation
    introduced in Section 5.1, $51^2204^1153^3$ is a color from the Web-safe color
    palette, and $52^2204^1153^3$ is not. The total number of colors in the palette
    is $6^3=216$. The six values are used because seven would create too many colors
    for a low-color system (that is, $7^3=343$). What happens to the remaining 40
    colors available on a low color system? They are used for system specific colors,
    and these differ for Mac and PC and for Netscape Navigator and Internet Explorer.
    The bottom line is that you can''t rely on.


    If you use the GIMP''s drawing and painting tools to create graphics from scratch
    and want the result to be Web-safe, it would be useful to have a palette of the
    216 Web-safe colors to work with. You use this palette to select the colors for
    your graphics, knowing that the result will be this same


    ![](img/32c07c3b65137f501f1232a822a70623_332_0.png)'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'on most all systems, low color or not. The GIMP has a variety of predefined-color
    palettes available in the Color Palette dialog in the Image:Dialogs/Palette menu
    or by typing C-p in the image or Toolbox windows.


    ![](img/32c07c3b65137f501f1232a822a70623_333_0.png)


    Of interest is the GIMP''s Web color palette shown in Figure 9.25. The Web palette
    illustrates the 216 Web-safe colors that can be used on low color systems without
    fear of color distortion. However, because the colors are disorganized in this
    palette, it is of limited use as a tool for creative design. A palette that organizes
    colors by hue, saturation, and value would be much more useful.


    The Visibone palettes at http://www.visibone.com/swatches are just such tools.
    The Visibone2 palette is illustrated in Figure 9.26. The Visibone2 palette has
    exactly the same Web-safe colors as the GIMP''s Web palette, but the advantage
    is that its colors are organized into a logical color wheel. It is much easier
    to pick out of common hue, saturation, and value with the Visibone2 palette than
    it is for the Web palette.


    Figure 9.25: Web-Safe Color Palette


    ![](img/32c07c3b65137f501f1232a822a70623_333_1.png)


    # 9.5.3 CONVERTING TO INDEXED COLOR


    For display on 8-bit (low-color) systems, the best way to control the color in
    an image is to convert it to Indexed format. Figure 9.27(a) illustrates the Indexed
    Color Conversion dialog which is invoked by the Indexed function found in the
    Image:Color mode menu.


    Figure 9.26: The VisBone2 Web-Safe Color Palette


    The dialog allows the choice of three types of palettes. The first option, General
    Optimal Palette, is based on the colors actually in the image. The number of colors
    used in this palette can be up to a maximum of 256.


    The second option, Use Custom Palette, allows you to select from a large collection
    of palettes including user-defined ones. The GIMP''s standard palettes are shown
    in Figure 9.27(b) and (c). The default custom palette, is optimized for display
    on low-color systems using browsers as Netscape Navigator or Internet Explorer.
    This consists of the 216, Web-safe color palette illustrated in Figure 9.25. Choosing
    this option guarantees that the resulting indexed image will display with the
    same colors on almost all systems.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_334_0.png)


    Figure 9.27: The Indexed Color Conversion Dialog


    The palette option choice, shown in Figure 9.27, is the Use Black/White (1-bit)
    Palette. This option converts the image to a true black and white (no grays) Indexed
    format.


    The second area in the Indexed Color Conversion dialog is for dithering options.
    The following are the choices:


    +   - No colour dithering

    - Positioned colour dithering

    - Floyd-Steinberg colour dithering (reduced colour bleeding)

    - Floyd-Steinberg colour dithering (normal)


    Normal Floyd-Steinberg dithering is the default. Some experimentation might be
    necessary to find the best choice for Indexed, especially if the image consists
    of smooth color variations and large, solid color regions. Read on!


    # 9.5.4 What Is The Best Choice?


    Given that the designer chooses to limit the palette to one that is Web-safe,
    converting to Indexed format still requires making choices about the type of color
    distortion that is acceptable when it can''t be avoided. Usually the choice depends
    on the type of image to be displayed.


    If the image is a photograph, or one that has smooth color variations, chances
    are good that there are more than 256 colors in the image, and many will not be
    from the Web-safe palette. Normally, the color distortion to photos on an'
  merge: -1
  pgno: 334
- img_proc: true
  md: '8-bit display is not noticeable, and it could be argued that it is fruitless
    to convert the image to an Indexed format under these conditions. When photographs
    are mixed with other graphic materials the argument is no longer valid. Under
    these circumstances, the best choice is to dither. This is illustrated in Figure
    9.28.


    ![](img/32c07c3b65137f501f1232a822a70623_335_0.png)


    Figure 9.28: Choosing the Type of Color Distortion for Images with Smooth Color
    Variations


    Figure 9.28(a) shows a splash screen used with version 1.0.4 of the GIMP A dithered
    version of the splash screen, obtained using the Web-safe color palette, is shown
    in Figure 9.28(b). A color clipped version of the splash screen using the same
    palette is shown in 9.28(c). Due to the heavy banding seen in Figure 9.28(c),
    the color distortion due to dithering, seen in Figure 9.28(b), seems much more
    acceptable. This shows for images with smoothly varying color, the dithered clipping
    is better because clipping gives rise to a strenuously objectionable color distortion.


    If the image is not a photograph and does not have smoothly varying variations
    in color but rather large regions of constant color, the strategy is completely
    different. This is illustrated in Figure 9.29. Figure 9.29(a) shows a graphic
    design celebrating the 150th anniversary of the creation of the U.S. Department
    of the Interior. This design is constructed of four main colors: black, white,
    a blue consisting of 46¹11⁰²2⁰⁷¹, and a yellow consisting of 241¹214⁴⁷⁷. There
    are other colors in the image, but they are there for aliasing (see Section 3.1.2)
    and sharpness (see Section 6.4.1). From the previous discussion, you can see that
    the blue and the yellow are not'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'The Web-safe palette, which only take RGB components from the set of values
    [0, 51, 102, 153, 255]. This means that some color distortion will be introduced
    if the image is saved to Indexed format with the Web-safe palette. Indeed, Figure
    9.29(b) shows the result of applying Floyd-Steinberg dithering, and Figure 9.29(c)
    shows the result of color clipping.


    The dithering in Figure 9.29(b) produces a very undesirable effect. The blue and
    yellow regions both suffer from unsightly color speck. On the other hand, the
    color clipped version in Figure 9.29(c) produces a blue and a yellow that are
    slightly different than those of the original. Nevertheless, it is likely that
    this result is preferable because it preserves the homogeneity of the large, uniform
    regions.


    ![](img/32c07c3b65137f501f1232a822a70623_336_0.png)


    In conclusion, images that have a lot of detail and subtle color variations are
    better served by dithering than color clipping. Alternatively, images that have
    broad uniform color regions should avoid dithering and color clipping. For images
    that consist of a mix of the two conditions, some experimentation is necessary.
    Unfortunately there are sometimes no choices.


    > Figure 9.29: Choosing for Images with Large Uniform Color Regions


    # 9.6 SEMI-TRANSPARENCY AND INDEXED IMAGES


    Semi-transparency presents a particularly thorny problem when converting an image
    to Indexed format. This is a problem for indexed images because they'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'only support alpha values of 0 (fully transparent) and 255 (fully opaque).

    When converting to Indexed format, partially transparent pixels (that is, with
    alpha values in the range 1 to 254) have their alpha values forced to 0 or 255.

    This is a problem for antialiasing (see Section 3.1.2) and for the general use
    of transparency in indexed images.


    Fortunately, there is a solution. The Semi-Flatten plugin-in is a work-around
    for the problem of semi-transparency in indexed images. This filter, found in
    the Image:Filters/Colors menu, requires knowing the background color that will
    be used beneath the semi-transparent image. If you can''t determine the background
    color in advance, the Semi-Flatten filter cannot help you.


    To use the Semi-Flatten filter, you must determine the color that will be behind
    the semi-transparent image, and you must specify it in the Active Background Color
    patch in the Toolbox window. The Color Picker tool can be useful for determining
    colors, and although the Color Picker automatically sets the Active Foreground
    Color, you can easily toggle this to the background by clicking on the Switch
    Colors icon (the two-headed arrow above). The semi-flatten process combines the
    Active Background Color with the layers in proportion to the layer''s alpha values.


    As an example, 9.30 illustrates how a conversion to Indexed format runs the antialiasing
    of some text. 9.30(a) shows a transparent layer containing the K from the Cartoonish
    font at a size of 275 pixels. Antialiasing was turned on when the text was created;
    however, when this image is converted to indexed format the antialiasing is lost,
    as is more plainly seen when the letter is placed over a yellow background. This
    is shown in Figure 9.30(b). The jagged staircase effect is clearly visible at
    the edges of the letter. 9.30(c) shows the disposition of the two layers in the
    Layers dialog.


    9.31 shows how using Semi-Flatten resolves the antialiasing problem.\9.31(a) displays
    the Toolbox window, which shows that the Active Background Color patch has been
    set to the yellow color seen in Figure 9.30(b).

    9.31(b) shows a zoomed version of the result after applying Semi-Flatten to 9.30(a).
    The edges of the letter K now show that the semi-transparent pixels that were
    used for antialiasing have taken color values between the black of the letter
    and the yellow of the Active Background Color. Pixels that were fully transparent
    have remained so. The result of placing this layer over a yellow background layer
    is shown in Figure 9.31(c).

    You can see that the antialiasing effect has been conserved.


    226 Web-Centric GIMP'
  merge: -1
