  md: '# 5.6 THE BLENDING MODES


    Usually layers are opaque, which means upper layers cover and visually block lower
    ones. Blending modes change this behavior and allow some color features of a layer
    to be combined with the colors of layers below it. Blending modes can also be
    used to affect how color from a painting tool combines with the layer it is applied
    to.


    Figure 5.11(a) illustrates the blending mode for layers, which is found in the
    Layers dialog. Figure 5.11(b) shows the Blending Mode for painting tools, which
    is found in the Brush Selection dialog. The menu in the Brush Selection dialog
    applies the selected blending mode to all the paint tools: the Pencil,brush, Airbrush,
    Ink Pen, and Xinput Airbrush tools. In addition, this menu controls the way the
    Bucket Fill, Gradient, and Clone tools use


    ![](img/32c07c3b65137f501f1232a822a70623_172_0.png)


    The different blending modes are described in this section, and their practical
    uses and applications are described in the next. GIMP has 16 different blending
    modes. They are listed in the following five logical groups:


    +   ■ Normal, Dissolve, and Behind (available in paint mode only)

    ■ Difference, Addition, and Subract

    ■ Multiply (Burn), Divide (Dodge), Screen, and Overlay

    ■ Darken Only and Lighten Only

    ■ Hue, Saturation, Color, and Value


    > * Actually, the GIMP preferences can be set so that each painting tool has individual
    access to the Mode menu. This is set by toggling the Global Paint Options checkbox
    in the Tool Options branch of the Preferences dialog. Doing this makes the Mode
    menu available in the Tool Options dialog for each painting tool.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'In the following descriptions of the blending modes, the pixels of the upper
    layer (or of the applied paint) are referred to as the lower layer or layers as
    the background pixels. The notations F and B are used to represent their respective
    values. Blending the foreground value F with the background value B yields the
    resultant pixel R.


    # 5.6.1 THE NORMAL, DISSOLVE, AND BEHIND BLENDING MODES


    Normal, Dissolve, and behind are pseudo-blending modes because they do not really
    combine the foreground and background pixel values of the image.


    Normal mode is the default GIMP behavior where the foreground pixels are visible
    and the background pixels are not. Of course, this can be changed by adjusting
    the opacity slider in the Layers dialog (more on opacity and transparency is discussed
    in Section 5.7).


    Dissolve mode works by allowing a percentage of background pixels to be seen through
    the foreground. It does this by making some parts of the foreground partially
    transparent and the rest fully transparent. These two sets are intermingled in
    a random way. For the Dissolve mode to have an effect, the foreground layer must
    have an alpha channel with values less than 255. The alpha channel for a layer
    can be modified with a layer mask. The details of working with layer masks are
    discussed in Section 4.2.


    Figure 5.12 illustrates the use of Dissolve. Figure 5.12(a) shows the Layers dialog,
    which illustrates how this example is constructed. The image consists of two layers:
    a red background and a white foreground. The foreground has a uniform alpha channel
    set to a value of 191 (about 75% opacity). The Mode menu in Figure 5.12(a) shows
    that the Dissolve mode has been chosen for the foreground.


    Figure 5.12(b) shows the result of the Dissolve blending mode. Due to the value
    of the foreground''s alpha channel the result is that 75% of the white pixels
    are 75% opacity and 25% are fully opaque. The details of the effect can be more
    clearly seen in the small region framed by the black box in Figure 5.12(b).This
    region is zoomed 900% and replayed in Figure 5.12(c), which makes the relationship
    of the red and white pixels more apparent.


    Unlike the other blend modes in the GIMP, the behind mode only works with painting
    tools. It is not available as a blending mode for layers. To understand how it
    works, imagine a pane of glass that has something painted on the front surface
    but there are some parts of the pane that are bare, or have only a partially transparent
    paint on it. Painting on the back surface of the pane lets the color from this
    new paint show to the front where the front is not fully opaque. Figure 5.13 illustrates
    this effect.


    ![](img/32c07c3b65137f501f1232a822a70623_173_0.png)'
