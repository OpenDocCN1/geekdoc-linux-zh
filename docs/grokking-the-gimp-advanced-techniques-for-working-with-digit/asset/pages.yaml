  md: '# ABOUT THE AUTHOR


    Carey Bunks is a Senior Scientist at BBN Technologies in Cambridge, Massachusetts,
    where he currently works on a variety of research projects in underwater sonar,
    active noise and vibration control, and network security. He received a PhD in
    Electrical Engineering from the Massachusetts Institute of Technology in 1987,
    and has since specialized in the area of signal processing. Carey has worked on
    problems of seismic imaging, image artifact filtering, and motion estimation from
    image data. He has over twenty publications in scientific journals and holds several
    patents.


    Carey is also a member of the development group for Scilab, an open-source scientific
    and engineering computation package. He developed the Scilab signal processing
    toolbox and is co-author of the book Scientific and Engineering Computing with
    Scilab, published with Birkhäuser in 1999.


    In addition, Carey is a serious student of circus and vaudeville arts. He attended
    the Ringling Bros. & Barnum Bailey Clown College in Venice, Florida, graduating
    in 1977. An accomplished magician and jugler, he has entertained hundreds of groups
    in the U.S. and Europe with his street-theater style show. He is an authority
    on trick roping and is the author of the online book entitled The Lasso—A Rational
    Guide to Trick Roping.


    Carey and his wife, Homaira, live in Boston, Massachusetts. They enjoy sailing,
    skiing, and traveling in Europe.


    ![](img/32c07c3b65137f501f1232a822a70623_8_0.png)


    > Photo courtesy of Dan McCarthy.'
