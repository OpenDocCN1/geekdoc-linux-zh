    # 2.5.2 EXPLICIT CREATION OF FLOATS


    A selection can be explicitly made into a float without moving it. This is done
    by using the Float function found in the Image:Select menu or by simply typing
    C-s-1 in the image window. A good use for the explicit creation of a float is
    described in Section 2.6.2.


    # 2.5.3 ANCHORING FLOATS


    After a float has been created, normal operations cannot continue in the GIMP
    until the float is anchored. Anchoring is just the operation of depositing the
    float into a normal layer. Once this is done, other layers become available for
    GIMP operations again. A layer can be anchored either to a new layer or to the
    last active layer before the float was created. A float is anchored to a new layer
    by selecting New Layer from the Layers menu or by clicking on the New button in
    the Layers dialog. A float is anchored to the previously active layer by using
    the Anchor Layer function in the image window, or by clicking on the Anchor button
    in the Layers dialog.


    # 2.6 MANIPULATING LAYERS


    As already discussed, layers are the most important image components for image
    manipulation. They are the basic raw materials you need to work with and combine.
    In every GIMP project, layers need to be moved, resized, positioned, transformed,
    cut, pasted, and so on. These types of layer operations are discussed in this
    section.


