    This has the effect of increasing contrast in the midtones of the image. However,
    it simultaneously eliminates detail in the shadow and highlight ranges. This action
    is exactly what the Brightness-contrast tool does when the Contrast slider of
    the dialog is moved to the left. Moving the slider to the left corresponds to
    rotating the curve in a clockwise direction.


    The conclusion is that the Curves tool performs much better than the Brightness-contrast
    tool.'
