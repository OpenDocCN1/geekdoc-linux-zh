  md: '5. An appropriate brush type and size is selected. Here a small hard brush
    is chosen.


    6. Painting tools, such as the Paintbrush and the Airbrush, are used to reveal
    the tree from behind,the sea horse by painting away the appropriate parts of the
    layer mask.


    ![](img/32c07c3b65137f501f1232a822a70623_241_0.png)


    Figure 7.5: Using a Layer Mask to Create the Illusion of Depth


    If too much of the layer mask is removed while painting, you can recover it by
    changing the Active Foreground Color to white by typing x in the image window
    and by painting over the erroneously removed parts of the mask. Close to the edge
    of the tree, it is probably worthwhile to work with a smaller brush size in conjunction
    with the Airbrush tool, which is more effective at applying graded amounts of
    paint. See Section 4.5.1 for more details.


    The result of applying layer masks to both the Sea Horse and the Red Fish Layers
    are shown in Figure 7.6. The sea horse now seems to be well anchored, with its
    tail securely wrapped around the tree, against unforeseen, rapid air currents.
    The little red fish, surprisingly coy given its bright coloring, is peeking out
    from behind another.'
