- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_242_0.png)


    # 7.6: The Final Composition


    The effects obtained with layer masks could have also been accomplished with selections
    applied in the image window. However, this would have required permanently cutting
    away parts of the Sea Horse and Red Fish layers. Alternatively, the layer masks
    used in conjunction with the scaling and painting tools simplified the work and
    produced a more robust solution. Because of the layer masks, nothing has been
    irrevocably lost in either the Sea Horse or Red Fish layers. Thus, these layers
    can be repositioned if need be—only the layer masks need to be re-edited. This
    flexibility with positioning adjustments is not possible when using selections
    before the cut away components are gone.


    To summarize, the reviewed cutting, pasting, scaling, and the positioning of layers
    for compositing. In addition, a simple application of layer masks was used to
    give our composition some illusion of depth. The next compositing project is more
    complicated because it makes use of the blending modes and the curves tool.


    # 7.2 Project 2: Through the Looking Glass


    Blending modes, discussed in Chapter 5, are very useful tools for compositing.
    They can be used to give the illusion of one image element not just being delimited
    by another but of being fused right into it. This is a very powerful device because
    it allows the artist to convey a message about the relationship of the fused images,
    which simple juxtaposition does not. The objective of the project in this section
    is to illustrate this type of effect.'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'The images shown in Figures 7.7 and 7.8 are the raw materials for this project.
    They will be fused together to make the tin can seem to reflect the flower and
    insect. A summary of a procedure used to achieve the effect is as follows:


    +   1. Place the flower image into a new layer above the layer of the tin can
    image.

    2. Position, scale, and orient the flower layer to juxtapose it with the can in
    the desired manner.

    3. Mask the upper layer to the limits of the tin can''s borders.

    4. Apply an appropriate blending mode to the upper layer.

    5. Adjust the upper layer''s brightness using the Curves tool.


    ![](img/32c07c3b65137f501f1232a822a70623_243_0.png)


    Figure 7.7: A Tin Can Discarded as Trash


    Figure 7.9 illustrates the flower copied and pasted into a layer over the tin
    can image. As the Layers dialog in Figure 7.9(a) indicates, the flower layer is
    in a floating selection where it will stay until it is positioned, scaled, and
    oriented. The Opacity slider in the Layers dialog has been set to 60%, which allows
    the tin can to be seen through this floating selection.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '![](img/32c07c3b65137f501f1232a822a70623_244_0.png)


    Figure 7.8: A Flower and a Visiting Friend


    ![](img/32c07c3b65137f501f1232a822a70623_244_1.png)


    Figure 7.9: The Flower Layer Pasted and Oriented over the Tin Can Layer


    The Transform tool is used to rotate the flower layer. The flower image is aligned
    with the longitudinal axis of the tin can, which requires 59° of rotation. The
    partial transparency of the floating selection is invaluable, while using the
    Move tool, for correctly positioning the flower layer over the tin can. This is
