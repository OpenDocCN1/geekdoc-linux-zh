    # # 5.8 PRACTICAL USES OF BLENDING MODES


    Blending modes are fascinating toys that are lots of fun and can stimulate creative
    play with color. Results of experimenting with the blending modes often produce
    surprising and very aesthetic results.


    Blending modes, however, are a lot more than toys for playing with color; some
    useful operations would be impossible without them. Examples of practical uses
    for blending modes can be found in Sections 7.2, 7.3, and 7.4. This section describes
    two great applications of blending modes that do not appear elsewhere in this
    book.


    # # 5.8.1 COLORIZATION


    It is often desirable to completely change the color of a subject—the color of
    a car, a lip, eyes, a dress. The problem with changing the color of any real world
    image is that there are always lots of variations in the shading of a color. This
    is due to natural color gradients, lighting conditions, and textures. Figure 5.26(a)
    illustrates such an image. Notice the subtle variations in the kitten''s fur.
    The gray color of her coat has highlights and shadows as natural variations due
    to the texture of her fur. Changing the color of her coat requires choosing the
    new color and applying it in such a way that natural looking variations are preserved.'
