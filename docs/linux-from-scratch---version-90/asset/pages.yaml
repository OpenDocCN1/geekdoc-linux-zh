    # 2.3. Building LFS in Stages


    LFS is designed to be built in one session. That is, the instructions assume the
    system will not be shut down during the process. That does not mean that the system
    has to be done in one sitting. The issue is that procedures have to be re-assembled
    after a reboot if reusing LFS at different points.


    # 2.3.1. Chapters 1–4


    These chapters are accomplished on the host system. When restarting, be careful
    of the following:


    +   - Procedures as the root user after Section 2.4 need to have the LFS environment
    variable set FOR THE ROOT USER.


    # 2.3.2. Chapter 5


    +   - The /mnt/lfs partition must be mounted.

    - ALL instructions in Chapter 5 must be done by user lfs. A su - lfs needs to
    be done before any task in Chapter 5.

    - The procedures in Section 5.3, "General Compilation Instructions" are critical.
    If there is any doubt about installing a package, ensure any previously expanded
    tarballs are removed, re-extract the package files, and complete all instructions
    in that section.


    # 2.3.3. Chapters 6–8


    +   - The /mnt/lfs partition must be mounted.

    - When entering chroot, the LFS environment variable must be set for root. The
    LFS variable is not used otherwise.

    - The virtual file system must be mounted. This can be done before or after entering
    chroot by changing to a host virtual terminal, as running the commands in Section
    6.2.2, "Mounting and Populating /dev" and in Section 6.2.3, "Mounting Virtual
    File Systems".


    # 2.4. Creating a New Partition


    Like other operating systems, LFS is usually installed on a dedicated partition.
    The recommended approach to building an LFS system is to use an empty partition,
    or if you have enough unpartitioned space, to create one.


    A minimal size requires a partition of around 6 gigabytes (GB). This is enough
    to store all the source archives and compile the packages. However, if the LFS
    system intended to be the primary Linux system, additional software will probably
    be installed which will require additional space. A 20 GB partition is a reasonable
    size to provide for growth.


    14'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# LFS From Scratch - Version 9.0


    LFS system itself will not take up much room. A large portion of requirement is
    to provide sufficient free storage as well as for additional capabilities after
    LFS is complete. Additionally, compiling can require a lot of disk space which
    will be reclaimed after the package is installed.


    Because there is not enough Random Access Memory (RAM) available for compilation
    processes, it is a good idea to use a small disk partition as swap space. This
    is used by the kernel to store someunused-data and leave more memory available
    for active processes. The swap partition for an LFS system can be the same as
    the one used by the host system, in which it is not necessary to create another.


    Start a disk partitioning program as cfdisk or fdisk with a command line option
    naming the hard disk on which the new partition will be--example /dev/sda for
    the disk drive. Create a Linux partition and a swap partition, if needed. Please
    refer to cfdisk (8) or fdisk (8) if you do not know how to use the programs.


    > For experienced users, other partitioning schemes are possible. New LFS system
    can be on a software RAID array or LVM logical volume. However, some of these
    require an initramfs, which is an advanced topic. These partitioning methodologies
    are not recommended for first LFS users.


    Remember the designation of the new partition (e.g., sda5). This book will refer
    to the LFS partition. Also remember the designation of the swap partition. These
    names will be needed later for the /etc/fstab file.


    # 2.4.1. Other Partition Issues


    Requests for advice on swap partitioning are often posted on the LFS mailing lists.
    This is a highly subjective topic. The default for most distributions is to use
    the entire drive with the exception of one small swap partition. This is not optimal
    for LFS for several reasons. It reduces flexibility, sharing data across multiple
    distributions or LFS builds more difficult, making backups more time consuming,
    and can waste disk space through inefficient allocation of file system structures.


    # 2.4.1.1. The Root Partition


    A root partition (not to be confused with the /root directory) of ten gigabytes
    is a good compromise for most systems. It provides enough space to build LFS and
    most of BLFS, but is small enough that multiple partitions can be easily created
    for experimentation.


    # 2.4.1.2. The Swap Partition


    Most distributions automatically create a swap partition. Generally the recommended
    size of the swap partition is about twice the amount of physical RAM, however
    this is rarely needed. If disk space is limited, hold the swap partition to two
    gigabytes and monitor the amount of swapping.


    Swapping is never good. You generally tell if a system is swapping by listening
    to disk activity and observing how the system reacts to. The first reaction to
    swapping should be check for an unreasonable command such as trying to edit a
    five gigabyte file. If swapping becomes a normal occurrence, the best solution
    is to purchase more RAM for your system.


    # 2.4.1.3. The Grub Bios Partition


    If the boot has been partitioned with a GUID Partition Table (GPT), then a small,
    typically 1 MB, partition must be created if it does not already exist. This partition
    is not formatted, but will be available for GRUB using during installation of
    the boot loader. This partition will be labeled ''BIOS Boot'' if using fdisk or
    have a code of EF02 if using gdisk.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Note


    The Grub Bios partition must be on the drive that the BIOS uses to boot the system.
    This is not necessarily the same drive where the LFS root partition is located.
    Disks on a system may use different partition table types. The requirement for
    this partition depends only on the partition type of the boot disk.


    # 2.4.1.4. Convenience Partitions


    There are other partitions that are not required, but should be considered when
    designing a disk layout. The following list is not comprehensive, but is meant
    as a guide.


    +   * /boot – Highly recommended. Use this partition to store kernels and other
    booting information. To minimize potential boot problems with larger disks, make
    this the first partition on your first disk drive. A partition size of 100 megabytes
    is quite adequate.

    * /home – Highly recommended. Share your home directory and user customization
    across multiple distributions or builds. The size is generally large and depends
    on available disk space.

    * /usr – A separate /usr partition is generally used if providing a server for
    a client or diskless workstation. It is not normally needed for LFS. A size of
    five gigabytes will handle most installations.

    * /opt – This directory is most useful for BLFS where multiple installations of
    packages like Gnome or KDE can be installed without embedding the files in the
    /usr hierarchy. If, 5 to 10 gigabytes is generally adequate.

    * /tmp – A separate /tmp directory is rare, but useful if configuring a client
    dns. This partition, will usually not need to exceed a couple of gigabytes.

    * /usr/src – This partition is very useful for providing a location to store BLFS
    sources and share them across LFS builds. It can also be used as a location for
    building BLFS packages. A reasonably large partition of 30-50 gigabytes allows
    plenty of room.


    Any partition that you use automatically mounted upon boot needs to be specified
    in the /etc/fstab. Details about how to specify partitions will be discussed in
    Section 8.2, "Creating the /etc/fstab".


    # 2.5. Creating a File System on the Partition


    Now that a blank partition has set up, the file system can be created. LFS can
    use any file system recognized by the Linux kernel, but the most common types
    are ext3 and ext4. The choice of file systems can be complex and depends on the
    characteristics of the file systems and size of the partition. For example:


    ext2

    is suitable for small partitions that are updated infrequently such as /boot.


    ext3

    is an upgrade to ext2 that includes a journal to help recover the partition''s
    status in the case of an unclean shutdown. It is commonly used as a general purpose
    file system.


    ext4

    is the latest version of the ext file system of partition types. It provides several
    new capabilities including nano-second timestamps, creation and use of very large
    files (16 TB), and speed improvements.


    Other file systems, including FAT32, NTFS, ReiserFS, JFS, and XFS are useful for
    specialized purposes. More information about these file systems can be found at
    http://en.wikipedia.org/wiki/Comparison_of_file_systems.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# LFS From Scratch - Version 9.0


    LFS assumes that the root file system (/) is type ext4. To create an ext4 file
    system on the LFS partition, run the


    ```

    mkfs -v -t ext4 /dev/<xxx>

    ```


    If you are using an extra swap partition, there is no need to format it. If a
    new swap partition was created, it will need to be initialized with this command:


    ```

    mkswap /dev/<yyy>

    ```


    Replace <yyy> with the name of the swap partition.


    # 2.6. Setting The $LFS Variable


    Throughout this book, the environment variable LFS will be used several times.
    You should ensure that this variable is always defined throughout the LFS build
    process. It should be set to the name of the directory where you will be building
    your LFS system - we will use /mnt/lfs as an example, the directory choice is
    up to you. If you are building LFS on a separate partition, this directory will
    be the mount point for the partition. Choose a directory location and set the
    variable with the following command:


    ```

    export LFS=/mnt/lfs

    ```


    Having this set is beneficial in commands such as mkdir -v $LFS/tools can be typed
    literally. The shell will automatically replace "$LFS" with "mnt/lfs" (or whatever
    the variable was set to) when it processes the command line.


    > Caution

    Do not forget to check that $LFS is set whenever you leave and reenter the current
    working environment (such as doing a su to root or another user). Check that the
    LFS variable is set properly with:


    echo $LFS

    Make sure the output shows the path to your LFS system''s build location, which
    is /mnt/lfs if the provided example was followed. If the output is incorrect,
    use the command earlier on this page to set $LFS to the correct directory.


    One way to ensure that the $LFS variable is always set is to edit the .bash_profile
    in both your personal home directory and in /root/.bash_profile and ensure the
    export command above. In addition, the shell in /etc/passwd file for all users
    who need the LFS variable needs to be bash to ensure that the /root/.bash_profile
    is incorporated as part of the login process.


    Another consideration is the method used to log into the host system. If logging
    in a graphical display manager, the user''s .bash_profile is not normally used
    when a virtual terminal is started. In this case, add the export command to .bashrc
    for the root. In addition, some distributions have instructions to run the .bashrc
    instructions in a non-interactive bash invocation. Be sure to add the export command
    before the test for non-interactive use.


    17'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 2.7. Mounting the New Partition


    Now that a file system has been created, the partition needs to be made accessible.
    In order to do this, the partition needs to be mounted at a chosen mount point.
    For the purposes of this book, it is assumed that the file system is mounted under
    the directory specified by LFS environment variable as described in the previous
    section.


    Create the mount point and mount the LFS file system by running:


    ```

    mkdir -pv $LFS

    mount -t ext4 /dev/<xxx> $LFS

    ```


    Replace <xxx> with the designation of the LFS partition.

    If using multiple partitions for LFS (e.g., one for / and another for /usr), mount
    them using:


    ```

    mkdir -pv $LFS

    mount -t ext4 /dev/<xxx> $LFS

    mdir -v $LFS/usr

    mount -v ext4 /dev/<ggg> $LFS/usr

    ```


    Replace <xxx> with the appropriate partition names.

    Ensure that this partition is not mounted with permissions that are too restrictive
    (such as the nosuid or nodev options). Run the mount command without any parameters
    to see what options are set for the LFS partition. If nosuid and/or nodev are
    set, the partition will need to be remounted.


    > > Warning

    The above instructions assume that you will not be restarting your computer throughout
    the LFS process. If you shut down your system, you will either need to remount
    the LFS partition each time you restart the build process or modify your host''s
    /etc/fstab file to automatically remount it upon boot. For example:


    /dev/<xxx> /mnt/lfs ext4 defaults 1 1

    If you use additional optional partitions, be sure to add them also.


    If you are using a swap partition, ensure that it is enabled using the swapon
    command:


    ```

    /sbin/swapon -v /dev/<zzz>

    ```


    Replace <zzz> with the name of the swap partition.

    Now that there is an established place to work, it is time to download the packages.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# # Chapter 3. Packages and Patches


    # ## 3.1. Introduction


    This chapter includes a list of packages that need to be downloaded in order to
    build a basic Linux system. The listed version numbers correspond to versions
    of the software that are known to work, and this book is based on them. We highly
    recommend against using newer versions because the build commands for one version
    may not work with a newer version. The newest package versions may also have problems
    that require work-arounds. These work-arounds will be developed and stabilized
    in the development version of the book.


    Download locations may not always be accessible. If a download location has changed
    since this book was published, Google (http://www.google.com/) provides a search
    engine for most packages. If this is unsuccessful, try one of the alternative
    means discussed at http://www.linuxfromscratch.org/lfs/packages.html#packages.


    Downloaded packages and patches will need to be stored somewhere that is conveniently
    available throughout the entire. A working directory is also required to unpack
    the sources and build them. $LFS/sources can be used both as a place to store
    the sources and patches as a working directory. By using this directory, the required
    elements will be located on the LFS partition and will be available during all
    stages of the building process.


    To create this directory, execute the following command, as user root, before
    starting the download session:


    ```

    mkdir $LFS/sources

    ```


    Make this directory writable and sticky. "Sticky" means that even if multiple
    users have write permission on a directory, only the owner of a file can delete
    the file within a sticky directory. The following command will enable the write
    and sticky modes:


    ```

    chmod -v awt $LFS/sources

    ```


    Easy way to download all of the packages and patches is by using wget-list as
    an input to wget. For example:


    ```

    wget --input-file=wget-list --continue --directory-prefix=$LFS/sources

    ```


    Additionally, starting with LFS-7.0, there is a separate file, md5sums, which
    can be used to verify that all the correct packages are available before proceeding.
    Place that file in $LFS/sources and run:


    ```

    pushd $LFS/sources\md5sum -c md5sums

    pop

    ```


    # ## 2.2. All Packages


    Download or otherwise obtain the following packages:


    +   * ACL (2.2.53) - 513 KB:

