    **Installed programs:** bootlogd, fstab-decode, halt, init, killall5, poweroff
    (link to halt), reboot (link to halt), runlevel, shutdown, and telinit (link to
    init)


    # ## Short Descriptions


    +   **bootlogd** Logs boot messages to a log file


    +   **fstab-decode** Run a command with fstab-encoded algorithms


    +   **halt** Normally invokes **shutdown** with the -h option, except when in
    run-level 0, then it tells the kernel to halt the system; it notes in the file
    /var/log/wt.tmp that the system is brought down


    +   **init** The first process to be started when the kernel takes over the boot
    process and starts all the processes specified in its configuration file


    +   **killall5** Sends a signal to all processes, except the processes in run
    session so it will not kill its parent shell


    +   **poweroff** Tells the kernel to halt the system and switch off the computer
    (**halt**)


    +   **reboot** Tells the kernel to restart the system (**halt**)


    +   **runlevel** Reports the previous and the current run-level, as noted in the
    last run-level record in /var/run/ut.mp


    +   **shutdown** Brings the system down in a secure way, signaling all processes
    and notifying all logged-in users


    +   **telinit** Tells **init** which run-level to change to'
