  md: "# Linux From Scratch - Version 9.0\n\nCreate a separate build directory:\n\n\
    ```\nmkdir -v build\ncd build\n```\n\nBefore starting to build GCC, remember to\
    \ unset any environment variables that override the default optimization flags.\n\
    Now prepare GCC for compilation:\n\n```\nCC=$LFS_TGT-gcc\nCXX=$LFS_TGT-g++\nAR=$LFS_TGT-ar\n\
    RANBL=$LFS_TGT-ranlib\n../configure\n  --prefix=/tools\n  --with-local-prefix=/tools\n\
    \  --with-native-system-header-dir=/tools/include\n  --enable-languages=c,c++\n\
    \  --disable-liststdcxx-pch\n  --disable-multilib\n  --disable-bootstrap\n  --disable-libgomp\n\
    ```\n\nThe meaning of the new configure options:\n\n--enable-languages=c,c++\n\
    This option ensures that both the C and C++ compilers are built.\n\n--disable-liststdcxx-pch\n\
    Do not build the pre-compiled header for liststdc++. It takes up lot of space,\
    \ and we have no use for it.\n\n--disable-bootstrap\nFor native builds of GCC,\
    \ the default is to do a \"bootstrap\" build. This not compile GCC, but compiles\
    \ it several times. It uses the programs in a first round to compile itself a\
    \ second time, and then again a third time. The second and third iterations are\
    \ compared to make sure it can reproduce itself flawlessly. This also implies\
    \ that it was compiled correctly. However, the LFS build method should provide\
    \ a solid compiler without the need to bootstrap each time.\n\nCompile the package:\n\
    \n```\nmake\n```\n\nInstall the package:\n\n```\nmake install\n```\n\nAs a finishing\
    \ touch, create a symlink. Many programs and scripts run cc instead of gcc, which\
    \ is used to keep programs generic and usable on all kinds of UNIX systems where\
    \ the GNU C compiler is not always installed. Running cc leaves the system administrator\
    \ to decide which C compiler to install:\n\n```\nln -sv gcc /tools/bin/cc\n```"
