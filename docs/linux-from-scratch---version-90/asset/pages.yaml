  md: "# 6.54. Coreutils-8.31\n\nThe Coreutils package contains utilities for showing\
    \ and setting the basic system characteristics.\nApproximate build time: 2.5 SBU\n\
    Required disk space: 202 MB\n\n# 6.54.1. Installation of Coreutils\n\nPOSIX requires\
    \ that programs from Coreutils recognize character boundaries correctly even in\
    \ multibite locales. The following patch fixes this non-compliance and other internationalization-related\
    \ bugs.\n\n```\npatch -Np1 -i ../coreutils-8.31-i18n-1.patch\n```\n\n> Note\n\
    In the past, many bugs were found in this patch. When reporting new bugs to Coreutils\
    \ maintainers, check first if they are reproducible without this patch.\n\nSupress\
    \ a test on which machines can loop forever:\n\n```\nsed -i '/test.lock/s/^*/#'\
    \ gnulib-tests/gnulib.mk\n```\n\nNow prepare Coreutils for compilation:\n\n```\n\
    autoreconf -fiv\nFORCE_UNSAFE_CONFIGURE=1 .configure \\ \\\n    --prefix=/usr\
    \ \\\n    --enable-no-install-program=kill,uptime\n```\n\nThe meaning of the configure\
    \ options:\n\n+   autoreconf\nThis command updates generated configuration files\
    \ with the latest version of automake.\nFORCE_UNSAFE_CONFIGURE=1\nThis environment\
    \ variable allows the package to be built as the root user.\n--enable-no-install-program=kill,uptime\n\
    The purpose of this switch is to prevent Coreutils from installing binaries that\
    \ will be installed by other packages later.\n\nCompile the package:\n\n```\n\
    make\n```\n\nSkip down to \"Install the package\" if not running the test suite.\n\
    Now the test suite is ready to be. First, run the tests that are meant to be run\
    \ as user root:\n\n```\nmake NON_ROOT_USERNAME=nobody check-root\n```\n\nWe're\
    \ going to run the remainder of the tests as the nobody user. Certain tests, however,\
    \ require the user to be member of more than one group. So that tests are not\
    \ skipped we'll add a temporary group and make the user nobody part of it:\n\n\
    ```\necho \"dummy:x:1000:nobody\" >> /etc/group\n```"
  merge: -1
  img_proc: true
