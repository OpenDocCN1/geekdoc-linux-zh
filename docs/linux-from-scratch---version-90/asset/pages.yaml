- pgno: 13
  md: '+   - Kmod


    This package contains programs needed to administer Linux kernel modules.


    +   - Less


    This package contains a very nice text file viewer that allows scrolling up or
    down when viewing a file. It is also used by Man-DB for viewing manpages.


    +   - Libcap


    This package implements the user-space interfaces to the POSIX 1003.1 capabilities
    available in Linux kernels.


    +   - Libelf


    The elftools provides libraries and tools for ELF files and DWARF data. Most utilities
    in this package are available in other packages, but the library is needed to
    build the Linux kernel using the default (most efficient) configuration.


    +   - Libffi


    This package implements a portable, high level programming interface to various
    calling conventions. Some programs may not know at the time of compilation what
    arguments are to be passed to a function. For instance, an interpreter may be
    told at run-time the number and types of arguments used to call a given function.
    Libffi can be used in such programs to provide a bridge from the interpreter program
    to compiled code.


    +   - Libpipeline


    The Libpipeline contains a library for manipulating pipelines of subprocesses
    in a flexible and convenient way. It is required by the Man-DB package.


    +   - Libtool


    This package contains the GNU generic library support. It wraps the complexity
    of using shared libraries in a consistent, portable interface. It is needed by
    the test suites in other LFS packages.


    +   - Linux Kernel


    This package is the Operating System. It is the Linux in the GNU/Linux environment.


    +   - M4


    This package contains a general text macro processor useful as a build tool for
    other programs.


    +   - Make


    This package contains a program for directing the building of packages. It is
    required by almost every package in LFS.


    +   - Man-DB


    This package contains programs for finding and viewing man pages. It was chosen
    instead of the man package due to superior internationalization capabilities.
    It supplies the man program.


    +   - Man-pages


    This package contains the actual contents of the basic Linux pages.


    +   - Meson


    This package provides a software tool for automating the building of software.
    The main goal for Meson is to minimize the amount of time that software developers
    need to spend configuring their build system.'
