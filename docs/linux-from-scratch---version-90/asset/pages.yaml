    \ handling of character screens.\n\nApproximate build time: 0.4 SBU\nRequired\
    \ disk space: 42 MB\n\n# ### 6.24.1. Installation of Nurses\n\nDon't install a\
    \ static library that is not handled by configure:\n\n```\nsed -i '/LIBTOOL_INSTALL/d'\
    \ c++/Makefile.in\n```\n\nPrepare Nurses for compilation:\n\n```\n./configure\
    \ --prefix=/usr \\\n    --mandir=/usr/share/man \\\n    --with-shared \\\n   \
    \ --without-debug \\\n    --without-normal \\\n    --enable-pc-files \\\n    --enable-wide\n\
    ```\n\nThe meaning of the new configure options:\n\n+   --enable-wide\nThis switches\
    \ wide-character libraries (e.g., libncursesw.so.6.1) to be built instead of normal\
    \ ones (e.g., libncurses.so.6.1). These wide-character libraries are usable in\
    \ multibyte and traditional 8-bit locales, while normal libraries work properly\
    \ in 8-bit locales. Wide-character and normal libraries are source-compatible,\
    \ but not binary-compatible.\n\n+   --enable-pc-files\nThis switch generates and\
    \ installs .pc files for pkg-config.\n\n+   --without-normal\nThis switch disables\
    \ building and installing most static libraries.\n\nCompile the package:\n\n```\n\
    make\n```\n\nThis package has a test suite, but it can only be run after the package\
    \ has been installed. The tests reside in the test/ directory. See the README\
    \ file in that directory for further details.\n\nInstall the package:\n\n```\n\
    make install\n```\n\nMove the shared libraries to the /lib directory, where they\
    \ are expected to reside:\n\n```\nmv -v /usr/lib/libncursesw.so.* /lib\n```\n\n\
    Because the libraries have been moved, one symlink points to a non-existent file.\
    \ Recreate it:\n\n```\nln -sfv ../../lib/$(readlink /usr/lib/libncursesw.so) /usr/lib/libncurses.so\n\
    ```"
