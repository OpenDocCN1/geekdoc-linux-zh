    \ complain that this is an unrecognized option, the configure script for XSPParagraph\
    \ recognizes it and uses it to disable installing a static XSPParagraph.a to /usr/lib/texinfo.\n\
    \nCompile the package:\n\nmake\n\nTo test the results, issue:\n\nmake check\n\n\
    Install the package:\n\nmake install\n\nOptionally, install the components belonging\
    \ in a Tex installation:\n\nmake TEXMF=/usr/share/texmf install-tex\n\nThe meaning\
    \ of the make parameter:\n\nTEXMF=/usr/share/texmf\nThe TEXMF variable holds the\
    \ location of the root of the TeX tree, for example, a TeX package will be installed\
    \ later.\n\nThe documentation system uses a plain text file to hold its list of\
    \ menu entries. The file is located at /usr/share/info/dir. Unfortunately, due\
    \ to occasional problems in the Makefiles of various packages, it can get out\
    \ of sync with the info pages installed on the system. If the /usr/share/info/dir\
    \ ever needs to be recreated, the following optional commands will accomplish\
    \ the task:\n\n```\npushd /usr/share/info\nrm -v dir\nfor f in *\n  do install-info\
