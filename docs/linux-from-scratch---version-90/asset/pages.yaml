- pgno: 7
  md: '# Preface


    # Foreword


    My journey to learn and better understand Linux began back in 1998. I had just
    installed my first Linux distribution and had quickly become intrigued with the
    whole concept and philosophy behind Linux.


    There are always many ways to accomplish a single task. The same can be said about
    Linux distributions. A great many have existed over the years. Some still, have
    morphed into something else, yet others have been relegated to our memories. They
    do all differently to suit the needs of their target audience. Because so many
    different ways to accomplish the same end goal, I realize no longer had to be
    limited by any one implementation. Prior to discovering Linux, we simply put up
    with other Operating Systems as we had no choice. It was what it was, whether
    you liked it or not. With Linux, the concept of change emerge. If you were free,
    encouraged to change.


    I tried a number of distributions and could not decide on any one. They were great
    systems in their own right. It wasn''t a matter of right and wrong anymore. It
    became a matter of personal taste. With all that choice, it became apparent that
    there not be a single system that would be perfect for me. So I set out to create
    my own Linux system that would fully conform to my personal preferences.


    To truly make it ours, I resolved to compile everything from source code instead
    of using pre-compiled binary packages. This "perfect" Linux system would have
    the strengths of various systems without their perceived weaknesses. At first
    the idea was rather daunting. I remained committed to the idea that such a system
    could be built.


    After sorting through such issues as dependencies and compile-time errors, I finally
    built a custom-built Linux system. It was fully operational and perfectly usable
    like any of the other Linux out out the time. But it was my own creation. It was
    very satisfying to have put together such a system myself. The only thing better
    would have been to create each piece of software myself. This was the next best
    thing.


    As I shared my goals and experiences with other members of the Linux community,
    it became apparent that there was a sustained interest in these ideas. It quickly
    became plain that such custom-built Linux systems serve not only to meet specific
    requirements, but also as an ideal learning opportunity for programmers and system
    administrators to enhance their (existing) Linux skills. Of that broadened interest,
    the Linux From Scratch Project was born.


    This Linux From Scratch book is the core around project. It provides the groundwork
    and instructions necessary for you to build your own system. This book provides
    a template that will be in correctly working system, you are free to alter the
    instructions to yourself, which is, in, an important part of this project. You
    remain in control; we just lend a hand to get started on your journey.


    I sincerely hope you will have a great time working on your own Linux From Scratch
    system and enjoy the numerous benefits of having a system that is truly yours
    own.


    -- Gerard Beekemans

    gerard@linuxfromscratch.org


    # Audience


    There are many reasons why you would want to read this book. One of the questions
    many people rise is, "why go through all the hassle manually building a Linux
    system from scratch when you can just download and install an existing one?"'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Linux From Scratch - Version 9.0


    One important reason for this project''s existence is to help you learn how Linux
    system works from the inside out. Building an LFS system helps demonstrate what
    makes Linux experience, and how things work together and depend on each other.
    One of the best things that this learning experience can provide is the ability
    to customize a Linux system to fit your unique needs.


    Another key benefit of LFS is that it allows you to have more control over the
    system without relying on anyone else''s Linux implementation. With LFS, you are
    in the driver''s seat and dictate every part of the system.


    LFS allows you to create custom Linux systems. When installing regular distributions,
    you are often forced to install many programs which are probably never used or
    understood. These programs waste resources. You may argue that today''s hard drive
    and CPUs, such resources are no longer a consideration. Sometimes, you are still
    constrained by size considerations when thinking nothing. About bootable CDs,
    USB sticks, and embedded systems. Those are areas where LFS can be beneficial.


    Another advantage of a custom built Linux system is security. By compiling the
    entire system from source code, you are empowered to audit everything and apply
    all security patches desired. It is no longer necessary to wait for somebody to
    compile binary packages that fix a security hole. Unless you examine the patch
    and implement yourself, you have no guarantee that the new binary package was
    built correctly and adequately fixes the problems.


    The goal of Linux From Scratch is to build a complete and usable foundation-level
    system. If you do not wish to build your own Linux system from scratch, you may
    nevertheless benefit from the information in this book.


    There are too many good reasons to build your own LFS system to list them all.
    In the end, it is by far the most powerful of reasons. As you continue in your
    LFS experience, you will discover the power that information and knowledge truly
    bring.


    # LFS Target Architectures


    The target architectures of LFS are the AMD/Intel x86 (32-bit) and x86_64 (64-bit)
    CPUs. On the other hand, the instructions in this book are also known to work,
    with some modifications, with the Power PC and ARM CPUs. To build a system that
    utilizes one of these CPUs, the main prerequisite, in addition to those on the
    next pages, is an existing Linux system such as an earlier LFS installation, Ubuntu,
    Red Hat/Fedora, SuSE, or other distribution that targets the architecture you
    have. Also note that a 32-bit distribution can be installed and used as a host
    system on a 64-bit AMD/Intel computer.


    Some other facts about 64-bit systems need to be added here. When compared to
    a 32-bit system, the size of executable programs are significantly larger and
    the execution speed of arbitrary programs are arguably slower. For example, in
    a test of LFS-6.5 on a CoreDual CPU based system, the following statistics were
    measured:


    | Architecture | Build Time | Build Size |

    |---|---|-|

    | 32-bit | 198.5 minutes | 648 MB |

    | 64-bit | 190.6 minutes | 709 MB |


    As you can see, the 64-bit build is only 4% faster and 9% larger than the 32-bit
    build. The difference is relatively minimal. Of course, if you have more than
    4GB of RAM or want to manipulate data that exceeds 4GB, the advantages of a 64-bit
    system are substantial.


    > The above discussion is only appropriate when comparing builds on the same hardware.
    Modern 64-bit systems are considerably faster than older 64-bit systems and the
    LFS authors recommend building on a 64-bit system when given a choice.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Linux From Scratch - Version 9.0


    The default 64-bit build that results from LFS is considered a "pure" 64-bit system.
    That is, it supports 64-bit executables only. Building a "multi-lib" system requires
    compiling applications twice, once for a 32-bit system and for a 64-bit system.
    This is not directly supported in LFS because it would interfere with the educational
    objective of providing the instructions needed for a straightforward base Linux
    system. You can refer to the Cross Linux project for this advanced topic.


    # LFS and Standards


    The structure of LFS follows Linux standards as closely as possible. The primary
    standards are:


    +   - POSIX.1-2008.

    - Filesystem Hierarchy Standard (FHS) Version 3.0

    - Linux Standard Base (LSB) Version 5.0 (2015)


    The LSB has four separate standards: Core, Desktop, Runtime Languages, and Imaging.
    In addition to generic requirements there are also architecture specific requirements.
    There are also areas for trial: Gtk3 and Graphics. LFS attempts to conform to
    the architectures discussed in the previous section.


    > Many do not agree with the requirements of the LSB. The main purpose of defining
    it is to ensure that proprietary software will be able to be installed and run
    properly on a compliant system. Since LFS is source based, the user has control
    over what packages are desired and many choose not to install packages that are
    specified by the LSB.


    Creating a complete LFS system capable of passing the LSB certifications tests
    is possible, but not without many additional packages that are beyond the scope
    of LFS. These additional packages have installation instructions in BLFS.


    # Packages supplied by LFS needed to satisfy the LSB Requirements


    | LSB Core | LSB Desktop | LSB Runtime Languages | LSB Imaging | LSB Gtk3 and
    LSB Graphics (Trial Use) |

    || Bash, Bc, Binutils, Coreutils, Diffutils, File, Findutils, G, Gep, Gzip, M4,
    Man-DB, Ncurses, Procps, Psmisc, Sed, Shadow, Tar, Util-linux, Zlib |

    | LSB Desktop: None |

    | LSB Runtime Languages: Perl |

    | LSB Imaging: None |

    | LSB Gtk3 and LSB Graphics (Trial Use): None |


    # Packages supplied by BLFS needed to satisfy the LSB Requirements


    | LSB Core: | LSB Desktop: | LSB Runtime Languages: |

    |||||

    | LSB Core: | At, Bash (a part of At), Cpio, De, Frontab, Initd-tools, lsb_release,
    NSPR, NSS, PAM, Sendmail (or Postfix or Exim), time |

    | LSB Desktop: | Alsa, ATK, Cairo, Desktop-file-utils, Freetype, Configfont, Gdk-pixbuf,
    Glib, GTK+2, Icon-naming, Libpeg-turbo, Libpng, Libtuff, Libxml2, MesaLib, Pango,
    Xdg-utils, Xorg |

    | LSB Runtime Languages: | Python, Libxml2, Libxslt |'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Linux From Scratch - Version 9.0


    LSB Imaging: CUPS, Cups-filters, Ghostscript, SANE


    LSB Gtk3 and LSB Graphics (Trial Use): GTK+3


    # Packages not supplied by LFS or BLFS needed to satisfy the LSB Requirements


    LSB Core: None


    LSB Desktop: Qt4 (but Qt5 is provided)


    LSB Runtime Languages: None


    LSB Imaging: None


    LSB Gtk3 and LSB Graphics (Trial Use): None


    # Rationale for Packages in the Book


    As stated earlier, the goal of LFS is to build a complete and usable foundation-level
    system. This includes all packages needed to replicate itself while providing
    a relatively minimal base from which to customize a more complete system based
    on the choices of the user. This does not mean LFS is the smallest system possible.
    Several important packages are included that are not strictly required. The lists
    below describe the rationale for each package in the book.


    +   - Acl

    This package contains utilities to administer Access Control Lists, which are
    used to define more fine-grained discretionary access rights for files and directories.

    - Attr

    This package contains programs for administering extended attributes on filesystem
    objects.

    - Autoconf

    This package contains programs for producing shell scripts that can automatically
    configure source code from a developer''s template. It is often needed to rebuild
    a package after updates to the build procedures.

    - Automake

    This package contains programs for generating Make files from a template. It is
    often needed to rebuild a package after updates to the build procedures.

    - Bash

    This package satisfies an LSB core requirement to provide a Bourne Shell interface
    to the system. It was chosen over other packages because of its common usage and
    extensive capabilities beyond basic shell functions.

    - Bc

    This package provides an arbitrary precision numeric processing language. It satisfies
    a requirement needed when building the Linux kernel.

    - Binutils

    This package contains a linker, an assembler, and other tools for handling object
    files. The programs in this package are needed to compile most of the packages
    in an LFS system and beyond.

    - Bison

    This package contains the GNU version of yacc (Yet Another Compiler Compiler)
    needed to build several other LFS programs.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Linux From Scratch - Version 9.0


    +   - Bzip2

    This package contains programs for compressing and decompressing files. It is
    required to decompress many TFS packages.

    - Check

    This package contains a test harness for other programs. It is only installed
    in the temporary toolchain.

    - Coreutils

    This package contains a number of essential programs for viewing and manipulating
    files and directories. These programs are needed for command line file management,
    and are necessary for the installation procedures of every package in L.

    - DejaGNU

    This package contains a framework for testing other programs. It is only installed
    in the temporary toolchain.

    - Diffutils

    This package contains programs that show the differences between files or directories.
    These programs can be used to create patches, and are also used in many packages''
    build procedures.

    - E2fsprogs

    This package contains the utilities for handling the ext2, ext3 and ext4 file
    systems. These are the most common and thoroughly tested file systems that Linux
    supports.

    - Eudev

    This package is a device manager. It dynamically controls the entries in the /dev
    directory as devices are added or removed from the system.

