  md: "# 6.9. Glibc-2.30\n\nThe Glibc package contains the C library. This library\
    \ provides the basic routines for allocating memory, searching directories, opening\
    \ and closing files, and writing files, string handling, pattern matching, arithmetic,\
    \ and so on.\n\n**Approximate build time:** 21 SBU\n**Required disk space:** 3.3\
    \ GB\n\n# 6.9.1. Installation of Glibc\n\n> Note\nThe Glibc build system is self-contained\
    \ and will install perfectly, even though the compiler specs file and linker are\
    \ still pointing to /tools/. The specs and linker cannot be adjusted before the\
    \ Glibc install because the Glibc autoconf tests would give false results and\
    \ defeat the goal of achieving a clean build.\n\nSome of the Glibc programs use\
    \ the non-FHS compliant /var/db directory to store their runtime data. Apply the\
    \ following patch to make programs store their runtime data in the FHS-compliant\
    \ locations:\n\n```\npatch -Np1 -i ../glibc-2.30-fhs-1.patch\n```\n\nFix a problem\
    \ introduced with the linux-5.2 kernel:\n\n```\nsed -i '/asm.socket.h#/a include\
    \ <sockios.h>' \\\nsysdeps/unix/sysv/linux/bits/socket.h\n```\n\nCreate a symlink\
    \ for LSB compliance. Additionally, for x86_64, create a compatibility symlink\
    \ required for the dynamic loader to function:\n\n```\ncase $(uname) -m in\ni86)\
    \ ln -sfv ld-linux.so.2 /lib/ld-lsb.so.3\n  ;;\nx86_64) ln -sfv ../lib/ld-linux-x86-64.so.2\
    \ /lib64\n  ln -sfv ../lib/ld-linux-x86-64.so.2 /lib64/ld-lsb-x86-64.so.3\nesac\n\
    ```\n\nThe Glibc document recommends building Glibc in a dedicated build directory:\n\
    \n```\nmkdir -v build\ncd build\n```\n\nPrepare Glibc for compilation:\n\n```\n\
    CC=\"gcc -ffile-prefix-map=tools/usr\" \\\n  ../configure --prefix=/usr \\\n\\\
    \  --disable-error \\\n\\  --enable-kernel=3.2 \\\n\\  --enable-stack-protector=strong\
    \ \\\n\\  --with-headers=/usr/include \\\n\\  libc_cv_slibdirir=/lib\n```"
