  md: "# Linux From Scratch - Version 9.0\n\nMany applications will expect the linker\
    \ to be able to find non-wide-character Ncurses libraries. Trick such applications\
    \ into linking with wide-character libraries by means of symlinks and linker scripts:\n\
    \n```\nfor lib in ncurses menu ; do\n  rm -vf /usr/lib/lib${lib}.so\n  echo \"\
    INPUT-${lib}w\" > /usr/lib/lib${lib}.so\n  ln -sfn ${lib}w.pc /usr/lib/pkgconfig/${lib}.pc\n\
    done\n```\n\nFinally, make sure old applications that use -lcurses at build time\
    \ are buildable:\n\n```\nrm -vf /usr/lib/libcurses.sw\necho \"INPUT-(ncursesw)\"\
    \ > /usr/lib/libcurses.so\nln -sfn libncurses.so\n```\n\nIf desired, install the\
    \ Ncurses documentation:\n\n```\nmkdir -v /usr/share/doc/ncurses-6.1\ncp -v -R\
    \ doc/* /usr/share/doc/ncurses-6.1\n```\n\n![](img/78f4ce02ad2a3526b7a07a130d5ef5bd_144_0.png)\n\
    \n> Note\nThe instructions above don't create non-wide-character Ncurses libraries\
    \ since package installed by compiling from sources would link against them at\
    \ runtime. However, the only known binary-only applications that link against\
    \ non-wide-character Ncurses libraries require version 5. If you must have such\
    \ libraries because of binary-only application or to be compiled with LSB, build\
    \ the package again with the following commands:\n\n```\nmake distclean\n./configure\
    \ --prefix=/usr \\\n  --with-shared \\\n  --without-normal \\\n  --without-debug\
    \ \\\n  --without-cxx-binding \\\n  --with-abi-version=5\nmake sources libs\n\
    cp -av libn*.so* /usr/lib\n```\n\n# 6.2.4. Contents of Ncurses\n\n+   * Installed\
    \ programs:\n  captoinfo (link to tic), clear, infocmp, intofac (link to tic),\
    \ ncursesw6-reset (link to tset), tabs, tic, toep, and tost\n* Installed libraries:\n\
    \  libcurses.so (symlink and linker script to libncurses.so), libform.so, libmenew.so,\
    \ libncurses.so, libncurses++wa, libpanelw.so, and their non-wide-character counterparts\
    \ without \"w\"\n* Installed directories:\n  /usr/share/tabset, /usr/share/terminfo,\
    \ and /usr/share/doc/ncurses-6.1\n\n# Short Descriptions\n\ncaptoinfo\nConverts\
    \ a termcap description into a terminfo description"
