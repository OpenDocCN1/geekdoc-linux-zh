- pgno: 251
  md: '# Linux From Scratch - Version 9.0


    x can be any number in the range 16-31. y can be any number in the range 0-255.


    A valid IP address could be 192.168.1.1. A valid FQDN for this IP could be lfs.example.com.


    Even if not using a network card, a valid FQDN is still required. This is necessary
    for certain programs to operate correctly.


    Create the /etc/hosts file by running:


    ```

    cat > /etc/hosts << "EOF"

    # Begin /etc/hosts

    127.0.0.1 localhost

    127.0.0.1 <FQDN> <HOSTNAME>

    <192.168.1.1> <FQDN> <HOSTNAME> [alias1] [alias2 ...]

    ::1 localhost ip6-localhost ip6-loopback

    ff02::1 ip6-allnodes

    ff02::2 ip6-allrouters


    # End /etc/hosts

    EOF

    ```


    The <192.168.1.1>, <FQDN>, and <HOSTNAME> values need to be changed for specific
    uses or requirements (if assigned an IP address by a network/system administrator
    and the machine will be connected to an existing network). The optional alias
    name(s) can be omitted.


    # 7.6. System V Bootscript Usage and Configuration


    # 7.6.1. How do the System V Bootscripts Work?


    Linux uses a special booting named SysVinit that is based on a concept of run-levels.
    It can be quite different from one to another, so it cannot be assumed that things
    worked in one particular Linux distribution, they should work in the same LFS
    too. LTS has its own way of doing things, but it generally accepts standards.


    SysVinit (which will be referred to as "init" from now on) uses a run-levels scheme.
    There are seven (0 to 6 run-levels (actually, there are more run-levels, but they
    are for special cases and generally not used). See init (8) (for more details),
    and each one of those corresponds to the actions the computer is supposed to perform
    when it starts up. The default run-level is 3. Here are the descriptions of the
    different run-levels as they are implemented:


    +   0: halt the computer

    1: single-user mode

    2: multi-user mode without networking

    3: multi-user mode with networking

    4: reserved for customization, otherwise does the same as 3

    5: same as 4, it is usually used for GUI login (like X xdm or KDE''s kdm)

    6: reboot the computer


    234'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 7.6.2. Configuring Sysvinit


    During the kernel initialization, the first program that is run is either specified
    on the command line or, by default **init**. This program reads the initialization
    file /etc/initab. Create this file with:


    ```

    cat > /etc/initab << "EOF"

    # Begin /etc/initab


    id:3:initdefault


    si::sysinit:/etc/rc.d/init.d/rc S


    10:0:wait:/etc/rc.d/init.d/rc 0

    11:S:wait:/etc/rc.d/init.d/rc 1

    12:2:wait:/etc/rc.d/init.d/rc 2

    13:3:wait:/etc/rc.d/init.d/rc 3

    14:4:wait:/etc/rc.d/init.d/rc 4

    15:5:wait:/etc/rc.d/init.d/rc 5

    16:6:wait:/etc/rc.d/init.d/rc 6


    ca:12345:ctrlaltdel:/sbin/shutdown -t1 -a -r now


    su:S016:once:/sbin/login


    1:2345:respawn:/sbin/agetty --nuclear tty1 9600

    2:2345:respawn:/sbin/agetty tty2 9600

    3:2345:respawn:/sbin/agetty tty3 9600

    4:2345:respawn:/sbin/agetty tty4 9600

    5:2345:respawn:/sbin/agetty tty5 9600

    6:2345:respawn:/sbin/agetty tty6 9600


    # End /etc/initab

    EOF

    ```


    An explanation of this initialization file is in the page for **initab**. For
    LFS, the key command to run is **rc**. The initialization file above will **rc**
    to run all scripts starting with an S in the `/etc/rc.d/rcS` directory followed
    by all the scripts starting with an S in `/etc/rc.d/rc?` where the question mark
    is specified by the itdefault value.


    As a convenience, the **rc** script reads a library of functions in `/lib/sbin/init-functions`.
    This library also reads an optional configuration file, `/etc/sysconfig/rc.site`.
    Any of the system configuration parameters described in subsequent sections can
    be alternatively placed in this file following consolidation of all system parameters
    in one file.


    As a debugging convenience, the function also logs all output to `/run/var/boot.log`.
    The `/run` directory is a tmpfs, this file is not persistent across boots, however
    it is appended to the more permanent file `/var/log/boot.log` at the end of the
    boot process.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# 7.6.2.1. Changing Run Levels


    Changing run-levels is done with init <runlevel>, where <runlevel> is the target
    run-level. For example, to reboot the computer, a user could use the init 6 command,
    which is an alias for the reboot command. Likewise, init 0 is an alias for the
    halt command.


    There are a number of directories under /etc/rc.d that look like rc?. (where ?
    is the number of the run-level) and rcsinit.d, all containing a number of symbolic
    links. Some begin with a K, the others begin with an S and all of them have two
    numbers following the initial letter. The K means to stop (kill) a service and
    the S means to start a service. The numbers determine the order in which the scripts
    run, from 00 to 99—the lower the earlier it gets. When init switches to another
    run-level, the appropriate services are either started or stopped, depending on
    the runlevel chosen.


    The real scripts are in /etc/rc.d/init.d. They do the actual work, and links all
    point to them. K and S links point to the same script in /etc/rc.d/init.d. This
    is because the scripts can be called with different parameters like start, stop,
    restart, reload, and status. When a K is linked, the appropriate script is run
    with the start argument. When an S is encountered, the appropriate script is run
    with the start argument.


    There is one exception to this explanation. Links that start with an S in the
    rc0 to rc6 directories will not cause anything to be started. They will be called
    with the parameter stop to something. The logic behind this is when a user is
    going to reboot or halt the system, something needs to be stopped. The system
    only needs to be stopped.


    These are descriptions of what the arguments make the scripts:


    +   start

    The service is started.

    stop

    The service is stopped.

    restart

    The service is stopped and then started again.

    reload

    The configuration of the service is updated. This is used after the configuration
    file of a service was modified, when the service does not need to be restarted.

    status

    tells if the service is running and with which PIDs.


    Feel free to modify the way your boot process works (after all, it is your own
    LFS system). The files given here are example of how it can be done.


    # 7.6.3. Udev Bootscripts


    The /etc/rc.d/init.d/udev initscript triggers any "coldplug" devices that have
    already been created by the kernel and waits for rules to complete. The script
    also notices the uevent handler from the default of /sbin/hotplug . This is because
    the kernel no longer needs to call out to an external binary. udev will listen
    on a network socket for events that the kernel raises.


    The /etc/rc.d/init.d/udev_retry initscript triggers cases of re-triggering events
    for subsystems whose rules rely on filesystems that are not mounted the mounts
    script is run (in particular, /usr and /var may cause this). This script runs
    all those rules (if re-triggered) should succeed the second time. It is configured
    from the /etc/sysconfig/udev_retry file; any rules in this file that other comments
    are considered subsystem names to trigger retry time. To find the system of a
    device, udevadm info --attribute-walk <device> where <device> is an absolute path
    in /dev or sys as /dev/sr0 or /sys/class/rtc.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'For information on kernel module loading and udev, see Section 7.3.2.3, “Module
    Loading”.


    # ## 7.4. Configuring the System Clock


    The setclock script reads the time from the hardware clock, also known as the
    BIOS or the Complementary Metal Oxide Semiconductor (CMOS). If the hardware clock
    is set to UTC, this script will convert the hardware clock''s time to the local
    time using the /etc/local file (which tells the hwclock program timezone the user
    is in). There is no way to detect whether or not the hardware clock is set to
    UTC, so this needs to be configured.


    The setclock is run via udev when the kernel detects the hardware capability upon
    boot. It can also be run manually with the parameter to store the system time
    to the CMOS clock.


    If you cannot remember whether or not the hardware clock is set to UTC, find out
    by running the hwclock --show command. This will display what the current time
    is according the hardware clock. If this time matches whatever watch shows, then
    the hardware clock is set to local time. If the output from hwclock is not local,
    it is set to UTC. Verify this by adding or subtracting the proper amount of hours
    to the timezone to hwclock. For example, if you are currently in the MST timezone,
    which is also known as GMT -0700, add seven hours to the local time.


    Change the value of the UTC variable to a value of 0 (zero) if the hardware clock
    is not set to UTC.


    Create a new /etc/sysconfig/clock by running the following:


    ```

    cat /etc/sysconfig/clock << "EOF"

    # Begin /etc/sysconfig/clock

    UTC=1


    # Set this to any options you might need to give to hwclock,

    # such as machine hardware clock type for Alphas.

    CLOCKPARAMS=


    # End /etc/sysconfig/clock

    EOF

    ```


    A good hint explaining how to deal with time LFS is available at http://www.linuxfromscratch.com/hints/downloads/file/time.txt.
    It explains issues such as time zones, UTC, and the TZ environment variable.


    > CLOCKPARAMS and UTC parameters may be alternatively set in the /etc/sysconfig/rc.site
    file.


    # ## 7.6.5. Configuring the Linux Console


    This section discusses how to configure the console boot script that sets the
    keyboard map, console font and kernel log level. If non-ASCII characters (e.g.,
    the copyright sign, British pound sign and euro symbol) will not be used and the
    keyboard is a U.S. one, much of this section can be skipped. Without the configuration
    file (or equivalent settings in rc.site), the console bootstrap will do nothing.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'The console script reads the /etc/sysconfig/console file for configuration
    information. Decide which keymap and screen will be used. Various language-specific
    HOWTOs can also help with this, see http://www.ldp.org/HOWTO-HOWTO-INDEX/other-lang.html.
    If still doubt, look in the /usr/share/keymaps and /usr/share/consolefonts directories
    for keymaps and screen fonts. Read loads(8) manual pages to determine the correct
    arguments for these programs.


    The /etc/sysconfig/console file should contain lines of form: VARIABLE="value".
    The following variables are recognized:


    # LOGLEVEL


    This variable specifies the log level for kernel messages sent to the console
    as dmesg. Valid values are from "1" (no messages) to "8". The default is "7".


    # KEYMAP


    This variable specifies the arguments for the loadkeys program, typically, the
    name of keymap to load, e.g., "it". If this variable is not set, the bootscript
    will run the loadkeys program, and the default kernel keymap will be used. Note
    that a few keymaps have multiple versions with the same name (cz and its variants
    in qwerty and qw?, as in olpc and qwerty?, and tr in fgGlod and qwerty/). In these
    cases the parent directory should also be specified (e.g. qwerty/) to ensure the
    proper keymap is loaded.


    # KEYMAP_CORRECTIONS


    This (rarely used) specifies the arguments for the second call to the loadkeys
    program. This is useful if the stock keymap is not completely satisfactory and
    a small adjustment has to be made. E.g., to include the Euro sign into a keymap
    that normally doesn''t have it, set this variable to "euro2".


    # FONT


    This variable specifies the arguments for the setfont program. Typically, "-m",
    and the name of the application character map to load. E.g., to load the "lat1-16"
    together with "8859-1" application character map (as it is appropriate in the
    USA), set this variable to "lat1-16 -m 8859-1" mode, the kernel uses the application
    character map for conversion of 8-bit codes in the keymap to UTF-8, and thus the
    argument of the "-m" parameter should be set to the encoding of the composed key
    codes in the keymap.


    # UNICODE


    Set this variable to "1", "yes" or "true" in order to put the console into UTF-8
    mode. This is useful in UTF-8 locales and harmful otherwise.


    # LEGACY_CHARSET


    For many keyboard layouts, there is no stock Unicode keymap in the Kbd package.
    The console bootscript will convert an available keymap to UTF-8 on the fly if
    this variable is set to the encoding of the available non-UTF-8 keymap.


    Some examples:'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'For a non-Unicode setup, only the KEYMAP and FONT variables are generally needed.
    E.g., for a Polish setup, one would use:


    ```

    cat > /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    KEYMAP="pl12"

    FONT="lat2a-16 -m 8859-2"


    # End /etc/sysconfig/console

    EOF

    ```


    As mentioned above, it is sometimes necessary to adjust a stock keymap slightly.
    The following example adds the Euro symbol to the German keymap:


    ```

    cat > /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    KEYMAP="de-latin1"

    KEYMAP_CORRECTIONS="euro2"

    FONT="lat0-16 -m 8859-15"

    UNICODE="1"


    # End /etc/sysconfig/console

    EOF

    ```


    The following is a Unicode-enabled example for Bulgarian, where a stock UTF-8
    keymap exists:


    ```

    cat > /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    UNICODE="1"

    KEYMAP="bg_bds-utf8"

    FONT="LatArCyrHeb-16"


    # End /etc/sysconfig/console

    EOF

    ```'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'Due to the use of a 512-glyph LatAtCyrHeb-16 font in the previous example,
    bright colors are no longer available on the Linux console unless a framebuffer
    is used. If one wants to have bright colors without framebuffer and live without
    characters not belonging to the language, it is still possible to use a language-specific
    256-glyph font, as illustrated below:


    ```

    cat > /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    UNICODE="1"

    KEYMAP="bg_bds-utf8"

    FONT="cyr-sun16"


    # End /etc/sysconfig/console

    ```


    The following example illustrates keymap autconversion from ISO-8859-15 to UTF-8
    and enabling de keys in Unicode mode:


    ```

    cat > /etc/sysconfig/console << "EOF"

    # Begin /etc/sysconfig/console


    UNICODE="1"

    KEYMAP="de-latin1"

    KEYMAP_CORRECTIONS="euro2"

    LEGACY_CHARSET="iso-8859-15"

    FONT="LatAtCyrHeb-16 -m 8859-15"


    # End /etc/sysconfig/console

    EOF

    ```


    Some keymaps may have dead keys (i.e., keys that do not produce a character by
    themselves, but put an accent on the character produced by the next key) or composition
    rules (such as: "Ctrl. A to get Æ" in the default keyboard). Linux-5.2 interprets
    dead keys and composition rules in the keymap correctly only when the source characters
    are composed together this diversity does not affect keys for European languages,
    where accents are added to unassigned ASCII characters, or two ASCII characters
    composed together. However, in UTF-8 it is a problem, e.g., for the Greek language,
    where one sometimes needs to put an accent on the letter "alpha". The solution
    is to either avoid the use of UTF-8, or to install the X window system


    For Chinese, Japanese, Korean and other languages, the Linux console cannot be
    configured to display the necessary characters. Users who need languages should
    install the X Window System, fonts that cover the necessary character ranges (e.g.,
    SCIM), it supports a wide variety of languages).


    > Note /etc/sysconfig/console file only controls the Linux text console localization.
    It has nothing to do with setting the proper keyboard layout and fonts in the
    X Window System, with ssh sessions or with a serial console. In such situations,
    limitations mentioned in the last two items above do not apply.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# ## 7.6.6. Creating Files at Boot


    At times, it is desired to create files at boot time. For instance, the /tmp/.ICE-unix
    directory may be desired. This can be done by creating an entry in the /etc/sysconfig/creates
    script. The format of this file is embedded in the comments of the default configuration
