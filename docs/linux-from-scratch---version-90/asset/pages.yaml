  md: "# 71. Vim-8.1.1846\n\nThe Vim package contains a powerful text editor.\n\n\
    **Approximate build time:** 2.2 SBU\nRequired disk space: 190 MB\n\n> Alternatives\
    \ to Vim\nIf you prefer another editor—such as Emacs, Joe, or Nano—please refer\
    \ to http://www.linuxfromscratch.org/blfs/view/9.0/postfs/editors.html for suggested\
    \ installation instructions.\n\n# 6.71.1. Installation of Vim\n\nFirst, change\
    \ the default location of the vimrc configuration file to /etc:\n\n```\necho '#define\
    \ SYS_VIMRC_FILE \"/etc/vimrc\"' >> src/feature.h\n```\n\nPrepare Vim for compilation:\n\
    \n```\n./configure --prefix=/usr\n```\n\nCompile the package:\n\n```\nmake\n```\n\
    \nTo prepare the tests, ensure that the nobody user can write to the sources tree:\n\
    \n```\nchown -Rv nobody .\n```\n\nNow run the tests as the nobody user:\n\n```\n\
    su nobody -s /bin/bash -c \"LANG=en_US.UTF-8 make -j1 test\" &> vim-test.log\n\
    ```\n\nThe test suite outputs lot of binary data to the screen. This can cause\
    \ issues with the settings of the current terminal. The problem can be avoided\
    \ by redirecting the output to a log file as shown above. A successful test will\
    \ result in the word \"ALL DONE\" in the log file at completion.\n\nInstall the\
    \ package:\n\n```\nmake install\n```\n\nMany users are to use vi instead of vim.\
    \ To allow execution of vim when users habitually enter vi, create a symlink for\
    \ both the binary and the man pages in the following pages:\n\n```\nln -sv vi\
    \ /usr/bin/vi\nfor L in /usr/share/man/*man1*; do\n ln -sv vim.1 $(dirname $L)/vi.1\n\
    done\n```\n\nBy default, Vim's documentation is installed in /usr/share/vim/.\
    \ The following symlink allows the documentation to be accessed via /usr/share/doc/vim-8.1.1846,\
    \ making it consistent with the location of documentation for other packages:\n\
    \n```\nln -sv ../vim/vim81/doc /usr/share/doc/vim-8.1.1846\n```"
