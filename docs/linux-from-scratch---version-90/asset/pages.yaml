- pgno: 50
  md: '# # Chapter 5. Constructing a Temporary System


    # ## 5.1. Introduction


    This chapter shows how to build a minimal Linux system. This system will contain
    just enough tools to start constructing the final LFS system in Chapter 6 and
    allow a working environment with more user convenience than a minimum environment.


    There are two steps in building this minimal system. The first step is to build
    a new and host-independent toolchain (compiler, assembler, libraries, and a few
    useful utilities). The second step uses this toolchain to build the other essential
    tools.


    The files compiled in this chapter will be installed under the $LFS/tools directory
    to keep them separate from the files installed in the next chapter and the host
    production directories. Since the packages compiled here are temporary, we do
    not want to pollute the soon-to-LFS system.


    # ## 5.2. Toolchain Technical Notes


    This section explains all the rationale and technical details behind the overall
    build method. It is not essential to immediately understand everything in this
    section. Most of this information will be clearer after performing an actual build.
    This section can be referred to at any time during the process.


    The overall goal of Chapter 5 is to produce a temporary area that contains a known-good
    set of tools that can be isolated from the host system. By using chroot, the commands
    in the remaining chapters will be contained within that environment, ensuring
    a clean, trouble-free build of the LFS system. The build process has been designed
    to minimize the risks for new readers and to provide the most educational value
    at the same time.


    > Note

    Before continuing, be aware of the nature of the working platform, often referred
    to as the target triplet. A simple way to determine the name of the target triplet
    is to run the config.guess script that comes with the source for many packages.
    Unpack the Binutils sources and run the script: ./config.guess and note the output.
    For a 32-bit Intel processor the output will be i686-linux-gnu. On a 64-bit system
    it will be x86_64-linux-gnu.

    Also be aware of the name of the platform''s dynamic loader, often referred to
    as the dynamic loader (not to be confused with the standard linker that is part
    of Binutils). The dynamic loader provided by glibc loads the libraries needed
    by a program, prepares the program to run, and then runs. The name of the dynamic
    linker for a 32-bit machine will be ld-linux.so.2 (ld-linux-x86_64.so.2 for 64-bit
    systems). A sure-fire way to determine the name of the dynamic linker is to inspect
    a random binary from the host system by reading: read -l <name of binary> | grep
    interpreter and noting the output. The authoritative reference covering all platforms
    is the shlib-versions file in the root of the Glibc store


    Some key technical points of how the Chapter 5 build method works:


    +   - Slightly adjusting the name of the working platform, by changing the "vendor"
    field triplet way of the LFS_TGT variable, ensures that the build of Binutils
    and GCC produces a compatible cross-linker and crosscompiler. Instead of producing
    binaries for any other architecture, the cross-linker and cross-compiler will
    produce binaries compatible with the current hardware.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The temporary libraries are cross-compiled. Because a cross-compiler by its
    nature cannot rely on anything from its system, this method removes potential
    contamination of the target system by lessening the chance of headers or libraries
    from the host being incorporated into the new tools. Cross-comp also allows for
    the possibility of building both 32-bit and 64-bit libraries on 64-bit capable
    hardware.


    Careful manipulation of the GCC source tells the compiler which dynamic linker
    will be |


    Binutils is installed first because the configure runs of both GCC and Glibc perform
    various feature tests on the assembler and linker to determine which software
    features to enable or disable. This is more important than one might first realize.
    An incorrectly configured GCC or Glibc can result in a subtly broken toolchain,
    where the impact of such breakage might not show up until the end of the build
    of an entire distribution. A test suite will easily highlight this error after
    much additional work is performed.


    Bin installs assembler and linker in locations /tools/bin and /tools/$LS_TGT/.
    The tools in one location are linked to the other. An important facet of the linker
    is its search order. Detailed information can be obtained from ld by passing the
    --verbose flag. For example, ld --verbose | grep SEARCH will illustrate the search
    paths and their order. It shows which files are linked by ld by compiling a dummy
    program and passing the --verbose switch to the linker. For example, gcc dummy
    -Wl,--verbose | grep succeeded will show all the files successfully opened during
    the linking.


    The next package is installed. An example of what can be seen during its run of
    configure is:


    ```

    checking assembler to use... /tools/i686-lfs-linux-gnu/bin/as

    checking linker to use... /tools/i686-lfs-linux-gnu/bin/ld

    ```


    This is for reasons mentioned above. It also demonstrates that GCC''s configure
    script does not search the PATH directories to use. However, using the order of
    gcc itself, the same search paths are not necessarily used. To find which standard
    gcc will use, run: gcc --print-program-name=ld


    Detailed information can be obtained from gcc by passing the -v command line option
    while compiling a dummy program. For example, gcc -v dummy gcc will show detailed
    information about the preprocessor, compilation, and assembly stages, including
    gcc''s included search paths and their order.


    Next installed sanitized Linux API headers. The standard C library (glibc) to
    interface with features that the kernel will provide.


    The next package installed is Glibc. The most important considerations for building
    Glibc are the compiler, binary, and kernel headers. The compiler is not general
    one since Glibc will always use the compiler relating to the --host parameter
    passed to its configure script; e.g. in our case, the compiler is 1686-lfs-linux-gnu.
    The binary and kernel headers can be much complicated. Therefore, there are no
    risks and use the available configure switches to enforce the correct selections.
    After a run of configure, check the contents of the configure.make file in the
    glibc-build directory for all details. Note the use of CC="1686-lfs-linux-gcc"
    to control which binaries are used and of the --nostdinc and -isystem flags to
    control the compiler''s search path. This highlights an important aspect of the
    Glibc package—it is very self-sufficient in terms of its build machinery and generally
    does not rely on defaults.


    During the second phase of Binutils, we are able to utilize the --lib-path configure
    switch to control ld''s library search path.


    For the second pass of GCC, its sources also need to be modified to fetch GCC
    to use the new dynamic linker. To do so will result in the programs themselves
    having the name of the dynamic linker from the host system''s /lib embedded into
    them, which would defeat the goal of getting away from the host. From this point
    onwards, the toolchain is self-contained and self-hosted. The remainder of the
    Chapter 5 packages all build against the new Glibc in /tools.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Upon entering the chroot environment in Chapter 6, the first major package
    to be installed is Glibc, due to its self-sufficient nature mentioned above. Once
    Glibc is installed into /usr, we will perform a quick changeover of the toolchain
    enables, and then proceed in building the rest of the target LFS system.


    # 5.3. General Compilation Instructions


    When building packages there are several assumptions made under the instructions:


    +   - Several of the packages are patched before compilation, but only when the
    patch is needed to circumvent a problem. A patch is needed in both this and the
    next chapter, but sometimes in one or the other. Therefore, do not be concerned
    if instructions for a downloaded patch seem to be missing. Warning messages about
    offset or fuzz may also be encountered when applying a patch. Do not worry about
    these warnings, as the patch was still successfully applied.

    - During the compilation of most packages, there will be several warnings that
    scroll by the screen. These are normal and can be safely ignored. These warnings
    are as they appear—warnings about deprecated, but not invalid, the use of the
    C or C++ standards. C standards change fairly often, and some packages still use
    the older standard. This is not a problem, but does prompt the warning.

    - Check one last time that the `LFS` environment variable is set properly:


    ```

    echo $LFS

    ```


    Make sure the output shows the path to the LFS partition''s mount point, which
    is `/mnt/lfs`, using our example.

    - Two important items must be emphasized:


    > **Important**

    The build instructions assume that the Host System Requirements, including symbolic
    links, have been set properly:

    - bash is the shell in use.

    - sh is a symbolic link to bash**.

    - /usr/bin/awk is a symbolic link to gawk.

    - /usr/bin/yacc is a symbolic link to bison or a small script that executes bison.


    > **Important**

    To-emphasize the build process:

    1. Place all the sources and patches in a directory that will be accessible from
    the chroot environment such as `/mnt/lfs/sources/`. Do not put sources in `/mnt/lfs/tools/`.

    2. Change to the sources directory.

    3. For each package:

    a. Using the tar program, extract the package to be built. In Chapter 5, ensure
    you are the lfs user when extracting the package.

    b. Change to the directory created when the package was extracted.

    c. Follow the book''s instructions for building the package.

    d. Delete the extracted source directory unless instructed otherwise.'
