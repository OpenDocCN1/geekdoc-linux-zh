    # 6.39.1. Installation of Inetutils\n\nPrepare Inetutils for compilation:\n\n\
    ```\n./configure --prefix=/usr \\\n--localstatedir=/var \\\n--disable-logger \\\
    \n--disable-whois \\\n--disable-rpc \\\n--disable-rexec \\\n--disable-rlogin \\\
    \n--disable-rsh \\\n--disable-servers \\\n```\n\nThe meaning of the following\
    \ options:\n\n+   - --disable-logger\n  This option prevents Inetutils from installing\
    \ the logger program, which is used by scripts to pass messages to the System\
    \ Log Daemon. Do not install it because Util-linux installs a more recent version.\n\
    - --disable-whois\n  This option disables the building of the Inetutils whois\
    \ client, which is out of date. Instructions for a better whois client are in\
    \ the BLFS book.\n- --disable-r*\n  These parameters disable obsolete programs\
    \ that should not be used due to security issues. The functions provided by these\
    \ programs can be provided by the openssh package in the BLFS book.\n- --disable-servers\n\
    \  This disables the installation of the various network servers included as part\
    \ of the Inetutils package. These servers are deemed inappropriate in a basic\
    \ LFS system. Some are insecure by nature and are only considered safe on trusted\
    \ networks. Note that better replacements are available for many of these servers.\n\
    \nCompile the package:\n\n```\nmake\n```\n\nTo test the results:\n\n```\nmake\
    \ check\n```\n\n> Note\nOne test, libls.sh, may fail in the initial chroot environment\
    \ but will pass if the test is rerun after the LFS system is complete. One test,\
