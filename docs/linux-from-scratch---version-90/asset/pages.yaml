  md: "# 74. E2fsprogs-1.45.3\n\nThe E2fsprogs package contains the utilities for\
    \ handling the ext2 file system. It also supports the ext3 and ext4 journaling\
    \ file systems.\n\nApproximate build time: 3.1 SBU\nRequired disk space: 108 MB\n\
    \n# 6.74.1. Installation of E2fsprogs\n\nThe E2fsprogs documentation recommends\
    \ the package be built in a subdirectory of the source tree:\n\n```\nmkdir -v\
    \ build\ncd build\n```\n\nPrepare E2fsprogs for compilation:\n\n```\n../configure\
    \ --prefix=/usr\n    --bindir=/bin\n    --root-prefix=\"\"\n    --enable-elf-shlibs\n\
    \    --disable-libblkid\n    --disable-libuuid\n    --disable-uuid\n    --disable-fsck\n\
    ```\n\nThe meaning of the environment variable and configure options:\n\n--root-prefix=\"\
    \" and --bindir=/bin\nPrograms (such as the efsck program) are considered essential\
    \ programs. When, for example, /usr is not mounted, these programs still need\
    \ to be available. They belong in directories /lib and /sbin. If this option is\
    \ not passed to E2fsprogs' configure, the programs are installed into the /usr\
    \ directory.\n\n--enable-elf-shlibs\nThis creates the shared libraries which some\
    \ programs in this package use.\n\n--disable-*\nThis prevents E2fsprogs from building\
    \ and installing the libuuid and libblkid libraries, the uuid daemon, and the\
    \ fsck wrapper, as Util-Linux installs most recent versions.\n\nCompile the package:\n\
    \n```\nmake\n```\n\nTo run the tests, issue:\n\n```\nmake check\n```\n\nOne of\
    \ the E2fsprogs tests will attempt to allocate 256 MB of memory. If you do not\
    \ have significantly more RAM than this, be sure to enable sufficient swap space\
    \ for the test. See Section 2.5, \"Creating a File System on the Partition\" and\
    \ Section 2.7, \"Mounting the New Partition\" for details on creating and enabling\
    \ swap space.\n\nInstall the binaries, documentation, and shared libraries:\n\n\
    ```\nmake install\n```"
