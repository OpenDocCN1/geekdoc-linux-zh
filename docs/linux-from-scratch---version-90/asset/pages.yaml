    # Prerequisites


    Building an LFS system is not a simple task. It requires a certain level of existing
    knowledge of Unix system administration in order to resolve problems and correctly
    execute the commands listed. In particular, as an absolute minimum, you should
    already have the ability to use the command line (shell) to copy or move files
    and directories, directory file contents, and change the current directory. It
    is expected that you have a reasonable knowledge of using and installing Linux
    software.


    Because the LFS book assumes at least this basic level of skill, the aware LFS
    forums are unlikely to be able to provide you with much assistance in these areas.
    You will find that your questions regarding such basic knowledge will likely go
    unanswered or simply be referred to the LFS essential pre-reading list.


    Before building an LFS system, we recommend reading the following:'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Software-Building-HOWTO http://www.tldp.org/HOWTO/Software-Building-HOWTO.html


    This is a comprehensive guide to building and installing "generic" Unix packages
    under Linux. Although it was written some time ago, it still provides a good summary
    of the basic techniques needed to build and install software.


    +   - Beginner''s Guide to Installing Source http://mol.vonos.net/linux/beginners-installing-from-source/

    This guide provides a good summary of basic skills and techniques needed to build
    software from source code.


    # Typography


    To make things easy to follow, there are a few typographical conventions used
    throughout this book. This section contains some examples of the typographical
    format found throughout Linux From Scratch.


    ```

    /configure --prefix=/usr

    ```


    This form is designed to be typed exactly as seen unless otherwise noted in the
    surrounding text. It is also used in the explanation sections to identify which
    of the commands is being referenced.

    In some cases, a line extended to two or more lines with a backslash at the end
    of the line.


    ```

    gcc -B/usr/bin/" ... /binutils-2.18/configure \

    --prefix=/tools --disable-nls --disable-werror

    ```


    Note that the backslash must be followed by an immediate return. Other whitespace
    characters like spaces or tab will create incorrect results.


    ```

    install-info: unknown ''--dir-file=/mnt/lfs/usr/info/dir''

    ```


    This form (fixed-width) shows screen output, as the result of commands issued.
    This format is also used to show filenames, such as /etc/ld.so.conf.


    Emphasis


    This form is used for several purposes in the book. Its main purpose is to emphasize
    important points or items.

    http://www.linuxfromscratch.org/

    This format is used for hyperlinks both within the PFS community and external
    pages. It includes HOWTOs, download locations, and websites.


    ```

    cat > $LFS/etc/group << "EOF"

    root:x:0:

    bin:x:1:

    ...\EOF

    ```


    This format is used when creating configuration files. The first command tells
    the system to create the file $LFS/group from whatever is typed on the following
    lines until the sequence End Of File (EOF) is encountered. Therefore, this entire
    section is generally typed as seen.


    ```

    <REPLACED TEXT>

    ```


    This format is used to encapsulate text that is not to be typed as seen or for
    copy-paste operations.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '[OPTIONAL TEXT]


    Linux From Scratch - Version 9.0


    This format is used to encapsulate text that is optional.


    password(5)


    This format is used to refer to a specific manual (man) page. The number inside
    parentheses indicates a specific section inside the manuals. For example, `password`
    has two man pages. For LFS installation instructions, those two man pages will
    be located at `/usr/share/man/man1/password.1` and `/usr/share/man/man5/password.5`.
    When the book uses `password(5)` it is specifically referring to `/usr/share/man/man5/password.5`.
    **man password** will print the first man page it finds matches "password", which
    will be `/usr/share/man/man1/password.1`. For this example, you will need to run
    **man 5 password** in order to refer the specific page referred to. It should
    be noted that most man pages do not have duplicate page names in different sections.
    Therefore, **man <program name>** is generally sufficient.


    # Structure


    This book is divided into the following parts.


    # Part I - Introduction


    Part I explains a few important notes on how to proceed with the LFS installation.
    This section also provides meta-information about the book.


    Part II describes how to prepare for the building process—making a partition,
    downloading the packages, and compiling temporary tools.


    Part III guides the reader through the building of the LFS system—compiling and
    installing all the packages by one, setting up the boot scripts, and installing
    the kernel. The resulting LFS system is the foundation on which other software
    can be built to expand the system as desired. At the end of this book, there is
    an easy to use reference listing for all the programs, libraries, and important
    files that have been installed.


    # Part II - Preparing for the Build


    # Part III - Building the LFS System


    # Errata


    The software used to create an LFS system is constantly updated and enhanced.
    Security warnings and bug fixes may become available after the LFS book has been
    released. To check whether the package versions or instructions in this release
    of LFS need any modifications to accommodate security vulnerabilities or other
    bug fixes, please visit `http://www.linuxfromscratch.com/lfs/errata/9.0/` before
    proceeding with your build. You should note any changes shown and apply them to
    the relevant section of the book as you progress with building the LFS system.'
  merge: -1
