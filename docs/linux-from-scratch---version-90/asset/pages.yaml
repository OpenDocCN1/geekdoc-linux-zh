- pgno: 94
  md: '# 5.35. Stripping


    The steps in this section are optional, but if the LFS partition is rather small,
    it is beneficial to learn that unnecessary items can be removed. The executables
    and libraries built so far contain about 70 MB of unneeded debugging symbols.
    Remove them with:


    ```

    strip --strip-debug /tools/lib/*

    usr/bin/strip --strip-needed /tools/,s)bin/*

    ```


    These commands will skip a number of files, reporting that it does not recognize
    their file format. Most of these scripts are instead of binaries. Also use the
    system command to include the strip binary in /tools.


    Take care not to use --strip-needed on the libraries. The static ones would be
    destroyed and the toolchain packages would need to be built all over again.


    To save more, remove the documentation:


    ```

    rm -rf /tools/(,share)/{info,man,doc

    ```


    Remove unused files:

    at this point, you should have at least 3 GB of free space in $LFS that can be
    used to build and install Glibc and Gcc in the next phase. If you can build and
    install Glibc, you can build and install the rest too.


    ```

    find /tools/(lib,libc) -name *.la -delete

    ```


    # 5.36. Changing Ownership


    > Note

    The commands in the remainder of this book must be performed while logged in as
    user root and no longer as user fs. Also, double check that $LFS is set in root''s
    environment.


    Currently, the $LFS/tools directory is owned by the user lfs, a user that exists
    only on the host system. If the $LFS tools directory is kept as is, the files
    are owned by a user ID with a corresponding account. This is dangerous because
    a user account created later could give this same user ID and own the $LFS/tools
    directory and all the therein, exposing these to malicious manipulation.


    To avoid this, you add the lfs user to the new LFS system later when creating
    the /etc/passwd file, try to assign it the same user and group IDs on the host
    system. Better yet, change the ownership of the $LFS/tools directory to root by
    running the following command:


    ```

    chown -R root:root $LFS/tools

    ```


    Although the $LFS/tools directory can be deleted once the LFS system has been
    finished, it can be retained to build additional LFS systems of the same book
    version. How best to backup $LFS/tools is a matter of personal preference.


    > Caution

    If you intend to keep the temporary for use in building future LFS systems, now
    is the time to back them up. Subsequent commands in chapter 6 will alter the tools
    currently in place, rendering them useless for future builds.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Part III. Building the LFS System'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Chapter 6. Installing Basic System Software


    # 6.1. Introduction


    In this chapter we are building the base site and starting the LFS system in earnest.
    That is, we crooth into the temporary Linux system, make a few preparations, and
    then begin installing the packages.


    The installation of this software is straightforward. Although in many cases the
    installation instructions could be made shorter and more generic, we have opted
    to provide the full instructions for every package to minimize the possibilities
    for mistakes. The key to learning what a Linux system work is to know what each
    package is for and why you (or the system) may need it.


    We do not recommend using optimizations. They can make a program run faster, but
    may also cause compilation difficulties and problems when running the program.
    If a package refuses to compile using optimization, to compile it without optimization
    and see if that fixes the problem. Even if the package does compile using optimization,
    there is the risk it may have been compiled incorrectly because of the complex
    interactions between the code and build tools. Also note that the -march and -mtune
    options are often outweighed by the risks. First-time builders of LFS the book
    have not been tested. This may cause problems with the toolchain packages (Binutils,
    GCC and Glibc). The small gains achieved in using compiler optimizations are outweighed
    by the risks. First-time builders of LFS are encouraged to build without custom
    optimizations. The subsequent system will still run fast and be stable at the
    same time.


    The order that packages are installed in this chapter needs to be strictly followed
    to ensure no program acquires a path referring to /tools hard-wired into it. For
    the same reason, do not compile separate packages in parallel. Compiling in parallel
    may seem stable (especially on dual-CPU machines), but could result in a program
    containing a hard-wired path to /tools, which will cause the program to stop working
    when directory is removed.


    Before the installation, each installation page provides information about the
    package, including a concise description of what it contains, approximately how
    long it will take to build, and how much disk space is required during this building
    process. Following the installation instructions, there is a list of packages
    and libraries (along with brief descriptions of these) the package installs.


    > Note The SBU values and required disk space includes test data for all applicable
    packages in Chapter 6.


    # 6.1.1. About libraries


    In general, the LFS editors consider many libraries made obsolete in a modern
    Linux system. In addition linking a static library to a program can be detrimental.
    If an update to the library is needed to remove a security problem, all programs
    that use the static library will need to be linked to the new library. The use
    of static libraries is not always obvious, the relevant programs (and the procedures
    to do so) may not even be known.


    In the procedures in Chapter 6, we remove or disable installation of most static
    libraries. This usually is by passing a --disable-static option to configure.
    In other cases, alternate means are needed. In a few cases, especially glibc and
    gcc, the use of static libraries remains essential to the general package building
    process.


    For a more complete discussion of libraries, see discuss Libraries: Static or
    shared? in the BLFS book.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# 6.2. Preparing Virtual Kernel File Systems


    Various file systems exported by the kernel are used to communicate to and from
    the kernel itself. These file systems are virtual in that no disk space is used
    for them. The content of the file systems resides in memory.


    By creating directories onto which the file systems will be mounted:


    ```

    mkdir -pv $LFS/{dev,proc,sys,run}

    ```


    # 6.2.1. Creating Initial Device Nodes


    When the kernel boots, it requires the presence of a few device nodes, in particular
    the console and null devices. The device nodes must be created on the hard disk
    so they are available before udev has been started, and additionally when Linux
    is started with init=/bin/bash. Create the devices by running the following commands:


    ```

    mkkn -m 600 $LFS/dev/console c 5 1

    mknod -m 666 $LFS/dev/null c 1 3

    ```


    # 6.2.2. Mounting and /dev


    The recommended method of populating /dev directory with devices is to mount a
    filesystem (such as tmpfs) on the /dev directory, and allows the devices to be
    created dynamically on that virtual filesystem as they are detected or observed.
    Device creation is generally during the boot process by Udev. Since this new system
    does not have Udev and has not been booted, it is necessary to mount and populate
    /dev manually. This is accomplished by binding mount the system''s /dev directory.
    A bind mount is a type of mount that allows you to create a mirror of a device
    directory or mount point to some other location. Use the following command to
    achieve this:


    ```

    mount -v --bind $LFS/dev

    ```


    # 6.2.3. Mounting Virtual Kernel File Systems


    Now mount the remaining kernel filesystems:


    ```

    mount -vt devpts devpts $LFS/dev/pts -o gid=5,mode=620

    mount -vt proc proc $LFS/proc

    mount -vt sysfs sysfs $LFS/sys

    mount -vt tmpfs tmpfs $LFS/run

    ```


    The meaning of the mount options for devpts:


    ```

    gid=5

    ```


    This ensures that all devpts-created device nodes are owned by group ID 5. This
    is the ID we will use later on the tty group. We use the group instead of a name,
    since the host system might use a different ID for its tty group.


    ```

    mode=0620

    ```


    This ensures that all devpts-created device nodes have mode 0620 (user readable
    and, group writable). Together with the option, this ensures that devpts will
    create device nodes that meet the requirements of grantpt(), meaning the Glibc
    pt_chown helper binary (which is not installed by default) is not necessary.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Linux From Scratch - Version 9.0


    In some systems, /dev/shm is a symbolic link to /run/shm. The /tmpfs was mounted
    above so in this case only a directory needs to be created.


    ```

    if -h $LFS/dev/shm; then

    mkdir -pv $LFS/$($LFS/dev/readlink)

    fi

    ```


    # 6.3. Package Management


    Some reasons why package management is mentioned in LFS or BLFS:


    +   * Dealing with package management takes the focus away from the goals of these
    books—teaching a Linux system is built.


    +   * There are multiple solutions for package management, each having its strengths
    and drawbacks. One that satisfies all is difficult.


    There are some hints written on the topic of package management. Visit the Hints
    Project and see if one of them fits your need.


    # 6.3.1. Upgrade Issues


    +   * If Glibc needs to be upgraded to a newer version (e.g. from glibc-2.19 to
    glibc-2.20), it is safer to rebuild LFS. You may have to rebuild all the packages
    in their dependency order, or we do not recommend it.


    +   * If a package contains a shared library is updated, and if one of the library
    changes, then all the packages dynamically linked to the library need to be recompiled
    against the new library. (Note that there is no correlation between the package
    name and the name of the library). For example, a package foo installs a shared
    library with name libfoo.so.1. Say you upgrade the package to a newer version
    foo-1.2.4 that installs a shared library with name libfoo.so.2. In this case,
    all packages that are dynamically linked to libfoo.so.1 need to be recompiled
    to link against libfoo.so.2. Note that you should not remove the previous libraries
    unless the dependent packages are recompiled.


    # 6.3.2. Package Management Techniques


    The following are some common package management techniques. Before making a decision
    on a package manager, do some research on the various techniques, particularly
    the drawbacks of the particular scheme.


    # 6.3.2.1. It is All in My Head


    Yes, this is a package management technique. Some folks do not find the need for
    a package manager because they know the packages intimately and know what files
    are installed by each package. Some users also do not need any package management
    because they plan on rebuilding the entire system when a package is changed.


    81'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 6.3.2. Install in Separate Directories


    This is a simplistic management framework that does not need any extra package
    to manage the installations. Each package is installed in a separate directory.
    For example, package-libfoo-1 is installed in /usr/pkg/foofoo-1 and a symlink
    is made from /usr/pkg/libfoo to /usr/pkg/libfoo-1. When installing a new version
    of libfoo-1.2, it is installed in /usr/pkg/libfoo-1.2 and the previous symlink
    is replaced by a symlink to the new version.


    Environment variables such as PATH, LD_LIBRARY_PATH, MANPATH, INFOPATH and CPPFLAGS
    need to be expanded using /usr/pkg/foo. For more than a few packages, this scheme
    becomes unmanageable.


    # 6.3.3. Symlink Style Package Management


    This is a variation of the previous package management technique. Each package
    is installed alongside the previous scheme. Instead of making the symlink, each
    file is symlinked into the /usr hierarchy. This removes the need to expand the
    environment variables. Though the symlinks can be created by the user to automate
    the creation, many package managers have been using this approach. A few of the
    popular ones include Stow, Epkg, Graft, and Depot.


    The installation needs to be fake, so that the package that it is installed in
    /usr in reality it is installed in the /usr/pkg hierarchy. Installing in this
    manner is not a trivial task. For example, consider that you are installing a
    package libfoo-1.1. The following instructions may not install the package properly:


    ```

    ./configure --prefix=/usr/pkg/libfoo/1.1

    make

    make install

    ```


    The installation will work, but the dependent packages may not link to libfoo
    as you expect. If you compile a package that you may notice it is linked to /usr/pkg/libfoo-1.1/lib/libfoo.so.1
    instead of /usr/lib/libfoo.so.1 as you would expect. The correct approach is to
    use the DESTDIR strategy to fake installation of the package. This approach works
    as follows:


    ```

    ./configure --prefix=/usr

    make

    DESTDIR=/usr/pkg/libfoo/1.1 make

    ```


    Most packages support this approach, but there are some who do not. For the non-compliant
    packages, you may either need to manually install the package, or you may find
    that it is easier to install some problematic packages into /opt.


    # 6.3.4. Timestamp Based


    In this technique, a file is timestamped before the installation of the package.
    After the installation, a simple use of the find with the appropriate options
    can generate a log of all the files installed after the timestamp file was created.
    A package manager with this approach is install-log.


    Though this scheme has the advantage of being simple, it has two drawbacks. If,
    during installation, the files are installed with any timestamp other than the
    current time, files will not be tracked by the package manager. Also, this scheme
    can only be used when one package is installed at a time. The logs are not reliable
    if two packages are being installed on two different consoles.


    # 6.3.5. Tracing Installation Scripts


    In this approach, the commands that the installation scripts perform are recorded.
    There are two techniques that one can use:'
