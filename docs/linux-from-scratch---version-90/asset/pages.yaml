- pgno: 237
  md: '# 6.78. About Debugging Symbols


    Most programs and libraries are, by default, compiled with debugging symbols included
    (with *gcc -g* option). This means that when debugging a program or library that
    was compiled with debugging information included, the debugger can provide only
    memory addresses, but also the names of the routines and variables.


    However, the inclusion of these debugging symbols enlarges a program or library
    significantly. The following is an example of the amount of space these symbols
    occupy:


    +   * A **bash** binary with debugging symbols: 1200 KB

    * A **bash** binary without debugging symbols: 480 KB

    * **Glibc** and GCC files (/lib* and */usr/lib*) with debugging symbols: 87 MB

    * **Glibc** and GCC files without debugging symbols: 16 MB


    Sizes may vary depending on which compiler and C libraries were used, but when
    comparing programs with and without debugging symbols, the difference will usually
    be a factor between two and five.


    Because most users will never use a debugger on their system software, a lot of
    disk space can be regained by removing these symbols. The next section shows how
    to strip all debugging symbols from the programs and libraries.


    # 6.79. Stripping Again


    This section is optional. If the intended user is a programmer and does not plan
    to do any debugging on the system software, the system size can be decreased by
    about 90 MB by removing the debugging symbols from binaries and libraries. This
    causes no inconvenience other than not being able to debug the software fully
    anymore.


    Most people who use the commands mentioned below do not experience any difficulties.
    However, it is easy to make a typo and render the new system unusable, so before
    running the **strip** commands, it is a good idea to make a backup of your LFS
    system in its current state.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "# Linux From Scratch - Version 9.0\n\nFirst place the debugging symbols for\
    \ selected libraries in separate files. This debugging information is needed if\
    \ running regression tests that use valgrind or gdb later in BLFS.\n\n```\nsave_lib=ld-2.30.so\
    \ libc-2.30.so libthread-2.30.so libthread_db-1.0.so\n\ncd /lib\n\nfor LIB in\
    \ $save_lib; do\n  objcopy --only-keep-debug $LIB.dbg\n  strip --strip-unneeded\
    \ $LIB\n  objcopy --add-gnu-debuglink=$LIB.dbg $LIB\ndone\nsave_usrl=\"libquadmath.so.0.0.0\
    \ libstdc++.so.6.0.267\nlibitim.so.1.0.0 libatomic.so.1.2.0\"\n\ncd /usr/lib\n\
    \nfor LIB in $save_usrl; do\n  objcopy --only-keep-debug $LIB.dbg\n  strip --strip-unneeded\
    \ $LIB\n  objcopy --add-gnu-debuglink=$LIB.dbg $LIB\ndone\n\nunset LIB save_lib\
    \ save_usrl\n```\n\nBefore performing the stripping, take care to ensure that\
    \ none of the binaries that are about to be stripped are running:\n\n```\nexec\
    \ /tools/bin/bash\n```\n\nNow the binaries and libraries can be safely stripped:\n\
    \n```\n/tools/bin/find /usr/lib -type f -name \\*.a \\\n  -exec /tools/bin/strip\
    \ --strip-debug {} \\'\n\n/tools/bin/find /usr/lib -type f \\ -name \\*.so* -a\
    \ ! -name \\*dbg \\ \\\n  -exec /tools/bin/strip --strip-unneeded {} \\'\n\n/tools/bin/find\
    \ /bin,sbin /usr/bin,sbin,libexec -type f \\\n  -exec /tools/bin/strip --strip-all\
    \ {} \\;'\n```\n\nA large number of files will be reported as having their file\
    \ format not recognized. These warnings safely ignored. These warnings indicate\
    \ that those files are scripts instead of binaries.\n\n#  6.80. Cleaning Up\n\n\
    Finally, clean up some extra files left around from running tests:\n\n```\nrm\
    \ -rf /tmp/*\n```"
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Linux From Scratch - Version 9.0


    Now log out and reenter the chroot environment with an updated chroot command.
    From now on, use this updated chroot command any time you need to reenter the
    chroot environment after exiting:


    logout


    ```

    chroot "$LFS" /usr/bin/env -i \\

    HOME=/root TERM="$TERM" \\

    PS1=(lfs chroot) u:\w\$ \\

    PATH=/bin:/usr/bin:/sbin:/usr/sbin \\

    bin/bash --login

    ```


    The reason for this is that the programs in /tools are no longer needed. For this
    reason you can delete the /tools directory if desired.


    ![](img/78f4ce02ad2a3526b7a07a130d5ef5bd_239_0.png)


    # Note


    Removing /tools will remove the temporary copies of Tcl, Expect, and DejaGNU which
    used for running the toolchain files. If you need these later on, they will need
    to be recompiled and installed. The BLFS book has instructions for this (see http://www.linuxfromscratch.org/blfs/).


    If the virtual kernel file systems are mounted, unmounted or through a reboot,
    ensure that the virtual kernel file systems are mounted when reentering the chroot.
    This process was explained in Section 6.2.2, "Mounting and Populating /dev" and
    Section 6.2.3, "Mounted Virtual Kernel File Systems"


    There were several static libraries that were suppressed earlier in the chapter
    in order to satisfy the regression tests in several packages. These libraries
    are from binutils, bzip2, e2fsprogs, flex, libtool, and zlib. If desired, remove
    them now:


    ```

    rm -f /usr/bin/lib(bfd,opcodes).a

    rm -f /usr/bin/lib/libb2.a

    rm -f /usr/bin/lib(com_err,e2p,ss).a

    rm -f /usr/bin/lib/libtdl.a

    rm -f /usr/bin/lib/libf1.a

    rm -f /usr/bin/lib/libz.a

    ```


    There are also files installed in the /usr/lib and /usr/libexec directories with
    a file name extention of .la. These are "libtool archive" and generally unneeded
    on a linux system. None of them are necessary at this point. To remove them, run:


    ```

    find /usr/lib /usr/libexec -name *.la -delete

    ```


    For more information about libtool archive files, see the BLFS section "About
    Libtool Archive (.la) files".


    222'
