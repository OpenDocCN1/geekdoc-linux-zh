    ```\nsed -i '*/.old/d' Makefile.in\nsed -i '/(OLDSUFF)/c' support/shlib-install\n\
    ```\n\nPrepare Readline for compilation:\n\n```\n./configure --prefix=/usr \\\n\
    \    --disable-static \\\n    --docdir=/usr/share/doc/readline-8.0\n```\n\nCompile\
    \ the package:\n\n```\nmake SHLIB_LIBS=\"-L/tools/lib -lcurses\"\n```\n\nThe meaning\
    \ of the make option:\n\n```\nSHLIB_LIBS=\"-L/tools/lib -lcursesw\"\n```\n\nThis\
    \ option forces Readline to link against the libncurses library.\n\nThis package\
    \ does not come with a test suite.\n\nInstall the package:\n\n```\nmake SHLIB_LIBS=\"\
    -L/tools/lib -lcursesw\" install\n```\n\nMove the dynamic libraries to a more\
