    \ Issue the following command so that Perl will use the libraries installed on\
    \ the system:\n\n```\nexport BUILD_ZLIB=False\nexport BUILD_BZIP2=0\n```\n\nTo\
    \ have full control over how Perl is set up, use the \"des\" options from the\
    \ following command and hand-pick which package this is built. Alternatively,\
    \ use the command exactly as below to use the details that Perl auto-detects:\n\
    \n```\nsh Configure -des -Dprefix=/usr \\\\\n  -Dvendorprefix=/usr \\\\\n  -Dman1dir=/usr/share/man/man1\
    \ \\\\\n  -Dman3dir=/usr/share/man/man3 \\\\\n  -Dpager=\"/usr/bin/less -isR\"\
    \ \\\\\n  -Dusheshrlib \\\\\n  -Dusetethreads\n```\n\n**The meaning of the configure\
    \ options:**\n\n+   -Dvendorprefix=/usr\nThis Perl knows how to tell packages\
