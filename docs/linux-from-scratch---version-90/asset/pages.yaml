    \ north america europe africa antarctica \\\nasia australia backward pacificnew\
    \ systemv; do\n zic -L /dev/null -d $ZONEINFO ${tz}\n zic -L /dev/null -d $ZONEINFO/posix\
    \ ${tz}\n zic -L leapseconds -d $ZONEINFO/right ${tz}\ndone\n```\n\n```\ncp -v\
    \ zone.tab zone1970.tab iso3166.tab $ZONEINFO\nzic -d $ZONEINFO -p America/New_York\n\
