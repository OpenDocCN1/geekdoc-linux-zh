  md: '# # 6.59. Groff-1.22.4


    The Groff package contains programs for processing and formatting text.


    **Approximate build time:** 0.5 SBU **Required disk space:** 95 MB


    # ## 6.59.1. Installation of Groff


    Groff expects the environment variable PAGE to contain the default paper size.
    For users in the United States, PAGE=letter is appropriate. Elsewhere, PAGE=A4
    may be more suitable. While the default paper size is configured during compilation,
    it can be overridden by echoing either "A4" or "letter" to the /etc/papersize
    file.


    Prepare Groff for compilation:


    ```

    PAGE=<paper_size> ./configure --prefix=/usr

    ```


    This package does not support parallel build. Compile the package:


    ```

    make -j1

    ```


    This package does not come with a test suite.


    Install the package:


    ```

    make install

    ```


    # ## 6.59.2. Contents of Groff


    **Installed programs:** addtinfo, afmotid, chem, eqn, eqn2graph, giddfmk, glylipond,
    gperl, gpinyin, graph2graph, gro, godvi, groff, groffer, groblp, groj4, groys,
    grotty, hfootdit, indxbib, lbkb, lookbib, preconv, mffroq, nref, pfdom, pdfroff,
    pbtfops, pic, pic2graph, post-grohtml, pre-grohtml, nfer, roff2di, roff2html,
    roff2pdf, roff2ps, roff2text, roff2x, soelim, tbl, tffmotif, and roff


    **Installed directories:** /usr/lib/groff and /usr/share/doc/groff-1.22.4, /usr/share/groff


    # ### Short Descriptions


    +   **addtinfo** Reads a font file and adds some additional font-metric information
    that is used by the **groff** system


    +   **afmotid** Creates a font for use with **groff** and **groups**


    +   **chem** Groff preprocessor for producing chemical structure diagrams


    +   **eqn** Compiles descriptions of equations EQN (equation) embedded within
    input input that are understood by **troff**


    +   **eqn2graph** Converts a tff EQN into a cropped image


    +   **giddfmk** Marks differences between groff/nroff files


    +   **glylipond** Transforms sheet music written in the lipylond language into
    the groff language


    +   **gperl** Preprocessor for groff, allowing addition of perl code into groff
    files


    +   **gpinyin** Preprocessor for groff, allowing addition of Chinese European-like
    language Pinyin into groff files'
  merge: -1
