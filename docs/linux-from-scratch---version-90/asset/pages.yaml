  md: '--enable-64-bit-bfd

    Enables 64-bit support (on hosts with narrower word sizes). May not be needed
    on 64-bit systems, but does not harm.

    --with-system-zlib

    Use the installed zlib library rather than building the included version.


    Compile the package:


    The meaning of the make= parameter:

    tooldir=/usr

    Normally, the tooldir (the directory where the executables will ultimately be
    located) is set to $(exec_prefix)/$(target_alias). For example, x86_64 machines
    would expand to /usr/x86_64-unknown-linux-gnu. Because this is a custom system,
    this target-specific directory in /usr is not required. $(exec_prefix)/$(target_alias)
    would be used if the system was used to cross-compile (for example, compiling
    a package on an Intel machine that generates code that can be executed on PowerPC
    machines).


    > Important

    The test suite for Binutils in this section is considered critical. Do not skip
    it under any circumstances.


    Test the results:


    ```

    make -k check

    ```


    The PC-relative offset test and the debug_msg.sh test may fail in the LFS environment.

    Install the package:


    ```

    make tooldir=/usr install

    ```


