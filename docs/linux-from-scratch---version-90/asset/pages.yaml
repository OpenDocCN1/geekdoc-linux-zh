    LC_ALL=<locale name> locale charset

    LC_ALL=<locale name> locale int_curr_symbol

    LC_ALL=<locale name> locale int_prefix

    ```


    The above commands should print the locale name, the character encoding used by
    the locale, the local currency, and the prefix to de the phone number in order
    to get into the country. If any of the commands fail with a message similar to
    the one below, this means that your locale was not installed in Chapter 6 or is
    not supported by the default installation of glibc.


    ```

    locale: cannot set LC_* to default locale: No such file or directory

    ```


    If this happens, you should install the desired locale using the localectlef command,
    or choosing a different locale. Further instructions assume that there are no
    error messages from Glibc.


    Some packages may also lack support for your chosen locale. One example is the
    X library (part of the X Window System), which outputs the following error if
    the locale does not exactly match one of the character maps in its internal files:


    ```

    Warning: locale not supported by Xlib, locale set to C

    ```


    In several cases Xlib expects that the character map will be listed in uppercase
    notation with canonical dashes. For instance, "ISO-8859-1" rather than "iso88591".
    It is also possible to find an appropriate specification by modifying the charset
    map of the locale. This can be checked by running the locale charset in both locales.
    For example, one would have to change "de_DE.ISO-8859-15@euro" to "de_DE@euro"
    to get this locale recognized by Xlib.


    Other packages may also function correctly (but not necessarily display any error
    messages) if the locale name does not meet the expectations. In those cases, investigating
    how other Linux distributions support your locale might provide some useful information.


    Once the proper locale settings have been determined, create the /etc/profile
    file:


    ```

    cat > /etc/profile << "EOF"

    # /etc/profile


    export LANG=<locale>.<charset>@<modifiers>


    # End /etc/profile

    EOF

    ```


    The "C" (default) and "en_US" (the recommended for one United States English users)
    locales are different. "C" uses the US-ASCII 7-bit character set, and treats bytes
    with the high bit set as invalid characters. That''s why, e.g., the ls commands
    then show such characters with question marks in the locale. Also, an attempt
    to send mail with such characters from Mutt or Pine results in non-RFC-conforming
    messages (the charset in the outgoing mail is indicated as "unknown 8-bit”). So
    you can use the "C" locale only if you are sure that you will never need 8-bit
    characters.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'UTF-8 based locales are not supported well by some programs. Work is in progress
    to document and, if possible, fix such problems, see http://www.linuxfromscratch.org/blfs/view/9.0/introduction/locale-issues.html.


    # # 7.8. Creating the /etc/inputrc File


    The inputrc file is the configuration file for the Readline library, which provides
    editing capabilities while the user is entering a line from the terminal. It works
    by translating keyboard inputs into specific actions. Readline is used by Bash
    and most other shells as well as many other applications.


    Most people do not use user-specific functionality so the command below creates
    a global /etc/inputrc used by everyone who logs in. If you later decide you need
    to override the defaults on a per-user basis, you can create a .inputrc file in
    the user''s home directory with the modified mappings.


    For more information on how to edit the inputrc file, see **info bash** under
    the *Readline Init File* section. **info readline** is also a good source of information.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'Below is a generic global inputrc along comments to explain what the various
    options do. Note that comments cannot be on the same line as commands. Create
    the file using the following command:


    ```

    cat > /etc/inputrc << "EOF"

    # Begin /etc/inputrc

    # Modified by Chris Lynn <rory@rory.dynup.net>


    # Allow the command prompt to wrap to the next line

    set horizontal-scroll-mode Off


    # Enable 8bit input

    set meta-flag On

    set input-meta On


    # Turns off 8 bit stripping

    set convert-meta Off


    # Keep the 8th bit for display

    set output-meta On


    # none, visible or audible

    set bell-style none


    # All of the following map the escape sequence of the value

    contained in the 1st argument to the readline specific functions

    "\eod": backward-word

    "\eoc": forward-word


    # for linux console

    "\e[1~": beginning-of-line

    "\e[4~": end-of-line

    "\e[5~": beginning-of-history

    "\e[6~": end-of-history

    "\e[3~": delete-char

    "\e[2~": quoted-insert


    # for xterm

    "\eoH": beginning-of-line

    "\eoF": end-of-line


    # for Konsole

    "\e[H]\

    ```'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 7.9. Creating the /etc/shells File


    The shells file contains a list of login shells on the system. Applications use
    this file to determine whether a shell is valid. For each single line should be
    present, consisting of the shell''s path, relative to the root of the directory
    structure ( / ).


    For example, this file is consulted by chsh to determine whether an unprivileged
    user may change the login shell for her own account. If the command name is not
    listed, the user will be denied of change.


    It is a requirement for applications such as GDM which does not populate the face
    browser if it can''t find /etc/shells, or FTP daemons which traditionally disallow
    access to users with shells not included in this file.


    ```

    cat > /etc/shells << "EOF"

    # Begin /etc/shells


    /bin/sh

    /bin/bash


    # End /etc/shells

    EOF

    ```'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Chapter 8. Making the LFS System Bootable


    # 8.1. Introduction


    It is time to make the LFS system bootable. This chapter discusses creating an
    fstab file, building a kernel for the new LFS system, and installing the GRUB
    boot loader so that the LFS system can be selected for booting at startup.


    # 8.2. Creating the /etc/fstab


    The /etc/fstab file is used by some programs to determine which file systems are
    to be mounted by default, in which order, and must be checked (for integrity)
    prior to mounting. Creating a new file systems table like this:


    ```

    cat > /etc/fstab << "EOF"

    # Begin /etc/fstab

    # file system mount-point type options dump fsck order

    /dev/<xxx> / <fff> defaults 1 0

    /dev/<yyy> swap swap pri=1 0 0

    proc /proc proc nosuid,noexec,nodev 0 0

    sysfs /sys sysfs nosuid,noexec,nodev 0 0

    devpts /dev/pts devpts gid=5,mode=620 0 0

    tmpfs /run tmpfs defaults 0 0

    devtmpfs /dev devtmpfs mode=0755,nosuid 0 0

    # End /etc/fstab

    EOF

    ```


    Replace <xxx>, <yyy>, and <fff> with the values appropriate for your system, for
    example, sda2, sda5 and ext4. For details on this file, see **man fstab**.


    Filesystems with MS-DOS or Windows origin (i.e. vfat, ntffs, smbfs, iso9660, udf)
    need a special option, utf8 for non-ASCII characters in file names to be interpreted.
    For non-UTF8 locales, the value of ioarchet should be set to the same as the character
    set of the locale, adjusted in a way that the kernel understands it. This works
    if the relevant character set is defined (under File systems -> Language Support
    when configuring the kernel) is compiled into the kernel or as a module. However,
    if the character set of the locale is UTF-8, the option ioarchet=utf8 would make
    the file system sensitive to this. To use the special option utf8 instead of ioarchet=utf8,
    for UTF-8 locales. The "codepage" option is also needed for vfat and smbfs filesystems.
    For example, in order to mount USB flash drives, a _RU_UTF8-R user would need
    the following in the options portion of its line in /etc/fstab:


    ```

    noauto,user,quiet,showexec, codepage=866, ioarchet=koi8

    ```


    The corresponding options fragment for _RU_UTF8-R users is:


    ```

    noauto,user,quiet,showexec, codpage=866, utf8

    ```'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Note that using charset is the default for the iso8859-1 (which keeps the file
    system case insensitive), and the utf8 option tells the kernel to convert the
    file names using UTF-8 so they can be interpreted in the UTF-8 locale.


    It is also possible to specify default codepage and charset values for some filesystems
    during kernel configuration. The relevant parameters are named "Default NLS Option"
    (CONFIG_NLS_DEFAULT), "Default Remote NLS Option" (CONFIG_SMB_NLS_DEFAULT), "Default
    codepage for FAT" (CONFIG_FAT_DEFAULT_CODEPAGE), and "Default charset for FAT"
    (CONFIG_FAT_DEFAULT_CHARSET). There is no way to specify these settings for the
    nfs filesystem at kernel compilation time.


    It is possible to make the ext3 filesystem reliable across power failures for
    some hard disk types. To do this, add the barrier=1 mount option to the appropriate
    entry in /etc/fstab. To check if the disk drive supports this option, run hdparm
    on the applicable disk drive. For example,:


    ```

    hdparm -I /dev/sda  | grep NCQ

    ```


    returns non-empty output, the option is supported.


    Note: Logical Volume Management (LVM) based partitions cannot use the barrier
    option.'
  merge: -1
  img_proc: true
- pgno: 268
  md: "# 8.3. Linux-5.2.8\n\nThe Linux package contains the Linux kernel.\n\nApproximate\
    \ build time: 4.4 - 66.0 SBU (typically about 6 SBU)\nRequired disk space: 960\
    \ - 4250 MB (typically about 1100 MB)\n\n# 8.3.1. Installation of the kernel\n\
    \nBuilding the kernel involves a few steps—configuration, compilation, and installation.\
    \ Read the README file in the kernel source for alternative methods to what this\
    \ book configures the kernel.\n\nPrepare for compilation by running the following\
    \ command:\n\n```\nmake mrproper\n```\n\nThis ensures that the kernel tree is\
    \ absolutely clean. The kernel team recommends that this command be used prior\
    \ to each compilation. Do not rely on the source being clean after-tarring.\n\n\
    Configure the kernel via a menu-driven interface. For general information on kernel\
    \ configuration see http://linuxfromscratch.org/hints/downloads/files/kernel-config.txt\
    \ BLFS has information regarding particular kernel configuration requirements\
    \ of packages outside of LFS at http://linuxfromscratch.org/blfs/9.0/longindex.html#kernel-config-index.\
    \ Additional information about configuring and building the kernel can be found\
    \ at http://www.kroah.com/lkn/\n\n> Note\nA good starting place for setting up\
    \ the kernel configuration is to run makeconfig. This will set the base configuration\
    \ to a good state that takes your system architecture into account.\nBe sure to\
    \ enable/disable/set the following features or the system might not work correctly\
    \ or boot at all:\n\n| Device Drivers ---> |\nGeneric Driver Options ---> |\n\
    \ ] Support for uevent helper [CONFIG_UEVENT_HELPER]\n[*] Maintain a devmtfs filesystem\
    \ to mount at /dev [CONFIG_DEVTMPFS]\nKernel hacking ---> |\nChoose kernel unwinder\
    \ (Frame pointer unwinder) ---> [CONFIG_UNWIND|\n\nThere are several other options\
    \ that may be desired depending on the requirements for the system. For a list\
    \ of options needed for BLFS packages, see the BLFS Index of Kernel Settings (http://linuxfromscratch.org/blfs/9.0/longindex.html#kernel-config-index)."
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Note


    If your hardware is using UEFI, the ''make defconfig'' should automatically add
    in some EFI-related kernel options.


    In order to allow LFS kernel to be booted from within your host''s UEFI boot environment,
    your kernel must have this option selected:


    ```

    Processor type and features    --->

    [*] EFI stub support       [CONFIG_EFI_STUB]

    ```


    A description of managing UEFI environments from within LFS is covered by the
    Lfs-uefi.txt at http://www.linuxfromscratch.org/hints/downloads/lfs-uefi.txt.


    The rationale for the above configuration items:


    +   Support for uevent helper

    Having this option may interfere with device management when using Udev/Eudev.

    Maintain a devmtps

    This will create automated device nodes which are populated by the kernel, even
    without Udev running. Udev then runs on top of this, managing permissions and
    adding symlinks. This configuration item is required for all users of Udev/Eudev.


    # make menuconfig


    The meaning of optional make environment variables:


    LANG=<host_LANG_value> LC_ALL=

    This establishes the locale setting to the used one on your host. This may be
    required for proper ncurses config interface line drawing on an UTF-8 kernel console.

    If used, serve to replace <host_LANG_value> by the value of the $LANG variable
    from your host. You can alternatively use the host''s value of $LC_ALL or $LC_CTYPE.


    Alternatively, make oldconfig may be more appropriate in some situations. See
    the README file for more information.

    If desired, kernel configuration by copying the kernel file .config, from the
    host system (assuming it is available) to the unpacked linux-5.2.8 directory.
    We do not recommend this option. It is better to explore all the configuration
    menus and create the kernel configuration from scratch.


    Compile the kernel image and modules:


    ```

    make

    ```


    If using kernel modules, module configuration in /etc/modprobe.d may be required.
    Information pertaining to modules and kernel configuration is located in Section
    7.3, "Overview of Device and Module Handling" and in the kernel documentation
    in the linux-5.2.8/Documentation directory. Also, modprobe.d(5) may be of interest.


    Install the modules, if the kernel configuration uses them:


    ```

    make modules_install

    ```


    After kernel compilation is complete, additional steps are required to complete
    the installation. Some files need to be copied to the /boot directory.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Caution


    If the system has a separate /boot partition, the files copied below should go
    there. The easiest way to do that is to bind /boot on the host (outside chord)
    to /mnt/lfs/boot before proceeding. The root user in the host system:


    ```

    mount --bind /boot /mnt/lfs/boot

    ```


    The path to the kernel image may vary depending on the partition being used. The
    filename below can be changed to suit your taste, but the stem of the kernel file
    should be vmlinuz with the automatic setup of the boot process described in the
    next section. The following command assumes an x86 architecture:


    ```

    cp -iv arch/x86/boot/bzImage /boot/vmlinuz-5.2.8-lfs-9.0

    ```


    System.map is a symbol file for the kernel. It maps the entry points of every
    function in the kernel API, as well as the addresses of the kernel data structures
    for the running kernel. It is a resource when investigating kernel problems. Issue
    the following command to install the map file:


    ```

    cp -iv System.map /boot/System.map-5.2.8

    ```


    The configuration file .config produced by the make menuconfig step above contains
    all the configuration selections for the kernel that was just compiled. It is
    a good idea to keep this file for future reference:


    ```

    cp -iv .config /boot/config-5.2.8

    ```


    Install the documentation for the Linux kernel:


    ```

    install -d /usr/share/doc/linux-5.2.8

    cp -r Documentation/* /usr/share/doc/linux-5.2.8

    ```


    It is important to note that the files in the kernel source directory are not
    owned by root. Whenever a package is unpacked as root user (which we did inside
    root), the files have the user and group IDs of whatever they were on the packer''s
    computer. This is not a problem for any other package to be installed unless the
    source tree is removed after the installation. However, the Linux source tree
    is often retained for a long time. Because of this, there is a chance that whatever
    user ID the package used will be assigned to somebody on the machine. That person
    would then have access to the kernel source.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# # Warning


    The headers in the system''s `include` directory (`/usr/include`) should *always*
    be the ones against Glibc was compiled with, the sanitised headers in Section
    6.7, "Linux-5.2.8 API Headers". Therefore, they should *never* be replaced by
    either the kernel headers or any other kernel sanitized headers.


    # ## 8.3.2. Configuring Linux Module Load Order


    Most of time Linux modules are loaded automatically, but sometimes it needs some
    specific direction. The program that loads modules `modprobe` or `insmod`, uses
    `/etc/modprobe.d/usb.conf` for this purpose. This file needs to be created so
    that the USB drivers load in order; `ehci_hcd`, `ohci_hcd` and `uhci_hcd` have
    been built as modules, they will be loaded in the correct order; `ehci_hcd` needs
    to be loaded prior to `ohci_hcd` and `uhci_hcd` in order to avoid a warning appearing
    at boot.


    Create a new file `/etc/modprobe.d/usb.conf` by running the following:


    ```

    install -v -m755 -d /etc/modprobe.d

    cat > /etc/modprobe.d/usb.conf << "EOF"

    # Begin /etc/modprobe.d/usb.conf


    install ohci_hcd /sbin/modprobe ehci_hcd; /sbin/modprobe ohci_hcd; true

    install uhci_hcd /sbin/modprobe ehci_hcd; /sbin/modprobe -i uhci_hcd; true


    # End /etc/modprobe.d/usb.conf

    EOF

    ```


    # ## 8.3.3. Contents of Linux


    +   * Installed files: config-5.2.8, vmlinux-5.2.8-lfs-9.0, and System.map-5.2.8

    * Installed directories: /lib/modules,/usr/share/doc/linux-5.2.8


    # ## Short Descriptions


    +   * config-5.2.8: Contains all the configuration selections for the kernel

    * vmlinux-5.2.8-lfs-9.0: The engine of the Linux system. When turning on the computer,
    the kernel is the first part of the operating system that gets loaded. It detects
    and initializes all components of the computer''s hardware, then makes these components
    available as a tree of files to the software and runs a single CPU into a multitasking
    machine capable of running scores of programs seemingly at the same time


    +   * System.map-5.2.8: A list of addresses and symbols; it maps the entry points
    and addresses of all the functions and data structures in the kernel'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# 8.4. Using GRUB-v Set Up the Boot Process


    # 8.4.1. Introduction


    > Warning

    Configuring GRUB incorrectly can render your system inoperable without an alternate
    boot device such as a CD-ROM. This section is not required to boot off your LFS
    system. You may just want to modify your current boot loader, e.g. Grub-Legacy,
    GRUB2, or LILO.


    Ensure an emergency boot disk is ready to "rescue" if the computer becomes unusable
    (un-bootable). If you do not have a boot device, you can create one. In order
    for the procedure to work below, you need to jump ahead to BLFS and install xorriso
    from the libosurn package.


    ```

    cd /tmp

    gub-mkresrescue --output=grub-img.iso

    xorriso -as cdrecord -v dev=/dev/cdrom blank=as_needed grub-img.iso

    ```


    > To LFS on systems that have UEFI enabled, the kernel needs to have been built
    with the CONFIG_EFI_STUB capability described in the previous section. However,
    LFS can be booted using GRUB without it turned off. With this addition, the UEFI
    Mode and Secure Boot capabilities in the system''s BIOS need to be found. For
    details, see the lfs-uefi.txt hint at http://www.linuxfromscratch.org/hints/downloads/lfs-uefi.txt.


    # 8.4.2. GRUB Naming Conventions


    GRUB uses its own naming structure for devices and partitions in the form of (hdn,m)
    where n is the hard drive number and m is the partition number. The hard drive
    starts from zero, but the partition number starts from one for normal partitions
    and five for extended partitions. This is different from earlier versions where
    numbers started from zero. For example, partition sda1 is (hd0,1) and sdb2 is
    (hd1,2). In contrast, GRUB does not consider CD-ROM drives to be hard drives.
    For example, if using a CD on hdb and a second hard drive on hdc, that second
    hard drive would be (hd1).


    # 8.4.3. Setting Up the Configuration


    GRUB works by writing to the first track of the hard disk. This area is not part
    of any file system. The programs access GRUB modules in the boot partition. The
    default location is /boot/grub/.


    The location of the boot partition is a choice that affects the configuration.
    One recommendation is to use a separate small (suggested size is 100 MB) partition
    for boot information. By that way each, LFS or some commercial distro, can access
    the same boot files and be made from any booted system. If you choose to do this,
    you will need to mount the separate partition, move all files in the current /boot
    directory (e.g the linux kernel you have built in the previous section) to the
    new partition. You will then need to unmount the partition and remount it as /boot.


    Using the lfs partition will also work, but configuration for multiple systems
    is more difficult.


    Using the above information, determine the appropriate designator for the root
    partition (or boot partition, if a separate one is used). For the example, it
    is assumed that the root (or separate boot) partition is sda2.'
  merge: -1
  img_proc: true
- pgno: 273
  md: "Install the GRUB files into /boot/grub and set up the boot track:\n\n# Warning\n\
    \nThe following command will overwrite the current boot loader. Do not run the\
    \ command if this is not desired, for example, if you use a third party boot manager\
    \ to manage the Master Boot Record (MBR).\n\n```\ngrub-install /dev/sda\n```\n\
    \n# Note\n\nIf the system has been booted UEFI, grub-install will try to install\
    \ files for the x86_64 target, but those files have not been installed in chapter\
    \ 6. If this is the case, add --target i386-pc to the command introduction.\n\n\
    # 8.4.4. Creating the GRUB Configuration File\n\nGenerate /boot/grub/grub.cfg:\n\
    \n```\ncat > /boot/grub/grub.cfg << \"EOF\"\n# Begin /boot/grub/grub.cfg\nset\
    \ default=0\nset timeout=5\nismod ext2\nset root=(hd0,2)\nmenuentry \"GNU/Linux,\
    \ Linux 5.2.8-1fs-9.0\" {\n    linux /boot/vmlinuz-5.2.8-1fs-9.0 root=/dev/sda2\
    \ ro\n}\nEOF\n```\n\n# Note\n\nFrom GRUB’s perspective, the kernel files are relative\
    \ to the partition used. If you used a separate /boot partition, remove /boot\
    \ from the above linux line. You will also need to change the set root line to\
    \ point to the boot partition.\n\nGRUB is an extremely powerful tool and provides\
    \ a tremendous number of options for booting with a variety of devices, operating\
    \ systems, and partition types. There are also many options for customization\
    \ such as graphical splash, playing sounds, mouse input, etc. The details of these\
    \ options are beyond the scope of this introduction.\n\n# Caution\n\nThere is\
    \ a command, grub-mkconfig, that will write a configuration file automatically.\
    \ It uses a set of scripts in /etc/grub.d/ and will destroy any customizations\
    \ that you make. These scripts are designed primarily for non-source distributions\
    \ and are not recommended for LFS. If you install a custom Linux distribution,\
    \ there is a good chance that program will run. Be sure to back up your grub.cfg\
    \ file."
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Chapter 9. The End


    # 9.1. The End


    Well done! The new LFS system is installed! We wish you much success with your
    shiny new custom-built Linux system.


    It may be a good idea to create an /etc/lfs-release file. By having this file,
    it is very easy for you (and for us if you need to ask for help at some point)
    to find out which LFS version is installed on the system. Create this file by
    running:


    ```

    echo 9.0 > /etc/lfs-release

    ```


    It is also a good idea to create a file to show the status of your new system
    with respect to the Linux Standards Base (LSB). To create this file, run:


    ```

    cat > /etc/lsb-release << "EOF"

    DISTRIB_ID="Linux From Scratch"

    DISTRIB_RELEASE="9.0"

    DISTRIB_COENAME="< name here>

    DISTRIB_DESCRIPTION="Linux From Scratch"

    EOF

    ```


    Be sure to put some sort of customization for the field ''DISTRIB_COENAME'' to
    make the system uniquely yours.


    # 9.2. Get Counted


    Now that you have finished the book, do you want to be counted as an LFS user?
    Head over to http://www.linuxfromscratch.org/cgi-bin/lfscounter.php and register
    as an LFS user by entering your name and the first LFS version you have used.


    Let''s reboot into LFS.


    # 9.3. Rebooting the System


    Now that all of the software has been installed, it is time to reboot your computer.
    However, you should be aware of a few things. The system you have created in this
    book is quite minimal, and most likely will not have the functionality you would
    need to be able to continue. By installing a few extra packages from the BLFS
    book while still in your current environment, you can leave yourself in a much
    better position to continue once you reboot into your LFS system. Here are some
    suggestions:


    +   - A text mode browser using Lynx will allow you to easily view the BLFS book
    in one virtual terminal, while building packages in another.


    +   - The GPM package will allow you to perform copy/paste actions in your virtual
    terminals.


    +   - If you are in a situation where static IP configuration does not meet your
    networking requirements, installing a package such as dhcpcd or the client portion
    of dhcp may be useful.


    +   - Installing sudo may be useful for building packages as a non-root user and
    easily installing the resulting packages in your system.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'If you want to access your new system from a remote system within a comfortable
    GUI environment, install openssh.


    To make fetching files over the internet easier, install wget.


    If one or more of your disk drives have a GUID partition table (GPT), either gptdisk
    or parted will be useful.


    Finally, a review of the following configuration files is also appropriate at
    this point.


    +   - /etc/bashrc

    - /etc/dircolors

    - /etc/fstab

    - /etc/hosts

    - /etc/inputrc

    - /etc/profile

    - /etc/resolv.conf

    - /etc/vimrc

    - /root/.bash_profile

    - /root/.bashrc

    - /etc/sysconfig/ifconfig.eth0


    Now that we have said that, let''s move on to booting our shiny LFS installation
    for the first time! First exit from the chroot environment:


    # logout


    Then unmount the virtual file systems:


    ```

    umount -v $LFS/dev/pts

    umount -v $LFS/dev

    umount -v $LFS/run

    umount -v $LFS/proc

    umount -v $LFS/sys

    ```


    Unmount the LFS file system itself:


    ```

    umount -v $LFS/usr

    umount -v $LFS/home

    umount -v $LFS

    ```


    If multiple partitions were created, unmount the other partitions before unmounting
    the main one, like this:


    Now, reboot the system with:


    ```

    shutdown -r now

    ```


    Assuming the GRUB boot loader was set up as outlined earlier, the menu is set
    to boot LFS 9.0 automatically.


    When the reboot is complete, the LFS system is ready for use and more software
    may be added to your needs.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# # 9.4. What Now?


    Thank you for reading this LFS book. We hope that you have found this book helpful
    and have learned more about the system creation process.


    Now that the LFS system is installed, you may be wondering “What next?” To answer
    that question, we have compiled a list of resources for you.


    +   - Maintenance

    - Bugs and security notices are reported regularly for all software. If an LFS
    system is compiled from source, it is up to you to keep abreast of such reports.
    There are several online resources that track such reports, some which are shown
    below:

    - CERT (Computer Emergency Response Team)

    - CERT has a mailing list that publishes security alerts concerning various operating
    systems and applications. Subscription information is available at http://www.us-cert.gov/cas/signup.html.

    - Bugtrap

    - Bugtrap is a full-disclosure computer security mailing list. It publishes newly
    discovered security issues, and potentially fixes for them. Subscription information
    is available at http://www.securityfocus.com/

    - Beyond Linux From Scratch

    - The Linux From Scratch book covers installation procedures for a wide range
    of software beyond the scope of the LFS Book. The BLFS project is located at http://www.linuxfromscratch.org/blfs/

    - LFS Hints

    - The LFS Hints are a collection of educational documents submitted by volunteers
    in the LFS community. The hints are available at http://www.linuxfromscratch.org/hints/list.html.

    - Mailing lists

    - There are several LFS mailing lists you may subscribe to if you are in need
    of help, want to stay current with the latest developments, want to contribute
    to the project, and more. See Chapter 1 - Mailing Lists for more information.

    - The Linux Documentation Project

    - The goal of the Linux Documentation Project (TLDP) is to collaborate on all
    of the issues of Linux documentation. The TLDP features a large collection of
    HOWTOs, guides, and man pages. It is located at http://www.tldp.org/'
  merge: -1
  img_proc: true
