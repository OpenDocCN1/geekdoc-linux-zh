- pgno: 243
  md: '# 7.3. Overview of Device and Module Handling


    In Chapter 6, we installed the Udev package via eudev built. Before we go into
    the details regarding how this works, a brief history of previous methods of handling
    devices is in order.


    Linux systems in general traditionally used a static device creation method, whereby
    a great many device nodes were created under /dev (sometimes thousands of nodes),
    regardless of the corresponding hardware devices actually existed. This was typically
    done via a MAKEDEV script, which contains a number of calls to the knod program
    with the relevant major and minor device numbers for every possible device that
    might exist in the world.


    Using the Udev, only those devices which are detected by the kernel get device
    nodes created for them. Because these device nodes will be created each time the
    system boots, they will be stored on a dev.mps file system (a virtual file system
    that resides entirely in memory). Device nodes do not require much space, so the
    memory that used is negligible.


    # 7.3.1. History


    In February 2000, a new filesystem called devfs was merged into the 2.3.4 kernel
    and was made available during the 2.4 series of stable kernels. Although it was
    present in the kernel source itself, this method of creating devices dynamically
    never received overwhelming support from the core kernel developers.


    The main problem with the approach adopted by devfs was the way it handled device
    detection, connection, and naming. The latter issue, that of device node naming,
    was perhaps the most critical. It is generally accepted that if device names are
    allowed to be configurable, then the device naming policy should be up to a system
    administrator, not imposed by any particular developer(s). The devfs filesystem
    also suffered from race conditions that were inherent in its design and could
    not be fixed without a substantial revision to the kernel. It was deprecated for
    a long period – due to a lack of maintenance – and was finally removed from the
    kernel in June,2006.


    With the development of the unstable 2.5 kernel tree, later released as the 2.6
    series of stable kernels, a new filesystem called sysfs came to be. The job of
    sysfs is to export the view of the system''s hardware configuration to userspace
    processes. With this userspace-visible representation, the possibility of developing
    a userspace replacement for devfs became much more realistic.


    # 7.3.2. Udev Implementation


    # 7.3.2.1. Sysfs


    # 7.3.2.2. Device Node Creation


    Device files are created by the kernel by the devmps filesystem. Any driver that
    wishes to register a device node will go through the devmps (via the device core)
    to do it. A devmps instance is mounted on /dev, the device node will initially
    be created with a fixed name, permissions, and other.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Linux From Scratch - Version 9.0


    A short time later, the kernel will send an event to udev. Based on the rules
    specified in the files within the /etc/udev/rules.d, /lib/udev/rules.d, and /run/udev/rules.d
    directories, udev will create symlinks to the device node, or change its permissions,
    owner, or group, or modify the udev database entry (name) for that.


    The rules in these directories are numbered and all three directories are merged
    together. If udev can''t find a rule for the device it is creating, it will leave
    the permissions and ownership at whatever devtmpfs used initially.


    # 7.3.2. Module Loading


    Device drivers as modules may have aliases built into them. Aliases are usually
    related to the output of the bus-specific identifiers of devices supported by
    a module. For example, the snd-pcm801 driver supports PCI devices with vendor
    ID 0x1319 and device ID 0x0801, and has an alias of :pci:v0001319d00000801*=snd-pcm*.
    For most devices, the bus driver exports the aliases of the driver which would
    handle the device sysfs. E.g., /sys/bus/pci/devices/0000:00:1d.0/modalias file
    might contain the string "pci:v0001319d00000801s00001319d000001bc4c000*. The default
    rules provided by Udev will call udev to /sbin/modprobe with the contents of the
    MODALIAS environment variable for loading all modules whose aliases match this
    string after wildcard expansion.


    In this example, that in addition to snd-pcm801, the obsolete (and unwanted) fororte
    driver will be loaded if it is available. See below for ways in which the unloading
    of unwanted drivers can be prevented.


    The kernel is also able to load network protocols, filesystems and NLS support
    on demand.


    # 7.3.4. Handling Hotpluggable/Dynamic Devices


    When you plug in a device, such as a Universal Bus (USB) MP3 player, the kernel
    recognizes the device is now connected and generates a uevent. This is then handled
    by udev as described.


    # 7.3.3. Problems with Loading Modules and Creating Devices


    There are a few possible problems when it comes to automatically creating device
    nodes.


    # 7.3.3.1. A kernel module is not automatically loaded


    Udev will only load a module if it has a bus-specific alias and the bus driver
    exports the necessary aliases to sysfs. In other cases, no other module loading
    by will occur. With Linux-5.2.8, Udev is known to load well-written drivers for
    INPUT, PCI, USB, SCSI, SERIO, and FireWire.


    To determine if the device you requires the necessary support for Udev, run modinfo
    with the module name as you row and check whether there is a modalias file.


    If no modalias exists in sysfs, the driver supports the device and can talk to
    it directly, but doesn''t have the alias, it is a bug. Load the driver without
    help from Udev and expect the issue to be fixed.


    If there is no modalias file in the relevant directory under /sys/bus/, this means
    that the kernel developers have not added modalias to this bus type. With Linux-5.2.8,
    this is the case with ISA busses. Expect this issue to be fixed in later kernel
    versions.


    Udev is not intended to load “wrapper” drivers such as snd-pcm-oss and non-hardware
    drivers as loop at all.


    227'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# 7.3.3.2. A kernel module is not loaded automatically, and Udev is not intended
    to load it


    If the “wrapper” only enhances the functionality provided by some other module
    (e.g., snd-pcm oss enhances the functionality of snd-pcm by making the sound cards
    available to OS applications), configure modprobe to load the wrapper after Udev
    loads the wrapped module. To do this, add a “softdep” to the corresponding /etc/modprobe/<filename>.conf
    file. For example:


    ```

    softdep snd-pcm post: snd-pcm-oss

    ```


    Note that the “softdep” command also allows pre: dependencies, or a mixture of
    both pre and post:. See the modprobe.d (5) manual page for more information on
    “softdep” syntax and capabilities.


    If the module in question is not a wrapper and is useful by itself, configure
    the modules bootscript on your system. To do this, add the module to the /etc/sysconfig/modules
    file on a separate line. This works for modules too, but is suboptimal in that
    case.


    # 7.3.3.3. Udev loads some unwanted module


    Either do not build the module, or blacklist it in a /etc/modprobe.d/blacklist.conf
    file as done with the forte module in the example below:


    ```

    blacklist forte

    ```


    Blacklisted modules can still be loaded manually with the explicit modprobe command.


    # 7.3.3.4. Udev creates a device incorrectly, or makes a wrong symlink


    This usually happens if a rule unexpectedly matches a device. For example, a poorly-written
    rule can match both a SCSI device (as desired) and the corresponding SCSI generic
    device (incorrectly) by vendor. Finding the rule and making it more specific,
    with the help of the udevadm info.


    # 7.3.3.5. Udev creates rules unnecessarily


    This may be another manifestation of the previous problem. If not, and your rule
    uses sysfs attributes, it may be the kernel timing, to be fixed in later kernels.
    For now, you can work around it by creating a rule that waits for the used sysfs
    attributes and appending it to the /etc/udev/rules.d/10-wait_for_sysfs.rules file
    (create this file if it does not exist). Please notify the LDS Development list
    if you do so and it.


    # 7.3.3.6. Udev does not create a device


    Further text shows that the device is built statically into the kernel or loaded
    as a module, and that you have already checked that Udev doesn''t create a misnamed
    device.


    Udev has no information to create a device if a kernel driver does not export
    its attributes to sysfs. This is most common with third party drivers from outside
    the kernel. Create a static device node in /lib/udev/devices with the appropriate
    major/minor numbers (see file devices.txt inside the kernel documentation or the
    documentation provided by the third party driver vendor). The static device node
    will be copied to /dev by udev.


    # 7.3.3.7. Device naming changes randomly after rebooting


    This is due to the fact that Udev, by design, handles events and loads modules
    in parallel, and thus in an unpredictable order. This will never be “fixed”. You
    should not rely the kernel device name being stable. Instead, create your own
    rules that make symlinks with stable names based on stable attributes of the device,
    such as a serial number or the output of variety *id attributes installed by Udev.
    See Section 7.4, “Managing Devices” and Section 7.5, “General Network Configuration”
    for examples.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# 7.3.4. Useful Reading


    Additional helpful documentation is available at the following sites:


    +   - A Userspace Implementation of devfs http://www.chroah.com/linux/talks/ols_2003_udev_paper/Reprint-Koah-Harman-OLS2003.pdf

    - The sysfs filesystem at http://kernel.org/pub/linux/kernel/people/doc/papers/ols-2005/moche.pdf


    # 7.4. Managing Devices


    # 7.4.1. Network Devices


    Udev, by default, names network devices according to Firmware/BIOS data or physical
    characteristics the bus, slot, or MAC address. The purpose of this naming convention
    is to ensure that network devices are named consistently and not based on the
    time the network card was discovered. For example, a computer having two network
    cards made by Intel and Realtek, the network card manufactured by Intel may become
    eth0 and the Realtek card become eth1. In some cases, after a reboot the cards
    get renamed the other way around.


    In the new scheme, typical network device names would be something like enps0
    or wlp3s0. If this naming convention is not desired, the traditional naming scheme
    or a custom scheme can be implemented.


    # 7.4.1.1. Disabling Persistent Naming on the lines Command Line


    The traditional naming scheme using eth0, eth1, can be restored by using net.ifnames=0
    on the kernel command line. This is most appropriate for systems that have only
    one device for the system. Laptops often have multiple ethernet connections that
    are named eth0 and wlan0 are also candidates for this method. The command line
    is passed in the GRUB configuration file. See Section 8.4.4, "Creating the GRUB
    Configuration"


    # 7.4.1.2. Creating Udev Rules


    The naming scheme can be customized by creating Udev rules. A script has been
    included that generates the initial rules. Generate these rules by running:


    ```

    bash /lib/udev/init-persistent-rules.sh

    ```


    Now, inspect the /etc/udev/rules.d/70-persistent-net.rules file, to find out which
    name was assigned to which network device:


    ```

    cat /etc/udev/rules.d/70-persistent-net.rules

    ```


    > In cases such as when MAC addresses have been assigned to a network card manually
    or in a virtual environment like Qemu or Xen, the network rules file may not have
    been generated because addresses are not consistently assigned. In these cases,
    this method cannot be used.


    The file begins with a comment block followed by lines for each NIC. The line
    for each NIC is a comment showing its hardware IDs (e.g. its PCI vendor and device
    IDs, if it''s a PCI card), along with its driver in parentheses, if the driver
    can refer. Neither the hardware ID nor the driver is used to determine name to
    give an interface; this information is only for reference. The second line is
    the Udev rule that matches this NIC and assigns it a name.


    All Udev rules are made up of several keys, separated by commas and optional whitespace.
    This rule''s keys and explanation of each of them are as follows:'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'SUBSYSTEM="net" - This tells Udev to ignore devices that are not network cards.


    +   - ACTION="add" - This tells Udev to ignore this rule for a uvent that isn''t
    an add (''remove'' and ''change'') events also, but don''t need to rename interfaces.


    +   - DRIVERS="*" - This exists so Udev will ignore VLAN or bridge sub-interfaces
    (because sub-interfaces do not have drivers). These sub-interfaces are skipped
    because the name that would be assigned would collide with the parent devices.


    +   - ATTR{address} - The value of this key is the NIC''s MAC address.


    +   - ATTR{type="*" - This ensures the rule only matches the primary interface
    in the case of wireless devices, which create multiple interfaces. The secondary
    interfaces are skipped for the same reason that VLAN and bridge sub-interfaces
    are skipped: there would be a name collision otherwise.


    +   - NAME - The value of this key is the name Udev will assign to this interface.


    The value of NAME is the important part. Make sure you know which name has been
    assigned to your network cards before proceeding, and be sure to use NAME when
    generating your configuration files below.


    # 74.2. CD-ROM symlinks


    Some software that you may want to install (e.g., various media players) expect
    the /dev/cdrom and /dev/dvd symlinks to exist, and point to a CD-ROM or DVD-ROM
    device. Also, it may be convenient to refer to these symlinks into /etc/stab.
    Udev comes with a script that will generate rules to follow these symlinks for
    you, depending on the capabilities of each device, and you will need to decide
    which modes of operation you wish to have the script use.


    The first can operate in "by-path" mode (used by default for USB and FireWire
    devices), where the rules depend on the physical path of the CD or DVD device.
    Second, it can in "by-id" mode (default for IDE and SCSI devices), where the rules
    depend on identification strings stored in the CD or DVD device itself. The path
    is determined by Udev''s path_id script, and the identification strings are read
    from the hardware by its at_id or scsi_id programs, depending on which type of
    device you use.


    There are advantages to each approach; the correct approach to use will depend
    on what kind of devices changes may happen. If you expect the physical path to
    the drive (that is, the ports and/slots that it plugs into) to change, for example
    you may plan on moving the drive to a different IDE port or a different USB connector,
    then you use the "by-id" mode. On the other hand, if you expect the device''s
    identification to change, for example you may replace it with a different device
    with the same capabilities and which is plugged into the system connectors, then
    you use the "by-path" mode.


    If either type is possible with your drive, choose a mode based on the type of
    device you expect to happen more often.


    > Important

    External devices (for example, a USB-connected CD drive) should not use by-path
    persistence, because each time the device is plugged into a new external port,
    its physical path will change. All-connected devices will have this problem if
    you write Udev rules to recognize by their physical path; the problem is not limited
    to CD and DVD drives.


    If you wish to see the values that Udev scripts will use, for the appropriate
    CD-ROM device, the corresponding directory under /sys (e.g., this can be /sys/block/hdd)
    and run a command similar to the following:


    ```

    udevadm test /sys/block/hdd

    ```'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Look at the lines containing the output of various *_id programs. The "by-id"
    mode will use the ID_SERIAL if it exists and is not empty, otherwise will use
    a combination of ID_MODEL and ID_REVISION. The "by-path" mode will use the ID_PATH
    value.


    If the default mode is not suitable for your situation, then the following modification
    can be made to the /etc/udev/rules.d/83-cdrom-symlinks.rules file, as follows
    (where mode is one of "by-id" or "by-path"):


    ```

    sed -i ''s/write_cd_rules\/write_cd_rules mode/'' \

    /etc/udev/rules.83-cdrom-symlinks.rules

    ```


    Note that it is not necessary to create the rules files or links at this time,
    because you have bound-mount the host''s /dev directory into the Linux system,
    and we use the symlinks on the host. The rules and symlinks will be created the
    first time you boot your LFS system.


    However if you have multiple CD-ROM devices, the symlinks generated at that time
    may point to different devices than they point to your host, because devices are
    not discovered in a predictable order. The assignments created when you boot the
    LFS system will be stable, so this is only an issue if you use the symlinks on
    both systems to the same device. If you need that, then inspect (and possibly
    edit) the generated /etc/udev/rules.70-persistent-cd.rules file after booting,


    # # 7.4.3. Dealing with duplicate devices


    As explained in Section 7.3, "Overview of Device and Module Handling", the order
    in which devices with the same function appear in /dev is essentially random.
    E.g., if you have a USB camera and a TV tuner, sometimes /video0 refers to the
    camera and /video1 refers to the tuner, and sometimes after a reboot the order
    changes to the opposite one. For all classes of hardware except sound cards and
    network cards, this is fixable by creating udev rules for custom persistent names.
    The case of network cards is covered separately in Section 7.5, "General Network
    Configuration", and sound card configuration can be found in BLFS.


    For each of your devices that is likely to have this problem (even if the problem
    doesn''t exist in your current Linux distribution), finding the corresponding
    directory under /sys/class or /sys/block. For video devices, this may be /sys/class/video4linux/videoX.
    Figure out the attributes that identify the device uniquely (usually, vendor product
    IDs and/or serial numbers work):


    ```

    udev adm -a -p /sys/class/video4linux/video0

    ```


    Then quite will create the symlinks,


    ```

    # Persistent symlinks

    KERNEL="video*", ATTRS{idProduct}="1910", ATTRS{idVendor}="0d81", \

    SYMLINK+="webcam"

    KERNEL="video*", ATTRS{device}="0x036f", ATTRS{vendor}="0x109e", \

    SYMLINK+="tvtuner"


    EOF

    ```


    The result is that /dev/video0 and /dev/video1 will still refer to the tuner and
    the web camera (and should never be used directly), but there are symlinks /dev/dev/tvtuner
    and /dev/webcam that always point to the correct device.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 7.5. General Network Configuration


    # 7.5.1. Creating Network Interface Configuration Files


    Which interfaces are brought up and down by the network script usually depends
    on the files in /etc/sysconfig/. This directory should contain a file for each
    interface to be configured, as ifconfig.xyz, where "xyz" describes the network
    card. The interface name (e.g eth0) is usually appropriate. This file contains
    attributes to this interface, such as its IP address(es), subnet masks, and softs.
    It is necessary that the stem of the filename be ifconfig.


    > Note

    If the procedure in the previous section was not used, Udev will assign network
    interface names based on system physical characteristics as enp2s1. If you are
    not sure what your interface name is, you can run link or ls/class/net after you
    have booted your system.


    The following command creates a sample file for the eth0 device with a static
    IP address:


    ```

    cd /etc/sysconfig/

    cat > ifconfig.eth0 << "EOF"

    ONBOOT=yes

    INTERFACE=eth0

    SERVICE=ipv4-static

    IP=192.168.1.2

    GATEWAY=192.168.1.1

    PREFIX=24

    BROADCAST=192.168.1.255

    EOF

    ```


    The values in it must changed in file to match the proper setup.


    If the ONBOOT variable is set to "yes" the System V network script will bring
    up the Network Interface Card (NIC) during booting of the system. If to set anything
    to "yes" the NIC will be ignored by the network script and not be automatically
    brought up. The interface can be manually started or stopped with the ifup and
    ifdown commands.


    The IFACE variable defines the interface name, for example, eth0. It is required
    for all device configuration files. The filename extension must match this value.

    FS-Bootscripts package has a modular IP assignment format, creating additional
    files in the /lib/services/ directory allows other IP assignment methods. This
    is commonly used for Dynamic Host Protocol (DHCP), which is addressed in the BLFS
    books.


    The GATEWAY variable should contain the default gateway IP address, if one is
    present. If not, then comment out the PREFIX variable.

    The PREFIX variable contains the number of bits used in the subnet. Each octet
    in an IP address is 8 bits. If the subnet mask is 255.255.255.250, it is using
    the first 27 bits (24 bits to specify the network number. If the network is 255.255.255.240,
    it would be using the first 28 bits. Prefixes longer than 24 bits are commonly
    used by DSL and cable-based Internet Service Providers (ISPs). In this example
    (PREFIX=24), the netmask is 255.255.255.0. Adjust the PREFIX variable according
    to your specific subnet. If omitted, the PREFIX defaults to 24.


    For more information see the ifup page.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# 7.5.2. Creating the /etc/resolv.conf File


    The system will need some means of obtaining Domain Name Service (DNS) name resolution
    to resolve Internet names to addresses, and vice versa. This is best achieved
    by placing the IP address of the DNS server, available from the ISP or network
    administrator, into `/etc/resolv.conf`. Create the file by running the following:


    ```

    cat /etc/resolv.conf << "EOF"

    # Begin /etc/resolv.conf


    domain <Your Domain Name>

    nameserver <IP address of your primary nameserver>

    nameserver <IP address of your secondary nameserver>


    # End /etc/resolv.conf

    EOF

    ```


    The domain statement can be omitted or replaced with a search statement. See the
    man page for /resolv.conf for more details.


    Replace `IP address of the nameserver` with the IP address of the DNS most appropriate
    for the setup. There will be more than one entry (requirements demand secondary
    servers for fallback capability). If you only want one DNS server, remove the
    second *nameserver* line from the file. The IP address may also be a router on
    the local network.


    > **Note**nThe Google Public IPv4 DNS addresses are 8.8.8.8 and 8.8.4.4.


    # 7.5.3. Configuring the system hostname


    During the boot process, the file `/etc/hostname` is used for establishing the
    system''s hostname. Create the `/etc/hostname` file and enter a hostname by running:


    ```

    echo "<lfs>" > /etc/hostname

    ```


    <lfs> needs to be replaced with the name given to the computer. Do not enter the
    Fully Qualified Domain Name (FQDN). That information is put in the `/etc/hosts`
    file.


    # 7.5.4. Customizing the /etc/hosts File


    Decide on the IP address, fully-qualified domain name (FQDN), and possible aliases
    for use in the `/etc/hosts` file. The syntax is:


    ```

    IP_address myhost.example.org aliases

    ```


    Unless the computer is to be visible to the Internet (i.e., there is a registered
    domain and a valid block of assigned IP addresses—most users do not have this),
    make sure that the IP address is in the private network address range. Valid ranges
    are:


    | Private Network Address Range | Normal Prefix |

    | 10.0.0.1 | 8 |

    | 172.x.0.1 - 172.x.255.254 | 16 |

    | 192.168.y.1 - 192.168.y.254 | 24 |'
