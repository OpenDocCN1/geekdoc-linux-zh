- pgno: 240
  md: '# Chapter 7. System Configuration


    # 7.1. Introduction


    Booting a Linux system involves several tasks. The process must mount virtual
    and real file systems, initialize devices, activate swap, check file systems for
    integrity, mount any partitions or files, set the system clock, boot up networking,
    start any daemons required by the system, and accomplish any other custom tasks
    needed by the user.

    This process must be organized to ensure the tasks are performed in the correct
    order, but at the same time, executed as fast as possible.


    # 7.1.1. System V


    System V is the classic boot process that has been used in Unix and Unix-like
    systems such as Linux since about 1983.

    It consists of a small program, **init**, that sets up basic tasks such as **login**
    (via getty) and runs a script. This script, usually named **rc**, controls the
    execution of a set of additional scripts that performs the tasks required to initialize
    the system.


    The **init** program is controlled by the `/etc/inittab` file and is organized
    into run levels that can be run by the user:


    ```

    0 — halt

    1 — Single user mode

    2 — Multiuser, without networking

    3 — Full multiuser mode

    4 — User definable

    5 — Full multiuser mode with display manager

    6 — reboot

    ```


    The usual default run level is 3 or 5.


    # Advantages


    +   • Established, well understood system.

    • Easy to customize.


    # Disadvantages


    +   • Slower to boot. A medium speed base LFS system takes 8-12 seconds where
    the boot time is measured from the kernel message to the login prompt. Network
    connectivity is typically established about 2 seconds after the login prompt.

    • Serial processing of boot tasks. This is related to the previous point. A delay
    in any process such as a file system check, will delay the entire boot process.

    • Does not directly support advanced features like control groups (cgroups), and
    per-user fair share scheduling.

    • Adding scripts requires manual, static sequencing decisions.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 7.2. LFS-Bootstraps-20190524


    The LFS-Bootstraps package contains a set of scripts to start/stop the LFS system
    at bootup/shutdown. The configuration files and procedures needed to customize
    the boot process are described in the following sections.


    Approximate build time: less than 0.1 SBU

    Required disk space: 244 KB


    # 7.2.1. Installation of LFS-Bootstraps


    Install the package:


    ```

    make install

    ```


    # 7.2.2. Contents of LFS-Bootstraps


    Installed scripts:


    checkfs, cleansfs, console, functions, halt, ifdown, ifup, localnet, modules,
    mountfs, network, reboot, sendsignal, setclock, ipv4-static, swatic, syslog, system,
    template, update, and dev_retry


    Installed directories:


    /etc/rc.d, /etc/init.d (symbolic link), /etc/sysconfig, /lib/services, /lib/lsb
    (symbolic link)


    # Short Descriptions


    +   checkfs: Checks the integrity of the files systems before they are mounted
    (with the exception of journal and network based file systems)


    +   cleansfs: Removes files that should not be preserved after reboots, such as
    those in /var/run/ and /var/lock/; re-creates /var/utmp and removes the possibly
    present /etc/nologin, /fastboot, and /forcefsck files


    +   console: Loads the correct keymap for the desired keyboard layout; it also
    sets the screen font


    +   functions: Contains common functions, as error and status checking, that are
    used by several bootstraps


    +   halt: Halts the system


    +   ifdown: Stops a network device


    +   ifup: Initializes a network device


    +   localnet: Sets up the system''s hostname and local loopback device


    +   modules: Loads kernel modules in /etc/sysconfig/modules, using arguments that
    are also given there


    +   mountfs: Mount all file systems, except ones that are marked noauto or are
    network based


    +   mountvirtfs: Mount virtual kernel file systems, such as proc


    +   network: Sets up network interfaces, such as network cards, and sets up the
    default gateway (where applicable)


    +   rc: The master run-level control script; it is responsible for running all
    the other bootstraps one-by-one, in a sequence determined by the name of the system
    being linked


    +   reboot: Boots the system


    +   sendsignal: Makes every process is terminated before the system reboots or
    halts


    +   setclock: Resets the kernel clock to local time in case the hardware clock
    is not set to UTC time'
