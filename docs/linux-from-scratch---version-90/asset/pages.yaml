  md: '# 5.12. Expect-5.45.4


    The Expect package contains a program for carrying out scripted dialogues with
    other interactive programs.

    Approximate build time: 0.1 SBU

    Required disk space: 4.0 MB


    # 5.12.1. Installation of Expect


    First, force Expect''s script to use /bin/stty instead of a /usr/local/bin/stty
    it may find on the host system. This ensures that our test suite remains sane
    for the final builds of our toolchain:


    ```

    cp -v configure{}, .orig

    sed ''s:/usr/local/bin:bin:'' configure.orig > configure

    ```


    Now prepare for compilation:


    ```

    ./configure --prefix=/tools \

    --with-tcl=/tools/lib \

    --with-tclinclude=/tools/include

    ```


    The meaning of the configure options:


    ```

    --with-tcl=/tools/lib

    --with-tclinclude=/tools/include

    ```


    This ensures the configure script finds Tcl installation in the temporary tools
    location instead of possibly locating an one on the host system.

    This explicitly tells Expect where to find Tcl''s internal headers. Using this
    option avoids conditions where configure fails because it cannot automatically
    discover the location of Tcl''s headers.


    Build the package:


    ```

    make

    ```


    Compilation is now complete. As discussed earlier, running the test suite is not
    mandatory for the temporary tools here in this chapter. To run the Expect test
    suite anyway, issue the following command:


    ```

    make test

    ```


    Note that the Expect test suite is known to experience failures under certain
    hot conditions that are not within our control. Therefore, test failures are not
    surprising and are not considered critical.


    Install the package:


    ```

    make SCRIPTS="" install

    ```


    The meaning of the make parameter:


    ```

    SCRIPTS=""

    ```


    This prevents installation of the supplementary Expect scripts, which are not
    needed.


    # 5.12.2. Contents of Expect


    Installed program: expect

    Installed library: libexpect-5.45.so'
