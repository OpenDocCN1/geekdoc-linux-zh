- pgno: 63
  md: '# 5.9. Binutils-2.32 - Pass 2


    The Binutils package contains a linker, an assembler, and other tools for handling
    object files.

    Approximate build time: 1.1 SBU

    Required disk space: 879 MB


    # 5.9.1. Installation of Binutils


    Create a separate build directory again:


    ```

    mkdir -v build

    cd build

    ```


    Prepare Binutils for compilation:


    ```

    CC=$LSFS_TGT-gcc

    AR=$LSFS_TGT-ar

    RANLIB=$LSFS_TGT-ranlib

    ../configure

    --prefix=/tools

    --disable-nls

    --disable-error

    --with-lib-path=/tools/lib

    --with-sysroot

    ```


    The meaning of new configure options:

    CC=$LSFS_TGT-gcc AR=$LSFS_TGT-ar RANLIB=$LSFS_TGT-ranlib


    Because this is a valid reason for Binutils, setting these variables ensures that
    the build system uses the cross-compiler and assembled tools instead of the ones
    on the host system.

    --with-lib-path=/tools

    tells this configure script specify the library search path during the compilation
    of Binutils, resulting in /tools/lib being passed to the linker. This prevents
    the linker from searching through library directories on the host.

    --with-sysroot

    tys sysroot feature enables the linker to find shared objects which are required
    by other shared objects explicitly included in the linker''s command line. Without
    this, some packages may not build successfully on some hosts.


    Compile the package:


    ```

    make

    ```


    Install the package:


    ```

    make install

    ```


    Now prepare the linker for the “Re-adjusting” phase in the next chapter:


    ```

    make -C ld clean

    make -C ld LIB_PATH=/usr/lib:/lib

    cp -v ld/ld-new /tools/bin

    ```'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# The meaning of the make parameters:


    -C ld clean


    This tells the make program to remove all compiled files in the ld subdirectory.


    -C ld LIB_PATH=/usr/lib:/lib


    This option rebuilds everything in the ld subdirectory. Specifying the LIB_PATH
    Makefile variable on the command line allows us to override the default value
    of the temporary tools and point it to the proper final path. The value of this
    variable specifies the linker''s default library search path. This preparation
    is used in the next chapter.


    Details on this package are located in Section 6.16.2, “Contents of Binutils.”'
