  md: '# Linux From Scratch - Version 9.0


    Fix some of the permissions so that the non-root user can compile and run the
    tests:


    ```

    chown -Rv nobody

    ```


    Now run the tests. Make sure the PATH in the su environment includes /tools/bin.


    ```

    su nobody -s /bin/bash \

    -c "PATH=$$PATH make RUN_EXPENSIVE_TESTS=yes check"

    ```


    The test program-getinfo is known to fail in a partially built system like the
    chroot environment here, but passes if run at the end of this chapter. The test
    tty.sh is also known to fail.


    Remove the temporary directory:


    ```

    sed -i ''/dummy/d'' /etc/group

    ```


    Install the package:


    ```

    make install

    ```


    Move programs to the locations specified by the FHS:


    ```

    mv -v /usr/bin/{cat,chgrp,chmod,chown,cp,date,dd,df,df,echo} /bin

    mv -v /usr/bin/{false,ln,ls,mkdir,nod,mv,pwd} /bin

    mv -v /usr/bin/{md5,stty,sync,true,uname} /bin

    mv -v /usr/bin/chroot /usr

    mv -v /usr/share/man/man1/chroot.1 /usr/share/man/man8/chroot.8

    sed -i "/1\/"8\/"

    ```


    Some of the scripts in the LFS-Bootscripts package depend on head, nice, sleep,
    and touch. As /usr may not be available during the early and late stages of booting,
    these binaries need to be on the root partition to maintain FHS compliance:


    ```

    mv -v /usr/bin/{head,nice,sleep,touch} /bin

    ```


