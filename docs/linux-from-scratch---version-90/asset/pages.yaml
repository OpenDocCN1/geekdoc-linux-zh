- pgno: 136
  md: 'One set of tests in the GCC suite is known to exhaust the stack, so increase
    the stack size prior to running the tests:


    ```

    ulimit -s 32768

    ```


    Test the results as a non-privileged user, but do not stop at errors:


    ```

    chown -Rv nobody .

    su nobody -s /bin/bash -c "PATH=$PATH make -k check"

    ```


    To receive a summary of the test results, run:


    ```

    ../contrib/test_summary

    ```


    For only summaries, pipe the output through grep -A7 Summ.

    Results can be compared with those located at http://www.linuxfromscratch.org/lfs/build-logs/9.0/
    and https://gcc.gnu/org/ml/gcc-testresults.

    Six lists related to get-time are known to fail. These are apparently related
    to the en_HK locale.

    Two named lookup.cc and reverse.cc in experimental/ are not known to fail in LFS
    ch environment because they require /etc/hosts and iana-etc.

    Two named pr57193.c and pr90178.c are known to fail.

    A few unexpected failures cannot always be avoided. The GCC developers are usually
    aware of these issues, but have not resolved them yet. Unless the results are
    vastly different from those above the URL, it is safe to continue.


    Install the package and remove an unnecessary directory:


    ```

    make install

    rm -rf /usr/lib/gcc/$(gcc -dumpmachine)/9.2.0/include-fixed/bits/

    ```


    The GCC binary is owned by nobody now and the ownership of the installed header
    directory (and its content) will be incorrect. Change the ownership to root user
    and group:


    ```

    chown -v -R root:root \

    /usr/lib/gcc/*linux-gnu/9.2.0/include{,-fixed}

    ```


    Create a symlink you the FHS for "historical" reasons.


    ```

    ln -sv ..usr/bin/cpp /lib

    ```


    Many packages use the name gcc to call the C compiler. To satisfy those packages,
    create a symlink:


    ```

    ln -sv gcc /usr/bin/cc

    ```


    Add a compatibility symbol to enable building programs with Link Time Optimization
    (LTO):


    ```

    install -v -dm755 /usr/lib/bfd-plugins

    ln -sfv ../../libec/gcc/$(gcc -dumpmachine)/9.2.0/liblto_plugin.so \

    /usr/lib/bfd-plugins/

    ```'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Now that our final toolchain is in place, it is important to ensure that compiling
    and linking will work as expected.

    We do this by performing the same sanity checks as we did earlier in the chapter:


    ```

    echo ''int main()'' > dummy.c

    cc dummy.c -v -Wl,--verbose & dummy.log

    readelf -l a.out | grep '': /lib''

    ```


    There be no errors, and the output of the last command will be (allowing for platform-specific
    differences in dynamic linker):


    [Requesting program interpreter: /lib64/ld-linux-x86-64.so.2]


    Now make sure that we''re set up to use the correct starts:


    ```

    grep -o ''/usr/lib.*crt[1]. *succeeded'' dummy.log

    ```


    The output of the last command should be:


    ```

    /usr/lib/gcc/x86_64-pc-linux-gnu/9.2.0/.../lib/crt1 succeeded

    /usr/lib/gcc/x86_64-pc-linux-gnu/9.2.0/.../lib/crti succeeded

    /usr/lib/gcc/x86_64-pc-linux-gnu/9.2.0/.../lib/crt0 succeeded

    ```


    Depending on your architecture, the may may differ slightly, the difference usually
    being the name of the directory after /usr/lib/gcc. The important thing to look
    for is that gcc has all three crt*.o files under /usr/lib directory.


    Verify that the compiler is searching for the correct header files:


    ```

    grep -B4 ''^/usr/include'' dummy.log

    ```


    This command should return the following output:


    ```

    #include <...> search starts here:

    /usr/lib/gcc/x86_64-pc-linux-gnu/9.2.0/include

    /usr/local/include

    /usr/lib/gcc/x86_64-pc-linux-gnu/9.2.0/include-fixed

    /usr/include

    ```


    Again, note the directory named after your target triplet may be different than
    the above, depending on your architecture.


    Next, verify if the linker is being used with the correct search paths:


    ```

    grep ''SEARCH.*</usr/lib'' dummy.log | sed ''s| |\n|''

    ```


    References to paths that components with ''-linux-gnu'' should be ignored, but
    otherwise the output of the last command should be:


    ```

    SEARCH_DIR("/usr/x86_64-pc-linux-gnu/lib64")

    SEARCH_DIR("/usr/local/lib64")

    SEARCH_DIR("/usr/lib64")

    SEARCH_DIR("/usr/x86_64-pc-linux-gnu/lib")

    SEARCH_DIR("/usr/local/lib")

    SEARCH_DIR("/usr/lib")

    SEARCH_DIR("/usr/lib")

    ```'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Linux From Scratch - Version 9.0


    A 32-bit system may see a few different directories. For example, here is the
    output from an i686 machine:


    ```

    SEARCH_DIR("/usr/i686-pc-linux-gnu/lib32")

    SEARCH_DIR("/usr/local/lib32")

