    # # 6.20. Configuring Shadow


    This package contains utilities to add, modify, and delete users and groups; set
    and change their passwords; and perform other administrative tasks. For a full
    explanation of what password shadowing means, see the doc/HOWTO file within the
    unpacked source tree. If Shadow support, keep in mind that programs which need
    to verify passwords (display managers, FTP programs, pop3 daemons, etc.) must
    be Shadow-compliant. That is, they need to be able to work with shadowed passwords.


    To enable passwords, run the following command:


    ```

    pwconv

    ```


    To enable shadowed group passwords, run:


    ```

    grpconv

    ```


    Shadow''s configuration for the useradd utility has a few caveats that need explanation.
    The first default action for the useradd utility is to create the user and a group
    of the same name as the user. By default the user ID (UID) and group ID (GID)
    numbers will be 1000. This means if you don''t pass parameters to useradd, each
    user will be a member of unique group on the system. If this behavior is undesirable,
    you will need to pass the -g parameter to useradd. The default parameters are
    stored in the /etc/default/useradd file. You may need to modify two parameters
    in this file to suit your particular needs.


    /etc/default/useradd Parameter Explanations


    ```

    GROUP=1000

    ```


    This parameter sets the beginning of the numbers used in the /etc/group file.
    You can modify it however you desire. Note that useradd will never reuse a UID
    or GID. The number identified in this parameter is used, it will use the next
    available number after this. Note also if you don''t have a group of 1000 on your
    system the first time you use useradd without the -g parameter, you''ll get a
    message displayed on the terminal that: useradd: unknown GID 1000. You may disregard
    this and group number 1000.


    ```

    CREATE_MAIL_S=yes

    ```


    This parameter causes useradd to create a mailbox file for the newly created user.
    useradd will make the group ownership of this file to the mail group with 0660
    permissions. If you would prefer that these mailbox files are not created by useradd,
    use the following command:


    ```

    sed -i ''s/yes/no/'' /etc/default/useradd

    ```


    # # 6.20.3. Setting the root password


    Choose a password for root user and set it by running:


    ```

    passwd root

    ```


    115'
