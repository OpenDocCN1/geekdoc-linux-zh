- pgno: 59
  md: '# 5.7. Glibc-2.30


    The Glibc package contains the main C library. This library provides the basic
    routines for allocating memory, searching directories, opening and closing files,
    reading and writing files, string handling, pattern matching, arithmetic, and
    so on.


    Approximate build time: 4.8 SBU

    Required disk space: 896 MB


    # 5.7.1. Installation of Glibc


    The Glibc documentation recommends building Glibc in a dedicated build directory:


    ```

    mkdir -v build

    cd

    ```


    Next, prepare Glibc for compilation:


    ```

    ./configure

    --prefix=$LFS_TGT

    --host=$(../scripts/config.guess)

    --build=$(../scripts/config.guess)

    --enable-kernel=3.2

    --with-headers=/tools/include

    ```


    The meaning of the configure options:


    --host=$LFS_TGT, --build=$(../scripts/config.guess)

    The combined effect of these switches is that Glibc''s build system configures
    itself to cross-compile, using the cross-linker and cross-compiler in /tools.


    --enable-kernel=3.2

    Tells Glibc to compile the library with support for 3.2 and later Linux kernels.
    Workarounds for older kernels are not enabled.


    --with-headers=/tools/include

    Tells Glibc to compile itself after the headers installed to the tools directory,
    so that it knows exactly what features the kernel has and can optimize itself
    accordingly.


    During this stage the following warning may appear:


    ```

    configure: WARNING:

    *** These auxiliary programs are missing or

    *** incompatible versions: msgfmt

    *** some features will be disabled.

    *** Check the INSTALL file for required versions.

    ```


    The missing or incompatible msgfmt program is generally harmless. Most msgfmt
    program is part of the Gettext package which the host distribution should provide.


    > Note

    Have been reports that this package may fail when building as a "parallel make".
    If this occurs, rerun the command with a "-j1" option.'
  merge: -1
  img_proc: true
