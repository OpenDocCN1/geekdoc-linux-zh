  md: '# 6.20.4. Contents of Shadow


    Installed programs:


    chage, chfn, chpassword, chsh, expiry, faillog, gpassword, groupadd, groupdel,
    groupmems, groupdp, grpk, grpcv, grpunconv, lastlog, login, logout, newgidmap,
    newgrp, newuidmap, news, passwd, pw, pwcon, pwpasswd, sg (link to newgrp), su,
