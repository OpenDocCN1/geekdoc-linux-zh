    mv -v /usr/lib/readline/{readline,history}.so.* /lib\nchmod -u v /usr/lib/readline/{readline,history}.so.*\n\
    ln -sf ../ ..//lib/$$(readlink /usr/lib/libreadline.so) /usr/lib/libreadline.so\n\
    ln -sf ../lib/lib/$$(readlink /usr/lib/libhistory.so ) /usr/lib/libhistory.so\n\
