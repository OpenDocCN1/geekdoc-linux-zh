- pgno: 296
  md: 'it may not seem directly relevant to KDE, mouse maintenance makes your life
    easier, and it’s something that many people don’t know how to do (you’ll look
    like a genius at work). Here’s how to give your mouse a bath:


    +   1. **Turn the mouse facedown in your left hand.**

    +   If you’re a leftie, reverse the directions.

    +   2. **Turn the plastic ring around the trackball.**

    +   The ring usually turns about an eighth of the way and stops. Remove the ring
    after it is loose and place it on your desk.

    +   3. **Tip the trackball carefully out into your right hand and place the trackball
    on the desk.**

    +   This keeps the trackball safe and clean. Inside the trackball cavity, you
    see several small plastic rollers, probably covered with dust mats.

    +   4. **Dampen a cotton swab with some rubbing alcohol and clean the rollers
    carefully.**

    +   Get those dust mats out, as well as any other stray dust in the cavity. The
    dust is the cause of most malfunctioning mouses.

    +   5. **Replace the trackball and the ring, locking the ring into place.**

    +   Your mouse should now be working correctly, saving you the cost of buying
    a new one. (Unless, of course, you want a new one. In that case, ignore this entire
    procedure.)


    # Mouse behavior: A controlled study


    Now that your mouse is spiffy clean and rolling free, take a look at the software
    side of mouse maintenance and behavior. If you think you are stuck with the speed
    and configuration that shows up after you plug in your mouse, think again! KDE
    lets you set all those parameters to your individual taste, whether it’s screamingly
    fast or deliberately paced.


    To use the KDE mouse configuration tools, follow this procedure:


    +   1. **Choose Control Center→Input Devices→Mouse.**

    +   The Mouse screen appears, as shown in Figure 14-11.

    +   2. **Set the mouse acceleration speed with the Acceleration slider.**

    +   Acceleration is how fast the cursor on the screen moves, compared to how far
    you move the mouse physically. Some people prefer to make large gestures with
    the mouse, while others want hair-trigger response.

    +   3. **Set the mouse threshold with the Threshold slider.**

    +   Threshold is how far you have to move the mouse before the acceleration kicks
    in. Over small areas of the screen (such as a slider bar), acceleration is at
    a minimum in order to allow you to use the mouse for precise work.'
  merge: -1
  img_proc: true
