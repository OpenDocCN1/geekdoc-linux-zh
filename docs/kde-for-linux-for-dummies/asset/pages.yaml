  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_132_0.png)


    **Figure 6-6:** Pick your favorite screensaver.


    4. **Click the Setup button, adjust the settings in the dialog box that appears,
    and click the OK button to return to the Screensaver tab.**


    Each screensaver has a different dialog box that appears after you click the Setup
    button. The settings in the dialog box vary depending on what options are available
    for that screensaver. Typically, you can select how many objects are to appear
    on the screen and how fast they move. You may be able to specify colors or other
    settings. Some screensavers have no setup dialog boxes associated with them.


    5. **Type a number in the Wait for text box.**


    This setting controls how long KDE waits after your last keyboard or mouse input
    before engaging the screensaver.


    6. **If you want to require a password to disengage the screensaver, select the
    Require Password option and also the Show Password As Stars option.**


    If you do not engage in the Require Password option, any mouse movement or keyboard
    input disengages the screensaver and immediately returns your normal desktop to
    the screen. If you elect to use the password option, KDE displays a dialog box
    requesting your login password after you attempt to disengage the screensaver.
    You must enter the proper password before KDE will restore your desktop. This
    feature effectively denies unauthorized users access to your desktop while you''re
    away from your computer. The Show Password As Stars option masks your password
    from view as you enter it into the dialog box to deactivate the screensaver. If
    you use the password option, it makes sense to use the Show Password As Stars
    option as well.'
