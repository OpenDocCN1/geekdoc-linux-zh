- pgno: 385
  md: '# Installation Instructions


    To install KDE or the other software on this CD, you will need to mount the CD-ROM
    drive. The installation process for KDE itself is described in Appendix C. To
    install the programs on this disk, use the following process and the information
    in Appendix C as complementary references.


    # General installation from source code


    +   Insert the CD-ROM into your computer''s CD-ROM drive.

    +   Make sure you are logged in as root.

    +   As root, issue the command `mount -t iso9660 /dev/cdrom /mnt/cdrom`.

    +   Issue the command `mkdir /usr/src/KDE`.

    +   Issue the command `cp /mnt/cdrom/TGZ/* /usr/src/KDE`.

    +   Use the procedure in Appendix C to install the packages.


    # Installation from .rpm


    If your Linux distribution is either a Red Hat Linux distribution or uses the
    Red Hat _.rpm_ packaging standard, you may use this process instead of the source
    code process described above.


    +   Insert the CD-ROM into your computer''s CD-ROM drive.

    +   Make sure you are logged in as root.

    +   As root, issue the command `mount -t iso9660 /dev/cdrom /mnt/cdrom`.

    +   Issue the command `cd /mnt/cdrom/RPM`.

    +   Use the _.rpm_ procedure in Appendix C to install the packages.'
  merge: -1
  img_proc: true
