- pgno: 338
  md: '# Appendix A

    Getting and Installing KDE


    In This Appendix


    +   ❁ Getting the KDE software

    +   ❁ Finding the packages you need

    +   ❁ Installing KDE from a Red Hat RPM package

    +   ❁ Installing KDE from a Debian deb package

    +   ❁ Installing KDE from source code


    This book was written under the assumption that KDE is already installed on your
    computer. However, this may not be the case for all readers. Some Linux distributions,
    such as Corel, install KDE as the default interface, while others do not. Red
    Hat, an extremely popular distribution, uses a different desktop system called
    GNOME. Other distributions install some variant of the basic X Windows System
    and use a window manager such as AfterStep or fvwm. Still other distributions
    install no windowing system at all.


    In any case, you need to install KDE before you can use it. Fortunately, this
    is not very difficult. After all, you already installed Linux! Compared to that,
    installing KDE is a piece of cake.


    # Getting the Software


    Obviously, you need to have the software in order to install it. The very easiest
    way to do that is to use the CD-ROM that came with this book; it contains both
    Red Hat RPM packages and the basic source code packages for KDE and its ancillary
    programs.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_338_0.png)


    Although you see distribution-specific packaging like the Red Hat RPM or the Debian
    deb in many file archives, you aren''t limited to Red Hat or Debian to use the
    software. Make sure that you download the source code version instead of a specific
    package if you run a different distribution. Source code can be identified by
    the file extensions .tgz or .tar.gz. Distribution-specific packaging makes life
    a little easier for folks running those distributions, but rest assured that you
    can always install from source code. We tell you how in this appendix.'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'If, for some reason, you don''t have the CD that accompanied this book or you''d
    like to install a later version of KDE (the CD contains KDE 1.1.2), you need to
    start searching. Your Linux distribution is a good place to start. If you installed
    Linux from a CD-ROM, look at the package listings and see if the KDE packages
    you need are listed there. If not, fire up your Web browser.


    The most obvious place to look on the Web is the home site of the KDE project:
    www. kde. org. From the main page, click Download. You are asked to select the
    mirror site that is geographically closest to you. (The KDE Web site and FTP archives
    get so much traffic that in order to lighten the load, there are site mirrors
    all over the world. The mirror sites have the exact same content as the main KDE
    site; you''re not missing anything by downloading software from a kde.org mirror.
    In fact, you''re probably speeding your download quite a bit.)


    When you''ve connected to the site, you see a file directory. This is the top
    level of the KDE FTP archive, and it''s shown in Figure A-1. Use the following
    procedure to download the required packages and any optional packages you want
    to install at the same time.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_339_0.png)'
  merge: -1
  img_proc: true
- pgno: 340
