- pgno: 151
  md: 'download the theme with a couple of mouse clicks. The Themes.org Web site supports
    themes for all the major X Window window managers. The KDE themes are located
    at http://kde.themes.org.


    For your convenience, the CD that accompanies this book includes copies of many
    of the most popular themes from Themes.org. You can save yourself some download
    time by copying the theme files from the CD and adding them to your system. But
    don’t forget to visit the Themes.org Web site to check out the new and updated
    themes that are available there.


    # # Giving KDE a Familiar Face


    Thanks to the versatility of the KDE user interface and the power of themes, you
    can easily give your desktop a makeover that emulates much of the look and feel
    of other popular operating systems and user interfaces. In fact, many users find
    that configuring KDE to mimic another, more familiar, operating system can help
    smooth the transition to KDE and make it easier to switch back and forth between
    KDE and another operating system. As a result, themes that seek to copy the look
    of other operating systems are very popular — or at least they were until those
    themes were withdrawn from circulation due to possible copyright issues and the
    actual or perceived threat of legal action.


    Themes that copy the appearance of other operating systems too closely may not
    be available anymore, but you can still give your KDE desktop a familiar look.
    By combining elements from a couple of different themes with some other KDE settings,
    you can achieve the effect you want. The following recipes should yield a desktop
    strew with a familiar flavor.


    # ## If you’re coming from Windows ...


    If you’re a former Windows user who wants to retain some of the familiar appearance
    of the Windows environment on your Linux/KDE desktop, try this recipe for creating
    a Windows-style desktop:


    +   1.  Open **Theme Manager** and use it to apply the **Default** theme to your
    desktop.


    +   2.  Select the **Mono_2** theme and apply the **Window Titlebar** and **Window
    Button Layout** settings, and then close **Theme Manager**.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '+   3. Open the Display Settings dialog box (right-click the desktop and choose
    Display Properties from the pop-up menu that appears) and click the Style tab.
    Select the Draw Widgets option and deselect the Menu Bar At Top option. Then click
    OK to close the Display Settings dialog box and apply the settings.


    +   4. Open the KPanel Configuration dialog box (right-click the panel and choose
    Configure from the pop-up menu that appears), and, on the Panel tab, select Bottom
    as the location for both the panel and the taskbar.


    +   5. Hide the panel (click the Collapse button at either end of the panel),
    leaving the taskbar occupying the bottom of the screen.


    The resulting desktop (shown in Figure 7-5) is sufficiently Windows-like to make
    most Windows users feel right at home. If you really want to make your desktop
    look like a Windows machine, you can rename the Trash icon Recycle Bin, and create
    some desktop icons to mimic the other standard Windows shortcuts. But please,
    try to come up with something more imaginative than My Computer for the label
    on the folder icon for the top-level directory.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_152_0.png)


    Figure 7-5: If you insist, you can make KDE look a lot like a Windows desktop.'
