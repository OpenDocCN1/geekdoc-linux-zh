  md: "8.  Click the **Add** button, type a name in the *Add a Color Scheme* dialog\
    \ box that appears, and then click the **OK** button.\n\nKDE creates a new color\
    \ scheme containing the current window color settings. In the future, you’ll be\
    \ able to re-create these color settings by simply selecting the scheme name from\
    \ the Color Scheme list box. If, instead of creating a new color scheme, you want\
    \ to update the settings for the current color scheme, click the **Save Changes**\
    \ button instead of the **Add** button.\n\n# Using the screensaver\n\nScreensavers\
    \ used to be essential tools to prevent *burn in*—a ghost image that would become\
    \ permanently burned into the phosphors of a computer monitor if the same image\
    \ remained on the screen too long. To prevent the problem, the screensaver kicks\
    \ in after a predefined period of inactivity and replaces the normal screen image\
    \ with a blank screen or a moving image that doesn’t remain static long enough\
    \ to cause burn in.\n\nModern computer monitors are highly resistant to burn in,\
    \ but screensavers are more popular now than ever before. That’s because screensavers\
    \ do more than prevent burn in—they also protect your work from prying eyes if\
    \ you leave your computer unattended for a few minutes. In addition to the practical\
    \ applications of screensavers, they have a significant fun quotient as well.\
    \ The moving images employed by screensavers can be amusing, and even hypnotic\
    \ … or, mesmerizing … er, heh, wake up!\n\nOf course, KDE includes an assortment\
    \ of interesting screensavers for your enjoyment. To put screensavers to work\
    \ protecting your system, follow these steps:\n\n+   1.  **Right-click the desktop\
    \ and choose *Display Properties* from the pop-up menu that appears.**\n+   \n\
    +   The *Display Settings* dialog box appears. (The step isn’t necessary if the\
    \ *Display Settings* dialog box is already open.)\n+   2.  **Click the *Screensaver*\
    \ tab.**\n+   \n+   KDE displays the settings shown in Figure 6-6.\n+   3.  **Select\
    \ a screensaver name from the *Screen Saver list box*.**\n+   \n+   The preview\
    \ box in the top half of the *Screensaver* tab shows you approximately what your\
    \ screensaver choice looks like."
  merge: -1
  img_proc: true
