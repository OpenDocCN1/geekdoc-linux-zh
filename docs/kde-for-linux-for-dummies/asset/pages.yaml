- pgno: 242
  md: 'SameGame

    SameGame is a popular Macintosh game, redone here for KDE. It''s like a reverse
    form of Tetris; start with a full screen of colored balls and remove them systematically,
    attempting to clear the screen entirely.


    Shisen-Sho

    A Japanese contribution to the KDE games library, Shisen-Sho is another Mah-jongg
    variant. Click matching tiles to remove them from the screen; the fewer tiles
    left at the end of the game, the closer you are to winning.


    Sirtet

    A KDE version of the old war-horse game, Tetris. Sirtet is a faithful inter- pretation
    of the original, with square, colored blocks forming various shapes that drop
    from the top of the screen. Match three or more of the same color to remove the
    blocks; you''re still playing as long as the blocks don''t reach the top.


    SmileTris

    The other Tetris version in the basic KDE package, SmileTris has a funkier appearance
    than Sirtet. Choose between the two or play both!


    SnakeRace

    In SnakeRace, you''re a snake. You need to eat all the apples you can find and
    navigate your way out of the screen to the next level. It has a strong Pac-Man
    feel.


    Sokoban'
