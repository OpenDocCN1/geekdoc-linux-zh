- pgno: 77
  md: '+   1.  **Open the KDE Control Center dialog box.**

    +   Click the KDE Control Center button on the panel or choose KDE Menu\>KDE Control
    Center. The KDE Control Center dialog box appears.

    +   2.  **Choose Windows\>Mouse.**

    +   The Mouse tab appears, as shown in Figure 3-4.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_77_0.png)


    > Figure 3-4: You can customize the behavior of your mouse so completely that
    users other than you are bound to be flummoxed.


    3.  **Adjust the settings on the Mouse tab as needed.**

    To change a setting, select an option from the drop-down list box corresponding
    to the mouse button and window area that you want to adjust. The options are organized
    into the following window areas:


    +   - **Titlebar and Frame:** Just as you may expect, these settings apply when
    clicking on the titlebar or border of the active and inactive windows.

    +   - **Inactive Inner Window:** These settings control what happens after you
    click inside an inactive window. You have no corresponding option for controlling
    mouse clicks inside the active window because those mouse clicks are automatically
    passed to the application in the window.

    +   - **Inner Window, Titlebar and Frame:** The options in this area control actions
    that occur in response to clicking a window (anywhere on any window) while pressing
    the Alt key.


    4.  **Click the Apply button.**

    KDE applies the settings to your desktop and windows.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Configuring window management options


    The window management options control factors such as where KWM places new windows,
    how focus shifts from one window to another, and whether KWM displays the window
    contents or just an outline of windows as you move or resize them. To adjust the
    window properties options, follow these steps:


    +   1. **Open the KDE Control Center dialog box.**

    +      Click the KDE Control Center button on the panel or choose KDE Menu→KDE
    Control Center. The KDE Control Center dialog box appears.

    +   2. **Choose Windows→Properties.**

    +      The Options tab appears, as shown in Figure 3-5.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_78_0.png)


    **Figure 3-5:**

    Settings for the window properties options.


    +   3. **Adjust the settings on the Options tab as needed.**

    +      You can adjust the following settings:

    +      * **Vertical Maximization Only By Default:** Select this option to instruct
    KWM to change the height, but not the width, of a window when you click its maximize
    button. (The normal action is to maximize both height and width of a window.)

    +      * **Display Content In Moving Windows:** Select this option to show the
    contents of a window moving as you move the window. The default is to display
    only a transparent wireframe outline of the window as you move it — the window
    contents remain in the original position until you drop the window at its new
    location.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '**Display Content in Resizing Windows:** Select this option to show changes
    in the contents of a window as you resize the window. The default is to display
    only a transparent wireframe outline of the window as you resize it.


    **Resize Animation:** Drag the slider left or right to control the speed of the
    animated size change when you minimize or maximize a window. Drag the slider all
    the way to the left to make the change appear instantly.


    **Placement Policy:** Select an option from the drop-down list box to control
    the default placement of new windows. The default setting is Smart, which automatically
    positions new windows to minimize overlap. The Manual setting creates a window
    outline that moves with the mouse until you click to place the new window. If
    you select Interactive, the Allowed Overlap box appears, where you set the amount
    of window overlap that you deem acceptable. KWM places new windows automatically,
    if it can do so without exceeding the specified overlap; otherwise it resorts
    to manual placement. The other options are Cascade and Random.


    **Focus Policy:** The settings in this area control how KWM shifts focus from
    one window to another. The default is Click to Focus, which means you must click
    an inactive window to give it the focus. If you select Focus Follows Mouse, the
    focus shifts to a new window as soon as you move the mouse pointer over any visible
    portion of that window. The other options, Classic Sloppy Focus and Classic Focus
    Follows Mouse, are both minor variations of Focus Follows Mouse. If you select
    one of the Focus Follows Mouse options, you can also select Auto Raise to automatically
    raise a window to the foreground when it gets the focus. Drag the slider to adjust
    the delay before the auto raise feature takes effect. You can also select Click
    Raise to allow a click anywhere on a window (instead of just the titlebar) to
    raise it to the foreground. Auto Raise and Click Raise aren''t available if Click
    to Focus is selected in the Focus Policy drop-down list box.


    +   4. Click the Apply button.


    KDE applies the settings to your desktop and windows.


    # Configuring advanced window manager settings


    The so-called advanced window manager settings aren''t really any more advanced
    than any of the other KWM options. The advanced dialog is just a convenient label
    for some of the settings you''re less likely to need to change. The settings control
    how KWM reacts to some shortcut keys and enable you to set up filters to specify
    special treatment for certain windows.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '+   1. **Open the KDE Control Center dialog box.**

    +   Click the KDE Control Center button on the panel or choose KDE Menu->KDE Control
    Center. The KDE Control Center dialog box appears.


    +   2. **Choose Windows->Advanced.**

    +   The Advanced tab appears, as shown in Figure 3-6.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_80_0.png)


    ![](img/8dd43d91b80664e771e0c0a824d7392d_80_1.png)


    +   3. **Adjust the settings on the Advanced tab as needed.**

    +   You can adjust the following settings:


    +   * **Ctrl+Tab Walks Through Desktops**: Select this option to use the Ctrl+Tab
    shortcut key to switch desktops.

    +   * **Alt+Tab is Limited to Current Desktop**: Select this option to cause the
    Alt+Tab shortcut key to cycle through windows on the current desktop only. Otherwise,
    pressing Alt+Tab cycles through all the windows on all your virtual desktops.

    +   * **Alt+Tab Mode**: Select KDE or CDE to determine which windows KWM opens
    if you press the Alt+Tab repeatedly. KDE mode always switches back to the previous
    window. CDE mode always steps through the available windows sequentially.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_80_2.png)


    If you want to step through all available windows sequentially, press and hold
    the Alt key as you tap the Tab key repeatedly. This technique works in both KDE
    and CDE modes.'
  merge: -1
  img_proc: true
- pgno: 81
  md: "• **Grab the Right Mouse Button**: Select this option to give KWM first crack\
    \ at right clicks, which are used to open context menus and for various window\
    \ control functions. This option is selected by default. You only need to deselect\
    \ it if you're using a non-KDE application that requires full-time access to the\
    \ right mouse button.\n\n• **Filters**: Use the settings in this area to define\
    \ special treatment for windows with certain titles or X class names. Select an\
    \ option from the Windows Will drop-down list box and then build a list of window\
    \ titles or classes to get the special treatment by typing a name in the Titles\
    \ or Classes text boxes and clicking the plus (+) button to add the name to the\
    \ respective list box.\n\n4. **Click the OK button.**\n\nKDE closes the KDE Control\
    \ Center dialog box and applies the settings to your desktop and windows.\n\n\
    # Getting Real Work Done\non Virtual Desktops\n\nOne of KWM's chores is to manage\
    \ your virtual desktops, which give you more space to spread out application windows.\
    \ Although you can see only one desktop at a time, KWM can manage up to eight\
    \ virtual desktops and keep track of what windows are open on what desktops. You\
    \ can switch back and forth between the different desktops to access the windows\
    \ running on each one. Chapter 1 introduces the concept of virtual desktops and\
    \ Chapter 5 details how to control the number of desktops that are available and\
    \ their names.\n\nTo switch desktops, you can use any of the following techniques:\n\
    \n+   ↩ **Click one of the desktop pager buttons in the panel.** By default, the\
    \ desktop pager buttons are labeled One, Two, and so on. Clicking one of the buttons\
    \ displays the corresponding desktop and its collection of windows (if any).\n\
    +   \n+   ↩ **Click a taskbar button for a window that isn't on the current desktop.**\
    \ KWM automatically switches to the virtual desktop where the window resides and\
    \ opens the window.\n+   \n+   ↩ **Click the Window List button on the panel and\
    \ choose a window from the menu that appears.** KWM automatically switches to\
    \ the virtual desktop where the window resides and opens the window.\n+   \n+\
    \   ↩ **Press Ctrl+Tab to switch to the next virtual desktop in sequence.** Press\
    \ Ctrl+Tab repeatedly to step through the available desktops. (The Ctrl-Tab Walks\
    \ Through Desktops option must be selected on the Advanced tab of the KDE Control\
    \ Center in order for this technique to work.)"
  merge: -1
  img_proc: true
- pgno: 82
  md: "As an alternative to the standard techniques for switching desktops and moving\
    \ windows between desktops, you can try the KPager utility program. To launch\
    \ KPager, choose **KDE Menu** * **System** * **Desktop Pager**. The KPager window\
    \ appears, displaying thumbnail representations of each of your desktops. Double-click\
    \ on a desktop in KPager to switch to that desktop. Dragging windows from one\
    \ desktop to another in KPager has the effect of moving the window on your virtual\
    \ desktops as well.\n\n# Border patrol — using active and magic borders\n\nKWM’s\
    \ active desktop feature enables you to switch desktops by simply dragging the\
    \ mouse pointer to the edge of the desktop. Here’s how you can enable and configure\
    \ the active border option:\n\n+   1. Choose **KDE Menu** * **Settings** * **Desktop**\
    \ * **Borders**.\n+   \n+   The Window Manager Style dialog box appears with the\
    \ Borders tab displayed, as shown in Figure 3-7.\n+   \n+   (You can also get\
    \ to these same settings in the KDE Control Center by selecting **Display** *\
    \ **Borders**.)\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_82_0.png)\n\n+   2.\
    \ Select the **Enable Active Desktop Borders** option.\n+   \n+   3. Select the\
    \ **Move Pointer Towards Center after Switch** option.\n+   If you select this\
    \ option, KWM automatically positions the mouse pointer near the center of the\
    \ new desktop after switching desktops.\n+   \n+   4. Drag the **Desktop Switch\
    \ Delay** to set the **switch sensitivity**.\n+   This setting is a short delay\
    \ after the mouse pointer contacts the edge of the current desktop before KWM\
    \ switches desktops."
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Moving windows between desktops


    One way to control the desktop on which a window resides is to switch to the desired
    desktop before opening the window. But if a window is already open on a different
    desktop, you can move the window by


    +   - Right-clicking the window’s titlebar and choosing To Desktop:Two.

    +   - Clicking the menu button in the window’s titlebar and choosing To Desktop:Two.


    These examples move the current window to desktop Two. To move the window to a
    different desktop, select the desired window name.


    # Making your window sticky


    If you are using multiple desktops, you may have a window that you always want
    to remain available no matter which desktop you’re using currently. KWM enables
    you to address that need by making a window *sticky*, which means that the window
    sticks to the same spot on your screen regardless of what desktop you switch to.
    Another way to think on it is that a sticky window appears in exactly the same
    location on all your virtual desktops. To make a window sticky, you can use any
    of the following techniques:


    +   - Right-click the window’s titlebar and choose Sticky from the pop-up menu
    that appears.

    +   - Click the menu button in the window’s titlebar and choose Sticky from the
    menu that appears.

    +   - Click the Sticky button in window’s titlebar.


    To reverse the sticky effect, you can use any of the same techniques, except that
    the command that appears on the menu of a sticky window is UnSticky.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Chapter 4


    # A Place for Your Stuff —

    the KFM File Manager


    *In This Chapter*


    +   ▷ Managing your files the KDE way

    +   ▷ Viewing your files in the file manager

    +   ▷ Creating files and folders

    +   ▷ Moving and copying files

    +   ▷ Opening files in the right program

    +   ▷ Searching for lost files


    O ver the years, a variety of tools have been developed to help you manage the
    mounds of books and paper that are associated with the projects you work on in
    your real-world office. And it''s a good thing too! Without file folders, binders,
    shelves, and filing cabinets to keep things organized, most of us would be drowning
    in a sea of paper.


    Managing your computer files is no less of a challenge. Fortunately, KDE provides
    you with a powerful tool — the KDE File Manager — to help you meet and master
    the file management challenge. The KDE File Manager, better known as KFM, is your
    electronic filing cabinet. It creates easy-to-use graphic representations of your
    entire computer file system and enables you to manipulate files and folders by
    clicking and dragging onscreen icons instead of typing arcane commands at the
    command line. Even fans of the command-line interface will find KFM faster and
    easier to use for many file management tasks.


    This chapter shows you how to use KFM (and its companion program, Find Files)
    to manage and manipulate files. But KFM is more than a file management utility
    — it''s also a Web browser (we cover that aspect of KFM in Chapter 9).'
  merge: -1
  img_proc: true
- pgno: 85
  md: "# ## Where Are My Files?\n\nIn your physical office, if you need to get a file\
    \ or document that isn't already open on your desktop, you go to the file cabinet\
    \ and pull open a drawer. If you need to work with a file in KDE, the place to\
    \ go is KFM — your electronic filing cabinet.\n\nKFM enables you to navigate your\
    \ entire computer file system, as well as manage and manipulate your files and\
    \ folders. KFM is your virtual filing cabinet, and it's also your virtual copy\
    \ machine, file mover, trash can, shredder, and more. KFM makes full use of KDE's\
    \ desktop features by offering the capability to drag and drop file icons between\
    \ windows — whether to another KFM window, the KDE desktop, or a different program\
    \ window. It's a true graphical user interface to your file system.\n\n> REMEMBER\
    \ KFM is the KDE counterpart to the Windows Explorer and the Macintosh Finder.\
    \ KFM fulfills the same basic purpose as Explore and Finder — and uses some of\
    \ the same familiar conventions for graphically representing the files and folders\
    \ of your computer's file system. If you previously used the Windows or Macintosh\
    \ file management utilities, you already have a head start toward understanding\
    \ how to use KFM.\n\nOpening KFM is easy. It's a tool you'll probably use frequently,\
    \ so the KDE developers provide a number of ways to open a KFM window. You can\
    \ use any of the following techniques to open a KFM window:\n\n+   ✓ Click the\
    \ Home Directory button on the panel.  \n+   ✓ Click the KDE Menu button and choose\
    \ Home Directory.\n\n> REMEMBER The KDE Menu button is the panel button with the\
    \ KDE logo K and gear on it. It's normally located at the left end of the KDE\
    \ panel. Clicking the KDE Menu button causes KDE to display a list of programs\
    \ on the KDE menu (sometimes called the *application starter menu*). Refer to\
    \ Chapter 1 for more about using the KDE Menu button and its menu.\n\n+   ✓ Click\
    \ any folder's desktop icon (for example, *Templates* or *Autostart*).  \n+  \
    \ ✓ Click the KDE Menu, point to *Disk Navigator*, and then choose any of the\
    \ folder or device items on the *Disk Navigator* submenu.  \n+   ✓ Right-click\
    \ the desktop and choose *Execute Command*, type a path name in the Command box,\
    \ and press Enter.  \n+   ✓ Click any desktop icon for a file-system device such\
    \ as a CD-ROM or floppy. (If the device isn't already mounted, use KDE to mount\
    \ it before opening KFM — provided you have permission to mount the device.)"
  merge: -1
  img_proc: true
- pgno: 86
  md: 'When you open a KFM window, it automatically displays the contents of your
    home directory (as shown in Figure 4-1) unless you specified an alternate directory
    by clicking a desktop icon or choosing a menu item for a different folder. For
    example, if you click the Home Directory panel button, KFM displays your home
    directory — the one assigned to your login name. But if you click the Templates
    desktop icon, KFM displays the contents of the Templates folder instead.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_86_0.png)


    # **Figure 4-1:** The KFM window is your file management headquarters.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_86_1.png)


    In Linux and other UNIX variants, each user is normally assigned a separate directory
    in which to store personal files. Typically, your home directory is a subdirectory
    of /home and the directory name matches your login user ID. For example, the home
    directory for the user meadhra is /home/meadhra. This home directory is the one
    KFM displays by default and it''s where you store all your documents and other
    files. The operating system and KDE also store a number of personalized configuration
    files in your home directory and in several subdirectories.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'The tilde character (~) is a filename wildcard that is shorthand for your home
    directory. You can use it when typing pathnames to make it easier to enter the
    path to a file or subfolder in your home directory. For example, instead of typing
    the full path and filename /home/username/docs/MyDoc.txt, you can simply type
    ~/docs/MyDoc.txt.


    # # Navigating


    Using KFM to navigate your file system is like using your car to drive around
    in a city. Driving the car is the easy part. Finding your way around on the city
    streets is the challenge. If you know the layout of the city and you''re familiar
    with the streets, you can get from place to place easily, but if you''re a stranger
    in the city, the streets seem like a confusing maze.


    As with your car, KFM has a few simple controls that you''ll master easily. (Finding
    out how to use KFM is a lot easier than learning how to drive. We show you how,
    and besides, you don''t have to learn to parallel park KFM.) When you take KFM
    out for a spin around your file system, how easily you find your way among the
    files and folders depends on how well you know your file system. As soon as you
    venture beyond the local neighborhood of your home directory, the Linux file system
    can be as confusing to a new-comer as the streets of a strange city. As with some
    of the newest cars that include navigation aids such as GPS (global positioning
    satellite) receivers and moving map displays, KFM includes features to help you
    discover and explore your files and folders — but nothing takes the place of familiarity
    with the local streets and with your file-system layout.


    Actually, using KFM to navigate your file system is similar to using a Web browser
    to navigate a Web site. If you can surf the Web, you already know the basics of
    surfing your file system. Here''s a summary of the KFM navigation tools:


    +   - Type a path name in the Location box below the KFM toolbar to display the
    contents of that directory in the KFM window. As with a Web browser, KFM always
    displays the full path name of the current directory in the Location box, even
    if you use another navigation technique to open the directory.

    +   - Click a folder icon (or the underlined text name of the folder) to open
    the folder and display the contents of the selected directory in the KFM window.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_87_0.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_88_0.png)


    +   You can easily identify folders (directories) as opposed to files by their
    file-folder icons, which are visible in most KFM views. Files can have a variety
    of different icons, depending on the type of file, but directories are almost
    always represented by the file-folder icon. (A few special-purpose folders, such
    as desktop/, have custom icons.) In the Text view, KFM doesn''t display icons,
    but you can still identify folders by the slash character (/) appended to the
    end of the directory name in true UNIX tradition.


    +   Click the Up button on the toolbar to move up one level in the directory tree
    and display the contents of the parent directory.


    +   Click the Back button on the toolbar to display the previous folder''s contents.


    +   Click the Forward button on the toolbar to reverse the effects of the Back
    button and display the contents of the next directory in the history of directories
    viewed in the current KFM session. (The Forward button is grayed out until you
    use the Back button to step back through the list of previously viewed folders.)


    +   Click the Home button in the toolbar to display the contents of your home
    directory. No matter how far you venture into the dark alleys of your file system,
    you can always return to familiar territory with one click on this button.


    +   Click the Reload button in the toolbar to update the display to reflect changes
    in the files and folders you are viewing in KFM.


    +   Click Stop to halt loading (or reloading) the contents of a directory. Sometimes
    it takes a while to read the contents of a directory containing a large number
    of files and subdirectories and you may not want to wait for KFM to finish (especially
    when you realize that you clicked the wrong folder). The Stop button enables you
    to interrupt the loading process so you can go ahead and give KFM other commands.


    +   The gear icon on the right end of the toolbar spins while KFM is working reading
    the contents of a directory. When the gear stops spinning, KFM is idle, the display
    is complete, and the program is ready to accept new commands.


    # # Getting Different Views of Your Files


    KFM gives you several ways to customize how the program represents the files and
    folders shown in the KFM window. You''re not stuck with the default arrangement
    shown in Figure 4-2. You can choose from one of four different views and select
    other options to control such things as whether KFM displays hidden files.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_89_0.png)


    Figure 4-2: The large icons of the Icon View are easy to identify.


    Icon View — When you first start the KDE file manager, the KFM window appears
    and displays the contents of your home directory as rows of large icons — one
    icon for each visible file and folder within the directory. (Refer back to Figure
    4-2.) The icons are large and easy to see, which also makes them easy to click
    and drag with your mouse. Each icon is labeled with the file or folder name beneath
    the icon. If you''re using a different KFM view and want to switch back to Icon
    View, choose View > Icon View.


    Long View — If you need to see more detailed information about your files and
    folders, Long View (shown in Figure 4-3) is the way to go. Instead of rows of
    large icons, the display consists of a table-style listing of your directory''s
    contents. Each file or folder appears on a separate line that starts with a small
    icon and the file or folder name on the left and includes the file''s access permission
    mask, owner, group, size, and modification time and date. Choose View > Long View
    to switch KFM to this detailed display mode.


    Short View — If you like the small icons and compact list style of the Long View,
    but don''t need all the detailed information about each file or folder, then choose
    View > Short View to see a display similar to the one in Figure 4-4.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Chapter 4: A Place for Your Stuff — the KFM File Manager


    ![](img/8dd43d91b80664e771e0c0a824d7392d_90_0.png)


    Figure 4-3:

    The Long View shows more details.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_90_1.png)


    Figure 4-4:

    The Short View is a compromise between Icon View and Long View.


    ✓ **Text View** — The Text View is essentially the same as the Long View, except
    without the icons at the left end of each row. The absence of icons enables KFM
    to render a long directory display a little faster, but the speed difference between
    Text View and other views is seldom a major issue. Basically, Text View is for
    purists who just prefer the traditional text-based file listing. To invoke Text
    View, choose View➔Text View.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'No matter which view you choose, you still work with the files and folders
    in the KFM window the same way. You can click icons or filenames to open the selected
    files or folders and you can drag icons or filenames to copy and move files. (More
    on that in the “Copying and Moving Files” section of this chapter.) The view changes
    only how the files are displayed, not what you can do with them.


    # # Climbing the directory tree


    Finding your way around city streets is easier with a good roadmap. In these days
    of fancy electronic gadgets, the premier luxury cars often come equipped with
    GPS receivers linked to electronic maps to show you where you are and how to reach
    your destination.


    KFM includes a powerful navigation aid that serves its purpose in helping you
    find your way around your computer’s file system. If you choose View->Show Tree,
    a separate panel appears in the left side of the KFM window that displays a hierarchical
    listing of the file-system directory tree as shown in Figure 4-5. Repeat the same
    command to remove the tree panel from the KFM window.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_91_0.png)


    KFM’s tree display uses a collapsible outline format to show the nested directories
    and subdirectories that make up your computer’s file system. The arrowhead symbols
    to the left of each directory name enable you to expand or collapse the directory
    tree to show or hide the subdirectories within a given directory.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   Click a right-pointing arrow to expand the tree listing and show the subdirectories
    nested below the that directory.


    +   Click a down-pointing arrow to collapse the tree listing and hide any sub-directories.


    +   Click a directory name in the tree listing to display the contents of that
    directory in the main panel on the right side of the KFM window.


    +   The open file-folder icon beside a directory name indicates the selected directory.


    When you select a directory in the tree list, KFM displays the contents of the
    selected directory in the right side of the KFM window. However, if you click
    a folder name in the right side of the KFM window, click the Home button on the
    toolbar, or use any other navigation technique to change directories, KFM doesn’t
    necessarily update the tree list to indicate which directory is open. *Don’t rely
    on the tree list to show the location of the current directory unless you activate
    the Tree View Follows Navigation option.*


    +   Use the scroll bar on the right side of the tree display to scroll through
    the tree listing.


    +   Right-click a directory name in the tree list to open a pop-up menu of options
    that enable you to do things such as open, copy, and delete the directory. Most
    of your options for manipulating directories in the main panel of the KFM window
    are also available on this pop-up menu.


    The KFM directory tree panel includes a top-level branch labeled My Home and another
    top-level branch labeled *Desktop*. These are links to your home directory ( `/home/username`
    ) and Desktop subdirectory ( `/home/username/Desktop` ) rather than real branches
    on the directory tree. They appear on the tree list to provide convenient access
    to these oft-used directories so you don’t have to expand the Root branch in order
    to drill down to your home directory and Desktop. Note that your home directory
    is labeled My Home instead of its real path name.


    # # Showing thumbnails


    If you work with a lot of image files, you’ll appreciate the way KFM displays
    thumbnail previews of each image in Icon View. For identifying images, a picture
    — even a small one — almost always beats the most descriptive file name.


    To activate thumbnails, choose View:Show Thumbnails. Then, when you view the contents
    of a folder that contains image files, KFM displays a small preview image of each
    image file instead of the normal generic file icon, as shown in Figure 4-6. The
    Show Thumbnails command is a toggle — to deactivate it, just choose the same command
    again.'
