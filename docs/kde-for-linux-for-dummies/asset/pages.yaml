  md: "+   3. Click checkboxes in the **Access Permissions** area to select or deselect\
    \ access permissions as needed.\n+   \n+   The default settings shown in Figure\
    \ 4-11 allow full access by the owner (you) but deny access to others. Add checkmarks\
    \ to other boxes to grant various forms of access to other groups of users.\n\
    +   \n+   If you're logged on as a regular user, you can't change the ownership\
    \ of a file or folder. So the Owner and Group settings are grayed out. To change\
    \ those settings, you must be logged on as the superuser.\n\n+   4. **After adjusting\
    \ the permission settings, click the OK button**.\n+   \n+   KFM closes the dialog\
    \ box and changes the access permission settings for your folder.\n\nRefer to\
    \ Chapter 13 for more information on access permissions and on using KFM in superuser\
    \ mode to perform file management tasks that you can't do as a normal user.\n\n\
    # # Copying and Moving Files\n\nPerhaps the most common file maintenance task\
    \ you'll do with KFM is to copy or move a file from one directory to another.\
    \ KFM makes it easy to do. Whether you're moving or copying a file, the basic\
    \ procedure is the same — and it's a simple drag-and-drop operation between two\
    \ KFM windows. The following steps outline the procedure in detail:\n\n+   1.\
    \ **Open a KFM window and navigate to the directory containing the file you want\
    \ to copy or move.**\n+   \n+   If necessary, scroll the KFM window so the file\
    \ you want to move is readily accessible.\n\n+   2. **Open a second KFM window\
    \ and navigate to the destination directory.**\n+   \n+   Make sure the KFM window\
    \ displays the directory into which you want to copy or move files. Position the\
    \ window on your desktop so it will not be obscured by the other KFM window.\n\
    +   \n+   A quick way to open another KFM window is to click the gear icon at\
    \ the right in the KFM toolbar. A new window appears displaying the contents of\
    \ the same directory.\n+   \n+   Normally, you copy or move files from one directory\
    \ to another — hence the two KFM windows. However, you can also copy and move\
    \ files directly to the KDE desktop. In that case, the second KFM window is not\
    \ necessary.\n\n+   3. **Click the first KFM window's titlebar.**\n+   \n+   This\
    \ brings the source KFM window to the foreground — gives it the focus."
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   4. Click and drag the file from the source KFM window to the destination
    window. Release the mouse button to drop the file on the destination window.


    A small pop-up menu appears giving you the option to Copy, Move, or Link.


    +   5. To copy the file, choose Copy. To move it, choose Move.


    Copying a file makes an exact copy of the file in the new directory and leaves
    the original file in its original location. Moving a file makes a copy of the
    file in the new directory and removes the file from the original location.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_100_0.png)


    ![](img/8dd43d91b80664e771e0c0a824d7392d_100_1.png)


    The third option (Link) on the pop-up menu that appears when you drag-and- drop
    a file from a KFM window creates a symbolic link file in the destination directory
    that points to the original file in the source directory. (Creating a Link is
    roughly equivalent to creating a shortcut icon in Windows.) Sometimes creating
    a symbolic link is preferable to creating a copy of a file. A link creates the
    appearance of having a copy of the file in the new location, but the link is usually
    much smaller than the original file and, because clicking the link actually opens
    the original file, there’s no problem with two copies of the same information
    getting “out of sync.” If you’re not familiar with symbolic links, refer to a
    general Linux or UNIX book.


    # Deleting Files


    Another common file maintenance chore is getting rid of outdated and otherwise
    unwanted files and folders. KDE provides two options for disposing of unwanted
    files. The KDE trash can enables you to remove files in such a way that you can
    later recover them if necessary. You can also remove files from your system permanently
    and completely with KFM’s Delete command.


    # Trashing files


    ![](img/8dd43d91b80664e771e0c0a824d7392d_100_2.png)


    The KDE Trash appears on your desktop as a cute little trash can icon. However,
    the Trash is really a special-purpose folder (~Desktop/Trash/) that serves as
    the temporary storage space for files and folders on their way to being removed
    from your system.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Placing a file or folder in the Trash folder is analogous to dropping papers
    into your office trash can. Files that are in the Trash are out of sight and out
    of mind, but they aren''t yet out of your office. If you discover that you made
    a mistake and trashed the wrong file, you can dig into the trash can and retrieve
    it. When you''re sure that you no longer need anything out of the Trash, you can
    empty the trash — permanently deleting files. The following list gives you some
    quick tips for using the KDE version of the trash can:


    +   - Drag a file icon from the desktop or from a KFM window and drop it on the
    desktop Trash icon to move the file from its original location to the Trash folder.

    +   - Right-click a file or folder icon in a KFM window and choose Move to Trash
    from the pop-up menu that appears. This also moves the file or folder into the
    Trash folder.

    +   - Double-click the Trash icon on the desktop to open a KFM window displaying
    the contents of the Trash folder.

    +   - To recover an individual file from the Trash, open the Trash folder and
    then click and drag the file icon out of the KFM window and drop it on the desktop
    or another KFM window.

    +   - Right-click the Trash desktop icon and choose Empty Trash Bin from the pop-up
    menu that appears to permanently delete all the files stored in the Trash folder.


    # Putting files through the shredder


    If you want to remove files or folders from your system without going through
    the two-step process of moving them to the Trash and then emptying the Trash,
    KFM enables you to do just that with its Delete command. But be careful, and be
    very sure that you really want to erase the file or folder. The Delete command
    is permanent. Using delete is kind of like running a paper through the shredder
    instead of just dropping it into the trash bin — there''s no going back and retrieving
    the deleted file later.


    Deleting a file or folder with KFM is easy. Just follow these steps:


    +   1. Open a KFM window and navigate to the directory containing the file or
    folder you want to delete.

    +      You can also delete files and folders from the desktop without opening
    a KFM window.

    +   2. Right-click the file or folder icon and choose Delete from the pop-up menu
    that appears.

    +      The KFM Warning box appears as shown in Figure 4-12. This is your last
    chance to change your mind before permanently removing the selected file from
    your system.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_101_0.png)'
  merge: -1
  img_proc: true
- pgno: 102
  md: "![](img/8dd43d91b80664e771e0c0a824d7392d_102_0.png)\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_102_1.png)\n\
    \n+   3. Click the Yes button.\n+   \n+   KFM closes the warning box and deletes\
    \ the selected file or folder. It's outta here! Gone! Vamoosed!\n\nDeleting a\
    \ file removes the individual file from your system. But deleting a folder deletes\
    \ not only the folder but also all the files and subfolders contained within that\
    \ folder. That's a pretty drastic step. It's a good idea to open folders and check\
    \ their contents before deleting them.\n\n# Opening Files in the Right Program\n\
    \nKFM enables you to explore your entire file system, going from directory to\
    \ directory viewing the list of files in each folder. But you're not confined\
    \ to looking at lists of filenames — KFM can also open files and launch programs.\n\
    \nTo launch a program, click the program's executable file in a KFM window. KFM\
    \ launches the program just as if you typed the program name at the command line.\
    \ To open a document in a program of your selection, follow these steps:\n\n+\
    \   1. Right-click a document icon in a KFM window and choose Open With from the\
    \ pop-up menu that appears.\n+   \n+   The dialog box shown in Figure 4-13 appears.\n\
    \n![](img/8dd43d91b80664e771e0c0a824d7392d_102_2.png)\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_102_3.png)"
  merge: -1
  img_proc: true
- pgno: 103
  md: '+   2. **Type a program name in the Open With text box.**

    +      Enter the name of the program you want to use to open the selected file.
    Be sure to use the name of the executable file, not the name as it appears on
    a menu somewhere. For example, type `kview` to use the KDE Image Viewer utility.


    +   3. **Click OK.**

    +      KFM launches the program, which then loads the selected file.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_103_0.png)


    To automatically open a document file in its parent program, click the document
    file in a KFM window. If KFM can identify the file type and its associated program,
    KFM launches the program and passes the file name to the program, so the program
    automatically loads the selected file.


    If you want KFM to automatically launch the correct program when you click a document
    file, KFM must be able to identify the file type, and it must know what program
    to launch to open that file type.


    A standard set of file type descriptions (called *MIME types*) and a set of default
    links between certain file types and some of the standard KDE utility programs,
    are both parts of the normal KDE installation. As a result, KFM starts out with
    a respectable number of file types that you can open with a single click. In addition,
    when you install new KDE programs, the installation routine should set up MIME
    types for the program''s file types — and add links between those file types and
    the program so you can automatically open those files in the newly installed program.


    Sometimes, you may need to create or customize the association between document
    file types and the application used to open them. You''ll probably never need
    to create an actual MIME type from scratch; you probably won''t even need to edit
    any existing MIME types. (So you''re off the hook; this book won''t drag you through
    creating MIME types.) If you want to use a specific program to open a particular
    kind of file, you may need to change the established links between the file type
    and the program KFM uses to open those files. You revise the application links
    by following these steps:


    +   1. **Open a KFM window and choose Edit Applications.**

    +      KFM displays the contents of a hidden subdirectory of your home directory,
    `~/.kde/share/appLink`. This directory contains a series of link files and folders
    that correspond to the contents of the KDE menu.


    +   2. **Navigate the subfolders to locate the application you want to change.**

    +      Open folders and subfolders as needed until KFM displays the icon for the
    link to the application you want to use to open the target file type.'
