    # Die, Window, Die!


    Unlike some other very popular operating systems, where program crashes are a
    common occurrence, KDE programs don''t crash or freeze very often. Still, a crash
    does happen occasionally. And when it does, it''s good to have a way to clear
    the frozen window from your desktop without needing to shut down your system.
    You can use the following procedure to kill a window any time a program doesn''t
    respond to the normal efforts to close its window.


    +   1. Press Ctrl+Alt+Esc.

    +      The pointer changes to a skull and crossbones symbol \u2014 like the old-fashioned
    symbol for poison. That''s appropriate because the pointer is now loaded with
    a poison that is lethal to program windows.

    +   2. Click the kill pointer on the offending window.

    +      KDE closes the window and \"kills\" the associated program (or forces it
    to shut down).


    ![](img/8dd43d91b80664e771e0c0a824d7392d_304_0.png)


    This technique is deadly!! Use it with care. This click of death is a way to deal
    with a broken program that has become unresponsive \u2014 Ctrl+Alt+Esc isn''t
    a replacement for the Close button in the window''s titlebar or other conventional
    techniques for properly exiting a program.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Pulling the Plug on X


    On rare occasions, you may encounter a problem that causes KDE and your X Window
    System to stop responding. If you were using a different operating system, you’d
    probably have to power down and reboot your computer to recover from this kind
    of problem. But KDE users have a less drastic solution available:


    +   1.  **Press Ctrl+Alt+Backspace.**

    +       The system immediately halts your X Window System server. After X shuts
    down, you find yourself back at the login screen or command prompt.

    +   2.  **Log in normally at the graphical login screen or type startx at the
    command prompt** to return to normal operations in KDE.


    This technique enables you to reboot your graphical user interface (X and KDE)
    without rebooting the underlying operating system (Linux/UNIX) or shutting down
    the computer hardware. As a result, you get back to work faster and you don’t
    have to reset network connections, remount file systems, or disrupt other users
    who may be connected to your computer.


    # Taking the Shortcut Home


    Although graphical user interfaces, such as KDE, are designed to enable you to
    make selections and issue commands by pointing and clicking with your mouse, keyboard
    shortcuts often come in handy. Here’s one of the handiest — a keyboard shortcut
    for gaining access to your home directory with KFM:


    +   1.  **Press Alt+F2.**

    +       KDE opens the Command window.

    +   2.  **Type ~ (the tilde character) and press Enter.**

    +       KDE opens a KFM file manager window and displays the contents of your
    home directory.


    # Instant Access to the KDE Menu


    Sometimes doing things with the keyboard is just easier than using a mouse. This
    is especially true if you’re using a laptop computer and your mouse is really
    a touchy touch pad or one of those eraser-head-in-the-keyboard things. So, for
    those times that you’re stuck using a laptop with an awkward pointing device,
    here are some tips for using the KDE menu to launch programs — and doing it *sans*
    mouse:'
