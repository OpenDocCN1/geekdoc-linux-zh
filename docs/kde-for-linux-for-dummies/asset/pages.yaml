    # ### Changing the font


    Colors aren''t the only part of your desktop appearance that you can change. You
    can also control the fonts that KDE uses to display the text that appears in places
    such as menus, window titlebars, panel buttons, and icon labels. The fonts that
    appear on your desktop have a subtle, but surprisingly significant effect on the
    overall appearance of your desktop. You can choose simple fonts for maximum legibility
    or fancy, or specialty fonts for a bizarre visual effect. Or perhaps you want
    to take the conservative approach and select the fonts dictated by your corporate
    identity standard. (How boring!)


    By default, KDE uses the Helvetica font for almost all desktop text. If you''re
    looking for maximum legibility, beating the old standard, Helvetica, is hard.
    However, if you want to try something a bit more adventurous, you can select another
    font by following these steps:


    +   1.  **Right-click the desktop and choose Display Properties from the pop-up
    menu that appears.**


    The Display Settings dialog box appears. (The step isn''t necessary if the Display
    Settings dialog box is already open.)


    +   2.  **Click the Fonts tab.**


    KDE displays the settings shown in Figure 6-7.


    +   3.  **Select a font category from the large list box on the left side of the
    Fonts tab.**


    Most of the font categories are fairly self-explanatory.


    +   -   General Font is used for menus, icon labels, and most everything else
    that isn''t listed separately.


    +   -   Fixed Font is used to display non-proportional text.


    +   -   Window Title Font is for the text appears in the titlebar of program windows.'
