  md: '+   Set Key Click Volume to your preference.


    Some folks really like to hear themselves clickety-clicking along. If you like
    that, turn on the key click to set the volume by gliding the slider button; you
    get a little chirp sound every time you press a key. If you think the physical
    sound of typing is enough, turn this preference off.


    +   Choose File⋗Exit to leave Control Center.


    # The friendliest kind of mouse


    The mouse — it seems indispensable, doesn''t it? It''s hard to imagine personal
    computing over the last 10 or 12 years without the mouse. The mouse is an integral
    part of both the Macintosh and Windows systems. Still, the mouse is a relative
    newcomer to the UNIX and UNIX-based world. In fact, running com-plicated and large
    Linux networks with nothing more than a keyboard is still quite common for many
    folks.


    The problem with living mouselessly is that you have to remember all sorts of
    arcane commands, command syntax, specialized flags, and so on, which gets rather
    complicated. If you''re the sort of person who chose KDE because it is graphical,
    then you''d not be very happy if we told you that from this day forth, no more
    mouse for you. (Heck, we''d be cheesed off! We like our mouses!) The mouse makes
    life easier, no matter what platform you''re using.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_295_0.png)


    You may not have a mouse. No, we''re not thinking that you''re some techie wizard
    who knows all the secret command-line words. Rather, we''re thinking that you
    may be a gadgeteer. (It''s okay. We are too.) A two-button mouse is so boring!
    Even a three-button mouse is still pretty standard these days, so what''s a self-respecting
    gadget junkie to do? Well, you can investigate the lab-ulous world of input devices:
    trackballs, pen/tablet combinations, touch-screen pads, and so on. We''re assuming
    that if you have such a device, you have appropriate Linux drivers and you know
    how to use it. We can''t guaran-tee that your device will be affected by any of
    the KDE configuration tools meant specifically for mouses.


    KDE understands that most people are comfortable using the mouse to manage their
    computers. Back in Chapter 1, we described some basic mouse skills that we assume
    you already have, so we won''t cover the basics here. Instead, we show you some
    ways to get your mouse up to top speed. Dealing with the mechanical complications
    of the mouse is frustrating enough without having to fight with its action on-screen
    as well!


    # Mechanical mouse maintenance, my my my


    It''s surprising how often people just throw mouses away if they start working
    oddly. Maybe it''s because the devices are cheap enough to treat as a dispos-able,
    or because the users don''t realize how easy it is to clean a mouse. While'
