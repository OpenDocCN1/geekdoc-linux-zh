    # ## Sticking to the Text


    Way back in the days when graphical interfaces were just experimental toys, most
    applications were text based. If you’re in your early 30s or older, your first
    computer may very well have been a plain old DOS box, in which case you remember
    text-based programs just fine.


    UNIX and UNIX-based operating systems have always relied on text-based programs,
    both for system maintenance and for actual applications. Having a constant graphical
    interface, such as KDE, is a fairly recent phenomenon, and many Linux people still
    prefer to run text-based programs where possible. Text-based applications are
    improved and developed as frequently as graphical applications, so that you don’t
    find a big quality trade-off. Some of these applications are very good and have
    maintained a following even in the face of graphical applications with many bells
    and whistles, while other text programs are so specialized that no graphical alternative
    has been wanted.


    If you’ve used UNIX or Linux before, even if it wasn’t a machine you administered,
    you may be familiar with a few of these programs. Lynx, as mentioned above, is
    a text-based Web browser. Pine is a multifunction e-mail program,'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'while trn and sstrn are designed especially for USENET newsgroup reading. Pico,
    emacs, and vi are text-editors; we talk more about text editors in Chapter 10.
    Give some of these old warhorses a try; you may find them more suitable to your
    habits than some of the newer graphical programs.


    Where do you find them? You probably already have these programs loaded. Most
    Linux distributions include the basic text programs as part of the standard installation.
    Check through your file directories, or look at the listing of contents for your
    installation CD to see what you have available to you that''s text-based.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_255_0.png)


    Text-based programs take up a lot less memory when they''re running. If you have
    a chronic memory shortage and can''t afford to add a few megabytes to boost productivity,
    consider using text-based applications to minimize the load. You still need graphic
    applications for some things, but you will be amazed at what you can get accomplished
    with a simple text editor and an e-mail program, such as Pine.


    So what do you do if you want (or need) to run one of these text-based programs?
    Simple: You run the program in a terminal window. Terminal windows are launched
    with the K Virtual Terminal program, or KVT. KVT''s icon in the panel looks like
    a window plugged into a computer, and it''s usually located near the Pager buttons.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_255_1.png)


    A terminal window is simply a KDE window opened to a text prompt. The window lets
    you do things directly with Linux, without having to log out of KDE to a text
    prompt and then restart KDE after you''re done. A terminal window also permits
    you to run regular text programs within the graphical environment. (If you''ve
    got true geekish tendencies such as one of us — we won''t say who — you may run
    KDE simply to have access to Netscape and RealPlayer, but do all your work in
    old-fashioned text programs running in terminal windows.)


    1. Click the KVT button in the panel.


    A terminal window appears, as shown in Figure 12-9. Note that it looks exactly
    like your screen if you''re using a text log-in, except that it has a titlebar
    and a toolbar like any other KDE window.


    You can do anything in this terminal window that you would do with the computer
    in text mode, whether it''s system maintenance or application work.


    2. At the text prompt, type the name of the program you want to run.


    The program launches within the terminal window. Text-based programs do not spawn
    new windows as graphical applications do, so that you need to open a new terminal
    window for each text-based application you want to run simultaneously.'
  merge: -1
  img_proc: true
- pgno: 256
  md: "![](img/8dd43d91b80664e771e0c0a824d7392d_256_0.png)\n\n+   3. **After you're\
    \ finished with the text-based program, click the X in the titlebar to close the\
    \ terminal window.**\n+   \n+   Unlike the text mode, if you're not logged into\
    \ KDE, you can't log yourself out of your user account by typing `logout` at the\
    \ system prompt. You need to close the terminal window and exit KDE in order to\
    \ do that.\n\n# ## Making KDE Play Nice with Others\n\nSometimes, through no fault\
    \ of yours or anyone else's, a non-KDE program doesn't work quite right after\
    \ you run it under KDE. The usual manifestation of a problem is an oddly sized\
    \ window or very strange font appearances.\n\nWhat's happening here is that KDE\
    \ is trying to muscle in on the other program's territory. KDE is trying to apply\
    \ its own font and window rules to the non-KDE program, whether or not the non-KDE\
    \ program is set up to accept the KDE rules. Sometimes you never notice a thing\
    \ and the program works fine; other times, the program looks nasty and may give\
    \ you a headache.\n\nFortunately, you have a couple of options you can try in\
    \ such a situation.\n\n+   1. **Open the KDE menu and choose Settings > Desktop\
    \ > Style config panel.**\n+   \n+   The Style Config Panel (Display settings)\
    \ screen appears.\n+   2. **Click the checkbox next to Apply KDE Settings to non-KDE\
    \ Apps to remove the checkmark.**"
  merge: -1
  img_proc: true
- pgno: 257
  md: "+   3. Click **OK**.\n+   \tDo not click **Apply**. If the new setting doesn't\
    \ seem to work, redo this procedure and make sure you click **OK** instead of\
    \ **Apply**.\n\nIf it still doesn't work, you can do some heavy-duty mangling\
    \ to get your program working properly. Making your program work correctly involves\
    \ hands-on Linux work, so if you're uncomfortable with doing such things, take\
    \ a deep breath and promise yourself ice cream afterward.\n\nOpen your file manager\
    \ and locate the following directory:\n\n```\nopt/kde/share/apps/kdisplay/app-defaults\n\
    ```\n\nPhew! That's a mouseful. After you locate the directory, you need to either\
    \ delete or rename the directory. Doing this keeps the X Window System from locating\
    \ the default Kdisplay resource files (the ones that the X Window System uses\
    \ to assert KDE styles over the non-KDE application's defaults).\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_257_0.png)\n\
    \nIn cases where you have the option to either delete or rename a file or directory,\
    \ you're almost always making the better choice to rename the file or directory\
    \ (and to make a note of both its original name and the one you used for renaming).\
    \ In the event that you need to put the file back, you still have it. If the file's\
    \ deleted, you may have to go all the way and reinstall from scratch. Renaming\
    \ saves time.\n\nAfter you rename or delete the directory, log out of your user\
    \ account and then log back in. Logging out causes X to restart and allows the\
    \ non-KDE program to use its own settings.\n\n# Okay... but It's Still Not Working\n\
    \nIf you have different problems than the ones noted above, or if these tricks\
    \ still aren't getting your problem solved, you may want to find an expert somewhere.\
    \ Consult Chapter 16 and Appendix B to find places where KDE-savvy people hang\
    \ out on the Internet. Chances are, if you're experiencing problems with a popular\
    \ non-KDE application, you are not the first one to find the KDE feature that's\
    \ holding you back.\n\nYou may also want to check out the non-KDE application's\
    \ Web site to see if there are known conflicts with KDE. Sometimes all you have\
