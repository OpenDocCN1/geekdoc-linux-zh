- pgno: 2
  md: '# KDE For Linux® For Dummies


    # Cheat Sheet


    # Window Manipulations


    | To do this: | Do this: |

    |---|---|

    | Move a window | Click and drag the window''s title bar |

    | Resize a window | Point to the window border. When the pointer changes to an
    arrow pointing to a perpendicular line, click and drag the window border |

    | Minimize (iconify) a window | Click the Iconify button (usually a small dot
    or dash) in the window''s title bar |

    | Maximize a window | Click the Maximize button (usually a box) in the window''s
    title bar |

    | Close a window | Click the Close button (usually an X) in the window''s title
    bar |

    | Make a window sticky (retain its position onscreen when you switch to other
    virtual desktops) | Click the Sticky button (usually a push pin) in the window''s
    title bar |

    | Move a window to a different virtual desktop | Right-click the window''s title
    bar, choose To Desktop and then the desktop number from the pop-up menu that appears
    |

    | Move a window when its title bar is inaccessible | Press and hold Alt as you
    click and drag anywhere on the window |

    | Kill a window that won''t close normally | Press Ctrl+Alt+Esc. When the pointer
    changes to a skull and crossed bones symbol, click the window you want to kill
    |


    # Global Keyboard Shortcuts


    | To do this: | Press this key combination: |

    |---|---|

    | Close a window | Alt+F4 |

    | Kill a window | Ctrl+Alt+Esc |

    | Open the Execute Command box | Alt+F2 |

    | Open the Task Manager window | Ctrl+Esc |

    | Switch to virtual desktop 1 | Ctrl+F1 |

    | Switch to virtual desktop 2 | Ctrl+F2 |

    | Switch to virtual desktop 3 | Ctrl+F3 |

    | Switch to virtual desktop 4 | Ctrl+F4 |

    | Switch to virtual desktop 5 | Ctrl+F5 |

    | Switch to virtual desktop 6 | Ctrl+F6 |

    | Switch to virtual desktop 7 | Ctrl+F7 |

    | Switch to virtual desktop 8 | Ctrl+F8 |


    For Dummies®: Bestselling Book Series for Beginners'
