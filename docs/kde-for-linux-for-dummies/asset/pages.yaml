- pgno: 342
  md: "+   5. Download the files.\n+   Use the process you're most comfortable with,\
    \ whether that's Netscape's built-in downloading or a standard FTP program. A\
    \ list of the packages follows; some you definitely need and some are optional.\
    \ They are marked accordingly.\n\n+   6. After you've finished downloading, exit\
    \ your browser or FTP program.\n\nHere are the 11 KDE packages:\n\n+   ☑ **kdbase\
    \ (REQUIRED)**: This package contains the main set of programs that form the KDE\
    \ core. The window manager, the Control Center, the Panel, and other main functions\
    \ are included in this package. Obviously, you need this package in order to do\
    \ anything at all with KDE.\n+   \n+   ☑ **kdelibs (REQUIRED)**: This package\
    \ contains the library functions that were written especially for KDE. KDE will\
    \ not function without these libraries.\n+   Most software contains instructions\
    \ that depend on certain standardized functions. These functions are contained\
    \ in software *libraries*. All computers contain multiple libraries in their operating\
    \ software.\n\n+   ☑ **kdesupport (RECOMMENDED)**: This is a library package as\
    \ well. It contains various libraries that are not exclusively part of KDE, but\
    \ which KDE calls upon for various processes. If you already have these libraries\
    \ on your system (look for libgfl, libjpeg, libmime, libau, and libgdbm), you\
    \ do not need to download and install this package. If you're not sure, download\
    \ and install. The worst thing that can happen is that you reinstall something\
    \ you already had.\n+   If you are running a Debian Linux distribution, you must\
    \ install the kdesupport package. Debian does not utilize these libraries for\
    \ its regular Linux operation, but you definitely need them for KDE.\n\n+   ☑\
    \ **kdenetwork (RECOMMENDED)**: Although technically optional, all the Internet-related\
    \ functions are in this package. The programs related to electronic mail, news,\
    \ chat, and other network functions are contained in kdenetwork. Go ahead and\
    \ install it. If you don't do it now, you'll just end up doing it later because\
    \ you need to check your e-mail.\n\n+   ☑ **kdegraphics (RECOMMENDED)**: This\
    \ package contains programs that allow KDE to manage various kinds of graphic\
    \ files, such as a PostScript viewer, a .dvi viewer, and a drawing program. These\
    \ are all useful, and if you plan any work with graphics, you should probably\
    \ have them installed.\n\n+   ☑ **kdetutils (RECOMMENDED)**: This package contains\
    \ some very useful things — various text editor programs and some other programs,\
    \ such as a calculator or the KNotes utility.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_342_0.png)\n\
    \n![](img/8dd43d91b80664e771e0c0a824d7392d_342_1.png)"
  merge: -1
