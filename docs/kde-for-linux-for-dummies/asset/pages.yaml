- pgno: 273
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_273_0.png)


    If you want to add or remove a service from a given run level, you need to know
    exactly what the service is, what it does, and why you want to add or remove it.
    If you play around with this tool and add or remove services without understanding
    what they do, you can inadvertently cripple your machine by removing a critical
    program — and it is very hard to fix run level errors if they involve basic services.


    # Mounting File Systems


    If you''re new to Linux but have used Windows or Macintosh computers before, you
    may find the Linux method of file-system management quite odd. In fact, Windows
    and Mac users often don''t even think of what they''re doing as file-system management
    because of the way their operating systems handle floppy and CD drives.


    Linux works under a *conservation of resources principle*. You don''t need to
    have access to all your storage devices, or *drives*, all the time; you just need
    them when you need them. With Linux, you need to *mount* or *unmount* file systems
    as the occasion requires.


    What does it mean to mount a file system? Well, it doesn''t mean that you climb
    atop a pile of CD-ROM jewel boxes and begin to declaim the poetry of Henry Wadsworth
    Longfellow. To understand the phrase, first read the term definitions:


    +   * **File system**: A file system can be anything from a hard disk to a floppy
    disk, a tape drive, a CD-ROM, or a single directory. In general, Linux folks use
    the term *file system* to refer to any given directory and all of its subdirectories.
    For example, a CD-ROM copy of the *Encyclopaedia Britannica*, A–F will have a
    top-level directory and a number of subdirectories that contain the actual entries.

    +   * **Mount**: After you have your file system, you need to mount it. *Mounting*,
    in Linux terms, means to make the file system available to the local system. Here,
    *local* means your particular computer.


    Some file systems mounting happens automatically. When you installed Linux for
    the first time, you created a number of partitions on the hard disk. Each of these
    partitions is a separate file system. When you boot up the computer, part of the
    start-up process is the automatic mounting of these file systems. You can also
    unmount and remount these hard disk partition file systems by hand, just as you
    can mount and unmount storage device file systems by hand.


    This system of mounting and unmounting file systems has both disadvantages and
    advantages. The main disadvantage of the mounting method is that you have to mount
    the file system every single time you want to use the floppy drive or the CD-ROM
    drive. Compared to the ease of use with Windows or Macintosh, mounting drives
    can be a real pain.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Chapter 13: It May Look Different, but It’s Still Linux


    ![](img/8dd43d91b80664e771e0c0a824d7392d_274_0.png)


    The advantages outweigh the inconveniences, though. With the mounting method,
    you have greater control over the file systems. If there appears to be a problem
    with your floppy drive, such as signs of corruption, you can just unmount the
    file system and work on the problem without compromising your main system. You
    also have the ability to mount file systems from remote machines and work with
    them just like they were part of your own computer. This is done using the Network
    File System, or NFS.


    If you’re interested in the possibilities of remote file sharing across a network,
    but you’re the only Linux fan in a roomful of Windows users, take a look at a
    nifty program called Samba. Samba allows you to share file systems across a mixed-OS
    network composed of Linux and Windows machines; much of this book was written
    across a Samba network. Windows 98 Networking shares some features with the Linux
    implementation of NFS; after you have the network set up, both the Windows machines
    and the Linux machines can use file systems on all the machines in the network.


    True to form, KDE gives you a specialized tool that makes the mounting and unmounting
    of file systems a snap.


    +   1. Log in as root.

    +      If you’re logged in to your user account, you can either log out and log
    in again as root, or you can use the KFM superuser mode described in the “Using
    KFM as the superuser” section of this chapter.


    +   2. Open the KDE menu and choose System->KDiskFree.

    +      The KDiskFree screen appears. If you’ve looked at Chapter 14, you’ll remember
    KDiskFree as a helpful tool to assess the fullness of your drive, but it’s also
    a useful mounting tool if you’re logged in as root.


    The KDiskFree screen displays the various file systems available on your computer.
    If the file system is already mounted, it is black and clickable. If the file
    system is available but unmounted, it is greyed out.


    +   3. Click the icon of the file system you want to mount or unmount.

    +      KDiskFree displays a message and then mounts or unmounts, as you selected.


    +   4. Choose File->Exit after you have finished.


    # Keeping Your Privacy Intact


    Linux is a multiuser system, even if you’re the only user. One of the problems
    that arises from the capability to set up accounts is the issue of security and
    privacy. Think about it: When you log in to your Internet provider to check your
    mail, or you save a document to your hard drive, or you visit sites on the Web
    that give you cookies, that information is stored in your user account files.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'In the ideal world, nobody would care about your *private stuff*. After all,
    you’re not a celebrity, right? Who cares if you have a couple of e-mail accounts
    with pseudonyms? Who cares if you keep your painfully honest and private diary
    in a text file? Who cares if you visit the “Fluffy Bunny News Page” so often that
    the front page of the site mentions you by (pseudonymous) name?


    You do. We all do. Our stuff is ours, and we don’t want people to see it without
    authorization to do so. Linux handles these issues with something called a *permission
    profile*. Each file has one. The permission profile determines who has permission
    to access the file and what kind of access they can have. Three types of permissions
    exist:


    +   - **Read**: Read is the most basic type of permission. It means that the file
    can be viewed, but not altered in any way.

    +   - **Write**: Write is the middle kind of permission. When you place write
    access on a file, it can be altered by whomever has write access to it.

    +   - **Execute**: Some files are executable, which usually means that they’re
    programs or scripts. Execute permission means that whomever has execute access
    to the file may run the script or program — in the directory where it lives. This
    can be dangerous if it’s a destructive program.


    Just like the three types of permission, three levels of access exist:


    +   - **User**: This is you, or whoever owns the user account. Generally, you
    have full access to all the files in your account (unless you mess up the permissions
    somehow).

    +   - **Group**: After you create the user account, you may have created special
    groups. If not, the group is the entire user base of the machine. Group access
    means that anyone within your group can view your files under the type of permission
    you attached to the file (read, write, or execute).

    +   - **Global**: Exactly what it says. This is a dangerous level, with one major
    exception. It may not seem like it’s much to worry about, and if your machine
    is a standalone box with no cords trailing out the back, it may be that you’re
    okay. But one of the major assumptions made throughout this book is that you have
    Internet access. After you’ve connected your Linux box to the Internet, anyone
    who knows you’re there can access files set with global access privileges and
    use them according to the permission level. Do you really want to give some guy
    in Uzbekistan execute permission on your home directory? We didn’t think so.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_275_0.png)


    The World Wide Web is an exception to the “Global access is dangerous” rule. Assume
    for a moment that a Web server is running on your Linux machine. (It’s unlikely
    that you’d need this book if you were doing so.) The Web server allows people
    on the Internet to view all the globally accessible pages on the machine. Users
    most often create their own Web'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'pages by building a directory structure within a particular directory that
    is globally accessible. That is, you''d create a directory called WWW and make
    it globally readable. Everything and anything that goes into that directory is
    visible on the Web; it wouldn''t be visible if it weren''t globally accessible.
    Still, it''s a conscious choice to move files into that directory.


    Be aware of your permissions; if you''re connected to the Internet, there''s always
    a chance that some curious or malicious person will test your permissions.


    All of this permission stuff can get confusing, because you can have three levels
    of access for each of the three types of permission. If you think well in spatial
    terms, imagine the permissions profile as a matrix, with types of permission along
    the X axis and levels of access along the Y axis: The most tightly controlled
    files, user-readable, are snugged tightly to the center, while the most available
    files, global-executable, are way out there in the ether. (If that image doesn''t
    work for you, try thinking of something else. Or perhaps the basic definition
    of permissions works for you, in which case you get the gold Linux star!)


    The traditional UNIX system for defining permissions is a little esoteric, so
    KDE added a highly useful permissions feature in KFM.


    +   1.  Open **KFM**.

    +   2.  Navigate to the file on which you want to check permissions.

    +   3.  Right-click the filename.

    +   4.  Select **Properties** from the pop-up menu.


    The properties screen appears, as shown in Figure 13-9.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_276_0.png)


    Figure 13-9:

    Pop-up KFM menus are an easy way to handle file permissions.'
  merge: -1
  img_proc: true
- pgno: 277
  md: "# 252 Part IV: Under The Hood\n\n+   5. Select the Permissions tab.\n\nThe\
    \ permissions profile for the selected file is shown.\n\n+   6. Select the checkboxes\
    \ to set the permissions profile as you want it.\n\nRemember to keep your own\
    \ level of access to the file. You usually need at least write access to your\
    \ own files so that you can alter them.\n\n+   7. Click OK to exit the Properties\
    \ screen.\n\nThe new permissions apply to your file after you click OK.\n\nIf\
    \ you’re logged in to your user account, you can only set permissions on your\
    \ own files. If you’re logged in as root, you can set permissions on any file\
    \ on the machine, including those in other user accounts.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_277_0.png)\n\
    \nBe careful when messing with files in other people’s accounts. Root has a lot\
    \ of privileges that can screw up everyday relationships if you let the “power\
    \ of root” go to your head. Use root powers to fix obvious security holes and\
    \ help your users keep their data secure. Don’t use it to get revenge by making\
    \ your roommate’s journal publicly readable.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_277_1.png)\n\
    \nA lot of the problems that people normally encounter when working with Linux\
    \ are file permission problems. It’s easy to get permissions set wrong without\
    \ really noticing it. If you have some sort of access problem with a particular\
    \ file or directory, check the permissions profile before you try anything else.\
    \ You can often fix a frustrating situation with an easy click or two.\n\nYou\
    \ should know about a couple more of security’s finer points. These are especially\
    \ important when you have other users on your machine.\n\n> ✔ The biggest “D’oh”\
    \ we can think of is leaving passwords taped to your monitor or keyboard. Particularly\
    \ the root password. Memorize it and don’t leave it lying around in the open.\n\
    > \n> ✔ We also strongly advise against doing routine work in your root account.\
    \ Save root for special stuff. Use your user account for daily stuff.\n> \n> ✔\
    \ If you’re not using a graphical login screen, make sure you log out of your\
    \ shell account as well as log out of KDE at the end of a session.\n> \n> ✔ Get\
    \ into the habit of picking a secure password: not your name, not your street\
    \ name, not your phone number. A good tip is to mix numbers and letters, both\
    \ upper- and lowercase.\n> \n> ✔ If you really want to enforce password security,\
    \ install a program that forces your users to change passwords every 30 days and\
    \ doesn’t permit repeat use of the same password. Such programs can be found in\
    \ various archives on the Internet. Be aware, though, that rapid password turnover\
    \ can often lead to the direct opposite of the desired effect. Users who find\
    \ it hard to remember passwords will just write the new one down and tape it to\
    \ the monitor. (See the beginning of this list.)"
  merge: -1
  img_proc: true
- pgno: 278
  md: '# # Chapter 14


    # ## Taking Control — the KDE Control Center


    +   In This Chapter

    +   * One-stop configuration shopping

    +   * Setting up a graphical login screen

    +   * Setting the lowdown on your system

    +   * Tweaking the keyboard and mouse


    In the course of familiarizing yourself with KDE, you''ve probably used its many
    configuration tools to make your desktop uniquely yours. Perhaps you changed the
    theme, or you put certain icons onto the panel and removed others. One of the
    nice aspects about KDE is how configurable it is; that''s one reason why KDE is
    so popular.


    In much the same way that you configured the appearance of your desktop with KDE
    tools, you can configure your computer itself with other KDE tools. KDE gives
    you simple ways in which to work with the level that lies underneath your desktop:
    Linux itself. Most of the Linux configuration tools are located in the KDE Control
    Center, the focus of this chapter. You can access the Control Center via its icon
    in the panel: a half-monitor, half-circuit board icon.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_278_0.png)


    You find two different kinds of tools in the Control Center. You can use options
    that affect individual user accounts no matter how you''re logged into the machine.
    But if you want to use a tool that affects your entire system, you need to log
    in as root. You can access the root account with two different methods: Either
    log out of your user account and relogin as root or use the KFM superuser mode,
    as described in Chapter 13. Either way, be sure that you log out of the root account
    after you finish your task, because you don''t want to leave the root account
    open without needing it to be available.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_278_1.png)


    As we mention before, logging in as root can be dangerous. Making irrevocable
    changes without realizing it is quite easy. Make a habit of logging into your
    regular user account; if you really need to log in as root, you can do so intentionally.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# ## Setting Up a Graphical Login Screen


    Admit it — part of the reason you installed KDE in the first place was that you
    simply find the graphical interface more pleasing than plain old white text on
    black background. So maybe it bugs you that you have to exit KDE and go back out
    to the text prompt after you''re done with your session, leaving your computer
    to look like any other UNIX-type machine with its simple little `login: prompt`
    sitting there quietly.


    The solution is to create a graphical login screen. After you have it set up,
    you never need to stop running KDE if you don''t want to. Go ahead and log out
    as you normally do. Instead of exiting KDE, though, your computer returns to a
    graphical login screen — but KDE is still going! No more typing `startx` after
    logging in, no more waiting for the desktop to appear.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_279_0.png)


    We have to apologize to you, gentle reader. Normally, we stick in a couple of
    pictures to show you exactly what the graphical login screen looks like. In fact,
    we take screenshots, exactly as we describe the process in Chapter 11. Unfortunately,
    in order to take a screenshot, we have to be logged into the computer so that
    we can use KSnapshot. Do you begin to see the problem? We can''t get the login
    screen on the monitor until we log out — but we can''t take a screenshot until
    we''re logged in. So, you have to trust us that this works: give it a try to see
    what your login screen looks like. If you don''t like it, you can always turn
    the screen off (We did include some illustration of screens you use in setting
    up the graphical screen.)


    ![](img/8dd43d91b80664e771e0c0a824d7392d_279_1.png)


    You must log in as root to create a graphical login. You do not need to log in
    as root to use the graphical login; everyone with user accounts on your machine
    sees the graphical login screen after you set it up.


    Here''s how you set up a graphical login screen:


    +   1.  **Log in as root.**

    +       If you have to log out of your user account and back in as root, do so
    now.


    +   2.  **Open the KDE menu and choose `Settings::Applications::Login Manager`.**

    +       The Login Manager screen (\"KDM Configuration\") appears, as seen in Figure
    14-1.


    +   3.  **Click the Appearance tab.**

    +       This should be the default; if it isn''t, just click it now.

    +       The Appearance tab contains a whole slew of options for you to choose
    from. You can decide whether to use a greeting message, a logo, or one of several
    \"GUI styles\" that set the overall look of the screen. Make your selections on
    this tab.'
  merge: -1
  img_proc: true
- pgno: 280
  md: "![](img/8dd43d91b80664e771e0c0a824d7392d_280_0.png)\n\n+   4. **Click the Fonts\
    \ tab.**\n+   \n+   On this tab, you can select the font that you want to appear\
    \ on your login screen. You can pick a larger font size because the size of the\
    \ login screen doesn't change, no matter how small the font you select may be.\n\
    \n+   5. **Click the Background tab.**\n+   \n+   If you want a particular background\
    \ on your login screen, you can select it on this tab. Select the Browse option\
    \ to locate a particular background image file on your machine.\n\n+   6. **Click\
    \ the Users tab.**\n+   \n+   This tab enables you to enter certain users into\
    \ a drop-down box on the login screen, saving those users the keystrokes of typing\
    \ in their user IDs. (Users still have to type passwords by hand, though!)\n\n\
    +   7. **Click the Sessions tab.**\n+   \n+   On this tab, shown in Figure 14-2,\
    \ you can identify the users who are allowed to issue shutdown and reboot commands\
    \ directly from the login screen. Be very careful with this option; putting your\
    \ own user ID here is usually okay, but don't give everyone on your system shutdown\
    \ powers. You never know what your housemates may get up to.\n\n+   8. **Click\
    \ OK after you finish with all the tabs.**\n+   \n+   The Login Manager screen\
    \ closes.\n\n+   9. **To start graphical login mode, issue the command `init 5`\
    \ while you're logged in as root.**"
  merge: -1
  img_proc: true
- pgno: 281
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_281_0.png)


    Figure 14-2: Determine who has “The Power” and who doesn’t on the Sessions tab.


    Do this in the same way you’d issue any command-line messages; open a terminal
    window and type init 5 at the prompt.


    The next time you log out, the computer resets itself to graphical login mode
    and the login screen appears.


    Using the graphical login screen means that you save a little bit of time during
    the login process. Because KDE continues to run in the background when you are
    in graphical login mode, you don’t lose the time taken up by loading the desktop
    GUI each time someone logs in.


    You may find that you simply don’t like the graphical screen, or you may want
    to use your computer in text mode enough that the graphical screen is inconvenient.
    Luckily, turning off graphical login mode is as simple as turning it on. To return
    to text login mode, use these steps:


    +   1. **Log in as root.**


    +   2. If you’re in graphical mode, open a terminal window or exit to text mode.


    +   3. **Type init 3 at the command prompt.** You just changed run levels (see
    Chapter 13) from Run Level 5, which automatically starts the X Window System,
    to Run Level 3, which automatically starts in text mode.


    +   4. **Log out of the root account.**'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'Should you ever want to return to the graphical login screen, just log in as
    root and type `init 5` at the command prompt. This changes the run level back
    to Run Level 5 and enables the graphical login again. You can reconfigure its
    appearance in the Login Manager, as you did above.


    # ## Getting the Lowdown on Your System


    As soon as you make the commitment to running Linux, you enter the world of information.
    You can find out anything you want to about your system, and getting to that information
    isn’t usually a matter of navigating through many submenus to choose an oddly
    named tool. People who run Linux tend to be the sort of people who want all the
    information they can get about their systems anyway. As with many other things,
    KDE makes this easier for you by putting a lot of the tools you need right at
    your fingertips in the Control Center.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_282_0.png)


    You don’t have to be obsessive about monitoring your system. You have no reason
    to check each of these tools two or three times during the day. Do make a habit,
    though, of checking them regularly — maybe once every week or two, or more often
    if you know you’ve put a bit of stress on your system by downloading large files
    from the Internet or adding a lot of new software.


    # ## How much disk space do I have left?


    Ah, probably the most frequently asked question in the computer world. How much
    disk space have I got left? Do I need to clean out some directories, stop automatically
    downloading Backstreet Boys fan fiction, change the cache size in Netscape, transfer
    my 3,000-page novel in progress to a Zip disk? Or do I just need some sort of
    justification so that I can go to the computer store and pick up a new multi-gig
    hard drive? (Hey, take your excuses for new hardware where you can find them.)


    To find out how much disk space you have left for those high-resolution Ricky
    Martin pictures, use this process:


    +   1.  Click the Control Center icon in the panel.

    +       2.  Choose InformationBlock Devices.

    +           The Block Devices window opens.

    +       3.  Click the KDiskFree tab.

    +           The KDiskFree window appears, as seen in Figure 14-3, showing each
    partition on your hard drive, its size, the amount of free space left, and how
    full it is (expressed as a percentage).'
  merge: -1
  img_proc: true
- pgno: 283
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_283_0.png)


    Figure 14-3: KDiskFree gives you specific information about hard drive usage.


    +   4.  To change the information shown, click the General Settings tab.


    Here, you can control what information appears after you open KDiskFree and how
    often that information is updated.


    KDiskFree opens by default whenever a partition becomes critically full. You can
    turn that behavior off on the General Settings tab, but please don''t. The default
    is quite useful, especially if you don''t realize you''re putting such strain
    on your diskspace.


    +   5.  Click OK after you finish looking at KDiskFree.


    The Block Devices screen is a useful feature to have around for information other
    than in KDiskFree. You can use Block Devices to see what file systems are currently
    mounted, such as a CD-ROM drive, a floppy disk, or a network file system if you''ve
    networked.


    You can use the Block Devices screen as a regular user in order to determine what''s
    mounted. But, if you''re logged in as root, you can also use Block Devices to
    mount and unmount disks and network partitions. See Figure 14-4 for a Block Devices
    screen accessed by the root account on a networked computer.


    TIP


    TECHNICAL STUFF'
  merge: -1
  img_proc: true
- pgno: 284
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_284_0.png)


    You have no universal standard to judge how full your disk partitions should be.
    You may have perfectly good reasons for packing partitions as full as you can,
    or you may be the sort of person who gets anxious if you have less than 60 percent
    or 75 percent of disk space available. A good rule to follow is if you have to
    check to see if you have space available every single time you want to download
    something or add a new program, you probably need to clean out your hard drive.


    With the price of drives dropping by the day, and the amount of space needed to
    hold most programs being released, hard drives that hold a gigabyte or more of
    information have become the new standard. You can blur the edges a bit if you
    use removable media such as Zip or Jaz drives, or even 1.44MB floppy disks, and
    Linux itself is simply smaller than Windows 95 or 98. Still, if you worry about
    disk space, invest a hundred bucks or so and pick up a larger hard drive. It’s
    a hardware investment that’s difficult to regret.


    # How much memory am I using?


    Just like hard drive space, everyone wants to know about their computer’s memory
    usage. Rightly so! Memory is the difference between a three-cylinder Geo Metro
    engine and the raw horsepower of a Lamborghini, all in the same machine case.
    If you ever wonder about your own memory use, let the KDE memory tools give you
    the answers.


    Of course, you have the most basic memory tool at your disposal already. If the
    computer just seems sluggish, or its routine tasks are taking longer than usual,
    memory is probably the issue. If you ask your computer to perform more tasks than
    it has available memory to complete, it needs to swap out that precious memory
    space—and that takes time. The more you work with your computer, the easier it
    will be to sense a memory problem.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '*Just the facts*

    If you just want to know how your computer is using memory, use Control Center\ControlInformation\Memory
    to open the KDE Memory tool. The Memory screen, shown in Figure 14-5, gives you
    a variety of information about how your computer is currently using its memory.


    If you see that you have little or no free memory, or that a lot of swap memory
    is being used, you can be pretty sure that you''ve located the source of your
    machine''s sluggishness.


    *Swap memory* isn''t actually RAM. Rather, swap memory is an amount of space on
    your hard drive that you allocated when you set up Linux for the first time. If
    you ask your computer to perform an action that takes more memory than it has
    available, your computer will move some items from RAM onto the swap space on
    the hard drive, and exchange items between RAM and swap until the requested actions
    are completed. If your computer swaps a lot, you need to add RAM to reduce the
    system load.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_285_0.png)'
  merge: -1
  img_proc: true
- pgno: 286
  md: "# Chapter 14: Taking Control — the KDE Control Center\n\n# More information,\
    \ please\n\nSo, you determine that your memory is indeed working overtime. What's\
    \ causing the problem? It can be anything from too many programs open at one time,\
    \ to a background process you didn't realize was running, to an otherwise innocuous\
    \ program with a slow memory leak. To find the culprit, let the KDE Process Management\
    \ tool tell you what's going on.\n\nOpen the KDE menu and select *Utilities->Process\
    \ Management* to open the Process Management screen. In this window, like the\
    \ window shown in Figure 14-6, you see a list of all the programs currently running\
    \ on your machine—both system programs and programs you opened.\n\nNext to each\
    \ program listed, you see the percentage of system memory that program is currently\
    \ using. If you have a program using an unusually large amount of memory, you\
    \ may want to exit it. You can also close down other programs to give the memory\
    \ hog more room in which to work, if you need the larger program open for a particular\
    \ reason.\n\n> **WARNING!**\n> \n> When you look at the process table, you notice\
    \ that KDE itself uses a large chunk of memory for its various functions. This\
    \ memory use is something you just have to accept; KDE uses quite a bit of memory\
    \ to keep the graphical interface working seamlessly. This large memory use is\
    \ probably the biggest drawback to graphic interfaces for Linux, because you have\
    \ no way around the fact that graphics need memory.\n\n# Figure 14-6:\n\nUse Process\
    \ Management to get useful details about memory usage.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_286_0.png)"
  merge: -1
  img_proc: true
- pgno: 287
  md: 'So what do you do if you don’t have enough memory to go around? First, find
    out what kind of memory your computer uses. You can find this out with a quick
    browse through the manufacturer documentation or Web site or with a not-so-quick
    call to customer service. Most memory is pretty cheap these days. If your machine
    takes a popular module such as SDRAM. For those of you with machines that are
    more finicky and require something slightly more obscure, such as 72-pin DRAM
    DIMMs, expect to pay a bit more — two or three dollars per megabyte, rather than
    a dollar.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_287_0.png)


    Regardless of the price, a memory upgrade is one of the cheapest ways to spiff
    up your computer. You will definitely notice the difference in the performance
    of KDE and probably in your favorite applications as well. Working comfortably
    in simultaneous windows, while running KDE, is hard to imagine without at least
    32 megabytes of RAM. Many folks insist that you can’t run KDE and other programs
    with less than 96 or 128 megabytes of RAM. The exact number is quibble-worthy,
    but the point is clear: You work faster and your machine strains less if you add
    RAM.


    # What else can you tell me?


    Several other information tools are in the Control Center, described in the following
    list. Taking a look at all of them is worthwhile. You can find out all sorts of
    details about your computer: where the interface to your hard drive is stored
    in the memory, what PCI devices you have installed already, and so on. Sure, you
    may think that you will never need this kind of information and that having specific
    tools dedicated to this information is a waste of resources, but trust us. There
    will come a time when you need to know, and you’ll be glad of a specialized tool
    that will save you some time.


    +   - **Devices:** The Devices tool tells you, perhaps obviously, what devices
    you have loaded on your computer. A device is anything that provides input or
    handles output (see I/O ports in this list), but is often used to refer to those
    parts of the computer that are removable and upgradable.

    +   - **DMA-Channels:** This tool provides information about Direct Memory Access,
    or DMA. DMA helps to speed up your computer by permitting data to be sent directly
    to the computer’s memory from an attached device (such as a CD-ROM drive). Because
    the microprocessor chip doesn’t have to be involved, your computer operates more
    quickly.

    +   - **Interrupts:** This tool helps you mind your IRQs, or Interrupt Request
    values. Each device has a unique IRQ so that the computer knows how to interpret
    various signals it receives as it processes data. You can cause huge snafus if
    you inadvertently assign the same IRQ to two different devices.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '✈ IO Ports: IO ports, or Input/Output Ports, can cause quite a bit of hassle
    if you don''t know which device uses which port. An I/O device is anything attached
    to your computer that either provides data to the computer, or handles data created
    by the computer: keyboards, monitors, scanners, and so on.


    ✈ Partitions: Don''t know how your hard drive is partitioned? Check it here. (Partitions
    allow you to manage the space on your hard drive more efficiently.)


    ✈ PCI: What''s occupying your PCI slots? (Knowing this information can be very
    handy if you''re faced with a great deal on an ebay auction, but you''re not quite
    sure if you have any available PCI slots for the new toy.)


    ✈ Processor: This tool gives you some extremely useful information about the processor
    on your motherboard. You can learn the type of processor, manufacturer, speed,
    and all the other information you need to get into a bragging war.


    ✈ SCSI: Got SCSI devices installed on your machine? Check ''em here.


    ✈ Samba Stats: If you''re running Samba for your local network, you can check
    it out here. (Samba is a program that allows you to share files over a network
    with both Linux and Windows 95 or 98 computers.)


    ✈ Sound: This tool is currently not supported. In future releases of KDE, it will
    contain information about your sound card.


    ✈ X Server: For information about your X Window System server and useful if things
    go kablueey and you have to explain your set-up to someone who understands X.
    (And if you find that person, treat her nicely! Such people are worth a great
    deal.)


    # Tweaking Your Keyboard and Mouse


    True, most of us just plug in our input devices and go our merry ways. You can
    make your keyboard and mouse more responsive to your individual habits, though,
    with a few nifty KDE tools.


    In the KDE Control Center, you find several keyboard tools that allow you to minimize
    the number of keystrokes it takes to perform a given action, to get your keyboard
    responding properly to the way you type, and to permit the use of non-English
    keyboards. Mouse tools let you set speed and responsiveness of the cursor. We
    also include a non-computer procedure in this section, so that you can keep your
    mouse clean and happy, thus avoiding one of the major reasons for mouse trouble.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# # The mysterious configuration file


    Keep in mind that KDE, despite its many graphical features, is still just an overlay
    on top of Linux itself. After you click an icon on the KDE desktop, the computer
    interprets that click as an issued command — the same as if you typed the command
    at a text prompt. KDE gives you the option to use graphical tools instead of learning
    the text commands.


    ```

    # KDE Config File


    [KDE]

    widgetStyle=Motif

    macStyle=off


    [Global Keys]

    Kill window

    mode=CTRL+ALT+Escape


    Pop-up system menu=ALT+F1

    Window toggle sticky=

    Window move=

    Task manager=CTRL+Escape

    ```


    In the same way, if you use the Control Center to change your mouse’s behavior
    or to set up a graphical login screen, you’re really editing your configuration
    files. A configuration file is a text file, and you have several scattered throughout
    your directories that control different facets. (You sound “in the know” if you
    refer to them as config files.)


    The sample shows how we configure the basic appearance of KDE and a few global
    keystroke combinations.


    To see a sample configuration file, fire up KFM and open your home directory.
    Choose View → Show Hidden Files. Now, in the file listing, look for a file called
    `.kderc`. This file is the main config file for personal KDE configuration for
    features such as icons, themes, global keys, and so on. Here’s an excerpt from
    the `.kderc` file on one of the computers we used to write this book:


    You can find other personal configuration files in your `.kde` directory (be sure
    to include that leading dot). Config files for the whole system are located in
    various subdirectories under `/opt/kde`. (You may need to log in as root to view
    these.)


    As a general rule, don’t muck around in these files for fun, or you may find yourself
    unable to use your computer. Knowing that the files are there, however, is still
    good. Should it come to pass that something is so broken that a KDE Control Center
    tool can’t fix it, or that your Control Center is somehow corrupted, you know
    where the config files are so that you can edit them by hand.


    # ## Typing up a storm


    If a hundred chimpanzees with Smith-Corona manual typewriters may eventually compose
    *Hamlet*, just imagine what you can do with a streamlined and personalized keyboard!
    You can configure several things in the KDE Control Center, including custom keystroke
    combinations, keyboard layout, and basic settings to match your typing style.'
  merge: -1
  img_proc: true
- pgno: 290
