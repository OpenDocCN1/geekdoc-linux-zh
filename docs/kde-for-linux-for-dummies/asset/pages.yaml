- pgno: 158
  md: '# Chapter 8


    # Getting Connected


    # In This Chapter


    +   - Getting an account with a Linux-friendly ISP

    +   - Configuring a Linux account

    +   - Tinkering with your modem

    +   - Hooking up with an Ethernet connection

    +   - KDE''s network utilities: quick troubleshooters


    A

    c

    fter you have KDE set up and configured just the way you like it, you may want
    to start using your computer for things besides tinkering with the desktop. At
    the very least, you probably want to connect to the Internet, whether it''s to
    download more neat KDE stuff or to share your joy about your new desktop with
    friends and strangers alike.


    The KDE connection process is simple for Linux users who have already connected
    their machines to the Internet. If you are one of those already connected, skim
    through this chapter and confirm that your settings are correct. Unless you have
    some unexpected connection problems, though, feel free to jump off to the end
    of this chapter, where we cover Ethernet and some basic network diagnostic tools.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_158_0.png)


    If you''ve never connected your Linux machine to the Internet, you have some work
    ahead of you. Luckily, it''s a pretty straightforward process; just remember to
    complete all the steps. You also have to get in touch with your current *Internet
    Service Provider*, or *ISP*, to see if it supports Linux or other UNIX-based operating
    systems. Many don''t, including America Online. You''ll probably have better luck
    looking for a smaller regional or local ISP than for one of the HumongolSPs that
    are clearly targeted at Windows users.'
  merge: -1
  img_proc: true
- pgno: 159
  md: "Connecting your computer to the Internet requires a couple of things.\n\n+\
    \   A **modem**, the piece of hardware that uses your phone line to transfer information\
    \ between your computer and another computer.\n+   \n+   An account with an **Internet\
    \ Service Provider (ISP)**.\n+   \n+   A working installation of KDE.\n\nSure,\
    \ you can get on the Internet without KDE, but one of the tools that KDE gives\
    \ you is called Kppp, and it’s a fast and flexible way to get all of those components\
    \ talking with each other so you can get online. Kppp takes the information you\
    \ give it about your ISP and your modem and sets up your computer to use that\
    \ information so that you don’t have to think about it.\n\nKppp is another way\
    \ in which KDE makes your computing life easier and simpler. All you have to do\
    \ is type some stuff in, and KDE does the rest of the work. Not bad!\n\n# Ready,\
    \ Get Set...\n\nWhat does it take to be Linux friendly? The most basic requirement\
    \ is that the ISP permits its users to connect via UNIX-based operating systems\
    \ and software. Beyond that, a Linux-friendly ISP should give its technical support\
    \ staff some Linux training basic enough to answer those frantic “What do I do\
    \ NOW?” calls. It’s nice to have Linux-specific FAQs available on the company’s\
    \ Web site. Many ISPs use proprietary software (like AOL or MindSpring); make\
    \ sure that it’s not required, because it’s almost always available only for Windows\
    \ or Macintosh.\n\n> We assume that you already have an account with an ISP that\
    \ is at least Linux aware, if not downright Linux friendly. If you haven’t gotten\
    \ that far, take a look at this chapter’s “Do you speak Linux here?” sidebar.\
    \ We’ve consolidated some of the basic questions you should ask an ISP about its\
    \ Linux friendliness.\n\nYou really don’t want to have the experience that we\
    \ once had when calling a local ISP with a login problem. The tech support person\
    \ said, “But you can’t use Linux to connect to our system! We don’t permit it!”\
    \ (He was confused about the difference between permitting access from Linux users\
    \ and supporting access from Linux users.) That was an odd response, given that\
    \ probably half the ISP’s user base was composed of hardcore UNIX sysadmins, and\
    \ it’s the sort of answer that sends chills down the spine of a newer Linux user\
    \ with a question."
  merge: -1
  img_proc: true
- pgno: 160
  md: "# Do you speak Linux here?\n\nFinding a Linux-friendly (or at least Linux-compatible)\
    \ ISP can sometimes be a tricky process. Living near a major metropolitan area\
    \ may or may not be helpful. Most of the major national (and international) ISPs\
    \ are really slanted toward the Windows user: they use proprietary software that's\
    \ released in Windows format and that may make it difficult for even Macintosh\
    \ users to get a compatible copy of the software.\n\nHowever, many of the mega\
    \ ISPs — including EarthLink, MindSpring, and WorldNet — claim to be open to Linux\
    \ users. If you like the reliability of a major corporation and the freedom to\
    \ move around the country without losing local dial-up numbers, you may want to\
    \ look into accounts with the large ISPs. The major drawback is likely to be on\
    \ the tech support end; if you call WorldDominator.net's tech support line with\
    \ a problem, the one person who knows Linux may be on break. In the worst-case\
    \ scenario, the tech support person may even insist that the ISP doesn't support\
    \ Linux. Because a massive majority of their customers use Windows, there isn't\
    \ a pressing need for the large ISPs to offer Linux-specific support.\n\nBefore\
    \ you decide to go with a major corporate ISP, take a look at your local options.\
    \ You may find happiness with a small ISP that's run out of an office park a few\
    \ miles away and is based on Linux or a newer UNIX-based operating system. There,\
    \ you may not compete with hundreds of thousands of other users for tech support.\
    \ Check out some Linux-friendly ISPs at http://howto.linuxberg.com/isp.html.\n\
    \n> **WARNING!**\n> You may not have very good luck convincing an ISP to be Linux\
    \ friendly if it's running Windows NT. We aren't saying this just to Windows-bash;\
    \ it's a serious philosophical difference that you need to consider when looking\
    \ for an ISP. Companies that choose NT as their main operating system have deliberately\
    \ chosen not to run UNIX or a UNIX-based operating system; you may be better off\
    \ looking for a non–Windows NT ISP if one is available in your area.\n\nWhen you've\
    \ selected three or four possible ISPs, start making some phone calls or sending\
    \ some e-mail. Ask each ISP the same questions, and then compare the answers when\
    \ you're done phoning around. Here are some basic questions to ask:\n\n+   ✔ Do\
    \ you support Linux?\n+   \n+   ✔ Do any of your users use Linux? How many?\n\
    +   \n+   ✔ Do you have support materials written for Linux users?\n+   \n+  \
    \ ✔ Are your technical support personnel trained to answer questions about your\
    \ service from Linux users?\n+   \n+   ✔ Are your accounts normal PPP accounts?\
    \ (That is, can I use any programs designed for use with a regular PPP connection?)\n\
    +   \n+   ✔ Do you use any proprietary protocols or software? Are they required?"
  merge: -1
  img_proc: true
- pgno: 161
  md: 'After you are hooked up with a good ISP, it’s time to get your connection going.
    Get some basic information together in front of your computer, so that you don’t
    have to search in the middle of the process. You need nine pieces of information:


    +   Your login ID, also known as your *username*.

    +   Your account password.

    +   The phone number your computer will dial to access the ISP.

    +   The authentication type used by your ISP, if it uses authentication.

    +   How your ISP assigns IP numbers: static or dynamic. If your ISP assigns static
    IP numbers, you need your IP number and the subnet mask.

    +   The IP numbers of the DNS servers.

    +   Gateway information. (You probably won’t have specific numbers for this section,
    because ISPs often shift gateway functions from machine to machine. See the numbered
    steps in the next section for more information about gateways.)

    +   The device name of your modem. (This should look something like /dev/modem
    or /dev/cua1.)

    +   Whether you need to use hardware or software flow control.


    Confused yet? Don’t worry. Your ISP probably has most of this information typed
    up for you already: it’s either in the sign-up material you received, or it’s
    available on their Web page. (Obviously, it’s kind of hard to go to a Web page
    if you’re not connected to the Internet yet, but representatives can tell you
    this stuff over the phone or via fax as well.) All these terms are defined as
    configuring your connection is described.


    # ## Plugging in your information


    Now that you have everything together, it’s time to get started.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_161_0.png)


    The configuration process is filled with acronyms and numbers. Make sure you type
    everything into the text boxes exactly as they’re written on your information
    sheets. Use the same capitalization and dot placements. Otherwise, you’ll have
    to do all of this again, and you have better things to do with your time!


    ![](img/8dd43d91b80664e771e0c0a824d7392d_161_1.png)


    +   Open the KDE menu and select Internet::Kppp.

    +   To open the KDE menu, click the button with the KDE logo in the panel. The
    KDE menu pops up, from which you can select your choices. For more information
    on using the KDE menu, see Chapter 1.

    +   The Kppp dialog box appears, as shown in Figure 8-1. Kppp is the handy KDE
    way to configure PPP connections. PPP (Point-to-Point'
  merge: -1
  img_proc: true
- pgno: 162
  md: "Protocol) is the most common way to connect to the Internet through your ISP.\n\
    \n+   2. **Click the Setup button.**\n\nThe Kppp configuration screen appears,\
    \ with the Accounts tab already chosen.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_162_0.png)\n\
    \n+   3. **Click the New button.**\n\nThe New Account dialog box opens and the\
    \ Dial tab is already chosen.\n\n+   4. **Enter or select the connection name,\
    \ phone number, and authentication type.**\n\n+       - The connection name can\
    \ be anything you want. It's probably easiest to use the ISP's name here, but\
    \ if you have a burning desire to name your connection after your Aunt Ethelfrieda,\
    \ go right ahead. (Then give her a call and tell her of the honor you've bestowed.\
    \ She'd love to hear from you.)\n+   \n+       - Your ISP may have multiple dial-in\
    \ numbers for its modems. If you need to select a number based on your modem's\
    \ speed, choose the one that matches your modem's highest speed. Dialing in to\
    \ a higher-speed modem does not make your connection faster, and it blocks a line\
    \ for someone who needs the faster modem.\n+   \n+       - If your ISP says that\
    \ its authentication type is None — and many do — choose Script Based as your\
    \ authentication type. It won't hurt anything. You have to choose something.\n\
    \n+   5. **Click the IP tab and then do one of these two things:**\n\n+      \
    \ - Select the Dynamic IP Address option.\n+   \n+       - Select the Static IP\
    \ Address option and enter your IP Address and Subnet Mask.\n\nFigure 8-2 shows\
    \ the IP tab of the New Account dialog box. Unless you paid extra to get a static\
    \ IP number, chances are overwhelming that you have dynamic IP allocation and\
    \ don't need to change a single thing on this tab."
  merge: -1
  img_proc: true
- pgno: 163
  md: 'If your ISP assigned you a static IP number, select the Static IP Address option
    and enter your IP address and subnet mask into the appropriate text boxes.


    **6. Click the DNS tab and enter the DNS IP numbers you received from your ISP.**


    You should have two domain name server (DNS) IP numbers from your ISP. Enter the
    first one into the DNS IP Address box and click Add. The number drops down into
    the DNS Address List area, like the screen shown in Figure 8-3. Repeat the process
    with the second number. If, too, drops down into the DNS Address List area.


    **7. Click the Gateway tab at the top of the window.**


    You probably won''t have to enter any information on this tab. The *gateway* is
    the computer that manages all the traffic between your ISP and the entire Internet.
    Usually there is only one gateway and it''s set up as the *default gateway*. That
    means that your ISP can move gateway responsibilities to a different computer
    if necessary, but you don''t have to change anything.


    You are told if, for some rare reason, your ISP runs more than one gateway. In
    this case, your ISP gives you a static IP number to enter at this step.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_163_0.png)


    **Figure 8-2:** On the IP tab, set up the way that your ISP assigns a unique identifying
    number to your computer while you''re logged on.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Why the static?


    What''s the difference, right? Well, an *Internet Protocol address* (IP number)
    is a string of numbers that identifies a given computer on the Internet. Because
    most ISPs have many more customers than they have IP numbers to give out, the
    numbers are assigned *dynamically*. That is, when you log on, your computer gets
    the next available number; when you log off, someone else gets it. A *static IP
    number* means that you


    have a specific string of numbers that identifies your computer all the time,
    whether or not you''re logged on. This isn''t necessary for most users, who do
    just fine with a *dynamic IP*. If you think you need a static IP, look into getting
    a cable modem or more advanced connection services like DSL or ISDN, which usually
    assign static IP numbers because the connection is always on.


    Primary DNS server


    Secondary DNS server


    ![](img/8dd43d91b80664e771e0c0a824d7392d_164_0.png)


    Figure 8-3: Without DNS information, you can''t reach addresses across the Internet.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Matching names and numbers


    Another acronym? Yep. DNS stands for Domain Name Server, and it''s the computer
    at your ISP that hooks up an individual computer with its IP number; every computer
    attached to the Internet (including yours) has a unique identifying number, and
    the DNS machines at the ISP do nothing but find those numbers for you.


    You have to tell your computer where to find the DNS machine so that you can do
    things like look up Web pages by using the domain name instead of the IP number.
    And you need two IP numbers because the ISP spreads the load across more than
    one machine.


    +   8. Click the Login Script tab and edit the login script your system will use
    to pass your username and password to the ISP''s computer.\n\nHere, you set up
    the series of prompts and responses that enable your computer to automatically
    log onto your ISP''s network. If your ISP doesn''t require a text-based login,
    you can leave this page blank. (Many ISPs don''t require a text-based login —
    they let your username and password automatically, as part of the connection protocol
    negotiations.)\n\nA text-based login is exactly what it sounds like: KDE prompts
    you for your username and password, and you type it in. The advantage of a text-based
    login is that you have to confirm that you want to log in (and prove you''re you
    by remembering your password). The disadvantage is that it takes some time, and
    you have to be in front of your computer. Using a login script automates the process.\n\nIf
    your ISP does require you to use a login script, you need to create one from scratch.
    For help in writing a basic script, see the next section of this chapter, \u0022The
    scriptwriting award goes to...\u0022


    +   9. Click the Accounting tab at the top of the screen.\n\nKDE''s Accounting
    feature tracks how much data you have uploaded or downloaded through your ISP
    connection. You''ll probably only need this option if you have a metered-access
    account. This is fairly rare in the United States, where time limits on usage
    are much more common than bandwidth limits. Readers outside the United States
    may find this option useful for tracking costs; United States users will probably
    only use it for curiosity''s sake.


    +   10. Click the OK button.\n\nThe New Account screen closes, and you return
    to the Kppp Configuration dialog box. In the next section of this chapter, you
    continue to use Kppp Configuration to make sure that KDE and your modem are working
    together, so leave it open.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Huzzah! You are more than a third of the way through the ISP connection process.
    Next, you configure your modem and then test the setup. For now, though, take
    a break and stretch out. You should also take a minute or two to create a safe
    space for your ISP information, especially that sheet with all the IP numbers
    on it. Nothing is more irritating than needing to redo your configuration and
    not knowing where your IP information is.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_166_0.png)


    Don''t keep your password with your other ISP information. In fact, don''t get
    in the bad habit of writing down passwords. An even worse habit is writing down
    your passwords and leaving them someplace convenient, like your top desk drawer
    or taped to the monitor. Passwords work because they''re secret; making them public
    by writing them down defeats the purpose of requiring passworded access.


    # ### The scriptwriting award goes to...


    If you need to use a login script in order to connect to your ISP, you have to
    spend a few minutes putting one together. Setting up a login script can be a little
    tricky; not all ISPs use the same sequence of events to handle logins. Following
    the steps given here produces a script that ought to work for most ISPs, but you
    may have to experiment and revise it a bit. (This is one of those times where
    it really helps you solve a problem if your ISP''s tech support knows something
    about Linux.)


    Begin creating a login script on the Login Script tab (as shown in Figure 8-4)
    of the Kppp Configuration screen. If you closed Kppp after the previous section
    or you need to add or adjust a script after you finished configuring Kppp, reopen
    Kppp. Open the KDE menu and select Internet\u0005Kppp.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_166_1.png)'
  merge: -1
  img_proc: true
- pgno: 167
  md: '+   1. **Type** *origin:* in the text box to the right of the word **Expect**;
    click **Add**.

    +   Both words, *Expect* and *origin*, appear in the lower text area.

    +   Use *origin:* — not *Login:* or *Login:*. Some ISPs use the uppercase and
    some use the lowercase. If you leave out the L, you neatly avoid the entire problem.
    You''ll need to drop the initial letter of each “Expect” entry in your script,
    as in Step 5. “Send” entries (your username and password) should be typed in full.


    +   2. **Click the arrow to the right of the word** *Expect*; **select** **Send**
    **from the drop-down list box that appears.**

    +   *Expect* is replaced with *Send*.


    +   3. **Type your username in the box immediately to the right of** **Send**
    **and click** **Add**.

    +   The word *Send* and your username appear in the lower text area.


    +   4. **Click the arrow that accompanies the word** **Send** **in the upper-left
    box; select** **Expect** **from the drop-down box that appears.**


    +   5. **Type** **password** **(without the p), plus a colon, in the box immediately
    to the right of** **Expect**, **as shown in Figure 8-5. Click** **Add**.

    +   You left out the P for the same reason you left out the L in login. Leaving
    it out avoids case confusion with your ISP.


    +   6. **Click the arrow that accompanies the word** **Expect** **and select**
    **Send** **from the drop-down box that appears.**


    +   7. **Type your password in the entry box to the right and then click** **Add**.


    That completes a basic login script; you can see what it should look like in Figure
    8-5. If this script doesn''t work for you, ask your ISP what you need to do. The
    underlying principles of all login scripts are the same: Tell your computer what
    to expect from the ISP and what to send in response.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_167_0.png)'
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_168_0.png)


    # **Feel that modem mania**


    Now that you have everything set so that your computer and your ISP are feeding
    each other the proper information, you have to do a bit of tinkering with your
    modem.


    You work directly with your modem on a Linux machine two different times: when
    you set up the operating system and when you configure your PPP connection in
    KDE. This section assumes that you set up the modem correctly when you installed
    your operating system; if you didn’t, or if you’re just now installing a modem,
    finish that process first. This section is concerned with modem configuration
    only as part of setting up your Kppp connection.


    If you need help setting up your modem at the operating system level, you may
    find *Linux For Dummies, 2nd Edition* by Jon “maddog” Hall, (IDG Books Worldwide,
    Inc.) a helpful resource.


    Ready to go? Let’s dive into the wacky and weird world of modems.


    Modems are fragile little things. Those of us who live in lightning-heavy parts
    of the world know the sad sound of a modem fried by a lightning strike that traveled
    through the phone lines. (It sounds like the volume is turned way down and there’s
    a lot of static when you pick up your regular phone. In worst cases, it can confuse
    incoming calls into thinking that the phone’s off'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'the hook). The simplest protection is to unplug the modem from the jack when
    a storm is headed your way; you can also buy modem surge protectors to help protect
    the line when you’re not home to unplug.


    To configure your modem under KDE, you use a process that looks a lot like the
    New Account process. If you’re continuing from the previous section, the Kppp
    Configuration dialog box is still open. If you exited Kppp, reopen it by opening
    the KDE menu and choosing Internet->Kppp.


    +   1.  Click the **Device** tab at the top of the Kppp dialog box.


    The Device tab options appear, as shown in Figure 8-6.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_169_0.png)


    > Figure 8-6: Most of the modem configuration process takes place on the Device
    tab in Kppp.


    +   2.  Click the **Modem Device** button and choose the device name of your modem
    from the drop-down list that appears.


    If your modem was on COM1 under DOS or Windows, it’s probably on `/dev/cua0` under
    Linux. If it was on COM2 under DOS or Windows, it’s probably on `/dev/cua1` under
    Linux, and so forth. Some Linux systems make a link from `/dev/modem` to wherever
    the modem device is actually located. This is information you received when you
    installed your operating system or added a modem to your computer.


    +   3.  Enter the required information about your modem in the remaining areas
    of the Device tab.


    +   *   In the Flow Control section of the screen, select the manner in which
    your modem exchanges information with your ISP’s modem. You can choose between
    using hardware or software control. It’s usually preferable to use hardware control,
    so select CRTSCTS.

    +   *   If you want or need to use software control instead, select XON/XOFF.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '+   * Ignore the **Line Termination** option. If you''re experiencing trouble
    with your modem connection, you can try toggling this option, but it''s generally
    safe to leave it alone. Problems usually begin elsewhere.


    +   * For the **Connection Speed** option, pick the highest speed your modem can
    handle. Don''t go higher; it doesn''t help.


    The speed on the modem box is the highest. Internet connections often proceed
    at a much slower speed, but nobody wants to market their modems as "Capable of
    52K, but just try getting that speed on a regular basis!" Modem speed, like almost
    any other measure of speed on the Internet, is wholly relative.


    +   4.  **Click the Modem tab and enter a number in the Busy Wait text box,**
    shown in **Figure 8-7**.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_170_0.png)


    **Figure 8-7** shows the Modem tab. The value you place in the **Busy Wait** text
    box sets the number of seconds your computer waits before redialing if it gets
    a busy signal from the ISP. Five or eight seconds is reasonable; more than twenty
    means you''ll be waiting around a lot if your ISP is prone to busy signals.


    +   5.  **(Optional) Click the Modem Commands button and edit the settings in
    the Edit Modem Commands dialog box.**


    If you have a regular Hayes or Hayes-compatible modem, you probably don''t need
    to edit anything here. If you have another kind of modem, you may need to change
    the `init` string (the codes that tell the modem how to work). Consult your modem''s
    manual to see the `init` string for your particular unit; if it''s the same as
    the one displayed, just click the **OK** button. Look at a sample `init` string
    on the screen shown in **Figure 8-8**.'
  merge: -1
  img_proc: true
- pgno: 171
  md: "![](img/8dd43d91b80664e771e0c0a824d7392d_171_0.png)\n\nHere's where you can\
    \ get into some trouble if you're not careful. If you need to replace the modem's\
    \ initialization string, make sure you type it in exactly as it is printed in\
    \ your documentation. All those letters, numbers, and ampersands can get awfully\
    \ confusing, but one transposed letter or skipped number is the difference between\
    \ getting a dial tone and extreme frustration.\n\n+   6. Click the **OK** button.\n\
    +   \n+   The Edit Modem Commands dialog box closes, and the Kppp Configuration\
    \ dialog box reappears on your screen.\n\n+   7. Click the **OK** button.\n+ \
    \  \n+   The Kppp Configuration dialog box closes, and the Kppp dialog box reappears.\n\
    \nPhew! That's done. Put your modem manual with your ISP configuration sheets\
    \ and get ready to test.\n\n# Testing, testing, 1 2 3 . . .\n\nHave you done it\
    \ right? Will it work? Just how close are you to being online? Time to find out."
  merge: -1
  img_proc: true
- pgno: 172
  md: "If you just finished setting up your modem, the Kppp dialog box is still open;\
    \ click the Connect button. (If you closed it, open the KDE menu and select Internet<Kppp\
    \ to open the Kppp dialog box.) You should see (and hear, if you have modem volume\
    \ turned on) a normal connection to the ISP. After you've established a normal\
    \ connection, you can file away those information sheets and manuals. You won't\
    \ need to redo this process unless you buy a new modem or something at your ISP\
    \ changes (or, of course, if you change ISPs). High-five yourself and head to\
    \ Chapter 9, where we describe the basic Internet utilities that KDE provides.\n\
    \nIf you don't get a connection, move on to the \"What's Troubling You?\" section\
    \ of this chapter for some simple ways to check your connection and see where\
    \ the problem lies.\n\n# All-the-Time Online\n\nSome lucky folks don't have to\
    \ fuss with modems, init strings, or ISP busy signals. Instead, they have a direct\
    \ connection to the Internet via a cable modem or DSL connection, or they are\
    \ in a building that has full-time Internet access via Ethernet cabled throughout\
    \ the walls (usually a school or office building, though some new homes are being\
    \ built with full Ethernet wiring). Ethernet jacks look like oversized phone plugs.\
    \ You'll know if you have this kind of access, and if your Ethernet system provides\
    \ access to the Internet. If it doesn't, you'll need to use the regular ISP route\
    \ to get online.\n\nKDE doesn't have a particular set of protocols for handling\
    \ constant access via Ethernet. The functions you need are best handled from the\
    \ command line, and were probably done when you hooked up to that connection.\
    \ If you're getting a new cable modem or DSL service or you want to attach your\
    \ KDE machine to your company's network, consult your system or network administrator.\
    \ The support person at your ISP, if you're connecting from home, also ought to\
    \ be able to help. (Remember to determine whether they're Linux friendly!) \n\n\
    If you'd like to do your own research, start by consulting the *Linux Network\
    \ Administrator's Guide* on the Web. You can find the guide at http://metalab.unc.edu/LDP/LDP/nag/nag.html.\n\
    \n# What's Troubling You?\n\nNo matter how carefully you set up your connection,\
    \ there will be times when you need to do some basic troubleshooting. Two kinds\
    \ of problems exist: *problems with your computer* and *problems with the Internet/your\
    \ ISP*. This section presents the most common problems of each type and shows\
    \ you some easy ways to figure out what's wrong."
  merge: -1
  img_proc: true
- pgno: 173
  md: "# # It's coming from inside the house\n\nThe simplest problems to fix are those\
    \ that stem from a typo or a dangling wire in your computer room. If you configured\
    \ Kppp and your modem according to the steps earlier in this chapter and yet you\
    \ still don't get a connection, look through this list and try these solutions:\n\
    \n+   - Does the modem dial?\n+   - If you don't get a dial tone, you may have\
    \ a modem configuration problem. Get out your modem manual and redo the modem\
    \ steps, paying careful attention to the `init` string.\n+   \n+   You should\
    \ also check whether you have a phone line plugged into your modem. (It's one\
    \ of those things that make you smack your head and say \"D'oh!\" just like Homer\
    \ Simpson, but it's more common than you'd think.)\n+   \n+   - Does the modem\
    \ dial, but fail to make a connection?\n+   \n+   Check to see if you entered\
    \ the phone number for the ISP's modem bank correctly. If you have the right phone\
    \ number, give your ISP a call. It may be a problem on their end, and you'll have\
    \ to wait until it's fixed.\n+   \n+   - Does the modem make a connection but\
    \ refuse to let you sign on?\n+   \n+   Did you enter your username and password\
    \ correctly in the login script? Remember that usernames and passwords are case\
    \ sensitive, so keep upper- and lowercase letters where they belong.\n+   \n+\
    \   - Are you receiving strange messages from the ISP after you sign on, especially\
    \ things about DNS lookup failures?\n+   \n+   Make sure you entered all those\
    \ IP numbers correctly. If that doesn't solve it, call your ISP. Be prepared to\
    \ recite the error messages exactly as they appeared on your screen.\n\n# # Knotted\
    \ up in the Net\n\nSometimes you run into a problem that you simply don't know\
    \ how to solve. It's not a problem with your own setup or with your ISP, but a\
    \ problem with the great big beautiful world of the Internet. Because the Internet\
    \ is a big old mess of networked computers, there are inevitably times that part\
    \ of it won't work quite right.\n\nWhen you're pretty sure you have an Internet\
    \ connection problem, use KDE's basic network utilities to figure out what's wrong\
    \ — or at least to get better information about what may be happening. The network\
    \ utilities included with KDE are the same tools used by every network administrator\
    \ and Internet expert. If you're having trouble, ping the problematic computer\
    \ or run a quick traroute before you ask for help. Having that data ready to go\
    \ will make you look quite smart and speed up the search for a solution."
  merge: -1
  img_proc: true
- pgno: 174
  md: "# ping? ping!\n\nPicture this: You're sitting at your home computer, trying\
    \ to `telnet` to your work computer in order to get a file. No matter how hard\
    \ you try or how long you wait, the computer you want is just not answering the\
    \ phone.\n\nIf you're trying to connect to a specific computer on the Internet\
    \ but you can't, you can use `ping` to see if that other computer is alive. `ping`\
    \ is a utility that sends small bursts of data at regular intervals: if the receiving\
    \ computer is running, it responds with identical bursts of data. If the computer\
    \ is down, the packets of data aren't returned. Follow these steps to `ping` another\
    \ computer:\n\n+   1. Open the KDE menu and select **Internet->Network Utilities**.\n\
    +   \n+       The Network Utilities dialog box appears.\n+       2. Click the\
    \ **Ping** tab.\n+       3. Enter the name of the computer that you're trying\
    \ to reach into the **Host** box.\n+   \n+       You can enter the IP number instead,\
    \ if you know it.\n+       4. Click the **Go!** button.\n\nWhat do you get back?\
    \ It will, frankly, look like gibberish. You don't have to pay attention to the\
    \ details of the stuff that `ping` sends back, though. All you really need to\
    \ know is whether the machine is functioning: if it doesn't respond to a `ping`,\
    \ it's not working. Look at Figure 8-9 to see a sample `ping` of the KDE Web server.\n\
    \n![](img/8dd43d91b80664e771e0c0a824d7392d_174_0.png)\n\nThe top line shows the\
    \ machine you're `ping`ing, with both its domain name and its IP number. It also\
    \ shows the packet size of the data being sent from your machine. The remaining\
    \ lines show you the packets being returned from the machine being `ping`ed, and\
    \ some information about the time it took for the `ping` to reach the other machine\
    \ and return to you."
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Driver, follow that route


    ping isn''t the solution for every problem, though. Take this situation: You know
    you''re connected to your ISP, but you just can''t connect to other machines on
    the Internet. Perhaps you can connect, but it''s excruciatingly slow when you
    do. If it''s not your ISP and it''s not your computer, it may well be a traffic
    jam on the Net itself.


    This is where traceroute comes in handy. traceroute is a utility that allows you
    to watch the path between your computer and any other computer on the net. Like
    ping, traceroute uses small packets of data. The results of traceroute show you
    the route that the packets followed between your computer and the computer you''re
    tracing. (Traceroute may be in other directories, depending on your version of
    Linux.)


    No matter how fast it may seem, there is almost never a direct connection between
    two computers on the Internet that aren''t part of the same domain. Rather, information
    is relayed through many intermediate computers to get to its destination. When
    you run a traceroute, you see what those intermediate hops are. Often, they''re
    multiple machines in the same domain, but with city names. Those are probably
    backbone machines, or computers that serve as the central nervous system of the
    Internet.


    To use traceroute, follow these steps:


    +   1. Open the KDE menu and select Internet: Network Utilities.

    +      The Network Utilities dialog box appears.

    +   2. Click the Traceroute tab.

    +   3. Enter in the Host field the name of the machine you''re trying to reach.

    +      You can use the IP number instead, if you know it.

    +   4. Click the Go! button.


    Each computer between you and the target machine is listed, along with the time
    it took for the tracing packets to reach that machine. If there is a problem along
    the way and packets are lost, you see an asterisk instead of a time. Major problems
    are indicated by three asterisks on a line by themselves; this means that the
    next logical machine isn''t operating and the packets have to be rerouted.'
  merge: -1
  img_proc: true
- pgno: 176
  md: "# Chapter 9\n\n# Using Internet Applications\n\nIn This Chapter\n\n+   \n+\
    \       - Sending and reading mail with KMail\n+       - Mail call! — KBiff\n\
    +       - Spreading the news with KRN\n+       - Browsing the Net with KFM\n+\
    \       - Using KFM to download files from the Net\n+       - Placing a call with\
    \ KTalk\n+       - Using the party line — Ksirc\n+       \n\nBeing connected to\
    \ the Internet isn’t much fun, in and of itself. You could go around saying “Hey,\
    \ I’ve got an ISP! And I’m online!” But you won’t have much more to say than that\
    \ — unless, of course, you start to explore the wonders of the Internet and all\
    \ the great resources available there.\n\nKDE has a bevy of fine programs that\
    \ make your Internet activity easier. KMail and KBiff handle your e-mail, KRN\
    \ gets you connected to the news- groups of USENET, KFM is both a Web browser\
    \ and a file transfer client, and KTalk and Ksirc help you to chat with friends\
    \ and strangers around the world.\n\nIn this section, we assume that you have\
    \ an account with a Linux-friendly ISP and that you’ve already configured Kppp\
    \ and your modem to work together and make a reliable connection to the ISP. If\
    \ you haven’t done that yet, read Chapter 8 and get that set up; then, you can\
    \ come back and configure all the Internet applications you want to use.\n\n#\
    \ Get a Grip on Your E-Mail\n\nSure, the Internet is an interesting and crazy\
    \ place. You find lots of stuff to do, Web pages to see, newsgroups to read. The\
    \ function that’s become almost indispensable, though, is e-mail. People use e-mail\
    \ for everything these days, from telecommuting to checking in with Gramps about\
    \ whether his lettuce"
  merge: -1
  img_proc: true
- pgno: 177
  md: "seeds have sprouted yet this year. E-mail is a great way to get your communication\
    \ rewed up; an e-mail takes just a few seconds to travel around the world, and\
    \ that's not something any postal service or overnight delivery company can do\
    \ for you.\n\nKDE makes getting your mail a simple procedure. Use two programs\
    \ that come with KDE to manage your e-mail habits, and soon you'll have a slick\
    \ process that will make you wonder how you ever handled your mail without the\
    \ help of KDE.\n\n# Using KMail, your electronic post office\n\nKMail is the KDE\
    \ mail client, a program designed especially to handle e-mail. With KMail, you\
    \ can organize your mail however you like, attach files from your hard drive,\
    \ and compose or reply to e-mail in a straightforward fashion.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_177_0.png)\n\
    \nTECHNICAL STUFF\nIf you don't like KMail, you can find more information about\
    \ other non-KDE mail clients (such as pine or elm) in Chapter 13. Take the lessons\
    \ from this chapter and apply them to a program that works better for you.\n\n\
    # Configuring KMail\n\nGetting KMail set up is a lot like getting Kppp configured\
    \ properly. You need a couple of items from your ISP, and you need to work through\
    \ several dialog boxes to make sure that you've covered everything. Just as with\
    \ Kppp, though, you can always go back and make changes if you need to or if something\
    \ changes at your ISP.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_177_1.png)\n\
    \nTIP\nIf this is the first time you are using KMail, expect a bit of delay as\
    \ KDE builds new file structures and creates the underlying organization needed\
    \ for faster service later.\n\nReady to get going with e-mail? Use this procedure\
    \ to configure KMail:\n\n+   1. Open the KDE menu and choose Internet  Mail Client\
    \ to open KMail.\n+   \n+      The KMail window appears. If this is the first\
    \ time you have opened KMail, the Settings dialog box also appears (shown in Figure\
    \ 9-1), opened to the Identity tab.\n+   \n+      If you've opened KMail before\
    \ but haven't configured it, you need to use File Settings to open the Settings\
    \ dialog box.\n+   2. Type your personal information in the Settings dialog box\
    \ fields.\n+   \n+      What you type is the information that people see after\
    \ they receive e-mail from you. Type your e-mail address in the Email Address\
    \ field. You can leave Reply-To Address blank unless you want people to reply\
    \ to a different address than the one in the Email Address field."
  merge: -1
  img_proc: true
- pgno: 178
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_178_0.png)


    Figure 9-1: Configuring KMail begins with the Settings dialog box.


    In the Signature File field, you can enter information that appears at the bottom
    of every e-mail you send. Usually this file includes your name and e-mail address.
    If you’re using KMail for business purposes, you may want to include your title
    and company name, or a business phone or fax number.


    Don’t ever put your home phone or address into your signature file. You have no
    way of knowing where that information will be forwarded or seen, and you’re just
    asking for trouble to put personal information such as that randomly into public
    view. If you must put something, consider a post office box or a pager number.


    +   3. Click the **Network** tab at the top of the Settings dialog box.


    +   4. Click **Add** (located just under *Incoming Mail*, as shown in Figure 9-2)
    and select **POP3**.


    Only select Local Mailbox if you’ve already arranged with your ISP to download
    your mail from the ISP directly to your local machine. You’ll know if you’ve done
    this.


    +   5. Click **OK**.


    The Configure Account dialog box opens.


    +   6. Enter the information you received from your ISP about its mail server.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 154 Part III: Getting Down to Business


    ![](img/8dd43d91b80664e771e0c0a824d7392d_179_0.png)


    +   Figure 9-2- Enter your ISP''s specific mailbox information on the Network
    tab.


    In the Host field, enter the mail server’s name, which usually looks something
    like **mail.mysp.com** or **pop3.mysp.com**. Sometimes, the ISP provides an IP
    number rather than a machine name; in that case, the number looks like **127.1.1.1**
    or a similar string of numbers.


    Unless you are told by your ISP to enter a specific number, leave the Port field
    empty.


    +   7. **Click OK.**


    The Configure Account dialog box closes, and the Settings dialog box reappears.


    +   8. **Click OK after you finish.**


    You can ignore the other tabs in Settings for now. If you need to change something
    later, use File➔Settings to reopen the Configure Account dialog box.


    Congratulations! You’re ready to start working with your e-mail. In the other
    parts of this section, we describe how to compose e-mail in KMail, how to get
    your mail, and how to manage the mail you get. The next section covers KBiff,
    a utility that tells you when you have e-mail to deal with.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Composing a new e-mail message


    You won’t be happy for long if all you can do is receive e-mail and never send
    any. Luckily, writing e-mail is a snap with KMail. Just follow these steps:


    +   1. Click the **Compose New Message** button, shown in Figure 9-3.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_180_0.png)


    The New Message screen appears (see Figure 9-4).


    +   2. Enter the recipient’s e-mail address in the **To:** field. If you want
    to send carbon copies of the message, enter those e-mail addresses in the **Cc:**
    field.


    +   3. Type your message in the large window at the bottom of the New Message
    screen.


    +   4. Click the **Send Message** button after you’ve finished your e-mail.


    KMail automatically uploads your message to your ISP’s mail server.


    You can also use KMail to send files created in other programs, such as a word-processor
    document or an image file. To attach a file from your computer to an e-mail message
    you are composing in KMail, use the following procedure.'
  merge: -1
  img_proc: true
- pgno: 181
  md: "# **156** Part III: Getting Down to Business\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_181_0.png)\n\
    \n+   1. **Choose _Attach_ in the KMail composition window.**\n+      You can\
    \ also click the paperclip button in the KMail toolbar.\n+      A file manager\
    \ window appears.\n+      \n+   2. **Select the _file you want to attach to the\
    \ e-mail message_.**\n+      You may need to navigate through the file manager\
    \ until you find the correct file.\n+      \n+   3. **Click OK.**\n+      The\
    \ file manager window closes, and the file attaches to the e-mail message. When\
    \ you finish and send the message, the file will travel along to the recipient’s\
    \ mailbox."
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Downloading new e-mail from your ISP


    Getting your mail with KMail is also unbelievably easy. If you have KMail open,
    click the Get New Mail button (shown in Figure 9-5)! KMail then contacts your
    ISP to get any new mail that’s been sent.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_182_0.png)


    Figure 9-5: Use the Get New Mail button to check whether you have any mail waiting
    in your ISP’s inbox.


    After you send KMail to go get your e-mail, click the name of your inbox in the
    upper-left corner of the KMail screen. If you have new mail, the subject lines
    and senders’ names appear in the upper-right window of the screen. Click any of
    these messages to display the e-mail message in the large window at the bottom
    of the screen.


    # Replying to e-mail


    More often than not, you want to reply to a message you’ve just read. KMail gives
    you several options for e-mail replies, including individual reply and group reply.
    You can also choose to attach files to your replies. To reply to an e-mail that’s
    currently open, use this procedure:'
  merge: -1
  img_proc: true
- pgno: 183
  md: "+   1. Click the Reply to Author button (see Figure 9-6).\n+   \n+   The KMail\
    \ composition window appears. You see that the text of the e-mail to which you're\
    \ replying is already quoted in the message, and the e-mail address of the sender\
    \ is already in the To: field.\n+   \n+   2. Delete the parts of the quoted message\
    \ that you don't want to answer directly and compose your reply.\n+   \n+   3.\
    \ Click Send Message after you're finished.\n+   \n+   KMail sends your reply\
    \ to the person named in the To: field.\n\nIf the message was originally sent\
    \ to several people and you want to reply to all of them, use the Reply to All\
    \ Recipients button (shown in Figure 9-6) instead of the Reply to Author button,\
    \ and proceed as you would with a single reply.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_183_0.png)\n\
    \nFigure 9-6:\nYou have several options when you want to reply to an e-mail message."
  merge: -1
  img_proc: true
- pgno: 184
  md: "# Chapter 9: Using Internet Applications\n\nBe aware to whom you're sending\
    \ e-mail! If you receive a message that was sent to several people, but you want\
    \ to make a snide comment to the author alone, be very Sure that you click Reply\
    \ to Author and not Reply to All Recipients. You can get into a really embarrassing\
    \ jam if you don't pay attention.\n\nIf you want to attach a file to your reply,\
    \ follow the process described in the “Composing a new e-mail message” section\
    \ of this chapter.\n\n# Saving and printing e-mail\n\nYou’ll want to keep some\
    \ of the e-mail you receive, whether by saving your e-mail to your hard drive\
    \ or printing it out.\n\n+   To save an e-mail message, click the Save button\
    \ above the message (refer to Figure 9-6). The Save dialog box opens; select the\
    \ location where you want to save the message.\n+   \n+   To print an e-mail message,\
    \ click the Print button above the message (refer to Figure 9-6).\n\n# Automating\
    \ mail call with KBiff\n\nIf you have better things to do with your time than\
    \ clicking the Get New Mail button repeatedly, you’ll probably like having KBiff\
    \ on your side. KBiff is a small utility that runs in the background, sitting\
    \ quietly on your toolbar until mail arrives. KBiff constantly checks your ISP\
    \ for incoming mail, and lets you know when mail has appeared. If you’ve seen\
    \ one of those America Online television ads in the last five years or so (and\
    \ really, who hasn’t?), you know that cheerful “You’ve Got Mail!” voice, which\
    \ is the AOL version of KBiff.\n\nHere’s a nerdy piece of folklore for you: It’s\
    \ said that the KBiff program is named for a friendly pup called Biff, who would\
    \ bark insanely when the mail-man arrived. The dog’s owner created a little program\
    \ that’d do the same for e-mail, and thus the biff program was born.\n\nHere’s\
    \ how to set up KBiff:\n\n+   **Open the KDE menu and choose Internet::KBiff.**\n\
    +   \n+   The KBiff Setup dialog box appears, as shown in Figure 9-7, with the\
    \ General tab selected.\n+   \n+   **Select the default icon or choose one that\
    \ you like better.**\n+   \n+   The default icons are shown on the buttons at\
    \ the bottom of the dialog box; they are file trays that are either full or empty,\
    \ depending on whether or not you have mail. If you want a different icon, click\
    \ the button and select the new icon from the file manager window that appears."
  merge: -1
  img_proc: true
- pgno: 185
  md: "![](img/8dd43d91b80664e771e0c0a824d7392d_185_0.png)\n\n+   3. Click the **New\
    \ Mail** tab and select the default sound file (a beep) or choose one that you\
    \ like better.\n+   \n+   Pick something you like hearing; if you get a lot of\
    \ e-mail, you'll hear the sound file a lot. Shorter is better. Do you really want\
    \ to hear the entire theme from *2001: A Space Odyssee* every time you get e-mail\
    \ from your boss?\n+   \n+   The “System beep” box is selected by default. If\
    \ you want another sound file, enter the file path in the text box above “System\
    \ beep.”\n+   \n+   4. Set your **Poll time**, the interval at which **KBiff checks\
    \ for e-mail**.\n+   \n+   If you get a lot of mail, you may want to set this\
    \ at two or three minutes. If you don't get much mail, every 30 minutes may be\
    \ enough.\n+   \n+   5. Click the **Mailbox** tab at the top of the dialog box.\n\
    +   \n+   Fill in the same information you provided when you configured KMail.\
    \ You need your ISP's mail server name and your e-mail address.\n+   \n+   6.\
    \ Click **OK**.\n+   \n+   The KBiff icon appears in your toolbar. After new mail\
    \ appears, you hear a beep (or the sound file you selected), and the icon changes.\n\
    \n# # Spread the News with KRN\n\nWhile e-mail is a great way to carry on conversations\
    \ with one or a few people, newsgroups (also referred to as USENET) are a fantastic\
    \ way to participate in conversations about a single topic with thousands of other\
    \ people."
  merge: -1
  img_proc: true
- pgno: 186
  md: 'A newsgroup has a name that denotes its topic, such as alt.collecting.beanie-babies
    or rec.sport.pro-wrestling. In that group, you find anywhere from 10 to 800 or
    more messages loosely centered on that topic. You can find a newsgroup for almost
    any concept under the sun.


    The KDE news client is KRN, which is a specialized KDE version of the tried-and-true
    newsreader *rn*.


    # # Reading newsgroups


    You can spend a very happy life on USENET just reading what other people post.
    KRN helps you out by sorting the articles into *threads*, by using the Subject
    line of each article to arrange the various threads within a particular group.
    To read your favorite newsgroups with KRN, use this procedure:


    +   1. Open the KDE menu and choose Internet->News Client to open KRN.


    The KRN screen opens with the list of newsgroups you read in a collapsed tree
    format (see Figure 9-8). Your list is blank if you’re reading USENET for the first
    time on this machine.


    Otherwise, KRN looks for a file called .newsrc in your home directory and shows
    you groups based on the contents of that file. KRN automatically generates .newsrc;
    you don’t have to do anything.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_186_0.png)'
  merge: -1
  img_proc: true
- pgno: 187
  md: "2. Click on the small plus sign to expand the tree one level.\n\nIf you haven't\
    \ already downloaded the newsgroups list from your server, KRN asks if you want\
    \ to do this now. Click Yes. Depending on the speed of your connection and the\
    \ number of groups your ISP carries, downloading may take a while.\n\nYou can\
    \ only read newsgroups that your ISP carries. For some people, this means that\
    \ they have a relatively small selection of groups to read. Many ISPs will add\
    \ newsgroups at the request of their subscribers; others won't. If your ISP won't\
    \ carry the groups you want to read, consider subscribing to a third-party service\
    \ such as the ones offered at www.newsguy.com or www.deja.com.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_187_0.png)\n\
    \n+   3. Continue clicking the plus sign to expand the tree until you see newsgroup\
    \ names.\n\n+   4. Double-click the name of a newsgroup you want to read.\n+ \
    \  \n+   The KRN reader window appears, as does a KRN Confirmation dialog box.\n\
    \n+   5. Enter the number of articles you want to download and the order in which\
    \ you want them downloaded into the KRN Confirmation dialog box (shown in Figure\
    \ 9-9).\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_187_1.png)\n\n+   6. Click\
    \ the article you want to read.\n+   \n+   KRN displays the article in the lower\
    \ portion of the KRN window.\n\n+   7. Repeat this process with each group that\
    \ you want to read.\n+   \n+   8. Choose File->Exit after you have finish reading\
    \ news."
  merge: -1
  img_proc: true
- pgno: 188
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_188_0.png)


    # # Posting a new article


    You may not find an article or thread discussing the subtopic you really want
    to talk about in a particular group. If you’re ready to post a new article to
    a USENET group, use this simple process:


    +   1. Click the **Post New Article** button (shown in Figure 9-10).

    +      The KRN composition window appears, as shown in Figure 9-11.

    +   2. Fill in the **Subject line and type the message**.


    +   Make sure your Subject line is clear and descriptive. “Seeking Harley Softail
    Engine Specs” is more descriptive than “Help me with my Harley!!!”

    +   Most people skim Subject lines and don’t read every single message.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_189_0.png)


    3. Click Send after you finish your post.


    KRN uploads your message to your ISP’s news server, and your message is distributed
    around the world.


    # Responding to an article via USENET


    Sooner or later, you see an article that makes you want to respond immediately.
    You may agree wholeheartedly, or you may think the article’s author is an unmitigated
    moron. The most common way of responding to an article that you see in a newsgroup
    is to “follow it up.” To post a follow-up to a USENET post, use this process:'
  merge: -1
  img_proc: true
- pgno: 190
  md: '+   1. Click the **Post a Followup** button (refer to Figure 9-10).


    The KRN Composition window opens (refer to Figure 9-11). The title of the article
    is in the titlebar of the composition window, and the Subject, Newsgroup, and
    Followup To: fields are already filled in. The article to which you''re responding
    is quoted in the text area for your convenience.


    +   2. **Edit the article to which you''re responding.**


    Make sure you delete material that you don''t want to address in your reply, which
    makes downloading much faster.


    Add your response after the quoted material. Interspersing your comments with
    the quoted material is okay.


    +   3. Click the **Send button** after you finish.


    KRN uploads your article to your ISP''s news server. Depending on propagation
    times, your article begins to appear on news servers around the world.


    # ## Responding to an article via e-mail


    If you prefer to respond to a particular article via e-mail, use this process:


    +   1. **Click the Reply By Mail button** (refer to Figure 9-10).


    The KRN Composition window opens. The title of the article to which you''re responding
    is in the titlebar, and the To and Subject lines are filled in. The article is
    quoted in the lower text area.


    +   2. **Edit the article to which you''re responding.**


    +   3. **Click the Send button** after you finish.


    KRN uploads your message to your ISP''s mail server, and then is delivered to
    the recipient.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_190_0.png)


    If the person you''re replying to has a *munged* e-mail address, your reply may
    be returned to you as undeliverable. A munged e-mail address is one that''s been
    altered in an attempt to avoid getting unsolicited commercial e-mail by foiling
    address-harvesting robots that roam USENET. The problem is that munging doesn''t
    work very well: many spammers employ people to write programs that remove the
    munges and put your address in a file anyway. Munging is impolite because it requires
    extra work on the part of someone who wants to mail you: munging can even cause
    serious and expensive problems for real companies. You''re better off signing
    up with an ISP that has a vigorous anti-spam policy than munging ineffectively.'
  merge: -1
  img_proc: true
- pgno: 191
  md: "# ### Responding both on USENET and via e-mail\n\nSometimes, you may want to\
    \ post and e-mail a reply at the same time. Generally responding both ways is\
    \ not a good idea, unless the poster has explicitly requested it; otherwise, the\
    \ recipient may not know whether or not you've sent private e-mail. If you're\
    \ going to post and mail the same message, put a note at the top saying “Posted\
    \ and e-mailed.” Use this process:\n\n+   1.  **Click the Post & Send button**\
    \ (refer to Figure 9-10).\n+       The KRN Composition window opens. Headers for\
    \ both mail and news are filled in already.\n+   2.  **Edit your message with\
    \ a note that you've both posted and e-mailed the response.**\n+   3.  **Click\
    \ the Send button**.\n+       KRN sends a copy of your message to the mail server,\
    \ where the message is sent via e-mail and to the news server, where your message\
    \ is posted to the newsgroup.\n\n# ### Netiquette: The rules of the road\n\nNews\
    \ has existed since the early days of the Internet. Like anything that's been\
    \ around for a long time, a set of behavior rules has grown up. On USENET, these\
    \ rules are referred to as *netiquette*, or Internet etiquette. You can find several\
    \ documents dealing with appropriate USENET behavior on the wonderful newsgroup\
    \ *news.newusers.questions*, which we recommend as one of the groups you can read\
    \ regularly.\n\nThe basic tenets of netiquette are\n\n+   Read a group for a while\
    \ before you post. The old rule used to be six months; these days, a couple of\
    \ weeks is usually sufficient.\n+   \n+   Read the FAQ, so that you don't jump\
    \ onto a group you never posted to before and ask a bunch of questions that are\
    \ answered in a single document.\n+   \n+   If you ask a question on a newsgroup,\
    \ stick around for the answers. To ask a question and say, “Please e-mail me the\
    \ answer as I don't read this group” is considered extremely rude.\n+   \n+  \
    \ Don't get into flame wars. Keep violent arguments in e-mail. The general tone\
    \ of USENET can be somewhat abusive and rude; do your part to elevate the tone\
    \ by thinking before you send a post that's insulting and mean.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_191_0.png)"
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Hunting and Gathering with KFM


    What''s KFM doing way over here in Chapter 9? Yes, we know we cover KFM pretty
    thoroughly in Chapter 4, but KFM isn''t just for managing your machine more efficiently
    — KFM is also useful for Internet projects! You can use KFM as a Web browser,
    or you can use it to download files from FTP archives.


    # Browsing the Web with KFM


    To use KFM as a Web browser, just use File Open Location. The Open Location dialog
    box appears; type the URL of the page you want to visit into the box, and click
    OK. After the page loads, you see it in the right-hand side of the KFM window,
    while your machine''s file tree remains visible on the left. See Figure 9-12 for
    an example.


    +   Figure 9-12:

    +   KFM uses a

    +   file struc-

    +   ture similar

    +   to that of

    +   Windows

    +   and

    +   Macintosh,

    +   with nested

    +   file folders.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_192_0.png)


    KFM is not as advanced a Web browser as Netscape, but it serves as a quick way
    to check a site without firing up another program. For serious recreational surfing,
    you want to use Netscape. See Chapter 12 for more information on using Netscape
    with KDE.


    The major downside to using KFM as your Web browser is that KFM uses up a lot
    of your available memory. If you''re running anything else at the same time, you
    may see your machine''s swap partition going nuts.'
  merge: -1
  img_proc: true
- pgno: 193
  md: "# ## Downloading files with KFM\n\nEven though KFM isn’t the greatest browser\
    \ for purely fun purposes, it does have a very strong advantage over Netscape\
    \ in one particular function. KFM is stellar for downloading files from the internet.\
    \ If you have an FTP (File Transfer Protocol) program that you like, you can use\
    \ that just as easily, but KFM’s file transfer capabilities are simple and graphical.\n\
    \nTo use KFM as an FTP client, use this method:\n\n+   1.  **Open KFM by clicking\
    \ its button in the panel.**\n+   2.  **Choose *File*\\>*Open Location*.**\n+\
    \   \n+   The Open Location dialog box appears.\n+   \n+   3.  **Type the FTP\
    \ site address in the text area and click *OK*.**\n+   \n+   FTP URLs begin with\
    \ *ftp://* instead of *http://*. In Figure 9-13, you see an open FTP session with\
    \ *ftp://sunsite.unc.edu/pub/linux/X11/kde*, which has a lot of KDE programs available\
    \ for download.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_193_0.png)\n\n+  \
    \ 4.  **Find the file you want to download by clicking through the directory tree\
    \ in the right-hand window.**\n+   \n+   Your computer’s file tree is in the left\
    \ window and the FTP site’s in the right window.\n+   \n+   5.  **Click and drag\
    \ the filename to the appropriate directory in your computer’s file tree in the\
    \ left-hand window.**"
  merge: -1
  img_proc: true
- pgno: 194
  md: '6. **Release the mouse button.** In the dialog box that appears, select the
    **Copy option.**


    KFM copies the file from the FTP site to the location you select on your computer.
    A progress bar shows how much of the file has been copied; if the file is small,
    the bar may zip away rapidly. If the file is huge and you have a slow modem, go
    have a cup of coffee or order a pizza.


    # # Make a Quick Call with KTalk


    Want to have a real-time conversation with a friend without waiting for e-mail
    to pass back and forth? Try KTalk (the KDE version of an old UNIX warhorse, talk).
    Talk is the Neanderthal predecessor to today''s instant message software for Windows
    and Macintosh, such as ICQ or AOL Instant Messenger. In KTalk, your typing goes
    instantly across the Net and appears on your friend''s screen; KTalk is personal
    and quick, but not particularly pretty (see Figure 9-14 if you don''t believe
    us).


    ![](img/8dd43d91b80664e771e0c0a824d7392d_194_0.png)


    You have three requirements to use KTalk successfully. Your friend must be logged
    on, using a UNIX-based operating system, and accepting talk connections. For security
    reasons, some systems administrators do not allow talk connections. Check with
    your ISP if you''re not sure.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'If you can say “Yes, indeed!” to those conditions, you’re ready to use KTalk.


    +   1. **Open the KDE menu and choose Internet:: KTalk.**

    +      The main KTalk screen opens.

    +   2. **Choose Connection:: Talk To.**

    +      The KTalk Connection dialog box appears.

    +   3. **Type the e-mail address of the person you want to talk to and click the
    Talk button.**

    +      The Connection dialog box closes, and the KTalk screen reappears.

    +      Notice a difference? While you’re KTalking, the screen is split into two
    by a horizontal line. The text you type shows in the top area, and your friend’s
    responses appear in the bottom area. Getting used to following a conversation
    that is split in two takes a few minutes, but you get used to the split screen
    the more you use KTalk.

    +   4. **After you finish your session, click Disconnect.**

    +      The connection closes. You can now make another connection if you like.

    +   5. **Choose File:: Exit to leave KTalk.**


    # # Getting Gabby with Ksirc


    IRC, or Internet Relay Chat, is to talk what USENET is to e-mail. That is, with
    talk you can talk to one other person, but with IRC, you can talk to dozens at
    one time. Ksirc is KDE’s IRC client, a program that makes it easier to participate
    in the IRC channels.


    IRC is a real subculture. Before you plunge in, we recommend that you look at
    the various FAQs and help files available at **www.irchelp.org** to get a better
    idea of what you can find online.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_195_0.png)


    ![](img/8dd43d91b80664e771e0c0a824d7392d_195_1.png)'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# # Chatting away


    Unlike KMail and KRN, you don''t have to do any special configuring of Ksirc before
    you use it. You just have to find a server and be ready to chat! (If you don''t
    know any IRC servers, look at the next section, “Finding places to chat,” which
    gives some good references.)


    Here''s how you chat with Ksirc:


    +   1. Open the KDE menu and choose Internet Chat Client (Ksirc).

    +      The Server Control screen appears.

    +   2. Choose Connections New Server from the drop-down menu.

    +      The Connect to Server dialog box appears.

    +   3. Click the arrow next to Recent, under Group (see Figure 9-15).


    ![](img/8dd43d91b80664e771e0c0a824d7392d_196_0.png)


    The drop-down list that appears contains a list of major server networks. Pick
    one.


    Unlike the Web, IRC servers are not all connected together. Several main networks
    house most IRC channels. These include EFnet, DalNet, and Undernet. However, as
    you get more involved with IRC, you may find that more specialized networks carry
    the sorts of channels you want to use. See the next section for information on
    these nets.


    +   4. Under Server/Quick Connect to:, select an IRC server for the network you
    choose.

    +      You can often tell from a server''s name where it is located. Choosing
    a server geographically close to you helps reduce lag, a major problem on IRC.

    +   5. Click Connect.

    +      The Ksirc screen appears. A batch of text scrolls by (don''t try to read
    it frantically; you can always scroll back).'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'If all goes well (meaning the IRC network is stable and you have access to
    the server you chose), the Pick A Nick dialog box appears.


    +   6. **Type the nickname you want to use in the Pick A Nick dialog box.**


    If somebody else is already using that nickname, or nick, for short, somewhere
    on the network, you are asked to choose again. (Yes, this means that if you''re
    named Dave, you probably won''t be able to use the nick Dave. You''re competing
    for your own name with all the other Daves on that network. Try SuperDave or MagnifiDave
    or DaveTheRed. Obscene nicks, though, are never a good idea.)


    After you manage to select a unique nick, more text scrolls past, which means
    you''re connected to the server you selected.


    +   7. **Type the name of the channel you wish to join on the text entry line,
    using the format** `/join #channelName`.


    Channel names are always preceded by the pound sign, # (known as a hashmark to
    geeks and programmers).


    You should know what channel you want to join before you connect. You find hundreds
    of open channels in existence at any given time. If you really have no idea what
    channel you want, type `/list` on the text entry line.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_197_0.png)


    Typing `/list` is an action of last resort because every single channel in existence
    on that server at that point in time is listed. This can be longer than a thousand
    lines. If you have a slow modem, you may actually be disconnected by your ISP
    before the list is finished.


    If you see text scrolling across the screen, you''ve been connected to the channel
    you selected. You can tell who else is on the channel by looking at the right
    window of the Kirc screen, shown in Figure 9-16; the window lists the nicks of
    everyone joined to that channel. Comments being typed by these people fill the
    main text window.


    +   8. **Send a message to the channel by typing your remark into the text entry
    box and press Enter.**


    Unlike KTalk, you can edit your remark in Kirc before you send it, as long as
    you don''t press Enter.


    If you want to portray an action, type `/me performs action`. For example, if
    you wanted to show that you were drinking milk, you would type `/me chugs an icy-cold
    glass of moo juice`.


    +   9. **After you finish, type** `/quit` **in the text entry box.**


    The Kirc window closes, and the Server Control dialog box reappears.


    +   10. **Choose** `File⇒Quit` **to exit Kirc.**'
  merge: -1
  img_proc: true
- pgno: 198
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_198_0.png)


    Figure 9-16: After you get connected, you can chat happily on #kde.


    # Finding places to chat


    As we note in the previous section, IRC is an Internet subculture that is like
    no other. Before you jump into IRC, you probably can benefit from a bit of research.
    At the very least, knowing how IRC works is good, where the channels you want
    may be found, and some basic “chatiquette.”


    You can find all of this information, and much more, at these sites:


    +   www.irchelp.org is the main source for FAQs, channel lists, network information,
    and even scarier stuff such as how to defend yourself against viruses and worms
    that transmit via IRC.


    +   www.irclist.com is the IRC arm of www.liszt.com, a site that tries to catalog
    every mailing list on the Internet. At the irc list site, it does the same with
    IRC channels. You can even jump on IRC via its Web interface if you find yourself
    away from Kiscr.


    +   www.netway.com/~marci/songs/ is a collection of well, songs about IRC. If
    you, too, come to find IRC one of the most entertaining aspects in your life,
    hum one of these songs to let your friends know how far over the edge you’ve gone.'
  merge: -1
  img_proc: true
