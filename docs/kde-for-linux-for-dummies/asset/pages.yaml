    +   31. Type startx to start the X Window System.


    If you''re already running X Windows for some reason, shut it down and restart
    it.


    If KDE opens, you''ve successfully installed it! Congratulations!


    If KDE is not running, something went wrong during the installation. Try reinstalling,
    following this procedure to the letter. If it still fails, go back a step, re-download
    the packages, and reinstall. If that doesn''t work, consult Chapter 16 for more
    advanced sources of help.'
