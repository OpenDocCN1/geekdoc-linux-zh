  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_63_0.png)


    5. **Type the Web page address in the URL text box.**


    Enter the full address of the Web page you want your Web browser to retrieve and
    load when you click the new desktop icon. Be sure to enter the address carefully
    and use the proper format (for example, `http://www.kde.org`,) and not the common
    shortened version (such as `www.kde.org`.)


    6. **(Optional)** **Click the button with the icon on it, select a different icon
    from the Select Icon dialog box that appears, and click OK.**


    This step enables you to select an alternate symbol for KDE to display as the
    desktop icon. Pick a symbol from the many displayed in the Select icon dialog
    box (see Figure 2-8) by clicking the icon you want and then clicking OK to close
    the Select Icon dialog box and return to the KFM dialog box where you were defining
