    A preview image of the selected theme appears in the large box in the center of
    the Theme Manager dialog box. Try clicking each theme name in succession and viewing
    the preview image until you find one you like.


    +   3. Click the Contents tab to make sure that all the checkboxes are checked.


    A quick way to check all the checkboxes on the Contents tab of the Theme Manager
    dialog box is to click Clear and then click Invert.


    +   4. Click Apply or OK.


    Clicking Apply applies the selected theme to your desktop without closing the
    Theme Manager dialog box. Clicking OK applies the theme and also closes the Theme
