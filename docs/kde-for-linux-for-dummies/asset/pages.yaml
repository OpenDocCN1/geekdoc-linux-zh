- pgno: 308
  md: '# Capitalization Makes a BIG Difference


    News flash: Linux and KDE filenames and path names are *case sensitive*!!!


    This is no surprise to longtime Linux/UNIX users, but it may come as a shock to
    former Windows users.


    Windows path names are *not* case sensitive. `Filename`, `FILENAME`, `FiLeNaMe`,
    and `filename` are all equivalent in Windows. To make matters worse, various Windows
    programs and utilities routinely change the capitalization of the file and directory
    names they display. As a result, most Windows users have developed a habit of
    ignoring capitalization in file and path names. That’s a very bad habit for anyone
    using a UNIX-based computer!


    You must **pay attention** to proper capitalization of file and path names. Unlike
    in Windows, `Filename`, `filename`, and `FILENAME` are three separate and distinct
    filenames in Linux. The names aren’t equivalent at all. Therefore, if you need
    to find the file `Office51`, and you enter `office51` in the Named box of the
    Find Files utility, the program will not find the correct file.'
  merge: -1
  img_proc: true
