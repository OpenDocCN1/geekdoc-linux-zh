- pgno: 292
  md: '# # Chapter 14: Taking Control — the KDE Control Center


    Keystroke combinations are wonderful timesavers for frequently performed actions.
    You can easily go a little nuts with them and try to assign combinations to every
    action you may ever want to perform, but remembering just a couple of combinations
    is easier. Figure out what you do frequently that requires a lot of clicking or
    sequential menus, and assign those extra clicks to a keystroke combination.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_292_0.png)


    REMEMBER


    You can always clear keystroke combinations by going back into Control Center
    \ Keys \ Global Keys and deleting that particular key association to the action.
    You may have chosen a key combo that isn’t quite intuitive enough if you can never
    remember whether it’s Ctrl-F3 or Ctrl-3.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_292_1.png)


    TIP


    Give your brain a hand if you construct keystroke combinations. Use combinations
    that make sense, rather than combinations that are built almost wholly at random.
    To use a familiar example, doesn’t Ctrl-S for Save make more sense than Ctrl-9?
    Try to stick with combinations that use spatial or alphabetical triggers — psychologists
    say that such mnemonic devices make it easier for us to remember abstract information
    such as key combinations.


    # ### Your keyboard’s a polyglot


    Take a minute to think about this — not every language uses the same alphabet
    as English, right? How do you suppose people who write in other languages handle
    their keyboards? The trick is in keyboard layout configuration. You can find a
    keyboard suited to almost every language where computers are used; then, you just
    need to load the proper keyboard drivers into the system, and away you go.


    If you want to use a keyboard different from the standard English keyboard used
    by Americans, Anglophone Canadians, and the rest of the English-speaking world,
    take a look at the list below. Given the international appeal of KDE, you’ll likely
    find a keyboard layout right for you.


    +   - Bulgarian

    +   - Canadian French

    +   - Croatian

    +   - Czech — KDE provides drivers for three different Czech keyboard layouts.

    +   - English (Dvorak layout) — The Dvorak layout is different from the standard
    QWERTY keyboard. Afficionados of Dvorak claim this layout increases typing speed
    and reduces error.

    +   - European (Western)

    +   - Finnish

    +   - French (Switzerland)

    +   - French

    +   - German (Switzerland)'
  merge: -1
  img_proc: true
