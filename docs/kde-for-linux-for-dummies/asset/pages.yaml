- pgno: 26
  md: '# Introduction


    A s the twenty-first century comes smoking up out of the lamp, it offers computer
    users a whole new range of choices. Operating systems, for example — it isn’t
    just a Windows-or-Mac world anymore. Actually, it never was. The mighty UNIX operating
    system has been around since Cold War days, and it still underpins the operation
    of the Internet. Although UNIX and its specialized offspring — in particular,
    Linux — have been getting a lot of press lately because of their low cost and
    high reliability, they all have that pesky command-line interface. Normally that
    would mean you have to be a pretty decent typist — and learn an exotic vocabulary
    of command words — to use Linux well. Most computer users who have a fondness
    for point-and-click — and a raging allergy to typing commands at a tiny prompt
    on a big dark screen — have been out of luck. Up to now, that is.


    As Linux has gained popularity in the last few years, KDE has emerged to ease
    the heartbeat of windowless computer use. It’s a graphical user interface! It’s
    an award-winning innovation! It’s a dessert topping! (Kidding.) And you hold in
    your hands the key to mastering KDE and making the Linux genie do your bidding.
    Rejoice and read on.


    # About This Book


    KDE For Linux For Dummies eases you into the exciting new world of KDE by walking
    you through the features, capabilities, and oddities that make KDE similar (but
    not identical) to the graphical user interfaces you may have used before.


    # Who Should Read This Book


    If you enjoy the convenience and efficiency of a window-style interface, but get
    a little queasy when you think about how much space it takes up on your hard drive,
    then Linux, KDE, and this book are for you. If you’re already a seasoned Linux
    network administrator, and want to look into implementing KDE as one way to make
    peace with your users — whatever platform they’re running — you’ve come to the
    right place. If you’ve just been handed a memo that announces a mass migration
    from Windows to Linux and KDE — or if you’ve been intrigued by the Linux phenomenon
    but intimidated by all the finger-gymnastics needed to run it, relax. Your interface
    is ready and your guidebook awaits.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# # How This Book Is Organized


    Use this book in the way that makes the best sense to you. You can, as the King
    of Hearts said to the White Rabbit in *Alice in Wonderland*, “begin at the beginning
    . . . and go on till you come to the end . . . then stop.” If you’d rather jump
    around in the book to chase after particular topics — or even read it all again
    for good measure when you’re done — go right ahead. (We won’t tell a soul.) Here’s
    a rundown on what you’ll find inside.


    # ## Part I: Getting Started


    If you’ve used Windows or a Macintosh, you’ve used a graphical user interface.
    Which means you’ve got a leg up on KDE. If you haven’t, you’re in for a treat.
    Part I shows you the basic KDE operations, tours the desktop, and demonstrates
    the highly effective management of windows and files (you don’t even have to cultivate
    seven new habits).


    # ## Part II: Making KDE Look Right


    KDE gives you the features, options, and general wherewithal to set up your interface
    so it works for you and looks like it means business. Part II shows you how to
    set up your panel, customize your desktop, and get the most out of using KDE’s
    themes.


    # ## Part III: Getting Down to Business


    Part III unlocks the secrets of getting connected and using KDE on the Internet.
    You have a look at the applications and utilities available for work or play,
    and get the lowdown on keeping the peace when you’re working with non-KDE applications.


    # ## Part IV: Under the Hood


    The Linux community is a pretty self-reliant crew. They know they have no giant
    corporation to call when things go wrong. Of course, the upside is that they don’t
    have to spend big bucks on the long-distance tech-support line while some machine
    plays them elevator music. As a Linux user, you can easily get a comfortable knowledge
    from your fellow users of how the underlying operating system works. Part IV gets
    you started, providing a basic guided tour through Linux, and checks you out on
    those shiny new Linux controls you get in the KDE Control Center.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Part V: The Part of Tens


    Here’s the KDE version of an exclusive *For Dummies* feature — a collection of
    distilled wisdom arranged in convenient groups of ten: ten really handy things
    to know before you have to learn them from experience, ten places you can turn
    for help, ten KDE toys for the pure fun of it, and the ten KDE themes you don’t
    even have to turn in to your English teacher.


    # Part VI: Appendices


    The KDE/LINUX community is your best friend. And they don’t even charge you for
    it. Part VI shows you how to get hold of and install KDE, where to find more expertise
    on the Internet, and a catalog of the goodies you’ll find on the CD-ROM that accompanies
    this book.


    # Icons in This Book


    Along your way through KDE For Linux For Dummies, you’ll find some friendly road
    signs in the form of these icons:


    ![](img/8dd43d91b80664e771e0c0a824d7392d_28_0.png)


    The Tip icon identifies shortcuts, not-so-obvious answers, and useful ways of
    looking at KDE and Linux.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_28_1.png)


    The Warning icon calls your attention to possible pitfalls that lurk in the world
    of KDE and Linux as they do everywhere in cyberspace. Take heed.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_28_2.png)


    The Technical Stuff icon conjures up techie issues, details, and info you may
    want to know about (if you want to frighten the techno-ignoramuses in your midst).
    Or you might not. If you leave the finer tech details to your friendly IT department,
    no one will think the worse of you. Honest.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_28_3.png)


    Next best thing to an alarm watch, and a whole lot more polite. These icons highlight
    the . . . er . . . *highlights* of using KDE.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 4 KDE For Linux For Dummies


    # Where to Go from Here


    By the end of this handy tome, you can take what you learn here in any of several
    directions—further into the world of the Linux community, deeper into the secrets
    of operating systems, or off into the new possibilities that KDE sets before you.
    For a glimpse of two possible places to go next, you might want to try these books
    from IDG Books Worldwide, Inc.:


    +   ✓ For more about the history, mystery, and delights of Linux, dive into *Linux
    For Dummies*, 2nd Edition, by Jon “maddog” Hall (ISBN: 0-7645-0421-5). As Executive
    Director of Linux International, he’s sent his report from the front lines.


    +   ✓ If your company is making the move to a networked computing environment
    that uses the Linux operating system (very chic these days), get hold of *Linux
    Administration For Dummies* by Michael Bellomo (ISBN: 0-7645-0589-0). You’ll be
    glad you did.


    Let’s get started!'
  merge: -1
  img_proc: true
