    \ to a view of the `kde/stable` directory. There are multiple subdirectories for\
    \ the major releases of KDE in this directory. At the time of this writing, the\
    \ most recent stable release was 1.1.2.\n+   \n+   2. **Click the file folder\
    \ for the distribution you want — probably the most recent.**\n+   \n+   The screen\
    \ shifts to a view of the `kde/stable/1.1.2` directory, shown in Figure A-2.\n\
    +   \n+   The most recent stable release has the highest version number. This\
    \ numbered list refers to that most recent version as 1.1.2, but releases may\
    \ be well into the 2s by the time you pick up this book.\n+   \n+   3. **Click\
    \ the file folder labeled `distribution`.**\n+   \n+   The screen shifts to a\
    \ view of the `kde/stable/1.1.2/distribution` directory. This directory, shown\
    \ in Figure A-3, holds subdirectories for the major file types, as well as source\
    \ code. If you prefer software packaged for your particular Linux distribution,\
    \ open that subdirectory. It contains the same code as the other directories,\
    \ but is packaged for ease of use with your distribution.\n+   \n+   4. **Either\
    \ find the packages appropriate to your Linux distribution or locate the source\
    \ code versions.**\n+   \n+   Figure A-4 shows the complete directory of files\
    \ you need to download.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_340_0.png)\n\
    \n> **Figure A-2**: Each release of KDE contains various upgraded packages."
  merge: -1
  img_proc: true
