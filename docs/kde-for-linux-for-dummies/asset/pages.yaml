- pgno: 348
  md: '# Appendix B


    # Finding More Stuff on the Net


    # In This Appendix


    +   A guided tour of the official KDE Web site


    +   How to get non-English-speaking friends interested in KDE


    +   Lots and lots of programs for your KDE machine


    +   Where to go when you want to say what''s on your mind


    After you have the hang of KDE, you''ll probably want to find more programs and
    additional general information. Like the help resources described in Chapter 16,
    almost all KDE information and resources are on the Web, due to the nature of
    the project.


    You can find a great deal of help at the main KDE Web page, but there is also
    ample information available in languages other than English, as well as active
    Web discussion boards. Program archives have popped up in several places as well,
    so that you have several choices for downloading new gadgets or useful patches.
    We also point you to some resources for folks interested in becoming KDE developers,
    and where you may find the latest contributions.


    # Home Sweet Home: www.kde.org


    The definitive online resource for KDE is the KDE project home page at www.kde.org.
    The Webmasters try to keep links updated, manage a busy FTP site, and provide
    news to the KDE community. Plus, it''s overseen by a cute little dragon!


    # If you could have only one


    If you don''t have a lot of time, you can get the latest KDE information just
    by hitting the main page. A list of news updates is at the bottom of the page
    and links to the FAQ, the download area, and the dynamic news page are in a'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'clickable bar at the top of the page. (If you really don''t have a lot of time,
    install KWebwatch, described in Chapter 17 and included on this book''s CD. You
    can set KWebwatch to notify you when the KDE home page is updated.)


    # ## Download commencing in 5...4...3...2...


    Of course you want to download stuff. The KDE FTP site holds all programs that
    have been formally submitted to the KDE project. When you go to the FTP site at
    `ftp://ftp.kde.org`, you''ll see the traditional file folder organization. Search
    for programs in either the stable or unstable folder.


    Stability is determined by the program''s author, not by the KDE project. A *stable
    program* is one the author claims works and installs well with KDE 1.0 (or any
    KDE 1.* release). An *unstable program*, which is usually a beta version, may
    not work well or may crash KDE. Then again, it may not. You must decide whether
    to take that risk. (Note that files in the stable directory are not guaranteed
    against crashing.)


    # ## Getting your news fix


    In need of the latest KDE news? Head to `www.kde.org/news_dyn.html` or just click
    one of the News links on the main KDE page. The news is archived by month; each
    month''s updates are on one page, so you can scroll through 30 days of information
    with one click.


    One really useful touch is that the news wranglers post regular updates on new
    programs and applications that have been submitted to the download archives. You
    can also read updates on new releases of KDE itself, notices of awards, links
    to articles about KDE, and information about new books — like this one! If you
    have a news item to submit, e-mail it to the Webmaster.


    # ## Como se Dice KDE in Italiano?


    Because KDE is an international project, it''s not too surprising that KDE documentation
    is available in many languages. We provide links to some non-English Web pages
    that are recommended by other KDE users. (You may need to install certain fonts
    in order to view pages written in non-Roman characters.) The home for non-English
    information is `www.kde.org/international.` Table B-1 lists the URLs for KDE resources
    in languages other than English.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_350_0.png)


    Do you speak English, another language, and KDE? If so, consider volunteering
    your expertise as a KDE project translator. Program documentation, general information,
    and news items all need translation into as many languages as possible, so that
    the reach KDE has is as global as are its users.


