- pgno: 31
  md: '# In this part . . .


    As with any newfangled gadget (or, for that matter, any oldfangled gadget you’re
    just starting to use), KDE takes a bit of orientation and practice. Fortunately,
    if you’re familiar with Macintosh or Windows computers, you already know how a
    graphical user interface can make a computer a whole lot less agonizing to use
    — provided you know your way around.


    This part stands proudly and nonchalantly on Square One, ready to show you the
    ropes. It takes you through the basic KDE operations, shows you what does what
    on the desktop, and gets you to managing windows and files with the best of ''em.
    It’s amazing how much more sense it all makes when you’ve got the basics down.
    But you knew that.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# # Chapter 1

    ## Getting Your Hands Dirty


    # **In This Chapter**


    +   - Defining KDE

    +   - Understanding basic skills: window functions, KDE mouse tricks, and more

    +   - Starting KDE

    +   - Touring the desktop

    +   - Getting to know the icons

    +   - Hanging out at the (task) bar

    +   - I have *how many* desktops?

    +   - Exiting KDE


    If you live in a big city, you probably see tour buses once in a while. The people
    on these buses know that one of the best ways to get to know a place is to take
    a quick tour. On that tour, they see the most important aspects of the new city,
    and learn a bit about getting around. Later, if the tourists want to revisit or
    explore an area they saw from the bus''s window, they have a pretty good idea
    of where to go and what to do.


    This chapter is your KDE tour bus. We start with a brief introduction to KDE —
    what it is and what it does — and then take a spin through the basic functions
    you need in order to get the most from KDE. You tour the panel, taskbar, and icons,
    as well as practice getting into and out of KDE. After you''re done with this
    chapter, you''ll be able to get around your desktop with no problem, and you''ll
    be set for the more complicated stuff that you discover in the rest of the book.


    Try to read this chapter in front of your computer. You get the hang of KDE faster
    if you can look up from the page and see what we''re talking about. The pictures
    in the chapter are helpful, but you can figure out more if you click along with
    us.


    For those of you new to Linux and other UNIX-based operating systems, we recommend
    that you get a good book about your operating system. We provide enough Linux
    information to make using KDE simple, but Linux itself is'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # Part 1: Getting Started


    outside the scope of this book. If you''re used to Windows or Macintosh systems,
    and you just bought a Linux CD and installed a new operating system that uses
    KDE as its basic desktop, you may be looking for more specific information about
    your OS. In this book, we focus mostly on KDE. Sometimes we talk about the operating
    system underneath KDE, but only as it relates to the desktop environment. Two
    books that serve as a good starting point are UNIX For Dummies, 4th Edition by
    John Levine and Margaret Levine Young, and Linux For Dummies, 2nd Edition by Jon
    “maddog” Hall, both published by IDG Books Worldwide, Inc.


    If you''re familiar with Linux, but you''ve never used a graphical interface (or
    you''re just new to KDE), there''s helpful information here as well.


    # ## Ladies and Gentlemen: KDE!


    Okay, so you''re ready to go. You''ve installed a UNIX-based operating system
    on your computer, and you''re ready to jump into the wonderful world of open source
    software. But . . . hey! This is all command-line stuff. Didn''t the computing
    world get rid of command lines back in the ancient DOS ages?


    Well, sort of. But remember, UNIX-based operating systems are the heart and soul
    of geek culture. To hardcore tech-types, you have no reason to point and click
    at anything — the command line was even good enough for Bill Gates once upon a
    time, and it still works just fine, so why change it?


    But you are not necessarily a geek. You''re interested in the speed and power
    of open source software, sure, but not if the software is going to be harder to
    use and less easy to understand than what you used before. You want the combination
    of power and simplicity. KDE, my friend, is for you. KDE is a graphical user interface,
    or GUI (pronounced goey, just like caramel clusters). So are Windows and the Macintosh
    operating system. If you''ve used either Windows or the Mac OS in the last five
    or ten years — and who hasn''t, really? — you''re a GUI pro. Different kinds of
    GUIs work with the X Window System, and you''ve chosen KDE, which is one of the
    most reliable and fully-featured of the Linux GUIs available right now.


    KDE is one of three components that puts that friendly graphical look on top of
    the power of Linux or other UNIX-based operating systems.


    +   *   Linux is the first component, because it''s the operating system that
    makes the computer run.

    +   *   KDE is the final component, because it''s the specific GUI that you''ve
    chosen.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '+   The middle component is something called the X Window System.


    The X Window System, which is often just called X, is a set of programs that work
    with your operating system to translate UNIX commands into graphic images.


    X is incredibly complicated and not the sort of thing that you will need to mess
    with, probably ever. X is important to know about, though, if only to sound incredibly
    intelligent and thoroughly geeky at cocktail parties.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_34_0.png)


    Before we jump into action-packed touring, here’s what KDE is and is not:


    +   KDE is the interface between you and the computer. After you click an icon
    on the desktop, KDE sends a certain command to the operating system and the computer
    responds. You can use KDE to change the way your monitor displays information,
    and you can use various KDE tools to make your computer do what you want.


    +   KDE isn’t an operating system. You don’t have to use special KDE versions
    of your favorite programs, and KDE doesn’t change anything about the way your
    system runs. And, even though you can find desktop themes that make it look as
    if you’re running a Mac or a Windows 98 machine, you’re still running Linux or
    another UNIX-based operating system. KDE just puts a friendlier face on it.


    KDE stands for the K Desktop Environment. Really, The K doesn’t mean anything
    in particular.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_34_1.png)


    # Who’s in charge of KDE?


    KDE exists through the volunteer labor of hundreds of computer programmers around
    the world, who use the Internet to swap ideas and code that go into the program.
    KDE is an open source program, which means that the guts of the program are freely
    available for anyone to work with. (So is Linux.) One of the benefits of using
    open source software is that the software is subjected to tons of testing by actual
    users, not just by people paid to test the software — so, if you find a bug or
    you have a great idea for a future version of the software, you can send in your
    input. For those of you who have the sneaking idea that "free" doesn''t always
    equal "good," you can rest assured. KDE has even caught the eye of Ziff Davis,
    a major computer magazine publisher, who named KDE the "Innovation of the Year
    1998/1999" in the software category. You want to check in on www.kde.org regularly
    for news updates, new versions, and nifty programs to add to your computer.'
  merge: -1
  img_proc: true
- pgno: 35
  md: "# **Basic Skills: What You Already Know**\n\nBefore you get started with a\
    \ tour through KDE, we need to quickly mention basic computer skills. We’re assuming\
    \ that you’ve used a mouse and that you’ve used some sort of windowed desktop\
    \ environment before. Here’s a quick list of basic mouse moves that we assume\
    \ you already know.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_35_0.png)\n\n\
    +   - Moving the mouse on its mousepad moves the mouse pointer on your monitor\
    \ screen.  \n+   \n+   In KDE, the mouse pointer is a large X, rather than the\
    \ Mac or Windows arrow.\n+   \n+   - Clicking the left mouse button once *selects*\
    \ whatever item is underneath the mouse pointer on the screen. The selected file\
    \ or program hasn’t opened yet, but it’s next on deck. For example, you can select\
    \ an icon, a filename, or an option in a menu.\n+   \n+   - *Double-clicking*,\
    \ or clicking the left mouse button two times quickly, *chooses* the item under\
    \ the mouse pointer. When you choose an icon by double-clicking it, you’re telling\
    \ the computer to open this program right away. If you double-click a filename,\
    \ the computer knows that you want to open the file within the correct program,\
    \ and launches the program as well.\n+   \n+   - Clicking the right mouse button\
    \ once usually brings up a hidden menu with additional options. For example, if\
    \ you *right-click* the plain KDE desktop, a hidden menu pops up with options\
    \ including Logout, Help, Screenlock, and various ways to arrange open windows.\n\
    +   \n+   - Clicking a selected item once, holding the left mouse button down,\
    \ and moving the mouse across the pad, *drags* the selected item across the screen.\
    \ Releasing the left mouse button *drops* the item in its new location. You can\
    \ *drag and drop* icons, filenames, or almost anything you can select by clicking\
    \ or highlighting.\n+   \n+   - Clicking the left mouse button and holding the\
    \ button down, and then moving the mouse pointer across a certain portion of text,\
    \ *highlights* the selected text. If you’ve highlighted the wrong text, just click\
    \ the left mouse button outside the highlighted area to *deselect* it.\n+   \n\
    +   - Highlighting text allows you to do various things to the highlighted block\
    \ of text. You can *cut* the text, thus removing the entire block from the document.\
    \ Or you can *copy* the text, leaving one block in place, but making a copy that\
    \ you can place elsewhere. You can also *paste* the text into a new location after\
    \ you either copy or cut it.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_35_1.png)\n\
    \nIf you use a different kind of *pointing device* with your computer, such as\
    \ a trackball or an input tablet, you need to know how to do all these basic mouse\
    \ moves with your specific device. Most people a use mouse, so we use mouse-specific\
    \ terminology throughout the book."
  merge: -1
  img_proc: true
- pgno: 36
  md: 'And, here''s the information about desktops and windows we assume you know:


    +   * The colored background of the screen is the *desktop*. Like a regular desk''s
    top that you have in your office or at home, you can pile file folders and documents
    on top of it. Also, like a regular desk''s top, it can become a terrible mess.
    Graphical interfaces use the desktop concept to make it easier for you to remember
    how the computer''s organizational system works, because you automatically associate
    your computer desktop with your ordinary desk and how it works (or, at least,
    how it''s supposed to work).


    +   * After you open a program or a document, it appears within a *window* on
    the screen. The window is smaller than the entire screen, and can be resized.
    (For those burning with desire to resize windows, check out Chapter 3 — working
    with windows is slightly different in KDE than in other operating systems, but
    not much.)


    +   * A *program window* contains a program that you''ve started. This program
    can be a calculator, a spreadsheet, your e-mail, or a horrendous brain-eating
    program like solitaire. You can have multiple program windows open at the same
    time.


    +   * A *document window* contains a file that you''ve created in a certain program.
    The most common example is a text document that you''ve created in a word-processing
    program. It can also have multiple document windows open at the same time.


    +   * You can have more than one window open at a time. (This feature is what
    makes windowed desktop environments so much better than command-line interfaces.)
    The windows just pile up on the screen as you open them, overlapping, and sometimes
    hiding each other.


    +   * The window on the very top has the *focus*, which means that it''s the *active
    window*. You can tell the window has the focus because its *title bar* (that line
    along the top of the window with the name of the program or document) is highlighted.
    If you want a different window to have the focus, click its titlebar. The window
    comes to the front and assumes the focus.


    KDE has a couple of mouse tricks that make basic window management a bit faster,
    as well. Many items on the desktop, including the desktop itself, have *context
    menus* that you can access by clicking the right mouse button if the mouse cursor
    is over the item. The options on these menus change from item to item, which makes
    them *context-sensitive*.'
  merge: -1
  img_proc: true
- pgno: 37
  md: "# # Start It Up\n\nNow you can get started with your whirlwind tour through\
    \ KDE.\n\nWe're assuming that you've already located and installed KDE on your\
    \ system, or that it was pre-installed when you arrived at the machine; if you\
    \ haven't, jump to Appendix A to find out where to get KDE and information on\
    \ installing it. As soon as you've got KDE set up, come back and start here.\n\
    \nBe sure that you use KDE as a normal user on your system. When you installed\
    \ Linux, you should have created both user accounts and a special super-user account\
    \ called root. Don't log in as root just to play with KDE — save root for when\
    \ it's needed. The root account is the system administration account, and it has\
    \ the authority to change everything about the operating system — even the basic\
    \ processes that make the machine work. If you work with KDE in your user account,\
    \ you can't break anything critical. One of the great features of Linux and other\
    \ UNIX-based operating systems is that each user has a separate account with dedicated\
    \ disk space to work in, and those user spaces are separate from the programs\
    \ that really run the computer. If you're working in a user account, you really\
    \ have to try hard to do anything that permanently harms the computer. If you're\
    \ working as root, you can cause damage a lot more easily.\n\nYour machine probably\
    \ is turned on and waiting patiently for you at the login prompt. If not, go ahead\
    \ and boot up now.\n\n+   1.  **Log into your machine using your user account\
    \ name and password.**\n+   \n+   Depending on the Linux distribution you chose\
    \ while installing, or if you've already installed and configured KDE, you may\
    \ see a graphical login instead of a shell login prompt. A graphical login is\
    \ a more pleasing welcome from your computer than the white-on-black of a shell\
    \ prompt. If you'd like to set up a graphical login for your system, we explain\
    \ the procedure in Chapter 14. Log into a computer with a graphical login by typing\
    \ your user account name and password, and skip ahead to the \"Touring the Desktop\"\
    \ section.\n+   \n+   If you haven't yet configured your system to use KDE as\
    \ your default GUI, refer to Appendix D for more information on the usekde script.\
    \ This script copies some basic files, which KDE needs in order to run properly,\
    \ into your home directory.\n\n+   2.  **After you log in at the shell prompt,\
    \ type startx.**\n+   \n+   You use this command every time you want to open KDE.\
    \ The startx command actually starts up the X Window System, but after you run\
    \ the usekde script, you set X to run KDE as your default desktop environment.\
    \ You can actually configure X to run KDE automatically, every single time you\
    \ boot up the computer by changing a few lines of code deep in"
  merge: -1
  img_proc: true
- pgno: 38
  md: 'the guts of Linux. See Chapter 13 for a down and dirty discussion of run-level,
    or how your computer knows which programs to run first.


    A bunch of text scrolls up the screen, and then everything goes dark, (well, goes
    gray, but that doesn''t sound quite as dramatic). How long the screen stays dark
    depends on how much memory you''ve got installed in the computer. (Computer graphics,
    like employees, are easily cajoled into working faster and better if you throw
    money at them.)


    # 3. Wait for the KDE desktop to appear, as shown in Figure 1-1.


    If something went wrong in your KDE setup, or if you haven''t run the usekde script
    yet to tell the X Window System that you want KDE as your default desktop environment,
    you may get a surprise after typing startx. Instead of KDE, you may get another
    window manager, such as Fvwm. If this happens, just exit out of the graphical
    environment (try right-clicking on the desktop — an Exit or Logout command is
    often in the context menu). Then go back to Appendix A and reconfigure KDE.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_38_0.png)'
  merge: -1
