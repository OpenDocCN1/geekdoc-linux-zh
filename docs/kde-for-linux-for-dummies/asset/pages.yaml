    # More keyboard options


    KDE enables you to configure a couple of other keyboard options. In the KDE Control
    Center window, select Keyboard under the Input Devices heading in the list on
    the left side of the window to display the Keyboard tab. The Keyboard tab offers
    the following options:


    +   - **Keyboard Repeat**: Select On or Off to automatically enable or disable
    repeated keystrokes after you press and hold a key.

    +   - **Key Click Volume**: Drag the slider to the right to increase the volume
    of a clicking sound KDE generates each time you press a key. To disable the key
    click sound, drag the slider all the way to the left.


    # Mouse maneuvers


    KDE also supports a couple of options to control behavior of your mouse in the
    KDE environment. Like so many other configuration options, you edit the mouse
    settings in the KDE Control Center window. Select Mouse under the Input Devices
    heading in the list on the left side the window to display the Mouse tab. You
    can adjust the following settings:


    +   - **Acceleration**: Drag the slider to the right to increase the speed and
    distance the pointer moves in response to a rapid movement of the mouse.

    +   - **Threshold**: Drag the slider to the right to increase the zone in which
    you can make mouse movements without engaging the acceleration feature.

    +   - **Button Mapping**: Select Right Handed or Left Handed. Right Handed button
    mapping is the standard configuration in which the left mouse button is designated
    for the main selection and dragging operations and the right button activates
    context menus and the like. Left Handed button mapping transposes those button
    assignments.'
  merge: -1
  img_proc: true
- pgno: 142
  md: "# Chapter 7\nHaving a Theme Party\n\n# In This Chapter\n\n+   ▸ Defining a\
    \ theme  \n+   ▸ Managing multiple themes  \n+   ▸ Finding famous themes online\
    \  \n+   ▸ Exploring themes for former Windows wonks  \n+   ▸ Creating themes\
    \ for former Mac maniacs  \n+   ▸ Devising themes for UNIX nerds  \n+   ▸ Doing\
    \ your own thing with themes\n\nHow would you like to be able to redecorate your\
    \ office instantly, any-time you want? Wouldn’t it be nice to change the wall\
    \ color, carpet, and furniture to fit your mood? That may not be practical in\
    \ real life, but you can certainly change the appearance of your KDE desktops\
    \ with a few mouse clicks.\n\nKDE is a highly customizable environment, and you\
    \ can change almost every visible element of the user interface, if you’re willing\
    \ to work at it. But changing one setting at a time can be tedious. Changing settings\
    \ is not difficult, but just time-consuming to work through the many settings\
    \ that affect the appearance of your desktop. That’s why KDE includes a feature,\
    \ called themes, which enables you to change the whole look of your desktop, all\
    \ at once.\n\n# What’s a Theme Anyway?\n\nA KDE theme is a collection of desktop\
    \ appearance settings that define a particular look for your KDE desktop. A theme\
    \ includes elements such as\n\n+   ▸ Desktop color and pattern  \n+   ▸ Desktop\
    \ icons  \n+   ▸ Sounds associated with system actions  \n+   ▸ Wallpaper"
  merge: -1
  img_proc: true
- pgno: 143
  md: '+   - Window border and buttons

    +   - Window and title bar colors and background


    For example, the Astronique theme, shown in Figure 7-1, is quite a departure from
    the appearance of the default KDE desktop.


    # Figure 7-1:

    Applying a theme often results in wholesale changes to your KDE desktop.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_143_0.png)


    Many of the settings contained in a KDE theme are the same settings you can change
    individually in the Display Settings dialog box, with the options available on
    the KDE Menu→Settings menu, or in the KDE Control Center. (Refer to Chapters 5
    and 6 for more information about changing colors and other desktop appearance
    settings.) A theme pulls all the different settings together into a single configuration
    file for easy organization and ready access. The advantage of using a theme is
    that you can select and apply a bunch of different settings all at once instead
    of having to work through several tabs and dialog boxes to access all the relevant
    settings.


    In addition to the standard color and wallpaper settings that you can easily change
    with dialog box settings, a theme can also replace the standard KDE window borders
    and toolbar buttons with customized versions. The average user would have a hard
    time customizing borders and buttons this way without using themes. Manually locating
    and editing the files KDE uses to construct window borders and buttons isn’t a
    simple task — such tinkering is best left to those who can afford to spend hours
    messing around with the innards of their computer system software. On the other
    hand, after some enterprising experimenter creates a set of custom window borders
    and buttons, and records them in a theme, anyone can use the theme to quickly
    and easily customize the look of their KDE windows.


    A KDE theme is a compressed archive file containing the following component files:


    +   - The theme configuration file — a text-based file containing a list of color
    settings and other configuration information

    +   - A preview image — a screen shot of the KDE desktop with the theme applied'
  merge: -1
  img_proc: true
- pgno: 144
  md: '+   - Wallpaper image files

    +   - Icon image files for toolbar buttons and desktop icons

    +   - Other image files for window borders, titlebars, and panel backgrounds

    +   - Sound files for system sounds


    Required elements in a KDE theme are the theme configuration file and a preview
    image. The theme configuration file, with a name such as *themeName.themerc*,
    is the heart of a KDE theme. The file contains all the color settings and other
    configuration settings that the theme can change. The *preview image* is what
    the KDE Theme Manager utility uses to show what the theme looks like. The various
    image files and sound files are optional—these files may, or may not, be included
    in a given theme, depending on whether the theme''s configuration file needs to
    reference those files as custom alternatives for the standard KDE user interface
    elements.


    # Using the Theme Manager


    Applying a theme to your KDE desktop used to require copying an assortment of
    files to various directories and then hand-editing several obscure configuration
    files to substitute the theme settings for the KDE defaults. That was quite a
    chore, which relegated themes to the realm of the GUI hackers. But no more! The
    KDE Theme Manager automates the process of applying themes so that you can change
    themes quickly and easily — a few mouse clicks is all you do.


    The KDE Theme Manager is a new addition to KDE 1.1.2. The KDE Theme Manager is
    a special utility that is fully integrated into KDE and enables you to select
    a theme, see a preview of the selected theme, and apply all or part of the theme
    to your KDE desktop. The KDE Theme manager makes working with themes as simple
    and convenient as changing your desktop wallpaper. Now you can have fun customizing
    your KDE desktop — even if you''re not a GUI geek.


    # Applying a complete theme with Theme Manager


    To use KDE Theme Manager to apply a theme to your KDE desktop, follow these simple
    steps:'
  merge: -1
  img_proc: true
