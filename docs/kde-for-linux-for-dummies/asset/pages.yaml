  md: '# Chapter 15


    # Ten Things I Wish Someone Had Told Us


    # In This Chapter


    +   - Expanding your mind

    +   - Organizing your desktops

    +   - Minding your Ps and Qs


    As a KDE user, you''ll want to look like a pro. So do this stuff.


    # Resolve to Increase Resolution


    KDE is compatible with any video resolution supported by the combination of your
    graphics card, monitor, and X Window System drivers. However, although you can
    use KDE at 640 × 480 resolution, KDE really works best on a higher-resolution
    display.


    To get the most from KDE, you need enough on-screen space available for the KDE
    panel and taskbar, plus room to spread out multiple windows. As a result, you''ll
    probably be happier running KDE at 1024 × 768 or higher resolution, as shown in
    Figure 15-1. Of course, running KDE at this resolution requires a good-sized monitor
    (at least a 17-inch, preferably a 19-inch or larger) in order to produce text
    and icons of a legible size. If your video card and monitor won''t support a high-resolution
    display, it may be time to consider an upgrade.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_301_0.png)


    **Figure 15-1:**

    KDE running at 1024 x 768 resolution.


    Many KDE dialog boxes and default windows are sized to fit comfortably on the
    desktop when KDE is operating on a high-resolution monitor. Running KDE at 640
    x 480 or 800 x 600 resolution means that those dialog boxes and windows are too
    big to fit on the desktop (see Figure 15-2). As a result, some of the options
    and buttons may be inaccessible unless you move the dialog box.


    Of course, video resolution isn’t something you can set or control from within
    KDE. You need to configure X to run at the desired resolution before starting
    KDE. You may need to use a utility such as Xconfigurator to change your X settings.
    (Refer to a good book on Linux or X Window System for instructions on configuring
    X).


    ![](img/8dd43d91b80664e771e0c0a824d7392d_301_1.png)


    TECHNICAL STUFF

    Most of the figures in this book were captured from a system running KDE at 800
    x 600 resolution. We chose this resolution for its capability to produce readable
    figures. Using this resolution isn’t preferable if we are actually working with
    KDE.'
