- pgno: 93
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_93_0.png)


    # Figure 4-6: Thumbnails enable you to preview image files.


    The Show Thumbnails option works only with the large icons in Icon View, not the
    small icons in Long View or Short View. The small icons in the other views are
    too small to make useful preview images anyway. Also, before KFM can display a
    thumbnail preview, the image must be in a file format KFM can display at the appropriate
    size for an icon. If KFM can''t display a file''s image format (or can''t adjust
    the image to icon size), the program displays the generic file icon for the file
    type instead of a thumbnail image.


    # *Revealing hidden files*


    When you view the contents of a directory in KFM, typically you see only a portion
    of the files and subdirectories stored there. In addition to the files you see
    in the normal directory listing, some directories contain many more files and
    subdirectories that remain invisible — hidden from view.


    On a UNIX-style operating system, file and directory names that start with a period
    are omitted from normal directory listings. As a result, these files are effectively
    hidden. Often configuration files and other system files or directories are hidden
    in this way, especially when stored in the same directories as documents and other
    files that a user routinely accesses. Although hiding files can enhance security
    somewhat, the real purpose of hidden files isn''t to keep those files secret.
    Hiding configuration and system files simply reduces the on-screen clutter in
    your directories so you don''t have to look through a bunch of seldom-used configuration
    files in order to locate your programs and documents.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'KFM normally keeps hidden files out of sight and doesn''t display the file-names
    or icons for hidden files or directories in the main KFM window or in the tree
    panel. However, *if* you need access to those hidden files, you can choose **View
    > Show Hidden Files** to force KFM to reveal all. When you enable the **Show Hidden
    Files** option, KFM displays *all* the files and subdirectories in the current
    directory, including the “dot’’ files. Previously hidden directories also become
    visible in the directory tree panel if it is active. Figure 4-7 shows a KFM window
    with hidden files visible. Compare it to Figure 4-5, which shows the normal view
    of the same directory.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_94_0.png)


    # Peeking inside archive files


    Traditionally, backup copies of files are stored in the UNIX tape archive (`.tar`)
    or compressed tape archive (`.tar.gz`) formats, which condense the data and file
    descriptions from multiple original files into each archive file. But archive
    files aren''t just for backups any more. Archives and compressed archives are
    also used for other purposes such as packaging all the files for a program installation
    into a single *tarball* (geek jargon for a `.tar` archive file) for distribution.
    KDE themes are distributed as compressed archives. And just about anything you
    download over the Internet is likely to be in a compressed archive as well.'
  merge: -1
  img_proc: true
- pgno: 95
  md: "# **TECHNICAL STUFF**\n\nOf course, you need a special utility program to create\
    \ an archive file. The most common command-line utility is named, appropriately\
    \ enough, `tar`. A KDE utility — Archiver — provides a graphical tool for creating\
    \ archive files. You can use these same tools to view the contents of archive\
    \ files and extract component files from the archive and restore them to separate,\
    \ individual files that you can then use just like a copy of the original.\n\n\
    However, you don't have to resort to using separate utilities to work with archive\
    \ files. KFM can do the job. Here's how:\n\n+   1. **Click an archive file (with\
    \ the `.tar` or `.tar.gz` extension) in a KFM window.**\n+   \n+   KFM opens the\
    \ file and displays its contents in the KFM window. It's just like opening a folder.\
    \ In fact, KFM normally displays the contents of the archive as a single folder.\n\
    \n+   2. **Click the folder icon.**\n+   \n+   KFM displays a list of the files\
    \ and subfolders contained within the archive. Figure 4-8 shows an example of\
    \ KFM displaying the contents of a compressed archive file — in this case, a theme.\
    \ Note the path name in the location bar. The part following the `#` character\
    \ is within the archive file.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_95_0.png)\n\
    \n+   3. **Click or drag individual files to open or copy them.**\n+   \n+   You\
    \ can do pretty much anything with the files within the archive that you can do\
    \ with files in a regular folder. You can open most documents and you can copy\
    \ files from the KFM window to other locations. The"
  merge: -1
