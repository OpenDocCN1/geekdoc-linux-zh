  md: '121


    # Picking and choosing theme elements


    Just because a theme can give your desktop a complete makeover, complete with
    colors, wallpaper, window borders, titlebar buttons, and the lot, you don''t have
    to adopt the entire theme for your desktop. Perhaps you really like the color
    scheme and window borders in a particular theme, but don''t care for the titlebar
    buttons and wallpaper that are included in that theme. Perhaps you prefer the
    titlebar buttons from a different theme and the wallpaper from yet another theme.


    Fortunately, using a theme is not an all-or-nothing deal. Theme Manager enables
    you to selectively apply parts of a theme to your desktop. As a result, you can
    pick and choose elements of several different themes to build your own custom
    desktop environment. To apply some parts of a theme (and not others) to your desktop,
    follow these steps:


    +   1. **Click the KDE Menu button and then choose Settings▸Desktop▸Theme Manager.**


    KDE opens the KDE Theme Manager dialog box.


    +   2. **Click a theme name in the list box on the Installer tab.**


    Select a theme that includes one or more elements that you want to apply to your
    desktop. Examine the preview image of the selected theme and note the theme elements,
    such as the colors, wallpaper, or window borders, that you want to use and those
    elements that you don''t want to apply to your desktop.


    +   3. **Click the Contents tab.**


    The Contents tab of the Theme Manager dialog box appears as shown in Figure 7-3.
    This tab of the dialog box lists all the components of a theme and shows which
    components are available in the selected theme.


    Not all themes include settings and source files for all the desktop elements.
    If the selected theme includes a given component (such as *Wallpapers* or *Window
    Border*), the status column on the right indicates that the option is *available*.
    If the selected theme doesn''t include a component, the status column shows that
    the option is *empty*.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_146_0.png)


    +   4. **Click the checkboxes to select the theme elements you want to apply to
    your desktop.**


    A check mark beside an option indicates that Theme Manager will install that part
    of the theme on your desktop (provided, of course, that the component is available
    in selected theme). Clicking a checkbox toggles the check mark on and off. You
    can select any combination of theme components you desire.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_147_0.png)


    To select just one or two options, first click the Clear button to remove the
    check marks from all the checkboxes and then click the individual checkboxes for
    the options you want. Clicking the Clear button avoids the need to click numerous
    checkboxes to un-select those options.


    +   5. **Click Apply.**

    +   Theme Manager applies the selected parts of the selected theme to your desktop.
    All other aspects of your desktop remain unchanged. For example, if you select
    just Colors and Wallpapers on the Contents tab, Theme Manager changes your desktop
    color scheme and wallpaper without affecting your window borders, sounds, titlebar
    buttons, and so on. The Theme Manager dialog box remains open.


    +   6. **To select and apply other theme elements, repeat Steps 2 through 5.**

    +   You can apply other elements from the same theme or select another theme and
    apply elements from a different theme. Continue the process until you achieve
    an effect you like.


    +   7. **Click OK.**

    +   KDE closes the Theme Manager dialog box.


    TIP: If all your experiments with themes get out of hand, you can easily return
    to the KDE default desktop settings. The KDE Theme Manager includes a theme named
    Default and a special button to make selecting the Default theme easy. To restore
    your KDE desktop to the default settings, just use Theme Manager to apply the
    Default theme (be sure to select and apply all the options on the Contents tab
    of the Theme Manager dialog box).'
  merge: -1
