  md: "+   Press Alt-F1 to open the KDE menu.\n+   Press the up and down arrow keys\
    \ to move the highlight to the menu item you want.\n+   Press the right arrow\
    \ key to open a submenu if the highlighted menu item has one.\n+   The up and\
    \ down arrow keys work in the submenus, too.\n+   Press Enter to select the highlighted\
    \ menu item, which is the equivalent of clicking the menu item to choose it. KDE\
    \ launches the selected program.\n\n# What Desktop Am I Using?\n\nVirtual desktops\
    \ are a great innovation, but they can be confusing, too. Sometimes it's hard\
    \ to tell which of the virtual desktops you're currently using.\n\nGetting disoriented\
    \ is particularly easy if you engage the magic borders feature, which enables\
    \ you to switch desktops by simply moving the mouse pointer to the edge of the\
    \ screen. Magic borders make switching desktops fast and easy — sometimes too\
    \ easy. A slip of the mouse can switch desktops by accident. The switch happens\
    \ in the blink of an eye. If KDE unexpectedly switches to an empty desktop, you\
    \ may think the program windows you were using on the other desktop suddenly disappeared.\n\
    \nOf course, you can always tell which virtual desktop is active by checking the\
    \ desktop pager buttons in the KDE panel. The button that looks depressed indicates\
    \ the active desktop. To select a different desktop, simply click the corresponding\
    \ pager button.\n\nAnother good way to help keep track of your virtual desktops\
    \ is to color-code each desktop with a different background color or wallpaper.\
    \ To configure your virtual desktops with distinctive colors, follow these steps:\n\
    \n+   1. **Right-click the desktop and choose Display Properties from the pop-up\
    \ menu that appears.**\n+   KDE opens the Display Settings dialog box and displays\
    \ the settings on the Background tab, as shown in Figure 15-3.\n+   \n+   2. **Deselect\
    \ the Common Background checkbox in the Desktop area.**\n+   This allows you to\
    \ set separate background treatments for each of the virtual desktops. If the\
    \ Common Background option is selected, all your virtual desktops will look the\
    \ same."
  merge: -1
  img_proc: true
- pgno: 307
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_307_0.png)


    > **Figure 15-3:**

    > You can configure each virtual desktop separately.


    +   3. Select a desktop name in the Desktop list box.


    The remainder of the settings on the Background tab apply to the selected desktop.


    +   4. Adjust the settings in the Colors and Wallpaper areas as needed.


    See Chapter 6 for more details on setting desktop colors and wallpaper.


    +   5. Repeat Steps 3 and 4 for each of the other virtual desktops.


    The goal is to make it easy to identify which of your virtual desktops is active
    just by glancing at the desktop background, so pick colors or wallpapers that
    are distinctively different. No two virtual desktops should look the same.


    +   6. Click OK.


    KDE closes the Desktop Settings dialog box and applies the settings to your desktops.
    Try paging through each of the virtual desktops to see the different backgrounds.'
